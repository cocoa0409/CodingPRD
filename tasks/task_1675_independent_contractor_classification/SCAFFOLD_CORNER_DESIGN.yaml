# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml — §1.9 Coverage Index (non-Difficulty claims)
# Walks references/claim-extraction-guide.md against SCAFFOLD.yaml §1.1-§1.7.
# §1.8-covered corners appear as excluded_because stubs.
# =============================================================================
scaffold_corner_design:
  - section: entities
    instances:
      - name: entity_contractor_creation_defaults_and_system_fields
        claim_type: creation
        grounds: [entities.Contractor]
        distinguishing_aspect: "POST /api/contractors returns 201 with server-minted id, created_at, version == 1, and the three system-defaulted fields: verification_status UNVERIFIED, standing_status GOOD_STANDING, lifetime_reported_cents 0."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /api/contractors"
              payload: { legal_name: "Defaults LLC", entity_type: "SOLE_PROPRIETOR", ein: "12-1001675", insurance_coverage_cents: 250000 }
              as: EngagementManager
              captures: { con_id: $.data.id, con_v: $.data.version, verif: $.data.verification_status, standing: $.data.standing_status, lifetime: $.data.lifetime_reported_cents }
          assert:
            - "id present (server-minted UUID), version == 1, created_at/updated_at present"
            - "verification_status == UNVERIFIED, standing_status == GOOD_STANDING, lifetime_reported_cents == 0"
      - name: entity_engagement_missing_required_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.Engagement, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required input contractor_id yields ERR_INVALID_REQUEST (400) before any existence processing."
        test_recipe:
          setup: ["one jurisdiction exists"]
          setup_api_calls:
            - call: "POST /api/jurisdictions"
              payload: { code: "US-TX", test_type: "COMMON_LAW_WEIGHTED", employee_score_threshold: 0.60, state_filing_threshold_cents: 60000, max_active_exceptions: 5, min_insurance_cents: 100000 }
              as: PlatformAdmin
              captures: { jur_tx: $.data.id }
          trigger:
            - call: "POST /api/engagements"
              payload: { jurisdiction_id: "${jur_tx}", title: "Missing contractor", scope_description: "x", agreed_rate_cents: 10000, rate_unit: "HOURLY", start_date: "2026-02-01", end_date: "2026-12-31" }
              as: EngagementManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST, http 400"
      - name: entity_engagement_invalid_enum_returns_invalid_request
        claim_type: type_constraints
        grounds: [entities.Engagement.fields.rate_unit, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "rate_unit outside {HOURLY, DAILY, PROJECT} is rejected with ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["jurisdiction + contractor exist"]
          setup_api_calls:
            - call: "POST /api/jurisdictions"
              payload: { code: "US-TX", test_type: "COMMON_LAW_WEIGHTED", employee_score_threshold: 0.60, state_filing_threshold_cents: 60000, max_active_exceptions: 5, min_insurance_cents: 100000 }
              as: PlatformAdmin
              captures: { jur_tx: $.data.id }
            - call: "POST /api/contractors"
              payload: { legal_name: "Enum LLC", entity_type: "LLC", ein: "12-1001676", insurance_coverage_cents: 250000 }
              as: EngagementManager
              captures: { con_id: $.data.id }
          trigger:
            - call: "POST /api/engagements"
              payload: { contractor_id: "${con_id}", jurisdiction_id: "${jur_tx}", title: "Bad enum", scope_description: "x", agreed_rate_cents: 10000, rate_unit: "WEEKLY", start_date: "2026-02-01", end_date: "2026-12-31" }
              as: EngagementManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST, http 400"
      - name: entity_computed_field_input_ignored
        claim_type: computed_fields
        grounds: [entities.Engagement.fields.scope_creep_index]
        distinguishing_aspect: "Client-supplied scope_creep_index is ignored on create; the server computes 0 for a fresh DRAFT engagement."
        test_recipe:
          setup: ["jurisdiction + contractor exist"]
          setup_api_calls:
            - call: "POST /api/jurisdictions"
              payload: { code: "US-TX", test_type: "COMMON_LAW_WEIGHTED", employee_score_threshold: 0.60, state_filing_threshold_cents: 60000, max_active_exceptions: 5, min_insurance_cents: 100000 }
              as: PlatformAdmin
              captures: { jur_tx: $.data.id }
            - call: "POST /api/contractors"
              payload: { legal_name: "Computed LLC", entity_type: "LLC", ein: "12-1001677", insurance_coverage_cents: 250000 }
              as: EngagementManager
              captures: { con_id: $.data.id }
          trigger:
            - call: "POST /api/engagements"
              payload: { contractor_id: "${con_id}", jurisdiction_id: "${jur_tx}", title: "Computed ignored", scope_description: "x", agreed_rate_cents: 10000, rate_unit: "HOURLY", start_date: "2026-02-01", end_date: "2026-12-31", supervision_level: "NONE" }
              as: EngagementManager
              captures: { eng_id: $.data.id, creep: $.data.scope_creep_index, tier: $.data.scope_creep_tier, risk: $.data.risk_tier }
          assert:
            - "scope_creep_index == 0 and scope_creep_tier == LOW on creation regardless of any client hint"
            - "risk_tier == null before the first determination (CLASSIFIED gate)"
      - name: entity_contractor_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_CONTRACTOR_NOT_FOUND]"]
        distinguishing_aspect: "Engagement create referencing a non-existent contractor_id fails existence with ERR_CONTRACTOR_NOT_FOUND (404)."
        test_recipe:
          setup: ["jurisdiction exists"]
          setup_api_calls:
            - call: "POST /api/jurisdictions"
              payload: { code: "US-TX", test_type: "COMMON_LAW_WEIGHTED", employee_score_threshold: 0.60, state_filing_threshold_cents: 60000, max_active_exceptions: 5, min_insurance_cents: 100000 }
              as: PlatformAdmin
              captures: { jur_tx: $.data.id }
          trigger:
            - call: "POST /api/engagements"
              payload: { contractor_id: "00000000-0000-0000-0000-000000000000", jurisdiction_id: "${jur_tx}", title: "Ghost", scope_description: "x", agreed_rate_cents: 10000, rate_unit: "HOURLY", start_date: "2026-02-01", end_date: "2026-12-31" }
              as: EngagementManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_CONTRACTOR_NOT_FOUND, http 404"

  - section: state_machines
    instances:
      - name: sm_terminal_engagement_rejects_submit_review
        claim_type: invalid_transition
        grounds: [state_machines.Engagement, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Terminal lockdown: a TERMINATED engagement rejects submit-review with ERR_INVALID_STATE and fires no side effects."
        test_recipe:
          setup:
            - "STANDARD engagement driven to ACTIVE then TERMINATED (full chain)"
          setup_api_calls:
            - call: "POST /api/jurisdictions"
              payload: { code: "US-TX", test_type: "COMMON_LAW_WEIGHTED", employee_score_threshold: 0.60, state_filing_threshold_cents: 60000, max_active_exceptions: 5, min_insurance_cents: 100000 }
              as: PlatformAdmin
              captures: { jur_tx: $.data.id }
            - call: "POST /api/contractors"
              payload: { legal_name: "Terminal LLC", entity_type: "LLC", ein: "12-1001678", insurance_coverage_cents: 500000 }
              as: EngagementManager
              captures: { con_id: $.data.id }
            - call: "POST /api/engagements"
              payload: { contractor_id: "${con_id}", jurisdiction_id: "${jur_tx}", title: "Terminal subject", scope_description: "x", agreed_rate_cents: 10000, rate_unit: "HOURLY", start_date: "2026-02-01", end_date: "2026-12-31", supervision_level: "NONE" }
              as: EngagementManager
              captures: { eng_id: $.data.id }
            - call: "POST /api/engagements/${eng_id}/questionnaire"
              payload: { answers: [ { factor_key: "CONTROL_METHOD", answer: "NO" }, { factor_key: "CONTROL_HOURS", answer: "NO" }, { factor_key: "OUTSIDE_USUAL_BUSINESS", answer: "YES" }, { factor_key: "INDEPENDENT_TRADE", answer: "YES" }, { factor_key: "PROFIT_LOSS", answer: "YES" }, { factor_key: "INVESTMENT", answer: "YES" }, { factor_key: "INTEGRAL_TO_BUSINESS", answer: "NO" }, { factor_key: "PERMANENCY", answer: "NO" } ] }
              as: EngagementManager
            - call: "GET /api/engagements/${eng_id}"
              as: PlatformAdmin
              captures: { eng_v: $.data.version }
            - call: "POST /api/engagements/${eng_id}/determinations"
              payload: { expected_engagement_version: "${eng_v}" }
              as: ClassificationAnalyst
            - call: "POST /api/engagements/${eng_id}/submit-review"
              payload: {}
              as: EngagementManager
            - call: "POST /api/engagements/${eng_id}/submit-approval"
              payload: {}
              as: ClassificationAnalyst
            - call: "POST /api/engagements/${eng_id}/approve"
              payload: {}
              as: HRApprover
              as_user_id: "hr-001"
            - call: "POST /api/contractors/${con_id}/verify"
              payload: { outcome: "VERIFIED" }
              as: ComplianceOfficer
            - call: "POST /api/engagements/${eng_id}/contracts"
              payload: { start_date: "2026-02-01", end_date: "2026-12-31", rate_cents: 10000, rate_unit: "HOURLY" }
              as: EngagementManager
              captures: { ctr_id: $.data.id }
            - call: "POST /api/contracts/${ctr_id}/execute"
              payload: {}
              as: EngagementManager
            - call: "POST /api/engagements/${eng_id}/activate"
              payload: {}
              as: EngagementManager
            - call: "POST /api/engagements/${eng_id}/terminate"
              payload: {}
              as: ComplianceOfficer
          trigger:
            - call: "POST /api/engagements/${eng_id}/submit-review"
              payload: {}
              as: EngagementManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (409); Engagement remains TERMINATED; contract remains TERMINATED (no cascade re-fires)"
      - name: sm_review_loop_cycle_and_stale_determination
        claim_type: valid_transition
        grounds: [state_machines.Engagement.UNDER_REVIEW_to_INFO_REQUESTED, state_machines.Engagement.INFO_REQUESTED_to_UNDER_REVIEW, "errors[ERR_DETERMINATION_STALE]"]
        distinguishing_aspect: "The review loop cycles UNDER_REVIEW -> INFO_REQUESTED -> UNDER_REVIEW; the resubmit bumps questionnaire.revision to 2, making the revision-1 determination stale so submit-approval fails with ERR_DETERMINATION_STALE until re-run."
        test_recipe:
          setup: ["STANDARD engagement at UNDER_REVIEW (questionnaire revision 1, determination computed)"]
          setup_api_calls:
            - call: "POST /api/jurisdictions"
              payload: { code: "US-TX", test_type: "COMMON_LAW_WEIGHTED", employee_score_threshold: 0.60, state_filing_threshold_cents: 60000, max_active_exceptions: 5, min_insurance_cents: 100000 }
              as: PlatformAdmin
              captures: { jur_tx: $.data.id }
            - call: "POST /api/contractors"
              payload: { legal_name: "Loop LLC", entity_type: "LLC", ein: "12-1001679", insurance_coverage_cents: 500000 }
              as: EngagementManager
              captures: { con_id: $.data.id }
            - call: "POST /api/engagements"
              payload: { contractor_id: "${con_id}", jurisdiction_id: "${jur_tx}", title: "Loop subject", scope_description: "x", agreed_rate_cents: 10000, rate_unit: "HOURLY", start_date: "2026-02-01", end_date: "2026-12-31", supervision_level: "NONE" }
              as: EngagementManager
              captures: { eng_id: $.data.id }
            - call: "POST /api/engagements/${eng_id}/questionnaire"
              payload: { answers: [ { factor_key: "CONTROL_METHOD", answer: "NO" }, { factor_key: "CONTROL_HOURS", answer: "NO" }, { factor_key: "OUTSIDE_USUAL_BUSINESS", answer: "YES" }, { factor_key: "INDEPENDENT_TRADE", answer: "YES" }, { factor_key: "PROFIT_LOSS", answer: "YES" }, { factor_key: "INVESTMENT", answer: "YES" }, { factor_key: "INTEGRAL_TO_BUSINESS", answer: "NO" }, { factor_key: "PERMANENCY", answer: "NO" } ] }
              as: EngagementManager
            - call: "GET /api/engagements/${eng_id}"
              as: PlatformAdmin
              captures: { eng_v: $.data.version }
            - call: "POST /api/engagements/${eng_id}/determinations"
              payload: { expected_engagement_version: "${eng_v}" }
              as: ClassificationAnalyst
            - call: "POST /api/engagements/${eng_id}/submit-review"
              payload: {}
              as: EngagementManager
          trigger:
            - call: "POST /api/engagements/${eng_id}/request-info"
              payload: { reason: "Clarify control method" }
              as: ClassificationAnalyst
              captures: { st_info: $.data.status }
            - call: "POST /api/engagements/${eng_id}/questionnaire"
              payload: { answers: [ { factor_key: "CONTROL_METHOD", answer: "NO" }, { factor_key: "CONTROL_HOURS", answer: "NO" }, { factor_key: "OUTSIDE_USUAL_BUSINESS", answer: "YES" }, { factor_key: "INDEPENDENT_TRADE", answer: "YES" }, { factor_key: "PROFIT_LOSS", answer: "YES" }, { factor_key: "INVESTMENT", answer: "YES" }, { factor_key: "INTEGRAL_TO_BUSINESS", answer: "NO" }, { factor_key: "PERMANENCY", answer: "YES" } ] }
              as: EngagementManager
              captures: { q_rev: $.data.revision }
            - call: "GET /api/engagements/${eng_id}"
              as: PlatformAdmin
              captures: { st_back: $.data.status, eng_v2: $.data.version }
            - call: "POST /api/engagements/${eng_id}/submit-approval"
              payload: {}
              as: ClassificationAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "request-info moved engagement to INFO_REQUESTED"
            - "questionnaire resubmission moved it back to UNDER_REVIEW with revision == 2 (cycle completed)"
            - "submit-approval rejected with ERR_DETERMINATION_STALE (determination.questionnaire_revision 1 != 2)"
      - name: sm_activate_from_classified_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Engagement, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "activate is defined only from APPROVED; from CLASSIFIED it fails with ERR_INVALID_STATE even when an EXECUTED contract is impossible to have — the state gate fires first."
        test_recipe:
          setup: ["STANDARD engagement at CLASSIFIED"]
          setup_api_calls:
            - call: "POST /api/jurisdictions"
              payload: { code: "US-TX", test_type: "COMMON_LAW_WEIGHTED", employee_score_threshold: 0.60, state_filing_threshold_cents: 60000, max_active_exceptions: 5, min_insurance_cents: 100000 }
              as: PlatformAdmin
              captures: { jur_tx: $.data.id }
            - call: "POST /api/contractors"
              payload: { legal_name: "Early Activate LLC", entity_type: "LLC", ein: "12-1001680", insurance_coverage_cents: 500000 }
              as: EngagementManager
              captures: { con_id: $.data.id }
            - call: "POST /api/engagements"
              payload: { contractor_id: "${con_id}", jurisdiction_id: "${jur_tx}", title: "Early activate", scope_description: "x", agreed_rate_cents: 10000, rate_unit: "HOURLY", start_date: "2026-02-01", end_date: "2026-12-31", supervision_level: "NONE" }
              as: EngagementManager
              captures: { eng_id: $.data.id }
            - call: "POST /api/engagements/${eng_id}/questionnaire"
              payload: { answers: [ { factor_key: "CONTROL_METHOD", answer: "NO" }, { factor_key: "CONTROL_HOURS", answer: "NO" }, { factor_key: "OUTSIDE_USUAL_BUSINESS", answer: "YES" }, { factor_key: "INDEPENDENT_TRADE", answer: "YES" }, { factor_key: "PROFIT_LOSS", answer: "YES" }, { factor_key: "INVESTMENT", answer: "YES" }, { factor_key: "INTEGRAL_TO_BUSINESS", answer: "NO" }, { factor_key: "PERMANENCY", answer: "NO" } ] }
              as: EngagementManager
            - call: "GET /api/engagements/${eng_id}"
              as: PlatformAdmin
              captures: { eng_v: $.data.version }
            - call: "POST /api/engagements/${eng_id}/determinations"
              payload: { expected_engagement_version: "${eng_v}" }
              as: ClassificationAnalyst
          trigger:
            - call: "POST /api/engagements/${eng_id}/activate"
              payload: {}
              as: EngagementManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (409)"
      - name: sm_amendment_terminal_reject_lockdown
        claim_type: terminal_lockdown
        grounds: [state_machines.ContractAmendment]
        distinguishing_aspect: "A REJECTED amendment is terminal: a second approve call on it fails with ERR_INVALID_STATE."
        test_recipe:
          setup: ["STANDARD ACTIVE engagement, EXECUTED contract, one PROPOSED amendment"]
          setup_api_calls:
            - call: "POST /api/jurisdictions"
              payload: { code: "US-TX", test_type: "COMMON_LAW_WEIGHTED", employee_score_threshold: 0.60, state_filing_threshold_cents: 60000, max_active_exceptions: 5, min_insurance_cents: 100000 }
              as: PlatformAdmin
              captures: { jur_tx: $.data.id }
            - call: "POST /api/contractors"
              payload: { legal_name: "Amendment Lock LLC", entity_type: "LLC", ein: "12-1001681", insurance_coverage_cents: 500000 }
              as: EngagementManager
              captures: { con_id: $.data.id }
            - call: "POST /api/engagements"
              payload: { contractor_id: "${con_id}", jurisdiction_id: "${jur_tx}", title: "Amendment lock", scope_description: "x", agreed_rate_cents: 10000, rate_unit: "HOURLY", start_date: "2026-02-01", end_date: "2026-12-31", supervision_level: "NONE" }
              as: EngagementManager
              captures: { eng_id: $.data.id }
            - call: "POST /api/engagements/${eng_id}/questionnaire"
              payload: { answers: [ { factor_key: "CONTROL_METHOD", answer: "NO" }, { factor_key: "CONTROL_HOURS", answer: "NO" }, { factor_key: "OUTSIDE_USUAL_BUSINESS", answer: "YES" }, { factor_key: "INDEPENDENT_TRADE", answer: "YES" }, { factor_key: "PROFIT_LOSS", answer: "YES" }, { factor_key: "INVESTMENT", answer: "YES" }, { factor_key: "INTEGRAL_TO_BUSINESS", answer: "NO" }, { factor_key: "PERMANENCY", answer: "NO" } ] }
              as: EngagementManager
            - call: "GET /api/engagements/${eng_id}"
              as: PlatformAdmin
              captures: { eng_v: $.data.version }
            - call: "POST /api/engagements/${eng_id}/determinations"
              payload: { expected_engagement_version: "${eng_v}" }
              as: ClassificationAnalyst
            - call: "POST /api/engagements/${eng_id}/submit-review"
              payload: {}
              as: EngagementManager
            - call: "POST /api/engagements/${eng_id}/submit-approval"
              payload: {}
              as: ClassificationAnalyst
            - call: "POST /api/engagements/${eng_id}/approve"
              payload: {}
              as: HRApprover
              as_user_id: "hr-001"
            - call: "POST /api/contractors/${con_id}/verify"
              payload: { outcome: "VERIFIED" }
              as: ComplianceOfficer
            - call: "POST /api/engagements/${eng_id}/contracts"
              payload: { start_date: "2026-02-01", end_date: "2026-12-31", rate_cents: 10000, rate_unit: "HOURLY" }
              as: EngagementManager
              captures: { ctr_id: $.data.id }
            - call: "POST /api/contracts/${ctr_id}/execute"
              payload: {}
              as: EngagementManager
            - call: "GET /api/contracts/${ctr_id}"
              as: PlatformAdmin
              captures: { ctr_v: $.data.version }
            - call: "POST /api/contracts/${ctr_id}/amendments"
              payload: { expected_contract_version: "${ctr_v}", scope_change_summary: "Add reporting package", new_rate_cents: 10500 }
              as: EngagementManager
              captures: { am_id: $.data.id }
          trigger:
            - call: "POST /api/amendments/${am_id}/approve"
              payload: { decision: "REJECTED" }
              as: LegalApprover
              captures: { am_st: $.data.status }
            - call: "POST /api/amendments/${am_id}/approve"
              payload: { decision: "APPROVED" }
              as: LegalApprover
              captures: { err: $.data.error_id }
          assert:
            - "first decision REJECTED moves amendment to terminal REJECTED"
            - "second approve fails ERR_INVALID_STATE; contract rate_cents unchanged at 10000"
      - name: sm_inquiry_escalation_creates_fieldwork_audit
        claim_type: side_effect
        grounds: [state_machines.AgencyInquiry.RESPONSE_SUBMITTED_to_AUDIT_OPENED]
        distinguishing_aspect: "Resolving with ESCALATE_TO_AUDIT moves the inquiry to AUDIT_OPENED and creates a FIELDWORK RiskAudit (status OPEN) on the same contractor+engagement, discoverable via GET /api/audits?engagement_id."
        test_recipe:
          setup: ["engagement (DRAFT) with a RECEIVED inquiry; response submitted within deadline"]
          setup_api_calls:
            - call: "POST /api/jurisdictions"
              payload: { code: "US-CA", test_type: "ABC_TEST", state_filing_threshold_cents: 0, max_active_exceptions: 5, min_insurance_cents: 100000 }
              as: PlatformAdmin
              captures: { jur_ca: $.data.id }
            - call: "POST /api/contractors"
              payload: { legal_name: "Escalation LLC", entity_type: "LLC", ein: "12-1001682", insurance_coverage_cents: 500000 }
              as: EngagementManager
              captures: { con_id: $.data.id }
            - call: "POST /api/engagements"
              payload: { contractor_id: "${con_id}", jurisdiction_id: "${jur_ca}", title: "Escalation subject", scope_description: "x", agreed_rate_cents: 9000, rate_unit: "HOURLY", start_date: "2026-02-01", end_date: "2026-12-31", supervision_level: "NONE" }
              as: EngagementManager
              captures: { eng_id: $.data.id }
            - call: "POST /api/engagements/${eng_id}/inquiries"
              payload: { agency_type: "STATE_EDD", received_at: "2026-07-01T00:00:00Z", response_deadline: "2026-09-01T00:00:00Z", back_payments_cents: 2000000, quarters_outstanding: 1 }
              as: AgencyLiaison
              captures: { inq_id: $.data.id }
            - call: "POST /api/inquiries/${inq_id}/respond"
              payload: { response_summary: "Initial position letter" }
              as: AgencyLiaison
          trigger:
            - call: "POST /api/inquiries/${inq_id}/resolve"
              payload: { outcome: "ESCALATE_TO_AUDIT", new_response_deadline: "2026-12-01T00:00:00Z" }
              as: AgencyLiaison
              captures: { inq_st: $.data.status }
            - call: "GET /api/audits"
              payload: { engagement_id: "${eng_id}" }
              as: ComplianceOfficer
              captures: { audit0_type: "$.data[0].audit_type", audit0_status: "$.data[0].status" }
          assert:
            - "AgencyInquiry.status == AUDIT_OPENED and response_deadline replaced by 2026-12-01"
            - "GET /api/audits?engagement_id returns exactly 1 audit: audit_type FIELDWORK, status OPEN, contractor_id == ${con_id}"
      - name: sm_conversion_declined_leaves_engagement_active
        claim_type: side_effect
        grounds: [state_machines.ConversionCase.OFFER_EXTENDED_to_DECLINED]
        distinguishing_aspect: "Fork divergence: DECLINED completes the case without the ACCEPTED cascade — engagement stays ACTIVE, contractor standing untouched."
        test_recipe:
          setup: ["ACTIVE STANDARD engagement with a conversion case OFFER_EXTENDED"]
          setup_api_calls:
            - call: "POST /api/jurisdictions"
              payload: { code: "US-TX", test_type: "COMMON_LAW_WEIGHTED", employee_score_threshold: 0.60, state_filing_threshold_cents: 60000, max_active_exceptions: 5, min_insurance_cents: 100000 }
              as: PlatformAdmin
              captures: { jur_tx: $.data.id }
            - call: "POST /api/contractors"
              payload: { legal_name: "Decliner LLC", entity_type: "LLC", ein: "12-1001683", insurance_coverage_cents: 500000 }
              as: EngagementManager
              captures: { con_id: $.data.id }
            - call: "POST /api/engagements"
              payload: { contractor_id: "${con_id}", jurisdiction_id: "${jur_tx}", title: "Decline subject", scope_description: "x", agreed_rate_cents: 10000, rate_unit: "HOURLY", start_date: "2026-02-01", end_date: "2026-12-31", supervision_level: "NONE" }
              as: EngagementManager
