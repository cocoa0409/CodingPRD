  # ------------------------------------------------------------- validations
  - section: validations
    instances:
      - name: occ_stale_version_on_consent_grant
        claim_type: occ_stale_version
        grounds:
          - "concurrency_rules[consent-grant-supersede-stale-version]"
          - "errors[ERR_STALE_VERSION]"
        distinguishing_aspect: "Second consent grant carrying the pre-first-grant membership version is rejected 412 ERR_STALE_VERSION; with the fresh version it succeeds (supersede semantics)."
        test_recipe:
          setup: ["member with ACTIVE term; team membership created (version v0)"]
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "v1@x.com", full_name: "V One" }
              as: Anonymous
              captures: { mv1: $.data.id }
            - call: "POST /members/${mv1}/terms"
              payload: { plan_name: "P", monthly_fee_cents: 3000, commitment_months: 12, hardware_tier: "BAND_STD", upgrade_eligibility_months: 6, pause_days_per_term: 30, cancel_fee_policy: "REMAINING_MONTHS", early_cancel_fee_floor_cents: 5000 }
              as: Member
              as_user_id: "${mv1}"
              captures: { tv1: $.data.id }
            - call: "POST /teams"
              payload: { name: "TV1", team_type: "SPORTS", coach_user_id: "coach-7" }
              as: Coach
              as_user_id: "coach-7"
              captures: { teamv1: $.data.id }
            - call: "POST /teams/${teamv1}/memberships"
              payload: { member_id: "${mv1}" }
              as: Coach
              as_user_id: "coach-7"
              captures: { tmv1: $.data.id, tmv1_v0: "$.data.version" }
          trigger:
            - call: "POST /team-memberships/${tmv1}/consents"
              payload: { scope: "STRAIN", action: "GRANT", expected_team_membership_version: "${tmv1_v0}" }
              as: Member
              as_user_id: "${mv1}"
              captures: { tmv1_v1: "$.data.version" }
            - call: "POST /team-memberships/${tmv1}/consents"
              payload: { scope: "SLEEP", action: "GRANT", expected_team_membership_version: "${tmv1_v0}" }
              as: Member
              as_user_id: "${mv1}"
              captures: { stale_err: "$.data.error_id" }
            - call: "POST /team-memberships/${tmv1}/consents"
              payload: { scope: "SLEEP", action: "GRANT", expected_team_membership_version: "${tmv1_v1}" }
              as: Member
              as_user_id: "${mv1}"
          assert:
            - "First grant succeeds (version v0 -> v0+1)"
            - "Second grant with stale v0: stale_err == ERR_STALE_VERSION, http 412"
            - "Third grant with fresh version succeeds; membership now has GRANTED entries for STRAIN and SLEEP"

      - name: occ_stale_version_on_term_upgrade
        claim_type: occ_stale_version
        grounds:
          - "concurrency_rules[term-upgrade-stale-version]"
          - "errors[ERR_STALE_VERSION]"
        distinguishing_aspect: "Upgrade with an outdated expected_term_version is rejected 412 even though eligibility holds; retrying with the current version succeeds."
        test_recipe:
          setup: ["member with ACTIVE term created 2026-09-01, upgrade_eligibility_months 0 (eligible immediately); term version captured, then a no-op mutation bumps the version via a successful pause+resume cycle"]
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "v2@x.com", full_name: "V Two" }
              as: Anonymous
              captures: { mv2: $.data.id }
            - call: "POST /members/${mv2}/terms"
              payload: { plan_name: "P", monthly_fee_cents: 3000, commitment_months: 12, hardware_tier: "BAND_STD", upgrade_eligibility_months: 0, pause_days_per_term: 10, cancel_fee_policy: "REMAINING_MONTHS", early_cancel_fee_floor_cents: 5000 }
              as: Member
              as_user_id: "${mv2}"
              captures: { tv2: $.data.id, tv2_v0: "$.data.version" }
            - call: "POST /terms/${tv2}/pause"
              payload: { start_on: "2026-09-01", days: 2 }
              as: Member
              as_user_id: "${mv2}"
          trigger:
            - call: "POST /terms/${tv2}/upgrade"
              payload: { expected_term_version: "${tv2_v0}" }
              as: Member
              as_user_id: "${mv2}"
              captures: { up_stale_err: "$.data.error_id" }
          assert:
            - "up_stale_err == ERR_STALE_VERSION (pause bumped the term version past the captured v0; eligibility is irrelevant to the OCC check)"

      - name: insufficient_wallet_rejected
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_INSUFFICIENT_WALLET_CREDIT]"
          - "validations[priority=11]"
        distinguishing_aspect: "Merch placement with total_cents > wallet_credit_cents is rejected 422 and wallet is unchanged."
        test_recipe:
          setup: ["member with ACTIVE BAND_STD term; wallet 0 (never funded)"]
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "v3@x.com", full_name: "V Three" }
              as: Anonymous
              captures: { mv3: $.data.id }
            - call: "POST /members/${mv3}/terms"
              payload: { plan_name: "P", monthly_fee_cents: 3000, commitment_months: 12, hardware_tier: "BAND_STD", upgrade_eligibility_months: 6, pause_days_per_term: 30, cancel_fee_policy: "REMAINING_MONTHS", early_cancel_fee_floor_cents: 5000 }
              as: Member
              as_user_id: "${mv3}"
          trigger:
            - call: "POST /members/${mv3}/merch-orders"
              payload: { lines: [ { sku: "B1", category: "BAND_ACCESSORY", unit_price_cents: 1000, qty: 1 } ] }
              as: Member
              as_user_id: "${mv3}"
              captures: { wallet_err: "$.data.error_id" }
          assert:
            - "wallet_err == ERR_INSUFFICIENT_WALLET_CREDIT"
            - "Member wallet still 0; no MerchOrder created (GET /members/${mv3}/merch-orders is empty)"

      - name: ingest_requires_active_device
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_DEVICE_NOT_ACTIVE]"
          - "state_machines.Device"
        distinguishing_aspect: "Ingest on a PROVISIONED (never activated) device is rejected ERR_DEVICE_NOT_ACTIVE."
        test_recipe:
          setup: ["member with ACTIVE term; device PROVISIONED"]
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "v4@x.com", full_name: "V Four" }
              as: Anonymous
              captures: { mv4: $.data.id }
            - call: "POST /members/${mv4}/terms"
              payload: { plan_name: "P", monthly_fee_cents: 3000, commitment_months: 12, hardware_tier: "BAND_STD", upgrade_eligibility_months: 6, pause_days_per_term: 30, cancel_fee_policy: "REMAINING_MONTHS", early_cancel_fee_floor_cents: 5000 }
              as: Member
              as_user_id: "${mv4}"
              captures: { tv4: $.data.id }
            - call: "POST /devices"
              payload: { member_id: "${mv4}", term_id: "${tv4}", serial_number: "SN-V4", hardware_tier: "BAND_STD" }
              as: PlatformAdmin
              captures: { dv4: $.data.id }
          trigger:
            - call: "POST /devices/${dv4}/ingest"
              payload: { day_on: "2026-09-01", avg_hr: 100, hrv_ms: 100, resting_hr: 50, sleep_minutes: 480 }
              as: Member
              as_user_id: "${mv4}"
              captures: { ing_err: "$.data.error_id" }
          assert:
            - "ing_err == ERR_DEVICE_NOT_ACTIVE"

      - name: active_term_uniqueness
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_ACTIVE_TERM_EXISTS]"
          - "validations[priority=10]"
        distinguishing_aspect: "Member with an ACTIVE term cannot start a second term: ERR_ACTIVE_TERM_EXISTS 422."
        test_recipe:
          setup: ["member with ACTIVE term"]
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "v5@x.com", full_name: "V Five" }
              as: Anonymous
              captures: { mv5: $.data.id }
            - call: "POST /members/${mv5}/terms"
              payload: { plan_name: "P", monthly_fee_cents: 3000, commitment_months: 12, hardware_tier: "BAND_STD", upgrade_eligibility_months: 6, pause_days_per_term: 30, cancel_fee_policy: "REMAINING_MONTHS", early_cancel_fee_floor_cents: 5000 }
              as: Member
              as_user_id: "${mv5}"
          trigger:
            - call: "POST /members/${mv5}/terms"
              payload: { plan_name: "P2", monthly_fee_cents: 5000, commitment_months: 6, hardware_tier: "BAND_PRO", upgrade_eligibility_months: 3, pause_days_per_term: 10, cancel_fee_policy: "PAID_MONTHS_FLOOR", early_cancel_fee_floor_cents: 2000 }
              as: Member
              as_user_id: "${mv5}"
              captures: { term2_err: "$.data.error_id" }
          assert:
            - "term2_err == ERR_ACTIVE_TERM_EXISTS"

  # ------------------------------------------------------------- endpoints
  - section: endpoints
    instances:
      - name: list_pagination_envelope
        claim_type: listing_pagination
        grounds:
          - "response_envelope"
        distinguishing_aspect: "List endpoint honors limit/offset with pagination fields limit, offset, total_count, has_more and defaults limit=10."
