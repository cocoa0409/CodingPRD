          A four-hop chain along a completely different axis — EDITORIAL REWORK rather than
          publication — fired by one reviewer's CHANGES_REQUESTED decision: SignOff -> sibling
          SignOff invalidation and Topic.review_state -> DocPlanItem rework accounting ->
          Writer capacity ledger -> ReleaseTrain readiness ratio. Unlike the archive cascade it
          INCREASES a derived quantity (load_points 26.00 -> 27.00) and it bypasses the writer
          capacity ceiling on purpose, and its depth terminates in a ratio rather than in money.
        test_recipe:
          setup:
            - "Release train ATLAS 18.0 in status PLANNED with exactly one plan item, so the readiness ratio has denominator 1."
            - "One SENIOR writer capacity 100, one ENGINEERING and one PRODUCT reviewer."
            - "One STANDARD plan item (6 pages, complexity 10, NEW_TOPIC) assigned 2026-08-03..2026-08-14 -> load_points 26.00, Writer.committed_load_points 26.00, assignment_count 1."
            - "One topic with a single revision, submitted for review, holding one PENDING ENGINEERING sign-off already APPROVED and one PENDING PRODUCT sign-off still open."
            - "Immediately before the trigger: Topic.review_state PENDING_SIGNOFF, DocPlanItem.status IN_REVIEW with rework_count 0, ReleaseTrain.approved_topic_ratio 0.00 with posture OPEN."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DocsLead
            - call: "POST /release-trains"
              payload: { product_key: "ATLAS", version_label: "18.0", doc_freeze_date: "2026-08-20", ga_date: "2026-09-01", support_end_date: "2027-09-01", localization_budget_cap_cents: 5000000 }
              as: DocsLead
              captures: { rt_id: $.data.id }
            - call: "POST /writers"
              payload: { person_key: "w-sam", full_name: "Sam Senior", seniority_tier: "SENIOR", capacity_points: 100 }
              as: DocsLead
              captures: { w1_id: $.data.id }
            - call: "POST /reviewers"
              payload: { person_key: "r-eng", full_name: "Erin Engineering", discipline: "ENGINEERING" }
              as: DocsLead
              captures: { rv_eng_id: $.data.id }
            - call: "POST /reviewers"
              payload: { person_key: "r-prod", full_name: "Priya Product", discipline: "PRODUCT" }
              as: DocsLead
              captures: { rv_prod_id: $.data.id }
            - call: "POST /plan-items"
              payload: { release_train_id: "${rt_id}", feature_key: "atlas-audit", ia_placement: "NEW_TOPIC", audience_tier: "STANDARD", planned_page_count: 6, complexity_points: 10 }
              as: DocsLead
              captures: { pi_id: $.data.id }
            - call: "POST /plan-items/${pi_id}/assign"
              payload: { writer_id: "${w1_id}", window_start_date: "2026-08-03", window_end_date: "2026-08-14" }
              as: DocsLead
            - call: "POST /topics"
              payload: { plan_item_id: "${pi_id}", slug: "atlas-audit-overview", title: "Atlas Audit Overview" }
              as: Writer
              as_user_id: "${w1_id}"
              captures: { t_id: $.data.id }
            - call: "POST /topics/${t_id}/revisions"
              payload: { body_word_count: 1200, used_terms: ["audit"], summary: "draft 1" }
              as: Writer
              as_user_id: "${w1_id}"
            - call: "POST /topics/${t_id}/submit-review"
              payload: {}
              as: Writer
              as_user_id: "${w1_id}"
            - call: "POST /topics/${t_id}/sign-offs"
              payload: { reviewer_id: "${rv_eng_id}" }
              as: DocsLead
              captures: { so_eng_id: $.data.id }
            - call: "POST /topics/${t_id}/sign-offs"
              payload: { reviewer_id: "${rv_prod_id}" }
              as: DocsLead
              captures: { so_prod_id: $.data.id }
            - call: "POST /sign-offs/${so_eng_id}/decide"
              payload: { decision: "APPROVED" }
              as: Reviewer
              as_user_id: "${rv_eng_id}"
          trigger:
            - call: "POST /sign-offs/${so_prod_id}/decide"
              payload: { decision: "CHANGES_REQUESTED", comment: "the retention table is technically wrong" }
              as: Reviewer
              as_user_id: "${rv_prod_id}"
          assert:
            - "hop 1: SignOff.${so_prod_id}.state == CHANGES_REQUESTED with decided_at 2026-08-01T00:00:00Z and pinned_revision_number null"
            - "hop 2: Topic.${t_id}.review_state == CHANGES_REQUESTED and SignOff.${so_eng_id}.state == SUPERSEDED with pinned_revision_number cleared to null (an APPROVED sibling is invalidated)"
            - "hop 3: DocPlanItem.${pi_id}.status == IN_REVISION, rework_count == 1, load_points == 27.00 (26.00 base plus REWORK_POINTS 1.0)"
            - "hop 4: Writer.${w1_id}.committed_load_points == 27.00 with assignment_count still 1 — the cascade path does NOT re-check the capacity ceiling"
            - "hop 4 (continued): ReleaseTrain.${rt_id}.approved_plan_item_count == 0, approved_topic_ratio == 0.00, doc_readiness_posture == OPEN (PLANNED short-circuits the ratio band)"
            - "Reviewer.${rv_eng_id}.open_signoff_count == 0 and Reviewer.${rv_prod_id}.open_signoff_count == 0"
            - "Topic.${t_id}.publication_state is STILL UNPUBLISHED and current_revision_number is STILL 1"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: self_review_beats_duplicate_signoff_discipline_rejected
        grounds:
          - validations[priority=30]
          - validations[priority=51]
          - errors.ERR_SELF_REVIEW_FORBIDDEN
          - errors.ERR_DUPLICATE_SIGNOFF_DISCIPLINE
        distinguishing_aspect: |
          Pairs a SAFETY rule (30, segregation of duties, 403) against a CONSTRAINT rule
          (51, one sign-off per discipline, 409) on the same endpoint. Both conditions hold on
          the very same request, and the low-numbered safety rule must win, so the client sees
          403 ERR_SELF_REVIEW_FORBIDDEN and never the 409 — the two rules differ in BOTH
          error_id and HTTP status, so a wrong ordering is unambiguous.
        test_recipe:
          setup:
            - "One release train ATLAS 19.0, one SENIOR writer whose person_key is 'p-dana'."
            - "Two ENGINEERING reviewers: one with person_key 'r-erin' and one with person_key 'p-dana' — the same human as the writer (person_key is unique within writers and separately within reviewers, so the collision is legal data)."
            - "One STANDARD plan item assigned to p-dana, one topic whose newest revision was authored by p-dana, submitted for review."
            - "One PENDING ENGINEERING sign-off already requested from r-erin, so the ENGINEERING discipline is already covered."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DocsLead
            - call: "POST /release-trains"
              payload: { product_key: "ATLAS", version_label: "19.0", doc_freeze_date: "2026-08-20", ga_date: "2026-09-01", support_end_date: "2027-09-01", localization_budget_cap_cents: 5000000 }
              as: DocsLead
              captures: { rt_id: $.data.id }
            - call: "POST /writers"
              payload: { person_key: "p-dana", full_name: "Dana Doyle", seniority_tier: "SENIOR", capacity_points: 100 }
              as: DocsLead
              captures: { w1_id: $.data.id }
            - call: "POST /reviewers"
              payload: { person_key: "r-erin", full_name: "Erin Engineering", discipline: "ENGINEERING" }
              as: DocsLead
              captures: { rv_erin_id: $.data.id }
            - call: "POST /reviewers"
              payload: { person_key: "p-dana", full_name: "Dana Doyle", discipline: "ENGINEERING" }
              as: DocsLead
              captures: { rv_dana_id: $.data.id }
            - call: "POST /plan-items"
