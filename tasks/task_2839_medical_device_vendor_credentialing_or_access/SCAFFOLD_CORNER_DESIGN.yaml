# =============================================================================
# 1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# task_2839_medical_device_vendor_credentialing_or_access
#
# Breadth probe over the nine claim-extraction sections. Every section:/claim_type:
# value comes from references/claim-extraction-guide.md; none are invented.
# Corners already asserted by SCAFFOLD_DIFFICULTY_DESIGN.yaml appear as
# excluded_because: stubs that name the covering §1.8 instance verbatim.
# The logical clock starts at 2026-08-01T00:00:00Z; any recipe that does not call
# POST /vendor-access/_clock/set_current_utc runs at that instant.
# =============================================================================
scaffold_corner_design:

  - section: entities
    instances:

      - name: facility_creation_returns_every_declared_field
        claim_type: creation
        grounds:
          - entities.Facility
          - endpoints.POST_/vendor-access/facilities
          - response_envelope.success
        distinguishing_aspect: "A single POST with all required fields returns 201, the success envelope with response_type object, a bare UUID id with no type prefix, version 1 and every declared Facility field echoed."
        test_recipe:
          setup:
            - "Empty database; the logical clock is at its 2026-08-01T00:00:00Z default."
          setup_api_calls: []
          trigger:
            - call: "POST /vendor-access/facilities"
              payload: { name: "Corner General Hospital", code: "CG-20", spd_turnaround_hours: 7, spd_bay_count: 4, badge_lead_minutes: 45, badge_grace_minutes: 20, restricted_escort_required: false }
              as: ComplianceAdmin
              as_user_id: "user_compliance_1"
              captures: { f_cg_id: $.data.id, f_cg_ver: $.data.version }
          assert:
            - "HTTP status is 201"
            - "the response carries meta.api_request_id and meta.api_request_timestamp and response_type == object"
            - "Facility.${f_cg_id}.name == Corner General Hospital"
            - "Facility.${f_cg_id}.code == CG-20"
            - "Facility.${f_cg_id}.spd_turnaround_hours == 7"
            - "Facility.${f_cg_id}.spd_bay_count == 4"
            - "Facility.${f_cg_id}.badge_lead_minutes == 45"
            - "Facility.${f_cg_id}.badge_grace_minutes == 20"
            - "Facility.${f_cg_id}.restricted_escort_required == false"
            - "Facility.${f_cg_id}.version == 1"
            - "the id is a bare UUID with no type prefix, and created_at / updated_at are ISO-8601 UTC with three fractional digits"

      - name: vendor_rep_retrieval_returns_stored_row_with_defaults
        claim_type: retrieval
        grounds:
          - entities.VendorRep
          - endpoints.GET_/vendor-access/vendor-reps/{id}
        distinguishing_aspect: "A freshly created rep reads back through GET with its stored input fields plus every computed/system default: PENDING_CREDENTIALING, INCOMPLETE, NONE, false and zero."
        test_recipe:
          setup:
            - "Vendor CORNV exists; one rep has been registered and nothing else has happened."
          setup_api_calls:
            - call: "POST /vendor-access/vendors"
              payload: { legal_name: "Cornerview Medical Inc", vendor_code: "CORNV" }
              as: CredentialingOfficer
              as_user_id: "user_credentialing_1"
              captures: { v_cornv_id: $.data.id }
            - call: "POST /vendor-access/vendor-reps"
              payload: { vendor_id: "${v_cornv_id}", full_name: "Rita Alvarez", email: "rita.alvarez@cornerview.example" }
              as: VendorAdmin
              as_user_id: "${v_cornv_id}"
              captures: { rep_rita_id: $.data.id }
          trigger:
            - call: "GET /vendor-access/vendor-reps/${rep_rita_id}"
              as: CredentialingOfficer
              as_user_id: "user_credentialing_1"
          assert:
            - "HTTP status is 200"
            - "VendorRep.${rep_rita_id}.vendor_id == ${v_cornv_id}"
            - "VendorRep.${rep_rita_id}.full_name == Rita Alvarez"
            - "VendorRep.${rep_rita_id}.email == rita.alvarez@cornerview.example"
            - "VendorRep.${rep_rita_id}.access_status == PENDING_CREDENTIALING"
            - "VendorRep.${rep_rita_id}.credential_posture == INCOMPLETE"
            - "VendorRep.${rep_rita_id}.suspension_reason == NONE"
            - "VendorRep.${rep_rita_id}.ever_credentialed == false"
            - "VendorRep.${rep_rita_id}.open_authorization_count == 0"
            - "VendorRep.${rep_rita_id}.revoked_at_utc is null and reinstated_at_utc is null"
            - "VendorRep.${rep_rita_id}.version == 1"

      - name: vendor_rep_listing_filters_by_vendor_and_paginates
        claim_type: listing
        grounds:
          - endpoints.GET_/vendor-access/vendor-reps
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "Three reps across two vendors: filtering by vendor_id narrows to two rows, limit 1 / offset 0 returns one row with total_count 2 and has_more true, and offset 1 returns the second row with has_more false."
        test_recipe:
          setup:
            - "Vendor LISTA has two reps; Vendor LISTB has one rep. No credential work has been done."
          setup_api_calls:
            - call: "POST /vendor-access/vendors"
              payload: { legal_name: "Lista Devices SA", vendor_code: "LISTA" }
              as: CredentialingOfficer
              as_user_id: "user_credentialing_1"
              captures: { v_lista_id: $.data.id }
            - call: "POST /vendor-access/vendors"
              payload: { legal_name: "Listb Surgical SA", vendor_code: "LISTB" }
              as: CredentialingOfficer
              as_user_id: "user_credentialing_1"
              captures: { v_listb_id: $.data.id }
            - call: "POST /vendor-access/vendor-reps"
              payload: { vendor_id: "${v_lista_id}", full_name: "Rep Alpha", email: "alpha@lista.example" }
              as: CredentialingOfficer
              as_user_id: "user_credentialing_1"
              captures: { rep_alpha_id: $.data.id }
            - call: "POST /vendor-access/vendor-reps"
              payload: { vendor_id: "${v_lista_id}", full_name: "Rep Beta", email: "beta@lista.example" }
              as: CredentialingOfficer
              as_user_id: "user_credentialing_1"
              captures: { rep_beta_id: $.data.id }
            - call: "POST /vendor-access/vendor-reps"
              payload: { vendor_id: "${v_listb_id}", full_name: "Rep Gamma", email: "gamma@listb.example" }
              as: CredentialingOfficer
              as_user_id: "user_credentialing_1"
              captures: { rep_gamma_id: $.data.id }
          trigger:
            - call: "GET /vendor-access/vendor-reps?vendor_id=${v_lista_id}&limit=1&offset=0"
              as: ComplianceAdmin
              as_user_id: "user_compliance_1"
              captures: { first_page_rep_id: "$.data[0].id" }
            - call: "GET /vendor-access/vendor-reps?vendor_id=${v_lista_id}&limit=1&offset=1"
              as: ComplianceAdmin
              as_user_id: "user_compliance_1"
              captures: { second_page_rep_id: "$.data[0].id" }
          assert:
            - "both responses have response_type == array"
            - "the first page returns exactly 1 row with total_count == 2, limit == 1, offset == 0 and has_more == true"
            - "the second page returns exactly 1 row with total_count == 2, offset == 1 and has_more == false"
            - "${first_page_rep_id} and ${second_page_rep_id} are the two LISTA reps ${rep_alpha_id} and ${rep_beta_id} in created_at ASC order, and neither page contains ${rep_gamma_id}"
            - "GET /vendor-access/vendor-reps with no query parameters returns all 3 rows with the default limit 10 and offset 0"

      - name: unknown_uuid_not_found_for_every_addressable_entity
        claim_type: not_found
        grounds:
          - validations.priority_5_path_parameter_existence
          - errors.ERR_FACILITY_NOT_FOUND
          - errors.ERR_VENDOR_NOT_FOUND
          - errors.ERR_VENDOR_REP_NOT_FOUND
          - errors.ERR_CREDENTIAL_NOT_FOUND
          - errors.ERR_SURGICAL_CASE_NOT_FOUND
          - errors.ERR_AUTHORIZATION_NOT_FOUND
          - errors.ERR_PIR_NOT_FOUND
          - errors.ERR_APPROVED_PRODUCT_NOT_FOUND
          - errors.ERR_LOANER_SET_NOT_FOUND
          - errors.ERR_CHECK_IN_NOT_FOUND
          - errors.ERR_INCIDENT_NOT_FOUND
          - errors.ERR_APPEAL_NOT_FOUND
        distinguishing_aspect: "Every addressable entity answers a well-formed but unknown UUID with its OWN 404 error_id, not a generic one and not a 400; the twelve error ids must all differ."
        test_recipe:
          setup:
            - "Empty database; no row of any kind exists, so every id below is unknown."
          setup_api_calls: []
          trigger:
            - call: "GET /vendor-access/facilities/00000000-0000-4000-8000-000000000001"
              as: ComplianceAdmin
              as_user_id: "user_compliance_1"
              captures: { e_facility: $.data.error_id }
            - call: "GET /vendor-access/vendors/00000000-0000-4000-8000-000000000002"
              as: ComplianceAdmin
              as_user_id: "user_compliance_1"
              captures: { e_vendor: $.data.error_id }
            - call: "GET /vendor-access/vendor-reps/00000000-0000-4000-8000-000000000003"
              as: ComplianceAdmin
              as_user_id: "user_compliance_1"
              captures: { e_rep: $.data.error_id }
            - call: "POST /vendor-access/credentials/00000000-0000-4000-8000-000000000004/decide"
              payload: { decision: "VERIFY" }
              as: CredentialingOfficer
              as_user_id: "user_credentialing_1"
              captures: { e_credential: $.data.error_id }
            - call: "GET /vendor-access/surgical-cases/00000000-0000-4000-8000-000000000005"
              as: ComplianceAdmin
              as_user_id: "user_compliance_1"
              captures: { e_case: $.data.error_id }
            - call: "GET /vendor-access/case-rep-authorizations/00000000-0000-4000-8000-000000000006"
              as: ComplianceAdmin
              as_user_id: "user_compliance_1"
              captures: { e_auth: $.data.error_id }
            - call: "GET /vendor-access/product-introduction-requests/00000000-0000-4000-8000-000000000007"
              as: ComplianceAdmin
              as_user_id: "user_compliance_1"
              captures: { e_pir: $.data.error_id }
            - call: "GET /vendor-access/approved-products/00000000-0000-4000-8000-000000000008"
              as: ComplianceAdmin
              as_user_id: "user_compliance_1"
              captures: { e_product: $.data.error_id }
            - call: "GET /vendor-access/loaner-sets/00000000-0000-4000-8000-000000000009"
              as: ComplianceAdmin
              as_user_id: "user_compliance_1"
              captures: { e_loaner: $.data.error_id }
            - call: "GET /vendor-access/kiosk-check-ins/00000000-0000-4000-8000-00000000000a"
              as: ComplianceAdmin
              as_user_id: "user_compliance_1"
              captures: { e_checkin: $.data.error_id }
            - call: "GET /vendor-access/incidents/00000000-0000-4000-8000-00000000000b"
              as: ComplianceAdmin
              as_user_id: "user_compliance_1"
              captures: { e_incident: $.data.error_id }
            - call: "GET /vendor-access/access-appeals/00000000-0000-4000-8000-00000000000c"
              as: ComplianceAdmin
              as_user_id: "user_compliance_1"
              captures: { e_appeal: $.data.error_id }
          assert:
            - "every one of the twelve responses has HTTP status 404 and response_type == error"
            - "${e_facility} == ERR_FACILITY_NOT_FOUND"
            - "${e_vendor} == ERR_VENDOR_NOT_FOUND"
            - "${e_rep} == ERR_VENDOR_REP_NOT_FOUND"
            - "${e_credential} == ERR_CREDENTIAL_NOT_FOUND"
            - "${e_case} == ERR_SURGICAL_CASE_NOT_FOUND"
            - "${e_auth} == ERR_AUTHORIZATION_NOT_FOUND"
            - "${e_pir} == ERR_PIR_NOT_FOUND"
            - "${e_product} == ERR_APPROVED_PRODUCT_NOT_FOUND"
            - "${e_loaner} == ERR_LOANER_SET_NOT_FOUND"
            - "${e_checkin} == ERR_CHECK_IN_NOT_FOUND"
            - "${e_incident} == ERR_INCIDENT_NOT_FOUND"
            - "${e_appeal} == ERR_APPEAL_NOT_FOUND"
            - "each error body carries data.error_id and data.message and nothing else"

      - name: facility_creation_missing_required_code_rejected
        claim_type: required_fields
        grounds:
          - validations.priority_3_ERR_INVALID_REQUEST
          - entities.Facility.fields.code
          - endpoints.POST_/vendor-access/facilities
        distinguishing_aspect: "A Facility POST that omits the required input field code is refused with ERR_INVALID_REQUEST (400) and creates no row; the request is not silently defaulted."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /vendor-access/facilities"
              payload: { name: "Nameless Code Hospital", spd_turnaround_hours: 6, spd_bay_count: 2 }
              as: CredentialingOfficer
              as_user_id: "user_credentialing_1"
              captures: { missing_field_error: $.data.error_id }
          assert:
            - "HTTP status is 400 and error_id == ERR_INVALID_REQUEST"
            - "GET /vendor-access/facilities/{id} is unreachable because no Facility row was created"

      - name: facility_optional_inputs_take_declared_defaults
        claim_type: defaults
        grounds:
          - entities.Facility.fields.badge_lead_minutes
          - entities.Facility.fields.badge_grace_minutes
          - entities.Facility.fields.restricted_escort_required
        distinguishing_aspect: "Omitting the three optional Facility inputs yields exactly 60, 30 and true — the declared defaults — rather than nulls or zeros."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /vendor-access/facilities"
              payload: { name: "Defaults Memorial Hospital", code: "DF-21", spd_turnaround_hours: 5, spd_bay_count: 2 }
              as: CredentialingOfficer
              as_user_id: "user_credentialing_1"
              captures: { f_df_id: $.data.id }
          assert:
            - "Facility.${f_df_id}.badge_lead_minutes == 60"
            - "Facility.${f_df_id}.badge_grace_minutes == 30"
            - "Facility.${f_df_id}.restricted_escort_required == true"
            - "Facility.${f_df_id}.spd_turnaround_hours == 5 and spd_bay_count == 2"

      - name: loaner_set_computed_and_system_fields_input_ignored
        claim_type: computed_fields
        grounds:
          - entities.LoanerSet.fields.pinned_deadline_utc
          - entities.LoanerSet.fields.required_delivery_deadline_utc
          - entities.LoanerSet.fields.assessed_late_fee_cents
          - entities.LoanerSet.fields.status
          - calculations.loaner_delivery_deadline
        distinguishing_aspect: "A registration that also sends pinned_deadline_utc, status and assessed_late_fee_cents must ignore all three: the deadline is recomputed to 2026-09-30T22:00:00Z from the facility and tray inputs, status is EXPECTED and the fee is 0."
        test_recipe:
          setup:
            - "Facility CI-22 has spd_turnaround_hours 6 and spd_bay_count 2."
            - "Vendor COMPI has one approved NON-implant product."
            - "Case CASE-12001 runs 2026-10-01T08:00:00Z to 10:00:00Z, so a 5-tray COMPLEX set has lead_hours = 6 + 6 + 1 = 13 and a deadline of 2026-09-30T19:00:00Z."
          setup_api_calls:
            - call: "POST /vendor-access/facilities"
              payload: { name: "Computed Inputs Hospital", code: "CI-22", spd_turnaround_hours: 6, spd_bay_count: 2 }
              as: CredentialingOfficer
              as_user_id: "user_credentialing_1"
              captures: { f_ci_id: $.data.id }
            - call: "POST /vendor-access/vendors"
              payload: { legal_name: "Computa Instruments Ltd", vendor_code: "COMPI" }
              as: CredentialingOfficer
              as_user_id: "user_credentialing_1"
              captures: { v_compi_id: $.data.id, v_compi_ver0: $.data.version }
            - call: "POST /vendor-access/product-introduction-requests"
              payload: { vendor_id: "${v_compi_id}", facility_id: "${f_ci_id}", product_name: "Basic Scope Tray", product_catalog_number: "BS-100", manufacturer: "Computa", is_implant: false, unit_cost_cents: 50000, expected_vendor_version: "${v_compi_ver0}" }
              as: VendorAdmin
              as_user_id: "${v_compi_id}"
              captures: { pir_bs_id: $.data.id }
            - call: "POST /vendor-access/product-introduction-requests/${pir_bs_id}/submit"
              payload: {}
              as: VendorAdmin
              as_user_id: "${v_compi_id}"
            - call: "POST /vendor-access/product-introduction-requests/${pir_bs_id}/clinical-review"
              payload: { decision: "ENDORSE" }
              as: ClinicalSponsor
              as_user_id: "user_sponsor_1"
            - call: "POST /vendor-access/product-introduction-requests/${pir_bs_id}/value-analysis-decision"
              payload: { decision: "APPROVE" }
              as: ValueAnalysisApprover
              as_user_id: "user_vac_1"
            - call: "GET /vendor-access/approved-products?product_introduction_request_id=${pir_bs_id}"
              as: SterileProcessingTech
              as_user_id: "user_spd_1"
              captures: { ap_bs_id: "$.data[0].id" }
            - call: "POST /vendor-access/surgical-cases"
              payload: { facility_id: "${f_ci_id}", case_number: "CASE-12001", procedure_name: "Diagnostic Scope", scheduled_start_utc: "2026-10-01T08:00:00Z", scheduled_end_utc: "2026-10-01T10:00:00Z" }
              as: ORCoordinator
              as_user_id: "user_orc_1"
              captures: { case_12001_id: $.data.id }
            - call: "GET /vendor-access/surgical-cases/${case_12001_id}"
              as: SterileProcessingTech
              as_user_id: "user_spd_1"
              captures: { case_12001_ver: $.data.version }
          trigger:
            - call: "POST /vendor-access/loaner-sets"
              payload: { surgical_case_id: "${case_12001_id}", approved_product_id: "${ap_bs_id}", tray_count: 5, reprocessing_complexity: "COMPLEX", expected_case_version: "${case_12001_ver}", pinned_deadline_utc: "2020-01-01T00:00:00Z", status: "RELEASED_TO_OR", assessed_late_fee_cents: 999999, id: "00000000-0000-4000-8000-0000000000ff" }
              as: SterileProcessingTech
              as_user_id: "user_spd_1"
              captures: { ls_12001_id: $.data.id }
          assert:
            - "HTTP status is 201"
            - "LoanerSet.${ls_12001_id}.pinned_deadline_utc == 2026-09-30T19:00:00Z — the client-supplied 2020 instant was ignored"
            - "LoanerSet.${ls_12001_id}.required_delivery_deadline_utc == 2026-09-30T19:00:00Z"
            - "LoanerSet.${ls_12001_id}.status == EXPECTED — the client-supplied RELEASED_TO_OR was ignored"
            - "LoanerSet.${ls_12001_id}.assessed_late_fee_cents == 0 and fee_status == NONE"
            - "LoanerSet.${ls_12001_id}.delivered_at_utc is null"
            - "${ls_12001_id} is a server-minted UUID, not the client-supplied 00000000-0000-4000-8000-0000000000ff"
            - "LoanerSet.${ls_12001_id}.spd_occupation_start_utc == 2026-09-30T19:00:00Z and spd_occupation_end_utc == 2026-10-01T08:00:00Z"

      - name: compliance_sweep_is_immutable_and_carries_no_version
        claim_type: immutability
        grounds:
          - entities.ComplianceSweep
          - endpoints.POST_/vendor-access/compliance-sweeps
        distinguishing_aspect: "ComplianceSweep is declared common_fields false: the created row exposes id and created_at but NO version and NO updated_at, and there is no update endpoint anywhere in §1.5 that can mutate it."
        test_recipe:
          setup:
            - "Empty database; the clock is at its 2026-08-01T00:00:00Z default, so the first sweep observes nothing."
          setup_api_calls: []
          trigger:
            - call: "POST /vendor-access/compliance-sweeps"
              payload: {}
              as: ComplianceAdmin
              as_user_id: "user_compliance_1"
              captures: { sweep_empty_id: $.data.id, sweep_empty_epoch: $.data.epoch_number }
          assert:
            - "HTTP status is 201"
            - "ComplianceSweep.${sweep_empty_id}.epoch_number == 1 and previous_epoch_number == 0"
            - "ComplianceSweep.${sweep_empty_id}.swept_at_utc == 2026-08-01T00:00:00Z"
            - "every count field is 0: credentials_expired_count, credentials_warned_count, reps_suspended_count, reps_reinstated_count, authorizations_revoked_count, badges_voided_count, badges_expired_count, approvals_expired_count, incidents_closed_count, vendors_rescored_count"
            - "the response body has no version field and no updated_at field"
            - "no endpoint in the API can modify or delete ComplianceSweep.${sweep_empty_id}"

      - name: surgical_case_invalid_restriction_level_enum_rejected
        claim_type: type_constraints
        grounds:
          - entities.SurgicalCase.fields.restriction_level
          - validations.priority_3_ERR_INVALID_REQUEST
        distinguishing_aspect: "restriction_level is an enum of STANDARD and RESTRICTED; a third value is a 400 ERR_INVALID_REQUEST, not a stored string and not a silent fallback to STANDARD."
        test_recipe:
          setup:
            - "Facility EN-23 exists."
          setup_api_calls:
            - call: "POST /vendor-access/facilities"
              payload: { name: "Enumville Surgical", code: "EN-23", spd_turnaround_hours: 6, spd_bay_count: 2 }
              as: CredentialingOfficer
              as_user_id: "user_credentialing_1"
              captures: { f_en_id: $.data.id }
          trigger:
            - call: "POST /vendor-access/surgical-cases"
              payload: { facility_id: "${f_en_id}", case_number: "CASE-12101", procedure_name: "Enum Probe", scheduled_start_utc: "2026-10-02T08:00:00Z", scheduled_end_utc: "2026-10-02T10:00:00Z", restriction_level: "TOP_SECRET" }
              as: ORCoordinator
              as_user_id: "user_orc_1"
              captures: { enum_error_id: $.data.error_id }
          assert:
            - "HTTP status is 400 and error_id == ERR_INVALID_REQUEST"
            - "no SurgicalCase row with case_number CASE-12101 exists"

      - name: credential_body_fk_unknown_rep_returns_not_found
        claim_type: parent_relationships
        grounds:
          - validations.priority_6_body_foreign_key_existence
          - entities.Credential.fields.vendor_rep_id
          - errors.ERR_VENDOR_REP_NOT_FOUND
        distinguishing_aspect: "A body-carried foreign key is validated exactly like a path parameter: an unknown vendor_rep_id gives ERR_VENDOR_REP_NOT_FOUND (404), never ERR_INVALID_REQUEST (400) and never a dangling Credential row."
        test_recipe:
          setup:
            - "Empty database, so the referenced rep id cannot exist."
          setup_api_calls: []
          trigger:
            - call: "POST /vendor-access/credentials"
              payload: { vendor_rep_id: "00000000-0000-4000-8000-0000000000d1", credential_type: "BACKGROUND_CHECK", issued_at_utc: "2026-07-01T00:00:00Z", expires_at_utc: "2027-07-01T00:00:00Z", document_reference: "BGC-GHOST-01" }
              as: CredentialingOfficer
              as_user_id: "user_credentialing_1"
              captures: { fk_error_id: $.data.error_id }
          assert:
            - "HTTP status is 404 and error_id == ERR_VENDOR_REP_NOT_FOUND"
            - "no Credential row was created"

      - name: authorization_junction_links_case_and_rep_both_ways
        claim_type: graph
        grounds:
          - entities.CaseRepAuthorization
          - endpoints.GET_/vendor-access/case-rep-authorizations
          - complexity_profile.entity_topology
        distinguishing_aspect: "CaseRepAuthorization is the many-to-many junction of the graph topology: two reps on one case and one of those reps on a second case produce three rows that are reachable by filtering on either side, and the case-side and rep-side counts differ."
        test_recipe:
          setup:
            - "Facility JN-24 exists; Vendor JUNCT has two reps, neither of which needs credentials because the authorizations are only created, not approved."
            - "Two cases exist: CASE-12201 on 2026-10-03 and CASE-12202 on 2026-10-04."
            - "Three authorizations are created: rep 1 and rep 2 on CASE-12201, and rep 1 on CASE-12202."
          setup_api_calls:
            - call: "POST /vendor-access/facilities"
              payload: { name: "Junction Point Hospital", code: "JN-24", spd_turnaround_hours: 6, spd_bay_count: 2 }
              as: CredentialingOfficer
              as_user_id: "user_credentialing_1"
