          setup:
            - "Facility (FOREIGN, DE); Importer; entry (declared_units 3, unit_value_cents 105) auto-detained by FIRM alert at 2026-09-01T00:00:00Z; clock advanced 36h to 2026-09-02T12:00:00Z (within the 240h response deadline)"
