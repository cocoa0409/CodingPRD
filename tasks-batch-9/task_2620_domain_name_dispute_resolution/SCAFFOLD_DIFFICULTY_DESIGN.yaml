  - rule_id: transitive_cascade
    instances:

      - name: sustained_court_challenge_unwinds_six_links_including_the_rdnh_counter
        grounds:
          - state_machines.Case.STAYED_to_TERMINATED_COURT
          - state_machines.CourtChallenge.FILED_to_SUSTAINED
          - state_machines.Decision.STAYED_to_VOIDED
          - state_machines.DomainName.LOCKED_to_UNLOCKED
          - calculations.load_and_population_counters
          - calculations.domain_occupation_conflict
          - endpoints.POST_/udrp/court-challenges/{id}/resolve
        distinguishing_aspect: |
          A single POST /udrp/court-challenges/{id}/resolve with outcome SUSTAINED propagates six
          links deep from one row the caller never names: challenge -> Decision.status VOIDED ->
          Case.status TERMINATED_COURT with a freshly computed refiling_bar_until -> every ACCEPTED
          PanelistAppointment DISCHARGED -> each affected Panelist.active_case_load decremented ->
          DomainName unlocked, and on top of that the signed RDNH counter on the Complainant is
          walked back from 1 to 0. Asserting only that the challenge was resolved, or only that the
          decision was voided, passes while five of the six links are missing.
