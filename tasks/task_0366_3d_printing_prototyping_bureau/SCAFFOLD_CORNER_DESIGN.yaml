            - { call: "POST /bureaus/order-lines", payload: { order_id: "${ord}", print_file_id: "${fileB}", material_id: "${mat}", layer_height_mm: 0.10, quantity: 1 }, as: Customer, as_user_id: "${cust}", captures: { line2: $.data.id } }
            - { call: "POST /bureaus/orders/${ord}/quote", payload: {}, as: Customer, as_user_id: "${cust}", captures: { ov_requoted: $.data.version } }
          trigger:
            - { call: "POST /bureaus/orders/${ord}/confirm", payload: { expected_order_version: "${ov_quoted}" }, as: Customer, as_user_id: "${cust}", captures: { err: $.data.error_id } }
          assert:
            - "Response status 412 and data.error_id == ERR_STALE_VERSION (captured ov_quoted is now stale)"

      - name: occ_adjudicate_stale_run_version_returns_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[printrun-adjudicate-stale-run]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Adjudicating a FAILED run twice: the second carries the pre-adjudication run version (stale) -> 412 ERR_STALE_VERSION."
        test_recipe:
          setup: ["Funded customer; confirmed order line B; run started then FAILED (FILE_DEFECT); first adjudicate succeeds (bumps run.version)."]
          setup_api_calls:
