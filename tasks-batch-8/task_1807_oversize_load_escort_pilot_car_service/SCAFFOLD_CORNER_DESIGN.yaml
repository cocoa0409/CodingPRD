      - name: standby_rounding_order_corner
        claim_type: precision
        grounds: [calculations.standby_billing]
        excluded_because:
          difficulty_instance: combinatorial_formula / standby_per_event_rounding_order
          rationale: "Per-event-then-sum rounding pinned and asserted with literal values (3750 + 7500 = 11250) by the named §1.8 instance."

      - name: invoice_evaluation_order_corner
        claim_type: correct_result
        grounds: [calculations.invoice_total_composition]
        excluded_because:
          difficulty_instance: combinatorial_formula / invoice_evaluation_order
          rationale: "Evaluation-order pinning (tier basis includes this subtotal; fuel on undiscounted base+equipment excluding standby) asserted with literal 217087 total by the named §1.8 instance."

      - name: requirement_branching_corner
        claim_type: correct_result
        grounds: [calculations.escort_requirement_determination]
        excluded_because:
          difficulty_instance: combinatorial_formula / per_state_requirement_branching
          rationale: "Threshold branching (front 2, police via weight-only OR-branch, quote 147500 / 40000) asserted by the named §1.8 instance."

  # ===========================================================================
  # Section: validations
  # ===========================================================================
  - section: validations
    instances:
      - name: missing_auth_headers_returns_unauthenticated
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_USER_CONTEXT]"]
        distinguishing_aspect: "A call with no X-User-ID / X-User-Role headers fails before role, existence, or state checks."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /carriers", payload: {}, as: "", captures: { err: $.data.error_id } }
          assert:
            - "http 400 with data.error_id == ERR_MISSING_USER_CONTEXT"

      - name: credit_insufficient_fires_402
        claim_type: violation_to_error
        grounds: ["validations[priority=17]", "errors[ERR_CREDIT_LIMIT_WOULD_BE_EXCEEDED]"]
        distinguishing_aspect: "On a QUOTED (non-cancelled) job, the fiscal check actually fires: quoted 22500 against credit_available 100."
        test_recipe:
          setup: ["Carrier credit_limit_cents 100; job QUOTED at 22500 (width 170 / height 150, TX 120mi)"]
          setup_api_calls:
            - { call: "POST /carriers", payload: { carrier_name: "Tiny Limit Co", credit_limit_cents: 100 }, as: Dispatcher, captures: { carrier_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T00:00:00Z" }, as: Dispatcher }
            - { call: "POST /jobs", payload: { carrier_id: "${carrier_id}", load_description: "Too pricey", width_inches: 170, height_inches: 150, length_inches: 600, gross_weight_lbs: 150000, window_start_at: "2026-08-10T09:00:00Z", window_end_at: "2026-08-10T13:00:00Z", legs: [ { state_code: "TX", sequence_index: 0, distance_miles: 120, planned_entry_at: "2026-08-10T09:00:00Z", planned_exit_at: "2026-08-10T13:00:00Z", map_min_clearance_inches: 180 } ] }, as: CarrierRep, as_user_id: "${carrier_id}", captures: { job_id: $.data.id } }
            - { call: "POST /jobs/${job_id}/quote", payload: {}, as: Dispatcher }
          trigger:
            - { call: "POST /jobs/${job_id}/accept-quote", payload: {}, as: CarrierRep, as_user_id: "${carrier_id}", captures: { err: $.data.error_id } }
          assert:
            - "http 402 with data.error_id == ERR_CREDIT_LIMIT_WOULD_BE_EXCEEDED; job remains QUOTED and no hold is placed"

      - name: permit_window_gap_at_schedule
        claim_type: violation_to_error
        grounds: ["validations[priority=10]", "errors[ERR_PERMIT_WINDOW_INSUFFICIENT]"]
        distinguishing_aspect: "The CLEARED gate checks permit EXISTENCE; the window-coverage check fires at schedule: valid_from after planned entry fails even with the assignment in place."
        test_recipe:
          setup: ["TX job (width 170 / height 150, REAR accepted) booked; permit ISSUED but valid_from 2026-08-10T10:00:00Z (after the 09:00 entry) -> job still CLEARED"]
          setup_api_calls:
            - { call: "POST /carriers", payload: { carrier_name: "Gap Co", credit_limit_cents: 10000000 }, as: Dispatcher, captures: { carrier_id: $.data.id } }
            - { call: "POST /escorts", payload: { operator_name: "Rider Gap", certified_state_codes: ["TX"] }, as: Dispatcher, captures: { esc_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T00:00:00Z" }, as: Dispatcher }
            - { call: "POST /jobs", payload: { carrier_id: "${carrier_id}", load_description: "Gap", width_inches: 170, height_inches: 150, length_inches: 600, gross_weight_lbs: 150000, window_start_at: "2026-08-10T09:00:00Z", window_end_at: "2026-08-10T13:00:00Z", legs: [ { state_code: "TX", sequence_index: 0, distance_miles: 120, planned_entry_at: "2026-08-10T09:00:00Z", planned_exit_at: "2026-08-10T13:00:00Z", map_min_clearance_inches: 180 } ] }, as: CarrierRep, as_user_id: "${carrier_id}", captures: { job_id: $.data.id } }
            - { call: "GET /jobs/${job_id}/legs", payload: {}, as: Dispatcher, captures: { leg_id: "$.data[0].id" } }
            - { call: "POST /jobs/${job_id}/quote", payload: {}, as: Dispatcher }
            - { call: "POST /jobs/${job_id}/accept-quote", payload: {}, as: CarrierRep, as_user_id: "${carrier_id}" }
            - { call: "POST /legs/${leg_id}/permits", payload: { permit_number: "TX-P-40", valid_from: "2026-08-10T10:00:00Z", valid_until: "2026-08-12T00:00:00Z" }, as: Dispatcher, captures: { permit_id: $.data.id } }
            - { call: "POST /permits/${permit_id}/issue", payload: {}, as: Dispatcher }
            - { call: "POST /legs/${leg_id}/assignments", payload: { position: "REAR", escort_id: "${esc_id}" }, as: Dispatcher, captures: { asg_id: $.data.id } }
            - { call: "POST /assignments/${asg_id}/accept", payload: {}, as: EscortOperator, as_user_id: "${esc_id}" }
          trigger:
            - { call: "POST /jobs/${job_id}/schedule", payload: {}, as: Dispatcher, captures: { err: $.data.error_id } }
          assert:
            - "Job reached CLEARED after issue (existence gate only), proving the window check is deferred"
            - "Schedule: http 409 with data.error_id == ERR_PERMIT_WINDOW_INSUFFICIENT (valid_from 10:00 > planned_entry 09:00)"

      - name: holiday_closure_embargo_at_schedule
        claim_type: violation_to_error
        grounds: ["validations[priority=10]", "errors[ERR_PERMIT_WINDOW_INSUFFICIENT]"]
        distinguishing_aspect: "A permit whose window fully covers the traversal still fails when a holiday_closure_date lands on a traversed calendar date."
        test_recipe:
