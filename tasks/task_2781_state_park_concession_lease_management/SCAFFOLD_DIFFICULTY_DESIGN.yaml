  - rule_id: priority_pair_validation_conflict
    instances:

      - name: holdover_lease_state_error_precedes_report_period_overlap
        grounds:
          - validations[priority=11]
          - validations[priority=35]
          - state_machines.Lease.contract_status.ACTIVE_to_HOLDOVER
          - errors[ERR_LEASE_NOT_ACTIVE]
          - errors[ERR_REPORT_PERIOD_OVERLAP]
        distinguishing_aspect: |
          Two violations are live on one POST /gross-receipts-reports call — the lease is in
