      - name: demolition_delay_half_open_overlap
        grounds:
          - calculations.demolition_delay_schedule
          - validations[priority=9]
          - entities.DemolitionDelay.fields.provisional_delay_end
        distinguishing_aspect: |
          Interval semantics = half-open geometry: a new delay window
          [decided_at, decided_at + base) is rejected only when it properly
          overlaps an existing ACTIVE delay on the same property; adjacency
          (start == prior end) is permitted because the prior delay is EXPIRED
          at its end instant. The companion instance uses aggregate-count
          capacity on a different resource (CommissionMeeting), not intervals.
        test_recipe:
          setup:
            - "Two DEMOLITION applications D1 and D2 on the same LOCAL-tier property, both ACCEPTED with hearings scheduled"
            - "D1 approved at 2026-08-01 -> delay [2026-08-01, 2026-10-30) ACTIVE"
            - "logical clock advanced to 2026-10-29 (89 days in; delay1 still ACTIVE)"
          setup_api_calls:
            - call: "POST /preservation/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PreservationStaff
            - call: "POST /preservation/districts"
