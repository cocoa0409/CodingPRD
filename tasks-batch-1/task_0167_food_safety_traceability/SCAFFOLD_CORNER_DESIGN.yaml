# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# food-safety-traceability — Expert band
# Breadth probe over claim-extraction-guide sections. §1.8 covers the depth
# reasoning rules; this file covers the remaining testable claims. Every
# setup_api_calls / trigger call resolves to §1.5; ${var} closure holds.
# =============================================================================
scaffold_corner_design:

  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: create_lot_returns_201_with_computed_fields
        claim_type: Creation
        grounds:
          - endpoints["POST /traceability/lots"]
          - entities.Lot.fields.available_qty
          - entities.Lot.fields.coa_status
        distinguishing_aspect: "POST a raw lot with all required fields -> 201; available_qty == received_qty, status RECEIVED, hold_status FREE, coa_status NOT_REQUIRED (coa_required=false)."
        test_recipe:
          setup: ["Facility, APPROVED supplier coa_required=false, ingredient shelf 10."]
          setup_api_calls:
            - call: "POST /traceability/facilities"
              payload: { name: "F", gln: "C-1", initial_utc: "2026-01-01T00:00:00Z" }
              as: QualityManager
              captures: { fid: $.data.id }
            - call: "POST /traceability/suppliers"
              payload: { facility_id: "${fid}", name: "S", coa_required: false }
              as: QualityManager
              captures: { sup: $.data.id }
            - call: "POST /traceability/ingredients"
              payload: { facility_id: "${fid}", name: "I", storage_target_c: 4, storage_tolerance_c: 2, shelf_life_days: 10, declared_allergen_codes: ["MILK"] }
              as: QualityManager
              captures: { ing: $.data.id }
          trigger:
            - call: "POST /traceability/lots"
              payload: { facility_id: "${fid}", ingredient_id: "${ing}", lot_code: "LC1", lot_kind: "RAW_MATERIAL", received_qty: 25, production_date: "2026-01-01T00:00:00Z", supplier_id: "${sup}" }
              as: ReceivingClerk
              captures: { avail: $.data.available_qty, st: $.data.status, hs: $.data.hold_status, cs: $.data.coa_status }
          assert:
            - "avail == 25.0 and st == \"RECEIVED\" and hs == \"FREE\" and cs == \"NOT_REQUIRED\""

      - name: get_lot_not_found_returns_404
        claim_type: Not Found
        grounds:
          - endpoints["GET /traceability/lots/{id}"]
          - errors[ERR_LOT_NOT_FOUND]
        distinguishing_aspect: "GET a non-existent lot id -> ERR_LOT_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty facility."]
          setup_api_calls:
            - call: "POST /traceability/facilities"
              payload: { name: "F", gln: "C-2", initial_utc: "2026-01-01T00:00:00Z" }
              as: QualityManager
          trigger:
            - call: "GET /traceability/lots/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: QualityManager
              captures: { err: $.data.error_id }
          assert:
            - "err == \"ERR_LOT_NOT_FOUND\""

      - name: create_lot_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - endpoints["POST /traceability/lots"]
          - errors[ERR_INVALID_REQUEST]
          - validations[priority=4]
        distinguishing_aspect: "POST a lot missing lot_code -> ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Facility, supplier, ingredient."]
          setup_api_calls:
            - call: "POST /traceability/facilities"
              payload: { name: "F", gln: "C-3", initial_utc: "2026-01-01T00:00:00Z" }
              as: QualityManager
              captures: { fid: $.data.id }
            - call: "POST /traceability/suppliers"
              payload: { facility_id: "${fid}", name: "S", coa_required: false }
              as: QualityManager
              captures: { sup: $.data.id }
            - call: "POST /traceability/ingredients"
              payload: { facility_id: "${fid}", name: "I", storage_target_c: 4, shelf_life_days: 10 }
              as: QualityManager
              captures: { ing: $.data.id }
          trigger:
            - call: "POST /traceability/lots"
              payload: { facility_id: "${fid}", ingredient_id: "${ing}", lot_kind: "RAW_MATERIAL", received_qty: 5, production_date: "2026-01-01T00:00:00Z", supplier_id: "${sup}" }
              as: ReceivingClerk
              captures: { err: $.data.error_id }
          assert:
            - "err == \"ERR_INVALID_REQUEST\" (lot_code missing)"

      - name: ingredient_default_storage_tolerance_applied
        claim_type: Defaults
        grounds:
          - endpoints["POST /traceability/ingredients"]
          - entities.Ingredient.fields.storage_tolerance_c
        distinguishing_aspect: "Omitting storage_tolerance_c applies the default 2."
        test_recipe:
          setup: ["Facility."]
          setup_api_calls:
            - call: "POST /traceability/facilities"
              payload: { name: "F", gln: "C-4", initial_utc: "2026-01-01T00:00:00Z" }
              as: QualityManager
              captures: { fid: $.data.id }
          trigger:
            - call: "POST /traceability/ingredients"
              payload: { facility_id: "${fid}", name: "I", storage_target_c: 4, shelf_life_days: 10 }
              as: QualityManager
              captures: { tol: $.data.storage_tolerance_c }
          assert:
            - "tol == 2"

      - name: lot_id_system_minted_input_ignored
        claim_type: System Fields
        grounds:
          - endpoints["POST /traceability/lots"]
          - entities.Lot.fields.status
        distinguishing_aspect: "Server mints id/created_at/version; client-supplied status is ignored (always RECEIVED on create)."
        test_recipe:
          setup: ["Facility, supplier, ingredient."]
          setup_api_calls:
            - call: "POST /traceability/facilities"
              payload: { name: "F", gln: "C-5", initial_utc: "2026-01-01T00:00:00Z" }
              as: QualityManager
              captures: { fid: $.data.id }
            - call: "POST /traceability/suppliers"
              payload: { facility_id: "${fid}", name: "S", coa_required: false }
              as: QualityManager
              captures: { sup: $.data.id }
            - call: "POST /traceability/ingredients"
              payload: { facility_id: "${fid}", name: "I", storage_target_c: 4, shelf_life_days: 10 }
              as: QualityManager
              captures: { ing: $.data.id }
          trigger:
            - call: "POST /traceability/lots"
              payload: { facility_id: "${fid}", ingredient_id: "${ing}", lot_code: "LX", lot_kind: "RAW_MATERIAL", received_qty: 5, production_date: "2026-01-01T00:00:00Z", supplier_id: "${sup}" }
              as: ReceivingClerk
              captures: { st: $.data.status, ver: $.data.version }
          assert:
            - "st == \"RECEIVED\" and ver == 1"

      - name: allergen_profile_is_immutable_no_version
        claim_type: Immutability
        grounds:
          - entities.AllergenProfile
          - endpoints["POST /traceability/allergen-profiles"]
        distinguishing_aspect: "AllergenProfile is common_fields:false — created with id/created_at only, no version field, no update endpoint."
        test_recipe:
          setup: ["Facility."]
          setup_api_calls:
            - call: "POST /traceability/facilities"
              payload: { name: "F", gln: "C-6", initial_utc: "2026-01-01T00:00:00Z" }
              as: QualityManager
              captures: { fid: $.data.id }
          trigger:
            - call: "POST /traceability/allergen-profiles"
              payload: { facility_id: "${fid}", code: "MILK", name: "Milk", severity_rank: 4 }
              as: QualityManager
              captures: { ap_id: $.data.id, code: $.data.code }
          assert:
            - "ap_id present and code == \"MILK\" (no version field on AllergenProfile)"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: release_already_released_lot_returns_not_received
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Lot.RECEIVED_to_RELEASED
          - errors[ERR_LOT_NOT_RECEIVED]
          - validations[priority=8]
        distinguishing_aspect: "Releasing a lot already RELEASED -> ERR_LOT_NOT_RECEIVED; no second transition."
        test_recipe:
          setup: ["Facility, coa_required=false supplier, ingredient. Raw lot released once."]
          setup_api_calls:
            - call: "POST /traceability/facilities"
              payload: { name: "F", gln: "C-7", initial_utc: "2026-01-01T00:00:00Z" }
              as: QualityManager
              captures: { fid: $.data.id }
            - call: "POST /traceability/suppliers"
              payload: { facility_id: "${fid}", name: "S", coa_required: false }
              as: QualityManager
              captures: { sup: $.data.id }
            - call: "POST /traceability/ingredients"
              payload: { facility_id: "${fid}", name: "I", storage_target_c: 4, shelf_life_days: 30 }
              as: QualityManager
              captures: { ing: $.data.id }
            - call: "POST /traceability/lots"
              payload: { facility_id: "${fid}", ingredient_id: "${ing}", lot_code: "L", lot_kind: "RAW_MATERIAL", received_qty: 5, production_date: "2026-01-01T00:00:00Z", supplier_id: "${sup}" }
              as: ReceivingClerk
              captures: { lot: $.data.id }
            - call: "POST /traceability/lots/${lot}/release"
              payload: {}
              as: QualityManager
          trigger:
            - call: "POST /traceability/lots/${lot}/release"
              payload: {}
              as: QualityManager
              captures: { err: $.data.error_id }
          assert:
            - "err == \"ERR_LOT_NOT_RECEIVED\""

      - name: decide_coa_already_decided_returns_not_pending
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.CertificateOfAnalysis.PENDING_to_REJECTED
          - errors[ERR_COA_NOT_PENDING]
        distinguishing_aspect: "Deciding a COA already REJECTED -> ERR_COA_NOT_PENDING (terminal lock)."
        test_recipe:
          setup: ["Facility, coa_required supplier, ingredient, raw lot with a COA rejected once."]
          setup_api_calls:
            - call: "POST /traceability/facilities"
              payload: { name: "F", gln: "C-8", initial_utc: "2026-01-01T00:00:00Z" }
              as: QualityManager
              captures: { fid: $.data.id }
            - call: "POST /traceability/suppliers"
              payload: { facility_id: "${fid}", name: "S", coa_required: true }
              as: QualityManager
              captures: { sup: $.data.id }
            - call: "POST /traceability/ingredients"
              payload: { facility_id: "${fid}", name: "I", storage_target_c: 4, shelf_life_days: 30, declared_allergen_codes: ["MILK"] }
              as: QualityManager
              captures: { ing: $.data.id }
            - call: "POST /traceability/lots"
              payload: { facility_id: "${fid}", ingredient_id: "${ing}", lot_code: "L", lot_kind: "RAW_MATERIAL", received_qty: 5, production_date: "2026-01-01T00:00:00Z", supplier_id: "${sup}" }
              as: ReceivingClerk
              captures: { lot: $.data.id }
            - call: "POST /traceability/coa"
              payload: { lot_id: "${lot}", measured_allergen_codes: ["MILK"], pathogen_pass: true, declared_shelf_life_days: 30 }
              as: ReceivingClerk
              captures: { coa: $.data.id }
            - call: "POST /traceability/coa/${coa}/decide"
              payload: { decision: "REJECT" }
              as: QualityManager
          trigger:
            - call: "POST /traceability/coa/${coa}/decide"
              payload: { decision: "ACCEPT" }
              as: QualityManager
              captures: { err: $.data.error_id }
          assert:
            - "err == \"ERR_COA_NOT_PENDING\""

      - name: coa_accept_pathogen_fail_blocked
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.CertificateOfAnalysis.PENDING_to_ACCEPTED
          - errors[ERR_COA_PATHOGEN_FAIL]
        distinguishing_aspect: "Accepting a COA with pathogen_pass=false -> ERR_COA_PATHOGEN_FAIL; COA stays PENDING."
        test_recipe:
          setup: ["coa_required supplier, raw lot with a COA whose pathogen_pass=false."]
          setup_api_calls:
            - call: "POST /traceability/facilities"
              payload: { name: "F", gln: "C-9", initial_utc: "2026-01-01T00:00:00Z" }
              as: QualityManager
              captures: { fid: $.data.id }
            - call: "POST /traceability/suppliers"
              payload: { facility_id: "${fid}", name: "S", coa_required: true }
              as: QualityManager
              captures: { sup: $.data.id }
            - call: "POST /traceability/ingredients"
              payload: { facility_id: "${fid}", name: "I", storage_target_c: 4, shelf_life_days: 30, declared_allergen_codes: ["MILK"] }
              as: QualityManager
              captures: { ing: $.data.id }
            - call: "POST /traceability/lots"
              payload: { facility_id: "${fid}", ingredient_id: "${ing}", lot_code: "L", lot_kind: "RAW_MATERIAL", received_qty: 5, production_date: "2026-01-01T00:00:00Z", supplier_id: "${sup}" }
              as: ReceivingClerk
              captures: { lot: $.data.id }
            - call: "POST /traceability/coa"
              payload: { lot_id: "${lot}", measured_allergen_codes: ["MILK"], pathogen_pass: false, declared_shelf_life_days: 30 }
              as: ReceivingClerk
              captures: { coa: $.data.id }
          trigger:
            - call: "POST /traceability/coa/${coa}/decide"
              payload: { decision: "ACCEPT" }
              as: QualityManager
              captures: { err: $.data.error_id }
          assert:
            - "err == \"ERR_COA_PATHOGEN_FAIL\""

      - name: finalize_with_no_consumed_lots_returns_error
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.ProductionRun.OPEN_to_FINALIZED
          - errors[ERR_NO_CONSUMED_LOTS]
        distinguishing_aspect: "Finalizing an OPEN run with zero consumed-lot lines -> ERR_NO_CONSUMED_LOTS."
        test_recipe:
          setup: ["Facility, ingredient, an OPEN run with no consumed lots."]
          setup_api_calls:
            - call: "POST /traceability/facilities"
              payload: { name: "F", gln: "C-10", initial_utc: "2026-01-01T00:00:00Z" }
              as: QualityManager
              captures: { fid: $.data.id }
            - call: "POST /traceability/ingredients"
              payload: { facility_id: "${fid}", name: "I", storage_target_c: 4, shelf_life_days: 30 }
              as: QualityManager
              captures: { ing: $.data.id }
            - call: "POST /traceability/production-runs"
              payload: { facility_id: "${fid}", ingredient_id: "${ing}", planned_output_qty: 10 }
              as: ProductionOperator
              captures: { run: $.data.id, run_v: $.data.version }
          trigger:
            - call: "POST /traceability/production-runs/${run}/finalize"
              payload: { expected_production_run_version: "${run_v}" }
              as: ProductionOperator
              captures: { err: $.data.error_id }
          assert:
            - "err == \"ERR_NO_CONSUMED_LOTS\""

      - name: clock_advance_expires_released_free_lot
        claim_type: Side Effect Execution
        grounds:
          - state_machines.Lot.RELEASED_to_EXPIRED
          - endpoints["POST /traceability/facilities/{id}/clock"]
          - entities.Lot.fields.status
        distinguishing_aspect: "Advancing the clock past a RELEASED FREE lot's effective_expiration_date sweeps it to EXPIRED."
        test_recipe:
          setup: ["coa_required=false supplier, ingredient shelf 10. Released lot (effective_expiration 2026-01-11). Clock advanced to 2026-01-15."]
          setup_api_calls:
            - call: "POST /traceability/facilities"
              payload: { name: "F", gln: "C-11", initial_utc: "2026-01-01T00:00:00Z" }
              as: QualityManager
              captures: { fid: $.data.id }
            - call: "POST /traceability/suppliers"
              payload: { facility_id: "${fid}", name: "S", coa_required: false }
              as: QualityManager
              captures: { sup: $.data.id }
            - call: "POST /traceability/ingredients"
              payload: { facility_id: "${fid}", name: "I", storage_target_c: 4, shelf_life_days: 10 }
              as: QualityManager
              captures: { ing: $.data.id }
            - call: "POST /traceability/lots"
              payload: { facility_id: "${fid}", ingredient_id: "${ing}", lot_code: "L", lot_kind: "RAW_MATERIAL", received_qty: 5, production_date: "2026-01-01T00:00:00Z", supplier_id: "${sup}" }
              as: ReceivingClerk
              captures: { lot: $.data.id }
            - call: "POST /traceability/lots/${lot}/release"
              payload: {}
              as: QualityManager
          trigger:
            - call: "POST /traceability/facilities/${fid}/clock"
              payload: { to_utc: "2026-01-15T00:00:00Z" }
              as: QualityManager
            - call: "GET /traceability/lots/${lot}"
              payload: {}
              as: QualityManager
              captures: { st: $.data.status }
          assert:
            - "st == \"EXPIRED\""

      - name: clock_advance_skips_held_lot_expiry
        claim_type: Conditional cascade
        grounds:
          - state_machines.Lot.RELEASED_to_EXPIRED
          - entities.Lot.fields.hold_status
        distinguishing_aspect: "A RELEASED but HELD lot is NOT swept to EXPIRED when the clock advances past expiration; it stays RELEASED/HELD."
        test_recipe:
          setup: ["Released lot effective_expiration 2026-01-11 under an ACTIVE hold (HELD). Clock advanced to 2026-01-15."]
          setup_api_calls:
            - call: "POST /traceability/facilities"
              payload: { name: "F", gln: "C-12", initial_utc: "2026-01-01T00:00:00Z" }
              as: QualityManager
              captures: { fid: $.data.id }
            - call: "POST /traceability/suppliers"
              payload: { facility_id: "${fid}", name: "S", coa_required: false }
              as: QualityManager
              captures: { sup: $.data.id }
            - call: "POST /traceability/ingredients"
              payload: { facility_id: "${fid}", name: "I", storage_target_c: 4, shelf_life_days: 10 }
              as: QualityManager
              captures: { ing: $.data.id }
            - call: "POST /traceability/lots"
              payload: { facility_id: "${fid}", ingredient_id: "${ing}", lot_code: "L", lot_kind: "RAW_MATERIAL", received_qty: 5, production_date: "2026-01-01T00:00:00Z", supplier_id: "${sup}" }
              as: ReceivingClerk
              captures: { lot: $.data.id }
            - call: "POST /traceability/lots/${lot}/release"
              payload: {}
              as: QualityManager
            - call: "POST /traceability/hold-orders"
              payload: { facility_id: "${fid}", target_lot_id: "${lot}", reason: "OTHER" }
              as: QualityManager
          trigger:
            - call: "POST /traceability/facilities/${fid}/clock"
              payload: { to_utc: "2026-01-15T00:00:00Z" }
              as: QualityManager
            - call: "GET /traceability/lots/${lot}"
              payload: {}
              as: QualityManager
              captures: { st: $.data.status, hs: $.data.hold_status }
          assert:
            - "st == \"RELEASED\" and hs == \"HELD\" (HELD lot skipped by expiry sweep)"

      - name: clock_non_monotonic_rejected
        claim_type: Precondition Enforcement
        grounds:
          - endpoints["POST /traceability/facilities/{id}/clock"]
          - errors[ERR_CLOCK_NOT_MONOTONIC]
        distinguishing_aspect: "Advancing the clock to a time not strictly greater than current_utc -> ERR_CLOCK_NOT_MONOTONIC."
        test_recipe:
          setup: ["Facility clock at 2026-01-05."]
          setup_api_calls:
            - call: "POST /traceability/facilities"
              payload: { name: "F", gln: "C-13", initial_utc: "2026-01-05T00:00:00Z" }
              as: QualityManager
              captures: { fid: $.data.id }
          trigger:
            - call: "POST /traceability/facilities/${fid}/clock"
              payload: { to_utc: "2026-01-05T00:00:00Z" }
              as: QualityManager
              captures: { err: $.data.error_id }
          assert:
            - "err == \"ERR_CLOCK_NOT_MONOTONIC\" (not strictly greater)"

  # ---------------------------------------------------------------------------
  - section: calculations
    instances:
      - name: allergen_inheritance_union_and_controlling
        claim_type: Correct Result
        grounds:
          - calculations.allergen_inheritance
          - entities.Lot.fields.effective_allergen_codes
          - entities.Lot.fields.controlling_allergen_code
        distinguishing_aspect: "A FINISHED lot inherits union of source-lot effective allergens + output ingredient declared; controlling_allergen_code is the highest severity_rank (PEANUT rank 5 over WHEAT rank 2)."
        test_recipe:
          setup: ["Allergen profiles PEANUT(5), WHEAT(2). Raw lot of a PEANUT ingredient released. Finished produced from a WHEAT recipe ingredient consuming the peanut lot."]
          setup_api_calls:
            - call: "POST /traceability/facilities"
              payload: { name: "F", gln: "C-14", initial_utc: "2026-01-01T00:00:00Z" }
              as: QualityManager
              captures: { fid: $.data.id }
            - call: "POST /traceability/allergen-profiles"
              payload: { facility_id: "${fid}", code: "PEANUT", name: "Peanut", severity_rank: 5 }
              as: QualityManager
            - call: "POST /traceability/allergen-profiles"
              payload: { facility_id: "${fid}", code: "WHEAT", name: "Wheat", severity_rank: 2 }
              as: QualityManager
            - call: "POST /traceability/suppliers"
              payload: { facility_id: "${fid}", name: "S", coa_required: false }
              as: QualityManager
              captures: { sup: $.data.id }
            - call: "POST /traceability/ingredients"
              payload: { facility_id: "${fid}", name: "PeanutPaste", storage_target_c: 20, storage_tolerance_c: 5, shelf_life_days: 365, declared_allergen_codes: ["PEANUT"] }
              as: QualityManager
              captures: { ingP: $.data.id }
            - call: "POST /traceability/ingredients"
              payload: { facility_id: "${fid}", name: "Cookie", storage_target_c: 20, storage_tolerance_c: 5, shelf_life_days: 200, declared_allergen_codes: ["WHEAT"] }
              as: QualityManager
              captures: { ingC: $.data.id }
            - call: "POST /traceability/lots"
              payload: { facility_id: "${fid}", ingredient_id: "${ingP}", lot_code: "P1", lot_kind: "RAW_MATERIAL", received_qty: 50, production_date: "2026-01-01T00:00:00Z", supplier_id: "${sup}" }
              as: ReceivingClerk
              captures: { lotP: $.data.id }
            - call: "POST /traceability/lots/${lotP}/release"
              payload: {}
              as: QualityManager
            - call: "POST /traceability/production-runs"
              payload: { facility_id: "${fid}", ingredient_id: "${ingC}", planned_output_qty: 20 }
              as: ProductionOperator
              captures: { run: $.data.id }
            - call: "POST /traceability/production-runs/${run}/consumed-lots"
              payload: { source_lot_id: "${lotP}", quantity: 10 }
              as: ProductionOperator
            - call: "GET /traceability/production-runs/${run}"
              payload: {}
              as: ProductionOperator
              captures: { run_v: $.data.version }
          trigger:
            - call: "POST /traceability/production-runs/${run}/finalize"
              payload: { expected_production_run_version: "${run_v}" }
              as: ProductionOperator
              captures: { f_lot: $.data.output_lot_id }
            - call: "GET /traceability/lots/${f_lot}"
              payload: {}
              as: QualityManager
              captures: { ctrl: $.data.controlling_allergen_code }
          assert:
            - "ctrl == \"PEANUT\" (severity 5 beats WHEAT severity 2; effective set {PEANUT, WHEAT})"

      - name: fefo_blocks_consuming_later_expiring_lot
        claim_type: Correct Result
        grounds:
          - validations[priority=13]
          - calculations.effective_expiration
          - errors[ERR_FEFO_VIOLATION]
        distinguishing_aspect: "With two RELEASED FREE same-ingredient lots (A exp 2026-01-11, B exp 2026-01-06), consuming A while earlier-expiring B exists -> ERR_FEFO_VIOLATION."
        test_recipe:
          setup: ["coa_required=false supplier. Ingredient shelf 10. Lot A production 2026-01-01 (exp 01-11), Lot B production 2026-01-01 with explicit expiration 2026-01-06. Both RELEASED FREE. Run draws from A."]
          setup_api_calls:
            - call: "POST /traceability/facilities"
              payload: { name: "F", gln: "C-15", initial_utc: "2026-01-01T00:00:00Z" }
              as: QualityManager
