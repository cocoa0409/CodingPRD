  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: trip_start_blocked_when_rider_suspended
        grounds:
          - state_machines.Trip.ACTIVE_to_COMPLETED
          - state_machines.Rider.ACTIVE_to_SUSPENDED
          - entities.Rider.fields.status
        distinguishing_aspect: |
          Entity pair Trip<-Rider: a Trip can be ended only while Rider.status == ACTIVE; ending a trip whose
          rider was SUSPENDED mid-trip is rejected. (Pair 1 of 2.) Note the suspend itself does not block start
          because start requires AVAILABLE vehicle; this pins the rider-state dependency on the end transition.
        test_recipe:
          setup:
            - "an ACTIVE trip; the rider is then SUSPENDED by an admin"
          setup_api_calls:
            - call: "POST /api/plans"
              payload: { code: "STANDARD", unlock_fee_cents: 100, per_minute_cents: 30, daily_cap_cents: 0, slow_zone_discount_pct: 0 }
              as: PlatformAdmin
              captures: { std_plan_id: $.data.id }
            - call: "POST /api/zones"
              payload: { name: "Core11", zone_type: "RIDE_OK", priority: 5 }
              as: PlatformAdmin
              captures: { zone_ok_id: $.data.id }
            - call: "POST /api/vehicles"
              payload: { vehicle_type: "SCOOTER", qr_code: "QR-M1", battery_pct: 100, current_zone_id: "${zone_ok_id}" }
              as: PlatformAdmin
              captures: { veh_id: $.data.id }
            - call: "POST /api/riders"
              payload: { email: "m@x.com", full_name: "Rider M", plan_id: "${std_plan_id}" }
              as: Anonymous
              captures: { rider_id: $.data.id }
            - call: "POST /api/riders/${rider_id}/topup"
              payload: { amount_cents: 5000 }
              as: Rider
              as_user_id: "${rider_id}"
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-11T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/trips"
              payload: { rider_id: "${rider_id}", vehicle_id: "${veh_id}" }
              as: Rider
              as_user_id: "${rider_id}"
              captures: { trip_id: $.data.id }
            - call: "POST /api/riders/${rider_id}/suspend"
              payload: {}
              as: PlatformAdmin
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-11T00:03:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/trips/${trip_id}/end"
              payload: { end_zone_id: "${zone_ok_id}" }
              as: Rider
              as_user_id: "${rider_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE (409) because Rider.status == SUSPENDED at end time"

      - name: rider_change_plan_to_low_income_requires_approved_application
        grounds:
          - validations[priority=12]
          - state_machines.LowIncomeApplication.SUBMITTED_to_APPROVED
          - entities.LowIncomeApplication.fields.status
        distinguishing_aspect: |
          Entity pair Rider<-LowIncomeApplication (different pair than Trip<-Rider): a rider may only switch to a
          LOW_INCOME plan when they own a LowIncomeApplication in status APPROVED; switching with only a
          SUBMITTED application is rejected with ERR_NO_APPROVED_APPLICATION.
        test_recipe:
          setup:
            - "LOW_INCOME plan exists; a rider with a SUBMITTED (not yet approved) application"
          setup_api_calls:
            - call: "POST /api/plans"
              payload: { code: "STANDARD", unlock_fee_cents: 100, per_minute_cents: 30, daily_cap_cents: 0, slow_zone_discount_pct: 0 }
              as: PlatformAdmin
              captures: { std_plan_id: $.data.id }
            - call: "POST /api/plans"
              payload: { code: "LOW_INCOME", unlock_fee_cents: 50, per_minute_cents: 15, daily_cap_cents: 500, slow_zone_discount_pct: 0.50 }
              as: PlatformAdmin
              captures: { li_plan_id: $.data.id }
            - call: "POST /api/riders"
              payload: { email: "n@x.com", full_name: "Rider N", plan_id: "${std_plan_id}" }
              as: Anonymous
              captures: { rider_id: $.data.id, rider_v: $.data.version }
            - call: "POST /api/low-income-applications"
              payload: { rider_id: "${rider_id}", household_size: 2, annual_income_cents: 4000000 }
              as: Rider
              as_user_id: "${rider_id}"
              captures: { app_id: $.data.id }
          trigger:
            - call: "POST /api/riders/${rider_id}/change-plan"
              payload: { plan_id: "${li_plan_id}", expected_rider_version: "${rider_v}" }
              as: Rider
              as_user_id: "${rider_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NO_APPROVED_APPLICATION (422)"
            - "Rider.${rider_id}.plan_id still == ${std_plan_id}"

  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: technician_assigned_windows_buffered_overlap_rejected
        grounds:
          - validations[priority=11]
          - state_machines.RebalancingTask.OPEN_to_ASSIGNED
          - entities.RebalancingTask.fields.window_start
          - entities.RebalancingTask.fields.window_end
        distinguishing_aspect: |
          Resource = Technician, interval semantics = CLOSED intervals plus a 600s buffer on each side: a second
          task whose window starts 300s after the first task's window_end is still rejected because 300s < the
          600s buffer, so the buffered intervals collide. (Buffered-closed semantics, distinct from Trip's
          half-open no-buffer occupancy.)
        test_recipe:
          setup:
            - "a technician on shift; one ASSIGNED task with window 10:00-11:00; a second OPEN task with window 11:05-12:00 on a different vehicle"
          setup_api_calls:
            - call: "POST /api/zones"
              payload: { name: "Depot", zone_type: "RIDE_OK", priority: 5 }
              as: PlatformAdmin
              captures: { zone_ok_id: $.data.id }
            - call: "POST /api/technicians"
              payload: { name: "Tech T", depot_zone_id: "${zone_ok_id}", on_shift: true }
              as: PlatformAdmin
              captures: { tech_id: $.data.id }
            - call: "POST /api/vehicles"
              payload: { vehicle_type: "SCOOTER", qr_code: "QR-O1", battery_pct: 50, current_zone_id: "${zone_ok_id}" }
              as: PlatformAdmin
              captures: { veh1_id: $.data.id, veh1_v: $.data.version }
            - call: "POST /api/vehicles"
              payload: { vehicle_type: "SCOOTER", qr_code: "QR-O2", battery_pct: 50, current_zone_id: "${zone_ok_id}" }
              as: PlatformAdmin
              captures: { veh2_id: $.data.id, veh2_v: $.data.version }
            - call: "POST /api/rebalancing-tasks"
              payload: { vehicle_id: "${veh1_id}", task_type: "MOVE", target_zone_id: "${zone_ok_id}", window_start: "2026-06-12T10:00:00Z", window_end: "2026-06-12T11:00:00Z", expected_vehicle_version: "${veh1_v}" }
              as: PlatformAdmin
              captures: { task1_id: $.data.id }
            - call: "POST /api/rebalancing-tasks"
              payload: { vehicle_id: "${veh2_id}", task_type: "MOVE", target_zone_id: "${zone_ok_id}", window_start: "2026-06-12T11:05:00Z", window_end: "2026-06-12T12:00:00Z", expected_vehicle_version: "${veh2_v}" }
              as: PlatformAdmin
              captures: { task2_id: $.data.id }
            - call: "POST /api/rebalancing-tasks/${task1_id}/assign"
              payload: { technician_id: "${tech_id}" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/rebalancing-tasks/${task2_id}/assign"
              payload: { technician_id: "${tech_id}" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_TECH_WINDOW_OVERLAP (409): 11:05 start is only 300s after 11:00 end, inside the 600s buffer"

      - name: vehicle_no_overlapping_active_trip_half_open
        grounds:
          - validations[priority=10]
          - state_machines.Vehicle.AVAILABLE_to_RESERVED
          - entities.Vehicle.fields.status
        distinguishing_aspect: |
          Resource = Vehicle, interval semantics = HALF-OPEN occupancy with NO buffer: while a trip occupies a
          vehicle (IN_USE) no second trip may start; but the instant the first trip ends (vehicle back AVAILABLE)
          a new trip may start in the same second, demonstrating the half-open (end-exclusive) boundary distinct
          from the technician's buffered-closed semantics.
        test_recipe:
          setup:
            - "a vehicle, two funded riders; rider1 starts then ends a trip; rider2 starts a new trip in the same second the first ended"
          setup_api_calls:
            - call: "POST /api/plans"
              payload: { code: "STANDARD", unlock_fee_cents: 100, per_minute_cents: 30, daily_cap_cents: 0, slow_zone_discount_pct: 0 }
              as: PlatformAdmin
              captures: { std_plan_id: $.data.id }
            - call: "POST /api/zones"
              payload: { name: "Core13", zone_type: "RIDE_OK", priority: 5 }
              as: PlatformAdmin
              captures: { zone_ok_id: $.data.id }
            - call: "POST /api/vehicles"
              payload: { vehicle_type: "SCOOTER", qr_code: "QR-P1", battery_pct: 100, current_zone_id: "${zone_ok_id}" }
              as: PlatformAdmin
              captures: { veh_id: $.data.id }
            - call: "POST /api/riders"
              payload: { email: "p1@x.com", full_name: "Rider P1", plan_id: "${std_plan_id}" }
              as: Anonymous
              captures: { rider1_id: $.data.id }
            - call: "POST /api/riders"
              payload: { email: "p2@x.com", full_name: "Rider P2", plan_id: "${std_plan_id}" }
              as: Anonymous
              captures: { rider2_id: $.data.id }
            - call: "POST /api/riders/${rider1_id}/topup"
              payload: { amount_cents: 5000 }
              as: Rider
              as_user_id: "${rider1_id}"
            - call: "POST /api/riders/${rider2_id}/topup"
              payload: { amount_cents: 5000 }
              as: Rider
              as_user_id: "${rider2_id}"
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-13T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/trips"
              payload: { rider_id: "${rider1_id}", vehicle_id: "${veh_id}" }
              as: Rider
              as_user_id: "${rider1_id}"
              captures: { trip1_id: $.data.id }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-13T00:05:00Z" }
              as: PlatformAdmin
            - call: "POST /api/trips/${trip1_id}/end"
              payload: { end_zone_id: "${zone_ok_id}" }
              as: Rider
              as_user_id: "${rider1_id}"
          trigger:
            - call: "POST /api/trips"
              payload: { rider_id: "${rider2_id}", vehicle_id: "${veh_id}" }
              as: Rider
              as_user_id: "${rider2_id}"
              captures: { trip2_status: $.data.status }
          assert:
            - "POST /api/trips by rider2 returns 201; Trip.status == ACTIVE; the vehicle was AVAILABLE again at the same instant (half-open occupancy)"

  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: fine_charge_then_waive_refund_conserves_wallet_money
        grounds:
          - state_machines.Trip.ACTIVE_to_COMPLETED
          - state_machines.Fine.DISPUTED_to_WAIVED
          - entities.WalletTransaction.fields.amount_cents
          - entities.Rider.fields.wallet_balance_cents
        distinguishing_aspect: |
          Conserved quantity = MONEY (wallet_balance_cents). After a FINE_CHARGE debit on trip-end and a later
          FINE_REFUND credit on waive, the rider's wallet_balance_cents equals its pre-fine value (trip charge
          aside): the signed sum of the FINE_CHARGE and FINE_REFUND WalletTransactions for the fine is 0.
        test_recipe:
          setup:
            - "rider with wallet 5000 ends a trip in NO_PARK (fare 160, fine 2500), then disputes and the fine is waived"
          setup_api_calls:
            - call: "POST /api/plans"
              payload: { code: "STANDARD", unlock_fee_cents: 100, per_minute_cents: 30, daily_cap_cents: 0, slow_zone_discount_pct: 0 }
              as: PlatformAdmin
              captures: { std_plan_id: $.data.id }
            - call: "POST /api/zones"
              payload: { name: "Core14", zone_type: "RIDE_OK", priority: 5 }
              as: PlatformAdmin
              captures: { zone_ok_id: $.data.id }
            - call: "POST /api/zones"
              payload: { name: "NoPark14", zone_type: "NO_PARK", priority: 3 }
              as: PlatformAdmin
              captures: { zone_nopark_id: $.data.id }
            - call: "POST /api/vehicles"
              payload: { vehicle_type: "SCOOTER", qr_code: "QR-Q1", battery_pct: 100, current_zone_id: "${zone_ok_id}" }
              as: PlatformAdmin
              captures: { veh_id: $.data.id }
            - call: "POST /api/riders"
              payload: { email: "q@x.com", full_name: "Rider Q", plan_id: "${std_plan_id}" }
              as: Anonymous
              captures: { rider_id: $.data.id }
            - call: "POST /api/riders/${rider_id}/topup"
              payload: { amount_cents: 5000 }
              as: Rider
              as_user_id: "${rider_id}"
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-14T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/trips"
              payload: { rider_id: "${rider_id}", vehicle_id: "${veh_id}" }
              as: Rider
              as_user_id: "${rider_id}"
              captures: { trip_id: $.data.id }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-14T00:01:30Z" }
              as: PlatformAdmin
            - call: "POST /api/trips/${trip_id}/end"
              payload: { end_zone_id: "${zone_nopark_id}" }
              as: Rider
              as_user_id: "${rider_id}"
            - call: "GET /api/fines?rider_id=${rider_id}"
              payload: {}
              as: Rider
              as_user_id: "${rider_id}"
              captures: { fine_id: "$.data[0].id" }
            - call: "POST /api/fines/${fine_id}/dispute"
              payload: {}
              as: Rider
              as_user_id: "${rider_id}"
          trigger:
            - call: "POST /api/fines/${fine_id}/waive"
              payload: {}
              as: PlatformAdmin
            - call: "GET /api/riders/${rider_id}"
              payload: {}
              as: Rider
              as_user_id: "${rider_id}"
              captures: { wallet_after: $.data.wallet_balance_cents }
          assert:
            - "Rider.${rider_id}.wallet_balance_cents == 4840 (5000 - 160 trip charge; the 2500 FINE_CHARGE and +2500 FINE_REFUND net to 0)"
            - "Rider.${rider_id}.outstanding_fine_cents == 0"

      - name: swap_task_completion_conserves_fleet_headcount
        grounds:
          - state_machines.Vehicle.IN_USE_to_LOW_BATTERY
          - state_machines.RebalancingTask.ASSIGNED_to_COMPLETED
          - state_machines.Vehicle.LOW_BATTERY_to_AVAILABLE
          - entities.Vehicle.fields.status
        distinguishing_aspect: |
          Conserved quantity = FLEET HEADCOUNT (different from money): a vehicle that drops to LOW_BATTERY on
          trip-end and is later revived to AVAILABLE by a completed SWAP task keeps the count of non-RETIRED
          vehicles constant — the SWAP forward action (LOW_BATTERY) and its completion (AVAILABLE) leave the
          total vehicle count unchanged; the vehicle is never destroyed or duplicated, and its battery is reset
          to 100.
        test_recipe:
          setup:
            - "two vehicles registered (total_count == 2); the scooter goes LOW_BATTERY after a trip, auto-creating an OPEN SWAP task; that task is assigned to a technician and completed"
          setup_api_calls:
            - call: "POST /api/plans"
              payload: { code: "STANDARD", unlock_fee_cents: 100, per_minute_cents: 30, daily_cap_cents: 0, slow_zone_discount_pct: 0 }
              as: PlatformAdmin
              captures: { std_plan_id: $.data.id }
            - call: "POST /api/zones"
              payload: { name: "Core15", zone_type: "RIDE_OK", priority: 5 }
              as: PlatformAdmin
              captures: { zone_ok_id: $.data.id }
            - call: "POST /api/technicians"
              payload: { name: "Tech U", depot_zone_id: "${zone_ok_id}", on_shift: true }
              as: PlatformAdmin
              captures: { tech_id: $.data.id }
            - call: "POST /api/vehicles"
              payload: { vehicle_type: "EBIKE", qr_code: "QR-R1", battery_pct: 100, current_zone_id: "${zone_ok_id}" }
              as: PlatformAdmin
              captures: { veh_other_id: $.data.id }
            - call: "POST /api/vehicles"
              payload: { vehicle_type: "SCOOTER", qr_code: "QR-R2", battery_pct: 20, current_zone_id: "${zone_ok_id}" }
              as: PlatformAdmin
              captures: { veh_id: $.data.id }
            - call: "GET /api/vehicles"
              payload: {}
              as: PlatformAdmin
              captures: { total_before: $.total_count }
            - call: "POST /api/riders"
              payload: { email: "r@x.com", full_name: "Rider R", plan_id: "${std_plan_id}" }
              as: Anonymous
              captures: { rider_id: $.data.id }
            - call: "POST /api/riders/${rider_id}/topup"
              payload: { amount_cents: 5000 }
              as: Rider
              as_user_id: "${rider_id}"
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/trips"
              payload: { rider_id: "${rider_id}", vehicle_id: "${veh_id}" }
              as: Rider
              as_user_id: "${rider_id}"
              captures: { trip_id: $.data.id }
            - call: "POST /api/_vehicles/${veh_id}/set_battery"
              payload: { battery_pct: 10 }
              as: PlatformAdmin
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T10:01:30Z" }
              as: PlatformAdmin
            - call: "POST /api/trips/${trip_id}/end"
              payload: { end_zone_id: "${zone_ok_id}" }
              as: Rider
              as_user_id: "${rider_id}"
            - call: "GET /api/rebalancing-tasks?vehicle_id=${veh_id}"
              payload: {}
              as: PlatformAdmin
              captures: { task_id: "$.data[0].id" }
            - call: "POST /api/rebalancing-tasks/${task_id}/assign"
              payload: { technician_id: "${tech_id}" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/rebalancing-tasks/${task_id}/complete"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "GET /api/vehicles/${veh_id}"
              payload: {}
              as: PlatformAdmin
              captures: { veh_status: $.data.status, veh_batt: $.data.battery_pct }
            - call: "GET /api/vehicles"
              payload: {}
              as: PlatformAdmin
              captures: { total_after: $.total_count }
          assert:
            - "Vehicle.${veh_id}.status == AVAILABLE after SWAP completion"
            - "Vehicle.${veh_id}.battery_pct == 100"
            - "GET /api/vehicles total_count == 2 both before and after (fleet headcount conserved; total_before == total_after == 2)"
