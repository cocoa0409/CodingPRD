scenario: |
  Generate task harder than expert level!

  2543. Wine Grape Contract & Weigh Tag Settlement (winery grower relations): contract structure by tonnage, acreage or block with price per ton and quality specifications, sugar, acid and rot tolerance specifications with rejection and price adjustment provisions, harvest scheduling with sampling, pick call notification and delivery appointment slots, weigh tag capture at the crush pad with gross, tare and net weights by block, quality grading at receipt with penalties, bonuses and load rejection procedures, tonnage cap enforcement with over-delivery acceptance or rejection rules, payment schedule with installments and statutory producer lien protections, multi-year contract renewal, evergreen provisions and termination notice
domain_name: wine-grape-contract-weigh-tag-settlement
api_prefix: /grower-relations

complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: quota_allocation
  complexity_layers:
    - dual_variant_calculation
    - rate_threshold_triggers
    - cascading_side_effects
    - optimistic_concurrency

  entity_topology: flat
  # Every entity is a peer addressed at `/grower-relations/<collection>/{id}`; parentage is
  # expressed only through FK body fields, never through nested URL paths. Children are
  # discovered through filtered-list GETs (`?contract_id=`, `?weigh_tag_id=`, ...).

  state_machine_shape: parallel
  # GrapeContract carries two independent dimensions (lifecycle_status x renewal_status) and
  # its lifecycle dimension is cyclic (OFFERED <-> COUNTERED, bounded by MAX_OFFER_ROUNDS).
  # WeighTag carries two independent dimensions (weigh_status x disposition), and PickCall is
  # cyclic (ACKNOWLEDGED -> ISSUED on revision, SUSPENDED_CAP -> ISSUED on cap reinstatement).

  relationship_patterns:
    - one_to_many        # GrapeContract -> PickCall -> DeliveryAppointment -> WeighTag -> SettlementLine
    - many_to_many       # GrapeContract <-> VineyardBlock through ContractBlockAllocation
    - cross_aggregate    # WeighTag.block_id crosses into the VineyardBlock aggregate; SettlementLine.contract_id crosses back to GrapeContract

  role_model: segregation_of_duties
  # ScaleOperator captures weights, QualityLabTech/ScaleOperator grade, but the SAME X-User-ID
  # may never both capture a tag's gross weight and record that tag's QualityGrade.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Grower
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Legal name of the grape producer.
        constraints: 1-120 chars, non-blank
      - name: license_number
        type: string
        source: input
        description: State producer license identifier.
        constraints: unique across Growers; 4-32 chars
      - name: region_code
        type: string
        source: input
        description: Growing region code used to match SamplingCrew coverage.
        constraints: uppercase A-Z and hyphen, 2-16 chars
      - name: status
        type: enum
        source: input
        description: Grower standing.
        default: ACTIVE
        constraints: "ACTIVE | SUSPENDED"
      - name: rejected_load_count_vintage
        type: integer
        source: computed
        description: Count of WeighTags whose disposition is in {REJECTED_QUALITY, REJECTED_OVER_CAP} and whose created_at UTC calendar year equals the logical clock's current UTC calendar year, across all contracts of this Grower.
      - name: expired_pick_call_count_vintage
        type: integer
        source: computed
        description: Count of PickCalls with status EXPIRED whose created_at UTC calendar year equals the current vintage, across all contracts of this Grower.
      - name: no_show_appointment_count_vintage
        type: integer
        source: computed
        description: Count of DeliveryAppointments with status NO_SHOW whose created_at UTC calendar year equals the current vintage, reached through PickCall.contract_id of this Grower's contracts.
      - name: prior_vintage_penalty_units
        type: integer
        source: computed
        description: Sum of penalty units (8 per rejected load, 5 per expired pick call, 3 per no-show appointment) over every UTC calendar year strictly before the current vintage.
      - name: reliability_score_vintage
        type: number
        source: computed
        description: Vintage-scoped reliability score per calculations.grower_reliability_score variant VINTAGE_SCOPED; 0-100.
      - name: reliability_score_lifetime
        type: number
        source: computed
        description: Lifetime-scoped reliability score per calculations.grower_reliability_score variant LIFETIME_SCOPED; 0-100.
      - name: outstanding_lien_balance_cents
        type: integer
        source: computed
        description: Sum over every PaymentInstallment with lien_protected=true and status in {SCHEDULED, PARTIALLY_PAID, DELINQUENT} belonging to this Grower's contracts of (planned_amount_cents - paid_amount_cents).

  - name: VineyardBlock
    parent: null
    common_fields: true
    fields:
      - name: grower_id
        type: string
        source: input
        description: FK -> Grower.id; the producer that farms this block.
      - name: block_code
        type: string
        source: input
        description: Grower-scoped block label printed on the weigh tag.
        constraints: unique per (grower_id, block_code)
      - name: varietal
        type: string
        source: input
        description: Grape varietal planted in the block.
        constraints: uppercase A-Z and underscore, 3-40 chars
      - name: acres
        type: number
        source: input
        description: Planted acreage of the block.
        constraints: "> 0, 3 decimal places"
      - name: expected_yield_tons_per_acre
        type: number
        source: input
        description: Agronomic yield estimate used for BLOCK-basis cap derivation.
        constraints: "> 0, 3 decimal places"
      - name: ava_code
        type: string
        source: input
        description: American Viticultural Area code recorded for appellation reporting.
        constraints: uppercase A-Z and hyphen, 2-24 chars
      - name: status
        type: enum
        source: input
        description: Block availability.
        default: ACTIVE
        constraints: "ACTIVE | RETIRED"
      - name: latest_sampling_brix
        type: number
        source: computed
        description: measured_brix of the SamplingVisit for this block with status COMPLETED and the greatest sampled_at (tie-break created_at ASC); null when no COMPLETED visit exists.
      - name: latest_sampling_rot_pct
        type: number
        source: computed
        description: measured_rot_pct of the same COMPLETED SamplingVisit selected for latest_sampling_brix; null when none exists.
      - name: delivered_net_tons_vintage
        type: number
        source: computed
        description: Sum of net_tons over WeighTags with block_id equal to this block, weigh_status NET_FINAL, disposition in {ACCEPTED, PARTIALLY_ACCEPTED}, created_at UTC year equal to the current vintage; 3 decimal places.

  - name: QualitySpec
    parent: null
    common_fields: true
    fields:
      - name: spec_code
        type: string
        source: input
        description: Human-readable specification code referenced by contracts.
        constraints: unique across QualitySpecs; 3-32 chars
      - name: min_brix_pick_call
        type: number
        source: input
        description: Minimum COMPLETED sampling Brix that allows a PickCall to be issued for a block.
        default: 21.0
        constraints: "> 0, 1 decimal place"
      - name: min_brix_accept
        type: number
        source: input
        description: Minimum graded Brix at receipt; below this the load is rejected on quality.
        constraints: "> 0, 1 decimal place"
      - name: brix_bonus_start
        type: number
        source: input
        description: Brix strictly above this earns bonus steps.
        constraints: "> min_brix_accept, 1 decimal place"
      - name: brix_penalty_start
        type: number
        source: input
        description: Brix strictly below this incurs penalty steps.
        constraints: ">= min_brix_accept and <= brix_bonus_start, 1 decimal place"
      - name: brix_step
        type: number
        source: input
        description: Brix increment that constitutes one bonus or penalty step.
        default: 0.5
        constraints: "> 0, 1 decimal place"
      - name: brix_bonus_pct_per_step
        type: number
        source: input
        description: Price adjustment percentage points earned per bonus step.
        default: 1.5
        constraints: ">= 0, 1 decimal place"
      - name: brix_penalty_pct_per_step
        type: number
        source: input
        description: Price adjustment percentage points lost per penalty step.
        default: 2.0
        constraints: ">= 0, 1 decimal place"
      - name: ta_min_gl
        type: number
        source: input
        description: Minimum titratable acidity in grams per litre.
        default: 5.5
        constraints: "> 0, 1 decimal place"
      - name: ta_max_gl
        type: number
        source: input
        description: Maximum titratable acidity in grams per litre.
        default: 9.0
        constraints: "> ta_min_gl, 1 decimal place"
      - name: acid_out_of_spec_penalty_pct
        type: number
        source: input
        description: Flat percentage-point penalty applied when measured TA falls outside [ta_min_gl, ta_max_gl].
        default: 3.0
        constraints: ">= 0, 1 decimal place"
      - name: rot_free_pct
        type: number
        source: input
        description: Rot percentage tolerated with no penalty.
        default: 2.0
        constraints: ">= 0, 1 decimal place"
      - name: rot_penalty_pct_per_point
        type: number
        source: input
        description: Percentage-point penalty per whole rot point above rot_free_pct.
        default: 1.5
        constraints: ">= 0, 1 decimal place"
      - name: rot_rejection_pct
        type: number
        source: input
        description: Rot percentage at or above which the load must be rejected at receipt.
        constraints: "> rot_free_pct, 1 decimal place"
      - name: mog_max_pct
        type: number
        source: input
        description: Maximum tolerated material-other-than-grapes percentage.
        default: 1.0
        constraints: ">= 0, 1 decimal place"
      - name: mog_penalty_pct
        type: number
        source: input
        description: Flat percentage-point penalty when MOG exceeds mog_max_pct.
        default: 2.5
        constraints: ">= 0, 1 decimal place"
      - name: max_total_bonus_pct
        type: number
        source: input
        description: Ceiling applied to the summed adjustment components.
        default: 8.0
        constraints: ">= 0, 1 decimal place"
      - name: max_total_penalty_pct
        type: number
        source: input
        description: Floor magnitude applied to the summed adjustment components.
        default: 20.0
        constraints: ">= 0 and <= 100, 1 decimal place"

  - name: GrapeContract
    parent: null
    common_fields: true
    fields:
      - name: grower_id
        type: string
        source: input
        description: FK -> Grower.id; counterparty of the contract.
      - name: quality_spec_id
        type: string
        source: input
        description: FK -> QualitySpec.id; thresholds that drive grading, rejection and price adjustment.
      - name: contract_code
        type: string
        source: input
        description: Winery-facing contract identifier.
        constraints: unique across GrapeContracts; 3-32 chars
      - name: contract_basis
        type: enum
        source: input
        description: Structure of the tonnage commitment.
        constraints: "TONNAGE | ACREAGE | BLOCK"
      - name: base_price_per_ton_cents
        type: integer
        source: input
        description: Contract price per net ton in whole cents before quality adjustment.
        constraints: "> 0"
      - name: committed_tons
        type: number
        source: input
        description: Committed tonnage; required when contract_basis is TONNAGE and forbidden otherwise.
        constraints: "> 0, 3 decimal places, nullable"
      - name: contracted_yield_tons_per_acre
        type: number
        source: input
        description: Contractual yield used with allocated acreage; required when contract_basis is ACREAGE and forbidden otherwise.
        constraints: "> 0, 3 decimal places, nullable"
      - name: over_delivery_policy
        type: enum
        source: input
        description: Treatment of tonnage above contract_cap_tons but at or below hard_cap_tons.
        constraints: "ACCEPT_AT_CONTRACT | ACCEPT_AT_SPOT | REJECT"
      - name: spot_price_pct
        type: number
        source: input
        description: Percentage of base_price_per_ton_cents paid on OVER_DELIVERY tonnage when over_delivery_policy is ACCEPT_AT_SPOT.
        default: 70.0
        constraints: "> 0 and <= 100, 1 decimal place"
      - name: over_delivery_tolerance_pct
        type: number
        source: input
        description: Percentage of contract_cap_tons that may still be received above the cap before tonnage is refused outright.
        default: 10.0
        constraints: ">= 0 and <= 100, 1 decimal place"
      - name: settlement_basis
        type: enum
        source: input
        description: Selects which final-settlement algorithm variant runs at settlement close.
        default: LOAD_BY_LOAD
        constraints: "LOAD_BY_LOAD | WEIGHTED_BLEND"
      - name: provisional_payment_pct
        type: number
        source: input
        description: Percentage of each SettlementLine's gross amount advanced provisionally at grading.
        default: 60.0
        constraints: "> 0 and <= 100, 1 decimal place"
      - name: lien_holdback_pct
        type: number
        source: input
        description: Percentage of the settlement total withheld until statutory producer-lien release.
        default: 5.0
        constraints: ">= 0 and <= 50, 1 decimal place"
      - name: min_pick_notice_hours
        type: integer
        source: input
        description: Minimum whole hours of notice between PickCall.issued_at and target_pick_at.
        default: 48
        constraints: ">= 0"
      - name: pick_call_ack_window_hours
        type: integer
        source: input
        description: Whole hours the grower has to acknowledge a PickCall before it expires.
        default: 24
        constraints: "> 0"
      - name: term_start_vintage
        type: integer
        source: input
        description: First UTC calendar year covered by the contract term.
        constraints: 2000-2100
      - name: term_end_vintage
        type: integer
        source: input
        description: Last UTC calendar year covered by the current term; advanced by renewal and evergreen roll.
        constraints: ">= term_start_vintage, 2000-2100"
      - name: evergreen_flag
        type: boolean
        source: input
        description: When true the term rolls forward automatically once the renewal window closes without an explicit renewal or termination notice.
        default: false
      - name: evergreen_term_years
        type: integer
        source: input
        description: Years added to term_end_vintage on an evergreen roll.
        default: 1
        constraints: 1-5
      - name: termination_notice_days
        type: integer
        source: input
        description: Minimum whole days between a termination notice and its effective instant; also the width of the renewal window.
        default: 90
        constraints: ">= 1"
      - name: installment_plan
        type: array
        source: input
        description: Ordered payment schedule template; each element is { installment_no integer, pct_of_settlement number, due_offset_days integer, lien_protected boolean }. Materialised into PaymentInstallment rows on accept.
        constraints: 1-6 elements, installment_no values are 1..n with no gaps, pct_of_settlement values sum to exactly 100.0
      - name: lifecycle_status
        type: enum
        source: computed
        description: Contract lifecycle dimension; see state_machines.GrapeContract (dimension lifecycle_status).
        default: DRAFT
        constraints: "DRAFT | OFFERED | COUNTERED | ACTIVE | SETTLED | CLOSED | TERMINATION_PENDING | TERMINATED | WITHDRAWN"
      - name: renewal_status
        type: enum
        source: computed
        description: Renewal dimension, independent of lifecycle_status; see state_machines.GrapeContract (dimension renewal_status).
        default: NOT_DUE
        constraints: "NOT_DUE | RENEWAL_WINDOW_OPEN | RENEWED | EVERGREEN_ROLLED | NOT_RENEWING"
      - name: offer_round
        type: integer
        source: computed
        description: Number of times the winery has put the contract on the table; incremented by every offer transition.
        default: 0
      - name: countered_price_per_ton_cents
        type: integer
        source: computed
        description: Most recent grower counter price; null until a counter transition occurs.
      - name: contract_cap_tons
        type: number
        source: computed
        description: Soft tonnage cap per calculations.tonnage_cap_derivation; computed on the accept transition; 3 decimal places.
      - name: hard_cap_tons
        type: number
        source: computed
        description: contract_cap_tons inflated by over_delivery_tolerance_pct per calculations.tonnage_cap_derivation; 3 decimal places.
      - name: cap_scope
        type: enum
        source: computed
        description: PER_BLOCK when contract_basis is BLOCK, otherwise PER_CONTRACT; selects whether the waterfall consumes per-allocation or contract-wide remaining capacity.
        constraints: "PER_CONTRACT | PER_BLOCK"
      - name: delivered_contract_tons
        type: number
        source: computed
        description: Running sum of tons on SettlementLines with bucket CONTRACT and status in {PROVISIONAL, FINAL} for this contract; 3 decimal places.
      - name: delivered_over_tons
        type: number
        source: computed
        description: Running sum of tons on SettlementLines with bucket OVER_DELIVERY and status in {PROVISIONAL, FINAL} for this contract; 3 decimal places.
      - name: rejected_tons
        type: number
        source: computed
        description: Running sum of WeighTag.over_rejected_tons plus WeighTag.excess_rejected_tons plus net_tons of tags with disposition REJECTED_QUALITY or REJECTED_OVER_CAP, for tags whose appointment resolves to this contract; 3 decimal places.
      - name: tonnage_status
        type: enum
        source: computed
        description: Cap posture derived after every grading cascade; OPEN while delivered_contract_tons < contract_cap_tons, CAP_REACHED once delivered_contract_tons >= contract_cap_tons, HARD_CAP_REACHED once delivered_contract_tons + delivered_over_tons >= hard_cap_tons.
        default: OPEN
        constraints: "OPEN | CAP_REACHED | HARD_CAP_REACHED"
      - name: provisional_settlement_cents
        type: integer
        source: computed
        description: Sum of provisional_amount_cents over SettlementLines of this contract with status PROVISIONAL.
      - name: final_settlement_cents
        type: integer
        source: computed
        description: Sum of final_amount_cents over SettlementLines of this contract with status FINAL; 0 before settlement close.
      - name: prompt_pay_credit_cents
        type: integer
        source: computed
        description: Prompt-payment credit per calculations.net_payable_derivation step 3; 0 before settlement close.
      - name: lien_holdback_cents
        type: integer
        source: computed
        description: Statutory producer-lien holdback per calculations.net_payable_derivation step 4; 0 before settlement close.
      - name: net_payable_cents
        type: integer
        source: computed
        description: Amount distributed across PaymentInstallments per calculations.net_payable_derivation step 5; 0 before settlement close.
      - name: settlement_closed_at
        type: datetime
        source: computed
        description: Logical-clock instant of the settlement close transition; null before it.
      - name: renewal_window_opens_at
        type: datetime
        source: computed
        description: ISO instant termination_notice_days before renewal_window_closes_at; computed on accept and recomputed on every renewal or evergreen roll.
      - name: renewal_window_closes_at
        type: datetime
        source: computed
        description: "ISO instant <term_end_vintage>-11-01T00:00:00Z; recomputed whenever term_end_vintage changes."
      - name: termination_effective_at
        type: datetime
        source: computed
        description: Effective instant carried by the accepted termination notice; null until a notice is served.
      - name: lien_released_at
        type: datetime
        source: computed
        description: Logical-clock instant at which every lien_protected PaymentInstallment reached PAID; null while any remains outstanding.

  - name: ContractBlockAllocation
    parent: null
    common_fields: true
    fields:
      - name: contract_id
        type: string
        source: input
        description: FK -> GrapeContract.id; the contract this allocation belongs to.
      - name: block_id
        type: string
        source: input
        description: FK -> VineyardBlock.id; the block committed to the contract.
      - name: allocated_acres
        type: number
        source: input
        description: Acreage committed from the block; required when the contract's contract_basis is ACREAGE and forbidden otherwise.
        constraints: "> 0 and <= VineyardBlock.acres, 3 decimal places, nullable"
      - name: block_cap_tons
        type: number
        source: computed
        description: Per-block soft cap; equals round_half_up(VineyardBlock.acres * VineyardBlock.expected_yield_tons_per_acre, 3) when the contract's cap_scope is PER_BLOCK, otherwise null.
      - name: block_hard_cap_tons
        type: number
        source: computed
        description: round_half_up(block_cap_tons * (1 + GrapeContract.over_delivery_tolerance_pct / 100), 3) when cap_scope is PER_BLOCK, otherwise null.
      - name: delivered_net_tons
        type: number
        source: computed
        description: Sum of tons over SettlementLines with status in {PROVISIONAL, FINAL} whose WeighTag.block_id equals this allocation's block_id and whose contract_id equals this allocation's contract_id; 3 decimal places.

  - name: CrushPadLane
    parent: null
    common_fields: true
    fields:
      - name: lane_code
        type: string
        source: input
        description: Crush-pad receiving lane identifier.
        constraints: unique across CrushPadLanes; 1-16 chars
      - name: daily_capacity_tons
        type: number
        source: input
        description: Maximum planned tonnage the lane may hold for a single UTC calendar date.
        constraints: "> 0, 3 decimal places"
      - name: turnaround_buffer_minutes
        type: integer
        source: input
        description: Whole minutes of cleanout that must separate two appointment windows on this lane.
        default: 30
        constraints: ">= 0"
      - name: max_load_tons
        type: number
        source: input
        description: Largest single appointment planned tonnage the lane accepts.
        default: 40.0
        constraints: "> 0, 3 decimal places"
      - name: status
        type: enum
        source: input
        description: Lane availability for new appointments.
        default: OPEN
        constraints: "OPEN | CLOSED"
      - name: committed_tons
        type: number
        source: computed
        description: Sum of planned_tons over DeliveryAppointments with lane_id equal to this lane and status in {SCHEDULED, ARRIVED}; 3 decimal places.
      - name: scheduled_appointment_count
        type: integer
        source: computed
        description: Count of DeliveryAppointments with lane_id equal to this lane and status in {SCHEDULED, ARRIVED}.

  - name: SamplingCrew
    parent: null
    common_fields: true
    fields:
      - name: crew_code
        type: string
        source: input
        description: Field sampling crew identifier.
        constraints: unique across SamplingCrews; 1-16 chars
      - name: region_code
        type: string
        source: input
        description: Region the crew covers; must equal the block's Grower.region_code for the visit to be schedulable.
        constraints: uppercase A-Z and hyphen, 2-16 chars
      - name: max_concurrent_visits
        type: integer
        source: input
        description: Number of SamplingVisits the crew may have open across any single instant.
        default: 2
        constraints: ">= 1"
      - name: scheduled_visit_count
        type: integer
        source: computed
        description: Count of SamplingVisits with crew_id equal to this crew and status in {SCHEDULED, COMPLETED}.

  - name: SamplingVisit
    parent: null
    common_fields: true
    fields:
      - name: contract_id
        type: string
        source: input
        description: FK -> GrapeContract.id; the contract whose QualitySpec the sample is read against.
      - name: block_id
        type: string
        source: input
        description: FK -> VineyardBlock.id; the block sampled.
      - name: crew_id
        type: string
        source: input
        description: FK -> SamplingCrew.id; the crew occupying the window.
      - name: window_start
        type: datetime
        source: input
        description: Inclusive ISO start of the field window the crew is occupied.
      - name: window_end
        type: datetime
        source: input
        description: Exclusive ISO end of the field window.
        constraints: "> window_start"
      - name: status
        type: enum
        source: computed
        description: Visit lifecycle; see state_machines.SamplingVisit.
        default: SCHEDULED
        constraints: "SCHEDULED | COMPLETED | CANCELLED"
      - name: measured_brix
        type: number
        source: input
        description: Sugar reading in degrees Brix supplied on the record transition; null while SCHEDULED.
        constraints: "> 0 and <= 40, 1 decimal place, nullable"
      - name: measured_ta_gl
        type: number
        source: input
        description: Titratable acidity in g/L supplied on the record transition; null while SCHEDULED.
        constraints: "> 0 and <= 20, 1 decimal place, nullable"
      - name: measured_ph
        type: number
        source: input
        description: Juice pH supplied on the record transition; null while SCHEDULED.
        constraints: "> 0 and <= 5, 2 decimal places, nullable"
      - name: measured_rot_pct
        type: number
        source: input
        description: Bunch-rot percentage supplied on the record transition; null while SCHEDULED.
        constraints: ">= 0 and <= 100, 1 decimal place, nullable"
      - name: sampled_at
        type: datetime
        source: computed
        description: Logical-clock instant of the record transition; null while SCHEDULED.
      - name: maturity_flag
        type: enum
        source: computed
        description: PICK_READY when measured_brix >= the contract's QualitySpec.min_brix_pick_call, otherwise IMMATURE; null while SCHEDULED.
        constraints: "IMMATURE | PICK_READY"

  - name: PickCall
    parent: null
    common_fields: true
    fields:
      - name: contract_id
        type: string
        source: input
        description: FK -> GrapeContract.id; contract the fruit is called against.
      - name: block_id
        type: string
        source: input
        description: FK -> VineyardBlock.id; block called for picking; must be allocated to the contract.
      - name: target_pick_at
        type: datetime
        source: input
        description: ISO instant the winery wants the fruit picked.
      - name: estimated_tons
        type: number
        source: input
        description: Winery's tonnage estimate carried in the pick-call notification.
        constraints: "> 0, 3 decimal places"
      - name: issued_at
        type: datetime
        source: computed
        description: Logical-clock instant at which the notification was issued or last re-issued by a revision.
      - name: notice_hours
        type: integer
        source: computed
        description: "floor((target_pick_at - issued_at) / 3600 seconds); recomputed on every revision."
      - name: ack_deadline_at
        type: datetime
        source: computed
        description: issued_at plus the contract's pick_call_ack_window_hours; recomputed on every revision.
      - name: acknowledged_at
        type: datetime
        source: computed
        description: Logical-clock instant of the acknowledge transition; cleared by a revision.
      - name: revision_count
        type: integer
        source: computed
        description: Number of revise transitions applied to this pick call.
        default: 0
      - name: status
        type: enum
        source: computed
        description: Pick-call lifecycle; see state_machines.PickCall.
        default: ISSUED
        constraints: "ISSUED | ACKNOWLEDGED | SUSPENDED_CAP | FULFILLED | EXPIRED | WITHDRAWN"
      - name: appointed_tons
        type: number
        source: computed
        description: Sum of planned_tons over DeliveryAppointments with this pick_call_id and status in {SCHEDULED, ARRIVED}; 3 decimal places.
      - name: delivered_net_tons
        type: number
        source: computed
        description: Sum of net_tons over WeighTags whose appointment's pick_call_id is this pick call, weigh_status NET_FINAL and disposition in {ACCEPTED, PARTIALLY_ACCEPTED}; 3 decimal places.
      - name: fulfillment_pct
        type: number
        source: computed
        description: round_half_up(delivered_net_tons / estimated_tons * 100, 1).

  - name: DeliveryAppointment
    parent: null
    common_fields: true
    fields:
      - name: pick_call_id
        type: string
        source: input
        description: FK -> PickCall.id; the acknowledged pick call this slot serves.
      - name: lane_id
        type: string
        source: input
        description: FK -> CrushPadLane.id; the receiving lane reserved.
      - name: window_start
        type: datetime
        source: input
        description: Inclusive ISO start of the lane reservation.
      - name: window_end
        type: datetime
        source: input
        description: Exclusive ISO end of the lane reservation.
        constraints: "> window_start"
      - name: planned_tons
        type: number
        source: input
        description: Tonnage the grower plans to deliver into the slot.
        constraints: "> 0, 3 decimal places"
      - name: status
        type: enum
        source: computed
        description: Appointment lifecycle; see state_machines.DeliveryAppointment.
        default: SCHEDULED
        constraints: "SCHEDULED | ARRIVED | CLOSED | CANCELLED | NO_SHOW"
      - name: captured_net_tons
        type: number
        source: computed
        description: Sum of net_tons over WeighTags with this appointment_id and weigh_status NET_FINAL; 3 decimal places.
      - name: weigh_tag_count
        type: integer
        source: computed
        description: Count of WeighTags with this appointment_id.

  - name: WeighTag
    parent: null
    common_fields: true
    fields:
      - name: appointment_id
        type: string
        source: input
        description: FK -> DeliveryAppointment.id; the slot the truck presented in.
      - name: block_id
        type: string
        source: input
        description: FK -> VineyardBlock.id; the block the fruit on this tag came from; must be allocated to the appointment's contract.
      - name: gross_weight_lbs
        type: integer
        source: input
        description: Loaded truck weight in pounds captured on the inbound scale pass.
        constraints: "> 0 and <= 200000"
      - name: tare_weight_lbs
        type: integer
        source: input
        description: Empty truck weight in pounds captured on the outbound scale pass; null until the tare transition.
        constraints: ">= 0 and <= 200000, nullable"
      - name: net_weight_lbs
        type: integer
        source: computed
        description: gross_weight_lbs minus tare_weight_lbs; null until the tare transition.
      - name: net_tons
        type: number
        source: computed
        description: round_half_up(net_weight_lbs / 2000, 3); null until the tare transition.
      - name: weigh_status
        type: enum
        source: computed
        description: Weight-capture dimension; see state_machines.WeighTag (dimension weigh_status).
        default: GROSS_CAPTURED
        constraints: "GROSS_CAPTURED | NET_FINAL"
      - name: disposition
        type: enum
        source: computed
        description: Receipt-decision dimension, independent of weigh_status; see state_machines.WeighTag (dimension disposition).
        default: PENDING
        constraints: "PENDING | ACCEPTED | PARTIALLY_ACCEPTED | REJECTED_QUALITY | REJECTED_OVER_CAP | DISPUTED"
      - name: captured_by_user_id
        type: string
        source: system
        description: X-User-ID of the ScaleOperator that created the tag; compared against the grader's X-User-ID by the segregation-of-duties validation.
      - name: grade_count
        type: integer
        source: computed
        description: Number of QualityGrade rows recorded against this tag, including superseded ones.
        default: 0
      - name: active_adjustment_pct
        type: number
        source: computed
        description: adjustment_pct of the single QualityGrade for this tag with superseded_at null; null while no grade exists.
      - name: contract_slice_tons
        type: number
        source: computed
        description: Portion of net_tons allocated to bucket CONTRACT by calculations.tonnage_waterfall_allocation; 0.000 until graded.
        default: 0.0
      - name: over_slice_tons
        type: number
        source: computed
        description: Portion of net_tons allocated to bucket OVER_DELIVERY by calculations.tonnage_waterfall_allocation; 0.000 until graded.
        default: 0.0
      - name: over_rejected_tons
        type: number
        source: computed
        description: Portion of net_tons inside the tolerance band that was refused because over_delivery_policy is REJECT; 0.000 otherwise.
        default: 0.0
      - name: excess_rejected_tons
        type: number
        source: computed
        description: Portion of net_tons above the applicable hard cap, always refused regardless of over_delivery_policy; 0.000 otherwise.
        default: 0.0
      - name: dispute_deadline_at
        type: datetime
        source: computed
        description: Logical-clock instant of the first grading plus GRADE_DISPUTE_WINDOW_HOURS (72); null before grading, and never re-stamped by a re-grade.

  - name: QualityGrade
    parent: null
    common_fields: false
    fields:
      - name: weigh_tag_id
        type: string
        source: input
        description: FK -> WeighTag.id; the load this grading applies to.
      - name: brix
        type: number
        source: input
        description: Sugar reading at receipt in degrees Brix.
        constraints: "> 0 and <= 40, 1 decimal place"
      - name: ta_gl
        type: number
        source: input
        description: Titratable acidity at receipt in g/L.
        constraints: "> 0 and <= 20, 1 decimal place"
      - name: ph
        type: number
        source: input
        description: Juice pH at receipt, recorded for the lab file.
        constraints: "> 0 and <= 5, 2 decimal places"
      - name: rot_pct
        type: number
        source: input
        description: Bunch-rot percentage at receipt.
        constraints: ">= 0 and <= 100, 1 decimal place"
      - name: mog_pct
        type: number
        source: input
        description: Material-other-than-grapes percentage at receipt.
        constraints: ">= 0 and <= 100, 1 decimal place"
      - name: graded_by_user_id
        type: string
        source: system
        description: X-User-ID of the actor that recorded this grading.
      - name: brix_component_pct
        type: number
        source: computed
        description: Brix bonus minus Brix penalty percentage points per calculations.quality_adjustment_pct.
      - name: acid_component_pct
        type: number
        source: computed
        description: Acid percentage-point component per calculations.quality_adjustment_pct.
      - name: rot_component_pct
        type: number
        source: computed
        description: Rot percentage-point component per calculations.quality_adjustment_pct.
      - name: mog_component_pct
        type: number
        source: computed
        description: MOG percentage-point component per calculations.quality_adjustment_pct.
      - name: raw_adjustment_pct
        type: number
        source: computed
        description: Unclamped sum of the four components; consumed by the WEIGHTED_BLEND settlement variant.
      - name: adjustment_pct
        type: number
        source: computed
        description: raw_adjustment_pct clamped to [-max_total_penalty_pct, +max_total_bonus_pct] of the contract's QualitySpec.
      - name: recommended_disposition
        type: enum
        source: computed
        description: REJECT_QUALITY when brix < min_brix_accept or rot_pct >= rot_rejection_pct, otherwise ACCEPT.
        constraints: "ACCEPT | REJECT_QUALITY"
      - name: superseded_at
        type: datetime
        source: computed
        description: Logical-clock instant at which a later QualityGrade for the same weigh_tag_id replaced this row; null while this is the active grading.

  - name: SettlementLine
    parent: null
    common_fields: true
    fields:
      - name: weigh_tag_id
        type: string
        source: input
        description: FK -> WeighTag.id; the graded load this line prices.
      - name: contract_id
        type: string
        source: input
        description: FK -> GrapeContract.id; the contract the line settles against.
      - name: bucket
        type: enum
        source: computed
        description: Tonnage bucket the line prices; CONTRACT tonnage prices at base_price_per_ton_cents, OVER_DELIVERY tonnage prices per over_delivery_policy.
        constraints: "CONTRACT | OVER_DELIVERY"
      - name: tons
        type: number
        source: computed
        description: Tonnage slice assigned to this line by calculations.tonnage_waterfall_allocation; 3 decimal places.
      - name: adjustment_pct_applied
        type: number
        source: computed
        description: Percentage-point adjustment used to price this line; bonus components are suppressed on OVER_DELIVERY lines.
      - name: price_per_ton_cents
        type: integer
        source: computed
        description: Whole-cent adjusted price per net ton per calculations.settlement_line_amount step 2.
      - name: gross_amount_cents
        type: integer
        source: computed
        description: Whole-cent line amount per calculations.settlement_line_amount step 3.
      - name: provisional_amount_cents
        type: integer
        source: computed
        description: round_half_up(gross_amount_cents * GrapeContract.provisional_payment_pct / 100) at grading time.
      - name: final_amount_cents
        type: integer
        source: computed
        description: Amount fixed at settlement close by calculations.final_settlement_total under the contract's settlement_basis; null while status is PROVISIONAL.
      - name: status
        type: enum
        source: computed
        description: Line lifecycle; see state_machines.SettlementLine.
        default: PROVISIONAL
        constraints: "PROVISIONAL | FINAL | VOID"
      - name: voided_at
        type: datetime
        source: computed
        description: Logical-clock instant at which a grade dispute voided this line; null otherwise.

  - name: PaymentInstallment
    parent: null
    common_fields: true
    fields:
      - name: contract_id
        type: string
        source: input
        description: FK -> GrapeContract.id; the contract whose settlement funds this installment.
      - name: installment_no
        type: integer
        source: computed
        description: 1-based position copied from the contract's installment_plan element.
        constraints: unique per (contract_id, installment_no)
      - name: pct_of_settlement
        type: number
        source: computed
        description: Percentage of net_payable_cents this installment carries, copied from the installment_plan element.
      - name: due_offset_days
        type: integer
        source: computed
        description: Whole days after settlement_closed_at at which this installment falls due, copied from the installment_plan element.
      - name: lien_protected
        type: boolean
        source: computed
        description: When true this installment is covered by the statutory producer lien and blocks contract termination and lien release while outstanding.
      - name: planned_amount_cents
        type: integer
        source: computed
        description: Whole-cent amount assigned by calculations.installment_waterfall at settlement close; 0 before close.
        default: 0
      - name: paid_amount_cents
        type: integer
        source: computed
        description: Cumulative sum of accepted payment amounts against this installment.
        default: 0
      - name: due_at
        type: datetime
        source: computed
        description: settlement_closed_at plus due_offset_days; null before settlement close.
      - name: status
        type: enum
        source: computed
        description: Installment lifecycle; see state_machines.PaymentInstallment.
        default: PENDING_SETTLEMENT
        constraints: "PENDING_SETTLEMENT | SCHEDULED | PARTIALLY_PAID | PAID | DELINQUENT"

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: GrapeContract
    dimension: lifecycle_status
    initial_state: DRAFT
    terminal_states: [CLOSED, TERMINATED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: OFFERED
        trigger: "POST /grower-relations/grape-contracts/{contractId}/offer"
        actor: GrowerRelationsManager
        preconditions:
          - "lifecycle_status == DRAFT"
          - "offer_round < MAX_OFFER_ROUNDS (3)"
        side_effects:
          - "offer_round incremented by 1"
          - "base_price_per_ton_cents replaced when the optional base_price_per_ton_cents input is supplied"
          - "increments GrapeContract.version by 1"
      - from: COUNTERED
        to: OFFERED
        trigger: "POST /grower-relations/grape-contracts/{contractId}/offer"
        actor: GrowerRelationsManager
        preconditions:
          - "lifecycle_status == COUNTERED"
          - "offer_round < MAX_OFFER_ROUNDS (3)"
        side_effects:
          - "offer_round incremented by 1"
          - "base_price_per_ton_cents replaced when the optional base_price_per_ton_cents input is supplied"
          - "increments GrapeContract.version by 1"
        note: "Closes the negotiation cycle OFFERED -> COUNTERED -> OFFERED; the 4th offer is refused with ERR_MAX_OFFER_ROUNDS_EXCEEDED."
      - from: OFFERED
        to: COUNTERED
        trigger: "POST /grower-relations/grape-contracts/{contractId}/counter"
        actor: Grower
        preconditions:
          - "lifecycle_status == OFFERED"
          - "X-User-ID == GrapeContract.grower_id"
        side_effects:
          - "countered_price_per_ton_cents set to the counter_base_price_per_ton_cents input"
          - "increments GrapeContract.version by 1"
      - from: OFFERED
        to: WITHDRAWN
        trigger: "POST /grower-relations/grape-contracts/{contractId}/withdraw-offer"
        actor: GrowerRelationsManager
        preconditions:
          - "lifecycle_status == OFFERED"
        side_effects:
          - "renewal_status set to NOT_RENEWING"
          - "increments GrapeContract.version by 1"
      - from: OFFERED
        to: ACTIVE
        trigger: "POST /grower-relations/grape-contracts/{contractId}/accept"
        actor: Grower
        preconditions:
          - "lifecycle_status == OFFERED"
          - "X-User-ID == GrapeContract.grower_id"
          - "at least one ContractBlockAllocation exists with contract_id == this contract"
          - "Grower.status == ACTIVE"
        side_effects:
          - "cap_scope set to PER_BLOCK when contract_basis == BLOCK else PER_CONTRACT"
          - "recompute contract_cap_tons and hard_cap_tons per calculations.tonnage_cap_derivation"
          - "recompute ContractBlockAllocation.block_cap_tons and block_hard_cap_tons for every allocation of this contract"
          - "tonnage_status set to OPEN"
          - "renewal_window_closes_at set to <term_end_vintage>-11-01T00:00:00Z and renewal_window_opens_at set to renewal_window_closes_at minus termination_notice_days days"
          - "one PaymentInstallment row created per installment_plan element with status PENDING_SETTLEMENT, planned_amount_cents 0 and paid_amount_cents 0"
          - "increments GrapeContract.version by 1"
      - from: ACTIVE
        to: SETTLED
        trigger: "POST /grower-relations/grape-contracts/{contractId}/settlement-close"
        actor: GrowerRelationsManager
        preconditions:
          - "lifecycle_status == ACTIVE"
          - "no WeighTag reachable through this contract has weigh_status == GROSS_CAPTURED"
          - "no WeighTag reachable through this contract has disposition in {PENDING, DISPUTED}"
        side_effects:
          - "recompute every SettlementLine.final_amount_cents of this contract per calculations.final_settlement_total under settlement_basis and flip status PROVISIONAL -> FINAL"
          - "final_settlement_cents recomputed as the sum of FINAL line amounts"
          - "prompt_pay_credit_cents, lien_holdback_cents and net_payable_cents recomputed per calculations.net_payable_derivation"
          - "settlement_closed_at stamped from the logical clock"
          - "every PaymentInstallment of this contract receives planned_amount_cents per calculations.installment_waterfall, due_at = settlement_closed_at + due_offset_days days, and transitions PENDING_SETTLEMENT -> SCHEDULED"
          - "Grower.outstanding_lien_balance_cents recomputed"
          - "every PickCall of this contract with status in {ISSUED, ACKNOWLEDGED, SUSPENDED_CAP} transitions to WITHDRAWN"
          - "increments GrapeContract.version by 1"
      - from: SETTLED
        to: CLOSED
        trigger: "system event on the final PaymentInstallment reaching PAID (cascaded from POST /grower-relations/payment-installments/{installmentId}/payments)"
        actor: system
        preconditions:
          - "lifecycle_status == SETTLED"
          - "every PaymentInstallment of this contract has status PAID"
        side_effects:
          - "lien_released_at stamped from the logical clock when it is still null"
          - "increments GrapeContract.version by 1"
      - from: ACTIVE
        to: TERMINATION_PENDING
        trigger: "POST /grower-relations/grape-contracts/{contractId}/termination-notice"
        actor: GrowerRelationsManager
        preconditions:
          - "lifecycle_status == ACTIVE"
          - "effective_at >= now + termination_notice_days days"
          - "Grower.outstanding_lien_balance_cents == 0"
        side_effects:
          - "termination_effective_at set to the effective_at input"
          - "renewal_status set to NOT_RENEWING"
          - "every PickCall of this contract with status in {ISSUED, ACKNOWLEDGED} transitions to WITHDRAWN; each withdrawn pick call's DeliveryAppointments with status SCHEDULED transition to CANCELLED; each cancelled appointment's CrushPadLane.committed_tons and scheduled_appointment_count are recomputed"
          - "increments GrapeContract.version by 1"
      - from: TERMINATION_PENDING
        to: TERMINATED
        trigger: "system event on POST /_clock/set_current_utc advancing now to or past termination_effective_at"
        actor: system
        preconditions:
          - "lifecycle_status == TERMINATION_PENDING"
          - "now >= termination_effective_at"
        side_effects:
          - "increments GrapeContract.version by 1"

  - entity: GrapeContract
    dimension: renewal_status
    initial_state: NOT_DUE
    terminal_states: [NOT_RENEWING]
    transitions:
      - from: NOT_DUE
        to: RENEWAL_WINDOW_OPEN
        trigger: "system event on POST /_clock/set_current_utc advancing now into [renewal_window_opens_at, renewal_window_closes_at)"
        actor: system
        preconditions:
          - "lifecycle_status == ACTIVE"
          - "renewal_status == NOT_DUE"
          - "now >= renewal_window_opens_at and now < renewal_window_closes_at"
        side_effects:
          - "increments GrapeContract.version by 1"
      - from: RENEWED
        to: RENEWAL_WINDOW_OPEN
        trigger: "system event on POST /_clock/set_current_utc advancing now into the recomputed [renewal_window_opens_at, renewal_window_closes_at)"
        actor: system
        preconditions:
          - "lifecycle_status == ACTIVE"
          - "renewal_status == RENEWED"
          - "now >= renewal_window_opens_at and now < renewal_window_closes_at"
        side_effects:
          - "increments GrapeContract.version by 1"
      - from: EVERGREEN_ROLLED
        to: RENEWAL_WINDOW_OPEN
        trigger: "system event on POST /_clock/set_current_utc advancing now into the recomputed [renewal_window_opens_at, renewal_window_closes_at)"
        actor: system
        preconditions:
          - "lifecycle_status == ACTIVE"
          - "renewal_status == EVERGREEN_ROLLED"
          - "now >= renewal_window_opens_at and now < renewal_window_closes_at"
        side_effects:
          - "increments GrapeContract.version by 1"
        note: "Together with RENEWED_to_RENEWAL_WINDOW_OPEN this makes the renewal dimension cyclic across terms while lifecycle_status stays ACTIVE."
      - from: RENEWAL_WINDOW_OPEN
        to: RENEWED
        trigger: "POST /grower-relations/grape-contracts/{contractId}/renew"
        actor: GrowerRelationsManager
        preconditions:
          - "lifecycle_status == ACTIVE"
          - "renewal_status == RENEWAL_WINDOW_OPEN"
          - "now < renewal_window_closes_at"
          - "Grower.reliability_score_lifetime >= RENEWAL_MIN_RELIABILITY_SCORE (80)"
        side_effects:
          - "term_end_vintage increased by the renewal_term_years input"
          - "base_price_per_ton_cents replaced when the optional renewed_base_price_per_ton_cents input is supplied"
          - "renewal_window_closes_at recomputed as <term_end_vintage>-11-01T00:00:00Z and renewal_window_opens_at as that instant minus termination_notice_days days"
          - "increments GrapeContract.version by 1"
      - from: RENEWAL_WINDOW_OPEN
        to: EVERGREEN_ROLLED
        trigger: "system event on POST /_clock/set_current_utc advancing now to or past renewal_window_closes_at while evergreen_flag is true"
        actor: system
        preconditions:
          - "lifecycle_status == ACTIVE"
          - "renewal_status == RENEWAL_WINDOW_OPEN"
          - "evergreen_flag == true"
          - "now >= renewal_window_closes_at"
        side_effects:
          - "term_end_vintage increased by evergreen_term_years"
          - "renewal_window_closes_at and renewal_window_opens_at recomputed from the new term_end_vintage"
          - "increments GrapeContract.version by 1"
      - from: RENEWAL_WINDOW_OPEN
        to: NOT_RENEWING
        trigger: "system event on POST /_clock/set_current_utc advancing now to or past renewal_window_closes_at while evergreen_flag is false"
        actor: system
        preconditions:
          - "renewal_status == RENEWAL_WINDOW_OPEN"
          - "evergreen_flag == false"
          - "now >= renewal_window_closes_at"
        side_effects:
          - "increments GrapeContract.version by 1"

  - entity: SamplingVisit
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /grower-relations/sampling-visits/{visitId}/record"
        actor: HarvestCoordinator
        preconditions:
          - "status == SCHEDULED"
        side_effects:
          - "measured_brix, measured_ta_gl, measured_ph and measured_rot_pct stored from the request"
          - "sampled_at stamped from the logical clock"
          - "maturity_flag set to PICK_READY when measured_brix >= the contract's QualitySpec.min_brix_pick_call else IMMATURE"
          - "VineyardBlock.latest_sampling_brix and latest_sampling_rot_pct recomputed for block_id"
          - "increments SamplingVisit.version by 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "system event on POST /grower-relations/grape-contracts/{contractId}/termination-notice for the visit's contract_id"
        actor: system
        preconditions:
          - "status == SCHEDULED"
          - "the visit's contract_id transitioned ACTIVE -> TERMINATION_PENDING"
        side_effects:
          - "SamplingCrew.scheduled_visit_count recomputed for crew_id"
          - "increments SamplingVisit.version by 1"

  - entity: PickCall
    initial_state: ISSUED
    terminal_states: [FULFILLED, EXPIRED, WITHDRAWN]
    transitions:
      - from: ISSUED
        to: ACKNOWLEDGED
        trigger: "POST /grower-relations/pick-calls/{pickCallId}/acknowledge"
        actor: Grower
        preconditions:
          - "status == ISSUED"
          - "X-User-ID == the contract's grower_id"
          - "now < ack_deadline_at"
        side_effects:
          - "acknowledged_at stamped from the logical clock"
          - "increments PickCall.version by 1"
      - from: ACKNOWLEDGED
        to: ISSUED
        trigger: "POST /grower-relations/pick-calls/{pickCallId}/revise"
        actor: HarvestCoordinator
        preconditions:
          - "status == ACKNOWLEDGED"
          - "revision_count < MAX_PICK_CALL_REVISIONS (2)"
          - "the revised notice_hours >= the contract's min_pick_notice_hours"
        side_effects:
          - "target_pick_at replaced by the revised_target_pick_at input; estimated_tons replaced when revised_estimated_tons is supplied"
          - "revision_count incremented by 1; acknowledged_at cleared; issued_at, notice_hours and ack_deadline_at recomputed from the logical clock"
          - "because the pick call left ACKNOWLEDGED, every DeliveryAppointment of this pick call with status SCHEDULED transitions to CANCELLED"
          - "because those appointments became CANCELLED, CrushPadLane.committed_tons and scheduled_appointment_count are recomputed for each affected lane"
          - "appointed_tons recomputed"
          - "increments PickCall.version by 1"
        note: "Cyclic edge: a revised pick call re-enters the ISSUED state and must be acknowledged again."
      - from: ISSUED
        to: EXPIRED
        trigger: "system event on POST /_clock/set_current_utc advancing now past ack_deadline_at"
        actor: system
        preconditions:
          - "status == ISSUED"
          - "now > ack_deadline_at"
        side_effects:
          - "Grower.expired_pick_call_count_vintage, prior_vintage_penalty_units, reliability_score_vintage and reliability_score_lifetime recomputed per calculations.grower_reliability_score"
          - "increments PickCall.version by 1"
      - from: ACKNOWLEDGED
        to: SUSPENDED_CAP
        trigger: "system event on the contract's tonnage_status becoming CAP_REACHED or HARD_CAP_REACHED (cascaded from POST /grower-relations/weigh-tags/{tagId}/grades)"
        actor: system
        preconditions:
          - "status == ACKNOWLEDGED"
          - "the contract's tonnage_status != OPEN"
          - "the ACKNOWLEDGED -> FULFILLED check has already been evaluated for this pick call and did not fire, so a call that just reached FULFILLED is never suspended"
        side_effects:
          - "because the pick call became SUSPENDED_CAP, every DeliveryAppointment of this pick call with status SCHEDULED transitions to CANCELLED"
          - "because those appointments became CANCELLED, CrushPadLane.committed_tons and scheduled_appointment_count are recomputed for each affected lane"
          - "increments PickCall.version by 1"
      - from: ISSUED
        to: SUSPENDED_CAP
        trigger: "system event on the contract's tonnage_status becoming CAP_REACHED or HARD_CAP_REACHED (cascaded from POST /grower-relations/weigh-tags/{tagId}/grades)"
        actor: system
        preconditions:
          - "status == ISSUED"
          - "the contract's tonnage_status != OPEN"
        side_effects:
          - "increments PickCall.version by 1"
      - from: SUSPENDED_CAP
        to: ISSUED
        trigger: "system event on the contract's tonnage_status returning to OPEN (cascaded from POST /grower-relations/weigh-tags/{tagId}/grade-disputes)"
        actor: system
        preconditions:
          - "status == SUSPENDED_CAP"
          - "the contract's tonnage_status == OPEN"
        side_effects:
          - "issued_at, notice_hours and ack_deadline_at recomputed from the logical clock; acknowledged_at cleared"
          - "increments PickCall.version by 1"
        note: "Second cyclic edge: cap suspension is reversible, so a pick call can revisit ISSUED without a new pick call being created."
      - from: ACKNOWLEDGED
        to: FULFILLED
        trigger: "system event on a WeighTag of this pick call reaching disposition ACCEPTED or PARTIALLY_ACCEPTED with delivered_net_tons >= estimated_tons"
        actor: system
        preconditions:
          - "status == ACKNOWLEDGED"
          - "delivered_net_tons >= estimated_tons"
        side_effects:
          - "fulfillment_pct recomputed"
          - "increments PickCall.version by 1"
      - from: ACKNOWLEDGED
        to: WITHDRAWN
        trigger: "system event on the contract leaving ACTIVE through termination-notice or settlement-close"
        actor: system
        preconditions:
          - "status == ACKNOWLEDGED"
        side_effects:
          - "every DeliveryAppointment of this pick call with status SCHEDULED transitions to CANCELLED and each affected CrushPadLane.committed_tons is recomputed"
          - "increments PickCall.version by 1"
      - from: ISSUED
        to: WITHDRAWN
        trigger: "system event on the contract leaving ACTIVE through termination-notice or settlement-close"
        actor: system
        preconditions:
          - "status == ISSUED"
        side_effects:
          - "increments PickCall.version by 1"
      - from: SUSPENDED_CAP
        to: WITHDRAWN
        trigger: "system event on the contract leaving ACTIVE through settlement-close"
        actor: system
        preconditions:
          - "status == SUSPENDED_CAP"
        side_effects:
          - "increments PickCall.version by 1"

  - entity: DeliveryAppointment
    initial_state: SCHEDULED
    terminal_states: [CLOSED, CANCELLED, NO_SHOW]
    transitions:
      - from: SCHEDULED
        to: ARRIVED
        trigger: "system event on the first POST /grower-relations/weigh-tags for this appointment"
        actor: system
        preconditions:
          - "status == SCHEDULED"
          - "weigh_tag_count transitions from 0 to 1"
        side_effects:
          - "weigh_tag_count recomputed"
          - "increments DeliveryAppointment.version by 1"
      - from: ARRIVED
        to: CLOSED
        trigger: "system event on POST /grower-relations/weigh-tags/{tagId}/grades for the last open tag of this appointment"
        actor: system
        preconditions:
          - "status == ARRIVED"
          - "every WeighTag of this appointment has weigh_status == NET_FINAL and disposition not in {PENDING, DISPUTED}"
        side_effects:
          - "captured_net_tons recomputed"
          - "CrushPadLane.committed_tons and scheduled_appointment_count recomputed for lane_id"
          - "increments DeliveryAppointment.version by 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /grower-relations/delivery-appointments/{appointmentId}/cancel"
        actor: HarvestCoordinator
        preconditions:
          - "status == SCHEDULED"
        side_effects:
          - "CrushPadLane.committed_tons and scheduled_appointment_count recomputed for lane_id"
          - "PickCall.appointed_tons recomputed for pick_call_id"
          - "increments DeliveryAppointment.version by 1"
      - from: SCHEDULED
        to: NO_SHOW
        trigger: "system event on POST /_clock/set_current_utc advancing now to or past window_end while weigh_tag_count == 0"
        actor: system
        preconditions:
          - "status == SCHEDULED"
          - "now >= window_end"
          - "weigh_tag_count == 0"
        side_effects:
          - "CrushPadLane.committed_tons and scheduled_appointment_count recomputed for lane_id"
          - "PickCall.appointed_tons recomputed for pick_call_id"
          - "Grower.no_show_appointment_count_vintage, prior_vintage_penalty_units, reliability_score_vintage and reliability_score_lifetime recomputed per calculations.grower_reliability_score"
          - "increments DeliveryAppointment.version by 1"

  - entity: WeighTag
    dimension: weigh_status
    initial_state: GROSS_CAPTURED
    terminal_states: [NET_FINAL]
    transitions:
      - from: GROSS_CAPTURED
        to: NET_FINAL
        trigger: "POST /grower-relations/weigh-tags/{tagId}/tare"
        actor: ScaleOperator
        preconditions:
          - "weigh_status == GROSS_CAPTURED"
          - "tare_weight_lbs <= gross_weight_lbs"
        side_effects:
          - "tare_weight_lbs stored; net_weight_lbs and net_tons recomputed per calculations.net_weight_conversion"
          - "DeliveryAppointment.captured_net_tons recomputed for appointment_id"
          - "increments WeighTag.version by 1"
        note: "The disposition dimension is untouched by this transition and stays PENDING."

  - entity: WeighTag
    dimension: disposition
    initial_state: PENDING
    terminal_states: []
    transitions:
      - from: PENDING
        to: REJECTED_QUALITY
        trigger: "POST /grower-relations/weigh-tags/{tagId}/grades"
        actor: QualityLabTech
        preconditions:
          - "weigh_status == NET_FINAL"
          - "disposition == PENDING"
          - "the new QualityGrade.recommended_disposition == REJECT_QUALITY"
        side_effects:
          - "QualityGrade row created with components and adjustment per calculations.quality_adjustment_pct; any earlier grade of this tag receives superseded_at"
          - "grade_count incremented by 1; active_adjustment_pct set to the new grade's adjustment_pct; dispute_deadline_at stamped when null"
          - "contract_slice_tons, over_slice_tons, over_rejected_tons stay 0.000; excess_rejected_tons stays 0.000; no SettlementLine is created"
          - "GrapeContract.rejected_tons recomputed"
          - "Grower.rejected_load_count_vintage, prior_vintage_penalty_units, reliability_score_vintage and reliability_score_lifetime recomputed per calculations.grower_reliability_score"
          - "DeliveryAppointment transitions ARRIVED -> CLOSED when this was the appointment's last open tag"
          - "increments WeighTag.version by 1"
      - from: PENDING
        to: ACCEPTED
        trigger: "POST /grower-relations/weigh-tags/{tagId}/grades"
        actor: QualityLabTech
        preconditions:
          - "weigh_status == NET_FINAL"
          - "disposition == PENDING"
          - "the new QualityGrade.recommended_disposition == ACCEPT"
          - "calculations.tonnage_waterfall_allocation leaves over_rejected_tons == 0.000 and excess_rejected_tons == 0.000"
        side_effects:
          - "QualityGrade row created; grade_count incremented by 1; active_adjustment_pct set; dispute_deadline_at stamped when null"
          - "contract_slice_tons and over_slice_tons set per calculations.tonnage_waterfall_allocation"
          - "one SettlementLine with bucket CONTRACT is created when contract_slice_tons > 0 and one with bucket OVER_DELIVERY when over_slice_tons > 0, each priced per calculations.settlement_line_amount with status PROVISIONAL"
          - "because SettlementLines were created, GrapeContract.delivered_contract_tons, delivered_over_tons and provisional_settlement_cents are recomputed"
          - "because delivered tonnage moved, GrapeContract.tonnage_status is re-derived; if it leaves OPEN, every PickCall of the contract in {ISSUED, ACKNOWLEDGED} transitions to SUSPENDED_CAP, and because those pick calls were suspended their SCHEDULED DeliveryAppointments transition to CANCELLED, and because those appointments were cancelled each CrushPadLane.committed_tons is recomputed"
          - "ContractBlockAllocation.delivered_net_tons and VineyardBlock.delivered_net_tons_vintage recomputed"
          - "PickCall transitions ACKNOWLEDGED -> FULFILLED when delivered_net_tons >= estimated_tons"
          - "DeliveryAppointment transitions ARRIVED -> CLOSED when this was the appointment's last open tag"
          - "increments WeighTag.version by 1"
      - from: PENDING
        to: PARTIALLY_ACCEPTED
        trigger: "POST /grower-relations/weigh-tags/{tagId}/grades"
        actor: QualityLabTech
        preconditions:
          - "weigh_status == NET_FINAL"
          - "disposition == PENDING"
          - "the new QualityGrade.recommended_disposition == ACCEPT"
          - "calculations.tonnage_waterfall_allocation yields contract_slice_tons + over_slice_tons > 0 AND (over_rejected_tons > 0 OR excess_rejected_tons > 0)"
        side_effects:
          - "same grade, slice, SettlementLine, contract-rollup, tonnage_status, pick-call-suspension and appointment-closing cascade as the PENDING -> ACCEPTED transition"
          - "GrapeContract.rejected_tons recomputed to include over_rejected_tons and excess_rejected_tons"
          - "increments WeighTag.version by 1"
      - from: PENDING
        to: REJECTED_OVER_CAP
        trigger: "POST /grower-relations/weigh-tags/{tagId}/grades"
        actor: QualityLabTech
        preconditions:
          - "weigh_status == NET_FINAL"
          - "disposition == PENDING"
          - "the new QualityGrade.recommended_disposition == ACCEPT"
          - "calculations.tonnage_waterfall_allocation yields contract_slice_tons == 0.000 and over_slice_tons == 0.000"
        side_effects:
          - "QualityGrade row created; grade_count incremented by 1; active_adjustment_pct set; dispute_deadline_at stamped when null"
          - "over_rejected_tons and/or excess_rejected_tons absorb the entire net_tons; no SettlementLine is created"
          - "GrapeContract.rejected_tons recomputed"
          - "Grower.rejected_load_count_vintage and both reliability scores recomputed per calculations.grower_reliability_score"
          - "DeliveryAppointment transitions ARRIVED -> CLOSED when this was the appointment's last open tag"
          - "increments WeighTag.version by 1"
      - from: ACCEPTED
        to: DISPUTED
        trigger: "POST /grower-relations/weigh-tags/{tagId}/grade-disputes"
        actor: Grower
        preconditions:
          - "disposition in {ACCEPTED, PARTIALLY_ACCEPTED, REJECTED_QUALITY}"
          - "X-User-ID == the contract's grower_id"
          - "now <= dispute_deadline_at"
          - "the contract's lifecycle_status == ACTIVE"
        side_effects:
          - "the active QualityGrade receives superseded_at from the logical clock"
          - "because the active grade was superseded, every SettlementLine of this tag with status PROVISIONAL transitions to VOID with voided_at stamped"
          - "because those lines were voided, GrapeContract.delivered_contract_tons, delivered_over_tons, provisional_settlement_cents and rejected_tons are recomputed and tonnage_status is re-derived"
          - "because tonnage_status returned to OPEN, every PickCall of the contract with status SUSPENDED_CAP transitions back to ISSUED"
          - "contract_slice_tons, over_slice_tons, over_rejected_tons and excess_rejected_tons reset to 0.000; active_adjustment_pct cleared"
          - "increments WeighTag.version by 1"
        note: "The same transition is declared for from-states PARTIALLY_ACCEPTED and REJECTED_QUALITY; disposition returns to DISPUTED and awaits a re-grade."
      - from: DISPUTED
        to: ACCEPTED
        trigger: "POST /grower-relations/weigh-tags/{tagId}/grades"
        actor: QualityLabTech
        preconditions:
          - "weigh_status == NET_FINAL"
          - "disposition == DISPUTED"
          - "the new QualityGrade.recommended_disposition == ACCEPT"
          - "calculations.tonnage_waterfall_allocation leaves over_rejected_tons == 0.000 and excess_rejected_tons == 0.000"
        side_effects:
          - "same cascade as PENDING -> ACCEPTED, re-running the waterfall against the contract's current remaining capacity"
          - "increments WeighTag.version by 1"
        note: "Cyclic edge: dispute plus re-grade returns the disposition dimension to a decided state without a new WeighTag."
      - from: DISPUTED
        to: REJECTED_QUALITY
        trigger: "POST /grower-relations/weigh-tags/{tagId}/grades"
        actor: QualityLabTech
        preconditions:
          - "weigh_status == NET_FINAL"
          - "disposition == DISPUTED"
          - "the new QualityGrade.recommended_disposition == REJECT_QUALITY"
        side_effects:
          - "same cascade as PENDING -> REJECTED_QUALITY"
          - "increments WeighTag.version by 1"

  - entity: SettlementLine
    initial_state: PROVISIONAL
    terminal_states: [FINAL, VOID]
    transitions:
      - from: PROVISIONAL
        to: FINAL
        trigger: "system event on POST /grower-relations/grape-contracts/{contractId}/settlement-close"
        actor: system
        preconditions:
          - "status == PROVISIONAL"
          - "the contract's lifecycle_status transitions ACTIVE -> SETTLED"
        side_effects:
          - "final_amount_cents set per calculations.final_settlement_total under the contract's settlement_basis"
          - "increments SettlementLine.version by 1"
      - from: PROVISIONAL
        to: VOID
        trigger: "system event on POST /grower-relations/weigh-tags/{tagId}/grade-disputes"
        actor: system
        preconditions:
          - "status == PROVISIONAL"
          - "the line's weigh_tag_id entered disposition DISPUTED"
        side_effects:
          - "voided_at stamped from the logical clock"
          - "increments SettlementLine.version by 1"

  - entity: PaymentInstallment
    initial_state: PENDING_SETTLEMENT
    terminal_states: [PAID]
    transitions:
      - from: PENDING_SETTLEMENT
        to: SCHEDULED
        trigger: "system event on POST /grower-relations/grape-contracts/{contractId}/settlement-close"
        actor: system
        preconditions:
          - "status == PENDING_SETTLEMENT"
        side_effects:
          - "planned_amount_cents assigned per calculations.installment_waterfall and due_at set to settlement_closed_at + due_offset_days days"
          - "Grower.outstanding_lien_balance_cents recomputed when lien_protected is true"
          - "increments PaymentInstallment.version by 1"
      - from: SCHEDULED
        to: PARTIALLY_PAID
        trigger: "POST /grower-relations/payment-installments/{installmentId}/payments"
        actor: AccountsPayableClerk
        preconditions:
          - "status in {SCHEDULED, DELINQUENT}"
          - "amount_cents < planned_amount_cents - paid_amount_cents"
        side_effects:
          - "paid_amount_cents increased by amount_cents"
          - "Grower.outstanding_lien_balance_cents recomputed when lien_protected is true"
          - "increments PaymentInstallment.version by 1"
      - from: PARTIALLY_PAID
        to: PAID
        trigger: "POST /grower-relations/payment-installments/{installmentId}/payments"
        actor: AccountsPayableClerk
        preconditions:
          - "status in {PARTIALLY_PAID, SCHEDULED, DELINQUENT}"
          - "amount_cents == planned_amount_cents - paid_amount_cents"
        side_effects:
          - "paid_amount_cents increased by amount_cents so that paid_amount_cents == planned_amount_cents"
          - "Grower.outstanding_lien_balance_cents recomputed when lien_protected is true"
          - "because this was the last outstanding lien_protected installment, GrapeContract.lien_released_at is stamped"
          - "because every installment of the contract is now PAID, GrapeContract transitions SETTLED -> CLOSED"
          - "increments PaymentInstallment.version by 1"
        note: "The same transition edge applies from SCHEDULED and DELINQUENT when the payment settles the full remaining balance in one call."
      - from: SCHEDULED
        to: DELINQUENT
        trigger: "system event on POST /_clock/set_current_utc advancing now past due_at while paid_amount_cents < planned_amount_cents"
        actor: system
        preconditions:
          - "status in {SCHEDULED, PARTIALLY_PAID}"
          - "now > due_at"
          - "paid_amount_cents < planned_amount_cents"
        side_effects:
          - "increments PaymentInstallment.version by 1"

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: weigh-tag-create-stale-appointment
    parent_entity: DeliveryAppointment
    write_endpoint: "POST /grower-relations/weigh-tags"
    occ_field: "expected_appointment_version"
    description: |
      A crush-pad slot legitimately receives several tags (one truck per block), so a second
      create against the same appointment is a valid product operation rather than a state
      violation. Creating a WeighTag against a DeliveryAppointment whose version has advanced
      since the client last observed it is therefore rejected on the stale version, because the
      client's view of how much of the slot's planned tonnage is still uncaptured is out of date.
    error_id: ERR_STALE_APPOINTMENT_VERSION
    http_status: 412

  - rule_id: grade-create-stale-weigh-tag
    parent_entity: WeighTag
    write_endpoint: "POST /grower-relations/weigh-tags/{tagId}/grades"
    occ_field: "expected_weigh_tag_version"
    description: |
      A re-grade after a dispute legitimately supersedes the prior grading, so a second grade
      create against the same tag is a valid product operation rather than a state violation.
      Recording a QualityGrade against a WeighTag whose version has advanced since the client
      last observed it is rejected on the stale version, because the grader's view of the tag's
      net weight, disposition and superseded grade history is out of date.
    error_id: ERR_STALE_WEIGH_TAG_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: net_weight_conversion
    trigger: "POST /grower-relations/weigh-tags/{tagId}/tare (the outbound scale pass)"
    algorithm: aggregation
    formula: |
      net_weight_lbs = gross_weight_lbs - tare_weight_lbs           # both whole pounds
      net_tons       = round_half_up(net_weight_lbs / LBS_PER_TON, 3)
      # A tare equal to the gross is legal (the whole load was rejected in the field and
      # dumped before the outbound pass); it yields net_weight_lbs = 0 and net_tons = 0.000.
    input_set: "A single WeighTag with weigh_status GROSS_CAPTURED; no other rows participate."
    constants:
      LBS_PER_TON: 2000
    precision: "net_weight_lbs is a whole integer; net_tons carries 3 decimal places, round_half_up"

  - name: quality_adjustment_pct
    trigger: "POST /grower-relations/weigh-tags/{tagId}/grades, before any tonnage allocation or pricing"
    algorithm: threshold
    formula: |
      # ---- combinatorial formula, mode (a): four independently-gated component
      # ---- sub-formulas over the SAME grading inputs, summed, then clamped once.
      # All comparisons are performed on integer tenths to keep the step arithmetic exact:
      #   t(x) = round_half_up(x * 10)          # x carries at most 1 decimal place
      spec = QualitySpec of the weigh tag's contract

      # --- component 1: sugar (Brix), a two-sided stepped band -------------------
      if t(brix) > t(spec.brix_bonus_start):
          bonus_steps        = floor((t(brix) - t(spec.brix_bonus_start)) / t(spec.brix_step))
          brix_component_pct = +bonus_steps * spec.brix_bonus_pct_per_step
      elif t(brix) < t(spec.brix_penalty_start):
          penalty_steps      = floor((t(spec.brix_penalty_start) - t(brix)) / t(spec.brix_step))
          brix_component_pct = -penalty_steps * spec.brix_penalty_pct_per_step
      else:
          brix_component_pct = 0.0        # the dead band [brix_penalty_start, brix_bonus_start]

      # --- component 2: acid (TA), a flat two-sided out-of-spec penalty ----------
      if t(ta_gl) < t(spec.ta_min_gl) or t(ta_gl) > t(spec.ta_max_gl):
          acid_component_pct = -spec.acid_out_of_spec_penalty_pct
      else:
          acid_component_pct = 0.0

      # --- component 3: rot, penalised per WHOLE point above the free allowance --
      if t(rot_pct) > t(spec.rot_free_pct):
          whole_points      = floor((t(rot_pct) - t(spec.rot_free_pct)) / 10)
          rot_component_pct = -whole_points * spec.rot_penalty_pct_per_point
      else:
          rot_component_pct = 0.0
      # NOTE the deliberate asymmetry: rot 5.5 with rot_free_pct 2.0 gives whole_points = 3
      # (not 3.5), because only completed points are charged.

      # --- component 4: material other than grapes, a flat penalty --------------
      if t(mog_pct) > t(spec.mog_max_pct):
          mog_component_pct = -spec.mog_penalty_pct
      else:
          mog_component_pct = 0.0

      # --- sum, then clamp exactly once -----------------------------------------
      raw_adjustment_pct = brix_component_pct + acid_component_pct
                         + rot_component_pct  + mog_component_pct
      adjustment_pct     = min(spec.max_total_bonus_pct,
                               max(-spec.max_total_penalty_pct, raw_adjustment_pct))

      # raw_adjustment_pct is PERSISTED because the WEIGHTED_BLEND settlement variant
      # blends the pre-clamp values and clamps the blend once; clamping per load first
      # and blending afterwards is a different (wrong) number.

      recommended_disposition =
          REJECT_QUALITY if t(brix) < t(spec.min_brix_accept)
                          or t(rot_pct) >= t(spec.rot_rejection_pct)
          else ACCEPT
    input_set: "The single QualityGrade being recorded plus the QualitySpec referenced by the weigh tag's contract. Superseded QualityGrade rows never contribute."
    constants:
      BRIX_ROT_TENTHS_SCALE: 10
    precision: "every component and both adjustment totals carry 1 decimal place, round_half_up; step counts are exact integers"
    variants:
      - name: FULL_COMPONENTS
        when: "the line being priced has bucket CONTRACT"
        difference: "adjustment_pct is applied verbatim, bonus components included"
      - name: BONUS_SUPPRESSED
        when: "the line being priced has bucket OVER_DELIVERY"
        difference: "adjustment_pct_applied = min(adjustment_pct, 0.0) — over-cap fruit never earns a quality bonus, but still absorbs every penalty"

  - name: tonnage_cap_derivation
    trigger: "POST /grower-relations/grape-contracts/{contractId}/accept"
    algorithm: aggregation
    formula: |
      if contract_basis == TONNAGE:
          contract_cap_tons = committed_tons
          cap_scope         = PER_CONTRACT
      elif contract_basis == ACREAGE:
          total_acres       = sum(allocation.allocated_acres for every ContractBlockAllocation of the contract)
          contract_cap_tons = round_half_up(total_acres * contracted_yield_tons_per_acre, 3)
          cap_scope         = PER_CONTRACT
      else:   # contract_basis == BLOCK
          # each block carries its OWN cap; the contract-level figure is their sum, and the
          # waterfall consumes the per-block cap rather than the contract-wide one
          for each allocation:
              block  = VineyardBlock of allocation.block_id
              allocation.block_cap_tons      = round_half_up(block.acres * block.expected_yield_tons_per_acre, 3)
              allocation.block_hard_cap_tons = round_half_up(allocation.block_cap_tons
                                               * (1 + over_delivery_tolerance_pct / 100), 3)
          contract_cap_tons = round_half_up(sum(allocation.block_cap_tons), 3)
          cap_scope         = PER_BLOCK

      hard_cap_tons = round_half_up(contract_cap_tons * (1 + over_delivery_tolerance_pct / 100), 3)
    input_set: "Every ContractBlockAllocation with contract_id equal to the contract, and for BLOCK basis the VineyardBlock each allocation points at."
    constants: {}
    precision: "3 decimal places, round_half_up"

  - name: tonnage_waterfall_allocation
    trigger: "POST /grower-relations/weigh-tags/{tagId}/grades, after quality_adjustment_pct and only when recommended_disposition == ACCEPT"
    algorithm: waterfall_allocation
    formula: |
      # Buckets are consumed strictly in order; bucket 1 must be full before bucket 2 fills.
      if contract.cap_scope == PER_CONTRACT:
          soft_cap       = contract.contract_cap_tons
          hard_cap       = contract.hard_cap_tons
          consumed_soft  = contract.delivered_contract_tons
          consumed_total = contract.delivered_contract_tons + contract.delivered_over_tons
      else:                                     # PER_BLOCK
          alloc          = the ContractBlockAllocation with (contract_id, block_id = tag.block_id)
          soft_cap       = alloc.block_cap_tons
          hard_cap       = alloc.block_hard_cap_tons
          consumed_soft  = tons on this allocation's SettlementLines with bucket CONTRACT
          consumed_total = tons on this allocation's SettlementLines, both buckets

      soft_remaining = max(0.000, soft_cap - consumed_soft)
      hard_remaining = max(0.000, hard_cap - consumed_total)

      # ---- bucket 1: contract tonnage ------------------------------------------
      contract_slice_tons = min(net_tons, soft_remaining)
      remainder           = net_tons - contract_slice_tons

      # ---- bucket 2: the over-delivery tolerance band ---------------------------
      band_capacity = max(0.000, hard_remaining - contract_slice_tons)
      band_slice    = min(remainder, band_capacity)
      if contract.over_delivery_policy == REJECT:
          over_slice_tons    = 0.000
          over_rejected_tons = band_slice        # inside the band, but the contract refuses it
      else:
          over_slice_tons    = band_slice
          over_rejected_tons = 0.000

      # ---- bucket 3: above the hard cap, always refused -------------------------
      excess_rejected_tons = remainder - band_slice

      # ---- resulting disposition ----------------------------------------------
      if contract_slice_tons + over_slice_tons == 0.000:
          disposition = REJECTED_OVER_CAP
      elif over_rejected_tons > 0.000 or excess_rejected_tons > 0.000:
          disposition = PARTIALLY_ACCEPTED
      else:
          disposition = ACCEPTED

      # one SettlementLine per non-zero accepted bucket, CONTRACT before OVER_DELIVERY
    input_set: |
      Contract-wide consumption counts tons on SettlementLines with status in {PROVISIONAL, FINAL};
      VOID lines are excluded, which is what makes a grade dispute return capacity to the contract.
    order: "Loads consume capacity in QualityGrade.created_at ascending order; ties are broken by WeighTag.created_at ascending. Allocation order is never derived from any id."
    constants: {}
    precision: "3 decimal places, round_half_up; the four slices always sum exactly to net_tons"

  - name: settlement_line_amount
    trigger: "creation of each SettlementLine during POST /grower-relations/weigh-tags/{tagId}/grades"
    algorithm: tiered_pricing
    formula: |
      # ---- combinatorial formula, mode (b): a NESTED pipeline whose inner rounding
      # ---- result feeds the outer step. Rounding to whole cents happens at the
      # ---- per-ton price FIRST, and the rounded per-ton price is what multiplies tons.
      # step 1 - which adjustment applies to this bucket
      if bucket == CONTRACT:
          adjustment_pct_applied = grade.adjustment_pct
          base_cents             = contract.base_price_per_ton_cents
      else:                                   # bucket == OVER_DELIVERY
          adjustment_pct_applied = min(grade.adjustment_pct, 0.0)          # bonuses suppressed
          if contract.over_delivery_policy == ACCEPT_AT_SPOT:
              base_cents = round_half_up(contract.base_price_per_ton_cents
                                         * contract.spot_price_pct / 100)
          else:                               # ACCEPT_AT_CONTRACT
              base_cents = contract.base_price_per_ton_cents

      # step 2 - INNER rounding: the adjusted per-ton price is fixed to whole cents
      price_per_ton_cents = round_half_up(base_cents * (1 + adjustment_pct_applied / 100))

      # step 3 - OUTER rounding: the whole-cent per-ton price multiplies the slice
      gross_amount_cents = round_half_up(price_per_ton_cents * tons)

      # step 4 - the provisional advance rides on the rounded gross
      provisional_amount_cents = round_half_up(gross_amount_cents
                                 * contract.provisional_payment_pct / 100)
      # Collapsing steps 2 and 3 into round_half_up(base * (1 + adj/100) * tons) is a
      # different number whenever base * (1 + adj/100) is not already a whole cent.
    input_set: "The active QualityGrade of the weigh tag, the tag's slice tons for this bucket, and the contract's pricing fields."
    constants: {}
    precision: "all money is whole cents, round_half_up at each declared step; tons carry 3 decimal places"

  - name: final_settlement_total
    trigger: "POST /grower-relations/grape-contracts/{contractId}/settlement-close"
    algorithm: weighted_scoring
    formula: |
      lines = SettlementLines of the contract with status PROVISIONAL, ordered by created_at ASC
      # variant selection is data-driven: contract.settlement_basis
    input_set: "Only SettlementLines with status PROVISIONAL participate; VOID lines are ignored and never restored."
    constants: {}
    precision: "whole cents, round_half_up; the sum of the per-line final_amount_cents equals settlement_total_cents exactly"
    variants:
      - name: LOAD_BY_LOAD
        when: "contract.settlement_basis == LOAD_BY_LOAD"
        difference: |
          Each line keeps the price it was struck at:
            line.final_amount_cents = line.gross_amount_cents
            settlement_total_cents  = sum(line.final_amount_cents)
          Each load's clamp was already applied individually at grading time.
      - name: WEIGHTED_BLEND
        when: "contract.settlement_basis == WEIGHTED_BLEND"
        difference: |
          Only the CONTRACT bucket is re-priced, at one tonnage-weighted blended quality
          adjustment computed from the PRE-clamp raw_adjustment_pct values:

            c_lines     = lines with bucket CONTRACT
            blend_tons  = sum(l.tons for l in c_lines)
            blend_raw   = round_half_up(sum(l.tons * grade(l).raw_adjustment_pct for l in c_lines)
                                        / blend_tons, 2)
            blend_adj   = min(spec.max_total_bonus_pct,
                              max(-spec.max_total_penalty_pct, blend_raw))     # clamped ONCE
            blend_price = round_half_up(contract.base_price_per_ton_cents
                                        * (1 + blend_adj / 100))
            bucket_total = round_half_up(blend_price * blend_tons)
            for l in c_lines ordered by created_at ASC:
                l.final_amount_cents = round_half_up(bucket_total * l.tons / blend_tons)
            residual = bucket_total - sum(l.final_amount_cents for l in c_lines)
            add residual to the LAST line by created_at ASC        # money conservation

          OVER_DELIVERY lines are NOT blended: each keeps final_amount_cents = gross_amount_cents,
          because spot tonnage was never part of the contract price.

            settlement_total_cents = bucket_total + sum(over-delivery gross_amount_cents)

          Divergence: blending pre-clamp adjustments lets a load whose own bonus was clipped by
          max_total_bonus_pct pull the blend above that clip's effect, so the two variants return
          different totals for byte-identical load data.

  - name: net_payable_derivation
    trigger: "POST /grower-relations/grape-contracts/{contractId}/settlement-close, immediately after final_settlement_total"
    algorithm: tiered_pricing
    formula: |
      # ---- combinatorial formula, mode (c): a SEQUENTIAL pipeline in which each step
      # ---- consumes the previous step's output and the ORDER IS OBSERVABLE.
      # step 1 - the settled gross
      settlement_total_cents = final_settlement_total(contract)

      # step 2 - prompt-payment tier, keyed on the PRE-CREDIT settlement total
      if   settlement_total_cents <  PROMPT_TIER_1_CENTS: rate_pct = 0.0
      elif settlement_total_cents <  PROMPT_TIER_2_CENTS: rate_pct = 0.5
      elif settlement_total_cents <  PROMPT_TIER_3_CENTS: rate_pct = 1.0
      else:                                               rate_pct = 1.5

      # step 3 - the credit itself
      prompt_pay_credit_cents = round_half_up(settlement_total_cents * rate_pct / 100)

      # step 4 - statutory producer-lien holdback, ALSO keyed on the pre-credit total
      lien_holdback_cents = round_half_up(settlement_total_cents
                                          * contract.lien_holdback_pct / 100)

      # step 5 - the distributable amount
      net_payable_cents = settlement_total_cents + prompt_pay_credit_cents - lien_holdback_cents

      # Re-ordering matters: looking the tier up on (total + credit) or on (total - holdback)
      # moves a contract sitting on a tier boundary into the neighbouring tier, and applying
      # the holdback percentage to the credited subtotal changes the holdback itself.
    input_set: "The contract's FINAL SettlementLines only."
    constants:
      PROMPT_TIER_1_CENTS: 5000000
      PROMPT_TIER_2_CENTS: 10000000
      PROMPT_TIER_3_CENTS: 15000000
      PROMPT_TIER_0_RATE_PCT: 0.0
      PROMPT_TIER_1_RATE_PCT: 0.5
      PROMPT_TIER_2_RATE_PCT: 1.0
      PROMPT_TIER_3_RATE_PCT: 1.5
    precision: "whole cents, round_half_up; rate_pct carries 1 decimal place"

  - name: installment_waterfall
    trigger: "POST /grower-relations/grape-contracts/{contractId}/settlement-close, after net_payable_derivation"
    algorithm: waterfall_allocation
    formula: |
      installments = PaymentInstallments of the contract, ordered by installment_no ASC
      for each i in installments:
          i.planned_amount_cents = round_half_up(net_payable_cents * i.pct_of_settlement / 100)
          i.due_at               = settlement_closed_at + i.due_offset_days days

      # money conservation: percentages that each round independently need not sum to the
      # whole, so the drift is pushed onto ONE deterministic installment.
      residual = net_payable_cents - sum(i.planned_amount_cents)
      the installment with the HIGHEST installment_no absorbs residual
          (its planned_amount_cents += residual, residual may be negative)

      # invariant, asserted after every settlement close:
      #   sum(planned_amount_cents) == net_payable_cents
    input_set: "Every PaymentInstallment of the contract; all of them are in status PENDING_SETTLEMENT at this point."
    order: "installment_no ascending, which is materialised from the contract's installment_plan array order — never from any id."
    constants: {}
    precision: "whole cents, round_half_up; residual absorption is exact, not rounded"

  - name: grower_reliability_score
    trigger: "any transition that produces a rejected load, an expired pick call or a no-show appointment, and on POST /_clock/set_current_utc when those clock-driven transitions fire"
    algorithm: decay_function
    formula: |
      vintage = the UTC calendar year of the logical clock's current instant

      current_units = REJECTED_LOAD_UNITS   * rejected_load_count_vintage
                    + EXPIRED_CALL_UNITS    * expired_pick_call_count_vintage
                    + NO_SHOW_UNITS         * no_show_appointment_count_vintage

      # prior_vintage_penalty_units is the same weighted sum over every UTC calendar year
      # strictly before `vintage`; it decays to HALF its weight in the lifetime view.
      # variant selection below.
    input_set: |
      WeighTags with disposition in {REJECTED_QUALITY, REJECTED_OVER_CAP}, PickCalls with status
      EXPIRED and DeliveryAppointments with status NO_SHOW, all reached through the Grower's
      contracts and bucketed by their own created_at UTC calendar year. A tag whose rejection was
      undone by a grade dispute leaves disposition DISPUTED and therefore stops counting.
    constants:
      REJECTED_LOAD_UNITS: 8
      EXPIRED_CALL_UNITS: 5
      NO_SHOW_UNITS: 3
      RELIABILITY_BASE: 100
      PRIOR_VINTAGE_DECAY_DIVISOR: 2
    precision: "1 decimal place, round_half_up; the halved prior-vintage term is rounded to a whole unit with round_half_up BEFORE subtraction, and both scores are floored at 0.0"
    variants:
      - name: VINTAGE_SCOPED
        when: "reading Grower.reliability_score_vintage, and whenever a harvest-season gate (pick-call issuance) consults reliability"
        difference: "reliability_score_vintage = max(0.0, RELIABILITY_BASE - current_units); prior vintages are ignored entirely"
      - name: LIFETIME_SCOPED
        when: "reading Grower.reliability_score_lifetime, and whenever a contract-term gate (renewal) consults reliability"
        difference: |
          reliability_score_lifetime = max(0.0, RELIABILITY_BASE - current_units
                                         - round_half_up(prior_vintage_penalty_units
                                                         / PRIOR_VINTAGE_DECAY_DIVISOR))
          With current_units 8 and prior_vintage_penalty_units 5 the two variants return
          92.0 and 89.0 from identical stored rows; with prior 13 they return 92.0 and 85.0.

# =============================================================================
# 1.4 Validation Rules Table (Ordered by Priority)
# =============================================================================
# Domain priority doctrine for this scenario, highest first:
#   auth -> existence -> request shape -> optimistic concurrency -> state
#   -> producer compliance & fruit safety -> scheduling constraints -> temporal
#   -> referential integrity -> fiscal capacity
# Rationale: a suspended producer or immature fruit is a compliance/quality question that
# outranks how the crush pad is booked; a booking that lands outside the pick window is
# meaningless before anyone asks whether the lane has tonnage left, so temporal outranks
# fiscal. Three conflict pairs are called out explicitly at the end of the table.
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers are both present and non-blank"
    error_id: ERR_MISSING_AUTH_HEADER
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "X-User-Role is one of the six declared roles AND is listed in the endpoint's roles"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 3
    category: auth
    check: |
      When X-User-Role is Grower, X-User-ID must equal the Grower.id that owns the target:
      GrapeContract.grower_id for contract actions, VineyardBlock.grower_id for block reads,
      and the contract reached through PickCall -> DeliveryAppointment -> WeighTag for grade
      disputes. A Grower may never act on another producer's rows.
    error_id: ERR_NOT_CONTRACT_GROWER
    http_status: 403
    applies_to: "all Grower-permitted endpoints"

  - priority: 4
    category: auth
    check: "X-User-ID must differ from WeighTag.captured_by_user_id — the person who weighed the load may not grade it (segregation of duties)"
    error_id: ERR_SOD_SAME_USER_GRADING
    http_status: 403
    applies_to: "POST /grower-relations/weigh-tags/{tagId}/grades"

  - priority: 5
    category: existence
    check: "Every id in the URL path exists, validated left to right"
    error_id: "ERR_GROWER_NOT_FOUND | ERR_BLOCK_NOT_FOUND | ERR_QUALITY_SPEC_NOT_FOUND | ERR_CONTRACT_NOT_FOUND | ERR_ALLOCATION_NOT_FOUND | ERR_LANE_NOT_FOUND | ERR_CREW_NOT_FOUND | ERR_SAMPLING_VISIT_NOT_FOUND | ERR_PICK_CALL_NOT_FOUND | ERR_APPOINTMENT_NOT_FOUND | ERR_WEIGH_TAG_NOT_FOUND | ERR_SETTLEMENT_LINE_NOT_FOUND | ERR_INSTALLMENT_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path parameters"

  - priority: 6
    category: existence
    check: "Every foreign-key id in the request body resolves to an existing row, validated in the field order declared in §1.1"
    error_id: "ERR_GROWER_NOT_FOUND | ERR_BLOCK_NOT_FOUND | ERR_QUALITY_SPEC_NOT_FOUND | ERR_CONTRACT_NOT_FOUND | ERR_LANE_NOT_FOUND | ERR_CREW_NOT_FOUND | ERR_PICK_CALL_NOT_FOUND | ERR_APPOINTMENT_NOT_FOUND | ERR_WEIGH_TAG_NOT_FOUND"
    http_status: 404
    applies_to: "all POST endpoints carrying FK fields"

  - priority: 7
    category: state
    check: |
      Request shape: required fields present, JSON types correct, enum values inside the
      declared sets, numeric ranges and decimal-place limits respected, window_end strictly
      after window_start, ISO-8601 datetimes parseable.
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: all

  - priority: 8
    category: state
    check: "limit is an integer in [1, 100] and offset is an integer >= 0"
    error_id: ERR_INVALID_PAGINATION
    http_status: 400
    applies_to: "all list endpoints"

  - priority: 9
    category: state
    check: |
      Conditional shape by contract_basis: TONNAGE requires committed_tons and forbids
      contracted_yield_tons_per_acre; ACREAGE requires contracted_yield_tons_per_acre and
      forbids committed_tons; BLOCK forbids both. ContractBlockAllocation.allocated_acres is
      required when the contract's basis is ACREAGE and forbidden otherwise.
    error_id: ERR_BASIS_FIELD_MISMATCH
    http_status: 422
    applies_to: "POST /grower-relations/grape-contracts, POST /grower-relations/contract-block-allocations"

  - priority: 10
    category: state
    check: "installment_plan has 1-6 elements, installment_no values are exactly 1..n with no gaps or repeats, every pct_of_settlement is > 0, and the pct_of_settlement values sum to exactly 100.0"
    error_id: ERR_INVALID_INSTALLMENT_PLAN
    http_status: 422
    applies_to: "POST /grower-relations/grape-contracts"

  - priority: 11
    category: business_constraint
    check: |
      Uniqueness: Grower.license_number, QualitySpec.spec_code, GrapeContract.contract_code,
      CrushPadLane.lane_code, SamplingCrew.crew_code, VineyardBlock (grower_id, block_code)
      and ContractBlockAllocation (contract_id, block_id) are each unique.
    error_id: ERR_DUPLICATE_CODE
    http_status: 409
    applies_to: "POST /grower-relations/growers, /vineyard-blocks, /quality-specs, /grape-contracts, /crush-pad-lanes, /sampling-crews, /contract-block-allocations"

  - priority: 12
    category: state
    check: "expected_appointment_version equals the current DeliveryAppointment.version"
    error_id: ERR_STALE_APPOINTMENT_VERSION
    http_status: 412
    applies_to: "POST /grower-relations/weigh-tags"

  - priority: 13
    category: state
    check: "expected_weigh_tag_version equals the current WeighTag.version"
    error_id: ERR_STALE_WEIGH_TAG_VERSION
    http_status: 412
    applies_to: "POST /grower-relations/weigh-tags/{tagId}/grades"

  - priority: 20
    category: state
    check: |
      GrapeContract.lifecycle_status permits the requested transition or write: offer needs
      DRAFT or COUNTERED, counter and accept need OFFERED, withdraw-offer needs OFFERED,
      allocations and sampling visits need DRAFT or OFFERED or ACTIVE, pick calls need ACTIVE,
      settlement-close needs ACTIVE, termination-notice needs ACTIVE, and no write of any kind
      is accepted once lifecycle_status is CLOSED, TERMINATED or WITHDRAWN.
    error_id: ERR_CONTRACT_STATE_INVALID
    http_status: 409
    applies_to: "all contract-scoped writes"

  - priority: 21
    category: state
    check: "PickCall.status permits the action: acknowledge needs ISSUED, revise needs ACKNOWLEDGED, and creating a DeliveryAppointment needs ACKNOWLEDGED"
    error_id: ERR_PICK_CALL_STATE_INVALID
    http_status: 409
    applies_to: "POST /grower-relations/pick-calls/{pickCallId}/acknowledge, POST /grower-relations/pick-calls/{pickCallId}/revise, POST /grower-relations/delivery-appointments"

  - priority: 22
    category: state
    check: "The DeliveryAppointment is open for receiving: status must be SCHEDULED or ARRIVED to accept a new WeighTag, and SCHEDULED to be cancelled"
    error_id: ERR_APPOINTMENT_NOT_OPEN
    http_status: 409
    applies_to: "POST /grower-relations/weigh-tags, POST /grower-relations/delivery-appointments/{appointmentId}/cancel"

  - priority: 23
    category: state
    check: "CrushPadLane.status is OPEN"
    error_id: ERR_LANE_CLOSED
    http_status: 409
    applies_to: "POST /grower-relations/delivery-appointments"

  - priority: 24
    category: state
    check: "WeighTag.weigh_status permits the action: tare needs GROSS_CAPTURED, grading needs NET_FINAL, and settlement-close needs every WeighTag reachable through the contract to have left GROSS_CAPTURED (an untared load on the pad blocks the close)"
    error_id: ERR_TAG_WEIGH_STATE_INVALID
    http_status: 409
    applies_to: "POST /grower-relations/weigh-tags/{tagId}/tare, POST /grower-relations/weigh-tags/{tagId}/grades, POST /grower-relations/grape-contracts/{contractId}/settlement-close"

  - priority: 25
    category: state
    check: "WeighTag.disposition permits the action: grading needs PENDING or DISPUTED, a dispute needs ACCEPTED or PARTIALLY_ACCEPTED or REJECTED_QUALITY, and settlement-close needs no WeighTag reachable through the contract to sit in PENDING or DISPUTED (an ungraded or contested load blocks the close)"
    error_id: ERR_TAG_NOT_DISPUTABLE
    http_status: 409
    applies_to: "POST /grower-relations/weigh-tags/{tagId}/grade-disputes, POST /grower-relations/weigh-tags/{tagId}/grades, POST /grower-relations/grape-contracts/{contractId}/settlement-close"

  - priority: 26
    category: state
    check: "PaymentInstallment.status is SCHEDULED, PARTIALLY_PAID or DELINQUENT"
    error_id: ERR_INSTALLMENT_NOT_PAYABLE
    http_status: 409
    applies_to: "POST /grower-relations/payment-installments/{installmentId}/payments"

  - priority: 27
    category: state
    check: |
      Cycle-termination counters. GrapeContract.offer_round must be strictly less than
      MAX_OFFER_ROUNDS (3), so the fourth offer is refused and the OFFERED/COUNTERED loop
      terminates; PickCall.revision_count must be strictly less than MAX_PICK_CALL_REVISIONS
      (2), so the third revision is refused and the ACKNOWLEDGED/ISSUED loop terminates.
    error_id: "ERR_MAX_OFFER_ROUNDS_EXCEEDED | ERR_MAX_PICK_CALL_REVISIONS_EXCEEDED"
    http_status: 409
    applies_to: "POST /grower-relations/grape-contracts/{contractId}/offer, POST /grower-relations/pick-calls/{pickCallId}/revise"

  - priority: 28
    category: state
    check: "GrapeContract.renewal_status is RENEWAL_WINDOW_OPEN and now < renewal_window_closes_at; additionally the Grower's LIFETIME_SCOPED reliability score must be >= RENEWAL_MIN_RELIABILITY_SCORE (80.0), which is why a renewal can be refused on a producer whose VINTAGE_SCOPED score still clears the bar"
    error_id: "ERR_RENEWAL_WINDOW_NOT_OPEN | ERR_RELIABILITY_BELOW_RENEWAL_THRESHOLD"
    http_status: 409
    applies_to: "POST /grower-relations/grape-contracts/{contractId}/renew"

  - priority: 29
    category: state
    check: "At least one ContractBlockAllocation exists for the contract before it can be accepted"
    error_id: ERR_NO_ALLOCATIONS
    http_status: 409
    applies_to: "POST /grower-relations/grape-contracts/{contractId}/accept"

  - priority: 30
    category: state
    check: "At least one SettlementLine of the contract has status PROVISIONAL"
    error_id: ERR_NO_PROVISIONAL_LINES
    http_status: 409
    applies_to: "POST /grower-relations/grape-contracts/{contractId}/settlement-close"

  - priority: 31
    category: business_safety
    check: "The Grower reached from the target row has status ACTIVE; a suspended producer may not be contracted with, called for pick, booked into a lane, weighed in, graded or paid"
    error_id: ERR_GROWER_SUSPENDED
    http_status: 403
    applies_to: "POST /grower-relations/grape-contracts/{contractId}/offer, /accept, POST /grower-relations/pick-calls, POST /grower-relations/delivery-appointments, POST /grower-relations/weigh-tags, POST /grower-relations/payment-installments/{installmentId}/payments"

  - priority: 32
    category: business_safety
    check: |
      Fruit maturity gate: the pick call's block must have at least one SamplingVisit with
      status COMPLETED and maturity_flag PICK_READY for the same contract, and that visit's
      measured_rot_pct must be strictly below the contract QualitySpec.rot_rejection_pct.
      Calling immature or rotten fruit to the crush pad is refused before scheduling is
      considered at all.
    error_id: ERR_BLOCK_NOT_PICK_READY
    http_status: 422
    applies_to: "POST /grower-relations/pick-calls"

  - priority: 33
    category: business_constraint
    check: |
      Lane exclusivity: [window_start, window_end) must not overlap the buffered window
      [other.window_start - turnaround_buffer_minutes, other.window_end + turnaround_buffer_minutes)
      of any DeliveryAppointment on the same lane with status SCHEDULED or ARRIVED. Windows that
      merely touch after the buffer is applied are accepted.
    error_id: ERR_LANE_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /grower-relations/delivery-appointments"

  - priority: 34
    category: business_constraint
    check: |
      Crew saturation: the number of SamplingVisits for the crew with status SCHEDULED whose
      [window_start, window_end) overlaps the requested window must be strictly less than
      SamplingCrew.max_concurrent_visits. Half-open comparison: a visit ending exactly at the
      requested window_start does not overlap.
    error_id: ERR_CREW_WINDOW_OVERLAP_LIMIT
    http_status: 409
    applies_to: "POST /grower-relations/sampling-visits"

  - priority: 35
    category: business_temporal
    check: "The appointment window must sit inside the pick call's delivery envelope: window_start >= PickCall.target_pick_at and window_start <= PickCall.target_pick_at + DELIVERY_GRACE_HOURS (72)"
    error_id: ERR_APPOINTMENT_OUTSIDE_PICK_WINDOW
    http_status: 422
    applies_to: "POST /grower-relations/delivery-appointments"

  - priority: 36
    category: business_temporal
    check: "The logical clock must sit inside the arrival envelope: window_start <= now < window_end + LATE_ARRIVAL_GRACE_MINUTES (60)"
    error_id: ERR_OUTSIDE_APPOINTMENT_WINDOW
    http_status: 409
    applies_to: "POST /grower-relations/weigh-tags"

  - priority: 37
    category: business_temporal
    check: "target_pick_at must be at least the contract's min_pick_notice_hours after the logical clock's current instant, on both issuance and revision"
    error_id: ERR_INSUFFICIENT_PICK_NOTICE
    http_status: 422
    applies_to: "POST /grower-relations/pick-calls, POST /grower-relations/pick-calls/{pickCallId}/revise"

  - priority: 38
    category: business_temporal
    check: "now must be STRICTLY BEFORE PickCall.ack_deadline_at. At now == ack_deadline_at exactly the call has not auto-expired (the ISSUED -> EXPIRED edge needs now > ack_deadline_at) yet acknowledgement is already refused, so this error is reachable on that single instant"
    error_id: ERR_ACK_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /grower-relations/pick-calls/{pickCallId}/acknowledge"

  - priority: 39
    category: business_temporal
    check: "now must be at or before WeighTag.dispute_deadline_at, which is the first grading instant plus GRADE_DISPUTE_WINDOW_HOURS (72) and is NOT extended by a re-grade"
    error_id: ERR_DISPUTE_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /grower-relations/weigh-tags/{tagId}/grade-disputes"

  - priority: 40
    category: business_temporal
    check: "effective_at on a termination notice must be at least the contract's termination_notice_days after the logical clock's current instant"
    error_id: ERR_TERMINATION_NOTICE_TOO_SHORT
    http_status: 422
    applies_to: "POST /grower-relations/grape-contracts/{contractId}/termination-notice"

  - priority: 41
    category: business_referential
    check: "The block must be allocated to the contract: a ContractBlockAllocation with (contract_id, block_id) must exist for pick calls, sampling visits and weigh tags"
    error_id: ERR_BLOCK_NOT_ALLOCATED
    http_status: 409
    applies_to: "POST /grower-relations/pick-calls, POST /grower-relations/sampling-visits, POST /grower-relations/weigh-tags"

  - priority: 42
    category: business_referential
    check: "SamplingCrew.region_code must equal the region_code of the Grower that farms the sampled block"
    error_id: ERR_CREW_REGION_MISMATCH
    http_status: 422
    applies_to: "POST /grower-relations/sampling-visits"

  - priority: 43
    category: business_referential
    check: "VineyardBlock.grower_id must equal the contract's grower_id and VineyardBlock.status must be ACTIVE"
    error_id: ERR_BLOCK_GROWER_MISMATCH
    http_status: 409
    applies_to: "POST /grower-relations/contract-block-allocations, POST /grower-relations/pick-calls"

  - priority: 44
    category: business_fiscal
    check: |
      Lane daily tonnage: the sum of planned_tons over DeliveryAppointments on the same lane
      with status SCHEDULED or ARRIVED whose window_start falls on the same UTC calendar date
      as the requested window_start, plus the requested planned_tons, must be <=
      CrushPadLane.daily_capacity_tons. Equality is accepted.
    error_id: ERR_LANE_DAILY_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /grower-relations/delivery-appointments"

  - priority: 45
    category: business_fiscal
    check: "planned_tons must be <= CrushPadLane.max_load_tons"
    error_id: ERR_LOAD_EXCEEDS_LANE_MAX
    http_status: 409
    applies_to: "POST /grower-relations/delivery-appointments"

  - priority: 46
    category: business_fiscal
    check: "tare_weight_lbs must be <= gross_weight_lbs; equality is legal and yields net_tons 0.000"
    error_id: ERR_TARE_EXCEEDS_GROSS
    http_status: 422
    applies_to: "POST /grower-relations/weigh-tags/{tagId}/tare"

  - priority: 47
    category: business_fiscal
    check: "amount_cents must be <= planned_amount_cents - paid_amount_cents; overpayment of an installment is refused rather than spilled into the next one"
    error_id: ERR_PAYMENT_EXCEEDS_BALANCE
    http_status: 409
    applies_to: "POST /grower-relations/payment-installments/{installmentId}/payments"

  - priority: 48
    category: business_fiscal
    check: "Grower.outstanding_lien_balance_cents must be 0 when a termination notice is served. The balance is GROWER-WIDE: a lien-protected installment outstanding on any OTHER contract of the same producer blocks termination of this one, because the statutory producer lien attaches to the producer and survives termination"
    error_id: ERR_LIEN_OUTSTANDING
    http_status: 409
    applies_to: "POST /grower-relations/grape-contracts/{contractId}/termination-notice"

# --- declared priority-conflict pairs (each is a §1.8 priority_pair test) -------------
#  A) business_safety(31) ERR_GROWER_SUSPENDED  vs  business_constraint(33) ERR_LANE_WINDOW_CONFLICT
#     on POST /grower-relations/delivery-appointments -> ERR_GROWER_SUSPENDED wins.
#  B) business_temporal(35) ERR_APPOINTMENT_OUTSIDE_PICK_WINDOW vs business_fiscal(44)
#     ERR_LANE_DAILY_CAPACITY_EXCEEDED on the same endpoint -> the temporal error wins.
#  C) state(22) ERR_APPOINTMENT_NOT_OPEN  vs  business_temporal(36) ERR_OUTSIDE_APPOINTMENT_WINDOW
#     on POST /grower-relations/weigh-tags -> ERR_APPOINTMENT_NOT_OPEN wins.

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---------------------------------------------------------------- Grower ----
  - method: POST
    path: "/grower-relations/growers"
    description: "Register a grape producer."
    roles: [GrowerRelationsManager]
    code: 201
    input: [name, license_number, region_code, "status?"]
    output: Grower
    side_effects:
      - "reliability_score_vintage and reliability_score_lifetime initialised to 100.0 with all penalty counters at 0"

  - method: POST
    path: "/grower-relations/growers/{growerId}/suspend"
    description: "Place a regulatory hold on the producer; status becomes SUSPENDED."
    roles: [GrowerRelationsManager]
    code: 200
    input: ["reason?"]
    output: Grower
    side_effects:
      - "status set to SUSPENDED"
      - "increments Grower.version by 1"

  - method: POST
    path: "/grower-relations/growers/{growerId}/reinstate"
    description: "Lift the regulatory hold; status returns to ACTIVE."
    roles: [GrowerRelationsManager]
    code: 200
    input: []
    output: Grower
    side_effects:
      - "status set to ACTIVE"
      - "increments Grower.version by 1"

  - method: GET
    path: "/grower-relations/growers/{growerId}"
    description: "Read one producer with both reliability scores and the outstanding lien balance."
    roles: [GrowerRelationsManager, HarvestCoordinator, AccountsPayableClerk, Grower]
    code: 200
    input: []
    output: Grower
    side_effects: []

  - method: GET
    path: "/grower-relations/growers"
    description: "List producers, optionally filtered by region or standing."
    roles: [GrowerRelationsManager, HarvestCoordinator, AccountsPayableClerk]
    code: 200
    input: ["region_code?", "status?", "limit?", "offset?"]
    output: Grower[]
    side_effects: []

  # --------------------------------------------------------- VineyardBlock ----
  - method: POST
    path: "/grower-relations/vineyard-blocks"
    description: "Register a vineyard block farmed by a producer."
    roles: [GrowerRelationsManager]
    code: 201
    input: [grower_id, block_code, varietal, acres, expected_yield_tons_per_acre, ava_code, "status?"]
    output: VineyardBlock
    side_effects: []

  - method: GET
    path: "/grower-relations/vineyard-blocks/{blockId}"
    description: "Read one block with its latest sampling readings and vintage tonnage."
    roles: [GrowerRelationsManager, HarvestCoordinator, QualityLabTech, ScaleOperator, Grower]
    code: 200
    input: []
    output: VineyardBlock
    side_effects: []

  - method: GET
    path: "/grower-relations/vineyard-blocks"
    description: "List blocks; filter by grower_id to walk a producer's blocks."
    roles: [GrowerRelationsManager, HarvestCoordinator, QualityLabTech, ScaleOperator]
    code: 200
    input: ["grower_id?", "status?", "varietal?", "limit?", "offset?"]
    output: VineyardBlock[]
    side_effects: []

  # ------------------------------------------------------------ QualitySpec ----
  - method: POST
    path: "/grower-relations/quality-specs"
    description: "Define a sugar/acid/rot/MOG specification with its bonus, penalty and rejection thresholds."
    roles: [GrowerRelationsManager, QualityLabTech]
    code: 201
    input: [spec_code, min_brix_accept, brix_bonus_start, brix_penalty_start, rot_rejection_pct, "min_brix_pick_call?", "brix_step?", "brix_bonus_pct_per_step?", "brix_penalty_pct_per_step?", "ta_min_gl?", "ta_max_gl?", "acid_out_of_spec_penalty_pct?", "rot_free_pct?", "rot_penalty_pct_per_point?", "mog_max_pct?", "mog_penalty_pct?", "max_total_bonus_pct?", "max_total_penalty_pct?"]
    output: QualitySpec
    side_effects: []

  - method: GET
    path: "/grower-relations/quality-specs/{specId}"
    description: "Read one quality specification."
    roles: [GrowerRelationsManager, QualityLabTech, HarvestCoordinator, Grower]
    code: 200
    input: []
    output: QualitySpec
    side_effects: []

  - method: GET
    path: "/grower-relations/quality-specs"
    description: "List quality specifications."
    roles: [GrowerRelationsManager, QualityLabTech, HarvestCoordinator]
    code: 200
    input: ["spec_code?", "limit?", "offset?"]
    output: QualitySpec[]
    side_effects: []

  # ---------------------------------------------------------- GrapeContract ----
  - method: POST
    path: "/grower-relations/grape-contracts"
    description: "Draft a grape purchase contract. contract_basis selects which tonnage field is required; installment_plan is the payment schedule template materialised on accept."
    roles: [GrowerRelationsManager]
    code: 201
    input: [grower_id, quality_spec_id, contract_code, contract_basis, base_price_per_ton_cents, over_delivery_policy, term_start_vintage, term_end_vintage, installment_plan, "committed_tons?", "contracted_yield_tons_per_acre?", "spot_price_pct?", "over_delivery_tolerance_pct?", "settlement_basis?", "provisional_payment_pct?", "lien_holdback_pct?", "min_pick_notice_hours?", "pick_call_ack_window_hours?", "evergreen_flag?", "evergreen_term_years?", "termination_notice_days?"]
    output: GrapeContract
    side_effects:
      - "lifecycle_status DRAFT, renewal_status NOT_DUE, offer_round 0, tonnage_status OPEN"

  - method: POST
    path: "/grower-relations/grape-contracts/{contractId}/offer"
    description: "Put the contract on the table (DRAFT or COUNTERED -> OFFERED), optionally repricing it."
    roles: [GrowerRelationsManager]
    code: 200
    input: ["base_price_per_ton_cents?"]
    output: GrapeContract
    side_effects:
      - "lifecycle_status -> OFFERED; offer_round incremented"
      - "increments GrapeContract.version by 1"

  - method: POST
    path: "/grower-relations/grape-contracts/{contractId}/counter"
    description: "Grower counters the offered price (OFFERED -> COUNTERED)."
    roles: [Grower]
    code: 200
    input: [counter_base_price_per_ton_cents]
    output: GrapeContract
    side_effects:
      - "lifecycle_status -> COUNTERED; countered_price_per_ton_cents stored"
      - "increments GrapeContract.version by 1"

  - method: POST
    path: "/grower-relations/grape-contracts/{contractId}/withdraw-offer"
    description: "Winery pulls the offer off the table (OFFERED -> WITHDRAWN)."
    roles: [GrowerRelationsManager]
    code: 200
    input: []
    output: GrapeContract
    side_effects:
      - "lifecycle_status -> WITHDRAWN; renewal_status -> NOT_RENEWING"
      - "increments GrapeContract.version by 1"

  - method: POST
    path: "/grower-relations/grape-contracts/{contractId}/accept"
    description: "Grower accepts (OFFERED -> ACTIVE). Derives the tonnage caps, the renewal window and the PaymentInstallment rows."
    roles: [Grower]
    code: 200
    input: []
    output: GrapeContract
    side_effects:
      - "runs calculations.tonnage_cap_derivation to set contract_cap_tons, hard_cap_tons, cap_scope and every allocation's block caps"
      - "renewal_window_opens_at and renewal_window_closes_at computed"
      - "one PaymentInstallment created per installment_plan element in status PENDING_SETTLEMENT"
      - "increments GrapeContract.version by 1"

  - method: POST
    path: "/grower-relations/grape-contracts/{contractId}/settlement-close"
    description: "Close the vintage settlement (ACTIVE -> SETTLED): finalise every PROVISIONAL line under settlement_basis, derive the net payable and schedule the installments."
    roles: [GrowerRelationsManager]
    code: 200
    input: []
    output: GrapeContract
    side_effects:
      - "runs calculations.final_settlement_total, then calculations.net_payable_derivation, then calculations.installment_waterfall"
      - "every PROVISIONAL SettlementLine -> FINAL; every PENDING_SETTLEMENT PaymentInstallment -> SCHEDULED"
      - "every open PickCall of the contract -> WITHDRAWN, cancelling their SCHEDULED appointments and recomputing lane load"
      - "increments GrapeContract.version by 1"

  - method: POST
    path: "/grower-relations/grape-contracts/{contractId}/renew"
    description: "Renew the term inside the open renewal window (renewal_status RENEWAL_WINDOW_OPEN -> RENEWED)."
    roles: [GrowerRelationsManager]
    code: 200
    input: [renewal_term_years, "renewed_base_price_per_ton_cents?"]
    output: GrapeContract
    side_effects:
      - "term_end_vintage advanced; renewal window recomputed; renewal_status -> RENEWED"
      - "increments GrapeContract.version by 1"

  - method: POST
    path: "/grower-relations/grape-contracts/{contractId}/termination-notice"
    description: "Serve a termination notice (ACTIVE -> TERMINATION_PENDING). Refused while any lien-protected installment is outstanding."
    roles: [GrowerRelationsManager]
    code: 200
    input: [effective_at, "reason?"]
    output: GrapeContract
    side_effects:
      - "termination_effective_at stored; renewal_status -> NOT_RENEWING"
      - "open PickCalls -> WITHDRAWN, their SCHEDULED appointments -> CANCELLED, lane load recomputed, SCHEDULED SamplingVisits -> CANCELLED"
      - "increments GrapeContract.version by 1"

  - method: GET
    path: "/grower-relations/grape-contracts/{contractId}"
    description: "Read one contract with both state dimensions, the derived caps and the settlement money fields."
    roles: [GrowerRelationsManager, HarvestCoordinator, QualityLabTech, ScaleOperator, AccountsPayableClerk, Grower]
    code: 200
    input: []
    output: GrapeContract
    side_effects: []

  - method: GET
    path: "/grower-relations/grape-contracts"
    description: "List contracts; filter by grower_id or quality_spec_id to reach a producer's or a spec's contracts."
    roles: [GrowerRelationsManager, HarvestCoordinator, QualityLabTech, AccountsPayableClerk]
    code: 200
    input: ["grower_id?", "quality_spec_id?", "lifecycle_status?", "renewal_status?", "tonnage_status?", "limit?", "offset?"]
    output: GrapeContract[]
    side_effects: []

  - method: GET
    path: "/grower-relations/grape-contracts/{contractId}/settlement-summary"
    description: "Computed read reconciling the contract's tonnage and money: returns { contract_cap_tons, hard_cap_tons, cap_scope, delivered_contract_tons, delivered_over_tons, rejected_tons, tonnage_status, settlement_basis, provisional_settlement_cents, final_settlement_cents, prompt_pay_credit_cents, lien_holdback_cents, net_payable_cents, installment_planned_total_cents, installment_paid_total_cents, outstanding_lien_balance_cents }."
    roles: [GrowerRelationsManager, AccountsPayableClerk, Grower]
    code: 200
    input: []
    output: "{ contract_cap_tons: number, hard_cap_tons: number, cap_scope: string, delivered_contract_tons: number, delivered_over_tons: number, rejected_tons: number, tonnage_status: string, settlement_basis: string, provisional_settlement_cents: integer, final_settlement_cents: integer, prompt_pay_credit_cents: integer, lien_holdback_cents: integer, net_payable_cents: integer, installment_planned_total_cents: integer, installment_paid_total_cents: integer, outstanding_lien_balance_cents: integer }"
    side_effects: []

  # ------------------------------------------------ ContractBlockAllocation ----
  - method: POST
    path: "/grower-relations/contract-block-allocations"
    description: "Commit one of the producer's blocks to the contract. allocated_acres is required on ACREAGE-basis contracts only."
    roles: [GrowerRelationsManager]
    code: 201
    input: [contract_id, block_id, "allocated_acres?"]
    output: ContractBlockAllocation
    side_effects:
      - "block_cap_tons and block_hard_cap_tons stay null until the contract is accepted"

  - method: GET
    path: "/grower-relations/contract-block-allocations/{allocationId}"
    description: "Read one contract-block allocation with its per-block caps and delivered tonnage."
    roles: [GrowerRelationsManager, HarvestCoordinator, QualityLabTech, ScaleOperator, Grower]
    code: 200
    input: []
    output: ContractBlockAllocation
    side_effects: []

  - method: GET
    path: "/grower-relations/contract-block-allocations"
    description: "List allocations; filter by contract_id or block_id to walk either side of the many-to-many."
    roles: [GrowerRelationsManager, HarvestCoordinator, QualityLabTech, ScaleOperator]
    code: 200
    input: ["contract_id?", "block_id?", "limit?", "offset?"]
    output: ContractBlockAllocation[]
    side_effects: []

  # ----------------------------------------------------------- CrushPadLane ----
  - method: POST
    path: "/grower-relations/crush-pad-lanes"
    description: "Open a crush-pad receiving lane with its daily tonnage capacity, turnaround buffer and single-load ceiling."
    roles: [GrowerRelationsManager, HarvestCoordinator]
    code: 201
    input: [lane_code, daily_capacity_tons, "turnaround_buffer_minutes?", "max_load_tons?", "status?"]
    output: CrushPadLane
    side_effects: []

  - method: GET
    path: "/grower-relations/crush-pad-lanes/{laneId}"
    description: "Read one lane with its committed tonnage and appointment count."
    roles: [GrowerRelationsManager, HarvestCoordinator, ScaleOperator]
    code: 200
    input: []
    output: CrushPadLane
    side_effects: []

  - method: GET
    path: "/grower-relations/crush-pad-lanes"
    description: "List crush-pad lanes."
    roles: [GrowerRelationsManager, HarvestCoordinator, ScaleOperator]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: CrushPadLane[]
    side_effects: []

  # ----------------------------------------------------------- SamplingCrew ----
  - method: POST
    path: "/grower-relations/sampling-crews"
    description: "Register a field sampling crew with its region coverage and concurrent-visit ceiling."
    roles: [GrowerRelationsManager, HarvestCoordinator]
    code: 201
    input: [crew_code, region_code, "max_concurrent_visits?"]
    output: SamplingCrew
    side_effects: []

  - method: GET
    path: "/grower-relations/sampling-crews/{crewId}"
    description: "Read one sampling crew with its scheduled-visit count."
    roles: [GrowerRelationsManager, HarvestCoordinator, QualityLabTech]
    code: 200
    input: []
    output: SamplingCrew
    side_effects: []

  - method: GET
    path: "/grower-relations/sampling-crews"
    description: "List sampling crews."
    roles: [GrowerRelationsManager, HarvestCoordinator, QualityLabTech]
    code: 200
    input: ["region_code?", "limit?", "offset?"]
    output: SamplingCrew[]
    side_effects: []

  # ---------------------------------------------------------- SamplingVisit ----
  - method: POST
    path: "/grower-relations/sampling-visits"
    description: "Book a field sampling window on a crew for one allocated block."
    roles: [HarvestCoordinator]
    code: 201
    input: [contract_id, block_id, crew_id, window_start, window_end]
    output: SamplingVisit
    side_effects:
      - "SamplingCrew.scheduled_visit_count recomputed"

  - method: POST
    path: "/grower-relations/sampling-visits/{visitId}/record"
    description: "Record the field readings (SCHEDULED -> COMPLETED) and derive the maturity flag."
    roles: [HarvestCoordinator]
    code: 200
    input: [measured_brix, measured_ta_gl, measured_ph, measured_rot_pct]
    output: SamplingVisit
    side_effects:
      - "sampled_at stamped; maturity_flag derived against QualitySpec.min_brix_pick_call"
      - "VineyardBlock.latest_sampling_brix and latest_sampling_rot_pct recomputed"
      - "increments SamplingVisit.version by 1"

  - method: GET
    path: "/grower-relations/sampling-visits/{visitId}"
    description: "Read one sampling visit with its readings and maturity flag."
    roles: [GrowerRelationsManager, HarvestCoordinator, QualityLabTech, Grower]
    code: 200
    input: []
    output: SamplingVisit
    side_effects: []

  - method: GET
    path: "/grower-relations/sampling-visits"
    description: "List sampling visits; filter by contract_id, block_id or crew_id."
    roles: [GrowerRelationsManager, HarvestCoordinator, QualityLabTech]
    code: 200
    input: ["contract_id?", "block_id?", "crew_id?", "status?", "maturity_flag?", "limit?", "offset?"]
    output: SamplingVisit[]
    side_effects: []

  # --------------------------------------------------------------- PickCall ----
  - method: POST
    path: "/grower-relations/pick-calls"
    description: "Issue a pick call for an allocated block on an ACTIVE contract. Gated on fruit maturity and on the contract's minimum pick notice."
    roles: [HarvestCoordinator]
    code: 201
    input: [contract_id, block_id, target_pick_at, estimated_tons]
    output: PickCall
    side_effects:
      - "issued_at stamped from the logical clock; notice_hours and ack_deadline_at derived"
      - "status ISSUED"

  - method: POST
    path: "/grower-relations/pick-calls/{pickCallId}/acknowledge"
    description: "Grower acknowledges the pick call (ISSUED -> ACKNOWLEDGED) before ack_deadline_at."
    roles: [Grower]
    code: 200
    input: []
    output: PickCall
    side_effects:
      - "acknowledged_at stamped"
      - "increments PickCall.version by 1"

  - method: POST
    path: "/grower-relations/pick-calls/{pickCallId}/revise"
    description: "Re-issue an acknowledged pick call with a new target (ACKNOWLEDGED -> ISSUED), cancelling its scheduled appointments."
    roles: [HarvestCoordinator]
    code: 200
    input: [revised_target_pick_at, "revised_estimated_tons?"]
    output: PickCall
    side_effects:
      - "revision_count incremented; acknowledged_at cleared; issued_at, notice_hours and ack_deadline_at recomputed"
      - "SCHEDULED DeliveryAppointments of this pick call -> CANCELLED and each lane's committed_tons recomputed"
      - "increments PickCall.version by 1"

  - method: GET
    path: "/grower-relations/pick-calls/{pickCallId}"
    description: "Read one pick call with its notice, deadline and fulfilment figures."
    roles: [GrowerRelationsManager, HarvestCoordinator, ScaleOperator, Grower]
    code: 200
    input: []
    output: PickCall
    side_effects: []

  - method: GET
    path: "/grower-relations/pick-calls"
    description: "List pick calls; filter by contract_id or block_id."
    roles: [GrowerRelationsManager, HarvestCoordinator, ScaleOperator]
    code: 200
    input: ["contract_id?", "block_id?", "status?", "limit?", "offset?"]
    output: PickCall[]
    side_effects: []

  # ---------------------------------------------------- DeliveryAppointment ----
  - method: POST
    path: "/grower-relations/delivery-appointments"
    description: "Reserve a crush-pad delivery slot against an acknowledged pick call."
    roles: [HarvestCoordinator, Grower]
    code: 201
    input: [pick_call_id, lane_id, window_start, window_end, planned_tons]
    output: DeliveryAppointment
    side_effects:
      - "CrushPadLane.committed_tons and scheduled_appointment_count recomputed"
      - "PickCall.appointed_tons recomputed"

  - method: POST
    path: "/grower-relations/delivery-appointments/{appointmentId}/cancel"
    description: "Release a scheduled slot (SCHEDULED -> CANCELLED)."
    roles: [HarvestCoordinator]
    code: 200
    input: ["reason?"]
    output: DeliveryAppointment
    side_effects:
      - "CrushPadLane.committed_tons and scheduled_appointment_count recomputed; PickCall.appointed_tons recomputed"
      - "increments DeliveryAppointment.version by 1"

  - method: GET
    path: "/grower-relations/delivery-appointments/{appointmentId}"
    description: "Read one delivery appointment with its captured tonnage and tag count."
    roles: [GrowerRelationsManager, HarvestCoordinator, ScaleOperator, QualityLabTech, Grower]
    code: 200
    input: []
    output: DeliveryAppointment
    side_effects: []

  - method: GET
    path: "/grower-relations/delivery-appointments"
    description: "List delivery appointments; filter by pick_call_id or lane_id."
    roles: [GrowerRelationsManager, HarvestCoordinator, ScaleOperator, QualityLabTech]
    code: 200
    input: ["pick_call_id?", "lane_id?", "status?", "limit?", "offset?"]
    output: DeliveryAppointment[]
    side_effects: []

  # --------------------------------------------------------------- WeighTag ----
  - method: POST
    path: "/grower-relations/weigh-tags"
    description: "Capture the inbound (gross) scale pass for one block's load. Requires expected_appointment_version because a slot legitimately receives several tags."
    roles: [ScaleOperator]
    code: 201
    input: [appointment_id, block_id, gross_weight_lbs, expected_appointment_version]
    output: WeighTag
    side_effects:
      - "captured_by_user_id set from X-User-ID; weigh_status GROSS_CAPTURED; disposition PENDING"
      - "DeliveryAppointment.weigh_tag_count recomputed and SCHEDULED -> ARRIVED on the first tag"
      - "increments DeliveryAppointment.version by 1"

  - method: POST
    path: "/grower-relations/weigh-tags/{tagId}/tare"
    description: "Capture the outbound (tare) scale pass; derives net weight and net tons (GROSS_CAPTURED -> NET_FINAL)."
    roles: [ScaleOperator]
    code: 200
    input: [tare_weight_lbs]
    output: WeighTag
    side_effects:
      - "runs calculations.net_weight_conversion to set net_weight_lbs and net_tons"
      - "DeliveryAppointment.captured_net_tons recomputed"
      - "increments WeighTag.version by 1"

  - method: POST
    path: "/grower-relations/weigh-tags/{tagId}/grades"
    description: "Record the receipt grading of a tared load. Runs the quality adjustment, the tonnage waterfall, the settlement-line pricing and every downstream cascade. Requires expected_weigh_tag_version because a re-grade legitimately supersedes an earlier grading."
    roles: [QualityLabTech]
    code: 201
    input: [brix, ta_gl, ph, rot_pct, mog_pct, expected_weigh_tag_version]
    output: QualityGrade
    side_effects:
      - "runs calculations.quality_adjustment_pct; any earlier grade of this tag receives superseded_at"
      - "runs calculations.tonnage_waterfall_allocation and sets the tag's four tonnage slices and disposition"
      - "creates one SettlementLine per non-zero accepted bucket via calculations.settlement_line_amount"
      - "recomputes GrapeContract delivered/rejected tonnage, provisional_settlement_cents and tonnage_status"
      - "cascades pick-call suspension, appointment cancellation, lane load, block and allocation tonnage, appointment closing and both Grower reliability scores"
      - "increments WeighTag.version by 1"

  - method: POST
    path: "/grower-relations/weigh-tags/{tagId}/grade-disputes"
    description: "Grower disputes the active grading inside the dispute window; supersedes the grade, voids its provisional settlement lines and returns the tonnage to the contract."
    roles: [Grower]
    code: 200
    input: ["reason?"]
    output: WeighTag
    side_effects:
      - "active QualityGrade receives superseded_at; PROVISIONAL SettlementLines of the tag -> VOID"
      - "the tag's four tonnage slices and active_adjustment_pct reset; disposition -> DISPUTED"
      - "GrapeContract tonnage rollups and tonnage_status recomputed; SUSPENDED_CAP pick calls -> ISSUED"
      - "increments WeighTag.version by 1"

  - method: GET
    path: "/grower-relations/weigh-tags/{tagId}"
    description: "Read one weigh tag with both state dimensions, the gross/tare/net weights and the four tonnage slices."
    roles: [GrowerRelationsManager, HarvestCoordinator, ScaleOperator, QualityLabTech, AccountsPayableClerk, Grower]
    code: 200
    input: []
    output: WeighTag
    side_effects: []

  - method: GET
    path: "/grower-relations/weigh-tags"
    description: "List weigh tags; filter by appointment_id or block_id."
    roles: [GrowerRelationsManager, HarvestCoordinator, ScaleOperator, QualityLabTech, AccountsPayableClerk]
    code: 200
    input: ["appointment_id?", "block_id?", "weigh_status?", "disposition?", "limit?", "offset?"]
    output: WeighTag[]
    side_effects: []

  # ----------------------------------------------------------- QualityGrade ----
  - method: GET
    path: "/grower-relations/quality-grades/{gradeId}"
    description: "Read one grading row, including the four adjustment components, the pre-clamp raw adjustment and superseded_at. Append-only: no update or delete exists."
    roles: [GrowerRelationsManager, QualityLabTech, AccountsPayableClerk, Grower]
    code: 200
    input: []
    output: QualityGrade
    side_effects: []

  - method: GET
    path: "/grower-relations/quality-grades"
    description: "List gradings; filter by weigh_tag_id to walk a load's grading history including superseded rows."
    roles: [GrowerRelationsManager, QualityLabTech, AccountsPayableClerk]
    code: 200
    input: ["weigh_tag_id?", "recommended_disposition?", "limit?", "offset?"]
    output: QualityGrade[]
    side_effects: []

  # ---------------------------------------------------------- SettlementLine ----
  - method: GET
    path: "/grower-relations/settlement-lines/{lineId}"
    description: "Read one settlement line with its bucket, tons, applied adjustment, per-ton price and provisional/final amounts."
    roles: [GrowerRelationsManager, AccountsPayableClerk, QualityLabTech, Grower]
    code: 200
    input: []
    output: SettlementLine
    side_effects: []

  - method: GET
    path: "/grower-relations/settlement-lines"
    description: "List settlement lines; filter by contract_id or weigh_tag_id. Cascade-created, so this is their only discovery channel."
    roles: [GrowerRelationsManager, AccountsPayableClerk, QualityLabTech]
    code: 200
    input: ["contract_id?", "weigh_tag_id?", "bucket?", "status?", "limit?", "offset?"]
    output: SettlementLine[]
    side_effects: []

  # ------------------------------------------------------ PaymentInstallment ----
  - method: POST
    path: "/grower-relations/payment-installments/{installmentId}/payments"
    description: "Record a payment against a scheduled installment; overpayment is refused rather than spilled forward."
    roles: [AccountsPayableClerk]
    code: 200
    input: [amount_cents]
    output: PaymentInstallment
    side_effects:
      - "paid_amount_cents increased; status -> PARTIALLY_PAID or PAID"
      - "Grower.outstanding_lien_balance_cents recomputed; GrapeContract.lien_released_at stamped when the last lien-protected installment clears"
      - "GrapeContract SETTLED -> CLOSED when every installment is PAID"
      - "increments PaymentInstallment.version by 1"

  - method: GET
    path: "/grower-relations/payment-installments/{installmentId}"
    description: "Read one installment with its planned amount, paid amount, due date and lien flag."
    roles: [GrowerRelationsManager, AccountsPayableClerk, Grower]
    code: 200
    input: []
    output: PaymentInstallment
    side_effects: []

  - method: GET
    path: "/grower-relations/payment-installments"
    description: "List installments; filter by contract_id. Cascade-created on accept, so this is their only discovery channel. Rows are returned ordered by installment_no ascending, then created_at ascending, so the first element is always installment_no 1 of the filtered contract."
    roles: [GrowerRelationsManager, AccountsPayableClerk]
    code: 200
    input: ["contract_id?", "status?", "lien_protected?", "limit?", "offset?"]
    output: PaymentInstallment[]
    side_effects: []

  # ------------------------------------------------- test-driving endpoints ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical UTC clock to an arbitrary instant. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z and MUST NOT fall back to real wall-clock time. Advancing the clock fires every time-driven transition in §1.2 in this order: PickCall ISSUED -> EXPIRED, DeliveryAppointment SCHEDULED -> NO_SHOW, PaymentInstallment -> DELINQUENT, GrapeContract TERMINATION_PENDING -> TERMINATED, then the renewal dimension (NOT_DUE/RENEWED/EVERGREEN_ROLLED -> RENEWAL_WINDOW_OPEN, then RENEWAL_WINDOW_OPEN -> EVERGREEN_ROLLED or NOT_RENEWING)."
    roles: [GrowerRelationsManager, HarvestCoordinator, ScaleOperator, QualityLabTech, AccountsPayableClerk, Grower]
    code: 200
    input: [current_utc]
    output: "{ current_utc: string }"
    side_effects:
      - "fires the clock-driven transitions listed above and recomputes both Grower reliability scores for every affected producer"

  - method: GET
    path: "/_clock/current_utc"
    description: "Read the logical UTC clock; returns 2026-08-01T00:00:00Z until a set_current_utc call moves it."
    roles: [GrowerRelationsManager, HarvestCoordinator, ScaleOperator, QualityLabTech, AccountsPayableClerk, Grower]
    code: 200
    input: []
    output: "{ current_utc: string }"
    side_effects: []

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  # --- authentication and authorisation -------------------------------------
  - id: ERR_MISSING_AUTH_HEADER
    http: 401
    condition: "X-User-ID or X-User-Role header absent or blank"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "X-User-Role is not a declared role, or is not listed in the endpoint's roles"
  - id: ERR_NOT_CONTRACT_GROWER
    http: 403
    condition: "A Grower acts on a contract, block, pick call or weigh tag belonging to another producer"
  - id: ERR_SOD_SAME_USER_GRADING
    http: 403
    condition: "The X-User-ID recording a QualityGrade equals the WeighTag.captured_by_user_id that weighed the load"

  # --- existence ------------------------------------------------------------
  - id: ERR_GROWER_NOT_FOUND
    http: 404
    condition: "growerId in the path or grower_id in the body does not resolve"
  - id: ERR_BLOCK_NOT_FOUND
    http: 404
    condition: "blockId in the path or block_id in the body does not resolve"
  - id: ERR_QUALITY_SPEC_NOT_FOUND
    http: 404
    condition: "specId in the path or quality_spec_id in the body does not resolve"
  - id: ERR_CONTRACT_NOT_FOUND
    http: 404
    condition: "contractId in the path or contract_id in the body does not resolve"
  - id: ERR_ALLOCATION_NOT_FOUND
    http: 404
    condition: "allocationId in the path does not resolve"
  - id: ERR_LANE_NOT_FOUND
    http: 404
    condition: "laneId in the path or lane_id in the body does not resolve"
  - id: ERR_CREW_NOT_FOUND
    http: 404
    condition: "crewId in the path or crew_id in the body does not resolve"
  - id: ERR_SAMPLING_VISIT_NOT_FOUND
    http: 404
    condition: "visitId in the path does not resolve"
  - id: ERR_PICK_CALL_NOT_FOUND
    http: 404
    condition: "pickCallId in the path or pick_call_id in the body does not resolve"
  - id: ERR_APPOINTMENT_NOT_FOUND
    http: 404
    condition: "appointmentId in the path or appointment_id in the body does not resolve"
  - id: ERR_WEIGH_TAG_NOT_FOUND
    http: 404
    condition: "tagId in the path or weigh_tag_id in the body does not resolve"
  - id: ERR_SETTLEMENT_LINE_NOT_FOUND
    http: 404
    condition: "lineId in the path does not resolve"
  - id: ERR_INSTALLMENT_NOT_FOUND
    http: 404
    condition: "installmentId in the path does not resolve"

  # --- request shape --------------------------------------------------------
  - id: ERR_VALIDATION
    http: 422
    condition: "Missing required field, wrong JSON type, enum value outside the declared set, numeric range or decimal-place violation, unparseable datetime, or window_end not strictly after window_start"
  - id: ERR_INVALID_PAGINATION
    http: 400
    condition: "limit outside [1, 100] or offset negative or non-integer"
  - id: ERR_BASIS_FIELD_MISMATCH
    http: 422
    condition: "committed_tons / contracted_yield_tons_per_acre / allocated_acres supplied or omitted inconsistently with contract_basis"
  - id: ERR_INVALID_INSTALLMENT_PLAN
    http: 422
    condition: "installment_plan has 0 or more than 6 elements, gapped or repeated installment_no values, a non-positive pct_of_settlement, or percentages that do not sum to exactly 100.0"
  - id: ERR_DUPLICATE_CODE
    http: 409
    condition: "A uniqueness constraint is violated: license_number, spec_code, contract_code, lane_code, crew_code, (grower_id, block_code) or (contract_id, block_id)"

  # --- optimistic concurrency ----------------------------------------------
  - id: ERR_STALE_APPOINTMENT_VERSION
    http: 412
    condition: "expected_appointment_version does not equal the DeliveryAppointment's current version"
  - id: ERR_STALE_WEIGH_TAG_VERSION
    http: 412
    condition: "expected_weigh_tag_version does not equal the WeighTag's current version"

  # --- state ----------------------------------------------------------------
  - id: ERR_CONTRACT_STATE_INVALID
    http: 409
    condition: "GrapeContract.lifecycle_status does not permit the requested transition or child write"
  - id: ERR_PICK_CALL_STATE_INVALID
    http: 409
    condition: "PickCall.status does not permit acknowledge, revise or appointment creation"
  - id: ERR_APPOINTMENT_NOT_OPEN
    http: 409
    condition: "DeliveryAppointment.status is not SCHEDULED or ARRIVED when a weigh tag is presented, or not SCHEDULED when a cancellation is requested"
  - id: ERR_LANE_CLOSED
    http: 409
    condition: "CrushPadLane.status is CLOSED"
  - id: ERR_TAG_WEIGH_STATE_INVALID
    http: 409
    condition: "Tare attempted on a tag already NET_FINAL, grading attempted on a tag still GROSS_CAPTURED, or settlement-close attempted while some WeighTag of the contract is still GROSS_CAPTURED"
  - id: ERR_TAG_NOT_DISPUTABLE
    http: 409
    condition: "A dispute is raised on a tag whose disposition is not in {ACCEPTED, PARTIALLY_ACCEPTED, REJECTED_QUALITY} — that is, PENDING, REJECTED_OVER_CAP or already DISPUTED — or a grade is recorded on a tag whose disposition is already decided and not DISPUTED, or settlement-close is attempted while some WeighTag of the contract sits in PENDING or DISPUTED"
  - id: ERR_INSTALLMENT_NOT_PAYABLE
    http: 409
    condition: "PaymentInstallment.status is PENDING_SETTLEMENT or PAID"
  - id: ERR_MAX_OFFER_ROUNDS_EXCEEDED
    http: 409
    condition: "A fourth offer is attempted; offer_round has already reached MAX_OFFER_ROUNDS"
  - id: ERR_MAX_PICK_CALL_REVISIONS_EXCEEDED
    http: 409
    condition: "A third revision is attempted; revision_count has already reached MAX_PICK_CALL_REVISIONS"
  - id: ERR_RENEWAL_WINDOW_NOT_OPEN
    http: 409
    condition: "Renewal attempted while renewal_status is not RENEWAL_WINDOW_OPEN, or after renewal_window_closes_at"
  - id: ERR_RELIABILITY_BELOW_RENEWAL_THRESHOLD
    http: 409
    condition: "Renewal attempted while the Grower's LIFETIME_SCOPED reliability score is below RENEWAL_MIN_RELIABILITY_SCORE"
  - id: ERR_NO_ALLOCATIONS
    http: 409
    condition: "Accept attempted on a contract with no ContractBlockAllocation rows"
  - id: ERR_NO_PROVISIONAL_LINES
    http: 409
    condition: "Settlement close attempted on a contract with no PROVISIONAL SettlementLine"

  # --- producer compliance and fruit safety ---------------------------------
  - id: ERR_GROWER_SUSPENDED
    http: 403
    condition: "The Grower reached from the target row has status SUSPENDED"
  - id: ERR_BLOCK_NOT_PICK_READY
    http: 422
    condition: "No COMPLETED SamplingVisit with maturity_flag PICK_READY exists for the (contract, block), or the latest such visit's measured_rot_pct is at or above the spec's rot_rejection_pct"

  # --- scheduling constraints ----------------------------------------------
  - id: ERR_LANE_WINDOW_CONFLICT
    http: 409
    condition: "The requested appointment window overlaps a buffered window of another SCHEDULED or ARRIVED appointment on the same lane"
  - id: ERR_CREW_WINDOW_OVERLAP_LIMIT
    http: 409
    condition: "The sampling crew already has max_concurrent_visits SCHEDULED visits overlapping the requested window"

  # --- temporal -------------------------------------------------------------
  - id: ERR_APPOINTMENT_OUTSIDE_PICK_WINDOW
    http: 422
    condition: "window_start is before the pick call's target_pick_at or later than target_pick_at + DELIVERY_GRACE_HOURS (72)"
  - id: ERR_OUTSIDE_APPOINTMENT_WINDOW
    http: 409
    condition: "The logical clock is before window_start or at/after window_end + LATE_ARRIVAL_GRACE_MINUTES (60) when a weigh tag is created"
  - id: ERR_INSUFFICIENT_PICK_NOTICE
    http: 422
    condition: "target_pick_at is less than min_pick_notice_hours after the logical clock's current instant"
  - id: ERR_ACK_WINDOW_CLOSED
    http: 409
    condition: "Acknowledge attempted at or after PickCall.ack_deadline_at while the call is still ISSUED"
  - id: ERR_DISPUTE_WINDOW_CLOSED
    http: 409
    condition: "Dispute raised after WeighTag.dispute_deadline_at"
  - id: ERR_TERMINATION_NOTICE_TOO_SHORT
    http: 422
    condition: "effective_at is less than termination_notice_days after the logical clock's current instant"

  # --- referential integrity ------------------------------------------------
  - id: ERR_BLOCK_NOT_ALLOCATED
    http: 409
    condition: "No ContractBlockAllocation exists for the (contract, block) pair the operation implies"
  - id: ERR_CREW_REGION_MISMATCH
    http: 422
    condition: "SamplingCrew.region_code differs from the region_code of the Grower farming the sampled block"
  - id: ERR_BLOCK_GROWER_MISMATCH
    http: 409
    condition: "VineyardBlock.grower_id differs from the contract's grower_id, or the block's status is RETIRED"

  # --- fiscal capacity ------------------------------------------------------
  - id: ERR_LANE_DAILY_CAPACITY_EXCEEDED
    http: 409
    condition: "The lane's committed tonnage for that UTC date plus planned_tons would exceed daily_capacity_tons"
  - id: ERR_LOAD_EXCEEDS_LANE_MAX
    http: 409
    condition: "planned_tons exceeds CrushPadLane.max_load_tons"
  - id: ERR_TARE_EXCEEDS_GROSS
    http: 422
    condition: "tare_weight_lbs is greater than gross_weight_lbs"
  - id: ERR_PAYMENT_EXCEEDS_BALANCE
    http: 409
    condition: "amount_cents exceeds planned_amount_cents minus paid_amount_cents"
  - id: ERR_LIEN_OUTSTANDING
    http: 409
    condition: "A termination notice is served while any lien-protected PaymentInstallment of the same Grower — on this contract or any other — is still outstanding"

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: GrowerRelationsManager
    description: "Winery-side contract owner: drafts, offers, withdraws, renews, terminates and closes settlement. The only role that can touch the contract's commercial terms."
    identity: opaque
    exclusive_operations:
      - "POST /grower-relations/growers"
      - "POST /grower-relations/growers/{growerId}/suspend"
      - "POST /grower-relations/growers/{growerId}/reinstate"
      - "POST /grower-relations/vineyard-blocks"
      - "POST /grower-relations/grape-contracts"
      - "POST /grower-relations/grape-contracts/{contractId}/offer"
      - "POST /grower-relations/grape-contracts/{contractId}/withdraw-offer"
      - "POST /grower-relations/grape-contracts/{contractId}/settlement-close"
      - "POST /grower-relations/grape-contracts/{contractId}/renew"
      - "POST /grower-relations/grape-contracts/{contractId}/termination-notice"
      - "POST /grower-relations/contract-block-allocations"
    shared_operations:
      - "POST /grower-relations/quality-specs (with QualityLabTech)"
      - "POST /grower-relations/crush-pad-lanes, POST /grower-relations/sampling-crews (with HarvestCoordinator)"
      - "every GET in §1.5 except the crush-pad-lane and sampling-crew reads it does not need"
      - "POST /_clock/set_current_utc, GET /_clock/current_utc"

  - name: Grower
    description: "The grape producer. Counters and accepts offers, acknowledges pick calls, books delivery slots and disputes gradings — always and only on its own rows."
    identity: "entity_backed:Grower"
    exclusive_operations:
      - "POST /grower-relations/grape-contracts/{contractId}/counter"
      - "POST /grower-relations/grape-contracts/{contractId}/accept"
      - "POST /grower-relations/pick-calls/{pickCallId}/acknowledge"
      - "POST /grower-relations/weigh-tags/{tagId}/grade-disputes"
    shared_operations:
      - "POST /grower-relations/delivery-appointments (with HarvestCoordinator)"
      - "GET reads of its own growers, vineyard-blocks, quality-specs, grape-contracts, settlement-summary, contract-block-allocations, sampling-visits, pick-calls, delivery-appointments, weigh-tags, quality-grades, settlement-lines and payment-installments"
      - "POST /_clock/set_current_utc, GET /_clock/current_utc"

  - name: HarvestCoordinator
    description: "Winery harvest desk: books sampling, records field readings, issues and revises pick calls, and manages crush-pad slots."
    identity: opaque
    exclusive_operations:
      - "POST /grower-relations/sampling-visits"
      - "POST /grower-relations/sampling-visits/{visitId}/record"
      - "POST /grower-relations/pick-calls"
      - "POST /grower-relations/pick-calls/{pickCallId}/revise"
      - "POST /grower-relations/delivery-appointments/{appointmentId}/cancel"
    shared_operations:
      - "POST /grower-relations/crush-pad-lanes, POST /grower-relations/sampling-crews (with GrowerRelationsManager)"
      - "POST /grower-relations/delivery-appointments (with Grower)"
      - "GET reads across growers, blocks, specs, contracts, allocations, lanes, crews, sampling visits, pick calls, appointments and weigh tags"
      - "POST /_clock/set_current_utc, GET /_clock/current_utc"

  - name: ScaleOperator
    description: "Crush-pad scale house: captures the gross and tare passes. Deliberately cannot grade — see the segregation-of-duties rule at validation priority 4."
    identity: opaque
    exclusive_operations:
      - "POST /grower-relations/weigh-tags"
      - "POST /grower-relations/weigh-tags/{tagId}/tare"
    shared_operations:
      - "GET reads of vineyard-blocks, grape-contracts, allocations, lanes, pick-calls, delivery-appointments and weigh-tags"
      - "POST /_clock/set_current_utc, GET /_clock/current_utc"

  - name: QualityLabTech
    description: "Receipt lab: records the grading that drives price adjustment, rejection and tonnage allocation. Cannot capture weights, and cannot grade a load it captured."
    identity: opaque
    exclusive_operations:
      - "POST /grower-relations/weigh-tags/{tagId}/grades"
    shared_operations:
      - "POST /grower-relations/quality-specs (with GrowerRelationsManager)"
      - "GET reads of vineyard-blocks, quality-specs, grape-contracts, allocations, crews, sampling-visits, appointments, weigh-tags, quality-grades and settlement-lines"
      - "POST /_clock/set_current_utc, GET /_clock/current_utc"

  - name: AccountsPayableClerk
    description: "Winery payables: pays the installment schedule and reconciles the statutory producer-lien holdback. Cannot alter contract terms, weights or gradings."
    identity: opaque
    exclusive_operations:
      - "POST /grower-relations/payment-installments/{installmentId}/payments"
    shared_operations:
      - "GET reads of growers, grape-contracts, settlement-summary, weigh-tags, quality-grades, settlement-lines and payment-installments"
      - "POST /_clock/set_current_utc, GET /_clock/current_utc"
