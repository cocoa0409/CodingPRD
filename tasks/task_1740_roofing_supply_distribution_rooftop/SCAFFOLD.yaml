scenario: |
  Roofing Supply Distribution & Rooftop Delivery (ABC Supply / Beacon): material takeoff by squares & waste factor, rooftop/conveyor delivery scheduling & crane fee, storm-surge demand allocation, contractor credit & job account with lien notice, manufacturer certification & warranty registration linkage, returns of opened bundles, color/lot matching, delivery damage claim

domain_name: roofing-supply-distribution
api_prefix: /roofing

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: hybrid
  state_machine_shape: compound
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - polymorphic
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Branch
    parent: null
    common_fields: true
    fields:
      - { name: branch_code, type: string, source: input, description: "Unique branch code, e.g. 'DAL-01'" }
      - { name: name, type: string, source: input, description: "Branch display name" }
      - { name: rooftop_delivery_capacity_per_day, type: integer, source: input, description: "Max rooftop deliveries per day" }
      - { name: conveyor_fleet_size, type: integer, source: input, description: "Number of conveyor trucks; caps concurrent conveyor deliveries in any single slot" }
      - { name: crane_available, type: boolean, source: input, description: "Whether a crane is on site for crane-fee deliveries" }
      - { name: surge_mode, type: enum, source: system, default: "NORMAL", description: "NORMAL | SURGE — set when a StormSurgeEvent activates, cleared when it closes" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE (only value in v1; branch lifecycle out of scope)" }

  - name: Product
    parent: null
    common_fields: true
    fields:
      - { name: sku, type: string, source: input, description: "Manufacturer SKU, unique" }
      - { name: manufacturer_name, type: string, source: input, description: "Manufacturer display name" }
      - { name: color_code, type: string, source: input, description: "Color identity used for lot matching" }
      - { name: bundles_per_square, type: number, source: input, description: "Bundles needed to cover one square (100 sq ft); typically 3.0 for 3-tab, 4.0 for architectural" }
      - { name: base_price_per_bundle_cents, type: integer, source: input, description: "List price per bundle in cents" }
      - { name: requires_certified_installer, type: boolean, source: input, default: false, description: "True when warranty registration requires manufacturer certification" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE (only value in v1; product lifecycle out of scope)" }

  - name: InventoryLot
    parent: Branch
    common_fields: true
    fields:
      - { name: branch_id, type: string, source: system, description: "FK -> Branch.id; owning branch" }
      - { name: product_id, type: string, source: system, description: "FK -> Product.id; stocked product" }
      - { name: lot_code, type: string, source: input, description: "Manufacturer lot identity; same color_code can span multiple lot_codes" }
      - { name: on_hand_bundles, type: integer, source: system, default: 0, description: "Physical bundles on hand, decremented on delivery dispatch, incremented on receiving/returns-restock" }
      - { name: reserved_bundles, type: integer, source: system, default: 0, description: "Bundles reserved by CONFIRMED order lines or active surge allocations" }
      - { name: available_bundles, type: integer, source: computed, description: "Read-only = on_hand_bundles - reserved_bundles; floor 0" }

  - name: ContractorAccount
    parent: null
    common_fields: true
    fields:
      - { name: company_name, type: string, source: input, description: "Contractor legal name" }
      - { name: credit_limit_cents, type: integer, source: input, description: "Maximum allowed outstanding credit in cents" }
      - { name: open_balance_cents, type: integer, source: system, default: 0, description: "Sum of invoiced-but-unpaid order totals in cents" }
      - { name: pending_delivery_hold_cents, type: integer, source: system, default: 0, description: "Provisional hold for CONFIRMED-but-not-yet-INVOICED order totals" }
      - { name: lien_hold_cents, type: integer, source: system, default: 0, description: "Sum of lien_notice_amount_cents over JobAccounts with lien_status in {NOTICE_FILED, LIEN_RECORDED}" }
      - { name: credit_available_cents, type: integer, source: computed, description: "Read-only = credit_limit_cents - open_balance_cents - pending_delivery_hold_cents - lien_hold_cents" }
      - { name: pricing_tier, type: enum, source: input, default: "STANDARD", description: "STANDARD | PREFERRED | VOLUME — selects discount percent for order pricing" }
      - { name: manufacturer_certifications, type: array, source: input, default: [], description: "List of manufacturer_name strings this account is certified to install" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | SUSPENDED | LIEN_DEFAULT" }

  - name: JobAccount
    parent: ContractorAccount
    common_fields: true
    fields:
      - { name: contractor_account_id, type: string, source: system, description: "FK -> ContractorAccount.id; credit owner" }
      - { name: job_name, type: string, source: input, description: "Job site label" }
      - { name: site_address, type: string, source: input, description: "Delivery address" }
      - { name: job_balance_cents, type: integer, source: system, default: 0, description: "Unpaid invoiced amount attributed to this job" }
      - { name: lien_status, type: enum, source: system, default: "NONE", description: "NONE | NOTICE_FILED | LIEN_RECORDED | RELEASED" }
      - { name: lien_notice_amount_cents, type: integer, source: system, default: 0, description: "Amount claimed in active lien notice; contributes to ContractorAccount.lien_hold_cents" }
      - { name: notice_filed_at, type: datetime, source: system, description: "Timestamp when lien_status entered NOTICE_FILED; null otherwise" }

  - name: MaterialTakeoff
    parent: JobAccount
    common_fields: true
    fields:
      - { name: job_account_id, type: string, source: system, description: "FK -> JobAccount.id; job this estimate belongs to" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id; primary shingle product being estimated" }
      - { name: roof_squares, type: number, source: input, description: "Measured roof area in squares (1 square = 100 sq ft), 2-decimal precision" }
      - { name: waste_factor_pct, type: number, source: input, description: "Waste allowance percent, e.g. 10 for 10%; must be >= 0 and <= 40" }
      - { name: valley_ridge_linear_feet, type: integer, source: input, default: 0, description: "Linear feet of valley+ridge requiring accessory material" }
      - { name: estimated_bundles, type: integer, source: computed, description: "Computed by takeoff_material_estimate at creation; read-only" }
      - { name: estimated_amount_cents, type: integer, source: computed, description: "Provisional dollar estimate at creation-time price; read-only" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT | QUOTED | CONVERTED | EXPIRED" }

  - name: Order
    parent: JobAccount
    common_fields: true
    fields:
      - { name: job_account_id, type: string, source: system, description: "FK -> JobAccount.id; billed job" }
      - { name: takeoff_id, type: string, source: system, description: "FK -> MaterialTakeoff.id; source takeoff when converted" }
      - { name: branch_id, type: string, source: system, description: "FK -> Branch.id; fulfilling branch" }
      - { name: storm_surge_event_id, type: string, source: system, description: "FK -> StormSurgeEvent.id; non-null when order consumed surge allocation" }
      - { name: subtotal_cents, type: integer, source: computed, description: "Sum of line extended prices before delivery fee and discount" }
      - { name: discount_cents, type: integer, source: computed, description: "Account-tier discount applied at confirmation" }
      - { name: delivery_fee_cents, type: integer, source: computed, description: "Fee from delivery_fee calculation; 0 until a Delivery is scheduled" }
      - { name: surge_premium_cents, type: integer, source: computed, description: "Surge multiplier uplift on material subtotal; 0 in NORMAL branch mode" }
      - { name: total_cents, type: integer, source: computed, description: "subtotal_cents - discount_cents + delivery_fee_cents + surge_premium_cents" }
      - { name: fulfillment_status, type: enum, source: system, default: "UNFULFILLED", description: "UNFULFILLED | PARTIALLY_DELIVERED | DELIVERED | RETURN_ADJUSTED" }
      - { name: payment_status, type: enum, source: system, default: "UNPAID", description: "UNPAID | INVOICED | PAID | CREDITED" }
      - { name: status, type: enum, source: system, default: "QUOTED", description: "QUOTED | CONFIRMED | CLOSED | CANCELLED" }

  - name: OrderLine
    parent: Order
    common_fields: true
    fields:
      - { name: order_id, type: string, source: system, description: "FK -> Order.id; owning order" }
      - { name: product_id, type: string, source: system, description: "FK -> Product.id; ordered product" }
      - { name: inventory_lot_id, type: string, source: system, description: "FK -> InventoryLot.id; lot the reservation is drawn from; null until confirmation picks a lot" }
      - { name: quantity_bundles, type: integer, source: input, description: "Bundles ordered" }
      - { name: delivered_bundles, type: integer, source: system, default: 0, description: "Bundles actually delivered so far" }
      - { name: returned_bundles, type: integer, source: system, default: 0, description: "Bundles accepted back via approved Returns" }
      - { name: unit_price_cents, type: integer, source: computed, description: "Price locked at order confirmation from Product.base_price_per_bundle_cents" }
      - { name: extended_price_cents, type: integer, source: computed, description: "quantity_bundles * unit_price_cents" }

  - name: DeliverySlot
    parent: Branch
    common_fields: true
    fields:
      - { name: branch_id, type: string, source: system, description: "FK -> Branch.id; owning branch" }
      - { name: slot_date, type: string, source: input, description: "ISO date (YYYY-MM-DD) of the slot" }
      - { name: window, type: enum, source: input, description: "AM | PM — two windows per day" }
      - { name: equipment_type, type: enum, source: input, description: "GROUND | ROOFTOP_CONVEYOR | CRANE" }
      - { name: capacity, type: integer, source: input, description: "Max deliveries in this slot for this equipment type" }
      - { name: booked_count, type: integer, source: system, default: 0, description: "Deliveries currently SCHEDULED or EN_ROUTE in this slot" }

  - name: Delivery
    parent: Order
    common_fields: true
    fields:
      - { name: order_id, type: string, source: system, description: "FK -> Order.id; order being delivered" }
      - { name: delivery_slot_id, type: string, source: system, description: "FK -> DeliverySlot.id; reserved slot" }
      - { name: equipment_type, type: enum, source: input, description: "GROUND | ROOFTOP_CONVEYOR | CRANE — must match slot equipment_type" }
      - { name: bundle_count, type: integer, source: computed, description: "Bundles on this delivery, summed from its DeliveryLines" }
      - { name: fee_cents, type: integer, source: computed, description: "Delivery fee computed at scheduling per delivery_fee rule" }
      - { name: crane_fee_cents, type: integer, source: computed, default: 0, description: "Crane surcharge component of fee_cents; 0 unless equipment_type == CRANE" }
      - { name: attempt_count, type: integer, source: system, default: 0, description: "Number of times delivery was attempted (EN_ROUTE entered)" }
      - { name: delivered_at, type: datetime, source: system, description: "Timestamp of DELIVERED transition; null otherwise" }
      - { name: status, type: enum, source: system, default: "SCHEDULED", description: "SCHEDULED | EN_ROUTE | DELIVERED | FAILED | RESCHEDULED | CANCELLED" }

  - name: StormSurgeEvent
    parent: Branch
    common_fields: true
    fields:
      - { name: branch_id, type: string, source: system, description: "FK -> Branch.id; affected branch" }
      - { name: event_name, type: string, source: input, description: "Storm label, e.g. 'Hail 2026-05-DAL'" }
      - { name: starts_at, type: datetime, source: input, description: "Surge window start (UTC)" }
      - { name: ends_at, type: datetime, source: input, description: "Surge window end (UTC); must be > starts_at" }
      - { name: surge_multiplier_pct, type: integer, source: input, description: "Price uplift percent applied to material subtotal during window, e.g. 15 for +15%" }
      - { name: allocation_pool_bundles, type: integer, source: input, description: "Total bundles the branch dedicates to surge allocation" }
      - { name: allocated_bundles, type: integer, source: system, default: 0, description: "Bundles currently committed to active Allocations" }
      - { name: remaining_pool_bundles, type: integer, source: computed, description: "Read-only = allocation_pool_bundles - allocated_bundles" }
      - { name: status, type: enum, source: system, default: "DECLARED", description: "DECLARED | ACTIVE | CLOSED" }

  - name: Allocation
    parent: StormSurgeEvent
    common_fields: true
    fields:
      - { name: storm_surge_event_id, type: string, source: system, description: "FK -> StormSurgeEvent.id; surge event granting this allocation" }
      - { name: contractor_account_id, type: string, source: system, description: "FK -> ContractorAccount.id; receiving contractor" }
      - { name: product_id, type: string, source: system, description: "FK -> Product.id; allocated product" }
      - { name: requested_bundles, type: integer, source: input, description: "Bundles requested by contractor" }
      - { name: granted_bundles, type: integer, source: computed, description: "Bundles granted by storm_surge_allocation waterfall; <= requested_bundles" }
      - { name: consumed_bundles, type: integer, source: system, default: 0, description: "Bundles already drawn into CONFIRMED orders" }
      - { name: expires_at, type: datetime, source: computed, description: "Equal to parent event.ends_at; allocation lapses at window close" }
      - { name: status, type: enum, source: system, default: "PENDING", description: "PENDING | GRANTED | PARTIALLY_CONSUMED | CONSUMED | EXPIRED | REVOKED" }

  - name: Return
    parent: Order
    common_fields: true
    fields:
      - { name: order_id, type: string, source: system, description: "FK -> Order.id; order being returned against" }
      - { name: order_line_id, type: string, source: system, description: "FK -> OrderLine.id; line being returned" }
      - { name: quantity_bundles, type: integer, source: input, description: "Bundles returned" }
      - { name: opened_bundles, type: integer, source: input, default: 0, description: "How many of quantity_bundles are opened; <= quantity_bundles" }
      - { name: lot_match_verified, type: boolean, source: system, default: false, description: "True when returned lot_code equals OrderLine's reserved lot_code" }
      - { name: credit_amount_cents, type: integer, source: computed, description: "Credit computed by return_credit rule; 0 until approved" }
      - { name: restocking_fee_cents, type: integer, source: computed, description: "Restocking fee component for opened bundles" }
      - { name: status, type: enum, source: system, default: "REQUESTED", description: "REQUESTED | APPROVED | RECEIVED | REJECTED" }

  - name: DamageClaim
    parent: Delivery
    common_fields: true
    fields:
      - { name: delivery_id, type: string, source: system, description: "FK -> Delivery.id; delivery the claim is filed against" }
      - { name: claimed_bundles, type: integer, source: input, description: "Bundles claimed damaged" }
      - { name: claim_amount_cents, type: integer, source: computed, description: "claimed_bundles * unit price of affected lines; computed at filing" }
      - { name: approved_amount_cents, type: integer, source: system, default: 0, description: "Amount approved by claims adjuster; may differ from claim_amount_cents" }
      - { name: evidence_note, type: string, source: input, description: "Free-text evidence description" }
      - { name: review_round, type: integer, source: system, default: 1, description: "Increments each time claim re-enters UNDER_REVIEW from DISPUTED" }
      - { name: status, type: enum, source: system, default: "FILED", description: "FILED | UNDER_REVIEW | APPROVED | REJECTED | DISPUTED | CREDITED" }

  - name: WarrantyRegistration
    parent: Order
    common_fields: false
    fields:
      - { name: order_id, type: string, source: system, description: "FK -> Order.id; order whose materials are registered" }
      - { name: manufacturer_name, type: string, source: system, description: "Copied from Product.manufacturer_name at registration" }
      - { name: registered_bundles, type: integer, source: system, description: "Bundles covered by this registration (delivered minus returned at registration time)" }
      - { name: certification_verified, type: boolean, source: system, description: "True when contractor certification matched Product.requires_certified_installer" }
      - { name: registered_at, type: datetime, source: system, description: "Timestamp of registration" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: MaterialTakeoff
    initial_state: DRAFT
    terminal_states: [CONVERTED, EXPIRED]
    transitions:
      - from: DRAFT
        to: QUOTED
        trigger: "POST /roofing/takeoffs/{id}/quote"
        actor: SalesRep
        preconditions:
          - "Takeoff must be in DRAFT (ERR_TAKEOFF_NOT_DRAFT)"
          - "Parent JobAccount's contractor must have status == ACTIVE (ERR_ACCOUNT_NOT_ACTIVE)"
        side_effects:
          - "estimated_bundles and estimated_amount_cents frozen from takeoff_material_estimate"
      - from: QUOTED
        to: DRAFT
        trigger: "POST /roofing/takeoffs/{id}/revise"
        actor: SalesRep
        preconditions:
          - "Takeoff must be in QUOTED (ERR_TAKEOFF_NOT_QUOTED)"
        side_effects:
          - "Takeoff fields roof_squares/waste_factor_pct become editable again via PUT"
      - from: QUOTED
        to: CONVERTED
        trigger: "POST /roofing/takeoffs/{id}/convert"
        actor: Contractor
        preconditions:
          - "Takeoff must be in QUOTED (ERR_TAKEOFF_NOT_QUOTED)"
          - "Acting contractor must own parent JobAccount (ERR_FORBIDDEN)"
          - "Contractor credit_available_cents must cover provisional order total (ERR_CREDIT_LIMIT_EXCEEDED)"
        side_effects:
          - "Creates Order with status QUOTED containing exactly one OrderLine: product_id = takeoff.product_id, quantity_bundles = shingle_bundles component of estimated_bundles (accessory bundles are estimate-only and never become order lines)"
      - from: DRAFT
        to: EXPIRED
        trigger: "system (automatic when logical clock passes takeoff.created_at + 30 days while still DRAFT)"
        actor: system
        preconditions: []
        side_effects: []
      - from: QUOTED
        to: EXPIRED
        trigger: "system (automatic when logical clock passes takeoff.updated_at + 14 days while QUOTED)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Order
    initial_state: QUOTED
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: QUOTED
        to: CONFIRMED
        trigger: "POST /roofing/orders/{id}/confirm"
        actor: Contractor
        preconditions:
          - "Order must be in QUOTED (ERR_ORDER_NOT_QUOTED)"
          - "Acting contractor must own order's JobAccount (ERR_FORBIDDEN)"
          - "Every OrderLine must find an InventoryLot at order.branch_id with matching product_id and available_bundles >= quantity_bundles (ERR_LOT_UNAVAILABLE)"
          - "If Branch.surge_mode == SURGE: order auto-links to the branch's single ACTIVE StormSurgeEvent (storm_surge_event_id set); each OrderLine's quantity must be <= the contractor's unconsumed granted allocation for that product under that event (ERR_SURGE_ALLOCATION_EXCEEDED)"
          - "credit_available_cents >= order.total_cents (ERR_CREDIT_LIMIT_EXCEEDED)"
          - "JobAccount.lien_status must not be LIEN_RECORDED (ERR_LIEN_BLOCKS_ORDER)"
        side_effects:
          - "For each OrderLine: pick InventoryLot (lot with earliest created_at among lots with available_bundles >= quantity_bundles), set inventory_lot_id, increment lot.reserved_bundles"
          - "OrderLine.unit_price_cents locked from Product.base_price_per_bundle_cents; extended_price_cents computed"
          - "subtotal/discount/surge_premium/total computed via order_pricing"
          - "ContractorAccount.pending_delivery_hold_cents += total_cents"
          - "If storm_surge_event_id set: Allocation.consumed_bundles += line quantities; Allocation status recomputed (GRANTED -> PARTIALLY_CONSUMED/CONSUMED)"
      - from: CONFIRMED
        to: CLOSED
        trigger: "POST /roofing/orders/{id}/close"
        actor: SalesRep
        preconditions:
          - "Order must be in CONFIRMED (ERR_ORDER_NOT_CONFIRMED)"
          - "fulfillment_status must be DELIVERED or RETURN_ADJUSTED (ERR_ORDER_NOT_FULLY_DELIVERED)"
          - "payment_status must be PAID or CREDITED (ERR_ORDER_UNPAID)"
          - "No DamageClaim on any of order's Deliveries in {FILED, UNDER_REVIEW, DISPUTED, APPROVED} (ERR_OPEN_CLAIMS_EXIST)"
          - "No Return on this order in {REQUESTED, APPROVED} (ERR_OPEN_RETURNS_EXIST)"
        side_effects:
          - "Order.status = CLOSED"
      - from: QUOTED
        to: CANCELLED
        trigger: "POST /roofing/orders/{id}/cancel"
        actor: Contractor
        preconditions:
          - "Order must be in QUOTED (ERR_ORDER_NOT_CANCELLABLE)"
        side_effects:
          - "Order.status = CANCELLED; no holds were placed yet"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /roofing/orders/{id}/cancel"
        actor: SalesRep
        preconditions:
          - "Order must be in CONFIRMED (ERR_ORDER_NOT_CANCELLABLE)"
          - "No Delivery in {SCHEDULED, EN_ROUTE} (ERR_ACTIVE_DELIVERY_EXISTS)"
        side_effects:
          - "For each OrderLine: lot.reserved_bundles -= quantity_bundles (release reservation)"
          - "ContractorAccount.pending_delivery_hold_cents -= total_cents"
          - "If storm_surge_event_id set: Allocation.consumed_bundles -= line quantities; Allocation status recomputed"

  - entity: Delivery
    initial_state: SCHEDULED
    terminal_states: [DELIVERED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: EN_ROUTE
        trigger: "POST /roofing/deliveries/{id}/dispatch"
        actor: Dispatcher
        preconditions:
          - "Delivery must be in SCHEDULED (ERR_DELIVERY_NOT_SCHEDULED)"
          - "Parent Order must be CONFIRMED (ERR_ORDER_NOT_CONFIRMED)"
        side_effects:
          - "attempt_count += 1"
          - "For each OrderLine covered: lot.on_hand_bundles -= delivered quantity, lot.reserved_bundles -= delivered quantity"
      - from: EN_ROUTE
        to: DELIVERED
        trigger: "POST /roofing/deliveries/{id}/complete"
        actor: Dispatcher
        preconditions:
          - "Delivery must be in EN_ROUTE (ERR_DELIVERY_NOT_EN_ROUTE)"
        side_effects:
          - "delivered_at = current logical clock"
          - "OrderLine.delivered_bundles += this delivery's quantities"
          - "Order.fulfillment_status recomputed (DELIVERED when all lines fully delivered, else PARTIALLY_DELIVERED)"
          - "DeliverySlot.booked_count -= 1"
      - from: EN_ROUTE
        to: FAILED
        trigger: "POST /roofing/deliveries/{id}/fail"
        actor: Dispatcher
        preconditions:
          - "Delivery must be in EN_ROUTE (ERR_DELIVERY_NOT_EN_ROUTE)"
        side_effects:
          - "Inventory restored: lot.on_hand_bundles += attempted quantity, lot.reserved_bundles += attempted quantity"
      - from: FAILED
        to: RESCHEDULED
        trigger: "POST /roofing/deliveries/{id}/reschedule"
        actor: Dispatcher
        preconditions:
          - "Delivery must be in FAILED (ERR_DELIVERY_NOT_FAILED)"
          - "New slot must have booked_count < capacity (ERR_SLOT_FULL)"
        side_effects:
          - "delivery_slot_id updated to new slot; new slot.booked_count += 1"
          - "Old slot.booked_count -= 1"
          - "fee_cents recomputed via delivery_fee; Order.delivery_fee_cents updated; Order.total_cents recomputed"
      - from: RESCHEDULED
        to: SCHEDULED
        trigger: "POST /roofing/deliveries/{id}/reconfirm"
        actor: Dispatcher
        preconditions:
          - "Delivery must be in RESCHEDULED (ERR_DELIVERY_NOT_RESCHEDULED)"
        side_effects: []
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /roofing/deliveries/{id}/cancel"
        actor: Dispatcher
        preconditions:
          - "Delivery must be in SCHEDULED (ERR_DELIVERY_NOT_SCHEDULED)"
        side_effects:
          - "DeliverySlot.booked_count -= 1"
          - "Order.delivery_fee_cents -= fee_cents; Order.total_cents recomputed"

  - entity: StormSurgeEvent
    initial_state: DECLARED
    terminal_states: [CLOSED]
    transitions:
      - from: DECLARED
        to: ACTIVE
        trigger: "system (automatic when logical clock reaches starts_at)"
        actor: system
        preconditions: []
        side_effects:
          - "Branch.surge_mode = SURGE"
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /roofing/surge-events/{id}/close OR system (automatic when logical clock reaches ends_at)"
        actor: BranchManager
        preconditions:
          - "Event must be in ACTIVE (ERR_SURGE_NOT_ACTIVE)"
        side_effects:
          - "Branch.surge_mode = NORMAL"
          - "All Allocations in {PENDING, GRANTED, PARTIALLY_CONSUMED} -> EXPIRED; their unconsumed granted_bundles released from allocated_bundles"
      - from: DECLARED
        to: CLOSED
        trigger: "POST /roofing/surge-events/{id}/close"
        actor: BranchManager
        preconditions:
          - "Event must be in DECLARED or ACTIVE (ERR_SURGE_NOT_ACTIVE)"
        side_effects:
          - "All PENDING Allocations -> REVOKED; allocated_bundles released"

  - entity: Allocation
    initial_state: PENDING
    terminal_states: [CONSUMED, EXPIRED, REVOKED]
    transitions:
      - from: PENDING
        to: GRANTED
        trigger: "POST /roofing/allocations/{id}/grant"
        actor: BranchManager
        preconditions:
          - "Allocation must be in PENDING (ERR_ALLOCATION_NOT_PENDING)"
          - "Parent StormSurgeEvent must be in {DECLARED, ACTIVE} (ERR_SURGE_NOT_OPEN)"
        side_effects:
          - "granted_bundles computed via storm_surge_allocation waterfall"
          - "StormSurgeEvent.allocated_bundles += granted_bundles"
      - from: GRANTED
        to: PARTIALLY_CONSUMED
        trigger: "system (automatic when an Order confirm consumes some but not all granted_bundles)"
        actor: system
        preconditions: []
        side_effects: []
      - from: GRANTED
        to: CONSUMED
        trigger: "system (automatic when consumed_bundles == granted_bundles)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PARTIALLY_CONSUMED
        to: CONSUMED
        trigger: "system (automatic when consumed_bundles reaches granted_bundles)"
        actor: system
        preconditions: []
        side_effects: []
      - from: GRANTED
        to: REVOKED
        trigger: "POST /roofing/allocations/{id}/revoke"
        actor: BranchManager
        preconditions:
          - "Allocation must be in GRANTED or PARTIALLY_CONSUMED (ERR_ALLOCATION_NOT_REVOCABLE)"
        side_effects:
          - "StormSurgeEvent.allocated_bundles -= (granted_bundles - consumed_bundles)"
      - from: PARTIALLY_CONSUMED
        to: REVOKED
        trigger: "POST /roofing/allocations/{id}/revoke"
        actor: BranchManager
        preconditions:
          - "Allocation must be in GRANTED or PARTIALLY_CONSUMED"
        side_effects:
          - "StormSurgeEvent.allocated_bundles -= (granted_bundles - consumed_bundles)"

  - entity: Return
    initial_state: REQUESTED
    terminal_states: [RECEIVED, REJECTED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /roofing/returns/{id}/approve"
        actor: BranchManager
        preconditions:
          - "Return must be in REQUESTED (ERR_RETURN_NOT_REQUESTED)"
          - "quantity_bundles + OrderLine.returned_bundles <= OrderLine.delivered_bundles (ERR_RETURN_QUANTITY_EXCEEDED)"
        side_effects:
          - "credit_amount_cents computed via return_credit (unopened at full unit price, opened at 50% less restocking fee)"
      - from: APPROVED
        to: RECEIVED
        trigger: "POST /roofing/returns/{id}/receive"
        actor: WarehouseClerk
        preconditions:
          - "Return must be in APPROVED (ERR_RETURN_NOT_APPROVED)"
          - "Returned lot_code must equal OrderLine's lot_code (ERR_LOT_MISMATCH) — enforced at receiving scan"
        side_effects:
          - "lot_match_verified = true"
          - "Unopened bundles restock: lot.on_hand_bundles += (quantity_bundles - opened_bundles)"
          - "OrderLine.returned_bundles += quantity_bundles"
          - "Order.fulfillment_status = RETURN_ADJUSTED"
          - "If order.payment_status == INVOICED or PAID: post credit to ContractorAccount.open_balance_cents -= credit_amount_cents (floor 0); else reduce pending hold"
      - from: REQUESTED
        to: REJECTED
        trigger: "POST /roofing/returns/{id}/reject"
        actor: BranchManager
        preconditions:
          - "Return must be in REQUESTED (ERR_RETURN_NOT_REQUESTED)"
        side_effects: []

  - entity: DamageClaim
    initial_state: FILED
    terminal_states: [CREDITED, REJECTED]
    transitions:
      - from: FILED
        to: UNDER_REVIEW
        trigger: "POST /roofing/damage-claims/{id}/start-review"
        actor: ClaimsAdjuster
        preconditions:
          - "Claim must be in FILED (ERR_CLAIM_NOT_FILED)"
        side_effects: []
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /roofing/damage-claims/{id}/approve"
        actor: ClaimsAdjuster
        preconditions:
          - "Claim must be in UNDER_REVIEW (ERR_CLAIM_NOT_UNDER_REVIEW)"
          - "approved_amount_cents must be > 0 and <= claim_amount_cents (ERR_INVALID_APPROVED_AMOUNT)"
        side_effects:
          - "approved_amount_cents set from input"
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /roofing/damage-claims/{id}/reject"
        actor: ClaimsAdjuster
        preconditions:
          - "Claim must be in UNDER_REVIEW (ERR_CLAIM_NOT_UNDER_REVIEW)"
        side_effects: []
      - from: APPROVED
        to: CREDITED
        trigger: "POST /roofing/damage-claims/{id}/credit"
        actor: CreditAnalyst
        preconditions:
          - "Claim must be in APPROVED (ERR_CLAIM_NOT_APPROVED)"
          - "Segregation of duties: crediting user must differ from approving user (ERR_SOD_VIOLATION)"
        side_effects:
          - "ContractorAccount.open_balance_cents -= approved_amount_cents (floor 0)"
          - "JobAccount.job_balance_cents -= approved_amount_cents (floor 0) on the order's job"
          - "Order.payment_status = CREDITED when approved_amount_cents fully covers the order's remaining unpaid invoice; otherwise unchanged"
          - "Claim status = CREDITED"
      - from: APPROVED
        to: DISPUTED
        trigger: "POST /roofing/damage-claims/{id}/dispute"
        actor: Contractor
        preconditions:
          - "Claim must be in APPROVED (ERR_CLAIM_NOT_APPROVED)"
          - "Acting contractor must own the underlying JobAccount (ERR_FORBIDDEN)"
        side_effects: []
      - from: DISPUTED
        to: UNDER_REVIEW
        trigger: "POST /roofing/damage-claims/{id}/start-review"
        actor: ClaimsAdjuster
        preconditions:
          - "Claim must be in FILED or DISPUTED (ERR_CLAIM_NOT_FILED)"
        side_effects:
          - "review_round += 1"

  - entity: JobAccount
    initial_state: NONE
    terminal_states: [RELEASED]
    transitions:
      - from: NONE
        to: NOTICE_FILED
        trigger: "POST /roofing/job-accounts/{id}/file-lien-notice"
        actor: CreditAnalyst
        preconditions:
          - "lien_status must be NONE (ERR_LIEN_ALREADY_ACTIVE)"
          - "job_balance_cents must be > 0 (ERR_NO_OUTSTANDING_BALANCE)"
          - "lien_notice_amount_cents input must be > 0 and <= job_balance_cents (ERR_INVALID_LIEN_AMOUNT)"
        side_effects:
          - "notice_filed_at = current logical clock"
          - "ContractorAccount.lien_hold_cents += lien_notice_amount_cents"
      - from: NOTICE_FILED
        to: LIEN_RECORDED
        trigger: "POST /roofing/job-accounts/{id}/record-lien"
        actor: CreditAnalyst
        preconditions:
          - "lien_status must be NOTICE_FILED (ERR_LIEN_NOT_IN_NOTICE)"
          - "Logical clock must be >= notice_filed_at + 10 days (ERR_LIEN_CURE_PERIOD_ACTIVE)"
        side_effects:
          - "Parent ContractorAccount.status = LIEN_DEFAULT when any JobAccount reaches LIEN_RECORDED"
      - from: NOTICE_FILED
        to: RELEASED
        trigger: "POST /roofing/job-accounts/{id}/release-lien"
        actor: CreditAnalyst
        preconditions:
          - "lien_status must be NOTICE_FILED or LIEN_RECORDED (ERR_LIEN_NOT_ACTIVE)"
          - "job_balance_cents must be == 0 (ERR_BALANCE_STILL_OUTSTANDING)"
        side_effects:
          - "ContractorAccount.lien_hold_cents -= lien_notice_amount_cents"
          - "lien_notice_amount_cents = 0; notice_filed_at = null"
          - "ContractorAccount.status reverts to ACTIVE when no JobAccount remains in {NOTICE_FILED, LIEN_RECORDED}"
      - from: LIEN_RECORDED
        to: RELEASED
        trigger: "POST /roofing/job-accounts/{id}/release-lien"
        actor: CreditAnalyst
        preconditions:
          - "lien_status must be NOTICE_FILED or LIEN_RECORDED"
          - "job_balance_cents must be == 0"
        side_effects:
          - "ContractorAccount.lien_hold_cents -= lien_notice_amount_cents"
          - "lien_notice_amount_cents = 0; notice_filed_at = null"
          - "ContractorAccount.status reverts to ACTIVE when no JobAccount remains in {NOTICE_FILED, LIEN_RECORDED}"

  - entity: ContractorAccount
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /roofing/contractor-accounts/{id}/suspend"
        actor: CreditAnalyst
        preconditions:
          - "Account must be in ACTIVE (ERR_ACCOUNT_NOT_ACTIVE)"
        side_effects:
          - "New order confirmations blocked while SUSPENDED"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /roofing/contractor-accounts/{id}/reinstate"
        actor: CreditAnalyst
        preconditions:
          - "Account must be in SUSPENDED (ERR_ACCOUNT_NOT_SUSPENDED)"
          - "open_balance_cents must be < credit_limit_cents (ERR_CREDIT_LIMIT_EXCEEDED)"
        side_effects: []
      - from: ACTIVE
        to: LIEN_DEFAULT
        trigger: "system (automatic when any JobAccount enters LIEN_RECORDED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: SUSPENDED
        to: LIEN_DEFAULT
        trigger: "system (automatic when any JobAccount enters LIEN_RECORDED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: LIEN_DEFAULT
        to: ACTIVE
        trigger: "system (automatic when last JobAccount leaves {NOTICE_FILED, LIEN_RECORDED} via RELEASED)"
        actor: system
        preconditions: []
        side_effects: []

# =============================================================================
# Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: order-confirm-stale-account
    parent_entity: ContractorAccount
    write_endpoint: "POST /roofing/orders/{id}/confirm"
    occ_field: "expected_contractor_account_version"
    description: |
      Confirming an Order against a ContractorAccount whose version has
      advanced since the client last observed it is rejected. This captures
      the case where another writer has just confirmed a different order
      (which legitimately consumed credit and reduced credit_available_cents)
      and the current writer's credit view is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: allocation-grant-stale-event
    parent_entity: StormSurgeEvent
    write_endpoint: "POST /roofing/allocations/{id}/grant"
    occ_field: "expected_storm_surge_event_version"
    description: |
      Granting an Allocation against a StormSurgeEvent whose version has
      advanced since the client last observed it is rejected. This captures
      the case where another grant has just consumed part of the pool and
      the current writer's remaining_pool_bundles view is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: takeoff_material_estimate
    trigger: "MaterialTakeoff creation and on quote"
    algorithm: tiered_rounding
    formula: |
      1. adjusted_squares = roof_squares * (1 + waste_factor_pct / 100)
      2. shingle_bundles = ceil(adjusted_squares * shingles_product.bundles_per_square)
         -- rounding UP per product line, NOT after summing across products
      3. accessory_bundles = ceil(valley_ridge_linear_feet / ACCESSORY_COVERAGE_FEET_PER_BUNDLE)
      4. estimated_bundles = shingle_bundles + accessory_bundles
      5. estimated_amount_cents = shingle_bundles * base_price_per_bundle_cents
                                + accessory_bundles * ACCESSORY_PRICE_CENTS
      NOTE: rounding per-line-then-sum vs sum-then-round produces different
      bundle counts; this scaffold pins per-line rounding (step 2 before step 4).
    constants:
      ACCESSORY_COVERAGE_FEET_PER_BUNDLE: 33
      ACCESSORY_PRICE_CENTS: 4200
    precision: "bundles are integers (ceil); amounts integer cents"
    variants:
      - name: provisional_at_draft
        when: "Takeoff in DRAFT state"
        difference: "estimated_amount_cents uses current Product.base_price_per_bundle_cents; not locked"
      - name: locked_at_quote
        when: "Takeoff transitions DRAFT -> QUOTED"
        difference: "estimated_amount_cents frozen at quote-time prices; later price changes do not alter it"

  - name: order_pricing
    trigger: "Order confirmation"
    algorithm: tiered_pricing
    formula: |
      Evaluation order (pinned — discount tier is keyed on PRE-discount subtotal,
      so the order matters and is defined here):
      1. subtotal_cents = sum over OrderLines of (quantity_bundles * unit_price_cents)
      2. discount_pct = tier lookup on ContractorAccount.pricing_tier:
         STANDARD -> 0, PREFERRED -> 5, VOLUME -> 8
         -- VOLUME tier additionally requires subtotal_cents >= VOLUME_MIN_SUBTOTAL_CENTS,
            otherwise falls back to PREFERRED rate (5)
      3. discount_cents = round_half_up(subtotal_cents * discount_pct / 100)
      4. surge_premium_cents = (Branch.surge_mode == SURGE)
         ? round_half_up(subtotal_cents * active_event.surge_multiplier_pct / 100)
         : 0
      5. total_cents = subtotal_cents - discount_cents + surge_premium_cents + delivery_fee_cents
    constants:
      VOLUME_MIN_SUBTOTAL_CENTS: 250000
      PREFERRED_DISCOUNT_PCT: 5
      VOLUME_DISCOUNT_PCT: 8
    precision: "integer cents, round_half_up at each percentage step"
    variants:
      - name: normal_mode
        when: "Branch.surge_mode == NORMAL"
        difference: "surge_premium_cents = 0"
      - name: surge_mode
        when: "Branch.surge_mode == SURGE"
        difference: "surge_premium_cents computed from the ACTIVE StormSurgeEvent's surge_multiplier_pct"

  - name: delivery_fee
    trigger: "Delivery scheduling and rescheduling"
    algorithm: threshold
    formula: |
      1. base_fee = GROUND_FEE_CENTS when equipment_type == GROUND,
         else ROOFTOP_FEE_CENTS
      2. weight_surcharge: if bundle_count > HEAVY_LOAD_BUNDLE_THRESHOLD,
         add (bundle_count - HEAVY_LOAD_BUNDLE_THRESHOLD) * PER_BUNDLE_SURCHARGE_CENTS
         -- boundary is strict-greater: exactly THRESHOLD bundles pays no surcharge
      3. crane_fee_cents = (equipment_type == CRANE) ? CRANE_FEE_CENTS : 0
         -- crane fee is flat, independent of bundle_count
      4. fee_cents = base_fee + weight_surcharge + crane_fee_cents
    constants:
      GROUND_FEE_CENTS: 8500
      ROOFTOP_FEE_CENTS: 22500
      CRANE_FEE_CENTS: 60000
      HEAVY_LOAD_BUNDLE_THRESHOLD: 40
      PER_BUNDLE_SURCHARGE_CENTS: 350
    precision: "integer cents"

  - name: credit_available
    trigger: "Order confirmation, lien transitions, payment posting"
    algorithm: aggregation
    formula: |
      credit_available_cents = credit_limit_cents
                             - open_balance_cents
                             - pending_delivery_hold_cents
                             - lien_hold_cents
      Floor: credit_available_cents may go negative; order confirmation
      requires credit_available_cents >= order.total_cents.
    precision: "integer cents"
    variants:
      - name: with_pending_deliveries
        when: "Evaluated at order confirmation time"
        difference: "pending_delivery_hold_cents included (conservative)"
      - name: invoiced_only
        when: "Evaluated on account statement read endpoint"
        difference: "pending_delivery_hold_cents excluded (shows post-delivery position)"

  - name: return_credit
    trigger: "Return approval"
    algorithm: tiered_pricing
    formula: |
      1. unopened = quantity_bundles - opened_bundles
      2. unopened_credit = unopened * OrderLine.unit_price_cents
      3. opened_credit_gross = round_half_up(opened_bundles * OrderLine.unit_price_cents * OPENED_CREDIT_PCT / 100)
      4. restocking_fee_cents = opened_bundles * RESTOCKING_FEE_PER_BUNDLE_CENTS
      5. credit_amount_cents = unopened_credit + opened_credit_gross - restocking_fee_cents
      6. Floor: credit_amount_cents >= 0 (never negative)
      NOTE: lot_match_verified must be true at receive time, else receive is
      rejected with ERR_LOT_MISMATCH even after approval.
    constants:
      OPENED_CREDIT_PCT: 50
      RESTOCKING_FEE_PER_BUNDLE_CENTS: 900
    precision: "integer cents, round_half_up"

  - name: storm_surge_allocation
    trigger: "Allocation grant"
    algorithm: waterfall_allocation
    formula: |
      1. Candidate set: all Allocations in PENDING for this StormSurgeEvent,
         sorted by ContractorAccount.pricing_tier rank (VOLUME > PREFERRED > STANDARD),
         tie-break by allocation.created_at ASC
      2. Grant in ranked order: each allocation receives
         min(requested_bundles, event.remaining_pool_bundles) at its turn
      3. Tier caps: a single contractor may receive at most
         TIER_CAP_PCT[VOLUME]=50 / [PREFERRED]=35 / [STANDARD]=25 percent of
         event.allocation_pool_bundles (round_half_down); the cap binds before
         the remaining-pool check
      4. granted_bundles = min(requested_bundles, tier_cap_remaining, event.remaining_pool_bundles)
      5. event.allocated_bundles += granted_bundles
      NOTE: because earlier grants consume the pool, grant ORDER changes results;
      this scaffold pins rank-then-created_at order.
    constants:
      TIER_CAP_PCT_VOLUME: 50
      TIER_CAP_PCT_PREFERRED: 35
      TIER_CAP_PCT_STANDARD: 25
    precision: "integer bundles"

  - name: job_account_aging
    trigger: "Invoice posting and statement read"
    algorithm: chronological
    formula: |
      Job balances age from the invoice date (order.payment_status UNPAID ->
      INVOICED timestamp). Lien eligibility requires invoice age >= 30 days
      (logical clock). When multiple unpaid invoices exist, payments apply to
      the OLDEST invoice first (created_at ASC), and job_balance_cents is the
      running sum of unpaid invoice totals.
    precision: "integer cents; days measured against logical clock"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and non-empty"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all endpoints"

  - priority: 2
    category: auth
    check: "Role must be permitted for this endpoint per RBAC matrix"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all endpoints"

  - priority: 3
    category: existence
    check: "Path ids must exist, validated left-to-right"
    error_id: "ERR_{RESOURCE}_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path ids"

  - priority: 4
    category: state
    check: "Target entity must be in the state required by the transition"
    error_id: "varies (ERR_ORDER_NOT_QUOTED, ERR_DELIVERY_NOT_SCHEDULED, ...)"
    http_status: 409
    applies_to: "all action endpoints"

  - priority: 5
    category: business_safety
    check: "Segregation of duties: DamageClaim credit user must differ from the user who approved the claim"
    error_id: ERR_SOD_VIOLATION
    http_status: 403
    applies_to: "POST /roofing/damage-claims/{id}/credit"

  - priority: 6
    category: business_referential
    check: "Returned lot_code must equal the OrderLine's reserved lot_code (color/lot match)"
    error_id: ERR_LOT_MISMATCH
    http_status: 422
    applies_to: "POST /roofing/returns/{id}/receive"

  - priority: 7
    category: business_referential
    check: "Warranty registration requires contractor certification when Product.requires_certified_installer is true"
    error_id: ERR_CERTIFICATION_REQUIRED
    http_status: 422
    applies_to: "POST /roofing/orders/{id}/warranty-registrations"

  - priority: 8
    category: business_temporal
    check: "Delivery slot must not be full and slot equipment must match delivery equipment"
    error_id: ERR_SLOT_FULL
    http_status: 409
    applies_to: "POST /roofing/orders/{id}/deliveries, POST /roofing/deliveries/{id}/reschedule"

  - priority: 9
    category: business_temporal
    check: "Lien recording requires logical clock >= notice_filed_at + 10 days"
    error_id: ERR_LIEN_CURE_PERIOD_ACTIVE
    http_status: 409
    applies_to: "POST /roofing/job-accounts/{id}/record-lien"

  - priority: 10
    category: business_constraint
    check: "Surge-constrained order confirmation must not exceed contractor's unconsumed allocation for the product"
    error_id: ERR_SURGE_ALLOCATION_EXCEEDED
    http_status: 409
    applies_to: "POST /roofing/orders/{id}/confirm"

  - priority: 11
    category: business_fiscal
    check: "credit_available_cents must cover order.total_cents at confirmation; lien-recorded jobs block new orders"
    error_id: ERR_CREDIT_LIMIT_EXCEEDED
    http_status: 402
    applies_to: "POST /roofing/orders/{id}/confirm, POST /roofing/takeoffs/{id}/convert"

  - priority: 12
    category: business_fiscal
    check: "JobAccount in LIEN_RECORDED blocks all new order confirmations for the contractor"
    error_id: ERR_LIEN_BLOCKS_ORDER
    http_status: 402
    applies_to: "POST /roofing/orders/{id}/confirm"

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  # --- test-driving clock ---
  - method: POST
    path: "/roofing/_clock/set_current_utc"
    description: "Set the logical clock (test-driving). Server startup default is exactly 2026-08-01T00:00:00Z; before any set call the logical clock reads this default and never falls back to wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["All time-dependent system transitions re-evaluated (takeoff expiry, surge activation/close, lien cure period)"]

  # --- Branch ---
  - method: POST
    path: "/roofing/branches"
    description: "Create a branch"
    roles: [PlatformAdmin]
    code: 201
    input: [branch_code, name, rooftop_delivery_capacity_per_day, conveyor_fleet_size, crane_available]
    output: Branch
    side_effects: ["status = ACTIVE", "surge_mode = NORMAL"]

  - method: GET
    path: "/roofing/branches"
    description: "List branches"
    roles: [PlatformAdmin, BranchManager, SalesRep, Dispatcher, Contractor, CreditAnalyst, ClaimsAdjuster, WarehouseClerk]
    code: 200
    input: ["limit?", "offset?"]
    output: "Branch[]"
    side_effects: []

  - method: GET
    path: "/roofing/branches/{id}"
    description: "Get one branch"
    roles: [PlatformAdmin, BranchManager, SalesRep, Dispatcher, Contractor, CreditAnalyst, ClaimsAdjuster, WarehouseClerk]
    code: 200
    input: []
    output: Branch
    side_effects: []

  # --- Product ---
  - method: POST
    path: "/roofing/products"
    description: "Create a product"
    roles: [PlatformAdmin]
    code: 201
    input: [sku, manufacturer_name, color_code, bundles_per_square, base_price_per_bundle_cents, "requires_certified_installer?"]
    output: Product
    side_effects: ["status = ACTIVE"]

  - method: GET
    path: "/roofing/products"
    description: "List products"
    roles: [PlatformAdmin, BranchManager, SalesRep, Dispatcher, Contractor, CreditAnalyst, ClaimsAdjuster, WarehouseClerk]
    code: 200
    input: ["limit?", "offset?"]
    output: "Product[]"
    side_effects: []

  - method: GET
    path: "/roofing/products/{id}"
    description: "Get one product"
    roles: [PlatformAdmin, BranchManager, SalesRep, Dispatcher, Contractor, CreditAnalyst, ClaimsAdjuster, WarehouseClerk]
    code: 200
    input: []
    output: Product
    side_effects: []

  # --- InventoryLot ---
  - method: POST
    path: "/roofing/branches/{id}/inventory-lots"
    description: "Receive stock into a branch lot (creates or tops up)"
    roles: [WarehouseClerk, PlatformAdmin]
    code: 201
    input: [product_id, lot_code, on_hand_bundles]
    output: InventoryLot
    side_effects: ["reserved_bundles = 0"]

  - method: GET
    path: "/roofing/branches/{id}/inventory-lots"
    description: "List lots at a branch"
    roles: [PlatformAdmin, BranchManager, SalesRep, Dispatcher, WarehouseClerk]
    code: 200
    input: ["limit?", "offset?", "product_id?"]
    output: "InventoryLot[]"
    side_effects: []

  - method: GET
    path: "/roofing/inventory-lots/{id}"
    description: "Get one lot"
    roles: [PlatformAdmin, BranchManager, SalesRep, Dispatcher, WarehouseClerk]
    code: 200
    input: []
    output: InventoryLot
    side_effects: []

  - method: GET
    path: "/roofing/inventory-lots"
    description: "List lots across branches with optional filters"
    roles: [PlatformAdmin, BranchManager, SalesRep, Dispatcher, WarehouseClerk]
    code: 200
    input: ["limit?", "offset?", "product_id?", "branch_id?"]
    output: "InventoryLot[]"
    side_effects: []

  # --- ContractorAccount ---
  - method: POST
    path: "/roofing/contractor-accounts"
    description: "Create a contractor credit account"
    roles: [CreditAnalyst, PlatformAdmin]
    code: 201
    input: [company_name, credit_limit_cents, "pricing_tier?", "manufacturer_certifications?"]
    output: ContractorAccount
    side_effects: ["status = ACTIVE", "open_balance_cents = 0"]

  - method: GET
    path: "/roofing/contractor-accounts"
    description: "List contractor accounts"
    roles: [PlatformAdmin, BranchManager, SalesRep, CreditAnalyst]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "ContractorAccount[]"
    side_effects: []

  - method: GET
    path: "/roofing/contractor-accounts/{id}"
    description: "Get one contractor account"
    roles: [PlatformAdmin, BranchManager, SalesRep, CreditAnalyst, Contractor]
    code: 200
    input: []
    output: ContractorAccount
    side_effects: []

  - method: GET
    path: "/roofing/contractor-accounts/{id}/statement"
    description: "Account statement using invoiced_only credit_available variant"
    roles: [CreditAnalyst, Contractor, PlatformAdmin]
    code: 200
    input: []
    output: "{ open_balance_cents: integer, pending_delivery_hold_cents: integer, lien_hold_cents: integer, credit_available_cents: integer }"
    side_effects: []

  - method: POST
    path: "/roofing/contractor-accounts/{id}/suspend"
    description: "Suspend an account"
    roles: [CreditAnalyst]
    code: 200
    input: []
    output: ContractorAccount
    side_effects: ["status = SUSPENDED"]

  - method: POST
    path: "/roofing/contractor-accounts/{id}/reinstate"
    description: "Reinstate a suspended account"
    roles: [CreditAnalyst]
    code: 200
    input: []
    output: ContractorAccount
    side_effects: ["status = ACTIVE if credit_limit_cents > open_balance_cents"]

  - method: POST
    path: "/roofing/contractor-accounts/{id}/payments"
    description: "Post a payment; applies to oldest unpaid invoice first"
    roles: [CreditAnalyst, Contractor]
    code: 201
    input: [amount_cents, "job_account_id?"]
    output: "{ applied_to_order_ids: string[], new_open_balance_cents: integer }"
    side_effects:
      - "open_balance_cents -= amount_cents (floor 0) via job_account_aging oldest-first"
      - "Affected orders' payment_status -> PAID when their invoice is fully covered"

  # --- JobAccount ---
  - method: POST
    path: "/roofing/contractor-accounts/{id}/job-accounts"
    description: "Create a job account under a contractor"
    roles: [CreditAnalyst, Contractor, PlatformAdmin]
    code: 201
    input: [job_name, site_address]
    output: JobAccount
    side_effects: ["lien_status = NONE", "job_balance_cents = 0"]

  - method: GET
    path: "/roofing/contractor-accounts/{id}/job-accounts"
    description: "List job accounts for a contractor"
    roles: [PlatformAdmin, BranchManager, SalesRep, CreditAnalyst, Contractor]
    code: 200
    input: ["limit?", "offset?"]
    output: "JobAccount[]"
    side_effects: []

  - method: GET
    path: "/roofing/job-accounts/{id}"
    description: "Get one job account"
    roles: [PlatformAdmin, BranchManager, SalesRep, CreditAnalyst, Contractor]
    code: 200
    input: []
    output: JobAccount
    side_effects: []

  - method: POST
    path: "/roofing/job-accounts/{id}/file-lien-notice"
    description: "File a preliminary lien notice on a job"
    roles: [CreditAnalyst]
    code: 200
    input: [lien_notice_amount_cents]
    output: JobAccount
    side_effects:
      - "lien_status = NOTICE_FILED, notice_filed_at = now"
      - "ContractorAccount.lien_hold_cents += lien_notice_amount_cents"

  - method: POST
    path: "/roofing/job-accounts/{id}/record-lien"
    description: "Record the lien after the cure period"
    roles: [CreditAnalyst]
    code: 200
    input: []
    output: JobAccount
    side_effects:
      - "lien_status = LIEN_RECORDED"
      - "ContractorAccount.status = LIEN_DEFAULT"

  - method: POST
    path: "/roofing/job-accounts/{id}/release-lien"
    description: "Release a lien once the job balance is zero"
    roles: [CreditAnalyst]
    code: 200
    input: []
    output: JobAccount
    side_effects:
      - "lien_status = RELEASED; lien_hold_cents decremented"
      - "ContractorAccount.status -> ACTIVE when last active lien releases"

  # --- MaterialTakeoff ---
  - method: POST
    path: "/roofing/job-accounts/{id}/takeoffs"
    description: "Create a material takeoff"
    roles: [SalesRep, Contractor]
    code: 201
    input: [product_id, roof_squares, waste_factor_pct, "valley_ridge_linear_feet?"]
    output: MaterialTakeoff
    side_effects: ["estimated_bundles / estimated_amount_cents computed per takeoff_material_estimate (provisional variant)"]

  - method: GET
    path: "/roofing/job-accounts/{id}/takeoffs"
    description: "List takeoffs for a job"
    roles: [PlatformAdmin, BranchManager, SalesRep, Contractor]
    code: 200
    input: ["limit?", "offset?"]
    output: "MaterialTakeoff[]"
    side_effects: []


  - method: GET
    path: "/roofing/takeoffs"
    description: "List takeoffs across jobs with optional filters"
    roles: [PlatformAdmin, BranchManager, SalesRep, Contractor]
    code: 200
    input: ["limit?", "offset?", "product_id?", "job_account_id?", "status?"]
    output: "MaterialTakeoff[]"
    side_effects: []
  - method: GET
    path: "/roofing/takeoffs/{id}"
    description: "Get one takeoff"
    roles: [PlatformAdmin, BranchManager, SalesRep, Contractor]
    code: 200
    input: []
    output: MaterialTakeoff
    side_effects: []

  - method: POST
    path: "/roofing/takeoffs/{id}/quote"
