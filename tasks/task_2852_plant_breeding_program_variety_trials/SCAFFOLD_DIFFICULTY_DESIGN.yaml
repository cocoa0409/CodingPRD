        grounds:
          - state_machines.BreedingLine
          - entities.BreedingLine.fields.pipeline_stage
          - entities.BreedingLine.fields.stewardship_status
          - complexity_profile.state_machine_shape
          - endpoints["POST /advancement-decisions"]
        distinguishing_aspect: |
          Parallel shape: BreedingLine carries two independent state dimensions on
          one row, and the combined state - not either dimension alone - decides
          what is legal. Advancing NURSERY -> STAGE_1 must leave
          stewardship_status at APPROVED untouched (a naive single-status model
          overwrites it), while the same ADVANCE trigger out of PRE_COMMERCIAL is
