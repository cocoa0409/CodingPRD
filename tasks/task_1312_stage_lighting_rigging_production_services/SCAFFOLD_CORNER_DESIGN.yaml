        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request missing X-User-Role / X-User-ID headers is rejected with ERR_UNAUTHENTICATED (401) before any role, schema, or state check runs (the recipe's `as:` documents intent; the generated test drops the headers)."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/venues", payload: { name: "Arena", union_ruleset: IATSE, max_point_capacity_kg: 500, bay_aggregate_limit_kg: 2000, house_power_amps_per_phase: 200, dock_doors: 2 }, as: ProductionManager, captures: { err: $.data.error_id } }
          assert:
            - "returns error_id ERR_UNAUTHENTICATED (HTTP 401) when the identity headers are absent"

      - name: wrong_role_writes_forbidden
        claim_type: violation_to_error
        grounds: ["validations[priority=2]", "errors[ERR_FORBIDDEN]", roles]
        distinguishing_aspect: "Role denial is enforced per endpoint: WarehouseChief cannot create productions, ClientContact cannot create crew calls, StructuralEngineer cannot reserve pull-list entries — each returns ERR_FORBIDDEN (403)."
        test_recipe:
          setup: ["venue V1 and PLANNING production P1 exist; asset A1 exists"]
          setup_api_calls:
            - { call: "POST /api/venues", payload: { name: "Arena IATSE", union_ruleset: IATSE, max_point_capacity_kg: 500, bay_aggregate_limit_kg: 2000, house_power_amps_per_phase: 200, dock_doors: 2 }, as: ProductionManager, captures: { v1: $.data.id } }
            - { call: "POST /api/productions", payload: { venue_id: "${v1}", name: "P1", load_in_at: "2026-09-01T08:00:00Z", show_at: "2026-09-02T19:00:00Z", load_out_at: "2026-09-03T23:00:00Z" }, as: ProductionManager, captures: { p1: $.data.id } }
            - { call: "POST /api/productions/${p1}/transition", payload: { to: PLANNING }, as: ProductionManager }
            - { call: "POST /api/assets", payload: { asset_tag: "ML-001", asset_class: MOVING_LIGHT, weight_kg: 25, daily_rate_cents: 5000, replacement_cost_cents: 100000, acquired_at: "2024-08-01T00:00:00Z" }, as: WarehouseChief, captures: { a1: $.data.id } }
          trigger:
            - { call: "POST /api/productions", payload: { venue_id: "${v1}", name: "PX", load_in_at: "2026-10-01T08:00:00Z", show_at: "2026-10-02T19:00:00Z", load_out_at: "2026-10-03T23:00:00Z" }, as: WarehouseChief, captures: { e1: $.data.error_id } }
            - { call: "POST /api/productions/${p1}/crew-calls", payload: { department: LIGHTING, call_start: "2026-09-01T08:00:00Z", call_end: "2026-09-01T18:00:00Z", required_headcount: 1 }, as: ClientContact, captures: { e2: $.data.error_id } }
            - { call: "POST /api/productions/${p1}/pull-list-entries", payload: { asset_id: "${a1}" }, as: StructuralEngineer, captures: { e3: $.data.error_id } }
          assert:
            - "all three attempts return error_id ERR_FORBIDDEN (HTTP 403)"

      - name: crew_chief_cannot_confirm_others_assignment
        claim_type: violation_to_error
        grounds: ["validations[priority=4]", "errors[ERR_NOT_RESOURCE_OWNER]", roles.CrewChief]
        distinguishing_aspect: "Entity-backed ownership: CrewChief X-User-ID must equal assignment.technician_id — technician T2 confirming T1's assignment gets ERR_NOT_RESOURCE_OWNER (403), while T1 self-confirm succeeds."
        test_recipe:
          setup: ["IATSE venue; production PLANNING; PUBLISHED LIGHTING call; assignment AS1 for technician T1; technician T2 also exists"]
