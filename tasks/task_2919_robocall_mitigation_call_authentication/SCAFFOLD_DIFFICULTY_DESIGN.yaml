              as: Regulator
              captures: { act_id: $.data.id }
          assert:
            - "EffectivenessReport.${rep_id}.attestation_component == 0.0000"
            - "EffectivenessReport.${rep_id}.traceback_component == 1.0000"
            - "EffectivenessReport.${rep_id}.notice_component == 1.0000"
            - "EffectivenessReport.${rep_id}.effectiveness_score == 0.6000"
            - "EffectivenessReport.${rep_id}.score_band == MID"
            - "EffectivenessReport.${rep_id}.data_sufficiency == INSUFFICIENT"
            - "EffectivenessReport.${rep_id}.state == SIGNED_OFF"
