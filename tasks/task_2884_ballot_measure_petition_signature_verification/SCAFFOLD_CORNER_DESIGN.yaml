            - call: "POST /signature-batches/${b1_id}/verify-affidavit"
              payload: { affidavit_notary_id: "NOT-1" }
              as: CountyClerk
              as_user_id: "${alpha_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-12T00:00:00Z" }
