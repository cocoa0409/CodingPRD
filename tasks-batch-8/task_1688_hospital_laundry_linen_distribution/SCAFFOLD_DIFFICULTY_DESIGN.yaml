            - "LinenStock.${s1}.lost_pieces == 1"
            - "LinenStock.${s2}.shrinkage_status == NORMAL (loss_rate_pct == 0.00)"
            - "LinenStock.${s2}.lost_pieces == 0 and retired_pieces == 1 (condemned)"

      - name: restock_zero_when_on_hand_equals_par
        grounds:
          - calculations.restock_quantity
          - entities.CartExchangeRun.fields.restock_lines
        distinguishing_aspect: |
          Zero-quantity boundary on POST /cart-runs/{id}/complete (different
          metric and endpoint from the loss-rate threshold): on_hand already
          equal to effective_par yields a zero-piece restock that still
          completes successfully, not an error.
        test_recipe:
          setup:
            - "Facility; unit ICU; stock S1 par 20; run r1 filled the unit to par and reconciled"
          setup_api_calls:
