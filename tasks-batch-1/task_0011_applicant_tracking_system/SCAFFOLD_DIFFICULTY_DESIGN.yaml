          assert:
            - "JobRequisition.status == CANCELLED (link 1)"
            - "Application(${app1_id}).status == WITHDRAWN and Application(${app2_id}).status == WITHDRAWN (link 2 from req cancel)"
            - "Offer(${offer1_id}).status == REVOKED (link 2 from req cancel)"

  # ===================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # ===================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: requisition_approve_sod_beats_budget
        grounds:
          - validations[priority=7]
          - validations[priority=17]
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - errors[ERR_BUDGET_EXCEEDED]
        distinguishing_aspect: |
          Pair (business_safety vs business_fiscal): On POST /requisitions/{id}/approve, the
          same submitter user attempts approval AND the requisition's worst-case headroom
          (openings * base_salary_max_cents) exceeds the department budget. Priority 7
          (ERR_SEGREGATION_OF_DUTIES, business_safety) MUST win over priority 17
          (ERR_BUDGET_EXCEEDED, business_fiscal).
        test_recipe:
          setup:
            - "Department D with hiring_budget_cents=10_000_000 (only USD 100k — far below requisition's worst-case)"
            - "JobRequisition R under D, openings=1, base_salary_max_cents=20_000_000 → worst-case 20M > budget 10M (budget would fail)"
            - "Submitter user rec_alice tries to approve as itself (SoD also fails)"
          setup_api_calls:
            - call: "POST /ats/departments"
              payload: { name: "Tight", cost_center_code: "TGT-001", hiring_budget_cents: 10000000 }
              as: PlatformAdmin
              captures: { dept_id: $.data.id }
            - call: "POST /ats/requisitions"
              payload: { department_id: "${dept_id}", title: "TightRole", target_level: "STAFF", base_salary_min_cents: 15000000, base_salary_max_cents: 20000000, openings: 1 }
              as: Recruiter
              as_user_id: "rec_alice"
              captures: { req_id: $.data.id }
            - call: "POST /ats/requisitions/${req_id}/submit"
              payload: {}
              as: Recruiter
              as_user_id: "rec_alice"
          trigger:
            - call: "POST /ats/requisitions/${req_id}/approve"
              payload: {}
              as: HiringManager
              as_user_id: "rec_alice"
              captures: { err_id: $.data.error_id }
          assert:
            - "Response error_id == ERR_SEGREGATION_OF_DUTIES (priority 7, business_safety wins over priority 17)"
            - "JobRequisition.status remains PENDING_APPROVAL (no transition fired)"

      - name: interview_create_panelist_conflict_beats_invalid_panel
        grounds:
          - validations[priority=8]
          - validations[priority=12]
