          statement does not reference at all — the link runs statement ->
          Submission -> SubmissionLot -> Dispute, three hops away. The dispute is
          filed BEFORE the statement exists, so the statement is minted cleanly in
          DRAFT and the refusal comes purely from the sibling entity's state; once
