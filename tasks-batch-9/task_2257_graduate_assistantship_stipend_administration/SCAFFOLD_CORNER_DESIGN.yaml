  # ===========================================================================
  # Table 2 - State Machines
  # ===========================================================================
  - section: state_machines
    instances:

      - name: term_advances_planning_open_payroll_locked_closed_in_order
        claim_type: valid_transition
        grounds:
          - state_machines.AcademicTerm.status
          - endpoints[POST /academic-terms/{id}/open]
          - endpoints[POST /academic-terms/{id}/lock-payroll]
          - endpoints[POST /academic-terms/{id}/close]
        distinguishing_aspect: "The three term actions walk PLANNING -> OPEN -> PAYROLL_LOCKED -> CLOSED, stamping locked_at at lock-payroll and closed_at at close, and lock-payroll drives the term's OPEN pay period to LOCKED while close drives it to CLOSED."
        test_recipe:
          setup: ["A PLANNING term FALL2026 with one RESEARCH/DOCTORAL policy and one pay period; no appointments."]
          setup_api_calls:
            - call: "POST /academic-terms"
              payload: { term_code: "FALL2026", term_start: "2026-09-01", term_end: "2026-12-31", tax_calendar_year: 2026, session_type: "IN_SESSION", proration_method: "CALENDAR_DAY", remission_drop_deadline: "2026-09-15" }
              as: GradSchoolAdmin
              as_user_id: "user-gs-1"
              captures: { term_id: "$.data.id" }
            - call: "POST /stipend-policies"
              payload: { term_id: "${term_id}", assistantship_type: "RESEARCH", degree_level: "DOCTORAL", min_fte_monthly_stipend_cents: 400000, per_credit_tuition_cents: 50000, max_remission_cents_per_term: 900000, term_insurance_premium_cents: 0 }
              as: GradSchoolAdmin
              as_user_id: "user-gs-1"
            - call: "POST /pay-periods"
              payload: { term_id: "${term_id}", sequence_no: 1, period_start: "2026-09-01", period_end_exclusive: "2027-01-01", pay_date: "2027-01-05" }
              as: GradSchoolAdmin
              as_user_id: "user-gs-1"
              captures: { pp_id: "$.data.id" }
          trigger:
            - call: "POST /academic-terms/${term_id}/open"
              payload: {}
              as: GradSchoolAdmin
              as_user_id: "user-gs-1"
            - call: "POST /academic-terms/${term_id}/lock-payroll"
              payload: {}
              as: GradSchoolAdmin
              as_user_id: "user-gs-1"
            - call: "GET /academic-terms/${term_id}/pay-periods"
              payload: { status: "LOCKED" }
              as: GradSchoolAdmin
              as_user_id: "user-gs-1"
            - call: "POST /academic-terms/${term_id}/close"
              payload: {}
              as: GradSchoolAdmin
              as_user_id: "user-gs-1"
          assert:
            - "after open: AcademicTerm.${term_id}.status == OPEN and pay_period_count == 1"
            - "after lock-payroll: AcademicTerm.${term_id}.status == PAYROLL_LOCKED and locked_at != null"
            - "the LOCKED filter returns exactly 1 row whose id == ${pp_id} (PayPeriod.${pp_id}.status == LOCKED)"
            - "after close: AcademicTerm.${term_id}.status == CLOSED and closed_at != null"
            - "PayPeriod.${pp_id}.status == CLOSED after close"

