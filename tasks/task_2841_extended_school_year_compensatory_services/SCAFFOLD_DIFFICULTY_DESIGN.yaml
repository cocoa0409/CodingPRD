  # =====================================================================
  # Rule 4 - transitive cascade chains from different triggers
  # =====================================================================
  - rule_id: transitive_cascade
    instances:
      - name: cancel_day_cascades_log_to_commitment_to_student_alert_threshold
        grounds:
          - state_machines.EsyProgram.OPEN_to_OPEN
          - state_machines.TransportationRun.SCHEDULED_to_CANCELLED
          - calculations.commitment_minutes_ledger
          - calculations.student_minutes_ledger
          - entities.ServiceLog.fields.generated_by
          - entities.Student.fields.pending_award_minutes
          - entities.Student.fields.esy_service_alert
        distinguishing_aspect: |
          DEPTH 4 from the cancel-day trigger, each hop caused by the previous one:
          cancelling one instructional day creates a MISSED_DISTRICT ServiceLog of
          57 minutes (link 1); that log's existence forces
          ServiceCommitment.compensable_owed_minutes to 57 (link 2); that field
          change forces Student.pending_award_minutes to 57 (link 3); and that value
          crossing AUTO_AWARD_THRESHOLD_MINUTES on the SECOND cancellation (114)
          flips Student.esy_service_alert to true (link 4). The simultaneous
          cancellation of the day's transportation run is a fan-out off the
          original action, NOT a link in this chain.
        test_recipe:
          setup:
            - "Program P1 is OPEN with the 22-day / 6-ISO-week calendar; commitment C1 for student S1 is ACTIVE with pinned daily_minutes 57 and no service logs yet."
            - "A SCHEDULED transportation run on route R7 exists for 2027-06-14, window 07:00-07:45, 2 seats, with no commitment seated on it."
            - "Student S1 has pending_award_minutes 0 and esy_service_alert false."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-06-01T00:00:00Z" }
              as: CaseManager
            - call: "POST /esy/students"
              payload: { student_number: "S-2841-001", first_name: "Ada", last_name: "Reyes", grade_band: "MS_6_8", primary_disability: "AUTISM", iep_weekly_minutes_total: 250, transportation_required: true, home_school_code: "MS-014" }
              as: CaseManager
              as_user_id: "cm-001"
              captures: { s1_id: $.data.id }
            - call: "POST /esy/eligibility-determinations"
              payload: { student_id: "${s1_id}", school_year: "2026-2027", analysis_variant: "PROBE_BASED", skill_probes: [ { skill_domain: "READING_FLUENCY", pre_break_mastery_pct: 80, post_break_mastery_pct: 60, recoupment_days_observed: 20, trials_count: 4 }, { skill_domain: "MATH_COMPUTATION", pre_break_mastery_pct: 100, post_break_mastery_pct: 74, recoupment_days_observed: 22, trials_count: 4 } ] }
              as: CaseManager
              as_user_id: "cm-001"
              captures: { d1_id: $.data.id }
            - call: "POST /esy/eligibility-determinations/${d1_id}/analyze"
              payload: {}
              as: CaseManager
              as_user_id: "cm-001"
            - call: "POST /esy/eligibility-determinations/${d1_id}/parent-response"
              payload: { response: "AGREE" }
              as: ParentGuardian
              as_user_id: "${s1_id}"
            - call: "POST /esy/eligibility-determinations/${d1_id}/finalize"
              payload: {}
              as: SpedDirector
              as_user_id: "dir-001"
            - call: "POST /esy/programs"
              payload: { name: "Summer ESY 2027", school_year: "2026-2027", session_start_date: "2027-06-14", session_end_date: "2027-07-23", instructional_weekdays: ["MON", "TUE", "WED", "THU"], daily_minutes_cap: 90, blackout_dates: ["2027-06-30", "2027-07-05"] }
              as: ProgramCoordinator
              as_user_id: "pc-001"
