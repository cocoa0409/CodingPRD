  # --- Flight Slots ---
  - method: POST
    path: "/btaa/campaigns/{id}/flight_slots"
    description: "Create and BOOK a FlightSlot (OCC on SeasonalCapacity). Selector assigns aircraft and pilot."
    roles: [Client, Dispatcher]
    code: 201
    input: [route_id, airspace_approval_id, banner_id, date_local, planned_start_utc, planned_duration_hours, expected_seasonal_capacity_version, "supersedes_slot_id?"]
    output: FlightSlot
    side_effects:
      - "slot.status = BOOKED"
      - "aircraft_selector picks assigned_aircraft_id"
      - "pilot_selector picks assigned_pilot_id"
      - "SeasonalCapacity.hours_committed += planned_duration_hours"
      - "increments SeasonalCapacity.version by 1"
      - "campaign.booked_flight_count recomputed"
      - "increments Campaign.version by 1"

  - method: GET
    path: "/btaa/campaigns/{id}/flight_slots"
    description: "List FlightSlots for a Campaign"
    roles: [PlatformAdmin, Dispatcher, FinanceOfficer, ComplianceOfficer, Client, Pilot, GroundCrewLead]
    code: 200
    input: ["status?", "date_local?", "limit?", "offset?"]
    output: "FlightSlot[]"
    side_effects: []

  - method: GET
    path: "/btaa/flight_slots/{id}"
    description: "Get a FlightSlot"
    roles: [PlatformAdmin, Dispatcher, FinanceOfficer, ComplianceOfficer, Client, Pilot, GroundCrewLead]
    code: 200
    input: []
    output: FlightSlot
    side_effects: []

  - method: POST
    path: "/btaa/flight_slots/{id}/schedule"
    description: "FlightSlot BOOKED → SCHEDULED (T-2h cutoff; first schedule drives campaign IN_FLIGHT)"
    roles: [Dispatcher]
    code: 200
    input: []
    output: FlightSlot
    side_effects:
      - "slot.status = SCHEDULED"
      - "if parent campaign.status == BOOKED: campaign → IN_FLIGHT"
      - "increments FlightSlot.version by 1"

  - method: POST
    path: "/btaa/flight_slots/{id}/weather_assessments"
    description: "Record a WeatherAssessment; verdict GO/MARGINAL leaves state; NO_GO drives WEATHER_HOLD or CANCELLED_WEATHER"
    roles: [Pilot, Dispatcher, PlatformAdmin]
    code: 201
    input: [ceiling_ft, visibility_sm, wind_kts]
    output: WeatherAssessment
    side_effects:
      - "weather assessment appended (immutable, common_fields=false)"
      - "if verdict==NO_GO: slot → WEATHER_HOLD (weather_hold_count += 1); if weather_hold_count after increment >= 2: slot → CANCELLED_WEATHER, MakeGoodCredit created, SeasonalCapacity released"
      - "campaign counters recomputed"

  - method: POST
    path: "/btaa/flight_slots/{id}/reschedule_after_hold"
    description: "WEATHER_HOLD → SCHEDULED"
    roles: [Dispatcher]
    code: 200
    input: [planned_start_utc]
    output: FlightSlot
    side_effects: ["slot.status = SCHEDULED", "planned_start_utc updated", "increments FlightSlot.version by 1"]

  - method: POST
    path: "/btaa/flight_slots/{id}/flight_log"
    description: "Pilot files FlightLog; slot SCHEDULED → FLOWN"
    roles: [Pilot]
    code: 201
    input: [hobbs_out, hobbs_in, pickup_technique, pickup_outcome, tow_field_notes]
    output: FlightLog
    side_effects:
      - "FlightLog created (slot_id, aircraft_id, pilot_id copied from slot)"
      - "slot.status = FLOWN"
      - "Aircraft.season_hours_flown += hobbs_hours"
      - "Pilot.season_hours_flown += hobbs_hours"
      - "if pickup_outcome==FAILED: Pilot.season_pickup_failure_count += 1; if reaches 3: pilot → SUSPENDED, cascade SCHEDULED slots → BOOKED"
      - "campaign.flown_flight_count recomputed"
      - "increments FlightSlot.version by 1, Aircraft.version by 1, Pilot.version by 1"

  - method: POST
    path: "/btaa/flight_slots/{id}/cancel_by_client"
    description: "FlightSlot BOOKED/SCHEDULED → CANCELLED_CLIENT (penalty accrues)"
    roles: [Client]
    code: 200
    input: []
    output: FlightSlot
    side_effects:
      - "slot.status = CANCELLED_CLIENT"
      - "SeasonalCapacity.hours_committed -= planned_duration_hours"
      - "cancelled_at_utc recorded for penalty calculation"
      - "increments FlightSlot.version by 1"

  - method: GET
    path: "/btaa/flight_slots/{id}/weather_assessments"
    description: "List WeatherAssessments for a FlightSlot"
    roles: [PlatformAdmin, Dispatcher, ComplianceOfficer, Client, Pilot]
