        payload: {}
        as: BillingAnalyst
      - call: POST /streetlights/outage-tickets
        payload:
          pole_id: ${pole}
          description: first
          hazard_flag: false
        as: CitizenReporter
        as_user_id: citizen-1
        captures:
          t1: $.data.id
      trigger:
      - call: POST /streetlights/outage-tickets
        payload:
          pole_id: ${pole}
          description: second
          hazard_flag: false
        as: CitizenReporter
        as_user_id: citizen-2
        captures:
          t2: $.data.id
      - call: POST /streetlights/outage-tickets/${t1}/triage
        payload: {}
        as: ProgramManager
      - call: POST /streetlights/outage-tickets/${t2}/triage
        payload: {}
        as: ProgramManager
        captures:
          e_dup: $.data.error_id
      - call: POST /streetlights/outage-tickets/${t1}/dispatch
        payload:
          crew_id: ${crew}
        as: ProgramManager
      - call: POST /streetlights/outage-tickets/${t1}/resolve
        payload:
          resolution_code: LIGHT_OUT_FIXED
        as: FieldSupervisor
        as_user_id: ${crew}
      - call: POST /streetlights/outage-tickets
        payload:
          pole_id: ${pole}
          description: third
          hazard_flag: false
        as: CitizenReporter
        as_user_id: citizen-3
        captures:
          t3: $.data.id
      - call: POST /streetlights/outage-tickets/${t1}/verify
        payload: {}
        as: CitizenReporter
        as_user_id: citizen-1
      - call: POST /streetlights/outage-tickets
        payload:
          pole_id: ${pole}
          description: fourth
          hazard_flag: false
        as: CitizenReporter
        as_user_id: citizen-4
        captures:
          t4: $.data.id
      assert:
      - OutageTicket.${t2}.status == DUPLICATE AND duplicate_of_ticket_id == ${t1}
      - 'OutageTicket.${t3}.status == DUPLICATE AND duplicate_of_ticket_id == ${t1}   # DUPLICATE tickets are not themselves candidates'
      - 'OutageTicket.${t4}.status == OPEN AND duplicate_of_ticket_id == null   # empty candidate set -> normal OPEN ticket'
      - 'DUPLICATE tickets carry no priority/sla (t2.priority == null) and are terminal: ${e_dup} == ERR_TICKET_NOT_OPEN'
