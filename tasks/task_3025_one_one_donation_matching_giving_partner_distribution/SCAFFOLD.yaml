    input: ["donation_product_id?", "impact_season_id?", "giving_partner_id?", "status?", "limit?", "offset?"]
    output: "DonationLiability[]"
    side_effects: []

  - method: GET
    path: "/impact-program/liabilities/{liability_id}"
    description: "Get one liability row"
    roles: [ImpactAuditor, AllocationPlanner, MarketingManager]
    code: 200
    input: []
    output: DonationLiability
    side_effects: []

  - method: PUT
    path: "/impact-program/liabilities/{liability_id}/unfreeze"
    description: "Return a frozen liability to accumulation and re-take the season snapshot"
    roles: [ImpactAuditor]
    code: 200
    input: []
    output: DonationLiability
    side_effects:
      - "status → ACCUMULATING and frozen_units recomputed"
      - "ImpactSeason.status → OPEN"
      - "increments ImpactSeason.version by 1"

  - method: POST
    path: "/impact-program/liabilities/{liability_id}/carry-forward"
    description: "Carry the unsubstantiated units of a frozen liability into the next season"
    roles: [AllocationPlanner]
    code: 200
    input: [claim_id, expected_liability_version]
    output: DonationLiability
    side_effects:
      - "carried_out_units = required_stated_units - frozen_units"
      - "The successor liability gains carried_in_units"
      - "ImpactSeason.liability_carry_in_units recomputed"
      - "increments DonationLiability.version by 1"

  # --- Claim and audit plane ------------------------------------------------
  - method: POST
    path: "/impact-program/marketing-claims"
    description: "Register a public donation claim for a product and partner"
    roles: [MarketingManager]
    code: 201
    input: [donation_product_id, partner_id, stated_donation_units, stated_ratio_text, winback_multiplier, stated_reference_period]
    output: MarketingClaim
    side_effects:
      - "status initialized to DRAFT"
      - "substantiated_donation_units computed on first read"

  - method: GET
    path: "/impact-program/marketing-claims"
    description: "List marketing claims with filtering"
    roles: [MarketingManager, ImpactAuditor, GivingPartnerCoordinator]
    code: 200
    input: ["status?", "partner_id?", "donation_product_id?", "limit?", "offset?"]
    output: "MarketingClaim[]"
    side_effects: []

  - method: GET
    path: "/impact-program/marketing-claims/{claim_id}"
    description: "Get one marketing claim"
    roles: [MarketingManager, ImpactAuditor, GivingPartnerCoordinator]
    code: 200
    input: []
    output: MarketingClaim
    side_effects: []

  - method: POST
    path: "/impact-program/marketing-claims/{claim_id}/substantiate"
    description: "Substantiate or refuse a claim against shipped and capacity-committed units"
    roles: [MarketingManager]
    code: 200
    input: []
    output: MarketingClaim
    side_effects:
      - "substantiated_donation_units and substantiated_ratio_value recomputed"
      - "DonationLiability.required_stated_units recomputed"
      - "status → SUBSTANTIATED or UNSUBSTANTIATED"

  - method: POST
    path: "/impact-program/marketing-claims/{claim_id}/derive-build"
    description: "Run the derive-build carry-forward and reconcile the frozen season"
    roles: [MarketingManager]
    code: 200
    input: [expected_liability_version]
    output: MarketingClaim
    side_effects:
      - "DonationLiability.required_stated_units recomputed"
      - "The season's reporting claim is re-derived at the point of the freeze or at the first final read"
      - "status → OVERSTATED when the ratio falls below the floor, else unchanged"
      - "increments DonationLiability.version by 1"

  - method: POST
    path: "/impact-program/marketing-claims/{claim_id}/revoke"
    description: "Revoke a claim permanently"
    roles: [MarketingManager]
    code: 200
    input: [reason]
    output: MarketingClaim
    side_effects:
      - "status → REVOKED, a terminal state the claim can never leave"

  - method: POST
    path: "/impact-program/impact-audits"
    description: "Schedule an annual impact or partner performance audit"
    roles: [ImpactAuditor]
    code: 201
    input: [impact_season_id, claim_id, audit_kind]
    output: ImpactAudit
    side_effects:
      - "status initialized to SCHEDULED"

  - method: GET
    path: "/impact-program/impact-audits"
    description: "List impact audits with filtering"
    roles: [ImpactAuditor, MarketingManager]
    code: 200
    input: ["status?", "audit_kind?", "impact_season_id?", "claim_id?", "limit?", "offset?"]
    output: "ImpactAudit[]"
    side_effects: []

  - method: GET
    path: "/impact-program/impact-audits/{audit_id}"
    description: "Get one impact audit with its verified figures"
    roles: [ImpactAuditor, MarketingManager]
    code: 200
    input: []
    output: ImpactAudit
    side_effects: []

  - method: POST
    path: "/impact-program/impact-audits/{audit_id}/start"
    description: "Begin fieldwork on a scheduled audit"
    roles: [ImpactAuditor]
    code: 200
    input: []
    output: ImpactAudit
    side_effects:
      - "status → IN_PROGRESS"
      - "shipped_units_verified and received_units_verified computed"
      - "computed_sample_size derived from the pinned sample formula"

  - method: POST
    path: "/impact-program/impact-audits/{audit_id}/finalize"
    description: "Finalize an audit, freeze the season reporting claim and grade the partners"
    roles: [ImpactAuditor]
    code: 200
    input: [transaction_test_sample_size, transaction_test_exceptions, claimed_donation_units, expected_audit_version, "finalization_error_message?"]
    output: ImpactAudit
    side_effects:
      - "unit_clearance_rate, scorecard_total and partner_performance_grade computed"
      - "GivingPartner.partner_performance_grade written for every rated partner"
      - "ImpactSeason.status → FINALIZED and its version incremented"
      - "increments ImpactAudit.version by 1"

  - method: POST
    path: "/impact-program/impact-audits/{audit_id}/reopen"
    description: "Reopen a finalized audit before the audit lock is released"
    roles: [ImpactAuditor]
    code: 200
    input: []
    output: ImpactAudit
    side_effects:
      - "status → REOPENED and ImpactSeason.status → FROZEN"
      - "The successor season's carried_in_units is re-homed back to this season"

  - method: GET
    path: "/impact-program/impact-audits/{audit_id}/summary"
    description: "Report the audit's verified totals, clearance rate and reconciliation delta"
    roles: [ImpactAuditor, MarketingManager]
    code: 200
    input: []
    output: { audit_id: string, audit_kind: string, shipped_units_verified: integer, received_units_verified: integer, unit_clearance_rate: number, scorecard_total: integer, partner_performance_grade: string, liability_reconciliation_delta: integer, computed_sample_size: integer }
    side_effects: []

  # --- Test-driving endpoints (outside the public business surface) ---------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. The server's startup default time is exactly 2026-09-01T00:00:00Z and MUST NOT fall back to real wall-clock time before any call here. A set that crosses a season boundary rolls every season transition, obligation freeze and vesting state change in one deterministic step and reports them in rollover_events."
    roles: [ImpactAuditor, ProvisioningPartner, GivingPartnerCoordinator]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string, rolling_season_code: string, rollover_events: "array" }
    side_effects:
      - "Season transitions PLANNED → OPEN, OPEN → FROZEN, and liability freezing re-evaluated"
      - "Product-line vesting transitions re-evaluated"

  - method: POST
    path: "/_seasons/roll"
    description: "Roll the logical clock to a season boundary and report the season transitions, the obligation rewrite count and the number of partners re-veiled in the new graph. Same body as the clock endpoint; exists so a test can drive a roll without asserting on the clock."
    roles: [ImpactAuditor, ProvisioningPartner, GivingPartnerCoordinator]
    code: 200
    input: [to_iso8601]
    output: { rolled_to: string, seasons_transitioned: integer, ledger_rows_rewritten: integer, rollover_events: "array" }
    side_effects:
      - "Season transitions and liability freezing applied"

  - method: GET
    path: "/impact-program/vetting-rounds"
    description: "List vetting rounds across partners with filtering"
    roles: [GivingPartnerCoordinator, ImpactAuditor]
    code: 200
    input: ["partner_id?", "outcome?", "limit?", "offset?"]
    output: "GivingPartnerVetting[]"
