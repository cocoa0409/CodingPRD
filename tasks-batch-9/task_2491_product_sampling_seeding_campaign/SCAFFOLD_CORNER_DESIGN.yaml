        excluded_because:
          difficulty_instance: dual_variant_calc / cost_per_sample_provisional_vs_final_on_campaign
          rationale: "The named §1.8 instance drives both variants on one campaign and asserts the divergence a LOST shipment plus a surcharge plus a write-off produces."

      - name: diversion_penalty_tier_is_read_from_the_pre_penalty_base
        claim_type: variant_selection
        grounds:
          - calculations.campaign_lift_and_diversion_penalty
        excluded_because:
          difficulty_instance: combinatorial_formula / lift_diversion_penalty_tier_from_pre_penalty_base
          rationale: "The named §1.8 instance places the pre-penalty base just under PENALTY_TIER_HIGH so that a post-penalty re-read of the tier would give a different answer."

