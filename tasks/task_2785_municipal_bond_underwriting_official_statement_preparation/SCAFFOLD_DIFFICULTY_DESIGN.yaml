            - "the reopen call returns 200 and OrderPeriod.${op_id}.status == OPEN"
            - "the second order attempt returns 422 with error_id ERR_DENOMINATION_INVALID, proving the priority-15 rule was violated by the same payload"
            - "OrderPeriod.${op_id}.orders_received_count == 0 after both attempts"

      - name: business_safety_beats_business_fiscal_on_syndicate_add
        grounds:
          - validations[ma-underwriter-conflict] (priority 12, category business_safety)
          - validations[liability-shares-sum-to-whole] (priority 16, category business_fiscal)
          - errors[ERR_MA_UNDERWRITER_CONFLICT]
          - errors[ERR_LIABILITY_PCT_SUM_INVALID]
        distinguishing_aspect: |
          A different category pair from the order-entry conflict: business_safety (priority 12)
          versus business_fiscal (priority 16), on a different endpoint. The MSRB G-23 conflict
          and the liability-sum overflow are violated by one request; G-23 must win. The control
          adds an unconflicted third firm with the same 60.0000 percent liability and gets the
          fiscal error instead, so the ordering is falsifiable in both directions.
        test_recipe:
          setup:
            - "Firms MA0001 (MUNICIPAL_ADVISOR), AU0001 (UNDERWRITER) and AU0002 (UNDERWRITER) exist."
            - "A STRUCTURING deal engages MA0001 as municipal advisor and already has AU0001 as an ACTIVE SENIOR_MANAGER at liability_pct 100.0000."
