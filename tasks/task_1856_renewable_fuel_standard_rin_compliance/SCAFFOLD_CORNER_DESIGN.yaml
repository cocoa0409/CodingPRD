              as: OpsAdmin
              captures: { err: $.data.error_id }
          assert:
            - "trigger error_id == ERR_FORBIDDEN"

      - name: segregation_trade_creator_cannot_verify
        claim_type: segregation_of_duties
        grounds: ["validations[priority=3]", "errors[ERR_SEGREGATION_OF_DUTIES]"]
        distinguishing_aspect: "Segregation of duties: even with the correct ComplianceManager role, the user who created the trade cannot verify it; a different user can."
        test_recipe:
          setup: ["account + APPROVED vendor; trade created by cm-self (role Trader id tr-9), paid, delivered"]
          setup_api_calls:
            - call: "POST /rfs/compliance-accounts"
              payload: { company_name: "Acme Refining", epa_registration_id: "EPA-RBAC-4" }
              as: OpsAdmin
              captures: { acct: $.data.id }
            - call: "POST /rfs/vendors"
              payload: { account_id: "${acct}", vendor_name: "GreenRIN LLC", qap_audited: true }
