              captures: { bs_id: $.data.id }
            - call: "POST /api/orders"
              payload: { store_id: "${store_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { o1: $.data.id }
            - call: "POST /api/orders/${o1}/lines"
              payload: { article_id: "${art_id}", qty: 5 }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /api/orders"
              payload: { store_id: "${store_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { o2: $.data.id }
            - call: "POST /api/orders/${o2}/lines"
              payload: { article_id: "${art_id}", qty: 1 }
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /api/orders/${o1}/checkout"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { o1_status: $.data.status, o1_total: $.data.total_cents }
            - call: "GET /api/stores/${store_id}/articles/${art_id}/signal"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { sig: $.data.signal, avail: $.data.available_units }
            - call: "POST /api/orders/${o2}/checkout"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err2: $.data.error_id }
          assert:
            - "first checkout succeeds: Order.${o1}.status == PAID and total_cents == 2500 (buying the exact available quantity is allowed)"
            - "BinStock.${bs_id}: on_hand == 0 and available == 0"
            - "signal == OUT_OF_STOCK with available_units == 0 (zero edge reached, not just below threshold)"
            - "second checkout fails with error_id == ERR_INSUFFICIENT_STOCK (422); Order.${o2}.status remains DRAFT"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: checkout_gated_by_binstock_availability
        grounds:
          - state_machines.Order.DRAFT_to_PAID
          - entities.BinStock.fields.available
          - errors[ERR_INSUFFICIENT_STOCK]
          - calculations.stock_availability_and_signal
        distinguishing_aspect: |
          Entity pair Order x BinStock: the DRAFT -> PAID transition is gated
          by the available field of a different aggregate (BinStock rows in the
          order's store); the same checkout flips from rejection to success
          once an operator adjustment raises availability, without touching the
          order itself.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Store ST-001. Customer N. Article A single carton, on_hand 2. Order of qty 3."
          setup_api_calls:
            - *c_clock
            - *c_store
            - *c_cust
            - call: "POST /api/articles"
              payload: { article_number: "ART-A", name: "Shelf", category: "ACCESSORY", pick_policy: "SELF_SERVE", price_cents: 1000 }
              as: PlatformAdmin
              captures: { art_a: $.data.id }
            - call: "POST /api/articles/${art_a}/cartons"
              payload: { carton_seq: 1, aisle: "01", bin: "01", weight_kg: 5, volume_m3: 0.05 }
              as: PlatformAdmin
              captures: { carton_a: $.data.id }
            - call: "POST /api/bin-stock"
              payload: { store_id: "${store_id}", carton_id: "${carton_a}", on_hand: 2 }
              as: StoreOps
              captures: { bs_id: $.data.id, bs_v1: $.data.version }
            - call: "POST /api/orders"
              payload: { store_id: "${store_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
            - call: "POST /api/orders/${order_id}/lines"
              payload: { article_id: "${art_a}", qty: 3 }
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /api/orders/${order_id}/checkout"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err1: $.data.error_id }
            - call: "POST /api/bin-stock/${bs_id}/adjust"
              payload: { delta_on_hand: 2, expected_stock_version: "${bs_v1}" }
              as: StoreOps
            - call: "POST /api/orders/${order_id}/checkout"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { o_status: $.data.status }
          assert:
            - "first checkout: error_id == ERR_INSUFFICIENT_STOCK (422); order stays DRAFT — gated by BinStock.available 2 < 3"
            - "after StoreOps adjusts on_hand 2 -> 4, the identical checkout succeeds: Order.${order_id}.status == PAID"
            - "BinStock.${bs_id}.on_hand == 1 after the successful checkout"

      - name: assembly_job_gated_by_order_fulfillment
        grounds:
          - state_machines.Order.NONE_to_SCHEDULED
          - state_machines.Order.PAID_to_FULFILLED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          Entity pair AssemblyJob x Order — a different pair from
          Order x BinStock: job creation is rejected while the order is merely
          PAID and accepted once the order reaches FULFILLED, with all other
          job inputs (window, standard, provider) unchanged.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Store ST-001. Customer N. Article ASM requires_assembly with standard 30 min/unit, stock 5. Order qty 1 checked out (PAID) but pickup not yet completed."
