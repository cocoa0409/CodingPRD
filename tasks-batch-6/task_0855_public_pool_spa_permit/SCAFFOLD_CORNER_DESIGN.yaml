            - "Complaint.${c_id}.linked_inspection_id == ${ci_id} after TRIAGE"
            - "Inspection.${ci_id}.score == 100 and result == PASS (empty violation set)"
            - "Complaint.${c_id}.status == CLOSED with finding == 'Filter media exhausted; turbidity confirmed'"
