      - name: state_invalid_errors_for_the_scope_and_schedule_entities
        claim_type: error_triggerable
        grounds: ["validations[priority=6]", "errors[ERR_WORK_ORDER_STATE_INVALID]", "errors[ERR_ACTIVITY_STATE_INVALID]", "errors[ERR_CORE_LOAD_PATTERN_STATE_INVALID]"]
        distinguishing_aspect: "Three own-state refusals whose triggers are all legal transitions from some other state: defer is legal from PLANNED and APPROVED but not from SCOPED, complete is legal from IN_PROGRESS but not from NOT_STARTED, and approve is legal from DRAFT but not from APPROVED."
