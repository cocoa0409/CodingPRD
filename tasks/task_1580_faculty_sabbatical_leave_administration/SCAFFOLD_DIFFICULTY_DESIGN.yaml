          Mode (a): tiered rate selection (2-semester -> {50,75} tier) with conditional branches
          (fellowship eligibility per 50% overlap rule) and a min() cap waterfall over multiple
          fellowships; 4+ inputs (salary, pct tier, duration, two fellowship amounts) interact
          non-linearly. gross 90000.00, cap 45000.00, offsets 25000.00 + 20000.00, net 45000.00.
