              payload: { outcome: "SCORE", technical_score: 4, collaboration_score: 4, client_service_score: 4, comment: "Strong leader." }
              as: Partner
              as_user_id: "${rev}"
            - call: "POST /comp/peer-reviews/${pr2}/decide"
              payload: { outcome: "SCORE", technical_score: 5, collaboration_score: 4, client_service_score: 3, comment: "Technically excellent." }
              as: Partner
              as_user_id: "${rev2}"
            - call: "POST /comp/self-assessments/${sa}/review-decision"
              payload: { decision: "ACCEPT" }
              as: CommitteeMember
              as_user_id: "${rev}"
            - call: "POST /comp/cycles/${cy}/advance"
              payload: { target_state: "PEER_REVIEW" }
              as: CycleAdmin
            - call: "POST /comp/cycles/${cy}/advance"
              payload: { target_state: "DELIBERATION" }
              as: CycleAdmin
            - call: "GET /comp/ballots"
              payload: { subject_partner_id: "${cms}", committee_member_id: "${cms}" }
              as: CycleAdmin
              captures: { b_self: "$.data[0].id" }
            - call: "GET /comp/ballots"
              payload: { subject_partner_id: "${cms}", committee_member_id: "${rev}" }
              as: CycleAdmin
              captures: { b_rev: "$.data[0].id" }
            - call: "GET /comp/cycles/${cy}"
              payload: {}
              as: CycleAdmin
              captures: { cyv: "$.data.version" }
          trigger:
            - call: "POST /comp/ballots/${b_self}/cast"
              payload: { action: "CAST", points_proposed: 2000.00, rationale: "Self-assessed top of band.", expected_cycle_version: "${cyv}" }
              as: CommitteeMember
              as_user_id: "${cms}"
              captures: { err_both: "$.data.error_id" }
            - call: "POST /comp/ballots/${b_self}/cast"
              payload: { action: "CAST", points_proposed: 500.00, rationale: "Within the cap.", expected_cycle_version: "${cyv}" }
              as: CommitteeMember
              as_user_id: "${cms}"
              captures: { err_safety_only: "$.data.error_id" }
            - call: "POST /comp/ballots/${b_rev}/cast"
              payload: { action: "CAST", points_proposed: 2000.00, rationale: "Above the cap on somebody else.", expected_cycle_version: "${cyv}" }
              as: CommitteeMember
              as_user_id: "${rev}"
              captures: { err_cap_only: "$.data.error_id" }
          assert:
            - "${err_both} == ERR_SELF_VOTE_FORBIDDEN"
            - "the first cast returns HTTP 403, not 409, and ${err_both} != ERR_POINTS_CAP_EXCEEDED"
            - "${err_safety_only} == ERR_SELF_VOTE_FORBIDDEN with HTTP 403"
            - "${err_cap_only} == ERR_POINTS_CAP_EXCEEDED with HTTP 409"
            - "CommitteeBallot.${b_self}.state == PENDING and CommitteeBallot.${b_self}.points_proposed is null"
            - "CommitteeBallot.${b_rev}.state == PENDING and CommitteeBallot.${b_rev}.points_proposed is null"
            - "Partner.${cms}.committee_points == 0.00"
            - "CompensationCycle.${cy}.version == ${cyv} after all three rejected casts"

      - name: claim_window_temporal_beats_client_history_referential
        grounds:
          - validations[priority=90]
          - validations[priority=110]
          - validation_priority_conflicts[temporal-beats-referential-on-claim-submit]
          - errors[ERR_CLAIM_WINDOW_CLOSED]
          - errors[ERR_CLIENT_NOT_NEW]
          - entities.Matter.fields.is_first_matter_for_client
        distinguishing_aspect: |
          A different error-category pair from self_vote_safety_beats_points_cap_constraint:
          business_temporal (priority 90) versus business_referential (priority 110) on
          POST /comp/credit-claims/{id}/submit. With the clock at 2026-12-01 past
          claim_deadline_on 2026-09-30 and a NEW_CLIENT claim on a client that already has
          a sibling matter, ERR_CLAIM_WINDOW_CLOSED wins; rewinding the clock to 2026-09-01
          surfaces ERR_CLIENT_NOT_NEW from the identical request.
        test_recipe:
          setup:
            - "Cycle fiscal_year 2026 in OPEN_INTAKE with claim_deadline_on 2026-09-30."
            - "Partner A is billing and responsible attorney of two OPEN Matters sharing client_key CLI-DUP: M1 opened 2026-01-10 and M2 opened 2026-03-10."
            - "A has a DRAFT CreditClaim on M2 with claim_basis NEW_CLIENT, which is referentially false because M1 exists."
            - "The logical clock has been pushed to 2026-12-01T00:00:00Z, past claim_deadline_on."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CycleAdmin
            - call: "POST /comp/cycles"
              payload: { fiscal_year: 2026, distributable_pool_cents: 100000000, lockstep_unit_cents: 0, discretionary_pool_pct: 0.2000, draw_pct: 0.8000, claim_deadline_on: "2026-09-30", assessment_deadline_on: "2026-10-31" }
              as: CycleAdmin
              captures: { cy: "$.data.id" }
            - call: "POST /comp/partners"
              payload: { full_name: "Ada Origin", practice_group: "CORPORATE", compensation_model: "FORMULA", admission_year: 2010 }
              as: CycleAdmin
              captures: { pa: "$.data.id" }
            - call: "POST /comp/matters"
              payload: { client_key: "CLI-DUP", client_display_name: "Duplicate Dynamics", matter_type: "NEW_CLIENT", practice_group: "CORPORATE", opened_on: "2026-01-10", billing_attorney_id: "${pa}", responsible_attorney_id: "${pa}" }
              as: CycleAdmin
              captures: { m1: "$.data.id" }
            - call: "POST /comp/matters"
              payload: { client_key: "CLI-DUP", client_display_name: "Duplicate Dynamics", matter_type: "EXPANDED_MATTER", practice_group: "CORPORATE", opened_on: "2026-03-10", billing_attorney_id: "${pa}", responsible_attorney_id: "${pa}" }
              as: CycleAdmin
              captures: { m2: "$.data.id" }
            - call: "POST /comp/credit-claims"
              payload: { cycle_id: "${cy}", matter_id: "${m2}", claim_basis: "NEW_CLIENT", requested_pct: 100.00, narrative: "Treating this as a brand-new client." }
              as: Partner
              as_user_id: "${pa}"
              captures: { cl1: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-01T00:00:00Z" }
              as: CycleAdmin
          trigger:
            - call: "POST /comp/credit-claims/${cl1}/submit"
              payload: {}
              as: Partner
              as_user_id: "${pa}"
              captures: { err_both: "$.data.error_id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: CycleAdmin
            - call: "POST /comp/credit-claims/${cl1}/submit"
              payload: {}
              as: Partner
              as_user_id: "${pa}"
              captures: { err_ref_only: "$.data.error_id" }
          assert:
            - "${err_both} == ERR_CLAIM_WINDOW_CLOSED"
            - "the first submit returns HTTP 409 and ${err_both} != ERR_CLIENT_NOT_NEW"
            - "${err_ref_only} == ERR_CLIENT_NOT_NEW with HTTP 409"
            - "CreditClaim.${cl1}.state == DRAFT after both rejected submits"
            - "CreditClaim.${cl1}.revision_count == 0"
            - "Matter.${m2}.is_first_matter_for_client == false"
            - "Matter.${m1}.is_first_matter_for_client == true"
            - "no CreditAllocation with credit_role == ORIGINATING exists on ${m2}"

      - name: cycle_transition_state_beats_awards_not_settled_fiscal
        grounds:
          - validations[priority=70]
          - validations[priority=140]
          - validation_priority_conflicts[state-beats-fiscal-on-close]
          - errors[ERR_INVALID_CYCLE_TRANSITION]
          - errors[ERR_AWARDS_NOT_SETTLED]
          - state_machines.CompensationCycle.TRUE_UP_OPEN_to_CLOSED
        distinguishing_aspect: |
          A third error-category pair, distinct from both of the pairs above: state
          (priority 70) versus business_fiscal (priority 140) on
          POST /comp/cycles/{id}/advance. From AWARDS_PUBLISHED with unsettled_award_count 1
          the CLOSED target violates both the missing transition edge and the settlement
          gate, and ERR_INVALID_CYCLE_TRANSITION wins; advancing legally to TRUE_UP_OPEN
          first makes the identical CLOSED request surface ERR_AWARDS_NOT_SETTLED.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Cycle fiscal_year 2026 in AWARDS_PUBLISHED: distributable_pool_cents 100000000, discretionary_pool_pct 0.2000, draw_pct 0.8000."
            - "Partner SUBJ is DISCRETIONARY with target_capital_cents 30000000; CM1 and CM2 are committee members with evaluation_required false."
            - "SUBJ's award is PUBLISHED with payment_state PENDING, so CompensationCycle.unsettled_award_count is 1 and no award is TRUED_UP or SETTLED."
            - "There is no AWARDS_PUBLISHED -> CLOSED edge in the CompensationCycle machine."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CycleAdmin
            - call: "POST /comp/cycles"
              payload: { fiscal_year: 2026, distributable_pool_cents: 100000000, lockstep_unit_cents: 0, discretionary_pool_pct: 0.2000, draw_pct: 0.8000, claim_deadline_on: "2026-09-30", assessment_deadline_on: "2026-10-31" }
              as: CycleAdmin
              captures: { cy: "$.data.id" }
            - call: "POST /comp/partners"
              payload: { full_name: "Dana Subject", practice_group: "CORPORATE", compensation_model: "DISCRETIONARY", admission_year: 2012, target_capital_cents: 30000000 }
              as: CycleAdmin
              captures: { subj: "$.data.id" }
            - call: "POST /comp/partners"
              payload: { full_name: "Cora Chair", practice_group: "TAX", compensation_model: "FORMULA", admission_year: 2005, is_committee_member: true, evaluation_required: false }
              as: CycleAdmin
              captures: { cm1: "$.data.id" }
            - call: "POST /comp/partners"
              payload: { full_name: "Milo Member", practice_group: "IP", compensation_model: "FORMULA", admission_year: 2007, is_committee_member: true, evaluation_required: false }
              as: CycleAdmin
              captures: { cm2: "$.data.id" }
            - call: "POST /comp/cycles/${cy}/advance"
              payload: { target_state: "SELF_ASSESSMENT" }
              as: CycleAdmin
            - call: "POST /comp/self-assessments"
              payload: { cycle_id: "${cy}", narrative: "Client development and firm service summary.", claimed_origination_pct_total: 0.00, claimed_non_billable_hours: 0.00 }
              as: Partner
              as_user_id: "${subj}"
              captures: { sa: "$.data.id" }
            - call: "POST /comp/self-assessments/${sa}/submit"
              payload: {}
              as: Partner
              as_user_id: "${subj}"
            - call: "POST /comp/peer-reviews"
              payload: { self_assessment_id: "${sa}", reviewer_partner_id: "${cm1}" }
              as: CycleAdmin
              captures: { pr1: "$.data.id" }
            - call: "POST /comp/peer-reviews"
              payload: { self_assessment_id: "${sa}", reviewer_partner_id: "${cm2}" }
              as: CycleAdmin
              captures: { pr2: "$.data.id" }
            - call: "POST /comp/peer-reviews/${pr1}/decide"
              payload: { outcome: "SCORE", technical_score: 4, collaboration_score: 4, client_service_score: 4, comment: "Consistently strong." }
              as: Partner
              as_user_id: "${cm1}"
            - call: "POST /comp/peer-reviews/${pr2}/decide"
              payload: { outcome: "SCORE", technical_score: 5, collaboration_score: 4, client_service_score: 3, comment: "Excellent technically." }
              as: Partner
              as_user_id: "${cm2}"
            - call: "POST /comp/self-assessments/${sa}/review-decision"
              payload: { decision: "ACCEPT" }
              as: CommitteeMember
              as_user_id: "${cm1}"
            - call: "POST /comp/cycles/${cy}/advance"
              payload: { target_state: "PEER_REVIEW" }
              as: CycleAdmin
            - call: "POST /comp/cycles/${cy}/advance"
              payload: { target_state: "DELIBERATION" }
              as: CycleAdmin
            - call: "GET /comp/ballots"
              payload: { subject_partner_id: "${subj}", committee_member_id: "${cm1}" }
              as: CycleAdmin
              captures: { b1: "$.data[0].id" }
            - call: "GET /comp/ballots"
              payload: { subject_partner_id: "${subj}", committee_member_id: "${cm2}" }
              as: CycleAdmin
              captures: { b2: "$.data[0].id" }
            - call: "GET /comp/cycles/${cy}"
              payload: {}
              as: CycleAdmin
              captures: { cyv1: "$.data.version" }
            - call: "POST /comp/ballots/${b1}/cast"
              payload: { action: "CAST", points_proposed: 800.00, rationale: "Outstanding origination year.", expected_cycle_version: "${cyv1}" }
              as: CommitteeMember
              as_user_id: "${cm1}"
            - call: "GET /comp/cycles/${cy}"
              payload: {}
              as: CycleAdmin
              captures: { cyv2: "$.data.version" }
            - call: "POST /comp/ballots/${b2}/cast"
              payload: { action: "CAST", points_proposed: 600.00, rationale: "Solid but not exceptional.", expected_cycle_version: "${cyv2}" }
              as: CommitteeMember
              as_user_id: "${cm2}"
            - call: "POST /comp/cycles/${cy}/advance"
              payload: { target_state: "AWARDS_PUBLISHED" }
              as: CycleAdmin
          trigger:
            - call: "POST /comp/cycles/${cy}/advance"
              payload: { target_state: "CLOSED" }
              as: CycleAdmin
              captures: { err_state: "$.data.error_id" }
            - call: "POST /comp/cycles/${cy}/advance"
              payload: { target_state: "TRUE_UP_OPEN" }
              as: CycleAdmin
            - call: "POST /comp/cycles/${cy}/advance"
              payload: { target_state: "CLOSED" }
              as: CycleAdmin
              captures: { err_fiscal: "$.data.error_id" }
          assert:
            - "${err_state} == ERR_INVALID_CYCLE_TRANSITION"
            - "the first CLOSED advance returns HTTP 409 and ${err_state} != ERR_AWARDS_NOT_SETTLED"
            - "CompensationCycle.${cy}.state == AWARDS_PUBLISHED after the first rejected advance"
            - "CompensationCycle.${cy}.unsettled_award_count == 1 at the time of the first rejected advance"
            - "the TRUE_UP_OPEN advance returns HTTP 200 and CompensationCycle.${cy}.state == TRUE_UP_OPEN"
            - "${err_fiscal} == ERR_AWARDS_NOT_SETTLED with HTTP 409"
            - "CompensationCycle.${cy}.state == TRUE_UP_OPEN after the second rejected advance"
            - "CompensationCycle.${cy}.confidentiality_locked == false"

  # =====================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: realization_exactly_at_ninety_five_hundredths_takes_top_tier
        grounds:
          - calculations.partner_formula_score.constants.REALIZATION_TIER_1_MIN
          - calculations.partner_formula_score.constants.REALIZATION_TIER_1_MULTIPLIER
          - calculations.matter_realization_and_profitability
          - entities.Partner.fields.blended_realization_pct
          - entities.Partner.fields.formula_score_provisional
          - endpoints[POST /comp/matters/{id}/financials]
        distinguishing_aspect: |
          Metric: blended_realization_pct against REALIZATION_TIER_1_MIN 0.9500, probed
          through POST /comp/matters/{id}/financials with a 1000-cent collection delta.
          Exactly 0.9500 must select tier 1 (>= comparison) and 0.9499 must fall to tier 2,
          and the trap is that the same 1000 cents also moves
          profitability_index_fully_loaded from 0.7053 to 0.7052, so the score gap is
          67.4610 -> 61.3262 (6.1348) rather than the 6.1330 that a tier-only view predicts.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; cycle fiscal_year 2026 in OPEN_INTAKE."
            - "Partner A (FORMULA) is billing and responsible attorney of OPEN Matter M and, after adjudication, its sole ORIGINATING holder at 100.00."
            - "A has 200.00 verified BILLABLE hours on M, so the WORKING allocation exists and OVERHEAD_RATE_CENTS_PER_HOUR * 200 = 1800000 is charged under FULLY_LOADED."
            - "Partner ARB (FORMULA, is_credit_arbiter) adjudicated and holds no credit, so firm_total is A's credited collection alone."
            - "M carries billed_cents 10000000, collected_cents 9499000, direct_cost_cents 1000000, i.e. realization_pct 0.9499 one hundredth of a percentage point below the tier-1 floor."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CycleAdmin
            - call: "POST /comp/cycles"
              payload: { fiscal_year: 2026, distributable_pool_cents: 100000000, lockstep_unit_cents: 0, discretionary_pool_pct: 0.2000, draw_pct: 0.8000, claim_deadline_on: "2026-09-30", assessment_deadline_on: "2026-10-31" }
              as: CycleAdmin
              captures: { cy: "$.data.id" }
            - call: "POST /comp/partners"
              payload: { full_name: "Ada Origin", practice_group: "CORPORATE", compensation_model: "FORMULA", admission_year: 2010 }
              as: CycleAdmin
              captures: { pa: "$.data.id" }
            - call: "POST /comp/partners"
              payload: { full_name: "Rex Arbiter", practice_group: "REGULATORY", compensation_model: "FORMULA", admission_year: 2004, is_credit_arbiter: true }
              as: CycleAdmin
              captures: { parb: "$.data.id" }
            - call: "POST /comp/matters"
              payload: { client_key: "CLI-T1", client_display_name: "Tier Test Corp", matter_type: "NEW_CLIENT", practice_group: "CORPORATE", opened_on: "2026-01-15", billing_attorney_id: "${pa}", responsible_attorney_id: "${pa}" }
              as: CycleAdmin
              captures: { m1: "$.data.id", m1v: "$.data.version" }
            - call: "POST /comp/matters/${m1}/financials"
              payload: { billed_delta_cents: 10000000, collected_delta_cents: 9499000, direct_cost_delta_cents: 1000000, expected_matter_version: "${m1v}" }
              as: CycleAdmin
            - call: "POST /comp/contribution-records"
              payload: { partner_id: "${pa}", cycle_id: "${cy}", matter_id: "${m1}", kind: "BILLABLE", category: "CLIENT_WORK", hours: 200.00, standard_rate_cents: 50000, service_period_start: "2026-01-15", service_period_end: "2026-06-30" }
              as: CycleAdmin
              captures: { cr1: "$.data.id" }
            - call: "POST /comp/contribution-records/${cr1}/verify"
              payload: {}
              as: CycleAdmin
            - call: "POST /comp/credit-claims"
              payload: { cycle_id: "${cy}", matter_id: "${m1}", claim_basis: "NEW_CLIENT", requested_pct: 100.00, narrative: "Originated Tier Test Corp." }
              as: Partner
              as_user_id: "${pa}"
              captures: { cl1: "$.data.id" }
            - call: "POST /comp/credit-claims/${cl1}/submit"
              payload: {}
              as: Partner
              as_user_id: "${pa}"
            - call: "GET /comp/matters/${m1}"
              payload: {}
              as: CycleAdmin
              captures: { m1v2: "$.data.version" }
            - call: "POST /comp/credit-claims/${cl1}/adjudicate"
              payload: { decision: "ALLOCATE", approved_pct: 100.00, expected_matter_version: "${m1v2}" }
              as: CreditArbiter
              as_user_id: "${parb}"
            - call: "GET /comp/partners/${pa}"
              payload: {}
              as: CycleAdmin
              captures: { score_below: "$.data.formula_score_provisional", br_below: "$.data.blended_realization_pct" }
            - call: "GET /comp/matters/${m1}"
              payload: {}
              as: CycleAdmin
              captures: { m1v3: "$.data.version" }
          trigger:
            - call: "POST /comp/matters/${m1}/financials"
              payload: { billed_delta_cents: 0, collected_delta_cents: 1000, direct_cost_delta_cents: 0, expected_matter_version: "${m1v3}" }
              as: CycleAdmin
              captures: { at_realization: "$.data.realization_pct", at_fully_loaded: "$.data.profitability_index_fully_loaded", m1v4: "$.data.version" }
            - call: "GET /comp/partners/${pa}"
              payload: {}
              as: CycleAdmin
              captures: { score_at: "$.data.formula_score_provisional", br_at: "$.data.blended_realization_pct" }
            - call: "POST /comp/matters/${m1}/financials"
              payload: { billed_delta_cents: 0, collected_delta_cents: -1000, direct_cost_delta_cents: 0, expected_matter_version: "${m1v4}" }
              as: CycleAdmin
              captures: { back_realization: "$.data.realization_pct", back_fully_loaded: "$.data.profitability_index_fully_loaded" }
            - call: "GET /comp/partners/${pa}"
              payload: {}
              as: CycleAdmin
              captures: { score_back: "$.data.formula_score_provisional" }
          assert:
            - "${br_below} == 0.9499"
            - "${score_below} == 61.3262"
            - "${at_realization} == 0.9500"
            - "${at_fully_loaded} == 0.7053"
            - "${br_at} == 0.9500"
            - "${score_at} == 67.4610"
            - "${back_realization} == 0.9499"
            - "${back_fully_loaded} == 0.7052"
            - "${score_back} == 61.3262"
            - "Partner.${pa}.normalized_credit_index_provisional == 1.000000 in all three states"
            - "Partner.${parb}.formula_score_provisional == 0.0000 in all three states"

      - name: empty_working_role_folds_whole_quarter_into_originating
        grounds:
          - calculations.credited_collection_split.constants.ROLE_WEIGHT_WORKING
          - calculations.credited_collection_split.edge_cases
          - entities.CreditAllocation.fields.credited_collection_provisional_cents
          - endpoints[POST /comp/credit-claims/{id}/adjudicate]
        distinguishing_aspect: |
          A different metric probed through a different endpoint than
          realization_exactly_at_ninety_five_hundredths_takes_top_tier: the boundary is the
          zero-cardinality edge of the WORKING role's allocation set, probed through
          POST /comp/credit-claims/{id}/adjudicate. With no verified BILLABLE hour on the
          matter, ROLE_WEIGHT_WORKING's whole 0.25 pool must fold into ORIGINATING
          (130000 of 200000, not 80000) and no WORKING row may be created at all, while
          BILLING and RESPONSIBLE keep their untouched 40000 and 30000.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; cycle fiscal_year 2026 in OPEN_INTAKE."
            - "Partner A (FORMULA) is billing and responsible attorney of OPEN Matter M; Partner ARB (is_credit_arbiter) will adjudicate."
            - "M carries billed_cents 200000, collected_cents 200000 and direct_cost_cents 0, so realization_pct is 1.0000 and the PROVISIONAL_ACCRUAL basis is exactly 200000."
            - "Matter.verified_billable_hours is 0.00 and no ContributionRecord exists, so the WORKING role has zero ACTIVE allocations."
            - "A's NEW_CLIENT claim for 100.00 is SUBMITTED and awaits adjudication; before it, no ORIGINATING allocation exists either."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CycleAdmin
            - call: "POST /comp/cycles"
              payload: { fiscal_year: 2026, distributable_pool_cents: 100000000, lockstep_unit_cents: 0, discretionary_pool_pct: 0.2000, draw_pct: 0.8000, claim_deadline_on: "2026-09-30", assessment_deadline_on: "2026-10-31" }
              as: CycleAdmin
              captures: { cy: "$.data.id" }
            - call: "POST /comp/partners"
              payload: { full_name: "Ada Origin", practice_group: "CORPORATE", compensation_model: "FORMULA", admission_year: 2010 }
              as: CycleAdmin
              captures: { pa: "$.data.id" }
            - call: "POST /comp/partners"
              payload: { full_name: "Rex Arbiter", practice_group: "REGULATORY", compensation_model: "FORMULA", admission_year: 2004, is_credit_arbiter: true }
              as: CycleAdmin
              captures: { parb: "$.data.id" }
            - call: "POST /comp/matters"
              payload: { client_key: "CLI-F1", client_display_name: "Fold Fabricators", matter_type: "NEW_CLIENT", practice_group: "CORPORATE", opened_on: "2026-01-15", billing_attorney_id: "${pa}", responsible_attorney_id: "${pa}" }
              as: CycleAdmin
              captures: { m1: "$.data.id", m1v: "$.data.version" }
            - call: "POST /comp/matters/${m1}/financials"
              payload: { billed_delta_cents: 200000, collected_delta_cents: 200000, direct_cost_delta_cents: 0, expected_matter_version: "${m1v}" }
              as: CycleAdmin
            - call: "POST /comp/credit-claims"
              payload: { cycle_id: "${cy}", matter_id: "${m1}", claim_basis: "NEW_CLIENT", requested_pct: 100.00, narrative: "Originated Fold Fabricators alone." }
              as: Partner
              as_user_id: "${pa}"
              captures: { cl1: "$.data.id" }
            - call: "POST /comp/credit-claims/${cl1}/submit"
              payload: {}
              as: Partner
              as_user_id: "${pa}"
            - call: "GET /comp/matters/${m1}"
              payload: {}
              as: CycleAdmin
              captures: { m1v2: "$.data.version", vh: "$.data.verified_billable_hours" }
          trigger:
            - call: "POST /comp/credit-claims/${cl1}/adjudicate"
              payload: { decision: "ALLOCATE", approved_pct: 100.00, expected_matter_version: "${m1v2}" }
              as: CreditArbiter
              as_user_id: "${parb}"
          assert:
            - "${vh} == 0.00"
            - "GET /comp/matters/${m1}/credit-allocations with credit_role=WORKING returns an empty list both before and after the trigger"
            - "the ORIGINATING allocation of ${pa} on ${m1} has credited_collection_provisional_cents == 130000, not 80000"
            - "the BILLING allocation of ${pa} on ${m1} has credited_collection_provisional_cents == 40000"
            - "the RESPONSIBLE allocation of ${pa} on ${m1} has credited_collection_provisional_cents == 30000"
            - "the three ACTIVE allocations sum to exactly 200000"
            - "Partner.${pa}.credited_collection_provisional_cents == 200000"
            - "Matter.${m1}.origination_pct_assigned == 100.00"

      - name: capped_non_billable_hours_exactly_at_diminishing_threshold
        grounds:
          - calculations.non_billable_weighted_points.constants.DIMINISHING_THRESHOLD_HOURS
          - calculations.non_billable_weighted_points.constants.DIMINISHING_FACTOR
          - calculations.non_billable_weighted_points.constants.PRO_BONO_FLOOR_HOURS
          - entities.Partner.fields.non_billable_points
          - endpoints[POST /comp/contribution-records/{id}/verify]
        distinguishing_aspect: |
          A third metric on a third endpoint: capped_total against
          DIMINISHING_THRESHOLD_HOURS 400, probed through
          POST /comp/contribution-records/{id}/verify. capped_total exactly 400 must escape
          the discount (strict > comparison) giving 555.00, and one extra verified
          RECRUITING hour must add only 0.31 rather than its nominal 1.00 weight because
          the discount is computed from the capped average weight 556/401. Pro bono sits at
          60, safely above PRO_BONO_FLOOR_HOURS, so the 0.90 penalty never fires.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; cycle fiscal_year 2026 in OPEN_INTAKE."
            - "Partner P is FORMULA, so MODEL_MULTIPLIER is 1.00 and the model layer cannot mask the discount."
            - "Four NON_BILLABLE ContributionRecords exist for P in this cycle, each in a distinct category so the buffer constraint never applies: FIRM_MANAGEMENT 300.00, PRO_BONO 60.00, TRAINING 40.00 and RECRUITING 1.00."
            - "Only FIRM_MANAGEMENT and PRO_BONO are verified at setup time, so capped_total is 360 and non_billable_points is 525.00 (450 + 75, no discount, no penalty)."
            - "CATEGORY_HOUR_CAP_FIRM_MANAGEMENT is 300, so the 300.00 hours are exactly at their own cap and none are discarded."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CycleAdmin
            - call: "POST /comp/cycles"
              payload: { fiscal_year: 2026, distributable_pool_cents: 100000000, lockstep_unit_cents: 0, discretionary_pool_pct: 0.2000, draw_pct: 0.8000, claim_deadline_on: "2026-09-30", assessment_deadline_on: "2026-10-31" }
              as: CycleAdmin
              captures: { cy: "$.data.id" }
            - call: "POST /comp/partners"
              payload: { full_name: "Nina Nonbillable", practice_group: "REGULATORY", compensation_model: "FORMULA", admission_year: 2014 }
              as: CycleAdmin
              captures: { pp: "$.data.id" }
            - call: "POST /comp/contribution-records"
              payload: { partner_id: "${pp}", cycle_id: "${cy}", kind: "NON_BILLABLE", category: "FIRM_MANAGEMENT", hours: 300.00, service_period_start: "2026-01-01", service_period_end: "2026-06-30" }
              as: CycleAdmin
              captures: { fm: "$.data.id" }
            - call: "POST /comp/contribution-records"
              payload: { partner_id: "${pp}", cycle_id: "${cy}", kind: "NON_BILLABLE", category: "PRO_BONO", hours: 60.00, service_period_start: "2026-01-01", service_period_end: "2026-06-30" }
              as: CycleAdmin
              captures: { pb: "$.data.id" }
            - call: "POST /comp/contribution-records"
              payload: { partner_id: "${pp}", cycle_id: "${cy}", kind: "NON_BILLABLE", category: "TRAINING", hours: 40.00, service_period_start: "2026-01-01", service_period_end: "2026-06-30" }
              as: CycleAdmin
              captures: { tr: "$.data.id" }
            - call: "POST /comp/contribution-records"
              payload: { partner_id: "${pp}", cycle_id: "${cy}", kind: "NON_BILLABLE", category: "RECRUITING", hours: 1.00, service_period_start: "2026-01-01", service_period_end: "2026-06-30" }
              as: CycleAdmin
              captures: { rc: "$.data.id" }
            - call: "POST /comp/contribution-records/${fm}/verify"
              payload: {}
              as: CycleAdmin
            - call: "POST /comp/contribution-records/${pb}/verify"
              payload: {}
              as: CycleAdmin
            - call: "GET /comp/partners/${pp}"
              payload: {}
              as: CycleAdmin
              captures: { nb_below: "$.data.non_billable_points" }
          trigger:
            - call: "POST /comp/contribution-records/${tr}/verify"
              payload: {}
              as: CycleAdmin
            - call: "GET /comp/partners/${pp}"
              payload: {}
              as: CycleAdmin
              captures: { nb_at: "$.data.non_billable_points" }
            - call: "POST /comp/contribution-records/${rc}/verify"
              payload: {}
              as: CycleAdmin
            - call: "GET /comp/partners/${pp}"
              payload: {}
              as: CycleAdmin
              captures: { nb_over: "$.data.non_billable_points" }
          assert:
            - "${nb_below} == 525.00"
            - "${nb_at} == 555.00"
            - "at capped_total exactly 400 no diminishing discount is applied, so ${nb_at} is 450 + 75 + 30 exactly"
            - "${nb_over} == 555.31"
            - "${nb_over} - ${nb_at} == 0.31, not 1.00"
            - "ContributionRecord.${rc}.hours == 1.00 and verified == true"
            - "no 0.90 pro bono penalty is present in any of the three values, since capped PRO_BONO 60 >= PRO_BONO_FLOOR_HOURS 50"

  # =====================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: ballot_cast_requires_subject_assessment_accepted
        grounds:
          - validations[priority=75]
          - errors[ERR_ASSESSMENT_NOT_ACCEPTED]
          - state_machines.CommitteeBallot.PENDING_to_CAST
          - state_machines.SelfAssessment.SUBMITTED_to_ACCEPTED
          - entities.SelfAssessment.fields.state
        distinguishing_aspect: |
          Entity pair (CommitteeBallot, SelfAssessment): a ballot's own state is PENDING and
          legal to cast, yet the write is refused purely because a different entity - the
          subject partner's SelfAssessment - is SUBMITTED rather than ACCEPTED. Two subjects
          identical in every other respect (both DISCRETIONARY, both with two SCORED peer
          reviews, both with a PENDING ballot from the same committee member) diverge only
          on that foreign state, and only the accepted one can be scored.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; cycle fiscal_year 2026 advanced to DELIBERATION."
            - "Partners S1 and S2 are both DISCRETIONARY with evaluation_required true; CM1 is a committee member and REV2 a plain partner, both with evaluation_required false."
            - "Both S1's and S2's SelfAssessments are SUBMITTED with scored_review_count 2 from CM1 and REV2, satisfying the PEER_REVIEW -> DELIBERATION gate."
            - "Only S1's assessment was then accepted; S2's remains SUBMITTED, and since the cycle is past PEER_REVIEW it can never be accepted now."
            - "DELIBERATION therefore created exactly two PENDING ballots, (S1 x CM1) and (S2 x CM1)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CycleAdmin
            - call: "POST /comp/cycles"
              payload: { fiscal_year: 2026, distributable_pool_cents: 100000000, lockstep_unit_cents: 0, discretionary_pool_pct: 0.2000, draw_pct: 0.8000, claim_deadline_on: "2026-09-30", assessment_deadline_on: "2026-10-31" }
              as: CycleAdmin
              captures: { cy: "$.data.id" }
            - call: "POST /comp/partners"
              payload: { full_name: "Sara One", practice_group: "LITIGATION", compensation_model: "DISCRETIONARY", admission_year: 2011 }
              as: CycleAdmin
              captures: { s1: "$.data.id" }
            - call: "POST /comp/partners"
              payload: { full_name: "Sven Two", practice_group: "CORPORATE", compensation_model: "DISCRETIONARY", admission_year: 2012 }
              as: CycleAdmin
              captures: { s2: "$.data.id" }
            - call: "POST /comp/partners"
              payload: { full_name: "Cora Chair", practice_group: "TAX", compensation_model: "FORMULA", admission_year: 2005, is_committee_member: true, evaluation_required: false }
              as: CycleAdmin
              captures: { cm1: "$.data.id" }
            - call: "POST /comp/partners"
              payload: { full_name: "Sam Second", practice_group: "IP", compensation_model: "FORMULA", admission_year: 2013, evaluation_required: false }
              as: CycleAdmin
              captures: { rev2: "$.data.id" }
            - call: "POST /comp/cycles/${cy}/advance"
              payload: { target_state: "SELF_ASSESSMENT" }
              as: CycleAdmin
            - call: "POST /comp/self-assessments"
              payload: { cycle_id: "${cy}", narrative: "S1 origination and firm service summary.", claimed_origination_pct_total: 0.00, claimed_non_billable_hours: 0.00 }
              as: Partner
              as_user_id: "${s1}"
              captures: { sa1: "$.data.id" }
            - call: "POST /comp/self-assessments/${sa1}/submit"
              payload: {}
              as: Partner
              as_user_id: "${s1}"
            - call: "POST /comp/self-assessments"
              payload: { cycle_id: "${cy}", narrative: "S2 origination and firm service summary.", claimed_origination_pct_total: 0.00, claimed_non_billable_hours: 0.00 }
              as: Partner
              as_user_id: "${s2}"
              captures: { sa2: "$.data.id" }
            - call: "POST /comp/self-assessments/${sa2}/submit"
              payload: {}
              as: Partner
              as_user_id: "${s2}"
            - call: "POST /comp/peer-reviews"
              payload: { self_assessment_id: "${sa1}", reviewer_partner_id: "${cm1}" }
              as: CycleAdmin
              captures: { pr1a: "$.data.id" }
            - call: "POST /comp/peer-reviews"
              payload: { self_assessment_id: "${sa1}", reviewer_partner_id: "${rev2}" }
              as: CycleAdmin
              captures: { pr1b: "$.data.id" }
            - call: "POST /comp/peer-reviews"
              payload: { self_assessment_id: "${sa2}", reviewer_partner_id: "${cm1}" }
              as: CycleAdmin
              captures: { pr2a: "$.data.id" }
            - call: "POST /comp/peer-reviews"
              payload: { self_assessment_id: "${sa2}", reviewer_partner_id: "${rev2}" }
              as: CycleAdmin
              captures: { pr2b: "$.data.id" }
            - call: "POST /comp/peer-reviews/${pr1a}/decide"
              payload: { outcome: "SCORE", technical_score: 4, collaboration_score: 4, client_service_score: 4, comment: "Strong across the board." }
              as: Partner
              as_user_id: "${cm1}"
            - call: "POST /comp/peer-reviews/${pr1b}/decide"
              payload: { outcome: "SCORE", technical_score: 4, collaboration_score: 4, client_service_score: 4, comment: "Agree with the first reviewer." }
              as: Partner
              as_user_id: "${rev2}"
            - call: "POST /comp/peer-reviews/${pr2a}/decide"
              payload: { outcome: "SCORE", technical_score: 4, collaboration_score: 4, client_service_score: 4, comment: "Solid year." }
              as: Partner
              as_user_id: "${cm1}"
            - call: "POST /comp/peer-reviews/${pr2b}/decide"
              payload: { outcome: "SCORE", technical_score: 4, collaboration_score: 4, client_service_score: 4, comment: "No concerns." }
              as: Partner
              as_user_id: "${rev2}"
            - call: "POST /comp/self-assessments/${sa1}/review-decision"
              payload: { decision: "ACCEPT" }
              as: CommitteeMember
              as_user_id: "${cm1}"
            - call: "POST /comp/cycles/${cy}/advance"
              payload: { target_state: "PEER_REVIEW" }
              as: CycleAdmin
            - call: "POST /comp/cycles/${cy}/advance"
              payload: { target_state: "DELIBERATION" }
              as: CycleAdmin
            - call: "GET /comp/ballots"
              payload: { subject_partner_id: "${s2}", committee_member_id: "${cm1}" }
              as: CycleAdmin
              captures: { b2: "$.data[0].id" }
            - call: "GET /comp/ballots"
              payload: { subject_partner_id: "${s1}", committee_member_id: "${cm1}" }
              as: CycleAdmin
              captures: { b1: "$.data[0].id" }
            - call: "GET /comp/cycles/${cy}"
              payload: {}
              as: CycleAdmin
              captures: { cyv: "$.data.version" }
          trigger:
            - call: "POST /comp/ballots/${b2}/cast"
              payload: { action: "CAST", points_proposed: 500.00, rationale: "Deserves a mid-band award.", expected_cycle_version: "${cyv}" }
              as: CommitteeMember
              as_user_id: "${cm1}"
              captures: { err_dep: "$.data.error_id" }
            - call: "POST /comp/ballots/${b1}/cast"
              payload: { action: "CAST", points_proposed: 500.00, rationale: "Deserves a mid-band award.", expected_cycle_version: "${cyv}" }
              as: CommitteeMember
              as_user_id: "${cm1}"
          assert:
            - "${err_dep} == ERR_ASSESSMENT_NOT_ACCEPTED with HTTP 409"
            - "SelfAssessment.${sa2}.state == SUBMITTED and SelfAssessment.${sa2}.scored_review_count == 2"
            - "CommitteeBallot.${b2}.state == PENDING after the refused cast, proving the ballot's own state was never the obstacle"
            - "SelfAssessment.${sa1}.state == ACCEPTED"
            - "the second cast returns HTTP 200 and CommitteeBallot.${b1}.state == CAST with points_proposed 500.00"
            - "CompensationCycle.${cy}.state == DELIBERATION throughout"
            - "advancing to AWARDS_PUBLISHED now fails with ERR_QUORUM_NOT_MET, since QUORUM_MIN_CAST_BALLOTS is 2 and only one ballot was cast"

      - name: billable_record_requires_matter_open
        grounds:
          - validations[priority=75]
          - errors[ERR_MATTER_NOT_OPEN]
          - state_machines.Matter.OPEN_to_CLOSED
          - endpoints[POST /comp/contribution-records]
          - entities.ContributionRecord.fields.kind
        distinguishing_aspect: |
          A different entity pair from ballot_cast_requires_subject_assessment_accepted:
          (ContributionRecord, Matter). The dependency is conditional on the child's own
          kind - a BILLABLE row is refused against a CLOSED Matter while a NON_BILLABLE row
          referencing that same CLOSED Matter is accepted - so a naive implementation that
          gates the whole endpoint on matter state, or one that gates nothing, both fail.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; cycle fiscal_year 2026 in OPEN_INTAKE."
            - "Partner P (FORMULA) is billing and responsible attorney of two matters: MC, moved OPEN -> CLOSED, and MO, still OPEN."
            - "Both matters carry billed_cents 500000 and collected_cents 500000 so that closing MC is legal."
            - "No ContributionRecord exists for P yet."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CycleAdmin
            - call: "POST /comp/cycles"
              payload: { fiscal_year: 2026, distributable_pool_cents: 100000000, lockstep_unit_cents: 0, discretionary_pool_pct: 0.2000, draw_pct: 0.8000, claim_deadline_on: "2026-09-30", assessment_deadline_on: "2026-10-31" }
              as: CycleAdmin
              captures: { cy: "$.data.id" }
            - call: "POST /comp/partners"
              payload: { full_name: "Pia Poster", practice_group: "LITIGATION", compensation_model: "FORMULA", admission_year: 2015 }
              as: CycleAdmin
              captures: { pp: "$.data.id" }
            - call: "POST /comp/matters"
              payload: { client_key: "CLI-C1", client_display_name: "Closed Co", matter_type: "EXISTING", practice_group: "LITIGATION", opened_on: "2026-01-05", billing_attorney_id: "${pp}", responsible_attorney_id: "${pp}" }
              as: CycleAdmin
              captures: { mc: "$.data.id", mcv: "$.data.version" }
            - call: "POST /comp/matters/${mc}/financials"
              payload: { billed_delta_cents: 500000, collected_delta_cents: 500000, direct_cost_delta_cents: 0, expected_matter_version: "${mcv}" }
              as: CycleAdmin
            - call: "POST /comp/matters"
              payload: { client_key: "CLI-O1", client_display_name: "Open Co", matter_type: "EXISTING", practice_group: "LITIGATION", opened_on: "2026-02-05", billing_attorney_id: "${pp}", responsible_attorney_id: "${pp}" }
              as: CycleAdmin
              captures: { mo: "$.data.id", mov: "$.data.version" }
            - call: "POST /comp/matters/${mo}/financials"
              payload: { billed_delta_cents: 500000, collected_delta_cents: 500000, direct_cost_delta_cents: 0, expected_matter_version: "${mov}" }
              as: CycleAdmin
            - call: "POST /comp/matters/${mc}/status"
              payload: { target_state: "CLOSED" }
              as: CycleAdmin
          trigger:
            - call: "POST /comp/contribution-records"
              payload: { partner_id: "${pp}", cycle_id: "${cy}", matter_id: "${mc}", kind: "BILLABLE", category: "CLIENT_WORK", hours: 10.00, standard_rate_cents: 50000, service_period_start: "2026-03-01", service_period_end: "2026-03-31" }
              as: CycleAdmin
              captures: { err_closed: "$.data.error_id" }
            - call: "POST /comp/contribution-records"
              payload: { partner_id: "${pp}", cycle_id: "${cy}", matter_id: "${mo}", kind: "BILLABLE", category: "CLIENT_WORK", hours: 10.00, standard_rate_cents: 50000, service_period_start: "2026-03-01", service_period_end: "2026-03-31" }
              as: CycleAdmin
              captures: { ok_id: "$.data.id" }
            - call: "POST /comp/contribution-records"
              payload: { partner_id: "${pp}", cycle_id: "${cy}", matter_id: "${mc}", kind: "NON_BILLABLE", category: "FIRM_MANAGEMENT", hours: 10.00, service_period_start: "2026-05-01", service_period_end: "2026-05-31" }
              as: CycleAdmin
              captures: { nb_id: "$.data.id" }
          assert:
            - "${err_closed} == ERR_MATTER_NOT_OPEN with HTTP 409"
            - "Matter.${mc}.state == CLOSED and Matter.${mo}.state == OPEN"
            - "no ContributionRecord with matter_id ${mc} and kind BILLABLE exists after the refused call"
            - "the second call returns HTTP 201 and ContributionRecord.${ok_id}.standard_value_cents == 500000"
            - "the third call returns HTTP 201, so ContributionRecord.${nb_id} references the CLOSED matter ${mc} legally with standard_value_cents 0"
            - "Matter.${mc}.verified_billable_hours == 0.00 and Matter.${mo}.verified_billable_hours == 0.00, since neither new row is verified yet"

      - name: transition_effectuate_requires_successor_active
        grounds:
          - validations[priority=75]
          - errors[ERR_SUCCESSOR_NOT_ELIGIBLE]
          - state_machines.CreditTransition.PROPOSED_to_EFFECTIVE
          - state_machines.Partner.ACTIVE_to_NOTICE_GIVEN
          - endpoints[POST /comp/credit-transitions/{id}/effectuate]
          - concurrency_rules[transition-effectuate-stale-matter]
