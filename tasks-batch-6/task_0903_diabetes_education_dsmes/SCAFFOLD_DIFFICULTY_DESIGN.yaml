            - { call: "POST /dsmes/enrollments", payload: { referral_id: "${cib_ref}", curriculum_id: "${cib_cur}" }, as: ProgramCoordinator, captures: { cib_enr: "$.data.id" } }
            - { call: "POST /dsmes/enrollments/${cib_enr}/activate", payload: {}, as: ProgramCoordinator }
            - { call: "POST /dsmes/group-classes", payload: { curriculum_id: "${cib_cur}", dietitian_id: "${cib_die}", room_id: "ROOM-2", scheduled_start: "2026-05-22T13:00:00Z", scheduled_end: "2026-05-22T14:00:00Z", capacity: 3, topic: "Meal Planning" }, as: ProgramCoordinator, captures: { cib_gc: "$.data.id", cib_gcv1: "$.data.version" } }
            - { call: "POST /dsmes/group-classes/${cib_gc}/sessions", payload: { enrollment_id: "${cib_enr}", expected_group_class_version: "${cib_gcv1}" }, as: Dietitian, as_user_id: "${cib_die}", captures: { cib_seat: "$.data.id" } }
