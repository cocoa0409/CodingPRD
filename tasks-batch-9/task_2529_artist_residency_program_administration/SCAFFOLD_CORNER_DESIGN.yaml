      - name: the_officer_who_scheduled_cannot_pay_and_the_payer_cannot_reverse
        claim_type: segregation_of_duties
        grounds: ["validations[priority 59]", "errors[ERR_SEGREGATION_OF_DUTIES]", "state_machines.StipendDisbursement[SCHEDULED -> PAID]", "state_machines.StipendDisbursement[PAID -> REVERSED]"]
        distinguishing_aspect: "Two independent user-identity bars sit on one endpoint, each reading a DIFFERENT recorded operator id: PAY compares the actor against scheduled_by_user_id and REVERSE compares them against paid_by_user_id. So the officer barred from paying is allowed to reverse, and the officer who paid is barred from reversing - a single 'not the same user' check on one field satisfies one leg and breaks the other."
        test_recipe:
          setup: ["A US resident's 8-week residency (weekly rate 70000, four periods of 140000) whose stipend schedule was generated by FinanceOfficer fin-01. The resident is trained, CLEARED and checked in on 2026-11-02."]
          setup_api_calls:
            - call: "POST /cycles"
              payload: { code: "CY-2027", open_at: "2026-08-01T00:00:00Z", close_at: "2026-09-30T00:00:00Z",
                         application_fee_cents: 5000, panel_quorum: 2, cohort_target_size: 10,
                         alumni_reserve_pct: 0.25, stipend_pool_cents: 20000000, slate_min_score: 60.00,
                         stipend_weekly_rate_cents: 70000, session_length_options_weeks: [4, 5, 8, 9] }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { cyc: "$.data.id" }
            - call: "POST /disciplines"
              payload: { cycle_id: "${cyc}", code: "SCULPT", name: "Sculpture", portfolio_min_items: 1,
                         portfolio_max_items: 6, required_media_types: ["IMAGE"], requires_hazmat_review: false,
                         cohort_min_slots: 1, cohort_max_slots: 6, required_capability_tags: ["WELDING"],
                         required_ventilation_class: "LOCAL" }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { disc: "$.data.id" }
            - call: "POST /applicants"
              payload: { full_name: "Ada Rivet", email: "ada.rivet@example.org",
                         affiliation_org: "North Shore Collective", citizenship_country: "US",
                         treaty_country: false, declared_annual_income_cents: 2000000 }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { art: "$.data.id" }
            - call: "POST /cycles/${cyc}/stage"
              payload: { to_status: "OPEN" }
              as: ProgramAdmin
              as_user_id: "admin-01"
            - call: "POST /residencies"
              payload: { cycle_id: "${cyc}", applicant_id: "${art}", discipline_id: "${disc}" }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { res: "$.data.id" }
            - call: "POST /residencies/${res}/schedule"
              payload: { session_start_date: "2026-11-02", session_length_weeks: 8 }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { res_v: "$.data.version" }
            - call: "POST /residencies/${res}/stipend-schedule"
              payload: { expected_residency_version: "${res_v}" }
              as: FinanceOfficer
              as_user_id: "fin-01"
            - call: "POST /residencies/${res}/trainings"
              payload: { training_type: "SAFETY_ORIENTATION" }
              as: FacilitiesManager
              as_user_id: "fac-01"
            - call: "POST /residencies/${res}/trainings"
              payload: { training_type: "EQUIPMENT_WELDING" }
              as: FacilitiesManager
              as_user_id: "fac-01"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-11-02T09:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-01"
            - call: "POST /residencies/${res}/lifecycle"
              payload: { action: "CHECK_IN" }
              as: ProgramAdmin
              as_user_id: "admin-01"
            - call: "GET /stipend-disbursements"
              payload: { residency_id: "${res}", period_index: 1 }
              as: FinanceOfficer
              as_user_id: "fin-03"
              captures: { d1: "$.data[0].id", d1_v0: "$.data[0].version" }
          trigger:
            - call: "POST /stipend-disbursements/${d1}/settlement"
              payload: { action: "PAY", paid_on_date: "2026-11-16" }
              as: FinanceOfficer
              as_user_id: "fin-01"
              captures: { err: "$.data.error_id" }
          assert:
            - "the scheduler cannot pay their own schedule: 403 ERR_SEGREGATION_OF_DUTIES, with the row still 'SCHEDULED', version ${d1_v0} and Residency.stipend_paid_gross_cents 0"
            - "the bar reads the recorded operator id: the row carries scheduled_by_user_id 'fin-01', which is exactly the acting X-User-ID that was refused"
            - "a different officer may pay: the identical call as fin-02 returns 200 with status 'PAID', paid_by_user_id 'fin-02', gross_cents 140000, withholding_cents 0 (W9) and net_cents 140000"
            - "the second bar reads a DIFFERENT field: REVERSE as fin-02 returns 403 ERR_SEGREGATION_OF_DUTIES because fin-02 is the paid_by_user_id, while REVERSE as fin-01 - barred from paying this very row - returns 200"
            - "the reversal compensates exactly: after the fin-01 reversal, Residency.stipend_paid_gross_cents is back to 0 and withholding_to_date_cents back to 0, while the row keeps gross_cents 140000 for tax history with status 'REVERSED'"
            - "the two bars are per row, not per residency: fin-01 may pay period 2 only if period 2 was scheduled by someone else - and since the whole schedule was generated by fin-01 in one call, every row of it is closed to fin-01 for payment"
            - "regenerating the schedule under a different officer moves the bar with it: after the residency is rescheduled and the schedule regenerated by fin-02, fin-01 may pay period 1 and fin-02 may not"
            - "VOID carries no identity bar at all: fin-01 voiding a row it scheduled returns 200, so the segregation applies only to the two money-moving actions the rule names"

  # ===================================================================================
  # From Cross-Cutting Complexity Layers
  # ===================================================================================
  - section: cross_cutting_complexity_layers
    instances:

      - name: studio_assignment_rejects_a_residency_version_that_moved_under_it
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[studio-assignment-create-stale-residency]", "errors[ERR_STALE_VERSION]", "endpoints[POST /studio-assignments]", "validations[priority 13]"]
        distinguishing_aspect: "The guarded entity is not the one being created: the caller sends expected_residency_version while creating a StudioAssignment, so the check protects a facility booking against a residency that was rescheduled or re-trained between read and write. The version must be compared against the LIVE Residency, and any write on that residency - including a training record on the compliance axis - must invalidate a held token."
        test_recipe:
          setup: ["A scheduled 8-week residency (2026-11-02 .. 2026-12-27) whose version was captured immediately after scheduling, then bumped by an unrelated training record. One eligible studio S-A (WELDING, LOCAL, one resident at a time)."]
          setup_api_calls:
            - call: "POST /cycles"
              payload: { code: "CY-2027", open_at: "2026-08-01T00:00:00Z", close_at: "2026-09-30T00:00:00Z",
                         application_fee_cents: 5000, panel_quorum: 2, cohort_target_size: 10,
                         alumni_reserve_pct: 0.25, stipend_pool_cents: 20000000, slate_min_score: 60.00,
                         stipend_weekly_rate_cents: 70000, session_length_options_weeks: [4, 5, 8, 9] }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { cyc: "$.data.id" }
            - call: "POST /disciplines"
              payload: { cycle_id: "${cyc}", code: "SCULPT", name: "Sculpture", portfolio_min_items: 1,
                         portfolio_max_items: 6, required_media_types: ["IMAGE"], requires_hazmat_review: false,
                         cohort_min_slots: 1, cohort_max_slots: 6, required_capability_tags: ["WELDING"],
                         required_ventilation_class: "LOCAL" }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { disc: "$.data.id" }
            - call: "POST /applicants"
              payload: { full_name: "Ada Rivet", email: "ada.rivet@example.org",
                         affiliation_org: "North Shore Collective", citizenship_country: "US",
                         treaty_country: false, declared_annual_income_cents: 2000000 }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { art: "$.data.id" }
            - call: "POST /cycles/${cyc}/stage"
              payload: { to_status: "OPEN" }
              as: ProgramAdmin
              as_user_id: "admin-01"
            - call: "POST /residencies"
              payload: { cycle_id: "${cyc}", applicant_id: "${art}", discipline_id: "${disc}" }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { res: "$.data.id" }
            - call: "POST /residencies/${res}/schedule"
              payload: { session_start_date: "2026-11-02", session_length_weeks: 8 }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { res_v0: "$.data.version" }
            - call: "POST /studios"
              payload: { code: "S-A", capability_tags: ["WELDING"], ventilation_class: "LOCAL", max_concurrent_residents: 1, status: "AVAILABLE" }
              as: FacilitiesManager
              as_user_id: "fac-01"
              captures: { s_a: "$.data.id" }
            - call: "POST /residencies/${res}/trainings"
              payload: { training_type: "SAFETY_ORIENTATION" }
              as: FacilitiesManager
              as_user_id: "fac-01"
              captures: { res_v1: "$.data.version" }
          trigger:
            - call: "POST /studio-assignments"
              payload: { residency_id: "${res}", start_date: "2026-11-02", end_date: "2026-12-27", expected_residency_version: "${res_v0}" }
              as: FacilitiesManager
              as_user_id: "fac-01"
              captures: { err: "$.data.error_id" }
          assert:
            - "the stale token is refused: 412 ERR_STALE_VERSION, and the request was otherwise entirely valid"
            - "any write on the guarded entity invalidates the token, not just a reschedule: ${res_v1} == ${res_v0} + 1 after a training record on the other state axis"
            - "the refusal wrote nothing: GET /studio-assignments?residency_id=${res} returns total_count == 0 and GET /studios/${s_a} reads active_assignment_count 0 and reserved_resident_days 0"
            - "the current token succeeds: repeating the identical call with expected_residency_version ${res_v1} returns 201 with selection_mode 'AUTO' and studio_id ${s_a}"
            - "the successful write moved the guard again: Residency.version is now ${res_v1} + 1, so a second create replaying ${res_v1} returns 412 - which is exactly the double-booking case the rule exists for"
            - "the version check runs at the declared priority: with BOTH a stale version and an ineligible explicit studio_id (no WELDING capability), the response is 412 ERR_STALE_VERSION, because P13 sits above the facility checks at P36 and P37"
            - "an absent token is a shape error, not a conflict: omitting expected_residency_version returns 400 ERR_VALIDATION"

      - name: housing_assignment_rejects_a_unit_version_that_moved_under_it
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[housing-assignment-create-stale-unit]", "errors[ERR_STALE_VERSION]", "endpoints[POST /housing-assignments]", "entities.HousingUnit.version"]
        distinguishing_aspect: "This rule guards the SHARED RESOURCE rather than the residency: two coordinators racing for the same bed both hold the unit's version, and the loser must be told 412 rather than being allowed to overfill the unit. The unit's own occupancy counters are what change under the caller, so a successful booking by anyone else must invalidate every outstanding token on that unit."
        test_recipe:
          setup: ["A scheduled 8-week residency (2026-11-02 .. 2026-12-27) and a single-bed housing unit H-01 whose version was captured at creation and then bumped by a facilities PATCH."]
          setup_api_calls:
            - call: "POST /cycles"
              payload: { code: "CY-2027", open_at: "2026-08-01T00:00:00Z", close_at: "2026-09-30T00:00:00Z",
                         application_fee_cents: 5000, panel_quorum: 2, cohort_target_size: 10,
                         alumni_reserve_pct: 0.25, stipend_pool_cents: 20000000, slate_min_score: 60.00,
                         stipend_weekly_rate_cents: 70000, session_length_options_weeks: [4, 5, 8, 9] }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { cyc: "$.data.id" }
            - call: "POST /disciplines"
              payload: { cycle_id: "${cyc}", code: "SCULPT", name: "Sculpture", portfolio_min_items: 1,
                         portfolio_max_items: 6, required_media_types: ["IMAGE"], requires_hazmat_review: false,
                         cohort_min_slots: 1, cohort_max_slots: 6, required_capability_tags: ["WELDING"],
                         required_ventilation_class: "LOCAL" }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { disc: "$.data.id" }
            - call: "POST /applicants"
              payload: { full_name: "Ada Rivet", email: "ada.rivet@example.org",
                         affiliation_org: "North Shore Collective", citizenship_country: "US",
                         treaty_country: false, declared_annual_income_cents: 2000000 }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { art: "$.data.id" }
            - call: "POST /cycles/${cyc}/stage"
              payload: { to_status: "OPEN" }
              as: ProgramAdmin
              as_user_id: "admin-01"
            - call: "POST /residencies"
              payload: { cycle_id: "${cyc}", applicant_id: "${art}", discipline_id: "${disc}" }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { res: "$.data.id" }
            - call: "POST /residencies/${res}/schedule"
              payload: { session_start_date: "2026-11-02", session_length_weeks: 8 }
              as: ProgramAdmin
              as_user_id: "admin-01"
            - call: "POST /housing-units"
              payload: { code: "H-01", bed_count: 1, meal_plan_included: true, accessibility_features: ["STEP_FREE"], status: "AVAILABLE" }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { hu: "$.data.id", hu_v0: "$.data.version" }
            - call: "PATCH /housing-units/${hu}"
              payload: { accessibility_features: ["STEP_FREE", "ROLL_IN_SHOWER"] }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { hu_v1: "$.data.version" }
          trigger:
            - call: "POST /housing-assignments"
              payload: { housing_unit_id: "${hu}", residency_id: "${res}", check_in_date: "2026-11-02", check_out_date: "2026-12-28", expected_housing_unit_version: "${hu_v0}", meal_plan_selected: true }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { err: "$.data.error_id" }
          assert:
            - "the stale unit token is refused: 412 ERR_STALE_VERSION, with ${hu_v1} == ${hu_v0} + 1 proving the PATCH moved the guard"
            - "nothing was booked: GET /housing-units/${hu} reads occupied_bed_nights 0 and active_assignment_count 0, and GET /housing-assignments?housing_unit_id=${hu} returns total_count == 0"
            - "the current token succeeds: the identical call with expected_housing_unit_version ${hu_v1} returns 201 with bed_nights 56 and meal_plan_selected true"
            - "a successful booking invalidates every outstanding token on the unit: a second create for another residency replaying ${hu_v1} returns 412 ERR_STALE_VERSION - the race is lost on the version, before the single-bed interval rule at P47 is ever consulted"
            - "the guarded entity is the unit, not the residency: rescheduling the residency (which bumps Residency.version) does NOT invalidate a freshly read expected_housing_unit_version, and the create still returns 201"
            - "each unit carries its own counter: a token read from H-02 cannot be used against H-01 - the request returns 412 unless the number happens to match, so the test uses units at deliberately different versions"
            - "the release path is not version-guarded: POST /housing-assignments/{id}/release takes no expected version and succeeds regardless of the unit's current version, while still bumping it"

      - name: stipend_schedule_generation_rejects_a_residency_version_that_moved_under_it
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[stipend-schedule-create-stale-residency]", "errors[ERR_STALE_VERSION]", "endpoints[POST /residencies/{id}/stipend-schedule]", "calculations.stipend_period_split"]
        distinguishing_aspect: "Here the token protects a MONEY DERIVATION against the very field it derives from: the period count and the per-period amount come from the residency's session length, so a reschedule between read and write would silently produce a schedule for the wrong session. The guard therefore has to fire on the exact write - a reschedule - that would change the answer, and a regeneration must be forced to re-read."
        test_recipe:
          setup: ["A scheduled residency at 8 weeks whose version was captured at scheduling time, then rescheduled to 4 weeks so the captured token is one behind and the correct answer has changed from four periods of 140000 to two."]
          setup_api_calls:
            - call: "POST /cycles"
              payload: { code: "CY-2027", open_at: "2026-08-01T00:00:00Z", close_at: "2026-09-30T00:00:00Z",
