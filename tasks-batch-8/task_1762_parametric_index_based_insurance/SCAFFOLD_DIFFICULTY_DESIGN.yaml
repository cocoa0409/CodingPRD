            - "No PayoutClaim exists for the policy (claims array empty) — claim lifecycle is unreachable while the event never reaches VERIFIED"
            - "TriggerEvent.${ev_id}.status == UNDER_REVIEW (failed verify leaves state unchanged)"

  # ---------------------------------------------------------------------------
  # Rule 8 — resource_temporal_overlap (different interval semantics, different resources)
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: trigger_event_uniqueness_per_index_window
        grounds:
          - entities.TriggerEvent.fields.window_end_date
          - calculations.blended_index_value
        distinguishing_aspect: |
          Interval semantics of the aggregation-window occupation on the
          IndexDefinition resource: at most one TriggerEvent per
          (index, window_end_date) — posting two DIFFERENT stations' observations
          for the same window must NOT mint a second event; the second reading
          joins the first's blend. This is point-window identity semantics
          (same window_end_date collides), distinct from range-overlap semantics.
        test_recipe:
          setup:
            - "Program ACTIVE, index BELOW t1<=50/0.25 STATION_PRIMARY, two PHYSICAL stations ST-1 (w=1.0) and ST-2 (w=0.5)"
            - "Holder ACTIVE, policy si 2,000,000 BOUND"
            - "Observation ST-1 2026-06-30 value 40 -> event DETECTED"
          setup_api_calls:
            - call: "POST /programs"
              payload: { program_code: "PRG-TO1", peril_type: "RAINFALL_DEFICIT", regulatory_classification: "ADMITTED_INSURANCE", contract_wording_version: "CW-O1", exposure_limit_cents: 100000000 }
              as: ProgramManager
              captures: { prog_id: $.data.id }
            - call: "POST /programs/${prog_id}/stations"
              payload: { station_code: "ST-1", station_kind: "PHYSICAL_STATION", reliability_weight: 1.0 }
              as: DataOperations
              captures: { st1_id: $.data.id }
            - call: "POST /programs/${prog_id}/stations"
              payload: { station_code: "ST-2", station_kind: "PHYSICAL_STATION", reliability_weight: 0.5 }
              as: DataOperations
              captures: { st2_id: $.data.id }
            - call: "POST /programs/${prog_id}/index-definitions"
              payload: { index_code: "IDX-TO1", measurement_unit: "mm", aggregation_window_days: 30, data_source_agreement_ref: "DSA-TO1", source_priority_mode: "STATION_PRIMARY", trigger_thresholds: [ { tier: 1, threshold_value: 50, payout_fraction: 0.25 } ], strike_direction: "BELOW", historical_breach_frequency: 0.2, expected_loss_ratio: 0.6 }
              as: Actuary
              captures: { idx_id: $.data.id }
            - call: "POST /programs/${prog_id}/index-definitions/${idx_id}/activate"
              payload: {}
              as: Actuary
            - call: "POST /programs/${prog_id}/activate"
              payload: {}
              as: ProgramManager
            - call: "POST /programs/${prog_id}/policyholders"
              payload: { legal_name: "H-TO1", tax_id: "T-TO1", basis_risk_disclosure_acknowledged: true }
              as: ServicingAgent
              captures: { holder_id: $.data.id }
            - call: "POST /programs/${prog_id}/policyholders/${holder_id}/policies"
              payload: { index_definition_id: "${idx_id}", sum_insured_cents: 2000000, policy_start_date: "2026-01-01", policy_end_date: "2026-12-31" }
              as: Underwriter
              captures: { pol_id: $.data.id }
            - call: "GET /programs/${prog_id}/invoices"
              payload: { policy_id: "${pol_id}" }
              as: ServicingAgent
              captures: { inv_id: "$.data[0].id" }
            - call: "POST /programs/${prog_id}/invoices/${inv_id}/payments"
              payload: { amount_cents: 306000 }
              as: ServicingAgent
            - call: "POST /programs/${prog_id}/policyholders/${holder_id}/policies/${pol_id}/bind"
              payload: {}
              as: Underwriter
            - call: "POST /programs/${prog_id}/index-definitions/${idx_id}/observations"
              payload: { station_id: "${st1_id}", window_end_date: "2026-06-30", measured_value: 40 }
              as: DataOperations
          trigger:
            - call: "POST /programs/${prog_id}/index-definitions/${idx_id}/observations"
              payload: { station_id: "${st2_id}", window_end_date: "2026-06-30", measured_value: 45 }
              as: DataOperations
            - call: "GET /programs/${prog_id}/trigger-events"
              payload: { index_definition_id: "${idx_id}" }
              as: ClaimsAdjuster
              captures: { ev_id: "$.data[0].id" }
            - call: "POST /programs/${prog_id}/index-definitions/${idx_id}/trigger-events/${ev_id}/open-review"
              payload: {}
              as: ClaimsAdjuster
            - call: "POST /programs/${prog_id}/index-definitions/${idx_id}/trigger-events/${ev_id}/verify"
              payload: {}
              as: ClaimsAdjuster
              captures: { blend_val: $.data.blended_index_value }
            - call: "GET /programs/${prog_id}/trigger-events"
              payload: { index_definition_id: "${idx_id}" }
              as: ClaimsAdjuster
          assert:
            - "Exactly 1 TriggerEvent exists for (index, 2026-06-30) after both observations (window occupation is singular)"
            - "verified blended_index_value (${blend_val}) == 41.6667 (rhu((40*1.0 + 45*0.5)/1.5, 4dp)) — second station folded into the SAME event's blend"

      - name: observation_duplicate_window_rejected_requires_supersede
        grounds:
          - validations[priority=9]
          - entities.IndexObservation.fields.supersedes_observation_id
        distinguishing_aspect: |
          Different interval semantics on a different resource: IndexObservation
          enforces half-open revision semantics per (station, window_end_date) —
          a second reading for the SAME station+window without
          supersedes_observation_id collides (ERR_DUPLICATE_OBSERVATION), while
          the same window on a DIFFERENT station does not collide (per-station
          occupation) — adjacency here is keyed identity, not range overlap.
        test_recipe:
          setup:
            - "Program ACTIVE, index ACTIVE BELOW t1<=50/0.25, PHYSICAL stations ST-1 and ST-2 COMMISSIONED"
            - "Observation ST-1 2026-06-30 value 40 exists (event created or not — irrelevant)"
          setup_api_calls:
            - call: "POST /programs"
              payload: { program_code: "PRG-TO2", peril_type: "RAINFALL_DEFICIT", regulatory_classification: "ADMITTED_INSURANCE", contract_wording_version: "CW-O2", exposure_limit_cents: 100000000 }
              as: ProgramManager
              captures: { prog_id: $.data.id }
            - call: "POST /programs/${prog_id}/stations"
              payload: { station_code: "ST-1", station_kind: "PHYSICAL_STATION", reliability_weight: 1.0 }
              as: DataOperations
              captures: { st1_id: $.data.id }
            - call: "POST /programs/${prog_id}/stations"
              payload: { station_code: "ST-2", station_kind: "PHYSICAL_STATION", reliability_weight: 0.5 }
              as: DataOperations
              captures: { st2_id: $.data.id }
            - call: "POST /programs/${prog_id}/index-definitions"
              payload: { index_code: "IDX-TO2", measurement_unit: "mm", aggregation_window_days: 30, data_source_agreement_ref: "DSA-TO2", source_priority_mode: "STATION_PRIMARY", trigger_thresholds: [ { tier: 1, threshold_value: 50, payout_fraction: 0.25 } ], strike_direction: "BELOW", historical_breach_frequency: 0.2, expected_loss_ratio: 0.6 }
              as: Actuary
              captures: { idx_id: $.data.id }
            - call: "POST /programs/${prog_id}/index-definitions/${idx_id}/activate"
              payload: {}
              as: Actuary
            - call: "POST /programs/${prog_id}/activate"
              payload: {}
              as: ProgramManager
            - call: "POST /programs/${prog_id}/index-definitions/${idx_id}/observations"
              payload: { station_id: "${st1_id}", window_end_date: "2026-06-30", measured_value: 40 }
              as: DataOperations
              captures: { obs1_id: $.data.id }
          trigger:
            - call: "POST /programs/${prog_id}/index-definitions/${idx_id}/observations"
              payload: { station_id: "${st1_id}", window_end_date: "2026-06-30", measured_value: 55 }
              as: DataOperations
              captures: { dup_err: $.data.error_id }
            - call: "POST /programs/${prog_id}/index-definitions/${idx_id}/observations"
              payload: { station_id: "${st2_id}", window_end_date: "2026-06-30", measured_value: 55 }
              as: DataOperations
              captures: { obs2_id: $.data.id }
            - call: "POST /programs/${prog_id}/index-definitions/${idx_id}/observations"
              payload: { station_id: "${st1_id}", window_end_date: "2026-06-30", measured_value: 60, supersedes_observation_id: "${obs1_id}" }
              as: DataOperations
              captures: { obs3_id: $.data.id }
          assert:
            - "Second reading same station+window without supersede -> error (${dup_err}) == ERR_DUPLICATE_OBSERVATION, HTTP 409"
            - "Same window different station accepted: observation ${obs2_id} created (per-station occupation semantics)"
            - "Revision with supersedes_observation_id accepted: ${obs3_id} created; observation ${obs1_id}.is_effective == false on re-read"

  # ---------------------------------------------------------------------------
  # Rule 9 — compensating_invariant (different conserved quantities)
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: invoice_payment_conservation_partial_plus_final_equals_total
        grounds:
          - state_machines.PremiumInvoice
          - entities.PremiumInvoice.fields.amount_paid_cents
        distinguishing_aspect: |
          Conserved quantity: invoice_amount_cents. Forward action payments
          (200,000 then 106,000) MUST satisfy amount_paid_cents ==
          sum(payments) at every step and terminate exactly at
          invoice_amount_cents == premium_cents + premium_tax_cents (306,000)
          with zero drift; an overpaying third payment is rejected, conserving
          the invariant amount_paid_cents <= invoice_amount_cents.
        test_recipe:
          setup:
            - "Program ACTIVE ADMITTED, index ACTIVE freq 0.20 elr 0.60, holder ACTIVE"
            - "Policy si 2,000,000 quoted -> invoice 306,000 ISSUED"
          setup_api_calls:
            - call: "POST /programs"
              payload: { program_code: "PRG-CI1", peril_type: "RAINFALL_DEFICIT", regulatory_classification: "ADMITTED_INSURANCE", contract_wording_version: "CW-C1", exposure_limit_cents: 100000000 }
              as: ProgramManager
              captures: { prog_id: $.data.id }
            - call: "POST /programs/${prog_id}/stations"
              payload: { station_code: "ST-C1", station_kind: "PHYSICAL_STATION", reliability_weight: 1.0 }
              as: DataOperations
            - call: "POST /programs/${prog_id}/index-definitions"
