              as: DispatchCoordinator
              as_user_id: "${dc_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_STALE_LEAK_VERSION"
            - "HTTP status == 412 (stale ${leak_v}=1 vs current 2 after regrade)"
            - "Leak.${leak_id}.status == OPEN (no RepairOrder created)"

      - name: occ_stale_report_version_on_bind_snapshots
        claim_type: stale_version_conflict
        grounds:
          - concurrency_rules[snapshot-bind-stale-report]
          - errors[ERR_STALE_REPORT_VERSION]
        distinguishing_aspect: "OCC on ComplianceReport.version: a first bind-snapshots advances the draft's version; a second bind carrying the pre-first-bind expected_report_version fails 412 ERR_STALE_REPORT_VERSION even though the report is still DRAFT."
        test_recipe:
          setup:
            - "DRAFT report; CURRENT LEAK_SECTION and CP_SECTION snapshots; version captured at creation"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: IntegrityAnalyst
            - call: "POST /integrity-analysts"
              payload: { employee_code: "IA-1", full_name: "Analyst One" }
              as: IntegrityAnalyst
              captures: { ia_id: $.data.id }
            - call: "POST /compliance-officers"
              payload: { employee_code: "CO-1", full_name: "Officer One", jurisdiction_scope: ["PHMSA"] }
              as: IntegrityAnalyst
              captures: { co_id: $.data.id }
            - call: "POST /risk-model-snapshots"
              payload: { snapshot_label: "OCC-leak", snapshot_kind: "LEAK_SECTION" }
              as: IntegrityAnalyst
              as_user_id: "${ia_id}"
              captures: { snap_leak_id: $.data.id }
            - call: "POST /risk-model-snapshots"
              payload: { snapshot_label: "OCC-cp", snapshot_kind: "CP_SECTION" }
              as: IntegrityAnalyst
              as_user_id: "${ia_id}"
              captures: { snap_cp_id: $.data.id }
            - call: "POST /compliance-reports"
              payload: { reporting_period_start: "2026-01-01T00:00:00Z", reporting_period_end: "2026-06-30T23:59:59Z", regulator: "PHMSA" }
              as: ComplianceOfficer
              as_user_id: "${co_id}"
              captures: { rep_id: $.data.id, rep_v: $.data.version }
            - call: "POST /compliance-reports/${rep_id}/bind-snapshots"
              payload: { leak_section_snapshot_id: "${snap_leak_id}", cp_section_snapshot_id: "${snap_cp_id}", expected_report_version: "${rep_v}" }
              as: ComplianceOfficer
              as_user_id: "${co_id}"
          trigger:
            - call: "POST /compliance-reports/${rep_id}/bind-snapshots"
              payload: { leak_section_snapshot_id: "${snap_leak_id}", cp_section_snapshot_id: "${snap_cp_id}", expected_report_version: "${rep_v}" }
              as: ComplianceOfficer
              as_user_id: "${co_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_STALE_REPORT_VERSION"
            - "HTTP status == 412 (reused stale ${rep_v} after first bind bumped version)"

      - name: risk_snapshot_auto_stales_on_new_leak
        claim_type: auto_transition
        grounds:
          - state_machines.RiskModelSnapshot.CURRENT_to_STALE
          - endpoints.POST /leaks
        distinguishing_aspect: "RiskModelSnapshot auto-staling: a CURRENT snapshot flips to STALE when a new Leak is created on a covered segment (input change), with no explicit transition call."
        test_recipe:
          setup:
            - "Segment SEG-SN with ACCEPTED-run survey surface; CURRENT FULL snapshot generated; then a new leak posted"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: IntegrityAnalyst
            - call: "POST /integrity-analysts"
              payload: { employee_code: "IA-1", full_name: "Analyst One" }
              as: IntegrityAnalyst
              captures: { ia_id: $.data.id }
            - call: "POST /field-technicians"
              payload: { employee_code: "FT-1", full_name: "Tech One", qualified_methods: ["WALKING"], home_region: "NORTH" }
              as: IntegrityAnalyst
              captures: { ft_id: $.data.id }
            - call: "POST /calibration-techs"
              payload: { employee_code: "CT-1", full_name: "Cal One" }
              as: IntegrityAnalyst
              captures: { ct_id: $.data.id }
            - call: "POST /instruments"
              payload: { serial_number: "I-CGI-SN", instrument_type: "CGI" }
              as: CalibrationTech
              as_user_id: "${ct_id}"
              captures: { instr_id: $.data.id }
            - call: "POST /instruments/${instr_id}/calibrate"
              payload: { reference_gas_ppm: 100.0, observed_ppm: 100.0 }
              as: CalibrationTech
              as_user_id: "${ct_id}"
            - call: "POST /pipe-segments"
              payload: { segment_code: "SEG-SN", install_year: 2010, material: "STEEL", diameter_inches: 6.0, length_feet: 1000.0, operating_pressure_psi: 60.0, pressure_class: "DISTRIBUTION", is_high_consequence_area: false }
              as: IntegrityAnalyst
              captures: { seg_id: $.data.id }
            - call: "POST /dispatch-coordinators"
              payload: { employee_code: "DC-1", full_name: "Disp One" }
              as: IntegrityAnalyst
              captures: { dc_id: $.data.id }
            - call: "POST /survey-routes"
              payload: { route_code: "R-SN", survey_method: "WALKING", scheduled_window_start: "2026-07-01T00:00:00Z", scheduled_window_end: "2026-12-31T23:59:59Z" }
              as: DispatchCoordinator
              as_user_id: "${dc_id}"
              captures: { route_id: $.data.id }
            - call: "POST /survey-routes/${route_id}/route-segment-assignments"
              payload: { segment_id: "${seg_id}", sequence_index: 1 }
              as: DispatchCoordinator
              as_user_id: "${dc_id}"
            - call: "POST /survey-routes/${route_id}/dispatch"
              payload: {}
              as: DispatchCoordinator
              as_user_id: "${dc_id}"
            - call: "POST /survey-runs"
              payload: { route_id: "${route_id}", instrument_id: "${instr_id}", distance_covered_feet: 1000.0 }
              as: FieldTechnician
              as_user_id: "${ft_id}"
              captures: { run_id: $.data.id }
            - call: "POST /survey-runs/${run_id}/submit"
              payload: {}
              as: FieldTechnician
              as_user_id: "${ft_id}"
            - call: "POST /risk-model-snapshots"
              payload: { snapshot_label: "pre-leak", snapshot_kind: "FULL" }
              as: IntegrityAnalyst
              as_user_id: "${ia_id}"
              captures: { snap_id: $.data.id, snap_status0: $.data.status }
          trigger:
            - call: "POST /leaks"
              payload: { segment_id: "${seg_id}", survey_run_id: "${run_id}", concentration_ppm: 12000.0, distance_to_building_feet: 30.0, bar_hole_reading_pct_lel: 8.0, is_migration_evidence: false }
              as: FieldTechnician
              as_user_id: "${ft_id}"
            - call: "GET /risk-model-snapshots/${snap_id}"
              payload: {}
              as: IntegrityAnalyst
              as_user_id: "${ia_id}"
              captures: { snap_status1: $.data.status }
          assert:
            - "snap_status0 == CURRENT"
            - "snap_status1 == STALE (auto-stale side effect of POST /leaks)"

      - name: instrument_auto_out_of_calibration_past_due
        claim_type: auto_transition
        grounds:
          - state_machines.Instrument.IN_SERVICE_to_OUT_OF_CALIBRATION
        distinguishing_aspect: "Scheduled/automatic transition: advancing the logical clock past calibration_due_at (CGI 60 days) flips Instrument.status IN_SERVICE -> OUT_OF_CALIBRATION with no explicit retire/calibrate call."
        test_recipe:
          setup:
            - "CGI instrument calibrated at 2026-08-01 (due 2026-09-30T00:00:00Z)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: IntegrityAnalyst
            - call: "POST /calibration-techs"
              payload: { employee_code: "CT-1", full_name: "Cal One" }
              as: IntegrityAnalyst
              captures: { ct_id: $.data.id }
            - call: "POST /instruments"
              payload: { serial_number: "I-CGI-AUTO", instrument_type: "CGI" }
              as: CalibrationTech
              as_user_id: "${ct_id}"
              captures: { instr_id: $.data.id }
            - call: "POST /instruments/${instr_id}/calibrate"
              payload: { reference_gas_ppm: 100.0, observed_ppm: 100.0 }
              as: CalibrationTech
              as_user_id: "${ct_id}"
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: IntegrityAnalyst
            - call: "GET /instruments/${instr_id}"
              payload: {}
              as: CalibrationTech
              as_user_id: "${ct_id}"
              captures: { st: $.data.status }
          assert:
            - "st == OUT_OF_CALIBRATION (system transition fired on clock advance)"

  # =============================================================================
  # Section: consistency_model — consistency_model: immediate claims.
  # =============================================================================
  - section: consistency_model
    instances:
      - name: immediate_visibility_of_writes_in_read
        claim_type: immediate_visibility
        grounds:
          - complexity_profile.consistency_model
          - entities.PipeSegment.fields.posture
        distinguishing_aspect: "Immediate consistency: the POST /cp-readings response already carries computed is_anomalous/anomaly_status, and a GET on the parent segment issued right after reflects the derived posture change (ELEVATED) with no lag or reconciliation pass."
        test_recipe:
          setup:
            - "Segment SEG-IM exists with posture NORMAL"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: IntegrityAnalyst
            - call: "POST /field-technicians"
              payload: { employee_code: "FT-1", full_name: "Tech One", qualified_methods: ["WALKING"], home_region: "NORTH" }
              as: IntegrityAnalyst
              captures: { ft_id: $.data.id }
            - call: "POST /pipe-segments"
              payload: { segment_code: "SEG-IM", install_year: 2010, material: "STEEL", diameter_inches: 6.0, length_feet: 1000.0, operating_pressure_psi: 60.0, pressure_class: "DISTRIBUTION", is_high_consequence_area: false }
              as: IntegrityAnalyst
              captures: { seg_id: $.data.id }
          trigger:
            - call: "POST /cp-readings"
              payload: { segment_id: "${seg_id}", test_point_id: "TP-1", pipe_to_soil_potential_mv: -700.0, instant_off_potential_mv: -800.0 }
              as: FieldTechnician
              as_user_id: "${ft_id}"
              captures: { anom: $.data.is_anomalous, anom_status: $.data.anomaly_status }
            - call: "GET /pipe-segments/${seg_id}"
              payload: {}
              as: IntegrityAnalyst
              captures: { posture: $.data.posture }
          assert:
            - "anom == true AND anom_status == OPEN (computed in the same response)"
            - "posture == ELEVATED (derived field visible on immediate read)"
