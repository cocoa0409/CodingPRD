  # ===========================================================================
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: crane_slot_buffer_adjacency
        grounds:
          - calculations.crane_slot_capacity
          - errors[ERR_CRANE_WINDOW_OVERLAP]
          - concurrency_rules[shipment-book-stale-slot]
        distinguishing_aspect: |
          Buffer-augmented half-open semantics on CraneSlot: a booking at hour
          8 with lift 2.0 h occupies [8, 10.5) because the 0.5 h setup buffer
          is part of occupancy — a second booking at 10.0 collides
