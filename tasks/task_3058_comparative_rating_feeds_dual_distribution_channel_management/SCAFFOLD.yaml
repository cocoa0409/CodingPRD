# =============================================================================
# SCAFFOLD — task_3058_comparative_rating_feeds_dual_distribution_channel_management
# Progressive-style comparative rating feeds + dual distribution channel mgmt
# §1.0–§1.7 (difficulty & corner designs live in sibling files)
# =============================================================================

scenario: |
  Comparative Rating Feeds & Dual Distribution Channel Management (Progressive):
  rate delivery to comparative raters used by independent agents alongside a
  direct-to-consumer channel, channel-specific pricing and product
  differentiation to manage conflict, quote data reuse where a consumer starts
  direct and completes through an agent, agent appointment, commission schedule
  and contingent bonus administration, bundled home offering placed through
  unaffiliated carriers with agency-of-record handling, snapshot telematics
  enrollment offered in both channels with different discount realization,
  quote-to-bind leakage analysis by channel, agent portfolio review and
  appointment termination for loss ratio

domain_name: comparative-rating-dual-channel
api_prefix: ""

complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - dual_variant_calculation
    - optimistic_concurrency
    - cascading_side_effects
    - rate_threshold_triggers
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (flat topology, FK links)
# =============================================================================
entities:
  - name: CarrierProduct
    parent: null
    common_fields: true
    fields:
      - { name: product_code, type: string, source: input, description: "Unique product code (e.g. AUTO-X); unique across all products" }
      - { name: line_of_business, type: enum, source: input, description: "AUTO | HOME" }
      - { name: state_code, type: string, source: input, description: "State the product is filed in (e.g. TX)" }
      - { name: channel_availability, type: enum, source: input, description: "DIRECT | AGENT | BOTH — which channels may quote this product" }
      - { name: coverage_rates, type: object, source: input, description: "Rate table: { coverage_code: { tier: rate_cents } }" }
      - { name: direct_discount_pct, type: number, source: input, default: 0, description: "Fractional discount applied in DIRECT channel (0.10 = 10%)" }
      - { name: agent_load_pct, type: number, source: input, default: 0, description: "Fractional load applied in AGENT channel (0.15 = +15%)" }
      - { name: bundle_credit_pct, type: number, source: input, default: 0, description: "Fractional credit subtracted from agent load when bundled_home_intended is true" }
      - { name: min_premium_cents, type: integer, source: input, description: "Premium floor applied AFTER summing rounded lines" }
      - { name: direct_channel_max_premium_cents, type: integer, source: input, default: null, description: "Anti-conflict cap: DIRECT-channel premium may not exceed this at submit" }
      - { name: bundle_eligible, type: boolean, source: input, default: false, description: "Whether policies of this product may carry a BundlePlacement" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | WITHDRAWN" }

  - name: ComparativeRater
    parent: null
    common_fields: true
    fields:
      - { name: rater_code, type: string, source: input, description: "Unique rater code (e.g. PL-RATER)" }
      - { name: display_name, type: string, source: input, description: "Rater display name" }
      - { name: feed_format_version, type: string, source: input, description: "Feed format the rater consumes (e.g. v4.2)" }
      - { name: accepted_line_of_business, type: enum, source: input, description: "AUTO | HOME" }

  - name: RateFeedPublication
    parent: null
    common_fields: true
    fields:
      - { name: rater_id, type: string, source: input, description: "FK -> ComparativeRater.id" }
      - { name: product_id, type: string, source: input, description: "FK -> CarrierProduct.id" }
      - { name: effective_start, type: datetime, source: input, description: "Window start (inclusive), ISO8601 UTC" }
      - { name: effective_end, type: datetime, source: input, description: "Window end (exclusive), ISO8601 UTC" }
      - { name: rate_table_payload, type: object, source: input, description: "Opaque rate-table payload delivered to the rater" }
      - { name: status, type: enum, source: system, description: "DRAFT | PUBLISHED | SUPERSEDED | RECALLED" }
      - { name: published_at, type: datetime, source: system, default: null, description: "Logical-clock timestamp of publish transition" }

  - name: Agent
    parent: null
    common_fields: true
    fields:
