    instances:
      - name: derived_field_reconciliation_seats_in_use_after_revoke
        claim_type: derived_field_reconciliation
        grounds:
          - entities.LicenseAgreement.fields.seats_in_use
        excluded_because:
          difficulty_instance: compensating_invariant / seat_grant_revoke_conserves_seats_in_use
          rationale: "seats_in_use reconciliation after grant and revoke is asserted in the §1.8 invariant instance."

      - name: cascading_side_effects_audit_to_licensee_to_seats
        claim_type: cascading_side_effects
        grounds:
          - state_machines.LicenseAudit.transitions
        excluded_because:
          difficulty_instance: transitive_cascade / audit_penalty_cascades_to_licensee_suspension_and_seat_revocation
          rationale: "The full depth-3 cascade is asserted end-to-end in the §1.8 cascade instance."

      - name: methodology_restatement_cascade_counts_restated_ratings
        claim_type: cascading_side_effects
        grounds:
          - state_machines.MethodologyChange.APPROVED_to_EFFECTIVE
          - state_machines.Rating.PUBLISHED_to_RESTATED
          - entities.Rating.fields.restatement_of_id
        distinguishing_aspect: "Effectuating a change with restatement_required=true moves every PUBLISHED rating under the methodology to RESTATED and creates a successor with restatement_of_id pointing at the original; restated_rating_count equals the number of PUBLISHED ratings at effectuation."
        test_recipe:
          setup:
            - "Methodology QRS EFFECTIVE; two funds FRST1/FRST2 each with a PUBLISHED quantitative rating under QRS; change CHGR approved (restatement_required=true, effective_date 2026-09-01) with notice sent."
          setup_api_calls:
            - *c_clock
            - call: "POST /research/categories"
              payload: { category_code: "RS_C", dominant_asset_class: "EQUITY", dominant_sector: "MIXED", min_weight_bp: 5000 }
              as: ResearchOps
            - call: "POST /research/fund-companies"
              payload: { legal_name: "Restate Co", commercial_relationship: "NONE" }
              as: ResearchOps
              captures: { fcrs_id: $.data.id }
            - call: "POST /research/funds"
              payload: { fund_company_id: "${fcrs_id}", ticker: "FRST1", inception_date: "2019-01-01", trailing_return_3y_bp: 8000, trailing_return_5y_bp: 8000, risk_score_bp: 2000 }
              as: ResearchOps
              captures: { frst1_id: $.data.id }
            - call: "POST /research/funds"
              payload: { fund_company_id: "${fcrs_id}", ticker: "FRST2", inception_date: "2019-01-01", trailing_return_3y_bp: 6000, trailing_return_5y_bp: 6000, risk_score_bp: 3000 }
              as: ResearchOps
              captures: { frst2_id: $.data.id }
            - call: "POST /research/funds/${frst1_id}/holdings"
              payload: { as_of_date: "2026-08-31", holdings: [ { security_ticker: "RS1", asset_class: "EQUITY", sector: "TECH", weight_bp: 10000 } ] }
              as: ResearchOps
            - call: "POST /research/funds/${frst2_id}/holdings"
              payload: { as_of_date: "2026-08-31", holdings: [ { security_ticker: "RS2", asset_class: "EQUITY", sector: "TECH", weight_bp: 10000 } ] }
              as: ResearchOps
            - call: "POST /research/methodologies"
              payload: { methodology_code: "QRS", methodology_kind: "QUANTITATIVE", version_number: 1, effective_from: "2026-01-01", weight_return_bp: 6000, weight_risk_bp: 4000, rating_ceilings: [7000, 5000, 3000, 1000] }
              as: ResearchOps
              captures: { mqrs_id: $.data.id }
            - call: "POST /research/methodologies/${mqrs_id}/activate"
              payload: {}
              as: ResearchOps
            - call: "POST /research/ratings/compute"
              payload: { fund_id: "${frst1_id}", methodology_id: "${mqrs_id}" }
              as: ResearchOps
              captures: { rrst1_id: $.data.id }
            - call: "POST /research/ratings/${rrst1_id}/publish"
              payload: {}
              as: ResearchOps
            - call: "POST /research/ratings/compute"
              payload: { fund_id: "${frst2_id}", methodology_id: "${mqrs_id}" }
              as: ResearchOps
              captures: { rrst2_id: $.data.id }
            - call: "POST /research/ratings/${rrst2_id}/publish"
              payload: {}
              as: ResearchOps
            - call: "GET /research/methodologies/${mqrs_id}"
              payload: {}
              as: ResearchOps
              captures: { mqrs_v: $.data.version }
            - call: "POST /research/methodologies/${mqrs_id}/changes"
              payload: { restatement_required: true, effective_date: "2026-09-01", expected_methodology_version: "${mqrs_v}" }
              as: ResearchOps
              captures: { chgr_id: $.data.id }
            - call: "POST /research/methodology-changes/${chgr_id}/approve"
              payload: {}
              as: ResearchOps
            - call: "POST /research/licensees"
              payload: { licensee_name: "Restate Notice" }
              as: LicenseAdmin
              captures: { lrn_id: $.data.id }
            - call: "POST /research/methodology-changes/${chgr_id}/notices"
              payload: { licensee_id: "${lrn_id}", notice_channel: "API" }
              as: ResearchOps
          trigger:
            - call: "POST /research/methodology-changes/${chgr_id}/effectuate"
              payload: {}
              as: ResearchOps
          assert:
            - "Rating.${rrst1_id}.rating_status == RESTATED and Rating.${rrst2_id}.rating_status == RESTATED"
            - "MethodologyChange.${chgr_id}.restated_rating_count == 2"
            - "each successor rating's restatement_of_id equals its original rating id (successors discoverable via GET /research/funds/{id}/ratings)"
            - "successor ratings are PROVISIONAL (quantitative kind) and recomputable via publish"

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_consistency_same_request_response
        claim_type: immediate_consistency
        grounds:
          - complexity_profile.consistency_model
        distinguishing_aspect: "A seat grant's 201 response already shows the new SeatEntitlement, and the immediately-following GET on the agreement shows seats_in_use incremented — no async reconciliation."
        test_recipe:
          setup:
            - "Licensee LIC ACTIVE; agreement AGIC ACTIVE seat_limit 3."
          setup_api_calls:
            - *c_clock
            - call: "POST /research/licensees"
              payload: { licensee_name: "Immediate Co" }
              as: LicenseAdmin
              captures: { lic_id: $.data.id }
            - call: "POST /research/license-agreements"
              payload: { licensee_id: "${lic_id}", tier: "DISPLAY", seat_limit: 3, effective_from: "2026-01-01", base_fee_cents: 100000 }
              as: LicenseAdmin
              captures: { agic_id: $.data.id }
            - call: "POST /research/license-agreements/${agic_id}/activate"
              payload: {}
              as: LicenseAdmin
            - call: "GET /research/license-agreements/${agic_id}"
              payload: {}
              as: LicenseAdmin
              captures: { agic_v: $.data.version }
          trigger:
            - call: "POST /research/license-agreements/${agic_id}/seats"
              payload: { workstation_user_id: "ic-1", expected_agreement_version: "${agic_v}" }
              as: LicenseAdmin
              captures: { sic_id: $.data.id }
            - call: "GET /research/license-agreements/${agic_id}"
              payload: {}
              as: LicenseAdmin
              captures: { agic_after: $.data.seats_in_use }
          assert:
            - "seat grant response contains the SeatEntitlement with seat_status ACTIVE and entitled_data_scope == DISPLAY"
            - "agic_after == 1 in the immediately following GET (immediate consistency)"
