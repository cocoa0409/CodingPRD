          setup_api_calls:
            - *k_clock
            - *k_prog1
            - *k_open
            - *k_off_dan
            - *k_dan_exam
            - *k_dan_phys
            - *k_game
            - &k_game2
              call: "POST /games"
              payload: { season_program_id: "${sp_id}", home_team_code: "BUF", away_team_code: "DEN", venue_market_code: "BUF", kickoff_utc: "2026-09-18T21:00:00Z" }
              as: OfficiatingDirector
              captures: { g2_id: $.data.id, g2_v0: $.data.version }
            - &k_game3
              call: "POST /games"
              payload: { season_program_id: "${sp_id}", home_team_code: "SEA", away_team_code: "BUF", venue_market_code: "SEA", kickoff_utc: "2026-09-24T01:00:00Z" }
              as: OfficiatingDirector
              captures: { g3_id: $.data.id, g3_v0: $.data.version }
            - *k_assign_dan
            - call: "POST /crew-assignments"
              payload: { game_id: "${g2_id}", official_id: "${dan_id}", position: "UMPIRE", expected_game_version: "${g2_v0}" }
              as: CrewScheduler
              captures: { a2_id: $.data.id, a2_from: $.data.occupied_from_utc, a2_until: $.data.occupied_until_utc }
          trigger:
            - call: "POST /crew-assignments/${a2_id}/withdraw"
              payload: { reason: "personal leave" }
              as: CrewScheduler
              captures: { a2_status_wd: $.data.status, a2_released: $.data.released_at }
            - call: "POST /crew-assignments"
              payload: { game_id: "${g3_id}", official_id: "${dan_id}", position: "UMPIRE", expected_game_version: "${g3_v0}" }
              as: CrewScheduler
              captures: { a3_id: $.data.id, a3_status: $.data.status, a3_from: $.data.occupied_from_utc }
            - call: "GET /crew-assignments"
              payload: { official_id: "${dan_id}", status: "PROPOSED" }
              as: CrewScheduler
              captures: { open_first_game: "$.data[0].game_id" }
          assert:
            - "${a2_from} == 2026-09-17T21:00:00Z and ${a2_until} == 2026-09-23T01:00:00Z (kickoff - 24h, kickoff + 4h + 96h)"
            - "${a2_status_wd} == WITHDRAWN with ${a2_released} == 2026-08-01T00:00:00Z"
            - "the third BUF assignment succeeds with HTTP 201 and ${a3_status} == PROPOSED — prior exposures are back to 1 (G1 only), below the cap of 2"
            - "${a3_from} == 2026-09-23T01:00:00Z, exactly where the withdrawn window ended, so the occupancy check is not what admitted it"
            - "the PROPOSED list holds two rows and ${open_first_game} == ${g_id} in created_at order — the WITHDRAWN row is excluded from both the exposure and occupancy input sets"

      - name: appeal_filed_at_the_exact_deadline_instant_is_accepted
        claim_type: threshold
        grounds:
          - calculations.appeal_window
          - errors[ERR_APPEAL_WINDOW_CLOSED]
          - entities.PlayGrade.fields.posted_at
        distinguishing_aspect: "The window comparison is strict (clock > deadline), so an appeal filed at exactly posted_at + 72h is accepted and one filed a single second later is rejected — and posted_at, not created_at, starts the clock."
        test_recipe:
          setup:
            - "SeasonProgram 2026 is OPEN with crew_size_required 1, appeal_window_hours 72 and appeal_credits_per_official 3."
            - "Game G1 is PLAYED and two grades on Dan (Q3-P22 and Q3-P23) were POSTED at 2026-09-13T21:30:00Z, so both deadlines are 2026-09-16T21:30:00Z."
          setup_api_calls:
            - *k_clock
            - *k_prog1
            - *k_open
            - *k_off_dan
            - *k_dan_exam
            - *k_dan_phys
            - *k_game
            - *k_assign_dan
            - *k_confirm_dan
            - *k_clock_kick
            - *k_kick
            - *k_clock_grade
            - *k_played
            - *k_grade
            - *k_post_grade
            - call: "POST /play-grades"
              payload: { game_id: "${g_id}", official_id: "${dan_id}", play_ref: "Q3-P23", call_category: "FALSE_START", grade_code: "INCORRECT_CALL", impact: "LOW" }
              as: GradingSupervisor
              as_user_id: "sup-grader-1"
              captures: { pg2_id: $.data.id, pg2_points: $.data.error_points }
            - call: "POST /play-grades/${pg2_id}/post"
              payload: {}
              as: GradingSupervisor
              as_user_id: "sup-grader-1"
              captures: { pg2_posted: $.data.posted_at }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-16T21:30:00Z" }
              as: OfficiatingDirector
            - call: "POST /grade-appeals"
              payload: { play_grade_id: "${pg_id}", basis_note: "filed on the last legal instant" }
              as: Official
              as_user_id: "${dan_id}"
              captures: { ap_edge_id: $.data.id, ap_edge_status: $.data.status, ap_edge_submitted: $.data.submitted_at }
            - call: "GET /officials/${dan_id}"
              payload: {}
              as: OfficiatingDirector
              captures: { dan_credits_edge: $.data.appeal_credits_remaining }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-16T21:30:01Z" }
              as: OfficiatingDirector
            - call: "POST /grade-appeals"
              payload: { play_grade_id: "${pg2_id}", basis_note: "one second too late" }
              as: Official
              as_user_id: "${dan_id}"
              captures: { err_window_closed: $.data.error_id }
            - call: "GET /play-grades/${pg2_id}"
              payload: {}
              as: GradingSupervisor
              captures: { pg2_appeal_state_end: $.data.appeal_state }
            - call: "GET /officials/${dan_id}"
              payload: {}
              as: OfficiatingDirector
              captures: { dan_credits_after_reject: $.data.appeal_credits_remaining }
          assert:
            - "${pg2_points} == 0.50 (1.00 * 0.50 * 1.00) and ${pg2_posted} == 2026-09-13T21:30:00Z"
            - "the appeal at exactly 2026-09-16T21:30:00Z returns HTTP 201 with ${ap_edge_status} == SUBMITTED and ${ap_edge_submitted} == 2026-09-16T21:30:00Z"
            - "${dan_credits_edge} == 2 — the accepted appeal spent one credit"
            - "one second later the second appeal returns HTTP 422 with ${err_window_closed} == ERR_APPEAL_WINDOW_CLOSED"
            - "${pg2_appeal_state_end} == NOT_APPEALED and ${dan_credits_after_reject} == 2 — a rejected filing neither marks the grade nor burns a credit"

      - name: accuracy_index_diverges_between_provisional_and_final
        claim_type: variant_divergence
        grounds:
          - calculations.accuracy_index.variants
          - entities.OfficialSeasonRecord.fields.accuracy_variant
        excluded_because:
          difficulty_instance: dual_variant_calc / accuracy_index_provisional_vs_final_on_season_record
          rationale: "Both included sets, the OVERTURNED exclusion and the resulting eligibility flip are computed side by side in that §1.8 instance."
      - name: retention_penalty_band_reads_the_pre_penalty_score
        claim_type: constants_applied
        grounds:
          - calculations.retention_score
        excluded_because:
          difficulty_instance: combinatorial_formula / retention_penalty_band_selected_from_pre_penalty_score_mode_c
          rationale: "The band-selection ordering trap and its RETAIN/DEVELOP/RELEASE consequence are the whole point of that §1.8 instance."
      - name: error_points_round_per_play_not_after_summing
        claim_type: precision
        grounds:
          - calculations.play_error_points
        excluded_because:
          difficulty_instance: combinatorial_formula / error_points_round_per_play_then_sum_mode_b
          rationale: "The three-table product with per-play rounding before summation is asserted with literals there."
      - name: crew_strength_index_applies_cap_and_two_weight_tables
        claim_type: constants_applied
        grounds:
          - calculations.crew_strength_index
        excluded_because:
          difficulty_instance: combinatorial_formula / crew_strength_experience_cap_and_two_weight_tables_mode_a
          rationale: "The EXPERIENCE_CAP clamp, the tier and position tables and the required-crew-size divisor are covered together there."

  # ===========================================================================
  - section: validations
    instances:

      - name: assignment_satisfying_every_safety_rule_succeeds
        claim_type: satisfaction_pass
        grounds:
          - validations[priority=10]
          - validations[priority=11]
          - validations[priority=12]
          - validations[priority=13]
          - validations[priority=14]
          - validations[priority=15]
          - calculations.crew_posture_derivation
        distinguishing_aspect: "An assignment that violates none of priorities 10-15 returns 201 with the occupancy window computed from travel_lead_hours and min_rest_hours_between_games, and confirming it flips crew_posture UNDERSTAFFED -> STAFFED."
        test_recipe:
          setup:
            - "SeasonProgram 2026 is OPEN with crew_size_required 1, travel_lead_hours 24 and min_rest_hours_between_games 96."
            - "Dan is ACTIVE, preseason-cleared, affiliated_team_code null, and holds no other assignment."
            - "Game G1 (MIA vs BUF) is SCHEDULED with kickoff 2026-09-13T17:00:00Z."
          setup_api_calls:
            - *k_clock
            - *k_prog1
            - *k_open
            - *k_off_dan
            - *k_dan_exam
            - *k_dan_phys
            - *k_game
          trigger:
            - call: "POST /crew-assignments"
              payload: { game_id: "${g_id}", official_id: "${dan_id}", position: "UMPIRE", expected_game_version: "${g_v0}" }
              as: CrewScheduler
              captures: { ok_id: $.data.id, ok_status: $.data.status, ok_from: $.data.occupied_from_utc, ok_until: $.data.occupied_until_utc, ok_released: $.data.released_at }
            - call: "GET /games/${g_id}"
              payload: {}
              as: CrewScheduler
              captures: { g_posture_proposed: $.data.crew_posture, g_ccc_proposed: $.data.confirmed_crew_count, g_csi_proposed: $.data.crew_strength_index, g_variant_proposed: $.data.crew_strength_variant }
            - call: "GET /officials/${dan_id}"
              payload: {}
              as: CrewScheduler
              captures: { dan_oac_proposed: $.data.open_assignment_count }
            - call: "POST /crew-assignments/${ok_id}/confirm"
              payload: {}
              as: CrewScheduler
              captures: { ok_status_conf: $.data.status }
            - call: "GET /games/${g_id}"
              payload: {}
              as: CrewScheduler
              captures: { g_posture_conf: $.data.crew_posture, g_ccc_conf: $.data.confirmed_crew_count, g_csi_conf: $.data.crew_strength_index }
          assert:
            - "HTTP status is 201 with ${ok_status} == PROPOSED and ${ok_released} == null"
            - "${ok_from} == 2026-09-12T17:00:00Z (kickoff - 24h) and ${ok_until} == 2026-09-17T21:00:00Z (kickoff + 4h + 96h)"
            - "${g_csi_proposed} == 4.80 (6 * 0.80 * 1.00 / 1) with ${g_variant_proposed} == PROJECTED, ${g_ccc_proposed} == 0 and ${g_posture_proposed} == UNDERSTAFFED"
            - "${dan_oac_proposed} == 1"
            - "${ok_status_conf} == CONFIRMED, ${g_ccc_conf} == 1 and ${g_posture_conf} == STAFFED because 1 >= crew_size_required 1"
            - "${g_csi_conf} == 4.80 — confirming does not change the PROJECTED index, only the posture"

      - name: malformed_payloads_are_rejected_with_invalid_request
        claim_type: violation_error
        grounds:
          - validations[priority=3]
          - errors[ERR_INVALID_REQUEST]
          - entities.TrainingRecord.fields.score
          - entities.DisciplineAction.fields.suspension_games
        distinguishing_aspect: "Priority 3 catches an out-of-range score, an unparseable timestamp and the conditional requirement that severity SUSPENSION carries suspension_games >= 1 — all with ERR_INVALID_REQUEST at 400, before any state or existence rule runs."
        test_recipe:
          setup:
            - "SeasonProgram 2026 is OPEN and Dan is ACTIVE after a passed rules exam."
          setup_api_calls:
            - *k_clock
            - *k_prog
            - *k_open
            - *k_off_dan
            - *k_dan_exam
            - *k_read_dan_v
          trigger:
            - call: "POST /officials/${dan_id}/training-records"
              payload: { record_type: "PHYSICAL_TEST", session_code: "PT-BAD", score: 105.00 }
              as: TrainingCoordinator
              captures: { err_score_range: $.data.error_id }
            - call: "POST /games"
              payload: { season_program_id: "${sp_id}", home_team_code: "MIA", away_team_code: "BUF", venue_market_code: "MIA", kickoff_utc: "2026-13-45T99:00:00Z" }
              as: OfficiatingDirector
              captures: { err_bad_timestamp: $.data.error_id }
            - call: "POST /discipline-actions"
              payload: { official_id: "${dan_id}", reason_category: "CONDUCT", severity: "SUSPENSION", expected_official_version: "${dan_v1}" }
              as: OfficiatingDirector
              captures: { err_suspension_games: $.data.error_id }
            - call: "POST /discipline-actions"
              payload: { official_id: "${dan_id}", reason_category: "CONDUCT", severity: "SUSPENSION", suspension_games: 0, expected_official_version: "${dan_v1}" }
              as: OfficiatingDirector
              captures: { err_suspension_zero: $.data.error_id }
            - call: "GET /officials/${dan_id}"
              payload: {}
              as: OfficiatingDirector
              captures: { dan_status_untouched: $.data.status, dan_version_untouched: $.data.version }
          assert:
            - "all four calls return HTTP 400 with error_id ERR_INVALID_REQUEST: ${err_score_range}, ${err_bad_timestamp}, ${err_suspension_games} and ${err_suspension_zero}"
            - "the missing suspension_games and the suspension_games 0 cases are the same conditional rule, checked before the OCC comparison at priority 9"
            - "${dan_status_untouched} == ACTIVE and ${dan_version_untouched} == ${dan_v1} — no rejected write bumped the version"

      - name: business_writes_outside_an_open_program_are_rejected
        claim_type: conditional_validation
        grounds:
          - validations[priority=7]
          - errors[ERR_SEASON_NOT_OPEN]
          - state_machines.SeasonProgram.CONFIGURING_to_OPEN
          - state_machines.SeasonProgram.OPEN_to_POSTSEASON_LOCKED
        distinguishing_aspect: "Priority 7 gates business writes on the owning program: POST /officials fails while the program is CONFIGURING, succeeds while OPEN, and POST /games fails again once the program is POSTSEASON_LOCKED — the same error_id at both ends of the lifecycle."
        test_recipe:
          setup:
            - "SeasonProgram 2026 has just been created and is still CONFIGURING."
          setup_api_calls:
            - *k_clock
            - *k_prog
          trigger:
            - call: "POST /officials"
              payload: { season_program_id: "${sp_id}", full_name: "Too Early", position: "REFEREE", seasons_experience: 3, home_market_code: "PHI" }
              as: OfficiatingDirector
              captures: { err_configuring: $.data.error_id }
            - call: "POST /season-programs/${sp_id}/open"
              payload: {}
              as: OfficiatingDirector
              captures: { sp_status_open: $.data.status }
            - call: "POST /officials"
              payload: { season_program_id: "${sp_id}", full_name: "Right On Time", position: "REFEREE", seasons_experience: 3, home_market_code: "PHI" }
              as: OfficiatingDirector
              captures: { late_off_id: $.data.id, late_off_status: $.data.status }
            - call: "POST /season-programs/${sp_id}/lock-postseason"
              payload: {}
              as: OfficiatingDirector
              captures: { sp_status_locked: $.data.status, sp_eligible_locked: $.data.eligible_official_count }
            - call: "POST /games"
              payload: { season_program_id: "${sp_id}", home_team_code: "MIA", away_team_code: "BUF", venue_market_code: "MIA", kickoff_utc: "2026-09-13T17:00:00Z" }
              as: OfficiatingDirector
              captures: { err_locked: $.data.error_id }
            - call: "POST /season-programs/${sp_id}/open"
              payload: {}
              as: OfficiatingDirector
              captures: { err_reopen: $.data.error_id }
          assert:
            - "the first POST /officials returns HTTP 409 with ${err_configuring} == ERR_SEASON_NOT_OPEN"
            - "${sp_status_open} == OPEN and the retried creation returns 201 with ${late_off_status} == CANDIDATE"
            - "${sp_status_locked} == POSTSEASON_LOCKED with ${sp_eligible_locked} == 0 (the only official has zero graded plays)"
            - "POST /games then returns HTTP 409 with ${err_locked} == ERR_SEASON_NOT_OPEN"
            - "reopening returns HTTP 409 with ${err_reopen} == ERR_SEASON_NOT_OPEN — the same rule also guards open/lock called from the wrong program state"

      - name: assignment_for_affiliated_team_returns_conflict_of_interest
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=13]
          - errors[ERR_TEAM_CONFLICT_OF_INTEREST]
          - entities.Official.fields.affiliated_team_code
        distinguishing_aspect: "Kim's affiliated_team_code MIA matches the home team of G1, so the assignment is rejected at priority 13 even though she is ACTIVE, preseason-cleared, window-free and under the rotation cap; the same official is assignable to a game between two other teams."
        test_recipe:
          setup:
            - "SeasonProgram 2026 is OPEN with crew_size_required 1."
            - "Kim Ortega (DOWN_JUDGE, 9 seasons, home DEN) has affiliated_team_code MIA and is ACTIVE and preseason-cleared."
            - "G1 is MIA vs BUF; G2 is BUF vs DEN at 2026-09-18T21:00:00Z."
          setup_api_calls:
            - *k_clock
            - *k_prog1
            - *k_open
            - *k_off_kim
            - &k_kim_exam
              call: "POST /officials/${kim_id}/training-records"
              payload: { record_type: "RULES_EXAM", session_code: "EX-K1", score: 93.00 }
              as: TrainingCoordinator
            - &k_kim_phys
              call: "POST /officials/${kim_id}/training-records"
              payload: { record_type: "PHYSICAL_TEST", session_code: "PT-K1", score: 85.00 }
              as: TrainingCoordinator
            - *k_game
            - *k_game2
          trigger:
            - call: "POST /crew-assignments"
              payload: { game_id: "${g_id}", official_id: "${kim_id}", position: "DOWN_JUDGE", expected_game_version: "${g_v0}" }
              as: CrewScheduler
              captures: { err_conflict: $.data.error_id }
            - call: "GET /games/${g_id}"
              payload: {}
              as: CrewScheduler
              captures: { g_csi_untouched: $.data.crew_strength_index, g_ver_untouched: $.data.version }
            - call: "POST /crew-assignments"
              payload: { game_id: "${g2_id}", official_id: "${kim_id}", position: "DOWN_JUDGE", expected_game_version: "${g2_v0}" }
              as: CrewScheduler
              captures: { kim_a2_id: $.data.id, kim_a2_status: $.data.status }
          assert:
            - "the G1 assignment returns HTTP 409 with ${err_conflict} == ERR_TEAM_CONFLICT_OF_INTEREST — MIA is the home team, and away_team_code would trip the same rule"
            - "${g_csi_untouched} == 0.00 and ${g_ver_untouched} == ${g_v0} — the rejected assignment left no trace"
            - "the G2 assignment (BUF vs DEN) returns 201 with ${kim_a2_status} == PROPOSED, proving the rule is about the two team codes and not about the official"

      - name: assignment_of_suspended_or_uncleared_official_is_rejected
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=11]
          - validations[priority=12]
          - errors[ERR_OFFICIAL_NOT_ACTIVE]
          - errors[ERR_PRESEASON_NOT_CLEARED]
          - state_machines.Official.ACTIVE_to_SUSPENDED
        distinguishing_aspect: "Two adjacent gates on the same endpoint are isolated: a SUSPENDED but fully cleared official trips priority 11, while an ACTIVE official who passed only the rules exam trips priority 12 — the two conjuncts of assignability fail one at a time."
        test_recipe:
          setup:
            - "SeasonProgram 2026 is OPEN with crew_size_required 1 and game G1 is SCHEDULED."
            - "Dan is preseason-cleared but has been suspended for 2 games."
            - "Tom Wells passed the rules exam only, so he is ACTIVE with preseason_cleared false."
          setup_api_calls:
            - *k_clock
            - *k_prog1
            - *k_open
            - *k_off_dan
            - *k_dan_exam
            - *k_dan_phys
            - *k_read_dan_v
            - call: "POST /discipline-actions"
              payload: { official_id: "${dan_id}", reason_category: "CONDUCT", severity: "SUSPENSION", suspension_games: 2, expected_official_version: "${dan_v1}" }
              as: OfficiatingDirector
              captures: { da_susp_id: $.data.id, da_susp_games: $.data.suspension_games }
            - &k_off_tom
              call: "POST /officials"
              payload: { season_program_id: "${sp_id}", full_name: "Tom Wells", position: "REFEREE", seasons_experience: 11, home_market_code: "SEA", tier: "TIER_2" }
              as: OfficiatingDirector
              captures: { tom_id: $.data.id }
            - &k_tom_exam
              call: "POST /officials/${tom_id}/training-records"
              payload: { record_type: "RULES_EXAM", session_code: "EX-T1", score: 90.00 }
              as: TrainingCoordinator
              captures: { tom_exam_passed: $.data.passed }
            - *k_game
          trigger:
            - call: "GET /officials/${dan_id}"
              payload: {}
              as: CrewScheduler
              captures: { dan_status_susp: $.data.status, dan_cleared_susp: $.data.preseason_cleared }
            - call: "POST /crew-assignments"
              payload: { game_id: "${g_id}", official_id: "${dan_id}", position: "UMPIRE", expected_game_version: "${g_v0}" }
              as: CrewScheduler
              captures: { err_not_active: $.data.error_id }
            - call: "GET /officials/${tom_id}"
              payload: {}
              as: CrewScheduler
              captures: { tom_status: $.data.status, tom_cleared: $.data.preseason_cleared }
            - call: "POST /crew-assignments"
              payload: { game_id: "${g_id}", official_id: "${tom_id}", position: "REFEREE", expected_game_version: "${g_v0}" }
              as: CrewScheduler
              captures: { err_not_cleared: $.data.error_id }
            - call: "GET /crew-assignments"
              payload: { game_id: "${g_id}" }
              as: CrewScheduler
          assert:
            - "${da_susp_games} == 2 and ${dan_status_susp} == SUSPENDED while ${dan_cleared_susp} == true"
            - "Dan's assignment returns HTTP 409 with ${err_not_active} == ERR_OFFICIAL_NOT_ACTIVE (priority 11 fires even though clearance is fine)"
            - "${tom_status} == ACTIVE with ${tom_cleared} == false and ${tom_exam_passed} == true"
            - "Tom's assignment returns HTTP 409 with ${err_not_cleared} == ERR_PRESEASON_NOT_CLEARED (priority 12, reachable only because he is ACTIVE)"
            - "GET /crew-assignments?game_id=${g_id} returns an empty data array with total_count 0 — neither rejected call created a row"

      - name: second_confirmed_assignment_on_a_position_is_rejected
        claim_type: aggregate_validation
        grounds:
          - validations[priority=15]
          - errors[ERR_POSITION_ALREADY_CONFIRMED]
          - state_machines.CrewAssignment.PROPOSED_to_CONFIRMED
        distinguishing_aspect: "Once the UMPIRE slot on G1 is CONFIRMED, a new UMPIRE assignment is rejected at priority 15 instead of superseding — the supersede path exists only while the incumbent row is still PROPOSED."
        test_recipe:
          setup:
            - "SeasonProgram 2026 is OPEN with crew_size_required 2."
            - "Dan holds a CONFIRMED UMPIRE assignment on G1; Rita is ACTIVE, preseason-cleared and window-free."
          setup_api_calls:
            - *k_clock
            - *k_prog
            - *k_open
            - *k_off_dan
            - *k_dan_exam
            - *k_dan_phys
            - *k_off_rita
            - *k_rita_exam
            - *k_rita_phys
            - *k_game
            - *k_assign_dan
            - *k_confirm_dan
            - *k_read_game_v
          trigger:
            - call: "POST /crew-assignments"
              payload: { game_id: "${g_id}", official_id: "${rita_id}", position: "UMPIRE", expected_game_version: "${g_v1}" }
              as: CrewScheduler
              captures: { err_position_taken: $.data.error_id }
            - call: "GET /crew-assignments"
              payload: { game_id: "${g_id}", position: "UMPIRE" }
              as: CrewScheduler
              captures: { ump_first_id: "$.data[0].id", ump_first_status: "$.data[0].status" }
            - call: "POST /crew-assignments"
              payload: { game_id: "${g_id}", official_id: "${rita_id}", position: "REFEREE", expected_game_version: "${g_v1}" }
              as: CrewScheduler
              captures: { rita_ref_id: $.data.id, rita_ref_status: $.data.status }
            - call: "GET /games/${g_id}"
              payload: {}
              as: CrewScheduler
              captures: { g_csi_two: $.data.crew_strength_index, g_ccc_two: $.data.confirmed_crew_count, g_posture_two: $.data.crew_posture }
          assert:
            - "the duplicate UMPIRE assignment returns HTTP 409 with ${err_position_taken} == ERR_POSITION_ALREADY_CONFIRMED"
            - "the UMPIRE list still holds exactly one row: ${ump_first_id} == ${ad_id} with ${ump_first_status} == CONFIRMED"
            - "the same official on a different position returns 201 with ${rita_ref_status} == PROPOSED — the rule is scoped to (game, position)"
            - "${g_csi_two} == 8.64 — (6*0.80*1.00 = 4.80) + (min(12,14)*0.80*1.30 = 12.48) = 17.28 / crew_size_required 2 = 8.64"
            - "${g_ccc_two} == 1 and ${g_posture_two} == UNDERSTAFFED because 1 < 2"

      - name: duplicate_play_ref_for_the_same_official_is_rejected
        claim_type: violation_error
        grounds:
          - validations[priority=16]
          - errors[ERR_DUPLICATE_PLAY_GRADE]
          - entities.PlayGrade.fields.play_ref
        distinguishing_aspect: "Uniqueness is on the triple (game_id, official_id, play_ref): a second grade on the same play for the same official is rejected, while the same play_ref for a different official on the same game is accepted."
        test_recipe:
          setup:
            - "SeasonProgram 2026 is OPEN with crew_size_required 2."
            - "Game G1 is PLAYED with Dan and Rita both COMPLETED on it, and Dan already has a DRAFT grade on play Q3-P22."
          setup_api_calls:
            - *k_clock
            - *k_prog
            - *k_open
            - *k_off_dan
            - *k_dan_exam
            - *k_dan_phys
            - *k_off_rita
            - *k_rita_exam
            - *k_rita_phys
            - *k_game
            - *k_assign_dan
            - *k_confirm_dan
            - *k_read_game_v
            - &k_assign_rita_ref
              call: "POST /crew-assignments"
              payload: { game_id: "${g_id}", official_id: "${rita_id}", position: "REFEREE", expected_game_version: "${g_v1}" }
              as: CrewScheduler
              captures: { ar_ref_id: $.data.id }
            - &k_confirm_rita_ref
              call: "POST /crew-assignments/${ar_ref_id}/confirm"
              payload: {}
              as: CrewScheduler
            - *k_clock_kick
            - *k_kick
            - *k_clock_grade
            - *k_played
            - *k_grade
          trigger:
            - call: "POST /play-grades"
              payload: { game_id: "${g_id}", official_id: "${dan_id}", play_ref: "Q3-P22", call_category: "PASS_INTERFERENCE", grade_code: "CORRECT", impact: "LOW" }
              as: GradingSupervisor
              as_user_id: "sup-grader-1"
              captures: { err_dup_grade: $.data.error_id }
            - call: "POST /play-grades"
              payload: { game_id: "${g_id}", official_id: "${rita_id}", play_ref: "Q3-P22", call_category: "HOLDING", grade_code: "MISSED_CALL", impact: "LOW" }
              as: GradingSupervisor
              as_user_id: "sup-grader-1"
              captures: { rita_pg_id: $.data.id, rita_pg_points: $.data.error_points }
            - call: "GET /play-grades"
              payload: { game_id: "${g_id}", official_id: "${dan_id}" }
              as: GradingSupervisor
              captures: { dan_pg_first_ref: "$.data[0].play_ref", dan_pg_first_status: "$.data[0].grade_status" }
          assert:
            - "the duplicate returns HTTP 409 with ${err_dup_grade} == ERR_DUPLICATE_PLAY_GRADE, and the existing DRAFT is not overwritten with the new call_category"
            - "the same play_ref for Rita returns 201 with ${rita_pg_points} == 0.90 (1.50 * 0.50 * 1.20, REFEREE position factor)"
            - "Dan's grade list holds exactly one row with ${dan_pg_first_ref} == Q3-P22 and ${dan_pg_first_status} == DRAFT"

      - name: play_grade_for_an_unassigned_official_is_rejected
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=17]
          - errors[ERR_ASSIGNMENT_STATE_INVALID]
          - entities.CrewAssignment.fields.status
        distinguishing_aspect: "Grading requires the official to have held a CONFIRMED or COMPLETED assignment on that game: Rita, who was never assigned, cannot be graded, and neither can an official whose only assignment was WITHDRAWN."
        test_recipe:
          setup:
            - "SeasonProgram 2026 is OPEN with crew_size_required 1."
            - "Game G1 is PLAYED with Dan COMPLETED on it."
            - "Rita is ACTIVE and preseason-cleared but was never assigned to G1."
            - "Tom Wells held a PROPOSED assignment on G1 that was withdrawn before kickoff."
          setup_api_calls:
            - *k_clock
            - *k_prog1
            - *k_open
            - *k_off_dan
            - *k_dan_exam
            - *k_dan_phys
            - *k_off_rita
            - *k_rita_exam
            - *k_rita_phys
            - *k_off_tom
            - *k_tom_exam
            - call: "POST /officials/${tom_id}/training-records"
              payload: { record_type: "PHYSICAL_TEST", session_code: "PT-T1", score: 77.00 }
              as: TrainingCoordinator
            - *k_game
            - *k_assign_dan
            - *k_confirm_dan
            - *k_read_game_v
            - call: "POST /crew-assignments"
              payload: { game_id: "${g_id}", official_id: "${tom_id}", position: "REFEREE", expected_game_version: "${g_v1}" }
              as: CrewScheduler
              captures: { tom_a_id: $.data.id }
            - call: "POST /crew-assignments/${tom_a_id}/withdraw"
              payload: { reason: "reassigned to another market" }
              as: CrewScheduler
              captures: { tom_a_status: $.data.status }
            - *k_clock_kick
            - *k_kick
            - *k_clock_grade
            - *k_played
          trigger:
            - call: "POST /play-grades"
              payload: { game_id: "${g_id}", official_id: "${rita_id}", play_ref: "Q1-P03", call_category: "HOLDING", grade_code: "CORRECT", impact: "LOW" }
              as: GradingSupervisor
              as_user_id: "sup-grader-1"
              captures: { err_never_assigned: $.data.error_id }
            - call: "POST /play-grades"
              payload: { game_id: "${g_id}", official_id: "${tom_id}", play_ref: "Q1-P03", call_category: "HOLDING", grade_code: "CORRECT", impact: "LOW" }
              as: GradingSupervisor
              as_user_id: "sup-grader-1"
              captures: { err_withdrawn_assignment: $.data.error_id }
            - call: "POST /play-grades"
              payload: { game_id: "${g_id}", official_id: "${dan_id}", play_ref: "Q1-P03", call_category: "HOLDING", grade_code: "CORRECT", impact: "LOW" }
              as: GradingSupervisor
              as_user_id: "sup-grader-1"
              captures: { dan_ok_pg_id: $.data.id, dan_ok_pg_status: $.data.grade_status }
          assert:
            - "${tom_a_status} == WITHDRAWN"
            - "both rejected calls return HTTP 409 with ${err_never_assigned} == ${err_withdrawn_assignment} == ERR_ASSIGNMENT_STATE_INVALID"
            - "the WITHDRAWN row does not satisfy the rule even though it once existed — only {CONFIRMED, COMPLETED} count"
            - "Dan, whose assignment is COMPLETED after mark-played, is gradeable: 201 with ${dan_ok_pg_status} == DRAFT"

      - name: replay_review_category_and_station_gates_are_ordered
        claim_type: conditional_validation
        grounds:
          - validations[priority=18]
          - validations[priority=19]
          - errors[ERR_CATEGORY_NOT_REVIEWABLE]
          - errors[ERR_REPLAY_STATION_OFFLINE]
          - entities.SeasonProgram.fields.reviewable_categories
        distinguishing_aspect: "A GAME_ADMIN review is rejected at priority 18 because that category is not in reviewable_categories even though the booth is ONLINE, while a reviewable category on an OFFLINE booth is rejected at priority 19 — configuration is checked before hardware."
        test_recipe:
          setup:
            - "SeasonProgram 2026 is OPEN with crew_size_required 1 and reviewable_categories [SCORING_PLAY, TURNOVER, PLAYER_SAFETY]."
            - "Game G1 is IN_PROGRESS; BOOTH-1 is ONLINE with capacity 2 and BOOTH-DARK is OFFLINE."
          setup_api_calls:
