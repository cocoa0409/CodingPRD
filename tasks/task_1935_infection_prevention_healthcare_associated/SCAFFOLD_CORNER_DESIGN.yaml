          nhsn_location_code: IENV
        as: PlatformAdmin
        captures:
          unit_id: $.data.id
      trigger:
      - call: GET /api/units/${unit_id}
        payload: {}
        as: InfectionPreventionist
      - call: GET /api/units
        payload:
          facility_id: ${fac_id}
        as: InfectionPreventionist
      - call: GET /api/units/00000000-0000-0000-0000-000000000000
