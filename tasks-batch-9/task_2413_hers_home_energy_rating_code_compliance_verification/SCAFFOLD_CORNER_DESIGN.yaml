              as: CertifiedRater
              as_user_id: "${y_r1}"
              captures: { y_pm1: $.data.id }
            - call: "POST /homes"
              payload: { subdivision_id: "${y_sd1}", plan_model_id: "${y_pm1}", lot_number: "L-7501", permit_date: "2026-08-05" }
              as: BuilderRep
              as_user_id: "${y_b1}"
              captures: { y_h1: $.data.id }
            - call: "POST /ratings"
              payload: { home_id: "${y_h1}", rater_id: "${y_r1}" }
              as: CertifiedRater
              as_user_id: "${y_r1}"
              captures: { y_rt1: $.data.id }
            - call: "POST /inspections"
              payload: { rating_id: "${y_rt1}", inspector_id: "${y_fi1}", checkpoint: "FINAL", scheduled_start_utc: "2026-08-20T09:00:00Z", scheduled_end_utc: "2026-08-20T11:00:00Z", air_handler_installed: true }
              as: FieldInspector
              as_user_id: "${y_fi1}"
              captures: { y_in1: $.data.id }
            - call: "POST /inspections/${y_in1}/tests"
              payload: { test_type: "BLOWER_DOOR", measured_value: 1080 }
              as: FieldInspector
              as_user_id: "${y_fi1}"
            - call: "POST /inspections/${y_in1}/tests"
              payload: { test_type: "DUCT_LEAKAGE_TOTAL", measured_value: 96 }
              as: FieldInspector
              as_user_id: "${y_fi1}"
            - call: "POST /inspections/${y_in1}/complete"
              payload: {}
              as: FieldInspector
              as_user_id: "${y_fi1}"
            - call: "POST /ratings/${y_rt1}/confirm"
              payload: {}
              as: CertifiedRater
              as_user_id: "${y_r1}"
              captures: { y_rt1_v1: $.data.version }
            - call: "POST /document-packages"
              payload: { rating_id: "${y_rt1}", package_type: "TAX_CREDIT_45L", expected_rating_version: "${y_rt1_v1}" }
              as: BuilderRep
              as_user_id: "${y_b1}"
              captures: { y_dp1a: $.data.id }
          trigger:
            - call: "POST /document-packages"
              payload: { rating_id: "${y_rt1}", package_type: "UTILITY_PROGRAM", expected_rating_version: "${y_rt1_v1}" }
              as: BuilderRep
              as_user_id: "${y_b1}"
            - call: "GET /ratings/${y_rt1}"
              payload: {}
