      - 'Call 13: HTTP 404 with data.error_id == "ERR_CLOSING_NOTICE_NOT_FOUND"'
      - Every response carries meta.api_request_id and meta.api_request_timestamp with response_type == "error"
  - name: request_missing_x_user_role_header_rejected
    claim_type: error_triggerable
    grounds:
    - errors[ERR_UNAUTHENTICATED]
    - validations[priority 1]
    distinguishing_aspect: 'Authentication is the first gate: a request with no role header is 401 even when the path id is unknown and the role would have been forbidden anyway, and an undeclared role
      name is treated as absent rather than as a forbidden role.'
    test_recipe:
      setup:
      - One Theatre and one Production exist.
      setup_api_calls:
      - call: POST /theatres
        payload:
          name: Palace Theatre
          seat_count: 1200
          top_ticket_price_cents: 19900
          changeover_buffer_days: 3
          weekly_fixed_rent_cents: 8500000
        as: GeneralManager
        as_user_id: u-gm-1
        captures:
          th: $.data.id
      - call: POST /productions
        payload:
          title: The Understudy
          offering_entity_type: LP
          capitalization_target_cents: 120000000
          reserve_target_cents: 20000000
          theatre_id: ${th}
          pre_recoupment_pool_pct: 0.35
          post_recoupment_pool_pct: 0.4
          subsidiary_rights_investor_share_pct: 0.4
          closing_notice_min_days: 14
        as: GeneralManager
        as_user_id: u-gm-1
        captures:
          pr: $.data.id
          pv: $.data.version
      trigger:
      - call: GET /productions/${pr}
        as: (X-User-Role header omitted)
        as_user_id: u-gm-1
        captures:
          e1: $.data.error_id
      - call: GET /productions/${pr}
        as: GeneralManager
        captures:
          e2: $.data.error_id
      - call: POST /productions/00000000-0000-0000-0000-0000000000ff/capitalize
        payload: {}
        as: (X-User-Role header omitted)
        as_user_id: u-ct-1
        captures:
          e3: $.data.error_id
      - call: GET /productions/${pr}
        as: BoxOfficeTreasurer
        as_user_id: u-gm-1
        captures:
          e4: $.data.error_id
      assert:
      - 'Call 1: HTTP 401 with data.error_id == "ERR_UNAUTHENTICATED"'
      - 'Call 2: HTTP 401 with data.error_id == "ERR_UNAUTHENTICATED" - X-User-ID is equally mandatory'
      - 'Call 3: HTTP 401 with data.error_id == "ERR_UNAUTHENTICATED", not ERR_PRODUCTION_NOT_FOUND and not ERR_FORBIDDEN_ROLE'
      - 'Call 4: HTTP 401 with data.error_id == "ERR_UNAUTHENTICATED" - "BoxOfficeTreasurer" is not one of the five declared roles'
- section: rbac
  instances:
  - name: exclusive_operations_are_rejected_for_the_other_four_roles
    claim_type: exclusive_operation_denied
    grounds:
    - roles.GeneralManager.exclusive_operations
    - roles.Comptroller.exclusive_operations
    - roles.SyndicationCounsel.exclusive_operations
    - roles.LeadProducer.exclusive_operations
    - roles.Investor.exclusive_operations
    - errors[ERR_FORBIDDEN_ROLE]
    distinguishing_aspect: 'The five office roles are peers under segregation of duties, so no role inherits the exclusive operations of another role: each probe below is refused at priority 2 even though
      the target row is in the right state for the action.'
    test_recipe:
      setup:
      - One Theatre and one Production exist at version 1.
