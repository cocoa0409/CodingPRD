              as: PlatformAdmin
              captures: { st_sna: $.data.id }
            - call: "POST /union-agreements"
              payload: { name: "AFA-2026", crew_type: "FLIGHT_ATTENDANT", min_rest_hours: 8, quiet_room_required: false, min_room_standard: "STANDARD", blackout_protection_required: false, max_invoice_variance_pct: 10.0 }
              as: PlatformAdmin
            - call: "POST /hotel-vendors"
              payload: { name: "John Wayne Hotel", contact_email: "ops@jwhotel.example", security_certified: true, quiet_rooms_count: 25 }
              as: PlatformAdmin
              captures: { vend_j: $.data.id }
            - call: "POST /rfp-cycles"
              payload: { station_id: "${st_sna}", title: "SNA 2026 crew hotel", response_deadline: "2026-09-10T00:00:00Z", target_room_count: 5, budget_cap_cents: 1000000 }
              as: SourcingManager
              captures: { cyc_s: $.data.id }
            - call: "POST /rfp-cycles/${cyc_s}/open"
              payload: {}
              as: SourcingManager
            - call: "POST /rfp-cycles/${cyc_s}/proposals"
              payload: { vendor_id: "${vend_j}", offered_room_count: 5, offered_rate_cents: 10000, quiet_room_commitment: 5 }
              as: HotelVendorRep
              as_user_id: "${vend_j}"
              captures: { prop_s: $.data.id }
            - call: "POST /rfp-cycles/${cyc_s}/close"
              payload: {}
              as: SourcingManager
            - call: "POST /rfp-proposals/${prop_s}/shortlist"
              payload: {}
              as: SourcingManager
            - call: "POST /rfp-cycles/${cyc_s}/open-negotiation"
              payload: {}
              as: SourcingManager
            - call: "GET /rfp-cycles/${cyc_s}"
              payload: {}
              as: SourcingManager
              captures: { cyc_s_v: $.data.version }
            - call: "POST /rfp-cycles/${cyc_s}/award"
              payload: { proposal_id: "${prop_s}", room_block_size: 5, start_date: "2026-06-01T00:00:00Z", end_date: "2026-06-11T00:00:00Z", late_cancel_hours: 24, quiet_room_standard: "ENHANCED", security_requirements: ["KEYCARD_FLOOR"], blackout_dates: [], blackout_protection: false, expected_cycle_version: "${cyc_s_v}" }
              as: SourcingManager
              captures: { ctr_k13: $.data.id }
            - call: "POST /contracts/${ctr_k13}/activate"
              payload: {}
              as: SourcingManager
            - call: "POST /layover-requirements"
              payload: { station_id: "${st_sna}", crew_type: "FLIGHT_ATTENDANT", crew_count: 4, arrival_time: "2026-06-02T18:00:00Z", departure_time: "2026-06-03T09:00:00Z", required_rest_hours: 12 }
              as: CrewOps
