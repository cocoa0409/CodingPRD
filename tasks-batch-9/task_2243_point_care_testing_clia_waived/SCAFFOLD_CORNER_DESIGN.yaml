      - name: side_effect_execution_on_temperature_excursion_cascade
        claim_type: side_effect_execution
        grounds:
          - state_machines.StorageUnit.IN_RANGE_to_EXCURSION_OPEN
          - state_machines.ReagentLot.VERIFIED_to_QUARANTINED
        excluded_because:
          difficulty_instance: transitive_cascade / temperature_excursion_quarantines_lot_locks_device_and_rejects_results
          rationale: "That §1.8 instance asserts every side effect of CASCADE-C links 1-4 (excursion opened, lot quarantined, device locked with LOT_QUARANTINE, pending result REJECTED) call by call."

      - name: parallel_dimensions_move_independently_on_operator
        claim_type: parallel
        grounds:
          - state_machines.Operator.note
          - complexity_profile.state_machine_shape
        excluded_because:
          difficulty_instance: non_linear_state_machine / operator_regains_competency_while_access_stays_locked_out
          rationale: "The independence of competency_status and access_status is exactly what that §1.8 instance falsifies."

      - name: cyclic_pt_investigation_loop_terminates_on_acceptance
        claim_type: cyclic
        grounds:
          - state_machines.ProficiencyEvent.INVESTIGATION_SUBMITTED_to_INVESTIGATION_OPEN
        excluded_because:
          difficulty_instance: non_linear_state_machine / pt_investigation_reject_cycle_then_accept_clears_unsuccessful_count
          rationale: "That instance walks the reject/resubmit loop twice and asserts investigation_round plus the terminating acceptance."

      - name: compound_inspection_state_derived_from_its_findings
        claim_type: compound
        grounds:
          - state_machines.Inspection.DEFICIENCIES_ISSUED_to_CLOSED
        excluded_because:
          difficulty_instance: non_linear_state_machine / deficiency_correction_rejection_cycle_then_close_bubbles_inspection
          rationale: "Inspection CLOSED is asserted there as a derivation from all findings reaching CLOSED, including the negative case while one finding is still open."

      - name: bubble_up_from_last_closed_finding_to_inspection
        claim_type: bubble_up
        grounds:
          - state_machines.Inspection.DEFICIENCIES_ISSUED_to_CLOSED
        excluded_because:
          difficulty_instance: non_linear_state_machine / deficiency_correction_rejection_cycle_then_close_bubbles_inspection
          rationale: "Same instance: the inspection auto-transitions only when the LAST finding closes, which that recipe asserts before and after."

      - name: cascade_down_from_certificate_suspension_to_child_rows
        claim_type: cascade_down
        grounds:
          - state_machines.CliaCertificate.ACTIVE_to_SUSPENDED
        excluded_because:
          difficulty_instance: transitive_cascade / certificate_suspension_cascades_to_site_operators_assessments_and_devices
          rationale: "CASCADE-B links 1-4 (site posture, operator lock-out, assessment voiding, manual-entry suspension) are asserted there."

      - name: cross_entity_side_effect_from_failed_qc_to_test_results
        claim_type: cross_entity
        grounds:
          - state_machines.Device.ACTIVE_to_QC_LOCKED_failure
        excluded_because:
          difficulty_instance: transitive_cascade / qc_failure_holds_results_restricts_site_and_suspends_manual_entry
          rationale: "That instance asserts the QcRun -> Device -> TestResult -> TestSite -> Device(manual_entry_suspended) chain end to end."

      - name: ledger_sync_of_open_deficiency_weight_on_finding_state_change
        claim_type: ledger_sync
        grounds:
          - entities.TestSite.fields.open_deficiency_weight
        excluded_because:
          difficulty_instance: compensating_invariant / open_deficiency_weight_ledger_restored_exactly_by_inspection_rescind
          rationale: "The derived weight ledger is reconciled before/after there, including the exact-restoration invariant."

      - name: compensation_on_qc_unlock_reverses_the_hold
        claim_type: compensation
        grounds:
          - state_machines.Device.QC_LOCKED_to_ACTIVE
        excluded_because:
          difficulty_instance: compensating_invariant / held_result_count_and_posture_restored_exactly_by_qc_unlock
          rationale: "That instance asserts every held result returns to PENDING_REVIEW with held_by_device_lock_at null and the count/posture return to their pre-lock values."

      - name: guarded_transition_qc_unlock_requires_a_verified_lot
        claim_type: guarded_transitions
        grounds:
          - state_machines.Device.QC_LOCKED_to_ACTIVE
          - validations[priority:44]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / qc_unlock_requires_verified_lot_on_the_confirming_run
          rationale: "The cross-entity guard (Device unlock gated on ReagentLot.verification_status) is the subject of that instance."

  # ===========================================================================
  # Section 3 - Calculations (claim-extraction-guide "From Table 3")
  # 13 rules: 3 threshold, 3 aggregation, 2 chronological, 2 interval_merge,
  # 1 weighted_scoring, 1 constraint_propagation, plus the two dual-variant
  # rules. The rows §1.8's dual_variant_calc / combinatorial_formula /
  # boundary_precision_check families already probe are stubbed.
  # ===========================================================================
  - section: calculations
    instances:

      - name: temperature_reading_at_both_inclusive_bounds_stays_in_range
        claim_type: threshold
        grounds:
          - calculations.temperature_disposition
          - entities.TemperatureReading.fields.disposition
          - entities.StorageUnit.fields.excursion_state
          - endpoints[POST /poct/storage-units/{id}/temperature-readings]
        distinguishing_aspect: |
          Both storage bounds are INCLUSIVE: 2.0 (exactly min_temp_c) and 8.0
          (exactly max_temp_c) are IN_RANGE and open no excursion, while 8.1 -
          one tenth of a degree past the upper bound - is OUT_OF_RANGE and is the
          reading that flips the unit to EXCURSION_OPEN with triggered_excursion
          true.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T08:00:00Z."
            - "One site with one StorageUnit whose acceptable band is min_temp_c 2.0 / max_temp_c 8.0, currently IN_RANGE with no readings and no lots stored (so the excursion cascade has nothing to quarantine)."
          setup_api_calls:
            - call: "POST /poct/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /poct/sites"
              payload: { name: "Central Lab POCT", department_code: "DEPT-1800", complexity_scope: "WAIVED" }
              as: ProgramAdmin
              captures: { site_id: $.data.id }
            - call: "POST /poct/storage-units"
              payload: { site_id: "${site_id}", name: "Reagent Fridge 1", min_temp_c: 2.0, max_temp_c: 8.0 }
              as: ProgramAdmin
              captures: { su_id: $.data.id }
          trigger:
            - call: "POST /poct/storage-units/${su_id}/temperature-readings"
              payload: { reading_c: 2.0, recorded_at: "2026-09-01T08:00:00Z", recorded_by_user_id: "probe-gateway-1" }
              as: QualityCoordinator
              captures: { d_low: $.data.disposition, trig_low: $.data.triggered_excursion }
            - call: "POST /poct/storage-units/${su_id}/temperature-readings"
              payload: { reading_c: 8.0, recorded_at: "2026-09-01T09:00:00Z", recorded_by_user_id: "probe-gateway-1" }
              as: QualityCoordinator
              captures: { d_high: $.data.disposition, trig_high: $.data.triggered_excursion }
            - call: "POST /poct/storage-units/${su_id}/temperature-readings"
              payload: { reading_c: 8.1, recorded_at: "2026-09-01T10:00:00Z", recorded_by_user_id: "probe-gateway-1" }
              as: QualityCoordinator
              captures: { d_over: $.data.disposition, trig_over: $.data.triggered_excursion }
            - call: "GET /poct/storage-units/${su_id}"
              as: QualityCoordinator
              captures: { state_after: $.data.excursion_state, opened_at: $.data.excursion_opened_at, last_c: $.data.last_reading_c }
          assert:
            - "${d_low} == \"IN_RANGE\" and ${trig_low} == false"
            - "${d_high} == \"IN_RANGE\" and ${trig_high} == false (8.0 sits exactly on the inclusive upper bound)"
            - "${d_over} == \"OUT_OF_RANGE\" and ${trig_over} == true"
            - "${state_after} == \"EXCURSION_OPEN\" and ${opened_at} == \"2026-09-01T08:00:00.000Z\" (the logical clock, not the reading's recorded_at)"
            - "${last_c} == 8.1 (greatest recorded_at wins)"
            - "StorageUnit.${su_id}.quarantined_lot_count == 0 - no lot is stored in the unit"
            - "each of the three readings has no `version` and no `updated_at` key (TemperatureReading is common_fields: false)"

      - name: retired_device_excluded_from_site_qc_compliance_index
        claim_type: input_set_filtering
        grounds:
          - calculations.site_qc_compliance_index
          - calculations.device_qc_compliance_rate
          - state_machines.Device.ACTIVE_to_RETIRED
          - entities.TestSite.fields.site_qc_compliance_index
        distinguishing_aspect: |
          The index's input set is Devices with status IN {ACTIVE, QC_LOCKED}.
          With an idle device at 100.00 and a used device at 50.00 the index is
          75.00 (readiness 90.00); retiring the 50.00 device removes it from the
          input set and the index jumps to 100.00 (readiness 100.00) even though
          its QC history is unchanged and its results still exist.
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T08:00:00Z, later advanced to 2026-08-02T08:00:00Z."
            - "Covered WAIVED site, trained operator, VERIFIED lot for GLUCO-9."
            - "Device D1 (idle): created 2026-08-01, never used, so its DAY_OF_USE denominator is 0 and its rate is 100.00 by the empty-denominator rule."
            - "Device D2 (used): both LEVEL_1 and LEVEL_2 PASS on 2026-08-01 (1 covered day), qc_frequency_days 30 so qc_next_due_at is 2026-08-31, and patient results on BOTH 2026-08-01 and 2026-08-02 (2 day-of-use days) giving 1/2 == 50.00."
            - "Both of D2's results are POSTED before retirement so the retire precondition (no PENDING_REVIEW / HELD / CORRECTION_PENDING result) holds."
          setup_api_calls:
            - call: "POST /poct/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /poct/certificates"
              payload: { certificate_number: "45D2243020", certificate_type: "CERTIFICATE_OF_WAIVER", permitted_complexity: "WAIVED", effective_date: "2026-01-01", expiration_date: "2027-12-31" }
              as: ProgramAdmin
              captures: { cert_id: $.data.id }
            - call: "POST /poct/sites"
              payload: { name: "Diabetes Center POCT", department_code: "DEPT-1900", complexity_scope: "WAIVED" }
              as: ProgramAdmin
              captures: { site_id: $.data.id }
            - call: "POST /poct/certificate-coverages"
              payload: { site_id: "${site_id}", certificate_id: "${cert_id}", coverage_start: "2026-01-01", coverage_end: "2026-12-31" }
              as: ProgramAdmin
            - call: "POST /poct/operators"
              payload: { site_id: "${site_id}", full_name: "Mira Vance", role_title: "MEDICAL_TECHNOLOGIST", hire_date: "2026-01-05" }
              as: ProgramAdmin
              captures: { op_id: $.data.id }
            - call: "POST /poct/operators/${op_id}/training"
              payload: { training_module_code: "POCT-GLUCO-101", completed_on: "2026-07-20" }
              as: QualityCoordinator
            - call: "POST /poct/devices"
              payload: { site_id: "${site_id}", device_model: "GLUCO-9", serial_number: "SN-GL-1901", analyte: "GLUCOSE", complexity_class: "WAIVED", connectivity_mode: "INTERFACED", qc_frequency_days: 30 }
              as: ProgramAdmin
              captures: { dev_1: $.data.id }
            - call: "POST /poct/devices"
              payload: { site_id: "${site_id}", device_model: "GLUCO-9", serial_number: "SN-GL-1902", analyte: "GLUCOSE", complexity_class: "WAIVED", connectivity_mode: "INTERFACED", qc_frequency_days: 30 }
              as: ProgramAdmin
              captures: { dev_2: $.data.id }
            - call: "POST /poct/storage-units"
              payload: { site_id: "${site_id}", name: "Reagent Fridge 1", min_temp_c: 2.0, max_temp_c: 8.0 }
              as: ProgramAdmin
              captures: { su_id: $.data.id }
            - call: "POST /poct/reagent-lots"
              payload: { site_id: "${site_id}", storage_unit_id: "${su_id}", device_model: "GLUCO-9", lot_number: "LOT-A1", expiration_date: "2027-01-31", received_at: "2026-08-01T08:00:00Z", control_min_level_1: 80.0, control_max_level_1: 120.0, control_min_level_2: 250.0, control_max_level_2: 350.0 }
              as: QualityCoordinator
              captures: { lot_id: $.data.id }
            - call: "POST /poct/qc-runs"
              payload: { device_id: "${dev_2}", reagent_lot_id: "${lot_id}", operator_id: "${op_id}", control_level: "LEVEL_1", measured_value: 100.0 }
              as: Operator
              as_user_id: "user-mira"
              captures: { qc1_id: $.data.id }
            - call: "POST /poct/qc-runs"
              payload: { device_id: "${dev_2}", reagent_lot_id: "${lot_id}", operator_id: "${op_id}", control_level: "LEVEL_2", measured_value: 300.0 }
              as: Operator
              as_user_id: "user-mira"
              captures: { qc2_id: $.data.id }
            - call: "POST /poct/reagent-lots/${lot_id}/verify"
              payload: { level_1_qc_run_id: "${qc1_id}", level_2_qc_run_id: "${qc2_id}" }
              as: QualityCoordinator
            - call: "POST /poct/test-results"
              payload: { device_id: "${dev_2}", operator_id: "${op_id}", reagent_lot_id: "${lot_id}", patient_mrn: "MRN-8001", analyte: "GLUCOSE", measured_value: 96.0, entry_mode: "INTERFACED" }
              as: Operator
              as_user_id: "user-mira"
              captures: { res_1: $.data.id }
            - call: "POST /poct/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /poct/test-results"
              payload: { device_id: "${dev_2}", operator_id: "${op_id}", reagent_lot_id: "${lot_id}", patient_mrn: "MRN-8002", analyte: "GLUCOSE", measured_value: 104.0, entry_mode: "INTERFACED" }
              as: Operator
              as_user_id: "user-mira"
              captures: { res_2: $.data.id }
            - call: "POST /poct/test-results/${res_1}/post"
              payload: { attestation: "reviewed against the meter tape" }
              as: Operator
              as_user_id: "${op_id}"
            - call: "POST /poct/test-results/${res_2}/post"
              payload: { attestation: "reviewed against the meter tape" }
              as: Operator
              as_user_id: "${op_id}"
          trigger:
            - call: "GET /poct/devices/${dev_2}"
              as: QualityCoordinator
              captures: { rate_2_use: $.data.qc_compliance_rate_day_of_use, use_days_2: $.data.use_day_count }
            - call: "GET /poct/sites/${site_id}"
              as: QualityCoordinator
              captures: { index_before: $.data.site_qc_compliance_index, readiness_before: $.data.inspection_readiness_score }
            - call: "POST /poct/devices/${dev_2}/retire"
              payload: { reason: "meter replaced by a connected model" }
              as: ProgramAdmin
              captures: { retired_status: $.data.status }
            - call: "GET /poct/sites/${site_id}"
              as: QualityCoordinator
              captures: { index_after: $.data.site_qc_compliance_index, readiness_after: $.data.inspection_readiness_score }
          assert:
            - "${use_days_2} == 2 and ${rate_2_use} == 50.00 (numerator 1 covered day / denominator 2 day-of-use days)"
            - "Device.${dev_1}.qc_compliance_rate_day_of_use == 100.00 (denominator 0 -> the empty-denominator rule, not 0.00)"
            - "${index_before} == 75.00 (step 1 rounds to whole percents 100 and 50; step 2 averages to 75.00)"
            - "${readiness_before} == 90.00 (qc_penalty == min(20.00, (100 - 75) * 0.40) == 10.00; every other penalty 0.00)"
            - "${retired_status} == \"RETIRED\""
            - "${index_after} == 100.00 - only D1 remains in the input set"
            - "${readiness_after} == 100.00"
            - "Device.${dev_2}.qc_compliance_rate_day_of_use is still 50.00 - retirement removes the device from the index, it does not rewrite its own rate"
            - "GET /poct/test-results?device_id=${dev_2} still returns meta.total_count == 2, both POSTED"

      - name: repeat_finding_multiplier_doubles_weight_only_after_the_prior_finding_closed
        claim_type: chronological
        grounds:
          - calculations.deficiency_weight
          - entities.DeficiencyFinding.fields.repeat_multiplier
          - entities.Inspection.fields.issued_weight_total
        distinguishing_aspect: |
          The repeat multiplier requires a strictly-earlier CLOSED finding at the
          same site in the same category. In one issuance the QUALITY_CONTROL
          finding weighs 6.00 (3.0 x 2.0, because an earlier QUALITY_CONTROL
          finding was closed) while the REAGENT_STORAGE finding of identical
          severity weighs only 3.00 - category-scoped, not site-wide.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T08:00:00Z."
            - "Covered WAIVED site. Inspection 1 raised ONE STANDARD_LEVEL QUALITY_CONTROL finding, issued it (weight 3.00, multiplier 1.0), the site submitted a plan of correction and a DIFFERENT surveyor accepted it, so that finding is CLOSED and inspection 1 bubbled to CLOSED."
            - "Inspection 2 then raises two STANDARD_LEVEL findings - one QUALITY_CONTROL (repeat) and one REAGENT_STORAGE (first occurrence) - both still DRAFT at weight 0.00 until issuance."
          setup_api_calls:
            - call: "POST /poct/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /poct/certificates"
              payload: { certificate_number: "45D2243021", certificate_type: "CERTIFICATE_OF_WAIVER", permitted_complexity: "WAIVED", effective_date: "2026-01-01", expiration_date: "2027-12-31" }
              as: ProgramAdmin
              captures: { cert_id: $.data.id }
            - call: "POST /poct/sites"
              payload: { name: "Ortho Clinic POCT", department_code: "DEPT-2000", complexity_scope: "WAIVED" }
              as: ProgramAdmin
              captures: { site_id: $.data.id }
            - call: "POST /poct/certificate-coverages"
              payload: { site_id: "${site_id}", certificate_id: "${cert_id}", coverage_start: "2026-01-01", coverage_end: "2026-12-31" }
              as: ProgramAdmin
            - call: "POST /poct/inspections"
              payload: { site_id: "${site_id}", inspection_type: "BIENNIAL_SURVEY", scheduled_date: "2026-03-01" }
              as: Surveyor
              as_user_id: "surveyor-alpha"
              captures: { insp_1: $.data.id }
            - call: "POST /poct/deficiencies"
              payload: { inspection_id: "${insp_1}", category: "QUALITY_CONTROL", severity: "STANDARD_LEVEL", description: "QC not run on the days of patient testing", correction_due_date: "2026-04-30" }
              as: Surveyor
              as_user_id: "surveyor-alpha"
              captures: { def_old: $.data.id }
            - call: "POST /poct/inspections/${insp_1}/issue"
              payload: { issued_on: "2026-03-01" }
              as: Surveyor
              as_user_id: "surveyor-alpha"
              captures: { total_1: $.data.issued_weight_total }
            - call: "POST /poct/deficiencies/${def_old}/correction"
              payload: { correction_narrative: "QC schedule enforced in the meter software", evidence_ref: "EV-QC-100" }
              as: QualityCoordinator
            - call: "POST /poct/deficiencies/${def_old}/correction-decision"
              payload: { decision: "ACCEPT", note: "evidence sufficient" }
              as: Surveyor
              as_user_id: "surveyor-beta"
              captures: { old_status: $.data.status }
            - call: "POST /poct/inspections"
              payload: { site_id: "${site_id}", inspection_type: "BIENNIAL_SURVEY", scheduled_date: "2026-09-01" }
              as: Surveyor
              as_user_id: "surveyor-alpha"
              captures: { insp_2: $.data.id }
            - call: "POST /poct/deficiencies"
              payload: { inspection_id: "${insp_2}", category: "QUALITY_CONTROL", severity: "STANDARD_LEVEL", description: "QC gaps recurred in August", correction_due_date: "2026-10-31" }
              as: Surveyor
              as_user_id: "surveyor-alpha"
              captures: { def_repeat: $.data.id }
            - call: "POST /poct/deficiencies"
              payload: { inspection_id: "${insp_2}", category: "REAGENT_STORAGE", severity: "STANDARD_LEVEL", description: "Fridge temperature log incomplete", correction_due_date: "2026-10-31" }
              as: Surveyor
              as_user_id: "surveyor-alpha"
              captures: { def_first: $.data.id }
          trigger:
            - call: "POST /poct/inspections/${insp_2}/issue"
              payload: { issued_on: "2026-09-01" }
              as: Surveyor
              as_user_id: "surveyor-alpha"
              captures: { total_2: $.data.issued_weight_total, readiness_at_issue: $.data.readiness_score_at_issue }
            - call: "GET /poct/sites/${site_id}"
              as: QualityCoordinator
              captures: { weight_after: $.data.open_deficiency_weight, posture_after: $.data.oversight_posture, readiness_after: $.data.inspection_readiness_score }
          assert:
            - "${total_1} == 3.00 and ${old_status} == \"CLOSED\" (no earlier CLOSED QUALITY_CONTROL finding existed at issuance, so multiplier 1.0)"
            - "Inspection.${insp_1}.status == CLOSED after its only finding closed"
            - "DeficiencyFinding.${def_repeat}.repeat_multiplier == 2.0 and .weight == 6.00"
            - "DeficiencyFinding.${def_first}.repeat_multiplier == 1.0 and .weight == 3.00 - same severity, different category, no closed predecessor"
            - "${total_2} == 9.00"
            - "${weight_after} == 9.00 (the CLOSED 2026-03-01 finding is excluded from the open ledger)"
            - "${posture_after} == \"RESTRICTED\" (9.00 >= 6.00, below the 16.00 suspension threshold)"
            - "${readiness_at_issue} == 77.50 and ${readiness_after} == 77.50 (deficiency_penalty == min(50.00, 9.00 * 2.5) == 22.50)"

      - name: grace_window_propagates_from_posture_snapshot_to_lapse_deadline
        claim_type: constraint_propagation
        grounds:
          - calculations.operator_access_grace_and_lockout
          - entities.Operator.fields.current_grace_days
          - entities.Operator.fields.lapse_deadline
          - endpoints[POST /poct/oversight-runs]
        distinguishing_aspect: |
          The chain posture -> grace -> deadline -> lock-out reaches a fixed point
          in ONE pass: with the phase-0 posture OPEN a MEDICAL_TECHNOLOGIST gets
          14 grace days on a 2026-09-15 expiry, so lapse_deadline is 2026-09-29
          and a run ON 2026-09-29 does NOT lapse (strict `>`), while a run on
          2026-09-30 does. The PHYSICIAN director simultaneously shows the other
          branch of the constant (30 grace days) with a null deadline.
        test_recipe:
