# =============================================================================
# SCAFFOLD — Imaging Facility Accreditation, Phantom Testing & Physicist Survey
# §1.0–§1.7 of the PRD Benchmark Scaffold Generator specification.
# =============================================================================

scenario: |
  Imaging Facility Accreditation, Phantom Testing & Physicist Survey (American College of Radiology): modality-specific accreditation applications with unit-level enrollment and equipment inventory, clinical image submission for review against acceptance criteria with pass, deficiency or failure outcomes, phantom image acquisition and scoring for spatial resolution, contrast and artifact detection, medical physicist survey reports covering dose measurement, equipment performance and shielding, personnel qualification review for interpreting physicians, technologists and physicists with continuing education, corrective action and resubmission cycles with testing deadlines that affect payer participation, accreditation cycle renewal with random site audits, dose registry participation and benchmark reporting

domain_name: imaging-facility-accreditation
api_prefix: /accreditation

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: posture_driven_gating
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - self_referential
  role_model: segregation_of_duties
  consistency_model: immediate

  entity_count: 10
  state_machine_count: 10
  calculation_count: 8
  validation_layers: 10
  endpoint_count: 58
  error_code_count: 41
  role_count: 5

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: Facility
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, required: true, description: "Legal facility name" }
      - { name: state_code, type: string, source: input, required: true, description: "Two-letter US state code of the facility" }
      - { name: facility_type, type: enum, source: input, required: true, description: "HOSPITAL | IMAGING_CENTER | MOBILE_UNIT", constraints: "enum members: HOSPITAL, IMAGING_CENTER, MOBILE_UNIT" }
      - { name: facility_status, type: enum, source: system, description: "PENDING | ENROLLED | DEFERRED | SUSPENDED", constraints: "enum members: PENDING, ENROLLED, DEFERRED, SUSPENDED" }
      - { name: accreditation_currency, type: enum, source: computed, description: "Compound posture derived from children: PROVISIONAL | CURRENT | LAPSED | SUSPENDED", constraints: "enum members: PROVISIONAL, CURRENT, LAPSED, SUSPENDED" }
      - { name: payer_participation_status, type: enum, source: computed, description: "ACTIVE | AT_RISK | REVOKED", constraints: "enum members: ACTIVE, AT_RISK, REVOKED" }
      - { name: registry_credit_cents, type: integer, source: computed, default: 0, description: "Prepaid dose-registry submission credit in cents; never negative" }
      - { name: enrolled_unit_count, type: integer, source: computed, default: 0, description: "Count of ModalityUnit rows with unit_status ENROLLED" }
      - { name: deferred_unit_count, type: integer, source: computed, default: 0, description: "Count of ModalityUnit rows with unit_status DEFERRED" }
      - { name: current_cycle_index, type: integer, source: computed, default: 0, description: "cycle_index of the most recently created AccreditationCycle" }
      - { name: rejected_survey_count, type: integer, source: computed, default: 0, description: "Count of PhysicistSurvey rows with survey_status REJECTED" }
      - { name: roster_disposition, type: enum, source: computed, default: CLEAR, description: "roster_deficiency_aggregation output over this facility's PersonnelQualification rows: CLEAR | HOLD | HALT", constraints: "enum members: CLEAR, HOLD, HALT" }

  - name: ModalityUnit
    parent: Facility
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: input, required: true, description: "FK -> Facility.id; owning facility" }
      - { name: modality_code, type: enum, source: input, required: true, description: "MRI | CT | MAMM | PET | US", constraints: "enum members: MRI, CT, MAMM, PET, US" }
      - { name: unit_label, type: string, source: input, required: true, description: "Operator-facing unit label; unique within a facility" }
      - { name: unit_status, type: enum, source: system, description: "ENROLLED | DEFERRED | WITHDRAWN", constraints: "enum members: ENROLLED, DEFERRED, WITHDRAWN" }
      - { name: clinical_deadline_at, type: datetime, source: computed, description: "Deadline by which an outstanding clinical image submission must be accepted" }
      - { name: testing_deadline_at, type: datetime, source: computed, description: "Deadline by which outstanding phantom testing must pass" }
      - { name: phantom_attempt_count, type: integer, source: computed, default: 0, description: "Count of PhantomTest rows scored (PASS or FAIL) on this unit" }
      - { name: phantom_failure_count, type: integer, source: computed, default: 0, description: "Count of PhantomTest rows with result_status FAIL on this unit" }
      - { name: deficiency_open_count, type: integer, source: computed, default: 0, description: "Count of CorrectiveActionPlan rows with plan_status OPEN or SUBMITTED for this unit" }
      - { name: last_phantom_score, type: number, source: computed, description: "phantom_total_score of the most recently scored PhantomTest on this unit, null before any scoring" }
      - { name: last_survey_at, type: datetime, source: computed, description: "performed_at of the most recent non-rejected PhysicistSurvey covering this unit's facility, null if none" }

  - name: EquipmentItem
    parent: ModalityUnit
    common_fields: true
    fields:
      - { name: unit_id, type: string, source: input, required: true, description: "FK -> ModalityUnit.id; unit the equipment is commissioned to" }
      - { name: manufacturer, type: string, source: input, required: true, description: "Equipment manufacturer" }
      - { name: model_number, type: string, source: input, required: true, description: "Manufacturer model number" }
      - { name: serial_number, type: string, source: input, required: true, description: "Equipment serial number; unique within a facility" }
      - { name: modality_code, type: enum, source: input, required: true, description: "MRI | CT | MAMM | PET | US", constraints: "enum members: MRI, CT, MAMM, PET, US" }
      - { name: installed_on, type: datetime, source: input, required: true, description: "Installation date" }
      - { name: equipment_status, type: enum, source: system, description: "ACTIVE | OUT_OF_SERVICE | RETIRED", constraints: "enum members: ACTIVE, OUT_OF_SERVICE, RETIRED" }
      - { name: performance_verdict, type: enum, source: computed, default: PENDING, description: "PASS | FAIL | PENDING; set by the most recent accepted PhysicistSurvey covering the owning unit", constraints: "enum members: PASS, FAIL, PENDING" }

  - name: ClinicalImageSubmission
    parent: ModalityUnit
    common_fields: true
    fields:
      - { name: unit_id, type: string, source: input, required: true, description: "FK -> ModalityUnit.id; unit the images were acquired on" }
      - { name: image_type, type: enum, source: input, required: true, description: "CLINICAL | PHANTOM_REFERENCE", constraints: "enum members: CLINICAL, PHANTOM_REFERENCE" }
      - { name: submitted_at, type: datetime, source: input, required: true, description: "Timestamp the image set was submitted" }
      - { name: reviewer_note_code, type: string, source: input, required: true, description: "Freeform reviewer note code supplied with the submission" }
      - { name: required_view_count, type: integer, source: input, required: true, description: "Number of views the acceptance criteria require" }
      - { name: accepted_view_count, type: integer, source: input, required: true, description: "Number of views that satisfy the acceptance criteria" }
      - { name: resubmission_of_submission_id, type: string, source: input, required: false, description: "FK -> ClinicalImageSubmission.id; prior submission this one resubmits; null for a first submission" }
      - { name: review_status, type: enum, source: system, description: "PENDING_REVIEW | ACCEPTED | DEFICIENCY | FAILED | RESUBMITTED", constraints: "enum members: PENDING_REVIEW, ACCEPTED, DEFICIENCY, FAILED, RESUBMITTED" }
      - { name: deficiency_code, type: enum, source: computed, default: NONE, description: "NONE | IMAGE_QUALITY | POSITIONING | ARTIFACT | DOSE", constraints: "enum members: NONE, IMAGE_QUALITY, POSITIONING, ARTIFACT, DOSE" }
      - { name: review_outcome_score, type: number, source: computed, description: "clinical_review_outcome score for this submission; null until reviewed" }
      - { name: deficiency_issued_at, type: datetime, source: computed, description: "Timestamp the deficiency or failure outcome was issued; null while not in DEFICIENCY/FAILED" }
      - { name: deficiency_deadline_at, type: datetime, source: computed, description: "Deadline by which the deficiency must be answered; null while not in DEFICIENCY/FAILED" }
      - { name: resubmission_round, type: integer, source: computed, default: 0, description: "0 for a first submission; parent's resubmission_round + 1 for a resubmission" }
      - { name: corrective_action_plan_id, type: string, source: computed, description: "id of the CorrectiveActionPlan created by this submission's deficiency or failure outcome; null while PENDING_REVIEW or when the outcome was ACCEPT" }

  - name: PhantomTest
    parent: ModalityUnit
    common_fields: true
    fields:
      - { name: unit_id, type: string, source: input, required: true, description: "FK -> ModalityUnit.id; unit the phantom is acquired on" }
      - { name: phantom_serial_code, type: string, source: input, required: true, description: "Identifier of the phantom object used" }
      - { name: acquired_at, type: datetime, source: input, required: true, description: "Start of the phantom acquisition window on the unit" }
      - { name: duration_minutes, type: integer, source: input, required: true, description: "Length of the acquisition window in minutes" }
      - { name: spatial_resolution_score, type: number, source: input, required: false, description: "Spatial resolution sub-score (0–10); null until scored" }
      - { name: contrast_score, type: number, source: input, required: false, description: "Contrast detection sub-score (0–10); null until scored" }
      - { name: artifact_score, type: number, source: input, required: false, description: "Artifact detection sub-score (0–10); null until scored" }
      - { name: phantom_total_score, type: number, source: computed, description: "phantom_composite_score output; null until scored" }
      - { name: result_status, type: enum, source: system, description: "ACQUIRED | SCORED | PASS | FAIL | VOIDED", constraints: "enum members: ACQUIRED, SCORED, PASS, FAIL, VOIDED" }
      - { name: scored_at, type: datetime, source: computed, description: "Timestamp of scoring; null until scored" }

  - name: PhysicistSurvey
    parent: Facility
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: input, required: true, description: "FK -> Facility.id; facility surveyed" }
      - { name: physicist_qualification_id, type: string, source: input, required: true, description: "FK -> PersonnelQualification.id; credentialed physicist who performed the survey" }
      - { name: survey_type, type: enum, source: input, required: true, description: "ANNUAL | INITIAL | POST_REPAIR", constraints: "enum members: ANNUAL, INITIAL, POST_REPAIR" }
      - { name: scheduled_at, type: datetime, source: input, required: true, description: "Scheduled survey date" }
      - { name: performed_at, type: datetime, source: input, required: false, description: "Actual survey date; null until performed" }
      - { name: reference_entrance_dose_mgy, type: number, source: input, required: true, description: "Reference (baseline) entrance dose in mGy for the protocol" }
      - { name: measured_entrance_dose_mgy, type: number, source: input, required: false, description: "Measured entrance dose in mGy; null until performed" }
      - { name: shielding_verdict, type: enum, source: input, required: false, description: "PASS | FAIL shielding assessment; null until performed", constraints: "enum members: PASS, FAIL" }
      - { name: dose_deviation_pct, type: number, source: computed, description: "survey_dose_deviation output; null until performed" }
      - { name: survey_status, type: enum, source: system, description: "SCHEDULED | SUBMITTED | ACCEPTED | REJECTED | CORRECTIVE_REQUIRED | RESUBMITTED", constraints: "enum members: SCHEDULED, SUBMITTED, ACCEPTED, REJECTED, CORRECTIVE_REQUIRED, RESUBMITTED" }
      - { name: rejection_code, type: enum, source: computed, default: NONE, description: "NONE | CREDENTIAL_LAPSED | DOSE_OUT_OF_RANGE | SHIELDING_FAILED | DOCUMENTATION_INCOMPLETE", constraints: "enum members: NONE, CREDENTIAL_LAPSED, DOSE_OUT_OF_RANGE, SHIELDING_FAILED, DOCUMENTATION_INCOMPLETE" }
      - { name: unit_id, type: string, source: input, required: false, description: "Optional specific unit the survey equipment-performance verdict applies to; null means facility-wide" }

  - name: PersonnelQualification
    parent: Facility
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: input, required: true, description: "FK -> Facility.id; facility the person is credentialed at" }
      - { name: person_name, type: string, source: input, required: true, description: "Full name of the credentialed person" }
      - { name: personnel_role, type: enum, source: input, required: true, description: "INTERPRETING_PHYSICIAN | TECHNOLOGIST | MEDICAL_PHYSICIST", constraints: "enum members: INTERPRETING_PHYSICIAN, TECHNOLOGIST, MEDICAL_PHYSICIST" }
      - { name: credential_number, type: string, source: input, required: true, description: "Credentialing-board number; globally unique" }
      - { name: ce_credit_hours, type: number, source: input, required: true, description: "Continuing-education credit hours earned in the current cycle" }
      - { name: required_ce_hours, type: number, source: input, required: true, description: "Continuing-education credit hours required for the role" }
      - { name: credential_expires_on, type: datetime, source: input, required: true, description: "Expiry date of the credential" }
      - { name: credential_status, type: enum, source: system, description: "PENDING | VERIFIED | LAPSED | REVOKED", constraints: "enum members: PENDING, VERIFIED, LAPSED, REVOKED" }
      - { name: qualification_verified_at, type: datetime, source: computed, description: "Timestamp of the most recent successful verification; null if never verified" }
      - { name: survey_count, type: integer, source: computed, default: 0, description: "Count of PhysicistSurvey rows naming this qualification that are not REJECTED" }

  - name: CorrectiveActionPlan
    parent: Facility
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: input, required: true, description: "FK -> Facility.id; facility answering the deficiency" }
      - { name: source_submission_id, type: string, source: input, required: true, description: "FK -> ClinicalImageSubmission.id; the deficient or failed submission this plan answers" }
      - { name: deficiency_code, type: enum, source: input, required: true, description: "IMAGE_QUALITY | POSITIONING | ARTIFACT | DOSE", constraints: "enum members: IMAGE_QUALITY, POSITIONING, ARTIFACT, DOSE" }
      - { name: plan_status, type: enum, source: system, description: "OPEN | SUBMITTED | ACCEPTED | REJECTED | EXPIRED", constraints: "enum members: OPEN, SUBMITTED, ACCEPTED, REJECTED, EXPIRED" }
      - { name: deadline_status, type: enum, source: computed, description: "ON_TRACK | DUE_SOON | OVERDUE", constraints: "enum members: ON_TRACK, DUE_SOON, OVERDUE" }
      - { name: due_at, type: datetime, source: computed, description: "Date the plan response is due, from corrective_action_deadline" }
      - { name: resubmission_deadline_at, type: datetime, source: computed, description: "Deadline for the answering clinical image resubmission" }
      - { name: resubmission_attempts, type: integer, source: computed, default: 0, description: "Number of times this plan has been rejected and reopened" }

  - name: AccreditationCycle
    parent: Facility
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: input, required: true, description: "FK -> Facility.id; facility the cycle accredits" }
      - { name: cycle_index, type: integer, source: input, required: true, description: "Monotonic cycle number within the facility, starting at 1" }
      - { name: cycle_started_at, type: datetime, source: input, required: true, description: "Start date of the accreditation cycle" }
      - { name: cycle_status, type: enum, source: system, description: "PENDING | ACTIVE | RENEWAL_DUE | RENEWED | LAPSED", constraints: "enum members: PENDING, ACTIVE, RENEWAL_DUE, RENEWED, LAPSED" }
      - { name: cycle_expires_at, type: datetime, source: computed, description: "cycle_started_at + 3 years" }
      - { name: prior_cycle_id, type: string, source: input, required: false, description: "FK -> AccreditationCycle.id; the cycle this one renews; null for the first cycle" }
      - { name: benchmark_submission_status, type: enum, source: computed, default: NOT_STARTED, description: "NOT_STARTED | PARTIAL | COMPLETE | OVERDUE", constraints: "enum members: NOT_STARTED, PARTIAL, COMPLETE, OVERDUE" }
      - { name: audit_selection_status, type: enum, source: computed, default: NOT_APPLICABLE, description: "NOT_APPLICABLE | SELECTED | WAIVED", constraints: "enum members: NOT_APPLICABLE, SELECTED, WAIVED" }
      - { name: audit_outcome, type: enum, source: computed, default: PENDING, description: "PENDING | PASS | FAIL", constraints: "enum members: PENDING, PASS, FAIL" }
      - { name: unit_count_at_start, type: integer, source: computed, description: "Count of ModalityUnit rows with unit_status ENROLLED at activation" }

  - name: DoseRegistryRecord
    parent: ModalityUnit
    common_fields: true
    fields:
      - { name: unit_id, type: string, source: input, required: true, description: "FK -> ModalityUnit.id; unit whose dose index is reported" }
      - { name: exam_category_code, type: enum, source: input, required: true, description: "CT_HEAD | CT_ABDOMEN | MAMM_SCREEN | PET_TORSO", constraints: "enum members: CT_HEAD, CT_ABDOMEN, MAMM_SCREEN, PET_TORSO" }
      - { name: exam_month, type: datetime, source: input, required: true, description: "First day of the reporting month; unique with (unit_id, exam_category_code)" }
      - { name: dose_index_value, type: number, source: input, required: true, description: "Measured dose index for the category and month" }
      - { name: benchmark_status, type: enum, source: computed, default: NOT_EVALUATED, description: "NOT_EVALUATED | WITHIN_BENCHMARK | ABOVE_BENCHMARK | CRITICAL", constraints: "enum members: NOT_EVALUATED, WITHIN_BENCHMARK, ABOVE_BENCHMARK, CRITICAL" }
      - { name: submission_status, type: enum, source: system, description: "STAGED | SUBMITTED | REJECTED", constraints: "enum members: STAGED, SUBMITTED, REJECTED" }
      - { name: submitted_at, type: datetime, source: computed, description: "Timestamp the record was accepted into the registry; null while STAGED" }
      - { name: benchmark_comparison_value, type: number, source: computed, description: "registry_benchmark_classification output: the comparison dose index applied to this record" }
      - { name: dose_benchmark_average, type: number, source: computed, description: "facility_dose_index_benchmark output: the unit-and-category dose index average in which this record was aggregated; null while STAGED" }
      - { name: registry_fee_cents, type: integer, source: computed, default: 0, description: "Submission fee debited on submit (2500) and credited back on rejection (2500); 0 while STAGED" }# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  - entity: Facility
    field: facility_status
    initial_state: PENDING
    terminal_states: []
    transitions:
      - from: PENDING
        to: ENROLLED
        trigger: "POST /accreditation/facilities/{facility_id}/register"
        actor: FacilityAdmin
        preconditions:
          - "at least one ModalityUnit exists for this facility"
          - "every ModalityUnit of this facility has unit_status ENROLLED"
          - "every EquipmentItem of this facility has equipment_status ACTIVE"
        side_effects:
          - "Facility.accreditation_currency = PROVISIONAL"
          - "Facility.payer_participation_status = ACTIVE"
          - "Facility.enrolled_unit_count = count of ModalityUnit rows with unit_status ENROLLED"
          - "Facility.rejected_survey_count = 0"
      - from: ENROLLED
        to: SUSPENDED
        trigger: "POST /accreditation/facilities/{facility_id}/suspend"
        actor: AccreditationBody
        preconditions:
          - "at least one ModalityUnit of the facility has unit_status in {ENROLLED, DEFERRED}"
        side_effects:
          - "Facility.accreditation_currency = SUSPENDED"
          - "Facility.payer_participation_status = REVOKED"
          - "every ModalityUnit of this facility with unit_status ENROLLED becomes DEFERRED"
      - from: DEFERRED
        to: PENDING
        trigger: "POST /accreditation/facilities/{facility_id}/reinstate"
        actor: AccreditationBody
        preconditions:
          - "all CorrectiveActionPlan rows of this facility have plan_status in {ACCEPTED, EXPIRED}"
        side_effects:
          - "Facility.payer_participation_status = AT_RISK"
          - "Facility.rejected_survey_count = 0"

  - entity: ModalityUnit
    field: unit_status
    initial_state: ENROLLED
    terminal_states: [WITHDRAWN]
    transitions:
      - from: ENROLLED
        to: DEFERRED
        trigger: "system transition when the owning Facility.facility_status becomes SUSPENDED, or an AccreditationCycle of the facility is rejected"
        actor: system
        preconditions:
          - "owning Facility.facility_status in {SUSPENDED, DEFERRED} or owning cycle consent disposition is REJECTED"
        side_effects:
          - "every EquipmentItem of this unit becomes equipment_status OUT_OF_SERVICE"
          - "every CorrectiveActionPlan of this facility becomes plan_status EXPIRED"
          - "owning Facility.enrolled_unit_count = count of ModalityUnit rows with unit_status ENROLLED"
          - "owning Facility.deferred_unit_count = count of ModalityUnit rows with unit_status DEFERRED"
      - from: ENROLLED
        to: WITHDRAWN
        trigger: "POST /accreditation/modality-units/{unit_id}/withdraw"
        actor: FacilityAdmin
        preconditions:
          - "no ClinicalImageSubmission of this unit has review_status PENDING_REVIEW"
          - "no PhantomTest of this unit has result_status ACQUIRED"
          - "no CorrectiveActionPlan of this facility referencing this unit has plan_status OPEN or SUBMITTED"
        side_effects:
          - "every EquipmentItem of this unit becomes equipment_status RETIRED"
          - "owning Facility.enrolled_unit_count = count of ModalityUnit rows with unit_status ENROLLED"

  - entity: EquipmentItem
    field: equipment_status
    initial_state: ACTIVE
    terminal_states: [RETIRED]
    transitions:
      - from: ACTIVE
        to: OUT_OF_SERVICE
        trigger: "POST /accreditation/equipment/{equipment_id}/take-out-of-service"
        actor: FacilityAdmin
        preconditions:
          - "no PhantomTest of the owning unit has result_status ACQUIRED"
        side_effects:
          - "owning ModalityUnit.clinical_deadline_at and testing_deadline_at are left unchanged"
      - from: OUT_OF_SERVICE
        to: ACTIVE
        trigger: "POST /accreditation/equipment/{equipment_id}/return-to-service"
        actor: FacilityAdmin
        preconditions:
          - "the owning unit has at least one PhysicistSurvey with survey_status ACCEPTED whose unit_id equals this unit"
        side_effects:
          - "EquipmentItem.performance_verdict = PENDING"
      - from: ACTIVE
        to: OUT_OF_SERVICE
        trigger: "system transition when the owning ModalityUnit becomes DEFERRED"
        actor: system
        preconditions:
          - "the owning ModalityUnit has unit_status DEFERRED"
        side_effects:
          - "every PhantomTest of the owning unit with result_status ACQUIRED becomes result_status VOIDED"
          - "owning ModalityUnit.phantom_attempt_count = count of PhantomTest rows with result_status in {SCORED, PASS, FAIL}"
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /accreditation/equipment/{equipment_id}/retire"
        actor: FacilityAdmin
        preconditions:
          - "the owning unit has at least one other EquipmentItem with equipment_status ACTIVE"
        side_effects:
          - "EquipmentItem.performance_verdict is frozen at its current value"

  - entity: ClinicalImageSubmission
    field: review_status
    initial_state: PENDING_REVIEW
    terminal_states: [ACCEPTED, FAILED, RESUBMITTED]
    transitions:
      - from: PENDING_REVIEW
        to: ACCEPTED
        trigger: "POST /facility-approvals/{approval_id}/decide is not used here; the reviewer action is POST /accreditation/clinical-image-submissions/{submission_id}/review with review_outcome ACCEPT"
        actor: AccreditationBody
        preconditions:
          - "no open CorrectiveActionPlan with deadline_status OVERDUE exists for this facility"
          - "every PersonnelQualification of this facility with personnel_role in {INTERPRETING_PHYSICIAN, TECHNOLOGIST} has credential_status VERIFIED"
          - "accepted_view_count >= required_view_count"
          - "Facility.registry_credit_cents >= 0"
        side_effects:
          - "ClinicalImageSubmission.review_outcome_score = resolved by clinical_review_outcome"
          - "ClinicalImageSubmission.deficiency_code = NONE"
          - "owning ModalityUnit.clinical_deadline_at = submitted_at + 547 days"
          - "every CorrectiveActionPlan of this facility whose source_submission_id belongs to the owning unit and whose plan_status == SUBMITTED becomes plan_status ACCEPTED"
          - "owning ModalityUnit.deficiency_open_count = count of CorrectiveActionPlan rows with plan_status in {OPEN, SUBMITTED} for this unit"
          - "if owning ModalityUnit.deficiency_open_count == 0 and every other ModalityUnit of this facility has deficiency_open_count == 0, then Facility.payer_participation_status = ACTIVE"
      - from: PENDING_REVIEW
        to: DEFICIENCY
        trigger: "POST /accreditation/clinical-image-submissions/{submission_id}/review with complaint_disposition with review_outcome ACCEPT_WITH_DEFICIENCY"
        actor: AccreditationBody
        preconditions:
          - "accepted_view_count < required_view_count"
          - "accepted_view_count > 0"
          - "a PersonnelQualification of this facility with personnel_role == MEDICAL_PHYSICIST exists with credential_status VERIFIED"
        side_effects:
          - "ClinicalImageSubmission.deficiency_code = complaint_disposition.category"
          - "ClinicalImageSubmission.review_outcome_score = resolved by clinical_review_outcome"
          - "ClinicalImageSubmission.deficiency_issued_at = ClinicalImageSubmission.submitted_at"
          - "ClinicalImageSubmission.deficiency_deadline_at = submitted_at + 45 days"
          - "a CorrectiveActionPlan is created with plan_status OPEN, deficiency_code = ClinicalImageSubmission.deficiency_code, source_submission_id = this submission, due_at = ClinicalImageSubmission.deficiency_deadline_at, and resubmission_deadline_at = due_at"
          - "ClinicalImageSubmission.corrective_action_plan_id = the id of that CorrectiveActionPlan"
          - "every CorrectiveActionPlan of this facility with plan_status SUBMITTED and a null resubmission_deadline_at gains resubmission_deadline_at = submitted_at + 45 days"
          - "owning ModalityUnit.deficiency_open_count = count of CorrectiveActionPlan rows with plan_status in {OPEN, SUBMITTED} for this unit"
          - "owning ModalityUnit.clinical_deadline_at = max(current clinical_deadline_at, ClinicalImageSubmission.deficiency_deadline_at)"
          - "owning ModalityUnit.deadline_status of each CorrectiveActionPlan is recomputed by corrective_action_deadline"
          - "Facility.payer_participation_status = AT_RISK"
      - from: PENDING_REVIEW
        to: FAILED
        trigger: "POST /accreditation/clinical-image-submissions/{submission_id}/review with review_outcome FAIL"
        actor: AccreditationBody
        preconditions:
          - "the request supplies review_outcome FAIL with accepted_view_count > 0, exercising clinical_review_outcome's reviewer_reported_outcome variant against its coverage_derived_outcome variant"
        side_effects:
          - "ClinicalImageSubmission.deficiency_code = IMAGE_QUALITY"
          - "ClinicalImageSubmission.review_outcome_score = resolved by clinical_review_outcome"
          - "ClinicalImageSubmission.deficiency_issued_at = ClinicalImageSubmission.submitted_at"
          - "ClinicalImageSubmission.deficiency_deadline_at = submitted_at + 45 days"
          - "a CorrectiveActionPlan is created with plan_status OPEN, deficiency_code IMAGE_QUALITY, source_submission_id = this submission, due_at = ClinicalImageSubmission.deficiency_deadline_at, resubmission_deadline_at = due_at"
          - "ClinicalImageSubmission.corrective_action_plan_id = the id of that CorrectiveActionPlan"
          - "owning ModalityUnit.deficiency_open_count = count of CorrectiveActionPlan rows with plan_status in {OPEN, SUBMITTED} for this unit"
          - "Facility.payer_participation_status = AT_RISK"
      - from: DEFICIENCY
        to: RESUBMITTED
        trigger: "POST /accreditation/clinical-image-submissions/{submission_id}/resubmit"
        actor: FacilityAdmin
        preconditions:
          - "review_status == DEFICIENCY"
          - "a CorrectiveActionPlan exists with source_submission_id == this submission and plan_status in {OPEN, SUBMITTED}"
          - "the referenced CorrectiveActionPlan has deadline_status in {ON_TRACK, DUE_SOON}"
        side_effects:
          - "a new ClinicalImageSubmission is created with review_status PENDING_REVIEW and resubmission_round = this submission's resubmission_round + 1"
          - "the new ClinicalImageSubmission.resubmission_of_submission_id = this submission's id"
          - "owning ModalityUnit.deficiency_open_count = count of CorrectiveActionPlan rows with plan_status in {OPEN, SUBMITTED} for this unit"
      - from: FAILED
        to: RESUBMITTED
        trigger: "POST /accreditation/clinical-image-submissions/{submission_id}/resubmit"
        actor: FacilityAdmin
        preconditions:
          - "review_status == FAILED"
          - "a CorrectiveActionPlan exists with source_submission_id == this submission and plan_status in {OPEN, SUBMITTED}"
          - "the referenced CorrectiveActionPlan has deadline_status in {ON_TRACK, DUE_SOON}"
        side_effects:
          - "a new ClinicalImageSubmission is created with review_status PENDING_REVIEW and resubmission_round = this submission's resubmission_round + 1"
          - "the new ClinicalImageSubmission.resubmission_of_submission_id = this submission's id"
          - "owning ModalityUnit.deficiency_open_count = count of CorrectiveActionPlan rows with plan_status in {OPEN, SUBMITTED} for this unit"

  - entity: PhantomTest
    field: result_status
    initial_state: ACQUIRED
    terminal_states: [PASS, FAIL, VOIDED]
    transitions:
      - from: ACQUIRED
        to: SCORED
        trigger: "POST /accreditation/phantom-tests/{phantom_test_id}/score with total_score >= 7.0"
        actor: FacilityAdmin
        preconditions:
          - "spatial_resolution_score is non-null"
          - "contrast_score is non-null"
          - "artifact_score is non-null"
          - "all three sub-scores are integers in the closed range 0..10"
          - "no other PhantomTest of this unit with result_status ACQUIRED has an overlapping acquisition window"
        side_effects:
          - "PhantomTest.phantom_total_score = resolved by phantom_composite_score"
          - "PhantomTest.scored_at is stamped with the request's scored_at"
          - "owning ModalityUnit.phantom_attempt_count = count of PhantomTest rows with result_status in {SCORED, PASS, FAIL}"
          - "owning ModalityUnit.last_phantom_score = PhantomTest.phantom_total_score"
          - "owning ModalityUnit.phantom_failure_count = count of PhantomTest rows with result_status FAIL"
      - from: ACQUIRED
        to: FAIL
        trigger: "POST /accreditation/phantom-tests/{phantom_test_id}/score with total_score < 7.0"
        actor: FacilityAdmin
        preconditions:
          - "spatial_resolution_score is non-null"
          - "contrast_score is non-null"
          - "artifact_score is non-null"
          - "all three sub-scores are integers in the closed range 0..10"
          - "no other PhantomTest of this unit with result_status ACQUIRED has an overlapping acquisition window"
        side_effects:
          - "PhantomTest.phantom_total_score = resolved by phantom_composite_score"
          - "PhantomTest.scored_at is stamped with the request's scored_at"
          - "owning ModalityUnit.phantom_attempt_count = count of PhantomTest rows with result_status in {SCORED, PASS, FAIL}"
          - "owning ModalityUnit.phantom_failure_count = count of PhantomTest rows with result_status FAIL"
          - "owning ModalityUnit.last_phantom_score = PhantomTest.phantom_total_score"
          - "owning ModalityUnit.testing_deadline_at = scored_at + 30 days"
          - "Facility.payer_participation_status = AT_RISK"
      - from: ACQUIRED
        to: VOIDED
        trigger: "POST /accreditation/phantom-tests/{phantom_test_id}/void"
        actor: AccreditationBody
        preconditions:
          - "result_status == ACQUIRED"
        side_effects:
          - "PhantomTest.phantom_total_score stays null"
          - "owning ModalityUnit.phantom_attempt_count = count of PhantomTest rows with result_status in {SCORED, PASS, FAIL}"

  - entity: PhysicistSurvey
    field: survey_status
    initial_state: SCHEDULED
    terminal_states: [ACCEPTED, REJECTED]
    transitions:
      - from: SCHEDULED
        to: SUBMITTED
        trigger: "POST /accreditation/physicist-surveys/{survey_id}/submit"
        actor: MedicalPhysicist
        preconditions:
          - "measured_entrance_dose_mgy is non-null"
          - "shielding_verdict is non-null"
          - "performed_at >= the facility's AccreditationCycle.cycle_started_at for the cycle named by cycle_index == Facility.current_cycle_index"
          - "performed_at < the acting qualification's credential_expires_on"
        side_effects:
          - "PhysicistSurvey.dose_deviation_pct = resolved by survey_dose_deviation"
      - from: SCHEDULED
        to: REJECTED
        trigger: "system transition on POST /accreditation/physicist-surveys/{survey_id}/submit when the acting qualification's credential_status is LAPSED"
        actor: system
        preconditions:
          - "the acting qualification's credential_status == LAPSED"
        side_effects:
          - "PhysicistSurvey.rejection_code = CREDENTIAL_LAPSED"
          - "PhysicistSurvey.dose_deviation_pct = resolved by survey_dose_deviation"
          - "Facility.registry_credit_cents = registry_credit_cents + 100000"
          - "Facility.rejected_survey_count = count of PhysicistSurvey rows for this facility with survey_status REJECTED"
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /accreditation/physicist-surveys/{survey_id}/accept when shielding_verdict is PASS and |dose_deviation_pct| <= 10.0"
        actor: AccreditationBody
        preconditions:
          - "shielding_verdict == PASS"
          - "|PhysicistSurvey.dose_deviation_pct| <= 10.0"
          - "the named qualification has credential_status VERIFIED"
        side_effects:
          - "PhysicistSurvey.physicist_qualification_id qualification survey_count = count of PhysicistSurvey rows naming it with survey_status != REJECTED"
          - "if PhysicistSurvey.unit_id is non-null, that ModalityUnit's EquipmentItem rows become performance_verdict PASS"
          - "if PhysicistSurvey.unit_id is non-null, that ModalityUnit.last_survey_at = PhysicistSurvey.performed_at"
          - "if PhysicistSurvey.unit_id is null, every ModalityUnit of this facility sets last_survey_at = PhysicistSurvey.performed_at"
          - "the named qualification credential_status = VERIFIED when |PhysicistSurvey.dose_deviation_pct| <= 8.0"
          - "Facility.rejected_survey_count = 0"
          - "Facility.accreditation_currency = CURRENT"
      - from: SUBMITTED
        to: CORRECTIVE_REQUIRED
        trigger: "POST /accreditation/physicist-surveys/{survey_id}/accept when shielding_verdict is FAIL or |dose_deviation_pct| > 10.0"
        actor: AccreditationBody
        preconditions:
          - "shielding_verdict == FAIL or |PhysicistSurvey.dose_deviation_pct| > 10.0"
          - "the named qualification has credential_status VERIFIED"
        side_effects:
          - "PhysicistSurvey.rejection_code = DOSE_OUT_OF_RANGE when |dose_deviation_pct| > 10.0, else SHIELDING_FAILED"
          - "Facility.accreditation_currency stays PROVISIONAL"
      - from: CORRECTIVE_REQUIRED
        to: RESUBMITTED
        trigger: "POST /accreditation/physicist-surveys/{survey_id}/resubmit"
        actor: MedicalPhysicist
        preconditions:
          - "measured_entrance_dose_mgy is non-null"
          - "shielding_verdict == PASS"
          - "|PhysicistSurvey.dose_deviation_pct| <= 10.0"
          - "Facility.registry_credit_cents >= 100000"
        side_effects:
          - "Facility.registry_credit_cents = registry_credit_cents - 100000"
          - "PhysicistSurvey.dose_deviation_pct = resolved by survey_dose_deviation"
          - "PhysicistSurvey.rejection_code = NONE"
      - from: RESUBMITTED
        to: ACCEPTED
        trigger: "POST /accreditation/physicist-surveys/{survey_id}/accept"
        actor: AccreditationBody
        preconditions:
          - "shielding_verdict == PASS"
          - "|PhysicistSurvey.dose_deviation_pct| <= 10.0"
          - "the named qualification has credential_status VERIFIED"
        side_effects:
          - "if PhysicistSurvey.unit_id is non-null, that ModalityUnit's EquipmentItem rows become performance_verdict PASS"
          - "ModalityUnit.last_survey_at = PhysicistSurvey.performed_at for the survey's unit, or for every unit of the facility when unit_id is null"
          - "the named qualification survey_count = count of PhysicistSurvey rows naming it with survey_status != REJECTED"
          - "Facility.accreditation_currency = CURRENT"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /accreditation/physicist-surveys/{survey_id}/reject"
        actor: AccreditationBody
        preconditions:
          - "survey_status == SUBMITTED"
        side_effects:
          - "PhysicistSurvey.rejection_code = DOSE_OUT_OF_RANGE when |dose_deviation_pct| > 10.0, else SHIELDING_FAILED"
          - "Facility.registry_credit_cents = registry_credit_cents + 100000"
          - "Facility.rejected_survey_count = count of PhysicistSurvey rows for this facility with survey_status REJECTED"
      - from: CORRECTIVE_REQUIRED
        to: REJECTED
        trigger: "POST /accreditation/physicist-surveys/{survey_id}/reject"
        actor: AccreditationBody
        preconditions:
          - "shielding_verdict == FAIL or |PhysicistSurvey.dose_deviation_pct| > 10.0"
        side_effects:
          - "PhysicistSurvey.rejection_code = DOSE_OUT_OF_RANGE when |dose_deviation_pct| > 10.0, else SHIELDING_FAILED"
          - "Facility.registry_credit_cents = registry_credit_cents + 100000"
          - "Facility.rejected_survey_count = count of PhysicistSurvey rows for this facility with survey_status REJECTED"
          - "Facility.accreditation_currency stays PROVISIONAL"

  - entity: PersonnelQualification
    field: credential_status
    initial_state: PENDING
    terminal_states: [REVOKED]
    transitions:
      - from: PENDING
        to: VERIFIED
        trigger: "POST /accreditation/facilities/{facility_id}/qualifications/{qualification_id}/verify"
        actor: AccreditationBody
        preconditions:
          - "ce_credit_hours >= required_ce_hours"
          - "credential_expires_on > the request's verified_at"
        side_effects:
          - "PersonnelQualification.qualification_verified_at = the request's verified_at"
      - from: VERIFIED
        to: LAPSED
        trigger: "system transition whenever the logical clock reaches credential_expires_on"
        actor: system
        preconditions:
          - "credential_expires_on <= the current logical clock"
        side_effects:
          - "every PhysicistSurvey naming this qualification with survey_status SUBMITTED becomes survey_status REJECTED with rejection_code CREDENTIAL_LAPSED"
          - "Facility.rejected_survey_count = count of PhysicistSurvey rows for this facility with survey_status REJECTED"
      - from: PENDING
        to: REVOKED
        trigger: "POST /accreditation/facilities/{facility_id}/qualifications/{qualification_id}/revoke"
        actor: AccreditationBody
        preconditions:
          - "credential_status in {PENDING, VERIFIED, LAPSED}"
        side_effects:
          - "every PhysicistSurvey naming this qualification with survey_status in {SCHEDULED, SUBMITTED, CORRECTIVE_REQUIRED} becomes survey_status REJECTED with rejection_code CREDENTIAL_LAPSED"
          - "every CorrectiveActionPlan of this facility with plan_status OPEN becomes plan_status EXPIRED"
          - "Facility.rejected_survey_count = count of PhysicistSurvey rows for this facility with survey_status REJECTED"
      - from: VERIFIED
        to: REVOKED
        trigger: "POST /accreditation/facilities/{facility_id}/qualifications/{qualification_id}/revoke"
        actor: AccreditationBody
        preconditions:
          - "no PhysicistSurvey naming this qualification has survey_status SUBMITTED"
        side_effects:
          - "every PhysicistSurvey naming this qualification with survey_status in {SCHEDULED, CORRECTIVE_REQUIRED} becomes survey_status REJECTED with rejection_code CREDENTIAL_LAPSED"
          - "Facility.rejected_survey_count = count of PhysicistSurvey rows for this facility with survey_status REJECTED"

  - entity: CorrectiveActionPlan
    field: plan_status
    initial_state: OPEN
    terminal_states: [ACCEPTED, EXPIRED]
    transitions:
      - from: OPEN
        to: SUBMITTED
        trigger: "POST /accreditation/facilities/{facility_id}/corrective-action-plans/{plan_id}/submit"
        actor: FacilityAdmin
        preconditions:
          - "the source ClinicalImageSubmission.review_status == DEFICIENCY"
          - "the source unit has at least one EquipmentItem with equipment_status in {ACTIVE, OUT_OF_SERVICE}"
          - "deadline_status != OVERDUE"
          - "at least one PhantomTest of the source unit has result_status in {SCORED, PASS} at or after the source submission's deficiency_issued_at"
        side_effects:
          - "CorrectiveActionPlan.due_at = due_at + 1 day"
          - "owning ModalityUnit.deficiency_open_count = count of CorrectiveActionPlan rows with plan_status in {OPEN, SUBMITTED} for this unit"
      - from: OPEN
        to: EXPIRED
        trigger: "system transition whenever the logical clock passes due_at"
        actor: system
        preconditions:
          - "due_at < the current logical clock"
        side_effects:
          - "CorrectiveActionPlan.deadline_status = OVERDUE"
          - "owning ModalityUnit.deficiency_open_count = count of CorrectiveActionPlan rows with plan_status in {OPEN, SUBMITTED} for this unit"
          - "Facility.payer_participation_status = AT_RISK"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /accreditation/facilities/{facility_id}/corrective-action-plans/{plan_id}/reject"
        actor: AccreditationBody
        preconditions:
          - "the plan's supporting resubmission round has at least one ClinicalImageSubmission with review_status DEFICIENCY or FAILED"
        side_effects:
          - "CorrectiveActionPlan.resubmission_attempts = resubmission_attempts + 1"
          - "CorrectiveActionPlan.due_at = due_at + 30 days"
          - "CorrectiveActionPlan.resubmission_deadline_at = resubmission_deadline_at + 30 days"
          - "owning ModalityUnit.deficiency_open_count = count of CorrectiveActionPlan rows with plan_status in {OPEN, SUBMITTED} for this unit"
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "system transition when the answering ClinicalImageSubmission of the unit is reviewed ACCEPT, or POST /accreditation/facilities/{facility_id}/corrective-action-plans/{plan_id}/accept"
        actor: AccreditationBody
        preconditions:
          - "the source ClinicalImageSubmission review_status == ACCEPTED or the plan's supporting resubmission round has a ClinicalImageSubmission with review_status ACCEPTED"
        side_effects:
          - "owning ModalityUnit.deficiency_open_count = count of CorrectiveActionPlan rows with plan_status in {OPEN, SUBMITTED} for this unit"
          - "if owning ModalityUnit.deficiency_open_count == 0 and every other ModalityUnit of this facility has deficiency_open_count == 0, then Facility.payer_participation_status = ACTIVE"
      - from: SUBMITTED
        to: EXPIRED
        trigger: "system transition whenever the logical clock passes resubmission_deadline_at"
        actor: system
        preconditions:
          - "resubmission_deadline_at < the current logical clock"
        side_effects:
          - "CorrectiveActionPlan.deadline_status = OVERDUE"
          - "owning ModalityUnit.deficiency_open_count = count of CorrectiveActionPlan rows with plan_status in {OPEN, SUBMITTED} for this unit"
          - "Facility.payer_participation_status = AT_RISK"

  - entity: AccreditationCycle
    field: cycle_status
    initial_state: PENDING
    terminal_states: [RENEWED, LAPSED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /accreditation/facilities/{facility_id}/cycles/{cycle_id}/activate"
        actor: AccreditationBody
        preconditions:
          - "Facility.facility_status == ENROLLED"
        side_effects:
          - "AccreditationCycle.unit_count_at_start = count of ModalityUnit rows of this facility with unit_status ENROLLED"
          - "AccreditationCycle.cycle_expires_at = cycle_started_at + 1095 days"
          - "Facility.current_cycle_index = AccreditationCycle.cycle_index"
          - "Facility.accreditation_currency = PROVISIONAL"
      - from: ACTIVE
        to: RENEWAL_DUE
        trigger: "POST /accreditation/facilities/{facility_id}/cycles/{cycle_id}/start-renewal"
        actor: AccreditationBody
        preconditions:
          - "Facility.facility_status == ENROLLED"
          - "every PhysicistSurvey of this facility has survey_status in {ACCEPTED, RESUBMITTED}"
          - "every EquipmentItem of every ModalityUnit of this facility has equipment_status ACTIVE"
        side_effects:
          - "AccreditationCycle.audit_selection_status = resolved by random_site_audit_selection"
          - "when AccreditationCycle.audit_selection_status == SELECTED, AccreditationCycle.audit_outcome = PENDING"
          - "Facility.registry_credit_cents = registry_credit_cents - 75000"
          - "every ModalityUnit of this facility sets clinical_deadline_at = clinical_deadline_at + 90 days"
          - "every ModalityUnit of this facility sets testing_deadline_at = testing_deadline_at + 90 days"
          - "every CorrectiveActionPlan of this facility sets due_at = due_at + 90 days and resubmission_deadline_at = resubmission_deadline_at + 90 days"
      - from: RENEWAL_DUE
        to: RENEWED
        trigger: "POST /accreditation/facilities/{facility_id}/cycles/{cycle_id}/renew (accepted path), or auto-set when a successor cycle is activated"
        actor: AccreditationBody
        preconditions:
          - "AccreditationCycle.audit_outcome in {PASS, PENDING}"
        side_effects:
          - "AccreditationCycle.audit_outcome = PASS"
          - "every AccreditationCycle of this facility with cycle_index < AccreditationCycle.cycle_index becomes cycle_status RENEWED"
      - from: RENEWAL_DUE
        to: LAPSED
        trigger: "POST /accreditation/facilities/{facility_id}/cycles/{cycle_id}/reject-renewal"
        actor: AccreditationBody
        preconditions:
          - "AccreditationCycle.audit_outcome == PENDING or the acting role reports audit_outcome FAIL"
        side_effects:
          - "AccreditationCycle.audit_outcome = FAIL"
          - "Facility.registry_credit_cents = registry_credit_cents + 75000"
          - "Facility.accreditation_currency = LAPSED"
          - "Facility.facility_status = DEFERRED"
          - "every ModalityUnit of this facility becomes unit_status DEFERRED"
          - "every CorrectiveActionPlan of this facility becomes plan_status EXPIRED"
          - "every PhysicistSurvey of this facility with survey_status SCHEDULED becomes survey_status REJECTED with rejection_code DOCUMENTATION_INCOMPLETE"

  - entity: DoseRegistryRecord
    field: submission_status
    initial_state: STAGED
    terminal_states: [SUBMITTED, REJECTED]
    transitions:
      - from: STAGED
        to: SUBMITTED
        trigger: "POST /accreditation/facilities/{facility_id}/dose-registry/records/{record_id}/submit"
        actor: FacilityAdmin
        preconditions:
          - "dose_index_value > 0"
          - "Facility.registry_credit_cents >= 2500"
        side_effects:
          - "DoseRegistryRecord.submitted_at = the current logical clock"
          - "DoseRegistryRecord.benchmark_status = resolved by registry_benchmark_classification"
          - "DoseRegistryRecord.benchmark_comparison_value = the comparison dose index applied for the record's modality_code"
          - "DoseRegistryRecord.dose_benchmark_average = the unit-and-category average computed by facility_dose_index_benchmark for the record's exam_category_code"
          - "DoseRegistryRecord.registry_fee_cents = 2500"
          - "Facility.registry_credit_cents = registry_credit_cents - 2500"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /accreditation/facilities/{facility_id}/dose-registry/records/{record_id}/reject"
        actor: AccreditationBody
        preconditions:
          - "submission_status == SUBMITTED"
        side_effects:
          - "DoseRegistryRecord.registry_fee_cents = 0"
          - "DoseRegistryRecord.submitted_at = null"
          - "DoseRegistryRecord.benchmark_status = NOT_EVALUATED"
          - "Facility.registry_credit_cents = registry_credit_cents + 2500"

# =============================================================================
# §1.2.1 Concurrency Rules (true races only — OCC on the parent's version)
# =============================================================================
concurrency_rules:
  - rule_id: unit-enroll-stale-facility
    parent_entity: Facility
    write_endpoint: "POST /accreditation/facilities/{facility_id}/units"
    occ_field: "expected_facility_version"
    description: |
      Enrolling a ModalityUnit against a Facility whose version has advanced
      since the client last observed it is rejected.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: resubmit-stale-unit
    parent_entity: ModalityUnit
    write_endpoint: "POST /accreditation/facilities/{facility_id}/units/{unit_id}/image-submissions"
    occ_field: "expected_unit_version"
    description: |
      Creating a resubmission ClinicalImageSubmission against a ModalityUnit
      whose version has advanced since the client last observed it is rejected.
    error_id: ERR_STALE_VERSION
    http_status: 412# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: clinical_review_outcome
    trigger: "runs when a ClinicalImageSubmission transitions out of PENDING_REVIEW"
    algorithm: weighted_scoring
    formula: |
      coverage = accepted_view_count / required_view_count
      SELECT review_outcome, deficiency_code, review_outcome_score BY:
        IF review_outcome_input == "FAIL" THEN (FAIL, IMAGE_QUALITY, 0.0)
        ELSE IF coverage < 0.80 THEN (FAIL, IMAGE_QUALITY, 0.0)
        ELSE IF coverage < 1.0 THEN (ACCEPT_WITH_DEFICIENCY, complaint_disposition.category, coverage * 10.0)
        ELSE (ACCEPT, NONE, 10.0)
    input_set: "the single ClinicalImageSubmission under review; required_view_count > 0; accepted_view_count is in the closed range 0..required_view_count"
    constants:
      FAIL_COVERAGE_THRESHOLD: 0.80
      OUTCOME_SCORE_CEILING: 10.0
    precision: "review_outcome_score 2 decimal places, round_half_up; coverage computed at full precision then compared"
    variants:
      - name: reviewer_reported_outcome
        when: "the request supplies review_outcome_input == FAIL"
        difference: "forces (FAIL, IMAGE_QUALITY, 0.0) regardless of coverage; only reachable when accepted_view_count == 0"
      - name: coverage_derived_outcome
        when: "the request omits review_outcome_input"
        difference: "derives the outcome purely from coverage — an image set with accepted_view_count == required_view_count reviews ACCEPT even when the reviewer intended a deficiency"

  - name: phantom_composite_score
    trigger: "runs when a PhantomTest transitions from ACQUIRED to SCORED or FAIL"
    algorithm: weighted_scoring
    formula: |
      phantom_total_score = (spatial_resolution_score + contrast_score + artifact_score) / 3
    input_set: "the single PhantomTest being scored; all three sub-scores present and integral in 0..10"
    constants:
      PASS_THRESHOLD: 7.0
    precision: "phantom_total_score 2 decimal places, round_half_up; the PASS threshold is compared against the rounded value"
    variants:
      - name: rounded_then_compared
        when: "the implementation rounds phantom_total_score at scoring time"
        difference: "pins 3.00 as a pass and 2.99 as a failure, but a raw mean of 3.001 also passes"
      - name: unrounded_then_compared
        when: "the implementation keeps full precision internally"
        difference: "identical for these inputs — this variant exists so the fixture must pin which one is observable"

  - name: survey_dose_deviation
    trigger: "runs when a PhysicistSurvey transitions out of SCHEDULED and again on CORRECTIVE_REQUIRED to RESUBMITTED"
    algorithm: threshold
    formula: |
      dose_deviation_pct = (measured_entrance_dose_mgy - reference_entrance_dose_mgy) / reference_entrance_dose_mgy * 100
      CLASSIFY:
        IF |dose_deviation_pct| <= 5.0 THEN dose_weight = 1.0
        ELSE IF |dose_deviation_pct| <= 10.0 THEN dose_weight = 0.5
        ELSE dose_weight = 0.0
    input_set: "the single PhysicistSurvey; reference_entrance_dose_mgy > 0 and measured_entrance_dose_mgy is non-null"
    constants:
      ABSOLUTE_DEVIATION_LIMIT_PCT: 10.0
      FULL_CREDIT_BAND_PCT: 5.0
      PARTIAL_CREDIT_BAND_PCT: 10.0
    precision: "dose_deviation_pct 2 decimal places, round_half_up; band membership compared against the rounded value"
    variants:
      - name: banded_weight_variant
        when: "the survey is evaluated by the accreditation body for consequential decisions"
        difference: "reports dose_weight 1.0 at exactly 5.0 %, 0.5 at exactly 10.0 %, and 0.0 above 10.0 %"
      - name: mean_of_bands_variant
        when: "the survey is evaluated for the registry benchmark report"
        difference: "reports the arithmetic mean of the applicable band weights rather than the single band weight, so a survey inside the 10 % band reports 0.75 instead of 0.5"

  - name: corrective_action_deadline
    trigger: "runs when a CorrectiveActionPlan is created and on every re-read of the plan"
    algorithm: threshold
    formula: |
      days_remaining = floor((due_at - current_logical_clock) / 86400 seconds)
      CLASSIFY:
        IF days_remaining < 0 THEN OVERDUE
        ELSE IF days_remaining <= 10 THEN DUE_SOON
        ELSE ON_TRACK
    input_set: "every CorrectiveActionPlan of the facility, regardless of plan_status; plans with plan_status EXPIRED keep their last computed value"
    constants:
      DUE_SOON_WINDOW_DAYS: 10
    precision: "days_remaining is an integer count of whole days; no rounding of the boundary"
    variants:
      - name: whole_day_threshold
        when: "days_remaining is floored to whole days"
        difference: "a plan due in 10 days 23 hours reports DUE_SOON"
      - name: calendar_day_threshold
        when: "days_remaining counts calendar-date differences"
        difference: "the same plan reports ON_TRACK exactly one day earlier"

  - name: random_site_audit_selection
    trigger: "runs when an AccreditationCycle transitions ACTIVE to RENEWAL_DUE, and again when the cycle is renewed"
    algorithm: forward_looking
    formula: |
      c_index = AccreditationCycle.cycle_index
      failing_surveys = count of this Facility's PhysicistSurvey rows with survey_status in {REJECTED, CORRECTIVE_REQUIRED}
      IF c_index % 5 == 0 THEN audit_selection_status = SELECTED
      ELSE IF failing_surveys >= 2 THEN audit_selection_status = SELECTED
      ELSE IF Facility.rejected_survey_count >= 1 THEN audit_selection_status = SELECTED
      ELSE audit_selection_status = WAIVED
    input_set: "the single AccreditationCycle of this facility; Facility.rejected_survey_count read at evaluation time"
    constants:
      AUDIT_MANDATORY_CYCLE_PERIOD: 5
      AUDIT_FAILING_SURVEY_TRIGGER: 2
    precision: "integer counts and integer modulo; no rounding"
    variants:
      - name: cycle_period_inclusive
        when: "cycle_index is treated as 1-based (first cycle has cycle_index 1)"
        difference: "cycle_index 5, 10, 15 are audited; a facility at cycle_index 4 is waived"
      - name: cycle_period_offset
        when: "cycle_index is treated as another cycle's successor"
        difference: "selects cycle_index 5 and 6, and reports SELECTED for a facility whose prior cycle was already audited"

  - name: facility_dose_index_benchmark
    trigger: "runs when a DoseRegistryRecord transitions STAGED to SUBMITTED, and on every read of the facility's dose-registry summary"
    algorithm: aggregation
    formula: |
      comparisons = [r.benchmark_comparison_value for r in this unit's DoseRegistryRecord rows
                     with submission_status == SUBMITTED and exam_category_code == this record's exam_category_code]
      numerator = SUM(r.dose_index_value for r in those rows)
      denominator = SUM(r.benchmark_comparison_value for r in those rows)
      bench_avg = numerator / denominator
    input_set: "DoseRegistryRecord rows with submission_status SUBMITTED only; STAGED and REJECTED rows are excluded; the record being submitted is included in the aggregates; both aggregates are order-insensitive sums, so no tie-break arises — a tie in benchmark_comparison_value yields the same MAX value"
    constants:
      FEE_PER_RECORD_CENTS: 2500
    precision: "bench_avg at full precision, 6 significant digits in responses"
    variants:
      - name: included_self_variant
        when: "the record under evaluation is counted inside its own unit average"
        difference: "including the record under test gives bench_avg 2.50 for a unit already holding one submitted CT_HEAD record at 2.3 including the new 2.7"
      - name: excluded_self_variant
        when: "the record under evaluation is left out of its own unit average"
        difference: "excluding it leaves the unit average at 2.30, a different denominator for the same inputs"

  - name: registry_benchmark_classification
    trigger: "runs when a DoseRegistryRecord transitions STAGED to SUBMITTED, and on every read of the facility's dose-registry summary"
    algorithm: threshold
    formula: |
      IF no other DoseRegistryRecord of this unit with the same exam_category_code has submission_status SUBMITTED:
        comparison = MODALITY_CATEGORY_COMPARISON[this record's modality_code]
      ELSE:
        comparison = MAX(benchmark_comparison_value over those rows)
      ratio = dose_index_value / comparison
      IF ratio <= 1.00 THEN WITHIN_BENCHMARK
      ELSE IF ratio <= 1.35 THEN ABOVE_BENCHMARK
      ELSE CRITICAL
    input_set: "DoseRegistryRecord rows with submission_status SUBMITTED only, of the same unit and the same exam_category_code; STAGED and REJECTED rows and rows of other units or categories are excluded"
    constants:
      WITHIN_BENCHMARK_RATIO: 1.00
      ABOVE_BENCHMARK_RATIO: 1.35
      MODALITY_COMPARISON_MRI: 2.0
      MODALITY_COMPARISON_CT: 2.3
      MODALITY_COMPARISON_MAMM: 2.5
      MODALITY_COMPARISON_PET: 3.0
      MODALITY_COMPARISON_US: 2.2
    precision: "ratio at full precision compared against the constants; dose_index_value and comparison are 2 decimal places"
    variants:
      - name: unit_local_comparison
        when: "a comparison record already exists on the same unit and category"
        difference: "2.7 compares against the MAX comparison value 2.3 already on file, giving ratio 1.1739 and ABOVE_BENCHMARK"
      - name: category_fallback_comparison
        when: "no other submitted record exists on the same unit and category"
        difference: "2.7 compares against the CT category constant 2.3 instead of against any facility-wide value, and 3.2 against the MRI constant 2.0 crosses into CRITICAL"

  - name: roster_deficiency_aggregation
    trigger: "runs whenever a PersonnelQualification of this facility changes credential_status, and on the facility's re-read"
    algorithm: weight_of_evidence
    formula: |
      rows = this Facility's PersonnelQualification records with credential_status in {PENDING, VERIFIED, LAPSED, REVOKED}
        also include records with personnel_role == MEDICAL_PHYSICIST and credential_status == LAPSED that were omitted for any reason
      SELECT roster_disposition BY:
        IF any included record has credential_status == REVOKED THEN HALT
        ELSE IF count(included records with credential_status == LAPSED) >= 2 THEN HALT
        ELSE IF count(included records with credential_status == LAPSED) == 1 THEN HOLD
        ELSE IF count(included records with credential_status == PENDING) >= 3 THEN HOLD
        ELSE CLEAR
    input_set: "PersonnelQualification rows of the facility in states PENDING, VERIFIED, LAPSED, REVOKED; REVOKED forces inclusion of any MEDICAL_PHYSICIST row regardless of any filter"
    constants:
      LAPSED_HALT_COUNT: 2
      PENDING_HOLD_COUNT: 3
    precision: "exact integer counts; no arithmetic"
    variants:
      - name: revoked_first
        when: "a REVOKED row is present"
        difference: "HALT is returned even when only one row is REVOKED and all others are VERIFIED"
      - name: lapsed_then_pending
        when: "no REVOKED row is present"
        difference: "two LAPSED rows already HALT, so the PENDING>=3 HOLD branch is unreachable whenever two rows have lapsed"# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:

  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present and name a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "the acting role is listed in the target endpoint's roles"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "the facility named by facility_id (path segment on /accreditation/facilities/{facility_id}/**, body field on child creation) exists"
    error_id: ERR_FACILITY_NOT_FOUND
    http_status: 404
    applies_to: "POST /accreditation/facilities/{facility_id}/register, POST /accreditation/facilities/{facility_id}/suspend, POST /accreditation/facilities/{facility_id}/reinstate, GET /accreditation/facilities/{facility_id}, POST /accreditation/modality-units, POST /accreditation/physicist-surveys, POST /accreditation/qualifications, POST /accreditation/cycles"

  - priority: 3
    category: existence
    check: "the unit named by unit_id resolves and belongs to the facility named by facility_id when both are supplied"
    error_id: ERR_UNIT_NOT_FOUND
    http_status: 404
    applies_to: "POST /accreditation/equipment, POST /accreditation/clinical-image-submissions, POST /accreditation/phantom-tests, POST /accreditation/dose-registry-records, POST /accreditation/modality-units/{unit_id}/withdraw, GET /accreditation/modality-units/{unit_id}"

  - priority: 3
    category: existence
    check: "the equipment item named by the path exists"
    error_id: ERR_EQUIPMENT_NOT_FOUND
    http_status: 404
    applies_to: "POST /accreditation/equipment/{equipment_id}/take-out-of-service, POST /accreditation/equipment/{equipment_id}/return-to-service, POST /accreditation/equipment/{equipment_id}/retire, GET /accreditation/equipment/{equipment_id}"

  - priority: 3
    category: existence
    check: "the clinical image submission named by the path exists, and a supplied resubmission_of_submission_id resolves"
    error_id: ERR_SUBMISSION_NOT_FOUND
    http_status: 404
    applies_to: "POST /accreditation/clinical-image-submissions/{submission_id}/review, POST /accreditation/clinical-image-submissions/{submission_id}/resubmit, GET /accreditation/clinical-image-submissions/{submission_id}, POST /accreditation/corrective-action-plans"

  - priority: 3
    category: existence
    check: "the phantom test named by the path exists"
    error_id: ERR_PHANTOM_TEST_NOT_FOUND
    http_status: 404
    applies_to: "POST /accreditation/phantom-tests/{phantom_test_id}/score, POST /accreditation/phantom-tests/{phantom_test_id}/void, GET /accreditation/phantom-tests/{phantom_test_id}"

  - priority: 3
    category: existence
    check: "the physicist survey named by the path exists, and a supplied physicist_qualification_id resolves"
    error_id: ERR_SURVEY_NOT_FOUND
    http_status: 404
    applies_to: "POST /accreditation/physicist-surveys/{survey_id}/submit, POST /accreditation/physicist-surveys/{survey_id}/accept, POST /accreditation/physicist-surveys/{survey_id}/reject, POST /accreditation/physicist-surveys/{survey_id}/resubmit, GET /accreditation/physicist-surveys/{survey_id}, POST /accreditation/physicist-surveys"

  - priority: 3
    category: existence
    check: "the personnel qualification named by the path exists"
    error_id: ERR_QUALIFICATION_NOT_FOUND
    http_status: 404
    applies_to: "POST /accreditation/qualifications/{qualification_id}/verify, POST /accreditation/qualifications/{qualification_id}/revoke, GET /accreditation/qualifications/{qualification_id}"

  - priority: 3
    category: existence
    check: "the accreditation cycle named by the path exists, and a supplied prior_cycle_id resolves"
    error_id: ERR_CYCLE_NOT_FOUND
    http_status: 404
    applies_to: "POST /accreditation/cycles/{cycle_id}/activate, POST /accreditation/cycles/{cycle_id}/start-renewal, POST /accreditation/cycles/{cycle_id}/renew, POST /accreditation/cycles/{cycle_id}/reject-renewal, GET /accreditation/cycles/{cycle_id}, POST /accreditation/cycles"

  - priority: 3
    category: existence
    check: "the dose registry record named by the path exists"
    error_id: ERR_RECORD_NOT_FOUND
    http_status: 404
    applies_to: "POST /accreditation/dose-registry-records/{record_id}/submit, POST /accreditation/dose-registry-records/{record_id}/reject, GET /accreditation/dose-registry-records/{record_id}"

  - priority: 3
    category: existence
    check: "the corrective action plan named by the path exists"
    error_id: ERR_PLAN_NOT_FOUND
    http_status: 404
    applies_to: "POST /accreditation/corrective-action-plans/{plan_id}/submit, POST /accreditation/corrective-action-plans/{plan_id}/accept, POST /accreditation/corrective-action-plans/{plan_id}/reject, GET /accreditation/corrective-action-plans/{plan_id}"

  - priority: 4
    category: state
    check: "the target resource is in a state from which the requested transition is declared"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "every action endpoint in §1.5"

  - priority: 4
    category: state
    check: "the target resource is not already in one of its terminal_states"
    error_id: ERR_ALREADY_TERMINAL
    http_status: 409
    applies_to: "POST /accreditation/phantom-tests/{phantom_test_id}/score, POST /accreditation/dose-registry-records/{record_id}/submit, POST /accreditation/clinical-image-submissions/{submission_id}/review, POST /accreditation/cycles/{cycle_id}/activate"

  - priority: 4
    category: state
    check: "the owning ModalityUnit has unit_status ENROLLED"
    error_id: ERR_UNIT_DEFERRED
    http_status: 409
    applies_to: "POST /accreditation/equipment, POST /accreditation/clinical-image-submissions, POST /accreditation/phantom-tests, POST /accreditation/dose-registry-records"

  - priority: 4
    category: state
    check: "the acting MedicalPhysicist's PersonnelQualification has credential_status VERIFIED rather than REVOKED"
    error_id: ERR_CREDENTIAL_REVOKED
    http_status: 409
    applies_to: "POST /accreditation/physicist-surveys/{survey_id}/submit, POST /accreditation/physicist-surveys/{survey_id}/resubmit"

  - priority: 4
    category: state
    check: "the owning Facility has accreditation_currency in {PROVISIONAL, CURRENT} rather than LAPSED or SUSPENDED"
    error_id: ERR_ACCREDITATION_LAPSED
    http_status: 409
    applies_to: "POST /accreditation/clinical-image-submissions, POST /accreditation/phantom-tests/{phantom_test_id}/score"

  - priority: 4
    category: state
    check: "the supplied expected_facility_version or expected_unit_version equals the persisted version of the named parent entity"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /accreditation/modality-units, POST /accreditation/clinical-image-submissions, POST /accreditation/facilities/{facility_id}/register, POST /accreditation/facilities/{facility_id}/suspend, POST /accreditation/facilities/{facility_id}/reinstate, POST /accreditation/modality-units/{unit_id}/withdraw, POST /accreditation/equipment/{equipment_id}/take-out-of-service, POST /accreditation/equipment/{equipment_id}/return-to-service, POST /accreditation/equipment/{equipment_id}/retire"

  - priority: 6
    category: business_safety
    check: "the acting facility has no CorrectiveActionPlan with deadline_status OVERDUE"
    error_id: ERR_DEADLINE_OVERDUE
    http_status: 400
    applies_to: "POST /accreditation/corrective-action-plans/{plan_id}/submit, POST /accreditation/clinical-image-submissions/{submission_id}/resubmit, POST /accreditation/cycles/{cycle_id}/start-renewal, POST /accreditation/cycles/{cycle_id}/renew"

  - priority: 6
    category: business_safety
    check: "the acting facility has no CorrectiveActionPlan with plan_status in {OPEN, SUBMITTED}"
    error_id: ERR_DEFICIENCY_PENDING
    http_status: 400
    applies_to: "POST /accreditation/facilities/{facility_id}/register, POST /accreditation/cycles/{cycle_id}/start-renewal, POST /accreditation/equipment/{equipment_id}/retire"

  - priority: 6
    category: business_safety
    check: "every PersonnelQualification of the facility with personnel_role in {INTERPRETING_PHYSICIAN, TECHNOLOGIST} has credential_status VERIFIED"
    error_id: ERR_QUALIFICATION_UNVERIFIED
    http_status: 400
    applies_to: "POST /accreditation/clinical-image-submissions/{submission_id}/review, POST /accreditation/physicist-surveys/{survey_id}/accept, POST /accreditation/cycles/{cycle_id}/renew"

  - priority: 6
    category: business_safety
    check: "the facility's roster_deficiency_aggregation is not HALT and no PersonnelQualification of the facility has credential_status REVOKED"
    error_id: ERR_SURVEY_SHORTFALL
    http_status: 400
    applies_to: "POST /accreditation/cycles/{cycle_id}/start-renewal, POST /accreditation/cycles/{cycle_id}/renew, POST /accreditation/facilities/{facility_id}/register"

  - priority: 6
    category: business_safety
    check: "the facility's roster_disposition is not HALT"
    error_id: ERR_ROSTER_INELIGIBLE
    http_status: 400
    applies_to: "POST /accreditation/physicist-surveys/{survey_id}/submit, POST /accreditation/physicist-surveys/{survey_id}/resubmit"

  - priority: 6
    category: business_safety
    check: "the PersonnelQualification being verified has ce_credit_hours >= required_ce_hours"
    error_id: ERR_CE_HOURS_SHORTFALL
    http_status: 400
    applies_to: "POST /accreditation/qualifications/{qualification_id}/verify"

  - priority: 6
    category: business_safety
    check: "the physicist survey records shielding_verdict PASS"
    error_id: ERR_SHIELDING_FAILED
    http_status: 400
    applies_to: "POST /accreditation/physicist-surveys/{survey_id}/resubmit, POST /accreditation/physicist-surveys/{survey_id}/accept"

  - priority: 7
    category: business_constraint
    check: "unit_label is unique among the facility's ModalityUnit rows"
    error_id: ERR_UNIT_LABEL_DUPLICATE
    http_status: 400
    applies_to: "POST /accreditation/modality-units"

  - priority: 7
    category: business_constraint
    check: "serial_number is unique among the facility's EquipmentItem rows"
    error_id: ERR_SERIAL_DUPLICATE
    http_status: 400
    applies_to: "POST /accreditation/equipment"

  - priority: 7
    category: business_constraint
    check: "credential_number is unique among all PersonnelQualification rows"
    error_id: ERR_CREDENTIAL_NUMBER_DUPLICATE
    http_status: 400
    applies_to: "POST /accreditation/qualifications"

  - priority: 7
    category: business_constraint
    check: "the new phantom acquisition window [acquired_at, acquired_at + duration_minutes) is disjoint from every other PhantomTest of the unit with result_status ACQUIRED; touching endpoints (start == prior end) are allowed"
    error_id: ERR_PHANTOM_SCHEDULE_CONFLICT
    http_status: 400
    applies_to: "POST /accreditation/phantom-tests"

  - priority: 7
    category: business_constraint
    check: "the phantom test being scored still owns its acquisition window and no other PhantomTest of the unit with result_status ACQUIRED overlaps it"
    error_id: ERR_PHANTOM_TEST_CONFLICT
    http_status: 400
    applies_to: "POST /accreditation/phantom-tests/{phantom_test_id}/score"

  - priority: 7
    category: business_constraint
    check: "the new survey's [performed_at, performed_at + 1 day) window is disjoint from every other PhysicistSurvey of the facility that is not REJECTED, and performed_at is at or after the stored performed_at of every such survey"
    error_id: ERR_SURVEY_WINDOW_CONFLICT
    http_status: 400
    applies_to: "POST /accreditation/physicist-surveys"

  - priority: 7
    category: business_constraint
    check: "(unit_id, exam_category_code, exam_month) is unique among DoseRegistryRecord rows"
    error_id: ERR_DOSE_RECORD_DUPLICATE
    http_status: 400
    applies_to: "POST /accreditation/dose-registry-records"

  - priority: 7
    category: business_constraint
    check: "cycle_index is unique among the facility's AccreditationCycle rows"
    error_id: ERR_CYCLE_INDEX_DUPLICATE
    http_status: 400
    applies_to: "POST /accreditation/cycles"

  - priority: 7
    category: business_constraint
    check: "accepted_view_count is in the closed range 0..required_view_count"
    error_id: ERR_INVALID_VIEW_COUNT
    http_status: 400
    applies_to: "POST /accreditation/clinical-image-submissions"

  - priority: 7
    category: business_constraint
    check: "every enum-typed body field carries a declared enum member and every required body field is present"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "all POST endpoints in §1.5"

  - priority: 8
    category: business_temporal
    check: "the target unit's clinical_deadline_at (image submissions) or testing_deadline_at (phantom tests) has not already passed"
    error_id: ERR_SUBMISSION_WINDOW_CLOSED
    http_status: 400
    applies_to: "POST /accreditation/clinical-image-submissions, POST /accreditation/phantom-tests"

  - priority: 8
    category: business_temporal
    check: "the resubmission being created has resubmission_round <= 2"
    error_id: ERR_RESUBMISSION_LIMIT_EXCEEDED
    http_status: 400
    applies_to: "POST /accreditation/clinical-image-submissions/{submission_id}/resubmit"

  - priority: 9
    category: business_referential
    check: "the phantom test is scored at or after the deficiency it answers (scored_at >= ClinicalImageSubmission.deficiency_issued_at)"
    error_id: ERR_CAUSAL_ORDER
    http_status: 400
    applies_to: "POST /accreditation/phantom-tests/{phantom_test_id}/score"

  - priority: 9
    category: business_referential
    check: "the resubmission's resubmission_round is exactly one more than the submission it answers"
    error_id: ERR_RESUBMISSION_CHAIN
    http_status: 400
    applies_to: "POST /accreditation/clinical-image-submissions/{submission_id}/resubmit"

  - priority: 9
    category: business_referential
    check: "the plan's unit has at least one PhantomTest with result_status in {SCORED, PASS} scored at or after the deficiency was issued"
    error_id: ERR_PHANTOM_UNSCORED
    http_status: 400
    applies_to: "POST /accreditation/corrective-action-plans/{plan_id}/submit"

  - priority: 10
    category: business_fiscal
    check: "Facility.registry_credit_cents covers the operation's debit — 2500 for a registry record submission, 75000 for a cycle start-renewal, 100000 for a survey resubmission"
    error_id: ERR_INSUFFICIENT_REGISTRY_CREDIT
    http_status: 402
    applies_to: "POST /accreditation/dose-registry-records/{record_id}/submit, POST /accreditation/cycles/{cycle_id}/start-renewal, POST /accreditation/physicist-surveys/{survey_id}/resubmit"# =============================================================================
# §1.5 API Endpoint Table
# (flat topology — children are top-level collections keyed by foreign key;
#  only Facility-scoped lifecycle actions are nested under /accreditation/facilities/{id})
# =============================================================================
endpoints:

  # --- Facility ---
  - method: POST
    path: "/accreditation/facilities"
    description: "Create a facility record"
    roles: [FacilityAdmin]
    code: 201
    input: [name, state_code, facility_type]
    output: Facility
    side_effects: ["facility_status=PENDING", "accreditation_currency=PROVISIONAL", "payer_participation_status=AT_RISK", "registry_credit_cents=0", "enrolled_unit_count=0", "deferred_unit_count=0", "rejected_survey_count=0", "roster_disposition=CLEAR", "version=1"]

  - method: GET
    path: "/accreditation/facilities"
    description: "List facilities"
    roles: [Any]
    code: 200
    input: ["state_code?", "facility_type?", "facility_status?", "limit?", "offset?"]
    output: Facility[]
    side_effects: []

  - method: GET
    path: "/accreditation/facilities/{facility_id}"
    description: "Read a facility, including accreditation_currency, registry_credit_cents and roster_disposition"
    roles: [Any]
    code: 200
    input: []
    output: Facility
    side_effects: []

  - method: POST
    path: "/accreditation/facilities/{facility_id}/register"
    description: "Register the facility for accreditation"
    roles: [FacilityAdmin]
    code: 200
    input: [expected_facility_version]
    output: Facility
    side_effects: ["facility_status → ENROLLED", "accreditation_currency → PROVISIONAL", "payer_participation_status → ACTIVE", "enrolled_unit_count recomputed", "rejected_survey_count=0", "increments Facility.version by 1"]

  - method: POST
