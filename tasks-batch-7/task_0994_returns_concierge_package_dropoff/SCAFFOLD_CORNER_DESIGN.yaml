          assert: ["err == ERR_EXCEPTION_OPEN_EXISTS"]

  # ===================================================== 5. Endpoints
  - section: endpoints
    instances:
      - name: label_reissue_supersedes_and_chain_queryable
        claim_type: action_endpoint
        grounds: [state_machines.Label.ISSUED_to_SUPERSEDED, entities.Label.fields.supersedes_label_id]
        distinguishing_aspect: "Re-issuing a label supersedes the active one; the successor carries supersedes_label_id and GET /v1/labels?supersedes_label_id returns it (self-referential FK reverse reachability)."
        test_recipe:
          setup: ["COUNTER_DROP order with label A issued (order version 2)"]
          setup_api_calls:
            - { call: "POST /v1/subscription-plans", payload: { tier: CUSTOM, monthly_fee_cents: 100, included_returns: 100, overage_fee_cents: 10, pickup_enabled: false, boxless_enabled: true, oversize_enabled: true, free_returns: false, oversize_surcharge_cents: 0, pickup_fee_cents: 0 }, as: PlatformAdmin, captures: { plan_id: $.data.id } }
