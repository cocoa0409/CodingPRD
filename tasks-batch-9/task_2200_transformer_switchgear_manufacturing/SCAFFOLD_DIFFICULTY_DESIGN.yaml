          2026-07-05 (the 22:00 test runs past midnight into 2026-07-06 yet contributes nothing
          to the 07-06 bucket, because only day(window_start_at) counts), is then refused a third
          07-05 slot with 409 ERR_WITNESS_DAY_CAPACITY, and is refused a 2026-07-04 slot with
