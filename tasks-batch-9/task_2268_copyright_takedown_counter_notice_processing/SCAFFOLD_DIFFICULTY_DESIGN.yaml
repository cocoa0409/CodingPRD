  - rule_id: boundary_precision_check
    instances:
      - name: notice_score_at_substantial_threshold_passes_while_core_gate_still_bites
        grounds:
          - calculations.notice_statutory_completeness
          - entities.TakedownNotice.fields.rejection_reason
          - state_machines.TakedownNotice.RECEIVED_to_VALIDATED
          - state_machines.TakedownNotice.RECEIVED_to_REJECTED
        distinguishing_aspect: |
          Three notices probe the inclusive boundary of SUBSTANTIAL_THRESHOLD 92:
          score 92 (accuracy omitted) is VALIDATED, score 90 (contact_email omitted)
          is REJECTED with SCORE_BELOW_THRESHOLD, and score 92 with
          signature_present omitted is still REJECTED with
          CORE_ELEMENT_MISSING:signature_present because the gate runs after the
          threshold comparison.
        test_recipe:
          setup:
            - "Provider with published contact and one REGISTERED designated agent; clock at 2026-08-01T00:00:00Z."
            - "One STANDARD-tier RightsHolder; all three notices use submission_channel WEB_FORM so the substantial variant applies."
            - "Notice A omits accuracy_statement (8 points), notice B omits contact_email (10 points), notice C omits signature_present (8 points, a core element)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /dmca/providers"
