# =============================================================================
# Task 1730: SCAFFOLD_CORNER_DESIGN.yaml
# §1.9 — enumerative coverage of testable claims not already covered by §1.8
# =============================================================================

scaffold_corner_design:

  # =========================================================================
  # Section: entities
  # =========================================================================
  - section: entities
    instances:
      - name: tenant_creation_returns_defaults
        claim_type: creation_with_defaults
        grounds: ["entities.Tenant"]
        distinguishing_aspect: "POST /tenants with minimal fields returns Tenant with audit_clock_day_index=0, audit_posture=CLEAR, open_exposure_cents=0"
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /tenants"
              payload: { legal_name: "T1", home_state_code: "NY" }
              as: TenantAdmin
              captures: { tid: $.data.id, clk: $.data.audit_clock_day_index, posture: $.data.audit_posture, exp: $.data.open_exposure_cents }
          trigger: []
          assert:
            - "clk == 0"
            - "posture == CLEAR"
            - "exp == 0"

      - name: customer_creation_returns_default_parallel_standing
        claim_type: creation_with_defaults
        grounds: ["entities.Customer"]
        distinguishing_aspect: "New Customer starts with cert_standing=MISSING, audit_standing=NOT_UNDER_AUDIT, collection_standing=CURRENT, onboarding_completed_at=null"
        test_recipe:
          setup: ["tenant exists"]
          setup_api_calls:
            - call: "POST /tenants"
              payload: { legal_name: "T1", home_state_code: "NY" }
              as: TenantAdmin
              captures: { tid: $.data.id }
            - call: "POST /tenants/${tid}/exemption_reasons"
              payload: { code: "RES", description: "Resale", tax_engine_code: "R", requires_certificate: true, allowed_form_types: ["RESALE"] }
              as: TenantAdmin
          trigger:
            - call: "POST /tenants/${tid}/customers"
              payload: { external_ref: "C1", legal_name: "Cust", primary_ship_to_state: "CA", exemption_reason_code: "RES" }
              as: ComplianceOfficer
              captures: { cs: $.data.cert_standing, as_: $.data.audit_standing, cls: $.data.collection_standing, ob: $.data.onboarding_completed_at }
          assert:
            - "cs == MISSING"
            - "as_ == NOT_UNDER_AUDIT"
            - "cls == CURRENT"
            - "ob == null"

      - name: order_line_extended_cents_computed
        claim_type: computed_field
        grounds: ["entities.OrderLine.fields.extended_cents"]
        distinguishing_aspect: "extended_cents is computed as quantity*unit_price_cents; client cannot supply it"
        test_recipe:
          setup: ["tenant, customer, order created"]
          setup_api_calls:
            - call: "POST /tenants"
              payload: { legal_name: "T1", home_state_code: "NY" }
              as: TenantAdmin
              captures: { tid: $.data.id }
            - call: "POST /tenants/${tid}/exemption_reasons"
              payload: { code: "RES", description: "R", tax_engine_code: "R", requires_certificate: true, allowed_form_types: ["RESALE"] }
              as: TenantAdmin
            - call: "POST /tenants/${tid}/customers"
              payload: { external_ref: "C1", legal_name: "C", primary_ship_to_state: "CA", exemption_reason_code: "RES" }
              as: ComplianceOfficer
              captures: { cid: $.data.id }
            - call: "POST /tenants/${tid}/customers/${cid}/orders"
              payload: { order_ref: "O1", ship_to_state: "CA", exemption_reason_code: "RES" }
              as: OrderClerk
              captures: { oid: $.data.id }
          trigger:
            - call: "POST /tenants/${tid}/orders/${oid}/lines"
              payload: { sku: "ABC", quantity: 3, unit_price_cents: 250, is_exempt_claimed: true }
              as: OrderClerk
              captures: { ext: $.data.extended_cents }
          assert:
            - "ext == 750"

      - name: tenant_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /tenants/{non_existent_uuid} returns ERR_NOT_FOUND 404"
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /tenants/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: TenantAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_NOT_FOUND"

      - name: jurisdiction_rule_duplicate_state_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_DUPLICATE_JURISDICTION]"]
        distinguishing_aspect: "Second JurisdictionRule with same state_code for the same tenant is rejected"
        test_recipe:
          setup: ["tenant; one CA rule"]
          setup_api_calls:
            - call: "POST /tenants"
              payload: { legal_name: "T1", home_state_code: "NY" }
              as: TenantAdmin
              captures: { tid: $.data.id }
            - call: "POST /tenants/${tid}/jurisdiction_rules"
              payload: { state_code: "CA", accepted_form_types: ["RESALE"], validity_window_days: 0, anchor_rule: "EFFECTIVE_DATE", allows_drop_ship_resale: false, requires_state_registration_number: false, blanket_cert_allowed: false }
              as: TenantAdmin
          trigger:
            - call: "POST /tenants/${tid}/jurisdiction_rules"
              payload: { state_code: "CA", accepted_form_types: ["EXEMPT_ORG"], validity_window_days: 365, anchor_rule: "SIGNED_DATE", allows_drop_ship_resale: true, requires_state_registration_number: true, blanket_cert_allowed: true }
              as: TenantAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_DUPLICATE_JURISDICTION"

      - name: exemption_reason_duplicate_code_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_DUPLICATE_REASON_CODE]"]
        distinguishing_aspect: "Second ExemptionReason with same code rejected"
        test_recipe:
          setup: ["tenant with RES reason"]
          setup_api_calls:
            - call: "POST /tenants"
              payload: { legal_name: "T1", home_state_code: "NY" }
              as: TenantAdmin
              captures: { tid: $.data.id }
            - call: "POST /tenants/${tid}/exemption_reasons"
              payload: { code: "RES", description: "Resale", tax_engine_code: "R", requires_certificate: true, allowed_form_types: ["RESALE"] }
              as: TenantAdmin
          trigger:
            - call: "POST /tenants/${tid}/exemption_reasons"
              payload: { code: "RES", description: "Duplicate", tax_engine_code: "R2", requires_certificate: false, allowed_form_types: [] }
              as: TenantAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_DUPLICATE_REASON_CODE"

  # =========================================================================
  # Section: state_machines
  # =========================================================================
  - section: state_machines
