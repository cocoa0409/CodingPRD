  # ================================================================ validations
  - section: validations
    instances:
      - name: request_missing_auth_headers_rejected
        claim_type: priority_ordering
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_USER_CONTEXT]"]
        distinguishing_aspect: "A request with no X-User-ID/X-User-Role headers AND a malformed body fails at p1 with ERR_MISSING_USER_CONTEXT (400) — auth precedes body validation (p2.7) and everything else."
        test_recipe:
          setup: ["Logical clock pinned; empty database"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: AdmissionDirector }
          trigger:
            - { call: "POST /admissions/cycles", payload: { bogus: true }, captures: { err: $.data.error_id } }
          assert:
            - "captured error_id == ERR_MISSING_USER_CONTEXT (HTTP 400), not ERR_INVALID_REQUEST"

      - name: parent_cannot_create_cycle_role_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=2]", "errors[ERR_FORBIDDEN_ROLE]", roles]
        distinguishing_aspect: "Role check (p2) precedes existence (p3): a Parent calling POST /admissions/cycles gets ERR_FORBIDDEN_ROLE (403) regardless of body validity."
        test_recipe:
          setup: ["Logical clock pinned"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: AdmissionDirector }
          trigger:
            - { call: "POST /admissions/cycles", payload: { academic_year: "2027-2028", early_deadline_at: "2026-11-01T00:00:00Z", regular_deadline_at: "2027-01-15T00:00:00Z", reenroll_response_deadline_at: "2027-03-01T00:00:00Z", melt_deadline_at: "2027-08-01T00:00:00Z", aid_budget_total_cents: 18050000 }, as: Parent, as_user_id: "fam-a", captures: { err: $.data.error_id } }
          assert:
            - "captured error_id == ERR_FORBIDDEN_ROLE (HTTP 403)"

      - name: parent_reading_other_family_forbidden
        claim_type: violation_to_error
        grounds: ["validations[priority=2.5]", "errors[ERR_FAMILY_SCOPE_VIOLATION]"]
        distinguishing_aspect: "Parent fam-b reading fam-a's application is a scope violation (403 ERR_FAMILY_SCOPE_VIOLATION), distinct from role denial — the role is allowed on the endpoint but the family chain does not match."
        test_recipe:
          setup: ["OPEN cycle, section, fam-a application DRAFT"]
          setup_api_calls:
            - { call: "POST /admissions/cycles", payload: { academic_year: "2027-2028", early_deadline_at: "2026-11-01T00:00:00Z", regular_deadline_at: "2027-01-15T00:00:00Z", reenroll_response_deadline_at: "2027-03-01T00:00:00Z", melt_deadline_at: "2027-08-01T00:00:00Z", aid_budget_total_cents: 18050000 }, as: AdmissionDirector, captures: { cyc: $.data.id } }
            - { call: "POST /admissions/grade-sections", payload: { cycle_id: "${cyc}", grade_level: "G9", capacity: 5, tuition_cents: 3000000, max_aid_seat_pct: 0.5 }, as: AdmissionDirector, captures: { sec: $.data.id } }
            - { call: "POST /admissions/cycles/${cyc}/open", payload: {}, as: AdmissionDirector }
            - { call: "POST /admissions/applicants", payload: { family_id: "fam-a", first_name: "Ann", last_name: "Able", date_of_birth: "2013-05-01" }, as: Parent, as_user_id: "fam-a", captures: { apl: $.data.id } }
            - { call: "POST /admissions/applications", payload: { applicant_id: "${apl}", cycle_id: "${cyc}", grade_section_id: "${sec}", round: "EARLY" }, as: Parent, as_user_id: "fam-a", captures: { app: $.data.id } }
          trigger:
            - { call: "GET /admissions/applications/${app}", payload: {}, as: Parent, as_user_id: "fam-b", captures: { err: $.data.error_id } }
          assert:
            - "captured error_id == ERR_FAMILY_SCOPE_VIOLATION (HTTP 403)"

      - name: verifier_cannot_finalize_own_verification
        claim_type: violation_to_error
        grounds: ["validations[priority=2.6]", "errors[ERR_SEGREGATION_OF_DUTIES]"]
        distinguishing_aspect: "Segregation of duties: fao-1 verifies, then fao-1's finalize is rejected ERR_SEGREGATION_OF_DUTIES (403); a DIFFERENT officer fao-2 finalizes successfully — the ban keys on X-User-ID, not the role."
        test_recipe:
          setup: ["OPEN cycle, section, fam-a application SUBMITTED with aid application (reported 9,500,000 hh4) verified by fao-1"]
          setup_api_calls:
            - { call: "POST /admissions/cycles", payload: { academic_year: "2027-2028", early_deadline_at: "2026-11-01T00:00:00Z", regular_deadline_at: "2027-01-15T00:00:00Z", reenroll_response_deadline_at: "2027-03-01T00:00:00Z", melt_deadline_at: "2027-08-01T00:00:00Z", aid_budget_total_cents: 18050000 }, as: AdmissionDirector, captures: { cyc: $.data.id } }
            - { call: "POST /admissions/grade-sections", payload: { cycle_id: "${cyc}", grade_level: "G9", capacity: 5, tuition_cents: 3000000, max_aid_seat_pct: 0.5 }, as: AdmissionDirector, captures: { sec: $.data.id } }
            - { call: "POST /admissions/cycles/${cyc}/open", payload: {}, as: AdmissionDirector }
            - { call: "POST /admissions/applicants", payload: { family_id: "fam-a", first_name: "Ann", last_name: "Able", date_of_birth: "2013-05-01" }, as: Parent, as_user_id: "fam-a", captures: { apl: $.data.id } }
            - { call: "POST /admissions/applications", payload: { applicant_id: "${apl}", cycle_id: "${cyc}", grade_section_id: "${sec}", round: "EARLY" }, as: Parent, as_user_id: "fam-a", captures: { app: $.data.id } }
            - { call: "POST /admissions/applications/${app}/submit", payload: {}, as: Parent, as_user_id: "fam-a" }
            - { call: "POST /admissions/aid-applications", payload: { application_id: "${app}", reported_annual_income_cents: 9500000, household_size: 4 }, as: Parent, as_user_id: "fam-a", captures: { aid: $.data.id } }
            - { call: "POST /admissions/aid-applications/${aid}/verify", payload: { verified_annual_income_cents: 9500000 }, as: FinancialAidOfficer, as_user_id: "fao-1" }
          trigger:
            - { call: "POST /admissions/aid-applications/${aid}/finalize-award", payload: {}, as: FinancialAidOfficer, as_user_id: "fao-1", captures: { err: $.data.error_id } }
            - { call: "POST /admissions/aid-applications/${aid}/finalize-award", payload: {}, as: FinancialAidOfficer, as_user_id: "fao-2" }
          assert:
            - "First finalize (same user as verifier): captured error_id == ERR_SEGREGATION_OF_DUTIES (HTTP 403), award stays PROVISIONAL"
            - "Second finalize (different user): 200, award_status == OFFERED, final_award_cents == 2370000"

      - name: duplicate_live_application_rejected_then_allowed_after_terminal
