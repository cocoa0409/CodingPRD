              call: "POST /research/vendors"
              payload: { vendor_name: "Bluepeak Systems", hq_region: "EMEA", employee_count_band: "MIDMARKET" }
              as: PlatformAdmin
              captures: { ven2_id: $.data.id }
            - *c_doc
            - call: "POST /research/documents/${doc_id}/vendor-inclusions"
              payload: { vendor_id: "${ven1_id}", dimension_scores: [{ dimension: "PRODUCT_CAPABILITY", raw_score: 4.35, weight_pct: 0.30 }, { dimension: "MARKET_EXECUTION", raw_score: 3.80, weight_pct: 0.25 }, { dimension: "CUSTOMER_VOICE", raw_score: 4.10, weight_pct: 0.20 }, { dimension: "INNOVATION_ROADMAP", raw_score: 3.25, weight_pct: 0.15 }, { dimension: "PRICING_TRANSPARENCY", raw_score: 2.90, weight_pct: 0.10 }], inclusion_criteria_met_count: 5, expected_document_version: "${doc_v}", reprint_tier: "NONE", permitted_marketing_use: "NO_USE", reprint_copies_authorized: 0 }
