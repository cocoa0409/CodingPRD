    side_effects: []
  - method: GET
    path: "/survey-waves"
    description: "list waves; optional filters category_id, status, limit, offset"
    roles: [SurveyDirector, LabManager, ContentEditor, EditorialDirector]
    code: 200
    input: ["category_id?", "status?"]
    output: "SurveyWave[]"
    side_effects: []
  - method: GET
    path: "/survey-waves/{id}"
    description: "read wave including embedded responses"
    roles: [SurveyDirector, LabManager, ContentEditor, EditorialDirector]
    code: 200
    input: []
    output: SurveyWave
    side_effects: []
  - method: POST
    path: "/survey-waves/{id}/transitions"
    description: "action submit_response (Member; requires member_id == acting X-User-ID, model_label, reliability_score, satisfaction_score) | exclude_response (SurveyDirector; requires response_index) | close | qualify (requires expected_wave_version OCC) | disqualify; fields not required by the chosen action are omitted"
    roles: [SurveyDirector, Member]
    code: 200
    input: [action, "member_id?", "model_label?", "reliability_score?", "satisfaction_score?", "response_index?", "expected_wave_version?"]
    output: SurveyWave
    side_effects: ["response_count/threshold_met recompute on submit/exclude", "version +1"]
  - method: POST
    path: "/rating-publications"
    description: "create DRAFT publication"
    roles: [ContentEditor]
    code: 201
    input: [program_id, embargo_until, "version_note?"]
    output: RatingPublication
    side_effects: []
  - method: GET
    path: "/rating-publications"
    description: "list publications; Member sees only PUBLISHED non-embargoed non-WITHDRAWN; X-Marketing-Use refused; optional filters program_id, status, limit, offset"
    roles: [ContentEditor, EditorialDirector, LabManager, SafetyOfficer, Member]
    code: 200
    input: ["program_id?", "status?"]
    output: "RatingPublication[]"
    side_effects: []
  - method: GET
    path: "/rating-publications/{id}"
    description: "read publication; Member gated by status/embargo/membership; X-Marketing-Use refused"
    roles: [ContentEditor, EditorialDirector, LabManager, SafetyOfficer, Member]
    code: 200
    input: []
    output: RatingPublication
    side_effects: []
  - method: POST
    path: "/rating-publications/{id}/transitions"
    description: "action add_rated_model (requires sample_id) | submit | approve (requires expected_program_version OCC) | request_revision | publish | withdraw | log_manufacturer_response (requires manufacturer_name, body_text) | accept_manufacturer_response (requires response_index) | reject_manufacturer_response (requires response_index); fields not required by the chosen action are omitted"
    roles: [ContentEditor, EditorialDirector]
    code: 200
    input: [action, "sample_id?", "expected_program_version?", "manufacturer_name?", "body_text?", "response_index?"]
    output: RatingPublication
    side_effects: ["per-transition cascades incl. snapshot pinning and bubble-up", "version +1"]
  - method: POST
    path: "/safety-findings"
    description: "log finding; escalation_tier and recalled_model_count computed"
    roles: [SafetyOfficer, LabTechnician]
    code: 201
    input: [program_id, sample_id, severity, description_text, hazard_flag]
    output: SafetyFinding
    side_effects: ["escalation_tier computed"]
  - method: GET
    path: "/safety-findings"
    description: "list findings; optional filters program_id, sample_id, status, severity, limit, offset"
    roles: [SafetyOfficer, EditorialDirector, LabManager, ContentEditor]
    code: 200
    input: ["program_id?", "sample_id?", "status?", "severity?"]
    output: "SafetyFinding[]"
    side_effects: []
  - method: GET
    path: "/safety-findings/{id}"
    description: "read finding"
    roles: [SafetyOfficer, EditorialDirector, LabManager, ContentEditor]
    code: 200
    input: []
    output: SafetyFinding
    side_effects: []
  - method: POST
    path: "/safety-findings/{id}/transitions"
    description: "action escalate | resolve | close per SafetyFinding machine; tier cascades on escalate"
    roles: [SafetyOfficer]
    code: 200
    input: [action]
    output: SafetyFinding
    side_effects: ["designation flip cascade (tier>=2)", "publication withdrawal cascade (tier 3)", "version +1"]
  - method: POST
    path: "/members"
    description: "register member"
    roles: [Member]
    code: 201
    input: [email, full_name]
    output: Member
    side_effects: []
  - method: POST
    path: "/members/{id}/transitions"
    description: "action add_subscription (requires plan_tier, term_start, term_end) | renew (requires subscription_id, term_end) | cancel (requires subscription_id); fields not required by the chosen action are omitted"
    roles: [Member]
    code: 200
    input: [action, "plan_tier?", "term_start?", "term_end?", "subscription_id?"]
    output: Member
    side_effects: ["grace_until compute", "renewal_count +1 on renew", "Member status cascades", "version +1"]

  - method: GET
    path: "/members/{id}"
    description: "read member (self as Member role with matching X-User-ID, or LabManager)"
    roles: [Member, LabManager]
    code: 200
    input: []
    output: Member
    side_effects: []

errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "missing/invalid auth headers" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "role not permitted for endpoint" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "referenced resource does not exist" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "action not allowed from current state, or unknown action" }
  - { id: ERR_SOURCING_INTEGRITY, http: 422, condition: "manufacturer-direct sourcing or non-anonymous purchase detected" }
  - { id: ERR_SOD_VIOLATION, http: 422, condition: "same actor on both sides of a segregated duty" }
  - { id: ERR_SAFETY_GATE, http: 422, condition: "open high-tier safety finding blocks ready/approve/publish" }
  - { id: ERR_REFERENTIAL_INTEGRITY, http: 422, condition: "FK target missing, wrong parent, or wrong state" }
  - { id: ERR_PROTOCOL_WEIGHTS, http: 422, condition: "protocol weights invalid or duplicate live protocol_code" }
  - { id: ERR_TEMPORAL_WINDOW, http: 422, condition: "window bounds invalid or action outside window" }
  - { id: ERR_SAMPLE_SIZE_NOT_MET, http: 422, condition: "survey threshold unmet, duplicate member response, or bad response_index" }
  - { id: ERR_EMBARGOED, http: 422, condition: "publication under embargo" }
  - { id: ERR_BUDGET_EXCEEDED, http: 422, condition: "PO total exceeds remaining program budget" }
  - { id: ERR_MARKETING_USE_FORBIDDEN, http: 422, condition: "ratings may not be used in marketing" }
  - { id: ERR_MEMBERSHIP_INACTIVE, http: 403, condition: "member not ACTIVE for member-only operation" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "OCC expected_*_version mismatch" }
  - { id: ERR_DUPLICATE, http: 422, condition: "uniqueness violation: category name, member email, live subscription, published publication per program" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "missing/mistyped required field" }

roles:
  - { name: LabManager, description: "categories, programs, protocols drafting, samples, clock, cycle", identity: opaque, exclusive_operations: ["create categories", "propose programs and run program transitions start_sourcing/start_testing/start_scoring/ready", "create protocols and samples", "run _cycle and set clock"], shared_operations: ["read"] }
  - { name: EditorialDirector, description: "approves programs and publications; withdraws", identity: opaque, exclusive_operations: ["program approve/cancel", "publication approve/request_revision/publish/withdraw"], shared_operations: ["read"] }
  - { name: MethodologyOfficer, description: "protocol review and activation", identity: opaque, exclusive_operations: ["protocol return_draft/activate/retire"], shared_operations: ["read"] }
  - { name: PurchasingAgent, description: "anonymous buying", identity: opaque, exclusive_operations: ["PO create/place/receive/cancel"], shared_operations: ["read"] }
  - { name: ComplianceOfficer, description: "verifies sourcing docs", identity: opaque, exclusive_operations: ["PO verify"], shared_operations: ["read"] }
  - { name: LabTechnician, description: "records measurements; logs findings", identity: opaque, exclusive_operations: ["record measurements"], shared_operations: ["read", "create safety findings"] }
  - { name: SurveyDirector, description: "survey waves", identity: opaque, exclusive_operations: ["wave create/close/qualify/disqualify/exclude_response"], shared_operations: ["read"] }
  - { name: ContentEditor, description: "drafts publications; manufacturer responses", identity: opaque, exclusive_operations: ["publication create/add_rated_model/submit/log/accept/reject manufacturer response"], shared_operations: ["read"] }
  - { name: SafetyOfficer, description: "safety findings lifecycle", identity: opaque, exclusive_operations: ["finding escalate/resolve/close"], shared_operations: ["read", "create safety findings"] }
  - { name: Member, description: "subscribing member; survey respondent; reader", identity: "entity_backed:Member", exclusive_operations: ["register", "submit_response", "add_subscription/renew/cancel own subscription"], shared_operations: ["read own record", "read published publications"] }
