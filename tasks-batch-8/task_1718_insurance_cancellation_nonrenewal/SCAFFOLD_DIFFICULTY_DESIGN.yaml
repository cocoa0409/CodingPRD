            - call: "POST /carrier/nonrenewal-cases/${nr_ut2}/dispatch-notices"
              payload: { notices: [ { recipient_kind: "POLICYHOLDER", mailed_on_date: "2026-11-02", tracking_code: "T-UT-2" } ] }
              as: Underwriter
              captures: { err_ut2: $.data.error_id }
          assert:
            - "NonrenewalCase.${nr_ut1}.notice_deadline_date == 2026-11-01 (captured ${nr_ut1_deadline})"
            - "NonrenewalCase.${nr_ut1}.status == NOTICE_SENT (mailed exactly on deadline: <= passes)"
            - "Second dispatch error_id == ERR_NONRENEWAL_NOTICE_LATE with http 422 (mailed one day past deadline)"
            - "NonrenewalCase.${nr_ut2}.status remains APPROVED"

      - name: reinstatement_at_exact_window_last_day_vs_empty_interest_notice_set
        grounds:
          - calculations.reinstatement_fee
          - errors[ERR_REINSTATEMENT_WINDOW_CLOSED]
          - errors[ERR_NOTICE_SET_INCOMPLETE]
