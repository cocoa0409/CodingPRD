# =============================================================================
# SCAFFOLD.yaml — task_3349_protective_coating_specification_applicator_approval
# §1.0–§1.7 seed tables (difficulty + corner designs live in sibling files)
# =============================================================================

scenario: |
  Protective Coating Specification & Applicator Approval (Sherwin-Williams
  Protective and Marine Coatings): coating system specification for
  infrastructure, tanks and industrial assets with surface preparation and
  film thickness requirements, applicator qualification programs with
  training, equipment and quality history verification, project specification
  review and substitution requests when an owner names a competing system,
  surface preparation inspection with hold points before coating application,
  film thickness, adhesion and holiday testing with documented inspection
  reports, warranty structures covering material and application with joint
  liability between manufacturer and applicator, environmental compliance on
  volatile organic compound limits by jurisdiction and application method,
  failure investigation distinguishing product defect from application error

domain_name: protective-coating-specification
api_prefix: /coating

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - version_pinning_on_approval
    - dual_variant_calculation
    - rate_threshold_triggers
    - optimistic_concurrency
  entity_topology: hybrid
  state_machine_shape: compound
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - self_referential
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: CoatingSystem
    parent: null
    common_fields: true
    fields:
      - { name: system_code, type: string, source: input, description: "Unique manufacturer system code, e.g. SW-MACRO-646" }
      - { name: manufacturer_name, type: string, source: input, description: "Manufacturer legal name" }
      - { name: is_competitor_system, type: boolean, source: input, default: false, description: "True when the record describes a competing (non-house) system named in a substitution request" }
      - { name: spec_revision, type: integer, source: system, default: 1, description: "Technical data-sheet revision; bumped by POST /coating/coating-systems/{id}/revise" }
      - { name: surface_prep_standard, type: enum, source: input, description: "SSPC_SP10_NEAR_WHITE | SSPC_SP6_COMMERCIAL | SSPC_SP11_POWER_TOOL | SSPC_SP1_SOLVENT" }
      - { name: min_surface_profile_mils, type: number, source: input, description: "Minimum anchor profile in mils" }
      - { name: max_surface_profile_mils, type: number, source: input, description: "Maximum anchor profile in mils; must be >= min_surface_profile_mils" }
      - { name: coat_count, type: integer, source: input, description: "Number of coats in the system (1..4)" }
      - { name: total_dft_min_mils, type: number, source: input, description: "Aggregate dry film thickness minimum across all coats" }
      - { name: total_dft_max_mils, type: number, source: input, description: "Aggregate dry film thickness maximum across all coats" }
      - { name: base_voc_gpl, type: number, source: input, description: "VOC of the coating as supplied, grams per litre" }
      - { name: thinner_voc_gpl, type: number, source: input, description: "VOC contribution of the recommended thinner, grams per litre" }
      - { name: max_thinner_pct, type: number, source: input, default: 0, description: "Maximum permitted thinner addition as a fraction of mixed volume (0..0.25)" }
      - { name: adhesion_min_psi, type: integer, source: input, description: "Minimum pull-off adhesion in psi" }
      - { name: status, type: enum, source: system, description: "ACTIVE | OBSOLETE" }

  - name: VocRegulation
    parent: null
    common_fields: true
    fields:
      - { name: jurisdiction_code, type: string, source: input, description: "Jurisdiction identifier, e.g. US-CA-SCAQMD, US-FED, EU-DE" }
      - { name: application_method, type: enum, source: input, description: "SPRAY_AIRLESS | SPRAY_CONVENTIONAL | BRUSH_ROLLER" }
      - { name: voc_limit_gpl, type: integer, source: input, description: "Maximum permitted VOC in g/L for this jurisdiction+method pair" }
      - { name: effective_from, type: datetime, source: input, description: "Half-open validity window start (inclusive)" }
      - { name: effective_to, type: datetime, source: input, description: "Half-open validity window end (exclusive); a regulation window [from, to) may abut its successor with zero gap but never overlap" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUPERSEDED" }

  - name: Applicator
    parent: null
    common_fields: true
    fields:
      - { name: company_name, type: string, source: input, description: "Applicator company legal name" }
      - { name: contact_email, type: string, source: input, description: "Primary contact email" }
      - { name: quality_history_score, type: integer, source: computed, default: 500, description: "Running quality score 0..1000; starts 500; events add/subtract per quality_history_score calculation; floor 0, ceiling 1000" }
      - { name: consecutive_passed_inspections, type: integer, source: computed, default: 0, description: "Count of consecutive ACCEPTED inspection reports; resets to 0 on any REJECTED report" }
      - { name: status, type: enum, source: system, description: "REGISTERED | ACTIVE" }

  - name: QualificationProgram
    parent: null
    common_fields: true
    fields:
      - { name: program_code, type: string, source: input, description: "Unique program code, e.g. QP-TANK-LINING" }
      - { name: coating_system_id, type: string, source: input, description: "FK -> CoatingSystem.id; the program certifies applicators for this system" }
      - { name: min_quality_history_score, type: integer, source: input, description: "Applicator must hold at least this quality_history_score to be certified" }
      - { name: min_consecutive_passed_inspections, type: integer, source: input, default: 3, description: "Applicator must have this many consecutive accepted inspection reports to be certified" }
      - { name: requires_training, type: boolean, source: input, default: true, description: "Whether documented manufacturer training is mandatory" }
      - { name: requires_equipment_audit, type: boolean, source: input, default: true, description: "Whether spray-equipment audit records are mandatory" }
      - { name: status, type: enum, source: system, description: "ACTIVE | RETIRED" }

  - name: ApplicatorQualification
    parent: Applicator
    common_fields: true
    fields:
      - { name: applicator_id, type: string, source: system, description: "FK -> Applicator.id; qualified company" }
      - { name: program_id, type: string, source: input, description: "FK -> QualificationProgram.id; program the qualification is under" }
      - { name: training_completed_at, type: datetime, source: input, description: "Timestamp of completed manufacturer training; null allowed at creation" }
      - { name: equipment_audit_passed, type: boolean, source: input, default: false, description: "Whether the most recent equipment audit passed" }
      - { name: suspension_count, type: integer, source: computed, default: 0, description: "Number of times this qualification has entered SUSPENDED" }
      - { name: status, type: enum, source: system, description: "CANDIDATE → CERTIFIED → {SUSPENDED ↔ CERTIFIED, PROBATION → CERTIFIED|SUSPENDED, REVOKED}" }

  - name: Project
    parent: null
    common_fields: true
    fields:
      - { name: project_name, type: string, source: input, description: "Owner's project name" }
      - { name: owner_name, type: string, source: input, description: "Asset owner legal name" }
      - { name: jurisdiction_code, type: string, source: input, description: "Jurisdiction where work occurs; drives VOC compliance checks" }
      - { name: asset_type, type: enum, source: input, description: "BRIDGE | TANK_EXTERIOR | TANK_INTERIOR | PIPELINE | STRUCTURAL_STEEL" }
      - { name: warranty_budget_cents, type: integer, source: input, description: "Owner-funded warranty reserve ceiling; total exposure across issued warranties must not exceed it" }
      - { name: committed_warranty_exposure_cents, type: integer, source: computed, default: 0, description: "Sum of exposure_cents over all Warranties on this project in status ACTIVE or CLAIMED" }
      - { name: status, type: enum, source: system, description: "PLANNING → SPECIFIED → IN_PROGRESS → COMPLETED | CANCELLED" }

  - name: ProjectSpecification
    parent: Project
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> Project.id; owning project" }
      - { name: coating_system_id, type: string, source: input, description: "FK -> CoatingSystem.id; named system (house or competitor)" }
      - { name: pinned_spec_revision, type: integer, source: system, description: "CoatingSystem.spec_revision pinned at issuance; later revisions of the system do NOT migrate issued specs" }
      - { name: supersedes_specification_id, type: string, source: input, description: "FK -> ProjectSpecification.id; self-referential link when this spec revises an earlier one; null for the first spec" }
      - { name: pinned_voc_regulation_id, type: string, source: computed, description: "FK -> VocRegulation.id; the ACTIVE regulation whose [effective_from, effective_to) window contains issuance time, for the project's jurisdiction and planned application method" }
      - { name: application_method, type: enum, source: input, description: "SPRAY_AIRLESS | SPRAY_CONVENTIONAL | BRUSH_ROLLER" }
      - { name: voc_at_issuance_gpl, type: number, source: computed, description: "As-applied VOC computed at issuance via voc_compliance calculation and frozen on the spec" }
      - { name: status, type: enum, source: system, description: "DRAFT → ISSUED → SUPERSEDED | WITHDRAWN" }

  - name: SubstitutionRequest
    parent: ProjectSpecification
    common_fields: true
    fields:
      - { name: specification_id, type: string, source: system, description: "FK -> ProjectSpecification.id; the ISSUED spec being challenged" }
      - { name: proposed_coating_system_id, type: string, source: input, description: "FK -> CoatingSystem.id; competing system proposed" }
      - { name: rationale, type: string, source: input, description: "Free-text substitution rationale" }
      - { name: review_round, type: integer, source: computed, default: 1, description: "Increments each time the request re-enters UNDER_REVIEW from MORE_INFO_REQUESTED" }
      - { name: max_review_rounds, type: integer, source: input, default: 3, description: "Rejection is forced once review_round would exceed this" }
      - { name: decision_reason, type: string, source: input, description: "Required on APPROVE and REJECT decisions; forbidden otherwise" }
      - { name: status, type: enum, source: system, description: "SUBMITTED → UNDER_REVIEW → {APPROVED | REJECTED | MORE_INFO_REQUESTED → SUBMITTED}" }

  - name: WorkOrder
    parent: Project
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> Project.id; owning project" }
      - { name: specification_id, type: string, source: input, description: "FK -> ProjectSpecification.id; must be ISSUED and current (not SUPERSEDED)" }
      - { name: applicator_id, type: string, source: input, description: "FK -> Applicator.id; must hold a CERTIFIED qualification for the spec's coating system" }
      - { name: asset_zone, type: string, source: input, description: "Free-form zone label; window conflicts are evaluated per (project_id, asset_zone)" }
      - { name: window_start, type: datetime, source: input, description: "Closed-interval application window start (inclusive)" }
      - { name: window_end, type: datetime, source: input, description: "Closed-interval application window end (inclusive); touching endpoints count as overlap — back-to-back windows on the same zone are rejected" }
      - { name: hold_point_prep_released, type: boolean, source: computed, default: false, description: "True once a surface preparation inspection has been PASSED for this work order" }
      - { name: status, type: enum, source: system, description: "SCHEDULED → PREP_INSPECTION → PREP_APPROVED → COATING_IN_PROGRESS → COMPLETED | ON_HOLD | CANCELLED" }

  - name: SurfacePreparationInspection
    parent: WorkOrder
    common_fields: true
    fields:
      - { name: work_order_id, type: string, source: system, description: "FK -> WorkOrder.id; inspected work order" }
      - { name: inspector_id, type: string, source: system, description: "X-User-ID of the Inspector who filed; never equal to the work order's applicator identity (segregation of duties)" }
      - { name: observed_prep_standard, type: enum, source: input, description: "SSPC_SP10_NEAR_WHITE | SSPC_SP6_COMMERCIAL | SSPC_SP11_POWER_TOOL | SSPC_SP1_SOLVENT" }
      - { name: measured_profile_mils, type: number, source: input, description: "Measured anchor profile in mils" }
      - { name: soluble_salt_ug_cm2, type: number, source: input, description: "Measured soluble salt contamination in micrograms per square centimetre" }
      - { name: ambient_dew_point_spread_c, type: number, source: input, description: "Steel temperature minus dew point, degrees C; must be >= 3.0 to pass" }
      - { name: result, type: enum, source: computed, description: "PASSED | FAILED; computed by surface_prep_verdict calculation at filing" }
      - { name: failure_reasons, type: array, source: computed, description: "Ordered list of violated prep checks, empty when PASSED" }

  - name: CoatingApplication
    parent: WorkOrder
    common_fields: true
    fields:
      - { name: work_order_id, type: string, source: system, description: "FK -> WorkOrder.id; coated work order" }
      - { name: coat_number, type: integer, source: input, description: "1-based coat index; unique per work order; must not exceed coating system's coat_count" }
      - { name: applied_at, type: datetime, source: input, description: "Application timestamp; must fall inside the work order's [window_start, window_end]" }
      - { name: thinner_pct_used, type: number, source: input, default: 0, description: "Thinner fraction actually used (0..max_thinner_pct)" }
      - { name: applied_voc_gpl, type: number, source: computed, description: "As-applied VOC via voc_compliance AS_APPLIED variant" }
      - { name: voc_compliant, type: boolean, source: computed, description: "applied_voc_gpl <= regulation limit for project jurisdiction + spec application_method at applied_at" }
      - { name: cure_state, type: enum, source: system, description: "WET → CURED | INVALID; parallel dimension 1" }
      - { name: acceptance_state, type: enum, source: system, description: "UNTESTED → TESTED | WAIVED; parallel dimension 2" }

  - name: InspectionReport
    parent: CoatingApplication
    common_fields: true
    fields:
      - { name: coating_application_id, type: string, source: system, description: "FK -> CoatingApplication.id; inspected coat" }
      - { name: inspector_id, type: string, source: system, description: "X-User-ID of the filing Inspector (segregation of duties vs applicator)" }
      - { name: spot_dft_readings_mils, type: array, source: input, description: "List of >= 3 spot DFT readings (mils), one per gage measurement" }
      - { name: adhesion_readings_psi, type: array, source: input, description: "List of >= 1 pull-off adhesion readings (psi)" }
      - { name: holiday_count, type: integer, source: input, description: "Pinholes/holidays found over tested_area_m2" }
      - { name: tested_area_m2, type: number, source: input, description: "Tested surface area in square metres; must be > 0" }
      - { name: dft_verdict, type: enum, source: computed, description: "PASS | FAIL per dft_acceptance calculation" }
      - { name: adhesion_verdict, type: enum, source: computed, description: "PASS | FAIL; min(adhesion_readings_psi) >= CoatingSystem.adhesion_min_psi" }
      - { name: holiday_verdict, type: enum, source: computed, description: "PASS | FAIL per holiday_density calculation" }
      - { name: overall_verdict, type: enum, source: computed, description: "ACCEPTED | REJECTED; ACCEPTED iff all three sub-verdicts PASS" }

  - name: Warranty
    parent: Project
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> Project.id; covered project" }
      - { name: work_order_id, type: string, source: input, description: "FK -> WorkOrder.id; must be COMPLETED" }
      - { name: term_years, type: integer, source: input, description: "Warranty term 1..20" }
      - { name: exposure_cents, type: integer, source: input, description: "Total joint liability exposure; material_share + application_share must equal it at all times" }
      - { name: material_share_cents, type: integer, source: computed, description: "Manufacturer's liability share per warranty_liability_split" }
      - { name: application_share_cents, type: integer, source: computed, description: "Applicator's liability share per warranty_liability_split" }
      - { name: manufacturer_fault_pct, type: integer, source: system, default: 50, description: "Fault allocation 0..100; 50 until a failure investigation decides otherwise" }
      - { name: status, type: enum, source: system, description: "ACTIVE → CLAIMED → {RESOLVED, DENIED} | VOIDED" }

  - name: FailureInvestigation
    parent: Warranty
    common_fields: true
    fields:
      - { name: warranty_id, type: string, source: system, description: "FK -> Warranty.id; warranty under claim" }
      - { name: opened_by, type: enum, source: input, description: "OWNER | MANUFACTURER | APPLICATOR" }
      - { name: defect_mode, type: enum, source: input, description: "ADHESION_LOSS | CRACKING | CORROSION_UNDERFILM | DELAMINATION | COLOR_GLOSS_DRIFT" }
      - { name: evidence_notes, type: string, source: input, description: "Field evidence summary" }
      - { name: adjudicated_fault_pct, type: integer, source: input, description: "Final manufacturer fault percent 0..100; set only by the adjudicate transition" }
      - { name: status, type: enum, source: system, description: "OPENED → EVIDENCE_GATHERING → {ADJUDICATED_PRODUCT_DEFECT | ADJUDICATED_APPLICATION_ERROR | ADJUDICATED_SHARED | CLOSED_NO_DEFECT}" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: CoatingSystem
    initial_state: ACTIVE
    terminal_states: [OBSOLETE]
    transitions:
      - from: ACTIVE
        to: OBSOLETE
        trigger: "POST /coating/coating-systems/{id}/obsolete"
        actor: TechnicalServiceEngineer
        preconditions:
          - "No ProjectSpecification in DRAFT or ISSUED references this system (ERR_SYSTEM_IN_USE)"
        side_effects:
          - "Any SubstitutionRequest proposing this system and still in SUBMITTED/UNDER_REVIEW/MORE_INFO_REQUESTED → REJECTED with decision_reason 'proposed system obsoleted'"
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /coating/coating-systems/{id}/revise"
        actor: TechnicalServiceEngineer
        preconditions:
          - "System in ACTIVE (ERR_SYSTEM_OBSOLETE)"
        side_effects:
          - "spec_revision increments by 1"
          - "version increments by 1"
          - "Issued ProjectSpecifications keep their pinned_spec_revision (no migration)"
          - "DRAFT ProjectSpecifications referencing this system are invalidated → WITHDRAWN with project.version incremented"

  - entity: VocRegulation
    initial_state: ACTIVE
    terminal_states: [SUPERSEDED]
    transitions:
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "POST /coating/voc-regulations/{id}/supersede"
        actor: ComplianceOfficer
        preconditions:
          - "payload successor window [new_effective_from, new_effective_to) has new_effective_from == this regulation's effective_to (zero-gap abutment, half-open semantics) (ERR_REGULATION_GAP)"
        side_effects:
          - "A successor VocRegulation row is created ACTIVE with the successor window and same jurisdiction_code + application_method"

  - entity: Applicator
    initial_state: REGISTERED
    terminal_states: []
    transitions:
      - from: REGISTERED
        to: ACTIVE
        trigger: "system (automatic when the applicator's first ApplicatorQualification reaches CERTIFIED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: ACTIVE
        trigger: "system (score recompute events)"
        actor: system
        preconditions: []
        side_effects:
          - "quality_history_score recomputed per quality_history_score calculation; if score drops below any QualificationProgram.min_quality_history_score for a program where the applicator holds CERTIFIED status, that ApplicatorQualification → SUSPENDED"

  - entity: ApplicatorQualification
    initial_state: CANDIDATE
    terminal_states: [REVOKED]
    transitions:
      - from: CANDIDATE
        to: CERTIFIED
        trigger: "POST /coating/applicators/{applicatorId}/qualifications/{id}/certify"
        actor: TechnicalServiceEngineer
        preconditions:
          - "Program.status == ACTIVE (ERR_PROGRAM_NOT_ACTIVE)"
          - "Applicator.quality_history_score >= program.min_quality_history_score (ERR_QUALITY_SCORE_TOO_LOW)"
          - "Applicator.consecutive_passed_inspections >= program.min_consecutive_passed_inspections (ERR_INSUFFICIENT_PASS_STREAK)"
          - "program.requires_training == false OR training_completed_at is not null (ERR_TRAINING_MISSING)"
          - "program.requires_equipment_audit == false OR equipment_audit_passed == true (ERR_EQUIPMENT_AUDIT_MISSING)"
        side_effects:
          - "If Applicator.status == REGISTERED → ACTIVE"
      - from: CERTIFIED
        to: SUSPENDED
        trigger: "POST /coating/applicators/{applicatorId}/qualifications/{id}/suspend OR system (score-driven cascade from Applicator score drop)"
        actor: TechnicalServiceEngineer
        preconditions:
          - "Qualification in CERTIFIED (ERR_QUALIFICATION_NOT_CERTIFIED)"
        side_effects:
          - "suspension_count increments by 1"
          - "WorkOrders naming this applicator that are in SCHEDULED, PREP_INSPECTION or PREP_APPROVED → ON_HOLD"
      - from: SUSPENDED
        to: CERTIFIED
        trigger: "POST /coating/applicators/{applicatorId}/qualifications/{id}/reinstate"
        actor: TechnicalServiceEngineer
        preconditions:
          - "suspension_count < 3 (ERR_REINSTATE_LIMIT_EXCEEDED)"
          - "Applicator.quality_history_score >= program.min_quality_history_score (ERR_QUALITY_SCORE_TOO_LOW)"
        side_effects:
          - "WorkOrders ON_HOLD for this applicator return to their pre-hold state (SCHEDULED if hold_point_prep_released == false, PREP_APPROVED if true)"
      - from: SUSPENDED
        to: REVOKED
        trigger: "POST /coating/applicators/{applicatorId}/qualifications/{id}/revoke"
        actor: TechnicalServiceEngineer
        preconditions:
          - "Qualification in SUSPENDED (ERR_QUALIFICATION_NOT_SUSPENDED)"
        side_effects:
          - "WorkOrders ON_HOLD for this applicator → CANCELLED (release nothing else; warranties already issued unaffected)"
      - from: CERTIFIED
        to: PROBATION
        trigger: "system (automatic when a FailureInvestigation reaches ADJUDICATED_APPLICATION_ERROR for a warranty whose work order used this applicator's qualification)"
        actor: system
        preconditions: []
        side_effects:
          - "Applicator.quality_history_score decremented by PROBATION_PENALTY (150)"
      - from: PROBATION
        to: CERTIFIED
        trigger: "system (automatic when the applicator subsequently accumulates 2 consecutive ACCEPTED InspectionReports after entering PROBATION)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PROBATION
        to: SUSPENDED
        trigger: "system (automatic on any REJECTED InspectionReport while in PROBATION)"
        actor: system
        preconditions: []
        side_effects:
          - "suspension_count increments by 1"
          - "WorkOrders in SCHEDULED/PREP_INSPECTION/PREP_APPROVED for this applicator → ON_HOLD"

  - entity: Project
    initial_state: PLANNING
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: PLANNING
        to: SPECIFIED
        trigger: "system (automatic when the project's first ProjectSpecification reaches ISSUED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: SPECIFIED
        to: IN_PROGRESS
        trigger: "system (automatic when the project's first WorkOrder leaves SCHEDULED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /coating/projects/{id}/complete"
        actor: ProjectEngineer
        preconditions:
          - "All WorkOrders on the project in COMPLETED or CANCELLED (ERR_OPEN_WORK_ORDERS_EXIST)"
        side_effects: []
      - from: PLANNING
        to: CANCELLED
        trigger: "POST /coating/projects/{id}/cancel"
        actor: ProjectEngineer
        preconditions: []
        side_effects:
          - "DRAFT ProjectSpecifications → WITHDRAWN"
      - from: SPECIFIED
        to: CANCELLED
        trigger: "POST /coating/projects/{id}/cancel"
        actor: ProjectEngineer
        preconditions: []
        side_effects:
          - "DRAFT ProjectSpecifications → WITHDRAWN; ISSUED specifications → SUPERSEDED"
          - "SCHEDULED WorkOrders → CANCELLED"
      - from: IN_PROGRESS
        to: CANCELLED
        trigger: "POST /coating/projects/{id}/cancel"
        actor: ProjectEngineer
        preconditions:
          - "All WorkOrders already terminal (ERR_OPEN_WORK_ORDERS_EXIST)"
        side_effects:
          - "DRAFT specs → WITHDRAWN; ISSUED specs → SUPERSEDED"

  - entity: ProjectSpecification
    initial_state: DRAFT
    terminal_states: [SUPERSEDED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /coating/projects/{projectId}/specifications/{id}/issue"
        actor: ProjectEngineer
        preconditions:
          - "Project in PLANNING or SPECIFIED (ERR_PROJECT_NOT_SPECIFIABLE)"
          - "Referenced CoatingSystem in ACTIVE (ERR_SYSTEM_OBSOLETE)"
          - "voc_compliance AS_SUPPLIED variant evaluated against pinned VocRegulation: base_voc_gpl <= voc_limit_gpl (ERR_VOC_LIMIT_EXCEEDED)"
          - "No other ISSUED ProjectSpecification on this project unless payload supersedes it via expected_project_version OCC (ERR_ACTIVE_SPEC_EXISTS)"
        side_effects:
          - "pinned_spec_revision := CoatingSystem.spec_revision"
          - "pinned_voc_regulation_id := ACTIVE VocRegulation for (project.jurisdiction_code, application_method) whose half-open window contains now"
          - "voc_at_issuance_gpl := AS_SUPPLIED variant value"
          - "If supersedes_specification_id set: that spec → SUPERSEDED, its pending SubstitutionRequests → REJECTED, its SCHEDULED WorkOrders → CANCELLED"
          - "Project.version increments by 1 (OCC guard via expected_project_version)"
          - "If Project in PLANNING → SPECIFIED"
      - from: ISSUED
        to: SUPERSEDED
        trigger: "system (when a successor spec with supersedes_specification_id == this id is ISSUED, or on project cancel, or on CoatingSystem revise invalidation)"
        actor: system
        preconditions: []
        side_effects:
          - "SUBMITTED/UNDER_REVIEW/MORE_INFO_REQUESTED SubstitutionRequests → REJECTED (decision_reason 'specification superseded')"
          - "SCHEDULED WorkOrders referencing this spec → CANCELLED"
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /coating/projects/{projectId}/specifications/{id}/withdraw OR system (project cancel / system revision invalidation)"
        actor: ProjectEngineer
        preconditions: []
        side_effects: []

  - entity: SubstitutionRequest
    initial_state: SUBMITTED
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /coating/specifications/{specId}/substitution-requests/{id}/start-review"
        actor: TechnicalServiceEngineer
        preconditions:
          - "Specification in ISSUED (ERR_SPEC_NOT_ISSUED)"
        side_effects: []
      - from: UNDER_REVIEW
        to: MORE_INFO_REQUESTED
        trigger: "POST /coating/specifications/{specId}/substitution-requests/{id}/request-info"
        actor: TechnicalServiceEngineer
        preconditions:
          - "review_round < max_review_rounds (ERR_REVIEW_ROUND_EXHAUSTED)"
        side_effects: []
      - from: MORE_INFO_REQUESTED
        to: SUBMITTED
        trigger: "POST /coating/specifications/{specId}/substitution-requests/{id}/resubmit"
        actor: OwnerRepresentative
        preconditions: []
        side_effects:
          - "review_round increments by 1"
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /coating/specifications/{specId}/substitution-requests/{id}/decide with decision=APPROVE"
        actor: TechnicalServiceEngineer
        preconditions:
          - "decision_reason present (ERR_DECISION_REASON_REQUIRED)"
          - "Proposed CoatingSystem in ACTIVE (ERR_SYSTEM_OBSOLETE)"
          - "Proposed system's base_voc_gpl <= pinned regulation voc_limit_gpl under AS_SUPPLIED variant (ERR_VOC_LIMIT_EXCEEDED)"
          - "Proposed system's total_dft_min_mils >= current spec system's total_dft_min_mils (ERR_DFT_REGRESSION)"
        side_effects:
          - "A DRAFT ProjectSpecification is created on the same project with coating_system_id = proposed system and supersedes_specification_id = challenged spec"
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /coating/specifications/{specId}/substitution-requests/{id}/decide with decision=REJECT"
        actor: TechnicalServiceEngineer
        preconditions:
          - "decision_reason present (ERR_DECISION_REASON_REQUIRED)"
        side_effects: []

  - entity: WorkOrder
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: PREP_INSPECTION
        trigger: "POST /coating/projects/{projectId}/work-orders/{id}/begin-prep-inspection"
        actor: ApplicatorRep
        preconditions:
          - "Applicator's qualification for the spec's coating system in CERTIFIED (ERR_QUALIFICATION_NOT_CERTIFIED)"
        side_effects:
          - "If Project in SPECIFIED → IN_PROGRESS"
      - from: PREP_INSPECTION
        to: PREP_APPROVED
        trigger: "system (automatic when a SurfacePreparationInspection with result PASSED is filed for this work order)"
        actor: system
        preconditions: []
        side_effects:
          - "hold_point_prep_released := true"
      - from: PREP_INSPECTION
        to: SCHEDULED
        trigger: "system (automatic when a SurfacePreparationInspection with result FAILED is filed)"
        actor: system
        preconditions: []
        side_effects:
          - "Applicator.quality_history_score -= PREP_FAILURE_PENALTY (25) via quality_history_score calculation; may cascade qualification → SUSPENDED"
      - from: PREP_APPROVED
        to: COATING_IN_PROGRESS
        trigger: "system (automatic when the first CoatingApplication is created for this work order)"
        actor: system
        preconditions:
          - "hold_point_prep_released == true (ERR_HOLD_POINT_NOT_RELEASED — enforced at CoatingApplication creation)"
        side_effects: []
      - from: COATING_IN_PROGRESS
        to: COMPLETED
        trigger: "POST /coating/projects/{projectId}/work-orders/{id}/complete"
        actor: ProjectEngineer
        preconditions:
          - "Every CoatingApplication in cure_state CURED and acceptance_state in {TESTED with ACCEPTED latest report, or WAIVED} (ERR_UNRESOLVED_COATS_EXIST)"
        side_effects:
          - "Applicator.consecutive_passed_inspections recomputed"
      - from: SCHEDULED
        to: ON_HOLD
        trigger: "system (qualification suspension cascade)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PREP_INSPECTION
        to: ON_HOLD
        trigger: "system (qualification suspension cascade)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PREP_APPROVED
        to: ON_HOLD
        trigger: "system (qualification suspension cascade)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ON_HOLD
        to: SCHEDULED
        trigger: "system (reinstatement cascade when hold_point_prep_released == false)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ON_HOLD
        to: PREP_APPROVED
        trigger: "system (reinstatement cascade when hold_point_prep_released == true)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ON_HOLD
        to: CANCELLED
        trigger: "system (qualification revocation cascade)"
        actor: system
        preconditions: []
        side_effects: []
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /coating/projects/{projectId}/work-orders/{id}/cancel OR system (spec supersede cascade)"
        actor: ProjectEngineer
        preconditions: []
        side_effects: []

  - entity: CoatingApplication
    initial_state: "cure_state: WET, acceptance_state: UNTESTED"
    terminal_states: ["cure_state: CURED | INVALID", "acceptance_state: TESTED | WAIVED"]
    transitions:
      - from: "cure_state WET"
        to: "cure_state CURED"
        trigger: "POST /coating/work-orders/{woId}/applications/{id}/mark-cured"
        actor: ApplicatorRep
        preconditions:
          - "Cure window satisfied: now >= applied_at + cure window implied by coat schedule (min 24h per coat) (ERR_CURE_WINDOW_NOT_MET)"
        side_effects: []
      - from: "cure_state WET"
        to: "cure_state INVALID"
        trigger: "system (automatic when voc_compliant == false detected at creation — application is environmentally non-compliant)"
        actor: system
        preconditions: []
        side_effects:
          - "Applicator.quality_history_score -= VOC_VIOLATION_PENALTY (100); cascade may suspend qualification"
          - "WorkOrder remains COATING_IN_PROGRESS but the coat must be re-done: coat_number may be re-used by a new CoatingApplication row"
      - from: "acceptance_state UNTESTED"
        to: "acceptance_state TESTED"
        trigger: "system (when an InspectionReport is filed for this application)"
        actor: system
        preconditions:
          - "cure_state == CURED (ERR_COAT_NOT_CURED — enforced at InspectionReport filing)"
        side_effects:
          - "If report overall_verdict == REJECTED: Applicator.consecutive_passed_inspections := 0 and quality_history_score -= INSPECTION_FAILURE_PENALTY (75); if ACCEPTED: consecutive_passed_inspections += 1 and score += INSPECTION_PASS_BONUS (10); cascades per quality_history_score"
      - from: "acceptance_state UNTESTED"
        to: "acceptance_state WAIVED"
        trigger: "POST /coating/work-orders/{woId}/applications/{id}/waive-testing"
        actor: TechnicalServiceEngineer
        preconditions:
          - "cure_state == CURED (ERR_COAT_NOT_CURED)"
          - "Project.asset_type == STRUCTURAL_STEEL (ERR_WAIVER_NOT_PERMITTED — testing waivers only on structural steel)"
        side_effects: []

  - entity: Warranty
    initial_state: ACTIVE
    terminal_states: [RESOLVED, DENIED, VOIDED]
    transitions:
      - from: ACTIVE
        to: CLAIMED
        trigger: "POST /coating/projects/{projectId}/warranties/{id}/claim"
        actor: OwnerRepresentative
        preconditions:
          - "Warranty in ACTIVE (ERR_WARRANTY_NOT_ACTIVE)"
        side_effects:
          - "A FailureInvestigation is created in OPENED with opened_by = OWNER"
      - from: CLAIMED
        to: RESOLVED
        trigger: "system (automatic when its FailureInvestigation reaches ADJUDICATED_PRODUCT_DEFECT, ADJUDICATED_APPLICATION_ERROR, or ADJUDICATED_SHARED)"
        actor: system
        preconditions: []
        side_effects:
          - "Warranty.manufacturer_fault_pct := adjudicated_fault_pct; material_share_cents/application_share_cents re-split per warranty_liability_split"
          - "If ADJUDICATED_PRODUCT_DEFECT: manufacturer share pays; if ADJUDICATED_APPLICATION_ERROR: applicator's ApplicatorQualification → PROBATION cascade"
          - "Project.committed_warranty_exposure_cents released by exposure_cents (resolved claims stop counting)"
      - from: CLAIMED
        to: DENIED
        trigger: "system (automatic when its FailureInvestigation reaches CLOSED_NO_DEFECT)"
        actor: system
        preconditions: []
        side_effects:
          - "Project.committed_warranty_exposure_cents released by exposure_cents"
      - from: ACTIVE
        to: VOIDED
        trigger: "POST /coating/projects/{projectId}/warranties/{id}/void"
        actor: TechnicalServiceEngineer
        preconditions:
          - "Documented applicator fraud or work-order misrepresentation (free-text reason required) (ERR_VOID_REASON_REQUIRED)"
        side_effects:
          - "Project.committed_warranty_exposure_cents released by exposure_cents"

  - entity: FailureInvestigation
    initial_state: OPENED
    terminal_states: [ADJUDICATED_PRODUCT_DEFECT, ADJUDICATED_APPLICATION_ERROR, ADJUDICATED_SHARED, CLOSED_NO_DEFECT]
    transitions:
      - from: OPENED
        to: EVIDENCE_GATHERING
        trigger: "POST /coating/warranties/{warrantyId}/investigations/{id}/begin-evidence"
        actor: TechnicalServiceEngineer
        preconditions: []
        side_effects: []
      - from: EVIDENCE_GATHERING
        to: ADJUDICATED_PRODUCT_DEFECT
        trigger: "POST /coating/warranties/{warrantyId}/investigations/{id}/adjudicate with outcome=PRODUCT_DEFECT"
        actor: TechnicalServiceEngineer
        preconditions:
          - "adjudicated_fault_pct == 100 (ERR_FAULT_PCT_MISMATCH — pure product defect means 100% manufacturer fault)"
        side_effects:
          - "Warranty.manufacturer_fault_pct := 100; warranty → RESOLVED; share re-split"
      - from: EVIDENCE_GATHERING
        to: ADJUDICATED_APPLICATION_ERROR
        trigger: "POST /coating/warranties/{warrantyId}/investigations/{id}/adjudicate with outcome=APPLICATION_ERROR"
        actor: TechnicalServiceEngineer
        preconditions:
          - "adjudicated_fault_pct == 0 (ERR_FAULT_PCT_MISMATCH — pure application error means 0% manufacturer fault)"
        side_effects:
          - "Warranty.manufacturer_fault_pct := 0; warranty → RESOLVED; share re-split"
          - "ApplicatorQualification used on the warranty's work order → PROBATION; applicator score -= PROBATION_PENALTY (150); probation cascade per ApplicatorQualification machine"
      - from: EVIDENCE_GATHERING
        to: ADJUDICATED_SHARED
        trigger: "POST /coating/warranties/{warrantyId}/investigations/{id}/adjudicate with outcome=SHARED"
        actor: TechnicalServiceEngineer
        preconditions:
          - "0 < adjudicated_fault_pct < 100 (ERR_FAULT_PCT_MISMATCH — shared fault must be strictly between)"
        side_effects:
          - "Warranty.manufacturer_fault_pct := adjudicated_fault_pct; warranty → RESOLVED; share re-split"
      - from: EVIDENCE_GATHERING
        to: CLOSED_NO_DEFECT
        trigger: "POST /coating/warranties/{warrantyId}/investigations/{id}/adjudicate with outcome=NO_DEFECT"
        actor: TechnicalServiceEngineer
        preconditions:
          - "adjudicated_fault_pct omitted or null (ERR_FAULT_PCT_MISMATCH — no-defect carries no fault split)"
        side_effects:
          - "Warranty → DENIED; exposure released"

# =============================================================================
# Table 2b: Concurrency Rules (§1.2.1)
# =============================================================================
concurrency_rules:
  - rule_id: spec-issue-stale-project
    parent_entity: Project
    write_endpoint: "POST /coating/projects/{projectId}/specifications/{id}/issue"
    occ_field: expected_project_version
    description: |
      Issuing a specification against a Project whose version has advanced
      since the client last observed it is rejected. This captures the case
      where another writer has just issued a superseding spec (which bumps
      Project.version per the issue transition's side effects) and the
      current writer's view of the project is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: qualification-review-stale-applicator
    parent_entity: Applicator
    write_endpoint: "POST /coating/applicators/{applicatorId}/qualifications/{id}/certify"
    occ_field: expected_applicator_version
    description: |
      Certifying an ApplicatorQualification against an Applicator whose
      version has advanced since the client last observed it is rejected,
      because score-affecting events (inspection results, prep failures,
      VOC violations) mutate Applicator.quality_history_score and bump
      Applicator.version, so the certifier's evidence view is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: voc_compliance
    trigger: "specification issuance (AS_SUPPLIED variant) and CoatingApplication creation (AS_APPLIED variant)"
    algorithm: constraint_propagation
    formula: |
      AS_SUPPLIED variant (used at spec issuance and substitution review):
        voc = CoatingSystem.base_voc_gpl
      AS_APPLIED variant (used per coat):
        t = thinner_pct_used; t_max = CoatingSystem.max_thinner_pct
        if t > t_max: reject with ERR_THINNER_LIMIT_EXCEEDED
        voc = (base_voc_gpl * (1 - t) + thinner_voc_gpl * t)   # volume-weighted mix
      Compliance check (both variants):
        regulation = ACTIVE VocRegulation where jurisdiction_code == project.jurisdiction_code
                     AND application_method == spec.application_method
                     AND effective_from <= evaluation_time < effective_to   # half-open
        compliant iff voc <= regulation.voc_limit_gpl          # inclusive boundary
      If no regulation covers evaluation_time: ERR_REGULATION_NOT_FOUND
    input_set: "CoatingSystem row; Project.jurisdiction_code; ProjectSpecification.application_method; VocRegulation rows in ACTIVE for the (jurisdiction, method) pair; evaluation_time = now at issuance or CoatingApplication.applied_at"
    constants:
      THINNER_HARD_CAP: 0.25
    precision: "1 decimal place, round_half_up on voc"
    variants:
      - name: AS_SUPPLIED
        when: "ProjectSpecification issuance; SubstitutionRequest approval review"
        difference: "Ignores thinner entirely; uses base_voc_gpl only"
      - name: AS_APPLIED
        when: "CoatingApplication creation"
        difference: "Volume-weighted mix of base + thinner VOC at the declared thinner_pct_used; different result from AS_SUPPLIED whenever thinner_pct_used > 0 and thinner_voc_gpl != base_voc_gpl"

  - name: dft_acceptance
    trigger: "InspectionReport filing"
    algorithm: weighted_scoring
    formula: |
      Readings R = spot_dft_readings_mils (>= 3 required).
      spec_min = CoatingSystem.total_dft_min_mils; spec_max = CoatingSystem.total_dft_max_mils.
      Variant SPOT_AVERAGE (default):
        avg = mean(R); minimum_spot = min(R)
        PASS iff avg >= spec_min AND avg <= spec_max AND minimum_spot >= 0.8 * spec_min
        (the 80/20 rule: no single spot below 80% of the spec minimum)
      Variant GAGE_80_20 (used when CoatingSystem.surface_prep_standard == SSPC_SP11_POWER_TOOL):
        Passing spots = count(r in R where spec_min <= r <= spec_max)
        PASS iff passing_spots >= ceil(0.8 * len(R))   # spot-count based, not average-based
      Precision: averages rounded to 1 decimal place round_half_up BEFORE comparison.
    input_set: "InspectionReport.spot_dft_readings_mils; referenced CoatingApplication -> WorkOrder -> ProjectSpecification -> CoatingSystem"
    constants:
      SPOT_FLOOR_FRACTION: 0.8
      MIN_SPOT_COUNT: 3
    precision: "1 decimal place, round_half_up"
    variants:
      - name: SPOT_AVERAGE
        when: "default for all surface_prep_standard values except SSPC_SP11_POWER_TOOL"
        difference: "Average-based verdict with 80% single-spot floor"
      - name: GAGE_80_20
        when: "system surface_prep_standard == SSPC_SP11_POWER_TOOL"
        difference: "Count-based verdict: at least 80% of spots individually in [spec_min, spec_max]; the average may fall below spec_min yet still PASS"

  - name: holiday_density
    trigger: "InspectionReport filing"
    algorithm: threshold
    formula: |
      density = holiday_count / tested_area_m2     # per square metre
      PASS iff density <= HOLIDAY_LIMIT            # inclusive boundary
      Interior tank lining (project.asset_type == TANK_INTERIOR): HOLIDAY_LIMIT = 0.0  (any single holiday fails)
      All other asset types: HOLIDAY_LIMIT = 0.1
    input_set: "InspectionReport.holiday_count, tested_area_m2; Project.asset_type"
    constants:
      HOLIDAY_LIMIT_DEFAULT: 0.1
      HOLIDAY_LIMIT_TANK_INTERIOR: 0.0
    precision: "density computed in full precision; comparison against the limit is exact"

  - name: quality_history_score
    trigger: "SurfacePreparationInspection FAILED; InspectionReport verdict; VOC violation; failure-investigation adjudication; monthly decay sweep"
    algorithm: chronological
    formula: |
      Events applied in created_at order of the triggering record:
        prep FAILED inspection:           score -= 25
        InspectionReport ACCEPTED:        score += 10; consecutive_passed_inspections += 1
        InspectionReport REJECTED:        score -= 75; consecutive_passed_inspections := 0
        VOC non-compliant application:    score -= 100
        ADJUDICATED_APPLICATION_ERROR:    score -= 150
        Monthly decay sweep (POST /coating/_clock/set_current_utc crossing a month boundary):
        score -= 5 per elapsed month without any ACCEPTED InspectionReport in that month
      score = clamp(score, 0, 1000) AFTER each event.
      Cascade: after any event, if score < min_quality_history_score of a program where the
      applicator holds CERTIFIED, that qualification → SUSPENDED (and its WorkOrder cascade fires).
    input_set: "Applicator row; all event-generating children (SurfacePreparationInspections, InspectionReports, CoatingApplications, FailureInvestigations) ordered by created_at"
    constants:
      PREP_FAILURE_PENALTY: 25
      INSPECTION_PASS_BONUS: 10
      INSPECTION_FAILURE_PENALTY: 75
      VOC_VIOLATION_PENALTY: 100
      PROBATION_PENALTY: 150
      MONTHLY_DECAY: 5
      SCORE_FLOOR: 0
      SCORE_CEILING: 1000
    precision: "integer arithmetic; no rounding"

  - name: warranty_liability_split
    trigger: "Warranty issuance; FailureInvestigation adjudication (re-split)"
    algorithm: waterfall_allocation
    formula: |
      At issuance (manufacturer_fault_pct = 50 default):
        material_share_cents    = round_half_up(exposure_cents * 0.50)
        application_share_cents = exposure_cents - material_share_cents   # remainder absorbs rounding
      At adjudication (manufacturer_fault_pct = f):
        material_share_cents    = round_half_up(exposure_cents * f / 100)
        application_share_cents = exposure_cents - material_share_cents
      Invariant: material_share_cents + application_share_cents == exposure_cents at all times.
      Issuance gate: Project.committed_warranty_exposure_cents + exposure_cents
                     <= Project.warranty_budget_cents, else ERR_WARRANTY_BUDGET_EXCEEDED (inclusive boundary: equality allowed).
    input_set: "Warranty.exposure_cents; manufacturer_fault_pct; Project.committed_warranty_exposure_cents and warranty_budget_cents"
    constants:
      DEFAULT_FAULT_PCT: 50
    precision: "integer cents; round_half_up on manufacturer share; applicator share takes the remainder"

  - name: surface_prep_verdict
    trigger: "SurfacePreparationInspection filing"
    algorithm: constraint_propagation
    formula: |
      spec = WorkOrder -> ProjectSpecification -> CoatingSystem
      reasons = []
      1. observed_prep_standard must EQUAL spec.surface_prep_standard        (else PREP_STANDARD_MISMATCH)
      2. spec.min_surface_profile_mils <= measured_profile_mils <= spec.max_surface_profile_mils  (else PROFILE_OUT_OF_RANGE; inclusive bounds)
      3. soluble_salt_ug_cm2 <= 10.0                                         (else SALT_EXCEEDED; inclusive boundary at exactly 10.0)
      4. ambient_dew_point_spread_c >= 3.0                                   (else DEW_POINT_SPREAD_TOO_SMALL; inclusive boundary at exactly 3.0)
      result = PASSED iff reasons == [] else FAILED with failure_reasons = reasons
      Variant STRICT_TANK: when project.asset_type == TANK_INTERIOR, salt limit tightens to 5.0
      (two valid salt limits for the same physical measurement — variant selected by asset_type).
    input_set: "SurfacePreparationInspection fields; CoatingSystem prep requirements; Project.asset_type"
    constants:
      SALT_LIMIT_DEFAULT: 10.0
      SALT_LIMIT_TANK_INTERIOR: 5.0
      DEW_POINT_SPREAD_MIN_C: 3.0
    precision: "1 decimal place comparisons, exact"
    variants:
      - name: STANDARD
        when: "all asset types except TANK_INTERIOR"
        difference: "salt limit 10.0 ug/cm2"
      - name: STRICT_TANK
        when: "project.asset_type == TANK_INTERIOR"
        difference: "salt limit 5.0 ug/cm2 — a reading of 7.0 passes STANDARD but fails STRICT_TANK"

  - name: work_order_window_conflict
    trigger: "WorkOrder creation"
    algorithm: interval_merge
    formula: |
      Candidate windows: all WorkOrders with same (project_id, asset_zone) in
      states {SCHEDULED, PREP_INSPECTION, PREP_APPROVED, COATING_IN_PROGRESS, ON_HOLD}.
      Overlap test uses CLOSED-interval semantics:
        conflict iff new.window_start <= existing.window_end AND existing.window_start <= new.window_end
      (Touching endpoints conflict: a new window starting exactly when another ends is rejected.)
      Equipment-corridor exception: if asset_zone differs, no conflict regardless of time overlap.
    input_set: "WorkOrder rows filtered by project_id, asset_zone, and the listed states"
    constants: {}
    precision: "datetime comparison at second precision"

  - name: regulation_window_uniqueness
    trigger: "VocRegulation creation and supersede"
    algorithm: interval_merge
    formula: |
      For the same (jurisdiction_code, application_method) pair, ACTIVE/SUPERSEDED regulation
      windows use HALF-OPEN [effective_from, effective_to) semantics:
        conflict iff new.effective_from < existing.effective_to AND existing.effective_from < new.effective_to
      Abutment (new.effective_from == existing.effective_to) is legal and REQUIRED at supersede
      (zero gap between a regulation and its successor; a gap is ERR_REGULATION_GAP).
    input_set: "VocRegulation rows for the same (jurisdiction_code, application_method)"
    constants: {}
    precision: "datetime comparison at second precision"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and well-formed"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Role is permitted to invoke this endpoint per §1.7"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Path resource ids exist, validated left-to-right"
    error_id: "ERR_{RESOURCE}_NOT_FOUND"
    http_status: 404
    applies_to: "all nested/parameterized endpoints"
  - priority: 4
    category: state
    check: "Target entity is in a state that permits the requested transition (per §1.2 preconditions)"
    error_id: "ERR_INVALID_STATE (with state-specific aliases ERR_SPEC_NOT_ISSUED, ERR_QUALIFICATION_NOT_CERTIFIED, ERR_WARRANTY_NOT_ACTIVE, ERR_COAT_NOT_CURED, ERR_HOLD_POINT_NOT_RELEASED, ERR_SYSTEM_OBSOLETE, ERR_PROGRAM_NOT_ACTIVE)"
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 5
    category: business_safety
    check: "Segregation of duties: the Inspector filing a SurfacePreparationInspection or InspectionReport must not be an ApplicatorRep of the same work order's applicator; the same X-User-ID may not perform prep inspection and coating application on one work order"
    error_id: ERR_SEGREGATION_OF_DUTIES_VIOLATION
    http_status: 403
    applies_to: "POST /coating/work-orders/{id}/prep-inspections, POST /coating/work-orders/{woId}/applications/{id}/inspection-reports"
  - priority: 6
    category: business_safety
    check: "VOC compliance: computed voc <= regulation voc_limit_gpl for project jurisdiction + application method at evaluation time"
    error_id: ERR_VOC_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "spec issue, substitution decide-APPROVE, CoatingApplication creation"
  - priority: 7
    category: business_safety
    check: "Thinner usage within max_thinner_pct (and absolute cap 0.25)"
    error_id: ERR_THINNER_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "CoatingApplication creation"
  - priority: 8
    category: business_safety
    check: "Environmental/regulation coverage exists for evaluation time (half-open window contains the timestamp)"
    error_id: ERR_REGULATION_NOT_FOUND
    http_status: 422
    applies_to: "spec issue, CoatingApplication creation"
  - priority: 9
    category: business_temporal
    check: "WorkOrder window closed-interval conflict on same (project_id, asset_zone)"
    error_id: ERR_WINDOW_CONFLICT
    http_status: 409
    applies_to: "WorkOrder creation"
  - priority: 10
    category: business_temporal
    check: "VocRegulation window half-open conflict or gap on same (jurisdiction_code, application_method)"
    error_id: "ERR_REGULATION_OVERLAP | ERR_REGULATION_GAP"
    http_status: 409
    applies_to: "VocRegulation creation and supersede"
  - priority: 11
    category: business_temporal
    check: "CoatingApplication.applied_at inside its work order's [window_start, window_end]; cure window of at least 24h per coat before mark-cured"
    error_id: "ERR_APPLICATION_OUTSIDE_WINDOW | ERR_CURE_WINDOW_NOT_MET"
    http_status: 422
    applies_to: "CoatingApplication creation; mark-cured"
  - priority: 12
    category: business_constraint
    check: "Cross-entity qualification gate: work order's applicator holds CERTIFIED ApplicatorQualification for a QualificationProgram whose coating_system_id == spec's coating_system_id"
    error_id: ERR_QUALIFICATION_NOT_CERTIFIED
    http_status: 409
    applies_to: "WorkOrder creation; begin-prep-inspection"
  - priority: 13
    category: business_constraint
    check: "CoatingApplication.coat_number unique per work order among non-INVALID applications and <= CoatingSystem.coat_count"
    error_id: "ERR_DUPLICATE_COAT | ERR_COAT_COUNT_EXCEEDED"
    http_status: 409
    applies_to: "CoatingApplication creation"
  - priority: 14
    category: business_constraint
    check: "Substitution review rules: review_round limits, decision_reason required on decisions, no DFT regression on approval"
    error_id: "ERR_REVIEW_ROUND_EXHAUSTED | ERR_DECISION_REASON_REQUIRED | ERR_DFT_REGRESSION"
    http_status: 422
    applies_to: "substitution request-info and decide endpoints"
  - priority: 15
    category: business_constraint
    check: "FailureInvestigation adjudication fault-pct consistency with outcome"
    error_id: ERR_FAULT_PCT_MISMATCH
    http_status: 422
    applies_to: "investigation adjudicate"
  - priority: 16
    category: business_fiscal
    check: "Warranty issuance budget gate: committed + new exposure <= warranty_budget_cents (inclusive)"
    error_id: ERR_WARRANTY_BUDGET_EXCEEDED
    http_status: 422
    applies_to: "Warranty issuance"
  - priority: 17
    category: business_referential
    check: "Referenced entities exist and are linkable: coating system ACTIVE, spec ISSUED and current, work order COMPLETED for warranty issuance"
    error_id: "ERR_SYSTEM_IN_USE | ERR_SPEC_NOT_ISSUED | ERR_WORK_ORDER_NOT_COMPLETED"
    http_status: 409
    applies_to: "various"

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  # --- test-driving clock ---
  - method: POST
    path: "/coating/_clock/set_current_utc"
    description: "Sets the server's logical clock to the given ISO8601 UTC instant. Before any call, the logical clock reads exactly 2026-09-01T00:00:00Z (never wall-clock). Crossing a calendar-month boundary fires the quality_history_score monthly decay sweep."
    roles: [PlatformAdmin]
    code: 200
    input: [current_utc]
    output: { current_utc: "datetime" }
    side_effects: ["monthly decay sweep when a month boundary is crossed"]

  # --- CoatingSystem ---
  - method: POST
    path: "/coating/coating-systems"
    description: "Register a coating system (house or competitor)"
    roles: [TechnicalServiceEngineer]
    code: 201
    input: [system_code, manufacturer_name, surface_prep_standard, min_surface_profile_mils, max_surface_profile_mils, coat_count, total_dft_min_mils, total_dft_max_mils, base_voc_gpl, thinner_voc_gpl, adhesion_min_psi, "is_competitor_system?", "max_thinner_pct?"]
    output: CoatingSystem
    side_effects: ["status = ACTIVE", "spec_revision = 1"]
  - method: GET
    path: "/coating/coating-systems"
    description: "List coating systems"
    roles: [PlatformAdmin, TechnicalServiceEngineer, ProjectEngineer, OwnerRepresentative, ComplianceOfficer, Inspector, ApplicatorRep]
    code: 200
    input: ["limit?", "offset?", "status?", "is_competitor_system?"]
    output: "CoatingSystem[]"
    side_effects: []
  - method: GET
    path: "/coating/coating-systems/{id}"
    description: "Get one coating system"
    roles: [PlatformAdmin, TechnicalServiceEngineer, ProjectEngineer, OwnerRepresentative, ComplianceOfficer, Inspector, ApplicatorRep]
    code: 200
    input: []
    output: CoatingSystem
    side_effects: []
  - method: POST
    path: "/coating/coating-systems/{id}/revise"
    description: "Issue a new technical data-sheet revision (bumps spec_revision; issued specs keep their pin)"
    roles: [TechnicalServiceEngineer]
    code: 200
    input: []
    output: CoatingSystem
    side_effects: ["spec_revision += 1", "version += 1", "DRAFT specs referencing this system → WITHDRAWN"]
  - method: POST
    path: "/coating/coating-systems/{id}/obsolete"
    description: "Mark system OBSOLETE"
    roles: [TechnicalServiceEngineer]
    code: 200
    input: []
    output: CoatingSystem
    side_effects: ["pending substitution requests proposing this system → REJECTED"]

  # --- VocRegulation ---
  - method: POST
    path: "/coating/voc-regulations"
    description: "Create a VOC regulation window for a (jurisdiction, method) pair; half-open window must not overlap siblings"
    roles: [ComplianceOfficer]
    code: 201
    input: [jurisdiction_code, application_method, voc_limit_gpl, effective_from, effective_to]
    output: VocRegulation
    side_effects: ["status = ACTIVE"]
  - method: GET
    path: "/coating/voc-regulations"
    description: "List regulations (filterable by jurisdiction_code, application_method)"
    roles: [PlatformAdmin, TechnicalServiceEngineer, ProjectEngineer, OwnerRepresentative, ComplianceOfficer, Inspector, ApplicatorRep]
    code: 200
    input: ["limit?", "offset?", "jurisdiction_code?", "application_method?"]
    output: "VocRegulation[]"
    side_effects: []
  - method: GET
    path: "/coating/voc-regulations/{id}"
    description: "Get one regulation"
    roles: [PlatformAdmin, TechnicalServiceEngineer, ProjectEngineer, OwnerRepresentative, ComplianceOfficer, Inspector, ApplicatorRep]
    code: 200
    input: []
    output: VocRegulation
    side_effects: []
  - method: POST
    path: "/coating/voc-regulations/{id}/supersede"
    description: "Supersede a regulation; successor window must abut with zero gap"
    roles: [ComplianceOfficer]
    code: 200
    input: [new_voc_limit_gpl, new_effective_from, new_effective_to]
    output: VocRegulation
    side_effects: ["this regulation → SUPERSEDED", "successor VocRegulation created ACTIVE"]

  # --- Applicator ---
  - method: POST
    path: "/coating/applicators"
    description: "Register an applicator company"
    roles: [PlatformAdmin]
    code: 201
    input: [company_name, contact_email]
    output: Applicator
    side_effects: ["status = REGISTERED", "quality_history_score = 500"]
  - method: GET
    path: "/coating/applicators"
    description: "List applicators"
    roles: [PlatformAdmin, TechnicalServiceEngineer, ProjectEngineer, ComplianceOfficer]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "Applicator[]"
    side_effects: []
  - method: GET
    path: "/coating/applicators/{id}"
    description: "Get one applicator"
    roles: [PlatformAdmin, TechnicalServiceEngineer, ProjectEngineer, ComplianceOfficer, Inspector, ApplicatorRep]
    code: 200
    input: []
    output: Applicator
    side_effects: []

  # --- QualificationProgram ---
  - method: POST
    path: "/coating/qualification-programs"
    description: "Create a qualification program bound to a coating system"
    roles: [TechnicalServiceEngineer]
    code: 201
    input: [program_code, coating_system_id, min_quality_history_score, "min_consecutive_passed_inspections?", "requires_training?", "requires_equipment_audit?"]
    output: QualificationProgram
    side_effects: ["status = ACTIVE"]
  - method: GET
    path: "/coating/qualification-programs"
    description: "List qualification programs (filterable by coating_system_id)"
    roles: [PlatformAdmin, TechnicalServiceEngineer, ProjectEngineer, ComplianceOfficer, Inspector, ApplicatorRep]
    code: 200
    input: ["limit?", "offset?", "coating_system_id?"]
    output: "QualificationProgram[]"
    side_effects: []
  - method: GET
    path: "/coating/qualification-programs/{id}"
    description: "Get one program"
    roles: [PlatformAdmin, TechnicalServiceEngineer, ProjectEngineer, ComplianceOfficer, Inspector, ApplicatorRep]
    code: 200
    input: []
    output: QualificationProgram
    side_effects: []

  # --- ApplicatorQualification ---
  - method: POST
    path: "/coating/applicators/{applicatorId}/qualifications"
    description: "Enroll an applicator in a program (CANDIDATE)"
    roles: [ApplicatorRep]
    code: 201
    input: [program_id, "training_completed_at?", "equipment_audit_passed?"]
    output: ApplicatorQualification
    side_effects: ["status = CANDIDATE"]
  - method: GET
    path: "/coating/applicators/{applicatorId}/qualifications"
    description: "List an applicator's qualifications"
    roles: [PlatformAdmin, TechnicalServiceEngineer, ComplianceOfficer, ApplicatorRep]
    code: 200
    input: ["limit?", "offset?"]
    output: "ApplicatorQualification[]"
    side_effects: []
  - method: GET
    path: "/coating/applicators/{applicatorId}/qualifications/{id}"
    description: "Get one qualification"
    roles: [PlatformAdmin, TechnicalServiceEngineer, ComplianceOfficer, ApplicatorRep]
    code: 200
    input: []
    output: ApplicatorQualification
    side_effects: []
  - method: POST
    path: "/coating/applicators/{applicatorId}/qualifications/{id}/certify"
    description: "Certify a CANDIDATE qualification (OCC-guarded on Applicator.version)"
    roles: [TechnicalServiceEngineer]
    code: 200
    input: [expected_applicator_version]
    output: ApplicatorQualification
    side_effects: ["qualification → CERTIFIED", "Applicator REGISTERED → ACTIVE if first certification", "increments Applicator.version by 1"]
  - method: POST
    path: "/coating/applicators/{applicatorId}/qualifications/{id}/suspend"
    description: "Suspend a CERTIFIED qualification"
    roles: [TechnicalServiceEngineer]
    code: 200
    input: []
    output: ApplicatorQualification
    side_effects: ["suspension_count += 1", "WorkOrder hold cascade"]
  - method: POST
    path: "/coating/applicators/{applicatorId}/qualifications/{id}/reinstate"
    description: "Reinstate a SUSPENDED qualification (max 3 suspensions lifetime)"
    roles: [TechnicalServiceEngineer]
    code: 200
    input: []
    output: ApplicatorQualification
    side_effects: ["WorkOrder un-hold cascade"]
  - method: POST
    path: "/coating/applicators/{applicatorId}/qualifications/{id}/revoke"
    description: "Revoke a SUSPENDED qualification (terminal)"
    roles: [TechnicalServiceEngineer]
    code: 200
    input: []
    output: ApplicatorQualification
    side_effects: ["ON_HOLD WorkOrders → CANCELLED"]

  # --- Project ---
  - method: POST
    path: "/coating/projects"
    description: "Create a project"
    roles: [ProjectEngineer]
    code: 201
    input: [project_name, owner_name, jurisdiction_code, asset_type, warranty_budget_cents]
    output: Project
    side_effects: ["status = PLANNING", "committed_warranty_exposure_cents = 0"]
  - method: GET
    path: "/coating/projects"
    description: "List projects"
    roles: [PlatformAdmin, TechnicalServiceEngineer, ProjectEngineer, OwnerRepresentative, ComplianceOfficer, Inspector, ApplicatorRep]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "Project[]"
    side_effects: []
  - method: GET
    path: "/coating/projects/{id}"
    description: "Get one project"
    roles: [PlatformAdmin, TechnicalServiceEngineer, ProjectEngineer, OwnerRepresentative, ComplianceOfficer, Inspector, ApplicatorRep]
    code: 200
    input: []
    output: Project
    side_effects: []
  - method: POST
    path: "/coating/projects/{id}/complete"
    description: "Complete a project (all work orders terminal)"
    roles: [ProjectEngineer]
    code: 200
    input: []
    output: Project
    side_effects: []
  - method: POST
    path: "/coating/projects/{id}/cancel"
    description: "Cancel a project"
    roles: [ProjectEngineer]
    code: 200
    input: []
    output: Project
    side_effects: ["spec and work-order cascades per Project state machine"]

  # --- ProjectSpecification ---
  - method: POST
    path: "/coating/projects/{projectId}/specifications"
    description: "Create a DRAFT specification for a project"
    roles: [ProjectEngineer]
    code: 201
    input: [coating_system_id, application_method, "supersedes_specification_id?"]
    output: ProjectSpecification
    side_effects: ["status = DRAFT"]
  - method: GET
    path: "/coating/projects/{projectId}/specifications"
    description: "List a project's specifications"
    roles: [PlatformAdmin, TechnicalServiceEngineer, ProjectEngineer, OwnerRepresentative, ComplianceOfficer, Inspector, ApplicatorRep]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "ProjectSpecification[]"
    side_effects: []
  - method: GET
    path: "/coating/projects/{projectId}/specifications/{id}"
    description: "Get one specification"
    roles: [PlatformAdmin, TechnicalServiceEngineer, ProjectEngineer, OwnerRepresentative, ComplianceOfficer, Inspector, ApplicatorRep]
    code: 200
    input: []
    output: ProjectSpecification
    side_effects: []
  - method: POST
    path: "/coating/projects/{projectId}/specifications/{id}/issue"
    description: "Issue a specification (pins system revision and VOC regulation; OCC-guarded on Project.version)"
    roles: [ProjectEngineer]
    code: 200
    input: [expected_project_version]
    output: ProjectSpecification
    side_effects: ["pinned_spec_revision, pinned_voc_regulation_id, voc_at_issuance_gpl set", "Project.version += 1", "supersede cascades"]
  - method: POST
    path: "/coating/projects/{projectId}/specifications/{id}/withdraw"
    description: "Withdraw a DRAFT specification"
    roles: [ProjectEngineer]
    code: 200
    input: []
    output: ProjectSpecification
    side_effects: []

  # --- SubstitutionRequest ---
  - method: POST
    path: "/coating/specifications/{specId}/substitution-requests"
    description: "Owner names a competing system against an ISSUED spec"
    roles: [OwnerRepresentative]
    code: 201
    input: [proposed_coating_system_id, rationale, "max_review_rounds?"]
    output: SubstitutionRequest
    side_effects: ["status = SUBMITTED", "review_round = 1"]
  - method: GET
    path: "/coating/specifications/{specId}/substitution-requests"
    description: "List substitution requests for a spec"
    roles: [PlatformAdmin, TechnicalServiceEngineer, ProjectEngineer, OwnerRepresentative]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "SubstitutionRequest[]"
    side_effects: []
  - method: GET
    path: "/coating/specifications/{specId}/substitution-requests/{id}"
    description: "Get one substitution request"
    roles: [PlatformAdmin, TechnicalServiceEngineer, ProjectEngineer, OwnerRepresentative]
    code: 200
    input: []
    output: SubstitutionRequest
    side_effects: []
  - method: POST
    path: "/coating/specifications/{specId}/substitution-requests/{id}/start-review"
    description: "Move SUBMITTED → UNDER_REVIEW"
    roles: [TechnicalServiceEngineer]
    code: 200
    input: []
    output: SubstitutionRequest
    side_effects: []
  - method: POST
    path: "/coating/specifications/{specId}/substitution-requests/{id}/request-info"
    description: "Move UNDER_REVIEW → MORE_INFO_REQUESTED"
    roles: [TechnicalServiceEngineer]
    code: 200
    input: []
    output: SubstitutionRequest
    side_effects: []
  - method: POST
    path: "/coating/specifications/{specId}/substitution-requests/{id}/resubmit"
    description: "Move MORE_INFO_REQUESTED → SUBMITTED, review_round += 1"
    roles: [OwnerRepresentative]
    code: 200
    input: [rationale]
    output: SubstitutionRequest
    side_effects: ["review_round += 1"]
  - method: POST
    path: "/coating/specifications/{specId}/substitution-requests/{id}/decide"
    description: "Approve or reject an UNDER_REVIEW substitution"
    roles: [TechnicalServiceEngineer]
    code: 200
    input: [decision, decision_reason]
    output: SubstitutionRequest
    side_effects: ["APPROVE creates a successor DRAFT spec"]

  # --- WorkOrder ---
  - method: POST
    path: "/coating/projects/{projectId}/work-orders"
    description: "Create a work order (closed-interval window; applicator must be CERTIFIED for the spec's system)"
    roles: [ProjectEngineer]
    code: 201
    input: [specification_id, applicator_id, asset_zone, window_start, window_end]
    output: WorkOrder
    side_effects: ["status = SCHEDULED"]
  - method: GET
    path: "/coating/projects/{projectId}/work-orders"
    description: "List a project's work orders"
    roles: [PlatformAdmin, TechnicalServiceEngineer, ProjectEngineer, OwnerRepresentative, ComplianceOfficer, Inspector, ApplicatorRep]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "WorkOrder[]"
    side_effects: []
  - method: GET
    path: "/coating/projects/{projectId}/work-orders/{id}"
    description: "Get one work order"
    roles: [PlatformAdmin, TechnicalServiceEngineer, ProjectEngineer, OwnerRepresentative, ComplianceOfficer, Inspector, ApplicatorRep]
    code: 200
    input: []
    output: WorkOrder
    side_effects: []
  - method: POST
    path: "/coating/projects/{projectId}/work-orders/{id}/begin-prep-inspection"
    description: "Move SCHEDULED → PREP_INSPECTION"
    roles: [ApplicatorRep]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["Project SPECIFIED → IN_PROGRESS"]
  - method: POST
    path: "/coating/projects/{projectId}/work-orders/{id}/complete"
    description: "Complete a work order (all coats resolved)"
    roles: [ProjectEngineer]
    code: 200
    input: []
    output: WorkOrder
    side_effects: []
  - method: POST
    path: "/coating/projects/{projectId}/work-orders/{id}/cancel"
    description: "Cancel a SCHEDULED work order"
    roles: [ProjectEngineer]
    code: 200
    input: []
    output: WorkOrder
    side_effects: []

  # --- SurfacePreparationInspection ---
  - method: POST
    path: "/coating/work-orders/{woId}/prep-inspections"
    description: "Inspector files a surface prep inspection; verdict computed at filing"
    roles: [Inspector]
    code: 201
    input: [observed_prep_standard, measured_profile_mils, soluble_salt_ug_cm2, ambient_dew_point_spread_c]
    output: SurfacePreparationInspection
    side_effects: ["work order PREP_INSPECTION → PREP_APPROVED (PASSED) or → SCHEDULED with score penalty (FAILED)"]
  - method: GET
    path: "/coating/work-orders/{woId}/prep-inspections"
    description: "List prep inspections for a work order"
    roles: [PlatformAdmin, TechnicalServiceEngineer, ProjectEngineer, ComplianceOfficer, Inspector, ApplicatorRep]
    code: 200
    input: ["limit?", "offset?"]
    output: "SurfacePreparationInspection[]"
    side_effects: []
  - method: GET
    path: "/coating/prep-inspections/{id}"
    description: "Get one prep inspection"
    roles: [PlatformAdmin, TechnicalServiceEngineer, ProjectEngineer, ComplianceOfficer, Inspector, ApplicatorRep]
    code: 200
    input: []
    output: SurfacePreparationInspection
    side_effects: []

  # --- CoatingApplication ---
  - method: POST
    path: "/coating/work-orders/{woId}/applications"
    description: "Record a coat application (hold point must be released; VOC computed and checked)"
    roles: [ApplicatorRep]
    code: 201
    input: [coat_number, applied_at, "thinner_pct_used?"]
    output: CoatingApplication
    side_effects: ["work order → COATING_IN_PROGRESS on first coat", "VOC non-compliance → cure_state INVALID + score penalty"]
  - method: GET
    path: "/coating/work-orders/{woId}/applications"
    description: "List coats for a work order"
    roles: [PlatformAdmin, TechnicalServiceEngineer, ProjectEngineer, ComplianceOfficer, Inspector, ApplicatorRep]
    code: 200
    input: ["limit?", "offset?"]
    output: "CoatingApplication[]"
    side_effects: []
  - method: GET
    path: "/coating/applications/{id}"
    description: "Get one coating application"
    roles: [PlatformAdmin, TechnicalServiceEngineer, ProjectEngineer, ComplianceOfficer, Inspector, ApplicatorRep]
    code: 200
    input: []
    output: CoatingApplication
    side_effects: []
  - method: POST
    path: "/coating/work-orders/{woId}/applications/{id}/mark-cured"
    description: "Mark a coat cured (24h cure window)"
    roles: [ApplicatorRep]
    code: 200
    input: []
    output: CoatingApplication
    side_effects: []
  - method: POST
    path: "/coating/work-orders/{woId}/applications/{id}/waive-testing"
    description: "Waive testing (STRUCTURAL_STEEL projects only)"
    roles: [TechnicalServiceEngineer]
    code: 200
    input: []
    output: CoatingApplication
    side_effects: ["acceptance_state → WAIVED"]

  # --- InspectionReport ---
  - method: POST
    path: "/coating/work-orders/{woId}/applications/{appId}/inspection-reports"
    description: "Inspector files a film/adhesion/holiday inspection report; verdicts computed at filing"
    roles: [Inspector]
    code: 201
    input: [spot_dft_readings_mils, adhesion_readings_psi, holiday_count, tested_area_m2]
    output: InspectionReport
    side_effects: ["application acceptance_state → TESTED", "applicator score and streak updates"]
  - method: GET
    path: "/coating/work-orders/{woId}/applications/{appId}/inspection-reports"
    description: "List inspection reports for a coat"
    roles: [PlatformAdmin, TechnicalServiceEngineer, ProjectEngineer, ComplianceOfficer, Inspector, ApplicatorRep]
    code: 200
    input: ["limit?", "offset?"]
    output: "InspectionReport[]"
    side_effects: []
  - method: GET
    path: "/coating/inspection-reports/{id}"
    description: "Get one inspection report"
    roles: [PlatformAdmin, TechnicalServiceEngineer, ProjectEngineer, ComplianceOfficer, Inspector, ApplicatorRep]
    code: 200
    input: []
    output: InspectionReport
    side_effects: []

  # --- Warranty ---
  - method: POST
    path: "/coating/projects/{projectId}/warranties"
    description: "Issue a joint-liability warranty on a COMPLETED work order"
    roles: [ProjectEngineer]
    code: 201
    input: [work_order_id, term_years, exposure_cents]
    output: Warranty
    side_effects: ["default 50/50 split computed", "project committed exposure incremented"]
  - method: GET
    path: "/coating/projects/{projectId}/warranties"
    description: "List a project's warranties"
    roles: [PlatformAdmin, TechnicalServiceEngineer, ProjectEngineer, OwnerRepresentative, ComplianceOfficer]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "Warranty[]"
    side_effects: []
  - method: GET
    path: "/coating/projects/{projectId}/warranties/{id}"
    description: "Get one warranty"
    roles: [PlatformAdmin, TechnicalServiceEngineer, ProjectEngineer, OwnerRepresentative, ComplianceOfficer]
    code: 200
    input: []
    output: Warranty
    side_effects: []
  - method: POST
    path: "/coating/projects/{projectId}/warranties/{id}/claim"
    description: "Owner files a warranty claim; opens a FailureInvestigation"
    roles: [OwnerRepresentative]
    code: 200
    input: [defect_mode, evidence_notes]
    output: Warranty
    side_effects: ["FailureInvestigation created OPENED with opened_by = OWNER"]
  - method: POST
    path: "/coating/projects/{projectId}/warranties/{id}/void"
    description: "Void a warranty for fraud/misrepresentation"
    roles: [TechnicalServiceEngineer]
    code: 200
    input: [void_reason]
    output: Warranty
    side_effects: ["exposure released"]

  # --- FailureInvestigation ---
  - method: GET
    path: "/coating/warranties/{warrantyId}/investigations"
    description: "List investigations for a warranty"
    roles: [PlatformAdmin, TechnicalServiceEngineer, ProjectEngineer, OwnerRepresentative, ComplianceOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: "FailureInvestigation[]"
    side_effects: []
  - method: GET
    path: "/coating/warranties/{warrantyId}/investigations/{id}"
    description: "Get one investigation"
    roles: [PlatformAdmin, TechnicalServiceEngineer, ProjectEngineer, OwnerRepresentative, ComplianceOfficer]
    code: 200
    input: []
    output: FailureInvestigation
