            - "L2 starting 2026-10-22 created (201): gap of exactly 7 days satisfies the buffer (conflict iff new_start <= other_end + 6)"
            - "L3 starting 2026-10-21 fails with ERR_CREW_WINDOW_CONFLICT (409): 2026-10-21 <= 2026-10-15 + 6 days"
            - "Lease.${lease1}.lease_status == NEGOTIATING and Lease.${lease2}.lease_status == NEGOTIATING"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: approve_withdraw_capex_conservation
        grounds:
          - calculations.market_capex_commitment
          - state_machines.Site.IN_COMMITTEE_to_APPROVED
          - state_machines.Site.APPROVED_to_WITHDRAWN
        distinguishing_aspect: |
          Conserved quantity is money (capex cents): ratify-APPROVE adds
          build_cost_cents to Market.committed_capex_cents and withdraw from
          APPROVED releases exactly the same amount, so committed_capex_cents
          after the forward+compensating pair equals its pre-approve value (0).
        test_recipe:
          setup:
            - "Site with build_cost_cents 500000000 fully through committee (E=4 approve chain); market committed_capex_cents == 0 before ratify"
          setup_api_calls:
            - call: "POST /api/markets"
              payload: { name: "Metro CI", state_code: "TX", population: 500000, median_household_income_cents: 9000000, population_growth_bp: 300, psychographic_index: 130, base_target_stores: 5, annual_capex_budget_cents: 2000000000, max_rent_psf_cents: 40000, prototype_sales_cents: 900000000 }
              as: PlatformAdmin
              captures: { mkt_id: $.data.id }
            - call: "POST /api/markets/${mkt_id}/evaluate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /api/stores"
              payload: { market_id: "${mkt_id}", store_code: "N1", format_type: "STANDARD", annual_sales_cents: 1200000000 }
              as: PlatformAdmin
            - call: "POST /api/stores"
              payload: { market_id: "${mkt_id}", store_code: "N2", format_type: "STANDARD", annual_sales_cents: 1000000000 }
              as: PlatformAdmin
            - call: "POST /api/sites"
              payload: { market_id: "${mkt_id}", address: "5 Elm St", format_type: "STANDARD", square_footage: 10000, asking_rent_psf_cents: 3000, cam_psf_cents: 800, tax_psf_cents: 400, build_cost_cents: 500000000 }
              as: RealEstateAnalyst
              captures: { site_id: $.data.id }
            - call: "POST /api/sites/${site_id}/run-screening"
              payload: {}
              as: RealEstateAnalyst
            - call: "POST /api/trade-area-models"
              payload: { site_id: "${site_id}", drive_time_minutes: 15, trade_area_population: 50000, per_capita_spend_cents: 300000, cannibalization_variant: "FLAT_BAND" }
              as: RealEstateAnalyst
              captures: { mdl_id: $.data.id }
            - call: "GET /api/sites/${site_id}"
              as: RealEstateAnalyst
              captures: { site_v: $.data.version }
            - call: "POST /api/trade-area-models/${mdl_id}/lock"
              payload: { expected_site_version: "${site_v}" }
              as: RealEstateAnalyst
            - call: "POST /api/site-visits"
              payload: { site_id: "${site_id}", visited_on: "2026-08-05", visibility_score: 80, access_score: 90, parking_score: 70, cotenancy_score: 85 }
              as: RealEstateAnalyst
            - call: "POST /api/sales-forecasts"
              payload: { site_id: "${site_id}", trade_area_model_id: "${mdl_id}", model_variant: "ANALOG" }
              as: RealEstateAnalyst
              captures: { fc_id: $.data.id }
            - call: "POST /api/sales-forecasts/${fc_id}/lock"
              payload: {}
              as: RealEstateAnalyst
            - call: "POST /api/committee-members"
              payload: { display_name: "Sponsor" }
              as: PlatformAdmin
              captures: { sp_id: $.data.id }
            - call: "POST /api/committee-members"
              payload: { display_name: "Chair", is_chair: true }
              as: PlatformAdmin
              captures: { ch_id: $.data.id }
            - call: "POST /api/committee-members"
              payload: { display_name: "Voter1" }
              as: PlatformAdmin
              captures: { v1_id: $.data.id }
            - call: "POST /api/committee-members"
              payload: { display_name: "Voter2" }
              as: PlatformAdmin
              captures: { v2_id: $.data.id }
            - call: "POST /api/committee-members"
              payload: { display_name: "Voter3" }
              as: PlatformAdmin
              captures: { v3_id: $.data.id }
            - call: "POST /api/sites/${site_id}/submit-committee"
              payload: { sales_forecast_id: "${fc_id}", sponsor_member_id: "${sp_id}", expires_at: "2026-08-15T00:00:00Z" }
              as: RealEstateManager
              captures: { rev_id: $.data.id, rv0: $.data.version }
            - call: "POST /api/committee-reviews/${rev_id}/votes"
              payload: { ballot: "APPROVE", expected_review_version: "${rv0}" }
              as: CommitteeMember
              as_user_id: "${v1_id}"
            - call: "GET /api/committee-reviews/${rev_id}"
              as: RealEstateManager
              captures: { rv1: $.data.version }
            - call: "POST /api/committee-reviews/${rev_id}/votes"
              payload: { ballot: "APPROVE", expected_review_version: "${rv1}" }
              as: CommitteeMember
              as_user_id: "${v2_id}"
            - call: "GET /api/committee-reviews/${rev_id}"
              as: RealEstateManager
              captures: { rv2: $.data.version }
            - call: "POST /api/committee-reviews/${rev_id}/votes"
              payload: { ballot: "REJECT", expected_review_version: "${rv2}" }
              as: CommitteeMember
              as_user_id: "${v3_id}"
            - call: "GET /api/committee-reviews/${rev_id}"
              as: RealEstateManager
              captures: { rv3: $.data.version }
            - call: "POST /api/committee-reviews/${rev_id}/votes"
              payload: { ballot: "ABSTAIN", expected_review_version: "${rv3}" }
              as: CommitteeChair
              as_user_id: "${ch_id}"
            - call: "GET /api/markets/${mkt_id}"
              as: PlatformAdmin
              captures: { capex_pre: $.data.committed_capex_cents }
            - call: "POST /api/committee-reviews/${rev_id}/ratify"
              payload: {}
              as: CommitteeChair
              as_user_id: "${ch_id}"
            - call: "GET /api/markets/${mkt_id}"
              as: PlatformAdmin
              captures: { capex_mid: $.data.committed_capex_cents }
          trigger:
            - call: "POST /api/sites/${site_id}/withdraw"
              payload: {}
              as: RealEstateManager
              captures: { site_st: $.data.site_status }
            - call: "GET /api/markets/${mkt_id}"
              as: PlatformAdmin
              captures: { capex_post: $.data.committed_capex_cents }
          assert:
            - "Market.committed_capex_cents: 0 before ratify, 500000000 after APPROVE, 0 after withdraw — forward+compensating pair conserves the total"
            - "Site.${site_id}.site_status == WITHDRAWN"
            - "CommitteeReview.${rev_id}.review_status == RATIFIED (ratified reviews are not voided by a later withdraw; only OPEN/DECIDED reviews void)"

      - name: model_relock_lock_count_invariant
        grounds:
          - state_machines.TradeAreaModel.DRAFT_to_LOCKED
          - state_machines.TradeAreaModel.LOCKED_to_SUPERSEDED
          - concurrency_rules[model-lock-stale-site]
        distinguishing_aspect: |
          Conserved quantity is a cardinality (distinct conserved-quantity type
          from capex cents): the count of LOCKED TradeAreaModels per site is
          invariant at exactly 1 across a create+lock supersede pair — locking
          M2 both creates a LOCKED row and supersedes M1.
        test_recipe:
          setup:
            - "Site MODELED via M1 LOCKED (FLAT_BAND)"
          setup_api_calls:
            - call: "POST /api/markets"
              payload: { name: "Metro LC", state_code: "TX", population: 500000, median_household_income_cents: 9000000, population_growth_bp: 300, psychographic_index: 130, base_target_stores: 5, annual_capex_budget_cents: 2000000000, max_rent_psf_cents: 40000, prototype_sales_cents: 900000000 }
              as: PlatformAdmin
              captures: { mkt_id: $.data.id }
            - call: "POST /api/markets/${mkt_id}/evaluate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /api/sites"
              payload: { market_id: "${mkt_id}", address: "5 Elm St", format_type: "STANDARD", square_footage: 10000, asking_rent_psf_cents: 3000, cam_psf_cents: 800, tax_psf_cents: 400, build_cost_cents: 500000000 }
              as: RealEstateAnalyst
              captures: { site_id: $.data.id }
            - call: "POST /api/sites/${site_id}/run-screening"
              payload: {}
              as: RealEstateAnalyst
            - call: "POST /api/trade-area-models"
              payload: { site_id: "${site_id}", drive_time_minutes: 15, trade_area_population: 50000, per_capita_spend_cents: 300000, cannibalization_variant: "FLAT_BAND" }
              as: RealEstateAnalyst
              captures: { mdl1: $.data.id }
            - call: "GET /api/sites/${site_id}"
              as: RealEstateAnalyst
              captures: { site_v: $.data.version }
            - call: "POST /api/trade-area-models/${mdl1}/lock"
              payload: { expected_site_version: "${site_v}" }
              as: RealEstateAnalyst
            - call: "GET /api/trade-area-models?site_id=${site_id}&model_status=LOCKED"
              as: RealEstateAnalyst
              captures: { before0: "$.data[0].id" }
          trigger:
            - call: "POST /api/trade-area-models"
              payload: { site_id: "${site_id}", drive_time_minutes: 10, trade_area_population: 42000, per_capita_spend_cents: 290000, cannibalization_variant: "DISTANCE_DECAY" }
              as: RealEstateAnalyst
              captures: { mdl2: $.data.id }
            - call: "GET /api/sites/${site_id}"
              as: RealEstateAnalyst
              captures: { site_v2: $.data.version }
            - call: "POST /api/trade-area-models/${mdl2}/lock"
              payload: { expected_site_version: "${site_v2}" }
              as: RealEstateAnalyst
            - call: "GET /api/trade-area-models?site_id=${site_id}&model_status=LOCKED"
              as: RealEstateAnalyst
              captures: { after0: "$.data[0].id" }
          assert:
            - "Before re-lock: exactly 1 LOCKED model for the site and it is ${mdl1}"
            - "After re-lock: exactly 1 LOCKED model for the site and it is ${mdl2} (count invariant holds across the supersede pair)"
            - "TradeAreaModel.${mdl1}.model_status == SUPERSEDED and TradeAreaModel.${mdl2}.model_status == LOCKED"
