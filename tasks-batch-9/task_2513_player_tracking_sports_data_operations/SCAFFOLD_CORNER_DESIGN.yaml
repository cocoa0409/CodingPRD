  - section: validations
    instances:
      - name: cba_version_check_outranks_expiry_and_duplicate_consent_checks
        claim_type: priority_ordering
        grounds:
          - validations[priority=52]
          - validations[priority=55]
          - validations[priority=61]
          - errors[ERR_CBA_VERSION_MISMATCH]
          - errors[ERR_CONSENT_EXPIRY_IN_PAST]
          - errors[ERR_CONSENT_ALREADY_PENDING]
        distinguishing_aspect: |
          One body violates all three consent rules at once; the response must be the lowest-priority-number
          one. The rungs are then removed one at a time: wrong CBA version plus past expiry returns
          ERR_CBA_VERSION_MISMATCH (52), correct version plus past expiry returns ERR_CONSENT_EXPIRY_IN_PAST
          (55), a clean body is accepted, and repeating the clean body returns ERR_CONSENT_ALREADY_PENDING
          (61). Falsified by any implementation that evaluates consent rules in body order.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T12:00:00Z; CBA_CURRENT_VERSION is \"CBA-2026A\""
            - "Harbor FC exists with player Ada Ruiz and no consent records"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T12:00:00Z" }
              as: LeagueDataOps
              as_user_id: "ops-01"
            - call: "POST /clubs"
              payload: { name: "Harbor FC", market_code: "HBR" }
              as: LeagueDataOps
              as_user_id: "ops-01"
              captures: { c_home: $.data.id }
            - call: "POST /players"
              payload: { club_id: "${c_home}", full_name: "Ada Ruiz", jersey_number: 9 }
              as: LeagueDataOps
              as_user_id: "ops-01"
              captures: { p1: $.data.id }
          trigger:
            - call: "POST /players/${p1}/consent-records"
              payload: { scope: "BIOMETRIC_TRACKING", cba_agreement_version: "CBA-2025B", effective_from_utc: "2026-08-01T00:00:00Z", expires_at_utc: "2026-07-01T00:00:00Z" }
              as: ClubDataOfficer
              as_user_id: "${c_home}"
              captures: { e_cba: $.data.error_id }
            - call: "POST /players/${p1}/consent-records"
              payload: { scope: "BIOMETRIC_TRACKING", cba_agreement_version: "CBA-2026A", effective_from_utc: "2026-08-01T00:00:00Z", expires_at_utc: "2026-07-01T00:00:00Z" }
              as: ClubDataOfficer
