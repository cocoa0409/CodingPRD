    - name: unannounced_mix_ratio_at_exactly_forty_percent_passes_then_falls_below
      grounds:
      - calculations.location_unannounced_ratio_pct
      - validations.priority_29
      - errors.ERR_UNANNOUNCED_MIX_BELOW_MINIMUM
      distinguishing_aspect: |
        A different metric on a different endpoint: unannounced_ratio_pct at exactly the brand floor.
        Two unannounced visits among five give 40.00 percent, which must pass because the comparison is
        'at least' - a strict greater-than implementation rejects it. Adding a sixth announced visit
        drops the ratio to 33.33 and must fail. The candidate itself counts in the denominator, so the
        ratio is evaluated on the post-creation calendar, not the pre-creation one.
      test_recipe:
        setup:
        - Brand SKWR with unannounced_min_ratio_pct 40 and a PUBLISHED six-item rubric
        - Location SKWR-014 already holds 2 UNANNOUNCED visits (2026-08-05, 2026-08-25) and 2 ANNOUNCED visits (2026-08-06, 2026-08-07), all SCHEDULED - ratio 50.00
        - All four are inside the 182-day window centered on every candidate below
        - Logical clock at 2026-08-01T00:00:00Z, so every candidate date clears the 72-hour announced notice rule
