scenario: |
  Generate task harder than expert level!

  2653. Ground Lease Administration (institutional ground lessor): rent structure with base rent,
  periodic revaluation and percentage rent components, revaluation appraisal process with arbitration
  when parties disagree, permitted use, alterations and redevelopment approval rights, leasehold
  mortgage protections with notice, cure rights and new lease provisions on default, subleasing,
  assignment and transfer fee provisions, reversion planning for improvements at expiration with
  condition standards, insurance, casualty restoration and condemnation award allocation, estoppel
  certificate issuance for leasehold financings
domain_name: ground-lease-administration
api_prefix: /portfolio

complexity_profile:
  primary_archetype: multi_party_negotiation
  secondary_archetype: pricing_engine
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - scheduled_deferred_actions
  entity_topology: flat
  # Every entity is a peer addressed at `/portfolio/<collection>/{id}`; parentage is expressed
  # purely through FK fields plus filtered/sub-resource list reads. Two entities are
  # self-referential (Lease.predecessor_lease_id, TransferRequest.parent_transfer_id).
  state_machine_shape: parallel
  # Lease carries two independent state axes (`lease_status` x `rent_status`); RentRevaluation,
  # LeaseholdMortgage and LossEvent are cyclic; DefaultNotice, AlterationRequest and LossEvent
  # branch with divergent side-effect sets per branch.
  relationship_patterns:
    - one_to_many
    - self_referential
    - cross_aggregate
  role_model: segregation_of_duties
  # LessorAdmin is opaque and audited by `X-User-ID`: the administrator who served a DefaultNotice
  # may not effect its termination, and the arbitrator who awards may not be an appraiser on the
  # same revaluation. Lessee / Mortgagee / Appraiser / Arbitrator are otherwise peer roles owning
  # disjoint operations.
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: Lessee
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: registered legal name of the ground tenant entity
      - name: notice_email
        type: string
        source: input
        description: address of record for lease notices
      - name: credit_rating_code
        type: enum
        source: input
        description: internal credit grade used by transfer-consent underwriting
        default: BBB
        constraints: one of {AAA, A, BBB, SPECULATIVE}

  - name: Lease
    parent: null
    common_fields: true
    fields:
      - name: lessee_id
        type: string
        source: input
        description: FK -> Lessee.id; current ground tenant; rewritten when an ASSIGNMENT TransferRequest activates
      - name: predecessor_lease_id
        type: string
        source: system
        description: FK -> Lease.id; set only on a lease minted by a mortgagee new-lease election
        default: null
      - name: origin_mortgage_id
        type: string
        source: system
        description: FK -> LeaseholdMortgage.id; the electing leasehold mortgage on a new lease
        default: null
      - name: premises_code
        type: string
        source: input
        description: ground parcel identifier
        constraints: unique across Lease rows whose lease_status NOT IN {TERMINATED, REVERTED}
      - name: commencement_date
        type: datetime
        source: input
        description: term start (ISO 8601 UTC)
      - name: expiration_date
        type: datetime
        source: input
        description: term end (ISO 8601 UTC); must be strictly after commencement_date
      - name: lease_status
        type: enum
        source: system
        description: tenancy axis of the Lease state machine
        default: ACTIVE
        constraints: one of {ACTIVE, IN_DEFAULT, TERMINATED, EXPIRED, REVERTED}
      - name: rent_status
        type: enum
        source: system
        description: rent-setting axis of the Lease state machine; evolves independently of lease_status
        default: BASE_ONLY
        constraints: one of {BASE_ONLY, REVALUATION_DUE, REVALUATION_OPEN, IN_ARBITRATION, RESET_APPLIED, FROZEN}
      - name: initial_annual_base_rent_cents
        type: integer
        source: input
        description: annual base rent at commencement, in cents
        constraints: ">= 1"
      - name: current_annual_base_rent_cents
        type: integer
        source: computed
        description: annual base rent in force; seeded from initial_annual_base_rent_cents, rewritten by revaluation_reset_rent
      - name: revaluation_interval_years
        type: integer
        source: input
        description: whole years between scheduled rent revaluations
        constraints: ">= 1"
      - name: next_revaluation_date
        type: datetime
        source: computed
        description: commencement_date + revaluation_interval_years at creation; advanced by one interval on every applied reset
      - name: reval_collar_min_uplift_bps
        type: integer
        source: input
        description: minimum uplift over prior base rent the revaluation collar floor enforces, in basis points
        constraints: ">= 0"
      - name: reval_collar_max_uplift_bps
        type: integer
        source: input
        description: maximum uplift over prior base rent the revaluation collar ceiling enforces, in basis points
        constraints: ">= reval_collar_min_uplift_bps"
      - name: percentage_rent_rate_bps
        type: integer
        source: input
        description: percentage rent rate applied to sales above the breakpoint, in basis points
        constraints: ">= 0"
      - name: percentage_rent_breakpoint_cents
        type: integer
        source: input
        description: annual sales breakpoint above which percentage rent accrues
        constraints: ">= 0"
      - name: percentage_rent_sublease_base_cents
        type: integer
        source: computed
        description: sum of per-sublease inclusion contributions across TransferRequest rows with transfer_type=SUBLEASE and status=ACTIVE on this lease
        default: 0
      - name: arrears_balance_cents
        type: integer
        source: computed
        description: unpaid rent and charges ledger balance; debited by rent-charges and assessments, credited by rent-payments and award allocation
        default: 0
      - name: permitted_use_code
        type: enum
        source: input
        description: use clause in force; an AlterationRequest proposing another use is refused
        constraints: one of {RETAIL_MIXED, INDUSTRIAL_LOGISTICS, RESIDENTIAL_RENTAL, LIFE_SCIENCE_LAB}
      - name: total_permitted_gfa_sqft
        type: integer
        source: input
        description: development envelope granted by the lease, in square feet
        constraints: ">= 1"
      - name: gfa_allocated_sqft
        type: integer
        source: computed
        description: envelope consumed by AlterationRequest rows in status APPROVED
        default: 0
      - name: gfa_unallocated_sqft
        type: integer
        source: computed
        description: total_permitted_gfa_sqft - gfa_allocated_sqft; the conserved envelope remainder
      - name: improvements_value_cents
        type: integer
        source: input
        description: agreed value of tenant improvements, used by casualty, condemnation and reversion math
        constraints: ">= 0"
      - name: reversion_land_value_cents
        type: integer
        source: input
        description: agreed lessor land/reversion value, used by the BONUS_VALUE allocation variant
        constraints: ">= 0"
      - name: reversion_standard_code
        type: enum
        source: input
        description: condition standard the improvements must meet at reversion
        constraints: one of {SHELL_CONDITION, FULLY_FITTED, BROOM_CLEAN}
      - name: security_deposit_cents
        type: integer
        source: input
        description: original security deposit; the conserved total of held + applied + refunded
        constraints: ">= 0"
      - name: deposit_held_cents
        type: integer
        source: computed
        description: deposit still held by the lessor; seeded to security_deposit_cents
      - name: deposit_applied_cents
        type: integer
        source: computed
        description: deposit consumed by reversion holdbacks
        default: 0
      - name: deposit_refunded_cents
        type: integer
        source: computed
        description: deposit returned at reversion close
        default: 0
      - name: insurance_status
        type: enum
        source: computed
        description: insurance compliance flag; ACTIVE only while an endorsement is on file and unexpired
        default: LAPSED
        constraints: one of {ACTIVE, LAPSED}
      - name: property_all_risk_limit_cents
        type: integer
        source: computed
        description: limit of the property all-risk endorsement on file
        default: 0
      - name: builders_risk_limit_cents
        type: integer
        source: computed
        description: limit of the builders-risk endorsement on file; gates structural alteration approval
        default: 0
      - name: lessor_additional_insured
        type: boolean
        source: computed
        description: whether the lessor is named additional insured on the endorsement on file
        default: false
      - name: insurance_expires_at
        type: datetime
        source: computed
        description: expiry of the endorsement on file; null until an endorsement is filed, and administration-runs phase 1 only lapses a lease whose value is non-null and at or before now
        default: null

  - name: LeaseholdMortgage
    parent: null
    common_fields: true
    fields:
      - name: lease_id
        type: string
        source: input
        description: FK -> Lease.id; the leasehold estate encumbered
      - name: mortgagee_legal_name
        type: string
        source: input
        description: lender of record entitled to protective notices
      - name: notice_email
        type: string
        source: input
        description: notice address; without it the mortgage earns no protective notice and default service is refused
      - name: original_principal_cents
        type: integer
        source: input
        description: principal advanced at recording
        constraints: ">= 1"
      - name: outstanding_principal_cents
        type: integer
        source: computed
        description: principal still owed; seeded from original_principal_cents, reduced by loss-proceeds allocation
      - name: priority_rank
        type: integer
        source: input
        description: recording priority; bucket 2 of the allocation waterfall pays mortgages in priority_rank ASC, created_at ASC order
        constraints: ">= 1"
      - name: cure_extension_days
        type: integer
        source: input
        description: whole days of cure the mortgagee enjoys beyond the lessee cure deadline
        constraints: ">= 1"
      - name: status
        type: enum
        source: system
        description: protective-rights state; cycles RECORDED -> NOTICE_SERVED -> CURING -> RECORDED when the mortgagee cures
        default: RECORDED
        constraints: one of {RECORDED, NOTICE_SERVED, CURING, NEW_LEASE_ELIGIBLE, NEW_LEASE_ELECTED, EXTINGUISHED}
      - name: mortgagee_notified_at
        type: datetime
        source: computed
        description: instant the protective copy of a DefaultNotice was served on this mortgagee
        default: null
      - name: new_lease_election_deadline
        type: datetime
        source: computed
        description: last instant a new lease may be elected after termination; set to termination instant + NEW_LEASE_ELECTION_DAYS
        default: null

  - name: RentRevaluation
    parent: null
    common_fields: true
    fields:
      - name: lease_id
        type: string
        source: input
        description: FK -> Lease.id; the lease whose base rent is being reset
      - name: valuation_date
        type: datetime
        source: input
        description: as-of date the appraisers must value
      - name: status
        type: enum
        source: system
        description: negotiation state; OPEN_FOR_APPRAISALS <-> PROPOSALS_EXCHANGED cycles once per round
        default: OPEN_FOR_APPRAISALS
        constraints: one of {OPEN_FOR_APPRAISALS, PROPOSALS_EXCHANGED, ARBITRATION_REFERRED, RESOLVED}
      - name: round_number
        type: integer
        source: computed
        description: negotiation round; starts at 1, incremented by the rounds endpoint
        default: 1
      - name: prior_annual_base_rent_cents
        type: integer
        source: computed
        description: snapshot of Lease.current_annual_base_rent_cents at creation; the collar base
      - name: lessor_appraised_rent_cents
        type: integer
        source: computed
        description: appraised rent of the LESSOR-appointed submission for the current round_number
        default: null
      - name: lessee_appraised_rent_cents
        type: integer
        source: computed
        description: appraised rent of the LESSEE-appointed submission for the current round_number
        default: null
      - name: divergence_bps
        type: integer
        source: computed
        description: spread between the two current-round appraisals over the lower of them, in basis points
        default: null
      - name: resolution_method
        type: enum
        source: computed
        description: how the reset rent was fixed
        default: null
        constraints: one of {MIDPOINT_SETTLEMENT, ARBITRATION_AWARD}
      - name: resolved_annual_base_rent_cents
        type: integer
        source: computed
        description: collar-clamped reset rent written back to Lease.current_annual_base_rent_cents
        default: null

  - name: AppraisalSubmission
    parent: null
    common_fields: false
    fields:
      - name: revaluation_id
        type: string
        source: input
        description: FK -> RentRevaluation.id; the revaluation this opinion of value belongs to
      - name: appointed_by
        type: enum
        source: input
        description: which party appointed the appraiser
        constraints: one of {LESSOR, LESSEE}
      - name: appraiser_user_id
        type: string
        source: system
        description: X-User-ID of the submitting Appraiser; the arbitrator of the same revaluation may not match it
      - name: appraised_annual_rent_cents
        type: integer
        source: input
        description: opinion of annual fair market ground rent, in cents
        constraints: ">= 1"
      - name: valuation_method_code
        type: enum
        source: input
        description: methodology asserted by the appraiser
        constraints: one of {COMPARABLE_LAND, RESIDUAL_LAND, INCOME_CAP}
      - name: round_number
        type: integer
        source: computed
        description: RentRevaluation.round_number at submission; one submission per (revaluation_id, appointed_by, round_number)

  - name: ArbitrationProceeding
    parent: null
    common_fields: true
    fields:
      - name: revaluation_id
        type: string
        source: input
        description: FK -> RentRevaluation.id; the referred revaluation
      - name: arbitrator_user_id
        type: string
        source: input
        description: opaque Arbitrator identifier appointed at referral; must not equal any appraiser_user_id on the revaluation
      - name: hearing_date
        type: datetime
        source: input
        description: scheduled hearing instant, recorded at referral
      - name: status
        type: enum
        source: system
        description: proceeding state
        default: REFERRED
        constraints: one of {REFERRED, AWARDED}
      - name: independent_annual_rent_cents
        type: integer
        source: computed
        description: arbitrator's own opinion of value, supplied at award; the yardstick for baseball selection
        default: null
      - name: awarded_annual_rent_cents
        type: integer
        source: computed
        description: appraisal selected by baseball arbitration, before collar clamping
        default: null
      - name: award_basis
        type: enum
        source: computed
        description: which appraisal the award selected and why
        default: null
        constraints: one of {CLOSEST_LESSOR, CLOSEST_LESSEE, TIE_TO_LESSEE}

  - name: PercentageRentStatement
    parent: null
    common_fields: true
    fields:
      - name: lease_id
        type: string
        source: input
        description: FK -> Lease.id; the lease the statement reports for
      - name: period_start
        type: datetime
        source: input
        description: inclusive first instant of the reporting period
      - name: period_end
        type: datetime
        source: input
        description: inclusive last instant of the reporting period
      - name: reported_gross_sales_cents
        type: integer
        source: input
        description: gross sales self-reported by the lessee
        constraints: ">= 0"
      - name: audited_gross_sales_cents
        type: integer
        source: computed
        description: gross sales substituted by the lessor's audit
        default: null
      - name: status
        type: enum
        source: system
        description: assessment state; VOID is written by supersession or by lease termination
        default: SUBMITTED
        constraints: one of {SUBMITTED, PROVISIONAL_ASSESSED, FINAL_ASSESSED, VOID}
      - name: included_sublease_rent_cents
        type: integer
        source: computed
        description: sum of per-sublease inclusion contributions in the inclusion set of the assessment that last ran
        default: null
      - name: gross_percentage_rent_cents
        type: integer
        source: computed
        description: rate applied to sales above the breakpoint, before the base-rent offset credit
        default: null
      - name: base_rent_offset_credit_cents
        type: integer
        source: computed
        description: creditable share of Lease.current_annual_base_rent_cents; recomputed when a revaluation reset lands while the statement is still SUBMITTED
        default: null
      - name: amount_due_cents
        type: integer
        source: computed
        description: percentage rent payable after the offset credit, floored at zero
        default: null
      - name: underreport_penalty_cents
        type: integer
        source: computed
        description: penalty charged when the audited figure exceeds the reported figure by more than UNDERREPORT_TOLERANCE_BPS
        default: null
      - name: assessment_variant
        type: enum
        source: computed
        description: which variant of percentage_rent_due produced the figures on this row
        default: null
        constraints: one of {PROVISIONAL, AUDITED_FINAL}

  - name: AlterationRequest
    parent: null
    common_fields: true
    fields:
      - name: lease_id
        type: string
        source: input
        description: FK -> Lease.id; the lease whose envelope and use clause the work touches
      - name: scope_code
        type: enum
        source: input
        description: work class; STRUCTURAL_ALTERATION and REDEVELOPMENT require builders-risk cover
        constraints: one of {COSMETIC, STRUCTURAL_ALTERATION, REDEVELOPMENT}
      - name: proposed_use_code
        type: enum
        source: input
        description: use the completed work will serve; must equal Lease.permitted_use_code
        constraints: one of {RETAIL_MIXED, INDUSTRIAL_LOGISTICS, RESIDENTIAL_RENTAL, LIFE_SCIENCE_LAB}
      - name: requested_gfa_sqft
        type: integer
        source: input
        description: envelope the work consumes on approval, in square feet
        constraints: ">= 0"
      - name: construction_window_start
        type: datetime
        source: input
        description: inclusive start of the site occupation window
      - name: construction_window_end
        type: datetime
        source: input
        description: exclusive end of the site occupation window; windows are half-open [start, end)
      - name: estimated_cost_cents
        type: integer
        source: input
        description: hard cost estimate; builders-risk limit must be at least this figure
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: approval state
        default: SUBMITTED
        constraints: one of {SUBMITTED, APPROVED, REJECTED, APPROVAL_REVOKED}
      - name: decided_by_user_id
        type: string
        source: computed
        description: X-User-ID of the LessorAdmin who decided the request
        default: null

  - name: TransferRequest
    parent: null
    common_fields: true
    fields:
      - name: lease_id
        type: string
        source: input
        description: FK -> Lease.id; the lease being assigned or sublet
      - name: parent_transfer_id
        type: string
        source: input
        description: FK -> TransferRequest.id; the sublease this sub-sublease sits under; null for a direct transfer
        default: null
      - name: transfer_type
        type: enum
        source: input
        description: kind of transfer; fee math and overlap semantics differ per kind
        constraints: one of {ASSIGNMENT, SUBLEASE}
      - name: transferee_legal_name
        type: string
        source: input
        description: name of the assignee or subtenant
      - name: transferee_lessee_id
        type: string
        source: input
        description: FK -> Lessee.id; assignee that becomes Lease.lessee_id when an ASSIGNMENT activates; required for ASSIGNMENT
        default: null
      - name: transferee_credit_rating_code
        type: enum
        source: input
        description: credit grade of the transferee; SPECULATIVE assignees are refused consent
        default: BBB
        constraints: one of {AAA, A, BBB, SPECULATIVE}
      - name: premises_unit_code
        type: string
        source: input
        description: demised unit occupied by a sublease; the resource whose occupancy intervals must not collide
        default: null
      - name: term_start
        type: datetime
        source: input
        description: inclusive first instant of the transfer term
      - name: term_end
        type: datetime
        source: input
        description: inclusive last instant of the transfer term; sublease occupancy intervals are closed
      - name: annual_sublease_rent_cents
        type: integer
        source: input
        description: annual rent payable by the subtenant; required for SUBLEASE
        default: null
      - name: sublet_area_sqft
        type: integer
        source: input
        description: area sublet, used to allocate base rent against sublease profit; required for SUBLEASE
        default: null
      - name: net_consideration_cents
        type: integer
        source: input
        description: consideration paid for the assignment; required for ASSIGNMENT
        default: null
      - name: consent_deposit_cents
        type: integer
        source: input
        description: deposit tendered with the application; credited against the transfer fee at consent
        default: 0
      - name: submitted_late
        type: boolean
        source: computed
        description: true when the request was created after term_start on the logical clock; drives the late surcharge
      - name: tier_depth
        type: integer
        source: computed
        description: 1 for a direct transfer, parent tier_depth + 1 for a sub-sublease; capped at MAX_SUBLEASE_TIER_DEPTH
      - name: allocable_base_rent_cents
        type: integer
        source: computed
        description: base rent apportioned to the sublet area; subtracted from sublease rent to yield profit
        default: null
      - name: transfer_fee_gross_cents
        type: integer
        source: computed
        description: tiered assignment fee or sublease profit share, before the administrative charge
        default: null
      - name: admin_charge_cents
        type: integer
        source: computed
        description: capped administrative charge on the gross fee
        default: null
      - name: late_surcharge_cents
        type: integer
        source: computed
        description: surcharge whose rate tier is selected on the pre-surcharge base total
        default: null
      - name: total_transfer_fee_cents
        type: integer
        source: computed
        description: transfer_fee_gross_cents + admin_charge_cents + late_surcharge_cents
        default: null
      - name: transfer_fee_paid_cents
        type: integer
        source: computed
        description: consent deposit plus fee payments received
        default: 0
      - name: status
        type: enum
        source: system
        description: consent state; ACTIVE only once the fee is fully paid
        default: SUBMITTED
        constraints: one of {SUBMITTED, CONSENT_GRANTED, CONSENT_DENIED, ACTIVE, TERMINATED_BY_REVERSION}

  - name: DefaultNotice
    parent: null
    common_fields: true
    fields:
      - name: lease_id
        type: string
        source: input
        description: FK -> Lease.id; the lease in default
      - name: default_type
        type: enum
        source: input
        description: ground of default; drives the cure window length
        constraints: one of {MONETARY_RENT_ARREARS, PERCENTAGE_RENT_UNDERPAYMENT, INSURANCE_LAPSE, UNPERMITTED_USE, UNAUTHORIZED_TRANSFER}
      - name: claimed_amount_cents
        type: integer
        source: input
        description: arrears claimed; required to be positive and no greater than Lease.arrears_balance_cents for monetary grounds
        default: 0
      - name: served_at
        type: datetime
        source: computed
        description: logical-clock instant of service; the origin of every cure deadline
      - name: served_by_user_id
        type: string
        source: computed
        description: X-User-ID of the server; the same identifier may not effect termination
      - name: mortgagee_notified_at
        type: datetime
        source: computed
        description: instant protective copies went out to the encumbering mortgages
        default: null
      - name: lessee_cure_deadline
        type: datetime
        source: computed
        description: last instant the lessee may cure, inclusive
      - name: mortgagee_cure_deadline
        type: datetime
        source: computed
        description: lessee_cure_deadline plus the widest cure_extension_days among noticed mortgages; null when the lease is unencumbered
        default: null
      - name: status
        type: enum
        source: system
        description: notice state; branches into lessee cure, mortgagee cure or termination
        default: SERVED
        constraints: one of {SERVED, LESSEE_CURED, LESSEE_CURE_LAPSED, MORTGAGEE_CURING, MORTGAGEE_CURED, MORTGAGEE_CURE_LAPSED, TERMINATION_EFFECTED}
      - name: cured_by
        type: enum
        source: computed
        description: which party cured
        default: null
        constraints: one of {LESSEE, MORTGAGEE}
      - name: terminated_by_user_id
        type: string
        source: computed
        description: X-User-ID of the LessorAdmin who effected termination
        default: null

  - name: LossEvent
    parent: null
    common_fields: true
    fields:
      - name: lease_id
        type: string
        source: input
        description: FK -> Lease.id; the lease affected by the casualty or taking
      - name: event_type
        type: enum
        source: input
        description: CASUALTY carries a restoration-or-termination election; CONDEMNATION never does
        constraints: one of {CASUALTY, CONDEMNATION}
      - name: scope_code
        type: enum
        source: input
        description: extent of the loss
        constraints: one of {TOTAL, PARTIAL, TEMPORARY}
      - name: occurred_at
        type: datetime
        source: input
        description: instant of the casualty or of the taking order
      - name: damage_estimate_cents
        type: integer
        source: input
        description: estimated cost of damage; compared against improvements_value_cents for the termination election right
        default: 0
      - name: damaged_area_sqft
        type: integer
        source: input
        description: damaged floor area, used for the restoration rent abatement
        default: 0
      - name: distributable_pool_cents
        type: integer
        source: computed
        description: insurance proceeds for CASUALTY or award total for CONDEMNATION, fixed at adjustment
        default: null
      - name: allocation_method
        type: enum
        source: computed
        description: variant of loss_proceeds_allocation applied at allocation time
        default: null
        constraints: one of {BONUS_VALUE, PRO_RATA_VALUE}
      - name: status
        type: enum
        source: system
        description: loss-handling state; ALLOCATED and ALLOCATION_RESCINDED cycle
        default: REPORTED
        constraints: one of {REPORTED, ADJUSTED, RESTORATION_ELECTED, TERMINATION_ELECTED, ALLOCATED, ALLOCATION_RESCINDED}
      - name: rent_abatement_bps
        type: integer
        source: computed
        description: abatement earned on a restoration election, damaged_area_sqft over total_permitted_gfa_sqft
        default: null
      - name: allocated_arrears_cents
        type: integer
        source: computed
        description: waterfall bucket 1 paid to the lessor against arrears
        default: 0
      - name: allocated_mortgagee_cents
        type: integer
        source: computed
        description: waterfall bucket 2 paid to encumbering mortgages in priority order
        default: 0
      - name: allocated_lessee_cents
        type: integer
        source: computed
        description: waterfall bucket 3 paid to the lessee for improvements
        default: 0
      - name: allocated_lessor_cents
        type: integer
        source: computed
        description: waterfall bucket 4 residual retained by the lessor
        default: 0
      - name: lessee_share_bps
        type: integer
        source: computed
        description: improvements share of the pool derived by the selected allocation_method
        default: null
      - name: allocation_detail
        type: array
        source: computed
        description: per-mortgage payment records [{ mortgage_id, amount_cents }] in the order bucket 2 paid them; replayed in reverse by rescission
        default: []

  - name: ReversionAssessment
    parent: null
    common_fields: true
    fields:
      - name: lease_id
        type: string
        source: input
        description: FK -> Lease.id; the expiring lease whose improvements revert
      - name: required_standard_code
        type: enum
        source: computed
        description: snapshot of Lease.reversion_standard_code at creation; fixes weights and the passing score
        constraints: one of {SHELL_CONDITION, FULLY_FITTED, BROOM_CLEAN}
      - name: structural_condition_score
        type: integer
        source: input
        description: structural component score at inspection, 0-100
        default: null
        constraints: 0 <= value <= 100
      - name: envelope_condition_score
        type: integer
        source: input
        description: envelope component score at inspection, 0-100
        default: null
        constraints: 0 <= value <= 100
      - name: systems_condition_score
        type: integer
        source: input
        description: building-systems component score at inspection, 0-100
        default: null
        constraints: 0 <= value <= 100
      - name: inspected_by_user_id
        type: string
        source: computed
        description: X-User-ID that recorded the inspection; the holdback bars this same user under segregation of duties
        default: null
      - name: weighted_score_bps
        type: integer
        source: computed
        description: standard-weighted condition score in basis points
        default: null
      - name: deficiency_bps
        type: integer
        source: computed
        description: 10000 - weighted_score_bps
        default: null
      - name: holdback_cents
        type: integer
        source: computed
        description: deposit applied against the deficiency, capped by Lease.deposit_held_cents
        default: null
      - name: deposit_released_cents
        type: integer
        source: computed
        description: deposit returned to the lessee at close
        default: null
      - name: status
        type: enum
        source: system
        description: reversion state; close is reachable from INSPECTED when the standard is met
        default: PENDING_INSPECTION
        constraints: one of {PENDING_INSPECTION, INSPECTED, HOLDBACK_APPLIED, CLOSED}

  - name: EstoppelCertificate
    parent: null
    common_fields: true
    fields:
      - name: lease_id
        type: string
        source: input
        description: FK -> Lease.id; the lease certified
      - name: requested_by_mortgage_id
        type: string
        source: input
        description: FK -> LeaseholdMortgage.id; the leasehold financing the certificate supports; must encumber lease_id
      - name: certified_annual_base_rent_cents
        type: integer
        source: computed
        description: snapshot of Lease.current_annual_base_rent_cents at issuance
      - name: certified_arrears_cents
        type: integer
        source: computed
        description: snapshot of Lease.arrears_balance_cents at issuance
      - name: certified_rent_status
        type: enum
        source: computed
        description: snapshot of Lease.rent_status at issuance
        constraints: one of {BASE_ONLY, REVALUATION_DUE, REVALUATION_OPEN, IN_ARBITRATION, RESET_APPLIED, FROZEN}
      - name: certified_lease_version
        type: integer
        source: computed
        description: Lease.version observed at issuance, after this issuance incremented it
      - name: status
        type: enum
        source: system
        description: certificate state
        default: ISSUED
        constraints: one of {ISSUED, SUPERSEDED, REVOKED}
      - name: issued_at
        type: datetime
        source: computed
        description: logical-clock instant of issuance
      - name: issued_by_user_id
        type: string
        source: computed
        description: X-User-ID of the issuing LessorAdmin

state_machines:
  - entity: Lease
    state_field: lease_status
    initial_state: ACTIVE
    terminal_states: [TERMINATED, REVERTED]
    note: |
      Tenancy axis. Evolves independently of the rent_status axis on the same row: a lease may sit in
      IN_DEFAULT while rent_status is IN_ARBITRATION, and curing the default leaves rent_status untouched.
    transitions:
      - from: ACTIVE
        to: IN_DEFAULT
        trigger: "POST /portfolio/leases/{id}/default-notices, or administration-runs phase 1 when insurance lapses"
        actor: AssetManager | LeaseAccountant | system
        preconditions:
          - "lease_status == ACTIVE"
          - "for default_type IN {MONETARY_RENT_ARREARS, PERCENTAGE_RENT_UNDERPAYMENT}: 0 < claimed_amount_cents <= arrears_balance_cents"
          - "for default_type == INSURANCE_LAPSE: insurance_status == LAPSED"
          - "every LeaseholdMortgage on the lease with status IN {RECORDED} has a non-empty notice_email"
        side_effects:
          - "creates DefaultNotice with status SERVED, served_at = logical clock now, served_by_user_id = X-User-ID (literal 'SYSTEM' when raised by administration-runs)"
          - "computes DefaultNotice.lessee_cure_deadline and mortgagee_cure_deadline per cure_window_deadlines"
          - "because the notice was served, every LeaseholdMortgage on the lease with status == RECORDED moves to NOTICE_SERVED with mortgagee_notified_at = now, and DefaultNotice.mortgagee_notified_at = now"
      - from: IN_DEFAULT
        to: ACTIVE
        trigger: "POST /portfolio/default-notices/{id}/lessee-cure, or POST /portfolio/default-notices/{id}/mortgagee-cure with action COMPLETE"
        actor: GroundTenant | MortgageeAgent
        preconditions:
          - "the notice being cured is the lease's notice with status IN {SERVED, MORTGAGEE_CURING}"
          - "logical clock now <= the curing party's deadline"
          - "for monetary grounds: cure_amount_cents >= arrears_balance_cents - the cure payment is applied first and must clear the ledger"
        side_effects:
          - "DefaultNotice.status becomes LESSEE_CURED or MORTGAGEE_CURED and cured_by is written"
          - "because the notice was cured, every LeaseholdMortgage on the lease with status IN {NOTICE_SERVED, CURING} returns to RECORDED"
      - from: IN_DEFAULT
        to: TERMINATED
        trigger: "POST /portfolio/default-notices/{id}/terminate"
        actor: AssetManager | LeaseAccountant
        preconditions:
          - "notice status == MORTGAGEE_CURE_LAPSED, or notice status == LESSEE_CURE_LAPSED and no LeaseholdMortgage on the lease has status IN {RECORDED, NOTICE_SERVED, CURING}"
          - "X-User-ID != DefaultNotice.served_by_user_id"
        side_effects:
          - "DefaultNotice.status becomes TERMINATION_EFFECTED, terminated_by_user_id = X-User-ID"
          - "lease_status becomes TERMINATED and rent_status becomes FROZEN"
          - "because the lease became TERMINATED, every TransferRequest on the lease with status == ACTIVE becomes TERMINATED_BY_REVERSION"
          - "because those subleases left status ACTIVE, Lease.percentage_rent_sublease_base_cents is recomputed over the now-empty inclusion set"
          - "because the lease became TERMINATED, every LeaseholdMortgage with status IN {NOTICE_SERVED, CURING} becomes NEW_LEASE_ELIGIBLE with new_lease_election_deadline = now + NEW_LEASE_ELECTION_DAYS"
          - "because the lease became TERMINATED, every EstoppelCertificate on the lease with status == ISSUED becomes REVOKED, and every PercentageRentStatement with status IN {SUBMITTED, PROVISIONAL_ASSESSED} becomes VOID"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /portfolio/loss-events/{id}/election with election TERMINATE"
        actor: GroundTenant
        preconditions:
          - "LossEvent.event_type == CASUALTY and status == ADJUSTED"
          - "damage_estimate_cents * 10000 >= improvements_value_cents * CASUALTY_TERMINATION_THRESHOLD_BPS"
        side_effects:
          - "LossEvent.status becomes TERMINATION_ELECTED"
          - "lease_status becomes TERMINATED and rent_status becomes FROZEN"
          - "the same TERMINATED consequences as the default-termination path fire: ACTIVE transfers, mortgages, estoppel certificates and open statements are cascaded"
      - from: ACTIVE
        to: EXPIRED
        trigger: "POST /portfolio/administration-runs (phase 5)"
        actor: system
        preconditions:
          - "lease_status IN {ACTIVE, IN_DEFAULT}"
          - "expiration_date <= logical clock now"
        side_effects:
          - "lease_status becomes EXPIRED and rent_status becomes FROZEN"
          - "creates ReversionAssessment with status PENDING_INSPECTION and required_standard_code = reversion_standard_code"
          - "because the lease became EXPIRED, every TransferRequest with status == ACTIVE becomes TERMINATED_BY_REVERSION"
          - "because those subleases left status ACTIVE, Lease.percentage_rent_sublease_base_cents is recomputed"
          - "because the lease became EXPIRED, every LeaseholdMortgage with status IN {RECORDED, NOTICE_SERVED, CURING} becomes EXTINGUISHED"
      - from: IN_DEFAULT
        to: EXPIRED
        trigger: "POST /portfolio/administration-runs (phase 5)"
        actor: system
        preconditions:
          - "expiration_date <= logical clock now"
        side_effects:
          - "same phase-5 consequences as the ACTIVE -> EXPIRED transition; the open DefaultNotice is left in place and is no longer terminable"
      - from: EXPIRED
        to: REVERTED
        trigger: "POST /portfolio/reversion-assessments/{id}/close"
        actor: AssetManager
        preconditions:
          - "ReversionAssessment.status IN {INSPECTED, HOLDBACK_APPLIED}"
          - "when status == INSPECTED: weighted_score_bps >= the passing score of required_standard_code"
        side_effects:
          - "ReversionAssessment.status becomes CLOSED with deposit_released_cents = Lease.deposit_held_cents"
          - "Lease.deposit_refunded_cents += deposit_held_cents and deposit_held_cents becomes 0, preserving held + applied + refunded == security_deposit_cents"
          - "lease_status becomes REVERTED"

  - entity: Lease
    state_field: rent_status
    initial_state: BASE_ONLY
    terminal_states: [FROZEN]
    note: |
      Rent-setting axis on the same Lease row. Terminal FROZEN is written only by the tenancy axis
      reaching TERMINATED or EXPIRED, which is how the two axes couple.
    transitions:
      - from: BASE_ONLY
        to: REVALUATION_DUE
        trigger: "POST /portfolio/administration-runs (phase 3)"
        actor: system
        preconditions:
          - "lease_status == ACTIVE"
          - "next_revaluation_date <= logical clock now"
          - "rent_status IN {BASE_ONLY, RESET_APPLIED}"
        side_effects:
          - "rent_status becomes REVALUATION_DUE; no rent figure changes"
      - from: RESET_APPLIED
        to: REVALUATION_DUE
        trigger: "POST /portfolio/administration-runs (phase 3)"
        actor: system
        preconditions:
          - "next_revaluation_date <= logical clock now"
        side_effects:
          - "rent_status becomes REVALUATION_DUE"
      - from: BASE_ONLY
        to: REVALUATION_OPEN
        trigger: "POST /portfolio/leases/{id}/rent-revaluations"
        actor: LessorAdmin
        preconditions:
          - "rent_status IN {BASE_ONLY, REVALUATION_DUE, RESET_APPLIED}"
          - "lease_status IN {ACTIVE, IN_DEFAULT}"
          - "logical clock now >= next_revaluation_date - REVALUATION_ADVANCE_NOTICE_DAYS"
        side_effects:
          - "creates RentRevaluation with status OPEN_FOR_APPRAISALS, round_number 1, prior_annual_base_rent_cents = current_annual_base_rent_cents"
          - "rent_status becomes REVALUATION_OPEN"
      - from: REVALUATION_DUE
        to: REVALUATION_OPEN
        trigger: "POST /portfolio/leases/{id}/rent-revaluations"
        actor: LessorAdmin
        preconditions:
          - "same preconditions as the BASE_ONLY -> REVALUATION_OPEN transition"
        side_effects:
          - "same side effects as the BASE_ONLY -> REVALUATION_OPEN transition"
      - from: RESET_APPLIED
        to: REVALUATION_OPEN
        trigger: "POST /portfolio/leases/{id}/rent-revaluations"
        actor: LessorAdmin
        preconditions:
          - "same preconditions as the BASE_ONLY -> REVALUATION_OPEN transition"
        side_effects:
          - "same side effects as the BASE_ONLY -> REVALUATION_OPEN transition"
      - from: REVALUATION_OPEN
        to: IN_ARBITRATION
        trigger: "POST /portfolio/rent-revaluations/{id}/arbitration-referrals"
        actor: LessorAdmin
        preconditions:
          - "RentRevaluation.status == PROPOSALS_EXCHANGED"
          - "RentRevaluation.divergence_bps > ARBITRATION_DIVERGENCE_THRESHOLD_BPS"
          - "arbitrator_user_id does not equal any AppraisalSubmission.appraiser_user_id on the revaluation"
        side_effects:
          - "creates ArbitrationProceeding with status REFERRED"
          - "RentRevaluation.status becomes ARBITRATION_REFERRED"
          - "rent_status becomes IN_ARBITRATION"
      - from: REVALUATION_OPEN
        to: RESET_APPLIED
        trigger: "POST /portfolio/rent-revaluations/{id}/settle"
        actor: LessorAdmin
        preconditions:
          - "RentRevaluation.status == PROPOSALS_EXCHANGED"
        side_effects:
          - "RentRevaluation.status becomes RESOLVED with resolution_method MIDPOINT_SETTLEMENT and resolved_annual_base_rent_cents from revaluation_reset_rent variant midpoint_settlement"
          - "because the revaluation resolved, current_annual_base_rent_cents = resolved_annual_base_rent_cents, next_revaluation_date advances by revaluation_interval_years, and rent_status becomes RESET_APPLIED"
          - "because current_annual_base_rent_cents changed, every PercentageRentStatement on the lease with status == SUBMITTED has base_rent_offset_credit_cents recomputed"
      - from: IN_ARBITRATION
        to: RESET_APPLIED
        trigger: "POST /portfolio/arbitrations/{id}/award"
        actor: Arbitrator
        preconditions:
          - "ArbitrationProceeding.status == REFERRED"
          - "X-User-ID == ArbitrationProceeding.arbitrator_user_id"
        side_effects:
          - "ArbitrationProceeding.status becomes AWARDED with independent_annual_rent_cents, awarded_annual_rent_cents and award_basis"
          - "because the proceeding was awarded, RentRevaluation.status becomes RESOLVED with resolution_method ARBITRATION_AWARD and resolved_annual_base_rent_cents from revaluation_reset_rent variant arbitration_award"
          - "because the revaluation resolved, current_annual_base_rent_cents = resolved_annual_base_rent_cents, next_revaluation_date advances, rent_status becomes RESET_APPLIED"
          - "because current_annual_base_rent_cents changed, every PercentageRentStatement on the lease with status == SUBMITTED has base_rent_offset_credit_cents recomputed"
      - from: REVALUATION_OPEN
        to: FROZEN
        trigger: "termination or expiry of the lease on the tenancy axis"
        actor: system
        preconditions:
          - "lease_status becomes TERMINATED or EXPIRED"
        side_effects:
          - "rent_status becomes FROZEN; an OPEN_FOR_APPRAISALS or PROPOSALS_EXCHANGED RentRevaluation is left in place and can no longer be settled because settle requires lease_status IN {ACTIVE, IN_DEFAULT}"
      - from: IN_ARBITRATION
        to: FROZEN
        trigger: "termination or expiry of the lease on the tenancy axis"
        actor: system
        preconditions:
          - "lease_status becomes TERMINATED or EXPIRED"
        side_effects:
          - "rent_status becomes FROZEN"
      - from: BASE_ONLY
        to: FROZEN
        trigger: "termination or expiry of the lease on the tenancy axis"
        actor: system
        preconditions:
          - "lease_status becomes TERMINATED or EXPIRED"
        side_effects:
          - "rent_status becomes FROZEN"
      - from: RESET_APPLIED
        to: FROZEN
        trigger: "termination or expiry of the lease on the tenancy axis"
        actor: system
        preconditions:
          - "lease_status becomes TERMINATED or EXPIRED"
        side_effects:
          - "rent_status becomes FROZEN"

  - entity: RentRevaluation
    initial_state: OPEN_FOR_APPRAISALS
    terminal_states: [RESOLVED]
    note: "Cyclic: PROPOSALS_EXCHANGED returns to OPEN_FOR_APPRAISALS once per additional negotiation round."
    transitions:
      - from: OPEN_FOR_APPRAISALS
        to: PROPOSALS_EXCHANGED
        trigger: "POST /portfolio/rent-revaluations/{id}/exchange"
        actor: LessorAdmin
        preconditions:
          - "an AppraisalSubmission exists for appointed_by LESSOR and for appointed_by LESSEE, both with round_number == RentRevaluation.round_number"
        side_effects:
          - "lessor_appraised_rent_cents and lessee_appraised_rent_cents are copied from the two current-round submissions"
          - "divergence_bps is computed per revaluation_reset_rent step 1"
      - from: PROPOSALS_EXCHANGED
        to: OPEN_FOR_APPRAISALS
        trigger: "POST /portfolio/rent-revaluations/{id}/rounds"
        actor: LessorAdmin
        preconditions:
          - "divergence_bps > ARBITRATION_DIVERGENCE_THRESHOLD_BPS"
          - "round_number < MAX_NEGOTIATION_ROUNDS"
        side_effects:
          - "round_number += 1; lessor_appraised_rent_cents, lessee_appraised_rent_cents and divergence_bps are reset to null so the next round's submissions must be re-exchanged"
        note: "The cycle. A third round is refused with ERR_MAX_ROUNDS_REACHED."
      - from: PROPOSALS_EXCHANGED
        to: RESOLVED
        trigger: "POST /portfolio/rent-revaluations/{id}/settle"
        actor: LessorAdmin
        preconditions:
          - "lease_status IN {ACTIVE, IN_DEFAULT}"
        side_effects:
          - "resolution_method MIDPOINT_SETTLEMENT; resolved_annual_base_rent_cents from the midpoint_settlement variant; the Lease rent axis cascade fires"
      - from: PROPOSALS_EXCHANGED
        to: ARBITRATION_REFERRED
        trigger: "POST /portfolio/rent-revaluations/{id}/arbitration-referrals"
        actor: LessorAdmin
        preconditions:
          - "divergence_bps > ARBITRATION_DIVERGENCE_THRESHOLD_BPS"
        side_effects:
          - "creates ArbitrationProceeding REFERRED; Lease.rent_status becomes IN_ARBITRATION"
      - from: ARBITRATION_REFERRED
        to: RESOLVED
        trigger: "POST /portfolio/arbitrations/{id}/award"
        actor: Arbitrator
        preconditions:
          - "the proceeding on this revaluation has status REFERRED"
        side_effects:
          - "resolution_method ARBITRATION_AWARD; resolved_annual_base_rent_cents from the arbitration_award variant; the Lease rent axis cascade fires"

  - entity: ArbitrationProceeding
    initial_state: REFERRED
    terminal_states: [AWARDED]
    transitions:
      - from: REFERRED
        to: AWARDED
        trigger: "POST /portfolio/arbitrations/{id}/award"
        actor: Arbitrator
        preconditions:
          - "X-User-ID == arbitrator_user_id"
          - "independent_annual_rent_cents >= 1"
        side_effects:
          - "awarded_annual_rent_cents = the current-round appraisal nearer independent_annual_rent_cents, ties to the LESSEE appraisal; award_basis records which"
          - "because the proceeding was awarded, the revaluation resolves and the Lease rent axis cascade fires"

  - entity: PercentageRentStatement
    initial_state: SUBMITTED
    terminal_states: [FINAL_ASSESSED, VOID]
    transitions:
      - from: SUBMITTED
        to: PROVISIONAL_ASSESSED
        trigger: "POST /portfolio/percentage-rent-statements/{id}/assess"
        actor: LeaseAccountant
        preconditions:
          - "status == SUBMITTED"
          - "Lease.lease_status IN {ACTIVE, IN_DEFAULT}"
        side_effects:
          - "percentage_rent_due variant provisional writes included_sublease_rent_cents, gross_percentage_rent_cents, base_rent_offset_credit_cents, amount_due_cents and assessment_variant PROVISIONAL"
          - "Lease.arrears_balance_cents += amount_due_cents"
      - from: PROVISIONAL_ASSESSED
        to: FINAL_ASSESSED
        trigger: "POST /portfolio/percentage-rent-statements/{id}/audit"
        actor: LeaseAccountant
        preconditions:
          - "status == PROVISIONAL_ASSESSED"
          - "audited_gross_sales_cents >= 0"
        side_effects:
          - "percentage_rent_due variant audited_final rewrites the same fields with assessment_variant AUDITED_FINAL, and writes underreport_penalty_cents"
          - "Lease.arrears_balance_cents += (new amount_due_cents + underreport_penalty_cents - the provisional amount_due_cents previously posted)"
      - from: SUBMITTED
        to: VOID
        trigger: "POST /portfolio/percentage-rent-statements superseding the same period, or lease termination"
        actor: GroundTenant | system
        preconditions:
          - "a later statement for the same lease_id, period_start and period_end is accepted, or the lease reaches TERMINATED"
        side_effects:
          - "status becomes VOID; no ledger movement (nothing had been posted)"
      - from: PROVISIONAL_ASSESSED
        to: VOID
        trigger: "lease termination cascade"
        actor: system
        preconditions:
          - "Lease.lease_status becomes TERMINATED"
        side_effects:
          - "status becomes VOID; the provisional amount already posted to arrears_balance_cents is left in place"

  - entity: AlterationRequest
    initial_state: SUBMITTED
    terminal_states: [REJECTED, APPROVAL_REVOKED]
    note: "Branching: the decision endpoint forks into APPROVED (envelope debit, window locked) and REJECTED (no state touched elsewhere)."
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /portfolio/alteration-requests/{id}/decision with decision APPROVE"
        actor: AssetManager
        preconditions:
          - "Lease.lease_status == ACTIVE"
          - "proposed_use_code == Lease.permitted_use_code"
          - "for scope_code IN {STRUCTURAL_ALTERATION, REDEVELOPMENT}: Lease.insurance_status == ACTIVE, Lease.lessor_additional_insured == true, Lease.builders_risk_limit_cents >= estimated_cost_cents, Lease.insurance_expires_at >= construction_window_end"
          - "no other AlterationRequest on the lease with status == APPROVED has a construction window overlapping [construction_window_start, construction_window_end)"
          - "requested_gfa_sqft <= Lease.gfa_unallocated_sqft"
        side_effects:
          - "status becomes APPROVED, decided_by_user_id = X-User-ID"
          - "Lease.gfa_allocated_sqft += requested_gfa_sqft and gfa_unallocated_sqft is recomputed, preserving allocated + unallocated == total_permitted_gfa_sqft"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /portfolio/alteration-requests/{id}/decision with decision REJECT"
        actor: AssetManager
        preconditions:
          - "status == SUBMITTED"
        side_effects:
          - "status becomes REJECTED, decided_by_user_id = X-User-ID; the envelope is untouched"
      - from: APPROVED
        to: APPROVAL_REVOKED
        trigger: "POST /portfolio/alteration-requests/{id}/revoke-approval"
        actor: AssetManager
        preconditions:
          - "status == APPROVED"
          - "Lease.lease_status IN {ACTIVE, IN_DEFAULT}"
        side_effects:
          - "status becomes APPROVAL_REVOKED"
          - "Lease.gfa_allocated_sqft -= requested_gfa_sqft, restoring gfa_unallocated_sqft to its pre-approval value; the construction window is released for other requests"

  - entity: TransferRequest
    initial_state: SUBMITTED
    terminal_states: [CONSENT_DENIED, TERMINATED_BY_REVERSION]
    transitions:
      - from: SUBMITTED
        to: CONSENT_GRANTED
        trigger: "POST /portfolio/transfer-requests/{id}/decision with decision APPROVE"
        actor: AssetManager
        preconditions:
          - "Lease.lease_status == ACTIVE"
          - "Lease.rent_status != IN_ARBITRATION"
          - "transferee_credit_rating_code != SPECULATIVE"
          - "for transfer_type == SUBLEASE: no other TransferRequest on the same lease_id and premises_unit_code with status IN {CONSENT_GRANTED, ACTIVE} occupies [term_start, term_end] within SUBLEASE_TURNOVER_BUFFER_DAYS"
          - "tier_depth <= MAX_SUBLEASE_TIER_DEPTH"
        side_effects:
          - "transfer_fee calculation writes transfer_fee_gross_cents, admin_charge_cents, late_surcharge_cents, total_transfer_fee_cents; allocable_base_rent_cents is written for subleases"
          - "transfer_fee_paid_cents = consent_deposit_cents"
          - "status becomes CONSENT_GRANTED; when transfer_fee_paid_cents >= total_transfer_fee_cents the row continues immediately to ACTIVE and fires the ACTIVE side-effect set in the same request"
      - from: SUBMITTED
        to: CONSENT_DENIED
        trigger: "POST /portfolio/transfer-requests/{id}/decision with decision DENY"
        actor: AssetManager
        preconditions:
          - "status == SUBMITTED"
        side_effects:
          - "status becomes CONSENT_DENIED; no fee is assessed and consent_deposit_cents is not credited"
      - from: CONSENT_GRANTED
        to: ACTIVE
        trigger: "POST /portfolio/transfer-requests/{id}/fee-payments"
        actor: GroundTenant
        preconditions:
          - "status == CONSENT_GRANTED"
          - "transfer_fee_paid_cents + amount_cents >= total_transfer_fee_cents"
        side_effects:
          - "transfer_fee_paid_cents += amount_cents; status becomes ACTIVE"
          - "for transfer_type == SUBLEASE: because the sublease became ACTIVE, Lease.percentage_rent_sublease_base_cents is recomputed over the ACTIVE sublease set"
          - "for transfer_type == ASSIGNMENT: because the assignment became ACTIVE, Lease.lessee_id is rewritten to transferee_lessee_id"
      - from: ACTIVE
        to: TERMINATED_BY_REVERSION
        trigger: "lease termination or expiry cascade"
        actor: system
        preconditions:
          - "Lease.lease_status becomes TERMINATED or EXPIRED"
        side_effects:
          - "status becomes TERMINATED_BY_REVERSION"
          - "because the sublease left status ACTIVE, Lease.percentage_rent_sublease_base_cents is recomputed"

  - entity: DefaultNotice
    initial_state: SERVED
    terminal_states: [LESSEE_CURED, MORTGAGEE_CURED, TERMINATION_EFFECTED]
    note: "Branching: after the lessee window lapses the notice forks into the mortgagee-cure branch or straight to termination, with different side-effect sets."
    transitions:
      - from: SERVED
        to: LESSEE_CURED
        trigger: "POST /portfolio/default-notices/{id}/lessee-cure"
        actor: GroundTenant
        preconditions:
          - "status == SERVED"
          - "logical clock now <= lessee_cure_deadline"
          - "for default_type IN {MONETARY_RENT_ARREARS, PERCENTAGE_RENT_UNDERPAYMENT}: cure_amount_cents >= Lease.arrears_balance_cents - the payment is applied first and Lease.arrears_balance_cents must end at 0"
          - "for default_type == INSURANCE_LAPSE: Lease.insurance_status == ACTIVE"
        side_effects:
          - "status becomes LESSEE_CURED, cured_by = LESSEE"
          - "Lease.lease_status returns to ACTIVE"
          - "every LeaseholdMortgage on the lease with status IN {NOTICE_SERVED, CURING} returns to RECORDED"
      - from: SERVED
        to: LESSEE_CURE_LAPSED
        trigger: "POST /portfolio/administration-runs (phase 2)"
        actor: system
        preconditions:
          - "logical clock now > lessee_cure_deadline (at exactly the deadline instant the notice stays SERVED)"
        side_effects:
          - "status becomes LESSEE_CURE_LAPSED; the mortgagee cure branch opens"
      - from: LESSEE_CURE_LAPSED
        to: MORTGAGEE_CURING
        trigger: "POST /portfolio/default-notices/{id}/mortgagee-cure with action ELECT"
        actor: MortgageeAgent
        preconditions:
          - "status == LESSEE_CURE_LAPSED"
          - "logical clock now <= mortgagee_cure_deadline"
          - "the acting LeaseholdMortgage has status == NOTICE_SERVED and lease_id == the notice's lease"
        side_effects:
          - "status becomes MORTGAGEE_CURING"
          - "the acting LeaseholdMortgage moves NOTICE_SERVED -> CURING"
      - from: MORTGAGEE_CURING
        to: MORTGAGEE_CURED
        trigger: "POST /portfolio/default-notices/{id}/mortgagee-cure with action COMPLETE"
        actor: MortgageeAgent
        preconditions:
          - "status == MORTGAGEE_CURING"
          - "logical clock now <= mortgagee_cure_deadline"
          - "for monetary grounds: cure_amount_cents >= Lease.arrears_balance_cents - the payment is applied first and Lease.arrears_balance_cents must end at 0"
        side_effects:
          - "status becomes MORTGAGEE_CURED, cured_by = MORTGAGEE"
          - "Lease.lease_status returns to ACTIVE"
          - "the acting LeaseholdMortgage moves CURING -> RECORDED"
      - from: LESSEE_CURE_LAPSED
        to: MORTGAGEE_CURE_LAPSED
        trigger: "POST /portfolio/administration-runs (phase 2)"
        actor: system
        preconditions:
          - "mortgagee_cure_deadline is not null and logical clock now > mortgagee_cure_deadline"
        side_effects:
          - "status becomes MORTGAGEE_CURE_LAPSED; the lease becomes terminable"
      - from: MORTGAGEE_CURING
        to: MORTGAGEE_CURE_LAPSED
        trigger: "POST /portfolio/administration-runs (phase 2)"
        actor: system
        preconditions:
          - "logical clock now > mortgagee_cure_deadline"
        side_effects:
          - "status becomes MORTGAGEE_CURE_LAPSED; the acting mortgage stays in CURING until termination reclassifies it as NEW_LEASE_ELIGIBLE"
      - from: MORTGAGEE_CURE_LAPSED
        to: TERMINATION_EFFECTED
        trigger: "POST /portfolio/default-notices/{id}/terminate"
        actor: AssetManager | LeaseAccountant
        preconditions:
          - "X-User-ID != served_by_user_id"
          - "Lease.lease_status == IN_DEFAULT"
        side_effects:
          - "the full termination cascade on the Lease tenancy axis fires"
      - from: LESSEE_CURE_LAPSED
        to: TERMINATION_EFFECTED
        trigger: "POST /portfolio/default-notices/{id}/terminate"
        actor: AssetManager | LeaseAccountant
        preconditions:
          - "no LeaseholdMortgage on the lease has status IN {RECORDED, NOTICE_SERVED, CURING}"
          - "X-User-ID != served_by_user_id"
        side_effects:
          - "the full termination cascade on the Lease tenancy axis fires"
        note: "Unencumbered leases skip the mortgagee branch entirely."

  - entity: LeaseholdMortgage
    initial_state: RECORDED
    terminal_states: [NEW_LEASE_ELECTED, EXTINGUISHED]
    note: "Cyclic: RECORDED -> NOTICE_SERVED -> CURING -> RECORDED whenever a default is served and then cured."
    transitions:
      - from: RECORDED
        to: NOTICE_SERVED
        trigger: "service of a DefaultNotice on the encumbered lease"
        actor: system
        preconditions:
          - "notice_email is non-empty"
        side_effects:
          - "mortgagee_notified_at = the notice's served_at"
      - from: NOTICE_SERVED
        to: CURING
        trigger: "POST /portfolio/default-notices/{id}/mortgagee-cure with action ELECT"
        actor: MortgageeAgent
        preconditions:
          - "the mortgage_id carried in the request names this mortgage"
          - "the notice is in LESSEE_CURE_LAPSED and now <= mortgagee_cure_deadline"
        side_effects: ["status becomes CURING"]
      - from: CURING
        to: RECORDED
        trigger: "mortgagee cure completion cascade"
        actor: system
        preconditions:
          - "the notice reached MORTGAGEE_CURED"
        side_effects: ["status returns to RECORDED; mortgagee_notified_at is left as the historical record"]
      - from: NOTICE_SERVED
        to: RECORDED
        trigger: "lessee cure cascade"
        actor: system
        preconditions:
          - "the notice reached LESSEE_CURED"
        side_effects: ["status returns to RECORDED and mortgagee_notified_at is cleared"]
      - from: NOTICE_SERVED
        to: NEW_LEASE_ELIGIBLE
        trigger: "lease termination cascade"
        actor: system
        preconditions:
          - "Lease.lease_status becomes TERMINATED"
        side_effects: ["new_lease_election_deadline = termination instant + NEW_LEASE_ELECTION_DAYS"]
      - from: CURING
        to: NEW_LEASE_ELIGIBLE
        trigger: "lease termination cascade"
        actor: system
        preconditions:
          - "Lease.lease_status becomes TERMINATED"
        side_effects: ["new_lease_election_deadline = termination instant + NEW_LEASE_ELECTION_DAYS"]
      - from: NEW_LEASE_ELIGIBLE
        to: NEW_LEASE_ELECTED
        trigger: "POST /portfolio/leasehold-mortgages/{id}/new-lease-election"
        actor: MortgageeAgent
        preconditions:
          - "logical clock now <= new_lease_election_deadline"
          - "the terminated Lease.arrears_balance_cents == 0"
          - "new_lessee_id resolves to an existing Lessee"
        side_effects:
          - "mints a new Lease with predecessor_lease_id = the terminated lease, origin_mortgage_id = this mortgage, lessee_id = new_lessee_id, premises_code copied, current_annual_base_rent_cents copied, commencement_date = now, expiration_date copied, lease_status ACTIVE, rent_status BASE_ONLY, insurance_status LAPSED, gfa_allocated_sqft 0, deposits 0"
          - "status becomes NEW_LEASE_ELECTED"
      - from: NEW_LEASE_ELIGIBLE
        to: EXTINGUISHED
        trigger: "POST /portfolio/administration-runs (phase 4)"
        actor: system
        preconditions:
          - "logical clock now > new_lease_election_deadline"
        side_effects: ["status becomes EXTINGUISHED; the protective rights are gone"]
      - from: RECORDED
        to: EXTINGUISHED
        trigger: "POST /portfolio/administration-runs (phase 5), natural expiry of the lease"
        actor: system
        preconditions:
          - "Lease.lease_status becomes EXPIRED"
        side_effects: ["status becomes EXTINGUISHED"]

  - entity: LossEvent
    initial_state: REPORTED
    terminal_states: [TERMINATION_ELECTED]
    note: "Branching at ADJUSTED (restore vs terminate vs allocate) plus an ALLOCATED <-> ALLOCATION_RESCINDED cycle."
    transitions:
      - from: REPORTED
        to: ADJUSTED
        trigger: "POST /portfolio/loss-events/{id}/adjust"
        actor: AssetManager
        preconditions:
          - "status == REPORTED"
          - "for event_type == CASUALTY: Lease.insurance_status == ACTIVE and proceeds_or_award_cents <= Lease.property_all_risk_limit_cents"
        side_effects:
          - "distributable_pool_cents = proceeds_or_award_cents"
      - from: ADJUSTED
        to: RESTORATION_ELECTED
        trigger: "POST /portfolio/loss-events/{id}/election with election RESTORE"
        actor: GroundTenant
        preconditions:
          - "event_type == CASUALTY"
          - "status == ADJUSTED"
        side_effects:
          - "rent_abatement_bps = round_half_up(damaged_area_sqft * 10000 / Lease.total_permitted_gfa_sqft)"
          - "the Lease tenancy axis is untouched - this is the branch that keeps the lease alive"
      - from: ADJUSTED
        to: TERMINATION_ELECTED
        trigger: "POST /portfolio/loss-events/{id}/election with election TERMINATE"
        actor: GroundTenant
        preconditions:
          - "event_type == CASUALTY"
          - "status == ADJUSTED"
          - "damage_estimate_cents * 10000 >= Lease.improvements_value_cents * CASUALTY_TERMINATION_THRESHOLD_BPS"
        side_effects:
          - "rent_abatement_bps stays null"
          - "Lease.lease_status becomes TERMINATED, rent_status becomes FROZEN, and the full termination cascade fires"
      - from: ADJUSTED
        to: ALLOCATED
        trigger: "POST /portfolio/loss-events/{id}/allocate"
        actor: LeaseAccountant
        preconditions:
          - "event_type == CONDEMNATION, or event_type == CASUALTY with status RESTORATION_ELECTED"
          - "distributable_pool_cents is not null"
        side_effects:
          - "loss_proceeds_allocation writes allocated_arrears_cents, allocated_mortgagee_cents, allocated_lessee_cents, allocated_lessor_cents, lessee_share_bps and allocation_detail"
          - "Lease.arrears_balance_cents -= allocated_arrears_cents"
          - "each LeaseholdMortgage named in allocation_detail has outstanding_principal_cents reduced by its amount_cents"
      - from: RESTORATION_ELECTED
        to: ALLOCATED
        trigger: "POST /portfolio/loss-events/{id}/allocate"
        actor: LeaseAccountant
        preconditions:
          - "distributable_pool_cents is not null"
        side_effects:
          - "same allocation side effects as the ADJUSTED -> ALLOCATED transition"
      - from: ALLOCATED
        to: ALLOCATION_RESCINDED
        trigger: "POST /portfolio/loss-events/{id}/rescind-allocation"
        actor: LeaseAccountant
        preconditions:
          - "status == ALLOCATED"
        side_effects:
          - "Lease.arrears_balance_cents += allocated_arrears_cents"
          - "each LeaseholdMortgage named in allocation_detail has outstanding_principal_cents increased by its amount_cents, replayed in reverse order of allocation_detail"
          - "allocated_arrears_cents, allocated_mortgagee_cents, allocated_lessee_cents, allocated_lessor_cents return to 0; lessee_share_bps and allocation_detail are cleared"
      - from: ALLOCATION_RESCINDED
        to: ALLOCATED
        trigger: "POST /portfolio/loss-events/{id}/allocate"
        actor: LeaseAccountant
        preconditions:
          - "status == ALLOCATION_RESCINDED"
        side_effects:
          - "the waterfall is re-run against current ledger values, possibly with a different allocation_method"

  - entity: ReversionAssessment
    initial_state: PENDING_INSPECTION
    terminal_states: [CLOSED]
    transitions:
      - from: PENDING_INSPECTION
        to: INSPECTED
        trigger: "POST /portfolio/reversion-assessments/{id}/inspection"
        actor: AssetManager
        preconditions:
          - "status == PENDING_INSPECTION"
          - "all three component scores are integers in [0, 100]"
        side_effects:
          - "reversion_condition_score writes weighted_score_bps and deficiency_bps"
          - "inspected_by_user_id = X-User-ID"
      - from: INSPECTED
        to: HOLDBACK_APPLIED
        trigger: "POST /portfolio/reversion-assessments/{id}/holdback"
        actor: LeaseAccountant | AssetManager
        preconditions:
          - "status == INSPECTED"
          - "weighted_score_bps < the passing score of required_standard_code"
        side_effects:
          - "holdback_cents = min(Lease.deposit_held_cents, round_half_up(Lease.improvements_value_cents * deficiency_bps / 10000))"
          - "Lease.deposit_applied_cents += holdback_cents and Lease.deposit_held_cents -= holdback_cents"
      - from: INSPECTED
        to: CLOSED
        trigger: "POST /portfolio/reversion-assessments/{id}/close"
        actor: AssetManager
        preconditions:
          - "weighted_score_bps >= the passing score of required_standard_code"
        side_effects:
          - "deposit_released_cents = Lease.deposit_held_cents; Lease.deposit_refunded_cents += that amount and deposit_held_cents becomes 0"
          - "Lease.lease_status becomes REVERTED"
      - from: HOLDBACK_APPLIED
        to: CLOSED
        trigger: "POST /portfolio/reversion-assessments/{id}/close"
        actor: AssetManager
        preconditions:
          - "status == HOLDBACK_APPLIED"
        side_effects:
          - "deposit_released_cents = Lease.deposit_held_cents after the holdback; Lease.deposit_refunded_cents += that amount and deposit_held_cents becomes 0"
          - "Lease.lease_status becomes REVERTED"

  - entity: EstoppelCertificate
    initial_state: ISSUED
    terminal_states: [SUPERSEDED, REVOKED]
    transitions:
      - from: ISSUED
        to: SUPERSEDED
        trigger: "POST /portfolio/estoppel-certificates for the same lease_id and requested_by_mortgage_id"
        actor: LessorAdmin | MortgageeAgent
        preconditions:
          - "a newer certificate is issued for the same pair"
        side_effects:
          - "status becomes SUPERSEDED; the new row carries the fresh certified snapshot"
      - from: ISSUED
        to: REVOKED
        trigger: "lease termination cascade"
        actor: system
        preconditions:
          - "Lease.lease_status becomes TERMINATED"
        side_effects:
          - "status becomes REVOKED"

concurrency_rules:
  - rule_id: statement-create-stale-lease
    parent_entity: Lease
    write_endpoint: "POST /portfolio/percentage-rent-statements"
    occ_field: "expected_lease_version"
    description: |
      Submitting a percentage rent statement against a Lease whose version has advanced since the
      client last observed it is rejected. A new statement for a period legitimately supersedes an
      earlier SUBMITTED statement for the same period, so the second submission is not blocked by any
      state precondition; but the base-rent offset credit is computed from
      Lease.current_annual_base_rent_cents, so a stale view of the lease would assess the wrong figure.
    error_id: ERR_STALE_LEASE_VERSION
    http_status: 412
  - rule_id: estoppel-create-stale-lease
    parent_entity: Lease
    write_endpoint: "POST /portfolio/estoppel-certificates"
    occ_field: "expected_lease_version"
    description: |
      Issuing an estoppel certificate against a Lease whose version has advanced since the client last
      observed it is rejected. Issuance is legitimately repeatable - a fresh certificate supersedes the
      prior one for the same lease and mortgage - so nothing in the state machine stops the second
      issuance; the certificate's whole purpose is to certify the figures the requester observed, so a
      stale lease version must fail rather than certify superseded rent and arrears.
    error_id: ERR_STALE_LEASE_VERSION
    http_status: 412

calculations:
  - name: revaluation_reset_rent
    trigger: "POST /portfolio/rent-revaluations/{id}/exchange computes step 1; POST /portfolio/rent-revaluations/{id}/settle and POST /portfolio/arbitrations/{id}/award compute steps 2-4 and write Lease.current_annual_base_rent_cents"
    algorithm: threshold
    formula: |
      # Evaluation order is pinned; steps 2-4 never re-order.
      # Step 1 (at exchange):
      LA = the appraised_annual_rent_cents of the AppraisalSubmission with appointed_by == LESSOR
           and round_number == RentRevaluation.round_number
      LE = the appraised_annual_rent_cents of the AppraisalSubmission with appointed_by == LESSEE
           and round_number == RentRevaluation.round_number
      divergence_bps = round_half_up((max(LA, LE) - min(LA, LE)) * 10000 / min(LA, LE))

      # Step 2 (variant-dependent indicated rent):
      #   variant midpoint_settlement:
      indicated = round_half_up((LA + LE) / 2)
      #   variant arbitration_award:
      d_lessor = abs(LA - independent_annual_rent_cents)
      d_lessee = abs(LE - independent_annual_rent_cents)
      if d_lessor < d_lessee:  indicated = LA; award_basis = CLOSEST_LESSOR
      elif d_lessee < d_lessor: indicated = LE; award_basis = CLOSEST_LESSEE
      else:                     indicated = LE; award_basis = TIE_TO_LESSEE   # ties go to the lessee's number

      # Step 3 (collar bounds off the snapshot taken when the revaluation opened):
      P = RentRevaluation.prior_annual_base_rent_cents
      collar_floor = P + round_half_up(P * Lease.reval_collar_min_uplift_bps / 10000)
      collar_ceiling = P + round_half_up(P * Lease.reval_collar_max_uplift_bps / 10000)

      # Step 4 (clamp last - never clamp before selecting the indicated rent):
      resolved_annual_base_rent_cents = min(max(indicated, collar_floor), collar_ceiling)
    input_set: |
      Exactly the two AppraisalSubmission rows whose round_number equals the revaluation's current
      round_number, one per appointed_by side. Submissions from earlier rounds are excluded. The collar
      base is RentRevaluation.prior_annual_base_rent_cents, snapshotted at creation, never the live
      Lease.current_annual_base_rent_cents.
    constants:
      ARBITRATION_DIVERGENCE_THRESHOLD_BPS: 1000
      MAX_NEGOTIATION_ROUNDS: 2
      REVALUATION_ADVANCE_NOTICE_DAYS: 180
    precision: "integer cents; round_half_up on every division; the clamp is applied to the rounded indicated rent"
    variants:
      - name: midpoint_settlement
        when: "POST /portfolio/rent-revaluations/{id}/settle - the parties agree to split the difference; permitted at any divergence_bps"
        difference: "indicated = arithmetic midpoint of the two appraisals; the arbitrator's independent value plays no part"
      - name: arbitration_award
        when: "POST /portfolio/arbitrations/{id}/award after a referral, which requires divergence_bps > ARBITRATION_DIVERGENCE_THRESHOLD_BPS"
        difference: "indicated = whichever appraisal sits nearer the arbitrator's independent value (baseball selection), ties to the lessee; for the same LA/LE pair this returns a different resolved rent from the midpoint whenever the appraisals are not equidistant from the midpoint"

  - name: sublease_inclusion_base
    trigger: "recomputed whenever a TransferRequest with transfer_type SUBLEASE enters or leaves status ACTIVE (fee-payment activation, lease termination cascade, lease expiry cascade); writes Lease.percentage_rent_sublease_base_cents"
    algorithm: aggregation
    formula: |
      rows = TransferRequest where lease_id == Lease.id
             and transfer_type == SUBLEASE
             and status == ACTIVE
             ordered by created_at ASC
      # per-row rounding, then sum - never sum first
      Lease.percentage_rent_sublease_base_cents =
          sum(round_half_up(row.annual_sublease_rent_cents * SUBLEASE_INCLUSION_RATE_BPS / 10000) for row in rows)
    input_set: "TransferRequest rows on the lease with transfer_type == SUBLEASE and status == ACTIVE, all tier depths; rows in SUBMITTED, CONSENT_GRANTED, CONSENT_DENIED or TERMINATED_BY_REVERSION are excluded. Empty set yields 0."
    constants:
      SUBLEASE_INCLUSION_RATE_BPS: 5000
    precision: "integer cents; round_half_up per row before summing"

  - name: percentage_rent_due
    trigger: "POST /portfolio/percentage-rent-statements/{id}/assess (variant provisional) and POST /portfolio/percentage-rent-statements/{id}/audit (variant audited_final); base_rent_offset_credit_cents is also recomputed on SUBMITTED statements when a revaluation reset lands"
    algorithm: threshold
    formula: |
      # Step 1 - inclusion set is variant-dependent (see variants); per-line rounding then sum:
      contributions = [ round_half_up(s.annual_sublease_rent_cents * SUBLEASE_INCLUSION_RATE_BPS / 10000)
                        for s in inclusion_set ordered by created_at ASC ]
      included_sublease_rent_cents = sum(contributions)
      # PINNED: round each sublease line to cents and then add. Summing the raw rents and rounding once
      # is a different number (it differs by one cent per pair of odd rents) and is wrong.

      # Step 2:
      G = reported_gross_sales_cents (provisional) or audited_gross_sales_cents (audited_final)
      adjusted_sales = G + included_sublease_rent_cents

      # Step 3 - strict breakpoint: sales exactly at the breakpoint produce no excess:
      excess = max(0, adjusted_sales - Lease.percentage_rent_breakpoint_cents)

      # Step 4:
      gross_percentage_rent_cents = round_half_up(excess * Lease.percentage_rent_rate_bps / 10000)

      # Step 5 - offset credit off the base rent in force at assessment time:
      base_rent_offset_credit_cents = round_half_up(Lease.current_annual_base_rent_cents * BASE_RENT_OFFSET_SHARE_BPS / 10000)

      # Step 6:
      amount_due_cents = max(0, gross_percentage_rent_cents - base_rent_offset_credit_cents)

      # Step 7 - audited_final only:
      if audited_gross_sales_cents * 10000 > reported_gross_sales_cents * (10000 + UNDERREPORT_TOLERANCE_BPS):
          underreport_penalty_cents = round_half_up((audited_gross_sales_cents - reported_gross_sales_cents)
                                                   * Lease.percentage_rent_rate_bps / 10000)
      else:
          underreport_penalty_cents = 0
    input_set: |
      Sublease inclusion set = TransferRequest rows where lease_id == statement.lease_id,
      transfer_type == SUBLEASE, term_start <= statement.period_end AND term_end >= statement.period_start,
      and status IN the variant's status filter. Ordered created_at ASC.
    constants:
      SUBLEASE_INCLUSION_RATE_BPS: 5000
      BASE_RENT_OFFSET_SHARE_BPS: 2500
      UNDERREPORT_TOLERANCE_BPS: 500
    precision: "integer cents; round_half_up per sublease line, then again on the rate application and the offset credit"
    variants:
      - name: provisional
        when: "POST /portfolio/percentage-rent-statements/{id}/assess"
        difference: "G = reported_gross_sales_cents; inclusion status filter is status == ACTIVE only; underreport_penalty_cents is not written"
      - name: audited_final
        when: "POST /portfolio/percentage-rent-statements/{id}/audit"
        difference: "G = audited_gross_sales_cents; inclusion status filter widens to status IN {ACTIVE, CONSENT_GRANTED}, so consented-but-unpaid subleases enter the base on audit; underreport_penalty_cents is written. Identical DB rows therefore yield a different included_sublease_rent_cents and a different amount_due_cents from the provisional pass"

  - name: transfer_fee
    trigger: "POST /portfolio/transfer-requests/{id}/decision with decision APPROVE; writes transfer_fee_gross_cents, admin_charge_cents, late_surcharge_cents, total_transfer_fee_cents and (for subleases) allocable_base_rent_cents"
    algorithm: tiered_pricing
    formula: |
      # Step 1 - gross fee, by transfer_type:
      if transfer_type == ASSIGNMENT:
          rate_bps = 300 if net_consideration_cents <= ASSIGNMENT_TIER1_CEILING_CENTS
                     else 500 if net_consideration_cents <= ASSIGNMENT_TIER2_CEILING_CENTS
                     else 700
          # tier rate applies to the WHOLE net consideration (flat-by-tier, not marginal)
          transfer_fee_gross_cents = max(MIN_ASSIGNMENT_FEE_CENTS,
                                         round_half_up(net_consideration_cents * rate_bps / 10000))
      else:  # SUBLEASE
          allocable_base_rent_cents = round_half_up(Lease.current_annual_base_rent_cents
                                                    * sublet_area_sqft / Lease.total_permitted_gfa_sqft)
          profit = max(0, annual_sublease_rent_cents - allocable_base_rent_cents)
          transfer_fee_gross_cents = round_half_up(profit * SUBLEASE_PROFIT_SHARE_BPS / 10000)
          # no minimum fee on subleases

      # Step 2:
      admin_charge_cents = min(ADMIN_CHARGE_CAP_CENTS,
                               round_half_up(transfer_fee_gross_cents * ADMIN_CHARGE_BPS / 10000))

      # Step 3:
      base_total = transfer_fee_gross_cents + admin_charge_cents

      # Step 4 - the surcharge rate tier is selected on base_total, which EXCLUDES the surcharge itself.
      # This is the pinned resolution of the circular-looking dependency (the surcharge is a percentage
      # of an amount the surcharge would otherwise be part of): tier on the pre-surcharge base total.
      if submitted_late:
          surcharge_rate_bps = LATE_SURCHARGE_LOW_BPS if base_total <= LATE_SURCHARGE_TIER_CEILING_CENTS
                               else LATE_SURCHARGE_HIGH_BPS
          late_surcharge_cents = round_half_up(base_total * surcharge_rate_bps / 10000)
      else:
          late_surcharge_cents = 0

      # Step 5:
      total_transfer_fee_cents = base_total + late_surcharge_cents
      transfer_fee_paid_cents = consent_deposit_cents      # deposit credited at consent
    input_set: "The single TransferRequest under decision plus the live Lease rent and envelope figures. submitted_late was fixed at creation as (logical clock now > term_start)."
    constants:
      ASSIGNMENT_TIER1_CEILING_CENTS: 50000000
      ASSIGNMENT_TIER2_CEILING_CENTS: 200000000
      MIN_ASSIGNMENT_FEE_CENTS: 500000
      SUBLEASE_PROFIT_SHARE_BPS: 5000
      ADMIN_CHARGE_BPS: 250
      ADMIN_CHARGE_CAP_CENTS: 250000
      LATE_SURCHARGE_TIER_CEILING_CENTS: 1000000
      LATE_SURCHARGE_LOW_BPS: 250
      LATE_SURCHARGE_HIGH_BPS: 500
      MAX_SUBLEASE_TIER_DEPTH: 2
      SUBLEASE_TURNOVER_BUFFER_DAYS: 0
    precision: "integer cents; round_half_up at every division; cap and floor applied at the step shown"

  - name: loss_proceeds_allocation
    trigger: "POST /portfolio/loss-events/{id}/allocate; writes allocated_arrears_cents, allocated_mortgagee_cents, allocated_lessee_cents, allocated_lessor_cents, lessee_share_bps, allocation_detail, and moves Lease.arrears_balance_cents and LeaseholdMortgage.outstanding_principal_cents"
    algorithm: waterfall_allocation
    formula: |
      pool = distributable_pool_cents
      remaining = pool

      # Bucket 1 - lessor arrears:
      allocated_arrears_cents = min(remaining, Lease.arrears_balance_cents)
      remaining -= allocated_arrears_cents

      # Bucket 2 - mortgage payoff, in recording priority:
      allocation_detail = []
      for m in LeaseholdMortgage where lease_id == Lease.id
              and status IN {RECORDED, NOTICE_SERVED, CURING, NEW_LEASE_ELIGIBLE}
              ordered by priority_rank ASC, created_at ASC:
          pay = min(remaining, m.outstanding_principal_cents)
          allocation_detail.append({ mortgage_id: m.id, amount_cents: pay })
          remaining -= pay
      allocated_mortgagee_cents = sum(entry.amount_cents for entry in allocation_detail)

      # Bucket 3 - lessee improvements share, computed on the FULL pool, then capped by what is left:
      lessee_share_bps = <variant-dependent, see variants>
      indicated_lessee = round_half_up(pool * lessee_share_bps / 10000)
      allocated_lessee_cents = min(remaining, indicated_lessee)
      remaining -= allocated_lessee_cents

      # Bucket 4 - lessor residual absorbs every remaining cent, including rounding remainders:
      allocated_lessor_cents = remaining

      # Conserved quantity (invariant, exact, no drift):
      # allocated_arrears_cents + allocated_mortgagee_cents + allocated_lessee_cents
      #   + allocated_lessor_cents == distributable_pool_cents
    input_set: "The mortgages on the lease whose status IN {RECORDED, NOTICE_SERVED, CURING, NEW_LEASE_ELIGIBLE}, ordered priority_rank ASC then created_at ASC; EXTINGUISHED, NEW_LEASE_ELECTED mortgages are excluded. Bucket 1 reads the live Lease.arrears_balance_cents."
    constants:
      DAYS_PER_YEAR_BASIS: 365
      CASUALTY_TERMINATION_THRESHOLD_BPS: 5000
    precision: "integer cents; round_half_up on the share computation; bucket 4 is the residual so the four buckets always sum to the pool exactly"
    variants:
      - name: bonus_value
        when: "allocation_method == BONUS_VALUE"
        difference: "lessee_share_bps = round_half_up(Lease.improvements_value_cents * 10000 / (Lease.improvements_value_cents + Lease.reversion_land_value_cents)) - a value split that ignores how much term is left"
      - name: pro_rata_value
        when: "allocation_method == PRO_RATA_VALUE"
        difference: "lessee_share_bps = round_half_up(remaining_days * 10000 / total_days) where total_days = whole days from Lease.commencement_date to Lease.expiration_date and remaining_days = whole days from the logical clock now to Lease.expiration_date - a term split that ignores relative values. For the same pool and ledger this returns a different bucket-3 figure from bonus_value"

  - name: cure_window_deadlines
    trigger: "POST /portfolio/leases/{id}/default-notices and the administration-runs phase 1 auto-service; writes DefaultNotice.served_at, lessee_cure_deadline, mortgagee_cure_deadline"
    algorithm: interval_merge
    formula: |
      served_at = logical clock now
      lessee_days = MONETARY_CURE_DAYS      if default_type IN {MONETARY_RENT_ARREARS, PERCENTAGE_RENT_UNDERPAYMENT}
                    else INSURANCE_CURE_DAYS if default_type == INSURANCE_LAPSE
                    else NON_MONETARY_CURE_DAYS
      lessee_cure_deadline = served_at + lessee_days days

      noticed = LeaseholdMortgage where lease_id == Lease.id and status == RECORDED
                and notice_email is non-empty
      if noticed is empty:
          mortgagee_cure_deadline = null
      else:
          mortgagee_cure_deadline = lessee_cure_deadline + max(m.cure_extension_days for m in noticed) days

      # Lapse comparisons are STRICT: administration-runs lapses a window only when
      # now > deadline. At exactly the deadline instant the window is still open.
    input_set: "Every RECORDED mortgage on the lease with a notice address; the widest cure_extension_days wins. Mortgages already NOTICE_SERVED, CURING, NEW_LEASE_ELIGIBLE, NEW_LEASE_ELECTED or EXTINGUISHED are excluded."
    constants:
      MONETARY_CURE_DAYS: 10
      INSURANCE_CURE_DAYS: 15
      NON_MONETARY_CURE_DAYS: 30
      NEW_LEASE_ELECTION_DAYS: 30
    precision: "whole days added to the served_at instant; comparisons are on the full ISO 8601 UTC instant, not the calendar date"

  - name: reversion_condition_score
    trigger: "POST /portfolio/reversion-assessments/{id}/inspection writes weighted_score_bps and deficiency_bps; POST /portfolio/reversion-assessments/{id}/holdback writes holdback_cents"
    algorithm: weighted_scoring
    formula: |
      weights_bps by required_standard_code:
        SHELL_CONDITION: structural 6000, envelope 3000, systems 1000
        FULLY_FITTED:    structural 4000, envelope 3000, systems 3000
        BROOM_CLEAN:     structural 7000, envelope 2000, systems 1000
      passing_score_bps by required_standard_code:
        SHELL_CONDITION: 7000
        FULLY_FITTED:    8500
        BROOM_CLEAN:     6000

      # per-component rounding, then sum (scores are 0-100, weights are bps):
      weighted_score_bps = round_half_up(structural_condition_score * w_structural / 100)
                         + round_half_up(envelope_condition_score  * w_envelope   / 100)
                         + round_half_up(systems_condition_score   * w_systems    / 100)
      deficiency_bps = 10000 - weighted_score_bps

      # Holdback is available only when the standard is missed. At exactly the passing score
      # (weighted_score_bps == passing_score_bps) no holdback may be applied - close is the only move.
      holdback_cents = min(Lease.deposit_held_cents,
                           round_half_up(Lease.improvements_value_cents * deficiency_bps / 10000))

      # Conserved quantity (invariant, exact):
      # Lease.deposit_held_cents + Lease.deposit_applied_cents + Lease.deposit_refunded_cents
      #   == Lease.security_deposit_cents
    input_set: "The three component scores recorded on this assessment plus the weights and passing score of required_standard_code, which was snapshotted from the Lease at assessment creation - later edits to Lease.reversion_standard_code do not move an open assessment."
    constants:
      MAX_COMPONENT_SCORE: 100
    precision: "integer basis points; round_half_up per component before summing; holdback in integer cents, capped by deposit_held_cents"

validations:
  - rule: "Every referenced parent must exist: lessee_id, lease_id, revaluation_id, mortgage_id, transfer_id, statement_id, loss_event_id, assessment_id and predecessor_lease_id must each name an existing row"
    error_id: ERR_LEASE_NOT_FOUND
    category: referential
    priority: 1
    applies_to: "every write that carries a foreign key; the error_id shown is the lease case, each other parent has its own NOT_FOUND code in the catalog"
  - rule: "The acting role in X-Role must be permitted for the endpoint"
    error_id: ERR_UNAUTHORIZED
    category: authorization
    priority: 2
    applies_to: "every endpoint with a non-empty allowed_roles list"
  - rule: "Body shape must be valid before anything else is read: unknown enum values, negative money or area, scores outside 0-100, basis points outside 0-10000, malformed ISO 8601 instants and missing required fields are all rejected"
    error_id: ERR_INVALID_REQUEST
    category: format
    priority: 3
    applies_to: "every write endpoint"
  - rule: "expected_lease_version must equal the current Lease.version"
    error_id: ERR_STALE_LEASE_VERSION
    category: concurrency
    priority: 4
    applies_to: "POST /portfolio/percentage-rent-statements, POST /portfolio/estoppel-certificates"
  - rule: "Uniqueness: one AppraisalSubmission per (revaluation_id, appointed_by, round_number); one open RentRevaluation per lease; one ArbitrationProceeding per revaluation; one ReversionAssessment per lease; TransferRequest.premises_unit_code unique among the lease's ACTIVE subleases; LeaseholdMortgage.priority_rank unique per lease; Lessee.legal_name globally unique"
    error_id: ERR_DUPLICATE_RECORD
    category: uniqueness
    priority: 5
    applies_to: "POST /portfolio/rent-revaluations/{id}/appraisals, POST /portfolio/leases/{id}/rent-revaluations, POST /portfolio/rent-revaluations/{id}/arbitration-referrals, POST /portfolio/leases/{id}/reversion-assessments, POST /portfolio/transfer-requests, POST /portfolio/leases/{id}/leasehold-mortgages, POST /portfolio/lessees"
  - rule: "The source entity must sit in a state the operation is declared for, per §1.2"
    error_id: ERR_INVALID_STATE
    category: state
    priority: 6
    applies_to: "every action endpoint"
  - rule: "A lease in lease_status TERMINATED, EXPIRED or REVERTED accepts no new revaluations, statements, alteration requests, transfer requests, mortgages or default notices; only reversion assessments, loss-event allocation and estoppel certificates remain available"
    error_id: ERR_LEASE_NOT_OPERATIVE
    category: state
    priority: 7
    applies_to: "POST /portfolio/leases/{id}/rent-revaluations, POST /portfolio/percentage-rent-statements, POST /portfolio/leases/{id}/alteration-requests, POST /portfolio/transfer-requests, POST /portfolio/leases/{id}/leasehold-mortgages, POST /portfolio/leases/{id}/default-notices"
  - rule: "Segregation of duties: the X-User-ID that served a DefaultNotice may not be the X-User-ID that terminates the lease on it, and the X-User-ID recorded in ReversionAssessment.inspected_by_user_id may not be the one that applies the holdback"
    error_id: ERR_SEGREGATION_OF_DUTIES
    category: authorization
    priority: 8
    applies_to: "POST /portfolio/default-notices/{id}/terminate, POST /portfolio/reversion-assessments/{id}/holdback"
  - rule: "Cross-entity guards: a revaluation may not be referred to arbitration while the lease lease_status is IN_DEFAULT; a transfer request may not be consented to while the lease rent_status is IN_ARBITRATION; an alteration may not be approved while a CASUALTY LossEvent on the lease is in status REPORTED or ADJUSTED; an estoppel certificate may not be issued while any RentRevaluation on the lease is in status ARBITRATION_REFERRED"
    error_id: ERR_CROSS_ENTITY_BLOCKED
    category: cross_entity
    priority: 9
    applies_to: "POST /portfolio/rent-revaluations/{id}/arbitration-referrals, POST /portfolio/transfer-requests/{id}/decision, POST /portfolio/alteration-requests/{id}/decision, POST /portfolio/estoppel-certificates"
  - rule: "Interval rules: every half-open window requires start < end; an AlterationRequest construction window [construction_window_start, construction_window_end) may not overlap another APPROVED window on the same lease, where touching endpoints (previous end == next start) do NOT overlap; a SUBLEASE TransferRequest term [term_start, term_end) must sit inside the lease term and may not overlap another ACTIVE sublease of the same premises_unit_code, again with touching endpoints allowed; a PercentageRentStatement period [period_start, period_end) may not overlap another non-VOID statement on the same lease"
    error_id: ERR_INTERVAL_OVERLAP
    category: temporal
    priority: 10
    applies_to: "POST /portfolio/leases/{id}/alteration-requests, POST /portfolio/alteration-requests/{id}/decision, POST /portfolio/transfer-requests, POST /portfolio/percentage-rent-statements"
  - rule: "Chronology: a RentRevaluation.valuation_date must be at least REVALUATION_ADVANCE_NOTICE_DAYS after the logical clock now; a PercentageRentStatement.period_end must not be after the logical clock now; a DefaultNotice lessee-cure must carry a payment_at at or after the notice served_at; a PercentageRentStatement.period_start must be strictly before period_end"
    error_id: ERR_CHRONOLOGY_VIOLATION
    category: temporal
    priority: 11
    applies_to: "POST /portfolio/leases/{id}/rent-revaluations, POST /portfolio/percentage-rent-statements, POST /portfolio/default-notices/{id}/lessee-cure"
  - rule: "Cure windows are strict: a lessee cure is rejected once the logical clock now is strictly after lessee_cure_deadline, a mortgagee cure election or completion once now is strictly after mortgagee_cure_deadline, and a new-lease election once now is strictly after LeaseholdMortgage.new_lease_election_deadline. At exactly the deadline instant the action still succeeds"
    error_id: ERR_CURE_WINDOW_CLOSED
    category: temporal
    priority: 12
    applies_to: "POST /portfolio/default-notices/{id}/lessee-cure, POST /portfolio/default-notices/{id}/mortgagee-cure, POST /portfolio/leasehold-mortgages/{id}/new-lease-election"
  - rule: "Alteration capacity is conserved: Lease.gfa_allocated_sqft (the sum of requested_gfa_sqft over the lease's APPROVED AlterationRequests) plus this request's requested_gfa_sqft may not exceed Lease.total_permitted_gfa_sqft - equivalently, requested_gfa_sqft may not exceed Lease.gfa_unallocated_sqft. Each request may fit individually while the collective exceeds the envelope"
    error_id: ERR_GFA_ENVELOPE_EXCEEDED
    category: aggregate
    priority: 13
    applies_to: "POST /portfolio/alteration-requests/{id}/decision"
  - rule: "Sublet area is conserved: sum of sublet_area_sqft over the lease's ACTIVE and CONSENT_GRANTED subleases, including the one under decision, may not exceed Lease.total_permitted_gfa_sqft"
    error_id: ERR_SUBLET_AREA_EXCEEDED
    category: aggregate
    priority: 14
    applies_to: "POST /portfolio/transfer-requests/{id}/decision"
  - rule: "Money is conserved: a loss-event allocation requires distributable_pool_cents > 0; a holdback's acknowledged_holdback_cents must equal the computed holdback exactly; a transfer fee payment's amount_cents must equal total_transfer_fee_cents minus transfer_fee_paid_cents exactly"
    error_id: ERR_AMOUNT_NOT_RECONCILED
    category: financial
    priority: 15
    applies_to: "POST /portfolio/loss-events/{id}/allocate, POST /portfolio/reversion-assessments/{id}/holdback, POST /portfolio/transfer-requests/{id}/fee-payments"
  - rule: "Configuration coherence: reval_collar_min_uplift_bps must be strictly less than reval_collar_max_uplift_bps; percentage_rent_rate_bps must be between 100 and 2000; expiration_date must be strictly after commencement_date; total_permitted_gfa_sqft must be at least 1"
    error_id: ERR_TERMS_INCOHERENT
    category: business
    priority: 16
    applies_to: "POST /portfolio/leases, POST /portfolio/leases/{id}/terms"
  - rule: "Permitted use: an AlterationRequest whose proposed_use_code differs from Lease.permitted_use_code is rejected at creation, and an approval re-checks the clause against the use in force at decision time (an intervening terms amendment can invalidate a request that was compliant when submitted)"
    error_id: ERR_USE_NOT_PERMITTED
    category: business
    priority: 17
    applies_to: "POST /portfolio/leases/{id}/alteration-requests, POST /portfolio/alteration-requests/{id}/decision"
  - rule: "Insurance: an estoppel certificate may not be issued while Lease.insurance_status is LAPSED or Lease.insurance_expires_at is at or before the logical clock now; an AlterationRequest with scope_code STRUCTURAL_ALTERATION or REDEVELOPMENT may not be approved unless Lease.lessor_additional_insured is true and Lease.builders_risk_limit_cents is at least estimated_cost_cents"
    error_id: ERR_INSURANCE_DEFICIENT
    category: business
    priority: 18
    applies_to: "POST /portfolio/estoppel-certificates, POST /portfolio/alteration-requests/{id}/decision"

endpoints:
  # ---------- Lessee and Lease set-up ----------
  - method: POST
    path: "/portfolio/lessees"
    description: "Register a ground tenant or prospective transferee"
    roles: [LessorAdmin]
    code: 201
    input: [legal_name, notice_email, "credit_rating_code?"]
    output: Lessee
    side_effects: ["creates Lessee with credit_rating_code defaulting to BBB"]
  - method: POST
    path: "/portfolio/leases"
    description: "Execute a ground lease; lease_status starts ACTIVE and rent_status starts BASE_ONLY"
    roles: [LessorAdmin]
    code: 201
    input: [lessee_id, premises_code, commencement_date, expiration_date, initial_annual_base_rent_cents, revaluation_interval_years, reval_collar_min_uplift_bps, reval_collar_max_uplift_bps, percentage_rent_rate_bps, percentage_rent_breakpoint_cents, permitted_use_code, total_permitted_gfa_sqft, improvements_value_cents, reversion_land_value_cents, reversion_standard_code, security_deposit_cents]
    output: Lease
    side_effects:
      - "current_annual_base_rent_cents = initial_annual_base_rent_cents"
      - "next_revaluation_date = commencement_date + revaluation_interval_years years"
      - "deposit_held_cents = security_deposit_cents; deposit_applied_cents = 0; deposit_refunded_cents = 0"
      - "gfa_allocated_sqft = 0 and gfa_unallocated_sqft = total_permitted_gfa_sqft"
      - "insurance_status = LAPSED until an endorsement is filed"
  - method: POST
    path: "/portfolio/leases/{id}/terms"
    description: "Amend the economic and use terms of a lease by written amendment"
    roles: [LessorAdmin]
    code: 200
    input: ["permitted_use_code?", "reval_collar_min_uplift_bps?", "reval_collar_max_uplift_bps?", "percentage_rent_rate_bps?", "percentage_rent_breakpoint_cents?", "revaluation_interval_years?", "expiration_date?", "total_permitted_gfa_sqft?", "improvements_value_cents?", "reversion_land_value_cents?", "reversion_standard_code?"]
    output: Lease
    side_effects:
      - "overwrites only the supplied fields; recomputes gfa_unallocated_sqft"
      - "increments Lease.version by 1"
  - method: POST
    path: "/portfolio/leases/{id}/insurance-endorsements"
    description: "File the current insurance endorsement for the leasehold"
    roles: [LessorAdmin, GroundTenant]
    code: 200
    input: [property_all_risk_limit_cents, builders_risk_limit_cents, lessor_additional_insured, expires_at]
    output: Lease
    side_effects:
      - "writes property_all_risk_limit_cents, builders_risk_limit_cents, lessor_additional_insured and insurance_expires_at = expires_at"
      - "insurance_status becomes ACTIVE when expires_at is strictly after the logical clock now, otherwise LAPSED"
      - "increments Lease.version by 1"
  - method: POST
    path: "/portfolio/leases/{id}/rent-charges"
    description: "Post a rent or other monetary charge to the lease ledger, raising arrears"
    roles: [LeaseAccountant]
    code: 200
    input: [amount_cents, "memo?"]
    output: Lease
    side_effects:
      - "Lease.arrears_balance_cents += amount_cents"
      - "increments Lease.version by 1"
  - method: POST
    path: "/portfolio/leases/{id}/leasehold-mortgages"
    description: "Record a leasehold mortgage and its notice address; status starts RECORDED"
    roles: [LessorAdmin]
    code: 201
    input: [mortgagee_legal_name, notice_email, original_principal_cents, priority_rank, cure_extension_days]
    output: LeaseholdMortgage
    side_effects:
      - "outstanding_principal_cents = original_principal_cents"
      - "priority_rank must be unique among the lease's mortgages"
  - method: POST
    path: "/portfolio/leasehold-mortgages/{id}/new-lease-election"
    description: "Mortgagee elects a new lease after termination of the encumbered leasehold; conditional action, permitted only from NEW_LEASE_ELIGIBLE and on or before new_lease_election_deadline"
    roles: [MortgageeAgent]
    code: 201
    input: [new_lessee_id, "premises_code?"]
    output: Lease
    side_effects:
      - "mortgage status becomes NEW_LEASE_ELECTED"
      - "mints a replacement Lease with predecessor_lease_id = the terminated lease and origin_mortgage_id = this mortgage"
      - "the replacement lease copies the terminated lease's rent, collar, percentage-rent, envelope and reversion terms, starts lease_status ACTIVE, rent_status BASE_ONLY, arrears_balance_cents = 0 (the election precondition requires the terminated lease's arrears to have been cleared first) and deposit_held_cents = 0"

  # ---------- Revaluation, appraisal and arbitration ----------
  - method: POST
    path: "/portfolio/leases/{id}/rent-revaluations"
    description: "Open a periodic rent revaluation; round_number starts at 1"
    roles: [LessorAdmin]
    code: 201
    input: [valuation_date]
    output: RentRevaluation
    side_effects:
      - "prior_annual_base_rent_cents snapshots Lease.current_annual_base_rent_cents"
      - "Lease.rent_status becomes REVALUATION_OPEN"
      - "status starts OPEN_FOR_APPRAISALS"
  - method: POST
    path: "/portfolio/rent-revaluations/{id}/appraisals"
    description: "Lodge one party-appointed appraisal for the current round; immutable once lodged"
    roles: [LessorAdmin, GroundTenant]
    code: 201
    input: [appointed_by, appraised_annual_rent_cents, valuation_method_code]
    output: AppraisalSubmission
    side_effects:
      - "round_number copies the revaluation's current round_number"
      - "appraiser_user_id = X-User-ID"
      - "rejects a second submission for the same (revaluation_id, appointed_by, round_number)"
  - method: POST
    path: "/portfolio/rent-revaluations/{id}/exchange"
    description: "Exchange the two lodged appraisals and compute the divergence"
    roles: [LessorAdmin]
    code: 200
    input: []
    output: RentRevaluation
    side_effects:
      - "requires exactly one LESSOR and one LESSEE submission at the current round_number"
      - "writes lessor_appraised_rent_cents, lessee_appraised_rent_cents and divergence_bps per revaluation_reset_rent step 1"
      - "status becomes PROPOSALS_EXCHANGED"
  - method: POST
    path: "/portfolio/rent-revaluations/{id}/rounds"
    description: "Open a further negotiation round; permitted only while round_number < MAX_NEGOTIATION_ROUNDS"
    roles: [LessorAdmin]
    code: 200
    input: []
    output: RentRevaluation
    side_effects:
      - "round_number += 1; lessor_appraised_rent_cents, lessee_appraised_rent_cents and divergence_bps are cleared to null"
      - "status returns to OPEN_FOR_APPRAISALS; earlier rounds' AppraisalSubmission rows are retained but excluded from later math"
  - method: POST
    path: "/portfolio/rent-revaluations/{id}/settle"
    description: "Settle the revaluation at the midpoint of the exchanged appraisals"
    roles: [LessorAdmin]
    code: 200
    input: []
    output: RentRevaluation
    side_effects:
      - "resolved_annual_base_rent_cents per revaluation_reset_rent variant midpoint_settlement; resolution_method = MIDPOINT_SETTLEMENT"
      - "status becomes RESOLVED"
      - "Lease.current_annual_base_rent_cents = resolved_annual_base_rent_cents, Lease.rent_status becomes RESET_APPLIED and Lease.version increments by 1"
      - "recomputes base_rent_offset_credit_cents on every SUBMITTED PercentageRentStatement of the lease"
  - method: POST
    path: "/portfolio/rent-revaluations/{id}/arbitration-referrals"
    description: "Refer the revaluation to baseball arbitration; conditional action, permitted only when divergence_bps exceeds ARBITRATION_DIVERGENCE_THRESHOLD_BPS"
    roles: [LessorAdmin]
    code: 201
    input: [arbitrator_user_id, hearing_date]
    output: ArbitrationProceeding
    side_effects:
      - "creates ArbitrationProceeding with status REFERRED"
      - "revaluation status becomes ARBITRATION_REFERRED and Lease.rent_status becomes IN_ARBITRATION"
  - method: POST
    path: "/portfolio/arbitrations/{id}/award"
    description: "Arbitrator files an independent value and issues the baseball award"
    roles: [Arbitrator]
    code: 200
    input: [independent_annual_rent_cents]
    output: ArbitrationProceeding
    side_effects:
      - "award_basis and awarded_annual_rent_cents per revaluation_reset_rent variant arbitration_award; status becomes AWARDED"
      - "revaluation resolved_annual_base_rent_cents = awarded rent after the collar clamp, resolution_method = ARBITRATION_AWARD, status becomes RESOLVED"
      - "Lease.current_annual_base_rent_cents = the clamped award, Lease.rent_status becomes RESET_APPLIED and Lease.version increments by 1"
      - "recomputes base_rent_offset_credit_cents on every SUBMITTED PercentageRentStatement of the lease"

  # ---------- Percentage rent ----------
  - method: POST
    path: "/portfolio/percentage-rent-statements"
    description: "Tenant files a percentage-rent statement for a closed period; carries the OCC guard on the lease"
    roles: [GroundTenant]
    code: 201
    input: [lease_id, period_start, period_end, reported_gross_sales_cents, expected_lease_version]
    output: PercentageRentStatement
    side_effects:
      - "rejects with ERR_STALE_LEASE_VERSION (412) unless expected_lease_version equals the lease's current version"
      - "increments Lease.version by 1"
      - "status starts SUBMITTED; base_rent_offset_credit_cents is provisioned from the base rent in force"
      - "a SUBMITTED statement covering the same period is voided by this filing"
  - method: POST
    path: "/portfolio/percentage-rent-statements/{id}/assess"
    description: "Assess the statement provisionally on the reported sales"
    roles: [LeaseAccountant]
    code: 200
    input: []
    output: PercentageRentStatement
    side_effects:
      - "writes included_sublease_rent_cents, gross_percentage_rent_cents, base_rent_offset_credit_cents and amount_due_cents per percentage_rent_due variant provisional"
      - "assessment_variant = PROVISIONAL; status becomes PROVISIONAL_ASSESSED"
      - "Lease.arrears_balance_cents += amount_due_cents and Lease.version increments by 1"
  - method: POST
    path: "/portfolio/percentage-rent-statements/{id}/audit"
    description: "Close out the statement on audited sales; reconciles the provisional figure"
    roles: [LeaseAccountant]
    code: 200
    input: [audited_gross_sales_cents]
    output: PercentageRentStatement
    side_effects:
      - "recomputes every figure per percentage_rent_due variant audited_final and writes underreport_penalty_cents"
      - "assessment_variant = AUDITED_FINAL; status becomes FINAL_ASSESSED"
      - "Lease.arrears_balance_cents += (new amount_due_cents - the provisional amount_due_cents) + underreport_penalty_cents, so a downward audit reduces arrears; Lease.version increments by 1"

  # ---------- Alterations and redevelopment ----------
  - method: POST
    path: "/portfolio/leases/{id}/alteration-requests"
    description: "Tenant applies for consent to alter or redevelop"
    roles: [GroundTenant]
    code: 201
    input: [scope_code, proposed_use_code, requested_gfa_sqft, construction_window_start, construction_window_end, estimated_cost_cents]
    output: AlterationRequest
    side_effects:
      - "status starts SUBMITTED; proposed_use_code is checked against Lease.permitted_use_code at creation"
      - "the construction window is validated half-open against other APPROVED windows on the lease"
  - method: POST
    path: "/portfolio/alteration-requests/{id}/decision"
    description: "Asset manager approves or rejects the alteration; approval consumes the development envelope"
    roles: [AssetManager]
    code: 200
    input: [decision, "conditions_note?"]
    output: AlterationRequest
    side_effects:
      - "decision APPROVE: status becomes APPROVED, decided_by_user_id = X-User-ID"
      - "decision APPROVE: Lease.gfa_allocated_sqft += requested_gfa_sqft, gfa_unallocated_sqft is re-derived and Lease.version increments by 1"
      - "decision APPROVE re-checks the use clause, the envelope, the window overlap and the builders-risk cover in force at decision time"
      - "decision REJECT: status becomes REJECTED with no envelope movement"
  - method: POST
    path: "/portfolio/alteration-requests/{id}/revoke-approval"
    description: "Revoke a granted alteration approval; compensating action that returns the envelope"
    roles: [AssetManager]
    code: 200
    input: [reason_code]
    output: AlterationRequest
    side_effects:
      - "status becomes APPROVAL_REVOKED"
      - "Lease.gfa_allocated_sqft -= requested_gfa_sqft, gfa_unallocated_sqft is re-derived and Lease.version increments by 1, restoring the pre-approval envelope exactly"

  # ---------- Transfers: assignment and subleasing ----------
  - method: POST
    path: "/portfolio/transfer-requests"
    description: "Tenant requests consent to assign the lease or to sublet part of the premises"
    roles: [GroundTenant]
    code: 201
    input: [lease_id, transfer_type, term_start, term_end, transferee_legal_name, "parent_transfer_id?", "transferee_lessee_id?", "transferee_credit_rating_code?", "premises_unit_code?", "annual_sublease_rent_cents?", "sublet_area_sqft?", "net_consideration_cents?", "consent_deposit_cents?"]
    output: TransferRequest
    side_effects:
      - "status starts SUBMITTED; submitted_late = (logical clock now > term_start)"
      - "tier_depth = 1 when parent_transfer_id is null, otherwise parent tier_depth + 1"
      - "ASSIGNMENT requires transferee_lessee_id and net_consideration_cents; SUBLEASE requires premises_unit_code, annual_sublease_rent_cents and sublet_area_sqft"
  - method: POST
    path: "/portfolio/transfer-requests/{id}/decision"
    description: "Lessor grants or denies consent; granting prices the transfer fee"
    roles: [AssetManager]
    code: 200
    input: [decision, "denial_reason_code?"]
    output: TransferRequest
    side_effects:
      - "decision APPROVE: computes allocable_base_rent_cents, transfer_fee_gross_cents, admin_charge_cents, late_surcharge_cents and total_transfer_fee_cents per transfer_fee; transfer_fee_paid_cents = consent_deposit_cents; status becomes CONSENT_GRANTED"
      - "decision APPROVE rejects a transferee_credit_rating_code of SPECULATIVE on an ASSIGNMENT"
      - "decision DENY: status becomes CONSENT_DENIED with every fee field left null"
  - method: POST
    path: "/portfolio/transfer-requests/{id}/fee-payments"
    description: "Pay the balance of the transfer fee; full payment activates the transfer"
    roles: [GroundTenant]
    code: 200
    input: [amount_cents]
    output: TransferRequest
    side_effects:
      - "amount_cents must equal total_transfer_fee_cents - transfer_fee_paid_cents exactly"
      - "transfer_fee_paid_cents = total_transfer_fee_cents; status becomes ACTIVE"
      - "ASSIGNMENT: Lease.lessee_id becomes transferee_lessee_id and Lease.version increments by 1"
      - "SUBLEASE: Lease.percentage_rent_sublease_base_cents is recomputed per sublease_inclusion_base and Lease.version increments by 1"

  # ---------- Default, cure and mortgagee protections ----------
  - method: POST
    path: "/portfolio/leases/{id}/default-notices"
    description: "Serve a notice of default and open the cure windows"
    roles: [AssetManager, LeaseAccountant]
    code: 201
    input: [default_type, "claimed_amount_cents?"]
    output: DefaultNotice
    side_effects:
      - "served_at = logical clock now; served_by_user_id = X-User-ID; status starts SERVED"
      - "lessee_cure_deadline and mortgagee_cure_deadline per cure_window_deadlines"
      - "Lease.lease_status becomes IN_DEFAULT and Lease.version increments by 1"
      - "every RECORDED mortgage on the lease with a notice address moves to NOTICE_SERVED with mortgagee_notified_at = served_at"
  - method: POST
    path: "/portfolio/default-notices/{id}/lessee-cure"
    description: "Tenant cures the default within its window; conditional action, refused once the window has closed"
    roles: [GroundTenant]
    code: 200
    input: ["payment_at?", "cure_amount_cents?"]
    output: DefaultNotice
    side_effects:
      - "status becomes LESSEE_CURED with cured_by = LESSEE"
      - "Lease.arrears_balance_cents -= cure_amount_cents on a monetary default, floored at 0"
      - "Lease.lease_status returns to ACTIVE and Lease.version increments by 1"
      - "every NOTICE_SERVED mortgage on the lease returns to RECORDED with mortgagee_notified_at cleared"
  - method: POST
    path: "/portfolio/default-notices/{id}/mortgagee-cure"
    description: "Mortgagee elects to cure (action ELECT) or completes its cure (action COMPLETE) after the tenant's window lapsed"
    roles: [MortgageeAgent]
    code: 200
    input: [action, mortgage_id, "cure_amount_cents?"]
    output: DefaultNotice
    side_effects:
      - "action ELECT: notice status becomes MORTGAGEE_CURING and the named mortgage moves NOTICE_SERVED -> CURING"
      - "action COMPLETE: notice status becomes MORTGAGEE_CURED with cured_by = MORTGAGEE, the mortgage returns CURING -> RECORDED, Lease.arrears_balance_cents -= cure_amount_cents floored at 0, Lease.lease_status returns to ACTIVE and Lease.version increments by 1"
      - "both actions are refused once the logical clock now is strictly after mortgagee_cure_deadline"
  - method: POST
    path: "/portfolio/default-notices/{id}/terminate"
    description: "Terminate the lease on an uncured default; segregation of duties bars the user who served the notice"
    roles: [AssetManager, LeaseAccountant]
    code: 200
    input: []
    output: DefaultNotice
    side_effects:
      - "rejects when X-User-ID equals served_by_user_id"
      - "status becomes TERMINATION_EFFECTED; terminated_by_user_id = X-User-ID"
      - "Lease.lease_status becomes TERMINATED, Lease.rent_status becomes FROZEN and Lease.version increments by 1"
      - "every NOTICE_SERVED or CURING mortgage on the lease becomes NEW_LEASE_ELIGIBLE with new_lease_election_deadline = now + NEW_LEASE_ELECTION_DAYS days"
      - "every ACTIVE TransferRequest on the lease becomes TERMINATED_BY_REVERSION and Lease.percentage_rent_sublease_base_cents is recomputed to 0"
      - "every SUBMITTED or PROVISIONAL_ASSESSED PercentageRentStatement on the lease becomes VOID; every ISSUED EstoppelCertificate becomes REVOKED"

  # ---------- Casualty, condemnation and proceeds ----------
  - method: POST
    path: "/portfolio/leases/{id}/loss-events"
    description: "Report a casualty or a condemnation affecting the premises"
    roles: [GroundTenant, AssetManager]
    code: 201
    input: [event_type, scope_code, occurred_at, "damage_estimate_cents?", "damaged_area_sqft?"]
    output: LossEvent
    side_effects: ["status starts REPORTED; every allocated_* bucket is 0 and allocation_detail is empty"]
  - method: POST
    path: "/portfolio/loss-events/{id}/adjust"
    description: "Adjuster fixes the distributable pool, the allocation method and the rent abatement"
    roles: [AssetManager]
    code: 200
    input: [distributable_pool_cents, allocation_method, "rent_abatement_bps?"]
    output: LossEvent
    side_effects:
      - "writes distributable_pool_cents, allocation_method and rent_abatement_bps; status becomes ADJUSTED"
      - "rejects distributable_pool_cents of 0 or less"
  - method: POST
    path: "/portfolio/loss-events/{id}/election"
    description: "Restoration-or-termination election; conditional action, available on CASUALTY events only"
    roles: [GroundTenant]
    code: 200
    input: [election]
    output: LossEvent
    side_effects:
      - "election RESTORE: status becomes RESTORATION_ELECTED"
      - "election TERMINATE: status becomes TERMINATION_ELECTED, Lease.lease_status becomes TERMINATED, Lease.rent_status becomes FROZEN and Lease.version increments by 1, with the same termination cascade the default-notice termination applies"
      - "rejects on a CONDEMNATION event, which carries no election"
  - method: POST
    path: "/portfolio/loss-events/{id}/allocate"
    description: "Run the proceeds waterfall and post the four buckets"
    roles: [LeaseAccountant]
    code: 200
    input: []
    output: LossEvent
    side_effects:
      - "writes lessee_share_bps, allocated_arrears_cents, allocated_mortgagee_cents, allocated_lessee_cents, allocated_lessor_cents and allocation_detail per loss_proceeds_allocation"
      - "Lease.arrears_balance_cents -= allocated_arrears_cents and Lease.version increments by 1"
      - "each mortgage named in allocation_detail has outstanding_principal_cents reduced by its amount_cents, and becomes EXTINGUISHED when that reaches 0"
      - "status becomes ALLOCATED"
  - method: POST
    path: "/portfolio/loss-events/{id}/rescind-allocation"
    description: "Rescind a posted allocation; compensating action that reverses every ledger movement"
    roles: [LeaseAccountant]
    code: 200
    input: [reason_code]
    output: LossEvent
    side_effects:
      - "Lease.arrears_balance_cents += allocated_arrears_cents and Lease.version increments by 1"
      - "each mortgage named in allocation_detail has outstanding_principal_cents restored by its amount_cents and any EXTINGUISHED mortgage returns to its pre-allocation status"
      - "every allocated_* bucket returns to 0, lessee_share_bps and allocation_detail are cleared, and status becomes ALLOCATION_RESCINDED, leaving the ledger byte-identical to its pre-allocation values"

  # ---------- Reversion ----------
  - method: POST
    path: "/portfolio/leases/{id}/reversion-assessments"
    description: "Open the reversion assessment for an expired lease; required_standard_code snapshots the lease standard"
    roles: [AssetManager]
    code: 201
    input: []
    output: ReversionAssessment
    side_effects:
      - "required_standard_code = Lease.reversion_standard_code at creation; status starts PENDING_INSPECTION"
      - "rejects a second assessment on the same lease"
  - method: POST
    path: "/portfolio/reversion-assessments/{id}/inspection"
    description: "Record the three component condition scores and compute the weighted score"
    roles: [AssetManager]
    code: 200
    input: [structural_condition_score, envelope_condition_score, systems_condition_score]
    output: ReversionAssessment
    side_effects:
      - "writes weighted_score_bps and deficiency_bps per reversion_condition_score; status becomes INSPECTED"
      - "inspected_by_user_id = X-User-ID, which the holdback's segregation-of-duties check reads"
  - method: POST
    path: "/portfolio/reversion-assessments/{id}/holdback"
    description: "Apply the condition holdback against the deposit; conditional action, refused when the standard is met"
    roles: [LeaseAccountant, AssetManager]
    code: 200
    input: [acknowledged_holdback_cents]
    output: ReversionAssessment
    side_effects:
      - "rejects when X-User-ID equals ReversionAssessment.inspected_by_user_id"
      - "rejects unless acknowledged_holdback_cents equals the holdback computed by reversion_condition_score"
      - "writes holdback_cents; status becomes HOLDBACK_APPLIED"
      - "Lease.deposit_applied_cents += holdback_cents, Lease.deposit_held_cents -= holdback_cents and Lease.version increments by 1, conserving security_deposit_cents"
  - method: POST
    path: "/portfolio/reversion-assessments/{id}/close"
    description: "Close the reversion, refund the remaining deposit and revert the improvements"
    roles: [AssetManager]
    code: 200
    input: []
    output: ReversionAssessment
    side_effects:
      - "deposit_released_cents = Lease.deposit_held_cents; Lease.deposit_refunded_cents += that amount and deposit_held_cents becomes 0"
      - "Lease.lease_status becomes REVERTED and Lease.version increments by 1"
      - "status becomes CLOSED"

  # ---------- Estoppel certificates ----------
  - method: POST
    path: "/portfolio/estoppel-certificates"
    description: "Issue an estoppel certificate for a leasehold financing; carries the OCC guard on the lease"
    roles: [LessorAdmin, MortgageeAgent]
    code: 201
    input: [lease_id, requested_by_mortgage_id, expected_lease_version]
    output: EstoppelCertificate
    side_effects:
      - "rejects with ERR_STALE_LEASE_VERSION (412) unless expected_lease_version equals the lease's current version"
      - "increments Lease.version by 1"
      - "certified_annual_base_rent_cents, certified_arrears_cents, certified_rent_status and certified_lease_version snapshot the lease as at issuance; issued_at = logical clock now; issued_by_user_id = X-User-ID"
      - "any ISSUED certificate for the same (lease_id, requested_by_mortgage_id) becomes SUPERSEDED"

  # ---------- Scheduled administration and logical clock ----------
  - method: POST
    path: "/portfolio/administration-runs"
    description: "Run the deferred lease-administration sweep. Five phases execute in this fixed order, and within a phase rows are processed by created_at ASC: (1) lapse insurance and auto-serve INSURANCE_LAPSE notices; (2) lapse expired lessee and mortgagee cure windows; (3) flag leases whose next_revaluation_date has arrived as REVALUATION_DUE; (4) extinguish NEW_LEASE_ELIGIBLE mortgages past new_lease_election_deadline; (5) expire leases past expiration_date"
    roles: [LessorAdmin]
    code: 200
    input: []
    output: "{ run_at: string, insurance_lapses_raised: integer, cure_windows_lapsed: integer, revaluations_flagged: integer, mortgages_extinguished: integer, leases_expired: integer, affected_lease_ids: string[] }"
    side_effects:
      - "phase 1: every ACTIVE lease whose insurance_expires_at is non-null and at or before now gets insurance_status LAPSED, a DefaultNotice of default_type INSURANCE_LAPSE with served_by_user_id 'SYSTEM', and lease_status IN_DEFAULT"
      - "phase 2: SERVED notices past lessee_cure_deadline become LESSEE_CURE_LAPSED; LESSEE_CURE_LAPSED notices past mortgagee_cure_deadline and MORTGAGEE_CURING notices past mortgagee_cure_deadline become MORTGAGEE_CURE_LAPSED"
      - "phase 3: leases in rent_status BASE_ONLY or RESET_APPLIED whose next_revaluation_date is at or before now become REVALUATION_DUE"
      - "phase 4: NEW_LEASE_ELIGIBLE mortgages past new_lease_election_deadline become EXTINGUISHED"
      - "phase 5: leases past expiration_date become EXPIRED with rent_status FROZEN, every ACTIVE TransferRequest becomes TERMINATED_BY_REVERSION, every RECORDED mortgage becomes EXTINGUISHED, and Lease.version increments by 1"
      - "the run is idempotent within one logical instant: a second call at the same clock value moves nothing"
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint: set the server's logical clock. Before any call the logical clock reads exactly 2026-08-01T00:00:00Z and never falls back to wall-clock time. Every deadline, expiry and window comparison in this scaffold reads this clock"
    roles: [LessorAdmin]
    code: 200
    input: [current_utc]
    output: "{ current_utc: string }"
    side_effects: ["sets the logical clock; performs no state transitions of its own"]

