# =============================================================================
# PRD Benchmark Seed Tables — Incident Management & On-Call (Expert)
# =============================================================================

scenario: |
  Incident Management & On-Call: incident severity, on-call rotation/escalation
  policy, acknowledgement/SLA timer, multi-channel paging, war-room comms,
  postmortem/action items, error budget, maintenance-window suppression

domain_name: incident-management-oncall
api_prefix: /
# Flat topology with a hub: peer collections live at the root (/services,
# /incidents, /responders, ...), so the api_prefix is the root path. There is no
# single nesting prefix because Incident is one peer among several, not an
# ancestor of the others.

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: temporal_windowing
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - scheduled_actions
    - optimistic_concurrency

  entity_topology: flat
  # Peer entities linked by foreign keys; no deep URL nesting. Incident is the
  # hub; Service / EscalationPolicy / OnCallSchedule / Responder / MaintenanceWindow
  # are peers referenced by FK. Append-only logs (PageAttempt, WarRoomMessage) and
  # 1:1 satellites (WarRoom, Postmortem, ActionItem) hang off their owner by FK.

  state_machine_shape: parallel
  # Incident carries two independent state dimensions (lifecycle_status x
  # escalation_status); escalation_status is cyclic (re-paging loop). Postmortem
  # is a branching-with-revert cycle (IN_REVIEW -> DRAFT).

  relationship_patterns:
    - one_to_many        # Service -> Incident; OnCallSchedule -> ScheduleShift; Postmortem -> ActionItem
    - cross_aggregate    # Incident references Service, EscalationPolicy; EscalationTier references OnCallSchedule

  role_model: peer_roles
  # ResponderUser (entity_backed:Responder) acts on incidents assigned to them;
  # IncidentCommander and PlatformAdmin are opaque operational roles.

  consistency_model: immediate

# =============================================================================
# Table 1.0: Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1.1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Service
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Human-readable service name" }
      - { name: tier, type: enum, source: input, default: "TIER_2", description: "Importance tier; one of TIER_1 | TIER_2 | TIER_3", constraints: "enum: TIER_1, TIER_2, TIER_3" }
      - { name: error_budget_minutes, type: integer, source: input, description: "Total allowed downtime minutes per evaluation window; > 0" }
      - { name: budget_status, type: enum, source: system, default: "HEALTHY", description: "Posture derived from consumed vs budget: HEALTHY | WARNING | EXHAUSTED", constraints: "enum: HEALTHY, WARNING, EXHAUSTED" }
      - { name: error_budget_consumed_minutes, type: integer, source: computed, description: "Read-only: sum of per-incident rounded downtime minutes over RESOLVED incidents that consumed budget; see calc error_budget_consumed" }
      - { name: error_budget_remaining_minutes, type: integer, source: computed, description: "Read-only: max(0, error_budget_minutes - error_budget_consumed_minutes)" }

  - name: Responder
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Responder display name" }
      - { name: email, type: string, source: input, description: "Email channel address; unique across responders" }
      - { name: sms_number, type: string, source: input, required: false, description: "SMS channel address; null disables SMS paging" }
      - { name: voice_number, type: string, source: input, required: false, description: "Voice channel address; null disables voice paging" }
      - { name: push_token, type: string, source: input, required: false, description: "Push channel token; null disables push paging" }

  - name: OnCallSchedule
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Rotation name" }
      - { name: service_id, type: string, source: input, description: "FK -> Service.id; the service this rotation covers" }
      - { name: handoff_interval_hours, type: integer, source: input, default: 168, description: "Nominal rotation length in hours (advisory; shifts pin exact intervals)" }

  - name: ScheduleShift
    parent: null
    common_fields: true
    fields:
      - { name: schedule_id, type: string, source: input, description: "FK -> OnCallSchedule.id; the rotation this shift belongs to" }
      - { name: responder_id, type: string, source: input, description: "FK -> Responder.id; who is on call during this shift" }
      - { name: starts_at, type: datetime, source: input, description: "Shift start, ISO 8601 UTC; interval is half-open [starts_at, ends_at)" }
      - { name: ends_at, type: datetime, source: input, description: "Shift end, ISO 8601 UTC, strictly after starts_at" }

  - name: EscalationPolicy
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Policy name" }
      - { name: service_id, type: string, source: input, description: "FK -> Service.id; the service this policy governs" }
      - { name: repeat_rounds, type: integer, source: input, default: 1, description: "How many times the tier ladder repeats after exhausting all tiers; >= 0" }

  - name: EscalationTier
    parent: null
    common_fields: true
    fields:
      - { name: policy_id, type: string, source: input, description: "FK -> EscalationPolicy.id; the policy this tier belongs to" }
      - { name: schedule_id, type: string, source: input, description: "FK -> OnCallSchedule.id; the rotation paged at this tier" }
      - { name: tier_level, type: integer, source: input, description: "1-based ladder position; unique within a policy; >= 1" }
      - { name: delay_minutes, type: integer, source: input, description: "Minutes after the previous tier with no ack before this tier is paged; >= 0" }

  - name: MaintenanceWindow
    parent: null
    common_fields: true
    fields:
      - { name: service_id, type: string, source: input, description: "FK -> Service.id; the service whose alerts are suppressed" }
      - { name: status, type: enum, source: system, default: "SCHEDULED", description: "SCHEDULED | ACTIVE | ENDED | CANCELLED", constraints: "enum: SCHEDULED, ACTIVE, ENDED, CANCELLED" }
      - { name: starts_at, type: datetime, source: input, description: "Window start, ISO 8601 UTC; interval is closed [starts_at, ends_at]" }
      - { name: ends_at, type: datetime, source: input, description: "Window end, ISO 8601 UTC, strictly after starts_at" }
      - { name: reason, type: string, source: input, required: false, description: "Optional free-text justification" }

  - name: Incident
    parent: null
    common_fields: true
    fields:
      - { name: service_id, type: string, source: input, description: "FK -> Service.id; the affected service" }
      - { name: policy_id, type: string, source: input, description: "FK -> EscalationPolicy.id; the escalation policy applied at trigger time" }
      - { name: title, type: string, source: input, description: "Short incident summary" }
      - { name: severity, type: enum, source: input, description: "SEV1 | SEV2 | SEV3 | SEV4; drives SLA windows and budget cost", constraints: "enum: SEV1, SEV2, SEV3, SEV4" }
      - { name: lifecycle_status, type: enum, source: system, default: "TRIGGERED", description: "Dimension A: TRIGGERED | ACKNOWLEDGED | RESOLVED | SUPPRESSED", constraints: "enum: TRIGGERED, ACKNOWLEDGED, RESOLVED, SUPPRESSED" }
      - { name: escalation_status, type: enum, source: system, default: "PENDING", description: "Dimension B: PENDING | ESCALATING | EXHAUSTED; evolves independently of lifecycle_status", constraints: "enum: PENDING, ESCALATING, EXHAUSTED" }
      - { name: current_tier_level, type: integer, source: system, default: 0, description: "Highest EscalationTier.tier_level paged so far; 0 before first page" }
      - { name: triggered_at, type: datetime, source: system, description: "Server clock at creation, ISO 8601 UTC; SLA baseline" }
      - { name: acknowledged_at, type: datetime, source: system, required: false, description: "Server clock at first acknowledge; null until acknowledged" }
      - { name: resolved_at, type: datetime, source: system, required: false, description: "Server clock at resolve; null until resolved" }
      - { name: ack_deadline_at, type: datetime, source: computed, description: "Computed at trigger by calc incident_sla_deadlines; ack must occur at or before this" }
      - { name: resolve_deadline_at, type: datetime, source: computed, description: "Computed at trigger by calc incident_sla_deadlines; resolve target" }
      - { name: ack_sla_breached, type: boolean, source: computed, default: false, description: "True once acknowledged_at > ack_deadline_at, or current clock > ack_deadline_at while unacknowledged" }
      - { name: counts_against_budget, type: boolean, source: system, default: true, description: "False when the incident was SUPPRESSED before resolution; suppressed incidents never consume budget" }
      - { name: downtime_minutes, type: integer, source: computed, description: "Read-only: ceil((resolved_at - triggered_at) / 60s) when RESOLVED and counts_against_budget, else 0" }

  - name: PageAttempt
    parent: null
    common_fields: false   # append-only event log: id + created_at only
    fields:
      - { name: incident_id, type: string, source: system, description: "FK -> Incident.id; the incident this page belongs to" }
      - { name: responder_id, type: string, source: system, description: "FK -> Responder.id; who was paged" }
      - { name: tier_level, type: integer, source: system, description: "EscalationTier.tier_level that produced this page" }
      - { name: channel, type: enum, source: system, description: "SMS | VOICE | PUSH | EMAIL; the channel used", constraints: "enum: SMS, VOICE, PUSH, EMAIL" }
      - { name: round_index, type: integer, source: system, description: "0-based repeat-round index when the ladder repeats" }

  - name: WarRoom
    parent: null
    common_fields: true
    fields:
      - { name: incident_id, type: string, source: input, description: "FK -> Incident.id; the incident this war room coordinates (1:1)" }
      - { name: status, type: enum, source: system, default: "OPEN", description: "OPEN | CLOSED", constraints: "enum: OPEN, CLOSED" }
      - { name: bridge_url, type: string, source: input, required: false, description: "Optional video bridge link" }

  - name: WarRoomMessage
    parent: null
    common_fields: false   # append-only message log: id + created_at only
    fields:
      - { name: war_room_id, type: string, source: system, description: "FK -> WarRoom.id; the war room this message belongs to" }
      - { name: author_role, type: string, source: system, description: "X-User-Role of the author at post time" }
      - { name: author_id, type: string, source: system, required: false, description: "X-User-ID of the author at post time, when present" }
      - { name: body, type: string, source: input, description: "Message text" }

  - name: Postmortem
    parent: null
    common_fields: true
    fields:
      - { name: incident_id, type: string, source: input, description: "FK -> Incident.id; the resolved incident this postmortem documents (1:1)" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT | IN_REVIEW | PUBLISHED", constraints: "enum: DRAFT, IN_REVIEW, PUBLISHED" }
      - { name: summary, type: string, source: input, description: "Root-cause narrative" }
      - { name: open_action_item_count, type: integer, source: computed, description: "Read-only: count of child ActionItem rows whose status IN {OPEN, IN_PROGRESS}" }

  - name: ActionItem
    parent: null
    common_fields: true
    fields:
      - { name: postmortem_id, type: string, source: input, description: "FK -> Postmortem.id; the postmortem this item belongs to" }
      - { name: owner_responder_id, type: string, source: input, description: "FK -> Responder.id; the assigned owner" }
      - { name: description, type: string, source: input, description: "What must be done" }
      - { name: status, type: enum, source: system, default: "OPEN", description: "OPEN | IN_PROGRESS | DONE | CANCELLED", constraints: "enum: OPEN, IN_PROGRESS, DONE, CANCELLED" }

# =============================================================================
# Table 1.2: State Machine Table
# =============================================================================
state_machines:
  # ---- Incident — PARALLEL dimensions (lifecycle_status x escalation_status), escalation cyclic ----
  - entity: Incident
    note: |
      Two independent state dimensions on the same row. Dimension A
      (lifecycle_status) is driven by human action and suppression. Dimension B
      (escalation_status) is driven by the paging ladder and is CYCLIC: ESCALATING
      re-enters itself once per tier and once per repeat round. The two dimensions
      evolve independently — an incident can be ACKNOWLEDGED while escalation_status
      is still EXHAUSTED, or ESCALATING while lifecycle_status is TRIGGERED.
    initial_state: "TRIGGERED / PENDING"
    terminal_states: [RESOLVED, SUPPRESSED]
    transitions:
      # --- Dimension A: lifecycle_status ---
      - from: TRIGGERED
        to: ACKNOWLEDGED
        trigger: "POST /incidents/{id}/acknowledge"
        actor: ResponderUser
        preconditions:
          - "lifecycle_status == TRIGGERED (else ERR_INCIDENT_NOT_TRIGGERED)"
          - "acting Responder (X-User-ID) was paged for this incident, i.e. a PageAttempt exists with responder_id == X-User-ID (else ERR_RESPONDER_NOT_PAGED)"
        side_effects:
          - "acknowledged_at = current server clock"
          - "ack_sla_breached recomputed: true iff acknowledged_at > ack_deadline_at"
          - "escalation_status -> EXHAUSTED if it was ESCALATING (acknowledgement halts the ladder); current_tier_level frozen"

      - from: ACKNOWLEDGED
        to: RESOLVED
        trigger: "POST /incidents/{id}/resolve"
        actor: ResponderUser
        preconditions:
          - "lifecycle_status == ACKNOWLEDGED (else ERR_INCIDENT_NOT_ACKNOWLEDGED)"
        side_effects:
          - "resolved_at = current server clock"
          - "downtime_minutes computed = ceil((resolved_at - triggered_at)/60) since counts_against_budget is true"
          - "CASCADE: Service.error_budget_consumed_minutes recomputed (calc error_budget_consumed) -> Service.error_budget_remaining_minutes recomputed -> Service.budget_status re-derived (calc service_budget_status); if it crosses to EXHAUSTED that is a third-hop state change on Service"
          - "if an OPEN WarRoom exists for this incident it remains OPEN (closed separately)"

      - from: TRIGGERED
        to: SUPPRESSED
        trigger: "system (on MaintenanceWindow activation covering this incident's service) OR POST /incidents (auto at create time if a window is already ACTIVE)"
        actor: system
        preconditions:
          - "an ACTIVE MaintenanceWindow exists for Incident.service_id whose [starts_at, ends_at] covers the current clock"
        side_effects:
          - "counts_against_budget = false (suppressed incidents never consume error budget)"
          - "escalation_status -> EXHAUSTED; paging halts; no further PageAttempt rows are created"

      # --- Dimension B: escalation_status (CYCLIC) ---
      - from: "escalation_status: PENDING"
        to: "escalation_status: ESCALATING"
        trigger: "POST /incidents (first page at tier 1 fired automatically) OR POST /incidents/{id}/escalate"
        actor: system
        preconditions:
          - "lifecycle_status == TRIGGERED (a paged-but-acknowledged incident does not escalate)"
          - "policy has at least one EscalationTier (else ERR_NO_ESCALATION_TARGET)"
          - "the EscalationTier at the next tier_level resolves to a Responder via an ACTIVE ScheduleShift covering the current clock (else ERR_NO_ESCALATION_TARGET — empty candidate pool)"
        side_effects:
          - "current_tier_level advanced to the next tier_level"
          - "one PageAttempt row created per enabled channel of the targeted Responder (calc paging_fanout)"

      - from: "escalation_status: ESCALATING"
        to: "escalation_status: ESCALATING"
        trigger: "POST /incidents/{id}/escalate (manual next-tier page) — OCC-guarded"
        actor: IncidentCommander
        preconditions:
          - "lifecycle_status == TRIGGERED"
          - "request body carries expected_incident_version equal to Incident.version (else ERR_STALE_VERSION, 412)"
          - "there is a next tier_level (within tiers, or within repeat_rounds of the ladder) whose target resolves (else this transition is unavailable and escalation_status -> EXHAUSTED instead)"
        side_effects:
          - "current_tier_level advanced; round_index advanced when the ladder wraps"
          - "PageAttempt rows created for the new tier's Responder (calc paging_fanout)"
          - "increments Incident.version by 1"

      - from: "escalation_status: ESCALATING"
        to: "escalation_status: EXHAUSTED"
        trigger: "POST /incidents/{id}/escalate when no further tier/round remains, OR system on acknowledge/suppress"
        actor: system
        preconditions:
          - "no next tier_level remains within repeat_rounds, OR the incident was acknowledged/suppressed"
        side_effects:
          - "paging halts; no further PageAttempt rows created"

  # ---- Postmortem — BRANCHING WITH REVERT (cyclic IN_REVIEW -> DRAFT) ----
  - entity: Postmortem
    initial_state: DRAFT
    terminal_states: [PUBLISHED]
    transitions:
      - from: DRAFT
        to: IN_REVIEW
        trigger: "POST /postmortems/{id}/submit"
        actor: IncidentCommander
        preconditions:
          - "status == DRAFT (else ERR_POSTMORTEM_NOT_DRAFT)"
        side_effects: []

      - from: IN_REVIEW
        to: DRAFT
        trigger: "POST /postmortems/{id}/return"
        actor: IncidentCommander
        preconditions:
          - "status == IN_REVIEW (else ERR_POSTMORTEM_NOT_IN_REVIEW)"
        side_effects: []
        note: "Revision loop — reviewer kicks the postmortem back to authoring."

      - from: IN_REVIEW
        to: PUBLISHED
        trigger: "POST /postmortems/{id}/publish"
        actor: IncidentCommander
        preconditions:
          - "status == IN_REVIEW (else ERR_POSTMORTEM_NOT_IN_REVIEW)"
          - "open_action_item_count == 0 (every child ActionItem is DONE or CANCELLED) (else ERR_OPEN_ACTION_ITEMS)"
        side_effects:
          - "status -> PUBLISHED (terminal)"

  # ---- ActionItem — linear with cancel; bubbles up to Postmortem.open_action_item_count ----
  - entity: ActionItem
    initial_state: OPEN
    terminal_states: [DONE, CANCELLED]
    transitions:
      - from: OPEN
        to: IN_PROGRESS
        trigger: "POST /action-items/{id}/start"
        actor: ResponderUser
        preconditions:
          - "status == OPEN (else ERR_ACTION_ITEM_NOT_OPEN)"
          - "acting Responder (X-User-ID) is the owner_responder_id (else ERR_NOT_ACTION_ITEM_OWNER)"
        side_effects:
          - "BUBBLE-UP: parent Postmortem.open_action_item_count recomputed (OPEN+IN_PROGRESS still both counted, so count unchanged)"

      - from: IN_PROGRESS
        to: DONE
        trigger: "POST /action-items/{id}/complete"
        actor: ResponderUser
        preconditions:
          - "status == IN_PROGRESS (else ERR_ACTION_ITEM_NOT_IN_PROGRESS)"
          - "acting Responder (X-User-ID) is the owner_responder_id (else ERR_NOT_ACTION_ITEM_OWNER)"
        side_effects:
          - "BUBBLE-UP: parent Postmortem.open_action_item_count decremented by 1"

      - from: OPEN
        to: CANCELLED
        trigger: "POST /action-items/{id}/cancel"
        actor: IncidentCommander
        preconditions:
          - "status IN {OPEN, IN_PROGRESS} (else ERR_ACTION_ITEM_TERMINAL)"
        side_effects:
          - "COMPENSATION: parent Postmortem.open_action_item_count decremented by 1, restoring it to the value before this item was created"

      - from: IN_PROGRESS
        to: CANCELLED
        trigger: "POST /action-items/{id}/cancel"
        actor: IncidentCommander
        preconditions:
          - "status IN {OPEN, IN_PROGRESS} (else ERR_ACTION_ITEM_TERMINAL)"
        side_effects:
          - "COMPENSATION: parent Postmortem.open_action_item_count decremented by 1"

  # ---- MaintenanceWindow — linear lifecycle, clock-driven activation cascades ----
  - entity: MaintenanceWindow
    initial_state: SCHEDULED
    terminal_states: [ENDED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: ACTIVE
        trigger: "POST /maintenance-windows/{id}/activate (or system when clock enters [starts_at, ends_at])"
        actor: PlatformAdmin
        preconditions:
          - "status == SCHEDULED (else ERR_WINDOW_NOT_SCHEDULED)"
          - "current clock is within [starts_at, ends_at]"
        side_effects:
          - "CASCADE: every Incident on this Service with lifecycle_status == TRIGGERED -> SUPPRESSED (counts_against_budget=false, escalation_status -> EXHAUSTED); this is a second-hop change on Incident caused by the window activation"

      - from: ACTIVE
        to: ENDED
        trigger: "POST /maintenance-windows/{id}/end (or system when clock passes ends_at)"
        actor: PlatformAdmin
        preconditions:
          - "status == ACTIVE (else ERR_WINDOW_NOT_ACTIVE)"
        side_effects: []

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /maintenance-windows/{id}/cancel"
        actor: PlatformAdmin
        preconditions:
          - "status == SCHEDULED (else ERR_WINDOW_NOT_SCHEDULED)"
        side_effects: []

  # ---- WarRoom — linear ----
  - entity: WarRoom
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /war-rooms/{id}/close"
        actor: IncidentCommander
        preconditions:
          - "status == OPEN (else ERR_WAR_ROOM_NOT_OPEN)"
          - "parent Incident.lifecycle_status == RESOLVED (else ERR_INCIDENT_NOT_RESOLVED)"
        side_effects: []

# =============================================================================
# Table 1.2.1: Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: escalate-stale-incident
    parent_entity: Incident
    write_endpoint: "POST /incidents/{id}/escalate"
    occ_field: "expected_incident_version"
    description: |
      A manual escalation against an Incident whose version has advanced since
      the client last observed it is rejected on a stale-version check. This
      captures the case where the system already advanced the ladder (a prior
      escalate created the next tier's PageAttempt rows and bumped the version),
      so the current writer's view of the incident is stale. The manual escalate
      would itself legitimately advance to the next tier from the fresh state, so
      it is a genuine create-with-supersede race resolved by OCC, not a state
      precondition (both reads see lifecycle_status == TRIGGERED).
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 1.3: Calculation Rules Table
# =============================================================================
calculations:
  - name: incident_sla_deadlines
    trigger: "Incident creation (POST /incidents) — computes ack_deadline_at and resolve_deadline_at"
    algorithm: threshold
    formula: |
      base_ack_minutes  = ACK_SLA_MINUTES[severity]
      base_res_minutes  = RESOLVE_SLA_MINUTES[severity]
      VARIANT calendar (default):
        ack_deadline_at     = triggered_at + base_ack_minutes  (wall-clock minutes, 24/7)
        resolve_deadline_at = triggered_at + base_res_minutes
      VARIANT business_hours (Service.tier == TIER_1):
        Only minutes that fall inside the business window [BUSINESS_START_HOUR,
        BUSINESS_END_HOUR) UTC on Mon-Fri count toward the deadline. Walk forward
        from triggered_at consuming business minutes until base_ack_minutes /
        base_res_minutes are consumed; the resulting wall-clock instant is the
        deadline. Minutes outside the business window are skipped (deadline pushed
        later in wall-clock terms).
    input_set: "severity (Incident), tier (parent Service), triggered_at"
    constants:
      ACK_SLA_MINUTES: { SEV1: 15, SEV2: 30, SEV3: 120, SEV4: 480 }
      RESOLVE_SLA_MINUTES: { SEV1: 240, SEV2: 480, SEV3: 1440, SEV4: 4320 }
      BUSINESS_START_HOUR: 9
      BUSINESS_END_HOUR: 17
    precision: "deadlines stamped to whole seconds (ISO 8601, .000 fractional)"
    variants:
      - name: calendar
        when: "Service.tier in {TIER_2, TIER_3}"
        difference: "24/7 wall-clock: deadline = triggered_at + base minutes."
      - name: business_hours
        when: "Service.tier == TIER_1"
        difference: "Only Mon-Fri 09:00-17:00 UTC minutes count; off-hours minutes are skipped, pushing the wall-clock deadline later."

  - name: error_budget_consumed
    trigger: "Incident resolve (POST /incidents/{id}/resolve) — recomputes parent Service.error_budget_consumed_minutes"
    algorithm: aggregation
    formula: |
      Per-incident downtime is rounded to whole minutes FIRST (ceil), THEN summed.
      Rounding order is pinned: round-per-incident-then-sum (NOT sum-seconds-then-round).
        for each Incident I on this Service with lifecycle_status == RESOLVED
            and counts_against_budget == true:
          I.downtime_minutes = ceil((I.resolved_at - I.triggered_at) / 60 seconds)
        error_budget_consumed_minutes = sum of I.downtime_minutes over that set
      Incidents with counts_against_budget == false (suppressed) contribute 0 and
      are excluded from the set entirely.
    input_set: "RESOLVED incidents on the Service with counts_against_budget == true"
    constants: {}
    precision: "integer minutes; per-incident ceil to whole minute before summing"
    variants:
      - name: time_based
        when: "always — this is the canonical consumed metric"
        difference: "Downtime-driven: minutes derived from each incident's open->resolve span."

  - name: error_budget_event_cost
    trigger: "Incident resolve — alternate budget accounting surfaced on Service summary endpoint"
    algorithm: aggregation
    formula: |
      Event-based budget accounting (a SECOND, structurally different way to spend
      the same budget pool than error_budget_consumed): each RESOLVED, budget-
      counting incident costs a FIXED number of budget minutes by severity,
      independent of its actual downtime.
        event_cost_minutes = sum over RESOLVED counts_against_budget incidents of
                             EVENT_COST_MINUTES[severity]
    input_set: "RESOLVED incidents on the Service with counts_against_budget == true"
    constants:
      EVENT_COST_MINUTES: { SEV1: 60, SEV2: 30, SEV3: 10, SEV4: 5 }
    precision: "integer minutes"
    variants:
      - name: event_based
        when: "surfaced on GET /services/{id}/budget-summary as event_cost_minutes"
        difference: "Fixed per-incident cost by severity; ignores actual downtime, so it diverges from the time_based consumed number for the same incident set."

  - name: effective_sla_minutes
    trigger: "Incident creation — combinatorial adjustment to base ack SLA before incident_sla_deadlines stamps ack_deadline_at"
    algorithm: threshold
    formula: |
      Combinatorial (>= 3 inputs, nested min/max, branch on Service posture). Pinned
      evaluation order:
        base = ACK_SLA_MINUTES[severity]
        if Service.budget_status == EXHAUSTED:
          tightened = ceil(base * BUDGET_PRESSURE_FACTOR)     # tighten when budget already blown
        elif Service.budget_status == WARNING:
          tightened = ceil(base * WARNING_PRESSURE_FACTOR)
        else:
          tightened = base
        effective = max(SLA_FLOOR_MINUTES, min(base, tightened))
      The resulting effective ack minutes feed incident_sla_deadlines in place of
      the raw ACK_SLA_MINUTES[severity] for the ack deadline.
    input_set: "severity (Incident), Service.budget_status, base ack minutes"
    constants:
      ACK_SLA_MINUTES: { SEV1: 15, SEV2: 30, SEV3: 120, SEV4: 480 }
      BUDGET_PRESSURE_FACTOR: 0.5
      WARNING_PRESSURE_FACTOR: 0.75
      SLA_FLOOR_MINUTES: 5
    precision: "integer minutes; ceil after each multiply"

  - name: paging_fanout
    trigger: "Each escalation step (auto first page at create, or POST /incidents/{id}/escalate) — creates PageAttempt rows"
    algorithm: aggregation
    formula: |
      Resolve the target Responder for the current tier (see selector
      escalation_target_selector). Create exactly one PageAttempt per ENABLED
      channel of that Responder, in the fixed priority order:
        ordered_channels = [VOICE if voice_number, SMS if sms_number,
                            PUSH if push_token, EMAIL (always, email is required)]
      Each PageAttempt records channel, tier_level = current_tier_level,
      round_index = current round, responder_id = target.
      Page count for one step = number of enabled channels (1..4).
    input_set: "the targeted Responder's non-null channel fields"
    constants: {}
    precision: "integer page count"

  - name: service_budget_status
    trigger: "Recomputed whenever Service.error_budget_consumed_minutes changes (incident resolve cascade)"
    algorithm: threshold
    formula: |
      Posture derived from consumed vs budget, boundaries pinned with >= :
        consumed = Service.error_budget_consumed_minutes
        budget   = Service.error_budget_minutes
        if consumed >= budget:                          budget_status = EXHAUSTED
        elif consumed >= ceil(budget * WARNING_THRESHOLD_PCT): budget_status = WARNING
        else:                                            budget_status = HEALTHY
      Boundary is inclusive: consumed exactly == budget is EXHAUSTED (not WARNING).
    input_set: "Service.error_budget_consumed_minutes, Service.error_budget_minutes"
    constants:
      WARNING_THRESHOLD_PCT: 0.8
    precision: "integer comparison; ceil on the warning threshold"

  - name: maintenance_window_spacing
    trigger: "MaintenanceWindow creation (POST /maintenance-windows) — overlap/adjacency check"
    algorithm: interval_merge
    formula: |
      Closed intervals [starts_at, ends_at] on the same service. For every existing
      non-CANCELLED window W on the service, the new window N is rejected unless the
      gap between them is at least MIN_WINDOW_GAP_MINUTES:
        if N.starts_at <= W.ends_at AND W.starts_at <= N.ends_at: overlap -> reject
        else gap = max(N.starts_at - W.ends_at, W.starts_at - N.ends_at)
             if gap < MIN_WINDOW_GAP_MINUTES * 60 seconds: adjacency too close -> reject
      Distinct interval semantics from shift_overlap: closed endpoints AND a positive
      buffer (adjacency rejected), whereas shifts use half-open endpoints with zero
      buffer (back-to-back allowed).
    input_set: "non-CANCELLED MaintenanceWindow rows on the same service"
    constants:
      MIN_WINDOW_GAP_MINUTES: 30
    precision: "second-level interval comparison"

  - name: schedule_shift_overlap
    trigger: "ScheduleShift creation (POST /schedule-shifts) — overlap check"
    algorithm: interval_merge
    formula: |
      Half-open intervals [starts_at, ends_at) on the same schedule. The new shift N
      is rejected iff it overlaps an existing shift W on the same schedule:
        overlap iff N.starts_at < W.ends_at AND W.starts_at < N.ends_at
      Because endpoints are half-open with zero buffer, back-to-back shifts where
      N.starts_at == W.ends_at do NOT overlap and are allowed.
    input_set: "ScheduleShift rows on the same schedule_id"
    constants: {}
    precision: "second-level interval comparison; strict < on both bounds"

  - name: escalation_target_selector
    trigger: "Each escalation step — picks the Responder to page at a tier"
    algorithm: chronological
    formula: |
      Candidate set: ScheduleShift rows whose schedule_id == EscalationTier.schedule_id
        AND starts_at <= current_clock < ends_at  (half-open interval).
      Ranking: order candidates by starts_at ASC; tie-break by created_at ASC.
      Selected: the FIRST candidate (the shift covering 'now' with the earliest
        start). The selected shift's responder_id is the page target.
      Fallback (empty candidate set): no on-call responder is currently covering
        the tier's schedule -> raise ERR_NO_ESCALATION_TARGET; no PageAttempt
        created and escalation_status stays at its prior value.
    input_set: "ScheduleShift rows for the tier's schedule covering the current clock"
    constants: {}
    precision: "exact interval membership; id is NEVER used as a tie-break"

# =============================================================================
# Table 1.4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and X-User-Role is a recognized role"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT
    http_status: 400
    applies_to: all

  - priority: 2
    category: auth
    check: "Acting role is permitted for this operation per the RBAC matrix"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all write endpoints

  - priority: 3
    category: existence
    check: "Every resource id in the path and every FK in the body resolves to an existing row, validated left-to-right"
    error_id: "ERR_{RESOURCE}_NOT_FOUND (ERR_SERVICE_NOT_FOUND, ERR_RESPONDER_NOT_FOUND, ERR_SCHEDULE_NOT_FOUND, ERR_POLICY_NOT_FOUND, ERR_INCIDENT_NOT_FOUND, ERR_WAR_ROOM_NOT_FOUND, ERR_POSTMORTEM_NOT_FOUND, ERR_ACTION_ITEM_NOT_FOUND, ERR_WINDOW_NOT_FOUND)"
    http_status: 404
    applies_to: all endpoints with path ids or body FKs

  - priority: 4
    category: business_constraint
    check: "Request body required fields present and well-typed; enum members valid; numeric fields in range (error_budget_minutes > 0, tier_level >= 1, delay_minutes >= 0, repeat_rounds >= 0)"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: all POST/PUT endpoints

  - priority: 5
    category: business_temporal
    check: "Interval fields well-formed: ends_at strictly after starts_at on ScheduleShift and MaintenanceWindow"
    error_id: ERR_INVALID_INTERVAL
    http_status: 422
    applies_to: "POST /schedule-shifts, POST /maintenance-windows"

  - priority: 6
    category: state
    check: "Target resource is in the correct state for the requested transition (lifecycle_status, escalation_status, postmortem.status, action_item.status, window.status, war_room.status)"
    error_id: "varies (ERR_INCIDENT_NOT_TRIGGERED, ERR_INCIDENT_NOT_ACKNOWLEDGED, ERR_POSTMORTEM_NOT_DRAFT, ERR_POSTMORTEM_NOT_IN_REVIEW, ERR_ACTION_ITEM_NOT_OPEN, ERR_ACTION_ITEM_NOT_IN_PROGRESS, ERR_ACTION_ITEM_TERMINAL, ERR_WINDOW_NOT_SCHEDULED, ERR_WINDOW_NOT_ACTIVE, ERR_WAR_ROOM_NOT_OPEN)"
    http_status: 409
    applies_to: all state-transition endpoints

  - priority: 7
    category: business_referential
    check: "Cross-entity state dependency: war room close requires parent Incident RESOLVED; postmortem create requires referenced Incident RESOLVED; incident create with an ACTIVE maintenance window on its service auto-suppresses"
    error_id: "ERR_INCIDENT_NOT_RESOLVED (war room / postmortem); see also cross-entity rules"
    http_status: 409
    applies_to: "POST /war-rooms/{id}/close, POST /postmortems"

  - priority: 8
    category: business_safety
    check: "Acknowledge requires the acting Responder to have been paged (a PageAttempt with responder_id == X-User-ID exists); action-item start/complete requires the acting Responder to be the owner"
    error_id: "ERR_RESPONDER_NOT_PAGED (acknowledge), ERR_NOT_ACTION_ITEM_OWNER (action items)"
    http_status: 403
    applies_to: "POST /incidents/{id}/acknowledge, POST /action-items/{id}/start, POST /action-items/{id}/complete"

  - priority: 9
    category: business_constraint
    check: "Escalation has a reachable target: the policy has at least one tier and the next tier's schedule has a ScheduleShift covering the current clock"
    error_id: ERR_NO_ESCALATION_TARGET
    http_status: 409
    applies_to: "POST /incidents (auto first page), POST /incidents/{id}/escalate"

  - priority: 10
    category: business_temporal
    check: "ScheduleShift overlap: a new shift on the same schedule must not overlap an existing shift; half-open [starts_at, ends_at) so back-to-back (ends_at == next starts_at) is allowed"
    error_id: ERR_SHIFT_OVERLAP
    http_status: 409
    applies_to: "POST /schedule-shifts"

  - priority: 11
    category: business_temporal
    check: "MaintenanceWindow spacing: a new window on the same service must be separated from every existing non-CANCELLED window by at least MIN_WINDOW_GAP_MINUTES; closed intervals, adjacency (gap < buffer) rejected"
    error_id: ERR_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /maintenance-windows"

  - priority: 12
    category: business_safety
    check: "Postmortem publish requires open_action_item_count == 0 (all action items DONE or CANCELLED)"
    error_id: ERR_OPEN_ACTION_ITEMS
    http_status: 409
    applies_to: "POST /postmortems/{id}/publish"

  - priority: 13
    category: business_constraint
    check: "Uniqueness: at most one Postmortem per Incident; at most one WarRoom per Incident; EscalationTier.tier_level unique within a policy"
    error_id: "ERR_POSTMORTEM_EXISTS, ERR_WAR_ROOM_EXISTS, ERR_DUPLICATE_TIER_LEVEL"
    http_status: 409
    applies_to: "POST /postmortems, POST /war-rooms, POST /escalation-tiers"

# =============================================================================
# Table 1.5: API Endpoint Table
# =============================================================================
endpoints:
  # ---------- Service ----------
  - method: POST
    path: "/services"
    description: "Create a monitored service"
    roles: [PlatformAdmin]
    code: 201
    input: [name, "tier?", error_budget_minutes]
    output: Service
    side_effects: ["budget_status initialized HEALTHY; consumed=0; remaining=error_budget_minutes"]

  - method: GET
    path: "/services"
    description: "List services (paginated)"
    roles: [PlatformAdmin, IncidentCommander, ResponderUser]
    code: 200
    input: ["limit?", "offset?"]
    output: "Service[]"
    side_effects: []

  - method: GET
    path: "/services/{id}"
    description: "Get a service with computed budget fields"
    roles: [PlatformAdmin, IncidentCommander, ResponderUser]
    code: 200
    input: []
    output: Service
    side_effects: ["error_budget_consumed_minutes / remaining / budget_status reflect calc error_budget_consumed + service_budget_status"]

  - method: GET
    path: "/services/{id}/budget-summary"
    description: "Computed read: both budget accountings side by side (time_based consumed and event_based cost)"
    roles: [PlatformAdmin, IncidentCommander]
    code: 200
    input: []
    output: "{ consumed_minutes: integer, event_cost_minutes: integer, remaining_minutes: integer, budget_status: string }"
    side_effects: []

  - method: GET
    path: "/services/{id}/incidents"
    description: "List incidents for a service (reverse-reachability for Incident.service_id)"
    roles: [PlatformAdmin, IncidentCommander, ResponderUser]
    code: 200
    input: ["limit?", "offset?"]
    output: "Incident[]"
    side_effects: []

  - method: GET
    path: "/services/{id}/maintenance-windows"
    description: "List maintenance windows for a service (reverse-reachability for MaintenanceWindow.service_id)"
    roles: [PlatformAdmin, IncidentCommander]
    code: 200
    input: ["limit?", "offset?"]
    output: "MaintenanceWindow[]"
    side_effects: []

  - method: GET
    path: "/services/{id}/escalation-policies"
    description: "List escalation policies for a service (reverse-reachability for EscalationPolicy.service_id)"
    roles: [PlatformAdmin, IncidentCommander]
    code: 200
    input: ["limit?", "offset?"]
    output: "EscalationPolicy[]"
    side_effects: []

  - method: GET
    path: "/services/{id}/on-call-schedules"
    description: "List on-call schedules for a service (reverse-reachability for OnCallSchedule.service_id)"
    roles: [PlatformAdmin, IncidentCommander]
    code: 200
    input: ["limit?", "offset?"]
    output: "OnCallSchedule[]"
    side_effects: []

  # ---------- Responder ----------
  - method: POST
    path: "/responders"
    description: "Create a responder with contact channels"
    roles: [PlatformAdmin]
    code: 201
    input: [full_name, email, "sms_number?", "voice_number?", "push_token?"]
    output: Responder
    side_effects: []

  - method: GET
    path: "/responders/{id}"
    description: "Get a responder"
    roles: [PlatformAdmin, IncidentCommander, ResponderUser]
    code: 200
    input: []
    output: Responder
    side_effects: []

  # ---------- OnCallSchedule + ScheduleShift ----------
  - method: POST
    path: "/on-call-schedules"
    description: "Create an on-call rotation for a service"
    roles: [PlatformAdmin]
    code: 201
    input: [name, service_id, "handoff_interval_hours?"]
    output: OnCallSchedule
    side_effects: []

  - method: GET
    path: "/on-call-schedules/{id}"
    description: "Get an on-call schedule"
    roles: [PlatformAdmin, IncidentCommander]
    code: 200
    input: []
    output: OnCallSchedule
    side_effects: []

  - method: POST
    path: "/schedule-shifts"
    description: "Create an on-call shift (half-open interval, overlap-checked)"
    roles: [PlatformAdmin]
    code: 201
    input: [schedule_id, responder_id, starts_at, ends_at]
    output: ScheduleShift
    side_effects: ["overlap check against existing shifts on the same schedule (validation priority 10)"]

  - method: GET
    path: "/schedule-shifts"
    description: "List shifts; filterable by schedule_id and responder_id (reverse-reachability for both FKs)"
    roles: [PlatformAdmin, IncidentCommander]
    code: 200
    input: ["schedule_id?", "responder_id?", "limit?", "offset?"]
    output: "ScheduleShift[]"
    side_effects: []

  - method: GET
    path: "/schedule-shifts/{id}"
    description: "Get a single on-call shift"
    roles: [PlatformAdmin, IncidentCommander]
    code: 200
    input: []
    output: ScheduleShift
    side_effects: []

  # ---------- EscalationPolicy + EscalationTier ----------
  - method: POST
    path: "/escalation-policies"
    description: "Create an escalation policy for a service"
    roles: [PlatformAdmin]
    code: 201
    input: [name, service_id, "repeat_rounds?"]
    output: EscalationPolicy
    side_effects: []

  - method: GET
    path: "/escalation-policies/{id}"
    description: "Get an escalation policy"
    roles: [PlatformAdmin, IncidentCommander]
    code: 200
    input: []
    output: EscalationPolicy
    side_effects: []

  - method: GET
    path: "/escalation-policies/{id}/incidents"
    description: "List incidents triggered under a policy (reverse-reachability for Incident.policy_id)"
    roles: [PlatformAdmin, IncidentCommander]
    code: 200
    input: ["limit?", "offset?"]
    output: "Incident[]"
    side_effects: []

  - method: POST
    path: "/escalation-tiers"
    description: "Add a tier to a policy (tier_level unique within policy)"
    roles: [PlatformAdmin]
    code: 201
    input: [policy_id, schedule_id, tier_level, delay_minutes]
    output: EscalationTier
    side_effects: ["duplicate tier_level within policy -> ERR_DUPLICATE_TIER_LEVEL"]

  - method: GET
    path: "/escalation-tiers"
    description: "List escalation tiers; filterable by policy_id and schedule_id (reverse-reachability for both FKs)"
    roles: [PlatformAdmin, IncidentCommander]
    code: 200
    input: ["policy_id?", "schedule_id?", "limit?", "offset?"]
    output: "EscalationTier[]"
    side_effects: []

  - method: GET
    path: "/escalation-tiers/{id}"
    description: "Get a single escalation tier"
    roles: [PlatformAdmin, IncidentCommander]
    code: 200
    input: []
    output: EscalationTier
    side_effects: []

  # ---------- MaintenanceWindow ----------
  - method: POST
    path: "/maintenance-windows"
    description: "Schedule a maintenance window for a service (closed interval, buffer-checked)"
    roles: [PlatformAdmin]
    code: 201
    input: [service_id, starts_at, ends_at, "reason?"]
    output: MaintenanceWindow
    side_effects: ["spacing check vs existing non-CANCELLED windows on the service (validation priority 11)"]

  - method: GET
    path: "/maintenance-windows/{id}"
    description: "Get a maintenance window"
    roles: [PlatformAdmin, IncidentCommander]
    code: 200
    input: []
    output: MaintenanceWindow
    side_effects: []

  - method: POST
    path: "/maintenance-windows/{id}/activate"
    description: "Activate a window; suppresses TRIGGERED incidents on its service"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: MaintenanceWindow
    side_effects: ["status -> ACTIVE", "CASCADE: TRIGGERED incidents on the service -> SUPPRESSED (counts_against_budget=false, escalation halts)"]

  - method: POST
    path: "/maintenance-windows/{id}/end"
    description: "End an active window"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: MaintenanceWindow
    side_effects: ["status -> ENDED"]

  - method: POST
    path: "/maintenance-windows/{id}/cancel"
    description: "Cancel a scheduled window"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: MaintenanceWindow
    side_effects: ["status -> CANCELLED"]

  # ---------- Incident ----------
  - method: POST
    path: "/incidents"
    description: "Trigger an incident; computes SLA deadlines and fires the first escalation page (unless suppressed)"
    roles: [PlatformAdmin, IncidentCommander]
    code: 201
    input: [service_id, policy_id, title, severity]
    output: Incident
    side_effects:
      - "triggered_at stamped; calc effective_sla_minutes then incident_sla_deadlines compute ack_deadline_at + resolve_deadline_at"
      - "if an ACTIVE MaintenanceWindow covers the service now: lifecycle_status -> SUPPRESSED, counts_against_budget=false, escalation_status -> EXHAUSTED, no page"
      - "else: escalation_status -> ESCALATING, current_tier_level -> tier 1, PageAttempt rows created (calc paging_fanout via escalation_target_selector)"

  - method: GET
    path: "/incidents/{id}"
    description: "Get an incident (both state dimensions + computed SLA fields)"
    roles: [PlatformAdmin, IncidentCommander, ResponderUser]
    code: 200
    input: []
    output: Incident
    side_effects: []

  - method: POST
    path: "/incidents/{id}/acknowledge"
    description: "Acknowledge an incident; halts escalation"
    roles: [ResponderUser]
    code: 200
    input: []
    output: Incident
    side_effects: ["acknowledged_at stamped", "ack_sla_breached recomputed", "escalation_status ESCALATING -> EXHAUSTED"]

  - method: POST
    path: "/incidents/{id}/resolve"
    description: "Resolve an acknowledged incident; consumes error budget"
    roles: [ResponderUser, IncidentCommander]
    code: 200
    input: []
    output: Incident
    side_effects:
      - "resolved_at stamped; downtime_minutes computed"
      - "CASCADE: Service.error_budget_consumed_minutes -> remaining -> budget_status re-derived"

  - method: POST
    path: "/incidents/{id}/escalate"
    description: "Manually advance the escalation ladder one tier (OCC-guarded)"
    roles: [IncidentCommander]
    code: 200
    input: [expected_incident_version]
    output: Incident
    side_effects:
      - "current_tier_level advanced; PageAttempt rows created (calc paging_fanout)"
      - "escalation_status stays ESCALATING, or -> EXHAUSTED when no tier/round remains"
      - "increments Incident.version by 1"

  - method: GET
    path: "/incidents/{id}/page-attempts"
    description: "List page attempts for an incident (reverse-reachability for PageAttempt.incident_id; append-only log)"
    roles: [PlatformAdmin, IncidentCommander, ResponderUser]
    code: 200
    input: ["limit?", "offset?"]
    output: "PageAttempt[]"
    side_effects: []

  - method: GET
    path: "/page-attempts"
    description: "List page attempts; filterable by responder_id (reverse-reachability for PageAttempt.responder_id)"
    roles: [PlatformAdmin, IncidentCommander]
    code: 200
    input: ["responder_id?", "incident_id?", "limit?", "offset?"]
    output: "PageAttempt[]"
    side_effects: []

  - method: GET
    path: "/page-attempts/{id}"
    description: "Get a single page attempt"
    roles: [PlatformAdmin, IncidentCommander]
    code: 200
    input: []
    output: PageAttempt
    side_effects: []

  # ---------- WarRoom + WarRoomMessage ----------
  - method: POST
    path: "/war-rooms"
    description: "Open a war room for an incident (1:1)"
    roles: [IncidentCommander]
    code: 201
    input: [incident_id, "bridge_url?"]
    output: WarRoom
    side_effects: ["status OPEN; duplicate per incident -> ERR_WAR_ROOM_EXISTS"]

  - method: GET
    path: "/war-rooms/{id}"
    description: "Get a war room"
    roles: [PlatformAdmin, IncidentCommander, ResponderUser]
    code: 200
    input: []
    output: WarRoom
    side_effects: []

  - method: GET
    path: "/incidents/{id}/war-rooms"
    description: "List war rooms for an incident (reverse-reachability for WarRoom.incident_id; 0 or 1)"
    roles: [PlatformAdmin, IncidentCommander, ResponderUser]
    code: 200
    input: ["limit?", "offset?"]
    output: "WarRoom[]"
    side_effects: []

  - method: POST
    path: "/war-rooms/{id}/close"
    description: "Close a war room (requires parent incident RESOLVED)"
    roles: [IncidentCommander]
    code: 200
    input: []
    output: WarRoom
    side_effects: ["status -> CLOSED"]

  - method: POST
    path: "/war-rooms/{id}/messages"
    description: "Post a message to a war room (append-only)"
    roles: [PlatformAdmin, IncidentCommander, ResponderUser]
    code: 201
    input: [body]
    output: WarRoomMessage
    side_effects: ["author_role/author_id stamped from headers"]

  - method: GET
    path: "/war-rooms/{id}/messages"
    description: "List war room messages (reverse-reachability for WarRoomMessage.war_room_id)"
    roles: [PlatformAdmin, IncidentCommander, ResponderUser]
    code: 200
    input: ["limit?", "offset?"]
    output: "WarRoomMessage[]"
    side_effects: []

  # ---------- Postmortem + ActionItem ----------
  - method: POST
    path: "/postmortems"
    description: "Create a postmortem for a RESOLVED incident (1:1)"
    roles: [IncidentCommander]
    code: 201
    input: [incident_id, summary]
    output: Postmortem
    side_effects: ["status DRAFT; open_action_item_count=0; requires Incident RESOLVED; duplicate -> ERR_POSTMORTEM_EXISTS"]

  - method: GET
    path: "/postmortems/{id}"
    description: "Get a postmortem"
    roles: [PlatformAdmin, IncidentCommander, ResponderUser]
    code: 200
    input: []
    output: Postmortem
    side_effects: []

  - method: GET
    path: "/incidents/{id}/postmortems"
    description: "List postmortems for an incident (reverse-reachability for Postmortem.incident_id; 0 or 1)"
    roles: [PlatformAdmin, IncidentCommander, ResponderUser]
    code: 200
    input: ["limit?", "offset?"]
    output: "Postmortem[]"
    side_effects: []

  - method: POST
    path: "/postmortems/{id}/submit"
    description: "Submit a draft postmortem for review"
    roles: [IncidentCommander]
    code: 200
    input: []
    output: Postmortem
    side_effects: ["status DRAFT -> IN_REVIEW"]

  - method: POST
    path: "/postmortems/{id}/return"
    description: "Return an in-review postmortem to draft (revision loop)"
    roles: [IncidentCommander]
    code: 200
    input: []
    output: Postmortem
    side_effects: ["status IN_REVIEW -> DRAFT"]

  - method: POST
    path: "/postmortems/{id}/publish"
    description: "Publish an in-review postmortem (requires no open action items)"
    roles: [IncidentCommander]
    code: 200
    input: []
    output: Postmortem
    side_effects: ["status IN_REVIEW -> PUBLISHED"]

  - method: POST
    path: "/action-items"
    description: "Add an action item to a postmortem"
    roles: [IncidentCommander]
    code: 201
    input: [postmortem_id, owner_responder_id, description]
    output: ActionItem
    side_effects: ["status OPEN; parent Postmortem.open_action_item_count incremented by 1"]

  - method: GET
    path: "/action-items/{id}"
    description: "Get an action item"
    roles: [PlatformAdmin, IncidentCommander, ResponderUser]
    code: 200
    input: []
    output: ActionItem
    side_effects: []

  - method: GET
    path: "/postmortems/{id}/action-items"
    description: "List action items for a postmortem (reverse-reachability for ActionItem.postmortem_id)"
    roles: [PlatformAdmin, IncidentCommander, ResponderUser]
    code: 200
    input: ["limit?", "offset?"]
    output: "ActionItem[]"
    side_effects: []

  - method: GET
    path: "/action-items"
    description: "List action items; filterable by owner_responder_id (reverse-reachability for ActionItem.owner_responder_id)"
    roles: [PlatformAdmin, IncidentCommander, ResponderUser]
    code: 200
    input: ["owner_responder_id?", "postmortem_id?", "limit?", "offset?"]
    output: "ActionItem[]"
    side_effects: []

  - method: POST
    path: "/action-items/{id}/start"
    description: "Owner moves an action item to IN_PROGRESS"
    roles: [ResponderUser]
    code: 200
    input: []
    output: ActionItem
    side_effects: ["status OPEN -> IN_PROGRESS"]

  - method: POST
    path: "/action-items/{id}/complete"
    description: "Owner completes an action item"
    roles: [ResponderUser]
    code: 200
    input: []
    output: ActionItem
    side_effects: ["status IN_PROGRESS -> DONE; parent open_action_item_count decremented by 1"]

  - method: POST
    path: "/action-items/{id}/cancel"
    description: "Commander cancels an action item (compensation: restores open_action_item_count)"
    roles: [IncidentCommander]
    code: 200
    input: []
    output: ActionItem
    side_effects: ["status -> CANCELLED; parent open_action_item_count decremented by 1"]

  # ---------- Test-driving (clock) ----------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint: set the server clock used for SLA timers, shift coverage, and window activation"
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["server clock set; subsequent triggered_at / acknowledged_at / resolved_at / coverage checks use this value"]

# =============================================================================
# Table 1.6: Error Code Catalog
# =============================================================================
errors:
  # --- auth ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT, http: 400, condition: "X-User-ID or X-User-Role header missing or role unrecognized" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Acting role not permitted for this operation" }
  # --- existence ---
  - { id: ERR_SERVICE_NOT_FOUND, http: 404, condition: "Service id does not resolve" }
  - { id: ERR_RESPONDER_NOT_FOUND, http: 404, condition: "Responder id does not resolve" }
  - { id: ERR_SCHEDULE_NOT_FOUND, http: 404, condition: "OnCallSchedule id does not resolve" }
  - { id: ERR_POLICY_NOT_FOUND, http: 404, condition: "EscalationPolicy id does not resolve" }
  - { id: ERR_INCIDENT_NOT_FOUND, http: 404, condition: "Incident id does not resolve" }
  - { id: ERR_WAR_ROOM_NOT_FOUND, http: 404, condition: "WarRoom id does not resolve" }
  - { id: ERR_POSTMORTEM_NOT_FOUND, http: 404, condition: "Postmortem id does not resolve" }
  - { id: ERR_ACTION_ITEM_NOT_FOUND, http: 404, condition: "ActionItem id does not resolve" }
  - { id: ERR_WINDOW_NOT_FOUND, http: 404, condition: "MaintenanceWindow id does not resolve" }
  # --- request shape ---
  - { id: ERR_INVALID_REQUEST, http: 422, condition: "Missing/invalid required field, bad enum, or numeric out of range" }
  - { id: ERR_INVALID_INTERVAL, http: 422, condition: "ends_at not strictly after starts_at" }
  # --- incident state ---
  - { id: ERR_INCIDENT_NOT_TRIGGERED, http: 409, condition: "acknowledge requires lifecycle_status == TRIGGERED" }
  - { id: ERR_INCIDENT_NOT_ACKNOWLEDGED, http: 409, condition: "resolve requires lifecycle_status == ACKNOWLEDGED" }
  - { id: ERR_INCIDENT_NOT_RESOLVED, http: 409, condition: "war room close / postmortem create requires the incident RESOLVED" }
  - { id: ERR_NO_ESCALATION_TARGET, http: 409, condition: "Policy has no tiers, or next tier's schedule has no shift covering the current clock (empty candidate pool)" }
  # --- postmortem / action item state ---
  - { id: ERR_POSTMORTEM_NOT_DRAFT, http: 409, condition: "submit requires status == DRAFT" }
  - { id: ERR_POSTMORTEM_NOT_IN_REVIEW, http: 409, condition: "return/publish requires status == IN_REVIEW" }
  - { id: ERR_OPEN_ACTION_ITEMS, http: 409, condition: "publish requires open_action_item_count == 0" }
  - { id: ERR_ACTION_ITEM_NOT_OPEN, http: 409, condition: "start requires status == OPEN" }
  - { id: ERR_ACTION_ITEM_NOT_IN_PROGRESS, http: 409, condition: "complete requires status == IN_PROGRESS" }
  - { id: ERR_ACTION_ITEM_TERMINAL, http: 409, condition: "cancel requires status IN {OPEN, IN_PROGRESS}" }
  - { id: ERR_NOT_ACTION_ITEM_OWNER, http: 403, condition: "start/complete requires X-User-ID == owner_responder_id" }
  # --- window / war room state ---
  - { id: ERR_WINDOW_NOT_SCHEDULED, http: 409, condition: "activate/cancel requires status == SCHEDULED" }
  - { id: ERR_WINDOW_NOT_ACTIVE, http: 409, condition: "end requires status == ACTIVE" }
  - { id: ERR_WAR_ROOM_NOT_OPEN, http: 409, condition: "close requires status == OPEN" }
  # --- paging / safety ---
  - { id: ERR_RESPONDER_NOT_PAGED, http: 403, condition: "acknowledge requires the acting Responder to have a PageAttempt for this incident" }
  # --- temporal overlap ---
  - { id: ERR_SHIFT_OVERLAP, http: 409, condition: "New shift overlaps an existing shift on the same schedule (half-open intervals)" }
  - { id: ERR_WINDOW_OVERLAP, http: 409, condition: "New window is within MIN_WINDOW_GAP_MINUTES of an existing non-CANCELLED window on the service (closed intervals + buffer)" }
  # --- uniqueness ---
  - { id: ERR_POSTMORTEM_EXISTS, http: 409, condition: "A postmortem already exists for the incident" }
  - { id: ERR_WAR_ROOM_EXISTS, http: 409, condition: "A war room already exists for the incident" }
  - { id: ERR_DUPLICATE_TIER_LEVEL, http: 409, condition: "tier_level already used within the policy" }
  # --- concurrency ---
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_incident_version does not match Incident.version (OCC)" }

# =============================================================================
# Table 1.7: RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Operational admin: provisions services, responders, schedules, shifts, policies, tiers, windows, and drives the test clock"
    identity: opaque
    exclusive_operations:
      - "POST /services — create service"
      - "POST /responders — create responder"
      - "POST /on-call-schedules — create schedule"
      - "POST /schedule-shifts — create shift"
      - "POST /escalation-policies — create policy"
      - "POST /escalation-tiers — create tier"
      - "POST /maintenance-windows — schedule window"
      - "POST /maintenance-windows/{id}/activate — activate window"
      - "POST /maintenance-windows/{id}/end — end window"
      - "POST /maintenance-windows/{id}/cancel — cancel window"
      - "POST /_clock/set_current_utc — set test clock"
    shared_operations:
      - "GET endpoints across the API"
      - "POST /incidents — trigger incident (shared with IncidentCommander)"
      - "POST /war-rooms/{id}/messages — post message (shared)"

  - name: IncidentCommander
    description: "Coordinates live incidents: triggers, escalates, runs war rooms, authors postmortems and action items"
    identity: opaque
    exclusive_operations:
      - "POST /incidents/{id}/escalate — manual escalate (OCC-guarded)"
      - "POST /war-rooms — open war room"
      - "POST /war-rooms/{id}/close — close war room"
      - "POST /postmortems — create postmortem"
      - "POST /postmortems/{id}/submit — submit for review"
      - "POST /postmortems/{id}/return — return to draft"
      - "POST /postmortems/{id}/publish — publish"
      - "POST /action-items — create action item"
      - "POST /action-items/{id}/cancel — cancel action item"
    shared_operations:
      - "POST /incidents — trigger incident (shared with PlatformAdmin)"
      - "POST /incidents/{id}/resolve — resolve (shared with ResponderUser)"
      - "POST /war-rooms/{id}/messages — post message (shared)"
      - "GET endpoints across the API"

  - name: ResponderUser
    description: "An on-call responder acting as themselves (X-User-ID == Responder.id); acknowledges/resolves incidents they were paged for and works their own action items"
    identity: "entity_backed:Responder"
    exclusive_operations:
      - "POST /incidents/{id}/acknowledge — acknowledge (must have been paged)"
      - "POST /action-items/{id}/start — start own action item"
      - "POST /action-items/{id}/complete — complete own action item"
    shared_operations:
      - "POST /incidents/{id}/resolve — resolve (shared with IncidentCommander)"
      - "POST /war-rooms/{id}/messages — post message (shared)"
      - "GET endpoints across the API"
