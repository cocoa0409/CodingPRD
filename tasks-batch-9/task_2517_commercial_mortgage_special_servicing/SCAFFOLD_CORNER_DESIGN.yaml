            - "consecutive_timely_payments == 0 at loan creation and == 2 after the two recorded payments"
            - "With the count at 2 the MASTER_SERVICING call returns HTTP 422 with error_id ERR_INSUFFICIENT_TIMELY_PAYMENTS"
            - "The loan is still CORRECTED after the refusal, and Loan.version did not increment on the refused call"
            - "The third payment brings consecutive_timely_payments to 3 while servicing_status stays CORRECTED — the payment dimension moves alone"
            - "The identical MASTER_SERVICING call now returns 200 with servicing_status MASTER_SERVICING"
            - "correction_source_plan_id still points at ${plan_id} and is_modified is still true after the return to master servicing"
            - "Trust.loans_in_special_servicing_count == 0 throughout the CORRECTED phase, since CORRECTED is outside the counted set"

      - name: plan_execution_validated_against_a_sibling_appraisal
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=16]
          - state_machines.WorkoutPlan.APPROVED_to_EXECUTED
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / plan_execution_gated_by_another_entitys_appraisal_coverage_window
          rationale: "The named §1.8 instance is the cross-entity validation in full: validity of the plan transition depends entirely on another entity's status and coverage window, and both the valid and invalid sides are exercised."

      - name: existence_check_runs_before_the_optimistic_concurrency_check
        claim_type: cascading_validation
        grounds:
          - validations[priority=6]
          - validations[priority=9]
          - concurrency_rules.workout-plan-create-stale-loan
        distinguishing_aspect: "The version comparison is undefined until the referenced row is known to exist, so the two checks must cascade in order: an absent loan_id carrying a version number returns ERR_LOAN_NOT_FOUND (404), never ERR_STALE_LOAN_VERSION (412); with a real loan the stale version then produces 412; and only the freshly re-read version yields 201. All three calls are otherwise identical."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; one loan in SPECIAL_SERVICING."
            - "The loan's observed version is deliberately made stale by a payment-status write between the read and the plan creation."
          setup_api_calls:
            - call: "POST /special-servicing/trusts"
              payload: { deal_name: "CMBS 2026-V27", closing_date: "2026-01-15T00:00:00Z", original_controlling_class_balance_usd: 40000000 }
              as: PlatformAdmin
              as_user_id: "admin-001"
              captures: { trust_id: "$.data.id" }
            - call: "POST /special-servicing/loans"
              payload: { trust_id: "${trust_id}", loan_number: "L-V27", original_balance_usd: 12000000, current_principal_balance_usd: 10000000, note_rate_pct: 6.0, monthly_debt_service_usd: 65000, maturity_date: "2029-06-01T00:00:00Z", securitization_value_usd: 15000000 }
              as: MasterServicer
              as_user_id: "ms-001"
              captures: { loan_id: "$.data.id" }
            - call: "POST /special-servicing/transfer-events"
              payload: { loan_id: "${loan_id}", event_code: "BANKRUPTCY", occurred_on: "2026-07-01T00:00:00Z", evidence_note: "chapter 11 petition" }
              as: MasterServicer
              as_user_id: "ms-001"
            - call: "POST /special-servicing/loans/${loan_id}/servicing-status"
              payload: { to_status: "SPECIAL_SERVICING" }
              as: MasterServicer
              as_user_id: "ms-001"
              captures: { stale_loan_version: "$.data.version" }
            - call: "POST /special-servicing/loans/${loan_id}/payment-status"
              payload: { to_status: "CURRENT", as_of_date: "2026-08-01T00:00:00Z", timely_payment_recorded: true }
              as: MasterServicer
              as_user_id: "ms-001"
              captures: { bumped_version: "$.data.version" }
          trigger:
            - call: "POST /special-servicing/workout-plans"
              payload: { loan_id: "00000000-0000-4000-8000-000000000031", discount_rate_pct: 9.5, npv_basis: "CONTRACTUAL", expected_loan_version: "${stale_loan_version}" }
              as: SpecialServicerAssetManager
              as_user_id: "amgr-001"
              captures: { not_found_error: "$.data.error_id" }
            - call: "POST /special-servicing/workout-plans"
              payload: { loan_id: "${loan_id}", discount_rate_pct: 9.5, npv_basis: "CONTRACTUAL", expected_loan_version: "${stale_loan_version}" }
              as: SpecialServicerAssetManager
              as_user_id: "amgr-001"
              captures: { stale_error: "$.data.error_id" }
            - call: "GET /special-servicing/loans/${loan_id}"
              as: SpecialServicerAssetManager
              as_user_id: "amgr-001"
              captures: { fresh_loan_version: "$.data.version", active_plan_before: "$.data.active_workout_plan_id" }
            - call: "POST /special-servicing/workout-plans"
              payload: { loan_id: "${loan_id}", discount_rate_pct: 9.5, npv_basis: "CONTRACTUAL", expected_loan_version: "${fresh_loan_version}" }
              as: SpecialServicerAssetManager
              as_user_id: "amgr-001"
              captures: { plan_id: "$.data.id", plan_status: "$.data.status" }
          assert:
            - "Call 1 (absent loan_id, stale version) returns HTTP 404 with error_id ERR_LOAN_NOT_FOUND — the version is never compared because there is nothing to compare against"
            - "Call 2 (real loan, stale version) returns HTTP 412 with error_id ERR_STALE_LOAN_VERSION, proving the concurrency rule is implemented and merely unreachable in call 1"
            - "The payment-status write is what made the captured version stale: bumped_version == stale_loan_version + 1"
            - "Before call 3 the loan still has active_workout_plan_id null and servicing_status SPECIAL_SERVICING — neither refusal mutated anything"
            - "Call 3 with the freshly re-read version returns 201 with plan status DRAFT and moves the loan to IN_WORKOUT"
            - "Exactly one WorkoutPlan row exists on the loan after all three calls"

  - section: endpoints
    instances:
      - name: fee_accrual_create_read_list_and_collect_round_trip
        claim_type: standard_crud
        grounds:
          - endpoints.POST_fee-accruals
          - endpoints.GET_fee-accruals
          - endpoints.POST_fee-accruals_id_status
        distinguishing_aspect: "The full CRUD surface of the fee ledger in one pass: two monthly accruals are created, each readable by id, the list endpoint filters by loan_id and paginates with limit 1 (total_count 2, has_more true) in created_at ASC order, and the collection transition stamps collected_on while removing the fee from loan.fees_payable_usd. There is no PATCH or DELETE — the status endpoint is the only mutation path."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; trust on defaults (0.25 annual, STATED_PRINCIPAL)."
            - "One loan with principal 10,000,000.00, so each monthly accrual is 2,083.33."
          setup_api_calls:
            - call: "POST /special-servicing/trusts"
              payload: { deal_name: "CMBS 2026-V28", closing_date: "2026-01-15T00:00:00Z", original_controlling_class_balance_usd: 40000000 }
              as: PlatformAdmin
              as_user_id: "admin-001"
              captures: { trust_id: "$.data.id" }
            - call: "POST /special-servicing/loans"
              payload: { trust_id: "${trust_id}", loan_number: "L-V28", original_balance_usd: 12000000, current_principal_balance_usd: 10000000, note_rate_pct: 6.0, monthly_debt_service_usd: 65000, maturity_date: "2029-06-01T00:00:00Z", securitization_value_usd: 15000000 }
              as: MasterServicer
              as_user_id: "ms-001"
              captures: { loan_id: "$.data.id", fees_payable_0: "$.data.fees_payable_usd" }
          trigger:
            - call: "POST /special-servicing/fee-accruals"
              payload: { loan_id: "${loan_id}", fee_type: "SPECIAL_SERVICING_FEE", period_start: "2026-06-01T00:00:00Z", period_end: "2026-06-30T00:00:00Z" }
              as: MasterServicer
              as_user_id: "ms-001"
              captures: { fee_june_id: "$.data.id", june_amount: "$.data.amount_usd", june_status: "$.data.status", june_accruer: "$.data.accrued_by_user_id" }
            - call: "POST /special-servicing/fee-accruals"
              payload: { loan_id: "${loan_id}", fee_type: "SPECIAL_SERVICING_FEE", period_start: "2026-07-01T00:00:00Z", period_end: "2026-07-31T00:00:00Z" }
              as: SpecialServicerAssetManager
              as_user_id: "amgr-001"
              captures: { fee_july_id: "$.data.id", july_amount: "$.data.amount_usd" }
            - call: "GET /special-servicing/fee-accruals/${fee_june_id}"
              as: MasterServicer
              as_user_id: "ms-001"
              captures: { read_back_amount: "$.data.amount_usd", read_back_period_start: "$.data.period_start" }
            - call: "GET /special-servicing/fee-accruals"
              payload: { loan_id: "${loan_id}", limit: 1, offset: 0 }
              as: MasterServicer
              as_user_id: "ms-001"
              captures: { page1_first_id: "$.data[0].id" }
            - call: "GET /special-servicing/fee-accruals"
              payload: { loan_id: "${loan_id}", limit: 1, offset: 1 }
              as: MasterServicer
              as_user_id: "ms-001"
              captures: { page2_first_id: "$.data[0].id" }
            - call: "POST /special-servicing/fee-accruals/${fee_june_id}/status"
              payload: { to_status: "COLLECTED" }
              as: MasterServicer
              as_user_id: "ms-001"
              captures: { collected_status: "$.data.status", collected_on: "$.data.collected_on" }
            - call: "GET /special-servicing/loans/${loan_id}"
              as: MasterServicer
              as_user_id: "ms-001"
              captures: { fees_payable_after: "$.data.fees_payable_usd" }
          assert:
            - "Both creates return 201 with status ACCRUED, basis_amount_usd 10000000.00, rate_pct 0.020833 and amount_usd 2083.33"
            - "accrued_by_user_id records the actual caller: 'ms-001' on the June accrual and 'amgr-001' on the July accrual"
            - "Loan.fees_payable_usd was 0.00 at loan creation and 4166.66 after both accruals"
            - "GET by id returns the stored row unchanged, including period_start 2026-06-01T00:00:00Z"
            - "GET list with limit 1 offset 0 returns the June accrual, limit 1 offset 1 returns the July accrual, and both pages report total_count 2 with has_more true on page 1"
            - "COLLECTED stamps collected_on == 2026-08-01T00:00:00Z and leaves amount_usd unchanged at 2083.33"
            - "After collection Loan.fees_payable_usd == 2083.33 — only the still-ACCRUED July fee remains payable"
            - "No PATCH or DELETE endpoint exists for FeeAccrual; the row's terminal states are reached only through the status endpoint"

      - name: distribution_report_certify_then_distribute_action_chain
        claim_type: action_endpoint
        grounds:
          - endpoints.POST_distribution-reports_id_status
          - state_machines.DistributionReport
          - entities.DistributionReport.fields.recipients
        distinguishing_aspect: "The report's five snapshot fields are frozen at creation and must not track the trust afterwards: an advance funded after the report is opened moves trust.total_advances_outstanding_usd to 60,000.00 while the report keeps reporting 0.00. The DISTRIBUTED action additionally refuses an empty recipients array before succeeding with a three-party list."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; one trust with one loan already in SPECIAL_SERVICING and no advances, reductions or losses."
          setup_api_calls:
            - call: "POST /special-servicing/trusts"
              payload: { deal_name: "CMBS 2026-V29", closing_date: "2026-01-15T00:00:00Z", original_controlling_class_balance_usd: 40000000 }
