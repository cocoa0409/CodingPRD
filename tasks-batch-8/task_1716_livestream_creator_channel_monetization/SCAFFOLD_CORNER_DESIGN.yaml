      - name: ops_run_summary_output_shape
        claim_type: computed_read
        grounds: [endpoints]
        distinguishing_aspect: "POST /api/ops/run returns the inline summary object; counters reflect the work done in that run and ops_run_index increments from 0 to 1."
        test_recipe:
          setup: ["Channel with one August PENDING TIP event; clock at 2026-09-01"]
