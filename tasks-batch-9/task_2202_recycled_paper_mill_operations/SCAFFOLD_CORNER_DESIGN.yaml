      - name: only_the_energy_manager_touches_the_steam_header
        claim_type: exclusive_operation
        grounds:
          - roles.EnergyManager.exclusive_operations
          - roles.EnergyManager.shared_operations
          - endpoints.POST_steam_allocations
          - endpoints.GET_steam_allocations
        distinguishing_aspect: "POST /steam-allocations is EnergyManager-exclusive while GET /steam-allocations is shared with MillPlanner, so the same actor split must land differently on the write and the read: MillPlanner gets 403 on the POST yet 200 on the list. A naive implementation that gates the whole /steam-allocations resource by role fails one half of this."
        test_recipe:
          setup: ["PM1 exists and EnergyManager energy-1 holds one GRANTED allocation of 50.000 tph for the 06:00-14:00 window on 2026-09-01."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: EnergyManager
              as_user_id: "energy-1"
            - call: "POST /paper-machines"
              payload: { name: "PM1", wire_width_mm: 5600, max_tons_per_hour: 20.00, changeover_buffer_minutes: 30, steam_tph_per_ton: 2.500 }
              as: MillPlanner
              as_user_id: "planner-1"
              captures: { machine_id: "$.data.id" }
            - call: "POST /steam-allocations"
              payload: { consumer_kind: "PAPER_MACHINE", consumer_ref_id: "${machine_id}", window_start: "2026-09-01T06:00:00Z", window_end: "2026-09-01T14:00:00Z", demand_tph: 50.000, priority_rank: 1 }
              as: EnergyManager
              as_user_id: "energy-1"
              captures: { alloc_a: "$.data.id" }
          trigger:
            - call: "POST /steam-allocations"
              payload: { consumer_kind: "PAPER_MACHINE", consumer_ref_id: "${machine_id}", window_start: "2026-09-02T06:00:00Z", window_end: "2026-09-02T14:00:00Z", demand_tph: 10.000, priority_rank: 2 }
              as: MillPlanner
              as_user_id: "planner-1"
            - call: "GET /steam-allocations"
              payload: {}
              as: MillPlanner
              as_user_id: "planner-1"
          assert:
            - "the POST returns HTTP 403 with response.data.error_id == 'ERR_ROLE_NOT_PERMITTED'"
            - "the GET returns HTTP 200 with response.total_count == 1 and response.data[0].id == '${alloc_a}'"
            - "GET /steam-allocations as EnergyManager also reports total_count == 1, confirming the refused POST created nothing"

      - name: the_clock_is_shared_by_exactly_three_roles
        claim_type: shared_operation
        grounds:
