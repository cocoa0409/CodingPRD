      - name: corner_entity_backed_identity_headers_that_do_not_resolve_or_do_not_own_the_row_are_rejected
        claim_type: peer_roles
        grounds:
          - validations[priority=1]
          - validations[priority=3]
          - validations[priority=7]
          - validations[priority=8]
          - errors[ERR_MISSING_AUTH_HEADERS]
          - errors[ERR_UNKNOWN_ACTOR_IDENTITY]
          - errors[ERR_ACTOR_NOT_ON_ROUTE]
          - errors[ERR_ACTOR_NOT_ACCOUNT_CONTACT]
          - roles[RouteTechnician]
          - roles[CustomerContact]
        distinguishing_aspect: "The two entity-backed roles are checked in three escalating stages on the SAME call: header presence (401), identity resolution against the backing entity (401), then ownership of the specific row (403). A RouteTechnician holding a real but foreign route id and a CustomerContact holding a real but foreign account id are both authenticated and authorized for the endpoint, and still refused."
        test_recipe:
          setup:
            - "clock at 2026-08-03T08:00:00Z; TWO MON routes; one COFFEE product; model URN-30; one PLACEMENT asset"
            - "account 1 has a planned site on route 1 with an ACTIVE placement, one SCHEDULED visit, and one PROPOSED price adjustment after the index moves to 2400000; account 2 exists only to supply a foreign contact identity"
