# =============================================================================
# 1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task 2106 — Building Commissioning & Systems Verification
# Breadth probe over every testable claim in SCAFFOLD.yaml 1.1-1.7 that
# SCAFFOLD_DIFFICULTY_DESIGN.yaml does not already assert.
# Sections and claim_type values come from references/claim-extraction-guide.md.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: create_cx_project_applies_declared_defaults
        claim_type: defaults
        grounds:
          - entities.CxProject.fields.certification_target
          - entities.CxProject.fields.witness_capacity
          - entities.CxProject.fields.delivery_phase
          - entities.CxProject.fields.readiness_posture
        distinguishing_aspect: "Omitting certification_target and witness_capacity yields NONE and 1; delivery_phase is PLANNING, readiness_posture OPEN, and every computed roll-up is its zero value."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /cx-projects"
              payload: { name: "Default Cx", building_name: "Default Block", project_type: "NEW_CONSTRUCTION", contract_value_cents: 50000000 }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
              captures: { p: $.data.id, v: $.data.version }
          assert:
            - "CxProject.${p}.certification_target == NONE"
            - "CxProject.${p}.witness_capacity == 1"
            - "CxProject.${p}.delivery_phase == PLANNING"
            - "CxProject.${p}.readiness_posture == OPEN"
            - "CxProject.${p}.issue_severity_index == 0 and CxProject.${p}.retainage_withheld_cents == 0 and CxProject.${p}.verified_prefunctional_units == 0"
            - "CxProject.${p}.acceptance_completion_score == 0 and CxProject.${p}.final_acceptance_score is null and CxProject.${p}.acceptance_kind is null"
            - "${v} == 1 and ${p} matches the bare 8-4-4-4-12 UUID form with no type prefix"
            - "HTTP status is 201"

      - name: get_cx_project_returns_the_stored_row
        claim_type: retrieval
        grounds:
          - endpoints[GET /cx-projects/{id}]
          - entities.CxProject.fields.building_name
        distinguishing_aspect: "GET /cx-projects/{id} echoes every field written at creation, including the version used for optimistic concurrency."
        test_recipe:
          setup:
            - "One CxProject created with contract_value_cents 50000000 and witness_capacity 3."
          setup_api_calls:
            - call: "POST /cx-projects"
              payload: { name: "Echo Cx", building_name: "Echo Hall", project_type: "RETRO_COMMISSIONING", contract_value_cents: 50000000, certification_target: "ENHANCED", witness_capacity: 3 }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
              captures: { p: $.data.id }
          trigger:
            - call: "GET /cx-projects/${p}"
              payload: {}
              as: OwnerRepresentative
              as_user_id: "u-owner-1"
          assert:
            - "CxProject.${p}.building_name == Echo Hall"
            - "CxProject.${p}.project_type == RETRO_COMMISSIONING"
            - "CxProject.${p}.certification_target == ENHANCED"
            - "CxProject.${p}.witness_capacity == 3"
            - "HTTP status is 200 and response_type == object"

      - name: list_equipment_units_filters_by_project_and_paginates
        claim_type: listing
        grounds:
          - endpoints[GET /equipment-units]
          - response_envelope.pagination_fields
        distinguishing_aspect: "With three units on project A and one on project B, GET /equipment-units?project_id=A&limit=2&offset=0 returns 2 rows, total_count 3 and has_more true."
        test_recipe:
          setup:
            - "Project A carries EquipmentUnits AHU-1, AHU-2 and AHU-3; project B carries CHW-1."
          setup_api_calls:
            - call: "POST /cx-projects"
              payload: { name: "Alpha Cx", building_name: "Alpha", project_type: "NEW_CONSTRUCTION", contract_value_cents: 50000000 }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
              captures: { pa: $.data.id }
            - call: "POST /cx-projects"
              payload: { name: "Bravo Cx", building_name: "Bravo", project_type: "NEW_CONSTRUCTION", contract_value_cents: 50000000 }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
              captures: { pb: $.data.id }
            - call: "POST /equipment-units"
              payload: { project_id: "${pa}", tag: "AHU-1", system_type: "AHU", criticality: "STANDARD", contract_value_cents: 100000, weight_units: 1 }
              as: CxAuthority
              as_user_id: "u-cxa-1"
            - call: "POST /equipment-units"
              payload: { project_id: "${pa}", tag: "AHU-2", system_type: "AHU", criticality: "STANDARD", contract_value_cents: 100000, weight_units: 1 }
              as: CxAuthority
              as_user_id: "u-cxa-1"
            - call: "POST /equipment-units"
              payload: { project_id: "${pa}", tag: "AHU-3", system_type: "AHU", criticality: "STANDARD", contract_value_cents: 100000, weight_units: 1 }
              as: CxAuthority
              as_user_id: "u-cxa-1"
            - call: "POST /equipment-units"
              payload: { project_id: "${pb}", tag: "CHW-1", system_type: "CHILLER", criticality: "STANDARD", contract_value_cents: 100000, weight_units: 1 }
              as: CxAuthority
              as_user_id: "u-cxa-1"
          trigger:
            - call: "GET /equipment-units?project_id=${pa}&limit=2&offset=0"
              payload: {}
              as: CxAuthority
              as_user_id: "u-cxa-1"
          assert:
            - "response data array length == 2"
            - "meta pagination total_count == 3"
            - "meta pagination has_more == true"
            - "meta pagination limit == 2 and offset == 0"
            - "no returned row has project_id == ${pb}"
            - "response_type == array"

      - name: get_unknown_equipment_unit_returns_not_found
        claim_type: not_found
        grounds:
          - errors[ERR_EQUIPMENT_NOT_FOUND]
          - validations[priority=4]
        distinguishing_aspect: "A syntactically valid UUID that names no EquipmentUnit answers 404 ERR_EQUIPMENT_NOT_FOUND rather than 200 with an empty body."
        test_recipe:
          setup:
            - "Empty database (no equipment rows at all)."
          setup_api_calls: []
          trigger:
            - call: "GET /equipment-units/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: CxAuthority
              as_user_id: "u-cxa-1"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_EQUIPMENT_NOT_FOUND"
            - "HTTP status is 404 and response_type == error"

      - name: create_owner_requirement_without_metric_key_returns_validation
        claim_type: required_fields
        grounds:
          - endpoints[POST /owner-requirements]
          - errors[ERR_VALIDATION]
          - validations[priority=5]
        distinguishing_aspect: "metric_key has source input and no default, so omitting it answers 400 ERR_VALIDATION and writes no OwnerRequirement row."
        test_recipe:
          setup:
            - "One CxProject exists."
          setup_api_calls:
            - call: "POST /cx-projects"
              payload: { name: "Missing Field Cx", building_name: "MF Block", project_type: "NEW_CONSTRUCTION", contract_value_cents: 50000000 }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
              captures: { p: $.data.id }
          trigger:
            - call: "POST /owner-requirements"
              payload: { project_id: "${p}", target_value: 100, tolerance_pct: 5, criticality: "STANDARD" }
              as: OwnerRepresentative
              as_user_id: "u-owner-1"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_VALIDATION"
            - "HTTP status is 400"
            - "GET /owner-requirements?project_id=${p} returns total_count == 0"

      - name: closeout_deliverable_defaults_required_attendee_count_to_zero
        claim_type: defaults
        grounds:
          - entities.CloseoutDeliverable.fields.required_attendee_count
          - entities.CloseoutDeliverable.fields.coverage_ratio
          - calculations.training_coverage_ratio
        distinguishing_aspect: "Omitting required_attendee_count stores 0, and the zero-denominator branch of training_coverage_ratio pins coverage_ratio to exactly 1.0 rather than dividing by zero."
        test_recipe:
          setup:
            - "One CxProject exists; one SYSTEMS_MANUAL_SECTION deliverable is created without required_attendee_count and then delivered with zero attendees."
          setup_api_calls:
            - call: "POST /cx-projects"
              payload: { name: "Coverage Cx", building_name: "Coverage Block", project_type: "NEW_CONSTRUCTION", contract_value_cents: 50000000 }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
              captures: { p: $.data.id }
            - call: "POST /closeout-deliverables"
              payload: { project_id: "${p}", deliverable_kind: "SYSTEMS_MANUAL_SECTION", title: "Chapter 3 - controls" }
              as: DesignTeam
              as_user_id: "u-design-1"
              captures: { d1: $.data.id, rac: $.data.required_attendee_count }
          trigger:
            - call: "POST /closeout-deliverables/${d1}/deliver"
              payload: { attendee_count: 0, duration_minutes: 0 }
              as: DesignTeam
              as_user_id: "u-design-1"
              captures: { cov: $.data.coverage_ratio }
          assert:
            - "${rac} == 0"
            - "${cov} == 1.0"
            - "CloseoutDeliverable.${d1}.status == DELIVERED"

      - name: issue_blocks_acceptance_is_computed_from_severity
        claim_type: computed_fields
        grounds:
          - entities.Issue.fields.blocks_acceptance
          - calculations.issue_severity_index
        distinguishing_aspect: "blocks_acceptance is true for S2 and false for S3 purely as a function of severity, and the S2 row contributes 24.00 to the index while the S3 row contributes 8.00."
        test_recipe:
          setup:
            - "Project P with EquipmentUnit E1 (CRITICAL, contract_value_cents 1000000)."
          setup_api_calls:
            - call: "POST /cx-projects"
              payload: { name: "Blocks Cx", building_name: "Blocks Block", project_type: "NEW_CONSTRUCTION", contract_value_cents: 100000000 }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
              captures: { p: $.data.id }
            - call: "POST /equipment-units"
              payload: { project_id: "${p}", tag: "AHU-B", system_type: "AHU", criticality: "CRITICAL", contract_value_cents: 1000000, weight_units: 1 }
              as: CxAuthority
              as_user_id: "u-cxa-1"
              captures: { e1: $.data.id }
            - call: "POST /issues"
              payload: { project_id: "${p}", origin: "DESIGN_REVIEW", severity: "S3", description: "Minor label error", equipment_id: "${e1}" }
              as: CxAuthority
              as_user_id: "u-cxa-1"
              captures: { i_s3: $.data.id, blocks_s3: $.data.blocks_acceptance }
          trigger:
            - call: "POST /issues"
              payload: { project_id: "${p}", origin: "DESIGN_REVIEW", severity: "S2", description: "Control sequence wrong", equipment_id: "${e1}" }
              as: CxAuthority
              as_user_id: "u-cxa-1"
              captures: { i_s2: $.data.id, blocks_s2: $.data.blocks_acceptance }
          assert:
            - "${blocks_s3} == false"
            - "${blocks_s2} == true"
            - "CxProject.${p}.issue_severity_index == 32.00"
            - "CxProject.${p}.open_blocking_issue_count == 1"
            - "EquipmentUnit.${e1}.blocking_issue_count == 1"

      - name: equipment_unit_system_fields_client_input_ignored
        claim_type: system_fields
        grounds:
          - entities.EquipmentUnit.fields.install_status
          - entities.EquipmentUnit.fields.verification_status
          - entities.EquipmentUnit.fields.blocking_issue_count
        distinguishing_aspect: "install_status, verification_status and blocking_issue_count have source system or computed, so a create body that tries to seed them is refused or ignored and the row still starts NOT_INSTALLED / UNVERIFIED / 0."
        test_recipe:
          setup:
            - "One CxProject exists."
          setup_api_calls:
            - call: "POST /cx-projects"
              payload: { name: "Sysfield Cx", building_name: "Sysfield Block", project_type: "NEW_CONSTRUCTION", contract_value_cents: 50000000 }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
              captures: { p: $.data.id }
          trigger:
            - call: "POST /equipment-units"
              payload: { project_id: "${p}", tag: "AHU-SF", system_type: "AHU", criticality: "STANDARD", contract_value_cents: 100000, weight_units: 1, install_status: "STARTED_UP", verification_status: "FUNCTIONAL_ACCEPTED", blocking_issue_count: 9 }
              as: CxAuthority
              as_user_id: "u-cxa-1"
          assert:
            - "the response is either 400 ERR_VALIDATION (undeclared body fields) or 201 with the seeded values discarded"
            - "if 201: EquipmentUnit install_status == NOT_INSTALLED, verification_status == UNVERIFIED, blocking_issue_count == 0, version == 1"

      - name: equipment_unit_rejects_undeclared_system_type_enum
        claim_type: type_constraints
        grounds:
          - entities.EquipmentUnit.fields.system_type
          - errors[ERR_VALIDATION]
        distinguishing_aspect: "system_type accepts only the seven declared members; a value such as SOLAR_ARRAY answers 400 ERR_VALIDATION."
        test_recipe:
          setup:
            - "One CxProject exists."
          setup_api_calls:
            - call: "POST /cx-projects"
              payload: { name: "Enum Cx", building_name: "Enum Block", project_type: "NEW_CONSTRUCTION", contract_value_cents: 50000000 }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
              captures: { p: $.data.id }
          trigger:
            - call: "POST /equipment-units"
              payload: { project_id: "${p}", tag: "PV-1", system_type: "SOLAR_ARRAY", criticality: "STANDARD", contract_value_cents: 100000, weight_units: 1 }
              as: CxAuthority
              as_user_id: "u-cxa-1"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_VALIDATION"
            - "HTTP status is 400"
            - "GET /equipment-units?project_id=${p} returns total_count == 0"

      - name: credit_evidence_requires_an_existing_parent_credit
        claim_type: parent_relationships
        grounds:
          - entities.CreditEvidence.fields.credit_id
          - errors[ERR_CREDIT_NOT_FOUND]
          - validations[priority=4]
        distinguishing_aspect: "Posting evidence under a credit id that does not exist answers 404 ERR_CREDIT_NOT_FOUND before any evidence_type or scope check runs."
        test_recipe:
          setup:
            - "Empty database (no certification credits)."
          setup_api_calls: []
          trigger:
            - call: "POST /certification-credits/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/evidence"
              payload: { evidence_type: "CHECKLIST", evidence_ref_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d3" }
              as: CxAuthority
              as_user_id: "u-cxa-1"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_CREDIT_NOT_FOUND"
            - "HTTP status is 404"

      - name: cross_project_equipment_and_requirement_returns_scope_mismatch
        claim_type: creation
        grounds:
          - validations[priority=7]
          - errors[ERR_PROJECT_SCOPE_MISMATCH]
          - entities.FunctionalTest.fields.equipment_id
          - entities.FunctionalTest.fields.requirement_id
        distinguishing_aspect: "In a flat topology every foreign key must resolve to the same CxProject: an equipment from project B with a requirement from project A answers 409 ERR_PROJECT_SCOPE_MISMATCH, ahead of every state and temporal check."
        test_recipe:
          setup:
            - "Project A has APPROVED OwnerRequirement RA pinned by an APPROVED CxPlan."
            - "Project B has EquipmentUnit EB in install_status INSTALLED."
          setup_api_calls:
            - call: "POST /cx-projects"
              payload: { name: "Scope A", building_name: "A Block", project_type: "NEW_CONSTRUCTION", contract_value_cents: 50000000 }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
              captures: { pa: $.data.id }
            - call: "POST /cx-projects"
              payload: { name: "Scope B", building_name: "B Block", project_type: "NEW_CONSTRUCTION", contract_value_cents: 50000000 }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
              captures: { pb: $.data.id }
            - call: "POST /owner-requirements"
              payload: { project_id: "${pa}", metric_key: "SUPPLY_AIRFLOW_CFM", target_value: 10000, tolerance_pct: 5, criticality: "CRITICAL" }
              as: OwnerRepresentative
              as_user_id: "u-owner-1"
              captures: { ra: $.data.id }
            - call: "POST /owner-requirements/${ra}/approve"
              payload: {}
              as: OwnerRepresentative
              as_user_id: "u-owner-1"
            - call: "GET /cx-projects/${pa}"
              payload: {}
              as: CxAuthority
              as_user_id: "u-cxa-1"
              captures: { pav: $.data.version }
            - call: "POST /cx-plans"
              payload: { project_id: "${pa}", title: "A Plan", expected_project_version: "${pav}" }
              as: CxAuthority
              as_user_id: "u-cxa-1"
              captures: { pla: $.data.id }
            - call: "POST /cx-plans/${pla}/approve"
              payload: {}
              as: OwnerRepresentative
              as_user_id: "u-owner-1"
            - call: "POST /equipment-units"
              payload: { project_id: "${pb}", tag: "AHU-B1", system_type: "AHU", criticality: "STANDARD", contract_value_cents: 100000, weight_units: 1 }
              as: CxAuthority
              as_user_id: "u-cxa-1"
              captures: { eb: $.data.id }
            - call: "POST /equipment-units/${eb}/install-status"
              payload: { install_status: "INSTALLED" }
              as: Contractor
              as_user_id: "u-contractor-1"
          trigger:
            - call: "POST /functional-tests"
              payload: { equipment_id: "${eb}", requirement_id: "${ra}", script_code: "FPT-X", scheduled_start: "2026-09-12T09:00:00Z", scheduled_end: "2026-09-12T11:00:00Z" }
              as: CxAuthority
              as_user_id: "u-cxa-1"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_PROJECT_SCOPE_MISMATCH"
            - "HTTP status is 409"
            - "GET /functional-tests?equipment_id=${eb} returns total_count == 0"

      - name: owner_requirement_revision_chain_discoverable_by_supersedes_filter
        claim_type: parent_relationships
        grounds:
          - entities.OwnerRequirement.fields.supersedes_requirement_id
          - endpoints[GET /owner-requirements]
          - state_machines.OwnerRequirement.APPROVED_to_SUPERSEDED
        distinguishing_aspect: "The self-referential FK is reverse-reachable: GET /owner-requirements?supersedes_requirement_id=R1 returns exactly the one revision row minted by the revise call, with revision 2."
        test_recipe:
          setup:
            - "Project P with OwnerRequirement R1 approved and then revised once."
          setup_api_calls:
            - call: "POST /cx-projects"
              payload: { name: "Revision Cx", building_name: "Revision Block", project_type: "NEW_CONSTRUCTION", contract_value_cents: 50000000 }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
              captures: { p: $.data.id }
            - call: "POST /owner-requirements"
              payload: { project_id: "${p}", metric_key: "SUPPLY_AIRFLOW_CFM", target_value: 10000, tolerance_pct: 5, criticality: "CRITICAL" }
              as: OwnerRepresentative
              as_user_id: "u-owner-1"
              captures: { r1: $.data.id }
            - call: "POST /owner-requirements/${r1}/approve"
              payload: {}
              as: OwnerRepresentative
              as_user_id: "u-owner-1"
            - call: "POST /owner-requirements/${r1}/revise"
              payload: { target_value: 12000, tolerance_pct: 6, criticality: "STANDARD" }
              as: OwnerRepresentative
              as_user_id: "u-owner-1"
              captures: { r2: $.data.id }
          trigger:
            - call: "GET /owner-requirements?supersedes_requirement_id=${r1}"
              payload: {}
              as: CxAuthority
              as_user_id: "u-cxa-1"
          assert:
            - "response data array length == 1 and the single row id == ${r2}"
            - "OwnerRequirement.${r2}.revision == 2 and OwnerRequirement.${r2}.status == DRAFT"
            - "OwnerRequirement.${r1}.status == SUPERSEDED"
            - "OwnerRequirement.${r2}.target_value == 12000 and OwnerRequirement.${r2}.tolerance_pct == 6"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: equipment_install_status_skipping_installed_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.EquipmentUnit.install_status.NOT_INSTALLED_to_INSTALLED
          - errors[ERR_INVALID_STATE]
          - validations[priority=11]
        distinguishing_aspect: "NOT_INSTALLED -> STARTED_UP is not a declared transition, so the jump answers 409 ERR_INVALID_STATE and install_status remains NOT_INSTALLED."
        test_recipe:
          setup:
            - "Project P with EquipmentUnit E1 freshly created in install_status NOT_INSTALLED."
          setup_api_calls:
            - call: "POST /cx-projects"
              payload: { name: "Skip Cx", building_name: "Skip Block", project_type: "NEW_CONSTRUCTION", contract_value_cents: 50000000 }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
              captures: { p: $.data.id }
            - call: "POST /equipment-units"
              payload: { project_id: "${p}", tag: "AHU-SK", system_type: "AHU", criticality: "STANDARD", contract_value_cents: 100000, weight_units: 1 }
              as: CxAuthority
              as_user_id: "u-cxa-1"
              captures: { e1: $.data.id }
          trigger:
            - call: "POST /equipment-units/${e1}/install-status"
              payload: { install_status: "STARTED_UP" }
              as: Contractor
              as_user_id: "u-contractor-1"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_STATE"
            - "HTTP status is 409"
            - "EquipmentUnit.${e1}.install_status == NOT_INSTALLED"
            - "EquipmentUnit.${e1}.verification_status == UNVERIFIED"

      - name: starting_a_functional_test_twice_returns_invalid_state
        claim_type: idempotency
        grounds:
          - state_machines.FunctionalTest.SCHEDULED_to_IN_PROGRESS
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "The second POST /functional-tests/{id}/start observes status IN_PROGRESS, which has no start transition, and answers 409 ERR_INVALID_STATE without re-stamping started_at."
        test_recipe:
          setup:
            - "Project P with an APPROVED CxPlan pinning R1, EquipmentUnit E1 STARTED_UP and PREFUNCTIONAL_VERIFIED, and FunctionalTest FT1 already started once."
          setup_api_calls:
            - call: "POST /cx-projects"
              payload: { name: "Twice Cx", building_name: "Twice Block", project_type: "NEW_CONSTRUCTION", contract_value_cents: 100000000 }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
              captures: { p: $.data.id }
            - call: "POST /owner-requirements"
              payload: { project_id: "${p}", metric_key: "SUPPLY_AIRFLOW_CFM", target_value: 10000, tolerance_pct: 5, criticality: "CRITICAL" }
              as: OwnerRepresentative
              as_user_id: "u-owner-1"
              captures: { r1: $.data.id }
            - call: "POST /owner-requirements/${r1}/approve"
              payload: {}
              as: OwnerRepresentative
              as_user_id: "u-owner-1"
            - call: "GET /cx-projects/${p}"
              payload: {}
              as: CxAuthority
              as_user_id: "u-cxa-1"
              captures: { pv1: $.data.version }
            - call: "POST /cx-plans"
              payload: { project_id: "${p}", title: "Twice Plan", expected_project_version: "${pv1}" }
              as: CxAuthority
              as_user_id: "u-cxa-1"
              captures: { pl: $.data.id }
            - call: "POST /cx-plans/${pl}/approve"
              payload: {}
              as: OwnerRepresentative
              as_user_id: "u-owner-1"
            - call: "POST /equipment-units"
              payload: { project_id: "${p}", tag: "AHU-TW", system_type: "AHU", criticality: "STANDARD", contract_value_cents: 1000000, weight_units: 10 }
              as: CxAuthority
              as_user_id: "u-cxa-1"
              captures: { e1: $.data.id }
            - call: "POST /equipment-units/${e1}/install-status"
              payload: { install_status: "INSTALLED" }
              as: Contractor
              as_user_id: "u-contractor-1"
