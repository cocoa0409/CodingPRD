      - name: survey_revision_loop_bounded_by_max_survey_revisions
        claim_type: cyclic_loop_termination
        grounds:
          - state_machines.VenueSurvey[CHANGES_REQUESTED -> DRAFT]
          - validations[priority=32]
          - errors[ERR_SURVEY_REVISION_LIMIT]
        distinguishing_aspect: |
          Three REQUEST_CHANGES rounds drive revision to 4; submit must then be refused with
          ERR_SURVEY_REVISION_LIMIT (rejected once revision > 3, so revision 3 still submits). The
          camera plot stays legal throughout (4 x 150 ft = 8.12 dB, 80 A), which is what makes the
          revision counter the only possible cause of the refusal.
