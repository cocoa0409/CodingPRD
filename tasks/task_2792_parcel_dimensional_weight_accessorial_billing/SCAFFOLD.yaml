scenario: |
  2792. Parcel Dimensional Weight & Accessorial Billing (parcel carrier revenue recovery): package dimension and weight capture through automated scanning with tolerance thresholds, billable weight calculation comparing actual and dimensional weight by divisor, accessorial assessment for residential, delivery area, oversize, additional handling and address correction, post-shipment billing adjustments with shipper dispute and evidence review, contract rate application, tier discounts and minimum charge floors, peak and demand surcharge application windows, undeliverable package return charges and refusal handling, audit and refund claims for late deliveries under service guarantees

domain_name: parcel-dimensional-weight-accessorial-billing
api_prefix: "/"

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - dual_variant_calculation
    - rate_threshold_triggers
    - cascading_side_effects
    - optimistic_concurrency
  entity_topology: flat
  # Peer entities linked by foreign keys; every child is discoverable through a
  # filtered list (`GET /<children>?<fk>=`) or a parent sub-resource collection.
  state_machine_shape: parallel
  # Shipment carries three independent status axes (measurement / movement /
  # billing); Dispute is cyclic; Invoice and GuaranteeClaim branch.
  relationship_patterns:
    - one_to_many          # ShipperAccount -> Shipment/Invoice/RateContract
    - self_referential     # RateContract.supersedes_contract_id -> RateContract.id
    - cross_aggregate      # BillingAdjustment links InvoiceLine, Dispute and GuaranteeClaim
    - polymorphic          # BillingAdjustment.reason discriminates its originating workflow
  role_model: segregation_of_duties
  # The opaque operator who proposes a BillingAdjustment may never be the
  # operator who applies it (X-User-ID comparison).
  consistency_model: immediate
  difficulty_level: expert_plus

entities:
  - name: ShipperAccount
    parent: null
    common_fields: true
    fields:
      - name: account_number
        type: string
        source: input
        description: "Carrier-assigned shipper account number"
        constraints: "unique across ShipperAccount; 4-32 chars"
      - name: name
        type: string
        source: input
        description: "Legal name of the shipper"
      - name: billing_email
        type: string
        source: input
        description: "Invoice delivery mailbox"
        default: null
      - name: status
        type: enum
        source: system
        description: "Account posture gating shipment intake"
        default: ACTIVE
        constraints: "one of {ACTIVE, SUSPENDED}"
      - name: total_shipment_count
        type: integer
        source: computed
        description: "Count of Shipment rows whose shipper_id is this account (all billing_status values)"
        default: 0
      - name: unbilled_shipment_count
        type: integer
        source: computed
        description: "Count of this account's Shipment rows with billing_status == UNBILLED"
        default: 0
      - name: billed_shipment_count
        type: integer
        source: computed
        description: "Count of this account's Shipment rows with billing_status IN {BILLED, ADJUSTED}"
        default: 0
      - name: credit_balance_cents
        type: integer
        source: computed
        description: "Negated sum of delta_cents over every BillingAdjustment with status == APPLIED that hangs off an InvoiceLine of one of this account's Invoices whose status != VOID. Credits (negative deltas) raise it; debits lower it; may be negative."
        default: 0
      - name: open_charges_cents
        type: integer
        source: computed
        description: "Sum of net_amount_cents over this account's Invoices with status IN {ISSUED, ADJUSTED}"
        default: 0

  - name: RateContract
    parent: null
    common_fields: true
    fields:
      - name: shipper_id
        type: string
        source: input
        description: "FK -> ShipperAccount.id; the account this contract prices"
      - name: supersedes_contract_id
        type: string
        source: input
        description: "FK -> RateContract.id; self-referential pointer to the contract this one replaces on activation, null for a first contract"
        default: null
      - name: effective_from
        type: string
        source: input
        description: "First calendar date (YYYY-MM-DD, UTC) the contract prices, inclusive"
      - name: effective_to
        type: string
        source: input
        description: "Last calendar date (YYYY-MM-DD, UTC) the contract prices, inclusive"
        constraints: "effective_to >= effective_from"
      - name: dim_divisor
        type: integer
        source: input
        description: "Cubic-inch divisor used to convert package cube into dimensional pounds"
        constraints: "integer in [100, 250]"
      - name: min_charge_cents
        type: integer
        source: input
        description: "Per-package transportation floor in cents, applied before surcharges"
        constraints: ">= 0"
      - name: rate_table
        type: array
        source: input
        description: "Array of {zone: integer, min_lbs: integer, max_lbs: integer, cents_per_lb: integer} rows; rows for one zone must tile [1, 9999] without gaps or overlaps"
      - name: tier_discount_table
        type: array
        source: input
        description: "Array of {min_transportation_subtotal_cents: integer, discount_bps: integer} rows sorted ascending by min_transportation_subtotal_cents; row values are unique"
      - name: accessorial_rate_overrides
        type: object
        source: input
        description: "Map of accessorial code -> cents overriding the carrier default rate in calculations.accessorial_assessment.constants"
        default: {}
      - name: residential_waived
        type: boolean
        source: input
        description: "When true the RESIDENTIAL accessorial is never auto-assessed for this shipper"
        default: false
      - name: status
        type: enum
        source: system
        description: "Contract lifecycle state"
        default: DRAFT
        constraints: "one of {DRAFT, ACTIVE, SUPERSEDED}"
      - name: activated_at
        type: datetime
        source: system
        description: "Logical-clock instant the contract moved DRAFT -> ACTIVE"
        default: null

  - name: ServiceLevel
    parent: null
    common_fields: false
    fields:
      - name: code
        type: string
        source: input
        description: "Service code, e.g. GROUND or EXPRESS_2DAY"
        constraints: "unique across ServiceLevel; uppercase snake"
      - name: name
        type: string
        source: input
        description: "Human-readable service name"
      - name: guarantee_hours
        type: integer
        source: input
        description: "Transit hours added to Shipment.picked_up_at to obtain the service commitment instant"
        constraints: "integer in [1, 336]"
      - name: guaranteed
        type: boolean
        source: input
        description: "When false the service carries no money-back commitment and no GuaranteeClaim may be filed"

  - name: SurchargeWindow
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: "Operator-facing window code"
        constraints: "unique across SurchargeWindow"
      - name: kind
        type: enum
        source: input
        description: "Surcharge family"
        constraints: "one of {PEAK_SEASON, DEMAND}"
      - name: service_level_id
        type: string
        source: input
        description: "FK -> ServiceLevel.id; null means the window applies to every service level"
        default: null
      - name: start_date
        type: string
        source: input
        description: "First calendar date (YYYY-MM-DD, UTC) inside the window, inclusive"
      - name: end_date
        type: string
        source: input
        description: "Calendar date (YYYY-MM-DD, UTC) the window stops applying, EXCLUSIVE"
        constraints: "end_date > start_date"
      - name: per_package_cents
        type: integer
        source: input
        description: "Flat per-package surcharge added on top of the floored transportation charge"
        constraints: ">= 0"
      - name: oversize_add_cents
        type: integer
        source: input
        description: "Extra surcharge added only when the shipment carries an ASSESSED OVERSIZE accessorial"
        default: 0
      - name: status
        type: enum
        source: system
        description: "Window lifecycle state; only ACTIVE windows enter pricing"
        default: SCHEDULED
        constraints: "one of {SCHEDULED, ACTIVE, CANCELLED}"

  - name: Shipment
    parent: null
    common_fields: true
    fields:
      - name: shipper_id
        type: string
        source: input
        description: "FK -> ShipperAccount.id; owning shipper"
      - name: service_level_id
        type: string
        source: input
        description: "FK -> ServiceLevel.id; purchased service"
      - name: contract_id
        type: string
        source: computed
        description: "FK -> RateContract.id; resolved once at creation by the contract selector in calculations.contract_selection and frozen thereafter"
      - name: tracking_number
        type: string
        source: input
        description: "Carrier tracking number"
        constraints: "unique across Shipment; 8-32 chars"
      - name: zone
        type: integer
        source: input
        description: "Rated distance zone used to pick a rate_table row"
        constraints: "integer in [2, 8]"
      - name: delivery_area_class
        type: enum
        source: input
        description: "Delivery-area classification of the destination"
        default: NONE
        constraints: "one of {NONE, DAS, EXTENDED}"
      - name: residential_declared
        type: boolean
        source: input
        description: "Shipper's declaration that the destination is a residence"
      - name: non_conveyable_declared
        type: boolean
        source: input
        description: "Shipper's declaration that the package cannot ride the automated sort belt"
        default: false
      - name: declared_length_in
        type: number
        source: input
        description: "Shipper-declared longest dimension in inches"
        constraints: "> 0, <= 200, at most 1 decimal place"
      - name: declared_width_in
        type: number
        source: input
        description: "Shipper-declared width in inches"
        constraints: "> 0, <= 200, at most 1 decimal place"
      - name: declared_height_in
        type: number
        source: input
        description: "Shipper-declared height in inches"
        constraints: "> 0, <= 200, at most 1 decimal place"
      - name: declared_weight_lbs
        type: number
        source: input
        description: "Shipper-declared scale weight in pounds"
        constraints: "> 0, <= 500, at most 1 decimal place"
      - name: picked_up_at
        type: datetime
        source: system
        description: "Logical-clock instant the shipment record was created; origin of the guarantee commitment"
      - name: pickup_date
        type: string
        source: system
        description: "Calendar date (YYYY-MM-DD, UTC) of picked_up_at; the date tested against contract and surcharge windows"
      - name: divisor_used
        type: integer
        source: computed
        description: "RateContract.dim_divisor copied from contract_id at creation"
      - name: declared_cube_in3
        type: integer
        source: computed
        description: "Cube from the declared dimensions, each rounded half-up to a whole inch before multiplying"
      - name: preliminary_dim_weight_lbs
        type: integer
        source: computed
        description: "Dimensional pounds from declared_cube_in3, PRELIMINARY variant of calculations.billable_weight"
      - name: preliminary_billable_weight_lbs
        type: integer
        source: computed
        description: "Billable pounds from the declared measurements, PRELIMINARY variant of calculations.billable_weight"
      - name: preliminary_basis
        type: enum
        source: computed
        description: "Which term won the PRELIMINARY billable-weight comparison"
        constraints: "one of {ACTUAL, DIMENSIONAL, OVERSIZE_FLOOR}"
      - name: scanned_cube_in3
        type: integer
        source: computed
        description: "Cube from the governing DimensionScan, null until the first scan"
        default: null
      - name: final_dim_weight_lbs
        type: integer
        source: computed
        description: "Dimensional pounds from scanned_cube_in3, null until the first scan"
        default: null
      - name: final_billable_weight_lbs
        type: integer
        source: computed
        description: "Billable pounds from the governing scan, FINAL variant of calculations.billable_weight, null until the first scan"
        default: null
      - name: final_basis
        type: enum
        source: computed
        description: "Which term won the FINAL billable-weight comparison, null until the first scan"
        default: null
        constraints: "one of {ACTUAL, DIMENSIONAL, OVERSIZE_FLOOR}"
      - name: billable_weight_lbs
        type: integer
        source: computed
        description: "final_billable_weight_lbs when a governing scan exists, otherwise preliminary_billable_weight_lbs; this is the pound count that prices the shipment"
      - name: dim_variance_pct
        type: number
        source: computed
        description: "Cube variance of the governing scan against declared_cube_in3 in percent, 2 decimals, null until the first scan"
        default: null
      - name: weight_variance_lbs
        type: number
        source: computed
        description: "Absolute scale-weight variance of the governing scan against declared_weight_lbs, 1 decimal, null until the first scan"
        default: null
      - name: oversize_flag
        type: boolean
        source: computed
        description: "True when the governing measurements trip the OVERSIZE geometry test"
        default: false
      - name: additional_handling_flag
        type: boolean
        source: computed
        description: "True when the governing measurements trip the ADDITIONAL_HANDLING test and OVERSIZE did not"
        default: false
      - name: measurement_status
        type: enum
        source: system
        description: "Measurement-capture axis"
        default: PENDING_SCAN
        constraints: "one of {PENDING_SCAN, SCANNED, TOLERANCE_FLAGGED, VERIFIED}"
      - name: movement_status
        type: enum
        source: system
        description: "Physical-movement axis"
        default: IN_TRANSIT
        constraints: "one of {IN_TRANSIT, DELIVERED, UNDELIVERABLE, REFUSED}"
      - name: billing_status
        type: enum
        source: system
        description: "Revenue axis"
        default: UNBILLED
        constraints: "one of {UNBILLED, BILLED, ADJUSTED}"
      - name: delivered_at
        type: datetime
        source: system
        description: "Logical-clock instant of the delivery scan, null until delivered"
        default: null
      - name: guarantee_deadline_utc
        type: datetime
        source: computed
        description: "picked_up_at plus ServiceLevel.guarantee_hours; null when the purchased service has guaranteed == false"
        default: null
      - name: accessorial_total_cents
        type: integer
        source: computed
        description: "Sum of amount_cents over this shipment's AccessorialCharge rows with status == ASSESSED"
        default: 0

  - name: DimensionScan
    parent: null
    common_fields: false
    fields:
      - name: shipment_id
        type: string
        source: input
        description: "FK -> Shipment.id; the scanned parcel"
      - name: scan_source
        type: enum
        source: input
        description: "Capture channel; AUTOMATED_DWS is the belt scanner, MANUAL_REWEIGH is a human recapture used for dispute review"
        constraints: "one of {AUTOMATED_DWS, MANUAL_REWEIGH}"
      - name: scanned_length_in
        type: number
        source: input
        description: "Captured longest dimension in inches"
        constraints: "> 0, <= 200, at most 1 decimal place"
      - name: scanned_width_in
        type: number
        source: input
        description: "Captured width in inches"
        constraints: "> 0, <= 200, at most 1 decimal place"
      - name: scanned_height_in
        type: number
        source: input
        description: "Captured height in inches"
        constraints: "> 0, <= 200, at most 1 decimal place"
      - name: scanned_weight_lbs
        type: number
        source: input
        description: "Captured scale weight in pounds"
        constraints: "> 0, <= 500, at most 1 decimal place"
      - name: non_conveyable_observed
        type: boolean
        source: input
        description: "Belt operator's observation that the package is non-conveyable"
        default: false
      - name: scanned_cube_in3
        type: integer
        source: computed
        description: "Cube from the scanned dimensions, each rounded half-up to a whole inch before multiplying"
      - name: dim_variance_pct
        type: number
        source: computed
        description: "(scanned_cube_in3 - Shipment.declared_cube_in3) absolute value over Shipment.declared_cube_in3, in percent, 2 decimals"
      - name: weight_variance_lbs
        type: number
        source: computed
        description: "Absolute difference between scanned_weight_lbs and Shipment.declared_weight_lbs, 1 decimal"
      - name: tolerance_status
        type: enum
        source: computed
        description: "Outcome of calculations.scan_tolerance_evaluation for this scan"
        constraints: "one of {WITHIN_TOLERANCE, EXCEEDS_TOLERANCE}"
      - name: captured_at
        type: datetime
        source: system
        description: "Logical-clock instant the scan was recorded"

  - name: AccessorialCharge
    parent: null
    common_fields: true
    fields:
      - name: shipment_id
        type: string
        source: input
        description: "FK -> Shipment.id; the charged parcel"
      - name: code
        type: enum
        source: input
        description: "Accessorial family"
        constraints: "one of {RESIDENTIAL, DELIVERY_AREA, OVERSIZE, ADDITIONAL_HANDLING, ADDRESS_CORRECTION, RETURN_UNDELIVERABLE, REFUSAL}"
      - name: amount_cents
        type: integer
        source: computed
        description: "Charge amount: the request's amount_cents when supplied on a MANUAL charge, otherwise RateContract.accessorial_rate_overrides[code] when present, otherwise the carrier default in calculations.accessorial_assessment.constants"
        constraints: ">= 0"
      - name: source
        type: enum
        source: system
        description: "AUTO for charges the pricing engine assessed, MANUAL for operator-entered charges"
        constraints: "one of {AUTO, MANUAL}"
      - name: status
        type: enum
        source: system
        description: "Charge lifecycle state; only ASSESSED rows enter line totals"
        default: ASSESSED
        constraints: "one of {ASSESSED, WAIVED, REVERSED}"
      - name: reason
        type: string
        source: input
        description: "Free-text justification recorded for MANUAL charges, waivers and reversals"
        default: null
      - name: assessed_basis
        type: string
        source: computed
        description: "Machine-readable trigger note, e.g. 'longest_in=100>96' for OVERSIZE or 'residential_declared=true' for RESIDENTIAL"

  - name: Invoice
    parent: null
    common_fields: true
    fields:
      - name: shipper_id
        type: string
        source: input
        description: "FK -> ShipperAccount.id; billed account"
      - name: period_start
        type: string
        source: input
        description: "First pickup_date (YYYY-MM-DD, UTC) swept into this invoice, inclusive"
      - name: period_end
        type: string
        source: input
        description: "Last pickup_date (YYYY-MM-DD, UTC) swept into this invoice, inclusive"
        constraints: "period_end >= period_start"
      - name: status
        type: enum
        source: system
        description: "Invoice lifecycle state"
        default: OPEN
        constraints: "one of {OPEN, ISSUED, ADJUSTED, SETTLED, VOID}"
      - name: line_count
        type: integer
        source: computed
        description: "Count of InvoiceLine rows whose invoice_id is this invoice"
      - name: transportation_subtotal_cents
        type: integer
        source: computed
        description: "Sum over this invoice's InvoiceLines of (transportation_base_cents + surcharge_cents); recomputed on every change while status == OPEN, frozen once status leaves OPEN"
      - name: accessorial_subtotal_cents
        type: integer
        source: computed
        description: "Sum over this invoice's InvoiceLines of accessorial_total_cents; recomputed while OPEN, frozen once status leaves OPEN"
      - name: gross_charges_cents
        type: integer
        source: computed
        description: "Sum over this invoice's InvoiceLines of base_line_total_cents; recomputed while OPEN, frozen once status leaves OPEN"
      - name: tier_discount_bps
        type: integer
        source: computed
        description: "discount_bps of the tier row selected by calculations.invoice_totals from transportation_subtotal_cents; frozen once status leaves OPEN"
      - name: tier_discount_cents
        type: integer
        source: computed
        description: "Tier discount in cents from calculations.invoice_totals; frozen once status leaves OPEN"
      - name: adjustment_total_cents
        type: integer
        source: computed
        description: "Sum of delta_cents over every BillingAdjustment with status == APPLIED hanging off this invoice's lines"
        default: 0
      - name: net_amount_cents
        type: integer
        source: computed
        description: "gross_charges_cents - tier_discount_cents + adjustment_total_cents"
      - name: pending_adjustment_count
        type: integer
        source: computed
        description: "Count of BillingAdjustment rows with status == PROPOSED hanging off this invoice's lines"
        default: 0
      - name: has_pending_adjustments
        type: boolean
        source: computed
        description: "pending_adjustment_count > 0"
        default: false
      - name: issued_at
        type: datetime
        source: system
        description: "Logical-clock instant the invoice moved OPEN -> ISSUED, null while OPEN"
        default: null
      - name: dispute_deadline_utc
        type: datetime
        source: computed
        description: "issued_at plus DISPUTE_WINDOW_DAYS; null while OPEN"
        default: null
      - name: payment_reference
        type: string
        source: input
        description: "Remittance reference captured at settlement"
        default: null

  - name: InvoiceLine
    parent: null
    common_fields: true
    fields:
      - name: invoice_id
        type: string
        source: computed
        description: "FK -> Invoice.id; owning invoice"
      - name: shipment_id
        type: string
        source: computed
        description: "FK -> Shipment.id; the billed parcel; unique among lines of non-VOID invoices"
      - name: billable_weight_lbs
        type: integer
        source: computed
        description: "Shipment.billable_weight_lbs frozen at line creation"
      - name: billable_weight_basis
        type: enum
        source: computed
        description: "Shipment basis (final_basis when a scan governs, else preliminary_basis) frozen at line creation"
        constraints: "one of {ACTUAL, DIMENSIONAL, OVERSIZE_FLOOR}"
      - name: rate_cents_per_lb
        type: integer
        source: computed
        description: "cents_per_lb of the rate_table row selected by calculations.transportation_charge"
      - name: transportation_base_cents
        type: integer
        source: computed
        description: "Floored transportation charge before surcharges, per calculations.transportation_charge"
      - name: surcharge_cents
        type: integer
        source: computed
        description: "Sum of peak and demand surcharges applied to this line, per calculations.transportation_charge"
      - name: accessorial_total_cents
        type: integer
        source: computed
        description: "Sum of amount_cents over the shipment's AccessorialCharge rows with status == ASSESSED at line-computation time"
      - name: base_line_total_cents
        type: integer
        source: computed
        description: "transportation_base_cents + surcharge_cents + accessorial_total_cents; recomputed while the invoice is OPEN, frozen once it leaves OPEN"
      - name: adjustment_total_cents
        type: integer
        source: computed
        description: "Sum of delta_cents over this line's BillingAdjustment rows with status == APPLIED"
        default: 0
      - name: line_total_cents
        type: integer
        source: computed
        description: "base_line_total_cents + adjustment_total_cents"
      - name: voided
        type: boolean
        source: computed
        description: "True once the owning invoice moved to VOID"
        default: false

  - name: BillingAdjustment
    parent: null
    common_fields: true
    fields:
      - name: invoice_line_id
        type: string
        source: input
        description: "FK -> InvoiceLine.id; the line this adjustment moves"
      - name: dispute_id
        type: string
        source: computed
        description: "FK -> Dispute.id; set only on adjustments the dispute engine created, else null"
        default: null
      - name: guarantee_claim_id
        type: string
        source: computed
        description: "FK -> GuaranteeClaim.id; set only on adjustments the guarantee engine created, else null"
        default: null
      - name: reason
        type: enum
        source: input
        description: "Origin of the adjustment"
        constraints: "one of {WEIGHT_CORRECTION, ACCESSORIAL_CORRECTION, DISPUTE_CREDIT, GUARANTEE_REFUND, MANUAL}"
      - name: delta_cents
        type: integer
        source: input
        description: "Signed money movement on the line; negative is a credit to the shipper, positive is a rebill"
        constraints: "!= 0"
      - name: status
        type: enum
        source: system
        description: "Adjustment lifecycle state"
        default: PROPOSED
        constraints: "one of {PROPOSED, APPLIED, REJECTED}"
      - name: created_by_user_id
        type: string
        source: system
        description: "X-User-ID of the operator who proposed the adjustment, or the literal 'system' for engine-created adjustments"
      - name: applied_by_user_id
        type: string
        source: system
        description: "X-User-ID of the operator who applied the adjustment, null while PROPOSED or REJECTED"
        default: null
      - name: note
        type: string
        source: input
        description: "Free-text justification"
        default: null
      - name: applied_at
        type: datetime
        source: system
        description: "Logical-clock instant the adjustment moved PROPOSED -> APPLIED"
        default: null

  - name: Dispute
    parent: null
    common_fields: true
    fields:
      - name: invoice_line_id
        type: string
        source: input
        description: "FK -> InvoiceLine.id; the disputed line"
      - name: shipper_user_id
        type: string
        source: system
        description: "X-User-ID of the ShipperUser who filed; equals the owning ShipperAccount.id"
      - name: claim_type
        type: enum
        source: input
        description: "Selects the credit-valuation variant in calculations.dispute_credit"
        constraints: "one of {WEIGHT, ACCESSORIAL}"
      - name: disputed_codes
        type: array
        source: input
        description: "Accessorial codes contested when claim_type == ACCESSORIAL; must be empty or absent when claim_type == WEIGHT"
        default: []
      - name: claimed_reason
        type: string
        source: input
        description: "Shipper's narrative"
      - name: status
        type: enum
        source: system
        description: "Dispute lifecycle state"
        default: SUBMITTED
        constraints: "one of {SUBMITTED, UNDER_REVIEW, EVIDENCE_REQUESTED, UPHELD, DENIED}"
      - name: round_count
        type: integer
        source: computed
        description: "Number of completed evidence requests; incremented on every EVIDENCE_REQUESTED entry"
        default: 0
      - name: required_item_type
        type: enum
        source: system
        description: "Evidence type the reviewer is waiting for; cleared to null once an accepted item arrives"
        default: null
        constraints: "one of {SCAN_IMAGE, DELIVERY_PHOTO, ADDRESS_PROOF, SCALE_CERT}"
      - name: accepted_evidence_count
        type: integer
        source: computed
        description: "Count of this dispute's EvidenceItem rows with accepted == true"
        default: 0
      - name: granted_credit_cents
        type: integer
        source: computed
        description: "Credit computed by calculations.dispute_credit at resolution; 0 while unresolved and on DENIED"
        default: 0
      - name: resolved_at
        type: datetime
        source: system
        description: "Logical-clock instant the dispute reached UPHELD or DENIED"
        default: null

  - name: EvidenceItem
    parent: null
    common_fields: false
    fields:
      - name: dispute_id
        type: string
        source: input
        description: "FK -> Dispute.id; the dispute this evidence supports"
      - name: item_type
        type: enum
        source: input
        description: "Evidence family"
        constraints: "one of {SCAN_IMAGE, DELIVERY_PHOTO, ADDRESS_PROOF, SCALE_CERT}"
      - name: reference
        type: string
        source: input
        description: "Opaque locator of the stored artifact"
      - name: submitted_by_user_id
        type: string
        source: system
        description: "X-User-ID of the submitter"
      - name: accepted
        type: boolean
        source: computed
        description: "True when Dispute.required_item_type is null at submission time, or when item_type equals Dispute.required_item_type"

  - name: GuaranteeClaim
    parent: null
    common_fields: true
    fields:
      - name: shipment_id
        type: string
        source: input
        description: "FK -> Shipment.id; the late parcel"
      - name: invoice_line_id
        type: string
        source: computed
        description: "FK -> InvoiceLine.id; the line the refund credits, resolved at filing"
      - name: claimed_reason
        type: string
        source: input
        description: "Filer's narrative"
        default: null
      - name: guarantee_deadline_utc
        type: datetime
        source: computed
        description: "Shipment.guarantee_deadline_utc frozen at filing"
      - name: delivered_at
        type: datetime
        source: computed
        description: "Shipment.delivered_at frozen at filing"
      - name: late_by_seconds
        type: integer
        source: computed
        description: "delivered_at minus guarantee_deadline_utc in whole seconds; strictly positive for a fileable claim"
      - name: candidate_refund_cents
        type: integer
        source: computed
        description: "Refund from calculations.guarantee_refund evaluated at filing"
      - name: refund_cents
        type: integer
        source: computed
        description: "Refund actually credited; equals candidate_refund_cents once the refund adjustment is APPLIED, 0 on DENIED"
        default: 0
      - name: status
        type: enum
        source: system
        description: "Claim lifecycle state"
        default: FILED
        constraints: "one of {FILED, APPROVED, DENIED, REFUNDED}"
      - name: filed_by_user_id
        type: string
        source: system
        description: "X-User-ID of the filer, or the literal 'system' for claims the audit sweep filed"
      - name: adjudicated_at
        type: datetime
        source: system
        description: "Logical-clock instant the claim left FILED"
        default: null

state_machines:
  - entity: ShipperAccount
    dimension: status
    initial_state: ACTIVE
    terminal_states: [SUSPENDED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /shipper-accounts/{id}/suspend"
        actor: CarrierAdmin
        preconditions: ["ShipperAccount.status == ACTIVE"]
        side_effects:
          - "increments ShipperAccount.version by 1"
          - "no shipment, invoice, dispute or claim rows are touched; only new POST /shipments intake is blocked (ERR_SHIPPER_SUSPENDED)"
        note: "Suspension is terminal in this scaffold; reinstatement is out of scope."

  - entity: RateContract
    dimension: status
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /rate-contracts/{id}/activate"
        actor: CarrierAdmin
        preconditions:
          - "RateContract.status == DRAFT"
          - "expected_shipper_account_version equals the current ShipperAccount.version of RateContract.shipper_id"
          - "when supersedes_contract_id is not null, that contract exists, belongs to the same shipper_id and has status == ACTIVE"
        side_effects:
          - "sets RateContract.activated_at to the logical clock and status to ACTIVE"
          - "when supersedes_contract_id is not null: that contract's status becomes SUPERSEDED and its effective_to is truncated to the day before this contract's effective_from (cascade hop 1)"
          - "because the superseded contract's effective_to moved, ShipperAccount.version increments by 1 so any client holding a stale contract view is rejected on its next activation (cascade hop 2)"
          - "increments RateContract.version by 1 on both the activated and the superseded contract"
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system: cascade from activation of a contract whose supersedes_contract_id points here"
        actor: system
        preconditions: ["RateContract.status == ACTIVE"]
        side_effects:
          - "effective_to truncated to (successor.effective_from - 1 day)"
          - "increments RateContract.version by 1"
        note: "Already-issued Shipment rows keep the contract_id frozen at their creation; truncation never reprices historical shipments."

  - entity: SurchargeWindow
    dimension: status
    initial_state: SCHEDULED
    terminal_states: [CANCELLED]
    transitions:
      - from: SCHEDULED
        to: ACTIVE
        trigger: "POST /surcharge-windows/{id}/activate"
        actor: CarrierAdmin
        preconditions: ["SurchargeWindow.status == SCHEDULED"]
        side_effects:
          - "window enters the calculations.transportation_charge surcharge candidate set"
          - "increments SurchargeWindow.version by 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /surcharge-windows/{id}/cancel"
        actor: CarrierAdmin
        preconditions: ["SurchargeWindow.status == SCHEDULED"]
        side_effects: ["increments SurchargeWindow.version by 1"]
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /surcharge-windows/{id}/cancel"
        actor: CarrierAdmin
        preconditions: ["SurchargeWindow.status == ACTIVE"]
        side_effects:
          - "window leaves the surcharge candidate set for every future pricing evaluation"
          - "already-computed InvoiceLine.surcharge_cents values are NOT recomputed; cancellation is forward-only"
          - "increments SurchargeWindow.version by 1"

  - entity: Shipment
    dimension: measurement_status
    initial_state: PENDING_SCAN
    terminal_states: [VERIFIED]
    transitions:
      - from: PENDING_SCAN
        to: SCANNED
        trigger: "POST /shipments/{id}/scans with scan_source == AUTOMATED_DWS and the scan's tolerance_status == WITHIN_TOLERANCE"
        actor: CarrierOps
        preconditions:
          - "Shipment.measurement_status != VERIFIED"
          - "expected_shipment_version equals the current Shipment.version"
        side_effects:
          - "the new scan becomes the governing scan; scanned_cube_in3, final_dim_weight_lbs, final_billable_weight_lbs, final_basis, billable_weight_lbs, dim_variance_pct, weight_variance_lbs, oversize_flag, additional_handling_flag are recomputed from it"
          - "auto accessorial re-evaluation per calculations.accessorial_assessment (may create AUTO charges or move stale AUTO charges to REVERSED)"
          - "downstream billing reconciliation per calculations.billing_reconciliation_branch"
          - "increments Shipment.version by 1"
      - from: PENDING_SCAN
        to: TOLERANCE_FLAGGED
        trigger: "POST /shipments/{id}/scans with scan_source == AUTOMATED_DWS and the scan's tolerance_status == EXCEEDS_TOLERANCE"
        actor: CarrierOps
        preconditions:
          - "Shipment.measurement_status != VERIFIED"
          - "expected_shipment_version equals the current Shipment.version"
        side_effects:
          - "same recomputation and accessorial re-evaluation as the WITHIN_TOLERANCE branch"
          - "downstream billing reconciliation per calculations.billing_reconciliation_branch"
          - "the shipment is excluded from POST /invoices sweeps while TOLERANCE_FLAGGED (ERR_SCAN_TOLERANCE_UNRESOLVED when named directly)"
          - "increments Shipment.version by 1"
      - from: SCANNED
        to: TOLERANCE_FLAGGED
        trigger: "POST /shipments/{id}/scans with scan_source == AUTOMATED_DWS and the scan's tolerance_status == EXCEEDS_TOLERANCE"
        actor: CarrierOps
        preconditions: ["Shipment.measurement_status == SCANNED", "expected_shipment_version equals the current Shipment.version"]
        side_effects: ["same as the PENDING_SCAN -> TOLERANCE_FLAGGED branch"]
      - from: TOLERANCE_FLAGGED
        to: SCANNED
        trigger: "POST /shipments/{id}/scans with scan_source == AUTOMATED_DWS and the scan's tolerance_status == WITHIN_TOLERANCE"
        actor: CarrierOps
        preconditions: ["Shipment.measurement_status == TOLERANCE_FLAGGED", "expected_shipment_version equals the current Shipment.version"]
        side_effects: ["same as the PENDING_SCAN -> SCANNED branch"]
        note: "Cycle: a re-scan that lands back inside tolerance clears the flag and makes the shipment invoiceable again."
      - from: PENDING_SCAN
        to: VERIFIED
        trigger: "POST /shipments/{id}/scans with scan_source == MANUAL_REWEIGH"
        actor: CarrierOps
        preconditions: ["Shipment.measurement_status != VERIFIED", "expected_shipment_version equals the current Shipment.version"]
        side_effects:
          - "the reweigh becomes the governing scan and all FINAL measurement fields are recomputed from it"
          - "auto accessorial re-evaluation per calculations.accessorial_assessment"
          - "NO BillingAdjustment is ever auto-created by a MANUAL_REWEIGH; the reweigh exists to feed dispute review (see calculations.billing_reconciliation_branch)"
          - "increments Shipment.version by 1"
      - from: SCANNED
        to: VERIFIED
        trigger: "POST /shipments/{id}/scans with scan_source == MANUAL_REWEIGH"
        actor: CarrierOps
        preconditions: ["Shipment.measurement_status == SCANNED", "expected_shipment_version equals the current Shipment.version"]
        side_effects: ["same as the PENDING_SCAN -> VERIFIED branch"]
      - from: TOLERANCE_FLAGGED
        to: VERIFIED
        trigger: "POST /shipments/{id}/scans with scan_source == MANUAL_REWEIGH"
        actor: CarrierOps
        preconditions: ["Shipment.measurement_status == TOLERANCE_FLAGGED", "expected_shipment_version equals the current Shipment.version"]
        side_effects:
          - "same as the PENDING_SCAN -> VERIFIED branch"
          - "the invoicing block lifts: a VERIFIED shipment is sweepable even though its governing scan exceeded tolerance"

  - entity: Shipment
    dimension: movement_status
    initial_state: IN_TRANSIT
    terminal_states: [DELIVERED, UNDELIVERABLE, REFUSED]
    transitions:
      - from: IN_TRANSIT
        to: DELIVERED
        trigger: "POST /shipments/{id}/deliver"
        actor: CarrierOps
        preconditions: ["Shipment.movement_status == IN_TRANSIT"]
        side_effects:
          - "stamps delivered_at from the logical clock"
          - "no charge is created and no accessorial is re-evaluated"
          - "increments Shipment.version by 1"
      - from: IN_TRANSIT
        to: UNDELIVERABLE
        trigger: "POST /shipments/{id}/exceptions with kind == UNDELIVERABLE"
        actor: CarrierOps
        preconditions: ["Shipment.movement_status == IN_TRANSIT"]
        side_effects:
          - "creates one AccessorialCharge (code RETURN_UNDELIVERABLE, source AUTO, status ASSESSED) covering the return leg"
          - "because that charge is ASSESSED, Shipment.accessorial_total_cents increases by its amount_cents"
          - "downstream billing reconciliation per calculations.billing_reconciliation_branch"
          - "increments Shipment.version by 1"
      - from: IN_TRANSIT
        to: REFUSED
        trigger: "POST /shipments/{id}/exceptions with kind == REFUSED"
        actor: CarrierOps
        preconditions: ["Shipment.movement_status == IN_TRANSIT"]
        side_effects:
          - "creates one AccessorialCharge (code REFUSAL, source AUTO, status ASSESSED), discoverable through GET /shipments/{id}/accessorials — the response body of the exception endpoint is the updated Shipment"
          - "because a refused parcel must travel back to the shipper, a SECOND AccessorialCharge (code RETURN_UNDELIVERABLE, source AUTO, status ASSESSED) is created in the same request and is discoverable only through GET /shipments/{id}/accessorials"
          - "because both charges are ASSESSED, Shipment.accessorial_total_cents increases by the sum of the two amounts"
          - "downstream billing reconciliation per calculations.billing_reconciliation_branch"
          - "increments Shipment.version by 1"
        note: "Branch divergence: UNDELIVERABLE creates one charge, REFUSED creates two; both converge on the same reconciliation branch logic."
      - from: IN_TRANSIT
        to: IN_TRANSIT
        trigger: "POST /shipments/{id}/exceptions with kind == ADDRESS_CORRECTED"
        actor: CarrierOps
        preconditions: ["Shipment.movement_status == IN_TRANSIT", "kind == ADDRESS_CORRECTED; no address payload is carried by this scaffold, only the optional reason string"]
        side_effects:
          - "creates one AccessorialCharge (code ADDRESS_CORRECTION, source AUTO, status ASSESSED)"
          - "movement_status is unchanged — the parcel keeps moving"
          - "downstream billing reconciliation per calculations.billing_reconciliation_branch"
          - "increments Shipment.version by 1"

  - entity: Shipment
    dimension: billing_status
    initial_state: UNBILLED
    terminal_states: []
    transitions:
      - from: UNBILLED
        to: BILLED
        trigger: "POST /invoices (the sweep creates an InvoiceLine for this shipment)"
        actor: BillingOps
        preconditions:
          - "Shipment.billing_status == UNBILLED"
          - "Shipment.measurement_status != TOLERANCE_FLAGGED"
          - "Shipment.pickup_date within [Invoice.period_start, Invoice.period_end] inclusive"
        side_effects:
          - "ShipperAccount.unbilled_shipment_count decrements by 1 and billed_shipment_count increments by 1"
          - "increments Shipment.version by 1"
      - from: BILLED
        to: ADJUSTED
        trigger: "POST /billing-adjustments/{id}/apply on an adjustment hanging off this shipment's line"
        actor: BillingOps
        preconditions: ["Shipment.billing_status == BILLED"]
        side_effects:
          - "ShipperAccount.billed_shipment_count is unchanged (ADJUSTED still counts as billed)"
          - "increments Shipment.version by 1"
      - from: BILLED
        to: UNBILLED
        trigger: "POST /invoices/{id}/void"
        actor: BillingOps
        preconditions: ["Shipment.billing_status == BILLED", "owning Invoice.status IN {OPEN, ISSUED}"]
        side_effects:
          - "ShipperAccount.unbilled_shipment_count increments by 1 and billed_shipment_count decrements by 1"
          - "the shipment becomes sweepable by a later POST /invoices"
          - "increments Shipment.version by 1"
        note: "Cycle: UNBILLED -> BILLED -> UNBILLED is the compensating pair that must leave the package-count invariant intact."
      - from: ADJUSTED
        to: UNBILLED
        trigger: "POST /invoices/{id}/void"
        actor: BillingOps
        preconditions: ["Shipment.billing_status == ADJUSTED", "owning Invoice.status IN {ISSUED, ADJUSTED}"]
        side_effects:
          - "every APPLIED BillingAdjustment on the voided lines is excluded from ShipperAccount.credit_balance_cents (the invoice is VOID)"
          - "ShipperAccount.unbilled_shipment_count increments by 1 and billed_shipment_count decrements by 1"
          - "increments Shipment.version by 1"

  - entity: Invoice
    dimension: status
    initial_state: OPEN
    terminal_states: [SETTLED, VOID]
    transitions:
      - from: OPEN
        to: ISSUED
        trigger: "POST /invoices/{id}/issue"
        actor: BillingOps
        preconditions:
          - "Invoice.status == OPEN"
          - "Invoice.line_count >= 1"
        side_effects:
          - "stamps issued_at from the logical clock and dispute_deadline_utc = issued_at + DISPUTE_WINDOW_DAYS"
          - "recomputes calculations.invoice_totals one final time, then freezes transportation_subtotal_cents, accessorial_subtotal_cents, gross_charges_cents, tier_discount_bps, tier_discount_cents and every line's base_line_total_cents"
          - "ShipperAccount.open_charges_cents increases by Invoice.net_amount_cents"
          - "increments Invoice.version by 1"
      - from: ISSUED
        to: ADJUSTED
        trigger: "POST /billing-adjustments/{id}/apply on a line of this invoice"
        actor: BillingOps
        preconditions: ["Invoice.status == ISSUED"]
        side_effects:
          - "adjustment_total_cents and net_amount_cents recomputed; gross_charges_cents and tier_discount_cents stay frozen"
          - "ShipperAccount.open_charges_cents and credit_balance_cents recomputed"
          - "increments Invoice.version by 1"
      - from: ADJUSTED
        to: ADJUSTED
        trigger: "POST /billing-adjustments/{id}/apply on a line of this invoice"
        actor: BillingOps
        preconditions: ["Invoice.status == ADJUSTED"]
        side_effects: ["same recomputation as ISSUED -> ADJUSTED; the invoice re-enters ADJUSTED (self-loop)"]
        note: "Cycle: any number of adjustments may land on an ADJUSTED invoice."
      - from: ISSUED
        to: SETTLED
        trigger: "POST /invoices/{id}/settle"
        actor: BillingOps
        preconditions: ["Invoice.status == ISSUED", "Invoice.pending_adjustment_count == 0"]
        side_effects:
          - "ShipperAccount.open_charges_cents decreases by Invoice.net_amount_cents"
          - "the invoice becomes un-adjustable and un-disputable"
          - "increments Invoice.version by 1"
      - from: ADJUSTED
        to: SETTLED
        trigger: "POST /invoices/{id}/settle"
        actor: BillingOps
        preconditions: ["Invoice.status == ADJUSTED", "Invoice.pending_adjustment_count == 0"]
        side_effects: ["same as ISSUED -> SETTLED"]
      - from: OPEN
        to: VOID
        trigger: "POST /invoices/{id}/void"
        actor: BillingOps
        preconditions: ["Invoice.status == OPEN"]
        side_effects:
          - "every InvoiceLine of this invoice sets voided = true (cascade hop 1)"
          - "because each line is voided, each referenced Shipment returns to billing_status UNBILLED (cascade hop 2)"
          - "because those shipments moved, ShipperAccount.unbilled_shipment_count and billed_shipment_count are recomputed (cascade hop 3)"
          - "increments Invoice.version by 1"
      - from: ISSUED
        to: VOID
        trigger: "POST /invoices/{id}/void"
        actor: BillingOps
        preconditions: ["Invoice.status == ISSUED"]
        side_effects:
          - "same three cascade hops as OPEN -> VOID"
          - "ShipperAccount.open_charges_cents decreases by Invoice.net_amount_cents"
          - "every PROPOSED BillingAdjustment on this invoice's lines moves to REJECTED (cascade hop 4)"
      - from: ADJUSTED
        to: VOID
        trigger: "POST /invoices/{id}/void"
        actor: BillingOps
        preconditions: ["Invoice.status == ADJUSTED"]
        side_effects:
          - "same cascade hops as ISSUED -> VOID"
          - "because the invoice is now VOID, every APPLIED adjustment on its lines drops out of ShipperAccount.credit_balance_cents (cascade hop 5)"

  - entity: BillingAdjustment
    dimension: status
    initial_state: PROPOSED
    terminal_states: [APPLIED, REJECTED]
    transitions:
      - from: PROPOSED
        to: APPLIED
        trigger: "POST /billing-adjustments/{id}/apply"
        actor: BillingOps
        preconditions:
          - "BillingAdjustment.status == PROPOSED"
          - "X-User-ID != BillingAdjustment.created_by_user_id (segregation of duties)"
          - "owning Invoice.status IN {ISSUED, ADJUSTED}"
        side_effects:
          - "stamps applied_by_user_id and applied_at; InvoiceLine.adjustment_total_cents and line_total_cents recomputed (cascade hop 1)"
          - "because the line moved, Invoice.adjustment_total_cents, net_amount_cents and status (-> ADJUSTED) are recomputed (cascade hop 2)"
          - "because the invoice moved, ShipperAccount.credit_balance_cents and open_charges_cents are recomputed (cascade hop 3)"
          - "because the line moved, the referenced Shipment.billing_status moves BILLED -> ADJUSTED (cascade hop 3b)"
          - "when guarantee_claim_id is not null, that GuaranteeClaim moves APPROVED -> REFUNDED and its refund_cents is set to -delta_cents (cascade hop 4)"
          - "Invoice.pending_adjustment_count decrements by 1"
          - "increments BillingAdjustment.version, InvoiceLine.version, Invoice.version and Shipment.version by 1 each"
      - from: PROPOSED
        to: REJECTED
        trigger: "POST /billing-adjustments/{id}/reject"
        actor: BillingOps
        preconditions: ["BillingAdjustment.status == PROPOSED"]
        side_effects:
          - "no money moves; Invoice.pending_adjustment_count decrements by 1"
          - "when guarantee_claim_id is not null, that GuaranteeClaim moves APPROVED -> DENIED and refund_cents stays 0"
          - "increments BillingAdjustment.version and Invoice.version by 1"
      - from: PROPOSED
        to: REJECTED
        trigger: "system: cascade from POST /invoices/{id}/void"
        actor: system
        preconditions: ["BillingAdjustment.status == PROPOSED", "owning Invoice.status moving to VOID"]
        side_effects: ["same as the operator-driven rejection"]

  - entity: Dispute
    dimension: status
    initial_state: SUBMITTED
    terminal_states: [UPHELD, DENIED]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /disputes/{id}/evidence"
        actor: ShipperUser
        preconditions: ["Dispute.status == SUBMITTED"]
        side_effects:
          - "creates an EvidenceItem whose accepted is computed from Dispute.required_item_type"
          - "when the new item is accepted, Dispute.required_item_type is cleared to null and accepted_evidence_count increments by 1"
          - "increments Dispute.version by 1"
      - from: UNDER_REVIEW
        to: EVIDENCE_REQUESTED
        trigger: "POST /disputes/{id}/request-evidence"
        actor: RevenueAuditor
        preconditions:
          - "Dispute.status == UNDER_REVIEW"
          - "Dispute.round_count < MAX_EVIDENCE_ROUNDS"
        side_effects:
          - "sets required_item_type to the requested type and increments round_count by 1"
          - "increments Dispute.version by 1"
      - from: SUBMITTED
        to: EVIDENCE_REQUESTED
        trigger: "POST /disputes/{id}/request-evidence"
        actor: RevenueAuditor
        preconditions: ["Dispute.status == SUBMITTED", "Dispute.round_count < MAX_EVIDENCE_ROUNDS"]
        side_effects: ["same as UNDER_REVIEW -> EVIDENCE_REQUESTED"]
      - from: EVIDENCE_REQUESTED
        to: UNDER_REVIEW
        trigger: "POST /disputes/{id}/evidence"
        actor: ShipperUser
        preconditions: ["Dispute.status == EVIDENCE_REQUESTED"]
        side_effects: ["same as SUBMITTED -> UNDER_REVIEW"]
        note: "Cycle: UNDER_REVIEW -> EVIDENCE_REQUESTED -> UNDER_REVIEW may repeat until round_count reaches MAX_EVIDENCE_ROUNDS."
      - from: UNDER_REVIEW
        to: UPHELD
        trigger: "POST /disputes/{id}/resolve with outcome == UPHELD"
        actor: RevenueAuditor
        preconditions:
          - "Dispute.status == UNDER_REVIEW"
          - "Dispute.accepted_evidence_count >= 1"
          - "owning Invoice.status IN {ISSUED, ADJUSTED}"
        side_effects:
          - "granted_credit_cents computed by calculations.dispute_credit under the variant selected by claim_type (cascade hop 1)"
          - "when granted_credit_cents > 0, a BillingAdjustment (reason DISPUTE_CREDIT, delta_cents = -granted_credit_cents, created_by_user_id 'system') is created ALREADY APPLIED, bypassing the segregation-of-duties gate (cascade hop 2)"
          - "because that adjustment is APPLIED, the line and invoice recompute and Invoice.status moves to ADJUSTED (cascade hop 3)"
          - "because the invoice moved, ShipperAccount.credit_balance_cents increases by granted_credit_cents (cascade hop 4)"
          - "when claim_type == ACCESSORIAL, every disputed AccessorialCharge with status ASSESSED moves to WAIVED (cascade hop 2b)"
          - "stamps resolved_at; increments Dispute.version by 1"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /disputes/{id}/resolve with outcome == DENIED"
        actor: RevenueAuditor
        preconditions: ["Dispute.status == UNDER_REVIEW", "owning Invoice.status IN {ISSUED, ADJUSTED}"]
        side_effects:
          - "granted_credit_cents stays 0; no adjustment, no accessorial waiver, no ledger movement"
          - "stamps resolved_at; increments Dispute.version by 1"

  - entity: GuaranteeClaim
    dimension: status
    initial_state: FILED
    terminal_states: [DENIED, REFUNDED]
    transitions:
      - from: FILED
        to: APPROVED
        trigger: "POST /guarantee-claims/{id}/adjudicate with outcome == APPROVED"
        actor: RevenueAuditor
        preconditions:
          - "GuaranteeClaim.status == FILED"
          - "owning Invoice.status IN {ISSUED, ADJUSTED}"
          - "GuaranteeClaim.candidate_refund_cents > 0"
        side_effects:
          - "creates a BillingAdjustment (reason GUARANTEE_REFUND, delta_cents = -candidate_refund_cents, status PROPOSED, guarantee_claim_id set, created_by_user_id = the adjudicating X-User-ID)"
          - "Invoice.pending_adjustment_count increments by 1"
          - "stamps adjudicated_at; increments GuaranteeClaim.version by 1"
        note: "The refund only becomes money once a DIFFERENT operator applies the adjustment — the segregation-of-duties gate applies."
      - from: FILED
        to: DENIED
        trigger: "POST /guarantee-claims/{id}/adjudicate with outcome == DENIED"
        actor: RevenueAuditor
        preconditions: ["GuaranteeClaim.status == FILED"]
        side_effects: ["refund_cents stays 0; stamps adjudicated_at; increments GuaranteeClaim.version by 1"]
      - from: APPROVED
        to: REFUNDED
        trigger: "system: cascade from POST /billing-adjustments/{id}/apply on the claim's GUARANTEE_REFUND adjustment"
        actor: system
        preconditions: ["GuaranteeClaim.status == APPROVED"]
        side_effects: ["sets refund_cents to -delta_cents of the applied adjustment; increments GuaranteeClaim.version by 1"]
      - from: APPROVED
        to: DENIED
        trigger: "system: cascade from POST /billing-adjustments/{id}/reject on the claim's GUARANTEE_REFUND adjustment"
        actor: system
        preconditions: ["GuaranteeClaim.status == APPROVED"]
        side_effects: ["refund_cents stays 0; increments GuaranteeClaim.version by 1"]

concurrency_rules:
  - rule_id: contract-activate-stale-shipper
    parent_entity: ShipperAccount
    write_endpoint: "POST /rate-contracts/{id}/activate"
    occ_field: "expected_shipper_account_version"
    description: |
      Activating a RateContract against a ShipperAccount whose version has
      advanced since the client last observed it is rejected. This captures
      the case where another activation has already landed for the same
      shipper — that activation legitimately supersedes the prior contract
      and truncates its effective_to, so the current client's view of which
      contract prices which dates is stale.
    error_id: ERR_STALE_SHIPPER_VERSION
    http_status: 412
  - rule_id: scan-capture-stale-shipment
    parent_entity: Shipment
    write_endpoint: "POST /shipments/{id}/scans"
    occ_field: "expected_shipment_version"
    description: |
      Recording a DimensionScan against a Shipment whose version has advanced
      since the client last observed it is rejected. A later scan legitimately
      supersedes the governing measurement set, so a client that computed its
      payload from an older measurement view would otherwise overwrite a
      determination it never saw.
    error_id: ERR_STALE_SHIPMENT_VERSION
    http_status: 412
  - rule_id: adjustment-create-stale-invoice
    parent_entity: Invoice
    write_endpoint: "POST /billing-adjustments"
    occ_field: "expected_invoice_version"
    description: |
      Creating a BillingAdjustment against an Invoice whose version has
      advanced since the client last observed it is rejected. A previously
      created or applied adjustment legitimately changes the invoice's
      net_amount_cents and pending_adjustment_count, so a delta computed
      from the older net figure no longer describes the invoice it targets.
    error_id: ERR_STALE_INVOICE_VERSION
    http_status: 412

calculations:
  - name: contract_selection
    trigger: "POST /shipments, before any pricing field is computed"
    algorithm: selector_policy
    formula: |
      candidates = every RateContract c where
          c.shipper_id == request.shipper_id
        AND c.status == ACTIVE
        AND c.effective_from <= shipment.pickup_date <= c.effective_to   # both ends inclusive
      ranking      = ORDER BY c.effective_from DESC
      tie_break    = ORDER BY c.created_at ASC          # never c.id
      selected     = first row of the ranked candidate set
      empty_set    = reject the request with ERR_NO_ACTIVE_CONTRACT (422)
      shipment.contract_id  = selected.id      # frozen for the life of the shipment
      shipment.divisor_used = selected.dim_divisor
    input_set: "RateContract rows of the requesting shipper with status == ACTIVE only; DRAFT and SUPERSEDED contracts never price a shipment"
    constants: {}
    precision: "dates compared as whole UTC calendar dates"

  - name: billable_weight
    trigger: "POST /shipments (PRELIMINARY variant) and POST /shipments/{id}/scans (FINAL variant)"
    algorithm: threshold
    formula: |
      # ---- STEP 1: per-dimension rounding happens BEFORE any multiplication ----
      #      This order is pinned. Rounding the cube instead of the dimensions
      #      yields a different pound count and is WRONG.
      l = round_half_up(length_in,  0)      # whole inches
      w = round_half_up(width_in,   0)
      h = round_half_up(height_in,  0)
      cube_in3 = l * w * h                  # integer; never rounded again

      # ---- STEP 2: divide first, ceil second ----
      dim_weight_lbs = ceil(cube_in3 / divisor_used)        # exact rational divide, then ceil

      # ---- STEP 3: actual weight rounds UP to a whole pound ----
      actual_billable_lbs = ceil(weight_lbs)

      # ---- STEP 4: oversize floor (see accessorial_assessment) ----
      oversize_floor_lbs = OVERSIZE_MIN_BILLABLE_LBS if oversize_flag else 0

      billable_weight_lbs = max(actual_billable_lbs, dim_weight_lbs, oversize_floor_lbs)

      # ---- STEP 5: basis label, ties resolved toward ACTUAL ----
      if   oversize_floor_lbs > actual_billable_lbs and oversize_floor_lbs > dim_weight_lbs:
               basis = OVERSIZE_FLOOR
      elif actual_billable_lbs >= dim_weight_lbs:
               basis = ACTUAL
      else:    basis = DIMENSIONAL
    input_set: |
      PRELIMINARY reads Shipment.declared_length_in / declared_width_in /
      declared_height_in / declared_weight_lbs. FINAL reads the governing
      DimensionScan (the most recently created scan for the shipment,
      ordered by captured_at DESC then created_at DESC — never by id).
      Shipment.billable_weight_lbs is the FINAL value when at least one scan
      exists, otherwise the PRELIMINARY value.
    constants:
      OVERSIZE_MIN_BILLABLE_LBS: 90
    precision: "cube and pounds are integers; the divide in STEP 2 is exact rational, ceil to whole pound"
    variants:
      - name: PRELIMINARY
        when: "Evaluated at POST /shipments from shipper-declared measurements; writes preliminary_dim_weight_lbs, preliminary_billable_weight_lbs, preliminary_basis"
        difference: "Uses the shipper's declaration, so it can understate the parcel; it is the only value available while measurement_status == PENDING_SCAN and it is what an invoice sweep bills for an unscanned parcel"
      - name: FINAL
        when: "Evaluated at POST /shipments/{id}/scans from the governing scan; writes final_dim_weight_lbs, final_billable_weight_lbs, final_basis"
        difference: "Uses captured measurements and re-runs oversize_flag from them, so the same package can flip basis (ACTUAL -> DIMENSIONAL), gain the 90 lb oversize floor, and produce a different pound count than PRELIMINARY on identical declared input"

  - name: scan_tolerance_evaluation
    trigger: "POST /shipments/{id}/scans, immediately after the scan's cube is computed"
    algorithm: threshold
    formula: |
      dim_variance_pct    = round_half_up(
                              abs(scan.scanned_cube_in3 - shipment.declared_cube_in3)
                              * 100 / shipment.declared_cube_in3, 2)
      weight_variance_lbs = round_half_up(
                              abs(scan.scanned_weight_lbs - shipment.declared_weight_lbs), 1)
      weight_allowance    = max(WEIGHT_VARIANCE_ABS_LBS,
                                round_half_up(shipment.declared_weight_lbs
                                              * WEIGHT_VARIANCE_PCT / 100, 1))

      cube_breach   = dim_variance_pct    >= DIM_VARIANCE_TOLERANCE_PCT    # >= , not >
      weight_breach = weight_variance_lbs >= weight_allowance              # >= , not >

      tolerance_status = EXCEEDS_TOLERANCE if (cube_breach or weight_breach)
                         else WITHIN_TOLERANCE
    input_set: "the single scan being recorded, compared against the shipment's DECLARED figures (never against a previous scan)"
    constants:
      DIM_VARIANCE_TOLERANCE_PCT: 5.00
      WEIGHT_VARIANCE_ABS_LBS: 0.5
      WEIGHT_VARIANCE_PCT: 2.00
    precision: "dim_variance_pct 2 decimals round_half_up; weight figures 1 decimal round_half_up"

  - name: accessorial_assessment
    trigger: "POST /shipments (from declared measurements) and POST /shipments/{id}/scans (re-evaluated from the governing scan)"
    algorithm: constraint_propagation
    formula: |
      l, w, h  = the three rounded whole-inch dimensions of the governing measurement set
      longest  = max(l, w, h)
      mid, sml = the other two rounded dimensions
      length_plus_girth = longest + 2 * (mid + sml)

      oversize_flag = (longest > OVERSIZE_LONGEST_IN)                 # strict >
                      or (length_plus_girth > OVERSIZE_LENGTH_PLUS_GIRTH_IN)   # strict >

      # OVERSIZE absorbs ADDITIONAL_HANDLING: the two are mutually exclusive.
      additional_handling_flag = (not oversize_flag) and (
                                     weight_lbs > AH_WEIGHT_LBS            # strict >
                                  or longest    > AH_LONGEST_IN            # strict >
                                  or non_conveyable )

      auto_codes = {}
      if shipment.residential_declared and not contract.residential_waived:
          auto_codes += RESIDENTIAL
      if shipment.delivery_area_class != NONE:
          auto_codes += DELIVERY_AREA
      if oversize_flag:            auto_codes += OVERSIZE
      if additional_handling_flag: auto_codes += ADDITIONAL_HANDLING

      # rate resolution, in this order:
      amount_cents = contract.accessorial_rate_overrides[code]
                     if that key exists
                     else DEFAULT_RATE_CENTS[code]
      # DELIVERY_AREA is keyed by class, not by a single default:
      DELIVERY_AREA amount = DAS_RATE_CENTS[shipment.delivery_area_class]
                             (an accessorial_rate_overrides["DELIVERY_AREA"] key,
                              when present, overrides the class table entirely)

      # re-evaluation on a scan:
      for each code in auto_codes not already carried by an ASSESSED AUTO charge:
          create AccessorialCharge(code, source AUTO, status ASSESSED)
      for each ASSESSED AUTO charge whose code is no longer in auto_codes:
          move it to REVERSED                       # e.g. a re-scan clears OVERSIZE
      MANUAL charges and WAIVED charges are never created, reversed or repriced
      by re-evaluation.
    input_set: "the governing measurement set (declared before the first scan, the governing scan afterwards) plus the shipment's contract_id for rate overrides"
    constants:
      OVERSIZE_LONGEST_IN: 96
      OVERSIZE_LENGTH_PLUS_GIRTH_IN: 130
      AH_WEIGHT_LBS: 50
      AH_LONGEST_IN: 48
      DEFAULT_RATE_CENTS:
        RESIDENTIAL: 590
        OVERSIZE: 12500
        ADDITIONAL_HANDLING: 2450
        ADDRESS_CORRECTION: 2200
        RETURN_UNDELIVERABLE: 1800
        REFUSAL: 1350
      DAS_RATE_CENTS:
        NONE: 0
        DAS: 425
        EXTENDED: 650
    precision: "integer cents; no rounding needed"

  - name: transportation_charge
    trigger: "InvoiceLine creation inside POST /invoices, re-computation while the owning Invoice.status == OPEN, and GET /shipments/{id}/billing-preview"
    algorithm: tiered_pricing
    formula: |
      bw  = shipment.billable_weight_lbs
      row = the single rate_table row of shipment.contract_id where
              row.zone == shipment.zone AND row.min_lbs <= bw <= row.max_lbs
            (rows tile [1, 9999] per zone, so the row is unique; a missing row
             is a contract-data error and rejects with ERR_RATE_ROW_MISSING)
      rate_cents_per_lb        = row.cents_per_lb
      uncapped_cents           = bw * row.cents_per_lb

      # ---- the floor applies to the transportation charge ALONE, BEFORE surcharges ----
      transportation_base_cents = max(uncapped_cents, contract.min_charge_cents)

      # ---- surcharge windows: half-open [start_date, end_date) on pickup_date ----
      windows = every SurchargeWindow x where
                    x.status == ACTIVE
                AND x.start_date <= shipment.pickup_date < x.end_date
                AND (x.service_level_id IS NULL
                     OR x.service_level_id == shipment.service_level_id)
      surcharge_cents = sum over windows of
                          x.per_package_cents
                        + (x.oversize_add_cents if shipment carries an ASSESSED
                           OVERSIZE AccessorialCharge else 0)
      # summation is commutative, so no window ordering is required; surcharges
      # are NEVER subject to min_charge_cents.

      accessorial_total_cents = sum of amount_cents over the shipment's
                                AccessorialCharge rows with status == ASSESSED
      base_line_total_cents   = transportation_base_cents + surcharge_cents
                                + accessorial_total_cents
    input_set: "one shipment; ACTIVE SurchargeWindow rows only (SCHEDULED and CANCELLED never price); ASSESSED AccessorialCharge rows only (WAIVED and REVERSED excluded)"
    constants: {}
    precision: "integer cents throughout; no fractional money is produced"

  - name: invoice_totals
    trigger: "POST /invoices, POST /invoices/{id}/issue, POST /accessorial-charges/{id}/waive on a line of an OPEN invoice, and POST /billing-adjustments/{id}/apply"
    algorithm: aggregation
    formula: |
      # ---- evaluation order is pinned; the discount looks circular but is not ----
      # STEP 1  transportation_subtotal_cents = sum over lines of
      #             (transportation_base_cents + surcharge_cents)
      # STEP 2  accessorial_subtotal_cents    = sum over lines of accessorial_total_cents
      # STEP 3  gross_charges_cents           = sum over lines of base_line_total_cents
      #                                       == STEP 1 + STEP 2
      # STEP 4  tier row selection reads STEP 1 ONLY — the PRE-DISCOUNT
      #         transportation subtotal. It never reads gross_charges_cents,
      #         never reads net_amount_cents, and is never re-selected because
      #         an adjustment moved the money.
      #             tier_row = the row of contract.tier_discount_table with the
      #                        GREATEST min_transportation_subtotal_cents that is
      #                        <= transportation_subtotal_cents          # >= boundary
      #                        (no such row -> tier_discount_bps = 0)
      #             tier_discount_bps = tier_row.discount_bps
      # STEP 5  the discount is computed ONCE on the summed subtotal
      #         (sum-then-round, NOT round-per-line-then-sum):
      #             tier_discount_cents = round_half_up(
      #                 transportation_subtotal_cents * tier_discount_bps / 10000, 0)
      # STEP 6  adjustment_total_cents = sum of delta_cents over APPLIED
      #         BillingAdjustment rows on this invoice's lines
      # STEP 7  net_amount_cents = gross_charges_cents
      #                          - tier_discount_cents
      #                          + adjustment_total_cents
      #
      # Freeze rule: STEPS 1-5 re-run on every mutation while status == OPEN and
      # one last time during POST /invoices/{id}/issue; afterwards
      # transportation_subtotal_cents, accessorial_subtotal_cents,
      # gross_charges_cents, tier_discount_bps and tier_discount_cents are
      # frozen. STEPS 6-7 keep running for the life of the invoice.
      #
      # The contract used for the tier table is the contract_id of the FIRST
      # line of the invoice ordered by (Shipment.pickup_date ASC,
      # InvoiceLine.created_at ASC) — never by id.
    input_set: "InvoiceLine rows of this invoice with voided == false; APPLIED BillingAdjustment rows on those lines"
    constants: {}
    precision: "integer cents; STEP 5 rounds half-up to a whole cent exactly once"

  - name: invoice_sweep_selection
    trigger: "POST /invoices"
    algorithm: selector_policy
    formula: |
      candidates = every Shipment s where
            s.shipper_id      == request.shipper_id
        AND s.billing_status  == UNBILLED
        AND s.measurement_status IN {PENDING_SCAN, SCANNED, VERIFIED}   # TOLERANCE_FLAGGED excluded
        AND s.movement_status IN {DELIVERED, UNDELIVERABLE, REFUSED}    # IN_TRANSIT excluded
        AND request.period_start <= s.pickup_date <= request.period_end # both ends inclusive

      # ---- explicit inclusion: request.include_shipment_ids (default []) ----
      named = the Shipment rows named by request.include_shipment_ids; every id
              must resolve AND belong to request.shipper_id, otherwise the request
              is rejected with ERR_SHIPMENT_NOT_FOUND (404)
      # A named shipment joins the sweep even when its pickup_date falls OUTSIDE
      # [period_start, period_end] and even when its movement_status is still
      # IN_TRANSIT, but naming a shipment never lifts these two gates:
      #   billing_status == UNBILLED       else ERR_SHIPMENT_ALREADY_BILLED (409)
      #   measurement_status != TOLERANCE_FLAGGED
      #                                    else ERR_SCAN_TOLERANCE_UNRESOLVED (409)
      # A shipment the plain sweep already caught is never doubled up.
      selected   = candidates UNION named                    # de-duplicated by id
      line_order = ORDER BY s.pickup_date ASC, s.created_at ASC         # never by s.id
      empty_set  = reject with ERR_NO_BILLABLE_SHIPMENTS (422)
      one InvoiceLine is created per selected shipment in line_order
    input_set: "the requesting shipper's shipments only; a shipment already on a line of a non-VOID invoice is never a candidate because its billing_status left UNBILLED"
    constants: {}
    precision: "dates compared as whole UTC calendar dates"

  - name: billing_reconciliation_branch
    trigger: "any transition that changes a Shipment's charge picture: POST /shipments/{id}/scans, POST /shipments/{id}/exceptions, POST /shipments/{id}/accessorials, POST /accessorial-charges/{id}/waive"
    algorithm: constraint_propagation
    formula: |
      recomputed_line_total = transportation_charge.base_line_total_cents
                              recomputed from the shipment's current state
      line   = the InvoiceLine whose shipment_id == shipment.id and voided == false
               (at most one exists)
      invoice = line's Invoice

      BRANCH A  line does not exist (shipment.billing_status == UNBILLED)
                -> nothing propagates; the future sweep will price the shipment
                   from its then-current state.
      BRANCH B  invoice.status == OPEN
                -> the line is recomputed IN PLACE (transportation_base_cents,
                   surcharge_cents, accessorial_total_cents,
                   base_line_total_cents) and invoice_totals STEPS 1-5 re-run.
                   No BillingAdjustment is created.
      BRANCH C  invoice.status IN {ISSUED, ADJUSTED}
                AND the trigger is a scan with scan_source == AUTOMATED_DWS
                AND delta = recomputed_line_total - line.base_line_total_cents != 0
                -> a BillingAdjustment is created with status PROPOSED,
                   reason WEIGHT_CORRECTION, delta_cents = delta,
                   created_by_user_id 'system'; the line's frozen
                   base_line_total_cents is NOT touched;
                   invoice.pending_adjustment_count increments by 1 and
                   has_pending_adjustments becomes true.
      BRANCH D  invoice.status IN {ISSUED, ADJUSTED}
                AND the trigger is a scan with scan_source == MANUAL_REWEIGH
                -> the shipment's measurement fields update but NO adjustment is
                   created. A reweigh exists to feed dispute review, never to
                   rebill on its own.
      BRANCH E  invoice.status IN {ISSUED, ADJUSTED}
                AND the trigger is an exception, a manual accessorial or a waiver
                -> reject the trigger with ERR_LINE_ALREADY_FROZEN (409); charges
                   may not be hand-edited after issue, only adjusted.
      BRANCH F  invoice.status IN {SETTLED, VOID}
                -> the shipment's own fields still update on a scan, but nothing
                   propagates to the line, the invoice or the ledger.
    input_set: "the single non-voided InvoiceLine of the shipment, if any"
    constants: {}
    precision: "integer cents"

  - name: dispute_credit
    trigger: "POST /disputes/{id}/resolve with outcome == UPHELD"
    algorithm: forward_looking
    formula: |
      line = the disputed InvoiceLine
      # variant chosen by Dispute.claim_type, see variants below
      if claim_type == WEIGHT:            # FULL_REPRICE
          repriced = transportation_charge recomputed from the shipment's
                     CURRENT governing measurement set and its CURRENT ASSESSED
                     accessorials
          credit   = max(0, line.line_total_cents - repriced.base_line_total_cents)
      if claim_type == ACCESSORIAL:        # ACCESSORIAL_ONLY
          credit   = sum of amount_cents over the shipment's AccessorialCharge
                     rows whose code is in dispute.disputed_codes
                     AND status == ASSESSED
                     (a code with no ASSESSED charge contributes 0)
      granted_credit_cents = min(credit, line.line_total_cents)
      # a dispute can never turn into a rebill and never credits more than the
      # line is worth; a computed credit of 0 is a legal UPHELD outcome and
      # creates no BillingAdjustment.
    input_set: "one InvoiceLine, its Shipment's current measurement set and AccessorialCharge rows with status == ASSESSED"
    constants: {}
    precision: "integer cents; the max(0, ...) floor is applied before the min() cap"
    variants:
      - name: FULL_REPRICE
        when: "Dispute.claim_type == WEIGHT"
        difference: "Reprices the entire line against the shipment's current measurements, so it also sweeps up transportation, surcharge and oversize movement — including charges the shipper did not name"
      - name: ACCESSORIAL_ONLY
        when: "Dispute.claim_type == ACCESSORIAL"
        difference: "Credits exactly the named accessorial codes and ignores the weight determination entirely; on the same line with the same data this produces a different number than FULL_REPRICE (e.g. 540 vs 0 when the measurements were correct all along)"

  - name: guarantee_refund
    trigger: "POST /guarantee-claims (candidate_refund_cents) and POST /guarantee-claims/scan"
    algorithm: threshold
    formula: |
      deadline = shipment.guarantee_deadline_utc
                 = shipment.picked_up_at + service_level.guarantee_hours
      late     = shipment.delivered_at > deadline          # STRICT >; equality is on time
      late_by_seconds = whole seconds of (delivered_at - deadline)

      suspended = there exists a SurchargeWindow x with
                      x.status == ACTIVE
                  AND x.kind   == PEAK_SEASON
                  AND x.start_date <= shipment.pickup_date < x.end_date   # half-open
                  AND (x.service_level_id IS NULL
                       OR x.service_level_id == shipment.service_level_id)
      # Peak-season service suspension: the money-back commitment does not run
      # inside a peak window.

      line = the InvoiceLine of the shipment with voided == false
      candidate_refund_cents = 0 if (not late) or suspended
                               else line.transportation_base_cents
      # ONLY the floored transportation charge is refundable. surcharge_cents and
      # accessorial_total_cents are explicitly NOT refunded.
    input_set: "one shipment, its ServiceLevel, its non-voided InvoiceLine and the ACTIVE PEAK_SEASON windows covering its pickup_date"
    constants:
      CLAIM_WINDOW_DAYS: 15
      DISPUTE_WINDOW_DAYS: 90
      MAX_EVIDENCE_ROUNDS: 2
    precision: "integer cents; datetime comparison at whole-second resolution"

  - name: shipper_ledger_aggregates
    trigger: "every mutation that touches a Shipment's billing_status, an Invoice's status or totals, or a BillingAdjustment's status"
    algorithm: aggregation
    formula: |
      total_shipment_count   = count(Shipment where shipper_id == account.id)
      unbilled_shipment_count= count(same where billing_status == UNBILLED)
      billed_shipment_count  = count(same where billing_status IN {BILLED, ADJUSTED})
      open_charges_cents     = sum(Invoice.net_amount_cents
                                   where shipper_id == account.id
                                     AND status IN {ISSUED, ADJUSTED})
      credit_balance_cents   = - sum(BillingAdjustment.delta_cents
                                     where status == APPLIED
                                       AND its InvoiceLine's Invoice.shipper_id == account.id
                                       AND that Invoice.status != VOID)

      # INVARIANT P (conserved package count) — must hold after every request:
      #     unbilled_shipment_count + billed_shipment_count == total_shipment_count
      # INVARIANT M (conserved money) — must hold after every request:
      #     credit_balance_cents
      #   + sum(Invoice.net_amount_cents where status IN {ISSUED, ADJUSTED, SETTLED})
      #  == sum(Invoice.gross_charges_cents - Invoice.tier_discount_cents
      #         where status IN {ISSUED, ADJUSTED, SETTLED})
    input_set: "all of the account's Shipment rows; its Invoice rows filtered by status as written above; APPLIED BillingAdjustment rows on non-VOID invoices"
    constants: {}
    precision: "integer counts and integer cents; no rounding"

validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and non-empty"
    error_id: ERR_MISSING_AUTH_HEADERS
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "X-User-Role names one of the five declared roles"
    error_id: ERR_UNKNOWN_ROLE
    http_status: 401
    applies_to: all
  - priority: 3
    category: auth
    check: "the declared role appears in the endpoint's roles list in §1.5"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: all
  - priority: 4
    category: auth
    check: "when X-User-Role == ShipperUser, X-User-ID equals the ShipperAccount.id that owns the target resource (Shipment.shipper_id, Invoice.shipper_id, the Invoice behind an InvoiceLine, the Dispute's line, the GuaranteeClaim's shipment) and equals any shipper_id in the request body"
    error_id: ERR_SHIPPER_SCOPE_VIOLATION
    http_status: 403
    applies_to: "all endpoints whose roles include ShipperUser"
  - priority: 5
    category: existence
    check: "every referenced ShipperAccount id (path or body) resolves"
    error_id: ERR_SHIPPER_NOT_FOUND
    http_status: 404
    applies_to: "POST /shipper-accounts/{id}/suspend, GET /shipper-accounts/{id}, POST /rate-contracts, POST /shipments, POST /invoices, POST /guarantee-claims/scan"
  - priority: 6
    category: existence
    check: "every referenced RateContract id resolves"
    error_id: ERR_CONTRACT_NOT_FOUND
    http_status: 404
    applies_to: "GET /rate-contracts/{id}, POST /rate-contracts/{id}/activate, POST /rate-contracts (supersedes_contract_id)"
  - priority: 7
    category: existence
    check: "every referenced ServiceLevel id resolves"
    error_id: ERR_SERVICE_LEVEL_NOT_FOUND
    http_status: 404
    applies_to: "GET /service-levels/{id}, POST /shipments, POST /surcharge-windows"
  - priority: 8
    category: existence
    check: "every referenced SurchargeWindow id resolves"
    error_id: ERR_SURCHARGE_WINDOW_NOT_FOUND
    http_status: 404
    applies_to: "GET /surcharge-windows/{id}, POST /surcharge-windows/{id}/activate, POST /surcharge-windows/{id}/cancel"
  - priority: 9
    category: existence
    check: "every referenced Shipment id resolves"
    error_id: ERR_SHIPMENT_NOT_FOUND
    http_status: 404
    applies_to: "GET /shipments/{id}, GET /shipments/{id}/scans, GET /shipments/{id}/accessorials, GET /shipments/{id}/billing-preview, POST /shipments/{id}/scans, POST /shipments/{id}/deliver, POST /shipments/{id}/exceptions, POST /shipments/{id}/accessorials, POST /guarantee-claims, POST /invoices (include_shipment_ids)"
  - priority: 10
    category: existence
    check: "every referenced AccessorialCharge id resolves"
    error_id: ERR_ACCESSORIAL_NOT_FOUND
    http_status: 404
    applies_to: "POST /accessorial-charges/{id}/waive"
  - priority: 11
    category: existence
    check: "every referenced Invoice id resolves"
    error_id: ERR_INVOICE_NOT_FOUND
    http_status: 404
    applies_to: "GET /invoices/{id}, POST /invoices/{id}/issue, POST /invoices/{id}/settle, POST /invoices/{id}/void"
  - priority: 12
    category: existence
    check: "every referenced InvoiceLine id resolves"
    error_id: ERR_INVOICE_LINE_NOT_FOUND
    http_status: 404
    applies_to: "GET /invoice-lines/{id}, POST /billing-adjustments, POST /disputes"
  - priority: 13
    category: existence
    check: "every referenced BillingAdjustment id resolves"
    error_id: ERR_ADJUSTMENT_NOT_FOUND
    http_status: 404
    applies_to: "GET /billing-adjustments/{id}, POST /billing-adjustments/{id}/apply, POST /billing-adjustments/{id}/reject"
  - priority: 14
    category: existence
    check: "every referenced Dispute id resolves"
    error_id: ERR_DISPUTE_NOT_FOUND
    http_status: 404
    applies_to: "GET /disputes/{id}, GET /disputes/{id}/evidence, POST /disputes/{id}/evidence, POST /disputes/{id}/request-evidence, POST /disputes/{id}/resolve"
  - priority: 15
    category: existence
    check: "every referenced GuaranteeClaim id resolves"
    error_id: ERR_CLAIM_NOT_FOUND
    http_status: 404
    applies_to: "GET /guarantee-claims/{id}, POST /guarantee-claims/{id}/adjudicate"
  - priority: 16
    category: business_constraint
    check: "request body carries every required field of the endpoint's input schema, every value has the declared type, every enum value is a declared member, numeric ranges hold, and dimension/weight values carry at most one decimal place"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all
  - priority: 17
    category: business_constraint
    check: "limit is an integer in [1, 100] and offset is an integer >= 0"
    error_id: ERR_INVALID_PAGINATION
    http_status: 400
    applies_to: "every list endpoint"
  - priority: 18
    category: business_referential
    check: "natural keys are unique: ShipperAccount.account_number, ServiceLevel.code, SurchargeWindow.code, Shipment.tracking_number"
    error_id: ERR_DUPLICATE_KEY
    http_status: 409
    applies_to: "POST /shipper-accounts, POST /service-levels, POST /surcharge-windows, POST /shipments"
  - priority: 19
    category: state
    check: "expected_shipper_account_version / expected_shipment_version / expected_invoice_version equals the parent's current version (§1.2.1)"
    error_id: ERR_STALE_SHIPPER_VERSION
    http_status: 412
    applies_to: "POST /rate-contracts/{id}/activate (ERR_STALE_SHIPPER_VERSION), POST /shipments/{id}/scans (ERR_STALE_SHIPMENT_VERSION), POST /billing-adjustments (ERR_STALE_INVOICE_VERSION)"
  - priority: 20
    category: state
    check: "the referenced ShipperAccount.status == ACTIVE"
    error_id: ERR_SHIPPER_SUSPENDED
    http_status: 409
    applies_to: "POST /shipments"
  - priority: 21
    category: state
    check: "RateContract.status == DRAFT for activation, and any supersedes_contract_id target has status == ACTIVE and the same shipper_id"
    error_id: ERR_CONTRACT_NOT_ACTIVATABLE
    http_status: 409
    applies_to: "POST /rate-contracts/{id}/activate"
  - priority: 22
    category: state
    check: "SurchargeWindow.status == SCHEDULED for activation; status IN {SCHEDULED, ACTIVE} for cancellation"
    error_id: ERR_WINDOW_NOT_IN_STATE
    http_status: 409
    applies_to: "POST /surcharge-windows/{id}/activate, POST /surcharge-windows/{id}/cancel"
  - priority: 23
    category: state
    check: "Shipment.measurement_status != VERIFIED — a verified measurement is final and admits no further scan"
    error_id: ERR_MEASUREMENT_FINAL
    http_status: 409
    applies_to: "POST /shipments/{id}/scans"
  - priority: 24
    category: state
    check: "Shipment.movement_status == IN_TRANSIT"
    error_id: ERR_SHIPMENT_NOT_IN_TRANSIT
    http_status: 409
    applies_to: "POST /shipments/{id}/deliver, POST /shipments/{id}/exceptions"
  - priority: 25
    category: state
    check: "AccessorialCharge.status == ASSESSED"
    error_id: ERR_ACCESSORIAL_NOT_WAIVABLE
    http_status: 409
    applies_to: "POST /accessorial-charges/{id}/waive"
  - priority: 26
    category: state
    check: "Invoice.status == OPEN with line_count >= 1 for issue; status IN {ISSUED, ADJUSTED} with pending_adjustment_count == 0 for settle; status IN {OPEN, ISSUED, ADJUSTED} for void"
    error_id: ERR_INVOICE_NOT_IN_STATE
    http_status: 409
    applies_to: "POST /invoices/{id}/issue, POST /invoices/{id}/settle, POST /invoices/{id}/void"
  - priority: 27
    category: state
    check: "the Invoice behind the target InvoiceLine has status IN {ISSUED, ADJUSTED} — an OPEN invoice is edited in place and a SETTLED or VOID invoice is closed to adjustment"
    error_id: ERR_INVOICE_NOT_ADJUSTABLE
    http_status: 409
    applies_to: "POST /billing-adjustments, POST /billing-adjustments/{id}/apply"
  - priority: 28
    category: state
    check: "BillingAdjustment.status == PROPOSED"
    error_id: ERR_ADJUSTMENT_NOT_PENDING
    http_status: 409
    applies_to: "POST /billing-adjustments/{id}/apply, POST /billing-adjustments/{id}/reject"
  - priority: 29
    category: state
    check: "the Invoice behind the disputed InvoiceLine has status IN {ISSUED, ADJUSTED}"
    error_id: ERR_INVOICE_NOT_DISPUTABLE
    http_status: 409
    applies_to: "POST /disputes, POST /disputes/{id}/resolve"
  - priority: 30
    category: state
    check: "Dispute.status IN {SUBMITTED, EVIDENCE_REQUESTED} for evidence submission; IN {SUBMITTED, UNDER_REVIEW} for an evidence request; == UNDER_REVIEW for resolution"
    error_id: ERR_DISPUTE_NOT_IN_STATE
    http_status: 409
    applies_to: "POST /disputes/{id}/evidence, POST /disputes/{id}/request-evidence, POST /disputes/{id}/resolve"
  - priority: 31
    category: state
    check: "GuaranteeClaim.status == FILED"
    error_id: ERR_CLAIM_NOT_ADJUDICABLE
    http_status: 409
    applies_to: "POST /guarantee-claims/{id}/adjudicate"
  - priority: 32
    category: state
    check: "the target Shipment.movement_status == DELIVERED"
    error_id: ERR_SHIPMENT_NOT_DELIVERED
    http_status: 409
    applies_to: "POST /guarantee-claims"
  - priority: 33
    category: business_safety
    check: "X-User-ID differs from BillingAdjustment.created_by_user_id — the operator who proposed money movement may never be the operator who releases it. A system-proposed adjustment (created_by_user_id == 'system', produced by billing_reconciliation_branch BRANCH C) passes this check for every operator, because 'system' is never a caller identity; a DISPUTE_CREDIT adjustment is created already APPLIED and never reaches this endpoint at all"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /billing-adjustments/{id}/apply"
  - priority: 34
    category: business_temporal
    check: "effective_to >= effective_from; period_end >= period_start; end_date > start_date"
    error_id: ERR_INVALID_PERIOD
    http_status: 422
    applies_to: "POST /rate-contracts, POST /invoices, POST /surcharge-windows, POST /guarantee-claims/scan"
  - priority: 35
    category: business_temporal
    check: "the new contract's [effective_from, effective_to] CLOSED interval does not intersect the closed interval of any other contract of the same shipper with status IN {DRAFT, ACTIVE}; touching endpoints (A.effective_to == B.effective_from) DO collide. EXEMPTION: the single contract named by the request's supersedes_contract_id is excluded from this scan, because activating the successor is precisely what truncates the predecessor's effective_to (see state_machines.RateContract.DRAFT_to_ACTIVE); every OTHER DRAFT or ACTIVE contract of the shipper is still scanned"
    error_id: ERR_CONTRACT_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /rate-contracts"
  - priority: 36
    category: business_temporal
    check: "the new window's [start_date, end_date) HALF-OPEN interval does not intersect the half-open interval of any other window with the same kind and the same service_level_id scope and status IN {SCHEDULED, ACTIVE}; touching endpoints (A.end_date == B.start_date) do NOT collide"
    error_id: ERR_SURCHARGE_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /surcharge-windows"
  - priority: 37
    category: business_temporal
    check: "the logical clock is <= Invoice.dispute_deadline_utc (issued_at + DISPUTE_WINDOW_DAYS); equality is still inside the window"
    error_id: ERR_DISPUTE_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /disputes"
  - priority: 38
    category: business_temporal
    check: "the logical clock is <= Shipment.delivered_at + CLAIM_WINDOW_DAYS; equality is still inside the window"
    error_id: ERR_CLAIM_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /guarantee-claims"
  - priority: 39
    category: business_referential
    check: "no other Dispute on the same invoice_line_id has status IN {SUBMITTED, UNDER_REVIEW, EVIDENCE_REQUESTED, UPHELD}"
    error_id: ERR_DUPLICATE_DISPUTE
    http_status: 409
    applies_to: "POST /disputes"
  - priority: 40
    category: business_referential
    check: "no other GuaranteeClaim on the same shipment_id has status IN {FILED, APPROVED, REFUNDED}"
    error_id: ERR_DUPLICATE_CLAIM
    http_status: 409
    applies_to: "POST /guarantee-claims"
  - priority: 41
    category: business_referential
    check: "calculations.contract_selection found exactly one ACTIVE contract covering the pickup_date"
    error_id: ERR_NO_ACTIVE_CONTRACT
    http_status: 422
    applies_to: "POST /shipments"
  - priority: 42
    category: business_referential
    check: "the selected contract's rate_table holds a row covering (shipment.zone, billable_weight_lbs)"
    error_id: ERR_RATE_ROW_MISSING
    http_status: 422
    applies_to: "POST /invoices, GET /shipments/{id}/billing-preview"
  - priority: 43
    category: business_referential
    check: "when claim_type == ACCESSORIAL, disputed_codes is non-empty and every listed code has at least one AccessorialCharge with status == ASSESSED on the disputed line's shipment; when claim_type == WEIGHT, disputed_codes is empty or absent"
    error_id: ERR_DISPUTED_CODE_NOT_ASSESSED
    http_status: 422
    applies_to: "POST /disputes"
  - priority: 44
    category: business_constraint
    check: "the InvoiceLine of the affected shipment is not frozen by an issued invoice (calculations.billing_reconciliation_branch BRANCH E)"
    error_id: ERR_LINE_ALREADY_FROZEN
    http_status: 409
    applies_to: "POST /shipments/{id}/exceptions, POST /shipments/{id}/accessorials, POST /accessorial-charges/{id}/waive"
  - priority: 45
    category: business_constraint
    check: "the named shipment is not already on a line of a non-VOID invoice"
    error_id: ERR_SHIPMENT_ALREADY_BILLED
    http_status: 409
    applies_to: "POST /invoices"
  - priority: 46
    category: business_constraint
    check: "calculations.invoice_sweep_selection produced at least one candidate shipment"
    error_id: ERR_NO_BILLABLE_SHIPMENTS
    http_status: 422
    applies_to: "POST /invoices"
  - priority: 47
    category: business_constraint
    check: "no swept shipment named in the request has measurement_status == TOLERANCE_FLAGGED when the caller passes include_shipment_ids"
    error_id: ERR_SCAN_TOLERANCE_UNRESOLVED
    http_status: 409
    applies_to: "POST /invoices"
  - priority: 48
    category: business_constraint
    check: "Dispute.round_count < MAX_EVIDENCE_ROUNDS"
    error_id: ERR_EVIDENCE_ROUNDS_EXHAUSTED
    http_status: 409
    applies_to: "POST /disputes/{id}/request-evidence"
  - priority: 49
    category: business_constraint
    check: "Dispute.accepted_evidence_count >= 1 when outcome == UPHELD"
    error_id: ERR_EVIDENCE_REQUIRED
    http_status: 422
    applies_to: "POST /disputes/{id}/resolve"
  - priority: 50
    category: business_constraint
    check: "the shipment's ServiceLevel.guaranteed == true"
    error_id: ERR_SERVICE_NOT_GUARANTEED
    http_status: 422
    applies_to: "POST /guarantee-claims"
  - priority: 51
    category: business_constraint
    check: "the shipment sits on an InvoiceLine with voided == false whose Invoice.status IN {ISSUED, ADJUSTED}"
    error_id: ERR_SHIPMENT_NOT_INVOICED
    http_status: 422
    applies_to: "POST /guarantee-claims"
  - priority: 52
    category: business_constraint
    check: "no ACTIVE PEAK_SEASON SurchargeWindow covers the shipment's pickup_date (calculations.guarantee_refund suspension test)"
    error_id: ERR_GUARANTEE_SUSPENDED
    http_status: 422
    applies_to: "POST /guarantee-claims"
  - priority: 53
    category: business_constraint
    check: "Shipment.delivered_at > Shipment.guarantee_deadline_utc, strictly — a delivery landing exactly on the commitment instant is on time"
    error_id: ERR_SHIPMENT_NOT_LATE
    http_status: 422
    applies_to: "POST /guarantee-claims"
  - priority: 54
    category: business_fiscal
    check: "for a credit (delta_cents < 0), -delta_cents <= InvoiceLine.line_total_cents; a debit (delta_cents > 0) has no ceiling"
    error_id: ERR_ADJUSTMENT_EXCEEDS_LINE
    http_status: 422
    applies_to: "POST /billing-adjustments"
  - priority: 55
    category: business_fiscal
    check: "for a credit, Invoice.net_amount_cents + delta_cents >= 0 — an invoice may never be pushed negative"
    error_id: ERR_CREDIT_EXCEEDS_INVOICE_NET
    http_status: 422
    applies_to: "POST /billing-adjustments, POST /billing-adjustments/{id}/apply"

endpoints:
  # ---- ShipperAccount ------------------------------------------------------
  - method: POST
    path: "/shipper-accounts"
    description: "Onboard a shipper. account_number must be unique; all five ledger aggregates start at 0."
    roles: [CarrierAdmin]
    code: 201
    input: [account_number, name, "billing_email?"]
    output: ShipperAccount
    side_effects:
      - "status = ACTIVE; total_shipment_count = unbilled_shipment_count = billed_shipment_count = credit_balance_cents = open_charges_cents = 0"
  - method: POST
    path: "/shipper-accounts/{id}/suspend"
    description: "Suspend a shipper. Blocks new shipment induction; existing shipments, invoices, disputes and claims continue to completion."
    roles: [CarrierAdmin]
    code: 200
    input: []
    output: ShipperAccount
    side_effects:
      - "status = SUSPENDED"
      - "increments ShipperAccount.version by 1"
  - method: GET
    path: "/shipper-accounts/{id}"
    description: "Read a shipper with its five live ledger aggregates (calculations.shipper_ledger_aggregates)."
    roles: [CarrierAdmin, BillingOps, RevenueAuditor, ShipperUser]
    code: 200
    input: []
    output: ShipperAccount
    side_effects: []

  # ---- RateContract --------------------------------------------------------
  - method: POST
    path: "/rate-contracts"
    description: "Draft a rate contract: dim divisor, minimum charge floor, zone x weight-break rate_table, tier_discount_table and optional accessorial overrides. Closed-interval [effective_from, effective_to] must not overlap another DRAFT or ACTIVE contract of the same shipper."
    roles: [CarrierAdmin]
    code: 201
    input: [shipper_id, effective_from, effective_to, dim_divisor, min_charge_cents, rate_table, tier_discount_table, "accessorial_rate_overrides?", "residential_waived?", "supersedes_contract_id?"]
    output: RateContract
    side_effects:
      - "status = DRAFT; activated_at = null"
  - method: POST
    path: "/rate-contracts/{id}/activate"
    description: "Activate a DRAFT contract under optimistic concurrency on the owning shipper (concurrency_rules.contract-activate-stale-shipper)."
    roles: [CarrierAdmin]
    code: 200
    input: [expected_shipper_account_version]
    output: RateContract
    side_effects:
      - "status = ACTIVE; activated_at = logical clock"
      - "when supersedes_contract_id is set: that contract's status = SUPERSEDED and its effective_to is truncated to this contract's effective_from minus one day"
      - "increments ShipperAccount.version by 1"
  - method: GET
    path: "/rate-contracts/{id}"
    description: "Read one rate contract including its rate_table and tier_discount_table."
    roles: [CarrierAdmin, BillingOps, RevenueAuditor]
    code: 200
    input: []
    output: RateContract
    side_effects: []
  - method: GET
    path: "/rate-contracts"
    description: "List rate contracts, filterable by owning shipper, by superseded predecessor, and by status."
    roles: [CarrierAdmin, BillingOps, RevenueAuditor]
    code: 200
    input: ["shipper_id?", "supersedes_contract_id?", "status?", "limit?", "offset?"]
    output: RateContract[]
    side_effects: []

  # ---- ServiceLevel --------------------------------------------------------
  - method: POST
    path: "/service-levels"
    description: "Define an immutable service level: code, transit commitment in hours and whether the commitment carries a money-back guarantee."
    roles: [CarrierAdmin]
    code: 201
    input: [code, name, guarantee_hours, guaranteed]
    output: ServiceLevel
    side_effects: []
  - method: GET
    path: "/service-levels/{id}"
    description: "Read one service level."
    roles: [CarrierAdmin, CarrierOps, BillingOps, RevenueAuditor, ShipperUser]
    code: 200
    input: []
    output: ServiceLevel
    side_effects: []

  # ---- SurchargeWindow -----------------------------------------------------
  - method: POST
    path: "/surcharge-windows"
    description: "Schedule a PEAK_SEASON or DEMAND surcharge window over the half-open range [start_date, end_date). service_level_id null means all service levels."
    roles: [CarrierAdmin]
    code: 201
    input: [code, kind, start_date, end_date, per_package_cents, "oversize_add_cents?", "service_level_id?"]
    output: SurchargeWindow
    side_effects:
      - "status = SCHEDULED"
  - method: POST
    path: "/surcharge-windows/{id}/activate"
    description: "Arm a scheduled window so calculations.transportation_charge starts consulting it."
    roles: [CarrierAdmin]
    code: 200
    input: []
    output: SurchargeWindow
    side_effects:
      - "status = ACTIVE"
      - "increments SurchargeWindow.version by 1"
  - method: POST
    path: "/surcharge-windows/{id}/cancel"
    description: "Cancel a SCHEDULED or ACTIVE window; already-issued invoice lines keep the surcharge they were priced with."
    roles: [CarrierAdmin]
    code: 200
    input: []
    output: SurchargeWindow
    side_effects:
      - "status = CANCELLED"
      - "increments SurchargeWindow.version by 1"
  - method: GET
    path: "/surcharge-windows/{id}"
    description: "Read one surcharge window."
    roles: [CarrierAdmin, BillingOps, RevenueAuditor]
    code: 200
    input: []
    output: SurchargeWindow
    side_effects: []
  - method: GET
    path: "/surcharge-windows"
    description: "List surcharge windows, filterable by kind, by scoped service level and by status."
    roles: [CarrierAdmin, BillingOps, RevenueAuditor]
    code: 200
    input: ["kind?", "service_level_id?", "status?", "limit?", "offset?"]
    output: SurchargeWindow[]
    side_effects: []

  # ---- Shipment ------------------------------------------------------------
  - method: POST
    path: "/shipments"
    description: "Induct a package from shipper-declared dimensions and weight. Selects the governing contract, computes the PRELIMINARY billable weight variant and assesses the automatic accessorials implied by the declaration."
    roles: [CarrierOps]
    code: 201
    input: [shipper_id, service_level_id, tracking_number, zone, residential_declared, declared_length_in, declared_width_in, declared_height_in, declared_weight_lbs, "delivery_area_class?", "non_conveyable_declared?"]
    output: Shipment
    side_effects:
      - "picked_up_at = logical clock; pickup_date = its UTC date; guarantee_deadline_utc = picked_up_at + ServiceLevel.guarantee_hours"
      - "contract_id and divisor_used set by calculations.contract_selection"
      - "declared_cube_in3, preliminary_dim_weight_lbs, preliminary_billable_weight_lbs, preliminary_basis and billable_weight_lbs set by calculations.billable_weight variant PRELIMINARY"
      - "oversize_flag and additional_handling_flag set by calculations.accessorial_assessment; creates AccessorialCharge rows with source = AUTO for RESIDENTIAL, DELIVERY_AREA, OVERSIZE and ADDITIONAL_HANDLING as assessed; recomputes Shipment.accessorial_total_cents"
      - "measurement_status = PENDING_SCAN; movement_status = IN_TRANSIT; billing_status = UNBILLED"
      - "ShipperAccount.total_shipment_count += 1; unbilled_shipment_count += 1; open_charges_cents recomputed"
  - method: GET
    path: "/shipments/{id}"
    description: "Read a shipment with both billable-weight variants, the tolerance verdict and all three status axes."
    roles: [CarrierOps, BillingOps, RevenueAuditor, ShipperUser]
    code: 200
    input: []
    output: Shipment
    side_effects: []
  - method: GET
    path: "/shipments"
    description: "List shipments, filterable by owning shipper, by service level, by governing contract and by any of the three status axes."
    roles: [CarrierOps, BillingOps, RevenueAuditor, ShipperUser]
    code: 200
    input: ["shipper_id?", "service_level_id?", "contract_id?", "measurement_status?", "movement_status?", "billing_status?", "limit?", "offset?"]
    output: Shipment[]
    side_effects: []
  - method: GET
    path: "/shipments/{id}/billing-preview"
    description: "Dry-run price for one shipment at the current billable weight: does not create or mutate anything. Fails with ERR_RATE_ROW_MISSING when the contract has no covering rate row."
    roles: [BillingOps, RevenueAuditor]
    code: 200
    input: []
    output: "{ shipment_id: string, contract_id: string, billable_weight_lbs: integer, billable_weight_basis: string, rate_cents_per_lb: integer, transportation_base_cents: integer, surcharge_cents: integer, accessorial_total_cents: integer, line_total_cents: integer }"
    side_effects: []
  - method: POST
    path: "/shipments/{id}/scans"
    description: "Capture a measurement. scan_source = AUTOMATED_DWS runs the tolerance test and may flag the shipment; scan_source = MANUAL_REWEIGH is authoritative and drives measurement_status to VERIFIED. Optimistic concurrency on the shipment (concurrency_rules.scan-capture-stale-shipment)."
    roles: [CarrierOps]
    code: 201
    input: [scan_source, scanned_length_in, scanned_width_in, scanned_height_in, scanned_weight_lbs, expected_shipment_version, "non_conveyable_observed?"]
    output: DimensionScan
    side_effects:
      - "DimensionScan.scanned_cube_in3, dim_variance_pct, weight_variance_lbs and tolerance_status set by calculations.scan_tolerance_evaluation"
      - "Shipment.scanned_cube_in3, final_dim_weight_lbs, final_billable_weight_lbs, final_basis and billable_weight_lbs set by calculations.billable_weight variant FINAL; Shipment.dim_variance_pct and weight_variance_lbs mirrored from the scan"
      - "Shipment.measurement_status advances per the measurement state machine"
      - "re-runs calculations.accessorial_assessment against the scanned geometry: reverses superseded source = AUTO OVERSIZE / ADDITIONAL_HANDLING charges to status = REVERSED and creates the newly implied ones; recomputes Shipment.accessorial_total_cents"
      - "when the shipment already sits on an OPEN invoice line, reprices that line in place and recomputes the invoice; when it sits on an ISSUED or ADJUSTED line, calculations.billing_reconciliation_branch may create a PROPOSED WEIGHT_CORRECTION BillingAdjustment"
      - "increments Shipment.version by 1"
  - method: GET
    path: "/shipments/{id}/scans"
    description: "List every measurement captured for a shipment, oldest first, so the tolerance history is auditable."
    roles: [CarrierOps, BillingOps, RevenueAuditor, ShipperUser]
    code: 200
    input: ["limit?", "offset?"]
    output: DimensionScan[]
    side_effects: []
  - method: POST
    path: "/shipments/{id}/deliver"
    description: "Record delivery at the current logical clock; the guarantee comparison later reads this instant against guarantee_deadline_utc."
    roles: [CarrierOps]
    code: 200
    input: []
    output: Shipment
    side_effects:
      - "movement_status = DELIVERED; delivered_at = logical clock"
      - "increments Shipment.version by 1"
  - method: POST
    path: "/shipments/{id}/exceptions"
    description: "Record a delivery exception. kind = UNDELIVERABLE creates one RETURN_UNDELIVERABLE charge; kind = REFUSED creates both REFUSAL and RETURN_UNDELIVERABLE; kind = ADDRESS_CORRECTED keeps the package IN_TRANSIT and creates one ADDRESS_CORRECTION charge."
    roles: [CarrierOps]
    code: 200
    input: [kind, "reason?"]
    output: Shipment
    side_effects:
      - "movement_status set per the movement state machine (UNDELIVERABLE, REFUSED, or unchanged IN_TRANSIT for ADDRESS_CORRECTED)"
      - "creates the kind's AccessorialCharge rows with source = AUTO at their contract-resolved rates; recomputes Shipment.accessorial_total_cents"
      - "when the shipment sits on an OPEN invoice line, reprices that line and recomputes the invoice"
      - "increments Shipment.version by 1"
  - method: POST
    path: "/shipments/{id}/accessorials"
    description: "Assess an accessorial by hand (source = MANUAL) for a case automated assessment cannot see, e.g. a non-conveyable item the scanner passed."
    roles: [CarrierOps, BillingOps]
    code: 201
    input: [code, "reason?"]
    output: AccessorialCharge
    side_effects:
      - "amount_cents resolved from the contract override table or the default rate; status = ASSESSED; source = MANUAL"
      - "recomputes Shipment.accessorial_total_cents and ShipperAccount.open_charges_cents"
      - "when the shipment sits on an OPEN invoice line, reprices that line and recomputes the invoice"
  - method: GET
    path: "/shipments/{id}/accessorials"
    description: "List every accessorial ever attached to a shipment, including WAIVED and REVERSED history rows."
    roles: [CarrierOps, BillingOps, RevenueAuditor, ShipperUser]
    code: 200
    input: ["status?", "code?", "limit?", "offset?"]
    output: AccessorialCharge[]
    side_effects: []

  # ---- AccessorialCharge ---------------------------------------------------
  - method: POST
    path: "/accessorial-charges/{id}/waive"
    description: "Waive an ASSESSED accessorial as a service gesture; the row survives at status = WAIVED and stops contributing money."
    roles: [BillingOps]
    code: 200
    input: ["reason?"]
    output: AccessorialCharge
    side_effects:
      - "status = WAIVED"
      - "recomputes Shipment.accessorial_total_cents and ShipperAccount.open_charges_cents"
      - "when the shipment sits on an OPEN invoice line, reprices that line and recomputes the invoice"
      - "increments AccessorialCharge.version by 1"
  - method: GET
    path: "/accessorial-charges/{id}"
    description: "Read one accessorial charge with its assessed_basis explanation string."
    roles: [CarrierOps, BillingOps, RevenueAuditor, ShipperUser]
    code: 200
    input: []
    output: AccessorialCharge
    side_effects: []

  # ---- Invoice / InvoiceLine ----------------------------------------------
  - method: POST
    path: "/invoices"
    description: "Run a billing sweep for one shipper over an inclusive [period_start, period_end] pickup-date range: selects billable shipments (calculations.invoice_sweep_selection), prices one InvoiceLine each and computes the seven-step invoice roll-up. include_shipment_ids force-adds the listed shipments to the sweep, even ones outside the period or still IN_TRANSIT, but never lifts the already-billed or TOLERANCE_FLAGGED gates."
    roles: [BillingOps]
    code: 201
    input: [shipper_id, period_start, period_end, "include_shipment_ids?"]
    output: Invoice
    side_effects:
      - "creates one InvoiceLine per swept shipment, each priced by calculations.transportation_charge at the shipment's current billable_weight_lbs plus its ASSESSED accessorials"
      - "Invoice.line_count, transportation_subtotal_cents, accessorial_subtotal_cents, gross_charges_cents, tier_discount_bps, tier_discount_cents and net_amount_cents set by calculations.invoice_totals; status = OPEN"
      - "each swept Shipment.billing_status = BILLED"
      - "ShipperAccount.unbilled_shipment_count -= line_count; billed_shipment_count += line_count"
  - method: GET
    path: "/invoices/{id}"
    description: "Read an invoice with its frozen tier discount, adjustment total, net amount and pending-adjustment counters."
    roles: [BillingOps, RevenueAuditor, ShipperUser]
    code: 200
    input: []
    output: Invoice
    side_effects: []
  - method: GET
    path: "/invoices"
    description: "List invoices, filterable by shipper and status."
    roles: [BillingOps, RevenueAuditor, ShipperUser]
    code: 200
    input: ["shipper_id?", "status?", "limit?", "offset?"]
    output: Invoice[]
    side_effects: []
  - method: POST
    path: "/invoices/{id}/issue"
    description: "Issue an OPEN invoice with at least one line. Freezes every line and the tier discount, stamps issued_at and opens the dispute window."
    roles: [BillingOps]
    code: 200
    input: []
    output: Invoice
    side_effects:
      - "status = ISSUED; issued_at = logical clock; dispute_deadline_utc = issued_at + DISPUTE_WINDOW_DAYS"
      - "tier_discount_bps and tier_discount_cents frozen — later adjustments never re-select the tier"
      - "increments Invoice.version by 1"
  - method: POST
    path: "/invoices/{id}/settle"
    description: "Settle an ISSUED or ADJUSTED invoice once no PROPOSED adjustment is outstanding; the invoice becomes terminal and closed to further adjustment."
    roles: [BillingOps]
    code: 200
    input: [payment_reference]
    output: Invoice
    side_effects:
      - "status = SETTLED; payment_reference stored"
      - "increments Invoice.version by 1"
  - method: POST
    path: "/invoices/{id}/void"
    description: "Void an OPEN, ISSUED or ADJUSTED invoice and unwind every consequence so its shipments are billable again."
    roles: [BillingOps]
    code: 200
    input: []
    output: Invoice
    side_effects:
      - "status = VOID; net_amount_cents = 0"
      - "every InvoiceLine.voided = true"
      - "every PROPOSED BillingAdjustment on this invoice's lines: status = REJECTED"
      - "every Shipment on a line: billing_status = UNBILLED"
      - "ShipperAccount.billed_shipment_count -= line_count; unbilled_shipment_count += line_count; credit_balance_cents and open_charges_cents recomputed"
      - "increments Invoice.version by 1"
  - method: GET
    path: "/invoice-lines/{id}"
    description: "Read one invoice line: its billable weight and basis, rate, transportation base, surcharge, accessorial total, adjustment total and line total."
    roles: [BillingOps, RevenueAuditor, ShipperUser]
    code: 200
    input: []
    output: InvoiceLine
    side_effects: []
  - method: GET
    path: "/invoice-lines"
    description: "List invoice lines, filterable by invoice and by shipment."
    roles: [BillingOps, RevenueAuditor, ShipperUser]
    code: 200
    input: ["invoice_id?", "shipment_id?", "limit?", "offset?"]
    output: InvoiceLine[]
    side_effects: []

  # ---- BillingAdjustment ---------------------------------------------------
  - method: POST
    path: "/billing-adjustments"
    description: "Propose a post-shipment billing adjustment against one frozen invoice line. Optimistic concurrency on the owning invoice (concurrency_rules.adjustment-create-stale-invoice). Money does not move until a different operator applies it."
    roles: [BillingOps]
    code: 201
    input: [invoice_line_id, reason, delta_cents, expected_invoice_version, "note?"]
    output: BillingAdjustment
    side_effects:
      - "status = PROPOSED; created_by_user_id = X-User-ID"
      - "Invoice.pending_adjustment_count += 1; has_pending_adjustments = true"
      - "increments Invoice.version by 1"
  - method: POST
    path: "/billing-adjustments/{id}/apply"
    description: "Apply a PROPOSED adjustment. Segregation of duties: X-User-ID must differ from created_by_user_id. This is the only endpoint that moves money on an issued invoice."
    roles: [BillingOps]
    code: 200
    input: []
    output: BillingAdjustment
    side_effects:
      - "status = APPLIED; applied_by_user_id = X-User-ID; applied_at = logical clock"
      - "InvoiceLine.adjustment_total_cents += delta_cents; line_total_cents recomputed"
      - "Invoice.adjustment_total_cents += delta_cents; net_amount_cents recomputed; pending_adjustment_count -= 1; status = ADJUSTED when it was ISSUED or ADJUSTED"
      - "Shipment.billing_status = ADJUSTED"
      - "ShipperAccount.credit_balance_cents and open_charges_cents recomputed"
      - "when guarantee_claim_id is set: that GuaranteeClaim.status = REFUNDED and refund_cents = -delta_cents"
  - method: POST
    path: "/billing-adjustments/{id}/reject"
    description: "Reject a PROPOSED adjustment; nothing moves and any linked guarantee claim is denied."
    roles: [BillingOps]
    code: 200
    input: ["note?"]
    output: BillingAdjustment
    side_effects:
      - "status = REJECTED"
      - "Invoice.pending_adjustment_count -= 1; has_pending_adjustments recomputed"
      - "when guarantee_claim_id is set: that GuaranteeClaim.status = DENIED"
  - method: GET
    path: "/billing-adjustments/{id}"
    description: "Read one billing adjustment with its proposer, applier and linkage to a dispute or guarantee claim."
    roles: [BillingOps, RevenueAuditor, ShipperUser]
    code: 200
    input: []
    output: BillingAdjustment
    side_effects: []
  - method: GET
    path: "/billing-adjustments"
    description: "List billing adjustments, filterable by invoice line, by originating dispute, by originating guarantee claim and by status."
    roles: [BillingOps, RevenueAuditor, ShipperUser]
    code: 200
    input: ["invoice_line_id?", "dispute_id?", "guarantee_claim_id?", "status?", "limit?", "offset?"]
    output: BillingAdjustment[]
    side_effects: []

  # ---- Dispute / EvidenceItem ---------------------------------------------
  - method: POST
    path: "/disputes"
    description: "Shipper disputes one issued invoice line, either the billable weight (claim_type = WEIGHT) or named accessorial codes (claim_type = ACCESSORIAL). Must land on or before the invoice's dispute_deadline_utc."
    roles: [ShipperUser]
    code: 201
    input: [invoice_line_id, claim_type, claimed_reason, "disputed_codes?"]
    output: Dispute
    side_effects:
      - "status = SUBMITTED; shipper_user_id = X-User-ID; round_count = 0; accepted_evidence_count = 0; granted_credit_cents = 0"
  - method: POST
    path: "/disputes/{id}/evidence"
    description: "Shipper files an evidence item. It is accepted when the dispute has no outstanding required_item_type or the item matches it; either way the dispute returns to UNDER_REVIEW."
    roles: [ShipperUser]
    code: 201
    input: [item_type, reference]
    output: EvidenceItem
    side_effects:
      - "accepted = true when Dispute.required_item_type is null or equals item_type, else false; submitted_by_user_id = X-User-ID"
      - "Dispute.accepted_evidence_count += 1 when accepted; Dispute.status = UNDER_REVIEW; required_item_type cleared when accepted"
  - method: POST
    path: "/disputes/{id}/request-evidence"
    description: "Auditor sends the dispute back for a specific document, consuming one of the MAX_EVIDENCE_ROUNDS rounds."
    roles: [RevenueAuditor]
    code: 200
    input: [required_item_type]
    output: Dispute
    side_effects:
      - "status = EVIDENCE_REQUESTED; required_item_type stored; round_count += 1"
      - "increments Dispute.version by 1"
  - method: POST
    path: "/disputes/{id}/resolve"
    description: "Auditor upholds or denies an UNDER_REVIEW dispute. UPHELD reprices the line per calculations.dispute_credit and books the credit as an already-APPLIED system adjustment."
    roles: [RevenueAuditor]
    code: 200
    input: [outcome]
    output: Dispute
    side_effects:
      - "status = UPHELD or DENIED; resolved_at = logical clock"
      - "on UPHELD: granted_credit_cents set by calculations.dispute_credit; creates a BillingAdjustment with reason = DISPUTE_CREDIT, delta_cents = -granted_credit_cents, dispute_id set, created_by_user_id = 'system' and status = APPLIED, then applies its full cascade (line, invoice, shipment, shipper ledger)"
      - "on UPHELD with claim_type = ACCESSORIAL: every disputed ASSESSED AccessorialCharge on the shipment moves to status = WAIVED"
      - "increments Dispute.version by 1"
  - method: GET
    path: "/disputes/{id}"
    description: "Read one dispute with its round count, accepted-evidence count and granted credit."
    roles: [BillingOps, RevenueAuditor, ShipperUser]
    code: 200
    input: []
    output: Dispute
    side_effects: []
  - method: GET
    path: "/disputes"
    description: "List disputes, filterable by invoice line and status."
    roles: [BillingOps, RevenueAuditor, ShipperUser]
    code: 200
    input: ["invoice_line_id?", "status?", "limit?", "offset?"]
    output: Dispute[]
    side_effects: []
  - method: GET
    path: "/disputes/{id}/evidence"
    description: "List every evidence item filed against a dispute, with its acceptance verdict."
    roles: [BillingOps, RevenueAuditor, ShipperUser]
    code: 200
    input: ["limit?", "offset?"]
    output: EvidenceItem[]
    side_effects: []

  # ---- GuaranteeClaim ------------------------------------------------------
  - method: POST
    path: "/guarantee-claims"
    description: "File a service-guarantee refund claim on a delivered, invoiced, guaranteed shipment that missed its commitment. candidate_refund_cents is the line's transportation_base_cents only."
    roles: [ShipperUser, RevenueAuditor]
    code: 201
    input: [shipment_id, "claimed_reason?"]
    output: GuaranteeClaim
    side_effects:
      - "status = FILED; filed_by_user_id = X-User-ID; invoice_line_id resolved to the shipment's live line"
      - "guarantee_deadline_utc, delivered_at, late_by_seconds and candidate_refund_cents set by calculations.guarantee_refund"
  - method: POST
    path: "/guarantee-claims/scan"
    description: "Audit sweep: file a claim for every eligible late shipment of one shipper whose pickup_date falls in the inclusive [period_start, period_end] range. Ineligible shipments are skipped silently — the sweep never fails on a single package."
    roles: [RevenueAuditor]
    code: 200
    input: [shipper_id, period_start, period_end]
    output: "{ filed_count: integer, skipped_count: integer, claim_ids: string[] }"
    side_effects:
      - "creates one FILED GuaranteeClaim per eligible shipment, oldest pickup_date first, exactly as POST /guarantee-claims would"
  - method: POST
    path: "/guarantee-claims/{id}/adjudicate"
    description: "Approve or deny a FILED claim. APPROVED proposes a GUARANTEE_REFUND adjustment for the candidate refund; the money only moves once a billing operator applies it."
    roles: [RevenueAuditor]
    code: 200
    input: [outcome]
    output: GuaranteeClaim
    side_effects:
      - "status = APPROVED or DENIED; adjudicated_at = logical clock"
      - "on APPROVED: creates a PROPOSED BillingAdjustment with reason = GUARANTEE_REFUND, delta_cents = -candidate_refund_cents, guarantee_claim_id set and created_by_user_id = X-User-ID; Invoice.pending_adjustment_count += 1"
      - "increments GuaranteeClaim.version by 1"
  - method: GET
    path: "/guarantee-claims/{id}"
    description: "Read one guarantee claim with its lateness in seconds, candidate refund and settled refund."
    roles: [BillingOps, RevenueAuditor, ShipperUser]
    code: 200
    input: []
    output: GuaranteeClaim
    side_effects: []
  - method: GET
    path: "/guarantee-claims"
    description: "List guarantee claims, filterable by shipment, by invoice line and by status."
    roles: [BillingOps, RevenueAuditor, ShipperUser]
    code: 200
    input: ["shipment_id?", "invoice_line_id?", "status?", "limit?", "offset?"]
    output: GuaranteeClaim[]
    side_effects: []

  # ---- Test-driving surface ------------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock, which every timestamp, deadline and window comparison in this domain reads. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z and never falls back to real wall-clock time."
    roles: [CarrierAdmin]
    code: 200
    input: [now_utc]
    output: "{ now_utc: string }"
    side_effects:
      - "the logical clock returns now_utc for every subsequent request until it is set again"

errors:
  # ---- auth ----------------------------------------------------------------
  - id: ERR_MISSING_AUTH_HEADERS
    http: 401
    condition: "X-User-Role or X-User-ID is absent or empty on any request"
  - id: ERR_UNKNOWN_ROLE
    http: 401
    condition: "X-User-Role is not one of CarrierAdmin, CarrierOps, BillingOps, RevenueAuditor, ShipperUser"
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "the caller's role is not listed in the endpoint's roles"
  - id: ERR_SHIPPER_SCOPE_VIOLATION
    http: 403
    condition: "a ShipperUser reaches a shipment, invoice, invoice line, dispute or claim belonging to another ShipperAccount, or names a shipper_id other than its own X-User-ID"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the operator applying a billing adjustment is the same user who proposed it (X-User-ID == created_by_user_id)"
  # ---- not found -----------------------------------------------------------
  - id: ERR_SHIPPER_NOT_FOUND
    http: 404
    condition: "no ShipperAccount exists for the given id"
  - id: ERR_CONTRACT_NOT_FOUND
    http: 404
    condition: "no RateContract exists for the given id, including a supersedes_contract_id that resolves to nothing"
  - id: ERR_SERVICE_LEVEL_NOT_FOUND
    http: 404
    condition: "no ServiceLevel exists for the given id"
  - id: ERR_SURCHARGE_WINDOW_NOT_FOUND
    http: 404
    condition: "no SurchargeWindow exists for the given id"
  - id: ERR_SHIPMENT_NOT_FOUND
    http: 404
    condition: "no Shipment exists for the given id"
  - id: ERR_ACCESSORIAL_NOT_FOUND
    http: 404
    condition: "no AccessorialCharge exists for the given id"
  - id: ERR_INVOICE_NOT_FOUND
    http: 404
    condition: "no Invoice exists for the given id"
  - id: ERR_INVOICE_LINE_NOT_FOUND
    http: 404
    condition: "no InvoiceLine exists for the given id"
  - id: ERR_ADJUSTMENT_NOT_FOUND
    http: 404
    condition: "no BillingAdjustment exists for the given id"
  - id: ERR_DISPUTE_NOT_FOUND
    http: 404
    condition: "no Dispute exists for the given id"
  - id: ERR_CLAIM_NOT_FOUND
    http: 404
    condition: "no GuaranteeClaim exists for the given id"
  # ---- schema --------------------------------------------------------------
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "a required input field is missing, a value has the wrong type, an enum value is not a declared member, a dimension or weight is <= 0, a cents amount is not an integer, delta_cents is 0, or a dimension carries more than one decimal place"
  - id: ERR_INVALID_PAGINATION
    http: 400
    condition: "limit is outside [1, 100] or offset is negative"
  - id: ERR_DUPLICATE_KEY
    http: 409
    condition: "account_number, ServiceLevel.code, SurchargeWindow.code or tracking_number already exists"
  # ---- optimistic concurrency ----------------------------------------------
  - id: ERR_STALE_SHIPPER_VERSION
    http: 412
    condition: "expected_shipper_account_version does not equal the owning ShipperAccount's current version on POST /rate-contracts/{id}/activate"
  - id: ERR_STALE_SHIPMENT_VERSION
    http: 412
    condition: "expected_shipment_version does not equal the shipment's current version on POST /shipments/{id}/scans"
  - id: ERR_STALE_INVOICE_VERSION
    http: 412
    condition: "expected_invoice_version does not equal the owning invoice's current version on POST /billing-adjustments"
  # ---- state preconditions -------------------------------------------------
  - id: ERR_SHIPPER_SUSPENDED
    http: 409
    condition: "a shipment is inducted for a ShipperAccount whose status is SUSPENDED"
  - id: ERR_CONTRACT_NOT_ACTIVATABLE
    http: 409
    condition: "activation targets a contract that is not DRAFT, or its supersedes_contract_id target is not an ACTIVE contract of the same shipper"
  - id: ERR_WINDOW_NOT_IN_STATE
    http: 409
    condition: "activation targets a window that is not SCHEDULED, or cancellation targets a window that is already CANCELLED"
  - id: ERR_MEASUREMENT_FINAL
    http: 409
    condition: "a scan is captured for a shipment whose measurement_status is already VERIFIED"
  - id: ERR_SHIPMENT_NOT_IN_TRANSIT
    http: 409
    condition: "delivery or an exception is recorded for a shipment whose movement_status is no longer IN_TRANSIT"
  - id: ERR_ACCESSORIAL_NOT_WAIVABLE
    http: 409
    condition: "a waive targets an accessorial charge that is already WAIVED or REVERSED"
  - id: ERR_INVOICE_NOT_IN_STATE
    http: 409
    condition: "issue targets an invoice that is not OPEN or has no lines; settle targets an invoice that is not ISSUED or ADJUSTED or still has a PROPOSED adjustment; void targets an invoice that is already SETTLED or VOID"
  - id: ERR_INVOICE_NOT_ADJUSTABLE
    http: 409
    condition: "an adjustment is proposed or applied against a line whose invoice is OPEN (edit it in place instead), SETTLED or VOID"
  - id: ERR_ADJUSTMENT_NOT_PENDING
    http: 409
    condition: "apply or reject targets an adjustment that is already APPLIED or REJECTED"
  - id: ERR_INVOICE_NOT_DISPUTABLE
    http: 409
    condition: "a dispute is opened or resolved against a line whose invoice is not ISSUED or ADJUSTED"
  - id: ERR_DISPUTE_NOT_IN_STATE
    http: 409
    condition: "evidence, an evidence request or a resolution reaches a dispute in a state that does not admit it, including any transition out of the terminal UPHELD and DENIED states"
  - id: ERR_CLAIM_NOT_ADJUDICABLE
    http: 409
    condition: "adjudication targets a guarantee claim that is no longer FILED"
  - id: ERR_SHIPMENT_NOT_DELIVERED
    http: 409
    condition: "a guarantee claim is filed for a shipment whose movement_status is not DELIVERED"
  - id: ERR_LINE_ALREADY_FROZEN
    http: 409
    condition: "an exception, a manual accessorial or a waive would change the money on a shipment whose invoice line is frozen by an ISSUED, ADJUSTED or SETTLED invoice — the correction must go through a billing adjustment"
  # ---- temporal ------------------------------------------------------------
  - id: ERR_INVALID_PERIOD
    http: 422
    condition: "effective_to is before effective_from, period_end is before period_start, or end_date is not strictly after start_date"
  - id: ERR_CONTRACT_PERIOD_OVERLAP
    http: 409
    condition: "the new contract's closed [effective_from, effective_to] interval intersects another DRAFT or ACTIVE contract of the same shipper, touching endpoints included; the contract named by supersedes_contract_id is exempt from the scan"
  - id: ERR_SURCHARGE_WINDOW_OVERLAP
    http: 409
    condition: "the new window's half-open [start_date, end_date) interval intersects another SCHEDULED or ACTIVE window of the same kind and scope; abutting windows where one ends exactly where the next starts do not collide"
  - id: ERR_DISPUTE_WINDOW_CLOSED
    http: 422
    condition: "the logical clock has passed the invoice's dispute_deadline_utc"
  - id: ERR_CLAIM_WINDOW_CLOSED
    http: 422
    condition: "the logical clock has passed delivered_at plus CLAIM_WINDOW_DAYS"
  # ---- referential ---------------------------------------------------------
  - id: ERR_DUPLICATE_DISPUTE
    http: 409
    condition: "the invoice line already carries a dispute that is SUBMITTED, UNDER_REVIEW, EVIDENCE_REQUESTED or UPHELD"
  - id: ERR_DUPLICATE_CLAIM
    http: 409
    condition: "the shipment already carries a guarantee claim that is FILED, APPROVED or REFUNDED"
  - id: ERR_SHIPMENT_ALREADY_BILLED
    http: 409
    condition: "an explicitly included shipment already sits on a line of a non-VOID invoice"
  - id: ERR_NO_ACTIVE_CONTRACT
    http: 422
    condition: "no ACTIVE RateContract of the shipper covers the shipment's pickup date"
  - id: ERR_RATE_ROW_MISSING
    http: 422
    condition: "the governing contract's rate_table has no row covering the shipment's zone and billable weight"
  - id: ERR_DISPUTED_CODE_NOT_ASSESSED
    http: 422
    condition: "an ACCESSORIAL dispute names no code, or names a code with no ASSESSED charge on the disputed line's shipment; or a WEIGHT dispute names disputed_codes"
  # ---- business constraints ------------------------------------------------
  - id: ERR_NO_BILLABLE_SHIPMENTS
    http: 422
    condition: "the billing sweep found no shipment matching calculations.invoice_sweep_selection for the shipper and period"
  - id: ERR_SCAN_TOLERANCE_UNRESOLVED
    http: 409
    condition: "an explicitly included shipment has measurement_status TOLERANCE_FLAGGED and must be reweighed or verified before it can be billed"
  - id: ERR_EVIDENCE_ROUNDS_EXHAUSTED
    http: 409
    condition: "an evidence request would push round_count past MAX_EVIDENCE_ROUNDS"
  - id: ERR_EVIDENCE_REQUIRED
    http: 422
    condition: "a dispute is upheld with accepted_evidence_count == 0"
  - id: ERR_SERVICE_NOT_GUARANTEED
    http: 422
    condition: "a guarantee claim is filed on a shipment whose ServiceLevel.guaranteed is false"
  - id: ERR_SHIPMENT_NOT_INVOICED
    http: 422
    condition: "a guarantee claim is filed on a shipment with no live line on an ISSUED or ADJUSTED invoice — there is nothing to refund"
  - id: ERR_GUARANTEE_SUSPENDED
    http: 422
    condition: "an ACTIVE PEAK_SEASON surcharge window covers the shipment's pickup date, so the money-back guarantee is suspended"
  - id: ERR_SHIPMENT_NOT_LATE
    http: 422
    condition: "delivered_at is at or before guarantee_deadline_utc — a delivery landing exactly on the commitment instant is on time"
  # ---- fiscal --------------------------------------------------------------
  - id: ERR_ADJUSTMENT_EXCEEDS_LINE
    http: 422
    condition: "a credit adjustment is larger than the invoice line's current line_total_cents"
  - id: ERR_CREDIT_EXCEEDS_INVOICE_NET
    http: 422
    condition: "a credit adjustment would drive the invoice's net_amount_cents below zero"

