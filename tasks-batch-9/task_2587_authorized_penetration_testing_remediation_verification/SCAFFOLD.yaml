# =============================================================================
# task_2587 — Authorized Penetration Testing & Remediation Verification
# Seed tables (§1.0–§1.7). Difficulty band: beyond Expert.
# =============================================================================

scenario: |
  Generate task harder than expert level!

  2587. Authorized Penetration Testing & Remediation Verification (enterprise
  security assessment program): annual test plan with scope selection across
  applications, networks and cloud environments driven by risk and compliance
  requirements, rules of engagement documentation with authorized targets,
  testing windows, exclusions and emergency stop procedures, tester
  qualification, background checks and access provisioning with least
  privilege, testing execution with real-time communication for critical
  findings requiring immediate action, finding documentation with reproduction
  steps, severity rating and business impact narrative, remediation assignment
  with owner, due date and validation requirements, retest verification with
  evidence and closure sign-off, trend analysis across engagements and root
  cause themes feeding secure development training

domain_name: pentest-assurance
api_prefix: /pentest

# =============================================================================
# Complexity profile (§0.1–§0.3)
# =============================================================================
complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: flat
  # Twelve peer entities linked exclusively by declared foreign keys. Every
  # collection is addressed as `/pentest/<collection>` — no entity is nested
  # inside another entity's URL path. Sub-resource GETs exist only as
  # reverse-reachability read channels, never as creation paths.

  state_machine_shape: parallel
  # Engagement carries two independent state axes (execution_state x
  # authorization_state); Finding, Remediation, Asset and Tester are cyclic;
  # TestPlan is compound (auto-closes from its children).

  relationship_patterns:
    - one_to_many          # TestPlan -> ScopeItem/Engagement, Finding -> Remediation
    - many_to_many         # ScopeItem and AuthorizedTarget both associate Asset with a program artifact
    - self_referential     # Finding.duplicate_of_finding_id -> Finding.id
    - cross_aggregate      # Finding closure mutates TestPlan ledger and Asset counters

  role_model: segregation_of_duties
  # The tester who discovered a finding may not verify its retest; the
  # remediation owner may not sign closure off; the officer who signs a rules
  # of engagement document may not be the user who drafted it.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Asset
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Human label of the testable asset", constraints: "1..120 chars, non-blank" }
      - { name: asset_class, type: enum, source: input, description: "APPLICATION | NETWORK | CLOUD — drives the target cooldown constant" }
      - { name: criticality_tier, type: integer, source: input, description: "Business criticality, 1 = most critical", constraints: "integer in {1,2,3,4}" }
      - { name: compliance_regimes, type: array, source: input, description: "Subset of {PCI_DSS, HIPAA, SOX, SOC2, FEDRAMP}; may be empty", constraints: "no duplicates" }
      - { name: exposure_score, type: number, source: input, description: "Attack-surface exposure metric", constraints: "0..100, at most 2 decimals" }
      - { name: last_tested_at, type: datetime, source: input, description: "Completion instant of the previous authorized test; null when never tested", default: null }
      - { name: exposure_state, type: enum, source: system, description: "MONITORED | ELEVATED | CLEARED — cyclic, driven by open critical findings", default: MONITORED }
      - { name: open_finding_count, type: integer, source: computed, description: "Count of Finding rows on this asset with status NOT IN {CLOSED, DUPLICATE, RISK_ACCEPTED}", default: 0 }
      - { name: open_critical_finding_count, type: integer, source: computed, description: "Count of Finding rows on this asset with severity_band = CRITICAL and status NOT IN {CLOSED, DUPLICATE, RISK_ACCEPTED}", default: 0 }
      - { name: remediated_finding_count, type: integer, source: computed, description: "Count of Finding rows on this asset with status = CLOSED", default: 0 }
      - { name: last_cleared_at, type: datetime, source: system, description: "Logical-clock instant at which exposure_state last became CLEARED", default: null }

  - name: TestPlan
    parent: null
    common_fields: true
    fields:
      - { name: fiscal_year, type: integer, source: input, description: "Annual program year", constraints: "2026..2099" }
      - { name: prioritization_mode, type: enum, source: input, description: "RISK_DRIVEN | COMPLIANCE_DRIVEN — selects the scope_priority_score variant", default: RISK_DRIVEN }
      - { name: risk_appetite_score, type: integer, source: input, description: "Program risk appetite; higher appetite admits lower-scoring scope", constraints: "0..100" }
      - { name: planned_engagement_count, type: integer, source: input, description: "Number of engagements the program intends to run this year", constraints: "1..50" }
      - { name: admission_threshold, type: number, source: computed, description: "= 100 - risk_appetite_score; scope below this needs an override_note to be approved" }
      - { name: coverage_score, type: number, source: computed, description: "Percentage of registered tier-1/tier-2 assets covered by APPROVED or CONSUMED scope items, 2 decimals", default: 0 }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | CLOSED — CLOSED is reached only by child bubble-up", default: DRAFT }
      - { name: total_risk_points, type: integer, source: computed, description: "Sum of Finding.severity_points over every Finding of every Engagement of this plan", default: 0 }
      - { name: open_risk_points, type: integer, source: computed, description: "Severity points of findings with status IN {REPORTED, TRIAGED, REMEDIATION_ASSIGNED, REMEDIATION_SUBMITTED, RETEST_PASSED, RETEST_FAILED}", default: 0 }
      - { name: closed_risk_points, type: integer, source: computed, description: "Severity points of findings with status = CLOSED", default: 0 }
      - { name: accepted_risk_points, type: integer, source: computed, description: "Severity points of findings with status = RISK_ACCEPTED", default: 0 }
      - { name: duplicate_risk_points, type: integer, source: computed, description: "Severity points of findings with status = DUPLICATE", default: 0 }

  - name: ScopeItem
    parent: null
    common_fields: true
    fields:
      - { name: test_plan_id, type: string, source: input, description: "FK -> TestPlan.id; the annual plan this candidate belongs to" }
      - { name: asset_id, type: string, source: input, description: "FK -> Asset.id; the asset proposed for testing" }
      - { name: justification, type: string, source: input, description: "Why this asset is a candidate", constraints: "1..500 chars" }
      - { name: requested_engagement_hours, type: number, source: input, description: "Planning estimate of tester hours", constraints: "> 0, <= 400" }
      - { name: priority_score, type: number, source: computed, description: "Output of calculations.scope_priority_score under scored_mode, 2 decimals" }
      - { name: priority_rank, type: integer, source: computed, description: "1-based rank inside the plan; see calculations.scope_priority_rank for filter, sort key and tie-break" }
      - { name: below_threshold_flag, type: boolean, source: computed, description: "= priority_score < TestPlan.admission_threshold" }
      - { name: status, type: enum, source: system, description: "PROPOSED | APPROVED | DEFERRED | WITHDRAWN | CONSUMED", default: PROPOSED }
      - { name: decision_note, type: string, source: system, description: "Note or override_note captured by the latest decision", default: null }
      - { name: scored_mode, type: enum, source: computed, description: "RISK_DRIVEN | COMPLIANCE_DRIVEN — the mode that produced the current priority_score" }

  - name: Engagement
    parent: null
    common_fields: true
    fields:
      - { name: test_plan_id, type: string, source: input, description: "FK -> TestPlan.id" }
      - { name: scope_item_id, type: string, source: input, description: "FK -> ScopeItem.id; must be APPROVED at creation and becomes CONSUMED" }
      - { name: engagement_type, type: enum, source: input, description: "APPLICATION_TEST | NETWORK_TEST | CLOUD_REVIEW" }
      - { name: window_start, type: datetime, source: input, description: "Inclusive start of the engagement testing window" }
      - { name: window_end, type: datetime, source: input, description: "Inclusive end of the engagement testing window", constraints: "> window_start" }
      - { name: hours_allocated, type: number, source: input, description: "Tester-hour budget granted to this engagement", constraints: "> 0, <= 2000" }
      - { name: hours_reserved, type: number, source: computed, description: "Sum of requested_hours over TesterAssignment rows with access_state IN {REQUESTED, PROVISIONED}", default: 0 }
      - { name: hours_consumed, type: number, source: computed, description: "Sum of settled_hours over TesterAssignment rows with access_state = REVOKED", default: 0 }
      - { name: hours_available, type: number, source: computed, description: "= hours_allocated - hours_reserved - hours_consumed", default: 0 }
      - { name: execution_state, type: enum, source: system, description: "PLANNED | EXECUTING | FIELDWORK_COMPLETE | REPORTED | CLOSED — execution axis", default: PLANNED }
      - { name: authorization_state, type: enum, source: system, description: "ROE_PENDING | AUTHORIZED | SUSPENDED | TERMINATED — authorization axis, independent of execution_state", default: ROE_PENDING }
      - { name: suspension_reason, type: string, source: system, description: "Reason captured by the latest emergency stop", default: null }
      - { name: provisional_assurance_score, type: number, source: computed, description: "PROVISIONAL variant of calculations.engagement_assurance_score, stamped at COMPLETE_FIELDWORK", default: null }
      - { name: final_assurance_score, type: number, source: computed, description: "FINAL variant of calculations.engagement_assurance_score, stamped at CLOSE", default: null }

  - name: RulesOfEngagement
    parent: null
    common_fields: true
    fields:
      - { name: engagement_id, type: string, source: input, description: "FK -> Engagement.id; at most one RulesOfEngagement per engagement with status IN {DRAFT, SIGNED, SUSPENDED}" }
      - { name: drafted_by_user_id, type: string, source: system, description: "X-User-ID of the ProgramManager who created the document" }
      - { name: exclusions, type: array, source: input, description: "Out-of-scope host, path or account identifiers", constraints: "0..50 strings" }
      - { name: allowed_techniques, type: array, source: input, description: "Subset of {SQLI, XSS, AUTHZ_BYPASS, PHISHING, LATERAL_MOVEMENT, IAM_ESCALATION, DOS}", constraints: "non-empty, no duplicates" }
      - { name: emergency_stop_procedure, type: string, source: input, description: "Documented stop procedure text", constraints: "1..500 chars" }
      - { name: escalation_contact, type: string, source: input, description: "Contact reachable for critical findings", constraints: "1..120 chars" }
      - { name: status, type: enum, source: system, description: "DRAFT | SIGNED | SUSPENDED | REVOKED", default: DRAFT }
      - { name: signed_by_user_id, type: string, source: system, description: "X-User-ID of the ComplianceOfficer who signed; must differ from drafted_by_user_id", default: null }
      - { name: signed_at, type: datetime, source: system, description: "Logical-clock instant of signature", default: null }
      - { name: active_target_count, type: integer, source: computed, description: "Count of AuthorizedTarget rows on this document with state = ACTIVE", default: 0 }

  - name: AuthorizedTarget
    parent: null
    common_fields: true
    fields:
      - { name: roe_id, type: string, source: input, description: "FK -> RulesOfEngagement.id" }
      - { name: asset_id, type: string, source: input, description: "FK -> Asset.id" }
      - { name: window_start, type: datetime, source: input, description: "Inclusive start of the authorized testing window for this target" }
      - { name: window_end, type: datetime, source: input, description: "Inclusive end of the authorized testing window", constraints: "> window_start" }
      - { name: technique_allowlist, type: array, source: input, description: "Techniques permitted on this target; must be a subset of the document's allowed_techniques", constraints: "non-empty" }
      - { name: state, type: enum, source: system, description: "ACTIVE | EXCLUDED | SUSPENDED", default: ACTIVE }
      - { name: exclusion_reason, type: string, source: system, description: "Reason captured when the target moved to EXCLUDED", default: null }
      - { name: cooldown_hours, type: integer, source: computed, description: "COOLDOWN_HOURS[asset.asset_class] — buffer applied on both sides of this window when detecting collisions" }

  - name: Tester
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Tester name", constraints: "1..120 chars" }
      - { name: certifications, type: array, source: input, description: "Subset of {OSCP, GPEN, CREST, CISSP}; may be empty", constraints: "no duplicates" }
      - { name: max_concurrent_engagements, type: integer, source: input, description: "Aggregate cap on interval-overlapping assignments", default: 2, constraints: "1..5" }
      - { name: clearance_expires_at, type: datetime, source: input, description: "Instant after which the tester's clearance is no longer valid" }
      - { name: background_check_status, type: enum, source: system, description: "PENDING | CLEARED | FLAGGED | EXPIRED", default: PENDING }
      - { name: background_check_at, type: datetime, source: system, description: "Logical-clock instant of the most recent background check", default: null }
      - { name: qualification_score, type: number, source: computed, description: "= min(100, sum of CERT_POINTS over certifications); LEAD assignments require >= 60" }
      - { name: availability_state, type: enum, source: system, description: "PENDING_CLEARANCE | AVAILABLE | ASSIGNED | SUSPENDED — cyclic", default: PENDING_CLEARANCE }
      - { name: active_assignment_count, type: integer, source: computed, description: "Count of TesterAssignment rows for this tester with access_state = PROVISIONED", default: 0 }

  - name: TesterAssignment
    parent: null
    common_fields: true
    fields:
      - { name: engagement_id, type: string, source: input, description: "FK -> Engagement.id" }
      - { name: tester_id, type: string, source: input, description: "FK -> Tester.id" }
      - { name: assignment_role, type: enum, source: input, description: "LEAD | MEMBER" }
      - { name: interval_start, type: datetime, source: input, description: "Inclusive start of the occupation interval on this tester" }
      - { name: interval_end, type: datetime, source: input, description: "Exclusive end of the occupation interval on this tester", constraints: "> interval_start" }
      - { name: requested_hours, type: number, source: input, description: "Tester hours reserved out of the engagement budget", constraints: "> 0, <= 400" }
      - { name: granted_asset_ids, type: array, source: input, description: "Least-privilege asset grant; validated as a subset of the engagement's ACTIVE authorized targets at PROVISION time", constraints: "0..20 Asset ids, no duplicates" }
      - { name: access_state, type: enum, source: system, description: "REQUESTED | PROVISIONED | REVOKED", default: REQUESTED }
      - { name: provisioned_at, type: datetime, source: system, description: "Logical-clock instant of access provisioning", default: null }
      - { name: revoked_at, type: datetime, source: system, description: "Logical-clock instant of access revocation", default: null }
      - { name: settled_hours, type: number, source: computed, description: "Output of calculations.assignment_hour_settlement; 0 until the assignment is REVOKED", default: 0 }

  - name: Finding
    parent: null
    common_fields: true
    fields:
      - { name: engagement_id, type: string, source: input, description: "FK -> Engagement.id" }
      - { name: asset_id, type: string, source: input, description: "FK -> Asset.id; must be an ACTIVE authorized target of the engagement's SIGNED document" }
      - { name: discovered_by_tester_id, type: string, source: system, description: "FK -> Tester.id; taken from X-User-ID of the reporting Tester, never from the request body" }
      - { name: duplicate_of_finding_id, type: string, source: system, description: "FK -> Finding.id; set only by triage action MARK_DUPLICATE, null otherwise", default: null }
      - { name: title, type: string, source: input, description: "Short finding title", constraints: "1..160 chars" }
      - { name: reproduction_steps, type: string, source: input, description: "Ordered reproduction instructions", constraints: "1..2000 chars, non-blank" }
      - { name: business_impact_narrative, type: string, source: input, description: "Business impact prose required for every finding", constraints: "1..2000 chars, non-blank" }
      - { name: technical_base_score, type: number, source: input, description: "Technical base severity before contextual adjustment", constraints: "0.0..10.0, at most 2 decimals" }
      - { name: exposure_class, type: enum, source: input, description: "INTERNAL | PARTNER | INTERNET — selects EXPOSURE_MULT and the alert deadline" }
      - { name: root_cause_theme, type: enum, source: input, description: "INPUT_VALIDATION | ACCESS_CONTROL | CRYPTO_MISCONFIG | PATCH_MANAGEMENT | SECRETS_HANDLING | CLOUD_IAM" }
      - { name: severity_score, type: number, source: computed, description: "Output of calculations.finding_severity_rating, 2 decimals, clamped to 0.00..10.00" }
      - { name: severity_band, type: enum, source: computed, description: "LOW | MEDIUM | HIGH | CRITICAL from severity_score thresholds" }
      - { name: severity_points, type: integer, source: computed, description: "SEVERITY_POINTS[severity_band] — the conserved unit of the TestPlan risk ledger" }
      - { name: immediate_action_required, type: boolean, source: computed, description: "= (severity_band == CRITICAL); a CriticalAlert row exists exactly when this is true" }
      - { name: status, type: enum, source: system, description: "REPORTED | TRIAGED | RISK_ACCEPTED | REMEDIATION_ASSIGNED | REMEDIATION_SUBMITTED | RETEST_PASSED | RETEST_FAILED | CLOSED | DUPLICATE", default: REPORTED }
      - { name: discovered_at, type: datetime, source: system, description: "Logical-clock instant at creation; the trend-analysis window filter uses this field" }
      - { name: closed_at, type: datetime, source: system, description: "Logical-clock instant at which status became CLOSED", default: null }

  - name: CriticalAlert
    parent: null
    common_fields: true
    fields:
      - { name: finding_id, type: string, source: system, description: "FK -> Finding.id; created only as a side effect of a CRITICAL finding" }
      - { name: raised_at, type: datetime, source: system, description: "Logical-clock instant at which the alert was raised (equals Finding.discovered_at)" }
      - { name: ack_deadline_at, type: datetime, source: computed, description: "= raised_at + ACK_DEADLINE_MINUTES[finding.exposure_class] minutes" }
      - { name: acknowledged_at, type: datetime, source: system, description: "Logical-clock instant of acknowledgement", default: null }
      - { name: acknowledged_by_user_id, type: string, source: system, description: "X-User-ID of the acknowledging operator", default: null }
      - { name: containment_action, type: string, source: system, description: "Containment step recorded at acknowledgement", default: null }
      - { name: escalation_level, type: integer, source: system, description: "1 when acknowledged at or before ack_deadline_at, 2 when acknowledged later", default: 1 }
      - { name: state, type: enum, source: system, description: "RAISED | ACKNOWLEDGED | ESCALATED", default: RAISED }

  - name: Remediation
    parent: null
    common_fields: true
    fields:
      - { name: finding_id, type: string, source: input, description: "FK -> Finding.id" }
      - { name: owner_user_id, type: string, source: input, description: "Opaque X-User-ID of the RemediationOwner accountable for the fix", constraints: "1..64 chars" }
      - { name: validation_requirement, type: enum, source: input, description: "RETEST_REQUIRED | EVIDENCE_ONLY — RETEST_REQUIRED forces a Tester verifier" }
      - { name: remediation_plan, type: string, source: input, description: "Planned corrective action", constraints: "1..2000 chars" }
      - { name: sla_days, type: integer, source: computed, description: "Output of calculations.remediation_due_date; regime cap can beat the severity default" }
      - { name: due_at, type: datetime, source: computed, description: "= creation-time logical clock + sla_days days; shifted by extensions" }
      - { name: extension_count, type: integer, source: system, description: "Number of granted extensions; capped by MAX_EXTENSIONS", default: 0 }
      - { name: overdue_flag, type: boolean, source: computed, description: "= (current_utc > due_at) AND status NOT IN {VALIDATED, CLOSED}; exactly at due_at it is false", default: false }
      - { name: status, type: enum, source: system, description: "ASSIGNED | SUBMITTED | VALIDATED | PARTIALLY_VALIDATED | REJECTED | CLOSED", default: ASSIGNED }
      - { name: submitted_at, type: datetime, source: system, description: "Logical-clock instant of the latest owner submission", default: null }
      - { name: evidence_uri, type: string, source: system, description: "Evidence pointer supplied by the owner at submission", default: null }

  - name: RetestVerification
    parent: null
    common_fields: true
    fields:
      - { name: remediation_id, type: string, source: input, description: "FK -> Remediation.id" }
      - { name: verifier_tester_id, type: string, source: system, description: "FK -> Tester.id; taken from X-User-ID when the actor is a Tester, null when a ComplianceOfficer verifies an EVIDENCE_ONLY remediation", default: null }
      - { name: evidence_uri, type: string, source: input, description: "Pointer to the retest evidence bundle", constraints: "1..500 chars" }
      - { name: outcome, type: enum, source: input, description: "PASS | FAIL | PARTIAL" }
      - { name: residual_note, type: string, source: input, description: "Residual risk description; required when outcome != PASS", default: null }
      - { name: state, type: enum, source: system, description: "VERIFIED | SIGNED_OFF | SUPERSEDED", default: VERIFIED }
      - { name: verified_at, type: datetime, source: system, description: "Logical-clock instant at which the verification was recorded" }
      - { name: days_late, type: integer, source: computed, description: "= max(0, floor((verified_at - remediation.due_at) / 86400 seconds))" }
      - { name: signed_off_by_user_id, type: string, source: system, description: "X-User-ID of the signing ComplianceOfficer; must differ from remediation.owner_user_id", default: null }
      - { name: signed_off_at, type: datetime, source: system, description: "Logical-clock instant of closure sign-off", default: null }
      - { name: closure_note, type: string, source: system, description: "Closure note captured at sign-off", default: null }

  - name: TrainingRecommendation
    parent: null
    common_fields: false
    fields:
      - { name: test_plan_id, type: string, source: input, description: "FK -> TestPlan.id; the plan whose engagements were analysed" }
      - { name: root_cause_theme, type: enum, source: system, description: "The theme this immutable analytics record summarises" }
      - { name: window_start, type: datetime, source: system, description: "Inclusive start of the analysed discovery window" }
      - { name: window_end, type: datetime, source: system, description: "Inclusive end of the analysed discovery window" }
      - { name: recurrence_count, type: integer, source: computed, description: "Number of contributing findings for this theme in the window" }
      - { name: priority_score, type: number, source: computed, description: "Output of calculations.training_priority_score, 2 decimals, rounding order pinned" }
      - { name: urgency_band, type: enum, source: computed, description: "MANDATORY | RECOMMENDED — MANDATORY iff recurrence_count >= 3 AND priority_score >= 8.00" }
      - { name: source_engagement_count, type: integer, source: computed, description: "Number of distinct engagements the contributing findings came from" }
      - { name: generated_at, type: datetime, source: system, description: "Logical-clock instant of generation; the recency factor is measured against it" }
      - { name: contributing_finding_ids, type: array, source: computed, description: "Ids of the findings that produced priority_score, ordered by discovered_at ASC then created_at ASC" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: TestPlan
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /pentest/test-plans/{id}/activate"
        actor: ProgramManager
        preconditions:
          - "TestPlan.status == DRAFT"
          - "count(ScopeItem WHERE test_plan_id == plan.id AND status == APPROVED) >= 1 — otherwise ERR_EMPTY_SCOPE_SELECTION"
          - "recomputed TestPlan.coverage_score >= COVERAGE_MIN_PCT (60.00) — otherwise ERR_COVERAGE_BELOW_MINIMUM"
        side_effects:
          - "recompute TestPlan.coverage_score per calculations.plan_coverage_score"
          - "increments TestPlan.version by 1"
      - from: ACTIVE
        to: CLOSED
        trigger: "system event: the last Engagement of the plan reaches execution_state CLOSED"
        actor: system
        preconditions:
          - "count(Engagement WHERE test_plan_id == plan.id) >= 1"
          - "every Engagement of the plan has execution_state == CLOSED"
        side_effects:
          - "TestPlan.status = CLOSED"
          - "increments TestPlan.version by 1"
        note: "Compound bubble-up; no endpoint closes a plan directly."

  - entity: ScopeItem
    initial_state: PROPOSED
    terminal_states: [WITHDRAWN, CONSUMED]
    transitions:
      - from: PROPOSED
        to: APPROVED
        trigger: "POST /pentest/scope-items/{id}/decision with decision = APPROVE"
        actor: ProgramManager | ComplianceOfficer
        preconditions:
          - "ScopeItem.status IN {PROPOSED, DEFERRED}"
          - "TestPlan.status == DRAFT"
          - "if ScopeItem.below_threshold_flag == true then payload.override_note is present and non-blank — otherwise ERR_BELOW_RISK_THRESHOLD"
        side_effects:
          - "ScopeItem.decision_note = payload.override_note when present, else payload.note"
          - "recompute TestPlan.coverage_score; increments TestPlan.version by 1"
      - from: PROPOSED
        to: DEFERRED
        trigger: "POST /pentest/scope-items/{id}/decision with decision = DEFER"
        actor: ProgramManager | ComplianceOfficer
        preconditions: ["ScopeItem.status == PROPOSED", "TestPlan.status == DRAFT"]
        side_effects: ["ScopeItem.decision_note = payload.note", "ScopeItem drops out of the priority_rank population; ranks of remaining PROPOSED/APPROVED items are recomputed"]
      - from: DEFERRED
        to: APPROVED
        trigger: "POST /pentest/scope-items/{id}/decision with decision = APPROVE"
        actor: ProgramManager | ComplianceOfficer
        preconditions: ["ScopeItem.status == DEFERRED", "TestPlan.status == DRAFT", "override_note present when below_threshold_flag == true"]
        side_effects: ["recompute TestPlan.coverage_score; increments TestPlan.version by 1"]
        note: "Revision loop: a deferred candidate can be re-admitted without recreating the row."
      - from: PROPOSED
        to: WITHDRAWN
        trigger: "POST /pentest/scope-items/{id}/decision with decision = WITHDRAW"
        actor: ProgramManager
        preconditions: ["ScopeItem.status IN {PROPOSED, DEFERRED}"]
        side_effects: ["ScopeItem.priority_rank = null", "ranks of remaining PROPOSED/APPROVED items are recomputed"]
      - from: APPROVED
        to: CONSUMED
        trigger: "POST /pentest/engagements (this scope item is the engagement's scope_item_id)"
        actor: ProgramManager
        preconditions: ["ScopeItem.status == APPROVED", "TestPlan.status == ACTIVE"]
        side_effects:
          - "ScopeItem.status = CONSUMED, freeing the (test_plan_id, asset_id) uniqueness slot for a follow-up candidate"

  - entity: Engagement
    axis: execution_state
    initial_state: PLANNED
    terminal_states: [CLOSED]
    transitions:
      - from: PLANNED
        to: EXECUTING
        trigger: "POST /pentest/engagements/{id}/execution with action = START"
        actor: ProgramManager | Tester
        preconditions:
          - "Engagement.execution_state == PLANNED"
          - "Engagement.authorization_state == AUTHORIZED — ROE_PENDING/TERMINATED give ERR_ENGAGEMENT_NOT_AUTHORIZED, SUSPENDED gives ERR_ENGAGEMENT_SUSPENDED"
          - "window_start <= current_utc <= window_end — otherwise ERR_OUTSIDE_TESTING_WINDOW"
        side_effects: ["increments Engagement.version by 1"]
      - from: EXECUTING
        to: FIELDWORK_COMPLETE
        trigger: "POST /pentest/engagements/{id}/execution with action = COMPLETE_FIELDWORK"
        actor: ProgramManager | Tester
        preconditions:
          - "Engagement.execution_state == EXECUTING"
          - "no CriticalAlert of any Finding of this engagement has state == RAISED — otherwise ERR_UNACKNOWLEDGED_CRITICAL_ALERT"
        side_effects:
          - "Engagement.provisional_assurance_score = calculations.engagement_assurance_score variant PROVISIONAL"
          - "increments Engagement.version by 1"
      - from: FIELDWORK_COMPLETE
        to: REPORTED
        trigger: "POST /pentest/engagements/{id}/execution with action = REPORT"
        actor: ProgramManager
        preconditions:
          - "Engagement.execution_state == FIELDWORK_COMPLETE"
          - "every Finding of this engagement has status != REPORTED (all findings triaged) — otherwise ERR_FINDING_NOT_TRIAGED"
        side_effects: ["increments Engagement.version by 1"]
      - from: REPORTED
        to: CLOSED
        trigger: "POST /pentest/engagements/{id}/execution with action = CLOSE"
        actor: ProgramManager
        preconditions:
          - "Engagement.execution_state == REPORTED"
          - "no CriticalAlert of any Finding of this engagement has state == RAISED"
        side_effects:
          - "Engagement.final_assurance_score = calculations.engagement_assurance_score variant FINAL"
          - "every TesterAssignment of this engagement with access_state IN {REQUESTED, PROVISIONED} is REVOKED (settling hours per calculations.assignment_hour_settlement)"
          - "TestPlan bubble-up: when every Engagement of the plan is CLOSED, TestPlan.status = CLOSED"
          - "increments Engagement.version by 1"

  - entity: Engagement
    axis: authorization_state
    initial_state: ROE_PENDING
    terminal_states: [TERMINATED]
    transitions:
      - from: ROE_PENDING
        to: AUTHORIZED
        trigger: "POST /pentest/rules-of-engagement/{id}/sign (cross-entity: the signature authorizes the engagement)"
        actor: ComplianceOfficer
        preconditions: ["Engagement.authorization_state == ROE_PENDING", "RulesOfEngagement.status == DRAFT", "RulesOfEngagement.active_target_count >= 1"]
        side_effects: ["increments Engagement.version by 1"]
      - from: AUTHORIZED
        to: SUSPENDED
        trigger: "POST /pentest/engagements/{id}/emergency-stop with stop_code = PAUSE"
        actor: ProgramManager | ComplianceOfficer
        preconditions: ["Engagement.authorization_state == AUTHORIZED"]
        side_effects:
          - "Engagement.suspension_reason = payload.reason"
          - "cascade link 1 -> 2: because the engagement is now SUSPENDED, its RulesOfEngagement moves SIGNED -> SUSPENDED"
          - "cascade link 2 -> 3: because that document is SUSPENDED, each of its AuthorizedTarget rows with state == ACTIVE moves to SUSPENDED"
          - "cascade link 3 -> 4: because those targets are SUSPENDED, every TesterAssignment of this engagement with access_state == PROVISIONED whose granted_asset_ids intersect the suspended targets' asset_ids moves to REVOKED"
          - "cascade link 4 -> 5: because those assignments are REVOKED, each one settles per calculations.assignment_hour_settlement — settled_hours stamped, Engagement.hours_reserved reduced by requested_hours, Engagement.hours_consumed increased by settled_hours, Engagement.hours_available recomputed, and Tester.active_assignment_count decremented"
          - "cascade link 5 -> 6: because a tester's active_assignment_count reached 0, that Tester moves availability_state ASSIGNED -> AVAILABLE"
          - "increments Engagement.version by 1"
        note: "Execution axis is untouched: an EXECUTING engagement stays EXECUTING while suspended, but finding creation is blocked by ERR_ENGAGEMENT_SUSPENDED."
      - from: SUSPENDED
        to: AUTHORIZED
        trigger: "POST /pentest/engagements/{id}/resume"
        actor: ComplianceOfficer
        preconditions: ["Engagement.authorization_state == SUSPENDED", "Engagement.execution_state != CLOSED"]
        side_effects:
          - "Engagement.suspension_reason = null"
          - "the engagement's RulesOfEngagement moves SUSPENDED -> SIGNED"
          - "each AuthorizedTarget of that document with state == SUSPENDED moves back to ACTIVE (EXCLUDED targets are not revived)"
          - "revoked TesterAssignment rows are NOT restored — access must be requested and provisioned again"
          - "increments Engagement.version by 1"
        note: "Authorization cycle AUTHORIZED -> SUSPENDED -> AUTHORIZED."
      - from: AUTHORIZED
        to: TERMINATED
        trigger: "POST /pentest/engagements/{id}/emergency-stop with stop_code = TERMINATE"
        actor: ComplianceOfficer
        preconditions: ["Engagement.authorization_state IN {AUTHORIZED, SUSPENDED}"]
        side_effects:
          - "Engagement.suspension_reason = payload.reason"
          - "the engagement's RulesOfEngagement moves to REVOKED and every AuthorizedTarget of that document moves to SUSPENDED"
          - "every TesterAssignment of this engagement with access_state IN {REQUESTED, PROVISIONED} moves to REVOKED with hour settlement"
          - "Engagement.execution_state is forced to CLOSED and Engagement.final_assurance_score is stamped"
          - "TestPlan bubble-up is evaluated exactly as for a normal CLOSE"
          - "increments Engagement.version by 1"
        note: "Divergent branch of the same trigger: PAUSE is reversible, TERMINATE is terminal on both axes."

  - entity: RulesOfEngagement
    initial_state: DRAFT
    terminal_states: [REVOKED]
    transitions:
      - from: DRAFT
        to: SIGNED
        trigger: "POST /pentest/rules-of-engagement/{id}/sign"
        actor: ComplianceOfficer
        preconditions:
          - "RulesOfEngagement.status == DRAFT"
          - "RulesOfEngagement.active_target_count >= 1 — otherwise ERR_NO_AUTHORIZED_TARGETS"
          - "X-User-ID != RulesOfEngagement.drafted_by_user_id — otherwise ERR_SOD_ROE_SIGNER_CONFLICT"
        side_effects:
          - "signed_by_user_id = X-User-ID, signed_at = current_utc"
          - "cross-entity: Engagement.authorization_state ROE_PENDING -> AUTHORIZED"
          - "increments RulesOfEngagement.version by 1"
      - from: SIGNED
        to: SUSPENDED
        trigger: "system event: the engagement's authorization_state became SUSPENDED (emergency stop PAUSE)"
        actor: system
        preconditions: ["RulesOfEngagement.status == SIGNED"]
        side_effects: ["each AuthorizedTarget with state == ACTIVE moves to SUSPENDED", "increments RulesOfEngagement.version by 1"]
      - from: SUSPENDED
        to: SIGNED
        trigger: "system event: the engagement was resumed"
        actor: system
        preconditions: ["RulesOfEngagement.status == SUSPENDED"]
        side_effects: ["each AuthorizedTarget with state == SUSPENDED moves back to ACTIVE", "increments RulesOfEngagement.version by 1"]
      - from: SIGNED
        to: REVOKED
        trigger: "system event: the engagement's authorization_state became TERMINATED"
        actor: system
        preconditions: ["RulesOfEngagement.status IN {DRAFT, SIGNED, SUSPENDED}"]
        side_effects: ["every AuthorizedTarget of this document moves to SUSPENDED", "increments RulesOfEngagement.version by 1"]

  - entity: AuthorizedTarget
    initial_state: ACTIVE
    terminal_states: [EXCLUDED]
    transitions:
      - from: ACTIVE
        to: EXCLUDED
        trigger: "POST /pentest/authorized-targets/{id}/exclude"
        actor: ProgramManager | ComplianceOfficer
        preconditions: ["AuthorizedTarget.state == ACTIVE", "RulesOfEngagement.status IN {DRAFT, SIGNED}"]
        side_effects:
          - "exclusion_reason = payload.reason"
          - "RulesOfEngagement.active_target_count decremented"
          - "the asset is no longer testable: subsequent POST /pentest/findings on it fail with ERR_TARGET_EXCLUDED"
          - "the window this target occupied is released, so a competing target on the same asset may be created"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system event: the parent document moved to SUSPENDED or REVOKED"
        actor: system
        preconditions: ["AuthorizedTarget.state == ACTIVE"]
        side_effects: ["RulesOfEngagement.active_target_count decremented"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: "system event: the parent document moved SUSPENDED -> SIGNED (engagement resumed)"
        actor: system
        preconditions: ["AuthorizedTarget.state == SUSPENDED", "RulesOfEngagement.status == SIGNED"]
        side_effects: ["RulesOfEngagement.active_target_count incremented"]

  - entity: Tester
    initial_state: PENDING_CLEARANCE
    terminal_states: []
    transitions:
      - from: PENDING_CLEARANCE
        to: AVAILABLE
        trigger: "POST /pentest/testers/{id}/background-check with result = CLEARED"
        actor: PlatformAdmin | ComplianceOfficer
        preconditions: ["Tester.availability_state IN {PENDING_CLEARANCE, SUSPENDED}", "Tester.clearance_expires_at > current_utc — otherwise ERR_CLEARANCE_EXPIRED"]
        side_effects: ["background_check_status = CLEARED", "background_check_at = current_utc"]
      - from: AVAILABLE
        to: ASSIGNED
        trigger: "POST /pentest/tester-assignments/{id}/access with action = PROVISION"
        actor: ProgramManager
        preconditions: ["Tester.background_check_status == CLEARED", "Tester.availability_state IN {AVAILABLE, ASSIGNED}"]
        side_effects: ["Tester.active_assignment_count incremented"]
      - from: ASSIGNED
        to: AVAILABLE
        trigger: "system event: the tester's last PROVISIONED assignment was revoked (active_assignment_count reached 0)"
        actor: system
        preconditions: ["Tester.active_assignment_count == 0"]
        side_effects: []
        note: "Terminal link of the emergency-stop cascade."
      - from: AVAILABLE
        to: SUSPENDED
        trigger: "POST /pentest/testers/{id}/background-check with result IN {FLAGGED, EXPIRED}"
        actor: PlatformAdmin | ComplianceOfficer
        preconditions: ["Tester.availability_state IN {AVAILABLE, ASSIGNED}"]
        side_effects:
          - "background_check_status = payload.result"
          - "every TesterAssignment of this tester with access_state == PROVISIONED moves to REVOKED with hour settlement on its engagement"
          - "Tester.active_assignment_count = 0"
        note: "Cyclic: a re-cleared tester returns to AVAILABLE through the CLEARED transition."

  - entity: TesterAssignment
    initial_state: REQUESTED
    terminal_states: [REVOKED]
    transitions:
      - from: REQUESTED
        to: PROVISIONED
        trigger: "POST /pentest/tester-assignments/{id}/access with action = PROVISION"
        actor: ProgramManager
        preconditions:
          - "TesterAssignment.access_state == REQUESTED"
          - "Engagement.authorization_state == AUTHORIZED"
          - "Tester.background_check_status == CLEARED — otherwise ERR_TESTER_NOT_CLEARED"
          - "Tester.clearance_expires_at > current_utc — otherwise ERR_CLEARANCE_EXPIRED"
          - "granted_asset_ids is a subset of {AuthorizedTarget.asset_id WHERE roe_id == the engagement's document AND state == ACTIVE} — otherwise ERR_GRANT_EXCEEDS_AUTHORIZED_SCOPE"
        side_effects:
          - "provisioned_at = current_utc"
          - "Tester.active_assignment_count incremented; Tester.availability_state -> ASSIGNED"
      - from: PROVISIONED
        to: REVOKED
        trigger: "POST /pentest/tester-assignments/{id}/access with action = REVOKE, or system cascade from emergency stop, engagement close, or a FLAGGED background check"
        actor: ProgramManager | system
        preconditions: ["TesterAssignment.access_state == PROVISIONED"]
        side_effects:
          - "revoked_at = current_utc; settled_hours = calculations.assignment_hour_settlement"
          - "Engagement.hours_reserved -= requested_hours; Engagement.hours_consumed += settled_hours; Engagement.hours_available recomputed — the ledger invariant hours_allocated == hours_reserved + hours_consumed + hours_available is preserved"
          - "Tester.active_assignment_count decremented; when it reaches 0 the Tester moves ASSIGNED -> AVAILABLE"
      - from: REQUESTED
        to: REVOKED
        trigger: "POST /pentest/tester-assignments/{id}/access with action = REVOKE (access never provisioned)"
        actor: ProgramManager | system
        preconditions: ["TesterAssignment.access_state == REQUESTED"]
        side_effects:
          - "revoked_at = current_utc; settled_hours = 0 (never provisioned, so nothing was consumed)"
          - "Engagement.hours_reserved -= requested_hours; Engagement.hours_available recomputed"

  - entity: Finding
    initial_state: REPORTED
    terminal_states: [CLOSED, DUPLICATE]
    transitions:
      - from: REPORTED
        to: TRIAGED
        trigger: "POST /pentest/findings/{id}/triage with action = ACCEPT"
        actor: ProgramManager | ComplianceOfficer
        preconditions: ["Finding.status == REPORTED"]
        side_effects: ["increments Finding.version by 1"]
      - from: REPORTED
        to: DUPLICATE
        trigger: "POST /pentest/findings/{id}/triage with action = MARK_DUPLICATE"
        actor: ProgramManager | ComplianceOfficer
        preconditions:
          - "Finding.status IN {REPORTED, TRIAGED}"
          - "payload.duplicate_of_finding_id is present, resolves to an existing Finding, is not this finding (ERR_DUPLICATE_SELF_REFERENCE) and that target has status != DUPLICATE"
        side_effects:
          - "Finding.duplicate_of_finding_id = payload.duplicate_of_finding_id"
          - "TestPlan ledger: open_risk_points -= severity_points; duplicate_risk_points += severity_points; total unchanged"
          - "Asset.open_finding_count decremented and, when severity_band == CRITICAL, Asset.open_critical_finding_count decremented"
          - "any CriticalAlert of this finding in state RAISED moves to ACKNOWLEDGED with containment_action 'DUPLICATE_OF_PRIOR_FINDING' and escalation_level unchanged"
      - from: REPORTED
        to: RISK_ACCEPTED
        trigger: "POST /pentest/findings/{id}/triage with action = RISK_ACCEPT"
        actor: ComplianceOfficer
        preconditions: ["Finding.status IN {REPORTED, TRIAGED}", "payload.note is present and non-blank"]
        side_effects:
          - "TestPlan ledger: open_risk_points -= severity_points; accepted_risk_points += severity_points; total unchanged"
          - "Asset.open_finding_count decremented and, when severity_band == CRITICAL, Asset.open_critical_finding_count decremented"
      - from: RISK_ACCEPTED
        to: TRIAGED
        trigger: "POST /pentest/findings/{id}/triage with action = REVOKE_RISK_ACCEPTANCE"
        actor: ComplianceOfficer
        preconditions: ["Finding.status == RISK_ACCEPTED"]
        side_effects:
          - "TestPlan ledger: accepted_risk_points -= severity_points; open_risk_points += severity_points; total unchanged — the compensating half of the risk-point invariant"
          - "Asset.open_finding_count incremented and, when severity_band == CRITICAL, Asset.open_critical_finding_count incremented (which may move the asset CLEARED -> ELEVATED)"
      - from: TRIAGED
        to: REMEDIATION_ASSIGNED
        trigger: "POST /pentest/remediations (a remediation is created for this finding)"
        actor: ProgramManager
        preconditions: ["Finding.status == TRIAGED", "no other Remediation on this finding has status != CLOSED"]
        side_effects: ["increments Finding.version by 1"]
      - from: REMEDIATION_ASSIGNED
        to: REMEDIATION_SUBMITTED
        trigger: "POST /pentest/remediations/{id}/submit"
        actor: RemediationOwner
        preconditions: ["Finding.status == REMEDIATION_ASSIGNED", "Remediation.status == ASSIGNED"]
        side_effects: ["increments Finding.version by 1"]
      - from: REMEDIATION_SUBMITTED
        to: RETEST_PASSED
        trigger: "POST /pentest/retest-verifications with outcome = PASS"
        actor: Tester | ComplianceOfficer
        preconditions: ["Finding.status == REMEDIATION_SUBMITTED", "Remediation.status == SUBMITTED"]
        side_effects: ["Remediation.status -> VALIDATED", "increments Finding.version by 1"]
      - from: REMEDIATION_SUBMITTED
        to: RETEST_FAILED
        trigger: "POST /pentest/retest-verifications with outcome IN {FAIL, PARTIAL}"
        actor: Tester | ComplianceOfficer
        preconditions: ["Finding.status == REMEDIATION_SUBMITTED", "Remediation.status == SUBMITTED", "payload.residual_note present"]
        side_effects:
          - "Remediation.status -> REJECTED when outcome == FAIL, or PARTIALLY_VALIDATED when outcome == PARTIAL (which also shifts Remediation.due_at forward by PARTIAL_GRACE_DAYS without touching extension_count)"
          - "TestPlan ledger unchanged — the finding is still open"
      - from: RETEST_FAILED
        to: REMEDIATION_ASSIGNED
        trigger: "system event: the rejected or partially validated remediation returns to ASSIGNED"
        actor: system
        preconditions: ["Finding.status == RETEST_FAILED"]
        side_effects: ["Remediation.status -> ASSIGNED; Remediation.evidence_uri and submitted_at cleared"]
        note: "Cycle: REMEDIATION_ASSIGNED -> REMEDIATION_SUBMITTED -> RETEST_FAILED -> REMEDIATION_ASSIGNED can repeat without bound."
      - from: RETEST_PASSED
        to: CLOSED
        trigger: "POST /pentest/retest-verifications/{id}/sign-off"
        actor: ComplianceOfficer
        preconditions: ["Finding.status == RETEST_PASSED", "Remediation.status == VALIDATED", "RetestVerification.state == VERIFIED"]
        side_effects:
          - "closed_at = current_utc"
          - "TestPlan ledger: open_risk_points -= severity_points; closed_risk_points += severity_points; total unchanged"
          - "Asset.open_finding_count decremented; Asset.remediated_finding_count incremented; when severity_band == CRITICAL, Asset.open_critical_finding_count decremented"
          - "when Asset.open_critical_finding_count reaches 0 the Asset moves ELEVATED -> CLEARED and last_cleared_at = current_utc"

  - entity: CriticalAlert
    initial_state: RAISED
    terminal_states: []
    transitions:
      - from: RAISED
        to: ACKNOWLEDGED
        trigger: "POST /pentest/critical-alerts/{id}/acknowledge issued at or before ack_deadline_at"
        actor: ProgramManager | ComplianceOfficer
        preconditions: ["CriticalAlert.state == RAISED", "current_utc <= CriticalAlert.ack_deadline_at"]
        side_effects: ["acknowledged_at = current_utc; acknowledged_by_user_id = X-User-ID; containment_action = payload.containment_action; escalation_level stays 1"]
      - from: RAISED
        to: ESCALATED
        trigger: "POST /pentest/critical-alerts/{id}/acknowledge issued strictly after ack_deadline_at"
        actor: ProgramManager | ComplianceOfficer
        preconditions: ["CriticalAlert.state == RAISED", "current_utc > CriticalAlert.ack_deadline_at"]
        side_effects: ["acknowledged_at = current_utc; acknowledged_by_user_id = X-User-ID; escalation_level = 2"]
        note: "Divergent branch of the same trigger, decided purely by the logical clock against the deadline."
      - from: ESCALATED
        to: ACKNOWLEDGED
        trigger: "POST /pentest/critical-alerts/{id}/acknowledge (second call, closing the escalation)"
        actor: ComplianceOfficer
        preconditions: ["CriticalAlert.state == ESCALATED"]
        side_effects: ["containment_action = payload.containment_action; escalation_level stays 2"]

  - entity: Remediation
    initial_state: ASSIGNED
    terminal_states: [CLOSED]
    transitions:
      - from: ASSIGNED
        to: SUBMITTED
        trigger: "POST /pentest/remediations/{id}/submit"
        actor: RemediationOwner
        preconditions: ["Remediation.status == ASSIGNED", "X-User-ID == Remediation.owner_user_id — otherwise ERR_ACTOR_NOT_OWNER"]
        side_effects:
          - "submitted_at = current_utc; evidence_uri = payload.evidence_uri"
          - "Finding.status REMEDIATION_ASSIGNED -> REMEDIATION_SUBMITTED"
          - "every prior RetestVerification of this remediation with state == VERIFIED moves to SUPERSEDED"
      - from: SUBMITTED
        to: VALIDATED
        trigger: "POST /pentest/retest-verifications with outcome = PASS"
        actor: Tester | ComplianceOfficer
        preconditions: ["Remediation.status == SUBMITTED"]
        side_effects: ["Finding.status -> RETEST_PASSED"]
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /pentest/retest-verifications with outcome = FAIL"
        actor: Tester | ComplianceOfficer
        preconditions: ["Remediation.status == SUBMITTED"]
        side_effects: ["Finding.status -> RETEST_FAILED", "immediately re-opened: status returns to ASSIGNED and the finding returns to REMEDIATION_ASSIGNED"]
      - from: SUBMITTED
        to: PARTIALLY_VALIDATED
        trigger: "POST /pentest/retest-verifications with outcome = PARTIAL"
        actor: Tester | ComplianceOfficer
        preconditions: ["Remediation.status == SUBMITTED"]
        side_effects:
          - "due_at += PARTIAL_GRACE_DAYS days; extension_count unchanged"
          - "Finding.status -> RETEST_FAILED"
          - "immediately re-opened: status returns to ASSIGNED and the finding returns to REMEDIATION_ASSIGNED"
        note: "Fork-join: PASS, FAIL and PARTIAL leave from the same state with three different side-effect sets."
      - from: REJECTED
        to: ASSIGNED
        trigger: "system event: rejection re-opens the remediation for another attempt"
        actor: system
        preconditions: ["Remediation.status IN {REJECTED, PARTIALLY_VALIDATED}"]
        side_effects: ["evidence_uri = null; submitted_at = null"]
      - from: VALIDATED
        to: CLOSED
        trigger: "POST /pentest/retest-verifications/{id}/sign-off"
        actor: ComplianceOfficer
        preconditions: ["Remediation.status == VALIDATED", "X-User-ID != Remediation.owner_user_id — otherwise ERR_SOD_SIGNOFF_CONFLICT"]
        side_effects: ["Finding.status RETEST_PASSED -> CLOSED with the full closure cascade"]
      - from: ASSIGNED
        to: ASSIGNED
        trigger: "POST /pentest/remediations/{id}/extension"
        actor: ProgramManager
        preconditions: ["Remediation.status == ASSIGNED", "Remediation.extension_count < MAX_EXTENSIONS (2) — otherwise ERR_EXTENSION_LIMIT_REACHED"]
        side_effects: ["due_at += payload.additional_days days; extension_count incremented"]
        note: "Self-loop bounded by MAX_EXTENSIONS."

  - entity: RetestVerification
    initial_state: VERIFIED
    terminal_states: [SIGNED_OFF, SUPERSEDED]
    transitions:
      - from: VERIFIED
        to: SIGNED_OFF
        trigger: "POST /pentest/retest-verifications/{id}/sign-off"
        actor: ComplianceOfficer
        preconditions:
          - "RetestVerification.state == VERIFIED — otherwise ERR_RETEST_ALREADY_SIGNED_OFF"
          - "RetestVerification.outcome == PASS and Remediation.status == VALIDATED — otherwise ERR_REMEDIATION_NOT_VALIDATED"
          - "X-User-ID != Remediation.owner_user_id — otherwise ERR_SOD_SIGNOFF_CONFLICT"
        side_effects:
          - "signed_off_by_user_id = X-User-ID; signed_off_at = current_utc; closure_note = payload.closure_note"
          - "cascade link 1 -> 2: because this verification is SIGNED_OFF, its Remediation moves VALIDATED -> CLOSED"
          - "cascade link 2 -> 3: because the remediation is CLOSED, its Finding moves RETEST_PASSED -> CLOSED with closed_at = current_utc"
          - "cascade link 3 -> 4: because the finding is CLOSED, TestPlan.open_risk_points -= severity_points, TestPlan.closed_risk_points += severity_points, Asset.open_finding_count decremented, Asset.remediated_finding_count incremented and Asset.open_critical_finding_count decremented for CRITICAL findings"
          - "cascade link 4 -> 5: because Asset.open_critical_finding_count reached 0, the Asset moves ELEVATED -> CLEARED and Asset.last_cleared_at = current_utc"
      - from: VERIFIED
        to: SUPERSEDED
        trigger: "system event: the owner submitted new remediation evidence after a FAIL or PARTIAL verification"
        actor: system
        preconditions: ["RetestVerification.state == VERIFIED", "RetestVerification.outcome IN {FAIL, PARTIAL}"]
        side_effects: []

  - entity: Asset
    initial_state: MONITORED
    terminal_states: []
    transitions:
      - from: MONITORED
        to: ELEVATED
        trigger: "system event: POST /pentest/findings produced a finding with severity_band == CRITICAL on this asset"
        actor: system
        preconditions: ["Asset.exposure_state IN {MONITORED, CLEARED}", "Asset.open_critical_finding_count >= 1 after the increment"]
        side_effects: ["Asset.open_critical_finding_count incremented; Asset.open_finding_count incremented"]
      - from: ELEVATED
        to: CLEARED
        trigger: "system event: the asset's last open CRITICAL finding left the open set through CLOSED, RISK_ACCEPTED or DUPLICATE"
        actor: system
        preconditions: ["Asset.exposure_state == ELEVATED", "Asset.open_critical_finding_count == 0 after the decrement"]
        side_effects: ["Asset.last_cleared_at = current_utc"]
      - from: CLEARED
        to: ELEVATED
        trigger: "system event: a new CRITICAL finding was reported, or a CRITICAL risk acceptance was revoked"
        actor: system
        preconditions: ["Asset.exposure_state == CLEARED", "Asset.open_critical_finding_count >= 1 after the increment"]
        side_effects: []
        note: "Cycle MONITORED -> ELEVATED -> CLEARED -> ELEVATED."

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: scope-item-create-stale-plan
    parent_entity: TestPlan
    write_endpoint: "POST /pentest/scope-items"
    occ_field: "expected_test_plan_version"
    description: |
      Proposing a ScopeItem against a TestPlan whose version has advanced since
      the client last observed it is rejected. Every accepted candidate re-ranks
      the whole plan population and bumps TestPlan.version, so a client holding
      an older version is scoring its candidate against a ranking population
      that no longer exists. Two writers may both legitimately propose different
      assets into the same plan, so this is not covered by any state
      precondition — the stale-version check is what orders them.
    error_id: ERR_STALE_PLAN_VERSION
    http_status: 412

  - rule_id: finding-create-stale-engagement
    parent_entity: Engagement
    write_endpoint: "POST /pentest/findings"
    occ_field: "expected_engagement_version"
    description: |
      Reporting a Finding against an Engagement whose version has advanced since
      the tester last read it is rejected. Each accepted finding, each emergency
      stop and each hour settlement bumps Engagement.version, so a stale version
      means the tester has not observed a suspension or a budget change that may
      already forbid the report. Any number of findings may legitimately be
      reported on one engagement, so no state precondition covers this.
    error_id: ERR_STALE_ENGAGEMENT_VERSION
    http_status: 412

  - rule_id: assignment-create-stale-engagement
    parent_entity: Engagement
    write_endpoint: "POST /pentest/tester-assignments"
    occ_field: "expected_engagement_version"
    description: |
      Requesting a TesterAssignment against an Engagement whose version has
      advanced since the planner last read it is rejected. hours_reserved,
      hours_consumed and hours_available all move with every assignment and
      settlement, so a stale version means the planner is budgeting against
      hours another assignment has already taken. Multiple assignments on one
      engagement are legitimate, so no state precondition covers this.
    error_id: ERR_STALE_ENGAGEMENT_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: scope_priority_score
    trigger: "On POST /pentest/scope-items, on POST /pentest/scope-items/{id}/decision, and on POST /pentest/test-plans/{id}/prioritization-mode for every ScopeItem of the plan with status IN {PROPOSED, APPROVED, DEFERRED}"
    algorithm: weighted_scoring
    formula: |
      tier_points     = TIER_POINTS[asset.criticality_tier]
      regime_points   = min(REGIME_POINTS_CAP, REGIME_POINTS_PER_REGIME * count(asset.compliance_regimes))
      IF asset.last_tested_at IS NULL:
          staleness_points = 100
      ELSE:
          days_since_last_test = floor((current_utc - asset.last_tested_at) / 86400 seconds)
          staleness_points     = min(100, floor(days_since_last_test * 100 / 365))
      raw = W_EXPOSURE   * asset.exposure_score
          + W_TIER       * tier_points
          + W_STALENESS  * staleness_points
          + W_REGIME     * regime_points
      priority_score       = round(raw, 2)                       # round_half_up, single rounding at the end
      below_threshold_flag = (priority_score < TestPlan.admission_threshold)   # strict <, so equality admits
      scored_mode          = TestPlan.prioritization_mode
    input_set: "One ScopeItem at a time, reading its Asset row and its TestPlan.prioritization_mode / admission_threshold. WITHDRAWN and CONSUMED scope items are never rescored."
    constants:
      TIER_POINTS: { 1: 100, 2: 75, 3: 50, 4: 25 }
      REGIME_POINTS_PER_REGIME: 40
      REGIME_POINTS_CAP: 100
    precision: "2 decimal places, round_half_up, applied once to the weighted sum (never per component)"
    variants:
      - name: RISK_DRIVEN
        when: "TestPlan.prioritization_mode == RISK_DRIVEN (the default)"
        difference: "W_EXPOSURE = 0.45, W_TIER = 0.30, W_STALENESS = 0.20, W_REGIME = 0.05 — attack surface and business criticality dominate."
      - name: COMPLIANCE_DRIVEN
        when: "TestPlan.prioritization_mode == COMPLIANCE_DRIVEN"
        difference: "W_EXPOSURE = 0.20, W_TIER = 0.25, W_STALENESS = 0.15, W_REGIME = 0.40 — regulatory footprint dominates, which can invert the ranking of the same two assets."

  - name: scope_priority_rank
    trigger: "After every scope_priority_score run: POST /pentest/scope-items, POST /pentest/scope-items/{id}/decision, POST /pentest/test-plans/{id}/prioritization-mode"
    algorithm: chronological
    formula: |
      population = ScopeItem WHERE test_plan_id == plan.id AND status IN {PROPOSED, APPROVED}
      sort population by:
        1. priority_score DESC
        2. requested_engagement_hours ASC        (cheaper candidate outranks a costlier tie)
        3. created_at ASC                        (final tie-break; ScopeItem.id is never consulted)
      assign priority_rank = 1..N in that order
      every ScopeItem with status IN {DEFERRED, WITHDRAWN, CONSUMED} has priority_rank = null
    input_set: "Only ScopeItem rows of this plan with status IN {PROPOSED, APPROVED}. Deferring, withdrawing or consuming a row removes it from the population and renumbers the remainder with no gaps."
    constants: {}
    precision: "Integer ranks, 1-based, contiguous"

  - name: plan_coverage_score
    trigger: "On ScopeItem status change to/from APPROVED or CONSUMED, and on POST /pentest/test-plans/{id}/activate before the threshold check"
    algorithm: aggregation
    formula: |
      eligible = count(Asset WHERE criticality_tier IN {1, 2})
      covered  = count(DISTINCT ScopeItem.asset_id
                       WHERE test_plan_id == plan.id
                         AND status IN {APPROVED, CONSUMED}
                         AND asset.criticality_tier IN {1, 2})
      coverage_score = 100.00 IF eligible == 0 ELSE round(100 * covered / eligible, 2)
      activation requires coverage_score >= COVERAGE_MIN_PCT      # >=, so exactly 60.00 activates
    input_set: "Every registered Asset with criticality_tier IN {1,2} forms the denominator regardless of plan; the numerator counts distinct assets this plan has APPROVED or CONSUMED. Tier-3 and tier-4 assets affect neither side."
    constants:
      COVERAGE_MIN_PCT: 60.00
    precision: "2 decimal places, round_half_up"

  - name: finding_severity_rating
    trigger: "On POST /pentest/findings (once, at creation; severity_score, severity_band, severity_points and immediate_action_required are frozen afterwards)"
    algorithm: threshold
    formula: |
      # Multiplication is applied to technical_base_score ALONE, before any bonus is added.
      raw            = finding.technical_base_score * EXPOSURE_MULT[finding.exposure_class]
                       + TIER_BONUS[asset.criticality_tier]
                       + min(REGIME_BONUS_CAP, REGIME_BONUS_PER_REGIME * count(asset.compliance_regimes))
      severity_score = round(min(10.00, raw), 2)        # clamp first, then round once
      severity_band  = CRITICAL IF severity_score >= 9.00
                       ELSE HIGH     IF severity_score >= 7.00
                       ELSE MEDIUM   IF severity_score >= 4.00
                       ELSE LOW
      severity_points          = SEVERITY_POINTS[severity_band]
      immediate_action_required = (severity_band == CRITICAL)
    input_set: "The single Finding being created plus its Asset row. No other finding participates."
    constants:
      EXPOSURE_MULT: { INTERNAL: 0.95, PARTNER: 1.00, INTERNET: 1.15 }
      TIER_BONUS: { 1: 0.50, 2: 0.30, 3: 0.10, 4: 0.00 }
      REGIME_BONUS_PER_REGIME: 0.20
      REGIME_BONUS_CAP: 0.60
      SEVERITY_POINTS: { CRITICAL: 40, HIGH: 20, MEDIUM: 8, LOW: 2 }
    precision: "2 decimal places, round_half_up; clamp to 10.00 happens before the rounding, and the exposure multiplier NEVER multiplies the tier or regime bonuses"

  - name: critical_alert_deadline
    trigger: "On POST /pentest/findings when the computed severity_band == CRITICAL (the same request that creates the CriticalAlert row)"
    algorithm: threshold
    formula: |
      raised_at       = current_utc                     # equals Finding.discovered_at
      ack_deadline_at = raised_at + ACK_DEADLINE_MINUTES[finding.exposure_class] minutes
      # at acknowledgement time:
      escalation_level = 1 IF current_utc <= ack_deadline_at ELSE 2
      state            = ACKNOWLEDGED IF current_utc <= ack_deadline_at ELSE ESCALATED
    input_set: "The CriticalAlert row and the logical clock at acknowledgement. Exactly at ack_deadline_at the alert still acknowledges at level 1."
    constants:
      ACK_DEADLINE_MINUTES: { INTERNET: 60, PARTNER: 240, INTERNAL: 240 }
    precision: "Whole minutes; comparison is inclusive at the deadline instant"

  - name: remediation_due_date
    trigger: "On POST /pentest/remediations (sla_days and due_at stamped at creation), then shifted by POST /pentest/remediations/{id}/extension and by a PARTIAL retest outcome"
    algorithm: threshold
    formula: |
      severity_sla = SEVERITY_SLA_DAYS[finding.severity_band]
      IF asset.compliance_regimes is empty:
          sla_days = severity_sla
      ELSE:
          sla_days = min(severity_sla, min over r in asset.compliance_regimes of REGIME_SLA_CAP[r])
      due_at = current_utc + sla_days days
      # later shifts, each additive on the current due_at:
      #   extension          -> due_at += payload.additional_days ; extension_count += 1 (cap MAX_EXTENSIONS)
      #   PARTIAL retest     -> due_at += PARTIAL_GRACE_DAYS      ; extension_count unchanged
      overdue_flag = (current_utc > due_at) AND status NOT IN {VALIDATED, CLOSED}     # strict >, so exactly at due_at it is false
    input_set: "The Finding's frozen severity_band and the Asset's compliance_regimes at remediation-creation time. Later changes to the asset never re-derive sla_days."
    constants:
      SEVERITY_SLA_DAYS: { CRITICAL: 7, HIGH: 30, MEDIUM: 60, LOW: 120 }
      REGIME_SLA_CAP: { FEDRAMP: 21, PCI_DSS: 30, HIPAA: 45, SOX: 60, SOC2: 90 }
      PARTIAL_GRACE_DAYS: 14
      MAX_EXTENSIONS: 2
    precision: "Whole days added to the logical clock; the time-of-day component of due_at equals that of the creation instant"

  - name: assignment_hour_settlement
    trigger: "On every TesterAssignment transition into REVOKED — POST /pentest/tester-assignments/{id}/access with action = REVOKE, the emergency-stop cascade, engagement CLOSE, and a FLAGGED/EXPIRED background check"
    algorithm: aggregation
    formula: |
      IF access_state before the revocation == REQUESTED:
          settled_hours = 0                    # access was never provisioned, nothing was consumed
      ELSE:
          baseline      = max(interval_start, provisioned_at)
          effective_end = min(revoked_at, interval_end)
          elapsed_hours = max(0, (effective_end - baseline) / 3600 seconds)
          settled_hours = min(requested_hours, ceil(elapsed_hours))
      # ledger, applied in this order on the parent Engagement:
      hours_reserved  = hours_reserved - requested_hours
      hours_consumed  = hours_consumed + settled_hours
      hours_available = hours_allocated - hours_reserved - hours_consumed
      # invariant: hours_allocated == hours_reserved + hours_consumed + hours_available, always
    input_set: "One TesterAssignment and its Engagement. hours_reserved sums requested_hours over assignments with access_state IN {REQUESTED, PROVISIONED}; hours_consumed sums settled_hours over assignments with access_state == REVOKED."
    constants: {}
    precision: "settled_hours is a whole number of hours (ceil of the elapsed float); hours_* fields carry at most 2 decimals"

  - name: plan_risk_point_ledger
    trigger: "On POST /pentest/findings, on POST /pentest/findings/{id}/triage (ACCEPT | MARK_DUPLICATE | RISK_ACCEPT | REVOKE_RISK_ACCEPTANCE) and on retest sign-off closure"
    algorithm: aggregation
    formula: |
      on finding creation:            total += p ; open += p
      on MARK_DUPLICATE:              open  -= p ; duplicate += p
      on RISK_ACCEPT:                 open  -= p ; accepted  += p
      on REVOKE_RISK_ACCEPTANCE:      accepted -= p ; open   += p        # exact inverse of RISK_ACCEPT
      on closure sign-off:            open  -= p ; closed    += p
      where p = Finding.severity_points (frozen at creation)
      # invariant, checkable after every one of the above:
      #   total_risk_points == open_risk_points + closed_risk_points
      #                      + accepted_risk_points + duplicate_risk_points
    input_set: "Every Finding of every Engagement whose test_plan_id is this plan. ACCEPT (REPORTED -> TRIAGED) moves no points — the finding stays in the open bucket."
    constants: {}
    precision: "Integer points; no rounding, so the invariant is exact"

  - name: engagement_assurance_score
    trigger: "PROVISIONAL is stamped on POST /pentest/engagements/{id}/execution with action = COMPLETE_FIELDWORK; FINAL is stamped on the same endpoint with action = CLOSE and on the TERMINATE emergency stop"
    algorithm: weighted_scoring
    formula: |
      deductions = sum over findings in the variant's input_set of DEDUCTION[finding.severity_band]
      PROVISIONAL: score = round(max(0.00, BASE_SCORE - deductions), 2)
      FINAL:       retest_credit = min(RETEST_CREDIT_CAP,
                                       RETEST_CREDIT_PER_CLOSURE * count(findings of this engagement with status == CLOSED))
                   score = round(max(0.00, min(100.00, BASE_SCORE - deductions + retest_credit)), 2)
    input_set: "PROVISIONAL includes every Finding of the engagement with status NOT IN {DUPLICATE} — closed findings still count against it. FINAL includes every Finding with status NOT IN {DUPLICATE, CLOSED} and then adds retest_credit for the closures it excluded. Identical data therefore yields two different scores."
    constants:
      BASE_SCORE: 100.00
      DEDUCTION: { CRITICAL: 25, HIGH: 12, MEDIUM: 5, LOW: 1 }
      RETEST_CREDIT_PER_CLOSURE: 5
      RETEST_CREDIT_CAP: 20
    precision: "2 decimal places, round_half_up, single rounding at the end"
    variants:
      - name: PROVISIONAL
        when: "Stamped into Engagement.provisional_assurance_score at COMPLETE_FIELDWORK, before any remediation has been verified"
        difference: "Counts CLOSED findings in the deduction set and grants no retest credit."
      - name: FINAL
        when: "Stamped into Engagement.final_assurance_score at CLOSE (or at TERMINATE)"
        difference: "Excludes CLOSED findings from the deduction set and adds RETEST_CREDIT_PER_CLOSURE per closure, capped at RETEST_CREDIT_CAP."

  - name: training_priority_score
    trigger: "On POST /pentest/test-plans/{id}/training-recommendations — one TrainingRecommendation row per root_cause_theme that has at least one contributing finding in the window"
    algorithm: weighted_scoring
    formula: |
      generated_at = current_utc
      contributing = Finding f WHERE f.engagement.test_plan_id == plan.id
                       AND f.root_cause_theme == theme
                       AND f.status NOT IN {DUPLICATE, RISK_ACCEPTED}
                       AND payload.window_start <= f.discovered_at <= payload.window_end   # both bounds inclusive
                     ordered by f.discovered_at ASC, then f.created_at ASC
      for each f in contributing:
          days_since_discovery = floor((generated_at - f.discovered_at) / 86400 seconds)
          recency_multiplier   = max(MIN_RECENCY, 1 - DECAY_SLOPE * days_since_discovery / RECENCY_WINDOW_DAYS)
          contribution         = round(SEVERITY_WEIGHT[f.severity_band] * recency_multiplier, 2)   # ROUND EACH FINDING FIRST
      priority_score       = round(min(SCORE_CAP, sum of the rounded contributions), 2)            # THEN sum, then round once more
      recurrence_count     = count(contributing)
      source_engagement_count = count(DISTINCT f.engagement_id over contributing)
      urgency_band         = MANDATORY IF (recurrence_count >= MANDATORY_MIN_RECURRENCE
                                           AND priority_score >= MANDATORY_MIN_SCORE) ELSE RECOMMENDED
    input_set: "Findings of every Engagement of this plan whose discovered_at falls inside the inclusive request window, grouped by root_cause_theme, excluding DUPLICATE and RISK_ACCEPTED findings. CLOSED findings still contribute — the theme was still exercised."
    constants:
      SEVERITY_WEIGHT: { CRITICAL: 5.00, HIGH: 3.00, MEDIUM: 1.20, LOW: 0.40 }
      RECENCY_WINDOW_DAYS: 90
      DECAY_SLOPE: 0.60
      MIN_RECENCY: 0.40
      SCORE_CAP: 20.00
      MANDATORY_MIN_RECURRENCE: 3
      MANDATORY_MIN_SCORE: 8.00
    precision: "2 decimal places, round_half_up. Rounding order is pinned and observable: each finding's contribution is rounded to 2dp BEFORE summation. Summing the unrounded contributions and rounding once produces a different priority_score for the same fixture."

  - name: tester_qualification_score
    trigger: "On POST /pentest/testers and on POST /pentest/testers/{id}/certifications"
    algorithm: aggregation
    formula: |
      qualification_score = min(100, sum of CERT_POINTS[c] for c in tester.certifications)
      # LEAD gate, enforced on POST /pentest/tester-assignments:
      #   assignment_role == LEAD requires qualification_score >= LEAD_MIN_SCORE   (>=, so exactly 60 qualifies)
    input_set: "The tester's own certifications array; duplicates are rejected at input validation so each certification counts once."
    constants:
      CERT_POINTS: { OSCP: 45, GPEN: 35, CREST: 25, CISSP: 15 }
      LEAD_MIN_SCORE: 60
    precision: "Integer points, capped at 100"

  - name: authorized_target_collision
    trigger: "On POST /pentest/authorized-targets, before the row is created"
    algorithm: interval_merge
    formula: |
      cooldown_hours = COOLDOWN_HOURS[asset.asset_class]
      collides = EXISTS AuthorizedTarget t WHERE t.asset_id == payload.asset_id
                   AND t.state == ACTIVE
                   AND payload.window_start <= t.window_end   + cooldown_hours
                   AND payload.window_end   >= t.window_start - cooldown_hours
      # Both comparisons are inclusive: a new window that starts exactly cooldown_hours after an
      # existing window ends still collides. One extra second past that instant does not.
      IF collides: ERR_TARGET_WINDOW_COLLISION
    input_set: "AuthorizedTarget rows on the same asset with state == ACTIVE, across every RulesOfEngagement document. EXCLUDED and SUSPENDED targets release their window."
    constants:
      COOLDOWN_HOURS: { APPLICATION: 0, NETWORK: 24, CLOUD: 12 }
    precision: "Second-granularity instants; both boundary comparisons are inclusive"

  - name: tester_interval_occupancy
    trigger: "On POST /pentest/tester-assignments, before the row is created"
    algorithm: interval_merge
    formula: |
      overlapping = count(TesterAssignment a WHERE a.tester_id == payload.tester_id
                            AND a.access_state IN {REQUESTED, PROVISIONED}
                            AND a.interval_start < payload.interval_end
                            AND a.interval_end   > payload.interval_start)
      # Half-open [interval_start, interval_end): an interval that starts exactly when another ends
      # does NOT overlap — the opposite boundary convention from authorized_target_collision.
      IF overlapping >= tester.max_concurrent_engagements: ERR_TESTER_CAPACITY_EXCEEDED
    input_set: "TesterAssignment rows of the same tester with access_state IN {REQUESTED, PROVISIONED}, across all engagements and all plans. REVOKED rows free the interval."
    constants: {}
    precision: "Second-granularity instants; strict inequalities on both sides (half-open intervals)"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority — lowest number wins)
# =============================================================================
validations:
  # ---- 1. Authentication / authorization -------------------------------------
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and non-blank"
    error_id: ERR_MISSING_AUTH_HEADERS
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "X-User-Role is one of the five roles declared in §1.7"
    error_id: ERR_INVALID_ROLE
    http_status: 401
    applies_to: "all"
  - priority: 3
    category: auth
    check: "The role is listed in the target endpoint's roles: — evaluated BEFORE any path id is resolved, so an unauthorized caller hitting a non-existent id still gets 403"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  # ---- 2. Existence of path resources ---------------------------------------
  - priority: 4
    category: existence
    check: "Every id in the path resolves, validated left-to-right: ERR_ASSET_NOT_FOUND, ERR_TEST_PLAN_NOT_FOUND, ERR_SCOPE_ITEM_NOT_FOUND, ERR_ENGAGEMENT_NOT_FOUND, ERR_ROE_NOT_FOUND, ERR_TARGET_NOT_FOUND, ERR_TESTER_NOT_FOUND, ERR_ASSIGNMENT_NOT_FOUND, ERR_FINDING_NOT_FOUND, ERR_ALERT_NOT_FOUND, ERR_REMEDIATION_NOT_FOUND, ERR_RETEST_NOT_FOUND"
    error_id: ERR_TEST_PLAN_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with a path id"

  # ---- 3. Request shape ------------------------------------------------------
  - priority: 5
    category: business_constraint
    check: "Body conforms to the endpoint's input: — required fields present and non-blank, types correct, enum members known, numeric ranges respected, arrays free of duplicates, window_end > window_start, interval_end > interval_start"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all POST endpoints"
  - priority: 6
    category: business_constraint
    check: "limit is an integer in 1..100 and offset is an integer >= 0"
    error_id: ERR_INVALID_PAGINATION
    http_status: 400
    applies_to: "all list GET endpoints"

  # ---- 4. Existence of body-referenced resources ----------------------------
  - priority: 7
    category: existence
    check: "Every foreign key supplied in the body resolves — test_plan_id, asset_id, scope_item_id, engagement_id, roe_id, tester_id, finding_id, remediation_id, duplicate_of_finding_id, and each member of granted_asset_ids"
    error_id: ERR_ASSET_NOT_FOUND
    http_status: 404
    applies_to: "POST /pentest/scope-items, POST /pentest/engagements, POST /pentest/rules-of-engagement, POST /pentest/authorized-targets, POST /pentest/tester-assignments, POST /pentest/findings, POST /pentest/remediations, POST /pentest/retest-verifications, POST /pentest/findings/{id}/triage"

  # ---- 5. Optimistic concurrency (before any state precondition) -----------
  - priority: 8
    category: state
    check: "expected_test_plan_version equals TestPlan.version"
    error_id: ERR_STALE_PLAN_VERSION
    http_status: 412
    applies_to: "POST /pentest/scope-items"
  - priority: 9
    category: state
    check: "expected_engagement_version equals Engagement.version — checked before the engagement's own authorization/execution state, so a stale writer sees 412 rather than the state error"
    error_id: ERR_STALE_ENGAGEMENT_VERSION
    http_status: 412
    applies_to: "POST /pentest/findings, POST /pentest/tester-assignments"

  # ---- 6. State preconditions ----------------------------------------------
  - priority: 10
    category: state
    check: "TestPlan.status == DRAFT"
    error_id: ERR_PLAN_NOT_DRAFT
    http_status: 409
    applies_to: "POST /pentest/scope-items, POST /pentest/scope-items/{id}/decision, POST /pentest/test-plans/{id}/prioritization-mode, POST /pentest/test-plans/{id}/activate"
  - priority: 11
    category: state
    check: "TestPlan.status == ACTIVE"
    error_id: ERR_PLAN_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /pentest/engagements"
  - priority: 12
    category: state
    check: "ScopeItem.status IN {PROPOSED, DEFERRED} for APPROVE/DEFER/WITHDRAW decisions; a CONSUMED or WITHDRAWN item accepts no decision"
    error_id: ERR_SCOPE_ITEM_NOT_PENDING
    http_status: 409
    applies_to: "POST /pentest/scope-items/{id}/decision"
  - priority: 13
    category: state
    check: "ScopeItem.status == APPROVED and the item belongs to the same test_plan_id as the engagement"
    error_id: ERR_SCOPE_ITEM_NOT_APPROVED
    http_status: 409
    applies_to: "POST /pentest/engagements"
  - priority: 14
    category: state
    check: "Engagement.authorization_state != SUSPENDED — a suspended engagement rejects finding reports, execution transitions and access provisioning, and this state error outranks every business rule on those endpoints"
    error_id: ERR_ENGAGEMENT_SUSPENDED
    http_status: 409
    applies_to: "POST /pentest/findings, POST /pentest/engagements/{id}/execution, POST /pentest/tester-assignments/{id}/access, POST /pentest/authorized-targets"
  - priority: 15
    category: state
    check: "Engagement.authorization_state == AUTHORIZED (ROE_PENDING or TERMINATED both fail)"
    error_id: ERR_ENGAGEMENT_NOT_AUTHORIZED
    http_status: 409
    applies_to: "POST /pentest/findings, POST /pentest/engagements/{id}/execution with action = START, POST /pentest/tester-assignments/{id}/access with action = PROVISION"
  - priority: 16
    category: state
    check: "Engagement.execution_state == EXECUTING"
    error_id: ERR_ENGAGEMENT_NOT_EXECUTING
    http_status: 409
    applies_to: "POST /pentest/findings"
  - priority: 17
    category: state
    check: "The requested execution action is declared for the current execution_state (START from PLANNED, COMPLETE_FIELDWORK from EXECUTING, REPORT from FIELDWORK_COMPLETE, CLOSE from REPORTED)"
    error_id: ERR_INVALID_EXECUTION_TRANSITION
    http_status: 409
    applies_to: "POST /pentest/engagements/{id}/execution"
  - priority: 18
    category: state
    check: "Engagement.authorization_state == SUSPENDED and Engagement.execution_state != CLOSED"
    error_id: ERR_ENGAGEMENT_NOT_SUSPENDED
    http_status: 409
    applies_to: "POST /pentest/engagements/{id}/resume"
  - priority: 19
    category: state
    check: "Engagement.authorization_state IN {AUTHORIZED, SUSPENDED} — a TERMINATED engagement cannot be stopped again"
    error_id: ERR_ENGAGEMENT_ALREADY_TERMINATED
    http_status: 409
    applies_to: "POST /pentest/engagements/{id}/emergency-stop"
  - priority: 20
    category: state
    check: "RulesOfEngagement.status == DRAFT"
    error_id: ERR_ROE_ALREADY_SIGNED
    http_status: 409
    applies_to: "POST /pentest/rules-of-engagement/{id}/sign"
  - priority: 21
    category: state
    check: "RulesOfEngagement.status IN {DRAFT, SIGNED} for target creation and exclusion; a SUSPENDED or REVOKED document is frozen"
    error_id: ERR_ROE_NOT_MODIFIABLE
    http_status: 409
    applies_to: "POST /pentest/authorized-targets, POST /pentest/authorized-targets/{id}/exclude"
  - priority: 22
    category: state
    check: "AuthorizedTarget.state == ACTIVE"
    error_id: ERR_TARGET_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /pentest/authorized-targets/{id}/exclude"
  - priority: 23
    category: state
    check: "TesterAssignment.access_state == REQUESTED for PROVISION; access_state IN {REQUESTED, PROVISIONED} for REVOKE"
    error_id: ERR_ASSIGNMENT_STATE_INVALID
    http_status: 409
    applies_to: "POST /pentest/tester-assignments/{id}/access"
  - priority: 24
    category: state
    check: "Tester.availability_state IN {PENDING_CLEARANCE, SUSPENDED} for result = CLEARED; IN {AVAILABLE, ASSIGNED} for result IN {FLAGGED, EXPIRED}"
    error_id: ERR_TESTER_STATE_INVALID
    http_status: 409
    applies_to: "POST /pentest/testers/{id}/background-check"
  - priority: 25
    category: state
    check: "Finding.status IN {REPORTED, TRIAGED} for ACCEPT/MARK_DUPLICATE, == RISK_ACCEPTED for REVOKE_RISK_ACCEPTANCE, and ACCEPT additionally requires status == REPORTED"
    error_id: ERR_FINDING_NOT_TRIAGEABLE
    http_status: 409
    applies_to: "POST /pentest/findings/{id}/triage"
  - priority: 26
    category: state
    check: "Finding.status == TRIAGED"
    error_id: ERR_FINDING_NOT_TRIAGED
    http_status: 409
    applies_to: "POST /pentest/remediations, POST /pentest/engagements/{id}/execution with action = REPORT"
  - priority: 27
    category: state
    check: "Remediation.status == ASSIGNED"
    error_id: ERR_REMEDIATION_NOT_ASSIGNED
    http_status: 409
    applies_to: "POST /pentest/remediations/{id}/submit, POST /pentest/remediations/{id}/extension"
  - priority: 28
    category: state
    check: "Remediation.status == SUBMITTED"
    error_id: ERR_REMEDIATION_NOT_SUBMITTED
    http_status: 409
    applies_to: "POST /pentest/retest-verifications"
  - priority: 29
    category: state
    check: "RetestVerification.state == VERIFIED"
    error_id: ERR_RETEST_ALREADY_SIGNED_OFF
    http_status: 409
    applies_to: "POST /pentest/retest-verifications/{id}/sign-off"
  - priority: 30
    category: state
    check: "RetestVerification.outcome == PASS AND Remediation.status == VALIDATED"
    error_id: ERR_REMEDIATION_NOT_VALIDATED
    http_status: 409
    applies_to: "POST /pentest/retest-verifications/{id}/sign-off"
  - priority: 31
    category: state
    check: "CriticalAlert.state IN {RAISED, ESCALATED}"
    error_id: ERR_ALERT_ALREADY_ACKNOWLEDGED
    http_status: 409
    applies_to: "POST /pentest/critical-alerts/{id}/acknowledge"

  # ---- 7. Uniqueness -------------------------------------------------------
  - priority: 32
    category: business_constraint
    check: "No other ScopeItem exists with the same (test_plan_id, asset_id) and status IN {PROPOSED, APPROVED}; DEFERRED, WITHDRAWN and CONSUMED rows do not occupy the slot"
    error_id: ERR_DUPLICATE_SCOPE_ITEM
    http_status: 409
    applies_to: "POST /pentest/scope-items"
  - priority: 33
    category: business_constraint
    check: "No other RulesOfEngagement exists for this engagement_id with status IN {DRAFT, SIGNED, SUSPENDED}"
    error_id: ERR_ROE_ALREADY_EXISTS
    http_status: 409
    applies_to: "POST /pentest/rules-of-engagement"
  - priority: 34
    category: business_constraint
    check: "No other Remediation exists for this finding_id with status != CLOSED"
    error_id: ERR_REMEDIATION_ALREADY_EXISTS
    http_status: 409
    applies_to: "POST /pentest/remediations"

  # ---- 8. Safety / authorization-of-testing (compliance-critical) ---------
  - priority: 35
    category: business_safety
    check: "At least one AuthorizedTarget of the engagement's rules-of-engagement document satisfies window_start <= current_utc <= window_end (both bounds inclusive). The target's state is NOT consulted here — an EXCLUDED target still proves an authorized window covered this instant, so the more specific exclusion rule at priority 36 stays the rule that speaks; this rule only refuses reports filed when no authorized testing window of the document is open at all"
    error_id: ERR_NO_OPEN_TESTING_WINDOW
    http_status: 422
    applies_to: "POST /pentest/findings"
  - priority: 36
    category: business_safety
    check: "The finding's asset does NOT have an AuthorizedTarget with state == EXCLUDED on the engagement's document — an explicit exclusion is reported ahead of every other testing-scope, temporal or fiscal problem"
    error_id: ERR_TARGET_EXCLUDED
    http_status: 422
    applies_to: "POST /pentest/findings"
  - priority: 37
    category: business_safety
    check: "The finding's asset has an AuthorizedTarget with state == ACTIVE on the engagement's document"
    error_id: ERR_TARGET_NOT_AUTHORIZED
    http_status: 422
    applies_to: "POST /pentest/findings"
  - priority: 38
    category: business_referential
    check: "The reporting Tester (X-User-ID) has a TesterAssignment on this engagement with access_state == PROVISIONED — checked before the least-privilege grant check, which needs that assignment to exist"
    error_id: ERR_TESTER_NOT_ASSIGNED
    http_status: 422
    applies_to: "POST /pentest/findings"
  - priority: 39
    category: business_safety
    check: "The finding's asset_id appears in that assignment's granted_asset_ids (least privilege)"
    error_id: ERR_ASSET_NOT_GRANTED
    http_status: 422
    applies_to: "POST /pentest/findings"
  - priority: 40
    category: business_safety
    check: "Tester.background_check_status == CLEARED"
    error_id: ERR_TESTER_NOT_CLEARED
    http_status: 422
    applies_to: "POST /pentest/tester-assignments/{id}/access with action = PROVISION"
  - priority: 41
    category: business_safety
    check: "Tester.clearance_expires_at > current_utc (strict; expiry exactly at the clock instant fails)"
    error_id: ERR_CLEARANCE_EXPIRED
    http_status: 422
    applies_to: "POST /pentest/tester-assignments/{id}/access with action = PROVISION, POST /pentest/testers/{id}/background-check with result = CLEARED"
  - priority: 42
    category: business_safety
    check: "granted_asset_ids is a subset of {AuthorizedTarget.asset_id WHERE roe_id == the engagement's document AND state == ACTIVE}"
    error_id: ERR_GRANT_EXCEEDS_AUTHORIZED_SCOPE
    http_status: 422
    applies_to: "POST /pentest/tester-assignments/{id}/access with action = PROVISION"
  - priority: 43
    category: business_safety
    check: "technique_allowlist is a non-empty subset of the parent document's allowed_techniques"
    error_id: ERR_TECHNIQUE_NOT_ALLOWED
    http_status: 422
    applies_to: "POST /pentest/authorized-targets"
  - priority: 44
    category: business_safety
    check: "RulesOfEngagement.active_target_count >= 1"
    error_id: ERR_NO_AUTHORIZED_TARGETS
    http_status: 422
    applies_to: "POST /pentest/rules-of-engagement/{id}/sign"
  - priority: 45
    category: business_safety
    check: "No CriticalAlert of any Finding of this engagement is in state RAISED"
    error_id: ERR_UNACKNOWLEDGED_CRITICAL_ALERT
    http_status: 409
    applies_to: "POST /pentest/engagements/{id}/execution with action IN {COMPLETE_FIELDWORK, CLOSE}"

  # ---- 9. Segregation of duties / referential integrity -------------------
  - priority: 46
    category: business_referential
    check: "X-User-ID != RulesOfEngagement.drafted_by_user_id"
    error_id: ERR_SOD_ROE_SIGNER_CONFLICT
    http_status: 422
    applies_to: "POST /pentest/rules-of-engagement/{id}/sign"
  - priority: 47
    category: business_referential
    check: "When the actor is a Tester, X-User-ID != Finding.discovered_by_tester_id of the remediation's finding"
    error_id: ERR_SOD_VERIFIER_CONFLICT
    http_status: 422
    applies_to: "POST /pentest/retest-verifications"
  - priority: 48
    category: business_referential
    check: "X-User-ID != Remediation.owner_user_id"
    error_id: ERR_SOD_SIGNOFF_CONFLICT
    http_status: 422
    applies_to: "POST /pentest/retest-verifications/{id}/sign-off"
  - priority: 49
    category: business_referential
    check: "X-User-ID == Remediation.owner_user_id"
    error_id: ERR_ACTOR_NOT_OWNER
    http_status: 403
    applies_to: "POST /pentest/remediations/{id}/submit"
  - priority: 50
    category: business_referential
    check: "duplicate_of_finding_id != the triaged finding's own id"
    error_id: ERR_DUPLICATE_SELF_REFERENCE
    http_status: 422
    applies_to: "POST /pentest/findings/{id}/triage with action = MARK_DUPLICATE"
  - priority: 51
    category: business_referential
    check: "The finding named by duplicate_of_finding_id has status != DUPLICATE (no duplicate-of-a-duplicate chains)"
    error_id: ERR_DUPLICATE_CHAIN_NOT_ALLOWED
    http_status: 422
    applies_to: "POST /pentest/findings/{id}/triage with action = MARK_DUPLICATE"
  - priority: 52
    category: business_referential
    check: "When Remediation.validation_requirement == RETEST_REQUIRED the verifier must be a Tester (a ComplianceOfficer may only verify EVIDENCE_ONLY remediations)"
    error_id: ERR_VERIFIER_ROLE_NOT_PERMITTED
    http_status: 422
    applies_to: "POST /pentest/retest-verifications"

  # ---- 10. Temporal / capacity constraints -------------------------------
  - priority: 53
    category: business_temporal
    check: "The target window lies inside the engagement's [window_start, window_end]"
    error_id: ERR_WINDOW_OUTSIDE_ENGAGEMENT
    http_status: 422
    applies_to: "POST /pentest/authorized-targets"
  - priority: 54
    category: business_temporal
    check: "No ACTIVE AuthorizedTarget on the same asset collides per calculations.authorized_target_collision (inclusive bounds widened by COOLDOWN_HOURS[asset_class] on both sides)"
    error_id: ERR_TARGET_WINDOW_COLLISION
    http_status: 409
    applies_to: "POST /pentest/authorized-targets"
  - priority: 55
    category: business_temporal
    check: "The assignment interval [interval_start, interval_end) lies inside the engagement's [window_start, window_end]"
    error_id: ERR_INTERVAL_OUTSIDE_WINDOW
    http_status: 422
    applies_to: "POST /pentest/tester-assignments"
  - priority: 56
    category: business_constraint
    check: "The tester's half-open interval occupancy per calculations.tester_interval_occupancy stays below Tester.max_concurrent_engagements — an aggregate check that outranks the hour-budget check"
    error_id: ERR_TESTER_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /pentest/tester-assignments"
  - priority: 57
    category: business_constraint
    check: "assignment_role == LEAD requires Tester.qualification_score >= LEAD_MIN_SCORE (60)"
    error_id: ERR_LEAD_QUALIFICATION_NOT_MET
    http_status: 422
    applies_to: "POST /pentest/tester-assignments"
  - priority: 58
    category: business_temporal
    check: "Engagement.window_start <= current_utc <= Engagement.window_end (both bounds inclusive)"
    error_id: ERR_OUTSIDE_TESTING_WINDOW
    http_status: 422
    applies_to: "POST /pentest/engagements/{id}/execution with action = START, POST /pentest/findings"
  - priority: 59
    category: business_constraint
    check: "When ScopeItem.below_threshold_flag == true, payload.override_note must be present and non-blank"
    error_id: ERR_BELOW_RISK_THRESHOLD
    http_status: 422
    applies_to: "POST /pentest/scope-items/{id}/decision with decision = APPROVE"
  - priority: 60
    category: business_constraint
    check: "At least one ScopeItem of the plan has status == APPROVED"
    error_id: ERR_EMPTY_SCOPE_SELECTION
    http_status: 422
    applies_to: "POST /pentest/test-plans/{id}/activate"
  - priority: 61
    category: business_constraint
    check: "Recomputed coverage_score >= COVERAGE_MIN_PCT (60.00); exactly 60.00 passes"
    error_id: ERR_COVERAGE_BELOW_MINIMUM
    http_status: 422
    applies_to: "POST /pentest/test-plans/{id}/activate"
  - priority: 62
    category: business_constraint
    check: "Remediation.extension_count < MAX_EXTENSIONS (2)"
    error_id: ERR_EXTENSION_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /pentest/remediations/{id}/extension"
  - priority: 63
    category: business_constraint
    check: "residual_note is present and non-blank when outcome IN {FAIL, PARTIAL}"
    error_id: ERR_RESIDUAL_NOTE_REQUIRED
    http_status: 422
    applies_to: "POST /pentest/retest-verifications"

  # ---- 11. Fiscal / budget (checked last) --------------------------------
  - priority: 64
    category: business_fiscal
    check: "count(Engagement WHERE test_plan_id == plan.id) < TestPlan.planned_engagement_count"
    error_id: ERR_PLAN_ENGAGEMENT_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /pentest/engagements"
  - priority: 65
    category: business_fiscal
    check: "requested_hours <= Engagement.hours_available (equality passes; the hour ledger is the last thing checked, after every capacity and qualification rule)"
    error_id: ERR_ENGAGEMENT_HOURS_EXCEEDED
    http_status: 422
    applies_to: "POST /pentest/tester-assignments"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Assets --------------------------------------------------------------
  - method: POST
    path: "/pentest/assets"
    description: "Register a testable asset (application, network or cloud environment)"
    roles: [PlatformAdmin]
    code: 201
    input: [name, asset_class, criticality_tier, compliance_regimes, exposure_score, "last_tested_at?"]
    output: Asset
    side_effects: ["exposure_state initialised to MONITORED", "open_finding_count, open_critical_finding_count and remediated_finding_count initialised to 0"]
  - method: GET
    path: "/pentest/assets/{id}"
    description: "Read one asset with its live exposure posture and finding counters"
    roles: [PlatformAdmin, ProgramManager, ComplianceOfficer, Tester]
    code: 200
    input: []
    output: Asset
    side_effects: []
  - method: GET
    path: "/pentest/assets"
    description: "Paginated asset list, filterable by class, criticality tier and exposure posture"
    roles: [PlatformAdmin, ProgramManager, ComplianceOfficer, Tester]
    code: 200
    input: ["asset_class?", "criticality_tier?", "exposure_state?", "limit?", "offset?"]
    output: Asset[]
    side_effects: []

  # ---- Test plans ---------------------------------------------------------
  - method: POST
    path: "/pentest/test-plans"
    description: "Open the annual test plan; admission_threshold is derived as 100 - risk_appetite_score"
    roles: [ProgramManager]
    code: 201
    input: [fiscal_year, risk_appetite_score, planned_engagement_count, "prioritization_mode?"]
    output: TestPlan
    side_effects: ["admission_threshold computed", "status = DRAFT", "coverage_score = 0 and all five risk-point buckets = 0"]
  - method: GET
    path: "/pentest/test-plans/{id}"
    description: "Read one test plan with its coverage score and risk-point ledger"
    roles: [ProgramManager, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: TestPlan
    side_effects: []
  - method: GET
    path: "/pentest/test-plans"
    description: "Paginated test plan list"
    roles: [ProgramManager, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["fiscal_year?", "status?", "limit?", "offset?"]
    output: TestPlan[]
    side_effects: []
  - method: POST
    path: "/pentest/test-plans/{id}/prioritization-mode"
    description: "Switch the plan between RISK_DRIVEN and COMPLIANCE_DRIVEN, rescoring and re-ranking every live candidate"
    roles: [ProgramManager]
    code: 200
    input: [prioritization_mode]
    output: TestPlan
    side_effects:
      - "every ScopeItem of this plan with status IN {PROPOSED, APPROVED, DEFERRED} is rescored per calculations.scope_priority_score under the new mode, with scored_mode and below_threshold_flag refreshed"
      - "priority_rank recomputed per calculations.scope_priority_rank over statuses {PROPOSED, APPROVED}"
      - "increments TestPlan.version by 1"
  - method: POST
    path: "/pentest/test-plans/{id}/activate"
    description: "Activate the plan for execution after the coverage gate passes"
    roles: [ProgramManager]
    code: 200
    input: []
    output: TestPlan
    side_effects: ["coverage_score recomputed per calculations.plan_coverage_score", "TestPlan.status DRAFT -> ACTIVE", "increments TestPlan.version by 1"]
  - method: POST
    path: "/pentest/test-plans/{id}/training-recommendations"
    description: "Run trend analysis over the plan's findings in the given inclusive window and emit one immutable TrainingRecommendation per root cause theme"
    roles: [ProgramManager, ComplianceOfficer]
    code: 201
    input: [window_start, window_end]
    output: TrainingRecommendation[]
    side_effects:
      - "one TrainingRecommendation row per theme with at least one contributing finding, ordered by priority_score DESC then root_cause_theme ASC"
      - "priority_score, recurrence_count, source_engagement_count, urgency_band and contributing_finding_ids computed per calculations.training_priority_score"
      - "generated_at stamped from the logical clock"
  - method: GET
    path: "/pentest/test-plans/{id}/training-recommendations"
    description: "List the training recommendations generated for this plan (reverse-reachability read channel for TrainingRecommendation.test_plan_id)"
    roles: [ProgramManager, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["urgency_band?", "root_cause_theme?", "limit?", "offset?"]
    output: TrainingRecommendation[]
    side_effects: []
  - method: GET
    path: "/pentest/training-recommendations/{id}"
    description: "Read one immutable training recommendation"
    roles: [ProgramManager, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: TrainingRecommendation
    side_effects: []

  # ---- Scope items --------------------------------------------------------
  - method: POST
    path: "/pentest/scope-items"
    description: "Propose an asset into the plan's scope; scored and ranked immediately under the plan's current prioritization_mode"
    roles: [ProgramManager]
    code: 201
    input: [test_plan_id, asset_id, justification, requested_engagement_hours, expected_test_plan_version]
    output: ScopeItem
    side_effects:
      - "priority_score, scored_mode and below_threshold_flag computed per calculations.scope_priority_score"
      - "priority_rank recomputed for the whole plan population per calculations.scope_priority_rank"
      - "increments TestPlan.version by 1"
  - method: GET
    path: "/pentest/scope-items/{id}"
    description: "Read one scope candidate with its score, rank and threshold flag"
    roles: [ProgramManager, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: ScopeItem
    side_effects: []
  - method: GET
    path: "/pentest/scope-items"
    description: "Paginated scope-item list filterable by plan, asset and status"
    roles: [ProgramManager, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["test_plan_id?", "asset_id?", "status?", "limit?", "offset?"]
    output: ScopeItem[]
    side_effects: []
  - method: POST
    path: "/pentest/scope-items/{id}/decision"
    description: "Approve, defer or withdraw a scope candidate; approving a below-threshold candidate requires override_note"
    roles: [ProgramManager, ComplianceOfficer]
    code: 200
    input: [decision, "note?", "override_note?"]
    output: ScopeItem
    side_effects:
      - "ScopeItem.status moves per §1.2 and decision_note is stamped"
      - "priority_rank recomputed for the plan population"
      - "TestPlan.coverage_score recomputed per calculations.plan_coverage_score"
      - "increments TestPlan.version by 1"

  # ---- Engagements -------------------------------------------------------
  - method: POST
    path: "/pentest/engagements"
    description: "Create an engagement from an APPROVED scope item on an ACTIVE plan; consumes the scope item"
    roles: [ProgramManager]
    code: 201
    input: [test_plan_id, scope_item_id, engagement_type, window_start, window_end, hours_allocated]
    output: Engagement
    side_effects:
      - "ScopeItem.status APPROVED -> CONSUMED, releasing the (test_plan_id, asset_id) uniqueness slot"
      - "execution_state = PLANNED, authorization_state = ROE_PENDING"
      - "hours_reserved = 0, hours_consumed = 0, hours_available = hours_allocated"
      - "increments TestPlan.version by 1"
  - method: GET
    path: "/pentest/engagements/{id}"
    description: "Read one engagement with both state axes, the hour ledger and both assurance scores"
    roles: [ProgramManager, ComplianceOfficer, PlatformAdmin, Tester]
    code: 200
    input: []
    output: Engagement
    side_effects: []
  - method: GET
    path: "/pentest/engagements"
    description: "Paginated engagement list filterable by plan, scope item and either state axis"
    roles: [ProgramManager, ComplianceOfficer, PlatformAdmin, Tester]
    code: 200
    input: ["test_plan_id?", "scope_item_id?", "execution_state?", "authorization_state?", "limit?", "offset?"]
    output: Engagement[]
    side_effects: []
  - method: POST
    path: "/pentest/engagements/{id}/execution"
    description: "Drive the execution axis: START, COMPLETE_FIELDWORK, REPORT or CLOSE"
    roles: [ProgramManager, Tester]
    code: 200
    input: [action]
    output: Engagement
    side_effects:
      - "execution_state moves per §1.2"
      - "COMPLETE_FIELDWORK stamps provisional_assurance_score (variant PROVISIONAL)"
      - "CLOSE stamps final_assurance_score (variant FINAL), revokes every non-REVOKED TesterAssignment with hour settlement, and evaluates the TestPlan bubble-up to CLOSED"
      - "increments Engagement.version by 1"
  - method: POST
    path: "/pentest/engagements/{id}/emergency-stop"
    description: "Invoke the documented emergency stop procedure: PAUSE suspends the engagement reversibly, TERMINATE ends it on both axes"
    roles: [ProgramManager, ComplianceOfficer]
    code: 200
    input: [stop_code, reason]
    output: Engagement
    side_effects:
      - "PAUSE: authorization_state AUTHORIZED -> SUSPENDED, then the six-link cascade — document SUSPENDED, ACTIVE targets SUSPENDED, intersecting PROVISIONED assignments REVOKED, hours settled on the engagement ledger, tester counters decremented, testers returned to AVAILABLE"
      - "TERMINATE: authorization_state -> TERMINATED, document REVOKED, all targets SUSPENDED, all live assignments REVOKED with settlement, execution_state forced to CLOSED with final_assurance_score stamped, TestPlan bubble-up evaluated"
      - "increments Engagement.version by 1"
  - method: POST
    path: "/pentest/engagements/{id}/resume"
    description: "Lift a PAUSE: restore the signed document and its suspended targets"
    roles: [ComplianceOfficer]
    code: 200
    input: ["resume_note?"]
    output: Engagement
    side_effects:
      - "authorization_state SUSPENDED -> AUTHORIZED and suspension_reason cleared"
      - "RulesOfEngagement SUSPENDED -> SIGNED and every SUSPENDED AuthorizedTarget -> ACTIVE (EXCLUDED targets stay excluded)"
      - "revoked assignments are NOT restored"
      - "increments Engagement.version by 1"

  # ---- Rules of engagement & authorized targets --------------------------
  - method: POST
    path: "/pentest/rules-of-engagement"
    description: "Draft the rules of engagement for an engagement: exclusions, allowed techniques, emergency stop procedure and escalation contact"
    roles: [ProgramManager]
    code: 201
    input: [engagement_id, exclusions, allowed_techniques, emergency_stop_procedure, escalation_contact]
    output: RulesOfEngagement
    side_effects: ["drafted_by_user_id = X-User-ID", "status = DRAFT", "active_target_count = 0"]
  - method: GET
    path: "/pentest/rules-of-engagement/{id}"
    description: "Read one rules-of-engagement document with its active target count"
    roles: [ProgramManager, ComplianceOfficer, PlatformAdmin, Tester]
    code: 200
    input: []
    output: RulesOfEngagement
    side_effects: []
  - method: GET
    path: "/pentest/rules-of-engagement"
    description: "Paginated document list filterable by engagement and status"
    roles: [ProgramManager, ComplianceOfficer, PlatformAdmin, Tester]
    code: 200
    input: ["engagement_id?", "status?", "limit?", "offset?"]
    output: RulesOfEngagement[]
    side_effects: []
  - method: POST
    path: "/pentest/rules-of-engagement/{id}/sign"
    description: "Counter-sign the document; the signature is what authorizes the engagement, and the signer may not be the drafter"
    roles: [ComplianceOfficer]
    code: 200
    input: ["signature_note?"]
    output: RulesOfEngagement
    side_effects:
      - "status DRAFT -> SIGNED, signed_by_user_id = X-User-ID, signed_at = current_utc"
      - "cross-entity: Engagement.authorization_state ROE_PENDING -> AUTHORIZED"
      - "increments RulesOfEngagement.version by 1 and Engagement.version by 1"
  - method: POST
    path: "/pentest/authorized-targets"
    description: "Add an authorized target with its own testing window and technique allowlist"
    roles: [ProgramManager]
    code: 201
    input: [roe_id, asset_id, window_start, window_end, technique_allowlist]
    output: AuthorizedTarget
    side_effects:
      - "cooldown_hours resolved from COOLDOWN_HOURS[asset.asset_class]"
      - "collision check per calculations.authorized_target_collision"
      - "state = ACTIVE and RulesOfEngagement.active_target_count incremented"
      - "increments RulesOfEngagement.version by 1"
  - method: GET
    path: "/pentest/authorized-targets/{id}"
    description: "Read one authorized target"
    roles: [ProgramManager, ComplianceOfficer, PlatformAdmin, Tester]
    code: 200
    input: []
    output: AuthorizedTarget
    side_effects: []
  - method: GET
    path: "/pentest/authorized-targets"
    description: "Paginated target list filterable by document, asset and state"
    roles: [ProgramManager, ComplianceOfficer, PlatformAdmin, Tester]
    code: 200
    input: ["roe_id?", "asset_id?", "state?", "limit?", "offset?"]
    output: AuthorizedTarget[]
    side_effects: []
  - method: POST
    path: "/pentest/authorized-targets/{id}/exclude"
    description: "Exclude a target mid-programme; the asset immediately becomes untestable and its window is released"
    roles: [ProgramManager, ComplianceOfficer]
    code: 200
    input: [reason]
    output: AuthorizedTarget
    side_effects:
      - "state ACTIVE -> EXCLUDED, exclusion_reason stamped"
      - "RulesOfEngagement.active_target_count decremented"
      - "increments RulesOfEngagement.version by 1"

  # ---- Testers & assignments ---------------------------------------------
  - method: POST
    path: "/pentest/testers"
    description: "Register a tester; qualification_score is derived from certifications and availability starts at PENDING_CLEARANCE"
    roles: [PlatformAdmin]
    code: 201
    input: [full_name, certifications, clearance_expires_at, "max_concurrent_engagements?"]
    output: Tester
    side_effects: ["qualification_score computed per calculations.tester_qualification_score", "background_check_status = PENDING", "availability_state = PENDING_CLEARANCE"]
  - method: GET
    path: "/pentest/testers/{id}"
    description: "Read one tester with clearance, qualification and occupancy state"
    roles: [PlatformAdmin, ProgramManager, ComplianceOfficer]
    code: 200
    input: []
    output: Tester
    side_effects: []
  - method: GET
    path: "/pentest/testers"
    description: "Paginated tester list filterable by clearance and availability"
    roles: [PlatformAdmin, ProgramManager, ComplianceOfficer]
    code: 200
    input: ["background_check_status?", "availability_state?", "limit?", "offset?"]
    output: Tester[]
    side_effects: []
  - method: POST
    path: "/pentest/testers/{id}/background-check"
    description: "Record a background check result: CLEARED admits the tester, FLAGGED or EXPIRED suspends them and revokes live access"
    roles: [PlatformAdmin, ComplianceOfficer]
    code: 200
    input: [result]
    output: Tester
    side_effects:
      - "background_check_status = result, background_check_at = current_utc"
      - "CLEARED: availability_state -> AVAILABLE"
      - "FLAGGED or EXPIRED: availability_state -> SUSPENDED, every PROVISIONED assignment of this tester is REVOKED with hour settlement on its engagement, active_assignment_count = 0"
  - method: POST
    path: "/pentest/testers/{id}/certifications"
    description: "Replace the tester's certification list and rescore qualification"
    roles: [PlatformAdmin]
    code: 200
    input: [certifications]
    output: Tester
    side_effects: ["qualification_score recomputed per calculations.tester_qualification_score"]
  - method: POST
    path: "/pentest/tester-assignments"
    description: "Request a tester for an engagement over a half-open interval, reserving hours out of the engagement budget"
    roles: [ProgramManager]
    code: 201
    input: [engagement_id, tester_id, assignment_role, interval_start, interval_end, requested_hours, granted_asset_ids, expected_engagement_version]
    output: TesterAssignment
    side_effects:
      - "occupancy check per calculations.tester_interval_occupancy, then the LEAD qualification gate, then the hour-budget check"
      - "access_state = REQUESTED, settled_hours = 0"
      - "Engagement.hours_reserved += requested_hours and hours_available recomputed"
      - "increments Engagement.version by 1"
  - method: GET
    path: "/pentest/tester-assignments/{id}"
    description: "Read one assignment with its access state and settled hours"
    roles: [ProgramManager, ComplianceOfficer, PlatformAdmin, Tester]
    code: 200
    input: []
    output: TesterAssignment
    side_effects: []
  - method: GET
    path: "/pentest/tester-assignments"
    description: "Paginated assignment list filterable by engagement, tester and access state"
    roles: [ProgramManager, ComplianceOfficer, PlatformAdmin, Tester]
    code: 200
    input: ["engagement_id?", "tester_id?", "access_state?", "limit?", "offset?"]
    output: TesterAssignment[]
    side_effects: []
  - method: POST
    path: "/pentest/tester-assignments/{id}/access"
    description: "PROVISION least-privilege access after clearance checks, or REVOKE it and settle the hours consumed"
    roles: [ProgramManager]
    code: 200
    input: [action]
    output: TesterAssignment
    side_effects:
      - "PROVISION: granted_asset_ids validated as a subset of the engagement's ACTIVE authorized targets, provisioned_at stamped, Tester.active_assignment_count incremented, Tester.availability_state -> ASSIGNED"
      - "REVOKE: revoked_at stamped, settled_hours computed per calculations.assignment_hour_settlement, Engagement.hours_reserved / hours_consumed / hours_available updated, Tester.active_assignment_count decremented and the tester returned to AVAILABLE at zero"
      - "increments Engagement.version by 1 — both actions move the engagement's hour ledger, so the OCC rule on POST /pentest/tester-assignments observes them"

  # ---- Findings, alerts, remediation, retest ----------------------------
  - method: POST
    path: "/pentest/findings"
    description: "Report a finding with reproduction steps and business impact narrative; severity is rated by the server and CRITICAL findings raise a real-time alert"
    roles: [Tester]
    code: 201
    input: [engagement_id, asset_id, title, reproduction_steps, business_impact_narrative, technical_base_score, exposure_class, root_cause_theme, expected_engagement_version]
    output: Finding
    side_effects:
      - "discovered_by_tester_id = X-User-ID, discovered_at = current_utc"
      - "severity_score, severity_band, severity_points and immediate_action_required computed per calculations.finding_severity_rating"
      - "when severity_band == CRITICAL a CriticalAlert row is created with ack_deadline_at per calculations.critical_alert_deadline"
      - "TestPlan.total_risk_points and open_risk_points increased by severity_points"
      - "Asset.open_finding_count incremented, open_critical_finding_count incremented for CRITICAL, and the asset may move MONITORED/CLEARED -> ELEVATED"
      - "increments Engagement.version by 1"
  - method: GET
    path: "/pentest/findings/{id}"
    description: "Read one finding with its frozen severity rating and lifecycle status"
    roles: [ProgramManager, ComplianceOfficer, PlatformAdmin, Tester, RemediationOwner]
    code: 200
    input: []
    output: Finding
    side_effects: []
  - method: GET
    path: "/pentest/findings"
    description: "Paginated finding list filterable by engagement, asset, reporting tester, duplicate parent, status, band and root cause theme"
    roles: [ProgramManager, ComplianceOfficer, PlatformAdmin, Tester, RemediationOwner]
    code: 200
    input: ["engagement_id?", "asset_id?", "discovered_by_tester_id?", "duplicate_of_finding_id?", "status?", "severity_band?", "root_cause_theme?", "limit?", "offset?"]
    output: Finding[]
    side_effects: []
  - method: POST
    path: "/pentest/findings/{id}/triage"
    description: "Triage a finding: ACCEPT, MARK_DUPLICATE, RISK_ACCEPT or REVOKE_RISK_ACCEPTANCE"
    roles: [ProgramManager, ComplianceOfficer]
    code: 200
    input: [action, "note?", "duplicate_of_finding_id?"]
    output: Finding
    side_effects:
      - "Finding.status moves per §1.2"
      - "the TestPlan risk-point ledger is rebalanced per calculations.plan_risk_point_ledger, preserving total_risk_points"
      - "Asset.open_finding_count / open_critical_finding_count adjusted, which may move the asset ELEVATED -> CLEARED or CLEARED -> ELEVATED"
      - "MARK_DUPLICATE also acknowledges any RAISED CriticalAlert of this finding"
      - "increments Finding.version by 1"
  - method: GET
    path: "/pentest/critical-alerts/{id}"
    description: "Read one critical alert with its acknowledgement deadline and escalation level"
    roles: [ProgramManager, ComplianceOfficer, PlatformAdmin, Tester]
    code: 200
    input: []
    output: CriticalAlert
    side_effects: []
  - method: GET
    path: "/pentest/critical-alerts"
    description: "Paginated alert list filterable by finding and state (reverse-reachability read channel for the cascade-created alert)"
    roles: [ProgramManager, ComplianceOfficer, PlatformAdmin, Tester]
    code: 200
    input: ["finding_id?", "state?", "limit?", "offset?"]
    output: CriticalAlert[]
    side_effects: []
  - method: POST
    path: "/pentest/critical-alerts/{id}/acknowledge"
    description: "Acknowledge a critical finding alert and record the containment action taken"
    roles: [ProgramManager, ComplianceOfficer]
    code: 200
    input: [containment_action]
    output: CriticalAlert
    side_effects:
      - "acknowledged_at = current_utc, acknowledged_by_user_id = X-User-ID, containment_action stamped"
      - "state -> ACKNOWLEDGED when current_utc <= ack_deadline_at, otherwise state -> ESCALATED with escalation_level = 2"
  - method: POST
    path: "/pentest/remediations"
    description: "Assign remediation with an accountable owner, a derived due date and a validation requirement"
    roles: [ProgramManager]
    code: 201
    input: [finding_id, owner_user_id, validation_requirement, remediation_plan]
    output: Remediation
    side_effects:
      - "sla_days and due_at computed per calculations.remediation_due_date"
      - "status = ASSIGNED, extension_count = 0, overdue_flag = false"
      - "Finding.status TRIAGED -> REMEDIATION_ASSIGNED"
  - method: GET
    path: "/pentest/remediations/{id}"
    description: "Read one remediation with its SLA, due date and overdue flag"
    roles: [ProgramManager, ComplianceOfficer, PlatformAdmin, RemediationOwner, Tester]
    code: 200
    input: []
    output: Remediation
    side_effects: []
  - method: GET
    path: "/pentest/remediations"
    description: "Paginated remediation list filterable by finding, status and overdue flag"
    roles: [ProgramManager, ComplianceOfficer, PlatformAdmin, RemediationOwner, Tester]
    code: 200
    input: ["finding_id?", "status?", "overdue_flag?", "limit?", "offset?"]
    output: Remediation[]
    side_effects: []
  - method: POST
    path: "/pentest/remediations/{id}/submit"
    description: "Owner submits remediation evidence for verification"
    roles: [RemediationOwner]
    code: 200
    input: [evidence_uri]
    output: Remediation
    side_effects:
      - "status ASSIGNED -> SUBMITTED, submitted_at = current_utc, evidence_uri stamped"
      - "Finding.status REMEDIATION_ASSIGNED -> REMEDIATION_SUBMITTED"
      - "every prior RetestVerification of this remediation with state == VERIFIED moves to SUPERSEDED"
  - method: POST
    path: "/pentest/remediations/{id}/extension"
    description: "Grant a due-date extension, bounded by MAX_EXTENSIONS"
    roles: [ProgramManager]
    code: 200
    input: [additional_days, reason]
    output: Remediation
    side_effects: ["due_at += additional_days days", "extension_count incremented", "overdue_flag re-evaluated"]
  - method: POST
    path: "/pentest/retest-verifications"
    description: "Record retest verification with evidence; PASS validates the remediation, FAIL and PARTIAL send it back to the owner"
    roles: [Tester, ComplianceOfficer]
    code: 201
    input: [remediation_id, evidence_uri, outcome, "residual_note?"]
    output: RetestVerification
    side_effects:
      - "verifier_tester_id = X-User-ID when the actor is a Tester, null for a ComplianceOfficer verifying an EVIDENCE_ONLY remediation"
      - "verified_at = current_utc and days_late computed against Remediation.due_at"
      - "PASS: Remediation -> VALIDATED and Finding -> RETEST_PASSED"
      - "FAIL: Remediation -> REJECTED then back to ASSIGNED, Finding -> RETEST_FAILED then back to REMEDIATION_ASSIGNED, evidence_uri and submitted_at cleared"
      - "PARTIAL: same as FAIL plus due_at += PARTIAL_GRACE_DAYS with extension_count unchanged"
  - method: GET
    path: "/pentest/retest-verifications/{id}"
    description: "Read one retest verification with its outcome, lateness and sign-off fields"
    roles: [ProgramManager, ComplianceOfficer, PlatformAdmin, RemediationOwner, Tester]
    code: 200
    input: []
    output: RetestVerification
    side_effects: []
  - method: GET
    path: "/pentest/retest-verifications"
    description: "Paginated verification list filterable by remediation, verifier, outcome and state"
    roles: [ProgramManager, ComplianceOfficer, PlatformAdmin, RemediationOwner, Tester]
    code: 200
    input: ["remediation_id?", "verifier_tester_id?", "outcome?", "state?", "limit?", "offset?"]
    output: RetestVerification[]
    side_effects: []
  - method: POST
    path: "/pentest/retest-verifications/{id}/sign-off"
    description: "Closure sign-off by a compliance officer who is not the remediation owner; drives the five-link closure cascade"
    roles: [ComplianceOfficer]
    code: 200
    input: [closure_note]
    output: RetestVerification
    side_effects:
      - "state VERIFIED -> SIGNED_OFF, signed_off_by_user_id = X-User-ID, signed_off_at = current_utc, closure_note stamped"
      - "Remediation VALIDATED -> CLOSED"
      - "Finding RETEST_PASSED -> CLOSED with closed_at stamped"
      - "TestPlan.open_risk_points -> closed_risk_points transfer; Asset.open_finding_count decremented, remediated_finding_count incremented, open_critical_finding_count decremented for CRITICAL"
      - "Asset.exposure_state ELEVATED -> CLEARED with last_cleared_at stamped when open_critical_finding_count reaches 0"

  # ---- Test-driving endpoint --------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. Before any call the clock reads exactly 2026-08-01T00:00:00Z and never falls back to wall-clock time; every deadline, window, staleness and decay rule reads this clock."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["current_utc = to_iso8601 for every subsequent request; no entity is mutated by this call"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # ---- auth ---------------------------------------------------------------
  - { id: ERR_MISSING_AUTH_HEADERS, http: 401, condition: "X-User-Role or X-User-ID header absent or blank" }
  - { id: ERR_INVALID_ROLE, http: 401, condition: "X-User-Role is not one of PlatformAdmin, ProgramManager, ComplianceOfficer, Tester, RemediationOwner" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "The caller's role is not listed for the endpoint; decided before any path id is resolved" }
  - { id: ERR_ACTOR_NOT_OWNER, http: 403, condition: "A RemediationOwner submits evidence for a remediation whose owner_user_id is a different user" }

  # ---- not found ----------------------------------------------------------
  - { id: ERR_ASSET_NOT_FOUND, http: 404, condition: "asset_id in the path, in the body, or inside granted_asset_ids does not resolve" }
  - { id: ERR_TEST_PLAN_NOT_FOUND, http: 404, condition: "test_plan_id does not resolve" }
  - { id: ERR_SCOPE_ITEM_NOT_FOUND, http: 404, condition: "scope_item_id does not resolve" }
  - { id: ERR_ENGAGEMENT_NOT_FOUND, http: 404, condition: "engagement_id does not resolve" }
  - { id: ERR_ROE_NOT_FOUND, http: 404, condition: "roe_id does not resolve, or the engagement has no rules-of-engagement document" }
  - { id: ERR_TARGET_NOT_FOUND, http: 404, condition: "authorized target id does not resolve" }
  - { id: ERR_TESTER_NOT_FOUND, http: 404, condition: "tester_id does not resolve" }
  - { id: ERR_ASSIGNMENT_NOT_FOUND, http: 404, condition: "tester assignment id does not resolve" }
  - { id: ERR_FINDING_NOT_FOUND, http: 404, condition: "finding_id or duplicate_of_finding_id does not resolve" }
  - { id: ERR_ALERT_NOT_FOUND, http: 404, condition: "critical alert id does not resolve" }
  - { id: ERR_REMEDIATION_NOT_FOUND, http: 404, condition: "remediation_id does not resolve" }
  - { id: ERR_RETEST_NOT_FOUND, http: 404, condition: "retest verification id does not resolve" }

  # ---- request shape ------------------------------------------------------
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing or blank required field, wrong type, unknown enum member, numeric out of range, duplicate array member, window_end <= window_start, or interval_end <= interval_start" }
  - { id: ERR_INVALID_PAGINATION, http: 400, condition: "limit outside 1..100 or offset negative" }

  # ---- optimistic concurrency --------------------------------------------
  - { id: ERR_STALE_PLAN_VERSION, http: 412, condition: "expected_test_plan_version does not equal the plan's current version" }
  - { id: ERR_STALE_ENGAGEMENT_VERSION, http: 412, condition: "expected_engagement_version does not equal the engagement's current version" }

  # ---- state -------------------------------------------------------------
  - { id: ERR_PLAN_NOT_DRAFT, http: 409, condition: "Scope editing, mode switching or activation attempted on a plan whose status is not DRAFT" }
  - { id: ERR_PLAN_NOT_ACTIVE, http: 409, condition: "Engagement creation attempted on a plan whose status is not ACTIVE" }
  - { id: ERR_SCOPE_ITEM_NOT_PENDING, http: 409, condition: "Decision attempted on a scope item whose status is not PROPOSED or DEFERRED" }
  - { id: ERR_SCOPE_ITEM_NOT_APPROVED, http: 409, condition: "Engagement creation referenced a scope item that is not APPROVED, or that belongs to a different plan" }
  - { id: ERR_ENGAGEMENT_SUSPENDED, http: 409, condition: "Finding reporting, execution transition, access provisioning or target creation attempted while the engagement's authorization_state is SUSPENDED" }
  - { id: ERR_ENGAGEMENT_NOT_AUTHORIZED, http: 409, condition: "Operation requires authorization_state AUTHORIZED but the engagement is ROE_PENDING or TERMINATED" }
  - { id: ERR_ENGAGEMENT_NOT_EXECUTING, http: 409, condition: "Finding reported on an engagement whose execution_state is not EXECUTING" }
  - { id: ERR_INVALID_EXECUTION_TRANSITION, http: 409, condition: "The requested execution action is not declared for the engagement's current execution_state" }
  - { id: ERR_ENGAGEMENT_NOT_SUSPENDED, http: 409, condition: "Resume attempted on an engagement that is not SUSPENDED, or whose execution_state is already CLOSED" }
  - { id: ERR_ENGAGEMENT_ALREADY_TERMINATED, http: 409, condition: "Emergency stop attempted on an engagement whose authorization_state is already TERMINATED, or that is still ROE_PENDING" }
  - { id: ERR_ROE_ALREADY_SIGNED, http: 409, condition: "Sign attempted on a document whose status is not DRAFT" }
  - { id: ERR_ROE_NOT_MODIFIABLE, http: 409, condition: "Target creation or exclusion attempted on a document whose status is SUSPENDED or REVOKED" }
  - { id: ERR_TARGET_NOT_ACTIVE, http: 409, condition: "Exclusion attempted on a target whose state is not ACTIVE" }
  - { id: ERR_ASSIGNMENT_STATE_INVALID, http: 409, condition: "PROVISION attempted on an assignment that is not REQUESTED, or REVOKE attempted on an already REVOKED assignment" }
  - { id: ERR_TESTER_STATE_INVALID, http: 409, condition: "Background-check result incompatible with the tester's current availability_state" }
  - { id: ERR_FINDING_NOT_TRIAGEABLE, http: 409, condition: "Triage action incompatible with the finding's current status" }
  - { id: ERR_FINDING_NOT_TRIAGED, http: 409, condition: "Remediation creation on a finding that is not TRIAGED, or engagement REPORT while some finding is still REPORTED" }
  - { id: ERR_REMEDIATION_NOT_ASSIGNED, http: 409, condition: "Submission or extension attempted on a remediation whose status is not ASSIGNED" }
  - { id: ERR_REMEDIATION_NOT_SUBMITTED, http: 409, condition: "Retest verification attempted on a remediation whose status is not SUBMITTED" }
  - { id: ERR_REMEDIATION_NOT_VALIDATED, http: 409, condition: "Sign-off attempted while the remediation is not VALIDATED or the verification outcome is not PASS" }
  - { id: ERR_RETEST_ALREADY_SIGNED_OFF, http: 409, condition: "Sign-off attempted on a verification whose state is SIGNED_OFF or SUPERSEDED" }
  - { id: ERR_ALERT_ALREADY_ACKNOWLEDGED, http: 409, condition: "Acknowledgement attempted on an alert already in state ACKNOWLEDGED" }

  # ---- uniqueness --------------------------------------------------------
  - { id: ERR_DUPLICATE_SCOPE_ITEM, http: 409, condition: "Another scope item for the same (test_plan_id, asset_id) already holds status PROPOSED or APPROVED" }
  - { id: ERR_ROE_ALREADY_EXISTS, http: 409, condition: "The engagement already has a rules-of-engagement document with status DRAFT, SIGNED or SUSPENDED" }
  - { id: ERR_REMEDIATION_ALREADY_EXISTS, http: 409, condition: "The finding already has a remediation whose status is not CLOSED" }

  # ---- safety / testing authorization -----------------------------------
  - { id: ERR_NO_OPEN_TESTING_WINDOW, http: 422, condition: "Finding reported at an instant covered by no AuthorizedTarget window of the engagement's rules-of-engagement document (bounds inclusive, target state ignored)" }
  - { id: ERR_TARGET_EXCLUDED, http: 422, condition: "Finding reported on an asset whose authorized target on this engagement has been EXCLUDED" }
  - { id: ERR_TARGET_NOT_AUTHORIZED, http: 422, condition: "Finding reported on an asset with no ACTIVE authorized target on the engagement's document" }
  - { id: ERR_TESTER_NOT_ASSIGNED, http: 422, condition: "The reporting tester has no PROVISIONED assignment on this engagement" }
  - { id: ERR_ASSET_NOT_GRANTED, http: 422, condition: "The reporting tester's assignment does not list the finding's asset_id in granted_asset_ids" }
  - { id: ERR_TESTER_NOT_CLEARED, http: 422, condition: "Access provisioning attempted for a tester whose background_check_status is not CLEARED" }
  - { id: ERR_CLEARANCE_EXPIRED, http: 422, condition: "The tester's clearance_expires_at is at or before the logical clock" }
  - { id: ERR_GRANT_EXCEEDS_AUTHORIZED_SCOPE, http: 422, condition: "granted_asset_ids is not a subset of the engagement's ACTIVE authorized target assets (least privilege)" }
  - { id: ERR_TECHNIQUE_NOT_ALLOWED, http: 422, condition: "technique_allowlist is empty or contains a technique the parent document does not allow" }
  - { id: ERR_NO_AUTHORIZED_TARGETS, http: 422, condition: "Sign attempted on a document with active_target_count == 0" }
  - { id: ERR_UNACKNOWLEDGED_CRITICAL_ALERT, http: 409, condition: "COMPLETE_FIELDWORK or CLOSE attempted while some critical alert of the engagement is still RAISED" }

  # ---- segregation of duties / referential ------------------------------
  - { id: ERR_SOD_ROE_SIGNER_CONFLICT, http: 422, condition: "The signing user is the same user who drafted the rules-of-engagement document" }
  - { id: ERR_SOD_VERIFIER_CONFLICT, http: 422, condition: "The verifying tester is the tester who discovered the finding" }
  - { id: ERR_SOD_SIGNOFF_CONFLICT, http: 422, condition: "The signing user is the remediation's owner_user_id" }
  - { id: ERR_DUPLICATE_SELF_REFERENCE, http: 422, condition: "duplicate_of_finding_id equals the finding being triaged" }
  - { id: ERR_DUPLICATE_CHAIN_NOT_ALLOWED, http: 422, condition: "duplicate_of_finding_id points at a finding whose status is already DUPLICATE" }
  - { id: ERR_VERIFIER_ROLE_NOT_PERMITTED, http: 422, condition: "A ComplianceOfficer verified a remediation whose validation_requirement is RETEST_REQUIRED" }

  # ---- temporal / capacity ---------------------------------------------
  - { id: ERR_WINDOW_OUTSIDE_ENGAGEMENT, http: 422, condition: "The authorized target window is not contained in the engagement's testing window" }
  - { id: ERR_TARGET_WINDOW_COLLISION, http: 409, condition: "An ACTIVE authorized target on the same asset collides with the requested window after the asset-class cooldown is applied to both sides" }
  - { id: ERR_INTERVAL_OUTSIDE_WINDOW, http: 422, condition: "The assignment interval is not contained in the engagement's testing window" }
  - { id: ERR_TESTER_CAPACITY_EXCEEDED, http: 409, condition: "The tester already has max_concurrent_engagements live assignments whose half-open intervals overlap the requested interval" }
  - { id: ERR_LEAD_QUALIFICATION_NOT_MET, http: 422, condition: "A LEAD assignment was requested for a tester whose qualification_score is below 60" }
  - { id: ERR_OUTSIDE_TESTING_WINDOW, http: 422, condition: "The logical clock is outside the engagement's inclusive testing window" }

  # ---- programme constraints -------------------------------------------
  - { id: ERR_BELOW_RISK_THRESHOLD, http: 422, condition: "A below-threshold scope candidate was approved without an override_note" }
  - { id: ERR_EMPTY_SCOPE_SELECTION, http: 422, condition: "Activation attempted with no APPROVED scope item on the plan" }
  - { id: ERR_COVERAGE_BELOW_MINIMUM, http: 422, condition: "Activation attempted with coverage_score below 60.00" }
  - { id: ERR_EXTENSION_LIMIT_REACHED, http: 409, condition: "A third extension was requested on a remediation" }
  - { id: ERR_RESIDUAL_NOTE_REQUIRED, http: 422, condition: "residual_note missing or blank on a FAIL or PARTIAL verification" }

  # ---- fiscal ---------------------------------------------------------
  - { id: ERR_PLAN_ENGAGEMENT_LIMIT_REACHED, http: 409, condition: "The plan already has planned_engagement_count engagements" }
  - { id: ERR_ENGAGEMENT_HOURS_EXCEEDED, http: 422, condition: "requested_hours exceeds the engagement's hours_available" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Programme registrar: owns the asset inventory, the tester roster, background checks and the logical clock"
    identity: "opaque"
    exclusive_operations:
      - "POST /pentest/assets"
      - "POST /pentest/testers"
      - "POST /pentest/testers/{id}/certifications"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /pentest/testers/{id}/background-check (with ComplianceOfficer)"
      - "read endpoints for assets, testers, plans, engagements, documents, targets, assignments, findings, alerts, remediations and verifications"

  - name: ProgramManager
    description: "Runs the annual programme: scope proposal and decisions, engagement lifecycle, rules-of-engagement drafting, targets, assignments, access provisioning and remediation assignment"
    identity: "opaque"
    exclusive_operations:
      - "POST /pentest/test-plans"
      - "POST /pentest/test-plans/{id}/prioritization-mode"
      - "POST /pentest/test-plans/{id}/activate"
      - "POST /pentest/scope-items"
      - "POST /pentest/engagements"
      - "POST /pentest/rules-of-engagement"
      - "POST /pentest/authorized-targets"
      - "POST /pentest/tester-assignments"
      - "POST /pentest/tester-assignments/{id}/access"
      - "POST /pentest/remediations"
      - "POST /pentest/remediations/{id}/extension"
    shared_operations:
      - "POST /pentest/scope-items/{id}/decision (with ComplianceOfficer)"
      - "POST /pentest/engagements/{id}/execution (with Tester)"
      - "POST /pentest/engagements/{id}/emergency-stop (with ComplianceOfficer)"
      - "POST /pentest/authorized-targets/{id}/exclude (with ComplianceOfficer)"
      - "POST /pentest/findings/{id}/triage (with ComplianceOfficer)"
      - "POST /pentest/critical-alerts/{id}/acknowledge (with ComplianceOfficer)"
      - "POST /pentest/test-plans/{id}/training-recommendations (with ComplianceOfficer)"

  - name: ComplianceOfficer
    description: "Independent assurance authority: counter-signs rules of engagement, terminates or resumes engagements, and owns closure sign-off. Segregation of duties forbids signing what the same user drafted or owns."
    identity: "opaque"
    exclusive_operations:
      - "POST /pentest/rules-of-engagement/{id}/sign"
      - "POST /pentest/engagements/{id}/resume"
      - "POST /pentest/retest-verifications/{id}/sign-off"
    shared_operations:
      - "POST /pentest/scope-items/{id}/decision (with ProgramManager)"
      - "POST /pentest/engagements/{id}/emergency-stop (with ProgramManager)"
      - "POST /pentest/authorized-targets/{id}/exclude (with ProgramManager)"
      - "POST /pentest/testers/{id}/background-check (with PlatformAdmin)"
      - "POST /pentest/findings/{id}/triage (with ProgramManager)"
      - "POST /pentest/critical-alerts/{id}/acknowledge (with ProgramManager)"
      - "POST /pentest/retest-verifications (with Tester, EVIDENCE_ONLY remediations only)"
      - "POST /pentest/test-plans/{id}/training-recommendations (with ProgramManager)"

  - name: Tester
    description: "Cleared, provisioned penetration tester. X-User-ID is the Tester row's id, so finding attribution and the verifier segregation-of-duties check are both resolved from the header."
    identity: "entity_backed:Tester"
    exclusive_operations:
      - "POST /pentest/findings"
    shared_operations:
      - "POST /pentest/engagements/{id}/execution (with ProgramManager)"
      - "POST /pentest/retest-verifications (with ComplianceOfficer)"
      - "read endpoints for assets, engagements, documents, targets, assignments, findings, alerts, remediations and verifications"

  - name: RemediationOwner
    description: "Accountable remediation owner. X-User-ID is an operator identifier stored on Remediation.owner_user_id; it is compared to that field on submission and on closure sign-off."
    identity: "opaque"
    exclusive_operations:
      - "POST /pentest/remediations/{id}/submit"
    shared_operations:
      - "GET /pentest/findings/{id}, GET /pentest/findings, GET /pentest/remediations/{id}, GET /pentest/remediations, GET /pentest/retest-verifications/{id}, GET /pentest/retest-verifications"
