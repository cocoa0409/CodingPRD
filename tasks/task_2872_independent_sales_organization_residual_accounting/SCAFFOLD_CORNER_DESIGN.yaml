            - "GET /statement-adjustments?source_merchant_id=${m2} returns total_count 1 with kind BONUS_CLAWBACK, amount_cents -100, state APPLIED, created_by_user_id system"
            - "the adjustment is attached to A1's statement for period_month 2027-01 (the calendar month of attrition_date), which was auto-created DRAFT/UNSETTLED"
            - "that statement has adjustment_cents == -100, gross_after_trueup_cents == 0, net_payable_cents == 0 and carry_forward_deficit_cents == 100"
            - "Agent.${a1}.lifetime_clawback_cents == 100 and portfolio_attrition_bps == 10000 with residual_hold == true"

