              as: Employer
              as_user_id: "${emp_id}"
              captures: { err_offer: $.data.error_id }
            - call: "GET /marketplace/requisitions/${req_id}"
              payload: {}
              as: Employer
              as_user_id: "${emp_id}"
          assert:
            - "err_app == ERR_NO_OPENINGS and err_offer == ERR_NO_OPENINGS"
            - "the GET on the requisition still returns 200 with status OPEN (suspension blocks writes, not reads)"

      - name: requisition_close_with_offer_extended_blocked
        claim_type: precondition_enforcement
        grounds:
          - state_machines.Requisition.OPEN_to_CLOSED
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "Closing a requisition while one of its applications sits in OFFER_EXTENDED is rejected ERR_INVALID_STATE — the in-flight offer must resolve first; closing with only INTERVIEWING applications succeeds and withdraws them."
        test_recipe:
