        grounds:
          - validations.priority_43
          - calculations.offer_sequencing_selection.constants.OFFER_COOLOFF_MINUTES
          - state_machines.AncillaryOffer.offer_status.PRESENTED_to_DECLINED
          - errors.ERR_OFFER_COOLOFF_CONFLICT
        boundary_type: exclusive_temporal_window
        boundary_value: "declined_at + 30 minutes: 09:39:00Z rejected, 09:40:00Z accepted"
        distinguishing_aspect: |
          The cool-off predicate is STRICTLY GREATER THAN: a re-offer is blocked while
          updated_at + 30min > clock. The offer is declined at 09:10:00Z, so the barrier sits at
          09:40:00Z. At 09:39:00Z the session must fail with ERR_OFFER_COOLOFF_CONFLICT; at
