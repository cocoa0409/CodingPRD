              as: ExportOpsCoordinator
              as_user_id: "ops_1"
              captures: { order_id: "$.data.id" }
            - call: "POST /export-orders/${order_id}/shipment-lines"
              payload: { line_no: 1, goods_description: "Stainless couplings", hs_code: "732290", quantity: 100.000, uom: "EA", unit_price_usd: 250.0000, line_discount_pct: 0, net_weight_kg: 900.000, gross_weight_kg: 1000.000, package_count: 10 }
              as: ExportOpsCoordinator
              as_user_id: "ops_1"
            - call: "POST /export-orders/${order_id}/submit-for-compliance"
              payload: {}
              as: ExportOpsCoordinator
              as_user_id: "ops_1"
            - call: "GET /export-control-screenings"
              payload: { export_order_id: "${order_id}" }
              as: TradeComplianceOfficer
              as_user_id: "tco_1"
              captures: { screening_id: "$.data[0].id" }
            - call: "POST /export-control-screenings/${screening_id}/decision"
              payload: { license_determination: "NLR", eccn: "3A001", denied_party_hits: 0 }
              as: TradeComplianceOfficer
              as_user_id: "tco_1"
            - call: "POST /letters-of-credit"
              payload: { export_order_id: "${order_id}", lc_number: "LC-2195-004", issuing_bank_swift: "SMBCJPJT", amount_usd: 26000.00, tolerance_pct: 5.00, availability: "SIGHT", usance_days: 0, expiry_date: "2026-10-15T00:00:00Z", latest_shipment_date: "2026-09-30T00:00:00Z", presentation_period_days: 21, partial_shipment_allowed: false, transshipment_allowed: false, required_document_types: ["COMMERCIAL_INVOICE", "BILL_OF_LADING"] }
              as: ExportOpsCoordinator
              as_user_id: "ops_1"
              captures: { lc_id: "$.data.id", lc_v1: "$.data.version" }
            - call: "POST /letters-of-credit/${lc_id}/reviews"
              payload: { expected_letter_of_credit_version: "${lc_v1}" }
              as: DocumentaryCreditReviewer
              as_user_id: "rev_1"
              captures: { review1_id: "$.data.id" }
            - call: "POST /lc-terms-reviews/${review1_id}/findings"
              payload: { code: "DOC_TYPE_MISSING", severity: "MINOR", clause_ref: "DOCUMENTS", detail: "Credit omits the inspection certificate the contract requires" }
              as: DocumentaryCreditReviewer
              as_user_id: "rev_1"
              captures: { finding1_id: "$.data.id" }
            - call: "POST /lc-terms-reviews/${review1_id}/submit"
              payload: { recommendation: "ACCEPT" }
              as: DocumentaryCreditReviewer
              as_user_id: "rev_1"
            - call: "GET /letters-of-credit/${lc_id}"
              payload: {}
              as: ExportOpsCoordinator
              as_user_id: "ops_1"
              captures: { lc_v2: "$.data.version" }
            - call: "POST /letters-of-credit/${lc_id}/amendments"
              payload: { expected_letter_of_credit_version: "${lc_v2}", amount_usd: 27000.00, tolerance_pct: 3.00 }
              as: ExportOpsCoordinator
              as_user_id: "ops_1"
              captures: { lc_v3: "$.data.version" }
            - call: "POST /letters-of-credit/${lc_id}/reviews"
              payload: { expected_letter_of_credit_version: "${lc_v3}" }
              as: DocumentaryCreditReviewer
              as_user_id: "rev_1"
              captures: { review2_id: "$.data.id" }
          trigger:
            - call: "POST /lc-terms-reviews/${review2_id}/submit"
              payload: { recommendation: "ACCEPT" }
              as: DocumentaryCreditReviewer
              as_user_id: "rev_1"
          assert:
            - "LetterOfCredit.${lc_id}.status == ACCEPTED (second pass through the same state)"
            - "LetterOfCredit.${lc_id}.amendment_round == 1"
            - "LetterOfCredit.${lc_id}.amount_usd == 27000.00 and LetterOfCredit.${lc_id}.tolerance_pct == 3.00"
            - "LetterOfCredit.${lc_id}.max_drawable_usd == 27810.00 and LetterOfCredit.${lc_id}.min_drawable_usd == 26190.00"
            - "LCTermsReview.${review1_id}.status == SUPERSEDED and LCTermsReview.${review1_id}.terms_risk_score == 5.00"
            - "DiscrepancyFinding.${finding1_id}.cure_status == CURED (force-cured by the amendment, not by a reviewer action)"
            - "LCTermsReview.${review2_id}.status == SUBMITTED and LCTermsReview.${review2_id}.terms_risk_score == 0.00 and LCTermsReview.${review2_id}.finding_count == 0"
            - "ExportOrder.${order_id}.settlement_status == LC_ACCEPTED, having passed through UNSECURED at the amendment"
            - "ExportOrder.${order_id}.insured_exposure_usd == 0.00 (uninsured_passthrough on both charges)"
            - "ExportOrder.${order_id}.fulfillment_status == COMPLIANCE_CLEARED throughout"

  # ===========================================================================
  # RULE 4 — Transitive cascades of depth 4, 3 and 3 on disjoint entity paths
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: restricted_party_flag_depth_four_cascade_releases_sailing_capacity_and_license_value
        grounds:
          - state_machines.ExportOrder.BOOKED_to_COMPLIANCE_BLOCKED
          - state_machines.FreightBooking.BOOKED_to_CANCELLED
          - calculations.sailing_capacity_ledger
          - calculations.license_value_consumption
          - entities.VesselSailing.fields.booked_weight_kg
          - entities.ExportLicense.fields.remaining_value_usd
        distinguishing_aspect: |
          Depth 4 on the compliance path ForeignBuyer -> ExportOrder -> FreightBooking ->
          VesselSailing (with the ExportLicense release hanging off link 3 as link 4): one
          PATCH of restricted_party_flag must block the order, cancel its booking with
          cancel_reason RESTRICTED_PARTY_CASCADE, return the sailing from FULL to OPEN with
          booked_weight_kg 0.000, and return the license from EXHAUSTED to ACTIVE with
          remaining_value_usd 25000.00 — a depth-2 implementation stops after the booking and
          leaves the sailing FULL and the license EXHAUSTED.
        test_recipe:
          setup:
            - "ForeignBuyer 'Chiba Alloy Trading' (JP, BBB, sanctions_tier NONE, restricted_party_flag false)."
            - "ExportOrder FOB / ZONE_1 / USD with one line 100.000 @ 250.0000 (ordered_goods_value_usd 25000.00, gross_weight_kg 1000.000)."
            - "Screening decided LICENSE_REQUIRED, then an ExportLicense with licensed_value_usd exactly 25000.00 (valid 2026-07-01 -> 2026-12-31) is issued against it and used to clear the screening, so the screening is CLEARED and the order is COMPLIANCE_CLEARED."
            - "VesselSailing with capacity_weight_kg exactly 1000.000 and tariff 300.00; a FreightBooking of 1000.000 kg LCL takes it to booked_weight_kg 1000.000 and status FULL, moves the order to BOOKED, and charges the license to consumed_value_usd 25000.00 / remaining_value_usd 0.00 / status EXHAUSTED."
            - "No document has been generated and no LC captured, so the cascade has exactly one order, one booking, one sailing and one license to touch."
          setup_api_calls:
            - call: "POST /foreign-buyers"
              payload: { legal_name: "Chiba Alloy Trading", country_code: "JP", credit_rating: "BBB", sanctions_tier: "NONE", restricted_party_flag: false }
              as: TradeComplianceOfficer
              as_user_id: "tco_1"
              captures: { buyer_id: "$.data.id" }
            - call: "POST /export-orders"
              payload: { buyer_id: "${buyer_id}", incoterm: "FOB", incoterm_named_place: "FOB Busan", origin_country_code: "KR", destination_country_code: "JP", destination_zone: "ZONE_1", invoice_currency: "USD", fx_rate_usd_to_invoice: 1.000000, ship_by_date: "2026-09-30T00:00:00Z" }
              as: ExportOpsCoordinator
              as_user_id: "ops_1"
              captures: { order_id: "$.data.id" }
            - call: "POST /export-orders/${order_id}/shipment-lines"
              payload: { line_no: 1, goods_description: "Titanium alloy billet", hs_code: "810820", quantity: 100.000, uom: "EA", unit_price_usd: 250.0000, line_discount_pct: 0, net_weight_kg: 900.000, gross_weight_kg: 1000.000, package_count: 10 }
              as: ExportOpsCoordinator
              as_user_id: "ops_1"
            - call: "POST /export-orders/${order_id}/submit-for-compliance"
              payload: {}
              as: ExportOpsCoordinator
              as_user_id: "ops_1"
            - call: "GET /export-control-screenings"
              payload: { export_order_id: "${order_id}" }
              as: TradeComplianceOfficer
              as_user_id: "tco_1"
              captures: { screening_id: "$.data[0].id" }
            - call: "POST /export-control-screenings/${screening_id}/decision"
              payload: { license_determination: "LICENSE_REQUIRED", eccn: "1C010", denied_party_hits: 0 }
              as: TradeComplianceOfficer
              as_user_id: "tco_1"
            - call: "POST /export-control-screenings/${screening_id}/licenses"
              payload: { license_number: "LIC-2195-A", authority: "BIS", eccn: "1C010", valid_from: "2026-07-01T00:00:00Z", valid_to: "2026-12-31T00:00:00Z", licensed_value_usd: 25000.00 }
              as: TradeComplianceOfficer
              as_user_id: "tco_1"
              captures: { license_id: "$.data.id" }
            - call: "POST /export-control-screenings/${screening_id}/clear-with-license"
              payload: { export_license_id: "${license_id}" }
              as: TradeComplianceOfficer
              as_user_id: "tco_1"
            - call: "POST /vessel-sailings"
              payload: { carrier_scac: "HLCU", vessel_name: "Geum River", voyage_no: "G501", port_of_loading: "KRPUS", port_of_discharge: "JPTYO", destination_zone: "ZONE_1", cutoff_at: "2026-08-15T00:00:00Z", etd: "2026-08-17T00:00:00Z", eta: "2026-08-30T00:00:00Z", capacity_weight_kg: 1000.000, tariff_rate_per_1000kg_usd: 300.00 }
              as: ExportOpsCoordinator
              as_user_id: "ops_1"
              captures: { sailing_id: "$.data.id", sailing_v: "$.data.version" }
            - call: "POST /freight-bookings"
              payload: { export_order_id: "${order_id}", vessel_sailing_id: "${sailing_id}", booked_weight_kg: 1000.000, container_type: "LCL", expected_vessel_sailing_version: "${sailing_v}" }
              as: ExportOpsCoordinator
              as_user_id: "ops_1"
              captures: { booking_id: "$.data.id" }
          trigger:
            - call: "PATCH /foreign-buyers/${buyer_id}/restricted-party-flag"
              payload: { restricted_party_flag: true, restricted_party_reason: "Added to the denied party list by the licensing authority" }
              as: TradeComplianceOfficer
              as_user_id: "tco_1"
          assert:
            - "ForeignBuyer.${buyer_id}.restricted_party_flag == true"
            - "ExportOrder.${order_id}.fulfillment_status == COMPLIANCE_BLOCKED (cascade link 1)"
            - "FreightBooking.${booking_id}.status == CANCELLED and FreightBooking.${booking_id}.cancel_reason == RESTRICTED_PARTY_CASCADE (cascade link 2)"
            - "VesselSailing.${sailing_id}.booked_weight_kg == 0.000 and VesselSailing.${sailing_id}.status == OPEN (cascade link 3)"
            - "ExportLicense.${license_id}.consumed_value_usd == 0.00 and ExportLicense.${license_id}.remaining_value_usd == 25000.00 and ExportLicense.${license_id}.status == ACTIVE (cascade link 4)"
            - "ExportOrder.${order_id}.licensed_value_allocated_usd == 0.00"
            - "ExportControlScreening.${screening_id}.status == INITIATED and ExportControlScreening.${screening_id}.ruleset_version == 2"
            - "ExportOrder.${order_id}.settlement_status == UNSECURED (the money dimension is untouched by this cascade)"

      - name: settlement_depth_three_cascade_returns_exhausted_policy_to_active_and_zeroes_buyer_exposure
        grounds:
          - state_machines.ExportOrder.DOCS_PRESENTED_to_PAID
          - state_machines.DocumentPresentation.COMPLIED_to_HONOURED
          - calculations.insured_exposure_ledger
          - calculations.lc_negotiable_amount
          - entities.CreditInsurancePolicy.fields.utilized_usd
