        claim_type: derived_field_reconciliation
        grounds: [entities.StudentRecord.fields.is_current, entities.StudentRecord.fields.record_version]
        distinguishing_aspect: "Publishing a new StudentRecord snapshot sets is_current=true on the new row AND flips is_current to false on all prior rows for the same student."
