              as: QA_MANAGER
              captures: { pv_idem_id: $.data.id }
            - call: "POST /api/v1/process-validations/${pv_idem_id}/start"
              payload: {}
              as: PRODUCTION_SUPERVISOR
            - call: "POST /api/v1/process-validations/${pv_idem_id}/complete"
              payload:
                test_results: [{test_name: "cv", measured_value: 4.0, acceptance_criteria: "<=5.0", pass: true}]
              as: QUALITY_ANALYST
            - call: "POST /api/v1/formulas/${f_idem_id}/approve"
              payload: {}
              as: QA_MANAGER
            - call: "POST /api/v1/label-submissions"
              payload:
                formula_id: "${f_idem_id}"
                submission_type: "NEW_PRODUCT_REGISTRATION"
                label_text: "Idem Cereal"
              as: REGULATORY_AFFAIRS
              captures: { ls_idem_id: $.data.id }
            - call: "POST /api/v1/label-submissions/${ls_idem_id}/submit"
              payload: {}
              as: REGULATORY_AFFAIRS
            - call: "POST /api/v1/label-submissions/${ls_idem_id}/assign-reviewer"
              payload: { reviewer_id: "usr_qa_mgr_01" }
              as: QA_MANAGER
            - call: "POST /api/v1/label-submissions/${ls_idem_id}/approve"
              payload: {}
              as: QA_MANAGER
            - call: "POST /api/v1/formulas/${f_idem_id}/activate"
              payload: {}
              as: QA_MANAGER
            - call: "POST /api/v1/allocation-plans"
              payload:
                formula_id: "${f_idem_id}"
                total_available_kg: 50.000
                allocation_method: "PRO_RATA"
              as: SUPPLY_CHAIN_PLANNER
              captures: { plan_idem_id: $.data.id }
            - call: "POST /api/v1/allocation-plans/${plan_idem_id}/entries"
              payload:
                customer_code: "CUST-IDEM"
                customer_name: "Idem Customer"
                requested_kg: 100.000
              as: SUPPLY_CHAIN_PLANNER
              captures: { entry_idem_id: $.data.id }
            - call: "GET /api/v1/allocation-plans/${plan_idem_id}"
              as: SUPPLY_CHAIN_PLANNER
              captures: { plan_idem_ver: $.data.version }
            - call: "POST /api/v1/allocation-plans/${plan_idem_id}/activate"
