  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: assignment_create_cancel_conserves_coverage_minutes
        grounds:
          - state_machines.ShiftAssignment.SCHEDULED_to_CANCELLED
          - calculations.shift_coverage_gap
          - endpoints.POST_/inspection/shift-assignments/{id}/cancel
        distinguishing_aspect: "Conserved quantity = coverage-gap minutes on the ShiftWindow: create(SCHEDULED) then cancel returns provisional_gap_minutes and final_gap_minutes to their pre-create baseline (240/240); the sibling invariant conserves a count, not minutes."
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z. Establishment granted. Window 06:00-14:00 (480 min), 1 line; one CONFIRMED assignment 06:00-10:00; verify-coverage establishes the baseline provisional/final gaps (240/240) and flags COVERAGE_GAP_FLAGGED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /inspection/establishments"
              payload: { name: "D18 Beef Plant", species_classes: ["CATTLE"], slaughter_capable: true }
              as: ProgramAdministrator
              captures: { est_id: $.data.id }
