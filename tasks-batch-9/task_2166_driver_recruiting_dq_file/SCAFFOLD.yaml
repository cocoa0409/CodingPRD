    path: "/tuition-agreements"
    description: "Lists tuition agreements; applicant_id is the reverse-reachability filter."
    roles: [Recruiter, DER, SafetyDirector, ComplianceAuditor, SchoolCoordinator, Applicant]
    code: 200
    input: ["applicant_id?", "status?", "limit?", "offset?"]
