# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# task_2658 — Machine Learning Model Deployment & Monitoring
#
# Nine §0.5 rule_ids, 21 instances total. Every instance grounds in SCAFFOLD.yaml
# §1.1–§1.7 only; deleting this file leaves the declared behaviour identical.
#
# Conventions used by every chain below:
#   * The logical clock starts at 2026-08-01T00:00:00Z (see POST /_clock/set_current_utc).
#   * Opaque operator ids are pinned as literals so the three ERR_SEGREGATION_OF_DUTIES
#     rules are always satisfiable: "u_mle_1" (MLEngineer), "u_stew_1" (DataSteward),
#     "u_appr_1" (ModelApprover), "u_rel_1" (ReliabilityEngineer), "u_admin_1" (PlatformAdmin).
#   * doc_sections carries 4 of the 5 required keys (80.00% — the exact gate boundary)
#     and repro_artifacts carries all 4 (100.00%), so submit-for-review and APPROVE
#     always clear the priority-30 documentation gate.
#   * Every expected_*_version value is a ${var} captured from a prior response.
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:

      - name: health_score_provisional_vs_final_on_monitoring_window
        grounds:
          - calculations.composite_health_score
          - entities.MonitoringWindow.fields.health_score
          - entities.MonitoringWindow.fields.health_score_variant
          - entities.MonitoringWindow.fields.baseline_delta_pct
          - entities.Deployment.fields.health_score_provisional
          - entities.Deployment.fields.health_score_final
          - state_machines.MonitoringWindow.OPEN_to_CLOSED
        distinguishing_aspect: |
          This variant pair lives on the MonitoringWindow / Deployment performance domain: the two
          variants disagree only about the DENOMINATOR of the accuracy proxy (labelled subset vs
          every served prediction with the unlabelled remainder imputed at 0.60), so one identical
          stored window yields health_score 86.08 while OPEN and 77.08 once CLOSED — a 9.00 delta
          that no other calculation in this scaffold reproduces.
        test_recipe:
          setup:
            - "clock at its 2026-08-01T00:00:00Z startup default"
            - "one Model, one APPROVED TrainingDataset, one APPROVED ModelVersion with baseline_accuracy 0.82, baseline_positive_rate 0.30, baseline_p95_latency_ms 200"
            - "one OPEN ServingEndpoint and one REALTIME Deployment ramped once, so rollout_state is RAMPING and traffic_pct is 5.00"
            - "no MonitoringWindow exists yet for that deployment"
          setup_api_calls:
            - call: "POST /models"
              payload: { name: "fraud-scorer", task_type: "CLASSIFICATION", owner_team: "risk-ml", revalidation_interval_days: 90 }
              as: MLEngineer
              as_user_id: "u_mle_1"
              captures: { m_id: $.data.id }
            - call: "POST /training-datasets"
              payload: { name: "snap-2026-07", snapshot_uri: "s3://snaps/2026-07", row_count: 1000000, feature_hash: "fs-v1", baseline_bin_proportions: [0.20, 0.20, 0.20, 0.20, 0.20], baseline_positive_rate: 0.30, license_class: "INTERNAL", pii_review_passed: true }
              as: MLEngineer
              as_user_id: "u_mle_1"
              captures: { ds_id: $.data.id }
            - call: "POST /training-datasets/${ds_id}/submit"
              payload: {}
              as: MLEngineer
              as_user_id: "u_mle_1"
            - call: "POST /training-datasets/${ds_id}/decision"
              payload: { decision: "APPROVE" }
              as: DataSteward
              as_user_id: "u_stew_1"
            - call: "POST /model-versions"
              payload: { model_id: "${m_id}", training_dataset_id: "${ds_id}", semver: "1.0.0", artifact_digest: "sha256:aaa", feature_spec_hash: "fs-v1", baseline_accuracy: 0.82, baseline_positive_rate: 0.30, baseline_p95_latency_ms: 200, doc_sections: ["INTENDED_USE", "TRAINING_DATA", "EVALUATION", "LIMITATIONS"], repro_artifacts: ["TRAINING_CODE_COMMIT", "ENV_LOCKFILE_DIGEST", "RANDOM_SEED", "FEATURE_SPEC_HASH"], evaluation_sample_quota: 5000 }
              as: MLEngineer
              as_user_id: "u_mle_1"
              captures: { v1_id: $.data.id }
            - call: "POST /model-versions/${v1_id}/submit-for-review"
              payload: {}
              as: MLEngineer
              as_user_id: "u_mle_1"
            - call: "POST /model-versions/${v1_id}/decision"
              payload: { decision: "APPROVE" }
              as: ModelApprover
              as_user_id: "u_appr_1"
            - call: "POST /serving-endpoints"
              payload: { name: "rt-cluster-a", region: "us-east-1", serving_feature_spec_hash: "fs-v1", max_traffic_pct: 100.00, deploy_cooldown_minutes: 30 }
              as: PlatformAdmin
              as_user_id: "u_admin_1"
              captures: { se1_id: $.data.id, se1_v: $.data.version }
            - call: "POST /deployments"
              payload: { model_version_id: "${v1_id}", serving_endpoint_id: "${se1_id}", pattern: "REALTIME", serve_from: "2026-08-01T00:00:00Z", serve_until: "2026-08-31T00:00:00Z", expected_serving_endpoint_version: "${se1_v}", fallback_strategy: "PREVIOUS_CHAMPION" }
              as: ReliabilityEngineer
              as_user_id: "u_rel_1"
              captures: { d1_id: $.data.id }
            - call: "POST /deployments/${d1_id}/ramp"
              payload: {}
              as: ReliabilityEngineer
              as_user_id: "u_rel_1"
          trigger:
            - call: "POST /monitoring-windows"
              payload: { deployment_id: "${d1_id}", model_version_id: "${v1_id}", window_kind: "PERFORMANCE", window_start: "2026-08-02T00:00:00Z", window_end: "2026-08-02T06:00:00Z", prediction_count: 10000, labeled_prediction_count: 2000, correct_labeled_count: 1700, positive_rate: 0.32, p95_latency_ms: 240, observed_bin_proportions: [0.10, 0.15, 0.20, 0.25, 0.30] }
              as: ReliabilityEngineer
              as_user_id: "u_rel_1"
              captures: { w1_id: $.data.id, prov_score: $.data.health_score, prov_variant: $.data.health_score_variant, prov_delta: $.data.baseline_delta_pct }
            - call: "GET /deployments/${d1_id}/health"
              payload: { score_variant: "PROVISIONAL" }
              as: ReliabilityEngineer
              as_user_id: "u_rel_1"
              captures: { read_prov: $.data.health_score }
            - call: "GET /deployments/${d1_id}/health"
              payload: { score_variant: "FINAL" }
              as: ReliabilityEngineer
              as_user_id: "u_rel_1"
              captures: { read_final_while_open: $.data.health_score }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-04T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u_admin_1"
            - call: "POST /monitoring-windows/${w1_id}/close"
              payload: {}
              as: ReliabilityEngineer
              as_user_id: "u_rel_1"
              captures: { final_score: $.data.health_score, final_variant: $.data.health_score_variant, final_delta: $.data.baseline_delta_pct }
          assert:
            - "at creation: MonitoringWindow.${w1_id}.health_score == 86.08"
            - "at creation: MonitoringWindow.${w1_id}.health_score_variant == 'PROVISIONAL'"
            - "at creation: MonitoringWindow.${w1_id}.baseline_delta_pct == 4.08"
            - "at creation: Deployment.${d1_id}.health_score_provisional == 86.08"
            - "GET /deployments/${d1_id}/health with score_variant=PROVISIONAL returns health_score 86.08"
            - "GET /deployments/${d1_id}/health with score_variant=FINAL over the still-OPEN window returns health_score 77.08 and MonitoringWindow.${w1_id}.health_score is still 86.08 (the on-demand FINAL read is not persisted)"
            - "after close: MonitoringWindow.${w1_id}.health_score == 77.08"
            - "after close: MonitoringWindow.${w1_id}.health_score_variant == 'FINAL'"
            - "after close: MonitoringWindow.${w1_id}.baseline_delta_pct == -4.92"
            - "after close: Deployment.${d1_id}.health_score_final == 77.08 and Deployment.${d1_id}.health_score_provisional is still 86.08"
            - "86.08 - 77.08 == 9.00 on byte-identical window inputs"
            - "Deployment.${d1_id}.health_state == 'HEALTHY' (the FINAL score 77.08 is below HEALTH_RECOVERY_MIN_SCORE 80.00 but the deployment was never DEGRADED)"

      - name: revalidation_due_date_approval_anchor_vs_pass_anchor
        grounds:
          - calculations.revalidation_schedule
          - entities.ModelVersion.fields.revalidation_due_at
          - entities.ModelVersion.fields.approved_at
          - entities.Model.fields.revalidation_interval_days
          - entities.RevalidationTask.fields.due_at
          - state_machines.RevalidationTask.DUE_to_IN_REVIEW
          - state_machines.RevalidationTask.IN_REVIEW_to_PASSED
        distinguishing_aspect: |
          This variant pair lives on the ModelVersion scheduling domain, not on any monitoring
          metric: the two variants differ in their ANCHOR INSTANT (approved_at vs clock_now at
          disposition), so a revalidation performed 6 days late pushes the next due date to
          2027-02-03T00:00:00Z instead of the cadence-preserving 2027-01-28T00:00:00Z.
        test_recipe:
          setup:
            - "clock at its 2026-08-01T00:00:00Z startup default"
            - "one Model with revalidation_interval_days 90 and one APPROVED ModelVersion approved at exactly 2026-08-01T00:00:00Z"
            - "no RevalidationTask exists yet"
          setup_api_calls:
            - call: "POST /models"
              payload: { name: "fraud-scorer", task_type: "CLASSIFICATION", owner_team: "risk-ml", revalidation_interval_days: 90 }
              as: MLEngineer
              as_user_id: "u_mle_1"
              captures: { m_id: $.data.id }
            - call: "POST /training-datasets"
              payload: { name: "snap-2026-07", snapshot_uri: "s3://snaps/2026-07", row_count: 1000000, feature_hash: "fs-v1", baseline_bin_proportions: [0.20, 0.20, 0.20, 0.20, 0.20], baseline_positive_rate: 0.30, license_class: "INTERNAL", pii_review_passed: true }
              as: MLEngineer
              as_user_id: "u_mle_1"
              captures: { ds_id: $.data.id }
            - call: "POST /training-datasets/${ds_id}/submit"
              payload: {}
              as: MLEngineer
              as_user_id: "u_mle_1"
            - call: "POST /training-datasets/${ds_id}/decision"
              payload: { decision: "APPROVE" }
              as: DataSteward
              as_user_id: "u_stew_1"
            - call: "POST /model-versions"
              payload: { model_id: "${m_id}", training_dataset_id: "${ds_id}", semver: "1.0.0", artifact_digest: "sha256:aaa", feature_spec_hash: "fs-v1", baseline_accuracy: 0.82, baseline_positive_rate: 0.30, baseline_p95_latency_ms: 200, doc_sections: ["INTENDED_USE", "TRAINING_DATA", "EVALUATION", "LIMITATIONS"], repro_artifacts: ["TRAINING_CODE_COMMIT", "ENV_LOCKFILE_DIGEST", "RANDOM_SEED", "FEATURE_SPEC_HASH"] }
              as: MLEngineer
              as_user_id: "u_mle_1"
              captures: { v1_id: $.data.id }
            - call: "POST /model-versions/${v1_id}/submit-for-review"
              payload: {}
              as: MLEngineer
              as_user_id: "u_mle_1"
            - call: "POST /model-versions/${v1_id}/decision"
              payload: { decision: "APPROVE" }
              as: ModelApprover
              as_user_id: "u_appr_1"
              captures: { v1_approved_at: $.data.approved_at, v1_due_at: $.data.revalidation_due_at }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-11-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u_admin_1"
            - call: "POST /_ops/revalidation-sweep"
              payload: {}
              as: PlatformAdmin
              as_user_id: "u_admin_1"
              captures: { created_count: $.data.created_count }
            - call: "GET /revalidation-tasks"
              payload: { model_version_id: "${v1_id}", status: "DUE" }
              as: ModelApprover
              as_user_id: "u_appr_1"
              captures: { rt_id: "$.data[0].id", rt_due: "$.data[0].due_at" }
            - call: "POST /revalidation-tasks/${rt_id}/disposition"
              payload: { action: "START_REVIEW" }
              as: ModelApprover
              as_user_id: "u_appr_2"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-11-05T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u_admin_1"
            - call: "POST /revalidation-tasks/${rt_id}/disposition"
              payload: { action: "PASS", findings: "metrics stable, no action" }
              as: ModelApprover
              as_user_id: "u_appr_2"
          assert:
            - "APPROVAL_ANCHOR: ModelVersion.${v1_id}.approved_at == '2026-08-01T00:00:00Z' and ModelVersion.${v1_id}.revalidation_due_at == '2026-10-30T00:00:00Z'"
            - "the sweep at clock 2026-11-01T00:00:00Z reports created_count == 1 and the created RevalidationTask.${rt_id}.due_at == '2026-10-30T00:00:00Z' with swept_at == '2026-11-01T00:00:00Z'"
            - "PASS_ANCHOR: after the PASS disposition at clock 2026-11-05T00:00:00Z, ModelVersion.${v1_id}.revalidation_due_at == '2027-02-03T00:00:00Z'"
            - "the PASS_ANCHOR result is NOT '2027-01-28T00:00:00Z' (due_at + 90 days) and NOT '2026-10-30T00:00:00Z' unchanged — the late revalidation shifts the whole cadence"
            - "RevalidationTask.${rt_id}.status == 'PASSED' and RevalidationTask.${rt_id}.decided_at == '2026-11-05T00:00:00Z'"
            - "ModelVersion.${v1_id}.approved_at is still '2026-08-01T00:00:00Z' — the PASS variant does not touch the approval anchor"

      - name: drift_index_training_baseline_vs_rolling_baseline
        grounds:
          - calculations.drift_index
          - entities.DriftReport.fields.baseline_mode
          - entities.DriftReport.fields.effective_baseline_mode
          - entities.DriftReport.fields.expected_bin_proportions
          - entities.DriftReport.fields.windows_used_count
          - entities.DriftReport.fields.severity
          - state_machines.DriftReport.COMPUTED_to_BREACHED
        distinguishing_aspect: |
          This variant pair lives on the DriftReport / TrainingDataset distribution domain: the two
          variants disagree about the EXPECTED distribution (the frozen snapshot's five bin
          proportions vs the element-wise mean of the three most recent CLOSED DISTRIBUTION
          windows), so the very same observed vector [0.10,0.15,0.20,0.25,0.30] scores
          drift_index 0.1354 with severity WARN under TRAINING_BASELINE and 0.0094 with severity
          NONE under ROLLING_BASELINE — one raises a RetrainingTrigger and the other raises none.
        test_recipe:
          setup:
            - "clock at its 2026-08-01T00:00:00Z startup default, later advanced to 2026-08-06T00:00:00Z"
            - "one APPROVED ModelVersion whose TrainingDataset.baseline_bin_proportions is [0.20,0.20,0.20,0.20,0.20]"
            - "one REALTIME Deployment in RAMPING with traffic_pct 5.00"
            - "four DISTRIBUTION MonitoringWindows on that deployment, all CLOSED, with pairwise non-touching intervals: W1 [08-02T00:00,08-02T06:00] observed [0.12,0.16,0.20,0.24,0.28], W2 [08-03T00:00,08-03T06:00] observed [0.14,0.16,0.20,0.24,0.26], W3 [08-04T00:00,08-04T06:00] observed [0.10,0.18,0.20,0.26,0.26], W4 [08-05T00:00,08-05T06:00] observed [0.10,0.15,0.20,0.25,0.30]"
          setup_api_calls:
            - call: "POST /models"
              payload: { name: "fraud-scorer", task_type: "CLASSIFICATION", owner_team: "risk-ml", revalidation_interval_days: 90 }
              as: MLEngineer
              as_user_id: "u_mle_1"
              captures: { m_id: $.data.id }
            - call: "POST /training-datasets"
              payload: { name: "snap-2026-07", snapshot_uri: "s3://snaps/2026-07", row_count: 1000000, feature_hash: "fs-v1", baseline_bin_proportions: [0.20, 0.20, 0.20, 0.20, 0.20], baseline_positive_rate: 0.30, license_class: "INTERNAL", pii_review_passed: true }
              as: MLEngineer
              as_user_id: "u_mle_1"
              captures: { ds_id: $.data.id }
            - call: "POST /training-datasets/${ds_id}/submit"
              payload: {}
              as: MLEngineer
              as_user_id: "u_mle_1"
            - call: "POST /training-datasets/${ds_id}/decision"
              payload: { decision: "APPROVE" }
              as: DataSteward
              as_user_id: "u_stew_1"
            - call: "POST /model-versions"
              payload: { model_id: "${m_id}", training_dataset_id: "${ds_id}", semver: "1.0.0", artifact_digest: "sha256:aaa", feature_spec_hash: "fs-v1", baseline_accuracy: 0.82, baseline_positive_rate: 0.30, baseline_p95_latency_ms: 200, doc_sections: ["INTENDED_USE", "TRAINING_DATA", "EVALUATION", "LIMITATIONS"], repro_artifacts: ["TRAINING_CODE_COMMIT", "ENV_LOCKFILE_DIGEST", "RANDOM_SEED", "FEATURE_SPEC_HASH"] }
              as: MLEngineer
              as_user_id: "u_mle_1"
              captures: { v1_id: $.data.id }
            - call: "POST /model-versions/${v1_id}/submit-for-review"
              payload: {}
              as: MLEngineer
              as_user_id: "u_mle_1"
            - call: "POST /model-versions/${v1_id}/decision"
              payload: { decision: "APPROVE" }
              as: ModelApprover
              as_user_id: "u_appr_1"
            - call: "POST /serving-endpoints"
              payload: { name: "rt-cluster-a", region: "us-east-1", serving_feature_spec_hash: "fs-v1", max_traffic_pct: 100.00, deploy_cooldown_minutes: 30 }
              as: PlatformAdmin
              as_user_id: "u_admin_1"
              captures: { se1_id: $.data.id, se1_v: $.data.version }
            - call: "POST /deployments"
              payload: { model_version_id: "${v1_id}", serving_endpoint_id: "${se1_id}", pattern: "REALTIME", serve_from: "2026-08-01T00:00:00Z", serve_until: "2026-08-31T00:00:00Z", expected_serving_endpoint_version: "${se1_v}", fallback_strategy: "PREVIOUS_CHAMPION" }
              as: ReliabilityEngineer
              as_user_id: "u_rel_1"
              captures: { d1_id: $.data.id }
            - call: "POST /deployments/${d1_id}/ramp"
              payload: {}
              as: ReliabilityEngineer
              as_user_id: "u_rel_1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-06T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u_admin_1"
            - call: "POST /monitoring-windows"
              payload: { deployment_id: "${d1_id}", model_version_id: "${v1_id}", window_kind: "DISTRIBUTION", window_start: "2026-08-02T00:00:00Z", window_end: "2026-08-02T06:00:00Z", prediction_count: 8000, labeled_prediction_count: 4000, correct_labeled_count: 3400, positive_rate: 0.30, p95_latency_ms: 200, observed_bin_proportions: [0.12, 0.16, 0.20, 0.24, 0.28] }
              as: ReliabilityEngineer
              as_user_id: "u_rel_1"
              captures: { w1_id: $.data.id }
            - call: "POST /monitoring-windows/${w1_id}/close"
              payload: {}
              as: ReliabilityEngineer
              as_user_id: "u_rel_1"
            - call: "POST /monitoring-windows"
              payload: { deployment_id: "${d1_id}", model_version_id: "${v1_id}", window_kind: "DISTRIBUTION", window_start: "2026-08-03T00:00:00Z", window_end: "2026-08-03T06:00:00Z", prediction_count: 8000, labeled_prediction_count: 4000, correct_labeled_count: 3400, positive_rate: 0.30, p95_latency_ms: 200, observed_bin_proportions: [0.14, 0.16, 0.20, 0.24, 0.26] }
              as: ReliabilityEngineer
              as_user_id: "u_rel_1"
              captures: { w2_id: $.data.id }
            - call: "POST /monitoring-windows/${w2_id}/close"
              payload: {}
              as: ReliabilityEngineer
              as_user_id: "u_rel_1"
            - call: "POST /monitoring-windows"
              payload: { deployment_id: "${d1_id}", model_version_id: "${v1_id}", window_kind: "DISTRIBUTION", window_start: "2026-08-04T00:00:00Z", window_end: "2026-08-04T06:00:00Z", prediction_count: 8000, labeled_prediction_count: 4000, correct_labeled_count: 3400, positive_rate: 0.30, p95_latency_ms: 200, observed_bin_proportions: [0.10, 0.18, 0.20, 0.26, 0.26] }
              as: ReliabilityEngineer
              as_user_id: "u_rel_1"
              captures: { w3_id: $.data.id }
            - call: "POST /monitoring-windows/${w3_id}/close"
              payload: {}
              as: ReliabilityEngineer
              as_user_id: "u_rel_1"
            - call: "POST /monitoring-windows"
              payload: { deployment_id: "${d1_id}", model_version_id: "${v1_id}", window_kind: "DISTRIBUTION", window_start: "2026-08-05T00:00:00Z", window_end: "2026-08-05T06:00:00Z", prediction_count: 8000, labeled_prediction_count: 4000, correct_labeled_count: 3400, positive_rate: 0.30, p95_latency_ms: 200, observed_bin_proportions: [0.10, 0.15, 0.20, 0.25, 0.30] }
              as: ReliabilityEngineer
              as_user_id: "u_rel_1"
              captures: { w4_id: $.data.id }
            - call: "POST /monitoring-windows/${w4_id}/close"
              payload: {}
              as: ReliabilityEngineer
              as_user_id: "u_rel_1"
          trigger:
            - call: "POST /drift-reports"
              payload: { monitoring_window_id: "${w4_id}", drift_kind: "DATA_DRIFT", baseline_mode: "ROLLING_BASELINE" }
              as: MLEngineer
              as_user_id: "u_mle_1"
              captures: { dr_roll_id: $.data.id, roll_index: $.data.drift_index, roll_sev: $.data.severity, roll_used: $.data.windows_used_count }
            - call: "POST /drift-reports"
              payload: { monitoring_window_id: "${w4_id}", drift_kind: "DATA_DRIFT", baseline_mode: "TRAINING_BASELINE" }
              as: MLEngineer
              as_user_id: "u_mle_1"
              captures: { dr_train_id: $.data.id, train_index: $.data.drift_index, train_sev: $.data.severity, train_used: $.data.windows_used_count }
          assert:
            - "ROLLING_BASELINE: DriftReport.${dr_roll_id}.expected_bin_proportions == [0.1200, 0.1667, 0.2000, 0.2467, 0.2667]"
            - "ROLLING_BASELINE: DriftReport.${dr_roll_id}.drift_index == 0.0094"
            - "ROLLING_BASELINE: DriftReport.${dr_roll_id}.severity == 'NONE' and status == 'COMPUTED' (not BREACHED)"
            - "ROLLING_BASELINE: DriftReport.${dr_roll_id}.windows_used_count == 3, effective_baseline_mode == 'ROLLING_BASELINE', baseline_dataset_id is null"
            - "ROLLING_BASELINE raises nothing: GET /retraining-triggers?model_id=${m_id} returns total_count 0 immediately after the first trigger call"
            - "TRAINING_BASELINE: DriftReport.${dr_train_id}.expected_bin_proportions == [0.2000, 0.2000, 0.2000, 0.2000, 0.2000]"
            - "TRAINING_BASELINE: DriftReport.${dr_train_id}.drift_index == 0.1354"
            - "TRAINING_BASELINE: DriftReport.${dr_train_id}.severity == 'WARN' and status == 'BREACHED'"
