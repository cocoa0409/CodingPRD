  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: tunnel_trailing_buffer_overlap
        grounds:
          - calculations.tunnel_window_conflict
          - validations[priority=15]
          - errors[ERR_TUNNEL_WINDOW_CONFLICT]
        distinguishing_aspect: |
          Interval semantics #1 on resource Tunnel (via TunnelBooking): half-open
          windows with a TRAILING 30-minute buffer — a booking starting exactly at the
          previous booking's end (12:00 == 12:00) still CONFLICTS because the buffer
          extends occupancy to 12:30; pure half-open adjacency would allow it.
        test_recipe:
          setup:
            - "Tunnel T-1; run R-A holds BOOKED booking 2026-08-10T10:00-12:00"
            - "Run R-B SCHEDULED, 1000 planned units (throughput fits any 1-hour window)"
          setup_api_calls:
            - { call: "POST /products", payload: { sku_code: "BAR-VAN-70", product_name: "Vanilla Bar 70ml", format: NOVELTY, flavor_family: VANILLA, allergens: [MILK], fill_volume_ml_per_unit: 70, target_overrun_pct: 40, units_per_pallet: 100, shelf_life_days: 540 }, as: PlantManager, captures: { p_bar: $.data.id } }
            - { call: "POST /lines", payload: { line_code: "L-1", format: NOVELTY, rate_units_per_hour: 12000 }, as: PlantManager, captures: { l1: $.data.id } }
            - { call: "POST /tunnels", payload: { tunnel_code: "T-1", max_units_per_hour: 20000 }, as: PlantManager, captures: { t1: $.data.id } }
            - { call: "POST /production-runs", payload: { run_code: "R-A", product_id: "${p_bar}", line_id: "${l1}", planned_units: 1000, scheduled_start: "2026-08-10T10:00:00Z" }, as: ProductionPlanner, captures: { ra: $.data.id } }
            - { call: "POST /tunnel-bookings", payload: { tunnel_id: "${t1}", run_id: "${ra}", start_at: "2026-08-10T10:00:00Z", end_at: "2026-08-10T12:00:00Z" }, as: ProductionPlanner }
            - { call: "POST /production-runs", payload: { run_code: "R-B", product_id: "${p_bar}", line_id: "${l1}", planned_units: 1000, scheduled_start: "2026-08-10T12:30:00Z" }, as: ProductionPlanner, captures: { rb: $.data.id } }
          trigger:
            - call: "POST /tunnel-bookings"
              payload: { tunnel_id: "${t1}", run_id: "${rb}", start_at: "2026-08-10T12:00:00Z", end_at: "2026-08-10T13:00:00Z" }
              as: ProductionPlanner
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_TUNNEL_WINDOW_CONFLICT even though new.start_at == existing.end_at (trailing buffer 30 min extends occupancy)"
            - "GET /tunnel-bookings?run_id=${rb} returns zero rows (no booking persisted)"

      - name: zone_day_aggregate_capacity_overlap
        grounds:
          - calculations.freezer_zone_capacity
          - validations[priority=19]
          - errors[ERR_ZONE_CAPACITY_EXCEEDED]
        distinguishing_aspect: |
          Interval semantics #2 on a DIFFERENT resource entity (FreezerZone):
          day-granular AGGREGATE capacity with no adjacency/buffer notion — the second
          lot's completion is rejected because on every shared occupancy day the summed
          per-lot pallets (3 + 3 = 6) exceed capacity 5, even though the two production
          times never overlap.
        test_recipe:
          setup:
            - "Zone Z-C capacity 5 pallets; product BULK-PINT 100 units/pallet shelf 540 days"
            - "Run R-C1 completed 300 units into Z-C (lot occupies 3 pallets from 2026-08-10 for 540 days)"
            - "Run R-C2 (same product, 250 units = 3 pallets) is IN_PRODUCTION and attempts completion into Z-C"
          setup_api_calls:
            - { call: "POST /products", payload: { sku_code: "BULK-PINT", product_name: "Vanilla Pint", format: BULK, flavor_family: VANILLA, allergens: [MILK], fill_volume_ml_per_unit: 473, target_overrun_pct: 30, units_per_pallet: 100, shelf_life_days: 540 }, as: PlantManager, captures: { p_pint: $.data.id } }
            - { call: "POST /lines", payload: { line_code: "L-B", format: BULK, rate_units_per_hour: 8000 }, as: PlantManager, captures: { lb: $.data.id } }
            - { call: "POST /tunnels", payload: { tunnel_code: "T-2", max_units_per_hour: 20000 }, as: PlantManager, captures: { t2: $.data.id } }
            - { call: "POST /freezer-zones", payload: { zone_code: "Z-C", pallet_capacity: 5 }, as: PlantManager, captures: { zc: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T08:00:00Z" }, as: PlantManager }
            - { call: "POST /mix-batches", payload: { batch_code: "MB-C", product_id: "${p_pint}", litres_produced: 500 }, as: ProductionPlanner, captures: { m1: $.data.id } }
            - { call: "POST /mix-batches/${m1}/pasteurize", payload: {}, as: LineOperator, as_user_id: "op_1" }
            - { call: "POST /mix-batches/${m1}/release", payload: {}, as: QAManager, as_user_id: "qa_1" }
            - { call: "POST /production-runs", payload: { run_code: "R-C1", product_id: "${p_pint}", line_id: "${lb}", planned_units: 300, scheduled_start: "2026-08-10T14:00:00Z" }, as: ProductionPlanner, captures: { rc1: $.data.id } }
            - { call: "POST /changeovers", payload: { line_id: "${lb}", to_product_id: "${p_pint}" }, as: ProductionPlanner, captures: { ch1: $.data.id } }
            - { call: "POST /changeovers/${ch1}/complete", payload: {}, as: LineOperator, as_user_id: "op_1" }
            - { call: "POST /changeovers/${ch1}/verify", payload: { outcome: PASS }, as: QAManager, as_user_id: "qa_1" }
            - { call: "POST /tunnel-bookings", payload: { tunnel_id: "${t2}", run_id: "${rc1}", start_at: "2026-08-10T13:00:00Z", end_at: "2026-08-10T14:00:00Z" }, as: ProductionPlanner }
            - { call: "POST /production-runs/${rc1}/assign-mix", payload: { mix_batch_id: "${m1}" }, as: ProductionPlanner }
            - { call: "POST /production-runs/${rc1}/start", payload: {}, as: LineOperator, as_user_id: "op_1" }
            - { call: "POST /production-runs/${rc1}/complete", payload: { actual_units: 300, mix_metered_litres: 120.0, zone_id: "${zc}" }, as: LineOperator, as_user_id: "op_1" }
            - { call: "POST /production-runs", payload: { run_code: "R-C2", product_id: "${p_pint}", line_id: "${lb}", planned_units: 250, scheduled_start: "2026-08-10T16:00:00Z" }, as: ProductionPlanner, captures: { rc2: $.data.id } }
            - { call: "POST /changeovers", payload: { line_id: "${lb}", to_product_id: "${p_pint}" }, as: ProductionPlanner, captures: { ch2: $.data.id } }
            - { call: "POST /changeovers/${ch2}/complete", payload: {}, as: LineOperator, as_user_id: "op_1" }
            - { call: "POST /changeovers/${ch2}/verify", payload: { outcome: PASS }, as: QAManager, as_user_id: "qa_1" }
            - { call: "POST /tunnel-bookings", payload: { tunnel_id: "${t2}", run_id: "${rc2}", start_at: "2026-08-10T15:00:00Z", end_at: "2026-08-10T16:00:00Z" }, as: ProductionPlanner }
            - { call: "POST /production-runs/${rc2}/assign-mix", payload: { mix_batch_id: "${m1}" }, as: ProductionPlanner }
            - { call: "POST /production-runs/${rc2}/start", payload: {}, as: LineOperator, as_user_id: "op_1" }
          trigger:
            - call: "POST /production-runs/${rc2}/complete"
              payload: { actual_units: 250, mix_metered_litres: 100.0, zone_id: "${zc}" }
              as: LineOperator
              as_user_id: "op_1"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_ZONE_CAPACITY_EXCEEDED (3 existing pallets + ceil(250/100)=3 new = 6 > 5 on every shared occupancy day)"
            - "Run.${rc2}.status remains IN_PRODUCTION (no lot created; side effects did not fire)"
            - "GET /inventory-lots?run_id=${rc2} returns zero rows"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: lot_units_conservation
        grounds:
          - entities.InventoryLot.fields.units_available
          - entities.InventoryLot.fields.units_reserved
          - entities.InventoryLot.fields.units_shipped
          - entities.InventoryLot.fields.units_destroyed
        distinguishing_aspect: |
          Conserved quantity = LOT UNITS: for every lot,
          units_available + units_reserved + units_shipped + units_destroyed ==
          units_produced (10000) after every forward/compensating pair — allocate
          (forward) + release (compensation) nets zero, then allocate + deliver moves
          units reserved -> shipped without drift.
        test_recipe:
          setup:
            - "Completed lot of 10000 units in zone Z-A; customer C-DIST; shipment SH-U PLANNED"
          setup_api_calls:
            - { call: "POST /products", payload: { sku_code: "BAR-VAN-70", product_name: "Vanilla Bar 70ml", format: NOVELTY, flavor_family: VANILLA, allergens: [MILK], fill_volume_ml_per_unit: 70, target_overrun_pct: 40, units_per_pallet: 100, shelf_life_days: 540 }, as: PlantManager, captures: { p_bar: $.data.id } }
            - { call: "POST /lines", payload: { line_code: "L-1", format: NOVELTY, rate_units_per_hour: 12000 }, as: PlantManager, captures: { l1: $.data.id } }
            - { call: "POST /tunnels", payload: { tunnel_code: "T-1", max_units_per_hour: 20000 }, as: PlantManager, captures: { t1: $.data.id } }
            - { call: "POST /freezer-zones", payload: { zone_code: "Z-A", pallet_capacity: 400 }, as: PlantManager, captures: { z_a: $.data.id } }
            - { call: "POST /customers", payload: { customer_code: "C-DIST", display_name: "Distributor Co", kind: DISTRIBUTOR }, as: PlantManager, captures: { c_dist: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T08:00:00Z" }, as: PlantManager }
            - { call: "POST /mix-batches", payload: { batch_code: "MB-1", product_id: "${p_bar}", litres_produced: 1000 }, as: ProductionPlanner, captures: { m1: $.data.id } }
            - { call: "POST /mix-batches/${m1}/pasteurize", payload: {}, as: LineOperator, as_user_id: "op_1" }
            - { call: "POST /mix-batches/${m1}/release", payload: {}, as: QAManager, as_user_id: "qa_1" }
            - { call: "POST /production-runs", payload: { run_code: "R-U", product_id: "${p_bar}", line_id: "${l1}", planned_units: 10000, scheduled_start: "2026-08-10T14:00:00Z" }, as: ProductionPlanner, captures: { r1: $.data.id } }
            - { call: "POST /changeovers", payload: { line_id: "${l1}", to_product_id: "${p_bar}" }, as: ProductionPlanner, captures: { ch1: $.data.id } }
            - { call: "POST /changeovers/${ch1}/complete", payload: {}, as: LineOperator, as_user_id: "op_1" }
            - { call: "POST /changeovers/${ch1}/verify", payload: { outcome: PASS }, as: QAManager, as_user_id: "qa_1" }
            - { call: "POST /tunnel-bookings", payload: { tunnel_id: "${t1}", run_id: "${r1}", start_at: "2026-08-10T13:00:00Z", end_at: "2026-08-10T15:00:00Z" }, as: ProductionPlanner }
            - { call: "POST /production-runs/${r1}/assign-mix", payload: { mix_batch_id: "${m1}" }, as: ProductionPlanner }
            - { call: "POST /production-runs/${r1}/start", payload: {}, as: LineOperator, as_user_id: "op_1" }
            - { call: "POST /production-runs/${r1}/complete", payload: { actual_units: 10000, mix_metered_litres: 460.0, zone_id: "${z_a}" }, as: LineOperator, as_user_id: "op_1" }
            - { call: "GET /inventory-lots", payload: { run_id: "${r1}" }, as: QAManager, captures: { lot1: "$.data[0].id" } }
            - { call: "POST /shipments", payload: { shipment_code: "SH-U", customer_id: "${c_dist}" }, as: WarehouseLead, captures: { s1: $.data.id } }
          trigger:
            - { call: "POST /shipments/${s1}/allocations", payload: { lot_id: "${lot1}", units: 3000 }, as: WarehouseLead, captures: { al1: $.data.id } }
            - { call: "GET /inventory-lots/${lot1}", payload: {}, as: WarehouseLead, captures: { a_avail: $.data.units_available, a_res: $.data.units_reserved } }
            - { call: "POST /shipment-allocations/${al1}/release", payload: {}, as: WarehouseLead }
            - { call: "GET /inventory-lots/${lot1}", payload: {}, as: WarehouseLead, captures: { b_avail: $.data.units_available, b_res: $.data.units_reserved } }
            - { call: "POST /shipments/${s1}/allocations", payload: { lot_id: "${lot1}", units: 4000 }, as: WarehouseLead }
            - { call: "POST /shipments/${s1}/load", payload: {}, as: WarehouseLead }
            - { call: "POST /shipments/${s1}/dispatch", payload: {}, as: WarehouseLead }
            - { call: "POST /shipments/${s1}/deliver", payload: {}, as: WarehouseLead }
            - { call: "GET /inventory-lots/${lot1}", payload: {}, as: WarehouseLead, captures: { c_avail: $.data.units_available, c_res: $.data.units_reserved, c_ship: $.data.units_shipped, c_dest: $.data.units_destroyed } }
          assert:
            - "after allocate 3000: units_available == 7000, units_reserved == 3000 (sum 10000)"
            - "after release (compensation): units_available == 10000, units_reserved == 0 (forward action fully undone)"
            - "after allocate 4000 + deliver: units_available == 6000, units_reserved == 0, units_shipped == 4000, units_destroyed == 0"
            - "invariant holds at every step: available + reserved + shipped + destroyed == units_produced == 10000"

      - name: mix_litres_conservation
        grounds:
          - entities.MixBatch.fields.litres_consumed
          - entities.MixBatch.fields.litres_wasted
          - entities.MixBatch.fields.litres_remaining
          - state_machines.MixBatch
        distinguishing_aspect: |
          Different conserved quantity than the sibling instance: MIX LITRES. For every
          batch, litres_consumed + litres_wasted + litres_remaining == litres_produced
          (500.0) across consume (run complete, forward), cancel-from-MIX_ASSIGNED
          (compensation: consumes nothing, detaches cleanly), and reject (waste
          write-off of the remainder).
        test_recipe:
          setup:
            - "Mix batch MB-V of 500 litres RELEASED for BAR-VAN-70"
            - "Run R-V1 completes with metered 200.0 litres (consumes 200)"
            - "Run R-V2 assigns MB-V then is canceled from MIX_ASSIGNED (compensating un-assign)"
            - "QA then rejects MB-V, writing off the remaining 300 litres as waste"
          setup_api_calls:
            - { call: "POST /products", payload: { sku_code: "BAR-VAN-70", product_name: "Vanilla Bar 70ml", format: NOVELTY, flavor_family: VANILLA, allergens: [MILK], fill_volume_ml_per_unit: 70, target_overrun_pct: 40, units_per_pallet: 100, shelf_life_days: 540 }, as: PlantManager, captures: { p_bar: $.data.id } }
            - { call: "POST /lines", payload: { line_code: "L-1", format: NOVELTY, rate_units_per_hour: 12000 }, as: PlantManager, captures: { l1: $.data.id } }
            - { call: "POST /tunnels", payload: { tunnel_code: "T-1", max_units_per_hour: 20000 }, as: PlantManager, captures: { t1: $.data.id } }
            - { call: "POST /freezer-zones", payload: { zone_code: "Z-A", pallet_capacity: 400 }, as: PlantManager, captures: { z_a: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T08:00:00Z" }, as: PlantManager }
            - { call: "POST /mix-batches", payload: { batch_code: "MB-V", product_id: "${p_bar}", litres_produced: 500 }, as: ProductionPlanner, captures: { m1: $.data.id } }
            - { call: "POST /mix-batches/${m1}/pasteurize", payload: {}, as: LineOperator, as_user_id: "op_1" }
            - { call: "POST /mix-batches/${m1}/release", payload: {}, as: QAManager, as_user_id: "qa_1" }
            - { call: "POST /production-runs", payload: { run_code: "R-V1", product_id: "${p_bar}", line_id: "${l1}", planned_units: 4000, scheduled_start: "2026-08-10T14:00:00Z" }, as: ProductionPlanner, captures: { rv1: $.data.id } }
            - { call: "POST /changeovers", payload: { line_id: "${l1}", to_product_id: "${p_bar}" }, as: ProductionPlanner, captures: { ch1: $.data.id } }
            - { call: "POST /changeovers/${ch1}/complete", payload: {}, as: LineOperator, as_user_id: "op_1" }
            - { call: "POST /changeovers/${ch1}/verify", payload: { outcome: PASS }, as: QAManager, as_user_id: "qa_1" }
            - { call: "POST /tunnel-bookings", payload: { tunnel_id: "${t1}", run_id: "${rv1}", start_at: "2026-08-10T13:00:00Z", end_at: "2026-08-10T14:00:00Z" }, as: ProductionPlanner }
            - { call: "POST /production-runs/${rv1}/assign-mix", payload: { mix_batch_id: "${m1}" }, as: ProductionPlanner }
            - { call: "POST /production-runs/${rv1}/start", payload: {}, as: LineOperator, as_user_id: "op_1" }
            - { call: "POST /production-runs/${rv1}/complete", payload: { actual_units: 4000, mix_metered_litres: 200.0, zone_id: "${z_a}" }, as: LineOperator, as_user_id: "op_1" }
            - { call: "POST /production-runs", payload: { run_code: "R-V2", product_id: "${p_bar}", line_id: "${l1}", planned_units: 1000, scheduled_start: "2026-08-10T16:00:00Z" }, as: ProductionPlanner, captures: { rv2: $.data.id } }
            - { call: "POST /production-runs/${rv2}/assign-mix", payload: { mix_batch_id: "${m1}" }, as: ProductionPlanner }
          trigger:
            - { call: "POST /production-runs/${rv2}/cancel", payload: {}, as: ProductionPlanner, captures: { rv2_status: $.data.status } }
            - { call: "POST /mix-batches/${m1}/reject", payload: {}, as: QAManager, as_user_id: "qa_1", captures: { mb_status: $.data.status, mb_consumed: $.data.litres_consumed, mb_wasted: $.data.litres_wasted, mb_remaining: $.data.litres_remaining } }
          assert:
            - "R-V2 cancel from MIX_ASSIGNED: status CANCELED and mix_batch_id cleared to null; no litres consumed by the canceled run"
            - "after reject: MixBatch.status == REJECTED, litres_consumed == 200.0, litres_wasted == 300.0, litres_remaining == 0.0"
            - "invariant: 200.0 consumed + 300.0 wasted + 0.0 remaining == 500.0 litres_produced (no drift from the consume + cancel + reject chain)"
