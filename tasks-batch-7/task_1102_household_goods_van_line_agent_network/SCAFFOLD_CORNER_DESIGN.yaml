      assert:
      - err == ERR_TRANSITION_NOT_ALLOWED
      - Estimate.${est}.status remains DECLINED and MoveOrder.${ord}.estimated_weight_lbs
        is null
  - name: cancel_cascades_to_children_compensation
    claim_type: side_effect_execution
