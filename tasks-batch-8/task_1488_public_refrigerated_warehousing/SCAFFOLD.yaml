# =============================================================================
# Task 1488: Public Refrigerated Warehousing (cold storage 3PL)
# =============================================================================

scenario: |
  Public Refrigerated Warehousing (cold storage 3PL): inbound receipt & pallet
  placement by temperature zone, storage rate (per pallet/month) & handling in/out
  charges, blast freezing service & scheduling, lot/FIFO release & customer
  allocation, inventory ownership & bailment liability, temperature excursion
  investigation & claim, food-safety audit & recall support, dwell &
  aged-inventory surcharge

domain_name: public-refrigerated-warehousing
api_prefix: /api

complexity_profile:
  primary_archetype: quota_allocation        # finite zone pallet capacity + blast-cell windows
  secondary_archetype: ledger_reconciliation # provisional accruals vs finalized invoice
  complexity_layers:
    - optimistic_concurrency   # OCC on Customer.version (rate-card supersede) and OutboundOrder.version (amend)
    - cascading_side_effects   # excursion confirm / recall activate fan into pallets -> lots -> allocations -> orders
    - rate_threshold_triggers  # dwell tiers at 60/90/120 days; posture thresholds; volume-discount tiers
    - ops_run_checkpoint       # POST /api/billing/run finalizes monthly invoices
  entity_topology: flat                      # peer resources linked by FK, no nested URLs
  state_machine_shape: cyclic                # Pallet parallel dims; Order/Claim/Invoice cycles; Lot compound
  relationship_patterns: [one_to_many, cross_aggregate]
  role_model: segregation_of_duties          # excursion reporter cannot adjudicate it
  consistency_model: immediate

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Customer (inventory owner / bailor) name" }
      - { name: credit_limit_cents, type: integer, source: input, description: "Maximum allowed outstanding balance in cents; >= 0" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | SUSPENDED", constraints: "SUSPENDED blocks new receipts/orders (fiscal)" }
      - { name: outstanding_balance_cents, type: integer, source: computed, description: "Sum of total_cents over invoices in {FINALIZED, DISPUTED} plus accrued-to-date (handling_in + handling_out + blast_freeze - claim_credit) on the OPEN invoice" }

  - name: RateCard
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; the customer this pricing applies to" }
      - { name: storage_method, type: enum, source: input, description: "DAILY_PRORATED | FULL_MONTH — selects storage_charge variant" }
      - { name: frozen_storage_cents_per_pallet_month, type: integer, source: input, description: "Monthly storage rate for pallets in FROZEN zones" }
      - { name: chilled_storage_cents_per_pallet_month, type: integer, source: input, description: "Monthly storage rate for pallets in CHILLED zones" }
      - { name: handling_in_cents_per_pallet, type: integer, source: input, description: "One-time inbound handling charge per received pallet" }
      - { name: handling_out_cents_per_pallet, type: integer, source: input, description: "Outbound handling charge per shipped pallet before volume discount" }
      - { name: blast_base_cents, type: integer, source: input, description: "Flat fee per completed blast-freeze booking" }
      - { name: blast_per_pallet_cents, type: integer, source: input, description: "Per-pallet blast-freeze fee" }
      - { name: liability_model, type: enum, source: input, description: "DECLARED_VALUE | LIMITED_LIABILITY — bailment liability regime for claims" }
      - { name: liability_per_pallet_cents, type: integer, source: input, description: "Liability cap per affected pallet under LIMITED_LIABILITY" }
      - { name: dwell_exempt, type: boolean, source: input, description: "If true, customer is exempt from dwell/aged-inventory surcharge" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | SUPERSEDED; at most one ACTIVE card per customer" }

  - name: TemperatureZone
    parent: null
    common_fields: true
    fields:
      - { name: zone_code, type: string, source: input, description: "Unique zone code" , constraints: "unique across all zones"}
      - { name: temp_class, type: enum, source: input, description: "FROZEN | CHILLED" }
      - { name: capacity_pallets, type: integer, source: input, description: "Total pallet positions; >= 1" }
      - { name: dock_doors, type: integer, source: input, description: "Receiving-door count bounding overlapping arrival windows; >= 1" }
      - { name: in_use_pallets, type: integer, source: computed, default: 0, description: "Pallets physically present: status in {STORED, IN_BLAST_FREEZE, ALLOCATED}" }
      - { name: reserved_pallets, type: integer, source: computed, default: 0, description: "Sum of expected_pallets over receipts for this zone in status ARRIVED" }
      - { name: free_pallets, type: integer, source: computed, description: "= capacity_pallets - in_use_pallets - reserved_pallets" }
      - { name: posture, type: enum, source: computed, description: "OPEN | TIGHT | FULL — derived from free_pallets (see zone_posture calc)" }

  - name: InboundReceipt
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; owner of the inbound goods" }
      - { name: zone_id, type: string, source: input, description: "FK -> TemperatureZone.id; pre-assigned putaway zone" }
      - { name: lot_id, type: string, source: system, description: "FK -> InventoryLot.id; nullable until COMPLETED, set by lot upsert at completion", constraints: "null until COMPLETED" }
      - { name: product_code, type: string, source: input, description: "Product SKU/code" }
      - { name: lot_code, type: string, source: input, description: "Manufacturer lot code; upsert key with customer_id+product_code" }
      - { name: production_date, type: string, source: input, description: "ISO date YYYY-MM-DD; FIFO primary key" }
      - { name: temp_class, type: enum, source: input, description: "FROZEN | CHILLED — must equal zone temp_class" }
      - { name: expected_pallets, type: integer, source: input, description: "Declared pallet count; >= 1" }
      - { name: actual_pallets, type: integer, source: system, description: "Counted at completion; null until COMPLETED", constraints: "null until COMPLETED" }
      - { name: window_start, type: datetime, source: input, description: "Scheduled arrival window start (UTC)" }
      - { name: window_end, type: datetime, source: input, description: "Scheduled arrival window end (UTC); must be > window_start" }
      - { name: status, type: enum, source: system, default: SCHEDULED, description: "SCHEDULED | ARRIVED | COMPLETED | CANCELLED" }

  - name: InventoryLot
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id" }
      - { name: product_code, type: string, source: input, description: "Product code" }
      - { name: lot_code, type: string, source: input, description: "Lot code; unique per (customer_id, product_code)", constraints: "unique per (customer_id, product_code)" }
      - { name: production_date, type: string, source: input, description: "ISO date; set by first receipt; later receipts must match" }
      - { name: on_hand_pallets, type: integer, source: computed, default: 0, description: "Pallets present: status in {STORED, IN_BLAST_FREEZE, ALLOCATED}" }
      - { name: status, type: enum, source: computed, description: "AVAILABLE | PARTIAL_HOLD | FULL_HOLD | DEPLETED | RECALLED — compound function of child pallets (see state machine)" }

  - name: Pallet
    parent: null
    common_fields: true
    fields:
      - { name: lot_id, type: string, source: system, description: "FK -> InventoryLot.id" }
      - { name: receipt_id, type: string, source: system, description: "FK -> InboundReceipt.id that created this pallet" }
      - { name: zone_id, type: string, source: system, description: "FK -> TemperatureZone.id where pallet rests" }
      - { name: customer_id, type: string, source: system, description: "FK -> Customer.id (denormalized owner)" }
      - { name: status, type: enum, source: system, default: STORED, description: "STORED | IN_BLAST_FREEZE | ALLOCATED | SHIPPED | DISPOSITIONED — custody dimension" }
      - { name: quality, type: enum, source: system, default: OK, description: "OK | QUARANTINED | RECALLED — quality-hold dimension (independent of status)" }
      - { name: received_at, type: datetime, source: system, description: "Receipt completion timestamp (UTC)" }
      - { name: last_blast_frozen_at, type: datetime, source: system, description: "Timestamp of last completed blast freeze; null if never frozen; resets dwell clock", constraints: "null until first blast-freeze completion" }
      - { name: out_at, type: datetime, source: system, description: "Timestamp pallet left custody (ship or dispose); null while present", constraints: "null while present" }
      - { name: out_reason, type: enum, source: system, description: "SHIPPED | DISPOSED; null while present", constraints: "null while present" }

  - name: OutboundOrder
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id" }
      - { name: product_code, type: string, source: input, description: "Product to release" }
      - { name: lot_code, type: string, source: input, description: "Optional lot override; restricts allocation to that lot", constraints: "optional; null means pure FIFO across lots" }
      - { name: requested_pallets, type: integer, source: input, description: "Pallets requested; >= 1" }
      - { name: allocated_pallets, type: integer, source: computed, default: 0, description: "Count of ACTIVE allocations on this order" }
      - { name: estimated_handling_out_cents, type: integer, source: computed, description: "Provisional outbound fee estimated at submit/amend (forward-looking tier)" }
      - { name: final_handling_out_cents, type: integer, source: system, description: "Actual outbound fee computed at ship; null until SHIPPED", constraints: "null until SHIPPED" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | SUBMITTED | ALLOCATED | SHORTED | SHIPPED | CANCELLED" }

  - name: Allocation
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: system, description: "FK -> OutboundOrder.id" }
      - { name: pallet_id, type: string, source: system, description: "FK -> Pallet.id" }
      - { name: lot_id, type: string, source: system, description: "FK -> InventoryLot.id (denormalized from pallet)" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | RELEASED | FULFILLED" }

  - name: BlastFreezeCell
    parent: null
    common_fields: true
    fields:
      - { name: cell_code, type: string, source: input, description: "Unique cell code", constraints: "unique across all cells" }
      - { name: capacity_pallets, type: integer, source: input, description: "Max pallets per booking; >= 1" }
      - { name: turnaround_minutes, type: integer, source: input, description: "Required gap between bookings on this cell; >= 0" }

  - name: BlastFreezeBooking
    parent: null
    common_fields: true
    fields:
      - { name: cell_id, type: string, source: input, description: "FK -> BlastFreezeCell.id" }
      - { name: lot_id, type: string, source: input, description: "FK -> InventoryLot.id whose pallets are frozen" }
      - { name: customer_id, type: string, source: system, description: "FK -> Customer.id (denormalized from lot)" }
      - { name: pallet_count, type: integer, source: input, description: "Pallets to freeze; >= 1 and <= cell capacity" }
      - { name: window_start, type: datetime, source: input, description: "Booking window start (UTC)" }
      - { name: window_end, type: datetime, source: input, description: "Booking window end (UTC); > window_start" }
      - { name: fee_cents, type: integer, source: system, description: "Charged at completion; null until COMPLETED", constraints: "null until COMPLETED" }
      - { name: status, type: enum, source: system, default: SCHEDULED, description: "SCHEDULED | IN_PROGRESS | COMPLETED | CANCELLED" }

  - name: TemperatureExcursion
    parent: null
    common_fields: true
    fields:
      - { name: zone_id, type: string, source: input, description: "FK -> TemperatureZone.id where excursion was observed" }
      - { name: observed_temp_c, type: number, source: input, description: "Observed temperature in Celsius" }
      - { name: window_start, type: datetime, source: input, description: "Excursion window start (UTC)" }
      - { name: window_end, type: datetime, source: input, description: "Excursion window end (UTC); > window_start" }
      - { name: reported_by_user_id, type: string, source: system, description: "X-User-ID of reporter (segregation-of-duties anchor)" }
      - { name: quarantined_pallet_count, type: integer, source: computed, default: 0, description: "Pallets quarantined by confirmation cascade" }
      - { name: status, type: enum, source: system, default: REPORTED, description: "REPORTED | CONFIRMED_BREACH | CLEARED" }

  - name: RecallEvent
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id" }
      - { name: product_code, type: string, source: input, description: "Recalled product" }
      - { name: lot_code, type: string, source: input, description: "Recalled lot code" }
      - { name: lot_id, type: string, source: system, description: "FK -> InventoryLot.id resolved at creation from (customer_id, product_code, lot_code)" }
      - { name: reason, type: string, source: input, description: "Recall reason" }
      - { name: status, type: enum, source: system, default: DECLARED, description: "DECLARED | ACTIVE | COMPLETED | CANCELLED" }

  - name: Claim
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; claimant (bailor)" }
      - { name: excursion_id, type: string, source: input, description: "FK -> TemperatureExcursion.id giving rise to the loss" }
      - { name: affected_pallet_count, type: integer, source: input, description: "Pallets claimed affected; >= 1; must be <= excursion.quarantined_pallet_count" }
      - { name: declared_value_cents, type: integer, source: input, description: "Bailor-declared goods value; > 0" }
      - { name: settlement_cents, type: integer, source: computed, description: "Computed at APPROVED per liability_model; null until then", constraints: "null until APPROVED" }
      - { name: status, type: enum, source: system, default: FILED, description: "FILED | UNDER_REVIEW | APPROVED | DENIED | REOPENED | SETTLED | WITHDRAWN" }

  - name: Invoice
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: system, description: "FK -> Customer.id" }
      - { name: period_start, type: datetime, source: system, description: "Billing period start (inclusive, UTC)" }
      - { name: period_end, type: datetime, source: system, description: "Billing period end (exclusive, UTC)" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN | FINALIZED | DISPUTED | SETTLED" }
      - { name: storage_cents, type: integer, source: computed, default: 0, description: "Storage charge; 0 while OPEN, computed at finalization" }
      - { name: handling_in_cents, type: integer, source: computed, default: 0, description: "Accrued live at receipt completion" }
      - { name: handling_out_cents, type: integer, source: computed, default: 0, description: "Accrued live at ship time" }
      - { name: blast_freeze_cents, type: integer, source: computed, default: 0, description: "Accrued live at booking completion" }
      - { name: dwell_surcharge_cents, type: integer, source: computed, default: 0, description: "Aged-inventory surcharge; 0 while OPEN, computed at finalization" }
      - { name: claim_credit_cents, type: integer, source: computed, default: 0, description: "Claim settlements credited to this invoice" }
      - { name: total_cents, type: integer, source: computed, default: 0, description: "= storage + handling_in + handling_out + blast_freeze + dwell_surcharge - claim_credit" }
      - { name: rate_card_id, type: string, source: system, description: "FK -> RateCard.id used at finalization; null while OPEN", constraints: "null while OPEN" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: Customer
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "PATCH /api/customers/{id} with status=SUSPENDED"
        actor: BillingAdmin
        preconditions: []
        side_effects: ["Blocks new inbound receipt creation and outbound order creation/submission (ERR_CUSTOMER_SUSPENDED)"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: "PATCH /api/customers/{id} with status=ACTIVE"
        actor: BillingAdmin
        preconditions: []
        side_effects: []

  - entity: RateCard
    initial_state: ACTIVE
    terminal_states: [SUPERSEDED]
    transitions:
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "POST /api/rate-cards for the same customer (new card created ACTIVE)"
        actor: BillingAdmin
        preconditions: ["expected_customer_version matches Customer.version (OCC)"]
        side_effects:
          - "Prior ACTIVE card -> SUPERSEDED"
          - "Customer.version incremented by 1"
        note: "Events price off the card ACTIVE at event time; invoices record rate_card_id at finalization"

  - entity: InboundReceipt
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: ARRIVED
        trigger: "POST /api/inbound-receipts/{id}/arrive"
        actor: WarehouseOperator
        preconditions:
          - "zone.posture != FULL (ERR_ZONE_FULL)"
        side_effects:
          - "zone.reserved_pallets += expected_pallets"
      - from: ARRIVED
        to: COMPLETED
        trigger: "POST /api/inbound-receipts/{id}/complete"
        actor: WarehouseOperator
        preconditions:
          - "Customer has an ACTIVE rate card (ERR_NO_ACTIVE_RATE_CARD)"
          - "actual_pallets >= 1 (ERR_VALIDATION)"
          - "If a lot with (customer_id, product_code, lot_code) already exists, its production_date must equal this receipt's production_date (ERR_LOT_PRODUCTION_DATE_MISMATCH)"
        side_effects:
          - "zone.reserved_pallets -= expected_pallets (reservation released BEFORE capacity check)"
          - "Require actual_pallets <= zone.capacity_pallets - zone.in_use_pallets - zone.reserved_pallets (ERR_ZONE_CAPACITY_EXCEEDED)"
          - "Lot upsert on (customer_id, product_code, lot_code): create InventoryLot if absent"
          - "Create actual_pallets Pallets: status=STORED, quality=OK, received_at=now, zone_id=receipt.zone_id"
          - "zone.in_use_pallets += actual_pallets"
          - "receipt.actual_pallets = actual_pallets; receipt.lot_id set"
          - "OPEN invoice.handling_in_cents += actual_pallets * rate_card.handling_in_cents_per_pallet"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /api/inbound-receipts/{id}/cancel"
        actor: "CustomerAdmin (own) or WarehouseOperator"
        preconditions: []
        side_effects: []

  - entity: Pallet
    initial_state: STORED
    terminal_states: [SHIPPED, DISPOSITIONED]
    transitions:
      # --- custody dimension (status) ---
      - from: STORED
        to: ALLOCATED
        trigger: "system (POST /api/outbound-orders/{id}/allocate FIFO selector picks this pallet)"
        actor: system
        preconditions: ["quality == OK"]
        side_effects: ["Allocation created (ACTIVE)"]
      - from: ALLOCATED
        to: STORED
        trigger: "system (allocation release: manual POST /api/allocations/{id}/release, order amend/cancel, excursion confirm, or recall activate)"
        actor: system
        preconditions: []
        side_effects: ["Allocation -> RELEASED"]
      - from: ALLOCATED
        to: SHIPPED
        trigger: "POST /api/outbound-orders/{id}/ship"
        actor: WarehouseOperator
        preconditions: []
        side_effects:
          - "out_at=now, out_reason=SHIPPED"
          - "zone.in_use_pallets -= 1"
          - "lot.on_hand_pallets recomputed; lot may become DEPLETED"
          - "Allocation -> FULFILLED"
      - from: STORED
        to: IN_BLAST_FREEZE
        trigger: "system (POST /api/blast-freeze-bookings/{id}/start pallet selector)"
        actor: system
        preconditions: ["quality == OK"]
        side_effects: []
      - from: IN_BLAST_FREEZE
        to: STORED
        trigger: "system (POST /api/blast-freeze-bookings/{id}/complete)"
        actor: system
        preconditions: []
        side_effects: ["last_blast_frozen_at = now (dwell clock reset)"]
      - from: STORED
        to: DISPOSITIONED
        trigger: "POST /api/pallets/{id}/dispose"
        actor: QualityManager
        preconditions: ["quality == RECALLED (ERR_INVALID_STATE otherwise)"]
        side_effects:
          - "out_at=now, out_reason=DISPOSED"
          - "zone.in_use_pallets -= 1"
          - "lot.on_hand_pallets recomputed"
      # --- quality dimension (quality) ---
      - from: OK
        to: QUARANTINED
        trigger: "system (POST /api/temperature-excursions/{id}/confirm cascade: pallet in excursion zone with window overlap)"
        actor: system
        preconditions: ["status in {STORED, ALLOCATED, IN_BLAST_FREEZE}", "received_at < excursion.window_start is NOT required; overlap rule: received_at < window_end AND (out_at IS NULL OR out_at > window_start)"]
        side_effects:
          - "If status == ALLOCATED: allocation -> RELEASED, pallet status -> STORED (release happens as part of this hop)"
          - "Parent lot status recomputed (bubble-up)"
          - "Order owning a released allocation: ALLOCATED -> SUBMITTED (SHORTED unchanged)"
      - from: QUARANTINED
        to: OK
        trigger: "POST /api/pallets/{id}/release-quarantine"
        actor: QualityManager
        preconditions: []
        side_effects: ["Parent lot status recomputed"]
      - from: OK
        to: RECALLED
        trigger: "system (POST /api/recalls/{id}/activate cascade)"
        actor: system
        preconditions: ["status in {STORED, ALLOCATED, IN_BLAST_FREEZE}"]
        side_effects:
          - "If status == ALLOCATED: allocation -> RELEASED, pallet status -> STORED"
          - "Order owning a released allocation: ALLOCATED -> SUBMITTED"
          - "lot.status -> RECALLED"
      - from: QUARANTINED
        to: RECALLED
        trigger: "system (POST /api/recalls/{id}/activate cascade)"
        actor: system
        preconditions: []
        side_effects: ["lot.status -> RECALLED"]
    note: "status and quality are independent parallel dimensions; guards reference both (allocate/blast require quality==OK AND status==STORED)"

  - entity: InventoryLot
    initial_state: AVAILABLE
    terminal_states: []
    transitions:
      - from: ANY
        to: COMPUTED
        trigger: "system (recomputed on every pallet creation, status change, quality change, ship, or dispose)"
        actor: system
        preconditions: []
        side_effects: []
        note: |
          Compound derived state, precedence order:
          1. RECALLED   if any present pallet (status in {STORED, IN_BLAST_FREEZE, ALLOCATED}) has quality == RECALLED
          2. DEPLETED   if on_hand_pallets == 0 and at least one pallet was ever created
          3. FULL_HOLD  if all present pallets have quality == QUARANTINED (and at least one present)
          4. PARTIAL_HOLD if some but not all present pallets have quality == QUARANTINED
          5. AVAILABLE  otherwise

  - entity: OutboundOrder
    initial_state: DRAFT
    terminal_states: [SHIPPED, CANCELLED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /api/outbound-orders/{id}/submit"
        actor: "CustomerAdmin (own)"
        preconditions:
          - "customer.status == ACTIVE (ERR_CUSTOMER_SUSPENDED)"
          - "Customer has ACTIVE rate card (ERR_NO_ACTIVE_RATE_CARD)"
          - "If lot_code set: lot exists (ERR_NOT_FOUND) and lot.status != RECALLED (ERR_LOT_RECALLED)"
          - "outstanding_balance_cents + estimated_handling_out_cents <= credit_limit_cents (ERR_CREDIT_LIMIT_EXCEEDED); evaluation order pinned in handling_out_estimate calc"
        side_effects: ["estimated_handling_out_cents computed and stored (provisional variant)"]
      - from: SUBMITTED
        to: ALLOCATED
        trigger: "POST /api/outbound-orders/{id}/allocate"
        actor: WarehouseOperator
        preconditions: []
        side_effects:
          - "FIFO selector (fifo_allocation calc) fills up to requested_pallets"
          - "Full fill (allocated_pallets == requested_pallets) -> ALLOCATED"
      - from: SUBMITTED
        to: SHORTED
        trigger: "POST /api/outbound-orders/{id}/allocate"
        actor: WarehouseOperator
        preconditions: []
        side_effects: ["Partial or zero fill (allocated_pallets < requested_pallets) -> SHORTED"]
      - from: SHORTED
        to: ALLOCATED
        trigger: "POST /api/outbound-orders/{id}/allocate (retry after more stock arrives)"
        actor: WarehouseOperator
        preconditions: []
        side_effects: ["Top-up allocation; full fill -> ALLOCATED, still short -> stays SHORTED"]
      - from: ALLOCATED
        to: SUBMITTED
        trigger: "system (allocation release: manual release, excursion confirm cascade, or recall activate cascade demotes order)"
        actor: system
        preconditions: []
        side_effects: ["allocated_pallets recomputed"]
      - from: SHORTED
        to: DRAFT
        trigger: "POST /api/outbound-orders/{id}/amend"
        actor: "CustomerAdmin (own)"
        preconditions: ["expected_order_version == version (OCC, ERR_STALE_VERSION)"]
        side_effects:
          - "All ACTIVE allocations released (pallets ALLOCATED -> STORED)"
          - "requested_pallets replaced; estimated_handling_out_cents recomputed; credit re-checked (ERR_CREDIT_LIMIT_EXCEEDED)"
          - "version incremented by 1"
      - from: DRAFT
        to: DRAFT
        trigger: "POST /api/outbound-orders/{id}/amend"
        actor: "CustomerAdmin (own)"
        preconditions: ["expected_order_version == version (OCC, ERR_STALE_VERSION)"]
        side_effects: ["requested_pallets replaced; estimate recomputed; credit re-checked; version incremented by 1"]
      - from: ALLOCATED
        to: SHIPPED
        trigger: "POST /api/outbound-orders/{id}/ship"
        actor: WarehouseOperator
        preconditions: []
        side_effects:
          - "All ACTIVE allocations -> FULFILLED; pallets ALLOCATED -> SHIPPED (out_at=now)"
          - "zone.in_use_pallets -= allocated_pallets; lots recomputed (may become DEPLETED)"
          - "final_handling_out_cents computed (final variant: volume tier at ship month)"
          - "OPEN invoice.handling_out_cents += final_handling_out_cents"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /api/outbound-orders/{id}/cancel"
        actor: "CustomerAdmin (own)"
        preconditions: []
        side_effects: []
      - from: SUBMITTED
        to: CANCELLED
        trigger: "POST /api/outbound-orders/{id}/cancel"
        actor: "CustomerAdmin (own)"
        preconditions: []
        side_effects: []
      - from: SHORTED
        to: CANCELLED
        trigger: "POST /api/outbound-orders/{id}/cancel"
        actor: "CustomerAdmin (own)"
        preconditions: []
        side_effects: ["All ACTIVE allocations released (pallets -> STORED)"]
      - from: ALLOCATED
        to: CANCELLED
        trigger: "POST /api/outbound-orders/{id}/cancel"
        actor: "CustomerAdmin (own)"
        preconditions: []
        side_effects: ["All ACTIVE allocations released (pallets -> STORED)"]

  - entity: Allocation
    initial_state: ACTIVE
    terminal_states: [RELEASED, FULFILLED]
    transitions:
      - from: ACTIVE
        to: RELEASED
        trigger: "POST /api/allocations/{id}/release OR system cascade (order amend/cancel, excursion confirm, recall activate)"
        actor: WarehouseOperator
        preconditions: []
        side_effects:
          - "Pallet ALLOCATED -> STORED"
          - "Order demoted: ALLOCATED -> SUBMITTED (SHORTED stays SHORTED); allocated_pallets recomputed"
      - from: ACTIVE
        to: FULFILLED
        trigger: "system (POST /api/outbound-orders/{id}/ship)"
        actor: system
        preconditions: []
        side_effects: ["Pallet ALLOCATED -> SHIPPED"]

  - entity: BlastFreezeBooking
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /api/blast-freeze-bookings/{id}/start"
        actor: WarehouseOperator
        preconditions:
          - "window_start <= now <= window_end (ERR_OUTSIDE_WINDOW)"
          - "Pallet selector: lot pallets with status==STORED AND quality==OK ordered by received_at ASC, created_at ASC; take pallet_count; fewer available -> ERR_INSUFFICIENT_FREEZABLE_STOCK"
        side_effects: ["Selected pallets STORED -> IN_BLAST_FREEZE"]
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /api/blast-freeze-bookings/{id}/complete"
        actor: WarehouseOperator
        preconditions: ["Customer has ACTIVE rate card (ERR_NO_ACTIVE_RATE_CARD)"]
        side_effects:
          - "Pallets IN_BLAST_FREEZE -> STORED; last_blast_frozen_at = now (dwell reset)"
          - "fee_cents = blast_base_cents + pallet_count * blast_per_pallet_cents"
          - "OPEN invoice.blast_freeze_cents += fee_cents"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /api/blast-freeze-bookings/{id}/cancel"
        actor: WarehouseOperator
        preconditions: []
        side_effects: ["Window freed: booking no longer participates in overlap checks (candidate set is status in {SCHEDULED, IN_PROGRESS})"]

  - entity: TemperatureExcursion
    initial_state: REPORTED
    terminal_states: [CONFIRMED_BREACH, CLEARED]
    transitions:
      - from: REPORTED
        to: CONFIRMED_BREACH
        trigger: "POST /api/temperature-excursions/{id}/confirm"
        actor: QualityManager
        preconditions: ["reported_by_user_id != X-User-ID (segregation of duties, ERR_SOD_VIOLATION)"]
        side_effects:
          - "Hop 1: pallets in excursion.zone_id, status in {STORED, ALLOCATED, IN_BLAST_FREEZE}, overlapping window (received_at < window_end AND (out_at IS NULL OR out_at > window_start)), quality == OK -> QUARANTINED; quarantined_pallet_count stored"
          - "Hop 2: each affected lot recomputes status (AVAILABLE -> PARTIAL_HOLD/FULL_HOLD)"
          - "Hop 3: ALLOCATED pallets among them: allocations -> RELEASED, pallets -> STORED (quality QUARANTINED retained)"
          - "Hop 4: orders owning released allocations: ALLOCATED -> SUBMITTED"
      - from: REPORTED
        to: CLEARED
        trigger: "POST /api/temperature-excursions/{id}/clear"
        actor: QualityManager
        preconditions: ["reported_by_user_id != X-User-ID (ERR_SOD_VIOLATION)"]
        side_effects: ["No quarantine occurs; quarantined_pallet_count stays 0"]

  - entity: RecallEvent
    initial_state: DECLARED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: DECLARED
        to: ACTIVE
        trigger: "POST /api/recalls/{id}/activate"
        actor: QualityManager
        preconditions: []
        side_effects:
          - "Hop 1: pallets of recall.lot_id with status in {STORED, ALLOCATED, IN_BLAST_FREEZE} -> quality RECALLED (ALLOCATED pallets first release their allocation)"
          - "Hop 2: released allocations -> RELEASED; affected orders ALLOCATED -> SUBMITTED"
          - "Hop 3: lot.status -> RECALLED"
      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /api/recalls/{id}/complete"
        actor: QualityManager
        preconditions: ["Zero pallets of lot with quality == RECALLED still present (status in {STORED, IN_BLAST_FREEZE, ALLOCATED}); otherwise ERR_RECALL_HAS_UNDISPOSITIONED_STOCK"]
        side_effects: []
      - from: DECLARED
        to: CANCELLED
        trigger: "POST /api/recalls/{id}/cancel"
        actor: QualityManager
        preconditions: []
        side_effects: []

  - entity: Claim
    initial_state: FILED
    terminal_states: [SETTLED, WITHDRAWN]
    transitions:
      - from: FILED
        to: UNDER_REVIEW
        trigger: "POST /api/claims/{id}/review"
        actor: ClaimsAdjuster
        preconditions: []
        side_effects: []
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /api/claims/{id}/decide with decision=APPROVED"
        actor: ClaimsAdjuster
        preconditions: ["Customer has ACTIVE rate card (ERR_NO_ACTIVE_RATE_CARD)"]
        side_effects: ["settlement_cents computed per claim_settlement calc (liability_model variant)"]
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /api/claims/{id}/decide with decision=DENIED"
        actor: ClaimsAdjuster
        preconditions: []
        side_effects: []
      - from: DENIED
        to: REOPENED
        trigger: "POST /api/claims/{id}/reopen"
        actor: "CustomerAdmin (own)"
        preconditions: []
        side_effects: []
      - from: REOPENED
        to: UNDER_REVIEW
        trigger: "POST /api/claims/{id}/review"
        actor: ClaimsAdjuster
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: SETTLED
        trigger: "POST /api/claims/{id}/settle"
        actor: BillingAdmin
        preconditions: []
        side_effects:
          - "OPEN invoice.claim_credit_cents += settlement_cents; total_cents recomputed"
      - from: FILED
        to: WITHDRAWN
        trigger: "POST /api/claims/{id}/withdraw"
        actor: "CustomerAdmin (own)"
        preconditions: []
        side_effects: []

  - entity: Invoice
    initial_state: OPEN
    terminal_states: [SETTLED]
    transitions:
      - from: OPEN
        to: FINALIZED
        trigger: "system (POST /api/billing/run when now >= period_end)"
        actor: BillingAdmin
        preconditions: []
        side_effects:
          - "storage_cents computed (storage_charge calc, per-pallet rounding then sum)"
          - "dwell_surcharge_cents computed (dwell_surcharge calc)"
          - "rate_card_id recorded (ACTIVE card at run time; none -> zero rates)"
          - "total_cents recomputed; successor OPEN invoice created for the following month"
      - from: FINALIZED
        to: DISPUTED
        trigger: "POST /api/invoices/{id}/dispute"
        actor: "CustomerAdmin (own)"
        preconditions: []
        side_effects: ["Line amounts frozen (no component changes while DISPUTED)"]
      - from: DISPUTED
        to: FINALIZED
        trigger: "POST /api/invoices/{id}/resolve-dispute"
        actor: BillingAdmin
        preconditions: []
        side_effects: ["All component fields unchanged (round-trip conserves total_cents)"]
      - from: FINALIZED
        to: SETTLED
        trigger: "POST /api/invoices/{id}/settle"
        actor: BillingAdmin
        preconditions: ["amount_cents == total_cents exactly (ERR_INVOICE_AMOUNT_MISMATCH)"]
        side_effects: ["Customer.outstanding_balance_cents recomputed"]

# =============================================================================
# 1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: rate-card-supersede-stale-customer
    parent_entity: Customer
    write_endpoint: "POST /api/rate-cards"
    occ_field: expected_customer_version
    description: |
      Creating a RateCard supersedes the customer's current ACTIVE card. A
      create carrying an expected_customer_version older than Customer.version
      is rejected: the caller priced against a superseded card state (e.g. a
      card created by another writer after the caller last read the customer).
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: order-amend-stale-version
    parent_entity: OutboundOrder
    write_endpoint: "POST /api/outbound-orders/{id}/amend"
    occ_field: expected_order_version
    description: |
      Amending an order releases its allocations and re-prices the estimate.
      An amend carrying an expected_order_version older than the order's
      current version is rejected, because a prior accepted amend already
      changed requested_pallets and the allocation set the caller observed.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: zone_free_pallets
    trigger: "any pallet status change, receipt arrive/complete"
    algorithm: aggregation
    formula: |
      in_use_pallets    = count(Pallet where zone_id = Z and status in {STORED, IN_BLAST_FREEZE, ALLOCATED})
      reserved_pallets  = sum(expected_pallets of InboundReceipt where zone_id = Z and status == ARRIVED)
      free_pallets      = capacity_pallets - in_use_pallets - reserved_pallets
    input_set: "Pallets of zone Z in present statuses only; SHIPPED/DISPOSITIONED excluded"

  - name: zone_posture
    trigger: "any change to free_pallets"
    algorithm: threshold
    formula: |
      tight_threshold = max(1, floor(capacity_pallets * 0.10))
      if free_pallets == 0: posture = FULL
      elif free_pallets <= tight_threshold: posture = TIGHT
      else: posture = OPEN
    input_set: "the zone itself"
    constants:
      TIGHT_FRACTION: 0.10

  - name: fifo_allocation
    trigger: "POST /api/outbound-orders/{id}/allocate"
    algorithm: chronological
    formula: |
      candidates = Pallet p join InventoryLot l on p.lot_id = l.id where
        p.customer_id == order.customer_id
        AND l.product_code == order.product_code
        AND p.status == STORED AND p.quality == OK
        AND (order.lot_code IS NULL OR l.lot_code == order.lot_code)
        AND p not already ACTIVELY allocated to this order
      sort: l.production_date ASC, p.received_at ASC, p.created_at ASC   # never id
      take first (requested_pallets - allocated_pallets) candidates
      allocated_pallets == requested_pallets -> order ALLOCATED else SHORTED
    input_set: "STORED + OK pallets only; QUARANTINED/RECALLED/ALLOCATED/IN_BLAST_FREEZE excluded"

  - name: storage_charge
    trigger: "billing run finalizing an invoice"
    algorithm: aggregation
    formula: |
      For each pallet p of customer (join lot for ownership):
        days_p = count of calendar dates D in [period_start, period_end) such that
                 date(received_at) <= D AND (out_at IS NULL OR date(out_at) > D)
        class_rate = card.frozen_... if p.zone.temp_class == FROZEN else card.chilled_...
        DAILY_PRORATED variant: line_p = round_half_up(days_p * class_rate / 30)
        FULL_MONTH variant:     line_p = class_rate if days_p >= 1 else 0
      storage_cents = sum(line_p)
      ROUNDING ORDER PINNED: round per pallet to whole cents FIRST, then sum.
      (Sum-then-round is a different, rejected reading.)
    input_set: "all pallets with days_p > 0 in the period (any present status; SHIPPED/DISPOSED mid-period count only through day before out date)"
    precision: "integer cents; round_half_up per pallet line"
    constants:
      DAYS_PER_MONTH_DIVISOR: 30
    variants:
      - name: DAILY_PRORATED
        when: "rate card storage_method == DAILY_PRORATED"
        difference: "charge proportional to whole days present"
      - name: FULL_MONTH
        when: "rate card storage_method == FULL_MONTH"
        difference: "any pallet present >= 1 day in period is charged the full monthly rate"

  - name: dwell_surcharge
    trigger: "billing run finalizing an invoice"
    algorithm: tiered_pricing
    formula: |
      For each pallet present on the last day of the period (date D_last = period_end - 1 day,
      i.e. date(received_at) <= D_last AND (out_at IS NULL OR date(out_at) > D_last)):
        anchor = max(received_at, last_blast_frozen_at)   # blast resets dwell clock
        dwell_days = floor((period_end - anchor) / 86400 seconds)
        tier_pct = 1.00 if dwell_days >= 120
                   0.50 if dwell_days >= 90
                   0.25 if dwell_days >= 60
                   0    otherwise
        zone_mult = 1.0 if FROZEN else 1.5 if CHILLED
        surcharge_p = 0 if card.dwell_exempt else round_half_up(class_rate * tier_pct * zone_mult)
      dwell_surcharge_cents = sum(surcharge_p)
    input_set: "pallets still in custody on the period's last day"
    precision: "integer cents; round_half_up per pallet"
    constants:
      TIER_60_PCT: 0.25
      TIER_90_PCT: 0.50
      TIER_120_PCT: 1.00
      FROZEN_MULT: 1.0
      CHILLED_MULT: 1.5

  - name: handling_out_estimate
    trigger: "order submit, order amend (estimate); order ship (final)"
    algorithm: forward_looking
    formula: |
      EVALUATION ORDER PINNED (circular-looking; this order breaks the loop):
      1. volume = count of pallets SHIPPED by this customer with out_at in the
         calendar month of now PLUS this order's requested (estimate) or
         allocated (final) pallet count   # the order under pricing counts toward its own tier
      2. discount = 0.20 if volume >= 500; 0.10 if volume >= 100; else 0
      3. fee = round_half_up(quantity * handling_out_cents_per_pallet * (1 - discount))
      estimate -> OutboundOrder.estimated_handling_out_cents (at submit/amend, quantity = requested_pallets)
      final    -> OutboundOrder.final_handling_out_cents    (at ship, quantity = allocated_pallets)
      Credit check at submit/amend runs AFTER step 3:
        reject iff outstanding_balance_cents + estimated_fee > credit_limit_cents  (equality passes)
    input_set: "customer's SHIPPED pallets in current calendar month + this order"
    precision: "integer cents; round_half_up per order"
    constants:
      TIER_100_DISCOUNT: 0.10
      TIER_500_DISCOUNT: 0.20
    variants:
      - name: estimate
        when: "submit/amend time"
        difference: "uses current-month shipped volume + requested_pallets; provisional"
      - name: final
        when: "ship time"
        difference: "uses ship-month shipped volume + allocated_pallets; charged to invoice — diverges from estimate when volume crosses a tier between submit and ship"

  - name: blast_freeze_fee
    trigger: "booking completion"
    algorithm: aggregation
    formula: |
      fee_cents = blast_base_cents + pallet_count * blast_per_pallet_cents
    input_set: "the completed booking"

  - name: claim_settlement
    trigger: "claim decide with decision=APPROVED"
    algorithm: threshold
    formula: |
      card = customer's ACTIVE rate card at decide time
      DECLARED_VALUE variant:      settlement_cents = declared_value_cents
      LIMITED_LIABILITY variant:   settlement_cents = min(declared_value_cents,
                                                          affected_pallet_count * liability_per_pallet_cents)
    input_set: "the claim + ACTIVE rate card"
    precision: "integer cents"
    variants:
      - name: DECLARED_VALUE
        when: "rate card liability_model == DECLARED_VALUE"
        difference: "full declared value paid (bailment at full liability)"
      - name: LIMITED_LIABILITY
        when: "rate card liability_model == LIMITED_LIABILITY"
        difference: "capped at per-pallet rate times affected count — strictly less whenever declared_value_cents > affected_pallet_count * liability_per_pallet_cents"

  - name: outstanding_balance
    trigger: "read of Customer; order submit/amend credit check"
    algorithm: aggregation
    formula: |
      outstanding_balance_cents =
          sum(total_cents of Invoice where customer_id = C and status in {FINALIZED, DISPUTED})
        + (handling_in_cents + handling_out_cents + blast_freeze_cents - claim_credit_cents)
          of the single OPEN invoice of C
      (storage/dwell on the OPEN invoice are 0 until finalization and thus excluded)
    input_set: "invoices of customer C"

  - name: invoice_total
    trigger: "any component change; finalized at billing run"
    algorithm: aggregation
    formula: |
      total_cents = storage_cents + handling_in_cents + handling_out_cents
                  + blast_freeze_cents + dwell_surcharge_cents - claim_credit_cents
      All components are integer cents (rounding already applied inside each
      component per its own pinned rule); no further rounding at total level.
      total_cents MAY go negative when claim credits exceed charges (a credit
      balance owed to the customer); no clamping at zero.
    input_set: "the invoice's own component fields"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; role recognized"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: existence
    check: "Request body schema: required fields present, types valid, enum values in range, integers positive where required, window_end > window_start"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all write endpoints"
  - priority: 3
    category: auth
    check: "Role is listed in the endpoint's roles"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"
  - priority: 4
    category: auth
    check: "CustomerAdmin may only access/modify resources whose customer_id equals X-User-ID (ownership)"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "customer-scoped endpoints"
  - priority: 5
    category: existence
    check: "Path ids and body FK references exist, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all resource endpoints"
  - priority: 6
    category: state
    check: "Target resource in a valid from-state for the requested transition (incl. OCC expected_*_version match -> ERR_STALE_VERSION)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 7
    category: business_safety
    check: "Food-safety gates: order submit with lot_code whose lot is RECALLED (ERR_LOT_RECALLED); segregation of duties on excursion confirm/clear (ERR_SOD_VIOLATION)"
    error_id: "ERR_LOT_RECALLED / ERR_SOD_VIOLATION"
    http_status: 409
    applies_to: "order submit, excursion confirm/clear"
  - priority: 8
    category: business_temporal
    check: "Window rules: receipt create dock-door aggregate overlap (ERR_DOCK_CAPACITY_EXCEEDED); booking create cell overlap incl. turnaround buffer (ERR_BOOKING_WINDOW_CONFLICT); booking start outside window (ERR_OUTSIDE_WINDOW)"
    error_id: "ERR_DOCK_CAPACITY_EXCEEDED / ERR_BOOKING_WINDOW_CONFLICT / ERR_OUTSIDE_WINDOW"
    http_status: 409
    applies_to: "receipt create, booking create/start"
  - priority: 9
    category: business_constraint
    check: "Capacity/consistency: temp class match (ERR_TEMP_CLASS_MISMATCH); zone FULL at arrival (ERR_ZONE_FULL); putaway capacity (ERR_ZONE_CAPACITY_EXCEEDED); cell capacity (ERR_CELL_CAPACITY_EXCEEDED); lot production-date continuity (ERR_LOT_PRODUCTION_DATE_MISMATCH); freezable stock sufficiency (ERR_INSUFFICIENT_FREEZABLE_STOCK); recall completion requires no remaining recalled stock (ERR_RECALL_HAS_UNDISPOSITIONED_STOCK)"
    error_id: "ERR_TEMP_CLASS_MISMATCH / ERR_ZONE_FULL / ERR_ZONE_CAPACITY_EXCEEDED / ERR_CELL_CAPACITY_EXCEEDED / ERR_LOT_PRODUCTION_DATE_MISMATCH / ERR_INSUFFICIENT_FREEZABLE_STOCK / ERR_RECALL_HAS_UNDISPOSITIONED_STOCK"
    http_status: 409
    applies_to: "receipt create/arrive/complete, booking create/start, recall complete"
  - priority: 10
    category: business_referential
    check: "Cross-entity references: claim requires excursion CONFIRMED_BREACH (ERR_EXCURSION_NOT_CONFIRMED); affected_pallet_count <= excursion.quarantined_pallet_count (ERR_CLAIM_EXCEEDS_QUARANTINED_COUNT)"
    error_id: "ERR_EXCURSION_NOT_CONFIRMED / ERR_CLAIM_EXCEEDS_QUARANTINED_COUNT"
    http_status: 409
    applies_to: "claim create"
  - priority: 11
    category: business_fiscal
    check: "Money gates: customer ACTIVE for new receipts/orders (ERR_CUSTOMER_SUSPENDED); ACTIVE rate card present where charging (ERR_NO_ACTIVE_RATE_CARD); credit limit at submit/amend (ERR_CREDIT_LIMIT_EXCEEDED); invoice settle amount exact (ERR_INVOICE_AMOUNT_MISMATCH)"
    error_id: "ERR_CUSTOMER_SUSPENDED / ERR_NO_ACTIVE_RATE_CARD / ERR_CREDIT_LIMIT_EXCEEDED / ERR_INVOICE_AMOUNT_MISMATCH"
    http_status: 409
    applies_to: "receipt create, order create/submit/amend, receipt complete, booking complete, claim decide, invoice settle"

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  # --- test-driving clock ---
  - method: POST
    path: "/api/_clock/set_current_utc"
    description: "Set the logical clock. At server startup the clock defaults to exactly 2026-08-01T00:00:00Z and never reads wall-clock time; this endpoint is the only way to advance it."
    roles: [CustomerAdmin, WarehouseOperator, QualityManager, ClaimsAdjuster, BillingAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: []

  # --- customers ---
  - method: POST
    path: "/api/customers"
    description: "Onboard a customer; auto-creates the OPEN invoice for the calendar month of now"
    roles: [BillingAdmin]
    code: 201
    input: [name, credit_limit_cents]
    output: Customer
    side_effects: ["Invoice created: status OPEN, period = [first of current month, first of next month), all components 0"]
  - method: GET
    path: "/api/customers/{id}"
    description: "Get customer (computed outstanding_balance_cents included)"
    roles: [CustomerAdmin, WarehouseOperator, QualityManager, ClaimsAdjuster, BillingAdmin]
    code: 200
    input: []
    output: Customer
    side_effects: []
  - method: GET
    path: "/api/customers"
    description: "List customers"
    roles: [CustomerAdmin, WarehouseOperator, QualityManager, ClaimsAdjuster, BillingAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: Customer[]
    side_effects: []
  - method: PATCH
    path: "/api/customers/{id}"
    description: "Update credit limit and/or status (suspend/reactivate)"
    roles: [BillingAdmin]
    code: 200
    input: ["credit_limit_cents?", "status?"]
    output: Customer
    side_effects: ["version incremented"]

  # --- rate cards ---
  - method: POST
    path: "/api/rate-cards"
    description: "Create a rate card (ACTIVE); supersedes the customer's prior ACTIVE card. OCC-guarded on Customer.version."
    roles: [BillingAdmin]
    code: 201
