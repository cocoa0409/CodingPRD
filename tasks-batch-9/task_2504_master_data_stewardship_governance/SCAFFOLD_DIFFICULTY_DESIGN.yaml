            - "trigger -> HTTP 409 and ${err_not_certified} == ERR_SOURCE_NOT_CERTIFIED: neither candidate carries the authoritative source, so SCORE_PRIORITY makes B (102.00 > 72.00) the effective survivor and B's source CRM is DECERTIFIED"
            - "${mp_status_after} == UNDER_REVIEW, ${mp_surv_after} == null, ${mp_swapped_after} == false, ${mp_decided_after} == null"
            - "${rec_a_cur_after} == CURATED and ${rec_a_completeness_after} == 40.00 (no attribute fill happened)"
            - "${rec_b_cur_after} == CURATED and ${rec_b_superseded_after} == null"

  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: steward_assignment_half_open_adjacency_allowed_overlap_rejected
        grounds:
          - validations.priority_13_ERR_ASSIGNMENT_OVERLAP
          - entities.StewardAssignment.fields.effective_from
          - entities.StewardAssignment.fields.effective_to
        distinguishing_aspect: |
          The interval is half-open [effective_from, effective_to), so an assignment starting
          exactly at the incumbent's effective_to is adjacent, not overlapping, and must be
          accepted; a start one day earlier overlaps the open-ended successor and must be
          rejected. The exclusion scope is (domain_id, steward_role), so a CUSTODIAN interval
          straddling both DATA_STEWARD intervals is still accepted.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-05T00:00:00Z."
            - "Domain CUSTOMER in DRAFT with a DATA_OWNER assignment already in place."
            - "Three stewards exist: Olivia (owner), Sam and Tina."
