            - "the 365-day temporary COA is rejected 422 with error_id == ERR_TEMPORAL_WINDOW"

      - name: full_count_lead_time_and_saturday_start
        claim_type: Violation → Error
        grounds:
          - validations.priority_10_business_temporal
          - state_machines.RouteEvaluation.INITIATED_to_DATA_COLLECTION
        distinguishing_aspect: "FULL_COUNT begin-count requires count_week_start >= today+14 AND a Saturday: 2026-09-15 (14 days out but a Tuesday) fails; 2026-09-19 (Saturday, 18 days out) passes — both constraints are checked, and the weekday check is the one that bites here."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Route C360 with two separate evaluations would violate the open-evaluation guard, so a single evaluation is driven to INITIATED; begin-count is attempted with a Tuesday start (expect failure), then with a Saturday start (success)."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
