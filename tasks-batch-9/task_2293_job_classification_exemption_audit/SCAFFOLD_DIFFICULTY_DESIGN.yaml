  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: rescinding_a_determination_restores_the_open_misclassified_headcount_ledger
        grounds:
          - state_machines.ExemptionAnalysis.NONEXEMPT_DETERMINED_to_RETURNED
          - entities.AuditProject.fields.open_misclassified_headcount
          - entities.JobFamily.fields.open_misclassified_count
          - calculations.job_family_risk_score
          - calculations.project_remediation_posture
        distinguishing_aspect: |
          Conserved quantity: the population ledger AuditProject.open_misclassified_headcount
          together with JobFamily.open_misclassified_count. Rescinding the determination must
          undo every increment the determination made, including the 25-point status risk that
          pushed the family score to the 100 cap, so the family lands back on exactly 88 rather
          than on the cap minus 25. The cap is what makes the reversal non-trivial: a naive
          "subtract 25" compensation would leave 75.
        test_recipe:
          setup:
            - "Base CA engagement in FIELDWORK; Position with both interviews ATTESTED at 46.0/45h/3 and 52.0/49h/2, so primary_duty_pct is 49.6 and validated_weekly_hours 49."
            - "Ledger baseline before the determination: JobFamily.risk_score 88, risk_tier CRITICAL, open_misclassified_count 0; AuditProject.open_misclassified_headcount 0, remediation_posture OPEN."
            - "The analysis is submitted and determined NONEXEMPT by cr-1, which drives the family to the capped 100 and the project to FROZEN with headcount 2."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "pa-1"
            - call: "POST /state-rules"
              payload: { state_code: "CA", min_weekly_salary_cents: 132000, duties_test_variant: "QUANTITATIVE_50PCT", ic_test: "ABC", hce_shortcut_recognized: false, liquidated_damages_multiplier: 1.0, reclass_notice_days: 7, back_wage_lookback_weeks_override: 156 }
              as: ProgramAdmin
              as_user_id: "pa-1"
