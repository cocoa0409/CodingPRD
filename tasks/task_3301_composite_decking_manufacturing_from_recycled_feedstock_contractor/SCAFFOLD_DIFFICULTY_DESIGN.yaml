              as: ProductManager
              captures: { line_id: $.data.id }
            - call: "POST /decking/plants/${plant_id}/production-runs"
              payload: { product_line_id: "${line_id}", planned_lf: 100, production_date: "2026-03-02", run_kind: "NULL_SLOT", expected_plant_version: "${plant_v0}" }
              as: OpsManager
              captures: { run1: $.data.id, plant_v1: $.data.version }
          trigger:
            - call: "POST /decking/plants/${plant_id}/production-runs"
              payload: { product_line_id: "${line_id}", planned_lf: 100, production_date: "2026-03-02", run_kind: "NULL_SLOT", expected_plant_version: "${plant_v1}" }
              as: OpsManager
              captures: { error_id: $.data.error_id }
