scaffold_corner_design:

  # =========================================================================
  # Entities — creation, system/computed fields, defaults, not-found, required
  # =========================================================================
  - section: entities
    instances:
      - name: create_project_starts_in_draft_with_system_fields
        claim_type: Creation
        grounds:
          - entities.Project.fields.status
          - endpoints./projects
        distinguishing_aspect: "POST /projects with all required fields returns 201, status==DRAFT, version==1, footprint_sqft==0, accepted_quote_id==null, and a server-minted UUID id."
        test_recipe:
          setup: ["A registered homeowner."]
          setup_api_calls:
            - call: "POST /homeowners"
              payload: { email: "c1@x.com", full_name: "C1", hoa_governed: false, ground_snow_load_psf: 10, design_wind_speed_mph: 90 }
              as: SalesDesigner
              captures: { ho: $.data.id }
          trigger:
            - call: "POST /projects"
              payload: { homeowner_id: "${ho}", address_line: "A1", structure_type: "SCREEN_ROOM", material: "ALUMINUM" }
              as: SalesDesigner
              captures: { pj: $.data.id }
          assert:
            - "HTTP 201; Project.${pj}.status == DRAFT and Project.${pj}.version == 1"
            - "Project.${pj}.footprint_sqft == 0 and Project.${pj}.accepted_quote_id == null"

      - name: create_project_missing_required_field_rejected
        claim_type: Required Fields
        grounds:
          - endpoints./projects
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /projects omitting structure_type returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["A registered homeowner."]
          setup_api_calls:
            - call: "POST /homeowners"
              payload: { email: "c2@x.com", full_name: "C2", hoa_governed: false, ground_snow_load_psf: 10, design_wind_speed_mph: 90 }
              as: SalesDesigner
              captures: { ho: $.data.id }
          trigger:
            - call: "POST /projects"
              payload: { homeowner_id: "${ho}", address_line: "A2", material: "ALUMINUM" }
              as: SalesDesigner
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST and HTTP status == 400"

      - name: create_project_invalid_enum_rejected
        claim_type: Type Constraints
        grounds:
          - entities.Project.fields.structure_type
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /projects with structure_type=='GREENHOUSE' (outside the declared enum) returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["A registered homeowner."]
          setup_api_calls:
            - call: "POST /homeowners"
              payload: { email: "c3@x.com", full_name: "C3", hoa_governed: false, ground_snow_load_psf: 10, design_wind_speed_mph: 90 }
              as: SalesDesigner
              captures: { ho: $.data.id }
          trigger:
            - call: "POST /projects"
              payload: { homeowner_id: "${ho}", address_line: "A3", structure_type: "GREENHOUSE", material: "ALUMINUM" }
              as: SalesDesigner
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST and HTTP status == 400"

      - name: get_project_nonexistent_returns_not_found
        claim_type: Not Found
        grounds:
          - endpoints./projects/{id}
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET /projects/{random-uuid} for a non-existent id returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB (plus one role to call with)."]
          setup_api_calls: []
          trigger:
            - call: "GET /projects/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: SalesDesigner
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NOT_FOUND and HTTP status == 404"

      - name: create_project_unknown_homeowner_fk_not_found
        claim_type: Parent Relationships
        grounds:
          - entities.Project.fields.homeowner_id
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "POST /projects whose homeowner_id FK does not resolve returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /projects"
              payload: { homeowner_id: "11111111-1111-4111-8111-111111111111", address_line: "A4", structure_type: "SCREEN_ROOM", material: "ALUMINUM" }
              as: SalesDesigner
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NOT_FOUND and HTTP status == 404"

      - name: footprint_computed_ignores_client_supplied_value
        claim_type: Computed Fields
        grounds:
          - entities.Project.fields.footprint_sqft
          - calculations.footprint_area
        distinguishing_aspect: "After accepting a 120x144 measurement, Project.footprint_sqft == 120.00 regardless of any client input (it is source: computed)."
        test_recipe:
          setup: ["A DRAFT project with a PENDING 120x144 measurement."]
          setup_api_calls:
            - call: "POST /homeowners"
              payload: { email: "c6@x.com", full_name: "C6", hoa_governed: false, ground_snow_load_psf: 10, design_wind_speed_mph: 90 }
              as: SalesDesigner
              captures: { ho: $.data.id }
            - call: "POST /projects"
              payload: { homeowner_id: "${ho}", address_line: "A6", structure_type: "THREE_SEASON", material: "ALUMINUM" }
              as: SalesDesigner
              captures: { pj: $.data.id }
            - call: "POST /measurements"
              payload: { project_id: "${pj}", width_in: 120, depth_in: 144, wall_height_in: 96, existing_slab: true }
              as: SalesDesigner
              captures: { m1: $.data.id }
          trigger:
            - call: "POST /measurements/${m1}/accept"
              payload: {}
              as: SalesDesigner
            - call: "GET /projects/${pj}"
              payload: {}
              as: SalesDesigner
          assert:
            - "Project.${pj}.footprint_sqft == 120.00 and Project.${pj}.width_in == 120 and Project.${pj}.status == MEASURED"

      - name: requires_engineering_false_for_low_load_three_season
        claim_type: Computed Fields
        grounds:
          - entities.Project.fields.requires_engineering
          - calculations.engineering_requirement
        distinguishing_aspect: "Boundary below: THREE_SEASON, snow 30 (not >30), wind 120 (<130) -> requires_engineering == false after finalize-design."
        test_recipe:
          setup: ["A measured THREE_SEASON project, snow 30, wind 120."]
          setup_api_calls:
            - call: "POST /homeowners"
              payload: { email: "c7@x.com", full_name: "C7", hoa_governed: false, ground_snow_load_psf: 30, design_wind_speed_mph: 120 }
              as: SalesDesigner
              captures: { ho: $.data.id }
            - call: "POST /projects"
              payload: { homeowner_id: "${ho}", address_line: "A7", structure_type: "THREE_SEASON", material: "ALUMINUM" }
              as: SalesDesigner
              captures: { pj: $.data.id }
            - call: "POST /measurements"
              payload: { project_id: "${pj}", width_in: 120, depth_in: 144, wall_height_in: 96, existing_slab: true }
              as: SalesDesigner
              captures: { m1: $.data.id }
            - call: "POST /measurements/${m1}/accept"
              payload: {}
              as: SalesDesigner
          trigger:
            - call: "POST /projects/${pj}/finalize-design"
              payload: {}
              as: SalesDesigner
          assert:
            - "Project.${pj}.requires_engineering == false and Project.${pj}.status == DESIGNED"

      - name: hoa_governed_default_false_when_omitted
        claim_type: Defaults
        grounds:
          - entities.Homeowner.fields.hoa_governed
        distinguishing_aspect: "POST /homeowners omitting hoa_governed applies the default false."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /homeowners"
              payload: { email: "c8@x.com", full_name: "C8", ground_snow_load_psf: 10, design_wind_speed_mph: 90 }
              as: SalesDesigner
              captures: { ho: $.data.id }
          assert:
            - "Homeowner.${ho}.hoa_governed == false"

      - name: warranty_immutable_entity_has_no_version
        claim_type: Immutability
        grounds:
          - entities.Warranty.fields.term_years
          - calculations.warranty_term
        distinguishing_aspect: "Warranty (common_fields:false) is issued at inspection pass with computed term_years by structure_type (THREE_SEASON->5) and carries only id+created_at (no version)."
        test_recipe:
          setup: ["A THREE_SEASON project driven all the way to COMPLETED via a passing inspection at clock 2026-05-10."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T00:00:00Z" }
              as: Manufacturer
            - call: "POST /homeowners"
              payload: { email: "c9@x.com", full_name: "C9", hoa_governed: false, ground_snow_load_psf: 10, design_wind_speed_mph: 90 }
              as: SalesDesigner
              captures: { ho: $.data.id }
            - call: "POST /projects"
              payload: { homeowner_id: "${ho}", address_line: "A9", structure_type: "THREE_SEASON", material: "ALUMINUM" }
              as: SalesDesigner
              captures: { pj: $.data.id }
            - call: "POST /measurements"
              payload: { project_id: "${pj}", width_in: 120, depth_in: 144, wall_height_in: 96, existing_slab: true }
              as: SalesDesigner
              captures: { m1: $.data.id }
            - call: "POST /measurements/${m1}/accept"
              payload: {}
              as: SalesDesigner
            - call: "POST /projects/${pj}/finalize-design"
              payload: {}
              as: SalesDesigner
            - call: "POST /quotes"
              payload: { project_id: "${pj}" }
              as: SalesDesigner
              captures: { q1: $.data.id }
            - call: "GET /projects/${pj}"
              payload: {}
              as: SalesDesigner
              captures: { pv: $.data.version }
            - call: "POST /quotes/${q1}/accept"
              payload: { expected_project_version: "${pv}" }
              as: Homeowner
              as_user_id: "${ho}"
            - call: "POST /permit-applications"
              payload: { project_id: "${pj}", jurisdiction_code: "J1" }
              as: SalesDesigner
              captures: { pa: $.data.id }
            - call: "POST /permit-applications/${pa}/begin-review"
              payload: {}
              as: PermitOfficer
            - call: "POST /permit-applications/${pa}/decide"
              payload: { outcome: "APPROVED" }
              as: PermitOfficer
            - call: "POST /manufacture-orders"
              payload: { project_id: "${pj}", quote_id: "${q1}" }
              as: Manufacturer
              captures: { mo: $.data.id }
            - call: "POST /manufacture-orders/${mo}/start"
              payload: {}
              as: Manufacturer
            - call: "POST /manufacture-orders/${mo}/ready"
              payload: {}
              as: Manufacturer
            - call: "POST /crews"
              payload: { name: "Crew W", max_wind_mph: 40, certified_four_season: false, active: true }
              as: InstallManager
              captures: { cw: $.data.id }
            - call: "POST /install-jobs"
              payload: { project_id: "${pj}", crew_id: "${cw}", scheduled_start: "2026-05-11T08:00:00Z", scheduled_end: "2026-05-11T17:00:00Z", forecast_wind_mph: 20 }
              as: InstallManager
              captures: { ij: $.data.id }
            - call: "POST /install-jobs/${ij}/start"
              payload: {}
              as: InstallManager
            - call: "POST /install-jobs/${ij}/complete"
              payload: {}
              as: InstallManager
            - call: "POST /inspections"
              payload: { project_id: "${pj}", install_job_id: "${ij}" }
              as: InstallManager
              captures: { ins: $.data.id }
          trigger:
            - call: "POST /inspections/${ins}/pass"
              payload: {}
              as: Inspector
            - call: "GET /projects/${pj}/warranties"
              payload: {}
              as: Homeowner
              as_user_id: "${ho}"
          assert:
            - "Project.${pj}.status == COMPLETED"
            - "a Warranty on project ${pj} exists with term_years == 5 and starts_at == 2026-05-10T00:00:00.000Z and expires_at == 2031-05-09T00:00:00.000Z"

  # =========================================================================
  # State machines — invalid transitions, terminal lockdown, idempotency
  # =========================================================================
  - section: state_machines
    instances:
      - name: finalize_design_from_draft_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Project.MEASURED_to_DESIGNED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "POST /projects/{id}/finalize-design on a DRAFT (not MEASURED) project returns ERR_INVALID_STATE (409); no fields change."
        test_recipe:
          setup: ["A DRAFT project with no accepted measurement."]
          setup_api_calls:
            - call: "POST /homeowners"
              payload: { email: "s1@x.com", full_name: "S1", hoa_governed: false, ground_snow_load_psf: 10, design_wind_speed_mph: 90 }
              as: SalesDesigner
              captures: { ho: $.data.id }
            - call: "POST /projects"
              payload: { homeowner_id: "${ho}", address_line: "B1", structure_type: "THREE_SEASON", material: "ALUMINUM" }
              as: SalesDesigner
              captures: { pj: $.data.id }
          trigger:
            - call: "POST /projects/${pj}/finalize-design"
              payload: {}
              as: SalesDesigner
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE and HTTP status == 409; Project.${pj}.status == DRAFT"

      - name: accept_measurement_twice_idempotency_second_fails
        claim_type: Idempotency
        grounds:
          - state_machines.Measurement.PENDING_to_ACCEPTED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Accepting the same measurement twice: the second /accept finds status==ACCEPTED (not PENDING) and returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A DRAFT project with one PENDING measurement just accepted once."]
          setup_api_calls:
            - call: "POST /homeowners"
              payload: { email: "s2@x.com", full_name: "S2", hoa_governed: false, ground_snow_load_psf: 10, design_wind_speed_mph: 90 }
              as: SalesDesigner
              captures: { ho: $.data.id }
            - call: "POST /projects"
              payload: { homeowner_id: "${ho}", address_line: "B2", structure_type: "THREE_SEASON", material: "ALUMINUM" }
              as: SalesDesigner
              captures: { pj: $.data.id }
            - call: "POST /measurements"
              payload: { project_id: "${pj}", width_in: 120, depth_in: 144, wall_height_in: 96, existing_slab: true }
              as: SalesDesigner
              captures: { m1: $.data.id }
            - call: "POST /measurements/${m1}/accept"
              payload: {}
              as: SalesDesigner
          trigger:
            - call: "POST /measurements/${m1}/accept"
              payload: {}
              as: SalesDesigner
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE and HTTP status == 409"

      - name: cancel_completed_project_terminal_lockdown
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Project.DRAFT_to_CANCELLED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "POST /projects/{id}/cancel on a COMPLETED (terminal) project returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A project driven to COMPLETED (reuse the full happy path)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T00:00:00Z" }
              as: Manufacturer
            - call: "POST /homeowners"
              payload: { email: "s3@x.com", full_name: "S3", hoa_governed: false, ground_snow_load_psf: 10, design_wind_speed_mph: 90 }
              as: SalesDesigner
              captures: { ho: $.data.id }
            - call: "POST /projects"
              payload: { homeowner_id: "${ho}", address_line: "B3", structure_type: "THREE_SEASON", material: "ALUMINUM" }
              as: SalesDesigner
              captures: { pj: $.data.id }
            - call: "POST /measurements"
              payload: { project_id: "${pj}", width_in: 120, depth_in: 144, wall_height_in: 96, existing_slab: true }
              as: SalesDesigner
              captures: { m1: $.data.id }
            - call: "POST /measurements/${m1}/accept"
              payload: {}
              as: SalesDesigner
            - call: "POST /projects/${pj}/finalize-design"
              payload: {}
              as: SalesDesigner
            - call: "POST /quotes"
              payload: { project_id: "${pj}" }
              as: SalesDesigner
              captures: { q1: $.data.id }
            - call: "GET /projects/${pj}"
              payload: {}
              as: SalesDesigner
              captures: { pv: $.data.version }
            - call: "POST /quotes/${q1}/accept"
              payload: { expected_project_version: "${pv}" }
              as: Homeowner
              as_user_id: "${ho}"
            - call: "POST /permit-applications"
              payload: { project_id: "${pj}", jurisdiction_code: "J1" }
              as: SalesDesigner
              captures: { pa: $.data.id }
            - call: "POST /permit-applications/${pa}/begin-review"
              payload: {}
              as: PermitOfficer
            - call: "POST /permit-applications/${pa}/decide"
              payload: { outcome: "APPROVED" }
              as: PermitOfficer
            - call: "POST /manufacture-orders"
              payload: { project_id: "${pj}", quote_id: "${q1}" }
              as: Manufacturer
              captures: { mo: $.data.id }
            - call: "POST /manufacture-orders/${mo}/start"
              payload: {}
              as: Manufacturer
            - call: "POST /manufacture-orders/${mo}/ready"
              payload: {}
              as: Manufacturer
            - call: "POST /crews"
              payload: { name: "Crew T", max_wind_mph: 40, certified_four_season: false, active: true }
              as: InstallManager
              captures: { cw: $.data.id }
            - call: "POST /install-jobs"
              payload: { project_id: "${pj}", crew_id: "${cw}", scheduled_start: "2026-05-11T08:00:00Z", scheduled_end: "2026-05-11T17:00:00Z", forecast_wind_mph: 20 }
              as: InstallManager
              captures: { ij: $.data.id }
            - call: "POST /install-jobs/${ij}/start"
              payload: {}
              as: InstallManager
            - call: "POST /install-jobs/${ij}/complete"
              payload: {}
              as: InstallManager
            - call: "POST /inspections"
              payload: { project_id: "${pj}", install_job_id: "${ij}" }
              as: InstallManager
              captures: { ins: $.data.id }
            - call: "POST /inspections/${ins}/pass"
              payload: {}
              as: Inspector
          trigger:
            - call: "POST /projects/${pj}/cancel"
              payload: {}
              as: Homeowner
              as_user_id: "${ho}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE and HTTP status == 409; Project.${pj}.status == COMPLETED"

      - name: inspection_fail_then_reinspect_pass_cycle
        claim_type: cyclic
        grounds:
          - state_machines.Inspection.SCHEDULED_to_FAILED_PUNCHLIST
          - state_machines.Project.INSPECTING_to_INSTALLING
          - entities.Inspection.fields.attempt_no
        distinguishing_aspect: "A failed inspection (punchlist 2) sends Project back to INSTALLING and reopens the InstallJob to IN_PROGRESS; re-completing and scheduling a second inspection yields attempt_no==2."
        test_recipe:
          setup: ["A project at INSPECTING with a SCHEDULED first inspection (attempt_no 1)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T00:00:00Z" }
              as: Manufacturer
            - call: "POST /homeowners"
              payload: { email: "s4@x.com", full_name: "S4", hoa_governed: false, ground_snow_load_psf: 10, design_wind_speed_mph: 90 }
              as: SalesDesigner
              captures: { ho: $.data.id }
            - call: "POST /projects"
              payload: { homeowner_id: "${ho}", address_line: "B4", structure_type: "THREE_SEASON", material: "ALUMINUM" }
              as: SalesDesigner
              captures: { pj: $.data.id }
            - call: "POST /measurements"
              payload: { project_id: "${pj}", width_in: 120, depth_in: 144, wall_height_in: 96, existing_slab: true }
              as: SalesDesigner
              captures: { m1: $.data.id }
            - call: "POST /measurements/${m1}/accept"
              payload: {}
              as: SalesDesigner
            - call: "POST /projects/${pj}/finalize-design"
              payload: {}
              as: SalesDesigner
            - call: "POST /quotes"
              payload: { project_id: "${pj}" }
              as: SalesDesigner
              captures: { q1: $.data.id }
            - call: "GET /projects/${pj}"
              payload: {}
              as: SalesDesigner
              captures: { pv: $.data.version }
            - call: "POST /quotes/${q1}/accept"
              payload: { expected_project_version: "${pv}" }
              as: Homeowner
              as_user_id: "${ho}"
            - call: "POST /permit-applications"
              payload: { project_id: "${pj}", jurisdiction_code: "J1" }
              as: SalesDesigner
              captures: { pa: $.data.id }
            - call: "POST /permit-applications/${pa}/begin-review"
              payload: {}
              as: PermitOfficer
            - call: "POST /permit-applications/${pa}/decide"
              payload: { outcome: "APPROVED" }
              as: PermitOfficer
            - call: "POST /manufacture-orders"
              payload: { project_id: "${pj}", quote_id: "${q1}" }
              as: Manufacturer
              captures: { mo: $.data.id }
            - call: "POST /manufacture-orders/${mo}/start"
              payload: {}
              as: Manufacturer
            - call: "POST /manufacture-orders/${mo}/ready"
              payload: {}
              as: Manufacturer
            - call: "POST /crews"
              payload: { name: "Crew R", max_wind_mph: 40, certified_four_season: false, active: true }
              as: InstallManager
              captures: { cw: $.data.id }
            - call: "POST /install-jobs"
              payload: { project_id: "${pj}", crew_id: "${cw}", scheduled_start: "2026-05-11T08:00:00Z", scheduled_end: "2026-05-11T17:00:00Z", forecast_wind_mph: 20 }
              as: InstallManager
              captures: { ij: $.data.id }
            - call: "POST /install-jobs/${ij}/start"
              payload: {}
              as: InstallManager
            - call: "POST /install-jobs/${ij}/complete"
              payload: {}
              as: InstallManager
            - call: "POST /inspections"
              payload: { project_id: "${pj}", install_job_id: "${ij}" }
              as: InstallManager
              captures: { ins1: $.data.id }
          trigger:
            - call: "POST /inspections/${ins1}/fail"
              payload: { punchlist_items: 2 }
              as: Inspector
            - call: "POST /install-jobs/${ij}/complete"
              payload: {}
              as: InstallManager
            - call: "POST /inspections"
              payload: { project_id: "${pj}", install_job_id: "${ij}" }
              as: InstallManager
              captures: { ins2: $.data.id }
          assert:
            - "Inspection.${ins1}.result == FAILED_PUNCHLIST; after fail InstallJob.${ij}.progress_status == IN_PROGRESS and Project.${pj}.status == INSTALLING"
            - "Inspection.${ins2}.attempt_no == 2 and Project.${pj}.status == INSPECTING"

      - name: engineering_underrated_pass_attempt_rejected
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.EngineeringReview.PENDING_to_PASSED
          - validations[priority=7]
          - errors[ERR_ENGINEERING_UNDERRATED]
        distinguishing_aspect: "Although /rule auto-selects PASS/FAIL, an explicit PASS is impossible when underrated; ruling an underrated review (rated wind 100 < required 140) yields status FAILED, never PASSED — surfaced as the engineering-underrated safety outcome."
        test_recipe:
          setup: ["A FOUR_SEASON permit IN_REVIEW with a PENDING EngineeringReview rated below required."]
          setup_api_calls:
            - call: "POST /homeowners"
              payload: { email: "s5@x.com", full_name: "S5", hoa_governed: false, ground_snow_load_psf: 40, design_wind_speed_mph: 140 }
              as: SalesDesigner
