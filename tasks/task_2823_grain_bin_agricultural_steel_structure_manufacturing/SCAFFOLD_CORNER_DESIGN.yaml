          setup:
            - "Jurisdiction NE-WEST (seal_required false), GrainProfile CORN, CoatingSpec G115, engineer PE-1001."
            - "Dealer Alpha (NE-01, BASE, staging_slots 2, high_cube_access true) and Dealer Pinnacle (NE-02, PREFERRED, staging_slots 1, high_cube_access false), both with credit_limit_cents 900000000."
            - "BinDesign D1 12.0 m x 9.6 m under Alpha, analysed and submitted so it is UNDER_REVIEW."
