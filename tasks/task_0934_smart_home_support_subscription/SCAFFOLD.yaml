    roles: [PlatformAdmin, BillingAdmin, SupportAgent, Owner]
    code: 200
    input: []
    output: ServiceCredit
    side_effects: []

  # ---- Test-driving endpoint ----------------------------------------------
  - method: POST
    path: "/smart-home-support/_clock/set_current_utc"
    description: "Set the server's logical clock. Before any call the clock reads exactly 2026-05-01T00:00:00Z and it NEVER falls back to real wall-clock time. Every deadline, expiry and window rule in this scaffold is evaluated against this clock."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["advances the logical clock; performs no state transitions of its own"]

# ---------------------------------------------------------------------------
# 1.6 Error Code Catalog
# ---------------------------------------------------------------------------
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role missing, blank or not one of the six declared roles; or X-User-ID missing for an entity-backed role."
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "The authenticated role is not listed in the target endpoint's roles."
  - id: ERR_ROW_SCOPE_DENIED
    http: 403
    condition: "The acting member's household (or the acting technician's id) does not own the target row."
  - id: ERR_HOUSEHOLD_NOT_FOUND
    http: 404
    condition: "A referenced Household id does not exist."
  - id: ERR_MEMBER_NOT_FOUND
    http: 404
    condition: "A referenced HouseholdMember id does not exist, is inactive, or its member_role does not match the header role."
  - id: ERR_PLAN_NOT_FOUND
    http: 404
    condition: "A referenced SubscriptionPlan id does not exist."
  - id: ERR_SUBSCRIPTION_NOT_FOUND
    http: 404
    condition: "A referenced Subscription id does not exist, or the household has no subscription when one is required."
  - id: ERR_CATALOG_ENTRY_NOT_FOUND
    http: 404
    condition: "A referenced DeviceCatalogEntry id does not exist, including inside AddOnOrder.lines."
  - id: ERR_DEVICE_NOT_FOUND
    http: 404
    condition: "A referenced Device id does not exist, including inside a launch-ring device_ids list."
  - id: ERR_TICKET_NOT_FOUND
    http: 404
    condition: "A referenced Ticket id does not exist."
  - id: ERR_SESSION_NOT_FOUND
    http: 404
    condition: "A referenced RemoteSession id does not exist."
  - id: ERR_TECHNICIAN_NOT_FOUND
    http: 404
    condition: "A referenced Technician id does not exist."
  - id: ERR_SLOT_NOT_FOUND
    http: 404
    condition: "A referenced VisitSlot id does not exist."
  - id: ERR_VISIT_NOT_FOUND
    http: 404
    condition: "A referenced Visit id does not exist."
  - id: ERR_CAMPAIGN_NOT_FOUND
    http: 404
    condition: "A referenced FirmwareCampaign id does not exist."
  - id: ERR_ROLLOUT_NOT_FOUND
    http: 404
    condition: "A referenced FirmwareRollout id does not exist."
  - id: ERR_ORDER_NOT_FOUND
    http: 404
    condition: "A referenced AddOnOrder id does not exist."
  - id: ERR_RMA_NOT_FOUND
    http: 404
    condition: "A referenced RmaCase id does not exist."
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "A required body field is missing, has the wrong JSON type, or falls outside its declared numeric range; also pagination limit/offset out of bounds."
  - id: ERR_INVALID_ENUM
    http: 422
    condition: "A value supplied for one of the closed enum fields listed at validation priority 21 is not a member of that field's enum."
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_device_version or expected_subscription_version does not equal the current version of the named parent row."
  - id: ERR_ACCOUNT_SUSPENDED
    http: 403
    condition: "Gate 1: the household that scopes the target row has account_status == SUSPENDED."
  - id: ERR_DEVICE_DECOMMISSIONED
    http: 409
    condition: "Gate 2: the resolved device has lifecycle_status == DECOMMISSIONED."
  - id: ERR_TICKET_CLOSED
    http: 409
    condition: "Gate 3: the resolved ticket has workflow_status == CLOSED."
  - id: ERR_SUBSCRIPTION_CANCELLED
    http: 409
    condition: "Gate 4: the household's subscription has status == CANCELLED."
  - id: ERR_INVALID_STATE
    http: 409
    condition: "The target row's current state on the relevant axis does not permit the requested transition."
  - id: ERR_SERIAL_MODEL_MISMATCH
    http: 422
    condition: "The claimed serial_number does not start with the catalog entry's serial_prefix."
  - id: ERR_SERIAL_ALREADY_CLAIMED
    http: 409
    condition: "The serial_number is already recorded on another Device row in any lifecycle_status."
  - id: ERR_ACTIVATION_TOKEN_EXPIRED
    http: 409
    condition: "Activation was attempted at or after Device.activation_expires_at."
  - id: ERR_ACTIVATION_ATTEMPTS_EXCEEDED
    http: 409
    condition: "The activation attempt is the 3rd failure against the current token, or the device already has 3 recorded failures."
  - id: ERR_ACTIVATION_CODE_INVALID
    http: 422
    condition: "activation_code does not equal Device.activation_token and this is only the 1st or 2nd failure."
  - id: ERR_RECLAIM_NOT_ELIGIBLE
    http: 409
    condition: "Reclaim was requested for a device that is not in RECLAIMABLE."
  - id: ERR_RMA_IN_FLIGHT
    http: 409
    condition: "The device has an RmaCase in OPEN, ROUTED, ADVANCE_SHIPPED or AWAITING_RETURN and the requested operation (rollout launch, transfer, decommission) is blocked by it."
  - id: ERR_OPEN_TICKET_BLOCKS_ROLLOUT
    http: 409
    condition: "A FEATURE_OPTIONAL campaign ring listed a device that has a ticket whose workflow_status is not RESOLVED or CLOSED."
  - id: ERR_ROLLOUT_WINDOW_OVERLAP
    http: 409
    condition: "The requested closed ring window touches or overlaps an existing PENDING rollout window for the same device."
  - id: ERR_CAMPAIGN_HALTED
    http: 409
    condition: "A rollout action was attempted while the owning campaign is HALTED."
  - id: ERR_DEFER_NOT_ALLOWED
    http: 409
    condition: "Deferral was requested on a SECURITY_MANDATORY campaign, or defer_until is more than 14 days past the logical clock."
  - id: ERR_RETRY_CAP_EXCEEDED
    http: 409
    condition: "Retry was requested when FirmwareRollout.retry_count already equals FIRMWARE_MAX_RETRY_COUNT (2)."
  - id: ERR_DISPATCH_NOT_REQUIRED
    http: 409
    condition: "A visit was booked for a ticket whose dispatch_status is not REQUIRED, RESCHEDULING or NO_SHOW."
  - id: ERR_SLOT_REGION_MISMATCH
    http: 422
    condition: "The chosen slot's region_code differs from the ticket household's region_code."
  - id: ERR_SLOT_UNAVAILABLE
    http: 409
    condition: "The chosen slot's status is not OPEN."
  - id: ERR_SLOT_BUFFER_CONFLICT
    http: 409
    condition: "The chosen slot's buffer-expanded window strictly overlaps an already-BOOKED slot of the same technician."
  - id: ERR_VISIT_NOT_STARTED
    http: 409
    condition: "Completion or no-show was reported before Visit.scheduled_start_at."
  - id: ERR_REOPEN_WINDOW_CLOSED
    http: 409
    condition: "Reopen was requested at or after resolved_at + 168 hours."
  - id: ERR_SURVEY_ALREADY_SUBMITTED
    http: 409
    condition: "A SatisfactionSurvey row already exists for the ticket."
  - id: ERR_SURVEY_WINDOW_CLOSED
    http: 409
    condition: "The survey was submitted at or after survey_solicited_at + 72 hours, or the ticket was never resolved."
  - id: ERR_ADVANCE_REPLACEMENT_NOT_ELIGIBLE
    http: 409
    condition: "Advance-replacement shipping was requested on a case whose routing_target is not ADVANCE_REPLACEMENT."
  - id: ERR_RETURN_WINDOW_OPEN
    http: 409
    condition: "close-return-window was called on an AWAITING_RETURN case while the logical clock is still at or before return_deadline_at."
  - id: ERR_DEVICE_CAP_EXCEEDED
    http: 409
    condition: "The operation would push entitled_device_count above the plan's included_device_count while the subscription's allow_overage is false."
  - id: ERR_CREDIT_CAP_REACHED
    http: 409
    condition: "An explicit SLA evaluation would issue a credit but credit_cap_remaining_cents is 0 for the current cycle."

# ---------------------------------------------------------------------------
# 1.7 RBAC Matrix
# ---------------------------------------------------------------------------
roles:
  - name: Owner
    description: "The household's account owner. Full household-scoped authority over devices, tickets, transfers, firmware deferral and cancellation."
    identity: "entity_backed:HouseholdMember"
    exclusive_operations:
      - "POST /devices/claim"
      - "POST /devices/{id}/activate"
      - "POST /devices/{id}/transfer"
      - "POST /devices/{id}/accept-transfer"
      - "POST /firmware-rollouts/{id}/defer"
      - "POST /subscriptions/{id}/cancel"
    shared_operations:
      - "POST /households/{id}/members (with PlatformAdmin)"
      - "POST /devices/{id}/decommission (with PlatformAdmin)"
      - "POST /tickets (with Member and SupportAgent)"
      - "POST /tickets/{id}/customer-reply (with Member)"
      - "POST /tickets/{id}/reopen (with Member)"
      - "POST /tickets/{id}/survey (with Member)"
      - "POST /visits/{id}/cancel (with SupportAgent)"
      - "POST /addon-orders (with BillingAdmin)"
      - "all household-scoped GET endpoints"
    note: "X-User-ID must be a HouseholdMember row whose member_role == OWNER and is_active == true; every row it touches must belong to that member's household_id."

  - name: Member
    description: "A non-owner household resident. May raise and answer tickets and read household rows, but owns no device, billing or transfer authority."
    identity: "entity_backed:HouseholdMember"
    exclusive_operations: []
    shared_operations:
      - "POST /tickets (with Owner and SupportAgent)"
      - "POST /tickets/{id}/customer-reply (with Owner)"
      - "POST /tickets/{id}/reopen (with Owner)"
      - "POST /tickets/{id}/survey (with Owner)"
      - "GET /households/{id}, GET /household-members, GET /household-members/{id}, GET /devices, GET /devices/{id}, GET /tickets, GET /tickets/{id}"
    note: "X-User-ID must be a HouseholdMember row whose member_role == MEMBER."

  - name: BillingAdmin
    description: "The household's billing contact. Owns tier changes, overage policy and add-on purchasing; cannot touch devices or tickets."
    identity: "entity_backed:HouseholdMember"
    exclusive_operations:
      - "POST /subscriptions/{id}/set-overage-policy"
      - "POST /addon-orders/{id}/fulfill"
    shared_operations:
      - "POST /subscriptions/{id}/change-tier (with PlatformAdmin)"
      - "POST /addon-orders (with Owner)"
      - "GET /subscriptions, GET /subscriptions/{id}, GET /addon-orders, GET /addon-orders/{id}, GET /service-credits"
    note: "X-User-ID must be a HouseholdMember row whose member_role == BILLING_ADMIN."

  - name: SupportAgent
    description: "Operational support staff. Owns the ticket and RMA surfaces across all households; holds no household membership."
    identity: "opaque"
    exclusive_operations:
      - "POST /tickets/{id}/first-response"
      - "POST /tickets/{id}/await-customer"
      - "POST /tickets/{id}/remote-sessions"
      - "POST /remote-sessions/{id}/complete"
      - "POST /tickets/{id}/close"
      - "POST /visits"
      - "POST /visits/{id}/reschedule"
      - "POST /rma-cases"
      - "POST /rma-cases/{id}/ship-advance-replacement"
      - "POST /rma-cases/{id}/receive-return"
      - "POST /rma-cases/{id}/close-return-window"
    shared_operations:
      - "POST /tickets (with Owner and Member)"
      - "POST /tickets/{id}/sla-evaluate (with PlatformAdmin)"
      - "POST /devices/{id}/reclaim (with PlatformAdmin)"
      - "POST /visits/{id}/cancel (with Owner)"
      - "cross-household GET endpoints"
    note: "X-User-ID is an operator identifier stored on RemoteSession.agent_user_id; it is never compared to any entity id."

  - name: Technician
    description: "Field technician. Owns availability slots, onsite visit outcomes and firmware result reporting for their own slots."
    identity: "entity_backed:Technician"
    exclusive_operations:
      - "POST /visits/{id}/complete"
      - "POST /visits/{id}/no-show"
    shared_operations:
      - "POST /technicians/{id}/visit-slots (with PlatformAdmin)"
      - "POST /firmware-rollouts/{id}/report-result (with PlatformAdmin)"
      - "GET /technicians/{id}, GET /visit-slots, GET /visit-slots/{id}, GET /visits, GET /visits/{id}, GET /firmware-rollouts"
    note: "X-User-ID must equal a Technician.id, and must equal the technician_id of the slot behind the targeted visit."

  - name: PlatformAdmin
    description: "Operator of the platform. Owns configuration (plans, catalog, campaigns), the billing cycle and the logical clock."
    identity: "opaque"
    exclusive_operations:
      - "POST /households"
      - "POST /households/{id}/account-status"
      - "POST /subscription-plans"
      - "POST /subscriptions"
      - "POST /subscriptions/{id}/close-cycle"
      - "POST /device-catalog"
      - "POST /technicians"
      - "POST /firmware-campaigns"
      - "POST /firmware-campaigns/{id}/launch-ring"
      - "POST /firmware-campaigns/{id}/resume"
      - "POST /firmware-rollouts/{id}/retry"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /households/{id}/members (with Owner)"
      - "POST /devices/claim, POST /devices/{id}/decommission (with Owner)"
      - "POST /devices/{id}/reclaim (with SupportAgent)"
      - "POST /subscriptions/{id}/change-tier, POST /subscriptions/{id}/set-overage-policy, POST /addon-orders/{id}/fulfill (with BillingAdmin)"
      - "POST /subscriptions/{id}/cancel (with Owner)"
      - "POST /tickets/{id}/sla-evaluate (with SupportAgent)"
      - "POST /technicians/{id}/visit-slots, POST /firmware-rollouts/{id}/report-result (with Technician)"
      - "every GET endpoint"
    note: "X-User-ID is an opaque operator identifier and is never compared to an entity id."
