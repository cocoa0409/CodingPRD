      - name: share_grant_window_is_half_open_so_exact_adjacency_is_allowed
        grounds:
          - validations[priority=18]
          - validations[priority=19]
          - errors[ERR_SHARE_WINDOW_OVERLAP]
          - entities.ShareGrant.fields.starts_at
          - entities.ShareGrant.fields.expires_at
          - entities.Household.fields.active_share_count
        distinguishing_aspect: |
          Interval semantics here are HALF-OPEN [starts_at, expires_at) with NO buffer,
          and the occupied resource is the (Household, recipient_ref) pair rather than an
          Item. A window starting strictly inside the incumbent collides; a window
          starting exactly at the incumbent's expires_at does not - the opposite verdict
          from the closed-plus-buffer appraisal rule on the same calendar geometry.
        test_recipe:
          setup:
            - "A PLUS household with an ACTIVE subscription and write_gate_state OPEN at 2026-05-01."
            - "One ACTIVE household-scoped SERIALS_HIDDEN grant to agent@carrier.example over [2026-05-01T00:00:00Z, 2026-06-01T00:00:00Z), 31 days, well under SHARE_MAX_DURATION_DAYS."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
