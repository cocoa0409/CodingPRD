              captures: { alpha_id: $.data.id }
            - call: "POST /voter-records"
              payload: { county_id: "${alpha_id}", voter_id_number: "VA1", full_name: "Ada Adams", signature_on_file_hash: "H-VA1", registration_date: "2020-01-01T00:00:00Z", registration_status: "ACTIVE" }
              as: SosAdmin
              as_user_id: "admin-1"
            - call: "POST /petitions"
              payload: { standard_id: "${std_id}", proponent_name: "List One", submitted_title: "List Measure One", measure_subject_codes: ["TAX"] }
              as: Proponent
              as_user_id: "prop-1"
              captures: { p1_id: $.data.id }
            - call: "POST /petitions/${p1_id}/submit"
              payload: {}
              as: Proponent
              as_user_id: "prop-1"
            - call: "POST /petitions/${p1_id}/format-decision"
              payload: { decision: "APPROVE" }
              as: ElectionsExaminer
              as_user_id: "exam-1"
              captures: { p1_v: $.data.version }
            - call: "PUT /petitions/${p1_id}/title-summary"
