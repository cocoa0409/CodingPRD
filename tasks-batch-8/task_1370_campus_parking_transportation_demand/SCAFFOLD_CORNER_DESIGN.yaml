  # ============================================================ rbac
  - section: rbac
    instances:
      - name: enforcement_officer_cannot_decide_appeal
        claim_type: rbac_denial
        grounds: ["roles", "errors[ERR_FORBIDDEN_ROLE]"]
        distinguishing_aspect: "EnforcementOfficer is not in decide-appeal's roles: even a valid decision payload from the enforcing role is rejected with ERR_FORBIDDEN_ROLE before any state check."
        test_recipe:
          setup: ["patron with permit plate S777; citation issued by off-1 and appealed (UNDER_APPEAL)"]
          setup_api_calls:
            - call: "POST /parking/patrons"
              payload: { full_name: "S", campus_role: "STAFF", residency: "OFF_CAMPUS", primary_commute_mode: "DRIVE_ALONE" }
              as: ParkingAdmin
              captures: { s_id: $.data.id }
            - call: "POST /parking/lots"
              payload: { lot_code: "LA", name: "Lot A", zone: "CORE", capacity_total: 50 }
              as: ParkingAdmin
              captures: { lot_a: $.data.id }
            - call: "POST /parking/lots"
              payload: { lot_code: "LB", name: "Lot B", zone: "REMOTE", capacity_total: 50 }
              as: ParkingAdmin
              captures: { lot_b: $.data.id }
            - call: "POST /parking/allocations"
              payload: { lot_id: "${lot_a}", permit_code: "GEN", eligible_roles: ["STAFF"], residency_rule: "ANY", base_fee_cents: 80000, proration_policy: "PRORATED_WEEKLY", term_start: "2026-08-03", term_end: "2026-11-22", quota: 5 }
              as: ParkingAdmin
              captures: { alloc_a: $.data.id }
            - call: "GET /parking/allocations/${alloc_a}"
              as: ParkingAdmin
              captures: { v_a: $.data.version }
            - call: "POST /parking/permits"
              payload: { patron_id: "${s_id}", allocation_id: "${alloc_a}", plate_number: "S777", expected_allocation_version: "${v_a}" }
              as: ParkingAdmin
            - call: "POST /parking/citations"
              payload: { lot_id: "${lot_b}", plate_number: "S777", violation_type: "NO_VALID_PERMIT" }
              as: EnforcementOfficer
              as_user_id: "off-1"
              captures: { cit_id: $.data.id }
            - call: "POST /parking/citations/${cit_id}/appeal"
              payload: { reason: "not my car" }
              as: Commuter
              as_user_id: "${s_id}"
          trigger:
            - call: "POST /parking/citations/${cit_id}/decide-appeal"
              payload: { outcome: "UPHELD" }
              as: EnforcementOfficer
              as_user_id: "off-1"
              captures: { err: $.data.error_id }
          assert:
            - "captured err == ERR_FORBIDDEN_ROLE (HTTP 403); the citation remains UNDER_APPEAL"

      - name: commuter_cannot_issue_citation
        claim_type: rbac_denial
        grounds: ["roles", "errors[ERR_FORBIDDEN_ROLE]"]
        distinguishing_aspect: "Citation issuance is exclusive to EnforcementOfficer: a Commuter is rejected with ERR_FORBIDDEN_ROLE."
        test_recipe:
          setup: ["two patrons; patron V holds permit plate V999; lot B"]
          setup_api_calls:
            - call: "POST /parking/patrons"
              payload: { full_name: "C", campus_role: "STUDENT", residency: "OFF_CAMPUS", primary_commute_mode: "DRIVE_ALONE" }
              as: ParkingAdmin
              captures: { c_id: $.data.id }
            - call: "POST /parking/patrons"
              payload: { full_name: "V", campus_role: "STAFF", residency: "OFF_CAMPUS", primary_commute_mode: "DRIVE_ALONE" }
              as: ParkingAdmin
              captures: { v_id: $.data.id }
            - call: "POST /parking/lots"
              payload: { lot_code: "LA", name: "Lot A", zone: "CORE", capacity_total: 50 }
              as: ParkingAdmin
              captures: { lot_a: $.data.id }
            - call: "POST /parking/lots"
              payload: { lot_code: "LB", name: "Lot B", zone: "REMOTE", capacity_total: 50 }
              as: ParkingAdmin
              captures: { lot_b: $.data.id }
            - call: "POST /parking/allocations"
              payload: { lot_id: "${lot_a}", permit_code: "GEN", eligible_roles: ["STUDENT", "STAFF"], residency_rule: "ANY", base_fee_cents: 80000, proration_policy: "PRORATED_WEEKLY", term_start: "2026-08-03", term_end: "2026-11-22", quota: 5 }
              as: ParkingAdmin
              captures: { alloc_a: $.data.id }
            - call: "GET /parking/allocations/${alloc_a}"
              as: ParkingAdmin
              captures: { v_a: $.data.version }
            - call: "POST /parking/permits"
              payload: { patron_id: "${v_id}", allocation_id: "${alloc_a}", plate_number: "V999", expected_allocation_version: "${v_a}" }
              as: ParkingAdmin
          trigger:
            - call: "POST /parking/citations"
              payload: { lot_id: "${lot_b}", plate_number: "V999", violation_type: "NO_VALID_PERMIT" }
              as: Commuter
              as_user_id: "${c_id}"
              captures: { err: $.data.error_id }
          assert:
            - "captured err == ERR_FORBIDDEN_ROLE (HTTP 403)"

      - name: commuter_cannot_cancel_others_permit
        claim_type: rbac_denial
        grounds: ["validations[priority=3]", "errors[ERR_NOT_RESOURCE_OWNER]", "roles"]
        distinguishing_aspect: "Ownership: Commuter B cancelling patron A's permit fails priority 3 with ERR_NOT_RESOURCE_OWNER, while ParkingAdmin (shared operation) can cancel it."
        test_recipe:
          setup: ["patrons A and B; A holds one ACTIVE permit"]
          setup_api_calls:
            - call: "POST /parking/patrons"
              payload: { full_name: "A", campus_role: "STUDENT", residency: "OFF_CAMPUS", primary_commute_mode: "DRIVE_ALONE" }
              as: ParkingAdmin
              captures: { a_id: $.data.id }
            - call: "POST /parking/patrons"
              payload: { full_name: "B", campus_role: "STUDENT", residency: "OFF_CAMPUS", primary_commute_mode: "DRIVE_ALONE" }
              as: ParkingAdmin
              captures: { b_id: $.data.id }
            - call: "POST /parking/lots"
              payload: { lot_code: "LO", name: "Lot O", zone: "CORE", capacity_total: 50 }
              as: ParkingAdmin
              captures: { lot_o: $.data.id }
            - call: "POST /parking/allocations"
              payload: { lot_id: "${lot_o}", permit_code: "GEN", eligible_roles: ["STUDENT"], residency_rule: "ANY", base_fee_cents: 80000, proration_policy: "PRORATED_WEEKLY", term_start: "2026-08-03", term_end: "2026-11-22", quota: 5 }
              as: ParkingAdmin
              captures: { alloc_o: $.data.id }
            - call: "GET /parking/allocations/${alloc_o}"
              as: ParkingAdmin
              captures: { v_o: $.data.version }
            - call: "POST /parking/permits"
              payload: { patron_id: "${a_id}", allocation_id: "${alloc_o}", plate_number: "A111", expected_allocation_version: "${v_o}" }
              as: ParkingAdmin
              captures: { a_permit: $.data.id }
          trigger:
            - call: "POST /parking/permits/${a_permit}/cancel"
              payload: {}
              as: Commuter
              as_user_id: "${b_id}"
              captures: { err: $.data.error_id }
            - call: "POST /parking/permits/${a_permit}/cancel"
              payload: {}
              as: ParkingAdmin
              captures: { ok_status: $.data.status }
          assert:
            - "captured err == ERR_NOT_RESOURCE_OWNER (HTTP 403) for the non-owner Commuter"
            - "captured ok_status == CANCELLED for the ParkingAdmin cancel"

  # ============================================================ cross-cutting complexity layers
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_quota_adjust_stale_version_rejected
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[allocation-quota-adjust-stale]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "PATCH quota succeeds against the observed version (bumping it 1 -> 2); a second PATCH carrying the now-stale captured version is rejected with 412 ERR_STALE_VERSION."
        test_recipe:
          setup: ["one allocation, version captured at creation (1)"]
          setup_api_calls:
            - call: "POST /parking/lots"
              payload: { lot_code: "LQ", name: "Lot Q", zone: "CORE", capacity_total: 50 }
              as: ParkingAdmin
              captures: { lot_q: $.data.id }
            - call: "POST /parking/allocations"
              payload: { lot_id: "${lot_q}", permit_code: "GEN", eligible_roles: ["STUDENT"], residency_rule: "ANY", base_fee_cents: 80000, proration_policy: "PRORATED_WEEKLY", term_start: "2026-08-03", term_end: "2026-11-22", quota: 5 }
              as: ParkingAdmin
              captures: { alloc_q: $.data.id, v_q1: $.data.version }
          trigger:
            - call: "PATCH /parking/allocations/${alloc_q}"
              payload: { quota: 7, expected_allocation_version: "${v_q1}" }
              as: ParkingAdmin
              captures: { v_after: $.data.version, quota_after: $.data.quota }
            - call: "PATCH /parking/allocations/${alloc_q}"
              payload: { quota: 9, expected_allocation_version: "${v_q1}" }
              as: ParkingAdmin
              captures: { err: $.data.error_id }
          assert:
            - "captured quota_after == 7 and v_after == 2 (first adjust succeeded and bumped the version)"
            - "captured err == ERR_STALE_VERSION (HTTP 412) for the stale second adjust; quota remains 7"

      - name: occ_permit_purchase_stale_version_rejected
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[permit-purchase-stale-allocation]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "A purchase consumes one seat and bumps the allocation version; a second purchase still carrying the pre-purchase version is rejected with 412 even though a seat remains free."
        test_recipe:
          setup: ["quota-5 allocation; two patrons; allocation version captured once before either purchase"]
          setup_api_calls:
            - call: "POST /parking/patrons"
              payload: { full_name: "A", campus_role: "STUDENT", residency: "OFF_CAMPUS", primary_commute_mode: "DRIVE_ALONE" }
              as: ParkingAdmin
              captures: { a_id: $.data.id }
            - call: "POST /parking/patrons"
              payload: { full_name: "B", campus_role: "STUDENT", residency: "OFF_CAMPUS", primary_commute_mode: "DRIVE_ALONE" }
              as: ParkingAdmin
              captures: { b_id: $.data.id }
            - call: "POST /parking/lots"
              payload: { lot_code: "LS", name: "Lot S", zone: "CORE", capacity_total: 50 }
              as: ParkingAdmin
              captures: { lot_s: $.data.id }
            - call: "POST /parking/allocations"
              payload: { lot_id: "${lot_s}", permit_code: "GEN", eligible_roles: ["STUDENT"], residency_rule: "ANY", base_fee_cents: 80000, proration_policy: "PRORATED_WEEKLY", term_start: "2026-08-03", term_end: "2026-11-22", quota: 5 }
              as: ParkingAdmin
              captures: { alloc_s: $.data.id, v_s1: $.data.version }
          trigger:
            - call: "POST /parking/permits"
              payload: { patron_id: "${a_id}", allocation_id: "${alloc_s}", plate_number: "A111", expected_allocation_version: "${v_s1}" }
              as: ParkingAdmin
              captures: { p1_status: $.data.status }
            - call: "POST /parking/permits"
              payload: { patron_id: "${b_id}", allocation_id: "${alloc_s}", plate_number: "B111", expected_allocation_version: "${v_s1}" }
              as: ParkingAdmin
              captures: { err: $.data.error_id }
          assert:
            - "captured p1_status == ACTIVE (first purchase against the captured version succeeds)"
            - "captured err == ERR_STALE_VERSION (HTTP 412) — the version advanced with the first purchase"

      - name: displaced_permits_return_on_lift
        claim_type: compensation
        grounds: ["state_machines.LotClosure.ACTIVE_to_LIFTED", "entities.Permit.fields.displaced_from_allocation_id"]
        distinguishing_aspect: "Lifting a construction closure reverses displacement exactly: the permit returns to its original allocation, displaced_from_allocation_id clears, and both allocations' counts/statuses revert (SRC 1, DST 0/OPEN)."
        test_recipe:
          setup: ["construction closure ACTIVATED (patron P's permit displaced SRC -> DST, DST at quota 1 = WAITLISTING)"]
          setup_api_calls:
            - call: "POST /parking/patrons"
              payload: { full_name: "P", campus_role: "STAFF", residency: "ON_CAMPUS", primary_commute_mode: "DRIVE_ALONE" }
              as: ParkingAdmin
              captures: { p_id: $.data.id }
            - call: "POST /parking/lots"
              payload: { lot_code: "L1", name: "Lot 1", zone: "CORE", capacity_total: 100 }
              as: ParkingAdmin
              captures: { lot_1: $.data.id }
            - call: "POST /parking/lots"
              payload: { lot_code: "L2", name: "Lot 2", zone: "PERIMETER", capacity_total: 100 }
              as: ParkingAdmin
              captures: { lot_2: $.data.id }
            - call: "POST /parking/allocations"
              payload: { lot_id: "${lot_1}", permit_code: "RES", eligible_roles: ["STAFF"], residency_rule: "ANY", base_fee_cents: 80000, proration_policy: "PRORATED_WEEKLY", term_start: "2026-08-03", term_end: "2026-11-22", quota: 2 }
              as: ParkingAdmin
              captures: { alloc_src: $.data.id }
            - call: "POST /parking/allocations"
              payload: { lot_id: "${lot_2}", permit_code: "RES", eligible_roles: ["STAFF"], residency_rule: "ANY", base_fee_cents: 80000, proration_policy: "PRORATED_WEEKLY", term_start: "2026-08-03", term_end: "2026-11-22", quota: 1 }
              as: ParkingAdmin
              captures: { alloc_dst: $.data.id }
            - call: "GET /parking/allocations/${alloc_src}"
              as: ParkingAdmin
              captures: { v_src: $.data.version }
            - call: "POST /parking/permits"
              payload: { patron_id: "${p_id}", allocation_id: "${alloc_src}", plate_number: "D444", expected_allocation_version: "${v_src}" }
              as: ParkingAdmin
              captures: { permit_id: $.data.id }
            - call: "POST /parking/closures"
              payload: { lot_id: "${lot_1}", reason: "CONSTRUCTION", starts_at: "2026-08-10T00:00:00Z", ends_at: "2026-08-20T00:00:00Z", fallback_lot_id: "${lot_2}" }
              as: ParkingAdmin
              captures: { closure_id: $.data.id }
            - call: "POST /parking/closures/${closure_id}/activate"
              payload: {}
              as: ParkingAdmin
          trigger:
            - call: "POST /parking/closures/${closure_id}/lift"
              payload: {}
              as: ParkingAdmin
              captures: { cl_status: $.data.status }
            - call: "GET /parking/permits/${permit_id}"
              as: ParkingAdmin
              captures: { p_alloc: $.data.allocation_id, p_disp: $.data.displaced_from_allocation_id }
            - call: "GET /parking/lots/${lot_1}"
              as: ParkingAdmin
              captures: { lot1_posture: $.data.posture }
            - call: "GET /parking/allocations/${alloc_src}"
              as: ParkingAdmin
              captures: { src_cnt: $.data.allocated_count }
            - call: "GET /parking/allocations/${alloc_dst}"
              as: ParkingAdmin
              captures: { dst_cnt: $.data.allocated_count, dst_status: $.data.status }
          assert:
            - "captured cl_status == LIFTED and lot1_posture == OPEN"
            - "captured p_alloc == ${alloc_src} and p_disp == null"
            - "captured src_cnt == 1 and dst_cnt == 0 and dst_status == OPEN"

      - name: credit_applied_and_restored_on_cancel
        claim_type: derived_field_reconciliation
        grounds: ["calculations.permit_fee_calculation", "calculations.permit_refund_calculation", "entities.IncentiveAccount.fields.credit_balance_cents"]
        distinguishing_aspect: "Applying 2500 credit to an 84000 permit yields fee_paid 81500; cancelling before valid_from refunds 81500 AND restores the full 2500 credit — the account's credit field reconciles with no drift."
        test_recipe:
          setup: ["TRANSIT patron with 2500 credit (50 accrued days, 1 block redeemed); OPEN quota-5 allocation; clock untouched (before term start)"]
          setup_api_calls:
            - call: "POST /parking/patrons"
              payload: { full_name: "M", campus_role: "STAFF", residency: "OFF_CAMPUS", primary_commute_mode: "TRANSIT" }
              as: ParkingAdmin
              captures: { m_id: $.data.id }
            - call: "POST /parking/incentive-accounts"
              payload: { patron_id: "${m_id}" }
              as: Commuter
              as_user_id: "${m_id}"
              captures: { acct: $.data.id }
            - call: "POST /parking/incentive-accounts/${acct}/accruals"
              payload: { days_commuted: 31 }
              as: ParkingAdmin
            - call: "POST /parking/incentive-accounts/${acct}/accruals"
              payload: { days_commuted: 19 }
              as: ParkingAdmin
            - call: "POST /parking/incentive-accounts/${acct}/redeem"
              payload: { blocks: 1 }
              as: Commuter
              as_user_id: "${m_id}"
            - call: "POST /parking/lots"
              payload: { lot_code: "LM", name: "Lot M", zone: "CORE", capacity_total: 50 }
              as: ParkingAdmin
              captures: { lot_m: $.data.id }
            - call: "POST /parking/allocations"
              payload: { lot_id: "${lot_m}", permit_code: "GEN", eligible_roles: ["STAFF"], residency_rule: "ANY", base_fee_cents: 80000, proration_policy: "PRORATED_WEEKLY", term_start: "2026-08-03", term_end: "2026-11-22", quota: 5 }
              as: ParkingAdmin
              captures: { alloc_m: $.data.id }
            - call: "GET /parking/allocations/${alloc_m}"
              as: ParkingAdmin
              captures: { v_m: $.data.version }
          trigger:
            - call: "POST /parking/permits"
              payload: { patron_id: "${m_id}", allocation_id: "${alloc_m}", plate_number: "M111", expected_allocation_version: "${v_m}", apply_credit_cents: 2500 }
              as: Commuter
              as_user_id: "${m_id}"
              captures: { permit_id: $.data.id, p_credit: $.data.credit_applied_cents, p_paid: $.data.fee_paid_cents }
            - call: "GET /parking/incentive-accounts/${acct}"
              as: ParkingAdmin
              captures: { credit_mid: $.data.credit_balance_cents }
            - call: "POST /parking/permits/${permit_id}/cancel"
              payload: {}
              as: Commuter
              as_user_id: "${m_id}"
              captures: { refund: $.data.refund_cents }
            - call: "GET /parking/incentive-accounts/${acct}"
              as: ParkingAdmin
              captures: { credit_end: $.data.credit_balance_cents }
          assert:
            - "captured p_credit == 2500 and p_paid == 81500 (84000 - 2500) and credit_mid == 0"
            - "captured refund == 81500 (full refund of fee_paid before valid_from) and credit_end == 2500 (applied credit restored in full)"

      - name: version_increments_on_each_mutation
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[allocation-quota-adjust-stale]", "entities.LotAllocation"]
        distinguishing_aspect: "LotAllocation.version advances by exactly one per mutation: creation 1, quota PATCH 2, permit purchase 3 — each observed via response/read."
        test_recipe:
          setup: ["one allocation and one patron"]
          setup_api_calls:
            - call: "POST /parking/patrons"
              payload: { full_name: "A", campus_role: "STUDENT", residency: "OFF_CAMPUS", primary_commute_mode: "DRIVE_ALONE" }
              as: ParkingAdmin
              captures: { a_id: $.data.id }
            - call: "POST /parking/lots"
              payload: { lot_code: "LV", name: "Lot V", zone: "CORE", capacity_total: 50 }
              as: ParkingAdmin
              captures: { lot_v: $.data.id }
            - call: "POST /parking/allocations"
              payload: { lot_id: "${lot_v}", permit_code: "GEN", eligible_roles: ["STUDENT"], residency_rule: "ANY", base_fee_cents: 80000, proration_policy: "PRORATED_WEEKLY", term_start: "2026-08-03", term_end: "2026-11-22", quota: 5 }
              as: ParkingAdmin
              captures: { alloc_v: $.data.id, ver1: $.data.version }
          trigger:
            - call: "PATCH /parking/allocations/${alloc_v}"
              payload: { quota: 8, expected_allocation_version: "${ver1}" }
              as: ParkingAdmin
              captures: { ver2: $.data.version }
            - call: "POST /parking/permits"
              payload: { patron_id: "${a_id}", allocation_id: "${alloc_v}", plate_number: "A111", expected_allocation_version: "${ver2}" }
              as: ParkingAdmin
            - call: "GET /parking/allocations/${alloc_v}"
              as: ParkingAdmin
              captures: { ver3: $.data.version }
          assert:
            - "captured ver1 == 1 and ver2 == 2 and ver3 == 3"

  # ============================================================ consistency model
  - section: consistency_model
    instances:
      - name: purchase_response_immediately_reflects_state
