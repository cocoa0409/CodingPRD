              captures: { child_id: $.data.id }
            - call: "POST /children/${child_id}/allergen-flags"
              payload: { allergen_tag: "FRAGRANCE", severity: "SEVERE" }
              as: AccountHolder
              as_user_id: "${acct_id}"
