      - name: weather_is_shared_by_two_roles_while_publish_and_close_day_stay_with_the_director
        claim_type: shared_operations
        grounds:
          - roles[LiftOpsManager]
          - roles[MountainOpsDirector]
          - endpoints[POST /mountain-ops/day-plans/{id}/weather]
          - endpoints[POST /mountain-ops/day-plans/{id}/publish]
          - endpoints[POST /mountain-ops/day-plans/{id}/close-day]
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: |
          The lift manager needs to post a wind reading without waiting for the director, so weather is
          the one DayPlan mutation with two permitted roles - but the two lifecycle transitions on the same
          resource stay single-role. The refused publish is issued by the very role that IS allowed to post
          weather to that same day plan, so a per-resource permission model passes every other trigger and
          fails this one.
        test_recipe:
          setup:
            - "A PRESEASON season with a STANDBY lift, one READY area and a DRAFT day plan for 2026-08-01."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
