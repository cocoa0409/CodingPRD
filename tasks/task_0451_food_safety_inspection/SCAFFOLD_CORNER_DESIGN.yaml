# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth probe over the claim-extraction-guide sections. Every active instance
# has an executable setup_api_calls chain; §1.8-covered corners are excluded_because stubs.
# Formula-derived asserts are literals computed against §1.3.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: entity_establishment_create_returns_201_with_system_fields
        claim_type: Creation
        grounds:
          - "entities.Establishment"
          - "endpoints"
        distinguishing_aspect: "POST /establishments with required fields returns 201; id, created_at, updated_at, version=1 are server-minted and status=PRELICENSE."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /establishments"
              payload: { name: "Diner E1", address: "1 Main St", seating_capacity: 40 }
              as: PermitClerk
              captures: { e1: $.data.id, ver: $.data.version, st: $.data.status }
          assert:
            - "Establishment.${e1}.version == 1"
            - "Establishment.${e1}.status == PRELICENSE"
            - "response.response_type == object"

      - name: entity_establishment_missing_required_seating_capacity
        claim_type: Required Fields
        grounds:
          - "entities.Establishment.fields.seating_capacity"
          - "validations[priority=15]"
        distinguishing_aspect: "POST /establishments omitting required seating_capacity -> ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /establishments"
              payload: { name: "Diner E1", address: "1 Main St" }
              as: PermitClerk
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_INVALID_REQUEST"
            - "response.http_status == 400"

      - name: entity_establishment_default_serves_raw_false
        claim_type: Defaults
        grounds:
          - "entities.Establishment.fields.serves_raw_animal_foods"
          - "calculations.risk_category_assignment"
        distinguishing_aspect: "Omitting serves_raw_animal_foods defaults to false, so seating_capacity 40 stays CATEGORY_1 (routine_interval_days 365)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /establishments"
              payload: { name: "Diner E1", address: "1 Main St", seating_capacity: 40 }
              as: PermitClerk
              captures: { rc: $.data.risk_category, rid: $.data.routine_interval_days }
          assert:
            - "Establishment.risk_category == CATEGORY_1"
            - "Establishment.routine_interval_days == 365"

      - name: entity_establishment_computed_risk_category_cat3_via_escalators
        claim_type: Computed Fields
        grounds:
          - "entities.Establishment.fields.risk_category"
          - "calculations.risk_category_assignment"
        distinguishing_aspect: "seating_capacity 60 (CATEGORY_2) with serves_raw_animal_foods AND does_onsite_processing escalates two bands to CATEGORY_3 (interval 90); client-supplied risk_category is ignored."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /establishments"
              payload: { name: "Smokehouse", address: "9 Pit Rd", seating_capacity: 60, serves_raw_animal_foods: true, does_onsite_processing: true }
              as: PermitClerk
              captures: { rc: $.data.risk_category, rid: $.data.routine_interval_days }
          assert:
            - "Establishment.risk_category == CATEGORY_3"
            - "Establishment.routine_interval_days == 90"

      - name: entity_establishment_get_not_found
        claim_type: Not Found
        grounds:
          - "endpoints"
          - "errors[ERR_ESTABLISHMENT_NOT_FOUND]"
        distinguishing_aspect: "GET /establishments/{id} with an unknown UUID -> ERR_ESTABLISHMENT_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /establishments/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PermitClerk
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_ESTABLISHMENT_NOT_FOUND"
            - "response.http_status == 404"

      - name: entity_fda_code_create_classification_invalid_enum
        claim_type: Type Constraints
        grounds:
          - "entities.FdaFoodCode.fields.classification"
          - "validations[priority=15]"
        distinguishing_aspect: "POST /fda-food-codes with classification not in {CRITICAL,NON_CRITICAL} -> ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /fda-food-codes"
              payload: { code: "X-1", title: "Bad", classification: "MAJOR", base_demerit_points: 5 }
              as: HealthDirector
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_INVALID_REQUEST"

      - name: entity_inspection_listing_pagination_envelope
        claim_type: Listing
        grounds:
          - "endpoints"
        distinguishing_aspect: "GET /inspections returns response_type array with pagination fields limit, offset, total_count, has_more."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /inspections"
              payload: {}
              as: HealthDirector
          assert:
            - "response.response_type == array"
            - "response.meta contains pagination total_count and has_more"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: sm_plan_review_approve_from_already_approved_invalid
        claim_type: Invalid Transitions
        grounds:
          - "state_machines.PlanReview.SUBMITTED_to_APPROVED"
          - "errors[ERR_PLAN_REVIEW_NOT_SUBMITTED]"
        distinguishing_aspect: "Approving an already-APPROVED plan review -> ERR_PLAN_REVIEW_NOT_SUBMITTED (409); no state change."
        test_recipe:
          setup: ["Establishment e1 PRELICENSE with one APPROVED plan review."]
          setup_api_calls:
            - call: "POST /establishments"
              payload: { name: "Diner E1", address: "1 Main St", seating_capacity: 40 }
              as: PermitClerk
              captures: { e1: $.data.id }
            - call: "POST /plan-reviews"
              payload: { establishment_id: "${e1}", submitted_layout_sqft: 400, equipment_count: 5 }
              as: PermitClerk
              captures: { pr1: $.data.id }
            - call: "POST /plan-reviews/${pr1}/approve"
              payload: {}
              as: PermitClerk
          trigger:
            - call: "POST /plan-reviews/${pr1}/approve"
              payload: {}
              as: PermitClerk
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_PLAN_REVIEW_NOT_SUBMITTED"
            - "PlanReview.${pr1}.status == APPROVED"

      - name: sm_plan_review_resubmit_cycle_bumps_revision_round_and_refee
        claim_type: cyclic
        grounds:
          - "state_machines.PlanReview.REJECTED_to_SUBMITTED"
          - "entities.PlanReview.fields.revision_round"
          - "calculations.plan_review_fee"
        distinguishing_aspect: "REJECTED plan review resubmitted with new layout 1200 sqft / 10 equip returns to SUBMITTED, revision_round 1, plan_fee_cents recomputed to 70000."
        test_recipe:
          setup: ["Establishment e1 with a SUBMITTED plan review (400 sqft, 5 equip) then REJECTED."]
          setup_api_calls:
            - call: "POST /establishments"
              payload: { name: "Diner E1", address: "1 Main St", seating_capacity: 40 }
              as: PermitClerk
              captures: { e1: $.data.id }
            - call: "POST /plan-reviews"
              payload: { establishment_id: "${e1}", submitted_layout_sqft: 400, equipment_count: 5 }
              as: PermitClerk
              captures: { pr1: $.data.id }
            - call: "POST /plan-reviews/${pr1}/reject"
              payload: { rejection_reason: "Inadequate handwash placement" }
              as: PermitClerk
          trigger:
            - call: "POST /plan-reviews/${pr1}/resubmit"
              payload: { submitted_layout_sqft: 1200, equipment_count: 10 }
              as: PermitClerk
              captures: { st: $.data.status, rr: $.data.revision_round, fee: $.data.plan_fee_cents }
          assert:
            - "PlanReview.${pr1}.status == SUBMITTED"
            - "PlanReview.${pr1}.revision_round == 1"
            - "PlanReview.${pr1}.plan_fee_cents == 70000"

      - name: sm_establishment_revoked_is_terminal_lockdown
        claim_type: Terminal State Lockdown
        grounds:
          - "state_machines.Establishment.SUSPENDED_to_REVOKED"
          - "errors[ERR_ESTABLISHMENT_NOT_REVOCABLE]"
        distinguishing_aspect: "An already-REVOKED establishment cannot be revoked again -> ERR_ESTABLISHMENT_NOT_REVOCABLE (409)."
        test_recipe:
          setup: ["Establishment e1 PERMITTED then REVOKED."]
          setup_api_calls:
            - call: "POST /establishments"
              payload: { name: "Diner E1", address: "1 Main St", seating_capacity: 40 }
              as: PermitClerk
              captures: { e1: $.data.id }
            - call: "POST /plan-reviews"
              payload: { establishment_id: "${e1}", submitted_layout_sqft: 400, equipment_count: 5 }
              as: PermitClerk
              captures: { pr1: $.data.id }
            - call: "POST /plan-reviews/${pr1}/approve"
              payload: {}
              as: PermitClerk
            - call: "POST /permits"
              payload: { establishment_id: "${e1}", plan_review_id: "${pr1}" }
              as: PermitClerk
            - call: "POST /establishments/${e1}/revoke"
              payload: {}
              as: HealthDirector
          trigger:
            - call: "POST /establishments/${e1}/revoke"
              payload: {}
              as: HealthDirector
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_ESTABLISHMENT_NOT_REVOCABLE"
            - "Establishment.${e1}.status == REVOKED"

      - name: sm_inspection_finalize_from_scheduled_invalid
        claim_type: Invalid Transitions
        grounds:
          - "state_machines.Inspection.COMPLETED_to_FINALIZED"
          - "errors[ERR_INSPECTION_NOT_COMPLETED]"
        distinguishing_aspect: "Finalizing a SCHEDULED inspection (not COMPLETED) -> ERR_INSPECTION_NOT_COMPLETED (409); OCC is not even reached because state check governs."
        test_recipe:
          setup: ["Inspector i1; establishment e1 PERMITTED; a ROUTINE inspection still SCHEDULED."]
          setup_api_calls:
            - call: "POST /inspectors"
              payload: { full_name: "Ivy One", badge_number: "B-001" }
              as: HealthDirector
              captures: { i1: $.data.id }
            - call: "POST /establishments"
              payload: { name: "Diner E1", address: "1 Main St", seating_capacity: 40 }
              as: PermitClerk
              captures: { e1: $.data.id }
            - call: "POST /plan-reviews"
              payload: { establishment_id: "${e1}", submitted_layout_sqft: 400, equipment_count: 5 }
              as: PermitClerk
              captures: { pr1: $.data.id }
            - call: "POST /plan-reviews/${pr1}/approve"
              payload: {}
              as: PermitClerk
            - call: "POST /permits"
              payload: { establishment_id: "${e1}", plan_review_id: "${pr1}" }
              as: PermitClerk
            - call: "POST /inspections"
              payload: { establishment_id: "${e1}", inspector_id: "${i1}", inspection_type: "ROUTINE", scheduled_index: 0 }
              as: PermitClerk
              captures: { insp1: $.data.id, v_pre: $.data.version }
          trigger:
            - call: "POST /inspections/${insp1}/finalize"
              payload: { expected_inspection_version: "${v_pre}" }
              as: Inspector
              as_user_id: "${i1}"
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_INSPECTION_NOT_COMPLETED"
            - "Inspection.${insp1}.status == SCHEDULED"

      - name: sm_inspection_initial_state_scheduled
        claim_type: Initial State
        grounds:
          - "state_machines.Inspection"
          - "entities.Inspection.fields.status"
        distinguishing_aspect: "A newly created inspection starts in SCHEDULED."
        test_recipe:
          setup: ["Inspector i1; establishment e1 PERMITTED."]
          setup_api_calls:
            - call: "POST /inspectors"
              payload: { full_name: "Ivy One", badge_number: "B-001" }
              as: HealthDirector
              captures: { i1: $.data.id }
            - call: "POST /establishments"
              payload: { name: "Diner E1", address: "1 Main St", seating_capacity: 40 }
              as: PermitClerk
              captures: { e1: $.data.id }
            - call: "POST /plan-reviews"
              payload: { establishment_id: "${e1}", submitted_layout_sqft: 400, equipment_count: 5 }
              as: PermitClerk
              captures: { pr1: $.data.id }
            - call: "POST /plan-reviews/${pr1}/approve"
              payload: {}
              as: PermitClerk
            - call: "POST /permits"
              payload: { establishment_id: "${e1}", plan_review_id: "${pr1}" }
              as: PermitClerk
          trigger:
            - call: "POST /inspections"
              payload: { establishment_id: "${e1}", inspector_id: "${i1}", inspection_type: "ROUTINE", scheduled_index: 0 }
              as: PermitClerk
              captures: { st: $.data.status }
          assert:
            - "Inspection.status == SCHEDULED"

      - name: sm_complaint_dispatch_from_received_invalid
        claim_type: Invalid Transitions
        grounds:
          - "state_machines.Complaint.TRIAGED_to_DISPATCHED"
          - "errors[ERR_COMPLAINT_NOT_TRIAGED]"
        distinguishing_aspect: "Dispatching a RECEIVED (un-triaged) complaint -> ERR_COMPLAINT_NOT_TRIAGED (409)."
        test_recipe:
          setup: ["Inspector i1; establishment e1 PERMITTED; a RECEIVED complaint."]
          setup_api_calls:
            - call: "POST /inspectors"
              payload: { full_name: "Ivy One", badge_number: "B-001" }
              as: HealthDirector
              captures: { i1: $.data.id }
            - call: "POST /establishments"
              payload: { name: "Diner E1", address: "1 Main St", seating_capacity: 40 }
              as: PermitClerk
              captures: { e1: $.data.id }
            - call: "POST /plan-reviews"
              payload: { establishment_id: "${e1}", submitted_layout_sqft: 400, equipment_count: 5 }
              as: PermitClerk
              captures: { pr1: $.data.id }
            - call: "POST /plan-reviews/${pr1}/approve"
              payload: {}
              as: PermitClerk
            - call: "POST /permits"
              payload: { establishment_id: "${e1}", plan_review_id: "${pr1}" }
              as: PermitClerk
            - call: "POST /complaints"
              payload: { establishment_id: "${e1}", complaint_type: "SANITATION" }
              as: PermitClerk
              captures: { cm: $.data.id }
          trigger:
            - call: "POST /complaints/${cm}/dispatch"
              payload: { inspector_id: "${i1}" }
              as: Inspector
              as_user_id: "${i1}"
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_COMPLAINT_NOT_TRIAGED"
            - "Complaint.${cm}.status == RECEIVED"

      - name: sm_route_close_from_planned_invalid
        claim_type: Invalid Transitions
        grounds:
          - "state_machines.InspectionRoute.DISPATCHED_to_COMPLETED"
          - "errors[ERR_ROUTE_NOT_DISPATCHED]"
        distinguishing_aspect: "Closing a PLANNED (never dispatched) route -> ERR_ROUTE_NOT_DISPATCHED (409)."
        test_recipe:
          setup: ["Inspector i1; a PLANNED route."]
          setup_api_calls:
            - call: "POST /_clock/set_current_index"
              payload: { to_index: 5 }
              as: HealthDirector
            - call: "POST /inspectors"
              payload: { full_name: "Ivy One", badge_number: "B-001" }
              as: HealthDirector
              captures: { i1: $.data.id }
            - call: "POST /inspection-routes"
              payload: { inspector_id: "${i1}", route_date_index: 5 }
              as: PermitClerk
              captures: { rt: $.data.id }
          trigger:
            - call: "POST /inspection-routes/${rt}/close"
              payload: {}
              as: Inspector
              as_user_id: "${i1}"
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_ROUTE_NOT_DISPATCHED"
            - "InspectionRoute.${rt}.status == PLANNED"

      - name: sm_enforcement_close_from_opened_invalid
        claim_type: Invalid Transitions
        grounds:
          - "state_machines.EnforcementCase.HEARD_to_CLOSED"
          - "errors[ERR_CASE_NOT_HEARD]"
        distinguishing_aspect: "Closing an OPENED case via /close (which requires HEARD) -> ERR_CASE_NOT_HEARD (409); the settle path is the only OPENED->CLOSED route."
        test_recipe:
          setup: ["Establishment e1 PERMITTED; one OPENED enforcement case."]
          setup_api_calls:
            - call: "POST /establishments"
              payload: { name: "Diner E1", address: "1 Main St", seating_capacity: 40 }
              as: PermitClerk
              captures: { e1: $.data.id }
            - call: "POST /plan-reviews"
              payload: { establishment_id: "${e1}", submitted_layout_sqft: 400, equipment_count: 5 }
              as: PermitClerk
              captures: { pr1: $.data.id }
            - call: "POST /plan-reviews/${pr1}/approve"
              payload: {}
              as: PermitClerk
            - call: "POST /permits"
              payload: { establishment_id: "${e1}", plan_review_id: "${pr1}" }
              as: PermitClerk
            - call: "POST /enforcement-cases"
              payload: { establishment_id: "${e1}", alleged_penalty_cents: 10000 }
              as: EnforcementOfficer
              captures: { c1: $.data.id }
          trigger:
            - call: "POST /enforcement-cases/${c1}/close"
              payload: {}
              as: EnforcementOfficer
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_CASE_NOT_HEARD"
            - "EnforcementCase.${c1}.status == OPENED"

      - name: sm_enforcement_dismissed_ruling_vacates_closure_reinstates
        claim_type: Cross-entity
        grounds:
          - "state_machines.EnforcementCase.HEARING_SCHEDULED_to_HEARD"
          - "entities.ClosureOrder.fields.status"
          - "entities.Establishment.fields.status"
        distinguishing_aspect: "A DISMISSED ruling on a case contesting an ACTIVE closure VACATES that closure and reinstates the SUSPENDED establishment to PERMITTED."
        test_recipe:
          setup: ["Establishment e1 SUSPENDED by a manual closure co; an enforcement case contesting co, HEARING_SCHEDULED with hearing reached."]
          setup_api_calls:
            - call: "POST /_clock/set_current_index"
              payload: { to_index: 200 }
              as: HealthDirector
            - call: "POST /inspectors"
              payload: { full_name: "Ivy One", badge_number: "B-001" }
              as: HealthDirector
              captures: { i1: $.data.id }
            - call: "POST /establishments"
              payload: { name: "Diner E1", address: "1 Main St", seating_capacity: 40 }
              as: PermitClerk
              captures: { e1: $.data.id }
            - call: "POST /plan-reviews"
              payload: { establishment_id: "${e1}", submitted_layout_sqft: 400, equipment_count: 5 }
              as: PermitClerk
              captures: { pr1: $.data.id }
            - call: "POST /plan-reviews/${pr1}/approve"
              payload: {}
              as: PermitClerk
            - call: "POST /permits"
              payload: { establishment_id: "${e1}", plan_review_id: "${pr1}" }
              as: PermitClerk
            - call: "POST /inspections"
              payload: { establishment_id: "${e1}", inspector_id: "${i1}", inspection_type: "ROUTINE", scheduled_index: 200 }
              as: PermitClerk
              captures: { insp1: $.data.id }
            - call: "POST /inspections/${insp1}/start"
              payload: {}
              as: Inspector
              as_user_id: "${i1}"
            - call: "POST /inspections/${insp1}/complete"
              payload: {}
              as: Inspector
              as_user_id: "${i1}"
              captures: { v_pre: $.data.version }
            - call: "POST /inspections/${insp1}/finalize"
              payload: { expected_inspection_version: "${v_pre}" }
              as: Inspector
              as_user_id: "${i1}"
            - call: "POST /closure-orders"
              payload: { establishment_id: "${e1}", triggering_inspection_id: "${insp1}", reason_code: "IMMINENT_HEALTH_HAZARD" }
              as: EnforcementOfficer
              captures: { co: $.data.id }
            - call: "POST /enforcement-cases"
              payload: { establishment_id: "${e1}", alleged_penalty_cents: 30000, closure_order_id: "${co}" }
              as: EnforcementOfficer
              captures: { c1: $.data.id }
            - call: "POST /enforcement-cases/${c1}/schedule-hearing"
              payload: { hearing_index: 205 }
              as: EnforcementOfficer
            - call: "POST /_clock/set_current_index"
              payload: { to_index: 205 }
              as: HealthDirector
          trigger:
            - call: "POST /enforcement-cases/${c1}/rule"
              payload: { ruling: "DISMISSED" }
              as: HealthDirector
              captures: { amt: $.data.assessed_penalty_cents }
          assert:
            - "EnforcementCase.${c1}.assessed_penalty_cents == 0"
            - "ClosureOrder.${co}.status == VACATED"
            - "Establishment.${e1}.status == PERMITTED"

  # ===========================================================================
  - section: calculations
    instances:
      - name: calc_complaint_severity_foodborne_urgent
        claim_type: Correct Result
        grounds:
          - "calculations.complaint_severity"
          - "entities.Complaint.fields.severity_score"
          - "entities.Complaint.fields.priority"
        distinguishing_aspect: "Triage of a FOODBORNE_ILLNESS complaint with reported_ill_count 5 on a CATEGORY_3 establishment yields severity_score 40+20+10=70 -> priority URGENT."
        test_recipe:
          setup: ["Establishment e1 CATEGORY_3 (seating 60 + raw + onsite), PERMITTED; a RECEIVED FOODBORNE_ILLNESS complaint with reported_ill_count 5."]
          setup_api_calls:
            - call: "POST /establishments"
              payload: { name: "Smokehouse", address: "9 Pit Rd", seating_capacity: 60, serves_raw_animal_foods: true, does_onsite_processing: true }
              as: PermitClerk
              captures: { e1: $.data.id }
            - call: "POST /plan-reviews"
              payload: { establishment_id: "${e1}", submitted_layout_sqft: 400, equipment_count: 5 }
              as: PermitClerk
              captures: { pr1: $.data.id }
            - call: "POST /plan-reviews/${pr1}/approve"
              payload: {}
              as: PermitClerk
            - call: "POST /permits"
              payload: { establishment_id: "${e1}", plan_review_id: "${pr1}" }
              as: PermitClerk
            - call: "POST /complaints"
              payload: { establishment_id: "${e1}", complaint_type: "FOODBORNE_ILLNESS", reported_ill_count: 5 }
              as: PermitClerk
              captures: { cm: $.data.id }
          trigger:
            - call: "POST /complaints/${cm}/triage"
              payload: {}
              as: PermitClerk
              captures: { sev: $.data.severity_score, pri: $.data.priority }
          assert:
            - "Complaint.${cm}.severity_score == 70"
            - "Complaint.${cm}.priority == URGENT"

      - name: calc_complaint_severity_ill_count_capped_at_ten
        claim_type: Constants Applied
        grounds:
          - "calculations.complaint_severity"
        distinguishing_aspect: "reported_ill_count 12 is capped at ILL_CAP 10: OTHER complaint on CATEGORY_1 yields 5 + 10*4 + 0 = 45 -> PRIORITY (the 11th/12th ill report add nothing)."
        test_recipe:
          setup: ["Establishment e1 CATEGORY_1 PERMITTED; a RECEIVED OTHER complaint with reported_ill_count 12."]
          setup_api_calls:
            - call: "POST /establishments"
              payload: { name: "Diner E1", address: "1 Main St", seating_capacity: 40 }
              as: PermitClerk
              captures: { e1: $.data.id }
            - call: "POST /plan-reviews"
              payload: { establishment_id: "${e1}", submitted_layout_sqft: 400, equipment_count: 5 }
              as: PermitClerk
              captures: { pr1: $.data.id }
            - call: "POST /plan-reviews/${pr1}/approve"
              payload: {}
              as: PermitClerk
            - call: "POST /permits"
              payload: { establishment_id: "${e1}", plan_review_id: "${pr1}" }
