              as: OutsourceCoordinator
              as_user_id: "u-oc-01"
              captures: { pkg_a_id: "$.data.id" }
            - call: "POST /studio/outsource-packages/${pkg_a_id}/issue"
              payload: {}
              as: OutsourceCoordinator
