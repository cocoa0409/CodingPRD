            - call: "POST /complaints/${cmp_id}/triage"
              payload: { priority_note: "Proceeding despite the evidence gap" }
              as: ComplaintAnalyst
            - call: "POST /complaints/${cmp_id}/investigate"
              payload: {}
              as: ComplaintAnalyst
            - call: "POST /complaints/${cmp_id}/resolve"
