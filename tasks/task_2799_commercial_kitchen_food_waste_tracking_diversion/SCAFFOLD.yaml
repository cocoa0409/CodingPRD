scenario: |
  2799. Commercial Kitchen Food Waste Tracking & Diversion (Leanpath): tracking station capture with
  weight, food type and loss reason, baseline period establishment and reduction target setting per site,
  pre-consumer versus post-consumer segmentation, cost-of-waste valuation using recipe and ingredient
  costs, coaching alerts to kitchen staff and shift-level leaderboards, diversion routing to donation,
  animal feed or composting with hauler tickets, corporate rollup for sustainability reporting and goal
  tracking, data quality checks for missed or duplicated entries
domain_name: commercial-kitchen-food-waste-diversion
api_prefix: "/"

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

complexity_profile:
  difficulty_level: expert_plus
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - derived_field_reconciliation

  entity_topology: flat
  entity_topology_note: |
    All 15 entities are peer collections addressed at the top level (`/waste-entries`, `/shifts`,
    `/consignment-lines`, ...). Parentage is expressed only by FK fields carried in request bodies and
    by filtered-list GETs; no entity is nested inside another entity's URL path. Reverse navigation is
    always the filtered-list form (`GET /<children>?<fk_field>=...` returning `<Child>[]`).

  state_machine_shape: cyclic
  state_machine_shape_note: |
    Three machines are non-linear: WasteEntry cycles RECORDED -> FLAGGED -> RECORDED and re-enters
    RECORDED from SUPERSEDED when a correcting entry is voided; BaselinePeriod cycles
    OPEN -> SUBMITTED -> OPEN on rejection; DiversionConsignment carries two independent state
    dimensions on the same row (logistics_status x settlement_status) whose settlement axis itself
    cycles TICKET_SUBMITTED -> DISPUTED -> TICKET_SUBMITTED.

  relationship_patterns:
    - one_to_many          # Site -> Shift / TrackingStation / BaselinePeriod / DiversionConsignment
    - many_to_many         # WasteEntry <-> DiversionConsignment via ConsignmentLine (partial weight allocation)
    - self_referential     # WasteEntry.corrects_entry_id -> WasteEntry.id (correction chain)
    - cross_aggregate      # ReductionTarget reads Site aggregates; CorporateRollup reads many Sites

  role_model: segregation_of_duties
  role_model_note: |
    Two duty separations are enforced on X-User-ID, never on role alone: (1) a ShiftLead may not void a
    WasteEntry whose captured_by_user_id equals their own X-User-ID; (2) a CorporateSustainabilityLead
    may not publish a CorporateRollup whose prepared_by_user_id equals their own X-User-ID.

  consistency_model: immediate

# ---------------------------------------------------------------------------
# 1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:
  - name: Site
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: name
        type: string
        source: input
        description: Human-readable kitchen site name.
      - name: site_code
        type: string
        source: input
        description: Operator-assigned short code.
        constraints: "unique across all Sites; 2-12 chars"
      - name: region_code
        type: string
        source: input
        description: Corporate reporting region the site rolls up into.
      - name: target_intensity_kg_per_1k_meals
        type: number
        source: input
        description: Site's own operating intensity goal used by the shift leaderboard penalty term.
        default: 10.000
        constraints: "> 0; 3 decimal places"
      - name: total_captured_weight_grams
        type: integer
        source: computed
        description: "Sum of WasteEntry.weight_grams for entries at this site with status IN {RECORDED, FLAGGED} (calculations.site_waste_aggregates)."
        default: 0
      - name: valued_waste_cost_cents
        type: integer
        source: computed
        description: "Sum of WasteEntry.effective_cost_cents for entries at this site with status IN {RECORDED, FLAGGED} (calculations.site_waste_aggregates); conserved quantity of compensating_invariant/cost_ledger_conservation."
        default: 0
      - name: diverted_weight_grams_settled
        type: integer
        source: computed
        description: "Sum of ConsignmentLine.allocated_weight_grams over lines whose DiversionConsignment has settlement_status == SETTLED and logistics_status != CANCELLED (calculations.site_waste_aggregates)."
        default: 0
      - name: diversion_rate_pct
        type: number
        source: computed
        description: "diverted_weight_grams_settled / total_captured_weight_grams * 100, round_half_up 2dp; null when total_captured_weight_grams == 0."
      - name: open_alert_count
        type: integer
        source: computed
        description: "Count of CoachingAlert rows for this site with status IN {OPEN, ACKNOWLEDGED}."
        default: 0
      - name: coaching_posture
        type: enum
        source: computed
        description: "Derived gate: MONITORING when open_alert_count == 0; ESCALATED when open_alert_count >= 3; INTERVENTION otherwise. ESCALATED blocks DONATION dispatch."
        default: MONITORING
        constraints: "MONITORING | INTERVENTION | ESCALATED"

  - name: TrackingStation
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: site_id
        type: string
        source: input
        description: "FK -> Site.id; the site this scale/terminal is installed at."
      - name: station_code
        type: string
        source: input
        description: Station label printed on the terminal.
        constraints: "unique per (site_id, station_code)"
      - name: station_kind
        type: enum
        source: input
        description: Physical placement of the station; drives pre/post-consumer stream derivation.
        constraints: "PREP | HOT_LINE | DISH_RETURN"
      - name: tare_grams
        type: integer
        source: input
        description: Container tare subtracted by the scale firmware before a capture is posted.
        default: 0
        constraints: ">= 0"
      - name: capture_lock_seconds
        type: integer
        source: input
        description: Length of the station occupation interval a capture creates, in seconds.
        default: 30
        constraints: ">= 0 and <= 600"
      - name: calibration_due_at
        type: datetime
        source: input
        description: Instant at which the scale calibration lapses; captures are refused once the clock reaches it.
      - name: status
        type: enum
        source: input
        description: Station availability; only ACTIVE stations accept captures.
        default: ACTIVE
        constraints: "ACTIVE | MAINTENANCE | RETIRED"

  - name: FoodType
    parent: null
    common_fields: true
    entity_kind: configuration
    fields:
      - name: name
        type: string
        source: input
        description: Catalog food type name.
        constraints: "unique across all FoodTypes"
      - name: category
        type: enum
        source: input
        description: Reporting category.
        constraints: "PRODUCE | PROTEIN | PREPARED | BAKERY | DAIRY"
      - name: default_cost_per_kg_cents
        type: integer
        source: input
        description: Catalog valuation basis in whole cents per kilogram; used by the CATALOG variant of waste valuation.
        constraints: "> 0"
      - name: donation_eligible
        type: boolean
        source: input
        description: Whether this food type may be routed to the DONATION channel.
      - name: animal_feed_eligible
        type: boolean
        source: input
        description: Whether this food type may be routed to the ANIMAL_FEED channel.
      - name: compostable
        type: boolean
        source: input
        description: Whether this food type may be routed to the COMPOST channel.
      - name: donation_shelf_life_hours
        type: integer
        source: input
        description: Hours after capture during which a donation pickup may still legally collect this food type.
        default: 0
        constraints: ">= 0"

  - name: Recipe
    parent: null
    common_fields: true
    entity_kind: configuration
    fields:
      - name: recipe_code
        type: string
        source: input
        description: Kitchen recipe code.
        constraints: "unique across all Recipes"
      - name: name
        type: string
        source: input
        description: Recipe name.
      - name: ingredients
        type: array
        source: input
        description: "Ordered ingredient cost lines; each element is an object { ingredient_name: string, quantity_kg: number, unit_cost_cents_per_kg: integer, trim_loss_pct: number }. Array order is the pinned evaluation order of calculations.recipe_cost_per_kg."
        constraints: "length >= 1; quantity_kg > 0; unit_cost_cents_per_kg > 0; 0 <= trim_loss_pct < 1"
      - name: status
        type: enum
        source: system
        description: Only PUBLISHED recipes may be referenced by a capture; always starts DRAFT and is advanced only by the publish transition.
        default: DRAFT
        constraints: "DRAFT | PUBLISHED"
      - name: total_ingredient_cost_cents
        type: integer
        source: computed
        description: "Sum of per-line rounded ingredient costs (calculations.recipe_cost_per_kg step 2)."
      - name: usable_yield_kg
        type: number
        source: computed
        description: "Sum of per-line usable kilograms, round_half_up to 3 decimals (calculations.recipe_cost_per_kg step 3)."
      - name: cost_per_kg_cents
        type: integer
        source: computed
        description: "total_ingredient_cost_cents / usable_yield_kg, round_half_up to whole cents (calculations.recipe_cost_per_kg step 4)."
      - name: published_cost_per_kg_cents
        type: integer
        source: system
        description: "cost_per_kg_cents frozen at the moment of publish; null while status == DRAFT. This is the value a WasteEntry pins at capture."
      - name: published_at
        type: datetime
        source: system
        description: Logical-clock instant of the publish transition; null while DRAFT.

  - name: Shift
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: site_id
        type: string
        source: input
        description: "FK -> Site.id; the site running this shift."
      - name: shift_date
        type: string
        source: input
        description: Calendar date of the shift in YYYY-MM-DD (site local date, no offset arithmetic).
        constraints: "ISO date"
      - name: shift_code
        type: enum
        source: input
        description: Which daily service period this row represents.
        constraints: "AM | PM | NIGHT"
      - name: meals_served
        type: integer
        source: input
        description: Covers served during the shift; denominator of every intensity metric.
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: OPEN accepts captures; CLOSED finalizes valuations and the leaderboard score. Always starts OPEN; advanced only by the close transition.
        default: OPEN
        constraints: "OPEN | CLOSED"
      - name: shift_waste_grams
        type: integer
        source: computed
        description: "Sum of WasteEntry.weight_grams for entries on this shift with status IN {RECORDED, FLAGGED} (calculations.shift_waste_intensity)."
        default: 0
      - name: waste_intensity_kg_per_1k_meals
        type: number
        source: computed
        description: "shift_waste_grams / meals_served, round_half_up 3dp; null when meals_served == 0 (calculations.shift_waste_intensity)."
      - name: capture_compliance_pct
        type: number
        source: computed
        description: "Fraction of the site's ACTIVE TrackingStations that recorded at least one non-VOIDED entry on this shift, round_half_up 4dp; 1.0000 when the site has zero ACTIVE stations."
      - name: pre_consumer_share_pct
        type: number
        source: computed
        description: "PRE_CONSUMER grams / shift_waste_grams over entries with status IN {RECORDED, FLAGGED}, round_half_up 4dp; null when shift_waste_grams == 0."
      - name: leaderboard_score
        type: number
        source: computed
        description: "calculations.shift_leaderboard_score result, 1dp; null while status == OPEN."
      - name: closed_at
        type: datetime
        source: system
        description: Logical-clock instant of the close transition; null while OPEN.

  - name: WasteEntry
    parent: null
    common_fields: true
    entity_kind: event
    fields:
      - name: site_id
        type: string
        source: computed
        description: "FK -> Site.id; copied from TrackingStation.site_id at capture and never changed afterwards."
      - name: station_id
        type: string
        source: input
        description: "FK -> TrackingStation.id; the station that weighed this loss."
      - name: shift_id
        type: string
        source: input
        description: "FK -> Shift.id; the service period this loss is booked to."
      - name: food_type_id
        type: string
        source: input
        description: "FK -> FoodType.id; catalog food type of the discarded item."
      - name: recipe_id
        type: string
        source: input
        description: "FK -> Recipe.id; optional recipe attribution used by the RECIPE valuation variant. Null means catalog-only valuation."
      - name: corrects_entry_id
        type: string
        source: system
        description: "FK -> WasteEntry.id; set on a correcting entry to point at the entry it superseded. Null on originally captured entries."
      - name: weight_grams
        type: integer
        source: input
        description: Net weight of the discarded food in grams.
        constraints: "> 0 and <= 200000"
      - name: loss_reason
        type: enum
        source: input
        description: Why the food was lost.
        constraints: "OVERPRODUCTION | SPOILAGE | TRIM | EXPIRATION | PLATE_WASTE | CONTAMINATION"
      - name: stream
        type: enum
        source: computed
        description: "POST_CONSUMER when station_kind == DISH_RETURN or loss_reason == PLATE_WASTE; PRE_CONSUMER otherwise (calculations.entry_stream_segmentation)."
        constraints: "PRE_CONSUMER | POST_CONSUMER"
      - name: captured_at
        type: datetime
        source: input
        description: Instant the weight was taken; defaults to the current logical clock when omitted.
      - name: capture_window_end
        type: datetime
        source: computed
        description: "captured_at + TrackingStation.capture_lock_seconds; upper bound of the station occupation interval."
      - name: captured_by_user_id
        type: string
        source: system
        description: X-User-ID of the capturing operator; the segregation-of-duties comparison target for void.
      - name: status
        type: enum
        source: system
        description: Lifecycle of the capture record.
        default: RECORDED
        constraints: "RECORDED | FLAGGED | VOIDED | SUPERSEDED"
      - name: flag_reason
        type: string
        source: input
        description: Reason recorded by the flag transition; null until first flagged, retained after clear-flag.
      - name: void_reason
        type: string
        source: input
        description: Reason recorded by the void transition; null unless VOIDED.
      - name: correction_note
        type: string
        source: input
        description: Note recorded on a correcting entry; null on originally captured entries.
      - name: catalog_cost_basis_cents
        type: integer
        source: system
        description: FoodType.default_cost_per_kg_cents snapshotted at capture; immune to later catalog edits.
      - name: recipe_cost_basis_cents
        type: integer
        source: system
        description: Recipe.published_cost_per_kg_cents snapshotted at capture; null when recipe_id is null.
      - name: provisional_cost_cents
        type: integer
        source: computed
        description: "CATALOG-variant valuation set at capture (calculations.waste_entry_valuation)."
      - name: final_cost_cents
        type: integer
        source: computed
        description: "RECIPE-variant (or catalog fallback) valuation written when the owning Shift closes; null while the shift is OPEN."
      - name: effective_cost_cents
        type: integer
        source: computed
        description: "final_cost_cents when non-null, else provisional_cost_cents; the value summed into Site.valued_waste_cost_cents."
      - name: valuation_delta_cents
        type: integer
        source: computed
        description: "final_cost_cents - provisional_cost_cents; null while final_cost_cents is null."
      - name: routed_weight_grams
        type: integer
        source: computed
        description: "Sum of ConsignmentLine.allocated_weight_grams over lines of this entry whose DiversionConsignment.logistics_status != CANCELLED."
        default: 0
      - name: unrouted_weight_grams
        type: integer
        source: computed
        description: "weight_grams - routed_weight_grams; conserved quantity of compensating_invariant/routed_weight_conservation."
      - name: note
        type: string
        source: input
        description: Free-text operator note.

  - name: BaselinePeriod
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: site_id
        type: string
        source: input
        description: "FK -> Site.id; the site whose baseline this period establishes."
      - name: start_date
        type: string
        source: input
        description: First calendar date included in the baseline window (inclusive), YYYY-MM-DD.
      - name: end_date
        type: string
        source: input
        description: Last calendar date included in the baseline window (inclusive), YYYY-MM-DD.
        constraints: ">= start_date"
      - name: status
        type: enum
        source: system
        description: OPEN accepts resubmission; SUBMITTED awaits corporate review; CERTIFIED is the only status a ReductionTarget may bind to.
        default: OPEN
        constraints: "OPEN | SUBMITTED | CERTIFIED"
      - name: rejection_note
        type: string
        source: input
        description: Reviewer note stored by the reject transition; retained after the period cycles back to OPEN.
      - name: rejection_count
        type: integer
        source: computed
        description: Number of times this period has been rejected back to OPEN; increments on every reject.
        default: 0
      - name: submitted_at
        type: datetime
        source: system
        description: Logical-clock instant of the most recent submit transition.
      - name: certified_at
        type: datetime
        source: system
        description: Logical-clock instant of certification; null unless CERTIFIED.
      - name: baseline_entry_count
        type: integer
        source: computed
        description: "Count of WasteEntry rows with status IN {RECORDED, FLAGGED} whose captured_at date falls in [start_date, end_date] at this site, frozen at submit."
      - name: baseline_waste_grams
        type: integer
        source: computed
        description: Sum of weight_grams over that same entry set, frozen at submit.
      - name: baseline_waste_kg
        type: number
        source: computed
        description: "baseline_waste_grams / 1000, round_half_up 3dp."
      - name: baseline_meals_served
        type: integer
        source: computed
        description: "Sum of Shift.meals_served over CLOSED shifts of this site whose shift_date falls in [start_date, end_date], frozen at submit."
      - name: baseline_intensity_kg_per_1k_meals
        type: number
        source: computed
        description: "baseline_waste_grams / baseline_meals_served, round_half_up 3dp; null when baseline_meals_served == 0."
      - name: baseline_cost_cents
        type: integer
        source: computed
        description: Sum of effective_cost_cents over that same entry set, frozen at submit.

  - name: ReductionTarget
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: site_id
        type: string
        source: input
        description: "FK -> Site.id; the site the target applies to."
      - name: baseline_period_id
        type: string
        source: input
        description: "FK -> BaselinePeriod.id; the certified baseline the reduction is measured against."
      - name: basis
        type: enum
        source: input
        description: Which of the two reduction algorithms decides attainment for this target.
        constraints: "ABSOLUTE | INTENSITY"
      - name: target_reduction_pct
        type: number
        source: input
        description: Required reduction percentage against the baseline, 2dp.
        constraints: "> 0 and <= 100"
      - name: min_diversion_rate_pct
        type: number
        source: input
        description: Diversion-rate floor that must also be met for attainment, 2dp.
        default: 0.00
        constraints: ">= 0 and <= 100"
      - name: window_start
        type: string
        source: input
        description: First calendar date of the performance window (inclusive), YYYY-MM-DD.
      - name: window_end
        type: string
        source: input
        description: Last calendar date of the performance window (inclusive), YYYY-MM-DD.
        constraints: ">= window_start; window_start > BaselinePeriod.end_date"
      - name: status
        type: enum
        source: system
        description: PROPOSED before activation; ACTIVE while measured; ACHIEVED/MISSED after the window closes; SUPERSEDED when replaced by a newer target on the same site and window.
        default: PROPOSED
        constraints: "PROPOSED | ACTIVE | ACHIEVED | MISSED | SUPERSEDED"
      - name: performance_waste_grams
        type: integer
        source: computed
        description: "Sum of weight_grams over WasteEntry rows with status IN {RECORDED, FLAGGED} whose captured_at date falls in [window_start, window_end] at this site."
        default: 0
      - name: performance_meals_served
        type: integer
        source: computed
        description: "Sum of Shift.meals_served over CLOSED shifts of this site whose shift_date falls in [window_start, window_end]."
        default: 0
      - name: performance_intensity_kg_per_1k_meals
        type: number
        source: computed
        description: "performance_waste_grams / performance_meals_served, round_half_up 3dp; null when performance_meals_served == 0."
      - name: absolute_reduction_pct
        type: number
        source: computed
        description: "ABSOLUTE-variant reduction percentage (calculations.reduction_attainment), 2dp."
      - name: intensity_reduction_pct
        type: number
        source: computed
        description: "INTENSITY-variant reduction percentage (calculations.reduction_attainment), 2dp; null when either intensity is null."
      - name: effective_reduction_pct
        type: number
        source: computed
        description: "absolute_reduction_pct when basis == ABSOLUTE, intensity_reduction_pct when basis == INTENSITY."
      - name: attainment_state
        type: enum
        source: computed
        description: "ACHIEVED_PENDING when effective_reduction_pct >= target_reduction_pct AND Site.diversion_rate_pct (null treated as 0.00) >= min_diversion_rate_pct; BEHIND otherwise."
        default: BEHIND
        constraints: "BEHIND | ACHIEVED_PENDING"
      - name: activated_at
        type: datetime
        source: system
        description: Logical-clock instant of activation; null while PROPOSED.
      - name: resolved_at
        type: datetime
        source: system
        description: Logical-clock instant the target reached ACHIEVED, MISSED or SUPERSEDED.

  - name: Hauler
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: name
        type: string
        source: input
        description: Hauler / recipient organisation name.
        constraints: "unique across all Haulers"
      - name: channels
        type: array
        source: input
        description: "Channels this hauler is contracted for; array of DONATION | ANIMAL_FEED | COMPOST | LANDFILL."
        constraints: "length >= 1; no duplicates"
      - name: rate_cents_per_tonne
        type: integer
        source: input
        description: Contracted haul rate in whole cents per metric tonne.
        constraints: "> 0"
      - name: stop_fee_cents
        type: integer
        source: input
        description: Flat per-stop fee added to every ticket's base fee.
        constraints: ">= 0"
      - name: capacity_kg_per_pickup
        type: number
        source: input
        description: Maximum staged kilograms this hauler will accept on one pickup.
        constraints: "> 0"
      - name: max_concurrent_pickups
        type: integer
        source: input
        description: How many of this hauler's non-terminal consignments may hold overlapping pickup windows.
        default: 1
        constraints: ">= 1"
      - name: status
        type: enum
        source: system
        description: PENDING haulers may hold DRAFT/STAGED consignments but may not receive a dispatch.
        default: PENDING
        constraints: "PENDING | APPROVED"

  - name: DiversionConsignment
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: site_id
        type: string
        source: input
        description: "FK -> Site.id; the site the material leaves from."
      - name: hauler_id
        type: string
        source: input
        description: "FK -> Hauler.id; the hauler/recipient collecting the material."
      - name: channel
        type: enum
        source: input
        description: Diversion destination for every line on this consignment.
        constraints: "DONATION | ANIMAL_FEED | COMPOST | LANDFILL"
      - name: pickup_window_start
        type: datetime
        source: input
        description: Inclusive start of the reserved pickup interval on the hauler.
      - name: pickup_window_end
        type: datetime
        source: input
        description: Exclusive end of the reserved pickup interval on the hauler.
        constraints: "> pickup_window_start"
      - name: container_tare_grams
        type: integer
        source: input
        description: Tare of the transport container, subtracted from the hauler ticket's gross weight.
        default: 0
        constraints: ">= 0"
      - name: logistics_status
        type: enum
        source: system
        description: Physical-movement state dimension; evolves independently of settlement_status.
        default: DRAFT
        constraints: "DRAFT | STAGED | DISPATCHED | COMPLETED | CANCELLED"
      - name: settlement_status
        type: enum
        source: system
        description: Billing state dimension on the same row; cycles TICKET_SUBMITTED -> DISPUTED -> TICKET_SUBMITTED.
        default: UNBILLED
        constraints: "UNBILLED | TICKET_SUBMITTED | SETTLED | DISPUTED"
      - name: staged_weight_grams
        type: integer
        source: computed
        description: Sum of allocated_weight_grams over this consignment's ConsignmentLine rows.
        default: 0
      - name: line_count
        type: integer
        source: computed
        description: Number of ConsignmentLine rows currently attached.
        default: 0
      - name: cancel_reason
        type: string
        source: input
        description: Reason recorded by the cancel transition; null unless CANCELLED.
      - name: staged_at
        type: datetime
        source: system
        description: Logical-clock instant of the stage transition.
      - name: dispatched_at
        type: datetime
        source: system
        description: Logical-clock instant of the dispatch transition.

  - name: ConsignmentLine
    parent: null
    common_fields: false
    entity_kind: event
    fields:
      - name: consignment_id
        type: string
        source: input
        description: "FK -> DiversionConsignment.id; the consignment this allocation belongs to."
      - name: waste_entry_id
        type: string
        source: input
        description: "FK -> WasteEntry.id; the captured loss whose weight is being routed."
      - name: allocated_weight_grams
        type: integer
        source: input
        description: Grams of the entry routed onto this consignment; may be a partial allocation.
        constraints: "> 0"
      - name: created_by_user_id
        type: string
        source: system
        description: X-User-ID that created the allocation.

  - name: HaulerTicket
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: consignment_id
        type: string
        source: input
        description: "FK -> DiversionConsignment.id; the consignment this weigh ticket settles."
      - name: hauler_id
        type: string
        source: input
        description: "FK -> Hauler.id; the hauler whose ticket book the weigh ticket was torn from, as asserted by the operator; scopes ticket_number uniqueness."
        constraints: "optional; defaults to DiversionConsignment.hauler_id of the referenced consignment when omitted; when supplied it MUST equal that value (validations[priority=80], ERR_TICKET_HAULER_MISMATCH)"
      - name: ticket_number
        type: string
        source: input
        description: Hauler's own ticket number.
        constraints: "unique per (hauler_id, ticket_number)"
      - name: gross_weight_grams
        type: integer
        source: input
        description: Gross weight recorded at the hauler's scale, container included.
        constraints: "> 0"
      - name: ticket_date
        type: string
        source: input
        description: Calendar date printed on the ticket, YYYY-MM-DD.
      - name: status
        type: enum
        source: system
        description: Ticket review state.
        default: SUBMITTED
        constraints: "SUBMITTED | ACCEPTED | DISPUTED"
      - name: net_weight_grams
        type: integer
        source: computed
        description: "gross_weight_grams - DiversionConsignment.container_tare_grams (calculations.hauler_ticket_settlement step 1)."
      - name: billable_tonnes
        type: number
        source: computed
        description: "net_weight_grams / 1000000, round_half_up 4dp (step 2)."
      - name: base_haul_fee_cents
        type: integer
        source: computed
        description: "round_half_up(billable_tonnes * Hauler.rate_cents_per_tonne) + Hauler.stop_fee_cents (step 3)."
      - name: fuel_surcharge_pct
        type: number
        source: computed
        description: "Surcharge tier rate selected from base_haul_fee_cents alone, never from any total that already contains the surcharge (step 4)."
      - name: fuel_surcharge_cents
        type: integer
        source: computed
        description: "round_half_up(base_haul_fee_cents * fuel_surcharge_pct) (step 4)."
      - name: settlement_subtotal_cents
        type: integer
        source: computed
        description: "base_haul_fee_cents + fuel_surcharge_cents (step 5)."
      - name: variance_pct
        type: number
        source: computed
        description: "abs(net_weight_grams - DiversionConsignment.staged_weight_grams) / staged_weight_grams * 100, round_half_up 2dp (step 6)."
      - name: variance_credit_cents
        type: integer
        source: computed
        description: "10% of settlement_subtotal_cents when variance_pct > VARIANCE_TOLERANCE_PCT, else 0 (step 6)."
      - name: settlement_total_cents
        type: integer
        source: computed
        description: "settlement_subtotal_cents - variance_credit_cents (step 7)."
      - name: dispute_note
        type: string
        source: input
        description: Reason recorded by the dispute transition; null unless DISPUTED.
      - name: accepted_at
        type: datetime
        source: system
        description: Logical-clock instant of acceptance; null unless ACCEPTED.

  - name: CoachingAlert
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: site_id
        type: string
        source: computed
        description: "FK -> Site.id; copied from the triggering shift."
      - name: shift_id
        type: string
        source: computed
        description: "FK -> Shift.id; the shift whose metric breached."
      - name: waste_entry_id
        type: string
        source: computed
        description: "FK -> WasteEntry.id; the capture whose posting produced the breach."
      - name: alert_type
        type: enum
        source: computed
        description: Which coaching rule fired.
        constraints: "INTENSITY_BREACH | OVERPRODUCTION_SPIKE"
      - name: severity
        type: enum
        source: computed
        description: "HIGH when observed_intensity >= 18.000 for INTENSITY_BREACH, else MEDIUM; always MEDIUM for OVERPRODUCTION_SPIKE."
        constraints: "MEDIUM | HIGH"
      - name: status
        type: enum
        source: system
        description: Alert lifecycle; OPEN and ACKNOWLEDGED both count toward Site.open_alert_count.
        default: OPEN
        constraints: "OPEN | ACKNOWLEDGED | RESOLVED | AUTO_RESOLVED | EXPIRED"
      - name: observed_intensity
        type: number
        source: computed
        description: "Shift.waste_intensity_kg_per_1k_meals at the instant the alert was raised, 3dp; null for OVERPRODUCTION_SPIKE."
      - name: message
        type: string
        source: computed
        description: Coaching text shown at the station terminal.
      - name: acknowledged_by_user_id
        type: string
        source: system
        description: X-User-ID that acknowledged the alert; null until ACKNOWLEDGED.
      - name: resolved_by_user_id
        type: string
        source: system
        description: X-User-ID that resolved the alert; null unless RESOLVED.
      - name: resolution_note
        type: string
        source: input
        description: Note recorded by the resolve transition; null unless RESOLVED.
      - name: resolved_at
        type: datetime
        source: system
        description: Logical-clock instant the alert left {OPEN, ACKNOWLEDGED}.

  - name: DataQualityFinding
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: site_id
        type: string
        source: computed
        description: "FK -> Site.id; the scanned site."
      - name: waste_entry_id
        type: string
        source: computed
        description: "FK -> WasteEntry.id; the offending entry for DUPLICATE_ENTRY and WEIGHT_OUTLIER; null for MISSED_CAPTURE."
      - name: station_id
        type: string
        source: computed
        description: "FK -> TrackingStation.id; the station the finding is about."
      - name: shift_id
        type: string
        source: computed
        description: "FK -> Shift.id; the shift the finding is about."
      - name: finding_type
        type: enum
        source: computed
        description: Which data-quality rule produced the finding.
        constraints: "MISSED_CAPTURE | DUPLICATE_ENTRY | WEIGHT_OUTLIER"
      - name: status
        type: enum
        source: system
        description: OPEN findings block corporate rollup publication.
        default: OPEN
        constraints: "OPEN | CONFIRMED | DISMISSED"
      - name: detail
        type: string
        source: computed
        description: Human-readable explanation of the detection.
      - name: detected_at
        type: datetime
        source: system
        description: Logical-clock instant of the scan that produced the finding.
      - name: resolved_by_user_id
        type: string
        source: system
        description: X-User-ID that confirmed or dismissed the finding; null while OPEN.

  - name: CorporateRollup
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: period_start
        type: string
        source: input
        description: First calendar date of the reporting period (inclusive), YYYY-MM-DD.
      - name: period_end
        type: string
        source: input
        description: Last calendar date of the reporting period (inclusive), YYYY-MM-DD.
        constraints: ">= period_start"
      - name: site_ids
        type: array
        source: input
        description: "Explicit in-scope Site.id values (array of Site ids, not a single foreign key). Order is irrelevant; duplicates rejected."
        constraints: "length >= 1; every element must be an existing Site.id; no duplicates"
      - name: status
        type: enum
        source: system
        description: DRAFT recomputes on read-time refresh triggers; PUBLISHED is frozen.
        default: DRAFT
        constraints: "DRAFT | PUBLISHED"
      - name: prepared_by_user_id
        type: string
        source: system
        description: X-User-ID that created the rollup; the segregation-of-duties comparison target for publish.
      - name: published_by_user_id
        type: string
        source: system
        description: X-User-ID that published the rollup; null while DRAFT.
      - name: published_at
        type: datetime
        source: system
        description: Logical-clock instant of publication; null while DRAFT.
      - name: in_scope_site_count
        type: integer
        source: computed
        description: Length of site_ids.
      - name: total_captured_weight_grams
        type: integer
        source: computed
        description: "Sum of WasteEntry.weight_grams over in-scope sites, status IN {RECORDED, FLAGGED}, captured_at date in [period_start, period_end]."
        default: 0
      - name: total_valued_cost_cents
        type: integer
        source: computed
        description: Sum of effective_cost_cents over that same entry set.
        default: 0
      - name: total_diverted_weight_grams
        type: integer
        source: computed
        description: "Sum of ConsignmentLine.allocated_weight_grams over in-scope sites whose consignment has settlement_status == SETTLED and pickup_window_start date in [period_start, period_end]."
        default: 0
      - name: diversion_rate_pct
        type: number
        source: computed
        description: "total_diverted_weight_grams / total_captured_weight_grams * 100, round_half_up 2dp; null when the denominator is 0."
      - name: sites_on_track_count
        type: integer
        source: computed
        description: "Count of in-scope sites holding at least one ReductionTarget with status == ACTIVE and attainment_state == ACHIEVED_PENDING."
        default: 0
      - name: goal_attainment_state
        type: enum
        source: computed
        description: "ALL_ON_TRACK when sites_on_track_count == in_scope_site_count; NONE_ON_TRACK when sites_on_track_count == 0; PARTIAL otherwise."
        default: NONE_ON_TRACK
        constraints: "ALL_ON_TRACK | PARTIAL | NONE_ON_TRACK"
      - name: published_metrics
        type: object
        source: system
        description: "Frozen copy of { total_captured_weight_grams, total_valued_cost_cents, total_diverted_weight_grams, diversion_rate_pct, sites_on_track_count, goal_attainment_state } taken at publish; null while DRAFT."

# ---------------------------------------------------------------------------
# 1.2 State Machine Table
# ---------------------------------------------------------------------------
state_machines:
  - entity: Recipe
    shape: linear
    initial_state: DRAFT
    terminal_states: [PUBLISHED]
    transitions:
      - transition_id: DRAFT_to_PUBLISHED
        from: DRAFT
        to: PUBLISHED
        trigger: "POST /recipes/{id}/publish"
        actor: PlatformAdmin
        preconditions:
          - "recipe.status == DRAFT (else ERR_INVALID_RECIPE_STATE)"
          - "length(recipe.ingredients) >= 1"
        side_effects:
          - "published_cost_per_kg_cents := cost_per_kg_cents (calculations.recipe_cost_per_kg output frozen)"
          - "published_at := current logical clock"
          - "increments Recipe.version by 1"

  - entity: TrackingStation
    shape: branching
    initial_state: ACTIVE
    terminal_states: [RETIRED]
    transitions:
      - transition_id: ACTIVE_to_MAINTENANCE
        from: ACTIVE
        to: MAINTENANCE
        trigger: "POST /tracking-stations/{id}/status with status=MAINTENANCE"
        actor: SiteSustainabilityManager
        preconditions:
          - "station.status == ACTIVE (else ERR_INVALID_STATION_STATE)"
        side_effects:
          - "captures at this station are refused with ERR_STATION_NOT_ACTIVE from this point on"
          - "Shift.capture_compliance_pct of every OPEN shift at the site is NOT recomputed retroactively; it is recomputed on the next capture or on close"
          - "increments TrackingStation.version by 1"
      - transition_id: MAINTENANCE_to_ACTIVE
        from: MAINTENANCE
        to: ACTIVE
        trigger: "POST /tracking-stations/{id}/status with status=ACTIVE"
        actor: SiteSustainabilityManager
        preconditions:
          - "station.status == MAINTENANCE (else ERR_INVALID_STATION_STATE)"
        side_effects:
          - "calibration_due_at := request value when supplied, otherwise unchanged"
          - "increments TrackingStation.version by 1"
      - transition_id: ACTIVE_to_RETIRED
        from: ACTIVE
        to: RETIRED
        trigger: "POST /tracking-stations/{id}/status with status=RETIRED"
        actor: SiteSustainabilityManager
        preconditions:
          - "station.status IN {ACTIVE, MAINTENANCE} (else ERR_INVALID_STATION_STATE)"
        side_effects:
          - "station is excluded from the ACTIVE-station denominator of Shift.capture_compliance_pct and from data-quality MISSED_CAPTURE scanning"
          - "increments TrackingStation.version by 1"
      - transition_id: MAINTENANCE_to_RETIRED
        from: MAINTENANCE
        to: RETIRED
        trigger: "POST /tracking-stations/{id}/status with status=RETIRED"
        actor: SiteSustainabilityManager
        preconditions:
          - "station.status == MAINTENANCE"
        side_effects:
          - "same exclusions as ACTIVE_to_RETIRED"
          - "increments TrackingStation.version by 1"

  - entity: Hauler
    shape: linear
    initial_state: PENDING
    terminal_states: [APPROVED]
    transitions:
      - transition_id: PENDING_to_APPROVED
        from: PENDING
        to: APPROVED
        trigger: "POST /haulers/{id}/approve"
        actor: CorporateSustainabilityLead
        preconditions:
          - "hauler.status == PENDING (else ERR_INVALID_HAULER_STATE)"
        side_effects:
          - "consignments already STAGED against this hauler become dispatchable"
          - "increments Hauler.version by 1"

  - entity: Shift
    shape: compound
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - transition_id: OPEN_to_CLOSED
        from: OPEN
        to: CLOSED
        trigger: "POST /shifts/{id}/close"
        actor: ShiftLead
        preconditions:
          - "shift.status == OPEN (else ERR_INVALID_SHIFT_STATE)"
        side_effects:
          - "closed_at := current logical clock"
          - "FINAL valuation pass: for every WasteEntry on this shift with status IN {RECORDED, FLAGGED}, processed in captured_at ASC order with created_at ASC tie-break, write final_cost_cents and valuation_delta_cents per calculations.waste_entry_valuation FINAL variant; effective_cost_cents therefore switches from provisional to final"
          - "recompute shift_waste_grams, waste_intensity_kg_per_1k_meals, capture_compliance_pct, pre_consumer_share_pct (calculations.shift_waste_intensity)"
          - "compute leaderboard_score (calculations.shift_leaderboard_score); it stays null for OPEN shifts"
          - "CASCADE hop 2 (caused by the effective_cost_cents switch above): recompute Site.valued_waste_cost_cents (calculations.site_waste_aggregates)"
          - "CASCADE hop 3 (caused by the shift leaving OPEN): every CoachingAlert of this shift with status == OPEN transitions to EXPIRED with resolved_at := clock; ACKNOWLEDGED alerts are left untouched"
          - "CASCADE hop 4 (caused by each alert leaving {OPEN, ACKNOWLEDGED} in hop 3): decrement Site.open_alert_count and recompute Site.coaching_posture"
          - "recompute performance_meals_served / performance_waste_grams / reduction percentages / attainment_state for every ReductionTarget with status == ACTIVE whose [window_start, window_end] contains shift.shift_date"
          - "increments Shift.version by 1"

  - entity: WasteEntry
    shape: cyclic
    initial_state: RECORDED
    terminal_states: [VOIDED]
    transitions:
      - transition_id: INITIAL_to_RECORDED
        from: INITIAL
        to: RECORDED
        trigger: "POST /waste-entries"
        actor: KitchenStaff
        preconditions:
          - "station.status == ACTIVE (else ERR_STATION_NOT_ACTIVE)"
          - "current logical clock < station.calibration_due_at (else ERR_STATION_CALIBRATION_OVERDUE)"
          - "shift.status == OPEN (else ERR_INVALID_SHIFT_STATE)"
          - "shift.site_id == station.site_id (else ERR_ENTRY_SITE_MISMATCH)"
          - "recipe_id, when supplied, references a Recipe with status == PUBLISHED (else ERR_RECIPE_NOT_PUBLISHED)"
          - "captured_at <= current logical clock (else ERR_CAPTURE_IN_FUTURE)"
          - "date(captured_at) == shift.shift_date (else ERR_CAPTURE_OUTSIDE_SHIFT_DATE)"
          - "loss_reason/station_kind pairing legal per validations[priority=120] (else ERR_LOSS_REASON_STATION_MISMATCH)"
          - "no station occupation collision per validations[priority=90] (else ERR_STATION_OCCUPIED)"
        side_effects:
          - "site_id := station.site_id; stream computed per calculations.entry_stream_segmentation"
          - "capture_window_end := captured_at + station.capture_lock_seconds"
          - "catalog_cost_basis_cents := FoodType.default_cost_per_kg_cents; recipe_cost_basis_cents := Recipe.published_cost_per_kg_cents when recipe_id supplied, else null"
          - "provisional_cost_cents computed (CATALOG variant); final_cost_cents stays null; effective_cost_cents := provisional_cost_cents"
          - "routed_weight_grams := 0; unrouted_weight_grams := weight_grams"
          - "recompute Shift.shift_waste_grams, waste_intensity_kg_per_1k_meals, capture_compliance_pct, pre_consumer_share_pct"
          - "recompute Site.total_captured_weight_grams, Site.valued_waste_cost_cents, Site.diversion_rate_pct"
          - "coaching evaluation per calculations.coaching_alert_trigger: may create one CoachingAlert (INTENSITY_BREACH and/or OVERPRODUCTION_SPIKE), which increments Site.open_alert_count and recomputes Site.coaching_posture"
          - "increments Shift.version and Site.version by 1 each"
      - transition_id: RECORDED_to_FLAGGED
        from: RECORDED
        to: FLAGGED
        trigger: "POST /waste-entries/{id}/flag"
        actor: ShiftLead
        preconditions:
          - "entry.status == RECORDED (else ERR_INVALID_ENTRY_STATE)"
        side_effects:
          - "flag_reason := request value"
          - "entry remains inside every aggregation set (FLAGGED is counted exactly like RECORDED), so no aggregate changes"
          - "increments WasteEntry.version by 1"
      - transition_id: FLAGGED_to_RECORDED
        from: FLAGGED
        to: RECORDED
        trigger: "POST /waste-entries/{id}/clear-flag"
        actor: ShiftLead
        preconditions:
          - "entry.status == FLAGGED (else ERR_INVALID_ENTRY_STATE)"
        side_effects:
          - "flag_reason retained for audit; no aggregate changes"
          - "increments WasteEntry.version by 1"
        note: "This edge plus RECORDED_to_FLAGGED forms the revision cycle."
      - transition_id: RECORDED_to_VOIDED
        from: RECORDED
        to: VOIDED
        trigger: "POST /waste-entries/{id}/void"
        actor: ShiftLead
        preconditions:
          - "entry.status IN {RECORDED, FLAGGED} (else ERR_INVALID_ENTRY_STATE)"
          - "X-User-ID != entry.captured_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
          - "entry.routed_weight_grams == 0 (else ERR_ENTRY_ROUTED_CANNOT_VOID)"
        side_effects:
          - "CASCADE hop 1: entry.status := VOIDED, void_reason := request value; the entry leaves every {RECORDED, FLAGGED} aggregation set"
          - "CASCADE hop 2 (caused by hop 1): the owning Shift recomputes shift_waste_grams, waste_intensity_kg_per_1k_meals, capture_compliance_pct, pre_consumer_share_pct, and — when already CLOSED — leaderboard_score"
          - "CASCADE hop 3 (caused by hop 2's new intensity): every CoachingAlert of that shift with alert_type == INTENSITY_BREACH and status IN {OPEN, ACKNOWLEDGED} transitions to AUTO_RESOLVED with resolved_at := clock, but only when the recomputed waste_intensity_kg_per_1k_meals is null or < COACHING_INTENSITY_THRESHOLD"
          - "CASCADE hop 4 (caused by hop 3's alerts leaving {OPEN, ACKNOWLEDGED}): Site.open_alert_count is decremented once per auto-resolved alert and Site.coaching_posture is recomputed (ESCALATED -> INTERVENTION -> MONITORING as the count falls)"
          - "direct effect of hop 1 (not part of the chain): recompute Site.total_captured_weight_grams and Site.valued_waste_cost_cents"
          - "when entry.corrects_entry_id is non-null: the superseded predecessor transitions SUPERSEDED -> RECORDED (compensation), re-entering all aggregation sets before Site/Shift aggregates are recomputed"
          - "increments WasteEntry.version, Shift.version and Site.version by 1 each"
      - transition_id: FLAGGED_to_VOIDED
        from: FLAGGED
        to: VOIDED
        trigger: "POST /waste-entries/{id}/void"
        actor: ShiftLead
        preconditions:
          - "same as RECORDED_to_VOIDED"
        side_effects:
          - "same cascade as RECORDED_to_VOIDED"
      - transition_id: RECORDED_to_SUPERSEDED
        from: RECORDED
        to: SUPERSEDED
        trigger: "POST /waste-entries/{id}/corrections"
        actor: ShiftLead
        preconditions:
          - "entry.status IN {RECORDED, FLAGGED} (else ERR_INVALID_ENTRY_STATE)"
          - "request expected_entry_version == entry.version (else ERR_STALE_ENTRY_VERSION, see concurrency_rules.correction-supersede-stale-entry)"
          - "shift.status == OPEN (else ERR_INVALID_SHIFT_STATE)"
          - "entry.routed_weight_grams == 0 (else ERR_ENTRY_ROUTED_CANNOT_VOID)"
        side_effects:
          - "original.status := SUPERSEDED, leaving every {RECORDED, FLAGGED} aggregation set"
          - "a NEW WasteEntry is created in RECORDED with corrects_entry_id := original.id, station_id/shift_id/captured_at copied from the original, weight_grams/food_type_id/loss_reason/recipe_id taken from the request (falling back to the original's values when omitted), correction_note := request value, captured_by_user_id := X-User-ID of the correcting ShiftLead"
          - "the new entry re-runs the capture valuation (fresh catalog/recipe snapshots) and the coaching evaluation; the station-occupation check is SKIPPED for correcting entries because the original already reserved that interval"
          - "recompute Shift and Site aggregates once, after both status writes"
          - "increments original WasteEntry.version by 1"
      - transition_id: FLAGGED_to_SUPERSEDED
        from: FLAGGED
        to: SUPERSEDED
        trigger: "POST /waste-entries/{id}/corrections"
        actor: ShiftLead
        preconditions:
          - "same as RECORDED_to_SUPERSEDED"
        side_effects:
          - "same as RECORDED_to_SUPERSEDED"
      - transition_id: SUPERSEDED_to_RECORDED
        from: SUPERSEDED
        to: RECORDED
        trigger: "system, cascaded from voiding the correcting entry that superseded this row"
        actor: system
        preconditions:
          - "the voided entry's corrects_entry_id == this entry's id"
          - "this entry.status == SUPERSEDED"
        side_effects:
          - "status := RECORDED (never FLAGGED, even if the entry was FLAGGED when it was superseded)"
          - "re-enters the {RECORDED, FLAGGED} aggregation sets, restoring Site.valued_waste_cost_cents to its pre-correction value with zero drift"
          - "increments WasteEntry.version by 1"
        note: "Second cycle edge on this entity: RECORDED -> SUPERSEDED -> RECORDED."

  - entity: BaselinePeriod
    shape: cyclic
    initial_state: OPEN
    terminal_states: [CERTIFIED]
    transitions:
      - transition_id: OPEN_to_SUBMITTED
        from: OPEN
        to: SUBMITTED
        trigger: "POST /baseline-periods/{id}/submit"
        actor: SiteSustainabilityManager
        preconditions:
          - "period.status == OPEN (else ERR_INVALID_BASELINE_STATE)"
          - "at least one WasteEntry with status IN {RECORDED, FLAGGED} has captured_at date inside [start_date, end_date] at this site (else ERR_BASELINE_NO_DATA)"
        side_effects:
          - "freeze baseline_entry_count, baseline_waste_grams, baseline_waste_kg, baseline_meals_served, baseline_intensity_kg_per_1k_meals, baseline_cost_cents (calculations.baseline_period_metrics)"
          - "submitted_at := current logical clock"
          - "increments BaselinePeriod.version by 1"
      - transition_id: SUBMITTED_to_OPEN
        from: SUBMITTED
        to: OPEN
        trigger: "POST /baseline-periods/{id}/reject"
        actor: CorporateSustainabilityLead
        preconditions:
          - "period.status == SUBMITTED (else ERR_INVALID_BASELINE_STATE)"
        side_effects:
          - "rejection_note := request value; rejection_count += 1"
          - "all frozen baseline_* metrics are cleared back to null/0 so the next submit recomputes them from current data"
          - "increments BaselinePeriod.version by 1"
        note: "Revision cycle edge: OPEN -> SUBMITTED -> OPEN, repeatable, with rejection_count as the loop counter."
      - transition_id: SUBMITTED_to_CERTIFIED
        from: SUBMITTED
        to: CERTIFIED
        trigger: "POST /baseline-periods/{id}/certify"
        actor: CorporateSustainabilityLead
        preconditions:
          - "period.status == SUBMITTED (else ERR_INVALID_BASELINE_STATE)"
          - "baseline_meals_served > 0 (else ERR_BASELINE_NO_DATA)"
        side_effects:
          - "certified_at := current logical clock; frozen metrics become immutable"
          - "ReductionTargets may now bind to this period"
          - "increments BaselinePeriod.version by 1"

  - entity: ReductionTarget
    shape: branching
    initial_state: PROPOSED
    terminal_states: [ACHIEVED, MISSED, SUPERSEDED]
    transitions:
      - transition_id: PROPOSED_to_ACTIVE
        from: PROPOSED
        to: ACTIVE
        trigger: "POST /reduction-targets/{id}/activate"
        actor: CorporateSustainabilityLead
        preconditions:
          - "target.status == PROPOSED (else ERR_INVALID_TARGET_STATE)"
          - "the bound BaselinePeriod.status == CERTIFIED (else ERR_BASELINE_NOT_CERTIFIED)"
        side_effects:
          - "activated_at := current logical clock"
          - "performance_* and reduction percentages and attainment_state are computed immediately (calculations.reduction_attainment)"
          - "increments ReductionTarget.version by 1"
      - transition_id: PROPOSED_to_SUPERSEDED
        from: PROPOSED
        to: SUPERSEDED
        trigger: "system, cascaded from POST /reduction-targets creating a newer target with the same site_id, window_start and window_end"
        actor: system
        preconditions:
          - "prior target.status IN {PROPOSED, ACTIVE}"
          - "new target's site_id, window_start and window_end all equal the prior target's"
        side_effects:
          - "status := SUPERSEDED, resolved_at := current logical clock"
          - "the superseded target stops contributing to CorporateRollup.sites_on_track_count"
          - "increments ReductionTarget.version by 1"
      - transition_id: ACTIVE_to_SUPERSEDED
        from: ACTIVE
        to: SUPERSEDED
        trigger: "system, cascaded from POST /reduction-targets creating a newer target with the same site_id and window"
        actor: system
        preconditions:
          - "same as PROPOSED_to_SUPERSEDED"
        side_effects:
          - "same as PROPOSED_to_SUPERSEDED"
      - transition_id: ACTIVE_to_ACHIEVED
        from: ACTIVE
        to: ACHIEVED
        trigger: "system, on POST /_clock/set_current_utc when the new clock reaches window close"
        actor: system
        preconditions:
          - "target.status == ACTIVE"
          - "new clock >= window_end + 1 day at 00:00:00.000Z"
          - "attainment_state == ACHIEVED_PENDING after a fresh recompute"
        side_effects:
          - "status := ACHIEVED, resolved_at := new clock"
          - "increments ReductionTarget.version by 1"
      - transition_id: ACTIVE_to_MISSED
        from: ACTIVE
        to: MISSED
        trigger: "system, on POST /_clock/set_current_utc when the new clock reaches window close"
        actor: system
        preconditions:
          - "target.status == ACTIVE"
          - "new clock >= window_end + 1 day at 00:00:00.000Z"
          - "attainment_state == BEHIND after a fresh recompute"
        side_effects:
          - "status := MISSED, resolved_at := new clock"
          - "increments ReductionTarget.version by 1"
        note: "Fork: the same clock trigger routes to ACHIEVED or MISSED with different terminal side-effect sets; targets are processed in created_at ASC order."

  - entity: DiversionConsignment
    shape: parallel
    dimensions: [logistics_status, settlement_status]
    initial_state: "logistics_status=DRAFT, settlement_status=UNBILLED"
    terminal_states: [CANCELLED, "logistics_status=COMPLETED with settlement_status=SETTLED"]
    transitions:
      - transition_id: logistics.DRAFT_to_STAGED
        dimension: logistics_status
        from: DRAFT
        to: STAGED
        trigger: "POST /diversion-consignments/{id}/stage"
        actor: SiteSustainabilityManager
        preconditions:
          - "logistics_status == DRAFT (else ERR_INVALID_CONSIGNMENT_STATE)"
          - "line_count >= 1 (else ERR_CONSIGNMENT_EMPTY)"
          - "staged_weight_grams <= Hauler.capacity_kg_per_pickup * 1000 (else ERR_HAULER_CAPACITY_EXCEEDED)"
        side_effects:
          - "staged_at := current logical clock"
          - "no further ConsignmentLine may be added or deleted"
          - "increments DiversionConsignment.version by 1"
      - transition_id: logistics.STAGED_to_DISPATCHED
        dimension: logistics_status
        from: STAGED
        to: DISPATCHED
        trigger: "POST /diversion-consignments/{id}/dispatch"
        actor: SiteSustainabilityManager
        preconditions:
          - "logistics_status == STAGED (else ERR_INVALID_CONSIGNMENT_STATE)"
          - "Hauler.status == APPROVED (else ERR_HAULER_NOT_APPROVED)"
          - "channel != DONATION OR Site.coaching_posture != ESCALATED (else ERR_SITE_POSTURE_BLOCKS_DONATION)"
        side_effects:
          - "dispatched_at := current logical clock; the consignment becomes ticket-eligible on the settlement dimension"
          - "increments DiversionConsignment.version by 1"
      - transition_id: logistics.DISPATCHED_to_COMPLETED
        dimension: logistics_status
        from: DISPATCHED
        to: COMPLETED
        trigger: "system, cascaded from POST /hauler-tickets/{id}/accept"
        actor: system
        preconditions:
          - "logistics_status == DISPATCHED"
          - "the accepted ticket's consignment_id == this consignment's id"
        side_effects:
          - "logistics_status := COMPLETED in the same request that flips settlement_status to SETTLED"
          - "increments DiversionConsignment.version by 1"
      - transition_id: logistics.DRAFT_to_CANCELLED
        dimension: logistics_status
        from: DRAFT
        to: CANCELLED
        trigger: "POST /diversion-consignments/{id}/cancel"
        actor: SiteSustainabilityManager
        preconditions:
          - "logistics_status IN {DRAFT, STAGED, DISPATCHED} (else ERR_INVALID_CONSIGNMENT_STATE)"
          - "settlement_status != SETTLED (else ERR_INVALID_CONSIGNMENT_STATE)"
        side_effects:
          - "cancel_reason := request value"
          - "every attached ConsignmentLine stops counting: for each distinct waste_entry_id on this consignment, recompute WasteEntry.routed_weight_grams and unrouted_weight_grams (compensating_invariant/routed_weight_conservation)"
          - "recompute Site.diverted_weight_grams_settled and Site.diversion_rate_pct"
          - "increments DiversionConsignment.version by 1"
      - transition_id: logistics.STAGED_to_CANCELLED
        dimension: logistics_status
        from: STAGED
        to: CANCELLED
        trigger: "POST /diversion-consignments/{id}/cancel"
        actor: SiteSustainabilityManager
        preconditions:
          - "same as logistics.DRAFT_to_CANCELLED"
        side_effects:
          - "same as logistics.DRAFT_to_CANCELLED"
      - transition_id: logistics.DISPATCHED_to_CANCELLED
        dimension: logistics_status
        from: DISPATCHED
        to: CANCELLED
        trigger: "POST /diversion-consignments/{id}/cancel"
        actor: SiteSustainabilityManager
        preconditions:
          - "same as logistics.DRAFT_to_CANCELLED"
        side_effects:
          - "same as logistics.DRAFT_to_CANCELLED, plus any SUBMITTED HaulerTicket on this consignment stays SUBMITTED and can no longer be accepted (ERR_INVALID_CONSIGNMENT_STATE)"
      - transition_id: settlement.UNBILLED_to_TICKET_SUBMITTED
        dimension: settlement_status
        from: UNBILLED
        to: TICKET_SUBMITTED
        trigger: "POST /hauler-tickets"
        actor: HaulerOperator
        preconditions:
          - "logistics_status == DISPATCHED (else ERR_INVALID_CONSIGNMENT_STATE) — this is the only coupling point between the two dimensions"
          - "settlement_status IN {UNBILLED, DISPUTED} (else ERR_TICKET_ALREADY_SUBMITTED)"
        side_effects:
          - "settlement_status := TICKET_SUBMITTED"
          - "increments DiversionConsignment.version by 1"
      - transition_id: settlement.TICKET_SUBMITTED_to_SETTLED
        dimension: settlement_status
        from: TICKET_SUBMITTED
        to: SETTLED
        trigger: "POST /hauler-tickets/{id}/accept"
        actor: SiteSustainabilityManager
        preconditions:
          - "settlement_status == TICKET_SUBMITTED"
          - "logistics_status == DISPATCHED (else ERR_INVALID_CONSIGNMENT_STATE)"
        side_effects:
          - "CASCADE hop 1: settlement_status := SETTLED and logistics_status := COMPLETED"
          - "CASCADE hop 2 (caused by hop 1's settlement flip): the consignment's lines now qualify, so recompute Site.diverted_weight_grams_settled and Site.diversion_rate_pct"
          - "CASCADE hop 3 (caused by hop 2's new Site.diversion_rate_pct): every ReductionTarget of that site with status == ACTIVE re-evaluates attainment_state, which can flip BEHIND -> ACHIEVED_PENDING purely because the diversion floor is now met"
          - "increments DiversionConsignment.version and Site.version by 1 each"
      - transition_id: settlement.TICKET_SUBMITTED_to_DISPUTED
        dimension: settlement_status
        from: TICKET_SUBMITTED
        to: DISPUTED
        trigger: "POST /hauler-tickets/{id}/dispute"
        actor: SiteSustainabilityManager
        preconditions:
          - "settlement_status == TICKET_SUBMITTED"
        side_effects:
          - "settlement_status := DISPUTED; the hauler may submit a replacement ticket"
          - "no Site aggregate changes (nothing was ever credited)"
          - "increments DiversionConsignment.version by 1"
      - transition_id: settlement.DISPUTED_to_TICKET_SUBMITTED
        dimension: settlement_status
        from: DISPUTED
        to: TICKET_SUBMITTED
        trigger: "POST /hauler-tickets (replacement ticket with a fresh ticket_number)"
        actor: HaulerOperator
        preconditions:
          - "settlement_status == DISPUTED"
          - "logistics_status == DISPATCHED"
          - "ticket_number not already used by this hauler (else ERR_DUPLICATE_TICKET_NUMBER)"
        side_effects:
          - "settlement_status := TICKET_SUBMITTED for the new ticket; the DISPUTED ticket stays DISPUTED forever"
          - "increments DiversionConsignment.version by 1"
        note: "Settlement-dimension cycle: TICKET_SUBMITTED -> DISPUTED -> TICKET_SUBMITTED, independent of logistics_status which stays DISPATCHED throughout."

  - entity: HaulerTicket
    shape: branching
    initial_state: SUBMITTED
    terminal_states: [ACCEPTED, DISPUTED]
    transitions:
      - transition_id: SUBMITTED_to_ACCEPTED
        from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /hauler-tickets/{id}/accept"
        actor: SiteSustainabilityManager
        preconditions:
          - "ticket.status == SUBMITTED (else ERR_INVALID_TICKET_STATE)"
          - "consignment.logistics_status == DISPATCHED and settlement_status == TICKET_SUBMITTED (else ERR_INVALID_CONSIGNMENT_STATE)"
        side_effects:
          - "accepted_at := current logical clock"
          - "drives the depth-3 cascade documented on settlement.TICKET_SUBMITTED_to_SETTLED"
          - "increments HaulerTicket.version by 1"
      - transition_id: SUBMITTED_to_DISPUTED
        from: SUBMITTED
        to: DISPUTED
        trigger: "POST /hauler-tickets/{id}/dispute"
        actor: SiteSustainabilityManager
        preconditions:
          - "ticket.status == SUBMITTED (else ERR_INVALID_TICKET_STATE)"
        side_effects:
          - "dispute_note := request value; consignment.settlement_status := DISPUTED"
          - "increments HaulerTicket.version by 1"

  - entity: CoachingAlert
    shape: branching
    initial_state: OPEN
    terminal_states: [RESOLVED, AUTO_RESOLVED, EXPIRED]
    transitions:
      - transition_id: INITIAL_to_OPEN
        from: INITIAL
        to: OPEN
        trigger: "system, cascaded from POST /waste-entries when calculations.coaching_alert_trigger fires"
        actor: system
        preconditions:
          - "no CoachingAlert with the same shift_id and alert_type already has status IN {OPEN, ACKNOWLEDGED}"
        side_effects:
          - "increments Site.open_alert_count by 1 and recomputes Site.coaching_posture"
      - transition_id: OPEN_to_ACKNOWLEDGED
        from: OPEN
        to: ACKNOWLEDGED
        trigger: "POST /coaching-alerts/{id}/acknowledge"
        actor: KitchenStaff
        preconditions:
          - "alert.status == OPEN (else ERR_INVALID_ALERT_STATE)"
        side_effects:
          - "acknowledged_by_user_id := X-User-ID; Site.open_alert_count is UNCHANGED (ACKNOWLEDGED still counts)"
          - "increments CoachingAlert.version by 1"
      - transition_id: ACKNOWLEDGED_to_RESOLVED
        from: ACKNOWLEDGED
        to: RESOLVED
        trigger: "POST /coaching-alerts/{id}/resolve"
        actor: ShiftLead
        preconditions:
          - "alert.status == ACKNOWLEDGED (else ERR_INVALID_ALERT_STATE)"
        side_effects:
          - "resolved_by_user_id := X-User-ID; resolution_note := request value; resolved_at := clock"
          - "decrements Site.open_alert_count by 1 and recomputes Site.coaching_posture"
          - "increments CoachingAlert.version and Site.version by 1 each"
      - transition_id: OPEN_to_AUTO_RESOLVED
        from: OPEN
        to: AUTO_RESOLVED
        trigger: "system, cascade hop 3 of POST /waste-entries/{id}/void"
        actor: system
        preconditions:
          - "alert.alert_type == INTENSITY_BREACH"
          - "the shift's recomputed waste_intensity_kg_per_1k_meals is null or < COACHING_INTENSITY_THRESHOLD"
        side_effects:
          - "resolved_at := clock; decrements Site.open_alert_count and recomputes Site.coaching_posture"
      - transition_id: ACKNOWLEDGED_to_AUTO_RESOLVED
        from: ACKNOWLEDGED
        to: AUTO_RESOLVED
        trigger: "system, cascade hop 3 of POST /waste-entries/{id}/void"
        actor: system
        preconditions:
          - "same as OPEN_to_AUTO_RESOLVED"
        side_effects:
          - "same as OPEN_to_AUTO_RESOLVED"
      - transition_id: OPEN_to_EXPIRED
        from: OPEN
        to: EXPIRED
        trigger: "system, cascade hop 3 of POST /shifts/{id}/close"
        actor: system
        preconditions:
          - "alert.status == OPEN (ACKNOWLEDGED alerts are deliberately spared)"
        side_effects:
          - "resolved_at := clock; decrements Site.open_alert_count and recomputes Site.coaching_posture"

  - entity: DataQualityFinding
    shape: branching
    initial_state: OPEN
    terminal_states: [CONFIRMED, DISMISSED]
    transitions:
      - transition_id: INITIAL_to_OPEN
        from: INITIAL
        to: OPEN
        trigger: "POST /data-quality-scans"
        actor: SiteSustainabilityManager
        preconditions:
          - "no OPEN finding already exists with the same (finding_type, site_id, station_id, shift_id, waste_entry_id) tuple"
        side_effects:
          - "detected_at := current logical clock"
          - "the site now blocks CorporateRollup publication while any finding stays OPEN"
      - transition_id: OPEN_to_CONFIRMED
        from: OPEN
        to: CONFIRMED
        trigger: "POST /data-quality-findings/{id}/resolve with resolution=CONFIRMED"
        actor: SiteSustainabilityManager
        preconditions:
          - "finding.status == OPEN (else ERR_INVALID_FINDING_STATE)"
        side_effects:
          - "resolved_by_user_id := X-User-ID; the finding no longer blocks rollup publication"
          - "increments DataQualityFinding.version by 1"
      - transition_id: OPEN_to_DISMISSED
        from: OPEN
        to: DISMISSED
        trigger: "POST /data-quality-findings/{id}/resolve with resolution=DISMISSED"
        actor: SiteSustainabilityManager
        preconditions:
          - "finding.status == OPEN (else ERR_INVALID_FINDING_STATE)"
        side_effects:
          - "resolved_by_user_id := X-User-ID; the finding no longer blocks rollup publication"
          - "increments DataQualityFinding.version by 1"

  - entity: CorporateRollup
    shape: linear
    initial_state: DRAFT
    terminal_states: [PUBLISHED]
    transitions:
      - transition_id: DRAFT_to_PUBLISHED
        from: DRAFT
        to: PUBLISHED
        trigger: "POST /corporate-rollups/{id}/publish"
        actor: CorporateSustainabilityLead
        preconditions:
          - "rollup.status == DRAFT (else ERR_ROLLUP_ALREADY_PUBLISHED)"
          - "X-User-ID != rollup.prepared_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
          - "zero DataQualityFinding rows with status == OPEN whose site_id is in rollup.site_ids (else ERR_ROLLUP_DATA_QUALITY_BLOCKED)"
        side_effects:
          - "metrics are recomputed one last time, then copied into published_metrics"
          - "published_by_user_id := X-User-ID; published_at := clock"
          - "increments CorporateRollup.version by 1"

# ---------------------------------------------------------------------------
# 1.2.1 Concurrency Rules  (OCC on the parent's `version` only)
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: correction-supersede-stale-entry
    parent_entity: WasteEntry
    write_endpoint: "POST /waste-entries/{id}/corrections"
    occ_field: "expected_entry_version"
    description: |
      Creating a correcting WasteEntry against an entry whose version has advanced since the client last
      observed it is rejected. Because a correction legitimately supersedes whatever the entry currently
      says — including a previous correction — a second corrector observing an out-of-date version would
      otherwise silently overwrite a supersession it never saw. The check is a stale-version comparison:
      expected_entry_version must equal the entry's current version integer.
    error_id: ERR_STALE_ENTRY_VERSION
    http_status: 412

  - rule_id: target-create-stale-site
    parent_entity: Site
    write_endpoint: "POST /reduction-targets"
    occ_field: "expected_site_version"
    description: |
      Creating a ReductionTarget for a site whose version has advanced since the client last observed it
      is rejected. A new target legitimately supersedes any PROPOSED or ACTIVE target on the same site and
      window, so the corporate lead must prove the aggregate snapshot the target was sized against — waste
      totals, diversion rate, posture — is still current. Every capture, void, close and settlement bumps
      Site.version, so a stale expected_site_version means the sizing inputs moved.
    error_id: ERR_STALE_SITE_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# 1.3 Calculation Rules Table
# ---------------------------------------------------------------------------
calculations:
  - name: recipe_cost_per_kg
    trigger: "POST /recipes (initial computation) and re-frozen by state_machines.Recipe.DRAFT_to_PUBLISHED"
    algorithm: aggregation
    formula: |
      # PINNED EVALUATION ORDER. Rounding happens PER LINE, then the integers are summed.
      # Summing the unrounded products first and rounding once at the end is the WRONG order
      # and yields a different cost_per_kg_cents (see the worked divergence below).
      STEP 1 — for each element i of `ingredients`, in array order:
          gross_line_cents_i = quantity_kg_i * unit_cost_cents_per_kg_i        # exact decimal product
          line_cost_cents_i  = round_half_up(gross_line_cents_i, 0)            # WHOLE CENTS, per line
          usable_kg_i        = quantity_kg_i * (1 - trim_loss_pct_i)           # exact decimal product
      STEP 2 — total_ingredient_cost_cents = sum(line_cost_cents_i)            # integer addition only
      STEP 3 — usable_yield_kg = round_half_up(sum(usable_kg_i), 3)
      STEP 4 — cost_per_kg_cents = round_half_up(total_ingredient_cost_cents / usable_yield_kg, 0)
      # Worked divergence (the scaffold's canonical recipe BRZ-CHK):
      #   lines: (2.5kg @1201, trim 0.20), (1.5kg @407, trim 0.00), (0.5kg @999, trim 0.00)
      #   per-line rounded: 3003 + 611 + 500 = 4114   -> 4114 / 4.000 = 1028.5  -> 1029  (PINNED)
      #   sum-then-round:   round(4112.5) = 4113      -> 4113 / 4.000 = 1028.25 -> 1028  (WRONG)
    input_set: "All elements of Recipe.ingredients; no status filtering (ingredients are embedded, not separate rows)."
    constants:
      LINE_ROUNDING_ORDER: "round_per_line_then_sum"
      YIELD_DECIMALS: 3
    precision: "line costs and cost_per_kg_cents are whole cents, round_half_up; usable_yield_kg is 3 decimals, round_half_up"

  - name: waste_entry_valuation
    trigger: "POST /waste-entries writes provisional_cost_cents; state_machines.Shift.OPEN_to_CLOSED writes final_cost_cents and valuation_delta_cents; POST /waste-entries/{id}/corrections re-runs the provisional pass for the new entry"
    algorithm: forward_looking
    formula: |
      kg = weight_grams / 1000                                  # exact decimal, never rounded
      cost(basis_cents) = round_half_up(kg * basis_cents, 0)     # whole cents
      provisional_cost_cents = cost(catalog_cost_basis_cents)
      final_cost_cents       = cost(recipe_cost_basis_cents) when recipe_cost_basis_cents is not null
                               else cost(catalog_cost_basis_cents)
      valuation_delta_cents  = final_cost_cents - provisional_cost_cents
      effective_cost_cents   = final_cost_cents when final_cost_cents is not null else provisional_cost_cents
    input_set: "One WasteEntry. The two bases are the snapshots taken at capture (catalog_cost_basis_cents, recipe_cost_basis_cents); later edits to FoodType or Recipe never retro-value an existing entry."
    constants: {}
    precision: "2 decimal places of a currency expressed as whole cents; round_half_up"
    variants:
      - name: CATALOG_PROVISIONAL
        when: "At capture time, and for every entry whose owning Shift is still OPEN"
        difference: "Values the loss at FoodType.default_cost_per_kg_cents, ignoring recipe attribution entirely."
      - name: RECIPE_FINAL
        when: "At Shift close, for entries carrying a non-null recipe_cost_basis_cents"
        difference: "Values the same grams at the recipe's published fully-loaded cost per kg, which includes trim loss, so the same entry is worth strictly more (or less) than its provisional figure. Canonical divergence: 2450 g of FoodType 640 c/kg attributed to recipe BRZ-CHK (1029 c/kg) is 1568 c provisional and 2521 c final, delta 953 c."

  - name: entry_stream_segmentation
    trigger: "POST /waste-entries and POST /waste-entries/{id}/corrections"
    algorithm: constraint_propagation
    formula: |
      stream = POST_CONSUMER  when TrackingStation.station_kind == DISH_RETURN
                              or  loss_reason == PLATE_WASTE
             = PRE_CONSUMER   otherwise
    input_set: "The entry's own loss_reason plus the station_kind of the referenced TrackingStation at capture time."
    constants: {}
    precision: "n/a (enum)"

  - name: shift_waste_intensity
    trigger: "POST /waste-entries, POST /waste-entries/{id}/void, POST /waste-entries/{id}/corrections, POST /shifts/{id}/close"
    algorithm: aggregation
    formula: |
      shift_waste_grams = sum(WasteEntry.weight_grams
                              WHERE shift_id == shift.id AND status IN {RECORDED, FLAGGED})
      waste_intensity_kg_per_1k_meals =
          null                                            when meals_served == 0
          round_half_up(shift_waste_grams / meals_served, 3)  otherwise
          # grams / meals is numerically identical to kilograms per 1000 meals
      pre_consumer_grams = sum(weight_grams over the same set WHERE stream == PRE_CONSUMER)
      pre_consumer_share_pct = null when shift_waste_grams == 0
                               else round_half_up(pre_consumer_grams / shift_waste_grams, 4)
      active_station_count  = count(TrackingStation WHERE site_id == shift.site_id AND status == ACTIVE)
      stations_with_capture = count(DISTINCT station_id over WasteEntry
                                    WHERE shift_id == shift.id AND status IN {RECORDED, FLAGGED, SUPERSEDED})
      capture_compliance_pct = 1.0000 when active_station_count == 0
                               else round_half_up(stations_with_capture / active_station_count, 4)
    input_set: "Entries of exactly one Shift; VOIDED and SUPERSEDED entries are excluded from weight and share, but SUPERSEDED entries still count toward stations_with_capture (the station did report)."
    constants: {}
    precision: "intensity 3 decimals; shares 4 decimals; round_half_up"

  - name: shift_leaderboard_score
    trigger: "state_machines.Shift.OPEN_to_CLOSED, and recomputed by the cascade of POST /waste-entries/{id}/void when the shift is already CLOSED"
    algorithm: weighted_scoring
    formula: |
      # Three interacting inputs, a clamped penalty nested inside min/max, and a conditional bonus.
      intensity_excess = max(0, waste_intensity_kg_per_1k_meals - Site.target_intensity_kg_per_1k_meals)
                         # null intensity (meals_served == 0) is treated as 0 excess
      intensity_penalty = min(PENALTY_CAP, intensity_excess * INTENSITY_PENALTY_PER_KG)
      compliance_penalty = (1 - capture_compliance_pct) * COMPLIANCE_WEIGHT
      pre_consumer_bonus = PRE_CONSUMER_BONUS when pre_consumer_share_pct is not null
                                              and pre_consumer_share_pct >= PRE_CONSUMER_BONUS_THRESHOLD
                           else 0
      raw = 100 - intensity_penalty - compliance_penalty + pre_consumer_bonus
      leaderboard_score = round_half_up(min(100, max(0, raw)), 1)
    input_set: "One CLOSED Shift plus its Site's target_intensity_kg_per_1k_meals."
    constants:
      INTENSITY_PENALTY_PER_KG: 4.0
      PENALTY_CAP: 60.0
      COMPLIANCE_WEIGHT: 25.0
      PRE_CONSUMER_BONUS: 3.0
      PRE_CONSUMER_BONUS_THRESHOLD: 0.60
    precision: "1 decimal place, round_half_up, clamped to [0, 100]"

  - name: coaching_alert_trigger
    trigger: "POST /waste-entries and the correcting-entry creation inside POST /waste-entries/{id}/corrections, evaluated AFTER shift_waste_intensity has been recomputed"
    algorithm: threshold
    formula: |
      # Rule A — intensity breach (inclusive threshold)
      if waste_intensity_kg_per_1k_meals is not null
         and waste_intensity_kg_per_1k_meals >= COACHING_INTENSITY_THRESHOLD
         and no CoachingAlert exists with (shift_id == shift.id, alert_type == INTENSITY_BREACH,
                                           status IN {OPEN, ACKNOWLEDGED}):
             create CoachingAlert(alert_type=INTENSITY_BREACH,
                                  observed_intensity=waste_intensity_kg_per_1k_meals,
                                  severity=HIGH when observed_intensity >= HIGH_SEVERITY_INTENSITY else MEDIUM,
                                  waste_entry_id=the entry just posted)
      # Rule B — overproduction spike (inclusive threshold, independent of Rule A)
      if loss_reason == OVERPRODUCTION and weight_grams >= OVERPRODUCTION_SPIKE_GRAMS
         and no CoachingAlert exists with (shift_id == shift.id, alert_type == OVERPRODUCTION_SPIKE,
                                           status IN {OPEN, ACKNOWLEDGED}):
             create CoachingAlert(alert_type=OVERPRODUCTION_SPIKE, severity=MEDIUM,
                                  observed_intensity=null, waste_entry_id=the entry just posted)
      # Both rules may fire on the same capture; Rule A's alert is created first.
    input_set: "The Shift's post-capture aggregates plus the single entry just posted."
    constants:
      COACHING_INTENSITY_THRESHOLD: 12.000
      HIGH_SEVERITY_INTENSITY: 18.000
      OVERPRODUCTION_SPIKE_GRAMS: 5000
    precision: "comparisons are made on the 3-decimal rounded intensity value, inclusive (>=)"

  - name: site_waste_aggregates
    trigger: "POST /waste-entries, POST /waste-entries/{id}/void, POST /waste-entries/{id}/corrections, POST /shifts/{id}/close, POST /consignment-lines, DELETE /consignment-lines/{id}, POST /diversion-consignments/{id}/cancel, POST /hauler-tickets/{id}/accept"
    algorithm: aggregation
    formula: |
      total_captured_weight_grams = sum(WasteEntry.weight_grams
                                        WHERE site_id == site.id AND status IN {RECORDED, FLAGGED})
      valued_waste_cost_cents     = sum(WasteEntry.effective_cost_cents over the same set)
      diverted_weight_grams_settled = sum(ConsignmentLine.allocated_weight_grams
                                          WHERE line.consignment.site_id == site.id
                                            AND line.consignment.settlement_status == SETTLED
                                            AND line.consignment.logistics_status != CANCELLED)
      diversion_rate_pct = null when total_captured_weight_grams == 0
                           else round_half_up(diverted_weight_grams_settled
                                              / total_captured_weight_grams * 100, 2)
      open_alert_count = count(CoachingAlert WHERE site_id == site.id AND status IN {OPEN, ACKNOWLEDGED})
      coaching_posture = MONITORING   when open_alert_count == 0
                       = ESCALATED    when open_alert_count >= ESCALATION_ALERT_COUNT
                       = INTERVENTION otherwise
    input_set: "Every WasteEntry and ConsignmentLine reachable from the site; the filters above are the complete inclusion rule. Full recompute from source rows on every trigger — no incremental deltas — so a compensating action restores the byte-identical prior value."
    constants:
      ESCALATION_ALERT_COUNT: 3
    precision: "grams and cents are integers; diversion_rate_pct 2 decimals round_half_up"

  - name: routed_weight_allocation
    trigger: "POST /consignment-lines, DELETE /consignment-lines/{id}, POST /diversion-consignments/{id}/cancel"
    algorithm: waterfall_allocation
    formula: |
      # per WasteEntry
      routed_weight_grams   = sum(ConsignmentLine.allocated_weight_grams
                                  WHERE line.waste_entry_id == entry.id
                                    AND line.consignment.logistics_status != CANCELLED)
      unrouted_weight_grams = entry.weight_grams - routed_weight_grams
      # per DiversionConsignment (cancellation does NOT delete lines, it stops counting them)
      staged_weight_grams = sum(allocated_weight_grams of the consignment's lines)
      line_count          = count(the consignment's lines)
      # INVARIANT (checked before every insert): allocated_weight_grams <= entry.unrouted_weight_grams
      #   and, for all time, entry.weight_grams == routed_weight_grams + unrouted_weight_grams
    input_set: "All ConsignmentLine rows of the entry; lines on CANCELLED consignments are retained for audit but excluded from routed_weight_grams."
    constants: {}
    precision: "integer grams; no rounding anywhere"

  - name: baseline_period_metrics
    trigger: "state_machines.BaselinePeriod.OPEN_to_SUBMITTED (freeze) and cleared by SUBMITTED_to_OPEN"
    algorithm: chronological
    formula: |
      E = { WasteEntry : site_id == period.site_id
                         AND status IN {RECORDED, FLAGGED}
                         AND date(captured_at) BETWEEN start_date AND end_date (both inclusive) }
      baseline_entry_count  = count(E)
      baseline_waste_grams  = sum(weight_grams over E)
      baseline_waste_kg     = round_half_up(baseline_waste_grams / 1000, 3)
      baseline_cost_cents   = sum(effective_cost_cents over E)
      S = { Shift : site_id == period.site_id AND status == CLOSED
                    AND shift_date BETWEEN start_date AND end_date (both inclusive) }
      baseline_meals_served = sum(meals_served over S)
      baseline_intensity_kg_per_1k_meals =
          null when baseline_meals_served == 0
          else round_half_up(baseline_waste_grams / baseline_meals_served, 3)
    input_set: "Only CLOSED shifts contribute meals; OPEN shifts are excluded even when their entries fall in the window (the entries still count toward waste). Boundary dates are inclusive on both ends."
    constants: {}
    precision: "kg 3 decimals, intensity 3 decimals, round_half_up"

  - name: reduction_attainment
    trigger: "state_machines.ReductionTarget.PROPOSED_to_ACTIVE, GET /reduction-targets/{id}/attainment, and every cascade that changes Site aggregates or CLOSED-shift meals inside the window"
    algorithm: threshold
    formula: |
      P = { WasteEntry : site_id == target.site_id AND status IN {RECORDED, FLAGGED}
                         AND date(captured_at) BETWEEN window_start AND window_end (inclusive) }
      performance_waste_grams  = sum(weight_grams over P)
      performance_meals_served = sum(Shift.meals_served WHERE site_id == target.site_id
                                     AND status == CLOSED
                                     AND shift_date BETWEEN window_start AND window_end)
      performance_intensity_kg_per_1k_meals =
          null when performance_meals_served == 0
          else round_half_up(performance_waste_grams / performance_meals_served, 3)
      B = the bound BaselinePeriod's frozen metrics
      absolute_reduction_pct  = null when B.baseline_waste_grams == 0
          else round_half_up((B.baseline_waste_grams - performance_waste_grams)
                             / B.baseline_waste_grams * 100, 2)
      intensity_reduction_pct = null when B.baseline_intensity_kg_per_1k_meals is null
                                     or performance_intensity_kg_per_1k_meals is null
          else round_half_up((B.baseline_intensity_kg_per_1k_meals
                              - performance_intensity_kg_per_1k_meals)
                             / B.baseline_intensity_kg_per_1k_meals * 100, 2)
      effective_reduction_pct = absolute_reduction_pct  when basis == ABSOLUTE
                                intensity_reduction_pct when basis == INTENSITY
      diversion_floor_value   = Site.diversion_rate_pct, with null read as 0.00
      attainment_state = ACHIEVED_PENDING when effective_reduction_pct is not null
                                          and effective_reduction_pct >= target_reduction_pct
                                          and diversion_floor_value >= min_diversion_rate_pct
                       = BEHIND otherwise
      # Worked divergence: baseline 3000 g over 250 meals (12.000), performance 2700 g over 200 meals
      # (13.500) -> ABSOLUTE = +10.00 %, INTENSITY = -12.50 %. With target_reduction_pct 10.00 the two
      # bases disagree on attainment for byte-identical underlying data.
    input_set: "Performance entries and CLOSED shifts inside the target window; the baseline side always reads the FROZEN BaselinePeriod metrics, never a live recomputation."
    constants: {}
    precision: "percentages 2 decimals, round_half_up; comparison against target_reduction_pct is inclusive (>=)"
    variants:
      - name: ABSOLUTE
        when: "target.basis == ABSOLUTE"
        difference: "Compares raw grams, so serving fewer meals with less total waste counts as progress."
      - name: INTENSITY
        when: "target.basis == INTENSITY"
        difference: "Compares kg per 1000 meals, so the same raw drop can register as a regression once covers fall faster than waste."

  - name: hauler_ticket_settlement
    trigger: "POST /hauler-tickets"
    algorithm: tiered_pricing
    formula: |
      # PINNED EVALUATION ORDER 1..7. The surcharge tier is keyed on base_haul_fee_cents ONLY.
      # It is NOT keyed on settlement_subtotal_cents or settlement_total_cents — those already
      # contain the surcharge, and keying the tier on them would make the value self-referential.
      STEP 1  net_weight_grams = gross_weight_grams - DiversionConsignment.container_tare_grams
      STEP 2  billable_tonnes  = round_half_up(net_weight_grams / 1000000, 4)
      STEP 3  base_haul_fee_cents = round_half_up(billable_tonnes * Hauler.rate_cents_per_tonne, 0)
                                    + Hauler.stop_fee_cents
      STEP 4  fuel_surcharge_pct = 0.00 when base_haul_fee_cents < SURCHARGE_TIER_1_CENTS
                                 = 0.06 when SURCHARGE_TIER_1_CENTS <= base_haul_fee_cents
                                              < SURCHARGE_TIER_2_CENTS
                                 = 0.09 when base_haul_fee_cents >= SURCHARGE_TIER_2_CENTS
              fuel_surcharge_cents = round_half_up(base_haul_fee_cents * fuel_surcharge_pct, 0)
      STEP 5  settlement_subtotal_cents = base_haul_fee_cents + fuel_surcharge_cents
      STEP 6  variance_pct = round_half_up(abs(net_weight_grams
                                               - DiversionConsignment.staged_weight_grams)
                                           / DiversionConsignment.staged_weight_grams * 100, 2)
              variance_credit_cents = round_half_up(settlement_subtotal_cents * VARIANCE_CREDIT_RATE, 0)
                                      when variance_pct > VARIANCE_TOLERANCE_PCT else 0
      STEP 7  settlement_total_cents = settlement_subtotal_cents - variance_credit_cents
      # Worked trap: net 250000 g, staged 240000 g, rate 52000, stop 1800
      #   base = 13000 + 1800 = 14800 -> tier 0.06 -> surcharge 888 -> subtotal 15688
      #   subtotal 15688 is above SURCHARGE_TIER_2_CENTS; keying the tier on it would give
      #   surcharge 1332 and total 16132. The pinned answer is 15688.
    input_set: "One HaulerTicket, its consignment's container_tare_grams and staged_weight_grams (frozen at stage time), and its hauler's rate card."
    constants:
      SURCHARGE_TIER_1_CENTS: 5000
      SURCHARGE_TIER_2_CENTS: 15000
      VARIANCE_TOLERANCE_PCT: 5.00
      VARIANCE_CREDIT_RATE: 0.10
    precision: "billable_tonnes 4 decimals; variance_pct 2 decimals; all money whole cents; round_half_up throughout; variance comparison is strict (>)"

  - name: data_quality_scan
    trigger: "POST /data-quality-scans"
    algorithm: chronological
    formula: |
      # Deterministic creation order: all MISSED_CAPTURE findings first, then DUPLICATE_ENTRY,
      # then WEIGHT_OUTLIER. Within each group the order is as stated below. `id` is never
      # used for ordering.
      SHIFTS = { Shift : site_id == request.site_id AND shift_date == request.scan_date }
      STATIONS = { TrackingStation : site_id == request.site_id AND status == ACTIVE }
      A) MISSED_CAPTURE — for each (station, shift) pair in STATIONS x SHIFTS, ordered by
         station.station_code ASC then shift.shift_code ASC (AM, PM, NIGHT), emit one finding when
         no WasteEntry exists with that station_id and shift_id and status IN {RECORDED, FLAGGED,
         SUPERSEDED}. waste_entry_id is null.
      B) DUPLICATE_ENTRY — consider entries of SHIFTS with status IN {RECORDED, FLAGGED}, sorted by
         captured_at ASC with created_at ASC as tie-break. For each entry, emit one finding on that
         entry when an EARLIER entry in the sort order shares station_id, food_type_id and
         weight_grams and satisfies
           (this.captured_at - earlier.captured_at) <= DUPLICATE_WINDOW_SECONDS   (inclusive)
         The finding is attached to the LATER entry only.
      C) WEIGHT_OUTLIER — entries of SHIFTS with status IN {RECORDED, FLAGGED} and
         weight_grams >= OUTLIER_GRAMS_THRESHOLD, sorted by captured_at ASC then created_at ASC.
      D) IDEMPOTENCE — a candidate finding is skipped when a DataQualityFinding already exists with
         status == OPEN and the identical (finding_type, site_id, station_id, shift_id,
         waste_entry_id) tuple. Findings already CONFIRMED or DISMISSED do NOT suppress a re-emit.
      The endpoint returns exactly the findings it created, in creation order.
    input_set: "Shifts of the scanned site on exactly the scan_date; RETIRED and MAINTENANCE stations are excluded from MISSED_CAPTURE; VOIDED entries are invisible to all three rules."
    constants:
      DUPLICATE_WINDOW_SECONDS: 300
      OUTLIER_GRAMS_THRESHOLD: 25000
    precision: "integer second comparison, inclusive; integer gram comparison, inclusive"

  - name: corporate_rollup_metrics
    trigger: "POST /corporate-rollups and re-computed once inside state_machines.CorporateRollup.DRAFT_to_PUBLISHED before the snapshot is frozen"
    algorithm: aggregation
    formula: |
      in_scope_site_count = length(site_ids)
      E = { WasteEntry : site_id IN site_ids AND status IN {RECORDED, FLAGGED}
                         AND date(captured_at) BETWEEN period_start AND period_end (inclusive) }
      total_captured_weight_grams = sum(weight_grams over E)
      total_valued_cost_cents     = sum(effective_cost_cents over E)
      L = { ConsignmentLine : consignment.site_id IN site_ids
                              AND consignment.settlement_status == SETTLED
                              AND consignment.logistics_status != CANCELLED
                              AND date(consignment.pickup_window_start)
                                  BETWEEN period_start AND period_end (inclusive) }
      total_diverted_weight_grams = sum(allocated_weight_grams over L)
      diversion_rate_pct = null when total_captured_weight_grams == 0
                           else round_half_up(total_diverted_weight_grams
                                              / total_captured_weight_grams * 100, 2)
      sites_on_track_count = count(site in site_ids : EXISTS ReductionTarget
                                   WHERE site_id == site AND status == ACTIVE
                                     AND attainment_state == ACHIEVED_PENDING)
      goal_attainment_state = ALL_ON_TRACK  when sites_on_track_count == in_scope_site_count
                            = NONE_ON_TRACK when sites_on_track_count == 0
                            = PARTIAL       otherwise
    input_set: "Only the explicitly listed site_ids; SUPERSEDED / PROPOSED / ACHIEVED / MISSED targets never count toward sites_on_track_count — only status == ACTIVE does."
    constants: {}
    precision: "grams and cents integers; diversion_rate_pct 2 decimals round_half_up"

# ---------------------------------------------------------------------------
# 1.4 Validation Rules Table (evaluated in ascending priority; first violation wins)
# ---------------------------------------------------------------------------
validations:
  - priority: 10
    rule: "X-User-Role header is present and is one of the six declared roles; when the endpoint's roles are not ['*'] the X-User-ID header is also present and non-empty"
    category: auth
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "every endpoint except POST /_clock/set_current_utc"

  - priority: 20
    rule: "X-User-Role is listed in the target endpoint's roles"
    category: auth
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "every endpoint whose roles are not ['*']"

  - priority: 25
    rule: "For an entity_backed role, the X-User-ID must resolve to an existing row of that role's backing entity (Site for SiteSustainabilityManager, Hauler for HaulerOperator)"
    category: auth
    error_id: ERR_IDENTITY_NOT_RECOGNIZED
    http_status: 403
    applies_to: "every endpoint reachable by SiteSustainabilityManager or HaulerOperator"

  - priority: 30
    rule: "Request body parses; every required input field is present; every field has the declared JSON type; every enum field holds a declared member; integers declared non-negative are >= 0; decimal strings match the declared scale; date fields are YYYY-MM-DD and timestamps are RFC3339 UTC with a trailing Z; declared range invariants hold (start_date <= end_date, window_start <= window_end, pickup_window_start < pickup_window_end, ingredients is non-empty, site_ids is non-empty)"
    category: schema
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "every endpoint that accepts a body"

  - priority: 35
    rule: "limit is an integer in [1, 100] (the response_envelope.pagination_defaults max) and offset is an integer >= 0"
    category: schema
    error_id: ERR_INVALID_PAGINATION
    http_status: 400
    applies_to: "every list endpoint"

  - priority: 40
    rule: "Every {id} path parameter resolves to an existing row of its entity"
    category: existence
    error_id: "the owning entity's *_NOT_FOUND error (ERR_SITE_NOT_FOUND, ERR_STATION_NOT_FOUND, ERR_FOOD_TYPE_NOT_FOUND, ERR_RECIPE_NOT_FOUND, ERR_SHIFT_NOT_FOUND, ERR_ENTRY_NOT_FOUND, ERR_BASELINE_NOT_FOUND, ERR_TARGET_NOT_FOUND, ERR_HAULER_NOT_FOUND, ERR_CONSIGNMENT_NOT_FOUND, ERR_LINE_NOT_FOUND, ERR_TICKET_NOT_FOUND, ERR_ALERT_NOT_FOUND, ERR_FINDING_NOT_FOUND, ERR_ROLLUP_NOT_FOUND)"
    http_status: 404
    applies_to: "every endpoint with a path parameter"

  - priority: 45
    rule: "Every foreign key supplied in the request body resolves to an existing row (site_id, station_id, food_type_id, recipe_id, shift_id, waste_entry_id, corrects_entry_id, baseline_period_id, hauler_id, consignment_id, and every member of site_ids)"
    category: existence
    error_id: "the referenced entity's *_NOT_FOUND error"
    http_status: 404
    applies_to: "POST /tracking-stations, POST /recipes, POST /shifts, POST /waste-entries, POST /waste-entries/{id}/corrections, POST /baseline-periods, POST /reduction-targets, POST /diversion-consignments, POST /consignment-lines, POST /hauler-tickets, POST /data-quality-scans, POST /corporate-rollups"

  - priority: 50
    rule: "A SiteSustainabilityManager may only act on rows whose site_id equals their X-User-ID"
    category: auth
    error_id: ERR_SITE_SCOPE_VIOLATION
    http_status: 403
    applies_to: "every write endpoint reachable by SiteSustainabilityManager"

  - priority: 52
    rule: "A HaulerOperator may only act on a DiversionConsignment or HaulerTicket whose hauler_id equals their X-User-ID. On POST /hauler-tickets the compared value is the ticket's OWN hauler_id — the one supplied in the body, or, when the body omits it, the value defaulted from the referenced consignment"
    category: auth
    error_id: ERR_HAULER_SCOPE_VIOLATION
    http_status: 403
    applies_to: "POST /hauler-tickets, POST /diversion-consignments/{id}/dispatch"

  - priority: 55
    rule: "The supplied OCC token matches the current version of the parent row named by the §1.2.1 rule (expected_entry_version against WasteEntry.version, expected_site_version against Site.version)"
    category: concurrency
    error_id: "the rule's error_id (ERR_STALE_ENTRY_VERSION, ERR_STALE_SITE_VERSION)"
    http_status: 412
    applies_to: "POST /waste-entries/{id}/corrections, POST /reduction-targets"

  - priority: 60
    rule: "The target row is in a state from which the requested transition is declared in §1.2"
    category: state
    error_id: "the entity's ERR_INVALID_*_STATE error, or the more specific ERR_ROLLUP_ALREADY_PUBLISHED / ERR_TICKET_ALREADY_SUBMITTED / ERR_ENTRY_ROUTED_CANNOT_VOID / ERR_RECIPE_NOT_PUBLISHED where §1.2 names one"
    http_status: 409
    applies_to: "every action endpoint"

  - priority: 65
    rule: "Cross-entity state preconditions hold: capture requires TrackingStation.status == ACTIVE (ERR_STATION_NOT_ACTIVE) and a non-lapsed calibration (ERR_STATION_CALIBRATION_OVERDUE) and Shift.status == OPEN (ERR_INVALID_SHIFT_STATE); a recipe_id supplied at capture must reference a PUBLISHED Recipe (ERR_RECIPE_NOT_PUBLISHED); ReductionTarget activation requires its BaselinePeriod.status == CERTIFIED (ERR_BASELINE_NOT_CERTIFIED); consignment dispatch requires Hauler.status == APPROVED (ERR_HAULER_NOT_APPROVED)"
    category: business_state
    error_id: "the specific error named in the rule text"
    http_status: 409
    applies_to: "POST /waste-entries, POST /waste-entries/{id}/corrections, POST /reduction-targets/{id}/activate, POST /diversion-consignments/{id}/dispatch"

  - priority: 70
    rule: "The acting X-User-ID is not the same identity that performed the conflicting earlier step: a ShiftLead may not void an entry whose captured_by_user_id equals their X-User-ID, and a CorporateSustainabilityLead may not publish a rollup whose prepared_by_user_id equals their X-User-ID"
    category: auth
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /waste-entries/{id}/void, POST /corporate-rollups/{id}/publish"

  - priority: 75
    rule: "The routed food is eligible for the consignment's channel: DONATION requires FoodType.donation_eligible == true AND stream == PRE_CONSUMER; ANIMAL_FEED requires FoodType.animal_feed_eligible == true; COMPOST accepts any food type"
    category: business_safety
    error_id: ERR_CHANNEL_INELIGIBLE_FOOD
    http_status: 422
    applies_to: "POST /consignment-lines"

  - priority: 78
    rule: "A DONATION consignment may not be staged while its Site.coaching_posture is ESCALATED"
    category: business_safety
    error_id: ERR_SITE_POSTURE_BLOCKS_DONATION
    http_status: 422
    applies_to: "POST /diversion-consignments/{id}/stage"

  - priority: 80
    rule: "Referenced rows belong to the same aggregate: the entry's shift_id and station_id must both carry the request's site_id; a ConsignmentLine's WasteEntry.site_id must equal the consignment's site_id; a correcting entry must target an entry of the same site, shift and station; a HaulerTicket's hauler_id must equal the consignment's hauler_id; a rollup's site_ids must be distinct"
    category: business_referential
    error_id: "ERR_ENTRY_SITE_MISMATCH (entry/line/correction), ERR_TICKET_HAULER_MISMATCH (ticket), ERR_DUPLICATE_SITE_IN_SCOPE (rollup)"
    http_status: 409
    applies_to: "POST /waste-entries, POST /waste-entries/{id}/corrections, POST /consignment-lines, POST /hauler-tickets, POST /corporate-rollups"

  - priority: 82
    rule: "captured_at is not in the future relative to the logical clock (ERR_CAPTURE_IN_FUTURE) and date(captured_at) equals Shift.shift_date (ERR_CAPTURE_OUTSIDE_SHIFT_DATE)"
    category: business_temporal
    error_id: "ERR_CAPTURE_IN_FUTURE, ERR_CAPTURE_OUTSIDE_SHIFT_DATE"
    http_status: 422
    applies_to: "POST /waste-entries, POST /waste-entries/{id}/corrections"

  - priority: 85
    rule: "On a DONATION-channel consignment the routed food must still be inside its shelf life: consignment.pickup_window_start must be no later than entry.captured_at + FoodType.donation_shelf_life_hours (inclusive endpoint)"
    category: business_temporal
    error_id: ERR_DONATION_WINDOW_EXPIRED
    http_status: 422
    applies_to: "POST /consignment-lines"

  - priority: 90
    rule: "Interval-occupancy rules: a capture must not fall inside another RECORDED/FLAGGED entry's station lock interval [captured_at, captured_at + capture_lock_seconds + STATION_TURNAROUND_SECONDS] where STATION_TURNAROUND_SECONDS is 60, with BOTH ends inclusive (ERR_STATION_OCCUPIED); a new BaselinePeriod must not overlap an existing non-REJECTED period of the same site on the inclusive date interval [start_date, end_date] (ERR_BASELINE_WINDOW_OVERLAP)"
    category: business_overlap
    error_id: "ERR_STATION_OCCUPIED, ERR_BASELINE_WINDOW_OVERLAP"
    http_status: 409
    applies_to: "POST /waste-entries, POST /waste-entries/{id}/corrections, POST /baseline-periods"

  - priority: 92
    rule: "Aggregate hauler window capacity: the count of the hauler's consignments with logistics_status IN {DRAFT, STAGED, DISPATCHED} whose half-open interval [pickup_window_start, pickup_window_end) intersects the requested half-open interval must remain below Hauler.max_concurrent_pickups. Adjacent windows that merely touch at an endpoint do not intersect."
    category: business_overlap
    error_id: ERR_HAULER_WINDOW_CAPACITY
    http_status: 409
    applies_to: "POST /diversion-consignments"

  - priority: 95
    rule: "allocated_weight_grams must be >= 1 and <= the target WasteEntry.unrouted_weight_grams"
    category: business_constraint
    error_id: ERR_ALLOCATION_EXCEEDS_UNROUTED
    http_status: 422
    applies_to: "POST /consignment-lines"

  - priority: 97
    rule: "The consignment's channel must be listed in Hauler.channels"
    category: business_referential
    error_id: ERR_HAULER_CHANNEL_UNSUPPORTED
    http_status: 422
    applies_to: "POST /diversion-consignments"

  - priority: 98
    rule: "A ReductionTarget's window_start must be strictly after the bound BaselinePeriod.end_date, so the performance window never overlaps the baseline it is measured against"
    category: business_temporal
    error_id: ERR_TARGET_WINDOW_BEFORE_BASELINE
    http_status: 422
    applies_to: "POST /reduction-targets"

  - priority: 100
    rule: "Uniqueness: (hauler_id, ticket_number) is unique (ERR_DUPLICATE_TICKET_NUMBER); (site_id, shift_date, shift_code) is unique (ERR_DUPLICATE_SHIFT); (site_id, station_code) is unique (ERR_DUPLICATE_STATION_CODE); site_code is globally unique (ERR_DUPLICATE_SITE_CODE); recipe_code is globally unique (ERR_DUPLICATE_RECIPE_CODE); FoodType.name is globally unique (ERR_DUPLICATE_FOOD_TYPE_NAME); Hauler.name is globally unique (ERR_DUPLICATE_HAULER_NAME); a consignment may carry at most one HaulerTicket whose status != DISPUTED (ERR_TICKET_ALREADY_SUBMITTED); a WasteEntry may be corrected at most once (ERR_ENTRY_ALREADY_CORRECTED)"
    category: business_uniqueness
    error_id: "the specific error named in the rule text"
    http_status: 409
    applies_to: "POST /sites, POST /food-types, POST /recipes, POST /haulers, POST /tracking-stations, POST /shifts, POST /hauler-tickets, POST /waste-entries/{id}/corrections"

  - priority: 105
    rule: "The consignment's staged_weight_grams must not exceed Hauler.capacity_kg_per_pickup * 1000"
    category: business_fiscal
    error_id: ERR_HAULER_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /diversion-consignments/{id}/stage"

  - priority: 110
    rule: "A CorporateRollup may not be published while any in-scope site has a DataQualityFinding with status == OPEN (the finding's detected_at is irrelevant; any still-open finding on an in-scope site blocks publication)"
    category: business_constraint
    error_id: ERR_ROLLUP_DATA_QUALITY_BLOCKED
    http_status: 409
    applies_to: "POST /corporate-rollups/{id}/publish"

  - priority: 115
    rule: "Empty-set guards: a BaselinePeriod with baseline_entry_count == 0 cannot be submitted (ERR_BASELINE_NO_DATA); a DiversionConsignment with line_count == 0 cannot be staged (ERR_CONSIGNMENT_EMPTY); a scan whose site has no ACTIVE station and no shift on scan_date is still a 200 with an empty array, not an error"
    category: business_constraint
    error_id: "ERR_BASELINE_NO_DATA, ERR_CONSIGNMENT_EMPTY"
    http_status: 422
    applies_to: "POST /baseline-periods/{id}/submit, POST /diversion-consignments/{id}/stage"

  - priority: 120
    rule: "loss_reason must be compatible with station_kind: PLATE_WASTE is only accepted at a DISH_RETURN station, TRIM / OVERPRODUCTION / SPOILAGE are only accepted at a PREP or HOT_LINE station, and EXPIRATION / CONTAMINATION are accepted at any station kind"
    category: business_constraint
    error_id: ERR_LOSS_REASON_STATION_MISMATCH
    http_status: 422
    applies_to: "POST /waste-entries, POST /waste-entries/{id}/corrections"

  - priority: 130
    rule: "The logical clock never moves backwards: the supplied current_utc must be strictly greater than the stored clock value"
    category: business_temporal
    error_id: ERR_CLOCK_NOT_MONOTONIC
    http_status: 422
    applies_to: "POST /_clock/set_current_utc"

