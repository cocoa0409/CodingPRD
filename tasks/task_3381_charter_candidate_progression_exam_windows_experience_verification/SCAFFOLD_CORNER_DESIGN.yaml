            - *c_level1
          trigger:
            - call: "POST /charter/exam-windows"
              payload: {}
              as: Proctor
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 403 and error_id == ERR_FORBIDDEN_ROLE"
            - "error_id != ERR_INVALID_REQUEST despite the empty payload"

