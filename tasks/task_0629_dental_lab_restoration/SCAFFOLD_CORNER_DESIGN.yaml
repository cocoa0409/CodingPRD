              payload: {}
              as: LabTech
              captures: { unit1: "$.data[0].id", unit2: "$.data[1].id" }
            - call: "POST /mill-jobs"
              payload: { fabrication_unit_id: "${unit1}", mill_machine_id: "${mach_id}", start_at: "2026-01-01T09:00:00Z", duration_minutes: 60 }
              as: Scheduler
              captures: { job1: "$.data.id" }
            - call: "POST /mill-jobs"
              payload: { fabrication_unit_id: "${unit2}", mill_machine_id: "${mach_id}", start_at: "2026-01-01T10:00:00Z", duration_minutes: 60 }
              as: Scheduler
              captures: { job2: "$.data.id" }
            - call: "POST /cases/${case_id}/start-fabrication"
              payload: {}
              as: LabTech
            - call: "POST /mill-jobs/${job1}/start"
              payload: { expected_machine_version: "${mach_v0}" }
              as: Scheduler
          trigger:
            - call: "POST /mill-jobs/${job2}/start"
              payload: { expected_machine_version: "${mach_v0}" }
              as: Scheduler
              captures: { err: "$.data.error_id" }
          assert:
            - "response error_id == ERR_STALE_MACHINE_VERSION (412) — the first start bumped MillMachine.version so the original mach_v0 is now stale"

      - name: occ_stale_case_version_on_verdict_covered
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[tryin-verdict-stale-case]", "errors[ERR_STALE_CASE_VERSION]"]
        excluded_because:
          difficulty_instance: non_linear_state_machine / case_tryin_revision_cycle
          rationale: "Case OCC on tryin-verdict (expected_case_version) is exercised by every §1.8 verdict trigger; the stale-version negative path mirrors the machine-version corner above on the Case parent."

      - name: cascade_cancel_frees_machine_covered
        claim_type: cascading_side_effects
        grounds: [state_machines.Case.DESIGN_to_CANCELLED]
        excluded_because:
          difficulty_instance: transitive_cascade / cancel_cascade_milljob_machine_release
          rationale: "The cancel -> milljob-cancel -> interval-free cascade is the named §1.8 instance."

      - name: rate_threshold_tier_boundary_covered
        claim_type: rate_threshold_triggers
        grounds: [calculations.invoice_total]
        excluded_because:
          difficulty_instance: dual_variant_calc / invoice_provisional_vs_final_tier_crossing
          rationale: "Doctor volume-tier boundary (4->5 crossing) is asserted by the named §1.8 instance."

  # =========================================================================
  - section: consistency_model
    instances:
      - name: immediate_visibility_of_provisional_invoice
        claim_type: immediate
        grounds: [state_machines.Case.INTAKE_to_DESIGN, entities.Invoice.fields.subtotal_cents]
        distinguishing_aspect: "The provisional Invoice and its computed subtotal are visible immediately after submit (GET /cases/{id}/invoice right after submit returns the populated invoice)."
        test_recipe:
          setup: ["a single-crown case just submitted"]
          setup_api_calls:
            - call: "POST /doctors"
              payload: { full_name: "Dr CM1", practice_name: "P", email: "cm1@x.com" }
              as: LabAdmin
              captures: { doc_id: "$.data.id" }
            - call: "POST /materials"
              payload: { code: "ZCM1", name: "Zir", base_unit_price_cents: 12000, fabrication_process: "MILLED" }
              as: LabAdmin
              captures: { mat_id: "$.data.id" }
            - call: "POST /cases"
              payload: { doctor_id: "${doc_id}", intake_method: "INTRAORAL_SCAN" }
              as: LabTech
              captures: { case_id: "$.data.id" }
            - call: "POST /cases/${case_id}/restorations"
              payload: { material_id: "${mat_id}", restoration_type: "CROWN", unit_count: 1, requested_shade: "A2" }
              as: LabTech
            - call: "POST /cases/${case_id}/submit"
              payload: {}
              as: LabTech
          trigger:
            - call: "GET /cases/${case_id}/invoice"
              payload: {}
              as: Billing
              captures: { sub: "$.data[0].subtotal_cents" }
          assert:
            - "Invoice.subtotal_cents == 12000 immediately after submit (no lag; immediate consistency)"
