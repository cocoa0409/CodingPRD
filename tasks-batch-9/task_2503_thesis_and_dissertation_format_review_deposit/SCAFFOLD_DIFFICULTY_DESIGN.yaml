# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Task 2503 — Thesis and Dissertation Format Review & Deposit
# Nine §0.5 rule_ids × 2 differentiated instances = 18 instances.
# Every literal in `assert:` was computed by executing the §1.3 formula with its
# declared constants against the pinned setup; the logical clock starts at
# 2026-08-01T00:00:00Z and is moved only through POST /graduate-school/_clock/set_current_utc.
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: embargo_release_anchor_diverges_between_full_and_partial_approval
        grounds:
          - calculations.embargo_release_date
          - entities.EmbargoRequest.fields.release_anchor
          - entities.EmbargoRequest.fields.release_date
          - entities.RepositoryDeposit.fields.embargo_release_date
          - state_machines.EmbargoRequest.REQUESTED_to_APPROVED
          - state_machines.EmbargoRequest.REQUESTED_to_PARTIALLY_APPROVED
        distinguishing_aspect: |
          Two theses deposited at the identical instant 2026-12-08T11:00:00Z with the identical
          approved_months == 12 land on different release_date values (2027-12-08T11:00:00Z vs
          2027-12-18T00:00:00Z) because the deposit_anchored variant measures from
          RepositoryDeposit.deposited_at while the conferral_anchored variant measures from
          Term.degree_conferral_date — the variant is selected by governing.status APPROVED vs
          PARTIALLY_APPROVED, not by any field of the deposit.
        test_recipe:
          setup:
            - "Term 2026FA is OPEN with format_review_deposit_deadline 2026-12-04T17:00:00Z and degree_conferral_date 2026-12-18T00:00:00Z."
            - "Two MASTERS candidates each own one THESIS of 101 pages with third_party_item_count 0, an APPROVED 3-seat committee sharing the same chair, a HELD_PASS defense, a CLEARED screening and an ACCEPTED cycle-1 format review decided by analyst-1 on 2026-10-12T09:00:00Z (turnaround_bdays 5)."
            - "Thesis A carries an APPROVED PATENT_PENDING embargo of 12 months; thesis B carries a PARTIALLY_APPROVED SENSITIVE_DATA embargo shortened from 18 to 12 months."
            - "The logical clock stands at 2026-12-08T11:00:00Z, four calendar days past the deposit deadline."
          setup_api_calls:
            - call: "POST /graduate-school/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: Registrar
              as_user_id: "reg-1"
            - call: "POST /graduate-school/terms"
              payload: { code: "2026FA", defense_deadline: "2026-11-13T23:59:59Z", format_review_deposit_deadline: "2026-12-04T17:00:00Z", degree_conferral_date: "2026-12-18T00:00:00Z", announcement_lead_business_days: 10 }
              as: Registrar
              as_user_id: "reg-1"
              captures: { term_id: $.data.id }
            - call: "POST /graduate-school/students"
              payload: { full_name: "Ada Stone", email: "ada@u.edu", degree_level: "MASTERS", program_code: "CS" }
              as: Registrar
              as_user_id: "reg-1"
              captures: { stu_a_id: $.data.id }
            - call: "POST /graduate-school/students"
              payload: { full_name: "Ben Ruiz", email: "ben@u.edu", degree_level: "MASTERS", program_code: "CS" }
              as: Registrar
              as_user_id: "reg-1"
              captures: { stu_b_id: $.data.id }
            - call: "POST /graduate-school/faculty-members"
              payload: { full_name: "Cara Cho", email: "cho@u.edu", appointment_type: "TENURED", graduate_faculty_certified: true }
              as: Registrar
              as_user_id: "reg-1"
              captures: { fac_chair_id: $.data.id }
            - call: "POST /graduate-school/faculty-members"
              payload: { full_name: "Dev Mehta", email: "dev@u.edu", appointment_type: "TENURE_TRACK", graduate_faculty_certified: true }
              as: Registrar
              as_user_id: "reg-1"
              captures: { fac_m1_id: $.data.id }
            - call: "POST /graduate-school/faculty-members"
              payload: { full_name: "Eli Novak", email: "eli@u.edu", appointment_type: "ADJUNCT" }
              as: Registrar
              as_user_id: "reg-1"
              captures: { fac_m2_id: $.data.id }
            - call: "POST /graduate-school/defense-rooms"
              payload: { code: "R101", building: "Graduate Hall", seat_capacity: 40, turnover_buffer_minutes: 30 }
              as: Registrar
              as_user_id: "reg-1"
              captures: { room_id: $.data.id }
            - call: "POST /graduate-school/theses"
              payload: { student_id: "${stu_a_id}", term_id: "${term_id}", title: "Thesis A", document_type: "THESIS", page_count: 101, third_party_item_count: 0 }
              as: Student
              as_user_id: "${stu_a_id}"
              captures: { thesis_a_id: $.data.id }
            - call: "POST /graduate-school/committees"
