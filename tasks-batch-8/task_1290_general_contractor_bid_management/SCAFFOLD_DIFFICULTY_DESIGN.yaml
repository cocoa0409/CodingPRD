              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 and error_id == ERR_PACKAGE_NOT_ACCEPTING_BIDS (state, priority 5)"
            - "error_id != ERR_BID_BOND_INSUFFICIENT (fiscal, priority 9, also violated: required 100000 > 50000)"
            - "BidPackage.${pkg}.submitted_bid_count == 0 (no partial write)"

      - name: bid_create_safety_vs_temporal_priority
        grounds:
          - validations[priority=6]
          - validations[priority=8]
        distinguishing_aspect: |
          Error-category pair business_safety vs business_temporal (different
          pair than state-vs-fiscal): a bid create violating BOTH the prequal
          gate (no APPROVED application, priority 6) AND the strict deadline
          (clock past bid_due_at, priority 8) returns ERR_PREQUAL_NOT_APPROVED.
        test_recipe:
          setup:
            - "Sub invited and BIDDING but its application is REJECTED (no current approval)"
            - "Package PUBLISHED; logical clock advanced to 2026-08-11T00:00:00Z (past due 2026-08-10T14:00:00Z) without closing"
          setup_api_calls:
            - call: "POST /subcontractors"
              payload: { legal_name: "Prio Two LLC", contact_email: "p2@x.com", license_number: "LIC-P-702" }
              as: Anonymous
              captures: { sub_p: $.data.id }
            - call: "POST /prequal-applications"
              payload: { subcontractor_id: "${sub_p}", declared_annual_revenue_cents: 2500000000, declared_emr: 0.90, declared_bonding_capacity_cents: 1000000000 }
              as: Subcontractor
              as_user_id: "${sub_p}"
              captures: { app_p: $.data.id }
            - call: "POST /prequal-applications/${app_p}/decision"
              payload: { decision: "REJECTED", review_notes: "insufficient bonding" }
              as: PrequalReviewer
            - call: "POST /bid-packages"
              payload: { name: "Priority Package 2", trade_code: "051200", bid_due_at: "2026-08-10T14:00:00Z" }
              as: LeadEstimator
              captures: { pkg: $.data.id }
            - call: "POST /invitations"
              payload: { bid_package_id: "${pkg}", subcontractor_id: "${sub_p}" }
              as: LeadEstimator
              captures: { inv_p: $.data.id }
            - call: "POST /invitations/${inv_p}/respond"
              payload: { intent: "BIDDING" }
              as: Subcontractor
              as_user_id: "${sub_p}"
            - call: "POST /bid-packages/${pkg}/publish"
              as: LeadEstimator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-11T00:00:00Z" }
              as: LeadEstimator
          trigger:
            - call: "POST /bids"
              payload: { bid_package_id: "${pkg}", base_bid_cents: 1000000, bond_amount_cents: 50000 }
              as: Subcontractor
              as_user_id: "${sub_p}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422 and error_id == ERR_PREQUAL_NOT_APPROVED (business_safety, priority 6)"
            - "error_id != ERR_BID_DEADLINE_PASSED (business_temporal, priority 8, also violated)"

  - rule_id: boundary_precision_check
    instances:
      - name: bid_bond_exactly_required_amount_passes
        grounds:
          - calculations.required_bid_bond
          - errors[ERR_BID_BOND_INSUFFICIENT]
        distinguishing_aspect: |
          Money-metric boundary on POST /bids: required = round_half_up
          (2000000 * 0.05) = 100000; bond exactly 100000 passes (>=), bond
          99999 fails — one cent below the boundary.
        test_recipe:
          setup:
            - "Subs X and Y registered, prequal APPROVED, invited, BIDDING; package PUBLISHED, default pct 0.05, due 2026-08-10T14:00:00Z (clock at default 2026-08-01)"
          setup_api_calls:
            - call: "POST /subcontractors"
              payload: { legal_name: "X Bond LLC", contact_email: "xb@x.com", license_number: "LIC-X-801" }
              as: Anonymous
              captures: { sub_x: $.data.id }
            - call: "POST /subcontractors"
              payload: { legal_name: "Y Bond LLC", contact_email: "yb@x.com", license_number: "LIC-Y-801" }
              as: Anonymous
              captures: { sub_y: $.data.id }
            - call: "POST /prequal-applications"
              payload: { subcontractor_id: "${sub_x}", declared_annual_revenue_cents: 3000000000, declared_emr: 0.80, declared_bonding_capacity_cents: 1500000000 }
              as: Subcontractor
              as_user_id: "${sub_x}"
              captures: { app_x: $.data.id }
            - call: "POST /prequal-applications/${app_x}/decision"
              payload: { decision: "APPROVED", verified_annual_revenue_cents: 4000000000, verified_emr: 0.80, verified_bonding_capacity_cents: 2000000000 }
              as: PrequalReviewer
            - call: "POST /prequal-applications"
              payload: { subcontractor_id: "${sub_y}", declared_annual_revenue_cents: 3000000000, declared_emr: 0.80, declared_bonding_capacity_cents: 1500000000 }
              as: Subcontractor
              as_user_id: "${sub_y}"
              captures: { app_y: $.data.id }
            - call: "POST /prequal-applications/${app_y}/decision"
              payload: { decision: "APPROVED", verified_annual_revenue_cents: 4000000000, verified_emr: 0.80, verified_bonding_capacity_cents: 2000000000 }
              as: PrequalReviewer
            - call: "POST /bid-packages"
              payload: { name: "Bond Boundary Package", trade_code: "051200", bid_due_at: "2026-08-10T14:00:00Z" }
              as: LeadEstimator
              captures: { pkg: $.data.id }
            - call: "POST /invitations"
              payload: { bid_package_id: "${pkg}", subcontractor_id: "${sub_x}" }
              as: LeadEstimator
              captures: { inv_x: $.data.id }
            - call: "POST /invitations"
              payload: { bid_package_id: "${pkg}", subcontractor_id: "${sub_y}" }
              as: LeadEstimator
              captures: { inv_y: $.data.id }
            - call: "POST /invitations/${inv_x}/respond"
              payload: { intent: "BIDDING" }
              as: Subcontractor
              as_user_id: "${sub_x}"
            - call: "POST /invitations/${inv_y}/respond"
              payload: { intent: "BIDDING" }
              as: Subcontractor
              as_user_id: "${sub_y}"
            - call: "POST /bid-packages/${pkg}/publish"
              as: LeadEstimator
          trigger:
            - call: "POST /bids"
              payload: { bid_package_id: "${pkg}", base_bid_cents: 2000000, bond_amount_cents: 100000 }
              as: Subcontractor
              as_user_id: "${sub_x}"
              captures: { bid_x: $.data.id }
            - call: "POST /bids"
              payload: { bid_package_id: "${pkg}", base_bid_cents: 2000000, bond_amount_cents: 99999 }
              as: Subcontractor
              as_user_id: "${sub_y}"
              captures: { err: $.data.error_id }
          assert:
            - "X: HTTP 201, Bid.${bid_x}.status == SUBMITTED (bond 100000 == required 100000, >= passes)"
            - "Y: HTTP 402 and error_id == ERR_BID_BOND_INSUFFICIENT (99999 < 100000)"
            - "BidPackage.${pkg}.submitted_bid_count == 1"

      - name: revision_at_exact_deadline_rejected
        grounds:
          - validations[priority=8]
          - state_machines.Bid.SUBMITTED_to_SUBMITTED
        distinguishing_aspect: |
          Time-metric boundary on a different endpoint (POST
          /bids/{id}/revisions): acceptance requires now STRICTLY before
          bid_due_at. At 13:59 (1 minute before, inside the 60-minute
          last-minute window) the revision lands flagged is_last_minute; at
          exactly 14:00:00Z the identical revision is rejected.
        test_recipe:
          setup:
            - "Package PUBLISHED due 2026-08-10T14:00:00Z; sub prequalified, BIDDING; bid SUBMITTED base 1000000 bond 50000"
          setup_api_calls:
            - call: "POST /subcontractors"
              payload: { legal_name: "T Minute LLC", contact_email: "t@x.com", license_number: "LIC-T-802" }
              as: Anonymous
              captures: { sub_t: $.data.id }
            - call: "POST /prequal-applications"
              payload: { subcontractor_id: "${sub_t}", declared_annual_revenue_cents: 3000000000, declared_emr: 0.80, declared_bonding_capacity_cents: 1500000000 }
              as: Subcontractor
              as_user_id: "${sub_t}"
              captures: { app_t: $.data.id }
            - call: "POST /prequal-applications/${app_t}/decision"
              payload: { decision: "APPROVED", verified_annual_revenue_cents: 4000000000, verified_emr: 0.80, verified_bonding_capacity_cents: 2000000000 }
              as: PrequalReviewer
            - call: "POST /bid-packages"
              payload: { name: "Deadline Package", trade_code: "051200", bid_due_at: "2026-08-10T14:00:00Z" }
              as: LeadEstimator
              captures: { pkg: $.data.id }
            - call: "POST /invitations"
              payload: { bid_package_id: "${pkg}", subcontractor_id: "${sub_t}" }
              as: LeadEstimator
              captures: { inv_t: $.data.id }
            - call: "POST /invitations/${inv_t}/respond"
              payload: { intent: "BIDDING" }
              as: Subcontractor
              as_user_id: "${sub_t}"
            - call: "POST /bid-packages/${pkg}/publish"
              as: LeadEstimator
            - call: "POST /bids"
              payload: { bid_package_id: "${pkg}", base_bid_cents: 1000000, bond_amount_cents: 50000 }
              as: Subcontractor
              as_user_id: "${sub_t}"
              captures: { bid_t: $.data.id, bid_v1: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T13:59:00Z" }
              as: LeadEstimator
          trigger:
            - call: "POST /bids/${bid_t}/revisions"
              payload: { new_base_bid_cents: 990000, expected_bid_version: "${bid_v1}", note: "phone-in at 13:59" }
              as: Subcontractor
              as_user_id: "${sub_t}"
              captures: { bid_v2: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T14:00:00Z" }
              as: LeadEstimator
            - call: "POST /bids/${bid_t}/revisions"
              payload: { new_base_bid_cents: 980000, expected_bid_version: "${bid_v2}", note: "too late" }
              as: Subcontractor
              as_user_id: "${sub_t}"
              captures: { err: $.data.error_id }
          assert:
            - "13:59 revision: HTTP 200, Bid.${bid_t}.base_bid_cents == 990000, version advanced (${bid_v2} == ${bid_v1} + 1)"
            - "GET /bids/${bid_t}/revisions row sequence 2 has is_last_minute == true (1 minute <= 60-minute window)"
            - "14:00:00Z revision (exactly the deadline): HTTP 422 and error_id == ERR_BID_DEADLINE_PASSED (strict <)"
            - "Bid.${bid_t}.base_bid_cents remains 990000"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: bid_create_requires_current_approved_prequal
        grounds:
          - state_machines.Bid.null_to_SUBMITTED
          - validations[priority=6]
        distinguishing_aspect: |
          Entity pair Bid -> PrequalApplication: Bid creation is gated on the
          SUBCONTRACTOR's PrequalApplication being APPROVED and unexpired;
          the identical bid payload fails while the application is REJECTED
          and succeeds after resubmission and approval.
        test_recipe:
          setup:
            - "Sub invited, BIDDING; package PUBLISHED; application currently REJECTED"
          setup_api_calls:
            - call: "POST /subcontractors"
              payload: { legal_name: "Gate LLC", contact_email: "g@x.com", license_number: "LIC-G-901" }
              as: Anonymous
              captures: { sub_g: $.data.id }
            - call: "POST /prequal-applications"
              payload: { subcontractor_id: "${sub_g}", declared_annual_revenue_cents: 2500000000, declared_emr: 0.90, declared_bonding_capacity_cents: 1000000000 }
              as: Subcontractor
              as_user_id: "${sub_g}"
              captures: { app_g: $.data.id }
            - call: "POST /prequal-applications/${app_g}/decision"
              payload: { decision: "REJECTED" }
              as: PrequalReviewer
            - call: "POST /bid-packages"
              payload: { name: "Gate Package", trade_code: "051200", bid_due_at: "2026-08-10T14:00:00Z" }
              as: LeadEstimator
              captures: { pkg: $.data.id }
            - call: "POST /invitations"
              payload: { bid_package_id: "${pkg}", subcontractor_id: "${sub_g}" }
              as: LeadEstimator
              captures: { inv_g: $.data.id }
            - call: "POST /invitations/${inv_g}/respond"
              payload: { intent: "BIDDING" }
              as: Subcontractor
              as_user_id: "${sub_g}"
            - call: "POST /bid-packages/${pkg}/publish"
              as: LeadEstimator
          trigger:
            - call: "POST /bids"
              payload: { bid_package_id: "${pkg}", base_bid_cents: 1000000, bond_amount_cents: 50000 }
              as: Subcontractor
              as_user_id: "${sub_g}"
              captures: { err: $.data.error_id }
            - call: "POST /prequal-applications/${app_g}/resubmit"
              payload: { declared_annual_revenue_cents: 3000000000, declared_emr: 0.80, declared_bonding_capacity_cents: 1500000000 }
              as: Subcontractor
              as_user_id: "${sub_g}"
            - call: "POST /prequal-applications/${app_g}/decision"
              payload: { decision: "APPROVED", verified_annual_revenue_cents: 4000000000, verified_emr: 0.80, verified_bonding_capacity_cents: 2000000000 }
              as: PrequalReviewer
            - call: "POST /bids"
              payload: { bid_package_id: "${pkg}", base_bid_cents: 1000000, bond_amount_cents: 50000 }
              as: Subcontractor
              as_user_id: "${sub_g}"
              captures: { bid_g: $.data.id }
          assert:
            - "First POST /bids: HTTP 422, error_id == ERR_PREQUAL_NOT_APPROVED (Bid blocked by PrequalApplication state)"
            - "Second POST /bids (after approval): HTTP 201, Bid.${bid_g}.status == SUBMITTED"
            - "BidPackage.${pkg}.submitted_bid_count == 1 (failed attempt left no residue)"

      - name: publish_requires_invitation_existence
        grounds:
          - state_machines.BidPackage.DRAFT_to_PUBLISHED
          - errors[ERR_NO_INVITED_BIDDERS]
        distinguishing_aspect: |
          Entity pair BidPackage -> Invitation (different pair than
          Bid -> PrequalApplication): the package cannot leave DRAFT until at
          least one Invitation row exists for it.
        test_recipe:
          setup:
            - "Package DRAFT with zero invitations; sub registered"
          setup_api_calls:
            - call: "POST /bid-packages"
              payload: { name: "Empty Invite Package", trade_code: "033000", bid_due_at: "2026-08-10T14:00:00Z" }
              as: LeadEstimator
              captures: { pkg: $.data.id }
            - call: "POST /subcontractors"
              payload: { legal_name: "Invitee LLC", contact_email: "i@x.com", license_number: "LIC-I-902" }
              as: Anonymous
              captures: { sub_i: $.data.id }
          trigger:
            - call: "POST /bid-packages/${pkg}/publish"
              as: LeadEstimator
              captures: { err: $.data.error_id }
            - call: "POST /invitations"
              payload: { bid_package_id: "${pkg}", subcontractor_id: "${sub_i}" }
              as: LeadEstimator
            - call: "POST /bid-packages/${pkg}/publish"
              as: LeadEstimator
          assert:
            - "First publish: HTTP 422, error_id == ERR_NO_INVITED_BIDDERS, package stays DRAFT"
            - "Second publish (after invitation exists): HTTP 200, BidPackage.${pkg}.status == PUBLISHED"

  - rule_id: resource_temporal_overlap
    instances:
      - name: interview_room_half_open_overlap
        grounds:
          - state_machines.PostBidInterview.null_to_SCHEDULED
          - errors[ERR_INTERVIEW_ROOM_OVERLAP]
        distinguishing_aspect: |
          Half-open interval semantics [start, end) on the interview_room
          resource: 10:30-11:30 collides with a SCHEDULED 10:00-11:00 booking
          (409), but 11:00-12:00 is adjacency (end == start) and is accepted;
          a different room at 10:30 is also accepted.
        test_recipe:
          setup:
            - "Package TABULATED with compliant bids X and Y (both SUBMITTED)"
          setup_api_calls:
            - call: "POST /subcontractors"
