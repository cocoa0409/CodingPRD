            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-10T12:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /api/transactions", payload: { card_id: "${card_id}", tender_type: "CAMPUS_CASH", amount_cents: 500, idempotency_key: "cyc-2", merchant_id: "${m_id}" }, as: MerchantUser, as_user_id: "${m_id}" }
