            - "GET /parts-allocations with remedy_part_id == ${part_id} returns total_count == 1, namely ${alloc1_id}"

      - name: campaign_version_advances_by_one_on_each_accepted_write
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.RecallCampaign
          - entities.RecallCampaign
        distinguishing_aspect: |
          Version is a write counter, not a field counter: creation lands on 1, the determination takes
          it to 2 and the defect notice to 3, each step advancing by exactly one even though the second
          write touches five stored fields at once.
        test_recipe:
          setup:
            - "The clock reads 2026-08-03T09:00:00Z; campaign 26V-344 does not exist yet."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
