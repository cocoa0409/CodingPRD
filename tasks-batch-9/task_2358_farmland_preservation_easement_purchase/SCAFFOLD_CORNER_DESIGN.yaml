              call: "POST /appraisals/${appr_t3_id}/review"
              payload: { decision: "CERTIFY" }
              as: AppraisalReviewer
              as_user_id: "reviewer-1"
            - *k_clk_1001
            - &k_rank_r3
              call: "POST /funding-rounds/${round3_id}/rank"
              payload: { score_basis: "RECEIPT_BASIS" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - *k_clk_1005
            - &k_get_app_t3_v1
              call: "GET /applications/${app_t3_id}"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { app_t3_v1: $.data.version }
            - &k_offer_t3
              call: "POST /applications/${app_t3_id}/offers"
              payload: { expected_application_version: "${app_t3_v1}", offer_cents: 25000000, structure: "FULL_PURCHASE", offer_expires_on: "2026-11-19T00:00:00Z" }
              as: AcquisitionOfficer
              as_user_id: "officer-1"
            - &k_get_app_t3_v2
              call: "GET /applications/${app_t3_id}"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { app_t3_v2: $.data.version }
          trigger:
            - &k_plan_t3_attempt
              call: "POST /applications/${app_t3_id}/funding-plan"
              payload: { expected_application_version: "${app_t3_v2}", target_closing_date: "2027-01-15T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /funding-sources/${src3_fed_b_id}/suspension"
              payload: { reason: "tranche B rescinded by the federal partner" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - *k_plan_t3_attempt
            - call: "POST /funding-sources/${src3_loc_a_id}/suspension"
              payload: { reason: "county match withdrawn" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - *k_plan_t3_attempt
            - call: "POST /funding-sources/${src3_state_b_id}/suspension"
              payload: { reason: "series B bond authorization lapsed" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - *k_plan_t3_attempt
          assert:
            - "Application.${app_t3_id}.composite_score == 65.00 and status == RANKED"
            - "Application.${app_t3_id}.certified_easement_value_cents == 25000000 and total_program_cost_cents == 25500000"
            - "the first plan attempt sweeps FED_A 11475000 and FED_B 11475000 and LOC_A 2550000, and returns HTTP 409 with error.code == ERR_FEDERAL_SHARE_EXCEEDED because 22950000 > floor(25500000 * 0.50) == 12750000"
            - "the second plan attempt sweeps FED_A 11475000, LOC_A 8925000 and STATE_A 5100000, clears the federal cap and the 6375000 local minimum, and returns HTTP 409 with error.code == ERR_MATCH_RATIO_UNSATISFIED because the non-federal total 14025000 < round_half_up(11475000 * 2.0) == 22950000"
            - "the third plan attempt sweeps FED_A 11475000, STATE_A 10200000, LOC_B 1275000 and STATE_B 2550000 and returns HTTP 409 with error.code == ERR_LOCAL_MATCH_SHORTFALL because the local total 1275000 < ceil(25500000 * 0.25) == 6375000"
            - "the third plan attempt reports ERR_LOCAL_MATCH_SHORTFALL and NOT ERR_MATCH_RATIO_UNSATISFIED, even though the match ratio on FED_A is also unsatisfied"
            - "the fourth plan attempt can reach only 11475000 + 10200000 + 1275000 == 22950000 of the 25500000 target and returns HTTP 409 with error.code == ERR_FUNDING_SHORTFALL"
            - "Application.${app_t3_id}.funding_plan_status is still UNFUNDED and GET /funding-commitments?application_id=${app_t3_id} returns total_count == 0"
            - "Application.${app_t3_id}.version is unchanged across all four rejected plan attempts"

      - name: priority_conflict_state_error_outranks_the_funding_plan_error
        claim_type: Priority conflict
        grounds:
          - validations[priority=12]
          - validations[priority=27]
        excluded_because:
          difficulty_instance: withdrawn_application_acceptance_reports_state_error_over_funding_error
          rationale: "That §1.8 instance builds an application that is both WITHDRAWN and short of its funding plan and asserts ERR_INVALID_APPLICATION_STATE wins over ERR_FUNDING_PLAN_INCOMPLETE."

      - name: priority_conflict_segregation_of_duties_outranks_the_title_exception_error
        claim_type: Priority conflict
        grounds:
          - validations[priority=16]
          - validations[priority=23]
        excluded_because:
          difficulty_instance: closing_requirement_review_reports_segregation_of_duties_over_title_exception_error
          rationale: "That §1.8 instance has the submitting user accept a TITLE_COMMITMENT that still carries exceptions and asserts ERR_CLOSING_REVIEW_SOD wins over ERR_TITLE_EXCEPTIONS_OUTSTANDING."

      - name: cross_entity_parcel_eligibility_gates_application_filing
        claim_type: Cross-entity validation
        grounds:
          - validations[priority=22]
          - errors[ERR_PARCEL_NOT_ELIGIBLE]
        excluded_because:
          difficulty_instance: application_filing_is_gated_by_the_parcel_eligibility_dimension
          rationale: "That §1.8 instance files against a parcel whose status has moved off ELIGIBLE and against one whose restricted value is not below its unrestricted value."

      - name: cascading_validation_blocks_amendment_submission_under_a_stewardship_hold
        claim_type: Cascading validation
        grounds:
          - validations[priority=17]
          - errors[ERR_EASEMENT_NOT_COMPLIANT]
        excluded_because:
          difficulty_instance: amendment_submission_is_gated_by_the_easement_compliance_dimension_under_strict_policy
          rationale: "That §1.8 instance opens a violation, lets the hold cascade onto the easement, and asserts the amendment submission is refused under STRICT policy."

      - name: temporal_validation_of_overlapping_monitoring_windows
        claim_type: Temporal validation
        grounds:
          - validations[priority=20]
          - errors[ERR_MONITORING_WINDOW_OVERLAP]
        excluded_because:
          difficulty_instance: monitoring_visit_windows_are_half_open_and_cancelled_visits_free_the_window
          rationale: "That §1.8 instance probes the half-open window at the touching instant and shows a cancelled visit stops occupying it."

      - name: temporal_validation_of_buffered_appraisal_engagements
        claim_type: Temporal validation
        grounds:
          - validations[priority=19]
          - errors[ERR_APPRAISAL_ENGAGEMENT_CONFLICT]
        excluded_because:
          difficulty_instance: appraisal_engagements_are_closed_intervals_widened_by_a_three_day_buffer
          rationale: "That §1.8 instance probes the closed interval widened by appraisal_engagement_buffer_days on both sides and shows REJECTED appraisals stop blocking."

  # ===========================================================================
  - section: endpoints
    instances:

      - name: funding_source_crud_surface_creates_reads_and_filters_the_collection
        claim_type: Standard CRUD
        grounds:
          - endpoints[POST /funding-sources]
          - endpoints[GET /funding-sources/{id}]
          - endpoints[GET /funding-sources]
          - entities.FundingSource
          - response_envelope.pagination_fields
        distinguishing_aspect: "The FundingSource surface is create + read + filtered list only: the detail read echoes the match terms and the three derived ledger columns at their zero state, and the collection filters independently on program_id, level and status while paginating."
        test_recipe:
          setup:
            - "Program P1 exists with its three canonical sources LOCAL 60,000,000, STATE 120,000,000 and FEDERAL 200,000,000. No application has been filed, so every ledger column is still zero."
          setup_api_calls:
            - *k_prog1
            - *k_src_local
            - *k_src_state
            - *k_src_fed
          trigger:
            - call: "GET /funding-sources/${src_fed_id}"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "GET /funding-sources"
              payload: { program_id: "${prog_id}", level: "FEDERAL" }
              as: AcquisitionOfficer
              as_user_id: "officer-1"
            - call: "GET /funding-sources"
              payload: { program_id: "${prog_id}", status: "ACTIVE", limit: 2, offset: 0 }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "GET /funding-sources"
              payload: { program_id: "${prog_id}", status: "ACTIVE", limit: 2, offset: 2 }
              as: ProgramAdmin
              as_user_id: "admin-1"
          assert:
            - "the first trigger call returns HTTP 200 with FundingSource.${src_fed_id}.level == FEDERAL and authorized_cents == 200000000"
            - "FundingSource.${src_fed_id}.requires_match == true and match_ratio == 1.0 and priority_order == 3"
            - "FundingSource.${src_fed_id}.reserved_cents == 0 and committed_cents == 0 and available_cents == 200000000"
            - "FundingSource.${src_fed_id}.status == ACTIVE and version == 1"
            - "the second trigger call returns total_count == 1 and the single row's id == ${src_fed_id}"
            - "the third trigger call returns 2 rows with total_count == 3 and has_more == true"
            - "the fourth trigger call returns 1 row with total_count == 3 and has_more == false"

      - name: withdrawal_action_endpoint_records_its_reason_and_releases_the_parcel
        claim_type: Action endpoint
        grounds:
          - endpoints[POST /applications/{id}/withdrawal]
          - state_machines.Application.RECEIVED_to_WITHDRAWN
          - entities.Application.fields.withdrawal_reason
          - errors[ERR_INVALID_APPLICATION_STATE]
        distinguishing_aspect: "The withdrawal action is a single POST that carries only a reason string, yet it terminates the application, writes withdrawal_reason verbatim, and hands the parcel back from UNDER_APPLICATION to ELIGIBLE; replaying it on the now-terminal row is refused."
        test_recipe:
          setup:
            - "Round R1 is OPEN and application AP1 was filed at clock 2026-08-10, so Parcel PA1 sits in UNDER_APPLICATION."
          setup_api_calls:
            - *k_prog1
            - *k_src_local
            - *k_src_state
            - *k_src_fed
            - *k_round1
            - *k_round1_open
            - *k_lo_a
            - *k_clk_0810
            - *k_parcel_a
            - *k_app_a
          trigger:
            - call: "POST /applications/${app_a_id}/withdrawal"
              payload: { withdrawal_reason: "landowner enrolled in a lease program instead" }
              as: Landowner
              as_user_id: "${lo_a_id}"
            - call: "GET /applications"
              payload: { funding_round_id: "${round1_id}", status: "WITHDRAWN" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /applications/${app_a_id}/withdrawal"
              payload: { withdrawal_reason: "duplicate request" }
              as: Landowner
              as_user_id: "${lo_a_id}"
          assert:
            - "the first trigger call returns HTTP 200 with Application.${app_a_id}.status == WITHDRAWN"
            - "Application.${app_a_id}.withdrawal_reason == landowner enrolled in a lease program instead"
            - "Parcel.${parcel_a_id}.status == ELIGIBLE again and Parcel.${parcel_a_id}.version == 3"
            - "the second trigger call returns total_count == 1 with the row id == ${app_a_id}"
            - "the third trigger call returns HTTP 409 with error.code == ERR_INVALID_APPLICATION_STATE"
            - "Application.${app_a_id}.withdrawal_reason is still the first reason after the rejected replay"

      - name: stewardship_sweep_is_one_bulk_action_that_reports_per_category_counts_and_is_idempotent
        claim_type: Bulk action
        grounds:
          - endpoints[POST /stewardship-sweeps]
          - state_machines.FundingRound.SELECTED_to_CLOSED
          - state_machines.FundingSource.ACTIVE_to_EXPIRED
          - state_machines.Easement.MONITORING_CURRENT_to_MONITORING_DUE
          - state_machines.Easement.MONITORING_DUE_to_MONITORING_DELINQUENT
          - calculations.stewardship_due_projection
        distinguishing_aspect: "One bodyless sweep closes the finished round and moves the easement to MONITORING_DUE; a second sweep 25 days later crosses the grace boundary into MONITORING_DELINQUENT and expires all three sources whose obligation window ended 2027-12-31; a third sweep at the same instant changes nothing and reports every count as zero."
        test_recipe:
          setup:
            - "The canonical chain has recorded Easement EA1 at clock 2026-12-15, so next_monitoring_due_on is 2027-12-15 with a 30-day grace ending 2028-01-14."
            - "Round R1 is SELECTED and its only application is CLOSED_RECORDED. All three sources have obligation_window_end 2027-12-31 and are still ACTIVE because none crossed its 0.95 obligation threshold."
          setup_api_calls:
            - *k_prog1
            - *k_src_local
            - *k_src_state
            - *k_src_fed
            - *k_round1
            - *k_round1_open
            - *k_lo_a
            - *k_clk_0810
            - *k_parcel_a
            - *k_app_a
            - *k_appraisal_a
            - *k_clk_0820
            - *k_appr_submit_a
            - *k_appr_certify_a
            - *k_clk_1001
            - *k_rank_r1
            - *k_clk_1005
            - *k_get_app_a_v1
            - *k_offer_a
            - *k_get_app_a_v2
            - *k_plan_a
            - *k_clk_1012
            - *k_accept_a
            - *k_get_req_title
            - *k_get_req_sub
            - *k_get_req_survey
            - *k_submit_req_title
            - *k_review_req_title
            - *k_submit_req_sub
            - *k_review_req_sub
            - *k_submit_req_survey
            - *k_review_req_survey
            - *k_clk_1215
            - *k_close_a
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-12-20T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /stewardship-sweeps"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2028-01-14T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /stewardship-sweeps"
              payload: {}
              as: StewardshipMonitor
              as_user_id: "monitor-1"
            - call: "POST /stewardship-sweeps"
              payload: {}
              as: StewardshipMonitor
              as_user_id: "monitor-1"
          assert:
            - "the second trigger call returns HTTP 200 with swept_easement_count == 1, due_count == 1 and delinquent_count == 0"
            - "the second trigger call reports closed_round_count == 1, expired_source_count == 0, lapsed_offer_count == 0, escalated_violation_count == 0, cleared_to_compliant_count == 0 and terminated_easement_count == 0"
            - "after the second trigger call Easement.${ease_a_id}.stewardship_status == MONITORING_DUE and FundingRound.${round1_id}.status == CLOSED"
            - "the fourth trigger call returns swept_easement_count == 1, due_count == 0, delinquent_count == 1 and expired_source_count == 3"
            - "the fourth trigger call reports closed_round_count == 0 because the round is already CLOSED"
            - "after the fourth trigger call Easement.${ease_a_id}.stewardship_status == MONITORING_DELINQUENT and all of ${src_local_id}, ${src_state_id}, ${src_fed_id} have status == EXPIRED"
            - "the fifth trigger call returns swept_easement_count == 1 with due_count, delinquent_count, expired_source_count, closed_round_count, lapsed_offer_count, escalated_violation_count, cleared_to_compliant_count and terminated_easement_count all == 0"
            - "Easement.${ease_a_id}.version is identical before and after the fifth trigger call"

      - name: violation_links_to_the_monitoring_visit_that_produced_it_and_cross_easement_links_are_rejected
        claim_type: Cross-reference link
        grounds:
          - endpoints[POST /violations]
          - endpoints[GET /monitoring-visits/{id}/violations]
          - endpoints[GET /easements/{id}/violations]
          - validations[priority=24]
          - errors[ERR_VISIT_EASEMENT_MISMATCH]
        distinguishing_aspect: "monitoring_visit_id is an optional cross-reference that must point at a visit on the SAME easement: with two recorded easements, linking EA1's violation to EPT's visit returns 409 ERR_VISIT_EASEMENT_MISMATCH, while the correctly paired link returns 201 and becomes visible from both the visit and the easement collections."
        test_recipe:
          setup:
            - "Program P1 carries a fourth source, LOCAL Regional Greenway Fund of 100,000,000 at priority 4, so two applications in Round R1 can both be funded."
            - "Parcel PT is 40.00 acres, all prime, fully contiguous, 100 ft frontage, no sewer, 10.0-acre zoning and carries NO mortgage lienholder, so its acceptance creates only two closing requirements."
            - "Application APT is planned and accepted first (local take 8,925,000), then AP1 is planned (local 51,075,000 plus 5,052,724 from the greenway fund) and accepted; both close at clock 2026-12-15 producing Easements EPT and EA1."
            - "At clock 2027-12-20 one monitoring visit is scheduled on each easement and the EA1 visit is completed with an observation well inside its allowance."
          setup_api_calls:
            - *k_prog1
            - *k_src_local
            - *k_src_state
            - *k_src_fed
