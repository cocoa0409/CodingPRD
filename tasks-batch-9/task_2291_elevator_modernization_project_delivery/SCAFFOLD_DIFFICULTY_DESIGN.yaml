          setup:
            - "One jurisdiction with fire_service_required true, reinspection_extension_hours 24, inspection_lead_days 10."
            - "One project holding exactly one car, delivered through a PASSED inspection: car ACCEPTED and CODE_ACCEPTED, its FIRE_SERVICE_PHASE_I_II trigger SATISFIED, its OutageWindow COMPLETED with end_at 2026-08-12T18:00:00Z, project status CLOSEOUT."
