      - name: only_the_assigned_auditor_may_drive_the_audit_lifecycle
        claim_type: role_ownership
        grounds:
          - validations[priority=7]
          - errors.ERR_AUDITOR_MISMATCH
          - state_machines.TrustAudit.SCHEDULED_to_FIELDWORK
          - roles.TrustAuditor
        distinguishing_aspect: |
          The audit is bound to ONE auditor's X-User-ID, and the two ways of getting it wrong give
          two different errors: a LicensingAnalyst - who may schedule the audit - is not on the
          fieldwork endpoint's roles list and gets ERR_FORBIDDEN_ROLE at priority 2, while a genuine
          TrustAuditor who is simply not this audit's auditor gets ERR_AUDITOR_MISMATCH at priority 7.
          Priority 7 also outranks the state check at priority 9, so the wrong auditor attacking a
          FIELDWORK audit with a valid ISSUE_FINDINGS body still gets the mismatch.
        test_recipe:
          setup:
            - "Harbor Realty Group is ACTIVE with Dana Broker ACTIVE and self-supervising"
            - "escrow account TA carries OBLIGATION_OPENED 1000000 and DEPOSIT 800000, so book_available_cents is -200000 against a 1000000 obligation"
