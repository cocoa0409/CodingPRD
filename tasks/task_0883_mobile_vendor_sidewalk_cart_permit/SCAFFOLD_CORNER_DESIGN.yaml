scaffold_corner_design:
  # =========================================================================
  # Entities — creation, retrieval, computed/system fields
  # =========================================================================
  - section: entities
    instances:
      - name: create_vendor_returns_defaults
        claim_type: Creation
        grounds: ["entities.Vendor", "endpoints"]
        distinguishing_aspect: "POST /vendors with required fields -> 201; status ACTIVE, insurance_status NONE, balance_owed_cents 0, version 1."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: PermitOfficer }
          trigger:
            - { call: "POST /vendors", payload: { legal_name: "Acme", contact_email: "a@x.com", seniority_years: 3 }, as: PermitOfficer, captures: { v1: "$.data.id", st: "$.data.status", ins: "$.data.insurance_status", bal: "$.data.balance_owed_cents", ver: "$.data.version" } }
          assert:
            - "response code 201; Vendor.${v1}.status == ACTIVE; insurance_status == NONE; balance_owed_cents == 0; version == 1"

      - name: vendor_not_found_returns_404
        claim_type: Not Found
        grounds: ["entities.Vendor", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /vendors/{unknown} -> ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: PermitOfficer }
          trigger:
            - { call: "GET /vendors/00000000-0000-4000-8000-000000000000", payload: {}, as: PermitOfficer, captures: { err: "$.data.error_id" } }
          assert:
            - "response code 404; error_id == ERR_NOT_FOUND"

      - name: create_cart_missing_required_field_returns_validation
        claim_type: Required Fields
        grounds: ["entities.Cart", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /carts without size_sqft -> ERR_VALIDATION (400)."
        test_recipe:
          setup: ["Vendor v1 and commissary c1 exist."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: PermitOfficer }
            - { call: "POST /vendors", payload: { legal_name: "V1", contact_email: "v1@x.com", seniority_years: 0 }, as: PermitOfficer, captures: { v1: "$.data.id" } }
            - { call: "POST /commissaries", payload: { name: "C1", health_grade: "A", license_expires_at: "2027-01-01T00:00:00Z" }, as: HealthInspector, captures: { c1: "$.data.id" } }
          trigger:
            - { call: "POST /carts", payload: { vendor_id: "${v1}", commissary_id: "${c1}", cart_type: "FOOD" }, as: Vendor, as_user_id: "${v1}", captures: { err: "$.data.error_id" } }
          assert:
            - "response code 400; error_id == ERR_VALIDATION (size_sqft missing)"

      - name: create_cart_invalid_enum_returns_invalid_enum
        claim_type: Type Constraints
        grounds: ["entities.Cart", "errors[ERR_INVALID_ENUM]"]
        distinguishing_aspect: "POST /carts with cart_type 'HOTDOG' (not a member) -> ERR_INVALID_ENUM (422)."
        test_recipe:
          setup: ["Vendor v1 and commissary c1 exist."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: PermitOfficer }
            - { call: "POST /vendors", payload: { legal_name: "V1", contact_email: "v1@x.com", seniority_years: 0 }, as: PermitOfficer, captures: { v1: "$.data.id" } }
            - { call: "POST /commissaries", payload: { name: "C1", health_grade: "A", license_expires_at: "2027-01-01T00:00:00Z" }, as: HealthInspector, captures: { c1: "$.data.id" } }
          trigger:
            - { call: "POST /carts", payload: { vendor_id: "${v1}", commissary_id: "${c1}", cart_type: "HOTDOG", size_sqft: 30 }, as: Vendor, as_user_id: "${v1}", captures: { err: "$.data.error_id" } }
          assert:
            - "response code 422; error_id == ERR_INVALID_ENUM"

      - name: permit_computed_fee_and_points_ignore_client_input
        claim_type: Computed Fields
        grounds: ["entities.Permit.fields.fee_amount_cents", "entities.Permit.fields.violation_points"]
        distinguishing_aspect: "Permit fee_amount_cents/violation_points are server-computed; POST /permits does not accept them and issue sets fee deterministically."
        test_recipe:
          setup: ["Vendor v1 (active insurance), cart1 APPROVED, STANDARD zone z1."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: PermitOfficer }
            - { call: "POST /vendors", payload: { legal_name: "V1", contact_email: "v1@x.com", seniority_years: 0 }, as: PermitOfficer, captures: { v1: "$.data.id" } }
            - { call: "POST /vendors/${v1}/insurance", payload: { insurance_effective_at: "2026-05-01T00:00:00Z", insurance_expires_at: "2027-05-01T00:00:00Z", insurance_coverage_cents: 100000000 }, as: Vendor, as_user_id: "${v1}" }
            - { call: "POST /commissaries", payload: { name: "C1", health_grade: "A", license_expires_at: "2027-01-01T00:00:00Z" }, as: HealthInspector, captures: { c1: "$.data.id" } }
            - { call: "POST /carts", payload: { vendor_id: "${v1}", commissary_id: "${c1}", cart_type: "FOOD", size_sqft: 30 }, as: Vendor, as_user_id: "${v1}", captures: { cart1: "$.data.id" } }
            - { call: "POST /carts/${cart1}/inspect", payload: { inspection_type: "HEALTH", result: "PASS", score: 95, inspection_expires_at: "2026-12-01T00:00:00Z" }, as: HealthInspector }
            - { call: "POST /carts/${cart1}/approve", payload: {}, as: PermitOfficer }
            - { call: "POST /zones", payload: { name: "Z1", zone_type: "STANDARD", capacity_slots: 5, spacing_min_feet: 20 }, as: PermitOfficer, captures: { z1: "$.data.id" } }
            - { call: "POST /permits", payload: { vendor_id: "${v1}", cart_id: "${cart1}", zone_id: "${z1}", permit_type: "FOOD" }, as: Vendor, as_user_id: "${v1}", captures: { p1: "$.data.id", pts0: "$.data.violation_points" } }
            - { call: "POST /permits/${p1}/submit", payload: {}, as: Vendor, as_user_id: "${v1}" }
          trigger:
            - { call: "POST /permits/${p1}/issue", payload: {}, as: PermitOfficer, captures: { fee: "$.data.fee_amount_cents" } }
          assert:
            - "Permit.${p1}.violation_points == 0 at creation; fee_amount_cents == 34257 after issue (server-computed)"

  # =========================================================================
  # State machines — invalid transitions, terminal lockdown, initial state
  # =========================================================================
  - section: state_machines
    instances:
      - name: submit_already_submitted_permit_invalid_state
        claim_type: Invalid Transitions
        grounds: ["state_machines.Permit.DRAFT_to_SUBMITTED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "POST /permits/{id}/submit on an already SUBMITTED permit -> ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["Permit p1 SUBMITTED."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: PermitOfficer }
            - { call: "POST /vendors", payload: { legal_name: "V1", contact_email: "v1@x.com", seniority_years: 0 }, as: PermitOfficer, captures: { v1: "$.data.id" } }
            - { call: "POST /commissaries", payload: { name: "C1", health_grade: "A", license_expires_at: "2027-01-01T00:00:00Z" }, as: HealthInspector, captures: { c1: "$.data.id" } }
            - { call: "POST /carts", payload: { vendor_id: "${v1}", commissary_id: "${c1}", cart_type: "FOOD", size_sqft: 30 }, as: Vendor, as_user_id: "${v1}", captures: { cart1: "$.data.id" } }
            - { call: "POST /zones", payload: { name: "Z1", zone_type: "STANDARD", capacity_slots: 5, spacing_min_feet: 20 }, as: PermitOfficer, captures: { z1: "$.data.id" } }
            - { call: "POST /permits", payload: { vendor_id: "${v1}", cart_id: "${cart1}", zone_id: "${z1}", permit_type: "FOOD" }, as: Vendor, as_user_id: "${v1}", captures: { p1: "$.data.id" } }
            - { call: "POST /permits/${p1}/submit", payload: {}, as: Vendor, as_user_id: "${v1}" }
          trigger:
            - { call: "POST /permits/${p1}/submit", payload: {}, as: Vendor, as_user_id: "${v1}", captures: { err: "$.data.error_id" } }
          assert:
            - "response code 409; error_id == ERR_INVALID_STATE"

      - name: revoke_then_reinstate_terminal_lockdown
        claim_type: Terminal State Lockdown
        grounds: ["state_machines.Permit.SUSPENDED_to_REVOKED", "errors[ERR_TERMINAL_STATE]"]
        distinguishing_aspect: "Reinstating a REVOKED permit -> ERR_TERMINAL_STATE (409); REVOKED is terminal."
        test_recipe:
          setup: ["Permit p1 ISSUED -> SUSPENDED -> REVOKED."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: PermitOfficer }
            - { call: "POST /vendors", payload: { legal_name: "V1", contact_email: "v1@x.com", seniority_years: 0 }, as: PermitOfficer, captures: { v1: "$.data.id" } }
            - { call: "POST /vendors/${v1}/insurance", payload: { insurance_effective_at: "2026-05-01T00:00:00Z", insurance_expires_at: "2027-05-01T00:00:00Z", insurance_coverage_cents: 100000000 }, as: Vendor, as_user_id: "${v1}" }
            - { call: "POST /commissaries", payload: { name: "C1", health_grade: "A", license_expires_at: "2027-01-01T00:00:00Z" }, as: HealthInspector, captures: { c1: "$.data.id" } }
            - { call: "POST /carts", payload: { vendor_id: "${v1}", commissary_id: "${c1}", cart_type: "FOOD", size_sqft: 30 }, as: Vendor, as_user_id: "${v1}", captures: { cart1: "$.data.id" } }
            - { call: "POST /carts/${cart1}/inspect", payload: { inspection_type: "HEALTH", result: "PASS", score: 95, inspection_expires_at: "2026-12-01T00:00:00Z" }, as: HealthInspector }
            - { call: "POST /carts/${cart1}/approve", payload: {}, as: PermitOfficer }
            - { call: "POST /zones", payload: { name: "Z1", zone_type: "STANDARD", capacity_slots: 5, spacing_min_feet: 20 }, as: PermitOfficer, captures: { z1: "$.data.id" } }
            - { call: "POST /permits", payload: { vendor_id: "${v1}", cart_id: "${cart1}", zone_id: "${z1}", permit_type: "FOOD" }, as: Vendor, as_user_id: "${v1}", captures: { p1: "$.data.id" } }
            - { call: "POST /permits/${p1}/submit", payload: {}, as: Vendor, as_user_id: "${v1}" }
            - { call: "POST /permits/${p1}/issue", payload: {}, as: PermitOfficer }
            - { call: "POST /permits/${p1}/suspend", payload: { reason: "hold" }, as: PermitOfficer }
            - { call: "POST /permits/${p1}/revoke", payload: {}, as: PermitOfficer }
          trigger:
            - { call: "POST /permits/${p1}/reinstate", payload: {}, as: PermitOfficer, captures: { err: "$.data.error_id" } }
          assert:
            - "response code 409; error_id == ERR_TERMINAL_STATE"

      - name: contest_uncited_state_from_upheld_invalid_state
        claim_type: Invalid Transitions
        grounds: ["state_machines.Violation.ISSUED_to_CONTESTED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Contesting an already-UPHELD violation -> ERR_INVALID_STATE; contest is only legal from ISSUED."
        test_recipe:
          setup: ["Permit p1 ISSUED; violation vio UPHELD."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: PermitOfficer }
            - { call: "POST /vendors", payload: { legal_name: "V1", contact_email: "v1@x.com", seniority_years: 0 }, as: PermitOfficer, captures: { v1: "$.data.id" } }
            - { call: "POST /vendors/${v1}/insurance", payload: { insurance_effective_at: "2026-05-01T00:00:00Z", insurance_expires_at: "2027-05-01T00:00:00Z", insurance_coverage_cents: 100000000 }, as: Vendor, as_user_id: "${v1}" }
            - { call: "POST /commissaries", payload: { name: "C1", health_grade: "A", license_expires_at: "2027-01-01T00:00:00Z" }, as: HealthInspector, captures: { c1: "$.data.id" } }
            - { call: "POST /carts", payload: { vendor_id: "${v1}", commissary_id: "${c1}", cart_type: "FOOD", size_sqft: 30 }, as: Vendor, as_user_id: "${v1}", captures: { cart1: "$.data.id" } }
            - { call: "POST /carts/${cart1}/inspect", payload: { inspection_type: "HEALTH", result: "PASS", score: 95, inspection_expires_at: "2026-12-01T00:00:00Z" }, as: HealthInspector }
            - { call: "POST /carts/${cart1}/approve", payload: {}, as: PermitOfficer }
            - { call: "POST /zones", payload: { name: "Z1", zone_type: "STANDARD", capacity_slots: 5, spacing_min_feet: 20 }, as: PermitOfficer, captures: { z1: "$.data.id" } }
            - { call: "POST /permits", payload: { vendor_id: "${v1}", cart_id: "${cart1}", zone_id: "${z1}", permit_type: "FOOD" }, as: Vendor, as_user_id: "${v1}", captures: { p1: "$.data.id" } }
            - { call: "POST /permits/${p1}/submit", payload: {}, as: Vendor, as_user_id: "${v1}" }
            - { call: "POST /permits/${p1}/issue", payload: {}, as: PermitOfficer }
            - { call: "POST /permits/${p1}/violations", payload: { violation_type: "MINOR", description: "x" }, as: EnforcementOfficer, as_user_id: "off-1", captures: { vio: "$.data.id" } }
            - { call: "POST /violations/${vio}/adjudicate", payload: { outcome: "UPHOLD" }, as: EnforcementOfficer, as_user_id: "off-2" }
          trigger:
            - { call: "POST /violations/${vio}/contest", payload: {}, as: Vendor, as_user_id: "${v1}", captures: { err: "$.data.error_id" } }
          assert:
            - "response code 409; error_id == ERR_INVALID_STATE (violation not ISSUED)"

      - name: draw_already_drawn_lottery_not_open
        claim_type: Idempotency
        grounds: ["state_machines.Lottery.OPEN_to_DRAWN", "errors[ERR_LOTTERY_NOT_OPEN]"]
        distinguishing_aspect: "Drawing a lottery twice -> second draw ERR_LOTTERY_NOT_OPEN (409)."
        test_recipe:
          setup: ["PRIME zone z1 with one spot; lottery lot1 OPEN and already DRAWN."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: PermitOfficer }
            - { call: "POST /zones", payload: { name: "P1", zone_type: "PRIME", capacity_slots: 1, spacing_min_feet: 20 }, as: PermitOfficer, captures: { z1: "$.data.id" } }
            - { call: "POST /zones/${z1}/spots", payload: { label: "PS1", position_feet: 50 }, as: PermitOfficer, captures: { spot1: "$.data.id" } }
            - { call: "POST /lotteries", payload: { zone_id: "${z1}", entry_fee_cents: 2500, term_start_at: "2026-07-01T09:00:00Z", term_end_at: "2026-07-01T17:00:00Z" }, as: PermitOfficer, captures: { lot1: "$.data.id" } }
            - { call: "POST /lotteries/${lot1}/draw", payload: {}, as: PermitOfficer }
          trigger:
            - { call: "POST /lotteries/${lot1}/draw", payload: {}, as: PermitOfficer, captures: { err: "$.data.error_id" } }
          assert:
            - "response code 409; error_id == ERR_LOTTERY_NOT_OPEN"

      - name: impound_release_twice_invalid_state
        claim_type: Invalid Transitions
        grounds: ["state_machines.Impound.HELD_to_RELEASED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Releasing an already-RELEASED impound -> ERR_INVALID_STATE."
        test_recipe:
          setup: ["Cart1 APPROVED then impounded; impound imp1 released once."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: PermitOfficer }
            - { call: "POST /vendors", payload: { legal_name: "V1", contact_email: "v1@x.com", seniority_years: 0 }, as: PermitOfficer, captures: { v1: "$.data.id" } }
            - { call: "POST /commissaries", payload: { name: "C1", health_grade: "A", license_expires_at: "2027-01-01T00:00:00Z" }, as: HealthInspector, captures: { c1: "$.data.id" } }
            - { call: "POST /carts", payload: { vendor_id: "${v1}", commissary_id: "${c1}", cart_type: "FOOD", size_sqft: 30 }, as: Vendor, as_user_id: "${v1}", captures: { cart1: "$.data.id" } }
            - { call: "POST /carts/${cart1}/inspect", payload: { inspection_type: "HEALTH", result: "PASS", score: 90, inspection_expires_at: "2026-12-01T00:00:00Z" }, as: HealthInspector }
            - { call: "POST /carts/${cart1}/approve", payload: {}, as: PermitOfficer }
            - { call: "POST /carts/${cart1}/impounds", payload: { reason: "UNPERMITTED", impounded_at: "2026-06-01T00:00:00Z" }, as: EnforcementOfficer, as_user_id: "off-1", captures: { imp1: "$.data.id" } }
            - { call: "POST /impounds/${imp1}/release", payload: { release_at: "2026-06-05T00:00:00Z" }, as: EnforcementOfficer, as_user_id: "off-1" }
          trigger:
            - { call: "POST /impounds/${imp1}/release", payload: { release_at: "2026-06-06T00:00:00Z" }, as: EnforcementOfficer, as_user_id: "off-1", captures: { err: "$.data.error_id" } }
          assert:
            - "response code 409; error_id == ERR_INVALID_STATE"

  # =========================================================================
  # Calculations — variant selection, renewal window, forfeiture, lottery ranking
  # =========================================================================
  - section: calculations
    instances:
      - name: renewal_late_adds_penalty
        claim_type: Variant Selection
        grounds: ["calculations.permit_fee", "entities.Permit.fields.fee_variant"]
        distinguishing_aspect: "Renewing at 2027-06-10 (after expiry 2027-06-01, within 30-day grace) -> fee_variant RENEWAL_LATE, fee 41757 (34257 base fee-shape + 7500 penalty)."
        test_recipe:
          setup: ["Permit p1 ISSUED at 2026-06-01 (STANDARD/MEDIUM, expires 2027-06-01); clock advanced to 2027-06-10 (within grace)."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: PermitOfficer }
            - { call: "POST /vendors", payload: { legal_name: "V1", contact_email: "v1@x.com", seniority_years: 0 }, as: PermitOfficer, captures: { v1: "$.data.id" } }
            - { call: "POST /vendors/${v1}/insurance", payload: { insurance_effective_at: "2026-05-01T00:00:00Z", insurance_expires_at: "2028-05-01T00:00:00Z", insurance_coverage_cents: 100000000 }, as: Vendor, as_user_id: "${v1}" }
            - { call: "POST /commissaries", payload: { name: "C1", health_grade: "A", license_expires_at: "2028-01-01T00:00:00Z" }, as: HealthInspector, captures: { c1: "$.data.id" } }
            - { call: "POST /carts", payload: { vendor_id: "${v1}", commissary_id: "${c1}", cart_type: "FOOD", size_sqft: 30 }, as: Vendor, as_user_id: "${v1}", captures: { cart1: "$.data.id" } }
            - { call: "POST /carts/${cart1}/inspect", payload: { inspection_type: "HEALTH", result: "PASS", score: 95, inspection_expires_at: "2028-01-01T00:00:00Z" }, as: HealthInspector }
            - { call: "POST /carts/${cart1}/approve", payload: {}, as: PermitOfficer }
            - { call: "POST /zones", payload: { name: "Z1", zone_type: "STANDARD", capacity_slots: 5, spacing_min_feet: 20 }, as: PermitOfficer, captures: { z1: "$.data.id" } }
            - { call: "POST /permits", payload: { vendor_id: "${v1}", cart_id: "${cart1}", zone_id: "${z1}", permit_type: "FOOD" }, as: Vendor, as_user_id: "${v1}", captures: { p1: "$.data.id" } }
            - { call: "POST /permits/${p1}/submit", payload: {}, as: Vendor, as_user_id: "${v1}" }
            - { call: "POST /permits/${p1}/issue", payload: {}, as: PermitOfficer }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-06-10T00:00:00Z" }, as: PermitOfficer }
          trigger:
            - { call: "POST /permits/${p1}/renew", payload: {}, as: Vendor, as_user_id: "${v1}", captures: { fee: "$.data.fee_amount_cents", variant: "$.data.fee_variant" } }
          assert:
            - "Permit.${p1}.fee_variant == RENEWAL_LATE; fee_amount_cents == 41757"

      - name: renewal_after_grace_closed
        claim_type: Boundary / Edge Claims
        grounds: ["calculations.permit_fee", "validations[priority=13]", "errors[ERR_RENEWAL_WINDOW_CLOSED]"]
        distinguishing_aspect: "Renewing at 2027-07-05 (> expiry 2027-06-01 + 30-day grace) -> ERR_RENEWAL_WINDOW_CLOSED."
        test_recipe:
          setup: ["Permit p1 ISSUED at 2026-06-01 (expires 2027-06-01); clock advanced to 2027-07-05 (past grace)."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: PermitOfficer }
            - { call: "POST /vendors", payload: { legal_name: "V1", contact_email: "v1@x.com", seniority_years: 0 }, as: PermitOfficer, captures: { v1: "$.data.id" } }
            - { call: "POST /vendors/${v1}/insurance", payload: { insurance_effective_at: "2026-05-01T00:00:00Z", insurance_expires_at: "2028-05-01T00:00:00Z", insurance_coverage_cents: 100000000 }, as: Vendor, as_user_id: "${v1}" }
            - { call: "POST /commissaries", payload: { name: "C1", health_grade: "A", license_expires_at: "2028-01-01T00:00:00Z" }, as: HealthInspector, captures: { c1: "$.data.id" } }
            - { call: "POST /carts", payload: { vendor_id: "${v1}", commissary_id: "${c1}", cart_type: "FOOD", size_sqft: 30 }, as: Vendor, as_user_id: "${v1}", captures: { cart1: "$.data.id" } }
            - { call: "POST /carts/${cart1}/inspect", payload: { inspection_type: "HEALTH", result: "PASS", score: 95, inspection_expires_at: "2028-01-01T00:00:00Z" }, as: HealthInspector }
            - { call: "POST /carts/${cart1}/approve", payload: {}, as: PermitOfficer }
            - { call: "POST /zones", payload: { name: "Z1", zone_type: "STANDARD", capacity_slots: 5, spacing_min_feet: 20 }, as: PermitOfficer, captures: { z1: "$.data.id" } }
            - { call: "POST /permits", payload: { vendor_id: "${v1}", cart_id: "${cart1}", zone_id: "${z1}", permit_type: "FOOD" }, as: Vendor, as_user_id: "${v1}", captures: { p1: "$.data.id" } }
            - { call: "POST /permits/${p1}/submit", payload: {}, as: Vendor, as_user_id: "${v1}" }
