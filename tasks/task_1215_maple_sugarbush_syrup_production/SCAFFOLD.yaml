  - method: POST
    path: "/sugarhouse/syrup-lots/{id}/hold"
    description: "UNGRADED|GRADED -> HELD (quality hold)"
    roles: [SugarhouseManager]
    code: 200
    input: []
    output: SyrupLot
    side_effects: ["status -> HELD", "increments SyrupLot.version by 1"]
  - method: POST
    path: "/sugarhouse/syrup-lots/{id}/condemn"
    description: "UNGRADED|HELD -> CONDEMNED"
    roles: [SugarhouseManager]
    code: 200
    input: []
    output: SyrupLot
    side_effects: ["status -> CONDEMNED", "excluded from final royalty input set", "increments SyrupLot.version by 1"]

