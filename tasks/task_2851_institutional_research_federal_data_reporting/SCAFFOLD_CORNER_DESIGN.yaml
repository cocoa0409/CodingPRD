  - section: rbac
    instances:
      - name: corner_rbac_all_five_roles_execute_their_own_exclusive_writes_in_one_cycle
        claim_type: Exclusive Operations
        grounds:
          - roles[IRAnalyst].exclusive_operations
          - roles[IRDirector].exclusive_operations
          - roles[RegistrarOfficer].exclusive_operations
          - roles[DataSteward].exclusive_operations
          - roles[DisclosureOfficer].exclusive_operations
        distinguishing_aspect: |
          One end-to-end cycle in which every declared role performs at least one of its own
          exclusive writes and is allowed: the registrar opens the cycle, registers the extract and
          locks the census; the analyst builds and prepares the component; the steward publishes a
          federal definition; the director certifies and freezes; the disclosure officer intakes a
          request. This is the positive half of RBAC — a blanket deny would pass every 403 test in
          the suite but fail here.
        test_recipe:
          setup:
            - "Clean system; logical clock at 2026-08-01T00:00:00.000Z."
          setup_api_calls: []
          trigger:
            - call: "POST /ir/reporting-cycles"
              payload: { cycle_code: "IPEDS-2027", collection_year: 2027, census_date: "2026-10-15", collection_deadline: "2027-02-15T23:59:59Z" }
              as: RegistrarOfficer
              as_user_id: "registrar-1"
              captures: { cyc: $.data.id, cyc_v: $.data.version }
            - call: "POST /ir/reporting-cycles/${cyc}/frozen-files"
              payload: { domain: "ENROLLMENT", record_count: 1000, coverage_start_date: "2026-09-01", coverage_end_date: "2026-10-15", checksum: "c1d2e3f4a5b60164", expected_cycle_version: "${cyc_v}" }
              as: RegistrarOfficer
