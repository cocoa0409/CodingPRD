  # ---------------------------------------------------------------------------
  # Rule 3: non-linear state machines on DIFFERENT entities
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: application_info_request_cycle
        grounds:
          - state_machines.ScreeningApplication.UNDER_REVIEW_to_INFO_REQUESTED
          - state_machines.ScreeningApplication.INFO_REQUESTED_to_UNDER_REVIEW
        distinguishing_aspect: |
          ScreeningApplication cycles UNDER_REVIEW -> INFO_REQUESTED ->
          UNDER_REVIEW twice (a revision loop, not a linear pipeline) and can
          still reach APPROVED afterwards; the loop belongs to a different
          entity than the FeedbackTicket loop instance.
        test_recipe:
          setup:
            - "Participant P ACTIVE; study S RECRUITING with NDA v1 PUBLISHED; P's application UNDER_REVIEW"
          setup_api_calls:
            - call: "POST /playtests/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ResearchOpsAdmin
            - call: "POST /playtests/participants"
              payload: { email: "nl1-p@x.com", full_name: "NL One", age_years: 25, region_code: "US-W", platform_tags: ["PC"] }
              as: ResearchOpsAdmin
              captures: { p_id: "$.data.id"}
            - call: "POST /playtests/participants/${p_id}/activate"
              payload: {}
              as: ResearchOpsAdmin
            - call: "POST /playtests/studies"
              payload: { title: "NL1 Study", code: "NL1", min_age: 18, max_age: 35, allowed_regions: ["US-W"], required_platforms: ["PC"], cohort_capacity: 10, incentive_budget_cents: 1000000 }
              as: ResearchOpsAdmin
              captures: { s_id: "$.data.id"}
            - call: "POST /playtests/studies/${s_id}/open-recruitment"
              payload: {}
              as: ResearchOpsAdmin
            - call: "POST /playtests/nda-agreements"
              payload: { study_id: "${s_id}", version_label: "v1", body_text: "NDA text v1" }
              as: LegalCounsel
              captures: { nda_id: "$.data.id"}
            - call: "POST /playtests/nda-agreements/${nda_id}/publish"
              payload: {}
              as: LegalCounsel
            - call: "POST /playtests/applications"
              payload: { study_id: "${s_id}" }
              as: Participant
              as_user_id: "${p_id}"
              captures: { app_id: "$.data.id"}
            - call: "POST /playtests/applications/${app_id}/start-review"
              payload: {}
              as: Researcher
          trigger:
            - call: "POST /playtests/applications/${app_id}/request-info"
              payload: { info_request_note: "Confirm your region" }
              as: Researcher
              captures: { st1: "$.data.status"}
            - call: "POST /playtests/applications/${app_id}/submit-info"
              payload: { supplemental_note: "Region confirmed US-W" }
              as: Participant
              as_user_id: "${p_id}"
              captures: { st2: "$.data.status"}
            - call: "POST /playtests/applications/${app_id}/request-info"
              payload: { info_request_note: "Confirm your platform" }
              as: Researcher
              captures: { st3: "$.data.status"}
            - call: "POST /playtests/applications/${app_id}/submit-info"
              payload: {}
              as: Participant
              as_user_id: "${p_id}"
              captures: { st4: "$.data.status"}
            - call: "POST /playtests/applications/${app_id}/approve"
              payload: {}
              as: Researcher
              captures: { st5: "$.data.status", final_score: "$.data.fit_score_final"}
          assert:
            - "st1 == INFO_REQUESTED"
            - "st2 == UNDER_REVIEW   # first loop iteration closed"
            - "st3 == INFO_REQUESTED # loop repeats without limit"
            - "st4 == UNDER_REVIEW"
            - "st5 == APPROVED       # cycle does not poison the application"
            - "final_score == 70    # verified variant with verified_platform_tags still []"
      - name: feedback_ticket_triage_info_loop
        grounds:
          - state_machines.FeedbackTicket.NEW_to_TRIAGED
          - state_machines.FeedbackTicket.TRIAGED_to_NEEDS_INFO
          - state_machines.FeedbackTicket.NEEDS_INFO_to_TRIAGED
        distinguishing_aspect: |
          FeedbackTicket cycles TRIAGED -> NEEDS_INFO -> TRIAGED with priority
          recomputation on every triage — a different entity than
          ScreeningApplication — then proceeds TRIAGED -> ROUTED -> RESOLVED.
        test_recipe:
          setup:
            - "Study S exists (DRAFT is sufficient for feedback filing); ticket with severity MEDIUM, reach_count 10, reproducibility_pct 0.5 filed as NEW"
          setup_api_calls:
            - call: "POST /playtests/studies"
              payload: { title: "NL2 Study", code: "NL2", min_age: 18, max_age: 35, allowed_regions: ["US-W"], required_platforms: ["PC"], cohort_capacity: 10, incentive_budget_cents: 1000000 }
              as: ResearchOpsAdmin
              captures: { s_id: "$.data.id"}
            - call: "POST /playtests/feedback-tickets"
              payload: { study_id: "${s_id}", title: "Crash on startup", severity: "MEDIUM", reach_count: 10, reproducibility_pct: 0.5 }
              as: Researcher
              captures: { t_id: "$.data.id", st0: "$.data.status"}
          trigger:
            - call: "POST /playtests/feedback-tickets/${t_id}/triage"
              payload: {}
              as: Researcher
              captures: { st1: "$.data.status", score1: "$.data.priority_score", tier1: "$.data.priority_tier"}
            - call: "POST /playtests/feedback-tickets/${t_id}/request-info"
              payload: {}
              as: Researcher
              captures: { st2: "$.data.status"}
            - call: "POST /playtests/feedback-tickets/${t_id}/triage"
              payload: {}
              as: Researcher
              captures: { st3: "$.data.status", score2: "$.data.priority_score"}
            - call: "POST /playtests/feedback-tickets/${t_id}/route"
              payload: { backlog_target: "GAMEPLAY" }
              as: Researcher
              captures: { st4: "$.data.status", target: "$.data.backlog_target"}
            - call: "POST /playtests/feedback-tickets/${t_id}/resolve"
              payload: {}
              as: Researcher
              captures: { st5: "$.data.status"}
          assert:
            - "st0 == NEW"
            - "st1 == TRIAGED and score1 == 105.0 and tier1 == P3   # 2*100*0.5 + min(10,1000)*0.5"
            - "st2 == NEEDS_INFO"
            - "st3 == TRIAGED and score2 == 105.0  # recompute over unchanged fields is stable"
            - "st4 == ROUTED and target == GAMEPLAY"
            - "st5 == RESOLVED"

  # ---------------------------------------------------------------------------
  # Rule 4: transitive cascades from DIFFERENT triggers (depth >= 3 and >= 2)
  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: breach_substantiation_suspends_cancels_promotes
        grounds:
          - state_machines.BreachCase.UNDER_INVESTIGATION_to_SUBSTANTIATED
          - state_machines.Participant.ACTIVE_to_SUSPENDED
          - state_machines.SessionBooking.BOOKED_to_CANCELLED
          - state_machines.SessionBooking.WAITLISTED_to_PROMOTED
        distinguishing_aspect: |
          Depth-3 chain from POST /playtests/breach-cases/{id}/substantiate:
          breach substantiation suspends the participant (link 1); the
          suspension cancels their BOOKED booking (link 2); the freed seat
          promotes the earliest waitlisted booking (link 3) — a different
          originating transition than the NDA re-publish cascade.
        test_recipe:
          setup:
            - "Participants A and B both ENROLLED in study S (RECRUITING); build RELEASED with key K issued to A; session capacity 1 with A BOOKED and B WAITLISTED; breach case (MAJOR) REPORTED by researcher-1 and UNDER_INVESTIGATION under legal-1"
