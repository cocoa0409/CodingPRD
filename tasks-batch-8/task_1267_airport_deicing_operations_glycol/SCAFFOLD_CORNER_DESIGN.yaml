          difficulty_instance: permit_rolling_window_aggregate_capacity
          rationale: "Rolling-window overflow and exact-capacity pass are asserted in the named §1.8 instance."

      - name: pad_window_overlap_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_PAD_WINDOW_OVERLAP]"]
        excluded_because:
          difficulty_instance: pad_window_half_open_adjacency
          rationale: "Overlap rejection and half-open adjacency acceptance are asserted in the named §1.8 instance."

