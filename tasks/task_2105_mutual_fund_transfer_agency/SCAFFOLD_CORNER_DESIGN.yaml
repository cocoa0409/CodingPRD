              payload: { fund_id: "${fund_id}", class_code: "A", seed_nav_per_share: 10.0000, breakpoint_tiers: [{min_qualifying_amount: 0, load_pct: 0.0575}] }
              as: FundAccountant
              captures: { sc_a: $.data.id }
          trigger:
            - call: "POST /nav-records"
              payload: { share_class_id: "${sc_a}", valuation_date: "2026-08-03", total_net_assets: 0.00 }
              as: TransferAgentOperator
              captures: { err_id: $.data.error_id }
