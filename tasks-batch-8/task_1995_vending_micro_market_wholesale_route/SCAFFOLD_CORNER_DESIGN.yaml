# =============================================================================
# Task 1995: Vending & Micro-Market Wholesale Route Supply
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth coverage of §1.1–§1.7 claims not already covered by §1.8.
# Default logical clock at server start: 2026-08-01T00:00:00Z (a Saturday).
# =============================================================================
scaffold_corner_design:

  # ============================================================ entities
  - section: entities
    instances:
      - name: operator_creation_applies_defaults
        claim_type: creation_defaults
        grounds:
          - "entities.Operator.fields.default_tender"
          - "entities.Operator.fields.credit_balance_cents"
          - "entities.Operator.fields.status"
        distinguishing_aspect: "Omitting default_tender yields CASH; computed credit_balance_cents starts 0; system status ACTIVE; common fields stamped (version 1)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - { call: "POST /wholesale/operators", payload: { name: "Op Defaults" }, as: WholesaleAdmin, captures: { op: $.data.id } }
          trigger:
            - { call: "GET /wholesale/operators/${op}", as: WholesaleAdmin }
          assert:
            - "Operator.${op}.default_tender == CASH"
            - "Operator.${op}.credit_balance_cents == 0"
            - "Operator.${op}.status == ACTIVE"
            - "Operator.${op}.version == 1 and id/created_at/updated_at are server-stamped"

      - name: product_create_duplicate_sku_rejected
        claim_type: violation_to_error
        grounds:
          - "entities.Product.fields.sku"
          - "errors[ERR_DUPLICATE_SKU]"
        distinguishing_aspect: "Second product with an existing sku is rejected with ERR_DUPLICATE_SKU (409); first product untouched."
        test_recipe:
          setup: ["product DUP-1 exists"]
          setup_api_calls:
            - { call: "POST /wholesale/products", payload: { sku: "DUP-1", name: "First", category: "SNACK", eligible_location_types: ["OFFICE"], case_pack_qty: 10, base_price_cents: 1000, cost_cents: 600, shelf_life_days: 90 }, as: WholesaleAdmin, captures: { pr: $.data.id } }
          trigger:
            - { call: "POST /wholesale/products", payload: { sku: "DUP-1", name: "Second", category: "CANDY", eligible_location_types: ["GYM"], case_pack_qty: 5, base_price_cents: 500, cost_cents: 300, shelf_life_days: 60 }, as: WholesaleAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_DUPLICATE_SKU"
            - "Product.${pr}.name == First"

      - name: location_create_bogus_operator_fk_returns_not_found
        claim_type: parent_relationship_integrity
        grounds:
          - "entities.Location.fields.operator_id"
          - "errors[ERR_OPERATOR_NOT_FOUND]"
          - "validations[priority=6]"
        distinguishing_aspect: "Body-referenced operator_id that does not exist fails existence with ERR_OPERATOR_NOT_FOUND (404) before any business rule runs."
        test_recipe:
          setup: ["a route exists"]
          setup_api_calls:
            - { call: "POST /wholesale/routes", payload: { route_code: "R-FK", delivery_weekdays: ["MON"], daily_case_capacity: 50, min_order_cents: 0 }, as: WholesaleAdmin, captures: { rt: $.data.id } }
          trigger:
            - { call: "POST /wholesale/locations", payload: { operator_id: "11111111-1111-1111-1111-111111111111", name: "L-Bogus", location_type: "OFFICE", route_id: "${rt}" }, as: WholesaleAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_OPERATOR_NOT_FOUND"

      - name: location_create_invalid_enum_rejected
        claim_type: type_constraint
        grounds:
          - "entities.Location.fields.location_type"
          - "errors[ERR_INVALID_REQUEST]"
          - "validations[priority=2]"
        distinguishing_aspect: "location_type outside {OFFICE, SCHOOL, HOSPITAL, GYM} is a shape error: ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["operator and route exist"]
          setup_api_calls:
            - { call: "POST /wholesale/operators", payload: { name: "Op Enum" }, as: WholesaleAdmin, captures: { op: $.data.id } }
            - { call: "POST /wholesale/routes", payload: { route_code: "R-EN", delivery_weekdays: ["TUE"], daily_case_capacity: 50, min_order_cents: 0 }, as: WholesaleAdmin, captures: { rt: $.data.id } }
          trigger:
            - { call: "POST /wholesale/locations", payload: { operator_id: "${op}", name: "L-BadEnum", location_type: "MALL", route_id: "${rt}" }, as: WholesaleAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST"

      - name: telemetry_event_immutable_append_only
        claim_type: immutability
        grounds:
          - "entities.TelemetryEvent"
        distinguishing_aspect: "TelemetryEvent declares common_fields: false — its representation exposes id and created_at but no version/updated_at, and no update/delete endpoints exist for it."
        test_recipe:
          setup: ["operator + route + location exist"]
          setup_api_calls:
            - { call: "POST /wholesale/operators", payload: { name: "Op Imm" }, as: WholesaleAdmin, captures: { op: $.data.id } }
            - { call: "POST /wholesale/routes", payload: { route_code: "R-IMM", delivery_weekdays: ["MON"], daily_case_capacity: 50, min_order_cents: 0 }, as: WholesaleAdmin, captures: { rt: $.data.id } }
            - { call: "POST /wholesale/locations", payload: { operator_id: "${op}", name: "L-Imm", location_type: "GYM", route_id: "${rt}" }, as: WholesaleAdmin, captures: { loc: $.data.id } }
          trigger:
            - { call: "POST /wholesale/telemetry-events", payload: { location_id: "${loc}", recorded_at: "2026-08-01T05:00:00Z", cash_collected_cents: 100, cashless_sales_cents: 50, items: [] }, as: TelemetryGateway, captures: { ev: $.data.id } }
          assert:
            - "TelemetryEvent.${ev} response exposes id and created_at only as system fields (no version, no updated_at)"
            - "TelemetryEvent.${ev}.cash_collected_cents == 100 and cashless_sales_cents == 50"

      - name: order_create_computed_input_ignored
        claim_type: computed_fields
        grounds:
          - "entities.ReplenishmentOrder.fields.order_total_cents"
          - "entities.ReplenishmentOrder.fields.source"
        distinguishing_aspect: "Client-supplied order_total_cents in the create payload is ignored: a DRAFT order always starts with computed totals at 0 and source MANUAL."
        test_recipe:
          setup: ["operator + route + location exist"]
          setup_api_calls:
            - { call: "POST /wholesale/operators", payload: { name: "Op Comp" }, as: WholesaleAdmin, captures: { op: $.data.id } }
            - { call: "POST /wholesale/routes", payload: { route_code: "R-CMP", delivery_weekdays: ["MON"], daily_case_capacity: 50, min_order_cents: 0 }, as: WholesaleAdmin, captures: { rt: $.data.id } }
            - { call: "POST /wholesale/locations", payload: { operator_id: "${op}", name: "L-Comp", location_type: "OFFICE", route_id: "${rt}" }, as: WholesaleAdmin, captures: { loc: $.data.id } }
          trigger:
            - { call: "POST /wholesale/orders", payload: { location_id: "${loc}", requested_delivery_date: "2026-08-03", lines: [], order_total_cents: 99999, promo_discount_cents: 555 }, as: OperatorManager, as_user_id: "${op}", captures: { ord: $.data.id } }
          assert:
            - "ReplenishmentOrder.${ord}.order_total_cents == 0   # client input ignored"
            - "ReplenishmentOrder.${ord}.promo_discount_cents == 0"
            - "ReplenishmentOrder.${ord}.source == MANUAL"
            - "ReplenishmentOrder.${ord}.route_id == ${rt}   # copied from location at creation"

      - name: list_pagination_limit_offset
        claim_type: listing_pagination
        grounds:
          - "response_envelope.pagination_fields"
          - "response_envelope.pagination_defaults"
        distinguishing_aspect: "GET /wholesale/products with limit=1 over 2 products returns exactly 1 row with total_count == 2 and has_more == true; offset=1 returns the second row with has_more == false."
        test_recipe:
          setup: ["two products PG-A, PG-B exist"]
          setup_api_calls:
            - { call: "POST /wholesale/products", payload: { sku: "PG-A", name: "Page A", category: "SNACK", eligible_location_types: ["OFFICE"], case_pack_qty: 10, base_price_cents: 100, cost_cents: 50, shelf_life_days: 30 }, as: WholesaleAdmin }
            - { call: "POST /wholesale/products", payload: { sku: "PG-B", name: "Page B", category: "CANDY", eligible_location_types: ["GYM"], case_pack_qty: 10, base_price_cents: 100, cost_cents: 50, shelf_life_days: 30 }, as: WholesaleAdmin }
          trigger:
            - { call: "GET /wholesale/products", payload: { limit: 1, offset: 0 }, as: WholesaleAdmin }
            - { call: "GET /wholesale/products", payload: { limit: 1, offset: 1 }, as: WholesaleAdmin }
          assert:
            - "page 1: data length == 1, total_count == 2, has_more == true"
            - "page 2: data length == 1, total_count == 2, has_more == false"
            - "page 1 and page 2 return different product ids"

      - name: entity_not_found_gets
        claim_type: not_found
        grounds:
          - "validations[priority=4]"
          - "errors[ERR_OPERATOR_NOT_FOUND]"
          - "errors[ERR_LOCATION_NOT_FOUND]"
          - "errors[ERR_ROUTE_NOT_FOUND]"
          - "errors[ERR_PRODUCT_NOT_FOUND]"
          - "errors[ERR_PROMOTION_NOT_FOUND]"
          - "errors[ERR_PLANOGRAM_NOT_FOUND]"
          - "errors[ERR_ORDER_NOT_FOUND]"
          - "errors[ERR_CREDIT_CLAIM_NOT_FOUND]"
          - "errors[ERR_SERVICE_TICKET_NOT_FOUND]"
        distinguishing_aspect: "Each parameterized GET with a non-existent UUID returns its entity-specific 404 error_id — nine distinct not-found codes on nine resources."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /wholesale/operators/11111111-1111-1111-1111-111111111111", as: WholesaleAdmin, captures: { e_op: $.data.error_id } }
            - { call: "GET /wholesale/locations/22222222-2222-2222-2222-222222222222", as: WholesaleAdmin, captures: { e_loc: $.data.error_id } }
            - { call: "GET /wholesale/routes/33333333-3333-3333-3333-333333333333", as: WholesaleAdmin, captures: { e_rt: $.data.error_id } }
            - { call: "GET /wholesale/products/44444444-4444-4444-4444-444444444444", as: WholesaleAdmin, captures: { e_pr: $.data.error_id } }
            - { call: "GET /wholesale/promotions/55555555-5555-5555-5555-555555555555", as: WholesaleAdmin, captures: { e_pm: $.data.error_id } }
            - { call: "GET /wholesale/planograms/66666666-6666-6666-6666-666666666666", as: WholesaleAdmin, captures: { e_pg: $.data.error_id } }
            - { call: "GET /wholesale/orders/77777777-7777-7777-7777-777777777777", as: WholesaleAdmin, captures: { e_ord: $.data.error_id } }
            - { call: "GET /wholesale/credit-claims/88888888-8888-8888-8888-888888888888", as: WholesaleAdmin, captures: { e_cl: $.data.error_id } }
            - { call: "GET /wholesale/service-tickets/99999999-9999-9999-9999-999999999999", as: WholesaleAdmin, captures: { e_st: $.data.error_id } }
          assert:
            - "e_op == ERR_OPERATOR_NOT_FOUND"
            - "e_loc == ERR_LOCATION_NOT_FOUND"
            - "e_rt == ERR_ROUTE_NOT_FOUND"
            - "e_pr == ERR_PRODUCT_NOT_FOUND"
            - "e_pm == ERR_PROMOTION_NOT_FOUND"
            - "e_pg == ERR_PLANOGRAM_NOT_FOUND"
            - "e_ord == ERR_ORDER_NOT_FOUND"
            - "e_cl == ERR_CREDIT_CLAIM_NOT_FOUND"
            - "e_st == ERR_SERVICE_TICKET_NOT_FOUND"

  # ============================================================ state_machines
  - section: state_machines
    instances:
      - name: initial_states_on_create
        claim_type: initial_state
        grounds:
          - "state_machines.Planogram"
          - "state_machines.ReplenishmentOrder"
          - "state_machines.ServiceTicket"
        distinguishing_aspect: "Freshly created planogram is DRAFT; order is DRAFT + UNINVOICED with null margins; service ticket is OPEN with computed parts_total_cents 9000."
        test_recipe:
          setup: ["operator, route, location, product exist"]
          setup_api_calls:
            - { call: "POST /wholesale/operators", payload: { name: "Op Init" }, as: WholesaleAdmin, captures: { op: $.data.id } }
            - { call: "POST /wholesale/routes", payload: { route_code: "R-INI", delivery_weekdays: ["MON"], daily_case_capacity: 50, min_order_cents: 0 }, as: WholesaleAdmin, captures: { rt: $.data.id } }
            - { call: "POST /wholesale/products", payload: { sku: "INI-1", name: "Init item", category: "SNACK", eligible_location_types: ["OFFICE"], case_pack_qty: 10, base_price_cents: 1000, cost_cents: 600, shelf_life_days: 90 }, as: WholesaleAdmin, captures: { pr: $.data.id } }
            - { call: "POST /wholesale/locations", payload: { operator_id: "${op}", name: "L-Init", location_type: "OFFICE", route_id: "${rt}" }, as: WholesaleAdmin, captures: { loc: $.data.id } }
          trigger:
            - { call: "POST /wholesale/planograms", payload: { location_id: "${loc}", name: "PG-Init", slots: [{ slot_code: "A1", product_id: "${pr}", par_level_units: 10, vend_price_cents: 150 }] }, as: OperatorManager, as_user_id: "${op}", captures: { pg: $.data.id } }
            - { call: "POST /wholesale/orders", payload: { location_id: "${loc}", requested_delivery_date: "2026-08-03", lines: [{ product_id: "${pr}", quantity_cases: 1 }] }, as: OperatorManager, as_user_id: "${op}", captures: { ord: $.data.id } }
            - { call: "POST /wholesale/service-tickets", payload: { location_id: "${loc}", equipment_model: "VENDO-540", issue_type: "PART_REPLACEMENT", parts: [{ part_sku: "MTR-12", part_name: "Spiral motor", quantity: 2, unit_price_cents: 4500 }] }, as: OperatorManager, as_user_id: "${op}", captures: { tkt: $.data.id } }
          assert:
            - "Planogram.${pg}.status == DRAFT and activated_at == null"
            - "ReplenishmentOrder.${ord}.fulfillment_status == DRAFT and settlement_status == UNINVOICED"
            - "ReplenishmentOrder.${ord}.provisional_margin_per_vend_cents == null and realized_margin_per_vend_cents == null"
            - "ReplenishmentOrder.${ord}.total_cases == 1"
            - "ServiceTicket.${tkt}.status == OPEN and service_date == null and parts_total_cents == 9000"

      - name: order_submit_twice_rejected
        claim_type: invalid_transition
        grounds:
          - "state_machines.ReplenishmentOrder.DRAFT_to_SUBMITTED"
          - "errors[ERR_ORDER_NOT_DRAFT]"
        distinguishing_aspect: "Submit is only valid from DRAFT: the second submit of an already-SUBMITTED order fails ERR_ORDER_NOT_DRAFT with no side effects (total not recomputed twice)."
        test_recipe:
          setup: ["submitted order (1 case base 1000, total 1000)"]
          setup_api_calls:
            - { call: "POST /wholesale/operators", payload: { name: "Op Twice" }, as: WholesaleAdmin, captures: { op: $.data.id } }
            - { call: "POST /wholesale/routes", payload: { route_code: "R-TWC", delivery_weekdays: ["MON"], daily_case_capacity: 50, min_order_cents: 0 }, as: WholesaleAdmin, captures: { rt: $.data.id } }
            - { call: "POST /wholesale/products", payload: { sku: "TWC-1", name: "Twice item", category: "SNACK", eligible_location_types: ["OFFICE"], case_pack_qty: 10, base_price_cents: 1000, cost_cents: 600, shelf_life_days: 90 }, as: WholesaleAdmin, captures: { pr: $.data.id } }
            - { call: "POST /wholesale/locations", payload: { operator_id: "${op}", name: "L-Twice", location_type: "OFFICE", route_id: "${rt}" }, as: WholesaleAdmin, captures: { loc: $.data.id, loc_v: $.data.version } }
            - { call: "POST /wholesale/planograms", payload: { location_id: "${loc}", name: "PG-Twice", slots: [{ slot_code: "A1", product_id: "${pr}", par_level_units: 10, vend_price_cents: 150 }] }, as: OperatorManager, as_user_id: "${op}", captures: { pg: $.data.id } }
            - { call: "POST /wholesale/planograms/${pg}/activate", payload: { expected_location_version: "${loc_v}" }, as: OperatorManager, as_user_id: "${op}" }
            - { call: "POST /wholesale/orders", payload: { location_id: "${loc}", requested_delivery_date: "2026-08-03", lines: [{ product_id: "${pr}", quantity_cases: 1 }] }, as: OperatorManager, as_user_id: "${op}", captures: { ord: $.data.id } }
            - { call: "POST /wholesale/orders/${ord}/submit", as: OperatorManager, as_user_id: "${op}" }
          trigger:
            - { call: "POST /wholesale/orders/${ord}/submit", as: OperatorManager, as_user_id: "${op}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_ORDER_NOT_DRAFT"
            - "ReplenishmentOrder.${ord}.fulfillment_status == SUBMITTED and order_total_cents == 1000"

      - name: order_confirm_from_draft_rejected
        claim_type: invalid_transition
        grounds:
          - "state_machines.ReplenishmentOrder.SUBMITTED_to_CONFIRMED"
          - "errors[ERR_ORDER_NOT_SUBMITTED]"
        distinguishing_aspect: "confirm requires SUBMITTED: calling it on a DRAFT order fails ERR_ORDER_NOT_SUBMITTED."
        test_recipe:
          setup: ["draft order exists (never submitted)"]
          setup_api_calls:
            - { call: "POST /wholesale/operators", payload: { name: "Op Cfm" }, as: WholesaleAdmin, captures: { op: $.data.id } }
            - { call: "POST /wholesale/routes", payload: { route_code: "R-CFM", delivery_weekdays: ["MON"], daily_case_capacity: 50, min_order_cents: 0 }, as: WholesaleAdmin, captures: { rt: $.data.id } }
            - { call: "POST /wholesale/locations", payload: { operator_id: "${op}", name: "L-Cfm", location_type: "OFFICE", route_id: "${rt}" }, as: WholesaleAdmin, captures: { loc: $.data.id } }
            - { call: "POST /wholesale/orders", payload: { location_id: "${loc}", requested_delivery_date: "2026-08-03", lines: [] }, as: OperatorManager, as_user_id: "${op}", captures: { ord: $.data.id } }
          trigger:
            - { call: "POST /wholesale/orders/${ord}/confirm", as: RoutePlanner, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_ORDER_NOT_SUBMITTED"
            - "ReplenishmentOrder.${ord}.fulfillment_status == DRAFT"

      - name: order_mark_delivered_from_submitted_rejected
        claim_type: invalid_transition
        grounds:
          - "state_machines.ReplenishmentOrder.CONFIRMED_to_DELIVERED"
          - "errors[ERR_ORDER_NOT_CONFIRMED]"
        distinguishing_aspect: "mark-delivered requires CONFIRMED: on a merely SUBMITTED order it fails ERR_ORDER_NOT_CONFIRMED and settlement stays UNINVOICED."
        test_recipe:
          setup: ["submitted order (1 case base 1000)"]
          setup_api_calls:
            - { call: "POST /wholesale/operators", payload: { name: "Op Dlv" }, as: WholesaleAdmin, captures: { op: $.data.id } }
            - { call: "POST /wholesale/routes", payload: { route_code: "R-DLV", delivery_weekdays: ["MON"], daily_case_capacity: 50, min_order_cents: 0 }, as: WholesaleAdmin, captures: { rt: $.data.id } }
            - { call: "POST /wholesale/products", payload: { sku: "DLV-1", name: "Dlv item", category: "SNACK", eligible_location_types: ["OFFICE"], case_pack_qty: 10, base_price_cents: 1000, cost_cents: 600, shelf_life_days: 90 }, as: WholesaleAdmin, captures: { pr: $.data.id } }
            - { call: "POST /wholesale/locations", payload: { operator_id: "${op}", name: "L-Dlv", location_type: "OFFICE", route_id: "${rt}" }, as: WholesaleAdmin, captures: { loc: $.data.id, loc_v: $.data.version } }
            - { call: "POST /wholesale/planograms", payload: { location_id: "${loc}", name: "PG-Dlv", slots: [{ slot_code: "A1", product_id: "${pr}", par_level_units: 10, vend_price_cents: 150 }] }, as: OperatorManager, as_user_id: "${op}", captures: { pg: $.data.id } }
            - { call: "POST /wholesale/planograms/${pg}/activate", payload: { expected_location_version: "${loc_v}" }, as: OperatorManager, as_user_id: "${op}" }
            - { call: "POST /wholesale/orders", payload: { location_id: "${loc}", requested_delivery_date: "2026-08-03", lines: [{ product_id: "${pr}", quantity_cases: 1 }] }, as: OperatorManager, as_user_id: "${op}", captures: { ord: $.data.id } }
            - { call: "POST /wholesale/orders/${ord}/submit", as: OperatorManager, as_user_id: "${op}" }
          trigger:
            - { call: "POST /wholesale/orders/${ord}/mark-delivered", as: WarehouseOps, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_ORDER_NOT_CONFIRMED"
            - "ReplenishmentOrder.${ord}.fulfillment_status == SUBMITTED and settlement_status == UNINVOICED and amount_due_cents == 0"

      - name: order_cancel_after_delivered_rejected
        claim_type: terminal_state_lockdown
        grounds:
          - "state_machines.ReplenishmentOrder"
          - "errors[ERR_INVALID_STATE_TRANSITION]"
        distinguishing_aspect: "DELIVERED is terminal for the cancel transition: cancel after delivery fails ERR_INVALID_STATE_TRANSITION and the order keeps its OPEN settlement."
        test_recipe:
          setup: ["order 1 case base 1000 submitted, confirmed, delivered (settlement OPEN, due 1000)"]
          setup_api_calls:
            - { call: "POST /wholesale/operators", payload: { name: "Op Cxl" }, as: WholesaleAdmin, captures: { op: $.data.id } }
            - { call: "POST /wholesale/routes", payload: { route_code: "R-CXL", delivery_weekdays: ["MON"], daily_case_capacity: 50, min_order_cents: 0 }, as: WholesaleAdmin, captures: { rt: $.data.id } }
            - { call: "POST /wholesale/products", payload: { sku: "CXL-1", name: "Cxl item", category: "SNACK", eligible_location_types: ["OFFICE"], case_pack_qty: 10, base_price_cents: 1000, cost_cents: 600, shelf_life_days: 90 }, as: WholesaleAdmin, captures: { pr: $.data.id } }
            - { call: "POST /wholesale/locations", payload: { operator_id: "${op}", name: "L-Cxl", location_type: "OFFICE", route_id: "${rt}" }, as: WholesaleAdmin, captures: { loc: $.data.id, loc_v: $.data.version } }
            - { call: "POST /wholesale/planograms", payload: { location_id: "${loc}", name: "PG-Cxl", slots: [{ slot_code: "A1", product_id: "${pr}", par_level_units: 10, vend_price_cents: 150 }] }, as: OperatorManager, as_user_id: "${op}", captures: { pg: $.data.id } }
            - { call: "POST /wholesale/planograms/${pg}/activate", payload: { expected_location_version: "${loc_v}" }, as: OperatorManager, as_user_id: "${op}" }
            - { call: "POST /wholesale/orders", payload: { location_id: "${loc}", requested_delivery_date: "2026-08-03", lines: [{ product_id: "${pr}", quantity_cases: 1 }] }, as: OperatorManager, as_user_id: "${op}", captures: { ord: $.data.id } }
            - { call: "POST /wholesale/orders/${ord}/submit", as: OperatorManager, as_user_id: "${op}" }
            - { call: "POST /wholesale/orders/${ord}/confirm", as: RoutePlanner }
            - { call: "POST /wholesale/orders/${ord}/mark-delivered", as: WarehouseOps }
          trigger:
            - { call: "POST /wholesale/orders/${ord}/cancel", as: OperatorManager, as_user_id: "${op}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE_TRANSITION"
            - "ReplenishmentOrder.${ord}.fulfillment_status == DELIVERED and settlement_status == OPEN and amount_due_cents == 1000"

      - name: claim_rejected_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds:
          - "state_machines.CreditClaim.SUBMITTED_to_REJECTED"
          - "errors[ERR_CLAIM_NOT_SUBMITTED]"
        distinguishing_aspect: "REJECTED is terminal: approving a rejected claim fails ERR_CLAIM_NOT_SUBMITTED and no credit is issued (balance stays 0)."
        test_recipe:
          setup: ["delivered order 1 case pack 10 base 1000; claim (1 unit, exp 2026-07-30) already REJECTED"]
          setup_api_calls:
            - { call: "POST /wholesale/operators", payload: { name: "Op CLock" }, as: WholesaleAdmin, captures: { op: $.data.id } }
            - { call: "POST /wholesale/routes", payload: { route_code: "R-CLK", delivery_weekdays: ["MON"], daily_case_capacity: 50, min_order_cents: 0 }, as: WholesaleAdmin, captures: { rt: $.data.id } }
