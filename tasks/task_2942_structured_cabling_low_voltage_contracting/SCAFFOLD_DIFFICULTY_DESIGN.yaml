          (priority 70, ERR_SEGREGATION_OF_DUTIES, 403) on POST
          /cabling/links/{link_id}/certify. ONE call violates both: the link is TESTED_PASS but
          only LABELED, and the acting X-User-ID is the installer. The lower-numbered state rule
          must answer, so the response is 409 ERR_LINK_NOT_RECORDED and not the 403.
        test_recipe:
          setup:
            - "Link TR01-A01 in install_state TESTED_PASS with latest_test_outcome PASS"
