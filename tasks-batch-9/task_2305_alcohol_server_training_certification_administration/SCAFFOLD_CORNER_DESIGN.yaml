      - name: a_compliance_run_with_nothing_due_records_an_all_zero_immutable_row
        claim_type: Bulk action
        grounds:
          - endpoints.POST_/compliance-runs
          - entities.ComplianceRun
        distinguishing_aspect: |
          A run over an empty program is a no-op that still persists a ComplianceRun with
          run_at equal to the clock and all ten counters at 0 - an implementation that
          skipped the row, or that reported nulls, fails. Two runs at the same instant
          produce two independent rows.
        test_recipe:
          setup:
            - "A TX MANDATORY jurisdiction exists; there are no trainers, certificates, assignments or documents."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /state-jurisdictions"
              payload: { state_code: "TX", mandate_type: "MANDATORY", mandated_tracks: ["ON_PREMISE", "OFF_PREMISE"] }
              as: ProgramAdmin
              captures: { tx_id: $.data.id }
          trigger:
            - call: "POST /compliance-runs"
              payload: {}
              as: ProgramAdmin
              captures: { run1: $.data.id }
            - call: "POST /compliance-runs"
              payload: {}
              as: ProgramAdmin
              captures: { run2: $.data.id }
          assert:
            - "both calls return 201 and ${run1} != ${run2}"
            - "ComplianceRun.${run1}.run_at == '2026-08-03T09:00:00Z'"
            - "ComplianceRun.${run1} has trainers_lapsed_count == 0, approvals_expired_count == 0, certificates_graced_count == 0, certificates_lapsed_count == 0, reminders_sent_count == 0, assignments_restricted_count == 0, assignments_restored_count == 0, locations_recomputed_count == 0, documents_voided_count == 0"
            - "the ComplianceRun payload contains no version and no updated_at field"

      - name: assignment_link_resolves_the_path_id_before_the_body_id
        claim_type: Cross-reference link
        grounds:
          - endpoints.POST_/employer-locations/{id}/server-assignments
          - validations.priority_4_path_id_resolution_by_entity_family
          - errors.ERR_EMPLOYER_NOT_FOUND
          - errors.ERR_CREDENTIAL_NOT_FOUND
        distinguishing_aspect: |
          Both sides of the link are validated, but in a fixed order: an unknown
          alcohol_server_id under a real location returns ERR_CREDENTIAL_NOT_FOUND (404),
          while a request whose path location is also unknown returns
          ERR_EMPLOYER_NOT_FOUND - the path check at priority 4 precedes the body check at
          priority 6, so the second call never reports the missing server.
        test_recipe:
          setup:
            - "A TX MANDATORY jurisdiction and employer Lone Star Taverns LLC with one ON_PREMISE location; no servers exist."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /state-jurisdictions"
