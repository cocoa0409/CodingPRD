            - call: "POST /reservations/${res}/cancel"
              payload: {}
              as: FacilityManager
            - call: "GET /owners/${own}"
              payload: {}
              as: FacilityManager
              captures: { wallet: $.data.wallet_credit_cents }
          assert:
            - "Owner.${own}.wallet_credit_cents == 4320 (cash deposit out, refund credit in — value conserved)"
