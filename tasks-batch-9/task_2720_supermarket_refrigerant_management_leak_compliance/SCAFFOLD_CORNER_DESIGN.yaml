              as: Technician
              as_user_id: "${tech1_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 422 and error_id == ERR_CHARGE_EXCEEDS_NAMEPLATE"
            - "RefrigerantSystem.${sys1_id}.current_charge_lbs == 80.0 and version == 1"
            - "Cylinder.${cyl1_id}.current_contents_lbs == 40.0 and disposition == VIRGIN"

      - name: recovering_more_than_the_system_holds_is_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=42]
          - errors[ERR_NEGATIVE_SYSTEM_CHARGE]
        distinguishing_aspect: "An oversized 200.0 lb cylinder (fill limit 160.0, currently empty) keeps the fill-limit rule at priority 39 satisfied, so the only broken constraint is the projected system charge 20.0 - 50.0 = -30.0, which must surface as 422 ERR_NEGATIVE_SYSTEM_CHARGE."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z, one store, R-404A, SYS1 (full 100.0, initial 20.0), T1, EQ1, CYL_BIG (nominal 200.0, initial contents 0.0)."
          setup_api_calls:
