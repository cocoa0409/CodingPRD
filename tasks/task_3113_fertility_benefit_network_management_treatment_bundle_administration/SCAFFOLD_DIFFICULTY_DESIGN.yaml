              as: ClinicCoordinator
              as_user_id: "${c16}"
              captures: { err_spacing: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-24T00:00:00Z" }
              as: PlanAdministrator
            - call: "POST /treatment-plans/${p19}/treatment-cycles"
              payload: { preauthorization_id: "${ph19b}", retrieval_date: "2026-09-25T00:00:00Z", transfer_date: "2026-09-27T00:00:00Z", embryos_transferred: 1 }
              as: ClinicCoordinator
