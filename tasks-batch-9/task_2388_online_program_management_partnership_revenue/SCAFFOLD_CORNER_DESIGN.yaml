        distinguishing_aspect: "The conditional branch of the incentive ban: the identical SALARY_PLUS_QUALITATIVE plan that is permitted under a partnership claiming the bundled-services exception is prohibited under Lakeshore, whose flag defaulted to false."
        test_recipe:
