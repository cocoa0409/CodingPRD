        grounds: ["state_machines.CollectionEvent.containment_status.COMPLIANT_to_DEFICIENT"]
        excluded_because:
          difficulty_instance: transitive_cascade / containment_failure_cascades_to_program_posture_depth4
          rationale: "The §1.8 cascade instance already walks CollectionEvent -> Appointment -> Resident -> CollectionEvent -> Program end to end with literal assertions at every hop."

