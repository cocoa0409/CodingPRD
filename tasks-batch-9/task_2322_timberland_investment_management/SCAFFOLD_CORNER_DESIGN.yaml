      - name: suspension_outranks_the_blackout_window
        claim_type: priority_ordering
        grounds:
          - "validations[priority=60 ERR_CERTIFICATION_SUSPENDED]"
          - "validations[priority=64 ERR_LEASE_BLACKOUT_CONFLICT]"
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / certification_suspended_at_60_beats_lease_blackout_at_64
          rationale: "That instance arms both defects on one commit and asserts ERR_CERTIFICATION_SUSPENDED first, then the blackout error after reinstatement."
      - name: mismatched_parent_outranks_the_tonnage_check
        claim_type: priority_conflict
        grounds:
          - "validations[priority=70 ERR_STAND_PROPERTY_MISMATCH]"
          - "validations[priority=80 ERR_INSUFFICIENT_AVAILABLE_TONS]"
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / stand_property_mismatch_at_70_beats_insufficient_tons_at_80
          rationale: "That instance dedicates an impossible tonnage from a foreign stand and asserts the 70 error wins, then the 80 error on the correct stand."
      - name: acquisition_validity_depends_on_the_case_state
        claim_type: cross_entity_validation
        grounds:
          - "validations[priority=55 ERR_UNDERWRITING_NOT_APPROVED]"
          - "state_machines.UnderwritingCase"
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / property_acquisition_gated_by_underwriting_case_status
          rationale: "That instance walks the same acquire call against DRAFT, SUBMITTED, REJECTED and APPROVED cases and asserts the gate flips only on APPROVED."
      - name: a_legal_block_today_creates_a_future_reentry_conflict
        claim_type: temporal_validation
        grounds:
          - "validations[priority=64 ERR_REENTRY_BUFFER_CONFLICT]"
          - "calculations.reentry_buffer_window"
        excluded_because:
          difficulty_instance: resource_temporal_overlap / reentry_buffer_endpoint_itself_conflicts_one_day_later_allowed
          rationale: "That instance pins the 24-month buffer to the day: the boundary date conflicts and one day later is accepted."
      - name: the_suspension_rule_only_applies_above_one_major_finding
        claim_type: conditional_validation
        grounds:
          - "calculations.certification_posture_derivation"
          - "state_machines.CertificationAudit.FINDINGS_ISSUED_to_SUSPENDED"
        excluded_because:
          difficulty_instance: boundary_precision_check / open_major_finding_threshold_one_conditional_two_suspended
          rationale: "That instance asserts CONDITIONAL at one open MAJOR and SUSPENDED at two, including the OBSERVATION finding that never counts."
  - section: endpoints
    instances:
      - name: stand_create_read_and_list_round_trip
        claim_type: standard_crud
        grounds:
          - "endpoints[POST /timberland/stands]"
          - "endpoints[GET /timberland/stands/{id}]"
          - "endpoints[GET /timberland/properties/{id}/stands]"
          - "entities.Stand"
        distinguishing_aspect: |
          The full read path for a stand must agree with itself: the create response, the direct
          GET and the entry inside the parent's paginated list must carry the same id and the same
          allocation ledger. Divergence between a create response and a subsequent read is the
          classic symptom of computing derived fields in the serializer instead of persisting them.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; fund and Piney Creek Tract (1200.00 acres)."
            - "No cruise plots are recorded, so the stand stays CRUISE_OPEN with a zeroed ledger."
          setup_api_calls:
            - call: "POST /timberland/_clock/set_current_utc"
              payload: {current_utc: "2026-08-01T00:00:00Z"}
              as: FundAdmin
            - call: "POST /timberland/funds"
              payload: {name: "Longleaf Timber Fund I", vintage_year: 2025, committed_capital_usd: 500000.00, target_cash_yield_bps: 0, opening_cash_usd: 400000.00}
              as: FundAdmin
              captures: { fund_id: "$.data.id" }
            - call: "POST /timberland/properties"
