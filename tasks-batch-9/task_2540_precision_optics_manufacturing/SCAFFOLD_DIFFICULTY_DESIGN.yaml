  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: work_order_process_and_compliance_dimensions_advance_independently
        grounds:
          - state_machines.WorkOrder.process_status
          - state_machines.WorkOrder.compliance_status
          - complexity_profile.state_machine_shape
          - entities.WorkOrder.fields.process_status
          - entities.WorkOrder.fields.compliance_status
        distinguishing_aspect: |
          The two WorkOrder dimensions are driven by disjoint trigger sets: compliance-screen and the
          licence decision move compliance_status UNCLASSIFIED -> SCREENED -> CLEARED while leaving
          process_status pinned, and starting the polishing run moves process_status
          BLANKS_RESERVED -> POLISHING while leaving compliance_status pinned, so all three
          intermediate combined states (BLANKS_RESERVED/SCREENED, POLISHING/SCREENED,
          POLISHING/CLEARED) are observable in order.
        test_recipe:
          setup:
            - "A RELEASED design with a LICENSE_REQUIRED ExportClassification for DE, a RELEASED glass lot, a WorkOrder in BLANKS_RESERVED / UNCLASSIFIED, and a SCHEDULED polishing ProcessRun."
            - "Logical clock untouched at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /optics/optical-designs"
              payload: { design_code: "OD-2540-A", aperture_mm: 120.0, wavelength_min_nm: 450, wavelength_max_nm: 700, required_rms_wavefront_waves: 0.0400, tolerance_budget_waves: 0.0800, transmitted_wavefront_budget_waves: 0.1050 }
              as: OpticsEngineer
              captures: { d1: $.data.id }
            - call: "POST /optics/optical-designs/${d1}/tolerance-allocations"
              payload: { contributor_type: "SURFACE_IRREGULARITY", sensitivity_waves_per_unit: 1.5, manufacturing_tolerance_units: 0.0250 }
              as: OpticsEngineer
            - call: "POST /optics/optical-designs/${d1}/tolerance-analysis"
              payload: {}
              as: OpticsEngineer
            - call: "POST /optics/optical-designs/${d1}/release"
              payload: {}
              as: OpticsEngineer
            - call: "POST /optics/export-classifications"
              payload: { design_id: "${d1}", destination_country: "DE" }
              as: ExportComplianceOfficer
              as_user_id: "eco-001"
              captures: { x1: $.data.id }
            - call: "POST /optics/glass-lots"
              payload: { lot_code: "GL-2540-1", glass_type: "N-BK7", melt_index_nd: 1.516800, total_blank_count: 20, declared_index_homogeneity_grade: "H2", declared_striae_grade: "A" }
              as: ProcurementOfficer
              captures: { g1: $.data.id }
            - call: "POST /optics/glass-lots/${g1}/certification"
              payload: { measured_index_homogeneity_grade: "H3", measured_striae_grade: "B", certificate_reference: "CERT-2540-1" }
              as: ProcurementOfficer
              captures: { g1v: $.data.version }
            - call: "POST /optics/work-orders"
              payload: { wo_code: "WO-2540-1", design_id: "${d1}", glass_lot_id: "${g1}", element_count: 2, expected_glass_lot_version: "${g1v}" }
              as: ProcessTechnician
              captures: { w1: $.data.id }
            - call: "POST /optics/metrology-instruments"
              payload: { instrument_code: "IF-2540-1", instrument_type: "PHASE_SHIFTING_INTERFEROMETER", base_uncertainty_waves: 0.0010, last_calibrated_utc: "2026-08-01T00:00:00Z", lateral_resolution_um: 5.0 }
              as: PlantAdmin
              captures: { i1: $.data.id }
            - call: "POST /optics/process-runs"
              payload: { work_order_id: "${w1}", metrology_instrument_id: "${i1}", run_stage: "POLISHING", metrology_window_start_utc: "2026-08-01T08:00:00Z", metrology_window_end_utc: "2026-08-01T10:00:00Z" }
              as: ProcessTechnician
              captures: { r1: $.data.id }
          trigger:
            - call: "POST /optics/work-orders/${w1}/compliance-screen"
              payload: {}
              as: ExportComplianceOfficer
              as_user_id: "eco-001"
            - call: "POST /optics/process-runs/${r1}/start"
              payload: {}
              as: ProcessTechnician
            - call: "POST /optics/export-classifications/${x1}/license-decision"
              payload: { decision: "APPROVED", license_number: "BIS-2540-001" }
              as: ExportComplianceOfficer
              as_user_id: "eco-002"
          assert:
            - "after the compliance-screen call: WorkOrder.${w1}.compliance_status == SCREENED and WorkOrder.${w1}.process_status == BLANKS_RESERVED"
            - "after the start call: WorkOrder.${w1}.process_status == POLISHING and WorkOrder.${w1}.compliance_status == SCREENED"
            - "after the license-decision call: WorkOrder.${w1}.compliance_status == CLEARED and WorkOrder.${w1}.process_status == POLISHING"
            - "ProcessRun.${r1}.run_status == IN_PROCESS"
            - "ProcessRun.${r1}.started_at_utc == 2026-08-01T00:00:00Z"
            - "ExportClassification.${x1}.classification_status == LICENSE_APPROVED"
