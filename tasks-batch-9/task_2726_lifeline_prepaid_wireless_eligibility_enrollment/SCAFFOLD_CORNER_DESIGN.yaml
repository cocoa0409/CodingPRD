            - "the last trigger returns HTTP 409 and ${err_status} == ERR_TRANSFER_NOT_REQUESTED"
            - "ServiceTransfer.${t_id}.status == REJECTED after the refused accept"
            - "Provider.${p2_id}.active_enrollment_count == 0"

