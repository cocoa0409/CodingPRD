              payload: { treatment_cycle_id: "${cyc_id}", pregnancy_test_result: "INCONCLUSIVE" }
              as: Nurse
              captures: { util: $.data.utilization_rate }
          assert:
            - "OutcomeReport for cycle ${cyc_id} has utilization_rate == 0.0"
            - "TreatmentCycle.${cyc_id}.oocytes_retrieved == 0"

