# =============================================================================
# §1.8 Scaffold Difficulty Design — cattle-feedlot-closeout
# Test Targeting Index: >= 2 instances per Difficulty Rule (§0.5), every
# instance grounded in SCAFFOLD.yaml §1.1–§1.7. All numeric asserts were
# computed by executing the declared formulas against the pinned setup inputs.
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: cog_provisional_vs_final_diverge
        grounds:
          - calculations.cost_of_gain
          - entities.Lot.fields.provisional_cog_cents_per_cwt
          - entities.CloseOut.fields.final_cog_cents_per_cwt
        distinguishing_aspect: |
          Entity domain Lot economics: the provisional variant (forward-looking
          ADG projection, yardage accrued to the current clock date) and the
          final variant (actual pay weights at close-out, yardage to ship_date)
          produce different cost-of-gain values for identical cost data:
          2530392.16 provisional vs 172066.67 final cents/cwt.
        test_recipe:
          setup:
            - "Lot L-100: 10 head in at 7000 lbs, purchase 1400000c, arrival 2026-08-01, 10 head assigned to pen A-01, ration R1 (20000c/ton) window [2026-08-01, 2026-08-05)"
            - "Feed call 2026-08-01 base 20.0 lbs/head -> 200 lbs -> 2000c feed; health event 2026-08-01 (withdrawal 0 days, 5000c); death loss 2026-08-02 of 1 insured head, loss value 140745c, claim 140745c approved and paid"
            - "Logical clock 2026-08-03; lot marketed then shipped 2026-08-03 at 7200 lbs out-weight"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T00:00:00Z" }
              as: FeedyardManager
            - call: "POST /feedlot/owners"
              payload: { owner_name: "O-100", billing_email: "o100@x.com" }
              as: FeedyardManager
              captures: { o_id: $.data.id }
            - call: "POST /feedlot/pens"
              payload: { pen_code: "A-01", capacity_head: 100 }
              as: FeedyardManager
              captures: { p_id: $.data.id }
            - call: "POST /feedlot/rations"
              payload: { ration_name: "R1-START", step_level: 1, cost_per_ton_cents: 20000 }
              as: FeedManager
              captures: { r1_id: $.data.id }
            - call: "POST /feedlot/lots"
              payload: { owner_id: "${o_id}", lot_number: "L-100", sex_class: "STEER", head_count_in: 10, in_weight_total_lbs: 7000, purchase_cost_cents: 1400000, arrival_date: "2026-08-01" }
              as: FeedyardManager
              captures: { l_id: $.data.id }
            - call: "POST /feedlot/assignments"
              payload: { pen_id: "${p_id}", lot_id: "${l_id}", head_count: 10, start_date: "2026-08-01" }
              as: FeedyardManager
            - call: "POST /feedlot/ration-assignments"
              payload: { lot_id: "${l_id}", ration_id: "${r1_id}", start_date: "2026-08-01", end_date: "2026-08-05" }
              as: FeedManager
            - call: "POST /feedlot/feed-calls"
              payload: { pen_id: "${p_id}", call_date: "2026-08-01", base_qty_lbs_per_head: 20.0 }
              as: FeedManager
            - call: "POST /feedlot/health-events"
              payload: { lot_id: "${l_id}", treatment_date: "2026-08-01", drug_product: "DRAXXIN", withdrawal_days: 0, head_treated: 1, treatment_cost_cents: 5000 }
              as: CattleHealthTech
            - call: "POST /feedlot/death-losses"
              payload: { lot_id: "${l_id}", loss_date: "2026-08-02", head_count: 1, cause: "RESPIRATORY", insured: true }
              as: CattleHealthTech
              captures: { d_id: $.data.id }
            - call: "POST /feedlot/insurance-claims"
              payload: { death_loss_id: "${d_id}", claimed_amount_cents: 140745 }
              as: CattleHealthTech
              captures: { c_id: $.data.id }
            - call: "POST /feedlot/insurance-claims/${c_id}/decide"
              payload: { decision: "APPROVE" }
              as: ClaimsAdjuster
              as_user_id: "adj-1"
            - call: "POST /feedlot/insurance-claims/${c_id}/pay"
              as: ClaimsTreasurer
              as_user_id: "tre-1"
            - call: "GET /feedlot/lots/${l_id}"
              as: Any
              captures: { prov_cog: $.data.provisional_cog_cents_per_cwt }
            - call: "POST /feedlot/lots/${l_id}/market"
              as: FeedyardManager
            - call: "POST /feedlot/lots/${l_id}/ship"
              payload: { ship_date: "2026-08-03", out_weight_total_lbs: 7200 }
              as: FeedyardManager
              captures: { lot_v_ship: $.data.version }
            - call: "POST /feedlot/close-outs"
              payload: { lot_id: "${l_id}", pricing_basis: "PER_CARCASS", grid_base_price_cents_per_cwt: 19000, expected_lot_version: "${lot_v_ship}" }
              as: RiskManager
              captures: { co_id: $.data.id }
          trigger:
            - call: "POST /feedlot/close-outs/${co_id}/confirm"
              payload:
                carcass_records:
                  - { hot_carcass_weight_lbs: 510, quality_grade: "PRIME", yield_grade: 2 }
                  - { hot_carcass_weight_lbs: 510, quality_grade: "PRIME", yield_grade: 2 }
                  - { hot_carcass_weight_lbs: 510, quality_grade: "PRIME", yield_grade: 2 }
                  - { hot_carcass_weight_lbs: 495, quality_grade: "CHOICE", yield_grade: 3 }
                  - { hot_carcass_weight_lbs: 495, quality_grade: "CHOICE", yield_grade: 3 }
                  - { hot_carcass_weight_lbs: 495, quality_grade: "CHOICE", yield_grade: 3 }
                  - { hot_carcass_weight_lbs: 495, quality_grade: "CHOICE", yield_grade: 3 }
                  - { hot_carcass_weight_lbs: 477, quality_grade: "SELECT", yield_grade: 4 }
                  - { hot_carcass_weight_lbs: 477, quality_grade: "SELECT", yield_grade: 4 }
              as: RiskManager
              captures: { final_cog: $.data.final_cog_cents_per_cwt, total_cost: $.data.total_cost_cents }
          assert:
            - "prov_cog == 2530392.16  (provisional: total cost 1548600c / projected gain 0.612 cwt = 9 head x 2 days x 3.4 lbs)"
            - "final_cog == 172066.67   (final: total cost 1548600c / actual gain 9.0 cwt = 7200 - 7000 x 9/10)"
            - "total_cost == 1548600"
            - "final_cog != prov_cog — identical cost accumulators, two valid variants, different results"

      - name: grid_value_per_carcass_vs_lot_average_diverge
        grounds:
          - calculations.grid_value
          - entities.CloseOut.fields.pricing_basis
        distinguishing_aspect: |
          Entity domain CloseOut grid pricing (different from the Lot cost
          domain of cog_provisional_vs_final_diverge): PER_CARCASS rounds each
          carcass line to cents then sums (262627.75); LOT_AVERAGE rounds the
          weight-averaged adjustments to cents then applies once
          (262627.79). Same carcass data, same base price, results diverge by
          0.04 cents-per-cwt-line rounding semantics.
        test_recipe:
          setup:
            - "Lot L-200: 2 heifers in at 1400 lbs total, purchase 280000c, arrival 2026-08-01; clock 2026-08-02; marketed and shipped 2026-08-02 at 1500 lbs"
            - "CloseOut CO1 created with pricing_basis PER_CARCASS, base 18537c/cwt; confirmed with carcasses (763 lbs CHOICE YG2) and (812 lbs SELECT YG4)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T00:00:00Z" }
              as: FeedyardManager
            - call: "POST /feedlot/owners"
              payload: { owner_name: "O-200", billing_email: "o200@x.com" }
              as: FeedyardManager
              captures: { o_id: $.data.id }
            - call: "POST /feedlot/lots"
              payload: { owner_id: "${o_id}", lot_number: "L-200", sex_class: "HEIFER", head_count_in: 2, in_weight_total_lbs: 1400, purchase_cost_cents: 280000, arrival_date: "2026-08-01" }
              as: FeedyardManager
              captures: { l_id: $.data.id }
            - call: "POST /feedlot/lots/${l_id}/market"
              as: FeedyardManager
            - call: "POST /feedlot/lots/${l_id}/ship"
              payload: { ship_date: "2026-08-02", out_weight_total_lbs: 1500 }
              as: FeedyardManager
              captures: { lot_v: $.data.version }
            - call: "POST /feedlot/close-outs"
              payload: { lot_id: "${l_id}", pricing_basis: "PER_CARCASS", grid_base_price_cents_per_cwt: 18537, expected_lot_version: "${lot_v}" }
              as: RiskManager
              captures: { co1_id: $.data.id }
            - call: "POST /feedlot/close-outs/${co1_id}/confirm"
              payload:
                carcass_records:
                  - { hot_carcass_weight_lbs: 763, quality_grade: "CHOICE", yield_grade: 2 }
                  - { hot_carcass_weight_lbs: 812, quality_grade: "SELECT", yield_grade: 4 }
              as: RiskManager
              captures: { co1_total: $.data.total_grid_value_cents }
            - call: "GET /feedlot/lots/${l_id}"
              as: Any
              captures: { lot_v2: $.data.version }
            - call: "POST /feedlot/close-outs"
              payload: { lot_id: "${l_id}", pricing_basis: "LOT_AVERAGE", grid_base_price_cents_per_cwt: 18537, expected_lot_version: "${lot_v2}" }
              as: RiskManager
              captures: { co2_id: $.data.id }
          trigger:
            - call: "POST /feedlot/close-outs/${co2_id}/confirm"
              payload:
                carcass_records:
                  - { hot_carcass_weight_lbs: 763, quality_grade: "CHOICE", yield_grade: 2 }
                  - { hot_carcass_weight_lbs: 812, quality_grade: "SELECT", yield_grade: 4 }
              as: RiskManager
              captures: { co2_total: $.data.total_grid_value_cents }
            - call: "GET /feedlot/lots/${l_id}/close-outs"
              as: Any
              captures: { co1_status: "$.data[0].status", co2_status: "$.data[1].status" }
          assert:
            - "co1_total == 262627.75  (7.63 cwt x 18737 + 8.12 cwt x 14737, each line rounded to cents then summed)"
            - "co2_total == 262627.79  (avg_qp -928.00, avg_yd -934.22 -> avg price 16674.78; 15.75 cwt x 16674.78 = 262627.785 -> round_half_up)"
            - "co2_total != co1_total — identical carcass data and base price; the pricing_basis variant alone changes the result"
            - "co1_status == SUPERSEDED and co2_status == CONFIRMED (confirm of the newer close-out supersedes the prior CONFIRMED one)"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: feed_call_bunk_score_branch_and_clamp
        grounds:
          - calculations.feed_call_quantity
        distinguishing_aspect: |
          Mode (a) — >= 3 inputs with non-linear interaction: qty depends on
          previous quantity, bunk_score branch deltas (+0.75/+0.25/0/-0.75),
          nested min/max clamp to [8.0, 30.0], then multiplication by live pen
          occupancy; the clamp branch fires for pen B-02 (30.55 -> 30.0) but
          not for B-01 (24.75 -> 24.8).
        test_recipe:
          setup:
            - "Pen B-01 holds lot L-301 (100 head) on ration R1 (20000c/ton); pen B-02 holds lot L-302 (50 head) on the same ration; first calls posted 2026-08-01 with base 24.0 and 29.8 lbs/head respectively"
          setup_api_calls:
            - call: "POST /feedlot/owners"
              payload: { owner_name: "O-300", billing_email: "o300@x.com" }
              as: FeedyardManager
              captures: { o_id: $.data.id }
            - call: "POST /feedlot/pens"
              payload: { pen_code: "B-01", capacity_head: 200 }
              as: FeedyardManager
              captures: { p1: $.data.id }
            - call: "POST /feedlot/pens"
              payload: { pen_code: "B-02", capacity_head: 100 }
              as: FeedyardManager
              captures: { p2: $.data.id }
            - call: "POST /feedlot/rations"
              payload: { ration_name: "R-GROW", step_level: 1, cost_per_ton_cents: 20000 }
              as: FeedManager
              captures: { r1: $.data.id }
            - call: "POST /feedlot/lots"
              payload: { owner_id: "${o_id}", lot_number: "L-301", sex_class: "STEER", head_count_in: 100, in_weight_total_lbs: 70000, purchase_cost_cents: 14000000, arrival_date: "2026-08-01" }
              as: FeedyardManager
              captures: { l1: $.data.id }
            - call: "POST /feedlot/lots"
              payload: { owner_id: "${o_id}", lot_number: "L-302", sex_class: "STEER", head_count_in: 50, in_weight_total_lbs: 35000, purchase_cost_cents: 7000000, arrival_date: "2026-08-01" }
              as: FeedyardManager
              captures: { l2: $.data.id }
            - call: "POST /feedlot/assignments"
              payload: { pen_id: "${p1}", lot_id: "${l1}", head_count: 100, start_date: "2026-08-01" }
              as: FeedyardManager
            - call: "POST /feedlot/assignments"
              payload: { pen_id: "${p2}", lot_id: "${l2}", head_count: 50, start_date: "2026-08-01" }
              as: FeedyardManager
            - call: "POST /feedlot/ration-assignments"
              payload: { lot_id: "${l1}", ration_id: "${r1}", start_date: "2026-08-01", end_date: "2026-08-10" }
              as: FeedManager
            - call: "POST /feedlot/ration-assignments"
              payload: { lot_id: "${l2}", ration_id: "${r1}", start_date: "2026-08-01", end_date: "2026-08-10" }
              as: FeedManager
            - call: "POST /feedlot/feed-calls"
              payload: { pen_id: "${p1}", call_date: "2026-08-01", base_qty_lbs_per_head: 24.0 }
              as: FeedManager
            - call: "POST /feedlot/feed-calls"
              payload: { pen_id: "${p2}", call_date: "2026-08-01", base_qty_lbs_per_head: 29.8 }
              as: FeedManager
          trigger:
            - call: "POST /feedlot/feed-calls"
              payload: { pen_id: "${p1}", call_date: "2026-08-02", bunk_score: 0 }
              as: FeedManager
              captures: { q1: $.data.qty_lbs_per_head, tq1: $.data.total_qty_lbs, tc1: $.data.total_cost_cents }
            - call: "POST /feedlot/feed-calls"
              payload: { pen_id: "${p2}", call_date: "2026-08-02", bunk_score: 0 }
              as: FeedManager
              captures: { q2: $.data.qty_lbs_per_head, tq2: $.data.total_qty_lbs, tc2: $.data.total_cost_cents }
            - call: "GET /feedlot/lots/${l1}"
              as: Any
              captures: { l1_feed: $.data.total_feed_cost_cents }
            - call: "GET /feedlot/lots/${l2}"
              as: Any
              captures: { l2_feed: $.data.total_feed_cost_cents }
          assert:
            - "q1 == 24.8 (24.0 + 0.75 = 24.75, round_half_up to 0.1 lb)"
            - "tq1 == 2480 and tc1 == 24800 (2480/2000 x 20000)"
            - "q2 == 30.0 (29.8 + 0.75 = 30.55 hits the MAX_QTY 30.0 clamp branch)"
            - "tq2 == 1500 and tc2 == 15000"
            - "l1_feed == 48800 (24000 from the 2026-08-01 call + 24800)"
            - "l2_feed == 29900 (14900 + 15000)"

      - name: feed_cost_allocation_rounding_order
        grounds:
          - calculations.feed_cost_allocation
        distinguishing_aspect: |
          Mode (b) — nested rounding where order matters (different mode than
          feed_call_bunk_score_branch_and_clamp's mode (a)): the scaffold pins
          "round each non-final pro-rata share to whole cents, then assign the
          residual to the latest-created assignment". Rounding every share
          independently would yield 2000+3000+5000 = 10000 != 9999 total.
        test_recipe:
          setup:
            - "Pen C-01 (capacity 200) commingles three compatible lots (all STEER, commingle_allowed true, all on ration R-FIN step 1 at 19998c/ton): L-401 with 20 head (assigned first), L-402 with 30 head, L-403 with 50 head (assigned last)"
          setup_api_calls:
            - call: "POST /feedlot/owners"
              payload: { owner_name: "O-400", billing_email: "o400@x.com" }
              as: FeedyardManager
              captures: { o_id: $.data.id }
            - call: "POST /feedlot/pens"
              payload: { pen_code: "C-01", capacity_head: 200 }
              as: FeedyardManager
              captures: { p_id: $.data.id }
            - call: "POST /feedlot/rations"
              payload: { ration_name: "R-FIN", step_level: 1, cost_per_ton_cents: 19998 }
              as: FeedManager
              captures: { r_id: $.data.id }
            - call: "POST /feedlot/lots"
              payload: { owner_id: "${o_id}", lot_number: "L-401", sex_class: "STEER", head_count_in: 20, in_weight_total_lbs: 14000, purchase_cost_cents: 2800000, arrival_date: "2026-08-01", commingle_allowed: true }
              as: FeedyardManager
              captures: { la: $.data.id }
            - call: "POST /feedlot/lots"
              payload: { owner_id: "${o_id}", lot_number: "L-402", sex_class: "STEER", head_count_in: 30, in_weight_total_lbs: 21000, purchase_cost_cents: 4200000, arrival_date: "2026-08-01", commingle_allowed: true }
              as: FeedyardManager
              captures: { lb: $.data.id }
            - call: "POST /feedlot/lots"
              payload: { owner_id: "${o_id}", lot_number: "L-403", sex_class: "STEER", head_count_in: 50, in_weight_total_lbs: 35000, purchase_cost_cents: 7000000, arrival_date: "2026-08-01", commingle_allowed: true }
              as: FeedyardManager
              captures: { lc: $.data.id }
            - call: "POST /feedlot/ration-assignments"
              payload: { lot_id: "${la}", ration_id: "${r_id}", start_date: "2026-08-01", end_date: "2026-08-10" }
              as: FeedManager
            - call: "POST /feedlot/ration-assignments"
              payload: { lot_id: "${lb}", ration_id: "${r_id}", start_date: "2026-08-01", end_date: "2026-08-10" }
              as: FeedManager
            - call: "POST /feedlot/ration-assignments"
              payload: { lot_id: "${lc}", ration_id: "${r_id}", start_date: "2026-08-01", end_date: "2026-08-10" }
              as: FeedManager
            - call: "POST /feedlot/assignments"
              payload: { pen_id: "${p_id}", lot_id: "${la}", head_count: 20, start_date: "2026-08-01" }
              as: FeedyardManager
            - call: "POST /feedlot/assignments"
              payload: { pen_id: "${p_id}", lot_id: "${lb}", head_count: 30, start_date: "2026-08-01" }
              as: FeedyardManager
            - call: "POST /feedlot/assignments"
              payload: { pen_id: "${p_id}", lot_id: "${lc}", head_count: 50, start_date: "2026-08-01" }
              as: FeedyardManager
          trigger:
            - call: "POST /feedlot/feed-calls"
              payload: { pen_id: "${p_id}", call_date: "2026-08-01", base_qty_lbs_per_head: 10.0 }
              as: FeedManager
              captures: { fc_cost: $.data.total_cost_cents }
            - call: "GET /feedlot/lots/${la}"
              as: Any
              captures: { fa: $.data.total_feed_cost_cents }
            - call: "GET /feedlot/lots/${lb}"
              as: Any
              captures: { fb: $.data.total_feed_cost_cents }
            - call: "GET /feedlot/lots/${lc}"
              as: Any
              captures: { fc: $.data.total_feed_cost_cents }
          assert:
            - "fc_cost == 9999 (1000 lbs / 2000 x 19998)"
            - "fa == 2000 (round_half_up(9999 x 20/100) = round_half_up(1999.8))"
            - "fb == 3000 (round_half_up(2999.7))"
            - "fc == 4999 (residual 9999 - 5000, NOT round_half_up(4999.5) = 5000)"
            - "fa + fb + fc == 9999 — pinned order conserves the total; independent per-share rounding would drift to 10000"

      - name: invoice_evaluation_order_death_charge_uses_pre_loss_accrual
        grounds:
          - calculations.invoice_total
          - calculations.death_loss_value
        distinguishing_aspect: |
          Mode (c) — circular-looking dependency with pinned evaluation order
          (different mode than (a) and (b) above): the invoice's death-loss
          line reads feed/yardage/health accrued only through the loss date,
          and the insurance recovery is netted last. Evaluating the death
          charge against FINAL costs would yield 140786 instead of 140745 —
          the pinned order is observable in the invoice lines.
        test_recipe:
          setup:
            - "Same lifecycle as cog_provisional_vs_final_diverge: lot L-100 with feed 2000c, health 5000c, one insured death on 2026-08-02, claim 140745c paid before close-out, shipped 2026-08-03, close-out confirmed with 9 carcass records"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T00:00:00Z" }
              as: FeedyardManager
            - call: "POST /feedlot/owners"
              payload: { owner_name: "O-500", billing_email: "o500@x.com" }
              as: FeedyardManager
              captures: { o_id: $.data.id }
            - call: "POST /feedlot/pens"
              payload: { pen_code: "A-02", capacity_head: 100 }
              as: FeedyardManager
              captures: { p_id: $.data.id }
            - call: "POST /feedlot/rations"
              payload: { ration_name: "R1-500", step_level: 1, cost_per_ton_cents: 20000 }
              as: FeedManager
              captures: { r1_id: $.data.id }
            - call: "POST /feedlot/lots"
              payload: { owner_id: "${o_id}", lot_number: "L-500", sex_class: "STEER", head_count_in: 10, in_weight_total_lbs: 7000, purchase_cost_cents: 1400000, arrival_date: "2026-08-01" }
              as: FeedyardManager
              captures: { l_id: $.data.id }
            - call: "POST /feedlot/assignments"
              payload: { pen_id: "${p_id}", lot_id: "${l_id}", head_count: 10, start_date: "2026-08-01" }
              as: FeedyardManager
            - call: "POST /feedlot/ration-assignments"
              payload: { lot_id: "${l_id}", ration_id: "${r1_id}", start_date: "2026-08-01", end_date: "2026-08-05" }
              as: FeedManager
            - call: "POST /feedlot/feed-calls"
              payload: { pen_id: "${p_id}", call_date: "2026-08-01", base_qty_lbs_per_head: 20.0 }
              as: FeedManager
            - call: "POST /feedlot/health-events"
              payload: { lot_id: "${l_id}", treatment_date: "2026-08-01", drug_product: "DRAXXIN", withdrawal_days: 0, head_treated: 1, treatment_cost_cents: 5000 }
              as: CattleHealthTech
            - call: "POST /feedlot/death-losses"
              payload: { lot_id: "${l_id}", loss_date: "2026-08-02", head_count: 1, cause: "RESPIRATORY", insured: true }
              as: CattleHealthTech
              captures: { d_id: $.data.id }
            - call: "POST /feedlot/insurance-claims"
              payload: { death_loss_id: "${d_id}", claimed_amount_cents: 140745 }
              as: CattleHealthTech
              captures: { c_id: $.data.id }
            - call: "POST /feedlot/insurance-claims/${c_id}/decide"
              payload: { decision: "APPROVE" }
              as: ClaimsAdjuster
              as_user_id: "adj-1"
            - call: "POST /feedlot/insurance-claims/${c_id}/pay"
              as: ClaimsTreasurer
              as_user_id: "tre-1"
            - call: "POST /feedlot/lots/${l_id}/market"
              as: FeedyardManager
            - call: "POST /feedlot/lots/${l_id}/ship"
              payload: { ship_date: "2026-08-03", out_weight_total_lbs: 7200 }
              as: FeedyardManager
              captures: { lot_v: $.data.version }
            - call: "POST /feedlot/close-outs"
              payload: { lot_id: "${l_id}", pricing_basis: "PER_CARCASS", grid_base_price_cents_per_cwt: 19000, expected_lot_version: "${lot_v}" }
              as: RiskManager
              captures: { co_id: $.data.id }
            - call: "POST /feedlot/close-outs/${co_id}/confirm"
              payload:
                carcass_records:
                  - { hot_carcass_weight_lbs: 510, quality_grade: "PRIME", yield_grade: 2 }
                  - { hot_carcass_weight_lbs: 510, quality_grade: "PRIME", yield_grade: 2 }
                  - { hot_carcass_weight_lbs: 510, quality_grade: "PRIME", yield_grade: 2 }
                  - { hot_carcass_weight_lbs: 495, quality_grade: "CHOICE", yield_grade: 3 }
                  - { hot_carcass_weight_lbs: 495, quality_grade: "CHOICE", yield_grade: 3 }
                  - { hot_carcass_weight_lbs: 495, quality_grade: "CHOICE", yield_grade: 3 }
                  - { hot_carcass_weight_lbs: 495, quality_grade: "CHOICE", yield_grade: 3 }
                  - { hot_carcass_weight_lbs: 477, quality_grade: "SELECT", yield_grade: 4 }
                  - { hot_carcass_weight_lbs: 477, quality_grade: "SELECT", yield_grade: 4 }
              as: RiskManager
          trigger:
            - call: "GET /feedlot/lots/${l_id}/invoices"
              as: Any
              captures:
                inv_feed: "$.data[0].feed_cents"
                inv_yard: "$.data[0].yardage_cents"
                inv_hd: "$.data[0].yardage_head_days"
                inv_health: "$.data[0].health_cents"
                inv_death: "$.data[0].death_loss_cents"
