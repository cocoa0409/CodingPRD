scenario: '1906. Protein Bar & Functional Food Manufacturing (nutrition bar co-manufacturer): formulation & nutrient claim
  substantiation, ingredient (protein/sweetener) supply variability, slab/form/cut line scheduling, texture/hardness shelf-life
  testing, allergen matrix & changeover validation, brand customer co-manufacturing & minimums, label & structure-function
  claim review, lot release & retain samples

  '
domain_name: protein-bar-functional-food-manufacturing
api_prefix: /mfg
complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: quota_allocation
  complexity_layers:
  - optimistic_concurrency
  - cascading_side_effects
  - dual_variant_calculation
  - rate_threshold_triggers
  - derived_field_reconciliation
  entity_topology: hybrid
  state_machine_shape: compound
  relationship_patterns:
  - one_to_many
  - cross_aggregate
  - self_referential
  role_model: segregation_of_duties
  consistency_model: immediate
response_envelope:
  success: "{ \"meta\": { \"api_request_id\": \"req_xxx\", \"api_request_timestamp\": \"ISO8601\" \"}\",\n  \"response_type\"\
    : \"object\" | \"array\", \"data\": {} }\n"
  error: "{ \"meta\": { ... \"}\", \"response_type\": \"error\",\n  \"data\": { \"error_id\": \"ERR_XXX\", \"message\": \"\
    ...\" } }\n"
  pagination_fields:
  - limit
  - offset
  - total_count
  - has_more
  pagination_defaults:
    limit: 10
    min: 1
    max: 100
    offset: 0
entities:
- name: Supplier
  parent: null
  common_fields: true
  fields:
  - name: name
    type: string
    source: input
    description: Legal supplier name
  - name: qualification_status
    type: enum
    source: input
    default: PROVISIONAL
    constraints: PROVISIONAL | APPROVED | SUSPENDED
    description: Supplier qualification for ingredient receipt; only APPROVED suppliers may deliver lots
  - name: allergens_handled
    type: array
    source: input
    description: Array of allergen enum values (MILK, SOY, PEANUT, TREE_NUT, WHEAT, EGG, SESAME) handled at supplier site
    default: []
- name: Ingredient
  parent: null
  common_fields: true
  fields:
  - name: name
    type: string
    source: input
    description: Ingredient name
  - name: category
    type: enum
    source: input
    constraints: PROTEIN | SWEETENER | BINDER | FAT | FLAVOR | ADDITIVE
    description: Functional category; drives which nominal assay field is mandatory
  - name: allergen_tags
    type: array
    source: input
    default: []
    description: Allergen enum values carried by this ingredient
  - name: nominal_protein_pct
    type: number
    source: input
    description: Nominal protein fraction 0..1; required when category == PROTEIN
    constraints: 0 < value <= 1; mandatory iff category == PROTEIN
  - name: nominal_sweetness_factor
    type: number
    source: input
    description: Nominal relative sweetness factor; required when category == SWEETENER
    constraints: value > 0; mandatory iff category == SWEETENER
  - name: status
    type: enum
    source: input
    default: ACTIVE
    constraints: ACTIVE | DISCONTINUED
    description: DISCONTINUED ingredients cannot appear in newly submitted formula revisions
- name: IngredientLot
  parent: null
  common_fields: true
  fields:
  - name: ingredient_id
    type: string
    source: input
    description: FK -> Ingredient.id
  - name: supplier_id
    type: string
    source: input
    description: FK -> Supplier.id
  - name: lot_code
    type: string
    source: input
    description: Supplier lot code; unique per ingredient (ingredient_id, lot_code)
    constraints: unique within ingredient_id
  - name: received_qty_kg
    type: number
    source: input
    description: Received quantity in kg, 2dp
    constraints: '> 0'
  - name: coa_protein_pct
    type: number
    source: input
    description: Certificate-of-analysis protein fraction 0..1; required when the ingredient is PROTEIN
    constraints: 0 < value <= 1; mandatory iff ingredient.category == PROTEIN
  - name: coa_sweetness_factor
    type: number
    source: input
    description: CoA relative sweetness factor; required when the ingredient is SWEETENER
    constraints: value > 0; mandatory iff ingredient.category == SWEETENER
  - name: received_at
    type: datetime
    source: input
    description: Receipt timestamp ISO8601 UTC
  - name: available_qty_kg
    type: number
    source: computed
    description: received_qty_kg - reserved_qty_kg - consumed_qty_kg (INV-LOT-MASS)
  - name: reserved_qty_kg
    type: number
    source: computed
    description: Sum of open ProductionRun.reserved_lot_allocations entries for this lot
  - name: consumed_qty_kg
    type: number
    source: computed
    description: Quantity consumed by runs that reached IN_PRODUCTION
  - name: status
    type: enum
    source: system
    constraints: QUARANTINE | RELEASED | REJECTED | DEPLETED
    description: Initial QUARANTINE; RELEASED by QC; REJECTED releases open reservations (cascade); DEPLETED when available
      hits 0 after consumption
- name: BrandCustomer
  parent: null
  common_fields: true
  fields:
  - name: name
    type: string
    source: input
    description: Brand customer name
  - name: contact_email
    type: string
    source: input
    description: Primary contact email
  - name: status
    type: enum
    source: input
    default: ACTIVE
    constraints: ACTIVE | SUSPENDED
    description: SUSPENDED customers cannot create formulas, agreements, or runs
- name: ManufacturingAgreement
  parent: null
  common_fields: true
  fields:
  - name: customer_id
    type: string
    source: input
    description: FK -> BrandCustomer.id
  - name: pricing_mode
    type: enum
    source: input
    constraints: MARGINAL | AVERAGE
    description: 'Tiered pricing variant selector: MARGINAL applies each tier rate to the cases inside that tier; AVERAGE
      applies the single reached tier''s rate to all cases'
  - name: moq_cases_per_run
    type: integer
    source: input
    description: Minimum cases per production run; boundary is inclusive (planned_cases >= moq passes)
    constraints: '> 0'
  - name: committed_cases_per_quarter
    type: integer
    source: input
    description: Committed released cases per 91-day quarter window
    constraints: '> 0'
  - name: tier_breaks
    type: array
    source: input
    description: 'Array of {upto_cases: integer, rate_cents_per_case: integer} sorted ascending by upto_cases; final tier
      MUST have upto_cases == 999999999'
  - name: quarter_start
    type: datetime
    source: input
    description: Quarter window anchor; window is [quarter_start, quarter_start + 91 days) — start inclusive, end exclusive
  - name: produced_cases_current_quarter
    type: integer
    source: computed
    description: Sum of produced_cases over runs of this agreement with release_status == RELEASED and completed_utc inside
      the quarter window (see agreement_quarter_rollup)
    default: 0
  - name: shortfall_cases
    type: integer
    source: computed
    description: max(0, committed_cases_per_quarter - produced_cases_current_quarter)
    default: 0
  - name: status
    type: enum
    source: system
    constraints: NEGOTIATION | ACTIVE | SUSPENDED | TERMINATED
    description: Initial NEGOTIATION; SUSPENDED<->ACTIVE cyclic; TERMINATED terminal
- name: Formula
  parent: null
  common_fields: true
  fields:
  - name: customer_id
    type: string
    source: input
    description: FK -> BrandCustomer.id
  - name: name
    type: string
    source: input
    description: Formula display name
  - name: bar_weight_g
    type: number
    source: input
    description: Finished bar weight in grams
    constraints: '> 0'
  - name: serving_count_per_bar
    type: integer
    source: input
    description: Servings per bar; serving == bar when 1
    default: 1
    constraints: '>= 1'
  - name: status
    type: enum
    source: input
    default: ACTIVE
    constraints: ACTIVE | ARCHIVED
    description: ARCHIVED formulas cannot receive new revisions or runs
  - name: approved_revision_id
    type: string
    source: computed
    description: 'Computed pointer: id of the unique FormulaRevision of this formula whose status == APPROVED, or null (derived,
      not a stored FK)'
- name: FormulaRevision
  parent: Formula
  common_fields: true
  fields:
  - name: formula_id
    type: string
    source: input
    description: FK -> Formula.id
  - name: revision_no
    type: integer
    source: computed
    description: 1-based sequence within the formula, assigned at creation in created_at order
  - name: ingredient_lines
    type: array
    source: input
    description: 'Array of {ingredient_id (references Ingredient.id), qty_kg_per_batch: number > 0, is_protein_contributor:
      boolean}; at least one line required'
  - name: batch_size_kg
    type: number
    source: input
    description: Total dough per batch in kg
    constraints: '> 0'
  - name: target_protein_g_per_serving
    type: number
    source: input
    description: Formulator's target protein grams per serving
    constraints: '>= 0'
  - name: claim_tags
    type: array
    source: input
    default: []
    description: 'Array of claim enums: HIGH_PROTEIN | GOOD_SOURCE_PROTEIN | LOW_SUGAR | GLUTEN_FREE; each requires an APPROVED
      ClaimReview before revision approval'
  - name: allergen_profile
    type: array
    source: computed
    description: Computed union of allergen_tags over all ingredient_lines' ingredients, sorted alphabetically
  - name: label_protein_g_per_serving
    type: number
    source: computed
    description: LABEL variant output of protein_claim_substantiation (nominal assays); null until verify-nutrition
  - name: composite_protein_g_per_serving
    type: number
    source: computed
    description: COMPOSITE variant output of protein_claim_substantiation (reserved-lot CoA assays); null until a run of this
      revision passes verify-pre-run
  - name: status
    type: enum
    source: system
    constraints: DRAFT | SUBMITTED | NUTRITION_VERIFIED | CLAIM_REVIEW | APPROVED | SUPERSEDED
    description: 'Cyclic: CLAIM_REVIEW -> DRAFT via reject-back; APPROVED -> SUPERSEDED when a later revision of the same
      formula is approved'
- name: ProductionLine
  parent: null
  common_fields: true
  fields:
  - name: name
    type: string
    source: input
    description: Line name
  - name: line_type
    type: enum
    source: input
    description: Line configuration
    constraints: SLAB_FORM_CUT
    default: SLAB_FORM_CUT
  - name: capacity_kg_per_hour
    type: number
    source: input
    description: Rated throughput
    constraints: '> 0'
  - name: slab_weight_kg
    type: number
    source: input
    description: Slab weight fed to form/cut section; drives cut_plan_case_count
    constraints: '> 0'
  - name: current_allergen_profile
    type: array
    source: computed
    description: Allergen profile of the most recent run that reached IN_PRODUCTION on this line; [] when never run
    default: []
  - name: last_wet_clean_utc
    type: datetime
    source: system
    description: Timestamp (logical clock) of the most recent validated WET_CLEAN or SWAB_VALIDATE changeover on this line;
      null if none
- name: LineSlot
  parent: ProductionLine
  common_fields: true
  fields:
  - name: line_id
    type: string
    source: input
    description: FK -> ProductionLine.id
  - name: run_id
    type: string
    source: system
    description: FK -> ProductionRun.id; exactly one slot per run (1:1)
  - name: start_utc
    type: datetime
    source: input
    description: Slot start (half-open interval start, inclusive)
  - name: end_utc
    type: datetime
    source: input
    description: Slot end (half-open interval end, exclusive)
    constraints: end_utc > start_utc
  - name: buffer_minutes
    type: integer
    source: computed
    description: 'Changeover buffer required BEFORE this slot, from its ChangeoverEvent.required_level: NONE 0, DRY_CLEAN
      30, WET_CLEAN 60, SWAB_VALIDATE 90'
  - name: status
    type: enum
    source: system
    constraints: CONFIRMED | COMPLETED | RELEASED
    description: Created CONFIRMED at run schedule; COMPLETED when its run completes; RELEASED when the run is cancelled /
      de-scheduled or via explicit release
- name: ProductionRun
  parent: null
  common_fields: true
  fields:
  - name: revision_id
    type: string
    source: input
    description: FK -> FormulaRevision.id; must reference an APPROVED revision
  - name: agreement_id
    type: string
    source: input
    description: FK -> ManufacturingAgreement.id; must reference an ACTIVE agreement
  - name: line_id
    type: string
    source: input
    description: FK -> ProductionLine.id
  - name: planned_cases
    type: integer
    source: input
    description: Planned output in cases (12 bars/case); must satisfy agreement MOQ
    constraints: '> 0'
  - name: batch_code
    type: string
    source: system
    description: 'System batch code: ''BATCH-'' + zero-padded 1-based count of previously created runs (created_at order)'
  - name: reserved_lot_allocations
    type: array
    source: computed
    description: Array of {lot_id, ingredient_id, qty_kg} FIFO reservations from RELEASED lots ordered by received_at ASC,
      tie created_at ASC
  - name: ingredient_readiness
    type: enum
    source: computed
    description: READY iff every ingredient line of the revision is fully reserved from RELEASED lots; else BLOCKED
    constraints: READY | BLOCKED
  - name: provisional_sweetener_required_kg
    type: number
    source: computed
    description: sweetener_blend_adjustment PROVISIONAL variant (nominal factors), computed at run creation
  - name: final_sweetener_required_kg
    type: number
    source: computed
    description: sweetener_blend_adjustment FINAL variant (reserved-lot CoA factors), computed at verify-pre-run; null until
      then
  - name: produced_cases
    type: integer
    source: input
    description: Actual produced cases, supplied at complete
    constraints: '>= 0'
  - name: scrapped_cases
    type: integer
    source: input
    description: Scrapped cases, supplied at complete
    constraints: '>= 0'
  - name: completed_utc
    type: datetime
    source: system
    description: Logical-clock timestamp of completion; null until COMPLETED
  - name: cancel_reason
    type: string
    source: system
    description: OPERATOR_CANCEL | FORMULA_SUPERSEDED | INGREDIENT_SHORTAGE; null unless CANCELLED/de-scheduled
  - name: status
    type: enum
    source: system
    constraints: PLANNED | SCHEDULED | PRE_RUN_VERIFIED | IN_PRODUCTION | COMPLETED | CANCELLED
    description: Production axis of the run's parallel state dimensions
  - name: release_status
    type: enum
    source: system
    constraints: NOT_READY | PENDING_QC | RELEASED | HOLD_REWORK | SCRAPPED
    description: Quality-disposition axis, independent of status; driven by LotRelease decisions
- name: ChangeoverEvent
  parent: ProductionLine
  common_fields: true
  fields:
  - name: line_id
    type: string
    source: system
    description: FK -> ProductionLine.id
  - name: from_run_id
    type: string
    source: system
    description: FK -> ProductionRun.id; null for the first run ever scheduled on the line
  - name: to_run_id
    type: string
    source: system
    description: FK -> ProductionRun.id
  - name: required_level
    type: enum
    source: computed
    description: 'changeover_level_matrix output: NONE | DRY_CLEAN | WET_CLEAN | SWAB_VALIDATE'
    constraints: NONE | DRY_CLEAN | WET_CLEAN | SWAB_VALIDATE
  - name: swab_allergen_ppm
    type: number
    source: input
    description: Allergen swab result ppm; recorded only when required_level == SWAB_VALIDATE
  - name: swab_recorded_by
    type: string
    source: system
    description: X-User-ID of the LabTechnician who recorded the swab
  - name: validated_by
    type: string
    source: system
    description: X-User-ID of the QualityManager who validated; MUST differ from swab_recorded_by (segregation of duties)
  - name: status
    type: enum
    source: system
    constraints: PENDING | CLEANING_LOGGED | SWAB_RECORDED | VALIDATED | FAILED | CANCELLED
    description: NONE-level events are created directly in VALIDATED; FAILED -> CLEANING_LOGGED re-clean loop allowed; CANCELLED
      when its to_run is cancelled or de-scheduled
- name: ShelfLifeStudy
  parent: null
  common_fields: true
  fields:
  - name: revision_id
    type: string
    source: input
    description: FK -> FormulaRevision.id; must reference an APPROVED revision
  - name: chamber_id
    type: string
    source: input
    description: Stability chamber identifier
  - name: shelf_position
    type: string
    source: input
    description: 'Position within chamber; capacity rule: at most one ACTIVE study per (chamber_id, shelf_position) with CLOSED
      interval occupancy [start_utc, expiry_utc]'
  - name: start_utc
    type: datetime
    source: input
    description: Study start (closed interval start)
  - name: expiry_utc
    type: datetime
    source: input
    description: Labeled expiry (closed interval end, INCLUSIVE for occupancy)
    constraints: expiry_utc > start_utc
  - name: hardness_limit_n
    type: number
    source: input
    description: 'Max acceptable texture hardness in newtons; failure is STRICT: projected > limit fails, projected == limit
      passes'
    constraints: '> 0'
  - name: pull_interval_days
    type: integer
    source: input
    description: Days between pulls; pull i due at start_utc + i*interval
    default: 7
    constraints: '>= 1'
  - name: projected_hardness_at_expiry_n
    type: number
    source: computed
    description: hardness_projection output; null until first RECORDED pull
  - name: status
    type: enum
    source: system
    constraints: ACTIVE | COMPLETED | FAILED | TERMINATED
    description: ACTIVE at creation; auto-FAILED when projection exceeds limit; auto-COMPLETED when logical clock passes expiry_utc
      with projection <= limit
- name: ShelfLifePull
  parent: ShelfLifeStudy
  common_fields: true
  fields:
  - name: study_id
    type: string
    source: system
    description: FK -> ShelfLifeStudy.id
  - name: pull_index
    type: integer
    source: computed
    description: 0-based index assigned at recording in created_at order per study
  - name: due_utc
    type: datetime
    source: computed
    description: study.start_utc + pull_index * pull_interval_days
  - name: recorded_utc
    type: datetime
    source: input
    description: Timestamp the texture reading was taken; must be <= logical clock now and <= due_utc + 2 days grace
  - name: hardness_n
    type: number
    source: input
    description: Texture hardness reading in newtons
    constraints: '> 0'
  - name: status
    type: enum
    source: system
    constraints: RECORDED | MISSED
    description: RECORDED at creation; a due-but-unrecorded pull becomes MISSED when the logical clock advances past due_utc
      + 2 days (evaluated at clock-set and at next record attempt)
- name: LotRelease
  parent: ProductionRun
  common_fields: true
  fields:
  - name: run_id
    type: string
    source: system
    description: FK -> ProductionRun.id; exactly one LotRelease per run (1:1), created at run completion
  - name: expected_cases
    type: integer
    source: computed
    description: cut_plan_case_count output for the run's batch on the run's line
  - name: yield_variance_pct
    type: number
    source: computed
    description: round((produced_cases - planned_cases)/planned_cases * 100, 2); release gate requires ABS(variance) <= 5.00
      (boundary inclusive)
  - name: qc_disposition
    type: enum
    source: system
    description: PENDING | PASSED | FAILED
    constraints: PENDING | PASSED | FAILED
  - name: qc_recorded_by
    type: string
    source: system
    description: X-User-ID of the LabTechnician who recorded QC
  - name: decision
    type: enum
    source: system
    description: PENDING | RELEASED | HOLD_REWORK | SCRAPPED
    constraints: PENDING | RELEASED | HOLD_REWORK | SCRAPPED
  - name: decided_by
    type: string
    source: system
    description: X-User-ID of the deciding QualityManager; MUST differ from qc_recorded_by (segregation of duties)
  - name: retain_cases_stored
    type: integer
    source: computed
    description: Sum of cases_count over this run's RetainSamples with status == STORED
    default: 0
- name: RetainSample
  parent: ProductionRun
  common_fields: true
  fields:
  - name: run_id
    type: string
    source: input
    description: FK -> ProductionRun.id; run must be COMPLETED
  - name: bin_id
    type: string
    source: input
    description: Retain storage bin identifier
  - name: cases_count
    type: integer
    source: input
    description: Cases retained
    constraints: '> 0 and <= run.produced_cases'
  - name: retain_until_utc
    type: datetime
    source: input
    description: 'Retain at least 30 days past the run''s completed_utc: retain_until_utc >= completed_utc + 30 days'
  - name: status
    type: enum
    source: input
    default: STORED
    constraints: STORED
    description: Retain samples are registered STORED and remain STORED; only STORED samples count toward the lot-release
      retain gate
- name: ClaimReview
  parent: FormulaRevision
  common_fields: true
  fields:
  - name: revision_id
    type: string
    source: input
    description: FK -> FormulaRevision.id
  - name: claim_tag
    type: enum
    source: input
    description: HIGH_PROTEIN | GOOD_SOURCE_PROTEIN | LOW_SUGAR | GLUTEN_FREE
    constraints: HIGH_PROTEIN | GOOD_SOURCE_PROTEIN | LOW_SUGAR | GLUTEN_FREE
  - name: claim_type
    type: enum
    source: input
    description: NUTRIENT_CONTENT | STRUCTURE_FUNCTION
    constraints: NUTRIENT_CONTENT | STRUCTURE_FUNCTION
  - name: structure_function_disclaimer
    type: boolean
    source: input
    description: FTC structure/function disclaimer present on label; required true to approve a STRUCTURE_FUNCTION claim
    default: false
  - name: substantiation_ok
    type: boolean
    source: computed
    description: claim_substantiation_gate output for (claim_tag, claim_type) using the revision's label_protein_g_per_serving,
      sweetener load, and allergen_profile
  - name: reviewer_id
    type: string
    source: system
    description: X-User-ID of the QualityManager who last approved / requested revision
  - name: status
    type: enum
    source: system
    constraints: SUBMITTED | IN_REVIEW | APPROVED | REVISION_REQUESTED
    description: 'Cyclic: REVISION_REQUESTED -> SUBMITTED via resubmit'
state_machines:
- entity: Supplier
  initial_state: PROVISIONAL
  terminal_states: []
  note: qualification_status field machine; PATCH /mfg/suppliers/{id} drives it
  transitions:
  - from: PROVISIONAL
    to: APPROVED
    trigger: PATCH /mfg/suppliers/{id} with qualification_status=APPROVED
    actor: PlantAdmin
    preconditions:
    - supplier exists
    side_effects:
    - increments Supplier.version by 1
  - from: APPROVED
    to: SUSPENDED
    trigger: PATCH /mfg/suppliers/{id} with qualification_status=SUSPENDED
    actor: PlantAdmin
    preconditions: []
    side_effects:
    - increments Supplier.version by 1
  - from: SUSPENDED
    to: APPROVED
    trigger: PATCH /mfg/suppliers/{id} with qualification_status=APPROVED
    actor: PlantAdmin
    preconditions: []
    side_effects:
    - increments Supplier.version by 1
- entity: IngredientLot
  initial_state: QUARANTINE
  terminal_states:
  - REJECTED
  - DEPLETED
  transitions:
  - from: QUARANTINE
    to: RELEASED
    trigger: POST /mfg/ingredient-lots/{id}/release
    actor: QualityManager
    preconditions:
    - lot.status == QUARANTINE
    side_effects:
    - increments IngredientLot.version by 1
  - from: QUARANTINE
    to: REJECTED
    trigger: POST /mfg/ingredient-lots/{id}/reject
    actor: QualityManager
    preconditions:
    - lot.status == QUARANTINE
    side_effects:
    - increments IngredientLot.version by 1
  - from: RELEASED
    to: REJECTED
    trigger: POST /mfg/ingredient-lots/{id}/reject
    actor: QualityManager
    preconditions:
    - lot.status == RELEASED
    side_effects:
    - 'CASCADE-REJECT (depth 3): every open reservation on this lot is released: for each ProductionRun with status IN {PLANNED,
      SCHEDULED} holding an allocation on this lot, the allocation is removed from run.reserved_lot_allocations and lot.reserved_qty_kg
      decremented (link 1)'
    - 'link 2: each such run recomputes ingredient_readiness (any ingredient line now under-reserved => BLOCKED)'
    - 'link 3: a run whose readiness flipped READY->BLOCKED while in SCHEDULED auto-transitions SCHEDULED -> PLANNED with
      cancel_reason=INGREDIENT_SHORTAGE; its LineSlot transitions CONFIRMED -> RELEASED and its ChangeoverEvent transitions
      to CANCELLED'
    - increments IngredientLot.version and each touched ProductionRun.version by 1
  - from: RELEASED
    to: DEPLETED
    trigger: system auto-transition when available_qty_kg reaches exactly 0 after a consumption
    actor: system
    preconditions:
    - available_qty_kg == 0
    - reserved_qty_kg == 0
    - consumed_qty_kg == received_qty_kg
    side_effects:
    - increments IngredientLot.version by 1
- entity: ManufacturingAgreement
  initial_state: NEGOTIATION
  terminal_states:
  - TERMINATED
  transitions:
  - from: NEGOTIATION
    to: ACTIVE
    trigger: POST /mfg/agreements/{id}/activate
    actor: PlantAdmin
    preconditions:
    - customer.status == ACTIVE
    side_effects:
    - increments ManufacturingAgreement.version by 1
  - from: ACTIVE
    to: SUSPENDED
    trigger: POST /mfg/agreements/{id}/suspend
    actor: PlantAdmin
    preconditions: []
    side_effects:
    - increments ManufacturingAgreement.version by 1
  - from: SUSPENDED
    to: ACTIVE
    trigger: POST /mfg/agreements/{id}/resume
    actor: PlantAdmin
    preconditions:
    - customer.status == ACTIVE
    side_effects:
    - increments ManufacturingAgreement.version by 1
  - from: ACTIVE
    to: TERMINATED
    trigger: POST /mfg/agreements/{id}/terminate
    actor: PlantAdmin
    preconditions: []
    side_effects:
    - increments ManufacturingAgreement.version by 1
  - from: SUSPENDED
    to: TERMINATED
    trigger: POST /mfg/agreements/{id}/terminate
    actor: PlantAdmin
    preconditions: []
    side_effects:
    - increments ManufacturingAgreement.version by 1
- entity: FormulaRevision
  initial_state: DRAFT
  terminal_states:
  - SUPERSEDED
  transitions:
  - from: DRAFT
    to: SUBMITTED
    trigger: POST /mfg/revisions/{id}/submit
    actor: FormulationScientist
    preconditions:
    - revision.status == DRAFT
    - every ingredient in ingredient_lines has status == ACTIVE (else ERR_INGREDIENT_DISCONTINUED)
    - formula.status == ACTIVE (else ERR_FORMULA_ARCHIVED)
    side_effects:
    - increments FormulaRevision.version by 1
  - from: SUBMITTED
    to: NUTRITION_VERIFIED
    trigger: POST /mfg/revisions/{id}/verify-nutrition
    actor: QualityManager
    preconditions:
    - revision.status == SUBMITTED
    - LABEL variant of protein_claim_substantiation satisfies every NUTRIENT_CONTENT claim in claim_tags (else ERR_LABEL_CLAIM_UNSUBSTANTIATED)
    side_effects:
    - computes label_protein_g_per_serving via protein_claim_substantiation LABEL variant
    - recomputes substantiation_ok on all non-terminal ClaimReviews of this revision
    - increments FormulaRevision.version by 1
  - from: NUTRITION_VERIFIED
    to: CLAIM_REVIEW
    trigger: POST /mfg/revisions/{id}/send-claim-review
    actor: FormulationScientist
    preconditions:
    - revision.status == NUTRITION_VERIFIED
    side_effects:
    - increments FormulaRevision.version by 1
  - from: CLAIM_REVIEW
    to: APPROVED
    trigger: POST /mfg/revisions/{id}/approve
    actor: QualityManager
    preconditions:
    - revision.status == CLAIM_REVIEW
    - every claim_tag in revision.claim_tags has exactly one ClaimReview with status == APPROVED (else ERR_CLAIM_REVIEW_INCOMPLETE)
    side_effects:
    - 'CASCADE-SUPERSEDE (depth 2): the previously APPROVED revision of the same formula (self-referential, if any) transitions
      APPROVED -> SUPERSEDED (link 1)'
    - 'link 2: every ProductionRun with status IN [PLANNED, SCHEDULED] referencing the superseded revision auto-transitions
      to CANCELLED with cancel_reason=FORMULA_SUPERSEDED; each such run''''s LineSlot transitions CONFIRMED -> RELEASED, its
      ChangeoverEvent transitions to CANCELLED, and its lot reservations are released (lot.reserved_qty_kg decremented)'
    - Formula.approved_revision_id recomputed to this revision
    - increments FormulaRevision.version by 1 and each touched ProductionRun.version by 1
  - from: CLAIM_REVIEW
    to: DRAFT
    trigger: POST /mfg/revisions/{id}/reject-back
    actor: QualityManager
    preconditions:
    - revision.status == CLAIM_REVIEW
    side_effects:
    - increments FormulaRevision.version by 1
    - 'cycle: revision returns to DRAFT for reformulation and may loop DRAFT->...->CLAIM_REVIEW again'
  - from: APPROVED
    to: SUPERSEDED
    trigger: system auto-transition when a later revision of the same formula reaches APPROVED
    actor: system
    preconditions:
    - another revision of the same formula just reached APPROVED
    side_effects:
    - see CASCADE-SUPERSEDE on the approving transition
- entity: ProductionRun
  initial_state: status=PLANNED, release_status=NOT_READY (parallel dimensions)
  terminal_states:
  - CANCELLED
  - COMPLETED
  note: 'Two parallel state axes on one row: status (production) x release_status (quality disposition). release_status NOT_READY->PENDING_QC
    on completion; PENDING_QC->[RELEASED,HOLD_REWORK,SCRAPPED] via LotRelease decide; status CANCELLED only from PLANNED/SCHEDULED;
    release axis never mutates the production axis.'
  transitions:
  - from: PLANNED
    to: SCHEDULED
    trigger: POST /mfg/production-runs/{id}/schedule
    actor: ProductionPlanner
    preconditions:
    - run.status == PLANNED
    - start_utc >= current logical clock (else ERR_SCHEDULE_IN_PAST)
    - half-open [start_utc, end_utc) does not intersect any CONFIRMED slot on the same line (else ERR_SLOT_OVERLAP)
    - gap to each adjacent CONFIRMED slot >= the buffer_minutes required by the changeover computed for this run (else ERR_SLOT_CHANGEOVER_BUFFER_VIOLATION)
    - expected_line_version == line.version (OCC, else ERR_STALE_VERSION)
    side_effects:
    - creates LineSlot(CONFIRMED) with buffer_minutes from the computed ChangeoverEvent.required_level
    - creates ChangeoverEvent for (previous run on this line by end_utc DESC, tie created_at ASC; null from_run if none) ->
      this run; required_level via changeover_level_matrix; NONE-level events are created VALIDATED, others PENDING
    - increments ProductionLine.version by 1 and ProductionRun.version by 1
  - from: SCHEDULED
    to: PRE_RUN_VERIFIED
    trigger: POST /mfg/production-runs/{id}/verify-pre-run
    actor: QualityManager
    preconditions:
    - run.status == SCHEDULED
    - run.ingredient_readiness == READY (else ERR_INGREDIENT_SHORTAGE)
    - the ChangeoverEvent whose to_run_id == run.id has status == VALIDATED (else ERR_CHANGEOVER_NOT_VALIDATED)
    - COMPOSITE variant of protein_claim_substantiation over reserved_lot_allocations satisfies every NUTRIENT_CONTENT claim
      in revision.claim_tags (else ERR_COMPOSITE_CLAIM_UNSUBSTANTIATED)
    side_effects:
    - computes composite_protein_g_per_serving on the revision (COMPOSITE variant)
    - computes final_sweetener_required_kg (FINAL variant) and tops up sweetener reservations from remaining available RELEASED
      quantity of the same ingredient in received_at ASC, created_at ASC order; if top-up cannot cover the delta the transition
      fails with ERR_INGREDIENT_SHORTAGE
    - increments ProductionRun.version by 1
  - from: PRE_RUN_VERIFIED
    to: IN_PRODUCTION
    trigger: POST /mfg/production-runs/{id}/start
    actor: ProductionPlanner
    preconditions:
    - run.status == PRE_RUN_VERIFIED
    side_effects:
    - 'converts each reserved allocation to consumption: lot.reserved_qty_kg -= qty, lot.consumed_qty_kg += qty (available_qty_kg
      unchanged); lot with available==0, reserved==0 auto-transitions to DEPLETED'
    - ProductionLine.current_allergen_profile <- revision.allergen_profile
    - increments ProductionRun.version and ProductionLine.version by 1
  - from: IN_PRODUCTION
    to: COMPLETED
    trigger: POST /mfg/production-runs/{id}/complete
    actor: ProductionPlanner
    preconditions:
    - run.status == IN_PRODUCTION
    - produced_cases <= cut_plan_case_count expected_cases for this run (else ERR_OUTPUT_EXCEEDS_CUT_PLAN)
    side_effects:
    - release_status NOT_READY -> PENDING_QC (parallel axis)
    - creates LotRelease(run_id, qc_disposition=PENDING, decision=PENDING) with computed expected_cases and yield_variance_pct
    - LineSlot CONFIRMED -> COMPLETED
    - completed_utc <- current logical clock
    - increments ProductionRun.version by 1
  - from: PLANNED
    to: CANCELLED
    trigger: POST /mfg/production-runs/{id}/cancel
    actor: ProductionPlanner
    preconditions:
    - run.status == PLANNED
    side_effects:
    - releases all reservations (lot.reserved_qty_kg decremented)
    - cancel_reason <- OPERATOR_CANCEL
    - increments ProductionRun.version by 1
  - from: SCHEDULED
    to: CANCELLED
    trigger: POST /mfg/production-runs/{id}/cancel
    actor: ProductionPlanner
    preconditions:
    - run.status == SCHEDULED
    side_effects:
    - releases all reservations; LineSlot CONFIRMED -> RELEASED; ChangeoverEvent -> CANCELLED unless already in terminal VALIDATED;
      cancel_reason <- OPERATOR_CANCEL
    - increments ProductionRun.version by 1
  - from: SCHEDULED
    to: PLANNED
    trigger: system auto-transition when ingredient_readiness flips READY -> BLOCKED (lot-reject cascade)
    actor: system
    preconditions:
    - ingredient_readiness == BLOCKED
    side_effects:
    - LineSlot CONFIRMED -> RELEASED
    - ChangeoverEvent -> CANCELLED
    - cancel_reason <- INGREDIENT_SHORTAGE
    - increments ProductionRun.version by 1
- entity: ChangeoverEvent
  initial_state: PENDING
  terminal_states:
  - VALIDATED
  - CANCELLED
  transitions:
  - from: PENDING
    to: VALIDATED
    trigger: system at creation when required_level == NONE
    actor: system
    preconditions:
    - required_level == NONE
    side_effects: []
  - from: PENDING
    to: CLEANING_LOGGED
    trigger: POST /mfg/changeovers/{id}/log-cleaning
    actor: ProductionPlanner
    preconditions:
    - event.status == PENDING
    - required_level IN [DRY_CLEAN, WET_CLEAN, SWAB_VALIDATE]
    side_effects:
    - increments ChangeoverEvent.version by 1
  - from: FAILED
    to: CLEANING_LOGGED
    trigger: POST /mfg/changeovers/{id}/log-cleaning (re-clean loop)
    actor: ProductionPlanner
    preconditions:
    - event.status == FAILED
    side_effects:
    - increments ChangeoverEvent.version by 1
    - swab_allergen_ppm, swab_recorded_by cleared
  - from: CLEANING_LOGGED
    to: SWAB_RECORDED
    trigger: POST /mfg/changeovers/{id}/record-swab
    actor: LabTechnician
    preconditions:
    - event.status == CLEANING_LOGGED
    - required_level == SWAB_VALIDATE (else ERR_SWAB_NOT_REQUIRED)
    side_effects:
    - swab_allergen_ppm <- input
    - swab_recorded_by <- X-User-ID
    - increments ChangeoverEvent.version by 1
  - from: CLEANING_LOGGED
    to: VALIDATED
    trigger: POST /mfg/changeovers/{id}/validate
    actor: QualityManager
    preconditions:
    - event.status == CLEANING_LOGGED
    - required_level IN [DRY_CLEAN, WET_CLEAN] (SWAB_VALIDATE requires the SWAB_RECORDED path)
    side_effects:
    - 'if required_level == WET_CLEAN: ProductionLine.last_wet_clean_utc <- current logical clock'
    - validated_by <- X-User-ID
    - increments ChangeoverEvent.version by 1
  - from: SWAB_RECORDED
    to: VALIDATED
    trigger: POST /mfg/changeovers/{id}/validate
    actor: QualityManager
    preconditions:
    - event.status == SWAB_RECORDED
    - swab_allergen_ppm <= 20 (SWAB_LIMIT_PPM, else ERR_SWAB_PPM_EXCEEDS_LIMIT)
    - X-User-ID != swab_recorded_by (segregation of duties, else ERR_SOD_VIOLATION)
    side_effects:
    - ProductionLine.last_wet_clean_utc <- current logical clock
    - validated_by <- X-User-ID
    - increments ChangeoverEvent.version by 1
  - from: SWAB_RECORDED
    to: FAILED
    trigger: POST /mfg/changeovers/{id}/fail
    actor: QualityManager
    preconditions:
    - event.status == SWAB_RECORDED
    side_effects:
    - increments ChangeoverEvent.version by 1
  - from: PENDING
    to: CANCELLED
    trigger: system when to_run is cancelled or de-scheduled
    actor: system
    preconditions: []
    side_effects: []
  - from: CLEANING_LOGGED
    to: CANCELLED
    trigger: system when to_run is cancelled or de-scheduled
    actor: system
    preconditions: []
    side_effects: []
  - from: FAILED
    to: CANCELLED
    trigger: system when to_run is cancelled or de-scheduled
    actor: system
    preconditions: []
    side_effects: []
- entity: ShelfLifeStudy
  initial_state: ACTIVE
  terminal_states:
  - COMPLETED
  - FAILED
  - TERMINATED
  transitions:
  - from: ACTIVE
    to: FAILED
    trigger: system auto-transition when a recorded pull makes hardness_projection projected_hardness_at_expiry_n strictly
      greater than hardness_limit_n
    actor: system
    preconditions:
    - projected_hardness_at_expiry_n > hardness_limit_n (strict; equality passes)
    side_effects:
    - increments ShelfLifeStudy.version by 1
  - from: ACTIVE
    to: COMPLETED
    trigger: system auto-transition evaluated at POST /mfg/_clock/set_current_utc when clock passes expiry_utc
    actor: system
    preconditions:
    - current logical clock > expiry_utc
    - projected_hardness_at_expiry_n <= hardness_limit_n or no pull recorded
    side_effects:
    - increments ShelfLifeStudy.version by 1
  - from: ACTIVE
    to: TERMINATED
    trigger: POST /mfg/shelf-life-studies/{id}/terminate
    actor: LabTechnician
    preconditions:
    - study.status == ACTIVE
    side_effects:
    - increments ShelfLifeStudy.version by 1
- entity: LotRelease
  initial_state: qc_disposition=PENDING, decision=PENDING
  terminal_states:
  - RELEASED
  - SCRAPPED
  note: 'Field-pair machine on (qc_disposition, decision): PENDING/PENDING -> PASSED-or-FAILED/PENDING via record-qc -> decision
    via decide.'
  transitions:
  - from: qc_disposition=PENDING
    to: qc_disposition=PASSED or FAILED
    trigger: POST /mfg/lot-releases/{id}/record-qc
    actor: LabTechnician
    preconditions:
    - lot_release.qc_disposition == PENDING
    side_effects:
    - qc_recorded_by <- X-User-ID
    - increments LotRelease.version by 1
  - from: decision=PENDING
    to: decision=RELEASED
    trigger: POST /mfg/lot-releases/{id}/decide with decision=RELEASED
    actor: QualityManager
    preconditions:
    - decision == PENDING
    - qc_disposition == PASSED (else ERR_QC_NOT_PASSED)
    - ABS(yield_variance_pct) <= 5.00 inclusive (else ERR_YIELD_VARIANCE_EXCEEDED)
    - retain_cases_stored >= 1 (else ERR_RETAIN_SAMPLE_REQUIRED)
    - X-User-ID != qc_recorded_by (else ERR_SOD_VIOLATION)
    side_effects:
    - run.release_status -> RELEASED
    - agreement.produced_cases_current_quarter and shortfall_cases recomputed via agreement_quarter_rollup
    - decided_by <- X-User-ID
    - increments LotRelease.version and ProductionRun.version and ManufacturingAgreement.version by 1
  - from: decision=PENDING
    to: decision=HOLD_REWORK
    trigger: POST /mfg/lot-releases/{id}/decide with decision=HOLD_REWORK
    actor: QualityManager
    preconditions:
    - decision == PENDING
    - X-User-ID != qc_recorded_by (else ERR_SOD_VIOLATION)
    side_effects:
    - run.release_status -> HOLD_REWORK
    - decided_by <- X-User-ID
    - increments LotRelease.version and ProductionRun.version by 1
  - from: decision=PENDING
    to: decision=SCRAPPED
    trigger: POST /mfg/lot-releases/{id}/decide with decision=SCRAPPED
    actor: QualityManager
    preconditions:
    - decision == PENDING
    - X-User-ID != qc_recorded_by (else ERR_SOD_VIOLATION)
    side_effects:
    - run.release_status -> SCRAPPED
    - decided_by <- X-User-ID
    - increments LotRelease.version and ProductionRun.version by 1
  - from: decision=HOLD_REWORK
    to: decision=SCRAPPED
    trigger: POST /mfg/lot-releases/{id}/decide with decision=SCRAPPED (rework abandoned)
    actor: QualityManager
    preconditions:
    - decision == HOLD_REWORK
    side_effects:
    - run.release_status -> SCRAPPED
    - increments LotRelease.version and ProductionRun.version by 1
- entity: ClaimReview
  initial_state: SUBMITTED
  terminal_states:
  - APPROVED
  transitions:
  - from: SUBMITTED
    to: IN_REVIEW
    trigger: POST /mfg/claim-reviews/{id}/start-review
    actor: QualityManager
    preconditions:
    - review.status == SUBMITTED
    side_effects:
    - increments ClaimReview.version by 1
  - from: IN_REVIEW
    to: APPROVED
    trigger: POST /mfg/claim-reviews/{id}/approve
    actor: QualityManager
    preconditions:
    - review.status == IN_REVIEW
    - revision.status IN [NUTRITION_VERIFIED, CLAIM_REVIEW] so label substantiation exists (else ERR_INVALID_STATE)
    - substantiation_ok == true (else ERR_LABEL_CLAIM_UNSUBSTANTIATED)
    - claim_type == STRUCTURE_FUNCTION requires structure_function_disclaimer == true (else ERR_DISCLAIMER_REQUIRED)
    side_effects:
    - reviewer_id <- X-User-ID
    - increments ClaimReview.version by 1
  - from: IN_REVIEW
    to: REVISION_REQUESTED
    trigger: POST /mfg/claim-reviews/{id}/request-revision
    actor: QualityManager
    preconditions:
    - review.status == IN_REVIEW
    side_effects:
    - reviewer_id <- X-User-ID
    - increments ClaimReview.version by 1
  - from: REVISION_REQUESTED
    to: SUBMITTED
    trigger: POST /mfg/claim-reviews/{id}/resubmit
    actor: FormulationScientist
    preconditions:
    - review.status == REVISION_REQUESTED
    side_effects:
    - recomputes substantiation_ok
    - increments ClaimReview.version by 1
    - 'cycle: review may loop SUBMITTED->IN_REVIEW->REVISION_REQUESTED->SUBMITTED'
concurrency_rules:
- rule_id: run-create-stale-agreement
  parent_entity: ManufacturingAgreement
  write_endpoint: POST /mfg/production-runs
  occ_field: expected_agreement_version
  description: 'Creating a ProductionRun against a ManufacturingAgreement whose version has

    advanced since the client last observed it is rejected. Each successful run

    creation increments agreement.version by 1 (the agreement''s committed-volume

    ledger is debited by the new run), so a writer holding an older observed

    version is acting on stale agreement state.

    '
  error_id: ERR_STALE_VERSION
  http_status: 412
- rule_id: schedule-slot-stale-line
  parent_entity: ProductionLine
  write_endpoint: POST /mfg/production-runs/{id}/schedule
  occ_field: expected_line_version
  description: 'Scheduling a ProductionRun on a ProductionLine whose version has advanced

    since the client last observed it is rejected. Each successful schedule

    creates a LineSlot plus ChangeoverEvent and increments line.version by 1,

    so a writer holding an older observed version computed its overlap/buffer

    checks against a stale occupancy picture.

    '
  error_id: ERR_STALE_VERSION
  http_status: 412
calculations:
- name: protein_claim_substantiation
  trigger: 'LABEL variant: POST /mfg/revisions/{id}/verify-nutrition. COMPOSITE variant: POST /mfg/production-runs/{id}/verify-pre-run
    (over that run''s reservations, written onto the run''s revision).'
  algorithm: aggregation
  description: Protein grams per serving used to substantiate protein claims
  input_set: ingredient_lines of the revision with is_protein_contributor == true; bars_per_batch derived from revision.batch_size_kg
    and formula.bar_weight_g
  constants:
    HIGH_PROTEIN_MIN_G_PER_SERVING: 10.0
    GOOD_SOURCE_MIN_G_PER_SERVING: 5.0
  precision: '2 decimal places, round_half_up; ROUNDING ORDER PINNED: each line contribution is rounded to 2dp FIRST, then
    contributions are summed, then divided by bars_per_batch and rounded to 2dp, then divided by serving_count_per_bar and
    rounded to 2dp'
  formula: "bars_per_batch = floor(revision.batch_size_kg * 1000 / formula.bar_weight_g)\nfor each line where line.is_protein_contributor:\n\
    \  pct = LINE_PCT(line)   # variant-dependent, see variants\n  contribution_g[line] = round(line.qty_kg_per_batch * 1000\
    \ * pct, 2)\ntotal_protein_g = sum(contribution_g)\nprotein_g_per_bar = round(total_protein_g / bars_per_batch, 2)\nprotein_g_per_serving\
    \ = round(protein_g_per_bar / formula.serving_count_per_bar, 2)\nHIGH_PROTEIN satisfied iff protein_g_per_serving >= 10.0\n\
    GOOD_SOURCE_PROTEIN satisfied iff protein_g_per_serving >= 5.0\n"
  variants:
  - name: LABEL
    when: verify-nutrition; theoretical label value
    difference: LINE_PCT(line) = Ingredient.nominal_protein_pct (formulation nominal assays)
  - name: COMPOSITE
    when: verify-pre-run; actual composite value from reserved supplier lots
    difference: LINE_PCT(line) = sum(alloc.qty_kg * lot.coa_protein_pct over the run's reserved_lot_allocations for line.ingredient_id)
      / sum(alloc.qty_kg); a line with zero reserved kg makes the variant undefined and the transition fails with ERR_INGREDIENT_SHORTAGE
- name: sweetener_blend_adjustment
  trigger: 'PROVISIONAL variant: POST /mfg/production-runs (run creation). FINAL variant: POST /mfg/production-runs/{id}/verify-pre-run.'
  algorithm: constraint_propagation
  description: Sweetener kg required to deliver the same sweetness contribution under supplier CoA variability
  input_set: ingredient_lines whose ingredient.category == SWEETENER
  constants: {}
  precision: 2 decimal places, round_half_up after ceiling to 0.01 kg
  formula: "for each SWEETENER line:\n  required_kg = ceil_to_0.01(line.qty_kg_per_batch * Ingredient.nominal_sweetness_factor\
    \ / FACTOR(line))\nFACTOR(line): PROVISIONAL uses Ingredient.nominal_sweetness_factor (so provisional == qty_kg_per_batch);\n\
    FINAL uses reserved-lot weighted factor sum(alloc.qty_kg * lot.coa_sweetness_factor)/sum(alloc.qty_kg).\nAt verify-pre-run\
    \ the run tops up reservations by (final - provisional) kg from the same\ningredient's RELEASED lots in received_at ASC,\
    \ created_at ASC order; shortfall => ERR_INGREDIENT_SHORTAGE.\n"
  variants:
  - name: PROVISIONAL
    when: run creation
    difference: uses nominal_sweetness_factor; stored on run.provisional_sweetener_required_kg (sum over sweetener lines)
  - name: FINAL
    when: verify-pre-run
    difference: uses reserved-lot CoA weighted sweetness factor; stored on run.final_sweetener_required_kg; differs from PROVISIONAL
      whenever coa_sweetness_factor != nominal_sweetness_factor
- name: agreement_case_pricing
  trigger: GET /mfg/agreements/{id}/quote
  algorithm: tiered_pricing
  description: Tiered case pricing quote under the agreement's pricing_mode
  input_set: agreement.tier_breaks (ascending by upto_cases), request cases
  constants: {}
  precision: integer cents exact (rates are integer cents); per_case_cents = round_half_up(total_cents / cases, 0) as integer
  formula: "MARGINAL: prev = 0; total_cents = 0\n  for tier in tier_breaks ascending:\n    qty = max(0, min(cases, tier.upto_cases)\
    \ - prev)\n    total_cents += qty * tier.rate_cents_per_case\n    prev = tier.upto_cases\nAVERAGE: t = first tier with\
    \ cases <= tier.upto_cases\n  total_cents = cases * t.rate_cents_per_case\nper_case_cents = round_half_up(total_cents\
    \ / cases, 0)\n"
  variants:
  - name: MARGINAL
    when: agreement.pricing_mode == MARGINAL
    difference: each tier's rate applies only to the cases inside that tier's bracket
  - name: AVERAGE
    when: agreement.pricing_mode == AVERAGE
    difference: the single reached tier's rate applies to ALL cases; for cases above the first tier this yields a strictly
      lower total than MARGINAL when rates are descending
- name: changeover_level_matrix
  trigger: POST /mfg/production-runs/{id}/schedule (computes the ChangeoverEvent.required_level and slot buffer for the to-run)
  algorithm: constraint_propagation
  description: Combinatorial allergen changeover level from carryover set, high-risk membership, and wet-clean staleness
  input_set: from_profile = allergen_profile of the previous run's revision on this line (empty set if none); to_profile =
    this run's revision.allergen_profile; minutes_since_last_wet_clean = (current logical clock - line.last_wet_clean_utc)
    in minutes, or +infinity when null
  constants:
    HIGH_RISK_ALLERGENS:
    - PEANUT
    - TREE_NUT
    WET_CLEAN_STALENESS_MIN: 1440
    BUFFER_MINUTES:
      NONE: 0
      DRY_CLEAN: 30
      WET_CLEAN: 60
      SWAB_VALIDATE: 90
  precision: set semantics; minutes integer
  formula: "carryover = from_profile - to_profile        # residue allergens NOT declared on the incoming product\nif from_profile\
    \ is empty:                    level = NONE\nelif carryover is empty:                     level = DRY_CLEAN\nelif (carryover\
    \ intersect HIGH_RISK_ALLERGENS non-empty) OR (|carryover| >= 2):\n                                             level\
    \ = SWAB_VALIDATE\nelif minutes_since_last_wet_clean > WET_CLEAN_STALENESS_MIN:\n                                    \
    \         level = SWAB_VALIDATE\nelse:                                        level = WET_CLEAN\nslot.buffer_minutes =\
    \ BUFFER_MINUTES[level]\n"
- name: cut_plan_case_count
  trigger: POST /mfg/production-runs/{id}/complete (expected_cases on the created LotRelease); also consulted for ERR_OUTPUT_EXCEEDS_CUT_PLAN
  algorithm: aggregation
  description: 'Sellable case count for a batch on a slab/form/cut line; ROUNDING ORDER PINNED: floor per slab BEFORE multiplying
    by slab count — aggregating dough first and flooring once at the end yields a different (higher) count and is NOT the
    specification'
  input_set: revision.batch_size_kg, line.slab_weight_kg, formula.bar_weight_g
  constants:
    TRIM_PCT: 0.04
    BARS_PER_CASE: 12
  precision: integer counts; all floors
  formula: 'slab_count = floor(revision.batch_size_kg / line.slab_weight_kg)

    bars_per_slab = floor(line.slab_weight_kg * 1000 * (1 - TRIM_PCT) / formula.bar_weight_g)

    total_bars = bars_per_slab * slab_count

    expected_cases = floor(total_bars / BARS_PER_CASE)

    '
- name: hardness_projection
  trigger: POST /mfg/shelf-life-studies/{id}/pulls (recompute on each recorded pull); also read by GET /mfg/shelf-life-studies/{id}/projection
  algorithm: decay_function
  description: Linear hardness growth projection to labeled expiry
  input_set: the study's ShelfLifePulls with status == RECORDED, ordered by recorded_utc ASC, tie-break pull_index ASC
  constants: {}
  precision: 2 decimal places, round_half_up
  formula: "pulls = RECORDED pulls in chronological order (recorded_utc ASC, tie pull_index ASC)\nif |pulls| == 0: projected\
    \ = null\nif |pulls| == 1: projected = pulls[0].hardness_n\nelse:\n  first = pulls[0]; last = pulls[-1]\n  days_span =\
    \ (last.recorded_utc - first.recorded_utc) in days (fractional)\n  shelf_days = (study.expiry_utc - study.start_utc) in\
    \ days (fractional)\n  rate_n_per_day = (last.hardness_n - first.hardness_n) / days_span\n  projected = round(first.hardness_n\
    \ + rate_n_per_day * shelf_days, 2)\nfailure rule (STRICT boundary): study fails iff projected > hardness_limit_n; projected\
    \ == limit PASSES\n"
- name: yield_variance_check
  trigger: POST /mfg/production-runs/{id}/complete (computed on the created LotRelease); enforced at POST /mfg/lot-releases/{id}/decide
  algorithm: threshold
  description: Yield variance vs plan with inclusive 5.00% release gate
  input_set: run.planned_cases, run.produced_cases
  constants:
    YIELD_TOLERANCE_PCT: 5.0
  precision: 2 decimal places, round_half_up
  formula: 'yield_variance_pct = round((produced_cases - planned_cases) / planned_cases * 100, 2)

    RELEASED decision requires ABS(yield_variance_pct) <= 5.00  (exactly 5.00 passes)

    '
- name: agreement_quarter_rollup
  trigger: POST /mfg/lot-releases/{id}/decide (recompute on any decision change); read on GET /mfg/agreements/{id}
  algorithm: aggregation
  description: Quarterly released-case rollup and shortfall for a co-manufacturing agreement
  input_set: runs of the agreement with release_status == RELEASED whose completed_utc falls inside [agreement.quarter_start,
    quarter_start + 91 days) — start INCLUSIVE, end EXCLUSIVE
  constants:
    QUARTER_DAYS: 91
  precision: integer cases
  formula: 'produced_cases_current_quarter = sum(run.produced_cases over the input set)

    shortfall_cases = max(0, committed_cases_per_quarter - produced_cases_current_quarter)

    '
- name: line_day_availability
  trigger: GET /mfg/lines/{id}/day-availability
  algorithm: aggregation
  description: Per-day line occupancy supporting INV-LINE-MINUTES
  input_set: LineSlots of the line with status == CONFIRMED intersecting the requested UTC calendar day [date 00:00Z, date+1
    00:00Z) (half-open intersection)
  constants:
    DAY_MINUTES: 1440
  precision: integer minutes
  formula: 'for each CONFIRMED slot s: occ_s = overlap_minutes([s.start_utc, s.end_utc) intersect day window)

    occupied_minutes = sum(occ_s)

    buffered_minutes = sum(s.buffer_minutes for CONFIRMED slots s whose start_utc falls inside the day window)

    free_minutes = 1440 - occupied_minutes - buffered_minutes

    INV-LINE-MINUTES: free_minutes >= 0 always; a schedule plus its compensating cancel/release restores free_minutes exactly

    '
- name: claim_substantiation_gate
  trigger: ClaimReview creation, resubmit, and revision verify-nutrition (recompute substantiation_ok)
  algorithm: threshold
  description: Per-claim substantiation predicate over computed revision fields
  input_set: revision.label_protein_g_per_serving, revision.allergen_profile, revision.ingredient_lines, formula.bar_weight_g,
    bars_per_batch
  constants:
    HIGH_PROTEIN_MIN_G_PER_SERVING: 10.0
    GOOD_SOURCE_MIN_G_PER_SERVING: 5.0
    LOW_SUGAR_MAX_G_PER_BAR: 4.0
  precision: 2 decimal places, round_half_up
  formula: 'HIGH_PROTEIN: ok iff label_protein_g_per_serving >= 10.0

    GOOD_SOURCE_PROTEIN: ok iff label_protein_g_per_serving >= 5.0

    LOW_SUGAR: sugar_g_per_bar = round(sum(line.qty_kg_per_batch * 1000 over SWEETENER lines) / bars_per_batch, 2); ok iff
    sugar_g_per_bar <= 4.0 (boundary inclusive)

    GLUTEN_FREE: ok iff WHEAT not in revision.allergen_profile

    STRUCTURE_FUNCTION claim_type additionally requires structure_function_disclaimer == true at approve time

    '
validations:
- priority: 1
  category: auth
  check: X-User-Role header present and names a declared role; missing or unknown -> reject
  error_id: ERR_UNAUTHENTICATED
  http_status: 401
  applies_to: all
- priority: 2
  category: auth
  check: acting role appears in the endpoint's roles list
  error_id: ERR_UNAUTHORIZED_ROLE
  http_status: 403
  applies_to: all
- priority: 3
  category: auth
  check: 'BrandCustomerRep scope: X-User-ID must equal the BrandCustomer.id that owns the addressed resource (formula/revision/agreement/run);
    list endpoints must pass customer_id equal to the caller''s own id; any other access is rejected'
  error_id: ERR_FORBIDDEN_CUSTOMER_SCOPE
  http_status: 403
  applies_to: GET /mfg/formulas, GET /mfg/formulas/{id}, GET /mfg/formulas/{id}/revisions, GET /mfg/revisions/{id}, GET /mfg/agreements,
    GET /mfg/agreements/{id}, GET /mfg/agreements/{id}/quote, GET /mfg/production-runs, GET /mfg/production-runs/{id}, POST
    /mfg/formulas, POST /mfg/claim-reviews, GET /mfg/revisions/{id}/claim-reviews
- priority: 4
  category: existence
  check: path-template resources exist, validated left-to-right through the path; each missing resource yields its own domain-specific
    404
  error_id: ERR_CUSTOMER_NOT_FOUND | ERR_FORMULA_NOT_FOUND | ERR_REVISION_NOT_FOUND | ERR_INGREDIENT_NOT_FOUND | ERR_LOT_NOT_FOUND
    | ERR_LINE_NOT_FOUND | ERR_RUN_NOT_FOUND | ERR_AGREEMENT_NOT_FOUND | ERR_SLOT_NOT_FOUND | ERR_CHANGEOVER_NOT_FOUND | ERR_STUDY_NOT_FOUND
    | ERR_RELEASE_NOT_FOUND | ERR_CLAIM_REVIEW_NOT_FOUND | ERR_SUPPLIER_NOT_FOUND
  http_status: 404
  applies_to: all endpoints with path ids
- priority: 5
  category: existence
  check: request-body foreign keys reference existing resources (ingredient_id, supplier_id, customer_id, revision_id, agreement_id,
    line_id, run_id, ingredient_lines[].ingredient_id)
  error_id: ERR_INGREDIENT_NOT_FOUND | ERR_SUPPLIER_NOT_FOUND | ERR_CUSTOMER_NOT_FOUND | ERR_REVISION_NOT_FOUND | ERR_AGREEMENT_NOT_FOUND
    | ERR_LINE_NOT_FOUND | ERR_RUN_NOT_FOUND
  http_status: 404
  applies_to: creation endpoints carrying body FKs
- priority: 6
  category: business_constraint
  check: 'request shape: required fields present, types correct, numeric ranges honored, arrays non-empty where required'
  error_id: ERR_INVALID_REQUEST
  http_status: 400
  applies_to: all
- priority: 7
  category: business_constraint
  check: enum fields carry declared enum members
  error_id: ERR_INVALID_ENUM_VALUE
  http_status: 400
  applies_to: all
- priority: 8
  category: state
  check: target resource is not in a terminal state (TERMINATED agreement, SUPERSEDED revision, REJECTED/DEPLETED lot, CANCELLED
    run/changeover, RELEASED/SCRAPPED lot release decision, COMPLETED/FAILED/TERMINATED study)
  error_id: ERR_TERMINAL_STATE_LOCKED
  http_status: 409
  applies_to: all action endpoints on entities with terminal states
- priority: 9
  category: state
  check: target resource's own state machine permits the requested transition from its current state (covers all action endpoints)
  error_id: ERR_INVALID_STATE
  http_status: 409
  applies_to: all action endpoints
- priority: 10
  category: business_safety
  check: 'gluten-free segregation: at POST /mfg/production-runs, if revision.claim_tags contains GLUTEN_FREE and WHEAT is
    present in line.current_allergen_profile, the run cannot be planned on that line at all'
  error_id: ERR_ALLERGEN_SEGREGATION_VIOLATION
  http_status: 422
  applies_to: POST /mfg/production-runs
- priority: 11
  category: business_safety
  check: 'label substantiation: verify-nutrition requires the LABEL variant to satisfy every NUTRIENT_CONTENT claim in claim_tags'
  error_id: ERR_LABEL_CLAIM_UNSUBSTANTIATED
  http_status: 422
  applies_to: POST /mfg/revisions/{id}/verify-nutrition, POST /mfg/claim-reviews/{id}/approve
- priority: 12
  category: business_safety
  check: 'composite substantiation: verify-pre-run requires the COMPOSITE variant (reserved-lot CoA assays) to satisfy every
    NUTRIENT_CONTENT claim'
  error_id: ERR_COMPOSITE_CLAIM_UNSUBSTANTIATED
  http_status: 422
  applies_to: POST /mfg/production-runs/{id}/verify-pre-run
- priority: 13
  category: business_safety
  check: 'changeover gate: verify-pre-run requires the run''s ChangeoverEvent status == VALIDATED'
  error_id: ERR_CHANGEOVER_NOT_VALIDATED
  http_status: 422
  applies_to: POST /mfg/production-runs/{id}/verify-pre-run
- priority: 14
  category: business_safety
  check: 'swab limit: validating a SWAB_VALIDATE changeover requires swab_allergen_ppm <= 20'
  error_id: ERR_SWAB_PPM_EXCEEDS_LIMIT
  http_status: 422
  applies_to: POST /mfg/changeovers/{id}/validate
- priority: 15
  category: business_safety
  check: 'segregation of duties: changeover validator X-User-ID != swab_recorded_by; lot-release decider X-User-ID != qc_recorded_by'
  error_id: ERR_SOD_VIOLATION
  http_status: 422
  applies_to: POST /mfg/changeovers/{id}/validate, POST /mfg/lot-releases/{id}/decide
- priority: 16
  category: business_safety
  check: 'retain gate: decision RELEASED requires retain_cases_stored >= 1'
  error_id: ERR_RETAIN_SAMPLE_REQUIRED
  http_status: 422
  applies_to: POST /mfg/lot-releases/{id}/decide
- priority: 17
  category: business_safety
  check: 'retain period: retain_until_utc >= run.completed_utc + 30 days'
  error_id: ERR_RETAIN_PERIOD_TOO_SHORT
  http_status: 422
  applies_to: POST /mfg/production-runs/{id}/retain-samples
- priority: 18
  category: business_safety
  check: 'structure/function disclaimer: approving a STRUCTURE_FUNCTION ClaimReview requires structure_function_disclaimer
    == true'
  error_id: ERR_DISCLAIMER_REQUIRED
  http_status: 422
  applies_to: POST /mfg/claim-reviews/{id}/approve
- priority: 19
  category: business_temporal
  check: 'slot schedule is not in the past: start_utc >= current logical clock'
  error_id: ERR_SCHEDULE_IN_PAST
  http_status: 422
  applies_to: POST /mfg/production-runs/{id}/schedule
- priority: 20
  category: business_temporal
  check: 'slot half-open overlap: [start_utc, end_utc) intersects no CONFIRMED slot on the same line (touching endpoints allowed)'
  error_id: ERR_SLOT_OVERLAP
  http_status: 409
  applies_to: POST /mfg/production-runs/{id}/schedule
- priority: 21
  category: business_temporal
  check: 'changeover buffer: gap from each adjacent CONFIRMED slot >= this run''s changeover buffer_minutes (0/30/60/90 by
    level)'
  error_id: ERR_SLOT_CHANGEOVER_BUFFER_VIOLATION
  http_status: 409
  applies_to: POST /mfg/production-runs/{id}/schedule
- priority: 22
  category: business_temporal
  check: 'chamber position capacity: no other ACTIVE study on the same (chamber_id, shelf_position) whose CLOSED [start_utc,
    expiry_utc] interval intersects the new CLOSED interval (start == other''s expiry COUNTS as overlap)'
  error_id: ERR_CHAMBER_POSITION_OCCUPIED
  http_status: 409
  applies_to: POST /mfg/shelf-life-studies
- priority: 23
  category: business_temporal
  check: 'pull window: recorded_utc <= logical clock now and recorded_utc <= due_utc + 2 days grace; a pull whose grace has
    elapsed is MISSED and cannot be recorded'
  error_id: ERR_PULL_WINDOW_MISSED
  http_status: 422
  applies_to: POST /mfg/shelf-life-studies/{id}/pulls
- priority: 24
  category: business_referential
  check: run create requires revision.status == APPROVED
  error_id: ERR_REVISION_NOT_APPROVED
  http_status: 422
  applies_to: POST /mfg/production-runs
- priority: 25
  category: business_referential
  check: run create requires agreement.status == ACTIVE
  error_id: ERR_AGREEMENT_NOT_ACTIVE
  http_status: 422
  applies_to: POST /mfg/production-runs
- priority: 26
  category: business_referential
  check: formula create and run create require the referenced customer.status == ACTIVE
  error_id: ERR_CUSTOMER_SUSPENDED
  http_status: 422
  applies_to: POST /mfg/formulas, POST /mfg/agreements, POST /mfg/production-runs (via agreement's customer)
- priority: 27
  category: business_referential
  check: lot receipt requires supplier.qualification_status == APPROVED
  error_id: ERR_SUPPLIER_NOT_QUALIFIED
  http_status: 422
  applies_to: POST /mfg/ingredient-lots
- priority: 28
  category: business_referential
  check: revision submit requires every ingredient line's ingredient status == ACTIVE
  error_id: ERR_INGREDIENT_DISCONTINUED
  http_status: 422
  applies_to: POST /mfg/revisions/{id}/submit
- priority: 29
  category: business_referential
  check: new revisions and shelf-life studies require formula.status == ACTIVE (not ARCHIVED); run create transitively requires
    the revision's formula ACTIVE
  error_id: ERR_FORMULA_ARCHIVED
  http_status: 422
  applies_to: POST /mfg/formulas/{id}/revisions, POST /mfg/shelf-life-studies
- priority: 30
  category: business_referential
  check: revision approve requires every claim_tag to have exactly one APPROVED ClaimReview
  error_id: ERR_CLAIM_REVIEW_INCOMPLETE
  http_status: 422
  applies_to: POST /mfg/revisions/{id}/approve
- priority: 31
  category: business_constraint
  check: lot_code unique per ingredient across all non-REJECTED lots
  error_id: ERR_DUPLICATE_LOT_CODE
  http_status: 409
  applies_to: POST /mfg/ingredient-lots
- priority: 32
  category: business_constraint
  check: complete requires produced_cases <= cut_plan_case_count expected_cases (cannot sell more bars than the dough yields)
  error_id: ERR_OUTPUT_EXCEEDS_CUT_PLAN
  http_status: 422
  applies_to: POST /mfg/production-runs/{id}/complete
- priority: 33
  category: business_constraint
  check: record-swab only when required_level == SWAB_VALIDATE
  error_id: ERR_SWAB_NOT_REQUIRED
  http_status: 422
  applies_to: POST /mfg/changeovers/{id}/record-swab
- priority: 34
  category: business_constraint
  check: verify-pre-run requires run.ingredient_readiness == READY and successful sweetener top-up
  error_id: ERR_INGREDIENT_SHORTAGE
  http_status: 422
  applies_to: POST /mfg/production-runs/{id}/verify-pre-run
- priority: 35
  category: business_fiscal
  check: lot-release decision RELEASED requires qc_disposition == PASSED and ABS(yield_variance_pct) <= 5.00 inclusive
  error_id: ERR_YIELD_VARIANCE_EXCEEDED
  http_status: 422
  applies_to: POST /mfg/lot-releases/{id}/decide
- priority: 36
  category: business_fiscal
  check: lot-release decision RELEASED requires qc_disposition == PASSED
  error_id: ERR_QC_NOT_PASSED
  http_status: 422
  applies_to: POST /mfg/lot-releases/{id}/decide
- priority: 37
  category: business_fiscal
  check: run create requires planned_cases >= agreement.moq_cases_per_run (boundary inclusive)
  error_id: ERR_MOQ_SHORTFALL
  http_status: 422
  applies_to: POST /mfg/production-runs
- priority: 38
  category: business_constraint
  check: 'OCC: expected_agreement_version == agreement.version at run create; expected_line_version == line.version at schedule'
  error_id: ERR_STALE_VERSION
  http_status: 412
  applies_to: POST /mfg/production-runs, POST /mfg/production-runs/{id}/schedule
endpoints:
- method: POST
  path: /mfg/suppliers
  description: Register a supplier
  roles:
  - PlantAdmin
  code: 201
  input:
  - name
  - allergens_handled?
  - qualification_status?
  output: Supplier
  side_effects: []
- method: GET
  path: /mfg/suppliers
  description: List suppliers
  roles:
  - PlantAdmin
  - FormulationScientist
  - QualityManager
  - ProductionPlanner
  - LabTechnician
  code: 200
  input:
  - qualification_status?
  - limit?
  - offset?
  output: Supplier[]
  side_effects: []
- method: GET
  path: /mfg/suppliers/{id}
  description: Read one supplier
  roles:
  - PlantAdmin
  - FormulationScientist
  - QualityManager
  - ProductionPlanner
  - LabTechnician
  code: 200
  input: []
  output: Supplier
  side_effects: []
- method: PATCH
  path: /mfg/suppliers/{id}
  description: Update supplier qualification status / allergens
  roles:
  - PlantAdmin
  code: 200
  input:
  - qualification_status?
  - allergens_handled?
  output: Supplier
  side_effects:
  - increments Supplier.version by 1
- method: POST
  path: /mfg/ingredients
  description: Register an ingredient
  roles:
  - PlantAdmin
  code: 201
  input:
  - name
  - category
  - allergen_tags?
  - nominal_protein_pct?
  - nominal_sweetness_factor?
  - status?
  output: Ingredient
  side_effects: []
- method: GET
  path: /mfg/ingredients
  description: List ingredients
  roles:
  - PlantAdmin
  - FormulationScientist
  - QualityManager
  - ProductionPlanner
  - LabTechnician
  code: 200
  input:
  - category?
  - status?
  - limit?
  - offset?
  output: Ingredient[]
  side_effects: []
- method: GET
  path: /mfg/ingredients/{id}
  description: Read one ingredient
  roles:
  - PlantAdmin
  - FormulationScientist
  - QualityManager
  - ProductionPlanner
  - LabTechnician
  code: 200
  input: []
  output: Ingredient
  side_effects: []
- method: POST
  path: /mfg/ingredient-lots
  description: Receive an ingredient lot into QUARANTINE
  roles:
  - PlantAdmin
  code: 201
  input:
  - ingredient_id
  - supplier_id
  - lot_code
  - received_qty_kg
  - received_at
  - coa_protein_pct?
  - coa_sweetness_factor?
  output: IngredientLot
  side_effects:
  - supplier must be APPROVED else ERR_SUPPLIER_NOT_QUALIFIED
- method: GET
  path: /mfg/ingredient-lots
  description: List/filter ingredient lots
  roles:
  - PlantAdmin
  - FormulationScientist
  - QualityManager
  - ProductionPlanner
  - LabTechnician
  code: 200
  input:
  - ingredient_id?
  - supplier_id?
  - status?
  - limit?
  - offset?
  output: IngredientLot[]
  side_effects: []
- method: GET
  path: /mfg/ingredient-lots/{id}
  description: Read one ingredient lot
  roles:
  - PlantAdmin
  - FormulationScientist
  - QualityManager
  - ProductionPlanner
  - LabTechnician
  code: 200
  input: []
  output: IngredientLot
  side_effects: []
- method: POST
  path: /mfg/ingredient-lots/{id}/release
  description: QC release a quarantined lot
  roles:
  - QualityManager
