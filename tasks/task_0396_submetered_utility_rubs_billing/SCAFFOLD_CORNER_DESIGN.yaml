  # ===========================================================================
  - section: consistency_model
    instances:
      - name: vendor_bill_approve_returns_computed_fields_same_response
        claim_type: immediate
        grounds:
          - state_machines.VendorBill.RECEIVED_to_APPROVED
          - calculations.vendor_recoverable
          - entities.VendorBill.fields.recoverable_cents
        distinguishing_aspect: "POST /vendor-bills/{id}/approve returns the freshly computed common_area_cents, cap_cents, and recoverable_cents in the SAME response (immediate consistency), no re-read needed."
        test_recipe:
          setup:
            - "A RECEIVED VendorBill of total_cost_cents 100000 on a Property with recovery_cap_pct 0.85, common_area_pct 0.10."
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "Pim", state_code: "CA", recovery_cap_pct: 0.85, common_area_pct: 0.10 }
              as: PropertyManager
              captures: { pim_id: $.data.id }
            - call: "POST /utilities"
              payload: { property_id: "${pim_id}", utility_type: "WATER", allocation_method: "RUBS", unit_of_measure: "GAL" }
              as: PropertyManager
              captures: { uim_id: $.data.id }
            - call: "POST /vendor-bills"
              payload: { property_id: "${pim_id}", utility_id: "${uim_id}", period_label: "2026-06", total_cost_cents: 100000 }
              as: PropertyManager
              captures: { imvb_id: $.data.id }
          trigger:
            - call: "POST /vendor-bills/${imvb_id}/approve"
              payload: {}
              as: PropertyManager
              captures: { ret_rec: $.data.recoverable_cents }
          assert:
            - "Approve response data.common_area_cents == 10000, data.cap_cents == 85000, data.recoverable_cents == 85000"
            - "VendorBill ${imvb_id}.status == APPROVED in the same response"
