      - name: body_references_must_belong_to_the_path_courses_own_station_set
        claim_type: Cross-reference link
        grounds:
          - validations[priority 5]
          - endpoints[POST /ocr/courses/{id}/obstacles]
          - endpoints[POST /ocr/courses/{id}/staff-assignments]
          - errors[ERR_OBSTACLE_NOT_FOUND]
        distinguishing_aspect: "Both link-bearing bodies are scoped to the course in the path: a paired_obstacle_id or an obstacle_id that exists but belongs to a sibling course is a 404, not a 201 with a dangling cross-course link."
        test_recipe:
          setup:
            - "One venue with two DRAFT courses. Course A has a single station and Course B has a single station."
          setup_api_calls:
            - call: "POST /ocr/venues"
              payload: { name: "Ridgeline Quarry", terrain_type: "QUARRY", water_access: "NONE", land_use_zone: "AG-2", protected_acreage_sqm: 2000, restoration_bond_cents: 1000000 }
              as: PermitOfficer
              captures: { venue_id: $.data.id }
            - call: "POST /ocr/venues/${venue_id}/courses"
              payload: { name: "Course A", total_distance_m: 10000, corral_release_rate_per_min: 12.00, corral_throughput_capacity: 200 }
              as: CourseDesigner
              captures: { course_a_id: $.data.id }
            - call: "POST /ocr/courses/${course_a_id}/obstacles"
              payload: { name: "A Station 1", station_index: 1, difficulty_rating: 3, lane_count: 4, service_rate_per_min: 3.00, marshals_required: 1, footprint_sqm: 1200, water_contact: false, bypass_mode: "NONE", penalty_seconds: 0 }
              as: CourseDesigner
              captures: { a1_id: $.data.id }
            - call: "POST /ocr/venues/${venue_id}/courses"
              payload: { name: "Course B", total_distance_m: 9000, corral_release_rate_per_min: 12.00, corral_throughput_capacity: 200 }
              as: CourseDesigner
              captures: { course_b_id: $.data.id }
            - call: "POST /ocr/courses/${course_b_id}/obstacles"
              payload: { name: "B Station 1", station_index: 1, difficulty_rating: 4, lane_count: 4, service_rate_per_min: 3.00, marshals_required: 1, footprint_sqm: 800, water_contact: false, bypass_mode: "TIMED_PENALTY", penalty_seconds: 60 }
              as: CourseDesigner
              captures: { b1_id: $.data.id }
          trigger:
            - call: "POST /ocr/courses/${course_b_id}/obstacles"
              payload: { name: "B Bypass Lane", station_index: 2, difficulty_rating: 2, lane_count: 2, service_rate_per_min: 4.00, marshals_required: 1, footprint_sqm: 300, water_contact: false, bypass_mode: "NONE", penalty_seconds: 0, paired_obstacle_id: "${a1_id}" }
              as: CourseDesigner
            - call: "POST /ocr/courses/${course_b_id}/staff-assignments"
              payload: { staff_person_id: "STAFF-9", staff_role: "MARSHAL", certification_level: "BASIC", shift_start_utc: "2026-09-12T06:00:00Z", shift_end_utc: "2026-09-12T14:00:00Z", obstacle_id: "${a1_id}" }
              as: SafetyOfficer
            - call: "POST /ocr/courses/${course_b_id}/staff-assignments"
              payload: { staff_person_id: "STAFF-9", staff_role: "MARSHAL", certification_level: "BASIC", shift_start_utc: "2026-09-12T06:00:00Z", shift_end_utc: "2026-09-12T14:00:00Z", obstacle_id: "${b1_id}" }
              as: SafetyOfficer
              captures: { sa_b1_id: $.data.id }
          assert:
            - "The first trigger call returns 404 with data.error_id == ERR_OBSTACLE_NOT_FOUND: ${a1_id} exists but not under Course B"
            - "The second trigger call returns 404 with data.error_id == ERR_OBSTACLE_NOT_FOUND for the same reason, so the roster cannot staff a sibling course's station"
            - "The third trigger call returns 201 with StaffAssignment.${sa_b1_id}.obstacle_id == ${b1_id} and status == CONFIRMED"
            - "Obstacle.${b1_id}.confirmed_marshal_count == 1 and staffing_state == MARSHALED"
            - "Obstacle.${a1_id}.confirmed_marshal_count is still 0 and staffing_state is still UNSTAFFED"
            - "Course.${course_b_id}.obstacle_count == 1: the refused paired lane was not persisted"

      - name: the_derived_rate_read_matches_the_declared_formula
        claim_type: Computed read
        excluded_because:
          difficulty_instance: obstacle_effective_rate_step_staffing_inside_nested_min_with_corral_cap
          rationale: "§1.8 reads design_clearance_rate_per_min and effective_clearance_rate_per_min back at every staffing step and pins each literal, which is the computed-read claim for the obstacle surface."

      - name: one_start_call_fans_out_per_entry_outcomes
        claim_type: Bulk action
        excluded_because:
          difficulty_instance: entry_fate_at_the_gun_is_decided_by_the_participants_clearance_state
          rationale: "The only fan-out endpoints in this API are the heat transitions; §1.8 asserts the per-entry partial outcome of one start call across a mixed roster, which is the bulk-semantics claim."

      - name: the_close_call_applies_every_declared_side_effect
        claim_type: Action endpoint
        excluded_because:
          difficulty_instance: entry_elapsed_provisional_gun_reading_vs_official_chip_reading
          rationale: "§1.8 walks the close side effects end to end — DNF marking, official reading computation and the course bubble-up — so a second side-effect sweep for that endpoint would be redundant."

      - name: the_clock_endpoint_expires_permits_as_a_side_effect
        claim_type: Action endpoint
        excluded_because:
          difficulty_instance: permit_expiry_at_the_clock_freezes_venue_courses_waves_and_festival_services
          rationale: "§1.8 asserts the expired_permit_ids payload of POST /ocr/_clock/set_current_utc together with the whole freeze cascade it triggers."

      - name: relinking_an_entry_moves_it_between_two_heats
        claim_type: Cross-reference link
        excluded_because:
          difficulty_instance: reassigning_an_entry_conserves_the_total_roster_count_across_both_heats
          rationale: "§1.8 pins both endpoints of the relink and the conservation of assigned_count across the source and target heats."

  - section: errors
    instances:
      - name: every_path_id_route_returns_its_own_not_found_code
        claim_type: Error Triggerability
        grounds:
          - validations[priority 3]
          - errors[ERR_PERMIT_NOT_FOUND]
          - errors[ERR_COURSE_NOT_FOUND]
          - errors[ERR_DIVISION_NOT_FOUND]
          - errors[ERR_WAVE_NOT_FOUND]
          - errors[ERR_PARTICIPANT_NOT_FOUND]
          - errors[ERR_ENTRY_NOT_FOUND]
          - errors[ERR_STAFF_ASSIGNMENT_NOT_FOUND]
          - errors[ERR_RESTORATION_TASK_NOT_FOUND]
        distinguishing_aspect: "Each path-id route reports the entity it failed to find rather than a shared generic 404, so a well-formed but unknown identifier is distinguishable per resource family."
        test_recipe:
          setup:
            - "An empty store; the logical clock is left at its default 2026-08-01T00:00:00Z. Every identifier below is a well-formed UUID that was never issued."
          setup_api_calls:
            - call: "POST /ocr/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PermitOfficer
          trigger:
            - call: "GET /ocr/permits/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: PermitOfficer
            - call: "GET /ocr/courses/00000000-0000-4000-8000-000000000002"
              payload: {}
              as: CourseDesigner
            - call: "GET /ocr/divisions/00000000-0000-4000-8000-000000000003"
              payload: {}
              as: RaceDirector
            - call: "GET /ocr/waves/00000000-0000-4000-8000-000000000004"
              payload: {}
              as: RaceDirector
            - call: "GET /ocr/participants/00000000-0000-4000-8000-000000000005"
              payload: {}
              as: SiteOpsLead
            - call: "GET /ocr/entries/00000000-0000-4000-8000-000000000006"
              payload: {}
              as: RaceDirector
            - call: "GET /ocr/staff-assignments/00000000-0000-4000-8000-000000000007"
              payload: {}
              as: SafetyOfficer
            - call: "GET /ocr/restoration-tasks/00000000-0000-4000-8000-000000000008"
              payload: {}
              as: PermitOfficer
          assert:
            - "The permit read returns 404 with data.error_id == ERR_PERMIT_NOT_FOUND"
            - "The course read returns 404 with data.error_id == ERR_COURSE_NOT_FOUND"
            - "The division read returns 404 with data.error_id == ERR_DIVISION_NOT_FOUND"
            - "The wave read returns 404 with data.error_id == ERR_WAVE_NOT_FOUND"
            - "The participant read returns 404 with data.error_id == ERR_PARTICIPANT_NOT_FOUND"
            - "The entry read returns 404 with data.error_id == ERR_ENTRY_NOT_FOUND, and the priority-3 path check answers before the priority-6 ownership check"
            - "The staff-assignment read returns 404 with data.error_id == ERR_STAFF_ASSIGNMENT_NOT_FOUND"
            - "The restoration-task read returns 404 with data.error_id == ERR_RESTORATION_TASK_NOT_FOUND"
            - "Every response carries the standard error envelope with success false and a non-empty message"

      - name: an_unauthenticated_read_and_a_non_owner_read_are_both_rejected
        claim_type: Error Triggerability
        grounds:
          - validations[priority 1]
          - validations[priority 6]
          - errors[ERR_UNAUTHENTICATED]
          - errors[ERR_NOT_ENTRY_OWNER]
        distinguishing_aspect: "Identity is checked twice on the same route: a missing or undeclared role is 401 before anything is looked up, and a declared Participant reading a stranger's entry is 403 ERR_NOT_ENTRY_OWNER — while the same read by staff is allowed, so ownership is a Participant-only restriction."
        test_recipe:
          setup:
            - "An unpermitted DRAFT course with one station, an OPEN heat of capacity 20, and two runners each with a signed waiver and one entry (bibs 1 and 2)."
          setup_api_calls:
            - call: "POST /ocr/venues"
              payload: { name: "Ridgeline Quarry", terrain_type: "QUARRY", water_access: "NONE", land_use_zone: "AG-2", protected_acreage_sqm: 2000, restoration_bond_cents: 1000000 }
