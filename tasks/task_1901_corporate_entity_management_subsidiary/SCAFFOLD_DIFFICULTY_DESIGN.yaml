        distinguishing_aspect: |
          Error-category pair (state, business_safety): the adopt request
          violates state (resolution is DRAFT, not SUBMITTED -> priority 5) AND
          business_safety (adopter sec-01 equals drafter sec-01 -> priority 6
          ERR_SEGREGATION_OF_DUTIES). The state error
          ERR_RESOLUTION_NOT_SUBMITTED must win because priority 5 < 6.
        test_recipe:
          setup:
            - "J1, AG1, ACTIVE entity E1 (base chain; formation resolution adopted by sec-01 drafted by fc-01)"
            - "Resolution R2 (AUTHORIZE_QUALIFICATION) drafted by CorporateSecretary user sec-01 and left in DRAFT"
