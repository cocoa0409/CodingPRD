        grounds: ['calculations.notification_cadence', 'state_machines.Notification']
        distinguishing_aspect: "Cadence: suspension queues a notice now plus reminders at +7d/+13d; dispatch sends only due rows; submitting an appeal obviates the pending reminder, which the next dispatch cancels instead of sending."
        test_recipe:
          setup:
            - "Student suspended at T2 (default clock 2026-08-01T00:00:00Z); reminders scheduled 2026-08-08 and 2026-08-14; deadline 2026-08-15"
