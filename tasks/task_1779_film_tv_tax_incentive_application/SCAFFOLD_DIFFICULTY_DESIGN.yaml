          assert:
            - "Pre-pair: atl == 40000000, btl == 60000000, capped_total == 100000000, provisional_credit == 25000000"
            - "Mid-pair (after QUALIFY): btl == 162500000, capped_total == 202500000, provisional_credit == 60750000"
            - "Post-pair (after compensating DISQUALIFY): atl == 40000000, btl == 60000000, capped_total == 100000000, provisional_credit == 25000000 — identical to the pre-pair snapshot, zero drift"
            - "Invariant holds at every observation: atl_qualified_cents + btl_qualified_cents == sum of effective_amount_cents over QUALIFIED non-superseded entries"

      - name: issue_then_clawback_conserves_program_cap
        grounds:
          - state_machines.IncentiveApplication.APPROVED_to_CREDIT_ISSUED
          - state_machines.CreditCertificate.ISSUED_to_CLAWED_BACK
          - entities.JurisdictionProgram.fields.remaining_cap_cents
          - calculations.clawback_assessment
        distinguishing_aspect: |
          Conserved quantity: the program budget split, pinned as
          annual_cap_cents == allocated_credit_cents + remaining_cap_cents at
          every step. Forward action (issue-credit: allocated +60750000,
          remaining -60750000) paired with its compensating action (clawback
          SUSTAINED: the certificate's full remaining 60750000 forfeited back)
          restores allocated == 0 and remaining == 100000000 — the invariant
          holds before, between, and after. Distinct conserved quantity from
          the spend-totals invariant.
        test_recipe:
          setup:
            - "GA program OPEN (annual cap 100000000); application APPROVED; audit ACCEPTED (attested 40000000 / 162500000)"
            - "Notice at default clock 2026-08-01; clock advanced to 2026-09-10 (40 days, past the 30-day appeal window) before resolve"
          setup_api_calls:
            - { call: "POST /api/jurisdiction-programs", payload: { jurisdiction_code: "GA", program_name: "GA Film Credit FY27", fiscal_year: "FY2027", window_opens_at: "2026-08-01T00:00:00Z", window_closes_at: "2027-07-01T00:00:00Z", annual_cap_cents: 100000000, minimum_qualified_spend_cents: 10000000, base_rate_standard: 0.25, base_rate_elevated: 0.30, elevated_tier_threshold_cents: 200000000, atl_cap_pct: 0.40, resident_uplift_pct: 0.025, transfer_price_floor_pct: 0.90, vendor_verification_validity_days: 365, appeal_window_days: 30, daily_interest_rate: 0.0005, credit_validity_days: 1095, transfer_proposal_validity_days: 14 }, as: FilmOfficeAdmin, captures: { prog_id: $.data.id } }
            - { call: "POST /api/jurisdiction-programs/${prog_id}/transition", payload: { to_state: "OPEN" }, as: FilmOfficeAdmin }
            - { call: "POST /api/production-companies", payload: { legal_name: "Peachtree Pictures LLC", fein: "58-1002003", contact_email: "ops@peachtree.example" }, as: Producer, captures: { co_id: $.data.id } }
            - { call: "POST /api/productions", payload: { production_company_id: "${co_id}", title: "Atlantic Crossing", production_type: "FEATURE", scheduled_start_date: "2026-09-01T00:00:00Z", scheduled_wrap_date: "2026-12-15T00:00:00Z", total_budget_cents: 400000000 }, as: Producer, as_user_id: "${co_id}", captures: { prod_id: $.data.id } }
            - { call: "POST /api/applications", payload: { production_id: "${prod_id}", jurisdiction_program_id: "${prog_id}", estimated_qualified_spend_cents: 250000000 }, as: Producer, as_user_id: "${co_id}", captures: { app_id: $.data.id } }
            - { call: "POST /api/applications/${app_id}/submit", payload: {}, as: Producer, as_user_id: "${co_id}" }
            - { call: "POST /api/applications/${app_id}/claim-review", payload: {}, as: FilmOfficeReviewer, as_user_id: "reviewer-1" }
            - { call: "POST /api/applications/${app_id}/approve", payload: {}, as: FilmOfficeReviewer, as_user_id: "reviewer-2" }
            - { call: "POST /api/audit-packages", payload: { application_id: "${app_id}" }, as: CPAAuditor, as_user_id: "cpa-1", captures: { pkg_id: $.data.id } }
            - { call: "POST /api/audit-packages/${pkg_id}/submit-draft", payload: { documentation_complete: true }, as: CPAAuditor, as_user_id: "cpa-1" }
            - { call: "POST /api/audit-packages/${pkg_id}/attest", payload: { attested_atl_cents: 40000000, attested_btl_cents: 162500000, documentation_complete: true }, as: CPAAuditor, as_user_id: "cpa-1" }
            - { call: "POST /api/audit-packages/${pkg_id}/decision", payload: { outcome: "ACCEPT" }, as: FilmOfficeReviewer, as_user_id: "reviewer-3" }
          trigger:
            - { call: "POST /api/applications/${app_id}/issue-credit", payload: {}, as: FilmOfficeAdmin, captures: { cert_id: $.data.id } }
            - { call: "GET /api/jurisdiction-programs/${prog_id}", as: FilmOfficeAdmin, captures: { mid_alloc: $.data.allocated_credit_cents, mid_rem: $.data.remaining_cap_cents } }
            - { call: "POST /api/clawback-cases", payload: { application_id: "${app_id}", trigger_reason: "SPEND_SHORTFALL", penalty_mode: "SIMPLE", shortfall_amount_cents: 25125000 }, as: FilmOfficeAdmin, captures: { case_id: $.data.id } }
            - { call: "POST /api/clawback-cases/${case_id}/send-notice", payload: {}, as: FilmOfficeAdmin }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-09-10T00:00:00Z" }, as: FilmOfficeAdmin }
            - { call: "POST /api/clawback-cases/${case_id}/resolve", payload: { outcome: "SUSTAINED" }, as: FilmOfficeAdmin, captures: { assessed: $.data.assessed_total_cents, interest: $.data.interest_cents, recovered: $.data.recovered_from_certificate_cents, cash: $.data.cash_assessment_cents } }
