      - name: withdrawal_reallocation_floors_then_sweeps_residual_by_fraction
        claim_type: waterfall_allocation
        grounds:
          - calculations.percentage_interest_reallocation
          - entities.Unit.fields.percentage_interest_bp
          - entities.Unit.fields.base_percentage_interest_bp
          - entities.DeclarationPackage.fields.allocated_bp_total
          - entities.ConversionProject.fields.bp_conservation_total
          - endpoints[POST /units/{id}/withdraw]
        distinguishing_aspect: "Truncate-then-sweep, and the sweep is ranked by FRACTIONAL PART first.
          Withdrawing the FIRST 3333 unit (not the 3334 unit of the scaffold's own worked example) leaves
          base_sum 6667 with raw shares 4999.2500375... and 5000.7499625..., floors 4999 and 5000,
          residual 1, and the residual must land on the larger fractional part - the 3334-base unit -
          giving 4999 / 5001. Rounding half-up instead would give 4999 / 5001 by luck on this pair but
          would also produce 5000 + 5001 = 10001 without the floor step, and sweeping by base bp DESC
          before fraction DESC is indistinguishable here only if the fraction ranking is honoured. The
          withdrawn unit must read percentage_interest_bp 0 while allocated_bp_total stays exactly 10000."
        test_recipe:
          setup:
            - "Project (total_unit_count 3) with a DRAFT DeclarationPackage holding units 101, 102 and 103
              created in that order at base_percentage_interest_bp 3333, 3333 and 3334, so every
              percentage_interest_bp equals its base and allocated_bp_total is 10000."
