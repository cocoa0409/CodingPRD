        grounds:
          - validations[priority=32]
          - validations[priority=26]
          - entities.DevelopmentApplication.fields.collection_trigger
          - state_machines.DevelopmentApplication.collection_status=NOT_DUE_to_collection_status=PAID
          - errors.ERR_CO_BLOCKED_UNPAID
        distinguishing_aspect: |
          collection_trigger is the config flag that changes which collection paths are
          legal. For a CERTIFICATE_OF_OCCUPANCY application assessment leaves
