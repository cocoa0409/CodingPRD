  - rule_id: resource_temporal_overlap
    instances:

      - name: inspector_half_open_window_with_forty_five_minute_travel_buffer
        grounds:
          - calculations.inspector_window_conflict
          - calculations.inspector_window_conflict.constants.TRAVEL_BUFFER_MINUTES
          - validations.priority_16
          - errors.ERR_INSPECTOR_WINDOW_CONFLICT
          - endpoints.POST_/inspections
        distinguishing_aspect: |
          Resource entity: the Inspector. Interval semantics: HALF-OPEN
          timestamp windows at minute resolution with a 45-minute travel
          buffer added to both sides, and a capacity of exactly ONE — a single
          conflicting window is enough to refuse. The boundary is therefore
          the instant existing_end + 45 min, where the strict < makes the
          adjacent window legal.
        test_recipe:
          setup:
            - "An OPEN program with catalog HP-HVAC-01 (200 A, anchor), a LOW-tier household, an ENROLLED_ACTIVE contractor and an APPROVED assessment."
            - "Two DRAFT projects are not needed: all windows below belong to ONE project, since the conflict rule is scoped to the inspector, not the project."
