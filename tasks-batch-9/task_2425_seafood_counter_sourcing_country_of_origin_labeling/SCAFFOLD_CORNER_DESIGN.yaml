          assert:
            - "trigger call 1 returns HTTP 422 with ${e_sales} == ERR_INSUFFICIENT_REMAINING_WEIGHT"
            - "trigger call 2 returns HTTP 422 with ${e_shrink} == ERR_SHRINK_EXCEEDS_REMAINING"
            - "after trigger calls 1 and 2: SupplierLot.${lot_id}.remaining_weight_kg == 6.000"
            - "trigger call 3 returns HTTP 201 with ShrinkEvent.${se_id}.status == VALUED and provisional_value_cents == 10950 (10200 + 510 + 240 at the UNSOLD_FRESH factor 1.0)"
            - "trigger call 4 returns HTTP 200 with ShrinkEvent.${se_id}.status == POSTED"
            - "SupplierLot.${lot_id}.remaining_weight_kg == 0.000 and intake_status == DEPLETED and case_slot == null"
