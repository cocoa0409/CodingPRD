            - { call: "POST /plant/production-batches/${b_id}/ccp-checks", payload: { check_type: "XRAY", test_piece_detected: true }, as: QATechnician, as_user_id: "qa-tech-1" }
            - { call: "POST /plant/production-batches/${b_id}/complete", payload: {}, as: LineOperator }
            - { call: "POST /plant/production-batches/${b_id}/ccp-checks", payload: { check_type: "XRAY", test_piece_detected: false }, as: QATechnician, as_user_id: "qa-tech-2" }
          trigger:
            - call: "POST /plant/lots/${lot_id}/release"
              payload: {}
              as: QAManager
              as_user_id: "qa-mgr-1"
              captures: { err: $.data.error_id }
            - { call: "POST /plant/production-batches/${b_id}/ccp-checks", payload: { check_type: "XRAY", test_piece_detected: true }, as: QATechnician, as_user_id: "qa-tech-1" }
            - call: "POST /plant/lots/${lot_id}/release"
              payload: {}
