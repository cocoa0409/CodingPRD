      - name: eoi_approve_requires_enrollment_pending_eoi
        grounds:
          - state_machines.EOIRequest.PENDING_to_APPROVED
          - state_machines.Enrollment.PENDING_EOI_to_ACTIVE
          - entities.Enrollment.status
        distinguishing_aspect: |
          Entity pair EOIRequest->Enrollment (different from instance 1's
          Enrollment->Employee): an EOIRequest can only be APPROVED while its linked
          Enrollment.status == PENDING_EOI; once the enrollment leaves PENDING_EOI
          the decision is blocked.
        test_recipe:
          setup:
            - "Employee ELIGIBLE; over-GI VOLUNTARY_LIFE enrollment submitted for EOI (PENDING_EOI); its EOIRequest DENIED, reverting enrollment to DRAFT."
          setup_api_calls:
            - call: "POST /_clock/advance"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: BenefitsAdmin
            - call: "POST /employees"
              payload: { full_name: "Ng Cruz", hire_date: "2026-01-01", employment_type: "FULL_TIME", payroll_schedule: "SEMI_MONTHLY", monthly_household_income_cents: 500000 }
              as: BenefitsAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /employees/${emp_id}/waiting-periods"
