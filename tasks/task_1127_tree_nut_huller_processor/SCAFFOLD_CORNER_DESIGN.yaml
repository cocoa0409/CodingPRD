            - call: "POST /buyers"
              payload: { name: "Acme Snacks", buyer_code: "AC-1" }
              as: PlantAdmin
              captures: { by1: $.data.id }
            - call: "POST /contracts"
              payload: { buyer_id: "${by1}", product_form: "KERNEL", size_spec: "SPEC_23_25", max_defects_pct: 0.05, price_cents_per_lb: 300, required_qty_lbs: 10000 }
              as: PlantAdmin
              captures: { c1: $.data.id }
            - call: "GET /contracts/${c1}"
              as: PlantOperator
              captures: { c1_v: $.data.version }
          trigger:
            - call: "POST /shipments"
              payload: { contract_id: "${c1}", bin_id: "${bin1}", quantity_lbs: 100, expected_contract_version: "${c1_v}" }
              as: PlantOperator
              captures: { sh1: $.data.id }
            - call: "POST /shipments"
              payload: { contract_id: "${c1}", bin_id: "${bin1}", quantity_lbs: 100, expected_contract_version: "${c1_v}" }
              as: PlantOperator
              captures: { err: $.data.error_id }
            - call: "GET /contracts/${c1}"
              as: PlantOperator
              captures: { c1_v2: $.data.version }
            - call: "POST /shipments"
              payload: { contract_id: "${c1}", bin_id: "${bin1}", quantity_lbs: 100, expected_contract_version: "${c1_v2}" }
              as: PlantOperator
              captures: { sh2: $.data.id }
          assert:
            - "first shipment succeeds (201), contract.version advances, reserved_qty_lbs == 100"
            - "replay with stale version: error_id == ERR_STALE_CONTRACT_VERSION, HTTP 412"
            - "create with freshly observed version succeeds: Shipment.${sh2} exists; reserved_qty_lbs == 200"

  - section: consistency_model
    instances:
      - name: placement_create_immediately_visible_in_bin_read
        claim_type: immediate_consistency
        grounds: [complexity_profile.consistency_model, entities.StorageBin.fields.occupied_lbs]
        distinguishing_aspect: "Immediate consistency: the placement creation response shows remaining_lbs == 700, and the very next GET /bins/{id} already reports occupied_lbs == 700 — no lag."
        test_recipe:
          setup: ["Processed lot kernel_out 2400; empty bin B1 cap 5000"]
          setup_api_calls:
            - call: "POST /growers"
              payload: { name: "Riverbend Orchards", ranch_code: "RB-01", base_price_cents_per_lb: 250 }
              as: PlantAdmin
              captures: { g1: $.data.id }
            - call: "POST /lots"
              payload: { grower_id: "${g1}", variety: "Nonpareil", gross_weight_lbs: 5000 }
              as: IntakeOperator
              captures: { lot1: $.data.id }
            - call: "POST /lab-tests"
              payload: { lot_id: "${lot1}", test_type: "MOISTURE_KERNEL", moisture_pct: 6.0, kernel_pct: 0.50, foreign_material_pct: 0.01 }
              as: LabTechnician
            - call: "POST /lab-tests"
              payload: { lot_id: "${lot1}", test_type: "AFLATOXIN", aflatoxin_ppb: 2.0 }
              as: LabTechnician
            - call: "POST /lots/${lot1}/route"
              payload: { route: "KERNEL" }
              as: IntakeOperator
            - call: "GET /lots/${lot1}"
              as: PlantOperator
              captures: { lot1_v: $.data.version }
            - call: "POST /processing-runs"
              payload: { lot_id: "${lot1}", expected_lot_version: "${lot1_v}" }
              as: PlantOperator
              captures: { run1: $.data.id }
            - call: "POST /processing-runs/${run1}/start"
              payload: {}
              as: PlantOperator
            - call: "POST /processing-runs/${run1}/complete"
              payload: { kernel_out_lbs: 2400, shell_out_lbs: 1300, hull_out_lbs: 900 }
              as: PlantOperator
            - call: "POST /lab-tests"
              payload: { lot_id: "${lot1}", test_type: "KERNEL_GRADE", edible_kernel_pct: 0.80, size_spec: "SPEC_23_25" }
              as: LabTechnician
            - call: "POST /bins"
              payload: { bin_code: "B-1", capacity_lbs: 5000, allowed_product_forms: ["KERNEL"] }
              as: PlantAdmin
              captures: { bin1: $.data.id }
          trigger:
            - call: "POST /placements"
              payload: { bin_id: "${bin1}", lot_id: "${lot1}", product_form: "KERNEL", quantity_lbs: 700 }
              as: PlantOperator
              captures: { pl1: $.data.id }
            - call: "GET /bins/${bin1}"
              as: PlantOperator
          assert:
            - "create response: StoragePlacement.${pl1}.remaining_lbs == 700 and status == STORED"
            - "immediate GET: StorageBin.${bin1}.occupied_lbs == 700 and available_now_lbs == 4300"
