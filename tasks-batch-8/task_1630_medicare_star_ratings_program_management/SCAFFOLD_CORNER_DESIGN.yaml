              as: StarsAnalyst
              captures: { m_id: $.data.id }
            - call: "POST /api/measures/${m_id}/transition"
              payload: { to_state: ACTIVE }
              as: StarsAnalyst
            - call: "POST /api/cutpoint-sets"
              payload: { rating_cycle_id: "${cyc_id}", label: "official-2028", rows: [ { measure_id: "${m_id}", band_2_floor: 0.62, band_3_floor: 0.75, band_4_floor: 0.90, band_5_floor: 0.95 } ] }
              as: StarsAnalyst
              captures: { set_id: $.data.id }
            - call: "POST /api/rating-cycles/${cyc_id}/transition"
              payload: { to_state: DATA_COLLECTION }
              as: StarsAdmin
            - call: "POST /api/rating-cycles/${cyc_id}/transition"
              payload: { to_state: CUTPOINT_REVIEW }
              as: StarsAdmin
              captures: { cyc_v: $.data.version }
          trigger:
            - call: "POST /api/cutpoint-sets/${set_id}/publish"
              payload: { expected_rating_cycle_version: "${cyc_v}" }
              as: QualityOps
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_UNAUTHORIZED_ROLE (403)"
            - "CutPointSet.${set_id}.status == DRAFT"

      - name: auditor_cannot_propose_payout
        claim_type: rbac_denial
        grounds: ["roles[IncentiveManager]", "endpoints[POST /api/incentive-payouts]", "errors[ERR_UNAUTHORIZED_ROLE]"]
        distinguishing_aspect: "ComplaintsAuditor has no payout permissions: propose returns ERR_UNAUTHORIZED_ROLE (403) even with a valid group."
        test_recipe:
          setup: ["GAP_CLOSURE provider group exists (linked to any measure)"]
          setup_api_calls:
            - call: "POST /api/rating-cycles"
              payload: { measurement_year: 2026, rating_year: 2028, benchmark_pmpm: 950.0 }
              as: StarsAdmin
              captures: { cyc_id: $.data.id }
            - call: "POST /api/measures"
              payload: { rating_cycle_id: "${cyc_id}", code: "SPD", title: "Statin Adherence", domain: DRUG_SAFETY, measure_type: OUTCOME, direction: HIGHER_BETTER, data_source: PHARMACY_PDE, improvement_eligible: false }
              as: StarsAnalyst
              captures: { m_id: $.data.id }
            - call: "POST /api/provider-groups"
              payload: { name: "Group G", program_type: GAP_CLOSURE, linked_measure_id: "${m_id}", target_star: 5, unit_reward_per_gap: 250.0, max_pool_amount: 10000.0 }
              as: IncentiveManager
              captures: { grp_id: $.data.id }
          trigger:
            - call: "POST /api/incentive-payouts"
              payload: { provider_group_id: "${grp_id}" }
              as: ComplaintsAuditor
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_UNAUTHORIZED_ROLE (403)"

      - name: missing_auth_headers_rejected
        claim_type: rbac_denial
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"]
        distinguishing_aspect: "A request with the X-User-ID / X-User-Role headers omitted returns 400 ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER even on a read endpoint (the test harness sends no headers)."
        test_recipe:
          setup: ["One cycle exists"]
          setup_api_calls:
            - call: "POST /api/rating-cycles"
              payload: { measurement_year: 2026, rating_year: 2028, benchmark_pmpm: 950.0 }
              as: StarsAdmin
          trigger:
            - call: "GET /api/rating-cycles"
              as: StarsAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (400) when headers are omitted"

