            - "Call 3 returns HTTP 201: the predicate is per desk_index, so desk 8 is unaffected by desk 7's occupancy over identical dates"
            - "Call 4 returns HTTP 409 with error id ERR_DESK_CHANGEOVER_CONFLICT for desk 9, mirroring call 1"
            - "Call 5 returns HTTP 200 with DeskAssignment.${da5_id}.status == VACATED and vacated_at == 2026-09-01T09:00:00Z"
