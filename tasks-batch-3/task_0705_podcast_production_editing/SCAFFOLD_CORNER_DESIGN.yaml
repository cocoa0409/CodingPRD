        distinguishing_aspect: "Creating an Episode referencing a DRAFT (not ACTIVE) contract returns ERR_CONTRACT_NOT_ACTIVE (409). Requires a second ACTIVE contract so posture is ACTIVE and the referential check (priority 20), not the posture gate (priority 12), is the failing rule."
        test_recipe:
          setup:
            - "Show S has one ACTIVE STANDARD contract (posture ACTIVE) and a second DRAFT contract C_draft."
          setup_api_calls:
            - call: "POST /shows"
              payload: { title: "CNA S", format: "SOLO", billing_model: "PER_EPISODE" }
              as: PlatformAdmin
              captures: { show_id: $.data.id }
            - call: "POST /contracts"
              payload: { show_id: "${show_id}", tier: "STANDARD", engagement_type: "PER_EPISODE" }
              as: PlatformAdmin
              captures: { c_active: $.data.id }
            - call: "POST /contracts/${c_active}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /contracts"
              payload: { show_id: "${show_id}", tier: "PRIORITY", engagement_type: "PER_EPISODE" }
              as: PlatformAdmin
              captures: { c_draft: $.data.id }
          trigger:
            - call: "POST /episodes"
              payload: { show_id: "${show_id}", contract_id: "${c_draft}", title: "Ep CNA", planned_track_count: 1 }
              as: ShowOwner
              as_user_id: "${show_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 409 and data.error_id == 'ERR_CONTRACT_NOT_ACTIVE' (referenced contract is DRAFT while posture is ACTIVE)."

