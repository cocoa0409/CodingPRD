              as: Teller
              as_user_id: "${t_id}"
            - call: "POST /api/drawers/${d_id}/transactions"
              payload: { account_id: "${a_id}", type: "CASH_DEPOSIT", amount_cents: 400000 }
              as: Teller
              as_user_id: "${t_id}"
            - call: "GET /api/ctr-filings"
              payload: { account_id: "${a_id}" }
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { pre: $.data }
          trigger:
            - call: "POST /api/drawers/${d_id}/transactions"
              payload: { account_id: "${a_id}", type: "CASH_DEPOSIT", amount_cents: 600001 }
              as: Teller
              as_user_id: "${t_id}"
            - call: "GET /api/ctr-filings"
              payload: { account_id: "${a_id}" }
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { f_in: "$.data[0].total_cash_in_cents", f_n: "$.data[0].transaction_ids" }
          assert:
            - "before the third deposit the filings list is empty (${pre} == []) — exempt cash never triggers"
            - "${f_in} == 1000001 (only the two non-exempt deposits count)"
            - "${f_n} contains exactly the 2 non-exempt transaction ids in created_at ASC order"

      - name: fee_waiver_request_refunds_fee_to_account
        claim_type: correct_result
        grounds: [calculations.instrument_fee, state_machines.TellerRequest.PENDING_to_EXECUTED]
        distinguishing_aspect: "An approved FEE_WAIVER request credits the originally-charged 200-cent money-order fee back to the account ledger; the drawer's cash position is untouched by the refund."
        test_recipe:
          setup: ["Branch B; teller T with OPEN drawer; account A balance 0; an approved+executed money order of 50000 with the 200 fee"]
          setup_api_calls:
            - call: "POST /api/branches"
              payload: { name: "B", drawer_limit_cents: 1000000, vault_cash_cents: 50000000, over_short_investigation_threshold_cents: 1000 }
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { b_id: $.data.id }
            - call: "POST /api/branches/${b_id}/tellers"
              payload: { display_name: "T" }
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { t_id: $.data.id }
            - call: "POST /api/branches/${b_id}/accounts"
              payload: { owner_name: "A", balance_cents: 0 }
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { a_id: $.data.id }
            - call: "POST /api/tellers/${t_id}/drawers"
              payload: {}
              as: HeadTeller
              as_user_id: "ht-1"
              captures: { d_id: $.data.id }
            - call: "POST /api/drawers/${d_id}/teller-requests"
              payload: { type: "ISSUE_INSTRUMENT", params: { account_id: "${a_id}", instrument_type: "MONEY_ORDER", amount_cents: 50000, fee_waived: false } }
              as: Teller
              as_user_id: "${t_id}"
              captures: { r1: $.data.id }
            - call: "POST /api/teller-requests/${r1}/approve"
              payload: {}
              as: BranchManager
              as_user_id: "mgr-1"
            - call: "GET /api/transactions"
              payload: { drawer_id: "${d_id}" }
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { tx_id: "$.data[0].id" }
            - call: "POST /api/drawers/${d_id}/teller-requests"
              payload: { type: "FEE_WAIVER", params: { transaction_id: "${tx_id}" } }
              as: Teller
              as_user_id: "${t_id}"
              captures: { r2: $.data.id }
          trigger:
            - call: "POST /api/teller-requests/${r2}/approve"
              payload: {}
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { r2_status: $.data.status }
            - call: "GET /api/accounts/${a_id}"
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { bal: $.data.balance_cents }
            - call: "GET /api/drawers/${d_id}/expected-cash"
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { exp: $.data.expected_cash_cents }
          assert:
            - "${r2_status} == EXECUTED"
            - "${bal} == 200 (the fee is refunded to the account ledger)"
            - "${exp} == 50200 (the refund does not move drawer cash)"

  # -------------------------------------------------------------------------
  - section: validations
    instances:
      - name: request_without_auth_headers_unauthenticated
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A call with no X-User-ID / X-User-Role headers is 401 ERR_UNAUTHENTICATED — checked before everything else."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /api/branches"
              as: ""
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_UNAUTHENTICATED (HTTP 401; the test client omits both headers for this call)"

      - name: auditor_cannot_post_transaction_forbidden
        claim_type: violation_to_error
        grounds: ["validations[priority=2]", roles, "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "Auditor is not in the roles of POST /api/drawers/{id}/transactions — role-level denial is 403 ERR_FORBIDDEN."
        test_recipe:
          setup: ["Branch B; teller T with OPEN drawer; account A"]
          setup_api_calls:
            - call: "POST /api/branches"
              payload: { name: "B", drawer_limit_cents: 1000000, vault_cash_cents: 50000000, over_short_investigation_threshold_cents: 1000 }
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { b_id: $.data.id }
            - call: "POST /api/branches/${b_id}/tellers"
              payload: { display_name: "T" }
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { t_id: $.data.id }
            - call: "POST /api/branches/${b_id}/accounts"
              payload: { owner_name: "A", balance_cents: 100000 }
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { a_id: $.data.id }
