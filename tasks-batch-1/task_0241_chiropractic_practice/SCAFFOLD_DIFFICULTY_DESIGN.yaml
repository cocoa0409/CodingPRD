            - call: "POST /patients/${pt_id}/appointments/${a2}/complete"
              payload: {}
              as: Provider
              as_user_id: "${prov_id}"
            - call: "POST /patients/${pt_id}/appointments"
              payload: { provider_id: "${prov_id}", treatment_room_id: "${room_id}", visit_type: "ADJUSTMENT", scheduled_start: "2026-04-08T15:00:00Z", duration_minutes: 15 }
              as: FrontDesk
              captures: { a3: $.data.id }
            - call: "POST /patients/${pt_id}/appointments/${a3}/check-in"
              payload: {}
              as: FrontDesk
            - call: "POST /patients/${pt_id}/appointments/${a3}/soap-note"
              payload: { provider_id: "${prov_id}", subjective: "s", objective: "o", assessment: "a", plan: "p" }
              as: Provider
