scenario: |
  desgin task harder than expert level.!!!!2117. ESOP Administration & Repurchase Obligation (employee-owned company ESOP trustee): annual valuation & share price determination, contribution/share allocation & compensation limits, vesting & forfeiture reallocation, distribution policy & installment payment, put option exercise window & repurchase funding, diversification election for older participants, leveraged ESOP loan payments & share release, participant statement & communication

domain_name: esop-administration
api_prefix: "/"

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - conditional_feature_flags

  entity_topology: flat
  # Twelve peer entities linked purely by foreign keys. Every URL is a single
  # top-level collection (`/participants`, `/valuations`, ...); no entity is
  # nested inside another entity's path. Parent context always travels in the
  # request body or as a query filter.

  state_machine_shape: branching
  # EsopPlan is cyclic (OPEN -> VALUATION_PENDING -> ALLOCATION_LOCKED -> OPEN)
  # with a FROZEN branch; Valuation is cyclic (SUBMITTED <-> CHALLENGED);
  # DistributionElection carries two independent state dimensions
  # (approval_status x payment_status); Participant and PutOptionExercise
  # branch with divergent side-effect sets per branch.

  relationship_patterns:
    - one_to_many          # EsopPlan -> Participant / Valuation / EsopLoan / AllocationRun
    - self_referential     # Valuation.supersedes_valuation_id -> Valuation.id
    - cross_aggregate      # ShareAllocation joins AllocationRun x Participant;
                           # ParticipantStatement joins Participant x AllocationRun
    - polymorphic_free     # no polymorphic FKs; every FK names exactly one target entity

  role_model: segregation_of_duties
  # The X-User-ID that submitted a Valuation may not approve it; the
  # X-User-ID that created an AllocationRun may not finalize it.

  consistency_model: immediate

  difficulty_level: expert_plus
  # Above the Expert band of SKILL.md 0.4 by explicit request: 12 entities,
  # 52 endpoints, 32 error codes, 9 calculations (3 of them dual-variant),
  # 6 state machines (2 cyclic, 1 parallel-dimension, 2 branching).

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: EsopPlan
    parent: null
    common_fields: true
    fields:
      - name: plan_name
        type: string
        source: input
        description: Display name of the ESOP plan.
      - name: sponsor_name
        type: string
        source: input
        description: Legal name of the employer sponsoring the plan.
      - name: plan_year
        type: integer
        source: input
        description: Current plan year. Advanced by exactly 1 on every successful rollover.
        constraints: "1900..2999"
      - name: total_shares_outstanding
        type: integer
        source: input
        description: Total shares of employer stock issued by the company (ESOP-held plus non-ESOP-held). Constant after creation; denominator of the ownership-percentage branch in valuation_share_price.
        constraints: ">= 1"
      - name: annual_compensation_limit_cents
        type: integer
        source: input
        default: 34500000
        description: Section 401(a)(17) compensation cap. Each participant's eligible_compensation_cents is truncated to this value before the allocation ratio is formed.
        constraints: ">= 1"
      - name: annual_additions_limit_cents
        type: integer
        source: input
        default: 6900000
        description: Section 415(c) annual additions cap per participant per plan year, expressed in cents of allocated share value.
        constraints: ">= 1"
      - name: vesting_schedule
        type: enum
        source: input
        description: Vesting table applied by participant_vested_percentage.
        constraints: "CLIFF_3YR | GRADED_6YR"
      - name: service_measurement_method
        type: enum
        source: input
        description: Selects which variant of participant_vested_percentage runs at termination.
        constraints: "TERMINATION_DATE_MEASURE | PLAN_YEAR_END_MEASURE"
      - name: forfeiture_policy
        type: enum
        source: input
        description: Governs what happens to the Section 415 residue left after allocation_pool_distribution completes its passes. REALLOCATE_PRO_RATA carries the residue forward in unallocated_forfeiture_shares; REDUCE_CONTRIBUTION rejects the finalize outright when the residue is non-zero.
        constraints: "REALLOCATE_PRO_RATA | REDUCE_CONTRIBUTION"
      - name: distribution_policy
        type: enum
        source: input
        description: Governs installment_schedule_build. LUMP_SUM builds 1 installment; FIVE_YEAR_INSTALLMENT builds 5 annual installments.
        constraints: "LUMP_SUM | FIVE_YEAR_INSTALLMENT"
      - name: sweep_mode
        type: enum
        source: input
        default: STRICT_ORDER
        description: Selects the overflow behaviour of repurchase_funding_waterfall. STRICT_ORDER halts the sweep at the first exercise that does not fit; BEST_FIT skips it and continues down the queue.
        constraints: "STRICT_ORDER | BEST_FIT"
      - name: normal_retirement_age
        type: integer
        source: input
        default: 65
        description: Age at which a termination may be recorded with reason RETIREMENT and full vesting is granted.
        constraints: "40..99"
      - name: diversification_min_age
        type: integer
        source: input
        default: 55
        description: Age component of diversification_eligibility_window.
        constraints: "40..99"
      - name: diversification_min_years
        type: integer
        source: input
        default: 10
        description: Service component of diversification_eligibility_window.
        constraints: ">= 1"
      - name: plan_status
        type: enum
        source: computed
        default: OPEN
        description: Plan-year lifecycle posture. Gates nearly every child mutation.
        constraints: "OPEN | VALUATION_PENDING | ALLOCATION_LOCKED | FROZEN"
      - name: total_plan_shares
        type: integer
        source: computed
        default: 0
        description: Employer shares held by the ESOP trust. Grows by EsopLoan.shares_pledged on loan creation and by AllocationRun.contributed_shares on finalize; shrinks by InstallmentPayment.shares_delivered; grows again by PutOptionExercise.shares_tendered on settle. Left side of the share conservation invariant.
      - name: suspense_shares
        type: integer
        source: computed
        default: 0
        description: Trust shares still pledged against unrepaid leveraged loans. Sum of EsopLoan.suspense_shares over the plan's loans.
      - name: unallocated_released_shares
        type: integer
        source: computed
        default: 0
        description: Shares released from suspense by loan payments but not yet allocated to participants. Zeroed by every successful allocation-run finalize.
      - name: unallocated_forfeiture_shares
        type: integer
        source: computed
        default: 0
        description: Forfeited shares plus Section 415 residue awaiting reallocation.
      - name: reacquired_shares
        type: integer
        source: computed
        default: 0
        description: Shares bought back from participants through settled put option exercises, held by the trust for future allocation.
      - name: allocated_shares_total
        type: integer
        source: computed
        default: 0
        description: Sum of Participant.allocated_shares over the plan's participants.
      - name: current_share_price_cents
        type: integer
        source: computed
        default: 0
        description: share_price_cents of the APPROVED Valuation for the current plan_year; 0 until one is approved.
      - name: open_valuation_count
        type: integer
        source: computed
        default: 0
        description: Number of Valuations for this plan whose status is SUBMITTED or CHALLENGED. Incremented on valuation creation, decremented whenever a valuation leaves that set.
      - name: draft_run_count
        type: integer
        source: computed
        default: 0
        description: Number of AllocationRuns for this plan whose status is DRAFT. Incremented on run creation, decremented on finalize or void.
      - name: repurchase_reserve_cents
        type: integer
        source: computed
        default: 0
        description: Uncommitted cash available to fund put option exercises.
      - name: repurchase_reserve_floor_cents
        type: integer
        source: input
        default: 0
        description: Reserve level below which repurchase_posture flips to UNDERFUNDED. repurchase_funding_waterfall may never spend below this floor; a direct fund call may.
        constraints: ">= 0"
      - name: committed_repurchase_cents
        type: integer
        source: computed
        default: 0
        description: Sum of PutOptionExercise.funded_cents over exercises whose status is FUNDED.
      - name: cumulative_repurchase_funding_cents
        type: integer
        source: computed
        default: 0
        description: Total cash ever deposited into the reserve. Monotonically non-decreasing. Left side of the cash conservation invariant.
      - name: cumulative_repurchase_settled_cents
        type: integer
        source: computed
        default: 0
        description: Sum of PutOptionExercise.funded_cents over exercises whose status is SETTLED.
      - name: repurchase_posture
        type: enum
        source: computed
        default: FUNDED
        description: FUNDED while repurchase_reserve_cents >= repurchase_reserve_floor_cents, UNDERFUNDED otherwise. Recomputed after every reserve movement.
        constraints: "FUNDED | UNDERFUNDED"
      - name: forfeiture_sweep_threshold_shares
        type: integer
        source: input
        default: 0
        description: Level of unallocated_forfeiture_shares above which forfeiture_posture flips to SWEEP_REQUIRED.
        constraints: ">= 0"
      - name: forfeiture_posture
        type: enum
        source: computed
        default: CLEAR
        description: CLEAR while unallocated_forfeiture_shares <= forfeiture_sweep_threshold_shares, SWEEP_REQUIRED otherwise. SWEEP_REQUIRED blocks rollover.
        constraints: "CLEAR | SWEEP_REQUIRED"
      - name: frozen_reason
        type: string
        source: computed
        default: null
        description: Free text captured when the trustee freezes the plan; null while plan_status != FROZEN.

  - name: Participant
    parent: null
    common_fields: true
    fields:
      - name: plan_id
        type: string
        source: input
        description: "FK -> EsopPlan.id; the plan this participant belongs to."
      - name: employee_number
        type: string
        source: input
        description: Employer payroll identifier. Unique within a plan.
      - name: date_of_birth
        type: string
        source: input
        description: Calendar date of birth, YYYY-MM-DD.
      - name: hire_date
        type: string
        source: input
        description: Calendar date of hire, YYYY-MM-DD. Start of the service interval used by participant_vested_percentage.
      - name: eligible_compensation_cents
        type: integer
        source: input
        default: 0
        description: Plan-year eligible compensation. A participant with 0 here is excluded from the allocation eligible set.
        constraints: ">= 0"
      - name: annual_hours
        type: integer
        source: input
        default: 2000
        description: Hours credited for the plan year. Recorded for the statement; does not gate eligibility.
        constraints: ">= 0"
      - name: status
        type: enum
        source: computed
        default: ACTIVE
        description: Employment/distribution posture of the participant.
        constraints: "ACTIVE | TERMINATED | RETIRED | DECEASED | DISTRIBUTED"
      - name: termination_date
        type: string
        source: computed
        default: null
        description: Calendar date recorded at termination, YYYY-MM-DD; null while ACTIVE.
      - name: termination_reason
        type: enum
        source: computed
        default: null
        description: Reason recorded at termination; null while ACTIVE.
        constraints: "TERMINATION | RETIREMENT | DEATH | DISABILITY"
      - name: years_of_service
        type: integer
        source: computed
        default: 0
        description: Whole years of service produced by the most recent participant_vested_percentage evaluation.
      - name: vested_percentage
        type: integer
        source: computed
        default: 0
        description: Vested percentage produced by the most recent participant_vested_percentage evaluation.
        constraints: "0..100"
      - name: allocated_shares
        type: integer
        source: computed
        default: 0
        description: Shares currently standing to the participant's account.
      - name: vested_shares
        type: integer
        source: computed
        default: 0
        description: "floor(allocated_shares * vested_percentage / 100), recomputed whenever either input changes - with one pinned exception: immediately after a forfeiture is booked, allocated_shares and vested_shares are BOTH set to the pre-forfeiture vested share count, because the unvested balance has left the account and the whole remainder is vested. The generic formula is not re-applied on top of that assignment."
      - name: distributed_shares_cumulative
        type: integer
        source: computed
        default: 0
        description: Shares delivered out of the trust to this participant across all paid installments.
      - name: tendered_shares_cumulative
        type: integer
        source: computed
        default: 0
        description: Shares this participant has committed to non-cancelled put option exercises.
      - name: diversified_shares_cumulative
        type: integer
        source: computed
        default: 0
        description: Shares delivered under DIVERSIFICATION elections. Input to diversification_eligibility_window's cumulative cap.
      - name: put_window_open_date
        type: string
        source: computed
        default: null
        description: First day of the participant's current put option window, YYYY-MM-DD; null when no window is open.
      - name: put_window_close_date
        type: string
        source: computed
        default: null
        description: Last day of the participant's current put option window, YYYY-MM-DD, inclusive.
      - name: last_put_window_close_date
        type: string
        source: computed
        default: null
        description: put_window_close_date of the most recently opened window, retained after that window lapses so the cooling buffer can be evaluated.
      - name: diversification_first_eligible_plan_year
        type: integer
        source: computed
        default: null
        description: "max(year(date_of_birth) + plan.diversification_min_age, year(hire_date) + plan.diversification_min_years). Anchor of the six-year qualified election period."
      - name: diversification_eligible
        type: boolean
        source: computed
        default: false
        description: True when plan.plan_year lies in [diversification_first_eligible_plan_year, diversification_first_eligible_plan_year + 5] and status is ACTIVE.

  - name: Valuation
    parent: null
    common_fields: true
    fields:
      - name: plan_id
        type: string
        source: input
        description: "FK -> EsopPlan.id; the plan being valued."
      - name: plan_year
        type: integer
        source: input
        description: Plan year this appraisal covers.
      - name: appraiser_user_id
        type: string
        source: system
        description: X-User-ID of the Appraiser who created the valuation. Segregation-of-duties comparand at approval.
      - name: enterprise_value_cents
        type: integer
        source: input
        description: Appraised enterprise value.
        constraints: ">= 0"
      - name: debt_outstanding_cents
        type: integer
        source: input
        description: Interest-bearing debt subtracted to reach equity value.
        constraints: ">= 0"
      - name: non_operating_assets_cents
        type: integer
        source: input
        description: Non-operating assets added to reach equity value.
        constraints: ">= 0"
      - name: control_premium_bps
        type: integer
        source: input
        description: Control premium in basis points. Only applied when the trust's ownership reaches the threshold.
        constraints: "0..10000"
      - name: marketability_discount_bps
        type: integer
        source: input
        description: Discount for lack of marketability in basis points. Always applied, always after the control premium.
        constraints: "0..9999"
      - name: effective_from_date
        type: string
        source: input
        description: Inclusive start of this appraisal's coverage interval, YYYY-MM-DD.
      - name: effective_to_date
        type: string
        source: input
        description: Exclusive end of this appraisal's coverage interval, YYYY-MM-DD. Must be strictly after effective_from_date.
      - name: share_price_cents
        type: integer
        source: computed
        default: 0
        description: Output of valuation_share_price. Recomputed on every resubmit.
      - name: equity_value_cents
        type: integer
        source: computed
        default: 0
        description: Intermediate of valuation_share_price - enterprise value less debt plus non-operating assets, floored at 0.
      - name: control_premium_applied_cents
        type: integer
        source: computed
        default: 0
        description: Capped premium actually added; 0 when the ownership branch is not taken.
      - name: ownership_bps_at_valuation
        type: integer
        source: computed
        default: 0
        description: "floor(plan.total_plan_shares * 10000 / plan.total_shares_outstanding) at the moment the price was computed."
      - name: status
        type: enum
        source: computed
        default: SUBMITTED
        description: Appraisal review posture.
        constraints: "SUBMITTED | CHALLENGED | APPROVED | REJECTED | SUPERSEDED"
      - name: challenge_round
        type: integer
        source: computed
        default: 0
        description: Number of times the trustee has challenged this appraisal. Capped at MAX_CHALLENGE_ROUNDS.
      - name: challenge_note
        type: string
        source: computed
        default: null
        description: Note supplied by the trustee on the most recent challenge.
      - name: supersedes_valuation_id
        type: string
        source: input
        default: null
        description: "FK -> Valuation.id; the earlier valuation this one replaces. When supplied, the named valuation is excluded from the coverage-overlap check and is driven to SUPERSEDED."
      - name: approved_by_user_id
        type: string
        source: computed
        default: null
        description: X-User-ID of the Trustee who approved the valuation; null until approval.
      - name: rejected_reason
        type: string
        source: computed
        default: null
        description: Reason recorded when the trustee rejects the appraisal.

  - name: EsopLoan
    parent: null
    common_fields: true
    fields:
      - name: plan_id
        type: string
        source: input
        description: "FK -> EsopPlan.id; the plan that borrowed to buy shares."
      - name: lender_name
        type: string
        source: input
        description: Name of the lending institution.
      - name: original_principal_cents
        type: integer
        source: input
        description: Principal advanced at closing.
        constraints: ">= 1"
      - name: original_interest_cents
        type: integer
        source: input
        description: Total interest scheduled over the life of the loan.
        constraints: ">= 0"
      - name: shares_pledged
        type: integer
        source: input
        description: Employer shares purchased with the loan proceeds and pledged into the suspense account.
        constraints: ">= 1"
      - name: release_method
        type: enum
        source: input
        description: Selects which variant of loan_share_release runs for every payment against this loan.
        constraints: "PRINCIPAL_ONLY | PRINCIPAL_AND_INTEREST"
      - name: principal_balance_cents
        type: integer
        source: computed
        description: Remaining principal. Starts at original_principal_cents.
      - name: remaining_interest_cents
        type: integer
        source: computed
        description: Remaining scheduled interest. Starts at original_interest_cents.
      - name: suspense_shares
        type: integer
        source: computed
        description: Pledged shares not yet released. Starts at shares_pledged.
      - name: released_shares_cumulative
        type: integer
        source: computed
        default: 0
        description: Shares released out of suspense to date.
      - name: status
        type: enum
        source: computed
        default: AMORTIZING
        description: Loan posture. Flips to REPAID when principal_balance_cents reaches 0.
        constraints: "AMORTIZING | REPAID"

  - name: LoanPayment
    parent: null
    common_fields: false
    fields:
      - name: loan_id
        type: string
        source: input
        description: "FK -> EsopLoan.id; the loan being serviced."
      - name: payment_date
        type: string
        source: input
        description: Calendar date of the payment, YYYY-MM-DD.
      - name: principal_cents
        type: integer
        source: input
        description: Principal component of the payment.
        constraints: ">= 0"
      - name: interest_cents
        type: integer
        source: input
        description: Interest component of the payment.
        constraints: ">= 0"
      - name: suspense_shares_before
        type: integer
        source: computed
        description: EsopLoan.suspense_shares immediately before this payment.
      - name: released_shares
        type: integer
        source: computed
        description: Output of loan_share_release for this payment.
      - name: suspense_shares_after
        type: integer
        source: computed
        description: suspense_shares_before minus released_shares.
      - name: release_method_applied
        type: enum
        source: computed
        description: Copy of EsopLoan.release_method at the time of the payment, retained for audit.
        constraints: "PRINCIPAL_ONLY | PRINCIPAL_AND_INTEREST"
      - name: principal_balance_after_cents
        type: integer
        source: computed
        description: EsopLoan.principal_balance_cents after this payment.
      - name: remaining_interest_after_cents
        type: integer
        source: computed
        description: EsopLoan.remaining_interest_cents after this payment.

  - name: AllocationRun
    parent: null
    common_fields: true
    fields:
      - name: plan_id
        type: string
        source: input
        description: "FK -> EsopPlan.id; the plan whose pool is being allocated."
      - name: valuation_id
        type: string
        source: input
        description: "FK -> Valuation.id; the appraisal that supplies the share price for this run."
      - name: plan_year
        type: integer
        source: input
        description: Plan year being allocated. Must equal both plan.plan_year and valuation.plan_year at finalize.
      - name: contributed_shares
        type: integer
        source: input
        description: Newly contributed employer shares added to the allocation pool by this run.
        constraints: ">= 0"
      - name: created_by_user_id
        type: string
        source: system
        description: X-User-ID of the PlanAdministrator who created the run. Segregation-of-duties comparand at finalize.
      - name: finalized_by_user_id
        type: string
        source: computed
        default: null
        description: X-User-ID of the PlanAdministrator who finalized the run; null until finalized.
      - name: released_shares_snapshot
        type: integer
        source: computed
        default: 0
        description: plan.unallocated_released_shares consumed by this run, captured at finalize.
      - name: forfeiture_shares_snapshot
        type: integer
        source: computed
        default: 0
        description: plan.unallocated_forfeiture_shares consumed by this run, captured at finalize.
      - name: pool_shares
        type: integer
        source: computed
        default: 0
        description: released_shares_snapshot + forfeiture_shares_snapshot + contributed_shares.
      - name: share_price_cents
        type: integer
        source: computed
        default: 0
        description: Copy of the approved valuation's share_price_cents used for the Section 415 share cap.
      - name: eligible_participant_count
        type: integer
        source: computed
        default: 0
        description: Size of the eligible set determined at finalize.
      - name: total_capped_compensation_cents
        type: integer
        source: computed
        default: 0
        description: Sum of capped compensation over the eligible set at pass 1.
      - name: capped_participant_count
        type: integer
        source: computed
        default: 0
        description: Number of eligible participants that hit the Section 415 share cap.
      - name: passes_executed
        type: integer
        source: computed
        default: 0
        description: Number of reallocation passes actually executed, 0..MAX_REALLOCATION_PASSES.
      - name: residual_shares
        type: integer
        source: computed
        default: 0
        description: Shares still unallocated after the final pass.
      - name: status
        type: enum
        source: computed
        default: DRAFT
        description: Run posture.
        constraints: "DRAFT | FINALIZED | VOID"
      - name: void_reason
        type: string
        source: computed
        default: null
        description: Reason recorded when the trustee voids the run.

  - name: ShareAllocation
    parent: null
    common_fields: false
    fields:
      - name: allocation_run_id
        type: string
        source: input
        description: "FK -> AllocationRun.id; the run that produced this line."
      - name: participant_id
        type: string
        source: input
        description: "FK -> Participant.id; the account credited."
      - name: capped_compensation_cents
        type: integer
        source: computed
        description: "min(participant.eligible_compensation_cents, plan.annual_compensation_limit_cents)."
      - name: max_shares_cap
        type: integer
        source: computed
        description: "floor(plan.annual_additions_limit_cents / run.share_price_cents) - the Section 415 share ceiling for this participant."
      - name: gross_shares_before_cap
        type: integer
        source: computed
        description: Total shares granted to this participant across all passes before the Section 415 ceiling was applied.
      - name: remainder_shares_awarded
        type: integer
        source: computed
        description: Number of largest-fraction remainder shares this participant received across all passes.
      - name: excess_shares_removed
        type: integer
        source: computed
        description: gross_shares_before_cap minus allocated_shares.
      - name: allocated_shares
        type: integer
        source: computed
        description: Shares actually credited to the participant by this run.
      - name: annual_additions_cents
        type: integer
        source: computed
        description: allocated_shares * run.share_price_cents.
      - name: capped
        type: boolean
        source: computed
        description: True when allocated_shares reached max_shares_cap.

  - name: ForfeitureEvent
    parent: null
    common_fields: true
    fields:
      - name: participant_id
        type: string
        source: input
        description: "FK -> Participant.id; the terminating participant."
      - name: plan_id
        type: string
        source: input
        description: "FK -> EsopPlan.id; denormalised for plan-scoped queries."
      - name: plan_year
        type: integer
        source: computed
        description: plan.plan_year at the moment of forfeiture.
      - name: forfeited_shares
        type: integer
        source: computed
        description: participant.allocated_shares minus participant.vested_shares at termination.
      - name: vested_percentage_at_forfeiture
        type: integer
        source: computed
        description: Vested percentage used to size the forfeiture.
      - name: years_of_service_at_forfeiture
        type: integer
        source: computed
        description: Whole years of service used to select the vesting-table row.
      - name: measurement_method_applied
        type: enum
        source: computed
        description: Which participant_vested_percentage variant produced the figures above.
        constraints: "TERMINATION_DATE_MEASURE | PLAN_YEAR_END_MEASURE"
      - name: reallocated_in_run_id
        type: string
        source: computed
        default: null
        description: "FK -> AllocationRun.id; the run that swept these shares back into a pool. Null until swept, and reset to null if that run is voided."
      - name: status
        type: enum
        source: computed
        default: PENDING_REALLOCATION
        description: Sweep posture of the forfeiture.
        constraints: "PENDING_REALLOCATION | REALLOCATED"

  - name: DistributionElection
    parent: null
    common_fields: true
    fields:
      - name: participant_id
        type: string
        source: input
        description: "FK -> Participant.id; the electing participant."
      - name: election_type
        type: enum
        source: input
        description: Basis of the election. DIVERSIFICATION is an in-service election available only inside the qualified election period; the other four require a separated participant.
        constraints: "TERMINATION | RETIREMENT | DEATH | DISABILITY | DIVERSIFICATION"
      - name: requested_shares
        type: integer
        source: input
        description: Shares the participant asks to have distributed.
        constraints: ">= 1"
      - name: approved_shares
        type: integer
        source: computed
        default: 0
        description: Shares actually scheduled; equals requested_shares once commenced.
      - name: installment_count
        type: integer
        source: computed
        default: 0
        description: Number of InstallmentPayment rows built at commencement.
      - name: approval_status
        type: enum
        source: computed
        default: REQUESTED
        description: First independent state dimension - administrative approval.
        constraints: "REQUESTED | APPROVED | DENIED"
      - name: payment_status
        type: enum
        source: computed
        default: NOT_STARTED
        description: Second independent state dimension - delivery progress, driven only by installment payments.
        constraints: "NOT_STARTED | IN_PROGRESS | COMPLETED"
      - name: share_price_at_election_cents
        type: integer
        source: computed
        default: 0
        description: plan.current_share_price_cents captured when the election was created.
      - name: commenced_at_date
        type: string
        source: computed
        default: null
        description: Logical-clock calendar date on which the election was commenced, YYYY-MM-DD.
      - name: diversification_year_index
        type: integer
        source: computed
        default: null
        description: "plan.plan_year - participant.diversification_first_eligible_plan_year + 1; null for non-DIVERSIFICATION elections."
      - name: diversification_cap_percent
        type: integer
        source: computed
        default: null
        description: 25 for diversification_year_index 1..5, 50 for index 6; null otherwise.

  - name: InstallmentPayment
    parent: null
    common_fields: true
    fields:
      - name: distribution_election_id
        type: string
        source: input
        description: "FK -> DistributionElection.id; the election this installment belongs to."
      - name: sequence_number
        type: integer
        source: computed
        description: 1-based position within the schedule.
      - name: scheduled_date
        type: string
        source: computed
        description: Calendar date the installment becomes payable, YYYY-MM-DD.
      - name: shares_scheduled
        type: integer
        source: computed
        description: Shares assigned to this installment by installment_schedule_build.
      - name: shares_delivered
        type: integer
        source: computed
        default: 0
        description: Shares actually delivered; equals shares_scheduled once paid.
      - name: paid_date
        type: string
        source: computed
        default: null
        description: Logical-clock calendar date the installment was paid, YYYY-MM-DD.
      - name: status
        type: enum
        source: computed
        default: SCHEDULED
        description: Installment posture.
        constraints: "SCHEDULED | PAID | CANCELLED"

  - name: PutOptionExercise
    parent: null
    common_fields: true
    fields:
      - name: distribution_election_id
        type: string
        source: input
        description: "FK -> DistributionElection.id; the election whose delivered shares are being put back."
      - name: participant_id
        type: string
        source: computed
        description: "FK -> Participant.id; copied from the election at creation."
      - name: shares_tendered
        type: integer
        source: input
        description: Shares the participant puts back to the plan.
        constraints: ">= 1"
      - name: window_open_date
        type: string
        source: computed
        description: Copy of participant.put_window_open_date at creation, YYYY-MM-DD.
      - name: window_close_date
        type: string
        source: computed
        description: Copy of participant.put_window_close_date at creation, YYYY-MM-DD, inclusive.
      - name: exercise_date
        type: string
        source: computed
        description: Logical-clock calendar date of the exercise, YYYY-MM-DD.
      - name: share_price_cents
        type: integer
        source: computed
        description: plan.current_share_price_cents at exercise.
      - name: exercise_amount_cents
        type: integer
        source: computed
        description: shares_tendered * share_price_cents.
      - name: priority_class
        type: enum
        source: computed
        description: Waterfall bucket derived from the election_type of the parent election - DEATH from DEATH, RETIREMENT_DISABILITY from RETIREMENT or DISABILITY, TERMINATION from TERMINATION, DIVERSIFICATION from DIVERSIFICATION.
        constraints: "DEATH | RETIREMENT_DISABILITY | TERMINATION | DIVERSIFICATION"
      - name: funded_cents
        type: integer
        source: computed
        default: 0
        description: Cash committed against this exercise; equals exercise_amount_cents while FUNDED or SETTLED, 0 otherwise.
      - name: funded_by_user_id
        type: string
        source: computed
        default: null
        description: X-User-ID of the Trustee who funded the exercise.
      - name: settled_date
        type: string
        source: computed
        default: null
        description: Logical-clock calendar date of settlement, YYYY-MM-DD.
      - name: status
        type: enum
        source: computed
        default: PENDING
        description: Repurchase posture of the exercise.
        constraints: "PENDING | FUNDED | DEFERRED | SETTLED | CANCELLED"
      - name: cancel_reason
        type: string
        source: computed
        default: null
        description: Reason recorded on cancellation.

  - name: ParticipantStatement
    parent: null
    common_fields: true
    fields:
      - name: participant_id
        type: string
        source: input
        description: "FK -> Participant.id; the account holder."
      - name: allocation_run_id
        type: string
        source: input
        description: "FK -> AllocationRun.id; the run that generated this statement."
      - name: plan_year
        type: integer
        source: computed
        description: run.plan_year.
      - name: opening_shares
        type: integer
        source: computed
        description: participant.allocated_shares immediately before the run credited this account.
      - name: shares_allocated
        type: integer
        source: computed
        description: ShareAllocation.allocated_shares for this participant in this run.
      - name: forfeited_shares_this_year
        type: integer
        source: computed
        description: Sum of ForfeitureEvent.forfeited_shares for this participant with plan_year equal to run.plan_year.
      - name: closing_shares
        type: integer
        source: computed
        description: opening_shares + shares_allocated.
      - name: share_price_cents
        type: integer
        source: computed
        description: Frozen copy of run.share_price_cents. Never changes when a later valuation is approved.
      - name: vested_percentage
        type: integer
        source: computed
        description: Frozen copy of participant.vested_percentage at generation.
      - name: vested_value_cents
        type: integer
        source: computed
        description: "floor(closing_shares * vested_percentage / 100) * share_price_cents."
      - name: total_value_cents
        type: integer
        source: computed
        description: closing_shares * share_price_cents.
      - name: diversification_eligible
        type: boolean
        source: computed
        description: Frozen copy of participant.diversification_eligible at generation.
      - name: delivery_status
        type: enum
        source: computed
        default: GENERATED
        description: Communication posture of the statement.
        constraints: "GENERATED | DELIVERED"
      - name: delivery_channel
        type: enum
        source: computed
        default: null
        description: Channel recorded at delivery; null while GENERATED.
        constraints: "EMAIL | POSTAL | PORTAL"

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:

  # ---------------------------------------------------------------- EsopPlan
  # Cyclic: OPEN -> VALUATION_PENDING -> ALLOCATION_LOCKED -> OPEN, with a
  # FROZEN branch reachable from all three live states.
  - entity: EsopPlan
    initial_state: OPEN
    terminal_states: [FROZEN]
    transitions:
      - from: OPEN
        to: VALUATION_PENDING
        trigger: "POST /plans/{plan_id}/close-year"
        actor: PlanSponsor
        preconditions:
          - "plan.plan_status == OPEN"
        side_effects:
          - "Participant creation and PATCH /participants/{participant_id} are refused from now until the next rollover (validation priority 8)."
          - "EsopLoan creation is refused from now until the next rollover (validation priority 8)."
          - "increments EsopPlan.version by 1"

      - from: VALUATION_PENDING
        to: ALLOCATION_LOCKED
        trigger: "system, on successful POST /allocation-runs/{run_id}/finalize"
        actor: system
        preconditions:
          - "plan.plan_status == VALUATION_PENDING"
          - "the finalizing run's valuation_id names a Valuation with status == APPROVED, plan_id == plan.id and plan_year == plan.plan_year"
        side_effects:
          - "allocation_pool_distribution and annual_additions_cap_reallocation run; ShareAllocation rows are created for every eligible participant."
          - "EsopPlan.unallocated_released_shares set to 0; EsopPlan.unallocated_forfeiture_shares set to run.residual_shares; EsopPlan.total_plan_shares increased by run.contributed_shares; EsopPlan.allocated_shares_total increased by (run.pool_shares - run.residual_shares)."
          - "EsopPlan.forfeiture_posture recomputed from the new unallocated_forfeiture_shares against forfeiture_sweep_threshold_shares."
          - "EsopPlan.draft_run_count decreased by 1."
          - "Every ForfeitureEvent for this plan with status == PENDING_REALLOCATION is set to REALLOCATED with reallocated_in_run_id = run.id."
          - "One ParticipantStatement per eligible participant is created via statement_snapshot."
          - "increments EsopPlan.version by 1"

      - from: ALLOCATION_LOCKED
        to: VALUATION_PENDING
        trigger: "POST /allocation-runs/{run_id}/void on the run that locked the plan"
        actor: Trustee
        preconditions:
          - "plan.plan_status == ALLOCATION_LOCKED"
          - "run.status == FINALIZED"
        side_effects:
          - "Compensating reversal of the finalize side effects; see the AllocationRun machine."
          - "increments EsopPlan.version by 1"

      - from: ALLOCATION_LOCKED
        to: OPEN
        trigger: "POST /plans/{plan_id}/rollover"
        actor: PlanSponsor
        preconditions:
          - "plan.plan_status == ALLOCATION_LOCKED"
          - "plan.forfeiture_posture == CLEAR"
        side_effects:
          - "EsopPlan.plan_year increased by 1."
          - "EsopPlan.current_share_price_cents left unchanged; it stays in force until the next approval."
          - "Every Participant of this plan has diversification_first_eligible_plan_year and diversification_eligible recomputed against the new plan_year."
          - "increments EsopPlan.version by 1"
        note: "Cycle closes here: the plan returns to OPEN for the next plan year."

      - from: OPEN
        to: FROZEN
        trigger: "POST /plans/{plan_id}/freeze"
        actor: Trustee
        preconditions:
          - "plan.plan_status != FROZEN"
        side_effects:
          - "EsopPlan.frozen_reason set from the request."
          - "Every Valuation of this plan with status in {SUBMITTED, CHALLENGED} is set to REJECTED with rejected_reason = 'PLAN_FROZEN'; EsopPlan.open_valuation_count set to 0."
          - "Every AllocationRun of this plan with status == DRAFT is set to VOID with void_reason = 'PLAN_FROZEN'; EsopPlan.draft_run_count set to 0."
          - "Every DistributionElection of this plan's participants with approval_status == REQUESTED is set to DENIED."
          - "Every InstallmentPayment with status == SCHEDULED belonging to those denied elections is set to CANCELLED."
          - "Every PutOptionExercise of this plan's participants with status == PENDING is set to DEFERRED."
          - "increments EsopPlan.version by 1"

      - from: VALUATION_PENDING
        to: FROZEN
        trigger: "POST /plans/{plan_id}/freeze"
        actor: Trustee
        preconditions:
          - "plan.plan_status != FROZEN"
        side_effects:
          - "Identical cascade to the OPEN -> FROZEN branch."
          - "increments EsopPlan.version by 1"

      - from: ALLOCATION_LOCKED
        to: FROZEN
        trigger: "POST /plans/{plan_id}/freeze"
        actor: Trustee
        preconditions:
          - "plan.plan_status != FROZEN"
        side_effects:
          - "Identical cascade to the OPEN -> FROZEN branch."
          - "increments EsopPlan.version by 1"

  # --------------------------------------------------------------- Valuation
  # Cyclic: SUBMITTED <-> CHALLENGED, bounded by MAX_CHALLENGE_ROUNDS.
  - entity: Valuation
    initial_state: SUBMITTED
    terminal_states: [APPROVED, REJECTED, SUPERSEDED]
    transitions:
      - from: SUBMITTED
        to: CHALLENGED
        trigger: "POST /valuations/{valuation_id}/challenge"
        actor: Trustee
        preconditions:
          - "valuation.status == SUBMITTED"
          - "valuation.challenge_round < MAX_CHALLENGE_ROUNDS (2)"
          - "plan.plan_status != FROZEN"
        side_effects:
          - "Valuation.challenge_round increased by 1; Valuation.challenge_note set from the request."

      - from: CHALLENGED
        to: SUBMITTED
        trigger: "POST /valuations/{valuation_id}/resubmit"
        actor: Appraiser
        preconditions:
          - "valuation.status == CHALLENGED"
          - "X-User-ID == valuation.appraiser_user_id"
          - "plan.plan_status != FROZEN"
        side_effects:
          - "The five appraisal inputs are overwritten from the request; valuation_share_price re-runs and rewrites share_price_cents, equity_value_cents, control_premium_applied_cents and ownership_bps_at_valuation."
        note: "Closes the revision cycle. A valuation may traverse SUBMITTED -> CHALLENGED -> SUBMITTED at most twice."

      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /valuations/{valuation_id}/approve"
        actor: Trustee
        preconditions:
          - "valuation.status == SUBMITTED"
          - "plan.plan_status == VALUATION_PENDING"
          - "valuation.plan_year == plan.plan_year"
          - "X-User-ID != valuation.appraiser_user_id"
          - "no other Valuation of this plan with the same plan_year has status == APPROVED"
        side_effects:
          - "Valuation.approved_by_user_id set to X-User-ID."
          - "EsopPlan.current_share_price_cents set to valuation.share_price_cents."
          - "Every other Valuation of this plan with the same plan_year and status in {SUBMITTED, CHALLENGED} is set to SUPERSEDED."
          - "EsopPlan.open_valuation_count decreased by the number of valuations that just left {SUBMITTED, CHALLENGED}, including this one."
          - "increments EsopPlan.version by 1"

      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /valuations/{valuation_id}/reject"
        actor: Trustee
        preconditions:
          - "valuation.status == SUBMITTED"
          - "plan.plan_status != FROZEN"
        side_effects:
          - "Valuation.rejected_reason set from the request; EsopPlan.open_valuation_count decreased by 1."
          - "increments EsopPlan.version by 1"

      - from: CHALLENGED
        to: REJECTED
        trigger: "POST /valuations/{valuation_id}/reject"
        actor: Trustee
        preconditions:
          - "valuation.status == CHALLENGED"
          - "plan.plan_status != FROZEN"
        side_effects:
          - "Valuation.rejected_reason set from the request; EsopPlan.open_valuation_count decreased by 1."
          - "increments EsopPlan.version by 1"

      - from: SUBMITTED
        to: SUPERSEDED
        trigger: "system, on POST /valuations carrying supersedes_valuation_id equal to this valuation's id"
        actor: system
        preconditions:
          - "valuation.status in {SUBMITTED, CHALLENGED}"
        side_effects:
          - "EsopPlan.open_valuation_count decreased by 1 for this valuation and increased by 1 for the newly created one, netting to no change."

      - from: CHALLENGED
        to: SUPERSEDED
        trigger: "system, on POST /valuations carrying supersedes_valuation_id equal to this valuation's id"
        actor: system
        preconditions:
          - "valuation.status in {SUBMITTED, CHALLENGED}"
        side_effects:
          - "EsopPlan.open_valuation_count decreased by 1 for this valuation and increased by 1 for the newly created one, netting to no change."

      - from: SUBMITTED
        to: REJECTED
        trigger: "system, on POST /plans/{plan_id}/freeze"
        actor: system
        preconditions:
          - "plan.plan_status transitions to FROZEN"
        side_effects:
          - "Valuation.rejected_reason set to 'PLAN_FROZEN'."
        note: "Second producer of REJECTED; distinct from the trustee-initiated reject."

  # ------------------------------------------------------------- Participant
  # Branching: three separation branches out of ACTIVE with divergent side
  # effects, converging on DISTRIBUTED.
  - entity: Participant
    initial_state: ACTIVE
    terminal_states: [DISTRIBUTED]
    transitions:
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /participants/{participant_id}/terminate with termination_reason in {TERMINATION, DISABILITY}"
        actor: PlanSponsor
        preconditions:
          - "participant.status == ACTIVE"
          - "plan.plan_status != FROZEN"
          - "termination_date >= participant.hire_date"
        side_effects:
          - "Participant.termination_date and termination_reason set from the request."
          - "participant_vested_percentage runs under plan.service_measurement_method; Participant.years_of_service and vested_percentage are rewritten and frozen; vested_shares recomputed. For DISABILITY, vested_percentage is forced to 100."
          - "CASCADE hop 2 - because the participant became TERMINATED with vested_percentage < 100, a ForfeitureEvent is created with forfeited_shares = allocated_shares - vested_shares; Participant.allocated_shares AND Participant.vested_shares are then both set to that pre-forfeiture vested share count, and vested_percentage is left at its measured value. No ForfeitureEvent is created when vested_percentage == 100."
          - "CASCADE hop 3 - because that ForfeitureEvent was created, EsopPlan.unallocated_forfeiture_shares increases by forfeited_shares and EsopPlan.allocated_shares_total decreases by the same amount."
          - "CASCADE hop 4 - because EsopPlan.unallocated_forfeiture_shares now exceeds EsopPlan.forfeiture_sweep_threshold_shares, EsopPlan.forfeiture_posture flips to SWEEP_REQUIRED, which blocks POST /plans/{plan_id}/rollover."
          - "increments EsopPlan.version by 1"

      - from: ACTIVE
        to: RETIRED
        trigger: "POST /participants/{participant_id}/terminate with termination_reason == RETIREMENT"
        actor: PlanSponsor
        preconditions:
          - "participant.status == ACTIVE"
          - "plan.plan_status != FROZEN"
          - "age in whole years at termination_date >= plan.normal_retirement_age"
        side_effects:
          - "Participant.vested_percentage forced to 100 and vested_shares set to allocated_shares."
          - "No ForfeitureEvent is created and EsopPlan.unallocated_forfeiture_shares is unchanged - this is the branch's divergent side-effect set."
          - "increments EsopPlan.version by 1"

      - from: ACTIVE
        to: DECEASED
        trigger: "POST /participants/{participant_id}/terminate with termination_reason == DEATH"
        actor: PlanSponsor
        preconditions:
          - "participant.status == ACTIVE"
          - "plan.plan_status != FROZEN"
        side_effects:
          - "Participant.vested_percentage forced to 100 and vested_shares set to allocated_shares."
          - "No ForfeitureEvent is created; any PutOptionExercise later raised for this participant carries priority_class DEATH, the top waterfall bucket."
          - "increments EsopPlan.version by 1"

      - from: TERMINATED
        to: DISTRIBUTED
        trigger: "system, on POST /installment-payments/{installment_id}/pay that drives an election to payment_status COMPLETED"
        actor: system
        preconditions:
          - "the paid installment's election reaches payment_status == COMPLETED"
          - "participant.allocated_shares == 0 after the delivery"
        side_effects:
          - "No further DistributionElection may be created for this participant."

      - from: RETIRED
        to: DISTRIBUTED
        trigger: "system, on POST /installment-payments/{installment_id}/pay that drives an election to payment_status COMPLETED"
        actor: system
        preconditions:
          - "the paid installment's election reaches payment_status == COMPLETED"
          - "participant.allocated_shares == 0 after the delivery"
        side_effects:
          - "No further DistributionElection may be created for this participant."

      - from: DECEASED
        to: DISTRIBUTED
        trigger: "system, on POST /installment-payments/{installment_id}/pay that drives an election to payment_status COMPLETED"
        actor: system
        preconditions:
          - "the paid installment's election reaches payment_status == COMPLETED"
          - "participant.allocated_shares == 0 after the delivery"
        side_effects:
          - "No further DistributionElection may be created for this participant."

  # ------------------------------------------------------------ EsopLoan
  - entity: EsopLoan
    initial_state: AMORTIZING
    terminal_states: [REPAID]
    transitions:
      - from: AMORTIZING
        to: REPAID
        trigger: "system, on POST /loan-payments that drives principal_balance_cents to 0"
        actor: system
        preconditions:
          - "loan.principal_balance_cents - payment.principal_cents == 0"
        side_effects:
          - "loan_share_release releases the entire remaining suspense balance regardless of the ratio: LoanPayment.released_shares = loan.suspense_shares_before."
          - "EsopLoan.suspense_shares set to 0 and EsopPlan.suspense_shares reduced by the same amount; EsopPlan.unallocated_released_shares increased by the same amount."

  # --------------------------------------------------------- AllocationRun
  - entity: AllocationRun
    initial_state: DRAFT
    terminal_states: [FINALIZED, VOID]
    transitions:
      - from: DRAFT
        to: FINALIZED
        trigger: "POST /allocation-runs/{run_id}/finalize"
        actor: PlanAdministrator
        preconditions:
          - "run.status == DRAFT"
          - "plan.plan_status == VALUATION_PENDING"
          - "X-User-ID != run.created_by_user_id"
          - "the Valuation named by run.valuation_id has status == APPROVED, plan_id == run.plan_id, and plan_year == run.plan_year == plan.plan_year"
          - "the eligible participant set is non-empty"
          - "if plan.forfeiture_policy == REDUCE_CONTRIBUTION, the residue produced by annual_additions_cap_reallocation is 0"
        side_effects:
          - "See the EsopPlan VALUATION_PENDING -> ALLOCATION_LOCKED transition for the full side-effect set."
          - "AllocationRun.finalized_by_user_id, share_price_cents, released_shares_snapshot, forfeiture_shares_snapshot, pool_shares, eligible_participant_count, total_capped_compensation_cents, capped_participant_count, passes_executed and residual_shares are all written."

      - from: DRAFT
        to: VOID
        trigger: "POST /allocation-runs/{run_id}/void"
        actor: Trustee
        preconditions:
          - "run.status == DRAFT"
          - "plan.plan_status != FROZEN"
        side_effects:
          - "AllocationRun.void_reason set from the request; EsopPlan.draft_run_count decreased by 1."
          - "increments EsopPlan.version by 1"

      - from: FINALIZED
        to: VOID
        trigger: "POST /allocation-runs/{run_id}/void"
        actor: Trustee
        preconditions:
          - "run.status == FINALIZED"
          - "plan.plan_status == ALLOCATION_LOCKED"
        side_effects:
          - "COMPENSATION - every ShareAllocation of this run is reversed: Participant.allocated_shares decreased by ShareAllocation.allocated_shares and vested_shares recomputed."
          - "EsopPlan.allocated_shares_total decreased by (run.pool_shares - run.residual_shares); EsopPlan.unallocated_released_shares restored to run.released_shares_snapshot; EsopPlan.unallocated_forfeiture_shares restored to run.forfeiture_shares_snapshot; EsopPlan.total_plan_shares decreased by run.contributed_shares."
          - "Every ForfeitureEvent with reallocated_in_run_id == run.id is set back to PENDING_REALLOCATION with reallocated_in_run_id = null."
          - "Every ParticipantStatement with allocation_run_id == run.id is deleted."
          - "EsopPlan.forfeiture_posture recomputed; EsopPlan.plan_status set back to VALUATION_PENDING."
          - "AllocationRun.void_reason set from the request."
          - "increments EsopPlan.version by 1"
        note: "The share conservation invariant must read identically before the finalize and after the void."

      - from: DRAFT
        to: VOID
        trigger: "system, on POST /plans/{plan_id}/freeze"
        actor: system
        preconditions:
          - "plan.plan_status transitions to FROZEN"
        side_effects:
          - "AllocationRun.void_reason set to 'PLAN_FROZEN'."

  # -------------------------------------------------- DistributionElection
  # Two independent state dimensions on one row.
  # Dimension A (approval_status) is driven only by administrator action and
  # the freeze cascade. Dimension B (payment_status) is driven only by
  # installment payments. Neither dimension reads the other's value.
  - entity: DistributionElection
    initial_state: "approval_status=REQUESTED, payment_status=NOT_STARTED"
    terminal_states: ["approval_status=DENIED", "payment_status=COMPLETED"]
    transitions:
      - from: "approval_status=REQUESTED"
        to: "approval_status=APPROVED"
        trigger: "POST /distribution-elections/{election_id}/commence"
        actor: PlanAdministrator
        preconditions:
          - "election.approval_status == REQUESTED"
          - "plan.plan_status != FROZEN"
          - "plan.current_share_price_cents > 0"
        side_effects:
          - "DistributionElection.approved_shares set to requested_shares; commenced_at_date set to the logical clock date."
          - "installment_schedule_build creates installment_count InstallmentPayment rows, all SCHEDULED."
          - "payment_status is deliberately left at NOT_STARTED - dimension B does not move here."

      - from: "approval_status=REQUESTED"
        to: "approval_status=DENIED"
        trigger: "system, on POST /plans/{plan_id}/freeze"
        actor: system
        preconditions:
          - "plan.plan_status transitions to FROZEN"
        side_effects:
          - "Every SCHEDULED InstallmentPayment of this election is set to CANCELLED."

      - from: "payment_status=NOT_STARTED"
        to: "payment_status=IN_PROGRESS"
        trigger: "system, on the first POST /installment-payments/{installment_id}/pay of this election when installment_count > 1"
        actor: system
        preconditions:
          - "election.approval_status == APPROVED"
          - "at least one installment of this election remains SCHEDULED after the payment"
        side_effects:
          - "None beyond the installment's own effects."

      - from: "payment_status=NOT_STARTED"
        to: "payment_status=COMPLETED"
        trigger: "system, on POST /installment-payments/{installment_id}/pay when no SCHEDULED installment of this election remains"
        actor: system
        preconditions:
          - "election.approval_status == APPROVED"
          - "no installment of this election is left with status == SCHEDULED"
        side_effects:
          - "May cascade to Participant DISTRIBUTED when allocated_shares reaches 0."
        note: "A one-installment schedule jumps NOT_STARTED -> COMPLETED without visiting IN_PROGRESS."

      - from: "payment_status=IN_PROGRESS"
        to: "payment_status=COMPLETED"
        trigger: "system, on POST /installment-payments/{installment_id}/pay when no SCHEDULED installment of this election remains"
        actor: system
        preconditions:
          - "no installment of this election is left with status == SCHEDULED"
        side_effects:
          - "May cascade to Participant DISTRIBUTED when allocated_shares reaches 0."

  # ------------------------------------------------------ InstallmentPayment
  - entity: InstallmentPayment
    initial_state: SCHEDULED
    terminal_states: [PAID, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: PAID
        trigger: "POST /installment-payments/{installment_id}/pay"
        actor: PlanAdministrator
        preconditions:
          - "installment.status == SCHEDULED"
          - "election.approval_status == APPROVED"
          - "plan.plan_status != FROZEN"
          - "the logical clock date >= installment.scheduled_date"
          - "every installment of the same election with a lower sequence_number has status == PAID"
          - "participant.allocated_shares >= installment.shares_scheduled"
          - "opening a new put option window is permitted under put_window_cooling_buffer"
        side_effects:
          - "InstallmentPayment.shares_delivered set to shares_scheduled; paid_date set to the logical clock date."
          - "Participant.allocated_shares decreased by shares_scheduled; vested_shares recomputed; distributed_shares_cumulative increased by shares_scheduled; for DIVERSIFICATION elections diversified_shares_cumulative is also increased by shares_scheduled."
          - "EsopPlan.total_plan_shares and EsopPlan.allocated_shares_total each decreased by shares_scheduled."
          - "A put option window opens on the participant: put_window_open_date = paid_date, put_window_close_date = paid_date + PUT_WINDOW_DAYS - 1, last_put_window_close_date = put_window_close_date."
          - "The election's payment_status advances along dimension B."
          - "increments EsopPlan.version by 1"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "system, on POST /plans/{plan_id}/freeze"
        actor: system
        preconditions:
          - "the owning election is being set to approval_status == DENIED by the freeze cascade"
        side_effects:
          - "None."

  # ------------------------------------------------------ PutOptionExercise
  # Branching with a compensating edge back into the reserve.
  - entity: PutOptionExercise
    initial_state: PENDING
    terminal_states: [SETTLED, CANCELLED]
    transitions:
      - from: PENDING
        to: FUNDED
        trigger: "POST /put-option-exercises/{exercise_id}/fund"
        actor: Trustee
        preconditions:
          - "exercise.status in {PENDING, DEFERRED}"
          - "plan.plan_status != FROZEN"
          - "the logical clock date is within [exercise.window_open_date, exercise.window_close_date] inclusive"
          - "plan.repurchase_reserve_cents >= exercise.exercise_amount_cents"
        side_effects:
          - "PutOptionExercise.funded_cents set to exercise_amount_cents; funded_by_user_id set to X-User-ID."
          - "CASCADE hop 1 - EsopPlan.repurchase_reserve_cents decreased by exercise_amount_cents and EsopPlan.committed_repurchase_cents increased by the same amount."
          - "CASCADE hop 2 - because repurchase_reserve_cents now sits below EsopPlan.repurchase_reserve_floor_cents, EsopPlan.repurchase_posture flips to UNDERFUNDED."
          - "CASCADE hop 3 - because repurchase_posture became UNDERFUNDED, every other PutOptionExercise of this plan's participants with status == PENDING is set to DEFERRED."
          - "increments EsopPlan.version by 1"

      - from: DEFERRED
        to: FUNDED
        trigger: "POST /put-option-exercises/{exercise_id}/fund"
        actor: Trustee
        preconditions:
          - "exercise.status in {PENDING, DEFERRED}"
          - "plan.plan_status != FROZEN"
          - "the logical clock date is within [exercise.window_open_date, exercise.window_close_date] inclusive"
          - "plan.repurchase_reserve_cents >= exercise.exercise_amount_cents"
        side_effects:
          - "Same side-effect set as the PENDING -> FUNDED edge."
          - "increments EsopPlan.version by 1"

      - from: PENDING
        to: DEFERRED
        trigger: "system, on POST /put-option-exercises/{exercise_id}/fund of a sibling exercise, on POST /plans/{plan_id}/repurchase-sweeps, or on POST /plans/{plan_id}/freeze"
        actor: system
        preconditions:
          - "EsopPlan.repurchase_posture became UNDERFUNDED, or the sweep could not fit this exercise, or the plan is being frozen"
        side_effects:
          - "None beyond the status change."

      - from: FUNDED
        to: SETTLED
        trigger: "POST /put-option-exercises/{exercise_id}/settle"
        actor: Trustee
        preconditions:
          - "exercise.status == FUNDED"
          - "plan.plan_status != FROZEN"
        side_effects:
          - "PutOptionExercise.settled_date set to the logical clock date."
          - "EsopPlan.committed_repurchase_cents decreased by funded_cents; EsopPlan.cumulative_repurchase_settled_cents increased by funded_cents."
          - "EsopPlan.reacquired_shares and EsopPlan.total_plan_shares each increased by shares_tendered."
          - "Participant.tendered_shares_cumulative left unchanged; the shares were already committed at creation."
          - "increments EsopPlan.version by 1"

      - from: FUNDED
        to: CANCELLED
        trigger: "POST /put-option-exercises/{exercise_id}/cancel"
        actor: Trustee
        preconditions:
          - "exercise.status in {PENDING, DEFERRED, FUNDED}"
          - "plan.plan_status != FROZEN"
        side_effects:
          - "COMPENSATION - EsopPlan.repurchase_reserve_cents increased by funded_cents and EsopPlan.committed_repurchase_cents decreased by the same amount; PutOptionExercise.funded_cents reset to 0."
          - "Participant.tendered_shares_cumulative decreased by shares_tendered."
          - "EsopPlan.repurchase_posture recomputed; when it returns to FUNDED, every PutOptionExercise of this plan's participants with status == DEFERRED is set back to PENDING."
          - "PutOptionExercise.cancel_reason set from the request."
          - "increments EsopPlan.version by 1"
        note: "The cash conservation invariant must read identically before the fund and after the cancel."

      - from: PENDING
        to: CANCELLED
        trigger: "POST /put-option-exercises/{exercise_id}/cancel"
        actor: Trustee
        preconditions:
          - "exercise.status in {PENDING, DEFERRED, FUNDED}"
          - "plan.plan_status != FROZEN"
        side_effects:
          - "No cash moves because funded_cents is already 0; Participant.tendered_shares_cumulative decreased by shares_tendered; cancel_reason set."
          - "increments EsopPlan.version by 1"

      - from: DEFERRED
        to: CANCELLED
        trigger: "POST /put-option-exercises/{exercise_id}/cancel"
        actor: Trustee
        preconditions:
          - "exercise.status in {PENDING, DEFERRED, FUNDED}"
          - "plan.plan_status != FROZEN"
        side_effects:
          - "No cash moves; Participant.tendered_shares_cumulative decreased by shares_tendered; cancel_reason set."
          - "increments EsopPlan.version by 1"

  # --------------------------------------------------- ParticipantStatement
  - entity: ParticipantStatement
    initial_state: GENERATED
    terminal_states: [DELIVERED]
    transitions:
      - from: GENERATED
        to: DELIVERED
        trigger: "POST /participant-statements/{statement_id}/deliver"
        actor: PlanAdministrator
        preconditions:
          - "statement.delivery_status == GENERATED"
          - "plan.plan_status != FROZEN"
        side_effects:
          - "ParticipantStatement.delivery_channel set from the request. Every numeric snapshot field is left untouched."

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: valuation-create-stale-plan
    parent_entity: EsopPlan
    write_endpoint: "POST /valuations"
    occ_field: "expected_plan_version"
    description: |
      Submitting a Valuation against an EsopPlan whose version has advanced
      since the appraiser last observed it is rejected. A second appraisal for
      the same plan year is legitimate under the supersede rule, so nothing in
      the state machine stops it; the stale expected_plan_version is what
      identifies an appraiser working from an out-of-date view of the plan's
      ownership percentage and share counts, both of which feed
      valuation_share_price.
    error_id: ERR_STALE_PLAN_VERSION
    http_status: 412

  - rule_id: allocation-run-create-stale-plan
    parent_entity: EsopPlan
    write_endpoint: "POST /allocation-runs"
    occ_field: "expected_plan_version"
    description: |
      Creating an AllocationRun against an EsopPlan whose version has advanced
      since the administrator last observed it is rejected. A plan may legitimately
      carry more than one DRAFT run, so no state precondition rejects the second
      create; the stale expected_plan_version is what identifies an administrator
      whose view of unallocated_released_shares and unallocated_forfeiture_shares -
      the two pool components the run will consume - is out of date.
    error_id: ERR_STALE_PLAN_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: valuation_share_price
    trigger: "POST /valuations (creation) and POST /valuations/{valuation_id}/resubmit; writes Valuation.share_price_cents, equity_value_cents, control_premium_applied_cents, ownership_bps_at_valuation"
    algorithm: threshold
    formula: |
      # --- step 1: equity value, floored at zero
      equity_value_cents = max(enterprise_value_cents - debt_outstanding_cents
                               + non_operating_assets_cents, 0)

      # --- step 2: ownership branch (threshold on the trust's holding)
      ownership_bps_at_valuation = floor(plan.total_plan_shares * 10000
                                         / plan.total_shares_outstanding)
      if ownership_bps_at_valuation >= CONTROL_PREMIUM_OWNERSHIP_THRESHOLD_BPS:
          uncapped_premium = round_half_up(equity_value_cents * control_premium_bps / 10000)
          control_premium_applied_cents = min(uncapped_premium, CONTROL_PREMIUM_CAP_CENTS)
      else:
          control_premium_applied_cents = 0

      # --- step 3: EVALUATION ORDER IS PINNED. The capped control premium is
      #     computed on the PRE-discount equity value and added first; the
      #     marketability discount is applied to the sum afterwards. Because the
      #     premium is capped, the two orders are NOT interchangeable: with the
      #     worked constants below, premium-then-discount yields 7875 and
      #     discount-then-premium yields 8125.
      controlled_value_cents = equity_value_cents + control_premium_applied_cents
      marketable_value_cents = round_half_up(controlled_value_cents
                                             * (10000 - marketability_discount_bps) / 10000)

      # --- step 4: per-share, truncated to whole cents, floored at the minimum
      raw_price_cents  = floor(marketable_value_cents / plan.total_shares_outstanding)
      share_price_cents = max(raw_price_cents, MIN_SHARE_PRICE_CENTS)
    input_set: "Exactly one Valuation row plus two EsopPlan fields read at evaluation time: total_plan_shares and total_shares_outstanding. No other Valuation participates."
    constants:
      CONTROL_PREMIUM_OWNERSHIP_THRESHOLD_BPS: 5000
      CONTROL_PREMIUM_CAP_CENTS: 1000000000
      MIN_SHARE_PRICE_CENTS: 1
    precision: "All monetary intermediates are whole cents. round_half_up at steps 2 and 3; floor at step 4."
    variants: []
    note: |
      Worked example pinned by the test design. enterprise 12000000000,
      debt 3000000000, non-operating 500000000, control premium 1500 bps,
      marketability 2500 bps, total_shares_outstanding 1000000.
      With plan.total_plan_shares = 600000 (ownership 6000 bps, branch taken):
        equity 9500000000; uncapped premium 1425000000 capped to 1000000000;
        controlled 10500000000; marketable 7875000000; price 7875.
      With plan.total_plan_shares = 0 (ownership 0 bps, branch not taken):
        equity 9500000000; premium 0; marketable 7125000000; price 7125.

  - name: loan_share_release
    trigger: "POST /loan-payments; writes LoanPayment.released_shares, suspense_shares_before, suspense_shares_after, release_method_applied"
    algorithm: chronological
    formula: |
      suspense_shares_before        = loan.suspense_shares
      principal_balance_after_cents = loan.principal_balance_cents - principal_cents
      remaining_interest_after_cents = loan.remaining_interest_cents - interest_cents

      if principal_balance_after_cents == 0:
          # final payment: the whole remaining suspense balance is released
          released_shares = suspense_shares_before
      elif loan.release_method == "PRINCIPAL_ONLY":
          numerator   = principal_cents
          denominator = principal_cents + principal_balance_after_cents
          released_shares = floor(suspense_shares_before * numerator / denominator)
      else:  # PRINCIPAL_AND_INTEREST
          numerator   = principal_cents + interest_cents
          denominator = principal_cents + interest_cents
                        + principal_balance_after_cents + remaining_interest_after_cents
          released_shares = floor(suspense_shares_before * numerator / denominator)

      suspense_shares_after = suspense_shares_before - released_shares
    input_set: "One EsopLoan row and the payment being recorded. Payments are applied strictly in submission order; each payment reads the balances the previous payment left behind."
    constants: {}
    precision: "Exact rational arithmetic inside the ratio; a single floor at the end. Never round the ratio to a decimal first."
    variants:
      - name: PRINCIPAL_ONLY
        when: "EsopLoan.release_method == PRINCIPAL_ONLY"
        difference: "The ratio counts principal only. With suspense 600000, principal 400000000, interest 200000000, principal balance after 3600000000 and remaining interest after 1400000000, this releases 60000 shares."
      - name: PRINCIPAL_AND_INTEREST
        when: "EsopLoan.release_method == PRINCIPAL_AND_INTEREST"
        difference: "The ratio counts principal plus interest on both sides of the fraction. On the identical payment above it releases 64285 shares - 4285 more than PRINCIPAL_ONLY, because interest front-loading inflates the numerator faster than the denominator."

  - name: participant_vested_percentage
    trigger: "POST /participants/{participant_id}/terminate, and again for every eligible participant inside POST /allocation-runs/{run_id}/finalize; writes Participant.years_of_service, vested_percentage, vested_shares"
    algorithm: threshold
    formula: |
      # --- measurement date selection
      if context == TERMINATION:
          if plan.service_measurement_method == "TERMINATION_DATE_MEASURE":
              measurement_date = participant.termination_date
          else:  # PLAN_YEAR_END_MEASURE
              measurement_date = date(plan.plan_year, 12, 31)
      else:  # context == ALLOCATION_FINALIZE, for participants still ACTIVE
          measurement_date = date(run.plan_year, 12, 31)

      years_of_service = floor(days_between(participant.hire_date, measurement_date) / 365)

      if plan.vesting_schedule == "CLIFF_3YR":
          vested_percentage = 0 if years_of_service < 3 else 100
      else:  # GRADED_6YR
          vested_percentage = GRADED_6YR_TABLE[min(years_of_service, 6)]

      if participant.termination_reason in {"RETIREMENT", "DEATH", "DISABILITY"}:
          vested_percentage = 100

      vested_shares = floor(participant.allocated_shares * vested_percentage / 100)
    input_set: "One Participant row, one EsopPlan row. days_between is a plain calendar-day difference; leap days count as ordinary days and the divisor is a fixed 365."
    constants:
      GRADED_6YR_TABLE: { 0: 0, 1: 0, 2: 20, 3: 40, 4: 60, 5: 80, 6: 100 }
      DAYS_PER_SERVICE_YEAR: 365
    precision: "Integer floor at both the service-year division and the vested-share multiplication."
    variants:
      - name: TERMINATION_DATE_MEASURE
        when: "EsopPlan.service_measurement_method == TERMINATION_DATE_MEASURE"
        difference: "Service stops accruing on the separation date. For hire_date 2021-03-01 and termination_date 2026-01-15 this counts 1781 days, 4 whole years, 60 percent under GRADED_6YR."
      - name: PLAN_YEAR_END_MEASURE
        when: "EsopPlan.service_measurement_method == PLAN_YEAR_END_MEASURE"
        difference: "Service accrues to 31 December of the plan year in which the separation falls. For the same participant this counts 2131 days, 5 whole years, 80 percent - a 20-point divergence on identical employment facts."

  - name: allocation_pool_distribution
    trigger: "POST /allocation-runs/{run_id}/finalize, executed jointly with annual_additions_cap_reallocation; writes every ShareAllocation field and AllocationRun.pool_shares, eligible_participant_count, total_capped_compensation_cents"
    algorithm: waterfall_allocation
    formula: |
      # --- eligible set (explicit predicate, explicit order)
      eligible = [p for p in Participant
                  where p.plan_id == run.plan_id
                    and p.status == "ACTIVE"
                    and p.eligible_compensation_cents > 0]
                 ordered by p.created_at ASC
      if eligible is empty: raise ERR_NO_ELIGIBLE_PARTICIPANTS

      capped_compensation_cents[i] = min(eligible[i].eligible_compensation_cents,
                                         plan.annual_compensation_limit_cents)
      total_capped_compensation_cents = sum(capped_compensation_cents over eligible)

      pool_shares = plan.unallocated_released_shares
                  + plan.unallocated_forfeiture_shares
                  + run.contributed_shares

      # --- ROUNDING ORDER IS PINNED: floor every participant's exact share,
      #     then hand out the shortfall one share at a time. The alternative
      #     reading - round each raw share half-up and sum - is explicitly NOT
      #     used, because it can distribute more or fewer shares than the pool
      #     holds. Rounding happens per participant FIRST, the residue is
      #     reconciled SECOND; the pool total is never rounded.
      for each pass (see annual_additions_cap_reallocation for the pass loop):
          denominator = sum(capped_compensation_cents[i] for i in open_set)
          raw[i]      = pool_shares * capped_compensation_cents[i] / denominator   # exact rational
          floor[i]    = floor(raw[i])
          remainder   = pool_shares - sum(floor[i] over open_set)
          # remainder ordering: fractional part DESC,
          #                     tie-break capped_compensation_cents DESC,
          #                     final tie-break participant.created_at ASC
          grant[i]    = floor[i] + (1 if i is among the first `remainder` in that order else 0)
          remainder_shares_awarded[i] += (grant[i] - floor[i])
    input_set: "Participants of run.plan_id with status ACTIVE and eligible_compensation_cents > 0. TERMINATED, RETIRED, DECEASED and DISTRIBUTED participants are excluded, as are ACTIVE participants with zero compensation."
    constants: {}
    precision: "Exact rational raw shares; a single floor per participant per pass; the remainder is whole shares only."
    variants: []
    note: |
      Worked example pinned by the test design. pool_shares 2000, price 7875,
      three ACTIVE participants created in this order with eligible compensation
      40000000, 20000000, 10000000 and compensation limit 34500000.
      Pass 1 capped comps 34500000 / 20000000 / 10000000, denominator 64500000;
      raw 1069.767 / 620.155 / 310.078; floors 1069 / 620 / 310 summing to 1999;
      one remainder share goes to the largest fraction, participant A;
      grants 1070 / 620 / 310.

  - name: annual_additions_cap_reallocation
    trigger: "POST /allocation-runs/{run_id}/finalize; writes ShareAllocation.max_shares_cap, gross_shares_before_cap, excess_shares_removed, allocated_shares, annual_additions_cents, capped, and AllocationRun.capped_participant_count, passes_executed, residual_shares"
    algorithm: constraint_propagation
    formula: |
      # This rule and allocation_pool_distribution are mutually dependent: the
      # per-participant grant depends on the pool, and the pool for the next
      # pass depends on how much of the grant the Section 415 ceiling rejected.
      # EVALUATION ORDER IS PINNED so the fixed point is well defined:
      #   (1) at most MAX_REALLOCATION_PASSES passes;
      #   (2) a participant who reaches the ceiling is removed from open_set at
      #       the end of the pass in which it happened and never re-enters;
      #   (3) whatever is still unallocated when the loop stops is the residue.
      max_shares_cap = floor(plan.annual_additions_limit_cents / run.share_price_cents)
      award[i]  = 0
      open_set  = eligible
      pool      = pool_shares
      passes_executed = 0

      for pass in 1 .. MAX_REALLOCATION_PASSES:
          if pool == 0 or open_set is empty: break
          passes_executed = pass
          grant[] = allocation_pool_distribution(pool, open_set)   # floors + remainder
          pool = 0
          for i in open_set:
              gross_shares_before_cap[i] += grant[i]
              room  = max_shares_cap - award[i]
              taken = min(grant[i], room)
              award[i] += taken
              pool     += grant[i] - taken          # rejected shares recycle into the next pass
          open_set = [i in open_set where award[i] < max_shares_cap]

      residual_shares          = pool
      allocated_shares[i]      = award[i]
      excess_shares_removed[i] = gross_shares_before_cap[i] - award[i]
      annual_additions_cents[i]= award[i] * run.share_price_cents
      capped[i]                = (award[i] == max_shares_cap)
      capped_participant_count = count of i where capped[i]

      # --- residue disposition depends on the plan's configured policy
      if plan.forfeiture_policy == "REDUCE_CONTRIBUTION" and residual_shares > 0:
          raise ERR_ANNUAL_ADDITIONS_EXCEEDED        # finalize is rejected whole
      else:
          plan.unallocated_forfeiture_shares = residual_shares
    input_set: "The same eligible set as allocation_pool_distribution, plus plan.annual_additions_limit_cents and run.share_price_cents."
    constants:
      MAX_REALLOCATION_PASSES: 3
    precision: "Integer floor on the share ceiling; all pass arithmetic is whole shares."
    variants: []
    note: |
      Worked example continuing allocation_pool_distribution's. max_shares_cap
      = floor(6900000 / 7875) = 876.
      Pass 1 grants 1070 / 620 / 310; A is trimmed to 876 and leaves open_set,
      194 shares recycle. Pass 2 over B and C with denominator 30000000:
      raw 129.333 / 64.667, floors 129 / 64, remainder 1 goes to C's larger
      fraction, grants 129 / 65, both fit. pool reaches 0, loop stops after
      2 passes. Final awards 876 / 749 / 375, residue 0, capped count 1.
      Boundary: with one participant at the compensation limit and price 7875,
      contributed_shares 876 finalizes with residue 0 while contributed_shares
      877 leaves residue 1.

  - name: installment_schedule_build
    trigger: "POST /distribution-elections/{election_id}/commence; writes DistributionElection.approved_shares, installment_count and every InstallmentPayment row"
    algorithm: waterfall_allocation
    formula: |
      if election.election_type == "DIVERSIFICATION" or plan.distribution_policy == "LUMP_SUM":
          installment_count = 1
      else:
          installment_count = INSTALLMENT_YEARS

      approved_shares = election.requested_shares
      base_shares     = floor(approved_shares / installment_count)
      remainder       = approved_shares - base_shares * installment_count

      for k in 1 .. installment_count:
          sequence_number = k
          # PINNED: the whole remainder lands on the LAST installment. It is not
          # spread one share at a time across the earliest installments.
          shares_scheduled = base_shares + (remainder if k == installment_count else 0)
          scheduled_date   = commenced_at_date advanced by (k - 1) whole years,
                             keeping month and day; 29 February maps to 28 February
                             in a non-leap target year.
    input_set: "One DistributionElection row and its EsopPlan's distribution_policy."
    constants:
      INSTALLMENT_YEARS: 5
    precision: "Whole shares only; the remainder is never split."
    variants: []
    note: "1003 shares over 5 installments schedules 200 / 200 / 200 / 200 / 203."

  - name: diversification_eligibility_window
    trigger: "POST /distribution-elections with election_type == DIVERSIFICATION; writes DistributionElection.diversification_year_index, diversification_cap_percent, and Participant.diversification_first_eligible_plan_year, diversification_eligible"
    algorithm: threshold
    formula: |
      diversification_first_eligible_plan_year =
          max(year(participant.date_of_birth) + plan.diversification_min_age,
              year(participant.hire_date)     + plan.diversification_min_years)

      diversification_year_index = plan.plan_year
                                 - diversification_first_eligible_plan_year + 1

      if diversification_year_index < 1 or diversification_year_index > QUALIFIED_PERIOD_YEARS:
          raise ERR_DIVERSIFICATION_WINDOW_CLOSED

      diversification_cap_percent = FINAL_YEAR_CAP_PERCENT
                                    if diversification_year_index == QUALIFIED_PERIOD_YEARS
                                    else EARLY_YEAR_CAP_PERCENT

      cumulative_eligible_shares = participant.allocated_shares
                                 + participant.diversified_shares_cumulative
      cumulative_cap_shares      = floor(cumulative_eligible_shares
                                         * diversification_cap_percent / 100)
      available_shares           = cumulative_cap_shares
                                 - participant.diversified_shares_cumulative

      if election.requested_shares > available_shares:
          raise ERR_DIVERSIFICATION_LIMIT_EXCEEDED
    input_set: "One Participant row and its EsopPlan. Only elections with election_type DIVERSIFICATION enter this rule; the four separation types skip it entirely."
    constants:
      QUALIFIED_PERIOD_YEARS: 6
      EARLY_YEAR_CAP_PERCENT: 25
      FINAL_YEAR_CAP_PERCENT: 50
    precision: "Calendar-year granularity on both anchors; integer floor on the cumulative cap."
    variants: []
    note: |
      Worked example. date_of_birth 1968-05-20, hire_date 2010-08-15,
      diversification_min_age 55, diversification_min_years 10 gives
      first_eligible_plan_year max(2023, 2020) = 2023. With plan_year 2026 the
      index is 4, cap 25 percent; a participant holding 900 allocated shares and
      0 diversified may elect at most floor(900 * 25 / 100) = 225 shares.
      Index 6 (plan_year 2028) raises the cap to 50 percent; index 7
      (plan_year 2029) closes the window.

  - name: put_window_cooling_buffer
    trigger: "POST /installment-payments/{installment_id}/pay, evaluated before the delivery is applied; writes Participant.put_window_open_date, put_window_close_date, last_put_window_close_date"
    algorithm: interval_merge
    formula: |
      candidate_open_date  = logical clock date of the payment
      candidate_close_date = candidate_open_date + PUT_WINDOW_DAYS - 1   # CLOSED interval

      if participant.last_put_window_close_date is not null
         and candidate_open_date < participant.last_put_window_close_date
                                   + PUT_WINDOW_COOLING_DAYS:
          raise ERR_PUT_WINDOW_BUFFER_VIOLATION

      participant.put_window_open_date       = candidate_open_date
      participant.put_window_close_date      = candidate_close_date
      participant.last_put_window_close_date = candidate_close_date
    input_set: "One Participant row. Only the most recent window matters; older windows are already folded into last_put_window_close_date."
    constants:
      PUT_WINDOW_DAYS: 60
      PUT_WINDOW_COOLING_DAYS: 30
    precision: "Whole calendar days. Both window endpoints are inclusive; the buffer comparison is a strict less-than, so a candidate landing exactly on close + 30 is admitted."
    variants: []
    note: |
      Worked example. A payment on 2026-04-01 opens the window
      [2026-04-01, 2026-05-30]. The next window may open no earlier than
      2026-06-29; a payment on 2026-06-28 is refused, a payment on 2026-06-29
      is admitted.

  - name: repurchase_funding_waterfall
    trigger: "POST /plans/{plan_id}/repurchase-sweeps"
    algorithm: waterfall_allocation
    formula: |
      candidates = [x for x in PutOptionExercise
                    where x.participant_id belongs to a Participant with plan_id == plan.id
                      and x.status in {"PENDING", "DEFERRED"}
                      and logical clock date <= x.window_close_date]
                   ordered by PRIORITY_RANK[x.priority_class] ASC,
                              x.exercise_date ASC,
                              x.created_at ASC

      spendable_cents = max(plan.repurchase_reserve_cents
                            - plan.repurchase_reserve_floor_cents, 0)
      funded_count = 0; deferred_count = 0; funded_cents_total = 0
      stopped_at_exercise_id = null

      for x in candidates:
          if x.exercise_amount_cents <= spendable_cents:
              x.status = "FUNDED"; x.funded_cents = x.exercise_amount_cents
              x.funded_by_user_id = X-User-ID
              spendable_cents -= x.exercise_amount_cents
              plan.repurchase_reserve_cents -= x.exercise_amount_cents
              plan.committed_repurchase_cents += x.exercise_amount_cents
              funded_count += 1; funded_cents_total += x.exercise_amount_cents
          else:
              x.status = "DEFERRED"; deferred_count += 1
              if plan.sweep_mode == "STRICT_ORDER":
                  stopped_at_exercise_id = x.id
                  set every remaining candidate to DEFERRED, counting each in
                  deferred_count, and stop
              # BEST_FIT: fall through and keep scanning the queue

      plan.repurchase_posture is recomputed once at the end of the sweep.
    input_set: "Open put option exercises of the plan's participants whose window has not yet lapsed. Exercises already FUNDED, SETTLED or CANCELLED never enter the queue, and neither do exercises whose window_close_date is in the past."
    constants:
      PRIORITY_RANK: { DEATH: 1, RETIREMENT_DISABILITY: 2, TERMINATION: 3, DIVERSIFICATION: 4 }
    precision: "Whole cents. The sweep never spends below repurchase_reserve_floor_cents, so it can never itself drive repurchase_posture to UNDERFUNDED."
    variants:
      - name: STRICT_ORDER
        when: "EsopPlan.sweep_mode == STRICT_ORDER"
        difference: "The queue is honoured absolutely: the first exercise that does not fit halts the sweep and every later candidate is deferred, even one small enough to fit."
      - name: BEST_FIT
        when: "EsopPlan.sweep_mode == BEST_FIT"
        difference: "The oversized exercise is deferred and scanning continues, so a cheaper lower-priority exercise behind it can be funded from the same reserve. Identical inputs therefore fund a different set of exercises under the two modes."

  - name: statement_snapshot
    trigger: "system, inside POST /allocation-runs/{run_id}/finalize, once per eligible participant; writes every ParticipantStatement field"
    algorithm: aggregation
    formula: |
      opening_shares            = participant.allocated_shares before this run's credit
      shares_allocated          = the participant's ShareAllocation.allocated_shares in this run
      closing_shares            = opening_shares + shares_allocated
      forfeited_shares_this_year = sum(ForfeitureEvent.forfeited_shares
                                       for events with participant_id == participant.id
                                       and plan_year == run.plan_year)
      share_price_cents         = run.share_price_cents          # frozen copy
      vested_percentage         = participant.vested_percentage  # frozen copy
      vested_value_cents        = floor(closing_shares * vested_percentage / 100)
                                  * share_price_cents
      total_value_cents         = closing_shares * share_price_cents
      diversification_eligible  = participant.diversification_eligible
    input_set: "One Participant, one AllocationRun, one ShareAllocation, plus every ForfeitureEvent of that participant whose plan_year equals run.plan_year regardless of the event's own status. No time window other than the plan year; the aggregate is order-insensitive because it is a plain sum."
    constants: {}
    precision: "Integer floor on the vested share count before multiplying by price."
    variants: []
    note: "Every numeric field is a frozen snapshot. Approving a later Valuation, or rolling the plan year forward, must leave an existing ParticipantStatement byte-identical."

  - name: repurchase_obligation_forecast
    trigger: "GET /plans/{plan_id}/repurchase-forecast"
    algorithm: forward_looking
    formula: |
      horizon_years = request horizon_years, default DEFAULT_HORIZON_YEARS
      current_year  = year of the logical clock date

      included = [p for p in Participant where p.plan_id == plan.id and (
                     (p.status in {"TERMINATED", "RETIRED", "DECEASED"})
                  or (p.status == "ACTIVE"
                      and year(p.date_of_birth) + plan.normal_retirement_age
                          <= current_year + horizon_years))]
      # DISTRIBUTED participants are excluded: their obligation has already been met.

      projected_obligation_cents = sum over included of
          p.vested_shares * plan.current_share_price_cents

      participant_count = count(included)
      coverage_bps = 10000 if projected_obligation_cents == 0
                     else floor(plan.repurchase_reserve_cents * 10000
                                / projected_obligation_cents)
    input_set: "Participants of the plan in the four listed statuses. The window is the closed year range [current_year, current_year + horizon_years]; the sum is order-insensitive."
    constants:
      DEFAULT_HORIZON_YEARS: 5
    precision: "vested_shares is read as stored, never recomputed here; integer floor on coverage_bps."
    variants: []

# =============================================================================
# 1.4 Validation Rules Table (evaluated strictly in ascending priority order;
#     the first rule that fails is the one whose error_id is returned)
# =============================================================================
validations:

  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and X-User-Role names a role declared in the RBAC matrix."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "The role in X-User-Role appears in the endpoint's roles list."
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: business_constraint
    check: "Request body shape is well formed: every required input field is present, every field has the declared type, every enum field carries a declared member, every integer field satisfies its declared range, and every date field parses as YYYY-MM-DD. Also covers effective_to_date strictly after effective_from_date, limit within 1..100 and offset >= 0."
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"

  - priority: 4
    category: existence
    check: "Every resource named by a path segment exists, validated left to right."
    error_id: "ERR_PLAN_NOT_FOUND | ERR_PARTICIPANT_NOT_FOUND | ERR_VALUATION_NOT_FOUND | ERR_LOAN_NOT_FOUND | ERR_LOAN_PAYMENT_NOT_FOUND | ERR_RUN_NOT_FOUND | ERR_ALLOCATION_NOT_FOUND | ERR_FORFEITURE_NOT_FOUND | ERR_ELECTION_NOT_FOUND | ERR_INSTALLMENT_NOT_FOUND | ERR_EXERCISE_NOT_FOUND | ERR_STATEMENT_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with a path parameter"

  - priority: 5
    category: existence
    check: "Every foreign key supplied in the request body names an existing row: plan_id, participant_id, valuation_id, loan_id, distribution_election_id, supersedes_valuation_id."
    error_id: "ERR_PLAN_NOT_FOUND | ERR_PARTICIPANT_NOT_FOUND | ERR_VALUATION_NOT_FOUND | ERR_LOAN_NOT_FOUND | ERR_ELECTION_NOT_FOUND"
    http_status: 404
    applies_to: "POST /participants, POST /valuations, POST /esop-loans, POST /loan-payments, POST /allocation-runs, POST /distribution-elections, POST /put-option-exercises"

  - priority: 6
    category: auth
    check: "When X-User-Role is Participant, X-User-ID equals the id of the Participant that owns the target resource - participant_id on POST /distribution-elections, the election's participant_id on POST /put-option-exercises, and the exercise's participant_id on POST /put-option-exercises/{exercise_id}/cancel."
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /distribution-elections, POST /put-option-exercises, POST /put-option-exercises/{exercise_id}/cancel"

  - priority: 7
    category: state
    check: "The governing EsopPlan is not FROZEN. Reads are unaffected; every mutating endpoint except POST /_clock/set_current_utc is refused."
    error_id: ERR_PLAN_FROZEN
    http_status: 409
    applies_to: "all mutating endpoints"

  - priority: 8
    category: state
    check: "The governing EsopPlan is in the plan_status this operation requires: OPEN for participant creation, participant patch and loan creation; VALUATION_PENDING for valuation approval and run finalize; ALLOCATION_LOCKED for rollover and for voiding a FINALIZED run."
    error_id: ERR_PLAN_STATE_INVALID
    http_status: 409
    applies_to: "POST /participants, PATCH /participants/{participant_id}, POST /esop-loans, POST /plans/{plan_id}/close-year, POST /plans/{plan_id}/rollover, POST /valuations/{valuation_id}/approve, POST /allocation-runs/{run_id}/finalize, POST /allocation-runs/{run_id}/void"

  - priority: 9
    category: state
    check: "The target resource is in a state from which the requested transition is declared in section 1.2."
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"

  - priority: 10
    category: state
    check: "expected_plan_version equals the current EsopPlan.version."
    error_id: ERR_STALE_PLAN_VERSION
    http_status: 412
    applies_to: "POST /valuations, POST /allocation-runs"

  - priority: 11
    category: business_safety
    check: "Segregation of duties: on POST /valuations/{valuation_id}/approve, X-User-ID differs from Valuation.appraiser_user_id; on POST /allocation-runs/{run_id}/finalize, X-User-ID differs from AllocationRun.created_by_user_id."
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /valuations/{valuation_id}/approve, POST /allocation-runs/{run_id}/finalize"

  - priority: 12
    category: business_safety
    check: "A priced operation has a price to work with: on POST /allocation-runs/{run_id}/finalize the run's valuation has status APPROVED; on POST /distribution-elections/{election_id}/commence and POST /put-option-exercises the plan's current_share_price_cents is greater than 0. Also refuses approval of a second valuation for a plan_year that already has an APPROVED one."
    error_id: ERR_NO_APPROVED_VALUATION
    http_status: 409
    applies_to: "POST /allocation-runs/{run_id}/finalize, POST /distribution-elections/{election_id}/commence, POST /put-option-exercises, POST /valuations/{valuation_id}/approve"

  - priority: 13
    category: business_referential
    check: "Cross-entity linkage is coherent at finalize: AllocationRun.valuation_id names a Valuation whose plan_id equals the run's plan_id and whose plan_year equals both run.plan_year and plan.plan_year. The coherence is deliberately NOT checked at run creation - a draft run may name any existing valuation, and the mismatch surfaces only when the administrator tries to finalize."
    error_id: ERR_ENTITY_MISMATCH
    http_status: 409
    applies_to: "POST /allocation-runs/{run_id}/finalize"

  - priority: 14
    category: business_referential
    check: "A valuation may be challenged only while challenge_round is below MAX_CHALLENGE_ROUNDS."
    error_id: ERR_CHALLENGE_ROUNDS_EXHAUSTED
    http_status: 409
    applies_to: "POST /valuations/{valuation_id}/challenge"

  - priority: 15
    category: business_temporal
    check: "Valuation coverage intervals do not overlap. The new [effective_from_date, effective_to_date) half-open interval must not intersect the interval of any other Valuation of the same plan whose status is SUBMITTED, CHALLENGED or APPROVED. Touching endpoints are legal: an interval ending exactly where another begins does not overlap. The valuation named by supersedes_valuation_id is excluded from the comparison set."
    error_id: ERR_VALUATION_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /valuations"

  - priority: 16
    category: business_temporal
    check: "put_window_cooling_buffer admits the new window: the payment date is not earlier than the participant's last_put_window_close_date plus PUT_WINDOW_COOLING_DAYS."
    error_id: ERR_PUT_WINDOW_BUFFER_VIOLATION
    http_status: 409
    applies_to: "POST /installment-payments/{installment_id}/pay"

  - priority: 17
    category: business_temporal
    check: "The logical clock date lies inside the participant's put option window, a closed interval on both ends. Applies to raising an exercise and to funding one."
    error_id: ERR_PUT_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /put-option-exercises, POST /put-option-exercises/{exercise_id}/fund"

  - priority: 18
    category: business_temporal
    check: "An installment may not be paid before its scheduled_date, and a lower-numbered installment of the same election may not still be SCHEDULED."
    error_id: ERR_INSTALLMENT_NOT_DUE
    http_status: 422
    applies_to: "POST /installment-payments/{installment_id}/pay"

  - priority: 19
    category: business_temporal
    check: "diversification_eligibility_window places plan.plan_year inside the six-year qualified election period."
    error_id: ERR_DIVERSIFICATION_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /distribution-elections"

  - priority: 20
    category: business_constraint
    check: "employee_number is unique within a plan."
    error_id: ERR_DUPLICATE_EMPLOYEE_NUMBER
    http_status: 409
    applies_to: "POST /participants"

  - priority: 21
    category: business_constraint
    check: "The participant's status permits the election: DIVERSIFICATION requires ACTIVE; TERMINATION, RETIREMENT, DEATH and DISABILITY require the participant to be TERMINATED, RETIRED or DECEASED and to have never reached DISTRIBUTED."
    error_id: ERR_ELECTION_NOT_PERMITTED
    http_status: 422
    applies_to: "POST /distribution-elections"

  - priority: 22
    category: business_constraint
    check: "A termination recorded with reason RETIREMENT requires the participant's whole-year age at termination_date to have reached plan.normal_retirement_age."
    error_id: ERR_RETIREMENT_AGE_NOT_ATTAINED
    http_status: 422
    applies_to: "POST /participants/{participant_id}/terminate"

  - priority: 23
    category: business_constraint
    check: "The eligible participant set for a finalize is non-empty."
    error_id: ERR_NO_ELIGIBLE_PARTICIPANTS
    http_status: 422
    applies_to: "POST /allocation-runs/{run_id}/finalize"

  - priority: 24
    category: business_constraint
    check: "Enough shares stand behind the request: a non-diversification election's requested_shares is at most participant.vested_shares; a put exercise's shares_tendered is at most participant.distributed_shares_cumulative minus participant.tendered_shares_cumulative."
    error_id: ERR_INSUFFICIENT_SHARES
    http_status: 422
    applies_to: "POST /distribution-elections, POST /put-option-exercises"

  - priority: 25
    category: business_constraint
    check: "diversification_eligibility_window's cumulative cap is not breached by requested_shares."
    error_id: ERR_DIVERSIFICATION_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /distribution-elections"

  - priority: 26
    category: business_constraint
    check: "The plan's forfeiture sweep posture permits the rollover: forfeiture_posture is CLEAR."
    error_id: ERR_FORFEITURE_SWEEP_REQUIRED
    http_status: 409
    applies_to: "POST /plans/{plan_id}/rollover"

  - priority: 27
    category: business_fiscal
    check: "annual_additions_cap_reallocation leaves no residue when plan.forfeiture_policy is REDUCE_CONTRIBUTION."
    error_id: ERR_ANNUAL_ADDITIONS_EXCEEDED
    http_status: 422
    applies_to: "POST /allocation-runs/{run_id}/finalize"

  - priority: 28
    category: business_fiscal
    check: "A loan payment's principal_cents does not exceed the loan's principal_balance_cents, and its interest_cents does not exceed remaining_interest_cents."
    error_id: ERR_PAYMENT_EXCEEDS_BALANCE
    http_status: 422
    applies_to: "POST /loan-payments"

  - priority: 29
    category: business_fiscal
    check: "plan.repurchase_reserve_cents is at least the exercise's exercise_amount_cents."
    error_id: ERR_INSUFFICIENT_REPURCHASE_RESERVE
    http_status: 402
    applies_to: "POST /put-option-exercises/{exercise_id}/fund"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:

  # ------------------------------------------------------------------ plans
  - method: POST
    path: "/plans"
    description: "Create an ESOP plan. Starts OPEN with every share and cash counter at 0."
    roles: [PlanSponsor]
    code: 201
    input: [plan_name, sponsor_name, plan_year, total_shares_outstanding, vesting_schedule, service_measurement_method, forfeiture_policy, distribution_policy, "sweep_mode?", "annual_compensation_limit_cents?", "annual_additions_limit_cents?", "normal_retirement_age?", "diversification_min_age?", "diversification_min_years?", "repurchase_reserve_floor_cents?", "forfeiture_sweep_threshold_shares?"]
    output: EsopPlan
    side_effects: ["EsopPlan created with plan_status OPEN, version 1, repurchase_posture FUNDED and forfeiture_posture CLEAR."]

  - method: GET
    path: "/plans/{plan_id}"
    description: "Read one plan, including every computed share and cash counter and the current version."
    roles: [PlanSponsor, Trustee, PlanAdministrator, Appraiser, Participant]
    code: 200
    input: []
    output: EsopPlan
    side_effects: []

  - method: POST
    path: "/plans/{plan_id}/close-year"
    description: "Close the plan year for contributions and move the plan to VALUATION_PENDING."
    roles: [PlanSponsor]
    code: 200
    input: []
    output: EsopPlan
    side_effects: ["plan_status OPEN -> VALUATION_PENDING", "increments EsopPlan.version by 1"]

  - method: POST
    path: "/plans/{plan_id}/rollover"
    description: "Advance the plan to the next plan year and reopen it for contributions."
    roles: [PlanSponsor]
    code: 200
    input: []
    output: EsopPlan
    side_effects: ["plan_status ALLOCATION_LOCKED -> OPEN", "plan_year increased by 1", "every Participant's diversification_first_eligible_plan_year and diversification_eligible recomputed", "increments EsopPlan.version by 1"]

  - method: POST
    path: "/plans/{plan_id}/freeze"
    description: "Freeze the plan. Terminal; every mutating child operation is refused afterwards."
    roles: [Trustee]
    code: 200
    input: [reason]
    output: EsopPlan
    side_effects: ["plan_status -> FROZEN", "open valuations rejected, draft runs voided, requested elections denied, their scheduled installments cancelled, pending put exercises deferred", "increments EsopPlan.version by 1"]

  - method: POST
    path: "/plans/{plan_id}/repurchase-funding"
    description: "Deposit cash into the repurchase reserve."
    roles: [Trustee]
    code: 200
    input: [amount_cents]
    output: EsopPlan
    side_effects: ["repurchase_reserve_cents and cumulative_repurchase_funding_cents each increased by amount_cents", "repurchase_posture recomputed; a return to FUNDED sets every DEFERRED put exercise of the plan back to PENDING", "increments EsopPlan.version by 1"]

  - method: POST
    path: "/plans/{plan_id}/repurchase-sweeps"
    description: "Run repurchase_funding_waterfall over the plan's open put option exercises."
    roles: [Trustee]
    code: 200
    input: []
    output: "{ funded_count: integer, deferred_count: integer, funded_cents_total: integer, reserve_after_cents: integer, sweep_mode_applied: string, stopped_at_exercise_id: string }"
    side_effects: ["matching PutOptionExercise rows moved to FUNDED or DEFERRED", "repurchase_reserve_cents and committed_repurchase_cents adjusted", "increments EsopPlan.version by 1"]

  - method: GET
    path: "/plans/{plan_id}/repurchase-forecast"
    description: "Computed read returning repurchase_obligation_forecast for the plan."
    roles: [PlanSponsor, Trustee, PlanAdministrator]
    code: 200
    input: ["horizon_years?"]
    output: "{ horizon_years: integer, participant_count: integer, projected_obligation_cents: integer, committed_repurchase_cents: integer, reserve_cents: integer, coverage_bps: integer }"
    side_effects: []

  # ----------------------------------------------------------- participants
  - method: POST
    path: "/participants"
    description: "Enrol a participant in a plan. Allowed only while the plan is OPEN."
    roles: [PlanSponsor]
    code: 201
    input: [plan_id, employee_number, date_of_birth, hire_date, "eligible_compensation_cents?", "annual_hours?"]
    output: Participant
    side_effects: ["Participant created ACTIVE with diversification_first_eligible_plan_year and diversification_eligible computed."]

  - method: GET
    path: "/participants/{participant_id}"
    description: "Read one participant."
    roles: [PlanSponsor, Trustee, PlanAdministrator, Appraiser, Participant]
    code: 200
    input: []
    output: Participant
    side_effects: []

  - method: GET
    path: "/participants"
    description: "List participants, filterable by plan and status. Results are ordered by created_at ascending. No list ordering, selector, tie-break or allocation order anywhere in this scaffold reads id."
    roles: [PlanSponsor, Trustee, PlanAdministrator, Appraiser, Participant]
    code: 200
    input: ["plan_id?", "status?", "limit?", "offset?"]
    output: Participant[]
    side_effects: []

  - method: PATCH
    path: "/participants/{participant_id}"
    description: "Update plan-year payroll facts. Allowed only while the plan is OPEN."
    roles: [PlanSponsor]
    code: 200
    input: ["eligible_compensation_cents?", "annual_hours?"]
    output: Participant
    side_effects: []

  - method: POST
    path: "/participants/{participant_id}/terminate"
    description: "Record a separation. Drives the branching Participant machine and, on the TERMINATION and DISABILITY branches, the four-hop forfeiture cascade."
    roles: [PlanSponsor]
    code: 200
    input: [termination_date, termination_reason]
    output: Participant
    side_effects: ["participant_vested_percentage runs", "ForfeitureEvent created on the TERMINATION branch when vested_percentage < 100", "EsopPlan.unallocated_forfeiture_shares, allocated_shares_total and forfeiture_posture updated", "increments EsopPlan.version by 1"]

  # -------------------------------------------------------------- valuations
  - method: POST
    path: "/valuations"
    description: "Submit an independent appraisal. Optimistic concurrency on the plan is mandatory."
    roles: [Appraiser]
    code: 201
    input: [plan_id, plan_year, enterprise_value_cents, debt_outstanding_cents, non_operating_assets_cents, control_premium_bps, marketability_discount_bps, effective_from_date, effective_to_date, expected_plan_version, "supersedes_valuation_id?"]
    output: Valuation
    side_effects: ["valuation_share_price runs", "appraiser_user_id stamped from X-User-ID", "any valuation named by supersedes_valuation_id moves to SUPERSEDED", "EsopPlan.open_valuation_count increased by 1", "increments EsopPlan.version by 1"]

  - method: GET
    path: "/valuations/{valuation_id}"
    description: "Read one valuation."
    roles: [PlanSponsor, Trustee, PlanAdministrator, Appraiser, Participant]
    code: 200
    input: []
    output: Valuation
    side_effects: []

  - method: GET
    path: "/valuations"
    description: "List valuations, filterable by plan, plan year, status and the valuation they supersede. Results are ordered by created_at ascending."
    roles: [PlanSponsor, Trustee, PlanAdministrator, Appraiser, Participant]
    code: 200
    input: ["plan_id?", "plan_year?", "status?", "supersedes_valuation_id?", "limit?", "offset?"]
    output: Valuation[]
    side_effects: []

  - method: POST
    path: "/valuations/{valuation_id}/challenge"
    description: "Trustee challenges an appraisal, sending it back for revision."
    roles: [Trustee]
    code: 200
    input: [challenge_note]
    output: Valuation
    side_effects: ["status SUBMITTED -> CHALLENGED", "challenge_round increased by 1"]

  - method: POST
    path: "/valuations/{valuation_id}/resubmit"
    description: "Original appraiser revises a challenged appraisal, closing the revision cycle."
    roles: [Appraiser]
    code: 200
    input: [enterprise_value_cents, debt_outstanding_cents, non_operating_assets_cents, control_premium_bps, marketability_discount_bps]
    output: Valuation
    side_effects: ["status CHALLENGED -> SUBMITTED", "valuation_share_price re-runs"]

  - method: POST
    path: "/valuations/{valuation_id}/approve"
    description: "Trustee approves an appraisal. Refused when the approver is the appraiser."
    roles: [Trustee]
    code: 200
    input: []
    output: Valuation
    side_effects: ["status SUBMITTED -> APPROVED", "EsopPlan.current_share_price_cents set", "sibling open valuations for the same plan year moved to SUPERSEDED", "EsopPlan.open_valuation_count decreased", "increments EsopPlan.version by 1"]

  - method: POST
    path: "/valuations/{valuation_id}/reject"
    description: "Trustee rejects an appraisal outright."
    roles: [Trustee]
    code: 200
    input: [reason]
    output: Valuation
    side_effects: ["status -> REJECTED", "EsopPlan.open_valuation_count decreased by 1", "increments EsopPlan.version by 1"]

  # ------------------------------------------------------------- esop loans
  - method: POST
    path: "/esop-loans"
    description: "Record a leveraged share purchase. Adds the pledged shares to the trust and to suspense."
    roles: [PlanSponsor]
    code: 201
    input: [plan_id, lender_name, original_principal_cents, original_interest_cents, shares_pledged, release_method]
    output: EsopLoan
    side_effects: ["EsopPlan.total_plan_shares and suspense_shares each increased by shares_pledged", "increments EsopPlan.version by 1"]

  - method: GET
    path: "/esop-loans/{loan_id}"
    description: "Read one loan."
    roles: [PlanSponsor, Trustee, PlanAdministrator, Appraiser, Participant]
    code: 200
    input: []
    output: EsopLoan
    side_effects: []

  - method: GET
    path: "/esop-loans"
    description: "List loans, filterable by plan and status. Results are ordered by created_at ascending."
    roles: [PlanSponsor, Trustee, PlanAdministrator, Appraiser, Participant]
    code: 200
    input: ["plan_id?", "status?", "limit?", "offset?"]
    output: EsopLoan[]
    side_effects: []

  - method: POST
    path: "/loan-payments"
    description: "Service a leveraged loan and release shares from suspense under the loan's declared method."
    roles: [PlanAdministrator]
    code: 201
    input: [loan_id, payment_date, principal_cents, interest_cents]
    output: LoanPayment
    side_effects: ["loan_share_release runs", "EsopLoan balances, suspense_shares and released_shares_cumulative updated; status flips to REPAID when principal reaches 0", "EsopPlan.suspense_shares decreased and unallocated_released_shares increased by released_shares", "increments EsopPlan.version by 1"]

  - method: GET
    path: "/loan-payments/{payment_id}"
    description: "Read one loan payment."
    roles: [PlanSponsor, Trustee, PlanAdministrator, Appraiser, Participant]
    code: 200
    input: []
    output: LoanPayment
    side_effects: []

  - method: GET
    path: "/loan-payments"
    description: "List loan payments, filterable by loan. Results are ordered by created_at ascending, which is also the order in which they were applied to the loan."
    roles: [PlanSponsor, Trustee, PlanAdministrator, Appraiser, Participant]
    code: 200
    input: ["loan_id?", "limit?", "offset?"]
    output: LoanPayment[]
    side_effects: []

  # --------------------------------------------------------- allocation runs
  - method: POST
    path: "/allocation-runs"
    description: "Open a draft allocation run for a plan year. Optimistic concurrency on the plan is mandatory."
    roles: [PlanAdministrator]
    code: 201
    input: [plan_id, valuation_id, plan_year, contributed_shares, expected_plan_version]
    output: AllocationRun
    side_effects: ["AllocationRun created DRAFT with created_by_user_id stamped from X-User-ID", "EsopPlan.draft_run_count increased by 1", "increments EsopPlan.version by 1"]

  - method: GET
    path: "/allocation-runs/{run_id}"
    description: "Read one allocation run, including every computed pass statistic."
    roles: [PlanSponsor, Trustee, PlanAdministrator, Appraiser, Participant]
    code: 200
    input: []
    output: AllocationRun
    side_effects: []

  - method: GET
    path: "/allocation-runs"
    description: "List allocation runs, filterable by plan, valuation and status. Results are ordered by created_at ascending."
    roles: [PlanSponsor, Trustee, PlanAdministrator, Appraiser, Participant]
    code: 200
    input: ["plan_id?", "valuation_id?", "status?", "limit?", "offset?"]
    output: AllocationRun[]
    side_effects: []

  - method: POST
    path: "/allocation-runs/{run_id}/finalize"
    description: "Execute allocation_pool_distribution and annual_additions_cap_reallocation and lock the plan year. Refused when the finalizer created the run."
    roles: [PlanAdministrator]
    code: 200
    input: []
    output: AllocationRun
    side_effects: ["ShareAllocation rows created", "Participant.allocated_shares and vested_shares updated", "ForfeitureEvents marked REALLOCATED", "ParticipantStatement rows created via statement_snapshot", "EsopPlan share counters, forfeiture_posture and plan_status updated", "increments EsopPlan.version by 1"]

  - method: POST
    path: "/allocation-runs/{run_id}/void"
    description: "Void a run. On a FINALIZED run this is the compensating action that reverses every allocation side effect."
    roles: [Trustee]
    code: 200
    input: [reason]
    output: AllocationRun
    side_effects: ["on a FINALIZED run: allocations reversed, forfeitures reopened, statements deleted, plan share counters restored and plan_status returned to VALUATION_PENDING", "increments EsopPlan.version by 1"]

  - method: GET
    path: "/share-allocations/{allocation_id}"
    description: "Read one allocation line."
    roles: [PlanSponsor, Trustee, PlanAdministrator, Appraiser, Participant]
    code: 200
    input: []
    output: ShareAllocation
    side_effects: []

  - method: GET
    path: "/share-allocations"
    description: "List allocation lines, filterable by run and participant. Sole discovery channel for these cascade-created rows. Results are ordered by created_at ascending, which mirrors the eligible-set order the run used."
    roles: [PlanSponsor, Trustee, PlanAdministrator, Appraiser, Participant]
    code: 200
    input: ["allocation_run_id?", "participant_id?", "limit?", "offset?"]
    output: ShareAllocation[]
    side_effects: []

  - method: GET
    path: "/forfeiture-events/{forfeiture_id}"
    description: "Read one forfeiture event."
    roles: [PlanSponsor, Trustee, PlanAdministrator, Appraiser, Participant]
    code: 200
    input: []
    output: ForfeitureEvent
    side_effects: []

  - method: GET
    path: "/forfeiture-events"
    description: "List forfeiture events, filterable by participant, plan, sweeping run and status. Sole discovery channel for these cascade-created rows. Results are ordered by created_at ascending."
    roles: [PlanSponsor, Trustee, PlanAdministrator, Appraiser, Participant]
    code: 200
    input: ["participant_id?", "plan_id?", "reallocated_in_run_id?", "status?", "limit?", "offset?"]
    output: ForfeitureEvent[]
    side_effects: []

  # --------------------------------------------------- distributions and puts
  - method: POST
    path: "/distribution-elections"
    description: "Raise a distribution or diversification election."
    roles: [Participant, PlanAdministrator]
    code: 201
    input: [participant_id, election_type, requested_shares]
    output: DistributionElection
    side_effects: ["DistributionElection created with approval_status REQUESTED and payment_status NOT_STARTED", "for DIVERSIFICATION, diversification_eligibility_window runs and writes diversification_year_index and diversification_cap_percent"]

  - method: GET
    path: "/distribution-elections/{election_id}"
    description: "Read one election, including both independent state dimensions."
    roles: [PlanSponsor, Trustee, PlanAdministrator, Appraiser, Participant]
    code: 200
    input: []
    output: DistributionElection
    side_effects: []

  - method: GET
    path: "/distribution-elections"
    description: "List elections, filterable by participant, type and either state dimension. Results are ordered by created_at ascending."
    roles: [PlanSponsor, Trustee, PlanAdministrator, Appraiser, Participant]
    code: 200
    input: ["participant_id?", "election_type?", "approval_status?", "payment_status?", "limit?", "offset?"]
    output: DistributionElection[]
    side_effects: []

  - method: POST
    path: "/distribution-elections/{election_id}/commence"
    description: "Approve an election and build its installment schedule. Moves dimension A only."
    roles: [PlanAdministrator]
    code: 200
    input: []
    output: DistributionElection
    side_effects: ["approval_status REQUESTED -> APPROVED", "installment_schedule_build creates the InstallmentPayment rows", "payment_status deliberately unchanged"]

  - method: GET
    path: "/installment-payments/{installment_id}"
    description: "Read one installment."
    roles: [PlanSponsor, Trustee, PlanAdministrator, Appraiser, Participant]
    code: 200
    input: []
    output: InstallmentPayment
    side_effects: []

  - method: GET
    path: "/installment-payments"
    description: "List installments, filterable by election and status. Sole discovery channel for these cascade-created rows. Results are ordered by sequence_number ascending within an election, and by created_at ascending across elections."
    roles: [PlanSponsor, Trustee, PlanAdministrator, Appraiser, Participant]
    code: 200
    input: ["distribution_election_id?", "status?", "limit?", "offset?"]
    output: InstallmentPayment[]
    side_effects: []

  - method: POST
    path: "/installment-payments/{installment_id}/pay"
    description: "Deliver an installment's shares and open a put option window on the participant."
    roles: [PlanAdministrator]
    code: 200
    input: []
    output: InstallmentPayment
    side_effects: ["put_window_cooling_buffer runs and opens the window", "Participant share counters updated", "EsopPlan.total_plan_shares and allocated_shares_total decreased", "election payment_status advances along dimension B; the participant may cascade to DISTRIBUTED", "increments EsopPlan.version by 1"]

  - method: POST
    path: "/put-option-exercises"
    description: "Participant puts delivered shares back to the plan inside the open window."
    roles: [Participant]
    code: 201
    input: [distribution_election_id, shares_tendered]
    output: PutOptionExercise
    side_effects: ["PutOptionExercise created PENDING with window dates, price, amount and priority_class stamped", "Participant.tendered_shares_cumulative increased by shares_tendered"]

  - method: GET
    path: "/put-option-exercises/{exercise_id}"
    description: "Read one put option exercise."
    roles: [PlanSponsor, Trustee, PlanAdministrator, Appraiser, Participant]
    code: 200
    input: []
    output: PutOptionExercise
    side_effects: []

  - method: GET
    path: "/put-option-exercises"
    description: "List put option exercises, filterable by participant, election and status. Results are ordered by created_at ascending, the same order repurchase_funding_waterfall uses as its final tie-break."
    roles: [PlanSponsor, Trustee, PlanAdministrator, Appraiser, Participant]
    code: 200
    input: ["participant_id?", "distribution_election_id?", "status?", "limit?", "offset?"]
    output: PutOptionExercise[]
    side_effects: []

  - method: POST
    path: "/put-option-exercises/{exercise_id}/fund"
    description: "Commit reserve cash against one exercise. May drive the plan UNDERFUNDED and defer every sibling."
    roles: [Trustee]
    code: 200
    input: []
    output: PutOptionExercise
    side_effects: ["status -> FUNDED", "reserve decreased and committed increased", "repurchase_posture recomputed; an UNDERFUNDED result defers every PENDING sibling exercise", "increments EsopPlan.version by 1"]

  - method: POST
    path: "/put-option-exercises/{exercise_id}/cancel"
    description: "Cancel an exercise. On a FUNDED exercise this is the compensating action that returns the cash to the reserve."
    roles: [Trustee, Participant]
    code: 200
    input: [reason]
    output: PutOptionExercise
    side_effects: ["status -> CANCELLED", "committed cash returned to the reserve when the exercise was FUNDED", "Participant.tendered_shares_cumulative decreased", "repurchase_posture recomputed; a return to FUNDED restores every DEFERRED sibling to PENDING", "increments EsopPlan.version by 1"]

  - method: POST
    path: "/put-option-exercises/{exercise_id}/settle"
    description: "Settle a funded exercise: cash leaves the committed bucket and the shares return to the trust."
    roles: [Trustee]
    code: 200
    input: []
    output: PutOptionExercise
    side_effects: ["status FUNDED -> SETTLED", "committed_repurchase_cents decreased and cumulative_repurchase_settled_cents increased", "reacquired_shares and total_plan_shares each increased by shares_tendered", "increments EsopPlan.version by 1"]

