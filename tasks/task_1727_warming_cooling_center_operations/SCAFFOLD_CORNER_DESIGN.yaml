            - "No stays were ever created: GET /api/stays?transport_dispatch_id total_count == 0"
  - section: complexity_layers
    instances:
      - name: occ_episode_extension_stale_version_rejected
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[episode-extend-stale-version]"]
        distinguishing_aspect: "OCC on Episode.version: a first extension with the observed version succeeds and bumps the version; a second extension replaying the same observed version fails 412 ERR_STALE_VERSION — two strictly sequential requests, no parallelism."
        test_recipe:
          setup: ["Episode ACTIVE; client observed version ep_v"]
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T08:00:00Z" }, as: EOCManager }
            - call: "POST /api/episodes"
              payload: { mode: "COOLING", threshold_f: 100.0, sustained_hours_required: 1, scheduled_end_at: "2026-08-12T00:00:00Z" }
              as: EOCManager
              captures: { ep: $.data.id }
            - { call: "POST /api/episodes/${ep}/weather-readings", payload: { observed_at: "2026-08-10T06:00:00Z", temp_f: 95.0, heat_index_f: 101.0 }, as: EOCManager }
            - { call: "POST /api/episodes/${ep}/weather-readings", payload: { observed_at: "2026-08-10T06:15:00Z", temp_f: 95.0, heat_index_f: 101.0 }, as: EOCManager }
            - { call: "POST /api/episodes/${ep}/weather-readings", payload: { observed_at: "2026-08-10T06:30:00Z", temp_f: 95.0, heat_index_f: 101.0 }, as: EOCManager }
            - { call: "POST /api/episodes/${ep}/weather-readings", payload: { observed_at: "2026-08-10T06:45:00Z", temp_f: 95.0, heat_index_f: 101.0 }, as: EOCManager }
            - { call: "POST /api/episodes/${ep}/weather-readings", payload: { observed_at: "2026-08-10T07:00:00Z", temp_f: 95.0, heat_index_f: 101.0 }, as: EOCManager }
            - call: "POST /api/sites"
              payload: { name: "Rec Center", address: "1 Main St", bed_capacity: 4, pet_capacity: 0, locker_capacity: 0 }
              as: EOCManager
              captures: { site: $.data.id }
            - { call: "POST /api/episodes/${ep}/site-activations", payload: { site_id: "${site}" }, as: EOCManager }
            - { call: "POST /api/episodes/${ep}/evaluate", payload: {}, as: EOCManager }
            - { call: "POST /api/episodes/${ep}/activate", payload: {}, as: EOCManager }
            - call: "GET /api/episodes/${ep}"
              as: EOCManager
              captures: { ep_v: $.data.version }
          trigger:
            - call: "POST /api/episodes/${ep}/extensions"
              payload: { new_scheduled_end_at: "2026-08-13T00:00:00Z", expected_episode_version: "${ep_v}" }
              as: EOCManager
              captures: { ec: $.data.extension_count }
            - call: "POST /api/episodes/${ep}/extensions"
              payload: { new_scheduled_end_at: "2026-08-14T00:00:00Z", expected_episode_version: "${ep_v}" }
              as: EOCManager
              captures: { err: $.data.error_id }
          assert:
            - "First extension with the observed version succeeds: extension_count == 1"
            - "Second extension replaying the same stale version: error_id == ERR_STALE_VERSION, http 412"
            - "GET /api/episodes/${ep}: scheduled_end_at == 2026-08-13T00:00:00Z, extension_count == 1"
      - name: occ_site_patch_stale_version_rejected
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[site-capacity-amend-stale-version]"]
        distinguishing_aspect: "OCC on Site.version: two sequential PATCHes carrying the same observed version — the first succeeds (version bumps), the second fails 412 ERR_STALE_VERSION."
        test_recipe:
          setup: ["Site registered; client observed version site_v at creation"]
          setup_api_calls:
            - call: "POST /api/sites"
              payload: { name: "Rec Center", address: "1 Main St", bed_capacity: 4, pet_capacity: 0, locker_capacity: 0 }
              as: EOCManager
              captures: { site: $.data.id, site_v: $.data.version }
          trigger:
            - call: "PATCH /api/sites/${site}"
              payload: { bed_capacity: 6, expected_site_version: "${site_v}" }
              as: EOCManager
              captures: { cap: $.data.bed_capacity }
            - call: "PATCH /api/sites/${site}"
              payload: { bed_capacity: 8, expected_site_version: "${site_v}" }
              as: EOCManager
              captures: { err: $.data.error_id }
          assert:
            - "First PATCH succeeds: bed_capacity == 6"
            - "Second PATCH with the stale version: error_id == ERR_STALE_VERSION, http 412; bed_capacity remains 6"
      - name: rate_threshold_trigger_covered
        claim_type: boundary
        grounds: [calculations.breach_run_evaluation]
        excluded_because:
          difficulty_instance: "boundary_precision_check / heat_index_exactly_at_threshold_and_exactly_sustained_qualifies"
          rationale: "Threshold and duration boundaries asserted by the named §1.8 instance; gap semantics covered by §1.9 breach_gap_exactly_15_keeps_run_16_breaks_it."
      - name: cascading_side_effects_covered
        claim_type: side_effect_execution
        grounds: [state_machines.Episode.ACTIVE_to_DEACTIVATING]
        excluded_because:
          difficulty_instance: "transitive_cascade / deactivation_cascade_episode_site_stay_dispatch"
          rationale: "The depth-3 deactivation chain is asserted end-to-end by the named §1.8 instance; §1.9 separately covers the OPENING-site conditional branch."
