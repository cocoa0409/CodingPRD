        distinguishing_aspect: "A CLOSED window passes the priority 17 state check but, having closed with zero condition-level findings, fails the priority 32 flag check with ERR_FOLLOW_UP_NOT_REQUIRED; command_center_state was already DEMOBILIZED by the close."
        test_recipe:
