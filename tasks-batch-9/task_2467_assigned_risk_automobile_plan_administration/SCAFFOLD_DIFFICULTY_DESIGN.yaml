          to Atlas's assigned_risk_count; the compensating rescission must remove exactly that unit,
          so the sum of assigned_risk_count over all carriers equals the number of non-terminal
          Assignment rows (0) again, quota_variance_units returns to -1.0 and posture to OPEN. The
          historical AssignmentCycle.assigned_count is deliberately NOT compensated — it records
