scaffold_difficulty_design:
  # =========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: reimbursable_forward_vs_chronological_on_hsa_claim
        grounds:
          - calculations.Reimbursable-Amount
          - state_machines.Claim.SUBMITTED_to_APPROVED
          - state_machines.Claim.APPROVED_to_REIMBURSED
          - validations[priority=15]
        distinguishing_aspect: |
          On a Claim against an underfunded HSA, the forward-looking APPROVE variant sets
          reimbursable_amount_cents=150000 (ceiling = elected_amount_cents 437500), but the
          chronological disburse variant re-evaluates against cash-on-hand 100000 and rejects
          with ERR_INSUFFICIENT_FUNDS — two valid algorithms, different results, on the Claim/HSA
          cost domain.
        test_recipe:
          setup:
            - "PY2026 plan year exists with hsa_individual_cap_cents=437500, hsa_family_cap_cents=865000, hsa_catchup_cents=100000."
            - "Participant P (born 1990, hdhp_covered=true) has an ACTIVE self-only HSA with one POSTED contribution of 100000 cents (contributed=100000, available=100000), elected target 437500."
            - "A SUBMITTED, substantiated MEDICAL claim for 150000 cents exists on the HSA."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlanAdmin
            - call: "POST /plan-years"
              payload: { label: "PY2026", coverage_start: "2026-01-01", coverage_end: "2026-12-31", run_out_end: "2027-03-31", hsa_individual_cap_cents: 437500, hsa_family_cap_cents: 865000, hsa_catchup_cents: 100000, health_fsa_cap_cents: 335000, dcfsa_cap_joint_cents: 500000, dcfsa_cap_separate_cents: 250000 }
              as: PlanAdmin
              captures: { py_id: $.data.id }
            - call: "POST /participants"
              payload: { email: "p@x.com", full_name: "P One", birth_date: "1990-04-10", hdhp_covered: true }
              as: PlanAdmin
              captures: { p_id: $.data.id }
            - call: "POST /accounts"
              payload: { participant_id: "${p_id}", plan_year_id: "${py_id}", account_type: "HSA", coverage_tier: "SELF_ONLY", elected_amount_cents: 437500 }
              as: PlanAdmin
              captures: { acc_id: $.data.id }
            - call: "POST /accounts/${acc_id}/activate"
              payload: {}
              as: PlanAdmin
              captures: { acc_v1: $.data.version }
            - call: "POST /accounts/${acc_id}/contributions"
              payload: { amount_cents: 100000, source: "PAYROLL", posted_at: "2026-02-01T00:00:00Z", expected_account_version: "${acc_v1}" }
              as: PlanAdmin
            - call: "POST /claims"
              payload: { account_id: "${acc_id}", service_date: "2026-03-01", expense_category: "MEDICAL", claimed_amount_cents: 150000, substantiated: true }
              as: PlanAdmin
              captures: { claim_id: $.data.id }
          trigger:
            - call: "POST /claims/${claim_id}/adjudicate"
              payload: { decision: "APPROVE" }
              as: Adjudicator
              as_user_id: "adj-1"
              captures: { reimb: $.data.reimbursable_amount_cents }
            - call: "POST /reimbursement-batches"
              payload: { participant_id: "${p_id}", claim_ids: ["${claim_id}"] }
              as: FundDisburser
              as_user_id: "disb-1"
              captures: { batch_id: $.data.id }
            - call: "GET /accounts/${acc_id}"
              payload: {}
              as: FundDisburser
              captures: { acc_v2: $.data.version }
            - call: "POST /reimbursement-batches/${batch_id}/disburse"
              payload: { expected_account_version: "${acc_v2}" }
              as: FundDisburser
              as_user_id: "disb-1"
          assert:
            - "Claim.${claim_id}.reimbursable_amount_cents == 150000 after APPROVE (forward-looking ceiling = elected 437500)"
            - "POST /reimbursement-batches/${batch_id}/disburse returns 422 ERR_INSUFFICIENT_FUNDS (cash-on-hand 100000 < 150000)"
            - "Claim.${claim_id}.status == APPROVED (unchanged; disburse rejected)"

      - name: settlement_carryover_vs_forfeit_on_health_fsa_account
        grounds:
          - calculations.Year-End-Settlement
          - state_machines.Account.ACTIVE_to_CLOSED
          - entities.Account.fields.forfeited_cents
          - entities.Account.fields.carried_in_cents
        distinguishing_aspect: |
          On the Account settlement domain (not the Claim cost domain of the sibling instance), the
          CARRYOVER variant splits an unused 135000 into carryover_out=66000 + forfeited=69000, whereas
          the strict/NONE variant forfeits the entire 135000 — two valid year-end algorithms producing
          different forfeited_cents on the HEALTH_FSA Account.
        test_recipe:
          setup:
            - "PY-CARRY plan year (fsa_relief_mode=CARRYOVER, carryover_cap_cents=66000) and PY2027 destination year exist."
            - "Participant P has an ACTIVE HEALTH_FSA under PY-CARRY with elected 335000 and 200000 already reimbursed, so available_balance_cents=135000."
            - "Clock advanced past the filing deadline (2027-04-01)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlanAdmin
            - call: "POST /plan-years"
              payload: { label: "PY-CARRY", coverage_start: "2026-01-01", coverage_end: "2026-12-31", run_out_end: "2027-03-31", fsa_relief_mode: "CARRYOVER", carryover_cap_cents: 66000, hsa_individual_cap_cents: 437500, hsa_family_cap_cents: 865000, hsa_catchup_cents: 100000, health_fsa_cap_cents: 335000, dcfsa_cap_joint_cents: 500000, dcfsa_cap_separate_cents: 250000 }
              as: PlanAdmin
              captures: { py_id: $.data.id }
            - call: "POST /participants"
              payload: { email: "carry@x.com", full_name: "Carry P", birth_date: "1985-01-01" }
              as: PlanAdmin
              captures: { p_id: $.data.id }
            - call: "POST /accounts"
              payload: { participant_id: "${p_id}", plan_year_id: "${py_id}", account_type: "HEALTH_FSA", elected_amount_cents: 335000, auto_adjudication_threshold_cents: 1000000 }
              as: PlanAdmin
              captures: { acc_id: $.data.id }
            - call: "POST /accounts/${acc_id}/activate"
              payload: {}
              as: PlanAdmin
            - call: "POST /claims"
              payload: { account_id: "${acc_id}", service_date: "2026-05-01", expense_category: "MEDICAL", claimed_amount_cents: 200000, substantiated: true }
              as: PlanAdmin
              captures: { claim_id: $.data.id }
            - call: "POST /claims/${claim_id}/adjudicate"
              payload: { decision: "APPROVE" }
              as: Adjudicator
              as_user_id: "adj-1"
            - call: "POST /reimbursement-batches"
              payload: { participant_id: "${p_id}", claim_ids: ["${claim_id}"] }
              as: FundDisburser
              as_user_id: "disb-1"
              captures: { batch_id: $.data.id }
            - call: "GET /accounts/${acc_id}"
              payload: {}
              as: FundDisburser
              captures: { acc_v: $.data.version }
            - call: "POST /reimbursement-batches/${batch_id}/disburse"
              payload: { expected_account_version: "${acc_v}" }
              as: FundDisburser
              as_user_id: "disb-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-04-01T00:00:00Z" }
              as: PlanAdmin
          trigger:
            - call: "POST /plan-years/${py_id}/settle"
              payload: {}
              as: PlanAdmin
            - call: "GET /accounts/${acc_id}"
              payload: {}
              as: PlanAdmin
              captures: { forf: $.data.forfeited_cents }
          assert:
            - "Account.${acc_id}.forfeited_cents == 69000 (CARRYOVER variant: 135000 - min(135000,66000))"
            - "Account.${acc_id}.funding_status == CLOSED"
            - "GET /accounts?carryover_source_account_id=${acc_id} returns exactly one Account with carried_in_cents == 66000"

  # =========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: hsa_cap_family_plus_catchup_mode_a
        grounds:
          - calculations.HSA-Contribution-Cap
          - validations[priority=12]
          - entities.Account.fields.coverage_tier
        distinguishing_aspect: |
          Mode (a): the HSA cap is a >=3-input non-linear formula — coverage_tier selects family vs
          individual base (865000), an age>=55 conditional adds catchup (100000), and the prospective
          sum (contributed 900000 + new 65001) is compared to allowed 965000. The branch interaction
          (tier x age x running sum) makes 965001 reject while 965000 passes.
        test_recipe:
          setup:
            - "PY2026 exists with hsa_family_cap_cents=865000, hsa_catchup_cents=100000."
            - "Participant born 1968 (age 58 at 2026-12-31) has an ACTIVE FAMILY HSA with contributed_cents=900000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlanAdmin
            - call: "POST /plan-years"
              payload: { label: "PY2026", coverage_start: "2026-01-01", coverage_end: "2026-12-31", run_out_end: "2027-03-31", hsa_individual_cap_cents: 437500, hsa_family_cap_cents: 865000, hsa_catchup_cents: 100000, health_fsa_cap_cents: 335000, dcfsa_cap_joint_cents: 500000, dcfsa_cap_separate_cents: 250000 }
              as: PlanAdmin
              captures: { py_id: $.data.id }
            - call: "POST /participants"
              payload: { email: "old@x.com", full_name: "Old P", birth_date: "1968-03-01", hdhp_covered: true }
              as: PlanAdmin
              captures: { p_id: $.data.id }
            - call: "POST /accounts"
              payload: { participant_id: "${p_id}", plan_year_id: "${py_id}", account_type: "HSA", coverage_tier: "FAMILY", elected_amount_cents: 965000 }
              as: PlanAdmin
              captures: { acc_id: $.data.id }
            - call: "POST /accounts/${acc_id}/activate"
              payload: {}
              as: PlanAdmin
              captures: { acc_v1: $.data.version }
            - call: "POST /accounts/${acc_id}/contributions"
              payload: { amount_cents: 900000, source: "PAYROLL", posted_at: "2026-02-01T00:00:00Z", expected_account_version: "${acc_v1}" }
              as: PlanAdmin
            - call: "GET /accounts/${acc_id}"
              payload: {}
              as: PlanAdmin
              captures: { acc_v2: $.data.version }
          trigger:
            - call: "POST /accounts/${acc_id}/contributions"
              payload: { amount_cents: 65001, source: "EMPLOYER", posted_at: "2026-03-01T00:00:00Z", expected_account_version: "${acc_v2}" }
              as: PlanAdmin
          assert:
            - "POST /accounts/${acc_id}/contributions with 65001 returns 422 ERR_CONTRIBUTION_CAP_EXCEEDED (900000+65001 > 865000+100000)"
            - "Account.${acc_id}.contributed_cents == 900000 (rejected contribution not counted)"

      - name: settlement_waterfall_order_mode_c
        grounds:
          - calculations.Year-End-Settlement
          - state_machines.Account.ACTIVE_to_CLOSED
          - entities.Account.fields.forfeited_cents
        distinguishing_aspect: |
          Mode (c): the settlement waterfall pins evaluation order — carryover_out = min(unused, cap)
          is computed FIRST, then forfeited_cents = unused - carryover_out depends on that result. With
          unused=200000 and cap=66000 the pinned order yields carryover_out=66000 and forfeited=134000;
          reversing the order (forfeit-first) would be ill-defined, so order is explicit.
        test_recipe:
          setup:
            - "PY-CARRY (CARRYOVER, cap 66000) plan year; Participant has an ACTIVE HEALTH_FSA with available_balance_cents=200000 (elected 335000, reimbursed 135000)."
            - "Clock advanced past 2027-04-01."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlanAdmin
            - call: "POST /plan-years"
              payload: { label: "PY-CARRY", coverage_start: "2026-01-01", coverage_end: "2026-12-31", run_out_end: "2027-03-31", fsa_relief_mode: "CARRYOVER", carryover_cap_cents: 66000, hsa_individual_cap_cents: 437500, hsa_family_cap_cents: 865000, hsa_catchup_cents: 100000, health_fsa_cap_cents: 335000, dcfsa_cap_joint_cents: 500000, dcfsa_cap_separate_cents: 250000 }
              as: PlanAdmin
              captures: { py_id: $.data.id }
            - call: "POST /participants"
              payload: { email: "wf@x.com", full_name: "WF P", birth_date: "1980-01-01" }
              as: PlanAdmin
              captures: { p_id: $.data.id }
            - call: "POST /accounts"
              payload: { participant_id: "${p_id}", plan_year_id: "${py_id}", account_type: "HEALTH_FSA", elected_amount_cents: 335000, auto_adjudication_threshold_cents: 1000000 }
              as: PlanAdmin
              captures: { acc_id: $.data.id }
            - call: "POST /accounts/${acc_id}/activate"
              payload: {}
              as: PlanAdmin
            - call: "POST /claims"
              payload: { account_id: "${acc_id}", service_date: "2026-05-01", expense_category: "DENTAL", claimed_amount_cents: 135000, substantiated: true }
              as: PlanAdmin
              captures: { claim_id: $.data.id }
            - call: "POST /claims/${claim_id}/adjudicate"
              payload: { decision: "APPROVE" }
              as: Adjudicator
              as_user_id: "adj-1"
            - call: "POST /reimbursement-batches"
              payload: { participant_id: "${p_id}", claim_ids: ["${claim_id}"] }
              as: FundDisburser
              as_user_id: "disb-1"
              captures: { batch_id: $.data.id }
            - call: "GET /accounts/${acc_id}"
              payload: {}
              as: FundDisburser
              captures: { acc_v: $.data.version }
            - call: "POST /reimbursement-batches/${batch_id}/disburse"
              payload: { expected_account_version: "${acc_v}" }
              as: FundDisburser
              as_user_id: "disb-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-04-01T00:00:00Z" }
              as: PlanAdmin
          trigger:
            - call: "POST /plan-years/${py_id}/settle"
              payload: {}
              as: PlanAdmin
            - call: "GET /accounts/${acc_id}"
              payload: {}
              as: PlanAdmin
              captures: { forf: $.data.forfeited_cents }
          assert:
            - "Account.${acc_id}.forfeited_cents == 134000 (carryover_out=min(200000,66000)=66000 computed first, then forfeit=200000-66000)"
            - "GET /accounts?carryover_source_account_id=${acc_id} returns one Account with carried_in_cents == 66000"

  # =========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: claim_substantiation_revision_cycle
        grounds:
          - state_machines.Claim.SUBMITTED_to_PENDING_SUBSTANTIATION
          - state_machines.Claim.PENDING_SUBSTANTIATION_to_SUBMITTED
          - state_machines.Claim.SUBMITTED_to_APPROVED
        distinguishing_aspect: |
          The Claim machine is cyclic: SUBMITTED -> PENDING_SUBSTANTIATION (REQUEST_DOCS) ->
          SUBMITTED (resubmit) re-enters the same state, a true A->B->A loop, before a final
          APPROVE — not a linear pipeline.
        test_recipe:
          setup:
            - "Participant P owns an ACTIVE HEALTH_FSA (elected 335000, auto_adjudication_threshold_cents=10000)."
            - "An unsubstantiated MEDICAL claim for 50000 cents (> threshold) is SUBMITTED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlanAdmin
            - call: "POST /plan-years"
              payload: { label: "PY2026", coverage_start: "2026-01-01", coverage_end: "2026-12-31", run_out_end: "2027-03-31", hsa_individual_cap_cents: 437500, hsa_family_cap_cents: 865000, hsa_catchup_cents: 100000, health_fsa_cap_cents: 335000, dcfsa_cap_joint_cents: 500000, dcfsa_cap_separate_cents: 250000 }
              as: PlanAdmin
              captures: { py_id: $.data.id }
            - call: "POST /participants"
              payload: { email: "cyc@x.com", full_name: "Cyc P", birth_date: "1990-01-01" }
              as: PlanAdmin
              captures: { p_id: $.data.id }
            - call: "POST /accounts"
              payload: { participant_id: "${p_id}", plan_year_id: "${py_id}", account_type: "HEALTH_FSA", elected_amount_cents: 335000, auto_adjudication_threshold_cents: 10000 }
              as: PlanAdmin
              captures: { acc_id: $.data.id }
            - call: "POST /accounts/${acc_id}/activate"
              payload: {}
              as: PlanAdmin
            - call: "POST /claims"
              payload: { account_id: "${acc_id}", service_date: "2026-04-01", expense_category: "MEDICAL", claimed_amount_cents: 50000, substantiated: false }
              as: Participant
              as_user_id: "${p_id}"
              captures: { claim_id: $.data.id }
          trigger:
            - call: "POST /claims/${claim_id}/adjudicate"
              payload: { decision: "REQUEST_DOCS" }
              as: Adjudicator
              as_user_id: "adj-1"
            - call: "POST /claims/${claim_id}/resubmit"
              payload: { substantiated: true }
              as: Participant
              as_user_id: "${p_id}"
              captures: { st_after_resubmit: $.data.status }
            - call: "POST /claims/${claim_id}/adjudicate"
              payload: { decision: "APPROVE" }
              as: Adjudicator
              as_user_id: "adj-1"
          assert:
            - "After REQUEST_DOCS Claim.${claim_id}.status == PENDING_SUBSTANTIATION"
            - "After resubmit Claim.${claim_id}.status == SUBMITTED (cycle back) and substantiated == true"
            - "After APPROVE Claim.${claim_id}.status == APPROVED"

      - name: account_parallel_funding_and_compliance_dimensions
        grounds:
          - state_machines.Account.ACTIVE_to_DEPLETED
          - state_machines.Account.CLEAR_to_HELD
          - entities.Account.fields.funding_status
          - entities.Account.fields.compliance_hold
        distinguishing_aspect: |
          The Account row carries two independent dimensions that evolve as separate axes: a single
          disbursement of an unsubstantiated claim that exhausts the balance flips funding_status
          ACTIVE->DEPLETED AND compliance_hold CLEAR->HELD on the same row — two orthogonal axes, not
          one linear chain.
        test_recipe:
          setup:
            - "Participant P owns an ACTIVE HEALTH_FSA, elected 50000, auto_adjudication_threshold_cents=100000 (so an unsubstantiated 50000 claim auto-approves)."
            - "One unsubstantiated MEDICAL claim for 50000 is APPROVED (reimbursable 50000)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlanAdmin
            - call: "POST /plan-years"
              payload: { label: "PY2026", coverage_start: "2026-01-01", coverage_end: "2026-12-31", run_out_end: "2027-03-31", hsa_individual_cap_cents: 437500, hsa_family_cap_cents: 865000, hsa_catchup_cents: 100000, health_fsa_cap_cents: 335000, dcfsa_cap_joint_cents: 500000, dcfsa_cap_separate_cents: 250000 }
              as: PlanAdmin
              captures: { py_id: $.data.id }
            - call: "POST /participants"
              payload: { email: "par@x.com", full_name: "Par P", birth_date: "1990-01-01" }
              as: PlanAdmin
              captures: { p_id: $.data.id }
            - call: "POST /accounts"
              payload: { participant_id: "${p_id}", plan_year_id: "${py_id}", account_type: "HEALTH_FSA", elected_amount_cents: 50000, auto_adjudication_threshold_cents: 100000 }
              as: PlanAdmin
              captures: { acc_id: $.data.id }
            - call: "POST /accounts/${acc_id}/activate"
              payload: {}
              as: PlanAdmin
            - call: "POST /claims"
              payload: { account_id: "${acc_id}", service_date: "2026-04-01", expense_category: "VISION", claimed_amount_cents: 50000, substantiated: false }
              as: Participant
              as_user_id: "${p_id}"
              captures: { claim_id: $.data.id }
            - call: "POST /claims/${claim_id}/adjudicate"
              payload: { decision: "APPROVE" }
              as: Adjudicator
              as_user_id: "adj-1"
            - call: "POST /reimbursement-batches"
              payload: { participant_id: "${p_id}", claim_ids: ["${claim_id}"] }
              as: FundDisburser
              as_user_id: "disb-1"
              captures: { batch_id: $.data.id }
            - call: "GET /accounts/${acc_id}"
              payload: {}
              as: FundDisburser
              captures: { acc_v: $.data.version }
          trigger:
            - call: "POST /reimbursement-batches/${batch_id}/disburse"
              payload: { expected_account_version: "${acc_v}" }
              as: FundDisburser
              as_user_id: "disb-1"
            - call: "GET /accounts/${acc_id}"
              payload: {}
              as: FundDisburser
              captures: { fs: $.data.funding_status, ch: $.data.compliance_hold }
          assert:
            - "Account.${acc_id}.funding_status == DEPLETED (available hit 0)"
            - "Account.${acc_id}.compliance_hold == HELD (unsubstantiated claim reimbursed) — both dimensions changed on one row"

  # =========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: disburse_cascade_depth3_claim_ledger_account_depletion
        grounds:
          - state_machines.Claim.APPROVED_to_REIMBURSED
          - state_machines.Account.ACTIVE_to_DEPLETED
          - calculations.Available-Balance
        distinguishing_aspect: |
          Depth-3 cascade from the disburse trigger: (1) Claim APPROVED->REIMBURSED appends a
          REIMBURSEMENT LedgerEntry; (2) that ledger row drives Available-Balance to recompute
          account.reimbursed_cents/available_balance_cents to 0; (3) the zero balance itself flips
          funding_status ACTIVE->DEPLETED. Each hop is caused by the previous, not by the disburse
          directly.
        test_recipe:
          setup:
            - "Participant P owns an ACTIVE HSA, contributed 100000, available 100000."
            - "One substantiated MEDICAL claim for 100000 is APPROVED (reimbursable 100000)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlanAdmin
            - call: "POST /plan-years"
              payload: { label: "PY2026", coverage_start: "2026-01-01", coverage_end: "2026-12-31", run_out_end: "2027-03-31", hsa_individual_cap_cents: 437500, hsa_family_cap_cents: 865000, hsa_catchup_cents: 100000, health_fsa_cap_cents: 335000, dcfsa_cap_joint_cents: 500000, dcfsa_cap_separate_cents: 250000 }
              as: PlanAdmin
              captures: { py_id: $.data.id }
            - call: "POST /participants"
              payload: { email: "casc@x.com", full_name: "Casc P", birth_date: "1990-01-01", hdhp_covered: true }
              as: PlanAdmin
              captures: { p_id: $.data.id }
            - call: "POST /accounts"
              payload: { participant_id: "${p_id}", plan_year_id: "${py_id}", account_type: "HSA", coverage_tier: "SELF_ONLY", elected_amount_cents: 437500 }
              as: PlanAdmin
              captures: { acc_id: $.data.id }
            - call: "POST /accounts/${acc_id}/activate"
              payload: {}
              as: PlanAdmin
              captures: { acc_v1: $.data.version }
            - call: "POST /accounts/${acc_id}/contributions"
              payload: { amount_cents: 100000, source: "PAYROLL", posted_at: "2026-02-01T00:00:00Z", expected_account_version: "${acc_v1}" }
              as: PlanAdmin
            - call: "POST /claims"
