endpoints:
  # --- Complainant ---
  - { method: POST, path: "/noise-program/complainants", description: "Register a complainant (staff)", roles: [CommunityLiaison, NoiseOfficeAdmin], code: 201, input: [full_name, email, "phone?", address_line, zone_code, "outreach_opt_in?"], output: Complainant, side_effects: ["standing=GOOD_STANDING; counters 0"] }
  - { method: GET, path: "/noise-program/complainants", description: "List complainants", roles: [NoiseOfficeAdmin, NoiseAnalyst, CommunityLiaison, StudyCoordinator, BoardMember], code: 200, input: ["limit?", "offset?", "standing?", "zone_code?"], output: "Complainant[]", side_effects: [] }
  - { method: GET, path: "/noise-program/complainants/{complainantId}", description: "Get a complainant (Complainant role: self only)", roles: [NoiseOfficeAdmin, NoiseAnalyst, CommunityLiaison, StudyCoordinator, BoardMember, Complainant], code: 200, input: [], output: Complainant, side_effects: [] }
  - { method: PATCH, path: "/noise-program/complainants/{complainantId}", description: "Update contact info / opt-in", roles: [CommunityLiaison, NoiseOfficeAdmin], code: 200, input: ["full_name?", "email?", "phone?", "address_line?", "zone_code?", "outreach_opt_in?"], output: Complainant, side_effects: ["increments Complainant.version by 1"] }
  - { method: GET, path: "/noise-program/complainants/{id}/noise-complaints", description: "Complaints of a complainant", roles: [NoiseOfficeAdmin, NoiseAnalyst, CommunityLiaison, StudyCoordinator, BoardMember, Complainant], code: 200, input: ["limit?", "offset?", "status?"], output: "NoiseComplaint[]", side_effects: [] }
  - { method: GET, path: "/noise-program/complainants/{id}/outreach-cases", description: "Outreach cases of a complainant", roles: [CommunityLiaison, NoiseOfficeAdmin], code: 200, input: ["limit?", "offset?", "status?"], output: "OutreachCase[]", side_effects: [] }

  # --- NoiseComplaint ---
  - { method: POST, path: "/noise-program/noise-complaints", description: "File a complaint (Complainant role: complainant_id must equal X-User-ID)", roles: [Complainant, CommunityLiaison], code: 201, input: [complainant_id, occurred_at, channel, disturbance_type, "narrative?"], output: NoiseComplaint, side_effects: ["status=RECEIVED", "complainant counters + complaints_90d recompute -> standing auto-transitions (outreach auto-create on REPEAT/RESTRICTED flip)", "ERR_REPORT_QUARTER_LOCKED if occurred_at falls in a PUBLISHED quarter"] }
  - { method: GET, path: "/noise-program/noise-complaints", description: "List complaints with filters", roles: [NoiseOfficeAdmin, NoiseAnalyst, CommunityLiaison, StudyCoordinator, BoardMember], code: 200, input: ["limit?", "offset?", "complainant_id?", "status?", "quarter?", "correlated_flight_id?", "correlated_event_id?"], output: "NoiseComplaint[]", side_effects: [] }
  - { method: GET, path: "/noise-program/noise-complaints/{complaintId}", description: "Get a complaint (Complainant role: owner only)", roles: [NoiseOfficeAdmin, NoiseAnalyst, CommunityLiaison, StudyCoordinator, BoardMember, Complainant], code: 200, input: [], output: NoiseComplaint, side_effects: [] }
  - { method: POST, path: "/noise-program/noise-complaints/{complaintId}/begin-review", description: "RECEIVED -> UNDER_REVIEW", roles: [NoiseAnalyst], code: 200, input: [], output: NoiseComplaint, side_effects: ["increments NoiseComplaint.version by 1"] }
  - { method: POST, path: "/noise-program/noise-complaints/{complaintId}/request-info", description: "UNDER_REVIEW -> AWAITING_COMPLAINANT", roles: [NoiseAnalyst], code: 200, input: [info_request_note], output: NoiseComplaint, side_effects: ["increments NoiseComplaint.version by 1"] }
  - { method: POST, path: "/noise-program/noise-complaints/{complaintId}/provide-info", description: "AWAITING_COMPLAINANT -> UNDER_REVIEW", roles: [Complainant, CommunityLiaison], code: 200, input: [narrative], output: NoiseComplaint, side_effects: ["increments NoiseComplaint.version by 1"] }
  - { method: POST, path: "/noise-program/noise-complaints/{complaintId}/correlate", description: "UNDER_REVIEW -> CORRELATED; OCC on complaint version; supersedes prior correlation", roles: [NoiseAnalyst], code: 200, input: ["flight_id?", "noise_event_id?", expected_complaint_version], output: NoiseComplaint, side_effects: ["compute correlation_confidence_score (STRICT then RELAXED)", "flight linked_complaint_count adjustments (supersede compensation)", "auto OperatorNotification DRAFT when flight count crosses >= 5", "increments NoiseComplaint.version by 1"] }
  - { method: POST, path: "/noise-program/noise-complaints/{complaintId}/close", description: "Close SUBSTANTIATED (CORRELATED, confidence>=60) or UNSUBSTANTIATED (UNDER_REVIEW|CORRELATED)", roles: [NoiseAnalyst], code: 200, input: [outcome], output: NoiseComplaint, side_effects: ["complainant counters + standing recompute", "UNSUBSTANTIATED from CORRELATED releases flight link count", "increments NoiseComplaint.version by 1"] }
  - { method: POST, path: "/noise-program/noise-complaints/{complaintId}/reopen", description: "CLOSED_* -> REOPENED within 30d, max 3", roles: [Complainant, CommunityLiaison], code: 200, input: [reason], output: NoiseComplaint, side_effects: ["compensation: substantiated_count decrement if applicable", "complainant counters + standing recompute", "increments NoiseComplaint.version by 1"] }
  - { method: POST, path: "/noise-program/noise-complaints/{complaintId}/resume-review", description: "REOPENED -> UNDER_REVIEW", roles: [NoiseAnalyst], code: 200, input: [], output: NoiseComplaint, side_effects: ["increments NoiseComplaint.version by 1"] }
  - { method: POST, path: "/noise-program/noise-complaints/{complaintId}/withdraw", description: "Any non-terminal -> WITHDRAWN", roles: [Complainant, CommunityLiaison], code: 200, input: [], output: NoiseComplaint, side_effects: ["cascade D: linked DRAFT notifications AUTO_CLOSED; operator counters recompute", "complainant counters + standing recompute", "increments NoiseComplaint.version by 1"] }

  # --- FlightOperation ---
  - { method: POST, path: "/noise-program/flight-operations", description: "Register a scheduled flight", roles: [NoiseOfficeAdmin], code: 201, input: [flight_number, operator_id, aircraft_type, engine_class, operation_type, runway_code, scheduled_at, zone_code], output: FlightOperation, side_effects: ["status=SCHEDULED"] }
  - { method: GET, path: "/noise-program/flight-operations", description: "List flights (OperatorRep: forced to own operator_id)", roles: [NoiseOfficeAdmin, NoiseAnalyst, CommunityLiaison, StudyCoordinator, BoardMember, OperatorRep], code: 200, input: ["limit?", "offset?", "operator_id?", "status?", "runway_code?", "quarter?"], output: "FlightOperation[]", side_effects: [] }
  - { method: GET, path: "/noise-program/flight-operations/{flightId}", description: "Get a flight (OperatorRep: own operator only)", roles: [NoiseOfficeAdmin, NoiseAnalyst, CommunityLiaison, StudyCoordinator, BoardMember, OperatorRep], code: 200, input: [], output: FlightOperation, side_effects: [] }
  - { method: PATCH, path: "/noise-program/flight-operations/{flightId}", description: "Record outcome: SCHEDULED -> OPERATED (actual_at required) | CANCELLED | DIVERTED; computes curfew flags once", roles: [NoiseOfficeAdmin], code: 200, input: ["actual_at?", "status?", "exemption_code?"], output: FlightOperation, side_effects: ["compute curfew_movement/curfew_violation at OPERATED (immutable)", "increments FlightOperation.version by 1"] }

  # --- Operator ---
  - { method: POST, path: "/noise-program/operators", description: "Register an operator", roles: [NoiseOfficeAdmin], code: 201, input: [name, iata_code, contact_email], output: Operator, side_effects: ["compliance_standing=GOOD; grace 15"] }
  - { method: GET, path: "/noise-program/operators", description: "List operators", roles: [NoiseOfficeAdmin, NoiseAnalyst, CommunityLiaison, StudyCoordinator, BoardMember], code: 200, input: ["limit?", "offset?", "compliance_standing?"], output: "Operator[]", side_effects: [] }
  - { method: GET, path: "/noise-program/operators/{operatorId}", description: "Get an operator (OperatorRep: self only)", roles: [NoiseOfficeAdmin, NoiseAnalyst, CommunityLiaison, StudyCoordinator, BoardMember, OperatorRep], code: 200, input: [], output: Operator, side_effects: [] }
  - { method: GET, path: "/noise-program/operators/{id}/operator-notifications", description: "Notifications of an operator (OperatorRep: own only)", roles: [NoiseOfficeAdmin, NoiseAnalyst, CommunityLiaison, StudyCoordinator, BoardMember, OperatorRep], code: 200, input: ["limit?", "offset?", "status?"], output: "OperatorNotification[]", side_effects: [] }
  - { method: GET, path: "/noise-program/operators/{operatorId}/compliance-summary", description: "Computed curfew compliance for a quarter (OperatorRep: own only)", roles: [NoiseOfficeAdmin, NoiseAnalyst, CommunityLiaison, StudyCoordinator, BoardMember, OperatorRep], code: 200, input: [quarter], output: { quarter: string, curfew_movements: integer, curfew_violations: integer, score: number, standing: string }, side_effects: ["updates operator.compliance_score_latest and compliance_standing"] }

