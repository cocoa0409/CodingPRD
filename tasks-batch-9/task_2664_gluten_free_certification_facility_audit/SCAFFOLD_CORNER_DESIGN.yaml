        distinguishing_aspect: |
          Review requires UNDER_REVIEW specifically; a DRAFT ingredient that has never been
          submitted cannot be approved directly even when its document set would satisfy the
          reviewer, and review_cycle_count must stay 0.
        test_recipe:
          setup:
            - "One applicant, one supplier and one DRAFT INHERENTLY_GF ingredient whose ALLERGEN_STATEMENT is already VERIFIED, so only the state is wrong."
