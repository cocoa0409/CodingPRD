      # ---- Instance 2: depth>=2 — evaluation file -> petition bubbles up
      - name: tc_evaluation_file_bubbles_petition_ready
        grounds:
          - state_machines.CapacityEvaluation.DRAFT_to_FILED
          - state_machines.Petition.EVALUATION_ORDERED_to_READY_FOR_HEARING
          - entities.Petition.fields.status
