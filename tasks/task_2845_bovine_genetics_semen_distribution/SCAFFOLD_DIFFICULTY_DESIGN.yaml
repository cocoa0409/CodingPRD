      - name: evaluation_superseded_then_reinstated_cycle
        grounds:
          - state_machines.GenomicEvaluation.PUBLISHED_to_SUPERSEDED
          - state_machines.GenomicEvaluation.SUPERSEDED_to_PUBLISHED
          - entities.GenomicEvaluation.fields.supersedes_evaluation_id
          - entities.Sire.fields.published_composite_index
        distinguishing_aspect: |
          Non-linearity on the GENOMIC-EVALUATION entity takes a second CYCLE form on a third entity: a row
          that has been demoted PUBLISHED -> SUPERSEDED can be promoted back SUPERSEDED -> PUBLISHED, which
          demotes the newer row in turn, so Sire.published_composite_index walks 62.37 -> 34.95 -> 62.37
          without any evaluation being deleted or re-created.
        test_recipe:
          setup:
            - "Pedigree-root Sire REG-A exists with no parents, so parent_average_index is 0.00 for all of its evaluations."
            - "Evaluation EV1 (reliability 75, progeny 120) is PUBLISHED with composite_index 62.37."
            - "Evaluation EV2 (reliability 98, progeny 60) is DRAFT with composite_index 34.95."
            - "The logical clock is at its 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /genetics/sires"
              payload: { registration_code: "REG-A", breed: "HOLSTEIN", birth_date: "2020-03-01", acquisition_cost_cents: 0 }
