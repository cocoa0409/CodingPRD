      - name: instrument_veto_fork_rejoins_the_publication_path_after_override
        grounds:
          - state_machines.LegislativeInstrument.ADOPTED_to_VETOED
          - state_machines.LegislativeInstrument.VETOED_to_VETO_OVERRIDDEN
          - state_machines.LegislativeInstrument.VETO_OVERRIDDEN_to_PUBLISHED
          - calculations.motion_vote_outcome
          - calculations.instrument_effective_date
        distinguishing_aspect: |
          The instrument leaves the linear spine at ADOPTED, takes the
          VETOED -> VETO_OVERRIDDEN detour that is reachable only through a
          FOUR_FIFTHS motion, and rejoins the spine at PUBLISHED through a
          REPLACEMENT notice — the first notice was VOIDed by the veto, so the
          publication that ultimately fixes the effective date is not the one
          adoption created. It ends at PUBLISHED (not EFFECTIVE) because the
          computed effective_date 2026-11-16 is still in the future.
        test_recipe:
          setup:
            - "ORD-2026-001 (GENERAL, 1200 characters) adopted at meeting m1 (2026-09-15) and made official when m1's minutes are approved at m2 (2026-10-06); adoption creates an ORDINANCE_FULL_TEXT notice with deadline 2026-10-21."
            - "The presiding officer vetoes it on 2026-10-06, VOIDing that notice."
            - "Meeting m3 (2026-10-08) hears the FOUR_FIFTHS veto-override motion."
          setup_api_calls:
            - call: "POST /clerk/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CityClerk
