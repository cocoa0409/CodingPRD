  - rule_id: non_linear_state_machine
    instances:
      - name: contract_submit_return_revision_cycle_exhausts_at_four
        grounds:
          - state_machines.Contract.DRAFT_to_SUBMITTED
          - state_machines.Contract.SUBMITTED_to_DRAFT
          - entities.Contract.fields.revision_round
          - entities.Contract.fields.submitted_by_user_id
          - errors[ERR_REVISION_LIMIT_REACHED]
        distinguishing_aspect: |
          Contract is the cyclic machine — SUBMITTED -> DRAFT -> SUBMITTED is traversed four times
          on the same row, revision_round reaching 4, and the fifth submit is rejected with
          ERR_REVISION_LIMIT_REACHED while status stays DRAFT and submitted_by_user_id stays null.
