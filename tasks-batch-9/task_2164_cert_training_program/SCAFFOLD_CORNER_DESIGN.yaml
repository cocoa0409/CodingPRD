            - { call: "POST /curriculum-modules", payload: { module_code: "CERT-103", title: "Disaster Medical", contact_hours: 5.0, sequence_index: 3, is_core: true, requires_skills_demo: true, refresher_eligible: true, prerequisite_module_id: "${m102_id}" }, as: ProgramCoordinator, as_user_id: "coord-admin-0", captures: { m103_id: $.data.id } }
            - { call: "POST /facilities", payload: { name: "Riverside EOC", room_code: "EOC-A", capacity_seats: 40, status: "ACTIVE" }, as: ProgramCoordinator, as_user_id: "coord-admin-0", captures: { fac_a_id: $.data.id } }
            - { call: "POST /facilities", payload: { name: "Riverside Annex", room_code: "ANX-B", capacity_seats: 40, status: "ACTIVE" }, as: ProgramCoordinator, as_user_id: "coord-admin-0", captures: { fac_b_id: $.data.id } }
            - { call: "POST /instructors", payload: { full_name: "Ines Ruiz", certification_expires_on: "2028-01-01T00:00:00Z", max_daily_contact_hours: 8.0, status: "ACTIVE" }, as: ProgramCoordinator, as_user_id: "coord-admin-0", captures: { ins_1_id: $.data.id } }
            - { call: "POST /instructors", payload: { full_name: "Evan Ko", certification_expires_on: "2028-01-01T00:00:00Z", max_daily_contact_hours: 8.0, status: "ACTIVE" }, as: ProgramCoordinator, as_user_id: "coord-admin-0", captures: { ins_2_id: $.data.id } }
            - { call: "POST /cohorts", payload: { program_id: "${prog_id}", cohort_code: "C-2026A", seat_capacity: 2, session_window_start: "2026-08-01T00:00:00Z", session_window_end: "2026-12-31T23:00:00Z" }, as: ProgramCoordinator, as_user_id: "coord-admin-0", captures: { coh_id: $.data.id } }
            - { call: "POST /class-sessions", payload: { cohort_id: "${coh_id}", module_id: "${m101_id}", facility_id: "${fac_a_id}", instructor_id: "${ins_1_id}", starts_at: "2026-08-03T09:00:00Z" }, as: ProgramCoordinator, as_user_id: "coord-admin-0", captures: { ses_a_id: $.data.id } }
          trigger:
            - { call: "POST /class-sessions", payload: { cohort_id: "${coh_id}", module_id: "${m101_id}", facility_id: "${fac_b_id}", instructor_id: "${ins_1_id}", starts_at: "2026-08-03T10:00:00Z" }, as: ProgramCoordinator, as_user_id: "coord-admin-0", captures: { err1: $.data.error_id } }
            - { call: "POST /class-sessions", payload: { cohort_id: "${coh_id}", module_id: "${m101_id}", facility_id: "${fac_b_id}", instructor_id: "${ins_2_id}", starts_at: "2026-08-03T10:00:00Z" }, as: ProgramCoordinator, as_user_id: "coord-admin-0", captures: { ses_ok_id: $.data.id } }
          assert:
            - "The overlapping booking for Ines Ruiz returns 409 with data.error_id == ERR_INSTRUCTOR_DOUBLE_BOOKED"
            - "The identical slot booked for Evan Ko returns 201"
            - "ClassSession.${ses_ok_id}.instructor_id == ${ins_2_id} and ends_at == 2026-08-03T12:30:00Z"
            - "GET /class-sessions with instructor_id ${ins_1_id} returns total_count 1"

      - name: attendance_below_minimum_returns_attendance_insufficient
        claim_type: violation_to_error
        grounds:
          - validations[priority=60]
          - errors[ERR_ATTENDANCE_INSUFFICIENT]
        excluded_because:
          difficulty_instance: boundary_precision_check / attendance_ratio_exactly_at_minimum_is_accepted
          rationale: "That instance already drives 119 minutes into ERR_ATTENDANCE_INSUFFICIENT and 120 minutes into a 201."

      - name: refresher_hours_below_requirement_returns_insufficient
        claim_type: violation_to_error
        grounds:
          - validations[priority=74]
          - errors[ERR_REFRESHER_HOURS_INSUFFICIENT]
        excluded_because:
          difficulty_instance: boundary_precision_check / refresher_hours_exactly_at_requirement_permits_renewal
          rationale: "That instance asserts the 422 at 7.9 hours and the 200 at exactly 8.0."

      - name: completion_against_a_non_delivered_session_returns_error
        claim_type: violation_to_error
        grounds:
          - validations[priority=24]
          - errors[ERR_SESSION_NOT_DELIVERED]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / completion_requires_its_class_session_to_be_delivered
          rationale: "That instance asserts the 409 while SCHEDULED and the 201 after delivery."

      - name: issuance_against_a_non_live_credential_returns_error
        claim_type: violation_to_error
        grounds:
          - validations[priority=26]
          - errors[ERR_CREDENTIAL_NOT_ACTIVE]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / kit_issuance_requires_a_live_credential_on_the_trainee
          rationale: "That instance asserts the 409 while SUSPENDED and the 201 after REINSTATE."

      - name: graduation_outside_review_returns_cohort_not_in_review
        claim_type: violation_to_error
        grounds:
          - validations[priority=23]
          - errors[ERR_COHORT_NOT_IN_REVIEW]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / graduation_requires_the_cohort_to_be_in_review
          rationale: "That instance asserts the 409 while IN_SESSION and the 200 after the cohort advance."

      - name: expired_instructor_certification_blocks_scheduling
        claim_type: violation_to_error
        grounds:
          - validations[priority=32]
          - errors[ERR_INSTRUCTOR_CERT_EXPIRED]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / safety_check_beats_referential_check_on_session_scheduling
          rationale: "That instance asserts ERR_INSTRUCTOR_CERT_EXPIRED wins over the referential error and disappears once the certification is extended."

      - name: prerequisite_without_a_scheduled_session_is_refused
        claim_type: violation_to_error
        grounds:
          - validations[priority=50]
          - errors[ERR_PREREQUISITE_NOT_SCHEDULED]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / safety_check_beats_referential_check_on_session_scheduling
          rationale: "The second half of that instance asserts ERR_PREREQUISITE_NOT_SCHEDULED after the certification is repaired."

      - name: facility_capacity_below_confirmed_seats_is_refused
        claim_type: violation_to_error
        grounds:
          - validations[priority=64]
          - errors[ERR_FACILITY_CAPACITY_INSUFFICIENT]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / temporal_check_beats_constraint_check_on_facility_booking
          rationale: "The second half of that instance asserts ERR_FACILITY_CAPACITY_INSUFFICIENT on a conflict-free day."

      - name: instructor_day_cap_exceeded_is_refused
        claim_type: violation_to_error
        grounds:
          - validations[priority=66]
          - errors[ERR_INSTRUCTOR_DAILY_LOAD_EXCEEDED]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / instructor_overlap_allows_adjacency_but_caps_aggregate_day_hours
          rationale: "That instance asserts the 409 at 10.0 hours against a 5.0-hour cap and the 201 on the next UTC day."

      - name: empty_responder_pool_is_refused
        claim_type: violation_to_error
        grounds:
          - validations[priority=68]
          - errors[ERR_NO_ELIGIBLE_RESPONDERS]
        excluded_because:
          difficulty_instance: boundary_precision_check / roster_selector_partial_fill_and_empty_candidate_set
          rationale: "That instance asserts the 409 on the zero-candidate activation and PARTIAL on the one-candidate activation."

      - name: facility_buffer_collision_is_refused
        claim_type: violation_to_error
        grounds:
          - validations[priority=40]
          - errors[ERR_FACILITY_DOUBLE_BOOKED]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / facility_turnover_buffer_makes_exactly_adjacent_sessions_collide
          rationale: "That instance asserts the 409 on exact adjacency and the 201 at a 30-minute gap."

  - section: endpoints
