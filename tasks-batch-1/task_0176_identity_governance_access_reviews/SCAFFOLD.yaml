# =============================================================================
# task_0176 — Identity Governance & Access Reviews — SCAFFOLD (§1.0–§1.7)
# =============================================================================

scenario: |
  176. Identity Governance & Access Reviews: role/entitlement catalog, access
  request/approval, segregation-of-duties conflict, periodic certification
  campaign, provisioning/deprovisioning, orphan account, privileged access,
  audit evidence

domain_name: identity-governance

api_prefix: ""   # flat multi-collection API; every entity has a top-level collection segment

complexity_profile:
  primary_archetype: access_control_matrix
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency        # OCC on Identity.version for direct re-grant supersede
    - cascading_side_effects        # approval -> grant -> risk recompute -> flag; disable -> revoke-all
    - dual_variant_calculation      # projected vs effective risk; projected vs realized revocation impact
    - derived_field_reconciliation  # active_grant_count / privileged_entitlement_count / risk_score kept consistent

  entity_topology: flat
  # All entities are peers linked by foreign keys; no nested ownership URL chains.
  # Sub-resource GET exists only for the campaign->item parent relationship.

  state_machine_shape: branching
  # AccessRequest is cyclic (RETURNED revision loop); Grant carries two parallel
  # state dimensions (lifecycle_status x review_status); CertificationCampaign is
  # compound (posture derived from its items).

  relationship_patterns:
    - one_to_many        # Identity 1-* Grant; Campaign 1-* CertificationItem
    - many_to_many       # Role *-* Entitlement (via Role.entitlement_ids array)
    - cross_aggregate    # CertificationItem references Grant across aggregates

  role_model: segregation_of_duties
  # The acting approver of an AccessRequest may not be the identity it targets,
  # and the same operator may not both raise and approve the same request.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Entitlement
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: name, type: string, source: input, description: "Catalog display name of the fine-grained entitlement" }
      - { name: system_code, type: string, source: input, description: "Target system identifier the entitlement provisions into (e.g. 'SAP_FI')" }
      - { name: is_privileged, type: boolean, source: input, default: false, description: "Whether this entitlement confers privileged/admin access" }
      - { name: risk_weight, type: integer, source: input, default: 10, description: "Base risk points contributed by holding this entitlement; constraints: integer 0..100" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | ARCHIVED — ARCHIVED entitlements cannot be newly requested or granted; constraints: one of {ACTIVE, ARCHIVED}" }

  - name: Role
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Business role name (bundle of entitlements)" }
      - { name: entitlement_ids, type: array, source: input, description: "List of Entitlement ids bundled by this role (membership list, not a scalar FK); each element must reference an existing ACTIVE Entitlement at create time" }
      - { name: requires_dual_approval, type: boolean, source: computed, description: "TRUE when the role bundles at least one Entitlement with is_privileged=true; gates AccessRequest approval" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | RETIRED — RETIRED roles cannot back new AccessRequests; constraints: one of {ACTIVE, RETIRED}" }

  - name: SodPolicy
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Segregation-of-duties policy name" }
      - { name: entitlement_a_id, type: string, source: input, description: "FK -> Entitlement.id; one side of the toxic pair" }
      - { name: entitlement_b_id, type: string, source: input, description: "FK -> Entitlement.id; the other side of the toxic pair; must differ from entitlement_a_id" }
      - { name: severity, type: enum, source: input, default: HARD, description: "HARD blocks the conflicting grant; SOFT records a violation but allows it with justification; constraints: one of {HARD, SOFT}" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | DISABLED — only ACTIVE policies are evaluated; constraints: one of {ACTIVE, DISABLED}" }

  - name: Identity
    parent: null
    common_fields: true
    fields:
      - { name: display_name, type: string, source: input, description: "Workforce identity display name" }
      - { name: email, type: string, source: input, description: "Unique login email of the identity" }
      - { name: is_human, type: boolean, source: input, default: true, description: "FALSE marks a service/system account; an ACTIVE non-human identity with zero ACTIVE grants is an orphan account" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | DISABLED | DEPROVISIONED; constraints: one of {ACTIVE, DISABLED, DEPROVISIONED}" }
      - { name: active_grant_count, type: integer, source: computed, description: "Count of Grants for this identity whose lifecycle_status == ACTIVE (conserved-quantity invariant)" }
      - { name: privileged_entitlement_count, type: integer, source: computed, description: "Count of distinct Entitlements with is_privileged=true held via a lifecycle_status==ACTIVE Grant (conserved-quantity invariant)" }
      - { name: effective_risk_score, type: integer, source: computed, description: "Risk from ACTIVE grants only; see calculations.effective_risk_score" }
      - { name: projected_risk_score, type: integer, source: computed, description: "Risk including ACTIVE grants plus pending (SUBMITTED) AccessRequest targets; see calculations.projected_risk_score" }
      - { name: is_orphan, type: boolean, source: computed, description: "TRUE when status==ACTIVE, is_human==false, and active_grant_count==0" }

  - name: AccessRequest
    parent: null
    common_fields: true
    fields:
      - { name: identity_id, type: string, source: input, description: "FK -> Identity.id; the identity the access is requested for" }
      - { name: role_id, type: string, source: input, description: "FK -> Role.id; the role bundle being requested" }
      - { name: justification, type: string, source: input, description: "Free-text business justification supplied by the requester" }
      - { name: requester_user_id, type: string, source: system, description: "X-User-ID of the AccessManager who raised the request; used for segregation-of-duties on approval" }
      - { name: sod_override_justification, type: string, source: input, description: "Justification supplied to push a SOFT SoD conflict through approval; required only when a SOFT conflict is present" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | SUBMITTED | RETURNED | APPROVED | REJECTED; constraints: one of {DRAFT, SUBMITTED, RETURNED, APPROVED, REJECTED}" }
      - { name: decided_by_user_id, type: string, source: system, description: "X-User-ID of the approver who reached APPROVED/REJECTED; null until decided" }
      - { name: sod_conflict_detected, type: boolean, source: computed, description: "TRUE when submitting/approving surfaced at least one ACTIVE SodPolicy conflict between a requested entitlement and an already-held entitlement" }

  - name: Grant
    parent: null
    common_fields: true
    fields:
      - { name: identity_id, type: string, source: input, description: "FK -> Identity.id; the identity holding this entitlement" }
      - { name: entitlement_id, type: string, source: input, description: "FK -> Entitlement.id; the single entitlement this grant confers" }
      - { name: source_request_id, type: string, source: input, description: "FK -> AccessRequest.id; the approved request that spawned this grant, or null for a direct admin grant" }
      - { name: is_just_in_time, type: boolean, source: input, default: false, description: "TRUE for a time-boxed privileged (JIT) grant carrying effective_from/effective_until" }
      - { name: effective_from, type: datetime, source: input, description: "ISO 8601 UTC start of a JIT grant's privileged window; null for standing grants" }
      - { name: effective_until, type: datetime, source: input, description: "ISO 8601 UTC end (exclusive) of a JIT grant's privileged window; null for standing grants; must be strictly after effective_from" }
      - { name: lifecycle_status, type: enum, source: system, default: PROVISIONING, description: "Dimension 1: PROVISIONING | ACTIVE | REVOKED; constraints: one of {PROVISIONING, ACTIVE, REVOKED}" }
      - { name: review_status, type: enum, source: system, default: NOT_DUE, description: "Dimension 2 (parallel): NOT_DUE | UNDER_REVIEW | CERTIFIED | FLAGGED; constraints: one of {NOT_DUE, UNDER_REVIEW, CERTIFIED, FLAGGED}" }
      - { name: risk_contribution, type: integer, source: computed, description: "Risk points this grant contributes while lifecycle_status==ACTIVE; see calculations.effective_risk_score" }

  - name: CertificationCampaign
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Campaign name" }
      - { name: scope_role_id, type: string, source: input, description: "FK -> Role.id; the campaign certifies every ACTIVE Grant of an entitlement bundled by this role" }
      - { name: review_window_start, type: datetime, source: input, description: "ISO 8601 UTC inclusive start of the campaign review window" }
      - { name: review_window_end, type: datetime, source: input, description: "ISO 8601 UTC inclusive end of the campaign review window; must be on/after review_window_start" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | ACTIVE | CLOSED; constraints: one of {DRAFT, ACTIVE, CLOSED}" }
      - { name: posture, type: enum, source: computed, description: "OPEN | IN_REVIEW | COMPLETE — derived from item review_status mix; see calculations.campaign_posture" }
      - { name: item_count, type: integer, source: computed, description: "Number of CertificationItems generated when the campaign launched" }
      - { name: completion_pct, type: number, source: computed, description: "Percent of items decided (CERTIFIED or REVOKED); see calculations.campaign_completion_pct" }
      - { name: projected_revocation_count, type: integer, source: computed, description: "Items still PENDING/UNDER_REVIEW at close that WOULD be auto-revoked under continue-revoke policy; see calculations.revocation_impact (projected variant)" }
      - { name: realized_revocation_count, type: integer, source: computed, description: "Items actually revoked once the campaign reached CLOSED; see calculations.revocation_impact (realized variant)" }

  - name: CertificationItem
    parent: CertificationCampaign
    common_fields: true
    fields:
      - { name: campaign_id, type: string, source: system, description: "FK -> CertificationCampaign.id; the campaign this line item belongs to" }
      - { name: grant_id, type: string, source: input, description: "FK -> Grant.id; the grant under certification" }
      - { name: decision_status, type: enum, source: system, default: PENDING, description: "PENDING | UNDER_REVIEW | CERTIFIED | REVOKED; constraints: one of {PENDING, UNDER_REVIEW, CERTIFIED, REVOKED}" }
      - { name: decided_by_user_id, type: string, source: system, description: "X-User-ID of the certifier who decided this item; null until decided" }

  - name: AuditEvent
    parent: null
    common_fields: false   # id + created_at only; append-only, immutable
    fields:
      - { name: subject_identity_id, type: string, source: input, description: "FK -> Identity.id; the identity the audited action concerns (orphan/grant/revoke/certify events)" }
      - { name: event_type, type: enum, source: system, description: "GRANT_ACTIVATED | GRANT_REVOKED | REQUEST_APPROVED | REQUEST_REJECTED | IDENTITY_DISABLED | ITEM_CERTIFIED | ORPHAN_DETECTED; constraints: one of {GRANT_ACTIVATED, GRANT_REVOKED, REQUEST_APPROVED, REQUEST_REJECTED, IDENTITY_DISABLED, ITEM_CERTIFIED, ORPHAN_DETECTED}" }
      - { name: actor_user_id, type: string, source: system, description: "X-User-ID of the operator whose action produced this evidence record, or 'system' for automatic cascades" }
      - { name: detail, type: string, source: system, description: "Human-readable summary of the audited action" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  # --- AccessRequest: cyclic (RETURNED revision loop) + branching decision ---
  - entity: AccessRequest
    initial_state: DRAFT
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /access-requests/{id}/submit"
        actor: AccessManager
        preconditions:
          - "Target Identity.status == ACTIVE (ERR_IDENTITY_NOT_ACTIVE)"
          - "Role.status == ACTIVE (ERR_ROLE_RETIRED)"
          - "Every Entitlement bundled by the role has status == ACTIVE (ERR_ENTITLEMENT_ARCHIVED)"
        side_effects:
          - "Compute sod_conflict_detected by checking each requested entitlement against ACTIVE SodPolicy rows versus the identity's currently-held (ACTIVE-grant) entitlements"
          - "Recompute Identity.projected_risk_score (now includes this SUBMITTED request's role entitlements)"
      - from: SUBMITTED
        to: RETURNED
        trigger: "POST /access-requests/{id}/return"
        actor: AccessApprover
        preconditions:
          - "Approver X-User-ID != AccessRequest.requester_user_id (ERR_SOD_SELF_ACTION)"
        side_effects:
          - "Recompute Identity.projected_risk_score (this request no longer counts as pending)"
      - from: RETURNED
        to: SUBMITTED
        trigger: "POST /access-requests/{id}/submit"
        actor: AccessManager
        preconditions:
          - "Target Identity.status == ACTIVE (ERR_IDENTITY_NOT_ACTIVE)"
          - "Role.status == ACTIVE (ERR_ROLE_RETIRED)"
        side_effects:
          - "Recompute sod_conflict_detected"
          - "Recompute Identity.projected_risk_score"
        note: "Cyclic revision loop — a returned request can be resubmitted any number of times."
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /access-requests/{id}/approve"
        actor: AccessApprover
        preconditions:
          - "Approver X-User-ID != AccessRequest.requester_user_id (ERR_SOD_SELF_ACTION)"
          - "Approver X-User-ID != target Identity.id (ERR_SOD_SELF_ACTION)"
          - "Target Identity.status == ACTIVE (ERR_IDENTITY_NOT_ACTIVE)"
          - "If Role.requires_dual_approval == true, request body must carry second_approver_confirmed == true (ERR_DUAL_APPROVAL_REQUIRED)"
          - "If any HARD ACTIVE SodPolicy conflict is present, approval is blocked (ERR_SOD_CONFLICT)"
          - "If only SOFT conflicts present, sod_override_justification must be non-empty (ERR_SOD_OVERRIDE_REQUIRED)"
        side_effects:
          - "Set decided_by_user_id = approver X-User-ID"
          - "CASCADE depth-3: create one Grant (lifecycle_status=PROVISIONING) per entitlement in the role; each new Grant then auto-advances PROVISIONING->ACTIVE; each activation recomputes Identity.active_grant_count, privileged_entitlement_count, effective_risk_score; if effective_risk_score crosses the HIGH_RISK threshold the newest privileged Grant's review_status is set to FLAGGED"
          - "Append AuditEvent{event_type=REQUEST_APPROVED}"
          - "Recompute Identity.projected_risk_score (pending portion cleared, now equals effective_risk_score)"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /access-requests/{id}/reject"
        actor: AccessApprover
        preconditions:
          - "Approver X-User-ID != AccessRequest.requester_user_id (ERR_SOD_SELF_ACTION)"
        side_effects:
          - "Set decided_by_user_id = approver X-User-ID"
          - "Append AuditEvent{event_type=REQUEST_REJECTED}"
          - "Recompute Identity.projected_risk_score (this request no longer pending)"

  # --- Grant: parallel state dimensions (lifecycle_status x review_status) ---
  - entity: Grant
    initial_state: PROVISIONING            # lifecycle_status dimension initial
    terminal_states: [REVOKED]
    transitions:
      # Dimension 1: lifecycle_status
      - from: PROVISIONING
        to: ACTIVE
        trigger: "system: auto-provision on Grant creation (approval cascade or direct admin grant)"
        actor: system
        preconditions:
          - "For a JIT grant, effective_from <= current clock < effective_until is NOT required to activate; window only gates privileged use, not activation"
        side_effects:
          - "Increment Identity.active_grant_count by 1"
          - "If Entitlement.is_privileged, increment Identity.privileged_entitlement_count by 1 (distinct entitlement)"
          - "Recompute Identity.effective_risk_score, is_orphan"
          - "Append AuditEvent{event_type=GRANT_ACTIVATED}"
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /grants/{id}/revoke OR cascade from Identity disable / CertificationItem revoke"
        actor: AccessManager | system
        preconditions:
          - "Grant.lifecycle_status == ACTIVE (ERR_INVALID_STATE)"
        side_effects:
          - "Decrement Identity.active_grant_count by 1"
          - "If Entitlement.is_privileged and no other ACTIVE grant of that entitlement remains, decrement Identity.privileged_entitlement_count by 1"
          - "Recompute Identity.effective_risk_score, is_orphan"
          - "Append AuditEvent{event_type=GRANT_REVOKED}"
      # Dimension 2: review_status — evolves independently of lifecycle_status
      - from: NOT_DUE
        to: UNDER_REVIEW
        trigger: "system: CertificationCampaign launch enrolls this grant into an item"
        actor: system
        preconditions:
          - "Grant.lifecycle_status == ACTIVE"
        side_effects:
          - "Create one CertificationItem{decision_status=PENDING} referencing this grant"
        note: "Parallel dimension — review_status changes do not alter lifecycle_status."
      - from: UNDER_REVIEW
        to: CERTIFIED
        trigger: "POST /certification-items/{id}/certify (bubbles to the grant)"
        actor: Certifier
        preconditions:
          - "Owning CertificationCampaign.status == ACTIVE (ERR_CAMPAIGN_NOT_ACTIVE)"
        side_effects:
          - "Append AuditEvent{event_type=ITEM_CERTIFIED}"
      - from: UNDER_REVIEW
        to: FLAGGED
        trigger: "POST /certification-items/{id}/revoke (bubbles to the grant) OR HIGH_RISK auto-flag on activation"
        actor: Certifier | system
        preconditions: []
        side_effects:
          - "If reached via item revoke: cascade the grant's lifecycle_status ACTIVE->REVOKED with its full revoke side-effect set"

  # --- CertificationCampaign: compound (posture derived from item mix) ---
  - entity: CertificationCampaign
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /certification-campaigns/{id}/launch"
        actor: CampaignAdmin
        preconditions:
          - "Role scope_role_id status == ACTIVE (ERR_ROLE_RETIRED)"
          - "No other CertificationCampaign for the same scope_role_id is in status ACTIVE (ERR_CAMPAIGN_WINDOW_OVERLAP)"
          - "review_window_start of this campaign is >= prior CLOSED campaign's review_window_end + 1 day buffer for the same scope_role_id (ERR_CAMPAIGN_WINDOW_OVERLAP)"
        side_effects:
          - "Enroll every ACTIVE Grant of an entitlement bundled by scope_role_id: set each grant review_status NOT_DUE->UNDER_REVIEW and create a CertificationItem{PENDING}"
          - "Set item_count = number of items created"
          - "Recompute posture, completion_pct"
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /certification-campaigns/{id}/close"
        actor: CampaignAdmin
        preconditions:
          - "Campaign.status == ACTIVE (ERR_INVALID_STATE)"
        side_effects:
          - "CASCADE: every still-PENDING/UNDER_REVIEW CertificationItem is auto-decided REVOKED (continue-revoke policy); each REVOKED item cascades its grant ACTIVE->REVOKED with full revoke side-effects, which recomputes the affected Identity's counters"
          - "Set realized_revocation_count = number of items auto-revoked at close + items explicitly revoked during the campaign"
          - "Recompute posture (COMPLETE), completion_pct (100.00)"

  # --- Identity: lifecycle with deprovision cascade ---
  - entity: Identity
    initial_state: ACTIVE
    terminal_states: [DEPROVISIONED]
    transitions:
      - from: ACTIVE
        to: DISABLED
        trigger: "POST /identities/{id}/disable"
        actor: AccessManager
        preconditions:
          - "Identity.status == ACTIVE (ERR_INVALID_STATE)"
          - "expected_identity_version must match Identity.version (ERR_STALE_VERSION)"
        side_effects:
          - "CASCADE depth-2: every Grant for this identity with lifecycle_status==ACTIVE transitions ACTIVE->REVOKED; each revoke decrements active_grant_count/privileged_entitlement_count and recomputes effective_risk_score"
          - "Append AuditEvent{event_type=IDENTITY_DISABLED}"
          - "After cascade, active_grant_count == 0 and effective_risk_score == 0"
      - from: DISABLED
        to: ACTIVE
        trigger: "POST /identities/{id}/enable"
        actor: AccessManager
        preconditions:
          - "expected_identity_version must match Identity.version (ERR_STALE_VERSION)"
        side_effects:
          - "Re-enabling does NOT resurrect revoked grants; identity returns with active_grant_count==0 (orphan if non-human)"
      - from: DISABLED
        to: DEPROVISIONED
        trigger: "POST /identities/{id}/deprovision"
        actor: AccessManager
        preconditions:
          - "Identity.status == DISABLED (ERR_INVALID_STATE)"
          - "Identity.active_grant_count == 0 (ERR_IDENTITY_HAS_ACTIVE_GRANTS)"
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: direct-grant-stale-identity
    parent_entity: Identity
    write_endpoint: "POST /identities/{id}/grants"
    occ_field: "expected_identity_version"
    description: |
      Creating a direct admin Grant against an Identity whose version has
      advanced since the client last observed it is rejected. A direct re-grant
      of the same entitlement legitimately supersedes any prior standing grant
      under the product's re-provision semantics, so a second create observing
      unchanged state would itself succeed; the version guard rejects the create
      whose Identity view is stale (another writer already provisioned and bumped
      Identity.version).
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: effective_risk_score
    trigger: "Grant PROVISIONING->ACTIVE, Grant ACTIVE->REVOKED, Identity disable cascade"
    algorithm: weighted_scoring
    formula: |
      # Risk from ACTIVE grants only.
      base = sum(Entitlement.risk_weight for each Grant g of the identity where g.lifecycle_status == ACTIVE)
      privileged_n = count(distinct Entitlement with is_privileged=true held via an ACTIVE grant)
      # Non-linear privileged multiplier applied as a stepped surcharge:
      surcharge = PRIVILEGED_STEP * min(privileged_n, PRIVILEGED_CAP_STEPS)
      effective_risk_score = base + surcharge
      # Each ACTIVE grant's risk_contribution = its Entitlement.risk_weight (surcharge is identity-level, not per-grant).
    input_set: "Grants of the identity with lifecycle_status == ACTIVE; Entitlements they reference."
    constants:
      PRIVILEGED_STEP: 25
      PRIVILEGED_CAP_STEPS: 3
      HIGH_RISK_THRESHOLD: 100
    precision: "integer points, no rounding (all inputs integer)"
    variants:
      - name: effective
        when: "Identity.effective_risk_score — steady-state risk"
        difference: "Counts only ACTIVE grants; excludes pending requests."

  - name: projected_risk_score
    trigger: "AccessRequest submit/return/approve/reject (pending set changes), Grant activation/revoke"
    algorithm: forward_looking
    formula: |
      # Projected = effective risk PLUS the risk the identity WOULD carry if every
      # currently-SUBMITTED AccessRequest for this identity were approved.
      pending_entitlements = union of (entitlements bundled by Role of each AccessRequest
                                       for this identity with status == SUBMITTED)
                              MINUS entitlements already held via an ACTIVE grant
      pending_base = sum(Entitlement.risk_weight for e in pending_entitlements)
      projected_privileged_n = count(distinct privileged entitlements in
                                      {ACTIVE-grant entitlements} UNION pending_entitlements)
      projected_surcharge = PRIVILEGED_STEP * min(projected_privileged_n, PRIVILEGED_CAP_STEPS)
      projected_risk_score = (effective_base) + pending_base + projected_surcharge
      # where effective_base is the ACTIVE-grant base from effective_risk_score.
    input_set: "ACTIVE grants UNION distinct entitlements of SUBMITTED requests for the identity."
    constants:
      PRIVILEGED_STEP: 25
      PRIVILEGED_CAP_STEPS: 3
    precision: "integer points, no rounding"
    variants:
      - name: projected
        when: "Identity.projected_risk_score — request-time forward estimate"
        difference: "Includes SUBMITTED-request entitlements the effective variant excludes; same inputs as effective when no SUBMITTED requests exist."

  - name: campaign_completion_pct
    trigger: "CertificationItem certify/revoke, CertificationCampaign close"
    algorithm: aggregation
    formula: |
      decided = count(CertificationItem of campaign where decision_status in {CERTIFIED, REVOKED})
      total = campaign.item_count
      if total == 0:
        completion_pct = 100.00          # empty campaign is trivially complete
      else:
        # PIN: divide-then-round (compute the ratio over the whole, then round once).
        # NOT round-per-item. ratio = decided/total computed in full precision, then
        # multiplied by 100 and rounded HALF_UP to 2 decimals.
        completion_pct = round((decided / total) * 100, 2)   # round_half_up, 2 dp
    input_set: "CertificationItems of the campaign; total is the frozen item_count from launch."
    constants: {}
    precision: "2 decimal places, round_half_up; division performed before rounding (divide-then-round, pinned)"

  - name: revocation_impact
    trigger: "CertificationCampaign close (realized); read of an ACTIVE campaign (projected)"
    algorithm: aggregation
    formula: |
      projected_revocation_count = count(CertificationItem of campaign where
                                         decision_status in {PENDING, UNDER_REVIEW})   # would auto-revoke at close
      realized_revocation_count = count(CertificationItem of campaign where
                                        decision_status == REVOKED)                    # after close, all undecided are REVOKED
    input_set: "CertificationItems of the campaign by decision_status."
    constants: {}
    precision: "integer counts"
    variants:
      - name: projected
        when: "Campaign.status == ACTIVE — what-if at this instant"
        difference: "Counts items NOT yet decided; assumes continue-revoke policy on close."
      - name: realized
        when: "Campaign.status == CLOSED — after the close cascade ran"
        difference: "Counts items actually flipped to REVOKED; equals projected_at_close + explicit-revokes during the campaign."

  - name: campaign_posture
    trigger: "CertificationCampaign launch/close, CertificationItem decision"
    algorithm: aggregation
    formula: |
      if campaign.status == DRAFT: posture = OPEN
      elif all items decision_status in {CERTIFIED, REVOKED} (or item_count == 0): posture = COMPLETE
      else: posture = IN_REVIEW
    input_set: "CertificationItems of the campaign."
    constants: {}
    precision: "n/a"

  - name: sod_conflict_evaluation
    trigger: "AccessRequest submit and approve"
    algorithm: constraint_propagation
    formula: |
      requested_entitlements = entitlements bundled by AccessRequest.role
      held_entitlements = entitlements held by the identity via ACTIVE grants
      conflicts = []
      for policy in SodPolicy where status == ACTIVE:
        # A conflict exists when, after granting, the identity would hold BOTH
        # sides of the toxic pair. One side may already be held; the other comes
        # from the request (or both come from the request via a multi-entitlement role).
        union_after = requested_entitlements UNION held_entitlements
        if policy.entitlement_a_id in union_after and policy.entitlement_b_id in union_after:
          conflicts.append(policy)
      sod_conflict_detected = (len(conflicts) > 0)
      hard_conflict = any(p.severity == HARD for p in conflicts)
      soft_conflict = any(p.severity == SOFT for p in conflicts) and not hard_conflict
    input_set: "ACTIVE SodPolicy rows; requested role entitlements; identity's ACTIVE-grant entitlements."
    constants: {}
    precision: "n/a"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Acting role is permitted for this operation per §1.7 RBAC"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all mutating endpoints"

  - priority: 3
    category: existence
    check: "Path/body resource ids resolve (validated left-to-right in path, then body FKs)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints referencing a resource id"

  - priority: 4
    category: state
    check: "Target resource is in a state from which the requested transition is defined"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 5
    category: business_safety
    check: "Segregation of duties: the acting approver/returner/rejecter X-User-ID must not equal the request's requester_user_id, and an approver may not be the target Identity"
    error_id: ERR_SOD_SELF_ACTION
    http_status: 403
    applies_to: "POST /access-requests/{id}/approve|reject|return"

  - priority: 6
    category: business_safety
    check: "Privileged role approval requires second_approver_confirmed==true when Role.requires_dual_approval"
    error_id: ERR_DUAL_APPROVAL_REQUIRED
    http_status: 422
    applies_to: "POST /access-requests/{id}/approve"

  - priority: 7
    category: business_referential
    check: "Every entitlement bundled by the requested role is status==ACTIVE; role itself status==ACTIVE"
    error_id: ERR_ENTITLEMENT_ARCHIVED
    http_status: 409
    applies_to: "POST /access-requests/{id}/submit"

  - priority: 8
    category: business_constraint
    check: "No HARD ACTIVE SodPolicy conflict between requested and held entitlements (blocks); SOFT conflict requires sod_override_justification"
    error_id: ERR_SOD_CONFLICT
    http_status: 409
    applies_to: "POST /access-requests/{id}/approve"

  - priority: 9
    category: business_temporal
    check: "A JIT grant's effective window must not overlap another JIT grant of the same (identity, entitlement); half-open [from, until), touching endpoints allowed"
    error_id: ERR_JIT_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /identities/{id}/grants"

  - priority: 10
    category: business_temporal
    check: "A campaign's review window for a scope_role_id must not overlap an ACTIVE campaign for that role, and must start >= prior CLOSED campaign end + 1 day buffer"
    error_id: ERR_CAMPAIGN_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /certification-campaigns/{id}/launch"

  - priority: 11
    category: business_constraint
    check: "Deprovision requires active_grant_count == 0"
    error_id: ERR_IDENTITY_HAS_ACTIVE_GRANTS
    http_status: 409
    applies_to: "POST /identities/{id}/deprovision"

  - priority: 12
    category: business_constraint
    check: "OCC: expected_identity_version equals current Identity.version on direct-grant and identity disable/enable"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /identities/{id}/grants, POST /identities/{id}/disable, POST /identities/{id}/enable"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---------------- Entitlement ----------------
  - method: POST
    path: "/entitlements"
    description: "Create a catalog entitlement"
    roles: [CatalogAdmin]
    code: 201
    input: [name, system_code, "is_privileged?", "risk_weight?"]
    output: Entitlement
    side_effects: ["status=ACTIVE"]
  - method: GET
    path: "/entitlements/{id}"
    description: "Get an entitlement"
    roles: [CatalogAdmin, AccessManager, AccessApprover, CampaignAdmin, Certifier]
    code: 200
    input: []
    output: Entitlement
    side_effects: []
  - method: GET
    path: "/entitlements"
    description: "List entitlements"
    roles: [CatalogAdmin, AccessManager, AccessApprover, CampaignAdmin, Certifier]
    code: 200
    input: ["is_privileged?", "status?", "limit?", "offset?"]
    output: Entitlement[]
    side_effects: []
  - method: POST
    path: "/entitlements/{id}/archive"
    description: "Archive an entitlement (status ACTIVE->ARCHIVED)"
    roles: [CatalogAdmin]
    code: 200
    input: []
    output: Entitlement
    side_effects: ["status=ARCHIVED"]

  # ---------------- Role ----------------
  - method: POST
    path: "/roles"
    description: "Create a role bundling entitlements"
    roles: [CatalogAdmin]
    code: 201
    input: [name, entitlement_ids]
    output: Role
    side_effects: ["status=ACTIVE", "requires_dual_approval computed from bundled privileged entitlements"]
  - method: GET
    path: "/roles/{id}"
    description: "Get a role"
    roles: [CatalogAdmin, AccessManager, AccessApprover, CampaignAdmin, Certifier]
    code: 200
    input: []
    output: Role
    side_effects: []
  - method: GET
    path: "/roles"
    description: "List roles"
    roles: [CatalogAdmin, AccessManager, AccessApprover, CampaignAdmin, Certifier]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Role[]
    side_effects: []
  - method: POST
    path: "/roles/{id}/retire"
    description: "Retire a role (status ACTIVE->RETIRED)"
    roles: [CatalogAdmin]
    code: 200
    input: []
    output: Role
    side_effects: ["status=RETIRED"]

  # ---------------- SodPolicy ----------------
  - method: POST
    path: "/sod-policies"
    description: "Create a segregation-of-duties policy over a toxic entitlement pair"
    roles: [CatalogAdmin]
    code: 201
    input: [name, entitlement_a_id, entitlement_b_id, "severity?"]
    output: SodPolicy
    side_effects: ["status=ACTIVE"]
  - method: GET
    path: "/sod-policies/{id}"
    description: "Get a SoD policy"
    roles: [CatalogAdmin, AccessManager, AccessApprover]
    code: 200
    input: []
    output: SodPolicy
    side_effects: []
  - method: GET
    path: "/sod-policies"
    description: "List SoD policies; filterable by either side of the pair"
    roles: [CatalogAdmin, AccessManager, AccessApprover]
    code: 200
    input: ["entitlement_a_id?", "entitlement_b_id?", "status?", "limit?", "offset?"]
    output: SodPolicy[]
    side_effects: []

  # ---------------- Identity ----------------
  - method: POST
    path: "/identities"
    description: "Create a workforce identity"
    roles: [AccessManager]
    code: 201
    input: [display_name, email, "is_human?"]
    output: Identity
    side_effects: ["status=ACTIVE", "all counters 0", "is_orphan computed (true if non-human with 0 grants)"]
  - method: GET
    path: "/identities/{id}"
    description: "Get an identity with computed risk and counters"
    roles: [AccessManager, AccessApprover, CampaignAdmin, Certifier]
    code: 200
    input: []
    output: Identity
    side_effects: []
  - method: GET
    path: "/identities"
    description: "List identities; supports orphan-account discovery"
    roles: [AccessManager, AccessApprover, CampaignAdmin, Certifier]
    code: 200
    input: ["status?", "is_orphan?", "is_human?", "limit?", "offset?"]
    output: Identity[]
    side_effects: []
  - method: POST
    path: "/identities/{id}/grants"
    description: "Directly provision a Grant for an identity (admin grant), with OCC on identity version"
    roles: [AccessManager]
    code: 201
    input: [entitlement_id, expected_identity_version, "is_just_in_time?", "effective_from?", "effective_until?"]
    output: Grant
    side_effects:
      - "create Grant(PROVISIONING) then auto-activate to ACTIVE"
      - "increments Identity.version by 1"
      - "recompute active_grant_count, privileged_entitlement_count, effective_risk_score, is_orphan"
      - "JIT-window overlap check on (identity, entitlement)"
  - method: POST
    path: "/identities/{id}/disable"
    description: "Disable an identity; revokes all active grants (deprovisioning cascade), OCC-guarded"
    roles: [AccessManager]
    code: 200
    input: [expected_identity_version]
    output: Identity
    side_effects:
      - "cascade revoke every ACTIVE grant"
      - "increments Identity.version by 1"
      - "AuditEvent IDENTITY_DISABLED"
  - method: POST
    path: "/identities/{id}/enable"
    description: "Re-enable a disabled identity (no grant resurrection), OCC-guarded"
    roles: [AccessManager]
    code: 200
    input: [expected_identity_version]
    output: Identity
    side_effects: ["increments Identity.version by 1"]
  - method: POST
    path: "/identities/{id}/deprovision"
    description: "Deprovision a disabled identity with zero active grants"
    roles: [AccessManager]
    code: 200
    input: []
    output: Identity
    side_effects: ["status=DEPROVISIONED"]
  - method: GET
    path: "/identities/{id}/grants"
    description: "List grants held by an identity (FK reverse-reachability for Grant.identity_id)"
    roles: [AccessManager, AccessApprover, CampaignAdmin, Certifier]
    code: 200
    input: ["lifecycle_status?", "review_status?", "limit?", "offset?"]
    output: Grant[]
    side_effects: []
  - method: GET
    path: "/identities/{id}/audit-events"
    description: "List audit evidence for an identity (FK reverse-reachability for AuditEvent.subject_identity_id)"
    roles: [AccessManager, AccessApprover, CampaignAdmin, Certifier]
    code: 200
    input: ["event_type?", "limit?", "offset?"]
    output: AuditEvent[]
    side_effects: []

  # ---------------- AccessRequest ----------------
  - method: POST
    path: "/access-requests"
    description: "Raise an access request (DRAFT) for an identity+role"
    roles: [AccessManager]
    code: 201
    input: [identity_id, role_id, justification, "sod_override_justification?"]
    output: AccessRequest
    side_effects: ["status=DRAFT", "requester_user_id = X-User-ID"]
  - method: GET
    path: "/access-requests/{id}"
    description: "Get an access request"
    roles: [AccessManager, AccessApprover]
    code: 200
    input: []
    output: AccessRequest
    side_effects: []
  - method: GET
    path: "/access-requests"
    description: "List access requests; filterable by identity or role"
    roles: [AccessManager, AccessApprover]
    code: 200
    input: ["identity_id?", "role_id?", "status?", "limit?", "offset?"]
    output: AccessRequest[]
    side_effects: []
  - method: POST
    path: "/access-requests/{id}/submit"
    description: "Submit (DRAFT|RETURNED -> SUBMITTED); evaluates SoD; updates projected risk"
    roles: [AccessManager]
    code: 200
    input: []
    output: AccessRequest
    side_effects: ["sod_conflict_detected recomputed", "Identity.projected_risk_score recomputed"]
  - method: POST
    path: "/access-requests/{id}/return"
    description: "Return a submitted request for revision (SUBMITTED -> RETURNED)"
    roles: [AccessApprover]
    code: 200
    input: []
    output: AccessRequest
    side_effects: ["Identity.projected_risk_score recomputed"]
  - method: POST
    path: "/access-requests/{id}/approve"
    description: "Approve (SUBMITTED -> APPROVED); cascades grant creation + activation + risk recompute"
    roles: [AccessApprover]
    code: 200
    input: ["second_approver_confirmed?", "sod_override_justification?"]
    output: AccessRequest
    side_effects:
      - "create+activate one Grant per role entitlement (cascade depth 3)"
      - "decided_by_user_id set"
      - "AuditEvent REQUEST_APPROVED"
      - "Identity risk/counters recomputed; HIGH_RISK auto-flag if threshold crossed"
  - method: POST
    path: "/access-requests/{id}/reject"
    description: "Reject (SUBMITTED -> REJECTED)"
    roles: [AccessApprover]
    code: 200
    input: []
    output: AccessRequest
    side_effects: ["decided_by_user_id set", "AuditEvent REQUEST_REJECTED", "projected risk recomputed"]

  # ---------------- Grant ----------------
  - method: GET
    path: "/grants/{id}"
    description: "Get a grant with both state dimensions and risk_contribution"
    roles: [AccessManager, AccessApprover, CampaignAdmin, Certifier]
    code: 200
    input: []
    output: Grant
    side_effects: []
  - method: GET
    path: "/grants"
    description: "List grants; filterable by identity, entitlement, source request"
    roles: [AccessManager, AccessApprover, CampaignAdmin, Certifier]
    code: 200
    input: ["identity_id?", "entitlement_id?", "source_request_id?", "lifecycle_status?", "review_status?", "limit?", "offset?"]
    output: Grant[]
    side_effects: []
  - method: POST
    path: "/grants/{id}/revoke"
    description: "Manually revoke an active grant (lifecycle ACTIVE->REVOKED)"
    roles: [AccessManager]
    code: 200
    input: []
    output: Grant
    side_effects: ["counters decremented", "effective_risk_score recomputed", "AuditEvent GRANT_REVOKED"]

  # ---------------- CertificationCampaign ----------------
  - method: POST
    path: "/certification-campaigns"
    description: "Create a certification campaign (DRAFT) scoped to a role"
    roles: [CampaignAdmin]
    code: 201
    input: [name, scope_role_id, review_window_start, review_window_end]
    output: CertificationCampaign
    side_effects: ["status=DRAFT", "posture=OPEN"]
  - method: GET
    path: "/certification-campaigns/{id}"
    description: "Get a campaign with posture, completion, projected/realized revocation counts"
    roles: [CampaignAdmin, Certifier, AccessManager]
    code: 200
    input: []
    output: CertificationCampaign
    side_effects: []
  - method: GET
    path: "/certification-campaigns"
    description: "List campaigns; filterable by scope role"
    roles: [CampaignAdmin, Certifier, AccessManager]
    code: 200
    input: ["scope_role_id?", "status?", "limit?", "offset?"]
    output: CertificationCampaign[]
    side_effects: []
  - method: POST
    path: "/certification-campaigns/{id}/launch"
    description: "Launch (DRAFT->ACTIVE); enrolls active in-scope grants, creates items"
    roles: [CampaignAdmin]
    code: 200
    input: []
    output: CertificationCampaign
    side_effects: ["create CertificationItem per in-scope ACTIVE grant", "grant review_status NOT_DUE->UNDER_REVIEW", "item_count set", "window-overlap check"]
  - method: POST
    path: "/certification-campaigns/{id}/close"
    description: "Close (ACTIVE->CLOSED); auto-revokes undecided items"
    roles: [CampaignAdmin]
    code: 200
    input: []
    output: CertificationCampaign
    side_effects: ["undecided items REVOKED -> grants revoked (cascade)", "realized_revocation_count set", "posture=COMPLETE"]
  - method: GET
    path: "/certification-campaigns/{id}/items"
    description: "List items of a campaign (FK reverse-reachability for CertificationItem.campaign_id)"
    roles: [CampaignAdmin, Certifier, AccessManager]
    code: 200
    input: ["decision_status?", "limit?", "offset?"]
    output: CertificationItem[]
    side_effects: []

  # ---------------- CertificationItem ----------------
  - method: GET
    path: "/certification-items/{id}"
    description: "Get a certification item"
    roles: [CampaignAdmin, Certifier, AccessManager]
    code: 200
    input: []
    output: CertificationItem
    side_effects: []
  - method: GET
    path: "/certification-items"
    description: "List certification items; filterable by grant (FK reverse-reachability for CertificationItem.grant_id)"
    roles: [CampaignAdmin, Certifier, AccessManager]
    code: 200
    input: ["grant_id?", "campaign_id?", "decision_status?", "limit?", "offset?"]
    output: CertificationItem[]
    side_effects: []
  - method: POST
    path: "/certification-items/{id}/certify"
    description: "Certify an item (keep the grant); bubbles grant review_status to CERTIFIED"
    roles: [Certifier]
    code: 200
    input: []
    output: CertificationItem
    side_effects: ["decision_status=CERTIFIED", "grant review_status UNDER_REVIEW->CERTIFIED", "completion_pct recomputed", "AuditEvent ITEM_CERTIFIED"]
  - method: POST
    path: "/certification-items/{id}/revoke"
    description: "Revoke an item; cascades grant lifecycle ACTIVE->REVOKED"
    roles: [Certifier]
    code: 200
    input: []
    output: CertificationItem
    side_effects: ["decision_status=REVOKED", "grant review_status->FLAGGED and lifecycle ACTIVE->REVOKED (cascade)", "Identity counters recomputed", "completion_pct recomputed"]

  # ---------------- AuditEvent ----------------
  - method: GET
    path: "/audit-events/{id}"
    description: "Get a single audit evidence record"
    roles: [AccessManager, AccessApprover, CampaignAdmin, Certifier]
    code: 200
    input: []
    output: AuditEvent
    side_effects: []
  - method: GET
    path: "/audit-events"
    description: "List audit evidence; filterable by subject identity (FK reverse-reachability for AuditEvent.subject_identity_id)"
    roles: [AccessManager, AccessApprover, CampaignAdmin, Certifier]
    code: 200
    input: ["subject_identity_id?", "event_type?", "limit?", "offset?"]
    output: AuditEvent[]
    side_effects: []

  # ---------------- Test-driving clock ----------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server clock for deterministic time-gated tests (JIT windows, campaign windows)"
    roles: [CatalogAdmin, AccessManager, CampaignAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["server current UTC set to provided timestamp"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role or X-User-ID header missing" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Acting role not permitted for this operation per §1.7" }
  - { id: ERR_VALIDATION, http: 400, condition: "Malformed body or missing required field" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource id does not resolve" }
  - { id: ERR_INVALID_ENUM, http: 422, condition: "Enum field carries a value outside its declared set" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a state from which the requested transition is defined" }
  - { id: ERR_IDENTITY_NOT_ACTIVE, http: 409, condition: "Operation requires the target Identity.status == ACTIVE" }
  - { id: ERR_ROLE_RETIRED, http: 409, condition: "Requested/scope Role.status == RETIRED" }
  - { id: ERR_ENTITLEMENT_ARCHIVED, http: 409, condition: "A bundled Entitlement.status == ARCHIVED at submit time" }
  - { id: ERR_SOD_SELF_ACTION, http: 403, condition: "Segregation of duties: actor is the requester or the target identity of the request" }
  - { id: ERR_DUAL_APPROVAL_REQUIRED, http: 422, condition: "Privileged role approval missing second_approver_confirmed==true" }
  - { id: ERR_SOD_CONFLICT, http: 409, condition: "A HARD ACTIVE SodPolicy conflict blocks the grant" }
  - { id: ERR_SOD_OVERRIDE_REQUIRED, http: 422, condition: "A SOFT SoD conflict present but sod_override_justification empty" }
  - { id: ERR_JIT_WINDOW_OVERLAP, http: 409, condition: "JIT grant window overlaps another JIT grant of the same (identity, entitlement)" }
  - { id: ERR_CAMPAIGN_NOT_ACTIVE, http: 409, condition: "Certification decision attempted while owning campaign is not ACTIVE" }
  - { id: ERR_CAMPAIGN_WINDOW_OVERLAP, http: 409, condition: "Campaign window overlaps an ACTIVE campaign or violates the buffer after a CLOSED one for the same role" }
  - { id: ERR_IDENTITY_HAS_ACTIVE_GRANTS, http: 409, condition: "Deprovision blocked because active_grant_count > 0" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_identity_version does not match current Identity.version" }
  - { id: ERR_SOD_PAIR_INVALID, http: 422, condition: "SodPolicy entitlement_a_id == entitlement_b_id" }

# =============================================================================
# §1.7 RBAC Matrix  (role_model: segregation_of_duties)
# =============================================================================
roles:
  - name: CatalogAdmin
    description: "Owns the entitlement/role/SoD-policy catalog (configuration)."
    identity: opaque
    exclusive_operations:
      - "POST /entitlements, POST /entitlements/{id}/archive"
      - "POST /roles, POST /roles/{id}/retire"
      - "POST /sod-policies"
    shared_operations:
      - "GET catalog resources (entitlements, roles, sod-policies)"
      - "POST /_clock/set_current_utc"

  - name: AccessManager
    description: "Provisions identities and grants, raises access requests, disables/deprovisions identities. Acts as requester for SoD."
    identity: opaque
    exclusive_operations:
      - "POST /identities, POST /identities/{id}/grants"
      - "POST /identities/{id}/disable|enable|deprovision"
      - "POST /access-requests (raise), POST /access-requests/{id}/submit"
      - "POST /grants/{id}/revoke"
    shared_operations:
      - "GET identities, grants, access-requests, audit-events, entitlements, roles, sod-policies, campaigns, items"
      - "POST /_clock/set_current_utc"

  - name: AccessApprover
    description: "Decides access requests. Segregation of duties: may not be the request's requester nor the target identity."
    identity: opaque
    exclusive_operations:
      - "POST /access-requests/{id}/approve|reject|return"
    shared_operations:
      - "GET identities, grants, access-requests, audit-events, entitlements, roles, sod-policies, campaigns, items"

  - name: CampaignAdmin
    description: "Creates, launches, and closes certification campaigns."
    identity: opaque
    exclusive_operations:
      - "POST /certification-campaigns, POST /certification-campaigns/{id}/launch|close"
    shared_operations:
      - "GET identities, grants, campaigns, items, audit-events, entitlements, roles"
      - "POST /_clock/set_current_utc"

  - name: Certifier
    description: "Reviews certification items, certifying or revoking individual grants."
    identity: opaque
    exclusive_operations:
      - "POST /certification-items/{id}/certify|revoke"
    shared_operations:
      - "GET identities, grants, campaigns, items, audit-events, entitlements, roles"
