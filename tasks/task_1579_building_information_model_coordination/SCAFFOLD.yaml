# =============================================================================
# BIM Coordination & Clash Detection — benchmark seed tables
# =============================================================================

scenario: |
  Building Information Model Coordination & Clash Detection (VDC/BIM coordination team): model authoring standards & level of development by phase, federated model assembly & version control, clash detection run cycle & clash assignment to trade, coordination meeting & resolution tracking, sign-off before fabrication release, as-built model update & handover to facilities, model-based quantity extraction, file exchange & software interoperability

domain_name: bim-coordination
api_prefix: /api

# =============================================================================
# Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: posture_driven_gating
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - version_pinning_on_approval
  entity_topology: hybrid
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate
  entity_count: 16
  state_machine_count: 14
  calculation_count: 14
  validation_layers: 12
  endpoint_count: 72
  error_code_count: 70
  role_count: 6

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# common_fields: true expands to id (server-minted UUID, identity only),
# created_at / updated_at (ISO 8601 UTC, 3 fractional digits), version
# (integer, starts 1, +1 on every mutation of that entity).
# =============================================================================
entities:
  - name: Project
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Project name" }
      - { name: current_phase, type: enum, source: system, default: SCHEMATIC_DESIGN, description: "Design phase; one of SCHEMATIC_DESIGN | DESIGN_DEVELOPMENT | CONSTRUCTION_DOCUMENTS | CONSTRUCTION_ADMINISTRATION | CLOSEOUT; advances only via advance-phase" }
      - { name: coordination_posture, type: enum, source: computed, default: NORMAL, description: "NORMAL | COORDINATION_HOLD; derived from coordination_readiness_index and probation status (see calculations.project_posture)" }
      - { name: coordination_readiness_index, type: integer, source: computed, default: 100, description: "CRI in [0,100]; see calculations.coordination_readiness_index" }
      - { name: open_critical_count, type: integer, source: computed, default: 0, description: "Open (non-VERIFIED) CRITICAL clashes project-wide" }
      - { name: open_major_count, type: integer, source: computed, default: 0, description: "Open MAJOR clashes project-wide" }
      - { name: unassigned_minor_count, type: integer, source: computed, default: 0, description: "MINOR clashes in NEW or REOPENED status project-wide" }
      - { name: overdue_commitment_count, type: integer, source: computed, default: 0, description: "ResolutionCommitments in COMMITTED with due_at strictly before logical clock" }
      - { name: ops_sweep_index, type: integer, source: system, default: 0, description: "Monotonic counter, +1 per run-coordination-sweep" }

  - name: LodRequirement
    parent: Project
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> Project.id; owning project" }
      - { name: discipline, type: enum, source: input, description: "ARCHITECTURAL | STRUCTURAL | MECHANICAL | ELECTRICAL | PLUMBING | FIRE_PROTECTION" }
      - { name: phase, type: enum, source: input, description: "Phase this requirement applies to; same enum as Project.current_phase" }
      - { name: min_lod, type: integer, source: input, description: "Minimum level of development; must be one of 100, 200, 300, 350, 400, 500" }
      - { name: clearance_requirement_mm, type: number, source: input, description: "Required clearance in millimetres (> 0); reference tolerance for MINOR clash classification" }
    # uniqueness: (project_id, discipline, phase) -> ERR_DUPLICATE_LOD_REQUIREMENT

  - name: TradePartner
    parent: Project
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> Project.id; owning project" }
      - { name: company_name, type: string, source: input, description: "Company name; unique within project -> ERR_DUPLICATE_TRADE_PARTNER" }
      - { name: discipline, type: enum, source: input, description: "Same discipline enum as LodRequirement" }
      - { name: hourly_rate_cents, type: integer, source: input, description: "Loaded labor rate in cents per hour (> 0); drives clash cost calculations" }
      - { name: coordination_budget_hours, type: number, source: input, description: "Fiscal budget: total resolution labor hours this partner may consume (>= 0)" }
      - { name: consumed_resolution_hours, type: number, source: computed, default: 0, description: "Sum of actual_labor_hours debited at clash resolve; never refunded" }
      - { name: reliability_score, type: number, source: computed, default: 100, description: "Starts 100; reduced on commitment breach per calculations.trade_partner_reliability" }
      - { name: breach_count, type: integer, source: computed, default: 0, description: "Number of BREACHED commitments authored by this partner" }
      - { name: software_platform, type: enum, source: input, description: "REVIT | TEKLA | ARCHICAD | IFC_ONLY; authoring platform for interop matrix" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | PROBATION; PROBATION when reliability_score < 40" }

  - name: TradeModel
    parent: Project
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> Project.id; owning project" }
      - { name: trade_partner_id, type: string, source: input, description: "FK -> TradePartner.id; authoring partner (must equal X-User-ID of the TradeModelAuthor)" }
      - { name: discipline, type: enum, source: computed, description: "Copied from TradePartner.discipline at creation" }
      - { name: revision_number, type: integer, source: system, description: "Per-(project, discipline) monotonic revision, starts at 1" }
      - { name: file_format, type: enum, source: input, description: "RVT | IFC | NWC | DWG; file exchange format of the uploaded model" }
      - { name: interop_status, type: enum, source: computed, description: "NATIVE | CONVERTIBLE | INCOMPATIBLE; computed at creation from (software_platform, file_format) interop matrix" }
      - { name: declared_lod, type: integer, source: input, description: "Author-declared level of development, integer 0..500" }
      - { name: life_safety_elements, type: integer, source: input, description: "Element count in life-safety criticality class (>= 0)" }
      - { name: life_safety_compliant, type: integer, source: input, description: "Compliant elements within life-safety class (0 <= x <= life_safety_elements)" }
      - { name: envelope_elements, type: integer, source: input, description: "Element count in weather-envelope class (>= 0)" }
      - { name: envelope_compliant, type: integer, source: input, description: "Compliant within envelope class (0 <= x <= envelope_elements)" }
      - { name: finish_elements, type: integer, source: input, description: "Element count in finish class (>= 0)" }
      - { name: finish_compliant, type: integer, source: input, description: "Compliant within finish class (0 <= x <= finish_elements)" }
      - { name: submission_score, type: number, source: computed, description: "Element-count-weighted compliance score, null until first submit; see calculations.model_submission_score" }
      - { name: audit_score, type: number, source: computed, description: "Criticality-weighted compliance score, null until accepted; see calculations.model_audit_score" }
      - { name: supersedes_model_id, type: string, source: system, description: "FK -> TradeModel.id; nullable; set at accept time to the prior ACCEPTED revision of the same (project, discipline) that this revision supersedes" }
      - { name: submitted_by_user_id, type: string, source: system, description: "X-User-ID captured at submit; segregation-of-duties reference for sign-off" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | SUBMITTED | ACCEPTED | REJECTED | SUPERSEDED" }

  - name: FederatedModel
    parent: Project
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> Project.id; owning project" }
      - { name: label, type: string, source: input, description: "Assembly label" }
      - { name: assembly_index, type: integer, source: system, description: "Per-project monotonic assembly counter, starts at 1" }
      - { name: target_format, type: enum, source: input, description: "IFC | NWC; exchange target format for the assembled federation" }
      - { name: status, type: enum, source: system, description: "DRAFT | ASSEMBLED | FROZEN | RELEASED | SUPERSEDED; initial ASSEMBLED if all members already ACCEPTED else DRAFT" }
      - { name: is_stale, type: boolean, source: computed, default: false, description: "Event-driven staleness flag: set true when a member TradeModel is superseded (cascade A re-points the member but keeps the old pinned_model_version); cleared on freeze, which re-pins every member to its current version" }
      - { name: open_critical_count, type: integer, source: computed, default: 0, description: "Open CRITICAL clashes across this model's clash runs" }

  - name: FederatedModelMember
    parent: FederatedModel
    common_fields: true
    fields:
      - { name: federated_model_id, type: string, source: system, description: "FK -> FederatedModel.id; owning assembly" }
      - { name: trade_model_id, type: string, source: input, description: "FK -> TradeModel.id; member model (auto-repointed to the superseding revision on supersede cascade)" }
      - { name: discipline, type: enum, source: computed, description: "Copied from the referenced TradeModel" }
      - { name: pinned_model_version, type: integer, source: system, description: "TradeModel.version pinned at assembly create; re-pinned to current version at freeze" }

  - name: FreezeWindow
    parent: FederatedModel
    common_fields: true
    fields:
      - { name: federated_model_id, type: string, source: system, description: "FK -> FederatedModel.id; assembly this freeze applies to" }
      - { name: starts_at, type: datetime, source: input, description: "Closed-interval start (ISO 8601 UTC)" }
      - { name: ends_at, type: datetime, source: input, description: "Closed-interval end (ISO 8601 UTC); must be strictly after starts_at" }
      - { name: purpose, type: enum, source: input, description: "COORDINATION_FREEZE | FABRICATION_HOLD | HANDOVER_FREEZE; only COORDINATION_FREEZE blocks clash-run start" }

  - name: ClashDetectionRun
    parent: FederatedModel
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> Project.id; denormalized scope" }
      - { name: federated_model_id, type: string, source: system, description: "FK -> FederatedModel.id; assembly under test (from path)" }
      - { name: run_index, type: integer, source: system, description: "Per-federated-model monotonic run counter, starts at 1" }
      - { name: tolerance_mm, type: number, source: input, description: "Verification tolerance in mm (> 0); re-inspection overlap <= tolerance verifies a clash" }
      - { name: status, type: enum, source: system, default: QUEUED, description: "QUEUED | RUNNING | COMPLETED" }
      - { name: total_clash_count, type: integer, source: computed, default: 0, description: "Clashes imported into this run" }
      - { name: open_clash_count, type: integer, source: computed, default: 0, description: "Clashes in NEW | ASSIGNED | RESOLVED | REOPENED" }
      - { name: closed_clash_count, type: integer, source: computed, default: 0, description: "Clashes in VERIFIED" }
      - { name: started_at, type: datetime, source: system, description: "Logical-clock timestamp at start; null until RUNNING" }
      - { name: completed_at, type: datetime, source: system, description: "Logical-clock timestamp at completion; null until COMPLETED" }

  - name: ClashIssue
    parent: ClashDetectionRun
    common_fields: true
    fields:
      - { name: clash_run_id, type: string, source: system, description: "FK -> ClashDetectionRun.id; owning run (from path)" }
      - { name: federated_model_id, type: string, source: system, description: "FK -> FederatedModel.id; denormalized from the run" }
      - { name: element_pair, type: string, source: input, description: "Element reference pair, e.g. 'STR-1042/MEP-3391'" }
      - { name: overlap_mm, type: number, source: input, description: "Penetration depth in mm (>= 0); 0 means clearance-only violation" }
      - { name: spans_disciplines, type: boolean, source: input, description: "True when the two elements belong to different trade disciplines" }
      - { name: severity, type: enum, source: computed, description: "CRITICAL | MAJOR | MINOR; from calculations.clash_severity_classification" }
      - { name: assigned_trade_partner_id, type: string, source: system, description: "FK -> TradePartner.id; nullable until assigned" }
      - { name: assigned_by_user_id, type: string, source: system, description: "X-User-ID of the assigning BIMCoordinator; SoD reference for verify" }
      - { name: provisional_cost_cents, type: integer, source: computed, description: "Forward-looking estimate computed at assign; see calculations.clash_provisional_cost" }
      - { name: actual_labor_hours, type: number, source: system, description: "Claimed resolution hours recorded at resolve; null until then" }
      - { name: resolved_by_user_id, type: string, source: system, description: "X-User-ID recorded at resolve" }
      - { name: actual_cost_cents, type: integer, source: computed, description: "Final cost computed at verify; see calculations.clash_actual_cost; null until first VERIFIED; overwritten by each subsequent passing verify after a reopen cycle" }
      - { name: cycle_count, type: integer, source: system, default: 0, description: "+1 each time the clash enters REOPENED" }
      - { name: status, type: enum, source: system, default: NEW, description: "NEW | ASSIGNED | RESOLVED | VERIFIED | REOPENED" }

  - name: CoordinationMeeting
    parent: Project
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> Project.id; owning project" }
      - { name: room_id, type: string, source: input, description: "Room/resource identifier; bookings are per (project_id, room_id)" }
      - { name: starts_at, type: datetime, source: input, description: "Half-open interval start (ISO 8601 UTC)" }
      - { name: ends_at, type: datetime, source: input, description: "Half-open interval end; must be strictly after starts_at" }
      - { name: status, type: enum, source: system, default: SCHEDULED, description: "SCHEDULED | IN_SESSION | ADJOURNED" }
      - { name: commitment_count, type: integer, source: computed, default: 0, description: "Commitments created in this meeting" }
      - { name: fulfilled_commitment_count, type: integer, source: computed, default: 0, description: "Commitments in FULFILLED" }
      - { name: breached_commitment_count, type: integer, source: computed, default: 0, description: "Commitments in BREACHED" }

  - name: ResolutionCommitment
    parent: CoordinationMeeting
    common_fields: true
    fields:
      - { name: meeting_id, type: string, source: system, description: "FK -> CoordinationMeeting.id; owning meeting (from path)" }
      - { name: clash_issue_id, type: string, source: input, description: "FK -> ClashIssue.id; clash this commitment resolves (must be ASSIGNED)" }
      - { name: committed_by_partner_id, type: string, source: input, description: "FK -> TradePartner.id; must equal the clash's assigned_trade_partner_id" }
      - { name: due_at, type: datetime, source: input, description: "Resolution due timestamp (ISO 8601 UTC); breach when logical clock passes it while COMMITTED" }
      - { name: status, type: enum, source: system, default: COMMITTED, description: "COMMITTED | FULFILLED | BREACHED | WAIVED" }
      - { name: fulfilled_at, type: datetime, source: system, description: "Logical-clock timestamp when the linked clash was VERIFIED; null otherwise" }

  - name: FabricationPackage
    parent: Project
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> Project.id; owning project" }
      - { name: federated_model_id, type: string, source: input, description: "FK -> FederatedModel.id; frozen baseline this package fabricates from" }
      - { name: requesting_partner_id, type: string, source: system, description: "FK -> TradePartner.id; set from X-User-ID of the FabricationLead" }
      - { name: scope_disciplines, type: array, source: input, description: "1..3 unique discipline enums; each must have a member in the federated model" }
      - { name: required_signoff_count, type: integer, source: system, description: "= number of scope_disciplines; one SignOff per discipline" }
      - { name: signed_count, type: integer, source: computed, default: 0, description: "SignOffs of this package currently in SIGNED" }
      - { name: pinned_fed_model_version, type: integer, source: system, description: "FederatedModel.version pinned at package creation" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | SIGNOFF_IN_PROGRESS | READY_FOR_RELEASE | RELEASED | VOID" }
      - { name: released_at, type: datetime, source: system, description: "Logical-clock timestamp at release; null otherwise" }

  - name: SignOff
    parent: FabricationPackage
    common_fields: true
    fields:
      - { name: fabrication_package_id, type: string, source: system, description: "FK -> FabricationPackage.id; owning package" }
      - { name: discipline, type: enum, source: system, description: "Scope discipline this sign-off covers" }
      - { name: trade_model_id, type: string, source: system, description: "FK -> TradeModel.id; the federated member model for this discipline at submit-for-signoff time" }
      - { name: pinned_model_version, type: integer, source: system, description: "TradeModel.version pinned at submit-for-signoff" }
      - { name: signer_user_id, type: string, source: system, description: "X-User-ID of the signing LeadEngineer; null until SIGNED" }
      - { name: status, type: enum, source: system, default: REQUESTED, description: "REQUESTED | SIGNED | DECLINED | REVOKED" }

  - name: AsBuiltModel
    parent: Project
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> Project.id; owning project" }
      - { name: trade_model_id, type: string, source: input, description: "FK -> TradeModel.id; fabrication-basis model (must be ACCEPTED or SUPERSEDED)" }
      - { name: trade_partner_id, type: string, source: system, description: "FK -> TradePartner.id; copied from the basis model; must equal X-User-ID" }
      - { name: field_verification_notes, type: string, source: input, description: "Free-text field notes from the as-built survey" }
      - { name: verification_deviation_mm, type: number, source: system, description: "Max deviation recorded at verify; null until then" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | SUBMITTED | FIELD_VERIFIED | REJECTED" }

  - name: QuantityTakeoff
    parent: Project
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> Project.id; owning project" }
      - { name: federated_model_id, type: string, source: input, description: "FK -> FederatedModel.id; model the quantities are extracted from (must be FROZEN or RELEASED)" }
      - { name: extraction_mode, type: enum, source: input, description: "GROSS | NET; selects the dual-variant quantity algorithm" }
      - { name: discipline_filter, type: enum, source: input, required: false, description: "Optional discipline restriction for the extraction" }
      - { name: elements, type: array, source: input, description: "Non-empty array of {element_ref, gross_qty, deduction_qty}; each gross_qty >= deduction_qty >= 0" }
      - { name: element_count, type: integer, source: computed, description: "= number of elements" }
      - { name: total_quantity, type: number, source: computed, description: "Extracted total per calculations.quantity_extraction_total (3 decimals)" }
      - { name: status, type: enum, source: system, default: EXTRACTED, description: "EXTRACTED | APPROVED | SUPERSEDED" }

  - name: HandoverPackage
    parent: Project
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> Project.id; owning project" }
      - { name: label, type: string, source: input, description: "Handover package label" }
      - { name: includes_takeoff_id, type: string, source: input, description: "FK -> QuantityTakeoff.id; the approved quantity record handed to facilities" }
      - { name: status, type: enum, source: system, default: ASSEMBLING, description: "ASSEMBLING | READY | TRANSMITTED | FM_ACCEPTED | FM_REJECTED" }
      - { name: transmitted_at, type: datetime, source: system, description: "Logical-clock timestamp at transmit; null otherwise" }
      - { name: fm_decision_by_user_id, type: string, source: system, description: "X-User-ID of the FacilitiesManager who responded; null until respond" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Project
    field: current_phase
    initial_state: SCHEMATIC_DESIGN
    terminal_states: [CLOSEOUT]
    transitions:
      - from: SCHEMATIC_DESIGN
        to: DESIGN_DEVELOPMENT
        trigger: "POST /api/projects/{id}/advance-phase"
        actor: VDCManager
        preconditions: ["current_phase != CLOSEOUT (ERR_INVALID_PHASE_TRANSITION)"]
        side_effects: ["increments Project.version by 1"]
      - from: DESIGN_DEVELOPMENT
        to: CONSTRUCTION_DOCUMENTS
        trigger: "POST /api/projects/{id}/advance-phase"
        actor: VDCManager
        preconditions: ["current_phase != CLOSEOUT (ERR_INVALID_PHASE_TRANSITION)"]
        side_effects: ["increments Project.version by 1"]
      - from: CONSTRUCTION_DOCUMENTS
        to: CONSTRUCTION_ADMINISTRATION
        trigger: "POST /api/projects/{id}/advance-phase"
        actor: VDCManager
        preconditions: ["current_phase != CLOSEOUT (ERR_INVALID_PHASE_TRANSITION)"]
        side_effects: ["increments Project.version by 1"]
      - from: CONSTRUCTION_ADMINISTRATION
        to: CLOSEOUT
        trigger: "POST /api/projects/{id}/advance-phase"
        actor: VDCManager
        preconditions: ["current_phase != CLOSEOUT (ERR_INVALID_PHASE_TRANSITION)"]
        side_effects: ["increments Project.version by 1"]

  - entity: Project
    field: coordination_posture
    initial_state: NORMAL
    terminal_states: []
    note: "Parallel state dimension to current_phase: posture evolves independently of phase. Derived, never set directly; recomputed on every clash/commitment mutation and on sweep."
    transitions:
      - from: NORMAL
        to: COORDINATION_HOLD
        trigger: "system (coordination_readiness_index < 60, or any PROBATION TradePartner has >= 1 open assigned clash)"
        actor: system
        preconditions: []
        side_effects:
          - "Blocks federated-model release and fabrication-package release while held (ERR_PROJECT_IN_COORDINATION_HOLD)"
      - from: COORDINATION_HOLD
        to: NORMAL
        trigger: "system (coordination_readiness_index >= 60 AND no PROBATION partner has an open assigned clash)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: TradeModel
    field: status
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /api/trade-models/{id}/submit"
        actor: TradeModelAuthor
        preconditions:
          - "status in {DRAFT, REJECTED} (ERR_MODEL_NOT_SUBMITTABLE)"
          - "ownership: X-User-ID == trade_partner_id (ERR_FORBIDDEN_OWNERSHIP)"
          - "declared_lod >= LodRequirement[discipline, project.current_phase].min_lod when that row exists (ERR_LOD_BELOW_PHASE_REQUIREMENT)"
          - "interop_status != INCOMPATIBLE (ERR_INTEROP_INCOMPATIBLE_FORMAT)"
        side_effects:
          - "submitted_by_user_id := X-User-ID"
          - "submission_score := calculations.model_submission_score"
      - from: REJECTED
        to: SUBMITTED
        trigger: "POST /api/trade-models/{id}/submit"
        actor: TradeModelAuthor
        preconditions:
          - "same checks as DRAFT -> SUBMITTED (rework loop)"
        side_effects:
          - "submitted_by_user_id := X-User-ID"
          - "submission_score recomputed"
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /api/trade-models/{id}/accept"
        actor: BIMCoordinator
        preconditions:
          - "status == SUBMITTED (ERR_MODEL_NOT_SUBMITTED)"
        side_effects:
          - "audit_score := calculations.model_audit_score"
          - "CASCADE A link 1: if a prior ACCEPTED revision X exists for the same (project_id, discipline), X -> SUPERSEDED and this model's supersedes_model_id := X.id"
          - "CASCADE A link 2: every FederatedModelMember with trade_model_id == X.id is re-pointed to this model; each containing FederatedModel in FROZEN -> ASSEMBLED with is_stale = true; in DRAFT/ASSEMBLED/RELEASED keeps status, is_stale = true"
          - "CASCADE A link 3: on each federated model that left FROZEN, every SignOff in SIGNED whose fabrication_package pins that federated model -> REVOKED"
          - "CASCADE A link 4: each affected FabricationPackage whose signed_count fell below required_signoff_count: READY_FOR_RELEASE -> SIGNOFF_IN_PROGRESS"
          - "bubble-up: every federated model in DRAFT whose members are now all ACCEPTED -> ASSEMBLED"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /api/trade-models/{id}/reject"
        actor: BIMCoordinator
        preconditions:
          - "status == SUBMITTED (ERR_MODEL_NOT_SUBMITTED)"
        side_effects: []
      - from: ACCEPTED
        to: SUPERSEDED
        trigger: "system (a newer revision of the same (project_id, discipline) is ACCEPTED)"
        actor: system
        preconditions: []
        side_effects: ["member re-point + unfreeze + sign-off revocation cascade per CASCADE A"]

  - entity: FederatedModel
    field: status
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    note: "Initial status is ASSEMBLED instead of DRAFT when every member model is already ACCEPTED at creation time (compound derivation from member states)."
    transitions:
      - from: DRAFT
        to: ASSEMBLED
        trigger: "system (all member TradeModels are ACCEPTED; evaluated on every member accept)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ASSEMBLED
        to: FROZEN
        trigger: "POST /api/federated-models/{id}/freeze"
        actor: VDCManager
        preconditions:
          - "status == ASSEMBLED (ERR_FED_NOT_ASSEMBLED)"
          - "every member's TradeModel.audit_score >= AUDIT_ACCEPT_THRESHOLD (ERR_MEMBER_COMPLIANCE_BELOW_THRESHOLD)"
        side_effects:
          - "each member's pinned_model_version := that TradeModel's current version"
          - "is_stale := false"
      - from: FROZEN
        to: ASSEMBLED
        trigger: "POST /api/federated-models/{id}/unfreeze, or system (CASCADE A link 2: a member model was superseded)"
        actor: "VDCManager or system"
        preconditions:
          - "manual: status == FROZEN (ERR_FED_NOT_FROZEN)"
        side_effects:
          - "is_stale := true"
          - "cascade: SignOffs in SIGNED on packages pinning this federated model -> REVOKED; affected packages READY_FOR_RELEASE -> SIGNOFF_IN_PROGRESS"
      - from: FROZEN
        to: RELEASED
        trigger: "POST /api/federated-models/{id}/release"
        actor: VDCManager
        preconditions:
          - "status == FROZEN (ERR_FED_NOT_FROZEN)"
          - "project coordination_posture == NORMAL (ERR_PROJECT_IN_COORDINATION_HOLD — priority 7, evaluated before the open-clash constraint)"
          - "open_critical_count == 0 (ERR_OPEN_CLASHES_REMAIN — priority 9)"
        side_effects: []
      - from: DRAFT
        to: SUPERSEDED
        trigger: "system (a newer FederatedModel is created in the same project)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ASSEMBLED
        to: SUPERSEDED
        trigger: "system (a newer FederatedModel is created in the same project)"
        actor: system
        preconditions: []
        side_effects: []
      - from: FROZEN
        to: SUPERSEDED
        trigger: "system (a newer FederatedModel is created in the same project)"
        actor: system
        preconditions: []
        side_effects: ["SignOffs in SIGNED on packages pinning this model -> REVOKED (same cascade as unfreeze)"]
      - from: RELEASED
        to: SUPERSEDED
        trigger: "system (a newer FederatedModel is created in the same project)"
        actor: system
        preconditions: []
        side_effects: ["SignOffs on packages pinning this model are NOT revoked (issued record preserved)"]

  - entity: FreezeWindow
    field: null
    initial_state: null
    terminal_states: []
    note: "Stateless scheduling record; 'active' is derived: a window is active at logical time t iff starts_at <= t <= ends_at (closed interval, both ends inclusive)."
    transitions: []

  - entity: ClashDetectionRun
    field: status
    initial_state: QUEUED
    terminal_states: [COMPLETED]
    transitions:
      - from: QUEUED
        to: RUNNING
        trigger: "POST /api/clash-runs/{id}/start"
        actor: BIMCoordinator
        preconditions:
          - "status == QUEUED (ERR_RUN_NOT_QUEUED)"
          - "federated model still FROZEN (ERR_FED_NOT_FROZEN)"
          - "all member TradeModels are ACCEPTED (ERR_MODEL_NOT_ACCEPTED)"
          - "no COORDINATION_FREEZE FreezeWindow on this federated model is active at the logical clock (ERR_FREEZE_WINDOW_ACTIVE)"
        side_effects: ["started_at := logical clock"]
      - from: RUNNING
        to: COMPLETED
        trigger: "POST /api/clash-runs/{id}/complete"
        actor: BIMCoordinator
        preconditions:
          - "status == RUNNING (ERR_RUN_NOT_RUNNING)"
          - "no clash of this run is in NEW status (ERR_RUN_HAS_UNASSIGNED_CLASHES)"
        side_effects: ["completed_at := logical clock"]

  - entity: ClashIssue
    field: status
    initial_state: NEW
    terminal_states: []
    note: "Cyclic machine: VERIFIED is a resting state, not terminal; reopen may cycle indefinitely (cycle_count tracks loops)."
    transitions:
      - from: NEW
        to: ASSIGNED
        trigger: "POST /api/clash-issues/{id}/assign"
        actor: BIMCoordinator
        preconditions:
          - "status in {NEW, REOPENED} (ERR_CLASH_NOT_ASSIGNABLE)"
          - "assigned TradePartner exists in the clash's project (ERR_TRADE_PARTNER_NOT_FOUND / ERR_CROSS_PROJECT_REFERENCE)"
          - "assigned TradePartner.status == ACTIVE (ERR_TRADE_PARTNER_ON_PROBATION)"
        side_effects:
          - "assigned_trade_partner_id, assigned_by_user_id := inputs"
          - "provisional_cost_cents := calculations.clash_provisional_cost"
      - from: REOPENED
        to: ASSIGNED
        trigger: "POST /api/clash-issues/{id}/assign"
        actor: BIMCoordinator
        preconditions: ["same as NEW -> ASSIGNED"]
        side_effects: ["same as NEW -> ASSIGNED (provisional_cost_cents recomputed against the newly assigned partner)"]
      - from: ASSIGNED
        to: RESOLVED
        trigger: "POST /api/clash-issues/{id}/resolve"
        actor: TradeModelAuthor
        preconditions:
          - "status == ASSIGNED (ERR_CLASH_NOT_RESOLVABLE)"
          - "ownership: X-User-ID == assigned_trade_partner_id (ERR_FORBIDDEN_OWNERSHIP)"
          - "actual_labor_hours > 0 (ERR_INVALID_REQUEST)"
          - "actual_labor_hours <= (assigned partner's coordination_budget_hours - consumed_resolution_hours) (ERR_COORDINATION_BUDGET_EXCEEDED)"
        side_effects:
          - "resolved_by_user_id := X-User-ID; actual_labor_hours recorded"
          - "partner.consumed_resolution_hours += actual_labor_hours"
      - from: RESOLVED
        to: VERIFIED
        trigger: "POST /api/clash-issues/{id}/verify with re_inspection_overlap_mm <= run.tolerance_mm"
        actor: BIMCoordinator
        preconditions:
          - "status == RESOLVED (ERR_CLASH_NOT_VERIFIABLE)"
          - "SoD: X-User-ID != assigned_by_user_id (ERR_SOD_VERIFY_EQUALS_ASSIGN)"
        side_effects:
          - "actual_cost_cents := calculations.clash_actual_cost"
          - "run counters: open_clash_count -= 1, closed_clash_count += 1 (total conserved)"
          - "CASCADE C link 2: the linked ResolutionCommitment in COMMITTED with due_at >= logical clock -> FULFILLED (fulfilled_at := clock)"
          - "CASCADE C link 3: parent meeting's fulfilled_commitment_count recomputed"
          - "project CRI and posture recomputed"
      - from: RESOLVED
        to: REOPENED
        trigger: "POST /api/clash-issues/{id}/verify with re_inspection_overlap_mm > run.tolerance_mm (failed re-inspection)"
        actor: BIMCoordinator
        preconditions:
          - "status == RESOLVED (ERR_CLASH_NOT_VERIFIABLE)"
          - "SoD: X-User-ID != assigned_by_user_id (ERR_SOD_VERIFY_EQUALS_ASSIGN)"
        side_effects:
          - "cycle_count += 1"
          - "project CRI and posture recomputed"
      - from: VERIFIED
        to: REOPENED
        trigger: "POST /api/clash-issues/{id}/reopen"
        actor: BIMCoordinator
        preconditions:
          - "status == VERIFIED (ERR_CLASH_NOT_REOPENABLE)"
        side_effects:
          - "cycle_count += 1"
          - "run counters: open_clash_count += 1, closed_clash_count -= 1 (total conserved)"
          - "CASCADE B link 2: the linked ResolutionCommitment in FULFILLED -> BREACHED (fulfilled work invalidated)"
          - "CASCADE B link 3: calculations.trade_partner_reliability applied to the commitment's partner; if score < 40 the partner ACTIVE -> PROBATION"
          - "project CRI and posture recomputed"

  - entity: CoordinationMeeting
    field: status
    initial_state: SCHEDULED
    terminal_states: [ADJOURNED]
    transitions:
      - from: SCHEDULED
        to: IN_SESSION
        trigger: "POST /api/coordination-meetings/{id}/start"
        actor: BIMCoordinator
        preconditions:
          - "status == SCHEDULED (ERR_MEETING_NOT_SCHEDULED)"
          - "logical clock within [starts_at, ends_at) (ERR_MEETING_WINDOW_NOT_ACTIVE)"
        side_effects: []
      - from: IN_SESSION
        to: ADJOURNED
        trigger: "POST /api/coordination-meetings/{id}/adjourn"
        actor: BIMCoordinator
        preconditions:
          - "status == IN_SESSION (ERR_MEETING_NOT_IN_SESSION)"
        side_effects: []

  - entity: ResolutionCommitment
    field: status
    initial_state: COMMITTED
    terminal_states: [BREACHED, WAIVED]
    note: "FULFILLED is NOT terminal: CASCADE B (clash reopen) moves FULFILLED -> BREACHED."
    transitions:
      - from: COMMITTED
        to: FULFILLED
        trigger: "system (CASCADE C: linked clash verified before due_at)"
        actor: system
        preconditions: ["logical clock <= due_at at verify time"]
        side_effects: ["fulfilled_at := logical clock"]
      - from: COMMITTED
        to: BREACHED
        trigger: "system (run-coordination-sweep: logical clock > due_at while still COMMITTED)"
        actor: system
        preconditions: []
        side_effects: ["calculations.trade_partner_reliability applied to committed_by_partner_id", "meeting breached_commitment_count recomputed", "project CRI/posture recomputed"]
      - from: COMMITTED
        to: WAIVED
        trigger: "POST /api/commitments/{id}/waive"
        actor: BIMCoordinator
        preconditions: ["status == COMMITTED (ERR_COMMITMENT_NOT_OPEN)"]
        side_effects: ["project overdue_commitment_count / CRI recomputed"]
      - from: FULFILLED
        to: BREACHED
        trigger: "system (CASCADE B link 2: the linked clash was reopened, invalidating the fulfilled resolution)"
        actor: system
        preconditions: []
        side_effects: ["calculations.trade_partner_reliability applied to committed_by_partner_id", "meeting fulfilled/breached counts recomputed", "project CRI/posture recomputed"]

  - entity: FabricationPackage
    field: status
    initial_state: DRAFT
    terminal_states: [RELEASED, VOID]
    transitions:
      - from: DRAFT
        to: SIGNOFF_IN_PROGRESS
        trigger: "POST /api/fabrication-packages/{id}/submit-for-signoff"
        actor: FabricationLead
        preconditions:
          - "status in {DRAFT, SIGNOFF_IN_PROGRESS} (ERR_PACKAGE_NOT_DRAFT)"
          - "ownership: X-User-ID == requesting_partner_id (ERR_FORBIDDEN_OWNERSHIP)"
        side_effects:
          - "from DRAFT: create one REQUESTED SignOff per scope discipline, each pinned to the federated member TradeModel of that discipline and its current version"
          - "from SIGNOFF_IN_PROGRESS (re-request): every SignOff in DECLINED or REVOKED -> REQUESTED; SIGNED sign-offs untouched"
      - from: SIGNOFF_IN_PROGRESS
        to: READY_FOR_RELEASE
        trigger: "system (signed_count == required_signoff_count; evaluated on every sign)"
        actor: system
        preconditions: []
        side_effects: []
      - from: READY_FOR_RELEASE
        to: SIGNOFF_IN_PROGRESS
        trigger: "system (CASCADE A link 4: a SIGNED SignOff was REVOKED, signed_count < required_signoff_count)"
        actor: system
        preconditions: []
        side_effects: []
      - from: READY_FOR_RELEASE
        to: RELEASED
        trigger: "POST /api/fabrication-packages/{id}/release"
        actor: FabricationLead
        preconditions:
          - "status == READY_FOR_RELEASE (ERR_PACKAGE_NOT_RELEASABLE)"
          - "ownership: X-User-ID == requesting_partner_id (ERR_FORBIDDEN_OWNERSHIP)"
          - "federated model status in {FROZEN, RELEASED} (ERR_FED_NOT_FROZEN)"
          - "project current_phase in {CONSTRUCTION_DOCUMENTS, CONSTRUCTION_ADMINISTRATION} (ERR_PHASE_TOO_EARLY_FOR_FABRICATION)"
          - "project coordination_posture == NORMAL (ERR_PROJECT_IN_COORDINATION_HOLD)"
          - "coordination_readiness_index >= CRI_RELEASE_THRESHOLD (ERR_CRI_BELOW_RELEASE_THRESHOLD)"
        side_effects: ["released_at := logical clock"]
      - from: DRAFT
        to: VOID
        trigger: "POST /api/fabrication-packages/{id}/void"
        actor: FabricationLead
        preconditions:
          - "status in {DRAFT, SIGNOFF_IN_PROGRESS, READY_FOR_RELEASE} (ERR_PACKAGE_ALREADY_FINAL)"
          - "ownership: X-User-ID == requesting_partner_id (ERR_FORBIDDEN_OWNERSHIP)"
        side_effects: ["all SignOffs not already REVOKED -> REVOKED"]
      - from: SIGNOFF_IN_PROGRESS
        to: VOID
        trigger: "POST /api/fabrication-packages/{id}/void"
        actor: FabricationLead
        preconditions: ["same as DRAFT -> VOID"]
        side_effects: ["all SignOffs not already REVOKED -> REVOKED"]
      - from: READY_FOR_RELEASE
        to: VOID
        trigger: "POST /api/fabrication-packages/{id}/void"
        actor: FabricationLead
        preconditions: ["same as DRAFT -> VOID"]
        side_effects: ["all SignOffs not already REVOKED -> REVOKED"]

  - entity: SignOff
    field: status
    initial_state: REQUESTED
    terminal_states: []
    note: "Cyclic: DECLINED/REVOKED can be re-requested via the package's submit-for-signoff while the package is SIGNOFF_IN_PROGRESS."
    transitions:
      - from: REQUESTED
        to: SIGNED
        trigger: "POST /api/signoffs/{id}/sign"
        actor: LeadEngineer
        preconditions:
          - "status == REQUESTED (ERR_SIGNOFF_NOT_REQUESTED)"
          - "SoD: X-User-ID != trade_model.submitted_by_user_id of the pinned TradeModel (ERR_SOD_SIGNOFF_AUTHOR_CONFLICT)"
        side_effects:
          - "signer_user_id := X-User-ID"
          - "package signed_count recomputed; if signed_count == required_signoff_count the package SIGNOFF_IN_PROGRESS -> READY_FOR_RELEASE"
      - from: REQUESTED
        to: DECLINED
        trigger: "POST /api/signoffs/{id}/decline"
        actor: LeadEngineer
        preconditions:
          - "status == REQUESTED (ERR_SIGNOFF_NOT_REQUESTED)"
          - "SoD: X-User-ID != pinned TradeModel.submitted_by_user_id (ERR_SOD_SIGNOFF_AUTHOR_CONFLICT)"
        side_effects: []
      - from: SIGNED
        to: REVOKED
        trigger: "system (CASCADE A link 3: pinned federated model left FROZEN; or package voided)"
        actor: system
        preconditions: []
        side_effects: ["package signed_count recomputed; READY_FOR_RELEASE -> SIGNOFF_IN_PROGRESS when count drops below required"]
      - from: DECLINED
        to: REQUESTED
        trigger: "POST /api/fabrication-packages/{id}/submit-for-signoff (re-request)"
        actor: FabricationLead
        preconditions: ["package status == SIGNOFF_IN_PROGRESS"]
        side_effects: []
      - from: REVOKED
        to: REQUESTED
        trigger: "POST /api/fabrication-packages/{id}/submit-for-signoff (re-request)"
        actor: FabricationLead
        preconditions: ["package status == SIGNOFF_IN_PROGRESS"]
        side_effects: []

  - entity: AsBuiltModel
    field: status
    initial_state: DRAFT
    terminal_states: [FIELD_VERIFIED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /api/as-built-models/{id}/submit"
        actor: TradeModelAuthor
        preconditions:
          - "status in {DRAFT, REJECTED} (ERR_AS_BUILT_NOT_SUBMITTABLE)"
          - "ownership: X-User-ID == trade_partner_id (ERR_FORBIDDEN_OWNERSHIP)"
        side_effects: []
      - from: REJECTED
        to: SUBMITTED
        trigger: "POST /api/as-built-models/{id}/submit"
        actor: TradeModelAuthor
        preconditions: ["same as DRAFT -> SUBMITTED (field-rework loop)"]
        side_effects: []
      - from: SUBMITTED
        to: FIELD_VERIFIED
        trigger: "POST /api/as-built-models/{id}/verify with verification_deviation_mm <= AS_BUILT_TOLERANCE_MM"
        actor: VDCManager
        preconditions: ["status == SUBMITTED (ERR_AS_BUILT_NOT_SUBMITTED)"]
        side_effects: ["verification_deviation_mm recorded"]
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /api/as-built-models/{id}/verify with verification_deviation_mm > AS_BUILT_TOLERANCE_MM"
        actor: VDCManager
        preconditions: ["status == SUBMITTED (ERR_AS_BUILT_NOT_SUBMITTED)"]
        side_effects: ["verification_deviation_mm recorded"]

  - entity: QuantityTakeoff
    field: status
    initial_state: EXTRACTED
    terminal_states: [SUPERSEDED]
    transitions:
      - from: EXTRACTED
        to: APPROVED
        trigger: "POST /api/quantity-takeoffs/{id}/approve"
        actor: VDCManager
        preconditions:
          - "status == EXTRACTED (ERR_TAKEOFF_NOT_EXTRACTED)"
          - "federated model status == RELEASED (ERR_FED_NOT_RELEASED)"
        side_effects: []
      - from: EXTRACTED
        to: SUPERSEDED
        trigger: "system (a new QuantityTakeoff is created with the same (federated_model_id, extraction_mode, discipline_filter))"
        actor: system
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: SUPERSEDED
        trigger: "system (a new QuantityTakeoff is created with the same key)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: HandoverPackage
    field: status
    initial_state: ASSEMBLING
    terminal_states: [FM_ACCEPTED]
    transitions:
      - from: ASSEMBLING
        to: READY
        trigger: "POST /api/handover-packages/{id}/mark-ready"
        actor: BIMCoordinator
        preconditions:
          - "status in {ASSEMBLING, FM_REJECTED} (ERR_HANDOVER_NOT_ASSEMBLING)"
          - "project current_phase == CLOSEOUT (ERR_PHASE_REQUIREMENT_NOT_MET)"
          - "includes_takeoff_id references an APPROVED takeoff (ERR_TAKEOFF_NOT_APPROVED)"
          - "at least one AsBuiltModel exists in the project and all are FIELD_VERIFIED (ERR_AS_BUILTS_NOT_VERIFIED)"
          - "no clash in the project is in {NEW, ASSIGNED, RESOLVED, REOPENED} (ERR_OPEN_CLASHES_REMAIN)"
        side_effects: []
      - from: FM_REJECTED
        to: READY
        trigger: "POST /api/handover-packages/{id}/mark-ready"
        actor: BIMCoordinator
        preconditions: ["same gates as ASSEMBLING -> READY (facilities-rejection rework loop)"]
        side_effects: []
      - from: READY
        to: TRANSMITTED
        trigger: "POST /api/handover-packages/{id}/transmit"
        actor: BIMCoordinator
        preconditions: ["status == READY (ERR_HANDOVER_NOT_READY)"]
        side_effects: ["transmitted_at := logical clock"]
      - from: TRANSMITTED
        to: FM_ACCEPTED
        trigger: "POST /api/handover-packages/{id}/respond with decision = ACCEPT"
        actor: FacilitiesManager
        preconditions: ["status == TRANSMITTED (ERR_HANDOVER_NOT_TRANSMITTED)"]
        side_effects: ["fm_decision_by_user_id := X-User-ID"]
      - from: TRANSMITTED
        to: FM_REJECTED
        trigger: "POST /api/handover-packages/{id}/respond with decision = REJECT"
        actor: FacilitiesManager
        preconditions: ["status == TRANSMITTED (ERR_HANDOVER_NOT_TRANSMITTED)"]
        side_effects: ["fm_decision_by_user_id := X-User-ID"]

# =============================================================================
# 1.2.1 Concurrency Rules (OCC on the parent Project.version only)
# =============================================================================
concurrency_rules:
  - rule_id: federated-create-stale-project
    parent_entity: Project
    write_endpoint: "POST /api/projects/{id}/federated-models"
    occ_field: "expected_project_version"
    description: |
      Creating a FederatedModel against a Project whose version has advanced
      since the client last observed it is rejected. The create supersedes the
      project's current non-terminal assembly, so a writer whose view of the
      project is stale (e.g., another writer just created an assembly, which
      legitimately superseded the prior one) must re-read before writing.
    error_id: ERR_STALE_PROJECT_VERSION
    http_status: 412
  - rule_id: takeoff-create-stale-project
    parent_entity: Project
    write_endpoint: "POST /api/projects/{id}/quantity-takeoffs"
    occ_field: "expected_project_version"
    description: |
      Creating a QuantityTakeoff against a Project whose version has advanced
      since the client last observed it is rejected. The create supersedes any
      existing takeoff with the same (federated_model_id, extraction_mode,
      discipline_filter) key, so a stale view of the project must be refreshed
      before the supersede is allowed.
    error_id: ERR_STALE_PROJECT_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: lod_requirement_check
    trigger: "POST /api/trade-models/{id}/submit"
    algorithm: threshold
    formula: |
      req = LodRequirement WHERE project_id = model.project_id
            AND discipline = model.discipline AND phase = Project.current_phase
      if req exists: require model.declared_lod >= req.min_lod   (boundary: == passes)
      if no req row exists: no LOD gate (submit proceeds)
    constants: {}
    precision: "integer comparison"
    input_set: "the submitting TradeModel; LodRequirement row keyed on the project's CURRENT phase at submit time"

  - name: interop_classification
    trigger: "POST /api/projects/{id}/trade-models (creation)"
    algorithm: matrix_lookup
    formula: |
      interop_status = INTEROP_MATRIX[TradePartner.software_platform][file_format]
      INTEROP_MATRIX =
        REVIT:     { RVT: NATIVE, IFC: CONVERTIBLE, NWC: CONVERTIBLE, DWG: INCOMPATIBLE }
        TEKLA:     { IFC: NATIVE, NWC: CONVERTIBLE, DWG: CONVERTIBLE, RVT: INCOMPATIBLE }
        ARCHICAD:  { IFC: NATIVE, DWG: CONVERTIBLE, RVT: INCOMPATIBLE, NWC: INCOMPATIBLE }
        IFC_ONLY:  { IFC: NATIVE, RVT: INCOMPATIBLE, NWC: INCOMPATIBLE, DWG: INCOMPATIBLE }
      submit rejects models whose interop_status == INCOMPATIBLE (ERR_INTEROP_INCOMPATIBLE_FORMAT).
    constants: {}
    precision: "exact enum lookup"
    input_set: "the created TradeModel and its TradePartner"

  - name: clash_severity_classification
    trigger: "POST /api/clash-runs/{id}/clashes (import)"
    algorithm: threshold
    formula: |
      if overlap_mm > CRITICAL_OVERLAP_MM:        severity = CRITICAL
      elif overlap_mm > 0.0:                      severity = MAJOR
      else (overlap_mm == 0.0):                   severity = MINOR
      Boundary: overlap_mm == 50.0 exactly -> MAJOR (CRITICAL requires strictly greater).
    constants:
      CRITICAL_OVERLAP_MM: 50.0
    precision: "1 decimal place mm comparison"
    input_set: "the imported ClashIssue's overlap_mm"

  - name: clash_provisional_cost
    trigger: "POST /api/clash-issues/{id}/assign (and on re-assign from REOPENED)"
    algorithm: forward_looking
    formula: |
      base_hours = BASE_HOURS[severity]                       # CRITICAL 40, MAJOR 16, MINOR 4
      multiplier = SPANS_MULTIPLIER if spans_disciplines else 1.0
      provisional_cost_cents = round_half_up(base_hours * multiplier * partner.hourly_rate_cents)
    constants:
      BASE_HOURS_CRITICAL: 40
      BASE_HOURS_MAJOR: 16
      BASE_HOURS_MINOR: 4
      SPANS_MULTIPLIER: 1.5
    precision: "integer cents, round_half_up"
    input_set: "the ClashIssue and the assigned TradePartner's current hourly_rate_cents"
    variants:
      - name: provisional_estimate
        when: "at assign time (forward-looking)"
        difference: "uses severity-based base hours and spans multiplier; ignores claimed hours"

  - name: clash_actual_cost
    trigger: "POST /api/clash-issues/{id}/verify (passing re-inspection)"
    algorithm: chronological
    formula: |
      actual_cost_cents = round_half_up(actual_labor_hours * partner.hourly_rate_cents)
      Uses the partner's hourly_rate_cents CURRENT at verify time and the hours claimed at resolve.
      For identical clash data this generally differs from clash_provisional_cost (dual variant).
    constants: {}
    precision: "integer cents, round_half_up"
    input_set: "the ClashIssue's actual_labor_hours and the assigned TradePartner"
    variants:
      - name: actual_final
        when: "at verify time (final)"
        difference: "uses claimed actual hours instead of severity-based estimate; no spans multiplier"

  - name: model_submission_score
    trigger: "POST /api/trade-models/{id}/submit"
    algorithm: weighted_scoring
    formula: |
      total_elements = life_safety_elements + envelope_elements + finish_elements  (must be >= 1, else ERR_INVALID_REQUEST at create)
      total_compliant = life_safety_compliant + envelope_compliant + finish_compliant
      submission_score = round_half_up(100 * total_compliant / total_elements, 1 decimal)
    constants: {}
    precision: "1 decimal place, round_half_up"
    input_set: "the submitting TradeModel's six element counters"
    variants:
      - name: element_weighted
        when: "at submit"
        difference: "weights every element equally regardless of criticality class"

  - name: model_audit_score
    trigger: "POST /api/trade-models/{id}/accept"
    algorithm: weighted_scoring
    formula: |
      classes = [(life_safety, 0.5), (envelope, 0.3), (finish, 0.2)]
      include only classes with elements_k > 0
      audit_score = round_half_up(100 * SUM(w_k * compliant_k / elements_k) / SUM(w_k), 1 decimal)
      (classes with zero elements are excluded and the remaining weights renormalize;
       at least one class has elements because create requires total >= 1)
    constants:
      W_LIFE_SAFETY: 0.5
      W_ENVELOPE: 0.3
      W_FINISH: 0.2
      AUDIT_ACCEPT_THRESHOLD: 70.0
    precision: "1 decimal place, round_half_up"
    input_set: "the accepted TradeModel's six element counters"
    variants:
      - name: criticality_weighted
        when: "at accept"
        difference: "weights life-safety elements 2.5x finish elements; same model data yields a different score than model_submission_score"

  - name: quantity_extraction_total
    trigger: "POST /api/projects/{id}/quantity-takeoffs"
    algorithm: aggregation
    formula: |
      if extraction_mode == GROSS:
        total_quantity = round_half_up(SUM(gross_qty), 3)
      if extraction_mode == NET:
        for each element: net_e = round_half_up(gross_qty - deduction_qty, 3)   # ROUND PER ELEMENT FIRST
        total_quantity = SUM(net_e)                                            # then sum; no second rounding
      Pinned rounding order for NET: per-element rounding THEN summation. The alternative
      (sum raw nets, then round) is a different, rejected interpretation.
      Rejections at create: empty elements array, gross_qty < deduction_qty, negative values
      (all ERR_INVALID_REQUEST).
    constants: {}
    precision: "3 decimal places, round_half_up, decimal arithmetic"
    input_set: "the elements array supplied at create"
    variants:
      - name: gross_total
        when: "extraction_mode == GROSS"
        difference: "sums gross quantities with a single final rounding; ignores deductions"
      - name: net_total
        when: "extraction_mode == NET"
        difference: "applies per-element deductions with per-element rounding before summation"

  - name: coordination_readiness_index
    trigger: "every clash import/assign/resolve/verify/reopen, commitment create/fulfill/breach/waive, and run-coordination-sweep"
    algorithm: threshold
    formula: |
      open clash      = status IN {NEW, ASSIGNED, RESOLVED, REOPENED}  (VERIFIED is closed)
      unassigned      = status IN {NEW, REOPENED}
      overdue commit  = status == COMMITTED AND due_at < logical clock
      CRI = max(0, 100
                - 25 * count(open CRITICAL clashes in project)
                - 10 * count(open MAJOR clashes in project)
                -  5 * count(unassigned MINOR clashes in project)
                - 15 * count(overdue commitments in project))
      Project.open_critical_count / open_major_count / unassigned_minor_count /
      overdue_commitment_count are the same four counts, denormalized on Project.
    constants:
      CRI_RELEASE_THRESHOLD: 85
      CRI_HOLD_THRESHOLD: 60
      W_CRITICAL: 25
      W_MAJOR: 10
      W_MINOR_UNASSIGNED: 5
      W_OVERDUE_COMMITMENT: 15
    precision: "integer"
    input_set: "all ClashIssues and ResolutionCommitments of the project, filtered by the status sets above"

  - name: project_posture
    trigger: "after every coordination_readiness_index recompute and every TradePartner.status change"
    algorithm: derived
    formula: |
      coordination_posture = COORDINATION_HOLD
        if coordination_readiness_index < 60
        OR exists TradePartner with status == PROBATION having >= 1 assigned clash
           in {ASSIGNED, RESOLVED, REOPENED}
      else NORMAL
    constants:
      CRI_HOLD_THRESHOLD: 60
    precision: "exact"
    input_set: "Project CRI; TradePartner statuses; ClashIssue assignment/status"

  - name: trade_partner_reliability
    trigger: "ResolutionCommitment -> BREACHED (via sweep or via clash reopen cascade)"
    algorithm: decay_function
    formula: |
      Circular-looking dependency, pinned evaluation order:
      (1) tier = tier_of(score_before):  TIER_A if score_before >= 80
                                         TIER_B if 50 <= score_before < 80
                                         TIER_C if score_before < 50
      (2) penalty = {TIER_A: 5, TIER_B: 10, TIER_C: 20}
      (3) score_after = max(0, score_before - penalty)
      (4) breach_count += 1
      (5) if score_after < PROBATION_THRESHOLD and status == ACTIVE: status -> PROBATION
      The tier is ALWAYS read from the pre-event score; recomputing tier from score_after
      is the rejected interpretation (it yields a different penalty at boundary scores).
    constants:
      TIER_A_FLOOR: 80
      TIER_B_FLOOR: 50
      PENALTY_A: 5
      PENALTY_B: 10
      PENALTY_C: 20
      PROBATION_THRESHOLD: 40
    precision: "1 decimal place"
    input_set: "the breaching commitment's TradePartner"

  - name: meeting_room_overlap
    trigger: "POST /api/projects/{id}/coordination-meetings"
    algorithm: interval_merge
    formula: |
      Intervals are HALF-OPEN [starts_at, ends_at): a meeting occupying [s, e) conflicts with
      an existing meeting [s1, e1) on the same (project_id, room_id) whose status is
      SCHEDULED or IN_SESSION iff  s < e1 AND s1 < e.
      Adjacency is NOT a conflict: new.starts_at == existing.ends_at is allowed (gap of 0).
      Adjourned meetings free the room.
    constants: {}
    precision: "second-precision timestamps"
    input_set: "CoordinationMeetings of the same (project_id, room_id) in SCHEDULED or IN_SESSION"

  - name: freeze_window_gap_check
    trigger: "POST /api/federated-models/{id}/freeze-windows"
    algorithm: interval_merge
    formula: |
      Intervals are CLOSED [starts_at, ends_at] and a coordination buffer is mandatory:
      for every existing FreezeWindow [s1, e1] on the same federated model, the new window
      [s, e] is rejected unless  s >= e1 + FREEZE_GAP_SECONDS  OR  e + FREEZE_GAP_SECONDS <= s1.
      Boundary: gap of exactly 3600 seconds is allowed (>=). Overlap and sub-gap adjacency
      are both ERR_FREEZE_WINDOW_GAP_VIOLATION. Different interval semantics from
      meeting_room_overlap (closed + buffered vs half-open + adjacency-allowed).
    constants:
      FREEZE_GAP_SECONDS: 3600
    precision: "second-precision timestamps"
    input_set: "all FreezeWindows of the same federated_model_id"

  - name: as_built_verification_threshold
    trigger: "POST /api/as-built-models/{id}/verify"
    algorithm: threshold
    formula: |
      if verification_deviation_mm <= AS_BUILT_TOLERANCE_MM: -> FIELD_VERIFIED
      else:                                                    -> REJECTED
      Boundary: deviation of exactly 25.0 mm verifies.
    constants:
      AS_BUILT_TOLERANCE_MM: 25.0
    precision: "1 decimal place mm comparison"
    input_set: "the verify call's verification_deviation_mm"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and non-empty"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all endpoints"

  - priority: 2
    category: auth
    check: "X-User-Role must be in the endpoint's roles list"
    error_id: ERR_UNAUTHORIZED_ROLE
    http_status: 403
    applies_to: "all endpoints"

  - priority: 3
    category: auth
    check: "Ownership: for TradeModelAuthor and FabricationLead calls, X-User-ID must equal the acting TradePartner id (trade-models create/submit: model's trade_partner_id; resolve: clash's assigned_trade_partner_id; as-built create/submit: basis partner; package create/submit/release/void: requesting partner)"
    error_id: ERR_FORBIDDEN_OWNERSHIP
    http_status: 403
    applies_to: "POST /api/projects/{id}/trade-models, /submit, /resolve, /as-built-models, /submit, /fabrication-packages, /submit-for-signoff, /release, /void"

  - priority: 4
    category: existence
    check: "Path resource ids must exist, validated left-to-right (project, then nested resource); body-referenced ids (trade_partner_id, member trade_model_ids, federated_model_id, clash_issue_id, committed_by_partner_id, trade_model_id, includes_takeoff_id) must exist"
    error_id: "ERR_PROJECT_NOT_FOUND / ERR_TRADE_PARTNER_NOT_FOUND / ERR_TRADE_MODEL_NOT_FOUND / ERR_FEDERATED_MODEL_NOT_FOUND / ERR_CLASH_RUN_NOT_FOUND / ERR_CLASH_ISSUE_NOT_FOUND / ERR_MEETING_NOT_FOUND / ERR_COMMITMENT_NOT_FOUND / ERR_PACKAGE_NOT_FOUND / ERR_SIGNOFF_NOT_FOUND / ERR_AS_BUILT_NOT_FOUND / ERR_TAKEOFF_NOT_FOUND / ERR_HANDOVER_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with resource ids"

  - priority: 4.5
    category: existence
    check: "Required request fields present, types correct, enum values in range, array constraints (scope_disciplines 1..3 unique, elements non-empty, gross_qty >= deduction_qty >= 0, element counts >= 0 with total >= 1), ends_at strictly after starts_at"
    error_id: "ERR_INVALID_REQUEST / ERR_INVALID_TIME_RANGE"
    http_status: 400
    applies_to: "all endpoints with a request body"
    note: "ERR_INVALID_REQUEST is 400; ERR_INVALID_TIME_RANGE is 422"

  - priority: 5
    category: concurrency
    check: "expected_project_version must equal the Project's current version (OCC), evaluated before any business rule"
    error_id: ERR_STALE_PROJECT_VERSION
    http_status: 412
    applies_to: "POST /api/projects/{id}/federated-models, POST /api/projects/{id}/quantity-takeoffs"

  - priority: 6
    category: state
    check: "From-state of the target resource must allow the requested transition (per state machine tables); includes phase progression, model submit/accept/reject states, federated freeze/unfreeze/release states, run start/complete states, clash assign/resolve/verify/reopen states, meeting start/adjourn states, commitment waive state, package submit/release/void states, sign-off sign/decline state, as-built submit/verify states, takeoff approve state, handover mark-ready/transmit/respond states"
    error_id: "ERR_INVALID_PHASE_TRANSITION | ERR_MODEL_NOT_SUBMITTABLE | ERR_MODEL_NOT_SUBMITTED | ERR_FED_NOT_ASSEMBLED | ERR_FED_NOT_FROZEN | ERR_RUN_NOT_QUEUED | ERR_RUN_NOT_RUNNING | ERR_CLASH_NOT_ASSIGNABLE | ERR_CLASH_NOT_RESOLVABLE | ERR_CLASH_NOT_VERIFIABLE | ERR_CLASH_NOT_REOPENABLE | ERR_MEETING_NOT_SCHEDULED | ERR_MEETING_NOT_IN_SESSION | ERR_COMMITMENT_NOT_OPEN | ERR_PACKAGE_NOT_DRAFT | ERR_PACKAGE_NOT_RELEASABLE | ERR_PACKAGE_ALREADY_FINAL | ERR_SIGNOFF_NOT_REQUESTED | ERR_AS_BUILT_NOT_SUBMITTABLE | ERR_AS_BUILT_NOT_SUBMITTED | ERR_TAKEOFF_NOT_EXTRACTED | ERR_HANDOVER_NOT_ASSEMBLING | ERR_HANDOVER_NOT_READY | ERR_HANDOVER_NOT_TRANSMITTED"
    http_status: 409
    applies_to: "all action endpoints"

  - priority: 7
    category: business_safety
    check: "Compliance and segregation gates: LOD at submit (ERR_LOD_BELOW_PHASE_REQUIREMENT, 422); interop at submit (ERR_INTEROP_INCOMPATIBLE_FORMAT, 422); member audit_score >= 70 at freeze (ERR_MEMBER_COMPLIANCE_BELOW_THRESHOLD, 422); SoD sign-off signer != model submitter (ERR_SOD_SIGNOFF_AUTHOR_CONFLICT, 403); SoD clash verifier != assigner (ERR_SOD_VERIFY_EQUALS_ASSIGN, 403); PROBATION partner cannot be assigned clashes (ERR_TRADE_PARTNER_ON_PROBATION, 403); posture gate on federated/fabrication release (ERR_PROJECT_IN_COORDINATION_HOLD, 409)"
    error_id: "ERR_LOD_BELOW_PHASE_REQUIREMENT | ERR_INTEROP_INCOMPATIBLE_FORMAT | ERR_MEMBER_COMPLIANCE_BELOW_THRESHOLD | ERR_SOD_SIGNOFF_AUTHOR_CONFLICT | ERR_SOD_VERIFY_EQUALS_ASSIGN | ERR_TRADE_PARTNER_ON_PROBATION | ERR_PROJECT_IN_COORDINATION_HOLD"
    http_status: 403
    applies_to: "submit, freeze, assign, verify, sign, decline, federated release, fabrication release"
    note: "http_status varies per error (422 for LOD/interop/compliance, 403 for SoD/probation, 409 for posture)"

  - priority: 8
    category: business_referential
    check: "Body-referenced entities must belong to the same project as the path scope (federated members, clash run's federated model, commitment's clash and partner, package's federated model, as-built's basis model, takeoff's federated model, handover's takeoff, freeze-window/clash-run path federated model); commitment's committed_by_partner_id must equal the clash's assigned_trade_partner_id (ERR_COMMITMENT_TRADE_MISMATCH)"
    error_id: "ERR_CROSS_PROJECT_REFERENCE | ERR_COMMITMENT_TRADE_MISMATCH"
    http_status: 422
    applies_to: "federated-models create, clash-runs create, commitments create, fabrication-packages create, as-built-models create, quantity-takeoffs create, handover-packages create, freeze-windows create, clash assign"

  - priority: 9
    category: business_constraint
    check: "Aggregate/uniqueness/scoping constraints: LodRequirement (discipline, phase) unique per project (ERR_DUPLICATE_LOD_REQUIREMENT); TradePartner company_name unique per project (ERR_DUPLICATE_TRADE_PARTNER); federated assembly at most one member per discipline (ERR_DUPLICATE_DISCIPLINE_IN_ASSEMBLY); package scope_disciplines must each have a member in the federated model (ERR_SCOPE_DISCIPLINE_NOT_IN_ASSEMBLY); CRI >= 85 at fabrication release (ERR_CRI_BELOW_RELEASE_THRESHOLD); run completion needs zero NEW clashes (ERR_RUN_HAS_UNASSIGNED_CLASHES); handover mark-ready aggregate gates (ERR_TAKEOFF_NOT_APPROVED, ERR_AS_BUILTS_NOT_VERIFIED, ERR_OPEN_CLASHES_REMAIN)"
    error_id: "ERR_DUPLICATE_LOD_REQUIREMENT | ERR_DUPLICATE_TRADE_PARTNER | ERR_DUPLICATE_DISCIPLINE_IN_ASSEMBLY | ERR_SCOPE_DISCIPLINE_NOT_IN_ASSEMBLY | ERR_CRI_BELOW_RELEASE_THRESHOLD | ERR_RUN_HAS_UNASSIGNED_CLASHES | ERR_TAKEOFF_NOT_APPROVED | ERR_AS_BUILTS_NOT_VERIFIED | ERR_OPEN_CLASHES_REMAIN"
    http_status: 409
    applies_to: "lod-requirements create, trade-partners create, federated-models create, packages create, package release, run complete, handover mark-ready"
    note: "ERR_SCOPE_DISCIPLINE_NOT_IN_ASSEMBLY is 422; ERR_TAKEOFF_NOT_APPROVED is 409; others 409"

  - priority: 10
    category: business_temporal
    check: "Time/window gates: meeting room half-open overlap (ERR_ROOM_WINDOW_CONFLICT); meeting start only inside [starts_at, ends_at) (ERR_MEETING_WINDOW_NOT_ACTIVE); freeze-window closed-interval 3600s gap (ERR_FREEZE_WINDOW_GAP_VIOLATION); clash-run start blocked while a COORDINATION_FREEZE window is active (ERR_FREEZE_WINDOW_ACTIVE); fabrication release phase in {CONSTRUCTION_DOCUMENTS, CONSTRUCTION_ADMINISTRATION} (ERR_PHASE_TOO_EARLY_FOR_FABRICATION); as-built create phase in {CONSTRUCTION_ADMINISTRATION, CLOSEOUT} and handover mark-ready phase CLOSEOUT (ERR_PHASE_REQUIREMENT_NOT_MET)"
    error_id: "ERR_ROOM_WINDOW_CONFLICT | ERR_MEETING_WINDOW_NOT_ACTIVE | ERR_FREEZE_WINDOW_GAP_VIOLATION | ERR_FREEZE_WINDOW_ACTIVE | ERR_PHASE_TOO_EARLY_FOR_FABRICATION | ERR_PHASE_REQUIREMENT_NOT_MET"
    http_status: 409
    applies_to: "meetings create/start, freeze-windows create, clash-runs start, package release, as-built create, handover mark-ready"

  - priority: 11
    category: business_fiscal
    check: "Fiscal gate (always last among business rules): resolve's actual_labor_hours <= partner's remaining coordination budget (coordination_budget_hours - consumed_resolution_hours)"
    error_id: ERR_COORDINATION_BUDGET_EXCEEDED
    http_status: 402
    applies_to: "POST /api/clash-issues/{id}/resolve"

# =============================================================================
# 1.5 API Endpoint Table
# All reads (GET) are allowed for every role; mutations are role-restricted.
# =============================================================================
endpoints:
  # --- Project ---
  - { method: POST, path: "/api/projects", description: "Create a project", roles: [VDCManager], code: 201, input: [name], output: Project, side_effects: ["phase=SCHEMATIC_DESIGN, posture=NORMAL, CRI=100, ops_sweep_index=0"] }
  - { method: GET, path: "/api/projects/{id}", description: "Get a project (includes CRI, posture, counts)", roles: [VDCManager, BIMCoordinator, TradeModelAuthor, LeadEngineer, FabricationLead, FacilitiesManager], code: 200, input: [], output: Project, side_effects: [] }
  - { method: POST, path: "/api/projects/{id}/advance-phase", description: "Advance current_phase one step in the fixed order", roles: [VDCManager], code: 200, input: [], output: Project, side_effects: ["phase transition per state machine", "increments Project.version by 1"] }
  - { method: POST, path: "/api/projects/{id}/run-coordination-sweep", description: "Ops-run sweep: breach overdue COMMITTED commitments (ordered by created_at ASC, tie-break due_at ASC), apply reliability penalties and probation, recompute CRI/posture", roles: [VDCManager], code: 200, input: [], output: Project, side_effects: ["commitment breaches + reliability cascade", "CRI/posture recomputed", "ops_sweep_index += 1", "increments Project.version by 1"] }

  # --- LodRequirement ---
  - { method: POST, path: "/api/projects/{id}/lod-requirements", description: "Create a LOD requirement for (discipline, phase)", roles: [VDCManager], code: 201, input: [discipline, phase, min_lod, clearance_requirement_mm], output: LodRequirement, side_effects: [] }
  - { method: GET, path: "/api/projects/{id}/lod-requirements", description: "List LOD requirements of a project", roles: [VDCManager, BIMCoordinator, TradeModelAuthor, LeadEngineer, FabricationLead, FacilitiesManager], code: 200, input: [], output: "LodRequirement[]", side_effects: [] }

  # --- TradePartner ---
  - { method: POST, path: "/api/projects/{id}/trade-partners", description: "Onboard a trade partner", roles: [VDCManager], code: 201, input: [company_name, discipline, hourly_rate_cents, coordination_budget_hours, software_platform], output: TradePartner, side_effects: ["status=ACTIVE, reliability_score=100, counters 0"] }
  - { method: GET, path: "/api/projects/{id}/trade-partners", description: "List trade partners of a project", roles: [VDCManager, BIMCoordinator, TradeModelAuthor, LeadEngineer, FabricationLead, FacilitiesManager], code: 200, input: ["status?", "discipline?"], output: "TradePartner[]", side_effects: [] }

  # --- TradeModel ---
  - { method: POST, path: "/api/projects/{id}/trade-models", description: "Create a trade model revision (DRAFT); interop_status computed at create", roles: [TradeModelAuthor], code: 201, input: [trade_partner_id, file_format, declared_lod, life_safety_elements, life_safety_compliant, envelope_elements, envelope_compliant, finish_elements, finish_compliant], output: TradeModel, side_effects: ["revision_number assigned per (project, discipline)", "interop_status computed", "discipline copied from partner"] }
  - { method: GET, path: "/api/trade-models", description: "List trade models with filters", roles: [VDCManager, BIMCoordinator, TradeModelAuthor, LeadEngineer, FabricationLead, FacilitiesManager], code: 200, input: ["project_id?", "trade_partner_id?", "supersedes_model_id?", "status?", "discipline?"], output: "TradeModel[]", side_effects: [] }
  - { method: GET, path: "/api/trade-models/{id}", description: "Get a trade model", roles: [VDCManager, BIMCoordinator, TradeModelAuthor, LeadEngineer, FabricationLead, FacilitiesManager], code: 200, input: [], output: TradeModel, side_effects: [] }
  - { method: POST, path: "/api/trade-models/{id}/submit", description: "Submit (or resubmit after rejection) a model for coordination review; LOD + interop gates; submission_score computed", roles: [TradeModelAuthor], code: 200, input: [], output: TradeModel, side_effects: ["status -> SUBMITTED", "submitted_by_user_id := X-User-ID", "submission_score computed"] }
  - { method: POST, path: "/api/trade-models/{id}/accept", description: "Accept a submitted model; computes audit_score; runs CASCADE A (supersede, member re-point, unfreeze, sign-off revocation, package regression, fed auto-assemble)", roles: [BIMCoordinator], code: 200, input: [], output: TradeModel, side_effects: ["status -> ACCEPTED", "audit_score computed", "prior ACCEPTED revision -> SUPERSEDED", "CASCADE A links 1-4", "DRAFT federated models with all members ACCEPTED -> ASSEMBLED"] }
  - { method: POST, path: "/api/trade-models/{id}/reject", description: "Reject a submitted model", roles: [BIMCoordinator], code: 200, input: [], output: TradeModel, side_effects: ["status -> REJECTED"] }

  # --- FederatedModel ---
  - { method: POST, path: "/api/projects/{id}/federated-models", description: "Assemble a federated model from member trade models (one per discipline, same project); supersedes the project's current non-terminal assembly", roles: [VDCManager], code: 201, input: [label, target_format, member_trade_model_ids, expected_project_version], output: FederatedModel, side_effects: ["OCC check on Project.version", "members created with pinned_model_version", "prior non-terminal federated model -> SUPERSEDED", "initial status ASSEMBLED if all members ACCEPTED else DRAFT", "increments Project.version by 1"] }
  - { method: GET, path: "/api/federated-models", description: "List federated models with filters", roles: [VDCManager, BIMCoordinator, TradeModelAuthor, LeadEngineer, FabricationLead, FacilitiesManager], code: 200, input: ["project_id?", "status?"], output: "FederatedModel[]", side_effects: [] }
  - { method: GET, path: "/api/federated-models/{id}", description: "Get a federated model", roles: [VDCManager, BIMCoordinator, TradeModelAuthor, LeadEngineer, FabricationLead, FacilitiesManager], code: 200, input: [], output: FederatedModel, side_effects: [] }
  - { method: POST, path: "/api/federated-models/{id}/freeze", description: "Freeze an assembled model (requires member audit_score >= 70); re-pins member versions and clears is_stale", roles: [VDCManager], code: 200, input: [], output: FederatedModel, side_effects: ["status -> FROZEN", "members re-pinned to current versions", "is_stale := false"] }
  - { method: POST, path: "/api/federated-models/{id}/unfreeze", description: "Manually unfreeze a frozen model; revokes SIGNED sign-offs on dependent packages", roles: [VDCManager], code: 200, input: [], output: FederatedModel, side_effects: ["status FROZEN -> ASSEMBLED", "is_stale := true", "SIGNED SignOffs on pinning packages -> REVOKED", "affected packages READY_FOR_RELEASE -> SIGNOFF_IN_PROGRESS"] }
  - { method: POST, path: "/api/federated-models/{id}/release", description: "Issue a frozen model for construction (requires zero open critical clashes and NORMAL posture)", roles: [VDCManager], code: 200, input: [], output: FederatedModel, side_effects: ["status FROZEN -> RELEASED"] }
  - { method: GET, path: "/api/federated-models/{id}/members", description: "List members of a federated model", roles: [VDCManager, BIMCoordinator, TradeModelAuthor, LeadEngineer, FabricationLead, FacilitiesManager], code: 200, input: [], output: "FederatedModelMember[]", side_effects: [] }
  - { method: GET, path: "/api/trade-models/{id}/federated-model-members", description: "List federation memberships of a trade model", roles: [VDCManager, BIMCoordinator, TradeModelAuthor, LeadEngineer, FabricationLead, FacilitiesManager], code: 200, input: [], output: "FederatedModelMember[]", side_effects: [] }

  # --- FreezeWindow ---
  - { method: POST, path: "/api/federated-models/{id}/freeze-windows", description: "Schedule a freeze window (closed interval, >= 3600s gap to any other window on the same model)", roles: [VDCManager], code: 201, input: [starts_at, ends_at, purpose], output: FreezeWindow, side_effects: [] }
  - { method: GET, path: "/api/federated-models/{id}/freeze-windows", description: "List freeze windows of a federated model", roles: [VDCManager, BIMCoordinator, TradeModelAuthor, LeadEngineer, FabricationLead, FacilitiesManager], code: 200, input: [], output: "FreezeWindow[]", side_effects: [] }

  # --- ClashDetectionRun / ClashIssue ---
  - { method: POST, path: "/api/federated-models/{id}/clash-runs", description: "Create a clash detection run (QUEUED) against a FROZEN federated model", roles: [BIMCoordinator], code: 201, input: [tolerance_mm], output: ClashDetectionRun, side_effects: ["requires federated model FROZEN (ERR_FED_NOT_FROZEN)", "run_index assigned"] }
  - { method: GET, path: "/api/clash-runs", description: "List clash runs with filters", roles: [VDCManager, BIMCoordinator, TradeModelAuthor, LeadEngineer, FabricationLead, FacilitiesManager], code: 200, input: ["project_id?", "federated_model_id?", "status?"], output: "ClashDetectionRun[]", side_effects: [] }
  - { method: GET, path: "/api/clash-runs/{id}", description: "Get a clash run", roles: [VDCManager, BIMCoordinator, TradeModelAuthor, LeadEngineer, FabricationLead, FacilitiesManager], code: 200, input: [], output: ClashDetectionRun, side_effects: [] }
  - { method: POST, path: "/api/clash-runs/{id}/start", description: "Start a queued run (fed still FROZEN, members ACCEPTED, no active COORDINATION_FREEZE window)", roles: [BIMCoordinator], code: 200, input: [], output: ClashDetectionRun, side_effects: ["status -> RUNNING", "started_at := clock"] }
  - { method: POST, path: "/api/clash-runs/{id}/clashes", description: "Import a detected clash into a RUNNING run; severity computed", roles: [BIMCoordinator], code: 201, input: [element_pair, overlap_mm, spans_disciplines], output: ClashIssue, side_effects: ["requires run RUNNING (ERR_RUN_NOT_RUNNING)", "severity classified", "run counters updated", "project CRI/posture recomputed"] }
  - { method: POST, "path": "/api/clash-runs/{id}/complete", description: "Complete a running run (requires zero NEW clashes)", roles: [BIMCoordinator], code: 200, input: [], output: ClashDetectionRun, side_effects: ["status -> COMPLETED", "completed_at := clock"] }
  - { method: GET, path: "/api/clash-issues", description: "List clash issues with filters", roles: [VDCManager, BIMCoordinator, TradeModelAuthor, LeadEngineer, FabricationLead, FacilitiesManager], code: 200, input: ["clash_run_id?", "federated_model_id?", "assigned_trade_partner_id?", "status?", "severity?"], output: "ClashIssue[]", side_effects: [] }
  - { method: GET, path: "/api/clash-issues/{id}", description: "Get a clash issue", roles: [VDCManager, BIMCoordinator, TradeModelAuthor, LeadEngineer, FabricationLead, FacilitiesManager], code: 200, input: [], output: ClashIssue, side_effects: [] }
  - { method: POST, path: "/api/clash-issues/{id}/assign", description: "Assign (or re-assign) a NEW/REOPENED clash to an ACTIVE trade partner of the same project; computes provisional_cost_cents", roles: [BIMCoordinator], code: 200, input: [trade_partner_id], output: ClashIssue, side_effects: ["status -> ASSIGNED", "provisional_cost_cents computed", "assigned_by_user_id := X-User-ID", "project CRI/posture recomputed"] }
  - { method: POST, path: "/api/clash-issues/{id}/resolve", description: "Assigned trade claims resolution with actual labor hours; debits the partner's coordination budget", roles: [TradeModelAuthor], code: 200, input: [actual_labor_hours], output: ClashIssue, side_effects: ["status -> RESOLVED", "consumed_resolution_hours += actual_labor_hours", "resolved_by_user_id := X-User-ID"] }
  - { method: POST, path: "/api/clash-issues/{id}/verify", description: "Coordinator verifies a resolved clash; passing re-inspection VERIFIED (actual cost + commitment fulfill cascade), failing re-inspection REOPENED", roles: [BIMCoordinator], code: 200, input: [re_inspection_overlap_mm], output: ClashIssue, side_effects: ["branch on re_inspection_overlap_mm <= run.tolerance_mm", "VERIFIED: actual_cost_cents computed, run counters, CASCADE C", "REOPENED: cycle_count += 1", "project CRI/posture recomputed"] }
  - { method: POST, path: "/api/clash-issues/{id}/reopen", description: "Reopen a verified clash; breaches the fulfilled commitment and applies reliability cascade", roles: [BIMCoordinator], code: 200, input: [], output: ClashIssue, side_effects: ["status -> REOPENED", "run counters (open+1, closed-1)", "CASCADE B links 2-3", "project CRI/posture recomputed"] }

  # --- CoordinationMeeting / ResolutionCommitment ---
  - { method: POST, path: "/api/projects/{id}/coordination-meetings", description: "Schedule a coordination meeting; half-open room-overlap check per (project, room)", roles: [BIMCoordinator], code: 201, input: [room_id, starts_at, ends_at], output: CoordinationMeeting, side_effects: [] }
  - { method: GET, path: "/api/coordination-meetings", description: "List coordination meetings with filters", roles: [VDCManager, BIMCoordinator, TradeModelAuthor, LeadEngineer, FabricationLead, FacilitiesManager], code: 200, input: ["project_id?", "room_id?", "status?"], output: "CoordinationMeeting[]", side_effects: [] }
  - { method: GET, path: "/api/coordination-meetings/{id}", description: "Get a coordination meeting", roles: [VDCManager, BIMCoordinator, TradeModelAuthor, LeadEngineer, FabricationLead, FacilitiesManager], code: 200, input: [], output: CoordinationMeeting, side_effects: [] }
  - { method: POST, path: "/api/coordination-meetings/{id}/start", description: "Start a scheduled meeting (logical clock must be inside [starts_at, ends_at))", roles: [BIMCoordinator], code: 200, input: [], output: CoordinationMeeting, side_effects: ["status -> IN_SESSION"] }
  - { method: POST, path: "/api/coordination-meetings/{id}/adjourn", description: "Adjourn an in-session meeting", roles: [BIMCoordinator], code: 200, input: [], output: CoordinationMeeting, side_effects: ["status -> ADJOURNED"] }
  - { method: POST, path: "/api/coordination-meetings/{id}/commitments", description: "Record a resolution commitment during an IN_SESSION meeting; clash must be ASSIGNED and committed_by must equal its assigned partner", roles: [BIMCoordinator], code: 201, input: [clash_issue_id, committed_by_partner_id, due_at], output: ResolutionCommitment, side_effects: ["meeting commitment_count += 1", "project CRI/posture recomputed"] }
  - { method: GET, path: "/api/commitments", description: "List resolution commitments with filters", roles: [VDCManager, BIMCoordinator, TradeModelAuthor, LeadEngineer, FabricationLead, FacilitiesManager], code: 200, input: ["meeting_id?", "clash_issue_id?", "committed_by_partner_id?", "status?"], output: "ResolutionCommitment[]", side_effects: [] }
  - { method: GET, path: "/api/commitments/{id}", description: "Get a resolution commitment", roles: [VDCManager, BIMCoordinator, TradeModelAuthor, LeadEngineer, FabricationLead, FacilitiesManager], code: 200, input: [], output: ResolutionCommitment, side_effects: [] }
  - { method: POST, path: "/api/commitments/{id}/waive", description: "Waive an open commitment", roles: [BIMCoordinator], code: 200, input: [], output: ResolutionCommitment, side_effects: ["status COMMITTED -> WAIVED", "project CRI/posture recomputed"] }

  # --- FabricationPackage / SignOff ---
  - { method: POST, path: "/api/projects/{id}/fabrication-packages", description: "Create a fabrication package against a FROZEN federated model; requesting partner from X-User-ID", roles: [FabricationLead], code: 201, input: [federated_model_id, scope_disciplines], output: FabricationPackage, side_effects: ["requires fed FROZEN (ERR_FED_NOT_FROZEN)", "scope disciplines must have members (ERR_SCOPE_DISCIPLINE_NOT_IN_ASSEMBLY)", "required_signoff_count := len(scope_disciplines)", "pinned_fed_model_version := fed version"] }
  - { method: GET, path: "/api/fabrication-packages", description: "List fabrication packages with filters", roles: [VDCManager, BIMCoordinator, TradeModelAuthor, LeadEngineer, FabricationLead, FacilitiesManager], code: 200, input: ["project_id?", "federated_model_id?", "requesting_partner_id?", "status?"], output: "FabricationPackage[]", side_effects: [] }
  - { method: GET, path: "/api/fabrication-packages/{id}", description: "Get a fabrication package", roles: [VDCManager, BIMCoordinator, TradeModelAuthor, LeadEngineer, FabricationLead, FacilitiesManager], code: 200, input: [], output: FabricationPackage, side_effects: [] }
  - { method: POST, path: "/api/fabrication-packages/{id}/submit-for-signoff", description: "From DRAFT: create one REQUESTED SignOff per scope discipline (pinned to member model + version). From SIGNOFF_IN_PROGRESS: re-request DECLINED/REVOKED sign-offs", roles: [FabricationLead], code: 200, input: [], output: FabricationPackage, side_effects: ["DRAFT -> SIGNOFF_IN_PROGRESS", "SignOff creation / re-request per state machine"] }
  - { method: POST, path: "/api/fabrication-packages/{id}/release", description: "Release a ready package for fabrication (gates: fed FROZEN|RELEASED, phase, posture, CRI >= 85)", roles: [FabricationLead], code: 200, input: [], output: FabricationPackage, side_effects: ["status -> RELEASED", "released_at := clock"] }
  - { method: POST, path: "/api/fabrication-packages/{id}/void", description: "Void a non-final package; revokes its sign-offs", roles: [FabricationLead], code: 200, input: [], output: FabricationPackage, side_effects: ["status -> VOID", "non-REVOKED SignOffs -> REVOKED"] }
  - { method: GET, path: "/api/fabrication-packages/{id}/signoffs", description: "List sign-offs of a package (discovery channel for cascade-created SignOffs)", roles: [VDCManager, BIMCoordinator, TradeModelAuthor, LeadEngineer, FabricationLead, FacilitiesManager], code: 200, input: [], output: "SignOff[]", side_effects: [] }
  - { method: GET, path: "/api/trade-models/{id}/signoffs", description: "List sign-offs pinned to a trade model", roles: [VDCManager, BIMCoordinator, TradeModelAuthor, LeadEngineer, FabricationLead, FacilitiesManager], code: 200, input: [], output: "SignOff[]", side_effects: [] }
  - { method: GET, path: "/api/signoffs/{id}", description: "Get a sign-off", roles: [VDCManager, BIMCoordinator, TradeModelAuthor, LeadEngineer, FabricationLead, FacilitiesManager], code: 200, input: [], output: SignOff, side_effects: [] }
  - { method: POST, path: "/api/signoffs/{id}/sign", description: "Sign a requested sign-off (SoD: signer != the pinned model's submitter); last sign auto-marks package READY_FOR_RELEASE", roles: [LeadEngineer], code: 200, input: [], output: SignOff, side_effects: ["status -> SIGNED", "signer_user_id := X-User-ID", "package signed_count recomputed; auto READY_FOR_RELEASE"] }
  - { method: POST, path: "/api/signoffs/{id}/decline", description: "Decline a requested sign-off (same SoD rule)", roles: [LeadEngineer], code: 200, input: [], output: SignOff, side_effects: ["status -> DECLINED"] }

  # --- AsBuiltModel ---
  - { method: POST, path: "/api/projects/{id}/as-built-models", description: "Create an as-built model record against an ACCEPTED or SUPERSEDED trade model (phase CONSTRUCTION_ADMINISTRATION or CLOSEOUT)", roles: [TradeModelAuthor], code: 201, input: [trade_model_id, field_verification_notes], output: AsBuiltModel, side_effects: ["phase gate ERR_PHASE_REQUIREMENT_NOT_MET", "basis model state gate ERR_MODEL_NOT_ACCEPTED", "trade_partner_id copied from basis model"] }
  - { method: GET, path: "/api/as-built-models", description: "List as-built models with filters", roles: [VDCManager, BIMCoordinator, TradeModelAuthor, LeadEngineer, FabricationLead, FacilitiesManager], code: 200, input: ["project_id?", "trade_model_id?", "trade_partner_id?", "status?"], output: "AsBuiltModel[]", side_effects: [] }
  - { method: GET, path: "/api/as-built-models/{id}", description: "Get an as-built model", roles: [VDCManager, BIMCoordinator, TradeModelAuthor, LeadEngineer, FabricationLead, FacilitiesManager], code: 200, input: [], output: AsBuiltModel, side_effects: [] }
  - { method: POST, path: "/api/as-built-models/{id}/submit", description: "Submit (or resubmit after rejection) an as-built for field verification", roles: [TradeModelAuthor], code: 200, input: [], output: AsBuiltModel, side_effects: ["status -> SUBMITTED"] }
  - { method: POST, path: "/api/as-built-models/{id}/verify", description: "VDCManager verifies an as-built: deviation <= 25.0 mm -> FIELD_VERIFIED, else REJECTED", roles: [VDCManager], code: 200, input: [verification_deviation_mm], output: AsBuiltModel, side_effects: ["branch on AS_BUILT_TOLERANCE_MM boundary", "verification_deviation_mm recorded"] }

  # --- QuantityTakeoff ---
  - { method: POST, path: "/api/projects/{id}/quantity-takeoffs", description: "Extract model-based quantities from a FROZEN or RELEASED federated model; supersedes any existing takeoff with the same (federated_model_id, extraction_mode, discipline_filter)", roles: [BIMCoordinator], code: 201, input: [federated_model_id, extraction_mode, elements, expected_project_version, "discipline_filter?"], output: QuantityTakeoff, side_effects: ["OCC check on Project.version", "fed state gate ERR_FED_NOT_FROZEN (must be FROZEN or RELEASED)", "total_quantity computed per extraction_mode", "same-key prior takeoff -> SUPERSEDED", "increments Project.version by 1"] }
  - { method: GET, path: "/api/quantity-takeoffs", description: "List quantity takeoffs with filters", roles: [VDCManager, BIMCoordinator, TradeModelAuthor, LeadEngineer, FabricationLead, FacilitiesManager], code: 200, input: ["project_id?", "federated_model_id?", "status?"], output: "QuantityTakeoff[]", side_effects: [] }
  - { method: GET, path: "/api/quantity-takeoffs/{id}", description: "Get a quantity takeoff", roles: [VDCManager, BIMCoordinator, TradeModelAuthor, LeadEngineer, FabricationLead, FacilitiesManager], code: 200, input: [], output: QuantityTakeoff, side_effects: [] }
  - { method: POST, path: "/api/quantity-takeoffs/{id}/approve", description: "Approve an extracted takeoff (federated model must be RELEASED)", roles: [VDCManager], code: 200, input: [], output: QuantityTakeoff, side_effects: ["status EXTRACTED -> APPROVED"] }

  # --- HandoverPackage ---
  - { method: POST, path: "/api/projects/{id}/handover-packages", description: "Create a handover package referencing a quantity takeoff", roles: [BIMCoordinator], code: 201, input: [label, includes_takeoff_id], output: HandoverPackage, side_effects: [] }
  - { method: GET, path: "/api/handover-packages", description: "List handover packages with filters", roles: [VDCManager, BIMCoordinator, TradeModelAuthor, LeadEngineer, FabricationLead, FacilitiesManager], code: 200, input: ["project_id?", "includes_takeoff_id?", "status?"], output: "HandoverPackage[]", side_effects: [] }
  - { method: GET, path: "/api/handover-packages/{id}", description: "Get a handover package", roles: [VDCManager, BIMCoordinator, TradeModelAuthor, LeadEngineer, FabricationLead, FacilitiesManager], code: 200, input: [], output: HandoverPackage, side_effects: [] }
  - { method: POST, path: "/api/handover-packages/{id}/mark-ready", description: "Mark handover ready (phase CLOSEOUT; takeoff APPROVED; >= 1 as-built and all FIELD_VERIFIED; zero open clashes)", roles: [BIMCoordinator], code: 200, input: [], output: HandoverPackage, side_effects: ["status -> READY"] }
  - { method: POST, path: "/api/handover-packages/{id}/transmit", description: "Transmit a ready handover package to facilities", roles: [BIMCoordinator], code: 200, input: [], output: HandoverPackage, side_effects: ["status -> TRANSMITTED", "transmitted_at := clock"] }
  - { method: POST, path: "/api/handover-packages/{id}/respond", description: "Facilities accepts or rejects a transmitted handover package", roles: [FacilitiesManager], code: 200, input: [decision], output: HandoverPackage, side_effects: ["decision ACCEPT -> FM_ACCEPTED; REJECT -> FM_REJECTED", "fm_decision_by_user_id := X-User-ID"] }

  # --- Logical clock (test-driving endpoint) ---
  - { method: POST, path: "/api/_clock/set_current_utc", description: "Set the server's logical clock (ISO 8601 UTC). Before any call, the logical clock reads exactly 2026-08-01T00:00:00Z and MUST NOT fall back to wall-clock time; all deadline/expiry/window rules evaluate against this logical clock.", roles: [VDCManager], code: 200, input: [to_iso8601], output: { current_utc: datetime }, side_effects: ["logical clock advanced (never backwards: to_iso8601 must be >= current, else ERR_INVALID_TIME_RANGE)", "recomputes clock-dependent derived fields on every project: overdue_commitment_count, coordination_readiness_index, coordination_posture"] }

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  # --- Auth ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or empty" }
  - { id: ERR_UNAUTHORIZED_ROLE, http: 403, condition: "Caller role is not in the endpoint's roles list" }
  - { id: ERR_FORBIDDEN_OWNERSHIP, http: 403, condition: "Entity-backed caller (TradeModelAuthor/FabricationLead) acts on a resource owned by a different TradePartner, or X-User-ID is not a TradePartner of the project where required" }
  # --- Existence (404) ---
  - { id: ERR_PROJECT_NOT_FOUND, http: 404, condition: "Project id not found" }
  - { id: ERR_TRADE_PARTNER_NOT_FOUND, http: 404, condition: "TradePartner id not found" }
  - { id: ERR_TRADE_MODEL_NOT_FOUND, http: 404, condition: "TradeModel id not found (path or body reference)" }
  - { id: ERR_FEDERATED_MODEL_NOT_FOUND, http: 404, condition: "FederatedModel id not found (path or body reference)" }
  - { id: ERR_CLASH_RUN_NOT_FOUND, http: 404, condition: "ClashDetectionRun id not found" }
  - { id: ERR_CLASH_ISSUE_NOT_FOUND, http: 404, condition: "ClashIssue id not found (path or body reference)" }
  - { id: ERR_MEETING_NOT_FOUND, http: 404, condition: "CoordinationMeeting id not found" }
  - { id: ERR_COMMITMENT_NOT_FOUND, http: 404, condition: "ResolutionCommitment id not found" }
  - { id: ERR_PACKAGE_NOT_FOUND, http: 404, condition: "FabricationPackage id not found" }
  - { id: ERR_SIGNOFF_NOT_FOUND, http: 404, condition: "SignOff id not found" }
  - { id: ERR_AS_BUILT_NOT_FOUND, http: 404, condition: "AsBuiltModel id not found" }
  - { id: ERR_TAKEOFF_NOT_FOUND, http: 404, condition: "QuantityTakeoff id not found (path or body reference)" }
  - { id: ERR_HANDOVER_NOT_FOUND, http: 404, condition: "HandoverPackage id not found" }
  # --- Request shape ---
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, type mismatch, enum value out of range, empty elements array, gross_qty < deduction_qty, element counts invalid, actual_labor_hours <= 0, invalid respond decision" }
  - { id: ERR_INVALID_TIME_RANGE, http: 422, condition: "ends_at not strictly after starts_at, or clock set backwards" }
  # --- Concurrency ---
  - { id: ERR_STALE_PROJECT_VERSION, http: 412, condition: "expected_project_version does not equal the Project's current version (OCC)" }
  # --- Phase ---
  - { id: ERR_INVALID_PHASE_TRANSITION, http: 409, condition: "advance-phase attempted while current_phase == CLOSEOUT" }
  - { id: ERR_PHASE_TOO_EARLY_FOR_FABRICATION, http: 409, condition: "Fabrication release requires phase CONSTRUCTION_DOCUMENTS or CONSTRUCTION_ADMINISTRATION" }
  - { id: ERR_PHASE_REQUIREMENT_NOT_MET, http: 409, condition: "As-built create requires CONSTRUCTION_ADMINISTRATION or CLOSEOUT; handover mark-ready requires CLOSEOUT" }
  # --- Trade model ---
  - { id: ERR_MODEL_NOT_SUBMITTABLE, http: 409, condition: "submit requires status DRAFT or REJECTED" }
  - { id: ERR_MODEL_NOT_SUBMITTED, http: 409, condition: "accept/reject requires status SUBMITTED" }
  - { id: ERR_MODEL_NOT_ACCEPTED, http: 409, condition: "as-built create requires basis model ACCEPTED or SUPERSEDED; clash-run start requires all member models ACCEPTED" }
  - { id: ERR_LOD_BELOW_PHASE_REQUIREMENT, http: 422, condition: "declared_lod below the LodRequirement for (discipline, current phase) at submit" }
  - { id: ERR_INTEROP_INCOMPATIBLE_FORMAT, http: 422, condition: "file_format is INCOMPATIBLE with the partner's software_platform at submit" }
  # --- Federated model ---
  - { id: ERR_FED_NOT_ASSEMBLED, http: 409, condition: "freeze requires status ASSEMBLED" }
  - { id: ERR_FED_NOT_FROZEN, http: 409, condition: "operation requires the federated model FROZEN (release/unfreeze, run create/start, package create); takeoff extraction requires FROZEN or RELEASED" }
  - { id: ERR_FED_NOT_RELEASED, http: 409, condition: "takeoff approve requires the federated model RELEASED" }
  - { id: ERR_MEMBER_COMPLIANCE_BELOW_THRESHOLD, http: 422, condition: "freeze blocked: a member model's audit_score < 70.0" }
  - { id: ERR_DUPLICATE_DISCIPLINE_IN_ASSEMBLY, http: 409, condition: "federated assembly contains two member models of the same discipline" }
  - { id: ERR_CROSS_PROJECT_REFERENCE, http: 422, condition: "a body-referenced entity belongs to a different project than the path scope" }
  # --- Freeze windows & runs ---
  - { id: ERR_FREEZE_WINDOW_ACTIVE, http: 409, condition: "clash-run start blocked: a COORDINATION_FREEZE window on this federated model contains the logical clock (closed interval)" }
  - { id: ERR_FREEZE_WINDOW_GAP_VIOLATION, http: 409, condition: "freeze window overlaps or sits within 3600s of another window on the same federated model" }
  - { id: ERR_RUN_NOT_QUEUED, http: 409, condition: "start requires run status QUEUED" }
  - { id: ERR_RUN_NOT_RUNNING, http: 409, condition: "clash import or completion requires run status RUNNING" }
  - { id: ERR_RUN_HAS_UNASSIGNED_CLASHES, http: 409, condition: "run completion blocked: clashes still in NEW status" }
  # --- Meetings ---
  - { id: ERR_ROOM_WINDOW_CONFLICT, http: 409, condition: "half-open meeting window overlaps another SCHEDULED/IN_SESSION meeting in the same (project, room)" }
  - { id: ERR_MEETING_NOT_SCHEDULED, http: 409, condition: "start requires meeting status SCHEDULED" }
  - { id: ERR_MEETING_NOT_IN_SESSION, http: 409, condition: "adjourn or commitment creation requires meeting status IN_SESSION" }
  - { id: ERR_MEETING_WINDOW_NOT_ACTIVE, http: 409, condition: "meeting start outside [starts_at, ends_at) at the logical clock" }
  # --- Clashes ---
  - { id: ERR_CLASH_NOT_ASSIGNABLE, http: 409, condition: "assign requires clash status NEW or REOPENED" }
  - { id: ERR_CLASH_NOT_RESOLVABLE, http: 409, condition: "resolve requires clash status ASSIGNED" }
  - { id: ERR_CLASH_NOT_VERIFIABLE, http: 409, condition: "verify requires clash status RESOLVED" }
  - { id: ERR_CLASH_NOT_REOPENABLE, http: 409, condition: "reopen requires clash status VERIFIED" }
  # --- Partner & fiscal ---
  - { id: ERR_TRADE_PARTNER_ON_PROBATION, http: 403, condition: "clash assignment to a TradePartner in PROBATION status" }
  - { id: ERR_COORDINATION_BUDGET_EXCEEDED, http: 402, condition: "resolve hours exceed the partner's remaining coordination budget hours" }
  - { id: ERR_DUPLICATE_TRADE_PARTNER, http: 409, condition: "company_name already exists in this project" }
  # --- Commitments ---
  - { id: ERR_COMMITMENT_TRADE_MISMATCH, http: 422, condition: "committed_by_partner_id differs from the clash's assigned_trade_partner_id" }
  - { id: ERR_COMMITMENT_NOT_OPEN, http: 409, condition: "waive requires commitment status COMMITTED" }
  # --- Fabrication package & sign-off ---
  - { id: ERR_PACKAGE_NOT_DRAFT, http: 409, condition: "submit-for-signoff requires package status DRAFT or SIGNOFF_IN_PROGRESS" }
  - { id: ERR_PACKAGE_NOT_RELEASABLE, http: 409, condition: "release requires package status READY_FOR_RELEASE" }
  - { id: ERR_PACKAGE_ALREADY_FINAL, http: 409, condition: "void attempted on RELEASED or VOID package" }
  - { id: ERR_SCOPE_DISCIPLINE_NOT_IN_ASSEMBLY, http: 422, condition: "a scope discipline has no member model in the federated assembly" }
  - { id: ERR_SIGNOFF_NOT_REQUESTED, http: 409, condition: "sign/decline requires sign-off status REQUESTED" }
  - { id: ERR_SOD_SIGNOFF_AUTHOR_CONFLICT, http: 403, condition: "segregation of duties: sign-off signer equals the pinned TradeModel's submitted_by_user_id" }
  - { id: ERR_SOD_VERIFY_EQUALS_ASSIGN, http: 403, condition: "segregation of duties: clash verifier equals the clash's assigned_by_user_id" }
  - { id: ERR_PROJECT_IN_COORDINATION_HOLD, http: 409, condition: "project posture COORDINATION_HOLD blocks federated-model release and fabrication-package release" }
  - { id: ERR_CRI_BELOW_RELEASE_THRESHOLD, http: 409, condition: "coordination_readiness_index < 85 at fabrication release" }
  # --- As-built ---
  - { id: ERR_AS_BUILT_NOT_SUBMITTABLE, http: 409, condition: "as-built submit requires status DRAFT or REJECTED" }
  - { id: ERR_AS_BUILT_NOT_SUBMITTED, http: 409, condition: "as-built verify requires status SUBMITTED" }
  # --- Takeoff ---
  - { id: ERR_TAKEOFF_NOT_EXTRACTED, http: 409, condition: "approve requires takeoff status EXTRACTED" }
  - { id: ERR_TAKEOFF_NOT_APPROVED, http: 409, condition: "handover mark-ready requires the referenced takeoff APPROVED" }
  # --- Handover ---
  - { id: ERR_HANDOVER_NOT_ASSEMBLING, http: 409, condition: "mark-ready requires status ASSEMBLING or FM_REJECTED" }
  - { id: ERR_HANDOVER_NOT_READY, http: 409, condition: "transmit requires status READY" }
  - { id: ERR_HANDOVER_NOT_TRANSMITTED, http: 409, condition: "respond requires status TRANSMITTED" }
  - { id: ERR_AS_BUILTS_NOT_VERIFIED, http: 409, condition: "handover mark-ready blocked: no as-built models exist, or some are not FIELD_VERIFIED" }
  - { id: ERR_OPEN_CLASHES_REMAIN, http: 409, condition: "handover mark-ready blocked by any open clash; federated release blocked by any open CRITICAL clash" }
  # --- LOD requirement ---
  - { id: ERR_DUPLICATE_LOD_REQUIREMENT, http: 409, condition: "a LodRequirement for (project, discipline, phase) already exists" }

# =============================================================================
# 1.7 RBAC Matrix (segregation_of_duties model)
# =============================================================================
roles:
  - name: VDCManager
    description: "VDC/BIM manager: owns project configuration, LOD standards, partner onboarding, federated assembly lifecycle, freeze windows, takeoff approval, as-built verification, ops sweep, and the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /api/projects"
      - "POST /api/projects/{id}/advance-phase"
      - "POST /api/projects/{id}/run-coordination-sweep"
      - "POST /api/projects/{id}/lod-requirements"
      - "POST /api/projects/{id}/trade-partners"
      - "POST /api/projects/{id}/federated-models"
      - "POST /api/federated-models/{id}/freeze | unfreeze | release"
      - "POST /api/federated-models/{id}/freeze-windows"
      - "POST /api/as-built-models/{id}/verify"
      - "POST /api/quantity-takeoffs/{id}/approve"
      - "POST /api/_clock/set_current_utc"
    shared_operations:
      - "all GET endpoints"

  - name: BIMCoordinator
    description: "BIM coordinator: reviews models, runs clash detection, assigns/verifies/reopens clashes, runs coordination meetings and commitments, extracts quantities, manages handover"
    identity: opaque
    exclusive_operations:
      - "POST /api/trade-models/{id}/accept | reject"
      - "POST /api/federated-models/{id}/clash-runs"
      - "POST /api/clash-runs/{id}/start | clashes | complete"
      - "POST /api/clash-issues/{id}/assign | verify | reopen"
      - "POST /api/projects/{id}/coordination-meetings"
      - "POST /api/coordination-meetings/{id}/start | adjourn | commitments"
      - "POST /api/commitments/{id}/waive"
      - "POST /api/projects/{id}/quantity-takeoffs"
      - "POST /api/projects/{id}/handover-packages"
      - "POST /api/handover-packages/{id}/mark-ready | transmit"
    shared_operations:
      - "all GET endpoints"

  - name: TradeModelAuthor
    description: "Trade partner's model author: submits trade models, resolves clashes assigned to their partner, submits as-built updates. X-User-ID equals the TradePartner id."
    identity: "entity_backed:TradePartner"
    exclusive_operations:
      - "POST /api/projects/{id}/trade-models"
      - "POST /api/trade-models/{id}/submit"
      - "POST /api/clash-issues/{id}/resolve"
      - "POST /api/projects/{id}/as-built-models"
      - "POST /api/as-built-models/{id}/submit"
    shared_operations:
      - "all GET endpoints"

  - name: LeadEngineer
    description: "Lead engineer: signs or declines fabrication sign-offs. Segregation of duties: may not sign off a model they submitted (X-User-ID != pinned TradeModel.submitted_by_user_id)."
    identity: opaque
    exclusive_operations:
      - "POST /api/signoffs/{id}/sign"
      - "POST /api/signoffs/{id}/decline"
    shared_operations:
      - "all GET endpoints"

  - name: FabricationLead
    description: "Fabrication trade lead: creates fabrication packages, submits them for sign-off, requests release, voids. X-User-ID equals the TradePartner id of the fabricator."
    identity: "entity_backed:TradePartner"
    exclusive_operations:
      - "POST /api/projects/{id}/fabrication-packages"
      - "POST /api/fabrication-packages/{id}/submit-for-signoff | release | void"
    shared_operations:
      - "all GET endpoints"

  - name: FacilitiesManager
    description: "Facilities/owner representative: accepts or rejects transmitted handover packages"
    identity: opaque
    exclusive_operations:
      - "POST /api/handover-packages/{id}/respond"
    shared_operations:
      - "all GET endpoints"
