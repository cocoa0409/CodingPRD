  # ===========================================================================
  - section: rbac
    instances:
      - name: estimator_cannot_dispatch_job
        claim_type: peer_roles
        grounds:
          - roles.Estimator
          - roles.Dispatcher
          - validations[priority=2]
          - errors[ERR_FORBIDDEN_ROLE]
        distinguishing_aspect: "An Estimator calling POST /restoration/jobs/{id}/dispatch (a Dispatcher-exclusive op) returns ERR_FORBIDDEN_ROLE (403)."
        test_recipe:
          setup: ["A WATER job in FNOL; an active technician."]
          setup_api_calls:
            - call: "POST /restoration/claims"
              payload: { carrier_name: "Acme", policy_number: "PC23", peril: "WATER", coverage_limit_cents: 500000 }
              as: Adjuster
              as_user_id: "adj-1"
              captures: { claim_id: $.data.id }
            - call: "POST /restoration/technicians"
              payload: { full_name: "T", certification: "WRT" }
              as: PlatformAdmin
              captures: { tech_id: $.data.id }
            - call: "POST /restoration/jobs"
              payload: { claim_id: "${claim_id}", property_address: "X", loss_type: "WATER", water_category: 1, water_class: 1 }
              as: Dispatcher
              captures: { job_id: $.data.id }
          trigger:
            - call: "POST /restoration/jobs/${job_id}/dispatch"
              payload: { technician_id: "${tech_id}" }
              as: Estimator
              captures: { err: $.data.error_id }
          assert:
            - "response status == 403"
            - "data.error_id == ERR_FORBIDDEN_ROLE"

      - name: technician_cannot_approve_estimate
        claim_type: peer_roles
        grounds:
          - roles.Technician
          - roles.Adjuster
          - errors[ERR_FORBIDDEN_ROLE]
        distinguishing_aspect: "A Technician calling POST /restoration/estimates/{id}/approve (an Adjuster-exclusive op) returns ERR_FORBIDDEN_ROLE (403)."
        test_recipe:
          setup: ["A WATER job with a DRAFT estimate."]
          setup_api_calls:
            - call: "POST /restoration/claims"
              payload: { carrier_name: "Acme", policy_number: "PC24", peril: "WATER", coverage_limit_cents: 9000000 }
              as: Adjuster
              as_user_id: "adj-1"
              captures: { claim_id: $.data.id }
            - call: "POST /restoration/jobs"
              payload: { claim_id: "${claim_id}", property_address: "X", loss_type: "WATER", water_category: 1, water_class: 1 }
              as: Dispatcher
              captures: { job_id: $.data.id, job_v1: $.data.version }
            - call: "POST /restoration/estimates"
              payload: { job_id: "${job_id}", estimated_drying_days: 1, line_items: [ { qty: 1, unit_price_cents: 5000 } ], expected_job_version: "${job_v1}" }
              as: Estimator
              captures: { est_id: $.data.id }
          trigger:
            - call: "POST /restoration/estimates/${est_id}/approve"
              payload: {}
              as: Technician
              as_user_id: "tech-x"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 403"
            - "data.error_id == ERR_FORBIDDEN_ROLE"

      - name: missing_headers_returns_unauthenticated
        claim_type: peer_roles
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "A request with no X-User-Role / X-User-ID headers returns ERR_UNAUTHENTICATED (401) before any role or existence check."
        test_recipe:
          setup: ["Empty DB; the request omits auth headers."]
          setup_api_calls: []
          trigger:
            - call: "GET /restoration/jobs"
              payload: {}
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "response status == 401"
            - "data.error_id == ERR_UNAUTHENTICATED"

  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_job_version_on_estimate_create
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[estimate-create-stale-job]
          - entities.LossJob.fields.version
          - errors[ERR_STALE_JOB_VERSION]
        distinguishing_aspect: "After estimate E1 bumps the job version, a second estimate create still carrying the pre-E1 expected_job_version is rejected ERR_STALE_JOB_VERSION (412); the happy path passes the current version and succeeds."
        test_recipe:
          setup: ["A WATER job at version v1 (read from the create response); one estimate E1 created with expected_job_version=v1 (bumps job version)."]
          setup_api_calls:
            - call: "POST /restoration/claims"
              payload: { carrier_name: "Acme", policy_number: "PC25", peril: "WATER", coverage_limit_cents: 9000000 }
              as: Adjuster
              as_user_id: "adj-1"
              captures: { claim_id: $.data.id }
            - call: "POST /restoration/jobs"
              payload: { claim_id: "${claim_id}", property_address: "X", loss_type: "WATER", water_category: 1, water_class: 1 }
              as: Dispatcher
              captures: { job_id: $.data.id, job_v1: $.data.version }
            - call: "POST /restoration/estimates"
              payload: { job_id: "${job_id}", estimated_drying_days: 1, line_items: [ { qty: 1, unit_price_cents: 5000 } ], expected_job_version: "${job_v1}" }
              as: Estimator
              captures: { e1: $.data.id }
          trigger:
            - call: "POST /restoration/estimates"
              payload: { job_id: "${job_id}", estimated_drying_days: 1, line_items: [ { qty: 1, unit_price_cents: 5000 } ], expected_job_version: "${job_v1}" }
              as: Estimator
              captures: { err: $.data.error_id }
          assert:
            - "trigger response status == 412"
            - "data.error_id == ERR_STALE_JOB_VERSION"

      - name: occ_correct_version_supersedes_prior_draft
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[estimate-create-stale-job]
          - state_machines.ScopeEstimate.DRAFT_to_SUPERSEDED
          - entities.ScopeEstimate.fields.status
        distinguishing_aspect: "Passing the current (re-read) expected_job_version on the second estimate create succeeds (201) and supersedes E1 (E1.status -> SUPERSEDED)."
        test_recipe:
          setup: ["A WATER job; one DRAFT estimate E1; the current job version re-read via GET."]
          setup_api_calls:
            - call: "POST /restoration/claims"
              payload: { carrier_name: "Acme", policy_number: "PC26", peril: "WATER", coverage_limit_cents: 9000000 }
              as: Adjuster
              as_user_id: "adj-1"
              captures: { claim_id: $.data.id }
            - call: "POST /restoration/jobs"
              payload: { claim_id: "${claim_id}", property_address: "X", loss_type: "WATER", water_category: 1, water_class: 1 }
              as: Dispatcher
              captures: { job_id: $.data.id, job_v1: $.data.version }
            - call: "POST /restoration/estimates"
              payload: { job_id: "${job_id}", estimated_drying_days: 1, line_items: [ { qty: 1, unit_price_cents: 5000 } ], expected_job_version: "${job_v1}" }
              as: Estimator
              captures: { e1: $.data.id }
            - call: "GET /restoration/jobs/${job_id}"
              payload: {}
              as: Dispatcher
              captures: { job_v_now: $.data.version }
          trigger:
            - call: "POST /restoration/estimates"
              payload: { job_id: "${job_id}", estimated_drying_days: 2, line_items: [ { qty: 1, unit_price_cents: 6000 } ], expected_job_version: "${job_v_now}" }
              as: Estimator
              captures: { e2: $.data.id }
          trigger_note: "Second create succeeds with the current version."
          assert:
            - "trigger response status == 201"
            - "ScopeEstimate.${e1}.status == SUPERSEDED"
            - "ScopeEstimate.${e2}.status == DRAFT"

      - name: cancel_returns_contents_cascade
        claim_type: cascading_side_effects
        grounds:
          - state_machines.LossJob.MITIGATION_to_CANCELLED
          - state_machines.ContentsItem.PACKED_OUT_to_RETURNED
        distinguishing_aspect: "Cancelling a MITIGATION job with PACKED_OUT and STORED contents transitions both to RETURNED (contents-side cascade), independent of the equipment cascade."
        excluded_because:
          difficulty_instance: transitive_cascade / cancel_depth3_placement_unit_chamber
          rationale: "The cancel cascade (equipment + chambers) is asserted by the named §1.8 depth-3 instance; the contents leg rides the same cancel side-effect list."

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: estimate_create_immediate_computed_fields
        claim_type: immediate
        grounds:
