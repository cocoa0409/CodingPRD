    roles: [Bookkeeper]
    code: 201
    input: [amount_cents]
    output: Refund
    side_effects: ["Refund PENDING with reason OVERPAYMENT_RETURN; refund_cents := amount_cents (no proration)"]
  - method: GET
    path: "/student-accounts/{id}/refunds"
    description: "List refunds for an account"
    roles: [Bookkeeper, FamilyMember, Superintendent]
    code: 200
    input: ["limit?", "offset?", "status?", "reason?"]
    output: "Refund[]"
    side_effects: []
