            - call: "POST /venues"
              payload: { market_id: "${th_mk_id}", name: "Threshold Arena", gross_capacity: 1000, facility_fee_cents_per_ticket: 0, ticket_tax_pct: 0 }
              as: TalentBuyer
              captures: { th_vn_id: $.data.id }
            - call: "POST /shows"
              payload: { artist_id: "${th_ar_id}", venue_id: "${th_vn_id}", event_at: "2026-11-04T02:00:00.000Z", load_in_at: "2026-11-03T14:00:00.000Z", load_out_at: "2026-11-04T08:00:00.000Z", announce_at: "2026-08-01T00:00:00.000Z", venue_arrangement: "RENTAL", rental_fee_cents: 0 }
              as: TalentBuyer
              captures: { th_sh_id: $.data.id, th_sh_v: $.data.version }
            - call: "POST /offers"
              payload: { show_id: "${th_sh_id}", expected_show_version: "${th_sh_v}", deal_structure: "FLAT_GUARANTEE", guarantee_cents: 500000, deposit_cents: 0, expense_cap_cents: 500000 }
              as: TalentBuyer
              captures: { th_of_id: $.data.id }
            - call: "POST /offers/${th_of_id}/submit"
              payload: {}
              as: TalentBuyer
            - call: "POST /offers/${th_of_id}/accept"
              payload: {}
              as: ArtistRep
              as_user_id: "${th_ar_id}"
            - call: "POST /ticket-tiers"
              payload: { show_id: "${th_sh_id}", tier_name: "GA", price_cents: 5000, allocation_qty: 1000 }
              as: TalentBuyer
              captures: { th_tt_id: $.data.id }
            - call: "POST /shows/${th_sh_id}/on-sale"
              payload: {}
              as: TalentBuyer
          trigger:
            # threshold - 1
            - call: "POST /ticket-holds"
              payload: { ticket_tier_id: "${th_tt_id}", kind: "COMP", qty: 29, holder: "Radio winners" }
              as: TalentBuyer
              captures: { th_h29_id: $.data.id }
            - call: "GET /ticket-tiers/${th_tt_id}"
              payload: {}
              as: TalentBuyer
              captures: { th_comp_at_29: $.data.comp_qty }
            # exactly at threshold
            - call: "POST /ticket-holds"
              payload: { ticket_tier_id: "${th_tt_id}", kind: "COMP", qty: 1, holder: "Label guest" }
              as: TalentBuyer
              captures: { th_h30_id: $.data.id }
            - call: "GET /ticket-tiers/${th_tt_id}"
              payload: {}
              as: TalentBuyer
              captures: { th_comp_at_30: $.data.comp_qty }
            # threshold + 1
            - call: "POST /ticket-holds"
              payload: { ticket_tier_id: "${th_tt_id}", kind: "COMP", qty: 1, holder: "One too many" }
              as: TalentBuyer
              captures: { th_err_31st: $.data.error_id }
            # a non-comp hold is unaffected by the allowance
            - call: "POST /ticket-holds"
              payload: { ticket_tier_id: "${th_tt_id}", kind: "ARTIST_HOLD", qty: 5, holder: "Artist family" }
              as: TalentBuyer
              captures: { th_ah_id: $.data.id }
            # ... but converting it would take the cumulative total to 35
            - call: "POST /ticket-holds/${th_ah_id}/convert-to-comp"
              payload: {}
              as: TalentBuyer
              captures: { th_err_convert: $.data.error_id }
            - call: "GET /ticket-tiers/${th_tt_id}"
              payload: {}
              as: TalentBuyer
              captures: { th_comp_mid: $.data.comp_qty, th_held_mid: $.data.held_qty, th_avail_mid: $.data.available_qty, th_sold_mid: $.data.sold_qty }
            # release one comp and the next one is admitted again
            - call: "POST /ticket-holds/${th_h30_id}/release"
              payload: {}
              as: TalentBuyer
              captures: { th_h30_status: $.data.status }
            - call: "GET /ticket-tiers/${th_tt_id}"
              payload: {}
              as: TalentBuyer
              captures: { th_comp_after_release: $.data.comp_qty }
            - call: "POST /ticket-holds"
              payload: { ticket_tier_id: "${th_tt_id}", kind: "COMP", qty: 1, holder: "Backfill guest" }
              as: TalentBuyer
              captures: { th_h30b_id: $.data.id }
            - call: "GET /shows/${th_sh_id}"
              payload: {}
              as: TalentBuyer
              captures: { th_show_comps: $.data.comp_tickets_issued, th_show_held: $.data.held_tickets }
          assert:
            - "AT THRESHOLD - 1 — the 29-seat COMP hold is 201 and ${th_comp_at_29} == 29"
            - "AT THRESHOLD — the 30th comp is 201 and ${th_comp_at_30} == 30 == ROUND_HALF_UP(1000 * 3.0 / 100); the boundary is inclusive (comps_after <= allowance)"
            - "AT THRESHOLD + 1 — ${th_err_31st} == ERR_COMP_ALLOWANCE_EXCEEDED with HTTP 422, not 409 and not ERR_INSUFFICIENT_TIER_INVENTORY (965 seats are still available, so inventory is not the binding constraint)"
            - "NON-COMP HOLDS ARE OUTSIDE THE ALLOWANCE — the 5-seat ARTIST_HOLD ${th_ah_id} is 201 even though the comp counter is already at its ceiling"
            - "CONVERSION IS INSIDE IT — ${th_err_convert} == ERR_COMP_ALLOWANCE_EXCEEDED 422, because 30 + 5 > 30; the hold stays HELD with kind ARTIST_HOLD and the conversion has no partial effect"
            - "INVENTORY IDENTITY HOLDS AT THE BOUNDARY — ${th_sold_mid} 0 + ${th_comp_mid} 30 + ${th_held_mid} 5 + ${th_avail_mid} 965 == 1000 == allocation_qty"
            - "THE CHECK IS A LIVE RECOUNT — ${th_h30_status} == RELEASED, ${th_comp_after_release} == 29, and the replacement comp ${th_h30b_id} is 201; a high-water-mark implementation would refuse it"
            - "SHOW ROLL-UP — ${th_show_comps} == 30 and ${th_show_held} == 5 after the backfill"

      - name: settlement_projection_re_evaluates_when_the_pending_inventory_and_budget_change
        claim_type: forward_looking
        grounds:
          - "calculations.show_settlement_projection.variants[PROVISIONAL]"
          - "calculations.show_settlement_projection.formula"
          - "entities.Show.fields.projected_adjusted_gross_cents"
          - "entities.Show.fields.projected_promoter_net_cents"
          - "endpoints[GET /shows/{show_id}/settlement-projection]"
        distinguishing_aspect: "Six readings of the same show walk the projection down a ladder as PENDING items move: 975000/275000 at rest, unchanged after 20 real sales (the provisional variant values the whole sellable allocation and ignores sales history), 945750/245750 once 6 comps are papered, 897000/197000 once a 10-seat ARTIST_HOLD lands, 897000/97000 once a 100000 marketing line is budgeted (gross untouched, margin cut), and back to 945750/145750 when the hold is released. Every step is a full re-derivation, not an increment."
        test_recipe:
          setup:
            - "BASE(Forward Market limit 5000000, Forward Act withholding 0, Forward Room cap 300 / facility 0 / tax 0)."
            - "CONFIRMED RENTAL show (rental_fee 0) on an accepted FLAT_GUARANTEE offer: guarantee 500000, deposit 0, expense_cap 1000000."
            - "One GA tier priced 5000 with allocation 200, show ON_SALE. One ACTIVE PRODUCTION line budgeted 200000 with is_artist_deductible false."
            - "Comp allowance for a 200 allocation is ROUND_HALF_UP(200 * 3.0 / 100) == 6, so the 6 comps in step 3 sit exactly on the ceiling."
          setup_api_calls:
            - call: "POST /markets"
              payload: { name: "Forward Market", region_code: "FW", guarantee_exposure_limit_cents: 5000000 }
              as: RiskOfficer
              captures: { fw_mk_id: $.data.id }
            - call: "POST /artists"
              payload: { name: "Forward Act", agency: "Fwd Talent", tier: "CLUB", historical_sellthrough_pct: 52.00, withholding_pct: 0 }
              as: TalentBuyer
              captures: { fw_ar_id: $.data.id }
            - call: "POST /venues"
              payload: { market_id: "${fw_mk_id}", name: "Forward Room", gross_capacity: 300, facility_fee_cents_per_ticket: 0, ticket_tax_pct: 0 }
              as: TalentBuyer
              captures: { fw_vn_id: $.data.id }
            - call: "POST /shows"
              payload: { artist_id: "${fw_ar_id}", venue_id: "${fw_vn_id}", event_at: "2026-11-08T02:00:00.000Z", load_in_at: "2026-11-07T14:00:00.000Z", load_out_at: "2026-11-08T08:00:00.000Z", announce_at: "2026-08-01T00:00:00.000Z", venue_arrangement: "RENTAL", rental_fee_cents: 0 }
              as: TalentBuyer
              captures: { fw_sh_id: $.data.id, fw_sh_v: $.data.version }
            - call: "POST /offers"
              payload: { show_id: "${fw_sh_id}", expected_show_version: "${fw_sh_v}", deal_structure: "FLAT_GUARANTEE", guarantee_cents: 500000, deposit_cents: 0, expense_cap_cents: 1000000 }
              as: TalentBuyer
              captures: { fw_of_id: $.data.id }
            - call: "POST /offers/${fw_of_id}/submit"
              payload: {}
              as: TalentBuyer
            - call: "POST /offers/${fw_of_id}/accept"
              payload: {}
              as: ArtistRep
              as_user_id: "${fw_ar_id}"
            - call: "POST /ticket-tiers"
              payload: { show_id: "${fw_sh_id}", tier_name: "GA", price_cents: 5000, allocation_qty: 200 }
              as: TalentBuyer
              captures: { fw_tt_id: $.data.id }
            - call: "POST /shows/${fw_sh_id}/on-sale"
              payload: {}
              as: TalentBuyer
            - call: "POST /budget-lines"
              payload: { show_id: "${fw_sh_id}", category: "PRODUCTION", description: "Stage and backline", budgeted_cents: 200000, is_artist_deductible: false }
              as: TourAccountant
              captures: { fw_bl1_id: $.data.id }
          trigger:
            # reading 0 - at rest
            - call: "GET /shows/${fw_sh_id}/settlement-projection"
              payload: {}
              as: TourAccountant
              captures: { fw_p0_adj: $.data.adjusted_gross_cents, fw_p0_earn: $.data.artist_earnings_cents, fw_p0_coop: $.data.artist_coop_contribution_cents }
            - call: "GET /shows/${fw_sh_id}"
              payload: {}
              as: TourAccountant
              captures: { fw_s0_padj: $.data.projected_adjusted_gross_cents, fw_s0_pnet: $.data.projected_promoter_net_cents }
            # reading 1 - 20 real sales must NOT move a provisional projection
            - call: "POST /ticket-tiers/${fw_tt_id}/sales"
              payload: { qty: 20 }
              as: TalentBuyer
            - call: "GET /shows/${fw_sh_id}/settlement-projection"
              payload: {}
              as: TourAccountant
              captures: { fw_p1_adj: $.data.adjusted_gross_cents }
            - call: "GET /shows/${fw_sh_id}"
              payload: {}
              as: TourAccountant
              captures: { fw_s1_pnet: $.data.projected_promoter_net_cents, fw_s1_gross: $.data.gross_sold_cents }
            # reading 2 - papering 6 comps removes them from the sellable base
            - call: "POST /ticket-holds"
              payload: { ticket_tier_id: "${fw_tt_id}", kind: "COMP", qty: 6, holder: "Street team" }
              as: TalentBuyer
              captures: { fw_comp_id: $.data.id }
            - call: "GET /shows/${fw_sh_id}/settlement-projection"
              payload: {}
              as: TourAccountant
              captures: { fw_p2_adj: $.data.adjusted_gross_cents }
            - call: "GET /shows/${fw_sh_id}"
              payload: {}
              as: TourAccountant
              captures: { fw_s2_padj: $.data.projected_adjusted_gross_cents, fw_s2_pnet: $.data.projected_promoter_net_cents }
            # reading 3 - a pending (non-comp) hold also leaves the sellable base
            - call: "POST /ticket-holds"
              payload: { ticket_tier_id: "${fw_tt_id}", kind: "ARTIST_HOLD", qty: 10, holder: "Artist guests" }
              as: TalentBuyer
              captures: { fw_ah_id: $.data.id }
            - call: "GET /shows/${fw_sh_id}/settlement-projection"
              payload: {}
              as: TourAccountant
              captures: { fw_p3_adj: $.data.adjusted_gross_cents }
            - call: "GET /shows/${fw_sh_id}"
              payload: {}
              as: TourAccountant
              captures: { fw_s3_pnet: $.data.projected_promoter_net_cents }
            # reading 4 - a budgeted deductible line moves the artist leg and the margin, not the gross
            - call: "POST /budget-lines"
              payload: { show_id: "${fw_sh_id}", category: "MARKETING", description: "Print and radio", budgeted_cents: 100000, is_artist_deductible: true }
              as: TourAccountant
              captures: { fw_bl2_id: $.data.id }
            - call: "GET /shows/${fw_sh_id}/settlement-projection"
              payload: {}
              as: TourAccountant
              captures: { fw_p4_adj: $.data.adjusted_gross_cents, fw_p4_allowed: $.data.allowed_expense_cents, fw_p4_break: $.data.breakeven_cents, fw_p4_coop: $.data.artist_coop_contribution_cents, fw_p4_earn: $.data.artist_earnings_cents }
            - call: "GET /shows/${fw_sh_id}"
              payload: {}
              as: TourAccountant
              captures: { fw_s4_pnet: $.data.projected_promoter_net_cents, fw_s4_budget: $.data.total_budgeted_expense_cents }
            # reading 5 - releasing the pending hold returns its seats to the base
            - call: "POST /ticket-holds/${fw_ah_id}/release"
              payload: {}
              as: TalentBuyer
            - call: "GET /shows/${fw_sh_id}"
              payload: {}
              as: TourAccountant
              captures: { fw_s5_padj: $.data.projected_adjusted_gross_cents, fw_s5_pnet: $.data.projected_promoter_net_cents }
          assert:
            - "READING 0 — ${fw_p0_adj} == 975000 (200 sellable at 5000 == 1000000 less the 25000 card fee), ${fw_s0_padj} == 975000, ${fw_s0_pnet} == 275000 == 975000 - 500000 guarantee - 200000 budget; ${fw_p0_earn} == 500000 and ${fw_p0_coop} == 0 (no marketing line yet)"
            - "READING 1 — SALES HISTORY IS IGNORED: ${fw_s1_gross} == 100000 (20 seats really sold) yet ${fw_p1_adj} == 975000 and ${fw_s1_pnet} == 275000 are UNCHANGED; the provisional variant values the whole sellable allocation, so an implementation that added sold gross would report 1072500"
            - "READING 2 — 6 comps leave 194 sellable: ${fw_p2_adj} == ${fw_s2_padj} == 945750 (970000 less 24250) and ${fw_s2_pnet} == 245750, a 29250 drop"
            - "READING 3 — a 10-seat ARTIST_HOLD leaves 184 sellable: ${fw_p3_adj} == 897000 (920000 less 23000) and ${fw_s3_pnet} == 197000; pending holds count exactly like comps for the sellable base even though they are not comps for the allowance"
            - "READING 4 — GROSS IS UNMOVED, THE LEGS ARE NOT: ${fw_p4_adj} == 897000 still, but ${fw_s4_budget} == 300000 and ${fw_s4_pnet} == 97000; ${fw_p4_allowed} == 100000 (BUDGETED deductible, the marketing line only), ${fw_p4_break} == 600000, ${fw_p4_coop} == 25000 (share leg 50000 vs cap leg 25000, MIN takes the cap) and ${fw_p4_earn} == 475000"
            - "READING 5 — RE-EVALUATION IS SYMMETRIC: after releasing the hold ${fw_s5_padj} == 945750 and ${fw_s5_pnet} == 145750 == 945750 - 500000 - 300000; the released seats come back at full price and the budget stays"
            - "NOTHING IS PERSISTED BY THE PROJECTION READ — GET /settlements?show_id=${fw_sh_id} returns total_count 0 across all six readings and the projection response carries id null and version null"

      - name: tier_gross_accumulates_at_as_sold_prices_across_two_price_moves
        claim_type: chronological
        grounds:
          - "calculations.tier_gross_accumulation"
          - "calculations.tier_gross_accumulation.order_sensitivity"
          - "entities.TicketTier.fields.gross_sold_cents"
          - "entities.TicketTier.fields.last_price_cents"
          - "endpoints[POST /ticket-tiers/{ticket_tier_id}/price-adjustments]"
        distinguishing_aspect: "Three GA sales straddle two price moves (10 at 5000, 10 at 6000, 5 at 4000) with a BALCONY sale interleaved between the first two, so gross_sold_cents is 130000 and no single price reproduces it: recomputing at the CURRENT price gives 100000, at the OPENING price 125000, at the HIGHEST price 150000. A fourth price move to 9000 with no sales behind it must leave the accumulator untouched, which is what separates an accumulator from a re-derivation."
        test_recipe:
          setup:
            - "BASE(Chrono Market limit 5000000, Chrono Act withholding 0, Chrono Hall cap 100 / facility 0 / tax 0)."
            - "CONFIRMED RENTAL show on an accepted FLAT_GUARANTEE offer of 500000. Two tiers created BEFORE on-sale so both are driven DRAFT -> ON_SALE by the cascade: GA 5000 x 30 and BALCONY 3000 x 10."
            - "Every price adjustment carries the CURRENT expected_show_version, re-read from GET /shows immediately before it, because sales bump the show's version."
          setup_api_calls:
            - call: "POST /markets"
              payload: { name: "Chrono Market", region_code: "CH", guarantee_exposure_limit_cents: 5000000 }
              as: RiskOfficer
              captures: { ch_mk_id: $.data.id }
            - call: "POST /artists"
              payload: { name: "Chrono Act", agency: "Chr Talent", tier: "CLUB", historical_sellthrough_pct: 46.00, withholding_pct: 0 }
              as: TalentBuyer
              captures: { ch_ar_id: $.data.id }
            - call: "POST /venues"
              payload: { market_id: "${ch_mk_id}", name: "Chrono Hall", gross_capacity: 100, facility_fee_cents_per_ticket: 0, ticket_tax_pct: 0 }
              as: TalentBuyer
              captures: { ch_vn_id: $.data.id }
            - call: "POST /shows"
              payload: { artist_id: "${ch_ar_id}", venue_id: "${ch_vn_id}", event_at: "2026-11-10T02:00:00.000Z", load_in_at: "2026-11-09T14:00:00.000Z", load_out_at: "2026-11-10T08:00:00.000Z", announce_at: "2026-08-01T00:00:00.000Z", venue_arrangement: "RENTAL", rental_fee_cents: 0 }
              as: TalentBuyer
              captures: { ch_sh_id: $.data.id, ch_sh_v: $.data.version }
            - call: "POST /offers"
              payload: { show_id: "${ch_sh_id}", expected_show_version: "${ch_sh_v}", deal_structure: "FLAT_GUARANTEE", guarantee_cents: 500000, deposit_cents: 0, expense_cap_cents: 500000 }
              as: TalentBuyer
              captures: { ch_of_id: $.data.id }
            - call: "POST /offers/${ch_of_id}/submit"
              payload: {}
              as: TalentBuyer
            - call: "POST /offers/${ch_of_id}/accept"
              payload: {}
              as: ArtistRep
              as_user_id: "${ch_ar_id}"
            - call: "POST /ticket-tiers"
              payload: { show_id: "${ch_sh_id}", tier_name: "GA", price_cents: 5000, allocation_qty: 30 }
              as: TalentBuyer
              captures: { ch_ga_id: $.data.id }
            - call: "POST /ticket-tiers"
              payload: { show_id: "${ch_sh_id}", tier_name: "BALCONY", price_cents: 3000, allocation_qty: 10 }
              as: TalentBuyer
              captures: { ch_bal_id: $.data.id }
            - call: "POST /shows/${ch_sh_id}/on-sale"
              payload: {}
              as: TalentBuyer
          trigger:
            - call: "POST /ticket-tiers/${ch_ga_id}/sales"
              payload: { qty: 10 }
              as: TalentBuyer
            - call: "POST /ticket-tiers/${ch_bal_id}/sales"
              payload: { qty: 10 }
              as: TalentBuyer
            - call: "GET /shows/${ch_sh_id}"
              payload: {}
              as: TalentBuyer
              captures: { ch_v1: $.data.version }
            - call: "POST /ticket-tiers/${ch_ga_id}/price-adjustments"
              payload: { new_price_cents: 6000, expected_show_version: "${ch_v1}", reason: "Demand upgrade after the first hundred" }
              as: TalentBuyer
              captures: { ch_last1: $.data.last_price_cents, ch_rev1: $.data.price_revision_count, ch_gross_after_adj1: $.data.gross_sold_cents }
            - call: "POST /ticket-tiers/${ch_ga_id}/sales"
              payload: { qty: 10 }
              as: TalentBuyer
            - call: "GET /shows/${ch_sh_id}"
              payload: {}
              as: TalentBuyer
              captures: { ch_v2: $.data.version }
            - call: "POST /ticket-tiers/${ch_ga_id}/price-adjustments"
              payload: { new_price_cents: 4000, expected_show_version: "${ch_v2}", reason: "Discount the last release" }
              as: TalentBuyer
            - call: "POST /ticket-tiers/${ch_ga_id}/sales"
              payload: { qty: 5 }
              as: TalentBuyer
              captures: { ch_ga_gross: $.data.gross_sold_cents, ch_ga_sold: $.data.sold_qty, ch_ga_price: $.data.price_cents, ch_ga_last: $.data.last_price_cents, ch_ga_rev: $.data.price_revision_count }
            - call: "GET /ticket-tiers/${ch_bal_id}"
              payload: {}
              as: TalentBuyer
              captures: { ch_bal_gross: $.data.gross_sold_cents, ch_bal_price: $.data.price_cents }
            - call: "GET /shows/${ch_sh_id}"
              payload: {}
              as: TourAccountant
              captures: { ch_show_gross: $.data.gross_sold_cents, ch_show_adj: $.data.adjusted_gross_cents, ch_show_tickets: $.data.paid_tickets_sold, ch_v3: $.data.version }
            # a revision with NO sales behind it must not revalue anything
            - call: "POST /ticket-tiers/${ch_ga_id}/price-adjustments"
              payload: { new_price_cents: 9000, expected_show_version: "${ch_v3}", reason: "Late walk-up pricing, no sales taken" }
              as: TalentBuyer
              captures: { ch_price_final: $.data.price_cents, ch_gross_final: $.data.gross_sold_cents, ch_rev_final: $.data.price_revision_count, ch_last_final: $.data.last_price_cents }
            - call: "GET /shows/${ch_sh_id}"
              payload: {}
              as: TourAccountant
              captures: { ch_show_gross_final: $.data.gross_sold_cents, ch_show_adj_final: $.data.adjusted_gross_cents }
          assert:
            - "AS-SOLD ACCUMULATION — ${ch_ga_gross} == 130000 == 10*5000 + 10*6000 + 5*4000 with ${ch_ga_sold} == 25; NOT 100000 (25 at the current 4000), NOT 125000 (25 at the opening 5000), NOT 150000 (25 at the highest 6000)"
            - "A PRICE MOVE ALONE MOVES NOTHING — ${ch_gross_after_adj1} == 50000: the first revision to 6000 left the 10 already-sold seats valued at 5000"
            - "REVISION BOOKKEEPING — after the third sale ${ch_ga_price} == 4000, ${ch_ga_last} == 6000 (the price immediately before the most recent move, not the original 5000) and ${ch_ga_rev} == 2"
            - "THE INTERLEAVED TIER IS INDEPENDENT — ${ch_bal_gross} == 30000 and ${ch_bal_price} == 3000; the GA revisions never touched it, and its sale landing between the GA sales did not disturb GA's ordering"
            - "SHOW ROLL-UP — ${ch_show_gross} == 160000 == 130000 + 30000, ${ch_show_tickets} == 35, ${ch_show_adj} == 156000 (card fee 4000, tax and facility 0); a re-deriving implementation would report 130000, 155000 or 180000 here"
            - "HISTORY IS NEVER REVALUED — after the fourth move ${ch_price_final} == 9000, ${ch_rev_final} == 3 and ${ch_last_final} == 4000, yet ${ch_gross_final} == 130000, ${ch_show_gross_final} == 160000 and ${ch_show_adj_final} == 156000 are byte-identical to the pre-move values"

