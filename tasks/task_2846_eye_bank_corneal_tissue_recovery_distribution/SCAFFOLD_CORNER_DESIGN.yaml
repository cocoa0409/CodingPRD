# =============================================================================
# 1.9 Scaffold Corner Design — Breadth Index
# Task 2846 — Eye Bank Corneal Tissue Recovery & Distribution
#
# Walked from references/claim-extraction-guide.md against SCAFFOLD.yaml
# §1.1-§1.7. §1.8 is the depth probe; this file is the breadth probe. Corners
# already asserted by a §1.8 instance carry an `excluded_because:` stub and no
# test_recipe.
#
# Conventions shared with SCAFFOLD_DIFFICULTY_DESIGN.yaml:
#   * the logical clock starts at 2026-08-01T00:00:00Z and is set explicitly to
#     2026-08-03T06:00:00.000Z as the first call of every chain (the single
#     exception is the endpoints instance that probes the startup default);
#   * donor death_at is 2026-08-03T02:00:00.000Z so it is always in the past;
#   * every instant carries exactly three fractional-second digits;
#   * error triggers capture `$.data.error_id` per §1.0's error envelope.
#
# Error ids not triggered here are triggered by §1.8 instances (see the
# `errors` section's excluded_because stubs) or by the heavy distribution
# chains those instances already drive end-to-end.
# =============================================================================
scaffold_corner_design:

  - section: entities
    instances:

      - name: donor_referral_creation_returns_the_computed_recovery_window_and_every_default
        claim_type: creation
        grounds:
          - "endpoints[POST /eye-bank/donors]"
          - calculations.donor_recovery_window
          - entities.Donor.fields.recovery_window_minutes
          - entities.Donor.fields.recovery_deadline_at
          - response_envelope.success
        distinguishing_aspect: |
          A single POST with all six required fields returns 201 and every declared default in
          one response: window 960 minutes (720 ASYSTOLE base + 240 fast-cooling credit, no age
          penalty at 52), deadline 2026-08-03T18:00:00.000Z, status REFERRED, consent NONE,
          serology PENDING, risk 0, lookback false and version 1.
        test_recipe:
          setup:
            - "empty database; logical clock set to 2026-08-03T06:00:00.000Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T06:00:00.000Z" }
              as: EyeBankCoordinator
          trigger:
            - call: "POST /eye-bank/donors"
              payload: { donor_code: "D-2846-C01", referral_source: "HOSPITAL", death_at: "2026-08-03T02:00:00.000Z", death_time_basis: "ASYSTOLE", body_cooled_at: "2026-08-03T03:00:00.000Z", age_years: 52, cause_of_death_category: "CARDIAC" }
              as: EyeBankCoordinator
              captures: { donor_id: $.data.id, win: $.data.recovery_window_minutes, deadline: $.data.recovery_deadline_at, st: $.data.status, ctype: $.data.consent_type, cscope: $.data.consent_scope, sero: $.data.serology_status, risk: $.data.screening_risk_score, variant: $.data.screening_risk_variant, lb: $.data.lookback_flag, trc: $.data.tissues_recovered_count, v: $.data.version, created: $.data.created_at }
          assert:
            - "HTTP 201"
            - "${win} == 960"
            - "${deadline} == \"2026-08-03T18:00:00.000Z\""
            - "${st} == \"REFERRED\""
            - "${ctype} == \"NONE\" and ${cscope} == \"NONE\""
            - "${sero} == \"PENDING\""
            - "${risk} == 0 and ${variant} == \"INTERVIEW_ONLY\""
            - "${lb} == false and ${trc} == 0"
            - "${v} == 1"
            - "${created} == \"2026-08-03T06:00:00.000Z\" (server-stamped from the logical clock, three fractional digits)"

      - name: donor_read_by_id_returns_the_stored_referral_row
        claim_type: retrieval
        grounds:
          - "endpoints[GET /eye-bank/donors/{id}]"
          - entities.Donor.fields.donor_code
          - entities.Donor.fields.death_time_basis
          - roles.LabTechnician.shared_operations
        distinguishing_aspect: |
          GET /eye-bank/donors/{id} read by a LabTechnician returns exactly the row POST created —
          donor_code D-2846-C02, PRONOUNCED basis, age 75, window 840 and deadline
          2026-08-03T16:00:00.000Z — with no field re-derived or mutated by the read.
        test_recipe:
          setup:
            - "logical clock at 2026-08-03T06:00:00.000Z"
            - "one donor: PRONOUNCED basis, cooled at 2026-08-03T04:00:00.000Z (cooling delay 120 min -> fast credit 240), age 75 -> window 660 + 240 - 60 = 840"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T06:00:00.000Z" }
              as: EyeBankCoordinator
            - call: "POST /eye-bank/donors"
              payload: { donor_code: "D-2846-C02", referral_source: "HOSPICE", death_at: "2026-08-03T02:00:00.000Z", death_time_basis: "PRONOUNCED", body_cooled_at: "2026-08-03T04:00:00.000Z", age_years: 75, cause_of_death_category: "NEUROLOGIC" }
              as: EyeBankCoordinator
              captures: { donor_id: $.data.id }
          trigger:
            - call: "GET /eye-bank/donors/${donor_id}"
              payload: {}
              as: LabTechnician
              captures: { code: $.data.donor_code, src: $.data.referral_source, basis: $.data.death_time_basis, age: $.data.age_years, win: $.data.recovery_window_minutes, deadline: $.data.recovery_deadline_at, v: $.data.version }
          assert:
            - "HTTP 200"
            - "${code} == \"D-2846-C02\" and ${src} == \"HOSPICE\""
            - "${basis} == \"PRONOUNCED\" and ${age} == 75"
            - "${win} == 840"
            - "${deadline} == \"2026-08-03T16:00:00.000Z\""
            - "${v} == 1 (a read never bumps version)"

      - name: donor_list_is_paginated_newest_created_at_first_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - "endpoints[GET /eye-bank/donors]"
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
          - "endpoints[POST /_clock/set_current_utc]"
        distinguishing_aspect: |
          Three donors created at three distinct logical instants (06:00, 06:10, 06:20) list
          newest created_at first: limit 2 offset 0 returns D-2846-C05 then D-2846-C04 with
          total_count 3 and has_more true, while offset 2 returns the single oldest row with
          has_more false.
        test_recipe:
          setup:
            - "three donors created at 2026-08-03T06:00:00.000Z, 06:10 and 06:20 so created_at ordering is strict"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T06:00:00.000Z" }
              as: EyeBankCoordinator
            - call: "POST /eye-bank/donors"
              payload: { donor_code: "D-2846-C03", referral_source: "HOSPITAL", death_at: "2026-08-03T02:00:00.000Z", death_time_basis: "ASYSTOLE", age_years: 52, cause_of_death_category: "CARDIAC" }
              as: EyeBankCoordinator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T06:10:00.000Z" }
              as: EyeBankCoordinator
            - call: "POST /eye-bank/donors"
              payload: { donor_code: "D-2846-C04", referral_source: "HOSPICE", death_at: "2026-08-03T02:00:00.000Z", death_time_basis: "ASYSTOLE", age_years: 60, cause_of_death_category: "TRAUMA" }
              as: EyeBankCoordinator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T06:20:00.000Z" }
              as: EyeBankCoordinator
            - call: "POST /eye-bank/donors"
              payload: { donor_code: "D-2846-C05", referral_source: "MEDICAL_EXAMINER", death_at: "2026-08-03T02:00:00.000Z", death_time_basis: "PRONOUNCED", age_years: 44, cause_of_death_category: "OTHER" }
              as: EyeBankCoordinator
          trigger:
            - call: "GET /eye-bank/donors"
              payload: { limit: 2, offset: 0 }
              as: EyeBankCoordinator
              captures: { n1: $.total_count, more1: $.has_more, p1_first: "$.data[0].donor_code", p1_second: "$.data[1].donor_code" }
            - call: "GET /eye-bank/donors"
              payload: { limit: 2, offset: 2 }
              as: EyeBankCoordinator
              captures: { n2: $.total_count, more2: $.has_more, p2_first: "$.data[0].donor_code" }
          assert:
            - "${n1} == 3 and ${more1} == true"
            - "${p1_first} == \"D-2846-C05\" and ${p1_second} == \"D-2846-C04\""
            - "${n2} == 3 and ${more2} == false"
            - "${p2_first} == \"D-2846-C03\""
            - "page 2 carries exactly 1 element"

      - name: donor_read_with_an_unknown_uuid_yields_err_donor_not_found
        claim_type: not_found
        grounds:
          - "endpoints[GET /eye-bank/donors/{id}]"
          - "errors[ERR_DONOR_NOT_FOUND]"
          - validations.priority_4
        distinguishing_aspect: |
          A syntactically valid UUID that matches no Donor row returns 404 ERR_DONOR_NOT_FOUND
          with the §1.0 error envelope (data.error_id + data.message), not an empty 200 body.
        test_recipe:
          setup:
            - "empty database apart from the clock; no donor exists"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T06:00:00.000Z" }
              as: EyeBankCoordinator
          trigger:
            - call: "GET /eye-bank/donors/00000000-0000-0000-0000-0000000000d0"
              payload: {}
              as: EyeBankCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404"
            - "${err} == \"ERR_DONOR_NOT_FOUND\""
            - "response_type == \"error\" and data.message is a non-empty string"

      - name: donor_create_without_death_at_is_a_400_invalid_request
        claim_type: required_fields
        grounds:
          - "endpoints[POST /eye-bank/donors]"
          - entities.Donor.fields.death_at
          - "errors[ERR_INVALID_REQUEST]"
          - validations.priority_6
        distinguishing_aspect: |
          death_at has source: input and no default, so omitting it is rejected 400
          ERR_INVALID_REQUEST before any window arithmetic runs; no Donor row is persisted.
        test_recipe:
          setup:
            - "logical clock at 2026-08-03T06:00:00.000Z; no donor exists"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T06:00:00.000Z" }
              as: EyeBankCoordinator
          trigger:
            - call: "POST /eye-bank/donors"
              payload: { donor_code: "D-2846-C06", referral_source: "HOSPITAL", death_time_basis: "ASYSTOLE", age_years: 52, cause_of_death_category: "CARDIAC" }
              as: EyeBankCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400"
            - "${err} == \"ERR_INVALID_REQUEST\""
            - "GET /eye-bank/donors reports total_count == 0 afterwards"

      - name: donor_create_omitting_body_cooled_at_applies_the_null_default
        claim_type: defaults
        grounds:
          - entities.Donor.fields.body_cooled_at
          - calculations.donor_recovery_window
          - "endpoints[POST /eye-bank/donors]"
        distinguishing_aspect: |
          body_cooled_at is the only input field with a declared default (null): omitting it
          stores null and credits 0 cooling minutes, so the same ASYSTOLE age-52 donor gets
          window 720 and deadline 2026-08-03T14:00:00.000Z instead of 960 / 18:00.
        test_recipe:
          setup:
            - "logical clock at 2026-08-03T06:00:00.000Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T06:00:00.000Z" }
              as: EyeBankCoordinator
          trigger:
            - call: "POST /eye-bank/donors"
              payload: { donor_code: "D-2846-C07", referral_source: "FUNERAL_HOME", death_at: "2026-08-03T02:00:00.000Z", death_time_basis: "ASYSTOLE", age_years: 52, cause_of_death_category: "CARDIAC" }
              as: EyeBankCoordinator
              captures: { cooled: $.data.body_cooled_at, win: $.data.recovery_window_minutes, deadline: $.data.recovery_deadline_at }
          assert:
            - "${cooled} == null"
            - "${win} == 720"
            - "${deadline} == \"2026-08-03T14:00:00.000Z\""

      - name: screening_record_weight_applied_is_computed_from_the_answer
        claim_type: computed_fields
        grounds:
          - entities.ScreeningRecord.fields.weight_applied
          - calculations.donor_screening_risk_score
          - state_machines.Donor.REFERRED_to_SCREENING
          - "endpoints[POST /eye-bank/donors/{id}/screening-records]"
        distinguishing_aspect: |
          weight_applied is source: computed and cannot be supplied: a single IV_DRUG_USE YES
          answer stores weight_applied 40 and lifts the donor's screening_risk_score to 40 under
          the INTERVIEW_ONLY variant, while the donor moves REFERRED -> SCREENING.
        test_recipe:
          setup:
            - "logical clock at 2026-08-03T06:00:00.000Z"
            - "one donor in status REFERRED with screening_risk_score 0"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T06:00:00.000Z" }
              as: EyeBankCoordinator
            - call: "POST /eye-bank/donors"
              payload: { donor_code: "D-2846-C08", referral_source: "HOSPITAL", death_at: "2026-08-03T02:00:00.000Z", death_time_basis: "ASYSTOLE", age_years: 52, cause_of_death_category: "CARDIAC" }
              as: EyeBankCoordinator
              captures: { donor_id: $.data.id }
          trigger:
            - call: "POST /eye-bank/donors/${donor_id}/screening-records"
              payload: { question_code: "IV_DRUG_USE", response: "YES", historian_relationship: "SIBLING" }
              as: EyeBankCoordinator
              captures: { w: $.data.weight_applied, q: $.data.question_code }
            - call: "GET /eye-bank/donors/${donor_id}"
              payload: {}
              as: EyeBankCoordinator
              captures: { risk: $.data.screening_risk_score, variant: $.data.screening_risk_variant, st: $.data.status, v: $.data.version }
          assert:
            - "HTTP 201 on the screening record"
            - "${w} == 40 and ${q} == \"IV_DRUG_USE\""
            - "${risk} == 40 and ${variant} == \"INTERVIEW_ONLY\""
            - "${st} == \"SCREENING\""
            - "${v} == 2 (donor version bumped exactly once by the first screening record)"

      - name: donor_create_with_client_supplied_id_extra_field_is_ignored
        claim_type: system_fields
        grounds:
          - entities.Donor.fields.status
          - "endpoints[POST /eye-bank/donors]"
          - datetime_convention
        distinguishing_aspect: |
          id, created_at, version and status are server-minted: a body that also carries
          id 11111111-1111-1111-1111-111111111111, created_at 2020-01-01T00:00:00.000Z,
          version 99 and status APPROVED_FOR_RECOVERY still yields a fresh server id,
          created_at 2026-08-03T06:00:00.000Z, version 1 and status REFERRED.
        test_recipe:
          setup:
            - "logical clock at 2026-08-03T06:00:00.000Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T06:00:00.000Z" }
              as: EyeBankCoordinator
          trigger:
            - call: "POST /eye-bank/donors"
              payload: { donor_code: "D-2846-C09", referral_source: "HOSPITAL", death_at: "2026-08-03T02:00:00.000Z", death_time_basis: "ASYSTOLE", age_years: 52, cause_of_death_category: "CARDIAC", id: "11111111-1111-1111-1111-111111111111", created_at: "2020-01-01T00:00:00.000Z", version: 99, status: "APPROVED_FOR_RECOVERY" }
              as: EyeBankCoordinator
              captures: { new_id: $.data.id, created: $.data.created_at, v: $.data.version, st: $.data.status }
          assert:
            - "${new_id} != \"11111111-1111-1111-1111-111111111111\""
            - "${created} == \"2026-08-03T06:00:00.000Z\""
            - "${v} == 1"
            - "${st} == \"REFERRED\""

      - name: donor_create_with_age_years_above_the_declared_bound_is_a_400
        claim_type: type_constraints
        grounds:
          - entities.Donor.fields.age_years
          - "errors[ERR_INVALID_REQUEST]"
          - validations.priority_6
        distinguishing_aspect: |
          age_years declares bounds 0..110, so 130 is rejected 400 ERR_INVALID_REQUEST — a
          numeric-range violation, distinct from a missing-field violation and from an
          out-of-range enum.
        test_recipe:
          setup:
            - "logical clock at 2026-08-03T06:00:00.000Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T06:00:00.000Z" }
              as: EyeBankCoordinator
          trigger:
            - call: "POST /eye-bank/donors"
              payload: { donor_code: "D-2846-C10", referral_source: "HOSPITAL", death_at: "2026-08-03T02:00:00.000Z", death_time_basis: "ASYSTOLE", age_years: 130, cause_of_death_category: "CARDIAC" }
              as: EyeBankCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400"
            - "${err} == \"ERR_INVALID_REQUEST\""
            - "no Donor row is created"

      - name: screening_record_rows_are_append_only_with_no_version_field
        claim_type: immutability
        grounds:
          - entities.ScreeningRecord.common_fields
          - "endpoints[GET /eye-bank/donors/{id}/screening-records]"
          - "endpoints[POST /eye-bank/donors/{id}/screening-records]"
        distinguishing_aspect: |
          ScreeningRecord declares common_fields: false — §1.5 exposes only POST and GET for it,
          no update or delete route, and each listed row carries question_code, response,
          historian_relationship, recorded_by_user_id and weight_applied but no version field.
        test_recipe:
          setup:
            - "logical clock at 2026-08-03T06:00:00.000Z"
            - "one donor with two screening answers: TATTOO_12M NO and SEPSIS YES"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T06:00:00.000Z" }
              as: EyeBankCoordinator
            - call: "POST /eye-bank/donors"
              payload: { donor_code: "D-2846-C11", referral_source: "HOSPITAL", death_at: "2026-08-03T02:00:00.000Z", death_time_basis: "ASYSTOLE", age_years: 52, cause_of_death_category: "CARDIAC" }
              as: EyeBankCoordinator
              captures: { donor_id: $.data.id }
            - call: "POST /eye-bank/donors/${donor_id}/screening-records"
              payload: { question_code: "TATTOO_12M", response: "NO", historian_relationship: "SPOUSE" }
              as: EyeBankCoordinator
            - call: "POST /eye-bank/donors/${donor_id}/screening-records"
              payload: { question_code: "SEPSIS", response: "YES", historian_relationship: "MEDICAL_RECORD" }
              as: EyeBankCoordinator
          trigger:
            - call: "GET /eye-bank/donors/${donor_id}/screening-records"
              payload: {}
              as: MedicalDirector
              captures: { r0_q: "$.data[0].question_code", r0_w: "$.data[0].weight_applied", r1_q: "$.data[1].question_code", r1_w: "$.data[1].weight_applied" }
          assert:
            - "the list carries exactly 2 rows"
            - "{${r0_q}, ${r1_q}} == {\"TATTOO_12M\", \"SEPSIS\"}"
            - "the SEPSIS row has weight_applied == 25 and the TATTOO_12M row has weight_applied == 0"
            - "no row exposes a `version` field and §1.5 declares no PUT/PATCH/DELETE route for ScreeningRecord"
            - "Donor.screening_risk_score == 25 (only the YES row scores)"

      - name: screening_record_under_an_unknown_donor_yields_err_donor_not_found
        claim_type: parent_relationships
        grounds:
          - entities.ScreeningRecord.parent
          - "errors[ERR_DONOR_NOT_FOUND]"
          - validations.priority_4
        distinguishing_aspect: |
          ScreeningRecord's parent is taken from the path: posting an answer under a UUID that
          matches no Donor returns 404 ERR_DONOR_NOT_FOUND and creates no orphan row.
        test_recipe:
          setup:
            - "logical clock at 2026-08-03T06:00:00.000Z; no donor exists"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T06:00:00.000Z" }
              as: EyeBankCoordinator
          trigger:
            - call: "POST /eye-bank/donors/00000000-0000-0000-0000-0000000000d1/screening-records"
              payload: { question_code: "HIV_RISK", response: "NO", historian_relationship: "CHILD" }
              as: EyeBankCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404"
            - "${err} == \"ERR_DONOR_NOT_FOUND\""

      - name: recovery_dispatch_with_an_unregistered_technician_yields_err_technician_not_found
        claim_type: parent_relationships
        grounds:
          - entities.Recovery.fields.technician_id
          - "errors[ERR_TECHNICIAN_NOT_FOUND]"
          - validations.priority_5
          - complexity_profile.entity_topology
        distinguishing_aspect: |
          Recovery is a graph node joined to Donor and Technician by explicit body FKs: a body
          technician_id that resolves to no Technician row returns 404 ERR_TECHNICIAN_NOT_FOUND
          at priority 5 — before the priority-11 donor-state check the REFERRED donor would also
          fail — proving body-FK integrity is checked ahead of business state.
        test_recipe:
          setup:
            - "logical clock at 2026-08-03T06:00:00.000Z"
            - "one donor still in status REFERRED; no technician exists"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T06:00:00.000Z" }
              as: EyeBankCoordinator
            - call: "POST /eye-bank/donors"
              payload: { donor_code: "D-2846-C12", referral_source: "HOSPITAL", death_at: "2026-08-03T02:00:00.000Z", death_time_basis: "ASYSTOLE", age_years: 52, cause_of_death_category: "CARDIAC" }
              as: EyeBankCoordinator
              captures: { donor_id: $.data.id }
          trigger:
            - call: "POST /eye-bank/recoveries"
              payload: { donor_id: "${donor_id}", technician_id: "00000000-0000-0000-0000-00000000000c", dispatched_at: "2026-08-03T06:30:00.000Z", planned_release_at: "2026-08-03T10:00:00.000Z" }
              as: EyeBankCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404"
            - "${err} == \"ERR_TECHNICIAN_NOT_FOUND\""
            - "no Recovery row is created and the donor stays in status REFERRED"

  - section: state_machines
    instances:

      - name: donor_initial_state_is_referred_on_creation
        claim_type: initial_state
        grounds:
          - state_machines.Donor.initial_state
          - entities.Donor.fields.status
        distinguishing_aspect: |
          A freshly created Donor sits in the declared initial_state REFERRED with version 1 —
          no transition has run, so consent_obtained_at and deferral_reason are still null.
        test_recipe:
          setup:
            - "logical clock at 2026-08-03T06:00:00.000Z; empty database"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T06:00:00.000Z" }
              as: EyeBankCoordinator
            - call: "POST /eye-bank/donors"
