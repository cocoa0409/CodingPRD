        distinguishing_aspect: |
          Surgeon resource, buffered-closed interval semantics (60-min turnaround): a same-surgeon booking
          starting exactly at the prior booking's end (03:00 after 00:00-03:00) DOES conflict because the
          60-minute buffer overlaps, yielding ERR_SURGEON_BUFFER_CONFLICT -- opposite adjacency behavior to
          the OR half-open rule, and on a different contended resource (surgeon vs OR room).
