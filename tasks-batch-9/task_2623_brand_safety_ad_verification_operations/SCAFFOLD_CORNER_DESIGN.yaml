              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { e_deref: $.data.error_id }
            - call: "POST /refund-claims"
              payload: { campaign_id: "${camp_main}", publisher_id: "${pub_id}", batch_ids: ["${batch_old}", "${batch_foreign}"], expected_campaign_version: "${camp_ver}" }
              as: Advertiser
