scenario: |
  Generate task harder than expert level!

  2675. Consumer Product Safety Reporting & Recall (consumer products safety compliance office):
  incident and complaint intake with injury classification and hazard pattern analysis,
  reportability evaluation under defect and unreasonable risk standards with internal escalation
  deadlines, report preparation and submission with corrective action proposals, recall plan
  development covering notification, remedy options and consumer participation goals, retailer and
  distributor notification with stop-sale and shelf removal verification, consumer notification
  channels including direct notice, press release and registration card data, monthly progress
  reporting on units corrected with effectiveness assessment, civil penalty negotiation and
  consent agreement obligations

domain_name: "consumer-product-safety-reporting-recall"
api_prefix: "/product-safety"

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: flat
  # Every entity is a peer collection directly under /product-safety. Ownership is
  # expressed exclusively through FK fields in request bodies (no nested URL paths
  # beyond action sub-segments), so the reporting chain
  # ProductModel -> Incident -> HazardPattern -> ReportabilityEvaluation ->
  # SectionReport -> Recall -> {RetailerNotification, ConsumerNotice, RemedyClaim,
  # ProgressReport} and SectionReport -> CivilPenaltyCase are all resolved by FK,
  # never by path nesting.

  state_machine_shape: parallel
  # Recall carries two independent state dimensions on the same row —
  # `plan_status` (DRAFT -> SUBMITTED -> APPROVED -> MONITORING -> CLOSED) and
  # `notification_status` (NOT_STARTED -> IN_PROGRESS <-> DEFICIENT -> SATISFIED).
  # CivilPenaltyCase adds a negotiation cycle (ASSESSMENT_OPEN -> OFFER_MADE ->
  # COUNTERED -> OFFER_MADE), HazardPattern a recompute self-loop plus a
  # fork on adjudication, and ReportabilityEvaluation a fork with divergent
  # side-effect sets per branch.

  relationship_patterns:
    - one_to_many          # ProductModel -> Incident, Recall -> RetailerNotification, etc.
    - self_referential     # Incident.duplicate_of_incident_id -> Incident.id
    - cross_aggregate      # RemedyClaim fulfilment mutates Recall counters which mutate CivilPenaltyCase
    - polymorphic: false   # not used

  role_model: segregation_of_duties
  # The staff member who prepares a recall plan or a progress report is barred from
  # approving/accepting it: SafetyDirector shares `submit-plan` and
  # `POST /progress-reports` with ComplianceOfficer, so the acting X-User-ID is
  # compared against the stored preparer id at approval/acceptance time.

  consistency_model: immediate

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: ProductModel
    parent: null
    common_fields: true
    fields:
      - name: model_code
        type: string
        source: input
        description: "Manufacturer model identifier."
        constraints: "1..40 chars; unique across all ProductModel rows (ERR_MODEL_CODE_TAKEN)"
      - name: brand
        type: string
        source: input
        description: "Brand name printed on the product."
        constraints: "1..80 chars"
      - name: category
        type: enum
        source: input
        description: "Product family used by the compliance office for docket routing."
        constraints: "one of KITCHEN_APPLIANCE, JUVENILE_PRODUCT, POWER_TOOL, SPORTING_GOODS, HOME_ELECTRONICS"
      - name: units_distributed
        type: integer
        source: input
        description: "Units placed into commerce; denominator of the hazard-exposure term."
        constraints: ">= 1"
      - name: units_registered
        type: integer
        source: input
        description: "Consumers reachable through registration-card data; denominator of the PARTICIPATION_BASIS effectiveness variant."
        constraints: ">= 0"
      - name: hazard_posture
        type: enum
        source: computed
        default: MONITORED
        description: "Gate on hazard-pattern dismissal. Assigned ONLY by the six transitions listed in §1.2 (evaluation determine REPORTABLE/NOT_REPORTABLE, section-report submit, section-report review ACCEPTED/RETURNED_FOR_INFO, and creation); it is never re-derived by query."
        constraints: "one of MONITORED, RESTRICTED, FROZEN"
      - name: open_escalation_count
        type: integer
        source: computed
        default: 0
        description: "Monotonic counter incremented by the number of Incident rows flipped CLUSTERED->ESCALATED by a REPORTABLE determination."
        constraints: ">= 0"

  - name: Incident
    parent: null
    common_fields: true
    fields:
      - name: product_model_id
        type: string
        source: input
        description: "FK -> ProductModel.id; the model the complaint or injury report concerns."
      - name: hazard_pattern_id
        type: string
        source: computed
        default: null
        description: "FK -> HazardPattern.id; set when POST /product-safety/hazard-patterns clusters this incident (status CLASSIFIED -> CLUSTERED), cleared when the pattern is adjudicated DISMISSED."
      - name: duplicate_of_incident_id
        type: string
        source: computed
        default: null
        description: "FK -> Incident.id; self-referential dedup pointer set by POST /product-safety/incidents/{id}/dispose with disposition MERGED_DUPLICATE. Rows with a non-null value are excluded from every hazard-pattern input set."
      - name: report_channel
        type: enum
        source: input
        description: "Intake channel; drives the credibility multiplier of calculations.incident_severity_weight."
        constraints: "one of CONSUMER_HOTLINE, WEB_FORM, RETAILER, MEDICAL_EXAMINER"
      - name: incident_date
        type: datetime
        source: input
        description: "ISO 8601 UTC instant the harm or malfunction occurred; compared against HazardPattern.window_start/window_end (both endpoints inclusive)."
      - name: narrative
        type: string
        source: input
        description: "Free-text complaint description."
        constraints: "1..2000 chars"
      - name: injury_class
        type: enum
        source: computed
        default: null
        description: "Injury severity assigned by POST /product-safety/incidents/{id}/classify. Ordered NO_INJURY < FIRST_AID < MEDICAL_TREATMENT < HOSPITALIZATION < FATALITY for the civil-penalty severity multiplier."
        constraints: "one of NO_INJURY, FIRST_AID, MEDICAL_TREATMENT, HOSPITALIZATION, FATALITY"
      - name: hazard_code
        type: enum
        source: computed
        default: null
        description: "Hazard taxonomy code assigned by classify; the modal value across an input set becomes HazardPattern.dominant_hazard_code."
        constraints: "one of LACERATION, BURN, CHOKING, ELECTRIC_SHOCK, FALL, ENTRAPMENT"
      - name: injury_verified
        type: boolean
        source: computed
        default: false
        description: "True when the injury claim was corroborated by medical or retailer records; decides membership in the PRELIMINARY variant and the 0.50 discount in the FINAL variant."
      - name: severity_weight
        type: number
        source: computed
        default: 0
        description: "Output of calculations.incident_severity_weight; 2 decimal places."
        constraints: ">= 0"
      - name: status
        type: enum
        source: computed
        default: INTAKE
        description: "Intake lifecycle; see §1.2 Incident."
        constraints: "one of INTAKE, CLASSIFIED, CLUSTERED, ESCALATED, MERGED_DUPLICATE, CLOSED_NO_ACTION"
      - name: classified_at
        type: datetime
        source: computed
        default: null
        description: "Logical-clock instant of the most recent classify call."
      - name: escalation_deadline_at
        type: datetime
        source: computed
        default: null
        description: "Set to determined_at + 120h when a REPORTABLE determination escalates this incident."

  - name: HazardPattern
    parent: null
    common_fields: true
    fields:
      - name: product_model_id
        type: string
        source: input
        description: "FK -> ProductModel.id; the model whose incidents are being clustered."
      - name: window_start
        type: datetime
        source: input
        description: "Inclusive lower bound on Incident.incident_date for the input set."
      - name: window_end
        type: datetime
        source: input
        description: "Inclusive upper bound on Incident.incident_date for the input set."
        constraints: "must be strictly greater than window_start (ERR_INVALID_REQUEST)"
      - name: analysis_basis
        type: enum
        source: input
        description: "Selects the variant of calculations.hazard_pattern_risk_index."
        constraints: "one of PRELIMINARY, FINAL"
      - name: pattern_status
        type: enum
        source: computed
        default: ANALYZED
        description: "Analysis lifecycle; see §1.2 HazardPattern."
        constraints: "one of ANALYZED, CONFIRMED, DISMISSED, SUPERSEDED"
      - name: incident_count
        type: integer
        source: computed
        default: 0
        description: "Cardinality of the qualifying input set defined in calculations.hazard_pattern_risk_index.input_set."
      - name: severity_sum
        type: number
        source: computed
        default: 0
        description: "Sum of the (variant-adjusted) severity_weight values of the qualifying input set, rounded to 2 decimal places round_half_up."
      - name: dominant_hazard_code
        type: enum
        source: computed
        default: null
        description: "Modal Incident.hazard_code across the qualifying input set; ties broken by the earliest created_at among the tied codes' first-created incident. Null when incident_count == 0."
        constraints: "one of LACERATION, BURN, CHOKING, ELECTRIC_SHOCK, FALL, ENTRAPMENT"
      - name: concentration_ratio
        type: number
        source: computed
        default: 0
        description: "count(dominant_hazard_code) / incident_count, rounded to 4 decimal places round_half_up; exactly 0 when incident_count == 0."
      - name: exposure_per_10k
        type: number
        source: computed
        default: 0
        description: "max(1, ProductModel.units_distributed / 10000) rounded to 4 decimal places round_half_up."
      - name: risk_index
        type: number
        source: computed
        default: 0
        description: "Output of calculations.hazard_pattern_risk_index; 2 decimal places, 0.00 .. 100.00."
      - name: pattern_confirmed
        type: boolean
        source: computed
        default: false
        description: "True when incident_count >= 3 AND concentration_ratio >= 0.6000 AND risk_index >= 10.00; gates adjudication to CONFIRMED."
      - name: analyzed_at
        type: datetime
        source: computed
        default: null
        description: "Logical-clock instant of the most recent create/recompute run."

  - name: ReportabilityEvaluation
    parent: null
    common_fields: true
    fields:
      - name: hazard_pattern_id
        type: string
        source: input
        description: "FK -> HazardPattern.id; must be a pattern whose pattern_status == CONFIRMED."
      - name: product_model_id
        type: string
        source: computed
        description: "FK -> ProductModel.id; copied verbatim from HazardPattern.product_model_id at creation."
      - name: standard_basis
        type: enum
        source: input
        description: "Legal standard the office is evaluating the product against."
        constraints: "one of DEFECT, UNREASONABLE_RISK, NONCOMPLIANCE, VOLUNTARY_STANDARD_FAILURE"
      - name: status
        type: enum
        source: computed
        default: OPEN
        description: "Evaluation lifecycle; see §1.2 ReportabilityEvaluation."
        constraints: "one of OPEN, IN_REVIEW, REPORTABLE, NOT_REPORTABLE"
      - name: opened_at
        type: datetime
        source: computed
        description: "Logical-clock instant of creation; baseline for internal_escalation_due_at."
      - name: internal_escalation_due_at
        type: datetime
        source: computed
        description: "opened_at + calculations.evaluation_escalation_window output (48h when HazardPattern.risk_index >= 25.00, else 120h)."
      - name: escalation_breached
        type: boolean
        source: computed
        default: false
        description: "Set true by begin-review when the logical clock is strictly greater than internal_escalation_due_at at review start."
      - name: review_started_at
        type: datetime
        source: computed
        default: null
        description: "Logical-clock instant of the OPEN -> IN_REVIEW transition."
      - name: determined_at
        type: datetime
        source: computed
        default: null
        description: "Logical-clock instant of the determine call."
      - name: report_due_at
        type: datetime
        source: computed
        default: null
        description: "determined_at + 240h; set only on a REPORTABLE determination. Baseline for calculations.section_report_lateness."
      - name: defect_score
        type: integer
        source: computed
        default: null
        description: "Analyst score for the defect standard, recorded by determine."
        constraints: "0 .. 10"
      - name: risk_score
        type: integer
        source: computed
        default: null
        description: "Analyst score for the unreasonable-risk standard, recorded by determine."
        constraints: "0 .. 10"
      - name: determination_note
        type: string
        source: computed
        default: null
        description: "Rationale text recorded by determine."

  - name: SectionReport
    parent: null
    common_fields: true
    fields:
      - name: reportability_evaluation_id
        type: string
        source: input
        description: "FK -> ReportabilityEvaluation.id; must be an evaluation whose status == REPORTABLE."
      - name: corrective_action_type
        type: enum
        source: input
        description: "Corrective action proposed to the regulator in the report."
        constraints: "one of REPAIR, REPLACE, REFUND, RETROFIT_KIT"
      - name: corrective_action_summary
        type: string
        source: input
        description: "Narrative of the proposed corrective action."
        constraints: "1..2000 chars"
      - name: status
        type: enum
        source: computed
        default: DRAFT
        description: "Report lifecycle; see §1.2 SectionReport."
        constraints: "one of DRAFT, SUBMITTED, ACCEPTED, RETURNED_FOR_INFO"
      - name: submitted_at
        type: datetime
        source: computed
        default: null
        description: "Logical-clock instant of the most recent DRAFT -> SUBMITTED transition."
      - name: days_late
        type: integer
        source: computed
        default: 0
        description: "Output of calculations.section_report_lateness; recomputed on every DRAFT -> SUBMITTED transition."
        constraints: ">= 0"
      - name: late_surcharge_cents
        type: integer
        source: computed
        default: 0
        description: "Output of calculations.section_report_lateness; recomputed on every DRAFT -> SUBMITTED transition."
        constraints: "0 .. 5000000"
      - name: reviewed_at
        type: datetime
        source: computed
        default: null
        description: "Logical-clock instant of the most recent review call."

  - name: Recall
    parent: null
    common_fields: true
    fields:
      - name: section_report_id
        type: string
        source: input
        description: "FK -> SectionReport.id; must be a report whose status == ACCEPTED. At most one Recall per SectionReport."
      - name: remedy_options
        type: array
        source: input
        description: "Remedy menu offered to consumers; a RemedyClaim.remedy_type must be a member."
        constraints: "non-empty array of distinct members of {REPAIR, REPLACE, REFUND, RETROFIT_KIT}"
      - name: units_in_commerce
        type: integer
        source: input
        description: "Units the recall must account for; the conserved total of calculations.recall_units_conservation."
        constraints: ">= 1"
      - name: participation_goal_pct
        type: number
        source: input
        description: "Consumer participation goal in percent; threshold for effectiveness_flag and ProgressReport.assessment."
        constraints: "> 0 and <= 100; 2 decimal places"
      - name: correction_deadline_at
        type: datetime
        source: input
        description: "Contractual date by which units_corrected must reach the participation goal."
      - name: plan_status
        type: enum
        source: computed
        default: DRAFT
        description: "First independent state dimension (plan lifecycle); see §1.2 Recall.plan_status."
        constraints: "one of DRAFT, SUBMITTED, APPROVED, MONITORING, CLOSED"
      - name: notification_status
        type: enum
        source: computed
        default: NOT_STARTED
        description: "Second independent state dimension (retailer notification lifecycle); see §1.2 Recall.notification_status. Evolves independently of plan_status on the same row."
        constraints: "one of NOT_STARTED, IN_PROGRESS, DEFICIENT, SATISFIED"
      - name: units_corrected
        type: integer
        source: computed
        default: 0
        description: "Persisted counter; incremented by RemedyClaim.quantity on fulfil and decremented by the same quantity on void of a FULFILLED claim."
        constraints: ">= 0"
      - name: units_outstanding
        type: integer
        source: computed
        description: "Persisted counter initialised to units_in_commerce and moved in lockstep with units_corrected. Invariant: units_corrected + units_outstanding == units_in_commerce."
        constraints: ">= 0"
      - name: effectiveness_flag
        type: enum
        source: computed
        default: PENDING
        description: "PENDING until the UNITS_BASIS rate reaches participation_goal_pct (then MET); set to SHORTFALL when an accepted ProgressReport carries assessment == CRITICAL."
        constraints: "one of PENDING, MET, SHORTFALL"
      - name: stop_sale_effective_at
        type: datetime
        source: computed
        default: null
        description: "Logical-clock instant of the SUBMITTED -> APPROVED transition; anchors the first ProgressReport period_start."
      - name: submitted_by_user_id
        type: string
        source: computed
        default: null
        description: "X-User-ID captured on submit-plan; compared against the approver's X-User-ID by the segregation-of-duties check."
      - name: last_accepted_period_end
        type: datetime
        source: computed
        default: null
        description: "period_end of the most recently ACCEPTED ProgressReport for this recall."

  - name: Retailer
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Retailer or distributor legal name."
        constraints: "1..120 chars"
      - name: channel_type
        type: enum
        source: input
        description: "Distribution channel class."
        constraints: "one of BIG_BOX, ONLINE_MARKETPLACE, SPECIALTY, DISTRIBUTOR"
      - name: store_count
        type: integer
        source: input
        description: "Number of physical or virtual storefronts subject to shelf removal."
        constraints: ">= 1"
      - name: compliance_posture
        type: enum
        source: computed
        default: CLEAR
        description: "Gate on audit-visit scheduling. STOP_SALE_ACTIVE while open_stop_sale_count >= 1 with no delinquency; DELINQUENT once a compliance sweep flags any of this retailer's notifications; CLEAR once open_stop_sale_count returns to 0."
        constraints: "one of CLEAR, STOP_SALE_ACTIVE, DELINQUENT"
      - name: open_stop_sale_count
        type: integer
        source: computed
        default: 0
        description: "Persisted counter; +1 per RetailerNotification flipped PENDING->ISSUED, -1 per notification flipped ACKNOWLEDGED->VERIFIED."
        constraints: ">= 0"
      - name: verified_removal_count
        type: integer
        source: computed
        default: 0
        description: "Monotonic counter of ACKNOWLEDGED->VERIFIED transitions on this retailer's notifications."
        constraints: ">= 0"
      - name: delinquent_count
        type: integer
        source: computed
        default: 0
        description: "Monotonic counter of ISSUED->DELINQUENT transitions produced by compliance sweeps."
        constraints: ">= 0"

  - name: RetailerNotification
    parent: null
    common_fields: true
    fields:
      - name: recall_id
        type: string
        source: input
        description: "FK -> Recall.id; the recall whose stop-sale instruction is being served."
      - name: retailer_id
        type: string
        source: input
        description: "FK -> Retailer.id; at most one notification per (recall_id, retailer_id) pair."
      - name: status
        type: enum
        source: computed
        default: PENDING
        description: "Notification lifecycle; see §1.2 RetailerNotification."
        constraints: "one of PENDING, ISSUED, ACKNOWLEDGED, VERIFIED, DELINQUENT"
      - name: stop_sale_required
        type: boolean
        source: computed
        default: false
        description: "Set true when the recall plan approval cascade flips this notification PENDING -> ISSUED."
      - name: issued_at
        type: datetime
        source: computed
        default: null
        description: "Logical-clock instant of the PENDING -> ISSUED cascade."
      - name: ack_due_at
        type: datetime
        source: computed
        default: null
        description: "issued_at + 72h; a compliance sweep flags the notification DELINQUENT only when the clock is strictly greater than this instant."
      - name: acknowledged_at
        type: datetime
        source: computed
        default: null
        description: "Logical-clock instant of the acknowledge call."
      - name: verified_at
        type: datetime
        source: computed
        default: null
        description: "Logical-clock instant of the ACKNOWLEDGED -> VERIFIED transition."
      - name: units_on_shelf_reported
        type: integer
        source: computed
        default: null
        description: "Units the retailer self-reported as still on shelves at acknowledgement."
        constraints: ">= 0"

  - name: AuditVisit
    parent: null
    common_fields: true
    fields:
      - name: retailer_notification_id
        type: string
        source: input
        description: "FK -> RetailerNotification.id; the stop-sale instruction this shelf-removal audit verifies. The retailer under audit is RetailerNotification.retailer_id."
      - name: window_start
        type: datetime
        source: input
        description: "Inclusive start of the on-site audit window."
      - name: window_end
        type: datetime
        source: input
        description: "Exclusive end of the on-site audit window (half-open [window_start, window_end))."
        constraints: "must be strictly greater than window_start (ERR_INVALID_REQUEST)"
      - name: status
        type: enum
        source: computed
        default: SCHEDULED
        description: "Visit lifecycle; see §1.2 AuditVisit."
        constraints: "one of SCHEDULED, COMPLETED"
      - name: verdict
        type: enum
        source: computed
        default: PENDING
        description: "Shelf-removal verdict recorded at completion."
        constraints: "one of PENDING, PASS, FAIL"
      - name: shelf_units_found
        type: integer
        source: computed
        default: null
        description: "Units of the recalled model still on shelves at the visit; a PASS verdict requires exactly 0."
        constraints: ">= 0"
      - name: completed_at
        type: datetime
        source: computed
        default: null
        description: "Logical-clock instant of the SCHEDULED -> COMPLETED transition."

  - name: ConsumerNotice
    parent: null
    common_fields: true
    fields:
      - name: recall_id
        type: string
        source: input
        description: "FK -> Recall.id; the recall this consumer-facing notice belongs to."
      - name: channel
        type: enum
        source: input
        description: "Consumer notification channel. REGISTRATION_CARD notices are bounded by ProductModel.units_registered."
        constraints: "one of DIRECT_NOTICE, PRESS_RELEASE, REGISTRATION_CARD, WEB_POSTING"
      - name: scheduled_for
        type: datetime
        source: input
        description: "Earliest logical-clock instant at which the notice may be released."
      - name: embargo_until
        type: datetime
        source: input
        default: null
        description: "Optional press embargo instant; when present, release also requires clock >= embargo_until."
      - name: reach_count
        type: integer
        source: input
        description: "Consumers the notice is expected to reach."
        constraints: ">= 0"
      - name: status
        type: enum
        source: computed
        default: SCHEDULED
        description: "Notice lifecycle; see §1.2 ConsumerNotice."
        constraints: "one of SCHEDULED, RELEASED, SUPERSEDED"
      - name: released_at
        type: datetime
        source: computed
        default: null
        description: "Logical-clock instant of the SCHEDULED -> RELEASED transition."

  - name: RemedyClaim
    parent: null
    common_fields: true
    fields:
      - name: recall_id
        type: string
        source: input
        description: "FK -> Recall.id; the recall the consumer is claiming a remedy under."
      - name: consumer_ref
        type: string
        source: input
        description: "Opaque consumer reference supplied by intake."
        constraints: "1..64 chars"
      - name: remedy_type
        type: enum
        source: input
        description: "Remedy selected by the consumer; must be a member of Recall.remedy_options."
        constraints: "one of REPAIR, REPLACE, REFUND, RETROFIT_KIT"
      - name: quantity
        type: integer
        source: input
        description: "Units the consumer is submitting for correction."
        constraints: ">= 1"
      - name: unit_price_cents
        type: integer
        source: input
        description: "Documented retail price per unit; the reimbursement base for REFUND and REPLACE."
        constraints: ">= 0"
      - name: shipping_cents_per_unit
        type: integer
        source: input
        description: "Return-shipping cost per unit reimbursed to the consumer."
        constraints: ">= 0"
      - name: reimbursement_total_cents
        type: integer
        source: computed
        default: 0
        description: "Output of calculations.remedy_reimbursement_total, computed at creation."
        constraints: ">= 0"
      - name: status
        type: enum
        source: computed
        default: SUBMITTED
        description: "Claim lifecycle; see §1.2 RemedyClaim."
        constraints: "one of SUBMITTED, APPROVED, FULFILLED, VOID"
      - name: fulfilled_at
        type: datetime
        source: computed
        default: null
        description: "Logical-clock instant of the APPROVED -> FULFILLED transition; the timestamp ProgressReport periods filter on."
      - name: voided_at
        type: datetime
        source: computed
        default: null
        description: "Logical-clock instant of the transition into VOID."

  - name: ProgressReport
    parent: null
    common_fields: true
    fields:
      - name: recall_id
        type: string
        source: input
        description: "FK -> Recall.id; the recall this monthly progress report covers."
      - name: period_start
        type: datetime
        source: input
        description: "Inclusive start of the reporting period (closed interval [period_start, period_end])."
      - name: period_end
        type: datetime
        source: input
        description: "Inclusive end of the reporting period."
        constraints: "must be strictly greater than period_start (ERR_INVALID_REQUEST)"
      - name: effectiveness_basis
        type: enum
        source: input
        description: "Selects the variant of calculations.recall_effectiveness_rate."
        constraints: "one of UNITS_BASIS, PARTICIPATION_BASIS"
      - name: status
        type: enum
        source: computed
        default: DRAFT
        description: "Report lifecycle; see §1.2 ProgressReport."
        constraints: "one of DRAFT, SUBMITTED, ACCEPTED"
      - name: units_corrected_in_period
        type: integer
        source: computed
        default: 0
        description: "Sum of RemedyClaim.quantity over claims with recall_id == this recall, status == FULFILLED, and fulfilled_at within [period_start, period_end] (both endpoints inclusive). Computed at submit."
        constraints: ">= 0"
      - name: cumulative_units_corrected
        type: integer
        source: computed
        default: 0
        description: "Snapshot of Recall.units_corrected at the moment of submit."
        constraints: ">= 0"
      - name: effectiveness_rate
        type: number
        source: computed
        default: 0
        description: "Output of calculations.recall_effectiveness_rate in percent, 2 decimal places; computed at submit under effectiveness_basis."
      - name: assessment
        type: enum
        source: computed
        default: PENDING
        description: "Effectiveness assessment derived from effectiveness_rate at submit."
        constraints: "one of PENDING, ON_TRACK, BELOW_TARGET, CRITICAL"
      - name: prepared_by_user_id
        type: string
        source: computed
        description: "X-User-ID captured at creation; compared against the accepter's X-User-ID by the segregation-of-duties check."
      - name: submitted_at
        type: datetime
        source: computed
        default: null
        description: "Logical-clock instant of the DRAFT -> SUBMITTED transition."
      - name: accepted_at
        type: datetime
        source: computed
        default: null
        description: "Logical-clock instant of the SUBMITTED -> ACCEPTED transition."

  - name: CivilPenaltyCase
    parent: null
    common_fields: true
    fields:
      - name: section_report_id
        type: string
        source: input
        description: "FK -> SectionReport.id; the filing whose lateness and hazard severity drive the assessment. At most one case per SectionReport."
      - name: violation_count
        type: integer
        source: input
        description: "Number of chargeable violations alleged by the office."
        constraints: ">= 1"
      - name: status
        type: enum
        source: computed
        default: ASSESSMENT_OPEN
        description: "Negotiation lifecycle; see §1.2 CivilPenaltyCase (cyclic)."
        constraints: "one of ASSESSMENT_OPEN, OFFER_MADE, COUNTERED, AGREED"
      - name: assessed_penalty_cents
        type: integer
        source: computed
        description: "Output of calculations.civil_penalty_assessment, computed once at creation and never recomputed."
        constraints: "0 .. 17150000"
      - name: reserved_cents
        type: integer
        source: computed
        default: 0
        description: "Persisted portion of assessed_penalty_cents committed to the standing offer or to the executed consent agreement."
        constraints: ">= 0"
      - name: available_cents
        type: integer
        source: computed
        description: "Persisted uncommitted portion, initialised to assessed_penalty_cents. Invariant: reserved_cents + available_cents == assessed_penalty_cents."
        constraints: ">= 0"
      - name: current_offer_round
        type: integer
        source: computed
        default: 0
        description: "Monotonic negotiation round counter; incremented by every offer and never decremented, capped at 6."
        constraints: "0 .. 6"
      - name: current_offer_cents
        type: integer
        source: computed
        default: null
        description: "Amount of the standing offer; null while status is ASSESSMENT_OPEN."
        constraints: ">= 0"
      - name: current_offer_by
        type: enum
        source: computed
        default: null
        description: "Party that tabled the standing offer."
        constraints: "one of AGENCY, RESPONDENT"
      - name: cooperation_bonus_applied
        type: boolean
        source: computed
        default: false
        description: "Set true by the RemedyClaim fulfilment cascade when the linked Recall.effectiveness_flag becomes MET; adds 0.05 to the cooperation credit percentage."
      - name: cooperation_credit_tier
        type: enum
        source: computed
        default: null
        description: "Tier selected by calculations.consent_agreement_total at acceptance."
        constraints: "one of TIER_1, TIER_2, TIER_3"
      - name: cooperation_credit_cents
        type: integer
        source: computed
        default: null
        description: "Credit subtracted from the accepted offer amount by calculations.consent_agreement_total."
        constraints: ">= 0"
      - name: consent_agreement_total_cents
        type: integer
        source: computed
        default: null
        description: "Executed consent-agreement obligation; set only on the AGREED transition."
        constraints: ">= 0"
      - name: consent_agreement_preview_cents
        type: integer
        source: computed
        description: "Non-binding preview keyed on assessed_penalty_cents (NOT on any offer): assessed_penalty_cents - round_half_up(assessed_penalty_cents * credit_pct(tier_of(assessed_penalty_cents))). Recomputed whenever cooperation_bonus_applied changes."
        constraints: ">= 0"
      - name: compliance_program_required
        type: boolean
        source: computed
        default: false
        description: "Set on the AGREED transition when consent_agreement_total_cents >= 5000000."
      - name: reporting_obligation_months
        type: integer
        source: computed
        default: 0
        description: "Set on the AGREED transition: 24 when compliance_program_required is true, else 12."
        constraints: "0, 12 or 24"

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  - entity: Incident
    state_field: status
    initial_state: INTAKE
    terminal_states: [MERGED_DUPLICATE, CLOSED_NO_ACTION]
    transitions:
      - from: INTAKE
        to: CLASSIFIED
        trigger: "POST /product-safety/incidents/{id}/classify"
        actor: IntakeSpecialist
        preconditions:
          - "Incident.status == INTAKE"
          - "injury_class is a member of {NO_INJURY, FIRST_AID, MEDICAL_TREATMENT, HOSPITALIZATION, FATALITY}"
          - "hazard_code is a member of {LACERATION, BURN, CHOKING, ELECTRIC_SHOCK, FALL, ENTRAPMENT}"
        side_effects:
          - "sets Incident.injury_class, Incident.hazard_code and Incident.injury_verified from the request body"
          - "recomputes Incident.severity_weight via calculations.incident_severity_weight"
          - "stamps Incident.classified_at with the logical clock"
          - "increments Incident.version by 1"
      - from: CLASSIFIED
        to: CLASSIFIED
        trigger: "POST /product-safety/incidents/{id}/classify (reclassification self-loop)"
        actor: IntakeSpecialist
        preconditions:
          - "Incident.status == CLASSIFIED"
          - "Incident.hazard_pattern_id IS NULL (a clustered incident cannot be reclassified: ERR_INCIDENT_STATE_INVALID)"
        side_effects:
          - "overwrites Incident.injury_class, Incident.hazard_code and Incident.injury_verified"
          - "recomputes Incident.severity_weight via calculations.incident_severity_weight"
          - "re-stamps Incident.classified_at with the logical clock"
          - "increments Incident.version by 1"
        note: "Self-loop; the reclassified weight is picked up by the next hazard-pattern recompute, not retroactively."
      - from: CLASSIFIED
        to: CLUSTERED
        trigger: "system: POST /product-safety/hazard-patterns or POST /product-safety/hazard-patterns/{id}/recompute clusters the qualifying input set"
        actor: system
        preconditions:
          - "Incident is a member of calculations.hazard_pattern_risk_index.input_set for the pattern being analysed"
        side_effects:
          - "sets Incident.hazard_pattern_id to the analysing HazardPattern.id"
          - "increments Incident.version by 1"
      - from: CLUSTERED
        to: CLUSTERED
        trigger: "system: a newer HazardPattern for the same ProductModel re-points the incident"
        actor: system
        preconditions:
          - "Incident is a member of the newer pattern's qualifying input set"
        side_effects:
          - "overwrites Incident.hazard_pattern_id with the newer HazardPattern.id"
          - "increments Incident.version by 1"
        note: "The previous pattern is flipped to SUPERSEDED by the same cascade."
      - from: CLUSTERED
        to: CLASSIFIED
        trigger: "system: POST /product-safety/hazard-patterns/{id}/adjudicate with decision == DISMISSED"
        actor: system
        preconditions:
          - "Incident.hazard_pattern_id == the dismissed HazardPattern.id"
        side_effects:
          - "clears Incident.hazard_pattern_id to null"
          - "increments Incident.version by 1"
        note: "Compensation: dismissal releases the cluster so the incidents are eligible for a later pattern."
      - from: CLUSTERED
        to: ESCALATED
        trigger: "system: POST /product-safety/reportability-evaluations/{id}/determine with determination == REPORTABLE"
        actor: system
        preconditions:
          - "Incident.hazard_pattern_id == ReportabilityEvaluation.hazard_pattern_id"
          - "Incident.status == CLUSTERED"
        side_effects:
          - "sets Incident.escalation_deadline_at = ReportabilityEvaluation.determined_at + 120h"
          - "increments Incident.version by 1"
          - "the count of rows flipped here is added to ProductModel.open_escalation_count (cascade link 2 of §1.2.2 chain reportable_escalation)"
      - from: INTAKE
        to: MERGED_DUPLICATE
        trigger: "POST /product-safety/incidents/{id}/dispose with disposition == MERGED_DUPLICATE"
        actor: IntakeSpecialist
        preconditions:
          - "Incident.status IN {INTAKE, CLASSIFIED}"
          - "duplicate_of_incident_id is present and resolves to an existing Incident"
          - "duplicate_of_incident_id != this Incident.id (ERR_SELF_DUPLICATE_REFERENCE)"
          - "the target Incident.status != MERGED_DUPLICATE (ERR_DUPLICATE_CHAIN_FORBIDDEN)"
        side_effects:
          - "sets Incident.duplicate_of_incident_id"
          - "increments Incident.version by 1"
      - from: CLASSIFIED
        to: MERGED_DUPLICATE
        trigger: "POST /product-safety/incidents/{id}/dispose with disposition == MERGED_DUPLICATE"
        actor: IntakeSpecialist
        preconditions:
          - "Incident.status == CLASSIFIED"
          - "Incident.hazard_pattern_id IS NULL (ERR_INCIDENT_STATE_INVALID)"
          - "duplicate_of_incident_id is present, resolves, is not self, and its target is not MERGED_DUPLICATE"
        side_effects:
          - "sets Incident.duplicate_of_incident_id"
          - "increments Incident.version by 1"
      - from: INTAKE
        to: CLOSED_NO_ACTION
        trigger: "POST /product-safety/incidents/{id}/dispose with disposition == CLOSED_NO_ACTION"
        actor: IntakeSpecialist
        preconditions:
          - "Incident.status == INTAKE"
        side_effects:
          - "increments Incident.version by 1"
      - from: CLASSIFIED
        to: CLOSED_NO_ACTION
        trigger: "POST /product-safety/incidents/{id}/dispose with disposition == CLOSED_NO_ACTION"
        actor: IntakeSpecialist
        preconditions:
          - "Incident.status == CLASSIFIED"
          - "Incident.hazard_pattern_id IS NULL (ERR_INCIDENT_STATE_INVALID)"
        side_effects:
          - "increments Incident.version by 1"

  - entity: HazardPattern
    state_field: pattern_status
    initial_state: ANALYZED
    terminal_states: [DISMISSED, SUPERSEDED]
    transitions:
      - from: null
        to: ANALYZED
        trigger: "POST /product-safety/hazard-patterns"
        actor: ComplianceOfficer
        preconditions:
          - "product_model_id resolves to an existing ProductModel"
          - "expected_product_model_version == ProductModel.version (ERR_STALE_PRODUCT_MODEL_VERSION, 412)"
          - "window_end > window_start"
        side_effects:
          - "computes incident_count, severity_sum, dominant_hazard_code, concentration_ratio, exposure_per_10k, risk_index and pattern_confirmed via calculations.hazard_pattern_risk_index under analysis_basis"
          - "stamps analyzed_at with the logical clock"
          - "flips every qualifying Incident CLASSIFIED->CLUSTERED and re-points already-CLUSTERED qualifying incidents to this pattern"
          - "flips every other HazardPattern of the same ProductModel whose pattern_status IN {ANALYZED, CONFIRMED} to SUPERSEDED"
          - "increments ProductModel.version by 1"
      - from: ANALYZED
        to: ANALYZED
        trigger: "POST /product-safety/hazard-patterns/{id}/recompute (analysis self-loop)"
        actor: ComplianceOfficer
        preconditions:
          - "HazardPattern.pattern_status == ANALYZED"
        side_effects:
          - "overwrites analysis_basis when the request supplies one"
          - "recomputes incident_count, severity_sum, dominant_hazard_code, concentration_ratio, exposure_per_10k, risk_index and pattern_confirmed"
          - "re-stamps analyzed_at with the logical clock"
          - "clusters any newly qualifying Incident rows (CLASSIFIED->CLUSTERED)"
          - "increments HazardPattern.version by 1"
        note: "Cycle: an ANALYZED pattern may be recomputed any number of times, including with a different analysis_basis, which is how the PRELIMINARY/FINAL divergence is observed on one row."
      - from: ANALYZED
        to: CONFIRMED
        trigger: "POST /product-safety/hazard-patterns/{id}/adjudicate with decision == CONFIRMED"
        actor: ComplianceOfficer
        preconditions:
          - "HazardPattern.pattern_status == ANALYZED"
          - "HazardPattern.pattern_confirmed == true (ERR_PATTERN_NOT_CONFIRMABLE, 422)"
        side_effects:
          - "increments HazardPattern.version by 1"
        note: "Fork branch A. Divergent from the DISMISSED branch: no Incident rows are touched and the model posture is left unchanged."
      - from: ANALYZED
        to: DISMISSED
        trigger: "POST /product-safety/hazard-patterns/{id}/adjudicate with decision == DISMISSED"
        actor: ComplianceOfficer
        preconditions:
          - "HazardPattern.pattern_status == ANALYZED"
          - "ProductModel.hazard_posture != FROZEN (ERR_MODEL_POSTURE_FROZEN, 409)"
        side_effects:
          - "flips every Incident whose hazard_pattern_id == this pattern from CLUSTERED to CLASSIFIED and clears their hazard_pattern_id"
          - "increments HazardPattern.version by 1"
        note: "Fork branch B. Divergent from the CONFIRMED branch: it releases the whole cluster and is gated on model posture."

  - entity: ReportabilityEvaluation
    state_field: status
    initial_state: OPEN
    terminal_states: [REPORTABLE, NOT_REPORTABLE]
    transitions:
      - from: null
        to: OPEN
        trigger: "POST /product-safety/reportability-evaluations"
        actor: ComplianceOfficer
        preconditions:
          - "hazard_pattern_id resolves to an existing HazardPattern"
          - "HazardPattern.pattern_status == CONFIRMED (ERR_PATTERN_STATE_INVALID, 409)"
          - "no other ReportabilityEvaluation for the same hazard_pattern_id has status IN {OPEN, IN_REVIEW, REPORTABLE} (ERR_DUPLICATE_DOCKET_ENTRY, 409)"
        side_effects:
          - "copies product_model_id from HazardPattern.product_model_id"
          - "stamps opened_at with the logical clock"
          - "sets internal_escalation_due_at via calculations.evaluation_escalation_window"
      - from: OPEN
        to: IN_REVIEW
        trigger: "POST /product-safety/reportability-evaluations/{id}/begin-review"
        actor: ComplianceOfficer
        preconditions:
          - "ReportabilityEvaluation.status == OPEN"
        side_effects:
          - "stamps review_started_at with the logical clock"
          - "sets escalation_breached = true when the logical clock is strictly greater than internal_escalation_due_at, otherwise leaves it false"
          - "increments ReportabilityEvaluation.version by 1"
      - from: IN_REVIEW
        to: REPORTABLE
        trigger: "POST /product-safety/reportability-evaluations/{id}/determine with determination == REPORTABLE"
        actor: ComplianceOfficer
        preconditions:
          - "ReportabilityEvaluation.status == IN_REVIEW"
          - "the submitted scores support REPORTABLE under the evaluation's standard_basis exactly as validations priority 18 states: DEFECT needs defect_score >= 5, UNREASONABLE_RISK needs risk_score >= 5, NONCOMPLIANCE and VOLUNTARY_STANDARD_FAILURE need defect_score + risk_score >= 8 (ERR_DETERMINATION_UNSUPPORTED, 422)"
        side_effects:
          - "records defect_score, risk_score and determination_note; stamps determined_at with the logical clock"
          - "sets report_due_at = determined_at + 240h"
          - "flips every Incident whose hazard_pattern_id == this evaluation's hazard_pattern_id and whose status == CLUSTERED to ESCALATED with escalation_deadline_at = determined_at + 120h"
          - "because those incidents escalated, adds their count to ProductModel.open_escalation_count and sets ProductModel.hazard_posture = FROZEN"
          - "increments ReportabilityEvaluation.version by 1"
        note: "Fork branch A of the determination. Divergent side-effect set: escalates the cluster and freezes the model."
      - from: IN_REVIEW
        to: NOT_REPORTABLE
        trigger: "POST /product-safety/reportability-evaluations/{id}/determine with determination == NOT_REPORTABLE"
        actor: ComplianceOfficer
        preconditions:
          - "ReportabilityEvaluation.status == IN_REVIEW"
          - "the submitted scores are the mirror image of the priority-18 support test, i.e. strictly below the standard_basis threshold: DEFECT needs defect_score < 5, UNREASONABLE_RISK needs risk_score < 5, NONCOMPLIANCE and VOLUNTARY_STANDARD_FAILURE need defect_score + risk_score < 8 (ERR_DETERMINATION_UNSUPPORTED, 422)"
        side_effects:
          - "records defect_score, risk_score and determination_note; stamps determined_at with the logical clock"
          - "leaves report_due_at null and leaves every Incident status unchanged"
          - "sets ProductModel.hazard_posture = MONITORED"
          - "increments ReportabilityEvaluation.version by 1"
        note: "Fork branch B. Divergent side-effect set: no escalation, no report deadline, posture relaxed."

  - entity: SectionReport
    state_field: status
    initial_state: DRAFT
    terminal_states: [ACCEPTED]
    transitions:
      - from: null
        to: DRAFT
        trigger: "POST /product-safety/section-reports"
        actor: ComplianceOfficer
        preconditions:
          - "reportability_evaluation_id resolves to an existing ReportabilityEvaluation"
          - "ReportabilityEvaluation.status == REPORTABLE (ERR_EVALUATION_STATE_INVALID, 409)"
          - "no other SectionReport for the same reportability_evaluation_id has status IN {DRAFT, SUBMITTED, ACCEPTED} (ERR_DUPLICATE_DOCKET_ENTRY, 409)"
        side_effects:
          - "records corrective_action_type and corrective_action_summary"
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /product-safety/section-reports/{id}/submit"
        actor: ComplianceOfficer
        preconditions:
          - "SectionReport.status == DRAFT"
        side_effects:
          - "stamps submitted_at with the logical clock"
          - "recomputes days_late and late_surcharge_cents via calculations.section_report_lateness against ReportabilityEvaluation.report_due_at"
          - "sets ProductModel.hazard_posture = RESTRICTED on the evaluation's product_model_id"
          - "increments SectionReport.version by 1"
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /product-safety/section-reports/{id}/review with decision == ACCEPTED"
        actor: SafetyDirector
        preconditions:
          - "SectionReport.status == SUBMITTED"
        side_effects:
          - "stamps reviewed_at with the logical clock"
          - "leaves ProductModel.hazard_posture at RESTRICTED"
          - "increments SectionReport.version by 1"
      - from: SUBMITTED
        to: RETURNED_FOR_INFO
        trigger: "POST /product-safety/section-reports/{id}/review with decision == RETURNED_FOR_INFO"
        actor: SafetyDirector
        preconditions:
          - "SectionReport.status == SUBMITTED"
        side_effects:
          - "stamps reviewed_at with the logical clock"
          - "sets ProductModel.hazard_posture = FROZEN on the evaluation's product_model_id"
          - "increments SectionReport.version by 1"
      - from: RETURNED_FOR_INFO
        to: DRAFT
        trigger: "POST /product-safety/section-reports/{id}/revise"
        actor: ComplianceOfficer
        preconditions:
          - "SectionReport.status == RETURNED_FOR_INFO"
        side_effects:
          - "overwrites corrective_action_type and corrective_action_summary when supplied"
          - "increments SectionReport.version by 1"
        note: "Cycle DRAFT -> SUBMITTED -> RETURNED_FOR_INFO -> DRAFT; each resubmission recomputes days_late against the same report_due_at, so the surcharge grows."

  - entity: Recall
    state_field: plan_status
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: null
        to: DRAFT
        trigger: "POST /product-safety/recalls"
        actor: ComplianceOfficer
        preconditions:
          - "section_report_id resolves to an existing SectionReport"
          - "SectionReport.status == ACCEPTED (ERR_SECTION_REPORT_STATE_INVALID, 409)"
          - "no other Recall references the same section_report_id (ERR_DUPLICATE_DOCKET_ENTRY, 409)"
          - "remedy_options is a non-empty array of distinct members of {REPAIR, REPLACE, REFUND, RETROFIT_KIT}"
        side_effects:
          - "sets units_corrected = 0 and units_outstanding = units_in_commerce"
          - "sets plan_status = DRAFT, notification_status = NOT_STARTED, effectiveness_flag = PENDING"
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /product-safety/recalls/{id}/submit-plan"
        actor: ComplianceOfficer | SafetyDirector
        preconditions:
          - "Recall.plan_status == DRAFT"
          - "at least one ConsumerNotice with recall_id == this recall and channel == DIRECT_NOTICE exists (ERR_DIRECT_NOTICE_REQUIRED, 422)"
        side_effects:
          - "sets submitted_by_user_id to the acting X-User-ID"
          - "increments Recall.version by 1"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /product-safety/recalls/{id}/approve-plan"
        actor: SafetyDirector
        preconditions:
          - "Recall.plan_status == SUBMITTED"
          - "acting X-User-ID != Recall.submitted_by_user_id (ERR_SEGREGATION_OF_DUTIES, 403)"
        side_effects:
          - "sets stop_sale_effective_at to the logical clock"
          - "cascade link 2: because the recall reached APPROVED, every RetailerNotification with recall_id == this recall and status == PENDING flips to ISSUED with stop_sale_required = true, issued_at = the logical clock and ack_due_at = issued_at + 72h, processed in created_at ASC order"
          - "cascade link 2b: when at least one notification flipped to ISSUED, Recall.notification_status moves NOT_STARTED -> IN_PROGRESS"
          - "cascade link 3: because each notification became ISSUED, its Retailer.open_stop_sale_count is incremented by 1 and Retailer.compliance_posture is set to STOP_SALE_ACTIVE"
          - "increments Recall.version by 1"
        note: "Origin of transitive cascade chain `plan_approval_stop_sale` (depth 3: Recall -> RetailerNotification -> Retailer)."
      - from: APPROVED
        to: MONITORING
        trigger: "POST /product-safety/recalls/{id}/begin-monitoring"
        actor: SafetyDirector
        preconditions:
          - "Recall.plan_status == APPROVED"
          - "at least one ConsumerNotice with recall_id == this recall has status == RELEASED (ERR_CONSUMER_NOTICE_NOT_RELEASED, 409)"
        side_effects:
          - "increments Recall.version by 1"
      - from: MONITORING
        to: CLOSED
        trigger: "POST /product-safety/recalls/{id}/close"
        actor: SafetyDirector
        preconditions:
          - "Recall.plan_status == MONITORING"
          - "Recall.effectiveness_flag == MET (ERR_EFFECTIVENESS_NOT_MET, 409)"
          - "Recall.notification_status == SATISFIED (ERR_NOTIFICATION_NOT_SATISFIED, 409)"
          - "at least one ProgressReport with recall_id == this recall has status == ACCEPTED (ERR_PROGRESS_REPORT_REQUIRED, 422)"
        side_effects:
          - "sets ProductModel.open_escalation_count = 0 and ProductModel.hazard_posture = MONITORED on the model reached through SectionReport -> ReportabilityEvaluation, when this recall was that model's last open escalation source"
          - "increments Recall.version by 1"

  - entity: Recall
    state_field: notification_status
    initial_state: NOT_STARTED
    terminal_states: [SATISFIED]
    transitions:
      - from: NOT_STARTED
        to: IN_PROGRESS
        trigger: "system: POST /product-safety/recalls/{id}/approve-plan flipped at least one RetailerNotification PENDING -> ISSUED"
        actor: system
        preconditions:
          - "Recall.notification_status == NOT_STARTED"
          - "count of RetailerNotification with recall_id == this recall and status == PENDING at approval time >= 1"
        side_effects:
          - "increments Recall.version by 1 (folded into the approve-plan mutation)"
        note: "When the count is exactly 0 the dimension stays NOT_STARTED while plan_status still advances to APPROVED — the two dimensions are independent."
      - from: IN_PROGRESS
        to: DEFICIENT
        trigger: "system: POST /product-safety/recalls/{id}/compliance-sweep flipped at least one RetailerNotification ISSUED -> DELINQUENT"
        actor: system
        preconditions:
          - "Recall.notification_status == IN_PROGRESS"
          - "at least one RetailerNotification with recall_id == this recall has status == ISSUED and the logical clock is strictly greater than its ack_due_at"
        side_effects:
          - "increments Recall.version by 1"
      - from: DEFICIENT
        to: IN_PROGRESS
        trigger: "system: POST /product-safety/retailer-notifications/{id}/acknowledge cleared the last DELINQUENT notification"
        actor: system
        preconditions:
          - "Recall.notification_status == DEFICIENT"
          - "after the acknowledgement, no RetailerNotification with recall_id == this recall has status == DELINQUENT"
        side_effects:
          - "increments Recall.version by 1"
        note: "Cycle IN_PROGRESS <-> DEFICIENT; the recall can oscillate across successive sweeps."
      - from: IN_PROGRESS
        to: SATISFIED
        trigger: "system: POST /product-safety/retailer-notifications/{id}/verify verified the last outstanding notification"
        actor: system
        preconditions:
          - "Recall.notification_status == IN_PROGRESS"
          - "after the verification, every RetailerNotification with recall_id == this recall has status == VERIFIED"
        side_effects:
          - "increments Recall.version by 1"

  - entity: RetailerNotification
    state_field: status
    initial_state: PENDING
    terminal_states: [VERIFIED]
    transitions:
      - from: null
        to: PENDING
        trigger: "POST /product-safety/retailer-notifications"
        actor: ComplianceOfficer
        preconditions:
          - "recall_id and retailer_id both resolve"
          - "Recall.plan_status IN {DRAFT, SUBMITTED} (ERR_RECALL_PLAN_STATE_INVALID, 409) — a notification created after approval would never be reached by the approval cascade, so the window closes at APPROVED"
          - "no other RetailerNotification exists for the same (recall_id, retailer_id) pair (ERR_DUPLICATE_RETAILER_NOTIFICATION, 409)"
        side_effects: []
      - from: PENDING
        to: ISSUED
        trigger: "system: POST /product-safety/recalls/{id}/approve-plan cascade"
        actor: system
        preconditions:
          - "RetailerNotification.status == PENDING"
          - "the parent Recall transitions SUBMITTED -> APPROVED in this request"
        side_effects:
          - "sets stop_sale_required = true, issued_at = the logical clock, ack_due_at = issued_at + 72h"
          - "increments Retailer.open_stop_sale_count by 1 and sets Retailer.compliance_posture = STOP_SALE_ACTIVE"
          - "increments RetailerNotification.version by 1"
      - from: ISSUED
        to: DELINQUENT
        trigger: "system: POST /product-safety/recalls/{id}/compliance-sweep"
        actor: system
        preconditions:
          - "RetailerNotification.status == ISSUED"
          - "the logical clock is strictly greater than RetailerNotification.ack_due_at"
        side_effects:
          - "sets Retailer.compliance_posture = DELINQUENT and increments Retailer.delinquent_count by 1"
          - "increments RetailerNotification.version by 1"
      - from: ISSUED
        to: ACKNOWLEDGED
        trigger: "POST /product-safety/retailer-notifications/{id}/acknowledge"
        actor: RetailerRep
        preconditions:
          - "RetailerNotification.status == ISSUED"
          - "acting X-User-ID == RetailerNotification.retailer_id (ERR_RETAILER_SCOPE_VIOLATION, 403)"
          - "units_on_shelf_reported >= 0"
        side_effects:
          - "stamps acknowledged_at and records units_on_shelf_reported"
          - "increments RetailerNotification.version by 1"
      - from: DELINQUENT
        to: ACKNOWLEDGED
        trigger: "POST /product-safety/retailer-notifications/{id}/acknowledge (late acknowledgement)"
        actor: RetailerRep
        preconditions:
          - "RetailerNotification.status == DELINQUENT"
          - "acting X-User-ID == RetailerNotification.retailer_id (ERR_RETAILER_SCOPE_VIOLATION, 403)"
        side_effects:
          - "stamps acknowledged_at and records units_on_shelf_reported"
          - "sets Retailer.compliance_posture = STOP_SALE_ACTIVE when Retailer.open_stop_sale_count >= 1, else CLEAR"
          - "moves the parent Recall.notification_status DEFICIENT -> IN_PROGRESS when no DELINQUENT notification remains for that recall"
          - "increments RetailerNotification.version by 1"
      - from: ACKNOWLEDGED
        to: VERIFIED
        trigger: "POST /product-safety/retailer-notifications/{id}/verify"
        actor: FieldAuditor
        preconditions:
          - "RetailerNotification.status == ACKNOWLEDGED"
          - "at least one AuditVisit with retailer_notification_id == this notification has status == COMPLETED and verdict == PASS (ERR_SHELF_REMOVAL_UNVERIFIED, 409)"
        side_effects:
          - "stamps verified_at with the logical clock"
          - "decrements Retailer.open_stop_sale_count by 1, increments Retailer.verified_removal_count by 1, and sets Retailer.compliance_posture = CLEAR when open_stop_sale_count reaches 0"
          - "moves the parent Recall.notification_status IN_PROGRESS -> SATISFIED when every notification of that recall is VERIFIED"
          - "increments RetailerNotification.version by 1"

  - entity: AuditVisit
    state_field: status
    initial_state: SCHEDULED
    terminal_states: [COMPLETED]
    transitions:
      - from: null
        to: SCHEDULED
        trigger: "POST /product-safety/audit-visits"
        actor: FieldAuditor
        preconditions:
          - "retailer_notification_id resolves to an existing RetailerNotification"
          - "RetailerNotification.status != VERIFIED, i.e. IN {PENDING, ISSUED, DELINQUENT, ACKNOWLEDGED} (ERR_NOTIFICATION_STATE_INVALID, 409)"
          - "the Retailer identified by RetailerNotification.retailer_id has compliance_posture IN {STOP_SALE_ACTIVE, DELINQUENT} (ERR_NO_ACTIVE_STOP_SALE, 409)"
          - "window_end > window_start"
          - "no other AuditVisit with status == SCHEDULED at the same Retailer collides under the buffered half-open rule of validations[priority=19] (ERR_AUDIT_WINDOW_CONFLICT, 409)"
        side_effects: []
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /product-safety/audit-visits/{id}/complete"
        actor: FieldAuditor
        preconditions:
          - "AuditVisit.status == SCHEDULED"
          - "verdict is a member of {PASS, FAIL}"
          - "shelf_units_found == 0 when verdict == PASS (ERR_SHELF_UNITS_PRESENT, 422)"
        side_effects:
          - "records verdict and shelf_units_found; stamps completed_at with the logical clock"
          - "increments AuditVisit.version by 1"

  - entity: ConsumerNotice
    state_field: status
    initial_state: SCHEDULED
    terminal_states: [SUPERSEDED]
    transitions:
      - from: null
        to: SCHEDULED
        trigger: "POST /product-safety/consumer-notices"
        actor: ComplianceOfficer
        preconditions:
          - "recall_id resolves to an existing Recall"
          - "Recall.plan_status IN {DRAFT, SUBMITTED, APPROVED} (ERR_RECALL_PLAN_STATE_INVALID, 409)"
          - "reach_count <= ProductModel.units_registered when channel == REGISTRATION_CARD, where the model is reached through Recall.section_report_id -> SectionReport.reportability_evaluation_id -> ReportabilityEvaluation.product_model_id (ERR_REACH_EXCEEDS_REGISTRY, 422)"
        side_effects: []
      - from: SCHEDULED
        to: RELEASED
        trigger: "POST /product-safety/consumer-notices/{id}/release"
        actor: ComplianceOfficer
        preconditions:
          - "ConsumerNotice.status == SCHEDULED"
          - "Recall.plan_status == APPROVED (ERR_RECALL_PLAN_STATE_INVALID, 409)"
          - "the logical clock is >= scheduled_for (ERR_NOTICE_NOT_DUE, 409)"
          - "the logical clock is >= embargo_until when embargo_until is not null (ERR_EMBARGO_ACTIVE, 409)"
        side_effects:
          - "stamps released_at with the logical clock"
          - "flips every other ConsumerNotice with the same recall_id and the same channel whose status == RELEASED to SUPERSEDED"
          - "increments ConsumerNotice.version by 1"
      - from: RELEASED
        to: SUPERSEDED
        trigger: "system: a later ConsumerNotice on the same recall_id and channel is released"
        actor: system
        preconditions:
          - "ConsumerNotice.status == RELEASED"
        side_effects:
          - "increments ConsumerNotice.version by 1"

  - entity: RemedyClaim
    state_field: status
    initial_state: SUBMITTED
    terminal_states: [VOID]
    transitions:
      - from: null
        to: SUBMITTED
        trigger: "POST /product-safety/remedy-claims"
        actor: ComplianceOfficer
        preconditions:
          - "recall_id resolves to an existing Recall"
          - "Recall.plan_status IN {APPROVED, MONITORING} (ERR_RECALL_PLAN_STATE_INVALID, 409)"
          - "remedy_type is a member of Recall.remedy_options (ERR_REMEDY_OPTION_NOT_OFFERED, 422)"
          - "quantity <= Recall.units_outstanding (ERR_UNITS_OUTSTANDING_EXCEEDED, 422)"
        side_effects:
          - "computes reimbursement_total_cents via calculations.remedy_reimbursement_total"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /product-safety/remedy-claims/{id}/approve"
        actor: ComplianceOfficer
        preconditions:
          - "RemedyClaim.status == SUBMITTED"
          - "quantity <= Recall.units_outstanding at approval time (ERR_UNITS_OUTSTANDING_EXCEEDED, 422)"
        side_effects:
          - "increments RemedyClaim.version by 1"
      - from: APPROVED
        to: FULFILLED
        trigger: "POST /product-safety/remedy-claims/{id}/fulfill"
        actor: ComplianceOfficer
        preconditions:
          - "RemedyClaim.status == APPROVED"
          - "Recall.plan_status IN {APPROVED, MONITORING} (ERR_RECALL_PLAN_STATE_INVALID, 409)"
        side_effects:
          - "stamps fulfilled_at with the logical clock; increments RemedyClaim.version by 1"
          - "cascade link 2: because the claim became FULFILLED, Recall.units_corrected increases by quantity and Recall.units_outstanding decreases by quantity (conserving units_corrected + units_outstanding == units_in_commerce)"
          - "cascade link 3: because Recall.units_corrected changed, calculations.recall_effectiveness_rate is re-evaluated on the UNITS_BASIS variant and Recall.effectiveness_flag flips PENDING -> MET when the rate is >= Recall.participation_goal_pct"
          - "cascade link 4: because Recall.effectiveness_flag became MET, the CivilPenaltyCase whose section_report_id == Recall.section_report_id and whose status IN {ASSESSMENT_OPEN, OFFER_MADE, COUNTERED} sets cooperation_bonus_applied = true, recomputes consent_agreement_preview_cents, and increments its version by 1"
          - "increments Recall.version by 1"
        note: "Origin of transitive cascade chain `claim_fulfilment_credit` (depth 4: RemedyClaim -> Recall counters -> Recall.effectiveness_flag -> CivilPenaltyCase)."
      - from: APPROVED
        to: VOID
        trigger: "POST /product-safety/remedy-claims/{id}/void"
        actor: ComplianceOfficer
        preconditions:
          - "RemedyClaim.status == APPROVED"
        side_effects:
          - "stamps voided_at with the logical clock; increments RemedyClaim.version by 1"
          - "no counter on Recall moves, because an APPROVED claim was never counted"
      - from: FULFILLED
        to: VOID
        trigger: "POST /product-safety/remedy-claims/{id}/void"
        actor: ComplianceOfficer
        preconditions:
          - "RemedyClaim.status == FULFILLED"
          - "Recall.plan_status != CLOSED (ERR_RECALL_PLAN_STATE_INVALID, 409)"
        side_effects:
          - "stamps voided_at with the logical clock; increments RemedyClaim.version by 1"
          - "compensating link 2: Recall.units_corrected decreases by quantity and Recall.units_outstanding increases by quantity, restoring units_corrected + units_outstanding == units_in_commerce exactly"
          - "compensating link 3: Recall.effectiveness_flag is re-evaluated on the UNITS_BASIS variant and reverts MET -> PENDING when the rate falls below Recall.participation_goal_pct"
          - "compensating link 4: when the flag reverted out of MET, the CivilPenaltyCase whose section_report_id == Recall.section_report_id and whose status IN {ASSESSMENT_OPEN, OFFER_MADE, COUNTERED} sets cooperation_bonus_applied = false, recomputes consent_agreement_preview_cents, and increments its version by 1"
          - "increments Recall.version by 1"
        note: "Exact compensation of `claim_fulfilment_credit`; the conserved quantity is Recall.units_corrected + Recall.units_outstanding."

  - entity: ProgressReport
    state_field: status
    initial_state: DRAFT
    terminal_states: [ACCEPTED]
    transitions:
      - from: null
        to: DRAFT
        trigger: "POST /product-safety/progress-reports"
        actor: ComplianceOfficer | SafetyDirector
        preconditions:
          - "recall_id resolves to an existing Recall"
          - "Recall.plan_status IN {APPROVED, MONITORING} (ERR_RECALL_PLAN_STATE_INVALID, 409)"
          - "period_end > period_start"
          - "the closed interval [period_start, period_end] does not intersect the closed interval of any ProgressReport of the same recall whose status IN {SUBMITTED, ACCEPTED} (ERR_REPORT_PERIOD_OVERLAP, 409)"
          - "period_start equals max(period_end) + 24h over ProgressReport rows of the same recall with status IN {SUBMITTED, ACCEPTED}; when no such row exists, period_start equals Recall.stop_sale_effective_at (ERR_REPORT_PERIOD_GAP, 422)"
        side_effects:
          - "sets prepared_by_user_id to the acting X-User-ID"
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /product-safety/progress-reports/{id}/submit"
        actor: ComplianceOfficer | SafetyDirector
        preconditions:
          - "ProgressReport.status == DRAFT"
        side_effects:
          - "computes units_corrected_in_period as the sum of RemedyClaim.quantity over claims with recall_id == this recall, status == FULFILLED and fulfilled_at within [period_start, period_end] inclusive"
          - "snapshots cumulative_units_corrected = Recall.units_corrected"
          - "computes effectiveness_rate via calculations.recall_effectiveness_rate under effectiveness_basis, and derives assessment from it"
          - "stamps submitted_at with the logical clock; increments ProgressReport.version by 1"
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /product-safety/progress-reports/{id}/accept"
        actor: SafetyDirector
        preconditions:
          - "ProgressReport.status == SUBMITTED"
          - "acting X-User-ID != ProgressReport.prepared_by_user_id (ERR_SEGREGATION_OF_DUTIES, 403)"
        side_effects:
          - "stamps accepted_at with the logical clock; increments ProgressReport.version by 1"
          - "sets Recall.last_accepted_period_end = period_end"
          - "sets Recall.effectiveness_flag = SHORTFALL when assessment == CRITICAL"
          - "increments Recall.version by 1"

  - entity: CivilPenaltyCase
    state_field: status
    initial_state: ASSESSMENT_OPEN
    terminal_states: [AGREED]
    transitions:
      - from: null
        to: ASSESSMENT_OPEN
        trigger: "POST /product-safety/civil-penalty-cases"
        actor: PenaltyCounsel
        preconditions:
          - "section_report_id resolves to an existing SectionReport"
          - "SectionReport.status IN {SUBMITTED, ACCEPTED} (ERR_SECTION_REPORT_STATE_INVALID, 409)"
          - "no other CivilPenaltyCase references the same section_report_id (ERR_DUPLICATE_DOCKET_ENTRY, 409)"
          - "violation_count >= 1"
        side_effects:
          - "computes assessed_penalty_cents via calculations.civil_penalty_assessment"
          - "sets reserved_cents = 0 and available_cents = assessed_penalty_cents"
          - "computes consent_agreement_preview_cents"
      - from: ASSESSMENT_OPEN
        to: OFFER_MADE
        trigger: "POST /product-safety/civil-penalty-cases/{id}/offers with offered_by == AGENCY"
        actor: PenaltyCounsel
        preconditions:
          - "CivilPenaltyCase.status == ASSESSMENT_OPEN"
          - "expected_case_version == CivilPenaltyCase.version (ERR_STALE_PENALTY_CASE_VERSION, 412)"
          - "current_offer_round < 6 (ERR_NEGOTIATION_ROUNDS_EXHAUSTED, 409)"
          - "amount_cents <= assessed_penalty_cents (ERR_OFFER_EXCEEDS_ASSESSMENT, 422)"
        side_effects:
          - "increments current_offer_round by 1; sets current_offer_cents = amount_cents and current_offer_by = AGENCY"
          - "sets reserved_cents = amount_cents and available_cents = assessed_penalty_cents - amount_cents"
          - "increments CivilPenaltyCase.version by 1"
      - from: COUNTERED
        to: OFFER_MADE
        trigger: "POST /product-safety/civil-penalty-cases/{id}/offers with offered_by == AGENCY (next negotiation round)"
        actor: PenaltyCounsel
        preconditions:
          - "CivilPenaltyCase.status == COUNTERED"
          - "expected_case_version == CivilPenaltyCase.version (ERR_STALE_PENALTY_CASE_VERSION, 412)"
          - "current_offer_round < 6 (ERR_NEGOTIATION_ROUNDS_EXHAUSTED, 409)"
          - "amount_cents <= assessed_penalty_cents (ERR_OFFER_EXCEEDS_ASSESSMENT, 422)"
        side_effects:
          - "increments current_offer_round by 1; overwrites current_offer_cents = amount_cents and current_offer_by = AGENCY"
          - "sets reserved_cents = amount_cents and available_cents = assessed_penalty_cents - amount_cents"
          - "increments CivilPenaltyCase.version by 1"
        note: "Closes the negotiation cycle ASSESSMENT_OPEN -> OFFER_MADE -> COUNTERED -> OFFER_MADE; current_offer_round is the termination counter (max 6)."
      - from: OFFER_MADE
        to: COUNTERED
        trigger: "POST /product-safety/civil-penalty-cases/{id}/offers with offered_by == RESPONDENT"
        actor: PenaltyCounsel
        preconditions:
          - "CivilPenaltyCase.status == OFFER_MADE"
          - "expected_case_version == CivilPenaltyCase.version (ERR_STALE_PENALTY_CASE_VERSION, 412)"
          - "current_offer_round < 6 (ERR_NEGOTIATION_ROUNDS_EXHAUSTED, 409)"
          - "amount_cents <= assessed_penalty_cents (ERR_OFFER_EXCEEDS_ASSESSMENT, 422)"
        side_effects:
          - "increments current_offer_round by 1; overwrites current_offer_cents = amount_cents and current_offer_by = RESPONDENT"
          - "releases the agency reserve: sets reserved_cents = 0 and available_cents = assessed_penalty_cents"
          - "increments CivilPenaltyCase.version by 1"
      - from: OFFER_MADE
        to: ASSESSMENT_OPEN
        trigger: "POST /product-safety/civil-penalty-cases/{id}/offer-resolution with resolution == WITHDRAWN"
        actor: PenaltyCounsel
        preconditions:
          - "CivilPenaltyCase.status == OFFER_MADE"
          - "CivilPenaltyCase.current_offer_by == AGENCY (ERR_PENALTY_CASE_STATE_INVALID, 409)"
        side_effects:
          - "clears current_offer_cents and current_offer_by to null; leaves current_offer_round unchanged (monotonic)"
          - "compensation: sets reserved_cents = 0 and available_cents = assessed_penalty_cents, restoring reserved_cents + available_cents == assessed_penalty_cents exactly"
          - "increments CivilPenaltyCase.version by 1"
      - from: OFFER_MADE
        to: AGREED
        trigger: "POST /product-safety/civil-penalty-cases/{id}/offer-resolution with resolution == ACCEPTED"
        actor: PenaltyCounsel
        preconditions:
          - "CivilPenaltyCase.status == OFFER_MADE"
          - "CivilPenaltyCase.current_offer_by == AGENCY (ERR_PENALTY_CASE_STATE_INVALID, 409)"
        side_effects:
          - "computes cooperation_credit_tier, cooperation_credit_cents and consent_agreement_total_cents via calculations.consent_agreement_total from current_offer_cents"
          - "sets reserved_cents = consent_agreement_total_cents and available_cents = assessed_penalty_cents - consent_agreement_total_cents"
          - "sets compliance_program_required = (consent_agreement_total_cents >= 5000000) and reporting_obligation_months = 24 when required else 12"
          - "increments CivilPenaltyCase.version by 1"

# =============================================================================
# §1.2.1 Concurrency Rules  (OCC on the parent entity's `version` only)
# =============================================================================
concurrency_rules:
  - rule_id: pattern-create-stale-model
    parent_entity: ProductModel
    write_endpoint: "POST /product-safety/hazard-patterns"
    occ_field: "expected_product_model_version"
    description: |
      A hazard-pattern creation carrying a ProductModel version older than the
      model's stored version is rejected. Creating a pattern legitimately
      supersedes every prior ANALYZED/CONFIRMED pattern of that model and
      re-points its clustered incidents, so a writer working from a stale view
      of the model would silently discard an analysis it never saw; the version
      check turns that into a deterministic 412.
    error_id: ERR_STALE_PRODUCT_MODEL_VERSION
    http_status: 412

  - rule_id: offer-create-stale-case
    parent_entity: CivilPenaltyCase
    write_endpoint: "POST /product-safety/civil-penalty-cases/{id}/offers"
    occ_field: "expected_case_version"
    description: |
      An offer carrying a CivilPenaltyCase version older than the case's stored
      version is rejected. A new offer legitimately supersedes the standing one
      (overwriting current_offer_cents and re-cutting the reserve), and the
      claim-fulfilment cascade can also advance the case's version by setting
      cooperation_bonus_applied; the version check makes both forms of stale
      view a deterministic 412 instead of a lost update.
    error_id: ERR_STALE_PENALTY_CASE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  # ---------------------------------------------------------------- 1.3.1 ----
  - name: incident_severity_weight
    trigger: |
      Runs inside POST /product-safety/incidents/{id}/classify, which writes
      Incident.injury_class, Incident.hazard_code and Incident.injury_verified and
      then stores the result on Incident.severity_weight. The value is frozen at
      classification time; it is never recomputed when the parent ProductModel or
      any HazardPattern changes.
    algorithm: weighted_scoring
    formula: |
      injury_base = INJURY_WEIGHT[injury_class]
      channel_mult = CHANNEL_MULT[report_channel]        # report_channel was fixed at intake
      raw = injury_base * channel_mult
      if injury_verified == false:
          raw = raw * UNVERIFIED_DISCOUNT
      severity_weight = round_half_up(raw, 2)
    input_set: |
      A single Incident row. Only the row's own injury_class, report_channel and
      injury_verified participate; no aggregation, no sibling incidents.
    constants:
      INJURY_WEIGHT:
        NO_INJURY: 1
        FIRST_AID: 3
        MEDICAL_TREATMENT: 8
        HOSPITALIZATION: 20
        FATALITY: 50
      CHANNEL_MULT:
        CONSUMER_HOTLINE: 1.00
        WEB_FORM: 1.00
        RETAILER: 1.20
        MEDICAL_EXAMINER: 1.50
      UNVERIFIED_DISCOUNT: 0.5
    precision: "2 decimal places, round_half_up"

  # ---------------------------------------------------------------- 1.3.2 ----
  - name: hazard_pattern_risk_index
    trigger: |
      Runs once inside POST /product-safety/hazard-patterns, which snapshots the
      qualifying incident set for the requested window into HazardPattern.
      incident_count, severity_sum, dominant_hazard_code, concentration_ratio,
      exposure_per_10k, risk_index and pattern_confirmed, and stamps analyzed_at.
      The snapshot is immutable: incidents classified after the pattern is
      created do NOT change any of these fields. A later window re-analysis is a
      NEW HazardPattern row (which supersedes the earlier one via
      POST /product-safety/hazard-patterns/{id}/adjudicate decision=SUPERSEDED).
    algorithm: threshold
    formula: |
      # -- inclusion set (see input_set; differs per variant) --
      S = qualifying incidents, ordered created_at ASC
      incident_count = count(S)
      severity_sum   = round_half_up(sum(i.severity_weight for i in S), 2)

      # -- exposure normalisation, with a floor so tiny production runs do not
      #    divide by a fraction and explode the index --
      exposure_per_10k = round_half_up(max(EXPOSURE_FLOOR,
                                           ProductModel.units_distributed / 10000), 4)

      # -- hazard concentration: modal hazard_code over S --
      if incident_count == 0:
          dominant_hazard_code = null
          concentration_ratio  = 0.0000
      else:
          # tally hazard_code over S; the modal code wins.
          # TIE-BREAK: if two hazard codes tie on tally, the winner is the code
          # carried by the EARLIEST-created incident in S (created_at ASC, first
          # row wins). Never by id.
          dominant_hazard_code = modal_hazard_code(S)
          dominant_count       = tally(dominant_hazard_code)
          concentration_ratio  = round_half_up(dominant_count / incident_count, 4)

      # -- index --
      density    = severity_sum / exposure_per_10k          # full precision, no intermediate round
      raw_index  = density * (CONCENTRATION_BASE + concentration_ratio)
      risk_index = round_half_up(min(raw_index, RISK_INDEX_CAP), 2)

      # -- confirmability gate (all three, each a >= boundary) --
      pattern_confirmed = (incident_count      >= MIN_INCIDENT_COUNT
                       AND concentration_ratio >= MIN_CONCENTRATION
                       AND risk_index          >= MIN_RISK_INDEX)
    input_set: |
      Incident rows with product_model_id == HazardPattern.product_model_id whose
      incident_date falls in the CLOSED window [window_start, window_end] (both
      endpoints inclusive), whose status is IN {CLASSIFIED, CLUSTERED, ESCALATED}
      (so INTAKE rows that were never classified, MERGED_DUPLICATE rows folded
      into another incident, and CLOSED_NO_ACTION rows are all excluded), and
      whose duplicate_of_incident_id is null. The analysis_basis variant then
      filters further on injury_verified.
    constants:
      EXPOSURE_FLOOR: 1.0
      CONCENTRATION_BASE: 0.5
      RISK_INDEX_CAP: 100
      MIN_INCIDENT_COUNT: 3
      MIN_CONCENTRATION: 0.6000
      MIN_RISK_INDEX: 10.00
    precision: |
      severity_sum and risk_index: 2 decimal places, round_half_up.
      concentration_ratio and exposure_per_10k: 4 decimal places, round_half_up.
      density and raw_index are NOT rounded before risk_index is rounded once at
      the end — a single terminal rounding, no intermediate quantisation.
    variants:
      - name: PRELIMINARY
        when: "HazardPattern.analysis_basis == PRELIMINARY (the fast triage pass an analyst runs while field verification is still outstanding)"
        difference: |
          The inclusion set is narrowed to incidents with injury_verified == true.
          Unverified reports are dropped from S entirely — they contribute nothing
          to incident_count, to severity_sum, and (critically) nothing to the
          hazard tally that decides dominant_hazard_code / concentration_ratio.
      - name: FINAL
        when: "HazardPattern.analysis_basis == FINAL (the closing pass filed with the reportability evaluation)"
        difference: |
          The inclusion set widens to ALL qualifying incidents regardless of
          injury_verified. Unverified rows enter at their discounted
          severity_weight (already halved by incident_severity_weight), which
          RAISES severity_sum but can DILUTE concentration_ratio when the extra
          rows carry a different hazard_code. The two effects pull in opposite
          directions, so FINAL is neither reliably higher nor reliably lower than
          PRELIMINARY on the same data — it must be computed, not extrapolated.

  # ---------------------------------------------------------------- 1.3.3 ----
  - name: evaluation_escalation_window
    trigger: |
      Runs inside POST /product-safety/reportability-evaluations, which stamps
      ReportabilityEvaluation.opened_at = current logical UTC and derives
      internal_escalation_due_at. Re-evaluated (as a pure read of the stored
      deadline against the clock) inside POST /product-safety/
      reportability-evaluations/{id}/begin-review, which sets escalation_breached.
    algorithm: threshold
    formula: |
      risk = HazardPattern.risk_index                     # of the pattern under evaluation
      if risk >= HIGH_RISK_INDEX_THRESHOLD:
          hours = FAST_ESCALATION_HOURS
      else:
          hours = STANDARD_ESCALATION_HOURS
      internal_escalation_due_at = opened_at + hours

      # at begin-review:
      escalation_breached = (review_started_at > internal_escalation_due_at)
      # strict >: starting review at exactly internal_escalation_due_at is ON TIME

      # at determine, when determination == REPORTABLE:
      report_due_at = determined_at + REPORT_WINDOW_HOURS
    input_set: |
      The single HazardPattern referenced by ReportabilityEvaluation.
      hazard_pattern_id (which must be in pattern_status CONFIRMED), plus the
      logical clock.
    constants:
      HIGH_RISK_INDEX_THRESHOLD: 25.00
      FAST_ESCALATION_HOURS: 48
      STANDARD_ESCALATION_HOURS: 120
      REPORT_WINDOW_HOURS: 240
    precision: "whole hours added to an ISO-8601 UTC instant; no sub-second component"

  # ---------------------------------------------------------------- 1.3.4 ----
  - name: section_report_lateness
    trigger: |
      Runs inside POST /product-safety/section-reports/{id}/submit, writing
      SectionReport.submitted_at, days_late and late_surcharge_cents. Frozen
      thereafter: a RETURNED_FOR_INFO report that is re-submitted RECOMPUTES both
      fields against the same immutable report_due_at, so a second late
      submission can only raise the surcharge, never lower it.
    algorithm: threshold
    formula: |
      due  = ReportabilityEvaluation.report_due_at        # via SectionReport.reportability_evaluation_id
      now  = current logical UTC (submitted_at)
      late_seconds = max(0, seconds_between(due, now))
      days_late    = ceil(late_seconds / 86400)           # any part-day counts as a whole day
      if days_late == 0:
          late_surcharge_cents = 0
      else:
          late_surcharge_cents = min(days_late * SURCHARGE_PER_DAY_CENTS,
                                     SURCHARGE_CAP_CENTS)
    input_set: |
      The SectionReport's ReportabilityEvaluation (which must be in status
      REPORTABLE, so report_due_at is non-null) plus the logical clock.
    constants:
      SURCHARGE_PER_DAY_CENTS: 250000
      SURCHARGE_CAP_CENTS: 5000000
      SECONDS_PER_DAY: 86400
    precision: |
      days_late is an integer produced by CEILING (so 1 second late is 1 day
      late, 86400 seconds late is still 1 day late, and 86401 seconds is 2).
      Submitting at exactly report_due_at yields late_seconds 0, days_late 0 and
      surcharge 0 — the boundary is inclusive-on-time. Cents are integers.

  # ---------------------------------------------------------------- 1.3.5 ----
  - name: remedy_reimbursement_total
    trigger: |
      Runs inside POST /product-safety/remedy-claims, writing
      RemedyClaim.reimbursement_total_cents. Frozen at creation; voiding a claim
      does not recompute it (the stored total is what gets reversed).
    algorithm: tiered_pricing
    formula: |
      # base value per unit depends on the remedy the consumer elected
      if remedy_type == REPAIR:
          base_value = REPAIR_KIT_COST_CENTS        # unit_price_cents is IGNORED for REPAIR
      elif remedy_type == RETROFIT_KIT:
          base_value = RETROFIT_KIT_COST_CENTS      # unit_price_cents is IGNORED
      else:                                          # REFUND or REPLACE
          base_value = unit_price_cents

      # MANDATORY EVALUATION ORDER: per-unit rounding happens FIRST, then the
      # quantity multiply. Summing across units and rounding once at the end is
      # a DIFFERENT (and wrong) number whenever the fee has a fractional cent.
      per_unit_base  = base_value + shipping_cents_per_unit
      per_unit_fee   = round_half_up(per_unit_base * HANDLING_FEE_RATE, 0)
      per_unit_total = per_unit_base + per_unit_fee
      reimbursement_total_cents = per_unit_total * quantity
    input_set: |
      The single RemedyClaim's own inputs (remedy_type, quantity,
      unit_price_cents, shipping_cents_per_unit) plus the constants. remedy_type
      must be a member of the parent Recall.remedy_options array (§1.4).
    constants:
      REPAIR_KIT_COST_CENTS: 2500
      RETROFIT_KIT_COST_CENTS: 4200
      HANDLING_FEE_RATE: 0.075
    precision: |
      All money is integer cents. per_unit_fee is rounded to whole cents
      round_half_up BEFORE the quantity multiply (per-unit-first ordering); the
      final total is therefore always exactly divisible by quantity.

  # ---------------------------------------------------------------- 1.3.6 ----
  - name: recall_effectiveness_rate
    trigger: |
      Runs (a) inside POST /product-safety/progress-reports/{id}/submit, writing
      ProgressReport.effectiveness_rate and assessment, and (b) inside the
      claim_fulfilment_credit cascade (POST /product-safety/remedy-claims/{id}/
      fulfill and .../void), where the UNITS_BASIS form is used to move
      Recall.effectiveness_flag between PENDING, MET and SHORTFALL.
    algorithm: threshold
    formula: |
      numerator = Recall.units_corrected           # CUMULATIVE, not the period delta
      denominator = <see variants>
      effectiveness_rate = round_half_up(numerator * 100 / denominator, 2)

      goal = Recall.participation_goal_pct
      if effectiveness_rate >= goal:
          assessment = ON_TRACK
      elif effectiveness_rate >= round_half_up(goal * BELOW_TARGET_FRACTION, 2):
          assessment = BELOW_TARGET
      else:
          assessment = CRITICAL

      # Recall.effectiveness_flag, driven only by the UNITS_BASIS form:
      #   effectiveness_rate >= goal  -> MET
      #   otherwise                   -> PENDING while plan_status == MONITORING
      #                                  and no ProgressReport has yet been
      #                                  ACCEPTED, else SHORTFALL
    input_set: |
      Recall.units_corrected (the running total maintained by the
      claim_fulfilment_credit cascade), Recall.units_in_commerce, and the
      ProductModel reached through Recall -> SectionReport ->
      ReportabilityEvaluation -> product_model_id for units_registered.
      ProgressReport.units_corrected_in_period and cumulative_units_corrected are
      reported separately and do NOT feed the rate.
    constants:
      BELOW_TARGET_FRACTION: 0.5
      PARTICIPATION_DENOMINATOR_FLOOR: 1
    precision: |
      effectiveness_rate: 2 decimal places, round_half_up. The goal comparison is
      a non-strict >= on the rounded rate, so a rate that rounds up to exactly the
      goal counts as met.
    variants:
      - name: UNITS_BASIS
        when: "ProgressReport.effectiveness_basis == UNITS_BASIS, and always for the Recall.effectiveness_flag cascade"
        difference: |
          denominator = Recall.units_in_commerce (every unit believed to be in
          consumer hands). This is the regulator-facing correction rate.
      - name: PARTICIPATION_BASIS
        when: "ProgressReport.effectiveness_basis == PARTICIPATION_BASIS (used when the firm has registration-card coverage and reports against the reachable population)"
        difference: |
          denominator = max(PARTICIPATION_DENOMINATOR_FLOOR,
                            ProductModel.units_registered) — only the units whose
          owners are actually reachable. Because units_registered is normally far
          smaller than units_in_commerce, the SAME units_corrected yields a much
          higher rate and can flip the assessment from BELOW_TARGET to ON_TRACK.
          The floor prevents a divide-by-zero on a product with no registrations.

  # ---------------------------------------------------------------- 1.3.7 ----
  - name: civil_penalty_assessment
    trigger: |
      Runs once inside POST /product-safety/civil-penalty-cases, writing
      CivilPenaltyCase.assessed_penalty_cents (and initialising reserved_cents=0,
      available_cents=assessed_penalty_cents). Immutable thereafter — later
      offers, credits and consent agreements are all measured against this frozen
      assessment.
    algorithm: threshold
    formula: |
      base = PER_VIOLATION_CENTS * violation_count

      # severity: worst injury among the escalated incidents behind this docket
      worst = max injury_class over the input_set, by the ordering
              NO_INJURY < FIRST_AID < MEDICAL_TREATMENT < HOSPITALIZATION < FATALITY
      if worst == FATALITY:              severity_mult = FATALITY_MULT
      elif worst == HOSPITALIZATION:     severity_mult = HOSPITALIZATION_MULT
      else:                              severity_mult = BASE_SEVERITY_MULT

      # lateness: the reporting delay already measured on the section report
      lateness_mult = 1.00 + min(LATENESS_MULT_CAP,
                                 LATENESS_MULT_PER_DAY * SectionReport.days_late)

      assessed_penalty_cents = round_half_up(
          min(base * severity_mult * lateness_mult, STATUTORY_CAP_CENTS), 0)
    input_set: |
      Incident rows reached by SectionReport -> ReportabilityEvaluation ->
      hazard_pattern_id, restricted to rows with that hazard_pattern_id whose
      status == ESCALATED (i.e. the incidents the determination actually
      escalated). If that set is empty, severity_mult = BASE_SEVERITY_MULT.
      SectionReport.days_late supplies the lateness factor.
    constants:
      PER_VIOLATION_CENTS: 1000000
      BASE_SEVERITY_MULT: 1.00
      HOSPITALIZATION_MULT: 1.25
      FATALITY_MULT: 1.50
      LATENESS_MULT_PER_DAY: 0.05
      LATENESS_MULT_CAP: 0.50
      STATUTORY_CAP_CENTS: 17150000
    precision: |
      Multipliers carry 2 decimal places; the product is rounded to whole cents
      round_half_up exactly once, AFTER the statutory cap is applied via min().
      The cap is a hard ceiling, not a scaling factor.

  # ---------------------------------------------------------------- 1.3.8 ----
  - name: consent_agreement_total
    trigger: |
      Runs inside POST /product-safety/civil-penalty-cases/{id}/offer-resolution
      when resolution == ACCEPTED, writing cooperation_credit_tier,
      cooperation_credit_cents, consent_agreement_total_cents,
      compliance_program_required and reporting_obligation_months. The same
      formula runs in preview mode (writing only
      consent_agreement_preview_cents) inside POST /product-safety/
      civil-penalty-cases, inside .../offers, and inside link 4 of the
      claim_fulfilment_credit cascade.
    algorithm: tiered_pricing
    formula: |
      # SETTLEMENT BASE — this is the pinned key for the tier lookup.
      #   accepted mode: settlement_base = current_offer_cents (the offer on the table)
      #   preview mode : settlement_base = current_offer_cents if a standing offer
      #                  exists, else assessed_penalty_cents
      settlement_base = <per mode above>

      # TIER IS KEYED ON THE PRE-CREDIT settlement_base, NEVER on the post-credit
      # total. Re-keying on the discounted total is the classic error: it makes
      # the formula self-referential (the credit changes the tier which changes
      # the credit) and can oscillate forever across a tier edge. The pre-credit
      # key breaks the cycle by construction.
      if   settlement_base <  TIER_2_FLOOR_CENTS:  tier, pct = TIER_1, TIER_1_PCT
      elif settlement_base <= TIER_2_CEILING_CENTS: tier, pct = TIER_2, TIER_2_PCT
      else:                                        tier, pct = TIER_3, TIER_3_PCT

      cooperation_credit_tier = tier
      if cooperation_bonus_applied:
          pct = min(pct + COOPERATION_BONUS_PCT, MAX_CREDIT_PCT)

      cooperation_credit_cents      = round_half_up(settlement_base * pct, 0)
      consent_agreement_total_cents = settlement_base - cooperation_credit_cents

      compliance_program_required = (consent_agreement_total_cents
                                     >= COMPLIANCE_PROGRAM_FLOOR_CENTS)
      reporting_obligation_months  = (LONG_REPORTING_MONTHS
                                      if compliance_program_required
                                      else SHORT_REPORTING_MONTHS)
    input_set: |
      The single CivilPenaltyCase row: current_offer_cents (or
      assessed_penalty_cents in preview when no offer stands) and
      cooperation_bonus_applied. cooperation_bonus_applied is set to true by link
      4 of the claim_fulfilment_credit cascade and back to false when the
      triggering claim is voided, so the preview is a moving figure until the
      offer is accepted.
    constants:
      TIER_2_FLOOR_CENTS: 5000000
      TIER_2_CEILING_CENTS: 12000000
      TIER_1_PCT: 0.10
      TIER_2_PCT: 0.15
      TIER_3_PCT: 0.20
      COOPERATION_BONUS_PCT: 0.05
      MAX_CREDIT_PCT: 0.30
      COMPLIANCE_PROGRAM_FLOOR_CENTS: 5000000
      SHORT_REPORTING_MONTHS: 12
      LONG_REPORTING_MONTHS: 24
    precision: |
      Integer cents throughout; the credit is rounded once, round_half_up, and
      the total is the exact integer difference so credit + total ==
      settlement_base always holds. Tier edges: 4999999 is TIER_1, 5000000 is
      TIER_2, 12000000 is TIER_2, 12000001 is TIER_3.
    variants:
      - name: preview
        when: "POST /civil-penalty-cases, POST /civil-penalty-cases/{id}/offers, and link 4 of claim_fulfilment_credit"
        difference: |
          Writes only consent_agreement_preview_cents and leaves
          cooperation_credit_tier, cooperation_credit_cents,
          consent_agreement_total_cents, compliance_program_required and
          reporting_obligation_months untouched (null / 0). Uses
          assessed_penalty_cents as settlement_base when no offer stands.
      - name: accepted
        when: "POST /civil-penalty-cases/{id}/offer-resolution with resolution == ACCEPTED"
        difference: |
          Binds all five settlement fields for good, and additionally moves the
          reserve: reserved_cents = consent_agreement_total_cents and
          available_cents = assessed_penalty_cents - consent_agreement_total_cents,
          preserving the reserve invariant.

  # ---------------------------------------------------------------- 1.3.9 ----
  - name: recall_unit_ledger
    trigger: |
      Runs inside links 2 and 3 of the claim_fulfilment_credit cascade — POST
      /product-safety/remedy-claims/{id}/fulfill (apply) and POST
      /product-safety/remedy-claims/{id}/void (compensate) — and is read by
      POST /product-safety/progress-reports/{id}/submit to fill
      units_corrected_in_period and cumulative_units_corrected.
    algorithm: aggregation
    formula: |
      # fulfil (apply):
      Recall.units_corrected  += RemedyClaim.quantity
      Recall.units_outstanding -= RemedyClaim.quantity

      # void of a FULFILLED claim (compensate — exact inverse, same quantity):
      Recall.units_corrected  -= RemedyClaim.quantity
      Recall.units_outstanding += RemedyClaim.quantity
      # voiding a SUBMITTED or APPROVED claim moves no units (it was never
      # counted), so the ledger is untouched.

      # CONSERVED INVARIANT, checked after every write to either field:
      #   Recall.units_corrected + Recall.units_outstanding == Recall.units_in_commerce
      # units_in_commerce is immutable after Recall creation, so the pair is a
      # strict partition of a fixed total. units_corrected is never allowed to
      # exceed units_in_commerce; the §1.4 fiscal guard
      # (quantity <= units_outstanding) is what keeps it true.

      # per-period figures for a ProgressReport over [period_start, period_end]:
      units_corrected_in_period = sum(c.quantity for c in FULFILLED RemedyClaims
                                      of this recall
                                      where period_start <= c.fulfilled_at <= period_end
                                      and c.voided_at is null)
      cumulative_units_corrected = Recall.units_corrected
    input_set: |
      RemedyClaim rows of the recall. The running ledger counts only claims in
      status FULFILLED; SUBMITTED, APPROVED and VOID claims contribute zero. The
      per-period figure additionally filters on fulfilled_at inside the report's
      CLOSED [period_start, period_end] interval.
    constants:
      MIN_CLAIM_QUANTITY: 1
    precision: |
      Whole units, integer arithmetic, no rounding anywhere. Incremental
      (delta-applied) rather than recomputed from scratch, which is exactly why
      the compensating void must subtract the same stored quantity it added.

# =============================================================================
# §1.4 Validation Rules Table (evaluated in ascending priority; the FIRST
#      failing rule decides the response and no later rule is consulted)
#
#      Domain ordering rationale: this is a safety regulator, so once identity
#      and existence are settled the order is (1) state legality, (2) uniqueness
#      of the docket, (3) SAFETY / hazard-containment rules, (4) TEMPORAL
#      scheduling rules, (5) REFERENTIAL completeness of the filing package,
#      (6) administrative CONSTRAINTS, and (7) FISCAL / unit-accounting rules
#      last. A shelf full of hazardous product outranks a paperwork gap, and a
#      paperwork gap outranks a money question.
# =============================================================================
validations:

  # ---- identity ------------------------------------------------------------
  - priority: 1
    category: auth
    check: |
      X-User-Role and X-User-ID headers are both present, non-empty, and
      X-User-Role names a role declared in §1.7. An unknown role string is
      treated as unauthenticated, not as a permission failure, because the
      server cannot map it to any principal.
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: |
      The acting X-User-Role appears in the called endpoint's `roles:` list in
      §1.5.
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: all

  # ---- existence -----------------------------------------------------------
  - priority: 3
    category: existence
    check: |
      Every id in the request PATH resolves to a live row, validated
      left-to-right in path order. Emits the not-found error of the entity that
      owns the failing segment (ERR_PRODUCT_MODEL_NOT_FOUND,
      ERR_INCIDENT_NOT_FOUND, ERR_HAZARD_PATTERN_NOT_FOUND,
      ERR_EVALUATION_NOT_FOUND, ERR_SECTION_REPORT_NOT_FOUND,
      ERR_RECALL_NOT_FOUND, ERR_RETAILER_NOT_FOUND,
      ERR_RETAILER_NOTIFICATION_NOT_FOUND, ERR_AUDIT_VISIT_NOT_FOUND,
      ERR_CONSUMER_NOTICE_NOT_FOUND, ERR_REMEDY_CLAIM_NOT_FOUND,
      ERR_PROGRESS_REPORT_NOT_FOUND, ERR_PENALTY_CASE_NOT_FOUND).
    error_id: ERR_RECALL_NOT_FOUND
    http_status: 404
    applies_to: "every endpoint with a {id} path segment"

  # ---- request shape -------------------------------------------------------
  - priority: 4
    category: business_constraint
    check: |
      Request body conforms to the endpoint's `input:` contract: every
      non-optional field present and non-null; every enum value a declared
      member; every integer field an integer within its declared range; every
      money field a non-negative integer of cents; every decimal field within its
      declared scale; arrays (Recall.remedy_options) non-empty with unique
      members; every timestamp a valid ISO-8601 UTC instant; and every interval
      well ordered — HazardPattern.window_start < window_end, AuditVisit.
      window_start < window_end, ProgressReport.period_start < period_end.
      Unknown body keys and any attempt to supply a `source: computed` or
      `source: system` field are ignored silently, NOT rejected.
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all POST endpoints"

  - priority: 5
    category: existence
    check: |
      Every foreign-key id supplied in the request BODY resolves to a live row —
      product_model_id, hazard_pattern_id, duplicate_of_incident_id,
      reportability_evaluation_id, section_report_id, recall_id, retailer_id,
      retailer_notification_id. Body FKs are checked AFTER request shape so that
      a malformed payload never leaks the existence of a referenced row.
    error_id: ERR_PRODUCT_MODEL_NOT_FOUND
    http_status: 404
    applies_to: "all create endpoints that accept a FK in the body"

  # ---- scoped identity -----------------------------------------------------
  - priority: 6
    category: auth
    check: |
      RetailerRep scope: when X-User-Role == RetailerRep, X-User-ID MUST equal
      RetailerNotification.retailer_id of the notification being acted on. A
      retailer representative may only acknowledge their own stop-sale notice.
    error_id: ERR_RETAILER_SCOPE_VIOLATION
    http_status: 403
    applies_to: "POST /product-safety/retailer-notifications/{id}/acknowledge"

  - priority: 7
    category: auth
    check: |
      Segregation of duties. On POST /product-safety/recalls/{id}/approve-plan
      the acting X-User-ID MUST NOT equal Recall.submitted_by_user_id. On POST
      /product-safety/progress-reports/{id}/accept the acting X-User-ID MUST NOT
      equal ProgressReport.prepared_by_user_id. The check is on the stored
      operator id, not on the role — a SafetyDirector who personally filed the
      plan still cannot approve it.
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /product-safety/recalls/{id}/approve-plan, POST /product-safety/progress-reports/{id}/accept"

  # ---- concurrency (§1.2.1) ------------------------------------------------
  - priority: 8
    category: state
    check: |
      Optimistic concurrency. Where the endpoint declares an
      expected_<parent>_version input, that value MUST equal the parent's stored
      `version`. POST /product-safety/hazard-patterns checks
      expected_product_model_version against ProductModel.version
      (ERR_STALE_PRODUCT_MODEL_VERSION); POST /product-safety/
      civil-penalty-cases/{id}/offers checks expected_case_version against
      CivilPenaltyCase.version (ERR_STALE_PENALTY_CASE_VERSION).
    error_id: ERR_STALE_PRODUCT_MODEL_VERSION
    http_status: 412
    applies_to: "POST /product-safety/hazard-patterns, POST /product-safety/civil-penalty-cases/{id}/offers"

  # ---- own-state preconditions --------------------------------------------
  - priority: 9
    category: state
    check: |
      The target row's own state field is in the `from:` set of the §1.2
      transition the endpoint triggers. Per-entity errors, all 409:
        Incident.status         -> ERR_INCIDENT_STATE_INVALID
          (classify / dispose require INTAKE or CLASSIFIED; CLUSTERED and
           ESCALATED rows are owned by a pattern and cannot be re-touched;
           MERGED_DUPLICATE and CLOSED_NO_ACTION are terminal)
        HazardPattern.pattern_status -> ERR_PATTERN_STATE_INVALID
          (recompute / adjudicate require ANALYZED)
        ReportabilityEvaluation.status -> ERR_EVALUATION_STATE_INVALID
          (begin-review requires OPEN; determine requires IN_REVIEW)
        SectionReport.status    -> ERR_SECTION_REPORT_STATE_INVALID
          (submit requires DRAFT; review requires SUBMITTED; revise requires
           RETURNED_FOR_INFO)
        Recall.plan_status      -> ERR_RECALL_PLAN_STATE_INVALID
          (submit-plan DRAFT; approve-plan SUBMITTED; begin-monitoring APPROVED;
           close MONITORING; compliance-sweep APPROVED or MONITORING)
        RetailerNotification.status -> ERR_NOTIFICATION_STATE_INVALID
          (acknowledge requires ISSUED or DELINQUENT; verify requires
           ACKNOWLEDGED)
        AuditVisit.status       -> ERR_VISIT_STATE_INVALID   (complete requires SCHEDULED)
        ConsumerNotice.status   -> ERR_NOTICE_STATE_INVALID  (release requires SCHEDULED)
        RemedyClaim.status      -> ERR_CLAIM_STATE_INVALID
          (approve SUBMITTED; fulfill APPROVED; void APPROVED or FULFILLED)
        ProgressReport.status   -> ERR_PROGRESS_REPORT_STATE_INVALID
          (submit requires DRAFT; accept requires SUBMITTED)
        CivilPenaltyCase.status -> ERR_PENALTY_CASE_STATE_INVALID
          (an AGENCY offer requires ASSESSMENT_OPEN or COUNTERED; a RESPONDENT
           offer requires OFFER_MADE; offer-resolution requires OFFER_MADE)
      Re-firing a trigger on a row that already advanced therefore returns the
      entity's state error — these endpoints are NOT idempotent.
    error_id: ERR_RECALL_PLAN_STATE_INVALID
    http_status: 409
    applies_to: "all action (POST /.../{id}/<verb>) endpoints"

  - priority: 10
    category: state
    check: |
      Cross-entity state preconditions — the state of a DIFFERENT row than the
      one being written:
        POST /reportability-evaluations   requires HazardPattern.pattern_status
                                          == CONFIRMED  -> ERR_PATTERN_STATE_INVALID
        POST /section-reports             requires ReportabilityEvaluation.status
                                          == REPORTABLE -> ERR_EVALUATION_STATE_INVALID
        POST /recalls                     requires SectionReport.status
                                          == ACCEPTED   -> ERR_SECTION_REPORT_STATE_INVALID
        POST /civil-penalty-cases         requires SectionReport.status IN
                                          {SUBMITTED, ACCEPTED, RETURNED_FOR_INFO}
                                          -> ERR_SECTION_REPORT_STATE_INVALID
        POST /retailer-notifications      requires Recall.plan_status IN
                                          {DRAFT, SUBMITTED}   -> ERR_RECALL_PLAN_STATE_INVALID
        POST /consumer-notices            requires Recall.plan_status IN
                                          {DRAFT, SUBMITTED, APPROVED, MONITORING}
                                          -> ERR_RECALL_PLAN_STATE_INVALID
        POST /remedy-claims               requires Recall.plan_status IN
                                          {APPROVED, MONITORING} -> ERR_RECALL_PLAN_STATE_INVALID
        POST /progress-reports            requires Recall.plan_status == MONITORING
                                          -> ERR_RECALL_PLAN_STATE_INVALID
        POST /audit-visits                requires RetailerNotification.status IN
                                          {PENDING, ISSUED, DELINQUENT, ACKNOWLEDGED},
                                          i.e. anything but the terminal VERIFIED
                                          -> ERR_NOTIFICATION_STATE_INVALID
                                          (a PENDING notification passes this check
                                          and is then stopped by priority 14,
                                          because the retailer is not yet under an
                                          active stop-sale)
        POST /consumer-notices/{id}/release requires Recall.plan_status IN
                                          {APPROVED, MONITORING} -> ERR_RECALL_PLAN_STATE_INVALID
    error_id: ERR_RECALL_PLAN_STATE_INVALID
    http_status: 409
    applies_to: "all create endpoints with a parent FK, plus POST /product-safety/consumer-notices/{id}/release"

  # ---- uniqueness of the docket -------------------------------------------
  - priority: 11
    category: business_constraint
    check: |
      Docket uniqueness:
        ProductModel.model_code is globally unique -> ERR_MODEL_CODE_TAKEN (409)
        at most one non-terminal ReportabilityEvaluation (status IN {OPEN,
          IN_REVIEW}) per hazard_pattern_id -> ERR_DUPLICATE_DOCKET_ENTRY
        at most one SectionReport per reportability_evaluation_id
          -> ERR_DUPLICATE_DOCKET_ENTRY
        at most one Recall per section_report_id -> ERR_DUPLICATE_DOCKET_ENTRY
        at most one CivilPenaltyCase per section_report_id
          -> ERR_DUPLICATE_DOCKET_ENTRY
        at most one RetailerNotification per (recall_id, retailer_id) pair
          -> ERR_DUPLICATE_RETAILER_NOTIFICATION (409)
    error_id: ERR_DUPLICATE_DOCKET_ENTRY
    http_status: 409
    applies_to: "POST /product-safety/product-models, /reportability-evaluations, /section-reports, /recalls, /civil-penalty-cases, /retailer-notifications"

  # ---- SAFETY / hazard containment (outranks everything below) ------------
  - priority: 12
    category: business_safety
    check: |
      A ProductModel whose hazard_posture == FROZEN (i.e. it has at least one
      escalated incident on an open docket) cannot have its hazard pattern
      dismissed and cannot accept a new PRELIMINARY pattern that would narrow
      the evidence base. Applies to POST /hazard-patterns/{id}/adjudicate with
      decision == DISMISSED and to POST /hazard-patterns/{id}/recompute.
    error_id: ERR_MODEL_POSTURE_FROZEN
    http_status: 409
    applies_to: "POST /product-safety/hazard-patterns/{id}/adjudicate, POST /product-safety/hazard-patterns/{id}/recompute"

  - priority: 13
    category: business_safety
    check: |
      A recall cannot be closed while any retailer is still unverified:
      Recall.notification_status MUST equal SATISFIED. This is the shelf-removal
      gate and it deliberately outranks both the paperwork gate (priority 29)
      and the correction-rate gate (priority 34) — product still on a shelf is
      the most urgent unresolved fact about the recall.
    error_id: ERR_NOTIFICATION_NOT_SATISFIED
    http_status: 409
    applies_to: "POST /product-safety/recalls/{id}/close"

  - priority: 14
    category: business_safety
    check: |
      An audit visit may only be scheduled against a retailer that is actually
      under an active stop-sale: Retailer.compliance_posture MUST be IN
      {STOP_SALE_ACTIVE, DELINQUENT}. A CLEAR retailer has nothing to inspect.
    error_id: ERR_NO_ACTIVE_STOP_SALE
    http_status: 409
    applies_to: "POST /product-safety/audit-visits"

  - priority: 15
    category: business_safety
    check: |
      Shelf removal must be evidenced before a notification is verified: at
      least one AuditVisit on this retailer_notification_id with status ==
      COMPLETED and verdict == PASS must exist.
    error_id: ERR_SHELF_REMOVAL_UNVERIFIED
    http_status: 409
    applies_to: "POST /product-safety/retailer-notifications/{id}/verify"

  - priority: 16
    category: business_safety
    check: |
      A PASS verdict requires shelf_units_found == 0 exactly. One remaining unit
      is a FAIL. Conversely a FAIL verdict with shelf_units_found == 0 is also
      rejected, so the verdict can never contradict the count.
    error_id: ERR_SHELF_UNITS_PRESENT
    http_status: 422
    applies_to: "POST /product-safety/audit-visits/{id}/complete"

  - priority: 17
    category: business_safety
    check: |
      A hazard pattern may only be adjudicated CONFIRMED when its stored
      pattern_confirmed == true (incident_count >= 3 AND concentration_ratio >=
      0.6000 AND risk_index >= 10.00, all three computed at analysis time).
    error_id: ERR_PATTERN_NOT_CONFIRMABLE
    http_status: 422
    applies_to: "POST /product-safety/hazard-patterns/{id}/adjudicate"

  - priority: 18
    category: business_safety
    check: |
      The determination must be supported by the submitted scores. A
      determination of REPORTABLE requires standard_basis-appropriate support:
      for standard_basis DEFECT, defect_score >= 5; for UNREASONABLE_RISK,
      risk_score >= 5; for NONCOMPLIANCE or VOLUNTARY_STANDARD_FAILURE,
      defect_score + risk_score >= 8. A determination of NOT_REPORTABLE requires
      the mirror image — the supporting score(s) must be strictly BELOW those
      thresholds, so an analyst cannot file a no-action determination on
      evidence that meets the reporting standard.
    error_id: ERR_DETERMINATION_UNSUPPORTED
    http_status: 422
    applies_to: "POST /product-safety/reportability-evaluations/{id}/determine"

  # ---- TEMPORAL scheduling ------------------------------------------------
  - priority: 19
    category: business_temporal
    check: |
      Audit-visit windows at the SAME Retailer must not collide, using HALF-OPEN
      interval semantics [window_start, window_end) plus a travel buffer of
      AUDIT_BUFFER_HOURS = 24 on each side. Formally, the new visit conflicts
      with an existing SCHEDULED visit iff
          new.window_start < existing.window_end + 24h
        AND existing.window_start < new.window_end + 24h
      COMPLETED visits are ignored. Because the interval is half-open, a new
      window starting at EXACTLY existing.window_end + 24h does NOT conflict.
      The comparison set is every SCHEDULED AuditVisit whose
      retailer_notification_id belongs to the same retailer_id — across all
      recalls, because one inspector team covers the store, not the docket.
    error_id: ERR_AUDIT_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /product-safety/audit-visits"

  - priority: 20
    category: business_temporal
    check: |
      Progress-report periods on the same recall_id must not overlap, using
      CLOSED interval semantics [period_start, period_end] where BOTH endpoints
      are inclusive. The new period conflicts with an existing ProgressReport in
      status IN {SUBMITTED, ACCEPTED} iff
          new.period_start <= existing.period_end
        AND existing.period_start <= new.period_end
      Note the deliberate contrast with priority 19: a new period starting at
      exactly the previous period_end DOES overlap here (both endpoints
      inclusive), whereas an audit window starting at the previous window_end
      does not (half-open). DRAFT reports are excluded from the comparison set,
      so an abandoned draft never blocks a real filing.
    error_id: ERR_REPORT_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /product-safety/progress-reports"

  - priority: 21
    category: business_temporal
    check: |
      Progress-report periods must be contiguous — the monthly series may not
      skip time. Let prior = max(period_end) over ProgressReports of this recall
      in status IN {SUBMITTED, ACCEPTED}. If prior exists, new.period_start MUST
      equal prior + 24h exactly. If no such report exists, new.period_start MUST
      equal Recall.stop_sale_effective_at exactly, so the very first monthly
      period begins the instant the stop-sale took effect. Any other start is a
      reporting gap.
    error_id: ERR_REPORT_PERIOD_GAP
    http_status: 422
    applies_to: "POST /product-safety/progress-reports"

  - priority: 22
    category: business_temporal
    check: |
      A consumer notice may not be released before its scheduled_for instant:
      current logical UTC MUST be >= ConsumerNotice.scheduled_for. Releasing at
      exactly scheduled_for is allowed (non-strict).
    error_id: ERR_NOTICE_NOT_DUE
    http_status: 409
    applies_to: "POST /product-safety/consumer-notices/{id}/release"

  - priority: 23
    category: business_temporal
    check: |
      A press embargo blocks release until it lapses: if
      ConsumerNotice.embargo_until is non-null, current logical UTC MUST be >=
      embargo_until. Releasing at exactly embargo_until is allowed. Checked
      after priority 22 so a notice that is both un-due and embargoed reports the
      schedule first.
    error_id: ERR_EMBARGO_ACTIVE
    http_status: 409
    applies_to: "POST /product-safety/consumer-notices/{id}/release"

  # ---- REFERENTIAL completeness of the filing package --------------------
  - priority: 24
    category: business_referential
    check: |
      An incident may not be marked a duplicate of itself:
      duplicate_of_incident_id MUST NOT equal the incident's own id.
    error_id: ERR_SELF_DUPLICATE_REFERENCE
    http_status: 422
    applies_to: "POST /product-safety/incidents/{id}/dispose"

  - priority: 25
    category: business_referential
    check: |
      Duplicate pointers must be one hop deep — the target incident's own
      duplicate_of_incident_id MUST be null, and the target's status MUST NOT be
      MERGED_DUPLICATE. Chains of duplicates are forbidden so that every merged
      report resolves to a surviving primary in exactly one step. The target
      must also belong to the same product_model_id.
    error_id: ERR_DUPLICATE_CHAIN_FORBIDDEN
    http_status: 422
    applies_to: "POST /product-safety/incidents/{id}/dispose"

  - priority: 26
    category: business_referential
    check: |
      A remedy claim's remedy_type MUST be a member of the parent Recall's
      remedy_options array. A consumer cannot elect a remedy the firm never
      offered.
    error_id: ERR_REMEDY_OPTION_NOT_OFFERED
    http_status: 422
    applies_to: "POST /product-safety/remedy-claims"

  - priority: 27
    category: business_referential
    check: |
      A recall plan cannot be submitted without a direct-notice component: at
      least one ConsumerNotice on this recall with channel == DIRECT_NOTICE must
      exist (status SCHEDULED or RELEASED).
    error_id: ERR_DIRECT_NOTICE_REQUIRED
    http_status: 422
    applies_to: "POST /product-safety/recalls/{id}/submit-plan"

  - priority: 28
    category: business_referential
    check: |
      Monitoring cannot begin until the public has actually been told: at least
      one ConsumerNotice on this recall must be in status RELEASED.
    error_id: ERR_CONSUMER_NOTICE_NOT_RELEASED
    http_status: 409
    applies_to: "POST /product-safety/recalls/{id}/begin-monitoring"

  - priority: 29
    category: business_referential
    check: |
      A recall cannot be closed without at least one ACCEPTED ProgressReport on
      the record — the effectiveness assessment has to have been reviewed by the
      agency, not merely filed.
    error_id: ERR_PROGRESS_REPORT_REQUIRED
    http_status: 422
    applies_to: "POST /product-safety/recalls/{id}/close"

  # ---- administrative CONSTRAINTS ----------------------------------------
  - priority: 30
    category: business_constraint
    check: |
      A REGISTRATION_CARD notice can only reach registered owners:
      ConsumerNotice.reach_count MUST be <= ProductModel.units_registered of the
      model behind the recall (reached via Recall -> SectionReport ->
      ReportabilityEvaluation -> product_model_id). For channels DIRECT_NOTICE,
      PRESS_RELEASE and WEB_POSTING there is no registry ceiling.
    error_id: ERR_REACH_EXCEEDS_REGISTRY
    http_status: 422
    applies_to: "POST /product-safety/consumer-notices"

  - priority: 31
    category: business_constraint
    check: |
      Negotiation is capped at MAX_OFFER_ROUNDS = 6: a new offer requires
      CivilPenaltyCase.current_offer_round < 6. The round counter increments on
      every accepted-into-the-record offer regardless of which side made it, and
      is NOT decremented by a withdrawal — a withdrawn offer still consumed a
      round.
    error_id: ERR_NEGOTIATION_ROUNDS_EXHAUSTED
    http_status: 409
    applies_to: "POST /product-safety/civil-penalty-cases/{id}/offers"

  # ---- FISCAL / unit accounting (last) -----------------------------------
  - priority: 32
    category: business_fiscal
    check: |
      An offer may not exceed the frozen assessment: amount_cents MUST be <=
      CivilPenaltyCase.assessed_penalty_cents. Equality is allowed (a full-value
      agency offer).
    error_id: ERR_OFFER_EXCEEDS_ASSESSMENT
    http_status: 422
    applies_to: "POST /product-safety/civil-penalty-cases/{id}/offers"

  - priority: 33
    category: business_fiscal
    check: |
      A remedy claim may not promise more units than remain uncorrected:
      quantity MUST be <= Recall.units_outstanding. This is the guard that keeps
      the conserved ledger invariant (units_corrected + units_outstanding ==
      units_in_commerce) true, since fulfilment moves the quantity across the
      partition. Deliberately the LOWEST-priority family: on POST /remedy-claims
      a recall in the wrong plan_status reports the state error (priority 10)
      even when the quantity is also impossible.
    error_id: ERR_UNITS_OUTSTANDING_EXCEEDED
    http_status: 422
    applies_to: "POST /product-safety/remedy-claims"

  - priority: 34
    category: business_fiscal
    check: |
      A recall cannot be closed until its correction rate reached the
      participation goal: Recall.effectiveness_flag MUST equal MET.
    error_id: ERR_EFFECTIVENESS_NOT_MET
    http_status: 409
    applies_to: "POST /product-safety/recalls/{id}/close"

# =============================================================================
# §1.5 API Endpoint Table
#
#   api_prefix is /product-safety for every business endpoint. The single
#   test-driving endpoint lives outside the prefix under /_clock.
#
#   Read surface: one single-resource GET per entity (13) plus one filtered
#   collection GET per FK-bearing entity (11). Every filtered list collapses ALL
#   of that entity's foreign keys into one endpoint, which is how a
#   cascade-created or cascade-mutated row (a RetailerNotification flipped to
#   ISSUED by the approval cascade, an Incident flipped to ESCALATED by the
#   determination cascade) is discovered — no creation response ever contains it.
#
#   Every list endpoint accepts limit? and offset? (per the §1.0 envelope) and returns rows ordered
#   created_at ASC (stable, never by id).
# =============================================================================
endpoints:

  # ----------------------------- test-driving ------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: |
      Sets the server's logical UTC clock to an arbitrary instant. Every deadline,
      window, embargo and lateness rule in this scaffold reads this clock and
      never the host wall clock. STARTUP DEFAULT: before any call to this
      endpoint the logical clock reads exactly 2026-08-01T00:00:00Z and MUST NOT
      fall back to real wall-clock time. The clock may be moved forward or
      backward freely; it never advances on its own between requests.
    roles: [ProgramAdmin]
    code: 200
    input: [to_iso8601]
    output: "{current_utc: string}"
    side_effects:
      - "replaces the logical clock value; no stored row is recomputed as a result"

  # ----------------------------- reads: ProductModel ----------------------
  - method: GET
    path: "/product-safety/product-models/{id}"
    description: "Fetch one product model, including the computed hazard_posture and open_escalation_count."
    roles: [ProgramAdmin, IntakeSpecialist, ComplianceOfficer, SafetyDirector, FieldAuditor, PenaltyCounsel]
    code: 200
    input: []
    output: ProductModel
    side_effects: []

  # ----------------------------- reads: Incident --------------------------
  - method: GET
    path: "/product-safety/incidents/{id}"
    description: "Fetch one incident report with its classification, severity_weight and escalation_deadline_at."
    roles: [ProgramAdmin, IntakeSpecialist, ComplianceOfficer, SafetyDirector, PenaltyCounsel]
    code: 200
    input: []
    output: Incident
    side_effects: []

  - method: GET
    path: "/product-safety/incidents"
    description: |
      Filtered incident list. Reverse-reachability channel for all three Incident
      foreign keys: product_model_id, hazard_pattern_id (the only way to see which
      incidents a pattern clustered, since clustering happens as a cascade) and
      duplicate_of_incident_id (the merged-duplicate children of a surviving
      primary).
    roles: [ProgramAdmin, IntakeSpecialist, ComplianceOfficer, SafetyDirector, PenaltyCounsel]
    code: 200
    input: ["product_model_id?", "hazard_pattern_id?", "duplicate_of_incident_id?", "status?", "injury_class?", "hazard_code?", "limit?", "offset?"]
    output: Incident[]
    side_effects: []

  # ----------------------------- reads: HazardPattern ---------------------
  - method: GET
    path: "/product-safety/hazard-patterns/{id}"
    description: "Fetch one hazard pattern with its frozen analysis snapshot (incident_count, severity_sum, dominant_hazard_code, concentration_ratio, exposure_per_10k, risk_index, pattern_confirmed)."
    roles: [ProgramAdmin, IntakeSpecialist, ComplianceOfficer, SafetyDirector, PenaltyCounsel]
    code: 200
    input: []
    output: HazardPattern
    side_effects: []

  - method: GET
    path: "/product-safety/hazard-patterns"
    description: "Filtered hazard-pattern list; reverse-reachability channel for HazardPattern.product_model_id."
    roles: [ProgramAdmin, IntakeSpecialist, ComplianceOfficer, SafetyDirector, PenaltyCounsel]
    code: 200
    input: ["product_model_id?", "pattern_status?", "analysis_basis?", "limit?", "offset?"]
    output: HazardPattern[]
    side_effects: []

  # ----------------------------- reads: ReportabilityEvaluation -----------
  - method: GET
    path: "/product-safety/reportability-evaluations/{id}"
    description: "Fetch one reportability evaluation with its escalation deadline, breach flag and report_due_at."
    roles: [ProgramAdmin, ComplianceOfficer, SafetyDirector, PenaltyCounsel]
    code: 200
    input: []
    output: ReportabilityEvaluation
    side_effects: []

  - method: GET
    path: "/product-safety/reportability-evaluations"
    description: "Filtered evaluation list; reverse-reachability channel for both ReportabilityEvaluation.hazard_pattern_id and .product_model_id."
    roles: [ProgramAdmin, ComplianceOfficer, SafetyDirector, PenaltyCounsel]
    code: 200
    input: ["hazard_pattern_id?", "product_model_id?", "status?", "standard_basis?", "escalation_breached?", "limit?", "offset?"]
    output: ReportabilityEvaluation[]
    side_effects: []

  # ----------------------------- reads: SectionReport ---------------------
  - method: GET
    path: "/product-safety/section-reports/{id}"
    description: "Fetch one filed report with its lateness figures (submitted_at, days_late, late_surcharge_cents)."
    roles: [ProgramAdmin, ComplianceOfficer, SafetyDirector, PenaltyCounsel]
    code: 200
    input: []
    output: SectionReport
    side_effects: []

  - method: GET
    path: "/product-safety/section-reports"
    description: "Filtered report list; reverse-reachability channel for SectionReport.reportability_evaluation_id."
    roles: [ProgramAdmin, ComplianceOfficer, SafetyDirector, PenaltyCounsel]
    code: 200
    input: ["reportability_evaluation_id?", "status?", "corrective_action_type?", "limit?", "offset?"]
    output: SectionReport[]
    side_effects: []

  # ----------------------------- reads: Recall ----------------------------
  - method: GET
    path: "/product-safety/recalls/{id}"
    description: "Fetch one recall with both state dimensions (plan_status, notification_status), the unit ledger (units_corrected, units_outstanding) and effectiveness_flag."
    roles: [ProgramAdmin, ComplianceOfficer, SafetyDirector, FieldAuditor, PenaltyCounsel, RetailerRep]
    code: 200
    input: []
    output: Recall
    side_effects: []

  - method: GET
    path: "/product-safety/recalls"
    description: "Filtered recall list; reverse-reachability channel for Recall.section_report_id."
    roles: [ProgramAdmin, ComplianceOfficer, SafetyDirector, FieldAuditor, PenaltyCounsel]
    code: 200
    input: ["section_report_id?", "plan_status?", "notification_status?", "effectiveness_flag?", "limit?", "offset?"]
    output: Recall[]
    side_effects: []

  # ----------------------------- reads: Retailer --------------------------
  - method: GET
    path: "/product-safety/retailers/{id}"
    description: "Fetch one retailer with compliance_posture and the derived counters open_stop_sale_count, verified_removal_count and delinquent_count."
    roles: [ProgramAdmin, ComplianceOfficer, SafetyDirector, FieldAuditor, RetailerRep]
    code: 200
    input: []
    output: Retailer
    side_effects: []

  # ----------------------------- reads: RetailerNotification --------------
  - method: GET
    path: "/product-safety/retailer-notifications/{id}"
    description: "Fetch one stop-sale notification with ack_due_at, acknowledged_at, verified_at and units_on_shelf_reported."
    roles: [ProgramAdmin, ComplianceOfficer, SafetyDirector, FieldAuditor, RetailerRep]
    code: 200
    input: []
    output: RetailerNotification
    side_effects: []

  - method: GET
    path: "/product-safety/retailer-notifications"
    description: |
      Filtered notification list; reverse-reachability channel for both
      RetailerNotification.recall_id and .retailer_id. This is the only way to
      observe the PENDING -> ISSUED flips performed by the plan_approval_stop_sale
      cascade and the ISSUED -> DELINQUENT flips performed by a compliance sweep.
    roles: [ProgramAdmin, ComplianceOfficer, SafetyDirector, FieldAuditor, RetailerRep]
    code: 200
    input: ["recall_id?", "retailer_id?", "status?", "stop_sale_required?", "limit?", "offset?"]
    output: RetailerNotification[]
    side_effects: []

  # ----------------------------- reads: AuditVisit ------------------------
  - method: GET
    path: "/product-safety/audit-visits/{id}"
    description: "Fetch one shelf-removal audit visit with its window, verdict and shelf_units_found."
    roles: [ProgramAdmin, ComplianceOfficer, SafetyDirector, FieldAuditor]
    code: 200
    input: []
    output: AuditVisit
    side_effects: []

  - method: GET
    path: "/product-safety/audit-visits"
    description: "Filtered audit-visit list; reverse-reachability channel for AuditVisit.retailer_notification_id."
    roles: [ProgramAdmin, ComplianceOfficer, SafetyDirector, FieldAuditor]
    code: 200
    input: ["retailer_notification_id?", "status?", "verdict?", "limit?", "offset?"]
    output: AuditVisit[]
    side_effects: []

  # ----------------------------- reads: ConsumerNotice --------------------
  - method: GET
    path: "/product-safety/consumer-notices/{id}"
    description: "Fetch one consumer notice with its channel, schedule, embargo and released_at."
    roles: [ProgramAdmin, ComplianceOfficer, SafetyDirector]
    code: 200
    input: []
    output: ConsumerNotice
    side_effects: []

  - method: GET
    path: "/product-safety/consumer-notices"
    description: "Filtered notice list; reverse-reachability channel for ConsumerNotice.recall_id. Also the only channel that shows RELEASED -> SUPERSEDED flips caused by a later notice on the same channel."
    roles: [ProgramAdmin, ComplianceOfficer, SafetyDirector]
    code: 200
    input: ["recall_id?", "channel?", "status?", "limit?", "offset?"]
    output: ConsumerNotice[]
    side_effects: []

  # ----------------------------- reads: RemedyClaim -----------------------
  - method: GET
    path: "/product-safety/remedy-claims/{id}"
    description: "Fetch one remedy claim with its frozen reimbursement_total_cents, fulfilled_at and voided_at."
    roles: [ProgramAdmin, ComplianceOfficer, SafetyDirector, PenaltyCounsel]
    code: 200
    input: []
    output: RemedyClaim
    side_effects: []

  - method: GET
    path: "/product-safety/remedy-claims"
    description: "Filtered claim list; reverse-reachability channel for RemedyClaim.recall_id."
    roles: [ProgramAdmin, ComplianceOfficer, SafetyDirector, PenaltyCounsel]
    code: 200
    input: ["recall_id?", "status?", "remedy_type?", "limit?", "offset?"]
    output: RemedyClaim[]
    side_effects: []

  # ----------------------------- reads: ProgressReport --------------------
  - method: GET
    path: "/product-safety/progress-reports/{id}"
    description: "Fetch one monthly progress report with effectiveness_rate and assessment."
    roles: [ProgramAdmin, ComplianceOfficer, SafetyDirector, PenaltyCounsel]
    code: 200
    input: []
    output: ProgressReport
    side_effects: []

  - method: GET
    path: "/product-safety/progress-reports"
    description: "Filtered progress-report list; reverse-reachability channel for ProgressReport.recall_id."
    roles: [ProgramAdmin, ComplianceOfficer, SafetyDirector, PenaltyCounsel]
    code: 200
    input: ["recall_id?", "status?", "effectiveness_basis?", "assessment?", "limit?", "offset?"]
    output: ProgressReport[]
    side_effects: []

  # ----------------------------- reads: CivilPenaltyCase ------------------
  - method: GET
    path: "/product-safety/civil-penalty-cases/{id}"
    description: |
      Fetch one penalty docket: the frozen assessed_penalty_cents, the reserve
      pair (reserved_cents, available_cents), the standing offer
      (current_offer_round, current_offer_cents, current_offer_by), the
      cooperation state (cooperation_bonus_applied, cooperation_credit_tier,
      cooperation_credit_cents) and the settlement figures
      (consent_agreement_preview_cents, consent_agreement_total_cents,
      compliance_program_required, reporting_obligation_months).
    roles: [ProgramAdmin, SafetyDirector, PenaltyCounsel]
    code: 200
    input: []
    output: CivilPenaltyCase
    side_effects: []

  - method: GET
    path: "/product-safety/civil-penalty-cases"
    description: "Filtered penalty-case list; reverse-reachability channel for CivilPenaltyCase.section_report_id."
    roles: [ProgramAdmin, SafetyDirector, PenaltyCounsel]
    code: 200
    input: ["section_report_id?", "status?", "cooperation_credit_tier?", "cooperation_bonus_applied?", "limit?", "offset?"]
    output: CivilPenaltyCase[]
    side_effects: []

  # ======================= writes: intake & analysis =======================
  - method: POST
    path: "/product-safety/product-models"
    description: "Register a product model in the safety docket. hazard_posture starts MONITORED and open_escalation_count starts 0; neither can be supplied."
    roles: [ProgramAdmin]
    code: 201
    input: [model_code, brand, category, units_distributed, units_registered]
    output: ProductModel
    side_effects:
      - "creates ProductModel with hazard_posture=MONITORED, open_escalation_count=0, version=1"
      - "rejects a duplicate model_code with ERR_MODEL_CODE_TAKEN"

  - method: POST
    path: "/product-safety/incidents"
    description: "Intake a consumer incident or complaint. Lands in status INTAKE with no injury classification yet; severity_weight is 0.00 until classified."
    roles: [IntakeSpecialist, ComplianceOfficer]
    code: 201
    input: [product_model_id, report_channel, incident_date, narrative]
    output: Incident
    side_effects:
      - "creates Incident with status=INTAKE, severity_weight=0.00, injury_verified=false, hazard_pattern_id=null, duplicate_of_incident_id=null"

  - method: POST
    path: "/product-safety/incidents/{id}/classify"
    description: |
      Assign or revise the injury classification and hazard code. Runs the
      incident_severity_weight calculation. Legal from INTAKE (first
      classification) and from CLASSIFIED (reclassification self-loop); a
      CLUSTERED or ESCALATED incident is owned by a hazard pattern and is frozen.
    roles: [IntakeSpecialist, ComplianceOfficer]
    code: 200
    input: [injury_class, hazard_code, injury_verified]
    output: Incident
    side_effects:
      - "sets injury_class, hazard_code, injury_verified, classified_at = current logical UTC"
      - "recomputes Incident.severity_weight per §1.3 incident_severity_weight"
      - "status INTAKE -> CLASSIFIED, or CLASSIFIED -> CLASSIFIED"
      - "does NOT retro-update any existing HazardPattern snapshot"

  - method: POST
    path: "/product-safety/incidents/{id}/dispose"
    description: |
      Close an incident without escalation. disposition == MERGED_DUPLICATE
      requires duplicate_of_incident_id and folds this report into a surviving
      primary; disposition == CLOSED_NO_ACTION requires duplicate_of_incident_id
      to be absent.
    roles: [IntakeSpecialist, ComplianceOfficer]
    code: 200
    input: [disposition, "duplicate_of_incident_id?", "note?"]
    output: Incident
    side_effects:
      - "status -> MERGED_DUPLICATE or CLOSED_NO_ACTION (both terminal)"
      - "on MERGED_DUPLICATE, sets duplicate_of_incident_id after the §1.4 priority-24 and priority-25 pointer checks"
      - "the incident leaves every future hazard-pattern input set"

  - method: POST
    path: "/product-safety/hazard-patterns"
    description: |
      Run a hazard pattern analysis over a closed incident-date window and freeze
      the snapshot. Carries the OCC guard expected_product_model_version because
      the analysis is a claim about a specific version of the model's distribution
      figures (units_distributed feeds exposure_per_10k).
    roles: [ComplianceOfficer, SafetyDirector]
    code: 201
    input: [product_model_id, window_start, window_end, analysis_basis, expected_product_model_version]
    output: HazardPattern
    side_effects:
      - "runs §1.3 hazard_pattern_risk_index in the requested analysis_basis variant and freezes incident_count, severity_sum, dominant_hazard_code, concentration_ratio, exposure_per_10k, risk_index, pattern_confirmed, analyzed_at"
      - "creates HazardPattern with pattern_status=ANALYZED"
      - "sets hazard_pattern_id and status=CLUSTERED on every qualifying incident, processed created_at ASC; an incident already CLUSTERED to an older pattern is re-pointed to this one"
      - "increments ProductModel.version by 1"
      - "rejects a stale expected_product_model_version with ERR_STALE_PRODUCT_MODEL_VERSION (412)"

  - method: POST
    path: "/product-safety/hazard-patterns/{id}/recompute"
    description: |
      Re-run the analysis on an ANALYZED pattern, optionally switching
      analysis_basis or moving the window, and overwrite the snapshot in place.
      Blocked when the ProductModel is FROZEN, because narrowing the evidence base
      under an open escalation is not permitted.
    roles: [ComplianceOfficer, SafetyDirector]
    code: 200
    input: ["analysis_basis?", "window_start?", "window_end?"]
    output: HazardPattern
    side_effects:
      - "re-runs §1.3 hazard_pattern_risk_index and overwrites the snapshot fields and analyzed_at"
      - "pattern_status ANALYZED -> ANALYZED (self-loop)"
      - "re-clusters the qualifying incident set; incidents dropped from the set return to CLASSIFIED with hazard_pattern_id=null"

  - method: POST
    path: "/product-safety/hazard-patterns/{id}/adjudicate"
    description: |
      Branch endpoint. decision == CONFIRMED promotes the pattern for reportability
      review (requires pattern_confirmed == true). decision == DISMISSED closes it
      and releases its incidents (blocked when the model is FROZEN). decision ==
      SUPERSEDED is reserved for the system and is rejected here.
    roles: [ComplianceOfficer, SafetyDirector]
    code: 200
    input: [decision, "note?"]
    output: HazardPattern
    side_effects:
      - "CONFIRMED: pattern_status ANALYZED -> CONFIRMED; the pattern becomes eligible for a ReportabilityEvaluation"
      - "DISMISSED: pattern_status ANALYZED -> DISMISSED; every CLUSTERED incident on this pattern returns to CLASSIFIED with hazard_pattern_id=null, processed created_at ASC"
      - "sets ProductModel.hazard_posture=RESTRICTED on CONFIRMED when the posture is still MONITORED"

  # ======================= writes: reportability & filing =================
  - method: POST
    path: "/product-safety/reportability-evaluations"
    description: |
      Open a reportability evaluation against a CONFIRMED hazard pattern under one
      of the four statutory standards. Copies product_model_id off the pattern and
      derives the internal escalation deadline from the pattern's risk_index.
    roles: [ComplianceOfficer, SafetyDirector]
    code: 201
    input: [hazard_pattern_id, standard_basis]
    output: ReportabilityEvaluation
    side_effects:
      - "creates ReportabilityEvaluation with status=OPEN, opened_at = current logical UTC, escalation_breached=false, product_model_id copied from the pattern"
      - "runs §1.3 evaluation_escalation_window to set internal_escalation_due_at (48h when risk_index >= 25.00, else 120h)"
      - "rejects a second non-terminal evaluation on the same pattern with ERR_DUPLICATE_DOCKET_ENTRY"

  - method: POST
    path: "/product-safety/reportability-evaluations/{id}/begin-review"
    description: "Start the internal review and record whether the escalation deadline was breached. Starting at exactly internal_escalation_due_at is on time."
    roles: [ComplianceOfficer, SafetyDirector]
    code: 200
    input: []
    output: ReportabilityEvaluation
    side_effects:
      - "status OPEN -> IN_REVIEW; review_started_at = current logical UTC"
      - "sets escalation_breached = (review_started_at > internal_escalation_due_at), strict greater-than"

  - method: POST
    path: "/product-safety/reportability-evaluations/{id}/determine"
    description: |
      Branch endpoint that closes the evaluation. determination == REPORTABLE
      starts the 240-hour report clock and escalates the pattern's incidents;
      determination == NOT_REPORTABLE closes the docket with no downstream filing.
      Both branches enforce §1.4 priority 18 (score support).
    roles: [ComplianceOfficer, SafetyDirector]
    code: 200
    input: [determination, defect_score, risk_score, determination_note]
    output: ReportabilityEvaluation
    side_effects:
      - "status IN_REVIEW -> REPORTABLE or NOT_REPORTABLE; determined_at = current logical UTC"
      - "REPORTABLE: report_due_at = determined_at + 240h"
      - "REPORTABLE: every CLUSTERED incident on the pattern moves to ESCALATED with escalation_deadline_at = determined_at + 120h, processed created_at ASC"
      - "REPORTABLE: ProductModel.open_escalation_count = count of its ESCALATED incidents and hazard_posture -> FROZEN"
      - "NOT_REPORTABLE: incidents stay CLUSTERED; report_due_at stays null"

  - method: POST
    path: "/product-safety/section-reports"
    description: "Draft the statutory report with its corrective action proposal. Requires the evaluation to be REPORTABLE."
    roles: [ComplianceOfficer, SafetyDirector]
    code: 201
    input: [reportability_evaluation_id, corrective_action_type, corrective_action_summary]
    output: SectionReport
    side_effects:
      - "creates SectionReport with status=DRAFT, days_late=0, late_surcharge_cents=0"
      - "rejects a second report on the same evaluation with ERR_DUPLICATE_DOCKET_ENTRY"

  - method: POST
    path: "/product-safety/section-reports/{id}/submit"
    description: "File the report and score its lateness against the evaluation's report_due_at. Submitting at exactly report_due_at is on time (days_late 0, surcharge 0)."
    roles: [ComplianceOfficer, SafetyDirector]
    code: 200
    input: []
    output: SectionReport
    side_effects:
      - "status DRAFT -> SUBMITTED; submitted_at = current logical UTC"
      - "runs §1.3 section_report_lateness to set days_late and late_surcharge_cents"

  - method: POST
    path: "/product-safety/section-reports/{id}/review"
    description: "Branch endpoint. decision == ACCEPTED clears the report for recall planning; decision == RETURNED_FOR_INFO sends it back for revision."
    roles: [SafetyDirector]
    code: 200
    input: [decision, "note?"]
    output: SectionReport
    side_effects:
      - "status SUBMITTED -> ACCEPTED or SUBMITTED -> RETURNED_FOR_INFO; reviewed_at = current logical UTC"

  - method: POST
    path: "/product-safety/section-reports/{id}/revise"
    description: "Return a RETURNED_FOR_INFO report to DRAFT, optionally amending the corrective action proposal. The lateness figures survive and are re-scored on the next submit."
    roles: [ComplianceOfficer, SafetyDirector]
    code: 200
    input: ["corrective_action_type?", "corrective_action_summary?"]
    output: SectionReport
    side_effects:
      - "status RETURNED_FOR_INFO -> DRAFT; submitted_at reset to null while days_late and late_surcharge_cents keep their previous values until the next submit recomputes them"

  # ======================= writes: recall plan ============================
  - method: POST
    path: "/product-safety/recalls"
    description: "Open a recall plan against an ACCEPTED section report: remedy menu, population in commerce, participation goal and correction deadline."
    roles: [ComplianceOfficer, SafetyDirector]
    code: 201
    input: [section_report_id, remedy_options, units_in_commerce, participation_goal_pct, correction_deadline_at]
    output: Recall
    side_effects:
      - "creates Recall with plan_status=DRAFT, notification_status=NOT_STARTED, units_corrected=0, units_outstanding=units_in_commerce, effectiveness_flag=PENDING, stop_sale_effective_at=null, submitted_by_user_id=null, last_accepted_period_end=null"
      - "rejects a second recall on the same section report with ERR_DUPLICATE_DOCKET_ENTRY"

  - method: POST
    path: "/product-safety/recalls/{id}/submit-plan"
    description: |
      Submit the recall plan for approval. Records the acting X-User-ID as
      submitted_by_user_id, which is what the segregation-of-duties check on
      approve-plan later compares against. Requires at least one DIRECT_NOTICE
      consumer notice to already exist.
    roles: [ComplianceOfficer, SafetyDirector]
    code: 200
    input: []
    output: Recall
    side_effects:
      - "plan_status DRAFT -> SUBMITTED"
      - "sets submitted_by_user_id = acting X-User-ID"

  - method: POST
    path: "/product-safety/recalls/{id}/approve-plan"
    description: |
      Approve the plan and fire the plan_approval_stop_sale cascade (§1.2, depth
      3). The acting X-User-ID must differ from submitted_by_user_id.
    roles: [SafetyDirector]
    code: 200
    input: []
    output: Recall
    side_effects:
      - "link 1: plan_status SUBMITTED -> APPROVED; stop_sale_effective_at = current logical UTC"
      - "link 2: every PENDING RetailerNotification on this recall -> ISSUED with stop_sale_required=true, issued_at = stop_sale_effective_at and ack_due_at = issued_at + 72h, processed created_at ASC"
      - "link 2b: notification_status NOT_STARTED -> IN_PROGRESS when link 2 flipped at least one notification"
      - "link 3: for each notification flipped, Retailer.open_stop_sale_count += 1 and Retailer.compliance_posture -> STOP_SALE_ACTIVE"

  - method: POST
    path: "/product-safety/recalls/{id}/begin-monitoring"
    description: "Move an APPROVED recall into the monitoring phase. Requires at least one RELEASED consumer notice — the public must already have been told."
    roles: [SafetyDirector]
    code: 200
    input: []
    output: Recall
    side_effects:
      - "plan_status APPROVED -> MONITORING"

  - method: POST
    path: "/product-safety/recalls/{id}/compliance-sweep"
    description: |
      Sweep the recall's retailer notifications and mark every ISSUED notification
      whose ack_due_at has passed as DELINQUENT. Idempotent in the sense that a
      second sweep with no newly overdue notification changes nothing, but it is
      still a 200 (it is a query-and-mark operation, not a state transition on the
      recall itself).
    roles: [SafetyDirector, ComplianceOfficer]
    code: 200
    input: []
    output: Recall
    side_effects:
      - "every ISSUED RetailerNotification with ack_due_at < current logical UTC -> DELINQUENT, processed created_at ASC"
      - "for each flipped notification, Retailer.delinquent_count += 1 and Retailer.compliance_posture -> DELINQUENT"
      - "notification_status IN_PROGRESS -> DEFICIENT when at least one notification was flipped"

  - method: POST
    path: "/product-safety/recalls/{id}/close"
    description: |
      Close the recall. Gated by four independent checks in this priority order:
      plan_status == MONITORING (9), notification_status == SATISFIED (13), at
      least one ACCEPTED ProgressReport (29), effectiveness_flag == MET (34).
    roles: [SafetyDirector]
    code: 200
    input: []
    output: Recall
    side_effects:
      - "plan_status MONITORING -> CLOSED (terminal)"
      - "sets ProductModel.open_escalation_count = 0 and hazard_posture -> MONITORED when this recall was the model's last open escalation source"

  # ======================= writes: retailer channel =======================
  - method: POST
    path: "/product-safety/retailers"
    description: "Register a retailer or distributor. compliance_posture starts CLEAR and all three counters start 0."
    roles: [ProgramAdmin]
    code: 201
    input: [name, channel_type, store_count]
    output: Retailer
    side_effects:
      - "creates Retailer with compliance_posture=CLEAR, open_stop_sale_count=0, verified_removal_count=0, delinquent_count=0"

  - method: POST
    path: "/product-safety/retailer-notifications"
    description: |
      Enroll a retailer in the recall's stop-sale distribution list. Only legal
      while the plan is still DRAFT or SUBMITTED: a notification created after
      approval would never be reached by the plan_approval_stop_sale cascade and
      would sit in PENDING forever.
    roles: [ComplianceOfficer, SafetyDirector]
    code: 201
    input: [recall_id, retailer_id, "stop_sale_required?"]
    output: RetailerNotification
    side_effects:
      - "creates RetailerNotification with status=PENDING, issued_at=null, ack_due_at=null, units_on_shelf_reported=null"
      - "rejects a second notification for the same (recall_id, retailer_id) with ERR_DUPLICATE_RETAILER_NOTIFICATION"

  - method: POST
    path: "/product-safety/retailer-notifications/{id}/acknowledge"
    description: |
      The retailer acknowledges the stop-sale order and reports how many units it
      still holds on shelf. Legal from ISSUED (on time) and from DELINQUENT (late
      acknowledgement). When acting as RetailerRep, X-User-ID must equal
      retailer_id.
    roles: [RetailerRep, ComplianceOfficer]
    code: 200
    input: [units_on_shelf_reported]
    output: RetailerNotification
    side_effects:
      - "status ISSUED -> ACKNOWLEDGED or DELINQUENT -> ACKNOWLEDGED; acknowledged_at = current logical UTC"
      - "when the previous status was DELINQUENT, Retailer.delinquent_count -= 1 and compliance_posture returns to STOP_SALE_ACTIVE if open_stop_sale_count > 0 else CLEAR"
      - "Recall.notification_status DEFICIENT -> IN_PROGRESS when this cleared the recall's last DELINQUENT notification"

  - method: POST
    path: "/product-safety/retailer-notifications/{id}/verify"
    description: "Verify shelf removal. Requires an existing COMPLETED AuditVisit with verdict PASS on this notification (§1.4 priority 15)."
    roles: [SafetyDirector, FieldAuditor]
    code: 200
    input: []
    output: RetailerNotification
    side_effects:
      - "status ACKNOWLEDGED -> VERIFIED (terminal); verified_at = current logical UTC"
      - "Retailer.open_stop_sale_count -= 1 and verified_removal_count += 1; compliance_posture -> CLEAR when open_stop_sale_count reaches 0 and delinquent_count == 0"
      - "Recall.notification_status IN_PROGRESS -> SATISFIED when this was the recall's last non-VERIFIED notification"

  - method: POST
    path: "/product-safety/audit-visits"
    description: |
      Schedule a shelf-removal inspection window. Windows are HALF-OPEN
      [window_start, window_end) and must clear every other SCHEDULED visit at the
      same retailer by a 24-hour travel buffer on each side (§1.4 priority 19).
    roles: [FieldAuditor, SafetyDirector]
    code: 201
    input: [retailer_notification_id, window_start, window_end]
    output: AuditVisit
    side_effects:
      - "creates AuditVisit with status=SCHEDULED, verdict=PENDING, shelf_units_found=null"

  - method: POST
    path: "/product-safety/audit-visits/{id}/complete"
    description: "Record the inspection result. A PASS verdict requires shelf_units_found == 0 exactly; a FAIL verdict requires shelf_units_found > 0."
    roles: [FieldAuditor]
    code: 200
    input: [verdict, shelf_units_found]
    output: AuditVisit
    side_effects:
      - "status SCHEDULED -> COMPLETED (terminal); completed_at = current logical UTC; verdict PENDING -> PASS or FAIL"
      - "a PASS visit is what later unlocks POST /product-safety/retailer-notifications/{id}/verify"

  # ======================= writes: consumer channel ======================
  - method: POST
    path: "/product-safety/consumer-notices"
    description: |
      Schedule a consumer notification on one channel. embargo_until is optional
      and only meaningful for PRESS_RELEASE. A REGISTRATION_CARD notice may not
      claim a reach_count above the model's units_registered (§1.4 priority 30).
    roles: [ComplianceOfficer, SafetyDirector]
    code: 201
    input: [recall_id, channel, scheduled_for, reach_count, "embargo_until?"]
    output: ConsumerNotice
    side_effects:
      - "creates ConsumerNotice with status=SCHEDULED, released_at=null"

  - method: POST
    path: "/product-safety/consumer-notices/{id}/release"
    description: "Publish the notice. Requires the recall to be APPROVED or MONITORING, the clock to have reached scheduled_for (priority 22) and any embargo to have lapsed (priority 23)."
    roles: [ComplianceOfficer, SafetyDirector]
    code: 200
    input: []
    output: ConsumerNotice
    side_effects:
      - "status SCHEDULED -> RELEASED; released_at = current logical UTC"
      - "every previously RELEASED ConsumerNotice on the same recall_id and channel -> SUPERSEDED, processed created_at ASC"

  # ======================= writes: remedy ledger =========================
  - method: POST
    path: "/product-safety/remedy-claims"
    description: |
      Register a consumer remedy claim against an APPROVED or MONITORING recall.
      Runs the remedy_reimbursement_total calculation with per-unit-first rounding.
      quantity may not exceed the recall's units_outstanding (§1.4 priority 33).
    roles: [ComplianceOfficer]
    code: 201
    input: [recall_id, consumer_ref, remedy_type, quantity, unit_price_cents, shipping_cents_per_unit]
    output: RemedyClaim
    side_effects:
      - "creates RemedyClaim with status=SUBMITTED, fulfilled_at=null, voided_at=null"
      - "runs §1.3 remedy_reimbursement_total to freeze reimbursement_total_cents"
      - "does NOT move Recall.units_corrected or units_outstanding — only fulfilment does"

  - method: POST
    path: "/product-safety/remedy-claims/{id}/approve"
    description: "Approve the claim for fulfilment. No units move yet."
    roles: [ComplianceOfficer, SafetyDirector]
    code: 200
    input: []
    output: RemedyClaim
    side_effects:
      - "status SUBMITTED -> APPROVED"

  - method: POST
    path: "/product-safety/remedy-claims/{id}/fulfill"
    description: "Fulfil the claim and fire the claim_fulfilment_credit cascade (§1.2, depth 4)."
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: RemedyClaim
    side_effects:
      - "link 1: status APPROVED -> FULFILLED; fulfilled_at = current logical UTC"
      - "link 2: Recall.units_corrected += quantity and units_outstanding -= quantity (§1.3 recall_unit_ledger)"
      - "link 3: re-runs §1.3 recall_effectiveness_rate on the UNITS_BASIS variant; effectiveness_flag PENDING -> MET when the rate reaches participation_goal_pct"
      - "link 4: when link 3 produced MET, the CivilPenaltyCase whose section_report_id == Recall.section_report_id and whose status is IN {ASSESSMENT_OPEN, OFFER_MADE, COUNTERED} sets cooperation_bonus_applied=true, re-runs §1.3 consent_agreement_total in preview mode to overwrite consent_agreement_preview_cents, and increments its version by 1"

  - method: POST
    path: "/product-safety/remedy-claims/{id}/void"
    description: |
      Void the claim. From FULFILLED this is the compensating action for the
      cascade: all four links are reversed exactly, with no drift in the unit
      ledger and no residual cooperation credit. From APPROVED nothing had been
      applied, so nothing is reversed.
    roles: [ComplianceOfficer, SafetyDirector]
    code: 200
    input: ["reason?"]
    output: RemedyClaim
    side_effects:
      - "status APPROVED -> VOID or FULFILLED -> VOID (terminal); voided_at = current logical UTC"
      - "from FULFILLED, link 2 reversed: Recall.units_corrected -= quantity and units_outstanding += quantity"
      - "from FULFILLED, link 3 reversed: recall_effectiveness_rate re-run on UNITS_BASIS; effectiveness_flag returns to PENDING (or SHORTFALL if a ProgressReport has already been ACCEPTED) when the rate falls back below participation_goal_pct"
      - "from FULFILLED, link 4 reversed: when no other FULFILLED claim keeps the rate at goal, the linked CivilPenaltyCase sets cooperation_bonus_applied=false, re-runs the preview and increments its version by 1"
      - "from APPROVED, the unit ledger, effectiveness_flag and the penalty case are all untouched"

  # ======================= writes: progress reporting ====================
  - method: POST
    path: "/product-safety/progress-reports"
    description: |
      Open a monthly progress report over a CLOSED [period_start, period_end]
      interval. Periods on one recall may not overlap (priority 20) and may not
      skip time (priority 21): the first period must start exactly at
      Recall.stop_sale_effective_at and each later one exactly 24h after the
      previous period_end. Records the acting X-User-ID as prepared_by_user_id.
    roles: [ComplianceOfficer, SafetyDirector]
    code: 201
    input: [recall_id, period_start, period_end, effectiveness_basis]
    output: ProgressReport
    side_effects:
      - "creates ProgressReport with status=DRAFT, assessment=PENDING, effectiveness_rate=null, units_corrected_in_period=0, cumulative_units_corrected=0"
      - "sets prepared_by_user_id = acting X-User-ID"

  - method: POST
    path: "/product-safety/progress-reports/{id}/submit"
    description: "File the report: computes the period and cumulative unit figures and runs recall_effectiveness_rate in the report's declared basis."
    roles: [ComplianceOfficer, SafetyDirector]
    code: 200
    input: []
    output: ProgressReport
    side_effects:
      - "status DRAFT -> SUBMITTED; submitted_at = current logical UTC"
      - "runs §1.3 recall_unit_ledger to set units_corrected_in_period and cumulative_units_corrected"
      - "runs §1.3 recall_effectiveness_rate in the effectiveness_basis variant to set effectiveness_rate and assessment"

  - method: POST
    path: "/product-safety/progress-reports/{id}/accept"
    description: "The agency accepts the filed report. The acting X-User-ID must differ from prepared_by_user_id (§1.4 priority 7)."
    roles: [SafetyDirector]
    code: 200
    input: []
    output: ProgressReport
    side_effects:
      - "status SUBMITTED -> ACCEPTED (terminal); accepted_at = current logical UTC"
      - "sets Recall.last_accepted_period_end = period_end"
      - "Recall.effectiveness_flag PENDING -> SHORTFALL when the accepted report's assessment is BELOW_TARGET or CRITICAL"

  # ======================= writes: civil penalty =========================
  - method: POST
    path: "/product-safety/civil-penalty-cases"
    description: "Open a civil penalty docket against a filed section report and freeze the statutory assessment."
    roles: [PenaltyCounsel]
    code: 201
    input: [section_report_id, violation_count]
    output: CivilPenaltyCase
    side_effects:
      - "runs §1.3 civil_penalty_assessment to freeze assessed_penalty_cents (capped at 17150000)"
      - "creates CivilPenaltyCase with status=ASSESSMENT_OPEN, reserved_cents=0, available_cents=assessed_penalty_cents, current_offer_round=0, current_offer_cents=null, current_offer_by=null, cooperation_bonus_applied=false, cooperation_credit_tier=null, cooperation_credit_cents=0, consent_agreement_total_cents=null, compliance_program_required=false, reporting_obligation_months=0"
      - "runs §1.3 consent_agreement_total in preview mode to set consent_agreement_preview_cents from assessed_penalty_cents"
      - "rejects a second case on the same section report with ERR_DUPLICATE_DOCKET_ENTRY"

  - method: POST
    path: "/product-safety/civil-penalty-cases/{id}/offers"
    description: |
      Branch endpoint that puts a settlement number on the table and consumes a
      negotiation round. offered_by == AGENCY is legal from ASSESSMENT_OPEN and
      from COUNTERED; offered_by == RESPONDENT is legal only from OFFER_MADE. The
      OCC guard expected_case_version is required because the cooperation cascade
      can silently advance the case between the client's read and this write.
    roles: [PenaltyCounsel]
    code: 200
    input: [amount_cents, offered_by, expected_case_version]
    output: CivilPenaltyCase
    side_effects:
      - "status ASSESSMENT_OPEN -> OFFER_MADE or COUNTERED -> OFFER_MADE (AGENCY), or OFFER_MADE -> COUNTERED (RESPONDENT)"
      - "current_offer_cents = amount_cents; current_offer_by = offered_by; current_offer_round += 1"
      - "moves the reserve: reserved_cents = amount_cents and available_cents = assessed_penalty_cents - amount_cents, preserving reserved_cents + available_cents == assessed_penalty_cents"
      - "runs §1.3 consent_agreement_total in preview mode to overwrite consent_agreement_preview_cents from the new standing offer"
      - "increments CivilPenaltyCase.version by 1"
      - "rejects a stale expected_case_version with ERR_STALE_PENALTY_CASE_VERSION (412)"

  - method: POST
    path: "/product-safety/civil-penalty-cases/{id}/offer-resolution"
    description: |
      Branch endpoint that disposes of the standing offer. resolution ==
      WITHDRAWN releases the reserve and returns the case to ASSESSMENT_OPEN
      without giving back the consumed round; resolution == ACCEPTED binds the
      consent agreement and its obligations.
    roles: [PenaltyCounsel]
    code: 200
    input: [resolution, "note?"]
    output: CivilPenaltyCase
    side_effects:
      - "WITHDRAWN: status OFFER_MADE -> ASSESSMENT_OPEN; reserved_cents = 0 and available_cents = assessed_penalty_cents (compensating restore of the conserved reserve); current_offer_cents and current_offer_by return to null; current_offer_round is NOT decremented"
      - "ACCEPTED: status OFFER_MADE -> AGREED (terminal); runs §1.3 consent_agreement_total in the accepted variant to bind cooperation_credit_tier, cooperation_credit_cents, consent_agreement_total_cents, compliance_program_required and reporting_obligation_months"
      - "ACCEPTED: reserved_cents = consent_agreement_total_cents and available_cents = assessed_penalty_cents - consent_agreement_total_cents"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:

  # ---- identity & request shape -------------------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing/empty, or X-User-Role is not one of the seven roles declared in §1.7"
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "the acting role is not listed in the called endpoint's roles"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing required body field, unknown enum member, out-of-range or wrong-typed number, empty or duplicated remedy_options array, malformed ISO-8601 instant, or an interval whose start is not strictly before its end"
  - id: ERR_RETAILER_SCOPE_VIOLATION
    http: 403
    condition: "a RetailerRep acts on a RetailerNotification whose retailer_id differs from the acting X-User-ID"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the acting X-User-ID equals Recall.submitted_by_user_id on approve-plan, or equals ProgressReport.prepared_by_user_id on accept"

  # ---- existence -----------------------------------------------------------
  - id: ERR_PRODUCT_MODEL_NOT_FOUND
    http: 404
    condition: "no ProductModel with the given id, in a path segment or as a body product_model_id"
  - id: ERR_INCIDENT_NOT_FOUND
    http: 404
    condition: "no Incident with the given id, in a path segment or as a body duplicate_of_incident_id"
  - id: ERR_HAZARD_PATTERN_NOT_FOUND
    http: 404
    condition: "no HazardPattern with the given id, in a path segment or as a body hazard_pattern_id"
  - id: ERR_EVALUATION_NOT_FOUND
    http: 404
    condition: "no ReportabilityEvaluation with the given id, in a path segment or as a body reportability_evaluation_id"
  - id: ERR_SECTION_REPORT_NOT_FOUND
    http: 404
    condition: "no SectionReport with the given id, in a path segment or as a body section_report_id"
  - id: ERR_RECALL_NOT_FOUND
    http: 404
    condition: "no Recall with the given id, in a path segment or as a body recall_id"
  - id: ERR_RETAILER_NOT_FOUND
    http: 404
    condition: "no Retailer with the given id, in a path segment or as a body retailer_id"
  - id: ERR_RETAILER_NOTIFICATION_NOT_FOUND
    http: 404
    condition: "no RetailerNotification with the given id, in a path segment or as a body retailer_notification_id"
  - id: ERR_AUDIT_VISIT_NOT_FOUND
    http: 404
    condition: "no AuditVisit with the given id"
  - id: ERR_CONSUMER_NOTICE_NOT_FOUND
    http: 404
    condition: "no ConsumerNotice with the given id"
  - id: ERR_REMEDY_CLAIM_NOT_FOUND
    http: 404
    condition: "no RemedyClaim with the given id"
  - id: ERR_PROGRESS_REPORT_NOT_FOUND
    http: 404
    condition: "no ProgressReport with the given id"
  - id: ERR_PENALTY_CASE_NOT_FOUND
    http: 404
    condition: "no CivilPenaltyCase with the given id"

  # ---- optimistic concurrency (§1.2.1) ------------------------------------
  - id: ERR_STALE_PRODUCT_MODEL_VERSION
    http: 412
    condition: "POST /product-safety/hazard-patterns carries an expected_product_model_version that differs from ProductModel.version"
  - id: ERR_STALE_PENALTY_CASE_VERSION
    http: 412
    condition: "POST /product-safety/civil-penalty-cases/{id}/offers carries an expected_case_version that differs from CivilPenaltyCase.version"

  # ---- state preconditions (own state and cross-entity state) -------------
  - id: ERR_INCIDENT_STATE_INVALID
    http: 409
    condition: "classify or dispose attempted on an Incident that is not INTAKE or CLASSIFIED — a CLUSTERED or ESCALATED report is owned by a hazard pattern, and MERGED_DUPLICATE / CLOSED_NO_ACTION are terminal"
  - id: ERR_PATTERN_STATE_INVALID
    http: 409
    condition: "recompute or adjudicate attempted on a HazardPattern that is not ANALYZED, or a ReportabilityEvaluation opened against a pattern that is not CONFIRMED"
  - id: ERR_EVALUATION_STATE_INVALID
    http: 409
    condition: "begin-review on an evaluation that is not OPEN, determine on one that is not IN_REVIEW, or a SectionReport drafted against an evaluation that is not REPORTABLE"
  - id: ERR_SECTION_REPORT_STATE_INVALID
    http: 409
    condition: "submit on a report that is not DRAFT, review on one that is not SUBMITTED, revise on one that is not RETURNED_FOR_INFO, a Recall opened against a report that is not ACCEPTED, or a CivilPenaltyCase opened against a report that was never filed"
  - id: ERR_RECALL_PLAN_STATE_INVALID
    http: 409
    condition: "a recall action fired from the wrong plan_status, or a child (retailer notification, consumer notice, notice release, remedy claim, progress report) created while the recall's plan_status is outside that child's accepted window"
  - id: ERR_NOTIFICATION_STATE_INVALID
    http: 409
    condition: "acknowledge on a notification that is not ISSUED or DELINQUENT, verify on one that is not ACKNOWLEDGED, or an AuditVisit scheduled against one that is not ISSUED, DELINQUENT or ACKNOWLEDGED"
  - id: ERR_VISIT_STATE_INVALID
    http: 409
    condition: "complete attempted on an AuditVisit that is not SCHEDULED"
  - id: ERR_NOTICE_STATE_INVALID
    http: 409
    condition: "release attempted on a ConsumerNotice that is not SCHEDULED"
  - id: ERR_CLAIM_STATE_INVALID
    http: 409
    condition: "approve on a claim that is not SUBMITTED, fulfill on one that is not APPROVED, or void on one that is neither APPROVED nor FULFILLED"
  - id: ERR_PROGRESS_REPORT_STATE_INVALID
    http: 409
    condition: "submit on a progress report that is not DRAFT, or accept on one that is not SUBMITTED"
  - id: ERR_PENALTY_CASE_STATE_INVALID
    http: 409
    condition: "an AGENCY offer from a status other than ASSESSMENT_OPEN or COUNTERED, a RESPONDENT offer from a status other than OFFER_MADE, or an offer-resolution when no offer stands (status is not OFFER_MADE)"

  # ---- docket uniqueness --------------------------------------------------
  - id: ERR_MODEL_CODE_TAKEN
    http: 409
    condition: "another ProductModel already uses this model_code"
  - id: ERR_DUPLICATE_DOCKET_ENTRY
    http: 409
    condition: "a second non-terminal ReportabilityEvaluation on one hazard pattern, or a second SectionReport on one evaluation, or a second Recall or CivilPenaltyCase on one section report"
  - id: ERR_DUPLICATE_RETAILER_NOTIFICATION
    http: 409
    condition: "a RetailerNotification already exists for this (recall_id, retailer_id) pair"

  # ---- safety / hazard containment ---------------------------------------
  - id: ERR_MODEL_POSTURE_FROZEN
    http: 409
    condition: "a hazard pattern dismissal or recompute attempted while the ProductModel's hazard_posture is FROZEN"
  - id: ERR_NOTIFICATION_NOT_SATISFIED
    http: 409
    condition: "recall close attempted while notification_status is not SATISFIED — at least one retailer's shelf removal is still unverified"
  - id: ERR_NO_ACTIVE_STOP_SALE
    http: 409
    condition: "audit visit scheduled against a retailer whose compliance_posture is CLEAR"
  - id: ERR_SHELF_REMOVAL_UNVERIFIED
    http: 409
    condition: "verify attempted with no COMPLETED, PASS AuditVisit on this notification"
  - id: ERR_SHELF_UNITS_PRESENT
    http: 422
    condition: "verdict PASS submitted with shelf_units_found > 0, or verdict FAIL submitted with shelf_units_found == 0"
  - id: ERR_PATTERN_NOT_CONFIRMABLE
    http: 422
    condition: "adjudicate CONFIRMED on a pattern whose stored pattern_confirmed is false"
  - id: ERR_DETERMINATION_UNSUPPORTED
    http: 422
    condition: "the submitted defect_score / risk_score do not support the requested determination under the evaluation's standard_basis"

  # ---- temporal scheduling ----------------------------------------------
  - id: ERR_AUDIT_WINDOW_CONFLICT
    http: 409
    condition: "the requested half-open audit window, widened by the 24h travel buffer, intersects another SCHEDULED visit at the same retailer"
  - id: ERR_REPORT_PERIOD_OVERLAP
    http: 409
    condition: "the requested closed reporting period intersects an existing SUBMITTED or ACCEPTED period on the same recall (endpoints inclusive on both sides)"
  - id: ERR_REPORT_PERIOD_GAP
    http: 422
    condition: "period_start is not exactly 24h after the latest SUBMITTED/ACCEPTED period_end, or — for the first report — is not exactly Recall.stop_sale_effective_at"
  - id: ERR_NOTICE_NOT_DUE
    http: 409
    condition: "release attempted before the notice's scheduled_for instant"
  - id: ERR_EMBARGO_ACTIVE
    http: 409
    condition: "release attempted before a non-null embargo_until has lapsed"

  # ---- referential completeness -----------------------------------------
  - id: ERR_SELF_DUPLICATE_REFERENCE
    http: 422
    condition: "duplicate_of_incident_id equals the incident's own id"
  - id: ERR_DUPLICATE_CHAIN_FORBIDDEN
    http: 422
    condition: "the duplicate target is itself a duplicate (non-null duplicate_of_incident_id or status MERGED_DUPLICATE), or belongs to a different product_model_id"
  - id: ERR_REMEDY_OPTION_NOT_OFFERED
    http: 422
    condition: "remedy_type is not a member of the parent Recall's remedy_options array"
  - id: ERR_DIRECT_NOTICE_REQUIRED
    http: 422
    condition: "submit-plan attempted with no DIRECT_NOTICE ConsumerNotice on the recall"
  - id: ERR_CONSUMER_NOTICE_NOT_RELEASED
    http: 409
    condition: "begin-monitoring attempted with no RELEASED ConsumerNotice on the recall"
  - id: ERR_PROGRESS_REPORT_REQUIRED
    http: 422
    condition: "recall close attempted with no ACCEPTED ProgressReport on the recall"

  # ---- administrative constraints ---------------------------------------
  - id: ERR_REACH_EXCEEDS_REGISTRY
    http: 422
    condition: "a REGISTRATION_CARD notice claims a reach_count above the model's units_registered"
  - id: ERR_NEGOTIATION_ROUNDS_EXHAUSTED
    http: 409
    condition: "a new offer attempted when current_offer_round has already reached 6"

  # ---- fiscal / unit accounting -----------------------------------------
  - id: ERR_OFFER_EXCEEDS_ASSESSMENT
    http: 422
    condition: "amount_cents exceeds the case's frozen assessed_penalty_cents"
  - id: ERR_UNITS_OUTSTANDING_EXCEEDED
    http: 422
    condition: "claim quantity exceeds Recall.units_outstanding, which would break the conserved unit ledger"
  - id: ERR_EFFECTIVENESS_NOT_MET
    http: 409
    condition: "recall close attempted while effectiveness_flag is not MET"

# =============================================================================
# §1.7 RBAC Matrix — role_model: segregation_of_duties
#
#   Six opaque operator roles inside the safety office plus one entity-backed
#   external role. The two segregation-of-duties gates are enforced on the
#   stored operator id, not on the role, which is why submit-plan and
#   POST /progress-reports are SHARED between ComplianceOfficer and
#   SafetyDirector: the same SafetyDirector user can reach both sides of each
#   gate and be refused by identity rather than by permission.
# =============================================================================
roles:

  - name: ProgramAdmin
    description: "Registry custodian. Owns the reference data the whole docket hangs off (product models, retailers) and the logical clock, but takes no substantive safety decision."
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /product-safety/product-models"
      - "POST /product-safety/retailers"
    shared_operations:
      - "all single-resource and filtered GET endpoints except the penalty-case reads it also holds, i.e. full read access across the docket"

  - name: IntakeSpecialist
    description: "Hotline and web-form intake analyst. Takes incident reports, classifies injuries and hazard codes, and disposes of duplicates and no-action reports. Has no authority over patterns, reportability or recalls."
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "POST /product-safety/incidents"
      - "POST /product-safety/incidents/{id}/classify"
      - "POST /product-safety/incidents/{id}/dispose"
      - "GET reads on product models, incidents, hazard patterns"

  - name: ComplianceOfficer
    description: "Case officer who builds the docket: hazard pattern analysis, reportability evaluation, report drafting, recall plan authoring, consumer notification and the remedy ledger. Files work that a SafetyDirector must approve."
    identity: opaque
    exclusive_operations:
      - "POST /product-safety/remedy-claims"
      - "POST /product-safety/remedy-claims/{id}/fulfill"
    shared_operations:
      - "POST /product-safety/incidents"
      - "POST /product-safety/incidents/{id}/classify"
      - "POST /product-safety/incidents/{id}/dispose"
      - "POST /product-safety/hazard-patterns"
      - "POST /product-safety/hazard-patterns/{id}/recompute"
      - "POST /product-safety/hazard-patterns/{id}/adjudicate"
      - "POST /product-safety/reportability-evaluations"
      - "POST /product-safety/reportability-evaluations/{id}/begin-review"
      - "POST /product-safety/reportability-evaluations/{id}/determine"
      - "POST /product-safety/section-reports"
      - "POST /product-safety/section-reports/{id}/submit"
      - "POST /product-safety/section-reports/{id}/revise"
      - "POST /product-safety/recalls"
      - "POST /product-safety/recalls/{id}/submit-plan"
      - "POST /product-safety/recalls/{id}/compliance-sweep"
      - "POST /product-safety/retailer-notifications"
      - "POST /product-safety/retailer-notifications/{id}/acknowledge"
      - "POST /product-safety/consumer-notices"
      - "POST /product-safety/consumer-notices/{id}/release"
      - "POST /product-safety/remedy-claims/{id}/approve"
      - "POST /product-safety/remedy-claims/{id}/void"
      - "POST /product-safety/progress-reports"
      - "POST /product-safety/progress-reports/{id}/submit"

  - name: SafetyDirector
    description: "Signing official. Holds every approval that a ComplianceOfficer's filing needs — report review, plan approval, monitoring, closure, shelf-removal verification and progress-report acceptance. Also permitted to perform the filing steps, which is exactly what makes the two identity-based segregation gates meaningful."
    identity: opaque
    exclusive_operations:
      - "POST /product-safety/section-reports/{id}/review"
      - "POST /product-safety/recalls/{id}/approve-plan"
      - "POST /product-safety/recalls/{id}/begin-monitoring"
      - "POST /product-safety/recalls/{id}/close"
      - "POST /product-safety/progress-reports/{id}/accept"
    shared_operations:
      - "POST /product-safety/hazard-patterns"
      - "POST /product-safety/hazard-patterns/{id}/recompute"
      - "POST /product-safety/hazard-patterns/{id}/adjudicate"
      - "POST /product-safety/reportability-evaluations"
      - "POST /product-safety/reportability-evaluations/{id}/begin-review"
      - "POST /product-safety/reportability-evaluations/{id}/determine"
      - "POST /product-safety/section-reports"
      - "POST /product-safety/section-reports/{id}/submit"
      - "POST /product-safety/section-reports/{id}/revise"
      - "POST /product-safety/recalls"
      - "POST /product-safety/recalls/{id}/submit-plan"
      - "POST /product-safety/recalls/{id}/compliance-sweep"
      - "POST /product-safety/retailer-notifications"
      - "POST /product-safety/retailer-notifications/{id}/verify"
      - "POST /product-safety/audit-visits"
      - "POST /product-safety/consumer-notices"
      - "POST /product-safety/consumer-notices/{id}/release"
      - "POST /product-safety/remedy-claims/{id}/approve"
      - "POST /product-safety/remedy-claims/{id}/void"
      - "POST /product-safety/progress-reports"
      - "POST /product-safety/progress-reports/{id}/submit"

  - name: FieldAuditor
    description: "Inspector who schedules and completes shelf-removal audit visits and may sign the resulting verification. Cannot touch the docket, the recall plan or the penalty case."
    identity: opaque
    exclusive_operations:
      - "POST /product-safety/audit-visits/{id}/complete"
    shared_operations:
      - "POST /product-safety/audit-visits"
      - "POST /product-safety/retailer-notifications/{id}/verify"
      - "GET reads on recalls, retailers, retailer notifications and audit visits"

  - name: PenaltyCounsel
    description: "Enforcement attorney. Sole owner of the civil penalty docket: assessment, offers from both sides, withdrawal and consent-agreement acceptance. Has read access to the safety record that grounds the assessment but cannot change it."
    identity: opaque
    exclusive_operations:
      - "POST /product-safety/civil-penalty-cases"
      - "POST /product-safety/civil-penalty-cases/{id}/offers"
      - "POST /product-safety/civil-penalty-cases/{id}/offer-resolution"
    shared_operations:
      - "GET reads on incidents, hazard patterns, evaluations, section reports, recalls, remedy claims and progress reports"

  - name: RetailerRep
    description: "External retailer or distributor representative. May only acknowledge their own stop-sale notification and read their own recall and notification records; X-User-ID is the Retailer's id."
    identity: "entity_backed:Retailer"
    exclusive_operations: []
    shared_operations:
      - "POST /product-safety/retailer-notifications/{id}/acknowledge (only where RetailerNotification.retailer_id == X-User-ID)"
      - "GET /product-safety/recalls/{id}"
      - "GET /product-safety/retailers/{id}"
      - "GET /product-safety/retailer-notifications/{id}"
      - "GET /product-safety/retailer-notifications"
