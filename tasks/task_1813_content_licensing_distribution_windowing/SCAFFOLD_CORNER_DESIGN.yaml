# =============================================================================
# Task 1813 — §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty
# Tests). Breadth probe over §1.1–§1.7 claims not covered by §1.8.
# Sections/claim_types follow references/claim-extraction-guide.md.
# Logical clock default: 2026-08-01T00:00:00Z.
# =============================================================================

scaffold_corner_design:
  # ============================================================ entities ====
  - section: entities
    instances:
      - name: title_create_applies_system_fields_and_defaults
        claim_type: creation
        grounds: [entities.Title, response_envelope]
        distinguishing_aspect: "A title created without embargoed_territories gets the default []; system fields are server-minted with created_at == the logical clock default 2026-08-01T00:00:00Z and version == 1."
        test_recipe:
          setup: ["empty DB; logical clock at its startup default"]
          setup_api_calls: []
          trigger:
            - { call: "POST /licensing/titles", payload: { title_code: "T1", name: "Alpha", content_type: "FILM", original_language: "en", production_year: 2024 }, as: RightsManager, captures: { t_id: $.data.id, t_emb: $.data.embargoed_territories, t_v: $.data.version, t_ca: $.data.created_at } }
          assert:
            - "response 201; id is a server-minted UUID"
            - "embargoed_territories == [] (default applied)"
            - "version == 1 and created_at == 2026-08-01T00:00:00Z (default logical clock, never wall clock)"

      - name: rights_slot_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.RightsSlot, "errors[ERR_INVALID_REQUEST]", "validations[priority=3]"]
        distinguishing_aspect: "Omitting the input-without-default field territory_code on slot creation fails schema validation before any existence/business check."
        test_recipe:
          setup: ["holder H and title T exist"]
          setup_api_calls:
            - { call: "POST /licensing/rights-holders", payload: { name: "H", payee_reference: "PAY-1", royalty_share_pct: 100 }, as: RightsManager, captures: { h_id: $.data.id } }
            - { call: "POST /licensing/titles", payload: { title_code: "T1", name: "T", content_type: "FILM", original_language: "en", production_year: 2024 }, as: RightsManager, captures: { t_id: $.data.id } }
          trigger:
            - { call: "POST /licensing/rights-slots", payload: { title_id: "${t_id}", rights_holder_id: "${h_id}", language_code: "en", window_type: "SVOD", sellable_from: "2026-08-01T00:00:00Z", sellable_to: "2027-08-01T00:00:00Z" }, as: RightsManager, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST and HTTP status == 400"

      - name: rights_slot_invalid_enum_rejected
        claim_type: type_constraints
        grounds: [entities.RightsSlot.fields.window_type, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "window_type CINEMA is not in the declared enum {THEATRICAL, EST, TVOD, SVOD, AVOD, FREE_TV} and must be rejected at schema validation."
        test_recipe:
          setup: ["holder H and title T exist"]
          setup_api_calls:
            - { call: "POST /licensing/rights-holders", payload: { name: "H", payee_reference: "PAY-1", royalty_share_pct: 100 }, as: RightsManager, captures: { h_id: $.data.id } }
            - { call: "POST /licensing/titles", payload: { title_code: "T1", name: "T", content_type: "FILM", original_language: "en", production_year: 2024 }, as: RightsManager, captures: { t_id: $.data.id } }
          trigger:
            - { call: "POST /licensing/rights-slots", payload: { title_id: "${t_id}", rights_holder_id: "${h_id}", territory_code: "US", language_code: "en", window_type: "CINEMA", sellable_from: "2026-08-01T00:00:00Z", sellable_to: "2027-08-01T00:00:00Z" }, as: RightsManager, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST and HTTP status == 400"

      - name: license_computed_fields_client_input_ignored
        claim_type: computed_fields
        grounds: [entities.LicenseAgreement.fields.recouped_cents, entities.LicenseAgreement.fields.license_status]
        distinguishing_aspect: "Client-supplied values for computed/system fields (recouped_cents 9999, license_status ACTIVE) are ignored: the created license starts EXECUTED with recouped_cents 0."
        test_recipe:
          setup: ["holder/title/platform/slot exist (slot rights [2026-08-01, 2027-08-01))"]
          setup_api_calls:
            - { call: "POST /licensing/rights-holders", payload: { name: "H", payee_reference: "PAY-1", royalty_share_pct: 100 }, as: RightsManager, captures: { h_id: $.data.id } }
            - { call: "POST /licensing/titles", payload: { title_code: "T1", name: "T", content_type: "FILM", original_language: "en", production_year: 2024 }, as: RightsManager, captures: { t_id: $.data.id } }
            - { call: "POST /licensing/platforms", payload: { name: "P", platform_type: "SVOD", metadata_spec_version: "MEC-2.3", required_asset_profiles: ["4K_HDR"] }, as: RightsManager, captures: { p_id: $.data.id } }
            - { call: "POST /licensing/rights-slots", payload: { title_id: "${t_id}", rights_holder_id: "${h_id}", territory_code: "US", language_code: "en", window_type: "SVOD", sellable_from: "2026-08-01T00:00:00Z", sellable_to: "2027-08-01T00:00:00Z" }, as: RightsManager, captures: { s_id: $.data.id } }
          trigger:
            - { call: "POST /licensing/license-agreements", payload: { slot_id: "${s_id}", platform_id: "${p_id}", license_start: "2026-08-01T00:00:00Z", license_end: "2027-01-01T00:00:00Z", exclusive: false, fee_model: "MINIMUM_GUARANTEE", minimum_guarantee_cents: 80000, revenue_share_pct: 50, recouped_cents: 9999, license_status: "ACTIVE" }, as: RightsManager, captures: { l_rec: $.data.recouped_cents, l_status: $.data.license_status, l_out: $.data.outstanding_recoupment_cents } }
          assert:
            - "recouped_cents == 0 and license_status == EXECUTED (client values ignored)"
            - "outstanding_recoupment_cents == 80000 (computed from the MG, not from the spoofed recouped value)"

      - name: entity_get_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_TITLE_NOT_FOUND]", "errors[ERR_HOLDER_NOT_FOUND]", "errors[ERR_PLATFORM_NOT_FOUND]", "errors[ERR_SLOT_NOT_FOUND]", "errors[ERR_PACKAGE_NOT_FOUND]", "errors[ERR_LICENSE_NOT_FOUND]", "errors[ERR_BATCH_NOT_FOUND]", "errors[ERR_NOTICE_NOT_FOUND]", "errors[ERR_REPORT_NOT_FOUND]", "errors[ERR_STATEMENT_NOT_FOUND]"]
        distinguishing_aspect: "Every single-resource GET returns its entity-specific 404 error id for a well-formed but non-existent UUID."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /licensing/titles/11111111-1111-1111-1111-111111111111", as: FinanceAnalyst, captures: { e1: $.data.error_id } }
            - { call: "GET /licensing/rights-holders/11111111-1111-1111-1111-111111111111", as: FinanceAnalyst, captures: { e2: $.data.error_id } }
            - { call: "GET /licensing/platforms/11111111-1111-1111-1111-111111111111", as: FinanceAnalyst, captures: { e3: $.data.error_id } }
            - { call: "GET /licensing/rights-slots/11111111-1111-1111-1111-111111111111", as: FinanceAnalyst, captures: { e4: $.data.error_id } }
            - { call: "GET /licensing/avail-packages/11111111-1111-1111-1111-111111111111", as: RightsManager, captures: { e5: $.data.error_id } }
            - { call: "GET /licensing/license-agreements/11111111-1111-1111-1111-111111111111", as: FinanceAnalyst, captures: { e6: $.data.error_id } }
            - { call: "GET /licensing/delivery-batches/11111111-1111-1111-1111-111111111111", as: RightsManager, captures: { e7: $.data.error_id } }
            - { call: "GET /licensing/takedown-notices/11111111-1111-1111-1111-111111111111", as: RightsManager, captures: { e8: $.data.error_id } }
            - { call: "GET /licensing/revenue-reports/11111111-1111-1111-1111-111111111111", as: FinanceAnalyst, captures: { e9: $.data.error_id } }
            - { call: "GET /licensing/royalty-statements/11111111-1111-1111-1111-111111111111", as: FinanceAnalyst, captures: { e10: $.data.error_id } }
          assert:
            - "e1 == ERR_TITLE_NOT_FOUND, e2 == ERR_HOLDER_NOT_FOUND, e3 == ERR_PLATFORM_NOT_FOUND, e4 == ERR_SLOT_NOT_FOUND, e5 == ERR_PACKAGE_NOT_FOUND"
            - "e6 == ERR_LICENSE_NOT_FOUND, e7 == ERR_BATCH_NOT_FOUND, e8 == ERR_NOTICE_NOT_FOUND, e9 == ERR_REPORT_NOT_FOUND, e10 == ERR_STATEMENT_NOT_FOUND"
            - "all responses HTTP 404 with the error envelope shape"

      - name: titles_list_pagination_and_filtering
        claim_type: listing
        grounds: [response_envelope, entities.Title]
        distinguishing_aspect: "List endpoints honor limit/offset with total_count and has_more, and the content_type filter narrows the result set."
        test_recipe:
          setup: ["three titles exist: two FILM, one SERIES"]
          setup_api_calls:
            - { call: "POST /licensing/titles", payload: { title_code: "F1", name: "F1", content_type: "FILM", original_language: "en", production_year: 2024 }, as: RightsManager }
            - { call: "POST /licensing/titles", payload: { title_code: "F2", name: "F2", content_type: "FILM", original_language: "en", production_year: 2024 }, as: RightsManager }
            - { call: "POST /licensing/titles", payload: { title_code: "S1", name: "S1", content_type: "SERIES", original_language: "en", production_year: 2024 }, as: RightsManager }
          trigger:
            - { call: "GET /licensing/titles?limit=2&offset=0", as: RightsManager }
            - { call: "GET /licensing/titles?limit=2&offset=2", as: RightsManager }
            - { call: "GET /licensing/titles?content_type=SERIES", as: RightsManager }
          assert:
            - "page 1: exactly 2 items, total_count == 3, has_more == true"
            - "page 2 (offset 2): exactly 1 item, total_count == 3, has_more == false"
            - "filtered list: exactly 1 item (the SERIES title), total_count == 1"

  # ====================================================== state_machines ====
  - section: state_machines
    instances:
      - name: slot_created_in_initial_available_state
        claim_type: initial_state
        grounds: [state_machines.RightsSlot]
        distinguishing_aspect: "A newly created slot starts AVAILABLE, independent of any license activity."
        test_recipe:
          setup: ["holder H and title T exist"]
          setup_api_calls:
            - { call: "POST /licensing/rights-holders", payload: { name: "H", payee_reference: "PAY-1", royalty_share_pct: 100 }, as: RightsManager, captures: { h_id: $.data.id } }
            - { call: "POST /licensing/titles", payload: { title_code: "T1", name: "T", content_type: "FILM", original_language: "en", production_year: 2024 }, as: RightsManager, captures: { t_id: $.data.id } }
          trigger:
            - { call: "POST /licensing/rights-slots", payload: { title_id: "${t_id}", rights_holder_id: "${h_id}", territory_code: "US", language_code: "en", window_type: "SVOD", sellable_from: "2026-08-01T00:00:00Z", sellable_to: "2027-08-01T00:00:00Z" }, as: RightsManager, captures: { st: $.data.slot_status } }
          assert:
            - "slot_status == AVAILABLE at creation"

      - name: slot_withdraw_from_encumbered_returns_409
        claim_type: invalid_transition
        grounds: [state_machines.RightsSlot.AVAILABLE_to_WITHDRAWN, "errors[ERR_SLOT_NOT_WITHDRAWABLE]"]
        distinguishing_aspect: "Withdraw is defined only from AVAILABLE; an ENCUMBERED slot (exclusive license in force) rejects with ERR_SLOT_NOT_WITHDRAWABLE and the slot stays ENCUMBERED."
        test_recipe:
          setup: ["slot S with an EXECUTED exclusive license on it (slot ENCUMBERED)"]
          setup_api_calls:
            - { call: "POST /licensing/rights-holders", payload: { name: "H", payee_reference: "PAY-1", royalty_share_pct: 100 }, as: RightsManager, captures: { h_id: $.data.id } }
            - { call: "POST /licensing/titles", payload: { title_code: "T1", name: "T", content_type: "FILM", original_language: "en", production_year: 2024 }, as: RightsManager, captures: { t_id: $.data.id } }
            - { call: "POST /licensing/platforms", payload: { name: "P", platform_type: "SVOD", metadata_spec_version: "MEC-2.3", required_asset_profiles: ["4K_HDR"] }, as: RightsManager, captures: { p_id: $.data.id } }
            - { call: "POST /licensing/rights-slots", payload: { title_id: "${t_id}", rights_holder_id: "${h_id}", territory_code: "US", language_code: "en", window_type: "SVOD", sellable_from: "2026-08-01T00:00:00Z", sellable_to: "2027-08-01T00:00:00Z" }, as: RightsManager, captures: { s_id: $.data.id } }
            - { call: "POST /licensing/license-agreements", payload: { slot_id: "${s_id}", platform_id: "${p_id}", license_start: "2026-08-01T00:00:00Z", license_end: "2026-12-01T00:00:00Z", exclusive: true, fee_model: "FLAT_FEE", flat_fee_cents: 100000 }, as: RightsManager, captures: { l_id: $.data.id } }
          trigger:
            - { call: "POST /licensing/rights-slots/${s_id}/withdraw", as: RightsManager, captures: { err: $.data.error_id } }
            - { call: "GET /licensing/rights-slots/${s_id}", as: RightsManager, captures: { st: $.data.slot_status } }
          assert:
            - "error_id == ERR_SLOT_NOT_WITHDRAWABLE (HTTP 409)"
            - "slot_status still == ENCUMBERED (no side effects fired)"

      - name: package_offer_twice_returns_409
        claim_type: invalid_transition
        grounds: [state_machines.AvailPackage.DRAFT_to_OFFERED, "errors[ERR_PACKAGE_NOT_DRAFT]"]
        distinguishing_aspect: "The second offer of an already-OFFERED package fails with ERR_PACKAGE_NOT_DRAFT; offer is not idempotent."
        test_recipe:
          setup: ["OFFERED package PKG with one FLAT_FEE line on slot S (expiry 2026-12-01)"]
          setup_api_calls:
            - { call: "POST /licensing/rights-holders", payload: { name: "H", payee_reference: "PAY-1", royalty_share_pct: 100 }, as: RightsManager, captures: { h_id: $.data.id } }
            - { call: "POST /licensing/titles", payload: { title_code: "T1", name: "T", content_type: "FILM", original_language: "en", production_year: 2024 }, as: RightsManager, captures: { t_id: $.data.id } }
            - { call: "POST /licensing/platforms", payload: { name: "P", platform_type: "SVOD", metadata_spec_version: "MEC-2.3", required_asset_profiles: ["4K_HDR"] }, as: RightsManager, captures: { p_id: $.data.id } }
            - { call: "POST /licensing/rights-slots", payload: { title_id: "${t_id}", rights_holder_id: "${h_id}", territory_code: "US", language_code: "en", window_type: "SVOD", sellable_from: "2026-08-01T00:00:00Z", sellable_to: "2027-08-01T00:00:00Z" }, as: RightsManager, captures: { s_id: $.data.id } }
            - { call: "POST /licensing/avail-packages", payload: { platform_id: "${p_id}", name: "PKG", offer_expires_at: "2026-12-01T00:00:00Z", lines: [ { slot_id: "${s_id}", license_start: "2026-09-01T00:00:00Z", license_end: "2026-12-01T00:00:00Z", exclusive: false, fee_model: "FLAT_FEE", flat_fee_cents: 10000 } ] }, as: RightsManager, captures: { pkg_id: $.data.id } }
            - { call: "POST /licensing/avail-packages/${pkg_id}/offer", as: RightsManager }
          trigger:
            - { call: "POST /licensing/avail-packages/${pkg_id}/offer", as: RightsManager, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_PACKAGE_NOT_DRAFT (HTTP 409)"

      - name: package_accept_from_draft_returns_409
        claim_type: precondition_enforcement
        grounds: [state_machines.AvailPackage.OFFERED_to_ACCEPTED, "errors[ERR_PACKAGE_NOT_OFFERED]"]
        distinguishing_aspect: "Accept on a DRAFT package (never offered) fails with ERR_PACKAGE_NOT_OFFERED — the buyer cannot skip the offer step."
        test_recipe:
          setup: ["DRAFT package PKG with one line on slot S"]
          setup_api_calls:
            - { call: "POST /licensing/rights-holders", payload: { name: "H", payee_reference: "PAY-1", royalty_share_pct: 100 }, as: RightsManager, captures: { h_id: $.data.id } }
            - { call: "POST /licensing/titles", payload: { title_code: "T1", name: "T", content_type: "FILM", original_language: "en", production_year: 2024 }, as: RightsManager, captures: { t_id: $.data.id } }
            - { call: "POST /licensing/platforms", payload: { name: "P", platform_type: "SVOD", metadata_spec_version: "MEC-2.3", required_asset_profiles: ["4K_HDR"] }, as: RightsManager, captures: { p_id: $.data.id } }
            - { call: "POST /licensing/rights-slots", payload: { title_id: "${t_id}", rights_holder_id: "${h_id}", territory_code: "US", language_code: "en", window_type: "SVOD", sellable_from: "2026-08-01T00:00:00Z", sellable_to: "2027-08-01T00:00:00Z" }, as: RightsManager, captures: { s_id: $.data.id } }
            - { call: "POST /licensing/avail-packages", payload: { platform_id: "${p_id}", name: "PKG", offer_expires_at: "2026-12-01T00:00:00Z", lines: [ { slot_id: "${s_id}", license_start: "2026-09-01T00:00:00Z", license_end: "2026-12-01T00:00:00Z", exclusive: false, fee_model: "FLAT_FEE", flat_fee_cents: 10000 } ] }, as: RightsManager, captures: { pkg_id: $.data.id } }
          trigger:
            - { call: "POST /licensing/avail-packages/${pkg_id}/accept", payload: { accepted_slot_ids: ["${s_id}"] }, as: PlatformBuyer, as_user_id: "${p_id}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_PACKAGE_NOT_OFFERED (HTTP 409); no license created"

      - name: package_withdraw_after_accept_returns_409
        claim_type: terminal_state_lockdown
        grounds: [state_machines.AvailPackage, "errors[ERR_PACKAGE_NOT_WITHDRAWABLE]"]
        distinguishing_aspect: "ACCEPTED is terminal: withdrawing afterwards fails with ERR_PACKAGE_NOT_WITHDRAWABLE and created licenses remain EXECUTED."
        test_recipe:
          setup: ["package PKG fully accepted by its platform (one FLAT_FEE 10000 line on slot S)"]
          setup_api_calls:
            - { call: "POST /licensing/rights-holders", payload: { name: "H", payee_reference: "PAY-1", royalty_share_pct: 100 }, as: RightsManager, captures: { h_id: $.data.id } }
            - { call: "POST /licensing/titles", payload: { title_code: "T1", name: "T", content_type: "FILM", original_language: "en", production_year: 2024 }, as: RightsManager, captures: { t_id: $.data.id } }
            - { call: "POST /licensing/platforms", payload: { name: "P", platform_type: "SVOD", metadata_spec_version: "MEC-2.3", required_asset_profiles: ["4K_HDR"] }, as: RightsManager, captures: { p_id: $.data.id } }
            - { call: "POST /licensing/rights-slots", payload: { title_id: "${t_id}", rights_holder_id: "${h_id}", territory_code: "US", language_code: "en", window_type: "SVOD", sellable_from: "2026-08-01T00:00:00Z", sellable_to: "2027-08-01T00:00:00Z" }, as: RightsManager, captures: { s_id: $.data.id } }
            - { call: "POST /licensing/avail-packages", payload: { platform_id: "${p_id}", name: "PKG", offer_expires_at: "2026-12-01T00:00:00Z", lines: [ { slot_id: "${s_id}", license_start: "2026-09-01T00:00:00Z", license_end: "2026-12-01T00:00:00Z", exclusive: false, fee_model: "FLAT_FEE", flat_fee_cents: 10000 } ] }, as: RightsManager, captures: { pkg_id: $.data.id } }
            - { call: "POST /licensing/avail-packages/${pkg_id}/offer", as: RightsManager }
            - { call: "POST /licensing/avail-packages/${pkg_id}/accept", payload: { accepted_slot_ids: ["${s_id}"] }, as: PlatformBuyer, as_user_id: "${p_id}" }
          trigger:
            - { call: "POST /licensing/avail-packages/${pkg_id}/withdraw", as: RightsManager, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_PACKAGE_NOT_WITHDRAWABLE (HTTP 409)"

      - name: package_decline_then_accept_returns_409
        claim_type: terminal_state_lockdown
        grounds: [state_machines.AvailPackage.OFFERED_to_DECLINED, "errors[ERR_PACKAGE_NOT_OFFERED]"]
        distinguishing_aspect: "DECLINED is terminal: after the buyer declines, a later accept fails with ERR_PACKAGE_NOT_OFFERED."
        test_recipe:
          setup: ["OFFERED package PKG (one line on slot S) declined by its platform"]
          setup_api_calls:
            - { call: "POST /licensing/rights-holders", payload: { name: "H", payee_reference: "PAY-1", royalty_share_pct: 100 }, as: RightsManager, captures: { h_id: $.data.id } }
            - { call: "POST /licensing/titles", payload: { title_code: "T1", name: "T", content_type: "FILM", original_language: "en", production_year: 2024 }, as: RightsManager, captures: { t_id: $.data.id } }
            - { call: "POST /licensing/platforms", payload: { name: "P", platform_type: "SVOD", metadata_spec_version: "MEC-2.3", required_asset_profiles: ["4K_HDR"] }, as: RightsManager, captures: { p_id: $.data.id } }
            - { call: "POST /licensing/rights-slots", payload: { title_id: "${t_id}", rights_holder_id: "${h_id}", territory_code: "US", language_code: "en", window_type: "SVOD", sellable_from: "2026-08-01T00:00:00Z", sellable_to: "2027-08-01T00:00:00Z" }, as: RightsManager, captures: { s_id: $.data.id } }
            - { call: "POST /licensing/avail-packages", payload: { platform_id: "${p_id}", name: "PKG", offer_expires_at: "2026-12-01T00:00:00Z", lines: [ { slot_id: "${s_id}", license_start: "2026-09-01T00:00:00Z", license_end: "2026-12-01T00:00:00Z", exclusive: false, fee_model: "FLAT_FEE", flat_fee_cents: 10000 } ] }, as: RightsManager, captures: { pkg_id: $.data.id } }
            - { call: "POST /licensing/avail-packages/${pkg_id}/offer", as: RightsManager }
            - { call: "POST /licensing/avail-packages/${pkg_id}/decline", as: PlatformBuyer, as_user_id: "${p_id}", captures: { st_d: $.data.package_status } }
          trigger:
            - { call: "POST /licensing/avail-packages/${pkg_id}/accept", payload: { accepted_slot_ids: ["${s_id}"] }, as: PlatformBuyer, as_user_id: "${p_id}", captures: { err: $.data.error_id } }
          assert:
            - "decline succeeded: st_d == DECLINED"
            - "subsequent accept: error_id == ERR_PACKAGE_NOT_OFFERED (HTTP 409)"

      - name: license_terminate_from_expired_returns_409
        claim_type: terminal_state_lockdown
        grounds: [state_machines.LicenseAgreement, "errors[ERR_LICENSE_ALREADY_TERMINAL]", calculations.expiration_sweep]
        distinguishing_aspect: "A license swept to EXPIRED at exactly license_end (now >= end) is terminal; terminate afterwards fails with ERR_LICENSE_ALREADY_TERMINAL."
        test_recipe:
          setup: ["license L window [2026-08-01T00:00:00Z, 2026-09-01T00:00:00Z); logical clock advanced to exactly 2026-09-01T00:00:00Z (sweep expires L)"]
          setup_api_calls:
            - { call: "POST /licensing/rights-holders", payload: { name: "H", payee_reference: "PAY-1", royalty_share_pct: 100 }, as: RightsManager, captures: { h_id: $.data.id } }
            - { call: "POST /licensing/titles", payload: { title_code: "T1", name: "T", content_type: "FILM", original_language: "en", production_year: 2024 }, as: RightsManager, captures: { t_id: $.data.id } }
            - { call: "POST /licensing/platforms", payload: { name: "P", platform_type: "SVOD", metadata_spec_version: "MEC-2.3", required_asset_profiles: ["4K_HDR"] }, as: RightsManager, captures: { p_id: $.data.id } }
            - { call: "POST /licensing/rights-slots", payload: { title_id: "${t_id}", rights_holder_id: "${h_id}", territory_code: "US", language_code: "en", window_type: "SVOD", sellable_from: "2026-08-01T00:00:00Z", sellable_to: "2027-08-01T00:00:00Z" }, as: RightsManager, captures: { s_id: $.data.id } }
            - { call: "POST /licensing/license-agreements", payload: { slot_id: "${s_id}", platform_id: "${p_id}", license_start: "2026-08-01T00:00:00Z", license_end: "2026-09-01T00:00:00Z", exclusive: false, fee_model: "FLAT_FEE", flat_fee_cents: 10000 }, as: RightsManager, captures: { l_id: $.data.id } }
            - { call: "POST /licensing/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: RightsManager, captures: { n_exp: $.data.licenses_expired } }
          trigger:
            - { call: "POST /licensing/license-agreements/${l_id}/terminate", as: RightsManager, captures: { err: $.data.error_id } }
          assert:
