  # ---------------------------------------------------------------------------
  - section: rbac
    instances:
      - name: enforcement_officer_cannot_decide_appeal
        claim_type: role_deny
        grounds: ["roles[EnforcementOfficer]", "roles[AppealsOfficer]", "errors[ERR_FORBIDDEN_ROLE]"]
        distinguishing_aspect: "Role-level segregation: the decide endpoint lists only AppealsOfficer, so an EnforcementOfficer role token is refused with ERR_FORBIDDEN_ROLE before the user-level segregation check is even reached."
        test_recipe:
          setup: ["Account RB-1 (ACTIVE) with one LATE_REPORT assessment (assessed_by eo-1), appealed"]
          setup_api_calls:
            - call: "POST /water-user-accounts"
              payload: { holder_name: "Pumper RB-1", account_type: "AGRICULTURAL", base_allocation_af: 100.000 }
              as: WaterMaster
              captures: { acct_rb: $.data.id }
            - call: "POST /penalty-assessments"
              payload: { account_id: "${acct_rb}", reason: "LATE_REPORT", water_year: 2026 }
              as: EnforcementOfficer
              as_user_id: "eo-1"
              captures: { pa_rb: $.data.id }
            - call: "POST /penalty-assessments/${pa_rb}/appeal"
              payload: { grounds: "dispute" }
              as: WellOwner
              as_user_id: "${acct_rb}"
          trigger:
            - call: "POST /penalty-assessments/${pa_rb}/decide"
              payload: { outcome: "UPHELD" }
              as: EnforcementOfficer
              as_user_id: "eo-9"
              captures: { err: $.data.error_id }
          assert:
            - "captured ${err} == ERR_FORBIDDEN_ROLE (priority 2 role check beats the priority 15 segregation check)"

      - name: assessing_user_cannot_decide_own_appeal
        claim_type: segregation_of_duties
        grounds: ["validations[priority=15]", "errors[ERR_SEGREGATION_OF_DUTIES]", entities.PenaltyAssessment.fields.assessed_by]
        distinguishing_aspect: "User-level segregation of duties: even with the AppealsOfficer role, a decider whose X-User-ID equals the assessment's assessed_by (eo-1) is rejected with ERR_SEGREGATION_OF_DUTIES; the same decide with a different user (ao-1) succeeds."
        test_recipe:
          setup: ["Account RB-2 (ACTIVE) with one LATE_REPORT assessment (assessed_by eo-1), appealed"]
          setup_api_calls:
            - call: "POST /water-user-accounts"
              payload: { holder_name: "Pumper RB-2", account_type: "AGRICULTURAL", base_allocation_af: 100.000 }
              as: WaterMaster
              captures: { acct_rb2: $.data.id }
            - call: "POST /penalty-assessments"
              payload: { account_id: "${acct_rb2}", reason: "LATE_REPORT", water_year: 2026 }
              as: EnforcementOfficer
              as_user_id: "eo-1"
              captures: { pa_rb2: $.data.id }
            - call: "POST /penalty-assessments/${pa_rb2}/appeal"
              payload: { grounds: "dispute" }
              as: WellOwner
              as_user_id: "${acct_rb2}"
          trigger:
            - call: "POST /penalty-assessments/${pa_rb2}/decide"
              payload: { outcome: "UPHELD" }
              as: AppealsOfficer
              as_user_id: "eo-1"
              captures: { err_sod: $.data.error_id }
            - call: "POST /penalty-assessments/${pa_rb2}/decide"
              payload: { outcome: "UPHELD" }
              as: AppealsOfficer
              as_user_id: "ao-1"
              captures: { st_ok: $.data.status, decided_by: $.data.decided_by }
          assert:
            - "Same-user decide rejected: captured ${err_sod} == ERR_SEGREGATION_OF_DUTIES"
            - "Different-user decide succeeds: status == UPHELD and decided_by == ao-1 (captured ${st_ok}, ${decided_by})"

      - name: state_regulator_reads_all_collections
        claim_type: role_allow
        grounds: ["roles[StateRegulator]"]
        distinguishing_aspect: "StateRegulator's shared read surface works across collections: GET /water-user-accounts, GET /wells, GET /transfer-orders all return 200 with array payloads."
        test_recipe:
          setup: ["One account with one well exists"]
          setup_api_calls:
            - call: "POST /water-user-accounts"
              payload: { holder_name: "Pumper RB-3", account_type: "AGRICULTURAL", base_allocation_af: 100.000 }
              as: WaterMaster
              captures: { acct_rb3: $.data.id }
            - call: "POST /wells"
              payload: { account_id: "${acct_rb3}", well_type: "PRODUCTION", location_description: "Parcel RB-3" }
              as: WellOwner
              as_user_id: "${acct_rb3}"
          trigger:
            - call: "GET /water-user-accounts"
              as: StateRegulator
            - call: "GET /wells"
              as: StateRegulator
            - call: "GET /transfer-orders"
              as: StateRegulator
          assert:
            - "All three GETs return http 200 with response_type array (accounts length 1, wells length 1, transfers length 0)"

  # ---------------------------------------------------------------------------
  - section: cross_cutting_layers
    instances:
      - name: stale_account_version_patch_conflict
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[account-update-stale-version]", "errors[ERR_STALE_VERSION]", "endpoints[PATCH /water-user-accounts/{accountId}]"]
        distinguishing_aspect: "OCC on WaterUserAccount.version: the client reads version 1, the verify cascade advances the account (report create +1, verify +1) to version 3, and the PATCH carrying expected_account_version 1 is rejected with ERR_STALE_VERSION (412); re-reading and PATCHing with the fresh version succeeds."
        test_recipe:
          setup:
            - "Account OC created (version 1 captured); ACTIVE PRODUCTION well; report (2026, month 6, 5.000) created (account version -> 2) and verified (account version -> 3)"
          setup_api_calls:
            - call: "POST /water-user-accounts"
              payload: { holder_name: "Pumper OC", account_type: "AGRICULTURAL", base_allocation_af: 100.000 }
              as: WaterMaster
              captures: { acct_oc: $.data.id, oc_v1: $.data.version }
            - call: "POST /wells"
              payload: { account_id: "${acct_oc}", well_type: "PRODUCTION", location_description: "Parcel OC" }
              as: WellOwner
              as_user_id: "${acct_oc}"
              captures: { well_oc: $.data.id }
            - call: "POST /wells/${well_oc}/install-meter"
              payload: { meter_serial: "M-OC1" }
              as: WellOwner
              as_user_id: "${acct_oc}"
            - call: "POST /wells/${well_oc}/activate"
              as: WaterMaster
            - call: "POST /extraction-reports"
              payload: { well_id: "${well_oc}", water_year: 2026, month: 6, reported_af: 5.000 }
              as: WellOwner
              as_user_id: "${acct_oc}"
              captures: { rep_oc: $.data.id }
            - call: "POST /extraction-reports/${rep_oc}/verify"
              as: WaterMaster
          trigger:
            - call: "PATCH /water-user-accounts/${acct_oc}"
              payload: { base_allocation_af: 120.000, expected_account_version: "${oc_v1}" }
              as: WaterMaster
              captures: { err_occ: $.data.error_id }
            - call: "GET /water-user-accounts/${acct_oc}"
              as: WaterMaster
              captures: { oc_v2: $.data.version }
            - call: "PATCH /water-user-accounts/${acct_oc}"
              payload: { base_allocation_af: 120.000, expected_account_version: "${oc_v2}" }
              as: WaterMaster
              captures: { oc_alloc: $.data.base_allocation_af, oc_v3: $.data.version }
          assert:
            - "Stale PATCH rejected: captured ${err_occ} == ERR_STALE_VERSION (http 412); the client observed version 1 but the report create (+1) and verify (+1) cascades advanced the account to version 3 (captured ${oc_v2} == 3)"
            - "Fresh PATCH succeeds: base_allocation_af == 120.000 (captured ${oc_alloc}) and version incremented once more (captured ${oc_v3} == 4)"

      - name: transfer_expires_at_72h_boundary
        claim_type: scheduled_actions
        grounds: [entities.TransferOrder.fields.expires_at, state_machines.TransferOrder.PROPOSED_to_EXPIRED, "endpoints[POST /_clock/set_current_utc]"]
        distinguishing_aspect: "Expiry uses a strict-greater rule against expires_at = created_at + 72h: at exactly 2026-08-04T00:00:00Z the order is still PROPOSED; one second later the clock sweep moves it to EXPIRED and releases the seller's reservation."
        test_recipe:
          setup: ["Seller ES (allocation 100.000), buyer EB (50.000); transfer qty 5.000 window [2026-08-01, 2026-10-01) created at the default clock 2026-08-01T00:00:00Z (expires_at 2026-08-04T00:00:00Z), status PROPOSED, seller reservation 5.000"]
          setup_api_calls:
            - call: "POST /water-user-accounts"
              payload: { holder_name: "Seller ES", account_type: "AGRICULTURAL", base_allocation_af: 100.000 }
              as: WaterMaster
              captures: { acct_es: $.data.id }
            - call: "POST /water-user-accounts"
              payload: { holder_name: "Buyer EB", account_type: "AGRICULTURAL", base_allocation_af: 50.000 }
              as: WaterMaster
              captures: { acct_eb: $.data.id }
            - call: "POST /transfer-orders"
              payload: { seller_account_id: "${acct_es}", buyer_account_id: "${acct_eb}", quantity_af: 5.000, unit_price_cents: 9000, effective_start_date: "2026-08-01", effective_end_date: "2026-10-01" }
              as: WellOwner
              as_user_id: "${acct_es}"
              captures: { tr_es: $.data.id, tr_exp: $.data.expires_at }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-04T00:00:00Z" }
              as: WaterMaster
            - call: "GET /transfer-orders/${tr_es}"
              as: WaterMaster
              captures: { st_at: $.data.status }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-04T00:00:01Z" }
              as: WaterMaster
            - call: "GET /transfer-orders/${tr_es}"
              as: WaterMaster
              captures: { st_after: $.data.status }
            - call: "GET /water-user-accounts/${acct_es}"
              as: WaterMaster
              captures: { es_reserved: $.data.transfer_reserved_af }
          assert:
            - "expires_at == 2026-08-04T00:00:00.000Z (captured ${tr_exp}): created_at + 72 hours"
            - "At exactly expires_at: status == PROPOSED (captured ${st_at}) — expiry requires clock strictly greater than expires_at"
            - "One second later: status == EXPIRED (captured ${st_after}) and seller.transfer_reserved_af == 0.000 (captured ${es_reserved})"

  # ---------------------------------------------------------------------------
  - section: consistency_model
    instances:
      - name: verified_report_immediately_visible_on_account
        claim_type: immediate_consistency
        grounds: [complexity_profile.consistency_model, state_machines.ExtractionReport.SUBMITTED_to_VERIFIED]
        distinguishing_aspect: "Immediate consistency: the ledger move caused by verify is fully visible on the very next read — no lag, no recompute endpoint needed."
        test_recipe:
          setup: ["Account IC (ACTIVE, allocation 100.000) with ACTIVE PRODUCTION well; report (2026, month 6, 10.000) SUBMITTED (pending_extraction_af 10.000)"]
          setup_api_calls:
            - call: "POST /water-user-accounts"
              payload: { holder_name: "Pumper IC", account_type: "AGRICULTURAL", base_allocation_af: 100.000 }
              as: WaterMaster
              captures: { acct_ic: $.data.id }
            - call: "POST /wells"
              payload: { account_id: "${acct_ic}", well_type: "PRODUCTION", location_description: "Parcel IC" }
              as: WellOwner
              as_user_id: "${acct_ic}"
              captures: { well_ic: $.data.id }
            - call: "POST /wells/${well_ic}/install-meter"
              payload: { meter_serial: "M-IC1" }
              as: WellOwner
              as_user_id: "${acct_ic}"
            - call: "POST /wells/${well_ic}/activate"
              as: WaterMaster
            - call: "POST /extraction-reports"
              payload: { well_id: "${well_ic}", water_year: 2026, month: 6, reported_af: 10.000 }
              as: WellOwner
              as_user_id: "${acct_ic}"
              captures: { rep_ic: $.data.id }
          trigger:
            - call: "POST /extraction-reports/${rep_ic}/verify"
              as: WaterMaster
              captures: { fee_ic: $.data.fee_cents }
            - call: "GET /water-user-accounts/${acct_ic}"
              as: WaterMaster
              captures: { ic_ext: $.data.extracted_af_ytd, ic_pend: $.data.pending_extraction_af }
          assert:
            - "Immediately after verify: extracted_af_ytd == 10.000 and pending_extraction_af == 0.000 (captured ${ic_ext}, ${ic_pend})"
            - "fee_cents == 30000 stamped at verification (captured ${fee_ic}): 10.000 af * 3000 cents/af * NORMAL 1.00"
