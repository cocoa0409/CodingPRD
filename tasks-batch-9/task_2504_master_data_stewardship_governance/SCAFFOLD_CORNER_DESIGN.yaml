      - name: consumer_clearance_below_domain_classification_is_refused
        claim_type: Violation → Error
        grounds:
          - validations.priority_12_ERR_CLEARANCE_INSUFFICIENT
          - entities.ConsumerSubscription.fields.clearance_level
          - entities.Domain.fields.sensitive_handling_required
        distinguishing_aspect: "Clearance is compared by RANK, not by equality: on a CONFIDENTIAL domain (rank 3) an INTERNAL consumer (rank 2) is refused with 403 while a RESTRICTED consumer (rank 4) is admitted - a naive equality check would reject the better-cleared consumer too."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; domain VENDOR created with classification_level CONFIDENTIAL."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: GovernanceAdmin
            - call: "POST /mdm/domains"
              payload: { code: "VENDOR", name: "Vendor Master", classification_level: "CONFIDENTIAL", notification_lead_days_floor: 5, expected_attribute_count: 5 }
              as: GovernanceAdmin
              captures: { dom_id: $.data.id, dom_sensitive: $.data.sensitive_handling_required }
          trigger:
