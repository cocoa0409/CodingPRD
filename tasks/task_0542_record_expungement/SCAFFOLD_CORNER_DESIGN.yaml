# =============================================================================
# 1.9 Scaffold Corner Design (breadth) — task_0542
# Walks references/claim-extraction-guide.md against SCAFFOLD.yaml §1.1–§1.7.
# Same lint gates as §1.8. excluded_because stubs point at §1.8 instance names.
# =============================================================================
scaffold_corner_design:

  # ------------------------------------------------------------------ Entities
  - section: entities
    instances:
      - name: create_petitioner_success
        claim_type: Creation
        grounds: [entities.Petitioner, endpoints]
        distinguishing_aspect: "POST /petitioners with all required fields returns 201 and a Petitioner with version==1, fee_paid_cents==0, fee_refunded_cents==0."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - { call: "POST /expungement/petitioners", payload: { full_name: "Test P", date_of_birth: "1990-01-01T00:00:00Z", annual_income_cents: 8000000, household_size: 2 }, as: Clerk, captures: { p: "$.data.id", v: "$.data.version" } }
          assert:
            - "response code 201; Petitioner.${p}.version == 1"
            - "Petitioner.${p}.fee_paid_cents == 0 and fee_refunded_cents == 0"

      - name: petitioner_system_fields_generated
        claim_type: System Fields
        grounds: [entities.Petitioner.fields.fee_paid_cents]
        distinguishing_aspect: "id/created_at/version are server-minted; a client-sent fee_paid_cents is ignored (not an accepted input field), so the ledger starts at 0."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - { call: "POST /expungement/petitioners", payload: { full_name: "Sys P", date_of_birth: "1990-01-01T00:00:00Z", annual_income_cents: 8000000, household_size: 1 }, as: Clerk, captures: { p: "$.data.id" } }
          assert:
            - "Petitioner.${p}.fee_paid_cents == 0 (server-owned ledger field)"

      - name: petition_missing_record_ids_returns_invalid_request
        claim_type: Required Fields
        grounds: [endpoints, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /petitions without the required record_ids field is rejected with ERR_VALIDATION (422)."
        test_recipe:
          setup: ["A petitioner exists."]
          setup_api_calls:
            - { call: "POST /expungement/petitioners", payload: { full_name: "Req P", date_of_birth: "1990-01-01T00:00:00Z", annual_income_cents: 8000000, household_size: 1 }, as: Clerk, captures: { p: "$.data.id" } }
          trigger:
            - { call: "POST /expungement/petitions", payload: { petitioner_id: "${p}", jurisdiction_code: "CA-01" }, as: Clerk, captures: { err: "$.data.error_id" } }
          assert:
            - "trigger response data.error_id == ERR_VALIDATION"

      - name: criminal_record_invalid_offense_class_enum
        claim_type: Type Constraints
        grounds: [entities.CriminalRecord.fields.offense_class, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /criminal-records with offense_class 'BOGUS' (not in the enum) is rejected with ERR_VALIDATION."
        test_recipe:
          setup: ["A petitioner exists."]
          setup_api_calls:
            - { call: "POST /expungement/petitioners", payload: { full_name: "Enum P", date_of_birth: "1990-01-01T00:00:00Z", annual_income_cents: 8000000, household_size: 1 }, as: Clerk, captures: { p: "$.data.id" } }
          trigger:
            - { call: "POST /expungement/criminal-records", payload: { petitioner_id: "${p}", offense_code: "PC-1", offense_class: "BOGUS", disposition: "CONVICTED", disposition_date: "2019-06-01T00:00:00Z", sentence_completion_date: "2020-01-01T00:00:00Z" }, as: Clerk, captures: { err: "$.data.error_id" } }
          assert:
            - "trigger response data.error_id == ERR_VALIDATION"

      - name: criminal_record_defaults_sentence_completion_null
        claim_type: Defaults
        grounds: [entities.CriminalRecord.fields.sentence_completion_date]
        distinguishing_aspect: "Omitting sentence_completion_date on a DISMISSED record leaves it null (optional input, default null)."
        test_recipe:
          setup: ["A petitioner exists."]
          setup_api_calls:
            - { call: "POST /expungement/petitioners", payload: { full_name: "Def P", date_of_birth: "1990-01-01T00:00:00Z", annual_income_cents: 8000000, household_size: 1 }, as: Clerk, captures: { p: "$.data.id" } }
          trigger:
            - { call: "POST /expungement/criminal-records", payload: { petitioner_id: "${p}", offense_code: "PC-2", offense_class: "MISDEMEANOR", disposition: "DISMISSED", disposition_date: "2020-01-01T00:00:00Z" }, as: Clerk, captures: { r: "$.data.id", scd: "$.data.sentence_completion_date" } }
          assert:
            - "CriminalRecord.${r}.sentence_completion_date == null"

      - name: get_petition_not_found
        claim_type: Not Found
        grounds: ["errors[ERR_PETITION_NOT_FOUND]"]
        distinguishing_aspect: "GET /petitions/{non-existent-uuid} returns ERR_PETITION_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - { call: "GET /expungement/petitions/00000000-0000-4000-8000-000000000000", payload: {}, as: Clerk, captures: { err: "$.data.error_id" } }
          assert:
            - "trigger response data.error_id == ERR_PETITION_NOT_FOUND"

      - name: get_courtroom_not_found_generic
        claim_type: Not Found
        grounds: ["errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /courtrooms/{non-existent-uuid} returns the generic ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - { call: "GET /expungement/courtrooms/00000000-0000-4000-8000-000000000001", payload: {}, as: Clerk, captures: { err: "$.data.error_id" } }
          assert:
            - "trigger response data.error_id == ERR_NOT_FOUND"

  # ------------------------------------------------------------ State machines
  - section: state_machines
    instances:
      - name: petition_initial_state_is_draft
        claim_type: Initial State
        grounds: [state_machines.Petition, entities.Petition.fields.status]
        distinguishing_aspect: "A freshly created petition has status == DRAFT."
        test_recipe:
          setup: ["A petitioner with one record exists."]
          setup_api_calls:
            - { call: "POST /expungement/petitioners", payload: { full_name: "Init P", date_of_birth: "1990-01-01T00:00:00Z", annual_income_cents: 8000000, household_size: 1 }, as: Clerk, captures: { p: "$.data.id" } }
            - { call: "POST /expungement/criminal-records", payload: { petitioner_id: "${p}", offense_code: "PC-1", offense_class: "MISDEMEANOR", disposition: "CONVICTED", disposition_date: "2019-06-01T00:00:00Z", sentence_completion_date: "2020-01-01T00:00:00Z" }, as: Clerk, captures: { r: "$.data.id" } }
          trigger:
            - { call: "POST /expungement/petitions", payload: { petitioner_id: "${p}", jurisdiction_code: "CA-01", record_ids: ["${r}"] }, as: Clerk, captures: { pet: "$.data.id", st: "$.data.status" } }
          assert:
            - "Petition.${pet}.status == DRAFT"

      - name: petition_screened_with_unscreened_record_rejected
        claim_type: Precondition Enforcement
        grounds: [state_machines.Petition.DRAFT_to_SCREENED, "errors[ERR_RECORDS_NOT_SCREENED]"]
        distinguishing_aspect: "SCREENED is rejected with ERR_RECORDS_NOT_SCREENED while one of the petition's records is still UNSCREENED."
        test_recipe:
          setup: ["Clock 2026-05-01. Petitioner with two records; only one screened. Petition covers both."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: Clerk }
            - { call: "POST /expungement/petitioners", payload: { full_name: "Uns P", date_of_birth: "1990-01-01T00:00:00Z", annual_income_cents: 8000000, household_size: 1 }, as: Clerk, captures: { p: "$.data.id" } }
            - { call: "POST /expungement/criminal-records", payload: { petitioner_id: "${p}", offense_code: "PC-1", offense_class: "MISDEMEANOR", disposition: "CONVICTED", disposition_date: "2019-06-01T00:00:00Z", sentence_completion_date: "2020-01-01T00:00:00Z" }, as: Clerk, captures: { r1: "$.data.id" } }
            - { call: "POST /expungement/criminal-records", payload: { petitioner_id: "${p}", offense_code: "PC-2", offense_class: "INFRACTION", disposition: "ARREST_ONLY", disposition_date: "2020-01-01T00:00:00Z" }, as: Clerk, captures: { r2: "$.data.id" } }
            - { call: "POST /expungement/criminal-records/${r1}/screen", payload: {}, as: Clerk }
            - { call: "POST /expungement/petitions", payload: { petitioner_id: "${p}", jurisdiction_code: "CA-01", record_ids: ["${r1}", "${r2}"] }, as: Clerk, captures: { pet: "$.data.id" } }
          trigger:
            - { call: "POST /expungement/petitions/${pet}/transition", payload: { to_status: "SCREENED" }, as: Clerk, captures: { err: "$.data.error_id" } }
          assert:
            - "trigger response data.error_id == ERR_RECORDS_NOT_SCREENED"

      - name: fee_waiver_grant_over_threshold_not_eligible
        claim_type: Precondition Enforcement
        grounds: [state_machines.FeeWaiver.REQUESTED_to_GRANTED, calculations.fee_waiver_determination, "errors[ERR_WAIVER_NOT_ELIGIBLE]"]
        distinguishing_aspect: "A waiver whose determination_basis is OVER_THRESHOLD (income 9,000,000 > threshold) cannot be GRANTED — ERR_WAIVER_NOT_ELIGIBLE."
        test_recipe:
          setup: ["Petitioner income 9,000,000 (over 125% line), household 1; a petition and a REQUESTED fee waiver exist."]
          setup_api_calls:
            - { call: "POST /expungement/petitioners", payload: { full_name: "Rich P", date_of_birth: "1990-01-01T00:00:00Z", annual_income_cents: 9000000, household_size: 1 }, as: Clerk, captures: { p: "$.data.id" } }
            - { call: "POST /expungement/criminal-records", payload: { petitioner_id: "${p}", offense_code: "PC-1", offense_class: "MISDEMEANOR", disposition: "CONVICTED", disposition_date: "2019-06-01T00:00:00Z", sentence_completion_date: "2020-01-01T00:00:00Z" }, as: Clerk, captures: { r: "$.data.id" } }
            - { call: "POST /expungement/petitions", payload: { petitioner_id: "${p}", jurisdiction_code: "CA-01", record_ids: ["${r}"] }, as: Clerk, captures: { pet: "$.data.id" } }
            - { call: "POST /expungement/fee-waivers", payload: { petitioner_id: "${p}", petition_id: "${pet}" }, as: Clerk, captures: { fw: "$.data.id", basis: "$.data.determination_basis" } }
          trigger:
            - { call: "POST /expungement/fee-waivers/${fw}/transition", payload: { to_status: "GRANTED" }, as: Clerk, captures: { err: "$.data.error_id" } }
          assert:
            - "FeeWaiver.${fw}.determination_basis == OVER_THRESHOLD"
            - "trigger response data.error_id == ERR_WAIVER_NOT_ELIGIBLE"

      - name: objection_after_deadline_window_closed
        claim_type: Precondition Enforcement
        grounds: [state_machines.AgencyNotification.SERVED_to_OBJECTED, "errors[ERR_OBJECTION_WINDOW_CLOSED]"]
        distinguishing_aspect: "Filing an objection after objection_deadline (served 2026-05-01, deadline 2026-05-31; clock advanced to 2026-06-15) returns ERR_OBJECTION_WINDOW_CLOSED."
        test_recipe:
          setup: ["FILED petition, one SERVED notification (deadline 2026-05-31); clock advanced to 2026-06-15."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: Clerk }
            - { call: "POST /expungement/petitioners", payload: { full_name: "Win P", date_of_birth: "1990-01-01T00:00:00Z", annual_income_cents: 9000000, household_size: 1 }, as: Clerk, captures: { p: "$.data.id" } }
            - { call: "POST /expungement/criminal-records", payload: { petitioner_id: "${p}", offense_code: "PC-1", offense_class: "MISDEMEANOR", disposition: "CONVICTED", disposition_date: "2019-06-01T00:00:00Z", sentence_completion_date: "2020-01-01T00:00:00Z" }, as: Clerk, captures: { r: "$.data.id" } }
            - { call: "POST /expungement/criminal-records/${r}/screen", payload: {}, as: Clerk }
            - { call: "POST /expungement/petitions", payload: { petitioner_id: "${p}", jurisdiction_code: "CA-01", record_ids: ["${r}"] }, as: Clerk, captures: { pet: "$.data.id" } }
            - { call: "POST /expungement/petitions/${pet}/transition", payload: { to_status: "SCREENED" }, as: Clerk }
            - { call: "POST /expungement/petitions/${pet}/pay-fee", payload: { amount_cents: 12900 }, as: Clerk }
            - { call: "POST /expungement/petitions/${pet}/transition", payload: { to_status: "FILED" }, as: Clerk }
            - { call: "GET /expungement/agency-notifications", payload: { petition_id: "${pet}" }, as: Clerk, captures: { n0: "$.data[0].id" } }
            - { call: "POST /expungement/agency-notifications/${n0}/transition", payload: { to_status: "SERVED" }, as: Clerk }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-15T00:00:00Z" }, as: Clerk }
          trigger:
            - { call: "POST /expungement/agency-notifications/${n0}/objections", payload: { grounds: "late" }, as: Agency, captures: { err: "$.data.error_id" } }
          assert:
            - "trigger response data.error_id == ERR_OBJECTION_WINDOW_CLOSED"

      - name: notification_clear_before_deadline_window_open
        claim_type: Precondition Enforcement
        grounds: [state_machines.AgencyNotification.SERVED_to_CLEARED, "errors[ERR_OBJECTION_WINDOW_OPEN]"]
        distinguishing_aspect: "Clearing a SERVED notification while the clock (2026-05-10) is still before objection_deadline (2026-05-31) returns ERR_OBJECTION_WINDOW_OPEN."
        test_recipe:
          setup: ["FILED petition; one notification SERVED at 2026-05-01 (deadline 2026-05-31); clock at 2026-05-10."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: Clerk }
            - { call: "POST /expungement/petitioners", payload: { full_name: "Open P", date_of_birth: "1990-01-01T00:00:00Z", annual_income_cents: 9000000, household_size: 1 }, as: Clerk, captures: { p: "$.data.id" } }
            - { call: "POST /expungement/criminal-records", payload: { petitioner_id: "${p}", offense_code: "PC-1", offense_class: "MISDEMEANOR", disposition: "CONVICTED", disposition_date: "2019-06-01T00:00:00Z", sentence_completion_date: "2020-01-01T00:00:00Z" }, as: Clerk, captures: { r: "$.data.id" } }
            - { call: "POST /expungement/criminal-records/${r}/screen", payload: {}, as: Clerk }
            - { call: "POST /expungement/petitions", payload: { petitioner_id: "${p}", jurisdiction_code: "CA-01", record_ids: ["${r}"] }, as: Clerk, captures: { pet: "$.data.id" } }
            - { call: "POST /expungement/petitions/${pet}/transition", payload: { to_status: "SCREENED" }, as: Clerk }
            - { call: "POST /expungement/petitions/${pet}/pay-fee", payload: { amount_cents: 12900 }, as: Clerk }
            - { call: "POST /expungement/petitions/${pet}/transition", payload: { to_status: "FILED" }, as: Clerk }
            - { call: "GET /expungement/agency-notifications", payload: { petition_id: "${pet}" }, as: Clerk, captures: { n0: "$.data[0].id" } }
            - { call: "POST /expungement/agency-notifications/${n0}/transition", payload: { to_status: "SERVED" }, as: Clerk }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-10T00:00:00Z" }, as: Clerk }
          trigger:
            - { call: "POST /expungement/agency-notifications/${n0}/transition", payload: { to_status: "CLEARED" }, as: Clerk, captures: { err: "$.data.error_id" } }
          assert:
            - "trigger response data.error_id == ERR_OBJECTION_WINDOW_OPEN"

      - name: distribution_retry_cap_max_attempts_exceeded
        claim_type: Precondition Enforcement
        grounds: [state_machines.SealingDistribution.FAILED_to_QUEUED, "errors[ERR_MAX_RETRIES_EXCEEDED]"]
        distinguishing_aspect: "After two successful retries (attempt_count reaches 2 == MAX_ATTEMPTS), a third FAILED->QUEUED retry is rejected with ERR_MAX_RETRIES_EXCEEDED."
        test_recipe:
          setup: ["A GRANTED order with 3 QUEUED agency distributions; take one distribution d."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: Clerk }
            - { call: "POST /expungement/courtrooms", payload: { name: "Room R", jurisdiction_code: "CA-01" }, as: Clerk, captures: { cr: "$.data.id" } }
            - { call: "POST /expungement/judges", payload: { name: "Judge R", jurisdiction_code: "CA-01" }, as: Clerk, captures: { jg: "$.data.id" } }
            - { call: "POST /expungement/petitioners", payload: { full_name: "Cap P", date_of_birth: "1990-01-01T00:00:00Z", annual_income_cents: 9000000, household_size: 1 }, as: Clerk, captures: { p: "$.data.id" } }
            - { call: "POST /expungement/criminal-records", payload: { petitioner_id: "${p}", offense_code: "PC-1", offense_class: "MISDEMEANOR", disposition: "CONVICTED", disposition_date: "2019-06-01T00:00:00Z", sentence_completion_date: "2020-01-01T00:00:00Z" }, as: Clerk, captures: { r: "$.data.id" } }
            - { call: "POST /expungement/criminal-records/${r}/screen", payload: {}, as: Clerk }
            - { call: "POST /expungement/petitions", payload: { petitioner_id: "${p}", jurisdiction_code: "CA-01", record_ids: ["${r}"] }, as: Clerk, captures: { pet: "$.data.id" } }
            - { call: "POST /expungement/petitions/${pet}/transition", payload: { to_status: "SCREENED" }, as: Clerk }
            - { call: "POST /expungement/petitions/${pet}/pay-fee", payload: { amount_cents: 12900 }, as: Clerk }
            - { call: "POST /expungement/petitions/${pet}/transition", payload: { to_status: "FILED" }, as: Clerk }
            - { call: "GET /expungement/agency-notifications", payload: { petition_id: "${pet}" }, as: Clerk, captures: { n0: "$.data[0].id", n1: "$.data[1].id", n2: "$.data[2].id" } }
            - { call: "POST /expungement/agency-notifications/${n0}/transition", payload: { to_status: "SERVED" }, as: Clerk }
            - { call: "POST /expungement/agency-notifications/${n1}/transition", payload: { to_status: "SERVED" }, as: Clerk }
            - { call: "POST /expungement/agency-notifications/${n2}/transition", payload: { to_status: "SERVED" }, as: Clerk }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: Clerk }
            - { call: "POST /expungement/agency-notifications/${n0}/transition", payload: { to_status: "CLEARED" }, as: Clerk }
            - { call: "POST /expungement/agency-notifications/${n1}/transition", payload: { to_status: "CLEARED" }, as: Clerk }
            - { call: "POST /expungement/agency-notifications/${n2}/transition", payload: { to_status: "CLEARED" }, as: Clerk }
            - { call: "GET /expungement/petitions/${pet}", payload: {}, as: Clerk, captures: { pv: "$.data.version" } }
            - { call: "POST /expungement/petitions/${pet}/hearings", payload: { courtroom_id: "${cr}", judge_id: "${jg}", scheduled_start: "2026-06-02T09:00:00Z", scheduled_end: "2026-06-02T10:00:00Z", expected_petition_version: "${pv}" }, as: Clerk, captures: { h: "$.data.id" } }
            - { call: "POST /expungement/hearings/${h}/transition", payload: { to_status: "HELD" }, as: Clerk }
            - { call: "POST /expungement/hearings/${h}/order", payload: { disposition: "GRANTED" }, as: Judge, captures: { co: "$.data.id" } }
            - { call: "GET /expungement/sealing-distributions", payload: { court_order_id: "${co}" }, as: Clerk, captures: { d: "$.data[0].id" } }
            - { call: "POST /expungement/sealing-distributions/${d}/transition", payload: { to_status: "SENT" }, as: Clerk }
            - { call: "POST /expungement/sealing-distributions/${d}/transition", payload: { to_status: "FAILED" }, as: Clerk }
            - { call: "POST /expungement/sealing-distributions/${d}/transition", payload: { to_status: "QUEUED" }, as: Clerk }
            - { call: "POST /expungement/sealing-distributions/${d}/transition", payload: { to_status: "SENT" }, as: Clerk }
            - { call: "POST /expungement/sealing-distributions/${d}/transition", payload: { to_status: "FAILED" }, as: Clerk }
            - { call: "POST /expungement/sealing-distributions/${d}/transition", payload: { to_status: "QUEUED" }, as: Clerk }
            - { call: "POST /expungement/sealing-distributions/${d}/transition", payload: { to_status: "SENT" }, as: Clerk }
            - { call: "POST /expungement/sealing-distributions/${d}/transition", payload: { to_status: "FAILED" }, as: Clerk }
          trigger:
            - { call: "POST /expungement/sealing-distributions/${d}/transition", payload: { to_status: "QUEUED" }, as: Clerk, captures: { err: "$.data.error_id" } }
          assert:
            - "SealingDistribution.${d}.attempt_count == 2 before the trigger"
            - "trigger response data.error_id == ERR_MAX_RETRIES_EXCEEDED"

  # ---------------------------------------------------------------- Validations
  - section: validations
    instances:
      - name: filing_fee_unpaid_isolated
        claim_type: Violation to Error
        grounds: ["validations[priority=11]", "errors[ERR_FILING_FEE_UNPAID]"]
        distinguishing_aspect: "A SCREENED petition with an ELIGIBLE record but zero paid and no waiver is rejected on FILED with ERR_FILING_FEE_UNPAID (402) — state and safety both pass, fiscal fires."
        test_recipe:
          setup: ["SCREENED petition, one ELIGIBLE record, no fee paid, no waiver."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: Clerk }
            - { call: "POST /expungement/petitioners", payload: { full_name: "Unp P", date_of_birth: "1990-01-01T00:00:00Z", annual_income_cents: 9000000, household_size: 1 }, as: Clerk, captures: { p: "$.data.id" } }
            - { call: "POST /expungement/criminal-records", payload: { petitioner_id: "${p}", offense_code: "PC-1", offense_class: "MISDEMEANOR", disposition: "CONVICTED", disposition_date: "2019-06-01T00:00:00Z", sentence_completion_date: "2020-01-01T00:00:00Z" }, as: Clerk, captures: { r: "$.data.id" } }
            - { call: "POST /expungement/criminal-records/${r}/screen", payload: {}, as: Clerk }
            - { call: "POST /expungement/petitions", payload: { petitioner_id: "${p}", jurisdiction_code: "CA-01", record_ids: ["${r}"] }, as: Clerk, captures: { pet: "$.data.id" } }
            - { call: "POST /expungement/petitions/${pet}/transition", payload: { to_status: "SCREENED" }, as: Clerk }
          trigger:
            - { call: "POST /expungement/petitions/${pet}/transition", payload: { to_status: "FILED" }, as: Clerk, captures: { err: "$.data.error_id" } }
          assert:
            - "trigger response data.error_id == ERR_FILING_FEE_UNPAID"

      - name: petition_record_not_owned_rejected
        claim_type: Cross-entity validation
        grounds: ["validations[priority=8]", "errors[ERR_RECORD_NOT_OWNED]"]
        distinguishing_aspect: "Assembling a petition for petitioner A that includes a record owned by petitioner B returns ERR_RECORD_NOT_OWNED."
        test_recipe:
          setup: ["Petitioner A and petitioner B; the record belongs to B."]
          setup_api_calls:
            - { call: "POST /expungement/petitioners", payload: { full_name: "Own A", date_of_birth: "1990-01-01T00:00:00Z", annual_income_cents: 9000000, household_size: 1 }, as: Clerk, captures: { pa: "$.data.id" } }
            - { call: "POST /expungement/petitioners", payload: { full_name: "Own B", date_of_birth: "1990-01-01T00:00:00Z", annual_income_cents: 9000000, household_size: 1 }, as: Clerk, captures: { pb: "$.data.id" } }
