# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 rule_ids x 2 instances = 18 instances. Grounds resolve into SCAFFOLD.yaml §1.1–§1.7.
# All formula-derived assert literals were computed against §1.3 formulas + constants.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: care_points_provisional_vs_frozen_on_assessment
        grounds:
          - calculations.care_points_total
          - entities.Assessment.fields.care_points_total
          - entities.Resident.fields.current_care_points
          - state_machines.Assessment.DRAFT_to_FINALIZED
        distinguishing_aspect: |
          On the Assessment domain: the provisional variant lives on the DRAFT Assessment
          (care_points_total == 30) while Resident.current_care_points is still 0; only the
          frozen variant (at finalize) copies 30 onto the Resident — two different observable
          numbers for the same inputs depending on lifecycle stage.
        test_recipe:
          setup:
            - "A facility and a PROSPECT resident exist."
            - "A DRAFT assessment with adl all 2 (sum 10), cognition 0, behavior 0 -> care_points_total 30, care_level LEVEL_2."
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "Maplewood", state_code: "CA", license_number: "CA-001", care_point_rate_cents: 1500 }
              as: Registrar
              captures: { fac_id: $.data.id }
            - call: "POST /residents"
              payload: { facility_id: "${fac_id}", full_name: "Ada Prospect", date_of_birth: "1940-05-01" }
              as: Registrar
              captures: { res_id: $.data.id, res_v0: $.data.version }
            - call: "POST /assessments"
              payload: { resident_id: "${res_id}", adl_bathing: 2, adl_dressing: 2, adl_toileting: 2, adl_transferring: 2, adl_eating: 2, cognition_score: 0, behavior_flags: 0 }
              as: ClinicalDirector
              captures: { asmt_id: $.data.id }
          trigger:
            - call: "GET /residents/${res_id}"
              payload: {}
              as: Staff
            - call: "POST /assessments/${asmt_id}/finalize"
              payload: { expected_resident_version: "${res_v0}" }
              as: ClinicalDirector
          assert:
            - "Before finalize: Assessment.${asmt_id}.care_points_total == 30 AND Resident.${res_id}.current_care_points == 0"
            - "After finalize: Assessment.${asmt_id}.care_points_total == 30 AND Resident.${res_id}.current_care_points == 30"
            - "After finalize: Resident.${res_id}.current_care_level == LEVEL_2 AND Resident.${res_id}.status == ASSESSED"

      - name: monthly_charge_full_vs_prorated_on_billing
        grounds:
          - calculations.monthly_charge
          - entities.BillingStatement.fields.total_charge_cents
          - entities.BillingStatement.fields.is_first_statement
          - state_machines.BillingStatement.DRAFT_to_ISSUED
        distinguishing_aspect: |
          On the BillingStatement domain (a different entity from care_points): identical resident
          care data and bed produce total_charge_cents 566870 for the first/prorated statement
          (Jan 2026, move-in day 10, plus 250000 community fee) vs 446500 for a later full-month
          statement — two valid algorithms, different cents.
        test_recipe:
          setup:
            - "Facility care_point_rate_cents 1500; AVAILABLE ASSISTED_LIVING unit base rent 401500."
            - "Resident finalized at LEVEL_2 with current_care_points 30 (care_month = 45000)."
            - "ACTIVE move-in agreement, move_in_date 2026-01-10, community_fee 250000."
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "Maplewood", state_code: "CA", license_number: "CA-002", care_point_rate_cents: 1500 }
              as: Registrar
              captures: { fac_id: $.data.id }
            - call: "POST /facilities/${fac_id}/units"
              payload: { unit_number: "101", wing: "ASSISTED_LIVING", monthly_base_rent_cents: 401500 }
              as: Registrar
              captures: { unit_id: $.data.id, unit_v0: $.data.version }
            - call: "POST /residents"
              payload: { facility_id: "${fac_id}", full_name: "Bob Billing", date_of_birth: "1938-02-02" }
              as: Registrar
              captures: { res_id: $.data.id, res_v0: $.data.version }
            - call: "POST /assessments"
              payload: { resident_id: "${res_id}", adl_bathing: 2, adl_dressing: 2, adl_toileting: 2, adl_transferring: 2, adl_eating: 2, cognition_score: 0, behavior_flags: 0 }
              as: ClinicalDirector
              captures: { asmt_id: $.data.id }
            - call: "POST /assessments/${asmt_id}/finalize"
              payload: { expected_resident_version: "${res_v0}" }
              as: ClinicalDirector
            - call: "POST /move-in-agreements"
              payload: { resident_id: "${res_id}", unit_id: "${unit_id}", move_in_date: "2026-01-10", community_fee_cents: 250000 }
              as: Registrar
              captures: { agr_id: $.data.id }
            - call: "POST /move-in-agreements/${agr_id}/activate"
              payload: { expected_unit_version: "${unit_v0}" }
              as: Registrar
            - call: "POST /residents/${res_id}/admit"
              payload: {}
              as: Registrar
            - call: "POST /billing-statements"
              payload: { resident_id: "${res_id}", period_year: 2026, period_month: 1, is_first_statement: true }
              as: BillingClerk
              captures: { stmt_first_id: $.data.id }
            - call: "POST /billing-statements"
              payload: { resident_id: "${res_id}", period_year: 2026, period_month: 2, is_first_statement: false }
              as: BillingClerk
              captures: { stmt_full_id: $.data.id }
          trigger:
            - call: "POST /billing-statements/${stmt_first_id}/issue"
              payload: {}
              as: BillingClerk
            - call: "POST /billing-statements/${stmt_full_id}/issue"
              payload: {}
              as: BillingClerk
          assert:
            - "BillingStatement.${stmt_first_id}.rent_charge_cents == 284935 AND care_points_charge_cents == 31935 AND community_fee_charge_cents == 250000 AND total_charge_cents == 566870"
            - "BillingStatement.${stmt_full_id}.rent_charge_cents == 401500 AND care_points_charge_cents == 45000 AND community_fee_charge_cents == 0 AND total_charge_cents == 446500"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: care_points_weighted_with_behavior_cap_mode_a
        grounds:
          - calculations.care_points_total
          - entities.Assessment.fields.behavior_flags
          - entities.Assessment.fields.care_points_total
        distinguishing_aspect: |
          Mode (a): >=3 inputs (adl_sum, cognition_score, behavior_flags) with a non-linear
          min(behavior_flags, 4) cap — behavior_flags 4 and 10 both contribute exactly 20 points,
          so care_points_total == 56 in both cases (not 30+6+50).
        test_recipe:
          setup:
            - "A facility and a PROSPECT resident exist."
            - "A DRAFT assessment: adl all 2 (sum10), cognition 3, behavior_flags 10."
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "Cedar", state_code: "CA", license_number: "CA-003", care_point_rate_cents: 2000 }
              as: Registrar
              captures: { fac_id: $.data.id }
            - call: "POST /residents"
              payload: { facility_id: "${fac_id}", full_name: "Cap Tester", date_of_birth: "1945-03-03" }
              as: Registrar
              captures: { res_id: $.data.id }
          trigger:
            - call: "POST /assessments"
              payload: { resident_id: "${res_id}", adl_bathing: 2, adl_dressing: 2, adl_toileting: 2, adl_transferring: 2, adl_eating: 2, cognition_score: 3, behavior_flags: 10 }
              as: ClinicalDirector
              captures: { asmt_id: $.data.id }
          assert:
            - "Assessment.${asmt_id}.care_points_total == 56"
            - "Assessment.${asmt_id}.care_level == LEVEL_3"

      - name: monthly_charge_round_per_line_then_sum_mode_b
        grounds:
          - calculations.monthly_charge
          - entities.BillingStatement.fields.rent_charge_cents
          - entities.BillingStatement.fields.care_points_charge_cents
        distinguishing_aspect: |
          Mode (b): the pinned rounding order is round-per-line-then-sum. For Jan 2026 (31 days),
          move-in day 10 (22 billable days), base 401500 and care_month 45000: per-line gives
          284935 + 31935 = 316870, whereas sum-then-round would give 316871 — the scaffold pins 316870.
        test_recipe:
          setup:
            - "Facility care_point_rate_cents 1500; AVAILABLE unit base rent 401500; resident LEVEL_2 cp 30; ACTIVE agreement move_in 2026-01-10 community_fee 0."
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "Birch", state_code: "CA", license_number: "CA-004", care_point_rate_cents: 1500 }
              as: Registrar
              captures: { fac_id: $.data.id }
            - call: "POST /facilities/${fac_id}/units"
              payload: { unit_number: "201", wing: "ASSISTED_LIVING", monthly_base_rent_cents: 401500 }
              as: Registrar
              captures: { unit_id: $.data.id, unit_v0: $.data.version }
            - call: "POST /residents"
              payload: { facility_id: "${fac_id}", full_name: "Rounding Rita", date_of_birth: "1939-04-04" }
              as: Registrar
              captures: { res_id: $.data.id, res_v0: $.data.version }
            - call: "POST /assessments"
              payload: { resident_id: "${res_id}", adl_bathing: 2, adl_dressing: 2, adl_toileting: 2, adl_transferring: 2, adl_eating: 2, cognition_score: 0, behavior_flags: 0 }
              as: ClinicalDirector
              captures: { asmt_id: $.data.id }
            - call: "POST /assessments/${asmt_id}/finalize"
              payload: { expected_resident_version: "${res_v0}" }
              as: ClinicalDirector
            - call: "POST /move-in-agreements"
              payload: { resident_id: "${res_id}", unit_id: "${unit_id}", move_in_date: "2026-01-10", community_fee_cents: 0 }
              as: Registrar
              captures: { agr_id: $.data.id }
            - call: "POST /move-in-agreements/${agr_id}/activate"
              payload: { expected_unit_version: "${unit_v0}" }
              as: Registrar
            - call: "POST /residents/${res_id}/admit"
              payload: {}
              as: Registrar
            - call: "POST /billing-statements"
              payload: { resident_id: "${res_id}", period_year: 2026, period_month: 1, is_first_statement: true }
              as: BillingClerk
              captures: { stmt_id: $.data.id }
          trigger:
            - call: "POST /billing-statements/${stmt_id}/issue"
              payload: {}
              as: BillingClerk
          assert:
            - "BillingStatement.${stmt_id}.rent_charge_cents == 284935"
            - "BillingStatement.${stmt_id}.care_points_charge_cents == 31935"
            - "BillingStatement.${stmt_id}.total_charge_cents == 316870"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: deficiency_poc_reject_resubmit_cycle
        grounds:
          - state_machines.SurveyDeficiency.POC_SUBMITTED_to_POC_REJECTED
          - state_machines.SurveyDeficiency.POC_REJECTED_to_POC_SUBMITTED
        distinguishing_aspect: |
          On SurveyDeficiency: a cyclic loop POC_SUBMITTED -> POC_REJECTED -> POC_SUBMITTED;
          the same deficiency re-enters POC_SUBMITTED after a rejection, proving a true cycle
          rather than a linear pipeline.
        test_recipe:
          setup:
            - "A facility with a CITED deficiency exists."
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "Oak", state_code: "FL", license_number: "FL-010", care_point_rate_cents: 2000 }
              as: ComplianceOfficer
              captures: { fac_id: $.data.id }
            - call: "POST /facilities/${fac_id}/deficiencies"
              payload: { tag_code: "F-880", scope_severity: "D_F_NO_HARM", cited_at: "2026-03-05T10:00:00Z" }
              as: ComplianceOfficer
              captures: { def_id: $.data.id }
            - call: "POST /facilities/${fac_id}/deficiencies/${def_id}/submit-poc"
              payload: { poc_text: "Initial corrective plan." }
              as: ComplianceOfficer
            - call: "POST /facilities/${fac_id}/deficiencies/${def_id}/review-poc"
              payload: { decision: "REJECT" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /facilities/${fac_id}/deficiencies/${def_id}/submit-poc"
              payload: { poc_text: "Revised corrective plan after rejection." }
              as: ComplianceOfficer
          assert:
            - "SurveyDeficiency.${def_id}.status == POC_SUBMITTED"
            - "SurveyDeficiency.${def_id}.poc_text == 'Revised corrective plan after rejection.'"

      - name: incident_branching_resolve_vs_escalate_fork
        grounds:
          - state_machines.IncidentReport.UNDER_INVESTIGATION_to_RESOLVED
          - state_machines.IncidentReport.UNDER_INVESTIGATION_to_ESCALATED
          - entities.IncidentReport.fields.linked_deficiency_id
        distinguishing_aspect: |
          On IncidentReport (a different entity from SurveyDeficiency): UNDER_INVESTIGATION forks
          to RESOLVED (no deficiency, linked_deficiency_id stays null) versus ESCALATED (spawns a
          SurveyDeficiency, linked_deficiency_id set) — divergent side-effect sets per branch.
        test_recipe:
          setup:
            - "Two SEVERE FALL incidents (state-reportable) under investigation for residents at one facility."
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "Pine", state_code: "FL", license_number: "FL-011", care_point_rate_cents: 2000 }
              as: Registrar
              captures: { fac_id: $.data.id }
            - call: "POST /residents"
              payload: { facility_id: "${fac_id}", full_name: "Inc One", date_of_birth: "1941-06-06" }
              as: Registrar
              captures: { res1_id: $.data.id }
            - call: "POST /residents"
              payload: { facility_id: "${fac_id}", full_name: "Inc Two", date_of_birth: "1942-07-07" }
              as: Registrar
              captures: { res2_id: $.data.id }
            - call: "POST /incident-reports"
              payload: { resident_id: "${res1_id}", incident_type: "FALL", occurred_at: "2026-03-01T08:00:00Z", severity: "SEVERE" }
              as: Nurse
              captures: { inc1_id: $.data.id }
            - call: "POST /incident-reports"
              payload: { resident_id: "${res2_id}", incident_type: "FALL", occurred_at: "2026-03-02T09:00:00Z", severity: "SEVERE" }
              as: Nurse
              captures: { inc2_id: $.data.id }
            - call: "POST /incident-reports/${inc1_id}/investigate"
              payload: {}
              as: Nurse
            - call: "POST /incident-reports/${inc2_id}/investigate"
              payload: {}
              as: Nurse
          trigger:
            - call: "POST /incident-reports/${inc1_id}/resolve"
              payload: {}
              as: Nurse
            - call: "POST /incident-reports/${inc2_id}/escalate"
              payload: { scope_severity: "G_I_ACTUAL_HARM", tag_code: "F-689", cited_at: "2026-03-03T10:00:00Z" }
              as: ComplianceOfficer
              captures: { inc2_def: $.data.linked_deficiency_id }
          assert:
            - "IncidentReport.${inc1_id}.status == RESOLVED AND IncidentReport.${inc1_id}.linked_deficiency_id == null"
            - "IncidentReport.${inc2_id}.status == ESCALATED AND IncidentReport.${inc2_id}.linked_deficiency_id != null"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: finalize_discharge_cascade_resident_unit_facility_depth3
        grounds:
          - state_machines.Resident.DISCHARGE_PENDING_to_DISCHARGED
          - state_machines.Unit.OCCUPIED_to_CLEANING
          - calculations.facility_occupancy
          - entities.Facility.fields.occupied_bed_count
        distinguishing_aspect: |
          Depth-3 chain from finalize-discharge: Resident -> DISCHARGED causes the bound Unit
          OCCUPIED -> CLEANING, and that Unit state change causes Facility.occupied_bed_count to
          drop 1 -> 0 and occupancy_rate_bps 10000 -> 0. Each link is caused by the prior one.
        test_recipe:
          setup:
            - "One facility with exactly one bed; one resident ADMITTED into it (occupied_bed_count 1, occupancy 10000); no balance; no active med orders; resident in DISCHARGE_PENDING."
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "Elm", state_code: "CA", license_number: "CA-020", care_point_rate_cents: 2000 }
              as: Registrar
              captures: { fac_id: $.data.id }
            - call: "POST /facilities/${fac_id}/units"
              payload: { unit_number: "301", wing: "ASSISTED_LIVING", monthly_base_rent_cents: 400000 }
              as: Registrar
              captures: { unit_id: $.data.id, unit_v0: $.data.version }
            - call: "POST /residents"
              payload: { facility_id: "${fac_id}", full_name: "Carl Cascade", date_of_birth: "1937-08-08" }
              as: Registrar
              captures: { res_id: $.data.id, res_v0: $.data.version }
            - call: "POST /assessments"
              payload: { resident_id: "${res_id}", adl_bathing: 1, adl_dressing: 1, adl_toileting: 1, adl_transferring: 1, adl_eating: 1, cognition_score: 0, behavior_flags: 0 }
              as: ClinicalDirector
              captures: { asmt_id: $.data.id }
            - call: "POST /assessments/${asmt_id}/finalize"
              payload: { expected_resident_version: "${res_v0}" }
              as: ClinicalDirector
            - call: "POST /move-in-agreements"
              payload: { resident_id: "${res_id}", unit_id: "${unit_id}", move_in_date: "2026-04-01", community_fee_cents: 0 }
              as: Registrar
              captures: { agr_id: $.data.id }
            - call: "POST /move-in-agreements/${agr_id}/activate"
              payload: { expected_unit_version: "${unit_v0}" }
              as: Registrar
            - call: "POST /residents/${res_id}/admit"
              payload: {}
              as: Registrar
            - call: "POST /residents/${res_id}/initiate-discharge"
              payload: {}
              as: Registrar
          trigger:
            - call: "POST /residents/${res_id}/finalize-discharge"
              payload: { disposition: "TRANSFER_TO_SNF" }
              as: Registrar
          assert:
            - "Resident.${res_id}.status == DISCHARGED AND discharge_disposition == TRANSFER_TO_SNF AND assigned_unit_id == null"
            - "Unit.${unit_id}.status == CLEANING AND current_resident_id == null"
            - "Facility.${fac_id}.occupied_bed_count == 0 AND occupancy_rate_bps == 0 AND bed_count == 1"

      - name: incident_escalate_cascade_incident_deficiency_facility
        grounds:
          - state_machines.IncidentReport.UNDER_INVESTIGATION_to_ESCALATED
          - entities.SurveyDeficiency.fields.status
          - calculations.poc_due_date
          - entities.Facility.fields.open_deficiency_count
        distinguishing_aspect: |
          A different trigger (incident escalate) drives a chain: IncidentReport -> ESCALATED
          causes a new SurveyDeficiency (CITED) to be created, and that creation causes
          Facility.open_deficiency_count to rise 0 -> 1; the spawned deficiency's poc_due_date is
          2026-03-13 (cited 2026-03-03 + 10 standard days).
        test_recipe:
          setup:
            - "A facility (open_deficiency_count 0) with a resident and a SEVERE FALL incident UNDER_INVESTIGATION."
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "Aspen", state_code: "FL", license_number: "FL-021", care_point_rate_cents: 2000 }
              as: Registrar
              captures: { fac_id: $.data.id }
            - call: "POST /residents"
              payload: { facility_id: "${fac_id}", full_name: "Esc Eddie", date_of_birth: "1943-09-09" }
              as: Registrar
              captures: { res_id: $.data.id }
            - call: "POST /incident-reports"
              payload: { resident_id: "${res_id}", incident_type: "FALL", occurred_at: "2026-03-02T08:00:00Z", severity: "SEVERE" }
              as: Nurse
              captures: { inc_id: $.data.id }
            - call: "POST /incident-reports/${inc_id}/investigate"
              payload: {}
              as: Nurse
          trigger:
            - call: "POST /incident-reports/${inc_id}/escalate"
              payload: { scope_severity: "D_F_NO_HARM", tag_code: "F-689", cited_at: "2026-03-03T10:00:00Z" }
              as: ComplianceOfficer
              captures: { def_id: $.data.linked_deficiency_id }
          assert:
            - "IncidentReport.${inc_id}.status == ESCALATED AND linked_deficiency_id == ${def_id}"
            - "SurveyDeficiency.${def_id}.status == CITED AND poc_due_date == '2026-03-13'"
            - "Facility.${fac_id}.open_deficiency_count == 1"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: admit_state_vs_license_safety_conflict
        grounds:
          - validations[priority=5]
          - validations[priority=13]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_LICENSE_SUSPENDED]
        distinguishing_aspect: |
          Error-category pair state (priority 5, ERR_INVALID_STATE) vs business_safety
          (priority 13, ERR_LICENSE_SUSPENDED). A PROSPECT resident (not ASSESSED) at a SUSPENDED
          facility violates both on admit; the lower priority number wins -> ERR_INVALID_STATE (409).
        test_recipe:
          setup:
            - "A SUSPENDED facility and a PROSPECT resident (never assessed) at that facility."
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "Willow", state_code: "CA", license_number: "CA-030", care_point_rate_cents: 2000 }
              as: ComplianceOfficer
              captures: { fac_id: $.data.id, fac_v0: $.data.version }
            - call: "POST /facilities/${fac_id}/license-action"
              payload: { action: "SUSPEND", expected_facility_version: "${fac_v0}" }
              as: ComplianceOfficer
            - call: "POST /residents"
              payload: { facility_id: "${fac_id}", full_name: "Pat Prospect", date_of_birth: "1944-10-10" }
              as: Registrar
              captures: { res_id: $.data.id }
          trigger:
            - call: "POST /residents/${res_id}/admit"
              payload: {}
              as: Registrar
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: activate_bed_temporal_vs_wing_safety_conflict
        grounds:
          - validations[priority=11]
          - validations[priority=12]
          - errors[ERR_BED_NOT_AVAILABLE]
          - errors[ERR_WING_MISMATCH]
        distinguishing_aspect: |
          A different error-category pair business_temporal (priority 11, ERR_BED_NOT_AVAILABLE)
          vs business_safety (priority 12, ERR_WING_MISMATCH). A MEMORY_CARE resident bound to an
          ASSISTED_LIVING unit that is also already RESERVED violates both on activate; priority 11
          wins -> ERR_BED_NOT_AVAILABLE (409).
        test_recipe:
          setup:
            - "Facility with one ASSISTED_LIVING unit already RESERVED by an activated agreement for resident A."
            - "MEMORY_CARE resident B (cognition 8 -> MEMORY_CARE) with a DRAFT agreement bound to that same RESERVED ASSISTED_LIVING unit."
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "Hazel", state_code: "CA", license_number: "CA-031", care_point_rate_cents: 2000 }
              as: Registrar
              captures: { fac_id: $.data.id }
            - call: "POST /facilities/${fac_id}/units"
              payload: { unit_number: "401", wing: "ASSISTED_LIVING", monthly_base_rent_cents: 400000 }
              as: Registrar
              captures: { unit_id: $.data.id, unit_v0: $.data.version }
            - call: "POST /residents"
              payload: { facility_id: "${fac_id}", full_name: "Res A", date_of_birth: "1936-01-01" }
              as: Registrar
              captures: { resa_id: $.data.id }
            - call: "POST /move-in-agreements"
              payload: { resident_id: "${resa_id}", unit_id: "${unit_id}", move_in_date: "2026-05-01", community_fee_cents: 0 }
              as: Registrar
              captures: { agra_id: $.data.id }
