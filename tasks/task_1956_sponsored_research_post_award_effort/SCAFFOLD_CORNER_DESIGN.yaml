            - { call: "POST /api/budget-lines", payload: { award_id: "${aw_s}", category: "TRAVEL", authorized_cents: 200000 }, as: GrantCoordinator, captures: { l_s: $.data.id } }
            - { call: "POST /api/budget-lines", payload: { award_id: "${aw_t}", category: "TRAVEL", authorized_cents: 100000 }, as: GrantCoordinator, captures: { l_t: $.data.id } }
            - { call: "POST /api/awards/${aw_s}/activate", payload: {}, as: SponsoredProgramsOfficer }
            - { call: "POST /api/awards/${aw_t}/activate", payload: {}, as: SponsoredProgramsOfficer }
            - { call: "POST /api/expenditures", payload: { award_id: "${aw_s}", budget_line_id: "${l_s}", expenditure_type: "TRAVEL", amount_cents: 100000, transaction_date: "2026-03-01T00:00:00Z", is_allocable: true, is_reasonable: true, is_consistent: true, cash_disbursed: true }, as: GrantCoordinator, captures: { e: $.data.id } }
            - { call: "POST /api/expenditures/${e}/post", payload: {}, as: GrantsAccountant }
            - { call: "POST /api/cost-transfers", payload: { source_expenditure_id: "${e}", target_award_id: "${aw_t}", target_budget_line_id: "${l_t}", justification: "late discovery of mischarged travel cost" }, as: GrantCoordinator, as_user_id: "gc-1", captures: { tr: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-10-31T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /api/cost-transfers/${tr}/submit", payload: { enhanced_justification: "error discovered during annual audit; charge originates from subrecipient misallocation documented in INV-7" }, as: GrantCoordinator, as_user_id: "gc-1", captures: { retro: $.data.is_retroactive, days: $.data.days_since_posting } }
          trigger:
            - { call: "POST /api/cost-transfers/${tr}/approve", payload: {}, as: GrantsAccountant, as_user_id: "ga-1", captures: { st1: $.data.status } }
            - { call: "GET /api/budget-lines/${l_t}", as: GrantsAccountant, captures: { spent_mid: $.data.spent_cents } }
            - { call: "POST /api/cost-transfers/${tr}/countersign", payload: {}, as: SponsoredProgramsOfficer, captures: { st2: $.data.status } }
            - { call: "GET /api/budget-lines/${l_t}", as: GrantsAccountant, captures: { spent_end: $.data.spent_cents } }
          assert:
            - "retro == true and days == 91  (exactly 90 would be timely)"
            - "st1 == PENDING_COUNTERSIGN and spent_mid == 0  (no ledger effect before countersign)"
            - "st2 == APPROVED and spent_end == 100000  (effects applied only by the second-role countersign)"

