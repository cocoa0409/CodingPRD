        distinguishing_aspect: "settlement for season 2026 scopes modules, bales, and ledger entries by season: an identical 2025 module contributes nothing — ginning_charge_cents is -5750, not -11500."
        test_recipe:
          setup: ["grower with module A in season 2025 (2025 shift) and module B in season 2026 (2026 shift); both net 10000 with one 500-lb bale; both ginned (charge 5750 each)"]
          setup_api_calls:
            - call: "POST /gin-ops/growers"
              payload: { membership_number: "MB-C36", legal_name: "Season Farm" }
              as: CoopAdmin
              captures: { g: $.data.id }
            - call: "POST /gin-ops/gin-shifts"
              payload: { season: "2025", stand_label: "STAND-S25" }
              as: GinOperator
              captures: { s25: $.data.id }
            - call: "POST /gin-ops/gin-shifts"
              payload: { season: "2026", stand_label: "STAND-S26" }
              as: GinOperator
              captures: { s26: $.data.id }
            - call: "POST /gin-ops/modules"
              payload: { grower_id: "${g}", season: "2025", ticket_number: "T-1", module_tag: "MT-25", gross_weight_lbs: 11000, tare_weight_lbs: 1000, moisture_pct: 8.0, foreign_matter_pct: 4.0 }
