          - errors.ERR_DELISTING_BLOCKED
        distinguishing_aspect: "A PANEL_REVIEWING appeal blocks delisting execution: execute-delisting during the live appeal fails 422 ERR_DELISTING_BLOCKED and the listing stays ACTIVE."
