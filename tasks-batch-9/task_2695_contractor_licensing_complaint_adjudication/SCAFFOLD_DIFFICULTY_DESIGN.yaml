  - rule_id: compensating_invariant
    instances:

      - name: recovery_fund_cash_is_conserved_across_a_payout_and_two_partial_repayments
        grounds:
          - state_machines.RecoveryFundClaim.APPROVED_to_PAID
          - state_machines.RecoveryFundClaim.PAID_to_REIMBURSED
          - endpoints[POST /licensing/licenses/{id}/recovery-repayments]
          - entities.RecoveryFundAccount.fields.balance_cents
          - entities.License.fields.outstanding_recovery_repayment_cents
          - concurrency_rules[license_write_occ]
        distinguishing_aspect: |
          Conserved quantity = MONEY: balance_cents + outstanding_recovery_repayment_cents must equal the
          account's 5000000 opening balance at every checkpoint — after the 900000 payout (4100000 + 900000),
          after a 400000 partial repayment (4500000 + 500000) and after the closing 500000 repayment
          (5000000 + 0). recovery_paid_to_date_cents is deliberately NOT part of the invariant: it is a
          non-reversing odometer that stays 900000 after the debt is cleared.
        test_recipe:
          setup:
            - "a 2027 fund account opening at 5000000 with per_claim_cap 1500000 and per_license_aggregate_cap 2000000"
            - "one C-20 licence issued 2026-08-01 with a VERIFIED 1000000 BOND for [2026-08-01, 2027-08-01)"
            - "at clock 2026-09-01 a complaint (contract 2026-02-05, work completed 2026-03-01) screens straight to INVESTIGATION"
            - "the consumer files a COURT_JUDGMENT claim for 900000 on a 1000000 judgment entered 2026-05-01, ripe because 2026-09-01 is more than 90 days later"
            - "the claim is APPROVED for min(900000, 1000000) - 0 = 900000 and then PAID out of the pool"
