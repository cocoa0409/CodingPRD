            - { call: "POST /change-orders/${co}/decide", payload: { decision: "APPROVE" }, as: Owner, as_user_id: "owner-1" }
          trigger:
            - { call: "GET /owner-reports/${rep}", payload: {}, as: OwnerRepPM, as_user_id: "pm-1", captures: { eac: $.data.eac_commitment_based_cents, st: $.data.status, at: $.data.accepted_at } }
          assert:
            - "st == ACCEPTED and at != null"
            - "eac == 4500000   # frozen snapshot: the CO approval (commitment now 4600000) did NOT rewrite an ACCEPTED report"

      - name: forecast_input_set_excludes_terminal_risks
        claim_type: input_set_filtering
        grounds:
          - "calculations.cost_to_complete_forecast"
        distinguishing_aspect: "The forecast input set filters risk exposures by status: a risk in ASSESSED contributes 200000, but after it is CLOSED a newly created report (different period) excludes it; the pre-close DRAFT report is untouched because risk close is not a fiscal-cascade refresh trigger."
        test_recipe:
          setup: ["Program ACTIVE (budget 10000000, contingency 1000000); R1 ASSESSED exposure 200000; report R-AUG for 2026-08 exists (eac_cb 200000)"]
          setup_api_calls:
