      - name: fund_posture_threshold_boundaries_around_the_statutory_deadline
        claim_type: threshold
        grounds:
          - calculations.fund_posture
          - entities.FeeProgram.fields.at_risk_window_days
          - entities.FeeProgram.fields.statutory_expenditure_deadline_years
        excluded_because:
          difficulty_instance: collection_becomes_refund_due_exactly_on_the_statutory_deadline
          rationale: "That instance walks the four threshold points of fund_posture (deadline minus at_risk_window minus a day, exactly at the at-risk boundary, a day before the deadline and exactly on it) on a single entry, which is the complete boundary set for this rule."

      - name: credit_waterfall_fills_the_first_category_before_the_second
        claim_type: waterfall_allocation
        grounds:
          - calculations.application_assessment
          - entities.FeeProgram.fields.credit_cap_bp
          - entities.DevelopmentApplication.fields.assessed_lines
        excluded_because:
          difficulty_instance: administrative_charge_rounds_per_line_then_sums
          rationale: "That instance drives the waterfall directly: two claims totalling 4900000 are capped to 2519185 and allocated by category code so PARKS absorbs 2500000 and ROADS receives only the 19185 remainder."

      - name: present_value_credit_discounts_each_contribution_year
        claim_type: decay_function
        grounds:
          - calculations.credit_claim_valuation
          - entities.FeeProgram.fields.discount_rate_bp
          - entities.CreditClaim.fields.contribution_years
        excluded_because:
          difficulty_instance: credit_claim_nominal_versus_present_value_valuation
          rationale: "That instance prices the same 10-year contribution stream both ways and asserts the discounted total and the delta, which is the decay curve claim for this calculation."

      - name: cost_allocation_variants_diverge_on_identical_inputs
        claim_type: variant_divergence
        grounds:
          - calculations.cost_per_demand_unit
          - entities.FeeStudy.fields.methodology
        excluded_because:
          difficulty_instance: cost_allocation_plan_based_versus_standard_based_on_identical_facts
          rationale: "That instance builds two studies over byte-identical component inputs and asserts both variant figures plus the divergent adopted figure and the resulting schedule fees."

      - name: credit_switch_reconciles_the_already_collected_fee
        claim_type: reconciliation
        grounds:
          - calculations.refund_amount
          - entities.DevelopmentApplication.fields.paid_cents
          - state_machines.FundLedgerEntry.OPEN_to_REFUNDED
        excluded_because:
          difficulty_instance: credit_approval_reassesses_paid_application_and_opens_overpayment_refund
          rationale: "That instance is the reconciliation claim: after the credit decision changes net_due on a fully paid application, the 1030000 delta is walked back out of the fund and both the application and the ledger are re-checked."

  # ===========================================================================
  - section: validations
    instances:
      - name: permit_number_uniqueness_is_scoped_to_one_program
        claim_type: violation_to_error
        grounds:
          - validations[priority=38]
          - errors.ERR_DUPLICATE_PERMIT_NUMBER
          - entities.DevelopmentApplication.fields.permit_number
        distinguishing_aspect: |
          The uniqueness rule is per FeeProgram, so the same permit number must be rejected
          inside HARBOR with 409 ERR_DUPLICATE_PERMIT_NUMBER and accepted inside SEAGATE.
          A globally unique index passes the first half and fails the second.
        test_recipe:
          setup:
            - "Two FeePrograms exist: HARBOR and SEAGATE."
            - "BP-1001 already exists under HARBOR, submitted by dev-1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-05T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /fee-programs"
              payload: { name: "City of Harbor Impact Fee Program", jurisdiction_code: "HARBOR" }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { prog_id: $.data.id, prog_v: $.data.version }
            - call: "POST /fee-programs"
              payload: { name: "City of Seagate Impact Fee Program", jurisdiction_code: "SEAGATE" }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { progb_id: $.data.id }
            - call: "POST /development-applications"
              payload: { fee_program_id: "${prog_id}", permit_number: "BP-1001", land_use_category: "SINGLE_FAMILY", collection_trigger: "PERMIT", dwelling_units: 10, nonres_sqft: 0 }
              as: Developer
              as_user_id: "dev-1"
              captures: { app_id: $.data.id }
          trigger:
            - call: "POST /development-applications"
              payload: { fee_program_id: "${prog_id}", permit_number: "BP-1001", land_use_category: "SINGLE_FAMILY", collection_trigger: "PERMIT", dwelling_units: 10, nonres_sqft: 0 }
              as: Developer
              as_user_id: "dev-1"
              captures: { None: $.data.id }
            - call: "POST /development-applications"
              payload: { fee_program_id: "${progb_id}", permit_number: "BP-1001", land_use_category: "SINGLE_FAMILY", collection_trigger: "PERMIT", dwelling_units: 10, nonres_sqft: 0 }
              as: Developer
              as_user_id: "dev-1"
          assert:
            - "The first call (HARBOR, BP-1001 again) returns HTTP 409 with error_id ERR_DUPLICATE_PERMIT_NUMBER and creates nothing."
            - "The second call (SEAGATE, BP-1001) returns HTTP 201 - uniqueness is scoped to fee_program_id."
            - "GET /development-applications?fee_program_id=<HARBOR> returns total_count 1 and the same query for SEAGATE returns total_count 1."
