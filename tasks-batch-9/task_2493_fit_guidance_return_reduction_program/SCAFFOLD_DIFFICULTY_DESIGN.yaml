            - "Vendor LOOP with a 10000-cent correction budget and one LISTED TOPS item."
            - "A SUBMITTED specification whose L chest is 926 mm, so the M->L chest delta is 46 against a declared increment of 40 and a resolved tolerance of 5 mm."
            - "The specification has been verified once, landing in CORRECTION_REQUESTED with violation_count 1 and revision_round 0."
