# =============================================================================
# SCAFFOLD.yaml — Veteran Program Enrollment, Benefits Navigation & Outcome
# Measurement (Wounded Warrior Project style). §1.0–§1.7.
# §1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml; §1.9 in SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  Veteran Program Enrollment, Benefits Navigation & Outcome Measurement (Wounded Warrior Project): registration of post-service injured veterans and family support members with eligibility verification of service era and injury connection, program enrollment across mental health, physical health, career counseling and independence services with intake assessments, benefits navigation assisting with disability claims, appeals and access to government health care with accredited representatives, mental health program delivery through intensive outpatient partnerships with clinical referral pathways, career counseling with employer partnerships and placement follow-up, community engagement events with registration, accessibility accommodations and travel support, outcome surveys measuring wellbeing and program effect with donor reporting, duplication avoidance with other veteran service organizations

domain_name: veteran-program-outcomes
api_prefix: /veteran-services

# =============================================================================
# §0 Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - rate_threshold_triggers
    - selector_policy
    - cascading_side_effects
  entity_topology: flat
  state_machine_shape: parallel
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate
  notes: |
    Flat topology: every resource is addressed at the collection root
    (/veteran-services/<collection>/{id}); parentage is carried by FK fields in
    request bodies, with sub-resource or filtered-list GETs for reverse lookup.
    Member carries two independent state dimensions (verification_status x
    engagement_status); EligibilityCase and BenefitsClaim run revision cycles;
    EventRegistration branches CONFIRMED/WAITLISTED with promotion.

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Member
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Legal name of the veteran or family support member" }
      - { name: member_type, type: enum, source: input, description: "VETERAN | FAMILY_SUPPORT" }
      - { name: branch_of_service, type: enum, source: input, description: "ARMY | NAVY | AIR_FORCE | MARINES | COAST_GUARD | SPACE_FORCE; must be null for FAMILY_SUPPORT members", default: null }
      - { name: service_era_claimed, type: enum, source: input, description: "POST_911 | PRE_911_GULF | VIETNAM_ERA | PEACETIME — self-reported era at registration" }
      - { name: injury_connection_claimed, type: enum, source: input, description: "SERVICE_CONNECTED | NON_SERVICE_CONNECTED — self-reported at registration" }
      - { name: verification_status, type: enum, source: system, description: "UNVERIFIED | VERIFIED — set only by an EligibilityCase decision", default: "UNVERIFIED" }
      - { name: verified_service_era, type: enum, source: system, description: "POST_911 | PRE_911_GULF | VIETNAM_ERA | PEACETIME; null until VERIFIED", default: null }
      - { name: verified_injury_connection, type: enum, source: system, description: "SERVICE_CONNECTED | NON_SERVICE_CONNECTED; null until VERIFIED", default: null }
      - { name: engagement_status, type: enum, source: computed, description: "INACTIVE | ENGAGED | GRADUATED — derived from the member's Enrollment states (see calculations.engagement_status_derivation)", default: "INACTIVE" }
      - { name: total_monthly_compensation_cents, type: integer, source: computed, description: "Sum of final_monthly_cents over the member's BenefitsClaims in status DECIDED or CLOSED", default: 0 }

  - name: EligibilityCase
    parent: Member
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; the member whose eligibility is under review" }
      - { name: status, type: enum, source: system, description: "UNDER_REVIEW | PENDED | VERIFIED | DENIED | SUPERSEDED", default: "UNDER_REVIEW" }
      - { name: pend_reason, type: string, source: input, description: "Why the case was pended (recorded on transition to PENDED)", default: null }
      - { name: denial_reason, type: string, source: input, description: "Why the case was denied (recorded on decision DENIED)", default: null }
      - { name: decided_at, type: datetime, source: system, description: "Logical-clock timestamp of the VERIFIED/DENIED decision; null until decided", default: null }

  - name: ExternalServiceRecord
    parent: Member
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; member receiving services elsewhere" }
      - { name: organization_name, type: string, source: input, description: "Name of the other veteran service organization" }
      - { name: service_category, type: enum, source: input, description: "MENTAL_HEALTH | PHYSICAL_HEALTH | CAREER | INDEPENDENCE | BENEFITS" }
      - { name: start_date, type: datetime, source: input, description: "When the external service engagement began" }
      - { name: end_date, type: datetime, source: input, description: "When it ends; null = open-ended", default: null }
      - { name: status, type: enum, source: system, description: "ACTIVE | CLOSED — auto-CLOSED by the clock sweep when the clock passes end_date", default: "ACTIVE" }

  - name: ProgramTrack
    parent: null
    common_fields: true
    fields:
      - { name: track_code, type: enum, source: input, description: "MENTAL_HEALTH | PHYSICAL_HEALTH | CAREER | INDEPENDENCE — unique across tracks" }
      - { name: name, type: string, source: input, description: "Display name of the program track" }
      - { name: capacity, type: integer, source: input, description: "Maximum number of seat-consuming enrollments; must be > 0" }
      - { name: active_enrollment_count, type: integer, source: computed, description: "Count of Enrollments on this track with status in {INTAKE, ACTIVE, SUSPENDED}", default: 0 }

  - name: Enrollment
    parent: Member
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; enrollee" }
      - { name: program_track_id, type: string, source: input, description: "FK -> ProgramTrack.id; track enrolled into" }
      - { name: status, type: enum, source: system, description: "INTAKE | ACTIVE | SUSPENDED | COMPLETED | WITHDRAWN", default: "INTAKE" }
      - { name: intensity_tier, type: enum, source: system, description: "STANDARD | ENHANCED | INTENSIVE — recomputed on every Assessment; null until the first assessment", default: null }
      - { name: latest_acuity_score, type: integer, source: system, description: "acuity_score of the most recent Assessment; null until the first assessment", default: null }
      - { name: coordination_consent, type: boolean, source: input, description: "Member consents to coordination with another veteran service organization that already serves them in this category", default: false }
      - { name: exit_disposition, type: enum, source: system, description: "COMPLETED | WITHDRAWN; null until exit", default: null }
      - { name: exit_reason, type: string, source: input, description: "Free-text reason recorded on exit", default: null }
      - { name: exit_at, type: datetime, source: system, description: "Logical-clock timestamp of exit; null until exit", default: null }

  - name: Assessment
    parent: Enrollment
    common_fields: false
    fields:
      - { name: enrollment_id, type: string, source: system, description: "FK -> Enrollment.id; taken from the URL path" }
      - { name: psych_score, type: integer, source: input, description: "Psychological domain score 0..10" }
      - { name: phys_score, type: integer, source: input, description: "Physical domain score 0..10" }
      - { name: voc_score, type: integer, source: input, description: "Vocational domain score 0..10" }
      - { name: soc_score, type: integer, source: input, description: "Social domain score 0..10" }
      - { name: notes, type: string, source: input, description: "Assessor notes", default: null }
      - { name: acuity_score, type: integer, source: computed, description: "0..100 — calculations.acuity_scoring" }
      - { name: tier_result, type: enum, source: computed, description: "STANDARD | ENHANCED | INTENSIVE — threshold mapping of acuity_score" }

  - name: BenefitsClaim
    parent: Member
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; claimant" }
      - { name: claim_type, type: enum, source: input, description: "DISABILITY_COMPENSATION | HEALTHCARE_ACCESS" }
      - { name: claimed_rating_pct, type: integer, source: input, description: "Claimed disability rating; required iff claim_type == DISABILITY_COMPENSATION; must be one of 0,10,...,100; must be null for HEALTHCARE_ACCESS", default: null }
      - { name: dependent_count, type: integer, source: input, description: "Dependents claimed for the award computation; >= 0", default: 0 }
      - { name: coordination_consent, type: boolean, source: input, description: "Consent to proceed despite an ACTIVE BENEFITS ExternalServiceRecord", default: false }
      - { name: provisional_monthly_cents, type: integer, source: computed, description: "Estimate at filing: base rate of claimed_rating_pct, no COLA, no dependents (calculations.compensation_monthly provisional variant); null for HEALTHCARE_ACCESS" }
      - { name: decided_rating_pct, type: integer, source: system, description: "Rating set by the deciding BenefitsOfficer; null until DECIDED", default: null }
      - { name: final_monthly_cents, type: integer, source: computed, description: "Final award: round_half_up((base(decided_rating_pct) + dependent_allowance) * (1 + COLA_RATE)); null until DECIDED; 0 when outcome == DENIED" , default: null }
      - { name: outcome, type: enum, source: system, description: "GRANTED | DENIED; null until DECIDED", default: null }
      - { name: decided_by_officer_id, type: string, source: system, description: "X-User-ID of the BenefitsOfficer who issued the most recent decision", default: null }
      - { name: decided_at, type: datetime, source: system, description: "Logical-clock timestamp of the most recent decision", default: null }
      - { name: status, type: enum, source: system, description: "FILED | DECIDED | APPEAL_PENDING | CLOSED", default: "FILED" }

  - name: Appeal
    parent: BenefitsClaim
    common_fields: true
    fields:
      - { name: claim_id, type: string, source: input, description: "FK -> BenefitsClaim.id; the claim under appeal" }
      - { name: grounds, type: string, source: input, description: "Free-text grounds for the appeal", default: null }
      - { name: status, type: enum, source: system, description: "OPEN | DECIDED", default: "OPEN" }
      - { name: outcome, type: enum, source: system, description: "UPHELD | OVERTURNED; null until decided", default: null }
      - { name: new_rating_pct, type: integer, source: input, description: "Replacement rating; required iff outcome == OVERTURNED; one of 0,10,...,100", default: null }
      - { name: filed_at, type: datetime, source: system, description: "Logical-clock timestamp of appeal creation" }
      - { name: decided_by_officer_id, type: string, source: system, description: "X-User-ID of the BenefitsOfficer who decided the appeal; must differ from the claim's decided_by_officer_id", default: null }
      - { name: decided_at, type: datetime, source: system, description: "Logical-clock timestamp of the appeal decision; null until decided", default: null }

  - name: Referral
    parent: Member
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; member referred to intensive outpatient care" }
      - { name: partner_site_id, type: string, source: system, description: "FK -> PartnerSite.id; null while PENDING_MATCH; assigned by calculations.site_selection", default: null }
      - { name: region, type: string, source: input, description: "Region the member can attend (matched against PartnerSite.region)" }
      - { name: required_specialty, type: enum, source: input, description: "PTSD | TBI | SUBSTANCE_USE | DEPRESSION" }
      - { name: treatment_start, type: datetime, source: input, description: "Planned treatment window start" }
      - { name: treatment_end, type: datetime, source: input, description: "Planned treatment window end; must be strictly after treatment_start" }
      - { name: coordination_consent, type: boolean, source: input, description: "Consent to proceed despite an ACTIVE MENTAL_HEALTH ExternalServiceRecord", default: false }
      - { name: request_seq, type: integer, source: system, description: "Globally monotonic sequence across all Referrals from 1, assigned at creation; deterministic re-match order key" }
      - { name: status, type: enum, source: system, description: "PENDING_MATCH | MATCHED | IN_TREATMENT | DISCHARGED | EXPIRED | SUPERSEDED", default: "PENDING_MATCH" }
      - { name: matched_at, type: datetime, source: system, description: "When the selector assigned a PartnerSite; null while PENDING_MATCH", default: null }
      - { name: admitted_at, type: datetime, source: system, description: "When the site admitted the member; null until IN_TREATMENT", default: null }
      - { name: discharged_at, type: datetime, source: system, description: "When treatment completed; null until DISCHARGED", default: null }

  - name: PartnerSite
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Intensive outpatient partner site name" }
      - { name: region, type: string, source: input, description: "Region served" }
      - { name: specialties, type: array, source: input, description: "Non-empty subset of [PTSD, TBI, SUBSTANCE_USE, DEPRESSION]" }
      - { name: capacity, type: integer, source: input, description: "Maximum concurrent patients; must be > 0" }
      - { name: current_census, type: integer, source: computed, description: "Count of Referrals matched to this site with status in {MATCHED, IN_TREATMENT}", default: 0 }

  - name: EmployerPartner
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Employer partner name" }
      - { name: industry, type: string, source: input, description: "Industry label" }
      - { name: open_requisitions, type: integer, source: input, description: "Currently fillable positions; >= 0; decremented on Placement creation, conditionally restored on early separation (calculations.requisition_restore)", default: 0 }

  - name: Placement
    parent: Member
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; placed member" }
      - { name: employer_partner_id, type: string, source: input, description: "FK -> EmployerPartner.id; hiring employer" }
      - { name: start_date, type: datetime, source: input, description: "Employment start; milestone clocks anchor here" }
      - { name: salary_cents, type: integer, source: input, description: "Annualized salary at placement; >= 0" }
      - { name: status, type: enum, source: system, description: "ACTIVE | MILESTONE_30 | MILESTONE_90 | MILESTONE_180 | RETAINED | SEPARATED", default: "ACTIVE" }
      - { name: separated_at, type: datetime, source: system, description: "When the placement separated; null until SEPARATED", default: null }

  - name: CommunityEvent
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Event name" }
      - { name: starts_at, type: datetime, source: input, description: "Event start (logical clock comparable)" }
      - { name: ends_at, type: datetime, source: input, description: "Event end; must be strictly after starts_at" }
      - { name: capacity, type: integer, source: input, description: "Maximum CONFIRMED registrations; must be > 0" }
      - { name: accessibility_seat_count, type: integer, source: input, description: "Seats that can honor accommodation_needs; >= 0 and <= capacity" }
      - { name: travel_budget_cents, type: integer, source: input, description: "Total travel support pool; >= 0" }
      - { name: registered_count, type: integer, source: computed, description: "Count of EventRegistrations in status CONFIRMED", default: 0 }
      - { name: accessibility_seats_used, type: integer, source: computed, description: "Count of CONFIRMED registrations with non-empty accommodation_needs", default: 0 }
      - { name: travel_budget_remaining_cents, type: integer, source: computed, description: "travel_budget_cents minus travel_award_cents over non-CANCELLED registrations", default: 0 }

  - name: EventRegistration
    parent: Member
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; registrant" }
      - { name: community_event_id, type: string, source: input, description: "FK -> CommunityEvent.id; target event" }
      - { name: accommodation_needs, type: array, source: input, description: "Subset of [WHEELCHAIR, ASL_INTERPRETER, SERVICE_ANIMAL, SENSORY_FRIENDLY]", default: [] }
      - { name: travel_request_cents, type: integer, source: input, description: "Travel support requested; >= 0", default: 0 }
      - { name: travel_award_cents, type: integer, source: computed, description: "Award granted at CONFIRMED time: min(travel_request_cents, PER_REGISTRATION_TRAVEL_CAP_CENTS, travel_budget_remaining_cents); 0 while WAITLISTED", default: 0 }
      - { name: queue_position, type: integer, source: system, description: "Per-event monotonic sequence from 1 assigned at creation; waitlist promotion order key (unique, gap-free per event)" }
      - { name: status, type: enum, source: system, description: "CONFIRMED | WAITLISTED | CANCELLED | ATTENDED | NO_SHOW | EXPIRED" }

  - name: OutcomeSurvey
    parent: Enrollment
    common_fields: true
    fields:
      - { name: enrollment_id, type: string, source: system, description: "FK -> Enrollment.id; surveys are system-created, never client-created" }
      - { name: wave, type: enum, source: system, description: "BASELINE | EXIT | FOLLOWUP_90 — see calculations.survey_window_schedule" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | OPEN | SUBMITTED | EXPIRED", default: "SCHEDULED" }
      - { name: window_open_at, type: datetime, source: system, description: "Window start (inclusive)" }
      - { name: window_close_at, type: datetime, source: system, description: "Window end (inclusive)" }
      - { name: q1, type: integer, source: input, description: "Wellbeing item 1, Likert 1..5; set at submit", default: null }
      - { name: q2, type: integer, source: input, description: "Wellbeing item 2, Likert 1..5; set at submit", default: null }
      - { name: q3, type: integer, source: input, description: "Wellbeing item 3, Likert 1..5; set at submit", default: null }
      - { name: q4, type: integer, source: input, description: "Wellbeing item 4, Likert 1..5; set at submit", default: null }
      - { name: q5, type: integer, source: input, description: "Wellbeing item 5, Likert 1..5; set at submit", default: null }
      - { name: wellbeing_score, type: integer, source: computed, description: "(q1+q2+q3+q4+q5) * 4, range 20..100; null until SUBMITTED", default: null }
      - { name: submitted_at, type: datetime, source: system, description: "Logical-clock submit timestamp; null until SUBMITTED", default: null }

  - name: DonorReport
    parent: null
    common_fields: false
    fields:
      - { name: period_start, type: datetime, source: input, description: "Cohort window start (inclusive) — matches Enrollment.exit_at" }
      - { name: period_end, type: datetime, source: input, description: "Cohort window end (inclusive) — matches Enrollment.exit_at; must be >= period_start" }
      - { name: methodology, type: enum, source: input, description: "ITT | COMPLETER — calculations.program_effect_reporting" }
      - { name: track_weights, type: object, source: input, description: "Optional {track_code: weight} map; weights must sum to exactly 1.0; omitted = cohort-size-proportional weights", default: null }
      - { name: cohort_size_total, type: integer, source: computed, description: "Members counted across all included tracks" }
      - { name: per_track, type: array, source: computed, description: "[{track_code, cohort_size, effect}] — effect rounded to 2 decimal places per track BEFORE weighting" }
      - { name: overall_effect, type: number, source: computed, description: "round_half_up(sum(weight_i * per_track_effect_i), 2)" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  # --- Member dimension 1 of 2: verification_status ---
  - entity: Member
    field: verification_status
    initial_state: UNVERIFIED
    terminal_states: []
    transitions:
      - from: UNVERIFIED
        to: VERIFIED
        trigger: "system (EligibilityCase decision VERIFIED via POST /veteran-services/eligibility-cases/{case_id}/transition)"
        actor: system
        preconditions:
          - "deciding EligibilityCase.status == UNDER_REVIEW"
        side_effects:
          - "Member.verified_service_era := case payload verified_service_era"
          - "Member.verified_injury_connection := case payload verified_injury_connection"
          - "increments Member.version by 1"

  # --- Member dimension 2 of 2: engagement_status (independent of dimension 1) ---
  - entity: Member
    field: engagement_status
    initial_state: INACTIVE
    terminal_states: []
    transitions:
      - from: INACTIVE
        to: ENGAGED
        trigger: "system (first Enrollment for the member enters INTAKE)"
        actor: system
        preconditions:
          - "member has >= 1 Enrollment with status in {INTAKE, ACTIVE, SUSPENDED}"
        side_effects: ["increments Member.version by 1"]
      - from: ENGAGED
        to: GRADUATED
        trigger: "system (an Enrollment exits with disposition COMPLETED)"
        actor: system
        preconditions:
          - "after the exit, member has 0 Enrollments in {INTAKE, ACTIVE, SUSPENDED} and >= 1 in COMPLETED"
        side_effects: ["increments Member.version by 1"]
      - from: ENGAGED
        to: INACTIVE
        trigger: "system (an Enrollment exits with disposition WITHDRAWN)"
        actor: system
        preconditions:
          - "after the exit, member has 0 Enrollments in {INTAKE, ACTIVE, SUSPENDED} and 0 in COMPLETED"
        side_effects: ["increments Member.version by 1"]
      - from: GRADUATED
        to: ENGAGED
        trigger: "system (a new Enrollment is created for the member)"
        actor: system
        preconditions:
          - "the new Enrollment is in INTAKE"
        side_effects: ["increments Member.version by 1"]

  - entity: EligibilityCase
    initial_state: UNDER_REVIEW
    terminal_states: [VERIFIED, DENIED, SUPERSEDED]
    transitions:
      - from: UNDER_REVIEW
        to: PENDED
        trigger: "POST /veteran-services/eligibility-cases/{case_id}/transition with target_status=PENDED"
        actor: IntakeCoordinator
        preconditions:
          - "case.status == UNDER_REVIEW (ERR_INVALID_STATE)"
        side_effects: ["case.pend_reason := payload pend_reason"]
      - from: PENDED
        to: UNDER_REVIEW
        trigger: "POST /veteran-services/eligibility-cases/{case_id}/transition with target_status=UNDER_REVIEW"
        actor: IntakeCoordinator
        preconditions:
          - "case.status == PENDED (ERR_INVALID_STATE)"
        side_effects: []
      - from: UNDER_REVIEW
        to: VERIFIED
        trigger: "POST /veteran-services/eligibility-cases/{case_id}/transition with target_status=VERIFIED"
        actor: IntakeCoordinator
        preconditions:
          - "case.status == UNDER_REVIEW (ERR_INVALID_STATE)"
          - "eligibility policy: verified_service_era == POST_911, and (member.member_type == FAMILY_SUPPORT or verified_injury_connection == SERVICE_CONNECTED) (ERR_ELIGIBILITY_CRITERIA_NOT_MET)"
        side_effects:
          - "Member.verification_status := VERIFIED; verified_service_era and verified_injury_connection copied to Member"
          - "case.decided_at := logical clock"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /veteran-services/eligibility-cases/{case_id}/transition with target_status=DENIED"
        actor: IntakeCoordinator
        preconditions:
          - "case.status == UNDER_REVIEW (ERR_INVALID_STATE)"
        side_effects:
          - "case.denial_reason := payload denial_reason; case.decided_at := logical clock"
          - "Member.verification_status unchanged (stays UNVERIFIED unless already VERIFIED by an earlier case)"
      - from: UNDER_REVIEW
        to: SUPERSEDED
        trigger: "system (a new EligibilityCase is created for the same member)"
        actor: system
        preconditions:
          - "the superseded case is in UNDER_REVIEW or PENDED"
        side_effects: []
      - from: PENDED
        to: SUPERSEDED
        trigger: "system (a new EligibilityCase is created for the same member)"
        actor: system
        preconditions:
          - "the superseded case is in UNDER_REVIEW or PENDED"
        side_effects: []

  - entity: Enrollment
    initial_state: INTAKE
    terminal_states: [COMPLETED, WITHDRAWN]
    transitions:
      - from: INTAKE
        to: ACTIVE
        trigger: "system (first Assessment is recorded for the enrollment via POST /veteran-services/enrollments/{enrollment_id}/assessments)"
        actor: system
        preconditions: []
        side_effects:
          - "Enrollment.intensity_tier := assessment.tier_result; latest_acuity_score := assessment.acuity_score"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /veteran-services/enrollments/{enrollment_id}/transition with target_status=SUSPENDED"
        actor: IntakeCoordinator
        preconditions:
          - "enrollment.status == ACTIVE (ERR_INVALID_STATE)"
        side_effects: []
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /veteran-services/enrollments/{enrollment_id}/transition with target_status=ACTIVE"
        actor: IntakeCoordinator
        preconditions:
          - "enrollment.status == SUSPENDED (ERR_INVALID_STATE)"
        side_effects: []
      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /veteran-services/enrollments/{enrollment_id}/transition with target_status=COMPLETED"
        actor: IntakeCoordinator
        preconditions:
          - "enrollment.status == ACTIVE (ERR_INVALID_STATE)"
        side_effects:
          - "exit_disposition := COMPLETED; exit_at := logical clock; exit_reason := payload exit_reason"
          - "ProgramTrack.active_enrollment_count -= 1"
          - "system creates OutcomeSurvey wave=EXIT with window [exit_at, exit_at + EXIT_WINDOW_DAYS]"
          - "system creates OutcomeSurvey wave=FOLLOWUP_90 with window [exit_at + (FOLLOWUP_90_OFFSET_DAYS - FOLLOWUP_GRACE_DAYS), exit_at + (FOLLOWUP_90_OFFSET_DAYS + FOLLOWUP_GRACE_DAYS)]"
          - "Member.engagement_status recomputed (may ENGAGED -> GRADUATED)"
      - from: INTAKE
        to: WITHDRAWN
        trigger: "POST /veteran-services/enrollments/{enrollment_id}/transition with target_status=WITHDRAWN"
        actor: IntakeCoordinator
        preconditions:
          - "enrollment.status in {INTAKE, ACTIVE, SUSPENDED} (ERR_INVALID_STATE)"
        side_effects:
          - "exit_disposition := WITHDRAWN; exit_at := logical clock"
          - "ProgramTrack.active_enrollment_count -= 1"
          - "no OutcomeSurvey rows are created for a WITHDRAWN enrollment"
          - "Member.engagement_status recomputed (may ENGAGED -> INACTIVE)"
      - from: ACTIVE
        to: WITHDRAWN
        trigger: "POST /veteran-services/enrollments/{enrollment_id}/transition with target_status=WITHDRAWN"
        actor: IntakeCoordinator
        preconditions:
          - "enrollment.status in {INTAKE, ACTIVE, SUSPENDED} (ERR_INVALID_STATE)"
        side_effects: ["same as INTAKE -> WITHDRAWN"]
      - from: SUSPENDED
        to: WITHDRAWN
        trigger: "POST /veteran-services/enrollments/{enrollment_id}/transition with target_status=WITHDRAWN"
        actor: IntakeCoordinator
        preconditions:
          - "enrollment.status in {INTAKE, ACTIVE, SUSPENDED} (ERR_INVALID_STATE)"
        side_effects: ["same as INTAKE -> WITHDRAWN"]

  - entity: BenefitsClaim
    initial_state: FILED
    terminal_states: [CLOSED]
    transitions:
      - from: FILED
        to: DECIDED
        trigger: "POST /veteran-services/claims/{claim_id}/decide"
        actor: BenefitsOfficer
        preconditions:
          - "claim.status == FILED (ERR_INVALID_STATE)"
        side_effects:
          - "claim.outcome := payload outcome; decided_rating_pct := payload decided_rating_pct (0 when outcome == DENIED)"
          - "claim.final_monthly_cents := compensation_monthly final variant; decided_by_officer_id := X-User-ID; decided_at := logical clock"
          - "Member.total_monthly_compensation_cents recomputed; increments Member.version by 1"
      - from: DECIDED
        to: APPEAL_PENDING
        trigger: "system (an Appeal is created for this claim via POST /veteran-services/appeals)"
        actor: system
        preconditions:
          - "claim.status == DECIDED (ERR_CLAIM_NOT_APPEALABLE)"
          - "claim.claim_type == DISABILITY_COMPENSATION (ERR_CLAIM_TYPE_NOT_APPEALABLE)"
          - "logical clock <= claim.decided_at + APPEAL_WINDOW_DAYS days (ERR_APPEAL_WINDOW_CLOSED)"
        side_effects: []
      - from: APPEAL_PENDING
        to: DECIDED
        trigger: "system (the open Appeal is decided via POST /veteran-services/appeals/{appeal_id}/decide)"
        actor: system
        preconditions:
          - "appeal.status == OPEN"
        side_effects:
          - "if appeal.outcome == OVERTURNED: claim.decided_rating_pct := appeal.new_rating_pct; claim.final_monthly_cents recomputed (final variant); claim.decided_by_officer_id := appeal.decided_by_officer_id"
          - "claim.decided_at := appeal.decided_at (appeal window re-anchors to the new decision)"
          - "Member.total_monthly_compensation_cents recomputed; increments Member.version by 1"
      - from: DECIDED
        to: CLOSED
        trigger: "system (clock sweep: logical clock > decided_at + (APPEAL_WINDOW_DAYS + CLAIM_CLOSE_GRACE_DAYS) days)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Appeal
    initial_state: OPEN
    terminal_states: [DECIDED]
    transitions:
      - from: OPEN
        to: DECIDED
        trigger: "POST /veteran-services/appeals/{appeal_id}/decide"
        actor: BenefitsOfficer
        preconditions:
          - "appeal.status == OPEN (ERR_INVALID_STATE)"
          - "X-User-ID != claim.decided_by_officer_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "appeal.outcome := payload outcome; decided_by_officer_id := X-User-ID; decided_at := logical clock"
          - "claim returns APPEAL_PENDING -> DECIDED (see BenefitsClaim machine) with rating/compensation recomputation when OVERTURNED"

  - entity: Referral
    initial_state: PENDING_MATCH
    terminal_states: [DISCHARGED, EXPIRED, SUPERSEDED]
    transitions:
      - from: PENDING_MATCH
        to: MATCHED
        trigger: "system (calculations.site_selection finds a candidate at creation time, or calculations.waitlist-style re-match fires when a discharge frees a compatible PartnerSite)"
        actor: system
        preconditions:
          - "selected PartnerSite: region == referral.region AND required_specialty in specialties AND current_census < capacity"
        side_effects:
          - "referral.partner_site_id := selected site; matched_at := logical clock"
          - "PartnerSite.current_census += 1"
      - from: PENDING_MATCH
        to: SUPERSEDED
        trigger: "system (a new Referral is created for the same member while this one is PENDING_MATCH)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PENDING_MATCH
        to: EXPIRED
        trigger: "system (clock sweep: logical clock > treatment_start)"
        actor: system
        preconditions: []
        side_effects: []
      - from: MATCHED
        to: IN_TREATMENT
        trigger: "POST /veteran-services/referrals/{referral_id}/transition with action=ADMIT"
        actor: ClinicalPartner
        preconditions:
          - "referral.status == MATCHED (ERR_INVALID_STATE)"
          - "referral.partner_site_id == X-User-ID (ERR_RESOURCE_NOT_OWNED)"
        side_effects: ["admitted_at := logical clock"]
      - from: IN_TREATMENT
        to: DISCHARGED
        trigger: "POST /veteran-services/referrals/{referral_id}/transition with action=DISCHARGE"
        actor: ClinicalPartner
        preconditions:
          - "referral.status == IN_TREATMENT (ERR_INVALID_STATE)"
          - "referral.partner_site_id == X-User-ID (ERR_RESOURCE_NOT_OWNED)"
        side_effects:
          - "discharged_at := logical clock"
          - "PartnerSite.current_census -= 1"
          - "the freed site then offers the slot to the eligible PENDING_MATCH referral with the smallest request_seq (region == site.region and required_specialty in site.specialties); that referral transitions PENDING_MATCH -> MATCHED to this site and current_census += 1"

  - entity: Placement
    initial_state: ACTIVE
    terminal_states: [RETAINED, SEPARATED]
    transitions:
      - from: ACTIVE
        to: MILESTONE_30
        trigger: "POST /veteran-services/placements/{placement_id}/transition with action=CONFIRM_MILESTONE, milestone=DAY_30"
        actor: CareerCounselor
        preconditions:
          - "placement.status == ACTIVE (ERR_INVALID_STATE)"
          - "logical clock >= start_date + 30 days (ERR_MILESTONE_TOO_EARLY)"
        side_effects: []
      - from: MILESTONE_30
        to: MILESTONE_90
        trigger: "POST /veteran-services/placements/{placement_id}/transition with action=CONFIRM_MILESTONE, milestone=DAY_90"
        actor: CareerCounselor
        preconditions:
          - "placement.status == MILESTONE_30 (ERR_INVALID_STATE)"
          - "logical clock >= start_date + 90 days (ERR_MILESTONE_TOO_EARLY)"
        side_effects: []
      - from: MILESTONE_90
        to: MILESTONE_180
        trigger: "POST /veteran-services/placements/{placement_id}/transition with action=CONFIRM_MILESTONE, milestone=DAY_180"
        actor: CareerCounselor
        preconditions:
          - "placement.status == MILESTONE_90 (ERR_INVALID_STATE)"
          - "logical clock >= start_date + 180 days (ERR_MILESTONE_TOO_EARLY)"
        side_effects: []
      - from: MILESTONE_180
        to: RETAINED
        trigger: "system (the DAY_180 milestone confirmation transitions straight through: MILESTONE_180 -> RETAINED is the same confirm action when the milestone is DAY_180)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: SEPARATED
        trigger: "POST /veteran-services/placements/{placement_id}/transition with action=SEPARATE"
        actor: CareerCounselor
        preconditions:
          - "placement.status in {ACTIVE, MILESTONE_30, MILESTONE_90, MILESTONE_180} (ERR_INVALID_STATE)"
        side_effects:
          - "separated_at := logical clock"
          - "if placement.status before separation in {ACTIVE, MILESTONE_30}: EmployerPartner.open_requisitions += 1 (calculations.requisition_restore); at MILESTONE_90 or later: no restore"
      - from: MILESTONE_30
        to: SEPARATED
        trigger: "POST /veteran-services/placements/{placement_id}/transition with action=SEPARATE"
        actor: CareerCounselor
        preconditions: ["placement.status in {ACTIVE, MILESTONE_30, MILESTONE_90, MILESTONE_180} (ERR_INVALID_STATE)"]
        side_effects: ["same as ACTIVE -> SEPARATED (restore applies from MILESTONE_30)"]
      - from: MILESTONE_90
        to: SEPARATED
        trigger: "POST /veteran-services/placements/{placement_id}/transition with action=SEPARATE"
        actor: CareerCounselor
        preconditions: ["placement.status in {ACTIVE, MILESTONE_30, MILESTONE_90, MILESTONE_180} (ERR_INVALID_STATE)"]
        side_effects: ["same transition; NO requisition restore from MILESTONE_90 onward"]
      - from: MILESTONE_180
        to: SEPARATED
        trigger: "POST /veteran-services/placements/{placement_id}/transition with action=SEPARATE"
        actor: CareerCounselor
        preconditions: ["placement.status in {ACTIVE, MILESTONE_30, MILESTONE_90, MILESTONE_180} (ERR_INVALID_STATE)"]
        side_effects: ["same transition; NO requisition restore"]

  - entity: EventRegistration
    initial_state: "CONFIRMED or WAITLISTED (capacity logic at creation — calculations.registration_seating)"
    terminal_states: [CANCELLED, ATTENDED, NO_SHOW, EXPIRED]
    transitions:
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /veteran-services/event-registrations/{registration_id}/transition with action=CANCEL"
        actor: "EventCoordinator | IntakeCoordinator"
        preconditions:
          - "registration.status in {CONFIRMED, WAITLISTED} (ERR_INVALID_STATE)"
        side_effects:
          - "CommunityEvent.registered_count -= 1; if accommodation_needs non-empty: accessibility_seats_used -= 1"
          - "CommunityEvent.travel_budget_remaining_cents += registration.travel_award_cents"
          - "the freed seat triggers calculations.waitlist_promotion: earliest-created WAITLISTED registration whose accommodation needs fit the now-available seats is promoted to CONFIRMED; the promoted registration's travel_award_cents := min(travel_request_cents, PER_REGISTRATION_TRAVEL_CAP_CENTS, travel_budget_remaining_cents) and the budget is debited"
      - from: WAITLISTED
        to: CANCELLED
        trigger: "POST /veteran-services/event-registrations/{registration_id}/transition with action=CANCEL"
        actor: "EventCoordinator | IntakeCoordinator"
        preconditions:
          - "registration.status in {CONFIRMED, WAITLISTED} (ERR_INVALID_STATE)"
        side_effects: ["no seat or budget release (none held)"]
      - from: CONFIRMED
        to: ATTENDED
        trigger: "POST /veteran-services/event-registrations/{registration_id}/transition with action=ATTEND"
        actor: "EventCoordinator | IntakeCoordinator"
        preconditions:
          - "registration.status == CONFIRMED (ERR_INVALID_STATE)"
          - "logical clock >= event.starts_at (ERR_EVENT_NOT_STARTED)"
        side_effects: []
      - from: WAITLISTED
        to: CONFIRMED
        trigger: "system (waitlist promotion after a CONFIRMED cancellation releases a seat)"
        actor: system
        preconditions:
          - "registration is the smallest-queue_position WAITLISTED row for this event whose accommodation_needs are empty OR accessibility_seats_used < accessibility_seat_count"
        side_effects:
          - "registered_count += 1; accessibility_seats_used updated if applicable"
          - "travel_award_cents computed and debited from travel_budget_remaining_cents"
      - from: CONFIRMED
        to: NO_SHOW
        trigger: "system (clock sweep: logical clock > event.ends_at and registration still CONFIRMED)"
        actor: system
        preconditions: []
        side_effects: ["travel_award_cents is NOT clawed back"]
      - from: WAITLISTED
        to: EXPIRED
        trigger: "system (clock sweep: logical clock > event.starts_at)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: OutcomeSurvey
    initial_state: SCHEDULED
    terminal_states: [SUBMITTED, EXPIRED]
    transitions:
      - from: SCHEDULED
        to: OPEN
        trigger: "system (clock sweep: logical clock >= window_open_at)"
        actor: system
        preconditions: []
        side_effects: []
      - from: OPEN
        to: SUBMITTED
        trigger: "POST /veteran-services/surveys/{survey_id}/submit"
        actor: "ProgramMember (own enrollment's survey only) | IntakeCoordinator"
        preconditions:
          - "survey.status == OPEN (ERR_INVALID_STATE)"
        side_effects:
          - "wellbeing_score := (q1+q2+q3+q4+q5) * 4; submitted_at := logical clock"
      - from: OPEN
        to: EXPIRED
        trigger: "system (clock sweep: logical clock > window_close_at)"
        actor: system
        preconditions: []
        side_effects: []


  - entity: ExternalServiceRecord
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: CLOSED
        trigger: "system (clock sweep: end_date is not null and logical clock > end_date)"
        actor: system
        preconditions: []
        side_effects: ["subsequent duplication checks no longer count this record"]

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: eligibility-case-supersede-stale-member
    parent_entity: Member
    write_endpoint: "POST /veteran-services/eligibility-cases"
    occ_field: expected_member_version
    description: |
      Creating an EligibilityCase for a Member whose version has advanced since
      the client last observed it is rejected. A new case legitimately supersedes
      any existing UNDER_REVIEW/PENDED case for the member, so a stale writer
      would otherwise supersede a case it never saw; the stale expected version
      marks the client's view of the member as out of date.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: referral-create-stale-member
    parent_entity: Member
    write_endpoint: "POST /veteran-services/referrals"
    occ_field: expected_member_version
    description: |
      Creating a Referral for a Member whose version has advanced since the
      client last observed it is rejected. A new referral legitimately supersedes
      the member's existing PENDING_MATCH referral, so a stale writer would
      otherwise supersede a referral it never saw.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: acuity_scoring
    trigger: "Assessment creation (POST /veteran-services/enrollments/{enrollment_id}/assessments)"
    algorithm: weighted_scoring
    formula: |
      weights = ACUITY_WEIGHTS_VETERAN if enrollment.member.member_type == VETERAN
                else ACUITY_WEIGHTS_FAMILY_SUPPORT
      raw = weights.PSYCH * psych_score + weights.PHYS * phys_score
            + weights.VOC * voc_score + weights.SOC * soc_score      # raw in 0..10
      acuity_score = round_half_up(raw * 10)                          # integer 0..100
      tier_result = INTENSIVE if acuity_score >= ACUITY_TIER_INTENSIVE_MIN
                    else ENHANCED if acuity_score >= ACUITY_TIER_ENHANCED_MIN
                    else STANDARD
      Enrollment.intensity_tier := tier_result; Enrollment.latest_acuity_score := acuity_score
      (re-assessment on an ACTIVE or SUSPENDED enrollment recomputes tier in place,
       leaving status unchanged; the first assessment flips INTAKE -> ACTIVE)
    input_set: "the four domain scores of the new Assessment; member_type of the owning Member"
    constants:
      ACUITY_WEIGHTS_VETERAN: { PSYCH: 0.4, PHYS: 0.3, VOC: 0.2, SOC: 0.1 }
      ACUITY_WEIGHTS_FAMILY_SUPPORT: { PSYCH: 0.5, PHYS: 0.1, VOC: 0.2, SOC: 0.2 }
      ACUITY_TIER_ENHANCED_MIN: 40
      ACUITY_TIER_INTENSIVE_MIN: 70
    precision: "acuity_score is an integer; round_half_up applied to raw*10 using decimal arithmetic"
    variants:
      - name: veteran_weighting
        when: "owning Member.member_type == VETERAN"
        difference: "uses ACUITY_WEIGHTS_VETERAN (psych 0.4 / phys 0.3 / voc 0.2 / soc 0.1)"
      - name: family_support_weighting
        when: "owning Member.member_type == FAMILY_SUPPORT"
        difference: "uses ACUITY_WEIGHTS_FAMILY_SUPPORT (psych 0.5 / phys 0.1 / voc 0.2 / soc 0.2) — identical four scores yield a different acuity and can yield a different tier"

  - name: compensation_monthly
    trigger: "BenefitsClaim creation (provisional variant) and BenefitsClaim decision or successful appeal (final variant)"
    algorithm: tiered_pricing
    formula: |
      provisional (at claim creation, claim_type == DISABILITY_COMPENSATION only):
        provisional_monthly_cents = RATING_BASE_CENTS[claimed_rating_pct]
        (no COLA, no dependent allowance)
      final (at decide, and recomputed on OVERTURNED appeal):
        if outcome == DENIED: final_monthly_cents = 0
        else:
          dep = 0 if decided_rating_pct < DEPENDENT_RATING_FLOOR_PCT else
                (0 if dependent_count == 0 else
                 DEPENDENT_ALLOWANCE_ONE_CENTS if dependent_count == 1 else
                 DEPENDENT_ALLOWANCE_TWO_CENTS + DEPENDENT_ALLOWANCE_EXTRA_CENTS * (dependent_count - 2))
          final_monthly_cents = round_half_up((RATING_BASE_CENTS[decided_rating_pct] + dep) * (1 + COLA_RATE))
      Member.total_monthly_compensation_cents = sum of final_monthly_cents over the member's
        claims in status {DECIDED, CLOSED}, summing the per-claim ROUNDED values
        (per-claim rounding happens BEFORE the member-level sum — pinned order).
    input_set: "the claim's claimed_rating_pct / decided_rating_pct / dependent_count / outcome"
    constants:
      RATING_BASE_CENTS: { 0: 0, 10: 17500, 20: 34600, 30: 52400, 40: 75500, 50: 105700, 60: 134000, 70: 166100, 80: 193200, 90: 217200, 100: 373700 }
      DEPENDENT_RATING_FLOOR_PCT: 30
      DEPENDENT_ALLOWANCE_ONE_CENTS: 16000
      DEPENDENT_ALLOWANCE_TWO_CENTS: 31000
      DEPENDENT_ALLOWANCE_EXTRA_CENTS: 9000
      COLA_RATE: 0.025
    precision: "integer cents; round_half_up to whole cents using decimal arithmetic"
    variants:
      - name: provisional_estimate
        when: "claim is FILED (estimate shown at filing)"
        difference: "base rate of the CLAIMED rating only; ignores COLA and dependents — identical claim data yields a different (lower) figure than the final variant whenever COLA or dependents apply"
      - name: final_award
        when: "claim reaches DECIDED (and after an OVERTURNED appeal)"
        difference: "base rate of the DECIDED rating plus dependent allowance (only at decided rating >= 30), then COLA applied, rounded per claim"

  - name: site_selection
    trigger: "Referral creation, and re-match after a discharge frees a PartnerSite"
    algorithm: constraint_propagation
    formula: |
      eligibility: PartnerSite s qualifies iff
        s.region == referral.region
        AND referral.required_specialty in s.specialties
        AND s.current_census < s.capacity
      ranking: sort candidates by (s.current_census / s.capacity) ASC, then s.created_at ASC,
        then s.name ASC (name is a deterministic input string — ids are never consulted)
      winner: first row of the sorted candidate list
      empty pool: referral stays PENDING_MATCH (no error); re-match is attempted only
        when a discharge frees a site (the freed site is offered to the eligible
        PENDING_MATCH referral with the smallest request_seq; if none eligible, nothing happens)
    input_set: "all PartnerSite rows; the referral's region and required_specialty"
    constants: {}
    precision: "occupancy ratio compared as exact rational current_census/capacity (no rounding)"
    variants: []

  - name: travel_award
    trigger: "EventRegistration entering CONFIRMED (at creation or via waitlist promotion)"
    algorithm: waterfall_allocation
    formula: |
      travel_award_cents = min(travel_request_cents,
                               PER_REGISTRATION_TRAVEL_CAP_CENTS,
                               CommunityEvent.travel_budget_remaining_cents)
      CommunityEvent.travel_budget_remaining_cents -= travel_award_cents
      WAITLISTED registrations hold no award (travel_award_cents = 0 until promoted).
    input_set: "the registration's travel_request_cents and the event's remaining budget"
    constants:
      PER_REGISTRATION_TRAVEL_CAP_CENTS: 50000
    precision: "integer cents"
    variants: []

  - name: registration_seating
    trigger: "EventRegistration creation"
    algorithm: threshold
    formula: |
      needs_accessibility = (len(accommodation_needs) > 0)
      if event.registered_count < event.capacity
         AND (not needs_accessibility OR event.accessibility_seats_used < event.accessibility_seat_count):
           status = CONFIRMED; then travel_award applies
      else:
           status = WAITLISTED; travel_award_cents = 0
    input_set: "the new registration and the event's current counters"
    constants: {}
    precision: "integer counts; capacity boundary is inclusive-full: registered_count == capacity rejects"
    variants: []

  - name: waitlist_promotion
    trigger: "a CONFIRMED EventRegistration is CANCELLED (seat released)"
    algorithm: chronological
    formula: |
      candidates = WAITLISTED registrations for this event whose accommodation needs fit
        (empty accommodation_needs OR accessibility_seats_used < accessibility_seat_count),
      ordered by queue_position ASC (unique per event; no further tie-break needed)
      promote exactly the first candidate to CONFIRMED, then apply travel_award.
      If the candidate list is empty, nothing happens.
    input_set: "WAITLISTED registrations of the event"
    constants: {}
    precision: "n/a"
    variants: []

  - name: wellbeing_score
    trigger: "OutcomeSurvey submission"
    algorithm: aggregation
    formula: |
      wellbeing_score = (q1 + q2 + q3 + q4 + q5) * 4    # integer, range 20..100
    input_set: "the five Likert items (each 1..5)"
    constants: {}
    precision: "integer"
    variants: []

  - name: program_effect_reporting
    trigger: "DonorReport creation (POST /veteran-services/donor-reports)"
    algorithm: aggregation
    formula: |
      cohort(track) = Enrollments on that track with status == COMPLETED and
        exit_at in [period_start, period_end] inclusive.
      per member: delta = exit_score - baseline_score, where
        baseline_score = SUBMITTED BASELINE wave wellbeing_score of that enrollment,
        exit_score     = SUBMITTED EXIT wave wellbeing_score of that enrollment.
      VARIANT ITT (intent-to-treat): every cohort member counts;
        a missing BASELINE score is imputed as BASELINE_IMPUTE_SCORE;
        a missing EXIT score is imputed as the (actual or imputed) baseline score.
      VARIANT COMPLETER: only members whose enrollment has BOTH a SUBMITTED BASELINE
        and a SUBMITTED EXIT are counted.
      per_track_effect(track) = round_half_up(mean(delta over the counted members), 2)
      overall_effect = round_half_up(sum(weight_t * per_track_effect(t)), 2)
        — per-track rounding happens BEFORE weighting (pinned order);
        weights come from track_weights if supplied else cohort_size_t / cohort_size_total;
        tracks with empty counted cohorts are dropped and the remaining weights
        renormalized proportionally; if every track's cohort is empty -> ERR_EMPTY_COHORT.
    input_set: "COMPLETED enrollments exiting inside the period; their SUBMITTED surveys"
    constants:
      BASELINE_IMPUTE_SCORE: 50
    precision: "2 decimal places, round_half_up, decimal arithmetic; per-track round precedes weighting"
    variants:
      - name: intent_to_treat
        when: "methodology == ITT"
        difference: "non-submitters stay in the cohort with imputed scores — dilutes the effect versus COMPLETER on identical data"
      - name: completer_only
        when: "methodology == COMPLETER"
        difference: "members lacking a SUBMITTED BASELINE or EXIT are dropped from the cohort"

  - name: survey_window_schedule
    trigger: "Enrollment creation (BASELINE) and Enrollment exit with disposition COMPLETED (EXIT, FOLLOWUP_90)"
    algorithm: projection
    formula: |
      BASELINE:    window = [enrollment.created_at,
                             enrollment.created_at + BASELINE_WINDOW_DAYS days]
      EXIT:        window = [enrollment.exit_at,
                             enrollment.exit_at + EXIT_WINDOW_DAYS days]
      FOLLOWUP_90: window = [enrollment.exit_at + (FOLLOWUP_90_OFFSET_DAYS - FOLLOWUP_GRACE_DAYS) days,
                             enrollment.exit_at + (FOLLOWUP_90_OFFSET_DAYS + FOLLOWUP_GRACE_DAYS) days]
      Both window bounds are INCLUSIVE for submission.
      A WITHDRAWN enrollment gets no surveys.
    input_set: "the enrollment's created_at / exit_at"
    constants:
      BASELINE_WINDOW_DAYS: 14
      EXIT_WINDOW_DAYS: 30
      FOLLOWUP_90_OFFSET_DAYS: 90
      FOLLOWUP_GRACE_DAYS: 7
    precision: "datetime, second precision"
    variants: []

  - name: clock_sweep_rules
    trigger: "POST /veteran-services/_clock/set_current_utc (every set runs the full sweep against the new clock)"
    algorithm: threshold
    formula: |
      On every clock set, in this fixed order:
        1. OutcomeSurvey SCHEDULED -> OPEN where clock >= window_open_at
        2. OutcomeSurvey OPEN -> EXPIRED where clock > window_close_at
        3. BenefitsClaim DECIDED -> CLOSED where clock > decided_at + (APPEAL_WINDOW_DAYS + CLAIM_CLOSE_GRACE_DAYS) days
        4. Referral PENDING_MATCH -> EXPIRED where clock > treatment_start
        5. EventRegistration CONFIRMED -> NO_SHOW where clock > event.ends_at
        6. EventRegistration WAITLISTED -> EXPIRED where clock > event.starts_at
        7. ExternalServiceRecord ACTIVE -> CLOSED where end_date is not null and clock > end_date
    input_set: "all non-terminal rows of the listed entities"
    constants:
      CLAIM_CLOSE_GRACE_DAYS: 7
      # APPEAL_WINDOW_DAYS is defined once in calculations.appeal_filing_deadline
    precision: "datetime, second precision; boundary comparisons as written (>= vs >)"
    variants: []

  - name: appeal_filing_deadline
    trigger: "Appeal creation (POST /veteran-services/appeals)"
    algorithm: threshold
    formula: |
      appeal allowed iff logical clock <= claim.decided_at + APPEAL_WINDOW_DAYS days
      (the final instant of the 90th day is still inside the window; one second later is not)
    input_set: "claim.decided_at, logical clock"
    constants:
      APPEAL_WINDOW_DAYS: 90
    precision: "datetime, second precision, inclusive upper bound"
    variants: []

  - name: engagement_status_derivation
    trigger: "Enrollment creation and Enrollment exit"
    algorithm: aggregation
    formula: |
      active = count of member's Enrollments in {INTAKE, ACTIVE, SUSPENDED}
      completed = count in {COMPLETED}
      engagement_status = ENGAGED   if active >= 1
                          GRADUATED if active == 0 AND completed >= 1
                          INACTIVE  if active == 0 AND completed == 0
    input_set: "all Enrollments of the member"
    constants: {}
    precision: "integer counts"
    variants: []

  - name: requisition_restore
    trigger: "Placement separation"
    algorithm: aggregation
    formula: |
      On Placement creation: EmployerPartner.open_requisitions -= 1 (rejects at 0).
      On separation from status ACTIVE or MILESTONE_30 (i.e. before MILESTONE_90):
        EmployerPartner.open_requisitions += 1.
      On separation from MILESTONE_90 or MILESTONE_180: no restore.
      Invariant: open_requisitions + count(placements at this employer in
      {ACTIVE, MILESTONE_30, MILESTONE_90, MILESTONE_180, RETAINED})
      + count(placements SEPARATED from MILESTONE_90 or later) == initial open_requisitions.
    input_set: "the placement's employer and its pre-separation status"
    constants: {}
    precision: "integer"
    variants: []

  - name: treatment_window_overlap
    trigger: "Referral creation (POST /veteran-services/referrals)"
    algorithm: interval_merge
    formula: |
      For the member's other referrals in status {PENDING_MATCH, MATCHED, IN_TREATMENT},
      extend each existing window to [treatment_start, treatment_end + RECOVERY_BUFFER_DAYS days]
      and treat the new window as [treatment_start, treatment_end + RECOVERY_BUFFER_DAYS days].
      Intervals are CLOSED: they conflict iff new.start <= existing.end AND existing.start <= new.end
      (a new window whose treatment_start lands exactly on another's buffered end still conflicts).
      Any conflict -> ERR_TREATMENT_WINDOW_CONFLICT.
    input_set: "the member's non-terminal referrals"
    constants:
      RECOVERY_BUFFER_DAYS: 7
    precision: "datetime, second precision, closed bounds"
    variants: []

  - name: event_schedule_overlap
    trigger: "EventRegistration creation (POST /veteran-services/event-registrations)"
    algorithm: interval_merge
    formula: |
      For the member's registrations in status {CONFIRMED, WAITLISTED}, compare their events'
      HALF-OPEN intervals [starts_at, ends_at) against the new event's [starts_at, ends_at):
      conflict iff new.starts_at < existing.ends_at AND existing.starts_at < new.ends_at.
      An event starting exactly when another ends does NOT conflict.
      Any conflict -> ERR_EVENT_SCHEDULE_CONFLICT.
    input_set: "the member's registrations in {CONFIRMED, WAITLISTED} and their events"
    constants: {}
    precision: "datetime, second precision, half-open bounds"
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority — first failure wins)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; X-User-Role names a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all endpoints"
  - priority: 2
    category: auth
    check: "Request body well-formed: all required input fields present, enum values within their declared sets, integer ranges honored (scores 0..10, Likert 1..5, rating steps of 10 in 0..100, non-negative amounts), datetime fields parseable, treatment_end strictly after treatment_start, ends_at strictly after starts_at, period_end >= period_start, track_weights values sum to exactly 1.0 when supplied"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all endpoints with a request body"
  - priority: 3
    category: auth
    check: "X-User-Role is listed in the endpoint's roles"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all endpoints"
  - priority: 4
    category: existence
    check: "Path identifiers exist, validated left-to-right (member before case, enrollment before survey, claim before appeal); body foreign keys exist in the order the endpoint's input list declares them"
    error_id: "ERR_MEMBER_NOT_FOUND | ERR_ELIGIBILITY_CASE_NOT_FOUND | ERR_PROGRAM_TRACK_NOT_FOUND | ERR_ENROLLMENT_NOT_FOUND | ERR_CLAIM_NOT_FOUND | ERR_APPEAL_NOT_FOUND | ERR_REFERRAL_NOT_FOUND | ERR_EMPLOYER_NOT_FOUND | ERR_PLACEMENT_NOT_FOUND | ERR_EVENT_NOT_FOUND | ERR_REGISTRATION_NOT_FOUND | ERR_SURVEY_NOT_FOUND | ERR_REPORT_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with resource identifiers"
  - priority: 5
    category: auth
    check: "Entity-backed ownership: ProgramMember may only act on resources whose owning Member.id == X-User-ID; ClinicalPartner may only transition a referral once its partner_site_id is set, and only when partner_site_id == X-User-ID (a null partner_site_id falls through to the state checks)"
    error_id: ERR_RESOURCE_NOT_OWNED
    http_status: 403
    applies_to: "GET /veteran-services/members/{member_id}, GET /veteran-services/members/{member_id}/eligibility-cases, POST /veteran-services/surveys/{survey_id}/submit, POST /veteran-services/referrals/{referral_id}/transition"
  - priority: 6
    category: state
    check: "OCC: expected_member_version equals the Member's current version (only on the two endpoints declaring it)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /veteran-services/eligibility-cases, POST /veteran-services/referrals"
  - priority: 7
    category: state
    check: "Target resource is in a state from which the requested transition exists (per §1.2); enrollment/referral/claim creation additionally requires Member.verification_status == VERIFIED; appeal creation requires claim.status == DECIDED"
    error_id: "ERR_INVALID_STATE | ERR_MEMBER_NOT_VERIFIED | ERR_CLAIM_NOT_APPEALABLE"
    http_status: 409
    applies_to: "all transition endpoints; POST /veteran-services/enrollments, POST /veteran-services/claims, POST /veteran-services/referrals, POST /veteran-services/appeals"
  - priority: 8
    category: business_safety
    check: "Segregation of duties: the BenefitsOfficer deciding an appeal must not be the officer who issued the claim's standing decision"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /veteran-services/appeals/{appeal_id}/decide"
  - priority: 9
    category: business_safety
    check: "Eligibility policy: a VERIFIED decision requires verified_service_era == POST_911 and (member_type == FAMILY_SUPPORT or verified_injury_connection == SERVICE_CONNECTED)"
    error_id: ERR_ELIGIBILITY_CRITERIA_NOT_MET
    http_status: 409
    applies_to: "POST /veteran-services/eligibility-cases/{case_id}/transition (target VERIFIED)"
  - priority: 10
    category: business_referential
    check: "Duplication avoidance: no ACTIVE ExternalServiceRecord with a service_category equal to the target track_code (enrollment), BENEFITS (claim), or MENTAL_HEALTH (referral) unless coordination_consent == true; placement creation requires the member to hold an Enrollment on a CAREER track with status ACTIVE; referral creation requires the member to hold an Enrollment on a MENTAL_HEALTH track with status in {ACTIVE, SUSPENDED} and intensity_tier == INTENSIVE"
    error_id: "ERR_EXTERNAL_SERVICE_CONFLICT | ERR_NO_ACTIVE_CAREER_ENROLLMENT | ERR_INTENSITY_TIER_INSUFFICIENT"
    http_status: 409
    applies_to: "POST /veteran-services/enrollments, POST /veteran-services/claims, POST /veteran-services/referrals, POST /veteran-services/placements"
  - priority: 11
    category: business_temporal
    check: "Deadlines and windows: appeal within decided_at + APPEAL_WINDOW_DAYS (inclusive); milestone confirmation not before start_date + milestone days (inclusive); attendance marking not before event.starts_at"
    error_id: "ERR_APPEAL_WINDOW_CLOSED | ERR_MILESTONE_TOO_EARLY | ERR_EVENT_NOT_STARTED"
    http_status: 422
    applies_to: "POST /veteran-services/appeals, POST /veteran-services/placements/{placement_id}/transition, POST /veteran-services/event-registrations/{registration_id}/transition"
  - priority: 12
    category: business_constraint
    check: "Overlap and uniqueness: no two of a member's referrals in {PENDING_MATCH, MATCHED, IN_TREATMENT} may overlap under closed-interval semantics with each window extended RECOVERY_BUFFER_DAYS days past treatment_end; a member may not hold registrations in {CONFIRMED, WAITLISTED} for two events whose half-open [starts_at, ends_at) intervals intersect; appeals only on DISABILITY_COMPENSATION claims; track_code unique"
    error_id: "ERR_TREATMENT_WINDOW_CONFLICT | ERR_EVENT_SCHEDULE_CONFLICT | ERR_CLAIM_TYPE_NOT_APPEALABLE | ERR_DUPLICATE_TRACK_CODE"
    http_status: 409
    applies_to: "POST /veteran-services/referrals, POST /veteran-services/event-registrations, POST /veteran-services/appeals, POST /veteran-services/program-tracks"
  - priority: 13
    category: business_fiscal
    check: "Capacity and budget: ProgramTrack.active_enrollment_count must be < capacity before creating an Enrollment; EmployerPartner.open_requisitions must be >= 1 before creating a Placement"
    error_id: "ERR_TRACK_CAPACITY_REACHED | ERR_NO_OPEN_REQUISITIONS"
    http_status: 409
    applies_to: "POST /veteran-services/enrollments, POST /veteran-services/placements"
  - priority: 14
    category: business_fiscal
    check: "Aggregate computability: DonorReport cohort must count at least one member in at least one track"
    error_id: ERR_EMPTY_COHORT
    http_status: 422
    applies_to: "POST /veteran-services/donor-reports"

# =============================================================================
# §1.5 API Endpoint Table (45 endpoints)
# =============================================================================
endpoints:
  - method: POST
    path: "/veteran-services/_clock/set_current_utc"
    description: "Set the logical clock (test-driving endpoint). The server's startup default is exactly 2026-09-01T00:00:00Z and never falls back to wall-clock time; created_at/updated_at and every temporal rule read this clock. Each set runs calculations.clock_sweep_rules."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["runs the full clock sweep (surveys open/expire, claims close, referrals expire, registrations no-show/expire, external records close)"]

  - method: POST
    path: "/veteran-services/program-tracks"
    description: "Create a program track (mental health, physical health, career, independence)"
    roles: [PlatformAdmin]
    code: 201
    input: [track_code, name, capacity]
    output: ProgramTrack
    side_effects: ["track_code must be unique (ERR_DUPLICATE_TRACK_CODE)"]

  - method: GET
    path: "/veteran-services/program-tracks"
    description: "List program tracks with computed active_enrollment_count"
    roles: [PlatformAdmin, IntakeCoordinator, CareerCounselor, OutcomeAnalyst]
    code: 200
    input: ["track_code?", "limit?", "offset?"]
    output: ProgramTrack[]
    side_effects: []

  - method: POST
    path: "/veteran-services/members"
    description: "Register a veteran or family support member (verification_status starts UNVERIFIED)"
    roles: [IntakeCoordinator]
    code: 201
    input: [full_name, member_type, service_era_claimed, injury_connection_claimed, "branch_of_service?"]
    output: Member
    side_effects: ["engagement_status = INACTIVE; verification_status = UNVERIFIED"]

  - method: GET
    path: "/veteran-services/members/{member_id}"
    description: "Get a member (ProgramMember may only read their own record)"
    roles: [IntakeCoordinator, OutcomeAnalyst, AccreditedRepresentative, BenefitsOfficer, CareerCounselor, EventCoordinator, ProgramMember]
    code: 200
    input: []
    output: Member
    side_effects: []

  - method: POST
    path: "/veteran-services/eligibility-cases"
    description: "Open an eligibility case for a member; supersedes any UNDER_REVIEW/PENDED case; OCC-guarded on Member.version"
    roles: [IntakeCoordinator]
    code: 201
    input: [member_id, expected_member_version]
    output: EligibilityCase
    side_effects:
      - "any existing EligibilityCase for the member in {UNDER_REVIEW, PENDED} -> SUPERSEDED"
      - "increments Member.version by 1"
      - "new case starts UNDER_REVIEW"

  - method: GET
    path: "/veteran-services/members/{id}/eligibility-cases"
    description: "List a member's eligibility cases (ProgramMember: own record only)"
    roles: [IntakeCoordinator, ProgramMember]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: EligibilityCase[]
    side_effects: []

  - method: POST
    path: "/veteran-services/eligibility-cases/{case_id}/transition"
    description: "Drive the case machine: PENDED / UNDER_REVIEW (resume) / VERIFIED / DENIED per state machine preconditions"
    roles: [IntakeCoordinator]
    code: 200
    input: [target_status, "pend_reason?", "verified_service_era?", "verified_injury_connection?", "denial_reason?"]
    output: EligibilityCase
    side_effects:
      - "target VERIFIED requires the eligibility policy (ERR_ELIGIBILITY_CRITERIA_NOT_MET) and sets Member.verification_status, verified_service_era, verified_injury_connection"
      - "VERIFIED/DENIED stamp decided_at"

  - method: POST
    path: "/veteran-services/external-service-records"
    description: "Record services the member receives from another veteran service organization (duplication avoidance)"
    roles: [IntakeCoordinator]
    code: 201
    input: [member_id, organization_name, service_category, start_date, "end_date?"]
    output: ExternalServiceRecord
    side_effects: ["status = ACTIVE"]

  - method: GET
    path: "/veteran-services/members/{id}/external-service-records"
    description: "List a member's external service records"
    roles: [IntakeCoordinator]
    code: 200
    input: ["status?", "service_category?", "limit?", "offset?"]
    output: ExternalServiceRecord[]
    side_effects: []

  - method: POST
    path: "/veteran-services/enrollments"
    description: "Enroll a VERIFIED member into a program track"
    roles: [IntakeCoordinator]
    code: 201
    input: [member_id, program_track_id, "coordination_consent?"]
    output: Enrollment
    side_effects:
      - "status = INTAKE; ProgramTrack.active_enrollment_count += 1; increments ProgramTrack.version by 1"
      - "system creates the BASELINE OutcomeSurvey (window per calculations.survey_window_schedule)"
      - "Member.engagement_status recomputed; increments Member.version by 1"

  - method: GET
    path: "/veteran-services/enrollments"
    description: "List enrollments with filters (covers both FK reverse lookups)"
    roles: [IntakeCoordinator, CareerCounselor, OutcomeAnalyst]
    code: 200
    input: ["member_id?", "program_track_id?", "status?", "limit?", "offset?"]
    output: Enrollment[]
    side_effects: []

  - method: GET
    path: "/veteran-services/enrollments/{enrollment_id}"
    description: "Get one enrollment"
    roles: [IntakeCoordinator, CareerCounselor, OutcomeAnalyst]
    code: 200
    input: []
    output: Enrollment
    side_effects: []

  - method: POST
    path: "/veteran-services/enrollments/{enrollment_id}/assessments"
    description: "Record an intake or re-assessment; computes acuity and intensity tier; first assessment flips INTAKE -> ACTIVE"
    roles: [IntakeCoordinator]
    code: 201
    input: [psych_score, phys_score, voc_score, soc_score, "notes?"]
    output: Assessment
    side_effects:
      - "calculations.acuity_scoring; Enrollment.intensity_tier and latest_acuity_score updated"
      - "enrollment INTAKE -> ACTIVE on the first assessment (fails with ERR_INVALID_STATE on terminal enrollments)"
      - "increments Enrollment.version by 1"

  - method: GET
    path: "/veteran-services/enrollments/{id}/assessments"
    description: "List an enrollment's assessments (append-only, creation order)"
    roles: [IntakeCoordinator, OutcomeAnalyst]
    code: 200
    input: ["limit?", "offset?"]
    output: Assessment[]
    side_effects: []

  - method: POST
    path: "/veteran-services/enrollments/{enrollment_id}/transition"
    description: "Drive the enrollment machine: SUSPENDED / ACTIVE (resume) / COMPLETED / WITHDRAWN"
    roles: [IntakeCoordinator]
    code: 200
    input: [target_status, "exit_reason?"]
    output: Enrollment
    side_effects:
      - "COMPLETED: exit stamps, EXIT and FOLLOWUP_90 surveys scheduled, track count decremented, member engagement recomputed"
      - "WITHDRAWN: exit stamps, track count decremented, no surveys, member engagement recomputed"

  - method: POST
    path: "/veteran-services/claims"
    description: "File a benefits claim for a VERIFIED member via an accredited representative"
    roles: [AccreditedRepresentative]
    code: 201
    input: [member_id, claim_type, "claimed_rating_pct?", "dependent_count?", "coordination_consent?"]
    output: BenefitsClaim
    side_effects:
      - "status = FILED; provisional_monthly_cents computed for DISABILITY_COMPENSATION"
      - "blocked while an ACTIVE BENEFITS ExternalServiceRecord exists unless coordination_consent (ERR_EXTERNAL_SERVICE_CONFLICT)"

  - method: GET
    path: "/veteran-services/members/{id}/claims"
    description: "List a member's claims"
    roles: [AccreditedRepresentative, BenefitsOfficer, IntakeCoordinator]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: BenefitsClaim[]
    side_effects: []

  - method: GET
    path: "/veteran-services/claims/{claim_id}"
    description: "Get one claim"
    roles: [AccreditedRepresentative, BenefitsOfficer]
    code: 200
    input: []
    output: BenefitsClaim
    side_effects: []

  - method: POST
    path: "/veteran-services/claims/{claim_id}/decide"
    description: "BenefitsOfficer issues the claim decision (GRANTED/DENIED with rating)"
    roles: [BenefitsOfficer]
    code: 200
    input: [outcome, decided_rating_pct]
    output: BenefitsClaim
    side_effects:
      - "claim FILED -> DECIDED; final_monthly_cents computed (final variant); decided_by_officer_id, decided_at stamped"
      - "Member.total_monthly_compensation_cents recomputed; increments Member.version by 1"

  - method: POST
    path: "/veteran-services/appeals"
    description: "Open an appeal on a DECIDED disability claim within the appeal window"
    roles: [AccreditedRepresentative]
    code: 201
    input: [claim_id, "grounds?"]
    output: Appeal
    side_effects:
      - "claim DECIDED -> APPEAL_PENDING; appeal filed_at := logical clock"

  - method: GET
    path: "/veteran-services/claims/{id}/appeals"
    description: "List a claim's appeals"
    roles: [AccreditedRepresentative, BenefitsOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: Appeal[]
    side_effects: []

  - method: POST
    path: "/veteran-services/appeals/{appeal_id}/decide"
    description: "BenefitsOfficer decides an appeal; segregation of duties against the claim's deciding officer"
    roles: [BenefitsOfficer]
    code: 200
    input: [outcome, "new_rating_pct?"]
    output: Appeal
    side_effects:
      - "appeal OPEN -> DECIDED; claim returns to DECIDED"
      - "on OVERTURNED: claim.decided_rating_pct := new_rating_pct; final_monthly_cents recomputed; member total recomputed; decided_at re-anchored"

  - method: POST
    path: "/veteran-services/referrals"
    description: "Create a clinical referral to an intensive outpatient partner; selector runs at creation; supersedes the member's PENDING_MATCH referral; OCC-guarded on Member.version"
    roles: [IntakeCoordinator]
    code: 201
    input: [member_id, region, required_specialty, treatment_start, treatment_end, "coordination_consent?", expected_member_version]
    output: Referral
    side_effects:
      - "requires member VERIFIED, a MENTAL_HEALTH enrollment in {ACTIVE, SUSPENDED} with intensity_tier == INTENSIVE, no treatment-window overlap, no ACTIVE MENTAL_HEALTH external record without consent"
      - "member's existing PENDING_MATCH referral -> SUPERSEDED"
      - "calculations.site_selection: match -> MATCHED with partner_site_id, else stays PENDING_MATCH"
      - "increments Member.version by 1"

  - method: GET
    path: "/veteran-services/referrals"
    description: "List referrals with filters (covers both FK reverse lookups)"
    roles: [IntakeCoordinator, ClinicalPartner]
    code: 200
    input: ["member_id?", "partner_site_id?", "status?", "limit?", "offset?"]
    output: Referral[]
    side_effects: []

  - method: GET
    path: "/veteran-services/referrals/{referral_id}"
    description: "Get one referral"
    roles: [IntakeCoordinator, ClinicalPartner]
    code: 200
    input: []
    output: Referral
    side_effects: []

