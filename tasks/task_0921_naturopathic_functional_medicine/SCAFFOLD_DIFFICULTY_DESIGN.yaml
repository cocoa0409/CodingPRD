              as: NaturopathicDoctor
              as_user_id: "${nd_id}"
              captures: { enc_base: $.data.id }
          trigger:
            - call: "POST /encounters"
              payload: { patient_id: "${pt_id}", practitioner_id: "${nd_id}", modality: "TELEHEALTH", scheduled_start: "2026-06-01T10:35:00Z", scheduled_end: "2026-06-01T11:05:00Z" }
              as: NaturopathicDoctor
              as_user_id: "${nd_id}"
              captures: { err_id: $.data.error_id }
            - call: "POST /encounters"
              payload: { patient_id: "${pt_id}", practitioner_id: "${nd_id}", modality: "IN_PERSON", scheduled_start: "2026-06-01T10:30:00Z", scheduled_end: "2026-06-01T11:00:00Z" }
              as: NaturopathicDoctor
              as_user_id: "${nd_id}"
              captures: { enc_touch: $.data.id }
            - call: "POST /encounters"
              payload: { patient_id: "${pt_id}", practitioner_id: "${nd_id}", modality: "TELEHEALTH", scheduled_start: "2026-06-01T11:00:00Z", scheduled_end: "2026-06-01T11:30:00Z" }
