# =============================================================================
# Task 1828 — Escheatment & Unclaimed Property (financial accounts)
# Scaffold seed tables (§1.0–§1.7)
# =============================================================================

scenario: |
  1828. Escheatment & Unclaimed Property (financial accounts): dormancy period by
  property type & state, due-diligence letter timing & response tracking,
  reactivation criteria & contact evidence, holder report preparation & remittance
  by state, securities property (shares/dividends) escheatment & liquidation, owner
  claim & reunification process, penalty/interest exposure & audit defense, records
  retention

domain_name: escheatment-unclaimed-property
api_prefix: /escheatment

# =============================================================================
# §0 Complexity profile
# =============================================================================
complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - optimistic_concurrency
    - rate_threshold_triggers
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - self_referential
    - cross_aggregate
    - polymorphic
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Owner
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Owner legal full name" }
      - { name: last_known_address, type: string, source: input, description: "Last known mailing address (free-form single line)" }
      - { name: state_code, type: string, source: input, description: "Two-letter state code of last known address; governs escheatment jurisdiction" }
      - { name: deceased_date, type: string, source: input, required: false, default: null, description: "Optional ISO date of death for estate claims (YYYY-MM-DD)" }

  - name: DormancyRule
    parent: null
    common_fields: true
    fields:
      - { name: state_code, type: string, source: input, description: "Two-letter state code this rule applies to" }
      - { name: property_type, type: enum, source: input, description: "CHECKING | SAVINGS | BROKERAGE_SHARES | UNCASHED_CHECK | INSURANCE_PROCEEDS" }
      - { name: dormancy_years, type: integer, source: input, description: "Years of no owner contact before property is presumed abandoned (1..15)" }
      - { name: effective_from, type: string, source: input, description: "ISO date; rule effective window start (inclusive), half-open interval [effective_from, effective_to)" }
      - { name: effective_to, type: string, source: input, required: false, default: null, description: "ISO date; rule effective window end (exclusive); null = open-ended" }
      - { name: dd_threshold_cents, type: integer, source: input, default: 5000, description: "Due-diligence letter required when original_value_cents >= this threshold" }
      - { name: dd_window_min_days, type: integer, source: input, default: 60, description: "Letter must be sent no later than this many days before the report due date" }
      - { name: dd_window_max_days, type: integer, source: input, default: 180, description: "Letter must be sent no earlier than this many days before the report due date" }
      - { name: annual_interest_rate_bp, type: integer, source: input, default: 1200, description: "Annual interest rate in basis points applied to late remittance and claim interest (1200 = 12%)" }
      - { name: daily_penalty_cents, type: integer, source: input, default: 10000, description: "Per-day late penalty for days_late in 1..gross_negligence_day_threshold" }
      - { name: gross_daily_penalty_cents, type: integer, source: input, default: 25000, description: "Per-day late penalty applied to ALL days when days_late > gross_negligence_day_threshold" }
      - { name: gross_negligence_day_threshold, type: integer, source: input, default: 30, description: "days_late strictly greater than this switches to gross rate for all days" }
      - { name: penalty_cap_pct, type: integer, source: input, default: 25, description: "Penalty cap as integer percent of report total_provisional_cents (floor rounding)" }
      - { name: report_cutoff_month_day, type: string, source: input, default: "06-30", description: "MM-DD annual report cutoff; property dormant on/before cutoff enters that year's report cycle" }
      - { name: report_due_month_day, type: string, source: input, default: "11-01", description: "MM-DD annual report due date" }

  - name: Property
    parent: null
    common_fields: true
    fields:
      - { name: owner_id, type: string, source: input, description: "FK -> Owner.id; the property's owner" }
      - { name: property_type, type: enum, source: input, description: "CHECKING | SAVINGS | BROKERAGE_SHARES | UNCASHED_CHECK | INSURANCE_PROCEEDS" }
      - { name: state_code, type: string, source: input, description: "Governing state; MUST equal the owner's state_code at creation (ERR_OWNER_STATE_MISMATCH)" }
      - { name: original_value_cents, type: integer, source: input, description: "Declared cash value (> 0); for BROKERAGE_SHARES this is the estimated market value used for due-diligence thresholding" }
      - { name: last_contact_date, type: string, source: input, description: "ISO date of last owner contact; maintained as max(self, newest ContactEvent.contact_date) on every contact event" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | DORMANT | DUE_DILIGENCE | REPORTABLE | REPORTED | REMITTED | ESCHEATED | REUNITED" }
      - { name: dormancy_date, type: string, source: computed, default: null, description: "ISO date the property became DORMANT = last_contact_date + dormancy_years anniversary + 1 day" }
      - { name: escheated_date, type: string, source: system, default: null, description: "ISO date custody transferred to the state (REMITTED -> ESCHEATED)" }
      - { name: reunited_date, type: string, source: system, default: null, description: "ISO date a paid claim reunited the property with its owner" }

  - name: ContactEvent
    parent: null
    common_fields: true
    fields:
      - { name: property_id, type: string, source: input, description: "FK -> Property.id; the property this contact concerns" }
      - { name: contact_type, type: enum, source: input, description: "WITHDRAWAL | DEPOSIT | LOGIN_VERIFIED | WRITTEN_CORRESPONDENCE | PHONE_VERIFIED | IN_PERSON" }
      - { name: contact_date, type: string, source: input, description: "ISO date the contact occurred (may be backdated)" }
      - { name: evidence_ref, type: string, source: input, description: "Evidence reference (document id, statement ref); required for all types" }
      - { name: qualifies_for_reactivation, type: boolean, source: computed, description: "true iff contact_type IN {WITHDRAWAL, DEPOSIT, WRITTEN_CORRESPONDENCE, IN_PERSON}; LOGIN_VERIFIED and PHONE_VERIFIED never qualify" }
      - { name: recorded_by_user_id, type: string, source: system, description: "X-User-ID of the recorder" }

  - name: DueDiligenceLetter
    parent: null
    common_fields: true
    fields:
      - { name: property_id, type: string, source: system, description: "FK -> Property.id; path property" }
      - { name: sent_date, type: string, source: system, description: "ISO date letter created (= logical clock date at creation)" }
      - { name: response_deadline, type: string, source: computed, description: "= sent_date + 30 days" }
      - { name: applicable_due_date, type: string, source: computed, description: "Report due date this letter targets, per applicable_report_window" }
      - { name: status, type: enum, source: system, default: SENT, description: "SENT | DELIVERED | RESPONDED | EXPIRED | UNDELIVERABLE | VOIDED" }
      - { name: response_contact_event_id, type: string, source: input, default: null, description: "Contact event evidencing the owner's response (set on record-response)" }

  - name: HolderReport
    parent: null
    common_fields: true
    fields:
      - { name: state_code, type: string, source: input, description: "Destination state of the report" }
      - { name: report_year, type: integer, source: input, description: "Report cycle year" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | SUBMITTED | ACCEPTED | REJECTED | SUPERSEDED" }
      - { name: supersedes_report_id, type: string, source: system, default: null, description: "FK -> HolderReport.id; set when this report was created as an amendment of an ACCEPTED report" }
      - { name: cutoff_date, type: string, source: computed, description: "= date(report_year, report_cutoff_month_day) from the state's DormancyRule set" }
      - { name: due_date, type: string, source: computed, description: "= date(report_year, report_due_month_day)" }
      - { name: submitted_date, type: string, source: system, default: null, description: "ISO date of submission; reset to null on reopen" }
      - { name: submitted_by_user_id, type: string, source: system, default: null, description: "X-User-ID of submitter; segregation-of-duties anchor for accept" }
      - { name: accepted_date, type: string, source: system, default: null, description: "ISO date of state acceptance" }
      - { name: rejection_reason, type: string, source: input, default: null, description: "Reason recorded at reject" }
      - { name: total_provisional_cents, type: integer, source: computed, default: 0, description: "Sum of provisional_value_cents over lines with status IN {INCLUDED, FINAL}" }
      - { name: total_final_cents, type: integer, source: computed, default: 0, description: "Sum over lines with status IN {INCLUDED, FINAL} of (final_value_cents if FINAL else provisional_value_cents)" }
      - { name: confirmed_remittance_cents, type: integer, source: computed, default: 0, description: "Sum of amount_cents over CONFIRMED remittances of this report" }
      - { name: line_count, type: integer, source: computed, default: 0, description: "Count of lines with status IN {INCLUDED, FINAL}" }

  - name: ReportLineItem
    parent: null
    common_fields: true
    fields:
      - { name: report_id, type: string, source: system, description: "FK -> HolderReport.id; containing report" }
      - { name: property_id, type: string, source: input, description: "FK -> Property.id; reported property" }
      - { name: line_type, type: enum, source: computed, description: "CASH | SECURITIES; SECURITIES iff property_type == BROKERAGE_SHARES else CASH" }
      - { name: provisional_value_cents, type: integer, source: computed, description: "CASH: property.original_value_cents. SECURITIES: securities_valuation provisional variant at inclusion" }
      - { name: final_value_cents, type: integer, source: computed, default: null, description: "CASH: set = provisional at report submit. SECURITIES: set = liquidation net_proceeds_cents at settle" }
      - { name: status, type: enum, source: system, default: INCLUDED, description: "INCLUDED | FINAL | REMOVED" }

  - name: SecuritiesDetail
    parent: null
    common_fields: true
    fields:
      - { name: property_id, type: string, source: system, description: "FK -> Property.id; 1:1 with a BROKERAGE_SHARES property" }
      - { name: cusip, type: string, source: input, description: "CUSIP or ticker identifier" }
      - { name: shares_quantity, type: integer, source: input, description: "Whole shares held (> 0)" }
      - { name: last_close_price_cents, type: integer, source: input, description: "Last known closing price per share in cents (>= 0)" }
      - { name: accrued_dividends_cents, type: integer, source: input, description: "Unpaid accrued dividends in cents (>= 0)" }
      - { name: pending_execution_price_cents, type: integer, source: system, default: null, description: "Execution price staged by an EXECUTED liquidation order; cleared by cancel or settle" }
      - { name: status, type: enum, source: system, default: REGISTERED, description: "REGISTERED | EXECUTION_PENDING | LIQUIDATED" }

  - name: LiquidationOrder
    parent: null
    common_fields: true
    fields:
      - { name: property_id, type: string, source: input, description: "FK -> Property.id; securities property to liquidate" }
      - { name: liquidation_fee_cents, type: integer, source: input, description: "Flat liquidation fee in cents (>= 0)" }
      - { name: execution_price_cents_per_share, type: integer, source: input, default: null, description: "Actual execution price per share, supplied at execute" }
      - { name: executed_date, type: string, source: system, default: null, description: "ISO date of execution" }
      - { name: settled_date, type: string, source: system, default: null, description: "ISO date of settlement" }
      - { name: gross_proceeds_cents, type: integer, source: computed, default: null, description: "= execution_price_cents_per_share * shares_quantity at execute" }
      - { name: net_proceeds_cents, type: integer, source: computed, default: null, description: "= max(0, gross_proceeds_cents - liquidation_fee_cents + accrued_dividends_cents) at settle" }
      - { name: status, type: enum, source: system, default: REQUESTED, description: "REQUESTED | EXECUTED | SETTLED | CANCELLED" }

  - name: Remittance
    parent: null
    common_fields: true
    fields:
      - { name: report_id, type: string, source: system, description: "FK -> HolderReport.id; report being remitted" }
      - { name: amount_cents, type: integer, source: input, description: "Remitted amount (>= 0); re-set by requeue" }
      - { name: status, type: enum, source: system, default: PENDING, description: "PENDING | CONFIRMED | FAILED" }
      - { name: failure_reason, type: string, source: input, default: null, description: "Reason recorded at fail; cleared on requeue" }
      - { name: confirmed_date, type: string, source: system, default: null, description: "ISO date of state confirmation" }
      - { name: variance_cents, type: integer, source: computed, default: null, description: "= amount_cents - report.total_final_cents, evaluated at confirm time; confirm requires exactly 0" }

  - name: OwnerClaim
    parent: null
    common_fields: true
    fields:
      - { name: property_id, type: string, source: input, description: "FK -> Property.id; claimed property" }
      - { name: claimant_owner_id, type: string, source: system, description: "FK -> Owner.id; equals X-User-ID of the creating Claimant (must equal property.owner_id)" }
      - { name: claim_type, type: enum, source: computed, description: "CASH | SECURITIES; SECURITIES iff property_type == BROKERAGE_SHARES" }
      - { name: evidence_ref, type: string, source: input, required: false, default: null, description: "Optional claimant evidence reference" }
      - { name: status, type: enum, source: system, default: SUBMITTED, description: "SUBMITTED | UNDER_REVIEW | MORE_INFO_REQUESTED | APPROVED | DENIED | PAID | WITHDRAWN" }
      - { name: reviewed_by_user_id, type: string, source: system, default: null, description: "X-User-ID of the ClaimsExaminer who started review; segregation-of-duties anchor" }
      - { name: decided_by_user_id, type: string, source: system, default: null, description: "X-User-ID of the ClaimsApprover who approved or denied" }
      - { name: denial_reason, type: string, source: input, default: null, description: "Reason recorded at deny" }
      - { name: approved_base_cents, type: integer, source: computed, default: null, description: "Claim payout base at approve (see claim_payout)" }
      - { name: approved_interest_cents, type: integer, source: computed, default: null, description: "Interest component at approve (0 for SECURITIES)" }
      - { name: processing_fee_cents, type: integer, source: computed, default: null, description: "State processing fee at approve (0 when gross <= 100000)" }
      - { name: approved_payout_cents, type: integer, source: computed, default: null, description: "= base + interest - processing_fee at approve" }
      - { name: paid_date, type: string, source: system, default: null, description: "ISO date payout disbursed" }

  - name: PenaltyAssessment
    parent: null
    common_fields: true
    fields:
      - { name: report_id, type: string, source: system, description: "FK -> HolderReport.id; assessed report" }
      - { name: assessed_date, type: string, source: system, description: "ISO date the assessment was created" }
      - { name: days_late, type: integer, source: computed, description: "= max(0, submitted_date - due_date) in whole days" }
      - { name: penalty_cents, type: integer, source: computed, description: "Per late_penalty calculation" }
      - { name: interest_cents, type: integer, source: computed, description: "Per late_interest calculation (per-line round_half_up then sum)" }
      - { name: total_cents, type: integer, source: computed, description: "= penalty_cents + interest_cents" }
      - { name: status, type: enum, source: system, default: ASSESSED, description: "ASSESSED | PAID | WAIVED | DISPUTED" }
      - { name: waiver_reason, type: string, source: input, default: null, description: "Reason recorded at waive" }
      - { name: dispute_reason, type: string, source: input, default: null, description: "Reason recorded at dispute" }

  - name: AuditCase
    parent: null
    common_fields: true
    fields:
      - { name: state_code, type: string, source: input, description: "State conducting the audit" }
      - { name: lookback_start_year, type: integer, source: input, description: "First calendar year of the lookback window (inclusive; closed interval)" }
      - { name: lookback_end_year, type: integer, source: input, description: "Last calendar year of the lookback window (inclusive; closed interval, >= lookback_start_year)" }
      - { name: status, type: enum, source: system, default: OPENED, description: "OPENED | FIELDWORK | FINDINGS_ISSUED | CLOSED" }
      - { name: estimated_exposure_cents, type: integer, source: computed, default: null, description: "Computed at FIELDWORK -> FINDINGS_ISSUED per audit_exposure_estimate" }

  - name: DocumentRecord
    parent: null
    common_fields: true
    fields:
      - { name: artifact_type, type: enum, source: input, description: "LETTER_COPY | REPORT_FILE | CLAIM_EVIDENCE | REMITTANCE_RECEIPT" }
      - { name: related_entity_type, type: enum, source: input, description: "Polymorphic owner type: DueDiligenceLetter | HolderReport | OwnerClaim | Remittance" }
      - { name: related_entity_id, type: string, source: input, description: "Polymorphic owner id (references the entity named by related_entity_type; not a fixed FK; no existence validation is performed on this polymorphic reference)" }
      - { name: retention_until, type: string, source: computed, description: "= creation date + retention years for artifact_type (LETTER_COPY 5, REPORT_FILE 10, CLAIM_EVIDENCE 7, REMITTANCE_RECEIPT 10)" }
      - { name: purged_at, type: string, source: system, default: null, description: "ISO datetime of purge (soft delete)" }
      - { name: status, type: enum, source: system, default: REGISTERED, description: "REGISTERED | PURGED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Property
    initial_state: ACTIVE
    terminal_states: [REUNITED]
    transitions:
      - from: ACTIVE
        to: DORMANT
        trigger: "POST /escheatment/_sweeps/dormancy (system sweep)"
        actor: system
        preconditions:
          - "sweep_date > last_contact_date + rule.dormancy_years anniversary (strictly greater; exactly on the anniversary stays ACTIVE)"
          - "An applicable DormancyRule exists for (state_code, property_type) effective at last_contact_date"
        side_effects:
          - "dormancy_date := anniversary + 1 day"
      - from: DORMANT
        to: DUE_DILIGENCE
        trigger: "POST /escheatment/properties/{propertyId}/due-diligence-letters"
        actor: ComplianceOfficer
        preconditions:
          - "Property is DORMANT or DUE_DILIGENCE (ERR_PROPERTY_NOT_DORMANT, priority 8); DUE_DILIGENCE is admitted here precisely so a second letter attempt reaches the duplicate-active constraint below — in DUE_DILIGENCE an active letter always exists"
          - "No other letter for this property in SENT or DELIVERED (ERR_DUPLICATE_ACTIVE_LETTER, priority 9)"
          - "sent_date (= clock date) within [applicable_due_date - dd_window_max_days, applicable_due_date - dd_window_min_days] inclusive (ERR_DUE_DILIGENCE_WINDOW_VIOLATION, priority 10)"
          - "original_value_cents >= rule.dd_threshold_cents (ERR_DUE_DILIGENCE_NOT_REQUIRED, priority 11)"
        side_effects:
          - "DueDiligenceLetter created in SENT with sent_date = clock date, response_deadline = sent_date + 30 days"
      - from: DUE_DILIGENCE
        to: ACTIVE
        trigger: "POST /escheatment/due-diligence-letters/{letterId}/record-response OR POST /escheatment/properties/{propertyId}/reactivate"
        actor: ComplianceOfficer
        preconditions:
          - "record-response: letter SENT or DELIVERED (ERR_LETTER_NOT_ACTIONABLE); response contact event exists, belongs to this property, qualifies_for_reactivation, contact_date >= letter.sent_date (ERR_CONTACT_EVENT_NOT_FOUND / ERR_CONTACT_EVENT_PROPERTY_MISMATCH / ERR_CONTACT_NOT_QUALIFYING)"
          - "reactivate: evidence contact event exists, belongs to this property, qualifies (same errors)"
        side_effects:
          - "Via record-response: letter -> RESPONDED with response_contact_event_id set"
          - "Via reactivate: any SENT/DELIVERED letter -> VOIDED"
          - "Cascade hop 2: every ReportLineItem for this property with status INCLUDED whose report is DRAFT -> REMOVED"
          - "Cascade hop 3: each affected DRAFT HolderReport recomputes total_provisional_cents, total_final_cents, line_count; HolderReport.version increments"
          - "last_contact_date := max(last_contact_date, evidence contact_date)"
      - from: DORMANT
        to: ACTIVE
        trigger: "POST /escheatment/properties/{propertyId}/reactivate"
        actor: ComplianceOfficer
        preconditions:
          - "Property in DORMANT | DUE_DILIGENCE | REPORTABLE (ERR_PROPERTY_NOT_REACTIVATABLE)"
          - "Evidence contact event exists / belongs / qualifies (ERR_CONTACT_EVENT_NOT_FOUND / ERR_CONTACT_EVENT_PROPERTY_MISMATCH / ERR_CONTACT_NOT_QUALIFYING)"
        side_effects:
          - "last_contact_date := max(last_contact_date, evidence contact_date); dormancy_date := null"
      - from: REPORTABLE
        to: ACTIVE
        trigger: "POST /escheatment/properties/{propertyId}/reactivate"
        actor: ComplianceOfficer
        preconditions:
          - "Property in DORMANT | DUE_DILIGENCE | REPORTABLE (ERR_PROPERTY_NOT_REACTIVATABLE)"
          - "Evidence contact event exists / belongs / qualifies"
          - "No ReportLineItem for this property with status IN {INCLUDED, FINAL} belongs to a report with status SUBMITTED or ACCEPTED (ERR_PROPERTY_IN_SUBMITTED_REPORT)"
        side_effects:
          - "Cascade hop 2: DRAFT-report INCLUDED lines for this property -> REMOVED"
          - "Cascade hop 3: affected DRAFT reports recompute totals and line_count; version increments"
          - "last_contact_date := max(last_contact_date, evidence contact_date); dormancy_date := null"
      - from: DORMANT
        to: REPORTABLE
        trigger: "POST /escheatment/_sweeps/dormancy (system sweep)"
        actor: system
        preconditions:
          - "Property is DORMANT and original_value_cents < rule.dd_threshold_cents (due diligence not required)"
        side_effects: []
      - from: DUE_DILIGENCE
        to: REPORTABLE
        trigger: "POST /escheatment/_sweeps/dormancy (letter EXPIRED) OR POST /escheatment/due-diligence-letters/{letterId}/mark-undeliverable"
        actor: system | ComplianceOfficer
        preconditions:
          - "Sweep path: the SENT/DELIVERED letter's response_deadline < sweep_date (strictly greater; on the deadline day the letter is still open)"
          - "Undeliverable path: letter SENT or DELIVERED (ERR_LETTER_NOT_ACTIONABLE)"
        side_effects:
          - "Sweep path: letter -> EXPIRED"
          - "Undeliverable path: letter -> UNDELIVERABLE"
      - from: REPORTABLE
        to: REPORTED
        trigger: "system cascade — POST /escheatment/holder-reports/{reportId}/accept"
        actor: system
        preconditions:
          - "A ReportLineItem with status IN {INCLUDED, FINAL} for this property belongs to the accepted report"
        side_effects: []
      - from: REPORTED
        to: REMITTED
        trigger: "system cascade — POST /escheatment/remittances/{remittanceId}/confirm"
        actor: system
        preconditions:
          - "A line with status IN {INCLUDED, FINAL} for this property belongs to the confirmed remittance's report"
        side_effects: []
      - from: REMITTED
        to: ESCHEATED
        trigger: "POST /escheatment/properties/{propertyId}/escheat"
        actor: StateAuditor
        preconditions:
          - "Property is REMITTED (ERR_PROPERTY_NOT_REMITTED)"
        side_effects:
          - "escheated_date := clock date"
      - from: REMITTED
        to: REUNITED
        trigger: "system cascade — POST /escheatment/owner-claims/{claimId}/pay"
        actor: system
        preconditions:
          - "The paid claim's property_id == this property"
        side_effects:
          - "reunited_date := clock date"
      - from: ESCHEATED
        to: REUNITED
        trigger: "system cascade — POST /escheatment/owner-claims/{claimId}/pay"
        actor: system
        preconditions:
          - "The paid claim's property_id == this property"
        side_effects:
          - "reunited_date := clock date"

  - entity: DueDiligenceLetter
    initial_state: SENT
    terminal_states: [RESPONDED, EXPIRED, UNDELIVERABLE, VOIDED]
    transitions:
      - from: SENT
        to: DELIVERED
        trigger: "POST /escheatment/due-diligence-letters/{letterId}/mark-delivered"
        actor: ComplianceOfficer
        preconditions: ["letter SENT (ERR_LETTER_NOT_ACTIONABLE)"]
        side_effects: []
      - from: SENT
        to: UNDELIVERABLE
        trigger: "POST /escheatment/due-diligence-letters/{letterId}/mark-undeliverable"
        actor: ComplianceOfficer
        preconditions: ["letter SENT or DELIVERED (ERR_LETTER_NOT_ACTIONABLE)"]
        side_effects: ["Property DUE_DILIGENCE -> REPORTABLE"]
      - from: DELIVERED
        to: UNDELIVERABLE
        trigger: "POST /escheatment/due-diligence-letters/{letterId}/mark-undeliverable"
        actor: ComplianceOfficer
        preconditions: ["letter SENT or DELIVERED (ERR_LETTER_NOT_ACTIONABLE)"]
        side_effects: ["Property DUE_DILIGENCE -> REPORTABLE"]
      - from: SENT
        to: RESPONDED
        trigger: "POST /escheatment/due-diligence-letters/{letterId}/record-response"
        actor: ComplianceOfficer
        preconditions: ["letter SENT or DELIVERED (ERR_LETTER_NOT_ACTIONABLE)", "response contact event exists / belongs / qualifies / dated >= sent_date"]
        side_effects: ["response_contact_event_id set", "Property DUE_DILIGENCE -> ACTIVE with line-removal cascade (see Property DUE_DILIGENCE->ACTIVE)"]
      - from: DELIVERED
        to: RESPONDED
        trigger: "POST /escheatment/due-diligence-letters/{letterId}/record-response"
        actor: ComplianceOfficer
        preconditions: ["letter SENT or DELIVERED (ERR_LETTER_NOT_ACTIONABLE)", "response contact event exists / belongs / qualifies / dated >= sent_date"]
        side_effects: ["response_contact_event_id set", "Property DUE_DILIGENCE -> ACTIVE with line-removal cascade"]
      - from: SENT
        to: EXPIRED
        trigger: "POST /escheatment/_sweeps/dormancy (system sweep)"
        actor: system
        preconditions: ["letter SENT or DELIVERED and response_deadline < sweep_date"]
        side_effects: ["Property DUE_DILIGENCE -> REPORTABLE"]
      - from: DELIVERED
        to: EXPIRED
        trigger: "POST /escheatment/_sweeps/dormancy (system sweep)"
        actor: system
        preconditions: ["letter SENT or DELIVERED and response_deadline < sweep_date"]
        side_effects: ["Property DUE_DILIGENCE -> REPORTABLE"]
      - from: SENT
        to: VOIDED
        trigger: "system cascade — POST /escheatment/properties/{propertyId}/reactivate"
        actor: system
        preconditions: ["property reactivated while this letter is SENT or DELIVERED"]
        side_effects: []
      - from: DELIVERED
        to: VOIDED
        trigger: "system cascade — POST /escheatment/properties/{propertyId}/reactivate"
        actor: system
        preconditions: ["property reactivated while this letter is SENT or DELIVERED"]
        side_effects: []

  - entity: HolderReport
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /escheatment/holder-reports/{reportId}/submit"
        actor: ComplianceOfficer
        preconditions:
          - "Report is DRAFT (ERR_REPORT_NOT_DRAFT)"
          - "At least one line with status INCLUDED (ERR_EMPTY_REPORT)"
          - "For every INCLUDED line whose property original_value_cents >= rule.dd_threshold_cents, that property has at least one terminal letter (EXPIRED or UNDELIVERABLE) (ERR_DUE_DILIGENCE_INCOMPLETE)"
        side_effects:
          - "submitted_date := clock date; submitted_by_user_id := X-User-ID"
          - "Every INCLUDED line with line_type CASH -> FINAL, final_value_cents := provisional_value_cents"
          - "HolderReport.version increments"
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /escheatment/holder-reports/{reportId}/accept"
        actor: StateAuditor
        preconditions:
          - "Report is SUBMITTED (ERR_REPORT_NOT_SUBMITTED)"
          - "X-User-ID != submitted_by_user_id (ERR_SEGREGATION_OF_DUTIES_VIOLATION)"
        side_effects:
          - "accepted_date := clock date"
          - "Cascade hop 2: every property with a line status IN {INCLUDED, FINAL} in this report REPORTABLE -> REPORTED"
          - "Cascade hop 3: if supersedes_report_id is set, the superseded report ACCEPTED -> SUPERSEDED"
          - "HolderReport.version increments"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /escheatment/holder-reports/{reportId}/reject"
        actor: StateAuditor
        preconditions: ["Report is SUBMITTED (ERR_REPORT_NOT_SUBMITTED)"]
        side_effects: ["rejection_reason recorded"]
      - from: REJECTED
        to: DRAFT
        trigger: "POST /escheatment/holder-reports/{reportId}/reopen"
        actor: ComplianceOfficer
        preconditions: ["Report is REJECTED (ERR_REPORT_NOT_REJECTED)"]
        side_effects: ["submitted_date := null; submitted_by_user_id := null; rejection_reason := null"]
      - from: ACCEPTED
        to: SUPERSEDED
        trigger: "system cascade — an amendment report (supersedes_report_id = this report) is accepted"
        actor: system
        preconditions: []
        side_effects: []

  - entity: ReportLineItem
    initial_state: INCLUDED
    terminal_states: [REMOVED, FINAL]
    transitions:
      - from: INCLUDED
        to: REMOVED
        trigger: "POST /escheatment/holder-reports/{reportId}/line-items/{lineId}/remove OR cascade from property reactivation / letter response"
        actor: ComplianceOfficer | system
        preconditions: ["Direct remove: report is DRAFT (ERR_REPORT_NOT_DRAFT) and line is INCLUDED (ERR_LINE_ITEM_NOT_REMOVABLE)"]
        side_effects: ["Report recomputes total_provisional_cents, total_final_cents, line_count; version increments"]
      - from: INCLUDED
        to: FINAL
        trigger: "CASH lines: report submit. SECURITIES lines: liquidation settle"
        actor: system
        preconditions: []
        side_effects: ["final_value_cents := provisional_value_cents (CASH) or liquidation net_proceeds_cents (SECURITIES)", "Report recomputes total_final_cents"]

  - entity: LiquidationOrder
    initial_state: REQUESTED
    terminal_states: [SETTLED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: EXECUTED
        trigger: "POST /escheatment/liquidation-orders/{orderId}/execute"
        actor: TreasuryOps
        preconditions:
          - "Order is REQUESTED (ERR_LIQUIDATION_INVALID_STATE)"
          - "clock date <= report.due_date + 60 days of the accepted report containing this property (ERR_LIQUIDATION_WINDOW_VIOLATION)"
          - "liquidation_fee_cents <= execution_price_cents_per_share * shares_quantity + accrued_dividends_cents (ERR_LIQUIDATION_FEE_EXCEEDS_GROSS)"
        side_effects:
          - "executed_date := clock date; gross_proceeds_cents := execution_price * shares_quantity"
          - "SecuritiesDetail.status REGISTERED -> EXECUTION_PENDING; pending_execution_price_cents := execution price"
      - from: EXECUTED
        to: SETTLED
        trigger: "POST /escheatment/liquidation-orders/{orderId}/settle"
        actor: TreasuryOps
        preconditions: ["Order is EXECUTED (ERR_LIQUIDATION_INVALID_STATE)"]
        side_effects:
          - "settled_date := clock date; net_proceeds_cents := max(0, gross - fee + accrued_dividends_cents)"
          - "Cascade hop 2: the ReportLineItem for this property with status INCLUDED -> FINAL, final_value_cents := net_proceeds_cents"
          - "Cascade hop 3: HolderReport recomputes total_final_cents (total_provisional_cents unchanged); version increments"
          - "Cascade hop 4: any PENDING Remittance for that report recomputes variance_cents against the new total_final_cents"
          - "SecuritiesDetail.status -> LIQUIDATED; pending_execution_price_cents := null"
      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /escheatment/liquidation-orders/{orderId}/cancel"
        actor: TreasuryOps
        preconditions: ["Order is REQUESTED or EXECUTED (ERR_LIQUIDATION_INVALID_STATE)"]
        side_effects: []
      - from: EXECUTED
        to: CANCELLED
        trigger: "POST /escheatment/liquidation-orders/{orderId}/cancel"
        actor: TreasuryOps
        preconditions: ["Order is REQUESTED or EXECUTED (ERR_LIQUIDATION_INVALID_STATE)"]
        side_effects:
          - "Compensation: SecuritiesDetail.status EXECUTION_PENDING -> REGISTERED; pending_execution_price_cents := null"
          - "ReportLineItem provisional_value_cents and status are unchanged (compensating invariant)"

  - entity: Remittance
    initial_state: PENDING
    terminal_states: [CONFIRMED]
    transitions:
      - from: PENDING
        to: CONFIRMED
        trigger: "POST /escheatment/remittances/{remittanceId}/confirm"
        actor: StateAuditor
        preconditions:
          - "Remittance is PENDING (ERR_REMITTANCE_NOT_PENDING)"
          - "All non-REMOVED lines of the report are FINAL (ERR_LINES_NOT_FINAL)"
          - "variance_cents == amount_cents - report.total_final_cents == 0 exactly (ERR_REMITTANCE_VARIANCE_NONZERO)"
        side_effects:
          - "confirmed_date := clock date"
          - "Cascade hop 2: report.confirmed_remittance_cents += amount_cents; version increments"
          - "Cascade hop 3: every property with a line status IN {INCLUDED, FINAL} in the report REPORTED -> REMITTED"
      - from: PENDING
        to: FAILED
        trigger: "POST /escheatment/remittances/{remittanceId}/fail"
        actor: StateAuditor
        preconditions: ["Remittance is PENDING (ERR_REMITTANCE_NOT_PENDING)"]
        side_effects: ["failure_reason recorded"]
      - from: FAILED
        to: PENDING
        trigger: "POST /escheatment/remittances/{remittanceId}/requeue"
        actor: TreasuryOps
        preconditions: ["Remittance is FAILED (ERR_REMITTANCE_NOT_FAILED)"]
        side_effects: ["amount_cents := request amount_cents; failure_reason := null; variance_cents recomputed lazily at confirm"]

  - entity: OwnerClaim
    initial_state: SUBMITTED
    terminal_states: [PAID, DENIED, WITHDRAWN]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /escheatment/owner-claims/{claimId}/start-review"
        actor: ClaimsExaminer
        preconditions: ["Claim is SUBMITTED (ERR_CLAIM_NOT_SUBMITTED)"]
        side_effects: ["reviewed_by_user_id := X-User-ID"]
      - from: UNDER_REVIEW
        to: MORE_INFO_REQUESTED
        trigger: "POST /escheatment/owner-claims/{claimId}/request-info"
        actor: ClaimsExaminer
        preconditions: ["Claim is UNDER_REVIEW (ERR_CLAIM_NOT_UNDER_REVIEW)"]
        side_effects: []
      - from: MORE_INFO_REQUESTED
        to: UNDER_REVIEW
        trigger: "POST /escheatment/owner-claims/{claimId}/submit-info"
        actor: Claimant
        preconditions:
          - "Claim is MORE_INFO_REQUESTED (ERR_CLAIM_NOT_AWAITING_INFO)"
          - "X-User-ID == claimant_owner_id (ERR_OWNERSHIP_SCOPE_VIOLATION)"
        side_effects: []
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /escheatment/owner-claims/{claimId}/approve"
        actor: ClaimsApprover
        preconditions:
          - "Claim is UNDER_REVIEW (ERR_CLAIM_NOT_UNDER_REVIEW)"
          - "X-User-ID != reviewed_by_user_id (ERR_SEGREGATION_OF_DUTIES_VIOLATION)"
          - "Property still REMITTED or ESCHEATED (ERR_PROPERTY_NOT_CLAIMABLE)"
        side_effects:
          - "claim_payout computed: approved_base_cents / approved_interest_cents / processing_fee_cents / approved_payout_cents set"
          - "decided_by_user_id := X-User-ID"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /escheatment/owner-claims/{claimId}/deny"
        actor: ClaimsApprover
        preconditions:
          - "Claim is UNDER_REVIEW (ERR_CLAIM_NOT_UNDER_REVIEW)"
          - "X-User-ID != reviewed_by_user_id (ERR_SEGREGATION_OF_DUTIES_VIOLATION)"
        side_effects: ["denial_reason recorded", "decided_by_user_id := X-User-ID"]
      - from: APPROVED
        to: PAID
        trigger: "POST /escheatment/owner-claims/{claimId}/pay"
        actor: TreasuryOps
        preconditions: ["Claim is APPROVED (ERR_CLAIM_NOT_APPROVED)"]
        side_effects:
          - "paid_date := clock date"
          - "Cascade hop 2: Property REMITTED -> REUNITED or ESCHEATED -> REUNITED; reunited_date set"
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /escheatment/owner-claims/{claimId}/withdraw"
        actor: Claimant
        preconditions:
          - "Claim is SUBMITTED or MORE_INFO_REQUESTED (ERR_CLAIM_NOT_WITHDRAWABLE)"
          - "X-User-ID == claimant_owner_id (ERR_OWNERSHIP_SCOPE_VIOLATION)"
        side_effects: []
      - from: MORE_INFO_REQUESTED
        to: WITHDRAWN
        trigger: "POST /escheatment/owner-claims/{claimId}/withdraw"
        actor: Claimant
        preconditions:
          - "Claim is SUBMITTED or MORE_INFO_REQUESTED (ERR_CLAIM_NOT_WITHDRAWABLE)"
          - "X-User-ID == claimant_owner_id (ERR_OWNERSHIP_SCOPE_VIOLATION)"
        side_effects: []

  - entity: PenaltyAssessment
    initial_state: ASSESSED
    terminal_states: [PAID, WAIVED]
    transitions:
      - from: ASSESSED
        to: PAID
        trigger: "POST /escheatment/penalty-assessments/{assessmentId}/pay"
        actor: TreasuryOps
        preconditions: ["Assessment is ASSESSED (ERR_PENALTY_NOT_ASSESSED)"]
        side_effects: []
      - from: ASSESSED
        to: WAIVED
        trigger: "POST /escheatment/penalty-assessments/{assessmentId}/waive"
        actor: StateAuditor
        preconditions: ["Assessment is ASSESSED or DISPUTED (ERR_PENALTY_NOT_ASSESSED)"]
        side_effects: ["waiver_reason recorded"]
      - from: DISPUTED
        to: WAIVED
        trigger: "POST /escheatment/penalty-assessments/{assessmentId}/waive"
        actor: StateAuditor
        preconditions: ["Assessment is ASSESSED or DISPUTED (ERR_PENALTY_NOT_ASSESSED)"]
        side_effects: ["waiver_reason recorded"]
      - from: ASSESSED
        to: DISPUTED
        trigger: "POST /escheatment/penalty-assessments/{assessmentId}/dispute"
        actor: ComplianceOfficer
        preconditions: ["Assessment is ASSESSED (ERR_PENALTY_NOT_ASSESSED)"]
        side_effects: ["dispute_reason recorded"]
      - from: DISPUTED
        to: ASSESSED
        trigger: "POST /escheatment/penalty-assessments/{assessmentId}/uphold"
        actor: StateAuditor
        preconditions: ["Assessment is DISPUTED (ERR_PENALTY_NOT_DISPUTED)"]
        side_effects: []

  - entity: AuditCase
    initial_state: OPENED
    terminal_states: [CLOSED]
    transitions:
      - from: OPENED
        to: FIELDWORK
        trigger: "POST /escheatment/audit-cases/{auditId}/advance"
        actor: StateAuditor
        preconditions: ["Current state is not CLOSED (ERR_AUDIT_CASE_NOT_ADVANCEABLE)"]
        side_effects: []
      - from: FIELDWORK
        to: FINDINGS_ISSUED
        trigger: "POST /escheatment/audit-cases/{auditId}/advance"
        actor: StateAuditor
        preconditions: ["Current state is not CLOSED (ERR_AUDIT_CASE_NOT_ADVANCEABLE)"]
        side_effects: ["estimated_exposure_cents := audit_exposure_estimate over candidate properties at this moment"]
      - from: FINDINGS_ISSUED
        to: CLOSED
        trigger: "POST /escheatment/audit-cases/{auditId}/advance"
        actor: StateAuditor
        preconditions: ["Current state is not CLOSED (ERR_AUDIT_CASE_NOT_ADVANCEABLE)"]
        side_effects: []

  - entity: DocumentRecord
    initial_state: REGISTERED
    terminal_states: [PURGED]
    transitions:
      - from: REGISTERED
        to: PURGED
        trigger: "POST /escheatment/document-records/{docId}/purge"
        actor: HolderAdmin
        preconditions:
          - "Record is REGISTERED (ERR_DOCUMENT_ALREADY_PURGED)"
          - "clock date >= retention_until (ERR_RETENTION_PERIOD_NOT_ELAPSED); purge is allowed exactly on retention_until"
        side_effects: ["purged_at := clock datetime; record excluded from list results unless include_purged=true"]

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: report-line-add-stale-version
    parent_entity: HolderReport
    write_endpoint: "POST /escheatment/holder-reports/{reportId}/line-items"
    occ_field: expected_report_version
    description: |
      Adding a ReportLineItem to a DRAFT HolderReport whose version has advanced
      since the client last observed it is rejected. The client computed report
      totals from a stale read; the OCC check on HolderReport.version forces a
      re-read before another line is admitted.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: report-amendment-stale-version
    parent_entity: HolderReport
    write_endpoint: "POST /escheatment/holder-reports/{reportId}/amendments"
    occ_field: expected_report_version
    description: |
      Creating an amendment that supersedes an ACCEPTED HolderReport whose
      version has advanced since the client last observed it is rejected.
      Amendment creation legitimately supersedes the prior report chain head,
      so a stale expected version means the client's view of the chain head is
      out of date (e.g., another amendment was already created against it).
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: dormancy_determination
    trigger: "POST /escheatment/_sweeps/dormancy"
    algorithm: threshold
    formula: |
      rule = DormancyRule where rule.state_code == property.state_code
        AND rule.property_type == property.property_type
        AND rule.effective_from <= property.last_contact_date
        AND (rule.effective_to IS NULL OR property.last_contact_date < rule.effective_to)
      If no rule: property is skipped (no error).
      anniversary = property.last_contact_date + rule.dormancy_years years (same month-day)
      If sweep_date > anniversary (strictly greater):
        property ACTIVE -> DORMANT, dormancy_date := anniversary + 1 day
      Exactly on the anniversary the property remains ACTIVE.
    input_set: "All properties with status ACTIVE"
    constants:
      BOUNDARY: "strictly-greater comparison against the anniversary date"
    precision: "whole days; date arithmetic only"

  - name: applicable_report_window
    trigger: "due-diligence letter creation; audit_exposure_estimate"
    algorithm: interval_merge
    formula: |
      cutoff(Y) = date(Y, rule.report_cutoff_month_day); due(Y) = date(Y, rule.report_due_month_day)
      Y0 = smallest year with cutoff(Y0) >= dormancy_date
      While due(Y0) < current_date: Y0 += 1   (missed cycles roll forward)
      applicable_due_date = due(Y0)
      letter window = [applicable_due_date - rule.dd_window_max_days,
                       applicable_due_date - rule.dd_window_min_days]  (both ends inclusive)
    input_set: "The property's applicable DormancyRule and its dormancy_date"
    precision: "whole days"

  - name: letter_response_deadline
    trigger: "letter creation; POST /escheatment/_sweeps/dormancy"
    algorithm: threshold
    formula: |
      response_deadline = sent_date + 30 days
      On sweep: letter in SENT | DELIVERED with sweep_date > response_deadline -> EXPIRED
      On the deadline day itself the letter remains open.
    input_set: "Letters with status SENT or DELIVERED"
    constants:
      RESPONSE_DAYS: 30
    precision: "whole days"

  - name: securities_valuation
    trigger: "provisional variant: report line-item inclusion for BROKERAGE_SHARES; final variant: liquidation settle"
    algorithm: aggregation
    formula: |
      provisional_value_cents = last_close_price_cents * shares_quantity + accrued_dividends_cents
      final_value_cents       = max(0, execution_price_cents_per_share * shares_quantity
                                     - liquidation_fee_cents + accrued_dividends_cents)
    input_set: "The property's SecuritiesDetail; final variant also the LiquidationOrder"
    precision: "integer cents; all inputs integer so no rounding occurs"
    variants:
      - name: provisional
        when: "line-item inclusion into a DRAFT report (uses last close price)"
        difference: "values shares at last_close_price_cents and takes no fee deduction"
      - name: final
        when: "liquidation order settle (uses actual execution price)"
        difference: "values shares at execution_price_cents_per_share, subtracts liquidation_fee_cents, floors at 0; for identical inputs the two variants generally differ"

  - name: report_totals
    trigger: "line-item add, line-item remove, report submit (cash finalization), liquidation settle, amendment copy, property reactivation cascade"
    algorithm: aggregation
    formula: |
      included = lines of the report with status IN {INCLUDED, FINAL}
      total_provisional_cents = sum(l.provisional_value_cents for l in included)
      total_final_cents       = sum(l.final_value_cents if l.status == FINAL else l.provisional_value_cents for l in included)
      line_count              = len(included)
      Recomputed eagerly on every triggering mutation; updated_at and version bump on the report.
    input_set: "ReportLineItems of the report with status IN {INCLUDED, FINAL} (REMOVED excluded)"
    precision: "integer cents"

  - name: late_penalty
    trigger: "POST /escheatment/holder-reports/{reportId}/penalty-assessments"
    algorithm: tiered_pricing
    formula: |
      days_late = max(0, submitted_date - due_date) in whole days
      If days_late == 0: penalty_cents = 0
      rate = rule.daily_penalty_cents        if 1 <= days_late <= rule.gross_negligence_day_threshold
           = rule.gross_daily_penalty_cents  if days_late > rule.gross_negligence_day_threshold  (gross rate applies to ALL days, not marginal)
      raw = rate * days_late
      cap = floor(rule.penalty_cap_pct * report.total_provisional_cents / 100)
      penalty_cents = min(raw, cap)
    input_set: "The assessed HolderReport (submitted_date, due_date, total_provisional_cents at submission) and the DormancyRule for (report.state_code, any property_type on the report) — a report's lines all share one state; the rule of the first INCLUDED line's property_type supplies rates"
    precision: "integer cents; cap uses floor"
    variants: []

  - name: late_interest
    trigger: "POST /escheatment/holder-reports/{reportId}/penalty-assessments"
    algorithm: aggregation
    formula: |
      If days_late == 0 (report submitted on/before due_date): interest_cents = 0
      days_interest = (assessed_date - due_date) in whole days
      For each line with status IN {INCLUDED, FINAL}:
        base = line.final_value_cents if FINAL else line.provisional_value_cents
        line_interest = round_half_up(base * rule.annual_interest_rate_bp * days_interest / 3_650_000)
      interest_cents = sum(line_interest)
      PINNED ROUNDING ORDER: round each line to whole cents first, THEN sum.
      (Sum-then-round of the same inputs can differ by >= 1 cent.)
    input_set: "Lines of the report with status IN {INCLUDED, FINAL}"
    constants:
      BP_DENOMINATOR: 3650000   # 10_000 * 365
    precision: "whole cents, round_half_up per line then sum"

  - name: claim_payout
    trigger: "POST /escheatment/owner-claims/{claimId}/approve"
    algorithm: tiered_pricing
    formula: |
      PINNED EVALUATION ORDER (resolves the apparent fee<->gross circularity):
      (1) base: CASH -> final_value_cents of the property's line in the remitted report;
                SECURITIES -> net_proceeds_cents of the property's SETTLED liquidation order
      (2) interest: CASH -> round_half_up(base * rule.annual_interest_rate_bp * days_held / 3_650_000)
                    where days_held = max(0, approve_date - remittance.confirmed_date)
                    SECURITIES -> 0 (states return liquidation proceeds without interest)
      (3) gross = base + interest
      (4) fee tier selected by gross: fee applies iff gross > CLAIM_FEE_FREE_CAP_CENTS
      (5) processing_fee_cents = round_half_up(gross * CLAIM_FEE_BP / 10_000) if tier applies else 0
      (6) approved_payout_cents = gross - processing_fee_cents
    input_set: "The claim's property, its FINAL report line (CASH) or SETTLED liquidation order (SECURITIES), the CONFIRMED remittance, and the DormancyRule for (property.state_code, property.property_type)"
    constants:
      CLAIM_FEE_BP: 150               # 1.5%
      CLAIM_FEE_FREE_CAP_CENTS: 100000
    precision: "whole cents, round_half_up at steps (2) and (5)"
    variants:
      - name: cash_with_interest
        when: "claim_type == CASH"
        difference: "base is the remitted line value; interest accrues from remittance confirmation to approval"
      - name: securities_proceeds_only
        when: "claim_type == SECURITIES"
        difference: "base is liquidation net proceeds; interest is always 0 — identical base amounts yield different payouts than the cash variant whenever days_held > 0"

  - name: audit_exposure_estimate
    trigger: "POST /escheatment/audit-cases/{auditId}/advance (FIELDWORK -> FINDINGS_ISSUED)"
    algorithm: aggregation
    formula: |
      candidates = properties with state_code == audit.state_code,
        status IN {DORMANT, DUE_DILIGENCE, REPORTABLE},
        dormancy_date within [date(lookback_start_year,01,01), date(lookback_end_year,12,31)] (closed interval),
        and no line with status IN {INCLUDED, FINAL} in any SUBMITTED or ACCEPTED report
      For each candidate (using its DormancyRule):
        missed_due = applicable_report_window due date computed from dormancy_date WITHOUT roll-forward
        days_past_due = max(0, current_date - missed_due)
        rate = daily_penalty_cents if days_past_due <= gross_negligence_day_threshold else gross_daily_penalty_cents
        penalty_i = min(rate * days_past_due, floor(penalty_cap_pct * original_value_cents / 100))
        interest_i = round_half_up(original_value_cents * annual_interest_rate_bp * days_past_due / 3_650_000)
        exposure_i = original_value_cents + penalty_i + interest_i
      estimated_exposure_cents = sum(exposure_i); empty candidate set -> 0
      Processing order: candidate with earliest dormancy_date first; ties broken by created_at ASC. (Order does not affect the sum.)
    input_set: "Properties per the filter above"
    precision: "integer cents; per-item interest round_half_up then sum"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present; X-User-Role is a declared role"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all"
  - priority: 2
    category: auth
    check: "The role is permitted on this endpoint per §1.5 roles"
    error_id: ERR_UNAUTHORIZED_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Request body is well-formed: all required fields present, types match, enum values in range, date strings parse, integers in declared ranges"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all endpoints with a request body"
  - priority: 4
    category: existence
    check: "Path resource ids exist, validated left-to-right through the path"
    error_id: "ERR_OWNER_NOT_FOUND / ERR_PROPERTY_NOT_FOUND / ERR_DORMANCY_RULE_NOT_FOUND / ERR_CONTACT_EVENT_NOT_FOUND / ERR_LETTER_NOT_FOUND / ERR_REPORT_NOT_FOUND / ERR_LINE_ITEM_NOT_FOUND / ERR_SECURITIES_DETAIL_NOT_FOUND / ERR_LIQUIDATION_ORDER_NOT_FOUND / ERR_REMITTANCE_NOT_FOUND / ERR_CLAIM_NOT_FOUND / ERR_PENALTY_ASSESSMENT_NOT_FOUND / ERR_AUDIT_CASE_NOT_FOUND / ERR_DOCUMENT_RECORD_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path ids"
  - priority: 5
    category: auth
    check: "Ownership scoping: a Claimant may only create claims / submit-info / withdraw / add contact events / read single resources where the owner linkage equals X-User-ID"
    error_id: ERR_OWNERSHIP_SCOPE_VIOLATION
    http_status: 403
    applies_to: "POST /owner-claims; POST /owner-claims/{id}/submit-info, /withdraw; POST /properties/{id}/contact-events (as Claimant); single-GET endpoints as Claimant"
  - priority: 6
    category: business_safety
    check: "Segregation of duties: report acceptor X-User-ID != report.submitted_by_user_id; claim approver/denier X-User-ID != claim.reviewed_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES_VIOLATION
    http_status: 403
    applies_to: "POST /holder-reports/{id}/accept; POST /owner-claims/{id}/approve; POST /owner-claims/{id}/deny"
  - priority: 7
    category: state
    check: "OCC: expected_report_version equals HolderReport.version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /holder-reports/{id}/line-items; POST /holder-reports/{id}/amendments"
  - priority: 8
    category: state
    check: "The path resource's own state machine precondition for the attempted transition"
    error_id: "ERR_PROPERTY_NOT_DORMANT / ERR_PROPERTY_NOT_REACTIVATABLE / ERR_PROPERTY_NOT_REMITTED / ERR_LETTER_NOT_ACTIONABLE / ERR_REPORT_NOT_DRAFT / ERR_REPORT_NOT_SUBMITTED / ERR_REPORT_NOT_REJECTED / ERR_REPORT_NOT_ACCEPTED / ERR_LINE_ITEM_NOT_REMOVABLE / ERR_LIQUIDATION_INVALID_STATE / ERR_REMITTANCE_NOT_PENDING / ERR_REMITTANCE_NOT_FAILED / ERR_CLAIM_NOT_SUBMITTED / ERR_CLAIM_NOT_UNDER_REVIEW / ERR_CLAIM_NOT_AWAITING_INFO / ERR_CLAIM_NOT_APPROVED / ERR_CLAIM_NOT_WITHDRAWABLE / ERR_PENALTY_NOT_ASSESSED / ERR_PENALTY_NOT_DISPUTED / ERR_AUDIT_CASE_NOT_ADVANCEABLE / ERR_DOCUMENT_ALREADY_PURGED"
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 9
    category: business_constraint
    check: "Uniqueness / overlap: one active letter per property; one report per (state_code, report_year) not SUPERSEDED; one pending amendment per superseded report; one SecuritiesDetail per property; one PENDING remittance per report; one ASSESSED|DISPUTED penalty per report; one non-terminal claim per property; one non-terminal liquidation order per property; DormancyRule half-open effective-window overlap; AuditCase closed lookback-window overlap"
    error_id: "ERR_DUPLICATE_ACTIVE_LETTER / ERR_DUPLICATE_REPORT_PERIOD / ERR_PENDING_AMENDMENT_EXISTS / ERR_SECURITIES_DETAIL_EXISTS / ERR_REMITTANCE_ALREADY_PENDING / ERR_PENALTY_ALREADY_ASSESSED / ERR_DUPLICATE_ACTIVE_CLAIM / ERR_DUPLICATE_ACTIVE_LIQUIDATION / ERR_DORMANCY_RULE_OVERLAP / ERR_AUDIT_LOOKBACK_OVERLAP"
    http_status: 409
    applies_to: "create endpoints for the named resources"
  - priority: 10
    category: business_temporal
    check: "Window checks: due-diligence send window; liquidation execution grace (clock date <= due_date + 60); document retention (clock date >= retention_until)"
    error_id: "ERR_DUE_DILIGENCE_WINDOW_VIOLATION / ERR_LIQUIDATION_WINDOW_VIOLATION / ERR_RETENTION_PERIOD_NOT_ELAPSED"
    http_status: 409
    applies_to: "POST /properties/{id}/due-diligence-letters; POST /liquidation-orders/{id}/execute; POST /document-records/{id}/purge"
  - priority: 11
    category: business_referential
    check: "Referenced-entity state/config: applicable DormancyRule exists; property.state_code == owner.state_code; property REPORTABLE on line add; property REMITTED|ESCHEATED on claim create/approve; property REPORTED on liquidation request; property is BROKERAGE_SHARES on securities-detail create and liquidation request; SecuritiesDetail present for BROKERAGE_SHARES line add and liquidation; all non-REMOVED lines FINAL on remittance confirm; due-diligence applicability threshold on letter create; contact event belongs to property and qualifies; property not in a SUBMITTED/ACCEPTED report on reactivate; report lines present and due-diligence complete on submit"
    error_id: "ERR_NO_APPLICABLE_DORMANCY_RULE / ERR_OWNER_STATE_MISMATCH / ERR_PROPERTY_NOT_REPORTABLE / ERR_PROPERTY_NOT_CLAIMABLE / ERR_PROPERTY_NOT_REPORTED / ERR_NOT_SECURITIES_PROPERTY / ERR_SECURITIES_DETAIL_REQUIRED / ERR_LINES_NOT_FINAL / ERR_DUE_DILIGENCE_NOT_REQUIRED / ERR_CONTACT_EVENT_PROPERTY_MISMATCH / ERR_CONTACT_NOT_QUALIFYING / ERR_PROPERTY_IN_SUBMITTED_REPORT / ERR_EMPTY_REPORT / ERR_DUE_DILIGENCE_INCOMPLETE"
    http_status: 422
    applies_to: "endpoints referencing other entities in body or by cascade"
  - priority: 12
    category: business_fiscal
    check: "Amount checks: remittance variance exactly 0; liquidation fee <= gross + dividends; claim recoverable base > 0"
    error_id: "ERR_REMITTANCE_VARIANCE_NONZERO / ERR_LIQUIDATION_FEE_EXCEEDS_GROSS / ERR_CLAIM_EXCEEDS_RECOVERABLE"
    http_status: 422
    applies_to: "POST /remittances/{id}/confirm; POST /liquidation-orders/{id}/execute; POST /owner-claims"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Owners ---
  - { method: POST, path: "/escheatment/owners", description: "Register an owner", roles: [ComplianceOfficer], code: 201, input: [full_name, last_known_address, state_code, "deceased_date?"], output: Owner, side_effects: [] }
  - { method: GET, path: "/escheatment/owners", description: "List owners (paginated)", roles: [Any], code: 200, input: ["state_code?", "limit?", "offset?"], output: "Owner[]", side_effects: [] }
  - { method: GET, path: "/escheatment/owners/{ownerId}", description: "Get one owner (Claimant: only own id)", roles: [Any, Claimant], code: 200, input: [], output: Owner, side_effects: [] }
  - { method: GET, path: "/escheatment/owners/{id}/properties", description: "List an owner's properties", roles: [Any, Claimant], code: 200, input: ["limit?", "offset?"], output: "Property[]", side_effects: [] }
  - { method: GET, path: "/escheatment/owners/{id}/owner-claims", description: "List claims filed by an owner", roles: [Any, Claimant], code: 200, input: ["limit?", "offset?"], output: "OwnerClaim[]", side_effects: [] }

  # --- Dormancy rules ---
  - { method: POST, path: "/escheatment/dormancy-rules", description: "Create a dormancy rule for (state_code, property_type); half-open effective window must not overlap a sibling rule", roles: [HolderAdmin], code: 201, input: [state_code, property_type, dormancy_years, effective_from, "effective_to?", "dd_threshold_cents?", "dd_window_min_days?", "dd_window_max_days?", "annual_interest_rate_bp?", "daily_penalty_cents?", "gross_daily_penalty_cents?", "gross_negligence_day_threshold?", "penalty_cap_pct?", "report_cutoff_month_day?", "report_due_month_day?"], output: DormancyRule, side_effects: [] }
  - { method: GET, path: "/escheatment/dormancy-rules", description: "List dormancy rules", roles: [Any], code: 200, input: ["state_code?", "property_type?", "limit?", "offset?"], output: "DormancyRule[]", side_effects: [] }
  - { method: GET, path: "/escheatment/dormancy-rules/{ruleId}", description: "Get one dormancy rule", roles: [Any], code: 200, input: [], output: DormancyRule, side_effects: [] }
  - { method: PUT, path: "/escheatment/dormancy-rules/{ruleId}", description: "Update a dormancy rule; effective-window overlap re-validated against siblings", roles: [HolderAdmin], code: 200, input: ["dormancy_years?", "effective_from?", "effective_to?", "dd_threshold_cents?", "dd_window_min_days?", "dd_window_max_days?", "annual_interest_rate_bp?", "daily_penalty_cents?", "gross_daily_penalty_cents?", "gross_negligence_day_threshold?", "penalty_cap_pct?", "report_cutoff_month_day?", "report_due_month_day?"], output: DormancyRule, side_effects: ["DormancyRule.version increments"] }

  # --- Properties ---
  - { method: POST, path: "/escheatment/properties", description: "Register a property; requires an applicable DormancyRule effective at last_contact_date and state_code == owner.state_code", roles: [ComplianceOfficer], code: 201, input: [owner_id, property_type, state_code, original_value_cents, last_contact_date], output: Property, side_effects: ["status = ACTIVE"] }
  - { method: GET, path: "/escheatment/properties", description: "List properties", roles: [Any], code: 200, input: ["owner_id?", "state_code?", "status?", "limit?", "offset?"], output: "Property[]", side_effects: [] }
  - { method: GET, path: "/escheatment/properties/{propertyId}", description: "Get one property (Claimant: only own)", roles: [Any, Claimant], code: 200, input: [], output: Property, side_effects: [] }
  - { method: POST, path: "/escheatment/properties/{propertyId}/reactivate", description: "Reactivate a dormant pipeline property with qualifying contact evidence", roles: [ComplianceOfficer], code: 200, input: [evidence_contact_event_id], output: Property, side_effects: ["status -> ACTIVE", "SENT/DELIVERED letter -> VOIDED", "DRAFT-report INCLUDED lines -> REMOVED", "affected DRAFT reports recompute totals, version increments", "dormancy_date := null"] }
  - { method: POST, path: "/escheatment/properties/{propertyId}/contact-events", description: "Record an owner contact (Claimant: only for own property); updates last_contact_date when newer", roles: [ComplianceOfficer, Claimant], code: 201, input: [contact_type, contact_date, evidence_ref], output: ContactEvent, side_effects: ["qualifies_for_reactivation computed", "property.last_contact_date := max(existing, contact_date)"] }
  - { method: GET, path: "/escheatment/properties/{id}/contact-events", description: "List contact events for a property", roles: [Any], code: 200, input: ["limit?", "offset?"], output: "ContactEvent[]", side_effects: [] }
  - { method: GET, path: "/escheatment/properties/{id}/report-line-items", description: "List report line items referencing a property", roles: [Any], code: 200, input: ["limit?", "offset?"], output: "ReportLineItem[]", side_effects: [] }
  - { method: GET, path: "/escheatment/properties/{id}/owner-claims", description: "List claims filed against a property", roles: [Any], code: 200, input: ["limit?", "offset?"], output: "OwnerClaim[]", side_effects: [] }
  - { method: POST, path: "/escheatment/properties/{propertyId}/escheat", description: "State takes custody of a REMITTED property", roles: [StateAuditor], code: 200, input: [], output: Property, side_effects: ["status REMITTED -> ESCHEATED", "escheated_date set"] }

  # --- Due-diligence letters ---
  - { method: POST, path: "/escheatment/properties/{propertyId}/due-diligence-letters", description: "Send a due-diligence letter (created in SENT; sent_date = clock date)", roles: [ComplianceOfficer], code: 201, input: [], output: DueDiligenceLetter, side_effects: ["property DORMANT -> DUE_DILIGENCE", "response_deadline and applicable_due_date computed"] }
  - { method: GET, path: "/escheatment/properties/{id}/due-diligence-letters", description: "List letters for a property", roles: [Any], code: 200, input: ["limit?", "offset?"], output: "DueDiligenceLetter[]", side_effects: [] }
  - { method: GET, path: "/escheatment/due-diligence-letters/{letterId}", description: "Get one letter", roles: [Any], code: 200, input: [], output: DueDiligenceLetter, side_effects: [] }
  - { method: POST, path: "/escheatment/due-diligence-letters/{letterId}/mark-delivered", description: "Mark a letter delivered", roles: [ComplianceOfficer], code: 200, input: [], output: DueDiligenceLetter, side_effects: ["status SENT -> DELIVERED"] }
  - { method: POST, path: "/escheatment/due-diligence-letters/{letterId}/mark-undeliverable", description: "Mark a letter undeliverable; property becomes REPORTABLE", roles: [ComplianceOfficer], code: 200, input: [], output: DueDiligenceLetter, side_effects: ["status -> UNDELIVERABLE", "property DUE_DILIGENCE -> REPORTABLE"] }
  - { method: POST, path: "/escheatment/due-diligence-letters/{letterId}/record-response", description: "Record owner response with qualifying contact evidence; property reactivates", roles: [ComplianceOfficer], code: 200, input: [response_contact_event_id], output: DueDiligenceLetter, side_effects: ["status -> RESPONDED", "property DUE_DILIGENCE -> ACTIVE with line-removal cascade"] }

  # --- Holder reports ---
  - { method: POST, path: "/escheatment/holder-reports", description: "Create a DRAFT report for (state_code, report_year); one non-SUPERSEDED report per pair", roles: [ComplianceOfficer], code: 201, input: [state_code, report_year], output: HolderReport, side_effects: ["status = DRAFT", "cutoff_date and due_date computed from the state's DormancyRule"] }
  - { method: GET, path: "/escheatment/holder-reports", description: "List reports", roles: [Any], code: 200, input: ["state_code?", "report_year?", "status?", "limit?", "offset?"], output: "HolderReport[]", side_effects: [] }
  - { method: GET, path: "/escheatment/holder-reports/{reportId}", description: "Get one report", roles: [Any], code: 200, input: [], output: HolderReport, side_effects: [] }
  - { method: POST, path: "/escheatment/holder-reports/{reportId}/amendments", description: "Create an amendment DRAFT superseding an ACCEPTED report (OCC on the superseded report's version); copies non-REMOVED lines", roles: [ComplianceOfficer], code: 201, input: [expected_report_version], output: HolderReport, side_effects: ["new DRAFT report with supersedes_report_id := path report", "non-REMOVED lines copied as new INCLUDED lines", "superseded HolderReport.version increments"] }
  - { method: GET, path: "/escheatment/holder-reports/{id}/amendments", description: "List amendment reports superseding this report", roles: [Any], code: 200, input: ["limit?", "offset?"], output: "HolderReport[]", side_effects: [] }
  - { method: POST, path: "/escheatment/holder-reports/{reportId}/line-items", description: "Add a REPORTABLE property to a DRAFT report (OCC on report version)", roles: [ComplianceOfficer], code: 201, input: [property_id, expected_report_version], output: ReportLineItem, side_effects: ["line created INCLUDED with provisional_value_cents computed", "report totals recomputed", "HolderReport.version increments"] }
  - { method: GET, path: "/escheatment/holder-reports/{id}/line-items", description: "List a report's line items", roles: [Any], code: 200, input: ["limit?", "offset?"], output: "ReportLineItem[]", side_effects: [] }
  - { method: POST, path: "/escheatment/holder-reports/{reportId}/line-items/{lineId}/remove", description: "Remove an INCLUDED line from a DRAFT report", roles: [ComplianceOfficer], code: 200, input: [], output: ReportLineItem, side_effects: ["line -> REMOVED", "report totals recomputed", "HolderReport.version increments"] }
  - { method: POST, path: "/escheatment/holder-reports/{reportId}/submit", description: "Submit a DRAFT report; cash lines finalize at provisional value", roles: [ComplianceOfficer], code: 200, input: [], output: HolderReport, side_effects: ["status -> SUBMITTED", "submitted_date/submitted_by set", "CASH lines -> FINAL", "version increments"] }
  - { method: POST, path: "/escheatment/holder-reports/{reportId}/accept", description: "State accepts a SUBMITTED report (acceptor must differ from submitter)", roles: [StateAuditor], code: 200, input: [], output: HolderReport, side_effects: ["status -> ACCEPTED", "accepted_date set", "line properties REPORTABLE -> REPORTED", "superseded report -> SUPERSEDED", "version increments"] }
  - { method: POST, path: "/escheatment/holder-reports/{reportId}/reject", description: "State rejects a SUBMITTED report", roles: [StateAuditor], code: 200, input: [rejection_reason], output: HolderReport, side_effects: ["status -> REJECTED"] }
  - { method: POST, path: "/escheatment/holder-reports/{reportId}/reopen", description: "Reopen a REJECTED report back to DRAFT for revision", roles: [ComplianceOfficer], code: 200, input: [], output: HolderReport, side_effects: ["status -> DRAFT", "submitted_date/submitted_by/rejection_reason cleared"] }

  # --- Securities detail ---
  - { method: POST, path: "/escheatment/properties/{propertyId}/securities-detail", description: "Register securities detail on a BROKERAGE_SHARES property (1:1)", roles: [ComplianceOfficer], code: 201, input: [cusip, shares_quantity, last_close_price_cents, accrued_dividends_cents], output: SecuritiesDetail, side_effects: ["status = REGISTERED"] }
  - { method: GET, path: "/escheatment/properties/{id}/securities-detail", description: "Get the securities detail for a property (array of 0 or 1)", roles: [Any], code: 200, input: [], output: "SecuritiesDetail[]", side_effects: [] }

  # --- Liquidation ---
  - { method: POST, path: "/escheatment/liquidation-orders", description: "Request liquidation of a REPORTED securities property; one non-terminal order per property", roles: [TreasuryOps], code: 201, input: [property_id, liquidation_fee_cents], output: LiquidationOrder, side_effects: ["status = REQUESTED"] }
  - { method: GET, path: "/escheatment/liquidation-orders/{orderId}", description: "Get one liquidation order", roles: [Any], code: 200, input: [], output: LiquidationOrder, side_effects: [] }
  - { method: GET, path: "/escheatment/properties/{id}/liquidation-orders", description: "List liquidation orders for a property", roles: [Any], code: 200, input: ["limit?", "offset?"], output: "LiquidationOrder[]", side_effects: [] }
  - { method: POST, path: "/escheatment/liquidation-orders/{orderId}/execute", description: "Execute a REQUESTED order at an actual price", roles: [TreasuryOps], code: 200, input: [execution_price_cents_per_share], output: LiquidationOrder, side_effects: ["status -> EXECUTED", "gross_proceeds computed", "SecuritiesDetail -> EXECUTION_PENDING"] }
  - { method: POST, path: "/escheatment/liquidation-orders/{orderId}/settle", description: "Settle an EXECUTED order; finalizes line value and cascades to report totals", roles: [TreasuryOps], code: 200, input: [], output: LiquidationOrder, side_effects: ["status -> SETTLED", "net_proceeds computed", "line -> FINAL", "report total_final recomputed", "PENDING remittance variance recomputed", "SecuritiesDetail -> LIQUIDATED"] }
  - { method: POST, path: "/escheatment/liquidation-orders/{orderId}/cancel", description: "Cancel a REQUESTED or EXECUTED order; reverses staged execution effects", roles: [TreasuryOps], code: 200, input: [], output: LiquidationOrder, side_effects: ["status -> CANCELLED", "from EXECUTED: SecuritiesDetail -> REGISTERED, pending price cleared"] }

  # --- Remittances ---
  - { method: POST, path: "/escheatment/holder-reports/{reportId}/remittances", description: "Create a PENDING remittance for an ACCEPTED report; all-FINAL lines and zero variance are enforced at confirm time, not here", roles: [TreasuryOps], code: 201, input: [amount_cents], output: Remittance, side_effects: ["status = PENDING"] }
  - { method: GET, path: "/escheatment/holder-reports/{id}/remittances", description: "List remittances for a report", roles: [Any], code: 200, input: ["limit?", "offset?"], output: "Remittance[]", side_effects: [] }
  - { method: GET, path: "/escheatment/remittances/{remittanceId}", description: "Get one remittance", roles: [Any], code: 200, input: [], output: Remittance, side_effects: [] }
  - { method: POST, path: "/escheatment/remittances/{remittanceId}/confirm", description: "State confirms a PENDING remittance when variance is exactly 0", roles: [StateAuditor], code: 200, input: [], output: Remittance, side_effects: ["status -> CONFIRMED", "report.confirmed_remittance_cents += amount", "line properties REPORTED -> REMITTED"] }
  - { method: POST, path: "/escheatment/remittances/{remittanceId}/fail", description: "State marks a PENDING remittance failed", roles: [StateAuditor], code: 200, input: [failure_reason], output: Remittance, side_effects: ["status -> FAILED"] }
  - { method: POST, path: "/escheatment/remittances/{remittanceId}/requeue", description: "Requeue a FAILED remittance with a corrected amount", roles: [TreasuryOps], code: 200, input: [amount_cents], output: Remittance, side_effects: ["status -> PENDING", "amount updated", "failure_reason cleared"] }

  # --- Owner claims ---
  - { method: POST, path: "/escheatment/owner-claims", description: "Claimant files a claim on an owned REMITTED/ESCHEATED property", roles: [Claimant], code: 201, input: [property_id, "evidence_ref?"], output: OwnerClaim, side_effects: ["status = SUBMITTED", "claimant_owner_id := X-User-ID", "claim_type computed"] }
  - { method: GET, path: "/escheatment/owner-claims", description: "List claims (staff roles)", roles: [ComplianceOfficer, ClaimsExaminer, ClaimsApprover], code: 200, input: ["property_id?", "status?", "limit?", "offset?"], output: "OwnerClaim[]", side_effects: [] }
  - { method: GET, path: "/escheatment/owner-claims/{claimId}", description: "Get one claim (Claimant: only own)", roles: [Any, Claimant], code: 200, input: [], output: OwnerClaim, side_effects: [] }
  - { method: POST, path: "/escheatment/owner-claims/{claimId}/start-review", description: "Examiner opens review on a SUBMITTED claim", roles: [ClaimsExaminer], code: 200, input: [], output: OwnerClaim, side_effects: ["status -> UNDER_REVIEW", "reviewed_by_user_id set"] }
  - { method: POST, path: "/escheatment/owner-claims/{claimId}/request-info", description: "Examiner requests more information", roles: [ClaimsExaminer], code: 200, input: [info_request_note], output: OwnerClaim, side_effects: ["status -> MORE_INFO_REQUESTED"] }
  - { method: POST, path: "/escheatment/owner-claims/{claimId}/submit-info", description: "Claimant supplies requested information", roles: [Claimant], code: 200, input: [info_response_ref], output: OwnerClaim, side_effects: ["status -> UNDER_REVIEW"] }
  - { method: POST, path: "/escheatment/owner-claims/{claimId}/approve", description: "Approver approves a reviewed claim (must differ from reviewer); payout computed", roles: [ClaimsApprover], code: 200, input: [], output: OwnerClaim, side_effects: ["status -> APPROVED", "payout components computed per claim_payout"] }
  - { method: POST, path: "/escheatment/owner-claims/{claimId}/deny", description: "Approver denies a reviewed claim (must differ from reviewer)", roles: [ClaimsApprover], code: 200, input: [denial_reason], output: OwnerClaim, side_effects: ["status -> DENIED"] }
  - { method: POST, path: "/escheatment/owner-claims/{claimId}/pay", description: "Disburse an APPROVED claim; property reunites", roles: [TreasuryOps], code: 200, input: [], output: OwnerClaim, side_effects: ["status -> PAID", "paid_date set", "property -> REUNITED"] }
  - { method: POST, path: "/escheatment/owner-claims/{claimId}/withdraw", description: "Claimant withdraws a SUBMITTED or MORE_INFO_REQUESTED claim", roles: [Claimant], code: 200, input: [], output: OwnerClaim, side_effects: ["status -> WITHDRAWN"] }

  # --- Penalty assessments ---
  - { method: POST, path: "/escheatment/holder-reports/{reportId}/penalty-assessments", description: "Assess late penalty + interest on a SUBMITTED/ACCEPTED report (one active per report)", roles: [StateAuditor], code: 201, input: [], output: PenaltyAssessment, side_effects: ["days_late, penalty_cents, interest_cents, total_cents computed", "status = ASSESSED"] }
  - { method: GET, path: "/escheatment/holder-reports/{id}/penalty-assessments", description: "List penalty assessments for a report", roles: [Any], code: 200, input: ["limit?", "offset?"], output: "PenaltyAssessment[]", side_effects: [] }
  - { method: GET, path: "/escheatment/penalty-assessments/{assessmentId}", description: "Get one penalty assessment", roles: [Any], code: 200, input: [], output: PenaltyAssessment, side_effects: [] }
  - { method: POST, path: "/escheatment/penalty-assessments/{assessmentId}/pay", description: "Pay an ASSESSED penalty", roles: [TreasuryOps], code: 200, input: [], output: PenaltyAssessment, side_effects: ["status -> PAID"] }
  - { method: POST, path: "/escheatment/penalty-assessments/{assessmentId}/waive", description: "State waives an ASSESSED or DISPUTED penalty", roles: [StateAuditor], code: 200, input: [waiver_reason], output: PenaltyAssessment, side_effects: ["status -> WAIVED"] }
  - { method: POST, path: "/escheatment/penalty-assessments/{assessmentId}/dispute", description: "Holder disputes an ASSESSED penalty", roles: [ComplianceOfficer], code: 200, input: [dispute_reason], output: PenaltyAssessment, side_effects: ["status -> DISPUTED"] }
  - { method: POST, path: "/escheatment/penalty-assessments/{assessmentId}/uphold", description: "State upholds a DISPUTED penalty (returns to ASSESSED)", roles: [StateAuditor], code: 200, input: [], output: PenaltyAssessment, side_effects: ["status -> ASSESSED"] }

  # --- Audit cases ---
  - { method: POST, path: "/escheatment/audit-cases", description: "Open a state audit; closed-interval lookback windows of non-CLOSED audits for the same state must not overlap", roles: [StateAuditor], code: 201, input: [state_code, lookback_start_year, lookback_end_year], output: AuditCase, side_effects: ["status = OPENED"] }
  - { method: GET, path: "/escheatment/audit-cases", description: "List audit cases", roles: [Any], code: 200, input: ["state_code?", "status?", "limit?", "offset?"], output: "AuditCase[]", side_effects: [] }
  - { method: GET, path: "/escheatment/audit-cases/{auditId}", description: "Get one audit case", roles: [Any], code: 200, input: [], output: AuditCase, side_effects: [] }
  - { method: POST, path: "/escheatment/audit-cases/{auditId}/advance", description: "Advance the audit one step; FIELDWORK -> FINDINGS_ISSUED computes estimated_exposure_cents", roles: [StateAuditor], code: 200, input: [], output: AuditCase, side_effects: ["status advances per machine", "exposure computed at FINDINGS_ISSUED"] }
  - { method: GET, path: "/escheatment/audit-cases/{auditId}/exposure", description: "Computed read of the exposure estimate", roles: [Any], code: 200, input: [], output: "{ estimated_exposure_cents: integer, candidate_property_ids: string[] }", side_effects: [] }

  # --- Document records (retention) ---
  - { method: POST, path: "/escheatment/document-records", description: "Register a retained artifact; retention_until computed from artifact_type", roles: [ComplianceOfficer], code: 201, input: [artifact_type, related_entity_type, related_entity_id], output: DocumentRecord, side_effects: ["status = REGISTERED", "retention_until computed"] }
  - { method: GET, path: "/escheatment/document-records", description: "List document records; PURGED excluded unless include_purged=true", roles: [Any], code: 200, input: ["artifact_type?", "include_purged?", "limit?", "offset?"], output: "DocumentRecord[]", side_effects: [] }
  - { method: GET, path: "/escheatment/document-records/{docId}", description: "Get one document record (PURGED records still readable by id)", roles: [Any], code: 200, input: [], output: DocumentRecord, side_effects: [] }
  - { method: POST, path: "/escheatment/document-records/{docId}/purge", description: "Purge a record whose retention window has fully elapsed", roles: [HolderAdmin], code: 200, input: [], output: DocumentRecord, side_effects: ["status -> PURGED", "purged_at set"] }

  # --- Test-driving endpoints ---
  - { method: POST, path: "/escheatment/_clock/set_current_utc", description: "Set the server's logical clock (ISO8601 UTC). Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z and never falls back to wall-clock time.", roles: [HolderAdmin], code: 200, input: [to_iso8601], output: "{ current_utc: string }", side_effects: ["logical clock updated; no state transitions fire as a side effect (use the sweep endpoint)"] }
  - { method: POST, path: "/escheatment/_sweeps/dormancy", description: "Run the dormancy/letter sweep against the current logical clock: ACTIVE -> DORMANT where due; DORMANT -> REPORTABLE for under-threshold properties; SENT/DELIVERED letters past response_deadline -> EXPIRED with their property DUE_DILIGENCE -> REPORTABLE. A property advances at most one dormancy step per invocation: the DORMANT -> REPORTABLE pass considers only properties that were already DORMANT when the sweep started", roles: [HolderAdmin], code: 200, input: [], output: "{ transitioned_property_ids: string[], expired_letter_ids: string[], reportable_property_ids: string[] }", side_effects: ["dormancy_determination and letter_response_deadline applied to all candidate entities"] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- auth ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role missing, or role not declared" }
  - { id: ERR_UNAUTHORIZED_ROLE, http: 403, condition: "Role not permitted on this endpoint" }
  - { id: ERR_OWNERSHIP_SCOPE_VIOLATION, http: 403, condition: "Claimant acted on a resource whose owner linkage does not equal X-User-ID" }
  - { id: ERR_SEGREGATION_OF_DUTIES_VIOLATION, http: 403, condition: "Same user attempted a step segregation-of-duties forbids (accept own submission; approve/deny own reviewed claim)" }
  # --- not found ---
  - { id: ERR_OWNER_NOT_FOUND, http: 404, condition: "Owner id does not exist" }
  - { id: ERR_PROPERTY_NOT_FOUND, http: 404, condition: "Property id does not exist" }
  - { id: ERR_DORMANCY_RULE_NOT_FOUND, http: 404, condition: "Dormancy rule id does not exist" }
  - { id: ERR_CONTACT_EVENT_NOT_FOUND, http: 404, condition: "Contact event id does not exist" }
  - { id: ERR_LETTER_NOT_FOUND, http: 404, condition: "Due-diligence letter id does not exist" }
  - { id: ERR_REPORT_NOT_FOUND, http: 404, condition: "Holder report id does not exist" }
  - { id: ERR_LINE_ITEM_NOT_FOUND, http: 404, condition: "Report line item id does not exist (or does not belong to the path report)" }
  - { id: ERR_SECURITIES_DETAIL_NOT_FOUND, http: 404, condition: "Securities detail id does not exist" }
  - { id: ERR_LIQUIDATION_ORDER_NOT_FOUND, http: 404, condition: "Liquidation order id does not exist" }
  - { id: ERR_REMITTANCE_NOT_FOUND, http: 404, condition: "Remittance id does not exist" }
  - { id: ERR_CLAIM_NOT_FOUND, http: 404, condition: "Owner claim id does not exist" }
  - { id: ERR_PENALTY_ASSESSMENT_NOT_FOUND, http: 404, condition: "Penalty assessment id does not exist" }
  - { id: ERR_AUDIT_CASE_NOT_FOUND, http: 404, condition: "Audit case id does not exist" }
  - { id: ERR_DOCUMENT_RECORD_NOT_FOUND, http: 404, condition: "Document record id does not exist" }
  # --- request shape ---
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, type mismatch, invalid enum value, unparsable date, or out-of-range integer" }
  # --- OCC ---
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_report_version does not equal the report's current version" }
  # --- state ---
  - { id: ERR_PROPERTY_NOT_DORMANT, http: 409, condition: "Letter creation requires the property to be DORMANT or DUE_DILIGENCE" }
  - { id: ERR_PROPERTY_NOT_REACTIVATABLE, http: 409, condition: "Reactivation requires DORMANT, DUE_DILIGENCE, or REPORTABLE" }
  - { id: ERR_PROPERTY_NOT_REMITTED, http: 409, condition: "Escheat requires the property to be REMITTED" }
  - { id: ERR_LETTER_NOT_ACTIONABLE, http: 409, condition: "Letter action requires SENT or DELIVERED (per endpoint)" }
  - { id: ERR_REPORT_NOT_DRAFT, http: 409, condition: "Operation requires the report to be DRAFT" }
  - { id: ERR_REPORT_NOT_SUBMITTED, http: 409, condition: "Operation requires the report to be SUBMITTED (accept/reject) or at least SUBMITTED (penalty assessment: SUBMITTED or ACCEPTED)" }
  - { id: ERR_REPORT_NOT_REJECTED, http: 409, condition: "Reopen requires the report to be REJECTED" }
  - { id: ERR_REPORT_NOT_ACCEPTED, http: 409, condition: "Operation requires the report to be ACCEPTED (remittance create, amendment create)" }
  - { id: ERR_LINE_ITEM_NOT_REMOVABLE, http: 409, condition: "Line removal requires line status INCLUDED" }
  - { id: ERR_LIQUIDATION_INVALID_STATE, http: 409, condition: "Liquidation action requires the order to be in the preceding state (REQUESTED for execute, EXECUTED for settle, REQUESTED|EXECUTED for cancel)" }
  - { id: ERR_REMITTANCE_NOT_PENDING, http: 409, condition: "Confirm/fail requires the remittance to be PENDING" }
  - { id: ERR_REMITTANCE_NOT_FAILED, http: 409, condition: "Requeue requires the remittance to be FAILED" }
  - { id: ERR_CLAIM_NOT_SUBMITTED, http: 409, condition: "Start-review requires the claim to be SUBMITTED" }
  - { id: ERR_CLAIM_NOT_UNDER_REVIEW, http: 409, condition: "Operation requires the claim to be UNDER_REVIEW" }
  - { id: ERR_CLAIM_NOT_AWAITING_INFO, http: 409, condition: "Submit-info requires the claim to be MORE_INFO_REQUESTED" }
  - { id: ERR_CLAIM_NOT_APPROVED, http: 409, condition: "Pay requires the claim to be APPROVED" }
  - { id: ERR_CLAIM_NOT_WITHDRAWABLE, http: 409, condition: "Withdraw requires the claim to be SUBMITTED or MORE_INFO_REQUESTED" }
  - { id: ERR_PENALTY_NOT_ASSESSED, http: 409, condition: "Operation requires the assessment to be ASSESSED (waive also accepts DISPUTED)" }
  - { id: ERR_PENALTY_NOT_DISPUTED, http: 409, condition: "Uphold requires the assessment to be DISPUTED" }
  - { id: ERR_AUDIT_CASE_NOT_ADVANCEABLE, http: 409, condition: "Advance from CLOSED is not possible" }
  - { id: ERR_DOCUMENT_ALREADY_PURGED, http: 409, condition: "Purge requires the record to be REGISTERED" }
  # --- business constraint ---
  - { id: ERR_DUPLICATE_ACTIVE_LETTER, http: 409, condition: "A letter for this property is already SENT or DELIVERED" }
  - { id: ERR_DORMANCY_RULE_OVERLAP, http: 409, condition: "Half-open effective window overlaps another rule for the same (state_code, property_type); adjacency (existing.effective_to == new.effective_from) is allowed" }
  - { id: ERR_AUDIT_LOOKBACK_OVERLAP, http: 409, condition: "Closed lookback window [start,end] intersects another non-CLOSED audit for the same state; touching endpoints (shared year) count as overlap" }
  - { id: ERR_SECURITIES_DETAIL_EXISTS, http: 409, condition: "The property already has a securities detail" }
  - { id: ERR_DUPLICATE_REPORT_PERIOD, http: 409, condition: "A non-SUPERSEDED report already exists for (state_code, report_year); applies only to base report creation — amendments created via the amendments endpoint carry supersedes_report_id and are exempt" }
  - { id: ERR_PENDING_AMENDMENT_EXISTS, http: 409, condition: "A DRAFT or SUBMITTED amendment of this report already exists" }
  - { id: ERR_REMITTANCE_ALREADY_PENDING, http: 409, condition: "A PENDING remittance already exists for this report" }
  - { id: ERR_PENALTY_ALREADY_ASSESSED, http: 409, condition: "An ASSESSED or DISPUTED penalty assessment already exists for this report" }
  - { id: ERR_DUPLICATE_ACTIVE_CLAIM, http: 409, condition: "A non-terminal claim (SUBMITTED/UNDER_REVIEW/MORE_INFO_REQUESTED/APPROVED) already exists for this property" }
  - { id: ERR_DUPLICATE_ACTIVE_LIQUIDATION, http: 409, condition: "A non-terminal liquidation order (REQUESTED/EXECUTED) already exists for this property" }
  # --- business temporal ---
  - { id: ERR_DUE_DILIGENCE_WINDOW_VIOLATION, http: 409, condition: "sent_date outside [applicable_due_date - dd_window_max_days, applicable_due_date - dd_window_min_days] (inclusive)" }
  - { id: ERR_LIQUIDATION_WINDOW_VIOLATION, http: 409, condition: "Execution date is later than the containing report's due_date + 60 days" }
  - { id: ERR_RETENTION_PERIOD_NOT_ELAPSED, http: 409, condition: "clock date < retention_until; purge allowed exactly on retention_until" }
  # --- business referential ---
  - { id: ERR_NO_APPLICABLE_DORMANCY_RULE, http: 422, condition: "No DormancyRule covers (state_code, property_type) effective at last_contact_date on property create" }
  - { id: ERR_PROPERTY_NOT_REPORTED, http: 422, condition: "Liquidation request requires the property to be REPORTED (in an ACCEPTED report)" }
  - { id: ERR_NOT_SECURITIES_PROPERTY, http: 422, condition: "Securities-detail create or liquidation request on a property whose property_type != BROKERAGE_SHARES" }
  - { id: ERR_LINES_NOT_FINAL, http: 422, condition: "Remittance confirm requires every non-REMOVED line of the report to be FINAL" }
  - { id: ERR_DUE_DILIGENCE_NOT_REQUIRED, http: 422, condition: "Letter create blocked: property original_value_cents is below the rule's dd_threshold_cents" }
  - { id: ERR_OWNER_STATE_MISMATCH, http: 422, condition: "property.state_code != owner.state_code at creation" }
  - { id: ERR_PROPERTY_NOT_REPORTABLE, http: 422, condition: "Line-item add requires the property to be REPORTABLE and of the report's state_code" }
  - { id: ERR_PROPERTY_NOT_CLAIMABLE, http: 422, condition: "Claim create/approve requires the property to be REMITTED or ESCHEATED" }
  - { id: ERR_SECURITIES_DETAIL_REQUIRED, http: 422, condition: "BROKERAGE_SHARES property requires a SecuritiesDetail before line inclusion or liquidation request" }
  - { id: ERR_CONTACT_EVENT_PROPERTY_MISMATCH, http: 422, condition: "Evidence contact event belongs to a different property" }
  - { id: ERR_CONTACT_NOT_QUALIFYING, http: 422, condition: "Evidence contact event type does not qualify for reactivation (LOGIN_VERIFIED, PHONE_VERIFIED) or contact_date predates the letter's sent_date on record-response" }
  - { id: ERR_PROPERTY_IN_SUBMITTED_REPORT, http: 409, condition: "Reactivation blocked: property has an INCLUDED/FINAL line in a SUBMITTED or ACCEPTED report" }
  - { id: ERR_EMPTY_REPORT, http: 422, condition: "Submit requires at least one INCLUDED line" }
  - { id: ERR_DUE_DILIGENCE_INCOMPLETE, http: 422, condition: "Submit blocked: an INCLUDED line at/above the due-diligence threshold lacks a terminal letter (EXPIRED or UNDELIVERABLE)" }
  # --- business fiscal ---
  - { id: ERR_REMITTANCE_VARIANCE_NONZERO, http: 422, condition: "Confirm requires amount_cents - report.total_final_cents == 0 exactly" }
  - { id: ERR_LIQUIDATION_FEE_EXCEEDS_GROSS, http: 422, condition: "liquidation_fee_cents > execution_price * shares + accrued_dividends at execute; equality is allowed (net proceeds floor at 0)" }
  - { id: ERR_CLAIM_EXCEEDS_RECOVERABLE, http: 422, condition: "Claim create blocked: recoverable base for the property is <= 0 (e.g., zero net liquidation proceeds)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: HolderAdmin
    description: "Holder's unclaimed-property system administrator: dormancy configuration, logical clock, sweeps, retention purges"
    identity: opaque
    exclusive_operations:
      - "POST /escheatment/dormancy-rules; PUT /escheatment/dormancy-rules/{id}"
      - "POST /escheatment/_clock/set_current_utc"
      - "POST /escheatment/_sweeps/dormancy"
      - "POST /escheatment/document-records/{id}/purge"
    shared_operations: []
  - name: ComplianceOfficer
    description: "Holder's compliance officer: owners, properties, contacts, due-diligence letters, report preparation/submission/amendment, document registration, penalty disputes"
    identity: opaque
    exclusive_operations:
      - "POST /escheatment/owners"
      - "POST /escheatment/properties"
      - "POST /escheatment/properties/{id}/reactivate"
      - "POST /escheatment/properties/{id}/due-diligence-letters; POST /escheatment/due-diligence-letters/{id}/mark-delivered, /mark-undeliverable, /record-response"
      - "POST /escheatment/holder-reports; POST /escheatment/holder-reports/{id}/amendments, /line-items, /line-items/{lid}/remove, /submit, /reopen"
      - "POST /escheatment/properties/{id}/securities-detail"
      - "POST /escheatment/document-records"
      - "POST /escheatment/penalty-assessments/{id}/dispute"
    shared_operations:
      - "POST /escheatment/properties/{id}/contact-events (with Claimant)"
      - "GET /escheatment/owner-claims (with ClaimsExaminer, ClaimsApprover)"
  - name: StateAuditor
    description: "State unclaimed-property administrator: accepts/rejects reports, confirms/fails remittances, escheats property, assesses/waives/upholds penalties, runs audits"
    identity: opaque
    exclusive_operations:
      - "POST /escheatment/holder-reports/{id}/accept, /reject"
      - "POST /escheatment/properties/{id}/escheat"
      - "POST /escheatment/remittances/{id}/confirm, /fail"
      - "POST /escheatment/holder-reports/{id}/penalty-assessments; POST /escheatment/penalty-assessments/{id}/waive, /uphold"
      - "POST /escheatment/audit-cases; POST /escheatment/audit-cases/{id}/advance"
    shared_operations: []
  - name: TreasuryOps
    description: "Holder's treasury operations: securities liquidation, remittance preparation/requeue, penalty payment, claim payout disbursement"
    identity: opaque
    exclusive_operations:
      - "POST /escheatment/liquidation-orders; POST /escheatment/liquidation-orders/{id}/execute, /settle, /cancel"
      - "POST /escheatment/holder-reports/{id}/remittances; POST /escheatment/remittances/{id}/requeue"
      - "POST /escheatment/penalty-assessments/{id}/pay"
      - "POST /escheatment/owner-claims/{id}/pay"
    shared_operations: []
  - name: ClaimsExaminer
    description: "Claims review examiner: opens review and requests information; forbidden from approving or denying (segregation of duties)"
    identity: opaque
    exclusive_operations:
      - "POST /escheatment/owner-claims/{id}/start-review, /request-info"
    shared_operations:
      - "GET /escheatment/owner-claims (with ComplianceOfficer, ClaimsApprover)"
  - name: ClaimsApprover
    description: "Claims decision authority: approves or denies reviewed claims; must not be the reviewing examiner on the same claim"
    identity: opaque
    exclusive_operations:
      - "POST /escheatment/owner-claims/{id}/approve, /deny"
    shared_operations:
      - "GET /escheatment/owner-claims (with ComplianceOfficer, ClaimsExaminer)"
  - name: Claimant
    description: "Property owner filing for reunification; X-User-ID equals the Owner id; scoped to own resources"
    identity: "entity_backed:Owner"
    exclusive_operations:
      - "POST /escheatment/owner-claims"
      - "POST /escheatment/owner-claims/{id}/submit-info, /withdraw"
    shared_operations:
      - "POST /escheatment/properties/{id}/contact-events (own properties only, with ComplianceOfficer)"
  - name: Any
    description: "Pseudo-role standing for any authenticated principal; used on read-only GET endpoints (X-User-Role may be any declared role)"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "All GET endpoints in §1.5"
