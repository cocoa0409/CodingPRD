# =============================================================================
# Grain Elevator & Marketing (Co-op) — benchmark seed tables
# Difficulty band: Expert (§0.4)
# =============================================================================

scenario: |
  465. Grain Elevator & Marketing (Co-op): inbound scale & grade/dockage
  (moisture/test weight), storage (delayed-price/warehouse receipt), contract
  (cash/forward/basis/HTA), price & basis settlement, drying/shrink & storage
  charge, load-out & shipment, position/hedge & margin, patronage dividend

domain_name: grain-elevator-coop
api_prefix: /commodities

complexity_profile:
  primary_archetype: Ledger reconciliation
  secondary_archetype: Compliance / audit
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - rate_threshold_triggers
  entity_topology: flat
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: peer_roles
  consistency_model: immediate

# =============================================================================
# Table 1: Entity-Relationship Table (§1.1)
# =============================================================================
entities:
  # --- Configuration: commodity reference (grade standards, shrink, drying) ---
  - name: Commodity
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: symbol, type: enum, source: input, description: "CORN | SOYBEANS | WHEAT", constraints: "unique across Commodity" }
      - { name: test_weight_lbs_per_bushel, type: number, source: input, description: "Reference lbs per bushel used to convert clean weight to bushels (e.g. CORN=56)" }
      - { name: base_moisture_pct, type: number, source: input, description: "Moisture threshold above which shrink and drying apply (e.g. 15.0)" }
      - { name: shrink_pct_per_point, type: number, source: input, description: "Percent of clean weight removed per moisture point above base (e.g. 1.4)" }
      - { name: drying_cents_per_point_per_bushel, type: number, source: input, description: "Drying charge in cents per moisture point per dry bushel (e.g. 4)" }
      - { name: futures_contract_bushels, type: integer, source: input, description: "Bushels per exchange futures contract for hedging (e.g. CORN=5000)", default: 5000 }

  # --- Configuration: posted price board per commodity ---
  - name: PriceBoard
    parent: null
    common_fields: true
    fields:
      - { name: commodity_id, type: string, source: input, description: "FK -> Commodity.id; the commodity this board prices" }
      - { name: futures_price, type: number, source: input, description: "Current board futures price in $/bushel (e.g. 4.50)" }
      - { name: cash_basis, type: number, source: input, description: "Current board basis in $/bushel, signed (e.g. -0.30 = 30c under futures)" }
      - { name: cash_price, type: number, source: computed, description: "futures_price + cash_basis, the posted cash bid ($/bushel)" }
      - { name: is_current, type: boolean, source: computed, description: "True only for the PriceBoard with the greatest created_at for its commodity_id" }

  # --- Member (co-op patron / farmer) ---
  - name: Member
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Member legal name" }
      - { name: equity_credit_dollars, type: number, source: computed, description: "Accumulated non-cash patronage equity allocated to this member", default: 0 }
      - { name: cash_paid_dollars, type: number, source: computed, description: "Lifetime cash settlement + cash patronage paid to this member", default: 0 }
      - { name: net_priced_bushels, type: number, source: computed, description: "Sum of priced_bushels across this member's SETTLED Settlements in the open patronage period", default: 0 }

  # --- Scale ticket: inbound load, grade & dockage, grade computation ---
  - name: ScaleTicket
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; member delivering the load" }
      - { name: commodity_id, type: string, source: input, description: "FK -> Commodity.id; commodity delivered" }
      - { name: gross_weight_lbs, type: number, source: input, description: "Loaded truck weight in lbs" }
      - { name: tare_weight_lbs, type: number, source: input, description: "Empty truck weight in lbs" }
      - { name: moisture_pct, type: number, source: input, description: "Measured moisture percent of the load (e.g. 18.0)" }
      - { name: dockage_pct, type: number, source: input, description: "Foreign-material dockage as percent of net weight (e.g. 1.5)", default: 0 }
      - { name: status, type: enum, source: system, description: "WEIGHED -> GRADED -> SETTLED_IN / VOIDED", constraints: "WEIGHED|GRADED|SETTLED_IN|VOIDED" }
      - { name: net_weight_lbs, type: number, source: computed, description: "gross_weight_lbs - tare_weight_lbs" }
      - { name: clean_weight_lbs, type: number, source: computed, description: "net_weight_lbs minus dockage_lbs (dockage removed first)" }
      - { name: moisture_points, type: number, source: computed, description: "max(0, moisture_pct - Commodity.base_moisture_pct)" }
      - { name: wet_bushels, type: number, source: computed, description: "clean_weight_lbs / Commodity.test_weight_lbs_per_bushel, 4 dp" }
      - { name: net_dry_bushels, type: number, source: computed, description: "shrunk dry weight / test_weight_lbs_per_bushel, 4 dp; the bushels credited to storage" }
      - { name: drying_charge_dollars, type: number, source: computed, description: "net_dry_bushels * moisture_points * drying_cents_per_point_per_bushel / 100, 2 dp" }
      - { name: deposit_account_type, type: enum, source: input, description: "DELAYED_PRICE | WAREHOUSE_RECEIPT — storage program the graded grain enters", constraints: "DELAYED_PRICE|WAREHOUSE_RECEIPT" }
      - { name: storage_position_id, type: string, source: computed, description: "FK -> StoragePosition.id; the position created when this ticket is graded (null until GRADED)", default: null }

  # --- Storage position: bushels held under a storage program ---
  - name: StoragePosition
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: system, description: "FK -> Member.id; owner of the stored grain" }
      - { name: commodity_id, type: string, source: system, description: "FK -> Commodity.id; commodity stored" }
      - { name: scale_ticket_id, type: string, source: system, description: "FK -> ScaleTicket.id; ticket that created this position" }
      - { name: program, type: enum, source: system, description: "DELAYED_PRICE | WAREHOUSE_RECEIPT", constraints: "DELAYED_PRICE|WAREHOUSE_RECEIPT" }
      - { name: bushels, type: number, source: system, description: "net_dry_bushels deposited at grade-in (4 dp)" }
      - { name: bushels_available, type: number, source: computed, description: "bushels minus sum of priced_bushels of SETTLED Settlements applied to this position", default: 0 }
      - { name: status, type: enum, source: system, description: "STORED -> CHARGE_FROZEN (storage accrual paused) -> STORED; -> DEPLETED when fully applied; VOIDED on ticket void", constraints: "STORED|CHARGE_FROZEN|DEPLETED|VOIDED" }
      - { name: storage_start_date, type: datetime, source: system, description: "Date grain entered storage (= grade-in clock time)" }
      - { name: frozen_days, type: integer, source: computed, description: "Cumulative whole days this position has spent in CHARGE_FROZEN", default: 0 }
      - { name: receipt_id, type: string, source: computed, description: "FK -> WarehouseReceipt.id; issued only for WAREHOUSE_RECEIPT positions (null otherwise)", default: null }

  # --- Warehouse receipt: negotiable document for WAREHOUSE_RECEIPT positions ---
  - name: WarehouseReceipt
    parent: null
    common_fields: true
    fields:
      - { name: storage_position_id, type: string, source: input, description: "FK -> StoragePosition.id; position this receipt documents" }
      - { name: member_id, type: string, source: system, description: "FK -> Member.id; receipt holder" }
      - { name: bushels, type: number, source: system, description: "Bushels documented (snapshot of position.bushels at issue)" }
      - { name: status, type: enum, source: system, description: "ISSUED -> CANCELLED (on full load-out/redemption)", constraints: "ISSUED|CANCELLED" }

  # --- Marketing contract: CASH / FORWARD / BASIS / HTA ---
  - name: Contract
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; selling member" }
      - { name: commodity_id, type: string, source: input, description: "FK -> Commodity.id; commodity sold" }
      - { name: contract_type, type: enum, source: input, description: "CASH | FORWARD | BASIS | HTA", constraints: "CASH|FORWARD|BASIS|HTA" }
      - { name: contracted_bushels, type: number, source: input, description: "Bushels the member commits to deliver/price under this contract" }
      - { name: futures_leg, type: number, source: computed, description: "Fixed futures component ($/bu); set at create for FORWARD/HTA, set at fixing for BASIS/CASH", default: null }
      - { name: basis_leg, type: number, source: computed, description: "Fixed basis component ($/bu); set at create for FORWARD/BASIS, set at fixing for HTA/CASH", default: null }
      - { name: net_price, type: number, source: computed, description: "futures_leg + basis_leg once both legs are fixed ($/bu)", default: null }
      - { name: status, type: enum, source: system, description: "OPEN -> PRICED -> SETTLED; OPEN/PRICED -> CANCELLED", constraints: "OPEN|PRICED|SETTLED|CANCELLED" }
      - { name: priced_bushels, type: number, source: computed, description: "Sum of priced_bushels across SETTLED Settlements applied to this contract", default: 0 }

  # --- Settlement: applies stored bushels to a contract, computes proceeds ---
  - name: Settlement
    parent: null
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: input, description: "FK -> Contract.id; contract being settled against" }
      - { name: storage_position_id, type: string, source: input, description: "FK -> StoragePosition.id; position supplying the bushels" }
      - { name: priced_bushels, type: number, source: input, description: "Bushels drawn from the position and priced on the contract" }
      - { name: storage_basis, type: enum, source: input, description: "ESTIMATE | ACTUAL — which storage-charge variant to apply", default: "ACTUAL", constraints: "ESTIMATE|ACTUAL" }
      - { name: gross_proceeds_dollars, type: number, source: computed, description: "priced_bushels * Contract.net_price, 2 dp" }
      - { name: storage_charge_dollars, type: number, source: computed, description: "Accrued storage charge per the chosen storage_basis variant, 2 dp" }
      - { name: net_proceeds_dollars, type: number, source: computed, description: "gross_proceeds_dollars - storage_charge_dollars, 2 dp" }
      - { name: status, type: enum, source: system, description: "DRAFT -> SETTLED; DRAFT -> CANCELLED", constraints: "DRAFT|SETTLED|CANCELLED" }

  # --- LoadoutBay: physical loading bay; shipments reserve a time window ---
  - name: LoadoutBay
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Bay label, e.g. BAY-1" }

  # --- DryerLine: continuous-flow dryer; drying batches reserve a window ---
  - name: DryerLine
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Dryer line label, e.g. DRYER-A" }
      - { name: cleanout_buffer_minutes, type: integer, source: input, description: "Mandatory turnaround buffer required between consecutive drying batches on this line", default: 30 }

  # --- DryingReservation: a batch's reserved window on a DryerLine (closed + buffer) ---
  - name: DryingReservation
    parent: null
    common_fields: true
    fields:
      - { name: dryer_line_id, type: string, source: input, description: "FK -> DryerLine.id; line reserved" }
      - { name: scale_ticket_id, type: string, source: input, description: "FK -> ScaleTicket.id; the wet load this batch dries" }
      - { name: window_start, type: datetime, source: input, description: "Batch start (inclusive)" }
      - { name: window_end, type: datetime, source: input, description: "Batch end (inclusive)" }
      - { name: status, type: enum, source: system, description: "RESERVED -> RELEASED", constraints: "RESERVED|RELEASED" }

  # --- Shipment: load-out of priced/redeemed bushels off the elevator ---
  - name: Shipment
    parent: null
    common_fields: true
    fields:
      - { name: commodity_id, type: string, source: input, description: "FK -> Commodity.id; commodity shipped" }
      - { name: storage_position_id, type: string, source: input, description: "FK -> StoragePosition.id; position loaded out" }
      - { name: loadout_bay_id, type: string, source: input, description: "FK -> LoadoutBay.id; bay reserved for this load-out window" }
      - { name: bushels, type: number, source: input, description: "Bushels loaded onto this shipment" }
      - { name: bay_window_start, type: datetime, source: input, description: "Bay reservation window start (inclusive)" }
      - { name: bay_window_end, type: datetime, source: input, description: "Bay reservation window end (exclusive — half-open; touching windows do not conflict)" }
      - { name: status, type: enum, source: system, description: "SCHEDULED -> LOADED -> SHIPPED; SCHEDULED -> CANCELLED", constraints: "SCHEDULED|LOADED|SHIPPED|CANCELLED" }

  # --- Hedge position: elevator's own futures position with margin ---
  - name: HedgePosition
    parent: null
    common_fields: true
    fields:
      - { name: commodity_id, type: string, source: input, description: "FK -> Commodity.id; commodity hedged" }
      - { name: side, type: enum, source: input, description: "SHORT | LONG", constraints: "SHORT|LONG" }
      - { name: contracts, type: integer, source: input, description: "Number of futures contracts held" }
      - { name: entry_futures_price, type: number, source: input, description: "Futures price at which the position was opened ($/bu)" }
      - { name: mark_futures_price, type: number, source: computed, description: "Latest mark price applied via mark-to-market ($/bu)", default: null }
      - { name: posted_margin_dollars, type: number, source: computed, description: "Margin currently posted to the account", default: 0 }
      - { name: unrealized_pnl_dollars, type: number, source: computed, description: "Mark-to-market P&L given side, entry, mark, contracts, contract size", default: 0 }
      - { name: account_equity_dollars, type: number, source: computed, description: "posted_margin_dollars + unrealized_pnl_dollars", default: 0 }
      - { name: margin_call_dollars, type: number, source: computed, description: "Outstanding margin call amount (0 when not in call)", default: 0 }
      - { name: status, type: enum, source: system, description: "OPEN -> MARGIN_CALL -> OPEN (on meet); OPEN/MARGIN_CALL -> CLOSED", constraints: "OPEN|MARGIN_CALL|CLOSED" }

  # --- Patronage period: year-end dividend distribution ---
  - name: PatronagePeriod
    parent: null
    common_fields: true
    fields:
      - { name: label, type: string, source: input, description: "Fiscal-year label, e.g. FY2026" }
      - { name: pool_dollars, type: number, source: input, description: "Total patronage pool to distribute" }
      - { name: qualified_cash_pct, type: number, source: input, description: "Fraction of each member's allocation paid in cash, rest as equity (e.g. 0.20)" }
      - { name: status, type: enum, source: system, description: "OPEN -> CLOSED (allocations posted)", constraints: "OPEN|CLOSED" }
      - { name: total_bushels, type: number, source: computed, description: "Sum of net_priced_bushels across all members at close", default: 0 }

  # --- Allocation: one member's slice of a closed patronage period ---
  - name: PatronageAllocation
    parent: null
    common_fields: false   # id + created_at only; append-only record
    fields:
      - { name: patronage_period_id, type: string, source: system, description: "FK -> PatronagePeriod.id; period this allocation belongs to" }
      - { name: member_id, type: string, source: system, description: "FK -> Member.id; member receiving the allocation" }
      - { name: member_bushels, type: number, source: system, description: "net_priced_bushels of this member at close" }
      - { name: allocation_dollars, type: number, source: system, description: "pool_dollars * member_bushels / total_bushels, 2 dp" }
      - { name: cash_dollars, type: number, source: system, description: "Cash portion of the allocation after waterfall remainder assignment, 2 dp" }
      - { name: equity_dollars, type: number, source: system, description: "allocation_dollars - cash_dollars, 2 dp" }

# =============================================================================
# Table 2: State Machine Table (§1.2)
# =============================================================================
state_machines:
  - entity: ScaleTicket
    initial_state: WEIGHED
    terminal_states: [SETTLED_IN, VOIDED]
    transitions:
      - from: WEIGHED
        to: GRADED
        trigger: "POST /commodities/scale-tickets/{id}/grade"
        actor: GradeClerk
        preconditions:
          - "ScaleTicket.status == WEIGHED (else ERR_INVALID_STATE)"
          - "A current PriceBoard exists for the ticket's commodity (informational; grade itself does not require it)"
        side_effects:
          - "Compute net_weight_lbs, clean_weight_lbs, moisture_points, wet_bushels, net_dry_bushels, drying_charge_dollars per grade_in calculation"
          - "Create a StoragePosition with program=deposit_account_type, bushels=net_dry_bushels, bushels_available=net_dry_bushels, status=STORED, storage_start_date=current clock, member_id/commodity_id copied"
          - "Set ScaleTicket.storage_position_id to the new position; ScaleTicket.status=GRADED"
          - "increments ScaleTicket.version by 1"
      - from: GRADED
        to: SETTLED_IN
        trigger: "system — first Settlement SETTLED that draws from this ticket's StoragePosition"
        actor: system
        preconditions:
          - "ScaleTicket.status == GRADED"
        side_effects:
          - "ScaleTicket.status=SETTLED_IN (marks grain accepted into the priced ledger)"
      - from: WEIGHED
        to: VOIDED
        trigger: "POST /commodities/scale-tickets/{id}/void"
        actor: GradeClerk
        preconditions:
          - "ScaleTicket.status == WEIGHED (a GRADED ticket cannot be voided once a position exists — ERR_INVALID_STATE)"
        side_effects:
          - "ScaleTicket.status=VOIDED"

  - entity: StoragePosition
    initial_state: STORED
    terminal_states: [DEPLETED, VOIDED]
    transitions:
      - from: STORED
        to: CHARGE_FROZEN
        trigger: "POST /commodities/storage-positions/{id}/freeze-charge"
        actor: Merchandiser
        preconditions:
          - "StoragePosition.status == STORED (else ERR_INVALID_STATE)"
          - "StoragePosition.program == DELAYED_PRICE (WAREHOUSE_RECEIPT positions do not accrue per-day storage and cannot be charge-frozen — ERR_PROGRAM_MISMATCH)"
        side_effects:
          - "StoragePosition.status=CHARGE_FROZEN; storage-charge accrual pauses from current clock"
          - "increments StoragePosition.version by 1"
      - from: CHARGE_FROZEN
        to: STORED
        trigger: "POST /commodities/storage-positions/{id}/unfreeze-charge"
        actor: Merchandiser
        preconditions:
          - "StoragePosition.status == CHARGE_FROZEN (else ERR_INVALID_STATE)"
        side_effects:
          - "Add whole days spent frozen to frozen_days; StoragePosition.status=STORED; accrual resumes"
          - "increments StoragePosition.version by 1"
      - from: STORED
        to: DEPLETED
        trigger: "system — a Settlement SETTLED or Shipment SHIPPED reduces bushels_available to 0"
        actor: system
        preconditions:
          - "bushels_available reaches 0 after the applying action"
        side_effects:
          - "StoragePosition.status=DEPLETED"
          - "If a WarehouseReceipt is ISSUED for this position, set it to CANCELLED (cascade)"
      - from: STORED
        to: VOIDED
        trigger: "system — owning ScaleTicket voided before any position activity"
        actor: system
        preconditions:
          - "No Settlement or Shipment has drawn from this position"
        side_effects:
          - "StoragePosition.status=VOIDED"

  - entity: Contract
    initial_state: OPEN
    terminal_states: [SETTLED, CANCELLED]
    transitions:
      - from: OPEN
        to: PRICED
        trigger: "POST /commodities/contracts/{id}/fix-price"
        actor: Merchandiser
        preconditions:
          - "Contract.status == OPEN (else ERR_INVALID_STATE)"
          - "The leg being fixed is the open leg for this contract_type: BASIS fixes futures_leg, HTA fixes basis_leg, CASH fixes both from the current PriceBoard (ERR_LEG_ALREADY_FIXED if a leg is already set)"
          - "A current PriceBoard exists for the commodity (ERR_NO_CURRENT_PRICE)"
        side_effects:
          - "Set the open leg(s) from the current PriceBoard (BASIS: futures_leg=board.futures_price; HTA: basis_leg=board.cash_basis; CASH: both)"
          - "Compute net_price = futures_leg + basis_leg; Contract.status=PRICED"
          - "increments Contract.version by 1"
      - from: OPEN
        to: SETTLED
        trigger: "system — only when FORWARD contract (both legs fixed at create) is settled directly; see Settlement"
        actor: system
        note: "FORWARD contracts are created with both legs fixed and net_price computed but remain OPEN until a Settlement SETTLED; they skip fix-price."
        preconditions:
          - "Contract.contract_type == FORWARD and a Settlement against this contract reaches SETTLED"
        side_effects:
          - "Contract.status=SETTLED"
      - from: PRICED
        to: SETTLED
        trigger: "system — a Settlement against this contract reaches SETTLED and priced_bushels reaches contracted_bushels"
        actor: system
        preconditions:
          - "sum of SETTLED Settlement.priced_bushels for this contract >= contracted_bushels"
        side_effects:
          - "Contract.status=SETTLED"
      - from: OPEN
        to: CANCELLED
        trigger: "POST /commodities/contracts/{id}/cancel"
        actor: Merchandiser
        preconditions:
          - "Contract.status == OPEN"
          - "Contract.priced_bushels == 0 (no SETTLED settlement applied — ERR_CONTRACT_HAS_SETTLEMENTS)"
        side_effects:
          - "Contract.status=CANCELLED"
      - from: PRICED
        to: CANCELLED
        trigger: "POST /commodities/contracts/{id}/cancel"
        actor: Merchandiser
        preconditions:
          - "Contract.status == PRICED"
          - "Contract.priced_bushels == 0 (ERR_CONTRACT_HAS_SETTLEMENTS)"
        side_effects:
          - "Contract.status=CANCELLED"

  - entity: Settlement
    initial_state: DRAFT
    terminal_states: [SETTLED, CANCELLED]
    transitions:
      - from: DRAFT
        to: SETTLED
        trigger: "POST /commodities/settlements/{id}/post"
        actor: SettlementOfficer
        preconditions:
          - "Settlement.status == DRAFT (else ERR_INVALID_STATE)"
          - "Contract.status IN {OPEN with both legs fixed (FORWARD), PRICED} (ERR_CONTRACT_NOT_PRICED)"
          - "Settlement.priced_bushels <= StoragePosition.bushels_available (ERR_INSUFFICIENT_BUSHELS)"
          - "Settlement.priced_bushels <= Contract.contracted_bushels - Contract.priced_bushels (ERR_CONTRACT_OVERFILL)"
          - "Contract.commodity_id == StoragePosition.commodity_id and Contract.member_id == StoragePosition.member_id (ERR_COMMODITY_MISMATCH)"
        side_effects:
          - "Compute gross_proceeds_dollars, storage_charge_dollars (per storage_basis variant), net_proceeds_dollars"
          - "StoragePosition.bushels_available -= priced_bushels; if it reaches 0, StoragePosition.status=DEPLETED (cascade, which may cascade WarehouseReceipt to CANCELLED)"
          - "Contract.priced_bushels += priced_bushels; if it reaches contracted_bushels, Contract.status=SETTLED (cascade)"
          - "If owning ScaleTicket.status == GRADED, set it to SETTLED_IN (cascade)"
          - "Member.cash_paid_dollars += net_proceeds_dollars; Member.net_priced_bushels += priced_bushels (cascade)"
          - "Settlement.status=SETTLED; increments Settlement.version by 1"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /commodities/settlements/{id}/cancel"
        actor: SettlementOfficer
        preconditions:
          - "Settlement.status == DRAFT"
        side_effects:
          - "Settlement.status=CANCELLED (no ledger effects, since none were applied)"

  - entity: Shipment
    initial_state: SCHEDULED
    terminal_states: [SHIPPED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: LOADED
        trigger: "POST /commodities/shipments/{id}/load"
        actor: ShippingClerk
        preconditions:
          - "Shipment.status == SCHEDULED (else ERR_INVALID_STATE)"
          - "Shipment.bushels <= StoragePosition.bushels_available (ERR_INSUFFICIENT_BUSHELS)"
          - "StoragePosition.status IN {STORED, CHARGE_FROZEN} (ERR_INVALID_STATE if DEPLETED/VOIDED)"
        side_effects:
          - "Shipment.status=LOADED; StoragePosition.bushels_available -= bushels; if it reaches 0, StoragePosition.status=DEPLETED (cascade -> WarehouseReceipt CANCELLED)"
          - "increments Shipment.version by 1"
      - from: LOADED
        to: SHIPPED
        trigger: "POST /commodities/shipments/{id}/ship"
        actor: ShippingClerk
        preconditions:
          - "Shipment.status == LOADED (else ERR_INVALID_STATE)"
        side_effects:
          - "Shipment.status=SHIPPED"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /commodities/shipments/{id}/cancel"
        actor: ShippingClerk
        preconditions:
          - "Shipment.status == SCHEDULED (a LOADED shipment cannot be cancelled — ERR_INVALID_STATE)"
        side_effects:
          - "Shipment.status=CANCELLED (no bushels were drawn yet); the bay window held by this shipment is released and no longer conflicts"

  - entity: DryingReservation
    initial_state: RESERVED
    terminal_states: [RELEASED]
    transitions:
      - from: RESERVED
        to: RELEASED
        trigger: "POST /commodities/drying-reservations/{id}/release"
        actor: GradeClerk
        preconditions:
          - "DryingReservation.status == RESERVED (else ERR_INVALID_STATE)"
        side_effects:
          - "DryingReservation.status=RELEASED; the window no longer occupies the dryer line and stops conflicting with new reservations"

  - entity: HedgePosition
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: MARGIN_CALL
        trigger: "POST /commodities/hedge-positions/{id}/mark — when resulting account_equity_dollars < maintenance margin total"
        actor: RiskManager
        preconditions:
          - "HedgePosition.status == OPEN (else ERR_INVALID_STATE)"
          - "account_equity_dollars < maintenance_margin_total after applying the new mark (strict <; equal does not trigger)"
        side_effects:
          - "Set mark_futures_price, recompute unrealized_pnl_dollars and account_equity_dollars"
          - "Set margin_call_dollars = initial_margin_total - account_equity_dollars; HedgePosition.status=MARGIN_CALL"
          - "increments HedgePosition.version by 1"
      - from: OPEN
        to: OPEN
        trigger: "POST /commodities/hedge-positions/{id}/mark — when resulting account_equity_dollars >= maintenance margin total"
        actor: RiskManager
        preconditions:
          - "HedgePosition.status == OPEN"
          - "account_equity_dollars >= maintenance_margin_total after applying the new mark"
        side_effects:
          - "Set mark_futures_price, recompute unrealized_pnl_dollars and account_equity_dollars; margin_call_dollars stays 0"
          - "increments HedgePosition.version by 1"
      - from: MARGIN_CALL
        to: OPEN
        trigger: "POST /commodities/hedge-positions/{id}/meet-call"
        actor: RiskManager
        preconditions:
          - "HedgePosition.status == MARGIN_CALL (else ERR_INVALID_STATE)"
          - "deposit_dollars >= margin_call_dollars (ERR_MARGIN_CALL_UNMET)"
        side_effects:
          - "posted_margin_dollars += deposit_dollars; recompute account_equity_dollars; margin_call_dollars=0; HedgePosition.status=OPEN"
          - "increments HedgePosition.version by 1"
      - from: OPEN
        to: CLOSED
        trigger: "POST /commodities/hedge-positions/{id}/close"
        actor: RiskManager
        preconditions:
          - "HedgePosition.status == OPEN"
        side_effects:
          - "HedgePosition.status=CLOSED"
      - from: MARGIN_CALL
        to: CLOSED
        trigger: "POST /commodities/hedge-positions/{id}/close"
        actor: RiskManager
        preconditions:
          - "HedgePosition.status == MARGIN_CALL"
        side_effects:
          - "HedgePosition.status=CLOSED (liquidated under an unmet call)"

  - entity: PatronagePeriod
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /commodities/patronage-periods/{id}/close"
        actor: Merchandiser
        preconditions:
          - "PatronagePeriod.status == OPEN (else ERR_INVALID_STATE)"
          - "total_bushels (sum of all Member.net_priced_bushels) > 0 (ERR_EMPTY_PATRONAGE_POOL)"
        side_effects:
          - "Set total_bushels = sum of Member.net_priced_bushels over all members"
          - "For each member with net_priced_bushels > 0, create a PatronageAllocation per patronage_distribution calculation"
          - "Cascade: Member.equity_credit_dollars += allocation equity_dollars; Member.cash_paid_dollars += allocation cash_dollars"
          - "PatronagePeriod.status=CLOSED; increments PatronagePeriod.version by 1"

# =============================================================================
# Concurrency Rules (§1.2.1)
# =============================================================================
concurrency_rules:
  - rule_id: settlement-post-stale-position
    parent_entity: StoragePosition
    write_endpoint: "POST /commodities/settlements/{id}/post"
    occ_field: "expected_storage_position_version"
    description: |
      Posting a Settlement that draws from a StoragePosition whose version has
      advanced since the client last observed it is rejected. A prior post (or
      load-out) against the same position legitimately reduced bushels_available
      and bumped the position's version; a second post still carrying the old
      version is operating on a stale view of available bushels and must be
      refused on the version check rather than silently over-drawing.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: meet-call-stale-hedge
    parent_entity: HedgePosition
    write_endpoint: "POST /commodities/hedge-positions/{id}/meet-call"
    occ_field: "expected_hedge_position_version"
    description: |
      Meeting a margin call against a HedgePosition whose version has advanced
      since the client last observed it is rejected. A new mark may have moved
      the call amount (or cleared the call) and bumped the position version; a
      meet-call carrying the old version is acting on a stale call figure and is
      refused on the version check.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table (§1.3)
# =============================================================================
calculations:
  - name: grade_in
    trigger: "ScaleTicket WEIGHED->GRADED (POST /commodities/scale-tickets/{id}/grade)"
    algorithm: threshold
    formula: |
      net_weight_lbs   = gross_weight_lbs - tare_weight_lbs
      dockage_lbs      = net_weight_lbs * (dockage_pct / 100)
      clean_weight_lbs = net_weight_lbs - dockage_lbs            # dockage removed FIRST
      moisture_points  = max(0, moisture_pct - Commodity.base_moisture_pct)
      wet_bushels      = round(clean_weight_lbs / Commodity.test_weight_lbs_per_bushel, 4)
      dry_weight_lbs   = clean_weight_lbs * (1 - Commodity.shrink_pct_per_point/100 * moisture_points)  # shrink AFTER dockage
      net_dry_bushels  = round(dry_weight_lbs / Commodity.test_weight_lbs_per_bushel, 4)
      drying_charge_dollars = round(net_dry_bushels * moisture_points
                                    * Commodity.drying_cents_per_point_per_bushel / 100, 2)
    input_set: "Single ScaleTicket plus its Commodity reference standards"
    constants: {}
    precision: "bushels 4 dp round_half_up; dollars 2 dp round_half_up"
    note: |
      Evaluation order is PINNED: dockage is removed from net weight FIRST, THEN
      moisture shrink is applied to the already-dockage-reduced clean weight.
      Reversing the order (shrink first, dockage second) yields a different
      net_dry_bushels. Below base_moisture_pct, moisture_points=0 so no shrink
      and no drying charge.

  - name: contract_net_price
    trigger: "Contract OPEN->PRICED (fix-price) for BASIS/HTA/CASH; computed at create for FORWARD"
    algorithm: constraint_propagation
    formula: |
      FORWARD: futures_leg and basis_leg both supplied at create; net_price = futures_leg + basis_leg
      CASH:    at fix-price, futures_leg = current PriceBoard.futures_price,
               basis_leg = current PriceBoard.cash_basis; net_price = futures_leg + basis_leg
      BASIS:   basis_leg fixed at create; at fix-price futures_leg = current PriceBoard.futures_price;
               net_price = futures_leg(at fixing) + basis_leg(at create)
      HTA:     futures_leg fixed at create; at fix-price basis_leg = current PriceBoard.cash_basis;
               net_price = futures_leg(at create) + basis_leg(at fixing)
    input_set: "Contract legs plus the current PriceBoard for the commodity at fixing time"
    constants: {}
    precision: "net_price 4 dp round_half_up"
    variants:
      - name: basis_contract_pricing
        when: "contract_type == BASIS — basis locked early, futures floated and fixed later"
        difference: "Member is exposed to futures moves; the LATE leg is futures_leg taken from the board at fixing."
      - name: hta_contract_pricing
        when: "contract_type == HTA — futures locked early, basis floated and fixed later"
        difference: "Member is exposed to basis moves; the LATE leg is basis_leg taken from the board at fixing. For the SAME board history a BASIS and an HTA contract produce DIFFERENT net_price."

  - name: storage_charge
    trigger: "Settlement DRAFT->SETTLED (post); recomputed per chosen storage_basis"
    algorithm: chronological
    formula: |
      rate = STORAGE_RATE_PER_BU_PER_DAY
      grace_end = storage_start_date + GRACE_DAYS
      today     = current clock date
      WAREHOUSE_RECEIPT positions: storage_charge_dollars = 0 (flat-fee program, no per-day accrual)
      DELAYED_PRICE positions:
        chargeable_calendar_days = max(0, whole_days(grace_end -> today))
        ESTIMATE variant: chargeable_days = chargeable_calendar_days
        ACTUAL   variant: chargeable_days = max(0, chargeable_calendar_days - StoragePosition.frozen_days)
        storage_charge_dollars = round(priced_bushels * rate * chargeable_days, 2)
    input_set: "Single StoragePosition (program, storage_start_date, frozen_days) + the Settlement's priced_bushels + the clock"
    constants:
      STORAGE_RATE_PER_BU_PER_DAY: 0.0005
      GRACE_DAYS: 30
    precision: "2 dp round_half_up"
    variants:
      - name: estimate_forward_looking
        when: "Settlement.storage_basis == ESTIMATE"
        difference: "Projects the full grace-end->today span; ignores frozen days (charges as if never paused)."
      - name: actual_chronological
        when: "Settlement.storage_basis == ACTUAL"
        difference: "Subtracts StoragePosition.frozen_days from chargeable days; for a position frozen part of the span the two variants DIVERGE."

  - name: margin_mark_to_market
    trigger: "HedgePosition mark / meet-call"
    algorithm: threshold
    formula: |
      contract_bu          = Commodity.futures_contract_bushels
      initial_margin_total = INITIAL_MARGIN_PER_CONTRACT * contracts
      maintenance_total    = MAINTENANCE_MARGIN_PER_CONTRACT * contracts
      if side == SHORT: unrealized_pnl_dollars = round((entry_futures_price - mark_futures_price) * contract_bu * contracts, 2)
      if side == LONG : unrealized_pnl_dollars = round((mark_futures_price - entry_futures_price) * contract_bu * contracts, 2)
      account_equity_dollars = posted_margin_dollars + unrealized_pnl_dollars
      margin_call triggered  <=> account_equity_dollars < maintenance_total   # STRICT < ; equal does NOT trigger
      margin_call_dollars    = initial_margin_total - account_equity_dollars   # restore to initial
    input_set: "Single HedgePosition + its Commodity.futures_contract_bushels"
    constants:
      INITIAL_MARGIN_PER_CONTRACT: 2000
      MAINTENANCE_MARGIN_PER_CONTRACT: 1500
    precision: "2 dp round_half_up"
    note: |
      At open, posted_margin_dollars initializes to initial_margin_total
      (= 2000 * contracts). The maintenance comparison is strict: equity exactly
      equal to maintenance_total does NOT trigger a call.

  - name: patronage_distribution
    trigger: "PatronagePeriod OPEN->CLOSED (close)"
    algorithm: waterfall_allocation
    formula: |
      total_bushels = sum(Member.net_priced_bushels for all members)            # > 0 required
      eligible = members with net_priced_bushels > 0, ordered by net_priced_bushels DESC, created_at ASC tie-break
      for each member m in eligible:
        allocation_dollars = round(pool_dollars * m.net_priced_bushels / total_bushels, 2)
        cash_raw           = allocation_dollars * qualified_cash_pct
        cash_dollars       = floor_to_cents(cash_raw)          # ROUND_DOWN to 2 dp
        equity_dollars     = round(allocation_dollars - cash_dollars, 2)
      cash_remainder = round(sum(allocation_dollars)*qualified_cash_pct, 2) - sum(cash_dollars over members)
      assign the entire cash_remainder to the FIRST member in eligible order (greatest net_priced_bushels;
        created_at ASC tie-break): its cash_dollars += cash_remainder, equity_dollars -= cash_remainder
    input_set: "All Members with net_priced_bushels > 0 at close; the PatronagePeriod pool and cash pct"
    constants: {}
    precision: "allocation/cash/equity 2 dp; cash floored to cents, remainder waterfalled to highest-bushel member"
    note: |
      Order is PINNED: net_priced_bushels DESC then created_at ASC. id is NEVER a
      tie-break input. Remainder is the rounding residue from flooring each
      member's cash share; it is conserved by handing it to the lead member.

  - name: interval_overlap
    trigger: "Shipment create (bay window) and DryingReservation create (dryer window)"
    algorithm: interval_merge
    formula: |
      LoadoutBay window [bay_window_start, bay_window_end) — HALF-OPEN:
        a new window conflicts with an existing non-cancelled shipment window ON THE SAME loadout_bay_id when
          new_start < existing.bay_window_end  AND  new_end > existing.bay_window_start
        Touching windows (new_start == existing.bay_window_end, or new_end == existing.bay_window_start) DO NOT conflict.
        Only Shipments with status IN {SCHEDULED, LOADED, SHIPPED} occupy the bay; CANCELLED windows are free.
      DryerLine window [window_start, window_end] — CLOSED WITH BUFFER:
        let B = DryerLine.cleanout_buffer_minutes
        a new window conflicts with an existing RESERVED reservation ON THE SAME dryer_line_id when
          new_start <= existing.window_end + B  AND  new_end + B >= existing.window_start
        i.e. windows must be separated by STRICTLY MORE THAN B minutes; touching or within-buffer is rejected.
        Only reservations with status == RESERVED occupy the line; RELEASED windows are free.
    input_set: "All non-free windows on the same resource id (bay or dryer line)"
    constants: {}
    precision: "exact datetime comparison; buffer in whole minutes"
    note: |
      The two geometries DIFFER: bay windows are half-open (touching allowed), dryer
      windows are closed with a mandatory buffer (touching rejected). Both reject on
      ERR_RESOURCE_WINDOW_CONFLICT but on different resources with different arithmetic.

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority) (§1.4)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role is permitted to perform this operation per the RBAC matrix"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Every id in the path and every FK in the body resolves to an existing resource, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: business_constraint
    check: "Required body fields present and well-typed; enum values in their declared sets; weights/bushels/contracts non-negative; gross_weight_lbs > tare_weight_lbs"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "all POST/PUT with a body"

  - priority: 5
    category: state
    check: "Target resource is in a state from which the requested transition is defined"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 6
    category: business_referential
    check: "Cross-entity coherence: Settlement's Contract and StoragePosition share commodity_id and member_id"
    error_id: ERR_COMMODITY_MISMATCH
    http_status: 409
    applies_to: "POST /commodities/settlements/{id}/post"

  - priority: 7
    category: business_constraint
    check: "Contract leg being fixed is the open leg for its contract_type (no double-fix)"
    error_id: ERR_LEG_ALREADY_FIXED
    http_status: 409
    applies_to: "POST /commodities/contracts/{id}/fix-price"

  - priority: 8
    category: business_referential
    check: "A current PriceBoard exists for the commodity when a leg must be read from the board"
    error_id: ERR_NO_CURRENT_PRICE
    http_status: 409
    applies_to: "POST /commodities/contracts/{id}/fix-price"

  - priority: 9
    category: state
    check: "Settlement post requires the Contract priced (PRICED, or FORWARD with both legs fixed)"
    error_id: ERR_CONTRACT_NOT_PRICED
    http_status: 409
    applies_to: "POST /commodities/settlements/{id}/post"

  - priority: 10
    category: business_constraint
    check: "Settlement priced_bushels must not exceed Contract.contracted_bushels - Contract.priced_bushels"
    error_id: ERR_CONTRACT_OVERFILL
    http_status: 409
    applies_to: "POST /commodities/settlements/{id}/post"

  - priority: 11
    category: business_constraint
    check: "Drawn bushels (Settlement priced_bushels / Shipment bushels) must not exceed StoragePosition.bushels_available"
    error_id: ERR_INSUFFICIENT_BUSHELS
    http_status: 409
    applies_to: "POST /commodities/settlements/{id}/post, POST /commodities/shipments/{id}/load"

  - priority: 12
    category: business_constraint
    check: "Charge-freeze only on DELAYED_PRICE positions; WAREHOUSE_RECEIPT positions reject freeze"
    error_id: ERR_PROGRAM_MISMATCH
    http_status: 409
    applies_to: "POST /commodities/storage-positions/{id}/freeze-charge"

  - priority: 13
    category: business_fiscal
    check: "meet-call deposit must cover the outstanding margin_call_dollars"
    error_id: ERR_MARGIN_CALL_UNMET
    http_status: 409
    applies_to: "POST /commodities/hedge-positions/{id}/meet-call"

  - priority: 14
    category: business_constraint
    check: "Contract cancel requires zero applied (SETTLED) settlement bushels"
    error_id: ERR_CONTRACT_HAS_SETTLEMENTS
    http_status: 409
    applies_to: "POST /commodities/contracts/{id}/cancel"

  - priority: 15
    category: business_fiscal
    check: "Patronage period close requires total net_priced_bushels > 0"
    error_id: ERR_EMPTY_PATRONAGE_POOL
    http_status: 409
    applies_to: "POST /commodities/patronage-periods/{id}/close"

  - priority: 16
    category: business_temporal
    check: "Shipment bay window must not strictly overlap any non-cancelled shipment window on the same loadout_bay_id (half-open: touching is allowed)"
    error_id: ERR_RESOURCE_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /commodities/shipments"

  - priority: 17
    category: business_temporal
    check: "DryingReservation window must be separated by strictly more than DryerLine.cleanout_buffer_minutes from any RESERVED reservation on the same dryer_line_id (closed + buffer: touching/within-buffer rejected)"
    error_id: ERR_RESOURCE_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /commodities/drying-reservations"

  - priority: 18
    category: state
    check: "OCC: expected_<parent>_version on a guarded write must equal the parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /commodities/settlements/{id}/post, POST /commodities/hedge-positions/{id}/meet-call"

# =============================================================================
# Response Envelope (§1.0 — FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 5: API Endpoint Table (§1.5)
# =============================================================================
endpoints:
  # --- Commodity ---
  - method: POST
    path: "/commodities"
    description: "Create a commodity reference (grade standards, shrink, drying, futures size)"
    roles: [Merchandiser]
    code: 201
    input: [symbol, test_weight_lbs_per_bushel, base_moisture_pct, shrink_pct_per_point, drying_cents_per_point_per_bushel, "futures_contract_bushels?"]
    output: Commodity
    side_effects: []
  - method: GET
    path: "/commodities/{id}"
    description: "Get a commodity"
    roles: [Merchandiser, GradeClerk, SettlementOfficer, RiskManager, ShippingClerk]
    code: 200
    input: []
    output: Commodity
    side_effects: []

  # --- PriceBoard ---
  - method: POST
    path: "/commodities/price-boards"
    description: "Post a new price board for a commodity (futures + basis); becomes the current board"
    roles: [Merchandiser]
    code: 201
    input: [commodity_id, futures_price, cash_basis]
    output: PriceBoard
    side_effects: ["computes cash_price; marks this board is_current=true and supersedes the prior current board for the commodity"]
  - method: GET
    path: "/commodities/price-boards/{id}"
    description: "Get a price board"
    roles: [Merchandiser, GradeClerk, SettlementOfficer, RiskManager, ShippingClerk]
    code: 200
    input: []
    output: PriceBoard
    side_effects: []
  - method: GET
    path: "/commodities/price-boards"
    description: "List price boards, optionally filtered by commodity"
    roles: [Merchandiser, GradeClerk, SettlementOfficer, RiskManager, ShippingClerk]
    code: 200
    input: ["commodity_id?", "is_current?", "limit?", "offset?"]
    output: PriceBoard[]
    side_effects: []

  # --- Member ---
  - method: POST
    path: "/commodities/members"
    description: "Create a co-op member"
    roles: [Merchandiser]
    code: 201
    input: [name]
    output: Member
    side_effects: ["equity_credit_dollars=0, cash_paid_dollars=0, net_priced_bushels=0"]
  - method: GET
    path: "/commodities/members/{id}"
    description: "Get a member with patronage ledger fields"
    roles: [Merchandiser, GradeClerk, SettlementOfficer, RiskManager, ShippingClerk]
    code: 200
    input: []
    output: Member
    side_effects: []
  - method: GET
    path: "/commodities/members/{id}/allocations"
    description: "List patronage allocations posted to a member"
    roles: [Merchandiser, SettlementOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: PatronageAllocation[]
    side_effects: []

  # --- ScaleTicket ---
  - method: POST
    path: "/commodities/scale-tickets"
    description: "Weigh in a load (create a scale ticket in WEIGHED)"
    roles: [GradeClerk]
    code: 201
    input: [member_id, commodity_id, gross_weight_lbs, tare_weight_lbs, moisture_pct, deposit_account_type, "dockage_pct?"]
    output: ScaleTicket
    side_effects: ["status=WEIGHED"]
  - method: GET
    path: "/commodities/scale-tickets/{id}"
    description: "Get a scale ticket with grade computations"
    roles: [Merchandiser, GradeClerk, SettlementOfficer]
    code: 200
    input: []
    output: ScaleTicket
    side_effects: []
  - method: GET
    path: "/commodities/scale-tickets"
    description: "List scale tickets, optionally filtered by member, commodity, or storage position"
    roles: [Merchandiser, GradeClerk, SettlementOfficer]
    code: 200
    input: ["member_id?", "commodity_id?", "storage_position_id?", "limit?", "offset?"]
    output: ScaleTicket[]
    side_effects: []
  - method: POST
    path: "/commodities/scale-tickets/{id}/grade"
    description: "Grade a WEIGHED ticket: compute grade/dockage/shrink/drying and create the StoragePosition"
    roles: [GradeClerk]
    code: 200
    input: []
    output: ScaleTicket
    side_effects: ["runs grade_in calc", "creates StoragePosition (STORED)", "sets storage_position_id", "status=GRADED"]
  - method: POST
    path: "/commodities/scale-tickets/{id}/void"
    description: "Void a WEIGHED ticket"
    roles: [GradeClerk]
    code: 200
    input: []
    output: ScaleTicket
    side_effects: ["status=VOIDED"]

  # --- StoragePosition ---
  - method: GET
    path: "/commodities/storage-positions/{id}"
    description: "Get a storage position"
    roles: [Merchandiser, GradeClerk, SettlementOfficer, ShippingClerk]
    code: 200
    input: []
    output: StoragePosition
    side_effects: []
  - method: GET
    path: "/commodities/storage-positions"
    description: "List storage positions, optionally filtered by member, commodity, scale ticket, or receipt"
    roles: [Merchandiser, GradeClerk, SettlementOfficer, ShippingClerk]
    code: 200
    input: ["member_id?", "commodity_id?", "scale_ticket_id?", "receipt_id?", "limit?", "offset?"]
    output: StoragePosition[]
    side_effects: []
  - method: POST
    path: "/commodities/storage-positions/{id}/freeze-charge"
    description: "Pause per-day storage accrual on a DELAYED_PRICE position"
    roles: [Merchandiser]
    code: 200
    input: []
    output: StoragePosition
    side_effects: ["status=CHARGE_FROZEN"]
  - method: POST
    path: "/commodities/storage-positions/{id}/unfreeze-charge"
    description: "Resume per-day storage accrual; bank frozen whole days into frozen_days"
    roles: [Merchandiser]
    code: 200
    input: []
    output: StoragePosition
    side_effects: ["frozen_days += whole frozen days", "status=STORED"]

  # --- WarehouseReceipt ---
  - method: POST
    path: "/commodities/warehouse-receipts"
    description: "Issue a warehouse receipt for a WAREHOUSE_RECEIPT storage position"
    roles: [Merchandiser]
    code: 201
    input: [storage_position_id]
    output: WarehouseReceipt
    side_effects: ["status=ISSUED; sets position.receipt_id; bushels snapshot from position"]
  - method: GET
    path: "/commodities/warehouse-receipts/{id}"
    description: "Get a warehouse receipt"
    roles: [Merchandiser, SettlementOfficer, ShippingClerk]
    code: 200
    input: []
    output: WarehouseReceipt
    side_effects: []
  - method: GET
    path: "/commodities/warehouse-receipts"
    description: "List warehouse receipts, optionally filtered by storage position or member"
    roles: [Merchandiser, SettlementOfficer, ShippingClerk]
    code: 200
    input: ["storage_position_id?", "member_id?", "limit?", "offset?"]
    output: WarehouseReceipt[]
    side_effects: []

  # --- Contract ---
  - method: POST
    path: "/commodities/contracts"
    description: "Create a marketing contract (CASH/FORWARD/BASIS/HTA). FORWARD requires both legs; BASIS requires basis_leg; HTA requires futures_leg; CASH requires neither."
    roles: [Merchandiser]
    code: 201
    input: [member_id, commodity_id, contract_type, contracted_bushels, "futures_leg?", "basis_leg?"]
    output: Contract
    side_effects: ["status=OPEN; FORWARD computes net_price at create; BASIS sets basis_leg; HTA sets futures_leg"]
  - method: GET
    path: "/commodities/contracts/{id}"
    description: "Get a contract"
    roles: [Merchandiser, SettlementOfficer]
    code: 200
    input: []
    output: Contract
    side_effects: []
  - method: GET
    path: "/commodities/contracts"
    description: "List contracts, optionally filtered by member or commodity"
    roles: [Merchandiser, SettlementOfficer]
    code: 200
    input: ["member_id?", "commodity_id?", "limit?", "offset?"]
    output: Contract[]
    side_effects: []
  - method: POST
    path: "/commodities/contracts/{id}/fix-price"
    description: "Fix the open leg from the current price board (BASIS->futures, HTA->basis, CASH->both)"
    roles: [Merchandiser]
    code: 200
    input: []
    output: Contract
    side_effects: ["runs contract_net_price calc", "sets net_price", "status=PRICED"]
  - method: POST
    path: "/commodities/contracts/{id}/cancel"
    description: "Cancel an OPEN or PRICED contract with no applied settlements"
    roles: [Merchandiser]
    code: 200
    input: []
    output: Contract
    side_effects: ["status=CANCELLED"]

  # --- Settlement ---
  - method: POST
    path: "/commodities/settlements"
    description: "Draft a settlement applying bushels from a storage position to a contract"
    roles: [SettlementOfficer]
    code: 201
    input: [contract_id, storage_position_id, priced_bushels, "storage_basis?"]
    output: Settlement
    side_effects: ["status=DRAFT"]
  - method: GET
    path: "/commodities/settlements/{id}"
    description: "Get a settlement with computed proceeds and storage charge"
    roles: [Merchandiser, SettlementOfficer]
    code: 200
    input: []
    output: Settlement
    side_effects: []
  - method: GET
    path: "/commodities/settlements"
    description: "List settlements, optionally filtered by contract or storage position"
    roles: [Merchandiser, SettlementOfficer]
    code: 200
    input: ["contract_id?", "storage_position_id?", "limit?", "offset?"]
    output: Settlement[]
    side_effects: []
  - method: POST
    path: "/commodities/settlements/{id}/post"
    description: "Post (finalize) a DRAFT settlement; computes proceeds/storage charge and applies ledger cascades. OCC-guarded on the storage position."
    roles: [SettlementOfficer]
    code: 200
    input: [expected_storage_position_version]
    output: Settlement
    side_effects: ["runs storage_charge + proceeds calc", "draws bushels (cascade DEPLETED)", "fills contract (cascade SETTLED)", "ticket -> SETTLED_IN", "member ledger updated", "increments StoragePosition.version by 1", "status=SETTLED"]
  - method: POST
    path: "/commodities/settlements/{id}/cancel"
    description: "Cancel a DRAFT settlement"
    roles: [SettlementOfficer]
    code: 200
    input: []
    output: Settlement
    side_effects: ["status=CANCELLED"]

  # --- LoadoutBay ---
  - method: POST
    path: "/commodities/loadout-bays"
    description: "Create a physical load-out bay"
    roles: [Merchandiser]
    code: 201
    input: [name]
    output: LoadoutBay
    side_effects: []
  - method: GET
    path: "/commodities/loadout-bays/{id}"
    description: "Get a load-out bay"
    roles: [Merchandiser, ShippingClerk]
    code: 200
    input: []
    output: LoadoutBay
    side_effects: []
  - method: GET
    path: "/commodities/loadout-bays"
    description: "List load-out bays"
    roles: [Merchandiser, ShippingClerk]
    code: 200
    input: ["limit?", "offset?"]
    output: LoadoutBay[]
    side_effects: []

  # --- DryerLine ---
  - method: POST
    path: "/commodities/dryer-lines"
    description: "Create a dryer line with its cleanout buffer"
    roles: [Merchandiser]
    code: 201
    input: [name, "cleanout_buffer_minutes?"]
    output: DryerLine
    side_effects: []
  - method: GET
    path: "/commodities/dryer-lines/{id}"
    description: "Get a dryer line"
    roles: [Merchandiser, GradeClerk]
    code: 200
    input: []
    output: DryerLine
    side_effects: []
  - method: GET
    path: "/commodities/dryer-lines"
    description: "List dryer lines"
    roles: [Merchandiser, GradeClerk]
    code: 200
    input: ["limit?", "offset?"]
    output: DryerLine[]
    side_effects: []

  # --- DryingReservation ---
  - method: POST
    path: "/commodities/drying-reservations"
    description: "Reserve a drying window on a dryer line for a wet load. Rejects windows within the line's cleanout buffer of an existing RESERVED window (closed interval semantics)."
    roles: [GradeClerk]
    code: 201
    input: [dryer_line_id, scale_ticket_id, window_start, window_end]
    output: DryingReservation
    side_effects: ["status=RESERVED; runs interval_overlap (dryer geometry)"]
  - method: GET
    path: "/commodities/drying-reservations/{id}"
    description: "Get a drying reservation"
    roles: [Merchandiser, GradeClerk]
    code: 200
    input: []
    output: DryingReservation
    side_effects: []
  - method: GET
    path: "/commodities/drying-reservations"
    description: "List drying reservations, optionally filtered by dryer line or scale ticket"
    roles: [Merchandiser, GradeClerk]
    code: 200
    input: ["dryer_line_id?", "scale_ticket_id?", "limit?", "offset?"]
    output: DryingReservation[]
    side_effects: []
  - method: POST
    path: "/commodities/drying-reservations/{id}/release"
    description: "Release a reserved drying window (frees the dryer line)"
    roles: [GradeClerk]
    code: 200
    input: []
    output: DryingReservation
    side_effects: ["status=RELEASED"]

  # --- Shipment ---
  - method: POST
    path: "/commodities/shipments"
    description: "Schedule a load-out of bushels from a storage position; reserves a half-open bay window. Rejects windows that strictly overlap a non-cancelled shipment on the same bay (touching is allowed)."
    roles: [ShippingClerk]
    code: 201
    input: [commodity_id, storage_position_id, loadout_bay_id, bushels, bay_window_start, bay_window_end]
    output: Shipment
    side_effects: ["status=SCHEDULED; runs interval_overlap (bay geometry)"]
  - method: GET
    path: "/commodities/shipments/{id}"
    description: "Get a shipment"
    roles: [Merchandiser, ShippingClerk]
    code: 200
    input: []
    output: Shipment
    side_effects: []
  - method: GET
    path: "/commodities/shipments"
    description: "List shipments, optionally filtered by commodity, storage position, or loadout bay"
    roles: [Merchandiser, ShippingClerk]
    code: 200
    input: ["commodity_id?", "storage_position_id?", "loadout_bay_id?", "limit?", "offset?"]
    output: Shipment[]
    side_effects: []
  - method: POST
    path: "/commodities/shipments/{id}/load"
    description: "Load a scheduled shipment; draws bushels from the position"
    roles: [ShippingClerk]
    code: 200
    input: []
    output: Shipment
    side_effects: ["draws bushels (cascade DEPLETED -> receipt CANCELLED)", "status=LOADED"]
  - method: POST
    path: "/commodities/shipments/{id}/ship"
    description: "Mark a loaded shipment shipped"
    roles: [ShippingClerk]
    code: 200
    input: []
    output: Shipment
    side_effects: ["status=SHIPPED"]
  - method: POST
    path: "/commodities/shipments/{id}/cancel"
    description: "Cancel a scheduled shipment"
    roles: [ShippingClerk]
    code: 200
    input: []
    output: Shipment
    side_effects: ["status=CANCELLED"]

  # --- HedgePosition ---
  - method: POST
    path: "/commodities/hedge-positions"
    description: "Open a hedge (futures) position; posts initial margin"
    roles: [RiskManager]
    code: 201
    input: [commodity_id, side, contracts, entry_futures_price]
    output: HedgePosition
    side_effects: ["posted_margin_dollars = 2000 * contracts", "status=OPEN"]
  - method: GET
    path: "/commodities/hedge-positions/{id}"
    description: "Get a hedge position with margin figures"
    roles: [Merchandiser, RiskManager]
    code: 200
    input: []
    output: HedgePosition
    side_effects: []
  - method: GET
    path: "/commodities/hedge-positions"
    description: "List hedge positions, optionally filtered by commodity"
    roles: [Merchandiser, RiskManager]
    code: 200
    input: ["commodity_id?", "limit?", "offset?"]
    output: HedgePosition[]
    side_effects: []
  - method: POST
    path: "/commodities/hedge-positions/{id}/mark"
    description: "Apply a mark-to-market price; may trigger a margin call"
    roles: [RiskManager]
    code: 200
    input: [mark_futures_price]
    output: HedgePosition
    side_effects: ["runs margin_mark_to_market calc", "may set status=MARGIN_CALL"]
  - method: POST
    path: "/commodities/hedge-positions/{id}/meet-call"
    description: "Deposit margin to cure a margin call. OCC-guarded on the hedge position."
    roles: [RiskManager]
    code: 200
    input: [deposit_dollars, expected_hedge_position_version]
    output: HedgePosition
    side_effects: ["posted_margin_dollars += deposit", "margin_call_dollars=0", "increments HedgePosition.version by 1", "status=OPEN"]
  - method: POST
    path: "/commodities/hedge-positions/{id}/close"
    description: "Close a hedge position"
    roles: [RiskManager]
    code: 200
    input: []
    output: HedgePosition
    side_effects: ["status=CLOSED"]

  # --- PatronagePeriod ---
  - method: POST
    path: "/commodities/patronage-periods"
    description: "Open a patronage distribution period"
    roles: [Merchandiser]
    code: 201
    input: [label, pool_dollars, qualified_cash_pct]
    output: PatronagePeriod
    side_effects: ["status=OPEN"]
  - method: GET
    path: "/commodities/patronage-periods/{id}"
    description: "Get a patronage period"
    roles: [Merchandiser, SettlementOfficer]
    code: 200
    input: []
    output: PatronagePeriod
    side_effects: []
  - method: GET
    path: "/commodities/patronage-periods/{id}/allocations"
    description: "List allocations posted under a patronage period"
    roles: [Merchandiser, SettlementOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: PatronageAllocation[]
    side_effects: []
  - method: POST
    path: "/commodities/patronage-periods/{id}/close"
    description: "Close a period and post pro-rata patronage allocations to members"
    roles: [Merchandiser]
    code: 200
    input: []
    output: PatronagePeriod
    side_effects: ["runs patronage_distribution calc", "creates PatronageAllocation per member", "credits member equity/cash", "status=CLOSED"]

  # --- Test-driving: logical clock ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock. Default at startup is 2026-01-01T00:00:00Z; the clock never falls back to wall-clock time. Drives storage_start_date and storage-charge day math deterministically."
    roles: [Merchandiser]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["logical clock advanced to to_iso8601"]

# =============================================================================
# Table 6: Error Code Catalog (§1.6)
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role header missing or not a known role" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for this operation" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "A path id or body FK does not resolve" }
  - { id: ERR_INVALID_REQUEST, http: 422, condition: "Missing/ill-typed field, bad enum, negative quantity, or gross_weight_lbs <= tare_weight_lbs" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a state from which the requested transition is defined" }
  - { id: ERR_COMMODITY_MISMATCH, http: 409, condition: "Settlement's contract and storage position do not share commodity_id and member_id" }
  - { id: ERR_LEG_ALREADY_FIXED, http: 409, condition: "fix-price would set a leg already fixed for this contract_type" }
  - { id: ERR_NO_CURRENT_PRICE, http: 409, condition: "No current PriceBoard exists for the commodity when a leg must be read from the board" }
  - { id: ERR_CONTRACT_NOT_PRICED, http: 409, condition: "Settlement post requires the contract priced (PRICED, or FORWARD with both legs fixed)" }
  - { id: ERR_CONTRACT_OVERFILL, http: 409, condition: "Settlement priced_bushels exceeds the contract's remaining unfilled bushels" }
  - { id: ERR_INSUFFICIENT_BUSHELS, http: 409, condition: "Drawn bushels exceed StoragePosition.bushels_available" }
  - { id: ERR_PROGRAM_MISMATCH, http: 409, condition: "Charge-freeze attempted on a non-DELAYED_PRICE position" }
  - { id: ERR_MARGIN_CALL_UNMET, http: 409, condition: "meet-call deposit does not cover the outstanding margin_call_dollars" }
  - { id: ERR_CONTRACT_HAS_SETTLEMENTS, http: 409, condition: "Contract cancel attempted while applied (SETTLED) settlement bushels exist" }
  - { id: ERR_EMPTY_PATRONAGE_POOL, http: 409, condition: "Patronage close attempted with total net_priced_bushels == 0" }
  - { id: ERR_RESOURCE_WINDOW_CONFLICT, http: 409, condition: "Bay window strictly overlaps a non-cancelled shipment on the same bay, or dryer window is within the line's cleanout buffer of a RESERVED reservation on the same line" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent's current version" }

# =============================================================================
# Table 7: RBAC Matrix (§1.7)
# =============================================================================
roles:
  - name: Merchandiser
    description: "Sets up commodities, price boards, members, contracts (and fixing/cancel), storage freezes, warehouse receipts, and patronage periods"
    identity: opaque
    exclusive_operations:
      - "POST /commodities — create commodity"
      - "POST /commodities/price-boards — post price board"
      - "POST /commodities/members — create member"
      - "POST /commodities/contracts — create contract"
      - "POST /commodities/contracts/{id}/fix-price — fix price"
      - "POST /commodities/contracts/{id}/cancel — cancel contract"
      - "POST /commodities/storage-positions/{id}/freeze-charge — freeze accrual"
      - "POST /commodities/storage-positions/{id}/unfreeze-charge — resume accrual"
      - "POST /commodities/warehouse-receipts — issue receipt"
      - "POST /commodities/loadout-bays — create loadout bay"
      - "POST /commodities/dryer-lines — create dryer line"
      - "POST /commodities/patronage-periods — open period"
      - "POST /commodities/patronage-periods/{id}/close — close period"
      - "POST /_clock/set_current_utc — set logical clock"
    shared_operations:
      - "GET reads across commodities, price boards, members, allocations, scale tickets, storage positions, receipts, contracts, settlements, shipments, hedge positions, patronage periods"

  - name: GradeClerk
    description: "Weighs in loads and grades them into storage"
    identity: opaque
    exclusive_operations:
      - "POST /commodities/scale-tickets — weigh in"
      - "POST /commodities/scale-tickets/{id}/grade — grade"
      - "POST /commodities/scale-tickets/{id}/void — void ticket"
      - "POST /commodities/drying-reservations — reserve drying window"
      - "POST /commodities/drying-reservations/{id}/release — release drying window"
    shared_operations:
      - "GET reads on commodities, members, scale tickets, storage positions, price boards, dryer lines, drying reservations"

  - name: SettlementOfficer
    description: "Drafts and posts settlements applying stored bushels to contracts"
    identity: opaque
    exclusive_operations:
      - "POST /commodities/settlements — draft settlement"
      - "POST /commodities/settlements/{id}/post — post settlement"
      - "POST /commodities/settlements/{id}/cancel — cancel settlement"
    shared_operations:
      - "GET reads on commodities, members, allocations, contracts, settlements, storage positions, receipts, price boards, patronage periods"

  - name: ShippingClerk
    description: "Schedules and executes load-outs/shipments"
    identity: opaque
    exclusive_operations:
      - "POST /commodities/shipments — schedule shipment"
      - "POST /commodities/shipments/{id}/load — load"
      - "POST /commodities/shipments/{id}/ship — ship"
      - "POST /commodities/shipments/{id}/cancel — cancel shipment"
    shared_operations:
      - "GET reads on commodities, storage positions, receipts, shipments, price boards"

  - name: RiskManager
    description: "Manages the elevator's hedge positions, marks, margin calls"
    identity: opaque
    exclusive_operations:
      - "POST /commodities/hedge-positions — open hedge"
      - "POST /commodities/hedge-positions/{id}/mark — mark to market"
      - "POST /commodities/hedge-positions/{id}/meet-call — meet margin call"
      - "POST /commodities/hedge-positions/{id}/close — close hedge"
    shared_operations:
      - "GET reads on commodities, hedge positions, price boards"
