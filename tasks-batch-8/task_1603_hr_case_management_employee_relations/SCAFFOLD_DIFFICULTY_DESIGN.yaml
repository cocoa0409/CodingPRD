  # ---------------------------------------------------------------------------
  # Rule 5 — priority_pair_validation_conflict: two dual-failure conflicts on
  # DIFFERENT error-category pairs.
  # Instance 1: state (ERR_INVALID_STATE) vs business_safety
  #   (ERR_INVESTIGATOR_CONFLICT) — assign to a case not in TRIAGE/REOPENED
  #   AND with a conflicted investigator: state error must win (priority 6
  #   beats priority 9).
  # Instance 2: business_temporal (ERR_INTERVIEW_OVERLAP) vs
  #   business_constraint (ERR_DOCUMENTATION_STANDARD) — scheduling payload
  #   with end <= start is overlap; documentation minimums don't apply to
  #   scheduling at all, so use instead the pair business_safety
  #   (ERR_SEGREGATION_OF_DUTIES, priority 8) vs business_constraint
  #   (ERR_DOCUMENTATION_STANDARD, priority 16): approve own finding while
  #   ALSO the finding's rationale is below minimum — SoD must win.
  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: assign_state_vs_conflict_priority
        grounds:
          - validations[priority=6]
          - validations[priority=9]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_INVESTIGATOR_CONFLICT]
        distinguishing_aspect: |
          Error-category pair state-vs-business_safety (distinct from the
          sibling's business_safety-vs-business_constraint): assigning to a
          case already in ASSIGNED (state violation, priority 6) with an
          investigator who is ALSO conflicted against the subject (safety
          violation, priority 9) must return ERR_INVALID_STATE, because
          priority 6 precedes priority 9.
        test_recipe:
          setup:
            - "A case already in ASSIGNED under investigator INV1."
            - "A second investigator INV2 whose conflicted_employee_ids contains the case subject."
            - "Clock at default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /er/intake-channels"
              payload: { channel_code: "HOTLINE", display_name: "Hotline E", default_category: "HARASSMENT", default_severity: "LOW", sla_business_days: 10 }
              as: ERManager
              captures: { ch1: $.data.id }
            - call: "POST /er/employees"
              payload: { employee_number: "R-801", full_name: "Reporter H", email: "r801@example.com", location_code: "SF", department: "Ops", hire_date: "2019-01-01T00:00:00Z" }
              as: ERManager
              captures: { rep: $.data.id }
            - call: "POST /er/employees"
              payload: { employee_number: "S-801", full_name: "Subject H", email: "s801@example.com", location_code: "SF", department: "Ops", hire_date: "2019-01-01T00:00:00Z" }
              as: ERManager
              captures: { sub: $.data.id }
            - call: "POST /er/employees"
              payload: { employee_number: "I-801", full_name: "Inv H1", email: "i801@example.com", location_code: "HQ", department: "ER", hire_date: "2018-01-01T00:00:00Z" }
              as: ERManager
              captures: { ei1: $.data.id }
            - call: "POST /er/employees"
              payload: { employee_number: "I-802", full_name: "Inv H2", email: "i802@example.com", location_code: "HQ", department: "ER", hire_date: "2018-01-01T00:00:00Z" }
              as: ERManager
              captures: { ei2: $.data.id }
            - call: "POST /er/investigators"
              payload: { employee_id: "${ei1}", certification_level: "LEVEL_3", max_active_cases: 10 }
              as: ERManager
              captures: { inv1: $.data.id }
            - call: "POST /er/investigators"
              payload: { employee_id: "${ei2}", certification_level: "LEVEL_3", max_active_cases: 10, conflicted_employee_ids: ["${sub}"] }
              as: ERManager
              captures: { inv2: $.data.id }
            - call: "POST /er/cases"
              payload: { intake_channel_id: "${ch1}", reporter_employee_id: "${rep}", subject_employee_id: "${sub}", category: "HARASSMENT", severity: "LOW" }
              as: ERManager
              captures: { c1: $.data.id, c1_v: $.data.version }
            - call: "POST /er/cases/${c1}/assign"
              payload: { investigator_id: "${inv1}", expected_case_version: "${c1_v}" }
              as: ERManager
            - call: "GET /er/cases/${c1}"
              as: ERManager
              captures: { c1_v2: $.data.version }
          trigger:
            - call: "POST /er/cases/${c1}/assign"
              payload: { investigator_id: "${inv2}", expected_case_version: "${c1_v2}" }
              as: ERManager
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (state priority 6 beats business_safety priority 9)"
            - "http status == 409"
            - "Case.${c1}.assigned_investigator_id remains ${inv1}"

      - name: approve_sod_vs_documentation_priority
        grounds:
          - validations[priority=8]
          - validations[priority=16]
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - errors[ERR_DOCUMENTATION_STANDARD]
        distinguishing_aspect: |
          Error-category pair business_safety-vs-business_constraint
          (distinct from the sibling's state-vs-business_safety): the finding
          author attempting to cast an approval vote on their OWN finding
          (segregation-of-duties violation, priority 8) on a finding whose
          rationale_text is also below the 100-character minimum
          (documentation violation, priority 16 — reachable because the
          author PATCHed it shorter after substantiation is impossible, so
          the fixture substantiates with a valid rationale then the violation
          is engineered via a finding that never left DRAFT... the pinned
          trigger: author approves own finding that is in CALIBRATED) must
          return ERR_SEGREGATION_OF_DUTIES because priority 8 precedes any
          business_constraint check.
        test_recipe:
          setup:
            - "A case in CALIBRATION whose finding (authored by INV1) is SUBSTANTIATED with approval_status CALIBRATED."
            - "The author INV1 attempts to cast an approval vote on their own finding; the case also has zero CredibilityAssessment rows (so a substantiation-consistency re-check at priority 17 would also fail if reached — it must NOT be reached)."
          setup_api_calls:
            - call: "POST /er/intake-channels"
              payload: { channel_code: "WEB_PORTAL", display_name: "Portal F", default_category: "DISCRIMINATION", default_severity: "HIGH", sla_business_days: 20 }
              as: ERManager
