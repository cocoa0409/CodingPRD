              payload: {}
              as: PlatformAdmin
          assert:
            - "W15b.invitations_total == 0  # customer suppressed: prior invitation within trailing 90 days"
            - "No invitation created for the SERVICE_VISIT transaction in W15b"

      - name: question_set_active_singleton_overlap
        grounds:
          - state_machines.QuestionSet.DRAFT_to_ACTIVE
          - errors[ERR_ACTIVE_QUESTION_SET_EXISTS]
          - validations[priority=12]
        distinguishing_aspect: |
          Resource = "the active question-set slot"; interval semantics =
          SINGLETON occupation, not interval overlap: at most one ACTIVE
          question set may exist at any time, and activating a second one
          while the first is still ACTIVE is rejected with
          ERR_ACTIVE_QUESTION_SET_EXISTS. Different interval semantics
          (singleton vs trailing-90-day window) and different resource.
        test_recipe:
          setup:
            - "QS-O1 ACTIVE."
            - "QS-O2 DRAFT."
          setup_api_calls:
            - call: "POST /survey/_clock/set_current_utc"
