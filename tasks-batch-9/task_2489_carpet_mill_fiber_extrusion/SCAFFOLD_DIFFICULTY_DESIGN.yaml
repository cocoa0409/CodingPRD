      - name: body_fk_existence_beats_occ_then_occ_beats_yardage_on_manual_allocation
        grounds:
          - validations[priority=6]
          - validations[priority=10]
          - validations[priority=27]
          - errors[ERR_ROLL_GOOD_NOT_FOUND]
          - errors[ERR_STALE_ROLL_GOOD_VERSION]
          - errors[ERR_ROLL_YARDAGE_INSUFFICIENT]
          - concurrency_rules[manual-allocation-stale-roll]
        distinguishing_aspect: |
          Two nested category pairs on one endpoint: existence (priority 6) beats state/OCC
          (priority 10) so an absent roll_good_id yields 404/ERR_ROLL_GOOD_NOT_FOUND rather than 412,
          and state/OCC then beats business_referential (priority 27) so a stale version on a real
          roll yields 412/ERR_STALE_ROLL_GOOD_VERSION rather than 422/ERR_ROLL_YARDAGE_INSUFFICIENT.
