              captures: { still_approved: $.data.status }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-07-09T00:00:00Z" }
              as: MSHAAdmin
            - call: "GET /msha/mine-plans/${plan_v}"
