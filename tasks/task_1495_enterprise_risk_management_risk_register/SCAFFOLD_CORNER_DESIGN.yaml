            - "ToleranceBreach.${bid}.status remains ACKNOWLEDGED"

      - name: breach_acceptance_cap_exceeded_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_ACCEPTANCE_CAP_EXCEEDED]"]
        distinguishing_aspect: "Accept is rejected when residual (25) exceeds acceptance_cap_score (20): cap is an inclusive ceiling on acceptability."
        test_recipe:
          setup: ["category with APPROVED appetite tolerance 5 cap 20; risk inherent 25 (L5 I5) residual 25; breach ACKNOWLEDGED"]
          setup_api_calls:
            - { call: "POST /categories", payload: { name: "CAPX" }, as: RiskManager, captures: { cat_id: $.data.id } }
            - { call: "POST /appetite-statements", payload: { category_id: "${cat_id}", tolerance_score: 5, acceptance_cap_score: 20, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }, as: RiskManager, as_user_id: "user_rm_1", captures: { app_id: $.data.id } }
            - { call: "POST /appetite-statements/${app_id}/approve", payload: {}, as: RiskManager, as_user_id: "user_rm_2" }
            - { call: "POST /risks", payload: { category_id: "${cat_id}", title: "R", owner_user_id: "user_owner_1" }, as: RiskOwner, as_user_id: "user_owner_1", captures: { risk_id: $.data.id } }
            - { call: "POST /risks/${risk_id}/submit", payload: {}, as: RiskOwner, as_user_id: "user_owner_1" }
            - { call: "GET /risks/${risk_id}", as: RiskOwner, as_user_id: "user_owner_1", captures: { v1: $.data.version } }
            - { call: "POST /risks/${risk_id}/assessments", payload: { kind: "INHERENT", likelihood: 5, impact: 5, expected_risk_version: "${v1}" }, as: RiskOwner, as_user_id: "user_owner_1" }
            - { call: "GET /risks/${risk_id}", as: RiskOwner, as_user_id: "user_owner_1", captures: { v2: $.data.version } }
            - { call: "POST /risks/${risk_id}/assessments", payload: { kind: "RESIDUAL", expected_risk_version: "${v2}" }, as: RiskOwner, as_user_id: "user_owner_1" }
            - { call: "GET /risks/${risk_id}/tolerance-breaches", as: RiskOwner, as_user_id: "user_owner_1", captures: { bid: "$.data[0].id" } }
            - { call: "POST /tolerance-breaches/${bid}/acknowledge", payload: {}, as: RiskOwner, as_user_id: "user_owner_1" }
          trigger:
            - { call: "POST /tolerance-breaches/${bid}/accept", payload: { rationale: "too hot", review_by: "2026-12-31T00:00:00Z" }, as: RiskManager, as_user_id: "user_rm_1", captures: { err: $.data.error_id } }
          assert:
            - "captured err == ERR_ACCEPTANCE_CAP_EXCEEDED, HTTP 422 (residual 25 > cap 20)"

      - name: kri_observation_on_draft_kri_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_KRI_NOT_ACTIVE]"]
        distinguishing_aspect: "Observations require lifecycle ACTIVE; a DRAFT KRI rejects with ERR_KRI_NOT_ACTIVE 409."
        test_recipe:
          setup: ["category; KRI created, never activated"]
          setup_api_calls:
            - { call: "POST /categories", payload: { name: "DK" }, as: RiskManager, captures: { cat_id: $.data.id } }
            - { call: "POST /kris", payload: { category_id: "${cat_id}", name: "Dormant", direction: "ABOVE", amber_threshold: 50, red_threshold: 75, min_observation_interval_days: 0 }, as: RiskManager, as_user_id: "user_rm_1", captures: { kri_id: $.data.id } }
          trigger:
            - { call: "POST /kris/${kri_id}/observations", payload: { observed_value: 10, observed_at: "2026-08-01T00:00:00Z" }, as: RiskManager, as_user_id: "user_rm_1", captures: { err: $.data.error_id } }
          assert:
            - "captured err == ERR_KRI_NOT_ACTIVE, HTTP 409"

      - name: category_cycle_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_CATEGORY_CYCLE]", "entities.TaxonomyCategory.fields.parent_category_id"]
        distinguishing_aspect: "Graph constraint on the self-referential taxonomy: reparenting a root under its own grandchild closes a cycle and is rejected; reparenting under a sibling subtree succeeds."
        test_recipe:
          setup: ["taxonomy Root -> Child -> Grandchild, plus Sibling under Root"]
          setup_api_calls:
            - { call: "POST /categories", payload: { name: "Root" }, as: RiskManager, captures: { root: $.data.id } }
            - { call: "POST /categories", payload: { name: "Child", parent_category_id: "${root}" }, as: RiskManager, captures: { child: $.data.id } }
            - { call: "POST /categories", payload: { name: "Grandchild", parent_category_id: "${child}" }, as: RiskManager, captures: { grandchild: $.data.id } }
            - { call: "POST /categories", payload: { name: "Sibling", parent_category_id: "${root}" }, as: RiskManager, captures: { sibling: $.data.id } }
          trigger:
            - { call: "PATCH /categories/${root}", payload: { parent_category_id: "${grandchild}" }, as: RiskManager, captures: { err: $.data.error_id } }
            - { call: "PATCH /categories/${child}", payload: { parent_category_id: "${sibling}" }, as: RiskManager }
          assert:
            - "Reparent Root under Grandchild: captured err == ERR_CATEGORY_CYCLE, HTTP 422"
            - "Reparent Child under Sibling succeeds: TaxonomyCategory.${child}.parent_category_id == ${sibling}"
            - "GET /categories/${sibling}/subcategories now contains ${child}"

  # ===========================================================================
  - section: rbac
    instances:
      - name: auditor_write_attempt_forbidden
        claim_type: rbac_denial
        grounds: ["roles[InternalAuditor]"]
        distinguishing_aspect: "InternalAuditor holds only shared read operations; a write (POST /risks) is denied ERR_FORBIDDEN while its GETs succeed."
        test_recipe:
          setup: ["category with one risk"]
          setup_api_calls:
            - { call: "POST /categories", payload: { name: "AU" }, as: RiskManager, captures: { cat_id: $.data.id } }
            - { call: "POST /risks", payload: { category_id: "${cat_id}", title: "R", owner_user_id: "user_owner_1" }, as: RiskOwner, as_user_id: "user_owner_1", captures: { risk_id: $.data.id } }
          trigger:
            - { call: "POST /risks", payload: { category_id: "${cat_id}", title: "AuditWrite", owner_user_id: "user_owner_1" }, as: InternalAuditor, as_user_id: "user_aud_1", captures: { err: $.data.error_id } }
            - { call: "GET /risks/${risk_id}", as: InternalAuditor, as_user_id: "user_aud_1" }
          assert:
            - "Write: captured err == ERR_FORBIDDEN, HTTP 403"
            - "Read: GET succeeds, Risk.${risk_id}.id == ${risk_id}"

