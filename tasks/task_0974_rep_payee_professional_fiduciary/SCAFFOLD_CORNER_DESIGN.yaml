  # =====================================================================
  - section: cross_cutting_layers
    instances:
      - name: occ_stale_version_rejected_and_fresh_accepted
        claim_type: stale_version_rejection
        grounds: ["concurrency_rules[budget-plan-create-stale-client]", "errors[ERR_STALE_VERSION]", endpoints.POST_/budget-plans]

        distinguishing_aspect: "OCC on Client.version: after plan P1 creation bumps the client version, a second create carrying the pre-P1 version is rejected with 412 ERR_STALE_VERSION; re-reading and resubmitting with the fresh version succeeds and supersedes P1."
        test_recipe:
          setup: ["ACTIVE client (version 2 after activate)"]
          setup_api_calls:
            - { call: "POST /clients", payload: { legal_name: "Occ Oscar", date_of_birth: "1985-06-06", ssn_last4: "3233", county_of_residence: "TRV", medicaid_enrolled: false }, as: FiduciaryAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /benefit-entitlements", payload: { client_id: "${c_id}", claim_type: "SSI", monthly_benefit_cents: 80000, effective_start_date: "2026-01-01" }, as: FiduciaryAdmin, captures: { e_id: $.data.id } }
            - { call: "POST /benefit-entitlements/${e_id}/verify", payload: {}, as: FiduciaryAdmin }
            - { call: "POST /clients/${c_id}/activate", payload: {}, as: FiduciaryAdmin }
            - { call: "GET /clients/${c_id}", payload: {}, as: FiduciaryAdmin, captures: { v_stale: $.data.version } }
            - { call: "POST /budget-plans", payload: { client_id: "${c_id}", period_month: "2026-06", source_benefit_cents: 100000, lines: [{ category: "HOUSING", percent: 100 }], expected_client_version: "${v_stale}" }, as: CaseManager, as_user_id: "cm-1", captures: { p1_id: $.data.id } }
          trigger:
            - { call: "POST /budget-plans", payload: { client_id: "${c_id}", period_month: "2026-06", source_benefit_cents: 120000, lines: [{ category: "HOUSING", percent: 100 }], expected_client_version: "${v_stale}" }, as: CaseManager, as_user_id: "cm-1", captures: { err: $.data.error_id } }
            - { call: "GET /clients/${c_id}", payload: {}, as: FiduciaryAdmin, captures: { v_fresh: $.data.version } }
            - { call: "POST /budget-plans", payload: { client_id: "${c_id}", period_month: "2026-06", source_benefit_cents: 120000, lines: [{ category: "HOUSING", percent: 100 }], expected_client_version: "${v_fresh}" }, as: CaseManager, as_user_id: "cm-1", captures: { p2_id: $.data.id } }
            - { call: "GET /budget-plans/${p1_id}", payload: {}, as: CaseManager, captures: { p1_st: $.data.status, p1_sup: $.data.superseded_by_plan_id } }
          assert:
            - "err == ERR_STALE_VERSION (http 412) for the stale expected_client_version"
            - "v_fresh == v_stale + 1 (plan creation bumped Client.version exactly once; the 412 attempt bumped nothing)"
            - "Fresh create succeeds: p2_id is a UUID; p1_st == SUPERSEDED and p1_sup == ${p2_id}"

      - name: court_order_auto_expiry_via_clock
