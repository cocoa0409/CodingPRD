            - "duplicate basis: HTTP 422 with error_id ERR_DUPLICATE_DISPUTE_BASIS even though the 2026-08-04 slot overlaps nothing"
            - "the refusal is not a capacity error: only one unresolved slot exists and concurrent_dispute_capacity is 2"
