scaffold_corner_design:
  - section: entities
    instances:
      - name: candidate_creation_applies_system_defaults
        claim_type: creation_defaults
        grounds: [entities.Candidate, endpoints.POST /licensure/candidates]
        distinguishing_aspect: "A fresh candidate carries education_status NONE, experience_status NOT_STARTED, exam_status NOT_AUTHORIZED, record_standing CLEAR, certificate_eligible false, version 1, server-minted id/created_at."
        test_recipe:
          setup: ["jurisdiction J1 exists"]
          setup_api_calls:
            - { call: "POST /licensure/jurisdictions", payload: { code: "J1", name: "Board One" }, as: NcarbAdministrator }
          trigger:
            - { call: "POST /licensure/candidates", payload: { email: "c1@x.com", full_name: "Cand One", password: "pw", home_jurisdiction_code: "J1" }, as: Anonymous, captures: { cand_id: $.data.id } }
          assert:
            - "response 201; Candidate.education_status == NONE, experience_status == NOT_STARTED, exam_status == NOT_AUTHORIZED"
            - "Candidate.record_standing == CLEAR and certificate_eligible == false"
            - "Candidate.version == 1 and id is a server-minted UUID"
      - name: candidate_register_with_unknown_jurisdiction_returns_422
        claim_type: violation_to_error
        grounds: ["validations[priority=3]", "errors[ERR_JURISDICTION_UNKNOWN]"]
        distinguishing_aspect: "home_jurisdiction_code that matches no Jurisdiction.code fails referential resolution with ERR_JURISDICTION_UNKNOWN (422), not a generic 400."
        test_recipe:
          setup: ["no jurisdictions registered"]
          setup_api_calls: []
          trigger:
            - { call: "POST /licensure/candidates", payload: { email: "c1@x.com", full_name: "Cand One", password: "pw", home_jurisdiction_code: "ZZ" }, as: Anonymous, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_JURISDICTION_UNKNOWN and http status 422"
            - "no candidate created: a subsequent register with a valid jurisdiction succeeds from empty state"
      - name: candidate_register_missing_email_returns_invalid_request
        claim_type: required_fields
        grounds: ["validations[priority=8]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required input field email yields ERR_INVALID_REQUEST (400) before any state change."
        test_recipe:
          setup: ["jurisdiction J1 exists"]
          setup_api_calls:
            - { call: "POST /licensure/jurisdictions", payload: { code: "J1", name: "Board One" }, as: NcarbAdministrator }
          trigger:
            - { call: "POST /licensure/candidates", payload: { full_name: "Cand One", password: "pw", home_jurisdiction_code: "J1" }, as: Anonymous, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST with http status 400"
      - name: candidate_register_client_supplied_system_fields_input_ignored
        claim_type: system_fields
        grounds: [entities.Candidate, response_envelope]
        distinguishing_aspect: "Client-supplied id, created_at, and version in the register payload are ignored; the server mints its own values."
        test_recipe:
          setup: ["jurisdiction J1 exists"]
          setup_api_calls:
            - { call: "POST /licensure/jurisdictions", payload: { code: "J1", name: "Board One" }, as: NcarbAdministrator }
          trigger:
            - { call: "POST /licensure/candidates", payload: { email: "c1@x.com", full_name: "Cand One", password: "pw", home_jurisdiction_code: "J1" }, as: Anonymous, captures: { cand_id: $.data.id, cand_v: $.data.version } }
          assert:
            - "captured cand_id != any client-supplied value and cand_v == 1"
            - "created_at equals the logical clock timestamp, not a client value"
      - name: jurisdiction_creation_applies_national_defaults
        claim_type: defaults
        grounds: [entities.Jurisdiction.fields]
        distinguishing_aspect: "Omitting every optional override yields requires_supplemental_exam false, min_total_experience_hours 3740, ce_hours_required 24, ce_hsw_hours_required 12, ce_carry_over_allowed false."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /licensure/jurisdictions", payload: { code: "J1", name: "Board One" }, as: NcarbAdministrator, captures: { j1_id: $.data.id } }
          assert:
            - "Jurisdiction.requires_supplemental_exam == false and ce_carry_over_allowed == false"
            - "min_total_experience_hours == 3740, ce_hours_required == 24, ce_hsw_hours_required == 12"
      - name: jurisdiction_duplicate_code_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_JURISDICTION_CODE_EXISTS]"]
        distinguishing_aspect: "Second jurisdiction with an already-registered code is rejected with ERR_JURISDICTION_CODE_EXISTS (409)."
        test_recipe:
          setup: ["jurisdiction J1 registered"]
          setup_api_calls:
            - { call: "POST /licensure/jurisdictions", payload: { code: "J1", name: "Board One" }, as: NcarbAdministrator }
          trigger:
            - { call: "POST /licensure/jurisdictions", payload: { code: "J1", name: "Board One Duplicate" }, as: NcarbAdministrator, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_JURISDICTION_CODE_EXISTS with http status 409"
      - name: evaluation_alternative_path_credit_boundary
        claim_type: type_constraints
        grounds: [entities.EducationEvaluation.fields.semester_credit_hours, "errors[ERR_ALTERNATIVE_CREDITS_INSUFFICIENT]"]
        distinguishing_aspect: "ALTERNATIVE_PATH requires semester_credit_hours >= 64: exactly 64 is accepted (201), 63 is rejected with ERR_ALTERNATIVE_CREDITS_INSUFFICIENT (422)."
        test_recipe:
          setup: ["jurisdiction J1; candidates C1 and C2 registered"]
          setup_api_calls:
            - { call: "POST /licensure/jurisdictions", payload: { code: "J1", name: "Board One" }, as: NcarbAdministrator }
            - { call: "POST /licensure/candidates", payload: { email: "c1@x.com", full_name: "Cand One", password: "pw", home_jurisdiction_code: "J1" }, as: Anonymous, captures: { c1_id: $.data.id } }
            - { call: "POST /licensure/candidates", payload: { email: "c2@x.com", full_name: "Cand Two", password: "pw", home_jurisdiction_code: "J1" }, as: Anonymous, captures: { c2_id: $.data.id } }
          trigger:
            - { call: "POST /licensure/candidates/${c2_id}/education-evaluations", payload: { path_type: "ALTERNATIVE_PATH", institution_name: "Night College", semester_credit_hours: 63 }, as: Candidate, as_user_id: "${c2_id}", captures: { err: $.data.error_id } }
            - { call: "POST /licensure/candidates/${c1_id}/education-evaluations", payload: { path_type: "ALTERNATIVE_PATH", institution_name: "Night College", semester_credit_hours: 64 }, as: Candidate, as_user_id: "${c1_id}" }
          assert:
            - "63 credits: error_id == ERR_ALTERNATIVE_CREDITS_INSUFFICIENT"
            - "64 credits: evaluation created with status SUBMITTED (boundary inclusive)"
      - name: evaluation_second_open_evaluation_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=4]", "errors[ERR_EVALUATION_ALREADY_OPEN]"]
        distinguishing_aspect: "A candidate may hold only one SUBMITTED evaluation; a second create while the first awaits review fails with ERR_EVALUATION_ALREADY_OPEN (409)."
        test_recipe:
          setup: ["jurisdiction J1; candidate C with one SUBMITTED evaluation"]
          setup_api_calls:
            - { call: "POST /licensure/jurisdictions", payload: { code: "J1", name: "Board One" }, as: NcarbAdministrator }
            - { call: "POST /licensure/candidates", payload: { email: "c1@x.com", full_name: "Cand One", password: "pw", home_jurisdiction_code: "J1" }, as: Anonymous, captures: { cand_id: $.data.id } }
            - { call: "POST /licensure/candidates/${cand_id}/education-evaluations", payload: { path_type: "ACCREDITED_DEGREE", institution_name: "State U", semester_credit_hours: 150 }, as: Candidate, as_user_id: "${cand_id}" }
          trigger:
            - { call: "POST /licensure/candidates/${cand_id}/education-evaluations", payload: { path_type: "ALTERNATIVE_PATH", institution_name: "Night College", semester_credit_hours: 64 }, as: Candidate, as_user_id: "${cand_id}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_EVALUATION_ALREADY_OPEN with http status 409"
            - "GET /licensure/candidates/${cand_id}/education-evaluations still lists exactly 1 evaluation"
      - name: get_unknown_candidate_returns_not_found
        claim_type: not_found
        grounds: ["validations[priority=3]", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "Reading a well-formed but nonexistent candidate id returns ERR_NOT_FOUND (404), exercising the existence tier."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /licensure/candidates/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: {}, as: NcarbAdministrator, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_NOT_FOUND with http status 404"
  - section: calculations
    instances:
      - name: credit_tier_full_credit_at_exact_8_months
        claim_type: boundary_edge
        grounds: [calculations.experience_credit_tiering]
        distinguishing_aspect: "Submit on exactly work_period_end + 8 calendar months (2026-01-15 -> 2026-09-15) is inside the full-credit window (inclusive <=), stamping credit_pct 100."
        test_recipe:
          setup: ["jurisdiction J1; candidate C; supervisor S; R1 40h PPD with work_period_end 2026-01-15; clock 2026-09-15"]
          setup_api_calls:
            - { call: "POST /licensure/_clock/set_current_utc", payload: { to_iso8601: "2026-09-15T00:00:00Z" }, as: NcarbAdministrator }
            - { call: "POST /licensure/jurisdictions", payload: { code: "J1", name: "Board One" }, as: NcarbAdministrator }
            - { call: "POST /licensure/candidates", payload: { email: "c1@x.com", full_name: "Cand One", password: "pw", home_jurisdiction_code: "J1" }, as: Anonymous, captures: { cand_id: $.data.id } }
            - { call: "POST /licensure/supervisors", payload: { full_name: "Sup One", license_number: "LIC-1", jurisdiction_code: "J1" }, as: NcarbAdministrator, captures: { sup_id: $.data.id } }
            - { call: "POST /licensure/experience-reports", payload: { candidate_id: "${cand_id}", supervisor_id: "${sup_id}", practice_area: "PROJECT_PLANNING_DESIGN", hours: 40, work_period_start: "2026-01-02", work_period_end: "2026-01-15" }, as: Candidate, as_user_id: "${cand_id}", captures: { r1_id: $.data.id } }
          trigger:
            - { call: "POST /licensure/experience-reports/${r1_id}/submit", payload: {}, as: Candidate, as_user_id: "${cand_id}" }
          assert:
            - "ExperienceReport.${r1_id}.credit_pct == 100 (boundary day included in full-credit window)"
      - name: credit_tier_half_credit_value
        claim_type: correct_result
        grounds: [calculations.experience_credit_tiering]
        distinguishing_aspect: "A report submitted 14 months after work end (inside the 60-month horizon, past the 8-month window) credits exactly 50%: 40 hours -> credited_hours 20 at verify."
        test_recipe:
          setup: ["jurisdiction J1; candidate C; supervisor S; R1 40h PPD work ending 2025-06-30; clock 2026-09-01"]
          setup_api_calls:
            - { call: "POST /licensure/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: NcarbAdministrator }
            - { call: "POST /licensure/jurisdictions", payload: { code: "J1", name: "Board One" }, as: NcarbAdministrator }
            - { call: "POST /licensure/candidates", payload: { email: "c1@x.com", full_name: "Cand One", password: "pw", home_jurisdiction_code: "J1" }, as: Anonymous, captures: { cand_id: $.data.id } }
            - { call: "POST /licensure/supervisors", payload: { full_name: "Sup One", license_number: "LIC-1", jurisdiction_code: "J1" }, as: NcarbAdministrator, captures: { sup_id: $.data.id } }
            - { call: "POST /licensure/experience-reports", payload: { candidate_id: "${cand_id}", supervisor_id: "${sup_id}", practice_area: "PROJECT_PLANNING_DESIGN", hours: 40, work_period_start: "2025-06-01", work_period_end: "2025-06-30" }, as: Candidate, as_user_id: "${cand_id}", captures: { r1_id: $.data.id } }
            - { call: "POST /licensure/experience-reports/${r1_id}/submit", payload: {}, as: Candidate, as_user_id: "${cand_id}" }
          trigger:
            - { call: "POST /licensure/experience-reports/${r1_id}/verify", payload: {}, as: Supervisor, as_user_id: "${sup_id}" }
          assert:
            - "ExperienceReport.${r1_id}.credit_pct == 50"
            - "ExperienceReport.${r1_id}.credited_hours == 20 (round_half_up(40 * 0.5))"
      - name: experience_older_than_60_months_rejected
        claim_type: boundary_edge
        grounds: [calculations.experience_credit_tiering, "errors[ERR_EXPERIENCE_TOO_OLD]"]
        distinguishing_aspect: "Submit at work_period_end + 60 months exactly is accepted (50% tier); one day past the horizon is rejected with ERR_EXPERIENCE_TOO_OLD and no state change."
        test_recipe:
          setup: ["jurisdiction J1; candidate C; supervisor S; clock 2026-09-01; R1 work ending 2021-09-01 (boundary), R2 work ending 2021-08-15 (past horizon)"]
          setup_api_calls:
            - { call: "POST /licensure/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: NcarbAdministrator }
            - { call: "POST /licensure/jurisdictions", payload: { code: "J1", name: "Board One" }, as: NcarbAdministrator }
            - { call: "POST /licensure/candidates", payload: { email: "c1@x.com", full_name: "Cand One", password: "pw", home_jurisdiction_code: "J1" }, as: Anonymous, captures: { cand_id: $.data.id } }
            - { call: "POST /licensure/supervisors", payload: { full_name: "Sup One", license_number: "LIC-1", jurisdiction_code: "J1" }, as: NcarbAdministrator, captures: { sup_id: $.data.id } }
            - { call: "POST /licensure/experience-reports", payload: { candidate_id: "${cand_id}", supervisor_id: "${sup_id}", practice_area: "PRACTICE_MANAGEMENT", hours: 40, work_period_start: "2021-08-02", work_period_end: "2021-09-01" }, as: Candidate, as_user_id: "${cand_id}", captures: { r1_id: $.data.id } }
            - { call: "POST /licensure/experience-reports", payload: { candidate_id: "${cand_id}", supervisor_id: "${sup_id}", practice_area: "PROJECT_MANAGEMENT", hours: 40, work_period_start: "2021-06-01", work_period_end: "2021-07-01" }, as: Candidate, as_user_id: "${cand_id}", captures: { r2_id: $.data.id } }
          trigger:
            - { call: "POST /licensure/experience-reports/${r1_id}/submit", payload: {}, as: Candidate, as_user_id: "${cand_id}" }
            - { call: "POST /licensure/experience-reports/${r2_id}/submit", payload: {}, as: Candidate, as_user_id: "${cand_id}", captures: { err: $.data.error_id } }
          assert:
            - "R1 (boundary, exactly +60 months): SUBMITTED with credit_pct == 50"
            - "R2 (one day-past-horizon semantics): error_id == ERR_EXPERIENCE_TOO_OLD (422), stays DRAFT"
      - name: attempt_window_365_day_boundary
        claim_type: boundary_edge
        grounds: [calculations.retake_eligibility, "errors[ERR_ATTEMPT_LIMIT_EXCEEDED]"]
        distinguishing_aspect: "The 3-per-365-days window uses a strict > cutoff: with failures on 2026-10-01, 2026-12-01, 2027-01-30, a sitting on 2027-09-30 counts all three (blocked) while 2027-10-01 drops the oldest (allowed)."
        test_recipe:
          setup: ["candidate C with authorization; division PCM FAILED three times at the listed sitting dates"]
          setup_api_calls:
            - { call: "POST /licensure/_clock/set_current_utc", payload: { to_iso8601: "2026-09-15T00:00:00Z" }, as: NcarbAdministrator }
            - { call: "POST /licensure/jurisdictions", payload: { code: "J1", name: "Board One" }, as: NcarbAdministrator }
            - { call: "POST /licensure/candidates", payload: { email: "c1@x.com", full_name: "Cand One", password: "pw", home_jurisdiction_code: "J1" }, as: Anonymous, captures: { cand_id: $.data.id } }
            - { call: "POST /licensure/candidates/${cand_id}/exam-authorizations", payload: { jurisdiction_code: "J1" }, as: BoardAdministrator }
            - { call: "GET /licensure/candidates/${cand_id}/exam-progress", payload: {}, as: Candidate, as_user_id: "${cand_id}", captures: { div_pcm: "$.data[2].id" } }
            - { call: "POST /licensure/exam-progress/${div_pcm}/schedule", payload: { scheduled_date: "2026-10-01" }, as: Candidate, as_user_id: "${cand_id}" }
            - { call: "POST /licensure/_clock/set_current_utc", payload: { to_iso8601: "2026-10-01T00:00:00Z" }, as: NcarbAdministrator }
            - { call: "POST /licensure/exam-progress/${div_pcm}/report-score", payload: { result: "FAIL", scaled_score: 55 }, as: NcarbAdministrator }
            - { call: "POST /licensure/exam-progress/${div_pcm}/schedule", payload: { scheduled_date: "2026-12-01" }, as: Candidate, as_user_id: "${cand_id}" }
            - { call: "POST /licensure/_clock/set_current_utc", payload: { to_iso8601: "2026-12-01T00:00:00Z" }, as: NcarbAdministrator }
            - { call: "POST /licensure/exam-progress/${div_pcm}/report-score", payload: { result: "FAIL", scaled_score: 56 }, as: NcarbAdministrator }
            - { call: "POST /licensure/exam-progress/${div_pcm}/schedule", payload: { scheduled_date: "2027-01-30" }, as: Candidate, as_user_id: "${cand_id}" }
            - { call: "POST /licensure/_clock/set_current_utc", payload: { to_iso8601: "2027-01-30T00:00:00Z" }, as: NcarbAdministrator }
            - { call: "POST /licensure/exam-progress/${div_pcm}/report-score", payload: { result: "FAIL", scaled_score: 57 }, as: NcarbAdministrator }
          trigger:
            - { call: "POST /licensure/exam-progress/${div_pcm}/schedule", payload: { scheduled_date: "2027-09-30" }, as: Candidate, as_user_id: "${cand_id}", captures: { err: $.data.error_id } }
            - { call: "POST /licensure/exam-progress/${div_pcm}/schedule", payload: { scheduled_date: "2027-10-01" }, as: Candidate, as_user_id: "${cand_id}" }
          assert:
            - "2027-09-30 sitting: error_id == ERR_ATTEMPT_LIMIT_EXCEEDED (3 attempts in the window: cutoff 2026-09-30, 2026-10-01 > cutoff counts)"
            - "2027-10-01 sitting: schedule succeeds (cutoff 2026-10-01 excluded by strict >, only 2 attempts count)"
            - "ExamDivisionProgress.${div_pcm}.status == SCHEDULED with scheduled_date == 2027-10-01"
      - name: renewal_window_boundary_and_carry_over_cap
        claim_type: boundary_edge
        grounds: [calculations.ce_period_compliance, "errors[ERR_RENEWAL_WINDOW_NOT_OPEN]", "errors[ERR_CE_HOURS_INSUFFICIENT]"]
        distinguishing_aspect: "Two pinned behaviors in one renewal saga: the renewal window opens exactly at period_end - 60 days (2028-08-06 rejected, 2028-08-07 accepted), and carry-over is capped at 12 hours so a 16-hour prior excess contributes only 12 (proven because 11 + 12 = 23 fails where an uncapped 11 + 16 = 27 would pass)."
        test_recipe:
          setup:
            - "certificate CERT issued 2026-10-06 under J1 (defaults 24/12); period 1 logged 40h (24 HSW true entry + 16 non-HSW)"
            - "J1 ce_carry_over_allowed flipped to true before period 2"
            - "period 2 logs only 11h HSW before the first renew attempt, then 1 more hour"
          setup_api_calls:
            - { call: "POST /licensure/jurisdictions", payload: { code: "J1", name: "Board One" }, as: NcarbAdministrator, captures: { j1_id: $.data.id, j1_v: $.data.version } }
            - { call: "POST /licensure/candidates", payload: { email: "c1@x.com", full_name: "Cand One", password: "pw", home_jurisdiction_code: "J1" }, as: Anonymous, captures: { cand_id: $.data.id } }
            - { call: "POST /licensure/supervisors", payload: { full_name: "Sup One", license_number: "LIC-1", jurisdiction_code: "J1" }, as: NcarbAdministrator, captures: { sup_id: $.data.id } }
            - { call: "POST /licensure/candidates/${cand_id}/education-evaluations", payload: { path_type: "ACCREDITED_DEGREE", institution_name: "State U", semester_credit_hours: 150 }, as: Candidate, as_user_id: "${cand_id}", captures: { ev_id: $.data.id } }
            - { call: "POST /licensure/education-evaluations/${ev_id}/review", payload: { decision: "SATISFIED" }, as: NcarbAdministrator }
            - { call: "POST /licensure/experience-reports", payload: { candidate_id: "${cand_id}", supervisor_id: "${sup_id}", practice_area: "PRACTICE_MANAGEMENT", hours: 160, work_period_start: "2026-01-05", work_period_end: "2026-01-30" }, as: Candidate, as_user_id: "${cand_id}", captures: { r_pm: $.data.id } }
            - { call: "POST /licensure/experience-reports/${r_pm}/submit", payload: {}, as: Candidate, as_user_id: "${cand_id}" }
            - { call: "POST /licensure/experience-reports/${r_pm}/verify", payload: {}, as: Supervisor, as_user_id: "${sup_id}" }
            - { call: "POST /licensure/experience-reports", payload: { candidate_id: "${cand_id}", supervisor_id: "${sup_id}", practice_area: "PROJECT_MANAGEMENT", hours: 360, work_period_start: "2026-02-02", work_period_end: "2026-03-31" }, as: Candidate, as_user_id: "${cand_id}", captures: { r_pjm: $.data.id } }
            - { call: "POST /licensure/experience-reports/${r_pjm}/submit", payload: {}, as: Candidate, as_user_id: "${cand_id}" }
            - { call: "POST /licensure/experience-reports/${r_pjm}/verify", payload: {}, as: Supervisor, as_user_id: "${sup_id}" }
            - { call: "POST /licensure/experience-reports", payload: { candidate_id: "${cand_id}", supervisor_id: "${sup_id}", practice_area: "PROGRAMMING_ANALYSIS", hours: 260, work_period_start: "2026-04-01", work_period_end: "2026-04-30" }, as: Candidate, as_user_id: "${cand_id}", captures: { r_pa: $.data.id } }
            - { call: "POST /licensure/experience-reports/${r_pa}/submit", payload: {}, as: Candidate, as_user_id: "${cand_id}" }
            - { call: "POST /licensure/experience-reports/${r_pa}/verify", payload: {}, as: Supervisor, as_user_id: "${sup_id}" }
            - { call: "POST /licensure/experience-reports", payload: { candidate_id: "${cand_id}", supervisor_id: "${sup_id}", practice_area: "PROJECT_PLANNING_DESIGN", hours: 1360, work_period_start: "2026-05-01", work_period_end: "2026-06-30" }, as: Candidate, as_user_id: "${cand_id}", captures: { r_ppd: $.data.id } }
            - { call: "POST /licensure/experience-reports/${r_ppd}/submit", payload: {}, as: Candidate, as_user_id: "${cand_id}" }
            - { call: "POST /licensure/experience-reports/${r_ppd}/verify", payload: {}, as: Supervisor, as_user_id: "${sup_id}" }
            - { call: "POST /licensure/experience-reports", payload: { candidate_id: "${cand_id}", supervisor_id: "${sup_id}", practice_area: "PROJECT_DEVELOPMENT_DOCUMENTATION", hours: 1520, work_period_start: "2026-07-01", work_period_end: "2026-07-31" }, as: Candidate, as_user_id: "${cand_id}", captures: { r_pdd: $.data.id } }
            - { call: "POST /licensure/experience-reports/${r_pdd}/submit", payload: {}, as: Candidate, as_user_id: "${cand_id}" }
            - { call: "POST /licensure/experience-reports/${r_pdd}/verify", payload: {}, as: Supervisor, as_user_id: "${sup_id}" }
            - { call: "POST /licensure/experience-reports", payload: { candidate_id: "${cand_id}", supervisor_id: "${sup_id}", practice_area: "CONSTRUCTION_EVALUATION", hours: 80, work_period_start: "2026-08-03", work_period_end: "2026-08-14" }, as: Candidate, as_user_id: "${cand_id}", captures: { r_ce: $.data.id } }
            - { call: "POST /licensure/experience-reports/${r_ce}/submit", payload: {}, as: Candidate, as_user_id: "${cand_id}" }
            - { call: "POST /licensure/experience-reports/${r_ce}/verify", payload: {}, as: Supervisor, as_user_id: "${sup_id}" }
            - { call: "POST /licensure/candidates/${cand_id}/exam-authorizations", payload: { jurisdiction_code: "J1" }, as: BoardAdministrator }
