              as: SubscriptionOpsAgent
              captures: { grp_b: "$.data.id" }
            - call: "GET /paywall/offer-plans/${plan_ib}"
              payload: {}
              as: SubscriptionOpsAgent
              captures: { plan_ib_v3: "$.data.version" }
            - call: "POST /paywall/subscriptions"
