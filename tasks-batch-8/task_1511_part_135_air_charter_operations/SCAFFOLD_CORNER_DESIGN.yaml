          trigger:
            - { call: "POST /charter/quote-legs", payload: { trip_request_id: "${trip_la}", seq_no: 2, leg_type: "POSITIONING", origin_icao: "KTEB", destination_icao: "KLAX", block_minutes: 30, fuel_stop: false }, as: SalesAgent, captures: { err_la: $.data.error_id } }
          assert: ["HTTP 409 with error_id == ERR_TRIP_NOT_QUOTE_DRAFT"]

      - name: delete_leg_quote_draft_ok
        claim_type: valid_transition
        grounds: [entities.QuoteLeg]
        distinguishing_aspect: "DELETE on a QUOTE_DRAFT trip's leg succeeds (204) and the leg list becomes empty."
        test_recipe:
          setup: ["trip QUOTE_DRAFT with one leg"]
          setup_api_calls:
            - { call: "POST /charter/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: OpsAdmin }
            - { call: "POST /charter/trip-requests", payload: { customer_name: "Cust DL", customer_email: "dl@x.com", requested_category: "LIGHT_JET", origin_icao: "KLAX", destination_icao: "KTEB", departure_at: "2026-08-10T10:00:00Z", passenger_count: 0, international: false }, as: SalesAgent, captures: { trip_dl: $.data.id } }
            - { call: "POST /charter/quote-legs", payload: { trip_request_id: "${trip_dl}", seq_no: 1, leg_type: "REVENUE", origin_icao: "KLAX", destination_icao: "KTEB", block_minutes: 60, fuel_stop: false }, as: SalesAgent, captures: { leg_dl: $.data.id } }
          trigger:
            - { call: "DELETE /charter/quote-legs/${leg_dl}", payload: {}, as: SalesAgent }
            - { call: "GET /charter/trip-requests/${trip_dl}/quote-legs", payload: {}, as: SalesAgent }
          assert:
            - "DELETE returns 204"
            - "GET /charter/trip-requests/${trip_dl}/quote-legs returns total_count == 0"

      - name: requote_cycle_ok
        claim_type: valid_transition
        grounds: [state_machines.TripRequest.QUOTED_to_QUOTE_DRAFT]
        excluded_because:
          difficulty_instance: trip_request_requote_cycle
          rationale: "QUOTED -> QUOTE_DRAFT -> QUOTED cycle asserted there with version and posture checks."

      - name: completion_cascade_effects
        claim_type: side_effect
        grounds: [state_machines.TripRequest.DISPATCHED_to_COMPLETED]
        excluded_because:
          difficulty_instance: flight_log_final_leg_cascade
          rationale: "Completion side effects (final price, statement creation, aircraft hold, tentative release) asserted there."

      - name: ground_cascade_effects
        claim_type: side_effect
        grounds: [state_machines.Aircraft]
        excluded_because:
          difficulty_instance: ground_aircraft_cascade
          rationale: "Ground cascade (assignments released, trips reverted) asserted there."

  # ============================================================ calculations
  - section: calculations
    instances:
      - name: quote_intl_and_fuel_stop_constants
        claim_type: constants_applied
        grounds: [calculations.quote_price]
        distinguishing_aspect: "MIDSIZE_JET rate 400000/h, one 120min REV leg with fuel_stop=true, international=true: 800000 legs + 64000 surcharge + 15000 stop fee + 250000 intl fee = 1129000; deposit 282250."
        test_recipe:
          setup: ["clock 2026-08-01T00:00:00Z; MIDSIZE_JET trip dep 2026-08-12T10:00:00Z, 2 pax, international, one REV leg 120 with fuel_stop"]
          setup_api_calls:
            - { call: "POST /charter/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: OpsAdmin }
            - { call: "POST /charter/trip-requests", payload: { customer_name: "Cust MS", customer_email: "ms@x.com", requested_category: "MIDSIZE_JET", origin_icao: "KLAX", destination_icao: "MMCZ", departure_at: "2026-08-12T10:00:00Z", passenger_count: 2, international: true }, as: SalesAgent, captures: { trip_ms: $.data.id } }
            - { call: "POST /charter/quote-legs", payload: { trip_request_id: "${trip_ms}", seq_no: 1, leg_type: "REVENUE", origin_icao: "KLAX", destination_icao: "MMCZ", block_minutes: 120, fuel_stop: true }, as: SalesAgent }
          trigger:
            - { call: "POST /charter/trip-requests/${trip_ms}/quote", payload: {}, as: SalesAgent, captures: { ms_q: $.data.quoted_total_cents, ms_dep: $.data.deposit_required_cents } }
          assert:
            - "TripRequest.${trip_ms}.quoted_total_cents == 1129000"
            - "TripRequest.${trip_ms}.deposit_required_cents == 282250"

      - name: payment_posture_progression
        claim_type: correct_result
        grounds: [calculations.payment_posture, entities.TripRequest.fields.payment_posture]
        distinguishing_aspect: "Posture derived per payment event: UNPAID at create, DEPOSIT_PAID after book (67500 < 270000), PAID_IN_FULL after the 202500 balance."
        test_recipe:
          setup: ["clock; trip leg REV 60 QUOTED 270000"]
          setup_api_calls:
            - { call: "POST /charter/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: OpsAdmin }
            - { call: "POST /charter/trip-requests", payload: { customer_name: "Cust PP", customer_email: "pp@x.com", requested_category: "LIGHT_JET", origin_icao: "KLAX", destination_icao: "KTEB", departure_at: "2026-08-10T10:00:00Z", passenger_count: 0, international: false }, as: SalesAgent, captures: { trip_pp: $.data.id, pp0: $.data.payment_posture } }
            - { call: "POST /charter/quote-legs", payload: { trip_request_id: "${trip_pp}", seq_no: 1, leg_type: "REVENUE", origin_icao: "KLAX", destination_icao: "KTEB", block_minutes: 60, fuel_stop: false }, as: SalesAgent }
            - { call: "POST /charter/trip-requests/${trip_pp}/quote", payload: {}, as: SalesAgent }
          trigger:
            - { call: "POST /charter/trip-requests/${trip_pp}/book", payload: { deposit_cents: 67500 }, as: SalesAgent, captures: { pp1: $.data.payment_posture, pp1_col: $.data.collected_cents } }
            - { call: "POST /charter/payments", payload: { trip_request_id: "${trip_pp}", payment_type: "BALANCE", amount_cents: 202500 }, as: SalesAgent }
            - { call: "GET /charter/trip-requests/${trip_pp}", payload: {}, as: SalesAgent, captures: { pp2: $.data.payment_posture, pp2_col: $.data.collected_cents } }
          assert:
            - "At create: payment_posture == UNPAID"
            - "After book: payment_posture == DEPOSIT_PAID and collected_cents == 67500"
            - "After balance: payment_posture == PAID_IN_FULL and collected_cents == 270000"

      - name: overpayment_rejected
        claim_type: boundary_edge
        grounds: [calculations.payment_posture, "errors[ERR_OVERPAYMENT]"]
        distinguishing_aspect: "A BALANCE of even 1 cent over the remaining amount is rejected once collected == quoted_total."
        test_recipe:
          setup: ["trip leg REV 60 QUOTED 270000, BOOKED 67500 + BALANCE 202500 (collected 270000)"]
          setup_api_calls:
            - { call: "POST /charter/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: OpsAdmin }
            - { call: "POST /charter/trip-requests", payload: { customer_name: "Cust OP", customer_email: "op@x.com", requested_category: "LIGHT_JET", origin_icao: "KLAX", destination_icao: "KTEB", departure_at: "2026-08-10T10:00:00Z", passenger_count: 0, international: false }, as: SalesAgent, captures: { trip_op: $.data.id } }
            - { call: "POST /charter/quote-legs", payload: { trip_request_id: "${trip_op}", seq_no: 1, leg_type: "REVENUE", origin_icao: "KLAX", destination_icao: "KTEB", block_minutes: 60, fuel_stop: false }, as: SalesAgent }
            - { call: "POST /charter/trip-requests/${trip_op}/quote", payload: {}, as: SalesAgent }
            - { call: "POST /charter/trip-requests/${trip_op}/book", payload: { deposit_cents: 67500 }, as: SalesAgent }
            - { call: "POST /charter/payments", payload: { trip_request_id: "${trip_op}", payment_type: "BALANCE", amount_cents: 202500 }, as: SalesAgent }
          trigger:
            - { call: "POST /charter/payments", payload: { trip_request_id: "${trip_op}", payment_type: "BALANCE", amount_cents: 1 }, as: SalesAgent, captures: { err_op: $.data.error_id } }
          assert: ["HTTP 402 with error_id == ERR_OVERPAYMENT"]

      - name: deposit_below_required_rejected
        claim_type: boundary_edge
        grounds: [calculations.quote_price, "errors[ERR_DEPOSIT_INSUFFICIENT]"]
        distinguishing_aspect: "deposit_required is exactly 67500 for a 270000 quote; 67499 (one cent short) fails the >= comparison."
        test_recipe:
          setup: ["trip leg REV 60 QUOTED 270000"]
          setup_api_calls:
            - { call: "POST /charter/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: OpsAdmin }
            - { call: "POST /charter/trip-requests", payload: { customer_name: "Cust DP", customer_email: "dp@x.com", requested_category: "LIGHT_JET", origin_icao: "KLAX", destination_icao: "KTEB", departure_at: "2026-08-10T10:00:00Z", passenger_count: 0, international: false }, as: SalesAgent, captures: { trip_dp: $.data.id } }
            - { call: "POST /charter/quote-legs", payload: { trip_request_id: "${trip_dp}", seq_no: 1, leg_type: "REVENUE", origin_icao: "KLAX", destination_icao: "KTEB", block_minutes: 60, fuel_stop: false }, as: SalesAgent }
            - { call: "POST /charter/trip-requests/${trip_dp}/quote", payload: {}, as: SalesAgent }
          trigger:
            - { call: "POST /charter/trip-requests/${trip_dp}/book", payload: { deposit_cents: 67499 }, as: SalesAgent, captures: { err_dp: $.data.error_id } }
          assert: ["HTTP 402 with error_id == ERR_DEPOSIT_INSUFFICIENT"]

      - name: weather_cancel_zero_fee_full_refund
        claim_type: correct_result
        grounds: [calculations.cancellation_refund, entities.WeatherAdvisory]
        distinguishing_aspect: "WEATHER reason with a covering advisory (station == origin, departure inside the closed advisory window) waives the fee entirely regardless of the 48h tier: refund == collected 2052000, posture REFUNDED_FULL."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; trip dep 2026-08-04T00:00:00Z from KLAX, single REV 480, QUOTED 2052000, BOOKED 513000 + BALANCE 1539000"
            - "WeatherAdvisory on KLAX active 2026-08-03T00:00:00Z..2026-08-05T00:00:00Z; clock advanced to 2026-08-02T00:00:00Z"
          setup_api_calls:
            - { call: "POST /charter/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: OpsAdmin }
            - { call: "POST /charter/trip-requests", payload: { customer_name: "Cust WX", customer_email: "wx@x.com", requested_category: "LIGHT_JET", origin_icao: "KLAX", destination_icao: "KTEB", departure_at: "2026-08-04T00:00:00Z", passenger_count: 0, international: false }, as: SalesAgent, captures: { trip_wx: $.data.id } }
            - { call: "POST /charter/quote-legs", payload: { trip_request_id: "${trip_wx}", seq_no: 1, leg_type: "REVENUE", origin_icao: "KLAX", destination_icao: "KTEB", block_minutes: 480, fuel_stop: false }, as: SalesAgent }
            - { call: "POST /charter/trip-requests/${trip_wx}/quote", payload: {}, as: SalesAgent }
            - { call: "POST /charter/trip-requests/${trip_wx}/book", payload: { deposit_cents: 513000 }, as: SalesAgent }
            - { call: "POST /charter/payments", payload: { trip_request_id: "${trip_wx}", payment_type: "BALANCE", amount_cents: 1539000 }, as: SalesAgent }
            - { call: "POST /charter/weather-advisories", payload: { station_icao: "KLAX", severity: "SIGMET", starts_at: "2026-08-03T00:00:00Z", ends_at: "2026-08-05T00:00:00Z" }, as: DispatchManager }
            - { call: "POST /charter/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T00:00:00Z" }, as: OpsAdmin }
          trigger:
            - { call: "POST /charter/trip-requests/${trip_wx}/cancel", payload: { reason: "WEATHER" }, as: SalesAgent, captures: { wx_fee: $.data.cancellation_fee_cents, wx_ref: $.data.refund_cents, wx_pp: $.data.payment_posture } }
          assert:
            - "cancellation_fee_cents == 0 and refund_cents == 2052000 (full refund despite 48h tier)"
            - "payment_posture == REFUNDED_FULL and status == CANCELLED"

      - name: per_leg_rounding_constants
        claim_type: precision
        grounds: [calculations.quote_price]
        excluded_because:
          difficulty_instance: quote_per_leg_rounding_pinned
          rationale: "Per-leg rounding order asserted there with 1-cent divergence."

      - name: discount_surcharge_order
        claim_type: correct_result
        grounds: [calculations.quote_price]
        excluded_because:
          difficulty_instance: quote_discount_surcharge_order_pinned
          rationale: "Discount-tier-then-surcharge evaluation order asserted there."

      - name: refund_tier_boundaries
        claim_type: boundary_edge
        grounds: [calculations.cancellation_refund]
        excluded_because:
          difficulty_instance: cancel_at_exactly_72h_tier1
          rationale: "Exactly-72h 10% tier asserted there; 50% tier asserted in cancellation_refund_three_input_tier."

      - name: owner_statement_variants
        claim_type: variant_divergence
        grounds: [calculations.owner_statement]
        excluded_because:
          difficulty_instance: owner_standard_vs_guaranteed_diverge
          rationale: "STANDARD vs GUARANTEED variant divergence asserted there."

      - name: quote_vs_final_variants
        claim_type: variant_divergence
        grounds: [calculations.final_price]
        excluded_because:
          difficulty_instance: trip_quote_vs_final_price_diverge
          rationale: "QUOTED vs FINAL variant divergence asserted there (621000 vs 472000)."

  # ============================================================ validations
  - section: validations
    instances:
      - name: missing_auth_headers_returns_unauthenticated
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT]"]
        distinguishing_aspect: "No X-User-Role header at all: priority-1 auth check fires before anything else."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /charter/trip-requests", payload: {}, captures: { err_au: $.data.error_id } }
          assert: ["HTTP 400 with error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT"]

      - name: sales_agent_cannot_ground_aircraft_returns_forbidden
        claim_type: violation_to_error
        grounds: ["validations[priority=2]", "errors[ERR_FORBIDDEN]", roles]
        distinguishing_aspect: "Role check (p2) fires before existence: SalesAgent grounding a real aircraft gets 403 ERR_FORBIDDEN."
        test_recipe:
          setup: ["owner + aircraft AVAILABLE"]
          setup_api_calls:
            - { call: "POST /charter/aircraft-owners", payload: { name: "Owner RB", contact_email: "rb@x.com", revenue_share_pct: 80 }, as: OpsAdmin, captures: { own_rb: $.data.id } }
            - { call: "POST /charter/aircraft", payload: { owner_id: "${own_rb}", tail_number: "N600RB", category: "LIGHT_JET", home_base_icao: "KLAX", seats: 8, hourly_rate_cents: 240000, on_ops_spec: true, initial_airframe_minutes: 0, next_check_due_minutes: 60000 }, as: OpsAdmin, captures: { ac_rb: $.data.id } }
          trigger:
            - { call: "POST /charter/aircraft/${ac_rb}/ground", payload: {}, as: SalesAgent, captures: { err_rb: $.data.error_id } }
          assert: ["HTTP 403 with error_id == ERR_FORBIDDEN"]

      - name: maintenance_controller_cannot_screen_passenger
        claim_type: violation_to_error
        grounds: ["validations[priority=2]", "errors[ERR_FORBIDDEN]", roles]
        distinguishing_aspect: "screen is exclusive to ComplianceOfficer; MaintenanceController gets 403."
        test_recipe:
          setup: ["trip QUOTED with one PENDING passenger"]
          setup_api_calls:
            - { call: "POST /charter/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: OpsAdmin }
            - { call: "POST /charter/trip-requests", payload: { customer_name: "Cust MC", customer_email: "mc@x.com", requested_category: "LIGHT_JET", origin_icao: "KLAX", destination_icao: "KTEB", departure_at: "2026-08-10T10:00:00Z", passenger_count: 1, international: false }, as: SalesAgent, captures: { trip_mc: $.data.id } }
            - { call: "POST /charter/quote-legs", payload: { trip_request_id: "${trip_mc}", seq_no: 1, leg_type: "REVENUE", origin_icao: "KLAX", destination_icao: "KTEB", block_minutes: 60, fuel_stop: false }, as: SalesAgent }
            - { call: "POST /charter/trip-requests/${trip_mc}/quote", payload: {}, as: SalesAgent }
            - { call: "POST /charter/passengers", payload: { trip_request_id: "${trip_mc}", full_name: "Pax MC", date_of_birth: "1988-08-08" }, as: SalesAgent, captures: { pax_mc: $.data.id } }
          trigger:
            - { call: "POST /charter/passengers/${pax_mc}/screen", payload: { outcome: "CLEARED" }, as: MaintenanceController, captures: { err_mc: $.data.error_id } }
          assert: ["HTTP 403 with error_id == ERR_FORBIDDEN"]

      - name: existence_beats_state_on_leg_create
        claim_type: priority_ordering
        grounds: ["validations[priority=5]", "validations[priority=7]", "errors[ERR_TRIP_REQUEST_NOT_FOUND]"]
        distinguishing_aspect: "Adding a leg to a non-existent trip yields 404 (existence p5), never the state error (p7) that a real non-DRAFT trip would produce."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /charter/quote-legs", payload: { trip_request_id: "00000000-0000-4000-8000-000000000000", seq_no: 1, leg_type: "REVENUE", origin_icao: "KLAX", destination_icao: "KTEB", block_minutes: 60, fuel_stop: false }, as: SalesAgent, captures: { err_xs: $.data.error_id } }
          assert: ["HTTP 404 with error_id == ERR_TRIP_REQUEST_NOT_FOUND"]

      - name: occ_priority_state_vs_stale_version
        claim_type: priority_ordering
        grounds: ["validations[priority=6]", "concurrency_rules[requote-stale-trip-version]"]
        excluded_because:
          difficulty_instance: trip_request_requote_cycle
          rationale: "OCC happy path exercised there; stale-version rejection is covered by occ_requote_stale_version_412 in complexity_layers below."

      - name: priority_state_vs_safety_dispatch
        claim_type: priority_ordering
        grounds: ["validations[priority=7]", "validations[priority=8]"]
        excluded_because:
          difficulty_instance: dispatch_state_error_beats_safety
          rationale: "Asserted as the failure path of the named §1.8 instance."

      - name: priority_safety_vs_fiscal_dispatch
        claim_type: priority_ordering
        grounds: ["validations[priority=8]", "validations[priority=11]"]
        excluded_because:
          difficulty_instance: dispatch_safety_beats_fiscal
          rationale: "Asserted as the failure path of the named §1.8 instance."

  # ============================================================ endpoints
  - section: endpoints
    instances:
      - name: pagination_limit_offset_has_more
        claim_type: listing
        grounds: [response_envelope]
        distinguishing_aspect: "limit=1 pages a 2-trip list: page 0 has has_more == true and total_count == 2; page 1 has has_more == false."
        test_recipe:
          setup: ["two trips created"]
          setup_api_calls:
            - { call: "POST /charter/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: OpsAdmin }
            - { call: "POST /charter/trip-requests", payload: { customer_name: "Cust P1", customer_email: "p1@x.com", requested_category: "TURBOPROP", origin_icao: "KLAX", destination_icao: "KLAS", departure_at: "2026-08-10T10:00:00Z", passenger_count: 0, international: false }, as: SalesAgent }
            - { call: "POST /charter/trip-requests", payload: { customer_name: "Cust P2", customer_email: "p2@x.com", requested_category: "TURBOPROP", origin_icao: "KLAX", destination_icao: "KLAS", departure_at: "2026-08-11T10:00:00Z", passenger_count: 0, international: false }, as: SalesAgent }
          trigger:
            - { call: "GET /charter/trip-requests", payload: { limit: 1, offset: 0 }, as: OpsAdmin }
            - { call: "GET /charter/trip-requests", payload: { limit: 1, offset: 1 }, as: OpsAdmin }
          assert:
            - "Page 0: data length == 1, total_count == 2, has_more == true"
            - "Page 1: data length == 1, total_count == 2, has_more == false"

