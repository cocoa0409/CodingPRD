scenario: "2316. School Capacity Study & Portable Classroom Allocation (district facilities planning office): building program capacity calculation by room type, class size policy and special program set-asides, utilization measurement against projected enrollment by grade configuration, portable classroom inventory, condition and placement site feasibility including utilities and fire access, permitting, installation scheduling and summer window constraints, relocation cost modeling versus boundary change or addition, accessibility and code compliance for relocated units, decommissioning, disposal and long-term reliance reporting"
domain_name: "school-capacity-portable-allocation"
api_prefix: "/facilities"

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: temporal_windowing
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - selector_policy

  entity_topology: flat
  # Fourteen peer entities linked purely by foreign keys; no nesting in URL
  # paths. Every collection lives directly under /facilities/<collection> and
  # every relationship is expressed as an FK field plus a filtered-list GET.

  state_machine_shape: parallel
  # PortableUnit carries two independent state dimensions on the same row
  # (condition_status x allocation_status). CapacityStudy is cyclic
  # (DRAFT->SUBMITTED->RETURNED->DRAFT), Permit is cyclic
  # (SUBMITTED->CORRECTIONS_REQUIRED->SUBMITTED), PlacementRequest is
  # branching fork-join (PERMIT_PENDING fans out to N Permits and joins to
  # either PERMITTED or REJECTED with divergent side-effect sets).

  relationship_patterns:
    - one_to_many          # School -> Room / ProgramSetAside / EnrollmentProjection / PlacementSite
    - self_referential     # PortableUnit.replaced_unit_id -> PortableUnit.id
    - cross_aggregate      # PlacementRequest references CapacityStudy, PortableUnit, PlacementSite, CapitalBudget
    - polymorphic: false

  role_model: segregation_of_duties
  # The FacilitiesPlanner who authors a CapacityStudy may never certify it;
  # the PermitCoordinator who files permits may never decide them; the
  # CrewLead may only act on schedules assigned to its own crew.

  consistency_model: immediate

  difficulty_level: beyond_expert
  # 14 entities / 58 endpoints / 41 error codes / 8 calculations (4 of them
  # dual-variant) / 6 state machines / 2 OCC races.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ===========================================================================
# 1.1 Entity-Relationship Table
# ===========================================================================
entities:
  - name: School
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: campus name
        constraints: "1..120 chars, required"
      - name: grade_configuration
        type: enum
        source: input
        description: grade span served by the campus; determines the grade set counted in utilization and the primary class-size band
        constraints: "one of ELEMENTARY_K5 | MIDDLE_68 | HIGH_912 | K8_COMBINED"
      - name: site_acreage
        type: number
        source: input
        description: usable site acreage
        constraints: ">= 0.5"
      - name: fire_lane_clear_width_ft
        type: number
        source: input
        description: narrowest clear width of the campus fire-access loop in feet; gates portable placement district-wide
        constraints: ">= 0"
      - name: electrical_spare_capacity_kw
        type: number
        source: input
        description: campus-level spare electrical service in kW
        constraints: ">= 0"
      - name: sewer_spare_connections
        type: integer
        source: input
        description: number of unused sanitary sewer connection stubs on campus
        constraints: ">= 0"
      - name: consecutive_reliance_years
        type: integer
        source: input
        description: number of consecutive prior school years the campus has relied on portable classrooms; supplied at campus onboarding from the prior reporting system
        default: 0
        constraints: ">= 0"
      - name: hosted_portable_seats
        type: integer
        source: computed
        description: "derived: sum of PortableUnit.rated_seats over units whose allocation_status == INSTALLED and current_school_id == this School.id; maintained by the install and decommission cascades"
        default: 0
      - name: reliance_flag
        type: enum
        source: computed
        description: "derived by calculation reliance_metrics; recomputed on study certification, legacy-placement recording, install completion and decommission completion"
        default: NONE
        constraints: "one of NONE | MONITOR | LONG_TERM_RELIANCE"
      - name: certified_study_id
        type: string
        source: computed
        description: "id of the CapacityStudy currently supplying permanent_seats for this campus (latest CERTIFIED study by school_year DESC, then created_at DESC); null when no CERTIFIED study exists"
        default: null

  - name: ClassSizePolicy
    parent: null
    common_fields: false
    fields:
      - name: grade_band
        type: enum
        source: input
        description: grade band the loading factors apply to
        constraints: "one of K_3 | G4_6 | G7_8 | G9_12"
      - name: effective_school_year
        type: string
        source: input
        description: school year the policy governs
        constraints: "format YYYY-YY, e.g. 2027-28"
      - name: max_class_size
        type: integer
        source: input
        description: contractual maximum pupils per teaching station
        constraints: "1..40"
      - name: min_area_sqft_per_seat
        type: number
        source: input
        description: minimum assignable square feet per seat for a standard classroom
        constraints: "> 0"
      - name: lab_area_premium_sqft
        type: number
        source: input
        description: extra square feet per seat required in a science lab, added to min_area_sqft_per_seat for SCIENCE_LAB rooms
        constraints: ">= 0"

  - name: Room
    parent: null
    common_fields: true
    fields:
      - name: school_id
        type: string
        source: input
        description: "FK -> School.id; campus the room belongs to"
      - name: room_number
        type: string
        source: input
        description: room label, unique within the campus
        constraints: "1..20 chars"
      - name: room_type
        type: enum
        source: input
        description: room type driving the loading factor
        constraints: "one of STANDARD_CLASSROOM | SCIENCE_LAB | SPED_RESOURCE | ART_MUSIC | GYM | LIBRARY | ADMIN"
      - name: area_sqft
        type: number
        source: input
        description: assignable square feet
        constraints: "> 0"
      - name: status
        type: enum
        source: system
        description: service status; only IN_SERVICE rooms enter program capacity
        default: IN_SERVICE
        constraints: "one of IN_SERVICE | OUT_OF_SERVICE_RENOVATION | DECOMMISSIONED"

  - name: ProgramSetAside
    parent: null
    common_fields: true
    fields:
      - name: school_id
        type: string
        source: input
        description: "FK -> School.id; campus whose rooms are set aside"
      - name: program_type
        type: enum
        source: input
        description: special program holding the set-aside
        constraints: "one of SPED_SELF_CONTAINED | DUAL_LANGUAGE | TITLE_I_INTERVENTION | CTE_LAB"
      - name: reserved_room_type
        type: enum
        source: input
        description: room type consumed by the set-aside
        constraints: "same enum as Room.room_type"
      - name: reserved_room_count
        type: integer
        source: input
        description: number of rooms of reserved_room_type held by the program
        constraints: ">= 1"
      - name: seats_excluded_per_room
        type: integer
        source: input
        description: seats removed from program capacity for each reserved room
        constraints: ">= 0"

  - name: EnrollmentProjection
    parent: null
    common_fields: false
    fields:
      - name: school_id
        type: string
        source: input
        description: "FK -> School.id; campus the projection covers"
      - name: school_year
        type: string
        source: input
        description: projected school year
        constraints: "format YYYY-YY"
      - name: grade_level
        type: integer
        source: input
        description: grade level, 0 meaning kindergarten
        constraints: "0..12"
      - name: projected_students
        type: integer
        source: input
        description: projected headcount for this grade level
        constraints: ">= 0"
      - name: source
        type: enum
        source: input
        description: projection methodology; STATE_LOADING_STANDARD studies count COHORT_SURVIVAL rows only
        constraints: "one of COHORT_SURVIVAL | DEVELOPER_YIELD"
      - name: confidence_tier
        type: enum
        source: input
        description: analyst confidence; a LOW row blocks certification of a DISTRICT_POLICY study
        constraints: "one of HIGH | MEDIUM | LOW"

  - name: CapacityStudy
    parent: null
    common_fields: true
    fields:
      - name: school_id
        type: string
        source: input
        description: "FK -> School.id; campus under study"
      - name: class_size_policy_id
        type: string
        source: input
        description: "FK -> ClassSizePolicy.id; policy pinned to this study at creation and never re-resolved afterwards"
      - name: school_year
        type: string
        source: input
        description: school year measured
        constraints: "format YYYY-YY"
      - name: method
        type: enum
        source: input
        description: capacity method selecting the calculation variant
        constraints: "one of STATE_LOADING_STANDARD | DISTRICT_POLICY"
      - name: status
        type: enum
        source: system
        description: study lifecycle state
        default: DRAFT
        constraints: "one of DRAFT | SUBMITTED | RETURNED | CERTIFIED | SUPERSEDED"
      - name: revision_round
        type: integer
        source: computed
        description: number of times the study has been returned for revision; incremented by the return transition
        default: 0
      - name: authored_by_user_id
        type: string
        source: system
        description: opaque X-User-ID of the FacilitiesPlanner that created the study; the segregation-of-duties check compares it against the certifier
      - name: certified_by_user_id
        type: string
        source: system
        description: opaque X-User-ID of the CapacityCertifier that certified the study; null until CERTIFIED
        default: null
      - name: gross_room_seats
        type: integer
        source: computed
        description: "output of calculation program_capacity_seats before set-aside deduction, under the study's own method"
        default: 0
      - name: set_aside_deduction_seats
        type: integer
        source: computed
        description: seats removed by ProgramSetAside rows under the study's own method
        default: 0
      - name: program_capacity_seats
        type: integer
        source: computed
        description: "net building program capacity under the study's method; frozen at the moment of submission"
        default: 0
      - name: projected_enrollment_total
        type: integer
        source: computed
        description: sum of the selected EnrollmentProjection rows for the grades in the campus grade_configuration
        default: 0
      - name: utilization_pct
        type: number
        source: computed
        description: "projected_enrollment_total * 100 / program_capacity_seats, one decimal, round_half_up"
        default: 0
      - name: portable_trigger_met
        type: boolean
        source: computed
        description: "true when utilization_pct >= 95.0 (inclusive boundary)"
        default: false
      - name: seat_deficit
        type: integer
        source: computed
        description: seats beyond the 95 percent target loading, zero when portable_trigger_met is false
        default: 0
      - name: required_portable_count
        type: integer
        source: computed
        description: "ceil(seat_deficit / 24)"
        default: 0
      - name: certified_on
        type: datetime
        source: system
        description: logical-clock instant of certification; null until CERTIFIED
        default: null

  - name: PortableUnit
    parent: null
    common_fields: true
    fields:
      - name: asset_tag
        type: string
        source: input
        description: district asset tag, unique across the inventory
        constraints: "1..24 chars"
      - name: size_class
        type: enum
        source: input
        description: chassis size class; fixes footprint, service load, sewer need and rated seats
        constraints: "one of SINGLE_24x40 | DOUBLE_28x64 | TRIPLE_36x64"
      - name: rated_seats
        type: integer
        source: computed
        description: "seats implied by size_class: SINGLE_24x40 -> 24, DOUBLE_28x64 -> 48, TRIPLE_36x64 -> 60"
      - name: condition_grade
        type: enum
        source: input
        description: physical condition grade; drives rehab cost and salvage multiplier
        default: B
        constraints: "one of A | B | C | D"
      - name: condition_status
        type: enum
        source: system
        description: "first of two independent state dimensions on this row: serviceability"
        default: SERVICEABLE
        constraints: "one of SERVICEABLE | NEEDS_REHAB | UNSAFE"
      - name: allocation_status
        type: enum
        source: system
        description: "second of two independent state dimensions on this row: where the unit is in the allocation lifecycle"
        default: IN_STORAGE
        constraints: "one of IN_STORAGE | RESERVED | SCHEDULED | INSTALLED | PENDING_REMOVAL | DISPOSED"
      - name: ada_ramp_installed
        type: boolean
        source: input
        description: unit already carries a compliant ramp and landing
        default: false
      - name: acquisition_cost_cents
        type: integer
        source: input
        description: original acquisition cost in cents
        constraints: "> 0"
      - name: in_service_year
        type: integer
        source: input
        description: calendar year the unit first entered service
        constraints: "1970..2100"
      - name: current_school_id
        type: string
        source: computed
        description: "FK -> School.id; campus currently hosting the unit, null while in storage or disposed"
        default: null
      - name: replaced_unit_id
        type: string
        source: input
        description: "FK -> PortableUnit.id; unit this one was purchased to replace, null when not a replacement"
        default: null
      - name: prior_relocation_count
        type: integer
        source: input
        description: "moves the unit already made before it was onboarded into this system; legacy inventory carries a known move history"
        default: 0
        constraints: "0..4"
      - name: lifetime_relocation_count
        type: integer
        source: computed
        description: "prior_relocation_count plus the number of completed installs and legacy placements recorded against the unit in this system"
        default: 0
      - name: accumulated_relocation_cost_cents
        type: integer
        source: computed
        description: running sum of encumbered relocation cost actually expended on this unit; also the primary selector ranking key
        default: 0

  - name: PlacementSite
    parent: null
    common_fields: true
    fields:
      - name: school_id
        type: string
        source: input
        description: "FK -> School.id; campus the pad sits on"
      - name: pad_code
        type: string
        source: input
        description: pad label, unique within the campus
        constraints: "1..20 chars"
      - name: pad_length_ft
        type: number
        source: input
        description: usable pad length in feet
        constraints: "> 0"
      - name: pad_width_ft
        type: number
        source: input
        description: usable pad width in feet
        constraints: "> 0"
      - name: distance_to_fire_lane_ft
        type: number
        source: input
        description: hose-lay distance from the pad to the nearest fire-access lane
        constraints: ">= 0"
      - name: electrical_drop_available_kw
        type: number
        source: input
        description: electrical service available at the pad in kW
        constraints: ">= 0"
      - name: sewer_connection_available
        type: boolean
        source: input
        description: a sanitary sewer stub is present at the pad
        default: false
      - name: ada_path_of_travel_compliant
        type: boolean
        source: input
        description: compliant accessible path of travel already reaches the pad
        default: false
      - name: feasibility_status
        type: enum
        source: computed
        description: "output of calculation site_feasibility_assessment"
        default: UNASSESSED
        constraints: "one of UNASSESSED | FEASIBLE | FEASIBLE_WITH_MITIGATION | INFEASIBLE"
      - name: mitigation_flags
        type: array
        source: computed
        description: "ordered list of mitigations the last assessment found, emitted in the fixed order [ELECTRICAL_UPGRADE, SEWER_HOOKUP, ADA_PATH_UPGRADE]"
        default: []
      - name: infeasible_reason
        type: enum
        source: computed
        description: reason the pad was judged INFEASIBLE, null otherwise
        default: null
        constraints: "one of PAD_TOO_SMALL | FIRE_ACCESS | null"
      - name: assessed_for_size_class
        type: enum
        source: computed
        description: size class the last assessment was run against, null while UNASSESSED
        default: null
        constraints: "same enum as PortableUnit.size_class, or null"
      - name: occupied_by_unit_id
        type: string
        source: computed
        description: "FK -> PortableUnit.id; unit holding the pad, null when the pad is free"
        default: null

  - name: CapitalBudget
    parent: null
    common_fields: true
    fields:
      - name: fiscal_year
        type: string
        source: input
        description: fiscal year of the appropriation
        constraints: "format YYYY-YY"
      - name: authorized_cents
        type: integer
        source: input
        description: total board-authorized appropriation in cents; the conserved quantity of invariant capital_budget_partition
        constraints: "> 0"
      - name: encumbered_cents
        type: integer
        source: computed
        description: cents committed to PERMITTED or SCHEDULED placement requests and not yet expended
        default: 0
      - name: expended_cents
        type: integer
        source: computed
        description: cents actually spent on completed installs and completed decommissions
        default: 0
      - name: uncommitted_cents
        type: integer
        source: computed
        description: "authorized_cents - encumbered_cents - expended_cents"
        default: 0

  - name: PlacementRequest
    parent: null
    common_fields: true
    fields:
      - name: capacity_study_id
        type: string
        source: input
        description: "FK -> CapacityStudy.id; study justifying the placement"
      - name: school_id
        type: string
        source: computed
        description: "FK -> School.id; copied from the study at creation and never re-resolved"
      - name: placement_site_id
        type: string
        source: input
        description: "FK -> PlacementSite.id; pad the unit is destined for"
      - name: portable_unit_id
        type: string
        source: input
        description: "FK -> PortableUnit.id; unit assigned to the request, null until auto-assign-unit runs"
        default: null
      - name: capital_budget_id
        type: string
        source: input
        description: "FK -> CapitalBudget.id; appropriation the relocation is charged to"
      - name: status
        type: enum
        source: system
        description: request lifecycle state
        default: DRAFT
        constraints: "one of DRAFT | SITE_ASSESSED | PERMIT_PENDING | PERMITTED | SCHEDULED | INSTALLED | DECOMMISSION_REQUESTED | DECOMMISSIONED | REJECTED | WITHDRAWN"
      - name: requested_window_start
        type: string
        source: input
        description: first calendar date of the requested installation window
        constraints: "format YYYY-MM-DD"
      - name: requested_window_end
        type: string
        source: input
        description: last calendar date of the requested installation window
        constraints: "format YYYY-MM-DD, >= requested_window_start"
      - name: haul_miles
        type: integer
        source: input
        description: one-way haul distance from the unit's present location to the pad
        constraints: "0..500"
      - name: required_permit_count
        type: integer
        source: computed
        description: size of the required permit set computed at submit-permits
        default: 0
      - name: estimated_relocation_cost_cents
        type: integer
        source: computed
        description: "output of calculation relocation_cost_estimate; recomputed on creation and on auto-assign-unit"
        default: 0
      - name: encumbered_cost_cents
        type: integer
        source: computed
        description: cents currently encumbered against capital_budget_id for this request; snapshot of estimated_relocation_cost_cents taken when the request becomes PERMITTED, zeroed on release
        default: 0
      - name: cost_recommendation
        type: enum
        source: computed
        description: "output of calculation alternative_cost_comparison under the default LIFECYCLE_20YR basis, stored at creation and on auto-assign-unit"
        default: null
        constraints: "one of RELOCATE | BOUNDARY_CHANGE | PERMANENT_ADDITION | null"
      - name: rejection_reason
        type: string
        source: system
        description: free text recorded when the request enters REJECTED or WITHDRAWN
        default: null

  - name: Permit
    parent: null
    common_fields: true
    fields:
      - name: placement_request_id
        type: string
        source: input
        description: "FK -> PlacementRequest.id; request the permit belongs to"
      - name: permit_type
        type: enum
        source: system
        description: permit discipline, set by the submit-permits fan-out
        constraints: "one of DSA_STRUCTURAL | FIRE_MARSHAL | ELECTRICAL | PLUMBING | ADA_ACCESS"
      - name: status
        type: enum
        source: system
        description: permit review state
        default: SUBMITTED
        constraints: "one of SUBMITTED | CORRECTIONS_REQUIRED | APPROVED | DENIED"
      - name: review_cycle_count
        type: integer
        source: computed
        description: number of times the permit has been resubmitted after corrections
        default: 0
      - name: submitted_on
        type: datetime
        source: system
        description: logical-clock instant of the most recent submission or resubmission
      - name: approved_on
        type: datetime
        source: system
        description: logical-clock instant of approval; null unless APPROVED. Permit validity runs 180 calendar days from this instant
        default: null
      - name: correction_note
        type: string
        source: system
        description: latest note from the building official, null when never corrected
        default: null

  - name: InstallationCrew
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: crew name
        constraints: "1..80 chars"
      - name: max_concurrent_jobs
        type: integer
        source: input
        description: number of installation windows the crew may have overlapping at once
        constraints: "1..6"
      - name: certified_work_types
        type: array
        source: input
        description: work types the crew is certified for; each element is SET or RELOCATE
        constraints: "non-empty, elements in {SET, RELOCATE}"

  - name: InstallationSchedule
    parent: null
    common_fields: true
    fields:
      - name: placement_request_id
        type: string
        source: input
        description: "FK -> PlacementRequest.id; request being executed"
      - name: installation_crew_id
        type: string
        source: input
        description: "FK -> InstallationCrew.id; crew booked for the window"
      - name: work_type
        type: enum
        source: input
        description: SET moves a unit out of storage, RELOCATE moves it from another campus
        constraints: "one of SET | RELOCATE"
      - name: window_start
        type: string
        source: input
        description: first calendar date of the booked window
        constraints: "format YYYY-MM-DD"
      - name: window_end
        type: string
        source: input
        description: last calendar date of the booked window
        constraints: "format YYYY-MM-DD, >= window_start"
      - name: off_summer_waiver
        type: boolean
        source: input
        description: board waiver permitting work outside the 06-15..08-15 summer window; only DistrictAdmin may set it true
        default: false
      - name: status
        type: enum
        source: system
        description: schedule state
        default: PLANNED
        constraints: "one of PLANNED | IN_PROGRESS | COMPLETED | CANCELLED"
      - name: cancellation_reason
        type: string
        source: system
        description: reason recorded when the schedule is cancelled, including cascade-driven cancellation
        default: null

  - name: DisposalRecord
    parent: null
    common_fields: false
    fields:
      - name: portable_unit_id
        type: string
        source: input
        description: "FK -> PortableUnit.id; unit being disposed of"
      - name: method
        type: enum
        source: input
        description: disposal channel
        constraints: "one of SALE | SCRAP | TRANSFER_TO_COUNTY"
      - name: valuation_basis
        type: enum
        source: input
        description: variant selector for calculation unit_salvage_value
        constraints: "one of STRAIGHT_LINE | CONDITION_ADJUSTED"
      - name: proceeds_cents
        type: integer
        source: input
        description: cents actually received; must be 0 for SCRAP and TRANSFER_TO_COUNTY
        constraints: ">= 0"
      - name: salvage_value_cents
        type: integer
        source: computed
        description: "output of calculation unit_salvage_value under valuation_basis"
      - name: net_disposal_result_cents
        type: integer
        source: computed
        description: "proceeds_cents - salvage_value_cents; negative means a book loss"
      - name: disposed_on
        type: datetime
        source: system
        description: logical-clock instant of disposal

# ===========================================================================
# 1.2 State Machine Table
# ===========================================================================
state_machines:
  # ---------------------------------------------------------------- study ---
  - entity: CapacityStudy
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    note: "Cyclic: DRAFT -> SUBMITTED -> RETURNED -> DRAFT, capped at 3 revision rounds."
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /facilities/capacity-studies/{id}/submit"
        actor: FacilitiesPlanner
        preconditions:
          - "study.status == DRAFT"
          - "ClassSizePolicy.grade_band == PRIMARY_BAND[School.grade_configuration]"
          - "ClassSizePolicy.effective_school_year == study.school_year"
          - "every grade_level in GRADE_SET[School.grade_configuration] has at least one EnrollmentProjection with school_id == study.school_id and school_year == study.school_year that survives the method source filter"
          - "program_capacity_seats computed by calculation program_capacity_seats under study.method is > 0"
        side_effects:
          - "runs calculation program_capacity_seats and freezes gross_room_seats, set_aside_deduction_seats, program_capacity_seats"
          - "runs calculation utilization_and_portable_need and freezes projected_enrollment_total, utilization_pct, portable_trigger_met, seat_deficit, required_portable_count"
          - "increments CapacityStudy.version by 1"
      - from: SUBMITTED
        to: CERTIFIED
        trigger: "POST /facilities/capacity-studies/{id}/certify"
        actor: CapacityCertifier
        preconditions:
          - "study.status == SUBMITTED"
          - "X-User-ID != study.authored_by_user_id (segregation of duties)"
          - "when study.method == DISTRICT_POLICY, no selected EnrollmentProjection has confidence_tier == LOW"
        side_effects:
          - "sets certified_by_user_id and certified_on from the logical clock"
          - "cascade link 1: any other CapacityStudy with the same school_id and school_year whose status is CERTIFIED moves to SUPERSEDED, processed in created_at ASC order"
          - "cascade link 2: because the campus now has a new governing study, School.certified_study_id is repointed to this study and School.reliance_flag is recomputed by calculation reliance_metrics"
          - "increments CapacityStudy.version by 1 and School.version by 1"
      - from: SUBMITTED
        to: RETURNED
        trigger: "POST /facilities/capacity-studies/{id}/return"
        actor: CapacityCertifier
        preconditions:
          - "study.status == SUBMITTED"
          - "X-User-ID != study.authored_by_user_id (segregation of duties)"
        side_effects:
          - "increments revision_round by 1"
          - "clears the frozen computed capacity and utilization fields back to their defaults"
          - "increments CapacityStudy.version by 1"
      - from: RETURNED
        to: DRAFT
        trigger: "POST /facilities/capacity-studies/{id}/reopen"
        actor: FacilitiesPlanner
        preconditions:
          - "study.status == RETURNED"
          - "study.revision_round < 3"
        side_effects:
          - "increments CapacityStudy.version by 1"
        note: "closes the revision cycle; the 4th reopen attempt is rejected with ERR_REVISION_LIMIT_REACHED"
      - from: CERTIFIED
        to: SUPERSEDED
        trigger: "system: another CapacityStudy for the same school_id and school_year is certified"
        actor: system
        preconditions:
          - "study.status == CERTIFIED"
        side_effects:
          - "increments CapacityStudy.version by 1"
      - from: DRAFT
        to: SUPERSEDED
        trigger: "system: POST /facilities/capacity-studies creates a newer study for the same school_id and school_year"
        actor: system
        preconditions:
          - "study.status IN {DRAFT, RETURNED}"
        side_effects:
          - "increments CapacityStudy.version by 1"
        note: "this legitimate create-with-supersede is what makes concurrency rule study-create-stale-school a true race rather than a state precondition"
      - from: RETURNED
        to: SUPERSEDED
        trigger: "system: POST /facilities/capacity-studies creates a newer study for the same school_id and school_year"
        actor: system
        preconditions:
          - "study.status IN {DRAFT, RETURNED}"
        side_effects:
          - "increments CapacityStudy.version by 1"

  # ------------------------------------------------- portable unit (2 dims) --
  - entity: PortableUnit
    initial_state: "condition_status=SERVICEABLE x allocation_status=IN_STORAGE"
    terminal_states: [DISPOSED]
    note: |
      Two independent state dimensions evolve on the same row. condition_status
      moves on POST /portable-units/{id}/condition only; allocation_status moves
      only as a consequence of placement, schedule and disposal activity. A unit
      may be UNSAFE while INSTALLED, or SERVICEABLE while DISPOSED is forbidden
      by the disposal precondition. allocation_status is cyclic:
      IN_STORAGE -> RESERVED -> SCHEDULED -> INSTALLED -> PENDING_REMOVAL -> IN_STORAGE.
    transitions:
      - from: "condition_status=SERVICEABLE"
        to: "condition_status=NEEDS_REHAB"
        trigger: "POST /facilities/portable-units/{id}/condition"
        actor: AssetManager
        preconditions:
          - "unit.allocation_status != DISPOSED"
        side_effects:
          - "sets condition_grade to the supplied grade"
          - "increments PortableUnit.version by 1"
      - from: "condition_status=NEEDS_REHAB"
        to: "condition_status=SERVICEABLE"
        trigger: "POST /facilities/portable-units/{id}/condition"
        actor: AssetManager
        preconditions:
          - "unit.allocation_status != DISPOSED"
          - "supplied condition_grade IN {A, B, C}"
        side_effects:
          - "increments PortableUnit.version by 1"
        note: "rehab loop; the condition dimension is cyclic between SERVICEABLE and NEEDS_REHAB"
      - from: "condition_status IN {SERVICEABLE, NEEDS_REHAB}"
        to: "condition_status=UNSAFE"
        trigger: "POST /facilities/portable-units/{id}/condition"
        actor: AssetManager
        preconditions:
          - "unit.allocation_status != DISPOSED"
        side_effects:
          - "cascade link 1: because the unit is now UNSAFE, every PlacementRequest referencing it whose status IN {DRAFT, SITE_ASSESSED, PERMIT_PENDING, PERMITTED, SCHEDULED} moves to WITHDRAWN with rejection_reason 'UNIT_UNSAFE', processed in created_at ASC order"
          - "cascade link 2: because each such request became WITHDRAWN, its encumbered_cost_cents is released back to CapitalBudget.encumbered_cents and zeroed, and every InstallationSchedule of that request whose status IN {PLANNED, IN_PROGRESS} moves to CANCELLED with cancellation_reason 'UNIT_UNSAFE'"
          - "cascade link 3: because each such schedule was cancelled, the PlacementSite of the request releases the pad by clearing occupied_by_unit_id, and the unit's allocation_status returns to IN_STORAGE with current_school_id cleared unless allocation_status was INSTALLED"
          - "increments PortableUnit.version by 1"
      - from: "allocation_status=IN_STORAGE"
        to: "allocation_status=RESERVED"
        trigger: "POST /facilities/placement-requests (with portable_unit_id) or POST /facilities/placement-requests/{id}/auto-assign-unit"
        actor: FacilitiesPlanner
        preconditions:
          - "unit.allocation_status == IN_STORAGE"
          - "unit.condition_status == SERVICEABLE"
          - "unit.condition_grade != D"
          - "unit.lifetime_relocation_count < 4"
        side_effects:
          - "increments PortableUnit.version by 1"
      - from: "allocation_status=RESERVED"
        to: "allocation_status=IN_STORAGE"
        trigger: "system: the owning PlacementRequest leaves for REJECTED or WITHDRAWN"
        actor: system
        preconditions:
          - "unit.allocation_status == RESERVED"
        side_effects:
          - "increments PortableUnit.version by 1"
      - from: "allocation_status=RESERVED"
        to: "allocation_status=SCHEDULED"
        trigger: "system: the owning PlacementRequest reaches PERMITTED"
        actor: system
        preconditions:
          - "unit.allocation_status == RESERVED"
        side_effects:
          - "cascade link 3 of the permit-approval chain: because the unit is now SCHEDULED, PlacementSite.occupied_by_unit_id is set to this unit"
          - "increments PortableUnit.version by 1"
      - from: "allocation_status=SCHEDULED"
        to: "allocation_status=INSTALLED"
        trigger: "system: an InstallationSchedule of the owning request reaches COMPLETED"
        actor: system
        preconditions:
          - "unit.allocation_status == SCHEDULED"
        side_effects:
          - "sets current_school_id to the request's school_id"
          - "increments lifetime_relocation_count by 1 and adds the request's encumbered_cost_cents to accumulated_relocation_cost_cents"
          - "adds rated_seats to School.hosted_portable_seats and recomputes School.reliance_flag"
          - "increments PortableUnit.version by 1 and School.version by 1"
      - from: "allocation_status=IN_STORAGE"
        to: "allocation_status=INSTALLED"
        trigger: "POST /facilities/portable-units/{id}/record-existing-placement"
        actor: AssetManager
        preconditions:
          - "unit.allocation_status == IN_STORAGE"
          - "unit.condition_status != UNSAFE"
          - "the target PlacementSite belongs to the supplied school_id and has occupied_by_unit_id == null"
        side_effects:
          - "sets current_school_id, sets PlacementSite.occupied_by_unit_id, increments lifetime_relocation_count by 1"
          - "adds rated_seats to School.hosted_portable_seats and recomputes School.reliance_flag"
          - "increments PortableUnit.version by 1, PlacementSite.version by 1 and School.version by 1"
        note: "legacy inventory onboarding: records a portable that was already on the ground before the system existed"
      - from: "allocation_status=INSTALLED"
        to: "allocation_status=PENDING_REMOVAL"
        trigger: "system: the owning PlacementRequest reaches DECOMMISSION_REQUESTED"
        actor: system
        preconditions:
          - "unit.allocation_status == INSTALLED"
        side_effects:
          - "increments PortableUnit.version by 1"
      - from: "allocation_status=PENDING_REMOVAL"
        to: "allocation_status=IN_STORAGE"
        trigger: "system: the owning PlacementRequest reaches DECOMMISSIONED"
        actor: system
        preconditions:
          - "unit.allocation_status == PENDING_REMOVAL"
        side_effects:
          - "subtracts rated_seats from School.hosted_portable_seats, clears current_school_id, clears PlacementSite.occupied_by_unit_id and recomputes School.reliance_flag"
          - "increments PortableUnit.version by 1 and School.version by 1"
      - from: "allocation_status=IN_STORAGE"
        to: "allocation_status=DISPOSED"
        trigger: "POST /facilities/disposal-records"
        actor: AssetManager
        preconditions:
          - "unit.allocation_status == IN_STORAGE"
          - "unit.condition_status == UNSAFE OR unit.condition_grade == D"
          - "no DisposalRecord already references the unit"
        side_effects:
          - "runs calculation unit_salvage_value under the supplied valuation_basis and stores salvage_value_cents and net_disposal_result_cents on the DisposalRecord"
          - "increments PortableUnit.version by 1"

  # ------------------------------------------------------ placement request --
  - entity: PlacementRequest
    initial_state: DRAFT
    terminal_states: [DECOMMISSIONED, REJECTED, WITHDRAWN]
    note: |
      Branching fork-join. submit-permits forks into the computed required
      permit set; the join is evaluated after every permit decision and lands
      on either PERMITTED or REJECTED with disjoint side-effect sets.
    transitions:
      - from: DRAFT
        to: SITE_ASSESSED
        trigger: "POST /facilities/placement-requests/{id}/assess-site"
        actor: FacilitiesPlanner
        preconditions:
          - "request.status == DRAFT"
          - "the referenced CapacityStudy.status == CERTIFIED (cross-entity gate)"
          - "request.portable_unit_id != null"
          - "the referenced PortableUnit.condition_status == SERVICEABLE"
          - "the referenced PlacementSite.feasibility_status IN {FEASIBLE, FEASIBLE_WITH_MITIGATION} and assessed_for_size_class == unit.size_class"
          - "PlacementSite.distance_to_fire_lane_ft <= 150 AND School.fire_lane_clear_width_ft >= 20"
        side_effects:
          - "increments PlacementRequest.version by 1"
      - from: SITE_ASSESSED
        to: PERMIT_PENDING
        trigger: "POST /facilities/placement-requests/{id}/submit-permits"
        actor: PermitCoordinator
        preconditions:
          - "request.status == SITE_ASSESSED"
          - "the referenced PortableUnit.condition_status == SERVICEABLE"
        side_effects:
          - "fan-out: creates one Permit per member of the required permit set {DSA_STRUCTURAL, FIRE_MARSHAL, ELECTRICAL} plus PLUMBING when the unit size_class needs sewer and the pad has none, plus ADA_ACCESS when the unit lacks a ramp or the pad path is non-compliant; each Permit starts SUBMITTED with submitted_on from the logical clock"
          - "stores required_permit_count"
          - "increments PlacementRequest.version by 1"
      - from: PERMIT_PENDING
        to: PERMITTED
        trigger: "system: the last Permit of the request reaches APPROVED"
        actor: system
        preconditions:
          - "request.status == PERMIT_PENDING"
          - "every Permit with placement_request_id == request.id has status == APPROVED"
          - "CapitalBudget.uncommitted_cents >= request.estimated_relocation_cost_cents"
        side_effects:
          - "cascade link 2 of the permit-approval chain: copies estimated_relocation_cost_cents into encumbered_cost_cents, adds it to CapitalBudget.encumbered_cents and recomputes CapitalBudget.uncommitted_cents"
          - "cascade link 3 of the permit-approval chain: the referenced PortableUnit moves allocation_status RESERVED -> SCHEDULED"
          - "increments PlacementRequest.version by 1 and CapitalBudget.version by 1"
        note: "join arm A of the fork-join; disjoint from the REJECTED arm below"
      - from: PERMIT_PENDING
        to: REJECTED
        trigger: "system: any Permit of the request reaches DENIED"
        actor: system
        preconditions:
          - "request.status == PERMIT_PENDING"
        side_effects:
          - "sets rejection_reason to 'PERMIT_DENIED'"
          - "the referenced PortableUnit moves allocation_status RESERVED -> IN_STORAGE"
          - "no budget encumbrance is created and PlacementSite.occupied_by_unit_id stays null"
          - "increments PlacementRequest.version by 1"
        note: "join arm B of the fork-join; the side-effect set is disjoint from arm A"
      - from: PERMITTED
        to: SCHEDULED
        trigger: "POST /facilities/installation-schedules"
        actor: OperationsScheduler
        preconditions:
          - "request.status == PERMITTED"
          - "no InstallationSchedule of this request has status IN {PLANNED, IN_PROGRESS, COMPLETED}"
        side_effects:
          - "increments PlacementRequest.version by 1"
      - from: SCHEDULED
        to: INSTALLED
        trigger: "system: the InstallationSchedule of the request reaches COMPLETED"
        actor: system
        preconditions:
          - "request.status == SCHEDULED"
        side_effects:
          - "moves encumbered_cost_cents from CapitalBudget.encumbered_cents to CapitalBudget.expended_cents and recomputes uncommitted_cents"
          - "the referenced PortableUnit moves allocation_status SCHEDULED -> INSTALLED"
          - "increments PlacementRequest.version by 1 and CapitalBudget.version by 1"
      - from: INSTALLED
        to: DECOMMISSION_REQUESTED
        trigger: "POST /facilities/placement-requests/{id}/request-decommission"
        actor: AssetManager
        preconditions:
          - "request.status == INSTALLED"
        side_effects:
          - "the referenced PortableUnit moves allocation_status INSTALLED -> PENDING_REMOVAL"
          - "increments PlacementRequest.version by 1"
      - from: DECOMMISSION_REQUESTED
        to: DECOMMISSIONED
        trigger: "POST /facilities/placement-requests/{id}/complete-decommission"
        actor: AssetManager
        preconditions:
          - "request.status == DECOMMISSION_REQUESTED"
          - "CapitalBudget.uncommitted_cents >= REMOVAL_CENTS_BY_SIZE[unit.size_class]"
        side_effects:
          - "adds REMOVAL_CENTS_BY_SIZE[unit.size_class] to CapitalBudget.expended_cents and recomputes uncommitted_cents"
          - "the referenced PortableUnit moves allocation_status PENDING_REMOVAL -> IN_STORAGE, which subtracts rated_seats from School.hosted_portable_seats and clears PlacementSite.occupied_by_unit_id"
          - "increments PlacementRequest.version by 1, CapitalBudget.version by 1"
      - from: "status IN {DRAFT, SITE_ASSESSED, PERMIT_PENDING, PERMITTED, SCHEDULED}"
        to: WITHDRAWN
        trigger: "POST /facilities/placement-requests/{id}/withdraw"
        actor: FacilitiesPlanner
        preconditions:
          - "request.status IN {DRAFT, SITE_ASSESSED, PERMIT_PENDING, PERMITTED, SCHEDULED}"
        side_effects:
          - "releases encumbered_cost_cents back from CapitalBudget.encumbered_cents, zeroes encumbered_cost_cents and recomputes uncommitted_cents"
          - "the referenced PortableUnit returns allocation_status to IN_STORAGE and PlacementSite.occupied_by_unit_id is cleared"
          - "every InstallationSchedule of the request whose status IN {PLANNED, IN_PROGRESS} moves to CANCELLED with cancellation_reason 'REQUEST_WITHDRAWN'"
          - "increments PlacementRequest.version by 1 and CapitalBudget.version by 1"

  # -------------------------------------------------------------- permit ----
  - entity: Permit
    initial_state: SUBMITTED
    terminal_states: [APPROVED, DENIED]
    note: "Cyclic: SUBMITTED -> CORRECTIONS_REQUIRED -> SUBMITTED, unbounded review cycles."
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /facilities/permits/{id}/decision with decision=APPROVED"
        actor: BuildingOfficial
        preconditions:
          - "permit.status == SUBMITTED"
          - "the owning PlacementRequest.status == PERMIT_PENDING"
        side_effects:
          - "sets approved_on from the logical clock"
          - "cascade link 1 of the permit-approval chain: when every Permit of the request is now APPROVED, the request auto-transitions PERMIT_PENDING -> PERMITTED"
          - "increments Permit.version by 1"
      - from: SUBMITTED
        to: CORRECTIONS_REQUIRED
        trigger: "POST /facilities/permits/{id}/decision with decision=CORRECTIONS_REQUIRED"
        actor: BuildingOfficial
        preconditions:
          - "permit.status == SUBMITTED"
          - "the owning PlacementRequest.status == PERMIT_PENDING"
          - "correction_note is supplied"
        side_effects:
          - "stores correction_note"
          - "increments Permit.version by 1"
      - from: CORRECTIONS_REQUIRED
        to: SUBMITTED
        trigger: "POST /facilities/permits/{id}/resubmit"
        actor: PermitCoordinator
        preconditions:
          - "permit.status == CORRECTIONS_REQUIRED"
          - "the owning PlacementRequest.status == PERMIT_PENDING"
        side_effects:
          - "increments review_cycle_count by 1 and refreshes submitted_on from the logical clock"
          - "increments Permit.version by 1"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /facilities/permits/{id}/decision with decision=DENIED"
        actor: BuildingOfficial
        preconditions:
          - "permit.status == SUBMITTED"
          - "the owning PlacementRequest.status == PERMIT_PENDING"
        side_effects:
          - "the owning PlacementRequest auto-transitions PERMIT_PENDING -> REJECTED (join arm B)"
          - "sibling Permits of the request keep their current status; no further decisions are accepted because the request is no longer PERMIT_PENDING"
          - "increments Permit.version by 1"

  # ---------------------------------------------------- installation schedule
  - entity: InstallationSchedule
    initial_state: PLANNED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: PLANNED
        to: IN_PROGRESS
        trigger: "POST /facilities/installation-schedules/{id}/start"
        actor: "OperationsScheduler | CrewLead"
        preconditions:
          - "schedule.status == PLANNED"
          - "when the actor is CrewLead, X-User-ID == schedule.installation_crew_id"
          - "the owning PlacementRequest.status == SCHEDULED"
        side_effects:
          - "increments InstallationSchedule.version by 1"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /facilities/installation-schedules/{id}/complete"
        actor: "OperationsScheduler | CrewLead"
        preconditions:
          - "schedule.status == IN_PROGRESS"
          - "when the actor is CrewLead, X-User-ID == schedule.installation_crew_id"
          - "the referenced PortableUnit.ada_ramp_installed == true AND the referenced PlacementSite.ada_path_of_travel_compliant == true (code compliance for the relocated unit)"
        side_effects:
          - "the owning PlacementRequest auto-transitions SCHEDULED -> INSTALLED, which moves the encumbrance to expended and drives the unit to INSTALLED and School.hosted_portable_seats upward"
          - "increments InstallationSchedule.version by 1"
      - from: "status IN {PLANNED, IN_PROGRESS}"
        to: CANCELLED
        trigger: "POST /facilities/installation-schedules/{id}/cancel"
        actor: OperationsScheduler
        preconditions:
          - "schedule.status IN {PLANNED, IN_PROGRESS}"
        side_effects:
          - "stores cancellation_reason"
          - "the owning PlacementRequest returns SCHEDULED -> PERMITTED so a new window may be booked; the encumbrance is untouched"
          - "increments InstallationSchedule.version by 1 and PlacementRequest.version by 1"

  # -------------------------------------------------------- placement site --
  - entity: PlacementSite
    initial_state: UNASSESSED
    terminal_states: []
    note: "Branching then cyclic: an assessed pad may be re-assessed against a different size class at any time, which re-enters the branch."
    transitions:
      - from: "feasibility_status IN {UNASSESSED, FEASIBLE, FEASIBLE_WITH_MITIGATION, INFEASIBLE}"
        to: FEASIBLE
        trigger: "POST /facilities/placement-sites/{id}/assess"
        actor: FacilitiesPlanner
        preconditions:
          - "calculation site_feasibility_assessment yields no INFEASIBLE reason and no mitigation flags"
          - "site.occupied_by_unit_id == null"
        side_effects:
          - "stores assessed_for_size_class, clears mitigation_flags and infeasible_reason, increments PlacementSite.version by 1"
      - from: "feasibility_status IN {UNASSESSED, FEASIBLE, FEASIBLE_WITH_MITIGATION, INFEASIBLE}"
        to: FEASIBLE_WITH_MITIGATION
        trigger: "POST /facilities/placement-sites/{id}/assess"
        actor: FacilitiesPlanner
        preconditions:
          - "calculation site_feasibility_assessment yields no INFEASIBLE reason and at least one mitigation flag"
          - "site.occupied_by_unit_id == null"
        side_effects:
          - "stores assessed_for_size_class and the ordered mitigation_flags, clears infeasible_reason, increments PlacementSite.version by 1"
      - from: "feasibility_status IN {UNASSESSED, FEASIBLE, FEASIBLE_WITH_MITIGATION, INFEASIBLE}"
        to: INFEASIBLE
        trigger: "POST /facilities/placement-sites/{id}/assess"
        actor: FacilitiesPlanner
        preconditions:
          - "calculation site_feasibility_assessment yields infeasible_reason PAD_TOO_SMALL or FIRE_ACCESS"
          - "site.occupied_by_unit_id == null"
        side_effects:
          - "stores assessed_for_size_class, infeasible_reason and empty mitigation_flags, increments PlacementSite.version by 1"

# ===========================================================================
# 1.2.1 Concurrency Rules  (OCC on the parent's version only)
# ===========================================================================
concurrency_rules:
  - rule_id: study-create-stale-school
    parent_entity: School
    write_endpoint: "POST /facilities/capacity-studies"
    occ_field: "expected_school_version"
    description: |
      Creating a CapacityStudy against a School whose version has advanced
      since the client last observed it is rejected. Because a newly created
      study legitimately supersedes any existing DRAFT or RETURNED study for
      the same school_year, a create issued from a stale view of the campus
      would silently discard planning work the client never saw; the stale
      version check forces the planner to re-read the campus first.
    error_id: ERR_STALE_SCHOOL_VERSION
    http_status: 412
  - rule_id: request-create-stale-study
    parent_entity: CapacityStudy
    write_endpoint: "POST /facilities/placement-requests"
    occ_field: "expected_study_version"
    description: |
      Creating a PlacementRequest against a CapacityStudy whose version has
      advanced since the client last observed it is rejected. Several requests
      against one study are legitimate, so the second create is not blocked by
      any state precondition; the stale version check is what stops a request
      from being sized against a seat_deficit the study no longer reports.
    error_id: ERR_STALE_STUDY_VERSION
    http_status: 412

# ===========================================================================
# 1.3 Calculation Rules Table
# ===========================================================================
calculations:
  - name: program_capacity_seats
    trigger: "on POST /facilities/capacity-studies/{id}/submit (frozen onto the study) and on every GET /facilities/capacity-studies/{id}/capacity-breakdown (both variants recomputed live)"
    algorithm: aggregation
    formula: |
      # --- room loading ---------------------------------------------------
      rooms = Room WHERE school_id == study.school_id AND status == IN_SERVICE
              # OUT_OF_SERVICE_RENOVATION and DECOMMISSIONED rooms are excluded
      policy = ClassSizePolicy WHERE id == study.class_size_policy_id   # pinned at create

      # variant DISTRICT_POLICY (area driven)
      district_seats(room):
        STANDARD_CLASSROOM -> min(policy.max_class_size,
                                  floor(room.area_sqft / policy.min_area_sqft_per_seat))
        SCIENCE_LAB        -> min(policy.max_class_size,
                                  floor(room.area_sqft /
                                        (policy.min_area_sqft_per_seat + policy.lab_area_premium_sqft)))
        SPED_RESOURCE      -> SPED_FIXED_SEATS
        ART_MUSIC          -> floor( min(policy.max_class_size,
                                         floor(room.area_sqft / policy.min_area_sqft_per_seat))
                                     * ART_MUSIC_LOADING_FACTOR )
        GYM | LIBRARY | ADMIN -> 0

      # variant STATE_LOADING_STANDARD (fixed loading, area ignored)
      state_seats(room) = STATE_LOADING[room.room_type]

      gross_room_seats = sum(loading(room) for room in rooms)      # loading per variant

      # --- special program set-asides -------------------------------------
      set_asides = ProgramSetAside WHERE school_id == study.school_id
                   AND (variant == DISTRICT_POLICY
                        OR program_type == SPED_SELF_CONTAINED)    # state method honours SPED only
      set_aside_deduction_seats =
        sum( min(sa.reserved_room_count,
                 count(rooms WHERE room_type == sa.reserved_room_type))
             * sa.seats_excluded_per_room
             for sa in set_asides )

      program_capacity_seats = max(0, gross_room_seats - set_aside_deduction_seats)
    input_set: "Room rows of the study's school with status == IN_SERVICE only; ProgramSetAside rows of the same school, filtered to SPED_SELF_CONTAINED under the STATE_LOADING_STANDARD variant and unfiltered under DISTRICT_POLICY"
    constants:
      SPED_FIXED_SEATS: 12
      ART_MUSIC_LOADING_FACTOR: 0.50
      STATE_LOADING:
        STANDARD_CLASSROOM: 25
        SCIENCE_LAB: 24
        SPED_RESOURCE: 12
        ART_MUSIC: 25
        GYM: 0
        LIBRARY: 0
        ADMIN: 0
      PRIMARY_BAND:
        ELEMENTARY_K5: K_3
        MIDDLE_68: G7_8
        HIGH_912: G9_12
        K8_COMBINED: G4_6
    precision: "integer seats; every division floors, never rounds"
    variants:
      - name: DISTRICT_POLICY
        when: "study.method == DISTRICT_POLICY"
        difference: "area-driven loading capped by policy.max_class_size, science labs pay the lab area premium, art/music rooms load at 50 percent, and every ProgramSetAside deducts"
      - name: STATE_LOADING_STANDARD
        when: "study.method == STATE_LOADING_STANDARD"
        difference: "fixed statewide loading factors per room type ignore area entirely, and only SPED_SELF_CONTAINED set-asides deduct"

  - name: utilization_and_portable_need
    trigger: "on POST /facilities/capacity-studies/{id}/submit (frozen onto the study) and on every GET /facilities/capacity-studies/{id}/capacity-breakdown"
    algorithm: threshold
    formula: |
      grades = GRADE_SET[School.grade_configuration]

      # one projection per grade: newest wins
      for g in grades:
        candidates = EnrollmentProjection
                     WHERE school_id == study.school_id
                       AND school_year == study.school_year
                       AND grade_level == g
                       AND (study.method == DISTRICT_POLICY
                            OR source == COHORT_SURVIVAL)     # state method drops DEVELOPER_YIELD
        selected[g] = candidates ordered by created_at DESC,
                                          then projected_students DESC   # value-deterministic tie-break
                      -> first row
      projected_enrollment_total = sum(selected[g].projected_students for g in grades)

      utilization_pct = round_half_up(projected_enrollment_total * 100
                                      / program_capacity_seats, 1)
      portable_trigger_met  = (utilization_pct >= PORTABLE_TRIGGER_PCT)    # >= not >
      effective_capacity    = floor(program_capacity_seats * TARGET_UTILIZATION_PCT / 100)
      seat_deficit          = portable_trigger_met
                              ? max(0, projected_enrollment_total - effective_capacity)
                              : 0
      required_portable_count = ceil(seat_deficit / STANDARD_PORTABLE_SEATS)
    input_set: "EnrollmentProjection rows matching (school_id, school_year, grade_level in GRADE_SET); DEVELOPER_YIELD rows are excluded when study.method == STATE_LOADING_STANDARD. Exactly one row per grade enters the sum, the newest by created_at DESC with projected_students DESC as the value-deterministic tie-break"
    constants:
      PORTABLE_TRIGGER_PCT: 95.0
      TARGET_UTILIZATION_PCT: 95
      STANDARD_PORTABLE_SEATS: 24
      GRADE_SET:
        ELEMENTARY_K5: [0, 1, 2, 3, 4, 5]
        MIDDLE_68: [6, 7, 8]
        HIGH_912: [9, 10, 11, 12]
        K8_COMBINED: [0, 1, 2, 3, 4, 5, 6, 7, 8]
    precision: "utilization_pct to 1 decimal, round_half_up; effective_capacity floors; required_portable_count ceils"
    variants:
      - name: DISTRICT_POLICY
        when: "study.method == DISTRICT_POLICY"
        difference: "counts both COHORT_SURVIVAL and DEVELOPER_YIELD projections, so a later developer-yield row displaces the cohort row for that grade"
      - name: STATE_LOADING_STANDARD
        when: "study.method == STATE_LOADING_STANDARD"
        difference: "counts COHORT_SURVIVAL rows only, so the grade falls back to the newest cohort-survival row"

  - name: site_feasibility_assessment
    trigger: "on POST /facilities/placement-sites/{id}/assess"
    algorithm: constraint_propagation
    formula: |
      sc   = candidate_size_class supplied in the request, else DEFAULT_SIZE_CLASS
      dims = UNIT_DIMS[sc]

      required_length_ft = dims.length_ft + 2 * PAD_CLEARANCE_FT
      required_width_ft  = dims.width_ft  + 2 * PAD_CLEARANCE_FT

      # step 1 - geometry (hard fail, evaluated first)
      if site.pad_length_ft < required_length_ft
         or site.pad_width_ft < required_width_ft:
             feasibility_status = INFEASIBLE ; infeasible_reason = PAD_TOO_SMALL
             mitigation_flags  = [] ; STOP

      # step 2 - fire access (hard fail, inclusive boundary)
      if site.distance_to_fire_lane_ft > FIRE_ACCESS_MAX_DISTANCE_FT
         or School.fire_lane_clear_width_ft < FIRE_LANE_MIN_CLEAR_WIDTH_FT:
             feasibility_status = INFEASIBLE ; infeasible_reason = FIRE_ACCESS
             mitigation_flags  = [] ; STOP

      # step 3 - mitigations, appended in this fixed order
      flags = []
      if site.electrical_drop_available_kw < dims.service_kw: flags += [ELECTRICAL_UPGRADE]
      if dims.needs_sewer and not site.sewer_connection_available: flags += [SEWER_HOOKUP]
      if not site.ada_path_of_travel_compliant: flags += [ADA_PATH_UPGRADE]

      feasibility_status = flags == [] ? FEASIBLE : FEASIBLE_WITH_MITIGATION
      mitigation_flags   = flags ; infeasible_reason = null
    input_set: "the single PlacementSite named in the path plus its School; no other rows participate"
    constants:
      PAD_CLEARANCE_FT: 5
      FIRE_ACCESS_MAX_DISTANCE_FT: 150
      FIRE_LANE_MIN_CLEAR_WIDTH_FT: 20
      DEFAULT_SIZE_CLASS: SINGLE_24x40
      UNIT_DIMS:
        SINGLE_24x40: { length_ft: 40, width_ft: 24, service_kw: 12, needs_sewer: false, rated_seats: 24 }
        DOUBLE_28x64: { length_ft: 64, width_ft: 28, service_kw: 20, needs_sewer: true, rated_seats: 48 }
        TRIPLE_36x64: { length_ft: 64, width_ft: 36, service_kw: 28, needs_sewer: true, rated_seats: 60 }
    precision: "exact comparisons on feet and kW; distance_to_fire_lane_ft == 150 passes, 150.1 fails"

  - name: relocation_cost_estimate
    trigger: "on POST /facilities/placement-requests, on POST /facilities/placement-requests/{id}/auto-assign-unit, and on every GET /facilities/placement-requests/{id}/cost-model"
    algorithm: tiered_pricing
    formula: |
      unit = PortableUnit[request.portable_unit_id]     # null unit -> estimate is 0
      site = PlacementSite[request.placement_site_id]
      dims = UNIT_DIMS[unit.size_class]

      # step 1 mobilisation
      mobilisation_cents = MOVE_BASE_CENTS[unit.size_class]
                           + HAUL_RATE_CENTS_PER_MILE * request.haul_miles

      # step 2 off-summer escalation applies to mobilisation ONLY, before any
      #        other component is added, and is rounded to whole cents here
      in_summer = requested_window_start >= (year(requested_window_start) + '-' + SUMMER_WINDOW_START)
                  AND requested_window_end <= (year(requested_window_end) + '-' + SUMMER_WINDOW_END)
                  AND year(requested_window_start) == year(requested_window_end)
      if not in_summer:
          mobilisation_cents = round_half_up(mobilisation_cents * OFF_SUMMER_MULTIPLIER)

      # step 3 site work, conditional on the actual unit/pad pair
      site_work_cents = (site.electrical_drop_available_kw < dims.service_kw ? ELECTRICAL_UPGRADE_CENTS : 0)
                      + ((dims.needs_sewer and not site.sewer_connection_available) ? SEWER_HOOKUP_CENTS : 0)
                      + ((not unit.ada_ramp_installed or not site.ada_path_of_travel_compliant) ? ADA_RETROFIT_CENTS : 0)

      # step 4 rehab, keyed on condition grade (grade D never reaches here)
      rehab_cents = REHAB_CENTS_BY_GRADE[unit.condition_grade]

      # step 5 permit fees over the required permit set
      permit_count_est = 3
                       + ((dims.needs_sewer and not site.sewer_connection_available) ? 1 : 0)
                       + ((not unit.ada_ramp_installed or not site.ada_path_of_travel_compliant) ? 1 : 0)
      permit_fee_cents = PERMIT_FEE_CENTS_PER_TYPE * permit_count_est

      # step 6/7 direct cost then the clamped contingency (nested max/min)
      direct_cost_cents = mobilisation_cents + site_work_cents + rehab_cents + permit_fee_cents
      contingency_cents = max(CONTINGENCY_FLOOR_CENTS,
                              min(CONTINGENCY_CAP_CENTS,
                                  round_half_up(CONTINGENCY_PCT * direct_cost_cents)))

      estimated_relocation_cost_cents = direct_cost_cents + contingency_cents
    input_set: "the single PlacementRequest plus its PortableUnit and PlacementSite; when portable_unit_id is null every component is 0"
    constants:
      MOVE_BASE_CENTS: { SINGLE_24x40: 4500000, DOUBLE_28x64: 7200000, TRIPLE_36x64: 9800000 }
      HAUL_RATE_CENTS_PER_MILE: 38000
      ELECTRICAL_UPGRADE_CENTS: 1850000
      SEWER_HOOKUP_CENTS: 2400000
      ADA_RETROFIT_CENTS: 3150000
      REHAB_CENTS_BY_GRADE: { A: 0, B: 1250000, C: 4600000 }
      OFF_SUMMER_MULTIPLIER: 1.35
      CONTINGENCY_PCT: 0.12
      CONTINGENCY_FLOOR_CENTS: 700000
      CONTINGENCY_CAP_CENTS: 1500000
      PERMIT_FEE_CENTS_PER_TYPE: 210000
      SUMMER_WINDOW_START: "06-15"
      SUMMER_WINDOW_END: "08-15"
    precision: "integer cents; the only rounding points are the off-summer escalation in step 2 and the contingency in step 7, both round_half_up, in that order"

  - name: alternative_cost_comparison
    trigger: "on POST /facilities/placement-requests and POST /facilities/placement-requests/{id}/auto-assign-unit (stored under the default LIFECYCLE_20YR basis), and on every GET /facilities/placement-requests/{id}/cost-model with the basis query parameter"
    algorithm: waterfall_allocation
    formula: |
      study   = CapacityStudy[request.capacity_study_id]
      deficit = study.seat_deficit
      units   = study.required_portable_count
      per_unit_relocation = calculation relocation_cost_estimate for this request

      # ---- direct cost of each option -----------------------------------
      if basis == LIFECYCLE_20YR:
          relocation_direct_cents = units * ( per_unit_relocation
                                              + ANNUAL_PORTABLE_OM_CENTS * RELIANCE_HORIZON_YEARS
                                              + REMOVAL_CENTS_BY_SIZE[unit.size_class] )
      else:   # IMMEDIATE_CAPITAL
          relocation_direct_cents = units * per_unit_relocation

      boundary_change_direct_cents = BOUNDARY_STUDY_FIXED_CENTS
                                     + BOUNDARY_TRANSPORT_CENTS_PER_SEAT_PER_YEAR
                                       * deficit * BOUNDARY_HORIZON_YEARS
      permanent_addition_direct_cents = ADDITION_CENTS_PER_SEAT * deficit

      # ---- soft cost: PINNED EVALUATION ORDER ---------------------------
      # total = direct + soft, and soft is a percentage that depends on a cost
      # tier. The tier is ALWAYS selected from direct_cents, never from the
      # total. Reading the tier off the total is circular and is NOT the rule.
      soft_pct(direct) = direct <  50_000_000 -> 0.09
                         direct < 150_000_000 -> 0.13
                         otherwise            -> 0.17
      total_program_cost(direct):
          pct   = soft_pct(direct)                      # 1. tier from direct
          soft  = round_half_up(pct * direct)           # 2. soft from direct
          return direct + soft                          # 3. total last

      # ---- recommendation ------------------------------------------------
      candidates = { RELOCATE:           total_program_cost(relocation_direct_cents),
                     BOUNDARY_CHANGE:    total_program_cost(boundary_change_direct_cents),
                     PERMANENT_ADDITION: total_program_cost(permanent_addition_direct_cents) }
      if School.consecutive_reliance_years >= LONG_TERM_RELIANCE_YEARS:
          candidates = candidates without RELOCATE     # eligibility filter
      cost_recommendation = candidate with the smallest total;
                            ties broken by the fixed option order
                            RELOCATE > BOUNDARY_CHANGE > PERMANENT_ADDITION
      # the candidate set can never be empty: two options always survive
    input_set: "the request's own relocation estimate, the seat_deficit and required_portable_count frozen on the referenced CapacityStudy, and School.consecutive_reliance_years"
    constants:
      ANNUAL_PORTABLE_OM_CENTS: 1150000
      RELIANCE_HORIZON_YEARS: 20
      REMOVAL_CENTS_BY_SIZE: { SINGLE_24x40: 1600000, DOUBLE_28x64: 2300000, TRIPLE_36x64: 2900000 }
      BOUNDARY_STUDY_FIXED_CENTS: 4200000
      BOUNDARY_TRANSPORT_CENTS_PER_SEAT_PER_YEAR: 96000
      BOUNDARY_HORIZON_YEARS: 5
      ADDITION_CENTS_PER_SEAT: 3850000
      SOFT_COST_TIER_BREAKS_CENTS: [50000000, 150000000]
      SOFT_COST_PCTS: [0.09, 0.13, 0.17]
      LONG_TERM_RELIANCE_YEARS: 5
    precision: "integer cents; the single rounding point is the soft cost, round_half_up, applied to direct only"
    variants:
      - name: LIFECYCLE_20YR
        when: "basis query parameter absent or LIFECYCLE_20YR; this is the variant stored on the request"
        difference: "relocation carries 20 years of operations and maintenance plus the eventual removal cost, which usually pushes it into a higher soft-cost tier and can flip the recommendation away from RELOCATE"
      - name: IMMEDIATE_CAPITAL
        when: "basis query parameter is IMMEDIATE_CAPITAL"
        difference: "relocation carries only the up-front move cost, so the same request can recommend RELOCATE while the lifecycle basis recommends BOUNDARY_CHANGE"

  - name: unit_salvage_value
    trigger: "on POST /facilities/disposal-records"
    algorithm: decay_function
    formula: |
      age_years = year(logical_clock_now) - unit.in_service_year
      straight_line_factor = max(SALVAGE_FLOOR_PCT, 1 - age_years / USEFUL_LIFE_YEARS)
      straight_line_cents  = round_half_up(unit.acquisition_cost_cents * straight_line_factor)
      floor_cents          = round_half_up(unit.acquisition_cost_cents * SALVAGE_FLOOR_PCT)

      if valuation_basis == STRAIGHT_LINE:
          salvage_value_cents = straight_line_cents
      else:   # CONDITION_ADJUSTED
          salvage_value_cents = max(floor_cents,
                                    round_half_up(straight_line_cents
                                                  * CONDITION_MULTIPLIER[unit.condition_grade]))

      net_disposal_result_cents = proceeds_cents - salvage_value_cents
    input_set: "the single PortableUnit named by portable_unit_id and the logical clock; no other rows participate"
    constants:
      USEFUL_LIFE_YEARS: 20
      SALVAGE_FLOOR_PCT: 0.05
      CONDITION_MULTIPLIER: { A: 1.00, B: 0.80, C: 0.55, D: 0.25 }
      MIN_SALE_RECOVERY_PCT: 0.70
    precision: "integer cents, round_half_up; the straight-line figure is rounded before the condition multiplier is applied, never after"
    variants:
      - name: STRAIGHT_LINE
        when: "disposal_record.valuation_basis == STRAIGHT_LINE"
        difference: "pure age-based book value with a 5 percent floor; ignores condition entirely"
      - name: CONDITION_ADJUSTED
        when: "disposal_record.valuation_basis == CONDITION_ADJUSTED"
        difference: "multiplies the rounded straight-line figure by the condition multiplier and re-floors at 5 percent of acquisition, so the same unit and the same proceeds can pass the sale-recovery test on one basis and fail it on the other"

  - name: reliance_metrics
    trigger: "on study certification, on POST /facilities/portable-units/{id}/record-existing-placement, on install completion, on decommission completion (School.reliance_flag), and on every GET /facilities/schools/{id}/reliance-report and GET /facilities/reliance-summary"
    algorithm: weighted_scoring
    formula: |
      # ---- per school ----------------------------------------------------
      certified = CapacityStudy WHERE school_id == school.id AND status == CERTIFIED
                  ordered by school_year DESC, then created_at DESC -> first row
      if certified is null: the report endpoint fails with ERR_NO_CERTIFIED_STUDY
      permanent_seats = certified.program_capacity_seats
      hosted          = school.hosted_portable_seats

      portable_seat_share_pct = round_half_up(hosted * 100
                                              / (permanent_seats + hosted), 1)

      reliance_flag =
        (portable_seat_share_pct >= LONG_TERM_SHARE_PCT
         or school.consecutive_reliance_years >= LONG_TERM_RELIANCE_YEARS) -> LONG_TERM_RELIANCE
        (portable_seat_share_pct >= MONITOR_SHARE_PCT)                     -> MONITOR
        otherwise                                                          -> NONE
      narrative_required = (reliance_flag == LONG_TERM_RELIANCE)

      # ---- district roll-up: ROUND PER SCHOOL, THEN AVERAGE --------------
      # PINNED ORDER. Each campus share is rounded to 1 decimal FIRST, then the
      # rounded values are averaged and the average is rounded to 1 decimal.
      # Pooling district-wide seats and rounding once is explicitly NOT the
      # rule and yields a different number.
      qualifying = School WHERE certified_study_id != null
      if qualifying is empty:
          district_average_portable_share_pct = 0.0
      else:
          district_average_portable_share_pct =
            round_half_up( sum(portable_seat_share_pct(s) for s in qualifying)
                           / count(qualifying), 1 )
      long_term_reliance_school_count = count(s in qualifying
                                              where reliance_flag(s) == LONG_TERM_RELIANCE)
    input_set: "Schools whose certified_study_id is not null; for each, its latest CERTIFIED CapacityStudy by school_year DESC then created_at DESC, and its current hosted_portable_seats"
    constants:
      MONITOR_SHARE_PCT: 5.0
      LONG_TERM_SHARE_PCT: 15.0
      LONG_TERM_RELIANCE_YEARS: 5
    precision: "percentages to 1 decimal, round_half_up, applied per school before the district average and again to the average"

  - name: budget_partition
    trigger: "on every mutation of CapitalBudget.encumbered_cents or CapitalBudget.expended_cents (request PERMITTED, request WITHDRAWN, install completion, decommission completion)"
    algorithm: aggregation
    formula: |
      encumbered_cents = sum(PlacementRequest.encumbered_cost_cents
                             for requests WHERE capital_budget_id == budget.id
                                            AND status IN {PERMITTED, SCHEDULED})
      expended_cents   = previous expended_cents
                         + (install completion   ? request.encumbered_cost_cents : 0)
                         + (decommission finish  ? REMOVAL_CENTS_BY_SIZE[unit.size_class] : 0)
      uncommitted_cents = authorized_cents - encumbered_cents - expended_cents

      # INVARIANT capital_budget_partition (must hold after every mutation):
      #   authorized_cents == uncommitted_cents + encumbered_cents + expended_cents
    input_set: "PlacementRequest rows charged to this budget whose status IN {PERMITTED, SCHEDULED} for the encumbered bucket; expended_cents is a monotone accumulator that never decreases"
    constants:
      REMOVAL_CENTS_BY_SIZE: { SINGLE_24x40: 1600000, DOUBLE_28x64: 2300000, TRIPLE_36x64: 2900000 }
    precision: "integer cents; no rounding occurs in this calculation"

  - name: eligible_unit_selection
    trigger: "on POST /facilities/placement-requests/{id}/auto-assign-unit"
    algorithm: chronological
    formula: |
      # eligibility filter (explicit predicate over entity fields)
      candidates = PortableUnit WHERE allocation_status == IN_STORAGE
                                  AND condition_status == SERVICEABLE
                                  AND condition_grade IN {A, B, C}
                                  AND lifetime_relocation_count < MAX_LIFETIME_RELOCATIONS
                                  AND rated_seats >= MIN_SEATS_PER_UNIT
                                  AND UNIT_DIMS[size_class].length_ft + 2 * PAD_CLEARANCE_FT
                                        <= site.pad_length_ft
                                  AND UNIT_DIMS[size_class].width_ft + 2 * PAD_CLEARANCE_FT
                                        <= site.pad_width_ft
      # ranking expression, then tie-breaks, all over entity fields only
      order by accumulated_relocation_cost_cents ASC,
               CONDITION_GRADE_RANK[condition_grade] ASC,     # A=1, B=2, C=3
               rated_seats DESC,
               created_at ASC                                 # final tie-break, never id
      selected = first row
      if candidates is empty: fail with ERR_NO_ELIGIBLE_UNIT   # empty-pool fallback
    input_set: "all PortableUnit rows district-wide passing the eligibility filter, evaluated against the request's PlacementSite geometry"
    constants:
      MAX_LIFETIME_RELOCATIONS: 4
      MIN_SEATS_PER_UNIT: 24
      PAD_CLEARANCE_FT: 5
      CONDITION_GRADE_RANK: { A: 1, B: 2, C: 3 }
    precision: "integer comparisons only"

# ===========================================================================
# 1.4 Validation Rules Table (ordered by priority)
# ===========================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and X-User-Role is one of the eight declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "the acting role appears in the endpoint's roles list"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all
  - priority: 3
    category: auth
    check: "when the acting role is CrewLead, X-User-ID equals InstallationSchedule.installation_crew_id of the target schedule"
    error_id: ERR_CREW_NOT_ASSIGNED
    http_status: 403
    applies_to: "POST /facilities/installation-schedules/{id}/start, POST /facilities/installation-schedules/{id}/complete"
  - priority: 4
    category: existence
    check: "every id in the request path resolves, validated left to right"
    error_id: "ERR_SCHOOL_NOT_FOUND | ERR_ROOM_NOT_FOUND | ERR_SET_ASIDE_NOT_FOUND | ERR_PROJECTION_NOT_FOUND | ERR_STUDY_NOT_FOUND | ERR_UNIT_NOT_FOUND | ERR_SITE_NOT_FOUND | ERR_REQUEST_NOT_FOUND | ERR_PERMIT_NOT_FOUND | ERR_SCHEDULE_NOT_FOUND | ERR_BUDGET_NOT_FOUND | ERR_DISPOSAL_NOT_FOUND"
    http_status: 404
    applies_to: "all path-parameterised endpoints"
  - priority: 5
    category: existence
    check: "every foreign key in the request body resolves, validated in the order the fields are declared on the entity in 1.1"
    error_id: "ERR_SCHOOL_NOT_FOUND | ERR_POLICY_NOT_FOUND | ERR_STUDY_NOT_FOUND | ERR_SITE_NOT_FOUND | ERR_UNIT_NOT_FOUND | ERR_BUDGET_NOT_FOUND | ERR_CREW_NOT_FOUND | ERR_REQUEST_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with body foreign keys"
  - priority: 6
    category: business_constraint
    check: "required body fields are present, types match, enum members are legal, numeric ranges hold, and dates parse as YYYY-MM-DD"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: all
  - priority: 7
    category: business_constraint
    check: "limit is an integer in 1..100 and offset is an integer >= 0"
    error_id: ERR_INVALID_PAGINATION
    http_status: 422
    applies_to: "all list endpoints"
  - priority: 8
    category: business_constraint
    check: "expected_school_version equals School.version at the moment of the write"
    error_id: ERR_STALE_SCHOOL_VERSION
    http_status: 412
    applies_to: "POST /facilities/capacity-studies"
  - priority: 9
    category: business_constraint
    check: "expected_study_version equals CapacityStudy.version at the moment of the write"
    error_id: ERR_STALE_STUDY_VERSION
    http_status: 412
    applies_to: "POST /facilities/placement-requests"
  - priority: 10
    category: state
    check: "the target entity is in a state from which the requested transition is declared in 1.2"
    error_id: "ERR_STUDY_STATE_INVALID | ERR_REQUEST_STATE_INVALID | ERR_PERMIT_STATE_INVALID | ERR_SCHEDULE_STATE_INVALID | ERR_UNIT_STATE_INVALID"
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 11
    category: state
    check: "the CapacityStudy referenced by the request has status == CERTIFIED"
    error_id: ERR_STUDY_NOT_CERTIFIED
    http_status: 409
    applies_to: "POST /facilities/placement-requests/{id}/assess-site"
  - priority: 12
    category: state
    check: "the PlacementRequest referenced by the schedule has status == PERMITTED and no sibling schedule is PLANNED, IN_PROGRESS or COMPLETED"
    error_id: ERR_REQUEST_NOT_PERMITTED
    http_status: 409
    applies_to: "POST /facilities/installation-schedules"
  - priority: 13
    category: state
    check: "the PortableUnit is IN_STORAGE and either condition_status == UNSAFE or condition_grade == D, and no DisposalRecord already references it"
    error_id: ERR_UNIT_NOT_DISPOSABLE
    http_status: 409
    applies_to: "POST /facilities/disposal-records"
  - priority: 14
    category: business_safety
    check: "the acting X-User-ID differs from CapacityStudy.authored_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /facilities/capacity-studies/{id}/certify, POST /facilities/capacity-studies/{id}/return"
  - priority: 15
    category: business_safety
    check: "the referenced PortableUnit.condition_status == SERVICEABLE"
    error_id: ERR_UNIT_NOT_SERVICEABLE
    http_status: 422
    applies_to: "POST /facilities/placement-requests, POST /facilities/placement-requests/{id}/auto-assign-unit, POST /facilities/placement-requests/{id}/assess-site, POST /facilities/placement-requests/{id}/submit-permits"
  - priority: 16
    category: business_safety
    check: "the referenced PortableUnit.condition_grade != D"
    error_id: ERR_UNIT_GRADE_NOT_PLACEABLE
    http_status: 422
    applies_to: "POST /facilities/placement-requests"
  - priority: 17
    category: business_safety
    check: "PlacementSite.distance_to_fire_lane_ft <= 150 and School.fire_lane_clear_width_ft >= 20. Checked ahead of the feasibility gate at priority 18 so that a pad which was assessed INFEASIBLE for fire access reports the specific fire-access failure rather than the generic feasibility failure"
    error_id: ERR_FIRE_ACCESS_NONCOMPLIANT
    http_status: 422
    applies_to: "POST /facilities/placement-requests/{id}/assess-site"
  - priority: 18
    category: business_safety
    check: "the referenced PlacementSite.feasibility_status IN {FEASIBLE, FEASIBLE_WITH_MITIGATION} and assessed_for_size_class equals the assigned unit's size_class"
    error_id: ERR_SITE_NOT_FEASIBLE
    http_status: 422
    applies_to: "POST /facilities/placement-requests/{id}/assess-site"
  - priority: 19
    category: business_safety
    check: "the referenced PortableUnit.ada_ramp_installed == true and the referenced PlacementSite.ada_path_of_travel_compliant == true"
    error_id: ERR_ADA_NONCOMPLIANT
    http_status: 422
    applies_to: "POST /facilities/installation-schedules/{id}/complete"
  - priority: 20
    category: business_referential
    check: "PlacementSite.school_id equals the school_id of the CapacityStudy named by capacity_study_id"
    error_id: ERR_SITE_SCHOOL_MISMATCH
    http_status: 422
    applies_to: "POST /facilities/placement-requests"
  - priority: 21
    category: business_referential
    check: "ClassSizePolicy.grade_band equals PRIMARY_BAND[School.grade_configuration]"
    error_id: ERR_POLICY_BAND_MISMATCH
    http_status: 422
    applies_to: "POST /facilities/capacity-studies, POST /facilities/capacity-studies/{id}/submit"
  - priority: 22
    category: business_referential
    check: "ClassSizePolicy.effective_school_year equals CapacityStudy.school_year"
    error_id: ERR_POLICY_YEAR_MISMATCH
    http_status: 422
    applies_to: "POST /facilities/capacity-studies, POST /facilities/capacity-studies/{id}/submit"
  - priority: 23
    category: business_referential
    check: "ProgramSetAside.school_id equals Room.school_id for every room the set-aside consumes, and the target PlacementSite.school_id equals the school_id supplied for a legacy placement"
    error_id: ERR_SITE_SCHOOL_MISMATCH
    http_status: 422
    applies_to: "POST /facilities/portable-units/{id}/record-existing-placement"
  - priority: 24
    category: business_referential
    check: "the Permit's owning PlacementRequest.status == PERMIT_PENDING"
    error_id: ERR_PERMIT_REQUEST_NOT_PENDING
    http_status: 409
    applies_to: "POST /facilities/permits/{id}/decision, POST /facilities/permits/{id}/resubmit"
  - priority: 25
    category: business_constraint
    check: "every grade_level in GRADE_SET[School.grade_configuration] has at least one EnrollmentProjection surviving the method source filter"
    error_id: ERR_PROJECTION_COVERAGE_GAP
    http_status: 422
    applies_to: "POST /facilities/capacity-studies/{id}/submit"
  - priority: 26
    category: business_constraint
    check: "program_capacity_seats computed under the study's method is greater than 0"
    error_id: ERR_ZERO_PROGRAM_CAPACITY
    http_status: 422
    applies_to: "POST /facilities/capacity-studies/{id}/submit"
  - priority: 27
    category: business_constraint
    check: "no selected EnrollmentProjection has confidence_tier == LOW when study.method == DISTRICT_POLICY"
    error_id: ERR_LOW_CONFIDENCE_PROJECTION
    http_status: 422
    applies_to: "POST /facilities/capacity-studies/{id}/certify"
  - priority: 28
    category: business_constraint
    check: "CapacityStudy.revision_round is strictly less than 3"
    error_id: ERR_REVISION_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /facilities/capacity-studies/{id}/reopen"
  - priority: 29
    category: business_constraint
    check: "PortableUnit.lifetime_relocation_count is strictly less than 4"
    error_id: ERR_UNIT_RELOCATION_LIMIT
    http_status: 422
    applies_to: "POST /facilities/placement-requests, POST /facilities/placement-requests/{id}/auto-assign-unit"
  - priority: 30
    category: business_constraint
    check: "pad geometry admits the unit: pad_length_ft >= unit length + 10 ft and pad_width_ft >= unit width + 10 ft"
    error_id: ERR_PAD_TOO_SMALL
    http_status: 422
    applies_to: "POST /facilities/placement-requests"
  - priority: 31
    category: business_constraint
    check: "the target PlacementSite has occupied_by_unit_id == null"
    error_id: ERR_SITE_OCCUPIED
    http_status: 409
    applies_to: "POST /facilities/placement-requests, POST /facilities/placement-sites/{id}/assess, POST /facilities/portable-units/{id}/record-existing-placement"
  - priority: 32
    category: business_constraint
    check: "uniqueness: ClassSizePolicy is unique on (grade_band, effective_school_year); Room is unique on (school_id, room_number); PortableUnit is unique on asset_tag; PlacementSite is unique on (school_id, pad_code)"
    error_id: "ERR_DUPLICATE_POLICY | ERR_DUPLICATE_ROOM | ERR_DUPLICATE_ASSET_TAG | ERR_DUPLICATE_PAD_CODE"
    http_status: 409
    applies_to: "POST /facilities/class-size-policies, POST /facilities/rooms, POST /facilities/portable-units, POST /facilities/placement-sites"
  - priority: 33
    category: business_constraint
    check: "the crew's certified_work_types contains the requested work_type"
    error_id: ERR_CREW_NOT_CERTIFIED
    http_status: 422
    applies_to: "POST /facilities/installation-schedules"
  - priority: 34
    category: business_temporal
    check: "window_end is not earlier than window_start on both the request window and the schedule window"
    error_id: ERR_INVALID_WINDOW
    http_status: 422
    applies_to: "POST /facilities/placement-requests, POST /facilities/installation-schedules"
  - priority: 35
    category: business_temporal
    check: "the schedule window lies entirely inside 06-15..08-15 of a single calendar year, unless off_summer_waiver == true"
    error_id: ERR_OUTSIDE_SUMMER_WINDOW
    http_status: 422
    applies_to: "POST /facilities/installation-schedules"
  - priority: 36
    category: business_temporal
    check: "off_summer_waiver may only be set true by DistrictAdmin"
    error_id: ERR_WAIVER_ROLE_REQUIRED
    http_status: 403
    applies_to: "POST /facilities/installation-schedules"
  - priority: 37
    category: business_temporal
    check: "window_start is not later than approved_on + 180 calendar days for every APPROVED Permit of the request"
    error_id: ERR_PERMIT_EXPIRED
    http_status: 409
    applies_to: "POST /facilities/installation-schedules"
  - priority: 38
    category: business_temporal
    check: "pad occupation, closed intervals with a 7 calendar day turnaround buffer on both sides: the new window conflicts with any schedule of another request on the same PlacementSite whose status IN {PLANNED, IN_PROGRESS} unless new_start > existing_end + 7 days or new_end < existing_start - 7 days"
    error_id: ERR_PAD_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /facilities/installation-schedules"
  - priority: 39
    category: business_temporal
    check: "crew capacity, half-open intervals [window_start, window_end) with adjacency permitted: the count of the crew's schedules with status IN {PLANNED, IN_PROGRESS} that satisfy new_start < existing_end AND existing_start < new_end must be strictly less than crew.max_concurrent_jobs"
    error_id: ERR_CREW_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /facilities/installation-schedules"
  - priority: 40
    category: business_fiscal
    check: "CapitalBudget.uncommitted_cents >= the amount about to be committed (estimated_relocation_cost_cents on the permit join, REMOVAL_CENTS_BY_SIZE on decommission completion)"
    error_id: ERR_BUDGET_INSUFFICIENT
    http_status: 409
    applies_to: "POST /facilities/permits/{id}/decision, POST /facilities/placement-requests/{id}/complete-decommission"
  - priority: 41
    category: business_fiscal
    check: "for method == SALE, proceeds_cents >= round_half_up(0.70 * salvage_value_cents); for SCRAP and TRANSFER_TO_COUNTY, proceeds_cents == 0"
    error_id: ERR_DISPOSAL_UNDERVALUED
    http_status: 422
    applies_to: "POST /facilities/disposal-records"

# ===========================================================================
# 1.5 API Endpoint Table
# ===========================================================================
endpoints:
  # ------------------------------------------------------- test driving ----
  - method: POST
    path: "/facilities/_clock/set_current_utc"
    description: "Sets the server logical clock. The startup default is exactly 2026-08-01T00:00:00Z and the logical clock never falls back to real wall-clock time; every date-derived rule (permit validity, summer window, salvage age, certification stamps) reads this clock."
    roles: [DistrictAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["all subsequent server-stamped timestamps and year derivations use the new value"]

  # ------------------------------------------------------------- schools ---
  - method: POST
    path: "/facilities/schools"
    description: "Onboards a campus."
    roles: [DistrictAdmin]
    code: 201
    input: [name, grade_configuration, site_acreage, fire_lane_clear_width_ft, electrical_spare_capacity_kw, sewer_spare_connections, "consecutive_reliance_years?"]
    output: School
    side_effects: ["hosted_portable_seats initialised to 0, reliance_flag to NONE, certified_study_id to null"]
  - method: GET
    path: "/facilities/schools/{id}"
    description: "Reads a campus including its derived hosted_portable_seats, reliance_flag and version."
    roles: [DistrictAdmin, FacilitiesPlanner, CapacityCertifier, PermitCoordinator, BuildingOfficial, OperationsScheduler, AssetManager]
    code: 200
    input: []
    output: School
    side_effects: []
  - method: GET
    path: "/facilities/schools/{id}/reliance-report"
    description: "Long-term reliance report for one campus, computed live by calculation reliance_metrics."
    roles: [DistrictAdmin, FacilitiesPlanner, CapacityCertifier, AssetManager]
    code: 200
    input: []
    output: "{ school_id: string, certified_study_id: string, permanent_seats: integer, hosted_portable_seats: integer, portable_seat_share_pct: number, consecutive_reliance_years: integer, reliance_flag: string, narrative_required: boolean }"
    side_effects: []
  - method: GET
    path: "/facilities/reliance-summary"
    description: "District-wide long-term reliance roll-up. Shares are rounded per campus first, then averaged, then rounded again."
    roles: [DistrictAdmin, FacilitiesPlanner, CapacityCertifier]
    code: 200
    input: []
    output: "{ qualifying_school_count: integer, district_average_portable_share_pct: number, long_term_reliance_school_count: integer, rounding_basis: string }"
    side_effects: []

  # -------------------------------------------------- class size policies --
  - method: GET
    path: "/facilities/class-size-policies/{id}"
    description: "Reads one class size policy."
    roles: [DistrictAdmin, FacilitiesPlanner, CapacityCertifier]
    code: 200
    input: []
    output: ClassSizePolicy
    side_effects: []
  - method: POST
    path: "/facilities/class-size-policies"
    description: "Publishes a class-size policy for one grade band and school year."
    roles: [DistrictAdmin]
    code: 201
    input: [grade_band, effective_school_year, max_class_size, min_area_sqft_per_seat, lab_area_premium_sqft]
    output: ClassSizePolicy
    side_effects: []

  # --------------------------------------------------------------- rooms ---
  - method: POST
    path: "/facilities/rooms"
    description: "Adds a room to the campus building program."
    roles: [DistrictAdmin]
    code: 201
    input: [school_id, room_number, room_type, area_sqft]
    output: Room
    side_effects: ["status initialised to IN_SERVICE"]
  - method: GET
    path: "/facilities/rooms/{id}"
    description: "Reads one room."
    roles: [DistrictAdmin, FacilitiesPlanner, CapacityCertifier, PermitCoordinator, BuildingOfficial, OperationsScheduler, AssetManager]
    code: 200
    input: []
    output: Room
    side_effects: []
  - method: GET
    path: "/facilities/rooms"
    description: "Lists rooms, optionally filtered by campus, type or service status."
    roles: [DistrictAdmin, FacilitiesPlanner, CapacityCertifier, PermitCoordinator, BuildingOfficial, OperationsScheduler, AssetManager]
    code: 200
    input: ["school_id?", "room_type?", "status?", "limit?", "offset?"]
    output: Room[]
    side_effects: []
  - method: PATCH
    path: "/facilities/rooms/{id}"
    description: "Changes a room's service status or assignable area."
    roles: [DistrictAdmin]
    code: 200
    input: ["status?", "area_sqft?"]
    output: Room
    side_effects: ["increments Room.version by 1; capacity is not recomputed retroactively on already-submitted studies"]

  # ---------------------------------------------------- program set-asides -
  - method: POST
    path: "/facilities/program-set-asides"
    description: "Records a special-program room set-aside on a campus."
    roles: [DistrictAdmin]
    code: 201
    input: [school_id, program_type, reserved_room_type, reserved_room_count, seats_excluded_per_room]
    output: ProgramSetAside
    side_effects: []
  - method: GET
    path: "/facilities/program-set-asides/{id}"
    description: "Reads one set-aside."
    roles: [DistrictAdmin, FacilitiesPlanner, CapacityCertifier, AssetManager]
    code: 200
    input: []
    output: ProgramSetAside
    side_effects: []
  - method: GET
    path: "/facilities/program-set-asides"
    description: "Lists set-asides, optionally filtered by campus or program."
    roles: [DistrictAdmin, FacilitiesPlanner, CapacityCertifier, AssetManager]
    code: 200
    input: ["school_id?", "program_type?", "limit?", "offset?"]
    output: ProgramSetAside[]
    side_effects: []

  # ------------------------------------------------ enrollment projections -
  - method: POST
    path: "/facilities/enrollment-projections"
    description: "Appends an immutable enrollment projection row. Newer rows displace older ones for the same campus, year and grade."
    roles: [FacilitiesPlanner, DistrictAdmin]
    code: 201
    input: [school_id, school_year, grade_level, projected_students, source, confidence_tier]
    output: EnrollmentProjection
    side_effects: []
  - method: GET
    path: "/facilities/enrollment-projections/{id}"
    description: "Reads one projection row."
    roles: [DistrictAdmin, FacilitiesPlanner, CapacityCertifier]
    code: 200
    input: []
    output: EnrollmentProjection
    side_effects: []
  - method: GET
    path: "/facilities/enrollment-projections"
    description: "Lists projection rows, optionally filtered by campus, year or grade."
    roles: [DistrictAdmin, FacilitiesPlanner, CapacityCertifier]
    code: 200
    input: ["school_id?", "school_year?", "grade_level?", "limit?", "offset?"]
    output: EnrollmentProjection[]
    side_effects: []

  # ------------------------------------------------------ capital budgets --
  - method: POST
    path: "/facilities/capital-budgets"
    description: "Records a board appropriation."
    roles: [DistrictAdmin]
    code: 201
    input: [fiscal_year, authorized_cents]
    output: CapitalBudget
    side_effects: ["encumbered_cents and expended_cents initialised to 0, uncommitted_cents to authorized_cents"]
  - method: GET
    path: "/facilities/capital-budgets/{id}"
    description: "Reads an appropriation and its three-bucket partition."
    roles: [DistrictAdmin, FacilitiesPlanner, CapacityCertifier, OperationsScheduler, AssetManager]
    code: 200
    input: []
    output: CapitalBudget
    side_effects: []

  # --------------------------------------------------- installation crews --
  - method: GET
    path: "/facilities/installation-crews/{id}"
    description: "Reads one installation crew including its certified work types."
    roles: [DistrictAdmin, FacilitiesPlanner, OperationsScheduler, CrewLead]
    code: 200
    input: []
    output: InstallationCrew
    side_effects: []
  - method: POST
    path: "/facilities/installation-crews"
    description: "Registers an installation crew."
    roles: [DistrictAdmin]
    code: 201
    input: [name, max_concurrent_jobs, certified_work_types]
    output: InstallationCrew
    side_effects: []

  # ----------------------------------------------------- capacity studies --
  - method: POST
    path: "/facilities/capacity-studies"
    description: "Opens a capacity study for a campus and school year, pinning the class-size policy. Any existing DRAFT or RETURNED study for the same campus and year is superseded, so the caller must present the campus version it last observed."
    roles: [FacilitiesPlanner]
    code: 201
    input: [school_id, class_size_policy_id, school_year, method, expected_school_version]
    output: CapacityStudy
    side_effects:
      - "increments School.version by 1"
      - "moves any other DRAFT or RETURNED study for the same school_id and school_year to SUPERSEDED, processed in created_at ASC order"
      - "stamps authored_by_user_id from X-User-ID"
  - method: GET
    path: "/facilities/capacity-studies/{id}"
    description: "Reads a study including its frozen capacity and utilization fields and its version."
    roles: [DistrictAdmin, FacilitiesPlanner, CapacityCertifier, PermitCoordinator, BuildingOfficial, OperationsScheduler, AssetManager]
    code: 200
    input: []
    output: CapacityStudy
    side_effects: []
  - method: GET
    path: "/facilities/capacity-studies"
    description: "Lists studies, optionally filtered by campus, pinned policy, status or school year."
    roles: [DistrictAdmin, FacilitiesPlanner, CapacityCertifier, PermitCoordinator, BuildingOfficial, OperationsScheduler, AssetManager]
    code: 200
    input: ["school_id?", "class_size_policy_id?", "status?", "school_year?", "limit?", "offset?"]
    output: CapacityStudy[]
    side_effects: []
  - method: GET
    path: "/facilities/capacity-studies/{id}/capacity-breakdown"
    description: "Recomputes both capacity variants live for the study's campus and returns them side by side, so the divergence between the state loading standard and district policy is directly observable."
    roles: [DistrictAdmin, FacilitiesPlanner, CapacityCertifier]
    code: 200
    input: []
    output: "{ method: string, gross_room_seats: integer, set_aside_deduction_seats: integer, program_capacity_seats: integer, state_standard_seats: integer, district_policy_seats: integer, projected_enrollment_total: integer, state_projected_total: integer, district_projected_total: integer, utilization_pct: number, portable_trigger_met: boolean, seat_deficit: integer, required_portable_count: integer }"
    side_effects: []
  - method: POST
    path: "/facilities/capacity-studies/{id}/submit"
    description: "Freezes the capacity and utilization computation onto the study and moves it to SUBMITTED."
    roles: [FacilitiesPlanner]
    code: 200
    input: []
    output: CapacityStudy
    side_effects: ["runs program_capacity_seats and utilization_and_portable_need and freezes all seven computed fields", "increments CapacityStudy.version by 1"]
  - method: POST
    path: "/facilities/capacity-studies/{id}/certify"
    description: "Certifies a submitted study. The certifier may not be the author."
    roles: [CapacityCertifier]
    code: 200
    input: []
    output: CapacityStudy
    side_effects: ["supersedes the previously CERTIFIED study for the same campus and year", "repoints School.certified_study_id and recomputes School.reliance_flag", "increments CapacityStudy.version by 1 and School.version by 1"]
  - method: POST
    path: "/facilities/capacity-studies/{id}/return"
    description: "Returns a submitted study for revision. The returner may not be the author."
    roles: [CapacityCertifier]
    code: 200
    input: [correction_note]
    output: CapacityStudy
    side_effects: ["increments revision_round by 1 and clears the frozen computed fields", "increments CapacityStudy.version by 1"]
  - method: POST
    path: "/facilities/capacity-studies/{id}/reopen"
    description: "Reopens a returned study for editing, closing the revision cycle. Capped at 3 revision rounds."
    roles: [FacilitiesPlanner]
    code: 200
    input: []
    output: CapacityStudy
    side_effects: ["increments CapacityStudy.version by 1"]

  # ------------------------------------------------------- portable units --
  - method: POST
    path: "/facilities/portable-units"
    description: "Adds a portable classroom to the district inventory. rated_seats is derived from size_class."
    roles: [AssetManager, DistrictAdmin]
    code: 201
    input: [asset_tag, size_class, "condition_grade?", "ada_ramp_installed?", acquisition_cost_cents, in_service_year, "replaced_unit_id?", "prior_relocation_count?"]
    output: PortableUnit
    side_effects: ["condition_status initialised to SERVICEABLE, allocation_status to IN_STORAGE, rated_seats derived from size_class, lifetime_relocation_count initialised to prior_relocation_count"]
  - method: GET
    path: "/facilities/portable-units/{id}"
    description: "Reads a portable unit including both state dimensions."
    roles: [DistrictAdmin, FacilitiesPlanner, CapacityCertifier, PermitCoordinator, BuildingOfficial, OperationsScheduler, AssetManager]
    code: 200
    input: []
    output: PortableUnit
    side_effects: []
  - method: GET
    path: "/facilities/portable-units"
    description: "Lists inventory, optionally filtered by hosting campus, replacement lineage, either state dimension or size class."
    roles: [DistrictAdmin, FacilitiesPlanner, CapacityCertifier, PermitCoordinator, BuildingOfficial, OperationsScheduler, AssetManager]
    code: 200
    input: ["current_school_id?", "replaced_unit_id?", "allocation_status?", "condition_status?", "size_class?", "limit?", "offset?"]
    output: PortableUnit[]
    side_effects: []
  - method: POST
    path: "/facilities/portable-units/{id}/condition"
    description: "Records a condition inspection result on the condition dimension. Declaring a unit UNSAFE fires the withdrawal cascade."
    roles: [AssetManager]
    code: 200
    input: [condition_status, condition_grade]
    output: PortableUnit
    side_effects:
      - "withdraws every non-terminal PlacementRequest referencing the unit when condition_status becomes UNSAFE"
      - "releases the budget encumbrance and cancels the PLANNED or IN_PROGRESS schedules of each withdrawn request"
      - "clears the pad on each affected PlacementSite and returns allocation_status to IN_STORAGE"
      - "increments PortableUnit.version by 1"
  - method: POST
    path: "/facilities/portable-units/{id}/record-existing-placement"
    description: "Legacy inventory onboarding: records a portable already standing on a campus pad before the system existed, without running the permit and schedule pipeline."
    roles: [AssetManager, DistrictAdmin]
    code: 200
    input: [school_id, placement_site_id, installed_on]
    output: PortableUnit
    side_effects:
      - "sets allocation_status to INSTALLED and current_school_id"
      - "sets PlacementSite.occupied_by_unit_id and increments PlacementSite.version by 1"
      - "adds rated_seats to School.hosted_portable_seats, recomputes School.reliance_flag and increments School.version by 1"
      - "increments lifetime_relocation_count by 1 and PortableUnit.version by 1"

  # ------------------------------------------------------ placement sites --
  - method: POST
    path: "/facilities/placement-sites"
    description: "Registers a candidate pad on a campus."
    roles: [DistrictAdmin]
    code: 201
    input: [school_id, pad_code, pad_length_ft, pad_width_ft, distance_to_fire_lane_ft, electrical_drop_available_kw, "sewer_connection_available?", "ada_path_of_travel_compliant?"]
    output: PlacementSite
    side_effects: ["feasibility_status initialised to UNASSESSED, occupied_by_unit_id to null"]
  - method: GET
    path: "/facilities/placement-sites/{id}"
    description: "Reads a pad including its feasibility verdict and mitigation flags."
    roles: [DistrictAdmin, FacilitiesPlanner, CapacityCertifier, PermitCoordinator, BuildingOfficial, OperationsScheduler, AssetManager]
    code: 200
    input: []
    output: PlacementSite
    side_effects: []
  - method: GET
    path: "/facilities/placement-sites"
    description: "Lists pads, optionally filtered by campus, occupying unit or feasibility verdict."
    roles: [DistrictAdmin, FacilitiesPlanner, CapacityCertifier, PermitCoordinator, BuildingOfficial, OperationsScheduler, AssetManager]
    code: 200
    input: ["school_id?", "occupied_by_unit_id?", "feasibility_status?", "limit?", "offset?"]
    output: PlacementSite[]
    side_effects: []
  - method: POST
    path: "/facilities/placement-sites/{id}/assess"
    description: "Runs the pad feasibility assessment for a candidate size class, covering geometry, fire access, utilities and the accessible path of travel."
    roles: [FacilitiesPlanner]
    code: 200
    input: ["candidate_size_class?"]
    output: PlacementSite
    side_effects: ["stores feasibility_status, mitigation_flags, infeasible_reason and assessed_for_size_class", "increments PlacementSite.version by 1"]

  # --------------------------------------------------- placement requests --
  - method: POST
    path: "/facilities/placement-requests"
    description: "Opens a placement request against a certified-or-pending study, a pad and an appropriation. The caller must present the study version it last observed."
    roles: [FacilitiesPlanner]
    code: 201
    input: [capacity_study_id, placement_site_id, capital_budget_id, requested_window_start, requested_window_end, haul_miles, "portable_unit_id?", expected_study_version]
    output: PlacementRequest
    side_effects:
      - "copies school_id from the study"
      - "increments CapacityStudy.version by 1"
      - "reserves the supplied portable unit by moving allocation_status IN_STORAGE -> RESERVED"
      - "runs relocation_cost_estimate and alternative_cost_comparison and stores estimated_relocation_cost_cents and cost_recommendation"
  - method: GET
    path: "/facilities/placement-requests/{id}"
    description: "Reads a placement request."
    roles: [DistrictAdmin, FacilitiesPlanner, CapacityCertifier, PermitCoordinator, BuildingOfficial, OperationsScheduler, AssetManager]
    code: 200
    input: []
    output: PlacementRequest
    side_effects: []
  - method: GET
    path: "/facilities/placement-requests"
    description: "Lists placement requests, optionally filtered by study, campus, unit, pad, appropriation or status."
    roles: [DistrictAdmin, FacilitiesPlanner, CapacityCertifier, PermitCoordinator, BuildingOfficial, OperationsScheduler, AssetManager]
    code: 200
    input: ["capacity_study_id?", "school_id?", "portable_unit_id?", "placement_site_id?", "capital_budget_id?", "status?", "limit?", "offset?"]
    output: PlacementRequest[]
    side_effects: []
  - method: GET
    path: "/facilities/placement-requests/{id}/cost-model"
    description: "Relocation cost model versus boundary change versus permanent addition, under either the 20-year lifecycle basis (default) or the immediate-capital basis."
    roles: [DistrictAdmin, FacilitiesPlanner, CapacityCertifier]
    code: 200
    input: ["basis?"]
    output: "{ basis: string, mobilisation_cents: integer, site_work_cents: integer, rehab_cents: integer, permit_fee_cents: integer, direct_cost_cents: integer, contingency_cents: integer, off_summer_applied: boolean, estimated_relocation_cost_cents: integer, relocation_direct_cents: integer, relocation_soft_cost_cents: integer, relocation_total_program_cost_cents: integer, boundary_change_direct_cents: integer, boundary_change_total_program_cost_cents: integer, permanent_addition_direct_cents: integer, permanent_addition_soft_cost_cents: integer, permanent_addition_total_program_cost_cents: integer, relocate_excluded_for_reliance: boolean, cost_recommendation: string }"
    side_effects: []
  - method: POST
    path: "/facilities/placement-requests/{id}/auto-assign-unit"
    description: "Server selects the eligible portable unit with the lowest accumulated relocation cost for this pad and reserves it."
    roles: [FacilitiesPlanner]
    code: 200
    input: []
    output: PlacementRequest
    side_effects:
      - "reserves the selected unit by moving allocation_status IN_STORAGE -> RESERVED"
      - "recomputes estimated_relocation_cost_cents and cost_recommendation"
      - "increments PlacementRequest.version by 1"
  - method: POST
    path: "/facilities/placement-requests/{id}/assess-site"
    description: "Confirms the pad, unit and code gates and moves the request to SITE_ASSESSED. Requires the justifying study to be CERTIFIED."
    roles: [FacilitiesPlanner]
    code: 200
    input: []
    output: PlacementRequest
    side_effects: ["increments PlacementRequest.version by 1"]
  - method: POST
    path: "/facilities/placement-requests/{id}/submit-permits"
    description: "Files the computed required permit set with the building department, forking the request into N Permit rows."
    roles: [PermitCoordinator]
    code: 200
    input: []
    output: PlacementRequest
    side_effects: ["creates one SUBMITTED Permit per required discipline", "stores required_permit_count", "increments PlacementRequest.version by 1"]
  - method: POST
    path: "/facilities/placement-requests/{id}/withdraw"
    description: "Withdraws a non-terminal request, releasing the encumbrance, the unit and the pad and cancelling any open schedule."
    roles: [FacilitiesPlanner]
    code: 200
    input: [reason]
    output: PlacementRequest
    side_effects:
      - "releases encumbered_cost_cents from CapitalBudget.encumbered_cents and zeroes it"
      - "returns the unit to IN_STORAGE and clears PlacementSite.occupied_by_unit_id"
      - "cancels PLANNED or IN_PROGRESS schedules of the request"
      - "increments PlacementRequest.version by 1 and CapitalBudget.version by 1"
  - method: POST
    path: "/facilities/placement-requests/{id}/request-decommission"
    description: "Opens decommissioning on an installed unit."
    roles: [AssetManager]
    code: 200
    input: ["reason?"]
    output: PlacementRequest
    side_effects: ["moves the unit INSTALLED -> PENDING_REMOVAL", "increments PlacementRequest.version by 1"]
  - method: POST
    path: "/facilities/placement-requests/{id}/complete-decommission"
    description: "Completes decommissioning: charges the removal cost, returns the unit to storage, frees the pad and reduces the campus hosted portable seats."
    roles: [AssetManager]
    code: 200
    input: []
    output: PlacementRequest
    side_effects:
      - "adds REMOVAL_CENTS_BY_SIZE to CapitalBudget.expended_cents"
      - "moves the unit PENDING_REMOVAL -> IN_STORAGE, clears current_school_id and the pad, subtracts rated_seats from School.hosted_portable_seats and recomputes School.reliance_flag"
      - "increments PlacementRequest.version by 1, CapitalBudget.version by 1, PortableUnit.version by 1 and School.version by 1"

  # ------------------------------------------------------------- permits ---
  - method: GET
    path: "/facilities/permits/{id}"
    description: "Reads one permit."
    roles: [DistrictAdmin, FacilitiesPlanner, CapacityCertifier, PermitCoordinator, BuildingOfficial, OperationsScheduler, AssetManager]
    code: 200
    input: []
    output: Permit
    side_effects: []
  - method: GET
    path: "/facilities/permits"
    description: "Lists permits, optionally filtered by request, discipline or status."
    roles: [DistrictAdmin, FacilitiesPlanner, CapacityCertifier, PermitCoordinator, BuildingOfficial, OperationsScheduler, AssetManager]
    code: 200
    input: ["placement_request_id?", "permit_type?", "status?", "limit?", "offset?"]
    output: Permit[]
    side_effects: []
  - method: POST
    path: "/facilities/permits/{id}/decision"
    description: "Building department decision on a submitted permit. Approving the last outstanding permit fires the join to PERMITTED; a denial fires the join to REJECTED."
    roles: [BuildingOfficial]
    code: 200
    input: [decision, "correction_note?"]
    output: Permit
    side_effects:
      - "stamps approved_on from the logical clock on APPROVED"
      - "on the last APPROVED permit: moves the request PERMIT_PENDING -> PERMITTED, encumbers the estimate against the appropriation and moves the unit RESERVED -> SCHEDULED, which sets PlacementSite.occupied_by_unit_id"
      - "on DENIED: moves the request PERMIT_PENDING -> REJECTED and returns the unit to IN_STORAGE with no encumbrance"
      - "increments Permit.version by 1"
  - method: POST
    path: "/facilities/permits/{id}/resubmit"
    description: "Refiles a permit that came back with corrections, closing the review cycle."
    roles: [PermitCoordinator]
    code: 200
    input: [correction_response]
    output: Permit
    side_effects: ["increments review_cycle_count by 1 and refreshes submitted_on", "increments Permit.version by 1"]

  # ------------------------------------------------ installation schedules -
  - method: POST
    path: "/facilities/installation-schedules"
    description: "Books an installation window for a permitted request, enforcing the summer window, permit validity, pad turnaround buffer and crew capacity."
    roles: [OperationsScheduler, DistrictAdmin]
    code: 201
    input: [placement_request_id, installation_crew_id, work_type, window_start, window_end, "off_summer_waiver?"]
    output: InstallationSchedule
    side_effects: ["moves the request PERMITTED -> SCHEDULED", "increments PlacementRequest.version by 1"]
  - method: GET
    path: "/facilities/installation-schedules/{id}"
    description: "Reads one schedule."
    roles: [DistrictAdmin, FacilitiesPlanner, CapacityCertifier, PermitCoordinator, BuildingOfficial, OperationsScheduler, AssetManager, CrewLead]
    code: 200
    input: []
    output: InstallationSchedule
    side_effects: []
  - method: GET
    path: "/facilities/installation-schedules"
    description: "Lists schedules, optionally filtered by request, crew or status."
    roles: [DistrictAdmin, FacilitiesPlanner, CapacityCertifier, PermitCoordinator, BuildingOfficial, OperationsScheduler, AssetManager, CrewLead]
    code: 200
    input: ["placement_request_id?", "installation_crew_id?", "status?", "limit?", "offset?"]
    output: InstallationSchedule[]
    side_effects: []
  - method: POST
    path: "/facilities/installation-schedules/{id}/start"
    description: "Marks the crew on site. A CrewLead may only start its own crew's schedule."
    roles: [OperationsScheduler, CrewLead]
    code: 200
    input: []
    output: InstallationSchedule
    side_effects: ["increments InstallationSchedule.version by 1"]
  - method: POST
    path: "/facilities/installation-schedules/{id}/complete"
    description: "Completes the installation after the accessibility and code compliance gate, driving the install cascade."
    roles: [OperationsScheduler, CrewLead]
    code: 200
    input: []
    output: InstallationSchedule
    side_effects:
      - "moves the request SCHEDULED -> INSTALLED, which moves the encumbrance to expended"
      - "moves the unit SCHEDULED -> INSTALLED, sets current_school_id, increments lifetime_relocation_count and accumulated_relocation_cost_cents"
      - "adds rated_seats to School.hosted_portable_seats and recomputes School.reliance_flag"
      - "increments InstallationSchedule.version by 1"
  - method: POST
    path: "/facilities/installation-schedules/{id}/cancel"
    description: "Cancels an open window and returns the request to PERMITTED so another window can be booked."
    roles: [OperationsScheduler]
    code: 200
    input: [reason]
    output: InstallationSchedule
    side_effects: ["returns the request SCHEDULED -> PERMITTED leaving the encumbrance intact", "increments InstallationSchedule.version by 1 and PlacementRequest.version by 1"]

  # ---------------------------------------------------- disposal records ---
  - method: POST
    path: "/facilities/disposal-records"
    description: "Disposes of a stored unit that is unsafe or grade D, valuing the salvage on the requested basis."
    roles: [AssetManager]
    code: 201
    input: [portable_unit_id, method, valuation_basis, proceeds_cents]
    output: DisposalRecord
    side_effects: ["runs unit_salvage_value and stores salvage_value_cents and net_disposal_result_cents", "moves the unit allocation_status IN_STORAGE -> DISPOSED", "increments PortableUnit.version by 1"]
  - method: GET
    path: "/facilities/disposal-records/{id}"
    description: "Reads one disposal record."
    roles: [DistrictAdmin, FacilitiesPlanner, CapacityCertifier, OperationsScheduler, AssetManager]
    code: 200
    input: []
    output: DisposalRecord
    side_effects: []
  - method: GET
    path: "/facilities/disposal-records"
    description: "Lists disposal records, optionally filtered by unit or channel."
    roles: [DistrictAdmin, FacilitiesPlanner, CapacityCertifier, OperationsScheduler, AssetManager]
    code: 200
    input: ["portable_unit_id?", "method?", "limit?", "offset?"]
    output: DisposalRecord[]
    side_effects: []

# ===========================================================================
# 1.6 Error Code Catalog
# ===========================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or X-User-Role is not one of the eight declared roles"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "the acting role is not listed on the endpoint"
  - id: ERR_CREW_NOT_ASSIGNED
    http: 403
    condition: "a CrewLead acts on a schedule whose installation_crew_id differs from its X-User-ID"
  - id: ERR_SCHOOL_NOT_FOUND
    http: 404
    condition: "school_id in the path or body does not resolve"
  - id: ERR_ROOM_NOT_FOUND
    http: 404
    condition: "room id in the path does not resolve"
  - id: ERR_SET_ASIDE_NOT_FOUND
    http: 404
    condition: "program set-aside id in the path does not resolve"
  - id: ERR_PROJECTION_NOT_FOUND
    http: 404
    condition: "enrollment projection id in the path does not resolve"
  - id: ERR_POLICY_NOT_FOUND
    http: 404
    condition: "class_size_policy_id in the body does not resolve"
  - id: ERR_STUDY_NOT_FOUND
    http: 404
    condition: "capacity study id in the path or capacity_study_id in the body does not resolve"
  - id: ERR_UNIT_NOT_FOUND
    http: 404
    condition: "portable unit id in the path or portable_unit_id in the body does not resolve"
  - id: ERR_SITE_NOT_FOUND
    http: 404
    condition: "placement site id in the path or placement_site_id in the body does not resolve"
  - id: ERR_REQUEST_NOT_FOUND
    http: 404
    condition: "placement request id in the path or placement_request_id in the body does not resolve"
  - id: ERR_PERMIT_NOT_FOUND
    http: 404
    condition: "permit id in the path does not resolve"
  - id: ERR_SCHEDULE_NOT_FOUND
    http: 404
    condition: "installation schedule id in the path does not resolve"
  - id: ERR_BUDGET_NOT_FOUND
    http: 404
    condition: "capital budget id in the path or capital_budget_id in the body does not resolve"
  - id: ERR_CREW_NOT_FOUND
    http: 404
    condition: "installation_crew_id in the body does not resolve"
  - id: ERR_DISPOSAL_NOT_FOUND
    http: 404
    condition: "disposal record id in the path does not resolve"
  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "a required body field is missing, a type is wrong, an enum member is illegal, a numeric range is violated, or a date does not parse"
  - id: ERR_INVALID_PAGINATION
    http: 422
    condition: "limit outside 1..100 or offset negative"
  - id: ERR_STALE_SCHOOL_VERSION
    http: 412
    condition: "expected_school_version does not equal School.version on POST /facilities/capacity-studies"
  - id: ERR_STALE_STUDY_VERSION
    http: 412
    condition: "expected_study_version does not equal CapacityStudy.version on POST /facilities/placement-requests"
  - id: ERR_STUDY_STATE_INVALID
    http: 409
    condition: "the study is not in a state from which the requested study transition is declared"
  - id: ERR_REQUEST_STATE_INVALID
    http: 409
    condition: "the placement request is not in a state from which the requested transition is declared"
  - id: ERR_PERMIT_STATE_INVALID
    http: 409
    condition: "the permit is not in a state from which the requested transition is declared"
  - id: ERR_SCHEDULE_STATE_INVALID
    http: 409
    condition: "the installation schedule is not in a state from which the requested transition is declared"
  - id: ERR_UNIT_STATE_INVALID
    http: 409
    condition: "the portable unit's allocation dimension forbids the requested operation, for example recording a legacy placement for a unit that is not IN_STORAGE, or inspecting a DISPOSED unit"
  - id: ERR_STUDY_NOT_CERTIFIED
    http: 409
    condition: "the CapacityStudy justifying a placement request is not CERTIFIED when the site assessment is confirmed"
  - id: ERR_REQUEST_NOT_PERMITTED
    http: 409
    condition: "an installation schedule is booked for a request that is not PERMITTED, or that already has a PLANNED, IN_PROGRESS or COMPLETED schedule"
  - id: ERR_UNIT_NOT_DISPOSABLE
    http: 409
    condition: "disposal is attempted on a unit that is not IN_STORAGE, or that is neither UNSAFE nor grade D, or that already has a disposal record"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the acting X-User-ID equals CapacityStudy.authored_by_user_id on certify or return"
  - id: ERR_UNIT_NOT_SERVICEABLE
    http: 422
    condition: "the referenced portable unit's condition_status is not SERVICEABLE"
  - id: ERR_UNIT_GRADE_NOT_PLACEABLE
    http: 422
    condition: "the referenced portable unit's condition_grade is D"
  - id: ERR_SITE_NOT_FEASIBLE
    http: 422
    condition: "the pad is UNASSESSED or INFEASIBLE, or was last assessed against a different size class than the assigned unit"
  - id: ERR_FIRE_ACCESS_NONCOMPLIANT
    http: 422
    condition: "pad hose-lay distance exceeds 150 ft, or the campus fire lane clear width is below 20 ft"
  - id: ERR_ADA_NONCOMPLIANT
    http: 422
    condition: "installation completion is attempted while the unit lacks a compliant ramp or the pad lacks a compliant accessible path of travel"
  - id: ERR_SITE_SCHOOL_MISMATCH
    http: 422
    condition: "the pad belongs to a different campus than the study, or than the campus supplied for a legacy placement"
  - id: ERR_POLICY_BAND_MISMATCH
    http: 422
    condition: "the pinned class-size policy's grade_band is not the primary band of the campus grade configuration"
  - id: ERR_POLICY_YEAR_MISMATCH
    http: 422
    condition: "the pinned class-size policy's effective_school_year differs from the study's school_year"
  - id: ERR_PERMIT_REQUEST_NOT_PENDING
    http: 409
    condition: "a permit decision or resubmission is attempted while the owning request is not PERMIT_PENDING"
  - id: ERR_PROJECTION_COVERAGE_GAP
    http: 422
    condition: "at least one grade in the campus grade set has no enrollment projection surviving the study method's source filter"
  - id: ERR_ZERO_PROGRAM_CAPACITY
    http: 422
    condition: "the computed program capacity is 0 seats at submission"
  - id: ERR_LOW_CONFIDENCE_PROJECTION
    http: 422
    condition: "a DISTRICT_POLICY study is certified while one of its selected projections has confidence_tier LOW"
  - id: ERR_REVISION_LIMIT_REACHED
    http: 409
    condition: "reopen is attempted when revision_round has already reached 3"
  - id: ERR_UNIT_RELOCATION_LIMIT
    http: 422
    condition: "the unit has already been relocated 4 times"
  - id: ERR_PAD_TOO_SMALL
    http: 422
    condition: "pad dimensions do not admit the unit footprint plus 5 ft clearance on every side"
  - id: ERR_SITE_OCCUPIED
    http: 409
    condition: "the pad already has occupied_by_unit_id set"
  - id: ERR_DUPLICATE_POLICY
    http: 409
    condition: "a class-size policy already exists for the same grade_band and effective_school_year"
  - id: ERR_DUPLICATE_ROOM
    http: 409
    condition: "a room with the same room_number already exists on the campus"
  - id: ERR_DUPLICATE_ASSET_TAG
    http: 409
    condition: "a portable unit with the same asset_tag already exists"
  - id: ERR_DUPLICATE_PAD_CODE
    http: 409
    condition: "a pad with the same pad_code already exists on the campus"
  - id: ERR_CREW_NOT_CERTIFIED
    http: 422
    condition: "the crew's certified_work_types does not contain the requested work_type"
  - id: ERR_INVALID_WINDOW
    http: 422
    condition: "window_end precedes window_start"
  - id: ERR_OUTSIDE_SUMMER_WINDOW
    http: 422
    condition: "the booked window is not entirely inside 06-15..08-15 of a single calendar year and no board waiver was supplied"
  - id: ERR_WAIVER_ROLE_REQUIRED
    http: 403
    condition: "off_summer_waiver true was supplied by a role other than DistrictAdmin"
  - id: ERR_PERMIT_EXPIRED
    http: 409
    condition: "window_start falls more than 180 calendar days after the approval date of one of the request's permits"
  - id: ERR_PAD_WINDOW_CONFLICT
    http: 409
    condition: "the booked window violates the 7 day pad turnaround buffer against another open schedule on the same pad"
  - id: ERR_CREW_CAPACITY_EXCEEDED
    http: 409
    condition: "the crew already has max_concurrent_jobs open schedules overlapping the booked half-open window"
  - id: ERR_BUDGET_INSUFFICIENT
    http: 409
    condition: "the appropriation's uncommitted_cents is below the amount about to be committed"
  - id: ERR_DISPOSAL_UNDERVALUED
    http: 422
    condition: "a SALE's proceeds fall below 70 percent of the computed salvage value, or a SCRAP or TRANSFER_TO_COUNTY carries non-zero proceeds"
  - id: ERR_NO_ELIGIBLE_UNIT
    http: 409
    condition: "auto-assignment finds no portable unit satisfying the eligibility filter"
  - id: ERR_NO_CERTIFIED_STUDY
    http: 409
    condition: "a reliance report is requested for a campus with no CERTIFIED capacity study"

# ===========================================================================
# 1.7 RBAC Matrix
# ===========================================================================
roles:
  - name: DistrictAdmin
    description: "District facilities director. Owns configuration (campuses, policies, rooms, set-asides, pads, appropriations, crews, inventory onboarding) and is the only role that may sign an off-summer work waiver or move the logical clock."
    identity: opaque
    exclusive_operations:
      - "POST /facilities/_clock/set_current_utc"
      - "POST /facilities/schools"
      - "POST /facilities/class-size-policies"
      - "POST /facilities/rooms"
      - "PATCH /facilities/rooms/{id}"
      - "POST /facilities/program-set-asides"
      - "POST /facilities/capital-budgets"
      - "POST /facilities/installation-crews"
      - "POST /facilities/placement-sites"
      - "supplying off_summer_waiver=true on POST /facilities/installation-schedules"
    shared_operations:
      - "POST /facilities/enrollment-projections (with FacilitiesPlanner)"
      - "POST /facilities/portable-units (with AssetManager)"
      - "POST /facilities/portable-units/{id}/record-existing-placement (with AssetManager)"
      - "POST /facilities/installation-schedules (with OperationsScheduler)"
      - "all GET endpoints except the crew-scoped reads"
  - name: FacilitiesPlanner
    description: "Planner who authors capacity studies and placement requests. May never certify or return a study."
    identity: opaque
    exclusive_operations:
      - "POST /facilities/capacity-studies"
      - "POST /facilities/capacity-studies/{id}/submit"
      - "POST /facilities/capacity-studies/{id}/reopen"
      - "POST /facilities/placement-sites/{id}/assess"
      - "POST /facilities/placement-requests"
      - "POST /facilities/placement-requests/{id}/auto-assign-unit"
      - "POST /facilities/placement-requests/{id}/assess-site"
      - "POST /facilities/placement-requests/{id}/withdraw"
    shared_operations:
      - "POST /facilities/enrollment-projections (with DistrictAdmin)"
      - "all GET endpoints except the crew-scoped reads"
  - name: CapacityCertifier
    description: "Independent reviewer who certifies or returns submitted studies. Segregation of duties forbids certifying or returning a study whose authored_by_user_id equals the certifier's own X-User-ID."
    identity: opaque
    exclusive_operations:
      - "POST /facilities/capacity-studies/{id}/certify"
      - "POST /facilities/capacity-studies/{id}/return"
    shared_operations:
      - "all GET endpoints except the crew-scoped reads"
  - name: PermitCoordinator
    description: "Files permit applications and refiles them after corrections. May never decide a permit."
    identity: opaque
    exclusive_operations:
      - "POST /facilities/placement-requests/{id}/submit-permits"
      - "POST /facilities/permits/{id}/resubmit"
    shared_operations:
      - "read access to studies, requests, permits, units, pads and schedules"
  - name: BuildingOfficial
    description: "Building department reviewer who approves, requests corrections on, or denies permits. May never file or refile them."
    identity: opaque
    exclusive_operations:
      - "POST /facilities/permits/{id}/decision"
    shared_operations:
      - "read access to studies, requests, permits, units, pads and schedules"
  - name: OperationsScheduler
    description: "Books and manages installation windows against crews and pads."
    identity: opaque
    exclusive_operations:
      - "POST /facilities/installation-schedules/{id}/cancel"
    shared_operations:
      - "POST /facilities/installation-schedules (with DistrictAdmin)"
      - "POST /facilities/installation-schedules/{id}/start (with CrewLead)"
      - "POST /facilities/installation-schedules/{id}/complete (with CrewLead)"
      - "read access to studies, requests, permits, units, pads, schedules and appropriations"
  - name: AssetManager
    description: "Owns the portable inventory: condition inspections, legacy placement records, decommissioning and disposal."
    identity: opaque
    exclusive_operations:
      - "POST /facilities/portable-units/{id}/condition"
      - "POST /facilities/placement-requests/{id}/request-decommission"
      - "POST /facilities/placement-requests/{id}/complete-decommission"
      - "POST /facilities/disposal-records"
    shared_operations:
      - "POST /facilities/portable-units (with DistrictAdmin)"
      - "POST /facilities/portable-units/{id}/record-existing-placement (with DistrictAdmin)"
      - "read access to campuses, studies, requests, units, pads, schedules, appropriations and disposal records"
  - name: CrewLead
    description: "Installation crew lead. X-User-ID is the id of the InstallationCrew the lead runs, so the lead may only start or complete schedules booked to that crew."
    identity: "entity_backed:InstallationCrew"
    exclusive_operations: []
    shared_operations:
      - "POST /facilities/installation-schedules/{id}/start (with OperationsScheduler, own crew only)"
      - "POST /facilities/installation-schedules/{id}/complete (with OperationsScheduler, own crew only)"
      - "GET /facilities/installation-schedules and GET /facilities/installation-schedules/{id}"
