# =============================================================================
# PRD Benchmark Seed Tables — Insurance MGA & Program Business Administration
# =============================================================================

scenario: |
  Insurance MGA & Program Business Administration (managing general agency): binding authority & underwriting guideline limits, carrier capacity allocation & aggregate management, program pricing & rate/rule filing coordination, bordereaux reporting to carrier & data quality, premium trust accounting & fiduciary funds, claims authority & TPA oversight, loss ratio performance & program termination, audit rights & compliance with carrier standards

domain_name: insurance-mga-program-business
api_prefix: /mga

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency      # OCC on Program.version for guideline / capacity-allocation create-with-supersede
    - cascading_side_effects      # audit escalation and loss-ratio breach cascade Program -> Appointment -> Claim
    - dual_variant_calculation    # provisional vs final-audit premium; paid vs incurred loss ratio; pro-rata vs short-rate earned
    - ops_run_checkpoint          # POST /mga/_ops/run-daily advances expiries, cancellations, overdue flags
  entity_topology: hierarchical   # Carrier/TPA top-level; everything else nests under Program (with cross-aggregate FKs)
  state_machine_shape: cyclic     # filing revision loop, claim reopen loop, policy cancel/reinstate loop, bordereau revise loop
  relationship_patterns:
    - one_to_many                 # Program -> Guidelines/Allocations/Filings/Policies/Claims(via Policy)/Bordereaux/Audits/Appointments/Ledger
    - cross_aggregate             # Policy.filing_id -> RateFiling; Claim.assigned_tpa_id -> TPA; ledger -> Policy/Claim
  role_model: segregation_of_duties  # carrier-underwriting vs carrier-audit vs MGA-underwriting vs MGA-finance vs TPA
  consistency_model: immediate    # every mutation + derived-field recompute visible in the same response

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Carrier
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Carrier legal name" }
      - { name: naic_code, type: string, source: input, description: "NAIC company code; unique across carriers", constraints: "unique; duplicate -> ERR_NAIC_CODE_EXISTS (409)" }
      - { name: contact_email, type: string, source: input, description: "Primary contact email" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | SUSPENDED", constraints: "created ACTIVE; SUSPENDED carriers may not activate new programs" }

  - name: TPA
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Third-party administrator legal name" }
      - { name: license_number, type: string, source: input, description: "Adjuster license number; unique across TPAs", constraints: "unique; duplicate -> ERR_LICENSE_NUMBER_EXISTS (409)" }
      - { name: contact_email, type: string, source: input, description: "Primary contact email" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | SUSPENDED", constraints: "SUSPENDED TPAs cannot receive new appointments" }

  - name: Program
    parent: null
    common_fields: true
    fields:
      - { name: carrier_id, type: string, source: input, description: "FK -> Carrier.id; carrier granting capacity and paper" }
      - { name: name, type: string, source: input, description: "Program name (e.g. 'CA Artisan GL 2026')" }
      - { name: line_of_business, type: enum, source: input, description: "COMMERCIAL_AUTO | GENERAL_LIABILITY | PROPERTY | WORKERS_COMPENSATION | PROFESSIONAL_LIABILITY" }
      - { name: states_covered, type: array, source: input, description: "US state codes the program may write in (e.g. [\"CA\"])" }
      - { name: inception_date, type: datetime, source: input, description: "Program inception date" }
      - { name: aggregate_limit_cents, type: integer, source: input, description: "Lifetime aggregate written-premium capacity granted by the carrier" }
      - { name: commission_rate_pct, type: number, source: input, description: "MGA commission rate as decimal fraction (e.g. 0.15)" }
      - { name: corrective_threshold_pct, type: integer, source: input, description: "Incurred loss-ratio percentage at/above which corrective action triggers (inclusive >=)" }
      - { name: termination_threshold_pct, type: integer, source: input, description: "Incurred loss-ratio percentage at/above which termination review + auto-suspension triggers (inclusive >=)" }
      - { name: min_trust_balance_cents, type: integer, source: input, description: "Fiduciary floor; remittances may not push trust balance below this" }
      - { name: min_earned_premium_for_ratio_cents, type: integer, source: input, description: "Earned-premium floor below which a loss evaluation reports INSUFFICIENT_DATA" }
      - { name: status, type: enum, source: system, default: PROPOSED, description: "PROPOSED | ACTIVE | SUSPENDED | RUN_OFF | TERMINATED | DECLINED" }
      - { name: consumed_aggregate_cents, type: integer, source: computed, default: 0, description: "Lifetime consumed capacity = sum of gross premium of policies in {BOUND, ISSUED, PENDING_CANCELLATION} plus earned-retained portion of CANCELLED policies" }
      - { name: trust_balance_cents, type: integer, source: computed, default: 0, description: "Sum of all TrustLedgerEntry.amount_cents for this program" }
      - { name: latest_incurred_loss_ratio_pct, type: number, source: computed, description: "Incurred loss ratio from the most recent LossEvaluation; null until first evaluation", default: null }
      - { name: termination_reason, type: string, source: system, default: null, description: "Set when program is terminated/declined" }

  - name: UnderwritingGuideline
    parent: Program
    common_fields: true
    fields:
      - { name: program_id, type: string, source: system, description: "FK -> Program.id" }
      - { name: state_code, type: string, source: input, description: "State this guideline scopes" }
      - { name: class_code, type: string, source: input, description: "Class of business this guideline scopes (e.g. ARTISAN)" }
      - { name: max_policy_premium_cents, type: integer, source: input, description: "Binding authority: max gross premium per policy" }
      - { name: max_policy_limit_cents, type: integer, source: input, description: "Binding authority: max coverage limit per policy" }
      - { name: min_policy_premium_cents, type: integer, source: input, default: 0, description: "Minimum premium floor applied by the rating calc" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | SUPERSEDED | INACTIVE", constraints: "creating a guideline for an occupied (state_code, class_code) supersedes the prior ACTIVE one; at most one ACTIVE per scope" }

  - name: CapacityAllocation
    parent: Program
    common_fields: true
    fields:
      - { name: program_id, type: string, source: system, description: "FK -> Program.id" }
      - { name: period_label, type: string, source: input, description: "Tranche label (e.g. 2026-Q3)" }
      - { name: allocated_cents, type: integer, source: input, description: "Tranche capacity granted for the period" }
      - { name: consumed_cents, type: integer, source: computed, default: 0, description: "Consumed tranche capacity; floored at 0 on releases" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | EXHAUSTED | SUPERSEDED | RELEASED", constraints: "EXHAUSTED auto when consumed == allocated; SUPERSEDED when a new allocation is created; at most one non-terminal (ACTIVE|EXHAUSTED) allocation per program" }

  - name: RateFiling
    parent: Program
    common_fields: true
    fields:
      - { name: program_id, type: string, source: system, description: "FK -> Program.id" }
      - { name: state_code, type: string, source: input, description: "State this filing covers" }
      - { name: filing_type, type: enum, source: input, description: "RATE | RULE | FORM" }
      - { name: base_rates, type: object, source: input, description: "Map class_code -> rate per exposure unit in cents (e.g. {\"ARTISAN\": 1500})" }
      - { name: policy_fee_cents, type: integer, source: input, description: "Flat policy fee added to every rated policy" }
      - { name: effective_from, type: datetime, source: input, description: "Window start (inclusive); half-open interval [effective_from, effective_to)" }
      - { name: effective_to, type: datetime, source: input, description: "Window end (exclusive); may equal a successor's effective_from (adjacency allowed)" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | SUBMITTED | APPROVED | DISAPPROVED | EFFECTIVE | SUPERSEDED | WITHDRAWN" }
      - { name: version_seq, type: integer, source: computed, description: "Per program+state filing sequence; assigned by created_at ASC order (1-based)" }
      - { name: submitted_at, type: datetime, source: system, default: null, description: "Logical-clock timestamp of SUBMITTED transition" }
      - { name: approved_at, type: datetime, source: system, default: null, description: "Logical-clock timestamp of APPROVED transition" }

  - name: Policy
    parent: Program
    common_fields: true
    fields:
      - { name: program_id, type: string, source: system, description: "FK -> Program.id" }
      - { name: filing_id, type: string, source: system, description: "FK -> RateFiling.id; filing whose rates produced this quote" }
      - { name: insured_name, type: string, source: input, description: "Named insured" }
      - { name: state_code, type: string, source: input, description: "Risk state; must be in Program.states_covered" }
      - { name: class_code, type: string, source: input, description: "Class of business; must have ACTIVE guideline and filed rate" }
      - { name: exposure_units, type: integer, source: input, description: "Estimated exposure units (e.g. payroll hundreds); >= 1" }
      - { name: coverage_limit_cents, type: integer, source: input, description: "Requested coverage limit; <= guideline max_policy_limit_cents" }
      - { name: experience_mod, type: number, source: input, default: 1.0, description: "Experience modification factor; clamped to [0.75, 1.25] in rating" }
      - { name: effective_from, type: datetime, source: input, description: "Policy inception (inclusive)" }
      - { name: effective_to, type: datetime, source: input, description: "Policy expiry (exclusive)" }
      - { name: status, type: enum, source: system, default: QUOTED, description: "QUOTED | BOUND | ISSUED | PENDING_CANCELLATION | CANCELLED | EXPIRED | WITHDRAWN" }
      - { name: audit_status, type: enum, source: system, default: NOT_AUDITED, description: "NOT_AUDITED | AUDITED — independent parallel state dimension" }
      - { name: gross_premium_cents, type: integer, source: computed, description: "Provisional premium at quote/bind: round_half_up(exposure_units x base_rate x clamp(mod)) + policy_fee, floored at guideline min" }
      - { name: final_premium_cents, type: integer, source: computed, default: null, description: "Final audited premium after POST /policies/{id}/final-audit; null until audited" }
      - { name: mga_commission_cents, type: integer, source: computed, description: "round_half_up(gross_premium_cents x program.commission_rate_pct)" }
      - { name: collected_cents, type: integer, source: computed, default: 0, description: "Sum of COLLECTION ledger entries minus refunds for this policy" }
      - { name: earned_premium_cents, type: integer, source: computed, default: 0, description: "Pro-rata earned premium as of clock / cancellation date" }
      - { name: quote_valid_until, type: datetime, source: system, description: "Quote expiry = creation clock + 30 days (QUOTE_VALID_DAYS)" }
      - { name: bound_at, type: datetime, source: system, default: null, description: "Logical-clock timestamp of bind" }
      - { name: issued_at, type: datetime, source: system, default: null, description: "Logical-clock timestamp of issue" }
      - { name: cancelled_at, type: datetime, source: system, default: null, description: "Logical-clock timestamp when CANCELLED took effect" }
      - { name: cancellation_date, type: datetime, source: system, default: null, description: "Requested cancellation effective date" }
      - { name: cancellation_reason, type: enum, source: system, default: null, description: "INSURED_REQUEST | CARRIER_REQUEST | NON_PAYMENT" }
      - { name: pre_cancel_status, type: enum, source: system, default: null, description: "Status held when cancellation was requested (BOUND or ISSUED); reinstatement returns here" }
      - { name: capacity_released_cents, type: integer, source: system, default: 0, description: "Capacity released at cancellation; re-consumed on reinstatement" }
      - { name: reported_premium_bordereau_id, type: string, source: system, default: null, description: "Bordereau that reported this policy's premium to the carrier" }

  - name: Claim
    parent: Program
    common_fields: true
    fields:
      - { name: policy_id, type: string, source: system, description: "FK -> Policy.id" }
      - { name: program_id, type: string, source: system, description: "FK -> Program.id (denormalized from policy for program-scoped queries)" }
      - { name: assigned_tpa_id, type: string, source: system, description: "FK -> TPA.id; assigned at report time by the appointment selector (see calculation tpa_assignment)" }
      - { name: claim_type, type: enum, source: input, description: "PROPERTY_DAMAGE | BODILY_INJURY | LIABILITY | OTHER" }
      - { name: occurrence_date, type: datetime, source: input, description: "Date of loss; must be inside policy term [effective_from, effective_to) and within 60 days before report clock" }
      - { name: amount_claimed_cents, type: integer, source: input, description: "Amount claimed by insured" }
      - { name: case_reserve_cents, type: integer, source: system, default: 0, description: "Adjuster case reserve; set via set-reserve" }
      - { name: approved_amount_cents, type: integer, source: system, default: null, description: "Approved indemnity; set on APPROVED" }
      - { name: paid_cents, type: integer, source: system, default: 0, description: "Paid amount; set on PAID" }
      - { name: status, type: enum, source: system, default: REPORTED, description: "REPORTED | UNDER_REVIEW | REFERRED | APPROVED | DENIED | PAID | REOPENED | CLOSED" }
      - { name: denial_reason, type: string, source: system, default: null, description: "Required on deny" }
      - { name: denied_at, type: datetime, source: system, default: null, description: "Logical-clock timestamp of most recent denial" }
      - { name: reopened_count, type: integer, source: system, default: 0, description: "Number of DENIED -> REOPENED cycles; hard cap MAX_REOPENS = 2" }
      - { name: paid_at, type: datetime, source: system, default: null, description: "Logical-clock timestamp of payment" }
      - { name: referral_reason, type: enum, source: system, default: null, description: "AUTHORITY_EXCEEDED | ADJUSTER_ESCALATION | APPOINTMENT_SUSPENDED" }
      - { name: reported_claim_bordereau_id, type: string, source: system, default: null, description: "Bordereau that reported this claim to the carrier" }

  - name: TPAAppointment
    parent: Program
    common_fields: true
    fields:
      - { name: program_id, type: string, source: system, description: "FK -> Program.id" }
      - { name: tpa_id, type: string, source: input, description: "FK -> TPA.id" }
      - { name: claim_type, type: enum, source: input, description: "PROPERTY_DAMAGE | BODILY_INJURY | LIABILITY | OTHER — single-type scope" }
      - { name: authority_limit_cents, type: integer, source: input, description: "Max indemnity the TPA may approve without carrier referral" }
      - { name: effective_from, type: datetime, source: input, description: "Appointment window start (inclusive; closed interval)" }
      - { name: effective_to, type: datetime, source: input, description: "Appointment window end (inclusive; closed interval)" }
      - { name: status, type: enum, source: system, default: PENDING, description: "PENDING | ACTIVE | SUSPENDED | REVOKED | EXPIRED", constraints: "activation requires >= 30-day gap from any other ACTIVE|SUSPENDED appointment for same program+claim_type+tpa_id (APPOINTMENT_MIN_GAP_DAYS)" }

  - name: TrustLedgerEntry
    parent: Program
    common_fields: false
    fields:
      - { name: program_id, type: string, source: system, description: "FK -> Program.id" }
      - { name: policy_id, type: string, source: system, default: null, description: "FK -> Policy.id; set for COLLECTION and REFUND entries" }
      - { name: claim_id, type: string, source: system, default: null, description: "FK -> Claim.id; set for CLAIM_PAYMENT entries" }
      - { name: entry_type, type: enum, source: system, description: "COLLECTION | REFUND | CLAIM_PAYMENT | CARRIER_REMITTANCE", constraints: "COLLECTION positive; REFUND, CLAIM_PAYMENT, CARRIER_REMITTANCE negative" }
      - { name: amount_cents, type: integer, source: system, description: "Signed amount; trust_balance = sum(amount_cents) over all entries of the program" }
      - { name: basis_cents, type: integer, source: system, default: null, description: "For CARRIER_REMITTANCE: the unremitted-collections basis the remittance was computed from" }
      - { name: running_balance_cents, type: integer, source: computed, description: "Program trust balance immediately after this entry posts" }
      - { name: memo, type: string, source: input, default: null, description: "Free-text memo (collections/remittances)" }

  - name: Bordereau
    parent: Program
    common_fields: true
    fields:
      - { name: program_id, type: string, source: system, description: "FK -> Program.id" }
      - { name: bordereau_type, type: enum, source: input, description: "PREMIUM | CLAIMS" }
      - { name: period_label, type: string, source: input, description: "Reporting period (e.g. 2026-08)" }
      - { name: rows, type: array, source: input, default: [], description: "PREMIUM rows: {policy_id, written_premium_cents, commission_cents}; CLAIMS rows: {claim_id, paid_cents, case_reserve_cents}" }
      - { name: declared_totals, type: object, source: input, description: "PREMIUM: {premium_cents, commission_cents}; CLAIMS: {paid_cents, reserve_cents}" }
      - { name: computed_totals, type: object, source: computed, description: "Server-computed totals; commission computed per-row rounded then summed (see calculation bordereau_totals)" }
      - { name: row_count, type: integer, source: computed, description: "Number of rows" }
      - { name: due_date, type: datetime, source: input, description: "Carrier contractual due date" }
      - { name: overdue, type: boolean, source: computed, default: false, description: "true when clock > due_date and status == DRAFT (set by run-daily)" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | SUBMITTED | ACCEPTED | REJECTED | CANCELLED" }
      - { name: rejection_reason, type: string, source: system, default: null, description: "Set on REJECTED" }
      - { name: submitted_at, type: datetime, source: system, default: null, description: "Logical-clock timestamp of submission" }

  - name: CarrierAudit
    parent: Program
    common_fields: true
    fields:
      - { name: program_id, type: string, source: system, description: "FK -> Program.id" }
      - { name: scope, type: enum, source: input, description: "UNDERWRITING | CLAIMS | TRUST_ACCOUNTING | FULL" }
      - { name: scheduled_start, type: datetime, source: input, description: "Audit window start" }
      - { name: scheduled_end, type: datetime, source: input, description: "Audit window end" }
      - { name: findings, type: array, source: input, default: [], description: "[{finding_id, severity: MINOR|MAJOR|CRITICAL, description, resolved: boolean}] supplied at issue-findings" }
      - { name: status, type: enum, source: system, default: SCHEDULED, description: "SCHEDULED | IN_PROGRESS | FINDINGS_ISSUED | REMEDIATION | CLOSED | ESCALATED", constraints: "creation requires >= 30-day gap from any non-terminal audit of the same program (AUDIT_MIN_GAP_DAYS)" }
      - { name: outcome, type: enum, source: system, default: null, description: "SATISFACTORY | CORRECTIVE_ACTION | TERMINATION_RECOMMENDED" }

  - name: LossEvaluation
    parent: Program
    common_fields: true
    fields:
      - { name: program_id, type: string, source: system, description: "FK -> Program.id" }
      - { name: period_label, type: string, source: input, description: "Evaluation period label (e.g. 2026-11)" }
      - { name: earned_premium_cents, type: integer, source: computed, description: "Sum of per-policy pro-rata earned premium at evaluation clock; policies in {ISSUED, PENDING_CANCELLATION, CANCELLED, EXPIRED}" }
      - { name: paid_losses_cents, type: integer, source: computed, description: "Sum of paid_cents over claims of the program in {PAID, CLOSED} with paid_at <= clock" }
      - { name: case_reserves_cents, type: integer, source: computed, description: "Sum of case_reserve_cents over claims in {REPORTED, UNDER_REVIEW, REFERRED, APPROVED, REOPENED}" }
      - { name: paid_loss_ratio_pct, type: number, source: computed, description: "paid_losses_cents / earned_premium_cents x 100, 2 decimals round_half_up" }
      - { name: incurred_loss_ratio_pct, type: number, source: computed, description: "(paid_losses_cents + case_reserves_cents) / earned_premium_cents x 100, 2 decimals round_half_up" }
      - { name: outcome, type: enum, source: computed, description: "INSUFFICIENT_DATA | OK | CORRECTIVE_ACTION | TERMINATION_REVIEW", constraints: "INSUFFICIENT_DATA when earned < program.min_earned_premium_for_ratio_cents; else incurred >= termination threshold -> TERMINATION_REVIEW; incurred >= corrective -> CORRECTIVE_ACTION; else OK (thresholds inclusive)" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Program
    initial_state: PROPOSED
    terminal_states: [TERMINATED, DECLINED]
    transitions:
      - from: PROPOSED
        to: ACTIVE
        trigger: "POST /mga/programs/{programId}/activate"
        actor: CarrierUnderwriter
        preconditions:
          - "actor X-User-ID == program.carrier_id"
          - "carrier.status == ACTIVE"
          - "at least one UnderwritingGuideline of the program has status ACTIVE"
          - "at least one CapacityAllocation of the program has status in {ACTIVE, EXHAUSTED}"
          - "at least one RateFiling of the program has status EFFECTIVE"
        side_effects:
          - "program.version += 1"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /mga/programs/{programId}/suspend OR system cascade (audit ESCALATED with unresolved CRITICAL finding; loss evaluation outcome == TERMINATION_REVIEW)"
        actor: CarrierUnderwriter | system
        preconditions: []
        side_effects:
          - "every Policy of the program in QUOTED -> WITHDRAWN (no capacity had been consumed by QUOTED policies)"
          - "every TPAAppointment of the program in ACTIVE -> SUSPENDED; that appointment-level transition itself cascades: every Claim assigned to that TPA in UNDER_REVIEW -> REFERRED with referral_reason = APPOINTMENT_SUSPENDED"
          - "every Bordereau of the program in DRAFT -> CANCELLED"
          - "program.version += 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /mga/programs/{programId}/resume"
        actor: CarrierUnderwriter
        preconditions:
          - "actor X-User-ID == program.carrier_id"
          - "no CarrierAudit of the program in ESCALATED with an unresolved CRITICAL finding"
        side_effects:
          - "suspended TPAAppointments are NOT auto-restored (carrier must reinstate each explicitly)"
          - "program.version += 1"
      - from: ACTIVE
        to: RUN_OFF
        trigger: "POST /mga/programs/{programId}/enter-runoff"
        actor: CarrierUnderwriter
        preconditions:
          - "actor X-User-ID == program.carrier_id"
        side_effects:
          - "new policy quotes and binds blocked (ERR_PROGRAM_NOT_ACTIVE); in-force policies continue to expiry"
          - "program.version += 1"
      - from: SUSPENDED
        to: RUN_OFF
        trigger: "POST /mga/programs/{programId}/enter-runoff"
        actor: CarrierUnderwriter
        preconditions:
          - "actor X-User-ID == program.carrier_id"
        side_effects: ["program.version += 1"]
      - from: RUN_OFF
        to: TERMINATED
        trigger: "POST /mga/programs/{programId}/terminate"
        actor: CarrierUnderwriter
        preconditions:
          - "actor X-User-ID == program.carrier_id"
          - "no Policy of the program in {QUOTED, BOUND, ISSUED, PENDING_CANCELLATION} (else ERR_PROGRAM_HAS_ACTIVE_POLICIES)"
          - "no Claim of the program in {REPORTED, UNDER_REVIEW, REFERRED, APPROVED, REOPENED} (else ERR_OPEN_CLAIMS_EXIST)"
          - "no Bordereau of the program in {DRAFT, SUBMITTED, REJECTED} (else ERR_UNACCEPTED_BORDEREAUX)"
          - "program.trust_balance_cents == 0 (else ERR_TRUST_NOT_ZERO)"
        side_effects:
          - "all guidelines of the program -> INACTIVE"
          - "non-terminal CapacityAllocation (ACTIVE|EXHAUSTED) -> RELEASED"
          - "termination_reason set from request"
          - "program.version += 1"
      - from: PROPOSED
        to: DECLINED
        trigger: "POST /mga/programs/{programId}/decline"
        actor: CarrierUnderwriter
        preconditions:
          - "actor X-User-ID == program.carrier_id"
        side_effects: ["termination_reason set from request", "program.version += 1"]

  - entity: UnderwritingGuideline
    initial_state: ACTIVE
    terminal_states: [SUPERSEDED, INACTIVE]
    transitions:
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system (POST /mga/programs/{programId}/guidelines creates a new guideline for the same (state_code, class_code) scope)"
        actor: system
        preconditions: []
        side_effects: ["prior ACTIVE guideline in the same scope becomes SUPERSEDED atomically with the create"]
      - from: ACTIVE
        to: INACTIVE
        trigger: "system (Program terminate cascade)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: CapacityAllocation
    initial_state: ACTIVE
    terminal_states: [SUPERSEDED, RELEASED]
    transitions:
      - from: ACTIVE
        to: EXHAUSTED
        trigger: "system (after a bind/reinstate consumption makes consumed_cents == allocated_cents)"
        actor: system
        preconditions: []
        side_effects: ["EXHAUSTED allocations still occupy the program's single-allocation slot but accept no further consumption"]
      - from: EXHAUSTED
        to: ACTIVE
        trigger: "system (a cancellation release makes consumed_cents < allocated_cents)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system (POST /mga/programs/{programId}/capacity-allocations creates a replacement)"
        actor: system
        preconditions: []
        side_effects: ["unconsumed remainder (allocated_cents - consumed_cents) is reported as released to the carrier"]
      - from: EXHAUSTED
        to: SUPERSEDED
        trigger: "system (POST /mga/programs/{programId}/capacity-allocations creates a replacement)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: RELEASED
        trigger: "POST /mga/capacity-allocations/{allocationId}/release OR system (Program terminate cascade)"
        actor: CarrierUnderwriter | system
        preconditions: ["actor X-User-ID == program.carrier_id (manual release)"]
        side_effects: ["unconsumed remainder released to the carrier"]
      - from: EXHAUSTED
        to: RELEASED
        trigger: "POST /mga/capacity-allocations/{allocationId}/release OR system (Program terminate cascade)"
        actor: CarrierUnderwriter | system
        preconditions: ["actor X-User-ID == program.carrier_id (manual release)"]
        side_effects: []

  - entity: RateFiling
    initial_state: DRAFT
    terminal_states: [SUPERSEDED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /mga/rate-filings/{filingId}/submit"
        actor: MGAUnderwriter
        preconditions:
          - "base_rates non-empty (else ERR_INVALID_REQUEST)"
          - "effective_from < effective_to (else ERR_INVALID_REQUEST)"
        side_effects: ["submitted_at = clock"]
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /mga/rate-filings/{filingId}/approve"
        actor: CarrierUnderwriter
        preconditions:
          - "actor X-User-ID == filing program's carrier_id"
          - "no other RateFiling of the same program+state_code in {APPROVED, EFFECTIVE} whose half-open window [effective_from, effective_to) intersects this window; adjacency (this.effective_from == other.effective_to or this.effective_to == other.effective_from) is NOT an intersection (else ERR_FILING_WINDOW_OVERLAP)"
        side_effects: ["approved_at = clock"]
      - from: SUBMITTED
        to: DISAPPROVED
        trigger: "POST /mga/rate-filings/{filingId}/disapprove"
        actor: CarrierUnderwriter
        preconditions: ["actor X-User-ID == filing program's carrier_id"]
        side_effects: []
      - from: DISAPPROVED
        to: DRAFT
        trigger: "POST /mga/rate-filings/{filingId}/revise"
        actor: MGAUnderwriter
        preconditions: []
        side_effects: ["submitted_at/approved_at reset to null; filer edits base_rates/fee/window via a new submit cycle"]
        note: "revision loop DRAFT -> SUBMITTED -> DISAPPROVED -> DRAFT is unbounded"
      - from: APPROVED
        to: EFFECTIVE
        trigger: "POST /mga/rate-filings/{filingId}/mark-effective"
        actor: CarrierUnderwriter
        preconditions:
          - "actor X-User-ID == filing program's carrier_id"
          - "clock >= effective_from (else ERR_FILING_NOT_YET_EFFECTIVE)"
        side_effects:
          - "the prior RateFiling of the same program+state_code in EFFECTIVE (if any) -> SUPERSEDED; that supersession itself cascades: every Policy in QUOTED with filing_id == superseded filing -> WITHDRAWN"
          - "policies already BOUND/ISSUED keep their original filing_id (no re-rate)"
      - from: DRAFT
        to: WITHDRAWN
        trigger: "system (program TERMINATED/DECLINED) — filer may also abandon by simply never submitting"
        actor: system
        preconditions: []
        side_effects: []
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "system (program TERMINATED/DECLINED)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Policy
    initial_state: QUOTED
    terminal_states: [EXPIRED, WITHDRAWN]
    transitions:
      - from: QUOTED
        to: BOUND
        trigger: "POST /mga/policies/{policyId}/bind"
        actor: MGAUnderwriter
        preconditions:
          - "program.status == ACTIVE (else ERR_PROGRAM_NOT_ACTIVE)"
          - "clock <= quote_valid_until (else ERR_QUOTE_EXPIRED)"
          - "an ACTIVE guideline for (state_code, class_code) still exists and gross_premium_cents <= its max_policy_premium_cents (else ERR_GUIDELINE_PREMIUM_LIMIT)"
          - "program's current tranche allocation available (allocated_cents - consumed_cents) >= gross_premium_cents (else ERR_TRANCHE_EXHAUSTED)"
          - "program aggregate available (aggregate_limit_cents - consumed_aggregate_cents) >= gross_premium_cents (else ERR_CAPACITY_EXCEEDED)"
        side_effects:
          - "bound_at = clock"
          - "tranche.consumed_cents += gross_premium_cents; if consumed == allocated -> tranche EXHAUSTED"
          - "program.consumed_aggregate_cents += gross_premium_cents"
      - from: BOUND
        to: ISSUED
        trigger: "POST /mga/policies/{policyId}/issue"
        actor: MGAUnderwriter
        preconditions:
          - "collected_cents >= gross_premium_cents (else ERR_PREMIUM_NOT_COLLECTED)"
        side_effects: ["issued_at = clock"]
      - from: BOUND
        to: PENDING_CANCELLATION
        trigger: "POST /mga/policies/{policyId}/cancel"
        actor: MGAUnderwriter
        preconditions: ["cancellation_date <= effective_to (else ERR_INVALID_REQUEST)"]
        side_effects: ["pre_cancel_status = BOUND", "cancellation_date and cancellation_reason recorded"]
      - from: ISSUED
        to: PENDING_CANCELLATION
        trigger: "POST /mga/policies/{policyId}/cancel"
        actor: MGAUnderwriter
        preconditions: ["cancellation_date <= effective_to (else ERR_INVALID_REQUEST)"]
        side_effects: ["pre_cancel_status = ISSUED", "cancellation_date and cancellation_reason recorded"]
      - from: PENDING_CANCELLATION
        to: CANCELLED
        trigger: "system (POST /mga/_ops/run-daily processes policies whose cancellation_date <= clock)"
        actor: system
        preconditions: []
        side_effects:
          - "cancelled_at = clock"
          - "earned_premium_cents computed (calculation earned_premium; flat cancel when cancellation_date <= effective_from => earned = 0, fee waived)"
          - "refund = max(0, collected_cents - earned_premium_cents - CANCELLATION_FEE_CENTS); if refund > 0 post TrustLedgerEntry REFUND amount = -refund"
          - "capacity_released_cents = gross_premium_cents - earned_premium_cents; tranche.consumed_cents -= capacity_released_cents (floor 0); program.consumed_aggregate_cents -= capacity_released_cents; tranche EXHAUSTED -> ACTIVE if it drops below allocated"
      - from: CANCELLED
        to: BOUND
        trigger: "POST /mga/policies/{policyId}/reinstate when pre_cancel_status == BOUND"
        actor: MGAUnderwriter
        preconditions:
          - "program.status == ACTIVE (else ERR_PROGRAM_NOT_ACTIVE)"
          - "clock - cancelled_at <= REINSTATE_WINDOW_DAYS (30) (else ERR_REINSTATE_WINDOW_CLOSED)"
          - "tranche available >= capacity_released_cents (else ERR_TRANCHE_EXHAUSTED)"
          - "program aggregate available >= capacity_released_cents (else ERR_CAPACITY_EXCEEDED)"
        side_effects:
          - "tranche.consumed_cents += capacity_released_cents; program.consumed_aggregate_cents += capacity_released_cents"
          - "post TrustLedgerEntry COLLECTION amount = +refund_repaid only if a reinstatement premium is repaid; otherwise no ledger entry (the cancellation refund stands)"
          - "cancelled_at/cancellation fields cleared; capacity_released_cents reset to 0"
        note: "cyclic loop ISSUED -> PENDING_CANCELLATION -> CANCELLED -> ISSUED/BOUND"
      - from: CANCELLED
        to: ISSUED
        trigger: "POST /mga/policies/{policyId}/reinstate when pre_cancel_status == ISSUED"
        actor: MGAUnderwriter
        preconditions:
          - "program.status == ACTIVE (else ERR_PROGRAM_NOT_ACTIVE)"
          - "clock - cancelled_at <= REINSTATE_WINDOW_DAYS (30) (else ERR_REINSTATE_WINDOW_CLOSED)"
          - "tranche available >= capacity_released_cents (else ERR_TRANCHE_EXHAUSTED)"
          - "program aggregate available >= capacity_released_cents (else ERR_CAPACITY_EXCEEDED)"
          - "collected_cents >= gross_premium_cents (else ERR_PREMIUM_NOT_COLLECTED)"
        side_effects: ["same capacity re-consumption as BOUND reinstatement"]
      - from: BOUND
        to: EXPIRED
        trigger: "system (run-daily: effective_to < clock)"
        actor: system
        preconditions: []
        side_effects: ["earned_premium_cents = gross_premium_cents (full term earned); no capacity release (aggregate is lifetime written premium)"]
      - from: ISSUED
        to: EXPIRED
        trigger: "system (run-daily: effective_to < clock)"
        actor: system
        preconditions: []
        side_effects: ["earned_premium_cents = gross_premium_cents"]
      - from: QUOTED
        to: WITHDRAWN
        trigger: "system (run-daily quote lapse: quote_valid_until < clock) OR cascade (program suspension; filing supersession)"
        actor: system
        preconditions: []
        side_effects: []
      - from: NOT_AUDITED
        to: AUDITED
        trigger: "POST /mga/policies/{policyId}/final-audit (parallel dimension; policy lifecycle status must be ISSUED or EXPIRED)"
        actor: MGAUnderwriter
        preconditions:
          - "policy.status in {ISSUED, EXPIRED} (else ERR_POLICY_INVALID_STATE)"
          - "audit_status == NOT_AUDITED (else ERR_POLICY_INVALID_STATE)"
        side_effects:
          - "final_premium_cents computed (calculation policy_premium variant final_audit with actual_exposure_units / actual_experience_mod)"
          - "delta = final_premium_cents - gross_premium_cents; if delta > 0 post COLLECTION entry +delta; if delta < 0 post REFUND entry +delta (negative amount)"
          - "tranche.consumed_cents += delta (floor 0); program.consumed_aggregate_cents += delta"

  - entity: Claim
    initial_state: REPORTED
    terminal_states: [CLOSED]
    transitions:
      - from: REPORTED
        to: UNDER_REVIEW
        trigger: "POST /mga/claims/{claimId}/start-review"
        actor: TPAAdjuster
        preconditions:
          - "actor X-User-ID == claim.assigned_tpa_id"
          - "the appointment under which the claim was assigned is ACTIVE (else ERR_APPOINTMENT_NOT_ACTIVE)"
        side_effects: []
      - from: UNDER_REVIEW
        to: UNDER_REVIEW
        trigger: "POST /mga/claims/{claimId}/set-reserve"
        actor: TPAAdjuster
        preconditions: ["actor X-User-ID == claim.assigned_tpa_id", "case_reserve_cents >= 0"]
        side_effects: ["case_reserve_cents updated"]
        note: "self-transition; does not change status"
      - from: UNDER_REVIEW
        to: REFERRED
        trigger: "POST /mga/claims/{claimId}/refer OR system cascade (TPAAppointment of the claim -> SUSPENDED)"
        actor: TPAAdjuster | system
        preconditions: ["actor X-User-ID == claim.assigned_tpa_id (manual refer)"]
        side_effects: ["referral_reason = ADJUSTER_ESCALATION (manual) or APPOINTMENT_SUSPENDED (cascade)"]
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /mga/claims/{claimId}/approve"
        actor: TPAAdjuster | CarrierUnderwriter
        preconditions:
          - "TPAAdjuster: actor X-User-ID == claim.assigned_tpa_id AND approved_amount_cents <= appointment.authority_limit_cents (else ERR_AUTHORITY_LIMIT_EXCEEDED) AND appointment ACTIVE"
          - "CarrierUnderwriter: actor X-User-ID == program.carrier_id (carrier may approve from UNDER_REVIEW or REFERRED without authority cap)"
          - "approved_amount_cents <= amount_claimed_cents (else ERR_APPROVED_EXCEEDS_CLAIMED)"
        side_effects: ["approved_amount_cents set"]
      - from: REFERRED
        to: APPROVED
        trigger: "POST /mga/claims/{claimId}/approve"
        actor: CarrierUnderwriter
        preconditions: ["actor X-User-ID == program.carrier_id", "approved_amount_cents <= amount_claimed_cents (else ERR_APPROVED_EXCEEDS_CLAIMED)"]
        side_effects: ["approved_amount_cents set"]
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /mga/claims/{claimId}/deny"
        actor: TPAAdjuster | CarrierUnderwriter
        preconditions: ["TPAAdjuster: actor X-User-ID == claim.assigned_tpa_id and appointment ACTIVE; CarrierUnderwriter: actor X-User-ID == program.carrier_id", "denial_reason non-empty"]
        side_effects: ["denial_reason set", "denied_at = clock"]
      - from: REFERRED
        to: DENIED
        trigger: "POST /mga/claims/{claimId}/deny"
        actor: CarrierUnderwriter
        preconditions: ["actor X-User-ID == program.carrier_id", "denial_reason non-empty"]
        side_effects: ["denial_reason set", "denied_at = clock"]
      - from: APPROVED
        to: PAID
        trigger: "POST /mga/claims/{claimId}/pay"
        actor: TPAAdjuster
        preconditions:
          - "actor X-User-ID == claim.assigned_tpa_id"
          - "program.trust_balance_cents >= approved_amount_cents (else ERR_TRUST_INSUFFICIENT_FUNDS)"
        side_effects:
          - "post TrustLedgerEntry CLAIM_PAYMENT amount = -approved_amount_cents (claim_id set)"
          - "claim.paid_cents = approved_amount_cents; paid_at = clock; case_reserve_cents = 0"
      - from: DENIED
        to: REOPENED
        trigger: "POST /mga/claims/{claimId}/reopen"
        actor: MGAUnderwriter
        preconditions:
          - "reopened_count < MAX_REOPENS (2) (else ERR_REOPEN_LIMIT_EXCEEDED)"
          - "clock - denied_at <= REOPEN_WINDOW_DAYS (90) (else ERR_REOPEN_WINDOW_CLOSED)"
        side_effects: ["reopened_count += 1"]
        note: "cyclic loop DENIED -> REOPENED -> UNDER_REVIEW, bounded by MAX_REOPENS"
      - from: REOPENED
        to: UNDER_REVIEW
        trigger: "POST /mga/claims/{claimId}/resume-review"
        actor: TPAAdjuster
        preconditions: ["actor X-User-ID == claim.assigned_tpa_id", "appointment ACTIVE (else ERR_APPOINTMENT_NOT_ACTIVE)"]
        side_effects: []
      - from: PAID
        to: CLOSED
        trigger: "POST /mga/claims/{claimId}/close"
        actor: CarrierUnderwriter
        preconditions: ["actor X-User-ID == program.carrier_id"]
        side_effects: []
      - from: DENIED
        to: CLOSED
        trigger: "POST /mga/claims/{claimId}/close"
        actor: CarrierUnderwriter
        preconditions: ["actor X-User-ID == program.carrier_id"]
        side_effects: []

  - entity: TPAAppointment
    initial_state: PENDING
    terminal_states: [REVOKED, EXPIRED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /mga/tpa-appointments/{appointmentId}/activate"
        actor: CarrierUnderwriter
        preconditions:
          - "actor X-User-ID == program.carrier_id"
          - "tpa.status == ACTIVE (else ERR_TPA_SUSPENDED)"
          - "clock <= effective_to (else ERR_APPOINTMENT_WINDOW_CLOSED)"
          - "for every other appointment of the same program+claim_type+tpa_id in {ACTIVE, SUSPENDED}: gap between closed windows >= APPOINTMENT_MIN_GAP_DAYS (30) in either direction, i.e. new.effective_from - other.effective_to >= 30 days OR other.effective_from - new.effective_to >= 30 days; adjacency (gap < 30) IS a conflict (else ERR_APPOINTMENT_WINDOW_GAP). Distinct TPAs may hold concurrent ACTIVE appointments for the same scope (the selector ranks among them)"
        side_effects: []
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /mga/tpa-appointments/{appointmentId}/suspend OR system cascade (program suspension)"
        actor: CarrierUnderwriter | system
        preconditions: ["actor X-User-ID == program.carrier_id (manual suspend)"]
        side_effects: ["every Claim assigned to this appointment's TPA in UNDER_REVIEW -> REFERRED with referral_reason = APPOINTMENT_SUSPENDED"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /mga/tpa-appointments/{appointmentId}/reinstate"
        actor: CarrierUnderwriter
        preconditions:
          - "actor X-User-ID == program.carrier_id"
          - "program.status == ACTIVE (else ERR_PROGRAM_NOT_ACTIVE)"
          - "clock <= effective_to (else ERR_APPOINTMENT_WINDOW_CLOSED)"
        side_effects: ["referred claims are NOT auto-returned; they stay REFERRED for carrier decision"]
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /mga/tpa-appointments/{appointmentId}/revoke"
        actor: CarrierUnderwriter
        preconditions: ["actor X-User-ID == program.carrier_id"]
        side_effects: ["claims in REPORTED assigned to this TPA remain REPORTED but cannot start review (ERR_APPOINTMENT_NOT_ACTIVE); claims in UNDER_REVIEW -> REFERRED (APPOINTMENT_SUSPENDED)"]
      - from: SUSPENDED
        to: REVOKED
        trigger: "POST /mga/tpa-appointments/{appointmentId}/revoke"
        actor: CarrierUnderwriter
        preconditions: ["actor X-User-ID == program.carrier_id"]
        side_effects: []
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (run-daily: effective_to < clock)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Bordereau
    initial_state: DRAFT
    terminal_states: [ACCEPTED, CANCELLED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /mga/bordereaux/{bordereauId}/submit"
        actor: MGAFinance
        preconditions:
          - "row_count >= 1 (else ERR_EMPTY_BORDEREAU)"
          - "no other bordereau of same program+bordereau_type+period_label in ACCEPTED (else ERR_BORDEREAU_PERIOD_COVERED)"
          - "no duplicate policy_id (PREMIUM) / claim_id (CLAIMS) within rows (else ERR_BORDEREAU_DUPLICATE_ROW)"
          - "every row's policy_id/claim_id exists and belongs to this program (else ERR_BORDEREAU_ROW_UNKNOWN_POLICY)"
          - "every row's amounts equal the referenced entity's current fields (PREMIUM: policy.gross_premium_cents and policy.mga_commission_cents; CLAIMS: claim.paid_cents and claim.case_reserve_cents) (else ERR_BORDEREAU_ROW_MISMATCH)"
          - "declared_totals == computed_totals (calculation bordereau_totals: per-row commission rounded then summed) (else ERR_BORDEREAU_TOTAL_MISMATCH)"
        side_effects: ["submitted_at = clock", "computed_totals and row_count frozen at submission"]
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /mga/bordereaux/{bordereauId}/accept"
        actor: CarrierUnderwriter
        preconditions: ["actor X-User-ID == program.carrier_id"]
        side_effects:
          - "PREMIUM: each referenced policy.reported_premium_bordereau_id = this bordereau"
          - "CLAIMS: each referenced claim.reported_claim_bordereau_id = this bordereau"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /mga/bordereaux/{bordereauId}/reject"
        actor: CarrierUnderwriter
        preconditions: ["actor X-User-ID == program.carrier_id", "rejection_reason non-empty"]
        side_effects: ["rejection_reason set"]
      - from: REJECTED
        to: DRAFT
        trigger: "POST /mga/bordereaux/{bordereauId}/revise"
        actor: MGAFinance
        preconditions: []
        side_effects: ["rejection_reason cleared; submitted_at reset to null"]
        note: "revision loop DRAFT -> SUBMITTED -> REJECTED -> DRAFT"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /mga/bordereaux/{bordereauId}/cancel OR system cascade (program suspension)"
        actor: MGAFinance | system
        preconditions: []
        side_effects: []

  - entity: CarrierAudit
    initial_state: SCHEDULED
    terminal_states: [CLOSED, ESCALATED]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /mga/audits/{auditId}/start"
        actor: CarrierAuditor
        preconditions: ["clock >= scheduled_start (else ERR_AUDIT_WINDOW_NOT_OPEN)"]
        side_effects: []
      - from: IN_PROGRESS
        to: FINDINGS_ISSUED
        trigger: "POST /mga/audits/{auditId}/issue-findings"
        actor: CarrierAuditor
        preconditions: ["findings array present (may be empty for a clean audit)"]
        side_effects: ["findings stored verbatim with resolved flags"]
      - from: FINDINGS_ISSUED
        to: REMEDIATION
        trigger: "POST /mga/audits/{auditId}/submit-remediation"
        actor: MGAUnderwriter
        preconditions: []
        side_effects: ["findings whose finding_id is in resolved_finding_ids are marked resolved = true"]
      - from: FINDINGS_ISSUED
        to: CLOSED
        trigger: "POST /mga/audits/{auditId}/close"
        actor: CarrierAuditor
        preconditions: ["no finding with severity in {MAJOR, CRITICAL} has resolved == false (else ERR_UNRESOLVED_CRITICAL_FINDINGS)"]
        side_effects: ["outcome set from request"]
      - from: REMEDIATION
        to: CLOSED
        trigger: "POST /mga/audits/{auditId}/close"
        actor: CarrierAuditor
        preconditions: ["no finding with severity in {MAJOR, CRITICAL} has resolved == false (else ERR_UNRESOLVED_CRITICAL_FINDINGS)"]
        side_effects: ["outcome set from request"]
      - from: FINDINGS_ISSUED
        to: ESCALATED
        trigger: "POST /mga/audits/{auditId}/escalate"
        actor: CarrierAuditor
        preconditions: ["at least one finding with severity CRITICAL has resolved == false (else ERR_NO_CRITICAL_FINDING)"]
        side_effects:
          - "if program.status == ACTIVE: program -> SUSPENDED, firing the full suspension cascade (QUOTED policies -> WITHDRAWN; ACTIVE appointments -> SUSPENDED, each of which refers its UNDER_REVIEW claims -> REFERRED; DRAFT bordereaux -> CANCELLED)"
          - "outcome = TERMINATION_RECOMMENDED"
      - from: REMEDIATION
        to: ESCALATED
        trigger: "POST /mga/audits/{auditId}/escalate"
        actor: CarrierAuditor
        preconditions: ["at least one finding with severity CRITICAL has resolved == false (else ERR_NO_CRITICAL_FINDING)"]
        side_effects: ["same program suspension cascade as FINDINGS_ISSUED -> ESCALATED"]

  - entity: Carrier
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /mga/carriers/{carrierId}/suspend"
        actor: PlatformAdmin
        preconditions: []
        side_effects: ["existing programs of the carrier are NOT affected; only new program activations are blocked"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /mga/carriers/{carrierId}/suspend (toggles back)"
        actor: PlatformAdmin
        preconditions: []
        side_effects: []
        note: "suspend toggles; name kept for operational symmetry"

  - entity: TPA
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /mga/tpas/{tpaId}/suspend"
        actor: PlatformAdmin
        preconditions: []
        side_effects: ["in-flight claims and appointments of the TPA are NOT cascaded; only new appointment create/activate is blocked"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /mga/tpas/{tpaId}/suspend (toggles back)"
        actor: PlatformAdmin
        preconditions: []
        side_effects: []

# TrustLedgerEntry and LossEvaluation are append-only records (no state machine).
# TrustLedgerEntry carries common_fields: false (id + created_at only; immutable, no version/updated_at).

# =============================================================================
# §1.2.1 Concurrency Rules (true races only, OCC-resolved)
# =============================================================================
concurrency_rules:
  - rule_id: guideline-create-stale-program
    parent_entity: Program
    write_endpoint: "POST /mga/programs/{programId}/guidelines"
    occ_field: "expected_program_version"
    description: |
      Creating an UnderwritingGuideline against a Program whose version has
      advanced since the client last observed it is rejected. Creating a
      guideline legitimately supersedes the prior ACTIVE guideline of the same
      scope and bumps program.version, so a writer holding a stale program view
      would supersede blind. The stale writer gets ERR_STALE_VERSION.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: capacity-create-stale-program
    parent_entity: Program
    write_endpoint: "POST /mga/programs/{programId}/capacity-allocations"
    occ_field: "expected_program_version"
    description: |
      Creating a CapacityAllocation against a Program whose version has
      advanced since the client last observed it is rejected. Creating an
      allocation legitimately supersedes the current ACTIVE/EXHAUSTED tranche
      and bumps program.version, so a writer holding a stale program view
      would supersede blind. The stale writer gets ERR_STALE_VERSION.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: policy_premium
    trigger: "POST /mga/programs/{programId}/policies (variant provisional) and POST /mga/policies/{policyId}/final-audit (variant final_audit)"
    algorithm: tiered_pricing
    formula: |
      clamped_mod = max(0.75, min(1.25, experience_mod))          # clamp BEFORE multiply
      raw_cents   = round_half_up(exposure_units * base_rate_cents * clamped_mod, 0)
      pre_floor   = raw_cents + filing.policy_fee_cents
      gross_cents = max(pre_floor, guideline.min_policy_premium_cents)
      mga_commission_cents = round_half_up(gross_cents * program.commission_rate_pct, 0)
      validation AFTER calc: gross_cents > guideline.max_policy_premium_cents
        -> ERR_GUIDELINE_PREMIUM_LIMIT (at quote AND re-checked at bind)
    input_set: "base_rate_cents = filing.base_rates[class_code] of the EFFECTIVE RateFiling for (program, state_code) whose half-open window covers policy.effective_from; guideline = ACTIVE UnderwritingGuideline for (state_code, class_code)"
    constants:
      MOD_CLAMP_LOW: 0.75
      MOD_CLAMP_HIGH: 1.25
    precision: "integer cents; round_half_up to 0 decimals at each stated step; no float drift"
    variants:
      - name: provisional
        when: "quote/bind time; uses quoted exposure_units and experience_mod"
        difference: "produces gross_premium_cents"
      - name: final_audit
        when: "POST /policies/{id}/final-audit with actual_exposure_units and actual_experience_mod after ISSUED/EXPIRED"
        difference: "same formula run on actuals; produces final_premium_cents; delta vs gross_premium_cents posts a COLLECTION (+) or REFUND (-) ledger entry and adjusts both tranche.consumed_cents and program.consumed_aggregate_cents by delta"

  - name: earned_premium
    trigger: "cancellation processing (run-daily CANCELLED transition), expiry processing, and loss_evaluation earned basis"
    algorithm: chronological
    formula: |
      term_days    = days(effective_to - effective_from)            # whole days
      elapsed_days = days(min(as_of, effective_to) - effective_from), clamped to [0, term_days]
      pro_rata_earned = round_half_up(gross_premium_cents * elapsed_days / term_days, 0)
      flat cancel: cancellation_date <= effective_from  => earned = 0, fee waived
      variant selection: cancellation_reason == INSURED_REQUEST (non-flat) => short_rate
    input_set: "the single policy being cancelled/expired; for loss evaluation: all policies of the program in {ISSUED, PENDING_CANCELLATION, CANCELLED, EXPIRED}, as_of = min(clock, effective_to or cancelled point)"
    constants:
      CANCELLATION_FEE_CENTS: 2500
      SHORT_RATE_FACTOR: 1.10
    precision: "integer cents, round_half_up"
    variants:
      - name: pro_rata
        when: "expiry, loss-evaluation earned basis, and cancellations with reason CARRIER_REQUEST or NON_PAYMENT"
        difference: "earned = pro_rata_earned"
      - name: short_rate
        when: "cancellation with cancellation_reason == INSURED_REQUEST and not a flat cancel"
        difference: "earned = round_half_up(pro_rata_earned * 1.10, 0) — a 10% penalty, so the refund is smaller for identical dates"

  - name: trust_remittance
    trigger: "POST /mga/programs/{programId}/remittances"
    algorithm: waterfall_allocation
    formula: |
      # evaluation order is PINNED to break the circular-looking dependency:
      # the holdback tier keys on net_before_holdback, NOT on the final remittance.
      basis_cents    = sum(amount_cents of all COLLECTION entries) - sum(basis_cents of all prior CARRIER_REMITTANCE entries)
      commission     = round_half_up(basis_cents * program.commission_rate_pct, 0)
      net_before_holdback = basis_cents - commission
      holdback_pct   = 0.10 if net_before_holdback >= HOLDBACK_TIER_THRESHOLD_CENTS else 0.02
      holdback       = round_half_up(net_before_holdback * holdback_pct, 0)
      remittance     = net_before_holdback - holdback
      validations: basis_cents == 0 -> ERR_NOTHING_TO_REMIT;
                   trust_balance_cents - declared_amount_cents < min_trust_balance_cents -> ERR_TRUST_FLOOR_BREACH (safety, checked first);
                   declared_amount_cents != remittance -> ERR_REMITTANCE_MISMATCH (fiscal, checked second)
    input_set: "all TrustLedgerEntry rows of the program (COLLECTION and CARRIER_REMITTANCE types)"
    constants:
      HOLDBACK_TIER_THRESHOLD_CENTS: 100000   # $1,000.00
      HOLDBACK_PCT_HIGH: 0.10
      HOLDBACK_PCT_LOW: 0.02
    precision: "integer cents, round_half_up per step in the pinned order"

  - name: loss_ratio
    trigger: "POST /mga/programs/{programId}/loss-evaluations"
    algorithm: aggregation
    formula: |
      earned = sum over policies in {ISSUED, PENDING_CANCELLATION, CANCELLED, EXPIRED} of earned_premium (calculation earned_premium, pro_rata variant, as_of = clock)
      paid   = sum of paid_cents over claims in {PAID, CLOSED} with paid_at <= clock
      reserves = sum of case_reserve_cents over claims in {REPORTED, UNDER_REVIEW, REFERRED, APPROVED, REOPENED}
      paid_loss_ratio_pct     = round_half_up(paid * 100 / earned, 2)            # guard: earned == 0 -> ratio null
      incurred_loss_ratio_pct = round_half_up((paid + reserves) * 100 / earned, 2)
      outcome: earned < program.min_earned_premium_for_ratio_cents -> INSUFFICIENT_DATA
               else incurred >= termination_threshold_pct -> TERMINATION_REVIEW (fires program auto-suspension cascade)
               else incurred >= corrective_threshold_pct  -> CORRECTIVE_ACTION
               else OK                                     # thresholds inclusive (>=)
    input_set: "program's policies and claims as filtered above; as_of = current logical clock"
    constants: {}
    precision: "ratios at 2 decimal places, round_half_up; comparisons on the rounded ratio"
    variants:
      - name: paid_basis
        when: "informational reporting field paid_loss_ratio_pct"
        difference: "uses paid losses only; for identical data it is always <= incurred basis and can clear thresholds the incurred basis breaches"
      - name: incurred_basis
        when: "outcome determination (the ONLY basis that drives CORRECTIVE_ACTION / TERMINATION_REVIEW / auto-suspension)"
        difference: "uses paid + case reserves; identical data yields a strictly higher ratio whenever any open claim carries a reserve"

  - name: bordereau_totals
    trigger: "POST /mga/bordereaux/{bordereauId}/submit (validates declared_totals) and bordereau create/update (computes computed_totals)"
    algorithm: aggregation
    formula: |
      PREMIUM: for each row: row_commission = round_half_up(row.written_premium_cents * program.commission_rate_pct, 0)
               computed_totals = { premium_cents: sum(row.written_premium_cents),
                                   commission_cents: sum(row_commission) }     # per-row round THEN sum — pinned order
      CLAIMS:  computed_totals = { paid_cents: sum(row.paid_cents), reserve_cents: sum(row.case_reserve_cents) }
      submit validation: declared_totals == computed_totals else ERR_BORDEREAU_TOTAL_MISMATCH
    input_set: "the bordereau's own rows array at submission time"
    constants: {}
    precision: "integer cents; per-row round_half_up BEFORE summation (summing unrounded then rounding gives different cents and is WRONG)"

  - name: tpa_assignment
    trigger: "POST /mga/policies/{policyId}/claims (claim creation)"
    algorithm: topological
    formula: |
      candidates = TPAAppointments a where a.program_id == policy.program_id
                     AND a.claim_type == claim.claim_type
                     AND a.status == ACTIVE
                     AND a.effective_from <= occurrence_date <= a.effective_to   # CLOSED interval (both ends inclusive)
      rank: authority_limit_cents DESC
      tie-break 1: created_at ASC
      tie-break 2: tpa license_number ASC (a business field; never id)
      empty candidate set -> ERR_NO_ELIGIBLE_TPA (claim is NOT created)
    input_set: "all TPAAppointment rows of the program"
    constants: {}
    precision: "n/a (selection, not arithmetic)"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present; role is a declared role", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "role permitted for the endpoint per §1.5 roles; ownership: CarrierUnderwriter X-User-ID == program.carrier_id on carrier-scoped actions; TPAAdjuster X-User-ID == claim.assigned_tpa_id on adjuster actions", error_id: ERR_FORBIDDEN, http_status: 403, applies_to: "all" }
  - { priority: 3, category: existence, check: "every id in path and every FK in body exists (left-to-right path order)", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all" }
  - { priority: 4, category: business_constraint, check: "request body well-formed: required fields present, types valid, enum members valid, dates parse, effective_from < effective_to, amounts > 0 where required", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all" }
  - { priority: 5, category: business_constraint, check: "uniqueness: carrier naic_code unique; TPA license_number unique", error_id: ERR_NAIC_CODE_EXISTS, http_status: 409, applies_to: "POST /mga/carriers" }
  - { priority: 5, category: business_constraint, check: "uniqueness: TPA license_number unique", error_id: ERR_LICENSE_NUMBER_EXISTS, http_status: 409, applies_to: "POST /mga/tpas" }
  - { priority: 6, category: state, check: "OCC: expected_program_version == current program.version on the two supersede-creating endpoints", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "POST /mga/programs/{programId}/guidelines, POST /mga/programs/{programId}/capacity-allocations" }
  - { priority: 7, category: state, check: "target entity in a valid from-state for the requested transition (per §1.2); terminal entities reject all transitions", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all action endpoints" }
  - { priority: 7, category: state, check: "program in terminal {TERMINATED, DECLINED} rejects any child creation or transition — checked BEFORE the not-ACTIVE check so terminal programs yield the terminal error", error_id: ERR_PROGRAM_TERMINAL, http_status: 409, applies_to: "POST /mga/programs/{programId}/{children...} and all /mga/programs/{programId} action endpoints" }
  - { priority: 7, category: state, check: "program.status == ACTIVE for quote/bind/reinstate/appointment-reinstate (fires for non-terminal non-ACTIVE states: PROPOSED, SUSPENDED, RUN_OFF)", error_id: ERR_PROGRAM_NOT_ACTIVE, http_status: 409, applies_to: "POST /mga/programs/{programId}/policies, POST /mga/policies/{policyId}/bind, POST /mga/policies/{policyId}/reinstate, POST /mga/tpa-appointments/{appointmentId}/reinstate" }
  - { priority: 7, category: state, check: "program.status in {ACTIVE, RUN_OFF, SUSPENDED} for remittances and loss evaluations", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "POST /mga/programs/{programId}/remittances, POST /mga/programs/{programId}/loss-evaluations" }
  - { priority: 7, category: state, check: "program activate: carrier.status == ACTIVE", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "POST /mga/programs/{programId}/activate" }
  - { priority: 8, category: business_safety, check: "TPA approve: approved_amount_cents <= appointment.authority_limit_cents", error_id: ERR_AUTHORITY_LIMIT_EXCEEDED, http_status: 422, applies_to: "POST /mga/claims/{claimId}/approve" }
  - { priority: 8, category: business_safety, check: "claim pay: program.trust_balance_cents >= approved_amount_cents (fiduciary funds may not go negative)", error_id: ERR_TRUST_INSUFFICIENT_FUNDS, http_status: 422, applies_to: "POST /mga/claims/{claimId}/pay" }
  - { priority: 8, category: business_safety, check: "remittance: trust_balance_cents - declared_amount_cents >= program.min_trust_balance_cents", error_id: ERR_TRUST_FLOOR_BREACH, http_status: 422, applies_to: "POST /mga/programs/{programId}/remittances" }
  - { priority: 9, category: business_temporal, check: "claim report: occurrence_date within policy term [effective_from, effective_to)", error_id: ERR_OUTSIDE_COVERAGE_PERIOD, http_status: 422, applies_to: "POST /mga/policies/{policyId}/claims" }
  - { priority: 9, category: business_temporal, check: "claim report: clock - occurrence_date <= REPORTING_DEADLINE_DAYS (60)", error_id: ERR_REPORTING_DEADLINE_MISSED, http_status: 422, applies_to: "POST /mga/policies/{policyId}/claims" }
  - { priority: 9, category: business_temporal, check: "quote: policy effective window inside the EFFECTIVE filing's half-open window; effective_from >= clock", error_id: ERR_POLICY_WINDOW_OUTSIDE_FILING, http_status: 422, applies_to: "POST /mga/programs/{programId}/policies" }
  - { priority: 9, category: business_temporal, check: "bind: clock <= policy.quote_valid_until", error_id: ERR_QUOTE_EXPIRED, http_status: 422, applies_to: "POST /mga/policies/{policyId}/bind" }
  - { priority: 9, category: business_temporal, check: "filing approve: half-open window overlap with another APPROVED/EFFECTIVE filing of same program+state (adjacency allowed)", error_id: ERR_FILING_WINDOW_OVERLAP, http_status: 422, applies_to: "POST /mga/rate-filings/{filingId}/approve" }
  - { priority: 9, category: business_temporal, check: "filing mark-effective: clock >= effective_from", error_id: ERR_FILING_NOT_YET_EFFECTIVE, http_status: 422, applies_to: "POST /mga/rate-filings/{filingId}/mark-effective" }
  - { priority: 9, category: business_temporal, check: "appointment activate/reinstate: clock <= effective_to", error_id: ERR_APPOINTMENT_WINDOW_CLOSED, http_status: 422, applies_to: "POST /mga/tpa-appointments/{appointmentId}/activate, POST /mga/tpa-appointments/{appointmentId}/reinstate" }
  - { priority: 9, category: business_temporal, check: "appointment activate: >= 30-day gap (closed-window semantics) from any ACTIVE/SUSPENDED appointment of same program+claim_type+tpa_id", error_id: ERR_APPOINTMENT_WINDOW_GAP, http_status: 422, applies_to: "POST /mga/tpa-appointments/{appointmentId}/activate" }
  - { priority: 9, category: business_temporal, check: "audit create: >= 30-day gap from any audit of the program in {SCHEDULED, IN_PROGRESS, FINDINGS_ISSUED, REMEDIATION}", error_id: ERR_AUDIT_WINDOW_GAP, http_status: 422, applies_to: "POST /mga/programs/{programId}/audits" }
  - { priority: 9, category: business_temporal, check: "audit start: clock >= scheduled_start", error_id: ERR_AUDIT_WINDOW_NOT_OPEN, http_status: 422, applies_to: "POST /mga/audits/{auditId}/start" }
  - { priority: 9, category: business_temporal, check: "claim reopen: clock - denied_at <= 90 days", error_id: ERR_REOPEN_WINDOW_CLOSED, http_status: 422, applies_to: "POST /mga/claims/{claimId}/reopen" }
  - { priority: 9, category: business_temporal, check: "policy reinstate: clock - cancelled_at <= 30 days", error_id: ERR_REINSTATE_WINDOW_CLOSED, http_status: 422, applies_to: "POST /mga/policies/{policyId}/reinstate" }
  - { priority: 10, category: business_constraint, check: "quote: state_code in program.states_covered", error_id: ERR_STATE_NOT_COVERED, http_status: 422, applies_to: "POST /mga/programs/{programId}/policies" }
  - { priority: 10, category: business_constraint, check: "quote: ACTIVE guideline exists for (state_code, class_code)", error_id: ERR_CLASS_NOT_ELIGIBLE, http_status: 422, applies_to: "POST /mga/programs/{programId}/policies" }
  - { priority: 10, category: business_constraint, check: "quote/bind: gross_premium_cents <= guideline.max_policy_premium_cents", error_id: ERR_GUIDELINE_PREMIUM_LIMIT, http_status: 422, applies_to: "POST /mga/programs/{programId}/policies, POST /mga/policies/{policyId}/bind" }
  - { priority: 10, category: business_constraint, check: "quote: coverage_limit_cents <= guideline.max_policy_limit_cents", error_id: ERR_GUIDELINE_LIMIT_EXCEEDED, http_status: 422, applies_to: "POST /mga/programs/{programId}/policies" }
  - { priority: 10, category: business_constraint, check: "claim approve: approved_amount_cents <= amount_claimed_cents", error_id: ERR_APPROVED_EXCEEDS_CLAIMED, http_status: 422, applies_to: "POST /mga/claims/{claimId}/approve" }
  - { priority: 10, category: business_constraint, check: "claim reopen: reopened_count < MAX_REOPENS (2)", error_id: ERR_REOPEN_LIMIT_EXCEEDED, http_status: 422, applies_to: "POST /mga/claims/{claimId}/reopen" }
  - { priority: 10, category: business_constraint, check: "bordereau submit: row_count >= 1", error_id: ERR_EMPTY_BORDEREAU, http_status: 422, applies_to: "POST /mga/bordereaux/{bordereauId}/submit" }
  - { priority: 10, category: business_constraint, check: "bordereau submit: no ACCEPTED bordereau for same program+type+period", error_id: ERR_BORDEREAU_PERIOD_COVERED, http_status: 422, applies_to: "POST /mga/bordereaux/{bordereauId}/submit" }
  - { priority: 10, category: business_constraint, check: "bordereau submit: no duplicate policy_id/claim_id within rows", error_id: ERR_BORDEREAU_DUPLICATE_ROW, http_status: 422, applies_to: "POST /mga/bordereaux/{bordereauId}/submit" }
  - { priority: 10, category: business_constraint, check: "audit escalate: >= 1 unresolved CRITICAL finding", error_id: ERR_NO_CRITICAL_FINDING, http_status: 422, applies_to: "POST /mga/audits/{auditId}/escalate" }
  - { priority: 11, category: business_referential, check: "quote: an EFFECTIVE RateFiling exists for program+state", error_id: ERR_NO_EFFECTIVE_FILING, http_status: 422, applies_to: "POST /mga/programs/{programId}/policies" }
  - { priority: 11, category: business_referential, check: "quote: class_code present in the EFFECTIVE filing's base_rates", error_id: ERR_CLASS_NOT_FILED, http_status: 422, applies_to: "POST /mga/programs/{programId}/policies" }
  - { priority: 11, category: business_referential, check: "claim create: TPA selector candidate set non-empty", error_id: ERR_NO_ELIGIBLE_TPA, http_status: 422, applies_to: "POST /mga/policies/{policyId}/claims" }
  - { priority: 11, category: business_referential, check: "claim start-review/resume-review: assigning appointment is ACTIVE", error_id: ERR_APPOINTMENT_NOT_ACTIVE, http_status: 422, applies_to: "POST /mga/claims/{claimId}/start-review, POST /mga/claims/{claimId}/resume-review" }
  - { priority: 11, category: business_referential, check: "bordereau submit: every row's policy_id/claim_id exists and belongs to this program", error_id: ERR_BORDEREAU_ROW_UNKNOWN_POLICY, http_status: 422, applies_to: "POST /mga/bordereaux/{bordereauId}/submit" }
  - { priority: 11, category: business_referential, check: "appointment create: tpa.status == ACTIVE", error_id: ERR_TPA_SUSPENDED, http_status: 422, applies_to: "POST /mga/programs/{programId}/tpa-appointments, POST /mga/tpa-appointments/{appointmentId}/activate" }
  - { priority: 12, category: business_fiscal, check: "bind/reinstate: tranche available >= amount to consume", error_id: ERR_TRANCHE_EXHAUSTED, http_status: 422, applies_to: "POST /mga/policies/{policyId}/bind, POST /mga/policies/{policyId}/reinstate" }
  - { priority: 12, category: business_fiscal, check: "bind/reinstate: program aggregate available >= amount to consume", error_id: ERR_CAPACITY_EXCEEDED, http_status: 422, applies_to: "POST /mga/policies/{policyId}/bind, POST /mga/policies/{policyId}/reinstate" }
  - { priority: 12, category: business_fiscal, check: "bind: a non-terminal allocation exists for the program", error_id: ERR_NO_ACTIVE_ALLOCATION, http_status: 422, applies_to: "POST /mga/policies/{policyId}/bind, POST /mga/policies/{policyId}/reinstate" }
  - { priority: 12, category: business_fiscal, check: "issue: collected_cents >= gross_premium_cents", error_id: ERR_PREMIUM_NOT_COLLECTED, http_status: 422, applies_to: "POST /mga/policies/{policyId}/issue" }
  - { priority: 12, category: business_fiscal, check: "remittance: basis_cents > 0", error_id: ERR_NOTHING_TO_REMIT, http_status: 422, applies_to: "POST /mga/programs/{programId}/remittances" }
  - { priority: 12, category: business_fiscal, check: "remittance: declared_amount_cents == computed remittance", error_id: ERR_REMITTANCE_MISMATCH, http_status: 422, applies_to: "POST /mga/programs/{programId}/remittances" }
  - { priority: 12, category: business_fiscal, check: "bordereau submit: row amounts match referenced entity fields", error_id: ERR_BORDEREAU_ROW_MISMATCH, http_status: 422, applies_to: "POST /mga/bordereaux/{bordereauId}/submit" }
  - { priority: 12, category: business_fiscal, check: "bordereau submit: declared_totals == computed_totals (per-row rounding pinned)", error_id: ERR_BORDEREAU_TOTAL_MISMATCH, http_status: 422, applies_to: "POST /mga/bordereaux/{bordereauId}/submit" }
  - { priority: 12, category: business_fiscal, check: "program terminate: trust_balance_cents == 0", error_id: ERR_TRUST_NOT_ZERO, http_status: 422, applies_to: "POST /mga/programs/{programId}/terminate" }
  - { priority: 12, category: business_fiscal, check: "program terminate: no policies in {QUOTED, BOUND, ISSUED, PENDING_CANCELLATION}", error_id: ERR_PROGRAM_HAS_ACTIVE_POLICIES, http_status: 422, applies_to: "POST /mga/programs/{programId}/terminate" }
  - { priority: 12, category: business_fiscal, check: "program terminate: no claims in {REPORTED, UNDER_REVIEW, REFERRED, APPROVED, REOPENED}", error_id: ERR_OPEN_CLAIMS_EXIST, http_status: 422, applies_to: "POST /mga/programs/{programId}/terminate" }
  - { priority: 12, category: business_fiscal, check: "program terminate: no bordereaux in {DRAFT, SUBMITTED, REJECTED}", error_id: ERR_UNACCEPTED_BORDEREAUX, http_status: 422, applies_to: "POST /mga/programs/{programId}/terminate" }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
# Read endpoints (GET) accept any authenticated role; the literal role list is
# [PlatformAdmin, MGAUnderwriter, MGAFinance, CarrierUnderwriter, CarrierAuditor, TPAAdjuster].
endpoints:
  # --- Carrier / TPA onboarding ---
  - { method: POST, path: "/mga/carriers", description: "Onboard a carrier", roles: [PlatformAdmin], code: 201, input: [name, naic_code, contact_email], output: Carrier, side_effects: ["status defaults ACTIVE"] }
  - { method: GET, path: "/mga/carriers/{carrierId}", description: "Get a carrier", roles: [PlatformAdmin, MGAUnderwriter, MGAFinance, CarrierUnderwriter, CarrierAuditor, TPAAdjuster], code: 200, input: [], output: Carrier, side_effects: [] }
  - { method: GET, path: "/mga/carriers", description: "List carriers", roles: [PlatformAdmin, MGAUnderwriter, MGAFinance, CarrierUnderwriter, CarrierAuditor, TPAAdjuster], code: 200, input: ["status?", "limit?", "offset?"], output: "Carrier[]", side_effects: [] }
  - { method: POST, path: "/mga/carriers/{carrierId}/suspend", description: "Toggle carrier ACTIVE <-> SUSPENDED (suspension blocks new program activations)", roles: [PlatformAdmin], code: 200, input: [], output: Carrier, side_effects: [] }
  - { method: POST, path: "/mga/tpas", description: "Onboard a TPA", roles: [PlatformAdmin], code: 201, input: [name, license_number, contact_email], output: TPA, side_effects: ["status defaults ACTIVE"] }
  - { method: GET, path: "/mga/tpas/{tpaId}", description: "Get a TPA", roles: [PlatformAdmin, MGAUnderwriter, MGAFinance, CarrierUnderwriter, CarrierAuditor, TPAAdjuster], code: 200, input: [], output: TPA, side_effects: [] }
  - { method: GET, path: "/mga/tpas", description: "List TPAs", roles: [PlatformAdmin, MGAUnderwriter, MGAFinance, CarrierUnderwriter, CarrierAuditor, TPAAdjuster], code: 200, input: ["status?", "limit?", "offset?"], output: "TPA[]", side_effects: [] }
  - { method: POST, path: "/mga/tpas/{tpaId}/suspend", description: "Toggle TPA ACTIVE <-> SUSPENDED (suspension blocks new appointments)", roles: [PlatformAdmin], code: 200, input: [], output: TPA, side_effects: [] }

  # --- Program lifecycle ---
  - { method: POST, path: "/mga/programs", description: "Propose a program under a carrier (created PROPOSED)", roles: [MGAUnderwriter], code: 201, input: [carrier_id, name, line_of_business, states_covered, inception_date, aggregate_limit_cents, commission_rate_pct, corrective_threshold_pct, termination_threshold_pct, min_trust_balance_cents, min_earned_premium_for_ratio_cents], output: Program, side_effects: [] }
  - { method: GET, path: "/mga/programs/{programId}", description: "Get a program (includes computed consumed_aggregate_cents, trust_balance_cents)", roles: [PlatformAdmin, MGAUnderwriter, MGAFinance, CarrierUnderwriter, CarrierAuditor, TPAAdjuster], code: 200, input: [], output: Program, side_effects: [] }
  - { method: GET, path: "/mga/programs", description: "List programs", roles: [PlatformAdmin, MGAUnderwriter, MGAFinance, CarrierUnderwriter, CarrierAuditor, TPAAdjuster], code: 200, input: ["carrier_id?", "status?", "limit?", "offset?"], output: "Program[]", side_effects: [] }
  - { method: POST, path: "/mga/programs/{programId}/activate", description: "Carrier activates program (PROPOSED -> ACTIVE)", roles: [CarrierUnderwriter], code: 200, input: [], output: Program, side_effects: ["program.version += 1"] }
  - { method: POST, path: "/mga/programs/{programId}/suspend", description: "Carrier suspends program; cascades to quotes/appointments/claims/bordereaux", roles: [CarrierUnderwriter], code: 200, input: [], output: Program, side_effects: ["QUOTED policies -> WITHDRAWN", "ACTIVE appointments -> SUSPENDED -> their UNDER_REVIEW claims -> REFERRED", "DRAFT bordereaux -> CANCELLED", "program.version += 1"] }
  - { method: POST, path: "/mga/programs/{programId}/resume", description: "Carrier resumes a suspended program", roles: [CarrierUnderwriter], code: 200, input: [], output: Program, side_effects: ["program.version += 1"] }
  - { method: POST, path: "/mga/programs/{programId}/enter-runoff", description: "Carrier places program into run-off (no new business)", roles: [CarrierUnderwriter], code: 200, input: [], output: Program, side_effects: ["program.version += 1"] }
  - { method: POST, path: "/mga/programs/{programId}/terminate", description: "Carrier terminates a run-off program after full wind-down", roles: [CarrierUnderwriter], code: 200, input: ["termination_reason"], output: Program, side_effects: ["guidelines -> INACTIVE", "non-terminal allocation -> RELEASED", "program.version += 1"] }
  - { method: POST, path: "/mga/programs/{programId}/decline", description: "Carrier declines a proposed program", roles: [CarrierUnderwriter], code: 200, input: ["termination_reason"], output: Program, side_effects: ["program.version += 1"] }

  # --- Underwriting guidelines (OCC supersede) ---
  - { method: POST, path: "/mga/programs/{programId}/guidelines", description: "Create/replace binding-authority guideline for a (state, class) scope; supersedes prior ACTIVE guideline of same scope", roles: [MGAUnderwriter], code: 201, input: [state_code, class_code, max_policy_premium_cents, max_policy_limit_cents, expected_program_version, "min_policy_premium_cents?"], output: UnderwritingGuideline, side_effects: ["prior ACTIVE guideline same scope -> SUPERSEDED", "increments Program.version by 1"] }
  - { method: GET, path: "/mga/programs/{programId}/guidelines", description: "List guidelines of a program", roles: [PlatformAdmin, MGAUnderwriter, MGAFinance, CarrierUnderwriter, CarrierAuditor, TPAAdjuster], code: 200, input: ["status?", "limit?", "offset?"], output: "UnderwritingGuideline[]", side_effects: [] }
  - { method: GET, path: "/mga/guidelines/{guidelineId}", description: "Get a guideline", roles: [PlatformAdmin, MGAUnderwriter, MGAFinance, CarrierUnderwriter, CarrierAuditor, TPAAdjuster], code: 200, input: [], output: UnderwritingGuideline, side_effects: [] }
  - { method: GET, path: "/mga/guidelines", description: "List guidelines across programs", roles: [PlatformAdmin, MGAUnderwriter, MGAFinance, CarrierUnderwriter, CarrierAuditor, TPAAdjuster], code: 200, input: ["program_id?", "status?", "limit?", "offset?"], output: "UnderwritingGuideline[]", side_effects: [] }

  # --- Capacity allocations (OCC supersede) ---
  - { method: POST, path: "/mga/programs/{programId}/capacity-allocations", description: "Carrier commits a capacity tranche; supersedes the current non-terminal tranche", roles: [CarrierUnderwriter], code: 201, input: [period_label, allocated_cents, expected_program_version], output: CapacityAllocation, side_effects: ["prior ACTIVE/EXHAUSTED allocation -> SUPERSEDED", "increments Program.version by 1"] }
  - { method: GET, path: "/mga/programs/{programId}/capacity-allocations", description: "List capacity allocations of a program", roles: [PlatformAdmin, MGAUnderwriter, MGAFinance, CarrierUnderwriter, CarrierAuditor, TPAAdjuster], code: 200, input: ["status?", "limit?", "offset?"], output: "CapacityAllocation[]", side_effects: [] }
  - { method: GET, path: "/mga/capacity-allocations/{allocationId}", description: "Get a capacity allocation", roles: [PlatformAdmin, MGAUnderwriter, MGAFinance, CarrierUnderwriter, CarrierAuditor, TPAAdjuster], code: 200, input: [], output: CapacityAllocation, side_effects: [] }
  - { method: GET, path: "/mga/capacity-allocations", description: "List capacity allocations across programs", roles: [PlatformAdmin, MGAUnderwriter, MGAFinance, CarrierUnderwriter, CarrierAuditor, TPAAdjuster], code: 200, input: ["program_id?", "status?", "limit?", "offset?"], output: "CapacityAllocation[]", side_effects: [] }
  - { method: POST, path: "/mga/capacity-allocations/{allocationId}/release", description: "Carrier releases unconsumed tranche capacity back", roles: [CarrierUnderwriter], code: 200, input: [], output: CapacityAllocation, side_effects: ["ACTIVE/EXHAUSTED -> RELEASED"] }

  # --- Rate filings ---
  - { method: POST, path: "/mga/programs/{programId}/rate-filings", description: "Draft a rate/rule filing (DRAFT)", roles: [MGAUnderwriter], code: 201, input: [state_code, filing_type, base_rates, policy_fee_cents, effective_from, effective_to], output: RateFiling, side_effects: ["version_seq assigned by created_at order within program+state"] }
  - { method: GET, path: "/mga/programs/{programId}/rate-filings", description: "List filings of a program", roles: [PlatformAdmin, MGAUnderwriter, MGAFinance, CarrierUnderwriter, CarrierAuditor, TPAAdjuster], code: 200, input: ["state_code?", "status?", "limit?", "offset?"], output: "RateFiling[]", side_effects: [] }
  - { method: GET, path: "/mga/rate-filings/{filingId}", description: "Get a filing", roles: [PlatformAdmin, MGAUnderwriter, MGAFinance, CarrierUnderwriter, CarrierAuditor, TPAAdjuster], code: 200, input: [], output: RateFiling, side_effects: [] }
  - { method: GET, path: "/mga/rate-filings", description: "List rate filings across programs", roles: [PlatformAdmin, MGAUnderwriter, MGAFinance, CarrierUnderwriter, CarrierAuditor, TPAAdjuster], code: 200, input: ["program_id?", "state_code?", "status?", "limit?", "offset?"], output: "RateFiling[]", side_effects: [] }
  - { method: POST, path: "/mga/rate-filings/{filingId}/submit", description: "Submit filing to carrier/regulator (DRAFT -> SUBMITTED)", roles: [MGAUnderwriter], code: 200, input: [], output: RateFiling, side_effects: ["submitted_at = clock"] }
  - { method: POST, path: "/mga/rate-filings/{filingId}/approve", description: "Carrier/DOI approval (SUBMITTED -> APPROVED); window overlap check", roles: [CarrierUnderwriter], code: 200, input: [], output: RateFiling, side_effects: ["approved_at = clock"] }
  - { method: POST, path: "/mga/rate-filings/{filingId}/disapprove", description: "Disapprove filing (SUBMITTED -> DISAPPROVED)", roles: [CarrierUnderwriter], code: 200, input: [], output: RateFiling, side_effects: [] }
  - { method: POST, path: "/mga/rate-filings/{filingId}/revise", description: "Return disapproved filing to DRAFT for rework", roles: [MGAUnderwriter], code: 200, input: [], output: RateFiling, side_effects: ["submitted_at/approved_at reset"] }
  - { method: POST, path: "/mga/rate-filings/{filingId}/mark-effective", description: "Activate filing (APPROVED -> EFFECTIVE); supersedes prior EFFECTIVE filing, withdrawing its QUOTED policies", roles: [CarrierUnderwriter], code: 200, input: [], output: RateFiling, side_effects: ["prior EFFECTIVE filing same program+state -> SUPERSEDED", "QUOTED policies rated under superseded filing -> WITHDRAWN"] }

  # --- Policies ---
  - { method: POST, path: "/mga/programs/{programId}/policies", description: "Quote a policy (QUOTED); computes provisional premium from the EFFECTIVE filing", roles: [MGAUnderwriter], code: 201, input: [insured_name, state_code, class_code, exposure_units, coverage_limit_cents, effective_from, effective_to, "experience_mod?"], output: Policy, side_effects: ["calculation policy_premium (provisional)", "quote_valid_until = clock + 30 days"] }
  - { method: GET, path: "/mga/programs/{programId}/policies", description: "List policies of a program", roles: [PlatformAdmin, MGAUnderwriter, MGAFinance, CarrierUnderwriter, CarrierAuditor, TPAAdjuster], code: 200, input: ["status?", "limit?", "offset?"], output: "Policy[]", side_effects: [] }
  - { method: GET, path: "/mga/policies/{policyId}", description: "Get a policy", roles: [PlatformAdmin, MGAUnderwriter, MGAFinance, CarrierUnderwriter, CarrierAuditor, TPAAdjuster], code: 200, input: [], output: Policy, side_effects: [] }
  - { method: GET, path: "/mga/policies", description: "List policies across programs", roles: [PlatformAdmin, MGAUnderwriter, MGAFinance, CarrierUnderwriter, CarrierAuditor, TPAAdjuster], code: 200, input: ["program_id?", "filing_id?", "status?", "limit?", "offset?"], output: "Policy[]", side_effects: [] }
  - { method: POST, path: "/mga/policies/{policyId}/bind", description: "Bind a quote (QUOTED -> BOUND); consumes tranche + aggregate capacity", roles: [MGAUnderwriter], code: 200, input: [], output: Policy, side_effects: ["capacity consumption (tranche + program aggregate)", "tranche may flip to EXHAUSTED"] }
  - { method: POST, path: "/mga/policies/{policyId}/issue", description: "Issue a bound policy once premium collected (BOUND -> ISSUED)", roles: [MGAUnderwriter], code: 200, input: [], output: Policy, side_effects: ["issued_at = clock"] }
  - { method: POST, path: "/mga/policies/{policyId}/cancel", description: "Request cancellation ({BOUND, ISSUED} -> PENDING_CANCELLATION)", roles: [MGAUnderwriter], code: 200, input: [cancellation_date, reason], output: Policy, side_effects: ["pre_cancel_status recorded"] }
  - { method: POST, path: "/mga/policies/{policyId}/reinstate", description: "Reinstate a cancelled policy within 30 days (CANCELLED -> pre_cancel_status); re-consumes capacity", roles: [MGAUnderwriter], code: 200, input: [], output: Policy, side_effects: ["capacity re-consumption of capacity_released_cents"] }
  - { method: POST, path: "/mga/policies/{policyId}/final-audit", description: "Final premium audit (audit_status NOT_AUDITED -> AUDITED); posts premium delta", roles: [MGAUnderwriter], code: 200, input: [actual_exposure_units, actual_experience_mod], output: Policy, side_effects: ["calculation policy_premium (final_audit)", "ledger adjustment entry", "capacity delta adjustment"] }

  # --- Premium trust accounting ---
  - { method: POST, path: "/mga/policies/{policyId}/collections", description: "Record a premium collection into the trust account", roles: [MGAFinance], code: 201, input: [amount_cents, "memo?"], output: TrustLedgerEntry, side_effects: ["COLLECTION entry +amount_cents", "policy.collected_cents += amount", "program.trust_balance_cents += amount"] }
  - { method: POST, path: "/mga/programs/{programId}/remittances", description: "Remit carrier share of unremitted collections (CARRIER_REMITTANCE debit)", roles: [MGAFinance], code: 201, input: [declared_amount_cents, "memo?"], output: TrustLedgerEntry, side_effects: ["calculation trust_remittance", "CARRIER_REMITTANCE entry with basis_cents recorded"] }
  - { method: GET, path: "/mga/programs/{programId}/trust-ledger", description: "List trust ledger entries of a program", roles: [PlatformAdmin, MGAUnderwriter, MGAFinance, CarrierUnderwriter, CarrierAuditor, TPAAdjuster], code: 200, input: ["entry_type?", "limit?", "offset?"], output: "TrustLedgerEntry[]", side_effects: [] }
  - { method: GET, path: "/mga/trust-ledger-entries/{entryId}", description: "Get a trust ledger entry", roles: [PlatformAdmin, MGAUnderwriter, MGAFinance, CarrierUnderwriter, CarrierAuditor, TPAAdjuster], code: 200, input: [], output: TrustLedgerEntry, side_effects: [] }
  - { method: GET, path: "/mga/trust-ledger-entries", description: "List trust ledger entries across programs", roles: [PlatformAdmin, MGAUnderwriter, MGAFinance, CarrierUnderwriter, CarrierAuditor, TPAAdjuster], code: 200, input: ["program_id?", "policy_id?", "claim_id?", "entry_type?", "limit?", "offset?"], output: "TrustLedgerEntry[]", side_effects: [] }

  # --- Claims ---
  - { method: POST, path: "/mga/policies/{policyId}/claims", description: "Report a claim; assigns TPA via appointment selector", roles: [MGAUnderwriter], code: 201, input: [claim_type, occurrence_date, amount_claimed_cents], output: Claim, side_effects: ["calculation tpa_assignment (selector)", "claim created REPORTED with assigned_tpa_id"] }
  - { method: GET, path: "/mga/policies/{policyId}/claims", description: "List claims of a policy", roles: [PlatformAdmin, MGAUnderwriter, MGAFinance, CarrierUnderwriter, CarrierAuditor, TPAAdjuster], code: 200, input: ["status?", "limit?", "offset?"], output: "Claim[]", side_effects: [] }
  - { method: GET, path: "/mga/claims/{claimId}", description: "Get a claim", roles: [PlatformAdmin, MGAUnderwriter, MGAFinance, CarrierUnderwriter, CarrierAuditor, TPAAdjuster], code: 200, input: [], output: Claim, side_effects: [] }
  - { method: GET, path: "/mga/claims", description: "List claims across programs", roles: [PlatformAdmin, MGAUnderwriter, MGAFinance, CarrierUnderwriter, CarrierAuditor, TPAAdjuster], code: 200, input: ["program_id?", "assigned_tpa_id?", "policy_id?", "status?", "limit?", "offset?"], output: "Claim[]", side_effects: [] }
  - { method: POST, path: "/mga/claims/{claimId}/start-review", description: "TPA starts review (REPORTED -> UNDER_REVIEW)", roles: [TPAAdjuster], code: 200, input: [], output: Claim, side_effects: [] }
  - { method: POST, path: "/mga/claims/{claimId}/set-reserve", description: "Set case reserve (UNDER_REVIEW self-transition)", roles: [TPAAdjuster], code: 200, input: [case_reserve_cents], output: Claim, side_effects: ["case_reserve_cents updated"] }
  - { method: POST, path: "/mga/claims/{claimId}/refer", description: "TPA refers claim to carrier (UNDER_REVIEW -> REFERRED)", roles: [TPAAdjuster], code: 200, input: [], output: Claim, side_effects: ["referral_reason = ADJUSTER_ESCALATION"] }
  - { method: POST, path: "/mga/claims/{claimId}/approve", description: "Approve claim (UNDER_REVIEW/REFERRED -> APPROVED); TPA bounded by authority limit, carrier unbounded", roles: [TPAAdjuster, CarrierUnderwriter], code: 200, input: [approved_amount_cents], output: Claim, side_effects: ["approved_amount_cents set"] }
  - { method: POST, path: "/mga/claims/{claimId}/deny", description: "Deny claim (UNDER_REVIEW/REFERRED -> DENIED)", roles: [TPAAdjuster, CarrierUnderwriter], code: 200, input: [denial_reason], output: Claim, side_effects: ["denied_at = clock"] }
  - { method: POST, path: "/mga/claims/{claimId}/pay", description: "Pay approved claim from trust (APPROVED -> PAID)", roles: [TPAAdjuster], code: 200, input: [], output: Claim, side_effects: ["CLAIM_PAYMENT ledger entry -approved_amount_cents", "paid_at = clock", "case_reserve_cents = 0"] }
  - { method: POST, path: "/mga/claims/{claimId}/reopen", description: "Reopen a denied claim (DENIED -> REOPENED; max 2, within 90 days)", roles: [MGAUnderwriter], code: 200, input: [], output: Claim, side_effects: ["reopened_count += 1"] }
  - { method: POST, path: "/mga/claims/{claimId}/resume-review", description: "Resume review of reopened claim (REOPENED -> UNDER_REVIEW)", roles: [TPAAdjuster], code: 200, input: [], output: Claim, side_effects: [] }
  - { method: POST, path: "/mga/claims/{claimId}/close", description: "Carrier closes a settled claim ({PAID, DENIED} -> CLOSED)", roles: [CarrierUnderwriter], code: 200, input: [], output: Claim, side_effects: [] }

  # --- TPA appointments ---
  - { method: POST, path: "/mga/programs/{programId}/tpa-appointments", description: "Appoint a TPA for a claim type (PENDING)", roles: [CarrierUnderwriter], code: 201, input: [tpa_id, claim_type, authority_limit_cents, effective_from, effective_to], output: TPAAppointment, side_effects: [] }
  - { method: GET, path: "/mga/programs/{programId}/tpa-appointments", description: "List appointments of a program", roles: [PlatformAdmin, MGAUnderwriter, MGAFinance, CarrierUnderwriter, CarrierAuditor, TPAAdjuster], code: 200, input: ["tpa_id?", "status?", "limit?", "offset?"], output: "TPAAppointment[]", side_effects: [] }
  - { method: GET, path: "/mga/tpa-appointments/{appointmentId}", description: "Get an appointment", roles: [PlatformAdmin, MGAUnderwriter, MGAFinance, CarrierUnderwriter, CarrierAuditor, TPAAdjuster], code: 200, input: [], output: TPAAppointment, side_effects: [] }
  - { method: GET, path: "/mga/tpa-appointments", description: "List appointments across programs", roles: [PlatformAdmin, MGAUnderwriter, MGAFinance, CarrierUnderwriter, CarrierAuditor, TPAAdjuster], code: 200, input: ["tpa_id?", "program_id?", "status?", "limit?", "offset?"], output: "TPAAppointment[]", side_effects: [] }
  - { method: POST, path: "/mga/tpa-appointments/{appointmentId}/activate", description: "Activate appointment (PENDING -> ACTIVE); 30-day gap check", roles: [CarrierUnderwriter], code: 200, input: [], output: TPAAppointment, side_effects: [] }
  - { method: POST, path: "/mga/tpa-appointments/{appointmentId}/suspend", description: "Suspend appointment; refers its UNDER_REVIEW claims", roles: [CarrierUnderwriter], code: 200, input: [], output: TPAAppointment, side_effects: ["UNDER_REVIEW claims of this TPA -> REFERRED (APPOINTMENT_SUSPENDED)"] }
  - { method: POST, path: "/mga/tpa-appointments/{appointmentId}/reinstate", description: "Reinstate suspended appointment (SUSPENDED -> ACTIVE)", roles: [CarrierUnderwriter], code: 200, input: [], output: TPAAppointment, side_effects: [] }
  - { method: POST, path: "/mga/tpa-appointments/{appointmentId}/revoke", description: "Revoke appointment ({ACTIVE, SUSPENDED} -> REVOKED)", roles: [CarrierUnderwriter], code: 200, input: [], output: TPAAppointment, side_effects: ["UNDER_REVIEW claims of this TPA -> REFERRED (APPOINTMENT_SUSPENDED)"] }

  # --- Bordereaux ---
  - { method: POST, path: "/mga/programs/{programId}/bordereaux", description: "Draft a bordereau (DRAFT); rows may be empty at draft", roles: [MGAFinance], code: 201, input: [bordereau_type, period_label, due_date, "rows?", "declared_totals?"], output: Bordereau, side_effects: ["calculation bordereau_totals fills computed_totals"] }
  - { method: GET, path: "/mga/programs/{programId}/bordereaux", description: "List bordereaux of a program", roles: [PlatformAdmin, MGAUnderwriter, MGAFinance, CarrierUnderwriter, CarrierAuditor, TPAAdjuster], code: 200, input: ["bordereau_type?", "status?", "limit?", "offset?"], output: "Bordereau[]", side_effects: [] }
  - { method: GET, path: "/mga/bordereaux/{bordereauId}", description: "Get a bordereau", roles: [PlatformAdmin, MGAUnderwriter, MGAFinance, CarrierUnderwriter, CarrierAuditor, TPAAdjuster], code: 200, input: [], output: Bordereau, side_effects: [] }
  - { method: GET, path: "/mga/bordereaux", description: "List bordereaux across programs", roles: [PlatformAdmin, MGAUnderwriter, MGAFinance, CarrierUnderwriter, CarrierAuditor, TPAAdjuster], code: 200, input: ["program_id?", "bordereau_type?", "status?", "limit?", "offset?"], output: "Bordereau[]", side_effects: [] }
  - { method: POST, path: "/mga/bordereaux/{bordereauId}/submit", description: "Submit bordereau to carrier (DRAFT -> SUBMITTED); full data-quality validation", roles: [MGAFinance], code: 200, input: [], output: Bordereau, side_effects: ["submitted_at = clock"] }
  - { method: POST, path: "/mga/bordereaux/{bordereauId}/accept", description: "Carrier accepts bordereau (SUBMITTED -> ACCEPTED)", roles: [CarrierUnderwriter], code: 200, input: [], output: Bordereau, side_effects: ["marks policies/claims as reported to carrier"] }
  - { method: POST, path: "/mga/bordereaux/{bordereauId}/reject", description: "Carrier rejects bordereau (SUBMITTED -> REJECTED)", roles: [CarrierUnderwriter], code: 200, input: [rejection_reason], output: Bordereau, side_effects: [] }
  - { method: POST, path: "/mga/bordereaux/{bordereauId}/revise", description: "Return rejected bordereau to DRAFT", roles: [MGAFinance], code: 200, input: [], output: Bordereau, side_effects: [] }
  - { method: POST, path: "/mga/bordereaux/{bordereauId}/cancel", description: "Cancel a draft bordereau (DRAFT -> CANCELLED)", roles: [MGAFinance], code: 200, input: [], output: Bordereau, side_effects: [] }

  # --- Carrier audits ---
  - { method: POST, path: "/mga/programs/{programId}/audits", description: "Schedule a carrier audit (SCHEDULED); 30-day gap check", roles: [CarrierAuditor], code: 201, input: [scope, scheduled_start, scheduled_end], output: CarrierAudit, side_effects: [] }
  - { method: GET, path: "/mga/programs/{programId}/audits", description: "List audits of a program", roles: [PlatformAdmin, MGAUnderwriter, MGAFinance, CarrierUnderwriter, CarrierAuditor, TPAAdjuster], code: 200, input: ["status?", "limit?", "offset?"], output: "CarrierAudit[]", side_effects: [] }
  - { method: GET, path: "/mga/audits/{auditId}", description: "Get an audit", roles: [PlatformAdmin, MGAUnderwriter, MGAFinance, CarrierUnderwriter, CarrierAuditor, TPAAdjuster], code: 200, input: [], output: CarrierAudit, side_effects: [] }
  - { method: GET, path: "/mga/audits", description: "List audits across programs", roles: [PlatformAdmin, MGAUnderwriter, MGAFinance, CarrierUnderwriter, CarrierAuditor, TPAAdjuster], code: 200, input: ["program_id?", "status?", "limit?", "offset?"], output: "CarrierAudit[]", side_effects: [] }
  - { method: POST, path: "/mga/audits/{auditId}/start", description: "Start audit (SCHEDULED -> IN_PROGRESS)", roles: [CarrierAuditor], code: 200, input: [], output: CarrierAudit, side_effects: [] }
  - { method: POST, path: "/mga/audits/{auditId}/issue-findings", description: "Issue findings (IN_PROGRESS -> FINDINGS_ISSUED)", roles: [CarrierAuditor], code: 200, input: [findings], output: CarrierAudit, side_effects: [] }
  - { method: POST, path: "/mga/audits/{auditId}/submit-remediation", description: "MGA submits remediation (FINDINGS_ISSUED -> REMEDIATION); marks resolved findings", roles: [MGAUnderwriter], code: 200, input: ["resolved_finding_ids"], output: CarrierAudit, side_effects: ["listed findings marked resolved"] }
  - { method: POST, path: "/mga/audits/{auditId}/close", description: "Close audit ({FINDINGS_ISSUED, REMEDIATION} -> CLOSED) if no unresolved MAJOR/CRITICAL findings", roles: [CarrierAuditor], code: 200, input: [outcome], output: CarrierAudit, side_effects: [] }
  - { method: POST, path: "/mga/audits/{auditId}/escalate", description: "Escalate audit with unresolved CRITICAL finding; suspends program with full cascade", roles: [CarrierAuditor], code: 200, input: [], output: CarrierAudit, side_effects: ["program -> SUSPENDED (if ACTIVE) with cascade: QUOTED policies WITHDRAWN, appointments SUSPENDED -> claims REFERRED, DRAFT bordereaux CANCELLED", "outcome = TERMINATION_RECOMMENDED"] }

  # --- Loss evaluations ---
  - { method: POST, path: "/mga/programs/{programId}/loss-evaluations", description: "Run a loss-ratio evaluation snapshot; TERMINATION_REVIEW auto-suspends the program", roles: [CarrierUnderwriter], code: 201, input: [period_label], output: LossEvaluation, side_effects: ["calculation loss_ratio", "if outcome == TERMINATION_REVIEW: program -> SUSPENDED with full cascade", "program.latest_incurred_loss_ratio_pct updated"] }
  - { method: GET, path: "/mga/programs/{programId}/loss-evaluations", description: "List loss evaluations of a program", roles: [PlatformAdmin, MGAUnderwriter, MGAFinance, CarrierUnderwriter, CarrierAuditor, TPAAdjuster], code: 200, input: ["limit?", "offset?"], output: "LossEvaluation[]", side_effects: [] }
  - { method: GET, path: "/mga/loss-evaluations/{evaluationId}", description: "Get a loss evaluation", roles: [PlatformAdmin, MGAUnderwriter, MGAFinance, CarrierUnderwriter, CarrierAuditor, TPAAdjuster], code: 200, input: [], output: LossEvaluation, side_effects: [] }
  - { method: GET, path: "/mga/loss-evaluations", description: "List loss evaluations across programs", roles: [PlatformAdmin, MGAUnderwriter, MGAFinance, CarrierUnderwriter, CarrierAuditor, TPAAdjuster], code: 200, input: ["program_id?", "limit?", "offset?"], output: "LossEvaluation[]", side_effects: [] }

  # --- Test-driving / ops endpoints ---
  - { method: POST, path: "/mga/_clock/set_current_utc", description: "Set the logical clock. Startup default is 2026-08-01T00:00:00Z; the server never falls back to wall-clock time.", roles: [PlatformAdmin], code: 200, input: [to_iso8601], output: { current_utc: datetime }, side_effects: ["logical clock updated"] }
  - { method: POST, path: "/mga/_ops/run-daily", description: "Ops-run checkpoint: processes due cancellations (PENDING_CANCELLATION -> CANCELLED with earned/refund/capacity release), policy expiries (BOUND/ISSUED -> EXPIRED), quote lapses (QUOTED -> WITHDRAWN), appointment expiries (ACTIVE -> EXPIRED), and bordereau overdue flags", roles: [PlatformAdmin], code: 200, input: [], output: { cancelled_policy_ids: array, expired_policy_ids: array, withdrawn_quote_ids: array, expired_appointment_ids: array, flagged_bordereau_ids: array }, side_effects: ["calculation earned_premium for each due cancellation", "REFUND ledger entries", "capacity releases"] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID header" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not allowed for endpoint, or entity-backed ownership mismatch (wrong carrier / non-assigned TPA)" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or body FK references a non-existent resource" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body: missing required field, bad type, invalid enum, effective_from >= effective_to, non-positive amount" }
  - { id: ERR_NAIC_CODE_EXISTS, http: 409, condition: "Carrier naic_code already registered" }
  - { id: ERR_LICENSE_NUMBER_EXISTS, http: 409, condition: "TPA license_number already registered" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_program_version != current program.version on guideline/capacity-allocation create" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Entity not in a valid from-state for the requested transition; terminal-state lockdown" }
  - { id: ERR_PROGRAM_NOT_ACTIVE, http: 409, condition: "Operation requires program.status == ACTIVE (quote, bind, reinstate, appointment reinstate)" }
  - { id: ERR_PROGRAM_TERMINAL, http: 409, condition: "Program TERMINATED or DECLINED; no child creation allowed" }
  - { id: ERR_AUTHORITY_LIMIT_EXCEEDED, http: 422, condition: "TPA approved_amount_cents > appointment.authority_limit_cents" }
  - { id: ERR_TRUST_INSUFFICIENT_FUNDS, http: 422, condition: "Claim payment exceeds program trust balance" }
  - { id: ERR_TRUST_FLOOR_BREACH, http: 422, condition: "Remittance would push trust balance below min_trust_balance_cents" }
  - { id: ERR_OUTSIDE_COVERAGE_PERIOD, http: 422, condition: "occurrence_date outside policy term [effective_from, effective_to)" }
  - { id: ERR_REPORTING_DEADLINE_MISSED, http: 422, condition: "clock - occurrence_date > 60 days at claim report" }
  - { id: ERR_POLICY_WINDOW_OUTSIDE_FILING, http: 422, condition: "Policy window not inside the EFFECTIVE filing's half-open window, or effective_from in the past" }
  - { id: ERR_QUOTE_EXPIRED, http: 422, condition: "Bind attempted after quote_valid_until" }
  - { id: ERR_FILING_WINDOW_OVERLAP, http: 422, condition: "Filing window overlaps another APPROVED/EFFECTIVE filing of same program+state (half-open; adjacency allowed)" }
  - { id: ERR_FILING_NOT_YET_EFFECTIVE, http: 422, condition: "mark-effective before effective_from" }
  - { id: ERR_APPOINTMENT_WINDOW_CLOSED, http: 422, condition: "Appointment activate/reinstate after effective_to" }
  - { id: ERR_APPOINTMENT_WINDOW_GAP, http: 422, condition: "Appointment window within 30 days of another ACTIVE/SUSPENDED appointment for same program+claim_type (closed-interval gap semantics)" }
  - { id: ERR_AUDIT_WINDOW_GAP, http: 422, condition: "Audit window within 30 days of another non-terminal audit of the same program" }
  - { id: ERR_AUDIT_WINDOW_NOT_OPEN, http: 422, condition: "Audit start before scheduled_start" }
  - { id: ERR_REOPEN_WINDOW_CLOSED, http: 422, condition: "Claim reopen more than 90 days after denied_at" }
  - { id: ERR_REINSTATE_WINDOW_CLOSED, http: 422, condition: "Policy reinstate more than 30 days after cancelled_at" }
  - { id: ERR_STATE_NOT_COVERED, http: 422, condition: "Policy state_code not in program.states_covered" }
  - { id: ERR_CLASS_NOT_ELIGIBLE, http: 422, condition: "No ACTIVE guideline for (state_code, class_code)" }
  - { id: ERR_GUIDELINE_PREMIUM_LIMIT, http: 422, condition: "gross_premium_cents > guideline.max_policy_premium_cents at quote or bind" }
  - { id: ERR_GUIDELINE_LIMIT_EXCEEDED, http: 422, condition: "coverage_limit_cents > guideline.max_policy_limit_cents" }
  - { id: ERR_APPROVED_EXCEEDS_CLAIMED, http: 422, condition: "approved_amount_cents > amount_claimed_cents" }
  - { id: ERR_REOPEN_LIMIT_EXCEEDED, http: 422, condition: "reopened_count already at MAX_REOPENS (2)" }
  - { id: ERR_EMPTY_BORDEREAU, http: 422, condition: "Bordereau submit with zero rows" }
  - { id: ERR_BORDEREAU_PERIOD_COVERED, http: 422, condition: "An ACCEPTED bordereau already exists for same program+type+period" }
  - { id: ERR_BORDEREAU_DUPLICATE_ROW, http: 422, condition: "Duplicate policy_id/claim_id within bordereau rows" }
  - { id: ERR_NO_CRITICAL_FINDING, http: 422, condition: "Audit escalate without an unresolved CRITICAL finding" }
  - { id: ERR_NO_EFFECTIVE_FILING, http: 422, condition: "No EFFECTIVE rate filing for program+state at quote" }
  - { id: ERR_CLASS_NOT_FILED, http: 422, condition: "class_code missing from the EFFECTIVE filing's base_rates" }
  - { id: ERR_NO_ELIGIBLE_TPA, http: 422, condition: "TPA selector candidate set empty at claim report" }
  - { id: ERR_APPOINTMENT_NOT_ACTIVE, http: 422, condition: "Claim review requires the assigning appointment to be ACTIVE" }
  - { id: ERR_BORDEREAU_ROW_UNKNOWN_POLICY, http: 422, condition: "Bordereau row references unknown/foreign policy or claim" }
  - { id: ERR_TPA_SUSPENDED, http: 422, condition: "Appointment create/activate with a SUSPENDED TPA" }
  - { id: ERR_TRANCHE_EXHAUSTED, http: 422, condition: "Tranche available (allocated - consumed) < amount to consume" }
  - { id: ERR_CAPACITY_EXCEEDED, http: 422, condition: "Program aggregate available < amount to consume" }
  - { id: ERR_NO_ACTIVE_ALLOCATION, http: 422, condition: "No non-terminal capacity allocation exists for the program at bind/reinstate" }
  - { id: ERR_PREMIUM_NOT_COLLECTED, http: 422, condition: "Issue requires collected_cents >= gross_premium_cents" }
  - { id: ERR_NOTHING_TO_REMIT, http: 422, condition: "Remittance with zero unremitted-collections basis" }
  - { id: ERR_REMITTANCE_MISMATCH, http: 422, condition: "declared_amount_cents != computed remittance" }
  - { id: ERR_BORDEREAU_ROW_MISMATCH, http: 422, condition: "Bordereau row amounts differ from referenced policy/claim fields" }
  - { id: ERR_BORDEREAU_TOTAL_MISMATCH, http: 422, condition: "declared_totals != computed_totals (per-row rounding pinned)" }
  - { id: ERR_TRUST_NOT_ZERO, http: 422, condition: "Program terminate with non-zero trust balance" }
  - { id: ERR_PROGRAM_HAS_ACTIVE_POLICIES, http: 422, condition: "Program terminate while policies in {QUOTED, BOUND, ISSUED, PENDING_CANCELLATION}" }
  - { id: ERR_OPEN_CLAIMS_EXIST, http: 422, condition: "Program terminate while claims in {REPORTED, UNDER_REVIEW, REFERRED, APPROVED, REOPENED}" }
  - { id: ERR_UNACCEPTED_BORDEREAUX, http: 422, condition: "Program terminate while bordereaux in {DRAFT, SUBMITTED, REJECTED}" }
  - { id: ERR_UNRESOLVED_CRITICAL_FINDINGS, http: 422, condition: "Audit close with unresolved MAJOR/CRITICAL findings" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Infrastructure operator: onboards carriers/TPAs, drives the logical clock and the daily ops checkpoint"
    identity: opaque
    exclusive_operations: ["POST /mga/carriers", "POST /mga/tpas", "POST /mga/_clock/set_current_utc", "POST /mga/_ops/run-daily"]
    shared_operations: ["all GET endpoints"]
  - name: MGAUnderwriter
    description: "MGA underwriting staff: proposes programs, drafts filings/guidelines, quotes/binds/issues/cancels/reinstates policies, reports and reopens claims, submits audit remediation"
    identity: opaque
    exclusive_operations: ["POST /mga/programs", "POST /mga/programs/{id}/guidelines", "POST /mga/programs/{id}/rate-filings", "POST /mga/rate-filings/{id}/submit", "POST /mga/rate-filings/{id}/revise", "POST /mga/programs/{id}/policies", "POST /mga/policies/{id}/bind", "POST /mga/policies/{id}/issue", "POST /mga/policies/{id}/cancel", "POST /mga/policies/{id}/reinstate", "POST /mga/policies/{id}/final-audit", "POST /mga/policies/{id}/claims", "POST /mga/claims/{id}/reopen", "POST /mga/audits/{id}/submit-remediation"]
    shared_operations: ["all GET endpoints"]
  - name: MGAFinance
    description: "MGA fiduciary accounting: premium collections, carrier remittances, bordereaux drafting/submission (segregated from underwriting)"
    identity: opaque
    exclusive_operations: ["POST /mga/policies/{id}/collections", "POST /mga/programs/{id}/remittances", "POST /mga/programs/{id}/bordereaux", "POST /mga/bordereaux/{id}/submit", "POST /mga/bordereaux/{id}/revise", "POST /mga/bordereaux/{id}/cancel"]
    shared_operations: ["all GET endpoints"]
  - name: CarrierUnderwriter
    description: "Carrier program underwriter: activates/suspends/terminates programs, commits capacity, approves filings, decides referred claims, accepts bordereaux, manages TPA appointments"
    identity: "entity_backed:Carrier"
    exclusive_operations: ["POST /mga/programs/{id}/activate", "POST /mga/programs/{id}/suspend", "POST /mga/programs/{id}/resume", "POST /mga/programs/{id}/enter-runoff", "POST /mga/programs/{id}/terminate", "POST /mga/programs/{id}/decline", "POST /mga/programs/{id}/capacity-allocations", "POST /mga/capacity-allocations/{id}/release", "POST /mga/rate-filings/{id}/approve", "POST /mga/rate-filings/{id}/disapprove", "POST /mga/rate-filings/{id}/mark-effective", "POST /mga/claims/{id}/close", "POST /mga/programs/{id}/tpa-appointments", "POST /mga/tpa-appointments/{id}/activate", "POST /mga/tpa-appointments/{id}/suspend", "POST /mga/tpa-appointments/{id}/reinstate", "POST /mga/tpa-appointments/{id}/revoke", "POST /mga/bordereaux/{id}/accept", "POST /mga/bordereaux/{id}/reject", "POST /mga/programs/{id}/loss-evaluations"]
    shared_operations: ["POST /mga/claims/{id}/approve (carrier decides referrals; no authority cap)", "POST /mga/claims/{id}/deny", "all GET endpoints"]
  - name: CarrierAuditor
    description: "Carrier audit function, organizationally segregated from underwriting: schedules and conducts audits, issues findings, closes or escalates"
    identity: opaque
    exclusive_operations: ["POST /mga/programs/{id}/audits", "POST /mga/audits/{id}/start", "POST /mga/audits/{id}/issue-findings", "POST /mga/audits/{id}/close", "POST /mga/audits/{id}/escalate"]
    shared_operations: ["all GET endpoints"]
  - name: TPAAdjuster
    description: "Appointed third-party administrator: reviews/reserves/refers/approves/denies/pays claims within its authority limit"
    identity: "entity_backed:TPA"
    exclusive_operations: ["POST /mga/claims/{id}/start-review", "POST /mga/claims/{id}/set-reserve", "POST /mga/claims/{id}/refer", "POST /mga/claims/{id}/pay", "POST /mga/claims/{id}/resume-review"]
    shared_operations: ["POST /mga/claims/{id}/approve (bounded by appointment authority limit)", "POST /mga/claims/{id}/deny", "all GET endpoints"]
