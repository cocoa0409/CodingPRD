              as_user_id: "${plant_id}"
            - call: "POST /production-runs/${run_a}/package"
              payload: { bags_produced: 120 }
              as: PlantOperator
              as_user_id: "${plant_id}"
            - call: "POST /production-runs"
              payload: { plant_id: "${plant_id}", product_line_id: "${pl_c}", line_index: 1, scheduled_start: "2026-08-03T14:00:00Z", scheduled_end: "2026-08-03T22:00:00Z", target_pull_kg: 9200, zone_setpoints_f: [470, 470, 470, 470] }
              as: PlantOperator
              as_user_id: "${plant_id}"
              captures: { run_c: "$.data.id" }
            - call: "POST /changeover-events"
              payload: { plant_id: "${plant_id}", outgoing_run_id: "${run_a}", incoming_run_id: "${run_c}", line_index: 1, window_start: "2026-08-03T13:30:00Z", window_end: "2026-08-03T14:30:00Z" }
              as: PlantOperator
              as_user_id: "${plant_id}"
              captures: { chg: "$.data.id" }
          trigger:
            - call: "POST /changeover-events/${chg}/close"
              payload: { weighed_trim_kg: 300.0, recovered_cullet_kg: 200.0 }
              as: PlantOperator
              as_user_id: "${plant_id}"
              captures: { err_early: "$.data.error_id" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T15:00:00Z" }
              as: CorporateOps
            - call: "POST /changeover-events/${chg}/close"
              payload: { weighed_trim_kg: 300.0, recovered_cullet_kg: 500.0 }
              as: PlantOperator
              as_user_id: "${plant_id}"
              captures: { err_trim: "$.data.error_id" }
            - call: "POST /changeover-events/${chg}/close"
              payload: { weighed_trim_kg: 300.0, recovered_cullet_kg: 200.0 }
              as: PlantOperator
              as_user_id: "${plant_id}"
            - call: "POST /changeover-events/${chg}/close"
              payload: { weighed_trim_kg: 300.0, recovered_cullet_kg: 200.0 }
              as: PlantOperator
              as_user_id: "${plant_id}"
              captures: { err_reclose: "$.data.error_id" }
          assert:
            - "at creation the PROVISIONAL variant ran: ChangeoverEvent.${chg}.density_delta_pct == 0.00 (0.80 -> 0.80), purge_minutes == 20.00 (12 base + min(20, 0.00) density + 8 width + 0 facing) and provisional_scrap_kg == 690.00 (20.00 * 34.5)"
            - "ProductionRun.${run_a}.changeover_scrap_kg == 690.00 immediately after the event was opened"
            - "${err_early} == \"ERR_INVALID_STATE\" with HTTP 409: the OPEN -> CLOSED edge requires the logical clock to have reached window_end (14:30) and it is 06:00, and no more specific rule in §1.4 claims that precondition"
            - "${err_trim} == \"ERR_TRIM_MASS_INCONSISTENT\" with HTTP 422: 500.0 kg recovered cannot exceed the 300.0 kg weighed on the scale — the bound is another field, so this is not a declared-range violation and never degrades to ERR_INVALID_REQUEST"
            - "after both refusals ChangeoverEvent.${chg}.status is STILL OPEN with weighed_trim_kg == null and recovered_cullet_kg == null, and ProductionRun.${run_a}.changeover_scrap_kg is STILL the provisional 690.00"
            - "the accepted close returns HTTP 200: status == CLOSED, weighed_trim_kg == 300.00, recovered_cullet_kg == 200.00, reconciled_scrap_kg == 100.00 (300.00 - 200.00) and scrap_variance_kg == -390.00 (300.00 - 690.00, negative because the time-based estimate over-predicted the purge)"
            - "ProductionRun.${run_a}.changeover_scrap_kg is now 100.00 — the reconciled figure OVERWRITES the provisional one on the same field"
            - "exactly one CulletBatch now exists with source_type == CHANGEOVER_SCRAP, status == STAGED, source_run_id == ${run_a} and mass_kg == 200.00; Plant.${plant_id}.cullet_received_kg_ytd == 200.00 and cullet_on_hand_kg == 200.00"
            - "${err_reclose} == \"ERR_INVALID_STATE\" with HTTP 409: CLOSED is terminal, and the second close neither re-mints a CulletBatch nor changes reconciled_scrap_kg — GET /cullet-batches still returns total_count == 1"

      - name: an_emissions_period_that_has_not_closed_yet_is_rejected
        claim_type: violation_to_error
        grounds:
          - errors[ERR_EMISSIONS_PERIOD_INVALID]
          - errors[ERR_INVALID_REQUEST]
          - validations[priority=90]
          - validations[priority=20]
          - calculations.permit_period_emissions
        distinguishing_aspect: "A permit period is only reportable once it has closed. The future-period leg is priority 90's own (422), while the degenerate period_end == period_start is a plain interval violation that priority 20 has already reported as a 400 — so the two malformed periods produce DIFFERENT codes, and the boundary period_end == the logical clock is accepted because the comparison is <=."
        test_recipe:
          setup:
            - "Plant NWK with allowances formaldehyde 0.200 kg and VOC 12.0 kg, emissions_status COMPLIANT, melt_posture OPEN."
            - "No production run has ever cured at this plant, so any accepted period rolls up to zero."
            - "Logical clock pinned at 2026-08-03T06:00:00Z."
          setup_api_calls:
            - call: "POST /certification-programs"
              payload: { code: "RCERT-PS", conformance_basis: "PER_SPECIMEN", r_value_tolerance: 0.30, min_specimen_count: 3, max_concurrent_lab_tests: 2, retest_limit: 2, derate_allowed: true }
              as: CorporateOps
              captures: { prog_ps: "$.data.id" }
            - call: "POST /plants"
              payload: { name: "Newark Forming Line", site_code: "NWK", oven_zone_count: 4, oven_length_ft: 120, production_line_count: 2, permit_number: "NJ-AIR-114", formaldehyde_allowance_kg: 0.200, voc_allowance_kg: 12.0, max_cullet_fraction: 0.30, cullet_restrict_fraction: 0.28, max_width_change_in: 8.0 }
              as: CorporateOps
              captures: { plant_id: "$.data.id" }
            - call: "POST /binder-formulations"
              payload: { code: "BF-FREE-1", formaldehyde_free: true, formaldehyde_ppm: 0, voc_g_per_kg: 3.2, min_cure_temp_f: 420, min_dwell_s: 150, loi_target_pct: 4.5 }
              as: QualityEngineer
              as_user_id: "qe-1"
              captures: { binder_free: "$.data.id" }
            - call: "POST /binder-formulations/${binder_free}/submit"
              payload: {}
              as: QualityEngineer
              as_user_id: "qe-1"
            - call: "POST /binder-formulations/${binder_free}/emissions-test"
              payload: { formaldehyde_ppm: 0, voc_g_per_kg: 3.2, lab_reference: "LAB-9001" }
              as: CertificationOfficer
              as_user_id: "co-1"
            - call: "POST /binder-formulations/${binder_free}/certification-decision"
              payload: { decision: "CERTIFY", emissions_cert_id: "EC-4411" }
              as: CertificationOfficer
              as_user_id: "co-1"
            - call: "POST /product-lines"
              payload: { sku: "R13-15-UF", plant_id: "${plant_id}", binder_formulation_id: "${binder_free}", certification_program_id: "${prog_ps}", form: "BATT", density_pcf: 0.80, facing_type: "UNFACED", width_in: 15, thickness_in: 3.5, declared_r_value: 13.0, bag_sqft: 88.0, bale_volume_ft3: 21.0, bale_mass_kg: 12.5, mass_rate_kg_per_min: 34.5, compression_ratio: 6.0 }
              as: CorporateOps
              captures: { pl_a: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T06:00:00Z" }
              as: CorporateOps
          trigger:
            - call: "POST /plants/${plant_id}/emissions-report"
              payload: { period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z" }
              as: EnvironmentalCompliance
              as_user_id: "ec-1"
              captures: { err_future: "$.data.error_id" }
            - call: "POST /plants/${plant_id}/emissions-report"
              payload: { period_start: "2026-08-01T00:00:00Z", period_end: "2026-08-01T00:00:00Z" }
              as: EnvironmentalCompliance
              as_user_id: "ec-1"
              captures: { err_degenerate: "$.data.error_id" }
            - call: "POST /plants/${plant_id}/emissions-report"
              payload: { period_start: "2026-08-01T00:00:00Z", period_end: "2026-08-03T06:00:00Z" }
              as: EnvironmentalCompliance
              as_user_id: "ec-1"
          assert:
            - "${err_future} == \"ERR_EMISSIONS_PERIOD_INVALID\" with HTTP 422: period_end 2026-09-01 is later than the logical clock 2026-08-03T06:00:00Z, so the period has not closed"
            - "${err_degenerate} == \"ERR_INVALID_REQUEST\" with HTTP 400, NOT ERR_EMISSIONS_PERIOD_INVALID: an interval whose end is not strictly after its start is caught by request-shape validation at priority 20, which outranks priority 90"
            - "after both refusals Plant.${plant_id}.emissions_status is STILL COMPLIANT with reported_period_start == null and reported_period_end == null"
            - "the third report, whose period_end equals the logical clock EXACTLY, returns HTTP 200 — the rule is period_end <= clock"
            - "Plant.${plant_id}.emissions_status == REPORTED, reported_formaldehyde_kg == 0.0000, reported_voc_kg == 0.0000 (no run in the window), reported_period_start == \"2026-08-01T00:00:00Z\" and reported_period_end == \"2026-08-03T06:00:00Z\""
            - "melt_posture is STILL OPEN: a compliant report never freezes the melt"

