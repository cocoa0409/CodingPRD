      - name: retired_entity_archival_semantics
        claim_type: side_effect_execution
        grounds: ["state_machines.AuditableEntity.ACTIVE_to_RETIRED", "errors[ERR_AUDITABLE_ENTITY_RETIRED]", "errors[ERR_ENTITY_HAS_OPEN_ENGAGEMENTS]", "errors[ERR_AUDITABLE_ENTITY_INVALID_STATE]"]
        distinguishing_aspect: "Soft archival: a RETIRED entity remains GET-readable, rejects new risk assessments and engagements (ERR_AUDITABLE_ENTITY_RETIRED), rejects re-retire (ERR_AUDITABLE_ENTITY_INVALID_STATE), and an entity with an open engagement cannot be retired at all (ERR_ENTITY_HAS_OPEN_ENGAGEMENTS)."
        test_recipe:
          setup: ["Entity A (no engagements) retired; entity B with a PLANNED engagement"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-01-15T00:00:00Z" }, as: AuditAdmin }
            - { call: "POST /audit/auditable-entities", payload: { name: "EA", business_owner: "OA" }, as: AuditAdmin, captures: { ent_a: "$.data.id" } }
            - { call: "POST /audit/auditable-entities", payload: { name: "EB", business_owner: "OB" }, as: AuditAdmin, captures: { ent_b: "$.data.id" } }
            - { call: "POST /audit/auditors", payload: { full_name: "Mary Mgr", grade: "MANAGER" }, as: AuditAdmin, captures: { mgr1: "$.data.id" } }
            - { call: "POST /audit/audit-plans", payload: { fiscal_year: 2026, title: "P" }, as: ChiefAuditExecutive, as_user_id: "cae-1", captures: { plan: "$.data.id", plan_v: "$.data.version" } }
            - { call: "POST /audit/engagements", payload: { audit_plan_id: "${plan}", auditable_entity_id: "${ent_b}", title: "G", scope_summary: "s", budget_hours: 50, start_date: "2026-02-01T00:00:00Z", end_date: "2026-02-28T00:00:00Z", expected_audit_plan_version: "${plan_v}" }, as: AuditManager, as_user_id: "${mgr1}", captures: { eng_b: "$.data.id" } }
            - { call: "GET /audit/audit-plans/${plan}", payload: {}, as: AuditManager, as_user_id: "${mgr1}", captures: { plan_v2: "$.data.version" } }
          trigger:
            - { call: "POST /audit/auditable-entities/${ent_a}/retire", payload: {}, as: AuditAdmin, captures: { ent_a_v2: "$.data.version" } }
            - { call: "GET /audit/auditable-entities/${ent_a}", payload: {}, as: AuditAdmin, captures: { ent_a_status: "$.data.status" } }
            - { call: "POST /audit/auditable-entities/${ent_a}/retire", payload: {}, as: AuditAdmin, captures: { e1: "$.data.error_id" } }
            - { call: "POST /audit/risk-assessments", payload: { auditable_entity_id: "${ent_a}", fiscal_year: 2026, likelihood: 3, impact: 3, expected_auditable_entity_version: "${ent_a_v2}" }, as: AuditManager, as_user_id: "${mgr1}", captures: { e2: "$.data.error_id" } }
            - { call: "POST /audit/engagements", payload: { audit_plan_id: "${plan}", auditable_entity_id: "${ent_a}", title: "G2", scope_summary: "s", budget_hours: 50, start_date: "2026-06-01T00:00:00Z", end_date: "2026-06-30T00:00:00Z", expected_audit_plan_version: "${plan_v2}" }, as: AuditManager, as_user_id: "${mgr1}", captures: { e3: "$.data.error_id" } }
            - { call: "POST /audit/auditable-entities/${ent_b}/retire", payload: {}, as: AuditAdmin, captures: { e4: "$.data.error_id" } }
          assert:
            - "Retire: AuditableEntity.${ent_a}.status == RETIRED, retired_at non-null; GET still returns 200 (archival read)"
            - "Re-retire: error == ERR_AUDITABLE_ENTITY_INVALID_STATE"
            - "Risk assessment on RETIRED: error == ERR_AUDITABLE_ENTITY_RETIRED"
            - "Engagement on RETIRED: error == ERR_AUDITABLE_ENTITY_RETIRED (OCC passes first because the fresh plan version ${plan_v2} is supplied)"

      - name: risk_assessment_uniqueness_and_finalize_state
        claim_type: violation_to_error
        grounds: ["errors[ERR_RISK_ASSESSMENT_DRAFT_EXISTS]", "errors[ERR_RISK_ASSESSMENT_ALREADY_FINALIZED]", "errors[ERR_RISK_ASSESSMENT_INVALID_STATE]"]
        distinguishing_aspect: "One DRAFT and one FINALIZED per (entity, fiscal_year): duplicate draft create -> ERR_RISK_ASSESSMENT_DRAFT_EXISTS; after finalize a same-year create -> ERR_RISK_ASSESSMENT_ALREADY_FINALIZED; re-finalize -> ERR_RISK_ASSESSMENT_INVALID_STATE. OCC versions are refreshed via GET between mutations."
        test_recipe:
          setup: ["Entity at version 1; manager mgr1"]
          setup_api_calls:
            - { call: "POST /audit/auditable-entities", payload: { name: "E", business_owner: "O" }, as: AuditAdmin, captures: { ent: "$.data.id", ent_v1: "$.data.version" } }
