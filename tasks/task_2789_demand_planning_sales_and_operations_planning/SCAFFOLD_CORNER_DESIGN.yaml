              as_user_id: "exec-1"
            - call: "POST /sop/accuracy-records"
              payload: { cycle_id: "${cycle_a}", item_id: "${item_id}", customer_id: "${cust_id}", actual_units: 100 }
              as: SopAdmin
              captures: { rec_a: $.data.id }
            - call: "POST /sop/accuracy-records"
              payload: { cycle_id: "${cycle_b}", item_id: "${item_id}", customer_id: "${cust_id}", actual_units: 5000 }
              as: SopAdmin
              captures: { rec_b: $.data.id }
          trigger:
            - call: "GET /sop/planning-cycles/${cycle_a}/accuracy-summary"
              payload: {}
              as: ExecutiveSponsor
              as_user_id: "exec-1"
              captures: { a_count: $.data.record_count, a_mape: $.data.mape_pct, a_wmape: $.data.wmape_pct, a_bias: $.data.bias_pct, a_flag: $.data.bias_flag, a_grade: $.data.accuracy_grade }
            - call: "GET /sop/planning-cycles/${cycle_b}/accuracy-summary"
              payload: {}
              as: ExecutiveSponsor
              as_user_id: "exec-1"
              captures: { b_mape: $.data.mape_pct, b_wmape: $.data.wmape_pct, b_grade: $.data.accuracy_grade }
            - call: "GET /sop/product-families/${fam_id}"
              payload: {}
              as: ExecutiveSponsor
              as_user_id: "exec-1"
              captures: { f_wmape: $.data.rolling_wmape_pct, f_bias: $.data.rolling_bias_pct, f_flag: $.data.bias_flag, f_grade: $.data.accuracy_grade, f_count: $.data.scored_record_count }
          assert:
            - "AccuracyRecord.${rec_a}: forecast_units_snapshot == 130, signed_error_units == 30, abs_error_units == 30, ape_pct == 30.00"
            - "AccuracyRecord.${rec_b}: forecast_units_snapshot == 5200, signed_error_units == 200, abs_error_units == 200, ape_pct == 4.00"
            - "CY-A summary: ${a_count} == 1, ${a_mape} == 30.00, ${a_wmape} == 30.00, ${a_bias} == 30.00, ${a_flag} == \"OVER_FORECAST\", ${a_grade} == \"C\", total_actual_units == 100, total_abs_error_units == 30"
            - "CY-B summary: ${b_mape} == 4.00, ${b_wmape} == 4.00, ${b_grade} == \"A\""
            - "Family rollup spans BOTH cycles: ${f_count} == 2, ${f_wmape} == 4.51 == round_half_up((30 + 200) / (100 + 5000) * 100, 2), ${f_bias} == 4.51, ${f_flag} == \"NONE\" and ${f_grade} == \"A\""
            - "The cycle-scoped MAPE for the pair would be 17.00 == round_half_up((30.00 + 4.00) / 2, 2) — materially different from the 4.51 WMAPE, and neither equals either single-cycle figure"
            - "No summary reports ${f_wmape} for CY-A: 30.00 != 4.51, so the two scopes must not be conflated"

      - name: family_rollup_mape_and_wmape_diverge_on_the_same_record_set
        claim_type: Variant Divergence
        grounds:
          - calculations.calc_accuracy_rollup
          - entities.ProductFamily.fields.rolling_wmape_pct
        excluded_because:
          difficulty_instance: dual_variant_calc / accuracy_mape_vs_wmape_diverge_on_same_records
          rationale: "The round-then-average MAPE versus aggregate-then-round WMAPE divergence, and the fact that only WMAPE feeds accuracy_grade, are the whole subject of the named §1.8 instance."

      - name: consensus_units_rounds_each_adjustment_before_summing
        claim_type: Precision
        grounds:
          - calculations.calc_consensus_units
          - entities.ConsensusAdjustment.fields.applied_delta_units
        excluded_because:
          difficulty_instance: combinatorial_formula / consensus_units_per_adjustment_rounding_then_sum
          rationale: "The pinned round-per-line-then-sum order, including the separately rounded lift and cannibalization terms, is asserted literally by the named §1.8 instance."

  - section: validations
    instances:
      - name: duplicate_forecast_for_same_cycle_item_customer_month_rejected
        claim_type: Violation to Error
        grounds:
          - validations[priority=150]
          - errors.ERR_DUPLICATE_FORECAST
          - endpoints[POST /sop/demand-forecasts]
        distinguishing_aspect: |
          The uniqueness key is the full quadruple (cycle_id, item_id, customer_id, month), so a
          second 2026-09 line is rejected while a 2026-10 line for the same cycle, item and
          customer is accepted. The rejection must not leave a partial row behind.
        test_recipe:
          setup:
            - "The base family, item and customer, and a cycle over 2026-09..2026-10 with commitment 0."
          setup_api_calls:
            - call: "POST /sop/product-families"
              payload: { family_code: "FAM-BASE", name: "Base Family", accountable_planner_user_id: "planner-1", units_per_hour: 100, max_monthly_hours: 800 }
              as: SopAdmin
              captures: { fam_id: $.data.id }
            - call: "POST /sop/items"
              payload: { sku: "SKU-BASE", family_id: "${fam_id}", unit_price_cents: 1000, unit_cost_cents: 400, on_hand_units: 0, material_supply_cap_units: 100000, avg_monthly_demand_units: 1000, lifecycle_state: "MATURE" }
              as: SopAdmin
              captures: { item_id: $.data.id }
            - call: "POST /sop/customers"
              payload: { customer_code: "CUST-BASE", name: "Base Grocery", channel: "GROCERY", priority_rank: 3 }
              as: SopAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /sop/planning-cycles"
              payload: { cycle_code: "CY-DUP", horizon_start_month: "2026-09", horizon_end_month: "2026-10", financial_commitment_cents: 0, supply_review_policy: "NET_INVENTORY_FIRST" }
              as: SopAdmin
              captures: { cycle_id: $.data.id }
            - call: "POST /sop/demand-forecasts"
              payload: { cycle_id: "${cycle_id}", item_id: "${item_id}", customer_id: "${cust_id}", month: "2026-09", level_units: 1000, trend_units_per_month: 0, seasonal_index: 1.0, causal_uplift_pct: 0 }
              as: DemandPlanner
              as_user_id: "planner-1"
              captures: { first_id: $.data.id }
          trigger:
            - call: "POST /sop/demand-forecasts"
              payload: { cycle_id: "${cycle_id}", item_id: "${item_id}", customer_id: "${cust_id}", month: "2026-09", level_units: 700, trend_units_per_month: 0, seasonal_index: 1.0, causal_uplift_pct: 0 }
              as: DemandPlanner
              as_user_id: "planner-1"
              captures: { err: $.data.error_id }
            - call: "POST /sop/demand-forecasts"
              payload: { cycle_id: "${cycle_id}", item_id: "${item_id}", customer_id: "${cust_id}", month: "2026-10", level_units: 700, trend_units_per_month: 0, seasonal_index: 1.0, causal_uplift_pct: 0 }
              as: DemandPlanner
              as_user_id: "planner-1"
              captures: { second_id: $.data.id }
          assert:
            - "The 2026-09 repeat returns 422 with ${err} == \"ERR_DUPLICATE_FORECAST\""
            - "DemandForecast.${first_id}.level_units is still 1000 and baseline_units is still 1000 — the rejected call did not overwrite the original"
            - "The 2026-10 call returns 201 and DemandForecast.${second_id}.baseline_units == 700"
            - "GET /sop/demand-forecasts?cycle_id=${cycle_id} returns total_count == 2, not 3"

      - name: supply_plan_create_second_non_stale_plan_rejected
        claim_type: Violation to Error
        grounds:
          - validations[priority=150]
          - errors.ERR_SUPPLY_PLAN_EXISTS
          - endpoints[POST /sop/supply-plans]
        distinguishing_aspect: |
          At most one non-STALE SupplyPlan may exist per (cycle_id, item_id). The second create
          is refused with 422 ERR_SUPPLY_PLAN_EXISTS and — critically — the cycle's
          plan_value_cents must not double to 2_660_000, which is exactly what a silently
          accepted duplicate row would produce.
        test_recipe:
          setup:
            - "The base fixture with a 14-hour block (1400 units), one locked forecast of 1000 units, and one PLANNED SupplyPlan with constrained_units 1330 in a SUPPLY_REVIEW cycle."
          setup_api_calls:
            - call: "POST /sop/product-families"
              payload: { family_code: "FAM-BASE", name: "Base Family", accountable_planner_user_id: "planner-1", units_per_hour: 100, max_monthly_hours: 800 }
              as: SopAdmin
              captures: { fam_id: $.data.id }
            - call: "POST /sop/items"
              payload: { sku: "SKU-BASE", family_id: "${fam_id}", unit_price_cents: 1000, unit_cost_cents: 400, on_hand_units: 0, material_supply_cap_units: 100000, avg_monthly_demand_units: 1000, service_level_target_pct: 95.0, demand_cv: 0.20, lead_time_days: 30, lifecycle_state: "MATURE" }
              as: SopAdmin
              captures: { item_id: $.data.id }
            - call: "POST /sop/customers"
              payload: { customer_code: "CUST-BASE", name: "Base Grocery", channel: "GROCERY", priority_rank: 3 }
              as: SopAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /sop/capacity-blocks"
              payload: { family_id: "${fam_id}", start_date: "2026-09-01", end_date: "2026-09-30", available_hours: 14 }
              as: SupplyPlanner
              as_user_id: "supply-1"
            - call: "POST /sop/planning-cycles"
              payload: { cycle_code: "CY-ONEPLAN", horizon_start_month: "2026-09", horizon_end_month: "2026-09", financial_commitment_cents: 0, supply_review_policy: "NET_INVENTORY_FIRST" }
              as: SopAdmin
              captures: { cycle_id: $.data.id }
            - call: "POST /sop/demand-forecasts"
              payload: { cycle_id: "${cycle_id}", item_id: "${item_id}", customer_id: "${cust_id}", month: "2026-09", level_units: 1000, trend_units_per_month: 0, seasonal_index: 1.0, causal_uplift_pct: 0 }
              as: DemandPlanner
              as_user_id: "planner-1"
            - call: "POST /sop/planning-cycles/${cycle_id}/transitions"
              payload: { target_status: "SUPPLY_REVIEW" }
              as: SopAdmin
            - call: "POST /sop/supply-plans"
              payload: { cycle_id: "${cycle_id}", item_id: "${item_id}" }
              as: SupplyPlanner
              as_user_id: "supply-1"
              captures: { plan_id: $.data.id }
          trigger:
            - call: "POST /sop/supply-plans"
              payload: { cycle_id: "${cycle_id}", item_id: "${item_id}" }
              as: SupplyPlanner
              as_user_id: "supply-1"
              captures: { err: $.data.error_id }
          assert:
            - "Status is 422 and ${err} == \"ERR_SUPPLY_PLAN_EXISTS\""
            - "GET /sop/supply-plans?cycle_id=${cycle_id} returns total_count == 1 and SupplyPlan.${plan_id}.status == \"PLANNED\""
            - "PlanningCycle.${cycle_id}.plan_value_cents == 1330000, NOT 2660000"

      - name: duplicate_accuracy_record_for_same_triple_rejected
        claim_type: Violation to Error
        grounds:
          - validations[priority=150]
          - errors.ERR_DUPLICATE_ACCURACY_RECORD
          - endpoints[POST /sop/accuracy-records]
        distinguishing_aspect: |
          An actual may be posted exactly once per (cycle_id, item_id, customer_id) — the
          AccuracyRecord ledger is append-only and has no update path, so a correction attempt
          must be refused rather than overwriting the first row. The family rollup must stay at
          scored_record_count 1 with its original figures.
        test_recipe:
          setup:
            - "The base family, item and customer; a cycle over 2026-09..2026-09 (commitment 0) with one locked forecast of 1000 units, walked to PUBLISHED, and one AccuracyRecord already posted at actual_units 900."
          setup_api_calls:
            - call: "POST /sop/product-families"
              payload: { family_code: "FAM-BASE", name: "Base Family", accountable_planner_user_id: "planner-1", units_per_hour: 100, max_monthly_hours: 800 }
              as: SopAdmin
              captures: { fam_id: $.data.id }
            - call: "POST /sop/items"
              payload: { sku: "SKU-BASE", family_id: "${fam_id}", unit_price_cents: 1000, unit_cost_cents: 400, on_hand_units: 0, material_supply_cap_units: 100000, avg_monthly_demand_units: 1000, lifecycle_state: "MATURE" }
              as: SopAdmin
              captures: { item_id: $.data.id }
            - call: "POST /sop/customers"
              payload: { customer_code: "CUST-BASE", name: "Base Grocery", channel: "GROCERY", priority_rank: 3 }
              as: SopAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /sop/planning-cycles"
              payload: { cycle_code: "CY-ONEREC", horizon_start_month: "2026-09", horizon_end_month: "2026-09", financial_commitment_cents: 0, supply_review_policy: "NET_INVENTORY_FIRST" }
              as: SopAdmin
              captures: { cycle_id: $.data.id }
            - call: "POST /sop/demand-forecasts"
              payload: { cycle_id: "${cycle_id}", item_id: "${item_id}", customer_id: "${cust_id}", month: "2026-09", level_units: 1000, trend_units_per_month: 0, seasonal_index: 1.0, causal_uplift_pct: 0 }
              as: DemandPlanner
              as_user_id: "planner-1"
            - call: "POST /sop/planning-cycles/${cycle_id}/transitions"
              payload: { target_status: "SUPPLY_REVIEW" }
              as: SopAdmin
            - call: "POST /sop/planning-cycles/${cycle_id}/transitions"
              payload: { target_status: "SCENARIO_REVIEW" }
              as: SopAdmin
            - call: "POST /sop/planning-cycles/${cycle_id}/transitions"
              payload: { target_status: "EXECUTIVE_REVIEW" }
              as: SopAdmin
            - call: "POST /sop/planning-cycles/${cycle_id}/transitions"
              payload: { target_status: "PUBLISHED" }
              as: ExecutiveSponsor
              as_user_id: "exec-1"
            - call: "POST /sop/accuracy-records"
              payload: { cycle_id: "${cycle_id}", item_id: "${item_id}", customer_id: "${cust_id}", actual_units: 900 }
              as: SopAdmin
              captures: { rec_id: $.data.id }
          trigger:
            - call: "POST /sop/accuracy-records"
              payload: { cycle_id: "${cycle_id}", item_id: "${item_id}", customer_id: "${cust_id}", actual_units: 1000 }
              as: DemandPlanner
              as_user_id: "planner-1"
              captures: { err: $.data.error_id }
          assert:
            - "Status is 422 and ${err} == \"ERR_DUPLICATE_ACCURACY_RECORD\" — a different acting role does not unlock a second post"
            - "AccuracyRecord.${rec_id}.actual_units is still 900, abs_error_units == 100, signed_error_units == 100 and ape_pct == 11.11 == round_half_up(100 / 900 * 100, 2)"
            - "GET /sop/accuracy-records?cycle_id=${cycle_id} returns total_count == 1"
            - "ProductFamily.${fam_id}.scored_record_count == 1 and rolling_wmape_pct == 11.11"

      - name: forecast_month_outside_cycle_horizon_rejected
        claim_type: Violation to Error
        grounds:
          - validations[priority=140]
          - errors.ERR_MONTH_OUTSIDE_HORIZON
          - entities.PlanningCycle.fields.horizon_end_month
        distinguishing_aspect: |
          The horizon is a CLOSED interval on YYYY-MM strings, so 2026-11 — the last month — is
          accepted while both 2026-12 (one past the end) and 2026-08 (one before the start) are
          refused. The comparison must be month-granular, not year-granular.
        test_recipe:
          setup:
            - "The base family, item and customer, and a cycle over 2026-09..2026-11 with commitment 0."
          setup_api_calls:
            - call: "POST /sop/product-families"
              payload: { family_code: "FAM-BASE", name: "Base Family", accountable_planner_user_id: "planner-1", units_per_hour: 100, max_monthly_hours: 800 }
              as: SopAdmin
              captures: { fam_id: $.data.id }
            - call: "POST /sop/items"
              payload: { sku: "SKU-BASE", family_id: "${fam_id}", unit_price_cents: 1000, unit_cost_cents: 400, on_hand_units: 0, material_supply_cap_units: 100000, avg_monthly_demand_units: 1000, lifecycle_state: "MATURE" }
              as: SopAdmin
              captures: { item_id: $.data.id }
            - call: "POST /sop/customers"
              payload: { customer_code: "CUST-BASE", name: "Base Grocery", channel: "GROCERY", priority_rank: 3 }
              as: SopAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /sop/planning-cycles"
              payload: { cycle_code: "CY-HORIZON", horizon_start_month: "2026-09", horizon_end_month: "2026-11", financial_commitment_cents: 0, supply_review_policy: "NET_INVENTORY_FIRST" }
              as: SopAdmin
              captures: { cycle_id: $.data.id }
          trigger:
            - call: "POST /sop/demand-forecasts"
              payload: { cycle_id: "${cycle_id}", item_id: "${item_id}", customer_id: "${cust_id}", month: "2026-12", level_units: 1000, trend_units_per_month: 0, seasonal_index: 1.0, causal_uplift_pct: 0 }
              as: DemandPlanner
              as_user_id: "planner-1"
              captures: { err_after: $.data.error_id }
            - call: "POST /sop/demand-forecasts"
              payload: { cycle_id: "${cycle_id}", item_id: "${item_id}", customer_id: "${cust_id}", month: "2026-08", level_units: 1000, trend_units_per_month: 0, seasonal_index: 1.0, causal_uplift_pct: 0 }
              as: DemandPlanner
              as_user_id: "planner-1"
              captures: { err_before: $.data.error_id }
            - call: "POST /sop/demand-forecasts"
              payload: { cycle_id: "${cycle_id}", item_id: "${item_id}", customer_id: "${cust_id}", month: "2026-11", level_units: 1000, trend_units_per_month: 0, seasonal_index: 1.0, causal_uplift_pct: 0 }
              as: DemandPlanner
              as_user_id: "planner-1"
              captures: { edge_id: $.data.id }
          assert:
            - "Both out-of-range calls return 422 with ${err_after} == ${err_before} == \"ERR_MONTH_OUTSIDE_HORIZON\""
            - "The 2026-11 call returns 201 — the closing month of the horizon is INSIDE the interval"
            - "DemandForecast.${edge_id}.month == \"2026-11\" and baseline_units == 1000 (offset 2 with zero trend leaves the level untouched)"
            - "GET /sop/demand-forecasts?cycle_id=${cycle_id} returns total_count == 1"

      - name: promotion_approve_in_current_logical_month_returns_horizon_frozen
        claim_type: Violation to Error
        grounds:
          - validations[priority=140]
          - errors.ERR_PROMOTION_HORIZON_FROZEN
          - endpoints[POST /_clock/set_current_utc]
        distinguishing_aspect: |
          Approval requires start_month STRICTLY after the current logical month, so at the
          default clock of 2026-08-01 a 2026-08 promotion is frozen while a 2026-09 one is
          approvable. Repositioning the clock into 2026-09 then freezes a different 2026-09
          promotion that was approvable one instant earlier — the rule reads the clock, never
          the wall time.
        test_recipe:
          setup:
            - "The base family, one MATURE item and two customers. The logical clock sits at its default 2026-08-01T00:00:00Z."
            - "Three DRAFT promotions on the item: P-AUG (2026-08..2026-08, CUST-A), P-SEP (2026-09..2026-09, CUST-A) and P-LATE (2026-09..2026-09, CUST-B)."
          setup_api_calls:
            - call: "POST /sop/product-families"
              payload: { family_code: "FAM-BASE", name: "Base Family", accountable_planner_user_id: "planner-1", units_per_hour: 100, max_monthly_hours: 800 }
              as: SopAdmin
              captures: { fam_id: $.data.id }
            - call: "POST /sop/items"
              payload: { sku: "SKU-BASE", family_id: "${fam_id}", unit_price_cents: 1000, unit_cost_cents: 400, on_hand_units: 0, material_supply_cap_units: 100000, avg_monthly_demand_units: 1000, lifecycle_state: "MATURE" }
              as: SopAdmin
              captures: { item_id: $.data.id }
            - call: "POST /sop/customers"
              payload: { customer_code: "CUST-A", name: "Customer A", channel: "GROCERY", priority_rank: 3 }
              as: SopAdmin
              captures: { cust_a: $.data.id }
            - call: "POST /sop/customers"
              payload: { customer_code: "CUST-B", name: "Customer B", channel: "CLUB", priority_rank: 4 }
              as: SopAdmin
              captures: { cust_b: $.data.id }
            - call: "POST /sop/promotions"
              payload: { item_id: "${item_id}", customer_id: "${cust_a}", start_month: "2026-08", end_month: "2026-08", lift_pct: 10, cannibalization_pct: 2 }
              as: DemandPlanner
              as_user_id: "planner-1"
              captures: { p_aug: $.data.id }
            - call: "POST /sop/promotions"
              payload: { item_id: "${item_id}", customer_id: "${cust_a}", start_month: "2026-09", end_month: "2026-09", lift_pct: 10, cannibalization_pct: 2 }
              as: DemandPlanner
              as_user_id: "planner-1"
              captures: { p_sep: $.data.id }
            - call: "POST /sop/promotions"
              payload: { item_id: "${item_id}", customer_id: "${cust_b}", start_month: "2026-09", end_month: "2026-09", lift_pct: 10, cannibalization_pct: 2 }
              as: DemandPlanner
              as_user_id: "planner-1"
              captures: { p_late: $.data.id }
          trigger:
            - call: "POST /sop/promotions/${p_aug}/approve"
              payload: {}
              as: DemandReviewLead
              as_user_id: "lead-1"
              captures: { err_aug: $.data.error_id }
            - call: "POST /sop/promotions/${p_sep}/approve"
              payload: {}
              as: DemandReviewLead
              as_user_id: "lead-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: SopAdmin
            - call: "POST /sop/promotions/${p_late}/approve"
              payload: {}
              as: DemandReviewLead
              as_user_id: "lead-1"
              captures: { err_late: $.data.error_id }
          assert:
            - "P-AUG returns 422 with ${err_aug} == \"ERR_PROMOTION_HORIZON_FROZEN\" and Promotion.${p_aug}.status is still \"DRAFT\""
            - "P-SEP returns 200 and Promotion.${p_sep}.status == \"APPROVED\" — 2026-09 is strictly after the logical month 2026-08"
            - "After the clock moves to 2026-09-15, P-LATE returns 422 with ${err_late} == \"ERR_PROMOTION_HORIZON_FROZEN\" even though it is a byte-identical window to the one just approved"
            - "Promotion.${p_late}.status is still \"DRAFT\"; P-LATE targets CUST-B, so ERR_PROMOTION_WINDOW_OVERLAP is not in play"

      - name: promotion_adjustment_citing_draft_promotion_rejected
        claim_type: Violation to Error
        grounds:
          - validations[priority=130]
          - errors.ERR_PROMOTION_NOT_APPROVED
          - endpoints[POST /sop/consensus-adjustments]
        distinguishing_aspect: |
          A PROMOTION adjustment may only cite an APPROVED promotion, and the check runs at
          priority 130 — before any lift arithmetic — so the forecast's consensus_units must be
          completely untouched and the forecast must stay in BASELINE rather than sliding to
          UNDER_CONSENSUS. Approving the promotion then makes the identical payload succeed.
        test_recipe:
          setup:
            - "The base family, one MATURE item and one customer; a cycle over 2026-09..2026-09 (commitment 0) with one BASELINE forecast of 1000 units."
            - "One DRAFT promotion on the same item for 2026-09..2026-09 with lift_pct 10 and cannibalization_pct 2."
          setup_api_calls:
            - call: "POST /sop/product-families"
              payload: { family_code: "FAM-BASE", name: "Base Family", accountable_planner_user_id: "planner-1", units_per_hour: 100, max_monthly_hours: 800 }
              as: SopAdmin
              captures: { fam_id: $.data.id }
            - call: "POST /sop/items"
              payload: { sku: "SKU-BASE", family_id: "${fam_id}", unit_price_cents: 1000, unit_cost_cents: 400, on_hand_units: 0, material_supply_cap_units: 100000, avg_monthly_demand_units: 1000, lifecycle_state: "MATURE" }
              as: SopAdmin
              captures: { item_id: $.data.id }
            - call: "POST /sop/customers"
              payload: { customer_code: "CUST-BASE", name: "Base Grocery", channel: "GROCERY", priority_rank: 3 }
              as: SopAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /sop/planning-cycles"
              payload: { cycle_code: "CY-PROMO", horizon_start_month: "2026-09", horizon_end_month: "2026-09", financial_commitment_cents: 0, supply_review_policy: "NET_INVENTORY_FIRST" }
              as: SopAdmin
              captures: { cycle_id: $.data.id }
            - call: "POST /sop/demand-forecasts"
              payload: { cycle_id: "${cycle_id}", item_id: "${item_id}", customer_id: "${cust_id}", month: "2026-09", level_units: 1000, trend_units_per_month: 0, seasonal_index: 1.0, causal_uplift_pct: 0 }
              as: DemandPlanner
              as_user_id: "planner-1"
              captures: { fc_id: $.data.id, fc_v1: $.data.version }
            - call: "POST /sop/promotions"
              payload: { item_id: "${item_id}", customer_id: "${cust_id}", start_month: "2026-09", end_month: "2026-09", lift_pct: 10, cannibalization_pct: 2 }
              as: DemandPlanner
              as_user_id: "planner-1"
              captures: { promo_id: $.data.id }
          trigger:
            - call: "POST /sop/consensus-adjustments"
              payload: { demand_forecast_id: "${fc_id}", adjustment_type: "PROMOTION", delta_units: 0, rationale: "citing an unapproved promotion", promotion_id: "${promo_id}", expected_demand_forecast_version: "${fc_v1}" }
              as: DemandPlanner
              as_user_id: "planner-1"
              captures: { err: $.data.error_id }
            - call: "POST /sop/promotions/${promo_id}/approve"
              payload: {}
              as: DemandReviewLead
              as_user_id: "lead-1"
            - call: "POST /sop/consensus-adjustments"
              payload: { demand_forecast_id: "${fc_id}", adjustment_type: "PROMOTION", delta_units: 0, rationale: "now approved", promotion_id: "${promo_id}", expected_demand_forecast_version: "${fc_v1}" }
              as: DemandPlanner
              as_user_id: "planner-1"
              captures: { adj_id: $.data.id }
          assert:
            - "The first create returns 422 with ${err} == \"ERR_PROMOTION_NOT_APPROVED\""
            - "DemandForecast.${fc_id}.status is still \"BASELINE\", consensus_units is still 1000 and version is still ${fc_v1} — the rejected create left no trace, so the same OCC token is still current"
            - "The second create returns 201 with ConsensusAdjustment.${adj_id}.status == \"PROPOSED\" and applied_delta_units == 80 == round_half_up(1000 * 10 / 100) - round_half_up(1000 * 2 / 100) == 100 - 20"
            - "DemandForecast.${fc_id}.status == \"UNDER_CONSENSUS\" and consensus_units == 1000 — a PROPOSED adjustment does not contribute yet"
            - "The supplied delta_units 0 was ignored: applied_delta_units is derived entirely from the promotion's lift_pct and cannibalization_pct"

      - name: adjustment_type_permitted_set_tracks_item_lifecycle_in_both_directions
        claim_type: Priority Ordering
        grounds:
          - validations[priority=130]
          - errors.ERR_ADJUSTMENT_TYPE_NOT_PERMITTED
          - entities.Item.fields.lifecycle_state
        distinguishing_aspect: |
          Rule 130(c) is two-sided: NEW_ITEM_PLAN is legal only on PRELAUNCH or RAMP items and
          SALES_INTELLIGENCE is illegal on PRELAUNCH ones. The same two adjustment types
          therefore swap legality between a MATURE item and a PRELAUNCH item, and both
          rejections must be the SAME error id despite pointing in opposite directions.
        test_recipe:
          setup:
            - "One family with a MATURE item (SKU-MAT) and a PRELAUNCH item (SKU-PRE, npi_ramp_pct 100), one customer, and a cycle over 2026-09..2026-09 with commitment 0."
            - "One BASELINE forecast of 1000 units per item, so each has a swing limit of round_half_up(1000 * 25 / 100) == 250."
          setup_api_calls:
            - call: "POST /sop/product-families"
              payload: { family_code: "FAM-BASE", name: "Base Family", accountable_planner_user_id: "planner-1", units_per_hour: 100, max_monthly_hours: 800 }
              as: SopAdmin
              captures: { fam_id: $.data.id }
            - call: "POST /sop/items"
              payload: { sku: "SKU-MAT", family_id: "${fam_id}", unit_price_cents: 1000, unit_cost_cents: 400, on_hand_units: 0, material_supply_cap_units: 100000, avg_monthly_demand_units: 1000, lifecycle_state: "MATURE" }
              as: SopAdmin
              captures: { mat_id: $.data.id }
            - call: "POST /sop/items"
              payload: { sku: "SKU-PRE", family_id: "${fam_id}", unit_price_cents: 1000, unit_cost_cents: 400, on_hand_units: 0, material_supply_cap_units: 100000, avg_monthly_demand_units: 1000, npi_ramp_pct: 100, lifecycle_state: "PRELAUNCH" }
              as: SopAdmin
              captures: { pre_id: $.data.id }
            - call: "POST /sop/customers"
              payload: { customer_code: "CUST-BASE", name: "Base Grocery", channel: "GROCERY", priority_rank: 3 }
              as: SopAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /sop/planning-cycles"
              payload: { cycle_code: "CY-TYPE", horizon_start_month: "2026-09", horizon_end_month: "2026-09", financial_commitment_cents: 0, supply_review_policy: "NET_INVENTORY_FIRST" }
              as: SopAdmin
              captures: { cycle_id: $.data.id }
            - call: "POST /sop/demand-forecasts"
              payload: { cycle_id: "${cycle_id}", item_id: "${mat_id}", customer_id: "${cust_id}", month: "2026-09", level_units: 1000, trend_units_per_month: 0, seasonal_index: 1.0, causal_uplift_pct: 0 }
              as: DemandPlanner
              as_user_id: "planner-1"
              captures: { fc_mat: $.data.id, fc_mat_v: $.data.version }
            - call: "POST /sop/demand-forecasts"
              payload: { cycle_id: "${cycle_id}", item_id: "${pre_id}", customer_id: "${cust_id}", month: "2026-09", level_units: 1000, trend_units_per_month: 0, seasonal_index: 1.0, causal_uplift_pct: 0 }
              as: DemandPlanner
              as_user_id: "planner-1"
              captures: { fc_pre: $.data.id, fc_pre_v: $.data.version }
          trigger:
            - call: "POST /sop/consensus-adjustments"
              payload: { demand_forecast_id: "${fc_mat}", adjustment_type: "NEW_ITEM_PLAN", delta_units: 100, rationale: "launch plan on a mature item", expected_demand_forecast_version: "${fc_mat_v}" }
              as: DemandPlanner
              as_user_id: "planner-1"
              captures: { err_mat: $.data.error_id }
            - call: "POST /sop/consensus-adjustments"
              payload: { demand_forecast_id: "${fc_pre}", adjustment_type: "SALES_INTELLIGENCE", delta_units: 100, rationale: "field intelligence on a prelaunch item", expected_demand_forecast_version: "${fc_pre_v}" }
              as: DemandPlanner
              as_user_id: "planner-1"
              captures: { err_pre: $.data.error_id }
            - call: "POST /sop/consensus-adjustments"
              payload: { demand_forecast_id: "${fc_mat}", adjustment_type: "SALES_INTELLIGENCE", delta_units: 100, rationale: "field intelligence on a mature item", expected_demand_forecast_version: "${fc_mat_v}" }
              as: DemandPlanner
              as_user_id: "planner-1"
              captures: { ok_mat: $.data.id }
            - call: "POST /sop/consensus-adjustments"
              payload: { demand_forecast_id: "${fc_pre}", adjustment_type: "NEW_ITEM_PLAN", delta_units: 100, rationale: "launch plan on a prelaunch item", expected_demand_forecast_version: "${fc_pre_v}" }
              as: DemandPlanner
              as_user_id: "planner-1"
              captures: { ok_pre: $.data.id }
          assert:
            - "NEW_ITEM_PLAN on the MATURE item returns 422 with ${err_mat} == \"ERR_ADJUSTMENT_TYPE_NOT_PERMITTED\""
            - "SALES_INTELLIGENCE on the PRELAUNCH item returns 422 with ${err_pre} == \"ERR_ADJUSTMENT_TYPE_NOT_PERMITTED\" — the same error id for the mirror-image violation"
            - "SALES_INTELLIGENCE on the MATURE item returns 201: ConsensusAdjustment.${ok_mat}.applied_delta_units == 100 (passed through unrounded)"
            - "NEW_ITEM_PLAN on the PRELAUNCH item returns 201: ConsensusAdjustment.${ok_pre}.applied_delta_units == 100 == round_half_up(100 * 100 / 100)"
            - "Both rejected calls left their forecasts in BASELINE at version ${fc_mat_v} / ${fc_pre_v}, which is why the later successful calls could reuse the same OCC tokens"

      - name: successor_item_in_other_family_rejected
        claim_type: Violation to Error
        grounds:
          - validations[priority=130]
          - errors.ERR_SUCCESSOR_NOT_ELIGIBLE
          - state_machines.Item.MATURE_to_RUNOUT
        distinguishing_aspect: |
          A runout successor must be a DIFFERENT item, in the SAME family, in PRELAUNCH or RAMP.
          Three distinct failures collapse to one error id — a PRELAUNCH item in another family,
          the runout item pointing at itself, and a MATURE sibling in the right family — and
          only the PRELAUNCH sibling of the same family is accepted.
        test_recipe:
          setup:
            - "FAM-ONE holds SKU-OLD (MATURE, on_hand 0), SKU-NEW (PRELAUNCH) and SKU-PEER (MATURE). FAM-TWO holds SKU-FOREIGN (PRELAUNCH). No forecasts exist."
          setup_api_calls:
            - call: "POST /sop/product-families"
              payload: { family_code: "FAM-ONE", name: "Family One", accountable_planner_user_id: "planner-1", units_per_hour: 100, max_monthly_hours: 800 }
              as: SopAdmin
              captures: { fam_one: $.data.id }
            - call: "POST /sop/product-families"
              payload: { family_code: "FAM-TWO", name: "Family Two", accountable_planner_user_id: "planner-2", units_per_hour: 100, max_monthly_hours: 800 }
              as: SopAdmin
              captures: { fam_two: $.data.id }
            - call: "POST /sop/items"
              payload: { sku: "SKU-OLD", family_id: "${fam_one}", unit_price_cents: 1000, unit_cost_cents: 400, on_hand_units: 0, material_supply_cap_units: 100000, avg_monthly_demand_units: 1000, lifecycle_state: "MATURE" }
              as: SopAdmin
              captures: { old_id: $.data.id }
            - call: "POST /sop/items"
              payload: { sku: "SKU-NEW", family_id: "${fam_one}", unit_price_cents: 1000, unit_cost_cents: 400, on_hand_units: 0, material_supply_cap_units: 100000, avg_monthly_demand_units: 1000, lifecycle_state: "PRELAUNCH" }
              as: SopAdmin
              captures: { new_id: $.data.id }
            - call: "POST /sop/items"
              payload: { sku: "SKU-PEER", family_id: "${fam_one}", unit_price_cents: 1000, unit_cost_cents: 400, on_hand_units: 0, material_supply_cap_units: 100000, avg_monthly_demand_units: 1000, lifecycle_state: "MATURE" }
              as: SopAdmin
              captures: { peer_id: $.data.id }
            - call: "POST /sop/items"
              payload: { sku: "SKU-FOREIGN", family_id: "${fam_two}", unit_price_cents: 1000, unit_cost_cents: 400, on_hand_units: 0, material_supply_cap_units: 100000, avg_monthly_demand_units: 1000, lifecycle_state: "PRELAUNCH" }
              as: SopAdmin
              captures: { foreign_id: $.data.id }
          trigger:
            - call: "POST /sop/items/${old_id}/lifecycle-transitions"
              payload: { target_state: "RUNOUT", runout_end_month: "2026-09", successor_item_id: "${foreign_id}" }
              as: SopAdmin
              captures: { err_family: $.data.error_id }
            - call: "POST /sop/items/${old_id}/lifecycle-transitions"
              payload: { target_state: "RUNOUT", runout_end_month: "2026-09", successor_item_id: "${old_id}" }
              as: SopAdmin
              captures: { err_self: $.data.error_id }
            - call: "POST /sop/items/${old_id}/lifecycle-transitions"
              payload: { target_state: "RUNOUT", runout_end_month: "2026-09", successor_item_id: "${peer_id}" }
              as: SopAdmin
              captures: { err_state: $.data.error_id }
            - call: "POST /sop/items/${old_id}/lifecycle-transitions"
              payload: { target_state: "RUNOUT", runout_end_month: "2026-09", successor_item_id: "${new_id}" }
              as: SopAdmin
          assert:
            - "All three rejections return 422 and ${err_family} == ${err_self} == ${err_state} == \"ERR_SUCCESSOR_NOT_ELIGIBLE\""
            - "The wrong-family candidate is PRELAUNCH and the self-reference is in the right family — each fails on a different clause of 130(d), yet the error id is identical"
            - "Item.${old_id}.lifecycle_state stayed \"MATURE\" through all three rejections and successor_item_id stayed null"
            - "The fourth call returns 200: Item.${old_id}.lifecycle_state == \"RUNOUT\", successor_item_id == ${new_id}, runout_end_month == \"2026-09\""
            - "GET /sop/items?successor_item_id=${new_id} returns total_count == 1"

      - name: supply_plan_create_with_no_forecast_at_all_returns_forecast_not_locked
        claim_type: Violation to Error
        grounds:
          - validations[priority=130]
          - errors.ERR_FORECAST_NOT_LOCKED
          - endpoints[POST /sop/supply-plans]
        distinguishing_aspect: |
          Rule 130(e) has two limbs and the empty-set limb is the easy one to lose: "at least
          one DemandForecast exists" must fail with ERR_FORECAST_NOT_LOCKED, not succeed
          vacuously with gross_requirement_units 0. A sibling item in the same cycle that does
          have a locked line plans normally in the same breath.
        test_recipe:
          setup:
            - "One family with two MATURE items (SKU-PLANNED and SKU-ORPHAN, both 95.0 / 0.20 / 30 so safety_stock_units is 330), one customer and a 14-hour block inside 2026-09."
            - "A cycle over 2026-09..2026-09 (commitment 0) with a single forecast of 1000 units for SKU-PLANNED and NONE for SKU-ORPHAN, advanced to SUPPLY_REVIEW."
          setup_api_calls:
            - call: "POST /sop/product-families"
              payload: { family_code: "FAM-BASE", name: "Base Family", accountable_planner_user_id: "planner-1", units_per_hour: 100, max_monthly_hours: 800 }
              as: SopAdmin
              captures: { fam_id: $.data.id }
            - call: "POST /sop/items"
              payload: { sku: "SKU-PLANNED", family_id: "${fam_id}", unit_price_cents: 1000, unit_cost_cents: 400, on_hand_units: 0, material_supply_cap_units: 100000, avg_monthly_demand_units: 1000, service_level_target_pct: 95.0, demand_cv: 0.20, lead_time_days: 30, lifecycle_state: "MATURE" }
              as: SopAdmin
              captures: { good_id: $.data.id }
            - call: "POST /sop/items"
              payload: { sku: "SKU-ORPHAN", family_id: "${fam_id}", unit_price_cents: 1000, unit_cost_cents: 400, on_hand_units: 0, material_supply_cap_units: 100000, avg_monthly_demand_units: 1000, service_level_target_pct: 95.0, demand_cv: 0.20, lead_time_days: 30, lifecycle_state: "MATURE" }
              as: SopAdmin
              captures: { orphan_id: $.data.id }
            - call: "POST /sop/customers"
              payload: { customer_code: "CUST-BASE", name: "Base Grocery", channel: "GROCERY", priority_rank: 3 }
              as: SopAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /sop/capacity-blocks"
              payload: { family_id: "${fam_id}", start_date: "2026-09-01", end_date: "2026-09-30", available_hours: 14 }
              as: SupplyPlanner
              as_user_id: "supply-1"
            - call: "POST /sop/planning-cycles"
              payload: { cycle_code: "CY-ORPHAN", horizon_start_month: "2026-09", horizon_end_month: "2026-09", financial_commitment_cents: 0, supply_review_policy: "NET_INVENTORY_FIRST" }
              as: SopAdmin
              captures: { cycle_id: $.data.id }
            - call: "POST /sop/demand-forecasts"
              payload: { cycle_id: "${cycle_id}", item_id: "${good_id}", customer_id: "${cust_id}", month: "2026-09", level_units: 1000, trend_units_per_month: 0, seasonal_index: 1.0, causal_uplift_pct: 0 }
              as: DemandPlanner
              as_user_id: "planner-1"
            - call: "POST /sop/planning-cycles/${cycle_id}/transitions"
              payload: { target_status: "SUPPLY_REVIEW" }
              as: SopAdmin
          trigger:
            - call: "POST /sop/supply-plans"
              payload: { cycle_id: "${cycle_id}", item_id: "${orphan_id}" }
              as: SupplyPlanner
              as_user_id: "supply-1"
              captures: { err: $.data.error_id }
            - call: "POST /sop/supply-plans"
              payload: { cycle_id: "${cycle_id}", item_id: "${good_id}" }
              as: SupplyPlanner
              as_user_id: "supply-1"
              captures: { plan_id: $.data.id }
          assert:
            - "The orphan create returns 422 with ${err} == \"ERR_FORECAST_NOT_LOCKED\" — NOT a 201 with gross_requirement_units 0"
            - "The sibling create returns 201 with SupplyPlan.${plan_id}.gross_requirement_units == 1000, constrained_units == 1330 and constraint_type == \"NONE\""
            - "GET /sop/supply-plans?cycle_id=${cycle_id} returns total_count == 1"
            - "PlanningCycle.${cycle_id}.plan_value_cents == 1330000"

      - name: reopen_beyond_max_reopens_rejected
        claim_type: Violation to Error
        grounds:
          - validations[priority=160]
          - errors.ERR_REOPEN_LIMIT_REACHED
          - entities.PlanningCycle.fields.reopen_count
        distinguishing_aspect: |
          MAX_REOPENS is 2, and reopen_count is a monotonic counter over the whole cycle life,
          not per session: reopens one and two succeed, the third is refused with 422
          ERR_REOPEN_LIMIT_REACHED, and the refusal must leave the cycle in EXECUTIVE_REVIEW
          with reopen_count still 2 rather than incrementing on a failed attempt.
        test_recipe:
          setup:
            - "One cycle over 2026-09..2026-09 with commitment 0 and no children at all, so every forward transition and every reopen is unblocked by preconditions."
          setup_api_calls:
            - call: "POST /sop/planning-cycles"
              payload: { cycle_code: "CY-REOPEN", horizon_start_month: "2026-09", horizon_end_month: "2026-09", financial_commitment_cents: 0, supply_review_policy: "NET_INVENTORY_FIRST" }
              as: SopAdmin
              captures: { cycle_id: $.data.id }
            - call: "POST /sop/planning-cycles/${cycle_id}/transitions"
              payload: { target_status: "SUPPLY_REVIEW" }
              as: SopAdmin
            - call: "POST /sop/planning-cycles/${cycle_id}/transitions"
              payload: { target_status: "SCENARIO_REVIEW" }
              as: SopAdmin
            - call: "POST /sop/planning-cycles/${cycle_id}/transitions"
              payload: { target_status: "EXECUTIVE_REVIEW" }
              as: SopAdmin
            - call: "POST /sop/planning-cycles/${cycle_id}/transitions"
              payload: { target_status: "DEMAND_REVIEW", reopen_reason: "first reopen" }
              as: ExecutiveSponsor
              as_user_id: "exec-1"
              captures: { count_1: $.data.reopen_count }
            - call: "POST /sop/planning-cycles/${cycle_id}/transitions"
              payload: { target_status: "SUPPLY_REVIEW" }
              as: SopAdmin
            - call: "POST /sop/planning-cycles/${cycle_id}/transitions"
              payload: { target_status: "SCENARIO_REVIEW" }
              as: SopAdmin
            - call: "POST /sop/planning-cycles/${cycle_id}/transitions"
              payload: { target_status: "EXECUTIVE_REVIEW" }
              as: SopAdmin
            - call: "POST /sop/planning-cycles/${cycle_id}/transitions"
              payload: { target_status: "DEMAND_REVIEW", reopen_reason: "second reopen" }
              as: ExecutiveSponsor
              as_user_id: "exec-1"
              captures: { count_2: $.data.reopen_count }
            - call: "POST /sop/planning-cycles/${cycle_id}/transitions"
              payload: { target_status: "SUPPLY_REVIEW" }
              as: SopAdmin
            - call: "POST /sop/planning-cycles/${cycle_id}/transitions"
              payload: { target_status: "SCENARIO_REVIEW" }
              as: SopAdmin
            - call: "POST /sop/planning-cycles/${cycle_id}/transitions"
              payload: { target_status: "EXECUTIVE_REVIEW" }
              as: SopAdmin
              captures: { v_before: $.data.version }
          trigger:
            - call: "POST /sop/planning-cycles/${cycle_id}/transitions"
              payload: { target_status: "DEMAND_REVIEW", reopen_reason: "third reopen" }
              as: ExecutiveSponsor
              as_user_id: "exec-1"
              captures: { err: $.data.error_id }
          assert:
            - "${count_1} == 1 and ${count_2} == 2 — each successful reopen increments reopen_count"
            - "Status is 422 and ${err} == \"ERR_REOPEN_LIMIT_REACHED\""
            - "PlanningCycle.${cycle_id}.status is still \"EXECUTIVE_REVIEW\", reopen_count is still 2 and version == ${v_before}"
            - "The cycle is still publishable: it is the reopen edge that is exhausted, not the cycle"

      - name: resubmit_beyond_max_revision_rounds_rejected
        claim_type: Violation to Error
        grounds:
          - validations[priority=160]
          - errors.ERR_REVISION_LIMIT_REACHED
          - state_machines.ConsensusAdjustment.REVISION_REQUESTED_to_PROPOSED
        distinguishing_aspect: |
          The revision loop is bounded at MAX_REVISION_ROUNDS 3, so revision_round walks
          0 -> 1 -> 2 -> 3 and only the FOURTH resubmit is refused. Each resubmit bumps the
          forecast's version, so the OCC token must be re-read every round; the final refusal
          must leave the adjustment in REVISION_REQUESTED at revision_round 3 with the original
          rationale of the third resubmission intact.
        test_recipe:
          setup:
            - "The base family, item and customer; a cycle over 2026-09..2026-09 (commitment 0) that stays in DEMAND_REVIEW throughout; one forecast of baseline 1000 (swing limit 250)."
            - "One SALES_INTELLIGENCE adjustment of +100 that is cycled through REQUEST_REVISION / resubmit three times, ending in REVISION_REQUESTED at revision_round 3."
          setup_api_calls:
            - call: "POST /sop/product-families"
              payload: { family_code: "FAM-BASE", name: "Base Family", accountable_planner_user_id: "planner-1", units_per_hour: 100, max_monthly_hours: 800 }
              as: SopAdmin
              captures: { fam_id: $.data.id }
            - call: "POST /sop/items"
              payload: { sku: "SKU-BASE", family_id: "${fam_id}", unit_price_cents: 1000, unit_cost_cents: 400, on_hand_units: 0, material_supply_cap_units: 100000, avg_monthly_demand_units: 1000, lifecycle_state: "MATURE" }
              as: SopAdmin
              captures: { item_id: $.data.id }
            - call: "POST /sop/customers"
              payload: { customer_code: "CUST-BASE", name: "Base Grocery", channel: "GROCERY", priority_rank: 3 }
              as: SopAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /sop/planning-cycles"
              payload: { cycle_code: "CY-REVISION", horizon_start_month: "2026-09", horizon_end_month: "2026-09", financial_commitment_cents: 0, supply_review_policy: "NET_INVENTORY_FIRST" }
              as: SopAdmin
              captures: { cycle_id: $.data.id }
            - call: "POST /sop/demand-forecasts"
              payload: { cycle_id: "${cycle_id}", item_id: "${item_id}", customer_id: "${cust_id}", month: "2026-09", level_units: 1000, trend_units_per_month: 0, seasonal_index: 1.0, causal_uplift_pct: 0 }
              as: DemandPlanner
              as_user_id: "planner-1"
              captures: { fc_id: $.data.id, fc_v0: $.data.version }
            - call: "POST /sop/consensus-adjustments"
