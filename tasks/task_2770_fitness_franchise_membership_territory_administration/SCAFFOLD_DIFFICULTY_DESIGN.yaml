            - call: "POST /franchise/relocation-requests/${rr_id}/request-changes"
              payload: { reviewer_note: "Parking ratio below brand standard" }
              as: BrandAdministrator
              as_user_id: "brand-reviewer-1"
            - call: "POST /franchise/relocation-requests/${rr_id}/submit"
              payload: { requested_lat: 34.03, requested_lng: -118.03, requested_radius_km: 5.0 }
              as: FranchiseOwner
              as_user_id: "${f1_id}"
            - call: "POST /franchise/relocation-requests/${rr_id}/request-changes"
              payload: { reviewer_note: "Frontage still insufficient" }
              as: BrandAdministrator
              as_user_id: "brand-reviewer-1"
            - call: "POST /franchise/relocation-requests/${rr_id}/submit"
              payload: { requested_lat: 34.04, requested_lng: -118.04, requested_radius_km: 5.0 }
