        distinguishing_aspect: "A Texas-style profile applies two independent zeroing constants — damages_model ACTUAL_ONLY forces base_cents to 0 at step 1 and PRA_FACTOR[NONE] is 0.0 at step 2 — while the unit counts are still reported, proving the counters are computed before the constants are applied."
