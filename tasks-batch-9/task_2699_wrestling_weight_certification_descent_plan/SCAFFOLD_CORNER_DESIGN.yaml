  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_wrestler_version_rejected_then_accepted
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.descent-plan-create-stale-wrestler
          - errors[ERR_STALE_WRESTLER_VERSION]
          - endpoints[POST /wrestlers/{id}/descent-plans]
        distinguishing_aspect: "The declared OCC rule for the Wrestler parent: a plan create carrying the version observed before a second assessment was finalized is rejected 412, the very same body succeeds once the current version is supplied, and the plan that is finally built is anchored on the NEW assessment's alpha weight — showing exactly what the stale writer would have silently discarded."
        test_recipe:
          setup:
            - "Open season, one team, one CERTIFIED assessor, wrestler A with a first VALIDATED assessment at 159.6 lbs / 14.0% (wrestler version observed here)."
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "2026-27 State Wrestling Season", start_date: "2026-11-01" }
              as: StateOffice
              captures: { season_id: $.data.id }
            - call: "POST /seasons/${season_id}/status"
              payload: { status: "OPEN" }
              as: StateOffice
            - call: "POST /teams"
              payload: { season_id: "${season_id}", school_name: "Northgate High" }
