scenario: |
  Airport Concession Program & Rent Administration (airport concessions department): concession lease with minimum annual guarantee vs percentage rent, gross sales reporting & audit rights, ACDBE participation goal & compliance, buildout/tenant improvement allowance & schedule, sales-per-enplanement performance review, street-pricing policy enforcement, operating-hour requirement & penalty, default/termination & remarketing

domain_name: airport-concession-rent
api_prefix: /concessions

complexity_profile:
  primary_archetype: ledger_reconciliation      # MAG-vs-percentage-rent: same sales data, two algorithms (provisional vs final), divergent amounts
  secondary_archetype: compliance_audit         # ACDBE goal attainment, audit rights, operating-hour & street-pricing enforcement, default/cure
  complexity_layers:
    - dual_variant_calculation                  # settlement PROVISIONAL vs FINAL; SPE TTM vs YTD
    - rate_threshold_triggers                   # tiered percentage breakpoint; ACDBE goal; SPE floor
    - derived_field_reconciliation              # lease.arrears_cents, lease.ti_remaining_cents, settlement balances
    - optimistic_concurrency                    # OCC on Lease.version for term amendments
  entity_topology: flat                         # peer resources joined by FK references; no nested URL ownership
  state_machine_shape: branching                # lease default/cure cycle + report dispute/resubmit cycle + forked reviews
  relationship_patterns:
    - one_to_many                               # Lease -> reports / settlements / draws / violations / waivers / audits / reviews
    - cross_aggregate                           # Payment -> RentSettlement; AuditCase findings -> SalesReport restatement
  role_model: hierarchical_override             # AirportAdmin superset; ConcessionAnalyst operations; Tenant & Auditor scoped
  consistency_model: immediate                  # every mutation visible in the same response; derived fields recomputed synchronously

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
# Global conventions:
#  - All money is integer cents. All rates are basis points (bp). round_half_up everywhere.
#  - A logical clock governs every date/month comparison. Default startup clock:
#    2026-08-01T00:00:00Z (see POST /_clock/set_current_utc). No rule reads wall-clock time.
#  - "current month" = the YYYY-MM of the logical clock; "current date" = its UTC date.
entities:
  - name: Tenant
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Concessionaire legal name" }
      - { name: contact_email, type: string, source: input, description: "Primary contact email" }
      - { name: acdbe_certified, type: boolean, source: input, default: false, description: "Whether the tenant itself is an ACDBE-certified firm" }

  - name: Lease
    parent: null
    common_fields: true
    fields:
      - { name: tenant_id, type: string, source: input, description: "FK -> Tenant.id; concessionaire holding this lease" }
      - { name: premises_code, type: string, source: input, description: "Airport space identifier (e.g. 'A1'); uniqueness of occupation enforced via term-overlap rule" }
      - { name: category, type: enum, source: input, description: "FOOD | RETAIL | SERVICES" }
      - { name: term_start_date, type: string, source: input, description: "ISO date; occupation begins (inclusive)" }
      - { name: term_end_date, type: string, source: input, description: "ISO date; exclusive boundary day — the premises is free for a new lease whose term_start_date equals this date" }
      - { name: mag_annual_cents, type: integer, source: input, description: "Minimum annual guarantee, cents per lease year" }
      - { name: pct_rate_below_bp, type: integer, source: input, description: "Percentage-rent rate (bp) applied to monthly gross at or below pct_breakpoint_cents" }
      - { name: pct_breakpoint_cents, type: integer, source: input, description: "Monthly gross-sales breakpoint between tier-1 and tier-2 percentage rates" }
      - { name: pct_rate_above_bp, type: integer, source: input, description: "Percentage-rent rate (bp) applied to monthly gross above pct_breakpoint_cents" }
      - { name: acdbe_goal_bp, type: integer, source: input, description: "ACDBE participation goal in basis points of gross sales (e.g. 2000 = 20%)" }
      - { name: ti_allowance_cents, type: integer, source: input, description: "Total tenant-improvement (buildout) allowance" }
      - { name: buildout_deadline, type: string, source: input, description: "ISO date; TI draws may be requested/approved while current date <= this date" }
      - { name: min_spe_cents, type: integer, source: input, description: "Sales-per-enplanement floor in cents; TTM SPE >= floor is SATISFACTORY" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | DEFAULTED | TERMINATED | EXPIRED | REMARKETING" }
      - { name: default_reason, type: enum, source: system, description: "NONPAYMENT | HOURS_SHORTFALL | ACDBE_NONCOMPLIANCE | OTHER; set on DECLARE_DEFAULT, cleared on CURE_DEFAULT" }
      - { name: arrears_cents, type: integer, source: computed, description: "Sum of balance_due_cents over this lease's settlements in {INVOICED, PARTIALLY_PAID, OVERDUE}" }
      - { name: ti_remaining_cents, type: integer, source: computed, description: "ti_allowance_cents minus sum of DISBURSED draw amounts minus sum of APPROVED (not yet disbursed) draw amounts" }

  - name: SalesReport
    parent: null
    common_fields: true
    fields:
      - { name: lease_id, type: string, source: input, description: "FK -> Lease.id; lease this monthly report belongs to" }
      - { name: period_month, type: string, source: input, description: "YYYY-MM; one report per (lease, period_month) in non-rejected states" }
      - { name: gross_sales_cents, type: integer, source: input, description: "Reported gross sales for the month; >= 0" }
      - { name: restated_gross_sales_cents, type: integer, source: system, description: "Auditor-restated gross sales; null until an audit finding adjusts the report" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | ACCEPTED | DISPUTED | ADJUSTED" }
      - { name: submitted_at, type: datetime, source: system, description: "Logical-clock timestamp of the most recent SUBMIT; null until first submit" }

  - name: RentSettlement
    parent: null
    common_fields: true
    fields:
      - { name: lease_id, type: string, source: input, description: "FK -> Lease.id; one settlement per (lease, period_year)" }
      - { name: period_year, type: integer, source: input, description: "Calendar year being settled (e.g. 2026)" }
      - { name: variant_used, type: enum, source: system, description: "PROVISIONAL while ACCRUING; FINAL once INVOICED or later" }
      - { name: mag_due_cents, type: integer, source: computed, description: "Prorated MAG for the portion of period_year inside the lease term" }
      - { name: percentage_due_cents, type: integer, source: computed, description: "Sum of per-month rounded percentage rent per the active variant's input set" }
      - { name: true_up_due_cents, type: integer, source: computed, description: "max(0, percentage_due_cents - mag_due_cents)" }
      - { name: amount_due_cents, type: integer, source: computed, description: "mag_due_cents + true_up_due_cents" }
      - { name: amount_paid_cents, type: integer, source: computed, description: "Sum of POSTED payment amount_cents against this settlement" }
      - { name: balance_due_cents, type: integer, source: computed, description: "amount_due_cents - amount_paid_cents" }
      - { name: due_date, type: string, source: system, description: "ISO date; set at invoice time to current date + 30 days" }
      - { name: status, type: enum, source: system, description: "ACCRUING | INVOICED | PARTIALLY_PAID | OVERDUE | PAID" }

  - name: Payment
    parent: null
    common_fields: true
    fields:
      - { name: settlement_id, type: string, source: system, description: "FK -> RentSettlement.id; taken from the nested creation path" }
      - { name: amount_cents, type: integer, source: input, description: "Payment amount; must be > 0 and <= balance_due_cents at posting time" }
      - { name: method, type: enum, source: input, description: "ACH | CHECK | WIRE | CARD" }
      - { name: status, type: enum, source: system, description: "POSTED | VOIDED" }

  - name: AuditCase
    parent: null
    common_fields: true
    fields:
      - { name: lease_id, type: string, source: input, description: "FK -> Lease.id; lease under audit" }
      - { name: period_start_month, type: string, source: input, description: "YYYY-MM; first month of audited window (inclusive)" }
      - { name: period_end_month, type: string, source: input, description: "YYYY-MM; last month of audited window (inclusive); must be >= period_start_month" }
      - { name: status, type: enum, source: system, description: "OPENED | FINDINGS_ISSUED | CLOSED" }
      - { name: understatement_cents, type: integer, source: computed, description: "Sum over adjusted reports of (restated_gross_sales_cents - gross_sales_cents); may be 0" }

  - name: ACDBEReview
    parent: null
    common_fields: true
    fields:
      - { name: lease_id, type: string, source: input, description: "FK -> Lease.id; lease under participation review" }
      - { name: period_year, type: integer, source: input, description: "Calendar year reviewed" }
      - { name: certified_revenue_cents, type: integer, source: system, description: "ACDBE-certified revenue declared by the analyst at evaluate time" }
      - { name: cure_additional_certified_cents, type: integer, source: system, description: "Additional certified revenue evidenced during cure; 0 until cure" }
      - { name: total_gross_cents, type: integer, source: computed, description: "Effective gross sales (ACCEPTED gross + ADJUSTED restated) for period_year at evaluation" }
      - { name: attainment_bp, type: integer, source: computed, description: "round_half_up(certified_revenue_cents * 10000 / total_gross_cents); computed at evaluate and re-computed at cure" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | COMPLIANT | DEFICIENT | CURED" }

  - name: TIDraw
    parent: null
    common_fields: true
    fields:
      - { name: lease_id, type: string, source: input, description: "FK -> Lease.id; lease whose TI allowance funds this draw" }
      - { name: amount_cents, type: integer, source: input, description: "Draw amount; > 0 and <= lease.ti_remaining_cents at creation" }
      - { name: milestone, type: enum, source: input, description: "DESIGN | CONSTRUCTION | FIXTURES | GRAND_OPENING" }
      - { name: status, type: enum, source: system, description: "REQUESTED | APPROVED | REJECTED | DISBURSED | CANCELLED" }

  - name: PolicyViolation
    parent: null
    common_fields: true
    fields:
      - { name: lease_id, type: string, source: input, description: "FK -> Lease.id; lease cited" }
      - { name: kind, type: enum, source: input, description: "STREET_PRICING | OPERATING_HOURS" }
      - { name: observed_date, type: string, source: input, description: "ISO date the violation was observed" }
      - { name: shortfall_minutes, type: integer, source: input, description: "OPERATING_HOURS only: minutes the location fell short of required operating hours that day; > 0" }
      - { name: overcharge_cents, type: integer, source: input, description: "STREET_PRICING only: observed price minus street price; > 0" }
      - { name: penalty_cents, type: integer, source: computed, description: "Assessed at creation per calculations.policy_violation_penalty" }
      - { name: status, type: enum, source: system, description: "OPEN | RESOLVED" }

  - name: OperatingHoursWaiver
    parent: null
    common_fields: true
    fields:
      - { name: lease_id, type: string, source: input, description: "FK -> Lease.id; lease requesting a temporary closure window" }
      - { name: closure_start_date, type: string, source: input, description: "ISO date; first closed day (inclusive)" }
      - { name: closure_end_date, type: string, source: input, description: "ISO date; last closed day (inclusive); must be >= closure_start_date" }
      - { name: reason, type: string, source: input, description: "Free-form justification" }
      - { name: status, type: enum, source: system, description: "REQUESTED | APPROVED | REJECTED" }

  - name: EnplanementSnapshot
    parent: null
    common_fields: true
    fields:
      - { name: month, type: string, source: input, description: "YYYY-MM; unique across all snapshots" }
      - { name: enplanements, type: integer, source: input, description: "Enplaned passengers for the month; > 0" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: Lease
    initial_state: DRAFT
    terminal_states: [EXPIRED, REMARKETING]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /concessions/leases/{id}/transition (action=ACTIVATE)"
        actor: AirportAdmin
        preconditions: ["lease.status == DRAFT"]
        side_effects: ["Lease.version increments"]
      - from: ACTIVE
        to: DEFAULTED
        trigger: "POST /concessions/leases/{id}/transition (action=DECLARE_DEFAULT)"
        actor: AirportAdmin
        preconditions: ["lease.status == ACTIVE", "reason is one of NONPAYMENT | HOURS_SHORTFALL | ACDBE_NONCOMPLIANCE | OTHER"]
        side_effects: ["lease.default_reason set to reason", "Lease.version increments"]
      - from: DEFAULTED
        to: ACTIVE
        trigger: "POST /concessions/leases/{id}/transition (action=CURE_DEFAULT)"
        actor: AirportAdmin
        preconditions: ["lease.status == DEFAULTED"]
        side_effects: ["lease.default_reason cleared to null", "Lease.version increments"]
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /concessions/leases/{id}/transition (action=TERMINATE)"
        actor: AirportAdmin
        preconditions: ["lease.status == ACTIVE"]
        side_effects:
          - "Cascade link 1: every TIDraw of this lease in {REQUESTED, APPROVED} -> CANCELLED"
          - "Cascade link 2: lease.ti_remaining_cents recomputed (approved-pending amounts released)"
          - "Cascade link 1 (independent child set): every OperatingHoursWaiver of this lease in {REQUESTED} -> REJECTED"
          - "Lease.version increments"
      - from: DEFAULTED
        to: TERMINATED
        trigger: "POST /concessions/leases/{id}/transition (action=TERMINATE)"
        actor: AirportAdmin
        preconditions: ["lease.status == DEFAULTED"]
        side_effects: ["Same cascades as ACTIVE -> TERMINATED"]
      - from: TERMINATED
        to: REMARKETING
        trigger: "POST /concessions/leases/{id}/transition (action=REMARKET)"
        actor: AirportAdmin
        preconditions: ["lease.status == TERMINATED"]
        side_effects: ["Premises becomes available: this lease no longer participates in the premises term-overlap check", "Lease.version increments"]
      - from: ACTIVE
        to: EXPIRED
        trigger: "System sweep on POST /_clock/set_current_utc when new current date > term_end_date"
        actor: system
        preconditions: ["lease.status == ACTIVE", "current date > term_end_date"]
        side_effects: ["Same child cascades as TERMINATE (draws CANCELLED, waivers REJECTED, ti_remaining recomputed)"]
      - from: DEFAULTED
        to: EXPIRED
        trigger: "System sweep on POST /_clock/set_current_utc when new current date > term_end_date"
        actor: system
        preconditions: ["lease.status == DEFAULTED", "current date > term_end_date"]
        side_effects: ["Same child cascades as TERMINATE"]
    note: "ACTIVE <-> DEFAULTED is a repeatable cycle (default/cure). DRAFT cannot be terminated or expired."

  - entity: SalesReport
    initial_state: DRAFT
    terminal_states: [ADJUSTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /concessions/sales-reports/{id}/transition (action=SUBMIT)"
        actor: Tenant
        preconditions:
          - "report.status == DRAFT"
          - "lease.status == ACTIVE (cross-entity dependency on Lease)"
          - "acting Tenant id == lease.tenant_id"
        side_effects: ["report.submitted_at set to logical clock", "SalesReport.version increments"]
      - from: DISPUTED
        to: SUBMITTED
        trigger: "POST /concessions/sales-reports/{id}/transition (action=SUBMIT)"
        actor: Tenant
        preconditions: ["report.status == DISPUTED", "lease.status == ACTIVE", "acting Tenant id == lease.tenant_id"]
        side_effects: ["report.submitted_at refreshed", "SalesReport.version increments"]
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /concessions/sales-reports/{id}/transition (action=ACCEPT)"
        actor: ConcessionAnalyst
        preconditions: ["report.status == SUBMITTED"]
        side_effects:
          - "If a RentSettlement exists for (lease, year of period_month): settlement recalculated per calculations.annual_rent_settlement with its current variant"
          - "Lease.version increments (updated_at refresh)"
      - from: SUBMITTED
        to: DISPUTED
        trigger: "POST /concessions/sales-reports/{id}/transition (action=DISPUTE)"
        actor: ConcessionAnalyst
        preconditions: ["report.status == SUBMITTED"]
        side_effects: ["SalesReport.version increments"]
      - from: ACCEPTED
        to: ADJUSTED
        trigger: "POST /concessions/audits/{id}/issue-findings referencing this report"
        actor: Auditor
        preconditions: ["report.status == ACCEPTED", "report.lease_id == audit.lease_id", "report.period_month within [audit.period_start_month, audit.period_end_month]"]
        side_effects:
          - "report.restated_gross_sales_cents set to the finding's restated amount"
          - "Cascade link 1: owning RentSettlement recalculated (FINAL variant semantics); if amount_due_cents increases above amount_paid_cents, a PAID settlement reopens to PARTIALLY_PAID"
          - "Cascade link 2: lease.arrears_cents recomputed from settlement balances"
    note: "SUBMITTED -> DISPUTED -> SUBMITTED is a revision loop; tenant edits via PATCH while DRAFT or DISPUTED."

  - entity: RentSettlement
    initial_state: ACCRUING
    terminal_states: [PAID]
    transitions:
      - from: ACCRUING
        to: INVOICED
        trigger: "POST /concessions/settlements/{id}/invoice"
        actor: ConcessionAnalyst
        preconditions: ["settlement.status == ACCRUING", "current date > last day of period_year (year fully elapsed)"]
        side_effects: ["Final recalculation (variant_used := FINAL)", "due_date := current date + 30 days", "lease.arrears_cents recomputed"]
      - from: INVOICED
        to: PARTIALLY_PAID
        trigger: "POST /concessions/settlements/{id}/payments with amount < balance_due_cents"
        actor: Tenant
        preconditions: ["settlement.status == INVOICED"]
        side_effects: ["Payment created POSTED", "amount_paid_cents / balance_due_cents recomputed", "lease.arrears_cents recomputed"]
      - from: INVOICED
        to: PAID
        trigger: "POST /concessions/settlements/{id}/payments with amount == balance_due_cents"
        actor: Tenant
        preconditions: ["settlement.status == INVOICED"]
        side_effects: ["Payment created POSTED", "balances recomputed", "lease.arrears_cents recomputed"]
      - from: PARTIALLY_PAID
        to: PAID
        trigger: "POST /concessions/settlements/{id}/payments with amount == balance_due_cents"
        actor: Tenant
        preconditions: ["settlement.status == PARTIALLY_PAID"]
        side_effects: ["balances recomputed", "lease.arrears_cents recomputed"]
      - from: OVERDUE
        to: PAID
        trigger: "POST /concessions/settlements/{id}/payments with amount == balance_due_cents"
        actor: Tenant
        preconditions: ["settlement.status == OVERDUE"]
        side_effects: ["balances recomputed", "lease.arrears_cents recomputed"]
      - from: OVERDUE
        to: PARTIALLY_PAID
        trigger: "POST /concessions/settlements/{id}/payments with amount < balance_due_cents"
        actor: Tenant
        preconditions: ["settlement.status == OVERDUE"]
        side_effects: ["balances recomputed", "lease.arrears_cents recomputed"]
      - from: INVOICED
        to: OVERDUE
        trigger: "System sweep on POST /_clock/set_current_utc when current date > due_date and balance_due_cents > 0"
        actor: system
        preconditions: ["settlement.status == INVOICED", "current date > due_date", "balance_due_cents > 0"]
        side_effects: ["lease.arrears_cents unchanged in value (still accrued), Lease.updated_at refresh only"]
      - from: PARTIALLY_PAID
        to: OVERDUE
        trigger: "System sweep on POST /_clock/set_current_utc when current date > due_date and balance_due_cents > 0"
        actor: system
        preconditions: ["settlement.status == PARTIALLY_PAID", "current date > due_date", "balance_due_cents > 0"]
        side_effects: []
      - from: PAID
        to: PARTIALLY_PAID
        trigger: "System cascade: audit findings increase amount_due_cents above amount_paid_cents"
        actor: system
        preconditions: ["settlement.status == PAID", "recalculated amount_due_cents > amount_paid_cents"]
        side_effects: ["balance_due_cents recomputed", "lease.arrears_cents recomputed"]
    note: "Voiding a Payment re-derives status: paid==0 -> INVOICED; 0<paid<due -> PARTIALLY_PAID. OVERDUE is re-applied only by the next clock sweep, never directly by a void."

  - entity: Payment
    initial_state: POSTED
    terminal_states: [VOIDED]
    transitions:
      - from: POSTED
        to: VOIDED
        trigger: "POST /concessions/payments/{id}/void"
        actor: ConcessionAnalyst
        preconditions: ["payment.status == POSTED"]
        side_effects:
          - "settlement.amount_paid_cents decremented by amount_cents; balance_due_cents recomputed"
          - "settlement status re-derived (INVOICED if no POSTED payments remain, else PARTIALLY_PAID)"
          - "lease.arrears_cents recomputed"

  - entity: AuditCase
    initial_state: OPENED
    terminal_states: [CLOSED]
    transitions:
      - from: OPENED
        to: FINDINGS_ISSUED
        trigger: "POST /concessions/audits/{id}/issue-findings"
        actor: Auditor
        preconditions: ["audit.status == OPENED", "every finding references an ACCEPTED report of audit.lease_id within the audit window"]
        side_effects:
          - "Each referenced report -> ADJUSTED with restated_gross_sales_cents (see SalesReport machine)"
          - "audit.understatement_cents computed"
          - "Cascade: settlement recalculation -> possible PAID->PARTIALLY_PAID reopen -> lease.arrears_cents recompute"
      - from: OPENED
        to: CLOSED
        trigger: "POST /concessions/audits/{id}/close"
        actor: Auditor
        preconditions: ["audit.status == OPENED"]
        side_effects: []
      - from: FINDINGS_ISSUED
        to: CLOSED
        trigger: "POST /concessions/audits/{id}/close"
        actor: Auditor
        preconditions: ["audit.status == FINDINGS_ISSUED"]
        side_effects: []

  - entity: ACDBEReview
    initial_state: SCHEDULED
    terminal_states: [COMPLIANT, CURED]
    transitions:
      - from: SCHEDULED
        to: COMPLIANT
        trigger: "POST /concessions/acdbe-reviews/{id}/evaluate"
        actor: ConcessionAnalyst
        preconditions: ["review.status == SCHEDULED", "attainment_bp >= lease.acdbe_goal_bp"]
        side_effects: ["total_gross_cents and attainment_bp computed and stored"]
      - from: SCHEDULED
        to: DEFICIENT
        trigger: "POST /concessions/acdbe-reviews/{id}/evaluate"
        actor: ConcessionAnalyst
        preconditions: ["review.status == SCHEDULED", "attainment_bp < lease.acdbe_goal_bp OR total_gross_cents == 0"]
        side_effects: ["total_gross_cents and attainment_bp computed and stored (attainment_bp 0 when total is 0)"]
      - from: DEFICIENT
        to: CURED
        trigger: "POST /concessions/acdbe-reviews/{id}/cure"
        actor: Tenant
        preconditions: ["review.status == DEFICIENT", "acting Tenant id == lease.tenant_id", "round_half_up((certified_revenue_cents + cure_additional_certified_cents) * 10000 / total_gross_cents) >= lease.acdbe_goal_bp"]
        side_effects: ["attainment_bp recomputed including cure amount", "lease.default_reason unchanged (cure does not clear a declared default)"]

  - entity: TIDraw
    initial_state: REQUESTED
    terminal_states: [REJECTED, DISBURSED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /concessions/ti-draws/{id}/transition (action=APPROVE)"
        actor: AirportAdmin
        preconditions: ["draw.status == REQUESTED", "lease.status == ACTIVE (cross-entity dependency on Lease)", "current date <= lease.buildout_deadline"]
        side_effects: ["lease.ti_remaining_cents recomputed (approved-pending reserve)"]
      - from: REQUESTED
        to: REJECTED
        trigger: "POST /concessions/ti-draws/{id}/transition (action=REJECT)"
        actor: AirportAdmin
        preconditions: ["draw.status == REQUESTED"]
        side_effects: []
      - from: APPROVED
        to: DISBURSED
        trigger: "POST /concessions/ti-draws/{id}/transition (action=DISBURSE)"
        actor: AirportAdmin
        preconditions: ["draw.status == APPROVED"]
        side_effects: ["lease.ti_remaining_cents recomputed (reserve converts to disbursed)"]
      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /concessions/ti-draws/{id}/transition (action=CANCEL)"
        actor: Tenant
        preconditions: ["draw.status == REQUESTED", "acting Tenant id == lease.tenant_id"]
        side_effects: []
      - from: APPROVED
        to: CANCELLED
        trigger: "POST /concessions/ti-draws/{id}/transition (action=CANCEL)"
        actor: Tenant
        preconditions: ["draw.status == APPROVED", "acting Tenant id == lease.tenant_id"]
        side_effects: ["Compensation: lease.ti_remaining_cents recomputed (reserve released)"]
      - from: REQUESTED
        to: CANCELLED
        trigger: "System cascade: parent lease TERMINATED or EXPIRED"
        actor: system
        preconditions: ["draw.status == REQUESTED"]
        side_effects: []
      - from: APPROVED
        to: CANCELLED
        trigger: "System cascade: parent lease TERMINATED or EXPIRED"
        actor: system
        preconditions: ["draw.status == APPROVED"]
        side_effects: ["lease.ti_remaining_cents recomputed"]

  - entity: PolicyViolation
    initial_state: OPEN
    terminal_states: [RESOLVED]
    transitions:
      - from: OPEN
        to: RESOLVED
        trigger: "POST /concessions/violations/{id}/resolve"
        actor: ConcessionAnalyst
        preconditions: ["violation.status == OPEN"]
        side_effects: []

  - entity: OperatingHoursWaiver
    initial_state: REQUESTED
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /concessions/waivers/{id}/transition (action=APPROVE)"
        actor: AirportAdmin
        preconditions: ["waiver.status == REQUESTED", "buffer rule satisfied against all other APPROVED waivers of the same lease (see validations)"]
        side_effects: []
      - from: REQUESTED
        to: REJECTED
        trigger: "POST /concessions/waivers/{id}/transition (action=REJECT)"
        actor: AirportAdmin
        preconditions: ["waiver.status == REQUESTED"]
        side_effects: []
      - from: REQUESTED
        to: REJECTED
        trigger: "System cascade: parent lease TERMINATED or EXPIRED"
        actor: system
        preconditions: ["waiver.status == REQUESTED"]
        side_effects: []

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: lease-patch-stale-version
    parent_entity: Lease
    write_endpoint: "PATCH /concessions/leases/{id}"
    occ_field: expected_lease_version
    description: |
      Amending lease terms with an expected_lease_version that no longer matches
      Lease.version is rejected: another writer has amended the lease since the
      caller last observed it, and term edits must be based on the current terms.
      Stated purely as an OCC stale-version check on the parent entity's version.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: monthly_percentage_rent
    trigger: "SalesReport -> ACCEPTED (and again on audit restatement via the settlement recalculation)"
    algorithm: tiered_pricing
    formula: |
      gross = effective_gross(report)   # ADJUSTED -> restated_gross_sales_cents, else gross_sales_cents
      bp    = lease.pct_breakpoint_cents
      if gross <= bp:   pct = gross * lease.pct_rate_below_bp / 10000
      else:             pct = bp * lease.pct_rate_below_bp / 10000
                            + (gross - bp) * lease.pct_rate_above_bp / 10000
      return round_half_up(pct)   # integer cents; each month rounded ONCE, here
    input_set: "One SalesReport of the lease. Boundary: gross == pct_breakpoint_cents stays in tier 1 (<=)."
    constants: {}
    precision: "integer cents, round_half_up, rounding applied per monthly report BEFORE any annual aggregation"

  - name: annual_rent_settlement
    trigger: "POST /concessions/settlements/{id}/recalculate; POST /concessions/settlements/{id}/invoice; cascade on SalesReport ACCEPTED / audit restatement"
    algorithm: aggregation
    formula: |
      # --- MAG proration over the lease-term portion of period_year ---
      weight = 0
      for each calendar month m of period_year:
        days_covered = days of m intersecting [lease.term_start_date, lease.term_end_date)
        if days_covered == 0: continue
        if days_covered == days_in(m): weight += 1
        else: weight += round(days_covered / days_in(m), 4)   # 4-decimal proration
      mag_due_cents = round_half_up(lease.mag_annual_cents * weight / 12)

      # --- Percentage rent: variant-dependent input set ---
      if variant == PROVISIONAL:   # settlement ACCRUING
        pct_sum = sum over months m of period_year:
          if an ACCEPTED or ADJUSTED report exists for m: monthly_percentage_rent(that report)
          else: round_half_up(lease.mag_annual_cents / 12)   # unreported months projected at guarantee
      if variant == FINAL:         # settlement INVOICED or later
        pct_sum = sum over ACCEPTED/ADJUSTED reports in period_year of monthly_percentage_rent(report)
        # unreported months contribute 0
      percentage_due_cents = pct_sum     # per-month values already rounded; sum without re-rounding
      true_up_due_cents    = max(0, percentage_due_cents - mag_due_cents)
      amount_due_cents     = mag_due_cents + true_up_due_cents
      amount_paid_cents    = sum of POSTED Payment.amount_cents for this settlement
      balance_due_cents    = amount_due_cents - amount_paid_cents
    input_set: "Reports of the lease in period_year with status ACCEPTED (use gross_sales_cents) or ADJUSTED (use restated_gross_sales_cents); DRAFT/SUBMITTED/DISPUTED excluded"
    constants:
      MONTHS_PER_YEAR: 12
      SETTLEMENT_DUE_DAYS: 30
    precision: "integer cents, round_half_up; per-month rounding first, then sum (order pinned — never sum-then-round)"
    variants:
      - name: PROVISIONAL
        when: "settlement.status == ACCRUING (mid-year recalculation)"
        difference: "months without an ACCEPTED/ADJUSTED report are projected at MAG/12, so amount_due reflects expected full-year exposure"
      - name: FINAL
        when: "settlement.status in {INVOICED, PARTIALLY_PAID, OVERDUE, PAID} (invoice and any later recalculation)"
        difference: "only ACCEPTED/ADJUSTED reports count; unreported months contribute 0 percentage rent"

  - name: sales_per_enplanement
    trigger: "GET /concessions/leases/{id}/performance"
    algorithm: aggregation
    formula: |
      effective_sales(m)  = monthly effective gross (ACCEPTED gross / ADJUSTED restated) for month m, else absent
      enplanements(m)     = EnplanementSnapshot.enplanements for month m, else absent
      window months count only when BOTH effective_sales(m) and enplanements(m) exist
      TTM window = the 12 calendar months ending at the latest month having an ACCEPTED/ADJUSTED report
      YTD window = months of the logical clock's calendar year up to and including the current month
      spe_ttm_cents = round_half_up(sum sales_ttm * 100 / sum enplanements_ttm)
      spe_ytd_cents = round_half_up(sum sales_ytd * 100 / sum enplanements_ytd)
      if a window has zero qualifying months: its SPE is null
      review_outcome = INSUFFICIENT_DATA if spe_ttm_cents is null
                       else UNDERPERFORMING if spe_ttm_cents < lease.min_spe_cents
                       else SATISFACTORY          # >= boundary is satisfactory
    input_set: "ACCEPTED/ADJUSTED SalesReports of the lease and EnplanementSnapshots; months missing either side are excluded from BOTH numerator and denominator"
    constants: {}
    precision: "integer cents per enplanement, round_half_up"
    variants:
      - name: TTM
        when: "always computed"
        difference: "trailing-12-month window anchored at the latest reported month"
      - name: YTD
        when: "always computed"
        difference: "calendar-year-to-date window anchored at the logical clock; same data can yield a different SPE than TTM"

  - name: acdbe_attainment
    trigger: "POST /concessions/acdbe-reviews/{id}/evaluate; POST /concessions/acdbe-reviews/{id}/cure"
    algorithm: threshold
    formula: |
      total_gross_cents = sum of effective gross over the lease's ACCEPTED/ADJUSTED reports in period_year
      numerator = certified_revenue_cents (+ cure_additional_certified_cents on cure)
      if total_gross_cents == 0: attainment_bp = 0 and result = DEFICIENT
      else: attainment_bp = round_half_up(numerator * 10000 / total_gross_cents)
      result = COMPLIANT if attainment_bp >= lease.acdbe_goal_bp else DEFICIENT   # == goal attains
    input_set: "ACCEPTED/ADJUSTED reports of the lease in period_year only"
    constants: {}
    precision: "basis points, integer, round_half_up"

  - name: policy_violation_penalty
    trigger: "POST /concessions/violations (computed once at creation)"
    algorithm: threshold
    formula: |
      if kind == OPERATING_HOURS:
        penalty_cents = ceil(shortfall_minutes / 60) * HOURS_PENALTY_PER_HOUR_CENTS
      if kind == STREET_PRICING:
        penalty_cents = max(PRICING_MIN_PENALTY_CENTS, PRICING_OVERCHARGE_MULTIPLIER * overcharge_cents)
      # Aggregation rule (pinned): monthly exposure sums PER-VIOLATION penalties;
      # never sum shortfall minutes across events and convert once.
    input_set: "The single violation being created"
    constants:
      HOURS_PENALTY_PER_HOUR_CENTS: 25000
      PRICING_MIN_PENALTY_CENTS: 5000
      PRICING_OVERCHARGE_MULTIPLIER: 2
    precision: "integer cents; ceil applied per violation event"

  - name: ti_allowance_reconciliation
    trigger: "TIDraw create / APPROVE / DISBURSE / CANCEL / REJECT; lease TERMINATE / EXPIRE cascade"
    algorithm: aggregation
    formula: |
      ti_remaining_cents = lease.ti_allowance_cents
                         - sum(amount_cents of DISBURSED draws)
                         - sum(amount_cents of APPROVED draws)
    input_set: "All TIDraws of the lease; REQUESTED/REJECTED/CANCELLED contribute 0"
    constants: {}
    precision: "integer cents"

  - name: arrears_reconciliation
    trigger: "Settlement invoice / recalculate / payment / void; audit cascade; clock sweep to OVERDUE"
    algorithm: aggregation
    formula: |
      lease.arrears_cents = sum of balance_due_cents over the lease's settlements
                            with status in {INVOICED, PARTIALLY_PAID, OVERDUE}
    input_set: "RentSettlements of the lease in {INVOICED, PARTIALLY_PAID, OVERDUE}; ACCRUING and PAID contribute 0"
    constants: {}
    precision: "integer cents"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present and role is a declared role", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "Acting role is in the endpoint's role list; for Tenant-scoped writes, X-User-ID must equal the owning lease's tenant_id", error_id: ERR_FORBIDDEN, http_status: 403, applies_to: "all" }
  - { priority: 3, category: existence, check: "Path ids and body FK references exist, validated left-to-right", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all" }
  - { priority: 4, category: existence, check: "Required request fields present and well-typed", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all" }
  - { priority: 5, category: existence, check: "Enum fields carry a declared enum member", error_id: ERR_INVALID_ENUM, http_status: 400, applies_to: "all" }
  - { priority: 6, category: state, check: "Cross-entity active check: sales-report SUBMIT, TI-draw create, violation create, waiver create require lease.status == ACTIVE", error_id: ERR_LEASE_NOT_ACTIVE, http_status: 409, applies_to: "POST /concessions/sales-reports/{id}/transition (SUBMIT); POST /concessions/ti-draws; POST /concessions/violations; POST /concessions/waivers" }
  - { priority: 7, category: state, check: "Lease transition action valid from current status per Lease machine", error_id: ERR_LEASE_STATE_FORBIDS, http_status: 409, applies_to: "POST /concessions/leases/{id}/transition; PATCH /concessions/leases/{id} (PATCH allowed only in DRAFT)" }
  - { priority: 8, category: state, check: "Report action valid from current status (SUBMIT from DRAFT/DISPUTED; ACCEPT/DISPUTE from SUBMITTED; PATCH from DRAFT/DISPUTED)", error_id: ERR_REPORT_NOT_SUBMITTABLE, http_status: 409, applies_to: "POST /concessions/sales-reports/{id}/transition (action=SUBMIT)" }
  - { priority: 9, category: state, check: "Report editable only in DRAFT or DISPUTED", error_id: ERR_REPORT_NOT_EDITABLE, http_status: 409, applies_to: "PATCH /concessions/sales-reports/{id}" }
  - { priority: 10, category: state, check: "ACCEPT/DISPUTE only from SUBMITTED", error_id: ERR_REPORT_NOT_REVIEWABLE, http_status: 409, applies_to: "POST /concessions/sales-reports/{id}/transition (ACCEPT, DISPUTE)" }
  - { priority: 11, category: state, check: "Payment only on settlement in {INVOICED, PARTIALLY_PAID, OVERDUE}", error_id: ERR_SETTLEMENT_NOT_PAYABLE, http_status: 409, applies_to: "POST /concessions/settlements/{id}/payments" }
  - { priority: 12, category: state, check: "Invoice only from ACCRUING", error_id: ERR_SETTLEMENT_NOT_INVOICABLE, http_status: 409, applies_to: "POST /concessions/settlements/{id}/invoice" }
  - { priority: 13, category: state, check: "Recalculate only from {ACCRUING, INVOICED, PARTIALLY_PAID, OVERDUE} (manual recalc of PAID is forbidden; audit cascade reopens instead)", error_id: ERR_SETTLEMENT_STATE_FORBIDS, http_status: 409, applies_to: "POST /concessions/settlements/{id}/recalculate" }
  - { priority: 14, category: state, check: "Void only a POSTED payment", error_id: ERR_PAYMENT_ALREADY_VOIDED, http_status: 409, applies_to: "POST /concessions/payments/{id}/void" }
  - { priority: 15, category: state, check: "TI draw action valid from current status per TIDraw machine", error_id: ERR_DRAW_STATE_FORBIDS, http_status: 409, applies_to: "POST /concessions/ti-draws/{id}/transition" }
  - { priority: 16, category: state, check: "Waiver action valid from REQUESTED", error_id: ERR_WAIVER_STATE_FORBIDS, http_status: 409, applies_to: "POST /concessions/waivers/{id}/transition" }
  - { priority: 17, category: state, check: "Audit action valid from current status per AuditCase machine", error_id: ERR_AUDIT_STATE_FORBIDS, http_status: 409, applies_to: "POST /concessions/audits/{id}/issue-findings; POST /concessions/audits/{id}/close" }
  - { priority: 18, category: state, check: "Every finding references a report with status ACCEPTED belonging to the audit's lease and window", error_id: ERR_AUDIT_FINDING_REPORT_STATE, http_status: 409, applies_to: "POST /concessions/audits/{id}/issue-findings" }
  - { priority: 19, category: state, check: "ACDBE evaluate only from SCHEDULED; cure only from DEFICIENT", error_id: ERR_REVIEW_STATE_FORBIDS, http_status: 409, applies_to: "POST /concessions/acdbe-reviews/{id}/evaluate; POST /concessions/acdbe-reviews/{id}/cure" }
  - { priority: 20, category: state, check: "Resolve only an OPEN violation", error_id: ERR_VIOLATION_ALREADY_RESOLVED, http_status: 409, applies_to: "POST /concessions/violations/{id}/resolve" }
  - { priority: 21, category: business_constraint, check: "Premises occupation: no two leases with status in {DRAFT, ACTIVE, DEFAULTED} may share premises_code with overlapping half-open terms [term_start_date, term_end_date); adjacency (start == other end) is allowed", error_id: ERR_PREMISES_TERM_OVERLAP, http_status: 409, applies_to: "POST /concessions/leases" }
  - { priority: 22, category: business_constraint, check: "One SalesReport per (lease_id, period_month) among statuses {DRAFT, SUBMITTED, ACCEPTED, ADJUSTED}", error_id: ERR_REPORT_PERIOD_DUPLICATE, http_status: 409, applies_to: "POST /concessions/sales-reports" }
  - { priority: 23, category: business_constraint, check: "One RentSettlement per (lease_id, period_year)", error_id: ERR_SETTLEMENT_YEAR_DUPLICATE, http_status: 409, applies_to: "POST /concessions/settlements" }
  - { priority: 24, category: business_constraint, check: "EnplanementSnapshot.month unique", error_id: ERR_ENPLANEMENT_MONTH_DUPLICATE, http_status: 409, applies_to: "POST /concessions/enplanement-snapshots" }
  - { priority: 25, category: business_temporal, check: "TI draw create requires current date <= lease.buildout_deadline", error_id: ERR_BUILDOUT_WINDOW_CLOSED, http_status: 422, applies_to: "POST /concessions/ti-draws" }
  - { priority: 26, category: business_temporal, check: "Waiver APPROVE buffer: for every other APPROVED waiver of the same lease, gap between windows must be >= 14 days in either direction (gap = days between one window's end and the other's start; overlapping windows have negative gap)", error_id: ERR_WAIVER_BUFFER_VIOLATION, http_status: 409, applies_to: "POST /concessions/waivers/{id}/transition (action=APPROVE)" }
  - { priority: 27, category: business_temporal, check: "Date ranges coherent: term_start_date < term_end_date; closure_start_date <= closure_end_date; audit period_start_month <= period_end_month", error_id: ERR_INVALID_DATE_RANGE, http_status: 422, applies_to: "POST /concessions/leases; POST /concessions/waivers; POST /concessions/audits" }
  - { priority: 28, category: business_temporal, check: "SalesReport period_month must not be after the logical clock's current month", error_id: ERR_REPORT_PERIOD_FUTURE, http_status: 422, applies_to: "POST /concessions/sales-reports" }
  - { priority: 29, category: business_temporal, check: "Settlement invoice requires current date > last day of period_year", error_id: ERR_SETTLEMENT_PERIOD_OPEN, http_status: 422, applies_to: "POST /concessions/settlements/{id}/invoice" }
  - { priority: 30, category: business_fiscal, check: "Amounts non-negative/positive as declared: gross_sales_cents >= 0; payment amount_cents > 0; draw amount_cents > 0; overcharge_cents > 0; shortfall_minutes > 0; enplanements > 0", error_id: ERR_INVALID_AMOUNT, http_status: 422, applies_to: "POST /concessions/sales-reports; PATCH /concessions/sales-reports/{id}; POST /concessions/settlements/{id}/payments; POST /concessions/ti-draws; POST /concessions/violations; POST /concessions/enplanement-snapshots" }
  - { priority: 31, category: business_fiscal, check: "Payment amount_cents <= settlement.balance_due_cents", error_id: ERR_PAYMENT_EXCEEDS_BALANCE, http_status: 422, applies_to: "POST /concessions/settlements/{id}/payments" }
  - { priority: 32, category: business_fiscal, check: "TI draw amount_cents <= lease.ti_remaining_cents at creation", error_id: ERR_TI_ALLOWANCE_EXCEEDED, http_status: 422, applies_to: "POST /concessions/ti-draws" }
  - { priority: 33, category: business_fiscal, check: "ACDBE cure: recomputed attainment including cure amount must be >= goal", error_id: ERR_CURE_INSUFFICIENT, http_status: 422, applies_to: "POST /concessions/acdbe-reviews/{id}/cure" }
  - { priority: 34, category: business_constraint, check: "OCC: expected_lease_version must equal current Lease.version", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "PATCH /concessions/leases/{id}" }

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  # --- tenants ---
  - { method: POST, path: "/concessions/tenants", description: "Register a concessionaire", roles: [AirportAdmin], code: 201, input: [legal_name, contact_email, "acdbe_certified?"], output: Tenant, side_effects: [] }
  - { method: GET, path: "/concessions/tenants", description: "List tenants (paginated)", roles: [AirportAdmin, ConcessionAnalyst], code: 200, input: ["limit?", "offset?"], output: "Tenant[]", side_effects: [] }
  - { method: GET, path: "/concessions/tenants/{id}", description: "Get one tenant", roles: [AirportAdmin, ConcessionAnalyst, Tenant], code: 200, input: [], output: Tenant, side_effects: [] }

  # --- leases ---
  - { method: POST, path: "/concessions/leases", description: "Create a concession lease (DRAFT); premises term-overlap check applies", roles: [AirportAdmin], code: 201, input: [tenant_id, premises_code, category, term_start_date, term_end_date, mag_annual_cents, pct_rate_below_bp, pct_breakpoint_cents, pct_rate_above_bp, acdbe_goal_bp, ti_allowance_cents, buildout_deadline, min_spe_cents], output: Lease, side_effects: ["status DRAFT", "arrears_cents 0", "ti_remaining_cents = ti_allowance_cents"] }
  - { method: GET, path: "/concessions/leases", description: "List leases with optional filters", roles: [AirportAdmin, ConcessionAnalyst, Tenant, Auditor], code: 200, input: ["tenant_id?", "premises_code?", "status?", "limit?", "offset?"], output: "Lease[]", side_effects: [] }
  - { method: GET, path: "/concessions/leases/{id}", description: "Get one lease including computed arrears_cents and ti_remaining_cents", roles: [AirportAdmin, ConcessionAnalyst, Tenant, Auditor], code: 200, input: [], output: Lease, side_effects: [] }
  - { method: PATCH, path: "/concessions/leases/{id}", description: "Amend lease economics (DRAFT only) with OCC on Lease.version", roles: [AirportAdmin], code: 200, input: [expected_lease_version, "mag_annual_cents?", "pct_rate_below_bp?", "pct_breakpoint_cents?", "pct_rate_above_bp?", "acdbe_goal_bp?", "ti_allowance_cents?", "buildout_deadline?", "min_spe_cents?"], output: Lease, side_effects: ["increments Lease.version by 1"] }
  - { method: POST, path: "/concessions/leases/{id}/transition", description: "Lease lifecycle action: ACTIVATE | DECLARE_DEFAULT | CURE_DEFAULT | TERMINATE | REMARKET", roles: [AirportAdmin], code: 200, input: [action, "reason?"], output: Lease, side_effects: ["state change per Lease machine incl. termination cascades", "increments Lease.version by 1"] }
  - { method: GET, path: "/concessions/leases/{id}/performance", description: "Sales-per-enplanement review read (TTM + YTD)", roles: [AirportAdmin, ConcessionAnalyst, Tenant], code: 200, input: [], output: "{ spe_ttm_cents: integer|null, spe_ytd_cents: integer|null, sales_ttm_cents: integer, enplanements_ttm: integer, review_outcome: string }", side_effects: [] }

  # --- sales reports ---
  - { method: POST, path: "/concessions/sales-reports", description: "Tenant files a monthly gross-sales report (DRAFT)", roles: [Tenant], code: 201, input: [lease_id, period_month, gross_sales_cents], output: SalesReport, side_effects: ["status DRAFT"] }
  - { method: GET, path: "/concessions/sales-reports", description: "List sales reports with optional filters", roles: [AirportAdmin, ConcessionAnalyst, Tenant, Auditor], code: 200, input: ["lease_id?", "status?", "period_month?", "limit?", "offset?"], output: "SalesReport[]", side_effects: [] }
  - { method: GET, path: "/concessions/sales-reports/{id}", description: "Get one sales report", roles: [AirportAdmin, ConcessionAnalyst, Tenant, Auditor], code: 200, input: [], output: SalesReport, side_effects: [] }
  - { method: PATCH, path: "/concessions/sales-reports/{id}", description: "Revise gross sales while DRAFT or DISPUTED", roles: [Tenant], code: 200, input: [gross_sales_cents], output: SalesReport, side_effects: ["increments SalesReport.version by 1"] }
  - { method: POST, path: "/concessions/sales-reports/{id}/transition", description: "Report lifecycle action: SUBMIT (Tenant) | ACCEPT | DISPUTE (ConcessionAnalyst)", roles: [Tenant, ConcessionAnalyst], code: 200, input: [action, "note?"], output: SalesReport, side_effects: ["state change per SalesReport machine", "on ACCEPT: settlement recalculation cascade", "increments SalesReport.version by 1"] }

  # --- rent settlements ---
  - { method: POST, path: "/concessions/settlements", description: "Open the annual settlement for (lease, period_year) (ACCRUING)", roles: [AirportAdmin], code: 201, input: [lease_id, period_year], output: RentSettlement, side_effects: ["initial PROVISIONAL calculation"] }
  - { method: GET, path: "/concessions/settlements", description: "List settlements with optional filters", roles: [AirportAdmin, ConcessionAnalyst, Tenant], code: 200, input: ["lease_id?", "status?", "limit?", "offset?"], output: "RentSettlement[]", side_effects: [] }
  - { method: GET, path: "/concessions/settlements/{id}", description: "Get one settlement", roles: [AirportAdmin, ConcessionAnalyst, Tenant], code: 200, input: [], output: RentSettlement, side_effects: [] }
  - { method: POST, path: "/concessions/settlements/{id}/recalculate", description: "Recompute MAG/percentage/true-up with the variant implied by current status", roles: [ConcessionAnalyst], code: 200, input: [], output: RentSettlement, side_effects: ["recalculates per calculations.annual_rent_settlement", "lease.arrears_cents recomputed"] }
  - { method: POST, path: "/concessions/settlements/{id}/invoice", description: "Close the year: FINAL recalculation, due_date = current date + 30 days, status INVOICED", roles: [ConcessionAnalyst], code: 200, input: [], output: RentSettlement, side_effects: ["FINAL recalculation", "due_date set", "lease.arrears_cents recomputed"] }
  - { method: POST, path: "/concessions/settlements/{id}/payments", description: "Tenant posts a payment against the settlement", roles: [Tenant], code: 201, input: [amount_cents, method], output: Payment, side_effects: ["settlement balances recomputed", "settlement status per machine", "lease.arrears_cents recomputed"] }
  - { method: GET, path: "/concessions/settlements/{id}/payments", description: "List payments of a settlement", roles: [AirportAdmin, ConcessionAnalyst, Tenant], code: 200, input: ["limit?", "offset?"], output: "Payment[]", side_effects: [] }
  - { method: POST, path: "/concessions/payments/{id}/void", description: "Void a POSTED payment (compensating action)", roles: [ConcessionAnalyst], code: 200, input: [], output: Payment, side_effects: ["settlement balances and status re-derived", "lease.arrears_cents recomputed"] }

  # --- audits ---
  - { method: POST, path: "/concessions/audits", description: "Open an audit case on a lease for a month window (OPENED)", roles: [Auditor], code: 201, input: [lease_id, period_start_month, period_end_month], output: AuditCase, side_effects: [] }
  - { method: GET, path: "/concessions/audits", description: "List audit cases with optional filters", roles: [AirportAdmin, ConcessionAnalyst, Auditor], code: 200, input: ["lease_id?", "status?", "limit?", "offset?"], output: "AuditCase[]", side_effects: [] }
  - { method: GET, path: "/concessions/audits/{id}", description: "Get one audit case", roles: [AirportAdmin, ConcessionAnalyst, Auditor], code: 200, input: [], output: AuditCase, side_effects: [] }
  - { method: POST, path: "/concessions/audits/{id}/issue-findings", description: "Issue findings: restate ACCEPTED reports, triggering settlement and arrears cascades", roles: [Auditor], code: 200, input: [findings], output: AuditCase, side_effects: ["referenced reports -> ADJUSTED with restated amounts", "settlement recalculation cascade", "lease.arrears_cents recomputed", "understatement_cents computed"] }
  - { method: POST, path: "/concessions/audits/{id}/close", description: "Close an audit case", roles: [Auditor], code: 200, input: [], output: AuditCase, side_effects: [] }

  # --- ACDBE reviews ---
  - { method: POST, path: "/concessions/acdbe-reviews", description: "Schedule an annual ACDBE participation review", roles: [ConcessionAnalyst], code: 201, input: [lease_id, period_year], output: ACDBEReview, side_effects: ["status SCHEDULED"] }
  - { method: GET, path: "/concessions/acdbe-reviews", description: "List ACDBE reviews with optional filters", roles: [AirportAdmin, ConcessionAnalyst, Tenant], code: 200, input: ["lease_id?", "status?", "limit?", "offset?"], output: "ACDBEReview[]", side_effects: [] }
  - { method: GET, path: "/concessions/acdbe-reviews/{id}", description: "Get one ACDBE review", roles: [AirportAdmin, ConcessionAnalyst, Tenant], code: 200, input: [], output: ACDBEReview, side_effects: [] }
  - { method: POST, path: "/concessions/acdbe-reviews/{id}/evaluate", description: "Score participation: COMPLIANT if attainment >= goal else DEFICIENT", roles: [ConcessionAnalyst], code: 200, input: [certified_revenue_cents], output: ACDBEReview, side_effects: ["total_gross_cents and attainment_bp computed", "status per threshold"] }
  - { method: POST, path: "/concessions/acdbe-reviews/{id}/cure", description: "Tenant submits cure evidence (additional certified revenue)", roles: [Tenant], code: 200, input: [cure_additional_certified_cents], output: ACDBEReview, side_effects: ["attainment_bp recomputed", "status CURED on success"] }

  # --- TI draws ---
  - { method: POST, path: "/concessions/ti-draws", description: "Tenant requests a buildout draw against the TI allowance", roles: [Tenant], code: 201, input: [lease_id, amount_cents, milestone], output: TIDraw, side_effects: ["status REQUESTED"] }
  - { method: GET, path: "/concessions/ti-draws", description: "List TI draws with optional filters", roles: [AirportAdmin, ConcessionAnalyst, Tenant], code: 200, input: ["lease_id?", "status?", "limit?", "offset?"], output: "TIDraw[]", side_effects: [] }
  - { method: GET, path: "/concessions/ti-draws/{id}", description: "Get one TI draw", roles: [AirportAdmin, ConcessionAnalyst, Tenant], code: 200, input: [], output: TIDraw, side_effects: [] }
  - { method: POST, path: "/concessions/ti-draws/{id}/transition", description: "Draw lifecycle action: APPROVE | REJECT | DISBURSE (AirportAdmin); CANCEL (Tenant)", roles: [AirportAdmin, Tenant], code: 200, input: [action], output: TIDraw, side_effects: ["state change per TIDraw machine", "lease.ti_remaining_cents recomputed on APPROVE/DISBURSE/CANCEL"] }

  # --- policy violations ---
  - { method: POST, path: "/concessions/violations", description: "Record a street-pricing or operating-hours violation; penalty assessed at creation", roles: [ConcessionAnalyst], code: 201, input: [lease_id, kind, observed_date, "shortfall_minutes?", "overcharge_cents?"], output: PolicyViolation, side_effects: ["penalty_cents computed per calculations.policy_violation_penalty", "status OPEN"] }
  - { method: GET, path: "/concessions/violations", description: "List violations with optional filters", roles: [AirportAdmin, ConcessionAnalyst, Tenant], code: 200, input: ["lease_id?", "kind?", "status?", "limit?", "offset?"], output: "PolicyViolation[]", side_effects: [] }
  - { method: GET, path: "/concessions/violations/{id}", description: "Get one violation", roles: [AirportAdmin, ConcessionAnalyst, Tenant], code: 200, input: [], output: PolicyViolation, side_effects: [] }
  - { method: POST, path: "/concessions/violations/{id}/resolve", description: "Resolve an OPEN violation", roles: [ConcessionAnalyst], code: 200, input: [], output: PolicyViolation, side_effects: [] }

  # --- operating-hours waivers ---
  - { method: POST, path: "/concessions/waivers", description: "Tenant requests a temporary closure window", roles: [Tenant], code: 201, input: [lease_id, closure_start_date, closure_end_date, reason], output: OperatingHoursWaiver, side_effects: ["status REQUESTED"] }
  - { method: GET, path: "/concessions/waivers", description: "List waivers with optional filters", roles: [AirportAdmin, ConcessionAnalyst, Tenant], code: 200, input: ["lease_id?", "status?", "limit?", "offset?"], output: "OperatingHoursWaiver[]", side_effects: [] }
  - { method: GET, path: "/concessions/waivers/{id}", description: "Get one waiver", roles: [AirportAdmin, ConcessionAnalyst, Tenant], code: 200, input: [], output: OperatingHoursWaiver, side_effects: [] }
  - { method: POST, path: "/concessions/waivers/{id}/transition", description: "Waiver decision: APPROVE (with 14-day buffer check) | REJECT", roles: [AirportAdmin], code: 200, input: [action], output: OperatingHoursWaiver, side_effects: ["state change per OperatingHoursWaiver machine"] }

  # --- enplanements ---
  - { method: POST, path: "/concessions/enplanement-snapshots", description: "Publish monthly enplanement count (month unique)", roles: [AirportAdmin], code: 201, input: [month, enplanements], output: EnplanementSnapshot, side_effects: [] }
  - { method: GET, path: "/concessions/enplanement-snapshots", description: "List enplanement snapshots", roles: [AirportAdmin, ConcessionAnalyst, Tenant], code: 200, input: ["limit?", "offset?"], output: "EnplanementSnapshot[]", side_effects: [] }

  # --- logical clock (test-driving endpoint) ---
  - { method: POST, path: "/_clock/set_current_utc", description: "Set the logical clock. Startup default is exactly 2026-08-01T00:00:00Z and never falls back to wall-clock. Side effects: lease expiry sweep and settlement OVERDUE sweep run against the new time.", roles: [AirportAdmin], code: 200, input: [to_iso8601], output: "{ current_utc: string }", side_effects: ["Lease sweep: ACTIVE/DEFAULTED with term_end_date < current date -> EXPIRED (+child cascades)", "Settlement sweep: INVOICED/PARTIALLY_PAID with due_date < current date and balance > 0 -> OVERDUE"] }

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or unknown X-User-Role / X-User-ID headers" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted on endpoint, or Tenant acting on a resource owned by another tenant" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or referenced FK does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Required field missing or malformed" }
  - { id: ERR_INVALID_ENUM, http: 400, condition: "Enum field carries an undeclared member" }
  - { id: ERR_LEASE_NOT_ACTIVE, http: 409, condition: "Operation requires the referenced lease to be ACTIVE" }
  - { id: ERR_LEASE_STATE_FORBIDS, http: 409, condition: "Lease transition/PATCH not valid from current lease status" }
  - { id: ERR_REPORT_NOT_SUBMITTABLE, http: 409, condition: "SUBMIT attempted from a status other than DRAFT/DISPUTED" }
  - { id: ERR_REPORT_NOT_EDITABLE, http: 409, condition: "PATCH attempted on a report not in DRAFT/DISPUTED" }
  - { id: ERR_REPORT_NOT_REVIEWABLE, http: 409, condition: "ACCEPT/DISPUTE attempted on a report not in SUBMITTED" }
  - { id: ERR_SETTLEMENT_NOT_PAYABLE, http: 409, condition: "Payment attempted on settlement not in {INVOICED, PARTIALLY_PAID, OVERDUE}" }
  - { id: ERR_SETTLEMENT_NOT_INVOICABLE, http: 409, condition: "Invoice attempted from a status other than ACCRUING" }
  - { id: ERR_SETTLEMENT_STATE_FORBIDS, http: 409, condition: "Manual recalculate attempted on a PAID settlement" }
  - { id: ERR_PAYMENT_ALREADY_VOIDED, http: 409, condition: "Void attempted on an already-VOIDED payment" }
  - { id: ERR_DRAW_STATE_FORBIDS, http: 409, condition: "TI draw transition not valid from current draw status" }
  - { id: ERR_WAIVER_STATE_FORBIDS, http: 409, condition: "Waiver transition not valid from current waiver status" }
  - { id: ERR_AUDIT_STATE_FORBIDS, http: 409, condition: "Audit action not valid from current audit status" }
  - { id: ERR_AUDIT_FINDING_REPORT_STATE, http: 409, condition: "Finding references a report that is not ACCEPTED, or is outside the audit's lease/window" }
  - { id: ERR_REVIEW_STATE_FORBIDS, http: 409, condition: "Evaluate from non-SCHEDULED, or cure from non-DEFICIENT" }
  - { id: ERR_VIOLATION_ALREADY_RESOLVED, http: 409, condition: "Resolve attempted on a RESOLVED violation" }
  - { id: ERR_PREMISES_TERM_OVERLAP, http: 409, condition: "New lease term overlaps an existing DRAFT/ACTIVE/DEFAULTED lease on the same premises_code (half-open semantics; adjacency allowed)" }
  - { id: ERR_REPORT_PERIOD_DUPLICATE, http: 409, condition: "A report already exists for (lease, period_month) in a non-rejected status" }
  - { id: ERR_SETTLEMENT_YEAR_DUPLICATE, http: 409, condition: "A settlement already exists for (lease, period_year)" }
  - { id: ERR_ENPLANEMENT_MONTH_DUPLICATE, http: 409, condition: "An enplanement snapshot already exists for the month" }
  - { id: ERR_BUILDOUT_WINDOW_CLOSED, http: 422, condition: "TI draw requested after the lease's buildout_deadline" }
  - { id: ERR_WAIVER_BUFFER_VIOLATION, http: 409, condition: "Approved closure window would sit within 14 days of another APPROVED waiver of the same lease" }
  - { id: ERR_INVALID_DATE_RANGE, http: 422, condition: "Start after end (or equal where forbidden) on term, closure window, or audit window" }
  - { id: ERR_REPORT_PERIOD_FUTURE, http: 422, condition: "Report period_month is after the logical clock's current month" }
  - { id: ERR_SETTLEMENT_PERIOD_OPEN, http: 422, condition: "Invoice attempted before the settlement year has fully elapsed" }
  - { id: ERR_INVALID_AMOUNT, http: 422, condition: "Numeric amount violates its sign/positivity rule" }
  - { id: ERR_PAYMENT_EXCEEDS_BALANCE, http: 422, condition: "Payment exceeds the settlement's balance_due_cents" }
  - { id: ERR_TI_ALLOWANCE_EXCEEDED, http: 422, condition: "Draw exceeds lease.ti_remaining_cents" }
  - { id: ERR_CURE_INSUFFICIENT, http: 422, condition: "Cure evidence does not bring attainment to the ACDBE goal" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_lease_version does not match current Lease.version (OCC)" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: AirportAdmin
    description: "Airport concessions program administrator; superset of operational powers"
    identity: opaque
    exclusive_operations: ["create tenants", "create/amend/transition leases (activate, declare/cure default, terminate, remarket)", "create settlements", "approve/reject/disburse TI draws", "decide waivers", "publish enplanement snapshots", "set logical clock"]
    shared_operations: ["read any resource", "list any collection"]
  - name: ConcessionAnalyst
    description: "Concessions program analyst; day-to-day review and enforcement"
    identity: opaque
    exclusive_operations: ["accept/dispute sales reports", "recalculate/invoice settlements", "void payments", "record and resolve policy violations", "schedule and evaluate ACDBE reviews"]
    shared_operations: ["read any resource", "list any collection"]
  - name: Tenant
    description: "Concessionaire acting on its own lease's records"
    identity: entity_backed:Tenant
    exclusive_operations: ["create/revise/submit own sales reports", "post payments on own settlements", "request/cancel own TI draws", "request waivers", "submit ACDBE cure evidence"]
    shared_operations: ["read own tenant record, own leases and their children"]
  - name: Auditor
    description: "External/internal auditor exercising gross-sales audit rights"
    identity: opaque
    exclusive_operations: ["open audit cases", "issue findings (restating reports)", "close audit cases"]
    shared_operations: ["read leases, sales reports, audit cases"]
