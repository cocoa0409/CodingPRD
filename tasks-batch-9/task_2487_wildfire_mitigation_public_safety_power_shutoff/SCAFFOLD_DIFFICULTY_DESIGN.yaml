          assert:
            - "HTTP 409 with data.error_id == ERR_RESOURCE_CENTER_BUFFER_CONFLICT"
            - "CommunityResourceCenter.${crc_s1_id}.status == DEMOBILIZED (unchanged by the refusal)"
            - "CommunityResourceCenter.${crc_s1_id}.last_served_all_clear_at == 2026-08-20T18:00:00Z"
            - "CommunityResourceCenter.${crc_s1_id}.psps_event_id == ${evh_id} (still pointing at the earlier event)"
            - "PSPSEvent.${ev_early_id}.crc_capacity_served == 0 and crc_mitigation_credit == 0.00"
            - "Repeating the same activation against an event whose forecast_onset_at is exactly 2026-08-20T22:00:00Z returns HTTP 200, sets CommunityResourceCenter.${crc_s1_id}.status == ACTIVATED with activation_order 1, and moves last_served_all_clear_at to that event's forecast_all_clear_at"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: arm_then_cancel_conserves_energized_customer_total
        grounds:
          - calculations.energized_customer_total
          - state_machines.Circuit.ENERGIZED_to_DE_ENERGIZATION_PENDING
          - state_machines.Circuit.DE_ENERGIZATION_PENDING_to_ENERGIZED
          - state_machines.PSPSEvent.ARMED_to_CANCELLED
        distinguishing_aspect: |
          The conserved quantity is the SERVED-CUSTOMER COUNT: the sum of Circuit.customer_count over
          circuits in energization_state ENERGIZED is 5 before arming, 0 across the three chain circuits
          while ARMED, and exactly 5 again after cancelling from ARMED — no customer is double-counted or
          orphaned, and the scope rows are marked EXCLUDED rather than deleted.
        test_recipe:
          setup:
            - "The ALPHA -> BRAVO -> CHARLIE chain carries 3, 1 and 1 customers respectively; no other circuit exists."
            - "Event EV-1 is scoped over all three circuits with its ADVANCE_48H batch dispatched, so the arm gate passes with net_benefit_ratio 0.3395."
          setup_api_calls:
            - call: "POST /circuits"
              payload: { circuit_code: "ALPHA", district_code: "D-NORTH", hftd_tier: "TIER_3", overhead_miles: 7.0, equipment_condition_index: 55, inspection_cycle_months: 36, last_inspection_completed_at: "2026-05-01T00:00:00Z", fast_trip_enabled: false }
              as: GridPlanner
              captures: { alpha_id: $.data.id }
            - call: "POST /circuits"
              payload: { circuit_code: "BRAVO", district_code: "D-NORTH", hftd_tier: "TIER_2", overhead_miles: 6.0, equipment_condition_index: 70, inspection_cycle_months: 36, last_inspection_completed_at: "2026-05-01T00:00:00Z", upstream_circuit_id: "${alpha_id}", fast_trip_enabled: false }
              as: GridPlanner
              captures: { bravo_id: $.data.id }
            - call: "POST /circuits"
              payload: { circuit_code: "CHARLIE", district_code: "D-NORTH", hftd_tier: "TIER_2", overhead_miles: 5.0, equipment_condition_index: 80, inspection_cycle_months: 36, last_inspection_completed_at: "2026-05-01T00:00:00Z", upstream_circuit_id: "${bravo_id}", fast_trip_enabled: false }
              as: GridPlanner
              captures: { charlie_id: $.data.id }
            - call: "POST /weather-stations"
              payload: { station_code: "WS-A1", circuit_id: "${alpha_id}", elevation_ft: 3200, representativeness_weight: 0.70, telemetry_status: "ONLINE" }
