        test_recipe:
          setup: ["Program ACTIVE; zone (capacity 5) with a 3-tree booking; one OPEN ticket reported by sup_1"]
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "TreeCycle 2027", season_label: "Winter 2027", window_start: "2027-01-02T00:00:00Z", window_end: "2027-01-16T23:59:59Z" }
              as: ProgramAdmin
