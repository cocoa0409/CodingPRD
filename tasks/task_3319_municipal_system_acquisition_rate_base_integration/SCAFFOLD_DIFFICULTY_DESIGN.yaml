              payload: { account_ref: "CA-1", deposit_cents: 50000, ar_balance_cents: 30000 }
              as: TransitionManager
              captures: { ca_id: $.data.id }
          trigger:
            - call: "POST /acquisitions/customer-accounts/${ca_id}/migrate"
              payload: {}
              as: TransitionManager
          assert:
            - "CustomerAccount.${ca_id}.status == MIGRATED"
            - "CustomerAccount.${ca_id}.deposit_offset_cents == 30000 (min(50000, 30000))"
            - "CustomerAccount.${ca_id}.refund_cents == 20000"
            - "CustomerAccount.${ca_id}.new_ar_balance_cents == 0"
            - "deposit_offset_cents + refund_cents == 50000 == original deposit_cents"

      - name: capital_split_conservation
        grounds:
          - state_machines.CapitalNeedItem.PLANNED_to_SPLIT
        distinguishing_aspect: |
          Conserved quantity: capital-need cost bounds. Splitting a PLANNED item produces
          two children whose lows sum exactly to the parent low and whose highs sum exactly
          to the parent high — a cost-estimate invariant, a different conserved quantity
          than deposit dollars.
        test_recipe:
          setup:
            - "Target T; assessment A in DRAFT with item I (low=10000, high=25000)"
          setup_api_calls:
            - call: "POST /acquisitions/targets"
              payload: { system_name: "T", municipality_name: "M", state_code: "OH", system_type: "WATER", customer_count: 10, permitted_valuation_methods: ["FMV_INDEPENDENT"] }
              as: AcquisitionAnalyst
              captures: { t_id: $.data.id }
