      - name: deliver_converts_reserved_units_to_sold
        claim_type: side_effect_execution
        grounds: [endpoints, state_machines.SalesOrder.PICKED_to_DELIVERED, entities.PurchaseLot.fields.sold_units]
        distinguishing_aspect: "Deliver is the only transition that writes sold_units: after confirm (reserved 10, sold 0, available 90) and pick (unchanged), deliver moves the same 10 units from reserved to sold, leaving available_units 90 — quantity_units == dumped + reserved + sold + available holds at every step."
        test_recipe:
          setup: ["Clock 2026-05-01T08:00:00Z; lot 100 units ACCEPTED; customer order line 10 @ 10.00 CONFIRMED then PICKED"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T08:00:00Z" }, as: MarketAdmin }
