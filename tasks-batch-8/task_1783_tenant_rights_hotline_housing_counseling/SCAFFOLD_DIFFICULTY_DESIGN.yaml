  - rule_id: resource_temporal_overlap
    instances:
      - name: interpreter_buffer_overlap
        grounds:
          - calculations.interpreter_window_conflict
          - state_machines.CallSession.NOT_REQUIRED_to_REQUESTED
          - errors[ERR_INTERPRETER_OVERLAP]
        distinguishing_aspect: |
          Interval semantics: buffered pairwise half-open overlap on the
          Interpreter resource. An 11:05 start conflicts with a 10:00-11:00
          booking (11:05 < 11:00 + 10min buffer) while an 11:10 start —
          exactly one buffer apart — is accepted (boundary s == e2 + 10 makes
          the strict < false). Different resource entity and different
          semantics than the org weekly aggregate-capacity instance.
        test_recipe:
          setup:
            - "CA; interpreter I (es); three es callers with QUEUED sessions S1, S2, S3; no counselor assignment needed (REQUEST allowed from QUEUED)"
          setup_api_calls:
            - { call: "POST /hotline/jurisdictions", payload: { code: "CA", name: "California", level: "STATE", eviction_notice_days: 3, habitability_repair_days: 14, deposit_cap_months: 1.0, deposit_interest_required: false, deposit_interest_rate_pct: 0.0 }, as: AgencyAdmin, captures: { jur: $.data.id } }
