              as: QATechnician
              captures: { d2: "$.data.error_id" }
            - call: "POST /grower-lots"
              payload: { grower_code: "GRW-999", ranch_block: "B9", commodity_class: "LEAFY", harvest_datetime: "2026-08-01T08:00:00Z", water_source: "WELL", adjacent_animal_operation: false, preharvest_test_result: "NEGATIVE" }
              as: ReceivingClerk
              captures: { d3: "$.data.error_id" }
            - call: "POST /grower-lots/${lot_id}/approve"
              as: QATechnician
              captures: { d4: "$.data.error_id" }
            - call: "POST /process-runs"
              payload: { line_id: "${line_id}", product_id: "${prod_id}", customer_spec_id: "${spec_id}", wash_system_id: "${ws_id}", planned_start_at: "2026-08-06T07:00:00Z", planned_end_at: "2026-08-06T12:00:00Z", crew_size: 6 }
              as: SanitationTech
              captures: { d5: "$.data.error_id" }
            - call: "POST /sanitation-events/${san_id}/start"
              as: LineOperator
              captures: { d6: "$.data.error_id" }
            - call: "POST /wash-systems/${ws_id}/changeout"
              as: QATechnician
              captures: { d7: "$.data.error_id" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-02T07:00:00Z" }
              as: QAManager
