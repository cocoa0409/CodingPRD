# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3497_detention_demurrage_complaint_adjudication_carrier_filings
#
# Breadth probe: every claim §1.1–§1.7 declares that SCAFFOLD_DIFFICULTY_DESIGN
# does not already exercise. Corners already covered by §1.8 appear as
# excluded_because stubs. All numeric asserts are pre-computed literals.
# Logical-clock default at startup: 2026-09-01T00:00:00Z.
#
# Shared setup anchors used across instances (each instance is still replayed
# from empty-DB; anchors only avoid re-typing identical call maps):
#   c_clock / c_carrier / c_shipper / c_tariff / c_clock3 / c_publish /
#   c_clock10 / c_invoice  ->  a VOCC carrier with a PUBLISHED CALENDAR tariff
#   (free_time 2 days, 5000 cents/day) and one 10000-cent ISSUED invoice
#   (availability 2026-09-04, return 2026-09-08, issued 2026-09-10).
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: carrier_create_returns_declared_fields_and_system_defaults
        claim_type: Creation
        grounds:
          - entities.CarrierOrganization
          - endpoints.POST_/fmc/carriers
        distinguishing_aspect: "A carrier created with only org_name and org_type returns 201 with status ACTIVE, compliance_score 1000, cumulative_civil_penalties_cents 0, version 1, and server-minted id/created_at/updated_at — none of the system fields are client-supplied."
        test_recipe:
          setup: ["Logical clock at the startup default 2026-09-01T00:00:00Z; empty database."]
          setup_api_calls:
            - &c_clock
              call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: CommissionAdmin
          trigger:
            - &c_carrier
              call: "POST /fmc/carriers"
              payload: { org_name: "Corner Carriers", org_type: "VOCC" }
              as: CommissionAdmin
              captures: { carrier_id: $.data.id, carrier_v: $.data.version }
          assert:
            - "the response status is 201, response_type is object, and meta.api_request_id plus meta.api_request_timestamp are present"
            - "CarrierOrganization.${carrier_id}.status == ACTIVE, compliance_score == 1000, cumulative_civil_penalties_cents == 0"
            - "CarrierOrganization.${carrier_id}.version == 1 and id is a server-minted UUID"
            - "created_at and updated_at are present ISO-8601 UTC timestamps"

      - name: service_contract_get_roundtrips_every_stored_field
        claim_type: Retrieval
        grounds:
          - entities.ServiceContract
          - endpoints.GET_/fmc/service-contracts/{contractId}
        distinguishing_aspect: "Every ServiceContract field round-trips through GET exactly as filed, including the computed filed_at and the EFFECTIVE status assigned at creation."
        test_recipe:
          setup:
            - "VOCC carrier and shipper; clock 2026-09-03T00:00:00Z; contract SC-RT-1 filed for agreement executed 2026-09-02."
          setup_api_calls:
            - *c_clock
            - *c_carrier
            - &c_shipper
              call: "POST /fmc/shippers"
              payload: { company_name: "Corner Shippers", contact_email: "billing@corner.example" }
              as: CommissionAdmin
              captures: { shipper_id: $.data.id }
            - &c_clock3
              call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-03T00:00:00Z" }
              as: CommissionAdmin
            - &c_contract
              call: "POST /fmc/carriers/${carrier_id}/service-contracts"
              payload: { contract_reference: "SC-RT-1", shipper_id: "${shipper_id}", agreed_at: "2026-09-02T00:00:00Z", duration_months: 12, minimum_quantity_commitment: 100, negotiated_free_time_days: 3, negotiated_per_diem_rate_cents: 12000, negotiated_accrual_method: "CALENDAR" }
              as: CarrierRep
              as_user_id: "${carrier_id}"
              captures: { sc_id: $.data.id }
          trigger:
            - call: "GET /fmc/service-contracts/${sc_id}"
              payload: {}
              as: ComplianceReviewer
          assert:
            - "the response status is 200"
            - "ServiceContract.${sc_id}.contract_reference == \"SC-RT-1\" and shipper_id == ${shipper_id}"
            - "ServiceContract.${sc_id}.duration_months == 12, minimum_quantity_commitment == 100, negotiated_free_time_days == 3, negotiated_per_diem_rate_cents == 12000, negotiated_accrual_method == CALENDAR"
            - "ServiceContract.${sc_id}.contract_status == EFFECTIVE and filed_at == \"2026-09-03T00:00:00Z\" (the logical clock at filing)"

      - name: complaints_list_paginates_with_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints.GET_/fmc/complaints
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With three complaints on file, limit=2&offset=0 returns 2 rows with total_count 3 and has_more true; offset=2 returns the last row with has_more false; a shipper_id filter narrows the set before paginating."
        test_recipe:
          setup:
            - "VOCC carrier with PUBLISHED tariff and one ISSUED 10000-cent invoice; three complaints (all referencing that same invoice) filed by the shipper at 2026-09-10."
          setup_api_calls:
            - *c_clock
            - *c_carrier
            - *c_shipper
            - &c_tariff
              call: "POST /fmc/carriers/${carrier_id}/tariff-publications"
              payload: { tariff_code: "DD-COR-1", charge_scope: "DEMURRAGE", free_time_days: 2, per_diem_rate_cents: 5000, accrual_method: "CALENDAR", change_type: "NEW", effective_date: "2026-09-02T00:00:00Z", expected_carrier_version: "${carrier_v}" }
              as: CarrierRep
              as_user_id: "${carrier_id}"
              captures: { t_id: $.data.id }
            - *c_clock3
            - &c_publish
              call: "POST /fmc/tariff-publications/${t_id}/publish"
              payload: {}
              as: CarrierRep
              as_user_id: "${carrier_id}"
            - &c_clock10
              call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T00:00:00Z" }
              as: CommissionAdmin
            - &c_invoice
              call: "POST /fmc/carriers/${carrier_id}/invoices"
              payload: { invoice_number: "INV-COR-1", charge_basis: "TARIFF", tariff_id: "${t_id}", billed_party_shipper_id: "${shipper_id}", container_number: "MSKU9000001", port_code: "USNYC", availability_date: "2026-09-04T00:00:00Z", return_date: "2026-09-08T00:00:00Z", last_accrual_date: "2026-09-08T00:00:00Z" }
              as: CarrierRep
              as_user_id: "${carrier_id}"
              captures: { inv_id: $.data.id }
            - call: "POST /fmc/complaints"
              payload: { respondent_carrier_id: "${carrier_id}", subject_invoice_ids: ["${inv_id}"], reparations_claimed_cents: 10000 }
              as: ShipperRep
              as_user_id: "${shipper_id}"
            - call: "POST /fmc/complaints"
              payload: { respondent_carrier_id: "${carrier_id}", subject_invoice_ids: ["${inv_id}"], reparations_claimed_cents: 9000 }
              as: ShipperRep
              as_user_id: "${shipper_id}"
            - call: "POST /fmc/complaints"
              payload: { respondent_carrier_id: "${carrier_id}", subject_invoice_ids: ["${inv_id}"], reparations_claimed_cents: 8000 }
              as: ShipperRep
              as_user_id: "${shipper_id}"
          trigger:
            - call: "GET /fmc/complaints"
              payload: { shipper_id: "${shipper_id}", limit: 2, offset: 0 }
              as: ComplianceReviewer
          assert:
            - "the page returns exactly 2 rows with total_count == 3 and has_more == true"
            - "GET /fmc/complaints?shipper_id=${shipper_id}&limit=2&offset=2 returns exactly 1 row with total_count == 3 and has_more == false"
            - "GET /fmc/complaints?respondent_carrier_id=${carrier_id} with no parameters returns all 3 rows (default limit 10, offset 0)"
            - "GET /fmc/complaints?subject_invoice_id=${inv_id} returns all 3 rows (array-membership filter)"
            - "response_type is array and each row carries complaint_status == DOCKETED"

      - name: unknown_path_ids_return_entity_specific_404s
        claim_type: Not Found
        grounds:
          - validations[priority=4]
          - errors.ERR_CARRIER_NOT_FOUND
          - errors.ERR_AGREEMENT_NOT_FOUND
          - errors.ERR_INVOICE_NOT_FOUND
          - errors.ERR_COMPLAINT_NOT_FOUND
          - errors.ERR_PROCEEDING_NOT_FOUND
        distinguishing_aspect: "A syntactically valid but unallocated UUID on each single-resource GET produces the entity-specific 404 error_id, never a generic NOT_FOUND."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z; empty database."]
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "GET /fmc/carriers/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: CommissionDocket
              captures: { err_carrier: $.data.error_id }
            - call: "GET /fmc/carrier-agreements/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: CommissionDocket
              captures: { err_agreement: $.data.error_id }
            - call: "GET /fmc/invoices/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: CommissionDocket
              captures: { err_invoice: $.data.error_id }
            - call: "GET /fmc/complaints/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: CommissionDocket
              captures: { err_complaint: $.data.error_id }
            - call: "GET /fmc/enforcement-proceedings/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: CommissionDocket
              captures: { err_proceeding: $.data.error_id }
          assert:
            - "each response status is 404 with response_type error and both error_id and message populated"
            - "the error_ids are respectively ERR_CARRIER_NOT_FOUND, ERR_AGREEMENT_NOT_FOUND, ERR_INVOICE_NOT_FOUND, ERR_COMPLAINT_NOT_FOUND, ERR_PROCEEDING_NOT_FOUND"

      - name: unknown_body_reference_ids_return_entity_specific_404s
        claim_type: Not Found
        grounds:
          - validations[priority=5]
          - errors.ERR_TARIFF_NOT_FOUND
          - errors.ERR_SHIPPER_NOT_FOUND
          - errors.ERR_CONTRACT_NOT_FOUND
          - errors.ERR_LICENSE_NOT_FOUND
          - errors.ERR_DISPUTE_NOT_FOUND
        distinguishing_aspect: "Body-referenced ids (not path ids) that do not exist produce the referenced entity's 404: unknown tariff_id, billed_party_shipper_id, service_contract_id, license path id on bond append, and dispute path id on respond."
        test_recipe:
          setup:
            - "VOCC carrier with a PUBLISHED tariff; clock 2026-09-10T00:00:00Z."
          setup_api_calls:
            - *c_clock
            - *c_carrier
            - *c_shipper
            - *c_tariff
            - *c_clock3
            - *c_publish
            - *c_clock10
          trigger:
            - call: "POST /fmc/carriers/${carrier_id}/invoices"
              payload: { invoice_number: "INV-NF-1", charge_basis: "TARIFF", tariff_id: "00000000-0000-4000-8000-000000000000", billed_party_shipper_id: "${shipper_id}", container_number: "MSKU9000011", port_code: "USNYC", availability_date: "2026-09-04T00:00:00Z", return_date: "2026-09-08T00:00:00Z", last_accrual_date: "2026-09-08T00:00:00Z" }
              as: CarrierRep
              as_user_id: "${carrier_id}"
              captures: { err1: $.data.error_id }
            - call: "POST /fmc/carriers/${carrier_id}/invoices"
              payload: { invoice_number: "INV-NF-2", charge_basis: "TARIFF", tariff_id: "${t_id}", billed_party_shipper_id: "00000000-0000-4000-8000-000000000000", container_number: "MSKU9000012", port_code: "USNYC", availability_date: "2026-09-04T00:00:00Z", return_date: "2026-09-08T00:00:00Z", last_accrual_date: "2026-09-08T00:00:00Z" }
              as: CarrierRep
              as_user_id: "${carrier_id}"
              captures: { err2: $.data.error_id }
            - call: "POST /fmc/carriers/${carrier_id}/invoices"
              payload: { invoice_number: "INV-NF-3", charge_basis: "SERVICE_CONTRACT", service_contract_id: "00000000-0000-4000-8000-000000000000", billed_party_shipper_id: "${shipper_id}", container_number: "MSKU9000013", port_code: "USNYC", availability_date: "2026-09-04T00:00:00Z", return_date: "2026-09-08T00:00:00Z", last_accrual_date: "2026-09-08T00:00:00Z" }
              as: CarrierRep
              as_user_id: "${carrier_id}"
              captures: { err3: $.data.error_id }
            - call: "POST /fmc/oti-licenses/00000000-0000-4000-8000-000000000000/surety-bonds"
              payload: { bond_ref: "B1", surety_name: "Pacific Surety", coverage_cents: 7500000 }
              as: CarrierRep
              as_user_id: "${carrier_id}"
              captures: { err4: $.data.error_id }
            - call: "POST /fmc/invoice-disputes/00000000-0000-4000-8000-000000000000/respond"
              payload: { resolution: "WAIVE" }
              as: CarrierRep
              as_user_id: "${carrier_id}"
              captures: { err5: $.data.error_id }
          assert:
            - "the five responses are 404 with error_id ERR_TARIFF_NOT_FOUND, ERR_SHIPPER_NOT_FOUND, ERR_CONTRACT_NOT_FOUND, ERR_LICENSE_NOT_FOUND, ERR_DISPUTE_NOT_FOUND respectively"
            - "no invoice, bond, or dispute mutation persists: GET /fmc/invoices?carrier_id=${carrier_id} returns 0 rows"

      - name: invoice_create_missing_container_number_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.DemurrageDetentionInvoice.fields.container_number
          - errors.ERR_INVOICE_MISSING_REQUIRED_ELEMENT
        distinguishing_aspect: "container_number is an FMC-required billing element with no default; omitting it entirely is a 400 ERR_INVOICE_MISSING_REQUIRED_ELEMENT — as is a TARIFF-basis invoice that omits tariff_id (the basis-conditional required reference)."
        test_recipe:
          setup:
            - "VOCC carrier with PUBLISHED tariff; shipper; clock 2026-09-10T00:00:00Z."
          setup_api_calls:
            - *c_clock
            - *c_carrier
            - *c_shipper
            - *c_tariff
            - *c_clock3
            - *c_publish
            - *c_clock10
          trigger:
            - call: "POST /fmc/carriers/${carrier_id}/invoices"
              payload: { invoice_number: "INV-MISS-1", charge_basis: "TARIFF", tariff_id: "${t_id}", billed_party_shipper_id: "${shipper_id}", port_code: "USNYC", availability_date: "2026-09-04T00:00:00Z", return_date: "2026-09-08T00:00:00Z", last_accrual_date: "2026-09-08T00:00:00Z" }
              as: CarrierRep
              as_user_id: "${carrier_id}"
              captures: { err_no_container: $.data.error_id }
            - call: "POST /fmc/carriers/${carrier_id}/invoices"
              payload: { invoice_number: "INV-MISS-2", charge_basis: "TARIFF", billed_party_shipper_id: "${shipper_id}", container_number: "MSKU9000022", port_code: "USNYC", availability_date: "2026-09-04T00:00:00Z", return_date: "2026-09-08T00:00:00Z", last_accrual_date: "2026-09-08T00:00:00Z" }
              as: CarrierRep
              as_user_id: "${carrier_id}"
              captures: { err_no_tariff: $.data.error_id }
          assert:
            - "both responses are 400 with error_id ERR_INVOICE_MISSING_REQUIRED_ELEMENT"
            - "no invoice persists: GET /fmc/invoices?carrier_id=${carrier_id} returns 0 rows"

      - name: invoice_create_omitting_hold_fields_defaults_them_to_zero
        claim_type: Defaults
        grounds:
          - entities.DemurrageDetentionInvoice.fields.government_hold_days
          - entities.DemurrageDetentionInvoice.fields.appointment_unavailable_days
        distinguishing_aspect: "government_hold_days and appointment_unavailable_days each declare default 0; an invoice created without them stores 0 (not null), so the incentive-principle score of a later complaint is unaffected by holds."
        test_recipe:
          setup:
            - "VOCC carrier with PUBLISHED tariff; shipper; clock 2026-09-10T00:00:00Z."
          setup_api_calls:
            - *c_clock
            - *c_carrier
            - *c_shipper
            - *c_tariff
            - *c_clock3
            - *c_publish
            - *c_clock10
          trigger:
            - *c_invoice
            - call: "POST /fmc/complaints"
              payload: { respondent_carrier_id: "${carrier_id}", subject_invoice_ids: ["${inv_id}"], reparations_claimed_cents: 10000 }
              as: ShipperRep
              as_user_id: "${shipper_id}"
              captures: { comp_def: $.data.id, score_def: $.data.incentive_principle_score }
          assert:
            - "the response status is 201"
            - "DemurrageDetentionInvoice.${inv_id}.government_hold_days == 0 and appointment_unavailable_days == 0"
            - "Complaint.${comp_def}.incentive_principle_score == 100 (no hold/appointment deductions, no congestion reports for USNYC)"

      - name: invoice_create_client_supplied_amount_input_ignored
        claim_type: Computed Fields
        grounds:
          - entities.DemurrageDetentionInvoice.fields.amount_cents
          - calculations.invoice_charge_amount
        distinguishing_aspect: "amount_cents is source: computed — a client-supplied amount_cents of 1 cent is ignored and the server-computed 10000 (2 billable days x 5000) is stored instead."
        test_recipe:
          setup:
            - "VOCC carrier with PUBLISHED tariff; shipper; clock 2026-09-10T00:00:00Z."
          setup_api_calls:
            - *c_clock
            - *c_carrier
            - *c_shipper
            - *c_tariff
            - *c_clock3
            - *c_publish
            - *c_clock10
          trigger:
            - call: "POST /fmc/carriers/${carrier_id}/invoices"
              payload: { invoice_number: "INV-CHEAT-1", charge_basis: "TARIFF", tariff_id: "${t_id}", billed_party_shipper_id: "${shipper_id}", container_number: "MSKU9000033", port_code: "USNYC", availability_date: "2026-09-04T00:00:00Z", return_date: "2026-09-08T00:00:00Z", last_accrual_date: "2026-09-08T00:00:00Z", amount_cents: 1 }
              as: CarrierRep
              as_user_id: "${carrier_id}"
              captures: { inv_cheat: $.data.id, cheat_amount: $.data.amount_cents }
          assert:
            - "the response status is 201 and the stored amount_cents == 10000, not the client-supplied 1"
            - "DemurrageDetentionInvoice.${inv_cheat}.billable_days == 2 and per_diem_rate_cents == 5000 (copied from the tariff)"

      - name: carrier_org_type_invalid_enum_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.CarrierOrganization.fields.org_type
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "org_type is a closed enum; BROKER is not one of VOCC/MTO/NVOCC/OFF and is rejected with 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z."]
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "POST /fmc/carriers"
              payload: { org_name: "Bogus Brokerage", org_type: "BROKER" }
              as: CommissionAdmin
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 400 and error_id == ERR_INVALID_REQUEST"
            - "no carrier persists: GET /fmc/carriers/00000000-0000-4000-8000-000000000000 is a 404 (nothing was registered)"

      - name: congestion_report_is_append_only_without_version_fields
        claim_type: Immutability
        grounds:
          - entities.PortCongestionReport
        distinguishing_aspect: "PortCongestionReport declares common_fields: false — the 201 response carries id and created_at but no version and no updated_at, and the scaffold declares no update or delete endpoint for it."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z."]
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "POST /fmc/port-congestion-reports"
              payload: { port_code: "USMOB", terminal_code: "TERM-1", week_start: "2026-09-07T00:00:00Z", berth_occupancy_hours: 100, gate_closures_hours: 2, vessel_dwell_hours_avg: 36.5 }
              as: CommissionDocket
            - call: "POST /fmc/port-congestion-reports"
              payload: { port_code: "USMOB", terminal_code: "TERM-1", week_start: "2026-09-07T00:00:00Z", berth_occupancy_hours: 100, gate_closures_hours: 2, vessel_dwell_hours_avg: 36.5 }
              as: CommissionDocket
              captures: { error_id: $.data.error_id }
          assert:
            - "the first response status is 201 and data carries id and created_at but no version field"
            - "the identical resubmission is rejected with 409 ERR_DUPLICATE_CONGESTION_REPORT — the record cannot be replaced or amended, only rejected"

      - name: tariff_create_under_unknown_carrier_returns_carrier_not_found
        claim_type: Parent Relationships
        grounds:
          - entities.TariffPublication.fields.carrier_id
          - errors.ERR_CARRIER_NOT_FOUND
        distinguishing_aspect: "The nested creation path validates the parent first: an unknown carrier id yields 404 ERR_CARRIER_NOT_FOUND before any tariff field is examined."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z; one unrelated carrier exists so the request's OCC field is well-formed."]
          setup_api_calls:
            - *c_clock
            - *c_carrier
          trigger:
            - call: "POST /fmc/carriers/00000000-0000-4000-8000-000000000000/tariff-publications"
              payload: { tariff_code: "DD-NOPE-1", charge_scope: "DEMURRAGE", free_time_days: 2, per_diem_rate_cents: 5000, accrual_method: "CALENDAR", change_type: "NEW", effective_date: "2026-09-02T00:00:00Z", expected_carrier_version: "${carrier_v}" }
              as: CarrierRep
              as_user_id: "00000000-0000-4000-8000-000000000000"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 404 and error_id == ERR_CARRIER_NOT_FOUND"
  # ===========================================================================
  - section: state_machines
    instances:

      - name: tariff_publish_happy_path_sets_published_immediately
        claim_type: Valid Transition
        grounds:
          - state_machines.TariffPublication.DRAFT_to_PUBLISHED
        distinguishing_aspect: "Publishing a DRAFT tariff at or after its effective_date returns 200 with publication_status PUBLISHED in the same response (immediate consistency — no re-read needed)."
        test_recipe:
          setup:
            - "VOCC carrier; tariff DD-COR-1 DRAFT with effective_date 2026-09-02; clock at 2026-09-03T00:00:00Z."
          setup_api_calls:
            - *c_clock
            - *c_carrier
            - *c_tariff
            - *c_clock3
          trigger:
            - *c_publish
          assert:
            - "the response status is 200 and publication_status == PUBLISHED in the response body"
            - "a subsequent GET /fmc/carriers/${carrier_id}/tariff-publications lists the tariff as PUBLISHED"

      - name: tariff_publish_twice_returns_not_in_draft
        claim_type: Invalid Transitions
        grounds:
          - state_machines.TariffPublication.DRAFT_to_PUBLISHED
          - errors.ERR_TARIFF_NOT_IN_DRAFT
        distinguishing_aspect: "From PUBLISHED the publish trigger is not in the transition list: the second publish is rejected 409 ERR_TARIFF_NOT_IN_DRAFT (idempotency-by-rejection) and the tariff stays PUBLISHED."
        test_recipe:
          setup:
            - "VOCC carrier; tariff already PUBLISHED."
          setup_api_calls:
            - *c_clock
            - *c_carrier
            - *c_tariff
            - *c_clock3
            - *c_publish
          trigger:
            - call: "POST /fmc/tariff-publications/${t_id}/publish"
              payload: {}
              as: CarrierRep
              as_user_id: "${carrier_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_TARIFF_NOT_IN_DRAFT"
            - "the tariff remains PUBLISHED with no other field changed"

      - name: complaint_intake_starts_docketed_with_frozen_score
        claim_type: Initial State
        grounds:
          - state_machines.Complaint
          - entities.Complaint.fields.incentive_principle_score
        distinguishing_aspect: "A new complaint starts DOCKETED (no separate docketing step) with ombuds_rounds 0, reparations_awarded_cents 0, and the incentive score frozen at intake — a congestion report filed AFTER intake does not change it."
        test_recipe:
          setup:
