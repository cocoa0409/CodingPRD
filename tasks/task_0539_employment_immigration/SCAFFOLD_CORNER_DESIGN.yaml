              payload: { employer_id: "${emp_id}", lca_id: "${lca_id}", beneficiary_id: "${ben_id}", registration_id: "${reg_id}", worksite_area: "AREA_B", employment_start: "2026-10-01T00:00:00Z", employment_end: "2029-10-01T00:00:00Z" }
              as: EmployerAgent
              as_user_id: "${emp_id}"
              captures: { pet_id: $.data.id }
