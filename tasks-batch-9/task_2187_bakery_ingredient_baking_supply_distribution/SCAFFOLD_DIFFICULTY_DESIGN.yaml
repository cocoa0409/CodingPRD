      - name: overlap_zone_sanitation_lockout_closed_interval_clock_on_end_endpoint
        grounds:
          - validations[priority=21]
          - entities.WarehouseZone.fields.lockout_start_at
          - entities.WarehouseZone.fields.lockout_end_at
          - entities.WarehouseZone.fields.status
          - errors[ERR_ZONE_LOCKOUT_CONFLICT]
        distinguishing_aspect: |
          A third resource (WarehouseZone) whose contested dimension is the LOGICAL CLOCK INSTANT
          against a closed aggregate interval, not one requested window against another. Receiving a
          lot while the clock sits exactly on lockout_end_at (2026-08-10T00:00:00Z) must fail
          ERR_ZONE_LOCKOUT_CONFLICT / 409 because the endpoint is inclusive, while the same receipt
          one second later (2026-08-10T00:00:01Z) succeeds and the zone reverts to OPEN. Contrast
          with the route rule, where a shared endpoint instant does NOT overlap.
        test_recipe:
          setup:
            - "Logical clock starts at 2026-08-05T00:00:00Z; almond flour SKU ALM-FLR-25 (TREE_NUT) and TREE_NUT zone Z-NUT-01 (OPEN, on_hand_lb 0)."
            - "A control lot LOT-CTRL-01 of 1000 lb is received while the zone is OPEN and no lockout exists, proving the receipt path itself works."
            - "qm-1 schedules the sanitation lockout for the CLOSED interval 2026-08-08T06:00:00Z .. 2026-08-10T00:00:00Z while the clock is still 2026-08-05, so the zone stays OPEN."
            - "The clock is then set to exactly 2026-08-10T00:00:00Z and the same lockout window is re-applied, so the zone status flips to SANITATION_LOCKOUT."
          setup_api_calls:
            - call: "POST /bakery-distribution/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "adm-1"
