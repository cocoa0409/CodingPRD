            - "d2_prio == 1 (SEV1 100 + 24h age 10 = 110 >= 110, inclusive boundary)"
            - "d3_prio == 2 (SEV1 100 + 0 = 100 < 110, >= 90)"

      - name: accrual_rounding_order_daily_then_multiply
        grounds:
          - calculations.accrual_interest
          - entities.Account.fields.daily_interest_cents
        distinguishing_aspect: |
          Mode (b): nested rounding where the order matters — the scaffold
          pins round_half_up on the DAILY amount first, then multiplies by
          days. Principal 10000001 cents at 0.03 ACT_365: unrounded daily is
          821.91789 -> rounded daily 822; 822 * 10 = 8220. The alternative
          order (multiply then round: 8219.178 -> 8219) yields a different
          total; the scaffold pins 8220.
        test_recipe:
          setup:
            - "Clock 2026-09-01; project DISCOVERY; product DDA-ODD ACT_365 rate 0.03 ACTIVE; GL-1000."
            - "Account L-4001 DEPOSIT principal 10000001, accrual_start 2026-09-01, MAPPED; project advanced to MOCK_CONVERSION."
            - "Clock set to 2026-09-10; MOCK-1 started and finalized."
          setup_api_calls:
