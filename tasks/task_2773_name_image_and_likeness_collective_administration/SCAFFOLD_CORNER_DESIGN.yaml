          assert:
            - "${disc_after_submit} == DISCLOSURE_PENDING"
            - "${err_reviewer} == ERR_UNAUTHORIZED"
            - "${err_director} == ERR_UNAUTHORIZED"
            - "Both rejections return 403."
            - "${disc_final} == DISCLOSURE_ACCEPTED"
            - "GET /nil/deal-contracts?collective_id=${col_id} returns exactly 1 row, so the reviewer's create was fully rejected."
            - "GET /nil/deal-contracts/${dc_id} as InstitutionReviewer returns 200, because all GET endpoints are shared with that role."

      - name: athlete_cannot_touch_another_athletes_deliverable
        claim_type: peer_roles
        grounds: [validations.priority_4_rbac_entity_backed_ownership, errors.ERR_FORBIDDEN_RESOURCE, roles.Athlete]
        distinguishing_aspect: "The Athlete role is entity-backed: ownership is decided by matching X-User-ID against Athlete.portal_user_id on the deliverable's grandparent contract, so the same request body succeeds for one caller identity and returns 403 for another, and donor-facing reads stay closed to both."
        test_recipe:
          setup:
            - "One collective with two ENROLLED athletes whose portal_user_id values are ath-own and ath-other."
            - "Each athlete has an ACTIVE contract worth 50000 (below the disclosure threshold, so no packet is needed) with one APPEARANCE deliverable."
          setup_api_calls:
            - call: "POST /nil/collectives"
              payload: { name: "Ownership Collective", institution_name: "Ownership Institution", institution_ipeds_code: "025800", home_state_code: "TX", association_ruleset: "NCAA_2024" }
              as: PlatformAdmin
              captures: { col_id: $.data.id }
            - call: "POST /nil/athletes"
              payload: { collective_id: "${col_id}", full_name: "Owner Athlete", portal_user_id: "ath-own", sport: "FOOTBALL", class_year: 2028 }
              as: CollectiveDirector
              captures: { ath_own: $.data.id }
            - call: "POST /nil/athletes"
              payload: { collective_id: "${col_id}", full_name: "Other Athlete", portal_user_id: "ath-other", sport: "FOOTBALL", class_year: 2028 }
              as: CollectiveDirector
              captures: { ath_other: $.data.id }
            - call: "POST /nil/deal-contracts"
              payload: { collective_id: "${col_id}", athlete_id: "${ath_own}", total_value_cents: 50000, effective_start_at: "2026-08-01T00:00:00Z", effective_end_at: "2026-12-31T00:00:00Z" }
              as: CollectiveDirector
              captures: { dc_own: $.data.id }
            - call: "POST /nil/deal-contracts"
              payload: { collective_id: "${col_id}", athlete_id: "${ath_other}", total_value_cents: 50000, effective_start_at: "2026-08-01T00:00:00Z", effective_end_at: "2026-12-31T00:00:00Z" }
              as: CollectiveDirector
              captures: { dc_other: $.data.id }
            - call: "POST /nil/deal-contracts/${dc_own}/activation"
              payload: {}
              as: CollectiveDirector
            - call: "POST /nil/deal-contracts/${dc_other}/activation"
              payload: {}
              as: CollectiveDirector
            - call: "POST /nil/deal-contracts/${dc_own}/deliverables"
              payload: { deliverable_kind: "APPEARANCE", unit_value_cents: 50000, due_at: "2026-09-01T00:00:00Z" }
              as: CollectiveDirector
              captures: { del_own: $.data.id }
            - call: "POST /nil/deal-contracts/${dc_other}/deliverables"
              payload: { deliverable_kind: "APPEARANCE", unit_value_cents: 50000, due_at: "2026-09-01T00:00:00Z" }
              as: CollectiveDirector
              captures: { del_other: $.data.id }
          trigger:
            - call: "POST /nil/deliverables/${del_other}/evidence"
              payload: { evidence_kind: "PHOTO_SET", reference_label: "trespass" }
              as: Athlete
              as_user_id: "ath-own"
              captures: { err_forbidden: $.data.error_id }
            - call: "POST /nil/deliverables/${del_own}/evidence"
              payload: { evidence_kind: "PHOTO_SET", reference_label: "trespass" }
              as: Athlete
              as_user_id: "ath-own"
              captures: { own_evidence_count: $.data.evidence_count }
            - call: "GET /nil/donor-members"
              payload: { collective_id: "${col_id}" }
              as: Athlete
              as_user_id: "ath-own"
              captures: { err_donor_read: $.data.error_id }
          assert:
            - "${err_forbidden} == ERR_FORBIDDEN_RESOURCE"
            - "The cross-athlete write returns 403 and Deliverable.${del_other}.evidence_count stays 0."
            - "${own_evidence_count} == 1"
            - "The identical body on the athlete's own deliverable returns 201, so the only difference is ownership."
            - "${err_donor_read} == ERR_UNAUTHORIZED"
            - "The donor-facing read returns 403, and it is priority 3 rather than priority 4 because the endpoint is closed to the role entirely."
            - "A caller sending X-User-Role: Athlete with an X-User-ID that matches no Athlete.portal_user_id also receives ERR_FORBIDDEN_RESOURCE on the same deliverable write."

      - name: same_user_cannot_verify_a_deliverable_and_initiate_its_payout
        claim_type: segregation_of_duties
        grounds: [validations.priority_22_sod_release_initiator_is_not_verifier, errors.ERR_SEGREGATION_OF_DUTIES, entities.Deliverable.fields.verified_by_user_id]
        distinguishing_aspect: "Priority 22 compares X-User-ID values, not roles, so the same human wearing the ComplianceOfficer hat to verify and the TreasuryOfficer hat to pay is refused, while a different treasury user paying the identical deliverable succeeds."
        test_recipe:
          setup:
            - "A collective with 487470 cents of settled UNRESTRICTED net funds (gross 500000, fee 12530)."
