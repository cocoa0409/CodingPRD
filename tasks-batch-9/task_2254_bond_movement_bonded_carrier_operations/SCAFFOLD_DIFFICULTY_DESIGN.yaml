              as: BondedCarrier
              as_user_id: "${c1}"
          assert:
            - "HTTP status == 409"
            - "error_id == ERR_BOND_NOT_ACTIVE"
            - "error_id != ERR_BOND_INSUFFICIENT"
            - "CustomsBond.${b2}.status == SUSPENDED"
            - "CustomsBond.${b2}.obligated_amount == 0.00"
            - "CustomsBond.${b2}.available_amount == 30.00"
            - "GET /in-bond/movements?carrier_id=${c1} returns total_count == 0 (no movement row was created)"

