  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: engineering_revision_cascade_reverts_project_and_voids_notifications
        grounds:
          - state_machines.EngineeringSurvey.CERTIFIED_to_DRAFT
          - state_machines.Project.RELEASED_to_PRECONDITIONS_PENDING
          - state_machines.NeighborNotification.PENDING_DELIVERY_to_VOIDED
        distinguishing_aspect: |
          Depth-3 cascade from an API trigger on EngineeringSurvey:
          REQUEST_REVISION (survey CERTIFIED -> DRAFT, revision 1->2) causes the
          pinned Project RELEASED -> PRECONDITIONS_PENDING with a stale pin,
          which itself causes PENDING_DELIVERY NeighborNotifications -> VOIDED —
          each hop caused by the previous link, not by the original call.
        test_recipe:
          setup:
            - "Project RELEASED (full gate satisfied); a second NeighborNotification created after release is still PENDING_DELIVERY; the pinned engineering survey is CERTIFIED at revision 1."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: ContractorAdmin }
            - { call: "POST /demolition/projects", payload: { name: "Cascade A", address: "11 Elm St", lot_area_sqft: 30000, required_diversion_rate: 0.5 }, as: ContractorAdmin, captures: { p_id: $.data.id } }
