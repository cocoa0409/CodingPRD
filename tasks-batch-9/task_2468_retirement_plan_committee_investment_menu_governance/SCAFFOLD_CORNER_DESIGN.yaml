            - "trigger call 10 shows FeeLevelizationRun.${run_c6_id}.status DRAFT -> VOID with total_count 1, because 0 < 2 - 1 is now true"
            - "trigger call 11 shows the checkpoint is a versioned write like any other: Plan.version increased by exactly 2 across the two rolls, and the capacity triple (occupied 5, reserved 0, available 1) is untouched — advance-quarter has no menu-capacity arm"
            - "no arm ran twice: after the second roll CommitteeMember.${mem_ind_c6_id} is still TERM_EXPIRED with the same end_term_reason, and FiduciaryTrainingRecord.${tr_par_c6_id} is still EXPIRED — EXPIRED and TERM_EXPIRED are terminal, so a repeated checkpoint is idempotent on the arms that already fired"
            - "SPEC NOTE — consecutive_vacant_quarters has two incompatible definitions. §1.1 calls it 'Quarters this seat has been VACANT; incremented by advance-quarter, reset on appointment', which makes it 2 for ${seat_ind_c6_id} after the second roll; §1.5's advance-quarter side_effects and §1.3's ACTIVE -> TERM_EXPIRED side_effects both increment it only as part of the member-expiry clause, which leaves it at 1. This instance asserts only the post-first-roll value 1, where the two readings agree, and flags the second-roll value as unspecified."
            - "SPEC NOTE — §1.3's ACTIVE -> TERM_EXPIRED side effect says 'seat.consecutive_vacant_quarters = 0 then incremented by the same run' while §1.5 says only '+= 1'; both land on 1 here because the seat's counter was 0 (reset at appointment), so the instance cannot distinguish them."
            - "STRUCTURAL NOTE — the checkpoint quietly shrinks future quorums. After the first roll the plan has 5 voting seats but only 3 members who are ACTIVE with current training, so the next convene computes eligible_voting_seat_count from the seats that can actually vote; already-convened meetings keep the values frozen at their own convene, per the boundary note on calculations.fiduciary_training_status."

  - section: consistency_model
    # §0 declares consistency_model: immediate. The claim to prove is therefore
    # "all changes visible in same request's response" — both for the writing
    # entity itself and for every parent whose derived fields the write moved.
    # There is no eventual-consistency lag to test and no re-read-after-delay
    # step anywhere in this scaffold; the two instances below establish that
    # positively rather than by omission.
    instances:
      - name: every_field_a_write_derives_is_already_in_that_writes_own_response_body
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - response_envelope.success
          - calculations.fund_composite_score
          - calculations.quorum_evaluation
          - calculations.menu_posture
        distinguishing_aspect: "Under immediate consistency a caller never needs a follow-up read to learn what its own write produced. This instance takes the four writes with the largest derived payloads — meeting create (defaults), convene (quorum arithmetic over three other entities), scorecard create (five components plus the composite plus the ladder verdict) and posture recompute (a ratio over five slots) — and asserts the computed values against the 201/200 body itself, then re-reads each object to prove the follow-up GET is redundant rather than authoritative: the numbers are identical, so nothing is recomputed lazily on read."
        test_recipe:
          setup:
            - "chain_l3: three ACTIVE members on three voting seats, charter ADOPTED, IPS-2026-A ADOPTED with weights 0.40/0.20/0.20/0.10/0.10 and style_drift_r2_floor 0.8000, five funds seated in five slots, posture OPEN."
          setup_api_calls:
            - *chain_l3
          trigger:
            - call: "POST /governance/committee-meetings"
              payload: { plan_id: "${plan_id}", meeting_date: "2026-08-25", quarter_index: 0 }
              as: PlanSponsorAdmin
              as_user_id: "psa-ops"
              captures: { meet_cm_id: $.data.id }
            - call: "POST /governance/committee-meetings/${meet_cm_id}/convene"
              payload: { attendee_member_ids: ["${mem_chair_id}", "${mem_fin_id}", "${mem_hr_id}"] }
              as: CommitteeChair
              as_user_id: "${mem_chair_id}"
            - call: "GET /governance/committee-meetings/${meet_cm_id}"
              payload: {}
              as: PlanAuditor
              as_user_id: "aud-1"
            - *b_review_q0
            - *b_sc_lc
            - call: "GET /governance/fund-scorecards/${sc_lc_id}"
              payload: {}
              as: PlanAuditor
              as_user_id: "aud-1"
            - call: "GET /governance/quarterly-reviews/${review_q0_id}"
              payload: {}
              as: PlanAuditor
              as_user_id: "aud-1"
            - call: "POST /governance/plans/${plan_id}/menu-posture/recompute"
              payload: {}
              as: InvestmentConsultant
              as_user_id: "ic-1"
            - call: "GET /governance/plans/${plan_id}"
              payload: {}
              as: PlanAuditor
              as_user_id: "aud-1"
          assert:
            - "trigger call 1's 201 body already carries every declared default: status SCHEDULED, attendee_member_ids [], quorum_met false and carried_motion_count 0 — the client does not have to GET the meeting to learn its initial shape"
            - "trigger call 2's 200 body already carries the quorum arithmetic over the three seats and three members: eligible_voting_seat_count 3, voting_attendee_count 3, quorum_met true, and charter_version_pinned equal to the Plan.version at convene time"
            - "trigger call 3 returns byte-identical values to call 2's body for status, eligible_voting_seat_count, voting_attendee_count, quorum_met and charter_version_pinned — the read is a redundant confirmation, not the moment the numbers are produced"
            - "trigger call 5's 201 body already carries the whole scorecard computation for LCGRA: performance_component 58.00 (excess_bps 80 from 0.6*(900-800) + 0.4*(850-800), so 50.00 + 8.00), peer_component 75.00, expense_component 90.00 (5 bps over the 40 bp peer median at 2.00 points each), style_component 100.00 (0.9200 >= the 0.8000 floor), manager_component 100.00 (min(100.00, 40.00 + 20*3.0)), composite_score 76.20 and watch_recommendation NONE"
            - "trigger call 6 returns the same seven values; nothing about FundScorecard.${sc_lc_id} is derived at read time"
            - "trigger call 7 shows the PARENT is already updated on its first read after the child write: QuarterlyReview.${review_q0_id}.status == SCORING, scorecard_count 1, submitted_scorecard_count 1 and version == ${review_v_0} + 1. The DRAFT -> SCORING auto-transition and the two counters were applied inside the scorecard's own request"
            - "trigger call 8's 200 body is the Plan itself with at_risk_slot_ratio 0.0000 and menu_posture OPEN computed over all five slots in that request"
            - "trigger call 9 returns the same ratio and posture with only Plan.version differing from the pre-recompute value, so the recompute endpoint is an explicit re-derivation of an already-consistent value rather than a repair step for a lagging one"
            - "every one of the four write responses carried meta.api_request_id and meta.api_request_timestamp with response_type object, per §1.0 — the envelope never defers data to a later request"

      - name: the_approval_fan_out_is_complete_on_the_first_read_and_the_version_bump_is_not_deferred
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - state_machines.FundReplacementProposal.UNDER_REVIEW_to_APPROVED
          - concurrency_rules.proposal-create-stale-plan
          - errors.ERR_STALE_PLAN_VERSION
        distinguishing_aspect: "The approval touches three entities at once — the proposal, its slot and the plan's capacity triple and counters — and immediate consistency means all three are correct on the FIRST read with no convergence window. The sharpest probe is the OCC token: because Plan.version is incremented synchronously inside the approve request, a create that quotes the pre-approve version must fail with 412 on the very next call rather than succeeding and being reconciled later. Repeating each read must return identical values, so no field is a cache warmed by the first access."
        test_recipe:
          setup:
            - "chain_l5: the large-cap replacement proposal ${prop_lc_id} is UNDER_REVIEW with a CARRIED replacement motion in a meeting whose minutes are approved, so the approval is legal; the slot is still ACTIVE and the capacity triple is occupied 5 / reserved 0 / available 1."
            - "A spare US_SMALL_CAP candidate is registered so the post-approval OCC probe can target a DIFFERENT slot — a probe on the large-cap slot would be answered by ERR_SLOT_NOT_REPLACEABLE at priority 42 before the 412 at priority 46 ever ran."
          setup_api_calls:
            - *chain_l5
            - *b_fund_small_b
          trigger:
            - call: "GET /governance/plans/${plan_id}"
              payload: {}
              as: InvestmentConsultant
              as_user_id: "ic-1"
              captures: { plan_v_pre_approve: $.data.version }
            - call: "POST /governance/fund-replacements/${prop_lc_id}/approve"
              payload: {}
              as: CommitteeChair
              as_user_id: "${mem_chair_id}"
            - call: "GET /governance/plans/${plan_id}"
              payload: {}
              as: InvestmentConsultant
              as_user_id: "ic-1"
              captures: { plan_v_post_approve: $.data.version }
            - call: "GET /governance/plans/${plan_id}"
              payload: {}
              as: InvestmentConsultant
              as_user_id: "ic-1"
            - call: "GET /governance/asset-class-slots/${slot_lc_id}"
              payload: {}
              as: InvestmentConsultant
              as_user_id: "ic-1"
            - call: "POST /governance/fund-replacements"
              payload: { plan_id: "${plan_id}", slot_id: "${slot_small_id}", outgoing_fund_id: "${fund_small_id}", incoming_fund_id: "${fund_small_b_id}", mapping_strategy: "DIRECT_MAP", rationale: "Small-cap share class arbitrage queued behind the large-cap replacement.", expected_plan_version: "${plan_v_pre_approve}" }
              as: InvestmentConsultant
              as_user_id: "ic-1"
            - call: "POST /governance/fund-replacements"
              payload: { plan_id: "${plan_id}", slot_id: "${slot_small_id}", outgoing_fund_id: "${fund_small_id}", incoming_fund_id: "${fund_small_b_id}", mapping_strategy: "DIRECT_MAP", rationale: "Small-cap share class arbitrage queued behind the large-cap replacement.", expected_plan_version: "${plan_v_post_approve}" }
              as: InvestmentConsultant
              as_user_id: "ic-1"
              captures: { prop_cm_id: $.data.id }
          assert:
            - "trigger call 2's 200 body already shows the proposal's own half of the fan-out: FundReplacementProposal.${prop_lc_id}.status UNDER_REVIEW -> APPROVED with approving_motion_id == ${motion_prop_id} and pinned_ips_id == ${ips_a_id}"
            - "trigger call 3, the first read after the write, already shows the plan's half complete: occupied_menu_slots 5, reserved_menu_slots 1, available_menu_slots 0, draft_proposal_count 0 (APPROVED is outside the counted set) and version == plan_v_pre_approve + 1"
            - "trigger call 4 returns values identical to call 3 for the capacity triple, draft_proposal_count, at_risk_slot_ratio, menu_posture and version — the second read converges on nothing because the first read was already final"
            - "trigger call 5 shows the slot's half complete on its first read: AssetClassSlot.${slot_lc_id}.status ACTIVE -> PENDING_REPLACEMENT with current_fund_id still ${fund_lc_a_id}, because the incoming fund only takes the seat at execute"
            - "trigger call 6 returned 412 ERR_STALE_PLAN_VERSION on the very next request after the approval: the version increment was applied inside the approve, not queued behind it, so there is no window in which the pre-approve token still works"
            - "trigger call 6 is answered by the 412 and not by a 409, confirming the probe reached priority 46: the target slot ${slot_small_id} is ACTIVE with no open proposal, so no priority-42 gate applies"
            - "trigger call 7, the same body with the post-approval token, returned 201 with FundReplacementProposal.${prop_cm_id}.status DRAFT and pinned_plan_version == plan_v_post_approve, and the immediately visible Plan.draft_proposal_count is back to 1"
            - "no assertion in this instance required a retry, a sleep or a second read to become true, which is the observable content of consistency_model: immediate"
