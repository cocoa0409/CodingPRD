          - state_machines.MonogramLicense.APPLIED_to_GRANTED
          - calculations.license_compliance_posture
          - validations[priority=74]
        distinguishing_aspect: |
          The audit closeout is a three-way branch out of one state: with five open MINOR findings the GRANT branch
          is refused (ERR_MINOR_FINDING_THRESHOLD) while GRANT_CONDITIONAL succeeds and carries a side effect the
          GRANT branch does not have — conditional_expires_at set to 2027-01-28T00:00:00Z and posture CONDITIONAL.
