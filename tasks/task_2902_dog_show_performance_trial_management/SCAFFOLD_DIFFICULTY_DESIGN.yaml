            - call: "POST /dog-shows/shows/${show_id}/open-day"
              payload: {}
              as: ShowSecretary
            - call: "POST /dog-shows/entries/${ea1_id}/check-in"
              payload: { attendance: "PRESENT" }
              as: ShowSecretary
            - call: "POST /dog-shows/entries/${ea2_id}/check-in"
              payload: { attendance: "ABSENT" }
              as: ShowSecretary
            - call: "POST /dog-shows/entries/${eb1_id}/check-in"
              payload: { attendance: "PRESENT" }
              as: ShowSecretary
            - call: "POST /dog-shows/entries/${eb2_id}/check-in"
              payload: { attendance: "ABSENT" }
              as: ShowSecretary
