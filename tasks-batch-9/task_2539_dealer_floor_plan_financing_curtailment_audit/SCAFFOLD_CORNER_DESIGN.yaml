        excluded_because:
          difficulty_instance: curtailment_projected_versus_assessed_after_voluntary_prepayment
          rationale: "That instance reads projected_principal_cents and required_principal_cents off the same obligation after a voluntary prepayment and asserts both pre-computed figures plus their delta, which is exactly the divergence claim."

      - name: the_context_selects_which_dscr_variant_governs
        claim_type: variant_selection
        excluded_because:
          difficulty_instance: covenant_dscr_lender_standard_fails_while_dealer_adjusted_permits_reinstatement
          rationale: "Variant selection is asserted there by showing the LENDER_STANDARD variant alone writes CovenantTest.result while only the DEALER_ADJUSTED variant is consulted by the reinstate precondition, in one fixture."

      - name: assessed_variant_reconciles_the_ledger_when_it_replaces_the_projection
        claim_type: reconciliation
        excluded_because:
          difficulty_instance: curtailment_projected_versus_assessed_after_voluntary_prepayment
          rationale: "The reconciliation row asks that the delta be applied correctly when the variant switches at the SCHEDULED -> DUE step; that instance asserts the obligation's required figure, the unit's principal_paid_cents and the line's availability after the switch."

  # ===========================================================================
  - section: validations
