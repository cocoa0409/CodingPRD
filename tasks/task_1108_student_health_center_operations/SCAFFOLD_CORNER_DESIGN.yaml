        distinguishing_aspect: "Double verify, verify with lapsed coverage, and STUDENT_PLAN for a LEAVE student each fail distinctly."
        test_recipe:
          setup: ["clock 2026-05-01; three students (one LEAVE); policy A valid, policy B with coverage already ended, policy C STUDENT_PLAN for the LEAVE student"]
          setup_api_calls:
            - { call: "POST /shc/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: HealthAdmin }
            - { call: "POST /shc/students", payload: { external_ref: "S24", full_name: "Pol A" }, as: HealthAdmin, captures: { sa: $.data.id, sa_v: $.data.version } }
            - { call: "POST /shc/insurance-policies", payload: { student_id: "${sa}", payer_type: "EXTERNAL", policy_number: "PA-1", coverage_start: "2026-04-01T00:00:00Z", coverage_end: "2027-03-31T00:00:00Z", copay_cents: 0, deductible_cents: 0, coinsurance_pct: 0.0, expected_student_version: "${sa_v}" }, as: BillingOfficer, captures: { pa: $.data.id } }
            - { call: "POST /shc/students", payload: { external_ref: "S25", full_name: "Pol B" }, as: HealthAdmin, captures: { sb: $.data.id, sb_v: $.data.version } }
            - { call: "POST /shc/insurance-policies", payload: { student_id: "${sb}", payer_type: "EXTERNAL", policy_number: "PB-1", coverage_start: "2026-01-01T00:00:00Z", coverage_end: "2026-04-01T00:00:00Z", copay_cents: 0, deductible_cents: 0, coinsurance_pct: 0.0, expected_student_version: "${sb_v}" }, as: BillingOfficer, captures: { pb: $.data.id } }
            - { call: "POST /shc/students", payload: { external_ref: "S26", full_name: "Pol C", enrollment_status: "LEAVE" }, as: HealthAdmin, captures: { sc: $.data.id, sc_v: $.data.version } }
            - { call: "POST /shc/insurance-policies", payload: { student_id: "${sc}", payer_type: "STUDENT_PLAN", policy_number: "PC-1", coverage_start: "2026-04-01T00:00:00Z", coverage_end: "2027-03-31T00:00:00Z", copay_cents: 0, deductible_cents: 0, coinsurance_pct: 0.0, expected_student_version: "${sc_v}" }, as: BillingOfficer, captures: { pc: $.data.id } }
          trigger:
            - { call: "POST /shc/insurance-policies/${pa}/verify", payload: {}, as: BillingOfficer }
            - { call: "POST /shc/insurance-policies/${pa}/verify", payload: {}, as: BillingOfficer, captures: { err1: $.data.error_id } }
            - { call: "POST /shc/insurance-policies/${pb}/verify", payload: {}, as: BillingOfficer, captures: { err2: $.data.error_id } }
            - { call: "POST /shc/insurance-policies/${pc}/verify", payload: {}, as: BillingOfficer, captures: { err3: $.data.error_id } }
          assert:
            - "trigger[0]: HTTP 200, status == VERIFIED, verified_at == 2026-05-01T00:00:00Z"
            - "trigger[1]: HTTP 409, error_id == ERR_POLICY_NOT_UNVERIFIED"
            - "trigger[2]: HTTP 422, error_id == ERR_POLICY_EXPIRED (coverage_end 2026-04-01 < now 2026-05-01)"
            - "trigger[3]: HTTP 422, error_id == ERR_POLICY_NOT_ELIGIBLE (STUDENT_PLAN requires ENROLLED)"

      - name: immunization_record_dose_error_matrix
        claim_type: invalid_transition
        grounds: [state_machines.ImmunizationRecord, "errors[ERR_DOSE_INTERVAL_VIOLATION]", "errors[ERR_DOSE_DATE_IN_FUTURE]", "errors[ERR_DUPLICATE_IMMUNIZATION_RECORD]", "errors[ERR_RECORD_NOT_DOSEABLE]"]
        distinguishing_aspect: "Dose inside the 28-day interval, future-dated dose, duplicate record for the same (student, requirement), and dosing an EXEMPTED record each fail distinctly; OCC versions are threaded from live responses."
        test_recipe:
          setup: ["clock 2026-05-01; MMR requirement (2 doses, 28-day interval, deadline 2026-08-01, grace 0); student with one PENDING record at version 1"]
          setup_api_calls:
            - { call: "POST /shc/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: HealthAdmin }
            - { call: "POST /shc/immunization-requirements", payload: { vaccine_code: "MMR", required_doses: 2, min_interval_days: 28, deadline_date: "2026-08-01", grace_period_days: 0 }, as: HealthAdmin, captures: { req: $.data.id } }
            - { call: "POST /shc/students", payload: { external_ref: "S27", full_name: "Dose Errors" }, as: HealthAdmin, captures: { stu: $.data.id } }
            - { call: "POST /shc/immunization-records", payload: { student_id: "${stu}", requirement_id: "${req}" }, as: Nurse, captures: { rec: $.data.id, rv1: $.data.version } }
            - { call: "POST /shc/immunization-records/${rec}/doses", payload: { dose_date: "2026-04-01", expected_record_version: "${rv1}" }, as: Nurse, captures: { rv2: $.data.version } }
          trigger:
            - { call: "POST /shc/immunization-records/${rec}/doses", payload: { dose_date: "2026-04-20", expected_record_version: "${rv2}" }, as: Nurse, captures: { err1: $.data.error_id } }
            - { call: "POST /shc/immunization-records/${rec}/doses", payload: { dose_date: "2026-05-02", expected_record_version: "${rv2}" }, as: Nurse, captures: { err2: $.data.error_id } }
            - { call: "POST /shc/immunization-records", payload: { student_id: "${stu}", requirement_id: "${req}" }, as: Nurse, captures: { err3: $.data.error_id } }
            - { call: "POST /shc/immunization-records/${rec}/exempt", payload: { exemption_reason: "medical contraindication" }, as: Clinician, captures: { rv3: $.data.version } }
            - { call: "POST /shc/immunization-records/${rec}/doses", payload: { dose_date: "2026-05-01", expected_record_version: "${rv3}" }, as: Nurse, captures: { err4: $.data.error_id } }
          assert:
            - "setup_api_calls[4]: dose 1 recorded; doses_received == 1, version == 2"
            - "trigger[0]: HTTP 422, error_id == ERR_DOSE_INTERVAL_VIOLATION (2026-04-20 < 2026-04-01 + 28d = 2026-04-29)"
            - "trigger[1]: HTTP 422, error_id == ERR_DOSE_DATE_IN_FUTURE (2026-05-02 > clock 2026-05-01)"
            - "trigger[2]: HTTP 409, error_id == ERR_DUPLICATE_IMMUNIZATION_RECORD"
            - "trigger[3]: HTTP 200, status == EXEMPTED (version captured as rv3)"
            - "trigger[4]: HTTP 409, error_id == ERR_RECORD_NOT_DOSEABLE (EXEMPTED terminal)"

