          trigger:
            - call: "POST /households/${hh_id}/budget-periods/${p1_id}/close"
              payload: { expected_household_version: "${hv} - 1" }
              as: HouseholdOwner
              as_user_id: "${owner_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_STALE_HOUSEHOLD"
            - "http_status == 412"

