scenario: |
  2819. Office Coffee Service & Equipment Program (Farmer Brothers office coffee service): account setup with headcount-based consumption modeling and equipment sizing, equipment loan versus rental terms tied to minimum purchase, route replenishment cadence with par levels and stockout escalation, brewer preventive maintenance, descaling and loaner swap, allied product breadth (creamer, tea, water, pantry) attachment, invoice consolidation for multi-site corporate accounts, equipment retrieval on cancellation and unreturned asset billing, price adjustment on green coffee market movement
domain_name: office-coffee-service-equipment-program
api_prefix: /ocs

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: posture_driven_gating
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: flat
  # Every entity is addressed at a top-level collection under /ocs and linked by
  # explicit FK body fields (no entity is nested inside another's URL path except
  # for action sub-paths on the owning resource itself). Site->Account,
  # EquipmentPlacement->Site/EquipmentAsset, ParLevel->Site/ProductItem,
  # InvoiceLine->ConsolidatedInvoice/Site/InvoiceLine are all FK references.

  state_machine_shape: parallel
  # EquipmentPlacement carries two independent state dimensions on one row
  # (placement_status x compliance_status) and MaintenanceWorkOrder carries
  # (wo_status x loaner_status); compliance_status and wo_status are themselves
  # cyclic, and PriceAdjustment branches then loops back to PROPOSED.

  relationship_patterns:
    - one_to_many          # Account->Site, Site->ParLevel, ConsolidatedInvoice->InvoiceLine
    - self_referential     # InvoiceLine.target_line_id -> InvoiceLine.id (CREDIT line points at the line it credits)
    - cross_aggregate      # EquipmentPlacement spans Site (account aggregate) and EquipmentAsset (fleet aggregate)
    - polymorphic          # InvoiceLine.line_type selects which upstream object produced the line (visit line, placement rent, placement shortfall, retrieval write-off)

  role_model: peer_roles
  # ProgramAdmin owns fleet/catalog/route configuration, AccountManager owns
  # account+site+placement lifecycle, RouteTechnician owns visit execution and
  # maintenance on its own route only, BillingSpecialist owns invoicing and
  # price adjustments, CustomerContact is the customer side and is the ONLY role
  # that may accept or dispute a price adjustment.

  consistency_model: immediate

entities:
  - name: Account
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: corporate customer legal name
        constraints: non-empty, max 200 chars
      - name: billing_mode
        type: enum
        source: input
        description: whether one invoice may span several sites of this account
        constraints: "CONSOLIDATED | PER_SITE"
      - name: program_posture
        type: enum
        source: computed
        description: derived program-level posture that gates child operations
        default: ONBOARDING
        constraints: "ONBOARDING | ACTIVE | AT_RISK | CANCELLATION_PENDING | CLOSED"
      - name: green_index_baseline_micros
        type: integer
        source: input
        description: green coffee index (micro-dollars per lb) locked at contract signing; reset to the accepted PriceAdjustment.index_current_micros on acceptance
        constraints: ">= 1"
      - name: green_price_factor_bps
        type: integer
        source: computed
        description: multiplier in basis points applied to ProductItem.base_unit_price_micros of products with green_coffee_linked == true; set to 10000 + PriceAdjustment.adjustment_pct_bps when an adjustment is ACCEPTED (absolute against the current baseline, never compounded)
        default: 10000
      - name: price_protection_days
        type: integer
        source: input
        description: days after an ACCEPTED PriceAdjustment during which no new PriceAdjustment may be proposed
        default: 90
        constraints: ">= 0"
      - name: price_protection_until
        type: datetime
        source: computed
        description: current_utc + price_protection_days at the moment a PriceAdjustment is ACCEPTED; null until then
        default: null
      - name: escalated_site_count
        type: integer
        source: computed
        description: count of Sites of this Account whose service_posture == ESCALATED; recomputed on every Site.service_posture change
        default: 0
      - name: receivable_balance_cents
        type: integer
        source: computed
        description: running receivable; += ConsolidatedInvoice.total_cents on issue, -= credit amount on every CREDIT line
        default: 0
      - name: allied_attachment_bps
        type: integer
        source: computed
        description: allied (non-COFFEE) share of PRODUCT line revenue in basis points over the trailing 90 days of issued invoices; 0 when the denominator is 0
        default: 0
      - name: cancel_reason
        type: string
        source: input
        description: reason captured by POST /ocs/accounts/{account_id}/cancel; null before cancellation
        default: null
      - name: retrieval_due_by
        type: datetime
        source: input
        description: retrieval deadline propagated to every placement moved to RETRIEVAL_SCHEDULED by cancellation; null before cancellation
        default: null
      - name: cancelled_at
        type: datetime
        source: system
        description: current_utc at cancellation; null before cancellation
        default: null

  - name: Site
    parent: null
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: input
        description: FK -> Account.id; owning corporate account
      - name: route_id
        type: string
        source: input
        description: FK -> Route.id; replenishment route that services this site
      - name: site_name
        type: string
        source: input
        description: break-room location label
        constraints: non-empty, max 200 chars
      - name: headcount
        type: integer
        source: input
        description: on-site employee headcount driving the consumption model
        constraints: ">= 1"
      - name: days_per_week
        type: integer
        source: input
        description: occupied days per week
        constraints: "1..7"
      - name: consumption_model
        type: enum
        source: input
        description: which variant of site_consumption_forecast POST /ocs/sites/{site_id}/size-and-plan uses
        constraints: "HEADCOUNT_MODEL | TRAILING_USAGE"
      - name: brew_style
        type: enum
        source: input
        description: brew style factor selector; set by size-and-plan, null until first plan
        default: null
        constraints: "DRIP | SINGLE_CUP | ESPRESSO"
      - name: service_minutes_estimate
        type: integer
        source: input
        description: technician minutes a standard visit to this site consumes
        constraints: "1..480"
      - name: service_posture
        type: enum
        source: computed
        description: derived site posture gating visit scheduling; ESCALATED when site_escalation_score >= 40.0, SUSPENDED on placement retrieval scheduling, CLOSED once the retrieval completes on a cancelling account
        default: ACTIVE
        constraints: "ACTIVE | ESCALATED | SUSPENDED | CLOSED"
      - name: forecast_cups_per_week
        type: integer
        source: computed
        description: output of site_consumption_forecast; 0 until size-and-plan runs
        default: 0
      - name: required_peak_cups_per_hour
        type: integer
        source: computed
        description: ceil(forecast_cups_per_week / days_per_week * PEAK_FACTOR); eligibility input of equipment_sizing_selector
        default: 0
      - name: recommended_model_id
        type: string
        source: computed
        description: EquipmentModel.id chosen by the equipment_sizing_selector in §1.3; computed by size-and-plan, never client-supplied, and never used as a reverse-lookup key
        default: null
      - name: consecutive_shortfall_visit_count
        type: integer
        source: computed
        description: number of consecutive COMPLETED visits on this site whose shortfall_flag was true; reset to 0 by a COMPLETED visit with shortfall_flag false
        default: 0
      - name: escalation_score
        type: number
        source: computed
        description: output of site_escalation_score, recomputed after every visit completion, visit void and work-order resolution
        default: 0
        constraints: "0..100, one decimal place"

  - name: Route
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: route label
        constraints: non-empty, max 100 chars
      - name: service_day
        type: enum
        source: input
        description: weekday this route runs
        constraints: "MON | TUE | WED | THU | FRI"
      - name: capacity_minutes
        type: integer
        source: input
        description: technician minutes available per calendar service date on this route
        constraints: "1..960"
      - name: travel_buffer_minutes
        type: integer
        source: input
        description: buffer minutes added on BOTH sides of every occupied visit window when testing a new window for collision
        default: 30
        constraints: "0..120"
      - name: booked_minutes_total
        type: integer
        source: computed
        description: sum of planned_minutes over this route's visits whose visit_status is SCHEDULED or COMPLETED; decremented when a visit is CANCELLED or VOIDED
        default: 0

  - name: EquipmentModel
    parent: null
    common_fields: false
    fields:
      - name: model_code
        type: string
        source: input
        description: catalog code
        constraints: unique, non-empty
      - name: brewer_class
        type: enum
        source: input
        description: brewer family
        constraints: "AIRPOT | THERMAL | SINGLE_CUP | ESPRESSO"
      - name: cups_per_hour_capacity
        type: integer
        source: input
        description: brewing throughput used by equipment_sizing_selector ranking
        constraints: ">= 1"
      - name: min_headcount
        type: integer
        source: input
        description: lowest site headcount this model may serve (inclusive)
        constraints: ">= 1"
      - name: max_headcount
        type: integer
        source: input
        description: highest site headcount this model may serve (inclusive)
        constraints: ">= min_headcount"
      - name: monthly_rent_cents
        type: integer
        source: input
        description: full-month rent charged only under terms_type == RENTAL
        constraints: ">= 0"
      - name: descale_interval_days
        type: integer
        source: input
        description: maximum days between descale services before the asset counts as descale-overdue
        constraints: ">= 1"
      - name: list_value_cents
        type: integer
        source: input
        description: replacement value used by unreturned_asset_charge
        constraints: ">= 0"

  - name: EquipmentAsset
    parent: null
    common_fields: true
    fields:
      - name: model_id
        type: string
        source: input
        description: FK -> EquipmentModel.id; catalog model of this serialized asset
      - name: serial_number
        type: string
        source: input
        description: fleet serial number
        constraints: unique, non-empty
      - name: asset_role
        type: enum
        source: input
        description: PLACEMENT assets may be placed at a site; LOANER assets may only be attached to a MaintenanceWorkOrder as a swap unit
        constraints: "PLACEMENT | LOANER"
      - name: asset_status
        type: enum
        source: computed
        description: fleet state; see the EquipmentAsset state machine
        default: IN_STOCK
        constraints: "IN_STOCK | PLACED | ON_LOAN | RECONDITIONING | UNRETURNED | RETIRED"
      - name: last_descale_at
        type: datetime
        source: computed
        description: current_utc at asset creation, then current_utc whenever a DESCALE work order is RESOLVED
      - name: reconditioning_until
        type: datetime
        source: computed
        description: loaner_returned_on + RECONDITIONING_DAYS; while current_utc < this instant the asset is under sanitation hold and may not be re-issued
        default: null

  - name: EquipmentPlacement
    parent: null
    common_fields: true
    fields:
      - name: site_id
        type: string
        source: input
        description: FK -> Site.id; site the brewer is installed at
      - name: asset_id
        type: string
        source: input
        description: FK -> EquipmentAsset.id; the installed asset (asset_role must be PLACEMENT)
      - name: terms_type
        type: enum
        source: input
        description: LOAN places the brewer free of rent against a minimum purchase commitment; RENTAL charges monthly rent and waives the shortfall fee
        constraints: "LOAN | RENTAL"
      - name: minimum_purchase_cents
        type: integer
        source: input
        description: trailing-window PRODUCT purchase commitment for this site; under LOAN it must be >= LOAN_MINIMUM_FLOOR_CENTS
        constraints: ">= 0"
      - name: min_term_months
        type: integer
        source: input
        description: contracted minimum term in months
        constraints: "1..60"
      - name: placement_status
        type: enum
        source: computed
        description: installation dimension of this row; independent of compliance_status
        default: ACTIVE
        constraints: "ACTIVE | RETRIEVAL_SCHEDULED | RETRIEVED | UNRETURNED_BILLED | SUPERSEDED"
      - name: compliance_status
        type: enum
        source: computed
        description: minimum-purchase dimension of this row; independent of placement_status and cyclic (SHORTFALL_BILLED can return to MEETING_MINIMUM)
        default: MEETING_MINIMUM
        constraints: "MEETING_MINIMUM | SHORTFALL_WARNED | SHORTFALL_BILLED"
      - name: trailing_purchase_cents
        type: integer
        source: computed
        description: output of trailing_purchase_rollup at the last evaluate-compliance call
        default: 0
      - name: shortfall_fee_cents
        type: integer
        source: computed
        description: unbilled shortfall charge produced by equipment_program_charge when compliance_status becomes SHORTFALL_BILLED; reset to 0 once a SHORTFALL invoice line is emitted for it
        default: 0
      - name: rent_charge_cents
        type: integer
        source: computed
        description: prorated RENT amount computed by equipment_program_charge during invoice draft assembly; 0 under LOAN terms
        default: 0
      - name: placed_at
        type: datetime
        source: system
        description: current_utc at placement creation
      - name: retrieval_due_by
        type: datetime
        source: computed
        description: copied from Account.retrieval_due_by when cancellation schedules retrieval; null while ACTIVE
        default: null
      - name: unreturned_billed_cents
        type: integer
        source: computed
        description: output of unreturned_asset_charge once the placement is billed as unreturned; 0 otherwise
        default: 0

  - name: ProductItem
    parent: null
    common_fields: false
    fields:
      - name: sku
        type: string
        source: input
        description: catalog SKU
        constraints: unique, non-empty
      - name: category
        type: enum
        source: input
        description: product family; every category other than COFFEE counts as allied breadth
        constraints: "COFFEE | CREAMER | TEA | WATER | PANTRY"
      - name: base_unit_price_micros
        type: integer
        source: input
        description: list price per sales unit in micro-dollars (1 cent == 10000 micros)
        constraints: ">= 1"
      - name: pack_units
        type: integer
        source: input
        description: sales units per shipping case (reporting only; par levels are expressed in sales units)
        constraints: ">= 1"
      - name: green_coffee_linked
        type: boolean
        source: input
        description: whether Account.green_price_factor_bps applies to this product's effective price
        default: false

  - name: ParLevel
    parent: null
    common_fields: true
    fields:
      - name: site_id
        type: string
        source: input
        description: FK -> Site.id; site whose break room holds this stock line
      - name: product_id
        type: string
        source: input
        description: FK -> ProductItem.id; the stocked product
      - name: par_units
        type: integer
        source: input
        description: target on-shelf sales units; recomputed by size-and-plan for source == FORECAST rows and client-supplied for source == MANUAL rows
        constraints: ">= 0"
      - name: reorder_point_units
        type: integer
        source: input
        description: on_hand_units at or below which the line is LOW
        constraints: "0 <= reorder_point_units <= par_units"
      - name: source
        type: enum
        source: computed
        description: FORECAST rows are (re)generated by size-and-plan; MANUAL rows are created by POST /ocs/par-levels and are never overwritten by size-and-plan
        constraints: "FORECAST | MANUAL"
      - name: on_hand_units
        type: integer
        source: computed
        description: current shelf quantity; invariant on_hand_units == cumulative_delivered_units - cumulative_consumed_units at all times
        default: 0
      - name: cumulative_delivered_units
        type: integer
        source: computed
        description: lifetime delivered units across COMPLETED, non-voided visits; decremented when a visit is voided
        default: 0
      - name: cumulative_consumed_units
        type: integer
        source: computed
        description: lifetime modeled consumption debited at visit completion; decremented when a visit is voided
        default: 0
      - name: last_service_at
        type: datetime
        source: computed
        description: window_start of the last COMPLETED visit that touched this line, else the row's created_at; consumption_debit measures elapsed days from here
      - name: stock_status
        type: enum
        source: computed
        description: STOCKOUT when on_hand_units == 0, LOW when 0 < on_hand_units <= reorder_point_units, IN_STOCK otherwise
        default: STOCKOUT
        constraints: "IN_STOCK | LOW | STOCKOUT"

  - name: ServiceVisit
    parent: null
    common_fields: true
    fields:
      - name: site_id
        type: string
        source: input
        description: FK -> Site.id; site being replenished
      - name: route_id
        type: string
        source: input
        description: FK -> Route.id; copied from Site.route_id at scheduling and never client-supplied
      - name: window_start
        type: datetime
        source: input
        description: inclusive start of the service window
      - name: window_end
        type: datetime
        source: input
        description: exclusive end of the service window
        constraints: "> window_start"
      - name: planned_minutes
        type: integer
        source: input
        description: technician minutes this visit books against Route.capacity_minutes for the window_start calendar date
        constraints: "1..480"
      - name: visit_status
        type: enum
        source: computed
        description: see the ServiceVisit state machine
        default: SCHEDULED
        constraints: "SCHEDULED | COMPLETED | CANCELLED | VOIDED"
      - name: lines
        type: array
        source: computed
        description: "requested/delivered detail; each element is { product_id, requested_units, delivered_units, consumed_units, effective_unit_price_micros, resulting_on_hand_units }. requested_units is appended by POST /ocs/service-visits/{visit_id}/lines; the remaining members are stamped at completion"
        default: []
      - name: shortfall_flag
        type: boolean
        source: computed
        description: true when at least one line completed with delivered_units < requested_units
        default: false
      - name: completed_at
        type: datetime
        source: system
        description: current_utc at completion; null otherwise
        default: null
      - name: void_reason
        type: string
        source: input
        description: reason recorded by POST /ocs/service-visits/{visit_id}/void; null otherwise
        default: null

  - name: MaintenanceWorkOrder
    parent: null
    common_fields: true
    fields:
      - name: asset_id
        type: string
        source: input
        description: FK -> EquipmentAsset.id; the placed brewer under service
      - name: site_id
        type: string
        source: input
        description: FK -> Site.id; copied from the asset's ACTIVE EquipmentPlacement at creation, never client-supplied
      - name: wo_type
        type: enum
        source: input
        description: PREVENTIVE is the scheduled check, DESCALE clears the descale clock, REPAIR is corrective
        constraints: "PREVENTIVE | DESCALE | REPAIR"
      - name: wo_status
        type: enum
        source: computed
        description: service dimension of this row; cyclic between IN_PROGRESS and AWAITING_PARTS
        default: OPEN
        constraints: "OPEN | IN_PROGRESS | AWAITING_PARTS | RESOLVED"
      - name: parts_eta
        type: datetime
        source: input
        description: expected parts arrival recorded on each entry into AWAITING_PARTS; null otherwise
        default: null
      - name: awaiting_parts_cycles
        type: integer
        source: computed
        description: number of times this work order has entered AWAITING_PARTS; a fourth entry is rejected
        default: 0
      - name: resolution_note
        type: string
        source: input
        description: note recorded on resolution; null otherwise
        default: null
      - name: loaner_asset_id
        type: string
        source: input
        description: FK -> EquipmentAsset.id; loaner unit swapped in while the brewer is serviced; null until a loaner swap happens
        default: null
      - name: loaner_out_date
        type: datetime
        source: input
        description: inclusive first date the loaner occupies (date granularity, midnight UTC)
        default: null
      - name: loaner_due_back_date
        type: datetime
        source: input
        description: inclusive last date the loaner may stay out (date granularity, midnight UTC)
        default: null
      - name: loaner_returned_on
        type: datetime
        source: input
        description: date the loaner came back; null while out
        default: null
      - name: loaner_status
        type: enum
        source: computed
        description: loaner dimension of this row, independent of wo_status
        default: NONE
        constraints: "NONE | OUT | RETURNED | OVERDUE | WRITTEN_OFF"

  - name: ConsolidatedInvoice
    parent: null
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: input
        description: FK -> Account.id; billed account
      - name: site_id
        type: string
        source: input
        description: FK -> Site.id; single-site scope, REQUIRED when Account.billing_mode == PER_SITE and forbidden when it is CONSOLIDATED
        default: null
      - name: period_start
        type: datetime
        source: input
        description: inclusive first instant of the billed period
      - name: period_end
        type: datetime
        source: input
        description: inclusive last instant of the billed period
        constraints: "> period_start"
      - name: invoice_status
        type: enum
        source: computed
        description: see the ConsolidatedInvoice state machine
        default: DRAFT
        constraints: "DRAFT | ISSUED | PARTIALLY_CREDITED | FULLY_CREDITED | VOID"
      - name: allied_category_count
        type: integer
        source: computed
        description: distinct non-COFFEE ProductItem categories among this invoice's PRODUCT lines
        default: 0
      - name: allied_discount_bps
        type: integer
        source: computed
        description: breadth discount rate selected by invoice_assembly_order step 4 from allied_category_count and pre_freight_total_cents
        default: 0
      - name: pre_freight_total_cents
        type: integer
        source: computed
        description: sum of PRODUCT + RENT + SHORTFALL + UNRETURNED_ASSET line amounts, before discount and freight; the ONLY value the freight waiver and the discount tier are keyed on
        default: 0
      - name: allied_discount_cents
        type: integer
        source: computed
        description: absolute value of the sum of ALLIED_DISCOUNT lines
        default: 0
      - name: freight_cents
        type: integer
        source: computed
        description: FREIGHT_FEE_CENTS when pre_freight_total_cents < FREE_FREIGHT_THRESHOLD_CENTS, else 0
        default: 0
      - name: total_cents
        type: integer
        source: computed
        description: sum of every InvoiceLine.amount_cents on this invoice (CREDIT and ALLIED_DISCOUNT lines are negative); recomputed after each credit
        default: 0
      - name: line_count
        type: integer
        source: computed
        description: number of InvoiceLine rows on this invoice
        default: 0
      - name: issued_at
        type: datetime
        source: system
        description: current_utc at issue; null while DRAFT
        default: null

  - name: InvoiceLine
    parent: null
    common_fields: true
    fields:
      - name: invoice_id
        type: string
        source: input
        description: FK -> ConsolidatedInvoice.id; owning invoice
      - name: site_id
        type: string
        source: input
        description: FK -> Site.id; site the charge belongs to; null only for CREDIT lines that credit a non-site line
        default: null
      - name: target_line_id
        type: string
        source: input
        description: FK -> InvoiceLine.id; set on CREDIT lines to the line being credited, null on every other line_type
        default: null
      - name: line_type
        type: enum
        source: computed
        description: which upstream object produced the line
        constraints: "PRODUCT | RENT | SHORTFALL | UNRETURNED_ASSET | ALLIED_DISCOUNT | FREIGHT | CREDIT"
      - name: product_id
        type: string
        source: computed
        description: ProductItem.id for PRODUCT lines, null otherwise; identity reference only, never a decision input
        default: null
      - name: qty_units
        type: integer
        source: computed
        description: delivered sales units for PRODUCT lines, 0 for every other line_type
        default: 0
      - name: unit_price_micros
        type: integer
        source: computed
        description: effective_unit_price_micros snapshotted on the visit line at completion; never recomputed at invoice time
        default: 0
      - name: amount_cents
        type: integer
        source: computed
        description: line amount in cents; negative for ALLIED_DISCOUNT and CREDIT lines
      - name: credits_applied_cents
        type: integer
        source: computed
        description: absolute cents already credited against this line
        default: 0
      - name: credit_reason
        type: string
        source: input
        description: reason on CREDIT lines; null otherwise
        default: null

  - name: PriceAdjustment
    parent: null
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: input
        description: FK -> Account.id; account the adjustment is proposed to
      - name: index_baseline_micros
        type: integer
        source: computed
        description: Account.green_index_baseline_micros snapshotted at proposal
      - name: index_current_micros
        type: integer
        source: computed
        description: market green index at proposal, taken from the logical market quote set by POST /ocs/_market/set_green_index
      - name: movement_bps
        type: integer
        source: computed
        description: signed index movement in basis points; output of green_index_adjustment step 1
      - name: adjustment_pct_bps
        type: integer
        source: computed
        description: signed pass-through in basis points after the cap; output of green_index_adjustment step 3, overwritten by a revision
        constraints: "-1500..1500"
      - name: adj_status
        type: enum
        source: computed
        description: see the PriceAdjustment state machine
        default: PROPOSED
        constraints: "PROPOSED | ACCEPTED | DISPUTED | DEFERRED"
      - name: dispute_reason
        type: string
        source: input
        description: customer reason recorded on dispute; null otherwise
        default: null
      - name: revision_count
        type: integer
        source: computed
        description: number of times BillingSpecialist has revised this adjustment after a dispute
        default: 0
      - name: effective_at
        type: datetime
        source: input
        description: date the new prices take effect on acceptance
      - name: accepted_at
        type: datetime
        source: system
        description: current_utc at acceptance; null otherwise
        default: null

state_machines:
  - entity: Account
    dimension: program_posture
    initial_state: ONBOARDING
    terminal_states: [CLOSED]
    transitions:
      - from: ONBOARDING
        to: ACTIVE
        trigger: "POST /ocs/equipment-placements (first placement of any site of this account reaching placement_status ACTIVE)"
        actor: system
        preconditions: ["Account.program_posture == ONBOARDING"]
        side_effects:
          - "Account.program_posture := ACTIVE"
          - "increments Account.version by 1"
        note: "Bubble-up: the account leaves onboarding the moment equipment is installed anywhere."
      - from: ACTIVE
        to: AT_RISK
        trigger: "system: a Site of this account entered service_posture ESCALATED (cascade hop 3 of the visit-completion chain)"
        actor: system
        preconditions:
          - "Account.escalated_site_count (recomputed after the Site posture change) >= AT_RISK_SITE_THRESHOLD"
          - "Account.program_posture == ACTIVE"
        side_effects:
          - "Account.program_posture := AT_RISK"
          - "every PriceAdjustment of this account with adj_status == PROPOSED is moved to DEFERRED (cascade hop 4)"
          - "increments Account.version by 1"
      - from: AT_RISK
        to: ACTIVE
        trigger: "system: a Site of this account left service_posture ESCALATED (recovery hop of the visit-completion chain)"
        actor: system
        preconditions:
          - "Account.escalated_site_count (recomputed after the Site posture change) < AT_RISK_SITE_THRESHOLD"
          - "Account.program_posture == AT_RISK"
        side_effects:
          - "Account.program_posture := ACTIVE"
          - "every PriceAdjustment of this account with adj_status == DEFERRED is moved back to PROPOSED"
          - "increments Account.version by 1"
        note: "Closes the ACTIVE -> AT_RISK -> ACTIVE cycle."
      - from: ACTIVE
        to: CANCELLATION_PENDING
        trigger: "POST /ocs/accounts/{account_id}/cancel"
        actor: AccountManager
        preconditions: ["Account.program_posture IN {ONBOARDING, ACTIVE, AT_RISK}"]
        side_effects:
          - "Account.cancel_reason, Account.retrieval_due_by, Account.cancelled_at stamped"
          - "cascade hop 1: every EquipmentPlacement of this account's sites with placement_status == ACTIVE is moved to RETRIEVAL_SCHEDULED with retrieval_due_by copied from Account.retrieval_due_by"
          - "every ConsolidatedInvoice of this account with invoice_status == DRAFT is moved to VOID"
          - "increments Account.version by 1"
      - from: AT_RISK
        to: CANCELLATION_PENDING
        trigger: "POST /ocs/accounts/{account_id}/cancel"
        actor: AccountManager
        preconditions: ["Account.program_posture IN {ONBOARDING, ACTIVE, AT_RISK}"]
        side_effects:
          - "identical to the ACTIVE -> CANCELLATION_PENDING transition, including the placement retrieval cascade and DRAFT invoice voiding"
          - "increments Account.version by 1"
      - from: ONBOARDING
        to: CANCELLATION_PENDING
        trigger: "POST /ocs/accounts/{account_id}/cancel"
        actor: AccountManager
        preconditions: ["Account.program_posture IN {ONBOARDING, ACTIVE, AT_RISK}"]
        side_effects:
          - "identical to the ACTIVE -> CANCELLATION_PENDING transition; with no ACTIVE placement the retrieval cascade is a no-op"
          - "increments Account.version by 1"
      - from: CANCELLATION_PENDING
        to: CLOSED
        trigger: "POST /ocs/equipment-placements/{placement_id}/retrieve (last non-terminal placement of the account)"
        actor: system
        preconditions:
          - "Account.program_posture == CANCELLATION_PENDING"
          - "every EquipmentPlacement of this account has placement_status IN {RETRIEVED, UNRETURNED_BILLED, SUPERSEDED}"
        side_effects:
          - "Account.program_posture := CLOSED"
          - "every Site of this account with service_posture == SUSPENDED is moved to CLOSED"
          - "increments Account.version by 1"

  - entity: Site
    dimension: service_posture
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: ESCALATED
        trigger: "system: recomputation of site_escalation_score after POST /ocs/service-visits/{visit_id}/complete flipped one or more ParLevel rows of this site to stock_status STOCKOUT (cascade hop 2)"
        actor: system
        preconditions:
          - "Site.escalation_score (recomputed) >= ESCALATION_THRESHOLD"
          - "Site.service_posture == ACTIVE"
        side_effects:
          - "Site.service_posture := ESCALATED"
          - "Account.escalated_site_count recomputed, which can carry the chain into Account ACTIVE -> AT_RISK (cascade hop 3)"
          - "increments Site.version by 1"
      - from: ESCALATED
        to: ACTIVE
        trigger: "system: recomputation of site_escalation_score after POST /ocs/service-visits/{visit_id}/complete, POST /ocs/service-visits/{visit_id}/void or POST /ocs/maintenance-work-orders/{work_order_id}/advance with to_status RESOLVED"
        actor: system
        preconditions:
          - "Site.escalation_score (recomputed) < ESCALATION_THRESHOLD"
          - "Site.service_posture == ESCALATED"
        side_effects:
          - "Site.service_posture := ACTIVE"
          - "Account.escalated_site_count recomputed, which can carry the chain into Account AT_RISK -> ACTIVE"
          - "increments Site.version by 1"
        note: "ACTIVE <-> ESCALATED is a true cycle: a site may escalate and recover any number of times."
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system: an EquipmentPlacement of this site entered RETRIEVAL_SCHEDULED (cascade hop 2 of the cancellation chain)"
        actor: system
        preconditions: ["Site.service_posture IN {ACTIVE, ESCALATED}"]
        side_effects:
          - "Site.service_posture := SUSPENDED"
          - "cascade hop 3: every ServiceVisit of this site with visit_status == SCHEDULED is moved to CANCELLED, and each cancellation decrements Route.booked_minutes_total by that visit's planned_minutes"
          - "increments Site.version by 1"
      - from: ESCALATED
        to: SUSPENDED
        trigger: "system: an EquipmentPlacement of this site entered RETRIEVAL_SCHEDULED (cascade hop 2 of the cancellation chain)"
        actor: system
        preconditions: ["Site.service_posture IN {ACTIVE, ESCALATED}"]
        side_effects:
          - "identical to ACTIVE -> SUSPENDED, including the SCHEDULED visit cancellation hop and the Route.booked_minutes_total release"
          - "Account.escalated_site_count recomputed (the site no longer counts as escalated)"
          - "increments Site.version by 1"
      - from: SUSPENDED
        to: CLOSED
        trigger: "system: the account reached program_posture CLOSED after the last placement retrieval"
        actor: system
        preconditions: ["Account.program_posture == CLOSED"]
        side_effects:
          - "Site.service_posture := CLOSED"
          - "increments Site.version by 1"

  - entity: EquipmentPlacement
    dimension: placement_status
    initial_state: ACTIVE
    terminal_states: [RETRIEVED, SUPERSEDED]
    transitions:
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "POST /ocs/equipment-placements (a new placement is created for the same site)"
        actor: AccountManager
        preconditions:
          - "expected_site_version equals the current Site.version (§1.2.1 placement-create-stale-site)"
          - "the prior placement has placement_status == ACTIVE"
        side_effects:
          - "prior placement placement_status := SUPERSEDED"
          - "prior placement's EquipmentAsset.asset_status := IN_STOCK"
          - "increments Site.version by 1"
      - from: ACTIVE
        to: RETRIEVAL_SCHEDULED
        trigger: "system: POST /ocs/accounts/{account_id}/cancel moved the account to CANCELLATION_PENDING (cascade hop 1)"
        actor: system
        preconditions: ["placement_status == ACTIVE"]
        side_effects:
          - "placement_status := RETRIEVAL_SCHEDULED; retrieval_due_by := Account.retrieval_due_by"
          - "cascade hop 2: Site.service_posture := SUSPENDED"
          - "increments EquipmentPlacement.version by 1"
      - from: RETRIEVAL_SCHEDULED
        to: RETRIEVED
        trigger: "POST /ocs/equipment-placements/{placement_id}/retrieve"
        actor: AccountManager
        preconditions: ["placement_status IN {RETRIEVAL_SCHEDULED, UNRETURNED_BILLED}"]
        side_effects:
          - "placement_status := RETRIEVED"
          - "EquipmentAsset.asset_status := RETIRED when retrieved_asset_condition == UNSERVICEABLE, else RECONDITIONING with reconditioning_until := current_utc + RECONDITIONING_DAYS"
          - "when every placement of the account is terminal and the account is CANCELLATION_PENDING, Account.program_posture := CLOSED and its SUSPENDED sites become CLOSED"
      - from: RETRIEVAL_SCHEDULED
        to: UNRETURNED_BILLED
        trigger: "system: POST /ocs/consolidated-invoices assembles a draft while current_utc > placement.retrieval_due_by"
        actor: system
        preconditions:
          - "placement_status == RETRIEVAL_SCHEDULED"
          - "current_utc > placement.retrieval_due_by"
        side_effects:
          - "unreturned_billed_cents := unreturned_asset_charge output"
          - "an UNRETURNED_ASSET InvoiceLine for that amount is appended to the draft"
          - "EquipmentAsset.asset_status := UNRETURNED"
          - "placement_status := UNRETURNED_BILLED"
      - from: UNRETURNED_BILLED
        to: RETRIEVED
        trigger: "POST /ocs/equipment-placements/{placement_id}/retrieve (asset surfaced after it was written off)"
        actor: AccountManager
        preconditions: ["placement_status IN {RETRIEVAL_SCHEDULED, UNRETURNED_BILLED}"]
        side_effects:
          - "placement_status := RETRIEVED"
          - "EquipmentAsset.asset_status := RETIRED when retrieved_asset_condition == UNSERVICEABLE, else RECONDITIONING"
          - "the already-issued UNRETURNED_ASSET line is NOT auto-credited; BillingSpecialist must post the compensating CREDIT line explicitly"

  - entity: EquipmentPlacement
    dimension: compliance_status
    initial_state: MEETING_MINIMUM
    terminal_states: []
    transitions:
      - from: MEETING_MINIMUM
        to: SHORTFALL_WARNED
        trigger: "POST /ocs/equipment-placements/{placement_id}/evaluate-compliance"
        actor: BillingSpecialist
        preconditions:
          - "placement_status IN {ACTIVE, RETRIEVAL_SCHEDULED}"
          - "trailing_purchase_rollup output < minimum_purchase_cents"
        side_effects:
          - "trailing_purchase_cents := rollup output; compliance_status := SHORTFALL_WARNED; no fee is accrued on the first miss"
      - from: SHORTFALL_WARNED
        to: SHORTFALL_BILLED
        trigger: "POST /ocs/equipment-placements/{placement_id}/evaluate-compliance"
        actor: BillingSpecialist
        preconditions:
          - "placement_status IN {ACTIVE, RETRIEVAL_SCHEDULED}"
          - "trailing_purchase_rollup output < minimum_purchase_cents"
        side_effects:
          - "trailing_purchase_cents := rollup output"
          - "shortfall_fee_cents := equipment_program_charge shortfall component for this terms_type"
          - "compliance_status := SHORTFALL_BILLED"
      - from: SHORTFALL_BILLED
        to: MEETING_MINIMUM
        trigger: "POST /ocs/equipment-placements/{placement_id}/evaluate-compliance"
        actor: BillingSpecialist
        preconditions:
          - "placement_status IN {ACTIVE, RETRIEVAL_SCHEDULED}"
          - "trailing_purchase_rollup output >= minimum_purchase_cents"
        side_effects:
          - "trailing_purchase_cents := rollup output; compliance_status := MEETING_MINIMUM; shortfall_fee_cents := 0 only if no SHORTFALL line has been emitted yet"
        note: "Closes the MEETING_MINIMUM -> SHORTFALL_WARNED -> SHORTFALL_BILLED -> MEETING_MINIMUM cycle; this dimension evolves independently of placement_status."
      - from: SHORTFALL_WARNED
        to: MEETING_MINIMUM
        trigger: "POST /ocs/equipment-placements/{placement_id}/evaluate-compliance"
        actor: BillingSpecialist
        preconditions:
          - "placement_status IN {ACTIVE, RETRIEVAL_SCHEDULED}"
          - "trailing_purchase_rollup output >= minimum_purchase_cents"
        side_effects:
          - "trailing_purchase_cents := rollup output; compliance_status := MEETING_MINIMUM"

  - entity: ServiceVisit
    dimension: visit_status
    initial_state: SCHEDULED
    terminal_states: [CANCELLED, VOIDED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /ocs/service-visits/{visit_id}/complete"
        actor: RouteTechnician
        preconditions:
          - "visit_status == SCHEDULED"
          - "current_utc >= window_start"
          - "X-User-ID == ServiceVisit.route_id"
          - "Site.service_posture IN {ACTIVE, ESCALATED}"
          - "every delivered_lines[].product_id already appears in ServiceVisit.lines"
          - "every delivered_lines[].delivered_units <= that line's requested_units"
        side_effects:
          - "for every ServiceVisit.lines element: consumed_units := consumption_debit output, delivered_units := the reported value (0 when the product is absent from delivered_lines), effective_unit_price_micros := effective_unit_price output, resulting_on_hand_units := ParLevel.on_hand_units after the write"
          - "cascade hop 1: for each touched ParLevel: cumulative_consumed_units += consumed_units, cumulative_delivered_units += delivered_units, on_hand_units := cumulative_delivered_units - cumulative_consumed_units, last_service_at := visit.window_start, stock_status recomputed (STOCKOUT when on_hand_units == 0)"
          - "shortfall_flag := true when any line has delivered_units < requested_units; Site.consecutive_shortfall_visit_count += 1 when shortfall_flag is true, else := 0"
          - "cascade hop 2: Site.escalation_score recomputed from the new STOCKOUT count, which can move Site.service_posture ACTIVE -> ESCALATED (and from there hops 3 and 4)"
          - "completed_at := current_utc"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "system: the Site entered service_posture SUSPENDED (cascade hop 3 of the cancellation chain)"
        actor: system
        preconditions: ["visit_status == SCHEDULED"]
        side_effects:
          - "visit_status := CANCELLED"
          - "Route.booked_minutes_total -= planned_minutes"
      - from: COMPLETED
        to: VOIDED
        trigger: "POST /ocs/service-visits/{visit_id}/void"
        actor: ProgramAdmin
        preconditions:
          - "visit_status == COMPLETED"
          - "no ConsolidatedInvoice with invoice_status != VOID exists for this site's account whose period_start <= window_start <= period_end"
        side_effects:
          - "visit_status := VOIDED; void_reason stamped"
          - "compensation: for each touched ParLevel: cumulative_delivered_units -= that line's delivered_units, cumulative_consumed_units -= that line's consumed_units, on_hand_units := cumulative_delivered_units - cumulative_consumed_units, stock_status recomputed"
          - "ParLevel.last_service_at := window_start of the most recent remaining COMPLETED visit touching that line, else the ParLevel's created_at"
          - "Route.booked_minutes_total -= planned_minutes"
          - "Site.consecutive_shortfall_visit_count recomputed over the remaining COMPLETED visits, then Site.escalation_score recomputed (which may move the site ESCALATED -> ACTIVE and the account AT_RISK -> ACTIVE)"
        note: "Compensating action for the ParLevel unit invariant: on_hand_units == cumulative_delivered_units - cumulative_consumed_units must hold before and after, with no drift."

  - entity: MaintenanceWorkOrder
    dimension: wo_status
    initial_state: OPEN
    terminal_states: [RESOLVED]
    transitions:
      - from: OPEN
        to: IN_PROGRESS
        trigger: "POST /ocs/maintenance-work-orders/{work_order_id}/advance with to_status == IN_PROGRESS"
        actor: RouteTechnician
        preconditions: ["wo_status IN {OPEN, AWAITING_PARTS}"]
        side_effects: ["wo_status := IN_PROGRESS"]
      - from: IN_PROGRESS
        to: AWAITING_PARTS
        trigger: "POST /ocs/maintenance-work-orders/{work_order_id}/advance with to_status == AWAITING_PARTS"
        actor: RouteTechnician
        preconditions:
          - "wo_status == IN_PROGRESS"
          - "parts_eta present in the request"
          - "awaiting_parts_cycles < MAX_AWAITING_PARTS_CYCLES"
        side_effects: ["wo_status := AWAITING_PARTS; parts_eta stamped; awaiting_parts_cycles += 1"]
      - from: AWAITING_PARTS
        to: IN_PROGRESS
        trigger: "POST /ocs/maintenance-work-orders/{work_order_id}/advance with to_status == IN_PROGRESS"
        actor: RouteTechnician
        preconditions: ["wo_status IN {OPEN, AWAITING_PARTS}"]
        side_effects: ["wo_status := IN_PROGRESS"]
        note: "IN_PROGRESS <-> AWAITING_PARTS is a true cycle, bounded at MAX_AWAITING_PARTS_CYCLES entries into AWAITING_PARTS."
      - from: IN_PROGRESS
        to: RESOLVED
        trigger: "POST /ocs/maintenance-work-orders/{work_order_id}/advance with to_status == RESOLVED"
        actor: RouteTechnician
        preconditions:
          - "wo_status == IN_PROGRESS"
          - "loaner_status IN {NONE, RETURNED, WRITTEN_OFF}"
          - "when wo_type == PREVENTIVE: the asset is not descale-overdue, i.e. current_utc - EquipmentAsset.last_descale_at <= EquipmentModel.descale_interval_days"
        side_effects:
          - "wo_status := RESOLVED; resolution_note stamped"
          - "when wo_type == DESCALE: EquipmentAsset.last_descale_at := current_utc"
          - "Site.escalation_score recomputed (the overdue-descale term may drop), which can move Site.service_posture ESCALATED -> ACTIVE and then Account AT_RISK -> ACTIVE"

  - entity: MaintenanceWorkOrder
    dimension: loaner_status
    initial_state: NONE
    terminal_states: [WRITTEN_OFF]
    transitions:
      - from: NONE
        to: OUT
        trigger: "POST /ocs/maintenance-work-orders/{work_order_id}/loaner-swap"
        actor: RouteTechnician
        preconditions:
          - "loaner_status == NONE"
          - "wo_status IN {OPEN, IN_PROGRESS, AWAITING_PARTS}"
          - "the loaner asset has asset_role == LOANER"
          - "the loaner asset is not under sanitation hold (current_utc >= EquipmentAsset.reconditioning_until when asset_status == RECONDITIONING)"
          - "the requested loaner window does not collide with another work order's window on the same loaner asset per loaner_window_conflict"
        side_effects:
          - "loaner_asset_id, loaner_out_date, loaner_due_back_date stamped; loaner_status := OUT"
          - "lazy transition: when the loaner asset was RECONDITIONING and the hold has expired its asset_status becomes IN_STOCK first, then ON_LOAN"
      - from: OUT
        to: RETURNED
        trigger: "POST /ocs/maintenance-work-orders/{work_order_id}/loaner-return"
        actor: RouteTechnician
        preconditions:
          - "loaner_status IN {OUT, OVERDUE}"
          - "returned_on >= loaner_out_date"
        side_effects:
          - "loaner_returned_on stamped; loaner_status := RETURNED"
          - "EquipmentAsset.asset_status := RECONDITIONING; EquipmentAsset.reconditioning_until := returned_on + RECONDITIONING_DAYS"
      - from: OUT
        to: OVERDUE
        trigger: "system: lazy evaluation at POST /ocs/maintenance-work-orders/{work_order_id}/loaner-return or POST /ocs/consolidated-invoices when the current date is past loaner_due_back_date"
        actor: system
        preconditions: ["loaner_status == OUT", "current_utc date > loaner_due_back_date"]
        side_effects: ["loaner_status := OVERDUE"]
      - from: OVERDUE
        to: RETURNED
        trigger: "POST /ocs/maintenance-work-orders/{work_order_id}/loaner-return"
        actor: RouteTechnician
        preconditions: ["loaner_status IN {OUT, OVERDUE}", "returned_on >= loaner_out_date"]
        side_effects:
          - "loaner_returned_on stamped; loaner_status := RETURNED"
          - "EquipmentAsset.asset_status := RECONDITIONING; EquipmentAsset.reconditioning_until := returned_on + RECONDITIONING_DAYS"
      - from: OVERDUE
        to: WRITTEN_OFF
        trigger: "system: POST /ocs/consolidated-invoices draft assembly when the current date is more than LOANER_WRITEOFF_DAYS past loaner_due_back_date"
        actor: system
        preconditions:
          - "loaner_status == OVERDUE"
          - "current_utc date > loaner_due_back_date + LOANER_WRITEOFF_DAYS"
        side_effects:
          - "loaner_status := WRITTEN_OFF"
          - "EquipmentAsset.asset_status := UNRETURNED"
          - "an UNRETURNED_ASSET InvoiceLine for the loaner asset is appended to the draft, priced by unreturned_asset_charge with months_placed measured from loaner_out_date"

  - entity: EquipmentAsset
    dimension: asset_status
    initial_state: IN_STOCK
    terminal_states: [RETIRED]
    transitions:
      - from: IN_STOCK
        to: PLACED
        trigger: "POST /ocs/equipment-placements"
        actor: AccountManager
        preconditions: ["asset_status == IN_STOCK", "asset_role == PLACEMENT"]
        side_effects: ["asset_status := PLACED"]
      - from: PLACED
        to: IN_STOCK
        trigger: "POST /ocs/equipment-placements (the placement holding this asset is superseded)"
        actor: system
        preconditions: ["the placement holding this asset moved to SUPERSEDED"]
        side_effects: ["asset_status := IN_STOCK"]
      - from: PLACED
        to: RECONDITIONING
        trigger: "POST /ocs/equipment-placements/{placement_id}/retrieve with retrieved_asset_condition != UNSERVICEABLE"
        actor: AccountManager
        preconditions: ["asset_status IN {PLACED, UNRETURNED}"]
        side_effects: ["asset_status := RECONDITIONING; reconditioning_until := current_utc + RECONDITIONING_DAYS"]
      - from: PLACED
        to: RETIRED
        trigger: "POST /ocs/equipment-placements/{placement_id}/retrieve with retrieved_asset_condition == UNSERVICEABLE"
        actor: AccountManager
        preconditions: ["asset_status IN {PLACED, UNRETURNED}"]
        side_effects: ["asset_status := RETIRED"]
      - from: PLACED
        to: UNRETURNED
        trigger: "system: POST /ocs/consolidated-invoices billed the placement as unreturned"
        actor: system
        preconditions: ["the placement moved RETRIEVAL_SCHEDULED -> UNRETURNED_BILLED"]
        side_effects: ["asset_status := UNRETURNED"]
      - from: UNRETURNED
        to: RECONDITIONING
        trigger: "POST /ocs/equipment-placements/{placement_id}/retrieve after an unreturned write-off"
        actor: AccountManager
        preconditions: ["asset_status IN {PLACED, UNRETURNED}"]
        side_effects: ["asset_status := RECONDITIONING; reconditioning_until := current_utc + RECONDITIONING_DAYS"]
      - from: IN_STOCK
        to: ON_LOAN
        trigger: "POST /ocs/maintenance-work-orders/{work_order_id}/loaner-swap"
        actor: RouteTechnician
        preconditions: ["asset_role == LOANER", "asset_status == IN_STOCK, or RECONDITIONING with an expired hold"]
        side_effects: ["asset_status := ON_LOAN"]
      - from: RECONDITIONING
        to: IN_STOCK
        trigger: "system: lazy evaluation at POST /ocs/maintenance-work-orders/{work_order_id}/loaner-swap when current_utc >= reconditioning_until"
        actor: system
        preconditions: ["asset_status == RECONDITIONING", "current_utc >= reconditioning_until"]
        side_effects: ["asset_status := IN_STOCK; reconditioning_until := null"]
      - from: ON_LOAN
        to: RECONDITIONING
        trigger: "POST /ocs/maintenance-work-orders/{work_order_id}/loaner-return"
        actor: RouteTechnician
        preconditions: ["asset_status == ON_LOAN"]
        side_effects: ["asset_status := RECONDITIONING; reconditioning_until := returned_on + RECONDITIONING_DAYS"]
      - from: ON_LOAN
        to: UNRETURNED
        trigger: "system: the loaner was written off during invoice draft assembly"
        actor: system
        preconditions: ["the owning work order moved loaner_status OVERDUE -> WRITTEN_OFF"]
        side_effects: ["asset_status := UNRETURNED"]

  - entity: ConsolidatedInvoice
    dimension: invoice_status
    initial_state: DRAFT
    terminal_states: [VOID, FULLY_CREDITED]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /ocs/consolidated-invoices/{invoice_id}/issue"
        actor: BillingSpecialist
        preconditions:
          - "invoice_status == DRAFT"
          - "Account.program_posture != CLOSED"
          - "line_count >= 1"
        side_effects:
          - "invoice_status := ISSUED; issued_at := current_utc"
          - "Account.receivable_balance_cents += total_cents"
          - "Account.allied_attachment_bps recomputed"
          - "every EquipmentPlacement whose SHORTFALL line was emitted on this invoice has shortfall_fee_cents := 0"
      - from: DRAFT
        to: VOID
        trigger: "system: POST /ocs/accounts/{account_id}/cancel"
        actor: system
        preconditions: ["invoice_status == DRAFT"]
        side_effects: ["invoice_status := VOID"]
      - from: ISSUED
        to: PARTIALLY_CREDITED
        trigger: "POST /ocs/consolidated-invoices/{invoice_id}/credit"
        actor: BillingSpecialist
        preconditions:
          - "invoice_status IN {ISSUED, PARTIALLY_CREDITED}"
          - "the sum of credits after this one is strictly less than the pre-credit total_cents"
        side_effects:
          - "a CREDIT InvoiceLine with amount_cents == -amount_cents is appended; target line credits_applied_cents += amount_cents"
          - "total_cents recomputed as the sum of all lines; line_count += 1"
          - "Account.receivable_balance_cents -= amount_cents"
      - from: PARTIALLY_CREDITED
        to: PARTIALLY_CREDITED
        trigger: "POST /ocs/consolidated-invoices/{invoice_id}/credit"
        actor: BillingSpecialist
        preconditions:
          - "invoice_status IN {ISSUED, PARTIALLY_CREDITED}"
          - "the sum of credits after this one is strictly less than the pre-credit total_cents"
        side_effects: ["identical to the ISSUED -> PARTIALLY_CREDITED transition"]
      - from: ISSUED
        to: FULLY_CREDITED
        trigger: "POST /ocs/consolidated-invoices/{invoice_id}/credit"
        actor: BillingSpecialist
        preconditions:
          - "invoice_status IN {ISSUED, PARTIALLY_CREDITED}"
          - "the sum of credits after this one equals the pre-credit total_cents"
        side_effects:
          - "a CREDIT InvoiceLine is appended; total_cents becomes 0; Account.receivable_balance_cents -= amount_cents"
      - from: PARTIALLY_CREDITED
        to: FULLY_CREDITED
        trigger: "POST /ocs/consolidated-invoices/{invoice_id}/credit"
        actor: BillingSpecialist
        preconditions:
          - "invoice_status IN {ISSUED, PARTIALLY_CREDITED}"
          - "the sum of credits after this one equals the pre-credit total_cents"
        side_effects: ["identical to the ISSUED -> FULLY_CREDITED transition"]

  - entity: PriceAdjustment
    dimension: adj_status
    initial_state: PROPOSED
    terminal_states: [ACCEPTED]
    transitions:
      - from: PROPOSED
        to: ACCEPTED
        trigger: "POST /ocs/price-adjustments/{adjustment_id}/respond with disposition == ACCEPT"
        actor: CustomerContact
        preconditions:
          - "adj_status == PROPOSED"
          - "X-User-ID == PriceAdjustment.account_id"
        side_effects:
          - "adj_status := ACCEPTED; accepted_at := current_utc"
          - "Account.green_price_factor_bps := 10000 + adjustment_pct_bps"
          - "Account.green_index_baseline_micros := index_current_micros (baseline reset)"
          - "Account.price_protection_until := current_utc + Account.price_protection_days"
          - "increments Account.version by 1"
      - from: PROPOSED
        to: DISPUTED
        trigger: "POST /ocs/price-adjustments/{adjustment_id}/respond with disposition == DISPUTE"
        actor: CustomerContact
        preconditions: ["adj_status == PROPOSED", "X-User-ID == PriceAdjustment.account_id", "dispute_reason present"]
        side_effects: ["adj_status := DISPUTED; dispute_reason stamped; Account prices are untouched"]
      - from: DISPUTED
        to: PROPOSED
        trigger: "POST /ocs/price-adjustments/{adjustment_id}/revise"
        actor: BillingSpecialist
        preconditions:
          - "adj_status == DISPUTED"
          - "0 <= revised_adjustment_pct_bps <= the current adjustment_pct_bps when it is positive; the mirrored bound applies when it is negative"
        side_effects: ["adjustment_pct_bps := revised_adjustment_pct_bps; revision_count += 1; adj_status := PROPOSED"]
        note: "PROPOSED -> DISPUTED -> PROPOSED is a negotiation cycle with no fixed round limit."
      - from: PROPOSED
        to: DEFERRED
        trigger: "system: the Account entered program_posture AT_RISK (cascade hop 4)"
        actor: system
        preconditions: ["adj_status == PROPOSED"]
        side_effects: ["adj_status := DEFERRED; the customer may not respond while deferred"]
      - from: DEFERRED
        to: PROPOSED
        trigger: "system: the Account returned to program_posture ACTIVE"
        actor: system
        preconditions: ["adj_status == DEFERRED"]
        side_effects: ["adj_status := PROPOSED"]

concurrency_rules:
  - rule_id: placement-create-stale-site
    parent_entity: Site
    write_endpoint: "POST /ocs/equipment-placements"
    occ_field: "expected_site_version"
    description: |
      Creating an EquipmentPlacement against a Site whose version has advanced
      since the client last observed it is rejected. A new placement legitimately
      supersedes the site's prior ACTIVE placement (brewer upgrade or swap), so a
      writer holding a stale view of the site would otherwise retire a placement
      it never saw; the stale-version check forces it to re-read the site first.
    error_id: ERR_STALE_SITE_VERSION
    http_status: 412
  - rule_id: invoice-draft-create-stale-account
    parent_entity: Account
    write_endpoint: "POST /ocs/consolidated-invoices"
    occ_field: "expected_account_version"
    description: |
      Creating a ConsolidatedInvoice draft against an Account whose version has
      advanced since the client last observed it is rejected. Draft assembly is not
      a read-only projection - it also writes unreturned-asset charges, loaner
      write-offs and per-site discount lines - so a writer holding a stale account
      view (a cancellation, an accepted price adjustment, or a posture change it
      never saw) would bill against superseded prices and balances.
    error_id: ERR_STALE_ACCOUNT_VERSION
    http_status: 412

calculations:
  - name: site_consumption_forecast
    trigger: "POST /ocs/sites/{site_id}/size-and-plan; writes Site.forecast_cups_per_week, Site.required_peak_cups_per_hour and every FORECAST ParLevel row of the site"
    algorithm: forward_looking
    formula: |
      # variant selection is Site.consumption_model, NOT a request field
      if consumption_model == HEADCOUNT_MODEL:
          forecast_cups_per_week = ceil(headcount * CUPS_PER_PERSON_PER_DAY
                                        * days_per_week * BREW_STYLE_FACTOR[brew_style])
          par_units(product) = ceil(forecast_cups_per_week * PAR_COVER_WEEKS
                                    * CATEGORY_UNITS_PER_CUP[product.category])
      if consumption_model == TRAILING_USAGE:
          window = [current_utc - TRAILING_WINDOW_DAYS, current_utc]
          delivered(product) = sum of lines[].delivered_units over ServiceVisits of this
                               site with visit_status == COMPLETED and window_start in window
          if the site has zero such COMPLETED visits -> reject with ERR_NO_TRAILING_USAGE
          units_per_week(product) = delivered(product) / 4          # exact rational, no rounding here
          par_units(product) = ceil(units_per_week(product) * PAR_COVER_WEEKS
                                    * TRAILING_SAFETY_BPS / 10000)
          forecast_cups_per_week = ceil(headcount * CUPS_PER_PERSON_PER_DAY
                                        * days_per_week * BREW_STYLE_FACTOR[brew_style])
      # common tail, both variants
      reorder_point_units(product) = ceil(par_units(product) * REORDER_POINT_BPS / 10000)
      required_peak_cups_per_hour = ceil(forecast_cups_per_week / days_per_week * PEAK_FACTOR)
    input_set: "every ProductItem in the catalog gets one FORECAST ParLevel row per site; existing FORECAST rows are overwritten, rows with source == MANUAL are never touched; TRAILING_USAGE reads only visits with visit_status == COMPLETED (VOIDED and CANCELLED visits are excluded)"
    constants:
      CUPS_PER_PERSON_PER_DAY: 1.8
      BREW_STYLE_FACTOR: { DRIP: 1.00, SINGLE_CUP: 1.15, ESPRESSO: 0.85 }
      PAR_COVER_WEEKS: 2
      CATEGORY_UNITS_PER_CUP: { COFFEE: 0.09, CREAMER: 0.50, TEA: 0.05, WATER: 0.01, PANTRY: 0.40 }
      REORDER_POINT_BPS: 4000
      TRAILING_WINDOW_DAYS: 28
      TRAILING_SAFETY_BPS: 11000
      PEAK_FACTOR: 0.35
    precision: "cups and units are integers, always ceil; intermediate products are exact decimals (no interim rounding)"
    variants:
      - name: HEADCOUNT_MODEL
        when: "Site.consumption_model == HEADCOUNT_MODEL"
        difference: "par levels are derived from projected demand (headcount x cups x days x brew factor), so they are non-zero before the site has ever been served"
      - name: TRAILING_USAGE
        when: "Site.consumption_model == TRAILING_USAGE"
        difference: "par levels are derived from actual delivered units in the trailing 28 days with a 10% safety uplift, so identical site attributes produce materially different par_units than HEADCOUNT_MODEL, and a site with no COMPLETED visit in the window cannot be planned at all"

  - name: equipment_sizing_selector
    trigger: "POST /ocs/sites/{site_id}/size-and-plan; writes Site.recommended_model_id"
    algorithm: weighted_scoring
    formula: |
      candidates = EquipmentModel rows where
            min_headcount <= Site.headcount <= max_headcount
        AND cups_per_hour_capacity >= Site.required_peak_cups_per_hour
      rank by cups_per_hour_capacity ASC            # smallest sufficient brewer
      tie-break 1: monthly_rent_cents ASC
      tie-break 2: created_at ASC                   # never id
      if candidates is empty -> reject with ERR_NO_MODEL_FITS_HEADCOUNT (422)
      Site.recommended_model_id = first candidate
    input_set: "the entire EquipmentModel catalog; EquipmentAsset availability is deliberately NOT part of the eligibility filter"
    constants: {}
    precision: "integer comparisons only"

  - name: equipment_program_charge
    trigger: "POST /ocs/equipment-placements/{placement_id}/evaluate-compliance (shortfall component) and POST /ocs/consolidated-invoices draft assembly (rent component)"
    algorithm: tiered_pricing
    formula: |
      shortfall_cents = max(0, minimum_purchase_cents - trailing_purchase_cents)
      days_active = date(min(period_end, current_utc)) - date(max(placed_at, period_start))   # plain date difference, no +1
      if terms_type == LOAN:
          rent_charge_cents   = 0
          shortfall_fee_cents = round_half_up(shortfall_cents * LOAN_RECOVERY_BPS / 10000)
      if terms_type == RENTAL:
          rent_charge_cents   = round_half_up(EquipmentModel.monthly_rent_cents
                                              * min(RENT_PRORATION_DAYS, days_active)
                                              / RENT_PRORATION_DAYS)
          shortfall_fee_cents = 0 if shortfall_cents == 0 else
                                round_half_up(EquipmentModel.monthly_rent_cents
                                              * RENTAL_SHORTFALL_SURCHARGE_BPS / 10000)
      # NOTE: the RENTAL surcharge is keyed on the FULL monthly rent, never on the prorated
      # rent_charge_cents, so the shortfall component is period-independent and can be
      # evaluated by evaluate-compliance outside any invoice period.
    input_set: "one placement; the rent component only enters an invoice when placement_status IN {ACTIVE, RETRIEVAL_SCHEDULED} during the billed period, the shortfall component only enters when compliance_status == SHORTFALL_BILLED and shortfall_fee_cents > 0"
    constants:
      LOAN_RECOVERY_BPS: 3500
      RENTAL_SHORTFALL_SURCHARGE_BPS: 2500
      RENT_PRORATION_DAYS: 30
      LOAN_MINIMUM_FLOOR_CENTS: 75000
    precision: "cents, round_half_up applied once per component"
    variants:
      - name: LOAN
        when: "EquipmentPlacement.terms_type == LOAN"
        difference: "no rent at all, but 35% of the unmet commitment is recovered as a shortfall fee, so the charge grows as purchases fall"
      - name: RENTAL
        when: "EquipmentPlacement.terms_type == RENTAL"
        difference: "prorated rent always applies and the shortfall is charged as a 25% surcharge on the full monthly rent instead of on the unmet commitment, so identical minimum_purchase_cents / trailing_purchase_cents inputs yield a different shortfall_fee_cents than LOAN"

  - name: consumption_debit
    trigger: "POST /ocs/service-visits/{visit_id}/complete, once per ServiceVisit.lines element, BEFORE the delivery credit"
    algorithm: chronological
    formula: |
      elapsed_days = floor((visit.window_start - ParLevel.last_service_at) / 86400 seconds)
      modeled_daily_units = par_units / CONSUMPTION_DAYS_DIVISOR          # exact rational
      consumed_units = min(ParLevel.on_hand_units,
                           floor(modeled_daily_units * elapsed_days))
      # order is pinned: debit consumption first, then credit the delivery
      on_hand_units = on_hand_units - consumed_units + delivered_units
    input_set: "only ParLevel rows referenced by ServiceVisit.lines; lines are processed in ascending ParLevel.created_at order, which is observable only through cumulative counters and never changes a per-line result"
    constants:
      CONSUMPTION_DAYS_DIVISOR: 14
    precision: "integer units; floor on the modeled draw, min() clamps at the shelf quantity so on_hand_units can never go negative"

  - name: effective_unit_price
    trigger: "POST /ocs/service-visits/{visit_id}/complete, snapshotted onto each ServiceVisit.lines element as effective_unit_price_micros"
    algorithm: threshold
    formula: |
      if ProductItem.green_coffee_linked:
          effective_unit_price_micros = round_half_up(ProductItem.base_unit_price_micros
                                                      * Account.green_price_factor_bps / 10000)
      else:
          effective_unit_price_micros = ProductItem.base_unit_price_micros
    input_set: "the Account of the visit's Site at the instant of completion; the snapshot is authoritative forever after - invoice assembly MUST reuse it and MUST NOT recompute the price at invoice time"
    constants: {}
    precision: "micro-dollars, round_half_up to whole micros"

  - name: invoice_line_rounding
    trigger: "POST /ocs/consolidated-invoices draft assembly, for every PRODUCT line and for every per-site ALLIED_DISCOUNT line"
    algorithm: aggregation
    formula: |
      # Step 1 - per line, rounded individually (this order is pinned)
      line.amount_cents = round_half_up(line.qty_units * line.unit_price_micros / 10000)
      # Step 2 - per site, sum the ALREADY ROUNDED line amounts
      site_product_subtotal = sum(line.amount_cents for PRODUCT lines of that site)
      # Step 3 - per-site discount, rounded once per site
      site_allied_discount = round_half_up(site_product_subtotal * allied_discount_bps / 10000)
      # FORBIDDEN alternative: summing micro-dollar products across a site and
      # rounding once ("sum then round") - it differs by cents whenever two or more
      # lines of a site carry a fractional-cent unit price.
    input_set: "PRODUCT lines come one-per-(visit line) from ServiceVisits with visit_status == COMPLETED whose window_start falls inside [period_start, period_end] and whose delivered_units > 0; VOIDED and CANCELLED visits contribute nothing"
    constants: {}
    precision: "cents, round_half_up, applied exactly twice per site (once per line, once on the site discount) and never on a cross-site sum"

  - name: invoice_assembly_order
    trigger: "POST /ocs/consolidated-invoices; produces pre_freight_total_cents, allied_discount_bps, allied_discount_cents, freight_cents, total_cents"
    algorithm: constraint_propagation
    formula: |
      # The discount depends on a total, and the freight waiver depends on a total,
      # while both change the total - the evaluation order below is PINNED and is
      # the only well-defined reading.
      1. every PRODUCT / RENT / SHORTFALL / UNRETURNED_ASSET line is rounded per
         invoice_line_rounding step 1
      2. pre_freight_total_cents = sum of ALL those line amounts (all sites, all types)
      3. allied_category_count = count of DISTINCT ProductItem.category values other
         than COFFEE among this invoice's PRODUCT lines
      4. allied_discount_bps =
             TIER_HIGH_BPS        if allied_category_count >= BREADTH_MIN_CATEGORIES
                                     and pre_freight_total_cents >= TIER_HIGH_FLOOR_CENTS
             TIER_MID_BPS         if allied_category_count >= BREADTH_MIN_CATEGORIES
                                     and pre_freight_total_cents >= TIER_MID_FLOOR_CENTS
             TIER_TWO_CATEGORY_BPS if allied_category_count == 2
             0                    otherwise
         # keyed on the STEP 2 value, never on a post-discount total
      5. allied_discount_cents = sum over sites of round_half_up(site_product_subtotal
                                 * allied_discount_bps / 10000); one negative
                                 ALLIED_DISCOUNT line per site with a non-zero result
      6. freight_cents = 0 if pre_freight_total_cents >= FREE_FREIGHT_THRESHOLD_CENTS
                         else FREIGHT_FEE_CENTS
         # ALSO keyed on the STEP 2 value: an invoice that clears the threshold before
         # the discount keeps free freight even when the discount drops it below.
         # A FREIGHT line is emitted only when freight_cents > 0.
      7. total_cents = pre_freight_total_cents - allied_discount_cents + freight_cents
      8. line_count = number of InvoiceLine rows written; invoices with line_count == 0
         are rejected with ERR_NO_BILLABLE_LINES (422)
    input_set: "all lines of the draft; for a PER_SITE account only the requested site's lines are in scope"
    constants:
      BREADTH_MIN_CATEGORIES: 3
      TIER_HIGH_BPS: 500
      TIER_HIGH_FLOOR_CENTS: 100000
      TIER_MID_BPS: 300
      TIER_MID_FLOOR_CENTS: 50000
      TIER_TWO_CATEGORY_BPS: 100
      FREE_FREIGHT_THRESHOLD_CENTS: 50000
      FREIGHT_FEE_CENTS: 2500
    precision: "integer cents throughout; the only rounding happens in steps 1 and 5"

  - name: green_index_adjustment
    trigger: "POST /ocs/price-adjustments; produces PriceAdjustment.index_baseline_micros, index_current_micros, movement_bps and adjustment_pct_bps"
    algorithm: threshold
    formula: |
      index_baseline_micros = Account.green_index_baseline_micros
      index_current_micros  = the market index most recently set through
                              POST /ocs/_market/set_green_index
      movement_bps = round_half_up((index_current_micros - index_baseline_micros)
                                   * 10000 / index_baseline_micros)
      if abs(movement_bps) < INDEX_MOVEMENT_THRESHOLD_BPS:
          reject with ERR_INDEX_MOVEMENT_BELOW_THRESHOLD (422)   # 799 bps is not adjustable, 800 bps is
      raw_pass_through_bps = round_half_up(movement_bps * PASS_THROUGH_BPS / 10000)
      adjustment_pct_bps = max(-ADJUSTMENT_CAP_BPS, min(ADJUSTMENT_CAP_BPS, raw_pass_through_bps))
      # the cap is observable as adjustment_pct_bps == +/- ADJUSTMENT_CAP_BPS while the
      # uncapped pass-through would have exceeded it; raw_pass_through_bps is not stored
      # on acceptance: Account.green_price_factor_bps += adjustment_pct_bps, then clamped
      # from below at GREEN_FACTOR_FLOOR_BPS, and Account.green_index_baseline_micros is
      # re-based to index_current_micros
    input_set: "index_baseline_micros is the Account's own green_index_baseline_micros (per-account, not global); index_current_micros is the market value most recently set through POST /ocs/_market/set_green_index"
    constants:
      INDEX_MOVEMENT_THRESHOLD_BPS: 800
      PASS_THROUGH_BPS: 6000
      ADJUSTMENT_CAP_BPS: 1500
      GREEN_FACTOR_FLOOR_BPS: 5000
    precision: "basis points as integers, round_half_up on each of the two divisions; the cap is applied last and never re-rounds"

  - name: site_escalation_score
    trigger: "POST /ocs/sites/{site_id}/evaluate-service-posture and as a side effect of POST /ocs/service-visits/{visit_id}/complete"
    algorithm: weighted_scoring
    formula: |
      stockout_count = number of ParLevel rows of the site with on_hand_units == 0
                       AND cumulative_delivered_units > 0
                       # a line that has never been delivered to is unstocked, not a
                       # stockout, so a freshly planned site never escalates on its own
      below_reorder_count = number of ParLevel rows of the site with
                            0 < on_hand_units <= reorder_point_units
      overdue_descale_count = number of EquipmentAssets placed at the site (through an
                              EquipmentPlacement with placement_status == ACTIVE) for which
                              asset.last_descale_at + model.descale_interval_days <= current_utc
      missed_visit_count = number of ServiceVisits of the site with visit_status ==
                           CANCELLED and window_start >= current_utc - ESCALATION_WINDOW_DAYS
      raw_score = stockout_count       * STOCKOUT_WEIGHT
                + below_reorder_count  * BELOW_REORDER_WEIGHT
                + overdue_descale_count * OVERDUE_DESCALE_WEIGHT
                + missed_visit_count   * MISSED_VISIT_WEIGHT
      escalation_score = min(SCORE_CAP, raw_score)                 # stored as a 1-decimal number
      # posture: ACTIVE -> ESCALATED when escalation_score >= ESCALATION_THRESHOLD
      #          ESCALATED -> ACTIVE when escalation_score < ESCALATION_THRESHOLD
    input_set: "only ParLevel rows that have been serviced at least once (cumulative_delivered_units > 0) count toward stockout_count, and only placements with placement_status == ACTIVE contribute overdue descales; RETRIEVED and SUPERSEDED placements never do"
    constants:
      STOCKOUT_WEIGHT: 20.0
      BELOW_REORDER_WEIGHT: 7.5
      OVERDUE_DESCALE_WEIGHT: 15.0
      MISSED_VISIT_WEIGHT: 10.0
      SCORE_CAP: 100.0
      ESCALATION_THRESHOLD: 40.0
      ESCALATION_WINDOW_DAYS: 28
      AT_RISK_SITE_THRESHOLD: 2
    precision: "one decimal place, exact (all weights are multiples of 0.5, so no rounding is required); the >= comparison against 40.0 is exact - 39.5 stays ACTIVE, 40.0 escalates"

  - name: unreturned_asset_charge
    trigger: "POST /ocs/consolidated-invoices draft assembly, for every RETRIEVAL_SCHEDULED placement past its retrieval_due_by and for every loaner written off in the same pass"
    algorithm: decay_function
    formula: |
      anchor = placement.placed_at for a placement asset,
               work_order.loaner_out_date for a written-off loaner
      months_in_service = floor((current_utc - anchor) / 30 days)
      depreciated_bps = max(RESIDUAL_FLOOR_BPS,
                            10000 - months_in_service * DEPRECIATION_BPS_PER_MONTH)
      asset_value_cents = round_half_up(EquipmentModel.list_value_cents
                                        * depreciated_bps / 10000)
      unreturned_billed_cents = asset_value_cents + RETRIEVAL_TRIP_FEE_CENTS
    input_set: "for a placement: placement_status == RETRIEVAL_SCHEDULED and current_utc > retrieval_due_by; for a loaner: loaner_status == OVERDUE and the current date is more than LOANER_WRITEOFF_DAYS past loaner_due_back_date; in both cases the model is reached through the asset's model_id"
    constants:
      DEPRECIATION_BPS_PER_MONTH: 150
      RESIDUAL_FLOOR_BPS: 3000
      RETRIEVAL_TRIP_FEE_CENTS: 7500
      LOANER_WRITEOFF_DAYS: 30
    precision: "cents, round_half_up once; the residual floor means an asset never depreciates past 30% of list value no matter how old it is"

  - name: trailing_purchase_rollup
    trigger: "POST /ocs/equipment-placements/{placement_id}/evaluate-compliance; writes EquipmentPlacement.trailing_purchase_cents"
    algorithm: aggregation
    formula: |
      window = (current_utc - COMPLIANCE_WINDOW_DAYS, current_utc]     # half-open, left-exclusive
      trailing_purchase_cents = sum over ServiceVisits v of THIS placement's site with
          v.visit_status == COMPLETED and v.window_start in window
          of sum over v.lines l with l.delivered_units > 0 of
             round_half_up(l.delivered_units * l.effective_unit_price_micros / 10000)
    input_set: "only the placement's own site (a corporate account's other sites never contribute), only COMPLETED visits, only the snapshotted effective_unit_price_micros - never the product's current price"
    constants:
      COMPLIANCE_WINDOW_DAYS: 90
    precision: "cents; each line is rounded individually then summed, matching invoice_line_rounding so a placement's trailing purchases always equal the sum of the corresponding invoice PRODUCT lines"

  - name: route_day_load
    trigger: "POST /ocs/service-visits (scheduling) and GET /ocs/routes/{route_id}/day-load"
    algorithm: aggregation
    formula: |
      day = date(window_start) in UTC
      booked_minutes_day = sum of planned_minutes over ServiceVisits on that route with
                           visit_status IN {SCHEDULED, COMPLETED} and date(window_start) == day
      remaining_minutes = Route.capacity_minutes - booked_minutes_day
      # scheduling is rejected with ERR_ROUTE_CAPACITY_EXCEEDED (422) when
      #   booked_minutes_day + new.planned_minutes > Route.capacity_minutes
      # exact equality is ACCEPTED - a day may be filled to the minute
      # Route.booked_minutes_total is the same sum across all days of the route
    input_set: "visits of the requested route only; a visit that is CANCELLED frees its minutes immediately, and a visit VOIDED after completion frees them too - CANCELLED and VOIDED never count toward load"
    constants: {}
    precision: "integer minutes; the day bucket is the UTC calendar date of window_start even when window_end falls on the next date"

  - name: route_window_conflict
    trigger: "POST /ocs/service-visits and POST /ocs/service-visits/{visit_id}/reschedule"
    algorithm: interval_merge
    formula: |
      # HALF-OPEN instant intervals with a SYMMETRIC travel buffer on the candidate,
      # the buffer width coming from the route row (Route.travel_buffer_minutes)
      buf  = Route.travel_buffer_minutes
      cand = [new.window_start - buf minutes, new.window_end + buf minutes)
      for every other visit v on the SAME route with visit_status IN {SCHEDULED, COMPLETED}:
          other = [v.window_start, v.window_end)
          conflict if cand.start < other.end AND other.start < cand.end
              -> ERR_ROUTE_WINDOW_CONFLICT (409)
      # with buf == 30: an existing visit ending 09:45 leaves 10:15 free (09:45 == the
      # buffered candidate start, and half-open abutment is not an overlap) while 10:14
      # conflicts.
    input_set: "same route only; the same site may be visited by another route without conflict; CANCELLED and VOIDED visits are ignored"
    constants: {}
    precision: "minute-resolution instants compared exactly; half-open on both sides so an exact end==start abutment is never an overlap"

  - name: loaner_window_conflict
    trigger: "POST /ocs/maintenance-work-orders/{work_order_id}/loaner-swap"
    algorithm: interval_merge
    formula: |
      # CLOSED date-granular intervals with a TRAILING reconditioning day on the
      # previously held asset - deliberately different semantics from route_window_conflict
      cand = [loaner_out_date, loaner_due_back_date]                     # inclusive both ends
      for every other MaintenanceWorkOrder w that has held this loaner_asset_id:
          if w.loaner_status IN {OUT, OVERDUE, WRITTEN_OFF}:
              held = [w.loaner_out_date, 9999-12-31]
          if w.loaner_status == RETURNED:
              held = [w.loaner_out_date,
                      w.loaner_returned_on + RECONDITIONING_DAYS]        # trailing day is blocked
          conflict if cand.start <= held.end AND held.start <= cand.end
              -> ERR_LOANER_NOT_AVAILABLE (409)
      # a loaner returned on 2026-08-10 is unavailable on 2026-08-11 and free on 2026-08-12;
      # EquipmentAsset.reconditioning_until carries the same instant for readback
    input_set: "all work orders that reference the asset as loaner_asset_id, whatever their wo_status; WRITTEN_OFF loaners block forever because the asset is gone"
    constants:
      RECONDITIONING_DAYS: 1
    precision: "UTC calendar dates, closed intervals, so an abutting same-day handoff IS a conflict (unlike the route rule)"

  - name: allied_attachment_rollup
    trigger: "POST /ocs/accounts/{account_id}/recompute-allied-attachment; writes Account.allied_attachment_bps"
    algorithm: aggregation
    formula: |
      window = (current_utc - ATTACHMENT_WINDOW_DAYS, current_utc]
      for every COMPLETED visit of every site of the account with window_start in window,
      for every line l with delivered_units > 0:
          amount = round_half_up(l.delivered_units * l.effective_unit_price_micros / 10000)
      coffee_cents = sum of those amounts where ProductItem.category == COFFEE
      allied_cents = sum of those amounts for every other category
      total_cents  = coffee_cents + allied_cents
      if total_cents == 0:
          allied_attachment_bps = 0        # empty denominator yields 0, never an error
      else:
          allied_attachment_bps = round_half_up(allied_cents * 10000 / total_cents)
    input_set: "every COMPLETED ServiceVisit of every Site of the account inside the window, using the snapshotted effective_unit_price_micros"
    constants:
      ATTACHMENT_WINDOW_DAYS: 90
    precision: "basis points, round_half_up; the zero-denominator case returns 0 rather than raising"

validations:
  # ---- 1-3 authentication / authorization ----
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and X-User-Role is one of the five roles declared in §1.7"
    error_id: ERR_MISSING_AUTH_HEADERS
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "the acting role appears in the endpoint's roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all
  - priority: 3
    category: auth
    check: "for entity_backed roles the X-User-ID must resolve: RouteTechnician's must be an existing Route id, CustomerContact's must be an existing Account id (opaque roles are never resolved)"
    error_id: ERR_UNKNOWN_ACTOR_IDENTITY
    http_status: 401
    applies_to: all endpoints invoked as RouteTechnician or CustomerContact

  # ---- 4 request shape ----
  - priority: 4
    category: business_constraint
    check: "request shape: every input field declared without a default is present, types match, enum values are members of the declared constraint set, integers respect their declared ranges, ISO-8601 instants parse, and limit/offset respect the pagination defaults (limit 1..100, offset >= 0)"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: all

  # ---- 5-6 existence, left-to-right ----
  - priority: 5
    category: existence
    check: "path ids resolve, evaluated left to right: account_id -> ERR_ACCOUNT_NOT_FOUND, site_id -> ERR_SITE_NOT_FOUND, route_id -> ERR_ROUTE_NOT_FOUND, model_id -> ERR_MODEL_NOT_FOUND, asset_id -> ERR_ASSET_NOT_FOUND, placement_id -> ERR_PLACEMENT_NOT_FOUND, product_id -> ERR_PRODUCT_NOT_FOUND, par_level_id -> ERR_PAR_LEVEL_NOT_FOUND, visit_id -> ERR_VISIT_NOT_FOUND, work_order_id -> ERR_WORK_ORDER_NOT_FOUND, invoice_id -> ERR_INVOICE_NOT_FOUND, adjustment_id -> ERR_ADJUSTMENT_NOT_FOUND"
    error_id: ERR_SITE_NOT_FOUND
    http_status: 404
    applies_to: every endpoint with a templated path segment
  - priority: 6
    category: existence
    check: "body FK ids resolve, evaluated in the order the fields are declared in §1.1 for that entity (e.g. POST /ocs/equipment-placements checks site_id before asset_id; POST /ocs/service-visits checks site_id before route_id), each raising the same error_id its path counterpart uses"
    error_id: ERR_ASSET_NOT_FOUND
    http_status: 404
    applies_to: every endpoint with FK fields in its body

  # ---- 7 cross-entity ownership (needs existence first) ----
  - priority: 7
    category: auth
    check: "RouteTechnician may only act on a ServiceVisit whose route_id equals X-User-ID, and on a MaintenanceWorkOrder whose site's route_id equals X-User-ID"
    error_id: ERR_ACTOR_NOT_ON_ROUTE
    http_status: 403
    applies_to: "POST /ocs/service-visits/{visit_id}/lines, /complete, POST /ocs/maintenance-work-orders/{work_order_id}/advance, /loaner-swap, /loaner-return"
  - priority: 8
    category: auth
    check: "CustomerContact may only respond to a PriceAdjustment whose account_id equals X-User-ID"
    error_id: ERR_ACTOR_NOT_ACCOUNT_CONTACT
    http_status: 403
    applies_to: "POST /ocs/price-adjustments/{adjustment_id}/respond"

  # ---- 9 optimistic concurrency (§1.2.1) ----
  - priority: 9
    category: state
    check: "expected_site_version equals the current Site.version"
    error_id: ERR_STALE_SITE_VERSION
    http_status: 412
    applies_to: "POST /ocs/equipment-placements"
  - priority: 10
    category: state
    check: "expected_account_version equals the current Account.version"
    error_id: ERR_STALE_ACCOUNT_VERSION
    http_status: 412
    applies_to: "POST /ocs/consolidated-invoices"

  # ---- 11-19 state preconditions ----
  - priority: 11
    category: state
    check: "the Account's program_posture permits the operation: sites, placements and visits may only be created while program_posture IN {ONBOARDING, ACTIVE, AT_RISK}; cancel is rejected from CANCELLATION_PENDING and CLOSED"
    error_id: ERR_ACCOUNT_NOT_OPERATING
    http_status: 409
    applies_to: "POST /ocs/sites, POST /ocs/equipment-placements, POST /ocs/service-visits, POST /ocs/accounts/{account_id}/cancel"
  - priority: 12
    category: state
    check: "the Site's service_posture permits the operation: scheduling and completing visits require service_posture IN {ACTIVE, ESCALATED}; SUSPENDED and CLOSED sites reject both"
    error_id: ERR_SITE_NOT_SERVICEABLE
    http_status: 409
    applies_to: "POST /ocs/service-visits, POST /ocs/service-visits/{visit_id}/complete, POST /ocs/sites/{site_id}/size-and-plan"
  - priority: 13
    category: state
    check: "the placement is in a status the action declares: /retrieve requires placement_status IN {RETRIEVAL_SCHEDULED, UNRETURNED_BILLED}, /evaluate-compliance requires placement_status IN {ACTIVE, RETRIEVAL_SCHEDULED}"
    error_id: ERR_PLACEMENT_STATE_INVALID
    http_status: 409
    applies_to: "POST /ocs/equipment-placements/{placement_id}/retrieve, /evaluate-compliance"
  - priority: 14
    category: state
    check: "the EquipmentAsset is available for placement: asset_status == IN_STOCK"
    error_id: ERR_ASSET_NOT_AVAILABLE
    http_status: 409
    applies_to: "POST /ocs/equipment-placements"
  - priority: 15
    category: state
    check: "the visit is in the required status: /lines and /complete require SCHEDULED, /void requires COMPLETED, /reschedule requires SCHEDULED"
    error_id: ERR_VISIT_STATE_INVALID
    http_status: 409
    applies_to: "POST /ocs/service-visits/{visit_id}/lines, /complete, /void, /reschedule"
  - priority: 16
    category: state
    check: "the requested wo_status transition is declared for the current wo_status (OPEN -> IN_PROGRESS, IN_PROGRESS <-> AWAITING_PARTS, IN_PROGRESS -> RESOLVED); RESOLVED is terminal"
    error_id: ERR_WORK_ORDER_STATE_INVALID
    http_status: 409
    applies_to: "POST /ocs/maintenance-work-orders/{work_order_id}/advance"
  - priority: 17
    category: state
    check: "loaner_status permits the action: /loaner-swap requires NONE, /loaner-return requires OUT or OVERDUE; resolving a work order requires loaner_status IN {NONE, RETURNED, WRITTEN_OFF}"
    error_id: ERR_LOANER_STATE_INVALID
    http_status: 409
    applies_to: "POST /ocs/maintenance-work-orders/{work_order_id}/loaner-swap, /loaner-return, /advance"
  - priority: 18
    category: state
    check: "invoice_status permits the action: /issue requires DRAFT, /credit requires ISSUED or PARTIALLY_CREDITED; VOID and FULLY_CREDITED accept nothing"
    error_id: ERR_INVOICE_STATE_INVALID
    http_status: 409
    applies_to: "POST /ocs/consolidated-invoices/{invoice_id}/issue, /credit"
  - priority: 19
    category: state
    check: "adj_status permits the action: /respond requires PROPOSED, /revise requires DISPUTED; ACCEPTED is terminal"
    error_id: ERR_ADJUSTMENT_STATE_INVALID
    http_status: 409
    applies_to: "POST /ocs/price-adjustments/{adjustment_id}/respond, /revise"
  - priority: 20
    category: state
    check: "a DEFERRED adjustment cannot be responded to at all - the account is AT_RISK and the negotiation is frozen until it recovers"
    error_id: ERR_ADJUSTMENT_DEFERRED
    http_status: 409
    applies_to: "POST /ocs/price-adjustments/{adjustment_id}/respond"

  # ---- 21-23 business_safety: sanitation and equipment fitness come first ----
  - priority: 21
    category: business_safety
    check: "a loaner asset under sanitation hold may not be re-issued: when asset_status == RECONDITIONING and current_utc < reconditioning_until the swap is refused"
    error_id: ERR_ASSET_UNDER_SANITATION_HOLD
    http_status: 422
    applies_to: "POST /ocs/maintenance-work-orders/{work_order_id}/loaner-swap"
  - priority: 22
    category: business_safety
    check: "a PREVENTIVE work order may not be RESOLVED while the asset is descale-overdue (current_utc - EquipmentAsset.last_descale_at > EquipmentModel.descale_interval_days); a DESCALE work order must be resolved first"
    error_id: ERR_DESCALE_OVERDUE
    http_status: 422
    applies_to: "POST /ocs/maintenance-work-orders/{work_order_id}/advance with to_status == RESOLVED"
  - priority: 23
    category: business_safety
    check: "asset_role must match its use: only PLACEMENT assets may be placed at a site, only LOANER assets may be swapped in on a work order"
    error_id: ERR_ASSET_ROLE_MISMATCH
    http_status: 422
    applies_to: "POST /ocs/equipment-placements, POST /ocs/maintenance-work-orders/{work_order_id}/loaner-swap"

  # ---- 24-30 business_temporal: window and period conflicts ----
  - priority: 24
    category: business_temporal
    check: "window_end > window_start, both minute-aligned, and window_start falls on the route's service_day in UTC"
    error_id: ERR_VISIT_WINDOW_INVALID
    http_status: 422
    applies_to: "POST /ocs/service-visits, POST /ocs/service-visits/{visit_id}/reschedule"
  - priority: 25
    category: business_temporal
    check: "route_window_conflict finds no collision against any SCHEDULED or COMPLETED visit of the same route, using Route.travel_buffer_minutes symmetrically on the candidate"
    error_id: ERR_ROUTE_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /ocs/service-visits, POST /ocs/service-visits/{visit_id}/reschedule"
  - priority: 26
    category: business_temporal
    check: "loaner_window_conflict finds no collision on the requested loaner asset, and loaner_due_back_date >= loaner_out_date"
    error_id: ERR_LOANER_NOT_AVAILABLE
    http_status: 409
    applies_to: "POST /ocs/maintenance-work-orders/{work_order_id}/loaner-swap"
  - priority: 27
    category: business_temporal
    check: "a visit may not be completed before its window opens: current_utc >= window_start"
    error_id: ERR_VISIT_NOT_YET_STARTED
    http_status: 422
    applies_to: "POST /ocs/service-visits/{visit_id}/complete"
  - priority: 28
    category: business_temporal
    check: "period_end > period_start and period_end <= current_utc - a period that has not closed yet cannot be invoiced"
    error_id: ERR_PERIOD_INVALID
    http_status: 422
    applies_to: "POST /ocs/consolidated-invoices"
  - priority: 29
    category: business_temporal
    check: "no other ConsolidatedInvoice with invoice_status != VOID covers an overlapping [period_start, period_end] for the same scope (same account for CONSOLIDATED, same site for PER_SITE); intervals are closed, so sharing a single endpoint day is an overlap"
    error_id: ERR_INVOICE_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /ocs/consolidated-invoices"
  - priority: 30
    category: business_temporal
    check: "no new PriceAdjustment may be proposed while Account.price_protection_until > current_utc"
    error_id: ERR_PRICE_PROTECTION_ACTIVE
    http_status: 422
    applies_to: "POST /ocs/price-adjustments"

  # ---- 31-36 business_referential: cross-entity coherence ----
  - priority: 31
    category: business_referential
    check: "a site may not receive a placement or a visit before it has been planned: Site.recommended_model_id must be non-null (POST /ocs/sites/{site_id}/size-and-plan has run)"
    error_id: ERR_SITE_NOT_PLANNED
    http_status: 422
    applies_to: "POST /ocs/equipment-placements, POST /ocs/service-visits"
  - priority: 32
    category: business_referential
    check: "a visit line's product must be stocked at that site: a ParLevel row for (site_id, product_id) must exist"
    error_id: ERR_PRODUCT_NOT_STOCKED
    http_status: 422
    applies_to: "POST /ocs/service-visits/{visit_id}/lines"
  - priority: 33
    category: business_referential
    check: "a visit may carry at most one line per product_id"
    error_id: ERR_DUPLICATE_VISIT_LINE
    http_status: 422
    applies_to: "POST /ocs/service-visits/{visit_id}/lines"
  - priority: 34
    category: business_referential
    check: "the credit's target_line_id must belong to THIS invoice and must not itself be a CREDIT line"
    error_id: ERR_CREDIT_TARGET_MISMATCH
    http_status: 422
    applies_to: "POST /ocs/consolidated-invoices/{invoice_id}/credit"
  - priority: 35
    category: business_referential
    check: "when site_id is supplied on an invoice it must name a Site whose account_id equals the invoice's account_id"
    error_id: ERR_SITE_NOT_IN_ACCOUNT
    http_status: 422
    applies_to: "POST /ocs/consolidated-invoices"
  - priority: 36
    category: business_referential
    check: "invoice scope must match Account.billing_mode: CONSOLIDATED requires site_id to be absent, PER_SITE requires site_id to be present"
    error_id: ERR_BILLING_MODE_MISMATCH
    http_status: 422
    applies_to: "POST /ocs/consolidated-invoices"

  # ---- 37-42 business_constraint: model/config feasibility ----
  - priority: 37
    category: business_constraint
    check: "equipment_sizing_selector finds at least one EquipmentModel whose headcount band contains Site.headcount and whose cups_per_hour_capacity >= Site.required_peak_cups_per_hour"
    error_id: ERR_NO_MODEL_FITS_HEADCOUNT
    http_status: 422
    applies_to: "POST /ocs/sites/{site_id}/size-and-plan"
  - priority: 38
    category: business_constraint
    check: "a TRAILING_USAGE site must have at least one COMPLETED ServiceVisit whose window_start falls in the trailing 28 days before it can be planned"
    error_id: ERR_NO_TRAILING_USAGE
    http_status: 422
    applies_to: "POST /ocs/sites/{site_id}/size-and-plan"
  - priority: 39
    category: business_constraint
    check: "awaiting_parts_cycles < MAX_AWAITING_PARTS_CYCLES (3) before a fourth entry into AWAITING_PARTS"
    error_id: ERR_AWAITING_PARTS_LIMIT_REACHED
    http_status: 422
    applies_to: "POST /ocs/maintenance-work-orders/{work_order_id}/advance with to_status == AWAITING_PARTS"
  - priority: 40
    category: business_constraint
    check: "abs(movement_bps) >= INDEX_MOVEMENT_THRESHOLD_BPS (800) - a smaller green coffee move is not adjustable"
    error_id: ERR_INDEX_MOVEMENT_BELOW_THRESHOLD
    http_status: 422
    applies_to: "POST /ocs/price-adjustments"
  - priority: 41
    category: business_constraint
    check: "revised_adjustment_pct_bps must lie between 0 and the current adjustment_pct_bps inclusive when that value is positive (mirrored for a negative adjustment) - a revision may only move toward the customer"
    error_id: ERR_REVISION_OUT_OF_BOUNDS
    http_status: 422
    applies_to: "POST /ocs/price-adjustments/{adjustment_id}/revise"
  - priority: 42
    category: business_constraint
    check: "every reported delivered_units is <= that line's requested_units and >= 0, and every reported product_id already appears in ServiceVisit.lines"
    error_id: ERR_DELIVERED_EXCEEDS_REQUESTED
    http_status: 422
    applies_to: "POST /ocs/service-visits/{visit_id}/complete"

  # ---- 43-46 business_fiscal: money and capacity last ----
  - priority: 43
    category: business_fiscal
    check: "a LOAN placement's minimum_purchase_cents must be >= LOAN_MINIMUM_FLOOR_CENTS (75000); RENTAL placements have no floor"
    error_id: ERR_MINIMUM_BELOW_LOAN_FLOOR
    http_status: 422
    applies_to: "POST /ocs/equipment-placements"
  - priority: 44
    category: business_fiscal
    check: "route_day_load booked minutes for the visit's UTC date plus the new planned_minutes must not exceed Route.capacity_minutes (exact equality is allowed)"
    error_id: ERR_ROUTE_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /ocs/service-visits, POST /ocs/service-visits/{visit_id}/reschedule"
  - priority: 45
    category: business_fiscal
    check: "invoice assembly produced at least one InvoiceLine (line_count >= 1)"
    error_id: ERR_NO_BILLABLE_LINES
    http_status: 422
    applies_to: "POST /ocs/consolidated-invoices"
  - priority: 46
    category: business_fiscal
    check: "the credit amount is > 0 and the cumulative credited amount does not exceed the invoice's pre-credit total_cents"
    error_id: ERR_CREDIT_EXCEEDS_INVOICE_TOTAL
    http_status: 422
    applies_to: "POST /ocs/consolidated-invoices/{invoice_id}/credit"

  # ---- 47-51 uniqueness and conditionally-required fields (create-time only) ----
  - priority: 47
    category: business_constraint
    check: "EquipmentModel.model_code is unique across the catalog"
    error_id: ERR_DUPLICATE_MODEL_CODE
    http_status: 409
    applies_to: "POST /ocs/equipment-models"
  - priority: 48
    category: business_constraint
    check: "EquipmentAsset.serial_number is unique across the fleet"
    error_id: ERR_DUPLICATE_SERIAL_NUMBER
    http_status: 409
    applies_to: "POST /ocs/equipment-assets"
  - priority: 49
    category: business_constraint
    check: "ProductItem.sku is unique across the catalog"
    error_id: ERR_DUPLICATE_SKU
    http_status: 409
    applies_to: "POST /ocs/product-items"
  - priority: 50
    category: business_constraint
    check: "at most one ParLevel row per (site_id, product_id) pair, whatever its source"
    error_id: ERR_DUPLICATE_PAR_LEVEL
    http_status: 409
    applies_to: "POST /ocs/par-levels"
  - priority: 51
    category: business_constraint
    check: "conditionally-required transition fields are present: parts_eta for to_status AWAITING_PARTS, resolution_note for to_status RESOLVED, dispute_reason for disposition DISPUTE"
    error_id: ERR_MISSING_TRANSITION_FIELD
    http_status: 422
    applies_to: "POST /ocs/maintenance-work-orders/{work_order_id}/advance, POST /ocs/price-adjustments/{adjustment_id}/respond"

endpoints:
  # ---------- test-driving surface (/_<name>) ----------
  - method: POST
    path: "/ocs/_clock/set_current_utc"
    description: "Sets the server's logical clock, which every deadline, window, trailing-period and depreciation rule reads. Before the first call the logical clock reads exactly 2026-08-01T00:00:00Z and MUST NOT fall back to real wall-clock time. The clock may move forward or backward."
    roles: [ProgramAdmin, AccountManager, BillingSpecialist]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects:
      - "current_utc := to_iso8601 for every subsequent request"
      - "no entity is mutated and no lazy transition fires at set time - lazy evaluation happens on the next business call"
  - method: POST
    path: "/ocs/_market/set_green_index"
    description: "Sets the current green coffee market index in micro-dollars per lb, the value green_index_adjustment compares against each Account's own baseline. At startup the market index reads 2000000."
    roles: [ProgramAdmin, BillingSpecialist]
    code: 200
    input: [index_micros]
    output: null
    side_effects:
      - "market index := index_micros; no Account is repriced until a PriceAdjustment is proposed and ACCEPTED"

  # ---------- Route ----------
  - method: POST
    path: "/ocs/routes"
    description: "Creates a replenishment route."
    roles: [ProgramAdmin]
    code: 201
    input: [name, service_day, capacity_minutes, "travel_buffer_minutes?"]
    output: Route
    side_effects: ["booked_minutes_total := 0", "travel_buffer_minutes defaults to 30 when omitted"]
  - method: GET
    path: "/ocs/routes"
    description: "Lists routes, newest first."
    roles: [ProgramAdmin, AccountManager, BillingSpecialist, RouteTechnician]
    code: 200
    input: ["service_day?", "limit?", "offset?"]
    output: Route[]
    side_effects: []
  - method: GET
    path: "/ocs/routes/{route_id}"
    description: "Reads one route including booked_minutes_total."
    roles: [ProgramAdmin, AccountManager, BillingSpecialist, RouteTechnician]
    code: 200
    input: []
    output: Route
    side_effects: []
  - method: GET
    path: "/ocs/routes/{route_id}/day-load"
    description: "Computed read: route_day_load for one UTC service date. Returns { service_date, booked_minutes_day, remaining_minutes, capacity_minutes }."
    roles: [ProgramAdmin, AccountManager, RouteTechnician]
    code: 200
    input: [service_date]
    output: null
    side_effects: []

  # ---------- EquipmentModel ----------
  - method: POST
    path: "/ocs/equipment-models"
    description: "Registers a brewer model in the catalog. Immutable once created (no update endpoint, no version field)."
    roles: [ProgramAdmin]
    code: 201
    input: [model_code, brewer_class, cups_per_hour_capacity, min_headcount, max_headcount, monthly_rent_cents, descale_interval_days, list_value_cents]
    output: EquipmentModel
    side_effects: []
  - method: GET
    path: "/ocs/equipment-models"
    description: "Lists brewer models."
    roles: [ProgramAdmin, AccountManager, BillingSpecialist]
    code: 200
    input: ["brewer_class?", "limit?", "offset?"]
    output: EquipmentModel[]
    side_effects: []
  - method: GET
    path: "/ocs/equipment-models/{model_id}"
    description: "Reads one brewer model."
    roles: [ProgramAdmin, AccountManager, BillingSpecialist]
    code: 200
    input: []
    output: EquipmentModel
    side_effects: []

  # ---------- EquipmentAsset ----------
  - method: POST
    path: "/ocs/equipment-assets"
    description: "Registers a serialized asset in the fleet. last_descale_at is stamped with current_utc, so a test that needs a descale-overdue asset creates it at an earlier clock position and then advances the clock."
    roles: [ProgramAdmin]
    code: 201
    input: [model_id, serial_number, asset_role]
    output: EquipmentAsset
    side_effects: ["asset_status := IN_STOCK", "last_descale_at := current_utc", "reconditioning_until := null"]
  - method: GET
    path: "/ocs/equipment-assets"
    description: "Lists fleet assets; filterable by model_id (FK reverse lookup from EquipmentModel), status and role."
    roles: [ProgramAdmin, AccountManager, RouteTechnician]
    code: 200
    input: ["model_id?", "asset_status?", "asset_role?", "limit?", "offset?"]
    output: EquipmentAsset[]
    side_effects: []
  - method: GET
    path: "/ocs/equipment-assets/{asset_id}"
    description: "Reads one fleet asset including asset_status and reconditioning_until."
    roles: [ProgramAdmin, AccountManager, RouteTechnician, BillingSpecialist]
    code: 200
    input: []
    output: EquipmentAsset
    side_effects: []

  # ---------- ProductItem ----------
  - method: POST
    path: "/ocs/product-items"
    description: "Adds a catalog product. Immutable once created (no update endpoint, no version field); repricing happens through the Account's green_price_factor_bps, never by editing the product."
    roles: [ProgramAdmin]
    code: 201
    input: [sku, category, base_unit_price_micros, pack_units, "green_coffee_linked?"]
    output: ProductItem
    side_effects: []
  - method: GET
    path: "/ocs/product-items"
    description: "Lists catalog products."
    roles: [ProgramAdmin, AccountManager, BillingSpecialist, RouteTechnician]
    code: 200
    input: ["category?", "green_coffee_linked?", "limit?", "offset?"]
    output: ProductItem[]
    side_effects: []
  - method: GET
    path: "/ocs/product-items/{product_id}"
    description: "Reads one catalog product."
    roles: [ProgramAdmin, AccountManager, BillingSpecialist, RouteTechnician]
    code: 200
    input: []
    output: ProductItem
    side_effects: []

  # ---------- Account ----------
  - method: POST
    path: "/ocs/accounts"
    description: "Creates a corporate account in program_posture ONBOARDING."
    roles: [AccountManager]
    code: 201
    input: [legal_name, billing_mode, green_index_baseline_micros, "price_protection_days?"]
    output: Account
    side_effects: ["program_posture := ONBOARDING", "green_price_factor_bps := 10000", "receivable_balance_cents := 0", "version := 1"]
  - method: GET
    path: "/ocs/accounts"
    description: "Lists accounts."
    roles: [AccountManager, BillingSpecialist, ProgramAdmin]
    code: 200
    input: ["program_posture?", "billing_mode?", "limit?", "offset?"]
    output: Account[]
    side_effects: []
  - method: GET
    path: "/ocs/accounts/{account_id}"
    description: "Reads one account including version, program_posture, receivable_balance_cents, green_price_factor_bps and price_protection_until. This is the read a client makes before an OCC-guarded write."
    roles: [AccountManager, BillingSpecialist, ProgramAdmin, CustomerContact]
    code: 200
    input: []
    output: Account
    side_effects: []
  - method: POST
    path: "/ocs/accounts/{account_id}/cancel"
    description: "Cancels the program. Head of the four-hop cancellation cascade."
    roles: [AccountManager]
    code: 200
    input: [cancel_reason, retrieval_due_by]
    output: Account
    side_effects:
      - "program_posture := CANCELLATION_PENDING; cancel_reason, retrieval_due_by, cancelled_at stamped"
      - "cascade hop 1: every ACTIVE EquipmentPlacement of every Site of the account -> RETRIEVAL_SCHEDULED with retrieval_due_by copied from the account"
      - "cascade hop 2: each of those Sites -> service_posture SUSPENDED"
      - "cascade hop 3: every SCHEDULED ServiceVisit of those Sites -> CANCELLED, releasing Route.booked_minutes_total"
      - "every DRAFT ConsolidatedInvoice of the account -> VOID"
      - "increments Account.version by 1"
  - method: POST
    path: "/ocs/accounts/{account_id}/recompute-allied-attachment"
    description: "Recomputes allied_attachment_rollup for the account over the trailing 90 days and returns the account."
    roles: [BillingSpecialist, AccountManager]
    code: 200
    input: []
    output: Account
    side_effects: ["Account.allied_attachment_bps := allied_attachment_rollup output (0 when the account has delivered nothing in the window)"]

  # ---------- Site ----------
  - method: POST
    path: "/ocs/sites"
    description: "Adds a break-room site to an account. brew_style stays null until size-and-plan runs."
    roles: [AccountManager]
    code: 201
    input: [account_id, route_id, site_name, headcount, days_per_week, consumption_model, service_minutes_estimate]
    output: Site
    side_effects: ["service_posture := ACTIVE", "escalation_score := 0.0", "recommended_model_id := null", "version := 1"]
  - method: GET
    path: "/ocs/sites"
    description: "Lists sites; filterable by account_id (FK reverse lookup from Account) and route_id (from Route)."
    roles: [AccountManager, BillingSpecialist, ProgramAdmin, RouteTechnician]
    code: 200
    input: ["account_id?", "route_id?", "service_posture?", "limit?", "offset?"]
    output: Site[]
    side_effects: []
  - method: GET
    path: "/ocs/sites/{site_id}"
    description: "Reads one site including version, forecast_cups_per_week, required_peak_cups_per_hour, recommended_model_id, escalation_score and consecutive_shortfall_visit_count."
    roles: [AccountManager, BillingSpecialist, ProgramAdmin, RouteTechnician]
    code: 200
    input: []
    output: Site
    side_effects: []
  - method: PATCH
    path: "/ocs/sites/{site_id}"
    description: "Updates the site's demand attributes. Does NOT re-run the forecast - size-and-plan must be called again."
    roles: [AccountManager]
    code: 200
    input: ["headcount?", "days_per_week?", "consumption_model?", "route_id?"]
    output: Site
    side_effects: ["the supplied fields are replaced", "increments Site.version by 1", "forecast_cups_per_week, required_peak_cups_per_hour, recommended_model_id and existing ParLevel rows are left untouched"]
  - method: POST
    path: "/ocs/sites/{site_id}/size-and-plan"
    description: "Runs site_consumption_forecast in the variant named by Site.consumption_model, then equipment_sizing_selector. Rewrites every FORECAST ParLevel row of the site and leaves MANUAL rows untouched."
    roles: [AccountManager]
    code: 200
    input: [brew_style]
    output: Site
    side_effects:
      - "brew_style stamped; forecast_cups_per_week and required_peak_cups_per_hour := site_consumption_forecast output"
      - "recommended_model_id := equipment_sizing_selector output"
      - "one ParLevel row with source FORECAST is created or overwritten per catalog ProductItem (par_units, reorder_point_units); a newly created row starts at on_hand_units 0, zero cumulative counters, last_service_at := current_utc and stock_status STOCKOUT, while an overwrite touches ONLY par_units and reorder_point_units"
      - "increments Site.version by 1"
  - method: POST
    path: "/ocs/sites/{site_id}/evaluate-service-posture"
    description: "Recomputes site_escalation_score and applies the ACTIVE <-> ESCALATED transition, carrying the change up into Account.escalated_site_count and the account's AT_RISK posture."
    roles: [AccountManager, BillingSpecialist]
    code: 200
    input: []
    output: Site
    side_effects:
      - "escalation_score := site_escalation_score output"
      - "service_posture := ESCALATED when the score >= 40.0 and the site was ACTIVE; := ACTIVE when the score < 40.0 and the site was ESCALATED; unchanged otherwise (idempotent no-op)"
      - "Account.escalated_site_count recomputed, which may move the Account ACTIVE -> AT_RISK (deferring its PROPOSED price adjustments) or AT_RISK -> ACTIVE (restoring them)"
      - "increments Site.version by 1 only when service_posture actually changed"

  # ---------- ParLevel ----------
  - method: POST
    path: "/ocs/par-levels"
    description: "Creates a MANUAL par line for a (site, product) pair, stocking a product the forecast did not cover. MANUAL rows survive every later size-and-plan run."
    roles: [AccountManager]
    code: 201
    input: [site_id, product_id, par_units, reorder_point_units]
    output: ParLevel
    side_effects: ["source := MANUAL", "on_hand_units := 0; cumulative counters := 0", "last_service_at := current_utc", "stock_status := STOCKOUT (on_hand_units == 0)"]
  - method: GET
    path: "/ocs/par-levels"
    description: "Lists par lines; filterable by site_id (FK reverse lookup from Site) and product_id (from ProductItem)."
    roles: [AccountManager, RouteTechnician, BillingSpecialist]
    code: 200
    input: ["site_id?", "product_id?", "stock_status?", "source?", "limit?", "offset?"]
    output: ParLevel[]
    side_effects: []
  - method: GET
    path: "/ocs/par-levels/{par_level_id}"
    description: "Reads one par line including on_hand_units, both cumulative counters, last_service_at and stock_status - the observables of the ParLevel unit invariant."
    roles: [AccountManager, RouteTechnician, BillingSpecialist]
    code: 200
    input: []
    output: ParLevel
    side_effects: []
  - method: PATCH
    path: "/ocs/par-levels/{par_level_id}"
    description: "Overrides a par line's targets and pins it as MANUAL."
    roles: [AccountManager]
    code: 200
    input: ["par_units?", "reorder_point_units?"]
    output: ParLevel
    side_effects: ["the supplied fields are replaced", "source := MANUAL", "stock_status recomputed against the new reorder_point_units", "increments ParLevel.version by 1"]

  # ---------- EquipmentPlacement ----------
  - method: POST
    path: "/ocs/equipment-placements"
    description: "Installs a brewer at a planned site under LOAN or RENTAL terms. OCC-guarded on the Site (§1.2.1 placement-create-stale-site) because the write supersedes the site's prior ACTIVE placement."
    roles: [AccountManager]
    code: 201
    input: [site_id, asset_id, terms_type, minimum_purchase_cents, min_term_months, expected_site_version]
    output: EquipmentPlacement
    side_effects:
      - "placement_status := ACTIVE; compliance_status := MEETING_MINIMUM; placed_at := current_utc; trailing_purchase_cents := 0"
      - "EquipmentAsset.asset_status := PLACED"
      - "any prior ACTIVE placement of the same site -> SUPERSEDED and its asset -> IN_STOCK"
      - "Account.program_posture ONBOARDING -> ACTIVE"
      - "increments Site.version by 1"
  - method: GET
    path: "/ocs/equipment-placements"
    description: "Lists placements; filterable by site_id (FK reverse lookup from Site) and asset_id (from EquipmentAsset)."
    roles: [AccountManager, BillingSpecialist, ProgramAdmin]
    code: 200
    input: ["site_id?", "asset_id?", "placement_status?", "compliance_status?", "terms_type?", "limit?", "offset?"]
    output: EquipmentPlacement[]
    side_effects: []
  - method: GET
    path: "/ocs/equipment-placements/{placement_id}"
    description: "Reads one placement including both state dimensions, trailing_purchase_cents, shortfall_fee_cents, rent_charge_cents, retrieval_due_by and unreturned_billed_cents."
    roles: [AccountManager, BillingSpecialist, ProgramAdmin]
    code: 200
    input: []
    output: EquipmentPlacement
    side_effects: []
  - method: POST
    path: "/ocs/equipment-placements/{placement_id}/evaluate-compliance"
    description: "Runs trailing_purchase_rollup then advances compliance_status one step around the MEETING_MINIMUM -> SHORTFALL_WARNED -> SHORTFALL_BILLED -> MEETING_MINIMUM cycle. Calling it while already MEETING_MINIMUM and above the commitment is an idempotent no-op that only refreshes trailing_purchase_cents."
    roles: [BillingSpecialist]
    code: 200
    input: []
    output: EquipmentPlacement
    side_effects:
      - "trailing_purchase_cents := trailing_purchase_rollup output"
      - "compliance_status advances per the EquipmentPlacement.compliance_status machine"
      - "shortfall_fee_cents := equipment_program_charge shortfall component, in the variant selected by terms_type, only on entry to SHORTFALL_BILLED"
      - "increments EquipmentPlacement.version by 1"
  - method: POST
    path: "/ocs/equipment-placements/{placement_id}/retrieve"
    description: "Records physical retrieval of the brewer. retrieved_asset_condition is a transient enum input, SERVICEABLE | UNSERVICEABLE, and is not persisted on any entity. Retrieving after an unreturned write-off does NOT auto-credit the issued line."
    roles: [AccountManager]
    code: 200
    input: [retrieved_asset_condition]
    output: EquipmentPlacement
    side_effects:
      - "placement_status := RETRIEVED"
      - "EquipmentAsset.asset_status := RETIRED when retrieved_asset_condition == UNSERVICEABLE, else RECONDITIONING with reconditioning_until := current_utc + 1 day"
      - "when this was the account's last non-terminal placement and the account is CANCELLATION_PENDING: Account.program_posture := CLOSED and every SUSPENDED Site of the account := CLOSED"

  # ---------- ServiceVisit ----------
  - method: POST
    path: "/ocs/service-visits"
    description: "Schedules a replenishment stop. route_id is copied from Site.route_id and is never client-supplied."
    roles: [AccountManager, ProgramAdmin]
    code: 201
    input: [site_id, window_start, window_end, planned_minutes]
    output: ServiceVisit
    side_effects:
      - "visit_status := SCHEDULED; route_id := Site.route_id; lines := []"
      - "Route.booked_minutes_total += planned_minutes"
  - method: GET
    path: "/ocs/service-visits"
    description: "Lists visits; filterable by site_id (FK reverse lookup from Site) and route_id (from Route)."
    roles: [AccountManager, ProgramAdmin, BillingSpecialist, RouteTechnician]
    code: 200
    input: ["site_id?", "route_id?", "visit_status?", "service_date?", "limit?", "offset?"]
    output: ServiceVisit[]
    side_effects: []
  - method: GET
    path: "/ocs/service-visits/{visit_id}"
    description: "Reads one visit including the lines array with its per-element delivered_units, consumed_units, effective_unit_price_micros and resulting_on_hand_units."
    roles: [AccountManager, ProgramAdmin, BillingSpecialist, RouteTechnician]
    code: 200
    input: []
    output: ServiceVisit
    side_effects: []
  - method: POST
    path: "/ocs/service-visits/{visit_id}/lines"
    description: "Appends one requested line to a SCHEDULED visit. The technician on the visit's own route is the only actor allowed."
    roles: [RouteTechnician]
    code: 200
    input: [product_id, requested_units]
    output: ServiceVisit
    side_effects: ["a lines element { product_id, requested_units } is appended; the delivery members stay null until completion"]
  - method: POST
    path: "/ocs/service-visits/{visit_id}/reschedule"
    description: "Moves a SCHEDULED visit's window, re-running route_window_conflict and route_day_load against the new window."
    roles: [AccountManager, ProgramAdmin]
    code: 200
    input: [window_start, window_end]
    output: ServiceVisit
    side_effects: ["window_start and window_end replaced", "Route.booked_minutes_total is unchanged when planned_minutes is unchanged"]
  - method: POST
    path: "/ocs/service-visits/{visit_id}/complete"
    description: "Completes the stop. Head of the four-hop replenishment cascade: par ledger -> site posture -> account posture -> price adjustments. delivered_lines is an array of { product_id, delivered_units }; a stocked product omitted from delivered_lines completes with delivered_units 0."
    roles: [RouteTechnician]
    code: 200
    input: [delivered_lines]
    output: ServiceVisit
    side_effects:
      - "per lines element: consumed_units := consumption_debit output (debited BEFORE the delivery credit), delivered_units, effective_unit_price_micros := effective_unit_price output, resulting_on_hand_units"
      - "cascade hop 1: each touched ParLevel gets cumulative_consumed_units += consumed_units, cumulative_delivered_units += delivered_units, on_hand_units := cumulative_delivered_units - cumulative_consumed_units, last_service_at := window_start, stock_status recomputed"
      - "shortfall_flag and Site.consecutive_shortfall_visit_count updated"
      - "cascade hop 2: Site.escalation_score recomputed, possibly ACTIVE -> ESCALATED"
      - "cascade hops 3-4: Account.escalated_site_count -> program_posture ACTIVE -> AT_RISK -> every PROPOSED PriceAdjustment of the account -> DEFERRED"
      - "visit_status := COMPLETED; completed_at := current_utc"
  - method: POST
    path: "/ocs/service-visits/{visit_id}/void"
    description: "Compensating action that unwinds a COMPLETED visit. Refused once a non-VOID invoice covers the visit's window."
    roles: [ProgramAdmin]
    code: 200
    input: [void_reason]
    output: ServiceVisit
    side_effects:
      - "visit_status := VOIDED; void_reason stamped"
      - "every ParLevel touched by the visit has both cumulative counters reduced by that line's amounts and on_hand_units re-derived, so on_hand_units == cumulative_delivered_units - cumulative_consumed_units holds with no drift"
      - "ParLevel.last_service_at reverts to the window_start of the most recent remaining COMPLETED visit touching that line, else to the row's created_at"
      - "Route.booked_minutes_total -= planned_minutes"
      - "Site.consecutive_shortfall_visit_count and Site.escalation_score recomputed, possibly ESCALATED -> ACTIVE and Account AT_RISK -> ACTIVE"

  # ---------- MaintenanceWorkOrder ----------
  - method: POST
    path: "/ocs/maintenance-work-orders"
    description: "Opens a work order on a placed brewer. site_id is copied from the asset's ACTIVE placement and is never client-supplied."
    roles: [RouteTechnician, ProgramAdmin]
    code: 201
    input: [asset_id, wo_type]
    output: MaintenanceWorkOrder
    side_effects: ["wo_status := OPEN; loaner_status := NONE; awaiting_parts_cycles := 0", "site_id := the site of the asset's ACTIVE EquipmentPlacement"]
  - method: GET
    path: "/ocs/maintenance-work-orders"
    description: "Lists work orders; filterable by asset_id and loaner_asset_id (both FK reverse lookups from EquipmentAsset) and site_id (from Site)."
    roles: [RouteTechnician, ProgramAdmin, AccountManager, BillingSpecialist]
    code: 200
    input: ["asset_id?", "site_id?", "loaner_asset_id?", "wo_status?", "loaner_status?", "wo_type?", "limit?", "offset?"]
    output: MaintenanceWorkOrder[]
    side_effects: []
  - method: GET
    path: "/ocs/maintenance-work-orders/{work_order_id}"
    description: "Reads one work order including both state dimensions, awaiting_parts_cycles and the loaner window fields."
    roles: [RouteTechnician, ProgramAdmin, AccountManager, BillingSpecialist]
    code: 200
    input: []
    output: MaintenanceWorkOrder
    side_effects: []
  - method: POST
    path: "/ocs/maintenance-work-orders/{work_order_id}/advance"
    description: "Drives the wo_status dimension. parts_eta is required for AWAITING_PARTS, resolution_note for RESOLVED."
    roles: [RouteTechnician]
    code: 200
    input: [to_status, "parts_eta?", "resolution_note?"]
    output: MaintenanceWorkOrder
    side_effects:
      - "wo_status := to_status when the transition is declared"
      - "awaiting_parts_cycles += 1 on each entry into AWAITING_PARTS, capped at 3 entries"
      - "on RESOLVED of a DESCALE order: EquipmentAsset.last_descale_at := current_utc"
      - "on RESOLVED: Site.escalation_score recomputed, possibly ESCALATED -> ACTIVE and Account AT_RISK -> ACTIVE"
  - method: POST
    path: "/ocs/maintenance-work-orders/{work_order_id}/loaner-swap"
    description: "Attaches a LOANER asset for the duration of the repair, subject to loaner_window_conflict and the sanitation hold."
    roles: [RouteTechnician]
    code: 200
    input: [loaner_asset_id, loaner_out_date, loaner_due_back_date]
    output: MaintenanceWorkOrder
    side_effects:
      - "loaner_asset_id, loaner_out_date, loaner_due_back_date stamped; loaner_status := OUT"
      - "the loaner asset's asset_status := ON_LOAN (a RECONDITIONING asset whose hold has expired lazily becomes IN_STOCK first)"
  - method: POST
    path: "/ocs/maintenance-work-orders/{work_order_id}/loaner-return"
    description: "Records the loaner coming back. Lazily promotes an overdue loaner to OVERDUE first, so the returned row still lands in RETURNED."
    roles: [RouteTechnician]
    code: 200
    input: [returned_on]
    output: MaintenanceWorkOrder
    side_effects:
      - "loaner_returned_on := returned_on; loaner_status := RETURNED"
      - "the loaner asset's asset_status := RECONDITIONING and reconditioning_until := returned_on + 1 day, which blocks the next swap for exactly one calendar day"

  # ---------- ConsolidatedInvoice ----------
  - method: POST
    path: "/ocs/consolidated-invoices"
    description: "Assembles a DRAFT invoice for a closed period per invoice_assembly_order. OCC-guarded on the Account (§1.2.1 invoice-draft-create-stale-account). site_id is required for a PER_SITE account and forbidden for a CONSOLIDATED one."
    roles: [BillingSpecialist]
    code: 201
    input: [account_id, period_start, period_end, expected_account_version, "site_id?"]
    output: ConsolidatedInvoice
    side_effects:
      - "one PRODUCT InvoiceLine per delivered visit line in scope, priced from the snapshotted effective_unit_price_micros and rounded per line"
      - "one RENT line per RENTAL placement billable in the period whose prorated rent_charge_cents is non-zero (LOAN placements never produce a RENT line) and one SHORTFALL line per placement in compliance_status SHORTFALL_BILLED with a non-zero fee"
      - "every RETRIEVAL_SCHEDULED placement past its retrieval_due_by -> UNRETURNED_BILLED with an UNRETURNED_ASSET line priced by unreturned_asset_charge, and its asset -> UNRETURNED"
      - "every OUT loaner past its due date -> OVERDUE, and every OVERDUE loaner more than 30 days past due -> WRITTEN_OFF with its own UNRETURNED_ASSET line and asset -> UNRETURNED"
      - "pre_freight_total_cents, allied_category_count, allied_discount_bps, one negative ALLIED_DISCOUNT line per site, freight_cents (a FREIGHT line only when non-zero), total_cents and line_count per invoice_assembly_order"
      - "invoice_status := DRAFT"
      - "increments Account.version by 1"
  - method: GET
    path: "/ocs/consolidated-invoices"
    description: "Lists invoices; filterable by account_id (FK reverse lookup from Account) and site_id (from Site)."
    roles: [BillingSpecialist, AccountManager, CustomerContact]
    code: 200
    input: ["account_id?", "site_id?", "invoice_status?", "limit?", "offset?"]
    output: ConsolidatedInvoice[]
    side_effects: []
  - method: GET
    path: "/ocs/consolidated-invoices/{invoice_id}"
    description: "Reads one invoice including pre_freight_total_cents, allied_discount_bps, allied_discount_cents, freight_cents, total_cents and line_count."
    roles: [BillingSpecialist, AccountManager, CustomerContact]
    code: 200
    input: []
    output: ConsolidatedInvoice
    side_effects: []
  - method: POST
    path: "/ocs/consolidated-invoices/{invoice_id}/issue"
    description: "Issues a DRAFT invoice, moving its total onto the account receivable."
    roles: [BillingSpecialist]
    code: 200
    input: []
    output: ConsolidatedInvoice
    side_effects:
      - "invoice_status := ISSUED; issued_at := current_utc"
      - "Account.receivable_balance_cents += total_cents"
      - "Account.allied_attachment_bps recomputed"
      - "every placement whose SHORTFALL line was emitted on this invoice has shortfall_fee_cents := 0"
  - method: POST
    path: "/ocs/consolidated-invoices/{invoice_id}/credit"
    description: "Posts a compensating CREDIT line against one line of an issued invoice - the only way to reverse an unreturned-asset charge after the equipment turns up. Returns the created CREDIT line."
    roles: [BillingSpecialist]
    code: 201
    input: [target_line_id, amount_cents, credit_reason]
    output: InvoiceLine
    side_effects:
      - "a CREDIT InvoiceLine with amount_cents == -amount_cents, line_type CREDIT and target_line_id set is appended; the target line's credits_applied_cents += amount_cents"
      - "ConsolidatedInvoice.total_cents recomputed as the sum of all lines; line_count += 1"
      - "invoice_status := PARTIALLY_CREDITED, or FULLY_CREDITED when the cumulative credits equal the pre-credit total"
      - "Account.receivable_balance_cents -= amount_cents"

  # ---------- InvoiceLine ----------
  - method: GET
    path: "/ocs/invoice-lines"
    description: "Lists invoice lines; filterable by invoice_id (FK reverse lookup from ConsolidatedInvoice), site_id (from Site) and target_line_id (the self-referential FK, which finds the CREDIT lines posted against a given line). This is the only discovery channel for lines synthesized by draft assembly."
    roles: [BillingSpecialist, AccountManager, CustomerContact]
    code: 200
    input: ["invoice_id?", "site_id?", "target_line_id?", "line_type?", "product_id?", "limit?", "offset?"]
    output: InvoiceLine[]
    side_effects: []
  - method: GET
    path: "/ocs/invoice-lines/{line_id}"
    description: "Reads one invoice line including qty_units, unit_price_micros, amount_cents and credits_applied_cents."
    roles: [BillingSpecialist, AccountManager, CustomerContact]
    code: 200
    input: []
    output: InvoiceLine
    side_effects: []

  # ---------- PriceAdjustment ----------
  - method: POST
    path: "/ocs/price-adjustments"
    description: "Proposes a green-coffee price adjustment against the account's own baseline, per green_index_adjustment. Refused while the account is inside its price-protection window or when the index has moved less than 800 bps."
    roles: [BillingSpecialist]
    code: 201
    input: [account_id, effective_at]
    output: PriceAdjustment
    side_effects:
      - "index_baseline_micros := Account.green_index_baseline_micros; index_current_micros := the current market index"
      - "movement_bps and adjustment_pct_bps := green_index_adjustment output, capped at +/- 1500 bps"
      - "adj_status := PROPOSED; revision_count := 0; the account's prices are untouched until the customer accepts"
  - method: GET
    path: "/ocs/price-adjustments"
    description: "Lists price adjustments; filterable by account_id (FK reverse lookup from Account)."
    roles: [BillingSpecialist, AccountManager, CustomerContact]
    code: 200
    input: ["account_id?", "adj_status?", "limit?", "offset?"]
    output: PriceAdjustment[]
    side_effects: []
  - method: GET
    path: "/ocs/price-adjustments/{adjustment_id}"
    description: "Reads one adjustment including movement_bps, adjustment_pct_bps, revision_count and adj_status."
    roles: [BillingSpecialist, AccountManager, CustomerContact]
    code: 200
    input: []
    output: PriceAdjustment
    side_effects: []
  - method: POST
    path: "/ocs/price-adjustments/{adjustment_id}/respond"
    description: "The customer accepts or disputes. Only the CustomerContact whose X-User-ID equals the adjustment's account_id may call it, and never while the adjustment is DEFERRED."
    roles: [CustomerContact]
    code: 200
    input: [disposition, "dispute_reason?"]
    output: PriceAdjustment
    side_effects:
      - "on ACCEPT: adj_status := ACCEPTED, accepted_at := current_utc, Account.green_price_factor_bps := 10000 + adjustment_pct_bps, Account.green_index_baseline_micros := index_current_micros, Account.price_protection_until := current_utc + price_protection_days, and Account.version += 1"
      - "on DISPUTE: adj_status := DISPUTED, dispute_reason stamped, and no price on the account changes"
  - method: POST
    path: "/ocs/price-adjustments/{adjustment_id}/revise"
    description: "Billing lowers a disputed adjustment and re-proposes it, closing the PROPOSED -> DISPUTED -> PROPOSED negotiation cycle."
    roles: [BillingSpecialist]
    code: 200
    input: [revised_adjustment_pct_bps]
    output: PriceAdjustment
    side_effects: ["adjustment_pct_bps := revised_adjustment_pct_bps; revision_count += 1; adj_status := PROPOSED"]

errors:
  # ---- auth ----
  - id: ERR_MISSING_AUTH_HEADERS
    http: 401
    condition: "X-User-Role or X-User-ID absent, or X-User-Role is not one of the five declared roles"
  - id: ERR_UNKNOWN_ACTOR_IDENTITY
    http: 401
    condition: "X-User-ID of an entity_backed role does not resolve: RouteTechnician to a Route, CustomerContact to an Account"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the acting role is not listed on the endpoint"
  - id: ERR_ACTOR_NOT_ON_ROUTE
    http: 403
    condition: "a RouteTechnician acts on a visit or work order that belongs to a different route"
  - id: ERR_ACTOR_NOT_ACCOUNT_CONTACT
    http: 403
    condition: "a CustomerContact responds to a price adjustment of another account"
  # ---- request shape ----
  - id: ERR_VALIDATION
    http: 400
    condition: "missing required field, wrong type, unknown enum member, out-of-range integer, unparseable instant, or limit/offset outside 1..100 / >= 0"
  # ---- existence ----
  - id: ERR_ACCOUNT_NOT_FOUND
    http: 404
    condition: "account_id does not resolve"
  - id: ERR_SITE_NOT_FOUND
    http: 404
    condition: "site_id does not resolve"
  - id: ERR_ROUTE_NOT_FOUND
    http: 404
    condition: "route_id does not resolve"
  - id: ERR_MODEL_NOT_FOUND
    http: 404
    condition: "model_id does not resolve"
  - id: ERR_ASSET_NOT_FOUND
    http: 404
    condition: "asset_id or loaner_asset_id does not resolve"
  - id: ERR_PLACEMENT_NOT_FOUND
    http: 404
    condition: "placement_id does not resolve"
  - id: ERR_PRODUCT_NOT_FOUND
    http: 404
    condition: "product_id does not resolve"
  - id: ERR_PAR_LEVEL_NOT_FOUND
    http: 404
    condition: "par_level_id does not resolve"
  - id: ERR_VISIT_NOT_FOUND
    http: 404
    condition: "visit_id does not resolve"
  - id: ERR_WORK_ORDER_NOT_FOUND
    http: 404
    condition: "work_order_id does not resolve"
  - id: ERR_INVOICE_NOT_FOUND
    http: 404
    condition: "invoice_id does not resolve"
  - id: ERR_INVOICE_LINE_NOT_FOUND
    http: 404
    condition: "line_id or target_line_id does not resolve"
  - id: ERR_ADJUSTMENT_NOT_FOUND
    http: 404
    condition: "adjustment_id does not resolve"
  # ---- optimistic concurrency ----
  - id: ERR_STALE_SITE_VERSION
    http: 412
    condition: "expected_site_version differs from the current Site.version on POST /ocs/equipment-placements"
  - id: ERR_STALE_ACCOUNT_VERSION
    http: 412
    condition: "expected_account_version differs from the current Account.version on POST /ocs/consolidated-invoices"
  # ---- state ----
  - id: ERR_ACCOUNT_NOT_OPERATING
    http: 409
    condition: "the account's program_posture forbids the operation (CANCELLATION_PENDING or CLOSED, or a second cancel)"
  - id: ERR_SITE_NOT_SERVICEABLE
    http: 409
    condition: "the site's service_posture is SUSPENDED or CLOSED"
  - id: ERR_PLACEMENT_STATE_INVALID
    http: 409
    condition: "the placement's placement_status does not allow the requested action"
  - id: ERR_ASSET_NOT_AVAILABLE
    http: 409
    condition: "the asset's asset_status is not IN_STOCK when a placement is created"
  - id: ERR_VISIT_STATE_INVALID
    http: 409
    condition: "the visit's visit_status does not allow the requested action"
  - id: ERR_WORK_ORDER_STATE_INVALID
    http: 409
    condition: "the requested wo_status transition is not declared from the current wo_status"
  - id: ERR_LOANER_STATE_INVALID
    http: 409
    condition: "the loaner_status does not allow the requested action, including resolving a work order whose loaner is still OUT"
  - id: ERR_INVOICE_STATE_INVALID
    http: 409
    condition: "the invoice_status does not allow issuing or crediting"
  - id: ERR_ADJUSTMENT_STATE_INVALID
    http: 409
    condition: "the adj_status does not allow responding or revising"
  - id: ERR_ADJUSTMENT_DEFERRED
    http: 409
    condition: "the customer tries to respond while the adjustment is DEFERRED because the account is AT_RISK"
  # ---- business_safety ----
  - id: ERR_ASSET_UNDER_SANITATION_HOLD
    http: 422
    condition: "a loaner still inside its reconditioning window is requested for a new swap"
  - id: ERR_DESCALE_OVERDUE
    http: 422
    condition: "a PREVENTIVE work order is resolved while the asset is past its descale interval"
  - id: ERR_ASSET_ROLE_MISMATCH
    http: 422
    condition: "a LOANER asset is placed at a site, or a PLACEMENT asset is used as a loaner"
  # ---- business_temporal ----
  - id: ERR_VISIT_WINDOW_INVALID
    http: 422
    condition: "window_end <= window_start, or window_start does not fall on the route's service_day"
  - id: ERR_ROUTE_WINDOW_CONFLICT
    http: 409
    condition: "the buffered candidate window overlaps another SCHEDULED or COMPLETED visit of the same route"
  - id: ERR_LOANER_NOT_AVAILABLE
    http: 409
    condition: "the loaner asset is held or blocked by another work order over the requested closed date interval, or loaner_due_back_date < loaner_out_date"
  - id: ERR_VISIT_NOT_YET_STARTED
    http: 422
    condition: "completion is attempted before window_start"
  - id: ERR_PERIOD_INVALID
    http: 422
    condition: "period_end <= period_start, or period_end is in the future relative to current_utc"
  - id: ERR_INVOICE_PERIOD_OVERLAP
    http: 409
    condition: "a non-VOID invoice already covers an overlapping closed period for the same scope"
  - id: ERR_PRICE_PROTECTION_ACTIVE
    http: 422
    condition: "a new price adjustment is proposed before Account.price_protection_until"
  # ---- business_referential ----
  - id: ERR_SITE_NOT_PLANNED
    http: 422
    condition: "a placement or visit is created for a site whose recommended_model_id is still null"
  - id: ERR_PRODUCT_NOT_STOCKED
    http: 422
    condition: "a visit line names a product with no ParLevel row at that site"
  - id: ERR_DUPLICATE_VISIT_LINE
    http: 422
    condition: "a second line is added for a product already on the visit"
  - id: ERR_CREDIT_TARGET_MISMATCH
    http: 422
    condition: "target_line_id belongs to another invoice or is itself a CREDIT line"
  - id: ERR_SITE_NOT_IN_ACCOUNT
    http: 422
    condition: "the invoice's site_id names a site of a different account"
  - id: ERR_BILLING_MODE_MISMATCH
    http: 422
    condition: "site_id supplied for a CONSOLIDATED account, or omitted for a PER_SITE account"
  # ---- business_constraint ----
  - id: ERR_NO_MODEL_FITS_HEADCOUNT
    http: 422
    condition: "no EquipmentModel satisfies both the headcount band and the required peak cups per hour"
  - id: ERR_NO_TRAILING_USAGE
    http: 422
    condition: "a TRAILING_USAGE site has no COMPLETED visit in the trailing 28 days"
  - id: ERR_AWAITING_PARTS_LIMIT_REACHED
    http: 422
    condition: "a fourth entry into AWAITING_PARTS is attempted"
  - id: ERR_INDEX_MOVEMENT_BELOW_THRESHOLD
    http: 422
    condition: "abs(movement_bps) < 800"
  - id: ERR_REVISION_OUT_OF_BOUNDS
    http: 422
    condition: "revised_adjustment_pct_bps lies outside the closed interval between 0 and the current adjustment_pct_bps"
  - id: ERR_DELIVERED_EXCEEDS_REQUESTED
    http: 422
    condition: "a reported delivered_units exceeds its line's requested_units, is negative, or names a product absent from the visit's lines"
  - id: ERR_DUPLICATE_MODEL_CODE
    http: 409
    condition: "model_code already exists"
  - id: ERR_DUPLICATE_SERIAL_NUMBER
    http: 409
    condition: "serial_number already exists"
  - id: ERR_DUPLICATE_SKU
    http: 409
    condition: "sku already exists"
  - id: ERR_DUPLICATE_PAR_LEVEL
    http: 409
    condition: "a ParLevel row already exists for the (site_id, product_id) pair"
  - id: ERR_MISSING_TRANSITION_FIELD
    http: 422
    condition: "parts_eta, resolution_note or dispute_reason omitted where the requested transition requires it"
  # ---- business_fiscal ----
  - id: ERR_MINIMUM_BELOW_LOAN_FLOOR
    http: 422
    condition: "a LOAN placement declares minimum_purchase_cents below 75000"
  - id: ERR_ROUTE_CAPACITY_EXCEEDED
    http: 422
    condition: "the visit's planned_minutes would push that UTC date past Route.capacity_minutes"
  - id: ERR_NO_BILLABLE_LINES
    http: 422
    condition: "invoice assembly produced zero lines"
  - id: ERR_CREDIT_EXCEEDS_INVOICE_TOTAL
    http: 422
    condition: "the credit amount is <= 0 or the cumulative credits would exceed the invoice's pre-credit total_cents"

roles:
  - name: ProgramAdmin
    description: "Operations owner of the fleet, the product catalog and the route network; also the only role that may void a completed visit."
    identity: "opaque"
    exclusive_operations:
      - "POST /ocs/routes"
      - "POST /ocs/equipment-models"
      - "POST /ocs/equipment-assets"
      - "POST /ocs/product-items"
      - "POST /ocs/service-visits/{visit_id}/void"
    shared_operations:
      - "POST /ocs/_clock/set_current_utc (with AccountManager and BillingSpecialist)"
      - "POST /ocs/_market/set_green_index (with BillingSpecialist)"
      - "POST /ocs/service-visits and /reschedule (with AccountManager)"
      - "POST /ocs/maintenance-work-orders (with RouteTechnician)"
      - "every catalog, fleet, site, placement and visit GET"
  - name: AccountManager
    description: "Owns the customer program lifecycle: accounts, sites, planning, par overrides, placements, retrieval and visit scheduling."
    identity: "opaque"
    exclusive_operations:
      - "POST /ocs/accounts"
      - "POST /ocs/accounts/{account_id}/cancel"
      - "POST /ocs/sites"
      - "PATCH /ocs/sites/{site_id}"
      - "POST /ocs/sites/{site_id}/size-and-plan"
      - "POST /ocs/par-levels"
      - "PATCH /ocs/par-levels/{par_level_id}"
      - "POST /ocs/equipment-placements"
      - "POST /ocs/equipment-placements/{placement_id}/retrieve"
    shared_operations:
      - "POST /ocs/sites/{site_id}/evaluate-service-posture (with BillingSpecialist)"
      - "POST /ocs/accounts/{account_id}/recompute-allied-attachment (with BillingSpecialist)"
      - "POST /ocs/service-visits and /reschedule (with ProgramAdmin)"
      - "POST /ocs/_clock/set_current_utc (with ProgramAdmin and BillingSpecialist)"
      - "account, site, placement, invoice and adjustment GETs"
  - name: BillingSpecialist
    description: "Owns money: compliance evaluation, invoice assembly, issuance, credits and green-coffee price proposals."
    identity: "opaque"
    exclusive_operations:
      - "POST /ocs/equipment-placements/{placement_id}/evaluate-compliance"
      - "POST /ocs/consolidated-invoices"
      - "POST /ocs/consolidated-invoices/{invoice_id}/issue"
      - "POST /ocs/consolidated-invoices/{invoice_id}/credit"
      - "POST /ocs/price-adjustments"
      - "POST /ocs/price-adjustments/{adjustment_id}/revise"
    shared_operations:
      - "POST /ocs/sites/{site_id}/evaluate-service-posture (with AccountManager)"
      - "POST /ocs/accounts/{account_id}/recompute-allied-attachment (with AccountManager)"
      - "POST /ocs/_market/set_green_index (with ProgramAdmin)"
      - "POST /ocs/_clock/set_current_utc (with ProgramAdmin and AccountManager)"
      - "invoice, invoice-line, placement and adjustment GETs"
  - name: RouteTechnician
    description: "The field technician of one route. X-User-ID is that Route's id, and every write is scoped to visits and work orders of that route."
    identity: "entity_backed:Route"
    exclusive_operations:
      - "POST /ocs/service-visits/{visit_id}/lines"
      - "POST /ocs/service-visits/{visit_id}/complete"
      - "POST /ocs/maintenance-work-orders/{work_order_id}/advance"
      - "POST /ocs/maintenance-work-orders/{work_order_id}/loaner-swap"
      - "POST /ocs/maintenance-work-orders/{work_order_id}/loaner-return"
    shared_operations:
      - "POST /ocs/maintenance-work-orders (with ProgramAdmin)"
      - "route, site, par-level, visit, asset and work-order GETs"
  - name: CustomerContact
    description: "The customer-side signer of one account. X-User-ID is that Account's id, and this is the ONLY role that may accept or dispute a price adjustment."
    identity: "entity_backed:Account"
    exclusive_operations:
      - "POST /ocs/price-adjustments/{adjustment_id}/respond"
    shared_operations:
      - "GET /ocs/accounts/{account_id}"
      - "GET /ocs/consolidated-invoices, GET /ocs/consolidated-invoices/{invoice_id}"
      - "GET /ocs/invoice-lines, GET /ocs/invoice-lines/{line_id}"
      - "GET /ocs/price-adjustments, GET /ocs/price-adjustments/{adjustment_id}"
