          Priority 35 declares seven uniqueness constraints at two different scopes: cip_code and fiscal_year are global,
          while course code, credential code, state_student_id and the indicator triple are scoped per program and the
          chair constraint is scoped per committee. Each of the seven is violated once and must return its own distinct
