            - "ReceivingSiteApplication.${rsa_ex}.status == DESIGN_APPROVED"
            - "both applications have backed_units 0, pending_backed_units 0, allocated_bonus_units 0, design_reviewed_by_user_id null"
            - "the design-review decision on ${rsa_ex} returns 409 ERR_DESIGN_REVIEW_STATE_INVALID — an area-exempt application has no review step to decide"
            - "ReceivingSiteApplication.${rsa_ex}.status == DESIGN_APPROVED and design_reviewed_by_user_id == null after the refusal"

      - name: compliance_sweep_escalates_only_the_cure_whose_deadline_has_passed
        claim_type: side_effect_execution
        grounds:
