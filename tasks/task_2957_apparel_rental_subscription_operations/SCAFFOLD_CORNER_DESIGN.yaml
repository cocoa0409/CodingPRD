  - section: validations
    instances:
      - name: validation_duplicate_style_code_is_rejected_while_a_fresh_code_passes
        claim_type: violation_error
        grounds:
          - "validations.priority 11"
          - "errors[ERR_DUPLICATE_CODE]"
          - "entities.Style.fields.style_code"
          - "endpoints.POST /styles"
        distinguishing_aspect: >-
          style_code uniqueness is enforced across the whole Style table, not per brand, so re-posting AUR-GOWN-01
          under a different brand and a different price still collides and must return 409 ERR_DUPLICATE_CODE
          while leaving the table at exactly one row. The immediately following POST of VER-KNIT-02 proves the
          rule is scoped to the code itself and not a blanket second-write refusal.
        test_recipe:
          setup:
            - "logical clock parked at 2026-08-03T09:00:00Z"
            - "exactly one style exists: AUR-GOWN-01 by Aurelia"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /styles"
              payload: { style_code: "AUR-GOWN-01", brand: "Aurelia", category: "GOWN", retail_price_cents: 48000, acquisition_cost_cents: 21000, size_run: ["S", "M", "L"], expected_rental_turns_per_unit: 12, planned_eol_value_cents: 9000, forecast_monthly_requests: 8, avg_rental_days: 6, planned_depth_units: 3 }
              as: InventoryPlanner
              captures: { style_gown_id: "$.data.id" }
          trigger:
            - call: "POST /styles"
              payload: { style_code: "AUR-GOWN-01", brand: "Copycat", category: "DRESS", retail_price_cents: 9900, acquisition_cost_cents: 4000, size_run: ["S"], expected_rental_turns_per_unit: 5, planned_eol_value_cents: 500, forecast_monthly_requests: 1, avg_rental_days: 3 }
              as: InventoryPlanner
            - call: "POST /styles"
              payload: { style_code: "VER-KNIT-02", brand: "Verdant", category: "KNITWEAR", retail_price_cents: 12000, acquisition_cost_cents: 4800, size_run: ["S", "M"], expected_rental_turns_per_unit: 10, planned_eol_value_cents: 900, forecast_monthly_requests: 10, avg_rental_days: 4, planned_depth_units: 2 }
              as: InventoryPlanner
              captures: { style_knit_id: "$.data.id" }
            - call: "GET /styles"
              payload: { limit: 50 }
              as: InventoryPlanner
          assert:
            - "duplicate POST: HTTP 409 with error_id == ERR_DUPLICATE_CODE"
            - "VER-KNIT-02 POST: HTTP 201 with Style.style_code == VER-KNIT-02"
            - "GET /styles: total_count == 2"
            - "no Style row reports brand == Copycat"
      - name: validation_pagination_limit_zero_is_rejected_while_limit_one_passes
        claim_type: violation_error
        grounds:
          - "validations.priority 10"
          - "errors[ERR_INVALID_PAGINATION]"
          - "response_envelope.pagination_defaults"
          - "endpoints.GET /rental-units"
        distinguishing_aspect: >-
          The declared range is 1..100 inclusive, so limit 0 is a violation and not a silent fallback to the
          default limit of 10: an implementation that clamps 0 up to the default returns 200 here. The paired
          limit-1 call fixes the boundary from the legal side and pins has_more true with total_count 2, proving
          total_count counts the filtered set rather than the page.
        test_recipe:
          setup:
            - "logical clock parked at 2026-08-03T09:00:00Z"
            - "style AUR-GOWN-01 with two size-M grade-A units AUR-GOWN-001 and AUR-GOWN-002"
          setup_api_calls:
