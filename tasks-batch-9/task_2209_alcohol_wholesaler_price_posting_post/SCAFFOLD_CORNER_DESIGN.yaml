      - name: posting_run_supersedes_items_then_bubbles_the_supersession_up_to_the_prior_schedule
        claim_type: bubble_up
        grounds: ["state_machines.PriceSchedule.transitions.EFFECTIVE_to_SUPERSEDED", "endpoints[POST /posting-runs]", entities.PriceScheduleItem.supersedes_item_id]
        distinguishing_aspect: "The schedule-level SUPERSEDED state is not written directly by the run; it is derived from the fact that EVERY item of the earlier schedule has been superseded. The superseding link is recorded on the new item (supersedes_item_id) and on the old schedule (superseded_by_schedule_id) — two different directions that must both be populated in the same run."
        excluded_because:
          difficulty_instance: transitive_cascade / posting_run_supersession_cascades_from_new_item_through_tier_to_prior_schedule
          rationale: "The named §1.8 instance runs the identical two-schedule fixture (2026-09 at 120000 with an ACTIVE 10 percent tier, a later schedule on the same posting key at 125000, a first run that makes only the earlier schedule EFFECTIVE, then the run under test) and asserts exactly this bubble-up: the new item EFFECTIVE with supersedes_item_id pointing at the old item, the old item SUPERSEDED, and the old schedule SUPERSEDED with superseded_by_schedule_id pointing back at the new one, both link directions populated by the same run."

