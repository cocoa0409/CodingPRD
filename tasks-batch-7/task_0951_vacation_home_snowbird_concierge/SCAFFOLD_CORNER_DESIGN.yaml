              payload: { full_name: "Ora Gate", email: "ora.gate@example.com", phone: "+15550500", primary_residence_state: "FL" }
              as: PlatformAdmin
              captures: { owner_id: $.data.id }
            - call: "POST /property-care/properties"
              payload: { owner_id: "${owner_id}", label: "Gate House", address_line: "6 Order Rd", state_code: "FL", travel_distance_miles: 18.0, rental_program_enrolled: true }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /property-care/service-plans"
              payload: { tier: "STANDARD", monthly_fee_cents: 19986, included_visit_units: 4, covered_visit_types: ["ROUTINE_WATCH"] }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /property-care/subscriptions"
              payload: { property_id: "${prop_id}", service_plan_id: "${plan_id}", started_on: "2026-06-01T00:00:00Z" }
              as: AccountManager
              captures: { sub_id: $.data.id }
            - call: "POST /property-care/subscriptions/${sub_id}/activate"
              payload: {}
              as: AccountManager
            - call: "POST /property-care/checklist-templates"
              payload: { visit_type: "TURNOVER_INSPECT", version_label: "2026.1", item_codes: ["LINENS"], critical_item_codes: [] }
              as: PlatformAdmin
              captures: { tmpl_id: $.data.id }
            - call: "POST /property-care/properties/${prop_id}/occupancy-transitions"
              payload: { to_state: "RENTAL_OCCUPIED" }
              as: Dispatcher
            - call: "POST /property-care/properties/${prop_id}/seasonal-transitions"
              payload: { action: "BEGIN_CLOSE" }
              as: PlatformAdmin
          trigger:
            - call: "POST /property-care/visits"
              payload: { property_id: "${prop_id}", checklist_template_id: "${tmpl_id}", visit_type: "TURNOVER_INSPECT", trigger_source: "SCHEDULED", scheduled_start_at: "2026-06-02T13:00:00Z", scheduled_end_at: "2026-06-02T15:00:00Z" }
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "data.error_id == ERR_SEASONAL_STATE_FORBIDS_VISIT"
            - "Property.${prop_id}.seasonal_state == CLOSING and Property.${prop_id}.occupancy_state == RENTAL_OCCUPIED"

