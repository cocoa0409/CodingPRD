    side_effects: ["ACTIVE -> SUSPENDED", "sets suspension_reason"]
  - method: POST
    path: "/health-data/element-purpose-mappings/{id}/retire"
    description: "Retires a mapping permanently"
    roles: [DataSteward]
    code: 200
    input: ["suspension_reason?"]
    output: ElementPurposeMapping
    side_effects: ["PROPOSED, ACTIVE or SUSPENDED -> RETIRED", "recomputes AppProduct.regulated_element_count"]

  - method: POST
    path: "/health-data/consumers"
    description: "Registers a consumer of the product and issues a verification token"
    roles: [PlatformAdmin]
    code: 201
    input: [app_product_id, external_ref, residency_state_code, age_band]
    output: Consumer
    side_effects: ["mints verification_token", "initialises deletion_completed_count to 0"]
  - method: GET
    path: "/health-data/consumers/{id}"
    description: "Reads one consumer"
    roles: [PlatformAdmin, PrivacyOfficer, ComplianceApprover, DataSteward, SecurityEngineer, Consumer]
    code: 200
    output: Consumer
    side_effects: []
  - method: GET
    path: "/health-data/consumers"
    description: "Lists consumers, filterable by product"
    roles: [PlatformAdmin, PrivacyOfficer, ComplianceApprover, DataSteward, SecurityEngineer]
    code: 200
    input: ["app_product_id?", "limit?", "offset?"]
    output: Consumer[]
    side_effects: []

  - method: POST
    path: "/health-data/consent-records"
    description: "Opens a new consent record for a consumer, superseding the incumbent ACTIVE record"
    roles: [PrivacyOfficer, PlatformAdmin]
    code: 201
    input: [consumer_id, expected_consumer_version]
    output: ConsentRecord
    side_effects: ["creates the record with all three axes NOT_REQUESTED and record_state ACTIVE", "transitions the consumer's incumbent ACTIVE record to SUPERSEDED and decrements AppProduct.active_share_consent_count when that record had sharing_state GRANTED", "increments Consumer.version by 1"]
  - method: GET
    path: "/health-data/consent-records/{id}"
    description: "Reads one consent record with all three axes"
    roles: [PlatformAdmin, PrivacyOfficer, ComplianceApprover, DataSteward, SecurityEngineer, Consumer]
    code: 200
    output: ConsentRecord
    side_effects: []
  - method: GET
    path: "/health-data/consent-records"
    description: "Lists consent records, filterable by consumer"
    roles: [PlatformAdmin, PrivacyOfficer, ComplianceApprover, DataSteward, SecurityEngineer, Consumer]
    code: 200
    input: ["consumer_id?", "record_state?", "limit?", "offset?"]
    output: ConsentRecord[]
    side_effects: []
  - method: POST
    path: "/health-data/consent-records/{id}/grants"
    description: "Grants consent on exactly one axis of the record"
    roles: [Consumer]
    code: 200
    input: [axes]
    output: ConsentRecord
    side_effects: ["sets the named axis to GRANTED or AUTHORIZED and stamps its granted-at field", "increments AppProduct.active_share_consent_count by 1 when the axis is SHARE"]
  - method: POST
    path: "/health-data/consent-records/{id}/withdrawals"
    description: "Withdraws consent on one axis, cascading to the axes that depend on it"
    roles: [Consumer]
    code: 200
    input: [axis]
    output: ConsentRecord
    side_effects: ["sets the named axis to WITHDRAWN or REVOKED, sets last_withdrawn_axis, last_withdrawn_at and processing_halt_deadline_at", "cascade hops 2-3: a COLLECT withdrawal withdraws sharing_state then revokes sale_state", "cascade hop 4: decrements AppProduct.active_share_consent_count by 1 when sharing_state left GRANTED"]

  - method: POST
    path: "/health-data/privacy-policy-versions"
    description: "Drafts a privacy policy version against an approved applicability assessment"
    roles: [PrivacyOfficer]
    code: 201
    input: [app_product_id, applicability_assessment_id, version_label, specificity_mode, disclosed_category_count, disclosed_purpose_count, disclosed_third_party_count, named_third_party_count, effective_from, expected_app_product_version]
    output: PrivacyPolicyVersion
    side_effects: ["creates the version in DRAFT with completeness_score 0.0 and gap_count 0", "sets authored_by_user_id to the caller's X-User-ID", "increments AppProduct.version by 1"]
  - method: GET
    path: "/health-data/privacy-policy-versions/{id}"
    description: "Reads one privacy policy version"
    roles: [PlatformAdmin, PrivacyOfficer, ComplianceApprover, DataSteward, SecurityEngineer]
    code: 200
    output: PrivacyPolicyVersion
    side_effects: []
  - method: GET
    path: "/health-data/privacy-policy-versions"
    description: "Lists privacy policy versions, filterable by product or assessment"
    roles: [PlatformAdmin, PrivacyOfficer, ComplianceApprover, DataSteward, SecurityEngineer]
    code: 200
    input: ["app_product_id?", "applicability_assessment_id?", "state?", "limit?", "offset?"]
    output: PrivacyPolicyVersion[]
    side_effects: []
  - method: POST
    path: "/health-data/privacy-policy-versions/{id}/submit-review"
    description: "Submits the draft for compliance review and scores its content completeness"
    roles: [PrivacyOfficer]
    code: 200
    input: []
    output: PrivacyPolicyVersion
    side_effects: ["DRAFT -> IN_REVIEW", "runs calculations.policy_completeness_score and writes completeness_score and gap_count"]
  - method: POST
    path: "/health-data/privacy-policy-versions/{id}/return-to-draft"
    description: "Returns a policy under review to draft"
    roles: [ComplianceApprover]
    code: 200
    input: [return_reason]
    output: PrivacyPolicyVersion
    side_effects: ["IN_REVIEW -> DRAFT", "resets completeness_score to 0.0 and gap_count to 0"]
  - method: POST
    path: "/health-data/privacy-policy-versions/{id}/publish"
    description: "Publishes the policy version, superseding the incumbent"
    roles: [ComplianceApprover]
    code: 200
    input: []
    output: PrivacyPolicyVersion
    side_effects: ["IN_REVIEW -> PUBLISHED", "sets published_by_user_id", "supersedes the incumbent PUBLISHED or SUPERSEDED_PENDING_UPDATE version and sets its effective_to to this version's effective_from", "sets AppProduct.policy_compliance_state to CURRENT"]

  - method: POST
    path: "/health-data/consumer-requests"
    description: "Files a consumer rights request"
    roles: [Consumer]
    code: 201
    input: [consumer_id, request_kind, submitted_channel]
    output: ConsumerRequest
    side_effects: ["stamps received_at from the logical clock", "runs calculations.request_response_deadline and writes response_deadline_at"]
  - method: GET
    path: "/health-data/consumer-requests/{id}"
    description: "Reads one consumer rights request"
    roles: [PlatformAdmin, PrivacyOfficer, ComplianceApprover, DataSteward, SecurityEngineer, Consumer]
    code: 200
    output: ConsumerRequest
    side_effects: []
  - method: GET
    path: "/health-data/consumer-requests"
    description: "Lists consumer rights requests, filterable by consumer"
    roles: [PlatformAdmin, PrivacyOfficer, ComplianceApprover, DataSteward, SecurityEngineer, Consumer]
    code: 200
    input: ["consumer_id?", "state?", "request_kind?", "limit?", "offset?"]
    output: ConsumerRequest[]
    side_effects: []
  - method: POST
    path: "/health-data/consumer-requests/{id}/request-more-info"
    description: "Asks the consumer for additional identity information"
    roles: [PrivacyOfficer]
    code: 200
    input: []
    output: ConsumerRequest
    side_effects: ["RECEIVED -> VERIFICATION_PENDING", "increments verification_rounds_used by 1", "sets verification_window_ends_at to the logical clock plus VERIFICATION_WINDOW_DAYS days"]
  - method: POST
    path: "/health-data/consumer-requests/{id}/resubmit-identity"
    description: "Consumer supplies the additional identity information inside the open window"
    roles: [Consumer]
    code: 200
    input: []
    output: ConsumerRequest
    side_effects: ["VERIFICATION_PENDING -> RECEIVED", "clears verification_window_ends_at"]
  - method: POST
    path: "/health-data/consumer-requests/{id}/verify"
    description: "Verifies the requester's identity and fans out deletion tasks for DELETE requests"
    roles: [PrivacyOfficer]
    code: 200
    input: [verification_token]
    output: ConsumerRequest
    side_effects: ["RECEIVED -> VERIFIED", "stamps verified_at and re-runs calculations.request_response_deadline", "for request_kind DELETE runs calculations.deletion_task_fanout, creates the DeletionTask rows in PENDING and recomputes outstanding_task_count", "for request_kind DELETE with an empty candidate set transitions VERIFIED -> FULFILLED in the same call and runs its cascade hops 3 and 4"]
  - method: POST
    path: "/health-data/consumer-requests/{id}/extend"
    description: "Takes the single permitted response-deadline extension"
    roles: [PrivacyOfficer]
    code: 200
    input: []
    output: ConsumerRequest
    side_effects: ["sets extension_granted to true", "re-runs calculations.request_response_deadline"]
  - method: POST
    path: "/health-data/consumer-requests/{id}/fulfill"
    description: "Records fulfillment of a verified request"
    roles: [PrivacyOfficer]
    code: 200
    input: []
    output: ConsumerRequest
    side_effects: ["VERIFIED -> FULFILLED", "cascade hop 3: withdraws every granted axis on the consumer's ACTIVE ConsentRecord for DELETE requests and recomputes Consumer.deletion_completed_count", "cascade hop 4: decrements AppProduct.active_share_consent_count by 1 when sharing_state left GRANTED"]
  - method: POST
    path: "/health-data/consumer-requests/{id}/deny"
    description: "Denies a request with a reason"
    roles: [PrivacyOfficer]
    code: 200
    input: [denial_reason]
    output: ConsumerRequest
    side_effects: ["RECEIVED, VERIFICATION_PENDING or VERIFIED -> DENIED", "sets denial_reason", "fails every non-CONFIRMED DeletionTask on the request with failure_reason REQUEST_DENIED"]

  - method: GET
    path: "/health-data/deletion-tasks/{id}"
    description: "Reads one downstream deletion task"
    roles: [PlatformAdmin, PrivacyOfficer, ComplianceApprover, DataSteward, SecurityEngineer]
    code: 200
    output: DeletionTask
    side_effects: []
  - method: GET
    path: "/health-data/deletion-tasks"
    description: "Lists deletion tasks, filterable by request or vendor; the only discovery channel for cascade-created tasks"
    roles: [PlatformAdmin, PrivacyOfficer, ComplianceApprover, DataSteward, SecurityEngineer]
    code: 200
    input: ["consumer_request_id?", "vendor_id?", "state?", "limit?", "offset?"]
    output: DeletionTask[]
    side_effects: []
  - method: POST
    path: "/health-data/deletion-tasks/{id}/notify"
    description: "Sends the deletion instruction to the vendor"
    roles: [PrivacyOfficer]
    code: 200
    input: []
    output: DeletionTask
    side_effects: ["PENDING -> NOTIFIED", "increments attempt_count by 1 and sets due_at to the logical clock plus the Vendor.deletion_sla_days days"]
  - method: POST
    path: "/health-data/deletion-tasks/{id}/confirm"
    description: "Records the vendor's deletion confirmation"
    roles: [PrivacyOfficer]
    code: 200
    input: []
    output: DeletionTask
    side_effects: ["NOTIFIED -> CONFIRMED", "cascade hop 1: recomputes ConsumerRequest.outstanding_task_count", "cascade hop 2: transitions the ConsumerRequest VERIFIED -> FULFILLED when outstanding_task_count reaches 0, running its cascade hops 3 and 4"]
  - method: POST
    path: "/health-data/deletion-tasks/{id}/fail"
    description: "Records a failed deletion instruction"
    roles: [PrivacyOfficer]
    code: 200
    input: [failure_reason]
    output: DeletionTask
    side_effects: ["NOTIFIED -> FAILED", "sets failure_reason and recomputes ConsumerRequest.outstanding_task_count"]
  - method: POST
    path: "/health-data/deletion-tasks/{id}/reissue"
    description: "Reissues a failed deletion instruction"
    roles: [PrivacyOfficer]
    code: 200
    input: []
    output: DeletionTask
    side_effects: ["FAILED -> NOTIFIED", "increments attempt_count by 1, clears failure_reason and resets due_at"]

  - method: POST
    path: "/health-data/vendors"
    description: "Registers a vendor or subprocessor with its contract clauses"
    roles: [PrivacyOfficer]
    code: 201
    input: [app_product_id, vendor_name, vendor_kind, "subprocessor_of_id?", "flow_down_clause?", "audit_rights_clause?", "sale_authorization_clause?", "deletion_sla_days?"]
    output: Vendor
    side_effects: ["creates the vendor with agreement_state DRAFT", "runs calculations.consent_posture_derivation STEP 2 and writes agreement_compliance"]
  - method: GET
    path: "/health-data/vendors/{id}"
    description: "Reads one vendor with its agreement posture"
    roles: [PlatformAdmin, PrivacyOfficer, ComplianceApprover, DataSteward, SecurityEngineer]
    code: 200
    output: Vendor
    side_effects: []
  - method: GET
    path: "/health-data/vendors"
    description: "Lists vendors, filterable by product or by the vendor that engaged them"
    roles: [PlatformAdmin, PrivacyOfficer, ComplianceApprover, DataSteward, SecurityEngineer]
    code: 200
    input: ["app_product_id?", "subprocessor_of_id?", "agreement_state?", "limit?", "offset?"]
    output: Vendor[]
    side_effects: []
  - method: PATCH
    path: "/health-data/vendors/{id}"
    description: "Amends the vendor's contract clauses while the agreement is in DRAFT"
    roles: [PrivacyOfficer]
    code: 200
    input: ["flow_down_clause?", "audit_rights_clause?", "sale_authorization_clause?", "deletion_sla_days?"]
    output: Vendor
    side_effects: ["recomputes agreement_compliance"]
  - method: POST
    path: "/health-data/vendors/{id}/execute-agreement"
    description: "Executes the vendor agreement"
    roles: [PrivacyOfficer]
    code: 200
    input: []
    output: Vendor
    side_effects: ["DRAFT -> EXECUTED", "stamps executed_at and recomputes agreement_compliance"]
  - method: POST
    path: "/health-data/vendors/{id}/terminate-agreement"
    description: "Terminates the vendor agreement and runs the five-hop compliance cascade"
    roles: [PrivacyOfficer]
    code: 200
    input: []
    output: Vendor
    side_effects: ["EXECUTED -> TERMINATED", "cascade hop 2: suspends the vendor's ACTIVE mappings", "cascade hop 3: moves the PUBLISHED policy to SUPERSEDED_PENDING_UPDATE", "cascade hop 4: sets AppProduct.policy_compliance_state to LAPSED", "cascade hop 5: pauses the product's ACTIVE geofence campaigns with pause_reason POLICY_LAPSED"]

  - method: POST
    path: "/health-data/geofence-zones"
