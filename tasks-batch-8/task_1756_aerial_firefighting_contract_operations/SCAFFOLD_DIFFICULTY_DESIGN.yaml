  - rule_id: boundary_precision_check
    instances:
      - name: flight_hour_limit_exactly_eighty_tenths
        grounds:
          - calculations.crew_duty_projection
          - validations[priority=8]
          - errors[ERR_FLIGHT_HOUR_LIMIT_EXCEEDED]
        distinguishing_aspect: |
          Boundary on the flight-hour metric via POST /assignments/{id}/flight-logs:
          the chronological gate is `flown + new > 80` (strict), so a sortie landing
          the day at exactly 80 tenths is ACCEPTED and only the next 0.1 h is rejected;
          >= vs > confusion flips the accepted/rejected verdicts.
        test_recipe:
          setup:
            - "EU contract ACTIVE; carded aircraft + pilot; order qty 1 ACCEPTED; assignment planned 2026-08-02 08:00-10:00 ON_INCIDENT"
            - "7.9 h already logged on 2026-08-02 (hobbs 100.0 -> 107.9 = 79 tenths)"
          setup_api_calls:
            - { call: "POST /contracts", payload: { contract_number: "EU-2026-001", agency: "USFS", contract_type: "EXCLUSIVE_USE", daily_availability_rate_cents: 500000, flight_hour_rate_cents: 300000, season_start_date: "2026-06-01", season_end_date: "2026-09-30", min_daily_available_minutes: 570, season_flight_hour_cap_tenths: 20000, acceptance_window_minutes: 30 }, as: CarrierOps, captures: { c_id: $.data.id } }
            - { call: "POST /contracts/${c_id}/activate", payload: {}, as: CarrierOps }
            - { call: "POST /aircraft", payload: { tail_number: "N100AF", model: "AT-802F", tank_capacity_gallons: 800, contract_id: "${c_id}" }, as: CarrierOps, captures: { ac_id: $.data.id } }
