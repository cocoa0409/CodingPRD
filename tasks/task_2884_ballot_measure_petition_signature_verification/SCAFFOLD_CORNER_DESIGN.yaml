              as_user_id: "exam-1"
              captures: { p_acc: $.data.accepted_raw_total, p_proj: $.data.projected_valid_count, p_status: $.data.status }
          assert:
            - "${acc} == 2 and ${r1_size} == 2 - both lines are accepted and both are in the census"
            - "${late_status} == INVALID_DUPLICATE, ${late_dup_of} == ${early_id}, ${late_match} == ${vr1_id} - validated first, yet it is the loser because its signed_on is later"
            - "${early_status} == VALID and ${early_dup_of} is null - the keeper is unaffected by having been validated second"
            - "${valid_n} == 1, ${rate} == 5000 == floor(1 * 10000 / 2), ${proj} == 1 == floor(2 * 5000 / 10000)"
            - "${det} == INSUFFICIENT - projected 1 <= lower_gate floor(2 * 5000 / 10000) == 1, and 1 * 10000 < 2 * 8000 so the petition is not cure-eligible"
            - "${p_acc} == 2 and ${p_proj} == 1 and ${p_status} == PENDING_FAILURE - the duplicate leaves accepted_raw_total alone and only reduces the valid numerator"

      - name: accepted_totals_filter_out_format_rejected_batches
        claim_type: input_set_filtering
        grounds:
          - calculations.petition_raw_and_accepted_counts
          - state_machines.SignatureBatch.RECEIVED_to_AFFIDAVIT_VERIFIED
          - state_machines.SignatureBatch.RECEIVED_to_REJECTED_FORMAT
          - endpoints[POST /signature-batches/{batch_id}/verify-affidavit]
        distinguishing_aspect: |
          The two aggregation legs are driven apart by a single clerk decision. b1 has two
          lines with line 2 struck as a format defect: it becomes AFFIDAVIT_VERIFIED with
          raw_count 2 but accepted_raw_count 1. b2 has one line and that line is struck, so
          every line is defective and the whole batch becomes REJECTED_FORMAT with
          accepted_raw_count 0. The petition must therefore report raw_signature_count 3
          (both batches count, since neither is INVALIDATED) but accepted_raw_total 1 (only
          the AFFIDAVIT_VERIFIED batch contributes). Implementations that use one status
          filter for both sums cannot produce 3 and 1 simultaneously.
