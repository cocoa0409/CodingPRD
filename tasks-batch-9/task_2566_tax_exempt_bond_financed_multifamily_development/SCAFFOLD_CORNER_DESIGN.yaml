      - name: negative_arbitrage_orders_draws_by_period_start_not_by_the_order_they_were_funded
        claim_type: chronological
        grounds:
          - calculations.negative_arbitrage_cost
          - entities.DrawRequest.fields.negative_arbitrage_accrual_cents
          - entities.BondIssue.fields.negative_arbitrage_cents
          - state_machines.DrawRequest.APPROVED_to_FUNDED
          - concurrency_rules[draw-create-stale-bond-issue]
        distinguishing_aspect: |
          The later draw period is created and funded FIRST, so creation order,
          funding order and draw_number all disagree with period_start order. While
          it is alone its accrual is 861,111 (the full 200,000,000 undrawn for its
          62 days). Once the earlier 61-day draw of 120,000,000 joins, the series
          must re-sort by period_start: the earlier period now carries the full
          undrawn balance (847,222) and the later one only the 80,000,000 remaining
          after it (344,444), for a total of 1,191,666. Honouring funding order
          instead yields 861,111 + 508,333 = 1,369,444, and the previously stored
          861,111 must be OVERWRITTEN on the later draw rather than left in place.
