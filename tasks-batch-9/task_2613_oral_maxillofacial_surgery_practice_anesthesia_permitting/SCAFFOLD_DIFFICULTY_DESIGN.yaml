            - call: "POST /implant-lots"
              payload: { practice_id: "${prac_id}", manufacturer_code: "STRAU", catalog_reference: "ST-4310", diameter_mm: 4.3, length_mm: 10.0, unit_cost_cents: 20000, quantity_on_hand: 3, expiry_date: "2026-09-14T00:00:00Z", is_consignment: false }
              as: InventoryManager
