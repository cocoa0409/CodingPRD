              payload: { property_id: "${p1}", channel_id: "${c_ota}", channel_disclosure_profile_id: "${prof_ota}", arrival_date: "2026-09-10T00:00:00Z", nights: 4, guests: 2, room_rate_cents: 29900, disclosed_fee_amounts: { RESORT: 6000, DESTINATION: 5980 } }
              as: ChannelOperator
              as_user_id: "${c_ota}"
              captures: { b1: $.data.id }
            - call: "POST /bookings/${b1}/confirm"
              payload: {}
              as: ChannelOperator
              as_user_id: "${c_ota}"
            - call: "POST /regulator-inquiries"
              payload: { jurisdiction_id: "${j_nv}", property_id: "${p1}", docket_number: "NV-2026-0091", channel_scope: ["OTA"], response_due_at: "2026-10-01T00:00:00Z" }
              as: RegulatoryLiaison
              as_user_id: "u-liaison-1"
              captures: { inq1: $.data.id }
            - call: "POST /regulator-inquiries/${inq1}/draft-response"
              payload: { response_summary: "Total-price display verified on the OTA path; itemization present on folios." }
              as: RegulatoryLiaison
              as_user_id: "u-liaison-1"
            - call: "POST /regulator-inquiries/${inq1}/submit-response"
              payload: {}
              as: RegulatoryLiaison
              as_user_id: "u-liaison-2"
            - call: "POST /regulator-inquiries/${inq1}/require-remediation"
              payload: { remediation_directive: "Re-audit the OTA booking path and re-publish the first-quote total." }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
          trigger:
            - call: "POST /regulator-inquiries/${inq1}/withdraw"
              payload: { withdrawal_reason: "Docket withdrawn by the regulator; complaint traced to a third-party metasearch cache." }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
          assert:
            - "BASELINE before the inquiry existed: Property.${p1}.min_channel_disclosure_score == 100, disclosure_posture == COMPLIANT, open_disclosure_obligation_count == 0, aggregate_disclosure_gap_cents == 0"
            - "AFTER the inquiry is recorded (status RECEIVED): open_disclosure_obligation_count == 1 — an inquiry counts as open in every status except ACCEPTED and WITHDRAWN — while the score and posture are untouched"
            - "AFTER require-remediation: ChannelDisclosureProfile.${prof_ota}.status == FLAGGED, ChannelDisclosureProfile.${prof_gds}.status is still DEPLOYED (GDS is out of channel_scope), and RegulatorInquiry.${inq1}.flagged_profile_ids == [${prof_ota}] with remediation_round == 1"
            - "AFTER require-remediation: Property.${p1}.min_channel_disclosure_score == 0 (the FLAGGED profile contributes 0, not its stored 100), disclosure_posture == NON_COMPLIANT, open_disclosure_obligation_count == 2 (one FLAGGED profile + one open inquiry)"
            - "AFTER require-remediation: Booking.${b1}.disclosure_status is still PENDING_AUDIT because its stay_status is CONFIRMED, not QUOTED — so aggregate_disclosure_gap_cents stays 0 and RegulatorInquiry.${inq1}.exposure_cents == 0 even though the booking's quote_disclosure_gap_cents is 5572"
            - "the trigger returns HTTP 200 with RegulatorInquiry.${inq1}.status == WITHDRAWN, withdrawal_reason recorded, and flagged_profile_ids == []"
            - "AFTER the trigger: ChannelDisclosureProfile.${prof_ota}.status == DEPLOYED again with disclosure_score still 100 and confirmed_undisclosed_count still 0; remediation_round on the PROFILE is still 0, because FLAGGED -> DEPLOYED by withdrawal is not a remediation"
            - "AFTER the trigger: Property.${p1}.min_channel_disclosure_score == 100, disclosure_posture == COMPLIANT, open_disclosure_obligation_count == 0 — a decrement of 2, one for the inquiry and one for the restored profile"
            - "AFTER the trigger: Property.${p1}.aggregate_disclosure_gap_cents == 0 and Booking.${b1} is untouched, with version unchanged from its post-confirm value"
            - "the counters are conserved but the OPTIMISTIC-CONCURRENCY counters are not: Property.${p1}.version is strictly greater than its baseline (incremented by both require-remediation and withdraw), and RegulatorInquiry.${inq1}.version has advanced monotonically — conservation applies to the semantic aggregates only"
            - "NON-DRIFT variant: if a third profile on a DIRECT_WEB channel had been FLAGGED independently by POST /channel-disclosure-profiles/{id}/audit, it is NOT in flagged_profile_ids, so the withdraw leaves it FLAGGED and open_disclosure_obligation_count returns to 1 rather than 0 — the compensation restores exactly the ids this inquiry captured"
            - "WITHDRAWN is terminal: a second POST /regulator-inquiries/${inq1}/withdraw returns HTTP 409 ERR_INVALID_STATE, and POST /regulator-inquiries/${inq1}/submit-remediation likewise fails, so the reversal cannot double-decrement"
            - "an implementation that clears flagged_profile_ids without transitioning the profile back leaves min_channel_disclosure_score at 0 and posture NON_COMPLIANT, and reports open_disclosure_obligation_count 1 instead of 0"
