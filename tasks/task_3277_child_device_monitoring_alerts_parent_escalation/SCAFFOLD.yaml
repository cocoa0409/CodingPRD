# =============================================================================
# Scaffold: Child Device Monitoring Alerts & Parent Escalation (Bark-like)
# =============================================================================

scenario: |
  Child Device Monitoring Alerts & Parent Escalation (Bark Technologies): device and
  account connection across messaging, social and email services with parental consent
  and account credentials, content analysis for indicators of bullying, self-harm,
  explicit content and predatory contact with severity classification, alert delivery
  to parents with excerpted context rather than full message logs to balance privacy,
  escalation guidance and resource referral for severe alerts including crisis contacts,
  screen time scheduling and website filtering on managed devices with bypass detection,
  school district deployments with administrator visibility and legal reporting
  obligations, false positive tuning by child age and slang evolution, subscription
  management and device limits

domain_name: child-device-monitoring
api_prefix: /api

# =============================================================================
# Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: compliance / audit
  secondary_archetype: posture-driven gating
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns: [one_to_many, cross_aggregate]
  role_model: peer_roles
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: FamilyAccount
    parent: null
    common_fields: true
    fields:
      - { name: family_name, type: string, source: input, description: "Family display name" }
      - { name: primary_contact_email, type: string, source: input, description: "Billing/contact email" }
      - { name: subscription_tier, type: enum, source: input, description: "BASIC | STANDARD | PREMIUM", default: STANDARD }
      - { name: analysis_variant, type: enum, source: input, description: "LEXICAL_V1 | CONTEXTUAL_V2 — risk scoring variant for this family", default: LEXICAL_V1 }
      - { name: account_status, type: enum, source: system, description: "ACTIVE | SUSPENDED", default: ACTIVE }
      - { name: device_limit, type: integer, source: computed, description: "BASIC=2, STANDARD=5, PREMIUM=10" }
      - { name: device_count, type: integer, source: computed, description: "Count of Devices with pairing_status==PAIRED across all children of this family" }
      - { name: open_escalation_count, type: integer, source: computed, description: "EscalationCases for this family with case_status != CLOSED" }
      - { name: last_proration_charge_cents, type: integer, source: computed, description: "Prorated charge/credit of most recent tier change; 0 if none", default: 0 }
      - { name: billing_period_start, type: datetime, source: system, description: "Current 30-day period start (family creation date)" }
      - { name: billing_period_end, type: datetime, source: system, description: "billing_period_start + 30 days" }

  - name: ParentMember
    parent: FamilyAccount
    common_fields: true
    fields:
      - { name: family_account_id, type: string, source: system, description: "FK -> FamilyAccount.id" }
      - { name: display_name, type: string, source: input, description: "Parent display name" }
      - { name: email, type: string, source: input, description: "Parent email" }
      - { name: is_primary, type: boolean, source: system, description: "True for the auto-created primary parent" }
      - { name: member_status, type: enum, source: system, description: "ACTIVE | REMOVED", default: ACTIVE }

  - name: ChildProfile
    parent: FamilyAccount
    common_fields: true
    fields:
      - { name: family_account_id, type: string, source: input, description: "FK -> FamilyAccount.id" }
      - { name: display_name, type: string, source: input, description: "Child display name" }
      - { name: birth_year, type: integer, source: input, description: "Birth year; age (current year minus birth_year) must be 0..17" }
      - { name: age_band, type: enum, source: computed, description: "CHILD_9_UNDER | PRETEEN_10_12 | TEEN_13_15 | OLDER_TEEN_16_17 from birth_year vs current clock year" }
      - { name: monitoring_sensitivity, type: enum, source: input, description: "LENIENT | STANDARD | STRICT", default: STANDARD }
      - { name: profile_status, type: enum, source: system, description: "ACTIVE | ARCHIVED", default: ACTIVE }
      - { name: open_alert_count, type: integer, source: computed, description: "Alerts for this child with alert_status IN {DELIVERED, ACKNOWLEDGED, REOPENED}" }

  - name: Device
    parent: ChildProfile
    common_fields: true
    fields:
      - { name: child_profile_id, type: string, source: system, description: "FK -> ChildProfile.id" }
      - { name: platform, type: enum, source: input, description: "ANDROID | IOS | CHROMEBOOK" }
      - { name: nickname, type: string, source: input, description: "Device nickname" }
      - { name: pairing_status, type: enum, source: system, description: "PAIRED | UNPAIRED", default: PAIRED }
      - { name: device_posture, type: enum, source: computed, description: "NORMAL | BYPASS_WATCH | LOCKDOWN from bypass_strike_count" }
      - { name: bypass_strike_count, type: integer, source: computed, description: "BypassEvents for this device with detected_at within [now-14d, now] inclusive" }

  - name: ServiceConnection
    parent: ChildProfile
    common_fields: true
    fields:
      - { name: child_profile_id, type: string, source: system, description: "FK -> ChildProfile.id" }
      - { name: service_type, type: enum, source: input, description: "MESSAGING | SOCIAL | EMAIL" }
      - { name: external_handle, type: string, source: input, description: "External account handle/address" }
      - { name: credential_token, type: string, source: input, description: "Opaque account credential reference (write-only; never returned)", constraints: "never serialized in responses" }
      - { name: consent_status, type: enum, source: system, description: "AWAITING_CONSENT | ACTIVE | PAUSED | REVOKED", default: AWAITING_CONSENT, constraints: "at most one non-REVOKED connection per (child_profile_id, service_type, external_handle)" }

  - name: ContentItem
    parent: ServiceConnection
    common_fields: true
    fields:
      - { name: service_connection_id, type: string, source: input, description: "FK -> ServiceConnection.id" }
      - { name: occurred_at, type: datetime, source: input, description: "When the content occurred; must be <= current clock" }
      - { name: direction, type: enum, source: input, description: "INBOUND | OUTBOUND" }
      - { name: thread_depth, type: integer, source: input, description: "Conversation thread depth, >= 1" }
      - { name: signals, type: array, source: input, description: "Array of {category, weight}; category in BULLYING|SELF_HARM|EXPLICIT|PREDATORY_CONTACT, weight integer 1..100" }
      - { name: raw_text, type: string, source: input, description: "Full message text; restricted read surface" }
      - { name: analysis_variant_used, type: enum, source: computed, description: "LEXICAL_V1 | CONTEXTUAL_V2 — variant applied, copied from family config at ingest" }
      - { name: risk_score, type: integer, source: computed, description: "0..100 per content_risk_scoring calculation" }
      - { name: severity, type: enum, source: computed, description: "LOW | MODERATE | HIGH | SEVERE per alert_severity_classification" }
      - { name: alert_created, type: boolean, source: computed, description: "True iff severity IN {MODERATE, HIGH, SEVERE}" }
      - { name: alert_id, type: string, source: system, description: "Reference to created Alert; null when suppressed" }

  - name: Alert
    parent: ChildProfile
    common_fields: true
    fields:
      - { name: child_profile_id, type: string, source: system, description: "FK -> ChildProfile.id" }
      - { name: content_item_id, type: string, source: system, description: "FK -> ContentItem.id" }
      - { name: category, type: enum, source: computed, description: "Dominant signal category: max weight; ties broken by earliest index in signals array" }
      - { name: severity, type: enum, source: computed, description: "LOW | MODERATE | HIGH | SEVERE copied from ContentItem at creation" }
      - { name: excerpt_text, type: string, source: computed, description: "Truncated excerpt per excerpt_truncation; full raw_text never exposed to Parent/SchoolAdmin" }
      - { name: alert_status, type: enum, source: system, description: "DELIVERED | ACKNOWLEDGED | RESOLVED | REOPENED", default: DELIVERED }
      - { name: escalation_case_id, type: string, source: system, description: "Reference to the EscalationCase created for SEVERE alerts (see EscalationCase.alert_id); null otherwise" }

  - name: EscalationCase
    parent: ChildProfile
    common_fields: true
    fields:
      - { name: alert_id, type: string, source: system, description: "FK -> Alert.id" }
      - { name: child_profile_id, type: string, source: system, description: "FK -> ChildProfile.id" }
      - { name: case_status, type: enum, source: system, description: "OPEN | GUIDANCE_ISSUED | RESOURCE_REFERRED | CRISIS_ESCALATED | LEGAL_REPORTED | CLOSED", default: OPEN }
      - { name: crisis_resource_codes, type: array, source: computed, description: "Referral codes by alert category: SELF_HARM->[CRISIS_TEXT_LINE, 988_LIFELINE]; PREDATORY_CONTACT->[NCMEC_CYBERTIPLINE]; BULLYING->[STOPBULLYING_GOV]; EXPLICIT->[COMMON_SENSE_MEDIA]" }
      - { name: legal_report_due_at, type: datetime, source: computed, description: "created_at + 24h when an ACTIVE MANDATED_REPORTING DistrictLink exists for the child at case creation; null otherwise" }
      - { name: legal_report_filed_at, type: datetime, source: system, description: "Set on LEGAL_REPORTED transition; null until then" }
      - { name: overdue, type: boolean, source: computed, description: "legal_report_due_at != null AND legal_report_filed_at == null AND now > legal_report_due_at" }
      - { name: district_link_id, type: string, source: system, description: "Reference to the DistrictLink carrying the reporting obligation (see DistrictLink.pending_legal_report); null when none" }

  - name: ScreenTimeWindow
    parent: Device
    common_fields: true
    fields:
      - { name: device_id, type: string, source: system, description: "FK -> Device.id" }
      - { name: weekday, type: enum, source: input, description: "MON | TUE | WED | THU | FRI | SAT | SUN" }
      - { name: start_minute, type: integer, source: input, description: "Minute of day 0..1439, half-open interval start" }
      - { name: end_minute, type: integer, source: input, description: "Minute of day 1..1440, half-open interval end; must be > start_minute" }
      - { name: window_kind, type: enum, source: input, description: "BLOCKED | ALLOWED" }
      - { name: window_status, type: enum, source: system, description: "ACTIVE | DISABLED", default: ACTIVE }

  - name: FilterRule
    parent: ChildProfile
    common_fields: true
    fields:
      - { name: child_profile_id, type: string, source: system, description: "FK -> ChildProfile.id" }
      - { name: rule_kind, type: enum, source: input, description: "CATEGORY_BLOCK | DOMAIN_BLOCK | DOMAIN_ALLOW" }
      - { name: target, type: string, source: input, description: "Category name or domain pattern" }
      - { name: rule_status, type: enum, source: system, description: "ACTIVE | DISABLED", default: ACTIVE }

  - name: BypassEvent
    parent: Device
    common_fields: true
    fields:
      - { name: device_id, type: string, source: system, description: "FK -> Device.id" }
      - { name: bypass_kind, type: enum, source: input, description: "VPN | SECONDARY_ACCOUNT | TIMEZONE_SHIFT | UNINSTALL_ATTEMPT" }
      - { name: detected_at, type: datetime, source: input, description: "When the bypass was detected; must be <= current clock" }
      - { name: counted_in_strikes, type: boolean, source: computed, description: "True iff detected_at within [now-14d, now] inclusive at last evaluation" }

  - name: DeviceAccessGrant
    parent: Device
    common_fields: true
    fields:
      - { name: device_id, type: string, source: system, description: "FK -> Device.id" }
      - { name: start_at, type: datetime, source: input, description: "Grant window start (closed interval); must be < end_at" }
      - { name: end_at, type: datetime, source: input, description: "Grant window end (closed interval)" }
      - { name: reason, type: string, source: input, description: "Free-text reason", default: "" }
      - { name: grant_status, type: enum, source: computed, description: "SCHEDULED | ACTIVE | EXPIRED | CANCELLED — derived from clock and lockdown cascade" }

  - name: District
    parent: null
    common_fields: true
    fields:
      - { name: district_name, type: string, source: input, description: "District name" }
      - { name: contact_email, type: string, source: input, description: "District admin contact" }
      - { name: jurisdiction, type: enum, source: input, description: "MANDATED_REPORTING | DISCRETIONARY" }
      - { name: district_status, type: enum, source: system, description: "ACTIVE | SUSPENDED", default: ACTIVE }
      - { name: open_obligation_count, type: integer, source: computed, description: "DistrictLinks of this district with pending_legal_report == true" }

  - name: DistrictLink
    parent: ChildProfile
    common_fields: true
    fields:
      - { name: district_id, type: string, source: system, description: "FK -> District.id" }
      - { name: child_profile_id, type: string, source: input, description: "FK -> ChildProfile.id" }
      - { name: link_status, type: enum, source: system, description: "PENDING_CONSENT | ACTIVE | WITHDRAWN", default: PENDING_CONSENT }
      - { name: pending_legal_report, type: boolean, source: computed, description: "True while an open EscalationCase owes a mandated legal report through this link", default: false }
      - { name: consented_at, type: datetime, source: system, description: "Set on PENDING_CONSENT -> ACTIVE; null until then" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: FamilyAccount
    field: account_status
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /api/families/{id}/state (to_status=SUSPENDED)"
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "increments FamilyAccount.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /api/families/{id}/state (to_status=ACTIVE)"
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "increments FamilyAccount.version by 1"

  - entity: ChildProfile
    field: profile_status
    initial_state: ACTIVE
    terminal_states: [ARCHIVED]
    transitions:
      - from: ACTIVE
        to: ARCHIVED
        trigger: "PATCH /api/children/{id} (profile_status=ARCHIVED)"
        actor: Parent
        preconditions:
          - "No EscalationCase for this child with case_status != CLOSED (ERR_ESCALATION_OPEN)"
        side_effects:
          - "All ServiceConnections of this child with consent_status IN {AWAITING_CONSENT, ACTIVE, PAUSED} -> REVOKED"
          - "increments ChildProfile.version by 1"

  - entity: Device
    field: pairing_status
    initial_state: PAIRED
    terminal_states: [UNPAIRED]
    transitions:
      - from: PAIRED
        to: UNPAIRED
        trigger: "POST /api/devices/{id}/unpair"
        actor: Parent
        preconditions: []
        side_effects:
          - "FamilyAccount.device_count recomputed (decreases by 1)"
          - "increments Device.version by 1"

  - entity: Device
    field: device_posture
    initial_state: NORMAL
    terminal_states: []
    transitions:
      - from: NORMAL
        to: BYPASS_WATCH
        trigger: "system: bypass_strike_count becomes >= 1 after BypassEvent creation"
        actor: system
        preconditions:
          - "bypass_strike_count >= 1"
        side_effects: []
      - from: BYPASS_WATCH
        to: LOCKDOWN
        trigger: "system: bypass_strike_count becomes >= 3 after BypassEvent creation"
        actor: system
        preconditions:
          - "bypass_strike_count >= 3"
        side_effects:
          - "All DeviceAccessGrants of this device with grant_status IN {SCHEDULED, ACTIVE} -> CANCELLED"
      - from: BYPASS_WATCH
        to: NORMAL
        trigger: "system: clock advance makes bypass_strike_count drop to 0"
        actor: system
        preconditions:
          - "bypass_strike_count == 0"
        side_effects: []
      - from: LOCKDOWN
        to: NORMAL
        trigger: "system: clock advance makes bypass_strike_count drop to 0"
        actor: system
        preconditions:
          - "bypass_strike_count == 0"
        side_effects: []

  - entity: ServiceConnection
    field: consent_status
    initial_state: AWAITING_CONSENT
    terminal_states: []
    transitions:
      - from: AWAITING_CONSENT
        to: ACTIVE
        trigger: "POST /api/connections/{id}/state (to_status=ACTIVE)"
        actor: Parent
        preconditions:
          - "ChildProfile.profile_status == ACTIVE (ERR_CHILD_ARCHIVED)"
          - "FamilyAccount.account_status == ACTIVE (ERR_FAMILY_SUSPENDED)"
        side_effects:
          - "increments ServiceConnection.version by 1"
      - from: ACTIVE
        to: PAUSED
        trigger: "POST /api/connections/{id}/state (to_status=PAUSED)"
        actor: Parent
        preconditions: []
        side_effects:
          - "increments ServiceConnection.version by 1"
      - from: PAUSED
        to: ACTIVE
        trigger: "POST /api/connections/{id}/state (to_status=ACTIVE)"
        actor: Parent
        preconditions:
          - "ChildProfile.profile_status == ACTIVE (ERR_CHILD_ARCHIVED)"
        side_effects:
          - "increments ServiceConnection.version by 1"
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /api/connections/{id}/state (to_status=REVOKED)"
        actor: Parent
        preconditions: []
        side_effects:
          - "increments ServiceConnection.version by 1"
      - from: PAUSED
        to: REVOKED
        trigger: "POST /api/connections/{id}/state (to_status=REVOKED)"
        actor: Parent
        preconditions: []
        side_effects:
          - "increments ServiceConnection.version by 1"
      - from: REVOKED
        to: AWAITING_CONSENT
        trigger: "POST /api/connections/{id}/state (to_status=AWAITING_CONSENT) — re-consent flow"
        actor: Parent
        preconditions:
          - "ChildProfile.profile_status == ACTIVE (ERR_CHILD_ARCHIVED)"
        side_effects:
          - "increments ServiceConnection.version by 1"

  - entity: Alert
    field: alert_status
    initial_state: DELIVERED
    terminal_states: []
    transitions:
      - from: DELIVERED
        to: ACKNOWLEDGED
        trigger: "POST /api/alerts/{id}/state (to_status=ACKNOWLEDGED)"
        actor: Parent
        preconditions: []
        side_effects:
          - "Linked EscalationCase (if any) OPEN -> GUIDANCE_ISSUED"
          - "ChildProfile.open_alert_count recomputed"
      - from: ACKNOWLEDGED
        to: RESOLVED
        trigger: "POST /api/alerts/{id}/state (to_status=RESOLVED)"
        actor: Parent
        preconditions:
          - "If severity == SEVERE: linked EscalationCase.case_status == CLOSED (ERR_ESCALATION_OPEN)"
        side_effects:
          - "ChildProfile.open_alert_count recomputed (decreases by 1)"
      - from: REOPENED
        to: ACKNOWLEDGED
        trigger: "POST /api/alerts/{id}/state (to_status=ACKNOWLEDGED)"
        actor: Parent
        preconditions: []
        side_effects:
          - "ChildProfile.open_alert_count recomputed"
      - from: REOPENED
        to: RESOLVED
        trigger: "POST /api/alerts/{id}/state (to_status=RESOLVED)"
        actor: Parent
        preconditions:
          - "If severity == SEVERE: linked EscalationCase.case_status == CLOSED (ERR_ESCALATION_OPEN)"
        side_effects:
          - "ChildProfile.open_alert_count recomputed (decreases by 1)"
      - from: RESOLVED
        to: REOPENED
        trigger: "POST /api/alerts/{id}/state (to_status=REOPENED)"
        actor: Parent
        preconditions: []
        side_effects:
          - "ChildProfile.open_alert_count recomputed (increases by 1)"

  - entity: EscalationCase
    field: case_status
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: GUIDANCE_ISSUED
        trigger: "system: parent acknowledges the linked alert"
        actor: system
        preconditions:
          - "Alert.alert_status becomes ACKNOWLEDGED"
        side_effects: []
      - from: GUIDANCE_ISSUED
        to: RESOURCE_REFERRED
        trigger: "POST /api/escalation-cases/{id}/state (to_status=RESOURCE_REFERRED)"
        actor: Parent
        preconditions: []
        side_effects: []
      - from: GUIDANCE_ISSUED
        to: CRISIS_ESCALATED
        trigger: "POST /api/escalation-cases/{id}/state (to_status=CRISIS_ESCALATED)"
        actor: Parent
        preconditions: []
        side_effects: []
      - from: RESOURCE_REFERRED
        to: CLOSED
        trigger: "POST /api/escalation-cases/{id}/state (to_status=CLOSED)"
        actor: Parent
        preconditions: []
        side_effects:
          - "FamilyAccount.open_escalation_count recomputed"
      - from: CRISIS_ESCALATED
        to: LEGAL_REPORTED
        trigger: "POST /api/escalation-cases/{id}/state (to_status=LEGAL_REPORTED)"
        actor: "SchoolAdmin or PlatformAdmin"
        preconditions:
          - "An ACTIVE MANDATED_REPORTING DistrictLink for the child has pending_legal_report == true (ERR_LEGAL_REPORT_NOT_REQUIRED)"
        side_effects:
          - "DistrictLink.pending_legal_report := false; legal_report_filed_at := now"
          - "District.open_obligation_count recomputed (decreases by 1)"
      - from: CRISIS_ESCALATED
        to: CLOSED
        trigger: "POST /api/escalation-cases/{id}/state (to_status=CLOSED)"
        actor: Parent
        preconditions:
          - "No ACTIVE DistrictLink for the child with pending_legal_report == true (ERR_INVALID_ESCALATION_STEP)"
        side_effects:
          - "FamilyAccount.open_escalation_count recomputed"
      - from: LEGAL_REPORTED
        to: CLOSED
        trigger: "POST /api/escalation-cases/{id}/state (to_status=CLOSED)"
        actor: "SchoolAdmin or PlatformAdmin"
        preconditions: []
        side_effects:
          - "FamilyAccount.open_escalation_count recomputed"

  - entity: ScreenTimeWindow
    field: window_status
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: DISABLED
        trigger: "POST /api/screen-time-windows/{id}/state (to_status=DISABLED)"
        actor: Parent
        preconditions: []
        side_effects: []
      - from: DISABLED
        to: ACTIVE
        trigger: "POST /api/screen-time-windows/{id}/state (to_status=ACTIVE)"
        actor: Parent
        preconditions:
          - "Device.pairing_status == PAIRED (ERR_DEVICE_NOT_PAIRED)"
          - "Re-enabling a BLOCKED window must not overlap another ACTIVE BLOCKED window on same device+weekday (ERR_WINDOW_OVERLAP)"
        side_effects: []

  - entity: DeviceAccessGrant
    field: grant_status
    initial_state: SCHEDULED
    terminal_states: [EXPIRED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: ACTIVE
        trigger: "system: clock reaches start_at"
        actor: system
        preconditions:
          - "start_at <= now <= end_at"
        side_effects: []
      - from: ACTIVE
        to: EXPIRED
        trigger: "system: clock passes end_at"
        actor: system
        preconditions:
          - "now > end_at"
        side_effects: []
      - from: SCHEDULED
        to: EXPIRED
        trigger: "system: clock advances past end_at without entering the window"
        actor: system
        preconditions:
          - "now > end_at"
        side_effects: []
      - from: SCHEDULED
        to: CANCELLED
        trigger: "system: owning device enters LOCKDOWN"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: CANCELLED
        trigger: "system: owning device enters LOCKDOWN"
        actor: system
        preconditions: []
        side_effects: []

  - entity: DistrictLink
    field: link_status
    initial_state: PENDING_CONSENT
    terminal_states: [WITHDRAWN]
    transitions:
      - from: PENDING_CONSENT
        to: ACTIVE
        trigger: "POST /api/district-links/{id}/state (to_status=ACTIVE) — parent consent"
        actor: Parent
        preconditions:
          - "District.district_status == ACTIVE (ERR_DISTRICT_SUSPENDED)"
          - "ChildProfile.profile_status == ACTIVE (ERR_CHILD_ARCHIVED)"
        side_effects:
          - "consented_at := now"
      - from: PENDING_CONSENT
        to: WITHDRAWN
        trigger: "POST /api/district-links/{id}/state (to_status=WITHDRAWN)"
        actor: Parent
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: WITHDRAWN
        trigger: "POST /api/district-links/{id}/state (to_status=WITHDRAWN)"
        actor: Parent
        preconditions:
          - "pending_legal_report == false (ERR_LINK_WITHDRAW_BLOCKED)"
        side_effects: []

# =============================================================================
# 1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: child-tuning-stale-version
    parent_entity: ChildProfile
    write_endpoint: "PATCH /api/children/{id}"
    occ_field: expected_child_version
    description: |
      Updating a ChildProfile whose version has advanced since the client last
      observed it is rejected. This captures the case where another write (tuning
      change or archive cascade) has just advanced the profile, so the current
      writer's view of the child is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: family-subscription-stale-version
    parent_entity: FamilyAccount
    write_endpoint: "POST /api/families/{id}/subscription/changes"
    occ_field: expected_family_version
    description: |
      Changing a FamilyAccount subscription tier whose version has advanced since
      the client last observed it is rejected. This captures the case where
      another writer has just changed the tier or family state (which legitimately
      supersedes the prior billing view), so the current writer's proration basis
      is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: content_risk_scoring
    trigger: "POST /api/content-items (ingest)"
    algorithm: weighted_scoring
    formula: |
      base = min(100, sum(s.weight for s in signals))
      variant LEXICAL_V1:    risk_score = base
      variant CONTEXTUAL_V2: risk_score = min(100, round_half_up(base * (1 + 0.05 * min(thread_depth, 5))))
      analysis_variant_used = family.analysis_variant at ingest time
    input_set: "signals array of the ingested ContentItem; family analysis_variant"
    constants:
      SCORE_CAP: 100
      CONTEXT_STEP: 0.05
      CONTEXT_DEPTH_CAP: 5
    precision: "integer, round_half_up"
    variants:
      - name: LEXICAL_V1
        when: "FamilyAccount.analysis_variant == LEXICAL_V1"
        difference: "Pure keyword weighting; thread depth ignored"
      - name: CONTEXTUAL_V2
        when: "FamilyAccount.analysis_variant == CONTEXTUAL_V2"
        difference: "Applies thread-depth multiplier (1 + 0.05*min(depth,5)) then caps at 100"

  - name: alert_severity_classification
    trigger: "POST /api/content-items (after content_risk_scoring)"
    algorithm: threshold
    formula: |
      base_level(score): score >= 85 -> 4 (SEVERE); 60..84 -> 3 (HIGH);
                         30..59 -> 2 (MODERATE); else 1 (LOW)
      floor(category): PREDATORY_CONTACT -> 3; SELF_HARM -> 3; BULLYING -> 1; EXPLICIT -> 1
      age_delta: CHILD_9_UNDER -> +1;
                 OLDER_TEEN_16_17 AND category == EXPLICIT -> -1;
                 else 0
      sensitivity_delta: STRICT -> +1; LENIENT -> -1; STANDARD -> 0
      level = clamp( max(base_level(risk_score) + age_delta + sensitivity_delta,
                         floor(dominant_category)), 1, 4 )
      severity = {1: LOW, 2: MODERATE, 3: HIGH, 4: SEVERE}[level]
      dominant_category = signal with max weight; ties broken by earliest index in signals
    input_set: "risk_score, signals, child age_band, child monitoring_sensitivity"
    constants:
      SEVERE_MIN: 85
      HIGH_MIN: 60
      MODERATE_MIN: 30
    precision: "integer levels 1..4"

  - name: excerpt_truncation
    trigger: "Alert creation"
    algorithm: aggregation
    formula: |
      cap = 140, except cap = 70 when age_band == OLDER_TEEN_16_17 AND monitoring_sensitivity == LENIENT
      if len(raw_text) <= cap: excerpt_text = raw_text
      else:
        head = raw_text[0:cap]
        if ' ' in head: head = head up to and excluding the last ' '
        excerpt_text = head + "…"
    input_set: "ContentItem.raw_text, child age_band, child monitoring_sensitivity"
    constants:
      EXCERPT_CAP_DEFAULT: 140
      EXCERPT_CAP_TEEN_LENIENT: 70
    precision: "character-exact"

  - name: subscription_proration
    trigger: "POST /api/families/{id}/subscription/changes"
    algorithm: tiered_pricing
    formula: |
      monthly_cents: BASIC=999, STANDARD=1999, PREMIUM=2999
      daily_cents(tier) = round_half_up(monthly_cents(tier) / 30)     # per-day rate, rounded FIRST
      remaining_days = integer days from current clock to billing_period_end (exclusive of period end)
      charge = sum over each remaining day of (daily_cents(new) - daily_cents(old))
             = remaining_days * (daily_cents(new) - daily_cents(old))
      Rounding order is pinned: round per-day rates first, then multiply by remaining_days.
      charge may be negative (credit on downgrade).
    input_set: "old tier, new tier, billing_period_end, current clock"
    constants:
      BASIC_MONTHLY_CENTS: 999
      STANDARD_MONTHLY_CENTS: 1999
      PREMIUM_MONTHLY_CENTS: 2999
      PERIOD_DAYS: 30
    precision: "integer cents, round_half_up per day rate"

  - name: alert_feed_composition
    trigger: "GET /api/alerts (with variant parameter)"
    algorithm: forward_looking
    formula: |
      eligible = Alerts for child with alert_status IN {DELIVERED, ACKNOWLEDGED, REOPENED}
      variant IMMEDIATE: feed = eligible with severity IN {MODERATE, HIGH, SEVERE}
      variant DIGEST:    feed = eligible with severity IN {HIGH, SEVERE}
      Sort: created_at DESC. RESOLVED alerts excluded from both variants.
    input_set: "Alerts of the child filtered by status and severity"
    precision: "set membership exact"
    variants:
      - name: IMMEDIATE
        when: "variant=IMMEDIATE (default)"
        difference: "Includes MODERATE alerts"
      - name: DIGEST
        when: "variant=DIGEST"
        difference: "Excludes MODERATE alerts; only HIGH and SEVERE surface in the digest"

  - name: bypass_strike_window
    trigger: "POST /api/devices/{id}/bypass-events; POST /api/_clock/set_current_utc"
    algorithm: decay_function
    formula: |
      counted(e) = e.detected_at >= now - 14 days AND e.detected_at <= now
      bypass_strike_count = count of BypassEvents for device with counted(e)
      posture: count >= 3 -> LOCKDOWN; count >= 1 -> BYPASS_WATCH; count == 0 -> NORMAL
      Boundary is inclusive at the trailing edge: an event exactly 14 days old still counts.
    input_set: "BypassEvents of the device, current clock"
    constants:
      STRIKE_WINDOW_DAYS: 14
      LOCKDOWN_THRESHOLD: 3
    precision: "integer count; inclusive >= boundary"

  - name: device_limit_and_count
    trigger: "POST /api/children/{id}/devices/pair; POST /api/devices/{id}/unpair; subscription tier change"
    algorithm: aggregation
    formula: |
      device_limit: BASIC=2, STANDARD=5, PREMIUM=10
      device_count(family) = count of Devices whose child belongs to family AND pairing_status == PAIRED
      Pair allowed iff device_count < device_limit (i.e., rejected when device_count >= device_limit).
      Tier change to a lower tier rejected when device_count > new device_limit (ERR_DEVICE_LIMIT_EXCEEDED).
      INVARIANT (compensating pair): pair(+1) and unpair(-1) keep
      device_count == count(PAIRED devices) at all times.
    input_set: "Devices of the family, subscription_tier"
    constants:
      BASIC_LIMIT: 2
      STANDARD_LIMIT: 5
      PREMIUM_LIMIT: 10
    precision: "integer"

  - name: open_alert_count_aggregation
    trigger: "Alert status transitions"
    algorithm: aggregation
    formula: |
      open_alert_count(child) = count of Alerts for child with alert_status IN {DELIVERED, ACKNOWLEDGED, REOPENED}
      INVARIANT (compensating pair): RESOLVE(-1) followed by REOPEN(+1) restores the prior value exactly.
    input_set: "Alerts of the child"
    precision: "integer"

  - name: legal_report_deadline
    trigger: "EscalationCase creation (SEVERE alert ingest)"
    algorithm: forward_looking
    formula: |
      if an ACTIVE DistrictLink with District.jurisdiction == MANDATED_REPORTING exists
      for the child at case creation:
        legal_report_due_at = case.created_at + 24 hours
        that link's pending_legal_report = true
        case.district_link_id = that link (earliest consented_at ASC if several qualify)
      else: legal_report_due_at = null
      overdue = (due_at != null) AND (legal_report_filed_at == null) AND (now > due_at)
    input_set: "ACTIVE DistrictLinks of the child, District.jurisdiction, current clock"
    constants:
      REPORT_SLA_HOURS: 24
    precision: "second-exact ISO8601"

  - name: age_band_derivation
    trigger: "ChildProfile create/update; severity classification"
    algorithm: threshold
    formula: |
      age = year(now) - birth_year
      age <= 9 -> CHILD_9_UNDER; 10..12 -> PRETEEN_10_12; 13..15 -> TEEN_13_15; 16..17 -> OLDER_TEEN_16_17
      birth_year yielding age < 0 or age > 17 is rejected at input (ERR_INVALID_REQUEST)
    input_set: "birth_year, current clock"
    precision: "integer year arithmetic"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and well-formed"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Role is listed in the endpoint's roles; entity_backed identity matches resource ownership scope"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Path ids exist, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all resource endpoints"

  - priority: 4
    category: existence
    check: "Scope: Parent's family matches target family (ERR_CROSS_FAMILY_ACCESS); SchoolAdmin's district matches target child's ACTIVE DistrictLink (ERR_CROSS_DISTRICT_ACCESS); SchoolAdmin may only view alerts with severity IN {HIGH, SEVERE} (ERR_SEVERITY_VISIBILITY_DENIED)"
    error_id: ERR_CROSS_FAMILY_ACCESS
    http_status: 403
    applies_to: "all scoped endpoints"

  - priority: 5
    category: state
    check: "OCC: expected_<parent>_version matches current version on guarded writes"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "PATCH /api/children/{id}, POST /api/families/{id}/subscription/changes"

  - priority: 6
    category: state
    check: "Target resource in a valid from-state: transition validity (ERR_INVALID_STATE), terminal lockdown (ERR_ALREADY_TERMINAL), device PAIRED for windows/grants (ERR_DEVICE_NOT_PAIRED), connection ACTIVE for ingest (ERR_CONNECTION_NOT_ACTIVE), child ACTIVE for child-scoped writes (ERR_CHILD_ARCHIVED)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "state and child-scoped write endpoints"

  - priority: 7
    category: business_safety
    check: "Family ACTIVE for pairing, consent, ingest (ERR_FAMILY_SUSPENDED); device not LOCKDOWN for new grants (ERR_DEVICE_LOCKED_DOWN); SEVERE alert resolution requires linked case CLOSED (ERR_ESCALATION_OPEN); child archive blocked while a case is open (ERR_ESCALATION_OPEN); district-link withdrawal blocked while pending_legal_report (ERR_LINK_WITHDRAW_BLOCKED)"
    error_id: ERR_FAMILY_SUSPENDED
    http_status: 409
    applies_to: "pair, connection state, content ingest, grants, alert resolve, child archive, district-link state"

  - priority: 8
    category: business_constraint
    check: "Uniqueness of non-REVOKED connection per (child, service_type, external_handle) (ERR_DUPLICATE_CONNECTION); BLOCKED window half-open overlap (ERR_WINDOW_OVERLAP); grant padded closed-interval conflict (ERR_GRANT_CONFLICT); escalation step validity and role-of-step (ERR_INVALID_ESCALATION_STEP); legal report requires mandated pending link (ERR_LEGAL_REPORT_NOT_REQUIRED); district ACTIVE for link consent (ERR_DISTRICT_SUSPENDED); input shape errors: birth_year age in 0..17, window start<end bounds, grant start<end, detected_at/occurred_at <= now (ERR_INVALID_REQUEST)"
    error_id: ERR_DUPLICATE_CONNECTION
    http_status: 409
    applies_to: "connection create, window create/state, grant create, escalation state, district-link state, all input validation"

  - priority: 9
    category: business_fiscal
    check: "device_count < device_limit on pair; on tier change device_count <= new device_limit (ERR_DEVICE_LIMIT_EXCEEDED)"
    error_id: ERR_DEVICE_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "POST /api/children/{id}/devices/pair, POST /api/families/{id}/subscription/changes"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  - method: POST
    path: "/api/_clock/set_current_utc"
    description: "Set the logical clock (test-driving). Before any call, the clock reads exactly 2026-09-01T00:00:00Z and never falls back to wall-clock. Advancing the clock re-evaluates bypass strike windows, device postures (auto-heal to NORMAL when strikes drop to 0), grant statuses, and escalation overdue flags."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ now: string }"
    side_effects:
      - "Recompute every Device.bypass_strike_count and device_posture"
      - "Recompute every DeviceAccessGrant.grant_status"
      - "Recompute every EscalationCase.overdue"

  - method: POST
    path: "/api/families"
    description: "Create a FamilyAccount; auto-creates the primary ParentMember"
    roles: [PlatformAdmin]
    code: 201
    input: [family_name, primary_contact_email, primary_parent_name, "subscription_tier?", "analysis_variant?"]
    output: FamilyAccount
    side_effects:
      - "billing_period_start := now; billing_period_end := now + 30 days"
      - "Primary ParentMember created with is_primary=true"

  - method: GET
    path: "/api/families/{id}"
    description: "Get a FamilyAccount"
    roles: [PlatformAdmin, Parent]
    code: 200
    input: []
    output: FamilyAccount
    side_effects: []

  - method: POST
    path: "/api/families/{id}/state"
    description: "Suspend or reactivate a family"
    roles: [PlatformAdmin]
    code: 200
    input: [to_status]
    output: FamilyAccount
    side_effects:
      - "increments FamilyAccount.version by 1"

  - method: POST
    path: "/api/families/{id}/subscription/changes"
    description: "Change subscription tier with proration; OCC-guarded"
    roles: [Parent, PlatformAdmin]
    code: 200
    input: [new_tier, expected_family_version]
    output: FamilyAccount
    side_effects:
      - "last_proration_charge_cents := subscription_proration"
      - "device_limit recomputed"
      - "increments FamilyAccount.version by 1"

  - method: GET
    path: "/api/families/{id}/parents"
    description: "List parent members of a family"
    roles: [Parent, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "ParentMember[]"
    side_effects: []

  - method: GET
    path: "/api/families/{id}/children"
    description: "List children of a family"
    roles: [Parent, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "ChildProfile[]"
    side_effects: []

  - method: POST
    path: "/api/children"
    description: "Create a ChildProfile"
    roles: [Parent]
    code: 201
    input: [family_account_id, display_name, birth_year, "monitoring_sensitivity?"]
    output: ChildProfile
    side_effects:
      - "age_band computed from birth_year vs current clock year"

  - method: GET
    path: "/api/children/{id}"
    description: "Get a ChildProfile"
    roles: [Parent, SchoolAdmin, PlatformAdmin]
    code: 200
    input: []
    output: ChildProfile
    side_effects: []

  - method: PATCH
    path: "/api/children/{id}"
    description: "Update tuning (monitoring_sensitivity, birth_year) or archive (profile_status=ARCHIVED); OCC-guarded"
    roles: [Parent]
    code: 200
    input: ["monitoring_sensitivity?", "birth_year?", "profile_status?", expected_child_version]
    output: ChildProfile
    side_effects:
      - "Archive cascade: non-REVOKED connections -> REVOKED"
      - "increments ChildProfile.version by 1"

  - method: GET
    path: "/api/children/{id}/connections"
    description: "List service connections of a child"
    roles: [Parent, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "ServiceConnection[]"
    side_effects: []

  - method: POST
    path: "/api/children/{id}/connections"
    description: "Create a ServiceConnection (starts AWAITING_CONSENT)"
    roles: [Parent]
    code: 201
    input: [service_type, external_handle, credential_token]
    output: ServiceConnection
    side_effects: []

  - method: GET
    path: "/api/children/{id}/filter-rules"
    description: "List filter rules of a child"
    roles: [Parent, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "FilterRule[]"
    side_effects: []

  - method: POST
    path: "/api/children/{id}/filter-rules"
    description: "Create a FilterRule"
    roles: [Parent]
    code: 201
    input: [rule_kind, target]
    output: FilterRule
    side_effects: []

  - method: GET
    path: "/api/children/{id}/district-links"
    description: "List district links of a child"
    roles: [Parent, SchoolAdmin, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "DistrictLink[]"
    side_effects: []

  - method: GET
    path: "/api/children/{id}/devices"
    description: "List devices of a child"
    roles: [Parent, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "Device[]"
    side_effects: []

  - method: POST
    path: "/api/children/{id}/devices/pair"
    description: "Pair a new managed device"
    roles: [Parent]
    code: 201
    input: [platform, nickname]
    output: Device
    side_effects:
      - "FamilyAccount.device_count recomputed (increases by 1)"

  - method: GET
    path: "/api/connections/{id}"
    description: "Get a ServiceConnection"
    roles: [Parent, PlatformAdmin]
    code: 200
    input: []
    output: ServiceConnection
    side_effects: []

  - method: GET
    path: "/api/connections/{id}/content-items"
    description: "List content items of a connection (raw monitoring surface; parents do not have access)"
    roles: [PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "ContentItem[]"
    side_effects: []

  - method: POST
    path: "/api/connections/{id}/state"
    description: "Consent/pause/resume/revoke/re-consent a connection"
    roles: [Parent]
    code: 200
    input: [to_status]
    output: ServiceConnection
    side_effects:
      - "increments ServiceConnection.version by 1"

  - method: GET
    path: "/api/devices/{id}"
    description: "Get a Device"
    roles: [Parent, PlatformAdmin]
    code: 200
    input: []
    output: Device
    side_effects: []

  - method: POST
    path: "/api/devices/{id}/unpair"
    description: "Unpair a device"
    roles: [Parent]
    code: 200
    input: []
    output: Device
    side_effects:
      - "FamilyAccount.device_count recomputed (decreases by 1)"

  - method: POST
    path: "/api/devices/{id}/screen-time-windows"
    description: "Create a screen-time window"
    roles: [Parent]
    code: 201
    input: [weekday, start_minute, end_minute, window_kind]
    output: ScreenTimeWindow
    side_effects: []

  - method: GET
    path: "/api/devices/{id}/screen-time-windows"
    description: "List screen-time windows of a device"
    roles: [Parent]
    code: 200
    input: ["limit?", "offset?"]
    output: "ScreenTimeWindow[]"
    side_effects: []

  - method: POST
    path: "/api/screen-time-windows/{id}/state"
    description: "Disable or re-enable a window"
    roles: [Parent]
    code: 200
    input: [to_status]
    output: ScreenTimeWindow
    side_effects: []

  - method: POST
    path: "/api/devices/{id}/bypass-events"
    description: "Report a bypass event from the managed device"
    roles: [DeviceAgent]
    code: 201
    input: [bypass_kind, detected_at]
    output: BypassEvent
    side_effects:
      - "Device.bypass_strike_count recomputed"
      - "Device posture re-evaluated; LOCKDOWN cancels SCHEDULED/ACTIVE grants"

  - method: GET
    path: "/api/devices/{id}/bypass-events"
    description: "List bypass events of a device"
    roles: [Parent, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "BypassEvent[]"
    side_effects: []

  - method: POST
    path: "/api/devices/{id}/access-grants"
    description: "Create a temporary unlock grant"
    roles: [Parent]
    code: 201
    input: [start_at, end_at, "reason?"]
    output: DeviceAccessGrant
    side_effects: []

  - method: GET
    path: "/api/devices/{id}/access-grants"
    description: "List access grants of a device"
    roles: [Parent]
    code: 200
    input: ["limit?", "offset?"]
    output: "DeviceAccessGrant[]"
    side_effects: []

  - method: POST
    path: "/api/content-items"
    description: "Ingest a content item; computes risk score and severity, creates Alert when severity >= MODERATE, auto-creates EscalationCase for SEVERE"
    roles: [DeviceAgent]
    code: 201
    input: [service_connection_id, occurred_at, direction, thread_depth, signals, raw_text]
    output: ContentItem
    side_effects:
      - "content_risk_scoring and alert_severity_classification computed"
      - "severity IN {MODERATE, HIGH, SEVERE}: Alert created (DELIVERED) with excerpt"
      - "severity == SEVERE: EscalationCase created (OPEN); mandated district link marked pending_legal_report with due_at = created_at + 24h"

  - method: GET
    path: "/api/content-items/{id}"
    description: "Get a ContentItem (raw monitoring surface)"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: ContentItem
    side_effects: []

  - method: GET
    path: "/api/alerts/{id}"
    description: "Get an Alert (excerpted view)"
    roles: [Parent, SchoolAdmin, PlatformAdmin]
    code: 200
    input: []
    output: Alert
    side_effects: []

  - method: GET
    path: "/api/alerts"
    description: "List alerts; variant=IMMEDIATE (default) includes MODERATE+, variant=DIGEST only HIGH/SEVERE; both exclude RESOLVED"
    roles: [Parent, SchoolAdmin, PlatformAdmin]
    code: 200
    input: ["child_profile_id?", "content_item_id?", "alert_status?", "variant?", "limit?", "offset?"]
    output: "Alert[]"
    side_effects: []

  - method: POST
    path: "/api/alerts/{id}/state"
    description: "Acknowledge, resolve, or reopen an alert"
    roles: [Parent]
    code: 200
    input: [to_status]
    output: Alert
    side_effects:
