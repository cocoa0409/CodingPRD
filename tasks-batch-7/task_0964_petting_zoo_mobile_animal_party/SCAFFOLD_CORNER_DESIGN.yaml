# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Petting-Zoo & Mobile-Animal Party — breadth coverage of §1.1–§1.7 claims not
# already exercised by SCAFFOLD_DIFFICULTY_DESIGN.yaml
# =============================================================================
scaffold_corner_design:

  - section: entities
    instances:
      - name: customer_creation_applies_defaults
        claim_type: creation
        grounds: [entities.Customer]
        distinguishing_aspect: "POST /customers with all required fields returns 201 with system-minted UUID id, version 1, and created_at/updated_at populated."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /petting-zoo/customers", payload: { email: "new@x.com", full_name: "New Cust", customer_type: "LIBRARY" }, as: Anonymous, captures: { cid: $.data.id, cver: $.data.version } }
          assert:
            - "response envelope response_type == object; ${cver} == 1"
            - "data.email == new@x.com and data.customer_type == LIBRARY; created_at == updated_at"

      - name: customer_create_missing_required_email
        claim_type: required_fields
        grounds: [entities.Customer, "validations[priority=3]"]
        distinguishing_aspect: "Omitting required input field email yields ERR_INVALID_REQUEST (400) via the schema-validation priority before any business check."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /petting-zoo/customers", payload: { full_name: "No Email", customer_type: "PRIVATE" }, as: Anonymous, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_INVALID_REQUEST"

      - name: animal_create_with_invalid_enum_rejected
        claim_type: type_constraints
        grounds: [entities.Animal.fields.species, "validations[priority=3]"]
        distinguishing_aspect: "species DRAGON is outside the declared enum {GOAT, SHEEP, PONY, RABBIT, CHICKEN, REPTILE} and is rejected with ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /petting-zoo/animals", payload: { name: "Draco", species: "DRAGON", weight_class: "LARGE", temperament_tier: 1, base_event_fee_cents: 9999 }, as: Operator, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_INVALID_REQUEST"

      - name: booking_create_computed_field_input_ignored
        claim_type: computed_fields
        grounds: [entities.Booking.fields.quoted_total_cents]
        distinguishing_aspect: "quoted_total_cents is source:computed; a client-supplied value of 999999 at creation is ignored and the stored value stays null until a quote runs."
        test_recipe:
          setup:
            - "Clock 2026-05-10; one customer; one venue"
          setup_api_calls:
            - { call: "POST /petting-zoo/_clock/set_current_utc", payload: { to_iso8601: "2026-05-10T00:00:00Z" }, as: Operator }
            - { call: "POST /petting-zoo/customers", payload: { email: "cc@x.com", full_name: "Comp Cust", customer_type: "PRIVATE" }, as: Anonymous, captures: { cc: $.data.id } }
            - { call: "POST /petting-zoo/venues", payload: { name: "Greenfield Park", address: "1 Meadow Ln", venue_type: "OUTDOOR", water_access: true, surface_type: "GRASS", travel_zone: "ZONE_A", distance_miles: 10, max_guest_capacity: 100, requires_animal_permit: false, requires_handwash_stations: true }, as: Customer, as_user_id: "${cc}", captures: { vv: $.data.id } }
          trigger:
            - { call: "POST /petting-zoo/bookings", payload: { venue_id: "${vv}", start_time: "2026-06-17T14:00:00Z", end_time: "2026-06-17T16:00:00Z", guest_count: 10, child_guest_count: 0, booking_type: "PRIVATE_PARTY", planned_handwash_stations: 1, quoted_total_cents: 999999 }, as: Customer, as_user_id: "${cc}", captures: { bk: $.data.id } }
          assert:
            - "GET /petting-zoo/bookings/${bk} shows quoted_total_cents == null (client input 999999 ignored) and status == DRAFT"

      - name: get_booking_not_found_returns_404
        claim_type: not_found
        grounds: [entities.Booking, "errors[ERR_BOOKING_NOT_FOUND]"]
        distinguishing_aspect: "GET on a well-formed but nonexistent booking UUID returns 404 ERR_BOOKING_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /petting-zoo/bookings/00000000-0000-0000-0000-000000000000", payload: {}, as: Coordinator, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_BOOKING_NOT_FOUND with http 404"

      - name: list_animals_pagination_envelope
        claim_type: listing
        grounds: [entities.Animal, response_envelope]
        distinguishing_aspect: "With 12 animals and limit=10, the list envelope reports total_count 12, has_more true, and returns exactly 10 items."
        test_recipe:
          setup:
            - "Twelve chickens on the roster"
          setup_api_calls:
            - { call: "POST /petting-zoo/animals", payload: { name: "P01", species: "CHICKEN", weight_class: "SMALL", temperament_tier: 2, base_event_fee_cents: 3000 }, as: Operator }
            - { call: "POST /petting-zoo/animals", payload: { name: "P02", species: "CHICKEN", weight_class: "SMALL", temperament_tier: 2, base_event_fee_cents: 3000 }, as: Operator }
            - { call: "POST /petting-zoo/animals", payload: { name: "P03", species: "CHICKEN", weight_class: "SMALL", temperament_tier: 2, base_event_fee_cents: 3000 }, as: Operator }
            - { call: "POST /petting-zoo/animals", payload: { name: "P04", species: "CHICKEN", weight_class: "SMALL", temperament_tier: 2, base_event_fee_cents: 3000 }, as: Operator }
            - { call: "POST /petting-zoo/animals", payload: { name: "P05", species: "CHICKEN", weight_class: "SMALL", temperament_tier: 2, base_event_fee_cents: 3000 }, as: Operator }
            - { call: "POST /petting-zoo/animals", payload: { name: "P06", species: "CHICKEN", weight_class: "SMALL", temperament_tier: 2, base_event_fee_cents: 3000 }, as: Operator }
            - { call: "POST /petting-zoo/animals", payload: { name: "P07", species: "CHICKEN", weight_class: "SMALL", temperament_tier: 2, base_event_fee_cents: 3000 }, as: Operator }
            - { call: "POST /petting-zoo/animals", payload: { name: "P08", species: "CHICKEN", weight_class: "SMALL", temperament_tier: 2, base_event_fee_cents: 3000 }, as: Operator }
            - { call: "POST /petting-zoo/animals", payload: { name: "P09", species: "CHICKEN", weight_class: "SMALL", temperament_tier: 2, base_event_fee_cents: 3000 }, as: Operator }
            - { call: "POST /petting-zoo/animals", payload: { name: "P10", species: "CHICKEN", weight_class: "SMALL", temperament_tier: 2, base_event_fee_cents: 3000 }, as: Operator }
            - { call: "POST /petting-zoo/animals", payload: { name: "P11", species: "CHICKEN", weight_class: "SMALL", temperament_tier: 2, base_event_fee_cents: 3000 }, as: Operator }
            - { call: "POST /petting-zoo/animals", payload: { name: "P12", species: "CHICKEN", weight_class: "SMALL", temperament_tier: 2, base_event_fee_cents: 3000 }, as: Operator }
          trigger:
            - { call: "GET /petting-zoo/animals", payload: { limit: 10 }, as: Operator }
          assert:
            - "meta contains api_request_id and api_request_timestamp; response_type == array"
            - "total_count == 12, has_more == true, returned items == 10, limit == 10, offset == 0"

  - section: state_machines
    instances:
      - name: booking_in_draft_cannot_complete
        claim_type: invalid_transition
        grounds: [state_machines.Booking]
        distinguishing_aspect: "complete is only declared from IN_PROGRESS; calling it on a DRAFT booking fails with ERR_INVALID_STATE and leaves the booking untouched."
        test_recipe:
          setup:
            - "Clock 2026-05-10; customer; venue; DRAFT booking 2026-06-17"
          setup_api_calls:
            - { call: "POST /petting-zoo/_clock/set_current_utc", payload: { to_iso8601: "2026-05-10T00:00:00Z" }, as: Operator }
            - { call: "POST /petting-zoo/customers", payload: { email: "sm1@x.com", full_name: "Sm One", customer_type: "PRIVATE" }, as: Anonymous, captures: { c1: $.data.id } }
            - { call: "POST /petting-zoo/venues", payload: { name: "Greenfield Park", address: "1 Meadow Ln", venue_type: "OUTDOOR", water_access: true, surface_type: "GRASS", travel_zone: "ZONE_A", distance_miles: 10, max_guest_capacity: 100, requires_animal_permit: false, requires_handwash_stations: true }, as: Customer, as_user_id: "${c1}", captures: { v1: $.data.id } }
            - { call: "POST /petting-zoo/bookings", payload: { venue_id: "${v1}", start_time: "2026-06-17T14:00:00Z", end_time: "2026-06-17T16:00:00Z", guest_count: 10, child_guest_count: 0, booking_type: "PRIVATE_PARTY", planned_handwash_stations: 1 }, as: Customer, as_user_id: "${c1}", captures: { bk: $.data.id } }
          trigger:
            - { call: "POST /petting-zoo/bookings/${bk}/complete", payload: { actual_attendance_count: 10 }, as: Coordinator, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_INVALID_STATE"
            - "GET /petting-zoo/bookings/${bk} status == DRAFT and compliance_audited_score == null"

      - name: cancelled_booking_cannot_dispatch
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Booking, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "CANCELLED_CUSTOMER is terminal: dispatch after a customer cancel fails with ERR_INVALID_STATE and no side effects fire (no version increment)."
        test_recipe:
          setup:
            - "Clock 2026-05-10; customer; venue; DRAFT booking 2026-06-17 cancelled by the customer (0 paid, no ledger entries)"
          setup_api_calls:
            - { call: "POST /petting-zoo/_clock/set_current_utc", payload: { to_iso8601: "2026-05-10T00:00:00Z" }, as: Operator }
            - { call: "POST /petting-zoo/customers", payload: { email: "sm2@x.com", full_name: "Sm Two", customer_type: "PRIVATE" }, as: Anonymous, captures: { c2: $.data.id } }
            - { call: "POST /petting-zoo/venues", payload: { name: "Greenfield Park", address: "1 Meadow Ln", venue_type: "OUTDOOR", water_access: true, surface_type: "GRASS", travel_zone: "ZONE_A", distance_miles: 10, max_guest_capacity: 100, requires_animal_permit: false, requires_handwash_stations: true }, as: Customer, as_user_id: "${c2}", captures: { v2: $.data.id } }
            - { call: "POST /petting-zoo/bookings", payload: { venue_id: "${v2}", start_time: "2026-06-17T14:00:00Z", end_time: "2026-06-17T16:00:00Z", guest_count: 10, child_guest_count: 0, booking_type: "PRIVATE_PARTY", planned_handwash_stations: 1 }, as: Customer, as_user_id: "${c2}", captures: { bk: $.data.id, v_pre: $.data.version } }
            - { call: "POST /petting-zoo/bookings/${bk}/cancel", payload: { reason: "CUSTOMER" }, as: Customer, as_user_id: "${c2}", captures: { st: $.data.status, v_post: $.data.version } }
          trigger:
            - { call: "POST /petting-zoo/bookings/${bk}/dispatch", payload: {}, as: Coordinator, captures: { err: $.data.error_id } }
          assert:
            - "${st} == CANCELLED_CUSTOMER and ${v_post} == ${v_pre} + 1"
            - "${err} == ERR_INVALID_STATE; GET /petting-zoo/bookings/${bk} status still CANCELLED_CUSTOMER"
            - "GET /petting-zoo/bookings/${bk}/ledger-entries returns empty (total_paid_cents was 0)"

      - name: waiver_compound_status_progression
        claim_type: valid_transition
        grounds: [state_machines.Waiver]
        distinguishing_aspect: "Waiver is a compound machine: status is re-derived from signed_count vs required_signatures — PENDING -> PARTIAL at 2/5 -> COMPLETE at 5/5."
        test_recipe:
          setup:
            - "Clock 2026-05-10; customer; venue; booking with child_guest_count 5 (waiver auto-created, required_signatures 5)"
          setup_api_calls:
            - { call: "POST /petting-zoo/_clock/set_current_utc", payload: { to_iso8601: "2026-05-10T00:00:00Z" }, as: Operator }
            - { call: "POST /petting-zoo/customers", payload: { email: "sm3@x.com", full_name: "Sm Three", customer_type: "PRIVATE" }, as: Anonymous, captures: { c3: $.data.id } }
            - { call: "POST /petting-zoo/venues", payload: { name: "Greenfield Park", address: "1 Meadow Ln", venue_type: "OUTDOOR", water_access: true, surface_type: "GRASS", travel_zone: "ZONE_A", distance_miles: 10, max_guest_capacity: 100, requires_animal_permit: false, requires_handwash_stations: true }, as: Customer, as_user_id: "${c3}", captures: { v3: $.data.id } }
            - { call: "POST /petting-zoo/bookings", payload: { venue_id: "${v3}", start_time: "2026-06-17T14:00:00Z", end_time: "2026-06-17T16:00:00Z", guest_count: 10, child_guest_count: 5, booking_type: "PRIVATE_PARTY", planned_handwash_stations: 1 }, as: Customer, as_user_id: "${c3}", captures: { bk: $.data.id } }
          trigger:
            - { call: "GET /petting-zoo/bookings/${bk}/waivers", payload: {}, as: Customer, as_user_id: "${c3}", captures: { w0: "$.data[0].status", req0: "$.data[0].required_signatures" } }
            - { call: "POST /petting-zoo/bookings/${bk}/waiver-signatures", payload: { count: 2 }, as: Customer, as_user_id: "${c3}", captures: { w1: $.data.status, s1: $.data.signed_count } }
            - { call: "POST /petting-zoo/bookings/${bk}/waiver-signatures", payload: { count: 3 }, as: Customer, as_user_id: "${c3}", captures: { w2: $.data.status, s2: $.data.signed_count } }
          assert:
            - "${w0} == PENDING and ${req0} == 5 (derived from child_guest_count)"
            - "${w1} == PARTIAL and ${s1} == 2"
            - "${w2} == COMPLETE and ${s2} == 5"

      - name: payment_creates_ledger_side_effect
        claim_type: side_effect_execution
        grounds: [state_machines.Booking, entities.LedgerEntry, entities.Booking.fields.total_paid_cents]
        distinguishing_aspect: "A payment on a QUOTED booking creates a PAYMENT LedgerEntry of the exact amount, raises total_paid_cents, and keeps payment_status UNPAID while below the deposit threshold."
        test_recipe:
          setup:
            - "Goat fixture to QUOTED (quoted 16240, deposit 4872)"
          setup_api_calls:
            - { call: "POST /petting-zoo/_clock/set_current_utc", payload: { to_iso8601: "2026-05-10T00:00:00Z" }, as: Operator }
            - { call: "POST /petting-zoo/customers", payload: { email: "sm4@x.com", full_name: "Sm Four", customer_type: "PRIVATE" }, as: Anonymous, captures: { c4: $.data.id } }
            - { call: "POST /petting-zoo/venues", payload: { name: "Greenfield Park", address: "1 Meadow Ln", venue_type: "OUTDOOR", water_access: true, surface_type: "GRASS", travel_zone: "ZONE_A", distance_miles: 10, max_guest_capacity: 100, requires_animal_permit: false, requires_handwash_stations: true }, as: Customer, as_user_id: "${c4}", captures: { v4: $.data.id } }
            - { call: "POST /petting-zoo/animals", payload: { name: "Gogo", species: "GOAT", weight_class: "SMALL", temperament_tier: 3, base_event_fee_cents: 8000 }, as: Operator, captures: { a_goat: $.data.id } }
            - { call: "POST /petting-zoo/animals/${a_goat}/health-records", payload: { exam_date: "2026-05-09T00:00:00Z", result: "PASS", valid_until: "2026-07-01T00:00:00Z" }, as: Veterinarian }
            - { call: "POST /petting-zoo/bookings", payload: { venue_id: "${v4}", start_time: "2026-06-17T14:00:00Z", end_time: "2026-06-17T16:00:00Z", guest_count: 20, child_guest_count: 0, booking_type: "PRIVATE_PARTY", planned_handwash_stations: 1 }, as: Customer, as_user_id: "${c4}", captures: { bk: $.data.id } }
            - { call: "POST /petting-zoo/bookings/${bk}/animals", payload: { animal_id: "${a_goat}", role: "PETTING_ZOO" }, as: Coordinator, captures: { ba: $.data.id } }
            - { call: "POST /petting-zoo/bookings/${bk}/animals/${ba}/confirm", payload: {}, as: Coordinator }
            - { call: "POST /petting-zoo/bookings/${bk}/quote", payload: {}, as: Coordinator }
          trigger:
            - { call: "POST /petting-zoo/bookings/${bk}/payments", payload: { amount_cents: 1000, method: "CARD" }, as: Customer, as_user_id: "${c4}", captures: { le_type: $.data.entry_type, le_amt: $.data.amount_cents } }
          assert:
            - "${le_type} == PAYMENT and ${le_amt} == 1000"
            - "GET /petting-zoo/bookings/${bk} total_paid_cents == 1000 and payment_status == UNPAID (1000 < deposit 4872)"

  - section: calculations
    instances:
      - name: guest_surcharge_tier_boundary_50_vs_51
        claim_type: correct_result
        grounds: [calculations.booking_price]
        distinguishing_aspect: "Guest tier boundary is inclusive at the lower edge: exactly 50 guests stays in the 1500-cent tier (17740 total), 51 guests enters the 3500-cent tier (19740 total) — one guest moves the quote by 2000 cents."
        test_recipe:
          setup:
            - "Clock 2026-05-10; customer; ZONE_A 10mi GRASS venue (handwash required); goat 8000c with PASS cert"
            - "Booking A: 2026-06-17, 50 guests / 0 children / 3 stations, goat attached; Booking B: 2026-06-18, 51 guests / 0 children / 3 stations, goat attached"
          setup_api_calls:
            - { call: "POST /petting-zoo/_clock/set_current_utc", payload: { to_iso8601: "2026-05-10T00:00:00Z" }, as: Operator }
            - { call: "POST /petting-zoo/customers", payload: { email: "ca1@x.com", full_name: "Calc One", customer_type: "PRIVATE" }, as: Anonymous, captures: { c1: $.data.id } }
            - { call: "POST /petting-zoo/venues", payload: { name: "Greenfield Park", address: "1 Meadow Ln", venue_type: "OUTDOOR", water_access: true, surface_type: "GRASS", travel_zone: "ZONE_A", distance_miles: 10, max_guest_capacity: 100, requires_animal_permit: false, requires_handwash_stations: true }, as: Customer, as_user_id: "${c1}", captures: { v1: $.data.id } }
            - { call: "POST /petting-zoo/animals", payload: { name: "Gogo", species: "GOAT", weight_class: "SMALL", temperament_tier: 3, base_event_fee_cents: 8000 }, as: Operator, captures: { a_goat: $.data.id } }
            - { call: "POST /petting-zoo/animals/${a_goat}/health-records", payload: { exam_date: "2026-05-09T00:00:00Z", result: "PASS", valid_until: "2026-07-01T00:00:00Z" }, as: Veterinarian }
            - { call: "POST /petting-zoo/bookings", payload: { venue_id: "${v1}", start_time: "2026-06-17T14:00:00Z", end_time: "2026-06-17T16:00:00Z", guest_count: 50, child_guest_count: 0, booking_type: "PRIVATE_PARTY", planned_handwash_stations: 3 }, as: Customer, as_user_id: "${c1}", captures: { bk_a: $.data.id } }
            - { call: "POST /petting-zoo/bookings/${bk_a}/animals", payload: { animal_id: "${a_goat}", role: "PETTING_ZOO" }, as: Coordinator }
            - { call: "POST /petting-zoo/bookings", payload: { venue_id: "${v1}", start_time: "2026-06-18T14:00:00Z", end_time: "2026-06-18T16:00:00Z", guest_count: 51, child_guest_count: 0, booking_type: "PRIVATE_PARTY", planned_handwash_stations: 3 }, as: Customer, as_user_id: "${c1}", captures: { bk_b: $.data.id } }
            - { call: "POST /petting-zoo/bookings/${bk_b}/animals", payload: { animal_id: "${a_goat}", role: "PETTING_ZOO" }, as: Coordinator }
          trigger:
            - { call: "POST /petting-zoo/bookings/${bk_a}/quote", payload: {}, as: Coordinator, captures: { gs_a: $.data.guest_surcharge_cents, qt_a: $.data.quoted_total_cents } }
            - { call: "POST /petting-zoo/bookings/${bk_b}/quote", payload: {}, as: Coordinator, captures: { gs_b: $.data.guest_surcharge_cents, qt_b: $.data.quoted_total_cents } }
          assert:
            - "${gs_a} == 1500 and ${qt_a} == 17740 (50 guests: upper edge of the 21..50 tier)"
            - "${gs_b} == 3500 and ${qt_b} == 19740 (51 guests: lower edge of the 51..100 tier)"

      - name: deposit_rounds_half_up
        claim_type: precision
        grounds: [calculations.deposit_amount]
        distinguishing_aspect: "Half-cent deposits round UP: quoted_total_cents 34375 yields deposit_amount_cents 10313 (0.30 * 34375 = 10312.5 -> 10313, not 10312)."
        test_recipe:
          setup:
            - "Clock 2026-05-10; customer; ZONE_A 10mi GRASS venue; Saturday booking 2026-06-06 14:00-16:00, 30 guests / 0 children / 2 stations, goat 8000c + sheep 9000c + rabbit 4000c attached (all PASS certs)"
          setup_api_calls:
            - { call: "POST /petting-zoo/_clock/set_current_utc", payload: { to_iso8601: "2026-05-10T00:00:00Z" }, as: Operator }
            - { call: "POST /petting-zoo/customers", payload: { email: "ca2@x.com", full_name: "Calc Two", customer_type: "PRIVATE" }, as: Anonymous, captures: { c2: $.data.id } }
            - { call: "POST /petting-zoo/venues", payload: { name: "Greenfield Park", address: "1 Meadow Ln", venue_type: "OUTDOOR", water_access: true, surface_type: "GRASS", travel_zone: "ZONE_A", distance_miles: 10, max_guest_capacity: 100, requires_animal_permit: false, requires_handwash_stations: true }, as: Customer, as_user_id: "${c2}", captures: { v2: $.data.id } }
            - { call: "POST /petting-zoo/animals", payload: { name: "Gogo", species: "GOAT", weight_class: "SMALL", temperament_tier: 3, base_event_fee_cents: 8000 }, as: Operator, captures: { a_goat: $.data.id } }
            - { call: "POST /petting-zoo/animals", payload: { name: "Shelly", species: "SHEEP", weight_class: "MEDIUM", temperament_tier: 2, base_event_fee_cents: 9000 }, as: Operator, captures: { a_sheep: $.data.id } }
            - { call: "POST /petting-zoo/animals", payload: { name: "Bun", species: "RABBIT", weight_class: "SMALL", temperament_tier: 3, base_event_fee_cents: 4000 }, as: Operator, captures: { a_rabbit: $.data.id } }
            - { call: "POST /petting-zoo/animals/${a_goat}/health-records", payload: { exam_date: "2026-05-09T00:00:00Z", result: "PASS", valid_until: "2026-07-01T00:00:00Z" }, as: Veterinarian }
            - { call: "POST /petting-zoo/animals/${a_sheep}/health-records", payload: { exam_date: "2026-05-09T00:00:00Z", result: "PASS", valid_until: "2026-07-01T00:00:00Z" }, as: Veterinarian }
            - { call: "POST /petting-zoo/animals/${a_rabbit}/health-records", payload: { exam_date: "2026-05-09T00:00:00Z", result: "PASS", valid_until: "2026-07-01T00:00:00Z" }, as: Veterinarian }
            - { call: "POST /petting-zoo/bookings", payload: { venue_id: "${v2}", start_time: "2026-06-06T14:00:00Z", end_time: "2026-06-06T16:00:00Z", guest_count: 30, child_guest_count: 0, booking_type: "PRIVATE_PARTY", planned_handwash_stations: 2 }, as: Customer, as_user_id: "${c2}", captures: { bk: $.data.id } }
            - { call: "POST /petting-zoo/bookings/${bk}/animals", payload: { animal_id: "${a_goat}", role: "PETTING_ZOO" }, as: Coordinator }
            - { call: "POST /petting-zoo/bookings/${bk}/animals", payload: { animal_id: "${a_sheep}", role: "PETTING_ZOO" }, as: Coordinator }
            - { call: "POST /petting-zoo/bookings/${bk}/animals", payload: { animal_id: "${a_rabbit}", role: "PETTING_ZOO" }, as: Coordinator }
          trigger:
