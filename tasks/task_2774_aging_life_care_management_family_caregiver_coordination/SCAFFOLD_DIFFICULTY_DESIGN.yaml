            - "ServiceAuthorization.${auth}.coordination_fee_cents == 15200 (TIER_1_PCT 8 selected from base_cost_cents 190000 < 200000)"
            - "ServiceAuthorization.${auth}.total_projected_cost_cents == 205200"
            - "205200 >= TIER_2_CEILING trigger point 200000, yet the fee is NOT 11400 (6% of base), proving the tier was keyed on base_cost_cents"
            - "ServiceAuthorization.${auth}.auth_status == PROPOSED"
            - "ServiceAuthorization.${auth}.coi_status == NOT_REQUIRED and ServiceAuthorization.${auth}.disclosure_text == null"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: assessment_revision_round_cycle_reenters_draft
        grounds:
          - state_machines.Assessment.SUBMITTED_to_REVISION_REQUESTED
          - state_machines.Assessment.REVISION_REQUESTED_to_DRAFT
          - state_machines.Assessment.DRAFT_to_SUBMITTED
          - entities.Assessment.fields.revision_round
          - entities.Assessment.fields.screening_acuity
        distinguishing_aspect: |
          Non-linear shape on Assessment is a CYCLE: DRAFT -> SUBMITTED -> REVISION_REQUESTED ->
          DRAFT -> SUBMITTED re-enters a state it already left, incrementing revision_round to 1 and
          re-stamping screening_acuity from the edited domain_scores (63 on the first pass, 100 on
          the second), which a linear pipeline cannot express.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-03T10:00:00Z."
            - "Care manager Dana (author) and supervisor Iris (reviewer)."
            - "Client Harriet with one DRAFT Assessment whose domain_scores are adl 4, cognition 5, medical_complexity 3, social_support 2, safety 4, finances 1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T10:00:00Z" }
              as: PracticeAdmin
            - call: "POST /care/care-managers"
              payload: { full_name: "Dana Reyes", credential: "CMC", hourly_rate_cents: 22500, is_supervisor: false }
              as: PracticeAdmin
              captures: { cm_dana: $.data.id }
            - call: "POST /care/care-managers"
              payload: { full_name: "Iris Vance", credential: "CCM", hourly_rate_cents: 30000, is_supervisor: true }
              as: PracticeAdmin
              captures: { cm_iris: $.data.id }
            - call: "POST /care/clients"
              payload: { full_name: "Harriet Osei", residence_setting: "ASSISTED_LIVING" }
              as: PracticeAdmin
              captures: { cli: $.data.id }
            - call: "POST /care/assessments"
              payload: { client_id: "${cli}", care_manager_id: "${cm_dana}", domain_scores: { adl: 4, cognition: 5, medical_complexity: 3, social_support: 2, safety: 4, finances: 1 } }
              as: CareManager
              as_user_id: "${cm_dana}"
              captures: { asm: $.data.id }
            - call: "PATCH /care/assessments/${asm}/state"
              payload: { to_state: "SUBMITTED" }
              as: CareManager
              as_user_id: "${cm_dana}"
              captures: { screen_1: $.data.screening_acuity }
          trigger:
            - call: "PATCH /care/assessments/${asm}/state"
              payload: { to_state: "REVISION_REQUESTED", review_note: "Re-score cognition and safety with the neuropsych report." }
              as: PracticeSupervisor
              as_user_id: "${cm_iris}"
            - call: "PATCH /care/assessments/${asm}/state"
              payload: { to_state: "DRAFT" }
              as: CareManager
              as_user_id: "${cm_dana}"
              captures: { rr: $.data.revision_round }
            - call: "PATCH /care/assessments/${asm}"
              payload: { domain_scores: { adl: 5, cognition: 5, medical_complexity: 5, social_support: 5, safety: 5, finances: 5 }, narrative: "Re-scored after neuropsych report." }
              as: CareManager
              as_user_id: "${cm_dana}"
            - call: "PATCH /care/assessments/${asm}/state"
              payload: { to_state: "SUBMITTED" }
              as: CareManager
              as_user_id: "${cm_dana}"
              captures: { screen_2: $.data.screening_acuity }
          assert:
            - "After the first SUBMITTED: Assessment.${asm}.screening_acuity == 63 and Assessment.${asm}.revision_round == 0"
            - "After REVISION_REQUESTED: Assessment.${asm}.status == REVISION_REQUESTED and Assessment.${asm}.reviewed_by_care_manager_id == ${cm_iris}"
            - "After the return to DRAFT: Assessment.${asm}.status == DRAFT and Assessment.${asm}.revision_round == 1"
            - "After the second SUBMITTED: Assessment.${asm}.status == SUBMITTED and Assessment.${asm}.screening_acuity == 100"
            - "Assessment.${asm}.comprehensive_acuity == null (never ACCEPTED in this instance)"
            - "Client.${cli}.acuity_score == 0 (no ACCEPTED assessment exists)"

      - name: service_authorization_parallel_dimensions_evolve_independently
        grounds:
          - state_machines.ServiceAuthorization.PROPOSED_to_AUTHORIZED
          - state_machines.ServiceAuthorization.AUTHORIZED_to_ACTIVE
          - state_machines.ServiceAuthorization.ACTIVE_to_SUSPENDED
          - state_machines.ServiceAuthorization.PENDING_DISCLOSURE_to_DISCLOSED
          - state_machines.ServiceAuthorization.DISCLOSED_to_ACKNOWLEDGED
          - entities.ServiceAuthorization.fields.auth_status
          - entities.ServiceAuthorization.fields.coi_status
          - validations[priority=51]
        distinguishing_aspect: |
          Non-linear shape on a different entity — ServiceAuthorization carries two PARALLEL state
          dimensions on one row: coi_status advances PENDING_DISCLOSURE -> DISCLOSED -> ACKNOWLEDGED
          through its own endpoint while auth_status is still PROPOSED, and the later auth_status
          walk AUTHORIZED -> ACTIVE -> SUSPENDED leaves coi_status frozen at ACKNOWLEDGED, with one
