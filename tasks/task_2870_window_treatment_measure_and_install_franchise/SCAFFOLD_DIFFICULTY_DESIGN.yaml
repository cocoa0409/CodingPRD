              as: Designer
              as_user_id: "${d1}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T09:00:00.000Z" }
              as: Franchisor
              as_user_id: "hq-ops"
          trigger:
            - call: "POST /blinds/sample-checkouts"
              payload: { sample_kit_id: "${k1}", consultation_id: "${c1}", hold_start_at: "2026-08-07T17:00:00.000Z", hold_end_at: "2026-08-09T17:00:00.000Z" }
              as: Designer
              as_user_id: "${d1}"
