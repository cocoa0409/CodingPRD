  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: leak_rate_exactly_at_threshold_opens_event_on_service_record
        grounds:
          - calculations.system_leak_rate_pct
          - entities.RefrigerantSystem.fields.threshold_pct
          - entities.LeakEvent.fields.leak_rate_pct_at_detection
          - state_machines.LeakEvent.NEW_to_OPEN
        distinguishing_aspect: |
          Metric: the leak-rate percentage against threshold_pct, on endpoint
          POST /service-records. The comparison is >= , so 19.9 percent (19.9 lbs
          added to a 100.0 lb system) must NOT open an event while a further 0.1
          lb bringing the trailing-window total to exactly 20.0 percent must open
          one. One tenth of a percentage point separates the two calls and the
          equality case falls on the trigger side; a strictly-greater
          implementation passes the first assertion and fails the second.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z, one store, R-404A, SYS1 (full_charge_lbs 100.0, initial_charge_lbs 80.0, COMMERCIAL_REFRIGERATION so threshold_pct == 20.0, ROLLING_AVERAGE)."
            - "T1 TYPE_II valid, EQ1 certified HIGH verified 2026-06-01, CYL1 with 40.0 lbs of R-404A."
            - "First ADD_REFRIGERANT of 19.9 lbs at 2026-08-01T00:00:00Z (duration 60) takes the charge to 99.9 and the rolling leak rate to 19.9 percent - just under the threshold."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stores"
              payload: { name: "Northgate Market", store_code: "NG-001", state_code: "CA", region: "WEST" }
              as: ComplianceManager
              captures: { store_id: $.data.id }
            - call: "POST /refrigerant-types"
              payload: { name: "R-404A", gwp: 3922, pressure_class: "HIGH", ods_class: "HFC", phasedown_status: "RESTRICTED_NEW_EQUIPMENT" }
              as: ComplianceManager
              captures: { rt404_id: $.data.id }
            - call: "POST /systems"
              payload: { store_id: "${store_id}", refrigerant_type_id: "${rt404_id}", system_category: "COMMERCIAL_REFRIGERATION", full_charge_lbs: 100.0, initial_charge_lbs: 80.0, installed_on: "2025-01-15T00:00:00Z", leak_rate_method: "ROLLING_AVERAGE" }
              as: ComplianceManager
              captures: { sys1_id: $.data.id, sys1_threshold: $.data.threshold_pct }
            - call: "POST /technicians"
              payload: { full_name: "Dana Ruiz", epa_certification_number: "EPA-608-11111", certification_type: "TYPE_II", certification_expires_on: "2027-12-31T00:00:00Z" }
              as: ComplianceManager
              captures: { tech1_id: $.data.id }
            - call: "POST /recovery-equipment"
              payload: { store_id: "${store_id}", assigned_technician_id: "${tech1_id}", equipment_serial: "RM-9001", certified_to_standard: "AHRI_740_2016", certified_for_pressure_class: "HIGH", last_verification_on: "2026-06-01T00:00:00Z" }
              as: ComplianceManager
              captures: { eq1_id: $.data.id }
            - call: "POST /cylinders"
              payload: { store_id: "${store_id}", refrigerant_type_id: "${rt404_id}", cylinder_serial: "CYL-0001", nominal_capacity_lbs: 50.0, initial_contents_lbs: 40.0 }
              as: ComplianceManager
              captures: { cyl1_id: $.data.id }
            - call: "GET /systems/${sys1_id}"
              payload: {}
              as: ComplianceManager
              captures: { sys1_v: $.data.version }
            - call: "POST /service-records"
              payload: { system_id: "${sys1_id}", technician_id: "${tech1_id}", recovery_equipment_id: "${eq1_id}", cylinder_id: "${cyl1_id}", service_type: "ADD_REFRIGERANT", refrigerant_added_lbs: 19.9, performed_at: "2026-08-01T00:00:00Z", duration_minutes: 60, expected_system_version: "${sys1_v}" }
              as: Technician
              as_user_id: "${tech1_id}"
              captures: { rec_under_id: $.data.id, rate_under: $.data.leak_rate_pct_after }
            - call: "GET /leak-events"
              payload: { system_id: "${sys1_id}" }
              as: ComplianceManager
            - call: "GET /systems/${sys1_id}"
              payload: {}
              as: ComplianceManager
              captures: { sys1_v2: $.data.version }
          trigger:
            - call: "POST /service-records"
              payload: { system_id: "${sys1_id}", technician_id: "${tech1_id}", recovery_equipment_id: "${eq1_id}", cylinder_id: "${cyl1_id}", service_type: "ADD_REFRIGERANT", refrigerant_added_lbs: 0.1, performed_at: "2026-08-01T03:00:00Z", duration_minutes: 60, expected_system_version: "${sys1_v2}" }
              as: Technician
              as_user_id: "${tech1_id}"
              captures: { rec_at_id: $.data.id, rate_at: $.data.leak_rate_pct_after }
          assert:
            - "RefrigerantSystem.${sys1_id}.threshold_pct == 20.0"
            - "just below: ServiceRecord.${rec_under_id}.system_charge_after_lbs == 99.9 and leak_rate_pct_after == 19.9"
            - "just below: GET /leak-events?system_id total_count == 0 and Store.${store_id}.compliance_status == COMPLIANT"
            - "exactly at: ServiceRecord.${rec_at_id}.system_charge_after_lbs == 100.0 and leak_rate_pct_after == 20.0"
            - "exactly at: GET /leak-events?system_id total_count == 1"
            - "the opened LeakEvent has leak_rate_pct_at_detection == 20.0, threshold_pct_applied == 20.0, detected_at == 2026-08-01T03:00:00Z, initial_repair_deadline == 2026-08-31T03:00:00Z, triggering_service_record_id == ${rec_at_id}"
            - "Cylinder.${cyl1_id}.current_contents_lbs == 20.0 and Store.${store_id}.compliance_status == AT_RISK"

      - name: zero_day_citation_enumerated_but_contributes_nothing_on_inspection
        grounds:
          - calculations.inspection_penalty_exposure
          - entities.Inspection.fields.citations
          - entities.Inspection.fields.penalty_exposure_usd
          - entities.Inspection.fields.capped
        distinguishing_aspect: |
          A different metric on a different endpoint: the citation-count / day-
          count zero boundary on POST /inspections, not a percentage against a
          threshold. An inspection with an empty citations array and an
          inspection carrying a single MAJOR citation of violation_days == 0 must
          both price to exactly 0.00 with capped == false - the zero-day citation
          is still enumerated and returned in citations, so the count of
          citations and the money are independent. Multiplying the highest
          per-day rate (4500.00) by zero days is the arithmetic that a
          short-circuit or a "no citations means skip" implementation gets wrong.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z, one store with no systems, so compliance_status == COMPLIANT and the multiplier is 1.00."
            - "A first inspection is opened with citations: [] to pin the empty-collection case."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stores"
              payload: { name: "Northgate Market", store_code: "NG-001", state_code: "CA", region: "WEST" }
              as: ComplianceManager
              captures: { store_id: $.data.id, posture: $.data.compliance_status }
            - call: "POST /inspections"
              payload: { store_id: "${store_id}", inspector_name: "CARB Field Office", citations: [] }
              as: Regulator
              as_user_id: "regulator-1"
              captures: { insp_empty_id: $.data.id, insp_empty_penalty: $.data.penalty_exposure_usd }
          trigger:
            - call: "POST /inspections"
              payload: { store_id: "${store_id}", inspector_name: "CARB Field Office", citations: [ { citation_code: "608-ADMIN-OBSERVATION", severity: "MAJOR", violation_days: 0 } ] }
              as: Regulator
              as_user_id: "regulator-1"
              captures: { insp_zero_id: $.data.id, insp_zero_penalty: $.data.penalty_exposure_usd }
          assert:
            - "Store.${store_id}.compliance_status == COMPLIANT"
            - "Inspection.${insp_empty_id}.penalty_exposure_usd == 0.00, capped == false, chronic_multiplier_applied == 1.00"
            - "Inspection.${insp_zero_id}.penalty_exposure_usd == 0.00 and capped == false"
            - "Inspection.${insp_zero_id}.citations has length 1 with severity MAJOR and violation_days 0 (enumerated, not dropped)"
            - "Inspection.${insp_zero_id}.status == OPEN and response_deadline == 2026-08-31T00:00:00Z"
            - "Store.${store_id}.penalty_exposure_total_usd == 0.00"

      - name: extension_total_exactly_at_thirty_day_cap_approves_thirty_first_day_rejected
        grounds:
          - calculations.extension_day_budget
          - validations[priority=37]
          - errors[ERR_EXTENSION_DAY_CAP_EXCEEDED]
          - entities.LeakEvent.fields.extension_days_remaining
        distinguishing_aspect: |
          A third metric on a third endpoint: the cumulative statutory day budget
          on POST /extension-requests/{id}/decision. The check is "post-approval
          total must not exceed 30", so approving a second grant that brings the
          total to exactly 30 must succeed and leave extension_days_remaining at
          0, while a further approval of a single day (total 31) must fail with
          ERR_EXTENSION_DAY_CAP_EXCEEDED. The boundary is on the aggregate, not
          on any one request, so an implementation that only bounds each
          requested_days individually approves all three.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z, one store, R-404A, SYS_E (full 60.0, initial 0.0)."
            - "A manually declared LeakEvent E1 (MANUAL_INSPECTION, detected_at 2026-08-01T00:00:00Z) with initial_repair_deadline 2026-08-31T00:00:00Z."
            - "ER1 for 20 days is approved, moving repair_deadline to 2026-09-20T00:00:00Z with extension_days_remaining 10."
            - "ER2 for 10 days and ER3 for 1 day are filed while the repair_deadline is still in the future."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stores"
              payload: { name: "Northgate Market", store_code: "NG-001", state_code: "CA", region: "WEST" }
              as: ComplianceManager
              captures: { store_id: $.data.id }
            - call: "POST /refrigerant-types"
              payload: { name: "R-404A", gwp: 3922, pressure_class: "HIGH", ods_class: "HFC", phasedown_status: "RESTRICTED_NEW_EQUIPMENT" }
              as: ComplianceManager
              captures: { rt404_id: $.data.id }
            - call: "POST /systems"
              payload: { store_id: "${store_id}", refrigerant_type_id: "${rt404_id}", system_category: "COMMERCIAL_REFRIGERATION", full_charge_lbs: 60.0, initial_charge_lbs: 0.0, installed_on: "2025-03-01T00:00:00Z", leak_rate_method: "ROLLING_AVERAGE" }
              as: ComplianceManager
              captures: { syse_id: $.data.id }
            - call: "POST /leak-events"
              payload: { system_id: "${syse_id}", detected_at: "2026-08-01T00:00:00Z", detection_method: "MANUAL_INSPECTION" }
              as: ComplianceManager
              captures: { event_id: $.data.id, initial_deadline: $.data.initial_repair_deadline }
            - call: "POST /extension-requests"
              payload: { leak_event_id: "${event_id}", reason_code: "PARTS_UNAVAILABLE", requested_days: 20, justification: "compressor rack valve on national backorder" }
              as: ComplianceManager
              captures: { er1_id: $.data.id, er1_deadline_before: $.data.deadline_before }
            - call: "POST /extension-requests/${er1_id}/decision"
              payload: { decision: "APPROVE", granted_days: 20 }
              as: Regulator
              as_user_id: "regulator-1"
              captures: { er1_deadline_after: $.data.deadline_after }
            - call: "POST /extension-requests"
              payload: { leak_event_id: "${event_id}", reason_code: "SUPPLY_CHAIN_DELAY", requested_days: 10, justification: "replacement rack delayed at port" }
              as: ComplianceManager
              captures: { er2_id: $.data.id }
            - call: "POST /extension-requests"
              payload: { leak_event_id: "${event_id}", reason_code: "SUPPLY_CHAIN_DELAY", requested_days: 1, justification: "one final day for the crane crew" }
              as: ComplianceManager
              captures: { er3_id: $.data.id }
          trigger:
            - call: "POST /extension-requests/${er2_id}/decision"
              payload: { decision: "APPROVE", granted_days: 10 }
              as: Regulator
              as_user_id: "regulator-1"
              captures: { er2_status: $.data.status, er2_deadline_after: $.data.deadline_after }
            - call: "POST /extension-requests/${er3_id}/decision"
              payload: { decision: "APPROVE", granted_days: 1 }
              as: Regulator
              as_user_id: "regulator-1"
              captures: { er3_err: $.data.error_id }
          assert:
            - "after ER1: LeakEvent.${event_id}.extension_days_granted_total == 20, extension_days_remaining == 10, repair_deadline == 2026-09-20T00:00:00Z"
            - "exactly at the cap: ExtensionRequest.${er2_id}.status == APPROVED with granted_days == 10 and deadline_after == 2026-09-30T00:00:00Z"
            - "exactly at the cap: LeakEvent.${event_id}.extension_days_granted_total == 30 and extension_days_remaining == 0"
            - "one day past the cap: HTTP 422 with error_id == ERR_EXTENSION_DAY_CAP_EXCEEDED"
            - "ExtensionRequest.${er3_id}.status == PENDING (the rejected decision does not transition it)"
            - "LeakEvent.${event_id}.repair_deadline == 2026-09-30T00:00:00Z (unchanged by the rejected approval)"
            - "LeakEvent.${event_id}.initial_repair_deadline == 2026-08-31T00:00:00Z throughout"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: service_record_blocked_by_suspended_technician_state
        grounds:
          - state_machines.Technician.ACTIVE_to_SUSPENDED
          - state_machines.Technician.SUSPENDED_to_ACTIVE
          - validations[priority=14]
          - errors[ERR_TECHNICIAN_SUSPENDED]
        distinguishing_aspect: |
          Entity pair (ServiceRecord, Technician): whether a ServiceRecord may be
          written depends on a state field of a completely different entity that
          the payload only references. Suspending T1 changes nothing about the
          system, the equipment or the cylinder, yet the identical payload flips
          from 201 to 422 ERR_TECHNICIAN_SUSPENDED and back to 201 after
          reinstatement, so the dependency is on live Technician.status and not
          on anything cached at reference time.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z, one store, R-404A, SYS1 (full 100.0, initial 80.0), T1 TYPE_II valid, EQ1 certified HIGH, CYL1 with 40.0 lbs."
            - "T1 is suspended with reason_code CERT_UNDER_REVIEW, so Technician.status == SUSPENDED and suspension_reason_code == CERT_UNDER_REVIEW."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stores"
              payload: { name: "Northgate Market", store_code: "NG-001", state_code: "CA", region: "WEST" }
              as: ComplianceManager
              captures: { store_id: $.data.id }
            - call: "POST /refrigerant-types"
              payload: { name: "R-404A", gwp: 3922, pressure_class: "HIGH", ods_class: "HFC", phasedown_status: "RESTRICTED_NEW_EQUIPMENT" }
              as: ComplianceManager
              captures: { rt404_id: $.data.id }
            - call: "POST /systems"
              payload: { store_id: "${store_id}", refrigerant_type_id: "${rt404_id}", system_category: "COMMERCIAL_REFRIGERATION", full_charge_lbs: 100.0, initial_charge_lbs: 80.0, installed_on: "2025-01-15T00:00:00Z", leak_rate_method: "ROLLING_AVERAGE" }
              as: ComplianceManager
              captures: { sys1_id: $.data.id }
            - call: "POST /technicians"
              payload: { full_name: "Dana Ruiz", epa_certification_number: "EPA-608-11111", certification_type: "TYPE_II", certification_expires_on: "2027-12-31T00:00:00Z" }
              as: ComplianceManager
              captures: { tech1_id: $.data.id }
            - call: "POST /recovery-equipment"
              payload: { store_id: "${store_id}", assigned_technician_id: "${tech1_id}", equipment_serial: "RM-9001", certified_to_standard: "AHRI_740_2016", certified_for_pressure_class: "HIGH", last_verification_on: "2026-06-01T00:00:00Z" }
              as: ComplianceManager
              captures: { eq1_id: $.data.id }
            - call: "POST /cylinders"
              payload: { store_id: "${store_id}", refrigerant_type_id: "${rt404_id}", cylinder_serial: "CYL-0001", nominal_capacity_lbs: 50.0, initial_contents_lbs: 40.0 }
              as: ComplianceManager
              captures: { cyl1_id: $.data.id }
            - call: "POST /technicians/${tech1_id}/status-change"
              payload: { new_status: "SUSPENDED", reason_code: "CERT_UNDER_REVIEW" }
              as: ComplianceManager
              captures: { tech1_status: $.data.status, tech1_reason: $.data.suspension_reason_code }
            - call: "GET /systems/${sys1_id}"
              payload: {}
              as: ComplianceManager
              captures: { sys1_v: $.data.version }
          trigger:
            - call: "POST /service-records"
              payload: { system_id: "${sys1_id}", technician_id: "${tech1_id}", recovery_equipment_id: "${eq1_id}", cylinder_id: "${cyl1_id}", service_type: "ADD_REFRIGERANT", refrigerant_added_lbs: 10.0, performed_at: "2026-08-01T00:00:00Z", duration_minutes: 60, expected_system_version: "${sys1_v}" }
              as: Technician
              as_user_id: "${tech1_id}"
              captures: { err_id: $.data.error_id }
            - call: "POST /technicians/${tech1_id}/status-change"
              payload: { new_status: "ACTIVE", reason_code: "CERT_REVIEW_CLEARED" }
              as: ComplianceManager
              captures: { tech1_status_after: $.data.status }
            - call: "POST /service-records"
              payload: { system_id: "${sys1_id}", technician_id: "${tech1_id}", recovery_equipment_id: "${eq1_id}", cylinder_id: "${cyl1_id}", service_type: "ADD_REFRIGERANT", refrigerant_added_lbs: 10.0, performed_at: "2026-08-01T00:00:00Z", duration_minutes: 60, expected_system_version: "${sys1_v}" }
              as: Technician
              as_user_id: "${tech1_id}"
              captures: { rec_id: $.data.id }
          assert:
            - "while SUSPENDED: HTTP 422 with error_id == ERR_TECHNICIAN_SUSPENDED"
            - "while SUSPENDED: RefrigerantSystem.${sys1_id}.current_charge_lbs == 80.0 and version == ${sys1_v} (nothing written)"
            - "Technician.${tech1_id}.suspension_reason_code == CERT_UNDER_REVIEW while suspended, null after reinstatement"
            - "after reinstatement the identical payload returns 201: ServiceRecord.${rec_id}.system_charge_after_lbs == 90.0 and leak_rate_pct_after == 10.0"
            - "no LeakEvent is opened (10.0 percent is below threshold_pct 20.0) and Store.${store_id}.compliance_status == COMPLIANT"
            - "Cylinder.${cyl1_id}.current_contents_lbs == 30.0"

      - name: system_retirement_blocked_by_non_terminal_leak_event_state
        grounds:
          - validations[priority=44]
          - errors[ERR_OPEN_LEAK_EVENT_BLOCKS_RETIREMENT]
          - state_machines.RefrigerantSystem.ACTIVE_to_RETIRED
          - state_machines.RetrofitPlan.SUBMITTED_to_APPROVED
          - entities.LeakEvent.fields.status
        distinguishing_aspect: |
          A different entity pair (RefrigerantSystem, LeakEvent) with a
          three-entity escape hatch: the retirement of a fully recovered system
          is refused while any LeakEvent on it is non-terminal, and the only way
          to proceed is for a third entity - an APPROVED or IN_PROGRESS
          RetrofitPlan of plan_type RETIRE - to exist. The same call therefore
          fails and then succeeds with no change to the system or the leak event,
          only to the plan's state.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z, one store, R-404A, SYS_R (full 60.0, initial 0.0, installed 2025-03-01) so current_charge_lbs == 0.0 and the charge precondition is satisfied."
            - "A manually declared LeakEvent E1 (MANUAL_INSPECTION, detected_at 2026-08-01T00:00:00Z) is OPEN."
            - "A RETIRE plan is created and submitted but left in SUBMITTED for the first attempt."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stores"
              payload: { name: "Northgate Market", store_code: "NG-001", state_code: "CA", region: "WEST" }
              as: ComplianceManager
              captures: { store_id: $.data.id }
            - call: "POST /refrigerant-types"
              payload: { name: "R-404A", gwp: 3922, pressure_class: "HIGH", ods_class: "HFC", phasedown_status: "RESTRICTED_NEW_EQUIPMENT" }
              as: ComplianceManager
              captures: { rt404_id: $.data.id }
            - call: "POST /systems"
              payload: { store_id: "${store_id}", refrigerant_type_id: "${rt404_id}", system_category: "COMMERCIAL_REFRIGERATION", full_charge_lbs: 60.0, initial_charge_lbs: 0.0, installed_on: "2025-03-01T00:00:00Z", leak_rate_method: "ROLLING_AVERAGE" }
              as: ComplianceManager
              captures: { sysr_id: $.data.id }
            - call: "POST /leak-events"
