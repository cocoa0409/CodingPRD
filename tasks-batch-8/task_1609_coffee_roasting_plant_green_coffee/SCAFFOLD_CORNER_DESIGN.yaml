              as: Trader
              captures: { c_df: $.data.id }
            - call: "POST /roastery/contracts/${c_df}/shipments"
              payload: { shipment_ref: "SH-DF", planned_lbs: 2000, scheduled_arrival: "2026-09-01T00:00:00Z" }
              as: LogisticsCoordinator
              captures: { sh_df: $.data.id }
            - call: "POST /roastery/shipments/${sh_df}/depart"
              as: LogisticsCoordinator
            - call: "POST /roastery/shipments/${sh_df}/arrive"
              as: LogisticsCoordinator
            - call: "POST /roastery/shipments/${sh_df}/receive"
              payload: { received_lbs: 2000, lot_code: "L-DF", moisture_pct: 11, warehouse_location: "WH-A" }
              as: WarehouseClerk
            - call: "POST /roastery/cupping-sessions"
              payload: { subject_kind: "GREEN_LOT", subject_id: "${sh_df}", panelist_count: 3, score_aroma: 8.5, score_flavor: 8.5, score_aftertaste: 8.5, score_acidity: 8.5, score_body: 8.5, score_balance: 8.5, score_uniformity: 10, score_clean_cup: 10, score_sweetness: 10, score_overall: 8.5, defects_subtracted: 0 }
              as: QAGrader
              captures: { cup_df: $.data.id }
            - call: "POST /roastery/cupping-sessions/${cup_df}/finalize"
              as: QAGrader
              as_user_id: "qa-001"
            - call: "POST /roastery/roast-profiles"
              payload: { profile_code: "RP-DF", charge_temp_c: 200, target_drop_temp_c: 210, expected_yield_loss_pct: 0.16, shrinkage_alert_band_pct: 0.02 }
              as: HeadRoaster
              captures: { rp_df: $.data.id }
            - call: "POST /roastery/products"
              payload: { sku: "P-DF", display_name: "DF P", channel: "WHOLESALE", target_roast_profile_id: "${rp_df}", freshness_days: 30 }
              as: HeadRoaster
              captures: { prod_df: $.data.id, prod_df_v0: $.data.version }
            - call: "POST /roastery/products/${prod_df}/recipes"
              as: HeadRoaster
              captures: { r_df: $.data.id }
            - call: "POST /roastery/recipes/${r_df}/components"
              payload: { required_grade: "SHB", component_pct: 1.0 }
              as: HeadRoaster
            - call: "POST /roastery/recipes/${r_df}/approve"
              payload: { expected_product_version: "${prod_df_v0}" }
              as: HeadRoaster
            - call: "GET /roastery/warehouse-position"
              as: Trader
              captures: { df_pos_before: $.data.open_to_sell_lbs }
            - call: "POST /roastery/roast-batches"
              payload: { product_id: "${prod_df}", recipe_id: "${r_df}", scheduled_green_lbs: 700 }
              as: RoastOperator
              captures: { b_df: $.data.id }
            - call: "GET /roastery/warehouse-position"
              as: Trader
              captures: { df_pos_mid: $.data.open_to_sell_lbs }
          trigger:
            - call: "POST /roastery/roast-batches/${b_df}/void"
              as: RoastOperator
            - call: "GET /roastery/warehouse-position"
              as: Trader
              captures: { df_pos_after: $.data.open_to_sell_lbs }
          assert:
            - "df_pos_before == 2000"
            - "df_pos_mid == 1300 (700 committed)"
            - "df_pos_after == 2000 (void reconciles derived field immediately, same request boundary)"

