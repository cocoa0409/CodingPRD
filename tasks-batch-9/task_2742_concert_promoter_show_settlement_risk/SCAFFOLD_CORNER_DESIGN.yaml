            - call: "POST /budget-lines"
              payload: { show_id: "${cc_shy_id}", category: "PRODUCTION", description: "Stage package", budgeted_cents: 200000, is_artist_deductible: false }
              as: TourAccountant
              captures: { cc_bly_id: $.data.id }
            - call: "POST /vendor-invoices"
              payload: { show_id: "${cc_shy_id}", budget_line_id: "${cc_bly_id}", vendor_name: "Stage Supply", amount_cents: 200000, invoice_date: "2026-08-01T00:00:00.000Z", documentation_ref: "PKT-Y-01" }
              as: TourAccountant
              captures: { cc_viy_id: $.data.id }
            - call: "POST /vendor-invoices/${cc_viy_id}/verify"
              payload: {}
              as: TourAccountant
              as_user_id: "u_acct_y_verify"
            - call: "POST /vendor-invoices/${cc_viy_id}/approve"
              payload: {}
              as: TourAccountant
              as_user_id: "u_acct_y_approve"
            - call: "POST /ticket-tiers"
              payload: { show_id: "${cc_shy_id}", tier_name: "GA", price_cents: 5000, allocation_qty: 200 }
              as: TalentBuyer
              captures: { cc_tty_id: $.data.id }
            - call: "POST /shows/${cc_shy_id}/on-sale"
