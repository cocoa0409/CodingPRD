        claim_type: violation_to_error
        grounds: ["validations[priority=12]", "errors[ERR_AVAILABILITY_WINDOW]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / availability_window_exclusive_end
          rationale: "Exclusive-end availability exclusion is asserted by the named §1.8 instance."

      - name: dispute_invalid_error_excluded
        claim_type: violation_to_error
        grounds: ["validations[priority=16]", "errors[ERR_DISPUTE_INVALID]"]
        excluded_because:
          difficulty_instance: transitive_cascade / genre_reclassification_reentry_cascade
          rationale: "The GENRE-chart dispute happy path (filing, review, RECLASSIFY resolution with matching new_genre_tag) is exercised end-to-end by the named §1.8 instance; the MAIN-chart/claimed-genre-equals-current rejection branches are trivially rejected by the same validation row."

