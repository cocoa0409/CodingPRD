      - name: hr_partner_owns_training_assignment_and_separation_end_to_end
        claim_type: can_perform_own_operations
        grounds:
          - roles.HRPartner.exclusive_operations
          - roles.HRPartner.shared_operations
          - validations[priority=7]
          - concurrency_rules[training-assignment-create-stale-employee]
          - endpoints[POST /training-assignments]
          - endpoints[POST /training-assignments/{training_assignment_id}/complete]
          - endpoints[POST /employees/{employee_id}/separate]
        distinguishing_aspect: |
          HRPartner exercises both of its exclusive operations and the one shared operation where it is
          explicitly exempt from the ownership rule: it assigns training, completes that assignment on
          another employee's behalf without tripping ERR_NOT_RESOURCE_OWNER, and then separates that
          employee.
        test_recipe:
          setup:
            - "Logical clock pinned to 2026-08-01T00:00:00Z."
            - "Worksite \"North Plant\" with one WorkArea \"Front Desk\"."
            - "Two Employees: \"Priya Nair\" (SECURITY) backing the HRPartner role and \"Wendy Cole\" (ADMIN) at version 1 with training_current false."
            - "One TrainingModule WVP-ADMIN (job_function_scope [\"ADMIN\"], refresh_interval_days 365, passing_score 80)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /worksites"
              payload: { name: "North Plant", state_code: "CA", employee_count: 20 }
              as: ProgramAdmin
              captures: { ws_id: $.data.id }
            - call: "POST /work-areas"
              payload: { worksite_id: "${ws_id}", name: "Front Desk", job_function: "CASH_HANDLING", public_access_flag: true, lone_worker_flag: false, night_shift_flag: true, occupancy_cap: 8 }
              as: ProgramAdmin
              captures: { wa_front_id: $.data.id }
            - call: "POST /employees"
              payload: { worksite_id: "${ws_id}", work_area_id: "${wa_front_id}", full_name: "Priya Nair", job_function: "SECURITY" }
              as: ProgramAdmin
              captures: { hr_id: $.data.id }
            - call: "POST /employees"
              payload: { worksite_id: "${ws_id}", work_area_id: "${wa_front_id}", full_name: "Wendy Cole", job_function: "ADMIN" }
              as: ProgramAdmin
              captures: { w1_id: $.data.id, w1_id_v: $.data.version }
            - call: "POST /training-modules"
              payload: { code: "WVP-ADMIN", job_function_scope: ["ADMIN"], scenario_set_version: "2026.1", refresh_interval_days: 365, passing_score: 80, required_for_escort: false }
              as: ProgramAdmin
              captures: { mod_adm_id: $.data.id }
