            - "Trigger 7: water_reserved_af == 0.884, water_used_af == 0.000, water_right_remaining_af == 249.116, aborted_session_count == 1 and completed_session_count == 0."
            - "Trigger 8: the fresh GET is required because each accepted create increments the TerrainArea version; reusing ${ta_v1} here would be rejected with ERR_STALE_TERRAIN_AREA_VERSION."
            - "Trigger 9: HTTP 201 with water_af_reserved == 0.442 (1200 * 120 / 325851 == 0.44190... -> 0.442)."
            - "Trigger 10: S2 is STILL 'SCHEDULED' with abort_reason null - [12:00, 14:00) only touches [06:00, 10:00) at no point at all, so nothing was superseded."
            - "Trigger 11: water_reserved_af == 1.326 (0.884 + 0.442) and water_right_remaining_af == 248.674, so the refund of S1 is permanent and exact."

      - name: check_in_advances_the_reservation_without_moving_a_single_day_counter
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /mountain-ops/access-reservations/{id}/check-in]
          - state_machines.AccessReservation.CONFIRMED_to_CHECKED_IN
          - calculations.admission_allocation
          - errors[ERR_WORKFLOW_STATE_INVALID]
        distinguishing_aspect: |
          CHECKED_IN is counted by admission_allocation exactly like CONFIRMED, so a check-in must be
          observably inert on the DayPlan: admitted_guest_count, non_season_admitted_count and
          parking_stalls_used must all be unchanged and the DayPlan version must not move, while the
          reservation itself advances and stamps checked_in_at. The endpoint is also not idempotent - a
          second check-in is a workflow-state error - and the later release must still restore the
          counters from CHECKED_IN, which is the branch an implementation that only compensates CONFIRMED
          rows gets wrong.
        test_recipe:
          setup:
            - "A season OPERATING with a PUBLISHED_FULL day plan: guest_capacity 918, non_season_pool 642, parking_stalls_total 500, no reservations yet."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: MountainOpsDirector
