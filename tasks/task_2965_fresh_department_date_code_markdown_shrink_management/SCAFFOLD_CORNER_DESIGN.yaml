            - "GET /fresh/items?department_id=${dept_deli} returns total_count == 1 and data[0].id == ${item_deli}"

      - name: priority_ordering_state_check_precedes_the_fiscal_check
        claim_type: priority_ordering
        grounds:
          - validations[priority 8]
          - validations[priority 42]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / state_before_fiscal_on_withdrawn_lot_override_markdown
          rationale: "That §1.8 instance arms both rows on one request and asserts only the priority-8 error surfaces."

      - name: priority_conflict_safety_check_precedes_the_referential_check
