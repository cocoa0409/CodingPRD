scenario: |
  Beekeeping & Pollination Service (Apiary): hive/colony & yard location, inspection & health
  (mite count/treatment), honey harvest & lot/extraction, pollination contract & hive placement
  (almond), queen/nuc sales, feeding & overwinter loss, state apiary registration, requeening schedule。

domain_name: beekeeping-apiary
api_prefix: "/"
# Flat/hybrid topology: multiple top-level peer collections (/apiaries, /hives, /honey-lots,
# /pollination-contracts, /hive-placements, /harvests, /queen-nuc-sales, /treatments,
# /requeen-schedules) rather than a single nested root, so the API prefix is the bare root.

complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - scheduled_actions

  entity_topology: hybrid
  # Apiary is a small tree root (Apiary -> StateRegistration, Apiary -> Hive); Hive carries
  # cross-cutting flat FK associations to PollinationContract (via HivePlacement) and to HoneyLot
  # (via Harvest contributions). Self-referential Hive.source_hive_id for nuc splits.

  state_machine_shape: parallel
  # Hive carries two INDEPENDENT state axes (health_status × queen_status). PollinationContract is
  # cyclic (DISPUTED -> PLACED revision loop). HoneyLot and HivePlacement are linear with reverts.

  relationship_patterns:
    - one_to_many        # Apiary -> Hive; Hive -> Inspection; Hive -> Treatment; HoneyLot -> Harvest
    - self_referential   # Hive.source_hive_id references the parent colony a nuc was split from
    - cross_aggregate    # HivePlacement links a Hive (apiary aggregate) to a PollinationContract (contract aggregate)

  role_model: peer_roles
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Apiary
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Human-readable yard name.
      - name: state_code
        type: string
        source: input
        description: US state two-letter code where the yard physically sits; drives registration jurisdiction.
        constraints: 2-letter uppercase enum-like code, e.g. CA, OR, ND.
      - name: latitude
        type: number
        source: input
        description: Yard latitude in decimal degrees.
      - name: longitude
        type: number
        source: input
        description: Yard longitude in decimal degrees.
      - name: registration_status
        type: enum
        source: computed
        description: Mirror of the apiary's current StateRegistration lifecycle; UNREGISTERED until an approved registration exists.
        default: UNREGISTERED
        constraints: "one of {UNREGISTERED, PENDING, ACTIVE, EXPIRED}"
      - name: active_colony_count
        type: integer
        source: computed
        description: Count of Hive rows with apiary_id == this.id AND health_status != DEADOUT. Conserved quantity for the colony-conservation invariant.
        default: 0
      - name: max_yard_colonies
        type: integer
        source: input
        description: Maximum number of non-DEADOUT colonies this yard may hold; placement returns and nuc voids that would exceed it are rejected.
        constraints: integer >= 1

  - name: StateRegistration
    parent: Apiary
    common_fields: true
    fields:
      - name: apiary_id
        type: string
        source: input
        description: "FK -> Apiary.id; the yard this registration covers."
      - name: registration_number
        type: string
        source: input
        description: State-issued apiary registration number.
      - name: status
        type: enum
        source: computed
        description: Registration lifecycle.
        default: PENDING
        constraints: "one of {PENDING, ACTIVE, EXPIRED, REVOKED}"
      - name: effective_date
        type: datetime
        source: input
        description: First day the registration is valid (inclusive). ISO 8601 UTC.
      - name: expiry_date
        type: datetime
        source: input
        description: Instant the registration ceases to be valid (exclusive half-open upper bound). ISO 8601 UTC.

  - name: Hive
    parent: Apiary
    common_fields: true
    fields:
      - name: apiary_id
        type: string
        source: input
        description: "FK -> Apiary.id; the yard this colony lives in."
      - name: source_hive_id
        type: string
        source: input
        description: "FK -> Hive.id; the parent colony this hive was split from as a nuc, or null for a wild/purchased colony."
      - name: tag
        type: string
        source: input
        description: Physical hive tag/label, unique within the apiary.
      - name: health_status
        type: enum
        source: computed
        description: Health axis of the parallel state machine; evolves independently of queen_status.
        default: HEALTHY
        constraints: "one of {HEALTHY, TREATMENT, QUARANTINE, DEADOUT}"
      - name: queen_status
        type: enum
        source: computed
        description: Queen axis of the parallel state machine; evolves independently of health_status.
        default: QUEENRIGHT
        constraints: "one of {QUEENRIGHT, QUEENLESS, REQUEENING}"
      - name: brood_frames
        type: integer
        source: input
        description: Current count of frames containing brood; used for strength scoring and split conservation.
        default: 0
        constraints: integer >= 0
      - name: honey_frames
        type: integer
        source: computed
        description: Capped-honey frames observed at the latest inspection (written from Inspection.honey_frames_observed). A strength-scoring input only; Harvest records weight and does NOT debit this field.
        default: 0
        constraints: integer >= 0
      - name: last_mite_count
        type: number
        source: computed
        description: Most recent Inspection.mites_per_100_bees for this hive (latest by Inspection.created_at), or null.
      - name: harvest_blocked_until
        type: datetime
        source: computed
        description: Instant (exclusive) before which honey may not be harvested from this hive due to a treatment chemical-withdrawal window; null when unblocked.
      - name: inspection_strength
        type: integer
        source: computed
        description: Point-in-time colony strength score from the latest Inspection (0-100). See colony_strength_scoring calc, variant point_in_time.

  - name: Inspection
    parent: Hive
    common_fields: false
    fields:
      - name: hive_id
        type: string
        source: input
        description: "FK -> Hive.id; the colony inspected."
      - name: inspected_at
        type: datetime
        source: input
        description: Instant of the inspection (ISO 8601 UTC). Used to order inspections chronologically.
      - name: mites_per_100_bees
        type: number
        source: input
        description: Varroa mite load measured as mites per 100 bees (alcohol-wash result).
        constraints: number >= 0
      - name: brood_frames_observed
        type: integer
        source: input
        description: Frames of brood observed; written through to Hive.brood_frames on inspection.
        constraints: integer >= 0
      - name: honey_frames_observed
        type: integer
        source: input
        description: Capped-honey frames observed; written through to Hive.honey_frames on inspection. Strength-scoring input.
        default: 0
        constraints: integer >= 0
      - name: queen_seen
        type: boolean
        source: input
        description: Whether the queen was observed laying during this inspection.
      - name: treatment_recommended
        type: boolean
        source: computed
        description: True iff mites_per_100_bees >= MITE_TREATMENT_THRESHOLD (3.0). Boundary-precision flag.

  - name: Treatment
    parent: Hive
    common_fields: true
    fields:
      - name: hive_id
        type: string
        source: input
        description: "FK -> Hive.id; the colony being treated for mites."
      - name: product
        type: enum
        source: input
        description: Miticide product applied; determines withdrawal days.
        constraints: "one of {APIVAR, FORMIC_PRO, OXALIC_ACID}"
      - name: status
        type: enum
        source: computed
        description: Treatment lifecycle.
        default: ACTIVE
        constraints: "one of {ACTIVE, COMPLETED, VOIDED}"
      - name: applied_at
        type: datetime
        source: input
        description: Instant treatment was applied (ISO 8601 UTC).
      - name: duration_days
        type: integer
        source: input
        description: Days the product remains on the hive before removal.
        constraints: integer >= 1
      - name: withdrawal_days
        type: integer
        source: computed
        description: Chemical residue withdrawal days for the product (APIVAR 14, FORMIC_PRO 0, OXALIC_ACID 0).
      - name: harvest_clear_at
        type: datetime
        source: computed
        description: applied_at + duration_days + withdrawal_days (days). Hive.harvest_blocked_until is set to the max of this across ACTIVE treatments.

  - name: HoneyLot
    parent: null
    common_fields: true
    fields:
      - name: apiary_id
        type: string
        source: input
        description: "FK -> Apiary.id; the yard the lot is extracted at."
      - name: lot_code
        type: string
        source: input
        description: Extraction lot code, unique per apiary.
      - name: floral_source
        type: enum
        source: input
        description: Declared floral source for the lot.
        constraints: "one of {WILDFLOWER, ALMOND, CLOVER, ORANGE_BLOSSOM}"
      - name: status
        type: enum
        source: computed
        description: Extraction lot lifecycle. BLOCKED is entered when a contributing hive becomes harvest-blocked.
        default: DRAFT
        constraints: "one of {DRAFT, BLOCKED, EXTRACTED, SOLD, VOIDED}"
      - name: provisional_yield_kg
        type: number
        source: computed
        description: Estimated yield from RECORDED harvest frames_pulled at draft time. See honey_yield calc, variant provisional.
        default: 0
      - name: final_yield_kg
        type: number
        source: computed
        description: Measured net yield after extraction settling. See honey_yield calc, variant final. Null until EXTRACTED.
      - name: gross_weight_kg
        type: number
        source: computed
        description: Running sum of all non-VOIDED Harvest.weight_kg contributions for this lot. Conserved quantity for honey-mass invariant.
        default: 0
      - name: price_per_kg_cents
        type: integer
        source: input
        description: Sale price per kg in cents, set when the lot is sold.
        default: 0
        constraints: integer >= 0
      - name: gross_revenue_cents
        type: integer
        source: computed
        description: round_half_up(final_yield_kg * price_per_kg_cents); set at sale. See honey_revenue calc. Null until SOLD.
      - name: net_revenue_cents
        type: integer
        source: computed
        description: gross_revenue_cents minus the volume discount keyed on its own tier; set at sale. See honey_revenue calc. Null until SOLD.

  - name: Harvest
    parent: HoneyLot
    common_fields: true
    fields:
      - name: lot_id
        type: string
        source: input
        description: "FK -> HoneyLot.id; the extraction lot this contribution rolls into."
      - name: hive_id
        type: string
        source: input
        description: "FK -> Hive.id; the colony supers were pulled from."
      - name: frames_pulled
        type: integer
        source: input
        description: Number of capped-honey frames pulled from the hive.
        constraints: integer >= 1
      - name: weight_kg
        type: number
        source: input
        description: Net capped-honey weight pulled in this contribution.
        constraints: number > 0
      - name: status
        type: enum
        source: computed
        description: Contribution lifecycle. VOID reverses the lot/hive debits.
        default: RECORDED
        constraints: "one of {RECORDED, VOID}"

  - name: PollinationContract
    parent: null
    common_fields: true
    fields:
      - name: grower_name
        type: string
        source: input
        description: Almond grower / orchard the hives pollinate.
      - name: orchard_state_code
        type: string
        source: input
        description: State the orchard sits in (almond bloom is California-centric, but kept general).
        constraints: 2-letter uppercase code.
      - name: bloom_start
        type: datetime
        source: input
        description: Start of the contracted bloom window (inclusive). ISO 8601 UTC.
      - name: bloom_end
        type: datetime
        source: input
        description: End of the contracted bloom window (exclusive half-open upper bound). ISO 8601 UTC.
      - name: required_strong_hives
        type: integer
        source: input
        description: Number of CONTRACT-GRADE strong hives the grower contracts for.
        constraints: integer >= 1
      - name: max_hives_on_site
        type: integer
        source: input
        description: Aggregate cap on hives physically on the orchard site during any overlapping placement window.
        constraints: integer >= 1
      - name: base_rate_cents
        type: integer
        source: input
        description: Base per-hive pollination rate in cents for a CONTRACT-GRADE hive.
        constraints: integer >= 0
      - name: status
        type: enum
        source: computed
        description: Contract lifecycle; cyclic via DISPUTED -> PLACED.
        default: DRAFT
        constraints: "one of {DRAFT, SIGNED, PLACED, UNDERSTAFFED, FULFILLED, DISPUTED, CANCELLED}"
      - name: placed_strong_hives
        type: integer
        source: computed
        description: Count of CONTRACT-GRADE hives currently in CONFIRMED placements on this contract.
        default: 0
      - name: projected_payout_cents
        type: integer
        source: computed
        description: Projected payout from confirmed placements. See pollination_payout calc.
        default: 0

  - name: HivePlacement
    parent: PollinationContract
    common_fields: true
    fields:
      - name: contract_id
        type: string
        source: input
        description: "FK -> PollinationContract.id; the contract this placement serves."
      - name: hive_id
        type: string
        source: input
        description: "FK -> Hive.id; the colony placed on the orchard."
      - name: placement_start
        type: datetime
        source: input
        description: Instant the hive is set on the orchard (inclusive). ISO 8601 UTC.
      - name: removal_due
        type: datetime
        source: input
        description: Instant the hive must be removed (exclusive half-open upper bound). ISO 8601 UTC.
      - name: grade
        type: enum
        source: computed
        description: Strength grade snapshotted at confirmation from the hive's contract_rated_strength. CONTRACT_GRADE counts toward required_strong_hives.
        constraints: "one of {CONTRACT_GRADE, SUB_GRADE}"
      - name: status
        type: enum
        source: computed
        description: Placement lifecycle.
        default: PROPOSED
        constraints: "one of {PROPOSED, CONFIRMED, REMOVED, CANCELLED}"
      - name: contract_rated_strength
        type: integer
        source: computed
        description: Forward-looking projected colony strength at bloom_start, snapshotted at confirmation. See colony_strength_scoring calc, variant forward_projected.

  - name: QueenNucSale
    parent: Apiary
    common_fields: true
    fields:
      - name: apiary_id
        type: string
        source: input
        description: "FK -> Apiary.id; the yard the unit ships from."
      - name: source_hive_id
        type: string
        source: input
        description: "FK -> Hive.id; the colony the queen or nuc is drawn from."
      - name: product_type
        type: enum
        source: input
        description: Whether a mated queen alone or a full nuc (with frames + bees) is sold.
        constraints: "one of {QUEEN, NUC}"
      - name: frames_drawn
        type: integer
        source: input
        description: Brood frames pulled from the source hive for a NUC (0 for a QUEEN-only sale).
        default: 0
        constraints: integer >= 0
      - name: price_cents
        type: integer
        source: input
        description: Sale price in cents.
        constraints: integer >= 0
      - name: status
        type: enum
        source: computed
        description: Sale lifecycle. SHIPPED removes a colony from the apiary count (NUC); VOIDED restores it.
        default: RESERVED
        constraints: "one of {RESERVED, SHIPPED, VOIDED}"

  - name: Feeding
    parent: Hive
    common_fields: false
    fields:
      - name: hive_id
        type: string
        source: input
        description: "FK -> Hive.id; the colony fed."
      - name: fed_at
        type: datetime
        source: input
        description: Instant of feeding (ISO 8601 UTC).
      - name: feed_type
        type: enum
        source: input
        description: Feed supplied.
        constraints: "one of {SYRUP_1_1, SYRUP_2_1, FONDANT, POLLEN_PATTY}"
      - name: quantity_kg
        type: number
        source: input
        description: Mass of feed supplied.
        constraints: number > 0

  - name: RequeenSchedule
    parent: Hive
    common_fields: true
    fields:
      - name: hive_id
        type: string
        source: input
        description: "FK -> Hive.id; the colony scheduled for requeening."
      - name: due_date
        type: datetime
        source: input
        description: Scheduled requeening date (ISO 8601 UTC). A scheduled/deferred action.
      - name: reason
        type: enum
        source: input
        description: Why the requeen is scheduled.
        constraints: "one of {AGE, FAILING, QUEENLESS, GENETICS}"
      - name: status
        type: enum
        source: computed
        description: Schedule lifecycle.
        default: SCHEDULED
        constraints: "one of {SCHEDULED, COMPLETED, CANCELLED}"

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: StateRegistration
    initial_state: PENDING
    terminal_states: [REVOKED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /apiaries/{id}/registrations/{rid}/approve"
        actor: StateApiarist
        preconditions:
          - "registration.status == PENDING"
          - "current_clock_utc >= registration.effective_date"
          - "current_clock_utc < registration.expiry_date"
        side_effects:
          - "set Apiary.registration_status = ACTIVE"
          - "increments StateRegistration.version by 1"
      - from: ACTIVE
        to: EXPIRED
        trigger: "POST /_clock/set_current_utc advancing clock to >= expiry_date (system re-evaluation), or POST /apiaries/{id}/registrations/{rid}/expire"
        actor: system
        preconditions:
          - "registration.status == ACTIVE"
          - "current_clock_utc >= registration.expiry_date"
        side_effects:
          - "set Apiary.registration_status = EXPIRED"
          - "increments StateRegistration.version by 1"
      - from: PENDING
        to: REVOKED
        trigger: "POST /apiaries/{id}/registrations/{rid}/revoke"
        actor: StateApiarist
        preconditions:
          - "registration.status == PENDING"
        side_effects:
          - "if no other ACTIVE registration exists, set Apiary.registration_status = UNREGISTERED"
          - "increments StateRegistration.version by 1"

  - entity: Hive
    initial_state: "health_status=HEALTHY, queen_status=QUEENRIGHT"
    terminal_states: ["health_status=DEADOUT"]
    note: "Parallel state machine — health_status and queen_status evolve independently; DEADOUT on the health axis is terminal for the whole colony and freezes the queen axis."
    transitions:
      # --- health axis ---
      - from: "health_status=HEALTHY"
        to: "health_status=TREATMENT"
        trigger: "POST /hives/{id}/treatments"
        actor: ApiaryManager
        preconditions:
          - "hive.health_status IN {HEALTHY, QUARANTINE}"
        side_effects:
          - "create Treatment{status=ACTIVE}"
          - "set Hive.harvest_blocked_until = max(existing, treatment.harvest_clear_at)"
          - "if any DRAFT HoneyLot has a RECORDED Harvest from this hive, transition that HoneyLot DRAFT -> BLOCKED (cascade)"
      - from: "health_status=TREATMENT"
        to: "health_status=HEALTHY"
        trigger: "POST /treatments/{id}/complete"
        actor: ApiaryManager
        preconditions:
          - "treatment.status == ACTIVE"
          - "current_clock_utc >= treatment.applied_at + treatment.duration_days days"
        side_effects:
          - "set Treatment.status = COMPLETED"
          - "recompute Hive.harvest_blocked_until from remaining ACTIVE treatments"
      - from: "health_status=HEALTHY"
        to: "health_status=QUARANTINE"
        trigger: "POST /hives/{id}/quarantine"
        actor: ApiaryManager
        preconditions:
          - "hive.health_status == HEALTHY"
        side_effects:
          - "cancel any PROPOSED HivePlacement for this hive"
      - from: "health_status=ANY_NON_DEADOUT"
        to: "health_status=DEADOUT"
        trigger: "POST /hives/{id}/deadout"
        actor: ApiaryManager
        preconditions:
          - "hive.health_status != DEADOUT"
        side_effects:
          - "set Apiary.active_colony_count = count(non-DEADOUT hives in apiary) (decrement, conserved-quantity)"
          - "for each CONFIRMED HivePlacement of this hive: transition placement CONFIRMED -> REMOVED; decrement PollinationContract.placed_strong_hives if grade==CONTRACT_GRADE (cascade hop 2)"
          - "if any affected PollinationContract.placed_strong_hives < required_strong_hives AND contract.status==PLACED: transition contract PLACED -> UNDERSTAFFED and recompute projected_payout_cents (cascade hop 3)"
      # --- queen axis (independent) ---
      - from: "queen_status=QUEENRIGHT"
        to: "queen_status=QUEENLESS"
        trigger: "POST /inspections (queen_seen=false on latest) or POST /hives/{id}/mark-queenless"
        actor: ApiaryManager
        preconditions:
          - "hive.health_status != DEADOUT"
        side_effects:
          - "no health-axis change"
      - from: "queen_status=QUEENLESS"
        to: "queen_status=REQUEENING"
        trigger: "POST /requeen-schedules/{id}/start"
        actor: ApiaryManager
        preconditions:
          - "requeen_schedule.status == SCHEDULED"
          - "hive.health_status != DEADOUT"
          - "current_clock_utc >= requeen_schedule.due_date"
        side_effects:
          - "set RequeenSchedule.status = COMPLETED"
      - from: "queen_status=REQUEENING"
        to: "queen_status=QUEENRIGHT"
        trigger: "POST /hives/{id}/requeen-complete"
        actor: ApiaryManager
        preconditions:
          - "hive.queen_status == REQUEENING"
          - "hive.health_status != DEADOUT"
        side_effects:
          - "no health-axis change (cyclic: QUEENRIGHT -> QUEENLESS -> REQUEENING -> QUEENRIGHT)"

  - entity: Treatment
    initial_state: ACTIVE
    terminal_states: [COMPLETED, VOIDED]
    transitions:
      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /treatments/{id}/complete"
        actor: ApiaryManager
        preconditions:
          - "treatment.status == ACTIVE"
          - "current_clock_utc >= treatment.applied_at + treatment.duration_days days"
        side_effects:
          - "recompute Hive.harvest_blocked_until from remaining ACTIVE treatments"
      - from: ACTIVE
        to: VOIDED
        trigger: "POST /treatments/{id}/void"
        actor: ApiaryManager
        preconditions:
          - "treatment.status == ACTIVE"
        side_effects:
          - "recompute Hive.harvest_blocked_until from remaining ACTIVE treatments"
          - "if Hive.harvest_blocked_until becomes null/past, any BLOCKED HoneyLot fed only by now-clear hives may be re-DRAFTed via POST /honey-lots/{id}/unblock"

  - entity: HoneyLot
    initial_state: DRAFT
    terminal_states: [SOLD, VOIDED]
    transitions:
      - from: DRAFT
        to: BLOCKED
        trigger: "system cascade from POST /hives/{id}/treatments"
        actor: system
        preconditions:
          - "lot.status == DRAFT"
          - "lot has a RECORDED Harvest whose hive became harvest-blocked"
        side_effects:
          - "lot frozen for extraction until unblocked"
      - from: BLOCKED
        to: DRAFT
        trigger: "POST /honey-lots/{id}/unblock"
        actor: ApiaryManager
        preconditions:
          - "lot.status == BLOCKED"
          - "no contributing hive has Hive.harvest_blocked_until > current_clock_utc"
        side_effects:
          - "lot eligible for extraction again"
      - from: DRAFT
        to: EXTRACTED
        trigger: "POST /honey-lots/{id}/extract"
        actor: ApiaryManager
        preconditions:
          - "lot.status == DRAFT"
          - "count(RECORDED Harvest for lot) >= 1 (non-empty)"
          - "no contributing hive has Hive.harvest_blocked_until > current_clock_utc"
        side_effects:
          - "compute HoneyLot.final_yield_kg (honey_yield variant final)"
      - from: EXTRACTED
        to: SOLD
        trigger: "POST /honey-lots/{id}/sell"
        actor: ApiaryManager
        preconditions:
          - "lot.status == EXTRACTED"
          - "price_per_kg_cents >= 1"
        side_effects:
          - "set HoneyLot.gross_revenue_cents and HoneyLot.net_revenue_cents per honey_revenue calc"
      - from: DRAFT
        to: VOIDED
        trigger: "POST /honey-lots/{id}/void"
        actor: ApiaryManager
        preconditions:
          - "lot.status IN {DRAFT, BLOCKED}"
        side_effects:
          - "VOID every RECORDED Harvest of this lot, restoring gross_weight_kg to 0 (honey-mass conservation)"

  - entity: Harvest
    initial_state: RECORDED
    terminal_states: [VOID]
    transitions:
      - from: RECORDED
        to: VOID
        trigger: "POST /harvests/{id}/void"
        actor: ApiaryManager
        preconditions:
          - "harvest.status == RECORDED"
          - "parent HoneyLot.status IN {DRAFT, BLOCKED}"
        side_effects:
          - "decrement HoneyLot.gross_weight_kg -= weight_kg and recompute provisional_yield_kg (honey-mass conservation)"

  - entity: PollinationContract
    initial_state: DRAFT
    terminal_states: [FULFILLED, CANCELLED]
    note: "Cyclic via DISPUTED -> PLACED."
    transitions:
      - from: DRAFT
        to: SIGNED
        trigger: "POST /pollination-contracts/{id}/sign"
        actor: ContractCoordinator
        preconditions:
          - "contract.status == DRAFT"
          - "contract.bloom_end > contract.bloom_start"
        side_effects:
          - "contract open for placements"
      - from: SIGNED
        to: PLACED
        trigger: "POST /pollination-contracts/{id}/finalize-placement"
        actor: ContractCoordinator
        preconditions:
          - "contract.status == SIGNED"
          - "placed_strong_hives >= required_strong_hives"
        side_effects:
          - "recompute projected_payout_cents (pollination_payout)"
          - "increments PollinationContract.version by 1"
      - from: PLACED
        to: UNDERSTAFFED
        trigger: "system cascade from POST /hives/{id}/deadout"
        actor: system
        preconditions:
          - "contract.status == PLACED"
          - "placed_strong_hives < required_strong_hives"
        side_effects:
          - "recompute projected_payout_cents from remaining CONFIRMED placements"
      - from: UNDERSTAFFED
        to: PLACED
        trigger: "POST /pollination-contracts/{id}/finalize-placement (after backfilling placements)"
        actor: ContractCoordinator
        preconditions:
          - "contract.status == UNDERSTAFFED"
          - "placed_strong_hives >= required_strong_hives"
        side_effects:
          - "recompute projected_payout_cents"
          - "increments PollinationContract.version by 1"
      - from: PLACED
        to: DISPUTED
        trigger: "POST /pollination-contracts/{id}/dispute"
        actor: ContractCoordinator
        preconditions:
          - "contract.status == PLACED"
        side_effects:
          - "freeze payout pending re-placement"
      - from: DISPUTED
        to: PLACED
        trigger: "POST /pollination-contracts/{id}/resolve-dispute"
        actor: ContractCoordinator
        preconditions:
          - "contract.status == DISPUTED"
          - "placed_strong_hives >= required_strong_hives"
        side_effects:
          - "recompute projected_payout_cents (cycle back to PLACED)"
      - from: PLACED
        to: FULFILLED
        trigger: "POST /pollination-contracts/{id}/fulfill"
        actor: ContractCoordinator
        preconditions:
          - "contract.status == PLACED"
          - "current_clock_utc >= contract.bloom_end"
          - "every CONFIRMED HivePlacement has status REMOVED or current_clock_utc >= removal_due"
        side_effects:
          - "lock projected_payout_cents as the final payout"
      - from: SIGNED
        to: CANCELLED
        trigger: "POST /pollination-contracts/{id}/cancel"
        actor: ContractCoordinator
        preconditions:
          - "contract.status IN {DRAFT, SIGNED, UNDERSTAFFED}"
        side_effects:
          - "cancel all PROPOSED/CONFIRMED placements (set status CANCELLED); decrement placed_strong_hives to 0"

  - entity: HivePlacement
    initial_state: PROPOSED
    terminal_states: [REMOVED, CANCELLED]
    transitions:
      - from: PROPOSED
        to: CONFIRMED
        trigger: "POST /hive-placements/{id}/confirm"
        actor: ContractCoordinator
        preconditions:
          - "placement.status == PROPOSED"
          - "parent PollinationContract.status IN {SIGNED, UNDERSTAFFED}"
          - "Hive.apiary's Apiary.registration_status == ACTIVE"
          - "Hive.health_status == HEALTHY"
          - "no other CONFIRMED placement of this hive overlaps [placement_start, removal_due)"
          - "aggregate hives on contract site during overlap window < contract.max_hives_on_site"
        side_effects:
          - "snapshot grade and contract_rated_strength (colony_strength_scoring forward_projected)"
          - "if grade==CONTRACT_GRADE: increment PollinationContract.placed_strong_hives"
          - "increments PollinationContract.version by 1"
      - from: CONFIRMED
        to: REMOVED
        trigger: "POST /hive-placements/{id}/remove"
        actor: ContractCoordinator
        preconditions:
          - "placement.status == CONFIRMED"
        side_effects:
          - "if grade==CONTRACT_GRADE: decrement PollinationContract.placed_strong_hives"
      - from: PROPOSED
        to: CANCELLED
        trigger: "POST /hive-placements/{id}/cancel"
        actor: ContractCoordinator
        preconditions:
          - "placement.status == PROPOSED"
        side_effects:
          - "none"

  - entity: QueenNucSale
    initial_state: RESERVED
    terminal_states: [VOIDED]
    transitions:
      - from: RESERVED
        to: SHIPPED
        trigger: "POST /queen-nuc-sales/{id}/ship"
        actor: ContractCoordinator
        preconditions:
          - "sale.status == RESERVED"
          - "source Hive.health_status != DEADOUT"
          - "if product_type==NUC: source Hive.brood_frames >= frames_drawn"
        side_effects:
          - "if product_type==NUC: decrement source Hive.brood_frames by frames_drawn; create a child Hive{source_hive_id=source, health_status=HEALTHY, queen_status=QUEENRIGHT} only if retained? — for SALE the nuc leaves; decrement Apiary.active_colony_count by 1 (colony-conservation)"
      - from: SHIPPED
        to: VOIDED
        trigger: "POST /queen-nuc-sales/{id}/void"
        actor: ContractCoordinator
        preconditions:
          - "sale.status == SHIPPED"
        side_effects:
          - "if product_type==NUC: restore source Hive.brood_frames += frames_drawn; increment Apiary.active_colony_count by 1 (compensation restores conserved colony count)"
          - "reject with ERR_YARD_CAPACITY_EXCEEDED if restoring would push active_colony_count > Apiary.max_yard_colonies"

  - entity: RequeenSchedule
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /requeen-schedules/{id}/start"
        actor: ApiaryManager
        preconditions:
          - "schedule.status == SCHEDULED"
          - "current_clock_utc >= schedule.due_date"
          - "Hive.queen_status == QUEENLESS"
        side_effects:
          - "transition Hive queen_status QUEENLESS -> REQUEENING"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /requeen-schedules/{id}/cancel"
        actor: ApiaryManager
        preconditions:
          - "schedule.status == SCHEDULED"
        side_effects:
          - "none"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: placement-confirm-stale-contract
    parent_entity: PollinationContract
    write_endpoint: "POST /hive-placements/{id}/confirm"
    occ_field: "expected_contract_version"
    description: |
      Confirming a HivePlacement against a PollinationContract whose version has advanced since the
      client last observed it is rejected. Each confirm legitimately consumes site capacity and bumps
      the contract's placed_strong_hives and version; a client confirming a second placement against a
      stale contract view (e.g. it last saw the contract before another placement filled the last
      site slot) is operating on out-of-date capacity and must re-read.
    error_id: ERR_STALE_CONTRACT_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: colony_strength_scoring
    trigger: "on POST /inspections (variant point_in_time, writes Hive.inspection_strength); on POST /hive-placements/{id}/confirm (variant forward_projected, writes HivePlacement.contract_rated_strength + grade)"
    algorithm: weighted_scoring
    formula: |
      # Inputs are integer frame counts and one mite reading.
      base = (brood_frames * W_BROOD) + (honey_frames * W_HONEY)
      # mite penalty: subtract ST0 if last_mite_count >= MITE_TREATMENT_THRESHOLD, else 0
      mite_penalty = STRENGTH_MITE_PENALTY if last_mite_count >= MITE_TREATMENT_THRESHOLD else 0
      queen_bonus = STRENGTH_QUEEN_BONUS if queen_status == QUEENRIGHT else 0
      raw = base - mite_penalty + queen_bonus
      score = clamp(raw, 0, 100)   # floor 0, ceiling 100
    input_set: "Latest Inspection for the hive (point_in_time) OR the hive's projected state at bloom_start (forward_projected)."
    constants:
      W_BROOD: 8
      W_HONEY: 3
      STRENGTH_MITE_PENALTY: 25
      STRENGTH_QUEEN_BONUS: 10
      MITE_TREATMENT_THRESHOLD: 3.0
      CONTRACT_GRADE_MIN: 60
    precision: "integer score, clamp to [0,100]; no fractional points"
    variants:
      - name: point_in_time
        when: "Recorded at inspection time onto Hive.inspection_strength."
        difference: "Uses brood_frames and honey_frames AS OBSERVED at inspection; mite reading is this inspection's value."
      - name: forward_projected
        when: "Snapshotted at placement confirmation onto HivePlacement.contract_rated_strength; grade = CONTRACT_GRADE iff score >= CONTRACT_GRADE_MIN."
        difference: "Projects brood_frames forward by (days from now to bloom_start) at BROOD_GROWTH_PER_WEEK frames/week (capped at MAX_BROOD_FRAMES=20), THEN scores. Same formula, different (forward-looking) input set, so a hive can be SUB_GRADE today but CONTRACT_GRADE at bloom — divergent results on the SAME hive."
    note: "BROOD_GROWTH_PER_WEEK=2, MAX_BROOD_FRAMES=20. Days-to-bloom uses floor(whole_weeks); partial weeks do not add growth."

  - name: honey_yield
    trigger: "provisional on POST /harvests (recompute HoneyLot.provisional_yield_kg); final on POST /honey-lots/{id}/extract (writes HoneyLot.final_yield_kg)"
    algorithm: aggregation
    formula: |
      # provisional: estimate from frames pulled
      provisional_yield_kg = round( sum(RECORDED Harvest.frames_pulled for lot) * KG_PER_FRAME_ESTIMATE, 2 )
      # final: measured net weight, with extraction loss
      final_yield_kg = round( gross_weight_kg * (1 - EXTRACTION_LOSS_PCT), 2 )
    input_set: "provisional includes only RECORDED (non-VOID) Harvest rows; final uses gross_weight_kg = sum of RECORDED Harvest.weight_kg."
    constants:
      KG_PER_FRAME_ESTIMATE: 2.5
      EXTRACTION_LOSS_PCT: 0.04
    precision: "2 decimal places, round_half_up"
    variants:
      - name: provisional
        when: "At draft, before extraction; frame-count estimate."
        difference: "Estimate = frames * 2.5 kg/frame; ignores measured weight."
      - name: final
        when: "At extraction; measured net of 4% extraction loss."
        difference: "Uses measured gross_weight_kg minus loss; diverges from the frame estimate for the SAME lot."

  - name: pollination_payout
    trigger: "on PollinationContract transitions to/within PLACED (finalize-placement, resolve-dispute, UNDERSTAFFED recompute)"
    algorithm: tiered_pricing
    formula: |
      # Per-confirmed-placement rate with strength tier multiplier and aggregate bonus/penalty.
      # >=3 inputs (grade, contract_rated_strength, base_rate_cents, placed counts), nested min/max, conditional branches.
      per_hive = []
      for p in CONFIRMED placements of contract:
        if p.grade == CONTRACT_GRADE:
          mult = STRONG_MULT if p.contract_rated_strength >= STRONG_BONUS_MIN else 1.0
          per_hive.append( round(contract.base_rate_cents * mult) )
        else:
          per_hive.append( round(contract.base_rate_cents * SUB_GRADE_MULT) )
      subtotal = sum(per_hive)
      shortfall = max(0, contract.required_strong_hives - contract.placed_strong_hives)
      penalty   = shortfall * SHORTFALL_PENALTY_CENTS
      fulfillment_bonus = FULL_BONUS_CENTS if contract.placed_strong_hives >= contract.required_strong_hives else 0
      projected_payout_cents = max(0, subtotal + fulfillment_bonus - penalty)
    input_set: "Only HivePlacement rows with status==CONFIRMED on this contract."
    constants:
      STRONG_MULT: 1.20
      SUB_GRADE_MULT: 0.50
      STRONG_BONUS_MIN: 80
      SHORTFALL_PENALTY_CENTS: 5000
      FULL_BONUS_CENTS: 10000
    precision: "integer cents; round each per-hive amount round_half_up BEFORE summing (round-per-line, then sum)"
    note: "Rounding order is pinned: round each per-hive cents amount first, then sum — NOT sum-then-round."

  - name: honey_revenue
    trigger: "on POST /honey-lots/{id}/sell"
    algorithm: aggregation
    formula: |
      # Circular-looking: net depends on a volume discount keyed on the pre-discount revenue tier.
      gross_revenue_cents = round_half_up(final_yield_kg * price_per_kg_cents)   # final_yield_kg has 2dp
      # discount tier is keyed on gross_revenue_cents itself; evaluation order pinned:
      #   (1) compute gross_revenue_cents, (2) pick discount_pct from tier of gross, (3) apply.
      if gross_revenue_cents >= TIER2_MIN: discount_pct = TIER2_DISCOUNT
      elif gross_revenue_cents >= TIER1_MIN: discount_pct = TIER1_DISCOUNT
      else: discount_pct = 0
      net_revenue_cents = gross_revenue_cents - round_half_up(gross_revenue_cents * discount_pct)
    input_set: "Single lot at sale time; final_yield_kg and price_per_kg_cents."
    constants:
      TIER1_MIN: 100000
      TIER1_DISCOUNT: 0.05
      TIER2_MIN: 500000
      TIER2_DISCOUNT: 0.10
    precision: "integer cents, round_half_up at each marked step"
    note: "Evaluation order is pinned because the discount is keyed on the very total it modifies; compute gross first, select tier from gross, then subtract."

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Acting role is permitted for this operation per §1.7"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: auth
    check: "For ApiaryManager (entity_backed:Apiary), X-User-ID equals the apiary_id owning the target hive/lot/treatment resource"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "all ApiaryManager-owned mutations (hives, inspections, treatments, harvests, honey-lots, feedings, requeen-schedules)"

  - priority: 4
    category: existence
    check: "All path-referenced resources exist, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 5
    category: existence
    check: "All body foreign keys reference existing resources (hive_id, apiary_id, contract_id, lot_id, source_hive_id)"
    error_id: ERR_FK_NOT_FOUND
    http_status: 404
    applies_to: "all create endpoints with body FKs"

  - priority: 6
    category: state
    check: "Target resource is in a state from which this transition is allowed (per §1.2 from/preconditions)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 7
    category: state
    check: "Operating on a terminal-state resource is rejected"
    error_id: ERR_TERMINAL_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 8
    category: business_safety
    check: "Harvest may not be RECORDED, and a lot may not be EXTRACTED, while any contributing hive has Hive.harvest_blocked_until > current_clock_utc (chemical residue withdrawal)"
    error_id: ERR_HARVEST_BLOCKED_WITHDRAWAL
    http_status: 409
    applies_to: "POST /harvests, POST /honey-lots/{id}/extract"

  - priority: 9
    category: business_safety
    check: "A hive may only be CONFIRMED onto a placement if its owning Apiary.registration_status == ACTIVE (state apiary registration current)"
    error_id: ERR_APIARY_NOT_REGISTERED
    http_status: 409
    applies_to: "POST /hive-placements/{id}/confirm"

  - priority: 10
    category: business_referential
    check: "Placement's hive and the contract must be distinct, existing, non-terminal resources; the hive must be HEALTHY at confirm"
    error_id: ERR_HIVE_NOT_PLACEABLE
    http_status: 409
    applies_to: "POST /hive-placements/{id}/confirm"

  - priority: 11
    category: business_temporal
    check: "A hive may not be CONFIRMED onto two placements whose [placement_start, removal_due) windows overlap (adjacency where one's removal_due == other's placement_start is allowed)"
    error_id: ERR_HIVE_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /hive-placements/{id}/confirm"

  - priority: 12
    category: business_temporal
    check: "Confirming a placement must not push the aggregate count of hives whose windows overlap the new window above contract.max_hives_on_site"
    error_id: ERR_SITE_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /hive-placements/{id}/confirm"

  - priority: 13
    category: business_constraint
    check: "A NUC sale may not draw more brood frames than the source hive holds (frames_drawn <= Hive.brood_frames)"
    error_id: ERR_INSUFFICIENT_BROOD_FRAMES
    http_status: 422
    applies_to: "POST /queen-nuc-sales/{id}/ship"

  - priority: 14
    category: business_constraint
    check: "Voiding a NUC sale must not restore active_colony_count above Apiary.max_yard_colonies"
    error_id: ERR_YARD_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /queen-nuc-sales/{id}/void"

  - priority: 15
    category: business_constraint
    check: "A lot may not be EXTRACTED when it has zero RECORDED Harvest contributions (empty set)"
    error_id: ERR_EMPTY_LOT
    http_status: 422
    applies_to: "POST /honey-lots/{id}/extract"

  - priority: 16
    category: business_temporal
    check: "Time-gated transitions require the logical clock to have reached the relevant date (treatment completion, requeen start, registration approve window, contract fulfill)"
    error_id: ERR_TOO_EARLY
    http_status: 409
    applies_to: "POST /treatments/{id}/complete, POST /requeen-schedules/{id}/start, POST /pollination-contracts/{id}/fulfill"

  - priority: 17
    category: business_constraint
    check: "OCC: expected_contract_version must equal the contract's current version"
    error_id: ERR_STALE_CONTRACT_VERSION
    http_status: 412
    applies_to: "POST /hive-placements/{id}/confirm"

  - priority: 18
    category: business_constraint
    check: "Request body field types/enums/required fields are well-formed; uniqueness (Hive.tag per apiary, HoneyLot.lot_code per apiary, StateRegistration.registration_number) holds"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "all create endpoints"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- test-driving clock ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock to an explicit UTC instant. Server startup default is 2026-01-01T00:00:00Z; before any call the clock reads exactly this default and never falls back to wall-clock. Advancing the clock re-evaluates ACTIVE registrations for expiry."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: datetime }"
    side_effects:
      - "any ACTIVE StateRegistration with expiry_date <= new clock transitions ACTIVE -> EXPIRED, setting Apiary.registration_status = EXPIRED"

  - method: GET
    path: "/_clock/now"
    description: "Read the current logical clock."
    roles: [PlatformAdmin, ApiaryManager, StateApiarist, ContractCoordinator]
    code: 200
    input: []
    output: "{ current_utc: datetime }"
    side_effects: []

  # ---- Apiary ----
  - method: POST
    path: "/apiaries"
    description: "Register a new apiary/yard."
    roles: [PlatformAdmin, ApiaryManager]
    code: 201
    input: [name, state_code, latitude, longitude, max_yard_colonies]
    output: Apiary
    side_effects: ["registration_status = UNREGISTERED; active_colony_count = 0"]

  - method: GET
    path: "/apiaries/{id}"
    description: "Read an apiary."
    roles: [PlatformAdmin, ApiaryManager, StateApiarist, ContractCoordinator]
    code: 200
    input: []
    output: Apiary
    side_effects: []

  - method: GET
    path: "/apiaries"
    description: "List apiaries (paginated)."
    roles: [PlatformAdmin, ApiaryManager, StateApiarist, ContractCoordinator]
    code: 200
    input: ["state_code?", "limit?", "offset?"]
    output: Apiary[]
    side_effects: []

  # ---- StateRegistration ----
  - method: POST
    path: "/apiaries/{id}/registrations"
    description: "File a state apiary registration (starts PENDING)."
    roles: [PlatformAdmin, StateApiarist]
    code: 201
    input: [registration_number, effective_date, expiry_date]
    output: StateRegistration
    side_effects: ["Apiary.registration_status = PENDING if previously UNREGISTERED"]

  - method: GET
    path: "/apiaries/{id}/registrations"
    description: "List registrations for an apiary (reverse-reachability for StateRegistration.apiary_id)."
    roles: [PlatformAdmin, StateApiarist, ApiaryManager, ContractCoordinator]
    code: 200
    input: []
    output: StateRegistration[]
    side_effects: []

  - method: POST
    path: "/apiaries/{id}/registrations/{rid}/approve"
    description: "Approve a PENDING registration -> ACTIVE."
    roles: [StateApiarist]
    code: 200
    input: []
    output: StateRegistration
    side_effects: ["registration ACTIVE; Apiary.registration_status = ACTIVE; version += 1"]

  - method: POST
    path: "/apiaries/{id}/registrations/{rid}/expire"
    description: "Manually expire an ACTIVE registration (also fired automatically by clock advance)."
    roles: [StateApiarist, PlatformAdmin]
    code: 200
    input: []
    output: StateRegistration
    side_effects: ["registration EXPIRED; Apiary.registration_status = EXPIRED; version += 1"]

  - method: POST
    path: "/apiaries/{id}/registrations/{rid}/revoke"
    description: "Revoke a PENDING registration -> REVOKED."
    roles: [StateApiarist]
    code: 200
    input: []
    output: StateRegistration
    side_effects: ["registration REVOKED; Apiary.registration_status -> UNREGISTERED if no ACTIVE remains; version += 1"]

  # ---- Hive ----
  - method: POST
    path: "/hives"
    description: "Create a colony in an apiary."
    roles: [ApiaryManager]
    code: 201
    input: ["apiary_id", "tag", "brood_frames?", "source_hive_id?"]
    output: Hive
    side_effects: ["health_status=HEALTHY, queen_status=QUEENRIGHT; honey_frames=0; Apiary.active_colony_count += 1"]

  - method: GET
    path: "/hives/{id}"
    description: "Read a hive (both state axes, computed strength, harvest_blocked_until)."
    roles: [ApiaryManager, ContractCoordinator, PlatformAdmin]
    code: 200
    input: []
    output: Hive
    side_effects: []

  - method: GET
    path: "/hives"
    description: "List hives, filterable by apiary_id (reverse-reachability for Hive.apiary_id) and source_hive_id (reverse-reachability for self-referential Hive.source_hive_id)."
    roles: [ApiaryManager, ContractCoordinator, PlatformAdmin]
    code: 200
    input: ["apiary_id?", "source_hive_id?", "health_status?", "limit?", "offset?"]
    output: Hive[]
    side_effects: []

  - method: POST
    path: "/hives/{id}/quarantine"
    description: "Move a HEALTHY hive to QUARANTINE (health axis)."
    roles: [ApiaryManager]
    code: 200
    input: []
    output: Hive
    side_effects: ["cancel PROPOSED placements of this hive"]

  - method: POST
    path: "/hives/{id}/deadout"
    description: "Mark a colony DEADOUT (overwinter/colony loss). Triggers the colony-loss cascade."
    roles: [ApiaryManager]
    code: 200
    input: []
    output: Hive
    side_effects:
      - "Apiary.active_colony_count recomputed (decrement)"
      - "CONFIRMED placements -> REMOVED; contract.placed_strong_hives decremented (hop 2)"
      - "affected PLACED contracts dropping below required -> UNDERSTAFFED + payout recompute (hop 3)"

  - method: POST
    path: "/hives/{id}/mark-queenless"
    description: "Move a hive QUEENRIGHT -> QUEENLESS (queen axis; independent of health)."
    roles: [ApiaryManager]
    code: 200
    input: []
    output: Hive
    side_effects: ["queen_status=QUEENLESS"]

  - method: POST
    path: "/hives/{id}/requeen-complete"
    description: "Move a hive REQUEENING -> QUEENRIGHT (closes the requeen cycle)."
    roles: [ApiaryManager]
    code: 200
    input: []
    output: Hive
    side_effects: ["queen_status=QUEENRIGHT"]

  # ---- Inspection ----
  - method: POST
    path: "/hives/{id}/inspections"
    description: "Record an inspection; writes Hive.brood_frames, honey_frames, last_mite_count, inspection_strength; sets treatment_recommended; may flip queen_status to QUEENLESS if queen_seen=false."
    roles: [ApiaryManager]
    code: 201
    input: ["inspected_at", "mites_per_100_bees", "brood_frames_observed", "honey_frames_observed?", "queen_seen"]
    output: Inspection
    side_effects:
      - "Hive.brood_frames = brood_frames_observed; Hive.honey_frames = honey_frames_observed; Hive.last_mite_count = mites_per_100_bees"
      - "recompute Hive.inspection_strength (colony_strength_scoring point_in_time)"
      - "treatment_recommended = mites_per_100_bees >= 3.0"
      - "if queen_seen==false and hive.queen_status==QUEENRIGHT: queen_status -> QUEENLESS"

  - method: GET
    path: "/hives/{id}/inspections"
    description: "List inspections for a hive (reverse-reachability for Inspection.hive_id)."
    roles: [ApiaryManager, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: Inspection[]
    side_effects: []

  # ---- Treatment ----
  - method: POST
    path: "/hives/{id}/treatments"
    description: "Apply a mite treatment; sets Hive.health_status=TREATMENT and harvest_blocked_until; cascades DRAFT lots fed by this hive to BLOCKED."
    roles: [ApiaryManager]
    code: 201
    input: [product, applied_at, duration_days]
    output: Treatment
    side_effects:
      - "Treatment{status=ACTIVE}; withdrawal_days from product; harvest_clear_at computed"
      - "Hive.health_status = TREATMENT; Hive.harvest_blocked_until = max(existing, harvest_clear_at)"
      - "DRAFT HoneyLots with a RECORDED Harvest from this hive -> BLOCKED (cascade)"

  - method: GET
    path: "/hives/{id}/treatments"
    description: "List treatments for a hive (reverse-reachability for Treatment.hive_id)."
    roles: [ApiaryManager, PlatformAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Treatment[]
    side_effects: []

  - method: POST
    path: "/treatments/{id}/complete"
    description: "Complete an ACTIVE treatment after its duration; recomputes harvest block; may clear Hive.health_status to HEALTHY."
    roles: [ApiaryManager]
    code: 200
    input: []
    output: Treatment
    side_effects: ["Treatment.status=COMPLETED; recompute Hive.harvest_blocked_until; if no ACTIVE treatments, Hive.health_status -> HEALTHY"]

  - method: POST
    path: "/treatments/{id}/void"
    description: "Void an ACTIVE treatment (mis-recorded); recomputes harvest block."
    roles: [ApiaryManager]
    code: 200
    input: []
    output: Treatment
    side_effects: ["Treatment.status=VOIDED; recompute Hive.harvest_blocked_until"]

  # ---- HoneyLot ----
  - method: POST
    path: "/honey-lots"
    description: "Open an extraction lot."
    roles: [ApiaryManager]
    code: 201
    input: [apiary_id, lot_code, floral_source]
    output: HoneyLot
    side_effects: ["status=DRAFT; provisional_yield_kg=0; gross_weight_kg=0"]

  - method: GET
    path: "/honey-lots/{id}"
    description: "Read a lot (provisional/final yield, gross weight, status)."
    roles: [ApiaryManager, PlatformAdmin]
    code: 200
    input: []
    output: HoneyLot
    side_effects: []

  - method: GET
    path: "/honey-lots"
    description: "List lots, filterable by apiary_id (reverse-reachability for HoneyLot.apiary_id)."
    roles: [ApiaryManager, PlatformAdmin]
    code: 200
    input: ["apiary_id?", "status?", "limit?", "offset?"]
    output: HoneyLot[]
    side_effects: []

  - method: POST
    path: "/honey-lots/{id}/unblock"
    description: "Return a BLOCKED lot to DRAFT once all contributing hives are clear of withdrawal."
    roles: [ApiaryManager]
    code: 200
    input: []
    output: HoneyLot
    side_effects: ["status=DRAFT"]

  - method: POST
    path: "/honey-lots/{id}/extract"
    description: "Extract a DRAFT lot -> EXTRACTED; computes final_yield_kg."
    roles: [ApiaryManager]
    code: 200
    input: []
    output: HoneyLot
    side_effects: ["final_yield_kg computed (honey_yield final); status=EXTRACTED"]

  - method: POST
    path: "/honey-lots/{id}/sell"
    description: "Sell an EXTRACTED lot; records honey_revenue."
    roles: [ApiaryManager]
    code: 200
    input: [price_per_kg_cents]
    output: HoneyLot
    side_effects: ["status=SOLD; gross_revenue_cents + net_revenue_cents computed (honey_revenue)"]

  - method: POST
    path: "/honey-lots/{id}/void"
    description: "Void a DRAFT/BLOCKED lot; VOIDs all its Harvest contributions, restoring lot gross weight."
    roles: [ApiaryManager]
    code: 200
    input: []
    output: HoneyLot
    side_effects: ["status=VOIDED; all RECORDED Harvest -> VOID; honey-mass restored"]

  # ---- Harvest ----
  - method: POST
    path: "/honey-lots/{id}/harvests"
    description: "Record a harvest contribution from a hive into a DRAFT lot; credits HoneyLot.gross_weight_kg; recomputes provisional yield."
    roles: [ApiaryManager]
    code: 201
    input: [hive_id, frames_pulled, weight_kg]
    output: Harvest
    side_effects:
      - "HoneyLot.gross_weight_kg += weight_kg"
      - "recompute HoneyLot.provisional_yield_kg (honey_yield provisional)"

  - method: GET
    path: "/honey-lots/{id}/harvests"
    description: "List harvests for a lot (reverse-reachability for Harvest.lot_id)."
    roles: [ApiaryManager, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: Harvest[]
    side_effects: []

  - method: GET
    path: "/harvests/{id}"
    description: "Read a single harvest contribution (status, weight, frames)."
    roles: [ApiaryManager, PlatformAdmin]
    code: 200
    input: []
    output: Harvest
    side_effects: []

  - method: GET
    path: "/harvests"
    description: "List harvests, filterable by hive_id (reverse-reachability for Harvest.hive_id)."
    roles: [ApiaryManager, PlatformAdmin]
    code: 200
    input: ["hive_id?", "lot_id?", "status?", "limit?", "offset?"]
    output: Harvest[]
    side_effects: []

  - method: POST
    path: "/harvests/{id}/void"
    description: "Void a single RECORDED harvest; restores lot gross weight (honey-mass conservation)."
    roles: [ApiaryManager]
    code: 200
    input: []
    output: Harvest
    side_effects: ["status=VOID; HoneyLot.gross_weight_kg -= weight_kg; recompute provisional_yield_kg"]

  # ---- PollinationContract ----
  - method: POST
    path: "/pollination-contracts"
    description: "Create an almond pollination contract (DRAFT)."
    roles: [ContractCoordinator]
    code: 201
    input: [grower_name, orchard_state_code, bloom_start, bloom_end, required_strong_hives, max_hives_on_site, base_rate_cents]
    output: PollinationContract
    side_effects: ["status=DRAFT; placed_strong_hives=0; projected_payout_cents=0"]

  - method: GET
    path: "/pollination-contracts/{id}"
    description: "Read a contract (status, placed_strong_hives, projected payout, version)."
    roles: [ContractCoordinator, PlatformAdmin]
    code: 200
    input: []
    output: PollinationContract
    side_effects: []

  - method: GET
    path: "/pollination-contracts"
    description: "List contracts (paginated, filterable by status)."
    roles: [ContractCoordinator, PlatformAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: PollinationContract[]
    side_effects: []

  - method: POST
    path: "/pollination-contracts/{id}/sign"
    description: "DRAFT -> SIGNED."
    roles: [ContractCoordinator]
    code: 200
    input: []
    output: PollinationContract
    side_effects: ["status=SIGNED"]

  - method: POST
    path: "/pollination-contracts/{id}/finalize-placement"
    description: "SIGNED|UNDERSTAFFED -> PLACED once placed_strong_hives >= required; recomputes payout; bumps version."
    roles: [ContractCoordinator]
    code: 200
    input: []
    output: PollinationContract
    side_effects: ["status=PLACED; projected_payout_cents recomputed; version += 1"]

  - method: POST
    path: "/pollination-contracts/{id}/dispute"
    description: "PLACED -> DISPUTED."
    roles: [ContractCoordinator]
    code: 200
    input: []
    output: PollinationContract
    side_effects: ["status=DISPUTED"]

  - method: POST
    path: "/pollination-contracts/{id}/resolve-dispute"
    description: "DISPUTED -> PLACED (cyclic) once placed_strong_hives >= required; recomputes payout."
    roles: [ContractCoordinator]
    code: 200
    input: []
    output: PollinationContract
    side_effects: ["status=PLACED; projected_payout_cents recomputed"]

  - method: POST
    path: "/pollination-contracts/{id}/fulfill"
    description: "PLACED -> FULFILLED after bloom_end with all placements removed/past-due; locks final payout."
    roles: [ContractCoordinator]
    code: 200
    input: []
    output: PollinationContract
    side_effects: ["status=FULFILLED; payout locked"]

  - method: POST
    path: "/pollination-contracts/{id}/cancel"
    description: "DRAFT|SIGNED|UNDERSTAFFED -> CANCELLED; cancels placements."
    roles: [ContractCoordinator]
    code: 200
    input: []
    output: PollinationContract
    side_effects: ["status=CANCELLED; placements CANCELLED; placed_strong_hives=0"]

  # ---- HivePlacement ----
  - method: POST
    path: "/pollination-contracts/{id}/placements"
    description: "Propose placing a hive on a contract (PROPOSED)."
    roles: [ContractCoordinator]
    code: 201
    input: [hive_id, placement_start, removal_due]
    output: HivePlacement
    side_effects: ["status=PROPOSED"]

  - method: GET
    path: "/pollination-contracts/{id}/placements"
    description: "List placements for a contract (reverse-reachability for HivePlacement.contract_id)."
    roles: [ContractCoordinator, PlatformAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: HivePlacement[]
    side_effects: []

  - method: GET
    path: "/hive-placements/{id}"
    description: "Read a placement (grade, contract_rated_strength, status)."
    roles: [ContractCoordinator, PlatformAdmin]
    code: 200
    input: []
    output: HivePlacement
    side_effects: []

  - method: GET
    path: "/hive-placements"
    description: "List placements, filterable by hive_id (reverse-reachability for HivePlacement.hive_id)."
    roles: [ContractCoordinator, PlatformAdmin]
    code: 200
    input: ["hive_id?", "contract_id?", "status?", "limit?", "offset?"]
    output: HivePlacement[]
    side_effects: []

  - method: POST
    path: "/hive-placements/{id}/confirm"
    description: "PROPOSED -> CONFIRMED; OCC-guarded on the contract; runs strength grading, overlap and capacity checks; bumps contract version."
    roles: [ContractCoordinator]
    code: 200
    input: [expected_contract_version]
    output: HivePlacement
    side_effects:
      - "snapshot grade + contract_rated_strength (colony_strength_scoring forward_projected)"
      - "if CONTRACT_GRADE: PollinationContract.placed_strong_hives += 1"
      - "increments PollinationContract.version by 1"

  - method: POST
    path: "/hive-placements/{id}/remove"
    description: "CONFIRMED -> REMOVED; decrements placed_strong_hives if CONTRACT_GRADE."
    roles: [ContractCoordinator]
    code: 200
    input: []
    output: HivePlacement
    side_effects: ["status=REMOVED; placed_strong_hives -= 1 if CONTRACT_GRADE"]

  - method: POST
    path: "/hive-placements/{id}/cancel"
    description: "PROPOSED -> CANCELLED."
    roles: [ContractCoordinator]
    code: 200
    input: []
    output: HivePlacement
    side_effects: ["status=CANCELLED"]

  # ---- QueenNucSale ----
  - method: POST
    path: "/apiaries/{id}/queen-nuc-sales"
    description: "Reserve a queen or nuc sale from a source hive in the apiary."
    roles: [ContractCoordinator, ApiaryManager]
    code: 201
    input: ["source_hive_id", "product_type", "frames_drawn?", "price_cents"]
    output: QueenNucSale
    side_effects: ["status=RESERVED"]

  - method: GET
    path: "/apiaries/{id}/queen-nuc-sales"
    description: "List sales for an apiary (reverse-reachability for QueenNucSale.apiary_id)."
    roles: [ContractCoordinator, ApiaryManager, PlatformAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: QueenNucSale[]
    side_effects: []

  - method: GET
    path: "/queen-nuc-sales/{id}"
    description: "Read a single queen/nuc sale (status, product_type, frames_drawn)."
    roles: [ContractCoordinator, ApiaryManager, PlatformAdmin]
    code: 200
    input: []
    output: QueenNucSale
    side_effects: []

  - method: GET
    path: "/queen-nuc-sales"
    description: "List sales, filterable by source_hive_id (reverse-reachability for QueenNucSale.source_hive_id)."
    roles: [ContractCoordinator, ApiaryManager, PlatformAdmin]
    code: 200
    input: ["source_hive_id?", "apiary_id?", "status?", "limit?", "offset?"]
    output: QueenNucSale[]
    side_effects: []

  - method: POST
    path: "/queen-nuc-sales/{id}/ship"
    description: "RESERVED -> SHIPPED; for NUC, draws brood frames and decrements colony count."
    roles: [ContractCoordinator, ApiaryManager]
    code: 200
    input: []
    output: QueenNucSale
    side_effects: ["status=SHIPPED; if NUC: Hive.brood_frames -= frames_drawn; Apiary.active_colony_count -= 1"]

  - method: POST
    path: "/queen-nuc-sales/{id}/void"
    description: "SHIPPED -> VOIDED; restores brood frames and colony count (compensation)."
    roles: [ContractCoordinator, ApiaryManager]
    code: 200
    input: []
    output: QueenNucSale
    side_effects: ["status=VOIDED; if NUC: Hive.brood_frames += frames_drawn; Apiary.active_colony_count += 1"]

  # ---- Feeding ----
  - method: POST
    path: "/hives/{id}/feedings"
    description: "Record a feeding event (overwinter supplemental feeding)."
    roles: [ApiaryManager]
    code: 201
    input: [fed_at, feed_type, quantity_kg]
    output: Feeding
    side_effects: ["append-only feeding record"]

  - method: GET
    path: "/hives/{id}/feedings"
    description: "List feedings for a hive (reverse-reachability for Feeding.hive_id)."
    roles: [ApiaryManager, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: Feeding[]
    side_effects: []

  # ---- RequeenSchedule ----
  - method: POST
    path: "/hives/{id}/requeen-schedules"
    description: "Schedule a requeening for a hive (deferred action)."
    roles: [ApiaryManager]
    code: 201
    input: [due_date, reason]
    output: RequeenSchedule
    side_effects: ["status=SCHEDULED"]

  - method: GET
    path: "/hives/{id}/requeen-schedules"
    description: "List requeen schedules for a hive (reverse-reachability for RequeenSchedule.hive_id)."
    roles: [ApiaryManager, PlatformAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: RequeenSchedule[]
    side_effects: []

  - method: POST
    path: "/requeen-schedules/{id}/start"
    description: "SCHEDULED -> COMPLETED after due_date; drives Hive queen_status QUEENLESS -> REQUEENING."
    roles: [ApiaryManager]
    code: 200
    input: []
    output: RequeenSchedule
    side_effects: ["status=COMPLETED; Hive.queen_status -> REQUEENING"]

  - method: POST
    path: "/requeen-schedules/{id}/cancel"
    description: "SCHEDULED -> CANCELLED."
    roles: [ApiaryManager]
    code: 200
    input: []
    output: RequeenSchedule
    side_effects: ["status=CANCELLED"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing/unknown X-User-Role or X-User-ID header."
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "Acting role not permitted for this operation."
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "ApiaryManager X-User-ID does not own the apiary owning the target resource."
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Path-referenced resource does not exist."
  - id: ERR_FK_NOT_FOUND
    http: 404
    condition: "Body foreign key references a non-existent resource."
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Transition not allowed from the resource's current state."
  - id: ERR_TERMINAL_STATE
    http: 409
    condition: "Operation attempted on a terminal-state resource."
  - id: ERR_HARVEST_BLOCKED_WITHDRAWAL
    http: 409
    condition: "Harvest/extract attempted while a contributing hive is within its chemical withdrawal window."
  - id: ERR_APIARY_NOT_REGISTERED
    http: 409
    condition: "Placement confirm attempted while the hive's apiary registration is not ACTIVE."
  - id: ERR_HIVE_NOT_PLACEABLE
    http: 409
    condition: "Hive is not HEALTHY (or is otherwise ineligible) at placement confirm."
  - id: ERR_HIVE_DOUBLE_BOOKED
    http: 409
    condition: "Hive already CONFIRMED on a placement whose window overlaps the requested one."
  - id: ERR_SITE_CAPACITY_EXCEEDED
    http: 409
    condition: "Confirming would push overlapping-window hive count above contract.max_hives_on_site."
  - id: ERR_INSUFFICIENT_BROOD_FRAMES
    http: 422
    condition: "NUC ship draws more brood frames than the source hive holds."
  - id: ERR_YARD_CAPACITY_EXCEEDED
    http: 409
    condition: "Voiding a nuc sale would push active_colony_count above the yard cap."
  - id: ERR_EMPTY_LOT
    http: 422
    condition: "Extract attempted on a lot with zero RECORDED harvest contributions."
  - id: ERR_TOO_EARLY
    http: 409
    condition: "Time-gated transition attempted before the logical clock reached the required date."
  - id: ERR_STALE_CONTRACT_VERSION
    http: 412
    condition: "expected_contract_version does not match the contract's current version (OCC)."
  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "Malformed body, bad enum/type, missing required field, or uniqueness violation."
  - id: ERR_VALIDATION
    http: 422
    condition: "Generic field-level validation failure (negative quantity, removal_due <= placement_start, bloom_end <= bloom_start)."

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Operational superuser; controls the logical clock, registers apiaries, and reads everything."
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "GET /_clock/now"
    shared_operations:
      - "POST /apiaries"
      - "POST /apiaries/{id}/registrations/{rid}/expire"
      - "all GET reads"

  - name: ApiaryManager
    description: "Beekeeper operating a specific apiary; owns hives, inspections, treatments, harvests, honey lots, feedings, requeen schedules in that apiary. Acts AS the apiary."
    identity: "entity_backed:Apiary"
    exclusive_operations:
      - "POST /hives and all hive sub-resources (quarantine, deadout, mark-queenless, requeen-complete, inspections, treatments, feedings, requeen-schedules)"
      - "POST /honey-lots and lifecycle (unblock, extract, sell, void)"
      - "POST /honey-lots/{id}/harvests, POST /harvests/{id}/void"
      - "POST /treatments/{id}/complete, POST /treatments/{id}/void"
      - "POST /requeen-schedules/{id}/start, POST /requeen-schedules/{id}/cancel"
    shared_operations:
      - "POST /apiaries"
      - "POST /apiaries/{id}/queen-nuc-sales and ship/void"
      - "reads of own apiary's resources"

  - name: StateApiarist
    description: "State apiary-registration authority; approves/expires/revokes registrations."
    identity: opaque
    exclusive_operations:
      - "POST /apiaries/{id}/registrations/{rid}/approve"
      - "POST /apiaries/{id}/registrations/{rid}/revoke"
      - "POST /apiaries/{id}/registrations (file)"
    shared_operations:
      - "POST /apiaries/{id}/registrations/{rid}/expire"
      - "registration and apiary reads"

  - name: ContractCoordinator
    description: "Manages pollination contracts, hive placements, and queen/nuc sales."
    identity: opaque
    exclusive_operations:
      - "POST /pollination-contracts and all lifecycle (sign, finalize-placement, dispute, resolve-dispute, fulfill, cancel)"
      - "POST /pollination-contracts/{id}/placements and placement lifecycle (confirm, remove, cancel)"
    shared_operations:
      - "POST /apiaries/{id}/queen-nuc-sales and ship/void"
      - "contract, placement, hive, apiary reads"
