        distinguishing_aspect: "Reason coding is conditional: MEDICAL_COMPLICATION requires a Nephrologist caller, MACHINE_FAILURE requires repair evidence; plus open-transition uniqueness, approve replay, future effective_from, and activation blocked by TRAINING patient state."
        test_recipe:
          setup: ["program + TRAINING patient; no repair events and no failed deliveries exist; clock 2026-05-01"]
          setup_api_calls:
            - { call: "POST /api/dialysis-programs", payload: { name: "HD Program Z", review_cadence_treatments: 2, max_missed_log_streak: 3, waste_ratio_alert_threshold: 0.1, supply_catalog: [ { sku: "DIALYSATE_2L", name: "Dialysate 2L bag", unit_price_cents: 1200, handling_rate_cents: 10.5, unit_credit_cents: 300 } ] }, as: ProgramAdmin, captures: { prog: $.data.id } }
            - { call: "POST /api/patients", payload: { program_id: "${prog}", full_name: "Pat Zero", prescription_treatments_per_week: 3, prescription_units_per_treatment: 6 }, as: HomeNurse, as_user_id: "nurse-1", captures: { pat: $.data.id } }
          trigger:
            - { call: "POST /api/transition-records", payload: { patient_id: "${pat}", direction: HOME_TO_CENTER, reason_code: MEDICAL_COMPLICATION, effective_from: "2026-05-10", effective_to: "2026-05-20" }, as: Patient, as_user_id: "${pat}", captures: { e1: $.data.error_id } }
            - { call: "POST /api/transition-records", payload: { patient_id: "${pat}", direction: HOME_TO_CENTER, reason_code: MACHINE_FAILURE, effective_from: "2026-05-10", effective_to: "2026-05-20" }, as: Nephrologist, captures: { e2: $.data.error_id } }
            - { call: "POST /api/transition-records", payload: { patient_id: "${pat}", direction: HOME_TO_CENTER, reason_code: PATIENT_CHOICE, effective_from: "2026-05-10", effective_to: "2026-05-20" }, as: Patient, as_user_id: "${pat}", captures: { tr: $.data.id } }
            - { call: "POST /api/transition-records", payload: { patient_id: "${pat}", direction: HOME_TO_CENTER, reason_code: HOME_UNSUITABLE, effective_from: "2026-06-01" }, as: Patient, as_user_id: "${pat}", captures: { e3: $.data.error_id } }
            - { call: "POST /api/transition-records/${tr}/approve", as: Nephrologist }
            - { call: "POST /api/transition-records/${tr}/approve", as: Nephrologist, captures: { e4: $.data.error_id } }
            - { call: "POST /api/transition-records/${tr}/activate", as: Nephrologist, captures: { e5: $.data.error_id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-05-10T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /api/transition-records/${tr}/activate", as: Nephrologist, captures: { e6: $.data.error_id } }
          assert:
            - "MEDICAL_COMPLICATION by Patient: e1 == ERR_REASON_REQUIRES_PHYSICIAN"
            - "MACHINE_FAILURE without a REPAIR event in the last 30 days: e2 == ERR_REASON_NOT_SUBSTANTIATED"
            - "second open HOME_TO_CENTER: e3 == ERR_OPEN_TRANSITION_EXISTS"
            - "approve replay: e4 == ERR_TRANSITION_INVALID_STATE"
            - "activate before effective_from: e5 == ERR_TRANSITION_EFFECTIVE_IN_FUTURE"
            - "activate at effective date while patient is TRAINING: e6 == ERR_PATIENT_STATE_BLOCKS_TRANSITION"

      - name: transition_reversal_validation_battery
        claim_type: violation_to_error
        grounds: [entities.TransitionRecord.fields.reversal_of_id, "errors[ERR_INVALID_EFFECTIVE_RANGE]", "errors[ERR_REVERSAL_TARGET_REQUIRED]", "errors[ERR_REVERSAL_TARGET_INVALID]"]
        distinguishing_aspect: "effective_to <= effective_from is a 400; a reversal without reversal_of_id is a 400; a reversal pointing at a DENIED transition is a 409."
        test_recipe:
          setup: ["program + TRAINING patient; one HOME_TO_CENTER transition denied"]
          setup_api_calls:
            - { call: "POST /api/dialysis-programs", payload: { name: "HD Program Z", review_cadence_treatments: 2, max_missed_log_streak: 3, waste_ratio_alert_threshold: 0.1, supply_catalog: [ { sku: "DIALYSATE_2L", name: "Dialysate 2L bag", unit_price_cents: 1200, handling_rate_cents: 10.5, unit_credit_cents: 300 } ] }, as: ProgramAdmin, captures: { prog: $.data.id } }
            - { call: "POST /api/patients", payload: { program_id: "${prog}", full_name: "Pat Zero", prescription_treatments_per_week: 3, prescription_units_per_treatment: 6 }, as: HomeNurse, as_user_id: "nurse-1", captures: { pat: $.data.id } }
            - { call: "POST /api/transition-records", payload: { patient_id: "${pat}", direction: HOME_TO_CENTER, reason_code: PATIENT_CHOICE, effective_from: "2026-05-10", effective_to: "2026-05-20" }, as: Patient, as_user_id: "${pat}", captures: { tr: $.data.id } }
            - { call: "POST /api/transition-records/${tr}/deny", as: Nephrologist }
          trigger:
            - { call: "POST /api/transition-records", payload: { patient_id: "${pat}", direction: HOME_TO_CENTER, reason_code: PATIENT_CHOICE, effective_from: "2026-05-10", effective_to: "2026-05-09" }, as: Patient, as_user_id: "${pat}", captures: { e1: $.data.error_id } }
            - { call: "POST /api/transition-records", payload: { patient_id: "${pat}", direction: CENTER_TO_HOME, reason_code: PATIENT_CHOICE, effective_from: "2026-05-21" }, as: Nephrologist, captures: { e2: $.data.error_id } }
            - { call: "POST /api/transition-records", payload: { patient_id: "${pat}", direction: CENTER_TO_HOME, reason_code: PATIENT_CHOICE, effective_from: "2026-05-21", reversal_of_id: "${tr}" }, as: Nephrologist, captures: { e3: $.data.error_id } }
          assert:
            - "effective_to (05-09) before effective_from (05-10): e1 == ERR_INVALID_EFFECTIVE_RANGE"
            - "CENTER_TO_HOME without reversal_of_id: e2 == ERR_REVERSAL_TARGET_REQUIRED"
            - "reversal_of_id pointing at a DENIED transition: e3 == ERR_REVERSAL_TARGET_INVALID (target must be an ACTIVE HOME_TO_CENTER of the same patient)"

      - name: temporary_transition_lazy_completion_and_terminal_lockdown
        claim_type: valid_transition
        grounds: [state_machines.TransitionRecord.ACTIVE_to_COMPLETED, state_machines.Patient, "errors[ERR_PATIENT_INVALID_STATE]", entities.TransitionRecord.fields.status]
        distinguishing_aspect: "A temporary transition completes lazily when the clock passes effective_to and the patient returns to ACTIVE_HOME with no gate recheck; after a subsequent permanent transition the patient is terminally locked (suspend/reinstate rejected)."
        test_recipe:
          setup:
            - "ACTIVE_HOME patient; temporary transition 2026-05-10..2026-05-20 APPROVED then activated at 05-10 (patient SUSPENDED, machine cascade-unassigned)"
          setup_api_calls:
            - { call: "POST /api/dialysis-programs", payload: { name: "HD Program Z", review_cadence_treatments: 2, max_missed_log_streak: 3, waste_ratio_alert_threshold: 0.1, supply_catalog: [ { sku: "DIALYSATE_2L", name: "Dialysate 2L bag", unit_price_cents: 1200, handling_rate_cents: 10.5, unit_credit_cents: 300 } ] }, as: ProgramAdmin, captures: { prog: $.data.id } }
            - { call: "POST /api/patients", payload: { program_id: "${prog}", full_name: "Pat Zero", prescription_treatments_per_week: 3, prescription_units_per_treatment: 6 }, as: HomeNurse, as_user_id: "nurse-1", captures: { pat: $.data.id } }
            - { call: "POST /api/training-attempts", payload: { patient_id: "${pat}", module_code: WATER_HANDLING, score_pct: 90 }, as: HomeNurse, as_user_id: "nurse-1", captures: { a1: $.data.id } }
            - { call: "POST /api/training-attempts", payload: { patient_id: "${pat}", module_code: MACHINE_OPERATION, score_pct: 90 }, as: HomeNurse, as_user_id: "nurse-1", captures: { a2: $.data.id } }
            - { call: "POST /api/training-attempts", payload: { patient_id: "${pat}", module_code: ASEPTIC_TECHNIQUE, score_pct: 90 }, as: HomeNurse, as_user_id: "nurse-1", captures: { a3: $.data.id } }
            - { call: "POST /api/training-attempts", payload: { patient_id: "${pat}", module_code: EMERGENCY_RESPONSE, score_pct: 90 }, as: HomeNurse, as_user_id: "nurse-1", captures: { a4: $.data.id } }
            - { call: "POST /api/training-attempts", payload: { patient_id: "${pat}", module_code: SUPPLY_STORAGE, score_pct: 90 }, as: HomeNurse, as_user_id: "nurse-1", captures: { a5: $.data.id } }
            - { call: "POST /api/training-attempts/${a1}/sign-off", as: HomeNurse, as_user_id: "nurse-2" }
            - { call: "POST /api/training-attempts/${a2}/sign-off", as: HomeNurse, as_user_id: "nurse-2" }
            - { call: "POST /api/training-attempts/${a3}/sign-off", as: HomeNurse, as_user_id: "nurse-2" }
            - { call: "POST /api/training-attempts/${a4}/sign-off", as: HomeNurse, as_user_id: "nurse-2" }
            - { call: "POST /api/training-attempts/${a5}/sign-off", as: HomeNurse, as_user_id: "nurse-2" }
            - { call: "POST /api/home-assessments", payload: { patient_id: "${pat}", assessment_kind: INITIAL, water_chloramine_ppm: 0.05, electrical_dedicated_circuit: true, electrical_voltage_verified: true, storage_area_sqft: 100 }, as: HomeNurse, as_user_id: "nurse-1", captures: { asmt: $.data.id } }
            - { call: "POST /api/home-assessments/${asmt}/accept", as: HomeNurse, as_user_id: "nurse-2" }
            - { call: "POST /api/dialysis-machines", payload: { program_id: "${prog}", serial_number: "SN-Z", model: "HomeX" }, as: BiomedTechnician, captures: { mach: $.data.id, mv: $.data.version } }
            - { call: "POST /api/dialysis-machines/${mach}/assign", payload: { patient_id: "${pat}", expected_machine_version: "${mv}" }, as: BiomedTechnician }
            - { call: "GET /api/patients/${pat}", as: ProgramAdmin, captures: { pv: $.data.version } }
            - { call: "POST /api/emergency-backup-plans", payload: { patient_id: "${pat}", plan_mode: IN_CENTER_CHAIR, expected_patient_version: "${pv}" }, as: HomeNurse, as_user_id: "nurse-1" }
            - { call: "POST /api/patients/${pat}/activate", as: Nephrologist }
            - { call: "POST /api/transition-records", payload: { patient_id: "${pat}", direction: HOME_TO_CENTER, reason_code: PATIENT_CHOICE, effective_from: "2026-05-10", effective_to: "2026-05-20" }, as: Patient, as_user_id: "${pat}", captures: { tr1: $.data.id } }
            - { call: "POST /api/transition-records/${tr1}/approve", as: Nephrologist }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-05-10T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /api/transition-records/${tr1}/activate", as: Nephrologist, captures: { tr1_st: $.data.status } }
            - { call: "GET /api/dialysis-machines/${mach}", as: ProgramAdmin, captures: { mst: $.data.status } }
          trigger:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-05-21T00:00:00Z" }, as: ProgramAdmin }
            - { call: "GET /api/transition-records/${tr1}", as: ProgramAdmin, captures: { tr1_done: $.data.status } }
            - { call: "GET /api/patients/${pat}", as: ProgramAdmin, captures: { pst1: $.data.program_status, post1: $.data.posture } }
            - { call: "POST /api/transition-records", payload: { patient_id: "${pat}", direction: HOME_TO_CENTER, reason_code: HOME_UNSUITABLE, effective_from: "2026-05-22" }, as: Patient, as_user_id: "${pat}", captures: { tr2: $.data.id } }
            - { call: "POST /api/transition-records/${tr2}/approve", as: Nephrologist }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-05-22T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /api/transition-records/${tr2}/activate", as: Nephrologist }
            - { call: "GET /api/patients/${pat}", as: ProgramAdmin, captures: { pst2: $.data.program_status } }
            - { call: "POST /api/patients/${pat}/suspend", payload: { reason: "no longer applicable" }, as: Nephrologist, captures: { e1: $.data.error_id } }
            - { call: "POST /api/patients/${pat}/reinstate", as: Nephrologist, captures: { e2: $.data.error_id } }
          assert:
            - "activation at 05-10: transition ACTIVE; machine IN_STOCK (suspension cascade)"
            - "at 05-21 (> effective_to): transition reads COMPLETED (lazy) and patient program_status == ACTIVE_HOME with no readiness-gate recheck (posture == AT_RISK since machine is gone)"
            - "permanent transition at 05-22: patient TRANSITIONED_OUT"
            - "suspend from TRANSITIONED_OUT: e1 == ERR_PATIENT_INVALID_STATE"
            - "reinstate from TRANSITIONED_OUT: e2 == ERR_PATIENT_INVALID_STATE"

