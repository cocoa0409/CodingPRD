scenario: |
  2349. Inclusive Access Course Material Billing & Opt-Out (university inclusive access program):
  publisher agreement with negotiated per-student pricing by title and enrollment, course section
  flagging and material delivery through the learning management system on day one, student charge
  posting to the bursar account with a defined opt-out window, opt-out processing with access
  revocation and refund to the student account, add/drop and late-registration proration rules,
  faculty adoption deadlines and title change handling after billing, publisher reconciliation of
  enrolled versus opted-out counts, affordability reporting and state textbook cost disclosure
  compliance
domain_name: inclusive-access-course-material-billing
api_prefix: ""

complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: temporal_windowing
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - derived_field_reconciliation
  entity_topology: flat
  state_machine_shape: parallel
  relationship_patterns:
    - one_to_many
    - many_to_many          # Adoption is the CourseSection x CourseMaterialTitle junction
    - self_referential      # Adoption.supersedes_adoption_id, ReconciliationRun.supersedes_run_id
    - cross_aggregate       # StudentCharge spans Enrollment / Adoption / Student aggregates
  role_model: segregation_of_duties
  consistency_model: immediate
  difficulty_level: expert_plus
  notes: |
    Flat topology: every entity is a top-level collection linked by FK fields, no nested URL
    ownership chains. The hard core is a three-way ledger: the bursar ledger (LedgerEntry rows on
    a Student), the access entitlement count (CourseSection.provisioned_access_count), and the
    publisher settlement (ReconciliationRun) - and the same underlying facts produce two different
    publisher invoices depending on which reconciliation method is chosen (ENROLLMENT_SNAPSHOT vs
    ACCESS_DAYS_WEIGHTED). Opt-out grant/rescind is a true compensating cycle that must leave both
    money and entitlement counts exactly where they started; title change after billing is a
    rebill that conserves entitlement count while deliberately NOT conserving money.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ============================================================================
# 1.1 Entity-Relationship Table
# ============================================================================
entities:
  - name: AcademicTerm
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: Term code, unique across terms (e.g. "FA26")
        constraints: "1-16 chars; unique"
      - name: name
        type: string
        source: input
        description: Human-readable term name
      - name: term_start_date
        type: string
        source: input
        description: First instructional day (ISO date, YYYY-MM-DD)
      - name: term_end_date
        type: string
        source: input
        description: Last instructional day (ISO date); must be > term_start_date
      - name: total_term_days
        type: integer
        source: computed
        description: "(term_end_date - term_start_date).days + 1; the proration denominator"
      - name: instructional_days
        type: integer
        source: input
        description: Published instructional day count, used in disclosure narrative only
        constraints: ">= 1"
      - name: census_date
        type: string
        source: input
        description: Official enrollment census date (ISO date), used by the census tier basis variant
      - name: add_drop_deadline
        type: string
        source: input
        description: Last date of the add/drop period (ISO date); caps the opt-out window
      - name: late_registration_cutoff_date
        type: string
        source: input
        description: Last date a late enrollment may be created (ISO date)
      - name: adoption_deadline_date
        type: string
        source: input
        description: Faculty adoption submission deadline (ISO date)
      - name: disclosure_deadline_date
        type: string
        source: input
        description: State textbook cost disclosure filing deadline (ISO date)
      - name: opt_out_window_days
        type: integer
        source: input
        description: Nominal opt-out window length in days from charge posting
        default: 14
        constraints: ">= 1"
      - name: status
        type: enum
        source: system
        description: Term lifecycle status
        default: PLANNING
        constraints: "PLANNING | OPEN | BILLING_LOCKED | CLOSED"
      - name: ia_section_count
        type: integer
        source: computed
        description: Count of CourseSection rows with this term_id and inclusive_access_flag == true
      - name: closed_at
        type: datetime
        source: system
        description: Logical-clock instant the term auto-transitioned to CLOSED; null before that

  - name: Student
    parent: null
    common_fields: true
    fields:
      - name: external_id
        type: string
        source: input
        description: Registrar student number, unique across students
        constraints: unique
      - name: full_name
        type: string
        source: input
        description: Student legal name
      - name: email
        type: string
        source: input
        description: Campus email address
      - name: program_code
        type: string
        source: input
        description: Academic program code
      - name: status
        type: enum
        source: system
        description: Student record status
        default: ACTIVE
        constraints: "ACTIVE | INACTIVE"
      - name: bursar_balance_cents
        type: integer
        source: computed
        description: "Sum of LedgerEntry.amount_cents over every LedgerEntry with this student_id (signed)"

  - name: PublisherAgreement
    parent: null
    common_fields: true
    fields:
      - name: publisher_name
        type: string
        source: input
        description: Publisher legal name
      - name: agreement_code
        type: string
        source: input
        description: Contract code, unique across agreements
        constraints: unique
      - name: effective_from
        type: string
        source: input
        description: First date the agreement covers (ISO date, inclusive)
      - name: effective_to
        type: string
        source: input
        description: Exclusive end date of agreement coverage (ISO date); must be > effective_from
      - name: admin_fee_pct
        type: number
        source: input
        description: Campus administrative fee applied on top of the negotiated tier price
        constraints: "0 <= admin_fee_pct <= 0.25"
      - name: bookstore_margin_pct
        type: number
        source: input
        description: Bookstore margin withheld from the publisher share of each charge
        constraints: "0 <= bookstore_margin_pct <= 0.50"
      - name: price_floor_cents
        type: integer
        source: input
        description: Contractual minimum per-student price in cents
        constraints: ">= 0"
      - name: max_list_price_pct
        type: number
        source: input
        description: Hard cap on per-student price as a fraction of the title list price
        default: 0.60
        constraints: "0 < max_list_price_pct <= 1"
      - name: rebate_threshold_cents
        type: integer
        source: input
        description: Gross invoice level at or above which the volume rebate applies
        constraints: ">= 0"
      - name: rebate_pct
        type: number
        source: input
        description: Volume rebate fraction applied to the gross invoice when the threshold is met
        constraints: "0 <= rebate_pct <= 0.20"
      - name: status
        type: enum
        source: system
        description: Agreement lifecycle status
        default: DRAFT
        constraints: "DRAFT | ACTIVE | SUSPENDED"
      - name: reconciliation_status
        type: enum
        source: system
        description: Second, independent state dimension tracking publisher settlement progress
        default: NOT_STARTED
        constraints: "NOT_STARTED | COMPUTED | STALE | DISPUTED | SETTLED"
      - name: settled_amount_cents
        type: integer
        source: system
        description: Amount finally agreed with the publisher; null until reconciliation_status == SETTLED
      - name: suspend_reason_note
        type: string
        source: system
        description: Reason text captured when the agreement was suspended; null otherwise

  - name: CourseMaterialTitle
    parent: PublisherAgreement
    common_fields: true
    fields:
      - name: agreement_id
        type: string
        source: input
        description: "FK -> PublisherAgreement.id; the agreement that prices this title"
      - name: isbn
        type: string
        source: input
        description: Title ISBN, unique within the agreement
        constraints: "unique per (agreement_id, isbn)"
      - name: title
        type: string
        source: input
        description: Title name as printed
      - name: list_price_cents
        type: integer
        source: input
        description: Publisher list price in cents; the disclosure savings baseline
        constraints: "> 0"
      - name: format
        type: enum
        source: input
        description: Delivery format
        constraints: "DIGITAL | DIGITAL_PLUS_PRINT"
      - name: status
        type: enum
        source: system
        description: Title availability status
        default: ACTIVE
        constraints: "ACTIVE | WITHDRAWN"

  - name: PricingTier
    parent: CourseMaterialTitle
    common_fields: true
    fields:
      - name: title_id
        type: string
        source: input
        description: "FK -> CourseMaterialTitle.id; the title this enrollment band prices"
      - name: min_enrollment
        type: integer
        source: input
        description: Inclusive lower bound of the enrollment band
        constraints: ">= 1"
      - name: max_enrollment
        type: integer
        source: input
        description: Inclusive upper bound of the enrollment band; null means unbounded
        default: null
        constraints: "null or >= min_enrollment"
      - name: per_student_price_cents
        type: integer
        source: input
        description: Negotiated per-student price in cents for this band, before admin fee/cap/floor
        constraints: "> 0"

  - name: CourseSection
    parent: AcademicTerm
    common_fields: true
    fields:
      - name: term_id
        type: string
        source: input
        description: "FK -> AcademicTerm.id; the term this section is offered in"
      - name: subject_code
        type: string
        source: input
        description: Subject code (e.g. "ECON")
      - name: catalog_number
        type: string
        source: input
        description: Catalog number (e.g. "101")
      - name: section_number
        type: string
        source: input
        description: Section number, unique within (term_id, subject_code, catalog_number)
        constraints: "unique per (term_id, subject_code, catalog_number, section_number)"
      - name: instructor_user_id
        type: string
        source: input
        description: Opaque Faculty operator id that owns adoption authoring for this section
      - name: max_concurrent_titles
        type: integer
        source: input
        description: Maximum number of APPROVED adoptions whose access windows may cover any single date
        default: 2
        constraints: ">= 1"
      - name: inclusive_access_flag
        type: boolean
        source: system
        description: True once the section has been flagged for inclusive access delivery
        default: false
      - name: ia_status
        type: enum
        source: system
        description: Inclusive access delivery/billing posture for the section
        default: NOT_FLAGGED
        constraints: "NOT_FLAGGED | FLAGGED | BILLED | AT_RISK"
      - name: enrolled_count
        type: integer
        source: computed
        description: Count of Enrollment rows with this section_id and status == ENROLLED
      - name: provisioned_access_count
        type: integer
        source: computed
        description: Count of StudentCharge rows on this section with access_status IN {PROVISIONED, RESTORED}
      - name: revoked_access_count
        type: integer
        source: computed
        description: Count of StudentCharge rows on this section with access_status == REVOKED
      - name: opted_out_count
        type: integer
        source: computed
        description: Count of OptOutRequest rows with status == GRANTED whose charge belongs to this section
      - name: participation_rate
        type: number
        source: computed
        description: See calculations.section_participation_rate; 4 decimal places
      - name: billing_basis_enrollment_count
        type: integer
        source: system
        description: enrolled_count frozen at the first successful charge posting; the pricing tier basis for every later charge and rebill on this section; null before billing
      - name: first_posted_at
        type: datetime
        source: system
        description: Logical-clock instant of the first successful charge posting on this section; null before billing

  - name: Adoption
    parent: null
    common_fields: true
    fields:
      - name: section_id
        type: string
        source: input
        description: "FK -> CourseSection.id; the section adopting the title"
      - name: title_id
        type: string
        source: input
        description: "FK -> CourseMaterialTitle.id; the adopted title"
      - name: supersedes_adoption_id
        type: string
        source: input
        description: "FK -> Adoption.id; set when this adoption is a title change replacing an APPROVED adoption on the same section; null for an original adoption"
        default: null
      - name: status
        type: enum
        source: system
        description: Adoption workflow status
        default: DRAFT
        constraints: "DRAFT | SUBMITTED | CHANGE_REQUESTED | APPROVED | WITHDRAWN | SUPERSEDED"
      - name: access_start_date
        type: string
        source: input
        description: Inclusive first date of LMS access for this title (ISO date)
      - name: access_end_date
        type: string
        source: input
        description: Exclusive end date of LMS access for this title (ISO date); must be > access_start_date
      - name: submitted_by_user_id
        type: string
        source: system
        description: Opaque Faculty operator id taken from X-User-ID on submit; null before submit
      - name: approved_by_user_id
        type: string
        source: system
        description: Opaque ProgramAdmin operator id taken from X-User-ID on approve; null before approve
      - name: submitted_at
        type: datetime
        source: system
        description: Logical-clock instant of the latest submit; null before submit
      - name: approved_at
        type: datetime
        source: system
        description: Logical-clock instant of approval; null before approve
      - name: locked_list_price_cents
        type: integer
        source: system
        description: CourseMaterialTitle.list_price_cents pinned at approval; the disclosure savings baseline for charges on this adoption
      - name: change_note
        type: string
        source: system
        description: Note captured on the latest request-change; null if never returned for revision
      - name: revision_count
        type: integer
        source: system
        description: Number of times this adoption has re-entered SUBMITTED after a CHANGE_REQUESTED
        default: 0
      - name: requires_rebill
        type: boolean
        source: system
        description: True on an approved superseding adoption that triggered a rebill of already-posted charges
        default: false

  - name: Enrollment
    parent: null
    common_fields: true
    fields:
      - name: section_id
        type: string
        source: input
        description: "FK -> CourseSection.id; the section enrolled in"
      - name: student_id
        type: string
        source: input
        description: "FK -> Student.id; the enrolled student"
      - name: enrolled_on
        type: string
        source: input
        description: Registration date (ISO date); drives registration_type and proration
      - name: registration_type
        type: enum
        source: computed
        description: "REGULAR when enrolled_on <= term.add_drop_deadline, else LATE"
        constraints: "REGULAR | LATE"
      - name: status
        type: enum
        source: system
        description: Enrollment status
        default: ENROLLED
        constraints: "ENROLLED | DROPPED"
      - name: dropped_on
        type: string
        source: system
        description: Drop date (ISO date) supplied on drop; null while ENROLLED

  - name: StudentCharge
    parent: null
    common_fields: true
    fields:
      - name: enrollment_id
        type: string
        source: input
        description: "FK -> Enrollment.id; the enrollment being billed"
      - name: adoption_id
        type: string
        source: input
        description: "FK -> Adoption.id; the adoption whose title is billed; repointed on a title-change rebill"
      - name: student_id
        type: string
        source: input
        description: "FK -> Student.id; denormalized owner of the bursar charge"
      - name: gross_price_cents
        type: integer
        source: computed
        description: See calculations.per_student_negotiated_price
      - name: proration_pct
        type: number
        source: computed
        description: See calculations.charge_proration_pct; 4 decimal places; 1.0000 for a REGULAR registration
      - name: billed_amount_cents
        type: integer
        source: computed
        description: "round_half_up(gross_price_cents * proration_pct) at posting time"
      - name: refunded_amount_cents
        type: integer
        source: system
        description: Absolute value of refunds applied to this charge so far
        default: 0
      - name: net_billed_cents
        type: integer
        source: computed
        description: "Sum of LedgerEntry.amount_cents over every LedgerEntry with this charge_id"
      - name: publisher_share_cents
        type: integer
        source: computed
        description: See calculations.publisher_share_per_charge
      - name: billing_status
        type: enum
        source: system
        description: Money dimension of the charge
        default: PENDING
        constraints: "PENDING | POSTED | PARTIALLY_REFUNDED | REFUNDED | REBILLED"
      - name: access_status
        type: enum
        source: system
        description: LMS entitlement dimension of the charge, independent of billing_status
        default: NOT_PROVISIONED
        constraints: "NOT_PROVISIONED | PROVISIONED | REVOKED | RESTORED"
      - name: posted_at
        type: datetime
        source: system
        description: Logical-clock instant the charge reached POSTED; null while PENDING
      - name: opt_out_deadline_at
        type: datetime
        source: computed
        description: See calculations.opt_out_deadline
      - name: access_start_at
        type: datetime
        source: system
        description: Logical-clock instant access was first provisioned; null while NOT_PROVISIONED
      - name: access_revoked_at
        type: datetime
        source: system
        description: Logical-clock instant of the latest revocation; null if never revoked
      - name: access_restored_at
        type: datetime
        source: system
        description: Logical-clock instant of the latest restoration; null if never restored
      - name: rebill_count
        type: integer
        source: system
        description: Number of title-change rebills applied to this charge
        default: 0

  - name: LedgerEntry
    parent: StudentCharge
    common_fields: false
    fields:
      - name: charge_id
        type: string
        source: input
        description: "FK -> StudentCharge.id; the charge this bursar movement belongs to"
      - name: student_id
        type: string
        source: input
        description: "FK -> Student.id; the bursar account the movement lands on"
      - name: entry_type
        type: enum
        source: system
        description: Movement kind
        constraints: "CHARGE | REFUND | REBILL_CREDIT | REBILL_CHARGE"
      - name: reason_code
        type: enum
        source: system
        description: Business reason for the movement
        constraints: "INITIAL_POST | LATE_REGISTRATION_POST | OPT_OUT_REFUND | DROP_PRORATION | TITLE_CHANGE_REBILL | OPT_IN_RECHARGE"
      - name: amount_cents
        type: integer
        source: system
        description: Signed amount in cents; positive debits the student, negative credits the student
      - name: posted_at
        type: datetime
        source: system
        description: Logical-clock instant the movement was appended
      - name: source_event
        type: string
        source: system
        description: The API operation that appended this movement (e.g. "POST /opt-out-requests/{request_id}/grant")

  - name: OptOutRequest
    parent: StudentCharge
    common_fields: true
    fields:
      - name: charge_id
        type: string
        source: input
        description: "FK -> StudentCharge.id; the charge the student wants to opt out of"
      - name: status
        type: enum
        source: system
        description: Opt-out workflow status
        default: SUBMITTED
        constraints: "SUBMITTED | GRANTED | DENIED | RESCINDED"
      - name: reason_code
        type: enum
        source: input
        description: Student-declared opt-out reason
        constraints: "OWNS_COPY | COST | ALTERNATE_SOURCE | OTHER"
      - name: submitted_at
        type: datetime
        source: system
        description: Logical-clock instant of the latest submission
      - name: decided_at
        type: datetime
        source: system
        description: Logical-clock instant of the latest grant/deny; null while SUBMITTED
      - name: decided_by_user_id
        type: string
        source: system
        description: Opaque BursarOfficer operator id that granted or denied; null while SUBMITTED
      - name: denial_note
        type: string
        source: system
        description: Note captured on deny; null otherwise
      - name: refund_amount_cents
        type: integer
        source: system
        description: Absolute refund posted to the bursar account on the latest grant
        default: 0
      - name: rescinded_at
        type: datetime
        source: system
        description: Logical-clock instant of the latest rescind; null if never rescinded
      - name: recharge_amount_cents
        type: integer
        source: system
        description: Absolute amount re-debited to the bursar account on the latest rescind
        default: 0
      - name: cycle_count
        type: integer
        source: system
        description: Number of times this request re-entered SUBMITTED after a RESCINDED
        default: 0

  - name: ReconciliationRun
    parent: null
    common_fields: true
    fields:
      - name: agreement_id
        type: string
        source: input
        description: "FK -> PublisherAgreement.id; the agreement being reconciled"
      - name: term_id
        type: string
        source: input
        description: "FK -> AcademicTerm.id; the term being reconciled"
      - name: supersedes_run_id
        type: string
        source: input
        description: "FK -> ReconciliationRun.id; the COMPUTED run this run replaces; null for the first run"
        default: null
      - name: method
        type: enum
        source: input
        description: Reconciliation algorithm variant
        constraints: "ENROLLMENT_SNAPSHOT | ACCESS_DAYS_WEIGHTED"
      - name: status
        type: enum
        source: system
        description: Run status
        default: COMPUTED
        constraints: "COMPUTED | DISPUTED | SETTLED | SUPERSEDED"
      - name: billable_count
        type: integer
        source: computed
        description: See calculations.reconciliation_totals
      - name: opted_out_count
        type: integer
        source: computed
        description: See calculations.reconciliation_totals
      - name: gross_invoice_cents
        type: integer
        source: computed
        description: See calculations.reconciliation_totals
      - name: rebate_cents
        type: integer
        source: computed
        description: See calculations.settlement_amount
      - name: settlement_amount_cents
        type: integer
        source: computed
        description: See calculations.settlement_amount
      - name: publisher_reported_count
        type: integer
        source: input
        description: Billable student count the publisher invoiced
        constraints: ">= 0"
      - name: publisher_reported_amount_cents
        type: integer
        source: input
        description: Amount the publisher invoiced, in cents
        constraints: ">= 0"
      - name: count_variance
        type: integer
        source: computed
        description: "publisher_reported_count - billable_count"
      - name: variance_cents
        type: integer
        source: computed
        description: "publisher_reported_amount_cents - settlement_amount_cents"
      - name: dispute_note
        type: string
        source: system
        description: Note captured on dispute; null unless the run was disputed
      - name: computed_by_user_id
        type: string
        source: system
        description: Opaque ProgramAdmin operator id that created the run
      - name: settled_by_user_id
        type: string
        source: system
        description: Opaque ProgramAdmin operator id that settled the run; null until SETTLED
      - name: settled_at
        type: datetime
        source: system
        description: Logical-clock instant of settlement; null until SETTLED

  - name: DisclosureReport
    parent: AcademicTerm
    common_fields: true
    fields:
      - name: term_id
        type: string
        source: input
        description: "FK -> AcademicTerm.id; the term this state disclosure covers"
      - name: reporting_state_code
        type: string
        source: input
        description: Two-letter state code the disclosure is filed with
        constraints: "2 uppercase letters"
      - name: status
        type: enum
        source: system
        description: Disclosure filing status
        default: DRAFT
        constraints: "DRAFT | CERTIFIED | PUBLISHED"
      - name: ia_section_count
        type: integer
        source: computed
        description: See calculations.affordability_metrics
      - name: charge_count
        type: integer
        source: computed
        description: See calculations.affordability_metrics
      - name: enrolled_student_count
        type: integer
        source: computed
        description: See calculations.affordability_metrics
      - name: opted_out_student_count
        type: integer
        source: computed
        description: See calculations.affordability_metrics
      - name: total_list_price_cents
        type: integer
        source: computed
        description: See calculations.affordability_metrics
      - name: total_net_billed_cents
        type: integer
        source: computed
        description: See calculations.affordability_metrics
      - name: average_net_cost_cents
        type: integer
        source: computed
        description: See calculations.affordability_metrics
      - name: savings_pct
        type: number
        source: computed
        description: See calculations.affordability_metrics; 4 decimal places
      - name: compliance_status
        type: enum
        source: computed
        description: See calculations.affordability_metrics
        constraints: "COMPLIANT | NON_COMPLIANT | NOT_APPLICABLE"
      - name: certified_by_user_id
        type: string
        source: system
        description: Opaque ComplianceOfficer operator id that certified; null while DRAFT
      - name: certified_at
        type: datetime
        source: system
        description: Logical-clock instant of certification; null while DRAFT
      - name: published_at
        type: datetime
        source: system
        description: Logical-clock instant the report auto-published when the term closed; null before that
      - name: amendment_note
        type: string
        source: system
        description: Note captured on the latest amendment; null if never amended
      - name: amendment_count
        type: integer
        source: system
        description: Number of times this report returned from CERTIFIED to DRAFT
        default: 0

# ============================================================================
# 1.2 State Machine Table
# ============================================================================
state_machines:
  - entity: AcademicTerm
    state_field: status
    initial_state: PLANNING
    terminal_states: [CLOSED]
    transitions:
      - from: PLANNING
        to: OPEN
        trigger: "POST /terms/{term_id}/open"
        actor: ProgramAdmin
        preconditions: ["status == PLANNING"]
        side_effects: ["recomputes ia_section_count", "increments AcademicTerm.version by 1"]
      - from: OPEN
        to: BILLING_LOCKED
        trigger: "POST /terms/{term_id}/lock-billing"
        actor: ProgramAdmin
        preconditions: ["status == OPEN"]
        side_effects:
          - "increments AcademicTerm.version by 1"
          - "from now on POST /opt-out-requests, POST /opt-out-requests/{request_id}/rescind, POST /opt-out-requests/{request_id}/resubmit, POST /sections/{section_id}/post-charges and POST /enrollments/{enrollment_id}/post-charge are rejected with ERR_TERM_BILLING_LOCKED"
        note: "Settling a ReconciliationRun requires status == BILLING_LOCKED, so locking is the gate into settlement."
      - from: BILLING_LOCKED
        to: CLOSED
        trigger: "system: hop 2 of the POST /reconciliation-runs/{run_id}/settle cascade"
        actor: system
        preconditions:
          - "status == BILLING_LOCKED"
          - "every PublisherAgreement that prices at least one StudentCharge in this term (via StudentCharge.adoption_id -> Adoption.title_id -> CourseMaterialTitle.agreement_id) has reconciliation_status == SETTLED"
        side_effects:
          - "sets closed_at to the logical clock"
          - "hop 3: every DisclosureReport with this term_id and status == CERTIFIED transitions to PUBLISHED and stamps published_at"
          - "increments AcademicTerm.version by 1"

  - entity: PublisherAgreement
    state_field: status
    initial_state: DRAFT
    terminal_states: [SUSPENDED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /agreements/{agreement_id}/activate"
        actor: ProgramAdmin
        preconditions:
          - "status == DRAFT"
          - "at least one CourseMaterialTitle with agreement_id == this agreement and status == ACTIVE exists"
          - "every CourseMaterialTitle with agreement_id == this agreement and status == ACTIVE has at least one PricingTier"
        side_effects: ["increments PublisherAgreement.version by 1"]
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /agreements/{agreement_id}/suspend"
        actor: ProgramAdmin
        preconditions: ["status == ACTIVE"]
        side_effects:
          - "stores suspend_reason_note"
          - "increments PublisherAgreement.version by 1"
          - "from now on POST /sections/{section_id}/post-charges, POST /enrollments/{enrollment_id}/post-charge and POST /adoptions/{adoption_id}/approve touching a title of this agreement are rejected with ERR_AGREEMENT_NOT_ACTIVE"

  - entity: PublisherAgreement
    state_field: reconciliation_status
    initial_state: NOT_STARTED
    terminal_states: [SETTLED]
    transitions:
      - from: NOT_STARTED
        to: COMPUTED
        trigger: "POST /reconciliation-runs"
        actor: ProgramAdmin
        preconditions: ["status == ACTIVE or SUSPENDED", "reconciliation_status IN {NOT_STARTED, STALE}"]
        side_effects: ["increments PublisherAgreement.version by 1"]
        note: "Second, independent state dimension on PublisherAgreement: status and reconciliation_status advance on disjoint triggers."
      - from: STALE
        to: COMPUTED
        trigger: "POST /reconciliation-runs"
        actor: ProgramAdmin
        preconditions: ["reconciliation_status == STALE"]
        side_effects: ["the prior COMPUTED ReconciliationRun for the same (agreement_id, term_id) transitions to SUPERSEDED", "increments PublisherAgreement.version by 1"]
      - from: COMPUTED
        to: COMPUTED
        trigger: "POST /reconciliation-runs"
        actor: ProgramAdmin
        preconditions:
          - "reconciliation_status == COMPUTED"
          - "the new run's supersedes_run_id == the current COMPUTED ReconciliationRun for this (agreement_id, term_id)"
        side_effects:
          - "the superseded ReconciliationRun COMPUTED -> SUPERSEDED"
          - "increments PublisherAgreement.version by 1"
        note: "Self-transition: a recompute under a different method, or against a corrected publisher invoice, replaces the current run without leaving COMPUTED."
      - from: COMPUTED
        to: STALE
        trigger: "system: last hop of the opt-out grant, opt-out rescind, enrollment drop and title-change rebill cascades"
        actor: system
        preconditions: ["reconciliation_status IN {COMPUTED, DISPUTED}", "the mutated StudentCharge is priced by a title of this agreement"]
        side_effects: ["increments PublisherAgreement.version by 1", "blocks POST /disclosure-reports/{report_id}/certify with ERR_RECONCILIATION_NOT_CURRENT until a fresh run is computed"]
      - from: DISPUTED
        to: STALE
        trigger: "system: last hop of the opt-out grant, opt-out rescind, enrollment drop and title-change rebill cascades"
        actor: system
        preconditions: ["reconciliation_status == DISPUTED"]
        side_effects: ["increments PublisherAgreement.version by 1"]
      - from: COMPUTED
        to: DISPUTED
        trigger: "POST /reconciliation-runs/{run_id}/dispute"
        actor: ProgramAdmin
        preconditions: ["the run being disputed is the current COMPUTED run for this agreement and term"]
        side_effects: ["increments PublisherAgreement.version by 1"]
      - from: COMPUTED
        to: SETTLED
        trigger: "POST /reconciliation-runs/{run_id}/settle"
        actor: ProgramAdmin
        preconditions: ["run.status == COMPUTED", "abs(run.variance_cents) <= VARIANCE_TOLERANCE_CENTS"]
        side_effects:
          - "sets settled_amount_cents = run.settlement_amount_cents"
          - "increments PublisherAgreement.version by 1"
          - "hop 2: AcademicTerm BILLING_LOCKED -> CLOSED when every agreement of the term is SETTLED"
      - from: DISPUTED
        to: SETTLED
        trigger: "POST /reconciliation-runs/{run_id}/settle"
        actor: ProgramAdmin
        preconditions: ["run.status == DISPUTED"]
        side_effects:
          - "sets settled_amount_cents = run.publisher_reported_amount_cents (publisher figure conceded on the disputed branch)"
          - "increments PublisherAgreement.version by 1"
          - "hop 2: AcademicTerm BILLING_LOCKED -> CLOSED when every agreement of the term is SETTLED"
        note: "Divergent side-effect set versus the COMPUTED -> SETTLED branch: the settled amount is the publisher's figure, not the campus computation."

  - entity: CourseMaterialTitle
    state_field: status
    initial_state: ACTIVE
    terminal_states: [WITHDRAWN]
    transitions:
      - from: ACTIVE
        to: WITHDRAWN
        trigger: "POST /titles/{title_id}/withdraw"
        actor: ProgramAdmin
        preconditions:
          - "status == ACTIVE"
          - "no Adoption with this title_id has status == APPROVED on a CourseSection whose ia_status IN {BILLED, AT_RISK} (a title that has already been billed cannot be withdrawn; it must be replaced by a superseding adoption instead)"
        side_effects:
          - "increments CourseMaterialTitle.version by 1"
          - "from now on POST /adoptions/{adoption_id}/approve and POST /sections/{section_id}/flag-inclusive-access touching this title are rejected with ERR_TITLE_WITHDRAWN"

  - entity: CourseSection
    state_field: ia_status
    initial_state: NOT_FLAGGED
    terminal_states: []
    transitions:
      - from: NOT_FLAGGED
        to: FLAGGED
        trigger: "POST /sections/{section_id}/flag-inclusive-access"
        actor: ProgramAdmin
        preconditions:
          - "ia_status == NOT_FLAGGED"
          - "at least one Adoption with this section_id and status == APPROVED exists"
          - "for every such Adoption, its CourseMaterialTitle.status == ACTIVE and that title's PublisherAgreement.status == ACTIVE"
          - "term.status == OPEN"
        side_effects: ["sets inclusive_access_flag = true", "recomputes AcademicTerm.ia_section_count", "increments CourseSection.version by 1"]
      - from: FLAGGED
        to: BILLED
        trigger: "system: first successful POST /sections/{section_id}/post-charges or POST /enrollments/{enrollment_id}/post-charge on this section"
        actor: system
        preconditions: ["ia_status == FLAGGED", "at least one StudentCharge reached POSTED in this request"]
        side_effects:
          - "freezes billing_basis_enrollment_count = enrolled_count observed in this request"
          - "sets first_posted_at to the logical clock"
          - "recomputes provisioned_access_count, revoked_access_count and participation_rate"
          - "increments CourseSection.version by 1"
      - from: BILLED
        to: AT_RISK
        trigger: "system: hop 3 of the opt-out grant cascade or of the enrollment drop cascade"
        actor: system
        preconditions: ["ia_status == BILLED", "participation_rate < MIN_PARTICIPATION_RATE after the revocation"]
        side_effects: ["increments CourseSection.version by 1", "hop 4: the pricing agreement's reconciliation_status COMPUTED|DISPUTED -> STALE"]
      - from: AT_RISK
        to: BILLED
        trigger: "system: hop 3 of the opt-out rescind cascade"
        actor: system
        preconditions: ["ia_status == AT_RISK", "participation_rate >= MIN_PARTICIPATION_RATE after the restoration"]
        side_effects: ["increments CourseSection.version by 1", "hop 4: the pricing agreement's reconciliation_status COMPUTED|DISPUTED -> STALE"]
        note: "Cycle: BILLED -> AT_RISK -> BILLED as students opt out and opt back in."

  - entity: Adoption
    state_field: status
    initial_state: DRAFT
    terminal_states: [WITHDRAWN, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /adoptions/{adoption_id}/submit"
        actor: Faculty
        preconditions:
          - "status == DRAFT"
          - "X-User-ID == section.instructor_user_id"
          - "term.status IN {PLANNING, OPEN}"
          - "if supersedes_adoption_id IS NULL: current logical date <= term.adoption_deadline_date"
        side_effects: ["sets submitted_by_user_id from X-User-ID", "sets submitted_at to the logical clock"]
        note: "A superseding adoption (supersedes_adoption_id set) intentionally bypasses the faculty adoption deadline - that is the sanctioned late title-change path."
      - from: SUBMITTED
        to: CHANGE_REQUESTED
        trigger: "POST /adoptions/{adoption_id}/request-change"
        actor: ProgramAdmin
        preconditions: ["status == SUBMITTED"]
        side_effects: ["stores change_note"]
      - from: CHANGE_REQUESTED
        to: SUBMITTED
        trigger: "POST /adoptions/{adoption_id}/submit"
        actor: Faculty
        preconditions:
          - "status == CHANGE_REQUESTED"
          - "X-User-ID == section.instructor_user_id"
          - "if supersedes_adoption_id IS NULL: current logical date <= term.adoption_deadline_date"
        side_effects: ["increments revision_count by 1", "refreshes submitted_at", "keeps submitted_by_user_id at the resubmitting Faculty id"]
        note: "Revision cycle SUBMITTED -> CHANGE_REQUESTED -> SUBMITTED."
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /adoptions/{adoption_id}/approve"
        actor: ProgramAdmin
        preconditions:
          - "status == SUBMITTED"
          - "X-User-ID != submitted_by_user_id (segregation of duties)"
          - "title.status == ACTIVE"
          - "title's PublisherAgreement.status == ACTIVE"
          - "agreement.effective_from <= term.term_start_date AND agreement.effective_to > term.term_end_date"
          - "concurrent-title capacity holds: for every date d in [access_start_date, access_end_date), the count of APPROVED Adoptions on this section whose half-open window contains d, including this one, is <= section.max_concurrent_titles"
        side_effects:
          - "pins locked_list_price_cents = title.list_price_cents"
          - "sets approved_by_user_id from X-User-ID and approved_at from the logical clock"
          - "if supersedes_adoption_id IS NOT NULL: hop 1 - the superseded Adoption transitions APPROVED -> SUPERSEDED"
          - "if supersedes_adoption_id IS NOT NULL: hop 2 - because the old adoption became SUPERSEDED, every StudentCharge with adoption_id == the old adoption and billing_status IN {POSTED, PARTIALLY_REFUNDED, REBILLED} is repointed to this adoption, rebilled per calculations.rebill_delta (REBILL_CREDIT then REBILL_CHARGE LedgerEntry rows), billing_status -> REBILLED, rebill_count += 1, and requires_rebill is set true on this adoption"
          - "if any charge was rebilled: hop 3 - because charge amounts changed, CourseSection.provisioned_access_count / revoked_access_count / participation_rate are recomputed and Student.bursar_balance_cents is recomputed for every affected student"
          - "if any charge was rebilled: hop 4 - because the section's billed amounts changed, the pricing PublisherAgreement.reconciliation_status COMPUTED|DISPUTED -> STALE"
      - from: APPROVED
        to: WITHDRAWN
        trigger: "POST /adoptions/{adoption_id}/withdraw"
        actor: ProgramAdmin
        preconditions: ["status == APPROVED", "section.ia_status IN {NOT_FLAGGED, FLAGGED} (no charge has ever posted on this section)"]
        side_effects: ["if no APPROVED Adoption remains on the section: sets section.inclusive_access_flag = false, section.ia_status -> NOT_FLAGGED, recomputes AcademicTerm.ia_section_count"]
      - from: APPROVED
        to: SUPERSEDED
        trigger: "system: hop 1 of the POST /adoptions/{adoption_id}/approve cascade on a superseding adoption"
        actor: system
        preconditions: ["status == APPROVED", "the approving adoption's supersedes_adoption_id == this adoption id", "the approving adoption's section_id == this adoption's section_id"]
        side_effects: ["charges are repointed away from this adoption (hop 2 of the approve cascade)"]

  - entity: Enrollment
    state_field: status
    initial_state: ENROLLED
    terminal_states: [DROPPED]
    transitions:
      - from: ENROLLED
        to: DROPPED
        trigger: "POST /enrollments/{enrollment_id}/drop"
        actor: Registrar
        preconditions: ["status == ENROLLED", "dropped_on >= enrolled_on", "term.status IN {OPEN, BILLING_LOCKED}"]
        side_effects:
          - "sets dropped_on"
          - "hop 1: every StudentCharge with this enrollment_id and billing_status IN {POSTED, REBILLED} is refunded per calculations.drop_refund - refunded_amount_cents grows, billing_status -> REFUNDED when the refund equals net_billed_cents else -> PARTIALLY_REFUNDED, access_status -> REVOKED, access_revoked_at stamped"
          - "hop 2: because the charge was refunded, a REFUND LedgerEntry with reason_code DROP_PRORATION is appended and StudentCharge.net_billed_cents plus Student.bursar_balance_cents are recomputed"
          - "hop 3: because the charge's access was revoked, CourseSection.enrolled_count / provisioned_access_count / revoked_access_count / participation_rate are recomputed and ia_status BILLED -> AT_RISK when participation_rate < MIN_PARTICIPATION_RATE"
          - "hop 4: because section billing changed, the pricing PublisherAgreement.reconciliation_status COMPUTED|DISPUTED -> STALE"

  - entity: StudentCharge
    state_field: billing_status
    initial_state: PENDING
    terminal_states: [PARTIALLY_REFUNDED]
    transitions:
      - from: PENDING
        to: POSTED
        trigger: "system: automatic, inside the same POST /sections/{section_id}/post-charges or POST /enrollments/{enrollment_id}/post-charge request that created the row"
        actor: system
        preconditions: ["gross_price_cents resolved (a PricingTier matched section.billing_basis_enrollment_count)", "billed_amount_cents >= 0"]
        side_effects:
          - "appends a CHARGE LedgerEntry (reason_code INITIAL_POST for a batch post, LATE_REGISTRATION_POST for a single late post) with amount_cents = billed_amount_cents"
          - "sets posted_at, opt_out_deadline_at per calculations.opt_out_deadline"
          - "access_status NOT_PROVISIONED -> PROVISIONED and access_start_at stamped (parallel dimension advances in the same request)"
          - "recomputes Student.bursar_balance_cents"
        note: "No endpoint can observe billing_status == PENDING; it is the pre-ledger instant of the same request."
      - from: POSTED
        to: REFUNDED
        trigger: "POST /opt-out-requests/{request_id}/grant"
        actor: BursarOfficer
        preconditions: ["billing_status == POSTED", "the granting OptOutRequest.charge_id == this charge id"]
        side_effects: ["refunded_amount_cents = net_billed_cents before the refund", "appends a REFUND LedgerEntry with reason_code OPT_OUT_REFUND", "net_billed_cents becomes 0"]
      - from: REBILLED
        to: REFUNDED
        trigger: "POST /opt-out-requests/{request_id}/grant"
        actor: BursarOfficer
        preconditions: ["billing_status == REBILLED", "the granting OptOutRequest.charge_id == this charge id"]
        side_effects: ["refunded_amount_cents grows by net_billed_cents before the refund", "appends a REFUND LedgerEntry with reason_code OPT_OUT_REFUND", "net_billed_cents becomes 0"]
      - from: REFUNDED
        to: POSTED
        trigger: "POST /opt-out-requests/{request_id}/rescind"
        actor: Student
        preconditions: ["billing_status == REFUNDED", "the rescinding OptOutRequest.status == GRANTED and its charge_id == this charge id", "enrollment.status == ENROLLED"]
        side_effects: ["appends a CHARGE LedgerEntry with reason_code OPT_IN_RECHARGE for the absolute amount of the latest OPT_OUT_REFUND entry", "refunded_amount_cents returns to 0", "net_billed_cents returns to its pre-refund value"]
        note: "Compensating transition: money and entitlement counts return to their pre-grant values (see calculations.bursar_money_conservation_invariant)."
      - from: POSTED
        to: PARTIALLY_REFUNDED
        trigger: "POST /enrollments/{enrollment_id}/drop"
        actor: Registrar
        preconditions: ["billing_status == POSTED", "calculations.drop_refund yields 0 < refund < net_billed_cents"]
        side_effects: ["appends a REFUND LedgerEntry with reason_code DROP_PRORATION", "refunded_amount_cents grows by the refund"]
      - from: POSTED
        to: REFUNDED
        trigger: "POST /enrollments/{enrollment_id}/drop"
        actor: Registrar
        preconditions: ["billing_status == POSTED", "calculations.drop_refund yields refund == net_billed_cents (drop on or before term.add_drop_deadline)"]
        side_effects: ["appends a REFUND LedgerEntry with reason_code DROP_PRORATION", "net_billed_cents becomes 0"]
        note: "A REFUNDED charge whose enrollment is DROPPED can never return to POSTED - the rescind precondition requires enrollment.status == ENROLLED."
      - from: POSTED
        to: REBILLED
        trigger: "system: hop 2 of the POST /adoptions/{adoption_id}/approve cascade on a superseding adoption"
        actor: system
        preconditions: ["billing_status == POSTED", "adoption_id == the superseded Adoption id"]
        side_effects: ["adoption_id repointed to the superseding adoption", "appends REBILL_CREDIT then REBILL_CHARGE LedgerEntry rows per calculations.rebill_delta", "rebill_count += 1", "access_status stays PROVISIONED - the entitlement count is conserved"]

  - entity: StudentCharge
    state_field: access_status
    initial_state: NOT_PROVISIONED
    terminal_states: []
    transitions:
      - from: NOT_PROVISIONED
        to: PROVISIONED
        trigger: "system: automatic, inside the POST /sections/{section_id}/post-charges or POST /enrollments/{enrollment_id}/post-charge request that created the row"
        actor: system
        preconditions: ["billing_status reached POSTED in this request"]
        side_effects: ["stamps access_start_at", "increments CourseSection.provisioned_access_count"]
      - from: PROVISIONED
        to: REVOKED
        trigger: "POST /opt-out-requests/{request_id}/grant or POST /enrollments/{enrollment_id}/drop"
        actor: BursarOfficer | Registrar
        preconditions: ["access_status == PROVISIONED"]
        side_effects: ["stamps access_revoked_at", "decrements CourseSection.provisioned_access_count and increments revoked_access_count", "LMS entitlement is withdrawn"]
      - from: REVOKED
        to: RESTORED
        trigger: "POST /opt-out-requests/{request_id}/rescind"
        actor: Student
        preconditions: ["access_status == REVOKED", "enrollment.status == ENROLLED"]
        side_effects: ["stamps access_restored_at", "increments CourseSection.provisioned_access_count and decrements revoked_access_count"]
      - from: RESTORED
        to: REVOKED
        trigger: "POST /opt-out-requests/{request_id}/grant (after a RESCINDED -> SUBMITTED resubmission) or POST /enrollments/{enrollment_id}/drop"
        actor: BursarOfficer | Registrar
        preconditions: ["access_status == RESTORED"]
        side_effects: ["stamps access_revoked_at", "decrements CourseSection.provisioned_access_count and increments revoked_access_count"]
        note: "Access cycles PROVISIONED -> REVOKED -> RESTORED -> REVOKED independently of billing_status, which cycles POSTED -> REFUNDED -> POSTED. The two dimensions are the parallel state axes of StudentCharge."

  - entity: OptOutRequest
    state_field: status
    initial_state: SUBMITTED
    terminal_states: [DENIED]
    transitions:
      - from: SUBMITTED
        to: GRANTED
        trigger: "POST /opt-out-requests/{request_id}/grant"
        actor: BursarOfficer
        preconditions:
          - "status == SUBMITTED"
          - "charge.billing_status IN {POSTED, REBILLED}"
          - "charge's enrollment.status == ENROLLED"
          - "current logical instant <= charge.opt_out_deadline_at"
          - "term.status IN {OPEN, BILLING_LOCKED}"
        side_effects:
          - "sets refund_amount_cents = charge.net_billed_cents observed before the refund, decided_at, decided_by_user_id"
          - "hop 1: the StudentCharge is refunded (billing_status -> REFUNDED) and its access is revoked (access_status PROVISIONED|RESTORED -> REVOKED); a REFUND LedgerEntry with reason_code OPT_OUT_REFUND is appended and Student.bursar_balance_cents is recomputed"
          - "hop 2: because that charge's access was revoked, CourseSection.provisioned_access_count / revoked_access_count / opted_out_count / participation_rate are recomputed and ia_status BILLED -> AT_RISK when participation_rate < MIN_PARTICIPATION_RATE"
          - "hop 3: because the section's billable population changed, the pricing PublisherAgreement.reconciliation_status COMPUTED|DISPUTED -> STALE"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /opt-out-requests/{request_id}/deny"
        actor: BursarOfficer
        preconditions: ["status == SUBMITTED"]
        side_effects: ["stores denial_note, decided_at, decided_by_user_id", "no ledger movement, no access change"]
      - from: GRANTED
        to: RESCINDED
        trigger: "POST /opt-out-requests/{request_id}/rescind"
        actor: Student
        preconditions:
          - "status == GRANTED"
          - "X-User-ID == charge.student_id"
          - "charge's enrollment.status == ENROLLED"
          - "current logical instant <= charge.opt_out_deadline_at"
          - "term.status == OPEN"
        side_effects:
          - "sets recharge_amount_cents = absolute amount of the latest OPT_OUT_REFUND LedgerEntry on the charge, rescinded_at"
          - "hop 1: the StudentCharge returns to POSTED with a CHARGE / OPT_IN_RECHARGE LedgerEntry and access_status REVOKED -> RESTORED"
          - "hop 2: CourseSection counters and participation_rate are recomputed; ia_status AT_RISK -> BILLED when participation_rate >= MIN_PARTICIPATION_RATE"
          - "hop 3: the pricing PublisherAgreement.reconciliation_status COMPUTED|DISPUTED -> STALE"
      - from: RESCINDED
        to: SUBMITTED
        trigger: "POST /opt-out-requests/{request_id}/resubmit"
        actor: Student
        preconditions:
          - "status == RESCINDED"
          - "X-User-ID == charge.student_id"
          - "cycle_count < MAX_OPT_OUT_CYCLES"
          - "current logical instant <= charge.opt_out_deadline_at"
          - "term.status == OPEN"
        side_effects: ["increments cycle_count by 1", "refreshes submitted_at and reason_code", "clears decided_at / decided_by_user_id"]
        note: "Cycle SUBMITTED -> GRANTED -> RESCINDED -> SUBMITTED with a hard termination condition at cycle_count == MAX_OPT_OUT_CYCLES."

  - entity: ReconciliationRun
    state_field: status
    initial_state: COMPUTED
    terminal_states: [SETTLED, SUPERSEDED]
    transitions:
      - from: COMPUTED
        to: DISPUTED
        trigger: "POST /reconciliation-runs/{run_id}/dispute"
        actor: ProgramAdmin
        preconditions: ["status == COMPUTED", "abs(variance_cents) > VARIANCE_TOLERANCE_CENTS"]
        side_effects: ["stores dispute_note", "PublisherAgreement.reconciliation_status COMPUTED -> DISPUTED", "increments PublisherAgreement.version by 1"]
      - from: COMPUTED
        to: SETTLED
        trigger: "POST /reconciliation-runs/{run_id}/settle"
        actor: ProgramAdmin
        preconditions: ["status == COMPUTED", "abs(variance_cents) <= VARIANCE_TOLERANCE_CENTS", "term.status == BILLING_LOCKED", "agreement.reconciliation_status == COMPUTED"]
        side_effects:
          - "stamps settled_at, settled_by_user_id"
          - "hop 1: PublisherAgreement.reconciliation_status -> SETTLED and settled_amount_cents = this run's settlement_amount_cents"
          - "hop 2: because the agreement settled, AcademicTerm BILLING_LOCKED -> CLOSED once every agreement pricing a charge of the term is SETTLED"
          - "hop 3: because the term closed, every CERTIFIED DisclosureReport of the term -> PUBLISHED"
      - from: DISPUTED
        to: SETTLED
        trigger: "POST /reconciliation-runs/{run_id}/settle"
        actor: ProgramAdmin
        preconditions: ["status == DISPUTED", "term.status == BILLING_LOCKED", "agreement.reconciliation_status == DISPUTED"]
        side_effects:
          - "stamps settled_at, settled_by_user_id"
          - "hop 1: PublisherAgreement.reconciliation_status -> SETTLED and settled_amount_cents = this run's publisher_reported_amount_cents"
          - "hop 2: AcademicTerm BILLING_LOCKED -> CLOSED once every agreement pricing a charge of the term is SETTLED"
          - "hop 3: every CERTIFIED DisclosureReport of the term -> PUBLISHED"
        note: "Fork-join: the COMPUTED and DISPUTED branches join at SETTLED but write different settled_amount_cents."
      - from: COMPUTED
        to: SUPERSEDED
        trigger: "system: POST /reconciliation-runs creating a newer run for the same (agreement_id, term_id), whether the agreement's reconciliation_status was STALE or COMPUTED"
        actor: system
        preconditions: ["status == COMPUTED", "the new run's supersedes_run_id == this run id"]
        side_effects: ["no ledger movement; the superseded run's stored figures are frozen for audit"]

  - entity: DisclosureReport
    state_field: status
    initial_state: DRAFT
    terminal_states: [PUBLISHED]
    transitions:
      - from: DRAFT
        to: CERTIFIED
        trigger: "POST /disclosure-reports/{report_id}/certify"
        actor: ComplianceOfficer
        preconditions:
          - "status == DRAFT"
          - "current logical date <= term.disclosure_deadline_date"
          - "every PublisherAgreement pricing at least one StudentCharge of the term has reconciliation_status IN {COMPUTED, DISPUTED, SETTLED}"
        side_effects: ["recomputes every affordability metric per calculations.affordability_metrics", "stamps certified_at, certified_by_user_id"]
      - from: CERTIFIED
        to: DRAFT
        trigger: "POST /disclosure-reports/{report_id}/amend"
        actor: ComplianceOfficer
        preconditions: ["status == CERTIFIED"]
        side_effects: ["increments amendment_count by 1", "stores amendment_note", "clears certified_at and certified_by_user_id", "recomputes every affordability metric"]
        note: "Cycle DRAFT -> CERTIFIED -> DRAFT for amended state filings."
      - from: CERTIFIED
        to: PUBLISHED
        trigger: "system: hop 3 of the POST /reconciliation-runs/{run_id}/settle cascade, fired when the term reaches CLOSED"
        actor: system
        preconditions: ["status == CERTIFIED", "term.status == CLOSED"]
        side_effects: ["stamps published_at", "metrics are frozen: no further amendment is possible"]

# ============================================================================
# 1.2.1 Concurrency Rules (OCC on the parent's version - only sanctioned mechanism)
# ============================================================================
concurrency_rules:
  - rule_id: adoption-create-stale-section
    parent_entity: CourseSection
    write_endpoint: "POST /adoptions"
    occ_field: "expected_section_version"
    description: |
      Creating an Adoption against a CourseSection whose version has advanced since the client
      last read it is rejected. A second create is legitimate under the product semantics - a new
      adoption may supersede the section's currently APPROVED adoption as a title change - so the
      write cannot be rejected by any state precondition; the stale-version check is what protects
      the client that authored its adoption against an outdated view of the section (different
      billing_basis_enrollment_count, different ia_status, a different approved adoption set).
    error_id: ERR_STALE_SECTION_VERSION
    http_status: 412

  - rule_id: reconciliation-run-create-stale-agreement
    parent_entity: PublisherAgreement
    write_endpoint: "POST /reconciliation-runs"
    occ_field: "expected_agreement_version"
    description: |
      Creating a ReconciliationRun against a PublisherAgreement whose version has advanced since
      the client last read it is rejected. A newer run legitimately supersedes the prior COMPUTED
      run for the same (agreement_id, term_id), so a second create would otherwise succeed; the
      stale-version check rejects a run computed from an outdated view of the agreement (a cascade
      may have flipped reconciliation_status to STALE, or the agreement may have been suspended,
      between the client's read and this write).
    error_id: ERR_STALE_AGREEMENT_VERSION
    http_status: 412

# ============================================================================
# 1.3 Calculation Rules Table
# ============================================================================
calculations:
  - name: per_student_negotiated_price
    trigger: "StudentCharge PENDING -> POSTED (POST /sections/{section_id}/post-charges, POST /enrollments/{enrollment_id}/post-charge) and hop 2 of the superseding POST /adoptions/{adoption_id}/approve cascade"
    algorithm: tiered_pricing
    formula: |
      # Inputs: adoption a (-> title t -> agreement g), section s
      # Step 1 - tier basis (see variants for the two valid bases)
      n = (s.billing_basis_enrollment_count IS NOT NULL)
            ? s.billing_basis_enrollment_count
            : s.enrolled_count observed in this request
      # Step 2 - tier selection over PricingTier rows of t
      tier = the single PricingTier p with p.title_id == t.id
             AND p.min_enrollment <= n
             AND (p.max_enrollment IS NULL OR n <= p.max_enrollment)
      if no such tier: reject with ERR_NO_PRICING_TIER (422)
      # Step 3 - admin fee, list cap, contractual floor (nested min/max, order fixed)
      fee_applied_cents = round_half_up(tier.per_student_price_cents * (1 + g.admin_fee_pct))
      list_cap_cents    = floor(t.list_price_cents * g.max_list_price_pct)
      gross_price_cents = max(g.price_floor_cents, min(fee_applied_cents, list_cap_cents))
      # The floor is applied LAST: a floor above the list cap wins over the cap.
    input_set: "Exactly one PricingTier of the adoption's title; bands are non-overlapping by construction (ERR_TIER_BAND_OVERLAP). n never counts DROPPED enrollments."
    constants:
      ROUNDING: round_half_up
    precision: "whole cents, round_half_up; percentages applied as exact decimals"
    variants:
      - name: tier_basis_posting_snapshot
        when: "Production path: every charge posting and every title-change rebill on the section"
        difference: "n = CourseSection.billing_basis_enrollment_count, frozen at the first successful posting; later adds/drops never move the tier"
      - name: tier_basis_census_date
        when: "Audit/what-if basis surfaced by GET /sections/{section_id}/billing-summary as gross_per_student_census_cents"
        difference: "n = count of Enrollment rows on the section with enrolled_on <= term.census_date AND (status == ENROLLED OR dropped_on > term.census_date); a section that grew past a tier boundary between posting and census date yields a different tier and therefore a different per-student price for identical stored data"

  - name: charge_proration_pct
    trigger: "StudentCharge PENDING -> POSTED (both posting endpoints)"
    algorithm: threshold
    formula: |
      # term T, enrollment e
      if e.enrolled_on <= T.add_drop_deadline:
          proration_pct = 1.0000
      else:
          elapsed_days  = (e.enrolled_on - T.term_start_date).days     # 0 on the first day
          remaining     = T.total_term_days - elapsed_days
          proration_pct = round_half_up(remaining / T.total_term_days, 4)
      # ROUNDING ORDER IS PINNED: the ratio is rounded to 4 decimals FIRST,
      # then multiplied, then the product is rounded to whole cents.
      billed_amount_cents = round_half_up(gross_price_cents * proration_pct)
    input_set: "Single Enrollment and its AcademicTerm; total_term_days = (term_end_date - term_start_date).days + 1"
    constants:
      RATIO_DECIMALS: 4
      ROUNDING: round_half_up
    precision: "proration_pct 4 decimals; billed_amount_cents whole cents"
    variants:
      - name: regular_registration
        when: "enrolled_on <= term.add_drop_deadline"
        difference: "no proration, proration_pct == 1.0000"
      - name: late_registration
        when: "term.add_drop_deadline < enrolled_on <= term.late_registration_cutoff_date"
        difference: "calendar-day remaining-share proration; enrollment past the cutoff is rejected with ERR_LATE_REGISTRATION_CLOSED"

  - name: opt_out_deadline
    trigger: "StudentCharge PENDING -> POSTED (both posting endpoints)"
    algorithm: interval_merge
    formula: |
      window_end   = charge.posted_at + T.opt_out_window_days days
      addrop_end   = T.add_drop_deadline at 23:59:59.999Z
      floor_end    = charge.posted_at + MIN_OPT_OUT_DAYS days
      opt_out_deadline_at = max( min(window_end, addrop_end), floor_end )
      # Boundary: a request whose logical instant equals opt_out_deadline_at is ACCEPTED (<=).
    input_set: "The charge's posting instant and its section's AcademicTerm; no other charge participates"
    constants:
      MIN_OPT_OUT_DAYS: 5
    precision: "millisecond ISO 8601 UTC"
    variants:
      - name: add_drop_cap_binds
        when: "posted_at + opt_out_window_days days falls after the add/drop deadline and more than MIN_OPT_OUT_DAYS remain"
        difference: "deadline is the add/drop end-of-day instant"
      - name: minimum_window_floor_binds
        when: "the charge posts on or after the add/drop deadline (late registration)"
        difference: "deadline is posted_at + MIN_OPT_OUT_DAYS days, later than both other candidates"

  - name: publisher_share_per_charge
    trigger: "Every event that changes StudentCharge.net_billed_cents: PENDING -> POSTED, opt-out grant, opt-out rescind, drop refund, title-change rebill"
    algorithm: aggregation
    formula: |
      publisher_share_cents = round_half_up(net_billed_cents * (1 - g.bookstore_margin_pct))
    input_set: "One charge and the PublisherAgreement of its adoption's title"
    constants:
      ROUNDING: round_half_up
    precision: |
      whole cents, round_half_up, ROUNDED PER CHARGE. Every invoice total in
      reconciliation_totals sums these already-rounded per-charge values -
      "round per line then sum", never "sum then round".

  - name: drop_refund
    trigger: "Enrollment ENROLLED -> DROPPED (POST /enrollments/{enrollment_id}/drop), hop 1"
    algorithm: threshold
    formula: |
      if e.dropped_on <= T.add_drop_deadline:
          refund_cents = c.net_billed_cents                      # full reversal
      else:
          retained_pct = round_half_up((e.dropped_on - T.term_start_date).days / T.total_term_days, 4)
          refund_cents = round_half_up(c.net_billed_cents * (1 - retained_pct))
          refund_cents = min(refund_cents, c.net_billed_cents)   # never over-refund
      # retained_pct is rounded to 4 decimals BEFORE the multiplication.
      new_billing_status = (refund_cents == c.net_billed_cents) ? REFUNDED
                         : (refund_cents > 0)                   ? PARTIALLY_REFUNDED
                         :                                        POSTED   # unchanged
    input_set: "Charges of the dropped enrollment with billing_status IN {POSTED, REBILLED}; REFUNDED and PARTIALLY_REFUNDED charges are skipped"
    constants:
      RATIO_DECIMALS: 4
      ROUNDING: round_half_up
    precision: "retained_pct 4 decimals; refund whole cents"

  - name: rebill_delta
    trigger: "hop 2 of the superseding POST /adoptions/{adoption_id}/approve cascade (Adoption SUBMITTED -> APPROVED with supersedes_adoption_id set)"
    algorithm: constraint_propagation
    formula: |
      # For each charge c of the superseded adoption with billing_status IN {POSTED, REBILLED},
      # processed in order c.created_at ASC, then Student.external_id ASC:
      old_net_cents = c.net_billed_cents
      append LedgerEntry(entry_type=REBILL_CREDIT, reason_code=TITLE_CHANGE_REBILL,
                         amount_cents = -old_net_cents)
      new_gross_cents  = per_student_negotiated_price(new adoption, s.billing_basis_enrollment_count)
      new_billed_cents = round_half_up(new_gross_cents * c.proration_pct)   # proration_pct preserved
      append LedgerEntry(entry_type=REBILL_CHARGE, reason_code=TITLE_CHANGE_REBILL,
                         amount_cents = +new_billed_cents)
      c.adoption_id       = new adoption id
      c.gross_price_cents = new_gross_cents
      c.billed_amount_cents = new_billed_cents
      c.billing_status    = REBILLED
      c.rebill_count     += 1
      # access_status is NOT touched: the entitlement count is conserved (see
      # entitlement_conservation_invariant) while money deliberately is not.
    input_set: "Charges of the superseded adoption with billing_status IN {POSTED, REBILLED}; PARTIALLY_REFUNDED and REFUNDED charges are excluded and keep pointing at the superseded adoption"
    constants:
      ROUNDING: round_half_up
    precision: "whole cents; the tier basis is the frozen billing_basis_enrollment_count, never the live enrolled_count"

  - name: reconciliation_totals
    trigger: "POST /reconciliation-runs (ReconciliationRun row creation)"
    algorithm: chronological
    formula: |
      # scope(run): every StudentCharge c where
      #   c.adoption_id -> Adoption a -> a.title_id -> CourseMaterialTitle t
      #   AND t.agreement_id == run.agreement_id
      #   AND c.enrollment_id -> Enrollment e -> e.section_id -> CourseSection s
      #   AND s.term_id == run.term_id AND s.inclusive_access_flag == true
      # Processing order: c.created_at ASC, tie-break Student.external_id ASC.
      #
      # opted_out_count (identical in both variants):
      opted_out_count = count of c in scope with billing_status == REFUNDED
                        AND at least one OptOutRequest with charge_id == c.id and status == GRANTED
      #
      # --- variant ENROLLMENT_SNAPSHOT ---
      included = c in scope with billing_status IN {POSTED, PARTIALLY_REFUNDED, REBILLED}
      billable_count      = count(included)
      gross_invoice_cents = sum over included of c.publisher_share_cents
      #
      # --- variant ACCESS_DAYS_WEIGHTED ---
      included = c in scope with access_status IN {PROVISIONED, REVOKED, RESTORED}
      for each c in included:
          access_from  = max(date(c.access_start_at), a.access_start_date)
          access_until = (c.access_status == REVOKED)
                           ? min(date(c.access_revoked_at) - 1 day, T.term_end_date)
                           : T.term_end_date
          access_days  = max(0, (access_until - access_from).days + 1)
          weight       = round_half_up(access_days / T.total_term_days, 4)
          weighted_share_cents = round_half_up(c.publisher_share_cents * weight)
      billable_count      = count of c in included with weight > 0     # strict >
      gross_invoice_cents = sum over included of weighted_share_cents
    input_set: "Charges of one (agreement, term) pair on inclusive-access-flagged sections. ENROLLMENT_SNAPSHOT counts current billing_status only and contributes 0 for a REFUNDED charge; ACCESS_DAYS_WEIGHTED includes every charge that was ever provisioned and pays the publisher for the days access actually existed."
    constants:
      RATIO_DECIMALS: 4
      ROUNDING: round_half_up
    precision: "weights 4 decimals; each per-charge share rounded to cents before summation"
    variants:
      - name: enrollment_snapshot
        when: "run.method == ENROLLMENT_SNAPSHOT"
        difference: "A charge refunded through a granted opt-out contributes exactly 0 to gross_invoice_cents and is excluded from billable_count"
      - name: access_days_weighted
        when: "run.method == ACCESS_DAYS_WEIGHTED"
        difference: "The same refunded charge still contributes round_half_up(publisher_share_before_refund * weight) for the days it held access, so the same stored data yields a strictly larger gross_invoice_cents whenever any opt-out was granted mid-window"
    note: |
      For a REFUNDED charge net_billed_cents is 0, so publisher_share_cents is 0. The
      ACCESS_DAYS_WEIGHTED variant therefore uses the charge's pre-refund publisher share,
      reconstructed as round_half_up(refunded_amount_cents * (1 - g.bookstore_margin_pct)).

  - name: settlement_amount
    trigger: "POST /reconciliation-runs, immediately after reconciliation_totals"
    algorithm: waterfall_allocation
    formula: |
      # EVALUATION ORDER IS PINNED - the rebate looks circular because the
      # rebate threshold is keyed on the invoice level while the settlement is
      # the invoice net of the rebate. Resolve in exactly this order:
      # (1) gross_invoice_cents  <- reconciliation_totals (already computed)
      # (2) rebate_cents         <- threshold tested against the GROSS invoice
      rebate_cents = (gross_invoice_cents >= g.rebate_threshold_cents)
                       ? round_half_up(gross_invoice_cents * g.rebate_pct)
                       : 0
      # (3) settlement_amount_cents <- gross minus rebate; the threshold is
      #     NEVER re-tested against settlement_amount_cents.
      settlement_amount_cents = gross_invoice_cents - rebate_cents
      # (4) variances against the publisher's own figures
      count_variance = run.publisher_reported_count - billable_count
      variance_cents = run.publisher_reported_amount_cents - settlement_amount_cents
    input_set: "One run's gross_invoice_cents plus the agreement's rebate parameters and the publisher-reported figures supplied in the request body"
    constants:
      VARIANCE_TOLERANCE_CENTS: 500
      ROUNDING: round_half_up
    precision: "whole cents"

  - name: section_participation_rate
    trigger: "Every event that changes CourseSection.provisioned_access_count or enrolled_count: charge posting, opt-out grant, opt-out rescind, enrollment drop, title-change rebill"
    algorithm: aggregation
    formula: |
      participation_rate = (enrolled_count == 0)
                             ? 0.0000
                             : round_half_up(provisioned_access_count / enrolled_count, 4)
      # ia_status reacts only from BILLED/AT_RISK:
      if ia_status == BILLED  and participation_rate <  MIN_PARTICIPATION_RATE: ia_status = AT_RISK
      if ia_status == AT_RISK and participation_rate >= MIN_PARTICIPATION_RATE: ia_status = BILLED
    input_set: "Enrollment rows with status == ENROLLED (denominator) and StudentCharge rows with access_status IN {PROVISIONED, RESTORED} (numerator), both scoped to the section"
    constants:
      MIN_PARTICIPATION_RATE: 0.5000
      RATIO_DECIMALS: 4
    precision: "4 decimals, round_half_up; the comparison is >= at exactly 0.5000 (stays BILLED)"

  - name: affordability_metrics
    trigger: "POST /disclosure-reports, DisclosureReport DRAFT -> CERTIFIED, and CERTIFIED -> DRAFT (amend)"
    algorithm: weighted_scoring
    formula: |
      # scope_sections = CourseSection rows with term_id == report.term_id
      #                  AND inclusive_access_flag == true
      # scope_charges  = StudentCharge rows whose enrollment's section is in
      #                  scope_sections AND billing_status IN {POSTED, PARTIALLY_REFUNDED, REBILLED}
      ia_section_count        = count(scope_sections)
      charge_count            = count(scope_charges)
      enrolled_student_count  = count of Enrollment rows on scope_sections with status == ENROLLED
      opted_out_student_count = count of DISTINCT student_id over charges on scope_sections having
                                at least one OptOutRequest with status == GRANTED
      total_list_price_cents  = sum over scope_charges of (charge.adoption_id -> Adoption.locked_list_price_cents)
      total_net_billed_cents  = sum over scope_charges of charge.net_billed_cents
      average_net_cost_cents  = (charge_count == 0) ? 0
                                : round_half_up(total_net_billed_cents / charge_count)
      savings_pct             = (total_list_price_cents == 0) ? 0.0000
                                : round_half_up(1 - (total_net_billed_cents / total_list_price_cents), 4)
      compliance_status       = (charge_count == 0)                        ? NOT_APPLICABLE
                              : (savings_pct >= STATE_MIN_SAVINGS_PCT)     ? COMPLIANT
                              :                                             NON_COMPLIANT
    input_set: "Only inclusive-access-flagged sections of the term; REFUNDED charges (granted opt-outs and full drop reversals) are excluded from every money total but still counted in opted_out_student_count"
    constants:
      STATE_MIN_SAVINGS_PCT: 0.3000
      RATIO_DECIMALS: 4
      ROUNDING: round_half_up
    precision: "savings_pct 4 decimals; money whole cents; the compliance comparison is >= at exactly 0.3000"

  - name: bursar_money_conservation_invariant
    trigger: "Asserted after every ledger-touching operation; specifically after an opt-out grant paired with its compensating rescind"
    algorithm: projection
    formula: |
      # Named conserved quantity #1 - MONEY on the bursar account, in cents.
      for every StudentCharge c:
          c.net_billed_cents == sum(LedgerEntry.amount_cents where charge_id == c.id)
      for every Student st:
          st.bursar_balance_cents == sum(LedgerEntry.amount_cents where student_id == st.id)
      # Compensating-pair invariant: grant (forward) + rescind (compensating)
      # over a charge whose pre-grant ledger sum was P leaves
      #   sum(ledger of c) == P  and  st.bursar_balance_cents unchanged,
      # with exactly two additional rows: REFUND(-P) then CHARGE(+P).
    input_set: "Every LedgerEntry of the charge/student, including REBILL_CREDIT and REBILL_CHARGE rows; the ledger is append-only and no row is ever mutated or deleted"
    constants:
      DRIFT_TOLERANCE_CENTS: 0
    precision: "exact integer cents; zero drift permitted"

  - name: entitlement_conservation_invariant
    trigger: "Asserted after every access-touching operation; specifically across a title-change rebill and across an opt-out grant/rescind pair"
    algorithm: projection
    formula: |
      # Named conserved quantity #2 - ENTITLEMENT COUNT (LMS seats), an integer.
      for every CourseSection s with ia_status IN {BILLED, AT_RISK}:
          s.provisioned_access_count + s.revoked_access_count
            == count(StudentCharge on s with access_status != NOT_PROVISIONED)
      # Compensating-pair invariant A: a title-change rebill repoints charges and
      # rewrites money but MUST leave s.provisioned_access_count and
      # count(StudentCharge on s) unchanged (no seat is created or destroyed).
      # Compensating-pair invariant B: grant (revoke) + rescind (restore) leaves
      # s.provisioned_access_count and s.revoked_access_count at their pre-grant values.
    input_set: "StudentCharge rows of the section, keyed on access_status only; billing_status is irrelevant to this quantity"
    constants:
      DRIFT_TOLERANCE_SEATS: 0
    precision: "exact integers; zero drift permitted"

# ============================================================================
# 1.4 Validation Rules Table (ordered by priority - lowest number wins)
# ============================================================================
validations:
  - priority: 10
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 20
    category: auth
    check: "The role in X-User-Role appears in the endpoint's roles list"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: all
  - priority: 25
    category: business_constraint
    check: "Request body shape: required fields present, types correct, enum members valid, numeric ranges respected (e.g. min_enrollment >= 1, list_price_cents > 0, reporting_state_code is two uppercase letters), unknown fields rejected"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all write endpoints"
  - priority: 30
    category: existence
    check: "Every path id resolves, validated left-to-right"
    error_id: "ERR_TERM_NOT_FOUND | ERR_STUDENT_NOT_FOUND | ERR_AGREEMENT_NOT_FOUND | ERR_TITLE_NOT_FOUND | ERR_TIER_NOT_FOUND | ERR_SECTION_NOT_FOUND | ERR_ADOPTION_NOT_FOUND | ERR_ENROLLMENT_NOT_FOUND | ERR_CHARGE_NOT_FOUND | ERR_LEDGER_ENTRY_NOT_FOUND | ERR_OPT_OUT_REQUEST_NOT_FOUND | ERR_RUN_NOT_FOUND | ERR_REPORT_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path ids"
  - priority: 32
    category: existence
    check: "Every foreign key supplied in the body resolves, validated in declaration order (term_id, agreement_id, title_id, section_id, student_id, enrollment_id, adoption_id, charge_id, supersedes_adoption_id, supersedes_run_id)"
    error_id: "ERR_TERM_NOT_FOUND | ERR_AGREEMENT_NOT_FOUND | ERR_TITLE_NOT_FOUND | ERR_SECTION_NOT_FOUND | ERR_STUDENT_NOT_FOUND | ERR_ENROLLMENT_NOT_FOUND | ERR_ADOPTION_NOT_FOUND | ERR_CHARGE_NOT_FOUND | ERR_RUN_NOT_FOUND"
    http_status: 404
    applies_to: "all write endpoints with body FKs"
  - priority: 35
    category: auth
    check: "Ownership: a Student may only act on an OptOutRequest/StudentCharge whose student_id == X-User-ID and may only read its own charges and ledger entries; a Faculty may only author/submit an Adoption whose section.instructor_user_id == X-User-ID"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /adoptions, POST /adoptions/{adoption_id}/submit, POST /opt-out-requests, POST /opt-out-requests/{request_id}/rescind, POST /opt-out-requests/{request_id}/resubmit, GET /students/{student_id}/ledger-entries, GET /charges/{charge_id}, GET /charges/{charge_id}/ledger-entries"
  - priority: 40
    category: state
    check: "OCC: expected_section_version == section.version / expected_agreement_version == agreement.version"
    error_id: "ERR_STALE_SECTION_VERSION | ERR_STALE_AGREEMENT_VERSION"
    http_status: 412
    applies_to: "POST /adoptions, POST /reconciliation-runs"
  - priority: 45
    category: state
    check: "The target entity is in a state from which this transition is declared in 1.2 (includes re-running a terminal transition and acting on a SUPERSEDED run or a PUBLISHED report)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"
  - priority: 48
    category: state
    check: "Term money gate: the section's term.status must be OPEN for charge posting, opt-out submission, rescind and resubmit; BILLING_LOCKED and CLOSED reject"
    error_id: ERR_TERM_BILLING_LOCKED
    http_status: 409
    applies_to: "POST /sections/{section_id}/post-charges, POST /enrollments/{enrollment_id}/post-charge, POST /opt-out-requests, POST /opt-out-requests/{request_id}/rescind, POST /opt-out-requests/{request_id}/resubmit"
  - priority: 50
    category: state
    check: "Term workflow gate: term.status must be OPEN to flag a section and IN {PLANNING, OPEN} to submit or approve an adoption"
    error_id: ERR_TERM_NOT_OPEN
    http_status: 409
    applies_to: "POST /sections/{section_id}/flag-inclusive-access, POST /adoptions/{adoption_id}/submit, POST /adoptions/{adoption_id}/approve"
  - priority: 52
    category: state
    check: "Section posture gate: charge posting requires section.ia_status IN {FLAGGED, BILLED}"
    error_id: ERR_SECTION_NOT_FLAGGED
    http_status: 409
    applies_to: "POST /sections/{section_id}/post-charges, POST /enrollments/{enrollment_id}/post-charge"
  - priority: 55
    category: business_safety
    check: "Segregation of duties: the ProgramAdmin approving an adoption must not be the operator that submitted it (X-User-ID != adoption.submitted_by_user_id)"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /adoptions/{adoption_id}/approve"
  - priority: 58
    category: business_safety
    check: "Disclosure certification requires current reconciliation: every PublisherAgreement pricing at least one StudentCharge of the term has reconciliation_status IN {COMPUTED, DISPUTED, SETTLED} - NOT_STARTED or STALE rejects"
    error_id: ERR_RECONCILIATION_NOT_CURRENT
    http_status: 409
    applies_to: "POST /disclosure-reports/{report_id}/certify"
  - priority: 60
    category: business_safety
    check: "State filing deadline: current logical date <= term.disclosure_deadline_date"
    error_id: ERR_DISCLOSURE_DEADLINE_PASSED
    http_status: 409
    applies_to: "POST /disclosure-reports/{report_id}/certify"
  - priority: 62
    category: business_referential
    check: "Activation readiness: the agreement has at least one CourseMaterialTitle with status == ACTIVE, and every such title has at least one PricingTier"
    error_id: ERR_AGREEMENT_NOT_ACTIVATABLE
    http_status: 409
    applies_to: "POST /agreements/{agreement_id}/activate"
  - priority: 64
    category: business_referential
    check: "Withdrawal safety: no APPROVED Adoption of this title sits on a CourseSection with ia_status IN {BILLED, AT_RISK}"
    error_id: ERR_TITLE_ALREADY_BILLED
    http_status: 409
    applies_to: "POST /titles/{title_id}/withdraw"
  - priority: 65
    category: business_referential
    check: "The PublisherAgreement pricing the title involved in this operation has status == ACTIVE"
    error_id: ERR_AGREEMENT_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /adoptions/{adoption_id}/approve, POST /sections/{section_id}/flag-inclusive-access, POST /sections/{section_id}/post-charges, POST /enrollments/{enrollment_id}/post-charge"
  - priority: 66
    category: business_referential
    check: "The Enrollment behind the charge is still ENROLLED (a dropped enrollment freezes its charge: no opt-out may be filed, granted, rescinded or resubmitted on it, and no new charge may be posted for it)"
    error_id: ERR_ENROLLMENT_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /opt-out-requests, POST /opt-out-requests/{request_id}/grant, POST /opt-out-requests/{request_id}/rescind, POST /opt-out-requests/{request_id}/resubmit, POST /enrollments/{enrollment_id}/post-charge"
  - priority: 67
    category: business_referential
    check: "The section has at least one Adoption with status == APPROVED (flagging and posting both require an approved adoption)"
    error_id: ERR_ADOPTION_NOT_APPROVED
    http_status: 409
    applies_to: "POST /sections/{section_id}/flag-inclusive-access, POST /sections/{section_id}/post-charges, POST /enrollments/{enrollment_id}/post-charge"
  - priority: 69
    category: business_referential
    check: "The adopted CourseMaterialTitle has status == ACTIVE"
    error_id: ERR_TITLE_WITHDRAWN
    http_status: 409
    applies_to: "POST /adoptions/{adoption_id}/approve, POST /sections/{section_id}/flag-inclusive-access"
  - priority: 71
    category: business_referential
    check: "Agreement coverage: agreement.effective_from <= term.term_start_date AND agreement.effective_to > term.term_end_date"
    error_id: ERR_AGREEMENT_WINDOW_MISMATCH
    http_status: 422
    applies_to: "POST /adoptions/{adoption_id}/approve"
  - priority: 73
    category: business_referential
    check: "supersedes_adoption_id, when supplied, must reference an Adoption on the same section_id with status == APPROVED and a different title_id"
    error_id: ERR_SUPERSEDE_TARGET_INVALID
    http_status: 422
    applies_to: "POST /adoptions"
  - priority: 75
    category: business_temporal
    check: "Faculty adoption deadline: for an adoption with supersedes_adoption_id IS NULL, the current logical date must be <= term.adoption_deadline_date; superseding adoptions are exempt"
    error_id: ERR_ADOPTION_DEADLINE_PASSED
    http_status: 409
    applies_to: "POST /adoptions/{adoption_id}/submit"
  - priority: 77
    category: business_temporal
    check: "Opt-out window: current logical instant <= charge.opt_out_deadline_at (inclusive at the exact boundary)"
    error_id: ERR_OPT_OUT_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /opt-out-requests, POST /opt-out-requests/{request_id}/grant, POST /opt-out-requests/{request_id}/rescind, POST /opt-out-requests/{request_id}/resubmit"
  - priority: 79
    category: business_temporal
    check: "Late registration cutoff: enrolled_on <= term.late_registration_cutoff_date"
    error_id: ERR_LATE_REGISTRATION_CLOSED
    http_status: 409
    applies_to: "POST /enrollments"
  - priority: 81
    category: business_temporal
    check: "enrolled_on >= term.term_start_date - 30 days, and dropped_on >= enrollment.enrolled_on"
    error_id: ERR_ENROLLMENT_DATE_OUT_OF_RANGE
    http_status: 422
    applies_to: "POST /enrollments, POST /enrollments/{enrollment_id}/drop"
  - priority: 83
    category: business_temporal
    check: "Access window: access_end_date > access_start_date, access_start_date >= term.term_start_date, and access_end_date <= term.term_end_date + 1 day (half-open, exclusive end)"
    error_id: ERR_ACCESS_WINDOW_INVALID
    http_status: 422
    applies_to: "POST /adoptions"
  - priority: 85
    category: business_constraint
    check: "Pricing tier bands never overlap: reject when new.min_enrollment <= existing.max_enrollment (null treated as +infinity) AND existing.min_enrollment <= new.max_enrollment (null treated as +infinity). Adjacency (new.min_enrollment == existing.max_enrollment + 1) is legal."
    error_id: ERR_TIER_BAND_OVERLAP
    http_status: 409
    applies_to: "POST /titles/{title_id}/pricing-tiers"
  - priority: 87
    category: business_constraint
    check: "Concurrent title capacity: for every date d in the candidate half-open window [access_start_date, access_end_date), the number of APPROVED Adoptions on the section whose half-open window contains d, counting the candidate, must be <= section.max_concurrent_titles. Windows that merely touch (previous.access_end_date == next.access_start_date) do not overlap."
    error_id: ERR_CONCURRENT_TITLE_LIMIT
    http_status: 409
    applies_to: "POST /adoptions/{adoption_id}/approve"
  - priority: 89
    category: business_constraint
    check: "At most one OptOutRequest with status IN {SUBMITTED, GRANTED} may exist per charge_id"
    error_id: ERR_DUPLICATE_OPT_OUT_OPEN
    http_status: 409
    applies_to: "POST /opt-out-requests"
  - priority: 91
    category: business_constraint
    check: "Opt-out cycle limit: cycle_count < MAX_OPT_OUT_CYCLES (2) to re-enter SUBMITTED from RESCINDED"
    error_id: ERR_OPT_OUT_CYCLE_LIMIT
    http_status: 409
    applies_to: "POST /opt-out-requests/{request_id}/resubmit"
  - priority: 93
    category: business_constraint
    check: "At most one Enrollment with status == ENROLLED per (section_id, student_id)"
    error_id: ERR_DUPLICATE_ENROLLMENT
    http_status: 409
    applies_to: "POST /enrollments"
  - priority: 95
    category: business_constraint
    check: "Business-key uniqueness: AcademicTerm.code, PublisherAgreement.agreement_code, Student.external_id, (agreement_id, isbn) on CourseMaterialTitle, (term_id, subject_code, catalog_number, section_number) on CourseSection, (term_id, reporting_state_code) on DisclosureReport"
    error_id: ERR_DUPLICATE_RESOURCE_KEY
    http_status: 409
    applies_to: "POST /terms, POST /agreements, POST /students, POST /titles, POST /sections, POST /disclosure-reports"
  - priority: 100
    category: business_fiscal
    check: "Charge posting: a PricingTier of the adopted title covers the tier basis enrollment count. Adoption approval: the adopted title carries at least one PricingTier (the tier basis does not exist yet at approval time)."
    error_id: ERR_NO_PRICING_TIER
    http_status: 422
    applies_to: "POST /sections/{section_id}/post-charges, POST /enrollments/{enrollment_id}/post-charge, POST /adoptions/{adoption_id}/approve"
  - priority: 102
    category: business_fiscal
    check: "Batch posting must produce at least one charge: the section has >= 1 Enrollment with status == ENROLLED that has no StudentCharge on the section's currently APPROVED adoption"
    error_id: ERR_NO_BILLABLE_CHARGES
    http_status: 422
    applies_to: "POST /sections/{section_id}/post-charges"
  - priority: 104
    category: business_fiscal
    check: "Single posting: the enrollment has no StudentCharge on the section's currently APPROVED adoption with billing_status IN {POSTED, PARTIALLY_REFUNDED, REFUNDED, REBILLED}"
    error_id: ERR_CHARGE_ALREADY_EXISTS
    http_status: 409
    applies_to: "POST /enrollments/{enrollment_id}/post-charge"
  - priority: 106
    category: business_fiscal
    check: "Direct settlement requires abs(variance_cents) <= VARIANCE_TOLERANCE_CENTS (500); a larger variance must be disputed first"
    error_id: ERR_VARIANCE_TOLERANCE_EXCEEDED
    http_status: 409
    applies_to: "POST /reconciliation-runs/{run_id}/settle"
  - priority: 108
    category: business_fiscal
    check: "A dispute requires abs(variance_cents) > VARIANCE_TOLERANCE_CENTS (500)"
    error_id: ERR_VARIANCE_WITHIN_TOLERANCE
    http_status: 409
    applies_to: "POST /reconciliation-runs/{run_id}/dispute"
  - priority: 110
    category: business_fiscal
    check: "Settlement requires the term to be locked: term.status == BILLING_LOCKED"
    error_id: ERR_TERM_NOT_LOCKED
    http_status: 409
    applies_to: "POST /reconciliation-runs/{run_id}/settle"

# ============================================================================
# 1.5 API Endpoint Table
# ============================================================================
endpoints:
  # ---- logical clock -------------------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    purpose: "Set the logical clock that every date/datetime decision in this API reads. Default before any call: 2026-08-01T00:00:00Z."
    roles: [ProgramAdmin, Faculty, Registrar, BursarOfficer, Student, ComplianceOfficer]
    input: [current_utc]
    output: "{ current_utc: string }"
    side_effects: ["replaces the logical now for all later requests", "no business entity is mutated"]

  # ---- AcademicTerm --------------------------------------------------------
  - method: POST
    path: "/terms"
    purpose: "Create an academic term with its census, add/drop, late-registration, adoption and disclosure calendar"
    roles: [ProgramAdmin]
    input: [code, name, term_start_date, term_end_date, instructional_days, census_date, add_drop_deadline, late_registration_cutoff_date, adoption_deadline_date, disclosure_deadline_date, "opt_out_window_days?"]
    output: AcademicTerm
    side_effects: ["computes total_term_days", "status = PLANNING", "ia_section_count = 0"]
  - method: GET
    path: "/terms/{term_id}"
    purpose: "Read one term"
    roles: [ProgramAdmin, Faculty, Registrar, BursarOfficer, ComplianceOfficer]
    input: []
    output: AcademicTerm
    side_effects: []
  - method: GET
    path: "/terms"
    purpose: "List terms"
    roles: [ProgramAdmin, Faculty, Registrar, BursarOfficer, ComplianceOfficer]
    input: ["code?", "status?", "limit?", "offset?"]
    output: AcademicTerm[]
    side_effects: []
  - method: POST
    path: "/terms/{term_id}/open"
    purpose: "Open the term for section flagging, enrollment and billing"
    roles: [ProgramAdmin]
    input: []
    output: AcademicTerm
    side_effects: ["status PLANNING -> OPEN", "recomputes ia_section_count", "version += 1"]
  - method: POST
    path: "/terms/{term_id}/lock-billing"
    purpose: "Lock the term's billing so reconciliation can be settled"
    roles: [ProgramAdmin]
    input: []
    output: AcademicTerm
    side_effects: ["status OPEN -> BILLING_LOCKED", "charge posting, opt-out submission, rescind and resubmit now fail with ERR_TERM_BILLING_LOCKED", "version += 1"]
  - method: GET
    path: "/terms/{term_id}/sections"
    purpose: "List the sections of a term"
    roles: [ProgramAdmin, Faculty, Registrar, BursarOfficer, ComplianceOfficer]
    input: ["ia_status?", "limit?", "offset?"]
    output: CourseSection[]
    side_effects: []
  - method: GET
    path: "/terms/{term_id}/disclosure-reports"
    purpose: "List the state disclosure reports of a term"
    roles: [ProgramAdmin, ComplianceOfficer]
    input: ["status?", "limit?", "offset?"]
    output: DisclosureReport[]
    side_effects: []

  # ---- Student -------------------------------------------------------------
  - method: POST
    path: "/students"
    purpose: "Create a student record with a zero bursar balance"
    roles: [Registrar]
    input: [external_id, full_name, email, program_code]
    output: Student
    side_effects: ["status = ACTIVE", "bursar_balance_cents = 0"]
  - method: GET
    path: "/students/{student_id}"
    purpose: "Read one student including the derived bursar balance"
    roles: [ProgramAdmin, Registrar, BursarOfficer, ComplianceOfficer, Student]
    input: []
    output: Student
    side_effects: []
  - method: GET
    path: "/students"
    purpose: "List students"
    roles: [ProgramAdmin, Registrar, BursarOfficer]
    input: ["external_id?", "status?", "limit?", "offset?"]
    output: Student[]
    side_effects: []
  - method: GET
    path: "/students/{student_id}/enrollments"
    purpose: "List a student's enrollments"
    roles: [ProgramAdmin, Registrar, BursarOfficer, Student]
    input: ["status?", "limit?", "offset?"]
    output: Enrollment[]
    side_effects: []
  - method: GET
    path: "/students/{student_id}/charges"
    purpose: "List a student's inclusive access charges"
    roles: [ProgramAdmin, Registrar, BursarOfficer, Student]
    input: ["billing_status?", "limit?", "offset?"]
    output: StudentCharge[]
    side_effects: []
  - method: GET
    path: "/students/{student_id}/ledger-entries"
    purpose: "Read the append-only bursar movements of one student"
    roles: [ProgramAdmin, BursarOfficer, Student]
    input: ["entry_type?", "limit?", "offset?"]
    output: LedgerEntry[]
    side_effects: []

  # ---- PublisherAgreement --------------------------------------------------
  - method: POST
    path: "/agreements"
    purpose: "Create a publisher agreement in DRAFT with its fee, margin, cap, floor and rebate terms"
    roles: [ProgramAdmin]
    input: [publisher_name, agreement_code, effective_from, effective_to, admin_fee_pct, bookstore_margin_pct, price_floor_cents, rebate_threshold_cents, rebate_pct, "max_list_price_pct?"]
    output: PublisherAgreement
    side_effects: ["status = DRAFT", "reconciliation_status = NOT_STARTED"]
  - method: GET
    path: "/agreements/{agreement_id}"
    purpose: "Read one agreement with both state dimensions"
    roles: [ProgramAdmin, Faculty, BursarOfficer, ComplianceOfficer]
    input: []
    output: PublisherAgreement
    side_effects: []
  - method: GET
    path: "/agreements"
    purpose: "List agreements"
    roles: [ProgramAdmin, Faculty, BursarOfficer, ComplianceOfficer]
    input: ["agreement_code?", "status?", "reconciliation_status?", "limit?", "offset?"]
    output: PublisherAgreement[]
    side_effects: []
  - method: POST
    path: "/agreements/{agreement_id}/activate"
    purpose: "Activate a DRAFT agreement once every active title has at least one pricing tier"
    roles: [ProgramAdmin]
    input: []
    output: PublisherAgreement
    side_effects: ["status DRAFT -> ACTIVE", "version += 1"]
  - method: POST
    path: "/agreements/{agreement_id}/suspend"
    purpose: "Suspend an ACTIVE agreement, blocking approvals and further charge posting on its titles"
    roles: [ProgramAdmin]
    input: [suspend_reason_note]
    output: PublisherAgreement
    side_effects: ["status ACTIVE -> SUSPENDED", "stores suspend_reason_note", "version += 1", "reconciliation_status is untouched - the two dimensions are independent"]
  - method: GET
    path: "/agreements/{agreement_id}/titles"
    purpose: "List the titles priced by one agreement"
    roles: [ProgramAdmin, Faculty, BursarOfficer, ComplianceOfficer]
    input: ["status?", "limit?", "offset?"]
    output: CourseMaterialTitle[]
    side_effects: []
  - method: GET
    path: "/agreements/{agreement_id}/reconciliation-runs"
    purpose: "List the reconciliation runs of one agreement"
    roles: [ProgramAdmin, BursarOfficer, ComplianceOfficer]
    input: ["term_id?", "status?", "limit?", "offset?"]
    output: ReconciliationRun[]
    side_effects: []

  # ---- CourseMaterialTitle -------------------------------------------------
  - method: POST
    path: "/titles"
    purpose: "Register a course material title under an agreement"
    roles: [ProgramAdmin]
    input: [agreement_id, isbn, title, list_price_cents, format]
    output: CourseMaterialTitle
    side_effects: ["status = ACTIVE"]
  - method: GET
    path: "/titles/{title_id}"
    purpose: "Read one title"
    roles: [ProgramAdmin, Faculty, BursarOfficer, ComplianceOfficer]
    input: []
    output: CourseMaterialTitle
    side_effects: []
  - method: GET
    path: "/titles"
    purpose: "List titles, optionally filtered by the agreement that prices them"
    roles: [ProgramAdmin, Faculty, BursarOfficer, ComplianceOfficer]
    input: ["agreement_id?", "isbn?", "status?", "format?", "limit?", "offset?"]
    output: CourseMaterialTitle[]
    side_effects: []
  - method: POST
    path: "/titles/{title_id}/withdraw"
    purpose: "Withdraw a title from the inclusive access catalog"
    roles: [ProgramAdmin]
    input: []
    output: CourseMaterialTitle
    side_effects: ["status ACTIVE -> WITHDRAWN", "version += 1", "later approvals and flaggings on this title fail with ERR_TITLE_WITHDRAWN"]
  - method: POST
    path: "/titles/{title_id}/pricing-tiers"
    purpose: "Add a non-overlapping enrollment band with its negotiated per-student price"
    roles: [ProgramAdmin]
    input: [min_enrollment, per_student_price_cents, "max_enrollment?"]
    output: PricingTier
    side_effects: ["rejects any band overlapping an existing band of the title with ERR_TIER_BAND_OVERLAP"]
  - method: GET
    path: "/titles/{title_id}/pricing-tiers"
    purpose: "List the enrollment bands of a title"
    roles: [ProgramAdmin, Faculty, BursarOfficer, ComplianceOfficer]
    input: ["limit?", "offset?"]
    output: PricingTier[]
    side_effects: []
  - method: GET
    path: "/pricing-tiers/{tier_id}"
    purpose: "Read one pricing tier"
    roles: [ProgramAdmin, Faculty, BursarOfficer, ComplianceOfficer]
    input: []
    output: PricingTier
    side_effects: []
  - method: GET
    path: "/pricing-tiers"
    purpose: "List pricing tiers, optionally filtered by title"
    roles: [ProgramAdmin, Faculty, BursarOfficer, ComplianceOfficer]
    input: ["title_id?", "limit?", "offset?"]
    output: PricingTier[]
    side_effects: []

  # ---- CourseSection -------------------------------------------------------
  - method: POST
    path: "/sections"
    purpose: "Create a course section owned by a Faculty operator"
    roles: [Registrar, ProgramAdmin]
    input: [term_id, subject_code, catalog_number, section_number, instructor_user_id, "max_concurrent_titles?"]
    output: CourseSection
    side_effects: ["ia_status = NOT_FLAGGED", "inclusive_access_flag = false", "all counters 0", "participation_rate = 0.0000"]
  - method: GET
    path: "/sections/{section_id}"
    purpose: "Read one section with its live counters and participation rate"
    roles: [ProgramAdmin, Faculty, Registrar, BursarOfficer, ComplianceOfficer]
    input: []
    output: CourseSection
    side_effects: []
  - method: GET
    path: "/sections"
    purpose: "List sections, optionally filtered by term"
    roles: [ProgramAdmin, Faculty, Registrar, BursarOfficer, ComplianceOfficer]
    input: ["term_id?", "ia_status?", "instructor_user_id?", "limit?", "offset?"]
    output: CourseSection[]
    side_effects: []
  - method: POST
    path: "/sections/{section_id}/flag-inclusive-access"
    purpose: "Flag the section for day-one LMS material delivery under its approved adoption"
    roles: [ProgramAdmin]
    input: []
    output: CourseSection
    side_effects: ["ia_status NOT_FLAGGED -> FLAGGED", "inclusive_access_flag = true", "recomputes AcademicTerm.ia_section_count", "version += 1"]
  - method: GET
    path: "/sections/{section_id}/adoptions"
    purpose: "List the adoptions of a section"
    roles: [ProgramAdmin, Faculty, Registrar, BursarOfficer, ComplianceOfficer]
    input: ["status?", "limit?", "offset?"]
    output: Adoption[]
    side_effects: []
  - method: GET
    path: "/sections/{section_id}/enrollments"
    purpose: "List the enrollments of a section"
    roles: [ProgramAdmin, Faculty, Registrar, BursarOfficer]
    input: ["status?", "registration_type?", "limit?", "offset?"]
    output: Enrollment[]
    side_effects: []
  - method: GET
    path: "/sections/{section_id}/billing-summary"
    purpose: "Computed read exposing both tier-basis variants of calculations.per_student_negotiated_price side by side plus the section money rollup"
    roles: [ProgramAdmin, BursarOfficer, ComplianceOfficer]
    input: []
    output: "{ section_id: string, ia_status: string, billing_basis_enrollment_count: integer, tier_basis_posting_count: integer, tier_basis_census_count: integer, gross_per_student_posting_cents: integer, gross_per_student_census_cents: integer, charge_count: integer, posted_charge_count: integer, refunded_charge_count: integer, total_net_billed_cents: integer, total_publisher_share_cents: integer, provisioned_access_count: integer, revoked_access_count: integer, participation_rate: number }"
    side_effects: ["no mutation; every figure is derived at read time"]
  - method: POST
    path: "/sections/{section_id}/post-charges"
    purpose: "Batch-post day-one charges for every uncharged ENROLLED student of the section and provision LMS access"
    roles: [BursarOfficer, ProgramAdmin]
    input: []
    output: StudentCharge[]
    side_effects: ["creates one StudentCharge per uncharged ENROLLED enrollment, ordered by Enrollment.enrolled_on ASC then Student.external_id ASC", "each row goes PENDING -> POSTED and NOT_PROVISIONED -> PROVISIONED in this request", "appends one CHARGE / INITIAL_POST LedgerEntry per charge", "on the first successful post: freezes billing_basis_enrollment_count, stamps first_posted_at, ia_status FLAGGED -> BILLED", "recomputes section counters, participation_rate and Student.bursar_balance_cents"]

  # ---- Adoption ------------------------------------------------------------
  - method: POST
    path: "/adoptions"
    purpose: "Author a faculty adoption in DRAFT, optionally as a title change superseding the section's approved adoption"
    roles: [Faculty]
    input: [section_id, title_id, access_start_date, access_end_date, expected_section_version, "supersedes_adoption_id?"]
    output: Adoption
    side_effects: ["status = DRAFT", "revision_count = 0", "requires_rebill = false", "rejects a stale expected_section_version with ERR_STALE_SECTION_VERSION (412)"]
  - method: GET
    path: "/adoptions/{adoption_id}"
    purpose: "Read one adoption"
    roles: [ProgramAdmin, Faculty, Registrar, BursarOfficer, ComplianceOfficer]
    input: []
    output: Adoption
    side_effects: []
  - method: GET
    path: "/adoptions"
    purpose: "List adoptions, optionally filtered by section, title or the adoption they supersede"
    roles: [ProgramAdmin, Faculty, Registrar, BursarOfficer, ComplianceOfficer]
    input: ["section_id?", "title_id?", "supersedes_adoption_id?", "status?", "limit?", "offset?"]
    output: Adoption[]
    side_effects: []
  - method: POST
    path: "/adoptions/{adoption_id}/submit"
    purpose: "Submit or resubmit an adoption for program approval"
    roles: [Faculty]
    input: []
    output: Adoption
    side_effects: ["DRAFT -> SUBMITTED or CHANGE_REQUESTED -> SUBMITTED (revision_count += 1)", "stamps submitted_by_user_id from X-User-ID and submitted_at from the logical clock", "enforces term.adoption_deadline_date unless supersedes_adoption_id is set"]
  - method: POST
    path: "/adoptions/{adoption_id}/request-change"
    purpose: "Return a submitted adoption to the instructor for revision"
    roles: [ProgramAdmin]
    input: [change_note]
    output: Adoption
    side_effects: ["SUBMITTED -> CHANGE_REQUESTED", "stores change_note"]
  - method: POST
    path: "/adoptions/{adoption_id}/approve"
    purpose: "Approve an adoption, pin its list price and - for a title change - supersede and rebill the prior adoption"
    roles: [ProgramAdmin]
    input: []
    output: Adoption
    side_effects: ["SUBMITTED -> APPROVED", "pins locked_list_price_cents", "stamps approved_by_user_id / approved_at", "rejects the submitter as approver with ERR_SEGREGATION_OF_DUTIES", "superseding case: 4-hop cascade - old adoption -> SUPERSEDED, charges repointed and rebilled per calculations.rebill_delta, section counters recomputed, agreement.reconciliation_status -> STALE"]
  - method: POST
    path: "/adoptions/{adoption_id}/withdraw"
    purpose: "Withdraw an approved adoption before any charge has posted on its section"
    roles: [ProgramAdmin]
    input: []
    output: Adoption
    side_effects: ["APPROVED -> WITHDRAWN", "if no APPROVED adoption remains: section.inclusive_access_flag = false, ia_status -> NOT_FLAGGED, AcademicTerm.ia_section_count recomputed"]

  # ---- Enrollment ----------------------------------------------------------
  - method: POST
    path: "/enrollments"
    purpose: "Register a student in a section; the registration date drives proration"
    roles: [Registrar]
    input: [section_id, student_id, enrolled_on]
    output: Enrollment
    side_effects: ["status = ENROLLED", "computes registration_type (REGULAR / LATE) from term.add_drop_deadline", "recomputes CourseSection.enrolled_count and participation_rate", "rejects enrolled_on past term.late_registration_cutoff_date with ERR_LATE_REGISTRATION_CLOSED"]
  - method: GET
    path: "/enrollments/{enrollment_id}"
    purpose: "Read one enrollment"
    roles: [ProgramAdmin, Faculty, Registrar, BursarOfficer]
    input: []
    output: Enrollment
    side_effects: []
  - method: GET
    path: "/enrollments"
    purpose: "List enrollments, optionally filtered by section or student"
    roles: [ProgramAdmin, Faculty, Registrar, BursarOfficer]
    input: ["section_id?", "student_id?", "status?", "registration_type?", "limit?", "offset?"]
    output: Enrollment[]
    side_effects: []
  - method: POST
    path: "/enrollments/{enrollment_id}/drop"
    purpose: "Drop an enrollment, prorate any posted charge and revoke LMS access"
    roles: [Registrar]
    input: [dropped_on]
    output: Enrollment
    side_effects: ["ENROLLED -> DROPPED, stores dropped_on", "4-hop cascade: charge refunded per calculations.drop_refund (-> REFUNDED or PARTIALLY_REFUNDED) and access revoked, REFUND / DROP_PRORATION LedgerEntry appended, section counters and participation_rate recomputed (BILLED -> AT_RISK when below MIN_PARTICIPATION_RATE), agreement.reconciliation_status -> STALE"]
  - method: GET
    path: "/enrollments/{enrollment_id}/charges"
    purpose: "List the charges of one enrollment"
    roles: [ProgramAdmin, Registrar, BursarOfficer, Student]
    input: ["billing_status?", "limit?", "offset?"]
    output: StudentCharge[]
    side_effects: []
  - method: POST
    path: "/enrollments/{enrollment_id}/post-charge"
    purpose: "Post a single day-one charge for one (usually late-registered) enrollment"
    roles: [BursarOfficer, ProgramAdmin]
    input: []
    output: StudentCharge
    side_effects: ["creates one StudentCharge, PENDING -> POSTED and NOT_PROVISIONED -> PROVISIONED in this request", "prices with the frozen billing_basis_enrollment_count, prorates per calculations.charge_proration_pct", "appends a CHARGE LedgerEntry (reason_code LATE_REGISTRATION_POST when the enrollment is LATE, else INITIAL_POST)", "recomputes section counters, participation_rate and Student.bursar_balance_cents"]

  # ---- StudentCharge / LedgerEntry ----------------------------------------
  - method: GET
    path: "/charges/{charge_id}"
    purpose: "Read one charge with both of its state dimensions and its money fields"
    roles: [ProgramAdmin, Registrar, BursarOfficer, ComplianceOfficer, Student]
    input: []
    output: StudentCharge
    side_effects: []
  - method: GET
    path: "/charges"
    purpose: "List charges, optionally filtered by enrollment, adoption or student"
    roles: [ProgramAdmin, Registrar, BursarOfficer, ComplianceOfficer]
    input: ["enrollment_id?", "adoption_id?", "student_id?", "billing_status?", "access_status?", "limit?", "offset?"]
    output: StudentCharge[]
    side_effects: []
  - method: GET
    path: "/charges/{charge_id}/ledger-entries"
    purpose: "Read the append-only bursar movements of one charge in posting order"
    roles: [ProgramAdmin, BursarOfficer, ComplianceOfficer, Student]
    input: ["entry_type?", "limit?", "offset?"]
    output: LedgerEntry[]
    side_effects: []
  - method: GET
    path: "/charges/{charge_id}/opt-out-requests"
    purpose: "List the opt-out requests filed against one charge"
    roles: [ProgramAdmin, BursarOfficer, ComplianceOfficer, Student]
    input: ["status?", "limit?", "offset?"]
    output: OptOutRequest[]
    side_effects: []
  - method: GET
    path: "/ledger-entries/{entry_id}"
    purpose: "Read one immutable bursar movement"
    roles: [ProgramAdmin, BursarOfficer, ComplianceOfficer]
    input: []
    output: LedgerEntry
    side_effects: []
  - method: GET
    path: "/ledger-entries"
    purpose: "List bursar movements, optionally filtered by charge or student"
    roles: [ProgramAdmin, BursarOfficer, ComplianceOfficer]
    input: ["charge_id?", "student_id?", "entry_type?", "reason_code?", "limit?", "offset?"]
    output: LedgerEntry[]
    side_effects: []

  # ---- OptOutRequest -------------------------------------------------------
  - method: POST
    path: "/opt-out-requests"
    purpose: "File an opt-out against a posted charge inside its opt-out window"
    roles: [Student]
    input: [charge_id, reason_code]
    output: OptOutRequest
    side_effects: ["status = SUBMITTED, stamps submitted_at", "cycle_count = 0", "enforces one open request per charge (ERR_DUPLICATE_OPT_OUT_OPEN) and the charge's opt_out_deadline_at (ERR_OPT_OUT_WINDOW_CLOSED)"]
  - method: GET
    path: "/opt-out-requests/{request_id}"
    purpose: "Read one opt-out request"
    roles: [ProgramAdmin, BursarOfficer, ComplianceOfficer, Student]
    input: []
    output: OptOutRequest
    side_effects: []
  - method: GET
    path: "/opt-out-requests"
    purpose: "List opt-out requests, optionally filtered by charge"
    roles: [ProgramAdmin, BursarOfficer, ComplianceOfficer]
    input: ["charge_id?", "status?", "reason_code?", "limit?", "offset?"]
    output: OptOutRequest[]
    side_effects: []
  - method: POST
    path: "/opt-out-requests/{request_id}/grant"
    purpose: "Grant an opt-out: refund the bursar charge and revoke LMS access"
    roles: [BursarOfficer]
    input: []
    output: OptOutRequest
    side_effects: ["SUBMITTED -> GRANTED, stores refund_amount_cents / decided_at / decided_by_user_id", "3-hop cascade: charge -> REFUNDED and access -> REVOKED with a REFUND / OPT_OUT_REFUND LedgerEntry, section counters + participation_rate recomputed (BILLED -> AT_RISK below MIN_PARTICIPATION_RATE), agreement.reconciliation_status COMPUTED|DISPUTED -> STALE"]
  - method: POST
    path: "/opt-out-requests/{request_id}/deny"
    purpose: "Deny an opt-out with a reason note; no money and no access change"
    roles: [BursarOfficer]
    input: [denial_note]
    output: OptOutRequest
    side_effects: ["SUBMITTED -> DENIED, stores denial_note / decided_at / decided_by_user_id", "no LedgerEntry is appended and no counter moves"]
  - method: POST
    path: "/opt-out-requests/{request_id}/rescind"
    purpose: "Student opts back in: re-charge the bursar account and restore LMS access"
    roles: [Student]
    input: []
    output: OptOutRequest
    side_effects: ["GRANTED -> RESCINDED, stores recharge_amount_cents / rescinded_at", "compensating 3-hop cascade: charge -> POSTED with a CHARGE / OPT_IN_RECHARGE LedgerEntry and access -> RESTORED, section counters recomputed (AT_RISK -> BILLED at or above MIN_PARTICIPATION_RATE), agreement.reconciliation_status -> STALE", "both conserved quantities return to their pre-grant values"]
  - method: POST
    path: "/opt-out-requests/{request_id}/resubmit"
    purpose: "Re-file a rescinded opt-out, up to MAX_OPT_OUT_CYCLES times"
    roles: [Student]
    input: [reason_code]
    output: OptOutRequest
    side_effects: ["RESCINDED -> SUBMITTED, cycle_count += 1, refreshes submitted_at and reason_code, clears decided_at / decided_by_user_id", "no money movement - the recharge already happened on rescind", "rejects the third cycle with ERR_OPT_OUT_CYCLE_LIMIT"]

  # ---- ReconciliationRun ---------------------------------------------------
  - method: POST
    path: "/reconciliation-runs"
    purpose: "Compute a publisher reconciliation for one (agreement, term) pair under the chosen method and compare it with the publisher's invoice"
    roles: [ProgramAdmin]
    input: [agreement_id, term_id, method, publisher_reported_count, publisher_reported_amount_cents, expected_agreement_version, "supersedes_run_id?"]
    output: ReconciliationRun
    side_effects: ["status = COMPUTED", "computes billable_count, opted_out_count and gross_invoice_cents per calculations.reconciliation_totals (method-dependent)", "computes rebate_cents, settlement_amount_cents, count_variance and variance_cents per calculations.settlement_amount", "agreement.reconciliation_status NOT_STARTED|STALE -> COMPUTED, version += 1", "supersedes_run_id case: the prior COMPUTED run -> SUPERSEDED", "rejects a stale expected_agreement_version with ERR_STALE_AGREEMENT_VERSION (412)"]
  - method: GET
    path: "/reconciliation-runs/{run_id}"
    purpose: "Read one reconciliation run with its invoice, rebate and variance figures"
    roles: [ProgramAdmin, BursarOfficer, ComplianceOfficer]
    input: []
    output: ReconciliationRun
    side_effects: []
  - method: GET
    path: "/reconciliation-runs"
    purpose: "List reconciliation runs, optionally filtered by agreement, term or the run they supersede"
    roles: [ProgramAdmin, BursarOfficer, ComplianceOfficer]
    input: ["agreement_id?", "term_id?", "supersedes_run_id?", "status?", "method?", "limit?", "offset?"]
    output: ReconciliationRun[]
    side_effects: []
  - method: POST
    path: "/reconciliation-runs/{run_id}/dispute"
    purpose: "Dispute a run whose variance against the publisher invoice exceeds tolerance"
    roles: [ProgramAdmin]
    input: [dispute_note]
    output: ReconciliationRun
    side_effects: ["COMPUTED -> DISPUTED, stores dispute_note", "agreement.reconciliation_status COMPUTED -> DISPUTED, version += 1", "rejects a within-tolerance variance with ERR_VARIANCE_WITHIN_TOLERANCE"]
  - method: POST
    path: "/reconciliation-runs/{run_id}/settle"
    purpose: "Settle a run against the publisher, closing the term and publishing certified disclosures"
    roles: [ProgramAdmin]
    input: []
    output: ReconciliationRun
    side_effects: ["COMPUTED -> SETTLED (requires abs(variance_cents) <= VARIANCE_TOLERANCE_CENTS) or DISPUTED -> SETTLED (no tolerance test)", "stamps settled_at / settled_by_user_id", "3-hop cascade: agreement.reconciliation_status -> SETTLED with settled_amount_cents = settlement_amount_cents (COMPUTED branch) or publisher_reported_amount_cents (DISPUTED branch), term BILLING_LOCKED -> CLOSED once every agreement of the term is SETTLED, every CERTIFIED DisclosureReport of the term -> PUBLISHED"]

  # ---- DisclosureReport ----------------------------------------------------
  - method: POST
    path: "/disclosure-reports"
    purpose: "Open a state textbook cost disclosure draft for a term"
    roles: [ComplianceOfficer]
    input: [term_id, reporting_state_code]
    output: DisclosureReport
    side_effects: ["status = DRAFT", "computes every affordability metric per calculations.affordability_metrics", "amendment_count = 0"]
  - method: GET
    path: "/disclosure-reports/{report_id}"
    purpose: "Read one disclosure report with its affordability metrics and compliance verdict"
    roles: [ProgramAdmin, ComplianceOfficer, BursarOfficer]
    input: []
    output: DisclosureReport
    side_effects: []
  - method: GET
    path: "/disclosure-reports"
    purpose: "List disclosure reports, optionally filtered by term"
    roles: [ProgramAdmin, ComplianceOfficer, BursarOfficer]
    input: ["term_id?", "reporting_state_code?", "status?", "compliance_status?", "limit?", "offset?"]
    output: DisclosureReport[]
    side_effects: []
  - method: POST
    path: "/disclosure-reports/{report_id}/certify"
    purpose: "Certify the disclosure for state filing once every publisher agreement of the term has a current reconciliation"
    roles: [ComplianceOfficer]
    input: []
    output: DisclosureReport
    side_effects: ["DRAFT -> CERTIFIED, stamps certified_at / certified_by_user_id", "recomputes every affordability metric", "rejects a STALE or NOT_STARTED agreement with ERR_RECONCILIATION_NOT_CURRENT and a late filing with ERR_DISCLOSURE_DEADLINE_PASSED"]
  - method: POST
    path: "/disclosure-reports/{report_id}/amend"
    purpose: "Reopen a certified disclosure for amendment"
    roles: [ComplianceOfficer]
    input: [amendment_note]
    output: DisclosureReport
    side_effects: ["CERTIFIED -> DRAFT, amendment_count += 1, stores amendment_note, clears certified_at / certified_by_user_id", "recomputes every affordability metric", "a PUBLISHED report can never be amended"]

# ============================================================================
# 1.6 Error Catalog
# ============================================================================
errors:
  - error_id: ERR_UNAUTHENTICATED
    http_status: 401
    message: "Authentication headers are missing or the role is not recognized"
    triggered_by: "X-User-Role or X-User-ID absent, or X-User-Role is not one of the six declared roles"
  - error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    message: "This role may not perform this operation"
    triggered_by: "X-User-Role is not listed in the endpoint's roles"
  - error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    message: "The caller does not own this resource"
    triggered_by: "A Student acting on another student's charge or opt-out request, or a Faculty authoring/submitting an adoption on a section owned by a different instructor_user_id"
  - error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    message: "The operator who submitted this adoption may not approve it"
    triggered_by: "POST /adoptions/{adoption_id}/approve with X-User-ID == adoption.submitted_by_user_id"
  - error_id: ERR_INVALID_REQUEST
    http_status: 400
    message: "The request body is missing a required field or contains an invalid value"
    triggered_by: "Missing required field, wrong type, unknown enum member, out-of-range number, unknown field"
  - error_id: ERR_TERM_NOT_FOUND
    http_status: 404
    message: "Academic term not found"
    triggered_by: "term_id in a path or body does not resolve"
  - error_id: ERR_STUDENT_NOT_FOUND
    http_status: 404
    message: "Student not found"
    triggered_by: "student_id in a path or body does not resolve"
  - error_id: ERR_AGREEMENT_NOT_FOUND
    http_status: 404
    message: "Publisher agreement not found"
    triggered_by: "agreement_id in a path or body does not resolve"
  - error_id: ERR_TITLE_NOT_FOUND
    http_status: 404
    message: "Course material title not found"
    triggered_by: "title_id in a path or body does not resolve"
  - error_id: ERR_TIER_NOT_FOUND
    http_status: 404
    message: "Pricing tier not found"
    triggered_by: "tier_id in a path does not resolve"
  - error_id: ERR_SECTION_NOT_FOUND
    http_status: 404
    message: "Course section not found"
    triggered_by: "section_id in a path or body does not resolve"
  - error_id: ERR_ADOPTION_NOT_FOUND
    http_status: 404
    message: "Adoption not found"
    triggered_by: "adoption_id or supersedes_adoption_id does not resolve"
  - error_id: ERR_ENROLLMENT_NOT_FOUND
    http_status: 404
    message: "Enrollment not found"
    triggered_by: "enrollment_id in a path or body does not resolve"
  - error_id: ERR_CHARGE_NOT_FOUND
    http_status: 404
    message: "Student charge not found"
    triggered_by: "charge_id in a path or body does not resolve"
  - error_id: ERR_LEDGER_ENTRY_NOT_FOUND
    http_status: 404
    message: "Ledger entry not found"
    triggered_by: "entry_id in a path does not resolve"
  - error_id: ERR_OPT_OUT_REQUEST_NOT_FOUND
    http_status: 404
    message: "Opt-out request not found"
    triggered_by: "request_id in a path does not resolve"
  - error_id: ERR_RUN_NOT_FOUND
    http_status: 404
    message: "Reconciliation run not found"
    triggered_by: "run_id or supersedes_run_id does not resolve"
  - error_id: ERR_REPORT_NOT_FOUND
    http_status: 404
    message: "Disclosure report not found"
    triggered_by: "report_id in a path does not resolve"
  - error_id: ERR_STALE_SECTION_VERSION
    http_status: 412
    message: "The course section has changed since it was read"
    triggered_by: "POST /adoptions with expected_section_version != section.version"
  - error_id: ERR_STALE_AGREEMENT_VERSION
    http_status: 412
    message: "The publisher agreement has changed since it was read"
    triggered_by: "POST /reconciliation-runs with expected_agreement_version != agreement.version"
  - error_id: ERR_INVALID_STATE
    http_status: 409
    message: "The entity is not in a state that allows this transition"
    triggered_by: "Any transition endpoint invoked from a state that does not declare it in 1.2, including a repeated terminal transition, a SUPERSEDED run or a PUBLISHED report"
  - error_id: ERR_TERM_BILLING_LOCKED
    http_status: 409
    message: "The term's billing is locked; charges and opt-out changes are frozen"
    triggered_by: "Charge posting, opt-out submission, rescind or resubmit while term.status IN {BILLING_LOCKED, CLOSED}"
  - error_id: ERR_TERM_NOT_OPEN
    http_status: 409
    message: "The term is not open for this operation"
    triggered_by: "Section flagging while term.status != OPEN, or adoption submit/approve while term.status NOT IN {PLANNING, OPEN}"
  - error_id: ERR_TERM_NOT_LOCKED
    http_status: 409
    message: "The term's billing must be locked before a reconciliation run can be settled"
    triggered_by: "POST /reconciliation-runs/{run_id}/settle while term.status != BILLING_LOCKED"
  - error_id: ERR_SECTION_NOT_FLAGGED
    http_status: 409
    message: "The section is not flagged for inclusive access"
    triggered_by: "Charge posting while section.ia_status NOT IN {FLAGGED, BILLED}"
  - error_id: ERR_RECONCILIATION_NOT_CURRENT
    http_status: 409
    message: "A publisher agreement of this term has no current reconciliation"
    triggered_by: "POST /disclosure-reports/{report_id}/certify while some agreement pricing a charge of the term has reconciliation_status IN {NOT_STARTED, STALE}"
  - error_id: ERR_DISCLOSURE_DEADLINE_PASSED
    http_status: 409
    message: "The state disclosure filing deadline has passed"
    triggered_by: "POST /disclosure-reports/{report_id}/certify after term.disclosure_deadline_date"
  - error_id: ERR_AGREEMENT_NOT_ACTIVE
    http_status: 409
    message: "The publisher agreement pricing this title is not active"
    triggered_by: "Adoption approval, section flagging or charge posting on a title of a DRAFT or SUSPENDED agreement"
  - error_id: ERR_AGREEMENT_NOT_ACTIVATABLE
    http_status: 409
    message: "The agreement has no active title, or an active title has no pricing tier"
    triggered_by: "POST /agreements/{agreement_id}/activate before the catalog is complete"
  - error_id: ERR_ADOPTION_NOT_APPROVED
    http_status: 409
    message: "The section has no approved adoption"
    triggered_by: "Section flagging or charge posting with no APPROVED Adoption on the section"
  - error_id: ERR_ENROLLMENT_NOT_ACTIVE
    http_status: 409
    message: "The enrollment behind this charge has been dropped"
    triggered_by: "Opt-out create/grant/rescind/resubmit on a charge whose Enrollment.status == DROPPED, or POST /enrollments/{enrollment_id}/post-charge for a dropped enrollment"
  - error_id: ERR_TITLE_WITHDRAWN
    http_status: 409
    message: "The course material title has been withdrawn"
    triggered_by: "Adoption approval or section flagging on a title with status == WITHDRAWN"
  - error_id: ERR_TITLE_ALREADY_BILLED
    http_status: 409
    message: "A title adopted by a billed section cannot be withdrawn"
    triggered_by: "POST /titles/{title_id}/withdraw while an APPROVED adoption of the title sits on a section with ia_status IN {BILLED, AT_RISK}"
  - error_id: ERR_AGREEMENT_WINDOW_MISMATCH
    http_status: 422
    message: "The agreement's effective window does not cover the term"
    triggered_by: "POST /adoptions/{adoption_id}/approve when agreement.effective_from > term.term_start_date or agreement.effective_to <= term.term_end_date"
  - error_id: ERR_SUPERSEDE_TARGET_INVALID
    http_status: 422
    message: "The superseded adoption is not an approved adoption of the same section with a different title"
    triggered_by: "POST /adoptions with a supersedes_adoption_id pointing at a different section, a non-APPROVED adoption, or the same title_id"
  - error_id: ERR_ADOPTION_DEADLINE_PASSED
    http_status: 409
    message: "The faculty adoption deadline for this term has passed"
    triggered_by: "POST /adoptions/{adoption_id}/submit after term.adoption_deadline_date on an adoption with supersedes_adoption_id == null"
  - error_id: ERR_OPT_OUT_WINDOW_CLOSED
    http_status: 409
    message: "The opt-out window for this charge has closed"
    triggered_by: "Opt-out create, grant, rescind or resubmit after charge.opt_out_deadline_at"
  - error_id: ERR_LATE_REGISTRATION_CLOSED
    http_status: 409
    message: "The late registration period for this term has closed"
    triggered_by: "POST /enrollments with enrolled_on > term.late_registration_cutoff_date"
  - error_id: ERR_ENROLLMENT_DATE_OUT_OF_RANGE
    http_status: 422
    message: "The enrollment or drop date is outside the acceptable range"
    triggered_by: "enrolled_on earlier than term_start_date - 30 days, or dropped_on earlier than enrolled_on"
  - error_id: ERR_ACCESS_WINDOW_INVALID
    http_status: 422
    message: "The LMS access window is not a valid half-open interval inside the term"
    triggered_by: "POST /adoptions with access_end_date <= access_start_date, access_start_date < term.term_start_date, or access_end_date > term.term_end_date + 1 day"
  - error_id: ERR_TIER_BAND_OVERLAP
    http_status: 409
    message: "The enrollment band overlaps an existing pricing tier of this title"
    triggered_by: "POST /titles/{title_id}/pricing-tiers with a band intersecting an existing band"
  - error_id: ERR_CONCURRENT_TITLE_LIMIT
    http_status: 409
    message: "Approving this adoption would exceed the section's concurrent title limit"
    triggered_by: "POST /adoptions/{adoption_id}/approve when some date is covered by more than max_concurrent_titles approved access windows"
  - error_id: ERR_DUPLICATE_OPT_OUT_OPEN
    http_status: 409
    message: "An open opt-out request already exists for this charge"
    triggered_by: "POST /opt-out-requests while an OptOutRequest with status IN {SUBMITTED, GRANTED} exists on the charge"
  - error_id: ERR_OPT_OUT_CYCLE_LIMIT
    http_status: 409
    message: "This opt-out request has reached its resubmission limit"
    triggered_by: "POST /opt-out-requests/{request_id}/resubmit with cycle_count == MAX_OPT_OUT_CYCLES"
  - error_id: ERR_DUPLICATE_ENROLLMENT
    http_status: 409
    message: "The student is already enrolled in this section"
    triggered_by: "POST /enrollments with an existing ENROLLED enrollment for the same (section_id, student_id)"
  - error_id: ERR_DUPLICATE_RESOURCE_KEY
    http_status: 409
    message: "A resource with this business key already exists"
    triggered_by: "Duplicate AcademicTerm.code, PublisherAgreement.agreement_code, Student.external_id, (agreement_id, isbn), (term_id, subject_code, catalog_number, section_number) or (term_id, reporting_state_code)"
  - error_id: ERR_NO_PRICING_TIER
    http_status: 422
    message: "No pricing tier of the adopted title covers this enrollment count"
    triggered_by: "Charge posting or adoption approval when the tier basis enrollment count falls outside every band of the title"
  - error_id: ERR_NO_BILLABLE_CHARGES
    http_status: 422
    message: "The section has no uncharged enrolled student to bill"
    triggered_by: "POST /sections/{section_id}/post-charges when every ENROLLED enrollment already carries a charge on the current approved adoption, or the section has no ENROLLED enrollment"
  - error_id: ERR_CHARGE_ALREADY_EXISTS
    http_status: 409
    message: "This enrollment already carries a charge on the section's approved adoption"
    triggered_by: "POST /enrollments/{enrollment_id}/post-charge for an already-charged enrollment"
  - error_id: ERR_VARIANCE_TOLERANCE_EXCEEDED
    http_status: 409
    message: "The variance against the publisher invoice exceeds the settlement tolerance"
    triggered_by: "POST /reconciliation-runs/{run_id}/settle from COMPUTED with abs(variance_cents) > VARIANCE_TOLERANCE_CENTS"
  - error_id: ERR_VARIANCE_WITHIN_TOLERANCE
    http_status: 409
    message: "The variance against the publisher invoice is within tolerance and cannot be disputed"
    triggered_by: "POST /reconciliation-runs/{run_id}/dispute with abs(variance_cents) <= VARIANCE_TOLERANCE_CENTS"

# ============================================================================
# 1.7 RBAC Table (role_model: segregation_of_duties)
# ============================================================================
roles:
  - name: ProgramAdmin
    description: "Inclusive access program office. Opaque operator id in X-User-ID; not backed by any entity. Owns the term calendar, the publisher catalog, section flagging, adoption review and publisher reconciliation. May approve an adoption only if a different operator submitted it."
    entity_backed: null
    exclusive_operations:
      - "POST /terms, POST /terms/{term_id}/open, POST /terms/{term_id}/lock-billing"
      - "POST /agreements, POST /agreements/{agreement_id}/activate, POST /agreements/{agreement_id}/suspend"
      - "POST /titles, POST /titles/{title_id}/withdraw, POST /titles/{title_id}/pricing-tiers"
      - "POST /sections/{section_id}/flag-inclusive-access"
      - "POST /adoptions/{adoption_id}/request-change, POST /adoptions/{adoption_id}/approve, POST /adoptions/{adoption_id}/withdraw"
      - "POST /reconciliation-runs, POST /reconciliation-runs/{run_id}/dispute, POST /reconciliation-runs/{run_id}/settle"
    shared_operations:
      - "POST /sections (with Registrar)"
      - "POST /sections/{section_id}/post-charges and POST /enrollments/{enrollment_id}/post-charge (with BursarOfficer)"
      - "every GET read except GET /students/{student_id}/enrollments scoped reads reserved to the owning Student"
      - "POST /_clock/set_current_utc"
  - name: Faculty
    description: "Course instructor. Opaque operator id in X-User-ID, matched against CourseSection.instructor_user_id for ownership. Authors and submits adoptions but can never approve one - that is the segregation-of-duties boundary of this domain."
    entity_backed: null
    exclusive_operations:
      - "POST /adoptions"
      - "POST /adoptions/{adoption_id}/submit"
    shared_operations:
      - "GET /terms, GET /terms/{term_id}, GET /sections, GET /sections/{section_id}, GET /sections/{section_id}/adoptions, GET /sections/{section_id}/enrollments"
      - "GET /agreements, GET /agreements/{agreement_id}, GET /agreements/{agreement_id}/titles, GET /titles, GET /titles/{title_id}, GET /titles/{title_id}/pricing-tiers, GET /pricing-tiers, GET /pricing-tiers/{tier_id}"
      - "GET /adoptions, GET /adoptions/{adoption_id}, GET /enrollments, GET /enrollments/{enrollment_id}"
      - "POST /_clock/set_current_utc"
  - name: Registrar
    description: "Registrar's office. Opaque operator id. Owns the student roster, section creation and every enrollment movement, including drops that trigger proration refunds."
    entity_backed: null
    exclusive_operations:
      - "POST /students"
      - "POST /enrollments"
      - "POST /enrollments/{enrollment_id}/drop"
    shared_operations:
      - "POST /sections (with ProgramAdmin)"
      - "GET /students, GET /students/{student_id}, GET /students/{student_id}/enrollments, GET /students/{student_id}/charges"
      - "GET /terms, GET /terms/{term_id}, GET /terms/{term_id}/sections, GET /sections, GET /sections/{section_id}, GET /sections/{section_id}/adoptions, GET /sections/{section_id}/enrollments"
      - "GET /adoptions, GET /adoptions/{adoption_id}, GET /enrollments, GET /enrollments/{enrollment_id}, GET /enrollments/{enrollment_id}/charges, GET /charges, GET /charges/{charge_id}"
      - "POST /_clock/set_current_utc"
  - name: BursarOfficer
    description: "Bursar / student accounts office. Opaque operator id. Posts inclusive access charges to bursar accounts and decides opt-out requests, but may never file or rescind one on a student's behalf."
    entity_backed: null
    exclusive_operations:
      - "POST /opt-out-requests/{request_id}/grant"
      - "POST /opt-out-requests/{request_id}/deny"
    shared_operations:
      - "POST /sections/{section_id}/post-charges and POST /enrollments/{enrollment_id}/post-charge (with ProgramAdmin)"
      - "GET /charges, GET /charges/{charge_id}, GET /charges/{charge_id}/ledger-entries, GET /charges/{charge_id}/opt-out-requests, GET /ledger-entries, GET /ledger-entries/{entry_id}"
      - "GET /students/{student_id}, GET /students/{student_id}/charges, GET /students/{student_id}/ledger-entries, GET /sections/{section_id}/billing-summary"
      - "GET /opt-out-requests, GET /opt-out-requests/{request_id}, GET /reconciliation-runs, GET /reconciliation-runs/{run_id}, GET /disclosure-reports, GET /disclosure-reports/{report_id}"
      - "POST /_clock/set_current_utc"
  - name: Student
    description: "The billed student. X-User-ID is the Student.id, so every operation is ownership-checked against StudentCharge.student_id. Files, rescinds and re-files opt-outs; can never grant one."
    entity_backed: "entity_backed:Student"
    exclusive_operations:
      - "POST /opt-out-requests"
      - "POST /opt-out-requests/{request_id}/rescind"
      - "POST /opt-out-requests/{request_id}/resubmit"
    shared_operations:
      - "GET /students/{student_id}, GET /students/{student_id}/enrollments, GET /students/{student_id}/charges, GET /students/{student_id}/ledger-entries (own records only)"
      - "GET /charges/{charge_id}, GET /charges/{charge_id}/ledger-entries, GET /charges/{charge_id}/opt-out-requests, GET /enrollments/{enrollment_id}/charges, GET /opt-out-requests/{request_id} (own records only)"
      - "POST /_clock/set_current_utc"
  - name: ComplianceOfficer
    description: "State reporting and affordability compliance. Opaque operator id. Owns the textbook cost disclosure lifecycle and nothing else - it cannot flag sections, post charges or settle publishers."
    entity_backed: null
    exclusive_operations:
      - "POST /disclosure-reports"
      - "POST /disclosure-reports/{report_id}/certify"
      - "POST /disclosure-reports/{report_id}/amend"
    shared_operations:
      - "GET /disclosure-reports, GET /disclosure-reports/{report_id}, GET /terms/{term_id}/disclosure-reports"
      - "GET /terms, GET /terms/{term_id}, GET /terms/{term_id}/sections, GET /sections, GET /sections/{section_id}, GET /sections/{section_id}/billing-summary, GET /sections/{section_id}/adoptions"
      - "GET /agreements, GET /agreements/{agreement_id}, GET /agreements/{agreement_id}/titles, GET /agreements/{agreement_id}/reconciliation-runs, GET /titles, GET /titles/{title_id}, GET /titles/{title_id}/pricing-tiers, GET /pricing-tiers, GET /pricing-tiers/{tier_id}"
      - "GET /charges, GET /charges/{charge_id}, GET /charges/{charge_id}/ledger-entries, GET /charges/{charge_id}/opt-out-requests, GET /ledger-entries, GET /ledger-entries/{entry_id}, GET /opt-out-requests, GET /opt-out-requests/{request_id}"
      - "GET /reconciliation-runs, GET /reconciliation-runs/{run_id}, GET /adoptions, GET /adoptions/{adoption_id}"
      - "POST /_clock/set_current_utc"
