  # ===========================================================================
  - section: endpoints
    instances:
      - name: waitlist_claim_occ_happy_path_and_stale_replay
        claim_type: Action endpoint
        grounds:
          - concurrency_rules[waitlist-claim-stale-entry]
          - endpoints.POST_/archive/waitlist-entries/{id}/claim
          - errors.ERR_STALE_VERSION
        distinguishing_aspect: "The claim endpoint consumes expected_entry_version: the version observed at offer time succeeds; replaying the same claim with the same (now-stale) version fails 412 ERR_STALE_VERSION because the successful claim bumped entry.version."
        test_recipe:
          setup:
            - "Work Wocc with one LENDABLE item; patron P-OC's entry E-OC promoted to OFFERED at seal time; P-OC read the entry at version v."
          setup_api_calls:
            - call: "POST /archive/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: Admin
            - call: "POST /archive/partner-libraries"
              payload: { library_code: "LIB-OC", display_name: "OC Lib", storage_commitment_years: 5 }
              as: LibraryAdmin
              captures: { liboc: $.data.id }
            - call: "POST /archive/works"
              payload: { title: "OCC Claim", author: "OC", publication_year: 2015 }
              as: Admin
              captures: { woc: $.data.id }
            - call: "POST /archive/scan-batches"
              payload: { operator_code: "op-oc" }
              as: ScanOperator
              captures: { boc: $.data.id }
            - call: "POST /archive/items"
              payload: { batch_id: "${boc}", work_id: "${woc}", owning_library_id: "${liboc}", page_count: 10, condition_grade: "GOOD" }
              as: ScanOperator
              captures: { ioc: $.data.id }
            - call: "POST /archive/patrons"
              payload: { email: "oc@example.org", full_name: "OC Patron" }
              as: Anonymous
              captures: { poc: $.data.id }
            - call: "POST /archive/waitlist-entries"
              payload: { work_id: "${woc}", patron_id: "${poc}" }
              as: Patron
              as_user_id: "${poc}"
              captures: { eoc: $.data.id }
            - call: "POST /archive/scan-batches/${boc}/seal"
              payload: {}
              as: ScanOperator
            - call: "GET /archive/works/${woc}/waitlist-entries"
              payload: { patron_id: "${poc}" }
              as: Admin
              captures: { eoc_v: "$.data[0].version" }
          trigger:
            - call: "POST /archive/waitlist-entries/${eoc}/claim"
              payload: { expected_entry_version: "${eoc_v}" }
              as: Patron
              as_user_id: "${poc}"
              captures: { oc_loan: $.data.id }
            - call: "POST /archive/waitlist-entries/${eoc}/claim"
              payload: { expected_entry_version: "${eoc_v}" }
              as: Patron
              as_user_id: "${poc}"
              captures: { oc_err: $.data.error_id }
          assert:
            - "the first claim succeeds: Loan.${oc_loan}.status == ACTIVE and WaitlistEntry.${eoc}.status == CLAIMED"
            - "the second claim with the same captured version fails 412 with oc_err == ERR_STALE_VERSION (the claim itself bumped the entry version)"
            - "Patron.${poc}.active_loan_count == 1 (exactly one loan was created)"
      - name: budget_settle_occ_stale_version_rejected
        claim_type: Action endpoint
        grounds:
          - concurrency_rules[budget-write-stale-grant]
          - endpoints.POST_/archive/budget-lines/{id}/settle
        distinguishing_aspect: "Settling with an expected_grant_version read before another budget-line creation bumped the grant version fails 412; re-reading and settling with the fresh version succeeds."
        test_recipe:
          setup:
            - "Grant G-OC amount 100000; lines BL-A (50000) and BL-B (10000) created; the admin captured the grant version before BL-B was created."
          setup_api_calls:
            - call: "POST /archive/funding-grants"
              payload: { donor_name: "OCC Donor", amount_cents: 100000 }
              as: FinanceAdmin
              captures: { goc: $.data.id }
            - call: "POST /archive/budget-lines"
              payload: { grant_id: "${goc}", category: "STORAGE", budget_reservation_cents: 50000 }
              as: FinanceAdmin
              captures: { bloc_a: $.data.id }
            - call: "GET /archive/funding-grants/${goc}"
              payload: {}
              as: FinanceAdmin
              captures: { goc_stale_v: $.data.version }
            - call: "POST /archive/budget-lines"
              payload: { grant_id: "${goc}", category: "BANDWIDTH", budget_reservation_cents: 10000 }
              as: FinanceAdmin
              captures: { bloc_b: $.data.id }
          trigger:
            - call: "POST /archive/budget-lines/${bloc_a}/settle"
              payload: { actual_spend_cents: 40000, expected_grant_version: "${goc_stale_v}" }
              as: FinanceAdmin
              captures: { stale_err: $.data.error_id }
            - call: "GET /archive/funding-grants/${goc}"
              payload: {}
              as: FinanceAdmin
              captures: { goc_fresh_v: $.data.version }
            - call: "POST /archive/budget-lines/${bloc_a}/settle"
              payload: { actual_spend_cents: 40000, expected_grant_version: "${goc_fresh_v}" }
              as: FinanceAdmin
          assert:
            - "the stale settle fails with stale_err == ERR_STALE_VERSION (412) and BudgetLine.${bloc_a}.status remains OPEN"
            - "the fresh settle succeeds: BudgetLine.${bloc_a}.status == SETTLED, grant reserved_cents == 10000, spent_cents == 40000"
      - name: playback_suppressed_by_upheld_rights_request
        claim_type: Conditional action
        grounds:
          - calculations.playback_resolution
          - state_machines.RightsRequest.UNDER_REVIEW_to_UPHELD_REMOVED
        distinguishing_aspect: "A capture that played FULL before an upheld CAPTURE_URL_PREFIX rights request returns mode SUPPRESSED after the decision, with capture_id null — the suppression is evaluated live, not cached on the capture."
        test_recipe:
          setup:
            - "Job JP COMPLETED with capture CP for url https://rights.site/page; rights request on prefix https://rights.site/ in UNDER_REVIEW."
          setup_api_calls:
            - call: "POST /archive/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: Admin
            - call: "POST /archive/crawl-jobs"
              payload: { seed_url: "https://rights.site/", scheduled_at: "2026-09-01T00:05:00Z", requests_per_minute: 10 }
              as: CrawlOperator
              captures: { jp: $.data.id }
            - call: "POST /archive/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:05:00Z" }
              as: Admin
            - call: "POST /archive/crawl-jobs/${jp}/start"
              payload: {}
              as: CrawlOperator
            - call: "POST /archive/captures"
              payload: { crawl_job_id: "${jp}", url: "https://rights.site/page", content_hash: "rh1", has_dynamic_content: false }
              as: CrawlOperator
              captures: { cpb: $.data.id }
            - call: "POST /archive/crawl-jobs/${jp}/complete"
              payload: {}
              as: CrawlOperator
            - call: "POST /archive/rights-requests"
              payload: { subject_kind: "CAPTURE_URL_PREFIX", url_prefix: "https://rights.site/", claimant_name: "Site Owner" }
              as: LegalReviewer
              as_user_id: "legal-a"
              captures: { rrp: $.data.id }
            - call: "POST /archive/rights-requests/${rrp}/begin-review"
              payload: {}
              as: LegalReviewer
              as_user_id: "legal-b"
          trigger:
            - call: "GET /archive/playback"
              payload: { url: "https://rights.site/page" }
              as: Admin
              captures: { pre_mode: $.data.mode }
            - call: "POST /archive/rights-requests/${rrp}/decide"
              payload: { decision: "UPHOLD" }
              as: LegalReviewer
              as_user_id: "legal-c"
            - call: "GET /archive/playback"
              payload: { url: "https://rights.site/page" }
              as: Admin
              captures: { post_mode: $.data.mode }
          assert:
            - "pre_mode == \"FULL\" before the decision"
            - "post_mode == \"SUPPRESSED\" after UPHOLD, with capture_id null"
            - "Capture.${cpb}.playback_status == SUPPRESSED"
      - name: directive_retract_restores_playback
        claim_type: side_effect_execution
        grounds:
          - state_machines.ExclusionDirective.ACTIVE_to_RETRACTED
        distinguishing_aspect: "Retracting the only PLAYBACK_ONLY directive covering a capture flips its playback_status back to PLAYABLE; a capture covered by a second still-ACTIVE directive remains SUPPRESSED."
        test_recipe:
          setup:
            - "Captures CA (covered only by directive D1) and CB (covered by D1 and D2) both SUPPRESSED."
          setup_api_calls:
            - call: "POST /archive/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: Admin
            - call: "POST /archive/crawl-jobs"
              payload: { seed_url: "https://multi.site/", scheduled_at: "2026-09-01T00:05:00Z", requests_per_minute: 10 }
              as: CrawlOperator
              captures: { jm: $.data.id }
            - call: "POST /archive/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:05:00Z" }
              as: Admin
            - call: "POST /archive/crawl-jobs/${jm}/start"
              payload: {}
              as: CrawlOperator
            - call: "POST /archive/captures"
              payload: { crawl_job_id: "${jm}", url: "https://multi.site/a", content_hash: "ma", has_dynamic_content: false }
              as: CrawlOperator
              captures: { cma: $.data.id }
            - call: "POST /archive/captures"
              payload: { crawl_job_id: "${jm}", url: "https://multi.site/b", content_hash: "mb", has_dynamic_content: false }
              as: CrawlOperator
              captures: { cmb: $.data.id }
            - call: "POST /archive/exclusion-directives"
              payload: { url_prefix: "https://multi.site/", scope: "PLAYBACK_ONLY", reason: "d1" }
              as: CrawlOperator
              captures: { d1: $.data.directive_id }
            - call: "POST /archive/exclusion-directives"
              payload: { url_prefix: "https://multi.site/b", scope: "PLAYBACK_ONLY", reason: "d2" }
              as: CrawlOperator
              captures: { d2: $.data.directive_id }
          trigger:
            - call: "POST /archive/exclusion-directives/${d1}/retract"
              payload: {}
              as: CrawlOperator
          assert:
            - "Capture.${cma}.playback_status == PLAYABLE after retracting D1 (no remaining cover)"
            - "Capture.${cmb}.playback_status == SUPPRESSED (D2 still covers it)"
            - "GET /archive/playback?url=https://multi.site/a returns mode FULL; url=https://multi.site/b returns SUPPRESSED"

  # ===========================================================================
  - section: errors
    instances:
      - name: err_work_already_borrowed_triggerable
        claim_type: violation_to_error
        grounds:
          - errors.ERR_WORK_ALREADY_BORROWED
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / loan_checkout_gated_by_work_availability
