              as: CaseWorker
              captures: { cp_id: "$.data.id" }
            - call: "POST /child-support/participants"
              payload: { role_type: "NONCUSTODIAL_PARTY", full_name: "Alex Ruiz", ssn_last4: "5656", residence_state_code: "MN", monthly_gross_income_cents: 300000, income_verification_source: "VERIFIED_WAGE_RECORD", supports_second_family: false, has_valid_drivers_license: true }
              as: CaseWorker
              captures: { ncp_id: "$.data.id" }
            - call: "POST /child-support/participants/${ncp_id}/locate-results"
              payload: { locate_outcome: "LOCATED" }
              as: CaseWorker
            - call: "POST /child-support/cases"
              payload: { case_type: "DIRECT_APPLICATION", custodial_party_id: "${cp_id}", noncustodial_party_id: "${ncp_id}", child_count: 2, tanf_assistance: false, good_cause_claim: false }
              as: CaseWorker
              captures: { case_id: "$.data.id" }
            - call: "POST /child-support/cases/${case_id}/paternity-actions"
              payload: { method: "PRESUMED_MARITAL" }
              as: CaseWorker
              captures: { pa_id: "$.data.id" }
            - call: "POST /child-support/cases/${case_id}/orders"
              payload: { order_type: "CURRENT_SUPPORT", origin_state_code: "MN", effective_date: "2026-08-01" }
              as: CaseWorker
              captures: { order_id: "$.data.id" }
            - call: "POST /child-support/orders/${order_id}/guideline-calculation"
              payload: {}
              as: CaseWorker
              captures: { guideline: "$.data.guideline_monthly_cents" }
            - call: "POST /child-support/orders/${order_id}/entry"
              payload: {}
              as: SupervisingAttorney
              captures: { monthly: "$.data.monthly_obligation_cents" }
            - call: "POST /child-support/orders/${order_id}/charges"
              payload: { charge_type: "CURRENT_SUPPORT", period_start_date: "2026-08-01", period_end_date: "2026-09-01", due_date: "2026-08-15" }
              as: FinanceOfficer
              captures: { ch1: "$.data.id" }
            - call: "POST /child-support/orders/${order_id}/charges"
              payload: { charge_type: "CURRENT_SUPPORT", period_start_date: "2026-09-01", period_end_date: "2026-10-01", due_date: "2026-09-15" }
              as: FinanceOfficer
              captures: { ch2: "$.data.id" }
            - call: "POST /child-support/_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "GET /child-support/cases/${case_id}"
              as: FinanceOfficer
              captures: { case_v: "$.data.version" }
            - call: "POST /child-support/cases/${case_id}/compromise-offers"
              payload: { installment_count: 3, expected_case_version: "${case_v}" }
              as: FinanceOfficer
              captures: { offer_id: "$.data.id", o_status: "$.data.status", o_psnap: "$.data.principal_due_snapshot_cents", o_isnap: "$.data.interest_due_snapshot_cents", o_pre: "$.data.pre_waiver_total_cents", o_tier: "$.data.waiver_tier_pct", o_waiver: "$.data.interest_waiver_cents", o_total: "$.data.settlement_total_cents", o_monthly: "$.data.monthly_installment_cents", o_final: "$.data.final_installment_cents" }
            - call: "POST /child-support/compromise-offers/${offer_id}/acceptance"
              payload: {}
              as: NoncustodialParty
              as_user_id: "${ncp_id}"
              captures: { a_status: "$.data.status", a_at: "$.data.accepted_at", a_due: "$.data.next_installment_due_date", a_count: "$.data.compliance_payment_count" }
          trigger:
            - call: "POST /child-support/cases/${case_id}/payments"
              payload: { source: "COMPROMISE_INSTALLMENT", amount_cents: 50467, compromise_offer_id: "${offer_id}" }
              as: FinanceOfficer
              captures: { e_below: "$.data.error_id" }
            - call: "POST /child-support/cases/${case_id}/payments"
              payload: { source: "COMPROMISE_INSTALLMENT", amount_cents: 50468, compromise_offer_id: "${offer_id}" }
              as: FinanceOfficer
              captures: { p1: "$.data.id" }
            - call: "GET /child-support/compromise-offers/${offer_id}"
              as: FinanceOfficer
              captures: { s1: "$.data.status", c1: "$.data.compliance_payment_count", d1: "$.data.next_installment_due_date" }
            - call: "POST /child-support/cases/${case_id}/payments"
              payload: { source: "COMPROMISE_INSTALLMENT", amount_cents: 50468, compromise_offer_id: "${offer_id}" }
              as: FinanceOfficer
              captures: { p2: "$.data.id" }
            - call: "GET /child-support/compromise-offers/${offer_id}"
              as: FinanceOfficer
              captures: { s2: "$.data.status", c2: "$.data.compliance_payment_count", d2: "$.data.next_installment_due_date" }
            - call: "POST /child-support/cases/${case_id}/payments"
              payload: { source: "COMPROMISE_INSTALLMENT", amount_cents: 50469, compromise_offer_id: "${offer_id}" }
              as: FinanceOfficer
              captures: { e_below_final: "$.data.error_id" }
            - call: "POST /child-support/cases/${case_id}/payments"
              payload: { source: "COMPROMISE_INSTALLMENT", amount_cents: 50470, compromise_offer_id: "${offer_id}" }
              as: FinanceOfficer
              captures: { p3: "$.data.id" }
            - call: "GET /child-support/compromise-offers/${offer_id}"
              as: FinanceOfficer
              captures: { s3: "$.data.status", c3: "$.data.compliance_payment_count", done: "$.data.completed_at" }
            - call: "GET /child-support/cases/${case_id}"
              as: FinanceOfficer
              captures: { posture: "$.data.enforcement_posture", arrears: "$.data.arrears_principal_cents", woff: "$.data.interest_written_off_cents" }
            - call: "GET /child-support/charges/${ch1}"
              as: FinanceOfficer
              captures: { ch1_status: "$.data.status" }
            - call: "POST /child-support/compromise-offers/${offer_id}/default-declaration"
              payload: {}
              as: FinanceOfficer
              captures: { e_completed: "$.data.error_id" }
          assert:
            - "${o_status} == PROPOSED, ${o_psnap} == 150000, ${o_isnap} == 1875  # the interest snapshot uses the aggregate_month_end variant: month ends 2026-08-31, 2026-09-30 and 2026-10-31 over balances 75000, 150000 and 150000"
            - "${o_pre} == 151875, ${o_tier} == 0.25  # the first WAIVER_TIER_TABLE band whose ceiling 500000 >= 151875"
            - "${o_waiver} == 469  # round_half_up(1875 * 0.25) = round_half_up(468.75)"
            - "${o_total} == 151406, ${o_monthly} == 50468  # floor(151406 / 3) = floor(50468.67)"
            - "${o_final} == 50470  # 151406 - 50468*2; the whole remainder lands on the last installment"
            - "${a_status} == ACCEPTED, ${a_at} == 2026-11-01T00:00:00Z, ${a_due} == 2026-12-01, ${a_count} == 0"
            - "${e_below} == ERR_PAYMENT_BELOW_INSTALLMENT with HTTP 422  # 50467 is one cent short of monthly_installment_cents"
            - "${s1} == ACTIVE, ${c1} == 1, ${d1} == 2027-01-01"
            - "${s2} == ACTIVE, ${c2} == 2, ${d2} == 2027-02-01"
            - "${e_below_final} == ERR_PAYMENT_BELOW_INSTALLMENT  # on the LAST installment the gate is final_installment_cents 50470, so 50469 fails even though it clears the monthly figure"
            - "${s3} == COMPLETED, ${c3} == 3, ${done} == 2026-11-01T00:00:00Z"
            - "${posture} == NORMAL  # completion lifts the STAYED posture set at acceptance"
            - "${arrears} == 0 and ${ch1_status} == SATISFIED  # completion satisfies the remaining OPEN charges"
            - "${woff} == 469  # the waiver became permanent and was never reversed"
            - "${e_completed} == ERR_INVALID_OFFER_STATUS with HTTP 409  # COMPLETED is terminal, so the priority-10 status rule answers before priority 27"

      - name: case_status_posture_and_interstate_role_move_independently
        claim_type: parallel
        grounds:
          - "complexity_profile.state_machine_shape"
          - "state_machines.SupportCase.case_status"
          - "state_machines.SupportCase.enforcement_posture"
          - "state_machines.SupportCase.interstate_role"
        excluded_because:
          difficulty_instance: non_linear_state_machine / case_parallel_dimensions_evolve_independently
          rationale: >
            That §1.8 instance already walks all three SupportCase dimensions and
            asserts each one's value after every step, which is exactly the parallel-
            shape claim.

      - name: iwo_service_status_and_remittance_status_move_independently
        claim_type: parallel
        grounds:
          - "complexity_profile.state_machine_shape"
          - "state_machines.IncomeWithholdingOrder.service_status"
          - "state_machines.IncomeWithholdingOrder.remittance_status"
        excluded_because:
          difficulty_instance: non_linear_state_machine / iwo_service_and_remittance_dimensions_are_independent
          rationale: >
            The §1.8 instance drives service_status through AMENDED while
            remittance_status walks NOT_DUE -> CURRENT -> DELINQUENT, asserting the
            pair after each call.

      - name: paternity_acknowledgment_cycle_returns_to_aop_signed
        claim_type: cyclic
        grounds:
          - "state_machines.PaternityAction"
          - "entities.PaternityAction.fields.rescission_count"
          - "errors[ERR_RESCISSION_LIMIT]"
        excluded_because:
          difficulty_instance: non_linear_state_machine / paternity_aop_rescission_cycle_returns_to_aop_signed
          rationale: >
            The AOP_SIGNED -> AOP_RESCINDED -> AOP_SIGNED loop and its termination at
            MAX_RESCISSIONS (1) are the whole subject of that §1.8 instance.

      - name: order_vacatur_cascades_down_to_charges_and_withholding_orders
        claim_type: cascade_down
        grounds:
          - "state_machines.SupportOrder"
          - "state_machines.ObligationCharge"
          - "state_machines.IncomeWithholdingOrder.service_status"
          - "entities.Employer.fields.active_iwo_count"
        excluded_because:
          difficulty_instance: transitive_cascade / order_vacatur_three_level_cascade_to_employer_counter
          rationale: >
            That §1.8 instance replays the order -> charge -> IWO ->
            Employer.active_iwo_count chain and asserts every level, including that
            terminal children are left alone.

      - name: compromise_default_reverses_the_interest_write_off
        claim_type: compensation
        grounds:
          - "state_machines.CompromiseOffer"
          - "entities.SupportCase.fields.interest_written_off_cents"
          - "entities.SupportCase.fields.interest_receivable_cents"
        excluded_because:
          difficulty_instance: compensating_invariant / compromise_default_reinstates_written_off_interest
          rationale: >
            The undo path and its no-drift invariant (installments stay applied, only
            the waiver is reversed) are asserted end to end there.

      - name: compromise_acceptance_releases_only_the_remedies_it_should
        claim_type: conditional_cascade
        grounds:
          - "state_machines.CompromiseOffer"
          - "state_machines.EnforcementAction"
          - "entities.Participant.fields.license_suspension_active"
        excluded_because:
          difficulty_instance: transitive_cascade / compromise_acceptance_cascade_releases_license_remedy
          rationale: >
            That §1.8 instance asserts the ACTIVE and NOTICE_SENT actions are released
            with COMPROMISE_ACCEPTED while a DENIED action is left untouched — the
            conditional-cascade claim.

  # ====================================================================
  # Table 3 - Calculations. Ten formulas live in §1.3; the four flagged as
  # cross-cutting layer material (dual-variant interest, dual-variant risk,
  # nested-min withholding cap, pre-waiver compromise tier) are proven in
  # SCAFFOLD_DIFFICULTY_DESIGN.yaml and appear here as stubs. Every literal
  # below was produced by running the §1.3 pseudocode with its declared
  # constants and round_half_up semantics.
  # ====================================================================
  - section: calculations
    instances:

      - name: guideline_imputation_applies_when_income_is_unverified
        claim_type: correct_result
        grounds:
          - "calculations.guideline_support_obligation"
          - "calculations.guideline_support_obligation.constants.IMPUTED_MONTHLY_INCOME_CENTS"
          - "entities.Participant.fields.income_verification_source"
          - "entities.SupportOrder.fields.imputation_applied"
          - "endpoints[POST /child-support/orders/{order_id}/guideline-calculation]"
        distinguishing_aspect: >
          Three cases differing only in the noncustodial party's income record prove
          the imputation branch is keyed on income_verification_source and not
          merely on a missing figure: a null income imputes 182000, a reported
          300000 whose source is still NONE ALSO imputes 182000 (the reported figure
          is discarded, so both cases land on the identical 50961), and the same
          300000 stamped SELF_REPORTED is honoured and yields 84000. An
          implementation that only checks `income is None` returns 84000 for the
          middle case.
        test_recipe:
          setup:
            - "Empty database. Logical clock pinned to 2026-08-01T00:00:00Z."
            - "Three independent cases, each CP earning 100000 VERIFIED_WAGE_RECORD, two children."
            - "Case A NCP: monthly_gross_income_cents omitted entirely (null, source defaults to NONE)."
            - "Case B NCP: monthly_gross_income_cents 300000 with income_verification_source NONE."
            - "Case C NCP: monthly_gross_income_cents 300000 with income_verification_source SELF_REPORTED."
            - "Each NCP is LOCATED first so validation priority 16 does not block order creation."
          setup_api_calls:
            - call: "POST /child-support/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /child-support/participants"
              payload: { role_type: "CUSTODIAL_PARTY", full_name: "Dana Alvarez", ssn_last4: "6101", residence_state_code: "MN", monthly_gross_income_cents: 100000, income_verification_source: "VERIFIED_WAGE_RECORD" }
              as: CaseWorker
              captures: { cpa: "$.data.id" }
            - call: "POST /child-support/participants"
              payload: { role_type: "NONCUSTODIAL_PARTY", full_name: "Rene Alvarez", ssn_last4: "6102", residence_state_code: "MN", supports_second_family: false, has_valid_drivers_license: true }
              as: CaseWorker
              captures: { ncpa: "$.data.id" }
            - call: "POST /child-support/participants/${ncpa}/locate-results"
              payload: { locate_outcome: "LOCATED" }
              as: CaseWorker
            - call: "POST /child-support/cases"
              payload: { case_type: "DIRECT_APPLICATION", custodial_party_id: "${cpa}", noncustodial_party_id: "${ncpa}", child_count: 2, tanf_assistance: false, good_cause_claim: false }
              as: CaseWorker
              captures: { casea: "$.data.id" }
            - call: "POST /child-support/cases/${casea}/paternity-actions"
              payload: { method: "PRESUMED_MARITAL" }
              as: CaseWorker
            - call: "POST /child-support/cases/${casea}/orders"
              payload: { order_type: "CURRENT_SUPPORT", origin_state_code: "MN", effective_date: "2026-08-01" }
              as: CaseWorker
              captures: { ordera: "$.data.id" }
            - call: "POST /child-support/participants"
