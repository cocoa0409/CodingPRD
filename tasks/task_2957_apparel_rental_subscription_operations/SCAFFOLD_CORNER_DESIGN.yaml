        grounds:
          - "calculations.unit_economics"
          - "endpoints.GET /styles/{style_id}/unit-economics"
        excluded_because:
          difficulty_instance: dual_variant_calc / style_unit_economics_realized_vs_projected_diverge
          rationale: >-
            Both variants are computed from one fixture and their per-turn margins are asserted as distinct
