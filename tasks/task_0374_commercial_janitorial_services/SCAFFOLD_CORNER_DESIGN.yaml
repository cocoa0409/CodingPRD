              as_user_id: "cc-1"
              captures: { complaint_id: $.data.id }
            - call: "POST /complaints/${complaint_id}/acknowledge"
              payload: {}
              as: FieldSupervisor
            - call: "POST /complaints/${complaint_id}/schedule-callback"
              payload: { crew_id: "${crew_id}", service_date: "2026-06-18", planned_start_min: 600, planned_end_min: 660 }
