  - { method: GET,  path: "/boutique/appointments/{id}", description: "Get an appointment", roles: [Customer, Fitter, StoreManager, BillingClerk], code: 200, input: [], output: FittingAppointment, side_effects: [] }
  - { method: GET,  path: "/boutique/appointments", description: "List appointments (filter by customer/fitter/room/status)", roles: [Customer, Fitter, StoreManager, BillingClerk], code: 200, input: ["customer_id?", "fitter_id?", "room_id?", "status?", "limit?", "offset?"], output: "FittingAppointment[]", side_effects: [] }
  - { method: POST, path: "/boutique/appointments/{id}/confirm", description: "Confirm the appointment (locks slot; runs safety + overlap checks)", roles: [Fitter], code: 200, input: [], output: FittingAppointment, side_effects: ["status REQUESTED -> CONFIRMED"] }
  - { method: POST, path: "/boutique/appointments/{id}/check-in", description: "Check the customer in", roles: [Fitter], code: 200, input: [], output: FittingAppointment, side_effects: ["status CONFIRMED -> CHECKED_IN"] }
  - { method: POST, path: "/boutique/appointments/{id}/fit", description: "Submit measurements; computes and (re)sets the size recommendation. OCC-guarded re-fit.", roles: [Fitter], code: 200, input: [underbust_cm, bust_cm, "fit_preference?", expected_appointment_version], output: FittingAppointment, side_effects: ["recommended_band/cup/size set", "increments FittingAppointment.version by 1"] }
  - { method: POST, path: "/boutique/appointments/{id}/complete", description: "Complete the appointment", roles: [Fitter], code: 200, input: [], output: FittingAppointment, side_effects: ["status CHECKED_IN -> COMPLETED"] }
