# =============================================================================
# SCAFFOLD.yaml — Debit & Credit Card Fraud Detection Operations (task 2017)
# §1.0–§1.7 seed tables. Difficulty design (§1.8) and corner design (§1.9)
# live in sibling files SCAFFOLD_DIFFICULTY_DESIGN.yaml / SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  2017. Debit & Credit Card Fraud Detection Operations (issuer fraud operations): real-time scoring rules & decline threshold tuning, alert queue triage & customer verification contact, compromised-card event (CAMS/ADC) intake & reissue decision, block/unblock & travel notice handling, false-positive rate vs loss trade-off monitoring, fraud loss booking & network recovery filing, ring/pattern detection across accounts, chargeback interplay & duplicate credit prevention

domain_name: card-fraud-ops
api_prefix: /fraudops

# =============================================================================
# §0 Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: posture_driven_gating
  complexity_layers:
    - rate_threshold_triggers
    - dual_variant_calculation
    - optimistic_concurrency
    - cascading_side_effects
  entity_topology: flat          # peer entities linked by FK references; no nested creation URLs
  state_machine_shape: cyclic    # block/unblock cycles, alert reopen loops; Card also carries parallel dims (card_status x fraud_flag)
  relationship_patterns:
    - one_to_many          # Account -> Cards, Account -> AuthTransactions
    - many_to_many         # FraudRing <-> Account via RingMembership junction
    - self_referential     # Card.replaces_card_id (reissue chain)
    - cross_aggregate      # ChargebackCase -> AuthTransaction; LossEntry -> Account
  role_model: segregation_of_duties   # rule drafter != activator; loss booker != recovery filer
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Account
    parent: null
    common_fields: true
    fields:
      - { name: account_number, type: string, source: input, description: "Unique issuer account number", constraints: "unique across all accounts; duplicate create -> ERR_INVALID_REQUEST" }
      - { name: cardholder_name, type: string, source: input, description: "Cardholder legal name" }
      - { name: home_country, type: string, source: input, description: "ISO 3166-1 alpha-2 home country used by cross-border scoring" }
      - { name: account_status, type: enum, source: system, description: "ACTIVE | SUSPENDED", default: ACTIVE }
      - { name: credit_balance_cents, type: integer, source: computed, description: "Customer credit ledger: sum of active chargeback provisional credits (statuses PROVISIONAL_CREDIT_POSTED, REPRESENTMENT_FILED, RESOLVED_WON) + fraud_credit_cents of alerts currently in RESOLVED_FRAUD (calculation account_credit_balance)", default: 0 }
      - { name: open_alert_count, type: integer, source: computed, description: "Count of FraudAlerts on this account in OPEN, IN_REVIEW, or CONTACT_PENDING", default: 0 }
      - { name: rolling_90d_loss_cents, type: integer, source: computed, description: "Sum of final_amount_cents of LossEntries for this account in status FINALIZED, PARTIALLY_RECOVERED, or WRITTEN_OFF with finalized_at within [now-90d, now] (calculation rolling_confirmed_loss)", default: 0 }
      - { name: risk_tier, type: enum, source: computed, description: "LOW | MEDIUM | HIGH — derived per calculation account_risk_tier from open_alert_count, rolling_90d_loss_cents, and member card fraud_flags", default: LOW }

  - name: Card
    parent: null
    common_fields: true
    fields:
      - { name: account_id, type: string, source: input, description: "FK -> Account.id; owning account" }
      - { name: pan_token, type: string, source: input, description: "Network token for the PAN", constraints: "unique across all cards; duplicate create -> ERR_INVALID_REQUEST" }
      - { name: product_type, type: enum, source: input, description: "DEBIT | CREDIT" }
      - { name: network, type: enum, source: input, description: "VISA | MASTERCARD" }
      - { name: card_status, type: enum, source: system, description: "ACTIVE | SOFT_BLOCKED | HARD_CLOSED | REPLACED (state machine card_status)", default: ACTIVE }
      - { name: fraud_flag, type: enum, source: system, description: "CLEAN | WATCH | COMPROMISED — parallel state dimension independent of card_status (state machine fraud_flag)", default: CLEAN }
      - { name: block_reason, type: enum, source: system, description: "ANALYST_REVIEW | CONFIRMED_FRAUD | CUSTOMER_REQUEST | COMPROMISE_EVENT; null when card_status == ACTIVE" }
      - { name: replaces_card_id, type: string, source: system, description: "FK -> Card.id; set on a replacement card created by a reissue decision; null on original cards" }

  - name: RuleSet
    parent: null
    common_fields: true
    fields:
      - { name: scope, type: enum, source: input, description: "GLOBAL | DEBIT_CARD | CREDIT_CARD; at most one ACTIVE ruleset per scope (activation supersedes)" }
      - { name: base_score, type: integer, source: input, description: "Score floor added to every scored authorization" }
      - { name: review_threshold, type: integer, source: input, description: "score >= review_threshold -> REVIEW; must be strictly less than decline_threshold (ERR_THRESHOLD_ORDER_INVALID)" }
      - { name: decline_threshold, type: integer, source: input, description: "score >= decline_threshold -> DECLINE (inclusive boundary)" }
      - { name: amount_tiers, type: array, source: input, description: "Array of {min_amount_cents, points}; highest tier whose min_amount_cents <= amount_cents applies; tiers must not repeat a min_amount_cents value" }
      - { name: channel_weights, type: object, source: input, description: "Map {CHIP, CONTACTLESS, CNP, ATM} -> integer points; all four keys required" }
      - { name: cross_border_weight, type: integer, source: input, description: "Points added when origin_country != home_country (unless suppressed by a matching active travel notice)" }
      - { name: high_risk_multiplier, type: number, source: input, description: "Multiplier applied to cross_border_weight when origin_country is in high_risk_countries (product must be an integer)" }
      - { name: watch_weight, type: integer, source: input, description: "Points added when the card's fraud_flag == WATCH at scoring time" }
      - { name: compromised_weight, type: integer, source: input, description: "Points added when the card's fraud_flag == COMPROMISED at scoring time" }
      - { name: high_risk_countries, type: array, source: input, description: "ISO country codes treated as high-risk for cross-border scoring", default: [] }
      - { name: ruleset_status, type: enum, source: system, description: "DRAFT | ACTIVE | RETIRED", default: DRAFT }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of the creator (segregation: activator must differ)" }
      - { name: activated_by_user_id, type: string, source: system, description: "X-User-ID of the activator; null until first activation" }

  - name: AuthTransaction
    parent: null
    common_fields: true
    fields:
      - { name: card_id, type: string, source: input, description: "FK -> Card.id; card presented" }
      - { name: account_id, type: string, source: system, description: "FK -> Account.id; denormalized from Card at intake" }
      - { name: ruleset_id, type: string, source: system, description: "FK -> RuleSet.id; ACTIVE ruleset pinned at scoring time; null when decision_reason == CARD_BLOCKED" }
      - { name: amount_cents, type: integer, source: input, description: "Authorization amount; must be >= 1" }
      - { name: currency, type: string, source: input, description: "ISO 4217 currency", default: "USD" }
      - { name: merchant_id, type: string, source: input, description: "Merchant identifier used by compromise-window and ring detection" }
      - { name: merchant_category_code, type: string, source: input, description: "ISO 18245 MCC" }
      - { name: channel, type: enum, source: input, description: "CHIP | CONTACTLESS | CNP | ATM" }
      - { name: origin_country, type: string, source: input, description: "ISO country where the transaction originates" }
      - { name: home_country, type: string, source: system, description: "Copied from Account.home_country at intake" }
      - { name: scored_at, type: datetime, source: system, description: "Logical clock timestamp at intake (drives all window membership tests)" }
      - { name: auth_score, type: integer, source: computed, description: "Score under the pinned ruleset (calculation authorization_scoring); null when decision_reason == CARD_BLOCKED" }
      - { name: decision, type: enum, source: computed, description: "APPROVE | REVIEW | DECLINE" }
      - { name: decision_reason, type: enum, source: computed, description: "RULE_SCORE | CARD_BLOCKED" }
      - { name: shadow_score, type: integer, source: computed, description: "Score recomputed at read time under the currently ACTIVE ruleset for this transaction's scope (calculation authorization_scoring variant shadow); null when no ACTIVE ruleset covers the scope at read time" }
      - { name: shadow_decision, type: enum, source: computed, description: "Decision implied by shadow_score under the currently ACTIVE ruleset's thresholds; null when shadow_score is null" }
      - { name: shadow_ruleset_id, type: string, source: computed, description: "FK -> RuleSet.id; ruleset used for the shadow rescore; null when none active at read time" }
      - { name: final_disposition, type: enum, source: system, description: "UNDISPOSED | CONFIRMED_FRAUD | CONFIRMED_LEGIT; written by the most recent fraud-alert resolution that references this transaction", default: UNDISPOSED }

  - name: FraudAlert
    parent: null
    common_fields: true
    fields:
      - { name: account_id, type: string, source: input, description: "FK -> Account.id; account under review (copied from txn for SCORING_REVIEW alerts)" }
      - { name: card_id, type: string, source: input, description: "FK -> Card.id; card under review (copied from txn for SCORING_REVIEW alerts)" }
      - { name: auth_transaction_id, type: string, source: input, description: "FK -> AuthTransaction.id; source transaction; required for SCORING_REVIEW alerts, optional for MANUAL alerts" }
      - { name: source, type: enum, source: system, description: "SCORING_REVIEW (auto-created on REVIEW decisions) | MANUAL (analyst-created via POST /fraudops/fraud-alerts)" }
      - { name: alert_status, type: enum, source: system, description: "OPEN | IN_REVIEW | CONTACT_PENDING | RESOLVED_FRAUD | RESOLVED_LEGIT | EXPIRED", default: OPEN }
      - { name: band_points, type: integer, source: system, description: "Priority band frozen at creation: 25 for MANUAL alerts; min(49, max(0, auth_score - review_threshold)) for SCORING_REVIEW alerts" }
      - { name: priority, type: integer, source: computed, description: "TIER_POINTS[tier at creation, excluding this alert] + band_points, frozen thereafter; escalations (compromise confirm / ring confirm) set priority = max(priority, 200 + band_points) — calculation alert_priority" }
      - { name: assigned_to_user_id, type: string, source: system, description: "Analyst who claimed the alert; null while OPEN" }
      - { name: reopen_count, type: integer, source: system, description: "Number of successful reopens; reopen rejected when reopen_count >= 2 (ERR_REOPEN_LIMIT_EXCEEDED)", default: 0 }
      - { name: resolution, type: enum, source: system, description: "FRAUD | LEGIT; null until resolved" }
      - { name: fraud_credit_cents, type: integer, source: system, description: "Customer credit granted at FRAUD resolution; feeds Account.credit_balance_cents while alert is RESOLVED_FRAUD", default: 0 }
      - { name: sla_expires_at, type: datetime, source: computed, description: "created_at + 72 hours; unresolved alerts become EXPIRED at this instant" }
      - { name: resolved_at, type: datetime, source: system, description: "Logical clock time of the most recent resolution; null until resolved" }

  - name: VerificationContact
    parent: null
    common_fields: true
    fields:
      - { name: alert_id, type: string, source: input, description: "FK -> FraudAlert.id; alert this contact attempt serves" }
      - { name: account_id, type: string, source: system, description: "FK -> Account.id; copied from the alert (contact-gap rule is evaluated per account)" }
      - { name: channel, type: enum, source: input, description: "VOICE | SMS | EMAIL | IN_APP; IN_APP is system-used for cardholder responses" }
      - { name: contact_status, type: enum, source: system, description: "PENDING | COMPLETED", default: PENDING }
      - { name: outcome, type: enum, source: input, description: "CONFIRMED_FRAUD | CONFIRMED_LEGIT | UNREACHABLE; null until completed" }
      - { name: contacted_at, type: datetime, source: system, description: "Logical clock time when the contact record was created" }
      - { name: created_by_user_id, type: string, source: system, description: "Analyst X-User-ID; SYSTEM for cardholder-initiated IN_APP contacts" }

  - name: CompromisedCardEvent
    parent: null
    common_fields: true
    fields:
      - { name: network_source, type: enum, source: input, description: "CAMS | ADC — network compromised-card feed" }
      - { name: event_reference, type: string, source: input, description: "Network-supplied event reference", constraints: "unique; duplicate intake -> ERR_DUPLICATE_EVENT" }
      - { name: merchant_id, type: string, source: input, description: "Common point of purchase" }
      - { name: window_start, type: datetime, source: input, description: "Exposure window start (inclusive); must be strictly before window_end (ERR_INVALID_WINDOW)" }
      - { name: window_end, type: datetime, source: input, description: "Exposure window end (exclusive) — half-open [window_start, window_end)" }
      - { name: event_status, type: enum, source: system, description: "RECEIVED | CONFIRMED | CLOSED", default: RECEIVED }
      - { name: affected_card_count, type: integer, source: computed, description: "Number of cards flagged COMPROMISED by confirmation (calculation exposure_window_match)", default: 0 }
      - { name: confirmed_at, type: datetime, source: system, description: "Logical clock time of confirmation; null until confirmed" }

  - name: ReissueDecision
    parent: null
    common_fields: true
    fields:
      - { name: event_id, type: string, source: system, description: "FK -> CompromisedCardEvent.id; originating event" }
      - { name: card_id, type: string, source: system, description: "FK -> Card.id; exposed card awaiting decision" }
      - { name: replacement_card_id, type: string, source: system, description: "FK -> Card.id; replacement minted on APPROVED/AUTO_APPROVED; null otherwise" }
      - { name: decision, type: enum, source: system, description: "PENDING | APPROVED | DECLINED | AUTO_APPROVED", default: PENDING }
      - { name: exposure_cents, type: integer, source: computed, description: "Sum of amount_cents of this card's transactions at the event merchant inside the event window (calculation reissue_exposure)" }
      - { name: due_at, type: datetime, source: computed, description: "event.confirmed_at + 5 days; PENDING decisions auto-approve at this instant" }
      - { name: decided_by_user_id, type: string, source: system, description: "Deciding user; SYSTEM for AUTO_APPROVED" }
      - { name: decided_at, type: datetime, source: system, description: "Logical clock time of decision; null while PENDING" }
      - { name: rationale, type: string, source: input, description: "Required for DECLINE (ERR_INVALID_REQUEST when missing)" }

  - name: TravelNotice
    parent: null
    common_fields: true
    fields:
      - { name: card_id, type: string, source: input, description: "FK -> Card.id; traveling card" }
      - { name: region_country, type: string, source: input, description: "ISO country the cardholder will visit" }
      - { name: start_date, type: string, source: input, description: "ISO 8601 date (YYYY-MM-DD), inclusive" }
      - { name: end_date, type: string, source: input, description: "ISO 8601 date (YYYY-MM-DD), exclusive — half-open [start_date, end_date); must be after start_date (ERR_INVALID_WINDOW)" }
      - { name: notice_status, type: enum, source: system, description: "ACTIVE | CANCELLED | EXPIRED (system: current date >= end_date)", default: ACTIVE }

  - name: ChargebackCase
    parent: null
    common_fields: true
    fields:
      - { name: auth_transaction_id, type: string, source: input, description: "FK -> AuthTransaction.id; disputed transaction; at most one non-terminal chargeback per transaction (ERR_CHARGEBACK_EXISTS)" }
      - { name: account_id, type: string, source: system, description: "FK -> Account.id; denormalized from the transaction at creation" }
      - { name: reason_code, type: string, source: input, description: "Network chargeback reason code" }
      - { name: provisional_credit_cents, type: integer, source: input, description: "Provisional credit to post; 0 allowed (case opens in FILED with no credit); the duplicate-credit cap is enforced at posting time, not here" }
      - { name: cb_status, type: enum, source: system, description: "FILED | PROVISIONAL_CREDIT_POSTED | REPRESENTMENT_FILED | RESOLVED_WON | RESOLVED_LOST | WITHDRAWN", default: FILED }

  - name: LossEntry
    parent: null
    common_fields: true
    fields:
      - { name: account_id, type: string, source: input, description: "FK -> Account.id; account the loss is booked against" }
      - { name: transaction_ids, type: array, source: input, description: "ids of covered AuthTransactions (must belong to account_id and be CONFIRMED_FRAUD); each transaction may appear in at most one non-terminal LossEntry (ERR_TXN_ALREADY_IN_LOSS)", constraints: "at least 1 element" }
      - { name: provisional_amount_cents, type: integer, source: computed, description: "Forward-looking estimate: sum over transactions of round_half_up(amount_cents * (1 - RECOVERY_RATE[network])) — per-line rounding pinned (calculation loss_provision_estimate)" }
      - { name: tolerance_cents, type: integer, source: computed, description: "round_half_up(provisional_amount_cents * 0.10); finalize accepts final_amount within [provisional - tolerance, provisional + tolerance] inclusive" }
      - { name: final_amount_cents, type: integer, source: input, description: "Accountant-booked loss amount (variant final of loss_provision_estimate); null until finalized" }
      - { name: outstanding_cents, type: integer, source: computed, description: "final_amount_cents - sum(paid_cents of filings in PAID) - written_off_cents; invariant INV-LOSS", default: 0 }
      - { name: written_off_cents, type: integer, source: system, description: "Amount written off; set on write-off transition", default: 0 }
      - { name: loss_status, type: enum, source: system, description: "ESTIMATED | BOOKED | FINALIZED | PARTIALLY_RECOVERED | FULLY_RECOVERED | WRITTEN_OFF", default: ESTIMATED }
      - { name: booked_by_user_id, type: string, source: system, description: "LossAccountant X-User-ID who booked the loss (segregation: recovery filer must differ)" }
      - { name: booked_at, type: datetime, source: system, description: "Logical clock time of booking; finalize deadline = booked_at + 30 days" }
      - { name: finalized_at, type: datetime, source: system, description: "Logical clock time of finalization; drives rolling_90d_loss_cents" }

  - name: RecoveryFiling
    parent: null
    common_fields: true
    fields:
      - { name: loss_entry_id, type: string, source: input, description: "FK -> LossEntry.id; loss being recovered" }
      - { name: network_reference, type: string, source: input, description: "Network recovery case reference", constraints: "unique; duplicate -> ERR_INVALID_REQUEST" }
      - { name: claimed_cents, type: integer, source: input, description: "Amount claimed from the network; must be >= 1 and <= loss outstanding at filing time (ERR_RECOVERY_EXCEEDS_OUTSTANDING)" }
      - { name: paid_cents, type: integer, source: system, description: "Amount actually paid; set when marked PAID; null until then" }
      - { name: filing_status, type: enum, source: system, description: "FILED | ACCEPTED | REJECTED | PAID | REVERSED", default: FILED }
      - { name: filed_by_user_id, type: string, source: system, description: "RecoverySpecialist X-User-ID; must differ from loss booked_by_user_id (ERR_SEGREGATION_OF_DUTIES)" }

  - name: FraudRing
    parent: null
    common_fields: true
    fields:
      - { name: signal_type, type: enum, source: input, description: "COMMON_MERCHANT (only supported signal in v1)" }
      - { name: merchant_id, type: string, source: input, description: "Merchant shared by member accounts" }
      - { name: window_start, type: datetime, source: input, description: "Detection window start (inclusive)" }
      - { name: window_end, type: datetime, source: input, description: "Detection window end (exclusive); must be after window_start (ERR_INVALID_WINDOW)" }
      - { name: ring_status, type: enum, source: system, description: "SUSPECTED | CONFIRMED | DISMISSED", default: SUSPECTED }
      - { name: member_count, type: integer, source: computed, description: "Number of RingMemberships; detection requires >= 3 qualifying accounts (ERR_RING_THRESHOLD_NOT_MET)", default: 0 }

  - name: RingMembership
    parent: null
    common_fields: true
    fields:
      - { name: ring_id, type: string, source: system, description: "FK -> FraudRing.id; owning ring" }
      - { name: account_id, type: string, source: system, description: "FK -> Account.id; member account" }
      - { name: evidence_txn_count, type: integer, source: system, description: "Count of the account's APPROVE transactions at the ring merchant inside the detection window (>= 2 by construction)" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Account
    field: account_status
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /fraudops/accounts/{id}/suspend"
        actor: FraudOpsManager
        preconditions: ["account_status == ACTIVE"]
        side_effects: ["Blocks new travel notices and new cards for this account (ERR_ACCOUNT_NOT_ACTIVE)"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /fraudops/accounts/{id}/reinstate"
        actor: FraudOpsManager
        preconditions: ["account_status == SUSPENDED"]
        side_effects: []

  - entity: Card
    field: card_status
    initial_state: ACTIVE
    terminal_states: [HARD_CLOSED, REPLACED]
    note: "Parallel dimension: card_status evolves independently of fraud_flag (both live on the same row)."
    transitions:
      - from: ACTIVE
        to: SOFT_BLOCKED
        trigger: "POST /fraudops/cards/{id}/block with block_type=SOFT, or system on alert RESOLVED_FRAUD"
        actor: "FraudAnalyst | FraudOpsManager | system"
        preconditions: ["card_status == ACTIVE"]
        side_effects:
          - "Sets block_reason (analyst: ANALYST_REVIEW or CUSTOMER_REQUEST; system on fraud resolution: CONFIRMED_FRAUD)"
      - from: SOFT_BLOCKED
        to: ACTIVE
        trigger: "POST /fraudops/cards/{id}/unblock"
        actor: "FraudAnalyst | FraudOpsManager"
        preconditions:
          - "card_status == SOFT_BLOCKED"
          - "fraud_flag != COMPROMISED, OR a ReissueDecision for this card is DECLINED (which sets fraud_flag to WATCH) — else ERR_CARD_COMPROMISED"
        side_effects: ["Clears block_reason to null"]
      - from: [ACTIVE, SOFT_BLOCKED]
        to: HARD_CLOSED
        trigger: "POST /fraudops/cards/{id}/block with block_type=HARD"
        actor: "FraudAnalyst | FraudOpsManager"
        preconditions: ["card_status in {ACTIVE, SOFT_BLOCKED}"]
        side_effects: ["Sets block_reason"]
      - from: [ACTIVE, SOFT_BLOCKED]
        to: REPLACED
        trigger: "system (ReissueDecision for this card becomes APPROVED or AUTO_APPROVED)"
        actor: system
        preconditions: []
        side_effects:
          - "A replacement Card is created (same account_id, product_type, network; server-minted pan_token; replaces_card_id = this card; fraud_flag = WATCH; card_status = ACTIVE)"
          - "All ACTIVE TravelNotices of this card become CANCELLED"

  - entity: Card
    field: fraud_flag
    initial_state: CLEAN
    terminal_states: []
    note: "Parallel dimension: independent of card_status; a COMPROMISED card may be ACTIVE, SOFT_BLOCKED, etc."
    transitions:
      - from: [CLEAN, WATCH]
        to: COMPROMISED
        trigger: "system (POST /fraudops/compromised-card-events/{id}/confirm — card matched by exposure_window_match)"
        actor: system
        preconditions: ["Card has >= 1 transaction at event.merchant_id with scored_at in [window_start, window_end)"]
        side_effects:
          - "Creates a ReissueDecision (PENDING) per exposed card"
          - "Recomputes owning Account.risk_tier (calculation account_risk_tier); if the tier rose to HIGH, escalates that account's open alerts (priority = max(priority, 200 + band_points))"
      - from: WATCH
        to: CLEAN
        trigger: "system (POST /fraudops/fraud-rings/{id}/dismiss on a CONFIRMED ring — compensates the flag set at confirm)"
        actor: system
        preconditions: ["Ring being dismissed is CONFIRMED; flag was raised to WATCH by that ring's confirmation"]
        side_effects: ["Recomputes owning Account.risk_tier"]
      - from: COMPROMISED
        to: WATCH
        trigger: "system (ReissueDecision for this card becomes DECLINED — risk accepted)"
        actor: system
        preconditions: []
        side_effects: ["Recomputes owning Account.risk_tier"]
      - from: CLEAN
        to: WATCH
        trigger: "system (POST /fraudops/fraud-rings/{id}/confirm — account is a ring member)"
        actor: system
        preconditions: ["Owning account has a RingMembership in the confirmed ring"]
        side_effects: ["Recomputes owning Account.risk_tier"]

  - entity: RuleSet
    field: ruleset_status
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /fraudops/rule-sets/{id}/activate"
        actor: FraudOpsManager
        preconditions:
          - "ruleset_status == DRAFT"
          - "X-User-ID != created_by_user_id (segregation of duties — ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "The previously ACTIVE RuleSet with the same scope (if any) becomes RETIRED"
          - "Sets activated_by_user_id = X-User-ID"
      - from: [DRAFT, ACTIVE]
        to: RETIRED
        trigger: "POST /fraudops/rule-sets/{id}/retire, or system (superseded by activation of another RuleSet with the same scope)"
        actor: "FraudOpsManager | system"
        preconditions: ["ruleset_status in {DRAFT, ACTIVE}"]
        side_effects: ["After a manual retire the scope may have no ACTIVE ruleset; scoring then fails with ERR_NO_ACTIVE_RULESET"]

  - entity: AuthTransaction
    field: final_disposition
    initial_state: UNDISPOSED
    terminal_states: []
    transitions:
      - from: [UNDISPOSED, CONFIRMED_FRAUD, CONFIRMED_LEGIT]
        to: CONFIRMED_FRAUD
        trigger: "system (a FraudAlert referencing this transaction resolves FRAUD)"
        actor: system
        preconditions: []
        side_effects: ["Latest resolution wins: a later LEGIT resolution may overwrite (and vice versa)"]
      - from: [UNDISPOSED, CONFIRMED_FRAUD, CONFIRMED_LEGIT]
        to: CONFIRMED_LEGIT
        trigger: "system (a FraudAlert referencing this transaction resolves LEGIT)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: FraudAlert
    field: alert_status
    initial_state: OPEN
    terminal_states: [EXPIRED]
    transitions:
      - from: OPEN
        to: IN_REVIEW
        trigger: "POST /fraudops/fraud-alerts/{id}/claim"
        actor: FraudAnalyst
        preconditions: ["alert_status == OPEN (second claim on an IN_REVIEW alert -> ERR_INVALID_STATE)"]
        side_effects: ["assigned_to_user_id = X-User-ID"]
      - from: IN_REVIEW
        to: CONTACT_PENDING
        trigger: "system (POST /fraudops/verification-contacts creates a contact for this alert)"
        actor: system
        preconditions:
          - "alert_status == IN_REVIEW"
          - "assigned_to_user_id == X-User-ID of the contact creator (ERR_FORBIDDEN_ROLE otherwise)"
          - "Contact-gap rule on the account (ERR_CONTACT_TOO_SOON)"
        side_effects: []
      - from: [IN_REVIEW, CONTACT_PENDING]
        to: RESOLVED_FRAUD
        trigger: "POST /fraudops/fraud-alerts/{id}/resolve with resolution=FRAUD, or system on cardholder respond with outcome=CONFIRMED_FRAUD"
        actor: "FraudAnalyst | system"
        preconditions:
          - "alert_status in {IN_REVIEW, CONTACT_PENDING} (OPEN must be claimed first, except system path via respond)"
          - "Analyst path: assigned_to_user_id == X-User-ID"
          - "A COMPLETED VerificationContact for this alert with outcome == CONFIRMED_FRAUD and contacted_at after the last resolution (ERR_CONTACT_REQUIRED otherwise)"
          - "fraud_credit_cents (if provided) must satisfy the duplicate-credit cap for the linked transaction (ERR_DUPLICATE_CREDIT)"
        side_effects:
          - "If auth_transaction_id set: transaction.final_disposition = CONFIRMED_FRAUD"
          - "If card is ACTIVE: card -> SOFT_BLOCKED with block_reason CONFIRMED_FRAUD"
          - "Account.credit_balance_cents increases by fraud_credit_cents (while alert remains RESOLVED_FRAUD)"
          - "Recomputes Account.risk_tier (open_alert_count dropped)"
      - from: [IN_REVIEW, CONTACT_PENDING]
        to: RESOLVED_LEGIT
        trigger: "POST /fraudops/fraud-alerts/{id}/resolve with resolution=LEGIT, or system on cardholder respond with outcome=CONFIRMED_LEGIT"
        actor: "FraudAnalyst | system"
        preconditions:
          - "alert_status in {IN_REVIEW, CONTACT_PENDING}"
          - "Analyst path: assigned_to_user_id == X-User-ID"
          - "A COMPLETED VerificationContact with outcome == CONFIRMED_LEGIT and contacted_at after the last resolution (ERR_CONTACT_REQUIRED); UNREACHABLE never satisfies resolution"
          - "resolution=LEGIT requires fraud_credit_cents absent or 0 (ERR_INVALID_REQUEST)"
        side_effects:
          - "If auth_transaction_id set: transaction.final_disposition = CONFIRMED_LEGIT"
          - "Recomputes Account.risk_tier"
      - from: [RESOLVED_FRAUD, RESOLVED_LEGIT]
        to: IN_REVIEW
        trigger: "POST /fraudops/fraud-alerts/{id}/reopen"
        actor: "FraudAnalyst | FraudOpsManager"
        preconditions:
          - "reopen_count < 2 (ERR_REOPEN_LIMIT_EXCEEDED)"
          - "logical clock < resolved_at + 30 days (ERR_INVALID_STATE when the reopen window has passed)"
        side_effects:
          - "reopen_count += 1"
          - "If reopening RESOLVED_FRAUD: its fraud_credit_cents stops counting toward Account.credit_balance_cents (status no longer RESOLVED_FRAUD)"
          - "Recomputes Account.risk_tier (open_alert_count rose)"
      - from: [OPEN, IN_REVIEW, CONTACT_PENDING]
        to: EXPIRED
        trigger: "system (logical clock >= sla_expires_at; evaluated lazily on any read/write of the alert and on POST /_clock/set_current_utc)"
        actor: system
        preconditions: ["current logical time >= created_at + 72 hours"]
        side_effects: []

  - entity: VerificationContact
    field: contact_status
    initial_state: PENDING
    terminal_states: []
    transitions:
      - from: PENDING
        to: COMPLETED
        trigger: "POST /fraudops/verification-contacts/{id}/complete with outcome, or system (cardholder respond creates an IN_APP contact already COMPLETED)"
        actor: "FraudAnalyst | system"
        preconditions:
          - "contact_status == PENDING"
          - "Analyst path: creator of the contact (created_by_user_id) == X-User-ID"
        side_effects: ["Sets outcome"]

  - entity: CompromisedCardEvent
    field: event_status
    initial_state: RECEIVED
    terminal_states: [CLOSED]
    transitions:
      - from: RECEIVED
        to: CONFIRMED
        trigger: "POST /fraudops/compromised-card-events/{id}/confirm"
        actor: FraudOpsManager
        preconditions: ["event_status == RECEIVED"]
        side_effects:
          - "Sets confirmed_at to the logical clock"
          - "Cascade link 1: every Card with >= 1 transaction at merchant_id with scored_at in [window_start, window_end) has fraud_flag -> COMPROMISED (calculation exposure_window_match)"
          - "Cascade link 2: each newly COMPROMISED card spawns a ReissueDecision (PENDING, due_at = confirmed_at + 5 days, exposure_cents per reissue_exposure)"
          - "Cascade link 3: each owning Account.risk_tier is recomputed (any COMPROMISED card forces HIGH)"
          - "Cascade link 4: each account whose tier rose to HIGH escalates its open alerts: priority = max(priority, 200 + band_points)"
          - "Sets affected_card_count"
      - from: CONFIRMED
        to: CLOSED
        trigger: "system (compound: every ReissueDecision of this event is in APPROVED, DECLINED, or AUTO_APPROVED)"
        actor: system
        preconditions: ["No ReissueDecision of this event remains PENDING"]
        side_effects: []

  - entity: ReissueDecision
    field: decision
    initial_state: PENDING
    terminal_states: [APPROVED, DECLINED, AUTO_APPROVED]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /fraudops/reissue-decisions/{id}/decide with decision=APPROVE"
        actor: "FraudAnalyst | FraudOpsManager"
        preconditions: ["decision == PENDING"]
        side_effects:
          - "Mints replacement Card (fraud_flag WATCH, replaces_card_id = exposed card)"
          - "Exposed card card_status -> REPLACED (if ACTIVE or SOFT_BLOCKED); its ACTIVE TravelNotices -> CANCELLED"
          - "Re-evaluates parent event auto-close"
      - from: PENDING
        to: DECLINED
        trigger: "POST /fraudops/reissue-decisions/{id}/decide with decision=DECLINE"
        actor: "FraudAnalyst | FraudOpsManager"
        preconditions:
          - "decision == PENDING"
          - "rationale present (ERR_INVALID_REQUEST)"
          - "If exposure_cents > 50000, caller role must be FraudOpsManager (ERR_DECISION_EXPOSURE_REQUIRES_MANAGER)"
        side_effects:
          - "Card fraud_flag COMPROMISED -> WATCH (risk accepted; card may now be unblocked)"
          - "Re-evaluates parent event auto-close"
      - from: PENDING
        to: AUTO_APPROVED
        trigger: "system (logical clock >= due_at; evaluated lazily on any read/write of the decision and on POST /_clock/set_current_utc)"
        actor: system
        preconditions: ["current logical time >= due_at"]
        side_effects: ["Same replacement-card cascade as APPROVED; decided_by_user_id = SYSTEM"]

  - entity: TravelNotice
    field: notice_status
    initial_state: ACTIVE
    terminal_states: [CANCELLED, EXPIRED]
    transitions:
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /fraudops/travel-notices/{id}/cancel"
        actor: "FraudAnalyst | Cardholder (owner only)"
        preconditions: ["notice_status == ACTIVE"]
        side_effects: []
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (logical clock's current date >= end_date; lazy evaluation as with alerts)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: ChargebackCase
    field: cb_status
    initial_state: FILED
    terminal_states: [RESOLVED_WON, RESOLVED_LOST, WITHDRAWN]
    transitions:
      - from: FILED
        to: PROVISIONAL_CREDIT_POSTED
        trigger: "POST /fraudops/chargeback-cases/{id}/post-provisional-credit"
        actor: RecoverySpecialist
        preconditions:
          - "cb_status == FILED (ERR_CHARGEBACK_INVALID_STATE otherwise — beats the fiscal check)"
          - "provisional_credit_cents >= 1 (ERR_INVALID_REQUEST)"
          - "Duplicate-credit cap: provisional_credit_cents + existing active chargeback credits on the transaction + fraud_credit_cents of RESOLVED_FRAUD alerts on the transaction <= transaction.amount_cents (ERR_DUPLICATE_CREDIT)"
        side_effects: ["Account.credit_balance_cents += provisional_credit_cents"]
      - from: PROVISIONAL_CREDIT_POSTED
        to: REPRESENTMENT_FILED
        trigger: "POST /fraudops/chargeback-cases/{id}/representment"
        actor: RecoverySpecialist
        preconditions: ["cb_status == PROVISIONAL_CREDIT_POSTED"]
        side_effects: []
      - from: REPRESENTMENT_FILED
        to: RESOLVED_WON
        trigger: "POST /fraudops/chargeback-cases/{id}/resolve with outcome=WON"
        actor: RecoverySpecialist
        preconditions: ["cb_status == REPRESENTMENT_FILED"]
        side_effects: ["Credit is retained: provisional_credit_cents keeps counting toward Account.credit_balance_cents"]
      - from: [PROVISIONAL_CREDIT_POSTED, REPRESENTMENT_FILED]
        to: RESOLVED_LOST
        trigger: "POST /fraudops/chargeback-cases/{id}/resolve with outcome=LOST"
        actor: RecoverySpecialist
        preconditions: ["cb_status in {PROVISIONAL_CREDIT_POSTED, REPRESENTMENT_FILED} (WON requires REPRESENTMENT_FILED)"]
        side_effects: ["Credit is reversed: provisional_credit_cents stops counting toward Account.credit_balance_cents"]
      - from: FILED
        to: WITHDRAWN
        trigger: "POST /fraudops/chargeback-cases/{id}/withdraw"
        actor: RecoverySpecialist
        preconditions: ["cb_status == FILED (cannot withdraw once credit is posted)"]
        side_effects: []

  - entity: LossEntry
    field: loss_status
    initial_state: ESTIMATED
    terminal_states: [FULLY_RECOVERED, WRITTEN_OFF]
    transitions:
      - from: ESTIMATED
        to: BOOKED
        trigger: "POST /fraudops/loss-entries/{id}/book"
        actor: LossAccountant
        preconditions: ["loss_status == ESTIMATED"]
        side_effects: ["Sets booked_by_user_id = X-User-ID and booked_at = logical clock"]
      - from: BOOKED
        to: FINALIZED
        trigger: "POST /fraudops/loss-entries/{id}/finalize with final_amount_cents"
        actor: LossAccountant
        preconditions:
          - "loss_status == BOOKED"
          - "Logical clock <= booked_at + 30 days (ERR_FINALIZE_WINDOW_EXPIRED — temporal, checked before the fiscal tolerance)"
          - "No covered transaction has a ChargebackCase in FILED, PROVISIONAL_CREDIT_POSTED, or REPRESENTMENT_FILED (ERR_CHARGEBACK_PENDING)"
          - "|final_amount_cents - provisional_amount_cents| <= tolerance_cents, inclusive (ERR_FINAL_AMOUNT_TOLERANCE)"
        side_effects:
          - "Sets final_amount_cents, finalized_at; outstanding_cents = final_amount_cents"
          - "Recomputes Account.rolling_90d_loss_cents and risk_tier"
      - from: [FINALIZED, PARTIALLY_RECOVERED]
        to: WRITTEN_OFF
        trigger: "POST /fraudops/loss-entries/{id}/write-off"
        actor: LossAccountant
        preconditions: ["loss_status in {FINALIZED, PARTIALLY_RECOVERED}", "outstanding_cents > 0 (ERR_INVALID_STATE when nothing remains)"]
        side_effects: ["written_off_cents = outstanding_cents (outstanding becomes 0)"]
      - from: FINALIZED
        to: PARTIALLY_RECOVERED
        trigger: "system (a RecoveryFiling on this loss becomes PAID with paid_cents < outstanding)"
        actor: system
        preconditions: []
        side_effects: ["outstanding_cents recomputed (INV-LOSS)"]
      - from: [FINALIZED, PARTIALLY_RECOVERED]
        to: FULLY_RECOVERED
        trigger: "system (recovery PAID brings outstanding_cents to 0)"
        actor: system
        preconditions: ["outstanding_cents == 0 after applying a PAID filing"]
        side_effects: ["Recomputes Account.rolling_90d_loss_cents (FULLY_RECOVERED is excluded from the rolling set) and risk_tier"]
      - from: [PARTIALLY_RECOVERED, FULLY_RECOVERED]
        to: FINALIZED
        trigger: "system (a PAID RecoveryFiling is REVERSED — network clawback)"
        actor: system
        preconditions: []
        side_effects:
          - "outstanding_cents restored by the reversed paid_cents (INV-LOSS: PAID+REVERSED leaves outstanding unchanged)"
          - "Status recompute: outstanding == final_amount_cents -> FINALIZED; 0 < outstanding < final -> PARTIALLY_RECOVERED"
          - "Recomputes Account.rolling_90d_loss_cents and risk_tier"

  - entity: RecoveryFiling
    field: filing_status
    initial_state: FILED
    terminal_states: [REJECTED, REVERSED]
    transitions:
      - from: FILED
        to: ACCEPTED
        trigger: "POST /fraudops/recovery-filings/{id}/mark-outcome with outcome=ACCEPTED"
        actor: RecoverySpecialist
        preconditions: ["filing_status == FILED"]
        side_effects: []
      - from: FILED
        to: REJECTED
        trigger: "POST /fraudops/recovery-filings/{id}/mark-outcome with outcome=REJECTED"
        actor: RecoverySpecialist
        preconditions: ["filing_status == FILED"]
        side_effects: []
      - from: ACCEPTED
        to: PAID
        trigger: "POST /fraudops/recovery-filings/{id}/mark-outcome with outcome=PAID and paid_cents"
        actor: RecoverySpecialist
        preconditions:
          - "filing_status == ACCEPTED (marking PAID from FILED -> ERR_INVALID_STATE)"
          - "paid_cents present and >= 1 (ERR_INVALID_REQUEST)"
          - "paid_cents <= claimed_cents and paid_cents <= loss.outstanding_cents (ERR_RECOVERY_EXCEEDS_OUTSTANDING)"
        side_effects:
          - "Sets paid_cents"
          - "Loss outstanding_cents recomputed; loss status may become PARTIALLY_RECOVERED or FULLY_RECOVERED (cascade into account rolling loss and risk_tier)"
      - from: PAID
        to: REVERSED
        trigger: "POST /fraudops/recovery-filings/{id}/mark-outcome with outcome=REVERSED"
        actor: RecoverySpecialist
        preconditions: ["filing_status == PAID"]
        side_effects: ["Loss outstanding_cents restored; loss status recomputed (compensation)"]

  - entity: FraudRing
    field: ring_status
    initial_state: SUSPECTED
    terminal_states: [DISMISSED]
    transitions:
      - from: SUSPECTED
        to: CONFIRMED
        trigger: "POST /fraudops/fraud-rings/{id}/confirm"
        actor: FraudOpsManager
        preconditions: ["ring_status == SUSPECTED"]
        side_effects:
          - "Every card of every member account with fraud_flag == CLEAN becomes WATCH"
          - "Each member Account.risk_tier is recomputed"
          - "Each member account whose tier rose to HIGH escalates its open alerts: priority = max(priority, 200 + band_points)"
      - from: SUSPECTED
        to: DISMISSED
        trigger: "POST /fraudops/fraud-rings/{id}/dismiss"
        actor: FraudOpsManager
        preconditions: ["ring_status == SUSPECTED"]
        side_effects: []
      - from: CONFIRMED
        to: DISMISSED
        trigger: "POST /fraudops/fraud-rings/{id}/dismiss"
        actor: FraudOpsManager
        preconditions: ["ring_status == CONFIRMED"]
        side_effects:
          - "Compensation: cards raised to WATCH by this ring's confirmation return to CLEAN (cards that are COMPROMISED stay COMPROMISED)"
          - "Member Account.risk_tier recomputed"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: ruleset-update-stale-version
    parent_entity: RuleSet
    write_endpoint: "PUT /fraudops/rule-sets/{id}"
    occ_field: expected_ruleset_version
    description: |
      Updating a DRAFT RuleSet's tunable fields requires the caller to present the
      RuleSet.version it last observed. A second update that still carries the
      pre-update version is rejected, because an earlier update has already
      legitimately superseded those tuning values. This is resolved purely by the
      stale-version check; no overlapping requests are involved.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: authorization_scoring
    trigger: "POST /fraudops/auth-transactions (variant realtime); on every read of an AuthTransaction (variant shadow, recomputed under the currently ACTIVE ruleset for the transaction's scope)"
    algorithm: weighted_scoring
    formula: |
      # Scope resolution (selector): candidate = the ACTIVE RuleSet whose scope == "DEBIT_CARD"
      # when card.product_type == DEBIT, or == "CREDIT_CARD" when CREDIT; if none, fall back to
      # the ACTIVE GLOBAL RuleSet; if none, reject intake with ERR_NO_ACTIVE_RULESET.
      # At most one ACTIVE ruleset per scope exists (activation supersedes), so no ranking is needed.
      if card.card_status != ACTIVE:
          decision = DECLINE; decision_reason = CARD_BLOCKED
          auth_score = null; ruleset_id = null          # scoring bypassed entirely; no alert created
      else:
          amount_points  = points of the tier with the greatest min_amount_cents that is <= amount_cents
          channel_points = channel_weights[channel]
          if origin_country == home_country: cross = 0
          elif origin_country in high_risk_countries: cross = cross_border_weight * high_risk_multiplier
          else: cross = cross_border_weight
          # travel suppression: if an ACTIVE TravelNotice exists for this card with
          # region_country == origin_country and start_date <= date(scored_at) < end_date: cross = 0
          flag_points = watch_weight if card.fraud_flag == WATCH else (compromised_weight if COMPROMISED else 0)
          score = base_score + amount_points + channel_points + cross + flag_points
          if score >= decline_threshold: decision = DECLINE          # inclusive boundary
          elif score >= review_threshold: decision = REVIEW          # creates exactly one FraudAlert
          else: decision = APPROVE
          decision_reason = RULE_SCORE; ruleset_id = <pinned ruleset>; auth_score = score
      # variant shadow (read-time): same formula evaluated under the ruleset ACTIVE *now* for the
      # transaction's scope -> shadow_score / shadow_decision / shadow_ruleset_id. When the pinned
      # ruleset has been superseded by one with different weights/thresholds, realtime and shadow
      # diverge for identical transaction data.
    input_set: "The single transaction being scored; card + account state at scored_at (realtime) or at read time (shadow)"
    constants:
      REVIEW_ALERT_BAND_CAP: 49
    precision: "integer points; no rounding"
    variants:
      - name: realtime
        when: "At intake (POST /fraudops/auth-transactions)"
        difference: "Uses the ACTIVE ruleset pinned at scored_at; result persisted as auth_score/decision"
      - name: shadow
        when: "On every GET of the transaction and in ruleset metrics (missed_declines_under_current)"
        difference: "Recomputed under the ruleset ACTIVE at read time; identical data yields a different score/decision whenever a superseding ruleset changed weights or thresholds"

  - name: loss_provision_estimate
    trigger: "POST /fraudops/loss-entries (provisional variant, computed and stored); POST /fraudops/loss-entries/{id}/finalize (final variant, supplied by the accountant and checked against the provisional tolerance)"
    algorithm: aggregation
    formula: |
      # provisional variant — ROUNDING ORDER IS PINNED: round each line first, then sum.
      provisional_amount_cents = SUM over each transaction t in transaction_ids of:
          round_half_up(t.amount_cents * (1 - RECOVERY_RATE[network of t's card]))
      tolerance_cents = round_half_up(provisional_amount_cents * FINALIZE_TOLERANCE_PCT)
      # final variant — chronological actuals: the accountant books the confirmed amount
      # (sum of confirmed fraud amounts as verified), supplied as final_amount_cents.
      # The two variants intentionally produce different cents for identical transactions:
      # e.g. amounts 10001 (VISA) + 10001 (MASTERCARD): per-line rounding gives
      # round(5500.55) + round(6000.60) = 5501 + 6001 = 11502; rounding after summing would
      # give round(11501.15) = 11501. The pinned order is per-line-then-sum -> 11502.
    input_set: "Transactions listed in transaction_ids (all must belong to the account and have final_disposition == CONFIRMED_FRAUD)"
    constants:
      RECOVERY_RATE: { VISA: 0.45, MASTERCARD: 0.40 }
      FINALIZE_TOLERANCE_PCT: 0.10
    precision: "integer cents; round_half_up per transaction line, then sum"
    variants:
      - name: provisional
        when: "At LossEntry creation"
        difference: "Forward-looking estimate net of expected network recovery (RECOVERY_RATE by card network)"
      - name: final
        when: "At finalization"
        difference: "Actual booked amount confirmed by the accountant; must lie within tolerance_cents of the provisional estimate (inclusive)"

  - name: account_risk_tier
    trigger: "On alert creation/resolution/reopen/expiry, on card fraud_flag changes (compromise confirm, ring confirm/dismiss, reissue decline), on loss finalize/recovery/write-off"
    algorithm: threshold
    formula: |
      open_alerts = count of the account's FraudAlerts in {OPEN, IN_REVIEW, CONTACT_PENDING}
      rolling = rolling_90d_loss_cents (see rolling_confirmed_loss)
      if open_alerts >= 2 OR rolling >= 100000 OR any card of the account has fraud_flag == COMPROMISED:
          risk_tier = HIGH
      elif open_alerts == 1 OR rolling >= 25000 OR any card has fraud_flag == WATCH:
          risk_tier = MEDIUM
      else: risk_tier = LOW
      # Boundaries are inclusive (>=, ==) as written.
    input_set: "The account's alerts (statuses OPEN/IN_REVIEW/CONTACT_PENDING), losses (FINALIZED/PARTIALLY_RECOVERED/WRITTEN_OFF finalized within [now-90d, now]), and cards"
    constants:
      HIGH_OPEN_ALERTS: 2
      HIGH_ROLLING_LOSS_CENTS: 100000
      MEDIUM_ROLLING_LOSS_CENTS: 25000
    precision: "integer comparisons"

  - name: alert_priority
    trigger: "On FraudAlert creation; escalated on compromise-event confirmation and ring confirmation"
    algorithm: weighted_scoring
    formula: |
      # CIRCULAR-LOOKING DEPENDENCY — evaluation order is pinned:
      #   step 1: compute the account's risk_tier EXCLUDING the alert being created
      #           (account_risk_tier above);
      #   step 2: freeze band_points (25 for MANUAL; min(49, max(0, auth_score - review_threshold))
      #           for SCORING_REVIEW);
      #   step 3: priority = TIER_POINTS[tier_from_step_1] + band_points; frozen thereafter.
      # Escalation (compromise confirm / ring confirm raising the account to HIGH):
      #   priority = max(priority, TIER_POINTS[HIGH] + band_points)   # one-way raise only
      # Alert creation itself NEVER recomputes older alerts' priorities.
      # Triage order for the queue: OPEN alerts sorted priority DESC, tie-break created_at ASC
      # (never id).
    input_set: "The alert being created (or escalated); the account's other open alerts via risk_tier"
    constants:
      TIER_POINTS: { LOW: 0, MEDIUM: 100, HIGH: 200 }
      MANUAL_BAND: 25
      BAND_CAP: 49
    precision: "integer points"

  - name: rolling_confirmed_loss
    trigger: "On loss finalize, write-off, recovery PAID/REVERSED (status flips re-include or exclude the loss)"
    algorithm: aggregation
    formula: |
      rolling_90d_loss_cents = SUM of final_amount_cents over the account's LossEntries whose
      loss_status IN {FINALIZED, PARTIALLY_RECOVERED, WRITTEN_OFF}
      AND finalized_at IN [now - 90 days, now]   (both bounds inclusive; FULLY_RECOVERED excluded)
    input_set: "LossEntries of the account in the statuses above, windowed by finalized_at against the logical clock"
    constants:
      WINDOW_DAYS: 90
    precision: "integer cents"

  - name: account_credit_balance
    trigger: "On chargeback post-provisional-credit, resolve LOST (reversal), and on alert resolve/reopen (fraud credit added or withdrawn)"
    algorithm: aggregation
    formula: |
      credit_balance_cents =
          SUM of provisional_credit_cents over the account's ChargebackCases in
              {PROVISIONAL_CREDIT_POSTED, REPRESENTMENT_FILED, RESOLVED_WON}
        + SUM of fraud_credit_cents over the account's FraudAlerts in RESOLVED_FRAUD.
      # Invariant INV-CREDIT: posting a provisional credit and later resolving that chargeback
      # LOST leaves credit_balance_cents unchanged (compensating pair).
    input_set: "The account's ChargebackCases and FraudAlerts in the statuses above"
    constants: {}
    precision: "integer cents"

  - name: exposure_window_match
    trigger: "POST /fraudops/compromised-card-events/{id}/confirm"
    algorithm: aggregation
    formula: |
      exposed_cards = DISTINCT cards that have >= 1 AuthTransaction with
          merchant_id == event.merchant_id AND
          scored_at IN [window_start, window_end)    # half-open: start inclusive, end exclusive
      (transactions with any decision — APPROVE, REVIEW, or DECLINE — count as exposure)
      Each exposed card: fraud_flag -> COMPROMISED and one ReissueDecision created.
      affected_card_count = |exposed_cards|.
      # Deterministic creation order for ReissueDecisions: by the card's earliest matching
      # transaction scored_at ASC, tie-break card.created_at ASC (never id).
    input_set: "All AuthTransactions of all cards; filtered by merchant_id and the half-open window"
    constants: {}
    precision: "exact timestamp comparison"

  - name: reissue_exposure
    trigger: "On ReissueDecision creation (during compromise confirmation)"
    algorithm: aggregation
    formula: |
      exposure_cents = SUM of amount_cents over the card's AuthTransactions matching
      exposure_window_match for the parent event.
    input_set: "The card's transactions at the event merchant inside [window_start, window_end)"
    constants:
      DECLINE_MANAGER_THRESHOLD_CENTS: 50000
    precision: "integer cents"

  - name: false_positive_monitor
    trigger: "GET /fraudops/rule-sets/{id}/metrics"
    algorithm: aggregation
    formula: |
      Population: AuthTransactions with ruleset_id == this ruleset (pinned at scoring).
      scored_count    = |population|
      approved_count  = |population with decision == APPROVE|
      review_count    = |population with decision == REVIEW|
      declined_count  = |population with decision == DECLINE|
      confirmed_fraud_count = |population with final_disposition == CONFIRMED_FRAUD|
      confirmed_legit_count = |population with final_disposition == CONFIRMED_LEGIT|
      fp_rate_review_basis_bp  = round_half_up(10000 * legit among REVIEW  / (REVIEW with any disposition != UNDISPOSED)); 0 when denominator == 0
      fp_rate_decline_basis_bp = round_half_up(10000 * legit among DECLINE / (DECLINE with any disposition != UNDISPOSED)); 0 when denominator == 0
      missed_declines_under_current = |population with decision != DECLINE AND shadow_decision == DECLINE|
      gross_confirmed_loss_cents = SUM of final_amount_cents of losses (FINALIZED, PARTIALLY_RECOVERED,
          FULLY_RECOVERED, WRITTEN_OFF) covering transactions of this population
      # The two fp_rate bases are two valid answers to "what is the false-positive rate":
      # they share data but different denominators and diverge whenever declined traffic is
      # later confirmed legitimate (painful false declines) at a different rate than reviews.
    input_set: "Transactions pinned to this ruleset plus their dispositions; shadow rescored under the currently ACTIVE ruleset for each transaction's scope"
    constants: {}
    precision: "basis points as integers, round_half_up"
    variants:
      - name: review_basis
        when: "FP rate measured over REVIEW-decision traffic"
        difference: "Denominator = disposed REVIEW transactions (alert-driven workload)"
      - name: decline_basis
        when: "FP rate measured over DECLINE-decision traffic"
        difference: "Denominator = disposed DECLINE transactions; same population, different filter, different rate"

  - name: loss_outstanding
    trigger: "On finalize, recovery PAID, recovery REVERSED, write-off"
    algorithm: aggregation
    formula: |
      outstanding_cents = final_amount_cents
                          - SUM of paid_cents over RecoveryFilings of this loss in status PAID
                          - written_off_cents
      # Invariant INV-LOSS: a filing marked PAID and later REVERSED leaves outstanding_cents
      # unchanged (compensating pair); REVERSED filings are excluded from the sum.
    input_set: "The LossEntry and its RecoveryFilings"
    constants: {}
    precision: "integer cents"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority — a request failing several
# checks reports the LOWEST-priority-numbered failure)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and names a declared role; X-User-ID header present"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "The role is permitted to call this endpoint per §1.5 roles"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Path-template ids resolve to existing resources, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path ids"
  - priority: 4
    category: auth
    check: "Cardholder ownership: X-User-ID (an Account.id) must own the target resource (account itself, alert.account_id, card.account_id, travel notice's card's account_id)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "endpoints callable by Cardholder"
  - priority: 5
    category: existence
    check: "Body foreign references resolve: card_id, account_id, alert_id, auth_transaction_id, loss_entry_id, and every element of transaction_ids"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "endpoints taking body FK references"
  - priority: 6
    category: business_constraint
    check: "Request shape: required fields present, enum members valid, amount_cents >= 1 where required, dates well-formed, review_threshold < decline_threshold (ERR_THRESHOLD_ORDER_INVALID), start < end on windows (ERR_INVALID_WINDOW), rationale present on DECLINE, OCC expected_ruleset_version present and current (ERR_STALE_VERSION, 412)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all write endpoints"
    note: "ERR_INVALID_WINDOW is 422, ERR_THRESHOLD_ORDER_INVALID is 422, ERR_STALE_VERSION is 412; other shape failures are ERR_INVALID_REQUEST 400"
  - priority: 7
    category: state
    check: "State-machine preconditions for the target resource (transition valid from current state; terminal lockdown; auto-expiry applied lazily before the check). Domain-specific variants: ERR_CHARGEBACK_INVALID_STATE for ChargebackCase transitions; ERR_NO_ACTIVE_RULESET when no ACTIVE ruleset covers the transaction's scope; ERR_ACCOUNT_NOT_ACTIVE when an account-gated write hits a SUSPENDED account"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 8
    category: business_safety
    check: "Safety/compliance: unblock rejected while fraud_flag == COMPROMISED and no DECLINED ReissueDecision exists (ERR_CARD_COMPROMISED); segregation of duties — ruleset activator != creator and recovery filer != loss booker (ERR_SEGREGATION_OF_DUTIES); high-exposure reissue decline requires FraudOpsManager (ERR_DECISION_EXPOSURE_REQUIRES_MANAGER); alert reopen cap reopen_count < 2 (ERR_REOPEN_LIMIT_EXCEEDED)"
    error_id: ERR_CARD_COMPROMISED
    http_status: 409
    applies_to: "unblock / activate / filing create / decide / reopen"
    note: "ERR_SEGREGATION_OF_DUTIES and ERR_DECISION_EXPOSURE_REQUIRES_MANAGER are 403; ERR_REOPEN_LIMIT_EXCEEDED is 409"
  - priority: 9
    category: business_temporal
    check: "Temporal: travel-notice half-open overlap per (card_id, region_country) among ACTIVE notices (ERR_TRAVEL_NOTICE_OVERLAP); verification-contact minimum gap of 60 minutes per account (ERR_CONTACT_TOO_SOON); loss finalize within booked_at + 30 days (ERR_FINALIZE_WINDOW_EXPIRED)"
    error_id: ERR_TRAVEL_NOTICE_OVERLAP
    http_status: 409
    applies_to: "travel-notice create / verification-contact create / loss finalize"
    note: "All three are 409"
  - priority: 10
    category: business_referential
    check: "Referential/duplicate guards: event_reference uniqueness (ERR_DUPLICATE_EVENT); at most one non-terminal chargeback per transaction (ERR_CHARGEBACK_EXISTS); transaction not already covered by a non-terminal loss (ERR_TXN_ALREADY_IN_LOSS); resolve requires a matching COMPLETED contact (ERR_CONTACT_REQUIRED); finalize blocked by an open chargeback on a covered transaction (ERR_CHARGEBACK_PENDING); chargeback requires transaction decision == APPROVE (ERR_TXN_NOT_DISPUTABLE); loss transactions must be CONFIRMED_FRAUD and belong to the account (ERR_LOSS_TXN_NOT_CONFIRMED); manual alert card must belong to the given account (ERR_INVALID_REQUEST)"
    error_id: ERR_DUPLICATE_EVENT
    http_status: 409
    applies_to: "event intake / chargeback create / loss create / alert resolve / loss finalize"
    note: "ERR_LOSS_TXN_NOT_CONFIRMED is 422; the rest are 409"
  - priority: 11
    category: business_fiscal
    check: "Fiscal caps: duplicate-credit cap per transaction at chargeback posting and at FRAUD resolution (ERR_DUPLICATE_CREDIT); recovery claimed/paid amounts bounded by loss outstanding (ERR_RECOVERY_EXCEEDS_OUTSTANDING); finalize amount within inclusive tolerance (ERR_FINAL_AMOUNT_TOLERANCE)"
    error_id: ERR_DUPLICATE_CREDIT
    http_status: 422
    applies_to: "chargeback post / alert resolve / recovery filing create + mark-outcome / loss finalize"
    note: "All three fiscal errors are 422"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- test-driving logical clock ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Sets the logical clock used by every timestamp/deadline rule. Startup default (before any call): exactly 2026-08-01T00:00:00Z; the server MUST NOT fall back to wall-clock time. Side effect: lazily applies time-based transitions (alert EXPIRED at sla_expires_at, reissue AUTO_APPROVED at due_at, travel-notice EXPIRED at end_date)."
    roles: [FraudOpsManager]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["Applies all due time-based transitions"]

  # ---- RuleSets ----
  - method: POST
    path: "/fraudops/rule-sets"
    description: "Create a DRAFT ruleset; created_by_user_id = X-User-ID"
    roles: [FraudAnalyst, FraudOpsManager]
    code: 201
    input: [scope, base_score, review_threshold, decline_threshold, amount_tiers, channel_weights, cross_border_weight, high_risk_multiplier, watch_weight, compromised_weight, "high_risk_countries?"]
    output: RuleSet
    side_effects: []
  - method: GET
    path: "/fraudops/rule-sets"
    description: "List rulesets with optional filters"
    roles: [FraudAnalyst, FraudOpsManager]
    code: 200
    input: ["scope?", "ruleset_status?", "limit?", "offset?"]
    output: RuleSet[]
    side_effects: []
  - method: GET
    path: "/fraudops/rule-sets/{id}"
    description: "Get one ruleset"
    roles: [FraudAnalyst, FraudOpsManager]
    code: 200
    input: []
    output: RuleSet
    side_effects: []
  - method: PUT
    path: "/fraudops/rule-sets/{id}"
    description: "Tune a DRAFT ruleset's fields (OCC-guarded; see concurrency_rules). Increments RuleSet.version by 1."
    roles: [FraudAnalyst, FraudOpsManager]
    code: 200
    input: [expected_ruleset_version, "base_score?", "review_threshold?", "decline_threshold?", "amount_tiers?", "channel_weights?", "cross_border_weight?", "high_risk_multiplier?", "watch_weight?", "compromised_weight?", "high_risk_countries?"]
    output: RuleSet
    side_effects: ["increments RuleSet.version by 1"]
  - method: POST
    path: "/fraudops/rule-sets/{id}/activate"
    description: "Activate a DRAFT ruleset; supersedes the currently ACTIVE ruleset of the same scope (it becomes RETIRED). Activator must differ from created_by_user_id."
    roles: [FraudOpsManager]
    code: 200
    input: []
    output: RuleSet
    side_effects: ["Prior ACTIVE ruleset in scope -> RETIRED", "activated_by_user_id set"]
  - method: POST
    path: "/fraudops/rule-sets/{id}/retire"
    description: "Retire a DRAFT or ACTIVE ruleset"
    roles: [FraudOpsManager]
    code: 200
    input: []
    output: RuleSet
    side_effects: ["Scope may be left without ACTIVE coverage"]
  - method: GET
    path: "/fraudops/rule-sets/{id}/metrics"
    description: "False-positive vs loss trade-off monitor for this ruleset (calculation false_positive_monitor)"
    roles: [FraudAnalyst, FraudOpsManager]
    code: 200
    input: []
    output: "{ scored_count: integer, approved_count: integer, review_count: integer, declined_count: integer, confirmed_fraud_count: integer, confirmed_legit_count: integer, fp_rate_review_basis_bp: integer, fp_rate_decline_basis_bp: integer, missed_declines_under_current: integer, gross_confirmed_loss_cents: integer }"
    side_effects: []

  # ---- Accounts ----
  - method: POST
    path: "/fraudops/accounts"
    description: "Open an account (status ACTIVE, balances 0, risk_tier LOW)"
    roles: [FraudOpsManager]
    code: 201
    input: [account_number, cardholder_name, home_country]
    output: Account
    side_effects: []
  - method: GET
    path: "/fraudops/accounts"
    description: "List accounts with optional filters"
    roles: [FraudAnalyst, FraudOpsManager, LossAccountant, RecoverySpecialist]
    code: 200
    input: ["status?", "risk_tier?", "limit?", "offset?"]
    output: Account[]
    side_effects: []
  - method: GET
    path: "/fraudops/accounts/{id}"
    description: "Get one account; Cardholder may read only the account whose id equals X-User-ID"
    roles: [FraudAnalyst, FraudOpsManager, LossAccountant, RecoverySpecialist, Cardholder]
    code: 200
    input: []
    output: Account
    side_effects: []
  - method: POST
    path: "/fraudops/accounts/{id}/suspend"
    description: "ACTIVE -> SUSPENDED; blocks new travel notices and cards"
    roles: [FraudOpsManager]
    code: 200
    input: []
    output: Account
    side_effects: []
  - method: POST
    path: "/fraudops/accounts/{id}/reinstate"
    description: "SUSPENDED -> ACTIVE"
    roles: [FraudOpsManager]
    code: 200
    input: []
    output: Account
    side_effects: []

  # ---- Cards ----
  - method: POST
    path: "/fraudops/cards"
    description: "Issue a card (ACTIVE, fraud_flag CLEAN); account must be ACTIVE"
    roles: [FraudOpsManager]
    code: 201
    input: [account_id, pan_token, product_type, network]
    output: Card
    side_effects: []
  - method: GET
    path: "/fraudops/cards"
    description: "List cards with optional filters (reverse reachability for account_id and replaces_card_id)"
    roles: [FraudAnalyst, FraudOpsManager]
    code: 200
    input: ["account_id?", "replaces_card_id?", "card_status?", "fraud_flag?", "limit?", "offset?"]
    output: Card[]
    side_effects: []
  - method: GET
    path: "/fraudops/cards/{id}"
    description: "Get one card"
    roles: [FraudAnalyst, FraudOpsManager]
    code: 200
    input: []
    output: Card
    side_effects: []
  - method: POST
    path: "/fraudops/cards/{id}/block"
    description: "block_type SOFT: ACTIVE->SOFT_BLOCKED; HARD: ACTIVE/SOFT_BLOCKED->HARD_CLOSED"
    roles: [FraudAnalyst, FraudOpsManager]
    code: 200
    input: [block_type, reason]
    output: Card
    side_effects: ["Sets block_reason"]
  - method: POST
    path: "/fraudops/cards/{id}/unblock"
    description: "SOFT_BLOCKED->ACTIVE; rejected while fraud_flag == COMPROMISED unless a ReissueDecision for the card is DECLINED"
    roles: [FraudAnalyst, FraudOpsManager]
    code: 200
    input: []
    output: Card
    side_effects: ["Clears block_reason"]
  - method: GET
    path: "/fraudops/cards/{id}/travel-notices"
    description: "Travel notices of a card (sub-resource reverse reachability)"
    roles: [FraudAnalyst, FraudOpsManager, Cardholder]
    code: 200
    input: ["notice_status?", "limit?", "offset?"]
    output: TravelNotice[]
    side_effects: []

  # ---- AuthTransactions ----
  - method: POST
    path: "/fraudops/auth-transactions"
    description: "Real-time authorization intake from the network; scores under the ACTIVE ruleset (authorization_scoring); REVIEW creates exactly one FraudAlert (source SCORING_REVIEW). Blocked cards -> decision DECLINE with decision_reason CARD_BLOCKED, auth_score null, no alert (still recorded, HTTP 201)."
    roles: [NetworkGateway]
    code: 201
    input: [card_id, amount_cents, merchant_id, merchant_category_code, channel, origin_country, "currency?"]
    output: AuthTransaction
    side_effects: ["May create FraudAlert on REVIEW"]
  - method: GET
    path: "/fraudops/auth-transactions"
    description: "List transactions with optional filters (reverse reachability for card_id, account_id, ruleset_id, shadow_ruleset_id)"
    roles: [FraudAnalyst, FraudOpsManager, RecoverySpecialist]
    code: 200
    input: ["card_id?", "account_id?", "ruleset_id?", "shadow_ruleset_id?", "decision?", "final_disposition?", "merchant_id?", "limit?", "offset?"]
    output: AuthTransaction[]
    side_effects: []
  - method: GET
    path: "/fraudops/auth-transactions/{id}"
    description: "Get one transaction (computes shadow_score/shadow_decision/shadow_ruleset_id under the currently ACTIVE ruleset)"
    roles: [FraudAnalyst, FraudOpsManager, RecoverySpecialist]
    code: 200
    input: []
    output: AuthTransaction
    side_effects: []

  # ---- FraudAlerts ----
  - method: POST
    path: "/fraudops/fraud-alerts"
    description: "Create a MANUAL alert (e.g., cardholder called in); card must belong to account; transaction optional and may have any decision"
    roles: [FraudAnalyst]
    code: 201
    input: [account_id, card_id, "auth_transaction_id?"]
    output: FraudAlert
    side_effects: ["priority computed per alert_priority", "Account risk_tier recomputed"]
  - method: GET
    path: "/fraudops/fraud-alerts"
    description: "List alerts; queue order for alert_status=OPEN is priority DESC, created_at ASC"
    roles: [FraudAnalyst, FraudOpsManager]
    code: 200
    input: ["account_id?", "card_id?", "auth_transaction_id?", "alert_status?", "assigned_to_user_id?", "limit?", "offset?"]
    output: FraudAlert[]
    side_effects: []
  - method: GET
    path: "/fraudops/fraud-alerts/{id}"
    description: "Get one alert; Cardholder may read only alerts of their own account"
    roles: [FraudAnalyst, FraudOpsManager, Cardholder]
    code: 200
    input: []
    output: FraudAlert
    side_effects: ["Lazy expiry may flip status to EXPIRED"]
  - method: POST
    path: "/fraudops/fraud-alerts/{id}/claim"
    description: "OPEN -> IN_REVIEW; assigns to caller"
    roles: [FraudAnalyst]
    code: 200
    input: []
    output: FraudAlert
    side_effects: ["assigned_to_user_id = X-User-ID"]
  - method: POST
    path: "/fraudops/fraud-alerts/{id}/resolve"
    description: "IN_REVIEW/CONTACT_PENDING -> RESOLVED_FRAUD or RESOLVED_LEGIT; requires a matching COMPLETED contact newer than the last resolution"
    roles: [FraudAnalyst]
    code: 200
    input: [resolution, "fraud_credit_cents?"]
    output: FraudAlert
    side_effects: ["Sets transaction final_disposition", "FRAUD soft-blocks an ACTIVE card", "fraud_credit_cents feeds account credit balance", "risk_tier recompute"]
  - method: POST
    path: "/fraudops/fraud-alerts/{id}/respond"
    description: "Cardholder self-service response; creates a COMPLETED IN_APP VerificationContact and resolves the alert accordingly (even from OPEN)"
    roles: [Cardholder]
    code: 200
    input: [outcome]
    output: FraudAlert
    side_effects: ["Creates VerificationContact (IN_APP, COMPLETED)", "Resolves alert with the same side effects as resolve"]
  - method: POST
    path: "/fraudops/fraud-alerts/{id}/reopen"
    description: "RESOLVED_* -> IN_REVIEW; reopen_count < 2 and within resolved_at + 30 days"
    roles: [FraudAnalyst, FraudOpsManager]
    code: 200
    input: [reason]
    output: FraudAlert
    side_effects: ["reopen_count += 1", "Fraud credit stops counting toward balance while reopened", "risk_tier recompute"]

  # ---- VerificationContacts ----
  - method: POST
    path: "/fraudops/verification-contacts"
    description: "Record an outbound contact attempt for an alert; alert must be IN_REVIEW/CONTACT_PENDING and assigned to the caller; 60-minute minimum gap per account; transitions alert to CONTACT_PENDING"
    roles: [FraudAnalyst]
    code: 201
    input: [alert_id, channel]
    output: VerificationContact
    side_effects: ["Alert IN_REVIEW -> CONTACT_PENDING"]
  - method: GET
    path: "/fraudops/verification-contacts"
    description: "List contacts with optional filters (reverse reachability for alert_id, account_id)"
    roles: [FraudAnalyst, FraudOpsManager]
    code: 200
    input: ["alert_id?", "account_id?", "contact_status?", "limit?", "offset?"]
    output: VerificationContact[]
    side_effects: []
  - method: GET
    path: "/fraudops/verification-contacts/{id}"
    description: "Get one contact"
    roles: [FraudAnalyst, FraudOpsManager]
    code: 200
    input: []
    output: VerificationContact
    side_effects: []
  - method: POST
    path: "/fraudops/verification-contacts/{id}/complete"
    description: "PENDING -> COMPLETED with outcome; only the creating analyst may complete"
    roles: [FraudAnalyst]
    code: 200
    input: [outcome]
    output: VerificationContact
    side_effects: []

  # ---- CompromisedCardEvents + ReissueDecisions ----
  - method: POST
    path: "/fraudops/compromised-card-events"
    description: "CAMS/ADC intake; event_reference unique (ERR_DUPLICATE_EVENT); half-open exposure window"
    roles: [FraudOpsManager]
    code: 201
    input: [network_source, event_reference, merchant_id, window_start, window_end]
    output: CompromisedCardEvent
    side_effects: []
  - method: GET
    path: "/fraudops/compromised-card-events"
    description: "List events"
    roles: [FraudAnalyst, FraudOpsManager]
    code: 200
    input: ["event_status?", "network_source?", "limit?", "offset?"]
    output: CompromisedCardEvent[]
    side_effects: []
  - method: GET
    path: "/fraudops/compromised-card-events/{id}"
    description: "Get one event"
    roles: [FraudAnalyst, FraudOpsManager]
    code: 200
    input: []
    output: CompromisedCardEvent
    side_effects: ["Lazy auto-close when all decisions terminal"]
  - method: POST
    path: "/fraudops/compromised-card-events/{id}/confirm"
    description: "RECEIVED -> CONFIRMED; cascades: cards -> COMPROMISED, ReissueDecisions created, account tiers recomputed, open alerts escalated (see state machine)"
    roles: [FraudOpsManager]
    code: 200
    input: []
    output: CompromisedCardEvent
    side_effects: ["Full compromise cascade (4 links)"]
  - method: GET
    path: "/fraudops/reissue-decisions"
    description: "List reissue decisions (reverse reachability for event_id, card_id, replacement_card_id)"
    roles: [FraudAnalyst, FraudOpsManager]
    code: 200
    input: ["event_id?", "card_id?", "decision?", "replacement_card_id?", "limit?", "offset?"]
    output: ReissueDecision[]
    side_effects: ["Lazy auto-approval when past due_at"]
  - method: GET
    path: "/fraudops/reissue-decisions/{id}"
    description: "Get one decision (lazy auto-approval when past due_at)"
    roles: [FraudAnalyst, FraudOpsManager]
    code: 200
    input: []
    output: ReissueDecision
    side_effects: ["Lazy auto-approval when past due_at"]
  - method: POST
    path: "/fraudops/reissue-decisions/{id}/decide"
    description: "PENDING -> APPROVED (mint replacement, old card REPLACED) or DECLINED (requires rationale; exposure_cents > 50000 requires FraudOpsManager; flag -> WATCH)"
    roles: [FraudAnalyst, FraudOpsManager]
    code: 200
    input: [decision, "rationale?"]
    output: ReissueDecision
    side_effects: ["Replacement cascade on APPROVE", "flag downgrade on DECLINE", "parent event auto-close re-check"]

  # ---- TravelNotices ----
  - method: POST
    path: "/fraudops/travel-notices"
    description: "Create a travel notice; account must be ACTIVE; half-open [start_date, end_date) overlap per (card, region) rejected; touching boundaries allowed. Cardholder may create only for own cards."
    roles: [FraudAnalyst, Cardholder]
    code: 201
    input: [card_id, region_country, start_date, end_date]
    output: TravelNotice
    side_effects: []
  - method: GET
    path: "/fraudops/travel-notices/{id}"
    description: "Get one travel notice"
    roles: [FraudAnalyst, FraudOpsManager, Cardholder]
    code: 200
    input: []
    output: TravelNotice
    side_effects: ["Lazy expiry at end_date"]
  - method: POST
    path: "/fraudops/travel-notices/{id}/cancel"
    description: "ACTIVE -> CANCELLED; Cardholder only for own cards"
    roles: [FraudAnalyst, Cardholder]
    code: 200
    input: []
    output: TravelNotice
    side_effects: []

  # ---- ChargebackCases ----
  - method: POST
    path: "/fraudops/chargeback-cases"
    description: "File a chargeback (status FILED); transaction must exist and have decision == APPROVE (ERR_TXN_NOT_DISPUTABLE); at most one non-terminal chargeback per transaction (ERR_CHARGEBACK_EXISTS); the duplicate-credit cap is NOT checked here but at posting time"
    roles: [RecoverySpecialist]
    code: 201
    input: [auth_transaction_id, reason_code, provisional_credit_cents]
    output: ChargebackCase
    side_effects: ["account_id denormalized from the transaction"]
  - method: GET
    path: "/fraudops/chargeback-cases"
    description: "List chargebacks (reverse reachability for auth_transaction_id, account_id)"
    roles: [RecoverySpecialist, FraudOpsManager]
    code: 200
    input: ["auth_transaction_id?", "account_id?", "cb_status?", "limit?", "offset?"]
    output: ChargebackCase[]
    side_effects: []
  - method: GET
    path: "/fraudops/chargeback-cases/{id}"
    description: "Get one chargeback"
    roles: [RecoverySpecialist, FraudOpsManager]
    code: 200
    input: []
    output: ChargebackCase
    side_effects: []
  - method: POST
    path: "/fraudops/chargeback-cases/{id}/post-provisional-credit"
    description: "FILED -> PROVISIONAL_CREDIT_POSTED; enforces the duplicate-credit cap against the transaction's existing credits (ERR_DUPLICATE_CREDIT, equality allowed)"
    roles: [RecoverySpecialist]
    code: 200
    input: []
    output: ChargebackCase
    side_effects: ["Account.credit_balance_cents += provisional_credit_cents"]
  - method: POST
    path: "/fraudops/chargeback-cases/{id}/representment"
    description: "PROVISIONAL_CREDIT_POSTED -> REPRESENTMENT_FILED"
    roles: [RecoverySpecialist]
    code: 200
    input: []
    output: ChargebackCase
    side_effects: []
  - method: POST
    path: "/fraudops/chargeback-cases/{id}/resolve"
    description: "outcome WON (from REPRESENTMENT_FILED only) keeps the credit; LOST (from PROVISIONAL_CREDIT_POSTED or REPRESENTMENT_FILED) reverses it"
    roles: [RecoverySpecialist]
    code: 200
    input: [outcome]
    output: ChargebackCase
    side_effects: ["LOST reverses the provisional credit"]
  - method: POST
    path: "/fraudops/chargeback-cases/{id}/withdraw"
    description: "FILED -> WITHDRAWN (before any credit was posted)"
    roles: [RecoverySpecialist]
    code: 200
    input: []
    output: ChargebackCase
    side_effects: []

  # ---- LossEntries ----
  - method: POST
    path: "/fraudops/loss-entries"
    description: "Book a fraud loss candidate over a set of CONFIRMED_FRAUD transactions of one account; computes provisional_amount_cents and tolerance_cents (loss_provision_estimate)"
    roles: [LossAccountant]
    code: 201
    input: [account_id, transaction_ids]
    output: LossEntry
    side_effects: ["Computes provisional_amount_cents, tolerance_cents"]
  - method: GET
    path: "/fraudops/loss-entries"
    description: "List losses (reverse reachability for account_id)"
    roles: [LossAccountant, RecoverySpecialist, FraudOpsManager]
    code: 200
    input: ["account_id?", "loss_status?", "limit?", "offset?"]
    output: LossEntry[]
    side_effects: []
  - method: GET
    path: "/fraudops/loss-entries/{id}"
    description: "Get one loss"
    roles: [LossAccountant, RecoverySpecialist, FraudOpsManager]
    code: 200
    input: []
    output: LossEntry
    side_effects: []
  - method: POST
    path: "/fraudops/loss-entries/{id}/book"
    description: "ESTIMATED -> BOOKED; stamps booked_by_user_id and booked_at"
    roles: [LossAccountant]
    code: 200
    input: []
    output: LossEntry
    side_effects: ["booked_by_user_id, booked_at set"]
  - method: POST
    path: "/fraudops/loss-entries/{id}/finalize"
    description: "BOOKED -> FINALIZED; within booked_at + 30 days; no open chargeback on covered transactions; |final - provisional| <= tolerance_cents inclusive"
    roles: [LossAccountant]
    code: 200
    input: [final_amount_cents]
    output: LossEntry
    side_effects: ["outstanding_cents = final_amount_cents", "rolling loss + risk_tier recompute"]
  - method: POST
    path: "/fraudops/loss-entries/{id}/write-off"
    description: "FINALIZED/PARTIALLY_RECOVERED -> WRITTEN_OFF; writes off the remaining outstanding_cents"
    roles: [LossAccountant]
    code: 200
    input: []
    output: LossEntry
    side_effects: ["written_off_cents = outstanding_cents"]

  # ---- RecoveryFilings ----
  - method: POST
    path: "/fraudops/recovery-filings"
    description: "File a network recovery against a FINALIZED or PARTIALLY_RECOVERED loss; filer must differ from the loss's booked_by_user_id (segregation); claimed_cents <= outstanding_cents"
    roles: [RecoverySpecialist]
    code: 201
    input: [loss_entry_id, network_reference, claimed_cents]
    output: RecoveryFiling
    side_effects: ["filed_by_user_id = X-User-ID"]
  - method: GET
    path: "/fraudops/recovery-filings"
    description: "List filings (reverse reachability for loss_entry_id)"
    roles: [RecoverySpecialist, LossAccountant, FraudOpsManager]
    code: 200
    input: ["loss_entry_id?", "filing_status?", "limit?", "offset?"]
    output: RecoveryFiling[]
    side_effects: []
  - method: GET
    path: "/fraudops/recovery-filings/{id}"
    description: "Get one filing"
    roles: [RecoverySpecialist, LossAccountant, FraudOpsManager]
    code: 200
    input: []
    output: RecoveryFiling
    side_effects: []
  - method: POST
    path: "/fraudops/recovery-filings/{id}/mark-outcome"
    description: "FILED -> ACCEPTED/REJECTED; ACCEPTED -> PAID (requires paid_cents <= claimed and <= loss outstanding); PAID -> REVERSED (clawback; restores loss outstanding)"
    roles: [RecoverySpecialist]
    code: 200
    input: [outcome, "paid_cents?"]
    output: RecoveryFiling
    side_effects: ["PAID/REVERSED cascade into loss outstanding and status, then account rolling loss and risk_tier"]

  # ---- FraudRings + RingMemberships ----
  - method: POST
    path: "/fraudops/fraud-rings/detect"
    description: "Detect a COMMON_MERCHANT ring: accounts with >= 2 APPROVE transactions at merchant_id with scored_at in [window_start, window_end); creates the ring (SUSPECTED) plus RingMemberships when >= 3 accounts qualify, else ERR_RING_THRESHOLD_NOT_MET"
    roles: [FraudOpsManager]
    code: 201
    input: [signal_type, merchant_id, window_start, window_end]
    output: FraudRing
    side_effects: ["Creates RingMemberships with evidence_txn_count"]
  - method: GET
    path: "/fraudops/fraud-rings"
    description: "List rings"
    roles: [FraudAnalyst, FraudOpsManager]
    code: 200
    input: ["ring_status?", "limit?", "offset?"]
    output: FraudRing[]
    side_effects: []
  - method: GET
    path: "/fraudops/fraud-rings/{id}"
    description: "Get one ring"
    roles: [FraudAnalyst, FraudOpsManager]
    code: 200
    input: []
    output: FraudRing
    side_effects: []
  - method: POST
    path: "/fraudops/fraud-rings/{id}/confirm"
    description: "SUSPECTED -> CONFIRMED; member cards CLEAN -> WATCH; member tiers recomputed; open alerts of accounts reaching HIGH are escalated"
    roles: [FraudOpsManager]
    code: 200
    input: []
    output: FraudRing
    side_effects: ["Member card flag cascade + tier recompute + alert escalation"]
  - method: POST
    path: "/fraudops/fraud-rings/{id}/dismiss"
    description: "SUSPECTED or CONFIRMED -> DISMISSED; from CONFIRMED compensates the WATCH flags it raised"
    roles: [FraudOpsManager]
    code: 200
    input: []
    output: FraudRing
    side_effects: ["Compensation on CONFIRMED path"]
  - method: GET
    path: "/fraudops/ring-memberships"
    description: "List memberships (reverse reachability for ring_id, account_id)"
    roles: [FraudAnalyst, FraudOpsManager]
    code: 200
    input: ["ring_id?", "account_id?", "limit?", "offset?"]
    output: RingMembership[]
    side_effects: []
  - method: GET
    path: "/fraudops/ring-memberships/{id}"
    description: "Get one membership"
    roles: [FraudAnalyst, FraudOpsManager]
    code: 200
    input: []
    output: RingMembership
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/unknown X-User-Role or missing X-User-ID" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not permitted on this endpoint; also used when a non-owning analyst touches an alert/contact assigned to someone else" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "Cardholder X-User-ID does not own the target resource" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or body foreign reference does not resolve" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing/invalid field, bad enum, amount out of range, missing rationale on DECLINE, fraud_credit on LEGIT resolution, manual-alert card not on the given account, duplicate account_number/pan_token/network_reference" }
  - { id: ERR_INVALID_WINDOW, http: 422, condition: "window_start >= window_end, or end_date <= start_date" }
  - { id: ERR_THRESHOLD_ORDER_INVALID, http: 422, condition: "review_threshold >= decline_threshold on ruleset create/update (equality is invalid)" }
  - { id: ERR_ACCOUNT_NOT_ACTIVE, http: 409, condition: "Travel-notice or card creation attempted on an account whose account_status != ACTIVE" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Generic state-machine precondition failure (terminal lockdown, invalid from-state, reopen window passed, write-off with zero outstanding, mark PAID from non-ACCEPTED)" }
  - { id: ERR_CHARGEBACK_INVALID_STATE, http: 409, condition: "Chargeback transition invalid from current cb_status (e.g., post credit on WITHDRAWN, WON without representment)" }
  - { id: ERR_NO_ACTIVE_RULESET, http: 409, condition: "Authorization intake when no ACTIVE ruleset covers the card's scope (no product-specific and no GLOBAL)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_ruleset_version does not match the current RuleSet.version (OCC)" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Ruleset activator == created_by_user_id, or recovery filer == loss booked_by_user_id" }
  - { id: ERR_CARD_COMPROMISED, http: 409, condition: "Unblock attempted while fraud_flag == COMPROMISED and no DECLINED ReissueDecision exists for the card" }
  - { id: ERR_DECISION_EXPOSURE_REQUIRES_MANAGER, http: 403, condition: "FraudAnalyst declining a reissue decision with exposure_cents > 50000" }
  - { id: ERR_REOPEN_LIMIT_EXCEEDED, http: 409, condition: "Alert reopen when reopen_count >= 2" }
  - { id: ERR_TRAVEL_NOTICE_OVERLAP, http: 409, condition: "New ACTIVE travel notice overlaps an existing ACTIVE notice for the same card and region under half-open interval semantics (touching boundaries allowed)" }
  - { id: ERR_CONTACT_TOO_SOON, http: 409, condition: "Verification contact created within 60 minutes (strictly less than) of the account's most recent contact" }
  - { id: ERR_FINALIZE_WINDOW_EXPIRED, http: 409, condition: "Loss finalize attempted after booked_at + 30 days" }
  - { id: ERR_DUPLICATE_EVENT, http: 409, condition: "Compromised-card intake with an already-registered event_reference" }
  - { id: ERR_CHARGEBACK_EXISTS, http: 409, condition: "A non-terminal chargeback already exists for the transaction" }
  - { id: ERR_TXN_NOT_DISPUTABLE, http: 409, condition: "Chargeback filed on a transaction whose decision != APPROVE" }
  - { id: ERR_TXN_ALREADY_IN_LOSS, http: 409, condition: "A transaction is already covered by a non-terminal LossEntry" }
  - { id: ERR_LOSS_TXN_NOT_CONFIRMED, http: 422, condition: "Loss covers a transaction that is not CONFIRMED_FRAUD or does not belong to the account" }
  - { id: ERR_CONTACT_REQUIRED, http: 409, condition: "Alert resolution without a COMPLETED contact of matching outcome newer than the last resolution" }
  - { id: ERR_CHARGEBACK_PENDING, http: 409, condition: "Loss finalize while a covered transaction has a chargeback in FILED, PROVISIONAL_CREDIT_POSTED, or REPRESENTMENT_FILED" }
  - { id: ERR_DUPLICATE_CREDIT, http: 422, condition: "Posting would push the transaction's total credits (active chargeback credits + fraud credits on RESOLVED_FRAUD alerts) above amount_cents; equality is allowed" }
  - { id: ERR_FINAL_AMOUNT_TOLERANCE, http: 422, condition: "|final - provisional| > tolerance_cents (inclusive boundary: exactly tolerance passes)" }
  - { id: ERR_RECOVERY_EXCEEDS_OUTSTANDING, http: 422, condition: "claimed_cents or paid_cents exceeds the loss's current outstanding_cents (or paid_cents > claimed_cents)" }
  - { id: ERR_RING_THRESHOLD_NOT_MET, http: 409, condition: "Ring detection found fewer than 3 qualifying accounts (exactly 3 succeeds)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: FraudAnalyst
    description: "First-line fraud operations analyst; works the alert queue, contacts customers, drafts ruleset tunings, blocks cards, decides low-exposure reissues"
    identity: opaque
    exclusive_operations:
      - "POST /fraudops/fraud-alerts (manual alert)"
      - "POST /fraudops/fraud-alerts/{id}/claim"
      - "POST /fraudops/fraud-alerts/{id}/resolve"
      - "POST /fraudops/verification-contacts"
      - "POST /fraudops/verification-contacts/{id}/complete"
    shared_operations:
      - "Reads of fraud entities (per §1.5 roles)"
      - "POST /fraudops/cards/{id}/block and /unblock (with FraudOpsManager)"
      - "POST /fraudops/rule-sets and PUT /fraudops/rule-sets/{id} (with FraudOpsManager)"
      - "POST /fraudops/reissue-decisions/{id}/decide (with FraudOpsManager; exposure-limited)"
      - "POST /fraudops/travel-notices and cancel (with Cardholder)"
      - "POST /fraudops/fraud-alerts/{id}/reopen (with FraudOpsManager)"
  - name: FraudOpsManager
    description: "Fraud operations manager; activates/retires rulesets (checker), manages accounts and cards, intakes/confirm compromised-card events, runs ring detection, controls the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /fraudops/rule-sets/{id}/activate and /retire"
      - "POST /fraudops/accounts, /suspend, /reinstate"
      - "POST /fraudops/cards"
      - "POST /fraudops/compromised-card-events and /confirm"
      - "POST /fraudops/fraud-rings/detect, /confirm, /dismiss"
    shared_operations:
      - "Reads of all fraud entities"
      - "Shared write operations listed under FraudAnalyst (block/unblock, ruleset draft/update, reissue decide, reopen)"
  - name: LossAccountant
    description: "Books fraud losses and finalizes amounts; segregation of duties: may never file network recoveries"
    identity: opaque
    exclusive_operations:
      - "POST /fraudops/loss-entries, /book, /finalize, /write-off"
    shared_operations:
      - "GET /fraudops/accounts, /accounts/{id}"
      - "GET /fraudops/loss-entries, /loss-entries/{id}, /recovery-filings, /recovery-filings/{id}"
  - name: RecoverySpecialist
    description: "Files chargebacks and network recovery filings; segregation of duties: may never book losses, and may not file recovery for a loss they booked (booked_by_user_id != X-User-ID)"
    identity: opaque
    exclusive_operations:
      - "POST /fraudops/chargeback-cases and all chargeback actions"
      - "POST /fraudops/recovery-filings and /mark-outcome"
    shared_operations:
      - "GET /fraudops/accounts, /accounts/{id}"
      - "GET /fraudops/auth-transactions (list and single)"
      - "GET /fraudops/loss-entries, /loss-entries/{id}, /recovery-filings, /recovery-filings/{id}"
  - name: Cardholder
    description: "The account holder acting through self-service channels; X-User-ID equals the Account.id they own"
    identity: "entity_backed:Account"
    exclusive_operations:
      - "POST /fraudops/fraud-alerts/{id}/respond"
    shared_operations:
      - "GET /fraudops/accounts/{id} (own account only)"
      - "GET /fraudops/fraud-alerts/{id} (own alerts only)"
      - "POST /fraudops/travel-notices, GET /fraudops/travel-notices/{id}, POST /fraudops/travel-notices/{id}/cancel, GET /fraudops/cards/{id}/travel-notices (own cards only)"
  - name: NetworkGateway
    description: "Card-network gateway service account submitting real-time authorizations"
    identity: opaque
    exclusive_operations:
      - "POST /fraudops/auth-transactions"
    shared_operations: []
