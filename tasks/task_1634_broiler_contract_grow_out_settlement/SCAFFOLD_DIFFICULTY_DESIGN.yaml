            - { call: "GET /api/settlement-groups/${grp}", payload: {}, as: SettlementAnalyst, captures: { gavg: $.data.group_avg_fcr } }
          assert:
            - "Flock.${f}.status == HARVESTED and adj_fcr == 1.6 (hop 1)"
            - "House.${h}.house_status == DOWNTIME and downtime_until == 2026-09-24 (hop 2, caused by the flock harvest)"
            - "SettlementGroup.${grp}.group_avg_fcr == 1.6 (hop 3, caused by the flock entering HARVESTED set)"

      - name: settlement_approve_loan_waterfall_cascade_depth2
        grounds:
          - state_machines.Settlement.PENDING_to_APPROVED
          - calculations.loan_outstanding_recompute
        distinguishing_aspect: |
          Depth-2 cascade from settlement approve (different trigger than
          catch-complete): approve -> loan waterfall reduces GrowerLoan
          outstanding (oldest loan first, REPAID at zero) -> Grower
          loan_outstanding_cents recomputed from the loan mutation.
        test_recipe:
          setup:
            - "Grower with two ISSUED loans (oldest 30000 created first, newest 90000) and a locked FINAL settlement netting 299625 with loan_repayment_cents 52875"
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: IntegratorAdmin }
            - { call: "POST /api/growers", payload: { grower_code: "G-W", full_name: "Waterfall Grower" }, as: IntegratorAdmin, captures: { g: $.data.id, g_v1: $.data.version } }
