          - entities.WarrantyContract.fields.claimed_cents
          - entities.WarrantyContract.fields.remaining_coverage_cents
        distinguishing_aspect: "Conserved quantity = WarrantyContract.remaining_coverage_cents (money): APPROVE commits 24000 (remaining 100000→76000), recall-driven SAFETY_HOLD reverses it (76000→100000); net remaining_coverage_cents unchanged at 100000 — a different conserved quantity than truck units."
