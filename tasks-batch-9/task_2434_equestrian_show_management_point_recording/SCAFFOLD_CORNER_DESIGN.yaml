# =============================================================================
# §1.9 Scaffold Corner Design (Breadth Coverage Index)
# task_2434_equestrian_show_management_point_recording
#
# One walk of references/claim-extraction-guide.md against §1.1-§1.7 of this
# scaffold. Sections below are the guide's nine sections, in guide order.
# Rows already carried by a §1.8 difficulty instance appear as
# `excluded_because:` stubs (no test_recipe) that name that instance.
# Rows that do not apply to this scaffold (soft_delete, bulk_operations,
# multi_tenancy, immutable entities, ...) are skipped without ceremony.
#
# Fixture constants shared by every recipe below:
#   Show      "Autumn Classic" / FED-2434 / Ridgeline Park / LOCAL
#             2026-09-10T13:00:00Z .. 2026-09-13T22:00:00Z, entry close
#             2026-09-01T00:00:00Z, pool 750000c, 40 stalls @ 7500c
#   Clock     starts at its 2026-08-01T00:00:00Z default; advanced to
#             2026-09-10T13:30:00Z only when coverage/slot starts need it
#   Rings     SAND_FIBER, footing 100, turnover_buffer 10, warmup cap 12
#   Officials level 2, JUMPER (or HUNTER) licensed, expiry 2027-12-31,
#             affiliated_trainer_name "Stonegate Barn" (never a rider's barn)
#   Riders    membership_expires_on 2027-06-30 (lapsed variant 2026-07-15)
#   Horses    coggins_drawn_on 2026-03-01 (expired variant 2025-06-01)
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  # 1. Entities (§1.1)
  # ===========================================================================
  - section: entities
    instances:

      - name: show_creation_returns_full_fiscal_baseline
        claim_type: creation
        grounds:
          - entities.Show
          - endpoints.POST_/shows
          - response_envelope.success
        distinguishing_aspect: |
          A brand-new Show must come back with all ten input fields echoed AND all
          nine computed fields seeded from them — in particular the two
          conserved-quantity partners unallocated_prize_cents == 750000 and
          available_stall_count == 40, which an implementation that leaves computed
          columns at NULL/0 until the first ledger write would report as 0.
        test_recipe:
          setup:
            - "Empty store; logical clock at its 2026-08-01T00:00:00Z startup default."
          setup_api_calls: []
          trigger:
            - call: "POST /shows"
              payload: { name: "Autumn Classic", federation_show_id: "FED-2434", venue: "Ridgeline Park", competition_level: "LOCAL", start_utc: "2026-09-10T13:00:00Z", end_utc: "2026-09-13T22:00:00Z", entry_close_utc: "2026-09-01T00:00:00Z", prize_money_pool_cents: 750000, stall_capacity: 40, stall_fee_cents: 7500 }
              as: ShowSecretary
              captures: { show_id: $.data.id }
          assert:
            - "201 with response_type object and meta.api_request_id / meta.api_request_timestamp present"
            - "data echoes name Autumn Classic, federation_show_id FED-2434, venue Ridgeline Park, competition_level LOCAL, start_utc 2026-09-10T13:00:00Z, end_utc 2026-09-13T22:00:00Z, entry_close_utc 2026-09-01T00:00:00Z, prize_money_pool_cents 750000, stall_capacity 40, stall_fee_cents 7500"
            - "Show.${show_id}.license_status == DRAFT and revision_count == 0"
            - "Show.${show_id}.allocated_prize_cents == 0 and unallocated_prize_cents == 750000"
            - "Show.${show_id}.reserved_stall_count == 0 and available_stall_count == 40"
            - "Show.${show_id}.division_share_bp_total == 0 and welfare_strike_count == 0"
            - "data.id is a server-minted identifier, data.version == 1, created_at and updated_at present"

      - name: ring_retrieval_matches_stored_row
        claim_type: retrieval
        grounds:
          - entities.Ring
          - endpoints.GET_/rings/{id}
          - endpoints.POST_/shows/{id}/rings
        distinguishing_aspect: |
          GET /rings/{id} must return the row as stored, including the two derived
          occupancy counters at their zero baseline — a ring with no slots reports
          scheduled_minutes_total 0 and slot_count 0, not null.
        test_recipe:
          setup:
            - "One DRAFT show; one ring created with every optional field supplied explicitly."
          setup_api_calls:
            - call: "POST /shows"
              payload: { name: "Autumn Classic", federation_show_id: "FED-2434", venue: "Ridgeline Park", competition_level: "LOCAL", start_utc: "2026-09-10T13:00:00Z", end_utc: "2026-09-13T22:00:00Z", entry_close_utc: "2026-09-01T00:00:00Z", prize_money_pool_cents: 750000, stall_capacity: 40, stall_fee_cents: 7500 }
              as: ShowSecretary
              captures: { show_id: $.data.id }
            - call: "POST /shows/${show_id}/rings"
              payload: { name: "Ring A", surface_type: "SAND_FIBER", footing_condition_score: 88, turnover_buffer_minutes: 15, warmup_capacity_horses: 9 }
              as: ShowSecretary
              captures: { ring_a_id: $.data.id }
          trigger:
            - call: "GET /rings/${ring_a_id}"
              payload: {}
              as: GroundsManager
          assert:
            - "200 with data.id == ${ring_a_id} and data.show_id == ${show_id}"
            - "data.name == Ring A, surface_type == SAND_FIBER, footing_condition_score == 88, turnover_buffer_minutes == 15, warmup_capacity_horses == 9"
            - "data.status == AVAILABLE, scheduled_minutes_total == 0, slot_count == 0, version == 1"

      - name: class_listing_filters_and_paginates
        claim_type: listing
        grounds:
          - endpoints.GET_/classes
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
          - entities.ShowClass.fields.qualifier_for_class_id
        distinguishing_aspect: |
          GET /classes must combine the division_id filter with limit/offset so that
          total_count reports the FILTERED population (4 jumper classes) rather than
          the whole table (5), and has_more must flip to false on the page that
          exhausts that filtered set. The self-referential qualifier_for_class_id
          filter is the only channel that walks the qualifier chain.
        test_recipe:
          setup:
            - "One DRAFT show with a JUMPER division (share 3333, band 100-130) holding four classes and a HUNTER division (share 3000, band 80-130) holding one."
            - "Class 104 declares qualifier_for_class_id = class 101, so the chain 104 -> 101 exists."
          setup_api_calls:
            - call: "POST /shows"
              payload: { name: "Autumn Classic", federation_show_id: "FED-2434", venue: "Ridgeline Park", competition_level: "LOCAL", start_utc: "2026-09-10T13:00:00Z", end_utc: "2026-09-13T22:00:00Z", entry_close_utc: "2026-09-01T00:00:00Z", prize_money_pool_cents: 750000, stall_capacity: 40, stall_fee_cents: 7500 }
              as: ShowSecretary
              captures: { show_id: $.data.id }
            - call: "POST /shows/${show_id}/divisions"
              payload: { name: "Open Jumper", discipline: "JUMPER", age_group: "OPEN", min_jump_height_cm: 100, max_jump_height_cm: 130, division_share_bp: 3333, jumpoff_enabled: true }
              as: ShowSecretary
              captures: { div_j_id: $.data.id }
            - call: "POST /shows/${show_id}/divisions"
              payload: { name: "Open Hunter", discipline: "HUNTER", age_group: "OPEN", min_jump_height_cm: 80, max_jump_height_cm: 130, division_share_bp: 3000 }
              as: ShowSecretary
              captures: { div_h_id: $.data.id }
            - call: "POST /divisions/${div_j_id}/classes"
              payload: { class_number: 101, name: "Open Jumper 1.20m", jump_height_cm: 120, entry_fee_cents: 25000, class_share_bp: 1669, max_entries: 30 }
              as: ShowSecretary
              captures: { class101_id: $.data.id }
            - call: "POST /divisions/${div_j_id}/classes"
              payload: { class_number: 102, name: "Open Jumper 1.10m", jump_height_cm: 110, entry_fee_cents: 25000, class_share_bp: 1000, max_entries: 30 }
              as: ShowSecretary
              captures: { class102_id: $.data.id }
            - call: "POST /divisions/${div_j_id}/classes"
              payload: { class_number: 103, name: "Open Jumper 1.00m", jump_height_cm: 100, entry_fee_cents: 25000, class_share_bp: 1000, max_entries: 30 }
              as: ShowSecretary
              captures: { class103_id: $.data.id }
            - call: "POST /divisions/${div_j_id}/classes"
              payload: { class_number: 104, name: "Jumper Classic 1.30m", jump_height_cm: 130, entry_fee_cents: 25000, class_share_bp: 1000, max_entries: 30, qualifier_for_class_id: "${class101_id}" }
              as: ShowSecretary
              captures: { class104_id: $.data.id }
            - call: "POST /divisions/${div_h_id}/classes"
              payload: { class_number: 201, name: "Open Hunter 1.20m", jump_height_cm: 120, entry_fee_cents: 25000, class_share_bp: 1000, max_entries: 30 }
              as: ShowSecretary
              captures: { class201_id: $.data.id }
          trigger:
            - call: "GET /classes?division_id=${div_j_id}&limit=2&offset=0"
              payload: {}
              as: ShowSecretary
            - call: "GET /classes?division_id=${div_j_id}&limit=2&offset=2"
              payload: {}
              as: ShowSecretary
            - call: "GET /classes?qualifier_for_class_id=${class101_id}"
              payload: {}
              as: ShowSecretary
            - call: "GET /classes?status=PLANNED"
              payload: {}
              as: ShowSecretary
          assert:
            - "page 1 returns response_type array with 2 items, total_count == 4, limit == 2, offset == 0, has_more == true"
            - "page 2 returns 2 items, total_count == 4, offset == 2, has_more == false"
            - "the qualifier_for_class_id filter returns exactly 1 item, ${class104_id}"
            - "the unpaginated status filter returns 5 items (four jumper + one hunter) with limit defaulting to 10, offset 0 and has_more == false"

      - name: unknown_path_ids_return_typed_not_found
        claim_type: not_found
        grounds:
          - validations.priority_3
          - errors.ERR_SHOW_NOT_FOUND
          - errors.ERR_RING_NOT_FOUND
          - errors.ERR_CLASS_NOT_FOUND
          - errors.ERR_SLOT_NOT_FOUND
          - errors.ERR_OFFICIAL_NOT_FOUND
          - errors.ERR_ASSIGNMENT_NOT_FOUND
          - errors.ERR_RIDER_NOT_FOUND
          - errors.ERR_HORSE_NOT_FOUND
          - errors.ERR_ENTRY_NOT_FOUND
          - errors.ERR_CLASS_ENTRY_NOT_FOUND
          - errors.ERR_COMPLIANCE_CASE_NOT_FOUND
        distinguishing_aspect: |
          Priority 3 demands an entity-SPECIFIC 404 for every path parameter: a
          single shared ERR_NOT_FOUND, or a 404 whose error_id is inferred from the
          first path segment rather than the entity actually addressed, fails here.
        test_recipe:
          setup:
            - "Empty store — no row of any type exists, so every id below is unresolvable."
          setup_api_calls: []
          trigger:
            - call: "GET /shows/00000000-0000-0000-0000-0000000000a1"
              payload: {}
              as: ShowSecretary
            - call: "GET /rings/00000000-0000-0000-0000-0000000000a2"
              payload: {}
              as: RingMaster
            - call: "GET /classes/00000000-0000-0000-0000-0000000000a3"
              payload: {}
              as: ShowSecretary
            - call: "GET /ring-slots/00000000-0000-0000-0000-0000000000a4"
              payload: {}
              as: RingMaster
            - call: "GET /officials/00000000-0000-0000-0000-0000000000a5"
              payload: {}
              as: FederationOfficer
            - call: "GET /official-assignments/00000000-0000-0000-0000-0000000000a6"
              payload: {}
              as: ShowSecretary
            - call: "GET /riders/00000000-0000-0000-0000-0000000000a7"
              payload: {}
              as: FederationOfficer
            - call: "GET /horses/00000000-0000-0000-0000-0000000000a8"
              payload: {}
              as: FederationOfficer
            - call: "GET /entries/00000000-0000-0000-0000-0000000000a9"
              payload: {}
              as: ShowSecretary
            - call: "GET /class-entries/00000000-0000-0000-0000-0000000000aa"
              payload: {}
              as: ShowSecretary
            - call: "GET /compliance-cases/00000000-0000-0000-0000-0000000000ab"
              payload: {}
              as: Steward
          assert:
            - "GET /shows/... -> 404 ERR_SHOW_NOT_FOUND"
            - "GET /rings/... -> 404 ERR_RING_NOT_FOUND"
            - "GET /classes/... -> 404 ERR_CLASS_NOT_FOUND"
            - "GET /ring-slots/... -> 404 ERR_SLOT_NOT_FOUND"
            - "GET /officials/... -> 404 ERR_OFFICIAL_NOT_FOUND"
            - "GET /official-assignments/... -> 404 ERR_ASSIGNMENT_NOT_FOUND"
            - "GET /riders/... -> 404 ERR_RIDER_NOT_FOUND"
            - "GET /horses/... -> 404 ERR_HORSE_NOT_FOUND"
            - "GET /entries/... -> 404 ERR_ENTRY_NOT_FOUND"
            - "GET /class-entries/... -> 404 ERR_CLASS_ENTRY_NOT_FOUND"
            - "GET /compliance-cases/... -> 404 ERR_COMPLIANCE_CASE_NOT_FOUND"
            - "every response body is the error envelope { response_type: error, data: { error_id, message } }"

      - name: entry_missing_required_fields_rejected
        claim_type: required_fields
        grounds:
          - validations.priority_6
          - errors.ERR_INVALID_REQUEST
          - endpoints.POST_/shows/{id}/entries
          - endpoints.POST_/shows
          - endpoints.POST_/divisions/{id}/classes
        distinguishing_aspect: |
          Every `source: input` field without a `default` is mandatory. The probes
          below omit exactly one such field at a time, and the expected answer is
          always 422 ERR_INVALID_REQUEST — never a 201 with a NULL column and never
          the 404 that a naive implementation returns when it resolves the missing
          FK before validating its presence.
        test_recipe:
          setup:
            - "One DRAFT show with one JUMPER division, one rider and one horse (all references that ARE supplied resolve)."
          setup_api_calls:
            - call: "POST /shows"
              payload: { name: "Autumn Classic", federation_show_id: "FED-2434", venue: "Ridgeline Park", competition_level: "LOCAL", start_utc: "2026-09-10T13:00:00Z", end_utc: "2026-09-13T22:00:00Z", entry_close_utc: "2026-09-01T00:00:00Z", prize_money_pool_cents: 750000, stall_capacity: 40, stall_fee_cents: 7500 }
              as: ShowSecretary
              captures: { show_id: $.data.id }
            - call: "POST /shows/${show_id}/divisions"
              payload: { name: "Open Jumper", discipline: "JUMPER", age_group: "OPEN", min_jump_height_cm: 100, max_jump_height_cm: 130, division_share_bp: 3333, jumpoff_enabled: true }
              as: ShowSecretary
              captures: { div_j_id: $.data.id }
            - call: "POST /riders"
              payload: { federation_member_number: "M-1001", full_name: "Ada Rider", membership_expires_on: "2027-06-30T00:00:00Z", trainer_name: "Bluegrass Barn" }
              as: FederationOfficer
              captures: { rider1_id: $.data.id }
            - call: "POST /horses"
              payload: { federation_registration_number: "H-2001", name: "Comet", owner_name: "Ada Rider", coggins_drawn_on: "2026-03-01T00:00:00Z" }
              as: FederationOfficer
              captures: { horse1_id: $.data.id }
          trigger:
            - call: "POST /shows/${show_id}/entries"
              payload: { rider_id: "${rider1_id}" }
              as: Exhibitor
              as_user_id: "${rider1_id}"
            - call: "POST /shows/${show_id}/entries"
              payload: { horse_id: "${horse1_id}" }
              as: Exhibitor
              as_user_id: "${rider1_id}"
            - call: "POST /shows"
              payload: { name: "Winter Classic", federation_show_id: "FED-2435", venue: "Ridgeline Park", competition_level: "LOCAL", start_utc: "2026-12-10T13:00:00Z", end_utc: "2026-12-13T22:00:00Z", entry_close_utc: "2026-12-01T00:00:00Z", prize_money_pool_cents: 750000, stall_capacity: 40 }
              as: ShowSecretary
            - call: "POST /divisions/${div_j_id}/classes"
              payload: { class_number: 101, name: "Open Jumper 1.20m", jump_height_cm: 120, entry_fee_cents: 25000, max_entries: 30 }
              as: ShowSecretary
            - call: "POST /shows/${show_id}/divisions"
              payload: { name: "Open Equitation", discipline: "EQUITATION", age_group: "JUNIOR", min_jump_height_cm: 80, max_jump_height_cm: 100 }
              as: ShowSecretary
          assert:
            - "entry without horse_id -> 422 ERR_INVALID_REQUEST"
            - "entry without rider_id -> 422 ERR_INVALID_REQUEST"
            - "show without stall_fee_cents -> 422 ERR_INVALID_REQUEST"
            - "class without class_share_bp -> 422 ERR_INVALID_REQUEST"
            - "division without division_share_bp -> 422 ERR_INVALID_REQUEST"
            - "nothing was persisted: GET /entries?show_id=${show_id} returns total_count == 0 and GET /shows/${show_id}/divisions returns total_count == 1"

      - name: omitted_optional_inputs_take_declared_defaults
        claim_type: defaults
        grounds:
          - entities.Ring.fields.footing_condition_score
          - entities.Ring.fields.turnover_buffer_minutes
          - entities.Ring.fields.warmup_capacity_horses
          - entities.CompetitionDivision.fields.jumpoff_enabled
          - entities.Entry.fields.requested_stall_count
          - entities.ShowClass.fields.qualifier_for_class_id
        distinguishing_aspect: |
          Five optional inputs carry declared defaults (100 / 10 / 12 / false / 0)
          and one optional FK defaults to null. Omitting them must yield those
          declared values, not zeros or nulls — a ring defaulted to
          turnover_buffer_minutes 0 would silently change every later duration
          estimate and overlap decision.
        test_recipe:
          setup:
            - "One APPROVED show with a JUMPER division created WITHOUT jumpoff_enabled and a class created WITHOUT qualifier_for_class_id, plus one rider and horse."
          setup_api_calls:
            - call: "POST /shows"
              payload: { name: "Autumn Classic", federation_show_id: "FED-2434", venue: "Ridgeline Park", competition_level: "LOCAL", start_utc: "2026-09-10T13:00:00Z", end_utc: "2026-09-13T22:00:00Z", entry_close_utc: "2026-09-01T00:00:00Z", prize_money_pool_cents: 750000, stall_capacity: 40, stall_fee_cents: 7500 }
              as: ShowSecretary
              captures: { show_id: $.data.id }
            - call: "POST /shows/${show_id}/divisions"
              payload: { name: "Open Jumper", discipline: "JUMPER", age_group: "OPEN", min_jump_height_cm: 100, max_jump_height_cm: 130, division_share_bp: 3333 }
              as: ShowSecretary
              captures: { div_j_id: $.data.id }
            - call: "POST /divisions/${div_j_id}/classes"
              payload: { class_number: 101, name: "Open Jumper 1.20m", jump_height_cm: 120, entry_fee_cents: 25000, class_share_bp: 1669, max_entries: 30 }
              as: ShowSecretary
              captures: { class101_id: $.data.id }
            - call: "POST /shows/${show_id}/license-submission"
              payload: {}
              as: ShowSecretary
            - call: "POST /shows/${show_id}/license-decision"
              payload: { decision: "APPROVE" }
              as: FederationOfficer
            - call: "POST /riders"
              payload: { federation_member_number: "M-1001", full_name: "Ada Rider", membership_expires_on: "2027-06-30T00:00:00Z", trainer_name: "Bluegrass Barn" }
              as: FederationOfficer
              captures: { rider1_id: $.data.id }
            - call: "POST /horses"
              payload: { federation_registration_number: "H-2001", name: "Comet", owner_name: "Ada Rider", coggins_drawn_on: "2026-03-01T00:00:00Z" }
              as: FederationOfficer
              captures: { horse1_id: $.data.id }
          trigger:
            - call: "POST /shows/${show_id}/rings"
              payload: { name: "Ring Z", surface_type: "GRASS" }
              as: ShowSecretary
              captures: { ring_z_id: $.data.id }
            - call: "POST /shows/${show_id}/entries"
              payload: { rider_id: "${rider1_id}", horse_id: "${horse1_id}" }
              as: Exhibitor
              as_user_id: "${rider1_id}"
              captures: { entry1_id: $.data.id }
          assert:
            - "Ring.${ring_z_id}.footing_condition_score == 100, turnover_buffer_minutes == 10, warmup_capacity_horses == 12, status == AVAILABLE"
            - "Entry.${entry1_id}.requested_stall_count == 0 and assigned_stall_count == 0"
            - "Entry.${entry1_id}.verification_status == RECEIVED and settlement_status == UNBILLED"
            - "CompetitionDivision.${div_j_id}.jumpoff_enabled == false (omitted at creation)"
            - "ShowClass.${class101_id}.qualifier_for_class_id is null"
            - "Show.${show_id}.reserved_stall_count == 0 and available_stall_count == 40 — a 0-stall entry moves no ledger"

      - name: coggins_expiry_derived_from_draw_date
        claim_type: computed_fields
        grounds:
          - entities.Horse.fields.coggins_expires_on
          - entities.Horse.fields.eligibility_status
          - entities.Rider.fields.membership_status
        distinguishing_aspect: |
          coggins_expires_on is coggins_drawn_on + 365 days, computed at write time
          and never accepted from the caller; eligibility_status and
          membership_status are likewise derived (the latter re-derived on every
          read against the logical clock). 2026-03-01 + 365 lands on 2027-03-01
          because 2026 is not a leap year — a naive "+1 calendar year" and a
          "+366 days" implementation both diverge on the 2025-06-01 probe.
        test_recipe:
          setup:
            - "Logical clock at its 2026-08-01T00:00:00Z default."
          setup_api_calls: []
          trigger:
            - call: "POST /horses"
              payload: { federation_registration_number: "H-2001", name: "Comet", owner_name: "Ada Rider", coggins_drawn_on: "2026-03-01T00:00:00Z" }
              as: FederationOfficer
              captures: { horse1_id: $.data.id }
            - call: "POST /horses"
              payload: { federation_registration_number: "H-2009", name: "Stale", owner_name: "Ada Rider", coggins_drawn_on: "2025-06-01T00:00:00Z" }
              as: FederationOfficer
              captures: { horse_stale_id: $.data.id }
            - call: "POST /riders"
              payload: { federation_member_number: "M-1009", full_name: "Lapsed Rider", membership_expires_on: "2026-07-15T00:00:00Z", trainer_name: "Ivy Farm" }
              as: FederationOfficer
              captures: { rider_lapsed_id: $.data.id }
            - call: "POST /riders"
              payload: { federation_member_number: "M-1001", full_name: "Ada Rider", membership_expires_on: "2027-06-30T00:00:00Z", trainer_name: "Bluegrass Barn" }
              as: FederationOfficer
              captures: { rider1_id: $.data.id }
          assert:
            - "Horse.${horse1_id}.coggins_expires_on == 2027-03-01T00:00:00Z (365 days after 2026-03-01, not 2027-02-28 and not 2027-03-02)"
            - "Horse.${horse_stale_id}.coggins_expires_on == 2026-06-01T00:00:00Z"
            - "both horses report eligibility_status == ELIGIBLE — the field is computed, defaults to ELIGIBLE and is never taken from the request body"
            - "Rider.${rider_lapsed_id}.membership_status == LAPSED (clock 2026-08-01 is after 2026-07-15)"
            - "Rider.${rider1_id}.membership_status == ACTIVE (clock strictly before 2027-06-30)"

      - name: point_submission_stamps_submitting_user
        claim_type: system_fields
        grounds:
          - entities.PointSubmission.fields.submitted_by_user_id
          - endpoints.POST_/classes/{id}/point-submissions
          - entities.PointSubmission.fields.national_body_reference
          - entities.PointSubmission.fields.regional_body_reference
        distinguishing_aspect: |
          submitted_by_user_id is the scaffold's only `source: system` field: it is
          taken from the X-User-ID header of the submitting ShowSecretary, never
          from the body (the endpoint declares only expected_class_version as
          input). Both body-reference fields must still be null at PREPARED, and
          the two point totals must be 0 before any acknowledgement.
        test_recipe:
          setup:
            - "Standard APPROVED show, Ring A, JUMPER division, class 101 (jump_height_cm 120, class_share_bp 1669) OPEN."
            - "Three riders each with one horse, one Entry and one ClassEntry on class 101; every Entry ACCEPTED and PAID (total_due 30000 each) so confirmed_entry_count == 3."
            - "Judge and steward assigned to the 14:00 slot (duration 26), ACTIVE vet coverage, clock 2026-09-10T13:30:00Z, slot started, placings 1..3 recorded and results posted."
            - "The submitting secretary acts with X-User-ID sec-office-1."
          setup_api_calls:
