            - "ign2 created and st1 == SUPERSEDED, st2 == DRAFT (the fresh write supersedes ign1)"

      - name: version_pin_blocks_brief_after_plan_mutation
        claim_type: version_pinning
        grounds:
          - entities.BurnExecution.fields.plan_version_at_schedule
          - errors[ERR_STALE_PLAN_VERSION]
          - state_machines.BurnExecution.SCHEDULED_to_BRIEFED
        distinguishing_aspect: "The execution pins BurnPlan.version 4 at scheduling; replacing the ignition plan bumps the plan to 5, so brief fails with ERR_STALE_PLAN_VERSION until the execution is cancelled and rescheduled (re-pinning at 5)."
        test_recipe:
          setup: ["Fully burn-ready execution SCHEDULED with pin 4; ignition plan then replaced (plan now 5) and re-accepted"]
          setup_api_calls:
            - { call: "POST /associations", payload: {name: "Assoc", airshed_daily_acres_cap: 500, single_claim_cap_cents: 500000, landowner_liability_cap_cents: 1000000, initial_fund_cents: 10000000}, as: AssociationAdmin }
