      - name: relief_conservation_across_supersede
        grounds:
          - state_machines.ProtectionClaim.APPROVED_to_SUPERSEDED
          - calculations.scra_rate_relief
        distinguishing_aspect: |
          Conserved quantity: per-obligation recognized relief. Approving a
          replacement claim for the same obligation_label (forward action)
          supersedes the prior APPROVED claim; the invariant
          sum(total_relief_cents over the member's APPROVED claims for
          obligation L) MUST equal the newest claim's total alone — exactly
          one claim contributes per obligation — and denying the replacement
          (compensating non-action) leaves the original claim APPROVED with
          its original total (no double-count, no loss).
        test_recipe:
          setup:
            - "Member M ACTIVE with deployment D (scra_eligible, 2026-09-01 -> 2027-09-01, 12 periods). Claim C1 (obligation OBL_Z, base 1100, monthly 110000) APPROVED with total 50000 * 12 = 600000. Replacement claim C2 (same obligation, base 900, monthly 90000) filed."
          setup_api_calls:
            - call: "POST /membership/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /membership/eligibility-cases"
              payload: { applicant_legal_name: "Val Vale", applicant_dob: "1991-09-09", basis_type: "DIRECT_SERVICE" }
              as: EligibilityApplicant
              captures: { case_v: $.data.id }
            - call: "POST /membership/eligibility-cases/${case_v}/service-records"
              payload: { branch: "NAVY", component: "ACTIVE_DUTY", rank_grade: "O-3", service_start_date: "2014-01-01", discharge_characterization: "STILL_SERVING" }
              as: EligibilityApplicant
              captures: { sr_v: $.data.id }
            - call: "POST /membership/eligibility-cases/${case_v}/evidence"
              payload: { doc_type: "LEAVE_EARNINGS_STATEMENT", issuing_authority: "DFAS", issued_on: "2026-08-01", covers_service_record_id: "${sr_v}", content_hash: "d29" }
              as: EligibilityApplicant
            - call: "POST /membership/eligibility-cases/${case_v}/submit"
              payload: {}
              as: EligibilityApplicant
            - call: "POST /membership/eligibility-cases/${case_v}/record-reconstruction"
              payload: { decision: "APPROVE", decision_note: "verified" }
              as: VerificationOfficer
              as_user_id: "officer-A"
            - call: "POST /membership/eligibility-cases/${case_v}/decide"
              payload: { decision: "APPROVE" }
              as: VerificationOfficer
              as_user_id: "officer-B"
              captures: { mv: $.data.member_id }
            - call: "GET /membership/members/${mv}"
              payload: {}
              as: VerificationOfficer
              as_user_id: "officer-B"
              captures: { mv_v: $.data.version }
            - call: "POST /membership/product-offerings"
              payload: { product_code: "CARD_PREM", product_line: "BANKING", product_name: "Premium Card", allowed_categories: ["ENLISTED_ACTIVE", "VETERAN_HONORABLE", "OFFICER_CADET"] }
              as: ProductAdministrator
              captures: { off_card: $.data.id }
            - call: "POST /membership/members/${mv}/entitlements"
              payload: { product_offering_id: "${off_card}", exposure_cents: 1000000 }
              as: Member
              as_user_id: "${mv}"
            - call: "POST /membership/members/${mv}/deployment-orders"
              payload: { orders_number: "ORD-700", theater: "INDOPACOM", start_date: "2026-09-01", end_date: "2027-09-01", scra_eligible: true, expected_member_version: "${mv_v}" }
              as: VerificationOfficer
              captures: { dep_v: $.data.id }
            - call: "POST /membership/members/${mv}/protection-claims"
              payload: { claim_type: "RATE_REDUCTION", obligation_label: "OBL_Z", deployment_order_id: "${dep_v}", base_rate_bps: 1100, monthly_interest_cents: 110000 }
              as: Member
              as_user_id: "${mv}"
              captures: { pc_v1: $.data.id }
            - call: "POST /membership/protection-claims/${pc_v1}/decide"
              payload: { decision: "APPROVE" }
              as: VerificationOfficer
              as_user_id: "officer-A"
            - call: "POST /membership/members/${mv}/protection-claims"
              payload: { claim_type: "RATE_REDUCTION", obligation_label: "OBL_Z", deployment_order_id: "${dep_v}", base_rate_bps: 900, monthly_interest_cents: 90000 }
              as: Member
              as_user_id: "${mv}"
              captures: { pc_v2: $.data.id }
          trigger:
            - call: "POST /membership/protection-claims/${pc_v2}/decide"
              payload: { decision: "APPROVE" }
              as: VerificationOfficer
              as_user_id: "officer-A"
          assert:
            - "ProtectionClaim.${pc_v1}.status == SUPERSEDED (forward action's cascade)"
            - "ProtectionClaim.${pc_v2}.status == APPROVED with total_relief_cents == 360000 (900 bps: per-period floor(90000 * 300/900) = 30000 x 12)"
            - "Invariant: sum of total_relief_cents over APPROVED claims for OBL_Z == 360000 exactly — the superseded claim's 600000 contributes nothing (no double count)"
            - "Had C2 been DENIED instead (compensating non-action), C1 would remain APPROVED at 600000 — conservation holds on both branches"
