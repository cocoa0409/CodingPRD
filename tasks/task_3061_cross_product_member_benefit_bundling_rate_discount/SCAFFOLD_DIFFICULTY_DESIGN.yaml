# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3061_cross_product_member_benefit_bundling_rate_discount
#
# 9 rule_id blocks x 2 instances = 18 instances.
# Every grounds ref resolves into SCAFFOLD.yaml §1.1-§1.6.
# Every numeric assert is a literal computed against the cited formula/constants.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: loan_apr_provisional_vs_final_after_rule_activation
        grounds:
          - calculations.loan_effective_apr_bps
          - calculations.discount_stack_total_bps
          - entities.LoanAccount.fields.effective_apr_bps
          - state_machines.LoanAccount.PROVISIONAL_to_FINAL
        distinguishing_aspect: |
          The two variants live on the LoanAccount's own pricing_status dimension and
          diverge on the same row: a 50 bps rule activated after the loan was frozen
          moves the PROVISIONAL reading and leaves the FINAL reading untouched, so the
          same loan row carries two equally valid APRs depending on which variant is read.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Member m1 registered and holds one ADOPTED BANKING holding and one ADOPTED LENDING holding."
            - "A short-rate rate-discount rule set is ACTIVE: DEP_BOOST_25 (MEMBER_TIER, BASE, 250 bps) and AUTOPAY_STD (AUTOPAY, ADDITIVE, 75 bps)."
            - "LoanAccount la1 exists with base_apr_bps 1200 and autopay ENROLLED, so discount_stack_bps is 325 and effective_apr_bps is 875."
            - "LoanAccount la1 has been finalized, so pricing_status is FINAL and discount_stack_bps is frozen at 325."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /benefits/members"
              payload: { member_number: "M-3061-001", full_name: "Ada Reyes", email: "ada@x.com" }
              as: Anonymous
              captures: { m1_id: $.data.id }
            - call: "POST /benefits/holdings"
              payload: { member_id: "${m1_id}", product_line: "BANKING", balance_cents: 150000 }
              as: PlatformAdmin
              captures: { h_bank1_id: $.data.id }
            - call: "POST /benefits/holdings"
              payload: { member_id: "${m1_id}", product_line: "LENDING", balance_cents: 0 }
              as: PlatformAdmin
              captures: { h_lend_id: $.data.id }
            - call: "POST /benefits/holdings/${h_bank1_id}/adopt"
              payload: {}
              as: Member
              as_user_id: "${m1_id}"
            - call: "POST /benefits/holdings/${h_lend_id}/adopt"
              payload: {}
              as: Member
              as_user_id: "${m1_id}"
            - call: "POST /benefits/rate-discount-rules"
              payload: { rule_code: "DEP_BOOST_25", discount_kind: "MEMBER_TIER", stacking_class: "BASE", discount_bps: 250, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: BenefitsAdmin
              captures: { r_base_id: $.data.id }
            - call: "POST /benefits/rate-discount-rules/${r_base_id}/activate"
              payload: {}
              as: BenefitsAdmin
            - call: "POST /benefits/rate-discount-rules"
              payload: { rule_code: "AUTOPAY_STD", discount_kind: "AUTOPAY", stacking_class: "ADDITIVE", discount_bps: 75, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: BenefitsAdmin
              captures: { r_auto_id: $.data.id }
            - call: "POST /benefits/rate-discount-rules/${r_auto_id}/activate"
              payload: {}
              as: BenefitsAdmin
            - call: "POST /benefits/loan-accounts"
              payload: { member_id: "${m1_id}", holding_id: "${h_lend_id}", loan_type: "PERSONAL", principal_cents: 1200000, base_apr_bps: 1200 }
              as: Underwriter
              captures: { la1_id: $.data.id }
            - call: "POST /benefits/loan-accounts/${la1_id}/autopay-enrollment"
              payload: {}
              as: Member
              as_user_id: "${m1_id}"
            - call: "GET /benefits/loan-accounts/${la1_id}"
              payload: {}
              as: Underwriter
              captures: { la1_v: $.data.version }
            - call: "POST /benefits/loan-accounts/${la1_id}/applications"
              payload: { rule_id: "${r_auto_id}", expected_loan_account_version: "${la1_v}" }
              as: BenefitsAdmin
            - call: "POST /benefits/loan-accounts/${la1_id}/finalize-pricing"
              payload: {}
              as: Underwriter
            - call: "POST /benefits/rate-discount-rules"
              payload: { rule_code: "PROMO_50", discount_kind: "PROMOTIONAL", stacking_class: "CAP_CONTRIBUTING", discount_bps: 50, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: BenefitsAdmin
              captures: { r_p50_id: $.data.id }
          trigger:
            - call: "POST /benefits/rate-discount-rules/${r_p50_id}/activate"
              payload: {}
              as: BenefitsAdmin
          assert:
            - "after activation LoanAccount.${la1_id}.pricing_status == FINAL"
            - "after activation LoanAccount.${la1_id}.discount_stack_bps == 325 (final_apr freezes the stack at the snapshot in force when the loan was finalized)"
            - "after activation LoanAccount.${la1_id}.effective_apr_bps == 875 (final_apr ignores the newly activated 50 bps rule), unmoved from 875"
            - "GET /benefits/loan-accounts/${la1_id}/pricing-breakdown reports stored_bps == 325 under the same FINAL loan"
            - "the same loan priced under provisional_apr would read discount_stack_bps == 375 and effective_apr_bps == 825, so the two variants differ by exactly 50 bps"

      - name: member_tier_point_in_time_vs_forward_looking_on_pending_holdings
        grounds:
          - calculations.member_tier
          - entities.Member.fields.member_tier
          - entities.ProductHolding.fields.adoption_status
          - endpoints.GET_/benefits/members/{member_id}/tier-projection
        distinguishing_aspect: |
          The two variants differ over which adoption_status values are counted rather
          than over rounding or freezing: the same two PENDING holdings make a
          one-product member BASE under point_in_time and PREMIER under forward_looking,
          and the divergence is visible on a different entity domain than the loan APR.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Member m2 is registered with three holdings: one ADOPTED BANKING, one PENDING INVESTING, one PENDING CAREER."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /benefits/members"
              payload: { member_number: "M-3061-002", full_name: "Bo Tran", email: "bo@x.com" }
              as: Anonymous
              captures: { m2_id: $.data.id }
            - call: "POST /benefits/holdings"
              payload: { member_id: "${m2_id}", product_line: "BANKING", balance_cents: 300000 }
              as: PlatformAdmin
              captures: { h_bank_id: $.data.id }
            - call: "POST /benefits/holdings"
              payload: { member_id: "${m2_id}", product_line: "INVESTING", balance_cents: 0 }
              as: PlatformAdmin
            - call: "POST /benefits/holdings"
              payload: { member_id: "${m2_id}", product_line: "CAREER", balance_cents: 0 }
              as: PlatformAdmin
            - call: "POST /benefits/holdings/${h_bank_id}/adopt"
              payload: {}
              as: Member
              as_user_id: "${m2_id}"
          trigger:
            - call: "GET /benefits/members/${m2_id}/tier-projection"
              payload: {}
              as: Member
              as_user_id: "${m2_id}"
          assert:
            - "Member.${m2_id}.member_tier == BASE (point_in_time counts only the single ADOPTED holding)"
            - "the response reports current_tier == BASE"
            - "the response reports projected_tier == PREMIER (forward_looking also counts the 2 PENDING holdings, reaching 3 products across 3 distinct lines)"
            - "the response reports pending_adoption_count == 2"
            - "Member.${m2_id}.product_adoption_count == 1 and product_line_set == [\"BANKING\"]"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: member_tier_then_base_apr_evaluation_order_pins_the_final_apr
        grounds:
          - calculations.member_tier
          - calculations.discount_stack_total_bps
          - calculations.loan_effective_apr_bps
          - entities.RateDiscountRule.fields.min_member_tier
        distinguishing_aspect: |
          Mode (c) — a circular-looking dependency whose value is only well defined once
          the evaluation order is pinned: the discount lookup keys on min_member_tier, and
          the member tier is itself recomputed from the very holding set the loan belongs
          to, so the scaffold pins (1) recompute tier, (2) select candidates, (3) sum,
          (4) cap, (5) apply APR floor.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Member m3 holds two ADOPTED products across two lines (LENDING and INVESTING), so member_tier is PLUS."
            - "Rules TIER_PLUS (MEMBER_TIER, BASE, 250 bps, min_member_tier PLUS) and AUTOPAY_STD (AUTOPAY, ADDITIVE, 75 bps) are ACTIVE and in window."
            - "LoanAccount la3 prices at base_apr_bps 1200 with a single APPLIED AUTOPAY application; the tier rule is priced from the rule pool, not from an application row."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /benefits/members"
              payload: { member_number: "M-3061-003", full_name: "Cy Jordan", email: "cy@x.com" }
              as: Anonymous
              captures: { m3_id: $.data.id }
            - call: "POST /benefits/holdings"
              payload: { member_id: "${m3_id}", product_line: "LENDING", balance_cents: 0 }
              as: PlatformAdmin
              captures: { h_lend3_id: $.data.id }
            - call: "POST /benefits/holdings"
              payload: { member_id: "${m3_id}", product_line: "INVESTING", balance_cents: 0 }
              as: PlatformAdmin
              captures: { h_inv3_id: $.data.id }
            - call: "POST /benefits/holdings/${h_lend3_id}/adopt"
              payload: {}
              as: Member
              as_user_id: "${m3_id}"
            - call: "POST /benefits/holdings/${h_inv3_id}/adopt"
              payload: {}
              as: Member
              as_user_id: "${m3_id}"
            - call: "POST /benefits/rate-discount-rules"
              payload: { rule_code: "TIER_PLUS", discount_kind: "MEMBER_TIER", stacking_class: "BASE", discount_bps: 250, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z", min_member_tier: "PLUS" }
              as: BenefitsAdmin
              captures: { r_tier_id: $.data.id }
            - call: "POST /benefits/rate-discount-rules/${r_tier_id}/activate"
              payload: {}
              as: BenefitsAdmin
            - call: "POST /benefits/rate-discount-rules"
              payload: { rule_code: "AUTOPAY_STD", discount_kind: "AUTOPAY", stacking_class: "ADDITIVE", discount_bps: 75, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: BenefitsAdmin
              captures: { r_auto3_id: $.data.id }
            - call: "POST /benefits/rate-discount-rules/${r_auto3_id}/activate"
              payload: {}
              as: BenefitsAdmin
            - call: "POST /benefits/loan-accounts"
              payload: { member_id: "${m3_id}", holding_id: "${h_lend3_id}", loan_type: "REFINANCE", principal_cents: 2000000, base_apr_bps: 1200 }
              as: Underwriter
              captures: { la3_id: $.data.id }
            - call: "POST /benefits/loan-accounts/${la3_id}/autopay-enrollment"
              payload: {}
              as: Member
              as_user_id: "${m3_id}"
          trigger:
            - call: "GET /benefits/loan-accounts/${la3_id}"
              payload: {}
              as: Underwriter
          assert:
            - "Member.${m3_id}.member_tier == PLUS with product_adoption_count == 2 and product_line_set == [\"LENDING\", \"INVESTING\"]"
            - "the tier is recomputed BEFORE the discount lookup, so RateDiscountRule TIER_PLUS enters the candidate set"
            - "LoanAccount.${la3_id}.discount_stack_bps == 325 (250 BASE + 75 ADDITIVE; the 250 is admitted only because the tier step ran first)"
            - "LoanAccount.${la3_id}.effective_apr_bps == 875 (1200 - 325)"
            - "had the order been reversed and the tier read before the holdings were adopted, discount_stack_bps would be 75 and effective_apr_bps 1125 — an order error of exactly 250 bps"

      - name: principal_redemption_nested_floor_per_entry_then_sum
        grounds:
          - calculations.rewards_principal_reduction_cents
          - entities.RewardsLedgerEntry.fields.principal_reduction_cents
          - entities.LoanAccount.fields.principal_cents
          - endpoints.POST_/benefits/members/{member_id}/rewards/reconcile
        distinguishing_aspect: |
          Mode (b) — nested rounding where the order is pinned: each redemption floors its
          own points at POINTS_PER_CENT before anything is summed, so two 1150-point
          redemptions yield 22 cents and never the 23 cents that sum-then-floor produces.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Member m4 holds an ADOPTED LENDING holding with LoanAccount la4 at principal_cents 500000 and rewards_points_balance 3000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /benefits/members"
              payload: { member_number: "M-3061-004", full_name: "Di Okonkwo", email: "di@x.com" }
              as: Anonymous
              captures: { m4_id: $.data.id }
            - call: "POST /benefits/holdings"
              payload: { member_id: "${m4_id}", product_line: "LENDING", balance_cents: 0 }
              as: PlatformAdmin
              captures: { h_lend4_id: $.data.id }
            - call: "POST /benefits/holdings/${h_lend4_id}/adopt"
              payload: {}
              as: Member
              as_user_id: "${m4_id}"
            - call: "POST /benefits/loan-accounts"
              payload: { member_id: "${m4_id}", holding_id: "${h_lend4_id}", loan_type: "STUDENT", principal_cents: 500000, base_apr_bps: 1100 }
              as: Underwriter
              captures: { la4_id: $.data.id }
            - call: "POST /benefits/members/${m4_id}/rewards/adjust"
              payload: { points_delta: 3000, source_event_code: "OPENING_BONUS" }
              as: BenefitsAdmin
          trigger:
            - call: "POST /benefits/members/${m4_id}/rewards/redeem-principal"
              payload: { loan_account_id: "${la4_id}", points: 1150, source_event_code: "REDEEM_A" }
              as: Member
              as_user_id: "${m4_id}"
              captures: { e_a_id: $.data.id }
            - call: "POST /benefits/members/${m4_id}/rewards/redeem-principal"
              payload: { loan_account_id: "${la4_id}", points: 1150, source_event_code: "REDEEM_B" }
              as: Member
              as_user_id: "${m4_id}"
              captures: { e_b_id: $.data.id }
          assert:
            - "RewardsLedgerEntry.${e_a_id}.principal_reduction_cents == 11 (1150 // 100)"
            - "RewardsLedgerEntry.${e_b_id}.principal_reduction_cents == 11 (1150 // 100, floored per entry)"
            - "LoanAccount.${la4_id}.principal_cents == 499978 (500000 - 11 - 11); the sum-then-floor reading would leave 499977"
            - "Member.${m4_id}.rewards_points_balance == 700 (3000 - 1150 - 1150); the 50 remainder points per entry are destroyed, not carried"
            - "POST /benefits/members/${m4_id}/rewards/reconcile returns cumulative_reduction_cents == 23 and lifts the newest entry by exactly 1 cent, taking LoanAccount.${la4_id}.principal_cents to 499977 and demonstrating that the two orders are not interchangeable"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: member_status_cycle_prospect_lapsed_back_to_prospect
        grounds:
          - state_machines.Member.PROSPECT_to_MEMBER_ACTIVE
          - state_machines.Member.MEMBER_LAPSED_to_PROSPECT
          - state_machines.Member.MEMBER_ACTIVE_to_MEMBER_AT_RISK
          - state_machines.Member.MEMBER_AT_RISK_to_MEMBER_ACTIVE
        distinguishing_aspect: |
          A cycle rather than a pipeline: PROSPECT -> MEMBER_ACTIVE -> MEMBER_AT_RISK ->
          MEMBER_LAPSED -> PROSPECT returns the entity to a state it already occupied, and
          the member machine is on a different entity than the non-linear machine in the
          companion instance.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Member m5 is registered and holds one product."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /benefits/members"
              payload: { member_number: "M-3061-005", full_name: "Eli Marsh", email: "eli@x.com" }
              as: Anonymous
              captures: { m5_id: $.data.id }
            - call: "POST /benefits/holdings"
              payload: { member_id: "${m5_id}", product_line: "INVESTING", balance_cents: 0 }
              as: PlatformAdmin
              captures: { h5_id: $.data.id }
          trigger:
            - call: "POST /benefits/holdings/${h5_id}/adopt"
              payload: {}
              as: Member
              as_user_id: "${m5_id}"
          assert:
            - "Member.${m5_id}.member_status == MEMBER_ACTIVE (first adoption moves PROSPECT out), with member_since_at stamped at 2026-09-01T00:00:00Z"
            - "a second event loop then drives MEMBER_ACTIVE -> MEMBER_AT_RISK -> MEMBER_LAPSED -> PROSPECT through POST /benefits/members/${m5_id}/reset-to-prospect, closing the cycle"
            - "Member.${m5_id}.member_status == PROSPECT again, member_since_at is null, and member_tier == NONE"
            - "the member occupies PROSPECT twice in its history, which no linear A->B->C->D pipeline permits"

      - name: direct_deposit_enrollment_grace_recovery_cycle
        grounds:
          - state_machines.DirectDepositEnrollment.ACTIVE_to_GRACE
          - state_machines.DirectDepositEnrollment.GRACE_to_ACTIVE
          - state_machines.DirectDepositEnrollment.GRACE_to_LAPSED
          - state_machines.DirectDepositEnrollment.LAPSED_to_ACTIVE
        distinguishing_aspect: |
          A cycle with two distinct re-entry paths on a different entity: GRACE returns to
          ACTIVE on a posted deposit and LAPSED returns to ACTIVE on re-activation, so the
          machine revisits ACTIVE twice with different side-effect sets.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Member m6 holds an ADOPTED BANKING holding and has an ACTIVE enrollment with a 100000-cent monthly threshold."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /benefits/members"
              payload: { member_number: "M-3061-006", full_name: "Fay Iqbal", email: "fay@x.com" }
              as: Anonymous
              captures: { m6_id: $.data.id }
            - call: "POST /benefits/holdings"
              payload: { member_id: "${m6_id}", product_line: "BANKING", balance_cents: 250000 }
              as: PlatformAdmin
              captures: { h6_id: $.data.id }
            - call: "POST /benefits/holdings/${h6_id}/adopt"
              payload: {}
              as: Member
              as_user_id: "${m6_id}"
            - call: "POST /benefits/deposit-enrollments"
              payload: { member_id: "${m6_id}", required_monthly_amount_cents: 100000 }
              as: PlatformAdmin
              captures: { en6_id: $.data.id }
            - call: "POST /benefits/members/${m6_id}/deposits"
              payload: { enrollment_id: "${en6_id}", amount_cents: 200000, posted_at: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /benefits/deposit-enrollments/${en6_id}/activate"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /benefits/members/${m6_id}/deposits"
              payload: { enrollment_id: "${en6_id}", amount_cents: 200000, posted_at: "2026-10-05T00:00:00Z" }
              as: PlatformAdmin
          assert:
            - "DirectDepositEnrollment.${en6_id}.status == ACTIVE after activation, with qualified_at == 2026-09-01T00:00:00Z and requalification_due_at == 2026-12-01T00:00:00Z"
            - "an event loop then drives ACTIVE -> GRACE through POST /benefits/deposit-enrollments/${en6_id}/lapse with grace_deadline_at == 2026-11-01T00:00:00Z"
            - "the October posting inside the grace window returns the enrollment to ACTIVE, resetting missed_cycle_count to 0"
            - "DirectDepositEnrollment.${en6_id}.status == ACTIVE a second time, so the machine has revisited ACTIVE by a different path than at activation"
            - "consecutive_qualifying_months == 2 (September and October) at the moment of the second ACTIVE"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: deposit_lapse_cascade_member_entitlement_application_loan
        grounds:
          - state_machines.DirectDepositEnrollment.GRACE_to_LAPSED
          - state_machines.Member.MEMBER_ACTIVE_to_MEMBER_AT_RISK
          - state_machines.BenefitEntitlement.GRANTED_to_STEPPED_DOWN
          - state_machines.LoanAccount.FINAL_to_STEPPED_DOWN
        distinguishing_aspect: |
          Depth 3 with each link caused by the previous one: the enrollment lapse mutates
          the benefit entitlement, that entitlement's downgrade is itself the cause of the
          discount-application rollback, and the rollback is what reprices the loan.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Member m7 holds an ADOPTED BANKING holding and an ADOPTED LENDING holding carrying LoanAccount la7 (base_apr_bps 1200)."
            - "Rule DIRECT_DEPOSIT_50 (DIRECT_DEPOSIT, ADDITIVE, 50 bps, requires_direct_deposit true) is ACTIVE; enrollment en7 is ACTIVE with a 100000-cent threshold; entitlement EN7 (DEPOSIT_RATE_BOOST) is GRANTED; la7 is FINAL at discount_stack_bps 50 / effective_apr_bps 1150."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /benefits/members"
              payload: { member_number: "M-3061-007", full_name: "Gus Petrov", email: "gus@x.com" }
              as: Anonymous
              captures: { m7_id: $.data.id }
            - call: "POST /benefits/holdings"
              payload: { member_id: "${m7_id}", product_line: "BANKING", balance_cents: 300000 }
              as: PlatformAdmin
              captures: { h_bank7_id: $.data.id }
            - call: "POST /benefits/holdings"
              payload: { member_id: "${m7_id}", product_line: "LENDING", balance_cents: 0 }
              as: PlatformAdmin
              captures: { h_lend7_id: $.data.id }
            - call: "POST /benefits/holdings/${h_bank7_id}/adopt"
              payload: {}
              as: Member
              as_user_id: "${m7_id}"
            - call: "POST /benefits/holdings/${h_lend7_id}/adopt"
              payload: {}
              as: Member
              as_user_id: "${m7_id}"
            - call: "POST /benefits/rate-discount-rules"
              payload: { rule_code: "DIRECT_DEPOSIT_50", discount_kind: "DIRECT_DEPOSIT", stacking_class: "ADDITIVE", discount_bps: 50, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z", requires_direct_deposit: true }
              as: BenefitsAdmin
              captures: { r_dd7_id: $.data.id }
            - call: "POST /benefits/rate-discount-rules/${r_dd7_id}/activate"
              payload: {}
              as: BenefitsAdmin
            - call: "POST /benefits/deposit-enrollments"
              payload: { member_id: "${m7_id}", required_monthly_amount_cents: 100000 }
              as: PlatformAdmin
              captures: { en7_id: $.data.id }
