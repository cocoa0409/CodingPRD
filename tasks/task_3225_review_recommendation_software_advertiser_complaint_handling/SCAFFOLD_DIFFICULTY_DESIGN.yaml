            - call: "POST /platform/business-pages/${pk_id}/solicitation-cases"
              payload: { target_review_ids: ["${rk_id}"], evidence_text: "Owner offered gift cards for positive reviews." }
              as: Reporter
              as_user_id: "${cr_id}"
              captures: { sck_id: $.data.id }
