              payload: { exam_window_id: "${win_id}" }
              as: Candidate
              as_user_id: "${cand_id}"
              captures: { err: $.data.error_id }
            - call: "POST /actuarial/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T00:00:00Z" }
