              payload: { campus_id: "${campus_id}", full_name: "MD2", badge_number: "MD-9b", responder_role: "MEDICAL_DIRECTOR" }
              as: ProgramManager
              captures: { md2: $.data.id }
            - call: "POST /api/zones"
              payload: { campus_id: "${campus_id}", zone_code: "Z", floor_area_sqm: 100, avg_walk_speed_mps: 1.5, requires_elevator: false, elevator_delay_seconds: 0 }
              as: ProgramManager
              captures: { zid: $.data.id }
            - call: "POST /api/cabinets"
              payload: { zone_id: "${zid}", location_label: "L", centroid_x_m: 0.0, centroid_y_m: 0.0 }
