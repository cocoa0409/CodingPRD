  # ===========================================================================
  - section: validations
    instances:

      - name: missing_x_user_role_header_returns_unauthenticated
        claim_type: violation_to_error
        grounds:
          - validations[priority 1]
          - errors[ERR_UNAUTHENTICATED]
          - rbac.roles
        distinguishing_aspect: |
          Priority 1 fires before everything else and covers two distinct shapes: the header absent
          entirely, and a syntactically present but undeclared role name. Both are 401
          ERR_UNAUTHENTICATED, never 403 -- 403 is reserved for a declared role that is simply not on
          the endpoint's list.
        test_recipe:
          setup:
            - "Empty database; no rows are needed because priority 1 precedes existence checks."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-07T00:00:00Z" }
              as: ProgramDirector
          trigger:
            - call: "GET /participants"
              payload: {}
              as: "(X-User-Role header omitted entirely)"
              captures: { err_missing: $.data.error_id }
            - call: "GET /participants"
              payload: {}
              as: "Auditor (not one of the seven declared roles)"
              captures: { err_unknown: $.data.error_id }
          assert:
            - "header omitted: HTTP 401 with data.error_id == \"ERR_UNAUTHENTICATED\" and data.message present"
            - "undeclared role name: HTTP 401 with data.error_id == \"ERR_UNAUTHENTICATED\" (not 403)"
            - "both responses carry meta.api_request_id and meta.api_request_timestamp -- the error envelope is the same shape as a success envelope"

      - name: referral_partner_reading_another_partners_referral_is_forbidden
        claim_type: cross_entity_validation
        grounds:
          - validations[priority 4]
          - errors[ERR_NOT_RESOURCE_OWNER]
          - rbac.roles.ReferralPartner
          - complexity_profile.role_model
        distinguishing_aspect: |
          The entity_backed identity is enforced on reads as well as writes: partner B, holding a
          perfectly valid role for GET /referrals/{id}, is refused its peer's referral at priority 4
          (403 ERR_NOT_RESOURCE_OWNER, not 404), while partner A reads the same row successfully and
          an IntakeSpecialist -- who has no ownership constraint -- also reads it.
        test_recipe:
          setup:
            - "Two partners rpA and rpB, each TIER_1 with quota 5."
            - "One referral CAND-401 submitted by rpA."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-07T00:00:00Z" }
              as: ProgramDirector
            - call: "POST /referral-partners"
              payload: { organization_name: "Partner A", mou_tier: "TIER_1", referral_quota_per_period: 5 }
              as: ProgramDirector
              captures: { rpA_id: $.data.id }
            - call: "POST /referral-partners"
              payload: { organization_name: "Partner B", mou_tier: "TIER_1", referral_quota_per_period: 5 }
              as: ProgramDirector
              captures: { rpB_id: $.data.id }
            - call: "POST /referrals"
              payload: { referral_partner_id: "${rpA_id}", candidate_reference: "CAND-401", declared_barrier_codes: ["JUSTICE_INVOLVED"], household_income_cents: 100000, household_size: 2, hours_available_per_week: 40 }
              as: ReferralPartner
              as_user_id: "${rpA_id}"
              captures: { refA_id: $.data.id }
          trigger:
            - call: "GET /referrals/${refA_id}"
              payload: {}
              as: ReferralPartner
              as_user_id: "${rpB_id}"
              captures: { err: $.data.error_id }
            - call: "GET /referrals/${refA_id}"
              payload: {}
              as: ReferralPartner
              as_user_id: "${rpA_id}"
            - call: "GET /referrals/${refA_id}"
              payload: {}
              as: IntakeSpecialist
          assert:
            - "partner B: HTTP 403 with data.error_id == \"ERR_NOT_RESOURCE_OWNER\" (the row exists, so 404 would leak the wrong verdict)"
            - "partner A: HTTP 200 with data.id == ${refA_id} and data.referral_partner_id == ${rpA_id}"
            - "IntakeSpecialist: HTTP 200 -- priority 4 constrains only entity_backed roles"
            - "a POST /referrals by rpB naming referral_partner_id ${rpA_id} is likewise 403 ERR_NOT_RESOURCE_OWNER"

      - name: subsidy_period_overlap_rejected_on_closed_interval_boundary
        claim_type: temporal_validation
        grounds:
          - validations[priority 31]
          - errors[ERR_SUBSIDY_PERIOD_OVERLAP]
        distinguishing_aspect: |
          Period non-overlap is a CLOSED-interval test, so a new period starting exactly on the
          existing period_end (2026-09-30) collides, and only a start one day later (2026-10-01) is
          accepted. Abutment is therefore illegal here, in deliberate contrast with the shift-overlap
          rule at priority 28 where touching intervals never contend.
        test_recipe:
          setup:
            - "One LAUNCHED business line with a single period 2026-09-01..2026-09-30."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-07T00:00:00Z" }
              as: ProgramDirector
            - call: "POST /business-lines"
              payload: { name: "Cafe & Catering", market_viability_score: 90, training_relevance_score: 80, mission_alignment_score: 75, training_slots_total: 3, supervisor_capacity: 2, target_gross_margin_pct: 0.2000, subsidy_cap_cents: 5000000 }
              as: ProgramDirector
              captures: { bl_id: $.data.id }
            - call: "POST /business-lines/${bl_id}/review"
              payload: { decision: "APPROVED" }
              as: ProgramDirector
            - call: "POST /business-lines/${bl_id}/launch"
              payload: {}
              as: ProgramDirector
            - call: "POST /subsidy-periods"
              payload: { business_line_id: "${bl_id}", period_start: "2026-09-01T00:00:00Z", period_end: "2026-09-30T00:00:00Z", supervisor_hours: 40.0 }
              as: ProgramDirector
              captures: { sp_sep_id: $.data.id }
          trigger:
            - call: "POST /subsidy-periods"
              payload: { business_line_id: "${bl_id}", period_start: "2026-09-30T00:00:00Z", period_end: "2026-10-31T00:00:00Z", supervisor_hours: 40.0 }
              as: ProgramDirector
              captures: { err: $.data.error_id }
            - call: "POST /subsidy-periods"
              payload: { business_line_id: "${bl_id}", period_start: "2026-10-01T00:00:00Z", period_end: "2026-10-31T00:00:00Z", supervisor_hours: 40.0 }
              as: ProgramDirector
              captures: { sp_oct_id: $.data.id }
          assert:
            - "start == existing period_end: HTTP 409 with data.error_id == \"ERR_SUBSIDY_PERIOD_OVERLAP\""
            - "start one day later: HTTP 201 with data.status == \"OPEN\", data.allocation_basis == \"HOURS\", data.revenue_cents == null"
            - "GET /subsidy-periods?business_line_id=${bl_id} reports total_count == 2 (the rejected attempt left no row)"
            - "the accepted period reports mission_cost_cents == 0, business_operating_cost_cents == 0, mission_share == 0.0000 and both true-cost ratios null"

      - name: duplicate_candidate_reference_rejected_per_partner
        claim_type: violation_to_error
        grounds:
          - validations[priority 23]
          - errors[ERR_DUPLICATE_CANDIDATE_REFERENCE]
        distinguishing_aspect: |
          Uniqueness is scoped to (referral_partner_id, candidate_reference): the same partner
          resubmitting CAND-501 is refused at priority 23, while the same partner submitting
          CAND-502 succeeds -- and the refusal does not consume quota, so the partner's
          referrals_submitted_count moves from 1 to 2, never to 3.
