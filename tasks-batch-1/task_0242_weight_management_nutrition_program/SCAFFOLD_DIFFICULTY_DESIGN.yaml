          assert:
            - "response error_id == ERR_INTAKE_NOT_APPROVED"
            - "Enrollment.${enr_id}.clinical_status == PENDING_CLINICAL"

      - name: rx_issue_requires_eligibility_approved
        grounds:
          - state_machines.RxAuthorization.REQUESTED_to_ISSUED
          - state_machines.EligibilityDetermination.PENDING_to_APPROVED
