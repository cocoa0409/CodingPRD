    output: BlastFreezeBooking
    side_effects: ["selector: lot pallets STORED+OK by received_at ASC, created_at ASC, take pallet_count (ERR_INSUFFICIENT_FREEZABLE_STOCK if fewer)", "window containment check (ERR_OUTSIDE_WINDOW)"]
