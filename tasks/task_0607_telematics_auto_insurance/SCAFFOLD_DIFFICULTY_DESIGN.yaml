      # ---- Instance 1: Policy parallel dimensions (billing cycle x telematics toggle) ----
      - name: policy_billing_cycle_and_telematics_toggle_independent
        grounds:
          - state_machines.Policy.PERIOD_SETTLED_to_PERIOD_OPEN
          - state_machines.Policy.CAPTURING_to_SUSPENDED
          - entities.Policy.fields.billing_status
          - entities.Policy.fields.telematics_status
        distinguishing_aspect: |
          Policy carries two independent state dimensions: billing_status cycles
          PERIOD_OPEN->PERIOD_CLOSING->PERIOD_SETTLED->PERIOD_OPEN while telematics_status toggles
          CAPTURING<->SUSPENDED; opting out flips telematics_status to SUSPENDED without changing
          billing_status, proving the two axes evolve independently on the same row.
