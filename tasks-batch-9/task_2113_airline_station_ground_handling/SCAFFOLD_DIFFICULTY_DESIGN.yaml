              captures: { a1_id: $.data.id }
            - call: "POST /certifications"
              payload: { agent_id: "${a1_id}", station_id: "${st_id}", cert_type: "RAMP_SAFETY", issued_at: "2026-01-01T00:00:00Z", expires_at: "2027-01-01T00:00:00Z" }
              as: StationManager
            - call: "POST /stations/${st_id}/lifecycle"
              payload: { action: "SUSPEND", reason: "RUNWAY_CLOSURE" }
              as: StationManager
              captures: { st_status: $.data.status }
            - call: "GET /turns/${t1_id}"
              payload: {}
              as: DutyOfficer
              captures: { t1_status_after_suspend: $.data.status }
          trigger:
            - call: "POST /turn-resources"
              payload: { turn_id: "${t1_id}", resource_kind: "AGENT", agent_id: "${a1_id}", role_on_turn: "RAMP", window_start: "2026-04-10T05:50:00Z", window_end: "2026-04-10T06:30:00Z", expected_turn_version: "${t1_v}" }
              as: DutyOfficer
              captures: { err_station: $.data.error_id }
            - call: "POST /stations/${st_id}/lifecycle"
              payload: { action: "RESUME" }
              as: StationManager
            - call: "POST /turn-resources"
              payload: { turn_id: "${t1_id}", resource_kind: "AGENT", agent_id: "${a1_id}", role_on_turn: "RAMP", window_start: "2026-04-10T05:50:00Z", window_end: "2026-04-10T06:30:00Z", expected_turn_version: "${t1_v}" }
              as: DutyOfficer
              captures: { ok_status: $.data.status, ok_minutes: $.data.occupied_minutes }
          assert:
            - "${st_status} == SUSPENDED"
            - "${t1_status_after_suspend} == SCHEDULED"
            - "${err_station} == ERR_STATION_NOT_OPEN"
            - "HTTP status of the first create is 409"
            - "${ok_status} == RESERVED"
            - "${ok_minutes} == 40"
            - "Station.${st_id}.status == OPEN"
            - "Agent.${a1_id}.assigned_duty_minutes == 40"
            - "FlightBank.${fb_id}.bank_status == DRAFT"

      - name: agent_assignment_blocked_by_suspended_subcontractor
        grounds:
          - entities.Subcontractor.fields.status
          - state_machines.Subcontractor.APPROVED_to_SUSPENDED
          - errors[ERR_SUBCONTRACTOR_NOT_APPROVED]
          - validations[priority=11]
          - entities.Agent.fields.employment_type
        distinguishing_aspect: |
          A THIRD entity pair - TURNRESOURCE -> SUBCONTRACTOR, reached indirectly through
          Agent.subcontractor_id: the Agent's own status is still ACTIVE and its endorsement is
          current, but the create is refused with ERR_SUBCONTRACTOR_NOT_APPROVED because the
          employing firm moved APPROVED -> SUSPENDED after the agent was hired.
        test_recipe:
          setup:
            - "Station ZRH is OPEN, season SUMMER."
            - "Subcontractor 'Alpine Ramp AG' was APPROVED, hired agent E010 and then moved to SUSPENDED."
            - "Agent E010 is still ACTIVE and holds a current RAMP_SAFETY endorsement at ZRH."
            - "Turn LX318 (TOWING_ONLY) is SCHEDULED with zero occupations."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-04-01T00:00:00Z" }
              as: StationManager
            - call: "POST /stations"
              payload: { iata_code: "ZRH", name: "Zurich", handler_code: "SWP", season_code: "SUMMER" }
              as: StationManager
              captures: { st_id: $.data.id }
            - call: "POST /stations/${st_id}/lifecycle"
              payload: { action: "OPEN" }
              as: StationManager
            - call: "POST /subcontractors"
              payload: { station_id: "${st_id}", legal_name: "Alpine Ramp AG" }
              as: StationManager
              captures: { sc_id: $.data.id }
            - call: "POST /subcontractors/${sc_id}/oversight-decisions"
              payload: { decision: "APPROVE" }
              as: StationManager
            - call: "POST /agents"
              payload: { station_id: "${st_id}", employee_code: "E010", full_name: "Cleo Marin", subcontractor_id: "${sc_id}" }
              as: StationManager
              captures: { a_id: $.data.id }
            - call: "POST /certifications"
              payload: { agent_id: "${a_id}", station_id: "${st_id}", cert_type: "RAMP_SAFETY", issued_at: "2026-01-01T00:00:00Z", expires_at: "2027-01-01T00:00:00Z" }
              as: StationManager
            - call: "POST /flight-banks"
              payload: { station_id: "${st_id}", bank_code: "AM1", season_code: "SUMMER", window_start: "2026-04-10T04:00:00Z", window_end: "2026-04-10T22:00:00Z", planned_headcount: 1 }
              as: DutyOfficer
              captures: { fb_id: $.data.id }
            - call: "POST /turns"
              payload: { station_id: "${st_id}", flight_bank_id: "${fb_id}", flight_number: "LX318", turn_type: "TOWING_ONLY", scheduled_in: "2026-04-10T06:00:00Z", scheduled_out: "2026-04-10T06:20:00Z" }
              as: DutyOfficer
              captures: { t1_id: $.data.id, t1_v: $.data.version }
            - call: "POST /subcontractors/${sc_id}/oversight-decisions"
              payload: { decision: "SUSPEND", note: "Audit findings outstanding" }
              as: StationManager
              captures: { sc_status: $.data.status }
          trigger:
            - call: "POST /turn-resources"
              payload: { turn_id: "${t1_id}", resource_kind: "AGENT", agent_id: "${a_id}", role_on_turn: "RAMP", window_start: "2026-04-10T05:50:00Z", window_end: "2026-04-10T06:30:00Z", expected_turn_version: "${t1_v}" }
              as: DutyOfficer
              captures: { err_sub: $.data.error_id }
          assert:
            - "${sc_status} == SUSPENDED"
            - "${err_sub} == ERR_SUBCONTRACTOR_NOT_APPROVED"
            - "HTTP status of the trigger is 409"
            - "Agent.${a_id}.status == ACTIVE"
            - "Agent.${a_id}.employment_type == SUBCONTRACTED"
            - "Agent.${a_id}.assigned_duty_minutes == 0"
            - "Turn.${t1_id}.assigned_agent_count == 0"
            - "Turn.${t1_id}.status == SCHEDULED"

  # =======================================================================
  # Rule 8 - resource temporal-overlap conflicts, different interval semantics
  # =======================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: gse_buffered_half_open_interval_adjacency
        grounds:
          - calculations.gse_occupation_overlap
          - entities.Station.fields.gse_reposition_buffer_minutes
          - entities.GseUnit.fields.committed_occupation_minutes
          - errors[ERR_GSE_WINDOW_CONFLICT]
          - validations[priority=13]
        distinguishing_aspect: |
          GSE interval semantics = HALF-OPEN occupation extended by a 20-minute repositioning
          buffer at its end, on the GseUnit resource. An existing [06:00, 06:20) occupation
          blocks a new one starting at 06:39 but ADMITS one starting at exactly 06:40, because
          the comparison against `existing.window_end + buffer` is strict.
        test_recipe:
          setup:
            - "Station ZRH is OPEN with gse_reposition_buffer_minutes 20."
            - "FlightBank AM1 is DRAFT with one TOWING_ONLY turn scheduled 06:00-06:20 on 2026-04-10."
            - "GseUnit TUG-01 already carries one RESERVED occupation of [06:00, 06:20) for that turn, so committed_occupation_minutes is 20."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-04-01T00:00:00Z" }
              as: StationManager
            - call: "POST /stations"
              payload: { iata_code: "ZRH", name: "Zurich", handler_code: "SWP", season_code: "SUMMER", gse_reposition_buffer_minutes: 20 }
              as: StationManager
              captures: { st_id: $.data.id }
            - call: "POST /stations/${st_id}/lifecycle"
              payload: { action: "OPEN" }
              as: StationManager
            - call: "POST /flight-banks"
              payload: { station_id: "${st_id}", bank_code: "AM1", season_code: "SUMMER", window_start: "2026-04-10T04:00:00Z", window_end: "2026-04-10T22:00:00Z", planned_headcount: 1 }
              as: DutyOfficer
              captures: { fb_id: $.data.id }
            - call: "POST /turns"
              payload: { station_id: "${st_id}", flight_bank_id: "${fb_id}", flight_number: "LX318", turn_type: "TOWING_ONLY", scheduled_in: "2026-04-10T06:00:00Z", scheduled_out: "2026-04-10T06:20:00Z" }
              as: DutyOfficer
              captures: { t1_id: $.data.id, t1_v: $.data.version }
            - call: "POST /gse-units"
              payload: { station_id: "${st_id}", asset_tag: "TUG-01", gse_type: "PUSHBACK_TUG", condition_score: 95, service_interval_cycles: 25, cycles_since_service: 0 }
              as: StationManager
              captures: { g1_id: $.data.id }
            - call: "POST /turn-resources"
              payload: { turn_id: "${t1_id}", resource_kind: "GSE", gse_unit_id: "${g1_id}", window_start: "2026-04-10T06:00:00Z", window_end: "2026-04-10T06:20:00Z", expected_turn_version: "${t1_v}" }
              as: DutyOfficer
              captures: { tr_first_id: $.data.id }
            - call: "GET /turns/${t1_id}"
              payload: {}
              as: DutyOfficer
              captures: { t1_v2: $.data.version }
          trigger:
            - call: "POST /turn-resources"
              payload: { turn_id: "${t1_id}", resource_kind: "GSE", gse_unit_id: "${g1_id}", window_start: "2026-04-10T06:39:00Z", window_end: "2026-04-10T07:00:00Z", expected_turn_version: "${t1_v2}" }
              as: DutyOfficer
              captures: { err_buffer: $.data.error_id }
            - call: "POST /turn-resources"
              payload: { turn_id: "${t1_id}", resource_kind: "GSE", gse_unit_id: "${g1_id}", window_start: "2026-04-10T06:40:00Z", window_end: "2026-04-10T07:00:00Z", expected_turn_version: "${t1_v2}" }
              as: DutyOfficer
              captures: { tr_second_id: $.data.id, second_minutes: $.data.occupied_minutes }
          assert:
            - "${err_buffer} == ERR_GSE_WINDOW_CONFLICT"
            - "HTTP status of the 06:39 attempt is 409"
            - "${second_minutes} == 20"
            - "TurnResource.${tr_first_id}.status == RESERVED"
            - "TurnResource.${tr_second_id}.status == RESERVED"
            - "GseUnit.${g1_id}.committed_occupation_minutes == 40"
            - "Turn.${t1_id}.assigned_gse_count == 2"
            - "Turn.${t1_id}.status == SCHEDULED"

      - name: agent_bare_closed_interval_touching_endpoints
        grounds:
          - calculations.agent_duty_overlap_and_cap
          - entities.Agent.fields.assigned_duty_minutes
          - errors[ERR_AGENT_DUTY_OVERLAP]
          - validations[priority=13]
        distinguishing_aspect: |
          Agent interval semantics differ from the GSE rule on a DIFFERENT resource entity: a
          bare CLOSED interval with NO buffer plus a calendar-day aggregate cap. An existing
          [06:00, 06:20] duty therefore BLOCKS a new one starting at exactly 06:20 (touching
          endpoints collide) and admits one starting at 06:21 - the mirror image of the GSE
          rule, where touching at end+buffer is admissible.
        test_recipe:
          setup:
            - "Station ZRH is OPEN, season SUMMER."
            - "FlightBank AM1 is DRAFT with one TOWING_ONLY turn scheduled 06:00-06:20 on 2026-04-10."
            - "Agent E001 holds a current RAMP_SAFETY endorsement and already carries one RESERVED duty occupation of [06:00, 06:20], so assigned_duty_minutes is 20."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-04-01T00:00:00Z" }
              as: StationManager
            - call: "POST /stations"
              payload: { iata_code: "ZRH", name: "Zurich", handler_code: "SWP", season_code: "SUMMER", gse_reposition_buffer_minutes: 20 }
              as: StationManager
              captures: { st_id: $.data.id }
            - call: "POST /stations/${st_id}/lifecycle"
              payload: { action: "OPEN" }
              as: StationManager
            - call: "POST /flight-banks"
              payload: { station_id: "${st_id}", bank_code: "AM1", season_code: "SUMMER", window_start: "2026-04-10T04:00:00Z", window_end: "2026-04-10T22:00:00Z", planned_headcount: 1 }
              as: DutyOfficer
              captures: { fb_id: $.data.id }
            - call: "POST /turns"
              payload: { station_id: "${st_id}", flight_bank_id: "${fb_id}", flight_number: "LX318", turn_type: "TOWING_ONLY", scheduled_in: "2026-04-10T06:00:00Z", scheduled_out: "2026-04-10T06:20:00Z" }
              as: DutyOfficer
              captures: { t1_id: $.data.id, t1_v: $.data.version }
            - call: "POST /agents"
              payload: { station_id: "${st_id}", employee_code: "E001", full_name: "Ana Ruiz" }
              as: StationManager
              captures: { a1_id: $.data.id }
            - call: "POST /certifications"
              payload: { agent_id: "${a1_id}", station_id: "${st_id}", cert_type: "RAMP_SAFETY", issued_at: "2026-01-01T00:00:00Z", expires_at: "2027-01-01T00:00:00Z" }
              as: StationManager
            - call: "POST /turn-resources"
              payload: { turn_id: "${t1_id}", resource_kind: "AGENT", agent_id: "${a1_id}", role_on_turn: "RAMP", window_start: "2026-04-10T06:00:00Z", window_end: "2026-04-10T06:20:00Z", expected_turn_version: "${t1_v}" }
              as: DutyOfficer
              captures: { tr_first_id: $.data.id }
            - call: "GET /turns/${t1_id}"
              payload: {}
              as: DutyOfficer
              captures: { t1_v2: $.data.version }
          trigger:
            - call: "POST /turn-resources"
              payload: { turn_id: "${t1_id}", resource_kind: "AGENT", agent_id: "${a1_id}", role_on_turn: "RAMP", window_start: "2026-04-10T06:20:00Z", window_end: "2026-04-10T06:40:00Z", expected_turn_version: "${t1_v2}" }
              as: DutyOfficer
              captures: { err_touch: $.data.error_id }
            - call: "POST /turn-resources"
              payload: { turn_id: "${t1_id}", resource_kind: "AGENT", agent_id: "${a1_id}", role_on_turn: "RAMP", window_start: "2026-04-10T06:21:00Z", window_end: "2026-04-10T06:40:00Z", expected_turn_version: "${t1_v2}" }
              as: DutyOfficer
              captures: { tr_second_id: $.data.id, second_minutes: $.data.occupied_minutes }
          assert:
            - "${err_touch} == ERR_AGENT_DUTY_OVERLAP"
            - "HTTP status of the 06:20 attempt is 409"
            - "${second_minutes} == 19"
            - "TurnResource.${tr_first_id}.status == RESERVED"
            - "TurnResource.${tr_second_id}.status == RESERVED"
            - "Agent.${a1_id}.assigned_duty_minutes == 39"
            - "Turn.${t1_id}.assigned_agent_count == 2"
            - "Turn.${t1_id}.status == SCHEDULED"

  # =======================================================================
  # Rule 9 - compensating-action invariants over different conserved quantities
  # =======================================================================
  - rule_id: compensating_invariant
    instances:

      - name: gse_occupation_minutes_conserved_across_create_and_release
        grounds:
          - calculations.resource_ledgers
          - entities.GseUnit.fields.committed_occupation_minutes
          - state_machines.TurnResource.RESERVED_to_RELEASED
          - state_machines.Turn.RESOURCED_to_SCHEDULED
          - state_machines.FlightBank.APPROVED_to_REVISION_REQUIRED
        distinguishing_aspect: |
          Conserved quantity = MINUTES OF EQUIPMENT OCCUPATION. The invariant
          `GseUnit.committed_occupation_minutes == sum(occupied_minutes of its RESERVED or
          COMMITTED TurnResource rows)` must hold before (0), after the forward action (45) and
          after the compensating release (0 again), with zero drift, while the agent ledger on
          the same turn stays pinned at 40.
        test_recipe:
          setup:
            - "Station ZRH is OPEN, season SUMMER."
            - "FlightBank AM1 is PUBLISHED with staffing APPROVED and planned_headcount 1."
            - "Turn LX318 (TOWING_ONLY) already carries one AGENT occupation of 40 minutes, so it is still SCHEDULED for lack of equipment."
            - "GseUnit TUG-01 is AVAILABLE with committed_occupation_minutes 0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-04-01T00:00:00Z" }
              as: StationManager
            - call: "POST /stations"
              payload: { iata_code: "ZRH", name: "Zurich", handler_code: "SWP", season_code: "SUMMER", gse_reposition_buffer_minutes: 20 }
              as: StationManager
              captures: { st_id: $.data.id }
            - call: "POST /stations/${st_id}/lifecycle"
              payload: { action: "OPEN" }
              as: StationManager
            - call: "POST /flight-banks"
              payload: { station_id: "${st_id}", bank_code: "AM1", season_code: "SUMMER", window_start: "2026-04-10T04:00:00Z", window_end: "2026-04-10T22:00:00Z", planned_headcount: 1 }
              as: DutyOfficer
              captures: { fb_id: $.data.id }
            - call: "POST /turns"
              payload: { station_id: "${st_id}", flight_bank_id: "${fb_id}", flight_number: "LX318", turn_type: "TOWING_ONLY", scheduled_in: "2026-04-10T06:00:00Z", scheduled_out: "2026-04-10T06:20:00Z" }
              as: DutyOfficer
              captures: { t1_id: $.data.id, t1_v: $.data.version }
            - call: "POST /agents"
              payload: { station_id: "${st_id}", employee_code: "E001", full_name: "Ana Ruiz" }
              as: StationManager
              captures: { a1_id: $.data.id }
            - call: "POST /certifications"
              payload: { agent_id: "${a1_id}", station_id: "${st_id}", cert_type: "RAMP_SAFETY", issued_at: "2026-01-01T00:00:00Z", expires_at: "2027-01-01T00:00:00Z" }
              as: StationManager
            - call: "POST /gse-units"
              payload: { station_id: "${st_id}", asset_tag: "TUG-01", gse_type: "PUSHBACK_TUG", condition_score: 95, service_interval_cycles: 25, cycles_since_service: 0 }
              as: StationManager
              captures: { g1_id: $.data.id }
            - call: "POST /flight-banks/${fb_id}/lifecycle"
              payload: { action: "PUBLISH" }
              as: DutyOfficer
            - call: "POST /flight-banks/${fb_id}/staffing-transitions"
              payload: { action: "SUBMIT" }
              as: DutyOfficer
            - call: "POST /flight-banks/${fb_id}/staffing-transitions"
              payload: { action: "APPROVE" }
              as: StationManager
            - call: "POST /turn-resources"
              payload: { turn_id: "${t1_id}", resource_kind: "AGENT", agent_id: "${a1_id}", role_on_turn: "RAMP", window_start: "2026-04-10T05:50:00Z", window_end: "2026-04-10T06:30:00Z", expected_turn_version: "${t1_v}" }
              as: DutyOfficer
              captures: { tr_a1_id: $.data.id }
            - call: "GET /gse-units/${g1_id}"
              payload: {}
              as: DutyOfficer
              captures: { gse_min_before: $.data.committed_occupation_minutes }
            - call: "GET /turns/${t1_id}"
              payload: {}
              as: DutyOfficer
              captures: { t1_v2: $.data.version }
          trigger:
            - call: "POST /turn-resources"
              payload: { turn_id: "${t1_id}", resource_kind: "GSE", gse_unit_id: "${g1_id}", window_start: "2026-04-10T05:45:00Z", window_end: "2026-04-10T06:30:00Z", expected_turn_version: "${t1_v2}" }
              as: DutyOfficer
              captures: { tr_g1_id: $.data.id, g_minutes: $.data.occupied_minutes, turn_after_create: $.data.status }
            - call: "GET /gse-units/${g1_id}"
              payload: {}
              as: DutyOfficer
              captures: { gse_min_mid: $.data.committed_occupation_minutes }
            - call: "POST /turn-resources/${tr_g1_id}/release"
              payload: { reason: "TUG_REALLOCATED" }
              as: DutyOfficer
              captures: { released_status: $.data.status }
            - call: "GET /gse-units/${g1_id}"
              payload: {}
              as: DutyOfficer
              captures: { gse_min_after: $.data.committed_occupation_minutes }
          assert:
            - "${gse_min_before} == 0"
            - "${g_minutes} == 45"
            - "${gse_min_mid} == 45"
            - "${released_status} == RELEASED"
            - "${gse_min_after} == 0"
            - "${gse_min_after} == ${gse_min_before}"
            - "Agent.${a1_id}.assigned_duty_minutes == 40"
            - "TurnResource.${tr_a1_id}.status == RESERVED"
            - "Turn.${t1_id}.status == SCHEDULED"
            - "Turn.${t1_id}.assigned_gse_count == 0"
            - "FlightBank.${fb_id}.staffing_status == REVISION_REQUIRED"
            - "GseUnit.${g1_id}.cycles_since_service == 0"

      - name: billing_accrual_cents_conserved_across_create_and_void
        grounds:
          - calculations.period_billing_rollup
          - entities.BillingPeriod.fields.accrued_cents
          - entities.BillingPeriod.fields.line_count
          - entities.BillingLine.fields.status
          - entities.Turn.fields.billed
          - concurrency_rules[billing-line-create-stale-period]
        distinguishing_aspect: |
          A DIFFERENT type of conserved quantity - CENTS OF ACCRUED REVENUE, not minutes. The
          invariant `BillingPeriod.accrued_cents == sum(net_amount_cents of its PROVISIONAL or
          FINAL lines)` must read 0 before the accrual, 18000 after it and exactly 0 again after
          the compensating void, with line_count returning to 0 and Turn.billed back to false.
        test_recipe:
          setup:
            - "Station ZRH is OPEN, season SUMMER."
            - "FlightBank AM1 is DRAFT with one TOWING_ONLY turn scheduled 06:00-06:20 (scheduled_ground_minutes 20, excess 0, so the PROVISIONAL charge is exactly the 18000-cent base rate)."
            - "BillingPeriod 2026-04 is OPEN with line_count 0 and accrued_cents 0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-04-01T00:00:00Z" }
              as: StationManager
            - call: "POST /stations"
              payload: { iata_code: "ZRH", name: "Zurich", handler_code: "SWP", season_code: "SUMMER" }
              as: StationManager
              captures: { st_id: $.data.id }
            - call: "POST /stations/${st_id}/lifecycle"
              payload: { action: "OPEN" }
              as: StationManager
            - call: "POST /flight-banks"
              payload: { station_id: "${st_id}", bank_code: "AM1", season_code: "SUMMER", window_start: "2026-04-10T04:00:00Z", window_end: "2026-04-10T22:00:00Z", planned_headcount: 1 }
              as: DutyOfficer
              captures: { fb_id: $.data.id }
            - call: "POST /turns"
              payload: { station_id: "${st_id}", flight_bank_id: "${fb_id}", flight_number: "LX318", turn_type: "TOWING_ONLY", scheduled_in: "2026-04-10T06:00:00Z", scheduled_out: "2026-04-10T06:20:00Z" }
              as: DutyOfficer
              captures: { t1_id: $.data.id }
            - call: "POST /billing-periods"
              payload: { station_id: "${st_id}", period_code: "2026-04", window_start: "2026-04-01T00:00:00Z", window_end: "2026-04-30T23:59:00Z" }
              as: BillingController
              captures: { bp_id: $.data.id, bp_v: $.data.version, accrued_before: $.data.accrued_cents, lines_before: $.data.line_count }
          trigger:
            - call: "POST /billing-lines"
              payload: { billing_period_id: "${bp_id}", turn_id: "${t1_id}", expected_billing_period_version: "${bp_v}" }
              as: BillingController
              captures: { bl_id: $.data.id, line_net: $.data.net_amount_cents, line_gross: $.data.gross_amount_cents }
            - call: "GET /billing-periods/${bp_id}"
              payload: {}
              as: BillingController
              captures: { accrued_mid: $.data.accrued_cents, lines_mid: $.data.line_count, gross_mid: $.data.gross_total_cents }
            - call: "POST /billing-lines/${bl_id}/void"
              payload: { reason: "ACCRUED_TO_WRONG_PERIOD" }
              as: BillingController
              captures: { void_status: $.data.status }
            - call: "GET /billing-periods/${bp_id}"
              payload: {}
              as: BillingController
              captures: { accrued_after: $.data.accrued_cents, lines_after: $.data.line_count, gross_after: $.data.gross_total_cents, tier_after: $.data.rebate_tier }
          assert:
            - "${accrued_before} == 0"
            - "${lines_before} == 0"
            - "${line_gross} == 18000"
            - "${line_net} == 18000"
            - "${accrued_mid} == 18000"
            - "${gross_mid} == 18000"
            - "${lines_mid} == 1"
            - "${void_status} == VOID"
            - "${accrued_after} == 0"
            - "${accrued_after} == ${accrued_before}"
            - "${lines_after} == 0"
            - "${gross_after} == 0"
            - "${tier_after} == NONE"
            - "BillingLine.${bl_id}.void_reason == ACCRUED_TO_WRONG_PERIOD"
            - "Turn.${t1_id}.billed == false"
            - "BillingPeriod.${bp_id}.net_total_cents == 0"
