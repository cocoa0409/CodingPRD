            - "Final invariant: pa_out2 == 0 == 2 - 1 - 1 AND pa_esc2 == 0 AND cb3 == 150900 (conversion forfeits escrow already collected; balance unchanged)"

      - name: batch_mass_balance_invariant
        grounds:
          - calculations.brix_adjustment
          - entities.Batch.fields.loss_liters
          - entities.Batch.fields.processed_liters
        distinguishing_aspect: |
          Conserved quantity: liquid liters. quantity_liters ==
          initial_quantity_liters + added_water_liters + added_concentrate_liters
          across both adjustment branches, and processed_liters + loss_liters ==
          quantity_liters after processing — with exact literals 2153.4 / 43.1 /
          2110.3 pinning the arithmetic.
        test_recipe:
          setup:
            - "ACTIVE customer; DRAFT formula (target 12.0, tol 0.3, conc 65.0); tank cap 5000; batch 2000 L"
          setup_api_calls:
            - { call: "POST /v1/customer-accounts", payload: { name: "MassBal", credit_limit_cents: 1000000, minimum_run_units: 500, pallet_deposit_cents: 1500 }, as: PlantManager, captures: { cust_id: $.data.id } }
            - { call: "POST /v1/customer-accounts/${cust_id}/approve-credit", payload: {}, as: FinanceClerk }
            - { call: "POST /v1/formulas", payload: { customer_id: "${cust_id}", formula_code: "MB-1", name: "Mass Balance", target_brix: 12.0, brix_tolerance: 0.3, process_type: "PASTEURIZATION", container_fill_ml: 473, concentrate_brix: 65.0, allergen_group: "NONE", shelf_life_days: 90, claims: ["ORGANIC"] }, as: ProductDeveloper, as_user_id: "dev-1", captures: { form_id: $.data.id } }
            - { call: "POST /v1/blending-tanks", payload: { tank_code: "T-MB", capacity_liters: 5000 }, as: PlantManager, captures: { tank_id: $.data.id } }
            - { call: "POST /v1/batches", payload: { formula_id: "${form_id}", tank_id: "${tank_id}", planned_start_at: "2026-08-10T08:00:00Z", planned_end_at: "2026-08-10T12:00:00Z", quantity_liters: 2000 }, as: BlendOperator, captures: { batch_id: $.data.id } }
            - { call: "POST /v1/batches/${batch_id}/start-blend", payload: {}, as: BlendOperator, as_user_id: "op-1" }
          trigger:
            - { call: "POST /v1/batches/${batch_id}/record-blend", payload: { measured_brix: 12.8 }, as: BlendOperator, as_user_id: "op-1" }
            - { call: "POST /v1/batches/${batch_id}/qa-verdict", payload: { verdict: "FAIL" }, as: QAInspector, as_user_id: "qa-1" }
            - { call: "POST /v1/batches/${batch_id}/apply-adjustment", payload: {}, as: BlendOperator, as_user_id: "op-1" }
            - { call: "POST /v1/batches/${batch_id}/record-blend", payload: { measured_brix: 11.5 }, as: BlendOperator, as_user_id: "op-1" }
            - { call: "POST /v1/batches/${batch_id}/qa-verdict", payload: { verdict: "FAIL" }, as: QAInspector, as_user_id: "qa-1" }
            - { call: "POST /v1/batches/${batch_id}/apply-adjustment", payload: {}, as: BlendOperator, as_user_id: "op-1" }
            - { call: "POST /v1/batches/${batch_id}/record-blend", payload: { measured_brix: 12.2 }, as: BlendOperator, as_user_id: "op-1" }
            - { call: "POST /v1/batches/${batch_id}/qa-verdict", payload: { verdict: "PASS" }, as: QAInspector, as_user_id: "qa-1" }
            - { call: "POST /v1/process-runs", payload: { batch_id: "${batch_id}", setpoint_temp_c: 88.0, setpoint_hold_seconds: 30 }, as: BlendOperator, captures: { prun_id: $.data.id } }
            - { call: "POST /v1/process-runs/${prun_id}/start", payload: {}, as: BlendOperator, as_user_id: "op-1" }
            - { call: "POST /v1/process-runs/${prun_id}/complete", payload: { min_temp_c: 88.0, time_below_setpoint_seconds: 0 }, as: BlendOperator, as_user_id: "op-1" }
            - { call: "GET /v1/batches/${batch_id}", payload: {}, as: Any, captures: { b_init: $.data.initial_quantity_liters, b_water: $.data.added_water_liters, b_conc: $.data.added_concentrate_liters, b_qty: $.data.quantity_liters, b_loss: $.data.loss_liters, b_proc: $.data.processed_liters, b_status: $.data.status } }
          assert:
            - "b_qty == 2153.4 == b_init(2000) + b_water(133.3) + b_conc(20.1) — adjustment invariant holds across both branches"
            - "b_loss == 43.1 (round_half_up(2153.4 * 0.02, 1)) and b_proc == 2110.3"
            - "b_proc + b_loss == b_qty (2110.3 + 43.1 == 2153.4) — no liter created or destroyed"
            - "b_status == PROCESSED"
