              payload: { company_name: "RA Co", site_state_code: "UT" }
              as: ProjectManager
              captures: { c_ra: "$.data.id" }
            - call: "POST /panel-shop/jobs"
              payload: { customer_id: "${c_ra}", job_number: "J-RA1", quoted_price_cents: 100000 }
