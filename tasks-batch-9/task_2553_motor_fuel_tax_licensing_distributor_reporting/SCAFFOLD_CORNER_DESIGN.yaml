          assert:
            - "HTTP 422; data.error_id == ERR_PURCHASER_BOND_DEFICIENT (the purchaser is PENDING_BOND, which 100 permits, so only the fiscal rule can be speaking)"
            - "GET /mft/licensees/${dist_id}/bond-status reports required_bond_cents == 1500000, posted_bond_cents == 0 and bond_deficiency_cents == 1500000"
            - "after POST /mft/licensees/${dist_id}/bonds with amount_cents 1500000 and expected_licensee_version ${dist_v0}, the identical rack removal returns HTTP 201 with basis_used == NET, taxable_gallons == 7960.00, imposition_point == TERMINAL_RACK (branch 2f: the purchaser is now fully bonded but still PENDING_BOND, so the deferral branch 2e does not apply) and tax_amount_cents == 227656"
            - "GET /mft/rack-removals with payload { purchaser_licensee_id: ${dist_id} } then returns total_count == 1"

      - name: write_off_at_the_auto_escalation_threshold_returns_write_off_not_permitted
        claim_type: violation_to_error
        grounds:
          - validations[priority=409]
          - state_machines.MatchDiscrepancy.RESPONSE_RECEIVED_to_WRITTEN_OFF.preconditions
          - errors[ERR_WRITE_OFF_NOT_PERMITTED]
        distinguishing_aspect: "An 11000.00-gallon variance survives as OPEN only because an overlapping audit case suppressed its auto-escalation, and that surviving variance may never be written off: the examiner must explain or escalate it, so both the reason-less and the reasoned write-off are refused."
        test_recipe:
          setup:
            - "One SUPPLIER and one DISTRIBUTOR; AuditManager aud-01 already holds an OPEN case over 2026-08..2026-08 on the distributor."
            - "Clock at 2026-09-05T00:00:00Z; the supplier's FILED 2026-08 return reports SCH_5 GASOLINE 12000.00 gallons sold to the distributor while the distributor's FILED 2026-08 return reports only SCH_1 GASOLINE 1000.00 gallons received."
            - "The cross-match run therefore leaves one OPEN discrepancy with variance_gallons 11000.00 and escalation_skipped_count 1."
          setup_api_calls:
            - call: "POST /mft/licensees"
              payload: { legal_name: "Writeoff Fuel Supply LLC", fein: "41-6000001", license_type: "SUPPLIER", mailing_state: "MN" }
              as: LicensingOfficer
              captures: { sup_id: $.data.id }
            - call: "POST /mft/licensees"
              payload: { legal_name: "Writeoff Distribution Inc", fein: "41-6000002", license_type: "DISTRIBUTOR", mailing_state: "MN" }
              as: LicensingOfficer
              captures: { dist_id: $.data.id }
            - call: "POST /mft/audit-cases"
              payload: { subject_licensee_id: "${dist_id}", selection_method: "MANUAL_REFERRAL", period_start_month: "2026-08", period_end_month: "2026-08" }
              as: AuditManager
              as_user_id: "aud-01"
              captures: { case_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
              as: ReturnsExaminer
            - call: "POST /mft/returns"
              payload: { licensee_id: "${sup_id}", period_month: "2026-08" }
              as: ReturnsExaminer
              captures: { s_ret: $.data.id }
            - call: "POST /mft/returns/${s_ret}/schedules"
              payload: { schedule_code: "SCH_5_DELIVERED_TAX_COLLECTED", product_code: "GASOLINE", total_gallons: 12000.00 }
              as: ReturnsExaminer
              captures: { s_sch: $.data.id }
            - call: "POST /mft/schedules/${s_sch}/lines"
              payload: { counterparty_licensee_id: "${dist_id}", transaction_type: "SALE", gallons: 12000.00, document_date: "2026-08-10", bill_of_lading_number: "BOL-WO-0001" }
              as: ReturnsExaminer
            - call: "POST /mft/returns/${s_ret}/file"
              payload: { attest_name: "W. Writeoff" }
              as: ReturnsExaminer
            - call: "POST /mft/returns"
              payload: { licensee_id: "${dist_id}", period_month: "2026-08" }
              as: ReturnsExaminer
              captures: { d_ret: $.data.id }
            - call: "POST /mft/returns/${d_ret}/schedules"
              payload: { schedule_code: "SCH_1_RECEIVED_TAX_PAID", product_code: "GASOLINE", total_gallons: 1000.00 }
              as: ReturnsExaminer
              captures: { d_sch: $.data.id }
            - call: "POST /mft/schedules/${d_sch}/lines"
              payload: { counterparty_licensee_id: "${sup_id}", transaction_type: "PURCHASE", gallons: 1000.00, document_date: "2026-08-10", bill_of_lading_number: "BOL-WO-0002" }
              as: ReturnsExaminer
            - call: "POST /mft/returns/${d_ret}/file"
              payload: { attest_name: "W. Writeoff Dist" }
              as: ReturnsExaminer
            - call: "POST /mft/cross-match-runs"
              payload: { period_month: "2026-08" }
              as: ReturnsExaminer
              captures: { run_id: $.data.id }
            - call: "GET /mft/discrepancies"
              payload: { run_id: "${run_id}", product_code: "GASOLINE" }
              as: ReturnsExaminer
              captures: { disc_id: "$.data[0].id" }
          trigger:
            - call: "POST /mft/discrepancies/${disc_id}/resolve"
              payload: { resolution: "WRITTEN_OFF", write_off_reason: "Counterparty ceased trading and the gallons are uncollectable" }
              as: ReturnsExaminer
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422; data.error_id == ERR_WRITE_OFF_NOT_PERMITTED even though a write_off_reason was supplied, because abs(variance_gallons) 11000.00 is not below AUTO_ESCALATION_GALLONS"
            - "GET /mft/discrepancies/${disc_id} still reports status == OPEN with variance_gallons == 11000.00"
            - "GET /mft/cross-match-runs/${run_id} still reports unreported_gallons_total == 11000.00 and written_off_gallons_total == 0.00"
            - "a resolve with resolution EXPLAINED on the same discrepancy instead returns HTTP 200 with status == RESOLVED_EXPLAINED, so the refusal was specific to the write-off branch"

      - name: export_line_to_a_home_state_counterparty_returns_counterparty_type_invalid
        claim_type: violation_to_error
        grounds:
          - validations[priority=201]
          - errors[ERR_COUNTERPARTY_TYPE_INVALID]
        distinguishing_aspect: "For SCH_7_EXPORTS the counterparty test is on mailing_state rather than license_type: an MN-domiciled distributor cannot receive an export line even holding a flawless EXPORT certificate, while the same line to a WI distributor is accepted."
        test_recipe:
          setup:
            - "One SUPPLIER filer, one MN DISTRIBUTOR and one WI DISTRIBUTOR; clock at 2026-09-05T00:00:00Z."
            - "Both distributors hold ACTIVE EXPORT certificates valid 2026-08-01..2026-08-31."
            - "The filer's DRAFT 2026-08 return carries a SCH_7_EXPORTS GASOLINE schedule of 5000.00 gallons."
          setup_api_calls:
            - call: "POST /mft/licensees"
              payload: { legal_name: "Border Fuel Supply LLC", fein: "41-6100001", license_type: "SUPPLIER", mailing_state: "MN" }
              as: LicensingOfficer
              captures: { sup_id: $.data.id }
            - call: "POST /mft/licensees"
              payload: { legal_name: "Border Inside Distribution Inc", fein: "41-6100002", license_type: "DISTRIBUTOR", mailing_state: "MN" }
              as: LicensingOfficer
              captures: { mn_id: $.data.id }
            - call: "POST /mft/licensees"
              payload: { legal_name: "Border Outside Distribution Inc", fein: "41-6100003", license_type: "DISTRIBUTOR", mailing_state: "WI" }
              as: LicensingOfficer
              captures: { wi_id: $.data.id }
            - call: "POST /mft/exemption-certificates"
              payload: { purchaser_licensee_id: "${mn_id}", exemption_type: "EXPORT", document_number: "EX-6100-002", valid_from: "2026-08-01", valid_to: "2026-08-31" }
              as: LicensingOfficer
              captures: { mn_cert: $.data.id }
            - call: "POST /mft/exemption-certificates"
              payload: { purchaser_licensee_id: "${wi_id}", exemption_type: "EXPORT", document_number: "EX-6100-003", valid_from: "2026-08-01", valid_to: "2026-08-31" }
              as: LicensingOfficer
              captures: { wi_cert: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
              as: ReturnsExaminer
            - call: "POST /mft/returns"
              payload: { licensee_id: "${sup_id}", period_month: "2026-08" }
              as: ReturnsExaminer
              captures: { ret_id: $.data.id }
            - call: "POST /mft/returns/${ret_id}/schedules"
              payload: { schedule_code: "SCH_7_EXPORTS", product_code: "GASOLINE", total_gallons: 5000.00 }
