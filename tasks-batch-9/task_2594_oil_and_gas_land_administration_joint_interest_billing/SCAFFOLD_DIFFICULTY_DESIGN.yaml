scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: jib_cost_basis_accrual_versus_cash_on_identical_cost_history
        grounds:
          - calculations.jib_direct_cost_pool
          - calculations.overhead_charge
          - entities.JibStatement.fields.cost_basis
          - entities.CostEntry.fields.paid_date
          - state_machines.JibStatement.DRAFT_to_ISSUED
          - state_machines.JibStatement.ISSUED_to_VOID
        distinguishing_aspect: |
          This dual variant lives on cost accounting for a JibStatement: the ACCRUAL variant keys
          inclusion on CostEntry.incurred_date while the CASH variant keys it on CostEntry.paid_date,
          so the same three cost rows yield direct_cost_cents 1600000 under ACCRUAL and 1200000 under
          CASH, and total_billed_cents 1672000 versus 1252000.
        test_recipe:
          setup:
            - "Logical clock at 2026-07-10T00:00:00Z"
            - "Leases L-001 (640.00 gross acres, royalty 0.187500) and L-002 (320.00 gross acres, royalty 0.250000)"
            - "Well Sandstone 1H, OIL, 9500 ft, with 480.00 acres committed from L-001 and 160.00 from L-002 (allocation factors 0.750000 / 0.250000), well_status PRODUCING, pooling_status POOLED_EFFECTIVE"
            - "Three working-interest owners at 0.500000 (operator) / 0.300000 / 0.200000"
            - "Three cost entries: CAPITAL 1200000 incurred 2026-06-10 paid 2026-07-05; OPERATING 400000 incurred 2026-06-20 paid 2026-06-25; CAPITAL 800000 incurred 2026-05-15 paid 2026-06-05"
            - "A DRAFT statement JIB-2026-06-A over the closed period 2026-06-01..2026-06-30 with cost_basis ACCRUAL and overhead_rate_class PERCENTAGE_BASIS"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-07-10T00:00:00Z" }
              as: LandAdministrator
            - call: "POST /land-admin/leases"
              payload: { lease_number: "L-001", lessor_name: "Alpha Minerals", gross_acres: 640.00, royalty_rate: 0.187500, primary_term_end_date: "2026-09-30", extension_option_months: 24, extension_bonus_per_acre_cents: 15000, shut_in_royalty_per_acre_cents: 500, continuous_dev_window_days: 180 }
              as: LandAdministrator
              captures: { lease1_id: $.data.id }
            - call: "POST /land-admin/leases"
              payload: { lease_number: "L-002", lessor_name: "Beta Royalties", gross_acres: 320.00, royalty_rate: 0.250000, primary_term_end_date: "2027-12-31", extension_option_months: 12, extension_bonus_per_acre_cents: 12000, shut_in_royalty_per_acre_cents: 400, continuous_dev_window_days: 180 }
              as: LandAdministrator
              captures: { lease2_id: $.data.id }
            - call: "POST /land-admin/wells"
              payload: { well_name: "Sandstone 1H", api_number: "42-123-45678", product_type: "OIL", total_depth_ft: 9500, spud_date: "2026-02-10" }
              as: LandAdministrator
              captures: { well_id: $.data.id }
            - call: "POST /land-admin/wells/${well_id}/lease-allocations"
              payload: { lease_id: "${lease1_id}", committed_acres: 480.00 }
              as: LandAdministrator
              captures: { alloc1_id: $.data.id }
            - call: "POST /land-admin/wells/${well_id}/lease-allocations"
              payload: { lease_id: "${lease2_id}", committed_acres: 160.00 }
              as: LandAdministrator
              captures: { alloc2_id: $.data.id }
            - call: "POST /land-admin/interest-owners"
              payload: { owner_name: "Operator Energy LLC", owner_type: "WORKING_INTEREST_PARTNER", contact_email: "op@example.com", tax_id_on_file: true, bond_posted_cents: 50000000 }
              as: LandAdministrator
              captures: { op_id: $.data.id }
            - call: "POST /land-admin/interest-owners"
              payload: { owner_name: "Delta Partners LP", owner_type: "WORKING_INTEREST_PARTNER", contact_email: "delta@example.com", tax_id_on_file: true, bond_posted_cents: 10000000 }
              as: LandAdministrator
              captures: { oa_id: $.data.id }
            - call: "POST /land-admin/interest-owners"
              payload: { owner_name: "Epsilon Resources Inc", owner_type: "WORKING_INTEREST_PARTNER", contact_email: "epsilon@example.com", tax_id_on_file: false, bond_posted_cents: 0 }
              as: LandAdministrator
              captures: { ob_id: $.data.id }
            - call: "GET /land-admin/wells/${well_id}"
              payload: {}
              as: LandAdministrator
              captures: { wv1: $.data.version }
            - call: "POST /land-admin/wells/${well_id}/interests"
              payload: { owner_id: "${op_id}", working_interest_pct: 0.500000, net_revenue_interest_pct: 0.412500, effective_from: "2026-01-01", expected_well_version: "${wv1}", is_operator: true, preferential_right: true }
              as: LandAdministrator
              captures: { wi_op_id: $.data.id }
            - call: "GET /land-admin/wells/${well_id}"
              payload: {}
              as: LandAdministrator
              captures: { wv2: $.data.version }
            - call: "POST /land-admin/wells/${well_id}/interests"
              payload: { owner_id: "${oa_id}", working_interest_pct: 0.300000, net_revenue_interest_pct: 0.240000, effective_from: "2026-01-01", expected_well_version: "${wv2}", is_operator: false, preferential_right: true }
              as: LandAdministrator
              captures: { wi_oa_id: $.data.id }
            - call: "GET /land-admin/wells/${well_id}"
              payload: {}
              as: LandAdministrator
              captures: { wv3: $.data.version }
            - call: "POST /land-admin/wells/${well_id}/interests"
              payload: { owner_id: "${ob_id}", working_interest_pct: 0.200000, net_revenue_interest_pct: 0.150000, effective_from: "2026-01-01", expected_well_version: "${wv3}", is_operator: false, preferential_right: false }
              as: LandAdministrator
              captures: { wi_ob_id: $.data.id }
            - call: "POST /land-admin/wells/${well_id}/pooling-effectuation"
              payload: { effective_date: "2026-04-01" }
              as: LandAdministrator
            - call: "POST /land-admin/wells/${well_id}/status-changes"
              payload: { to_status: "DRILLING", effective_date: "2026-02-10" }
              as: LandAdministrator
            - call: "POST /land-admin/wells/${well_id}/status-changes"
              payload: { to_status: "PRODUCING", effective_date: "2026-04-01" }
              as: LandAdministrator
            - call: "POST /land-admin/wells/${well_id}/cost-entries"
              payload: { cost_category: "DRILLING", cost_class: "CAPITAL", amount_cents: 1200000, incurred_date: "2026-06-10", paid_date: "2026-07-05" }
              as: JointInterestAccountant
              captures: { cost1_id: $.data.id }
            - call: "POST /land-admin/wells/${well_id}/cost-entries"
              payload: { cost_category: "LEASE_OPERATING", cost_class: "OPERATING", amount_cents: 400000, incurred_date: "2026-06-20", paid_date: "2026-06-25" }
              as: JointInterestAccountant
              captures: { cost2_id: $.data.id }
            - call: "POST /land-admin/wells/${well_id}/cost-entries"
              payload: { cost_category: "COMPLETION", cost_class: "CAPITAL", amount_cents: 800000, incurred_date: "2026-05-15", paid_date: "2026-06-05" }
              as: JointInterestAccountant
              captures: { cost3_id: $.data.id }
            - call: "POST /land-admin/wells/${well_id}/jib-statements"
              payload: { statement_number: "JIB-2026-06-A", billing_period_start: "2026-06-01", billing_period_end: "2026-06-30", cost_basis: "ACCRUAL", activity_class: "PRODUCING", overhead_rate_class: "PERCENTAGE_BASIS" }
              as: JointInterestAccountant
              captures: { stmt_accrual_id: $.data.id }
          trigger:
            - call: "POST /land-admin/jib-statements/${stmt_accrual_id}/issuance"
              payload: {}
              as: JointInterestAccountant
            - call: "POST /land-admin/jib-statements/${stmt_accrual_id}/void"
              payload: { void_reason: "REBILL_ON_CASH_BASIS" }
              as: JointInterestAccountant
            - call: "POST /land-admin/wells/${well_id}/jib-statements"
              payload: { statement_number: "JIB-2026-06-C", billing_period_start: "2026-06-01", billing_period_end: "2026-06-30", cost_basis: "CASH", activity_class: "PRODUCING", overhead_rate_class: "PERCENTAGE_BASIS" }
              as: JointInterestAccountant
              captures: { stmt_cash_id: $.data.id }
            - call: "POST /land-admin/jib-statements/${stmt_cash_id}/issuance"
              payload: {}
              as: JointInterestAccountant
          assert:
            - "JibStatement.${stmt_accrual_id}.capital_direct_cents == 1200000"
            - "JibStatement.${stmt_accrual_id}.operating_direct_cents == 400000"
            - "JibStatement.${stmt_accrual_id}.direct_cost_cents == 1600000"
            - "JibStatement.${stmt_accrual_id}.overhead_cents == 72000"
            - "JibStatement.${stmt_accrual_id}.total_billed_cents == 1672000"
            - "JibStatement.${stmt_cash_id}.capital_direct_cents == 800000"
            - "JibStatement.${stmt_cash_id}.operating_direct_cents == 400000"
            - "JibStatement.${stmt_cash_id}.direct_cost_cents == 1200000"
            - "JibStatement.${stmt_cash_id}.overhead_cents == 52000"
            - "JibStatement.${stmt_cash_id}.total_billed_cents == 1252000"
            - "JibStatement.${stmt_accrual_id}.total_billed_cents - JibStatement.${stmt_cash_id}.total_billed_cents == 420000"
            - "Well.${well_id}.billed_to_date_cents == 1252000"
      - name: statutory_interest_from_due_date_versus_from_proceeds_receipt
        grounds:
          - calculations.statutory_late_interest
          - calculations.revenue_distribution_waterfall
          - entities.OwnerDisbursement.fields.interest_basis
          - state_machines.OwnerDisbursement.ACCRUED_to_PAID
          - validations[priority=60, error_id=ERR_PAYMENT_BEFORE_RELEASE]
        distinguishing_aspect: |
          This dual variant lives on statutory revenue-payment compliance for an OwnerDisbursement,
          not on cost accounting: FROM_DUE_DATE accrues 12% per annum for the 40 days after the
          statutory due date and yields 19649 cents, while FROM_PROCEEDS_RECEIPT accrues 6% per annum
          across the 99 days since the production month closed and yields 24315 cents on the identical
          net_amount_cents of 1494109.
        test_recipe:
          setup:
            - "The base land and interest fixture of jib_cost_basis_accrual_versus_cash_on_identical_cost_history, clock at 2026-08-05T00:00:00Z"
            - "Two released production months on the same well with identical gross_revenue_cents 5000000: 2026-06 (statutory_due_date 2026-08-29) and 2026-07 (statutory_due_date 2026-09-29)"
            - "The operator's L-001 disbursement on each month carries net_amount_cents 1494109"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T00:00:00Z" }
              as: LandAdministrator
            - call: "POST /land-admin/leases"
              payload: { lease_number: "L-001", lessor_name: "Alpha Minerals", gross_acres: 640.00, royalty_rate: 0.187500, primary_term_end_date: "2026-09-30", extension_option_months: 24, extension_bonus_per_acre_cents: 15000, shut_in_royalty_per_acre_cents: 500, continuous_dev_window_days: 180 }
              as: LandAdministrator
              captures: { lease1_id: $.data.id }
            - call: "POST /land-admin/leases"
              payload: { lease_number: "L-002", lessor_name: "Beta Royalties", gross_acres: 320.00, royalty_rate: 0.250000, primary_term_end_date: "2027-12-31", extension_option_months: 12, extension_bonus_per_acre_cents: 12000, shut_in_royalty_per_acre_cents: 400, continuous_dev_window_days: 180 }
              as: LandAdministrator
              captures: { lease2_id: $.data.id }
            - call: "POST /land-admin/wells"
              payload: { well_name: "Sandstone 1H", api_number: "42-123-45678", product_type: "OIL", total_depth_ft: 9500, spud_date: "2026-02-10" }
              as: LandAdministrator
              captures: { well_id: $.data.id }
            - call: "POST /land-admin/wells/${well_id}/lease-allocations"
              payload: { lease_id: "${lease1_id}", committed_acres: 480.00 }
              as: LandAdministrator
              captures: { alloc1_id: $.data.id }
            - call: "POST /land-admin/wells/${well_id}/lease-allocations"
              payload: { lease_id: "${lease2_id}", committed_acres: 160.00 }
              as: LandAdministrator
              captures: { alloc2_id: $.data.id }
            - call: "POST /land-admin/interest-owners"
              payload: { owner_name: "Operator Energy LLC", owner_type: "WORKING_INTEREST_PARTNER", contact_email: "op@example.com", tax_id_on_file: true, bond_posted_cents: 50000000 }
              as: LandAdministrator
              captures: { op_id: $.data.id }
            - call: "POST /land-admin/interest-owners"
              payload: { owner_name: "Delta Partners LP", owner_type: "WORKING_INTEREST_PARTNER", contact_email: "delta@example.com", tax_id_on_file: true, bond_posted_cents: 10000000 }
              as: LandAdministrator
              captures: { oa_id: $.data.id }
            - call: "POST /land-admin/interest-owners"
              payload: { owner_name: "Epsilon Resources Inc", owner_type: "WORKING_INTEREST_PARTNER", contact_email: "epsilon@example.com", tax_id_on_file: true, bond_posted_cents: 0 }
              as: LandAdministrator
              captures: { ob_id: $.data.id }
            - call: "GET /land-admin/wells/${well_id}"
              payload: {}
              as: LandAdministrator
              captures: { wv1: $.data.version }
            - call: "POST /land-admin/wells/${well_id}/interests"
              payload: { owner_id: "${op_id}", working_interest_pct: 0.500000, net_revenue_interest_pct: 0.412500, effective_from: "2026-01-01", expected_well_version: "${wv1}", is_operator: true, preferential_right: true }
              as: LandAdministrator
              captures: { wi_op_id: $.data.id }
            - call: "GET /land-admin/wells/${well_id}"
              payload: {}
              as: LandAdministrator
              captures: { wv2: $.data.version }
            - call: "POST /land-admin/wells/${well_id}/interests"
              payload: { owner_id: "${oa_id}", working_interest_pct: 0.300000, net_revenue_interest_pct: 0.240000, effective_from: "2026-01-01", expected_well_version: "${wv2}", is_operator: false, preferential_right: true }
              as: LandAdministrator
              captures: { wi_oa_id: $.data.id }
            - call: "GET /land-admin/wells/${well_id}"
              payload: {}
              as: LandAdministrator
              captures: { wv3: $.data.version }
            - call: "POST /land-admin/wells/${well_id}/interests"
              payload: { owner_id: "${ob_id}", working_interest_pct: 0.200000, net_revenue_interest_pct: 0.150000, effective_from: "2026-01-01", expected_well_version: "${wv3}", is_operator: false, preferential_right: false }
              as: LandAdministrator
              captures: { wi_ob_id: $.data.id }
            - call: "POST /land-admin/wells/${well_id}/pooling-effectuation"
              payload: { effective_date: "2026-04-01" }
              as: LandAdministrator
            - call: "POST /land-admin/wells/${well_id}/status-changes"
              payload: { to_status: "DRILLING", effective_date: "2026-02-10" }
              as: LandAdministrator
            - call: "POST /land-admin/wells/${well_id}/status-changes"
              payload: { to_status: "PRODUCING", effective_date: "2026-04-01" }
              as: LandAdministrator
            - call: "POST /land-admin/wells/${well_id}/production-revenues"
              payload: { production_month: "2026-06", gross_revenue_cents: 5000000, volume_units: 6250.000, sale_date: "2026-07-05" }
              as: JointInterestAccountant
              captures: { rev6_id: $.data.id }
            - call: "POST /land-admin/production-revenues/${rev6_id}/release"
              payload: {}
              as: JointInterestAccountant
            - call: "POST /land-admin/wells/${well_id}/production-revenues"
              payload: { production_month: "2026-07", gross_revenue_cents: 5000000, volume_units: 6250.000, sale_date: "2026-08-04" }
              as: JointInterestAccountant
              captures: { rev7_id: $.data.id }
            - call: "POST /land-admin/production-revenues/${rev7_id}/release"
              payload: {}
              as: JointInterestAccountant
            - call: "GET /land-admin/owner-disbursements"
              payload: { revenue_id: "${rev6_id}", owner_id: "${op_id}", lease_id: "${lease1_id}" }
              as: JointInterestAccountant
              captures: { disb6_id: "$.data[0].id" }
            - call: "GET /land-admin/owner-disbursements"
              payload: { revenue_id: "${rev7_id}", owner_id: "${op_id}", lease_id: "${lease1_id}" }
              as: JointInterestAccountant
              captures: { disb7_id: "$.data[0].id" }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-08T00:00:00Z" }
              as: JointInterestAccountant
            - call: "POST /land-admin/owner-disbursements/${disb6_id}/payment"
              payload: { interest_basis: "FROM_DUE_DATE" }
              as: JointInterestAccountant
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-11-08T00:00:00Z" }
              as: JointInterestAccountant
            - call: "POST /land-admin/owner-disbursements/${disb7_id}/payment"
              payload: { interest_basis: "FROM_PROCEEDS_RECEIPT" }
              as: JointInterestAccountant
          assert:
            - "ProductionRevenue.${rev6_id}.statutory_due_date == 2026-08-29"
            - "ProductionRevenue.${rev7_id}.statutory_due_date == 2026-09-29"
            - "OwnerDisbursement.${disb6_id}.net_amount_cents == 1494109"
            - "OwnerDisbursement.${disb7_id}.net_amount_cents == 1494109"
            - "OwnerDisbursement.${disb6_id}.interest_basis == FROM_DUE_DATE"
            - "OwnerDisbursement.${disb6_id}.late_interest_cents == 19649"
            - "OwnerDisbursement.${disb7_id}.interest_basis == FROM_PROCEEDS_RECEIPT"
            - "OwnerDisbursement.${disb7_id}.late_interest_cents == 24315"
            - "OwnerDisbursement.${disb7_id}.late_interest_cents - OwnerDisbursement.${disb6_id}.late_interest_cents == 4666"
  - rule_id: combinatorial_formula
    instances:
      - name: overhead_branch_selection_with_cap_and_floor_clamps
        grounds:
          - calculations.overhead_charge
          - entities.JibStatement.fields.overhead_rate_class
          - entities.JibStatement.fields.activity_class
          - entities.JibStatement.fields.billable_months
          - state_machines.JibStatement.DRAFT_to_ISSUED
        mode: a
        distinguishing_aspect: |
          Mode a - conditional terms. Three of the four selectable branches of overhead_charge are
          exercised on the same well: FIXED_RATE x DRILLING over two billable months clamps DOWN to
          OVERHEAD_CAP_CENTS (raw 1979800 -> 1500000), FIXED_RATE x PRODUCING over one month lands
          strictly inside the band at 98990, and PERCENTAGE_BASIS on a 100000 capital pool clamps UP
          to OVERHEAD_FLOOR_CENTS (raw 5000 -> 25000). Rounding before clamping is what makes the
          middle value 98990 rather than 98990.0 truncated, and the cap/floor are shared by both
          branches rather than belonging to one of them.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-05T00:00:00Z"
            - "Leases L-001 (640.00 gross acres, royalty 0.187500, primary term ending 2026-09-30) and L-002 (320.00 gross acres, royalty 0.250000, primary term ending 2027-12-31)"
