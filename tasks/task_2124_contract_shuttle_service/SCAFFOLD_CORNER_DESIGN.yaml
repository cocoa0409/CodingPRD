              payload: { vehicle_id: "${vdg}", kind: "CORRECTIVE", service_date: "2026-09-02", window_start_min: 400, window_end_min: 500 }
              as: FleetManager
          trigger:
            - call: "POST /on-demand-requests/${oddg}/match"
              payload: { trip_id: "${tdg}" }
