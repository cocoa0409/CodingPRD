              payload: { house_number: 100, road_centerline_id: "${road_id}", side: "LEFT", source: "PARCEL", postal_city: "FORT COLLINS", cell_id: "${cell_id}", geometry_verified: true, unit_type: "UNIT", unit_id: "3B", parent_address_point_id: "${base_id}" }
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { unit_id_pk: $.data.id }
          assert:
            - "status_code == 201"
            - "AddressPoint.${unit_id_pk}.parent_address_point_id == \"${base_id}\""
            - "AddressPoint.${unit_id_pk}.unit_type == \"UNIT\" and AddressPoint.${unit_id_pk}.unit_id == \"3B\""
            - "AddressPoint.${unit_id_pk}.house_number == 100   # must equal the parent's"
            - "AddressPoint.${unit_id_pk}.status == \"PENDING\""
            - "AddressPoint.${unit_id_pk}.confidence_score == 75.00   # 70 + 12 + 8 + 0 base bonus - 15"
            - "AddressPoint.${base_id}.confidence_score == 81.00   # 70 + 12 + 8 + 6 - 15"
            - "AddressPoint.${base_id}.unit_child_count == 1"
            - "RoadCenterline.${road_id}.assignable_slot_count_left == 49   # the unit consumed no slot"

      - name: retired_point_supersede_chain_is_queryable_for_records_research
        claim_type: graph
        grounds:
          - entities.AddressPoint.fields.superseded_by_address_point_id
          - state_machines.AddressPoint.PENDING_to_RETIRED
          - endpoints.GET_/gis/address-points
        distinguishing_aspect: "The self-referential supersede edge is walkable after retirement: retiring 100 with superseded_by pointing at 102 stamps retire_reason REPLACED, and GET /gis/address-points?superseded_by_address_point_id=<102>&include_retired=true returns exactly the retired 100 point."
        test_recipe:
          setup:
            - "One jurisdiction LARCO with cell C001 and one DRAFT centerline, LEFT [100,198] EVEN."
            - "Two PARCEL base points: 100 (the address being replaced) and 102 (its successor)."
          setup_api_calls:
            - call: "POST /gis/jurisdictions"
              payload: { name: "Larimer County", code: "LARCO", jurisdiction_type: "COUNTY", postal_city: "FORT COLLINS" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
              captures: { j_id: $.data.id }
            - call: "POST /gis/coverage-cells"
              payload: { cell_code: "C001", jurisdiction_id: "${j_id}" }
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { cell_id: $.data.id }
            - call: "POST /gis/road-centerlines"
              payload: { primary_name: "N MAPLE STREET", jurisdiction_id: "${j_id}", from_addr_left: 100, to_addr_left: 198, parity_left: "EVEN", from_addr_right: 101, to_addr_right: 199, parity_right: "ODD" }
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { road_id: $.data.id }
            - call: "POST /gis/address-points"
              payload: { house_number: 100, road_centerline_id: "${road_id}", side: "LEFT", source: "PARCEL", postal_city: "FORT COLLINS", cell_id: "${cell_id}", geometry_verified: true }
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { old_id: $.data.id }
            - call: "POST /gis/address-points"
              payload: { house_number: 102, road_centerline_id: "${road_id}", side: "LEFT", source: "PARCEL", postal_city: "FORT COLLINS", cell_id: "${cell_id}", geometry_verified: true }
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { new_id: $.data.id }
          trigger:
            - call: "POST /gis/address-points/${old_id}/retire"
              payload: { retire_reason: "REPLACED", superseded_by_address_point_id: "${new_id}" }
              as: GisAnalyst
              as_user_id: "analyst-1"
            - call: "GET /gis/address-points"
              payload: { superseded_by_address_point_id: "${new_id}", include_retired: true }
              as: GisAnalyst
              as_user_id: "analyst-1"
          assert:
            - "the retire call returns status_code 200"
            - "AddressPoint.${old_id}.status == \"RETIRED\""
            - "AddressPoint.${old_id}.retire_reason == \"REPLACED\"   # a successor was supplied"
            - "AddressPoint.${old_id}.superseded_by_address_point_id == \"${new_id}\""
            - "AddressPoint.${old_id}.retired_at == \"2026-08-01T00:00:00.000Z\""
            - "AddressPoint.${new_id}.status == \"PENDING\"   # the successor is untouched"
            - "the supersede query returns meta.total_count == 1 and data[0].id == \"${old_id}\""
            - "RoadCenterline.${road_id}.assignable_slot_count_left == 49   # 100 released its slot, 102 still holds one"

  # =========================================================================
  # SECTION: state_machines  (guide Table 2 + shape row `cyclic` + side-effect
  # pattern rows)
  # =========================================================================
  - section: state_machines
    instances:
      - name: validate_draft_road_promotes_and_refreshes_point_confidence
        claim_type: valid_transition
        grounds:
          - state_machines.RoadCenterline.DRAFT_to_VALIDATED
          - cascade_rules.CONFIDENCE_REFRESH
          - calculations.address_point_confidence_score.provisional
        distinguishing_aspect: "POST /gis/road-centerlines/{id}/validate moves DRAFT -> VALIDATED, clears qc_dirty, bumps the road to version 2, and re-scores every non-terminal point on it as the ROAD_STATUS_PENALTY drops 15 -> 5 (81.00 -> 91.00, point version 2)."
        test_recipe:
          setup:
            - "One jurisdiction LARCO (postal_city FORT COLLINS) with cell C001."
            - "One DRAFT centerline \"N MAPLE STREET\", LEFT [100,198] EVEN, RIGHT [101,199] ODD."
            - "One PARCEL base point at 100 LEFT, geometry_verified true, postal_city FORT COLLINS -> confidence 81.00 at version 1."
          setup_api_calls:
            - call: "POST /gis/jurisdictions"
              payload: { name: "Larimer County", code: "LARCO", jurisdiction_type: "COUNTY", postal_city: "FORT COLLINS" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
              captures: { j_id: $.data.id }
            - call: "POST /gis/coverage-cells"
              payload: { cell_code: "C001", jurisdiction_id: "${j_id}" }
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { cell_id: $.data.id }
            - call: "POST /gis/road-centerlines"
              payload: { primary_name: "N MAPLE STREET", jurisdiction_id: "${j_id}", from_addr_left: 100, to_addr_left: 198, parity_left: "EVEN", from_addr_right: 101, to_addr_right: 199, parity_right: "ODD" }
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { road_id: $.data.id }
            - call: "POST /gis/address-points"
              payload: { house_number: 100, road_centerline_id: "${road_id}", side: "LEFT", source: "PARCEL", postal_city: "FORT COLLINS", cell_id: "${cell_id}", geometry_verified: true }
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { pt_id: $.data.id }
          trigger:
            - call: "POST /gis/road-centerlines/${road_id}/validate"
              payload: {}
              as: GisAnalyst
              as_user_id: "analyst-1"
          assert:
            - "status_code == 200"
            - "RoadCenterline.${road_id}.status == \"VALIDATED\""
            - "RoadCenterline.${road_id}.qc_dirty == false"
            - "RoadCenterline.${road_id}.version == 2   # create 1, validate +1"
            - "AddressPoint.${pt_id}.confidence_score == 91.00   # 70 + 12 + 8 + 6 - 5"
            - "AddressPoint.${pt_id}.confidence_basis == \"PROVISIONAL\""
            - "AddressPoint.${pt_id}.certified_confidence_score == null"
            - "AddressPoint.${pt_id}.version == 2   # CONFIDENCE_REFRESH bumped it"
            - "AddressPoint.${pt_id}.status == \"PENDING\"   # validation does not activate points"

      - name: certify_report_with_open_blocking_defect_rejected
        claim_type: precondition_enforcement
        grounds:
          - state_machines.QcValidationReport.GENERATED_to_CERTIFIED
          - validations[priority=25]
          - errors.ERR_QC_BLOCKING_DEFECTS_OPEN
        distinguishing_aspect: "A ROAD-scoped report on a DRAFT road with no addresses carries exactly three defects (ROAD_UNVALIDATED BLOCKING, ROAD_QC_DIRTY WARNING, ROAD_NO_ADDRESSES INFO) for quality_score 94.60 / advisory 96.25, and certify is refused 409 ERR_QC_BLOCKING_DEFECTS_OPEN while the single BLOCKING defect is still OPEN."
        test_recipe:
          setup:
            - "One jurisdiction LARCO."
            - "One DRAFT centerline whose primary_name is already normalized (\"N MAPLE STREET\") and which has zero address points."
            - "One ROAD-scoped QC report generated by analyst-1 over that centerline."
          setup_api_calls:
            - call: "POST /gis/jurisdictions"
              payload: { name: "Larimer County", code: "LARCO", jurisdiction_type: "COUNTY", postal_city: "FORT COLLINS" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
              captures: { j_id: $.data.id }
            - call: "POST /gis/road-centerlines"
              payload: { primary_name: "N MAPLE STREET", jurisdiction_id: "${j_id}", from_addr_left: 100, to_addr_left: 198, parity_left: "EVEN", from_addr_right: 101, to_addr_right: 199, parity_right: "ODD" }
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { road_id: $.data.id }
            - call: "POST /gis/qc-validation-reports"
              payload: { scope: "ROAD", road_centerline_id: "${road_id}" }
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { rep_id: $.data.id }
          trigger:
            - call: "POST /gis/qc-validation-reports/${rep_id}/certify"
              payload: {}
              as: QcCertifier
              as_user_id: "qc-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "status_code == 409"
            - "${err_id} == \"ERR_QC_BLOCKING_DEFECTS_OPEN\""
            - "QcValidationReport.${rep_id}.defect_count == 3"
            - "QcValidationReport.${rep_id}.blocking_defect_count == 1   # ROAD_UNVALIDATED"
            - "QcValidationReport.${rep_id}.warning_defect_count == 1   # ROAD_QC_DIRTY"
            - "QcValidationReport.${rep_id}.info_defect_count == 1      # ROAD_NO_ADDRESSES"
            - "QcValidationReport.${rep_id}.open_blocking_defect_count == 1"
            - "QcValidationReport.${rep_id}.quality_score == 94.60   # 45.00 + 0.30*(100-18.0)=24.60 + 25.00"
            - "QcValidationReport.${rep_id}.advisory_quality_score == 96.25   # 45.00 + 0.30*87.5=26.25 + 25.00"
            - "QcValidationReport.${rep_id}.quality_tier == \"B\""
            - "QcValidationReport.${rep_id}.provisioning_eligibility_score == 94.60"
            - "QcValidationReport.${rep_id}.is_provisioning_eligible == false   # open_blocking_defect_count != 0"
            - "QcValidationReport.${rep_id}.status == \"GENERATED\" and certified_at == null and certified_by_user_id == null"
            - "QcValidationReport.${rep_id}.version == 1   # the refused certify did not bump it"

      - name: activate_boundary_twice_rejected
        claim_type: idempotency
        grounds:
          - state_machines.EmergencyServiceBoundary.PROPOSED_to_ACTIVE
          - validations[priority=7]
          - errors.ERR_BOUNDARY_INVALID_STATE
        distinguishing_aspect: "Idempotency is NOT granted: the second POST /gis/emergency-service-boundaries/{id}/activate on an already-ACTIVE boundary returns 409 ERR_BOUNDARY_INVALID_STATE rather than a second 200, and the cell's active_assignment_count stays at 1 instead of doubling."
        test_recipe:
          setup:
            - "One jurisdiction LARCO with cell C001 and one ACTIVE LAW agency."
            - "One boundary owned by that agency holding one open-ended cell claim on C001, proposed and then activated."
          setup_api_calls:
            - call: "POST /gis/jurisdictions"
              payload: { name: "Larimer County", code: "LARCO", jurisdiction_type: "COUNTY", postal_city: "FORT COLLINS" }
