              captures: { o1: $.data.id }
            - call: "POST /grazing/range-consultants"
              payload: { full_name: "Dana Reyes", certification_number: "RC-1102", state_code: "MT" }
              as: PlatformAdmin
              captures: { c1: $.data.id }
