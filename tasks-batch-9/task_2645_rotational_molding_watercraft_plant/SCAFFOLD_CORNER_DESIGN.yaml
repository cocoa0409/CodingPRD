        distinguishing_aspect: "One mark-down on a station carrying two cycles reaches exactly one of them: the SCHEDULED cycle goes ABORTED/STATION_DOWN and gives its 24.000 kg back to available_kg, while the OVEN_RUNNING cycle on the sibling arm is not touched and its already-CONSUMED 24.000 kg is never refunded — the cascade is scoped to non-terminal, not-yet-started children."
        test_recipe:
          setup:
            - "Station OVN-SM-CSD has arm_count 2, so CYC-A on arm 1 and CYC-B on arm 2 share identical windows (oven 09:00-10:00, cooling 10:00-10:30) without an arm conflict; cooling bay BAY-SM-CSD has concurrent_slot_capacity 2 so both fit the closed cooling interval."
