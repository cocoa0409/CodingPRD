          assert:
            - "HTTP 404 with data.error_id == ERR_BRIDGE_NOT_FOUND"
            - "data.error_id is NOT ERR_PERSONNEL_NOT_FOUND, even though team_leader_id is equally unresolvable"
            - "GET /inspections returns total_count == 0"
            - "The same call against the real ${br_id} with the same bogus team_leader_id returns 404 ERR_PERSONNEL_NOT_FOUND, isolating the ordering effect"

      - name: cycle_state_check_precedes_budget_check
        excluded_because:
          difficulty_instance: cycle_state_beats_budget_exceeded
          rationale: "The priority 10 vs priority 33 pair - a LOCKED cycle plus an over-budget candidate returning ERR_PROGRAM_STATE_INVALID rather than ERR_BUDGET_EXCEEDED, and the reversal after reopen - is the whole subject of that priority_pair_validation_conflict instance."

      - name: team_leader_qualification_precedes_element_quantity_check
        excluded_because:
          difficulty_instance: team_leader_qualification_beats_element_quantity_mismatch
          rationale: "The priority 13 vs priority 19 pair on POST /inspections/{id}/submit, including the flip to ERR_ELEMENT_QUANTITY_MISMATCH once the refresher is renewed, is asserted there."

  # ===========================================================================
  # §1.5 declares no bulk-mutation endpoint (no /batch, no array-bodied write),
  # so the guide's "Bulk action" row has no surface to probe in this domain and
  # is deliberately absent rather than stubbed.
  - section: endpoints
    instances:
      - name: element_condition_create_read_update_delete_round_trip
        claim_type: standard_crud
        grounds:
          - endpoints.POST_inspections_id_element_conditions
          - endpoints.GET_element_conditions_id
          - endpoints.PUT_element_conditions_id
          - endpoints.DELETE_element_conditions_id
        distinguishing_aspect: "The one entity with a full CRUD surface round-trips end to end: create returns EHI 40.00, GET echoes it, PUT to 100/100/50/50 recomputes it to 66.67 and re-rolls the parent totals, and DELETE removes the row and rolls the parent totals back to the single remaining DECK line."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z; Ivy Inspector leads a DRAFT ROUTINE inspection of Cedar Creek Bridge holding one DECK row (1000: 600/200/150/50, 6 photos)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /personnel"
              payload: { full_name: "Ivy Inspector", agency: "STATE_DOT", nbis_refresher_expiry_date: "2027-06-30", team_leader_certified: true }
              as: ProgramAdmin
              captures: { insp_id: $.data.id }
            - call: "POST /bridges"
              payload: { nbi_structure_number: "STR-000001", name: "Cedar Creek Bridge", owner_agency: "STATE_DOT", structure_type: "STEEL_GIRDER", deck_area_sqm: 1000, year_built: 1972, adt: 12000, detour_length_km: 8.5, spans_water: true }
              as: ProgramAdmin
              captures: { br_id: $.data.id }
            - call: "POST /bridges/${br_id}/inspections"
              payload: { inspection_type: "ROUTINE", team_leader_id: "${insp_id}", field_window_start: "2026-09-02T08:00:00Z", field_window_end: "2026-09-02T16:00:00Z" }
              as: BridgeInspector
              as_user_id: "${insp_id}"
              captures: { ins_id: $.data.id }
            - call: "POST /inspections/${ins_id}/element-conditions"
              payload: { element_key: "DECK", element_group: "DECK_GROUP", unit: "SQM", total_quantity: 1000, cs1_qty: 600, cs2_qty: 200, cs3_qty: 150, cs4_qty: 50, photo_count: 6, defect_notes: "Spalling and delamination in bay 3" }
              as: BridgeInspector
              as_user_id: "${insp_id}"
              captures: { ec_deck_id: $.data.id }
          trigger:
            - call: "POST /inspections/${ins_id}/element-conditions"
              payload: { element_key: "GIRDER", element_group: "SUPERSTRUCTURE", unit: "M", total_quantity: 300, cs1_qty: 0, cs2_qty: 100, cs3_qty: 100, cs4_qty: 100, photo_count: 8, defect_notes: "Section loss at girder 2 web" }
              as: BridgeInspector
              as_user_id: "${insp_id}"
              captures: { ec_girder_id: $.data.id }
            - call: "GET /element-conditions/${ec_girder_id}"
              payload: {}
              as: QaReviewer
              captures: { read_ehi: $.data.element_health_index }
            - call: "PUT /element-conditions/${ec_girder_id}"
              payload: { total_quantity: 300, cs1_qty: 100, cs2_qty: 100, cs3_qty: 50, cs4_qty: 50, photo_count: 8, defect_notes: "Section loss re-measured after cleaning" }
              as: BridgeInspector
              as_user_id: "${insp_id}"
              captures: { put_ehi: $.data.element_health_index }
            - call: "DELETE /element-conditions/${ec_girder_id}"
              payload: {}
              as: BridgeInspector
              as_user_id: "${insp_id}"
          assert:
            - "Create returns 201 with ElementCondition.${ec_girder_id}.element_health_index == 40.00, reported_sum == 300, balanced == true, deficient_quantity == 200, element_group == SUPERSTRUCTURE"
            - "The GET returns 200 with element_health_index 40.00 and version 1, readable by a QaReviewer under the shared-GET grant"
            - "The PUT returns 200 with element_health_index == 66.67 (100*(100 + 80 + 20 + 0)/300 = 66.6666...), deficient_quantity == 100, defect_notes updated, version == 2"
            - "After the PUT, Inspection.${ins_id}.element_count == 2, reported_quantity_total == 1300, deficient_quantity_total == 300, photo_count_total == 14"
            - "The DELETE returns 204 with an empty body, and GET /element-conditions/${ec_girder_id} then returns 404 ERR_INSPECTION_RECORD_NOT_FOUND"
            - "After the DELETE, Inspection.${ins_id}.element_count == 1, reported_quantity_total == 1000, deficient_quantity_total == 200, photo_count_total == 6 - the DECK row is untouched"
            - "Bridge.${br_id}.version is still 1 and inventoried_quantity_total is still 0 across all four calls"

      - name: permit_analyze_action_materialises_one_row_per_route_bridge
        claim_type: action_endpoint
        grounds:
          - endpoints.POST_permit_applications_id_analyze
          - state_machines.PermitApplication.RECEIVED_to_ANALYZED
          - calculations.permit_rating_factor
          - calculations.permit_recommended_decision
        distinguishing_aspect: "Analyze is a fan-out action: two route bridges with no APPROVED rating each get a PermitBridgeAnalysis row with rating_factor_permit null, analysis_result DENIED and result_reason NO_APPROVED_RATING, the application aggregates to recommended_decision DENY with governing_analysis_min_rf null, and a second analyze is refused by the RECEIVED-only precondition."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z; two bridges, neither ever load-rated, both service_posture OPEN."
            - "One RECEIVED permit for axles [10.0, 10.0, 10.0, 6.0] (gross 36.0 t) routed over both bridges."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /bridges"
              payload: { nbi_structure_number: "STR-000001", name: "Cedar Creek Bridge", owner_agency: "STATE_DOT", structure_type: "STEEL_GIRDER", deck_area_sqm: 1000, year_built: 1972, adt: 12000, detour_length_km: 8.5, spans_water: true }
              as: ProgramAdmin
              captures: { br1_id: $.data.id }
            - call: "POST /bridges"
              payload: { nbi_structure_number: "STR-000002", name: "Willow Slough Bridge", owner_agency: "STATE_DOT", structure_type: "CONCRETE_BOX", deck_area_sqm: 600, year_built: 1988, adt: 3000, detour_length_km: 2.0 }
              as: ProgramAdmin
              captures: { br2_id: $.data.id }
            - call: "POST /permit-applications"
              payload: { permit_number: "OW-2026-0012", carrier_name: "Northline Heavy Haul", axle_loads_tons: [10.0, 10.0, 10.0, 6.0], route_bridge_ids: ["${br1_id}", "${br2_id}"], speed_category: "NORMAL" }
              as: PermitOfficer
              captures: { pa_id: $.data.id }
          trigger:
            - call: "POST /permit-applications/${pa_id}/analyze"
              payload: {}
              as: PermitOfficer
              captures: { pa_status: $.data.status }
          assert:
            - "HTTP 200; PermitApplication.${pa_id}.status == ANALYZED with axle_count == 4 and gross_weight_tons == 36.0"
            - "GET /permit-bridge-analyses?permit_application_id=${pa_id} returns exactly 2 rows with total_count == 2, one for ${br1_id} and one for ${br2_id}"
            - "Both rows report governing_load_rating_id == null, rating_factor_permit == null, permit_live_load_kn_m == null, analysis_result == DENIED and result_reason == NO_APPROVED_RATING"
            - "PermitApplication.${pa_id}.recommended_decision == DENY and governing_analysis_min_rf == null (no row contributed a factor)"
            - "PermitApplication.${pa_id}.decided_at == null and revoked_at == null"
            - "A second POST /permit-applications/${pa_id}/analyze returns 409 ERR_PERMIT_STATE_INVALID and does not duplicate the analysis rows - GET still reports total_count == 2"

      - name: permit_route_array_links_each_entry_including_repeats
        claim_type: cross_reference_link
        grounds:
          - entities.PermitBridgeAnalysis
          - entities.PermitApplication.fields.route_bridge_ids
          - calculations.permit_recommended_decision
        distinguishing_aspect: "PermitBridgeAnalysis is the many-to-many junction of the graph topology: a route that crosses the same bridge twice materialises TWO rows for it (three rows in total) with sequence_index following route order, and both point at the same bridge_id."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z; two bridges; one RECEIVED permit whose route is [A, B, A] - an out-and-back move that recrosses bridge A."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /bridges"
              payload: { nbi_structure_number: "STR-000001", name: "Cedar Creek Bridge", owner_agency: "STATE_DOT", structure_type: "STEEL_GIRDER", deck_area_sqm: 1000, year_built: 1972, adt: 12000, detour_length_km: 8.5, spans_water: true }
              as: ProgramAdmin
              captures: { br1_id: $.data.id }
            - call: "POST /bridges"
              payload: { nbi_structure_number: "STR-000002", name: "Willow Slough Bridge", owner_agency: "STATE_DOT", structure_type: "CONCRETE_BOX", deck_area_sqm: 600, year_built: 1988, adt: 3000, detour_length_km: 2.0 }
