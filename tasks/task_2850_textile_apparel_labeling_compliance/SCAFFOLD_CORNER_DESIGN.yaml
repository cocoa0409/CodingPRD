            - "Create at the pre-append version: HTTP 412 and ${e_stale} == \"ERR_STALE_STYLE_VERSION\", not a 422 from the graph-sufficiency gate at priority 87"
            - "Create at the current version: HTTP 201 with ${od_state} == \"DRAFT\", ${od_nodes} == 2, ${od_st} == \"VN\" and ${od_yf} == \"IN\""
            - "GET /labeling/styles/${style_id}/origin-determinations returns total_count == 1 - the refused create left no row behind"

