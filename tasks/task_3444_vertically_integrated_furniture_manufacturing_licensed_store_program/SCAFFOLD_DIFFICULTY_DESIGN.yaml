            - call: "GET /api/retail-accounts/${r1}"
              payload: {}
              as: PlatformAdmin
              captures: { r1_used_pre: $.data.credit_used_cents }
          trigger:
            - call: "POST /api/product-lines/${pl1}/advance"
              payload: {}
              as: PlatformAdmin
              captures: { lc_mid: $.data.lifecycle }
            - call: "GET /api/retail-accounts/${r1}"
              payload: {}
              as: PlatformAdmin
              captures: { r1_used_mid: $.data.credit_used_cents }
            - call: "POST /api/product-lines/${pl1}/advance"
              payload: {}
              as: PlatformAdmin
