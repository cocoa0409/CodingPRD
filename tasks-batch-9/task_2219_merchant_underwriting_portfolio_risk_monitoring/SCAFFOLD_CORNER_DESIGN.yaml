        claim_type: temporal_validation
        excluded_because:
          difficulty_instance: remediation_windows_half_open_touching_allowed_overlap_rejected
          rationale: "The half-open overlap semantics of priority 39, with a touching window accepted and a one-day overlap rejected, are the subject of that §1.8 instance."
      - name: appeal_requires_an_executed_decision
