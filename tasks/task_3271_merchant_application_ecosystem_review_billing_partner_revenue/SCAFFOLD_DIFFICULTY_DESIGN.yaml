          setup:
            - "App a13 LISTED; its published version v13 has scope requests sr_a APPROVED (read_products) and sr_b PENDING-DENIED... precisely: sr_b is DENIED at decide time, so NOT all approved — installation inst13 stays PENDING_CONSENT"
