        captures:
          rp1: $.data.id
      - call: POST /productions/${pr}/convert-royalties-to-pool
        payload: {}
        as: LeadProducer
      - call: POST /productions/${pr}/open-offering
        payload: {}
        as: SyndicationCounsel
      - call: POST /offering-documents
        payload:
          production_id: ${pr}
