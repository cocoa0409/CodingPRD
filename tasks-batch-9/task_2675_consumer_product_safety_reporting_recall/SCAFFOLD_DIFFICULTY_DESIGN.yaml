  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: penalty_negotiation_cycles_offer_made_countered_then_reopens_without_rewinding_round
        grounds:
          - state_machines.CivilPenaltyCase
          - entities.CivilPenaltyCase.fields.current_offer_round
          - entities.CivilPenaltyCase.fields.current_offer_cents
          - entities.CivilPenaltyCase.fields.current_offer_by
          - entities.CivilPenaltyCase.fields.reserved_cents
          - entities.CivilPenaltyCase.fields.available_cents
          - validations[31].ERR_NEGOTIATION_ROUNDS_EXHAUSTED
        distinguishing_aspect: |
          The CivilPenaltyCase machine is a genuine cycle: OFFER_MADE -> COUNTERED
          -> OFFER_MADE traverses the same pair of states repeatedly, and
          OFFER_MADE -> ASSESSMENT_OPEN (withdrawal) RE-ENTERS the initial state
          from downstream, so ASSESSMENT_OPEN is reachable both as an initial state
          and as a revisited state. The monotone counter is what proves the loop is
          not a naive rewind: current_offer_round advances to 5 across the five
          recorded offers and STAYS at 5 after withdrawal, even though the state
          returns to where it began, so the negotiation budget is consumed
          irreversibly while the reservation is fully released.
        test_recipe:
          setup:
            - "a CivilPenaltyCase in ASSESSMENT_OPEN with assessed_penalty_cents 5500000"
            - "three AGENCY offers interleaved with two RESPONDENT counters, leaving the case in OFFER_MADE at current_offer_round 5 (the cap is MAX_OFFER_ROUNDS 6)"
