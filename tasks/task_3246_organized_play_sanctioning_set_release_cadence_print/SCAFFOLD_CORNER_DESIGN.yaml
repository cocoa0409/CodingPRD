            - call: "POST /op/product-configurations/${cfg_id}/transition"
              payload: { action: "INCREASE_REPRINT_RUN", additional_units: 60 }
              as: OpsAdmin
          assert:
            - "ProductConfiguration.${cfg_id}.units_available == 100 and units_allocated == 10 and print_run_units == 110"
            - "AllocationOrder.${ord_id}.status == APPROVED and fulfilled_qty == 10"
            - "ProductConfiguration.${cfg_id}.version advanced past ${cfg_v} after the approval"
            - "the configuration reports configuration_kind DRAFT_BOOSTER and pack_count 6 unchanged"

