              as: ComplianceLead
              as_user_id: "cl-1"
              captures: { eng: $.data.id }
            - call: "POST /soc/subservice-organizations"
              payload: { engagement_id: "${eng}", name: "SS-A", services_provided: "Primary hosting", coverage_start: "2026-09-01T00:00:00.000Z", coverage_end: "2026-09-30T00:00:00.000Z" }
              as: ComplianceLead
              as_user_id: "cl-1"
              captures: { ss_a: $.data.id }
            - call: "POST /soc/subservice-organizations"
              payload: { engagement_id: "${eng}", name: "SS-B", services_provided: "Failover hosting", coverage_start: "2026-10-01T00:00:00.000Z", coverage_end: "2026-10-31T00:00:00.000Z" }
              as: ComplianceLead
