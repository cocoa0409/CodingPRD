            - "Prescription.${rx_id}.clinical_status is still DRAFT and SigningSession.${ss_id}.session_status is still OPEN"
            - "the dependency is on DirectoryEndpoint.${ep_id}.status: promoting the participant to CERTIFIED would move that endpoint to ACTIVE and the identical sign call would then succeed"

      - name: consent_scope_gates_medication_history_batch
        grounds:
          - state_machines.MedicationHistoryBatch.transitions.PENDING_to_AGGREGATING
          - state_machines.MedicationHistoryBatch.transitions.AGGREGATING_to_FAILED
          - entities.PatientConsent.fields.scope
          - entities.MedicationHistoryBatch.fields.consent_version_snapshot
          - errors[ERR_CONSENT_REQUIRED]
        distinguishing_aspect: "The MedicationHistoryBatch→PatientConsent pair: the batch's PENDING→AGGREGATING move depends on an ACTIVE consent whose scope is MEDICATION_HISTORY or BOTH, so a BENEFIT_CHECK-only consent blocks aggregation outright while a BOTH-scope consent that is revoked mid-flight pushes the batch to FAILED instead."
