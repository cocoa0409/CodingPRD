      - name: months_in_service_floors_on_thirty_day_units
        claim_type: correct_result
        grounds:
          - calculations.unit_months_in_service
          - entities.HeaterUnit.fields.months_in_service
          - entities.HeaterUnit.fields.shipped_at
          - consistency_model
        distinguishing_aspect: >
          SERVICE_MONTH_DAYS is 30 and the result is floored, never rounded: one minute before the 30-day mark
          the unit is still at 0 months and exactly at the mark it becomes 1. A calendar-month implementation
          would report 1 on 2026-09-04T05:59:00Z (a month and a day after shipping) and a rounding implementation
