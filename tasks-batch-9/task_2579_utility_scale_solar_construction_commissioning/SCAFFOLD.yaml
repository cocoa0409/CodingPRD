# ---------------------------------------------------------------------------
# §1.7 RBAC Table
# ---------------------------------------------------------------------------
roles:
  - name: EpcProjectManager
    identity: opaque
    exclusive_operations:
      - "POST /solar/projects"
      - "POST /solar/projects/{project_id}/blocks"
      - "POST /solar/projects/{project_id}/change-orders"
      - "POST /solar/projects/{project_id}/milestone-claims"
    shared_operations: ["every GET endpoint", "POST /_clock/set_current_utc"]
    description: "Contractor-side owner of the project record, scope changes and milestone claims. Files claims but never certifies them."
  - name: CivilSuperintendent
    identity: opaque
    exclusive_operations:
      - "POST /solar/projects/{project_id}/grading-areas"
      - "POST /solar/grading-areas/{grading_area_id}/earthwork-logs"
      - "POST /solar/grading-areas/{grading_area_id}/site-events"
    shared_operations: ["every GET endpoint", "POST /_clock/set_current_utc"]
    description: "Runs grading, drainage and access roads under the stormwater permit; logs rain events, BMP inspections and permit suspensions."
  - name: ProcurementCoordinator
    identity: opaque
    exclusive_operations:
      - "POST /solar/projects/{project_id}/yard-zones"
      - "POST /solar/deliveries"
      - "POST /solar/deliveries/{delivery_id}/receipt"
      - "POST /solar/deliveries/{delivery_id}/cancellation"
    shared_operations: ["every GET endpoint", "POST /_clock/set_current_utc"]
    description: "Sequences module, tracker and inverter deliveries and manages laydown yard occupancy."
  - name: InstallationForeman
    identity: opaque
    exclusive_operations:
      - "POST /solar/blocks/{block_id}/piles"
      - "POST /solar/piles/{pile_id}/drive-results"
      - "POST /solar/piles/{pile_id}/remediations"
      - "POST /solar/blocks/{block_id}/mechanical-completion"
      - "POST /solar/blocks/{block_id}/string-circuits"
      - "POST /solar/string-circuits/{circuit_id}/wiring"
      - "POST /solar/string-circuits/{circuit_id}/test-results"
      - "POST /solar/punch-list-items/{item_id}/closure-submissions"
    shared_operations: ["every GET endpoint", "POST /_clock/set_current_utc"]
    description: "Drives piles, installs racking and modules, wires and tests strings, and submits punch list closure evidence. Submits closures but never decides them."
  - name: UtilityCoordinator
    identity: opaque
    exclusive_operations:
      - "POST /solar/projects/{project_id}/substations"
      - "POST /solar/substations/{substation_id}/status-advances"
      - "POST /solar/substations/{substation_id}/outage-windows"
      - "POST /solar/outage-windows/{window_id}/utility-response"
    shared_operations: ["every GET endpoint", "POST /_clock/set_current_utc"]
    description: "Builds the substation and interconnection facility and coordinates switching outages with the utility."
  - name: CommissioningEngineer
    identity: opaque
    exclusive_operations:
      - "POST /solar/commissioning-tests"
      - "POST /solar/commissioning-tests/{test_id}/intervals"
      - "POST /solar/commissioning-tests/{test_id}/finalization"
    shared_operations: ["every GET endpoint", "POST /_clock/set_current_utc"]
    description: "Runs capacity and performance-ratio testing and finalizes results."
  - name: OwnerEngineer
    identity: opaque
    exclusive_operations:
      - "POST /solar/grading-areas/{grading_area_id}/acceptance"
      - "POST /solar/projects/{project_id}/punch-list-items"
      - "POST /solar/punch-list-items/{item_id}/closure-decisions"
      - "POST /solar/projects/{project_id}/milestone-decisions"
    shared_operations: ["every GET endpoint", "POST /_clock/set_current_utc"]
    description: "Owner's representative: accepts civil work, raises punch list items, decides closures and certifies or rejects milestone claims. Decides but never submits."
  - name: LaborComplianceOfficer
    identity: opaque
    exclusive_operations:
      - "POST /solar/projects/{project_id}/payroll-weeks"
      - "POST /solar/payroll-weeks/{week_id}/labor-entries"
      - "POST /solar/labor-entries/{entry_id}/void"
      - "POST /solar/payroll-weeks/{week_id}/certification"
      - "POST /solar/projects/{project_id}/labor-compliance-runs"
    shared_operations: ["every GET endpoint", "POST /_clock/set_current_utc"]
    description: "Maintains certified payroll, prevailing wage and apprenticeship compliance feeding tax-credit qualification. A user who posted entries in a week may not certify that week."
