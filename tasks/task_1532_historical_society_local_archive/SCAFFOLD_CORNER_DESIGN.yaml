            - { call: "POST /storage-zones/${z}/readings", payload: { recorded_at: "2026-08-01T10:00:00Z", temperature_c: 20.0, humidity_pct: 50.0 }, as: SystemAdmin }
            - { call: "POST /storage-zones/${z}/readings", payload: { recorded_at: "2026-08-01T11:00:00Z", temperature_c: 20.0, humidity_pct: 50.0 }, as: SystemAdmin }
            - { call: "POST /storage-zones/${z}/readings", payload: { recorded_at: "2026-08-01T12:00:00Z", temperature_c: 20.0, humidity_pct: 50.0 }, as: SystemAdmin, captures: { pr2: $.data.posture } }
            - { call: "GET /items/${i}", as: Archivist, captures: { ist2: $.data.status } }
            - { call: "GET /reading-room-appointments/${ap}", as: ReadingRoomStaff, captures: { ast: $.data.status } }
          assert:
            - "after 3 breaches: posture RESTRICTED (${p3}); after 6: CLOSED (${p6}) with breach_streak == 6 (${k6})"
            - "after first 3 clean readings: posture == RESTRICTED (${pr1}) — CLOSED recovers one level only; item still ZONE_HOLD (${ist1})"
            - "after second 3 clean readings: posture == OPEN (${pr2}); item back AVAILABLE (${ist2})"
            - "appointment stays NEEDS_RESCHEDULE (${ast}) — the recovery cascade deliberately does not restore appointments"

  # ===========================================================================
  - section: validations
    instances:
      - name: missing_auth_header_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=1]
          - errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]
        distinguishing_aspect: "A call without X-User-ID/X-User-Role headers fails with ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (400) before role checks."
        test_recipe:
          setup: ["none"]
          setup_api_calls: []
          trigger:
            - { call: "POST /storage-zones", payload: { zone_code: "Z1", name: "Vault A" }, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (${err}); http 400; no resource created"

      - name: input_shape_precedes_existence
        claim_type: priority_ordering
        grounds:
          - validations[priority=3]
          - validations[priority=4]
          - errors[ERR_TOO_MANY_ITEMS]
        distinguishing_aspect: "Request-shape validation (priority 3) precedes body-id existence (priority 4): an 11-element item_ids array of random UUIDs fails with ERR_TOO_MANY_ITEMS, never reaching per-id lookup."
        test_recipe:
          setup: ["researcher R registered"]
          setup_api_calls:
            - { call: "POST /researchers", payload: { full_name: "R. Reader", email: "r1@example.org" }, as: ReadingRoomStaff, captures: { r: $.data.id } }
          trigger:
            - { call: "POST /research-requests", payload: { item_ids: ["11111111-1111-4111-8111-111111111111", "22222222-2222-4222-8222-222222222222", "33333333-3333-4333-8333-333333333333", "44444444-4444-4444-8444-444444444444", "55555555-5555-4555-8555-555555555555", "66666666-6666-4666-8666-666666666666", "77777777-7777-4777-8777-777777777777", "88888888-8888-4888-8888-888888888888", "99999999-9999-4999-8999-999999999999", "aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa", "bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb"], topic: "t", purpose: "PERSONAL" }, as: Researcher, as_user_id: "${r}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_TOO_MANY_ITEMS (${err}) — 11 > 10; the fake UUIDs are never dereferenced"

      - name: uniqueness_constraints_enforced
        claim_type: violation_to_error
        grounds:
          - validations[priority=10]
          - errors[ERR_COLLECTION_CODE_EXISTS]
          - errors[ERR_ZONE_CODE_EXISTS]
          - errors[ERR_DUPLICATE_EMAIL]
        distinguishing_aspect: "Each unique field rejects its second use with its own error id."
        test_recipe:
          setup: ["zone Z1, collection C1, researcher r1@example.org already exist"]
          setup_api_calls:
            - { call: "POST /storage-zones", payload: { zone_code: "Z1", name: "Vault A" }, as: Registrar, captures: { z: $.data.id } }
            - { call: "POST /collections", payload: { title: "Papers", collection_code: "C1", storage_zone_id: "${z}" }, as: Registrar }
            - { call: "POST /researchers", payload: { full_name: "R. Reader", email: "r1@example.org" }, as: ReadingRoomStaff }
          trigger:
            - { call: "POST /collections", payload: { title: "Dup", collection_code: "C1", storage_zone_id: "${z}" }, as: Registrar, captures: { e1: $.data.error_id } }
            - { call: "POST /storage-zones", payload: { zone_code: "Z1", name: "Vault B" }, as: Registrar, captures: { e2: $.data.error_id } }
            - { call: "POST /researchers", payload: { full_name: "R. Other", email: "r1@example.org" }, as: ReadingRoomStaff, captures: { e3: $.data.error_id } }
          assert:
            - "duplicate collection_code: ERR_COLLECTION_CODE_EXISTS (${e1})"
            - "duplicate zone_code: ERR_ZONE_CODE_EXISTS (${e2})"
            - "duplicate email: ERR_DUPLICATE_EMAIL (${e3})"

      - name: pagination_envelope_and_defaults
        claim_type: listing
        grounds:
          - response_envelope
          - errors[ERR_INVALID_PAGINATION_PARAMETERS]
        distinguishing_aspect: "List responses carry the fixed envelope (meta, response_type array, limit/offset/total_count/has_more with defaults 10/0); limit 0 and limit 101 fail with ERR_INVALID_PAGINATION_PARAMETERS."
        test_recipe:
          setup: ["three collections exist"]
          setup_api_calls:
            - { call: "POST /storage-zones", payload: { zone_code: "Z1", name: "Vault A" }, as: Registrar, captures: { z: $.data.id } }
            - { call: "POST /collections", payload: { title: "A", collection_code: "CA", storage_zone_id: "${z}" }, as: Registrar }
            - { call: "POST /collections", payload: { title: "B", collection_code: "CB", storage_zone_id: "${z}" }, as: Registrar }
            - { call: "POST /collections", payload: { title: "C", collection_code: "CC", storage_zone_id: "${z}" }, as: Registrar }
          trigger:
            - { call: "GET /collections", as: Registrar }
            - { call: "GET /collections", payload: { limit: 2, offset: 2 }, as: Registrar }
            - { call: "GET /collections", payload: { limit: 0 }, as: Registrar, captures: { e1: $.data.error_id } }
            - { call: "GET /collections", payload: { limit: 101 }, as: Registrar, captures: { e2: $.data.error_id } }
            - { call: "GET /collections", payload: { offset: -1 }, as: Registrar, captures: { e3: $.data.error_id } }
          assert:
            - "default list: response_type == array, limit == 10, offset == 0, total_count == 3, has_more == false; meta.api_request_id present"
            - "limit 2 offset 2: returns 1 row, total_count == 3, has_more == false (offset 2 + limit 2 >= 3)"
            - "limit 0: ERR_INVALID_PAGINATION_PARAMETERS (${e1}); limit 101: same (${e2}); offset -1: same (${e3})"

      - name: request_create_requires_available_items
        claim_type: violation_to_error
        grounds:
          - validations[priority=7]
          - errors[ERR_ITEM_NOT_AVAILABLE]
        distinguishing_aspect: "A request referencing a CATALOGED (never made AVAILABLE) item fails with ERR_ITEM_NOT_AVAILABLE, reporting the first offending id in item_ids order."
        test_recipe:
          setup: ["items I1 CATALOGED and I2 PENDING_CATALOG under an ACCESSIONED accession; researcher R ACTIVE"]
          setup_api_calls:
            - { call: "POST /storage-zones", payload: { zone_code: "Z1", name: "Vault A" }, as: Registrar, captures: { z: $.data.id } }
            - { call: "POST /collections", payload: { title: "Papers", collection_code: "C1", storage_zone_id: "${z}" }, as: Registrar, captures: { c: $.data.id } }
            - { call: "POST /accessions", payload: { donor_name: "E. Stone", donor_contact: "s@example.org", accession_date: "2026-07-15", lot_appraised_value_cents: 1000 }, as: Registrar, captures: { a: $.data.id } }
            - { call: "POST /accessions/${a}/submit", as: Registrar }
            - { call: "POST /accessions/${a}/deeds", payload: {}, as: Registrar, captures: { d: $.data.id } }
            - { call: "GET /accessions/${a}", as: Registrar, captures: { av: $.data.version } }
            - { call: "POST /deeds/${d}/execute", payload: { expected_accession_version: "${av}" }, as: Registrar }
            - { call: "POST /items", payload: { accession_id: "${a}", collection_id: "${c}", title: "I1" }, as: Archivist, captures: { i1: $.data.id } }
            - { call: "POST /items", payload: { accession_id: "${a}", collection_id: "${c}", title: "I2" }, as: Archivist, captures: { i2: $.data.id } }
            - { call: "POST /items/${i1}/catalog", payload: { description: "x", condition_grade: "GOOD", appraised_value_cents: 100, format: "MAP" }, as: Archivist }
            - { call: "POST /researchers", payload: { full_name: "R. Reader", email: "r1@example.org" }, as: ReadingRoomStaff, captures: { r: $.data.id } }
          trigger:
            - { call: "POST /research-requests", payload: { item_ids: ["${i1}", "${i2}"], topic: "t", purpose: "PERSONAL" }, as: Researcher, as_user_id: "${r}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_ITEM_NOT_AVAILABLE (${err}) — I1 is CATALOGED (not AVAILABLE) and leads the array"

      - name: request_not_approved_gates_appointment
        claim_type: violation_to_error
        grounds:
          - validations[priority=7]
          - errors[ERR_REQUEST_NOT_APPROVED]
        distinguishing_aspect: "An appointment against a SUBMITTED (never reviewed) request fails with ERR_REQUEST_NOT_APPROVED."
