      - name: bowl_approval_cascades_to_conference_unit_counter_depth_three
        grounds:
          - state_machines.BowlAppearance.UNDER_REVIEW_to_APPROVED
          - state_machines.PostseasonUnit.PROVISIONAL_to_VALIDATED
