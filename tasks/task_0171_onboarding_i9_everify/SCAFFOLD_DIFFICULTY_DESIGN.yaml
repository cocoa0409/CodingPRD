# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Cross-references §1.1–§1.7 of SCAFFOLD.yaml against the nine §0.5 Difficulty Rules.
# Every instance is reachable from empty DB using only declared endpoints.
# Numeric assertions are precomputed against the calculation formulas and
# US federal holidays in 2026 (Memorial May 25, Juneteenth Jun 19, Indep Jul 3 obs,
# Labor Sep 7, Columbus Oct 12, Vet Nov 11, Thx Nov 26, Christmas Dec 25;
# and 2027: New Year Jan 1, MLK Jan 18).
# =============================================================================

scaffold_difficulty_design:

  # -----------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: section2_deadline_initial_vs_rehire
        grounds:
          - calculations.compute_section2_deadline
          - calculations.compute_section2_deadline.variants.standard_new_hire
          - calculations.compute_section2_deadline.variants.rehire_within_3_years
          - entities.Employee.fields.section2_deadline
          - state_machines.I9Form.SECTION_1_DONE_to_SECTION_2_DONE
        distinguishing_aspect: |
          Two valid algorithms on the SAME inputs produce DIFFERENT Employee.section2_deadline values:
          standard_new_hire counts 3 federal working days forward from start_date; rehire_within_3_years
          takes max(prior section2_completed_at, standard formula). The two variants are pinned by
          form_kind on the I9Form (different entity-domain branch: form lineage drives Employee deadline),
          which is a different domain than instance 2's case-status calc.
        test_recipe:
          setup:
            - "POST /_clock/advance to 2026-05-15T08:00:00.000Z."
            - "HR: POST /employees with start_date=2026-06-01, citizenship_status=US_CITIZEN (Employee A)."
            - "HR creates an INITIAL I9Form for A; Employee A attests Section 1; EmployerRep #1 signs Section 2 with valid List A passport on 2026-06-02 -> A.section2_completed_at=2026-06-02. Close out and audit."
            - "Two years later: POST /_clock/advance to 2026-07-08T08:00:00.000Z. HR PATCHes Employee A with start_date=2026-07-10 (rehire flow)."
            - "HR POSTs a new I9Form with form_kind=REHIRE, supersedes_form_id=<initial form A>."
          trigger:
            - "GET /employees/{A.id} after initial form Section 2 (before rehire) — observe section2_deadline_v1."
            - "After PATCH and new REHIRE form created, GET /employees/{A.id} — observe section2_deadline_v2."
          assert:
            - "section2_deadline_v1 == '2026-06-04T23:59:59.999Z' (standard variant: 3 federal working days after 2026-06-01)."
            - "section2_deadline_v2 == '2026-07-15T23:59:59.999Z' (rehire variant: max(prior 2026-06-02, +3wd from 2026-07-10 = 2026-07-15) = 2026-07-15)."
            - "section2_deadline_v1 != section2_deadline_v2 even though the standard formula applied to 2026-07-10 alone would also yield 2026-07-15 — proving the rehire variant pins max(...) explicitly."

      - name: tnc_close_voluntary_vs_sweep_default
        grounds:
          - state_machines.EVerifyCase.TNC_to_CLOSED_NOT_AUTHORIZED
          - calculations.compute_tnc_contest_deadline
          - calculations.derive_onboarding_status
          - entities.EVerifyCase.fields.tnc_employee_decision
          - entities.EVerifyCase.fields.final_disposition
        distinguishing_aspect: |
          On the SAME TNC case state, two valid algorithms produce the SAME final_disposition but
          DIFFERENT audit shapes and tnc_employee_decision values: voluntary NO_CONTEST writes
          tnc_employee_decision=NO_CONTEST plus AuditEvent action='CASE_CLOSED'; sweep-default
          writes tnc_employee_decision=NULL plus AuditEvent action='TNC_DEADLINE_LAPSED' preceding
          'CASE_CLOSED'. The dual variant is on EVerifyCase (case domain), structurally different from
          instance 1's Employee deadline domain.
        test_recipe:
          setup:
            - "Two parallel onboardings: build Employees B and C through Section 2 then EVerify submit; each receives TNC via POST /everify-cases/{case_id}/result with result=TNC, tnc_kind=SSA at 2026-06-15T09:00:00.000Z. Both tnc_contest_deadline computed."
          trigger:
            - "For B: Employee B POSTs /everify-cases/{caseB}/tnc-decision {decision=NO_CONTEST}."
            - "For C: POST /_clock/advance to 2026-07-01T00:00:01.000Z (past 2026-06-30 deadline); POST /_sweep/run."
          assert:
            - "caseB.tnc_employee_decision == 'NO_CONTEST' AND caseC.tnc_employee_decision IS NULL."
            - "caseB.final_disposition == 'NOT_AUTHORIZED' AND caseC.final_disposition == 'NOT_AUTHORIZED'."
            - "AuditEvents for caseB contain 'CASE_CLOSED' but NOT 'TNC_DEADLINE_LAPSED'."
            - "AuditEvents for caseC contain BOTH 'TNC_DEADLINE_LAPSED' (occurred_at < 'CASE_CLOSED' occurred_at)."
            - "Both Employees B and C: is_terminated == true and onboarding_status == 'NOT_AUTHORIZED'."

  # -----------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: section2_deadline_3_working_days_holiday_skip
        grounds:
          - calculations.compute_section2_deadline
          - entities.SystemClock.fields.federal_workdays_index
          - entities.Employee.fields.section2_deadline
        distinguishing_aspect: |
          Mode (a): non-linear formula with ≥3 inputs and CONDITIONAL branching on a calendar lookup.
          Inputs: start_date, the federal-holiday set, the day-of-week function. The while loop advances
          one calendar day at a time and decides include/skip via is_federal_working_day, so the count
          interacts non-linearly with the calendar (skipping a Friday holiday pushes the deadline to
          Wednesday of the following week, not Monday).
        test_recipe:
          setup:
            - "POST /_clock/advance to 2026-06-10T08:00:00.000Z."
            - "HR POST /employees with start_date=2026-06-19 (Juneteenth Friday, a federal holiday); citizenship_status=US_CITIZEN."
          trigger:
            - "GET /employees/{id} immediately after creation."
          assert:
            - "section2_deadline == '2026-06-24T23:59:59.999Z' (start 06-19 not counted; 06-19 holiday skipped; day1=06-22 Mon, day2=06-23 Tue, day3=06-24 Wed)."

      - name: tnc_contest_10_working_days_holiday_skip
        grounds:
          - calculations.compute_tnc_contest_deadline
          - entities.EVerifyCase.fields.tnc_contest_deadline
          - state_machines.EVerifyCase.PENDING_to_TNC
        distinguishing_aspect: |
          Mode (b)/(c) hybrid: nested temporal accumulation where evaluation order matters.
          The scaffold pins "TNC issuance day NOT counted; cursor advances calendar day FIRST,
          then is-working-day filter applies." Reversing the order (filter first, then advance)
          would shift the deadline by one day when the TNC is opened on a holiday. The instance
          tests a different metric (case-level deadline) than instance 1's employee deadline,
          fulfilling §0.5's "different modes" requirement (a vs b/c).
        test_recipe:
          setup:
            - "Build Employee D through Section 2 done. POST /_clock/advance to 2026-06-15T09:00:00.000Z."
            - "POST /employees/{D.id}/everify-cases with new idempotency_key, case enters PENDING."
            - "POST /everify-cases/{caseD.id}/result {result=TNC, tnc_kind=DHS} at 2026-06-15T09:00:00.000Z."
          trigger:
            - "GET /everify-cases/{caseD.id}."
          assert:
            - "tnc_opened_at == '2026-06-15T09:00:00.000Z'."
            - "tnc_contest_deadline == '2026-06-30T23:59:59.999Z' (skipping Juneteenth 2026-06-19 across the 10-working-day window: 6/16,6/17,6/18,(skip 6/19),6/22,6/23,6/24,6/25,6/26,6/29,6/30 = 10th working day)."

  # -----------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: everify_case_tnc_branching_with_cycle
        grounds:
          - state_machines.EVerifyCase
          - state_machines.EVerifyCase.PENDING_to_TNC
          - state_machines.EVerifyCase.TNC_to_PENDING
          - state_machines.EVerifyCase.TNC_to_CLOSED_NOT_AUTHORIZED
        distinguishing_aspect: |
          EVerifyCase is a BRANCHING-with-CYCLE machine: PENDING forks into {EMPLOYMENT_AUTHORIZED, TNC, FNC},
          and the TNC branch loops back to PENDING via CONTEST. The cycle (PENDING -> TNC -> PENDING) is a
          true non-linear feature distinct from instance 2's I9Form branching. Different entity than I9Form.
        test_recipe:
          setup:
            - "Build Employee E through Section 2 done. POST /employees/{E.id}/everify-cases — caseE PENDING."
            - "POST /everify-cases/{caseE.id}/result {result=TNC, tnc_kind=SSA} -> TNC."
          trigger:
            - "Employee E POST /everify-cases/{caseE.id}/tnc-decision {decision=CONTEST}."
          assert:
            - "caseE.case_status transitions TNC -> PENDING (cycle realized)."
            - "caseE.tnc_employee_decision == 'CONTEST'."
            - "AuditEvents include 'TNC_OPENED' followed by 'TNC_CONTESTED' for the same case_id."
            - "Employee E onboarding_status == 'EVERIFY_PENDING' after contest (not TNC_OPEN, not AUTHORIZED)."

      - name: i9_form_lineage_self_referential_branching
        grounds:
          - state_machines.I9Form
          - state_machines.I9Form.SECTION_2_DONE_to_SUPERSEDED
          - state_machines.I9Form.DRAFT_to_VOIDED
          - state_machines.I9Form.SECTION_1_DONE_to_VOIDED
          - entities.I9Form.fields.supersedes_form_id
        distinguishing_aspect: |
          I9Form's state machine is non-linear in TWO ways: it has a SELF-REFERENTIAL supersession chain
          (a new SECTION_2_DONE form transitions its predecessor to SUPERSEDED), AND a fork from
          SECTION_1_DONE to either SECTION_2_DONE or VOIDED. Different entity (I9Form) from instance 1
          (EVerifyCase), with different non-linear mechanism (self-referential FK + diamond) versus
          instance 1's pure cycle.
        test_recipe:
          setup:
            - "Build Employee F with INITIAL form Section 2 done on 2026-06-02 using a LIST_A EAD I-766 expiring 2026-08-01 (triggers WORK_AUTH_EXPIRY ReverificationEvent)."
            - "POST /_clock/advance to 2026-07-20T08:00:00.000Z (before expiry)."
            - "HR POSTs a REVERIFICATION form with supersedes_form_id=<initial form F>."
          trigger:
            - "Employee F attests Section 1 on the new form (which is a no-op for Section 1 in reverif but recorded); EmployerRep #2 signs Section 2 with a new LIST_A document."
            - "GET /employees/{F.id}/i9-forms."
          assert:
            - "Initial form's form_status == 'SUPERSEDED'."
            - "New form's form_status == 'SECTION_2_DONE' AND supersedes_form_id == initial_form.id."
            - "AuditEvent action='FORM_SUPERSEDED' present for initial_form, occurred_at <= section2_completed_at of new form."

  # -----------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: tnc_sweep_cascade_depth_3
        grounds:
          - state_machines.EVerifyCase.TNC_to_CLOSED_NOT_AUTHORIZED
          - calculations.derive_onboarding_status
          - entities.Employee.fields.is_terminated
          - entities.AuditEvent
        distinguishing_aspect: |
          Cascade depth ≥ 3 originating from POST /_sweep/run:
          (link 1) sweep observes EVerifyCase.tnc_contest_deadline < now -> mutates
          EVerifyCase.case_status TNC -> CLOSED_NOT_AUTHORIZED (writes final_disposition);
          (link 2) THAT mutation triggers Employee.is_terminated = true (a state change CAUSED BY
          link 1's mutation, not by the original sweep);
          (link 3) the Employee mutation in turn invalidates any OPEN ReverificationEvent and
          forces derive_onboarding_status to recompute onboarding_status -> NOT_AUTHORIZED, and
          appends AuditEvent action='TERMINATE'. Each hop is caused by the prior hop.
        test_recipe:
          setup:
            - "Build Employee G through TNC state (SSA TNC opened 2026-06-15)."
            - "Open a ReverificationEvent on G (use OPT EAD expiring 2026-08-01 as List A doc)."
          trigger:
            - "POST /_clock/advance to 2026-07-01T00:00:01.000Z."
            - "POST /_sweep/run."
          assert:
            - "caseG.case_status == 'CLOSED_NOT_AUTHORIZED' AND caseG.final_disposition == 'NOT_AUTHORIZED' (link 1)."
            - "Employee G.is_terminated == true (link 2 — caused by case closure, not by sweep directly)."
            - "Employee G.onboarding_status == 'NOT_AUTHORIZED' AND onboarding_status != 'TNC_OPEN' (link 3)."
            - "AuditEvent ordering: 'TNC_DEADLINE_LAPSED' < 'CASE_CLOSED' < 'TERMINATE' by occurred_at."

      - name: section2_supersession_cascade_depth_2
        grounds:
          - state_machines.I9Form.SECTION_1_DONE_to_SECTION_2_DONE
          - state_machines.I9Form.SECTION_2_DONE_to_SUPERSEDED
          - state_machines.ReverificationEvent.OPEN_to_RESOLVED
          - calculations.derive_onboarding_status
        distinguishing_aspect: |
          Different trigger (POST .../section2 on a successor form, NOT a sweep). Cascade chain:
          (link 1) successor I9Form transitions to SECTION_2_DONE; (link 2) THAT transition causes the
          predecessor I9Form to flip to SUPERSEDED and the linked ReverificationEvent (if any) to
          flip OPEN -> RESOLVED; both downstream effects are CAUSED by the link-1 mutation, not by
          the API call directly. Different origin trigger from instance 1's sweep cascade.
        test_recipe:
          setup:
            - "Build Employee H through INITIAL form with EAD expiring 2026-08-01 -> ReverificationEvent opens with resolution_deadline=2026-08-01T23:59:59.999Z."
            - "POST /_clock/advance to 2026-07-25T08:00:00.000Z."
            - "HR POSTs REVERIFICATION form linked to predecessor; Employee H attests Section 1."
          trigger:
            - "EmployerRep #2 POSTs Section 2 on the new form with a fresh LIST_A document."
          assert:
            - "Predecessor form.form_status == 'SUPERSEDED' (caused by successor reaching SECTION_2_DONE)."
            - "ReverificationEvent.resolved_at == successor.section2_completed_at AND new_form_id == successor.id."
            - "Employee H.onboarding_status remains in the EVerify branch (EVERIFY_PENDING or beyond), NOT 'NOT_AUTHORIZED'."

  # -----------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_segregation_of_duties_on_section2
        grounds:
          - validations[priority=5]
          - validations[priority=6]
          - state_machines.I9Form.SECTION_1_DONE_to_SECTION_2_DONE
        distinguishing_aspect: |
          Pair: state (priority 5, ERR_INVALID_STATE) vs business_safety segregation-of-duties
          (priority 6, ERR_SEGREGATION_OF_DUTIES). Dual-failure: a request that BOTH targets a form
          already in SECTION_2_DONE AND is sent by the same X-User-ID who attested Section 1 must
          return ERR_INVALID_STATE (lower priority number wins), not ERR_SEGREGATION_OF_DUTIES.
        test_recipe:
          setup:
            - "Build Employee J. J attests Section 1 with X-User-ID == J.id. EmployerRep #1 signs Section 2 successfully — form is now SECTION_2_DONE."
          trigger:
            - "Send a second POST /employees/{J.id}/i9-forms/{form_id}/section2 with headers X-User-Role=Employee, X-User-ID=J.id (i.e., the attester) and any document body."
          assert:
            - "Response status == 409 AND error_id == 'ERR_INVALID_STATE' (priority 5)."
            - "Response error_id != 'ERR_SEGREGATION_OF_DUTIES'."

      - name: doc_list_rule_vs_document_expired_on_section2
        grounds:
          - validations[priority=7]
          - validations[priority=9]
          - state_machines.I9Form.SECTION_1_DONE_to_SECTION_2_DONE
        distinguishing_aspect: |
          Different error-category pair than instance 1: business_referential
          (priority 7, ERR_DOCUMENT_LIST_RULE) vs business_safety (priority 9, ERR_DOCUMENT_EXPIRED).
          Dual-failure: a Section 2 request that supplies LIST_A + LIST_B (illegal combo) AND the
          LIST_A document is expired — both checks would trip. The scaffold pins the list-rule
          violation as the winner because priority 7 < priority 9.
        test_recipe:
          setup:
            - "Build Employee K with SECTION_1_DONE on an INITIAL form."
            - "Register two documents: docA LIST_A passport, expiration_date=2025-12-01 (expired); docB LIST_B driver's license, expiration_date=2030-01-01."
            - "POST /_clock/advance to 2026-06-10T08:00:00.000Z."
          trigger:
            - "EmployerRep POST /employees/{K.id}/i9-forms/{form_id}/section2 with list_a_document_id=docA.id AND list_b_document_id=docB.id."
          assert:
            - "Response status == 422 AND error_id == 'ERR_DOCUMENT_LIST_RULE'."
            - "Response error_id != 'ERR_DOCUMENT_EXPIRED'."

  # -----------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: section2_deadline_inclusive_boundary
        grounds:
          - validations[priority=11]
          - calculations.compute_section2_deadline
          - entities.Employee.fields.section2_deadline
          - endpoints[POST /employees/{employee_id}/i9-forms/{form_id}/section2]
        distinguishing_aspect: |
          Numeric/temporal boundary: ERR_SECTION2_DEADLINE_MISSED fires when
          current_time > section2_deadline (strict >), not when current_time == section2_deadline.
          The boundary is INCLUSIVE on the deadline timestamp (Employee.section2_deadline,
          a datetime field). Tests the exact second 23:59:59.999.
        test_recipe:
          setup:
            - "POST /_clock/advance to 2026-05-30T08:00:00.000Z."
            - "Create Employee L with start_date=2026-06-01 (US citizen, no docs). section2_deadline = '2026-06-04T23:59:59.999Z'."
            - "L attests Section 1; register LIST_A passport docL with expiration_date=2030-01-01."
            - "POST /_clock/advance to 2026-06-04T23:59:59.999Z (EXACTLY the deadline)."
          trigger:
            - "EmployerRep POST .../section2 with list_a_document_id=docL.id AND enforce_deadline=true."
          assert:
            - "Response status == 200 AND form.form_status == 'SECTION_2_DONE'."
            - "Response error_id IS NULL (no ERR_SECTION2_DEADLINE_MISSED at exact boundary)."
            - "Then POST /_clock/advance to 2026-06-05T00:00:00.000Z; new attempt on a fresh Employee with same setup yields error_id == 'ERR_SECTION2_DEADLINE_MISSED' (off-by-one millisecond confirms strict >)."

      - name: empty_document_set_on_section2
        grounds:
          - validations[priority=7]
          - endpoints[POST /employees/{employee_id}/i9-forms/{form_id}/section2]
        distinguishing_aspect: |
          Empty-collection edge: different metric (document set cardinality) and different endpoint
          path branch than instance 1's numeric boundary. ERR_DOCUMENT_LIST_RULE must trigger when
          ALL three list_*_document_id fields are null/absent (empty set), not silently default to
          'no documents = ok'.
        test_recipe:
          setup:
            - "Build Employee M with SECTION_1_DONE."
          trigger:
            - "EmployerRep POST .../section2 with body containing NO list_a/b/c references at all."
          assert:
            - "Response status == 422 AND error_id == 'ERR_DOCUMENT_LIST_RULE'."
            - "form.form_status remains 'SECTION_1_DONE'."

  # -----------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: everify_submit_requires_i9form_section2_done
        grounds:
          - validations[priority=12]
          - state_machines.EVerifyCase.DRAFT_to_PENDING
          - entities.I9Form.fields.form_status
          - entities.EVerifyCase.fields.i9_form_id
        distinguishing_aspect: |
          Entity pair: EVerifyCase ←→ I9Form. EVerifyCase.case_status DRAFT->PENDING requires
          the linked I9Form.form_status == SECTION_2_DONE. With the form still in SECTION_1_DONE,
          the EVerify submission MUST fail. This pair is different from instance 2's
          Employee↔Document pair.
        test_recipe:
          setup:
            - "Build Employee N with form_status=SECTION_1_DONE only (no Section 2 sign yet)."
          trigger:
            - "EmployerRep POST /employees/{N.id}/everify-cases with i9_form_id=<that form>."
          assert:
            - "Response status == 409 AND error_id == 'ERR_INVALID_STATE'."
            - "No EVerifyCase row exists for Employee N."

      - name: section2_requires_document_not_expired
        grounds:
          - validations[priority=9]
          - state_machines.I9Form.SECTION_1_DONE_to_SECTION_2_DONE
          - entities.I9Document.fields.expiration_date
          - entities.I9Document.fields.receipt
        distinguishing_aspect: |
          Entity pair: I9Form ←→ I9Document. I9Form.form_status SECTION_1_DONE -> SECTION_2_DONE
          depends on the I9Document's expiration_date relative to SystemClock.current_time AND on
          the receipt flag. The receipt exception (still-valid receipt is OK even if expired) is a
          conditional cross-entity rule. Different entity pair than instance 1.
        test_recipe:
          setup:
            - "Build Employee P with start_date=2026-06-01, SECTION_1_DONE."
            - "Register LIST_A passport docP expiration_date=2025-12-31 (expired), receipt=false."
            - "POST /_clock/advance to 2026-06-02T08:00:00.000Z."
          trigger:
            - "EmployerRep POST .../section2 list_a_document_id=docP.id."
          assert:
            - "Response status == 422 AND error_id == 'ERR_DOCUMENT_EXPIRED'."
            - "Now register docQ (LIST_A) expiration_date=2025-12-31, receipt=true (receipt_resolution_due=2026-08-30); retry with docQ."
            - "Second response: status == 200 AND form.form_status == 'SECTION_2_DONE' (receipt exception)."

  # -----------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: at_most_one_open_everify_case_per_employee
        grounds:
          - concurrency_rules[Two parallel POSTs to /everify-cases for the same employee_id with DIFFERENT Idempotency-Keys while no case is open]
          - validations[priority=12]
          - state_machines.EVerifyCase
          - entities.EVerifyCase.fields.case_status
        distinguishing_aspect: |
          Interval semantics: AGGREGATE-CAPACITY overlap on the Employee resource — the open interval
          [submitted_at, CLOSED_*_at) of one case must not overlap any other case's open interval.
          Geometric treatment: capacity = 1, no buffer. Distinct entity (EVerifyCase, scoped by
          employee_id) from instance 2's I9Form resource.
        test_recipe:
          setup:
            - "Build Employee Q to SECTION_2_DONE. EmployerRep opens caseQ1 via POST /everify-cases with idempotency_key='k1' — PENDING."
          trigger:
            - "EmployerRep POSTs again with idempotency_key='k2' (different key) before caseQ1 is closed."
          assert:
            - "Response status == 409 AND error_id == 'ERR_CASE_ALREADY_OPEN'."
            - "Exactly ONE EVerifyCase row exists for Employee Q."
            - "After caseQ1 reaches CLOSED_AUTHORIZED via the normal path, a third POST with idempotency_key='k3' SUCCEEDS (capacity freed, no overlap)."

      - name: at_most_one_initial_i9form_per_employee
        grounds:
          - concurrency_rules[Two HRStaff create initial I9Forms for the same Employee at the same time]
          - validations[priority=14]
          - entities.I9Form.fields.form_kind
        distinguishing_aspect: |
          Different interval semantics: PERMANENT exclusion on form_kind=INITIAL — the constraint is
          NOT time-windowed but PERMANENT (unlike instance 1's case capacity that releases on close).
          Distinct entity (I9Form) from instance 1's EVerifyCase. Adjacency rule: even after the
          INITIAL form is SUPERSEDED, a second form_kind=INITIAL is still rejected (lineage uses
          form_kind=REVERIFICATION or REHIRE instead).
        test_recipe:
          setup:
            - "Build Employee R. HR POST /employees/{R.id}/i9-forms with form_kind=INITIAL — formR1 DRAFT."
          trigger:
            - "HR POSTs a second /employees/{R.id}/i9-forms with form_kind=INITIAL."
          assert:
            - "Response status == 409 AND error_id == 'ERR_DUPLICATE_INITIAL_FORM'."
            - "Even after R's first INITIAL form is voided (POST /i9-forms/{formR1.id}/void), creating a NEW form with form_kind=INITIAL is allowed only if no non-VOIDED INITIAL exists; tested by voiding then succeeding."

  # -----------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: idempotent_replay_preserves_case_count
        grounds:
          - concurrency_rules[Two parallel POSTs to /everify-cases for the same employee_id with the SAME Idempotency-Key]
          - errors[ERR_IDEMPOTENT_REPLAY]
          - endpoints[POST /employees/{employee_id}/everify-cases]
        distinguishing_aspect: |
          Conserved quantity: COUNT(EVerifyCase WHERE employee_id = e.id). Forward action
          (first POST with key K) creates one case; compensating action (replay POST with same K)
          must NOT create a second case — the conserved count is exactly 1 after N replays.
          Different conserved quantity (a row count) from instance 2's monetary/temporal invariant.
        test_recipe:
          setup:
            - "Build Employee S to SECTION_2_DONE."
            - "EmployerRep POST /employees/{S.id}/everify-cases with idempotency_key='ABC' — caseS PENDING (initial count=1)."
          trigger:
            - "Replay POST /employees/{S.id}/everify-cases with idempotency_key='ABC' four more times."
          assert:
            - "Each replay returns status==200 with the SAME case_id as the original; body == caseS."
            - "COUNT(EVerifyCase WHERE employee_id == S.id) == 1 after all 5 calls (4 replays + 1 original)."
            - "AuditEvent action='EVERIFY_SUBMIT' count for caseS.id == 1 (no duplicate submission audit entry)."

      - name: section3_supersession_preserves_reverification_resolution_count
        grounds:
          - state_machines.ReverificationEvent.OPEN_to_RESOLVED
          - state_machines.I9Form.SECTION_2_DONE_to_SUPERSEDED
          - entities.ReverificationEvent.fields.new_form_id
          - entities.ReverificationEvent.fields.resolved_at
        distinguishing_aspect: |
          Different conserved quantity: COUNT(ReverificationEvent WHERE employee_id = e.id AND
          resolved_at IS NOT NULL) + COUNT(open) ≡ COUNT(total) before and after Section 3 update.
          Each Reverification has at most ONE resolution edge — a successful Section 3
          (supersession) must move exactly one OPEN row to RESOLVED, leaving the per-employee
          total unchanged. A botched cascade that left a stale OPEN row alongside a new SECTION_2_DONE
          successor would BREAK this invariant.
        test_recipe:
          setup:
            - "Build Employee T with initial form whose List A doc is OPT EAD expiring 2026-08-01 — automatically opens 1 ReverificationEvent (T_total=1, T_open=1, T_resolved=0)."
            - "POST /_clock/advance to 2026-07-25T08:00:00.000Z."
            - "HR creates REVERIFICATION form linked to predecessor; T attests Section 1; EmployerRep signs Section 2 with new LIST_A document expiring 2030-01-01."
          trigger:
            - "GET /employees/{T.id}/reverification-events."
          assert:
            - "Returned count of ReverificationEvents == 1 (no duplicate event row was created)."
            - "Exactly one event has resolved_at IS NOT NULL AND new_form_id == new_form.id."
            - "Open count == 0 AND resolved count == 1, summing to original total == 1 (invariant preserved)."
