scaffold_difficulty_design:
  # =========================================================================
  # Rule 1 — dual-variant calculations across different entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: reconciliation_par_vs_sales_waste
        grounds:
          - calculations.reconciliation_waste
          - entities.BakePlan.fields.total_theoretical_waste_units
          - entities.BakePlan.fields.total_actual_waste_units
          - state_machines.BakePlan.BAKED_to_RECONCILED
        distinguishing_aspect: "On the production entity BakePlan, PAR_BASED waste (max(0,baked-par)=10) diverges from SALES_BASED waste (max(0,baked-sold-delivered)=12) for identical inputs — an inventory-domain dual variant."
        test_recipe:
          setup:
            - "Product base_price_cents=400, shelf_life_hours=12; one Oven; ACTIVE account with huge credit_limit."
            - "Committed BakePlan for 2026-06-02 with one line par_qty=40; one BakeLot baked_qty=50 (plan->BAKED); 30 units sold retail; one ad-hoc DeliveryOrder qty=8 packed then delivered (delivered_qty=8)."
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "BRD-1", name: "Sourdough", category: "BREAD", base_price_cents: 400, shelf_life_hours: 12 }
              as: Manager
              captures: { prod_id: $.data.id }
            - call: "POST /ovens"
              payload: { name: "Oven A", capacity_trays: 20 }
              as: Manager
              captures: { oven_id: $.data.id }
            - call: "POST /wholesale-accounts"
              payload: { name: "Bistro", credit_limit_cents: 1000000, contract_tier: "STANDARD" }
              as: Manager
              captures: { acct_id: $.data.id }
            - call: "POST /bake-plans"
              payload: { production_date: "2026-06-02T00:00:00Z" }
              as: Manager
              captures: { plan_id: $.data.id }
            - call: "POST /bake-plans/${plan_id}/lines"
              payload: { product_id: "${prod_id}", par_qty: 40 }
              as: Manager
              captures: { line_id: $.data.id }
            - call: "POST /bake-plans/${plan_id}/commit"
              payload: {}
              as: Manager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-02T06:00:00Z" }
              as: Manager
            - call: "POST /bake-lots"
              payload: { bake_plan_line_id: "${line_id}", oven_id: "${oven_id}", baked_qty: 50, produced_at: "2026-06-02T05:00:00Z", slot_start: "2026-06-02T04:00:00Z", slot_end: "2026-06-02T05:00:00Z" }
              as: Manager
              captures: { lot_id: $.data.id }
            - call: "POST /retail-sales"
              payload: { bake_lot_id: "${lot_id}", qty: 30 }
              as: Manager
            - call: "POST /delivery-orders"
              payload: { wholesale_account_id: "${acct_id}", product_id: "${prod_id}", bake_plan_line_id: "${line_id}", delivery_date: "2026-06-02T10:00:00Z", qty: 8 }
              as: Manager
              captures: { order_id: $.data.id }
            - call: "POST /delivery-orders/${order_id}/pack"
              payload: {}
              as: Manager
            - call: "POST /delivery-orders/${order_id}/deliver"
              payload: {}
              as: Manager
          trigger:
            - call: "POST /bake-plans/${plan_id}/reconcile"
              payload: {}
              as: Manager
          assert:
            - "BakePlan.${plan_id}.total_theoretical_waste_units == 10"
            - "BakePlan.${plan_id}.total_actual_waste_units == 12"
            - "BakePlan.${plan_id}.total_waste_value_cents == 4800"
            - "BakePlan.${plan_id}.status == RECONCILED"

      - name: wholesale_list_vs_contract_price
        grounds:
          - calculations.wholesale_line_price
          - entities.DeliveryOrder.fields.line_total_cents
          - entities.DeliveryOrder.fields.list_total_cents
        distinguishing_aspect: "On the billing entity DeliveryOrder, CONTRACT variant (STANDARD 10% off) line_total_cents=300 diverges from LIST variant list_total_cents=333 — a customer/billing-domain dual variant distinct from the inventory-waste one."
        test_recipe:
          setup:
            - "Product base_price_cents=333; STANDARD account; committed plan line par_qty=20."
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "BRD-2", name: "Baguette", category: "BREAD", base_price_cents: 333, shelf_life_hours: 12 }
              as: Manager
              captures: { prod_id: $.data.id }
            - call: "POST /wholesale-accounts"
              payload: { name: "Cafe", credit_limit_cents: 1000000, contract_tier: "STANDARD" }
              as: Manager
              captures: { acct_id: $.data.id }
            - call: "POST /bake-plans"
              payload: { production_date: "2026-06-03T00:00:00Z" }
              as: Manager
              captures: { plan_id: $.data.id }
            - call: "POST /bake-plans/${plan_id}/lines"
              payload: { product_id: "${prod_id}", par_qty: 20 }
              as: Manager
              captures: { line_id: $.data.id }
            - call: "POST /bake-plans/${plan_id}/commit"
              payload: {}
              as: Manager
          trigger:
            - call: "POST /delivery-orders"
              payload: { wholesale_account_id: "${acct_id}", product_id: "${prod_id}", bake_plan_line_id: "${line_id}", delivery_date: "2026-06-03T10:00:00Z", qty: 1 }
              as: Manager
              captures: { order_id: $.data.id }
          assert:
            - "DeliveryOrder.${order_id}.line_total_cents == 300"
            - "DeliveryOrder.${order_id}.unit_price_cents == 300"
            - "DeliveryOrder.${order_id}.list_total_cents == 333"

  # =========================================================================
  # Rule 2 — combinatorial formulas across different modes
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: markdown_tiered_nonlinear_mode_a
        grounds:
          - calculations.markdown_price
          - state_machines.BakeLot.FRESH_to_MARKED_DOWN
          - entities.BakeLot.fields.markdown_price_cents
        distinguishing_aspect: "Mode (a): three inputs (base_price 400, hours_to_expiry tier, remaining_ratio) combine non-linearly — base_discount 0.25 (h=6>4) plus conditional surplus 0.15 (ratio 0.6>=0.5), capped by MAX_DISCOUNT, giving markdown_price_cents=240."
        test_recipe:
          setup:
            - "Product base 400 shelf 12; committed plan line; BakeLot baked 20 with best_by 6h ahead of clock; 8 units sold so remaining 12 (ratio 0.6)."
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "PST-1", name: "Croissant", category: "PASTRY", base_price_cents: 400, shelf_life_hours: 12 }
              as: Manager
              captures: { prod_id: $.data.id }
            - call: "POST /ovens"
              payload: { name: "Oven B", capacity_trays: 20 }
              as: Manager
              captures: { oven_id: $.data.id }
            - call: "POST /bake-plans"
              payload: { production_date: "2026-06-04T00:00:00Z" }
              as: Manager
              captures: { plan_id: $.data.id }
            - call: "POST /bake-plans/${plan_id}/lines"
              payload: { product_id: "${prod_id}", par_qty: 30 }
              as: Manager
              captures: { line_id: $.data.id }
            - call: "POST /bake-plans/${plan_id}/commit"
              payload: {}
              as: Manager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-04T12:00:00Z" }
              as: Manager
            - call: "POST /bake-lots"
              payload: { bake_plan_line_id: "${line_id}", oven_id: "${oven_id}", baked_qty: 20, produced_at: "2026-06-04T06:00:00Z", slot_start: "2026-06-04T02:00:00Z", slot_end: "2026-06-04T03:00:00Z" }
              as: Manager
              captures: { lot_id: $.data.id }
            - call: "POST /retail-sales"
              payload: { bake_lot_id: "${lot_id}", qty: 8 }
              as: Manager
            - call: "GET /bake-lots/${lot_id}"
              payload: {}
              as: Manager
              captures: { lot_v: $.data.version }
          trigger:
            - call: "POST /bake-lots/${lot_id}/markdown"
              payload: { expected_bake_lot_version: "${lot_v}" }
              as: Manager
          assert:
            - "BakeLot.${lot_id}.markdown_price_cents == 240"
            - "BakeLot.${lot_id}.current_unit_price_cents == 240"
            - "BakeLot.${lot_id}.status == MARKED_DOWN"

      - name: invoice_round_per_line_then_sum_mode_b
        grounds:
          - calculations.account_invoice_total
          - calculations.wholesale_line_price
          - entities.DeliveryOrder.fields.line_total_cents
        distinguishing_aspect: "Mode (b): statement rounds each order line first (299.7->300, 499.5->500) then sums to 800; summing exact discounted amounts (299.7+499.5=799.2) then rounding gives 799 — pinned round-per-line-then-sum order changes the cents."
        test_recipe:
          setup:
            - "STANDARD account; two products base 333 and 555; committed plan with two lines; two delivered orders qty 1 each on delivery_date 2026-06-05T10:00:00Z."
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "BRD-3", name: "Ciabatta", category: "BREAD", base_price_cents: 333, shelf_life_hours: 12 }
              as: Manager
              captures: { prodA: $.data.id }
            - call: "POST /products"
              payload: { sku: "BRD-4", name: "Rye", category: "BREAD", base_price_cents: 555, shelf_life_hours: 12 }
              as: Manager
              captures: { prodB: $.data.id }
            - call: "POST /wholesale-accounts"
              payload: { name: "Diner", credit_limit_cents: 1000000, contract_tier: "STANDARD" }
              as: Manager
              captures: { acct_id: $.data.id }
            - call: "POST /bake-plans"
              payload: { production_date: "2026-06-05T00:00:00Z" }
              as: Manager
              captures: { plan_id: $.data.id }
            - call: "POST /bake-plans/${plan_id}/lines"
              payload: { product_id: "${prodA}", par_qty: 10 }
              as: Manager
              captures: { lineA: $.data.id }
            - call: "POST /bake-plans/${plan_id}/lines"
              payload: { product_id: "${prodB}", par_qty: 10 }
              as: Manager
              captures: { lineB: $.data.id }
            - call: "POST /bake-plans/${plan_id}/commit"
              payload: {}
              as: Manager
            - call: "POST /delivery-orders"
              payload: { wholesale_account_id: "${acct_id}", product_id: "${prodA}", bake_plan_line_id: "${lineA}", delivery_date: "2026-06-05T10:00:00Z", qty: 1 }
              as: Manager
              captures: { orderA: $.data.id }
            - call: "POST /delivery-orders/${orderA}/pack"
              payload: {}
              as: Manager
            - call: "POST /delivery-orders/${orderA}/deliver"
              payload: {}
              as: Manager
            - call: "POST /delivery-orders"
              payload: { wholesale_account_id: "${acct_id}", product_id: "${prodB}", bake_plan_line_id: "${lineB}", delivery_date: "2026-06-05T10:00:00Z", qty: 1 }
              as: Manager
              captures: { orderB: $.data.id }
            - call: "POST /delivery-orders/${orderB}/pack"
              payload: {}
              as: Manager
            - call: "POST /delivery-orders/${orderB}/deliver"
              payload: {}
              as: Manager
          trigger:
            - call: "GET /wholesale-accounts/${acct_id}/statement"
              payload: { delivery_date: "2026-06-05T10:00:00Z" }
              as: Manager
          assert:
            - "statement.invoice_total_cents == 800"
            - "statement.list_total_cents == 888"
            - "statement.order_count == 2"

  # =========================================================================
  # Rule 3 — non-linear state-machine shape on different entities
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: delivery_order_parallel_payment_fulfillment
        grounds:
          - state_machines.DeliveryOrder.UNPAID_to_PARTIALLY_PAID
          - state_machines.DeliveryOrder.PENDING_to_PACKED
          - entities.DeliveryOrder.fields.payment_status
          - entities.DeliveryOrder.fields.fulfillment_status
        distinguishing_aspect: "payment_status advances UNPAID->PARTIALLY_PAID while fulfillment_status independently advances PENDING->PACKED on the same DeliveryOrder — two parallel state dimensions on one entity."
        test_recipe:
          setup:
            - "Product base 400; STANDARD account; committed line par 10; one ad-hoc order qty 1 (line_total 360)."
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "BRD-5", name: "Loaf", category: "BREAD", base_price_cents: 400, shelf_life_hours: 12 }
              as: Manager
              captures: { prod_id: $.data.id }
            - call: "POST /wholesale-accounts"
              payload: { name: "Grill", credit_limit_cents: 1000000, contract_tier: "STANDARD" }
              as: Manager
              captures: { acct_id: $.data.id }
            - call: "POST /bake-plans"
              payload: { production_date: "2026-06-06T00:00:00Z" }
              as: Manager
              captures: { plan_id: $.data.id }
            - call: "POST /bake-plans/${plan_id}/lines"
              payload: { product_id: "${prod_id}", par_qty: 10 }
              as: Manager
              captures: { line_id: $.data.id }
            - call: "POST /bake-plans/${plan_id}/commit"
              payload: {}
              as: Manager
            - call: "POST /delivery-orders"
              payload: { wholesale_account_id: "${acct_id}", product_id: "${prod_id}", bake_plan_line_id: "${line_id}", delivery_date: "2026-06-06T10:00:00Z", qty: 1 }
              as: Manager
              captures: { order_id: $.data.id }
          trigger:
            - call: "POST /delivery-orders/${order_id}/payments"
              payload: { amount_cents: 100 }
              as: Manager
            - call: "POST /delivery-orders/${order_id}/pack"
              payload: {}
              as: Manager
          assert:
            - "DeliveryOrder.${order_id}.payment_status == PARTIALLY_PAID"
            - "DeliveryOrder.${order_id}.fulfillment_status == PACKED"
            - "DeliveryOrder.${order_id}.amount_paid_cents == 100"

      - name: standing_order_active_paused_active_cycle
        grounds:
          - state_machines.StandingOrder.ACTIVE_to_PAUSED
          - state_machines.StandingOrder.PAUSED_to_ACTIVE
          - entities.StandingOrder.fields.status
        distinguishing_aspect: "StandingOrder returns to ACTIVE via ACTIVE->PAUSED->ACTIVE — a genuine cycle on a different entity than the parallel DeliveryOrder machine."
        test_recipe:
          setup:
            - "Product; account; one ACTIVE standing order (version 1)."
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "BRD-6", name: "Bagel", category: "BREAD", base_price_cents: 250, shelf_life_hours: 24 }
              as: Manager
              captures: { prod_id: $.data.id }
            - call: "POST /wholesale-accounts"
              payload: { name: "Deli", credit_limit_cents: 1000000, contract_tier: "STANDARD" }
              as: Manager
              captures: { acct_id: $.data.id }
            - call: "POST /standing-orders"
              payload: { wholesale_account_id: "${acct_id}", product_id: "${prod_id}", qty_per_delivery: 10, weekday_mask: ["MON"], cutoff_hours: 24 }
              as: Manager
              captures: { so_id: $.data.id }
          trigger:
            - call: "POST /standing-orders/${so_id}/pause"
              payload: {}
              as: Manager
            - call: "POST /standing-orders/${so_id}/resume"
              payload: {}
              as: Manager
          assert:
            - "StandingOrder.${so_id}.status == ACTIVE"
            - "StandingOrder.${so_id}.version == 3"

  # =========================================================================
  # Rule 4 — transitive cascade chains from different triggers
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: standing_order_cancel_cascades_to_route_load
        grounds:
          - state_machines.StandingOrder.ACTIVE_to_CANCELLED
          - state_machines.DeliveryOrder.PENDING_to_CANCELLED
          - state_machines.RouteStop.PENDING_to_CANCELLED
          - calculations.route_load
        distinguishing_aspect: "Depth-4 chain: StandingOrder CANCELLED -> its DeliveryOrder CANCELLED -> that order's RouteStop CANCELLED -> the DeliveryRoute total_load_qty recomputed to 0, each hop caused by the previous."
        test_recipe:
          setup:
            - "Committed line par 20; account; ACTIVE standing order cutoff 24; one order qty 5 citing the standing order; a PLANNED route with one stop for that order (total_load 5)."
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "BRD-7", name: "Focaccia", category: "BREAD", base_price_cents: 400, shelf_life_hours: 12 }
              as: Manager
              captures: { prod_id: $.data.id }
            - call: "POST /wholesale-accounts"
              payload: { name: "Trattoria", credit_limit_cents: 1000000, contract_tier: "STANDARD" }
              as: Manager
              captures: { acct_id: $.data.id }
            - call: "POST /bake-plans"
              payload: { production_date: "2026-06-10T00:00:00Z" }
              as: Manager
              captures: { plan_id: $.data.id }
            - call: "POST /bake-plans/${plan_id}/lines"
              payload: { product_id: "${prod_id}", par_qty: 20 }
              as: Manager
              captures: { line_id: $.data.id }
            - call: "POST /bake-plans/${plan_id}/commit"
              payload: {}
              as: Manager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-08T00:00:00Z" }
              as: Manager
            - call: "POST /standing-orders"
              payload: { wholesale_account_id: "${acct_id}", product_id: "${prod_id}", qty_per_delivery: 5, weekday_mask: ["WED"], cutoff_hours: 24 }
              as: Manager
              captures: { so_id: $.data.id }
            - call: "POST /delivery-orders"
              payload: { wholesale_account_id: "${acct_id}", product_id: "${prod_id}", bake_plan_line_id: "${line_id}", delivery_date: "2026-06-10T10:00:00Z", qty: 5, standing_order_id: "${so_id}" }
              as: Manager
              captures: { order_id: $.data.id }
            - call: "POST /delivery-routes"
              payload: { route_date: "2026-06-10T00:00:00Z", driver_name: "Dan", window_start: "2026-06-10T06:00:00Z", window_end: "2026-06-10T14:00:00Z" }
              as: Manager
              captures: { route_id: $.data.id }
            - call: "POST /delivery-routes/${route_id}/stops"
              payload: { delivery_order_id: "${order_id}", sequence: 1, arrival_window_start: "2026-06-10T08:00:00Z", arrival_window_end: "2026-06-10T09:00:00Z" }
              as: Manager
              captures: { stop_id: $.data.id }
          trigger:
            - call: "POST /standing-orders/${so_id}/cancel"
              payload: {}
              as: Manager
          assert:
            - "StandingOrder.${so_id}.status == CANCELLED"
            - "DeliveryOrder.${order_id}.fulfillment_status == CANCELLED"
            - "RouteStop.${stop_id}.status == CANCELLED"
            - "DeliveryRoute.${route_id}.total_load_qty == 0"
            - "DeliveryRoute.${route_id}.stop_count == 0"
            - "BakePlanLine.${line_id}.reserved_qty == 0"

      - name: account_close_cascades_to_delivery_orders
        grounds:
          - state_machines.WholesaleAccount.ACTIVE_to_CLOSED
          - state_machines.StandingOrder.ACTIVE_to_CANCELLED
          - state_machines.DeliveryOrder.PENDING_to_CANCELLED
        distinguishing_aspect: "Depth-3 chain from a different trigger (account close): WholesaleAccount CLOSED -> its StandingOrder CANCELLED -> that standing order's DeliveryOrder CANCELLED (par released)."
        test_recipe:
          setup:
            - "Account credit_balance 0; committed line par 20; ACTIVE standing order; one PENDING order qty 5 citing it."
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "BRD-8", name: "Pretzel", category: "BREAD", base_price_cents: 400, shelf_life_hours: 12 }
              as: Manager
              captures: { prod_id: $.data.id }
            - call: "POST /wholesale-accounts"
              payload: { name: "Pub", credit_limit_cents: 1000000, contract_tier: "STANDARD" }
              as: Manager
              captures: { acct_id: $.data.id }
            - call: "POST /bake-plans"
              payload: { production_date: "2026-06-10T00:00:00Z" }
              as: Manager
              captures: { plan_id: $.data.id }
            - call: "POST /bake-plans/${plan_id}/lines"
              payload: { product_id: "${prod_id}", par_qty: 20 }
              as: Manager
              captures: { line_id: $.data.id }
            - call: "POST /bake-plans/${plan_id}/commit"
              payload: {}
              as: Manager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-08T00:00:00Z" }
              as: Manager
            - call: "POST /standing-orders"
              payload: { wholesale_account_id: "${acct_id}", product_id: "${prod_id}", qty_per_delivery: 5, weekday_mask: ["WED"], cutoff_hours: 24 }
              as: Manager
              captures: { so_id: $.data.id }
            - call: "POST /delivery-orders"
              payload: { wholesale_account_id: "${acct_id}", product_id: "${prod_id}", bake_plan_line_id: "${line_id}", delivery_date: "2026-06-10T10:00:00Z", qty: 5, standing_order_id: "${so_id}" }
              as: Manager
              captures: { order_id: $.data.id }
          trigger:
            - call: "POST /wholesale-accounts/${acct_id}/close"
              payload: {}
              as: Manager
          assert:
            - "WholesaleAccount.${acct_id}.status == CLOSED"
            - "StandingOrder.${so_id}.status == CANCELLED"
            - "DeliveryOrder.${order_id}.fulfillment_status == CANCELLED"
            - "BakePlanLine.${line_id}.reserved_qty == 0"

  # =========================================================================
  # Rule 5 — validation priority conflicts across different error-category pairs
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: referential_vs_temporal_on_create_order
        grounds:
          - validations[priority=6]
          - validations[priority=8]
          - errors[ERR_PRODUCT_DISCONTINUED]
        distinguishing_aspect: "Order create fails both business_referential (product DISCONTINUED, priority 6) and business_temporal (past cutoff, priority 8); the lower-numbered referential error ERR_PRODUCT_DISCONTINUED wins — a referential-vs-temporal pair."
        test_recipe:
          setup:
            - "Committed line for product P; ACTIVE standing order cutoff 24; then P discontinued; clock set to 10h before delivery_date (inside cutoff window)."
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "BRD-9", name: "Brioche", category: "BREAD", base_price_cents: 400, shelf_life_hours: 12 }
              as: Manager
              captures: { prod_id: $.data.id }
            - call: "POST /wholesale-accounts"
              payload: { name: "Hotel", credit_limit_cents: 1000000, contract_tier: "STANDARD" }
              as: Manager
              captures: { acct_id: $.data.id }
            - call: "POST /bake-plans"
              payload: { production_date: "2026-06-10T00:00:00Z" }
              as: Manager
              captures: { plan_id: $.data.id }
            - call: "POST /bake-plans/${plan_id}/lines"
              payload: { product_id: "${prod_id}", par_qty: 20 }
              as: Manager
              captures: { line_id: $.data.id }
            - call: "POST /bake-plans/${plan_id}/commit"
              payload: {}
              as: Manager
            - call: "POST /standing-orders"
              payload: { wholesale_account_id: "${acct_id}", product_id: "${prod_id}", qty_per_delivery: 5, weekday_mask: ["WED"], cutoff_hours: 24 }
              as: Manager
              captures: { so_id: $.data.id }
            - call: "POST /products/${prod_id}/discontinue"
              payload: {}
              as: Manager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T00:00:00Z" }
              as: Manager
          trigger:
            - call: "POST /delivery-orders"
