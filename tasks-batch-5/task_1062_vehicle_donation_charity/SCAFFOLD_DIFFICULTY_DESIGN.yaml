            - call: "POST /api/donations/${dw}/accept"
              payload: {}
              as: IntakeAgent
            - call: "POST /api/donations/${dw}/receive-dropoff"
              payload: {}
              as: IntakeAgent
            - call: "POST /api/vehicles"
              payload: { donation_id: "${dw}", vin: "VINAXES0000000001", year: 2016, make: "Honda", model: "Accord", base_book_value_cents: 480000 }
              as: IntakeAgent
              captures: { vw: $.data.id }
            - call: "POST /api/title-records"
              payload: { donation_id: "${dw}", title_number: "CA-TTL-W", owner_name: "Axel Dim" }
              as: TitleClerk
              captures: { tw: $.data.id }
            - call: "POST /api/title-records/${tw}/submit-dmv"
              payload: {}
              as: TitleClerk
            - call: "POST /api/title-records/${tw}/dmv-decision"
