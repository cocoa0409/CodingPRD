            - "BatchTicket.${bt2_id}.movement_status == CANCELLED with cancel_reason == 'shipper released the barrels back to the origin tank'"
            - "BatchTicket.${bt2_id}.transmix_bbl == 250.00 and BatchTicket.${bt1_id}.transmix_bbl == 0.00"
            - "Terminal.${org_id}.inventory_bbl == 70000.00 (43650.00 + 26100 + 250 returned)"
            - "PipelineSegment.${seg_id}.in_transit_bbl == 30000.00 and PipelineSegment.${seg_id}.transmix_inventory_bbl == 0.00"
