  - method: POST
    path: /membership-actions
    description: "Propose an admission or a forced withdrawal of a member institution. An ADMIT proposal requires an approved budget for the current fiscal year."
    roles: [Commissioner]
    input: ["conference_id", "member_id", "action_type", "effective_fiscal_year", "entry_fee_cents?", "rationale?"]
    output: MembershipAction
    side_effects:
      - "creates the MembershipAction in status PROPOSED with amend_count 0, records proposed_by_user_id from X-User-ID and version 1"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_CONFERENCE_NOT_INITIALIZED, ERR_INVALID_REQUEST, ERR_MEMBER_NOT_FOUND, ERR_MEMBER_STATE_INVALID, ERR_INVALID_EFFECTIVE_YEAR, ERR_NO_APPROVED_BUDGET]

  - method: GET
    path: /membership-actions/{id}
    description: "Read a membership action including its tally and its OCC version, which a ballot must echo."
    roles: [Commissioner, ComplianceOfficer, Auditor, FinanceOfficer, PlatformAdmin, MemberRepresentative]
    input: []
    output: MembershipAction
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_CONFERENCE_NOT_INITIALIZED, ERR_MEMBERSHIP_ACTION_NOT_FOUND]

  - method: GET
    path: /membership-actions
    description: "List membership actions, filterable by conference, subject member, action type and status."
    roles: [Commissioner, ComplianceOfficer, Auditor, FinanceOfficer, PlatformAdmin, MemberRepresentative]
    input: ["conference_id?", "member_id?", "action_type?", "status?", "limit?", "offset?"]
    output: MembershipAction[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_CONFERENCE_NOT_INITIALIZED, ERR_INVALID_PAGINATION]

  - method: POST
    path: /membership-actions/{id}/open-voting
    description: "Open the ballot on a proposed membership action."
    roles: [Commissioner]
    input: []
    output: MembershipAction
    side_effects:
      - "sets status VOTING and increments MembershipAction version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_CONFERENCE_NOT_INITIALIZED, ERR_MEMBERSHIP_ACTION_NOT_FOUND, ERR_ACTION_STATE_INVALID]

  - method: POST
    path: /membership-actions/{id}/withdraw
    description: "Abandon a proposed membership action before voting opens."
    roles: [Commissioner]
    input: ["reason"]
    output: MembershipAction
    side_effects:
      - "sets status WITHDRAWN and increments MembershipAction version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_CONFERENCE_NOT_INITIALIZED, ERR_MEMBERSHIP_ACTION_NOT_FOUND, ERR_INVALID_REQUEST, ERR_ACTION_STATE_INVALID]

  - method: POST
    path: /membership-actions/{id}/ballots
    description: "Cast a weighted ballot on a membership action under optimistic concurrency control on the action."
    roles: [MemberRepresentative]
    input: ["member_id", "choice", "expected_action_version"]
    output: Ballot
    side_effects:
      - "creates the Ballot in status CAST with weight_bps copied from Member.voting_weight_bps"
      - "increments MembershipAction version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_NOT_MEMBER_OWNER, ERR_CONFERENCE_NOT_INITIALIZED, ERR_MEMBERSHIP_ACTION_NOT_FOUND, ERR_INVALID_REQUEST, ERR_MEMBER_NOT_FOUND, ERR_STALE_ACTION_VERSION, ERR_ACTION_STATE_INVALID, ERR_MEMBER_NOT_ELIGIBLE_TO_VOTE, ERR_DUPLICATE_BALLOT]

  - method: GET
    path: /membership-actions/{id}/ballots
    description: "List the ballots filed on a membership action."
    roles: [Commissioner, ComplianceOfficer, Auditor, PlatformAdmin, MemberRepresentative]
    input: ["member_id?", "status?", "limit?", "offset?"]
    output: Ballot[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_CONFERENCE_NOT_INITIALIZED, ERR_MEMBERSHIP_ACTION_NOT_FOUND, ERR_INVALID_PAGINATION]

  - method: POST
    path: /membership-actions/{id}/amend
    description: "Amend the terms of an action already under vote, which voids every ballot cast so far and returns the action to PROPOSED for a fresh ballot."
    roles: [Commissioner]
    input: ["effective_fiscal_year?", "entry_fee_cents?", "rationale?"]
    output: MembershipAction
    side_effects:
      - "sets status PROPOSED, increments amend_count by 1 and sets every CAST Ballot on the action to VOIDED"
      - "increments MembershipAction version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_CONFERENCE_NOT_INITIALIZED, ERR_MEMBERSHIP_ACTION_NOT_FOUND, ERR_INVALID_REQUEST, ERR_INVALID_EFFECTIVE_YEAR, ERR_ACTION_STATE_INVALID, ERR_AMEND_LIMIT_REACHED]

  - method: POST
    path: /membership-actions/{id}/close-voting
    description: "Close the ballot, tally the weighted vote against the action type's threshold and branch to APPROVED or REJECTED. The closer must differ from the proposer."
    roles: [ComplianceOfficer, Commissioner]
    input: []
    output: MembershipAction
    side_effects:
      - "runs vote_tally and writes eligible_weight_bps, cast_weight_bps, for_weight_bps, against_weight_bps, approval_ratio_bps, quorum_met and required_approval_bps"
      - "sets status APPROVED when quorum is met and the ratio reaches the threshold, otherwise REJECTED"
      - "increments MembershipAction version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_CONFERENCE_NOT_INITIALIZED, ERR_MEMBERSHIP_ACTION_NOT_FOUND, ERR_ACTION_STATE_INVALID, ERR_SEGREGATION_OF_DUTIES]

  - method: POST
    path: /membership-actions/{id}/execute
    description: "Execute an approved action. ADMIT seats the petitioner on the phased ladder; WITHDRAW departs the member and cascades through its games, rivalries, compliance score and hosting assignments."
    roles: [Commissioner]
    input: []
    output: MembershipAction
    side_effects:
      - "sets status EXECUTED and increments MembershipAction version by 1"
      - "ADMIT: sets the subject Member to ADMITTED_PHASING with phase_year 1, runs member_phase_schedule and writes entry_fee_cents"
      - "WITHDRAW: sets the subject Member to DEPARTED with distribution_phase_bps 0 and voting_weight_bps 0"
      - "WITHDRAW cascade: every SCHEDULED ScheduleGame involving the member becomes CANCELLED; every ACTIVE ProtectedRivalry involving the member becomes LAPSED; the counterpart members' schedule_compliance_score is recomputed; any SCHEDULED ChampionshipEvent whose host member now scores below HOST_ELIGIBILITY_SCORE_MIN becomes HOST_AT_RISK"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_CONFERENCE_NOT_INITIALIZED, ERR_MEMBERSHIP_ACTION_NOT_FOUND, ERR_ACTION_STATE_INVALID, ERR_ENTRY_FEE_OUTSTANDING]

