  # ---------------------------------------------------------------- Rule 8
  - rule_id: resource_temporal_overlap
    instances:
      - name: pricing_policy_half_open_adjacency
        grounds:
          - entities.PricingPolicy.fields.effective_from
          - entities.PricingPolicy.fields.effective_to
          - errors[ERR_POLICY_WINDOW_OVERLAP]
        distinguishing_aspect: |
          Interval semantics = half-open [effective_from, effective_to) on the
          PricingPolicy-per-site resource: a new policy whose effective_from
          equals the existing policy's effective_to is ADJACENT and accepted,
          while one starting a single day earlier overlaps and is rejected.
        test_recipe:
          setup:
            - "Site S with policy P1 window [2026-05-01, 2026-05-10)"
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Window Site", cage_capacity_cylinders: 20, par_level_full: 12, commission_rate_bps: 1000 }
              as: PlatformAdmin
