  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: cert_window_half_open_adjacency_ok_overlap_rejected
        grounds:
          - calculations.certification_window_overlap
          - entities.Certification.fields.effective_date
          - validations[priority=20]
        distinguishing_aspect: |
          Certification windows use HALF-OPEN [effective_date, expires_on) semantics: a second window starting exactly
          on the first's expires_on (2027-01-01) is accepted (adjacency, not overlap), but a window that starts before
          the first's expires_on is rejected ERR_CERT_WINDOW_OVERLAP.
        test_recipe:
          setup:
            - "Beneficiary with one certification window 2026-01-01..2027-01-01 (PENDING)."
          setup_api_calls:
            - call: "POST /able/programs"
              payload: { name: "CA ABLE", state_code: "CA", annual_contribution_cap_cents: 1900000, able_to_work_fpl_cents: 1506000, program_fee_bps: 30 }
              as: ProgramAdministrator
              captures: { prog_id: $.data.id }
            - call: "POST /able/beneficiaries"
              payload: { program_id: "${prog_id}", full_name: "Ray R", birth_date: "2005-03-01", disability_onset_date: "2018-06-01", state_code: "CA" }
              as: ProgramAdministrator
              captures: { ben_id: $.data.id }
            - call: "POST /able/beneficiaries/${ben_id}/certifications"
              payload: { basis: "SSI_SSDI_ENTITLEMENT", effective_date: "2026-01-01", expires_on: "2027-01-01" }
              as: ProgramAdministrator
              captures: { cert1_id: $.data.id }
          trigger:
            - call: "POST /able/beneficiaries/${ben_id}/certifications"
              payload: { basis: "SSI_SSDI_ENTITLEMENT", effective_date: "2027-01-01", expires_on: "2028-01-01" }
              as: ProgramAdministrator
              captures: { cert2_id: $.data.id }
            - call: "POST /able/beneficiaries/${ben_id}/certifications"
              payload: { basis: "SSI_SSDI_ENTITLEMENT", effective_date: "2026-12-31", expires_on: "2027-06-30" }
              as: ProgramAdministrator
              captures: { err: $.data.error_id }
          assert:
            - "adjacent window 2027-01-01..2028-01-01 created (status PENDING, HTTP 201) — shared endpoint not an overlap under half-open"
            - "overlapping window starting 2026-12-31 -> error_id == ERR_CERT_WINDOW_OVERLAP, HTTP 409"

      - name: rep_authority_closed_shared_endpoint_collides
        grounds:
          - calculations.representative_authority_overlap
          - entities.AuthorizedRepresentative.fields.authority_start
          - validations[priority=21]
        distinguishing_aspect: |
          Representative authority windows use CLOSED [authority_start, authority_end] semantics on a different resource:
          a second PARENT rep whose authority_start equals the first rep's authority_end (2028-01-01) DOES collide and is
          rejected ERR_REP_AUTHORITY_OVERLAP — the opposite endpoint treatment from the half-open certification windows.
        test_recipe:
          setup:
            - "OPEN account with one ACTIVE PARENT representative, authority 2026-01-01..2028-01-01."
          setup_api_calls:
            - call: "POST /able/programs"
              payload: { name: "CA ABLE", state_code: "CA", annual_contribution_cap_cents: 1900000, able_to_work_fpl_cents: 1506000, program_fee_bps: 30 }
              as: ProgramAdministrator
              captures: { prog_id: $.data.id }
            - call: "POST /able/investment-options"
              payload: { program_id: "${prog_id}", name: "Moderate", risk_tier: "MODERATE" }
              as: ProgramAdministrator
              captures: { opt_id: $.data.id }
            - call: "POST /able/beneficiaries"
              payload: { program_id: "${prog_id}", full_name: "Sam S", birth_date: "2005-03-01", disability_onset_date: "2018-06-01", state_code: "CA" }
              as: ProgramAdministrator
              captures: { ben_id: $.data.id }
            - call: "POST /able/beneficiaries/${ben_id}/certifications"
              payload: { basis: "SSI_SSDI_ENTITLEMENT", effective_date: "2026-01-01", expires_on: "2027-01-01" }
              as: ProgramAdministrator
              captures: { cert_id: $.data.id }
            - call: "POST /able/certifications/${cert_id}/decide"
              payload: { decision: "APPROVE" }
              as: ProgramAdministrator
            - call: "POST /able/accounts"
              payload: { beneficiary_id: "${ben_id}", investment_option_id: "${opt_id}" }
              as: ProgramAdministrator
              captures: { acct_id: $.data.id }
            - call: "POST /able/accounts/${acct_id}/authorized-representatives"
              payload: { full_name: "Parent One", relationship: "PARENT", authority_start: "2026-01-01", authority_end: "2028-01-01" }
              as: Beneficiary
              as_user_id: "${ben_id}"
              captures: { rep1_id: $.data.id }
          trigger:
            - call: "POST /able/accounts/${acct_id}/authorized-representatives"
              payload: { full_name: "Parent Two", relationship: "PARENT", authority_start: "2028-01-01", authority_end: "2030-01-01" }
              as: Beneficiary
              as_user_id: "${ben_id}"
              captures: { err: $.data.error_id }
          assert:
            - "second PARENT rep sharing endpoint 2028-01-01 -> error_id == ERR_REP_AUTHORITY_OVERLAP, HTTP 409 (closed-interval collision)"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: contribution_reverse_conserves_basis_ledger
        grounds:
          - state_machines.Contribution.POSTED_to_REVERSED
          - entities.Account.fields.basis_cents
          - entities.Account.fields.regular_contrib_ytd_cents
        distinguishing_aspect: |
          Conserved quantity = the basis/YTD contribution ledger. After a REGULAR contribution of 500000 is POSTED and
          then REVERSED, Account.basis_cents and regular_contrib_ytd_cents return exactly to their pre-contribution
          values (0), so the named ledger invariant basis_cents == sum(POSTED contributions) holds with zero drift.
        test_recipe:
          setup:
            - "OPEN account with basis 0; one REGULAR contribution of 500000 POSTED (basis 500000, ytd 500000)."
          setup_api_calls:
            - call: "POST /able/programs"
              payload: { name: "CA ABLE", state_code: "CA", annual_contribution_cap_cents: 1900000, able_to_work_fpl_cents: 1506000, program_fee_bps: 30 }
              as: ProgramAdministrator
              captures: { prog_id: $.data.id }
            - call: "POST /able/investment-options"
              payload: { program_id: "${prog_id}", name: "Moderate", risk_tier: "MODERATE" }
              as: ProgramAdministrator
              captures: { opt_id: $.data.id }
            - call: "POST /able/beneficiaries"
              payload: { program_id: "${prog_id}", full_name: "Tia T", birth_date: "2005-03-01", disability_onset_date: "2018-06-01", state_code: "CA" }
              as: ProgramAdministrator
              captures: { ben_id: $.data.id }
            - call: "POST /able/beneficiaries/${ben_id}/certifications"
              payload: { basis: "SSI_SSDI_ENTITLEMENT", effective_date: "2026-01-01", expires_on: "2027-01-01" }
              as: ProgramAdministrator
              captures: { cert_id: $.data.id }
            - call: "POST /able/certifications/${cert_id}/decide"
              payload: { decision: "APPROVE" }
              as: ProgramAdministrator
            - call: "POST /able/accounts"
              payload: { beneficiary_id: "${ben_id}", investment_option_id: "${opt_id}" }
              as: ProgramAdministrator
              captures: { acct_id: $.data.id, acct_v: $.data.version }
            - call: "POST /able/accounts/${acct_id}/contributions"
              payload: { contribution_type: "REGULAR", amount_cents: 500000, expected_account_version: "${acct_v}" }
              as: ProgramAdministrator
              captures: { contrib_id: $.data.id }
          trigger:
            - call: "POST /able/contributions/${contrib_id}/reverse"
              payload: {}
              as: ProgramAdministrator
          assert:
            - "Contribution.${contrib_id}.status == REVERSED"
            - "Account.${acct_id}.basis_cents == 0 (restored)"
            - "Account.${acct_id}.regular_contrib_ytd_cents == 0 (restored)"
            - "Account.${acct_id}.balance_cents == 0 (restored)"

      - name: medicaid_settle_conserves_balance_partition
        grounds:
          - calculations.medicaid_payback
          - state_machines.Account.FROZEN_DEATH_to_CLOSED
          - entities.MedicaidClaim.fields.allowed_payback_cents
          - entities.MedicaidClaim.fields.residual_to_estate_cents
        distinguishing_aspect: |
          Conserved quantity = the account balance partition (a different conserved quantity than the basis ledger).
          At settle, balance_at_death (8000000) is partitioned with no drift: allowed_payback_cents (2200000) +
          residual_to_estate_cents (5800000) == 8000000.
        test_recipe:
          setup:
            - "OPEN account, REGULAR 1900000 + credit_earnings 6100000 -> balance 8000000; premiums_paid_by_beneficiary_cents=800000."
            - "Death recorded -> FROZEN_DEATH (no pending APPROVED distributions). Medicaid claim 3000000 FILED."
          setup_api_calls:
            - call: "POST /able/programs"
              payload: { name: "CA ABLE", state_code: "CA", annual_contribution_cap_cents: 1900000, able_to_work_fpl_cents: 1506000, program_fee_bps: 30 }
              as: ProgramAdministrator
              captures: { prog_id: $.data.id }
            - call: "POST /able/investment-options"
              payload: { program_id: "${prog_id}", name: "Moderate", risk_tier: "MODERATE" }
              as: ProgramAdministrator
              captures: { opt_id: $.data.id }
            - call: "POST /able/beneficiaries"
              payload: { program_id: "${prog_id}", full_name: "Uma U", birth_date: "2005-03-01", disability_onset_date: "2018-06-01", state_code: "CA" }
              as: ProgramAdministrator
              captures: { ben_id: $.data.id }
            - call: "POST /able/beneficiaries/${ben_id}/certifications"
              payload: { basis: "SSI_SSDI_ENTITLEMENT", effective_date: "2026-01-01", expires_on: "2027-01-01" }
              as: ProgramAdministrator
              captures: { cert_id: $.data.id }
            - call: "POST /able/certifications/${cert_id}/decide"
              payload: { decision: "APPROVE" }
              as: ProgramAdministrator
            - call: "POST /able/accounts"
              payload: { beneficiary_id: "${ben_id}", investment_option_id: "${opt_id}", premiums_paid_by_beneficiary_cents: 800000 }
              as: ProgramAdministrator
              captures: { acct_id: $.data.id, acct_v: $.data.version }
            - call: "POST /able/accounts/${acct_id}/contributions"
              payload: { contribution_type: "REGULAR", amount_cents: 1900000, expected_account_version: "${acct_v}" }
              as: ProgramAdministrator
            - call: "POST /_market/credit_earnings"
              payload: { account_id: "${acct_id}", earnings_delta_cents: 6100000 }
              as: ProgramAdministrator
            - call: "POST /able/beneficiaries/${ben_id}/record_death"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /able/accounts/${acct_id}/medicaid-claims"
              payload: { claimed_amount_cents: 3000000 }
              as: MedicaidAgency
              captures: { claim_id: $.data.id, allowed: $.data.allowed_payback_cents, residual: $.data.residual_to_estate_cents }
          trigger:
            - call: "POST /able/accounts/${acct_id}/medicaid-claims/${claim_id}/settle"
              payload: {}
              as: ProgramAdministrator
              captures: { final_allowed: $.data.allowed_payback_cents, final_residual: $.data.residual_to_estate_cents }
          assert:
            - "MedicaidClaim.${claim_id}.allowed_payback_cents == 2200000 (min(balance 8000000, claim 3000000 - premiums 800000 = 2200000))"
            - "MedicaidClaim.${claim_id}.residual_to_estate_cents == 5800000 (8000000 - 2200000)"
            - "allowed_payback_cents + residual_to_estate_cents == 8000000 (balance partition conserved, zero drift)"
            - "MedicaidClaim.${claim_id}.status == SETTLED and Account.${acct_id}.status == CLOSED"
