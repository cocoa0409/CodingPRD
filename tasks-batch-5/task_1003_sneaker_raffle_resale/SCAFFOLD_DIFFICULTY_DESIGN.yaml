        distinguishing_aspect: "Trigger POST /disputes/{id}/resolve(REFUND): link1 order -> REFUNDED -> link2 seller.balance -= 27300 and completed_sales_count -= 1 -> link3 seller_level recomputed; a different originating transition from the verify cascade."
        test_recipe:
