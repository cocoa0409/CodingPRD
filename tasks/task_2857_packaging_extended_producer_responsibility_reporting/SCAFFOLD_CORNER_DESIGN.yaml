  - section: errors
    instances:
      - name: requests_with_a_missing_or_undeclared_role_header_are_unauthenticated
        claim_type: violation_to_error
        grounds:
          - validations.priority_1.check
          - errors.ERR_UNAUTHENTICATED
        distinguishing_aspect: "Authentication is checked before existence and before authorisation: a bogus role, an absent X-User-Role and an absent X-User-ID all return 401 ERR_UNAUTHENTICATED even when the path id does not exist."
        test_recipe:
          setup:
            - "One state program exists so that a valid target id is available."
            - "The pseudo-roles NO_ROLE_HEADER and NO_USER_ID_HEADER denote a request that omits X-User-Role and one that omits X-User-ID respectively."
          setup_api_calls:
            - call: "POST /epr/state-programs"
              payload: { state_code: "CA", obligation_basis: "ENTITY_LEVEL", eco_mod_policy: "BONUS_MALUS", fee_rounding_order: "PER_LINE_THEN_SUM", small_producer_revenue_threshold_usd: 1000000, small_producer_tonnage_threshold_kg: 1.000, exempt_product_categories: [], verification_required_threshold_kg: 3000, registration_deadline: "2026-12-31T23:59:59Z" }
              as: ProgramRegulator
              captures: { sp_x_id: $.data.id }
          trigger:
            - call: "GET /epr/state-programs/${sp_x_id}"
              payload: {}
              as: "Auditor"
              as_user_id: "auditor-001"
              captures: { e_auth1: $.data.error_id }
            - call: "GET /epr/state-programs/${sp_x_id}"
              payload: {}
              as: "NO_ROLE_HEADER"
              as_user_id: "someone-001"
              captures: { e_auth2: $.data.error_id }
            - call: "GET /epr/state-programs/${sp_x_id}"
              payload: {}
              as: "NO_USER_ID_HEADER"
              captures: { e_auth3: $.data.error_id }
            - call: "GET /epr/producers/77777777-7777-4777-8777-777777777777"
              payload: {}
              as: "Auditor"
              as_user_id: "auditor-001"
              captures: { e_auth4: $.data.error_id }
          assert:
            - "Trigger 1: HTTP 401 with error_id == ERR_UNAUTHENTICATED — Auditor is not one of the four declared roles"
            - "Trigger 2: HTTP 401 with error_id == ERR_UNAUTHENTICATED"
            - "Trigger 3: HTTP 401 with error_id == ERR_UNAUTHENTICATED — the role is declared but X-User-ID is absent"
            - "Trigger 4: HTTP 401 with error_id == ERR_UNAUTHENTICATED, not ERR_PRODUCER_NOT_FOUND — priority 1 outranks priority 4"
            - "StateProgram.${sp_x_id}.version == 1 — no rejected request mutated anything"

      - name: obligation_prerequisites_gate_activate_determine_and_registration_submit
        claim_type: violation_to_error
        grounds:
          - validations.priority_35.check
          - validations.priority_36.check
          - validations.priority_14.check
          - validations.priority_16.check
          - calculations.producer_obligation_role.formula
        distinguishing_aspect: "The four prerequisite gates fire in dependency order on one producer: activate needs a component (422), determine-obligation needs an ACTIVE SKU (422), registration create needs a determination (422), and a producer whose three flags are all false is classified NOT_OBLIGATED so its registration submit is refused (422)."
