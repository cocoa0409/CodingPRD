  - section: validations
    instances:
      - name: unknown_role_returns_unauthenticated_not_forbidden
        claim_type: priority_ordering
        grounds:
          - validations[priority=1]
          - validations[priority=2]
          - errors[ERR_UNAUTHENTICATED]
          - errors[ERR_FORBIDDEN_ROLE]
        distinguishing_aspect: |
          A request that violates BOTH the priority-1 auth gate (the role header names no declared role) and
          the priority-2 authz gate returns ERR_UNAUTHENTICATED (401) rather than ERR_FORBIDDEN_ROLE (403),
          pinning authentication above authorization.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /corps/regions"
              payload: { region_code: "GULF-COAST", name: "Gulf Coast", state_code: "TX", term_start_date: "2026-12-01T00:00:00Z", base_placement_fee_cents: 300000, max_corps_members: 10 }
              as: Ghost
              as_user_id: "ghost_1"
              captures: { err1: $.data.error_id }
            - call: "POST /corps/regions"
              payload: { region_code: "GULF-COAST", name: "Gulf Coast", state_code: "TX", term_start_date: "2026-12-01T00:00:00Z", base_placement_fee_cents: 300000, max_corps_members: 10 }
              as: Coach
              as_user_id: "coach_lee"
              captures: { err2: $.data.error_id }
          assert:
            - "With the undeclared role Ghost: data.error_id == ERR_UNAUTHENTICATED and HTTP status == 401"
            - "With the declared but unpermitted role Coach: data.error_id == ERR_FORBIDDEN_ROLE and HTTP status == 403"
            - "Authentication is checked before authorization, so the undeclared role never reaches the authz gate"
