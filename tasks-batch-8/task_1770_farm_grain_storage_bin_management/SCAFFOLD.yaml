# =============================================================================
# PRD Benchmark Seed Tables — On-Farm Grain Storage & Bin Management
# =============================================================================

scenario: |
  On-Farm Grain Storage & Bin Management (farm grain bin operation): bin inventory by crop/quality & fill date, aeration/temperature-cable monitoring & spoilage alert, insect control & fumigation record, load-out scheduling to contract delivery, shrink & invisible-loss accounting, bin entry safety protocol, storage cost vs basis-gain decision, insurance coverage on stored grain

domain_name: farm-grain-bin-management
api_prefix: /grain

complexity_profile:
  primary_archetype: posture_driven_gating      # Bin.posture (derived) gates fills, load-outs, entries
  secondary_archetype: compliance_audit          # fumigation REI, entry permits, segregation of duties, insurance claims
  complexity_layers:
    - derived_field_reconciliation   # lot.current_bu, bin.current_inventory_bu, contract.delivered_bu, bin.posture
    - rate_threshold_triggers        # spoilage score tiers, hotspot delta, REI hours, 98% fulfillment tolerance
    - optimistic_concurrency         # OCC on StorageContract.version for load-out creation
    - cascading_side_effects         # reading -> alert -> posture -> lot suspension -> loadout hold -> contract committed
  entity_topology: flat                          # peer entities joined by FK fields; no nested URL ownership
  state_machine_shape: posture_driven            # plus cyclic (Bin posture), parallel (LoadOut transport x settlement), revert (Contract FULFILLED->DELIVERING)
  relationship_patterns: [one_to_many, cross_aggregate]
  role_model: segregation_of_duties              # fumigation apply vs clear; permit request vs approve
  consistency_model: immediate                   # every mutation + cascade visible in the same response/read

# =============================================================================
# Table 1: Entity-Relationship Table (flat topology; all FKs canonical)
# =============================================================================
entities:
  - name: Bin
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Bin label (e.g. 'BIN-N1')" }
      - { name: capacity_bu, type: number, source: input, description: "Maximum bushels the bin can physically hold; 2dp, > 0" }
      - { name: crop, type: enum, source: input, description: "Current crop designation: CORN | SOYBEAN | WHEAT. All non-DEPLETED lots must match." }
      - { name: current_inventory_bu, type: number, source: computed, default: 0, description: "Sum of current_bu over all lots with bin_id = this bin (2dp)" }
      - { name: risk_score, type: number, source: computed, default: 0, description: "Latest spoilage_risk_score (0-100, 2dp); 0 when no readings" }
      - { name: posture, type: enum, source: computed, default: SOUND, description: "SOUND | WATCH | ALERT | FUMIGATION_LOCKOUT — see posture_derivation; gates fills, load-outs, entries" }
      - { name: insect_activity, type: boolean, source: system, default: false, description: "Mirrors insect_activity of the latest TemperatureReading (by recorded_at)" }
      - { name: last_reading_at, type: datetime, source: system, description: "recorded_at of the latest TemperatureReading; null when none", constraints: "nullable" }

  - name: GrainLot
    parent: null
    common_fields: true
    fields:
      - { name: bin_id, type: string, source: input, description: "FK -> Bin.id; bin receiving the fill" }
      - { name: crop, type: enum, source: input, description: "CORN | SOYBEAN | WHEAT; must equal bin.crop" }
      - { name: grade, type: enum, source: input, description: "USDA quality grade: GRADE_1 | GRADE_2 | GRADE_3" }
      - { name: fill_date, type: datetime, source: input, description: "When the lot was binned (ISO8601 UTC)" }
      - { name: original_bu, type: number, source: input, description: "Gross bushels binned, 2dp, > 0" }
      - { name: fill_moisture_pct, type: number, source: input, description: "Moisture at fill, 1dp, 0..40" }
      - { name: fill_basis_cents, type: integer, source: input, description: "Local basis (cents/bu vs futures) at fill; may be negative" }
      - { name: reference_price_cents_per_bu, type: integer, source: input, description: "Flat price reference at fill (cents/bu), > 0; used by carry interest" }
      - { name: current_moisture_pct, type: number, source: system, description: "Last known moisture; initialized = fill_moisture_pct" }
      - { name: provisional_shrink_bu, type: number, source: computed, default: 0, description: "provisional_shrink output at fill (2dp)" }
      - { name: current_bu, type: number, source: computed, description: "Book bushels: original_bu - provisional_shrink_bu - invisible losses - settled draws (2dp)" }
      - { name: drawn_bu, type: number, source: system, default: 0, description: "Net settled bushels drawn (draws minus void reversals), 2dp" }
      - { name: cumulative_invisible_loss_bu, type: number, source: computed, default: 0, description: "Sum of INVISIBLE_LOSS ShrinkEvents for this lot (2dp)" }
      - { name: cumulative_storage_charge_cents, type: integer, source: computed, default: 0, description: "Sum of monthly storage charges assessed against this lot" }
      - { name: months_assessed, type: integer, source: system, default: 0, description: "Count of StorageAssessments that have charged this lot" }
      - { name: status, type: enum, source: system, description: "STORED | PARTIALLY_DRAWN | SUSPENDED | DEPLETED" }

  - name: TemperatureReading
    parent: null
    common_fields: false
    fields:
      - { name: bin_id, type: string, source: input, description: "FK -> Bin.id; bin that was read" }
      - { name: recorded_at, type: datetime, source: input, description: "When the cable sweep was taken (ISO8601 UTC); out-of-order inserts allowed" }
      - { name: ambient_temp_f, type: number, source: input, description: "Outside air temperature, 1dp, -40..140" }
      - { name: cable_temps_f, type: array, source: input, description: "Per-cable grain temperatures (array of numbers, 1..12 entries)" }
      - { name: insect_activity, type: boolean, source: input, description: "Whether insects were observed during the check" }
      - { name: max_cable_temp_f, type: number, source: computed, description: "max(cable_temps_f)" }
      - { name: temp_delta_f, type: number, source: computed, description: "max_cable_temp_f - ambient_temp_f" }
      - { name: hotspot_triggered, type: boolean, source: computed, description: "true iff temp_delta_f >= HOTSPOT_DELTA_F or max_cable_temp_f >= HOTSPOT_ABS_F" }
      - { name: score_after, type: number, source: computed, description: "Bin risk_score as recomputed from this reading (2dp)" }

  - name: SpoilageAlert
    parent: null
    common_fields: true
    fields:
      - { name: bin_id, type: string, source: system, description: "FK -> Bin.id; bin that raised the alert" }
      - { name: reading_id, type: string, source: system, description: "FK -> TemperatureReading.id; reading that triggered the alert" }
      - { name: source, type: enum, source: system, default: AUTO_HOTSPOT, description: "AUTO_HOTSPOT (system-raised on hotspot detection)" }
      - { name: status, type: enum, source: system, description: "OPEN | RESOLVED | CONFIRMED_LOSS" }
      - { name: loss_bu, type: number, source: input, description: "Bushels lost; required iff close outcome = CONFIRMED_LOSS, forbidden otherwise (2dp, > 0)", constraints: "conditional" }
      - { name: closed_at, type: datetime, source: system, description: "Logical-clock time when closed; null while OPEN", constraints: "nullable" }

  - name: FumigationRecord
    parent: null
    common_fields: true
    fields:
      - { name: bin_id, type: string, source: input, description: "FK -> Bin.id; bin under fumigation" }
      - { name: applicator_id, type: string, source: input, description: "FK -> Applicator.id; MUST equal the caller's X-User-ID (segregation: applicator acts as self)" }
      - { name: product, type: enum, source: input, description: "PHOSPHINE (REI 72h) | SULFURYL_FLUORIDE (REI 24h)" }
      - { name: application_start, type: datetime, source: input, description: "When application begins; applicator occupancy interval start" }
      - { name: application_end, type: datetime, source: input, description: "When applicator finishes; must be > application_start. Occupancy [start, end] is CLOSED (touching conflicts)" }
      - { name: lockout_until, type: datetime, source: computed, description: "application_start + REI_HOURS[product]" }
      - { name: status, type: enum, source: system, description: "ACTIVE (created active) | CLEARED" }
      - { name: cleared_at, type: datetime, source: system, description: "Set on clear; null while ACTIVE", constraints: "nullable" }
      - { name: cleared_by_applicator_id, type: string, source: system, description: "FK -> Applicator.id; set on clear; MUST differ from applicator_id", constraints: "nullable" }

  - name: BinEntryPermit
    parent: null
    common_fields: true
    fields:
      - { name: bin_id, type: string, source: input, description: "FK -> Bin.id; bin to be entered" }
      - { name: planned_start, type: datetime, source: input, description: "Planned entry window start" }
      - { name: planned_end, type: datetime, source: input, description: "Planned entry window end; must be > planned_start" }
      - { name: atmosphere_test_passed, type: boolean, source: input, description: "Pre-entry atmosphere test result" }
      - { name: loto_confirmed, type: boolean, source: input, description: "Lockout-tagout on unloading auger confirmed" }
      - { name: requester_user_id, type: string, source: system, description: "X-User-ID of the creator" }
      - { name: approver_user_id, type: string, source: system, description: "X-User-ID of approver; MUST differ from requester_user_id; null until approved", constraints: "nullable" }
      - { name: status, type: enum, source: system, description: "REQUESTED | APPROVED | VOIDED (fumigation cascade) | EXPIRED (assessment sweep)" }

  - name: StorageContract
    parent: null
    common_fields: true
    fields:
      - { name: crop, type: enum, source: input, description: "CORN | SOYBEAN | WHEAT" }
      - { name: contracted_bu, type: number, source: input, description: "Contracted bushels, 2dp, > 0" }
      - { name: window_start, type: datetime, source: input, description: "Delivery window start (inclusive)" }
      - { name: window_end, type: datetime, source: input, description: "Delivery window end (inclusive); > window_start" }
      - { name: basis_cents_per_bu, type: integer, source: input, description: "Locked basis vs futures (cents/bu); may be negative" }
      - { name: futures_ref_cents_per_bu, type: integer, source: input, description: "Hedged futures reference (cents/bu), > 0" }
      - { name: early_bonus_cents_per_bu, type: integer, source: input, default: 0, description: "Bonus per settled bu if delivered_at <= early_cutoff" }
      - { name: early_cutoff, type: datetime, source: input, description: "Early-delivery cutoff; null = no bonus", constraints: "nullable" }
      - { name: contract_unit_price_cents, type: integer, source: computed, description: "futures_ref_cents_per_bu + basis_cents_per_bu" }
      - { name: committed_bu, type: number, source: computed, default: 0, description: "Sum of planned_bu over loadouts with transport_status in {SCHEDULED, DISPATCHED} (HELD excluded), 2dp" }
      - { name: delivered_bu, type: number, source: computed, default: 0, description: "Sum of settled_net_bu over loadouts with settlement_status = SETTLED, 2dp" }
      - { name: settled_value_cents, type: integer, source: computed, default: 0, description: "Sum of settlement_net_cents over SETTLED loadouts (money invariant anchor)" }
      - { name: fulfillment_ratio, type: number, source: computed, default: 0, description: "delivered_bu / contracted_bu, 4dp" }
      - { name: status, type: enum, source: system, description: "OPEN | DELIVERING | FULFILLED | DEFAULTED" }

  - name: LoadOut
    parent: null
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: input, description: "FK -> StorageContract.id; contract being delivered against" }
      - { name: bin_id, type: string, source: input, description: "FK -> Bin.id; source bin (crop must equal contract.crop)" }
      - { name: scheduled_start, type: datetime, source: input, description: "Load-out window start; HALF-OPEN [start, end) overlap on the bin" }
      - { name: scheduled_end, type: datetime, source: input, description: "Load-out window end (exclusive); > scheduled_start; window must lie within contract window" }
      - { name: planned_bu, type: number, source: input, description: "Planned bushels, 2dp, > 0; <= contract remaining" }
      - { name: transport_status, type: enum, source: system, description: "SCHEDULED | HELD | DISPATCHED | DELIVERED | EXPIRED" }
      - { name: settlement_status, type: enum, source: system, description: "UNSETTLED | SETTLED | VOIDED (independent parallel dimension)" }
      - { name: scale_tickets, type: array, source: input, description: "At deliver: [{ticket_no, gross_bu, moisture_pct}]; ticket_no unique within loadout" }
      - { name: delivered_at, type: datetime, source: input, description: "Actual delivery timestamp supplied at deliver", constraints: "set by deliver" }
      - { name: gross_bu, type: number, source: computed, description: "Sum of ticket gross_bu (2dp)" }
      - { name: ticket_shrink_bu, type: number, source: computed, description: "Sum of per-ticket rounded shrink (settlement_shrink, 2dp)" }
      - { name: settled_net_bu, type: number, source: computed, description: "Sum of per-ticket net bushels (2dp)" }
      - { name: grain_value_cents, type: integer, source: computed, description: "settlement_charges: settled_net_bu * contract_unit_price_cents (set at confirm)" }
      - { name: service_fee_cents, type: integer, source: computed, description: "Tiered fee on grain_value_cents (set at confirm)" }
      - { name: early_bonus_cents, type: integer, source: computed, description: "settled_net_bu * early_bonus_cents_per_bu when delivered_at <= early_cutoff else 0 (set at confirm)" }
      - { name: settlement_net_cents, type: integer, source: computed, description: "grain_value_cents - service_fee_cents + early_bonus_cents (set at confirm)" }
      - { name: draws, type: array, source: system, description: "Per-lot waterfall draws [{lot_id, bu}] recorded at confirm; reversed by void" }
      - { name: held_reason, type: enum, source: system, description: "null | POSTURE — set when posture cascade holds the loadout", constraints: "nullable" }

  - name: Applicator
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Certified applicator name" }
      - { name: license_no, type: string, source: input, description: "State applicator license number" }
      - { name: cert_expires_at, type: datetime, source: input, description: "Certification expiry; fumigation application_start must be <= this" }

  - name: InsurancePolicy
    parent: null
    common_fields: true
    fields:
      - { name: crop, type: enum, source: input, description: "CORN | SOYBEAN | WHEAT — covered crop" }
      - { name: coverage_limit_cents, type: integer, source: input, description: "Aggregate indemnity cap, > 0" }
      - { name: deductible_cents, type: integer, source: input, description: "Per-claim deductible, >= 0; applied AFTER the coverage cap" }
      - { name: valuation_clause, type: enum, source: input, description: "SPOT | CONTRACT_AVG — indemnity dual-variant selector" }
      - { name: period_start, type: datetime, source: input, description: "Coverage period start (inclusive)" }
      - { name: period_end, type: datetime, source: input, description: "Coverage period end (inclusive); > period_start" }
      - { name: remaining_coverage_cents, type: integer, source: computed, description: "coverage_limit_cents - sum of indemnity_cents over APPROVED claims" }
      - { name: status, type: enum, source: system, description: "ACTIVE (created active) | EXPIRED (assessment sweep when period_end < now)" }

  - name: InsuranceClaim
    parent: null
    common_fields: true
    fields:
      - { name: policy_id, type: string, source: input, description: "FK -> InsurancePolicy.id" }
      - { name: spoilage_alert_id, type: string, source: input, description: "FK -> SpoilageAlert.id; alert must be CONFIRMED_LOSS" }
      - { name: loss_bu, type: number, source: system, description: "Copied from the alert's loss_bu at submit (2dp)" }
      - { name: unit_value_cents, type: number, source: computed, description: "Per-bu valuation at approve per policy.valuation_clause (2dp)" }
      - { name: gross_indemnity_cents, type: integer, source: computed, description: "round_half_up(loss_bu * unit_value_cents) before cap" }
      - { name: indemnity_cents, type: integer, source: computed, description: "max(0, min(gross_indemnity_cents, remaining_coverage_cents) - deductible_cents)" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | APPROVED" }

  - name: StorageAssessment
    parent: null
    common_fields: false
    fields:
      - { name: period, type: string, source: input, description: "Assessment month 'YYYY-MM'; globally unique (idempotency key)" }
      - { name: lots_assessed, type: integer, source: computed, description: "Lots charged + invisible-loss-posted this run" }
      - { name: total_storage_charge_cents, type: integer, source: computed, description: "Sum of per-lot rounded charges" }
      - { name: total_invisible_loss_bu, type: number, source: computed, description: "Sum of per-lot rounded invisible losses (2dp)" }
      - { name: contracts_defaulted, type: integer, source: computed, description: "Contracts swept to DEFAULTED this run" }
      - { name: contracts_fulfilled, type: integer, source: computed, description: "Contracts swept to FULFILLED this run" }
      - { name: permits_expired, type: integer, source: computed, description: "Permits swept to EXPIRED this run" }
      - { name: loadouts_expired, type: integer, source: computed, description: "LoadOuts swept to EXPIRED this run" }
      - { name: policies_expired, type: integer, source: computed, description: "Policies swept to EXPIRED this run" }

  - name: ShrinkEvent
    parent: null
    common_fields: false
    fields:
      - { name: lot_id, type: string, source: system, description: "FK -> GrainLot.id; lot the shrink posted against" }
      - { name: kind, type: enum, source: system, description: "PROVISIONAL (at fill) | INVISIBLE_LOSS (monthly assessment)" }
      - { name: shrink_bu, type: number, source: system, description: "Bushels removed from book inventory (2dp)" }
      - { name: period, type: string, source: system, description: "Assessment period for INVISIBLE_LOSS; null for PROVISIONAL", constraints: "nullable" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: Bin
    initial_state: SOUND
    terminal_states: []
    note: "posture is a stored derived field (posture_derivation); transitions fire on recompute triggers: reading create, alert close, fumigation create/clear, lot create, confirm/void settlement, assessment run. now = logical clock."
    transitions:
      - { from: SOUND, to: WATCH, trigger: "system recompute (latest risk_score >= 40 and < 70, no OPEN alert, no active fumigation)", actor: system, preconditions: [], side_effects: [] }
      - { from: WATCH, to: SOUND, trigger: "system recompute (risk_score < 40)", actor: system, preconditions: [], side_effects: [] }
      - { from: WATCH, to: ALERT, trigger: "system recompute (risk_score >= 70 or an OPEN SpoilageAlert exists)", actor: system, preconditions: [], side_effects: ["gate cascade: lots {STORED, PARTIALLY_DRAWN} -> SUSPENDED", "loadouts {SCHEDULED} on bin -> HELD (held_reason=POSTURE)", "each HELD loadout -> contract.committed_bu -= planned_bu"] }
      - { from: SOUND, to: ALERT, trigger: "system recompute (risk_score >= 70 or an OPEN SpoilageAlert exists)", actor: system, preconditions: [], side_effects: ["gate cascade: lots {STORED, PARTIALLY_DRAWN} -> SUSPENDED", "loadouts {SCHEDULED} on bin -> HELD (held_reason=POSTURE)", "each HELD loadout -> contract.committed_bu -= planned_bu"] }
      - { from: SOUND, to: FUMIGATION_LOCKOUT, trigger: "system recompute (ACTIVE fumigation with application_start <= now on bin)", actor: system, preconditions: [], side_effects: ["gate cascade: lots {STORED, PARTIALLY_DRAWN} -> SUSPENDED", "loadouts {SCHEDULED} on bin -> HELD (held_reason=POSTURE)", "each HELD loadout -> contract.committed_bu -= planned_bu", "permits {REQUESTED, APPROVED} on bin -> VOIDED"] }
      - { from: WATCH, to: FUMIGATION_LOCKOUT, trigger: "system recompute (ACTIVE fumigation with application_start <= now)", actor: system, preconditions: [], side_effects: ["gate cascade: lots {STORED, PARTIALLY_DRAWN} -> SUSPENDED", "loadouts {SCHEDULED} -> HELD", "each HELD loadout -> contract.committed_bu -= planned_bu", "permits {REQUESTED, APPROVED} -> VOIDED"] }
      - { from: ALERT, to: FUMIGATION_LOCKOUT, trigger: "system recompute (ACTIVE fumigation with application_start <= now)", actor: system, preconditions: [], side_effects: ["permits {REQUESTED, APPROVED} -> VOIDED; lots/loadouts already gated"] }
      - { from: ALERT, to: WATCH, trigger: "system recompute (no OPEN alert, no active fumigation, 40 <= risk_score < 70)", actor: system, preconditions: [], side_effects: ["release cascade: SUSPENDED lots -> (drawn_bu > 0 ? PARTIALLY_DRAWN : STORED)", "HELD loadouts -> SCHEDULED (held_reason=null)", "each released loadout -> contract.committed_bu += planned_bu"] }
      - { from: ALERT, to: SOUND, trigger: "system recompute (no OPEN alert, no active fumigation, risk_score < 40)", actor: system, preconditions: [], side_effects: ["release cascade: SUSPENDED lots -> (drawn_bu > 0 ? PARTIALLY_DRAWN : STORED)", "HELD loadouts -> SCHEDULED", "each released loadout -> contract.committed_bu += planned_bu"] }
      - { from: FUMIGATION_LOCKOUT, to: SOUND, trigger: "system recompute (fumigation CLEARED, no OPEN alert, risk_score < 40)", actor: system, preconditions: [], side_effects: ["release cascade: SUSPENDED lots -> (drawn_bu > 0 ? PARTIALLY_DRAWN : STORED)", "HELD loadouts -> SCHEDULED", "each released loadout -> contract.committed_bu += planned_bu"] }
      - { from: FUMIGATION_LOCKOUT, to: WATCH, trigger: "system recompute (fumigation CLEARED, no OPEN alert, 40 <= risk_score < 70)", actor: system, preconditions: [], side_effects: ["release cascade as above"] }
      - { from: FUMIGATION_LOCKOUT, to: ALERT, trigger: "system recompute (fumigation CLEARED, OPEN alert or risk_score >= 70)", actor: system, preconditions: [], side_effects: ["no release: lots stay SUSPENDED, loadouts stay HELD"] }
      - { from: WATCH, to: WATCH, trigger: "system recompute (score changes within [40,70))", actor: system, preconditions: [], side_effects: ["risk_score field updated only"], note: "self-loop: no gate cascade" }

  - entity: GrainLot
    initial_state: STORED
    terminal_states: [DEPLETED]
    transitions:
      - { from: STORED, to: PARTIALLY_DRAWN, trigger: "POST /grain/loadouts/{id}/confirm-settlement (waterfall draws > 0 from this lot)", actor: system, preconditions: [], side_effects: ["current_bu -= drawn", "drawn_bu += drawn"] }
      - { from: PARTIALLY_DRAWN, to: DEPLETED, trigger: "POST /grain/loadouts/{id}/confirm-settlement or assessment invisible loss (current_bu reaches 0.00)", actor: system, preconditions: [], side_effects: ["bin.current_inventory_bu recompute", "bin posture recompute (moisture/staleness input set changes)"] }
      - { from: STORED, to: DEPLETED, trigger: "assessment invisible loss (current_bu reaches 0.00 with no draws)", actor: system, preconditions: [], side_effects: ["bin.current_inventory_bu recompute"] }
      - { from: STORED, to: SUSPENDED, trigger: "bin posture enters ALERT or FUMIGATION_LOCKOUT", actor: system, preconditions: [], side_effects: [] }
      - { from: PARTIALLY_DRAWN, to: SUSPENDED, trigger: "bin posture enters ALERT or FUMIGATION_LOCKOUT", actor: system, preconditions: [], side_effects: [] }
      - { from: SUSPENDED, to: STORED, trigger: "bin posture returns to SOUND or WATCH and drawn_bu == 0", actor: system, preconditions: [], side_effects: [] }
      - { from: SUSPENDED, to: PARTIALLY_DRAWN, trigger: "bin posture returns to SOUND or WATCH and drawn_bu > 0", actor: system, preconditions: [], side_effects: [] }
      - { from: PARTIALLY_DRAWN, to: STORED, trigger: "POST /grain/loadouts/{id}/void-settlement (full reversal brings drawn_bu to 0)", actor: system, preconditions: [], side_effects: ["current_bu += reversed draw", "drawn_bu -= reversed draw"] }
      - { from: DEPLETED, to: PARTIALLY_DRAWN, trigger: "POST /grain/loadouts/{id}/void-settlement (reversal credits bushels back)", actor: system, preconditions: [], side_effects: ["current_bu += reversed draw", "drawn_bu -= reversed draw", "bin.current_inventory_bu recompute"] }

  - entity: SpoilageAlert
    initial_state: OPEN
    terminal_states: [RESOLVED, CONFIRMED_LOSS]
    transitions:
      - { from: OPEN, to: RESOLVED, trigger: "POST /grain/spoilage-alerts/{id}/close (outcome=RESOLVED)", actor: SiteManager, preconditions: ["status == OPEN (ERR_ALERT_NOT_OPEN)", "loss_bu absent (ERR_VALIDATION)"], side_effects: ["closed_at = now", "bin posture recompute"] }
      - { from: OPEN, to: CONFIRMED_LOSS, trigger: "POST /grain/spoilage-alerts/{id}/close (outcome=CONFIRMED_LOSS)", actor: SiteManager, preconditions: ["status == OPEN (ERR_ALERT_NOT_OPEN)", "loss_bu present and > 0 (ERR_VALIDATION)"], side_effects: ["closed_at = now", "loss_bu recorded", "bin posture recompute"] }

  - entity: FumigationRecord
    initial_state: ACTIVE
    terminal_states: [CLEARED]
    transitions:
      - { from: ACTIVE, to: CLEARED, trigger: "POST /grain/fumigations/{id}/clear", actor: CertifiedApplicator, preconditions: ["caller X-User-ID != applicator_id (ERR_SOD_SAME_APPLICATOR)", "status == ACTIVE (ERR_FUMIGATION_NOT_ACTIVE)", "now >= lockout_until (ERR_REI_NOT_ELAPSED)"], side_effects: ["cleared_at = now", "cleared_by_applicator_id = caller", "bin posture recompute (lockout lifted)", "release cascade if posture returns to SOUND/WATCH"] }

  - entity: BinEntryPermit
    initial_state: REQUESTED
    terminal_states: [VOIDED, EXPIRED]
    transitions:
      - { from: REQUESTED, to: APPROVED, trigger: "POST /grain/entry-permits/{id}/approve", actor: SafetyOfficer, preconditions: ["caller X-User-ID != requester_user_id (ERR_SOD_PERMIT_SELF_APPROVE)", "status == REQUESTED (ERR_PERMIT_NOT_REQUESTED)", "no ACTIVE fumigation with application_start <= now on bin (ERR_ACTIVE_FUMIGATION_EXISTS)", "atmosphere_test_passed == true and loto_confirmed == true (ERR_ATMOSPHERE_UNSAFE)"], side_effects: ["approver_user_id = caller"] }
      - { from: REQUESTED, to: VOIDED, trigger: "system (fumigation created on the same bin)", actor: system, preconditions: [], side_effects: [] }
      - { from: APPROVED, to: VOIDED, trigger: "system (fumigation created on the same bin)", actor: system, preconditions: [], side_effects: [] }
      - { from: REQUESTED, to: EXPIRED, trigger: "system (assessment sweep: planned_end < now)", actor: system, preconditions: [], side_effects: [] }
      - { from: APPROVED, to: EXPIRED, trigger: "system (assessment sweep: planned_end < now)", actor: system, preconditions: [], side_effects: [] }

  - entity: StorageContract
    initial_state: OPEN
    terminal_states: [FULFILLED, DEFAULTED]
    transitions:
      - { from: OPEN, to: DELIVERING, trigger: "POST /grain/loadouts (first non-expired loadout created)", actor: SiteManager, preconditions: [], side_effects: ["contract.version += 1", "committed_bu += planned_bu"] }
      - { from: DELIVERING, to: FULFILLED, trigger: "POST /grain/loadouts/{id}/confirm-settlement (delivered_bu >= contracted_bu * 0.98)", actor: system, preconditions: [], side_effects: [] }
      - { from: FULFILLED, to: DELIVERING, trigger: "POST /grain/loadouts/{id}/void-settlement (delivered_bu falls below contracted_bu * 0.98)", actor: system, preconditions: [], side_effects: ["delivered_bu -= settled_net_bu", "settled_value_cents -= settlement_net_cents", "contract.version += 1"], note: "revert transition (cycle)" }
      - { from: OPEN, to: DEFAULTED, trigger: "system (assessment sweep: window_end < now and delivered_bu < contracted_bu * 0.98)", actor: system, preconditions: [], side_effects: ["contract.version += 1"] }
      - { from: DELIVERING, to: DEFAULTED, trigger: "system (assessment sweep: window_end < now and delivered_bu < contracted_bu * 0.98)", actor: system, preconditions: [], side_effects: ["contract.version += 1"] }
      - { from: OPEN, to: FULFILLED, trigger: "system (assessment sweep: window_end < now and delivered_bu >= contracted_bu * 0.98)", actor: system, preconditions: [], side_effects: ["contract.version += 1"], note: "edge: fulfilled without any loadout only if contracted == 0 — unreachable since contracted_bu > 0; kept for machine completeness of the sweep rule" }
      - { from: DELIVERING, to: FULFILLED, trigger: "system (assessment sweep: window_end < now and delivered_bu >= contracted_bu * 0.98)", actor: system, preconditions: [], side_effects: ["contract.version += 1"] }

  - entity: LoadOut
    initial_state: SCHEDULED
    terminal_states: [DELIVERED, EXPIRED]
    note: "PARALLEL dimensions: transport_status (SCHEDULED|HELD|DISPATCHED|DELIVERED|EXPIRED) x settlement_status (UNSETTLED|SETTLED|VOIDED). settlement transitions require transport DELIVERED; transport terminal DELIVERED while settlement may still move UNSETTLED->SETTLED->VOIDED."
    transitions:
      - { from: SCHEDULED, to: DISPATCHED, trigger: "POST /grain/loadouts/{id}/dispatch", actor: SiteManager, preconditions: ["transport_status == SCHEDULED (ERR_LOADOUT_STATE)", "bin.posture in {SOUND, WATCH} (ERR_BIN_POSTURE_BLOCKED)", "contract.status in {OPEN, DELIVERING} (ERR_CONTRACT_NOT_OPEN)"], side_effects: [] }
      - { from: DISPATCHED, to: DELIVERED, trigger: "POST /grain/loadouts/{id}/deliver", actor: SiteManager, preconditions: ["transport_status == DISPATCHED (ERR_LOADOUT_STATE)", "scale_tickets non-empty, ticket_no unique within loadout, gross_bu > 0, 0 <= moisture_pct <= 40 (ERR_VALIDATION)"], side_effects: ["settlement_shrink per ticket (round per ticket, then sum)", "gross_bu / ticket_shrink_bu / settled_net_bu computed", "delivered_at recorded"] }
      - { from: SCHEDULED, to: HELD, trigger: "system (bin posture enters ALERT or FUMIGATION_LOCKOUT)", actor: system, preconditions: [], side_effects: ["held_reason = POSTURE", "contract.committed_bu -= planned_bu", "contract.version += 1"] }
      - { from: HELD, to: SCHEDULED, trigger: "system (bin posture returns to SOUND or WATCH)", actor: system, preconditions: [], side_effects: ["held_reason = null", "contract.committed_bu += planned_bu", "contract.version += 1"] }
      - { from: SCHEDULED, to: EXPIRED, trigger: "system (assessment sweep: scheduled_end < now)", actor: system, preconditions: [], side_effects: ["contract.committed_bu -= planned_bu", "contract.version += 1"] }
      - { from: HELD, to: EXPIRED, trigger: "system (assessment sweep: scheduled_end < now)", actor: system, preconditions: [], side_effects: [] }
      - { from: UNSETTLED, to: SETTLED, trigger: "POST /grain/loadouts/{id}/confirm-settlement", actor: SiteManager, preconditions: ["transport_status == DELIVERED (ERR_LOADOUT_STATE)", "settlement_status == UNSETTLED (ERR_SETTLEMENT_STATE)", "contract.status in {OPEN, DELIVERING} (ERR_CONTRACT_NOT_OPEN)", "waterfall: sum of eligible lot current_bu >= settled_net_bu (ERR_LOTS_INSUFFICIENT)"], side_effects: ["settlement_charges computed (grain_value, fee tier, bonus, net)", "allocation_waterfall debits lots FIFO (fill_date ASC, created_at ASC tie-break)", "lots -> PARTIALLY_DRAWN / DEPLETED", "contract.delivered_bu += settled_net_bu", "contract.settled_value_cents += settlement_net_cents", "contract.version += 1", "contract -> FULFILLED if delivered_bu >= 98% of contracted_bu", "bin.current_inventory_bu + posture recompute"] }
      - { from: SETTLED, to: VOIDED, trigger: "POST /grain/loadouts/{id}/void-settlement", actor: SiteManager, preconditions: ["settlement_status == SETTLED (ERR_SETTLEMENT_STATE)"], side_effects: ["reverse each draw: lot.current_bu += bu, drawn_bu -= bu (DEPLETED lots revive to PARTIALLY_DRAWN)", "contract.delivered_bu -= settled_net_bu", "contract.settled_value_cents -= settlement_net_cents", "contract.version += 1", "contract FULFILLED -> DELIVERING if ratio drops below 0.98", "bin.current_inventory_bu + posture recompute"] }

  - entity: InsurancePolicy
    initial_state: ACTIVE
    terminal_states: [EXPIRED]
    transitions:
      - { from: ACTIVE, to: EXPIRED, trigger: "system (assessment sweep: period_end < now)", actor: system, preconditions: [], side_effects: [] }

  - entity: InsuranceClaim
    initial_state: SUBMITTED
    terminal_states: [APPROVED]
    transitions:
      - { from: SUBMITTED, to: APPROVED, trigger: "POST /grain/claims/{id}/approve", actor: FarmOwner, preconditions: ["status == SUBMITTED (ERR_CLAIM_NOT_SUBMITTED)", "policy.valuation_clause == SPOT requires spot_price_cents_per_bu present; CONTRACT_AVG forbids it (ERR_VALIDATION)"], side_effects: ["indemnity computed per valuation variant", "policy.remaining_coverage_cents -= indemnity_cents", "policy.version += 1"] }

# =============================================================================
# Table 2.1: Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: loadout-create-stale-contract
    parent_entity: StorageContract
    write_endpoint: "POST /grain/loadouts"
    occ_field: expected_contract_version
    description: |
      Creating a LoadOut against a StorageContract pins the contract version the
      client last observed. If the contract's version has since advanced (another
      load-out creation committed bushels, a settlement posted, or a sweep
      defaulted the contract), the create is rejected as stale and the client
      must re-read the contract before re-planning.
    error_id: ERR_STALE_CONTRACT_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: provisional_shrink
    trigger: "GrainLot creation"
    algorithm: threshold
    formula: |
      std = STANDARD_MOISTURE_PCT[lot.crop]
      if lot.fill_moisture_pct > std:
        points = fill_moisture_pct - std
        provisional_shrink_bu = round_half_up(original_bu * points * SHRINK_FACTOR_PCT_PER_POINT / 100, 2)
      else:
        provisional_shrink_bu = 0.00            # strictly greater-than: at-or-below standard shrinks nothing
      current_bu = original_bu - provisional_shrink_bu
      post ShrinkEvent(kind=PROVISIONAL, shrink_bu=provisional_shrink_bu) when provisional_shrink_bu > 0
    input_set: "the new lot only"
    constants:
      SHRINK_FACTOR_PCT_PER_POINT: 1.35        # per moisture point, includes ~0.5% handling/invisible component
      STANDARD_MOISTURE_PCT: { CORN: 15.0, SOYBEAN: 13.0, WHEAT: 13.5 }
    precision: "bushels 2 decimal places, round_half_up"
    variants:
      - { name: PROVISIONAL, when: "at fill (book bushels)", difference: "single computation on whole lot using fill moisture; one rounding" }

  - name: settlement_shrink
    trigger: "POST /grain/loadouts/{id}/deliver"
    algorithm: chronological
    formula: |
      std = STANDARD_MOISTURE_PCT[contract.crop]
      for each ticket in scale_tickets (processed in the array order given):
        ticket_shrink = round_half_up(gross_bu * max(0, moisture_pct - std) * SHRINK_FACTOR_PCT_PER_POINT / 100, 2)
        ticket_net    = round_half_up(gross_bu - ticket_shrink, 2)
      ticket_shrink_bu = sum(ticket_shrink)     # PINNED ROUNDING ORDER: round per ticket, THEN sum
      settled_net_bu   = sum(ticket_net)        # (sum-then-round of the whole loadout is a DIFFERENT number and is forbidden)
    input_set: "the loadout's scale_tickets array"
    constants:
      SHRINK_FACTOR_PCT_PER_POINT: 1.35
      STANDARD_MOISTURE_PCT: { CORN: 15.0, SOYBEAN: 13.0, WHEAT: 13.5 }
    precision: "bushels 2 decimal places, round_half_up, per ticket before summation"
    variants:
      - { name: SETTLEMENT, when: "at delivery (scale tickets)", difference: "per-ticket computation using delivery moisture; rounding applied per ticket then summed — diverges from PROVISIONAL for the same physical grain" }

  - name: spoilage_risk_score
    trigger: "TemperatureReading creation (and recompute on lot/posture-affecting changes)"
    algorithm: weighted_scoring
    formula: |
      reading = the bin's reading with the maximum recorded_at (out-of-order inserts resolved by recorded_at, never by arrival order)
      T_max = reading.max_cable_temp_f; T_amb = reading.ambient_temp_f
      S = lots with bin_id = bin and status != DEPLETED and current_bu > 0
      if S empty: moisture_term = 0; staleness_term = 0
      else:
        M = sum(lot.current_bu * lot.current_moisture_pct for S) / sum(lot.current_bu for S)
        std = STANDARD_MOISTURE_PCT[bin.crop]
        moisture_term = clamp((M - std) / 4, 0, 1) * 25
        D = floor((reading.recorded_at - min(lot.fill_date for S)) / 86400 seconds)
        staleness_term = clamp(D / STALE_DAYS_FULL, 0, 1) * 15
      temp_term = clamp((T_max - T_amb - TEMP_EXCURSION_F) / 20, 0, 1) * 50
      insect_term = 10 if reading.insect_activity else 0
      score = round_half_up(temp_term + moisture_term + staleness_term + insect_term, 2)
      hotspot iff (T_max - T_amb >= HOTSPOT_DELTA_F) or (T_max >= HOTSPOT_ABS_F)   # independent of score
    input_set: "latest reading by recorded_at; non-depleted lots with current_bu > 0 in the bin"
    constants:
      TEMP_EXCURSION_F: 10.0
      HOTSPOT_DELTA_F: 30.0
      HOTSPOT_ABS_F: 110.0
      STALE_DAYS_FULL: 30
      STANDARD_MOISTURE_PCT: { CORN: 15.0, SOYBEAN: 13.0, WHEAT: 13.5 }
    precision: "score 2 decimal places, round_half_up"

  - name: posture_derivation
    trigger: "after any risk_score change, alert open/close, fumigation create/clear, lot inventory change, assessment sweep"
    algorithm: threshold
    formula: |
      if exists FumigationRecord(bin, status=ACTIVE, application_start <= now):  posture = FUMIGATION_LOCKOUT
      elif exists SpoilageAlert(bin, status=OPEN):                              posture = ALERT
      elif risk_score >= SCORE_ALERT:                                            posture = ALERT      # >= : exactly 70.00 alerts
      elif risk_score >= SCORE_WATCH:                                            posture = WATCH      # >= : exactly 40.00 watches
      else:                                                                      posture = SOUND
      Entering {ALERT, FUMIGATION_LOCKOUT} from {SOUND, WATCH}: gate cascade (lots SUSPENDED, SCHEDULED loadouts HELD, permits VOIDED on fumigation).
      Entering {SOUND, WATCH} from {ALERT, FUMIGATION_LOCKOUT}: release cascade.
    input_set: "bin's fumigations, alerts, latest risk_score"
    constants: { SCORE_WATCH: 40.0, SCORE_ALERT: 70.0 }
    precision: "exact threshold comparison, >= inclusive"

  - name: allocation_waterfall
    trigger: "POST /grain/loadouts/{id}/confirm-settlement"
    algorithm: waterfall_allocation
    formula: |
      eligible = lots with bin_id = loadout.bin_id AND status in {STORED, PARTIALLY_DRAWN} AND current_bu > 0
                 (SUSPENDED and DEPLETED lots are excluded)
      order eligible by fill_date ASC, tie-break created_at ASC                  # FIFO; never id
      if sum(eligible.current_bu) < settled_net_bu: reject ERR_LOTS_INSUFFICIENT
      remaining = settled_net_bu
      for lot in ordered eligible:
        take = min(lot.current_bu, remaining); lot.current_bu -= take; lot.drawn_bu += take
        record draw {lot_id, bu: take}; remaining -= take
        if lot.current_bu == 0.00: lot -> DEPLETED
        elif take > 0: lot -> PARTIALLY_DRAWN
    input_set: "lots of the loadout's bin in eligible states"
    precision: "bushels 2 decimal places"

  - name: settlement_charges
    trigger: "POST /grain/loadouts/{id}/confirm-settlement (after waterfall eligibility passes)"
    algorithm: tiered_pricing
    formula: |
      PINNED EVALUATION ORDER (the fee tier is keyed on the PRE-FEE grain value — not on the net):
      1. grain_value_cents = round_half_up(settled_net_bu * contract.contract_unit_price_cents, 0)
      2. fee_bps = 150 if grain_value_cents <  TIER1_FLOOR_CENTS
                 = 100 if TIER1_FLOOR_CENTS <= grain_value_cents <  TIER2_FLOOR_CENTS
                 =  75 if grain_value_cents >= TIER2_FLOOR_CENTS      # >= : exactly 500000 takes the 75bps tier
      3. service_fee_cents = round_half_up(grain_value_cents * fee_bps / 10000, 0)
      4. early_bonus_cents = settled_net_bu * contract.early_bonus_cents_per_bu
                             if contract.early_cutoff != null and delivered_at <= early_cutoff else 0
      5. settlement_net_cents = grain_value_cents - service_fee_cents + early_bonus_cents
    input_set: "the loadout + its contract"
    constants: { TIER1_FLOOR_CENTS: 200000, TIER2_FLOOR_CENTS: 500000 }
    precision: "integer cents, round_half_up"

  - name: contract_fulfillment
    trigger: "confirm-settlement, void-settlement, assessment sweep"
    algorithm: threshold
    formula: |
      fulfillment_ratio = round_half_up(delivered_bu / contracted_bu, 4)
      fulfilled iff delivered_bu >= contracted_bu * (100 - UNDER_DELIVERY_TOLERANCE_PCT) / 100
      # bushel comparison, not ratio comparison: exactly 98.00% fulfills; 97.99% does not
    input_set: "the contract"
    constants: { UNDER_DELIVERY_TOLERANCE_PCT: 2.0 }
    precision: "bushels 2dp exact comparison"

  - name: monthly_assessment
    trigger: "POST /grain/assessments (period YYYY-MM, globally unique)"
    algorithm: tiered_pricing
    formula: |
      now = logical clock; m(fill) = fill month YYYY-MM
      eligible lots: current_bu > 0 AND m(fill_date) <= period
      per lot, IN ORDER (charge uses PRE-LOSS current_bu):
        diff = (period.year - fill.year)*12 + (period.month - fill.month)
        rate = 3 if diff <= 3 else 4 if diff <= 6 else 5               # cents/bu/month tier by months since fill
        charge = round_half_up(current_bu * rate, 0)                   # round per lot, then sum
        lot.cumulative_storage_charge_cents += charge; lot.months_assessed += 1
        loss = round_half_up(current_bu * INVISIBLE_LOSS_MONTHLY_PCT / 100, 2)
        if loss > 0: post ShrinkEvent(kind=INVISIBLE_LOSS, shrink_bu=loss, period)
        lot.current_bu -= loss; lot.cumulative_invisible_loss_bu += loss
        if lot.current_bu <= 0: lot.current_bu = 0.00; lot -> DEPLETED
      sweeps (all use now):
        contracts {OPEN, DELIVERING} with window_end < now: delivered_bu >= 98% -> FULFILLED else DEFAULTED
        loadouts {SCHEDULED, HELD} with scheduled_end < now -> EXPIRED (SCHEDULED ones release committed_bu)
        permits {REQUESTED, APPROVED} with planned_end < now -> EXPIRED
        policies ACTIVE with period_end < now -> EXPIRED
      affected bins: current_inventory_bu + posture recompute
    input_set: "all lots, contracts, loadouts, permits, policies"
    constants: { INVISIBLE_LOSS_MONTHLY_PCT: 0.20 }
    precision: "charges integer cents round_half_up per lot; losses 2dp round_half_up per lot"

  - name: indemnity
    trigger: "POST /grain/claims/{id}/approve"
    algorithm: weighted_scoring
    formula: |
      valuation per policy.valuation_clause:
        SPOT:         unit_value_cents = spot_price_cents_per_bu (required approve input)
        CONTRACT_AVG: pool = contracts with crop = policy.crop AND status in {OPEN, DELIVERING}
                      AND window_start <= alert.closed_at <= window_end
                      if pool empty: FALL BACK to SPOT (spot_price_cents_per_bu then required)
                      else unit_value_cents = sum(c.contract_unit_price_cents * c.contracted_bu) / sum(c.contracted_bu)
      gross_indemnity_cents = round_half_up(loss_bu * unit_value_cents, 0)
      indemnity_cents = max(0, min(gross_indemnity_cents, policy.remaining_coverage_cents) - policy.deductible_cents)
      # order pinned: coverage cap binds BEFORE the deductible is subtracted
    input_set: "the claim, its policy, qualifying contracts (CONTRACT_AVG)"
    precision: "unit value 2dp; money integer cents round_half_up"
    variants:
      - { name: SPOT, when: "policy.valuation_clause = SPOT", difference: "values loss at the operator-supplied spot price" }
      - { name: CONTRACT_AVG, when: "policy.valuation_clause = CONTRACT_AVG and pool non-empty", difference: "values loss at the contracted-bushel-weighted average contract price — different dollars for the same loss_bu" }

  - name: carry_analysis
    trigger: "GET /grain/lots/{id}/carry-analysis"
    algorithm: forward_looking
    formula: |
      months_held(lot, now) = (now.year - fill.year)*12 + (now.month - fill.month)
      rate(months) = 3 if months <= 3 else 4 if months <= 6 else 5
      storage_paid_cents = lot.cumulative_storage_charge_cents
      projected_month_charge_cents = round_half_up(lot.current_bu * rate(months_held), 0)
      basis_gain_cents = round_half_up((current_basis_cents - lot.fill_basis_cents) * lot.current_bu, 0)
      variant CASH:     interest_cents = 0
      variant ECONOMIC: interest_cents = round_half_up(lot.current_bu * lot.reference_price_cents_per_bu
                                        * ANNUAL_INTEREST_PCT/100 * floor((now - fill_date)/86400)/365, 0)
      net_carry_cents = basis_gain_cents - storage_paid_cents - projected_month_charge_cents - interest_cents
      recommendation = HOLD if net_carry_cents > 0 else SELL            # strictly positive holds; zero sells
    input_set: "the lot + query inputs current_basis_cents, variant; now = logical clock"
    constants: { ANNUAL_INTEREST_PCT: 6.0 }
    precision: "integer cents round_half_up"
    variants:
      - { name: CASH, when: "variant=CASH", difference: "excludes financing opportunity cost" }
      - { name: ECONOMIC, when: "variant=ECONOMIC", difference: "adds interest on the grain's reference value — can flip HOLD to SELL for identical inputs" }

# =============================================================================
# Table 4: Validation Rules Table (strictly ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present; role known", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "role permitted for this endpoint per RBAC", error_id: ERR_FORBIDDEN, http_status: 403, applies_to: "all" }
  - { priority: 3, category: auth, check: "fumigation create: payload applicator_id must equal caller X-User-ID (applicator acts as self)", error_id: ERR_FORBIDDEN, http_status: 403, applies_to: "POST /grain/fumigations" }
  - { priority: 4, category: existence, check: "path ids then body FK ids resolve, left to right", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all" }
  - { priority: 5, category: business_constraint, check: "OCC: expected_contract_version equals contract.version", error_id: ERR_STALE_CONTRACT_VERSION, http_status: 412, applies_to: "POST /grain/loadouts" }
  - { priority: 6, category: business_constraint, check: "request shape: required fields present, enum membership, ranges, date order, conditional fields (loss_bu iff CONFIRMED_LOSS; spot_price iff SPOT clause), ticket_no uniqueness", error_id: ERR_VALIDATION, http_status: 400, applies_to: "all" }
  - { priority: 7, category: auth, check: "segregation: fumigation clearer X-User-ID != record applicator_id", error_id: ERR_SOD_SAME_APPLICATOR, http_status: 403, applies_to: "POST /grain/fumigations/{id}/clear" }
  - { priority: 8, category: auth, check: "segregation: permit approver X-User-ID != requester_user_id", error_id: ERR_SOD_PERMIT_SELF_APPROVE, http_status: 403, applies_to: "POST /grain/entry-permits/{id}/approve" }
  - { priority: 9, category: state, check: "alert close: status == OPEN", error_id: ERR_ALERT_NOT_OPEN, http_status: 409, applies_to: "POST /grain/spoilage-alerts/{id}/close" }
  - { priority: 10, category: state, check: "fumigation clear: status == ACTIVE", error_id: ERR_FUMIGATION_NOT_ACTIVE, http_status: 409, applies_to: "POST /grain/fumigations/{id}/clear" }
  - { priority: 11, category: state, check: "permit approve: status == REQUESTED", error_id: ERR_PERMIT_NOT_REQUESTED, http_status: 409, applies_to: "POST /grain/entry-permits/{id}/approve" }
  - { priority: 12, category: state, check: "claim approve: status == SUBMITTED", error_id: ERR_CLAIM_NOT_SUBMITTED, http_status: 409, applies_to: "POST /grain/claims/{id}/approve" }
  - { priority: 13, category: state, check: "loadout dispatch requires SCHEDULED; deliver requires DISPATCHED; confirm requires DELIVERED", error_id: ERR_LOADOUT_STATE, http_status: 409, applies_to: "POST /grain/loadouts/{id}/dispatch, POST /grain/loadouts/{id}/deliver, POST /grain/loadouts/{id}/confirm-settlement" }
  - { priority: 14, category: state, check: "confirm requires settlement UNSETTLED; void requires settlement SETTLED", error_id: ERR_SETTLEMENT_STATE, http_status: 409, applies_to: "POST /grain/loadouts/{id}/confirm-settlement, POST /grain/loadouts/{id}/void-settlement" }
  - { priority: 15, category: business_safety, check: "bin.posture in {SOUND, WATCH} for lot fill, loadout create, dispatch", error_id: ERR_BIN_POSTURE_BLOCKED, http_status: 409, applies_to: "POST /grain/lots, POST /grain/loadouts, POST /grain/loadouts/{id}/dispatch" }
  - { priority: 16, category: business_safety, check: "permit approve: no ACTIVE fumigation with application_start <= now on the bin", error_id: ERR_ACTIVE_FUMIGATION_EXISTS, http_status: 409, applies_to: "POST /grain/entry-permits/{id}/approve" }
  - { priority: 17, category: business_safety, check: "fumigation clear: now >= lockout_until (REI elapsed; exactly at lockout_until passes)", error_id: ERR_REI_NOT_ELAPSED, http_status: 409, applies_to: "POST /grain/fumigations/{id}/clear" }
  - { priority: 18, category: business_safety, check: "fumigation create: applicator cert_expires_at >= application_start", error_id: ERR_APPLICATOR_CERT_EXPIRED, http_status: 409, applies_to: "POST /grain/fumigations" }
  - { priority: 19, category: business_safety, check: "permit approve: atmosphere_test_passed AND loto_confirmed (checked after fumigation absence)", error_id: ERR_ATMOSPHERE_UNSAFE, http_status: 409, applies_to: "POST /grain/entry-permits/{id}/approve" }
  - { priority: 20, category: business_temporal, check: "loadout window within contract window: window_start <= scheduled_start and scheduled_end <= window_end", error_id: ERR_OUTSIDE_DELIVERY_WINDOW, http_status: 409, applies_to: "POST /grain/loadouts" }
  - { priority: 21, category: business_temporal, check: "loadout window overlap on bin, HALF-OPEN [start,end): conflict iff start < other.end AND end > other.start among transport in {SCHEDULED,HELD,DISPATCHED}; touching endpoints allowed", error_id: ERR_WINDOW_OVERLAP, http_status: 409, applies_to: "POST /grain/loadouts" }
  - { priority: 22, category: business_temporal, check: "applicator double-booking, CLOSED [start,end] over all existing fumigation records of the applicator: conflict iff start <= other.end AND other.start <= end; touching endpoints conflict", error_id: ERR_APPLICATOR_DOUBLE_BOOKED, http_status: 409, applies_to: "POST /grain/fumigations" }
  - { priority: 23, category: business_temporal, check: "claim: alert.closed_at within [policy.period_start, policy.period_end] inclusive", error_id: ERR_LOSS_OUTSIDE_PERIOD, http_status: 409, applies_to: "POST /grain/claims" }
  - { priority: 24, category: business_constraint, check: "lot fill capacity: sum(current_bu over bin's lots) + original_bu <= capacity_bu (exact fit allowed)", error_id: ERR_BIN_CAPACITY_EXCEEDED, http_status: 409, applies_to: "POST /grain/lots" }
  - { priority: 25, category: business_constraint, check: "crop consistency: lot.crop == bin.crop; loadout bin.crop == contract.crop; claim policy.crop == alert.bin.crop", error_id: ERR_CROP_MIX, http_status: 409, applies_to: "POST /grain/lots, POST /grain/loadouts, POST /grain/claims" }
  - { priority: 26, category: business_constraint, check: "assessment period globally unique", error_id: ERR_ASSESSMENT_EXISTS, http_status: 409, applies_to: "POST /grain/assessments" }
  - { priority: 27, category: business_referential, check: "claim: referenced alert status == CONFIRMED_LOSS", error_id: ERR_ALERT_LOSS_NOT_CONFIRMED, http_status: 409, applies_to: "POST /grain/claims" }
  - { priority: 28, category: business_referential, check: "claim: policy status == ACTIVE", error_id: ERR_POLICY_NOT_ACTIVE, http_status: 409, applies_to: "POST /grain/claims" }
  - { priority: 29, category: business_referential, check: "contract status in {OPEN, DELIVERING} for loadout create, dispatch, confirm-settlement", error_id: ERR_CONTRACT_NOT_OPEN, http_status: 409, applies_to: "POST /grain/loadouts, POST /grain/loadouts/{id}/dispatch, POST /grain/loadouts/{id}/confirm-settlement" }
  - { priority: 30, category: business_referential, check: "waterfall coverage: sum(eligible lot current_bu) >= settled_net_bu", error_id: ERR_LOTS_INSUFFICIENT, http_status: 409, applies_to: "POST /grain/loadouts/{id}/confirm-settlement" }
  - { priority: 31, category: business_fiscal, check: "planned_bu <= contracted_bu - committed_bu - delivered_bu", error_id: ERR_CONTRACT_REMAINING_EXCEEDED, http_status: 409, applies_to: "POST /grain/loadouts" }

# =============================================================================
# Table 1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 5: API Endpoint Table (all business paths under api_prefix /grain)
# =============================================================================
endpoints:
  - { method: POST, path: "/grain/bins", description: "Create a bin", roles: [SiteManager], code: 201, input: [name, capacity_bu, crop], output: Bin, side_effects: ["posture=SOUND, risk_score=0.00, current_inventory_bu=0, insect_activity=false"] }
  - { method: GET, path: "/grain/bins/{id}", description: "Get a bin (posture, risk_score, inventory)", roles: [SiteManager, FarmOwner, CertifiedApplicator, SafetyOfficer], code: 200, input: [], output: Bin, side_effects: [] }

  - { method: POST, path: "/grain/lots", description: "Bin a grain lot (fill)", roles: [SiteManager], code: 201, input: [bin_id, crop, grade, fill_date, original_bu, fill_moisture_pct, fill_basis_cents, reference_price_cents_per_bu], output: GrainLot, side_effects: ["provisional_shrink runs; PROVISIONAL ShrinkEvent when shrink > 0", "status=STORED", "bin.current_inventory_bu += current_bu", "bin posture recompute"] }
  - { method: GET, path: "/grain/lots/{id}", description: "Get a lot", roles: [SiteManager, FarmOwner, CertifiedApplicator, SafetyOfficer], code: 200, input: [], output: GrainLot, side_effects: [] }
  - { method: GET, path: "/grain/lots", description: "List lots with filters + pagination", roles: [SiteManager, FarmOwner, CertifiedApplicator, SafetyOfficer], code: 200, input: ["bin_id?", "status?", "crop?", "grade?", "limit?", "offset?"], output: "GrainLot[]", side_effects: [] }
  - { method: GET, path: "/grain/lots/{id}/carry-analysis", description: "Storage-cost vs basis-gain decision for a lot; variant CASH|ECONOMIC", roles: [SiteManager, FarmOwner], code: 200, input: [current_basis_cents, variant], output: "{ lot_id: string, variant: string, current_bu: number, storage_paid_cents: integer, projected_month_charge_cents: integer, basis_gain_cents: integer, interest_cents: integer, net_carry_cents: integer, recommendation: string }", side_effects: [] }

  - { method: POST, path: "/grain/temperature-readings", description: "Ingest a temperature-cable reading; recomputes risk score, raises hotspot alert + cascades", roles: [SiteManager], code: 201, input: [bin_id, recorded_at, ambient_temp_f, cable_temps_f, insect_activity], output: TemperatureReading, side_effects: ["spoilage_risk_score (latest by recorded_at)", "if hotspot: create SpoilageAlert OPEN -> posture recompute -> gate cascade", "bin.insect_activity / last_reading_at updated"] }
  - { method: GET, path: "/grain/temperature-readings/{id}", description: "Get a reading", roles: [SiteManager, FarmOwner, CertifiedApplicator, SafetyOfficer], code: 200, input: [], output: TemperatureReading, side_effects: [] }
  - { method: GET, path: "/grain/temperature-readings", description: "List readings", roles: [SiteManager, FarmOwner, CertifiedApplicator, SafetyOfficer], code: 200, input: ["bin_id?", "limit?", "offset?"], output: "TemperatureReading[]", side_effects: [] }

  - { method: GET, path: "/grain/spoilage-alerts/{id}", description: "Get an alert", roles: [SiteManager, FarmOwner, CertifiedApplicator, SafetyOfficer], code: 200, input: [], output: SpoilageAlert, side_effects: [] }
  - { method: GET, path: "/grain/spoilage-alerts", description: "List alerts", roles: [SiteManager, FarmOwner, CertifiedApplicator, SafetyOfficer], code: 200, input: ["bin_id?", "reading_id?", "status?", "limit?", "offset?"], output: "SpoilageAlert[]", side_effects: [] }
  - { method: POST, path: "/grain/spoilage-alerts/{id}/close", description: "Close an alert as RESOLVED or CONFIRMED_LOSS (loss_bu required iff CONFIRMED_LOSS)", roles: [SiteManager], code: 200, input: [outcome, "loss_bu?"], output: SpoilageAlert, side_effects: ["closed_at=now", "bin posture recompute + possible release cascade"] }

  - { method: POST, path: "/grain/fumigations", description: "Create fumigation record (immediately ACTIVE). Caller must be the applicator.", roles: [CertifiedApplicator], code: 201, input: [bin_id, applicator_id, product, application_start, application_end], output: FumigationRecord, side_effects: ["lockout_until = application_start + REI_HOURS[product]", "status=ACTIVE", "bin posture recompute (FUMIGATION_LOCKOUT when application_start <= now) + gate cascade incl. permit VOIDED"] }
  - { method: GET, path: "/grain/fumigations/{id}", description: "Get a fumigation record", roles: [SiteManager, FarmOwner, CertifiedApplicator, SafetyOfficer], code: 200, input: [], output: FumigationRecord, side_effects: [] }
  - { method: GET, path: "/grain/fumigations", description: "List fumigation records", roles: [SiteManager, FarmOwner, CertifiedApplicator, SafetyOfficer], code: 200, input: ["bin_id?", "applicator_id?", "cleared_by_applicator_id?", "status?", "limit?", "offset?"], output: "FumigationRecord[]", side_effects: [] }
  - { method: POST, path: "/grain/fumigations/{id}/clear", description: "Clear fumigation after REI; clearer must differ from applicator", roles: [CertifiedApplicator], code: 200, input: [], output: FumigationRecord, side_effects: ["status=CLEARED, cleared_at=now", "bin posture recompute + possible release cascade"] }

  - { method: POST, path: "/grain/entry-permits", description: "Request a bin-entry permit", roles: [SiteManager, SafetyOfficer], code: 201, input: [bin_id, planned_start, planned_end, atmosphere_test_passed, loto_confirmed], output: BinEntryPermit, side_effects: ["status=REQUESTED", "requester_user_id = caller X-User-ID"] }
  - { method: GET, path: "/grain/entry-permits/{id}", description: "Get a permit", roles: [SiteManager, FarmOwner, CertifiedApplicator, SafetyOfficer], code: 200, input: [], output: BinEntryPermit, side_effects: [] }
  - { method: GET, path: "/grain/entry-permits", description: "List permits", roles: [SiteManager, FarmOwner, CertifiedApplicator, SafetyOfficer], code: 200, input: ["bin_id?", "status?", "limit?", "offset?"], output: "BinEntryPermit[]", side_effects: [] }
  - { method: POST, path: "/grain/entry-permits/{id}/approve", description: "Approve a permit (segregated from requester; gated on fumigation absence + atmosphere/LOTO)", roles: [SafetyOfficer], code: 200, input: [], output: BinEntryPermit, side_effects: ["status=APPROVED", "approver_user_id = caller"] }

  - { method: POST, path: "/grain/contracts", description: "Create a storage/delivery contract", roles: [FarmOwner], code: 201, input: [crop, contracted_bu, window_start, window_end, basis_cents_per_bu, futures_ref_cents_per_bu, "early_bonus_cents_per_bu?", "early_cutoff?"], output: StorageContract, side_effects: ["status=OPEN", "contract_unit_price_cents computed"] }
  - { method: GET, path: "/grain/contracts/{id}", description: "Get a contract (version, committed/delivered, ratio, status)", roles: [SiteManager, FarmOwner, CertifiedApplicator, SafetyOfficer], code: 200, input: [], output: StorageContract, side_effects: [] }

  - { method: POST, path: "/grain/loadouts", description: "Schedule a load-out against a contract from a bin (OCC on contract version)", roles: [SiteManager], code: 201, input: [contract_id, bin_id, scheduled_start, scheduled_end, planned_bu, expected_contract_version], output: LoadOut, side_effects: ["transport=SCHEDULED, settlement=UNSETTLED", "contract.committed_bu += planned_bu", "contract OPEN -> DELIVERING", "increments StorageContract.version by 1"] }
  - { method: GET, path: "/grain/loadouts/{id}", description: "Get a load-out", roles: [SiteManager, FarmOwner, CertifiedApplicator, SafetyOfficer], code: 200, input: [], output: LoadOut, side_effects: [] }
  - { method: GET, path: "/grain/loadouts", description: "List load-outs", roles: [SiteManager, FarmOwner, CertifiedApplicator, SafetyOfficer], code: 200, input: ["contract_id?", "bin_id?", "transport_status?", "settlement_status?", "limit?", "offset?"], output: "LoadOut[]", side_effects: [] }
  - { method: POST, path: "/grain/loadouts/{id}/dispatch", description: "Dispatch a scheduled load-out (posture + contract re-checked)", roles: [SiteManager], code: 200, input: [], output: LoadOut, side_effects: ["transport SCHEDULED -> DISPATCHED"] }
  - { method: POST, path: "/grain/loadouts/{id}/deliver", description: "Record scale tickets; computes per-ticket settlement shrink", roles: [SiteManager], code: 200, input: [delivered_at, scale_tickets], output: LoadOut, side_effects: ["transport DISPATCHED -> DELIVERED", "settlement_shrink per ticket (round per ticket then sum)"] }
  - { method: POST, path: "/grain/loadouts/{id}/confirm-settlement", description: "Settle: money calc + lot waterfall debit + contract accumulation", roles: [SiteManager], code: 200, input: [], output: LoadOut, side_effects: ["settlement UNSETTLED -> SETTLED", "settlement_charges", "allocation_waterfall", "contract delivered/value/version", "contract may become FULFILLED", "bin inventory + posture recompute"] }
  - { method: POST, path: "/grain/loadouts/{id}/void-settlement", description: "Compensating reversal of a settlement (bushel + money invariants)", roles: [SiteManager], code: 200, input: [], output: LoadOut, side_effects: ["settlement SETTLED -> VOIDED", "reverse draws", "contract delivered/value revert; FULFILLED -> DELIVERING if below tolerance", "bin inventory + posture recompute"] }

  - { method: POST, path: "/grain/policies", description: "Create an insurance policy (immediately ACTIVE)", roles: [FarmOwner], code: 201, input: [crop, coverage_limit_cents, deductible_cents, valuation_clause, period_start, period_end], output: InsurancePolicy, side_effects: ["status=ACTIVE", "remaining_coverage_cents = coverage_limit_cents"] }
  - { method: POST, path: "/grain/claims", description: "Submit a claim against a CONFIRMED_LOSS alert", roles: [SiteManager], code: 201, input: [policy_id, spoilage_alert_id], output: InsuranceClaim, side_effects: ["status=SUBMITTED", "loss_bu copied from alert"] }
  - { method: GET, path: "/grain/claims/{id}", description: "Get a claim", roles: [SiteManager, FarmOwner, CertifiedApplicator, SafetyOfficer], code: 200, input: [], output: InsuranceClaim, side_effects: [] }
  - { method: GET, path: "/grain/claims", description: "List claims", roles: [SiteManager, FarmOwner, CertifiedApplicator, SafetyOfficer], code: 200, input: ["policy_id?", "spoilage_alert_id?", "status?", "limit?", "offset?"], output: "InsuranceClaim[]", side_effects: [] }
  - { method: POST, path: "/grain/claims/{id}/approve", description: "Approve a claim; computes indemnity per policy valuation clause and debits coverage", roles: [FarmOwner], code: 200, input: ["spot_price_cents_per_bu?"], output: InsuranceClaim, side_effects: ["status SUBMITTED -> APPROVED", "indemnity calc", "policy.remaining_coverage_cents -= indemnity_cents", "increments InsurancePolicy.version by 1"] }

  - { method: POST, path: "/grain/applicators", description: "Register a certified applicator", roles: [SiteManager], code: 201, input: [name, license_no, cert_expires_at], output: Applicator, side_effects: [] }

  - { method: POST, path: "/grain/assessments", description: "Run the monthly assessment epoch (storage charges, invisible loss, sweeps). Period unique.", roles: [SiteManager], code: 201, input: [period], output: StorageAssessment, side_effects: ["monthly_assessment calc", "ShrinkEvents INVISIBLE_LOSS", "contract/permit/loadout/policy sweeps", "bin inventory + posture recompute"] }
  - { method: GET, path: "/grain/lots/{id}/shrink-events", description: "List shrink events for a lot (audit trail)", roles: [SiteManager, FarmOwner, CertifiedApplicator, SafetyOfficer], code: 200, input: ["kind?", "limit?", "offset?"], output: "ShrinkEvent[]", side_effects: [] }

  - { method: POST, path: "/_clock/set_current_utc", description: "Test-driving endpoint: set the logical clock. Server startup default is exactly 2026-08-01T00:00:00Z and never falls back to wall-clock.", roles: [SiteManager], code: 200, input: [to_iso8601], output: "{ current_utc: string }", side_effects: ["logical clock := to_iso8601"] }

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/unknown X-User-Role or X-User-ID" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted, or fumigation applicator_id != caller X-User-ID" }
  - { id: ERR_SOD_SAME_APPLICATOR, http: 403, condition: "Fumigation clearer is the same applicator who applied it" }
  - { id: ERR_SOD_PERMIT_SELF_APPROVE, http: 403, condition: "Permit approver is the permit requester" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or body FK does not resolve" }
  - { id: ERR_STALE_CONTRACT_VERSION, http: 412, condition: "expected_contract_version != contract.version (OCC)" }
  - { id: ERR_VALIDATION, http: 400, condition: "Missing/invalid field, bad enum, bad date order, conditional-field violation, duplicate ticket_no" }
  - { id: ERR_ALERT_NOT_OPEN, http: 409, condition: "Alert close attempted when status != OPEN" }
  - { id: ERR_FUMIGATION_NOT_ACTIVE, http: 409, condition: "Fumigation clear attempted when status != ACTIVE" }
  - { id: ERR_PERMIT_NOT_REQUESTED, http: 409, condition: "Permit approve attempted when status != REQUESTED" }
  - { id: ERR_CLAIM_NOT_SUBMITTED, http: 409, condition: "Claim approve attempted when status != SUBMITTED" }
  - { id: ERR_LOADOUT_STATE, http: 409, condition: "dispatch/deliver/confirm from the wrong transport_status" }
  - { id: ERR_SETTLEMENT_STATE, http: 409, condition: "confirm when settlement != UNSETTLED; void when settlement != SETTLED" }
  - { id: ERR_BIN_POSTURE_BLOCKED, http: 409, condition: "Bin posture is ALERT or FUMIGATION_LOCKOUT; fills, load-out creation, dispatch blocked" }
  - { id: ERR_ACTIVE_FUMIGATION_EXISTS, http: 409, condition: "Permit approve while an ACTIVE fumigation with application_start <= now exists on the bin" }
  - { id: ERR_REI_NOT_ELAPSED, http: 409, condition: "Fumigation clear before lockout_until (REI not elapsed)" }
  - { id: ERR_APPLICATOR_CERT_EXPIRED, http: 409, condition: "Applicator certification expired at application_start" }
  - { id: ERR_ATMOSPHERE_UNSAFE, http: 409, condition: "Permit approve with failed atmosphere test or unconfirmed LOTO" }
  - { id: ERR_OUTSIDE_DELIVERY_WINDOW, http: 409, condition: "Load-out window not contained in the contract delivery window" }
  - { id: ERR_WINDOW_OVERLAP, http: 409, condition: "Load-out window overlaps another live load-out on the bin (half-open semantics)" }
  - { id: ERR_APPLICATOR_DOUBLE_BOOKED, http: 409, condition: "Fumigation occupancy interval touches/overlaps another record of the same applicator (closed semantics)" }
  - { id: ERR_LOSS_OUTSIDE_PERIOD, http: 409, condition: "Alert closed_at outside the policy coverage period" }
  - { id: ERR_BIN_CAPACITY_EXCEEDED, http: 409, condition: "Lot fill would exceed bin capacity" }
  - { id: ERR_CROP_MIX, http: 409, condition: "Crop mismatch: lot vs bin, loadout bin vs contract, or claim policy vs alert bin" }
  - { id: ERR_ASSESSMENT_EXISTS, http: 409, condition: "Assessment period already run" }
  - { id: ERR_ALERT_LOSS_NOT_CONFIRMED, http: 409, condition: "Claim references an alert not in CONFIRMED_LOSS" }
  - { id: ERR_POLICY_NOT_ACTIVE, http: 409, condition: "Claim against a policy not ACTIVE" }
  - { id: ERR_CONTRACT_NOT_OPEN, http: 409, condition: "Contract not in {OPEN, DELIVERING} for loadout create/dispatch/confirm" }
  - { id: ERR_LOTS_INSUFFICIENT, http: 409, condition: "Eligible lot bushels cannot cover settled_net_bu" }
  - { id: ERR_CONTRACT_REMAINING_EXCEEDED, http: 409, condition: "planned_bu exceeds contract remaining (contracted - committed - delivered)" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: SiteManager
    description: "Elevator/bin-site operator: runs physical ops, monitoring, load-outs, assessments, claims submission"
    identity: opaque
    exclusive_operations:
      - "POST /grain/bins, /grain/lots, /grain/temperature-readings, /grain/assessments, /grain/applicators"
      - "POST /grain/spoilage-alerts/{id}/close"
      - "POST /grain/loadouts (+dispatch/deliver/confirm-settlement/void-settlement)"
      - "POST /grain/claims"
      - "POST /_clock/set_current_utc"
    shared_operations: ["all GET endpoints", "POST /grain/entry-permits (with SafetyOfficer)", "GET /grain/lots/{id}/carry-analysis (with FarmOwner)"]
  - name: FarmOwner
    description: "Operation owner: owns marketing contracts, insurance policies, and claim approval (money side)"
    identity: opaque
    exclusive_operations: ["POST /grain/contracts", "POST /grain/policies", "POST /grain/claims/{id}/approve"]
    shared_operations: ["all GET endpoints", "GET /grain/lots/{id}/carry-analysis"]
  - name: CertifiedApplicator
    description: "Licensed fumigator; acts as self — X-User-ID equals the Applicator entity id; application and clearance are segregated"
    identity: "entity_backed:Applicator"
    exclusive_operations: ["POST /grain/fumigations", "POST /grain/fumigations/{id}/clear"]
    shared_operations: ["all GET endpoints"]
  - name: SafetyOfficer
    description: "Bin-entry safety authority; approves entry permits; segregated from the permit requester"
    identity: opaque
    exclusive_operations: ["POST /grain/entry-permits/{id}/approve"]
    shared_operations: ["all GET endpoints", "POST /grain/entry-permits (with SiteManager)"]
