        distinguishing_aspect: |
          renew on a RENEWAL_PENDING agreement sets status=RENEWED, creates a same-franchisee successor in
          status EXECUTED with the new fdd_version, and links successor_agreement_id (RENEW branch, distinct
          from the DECLINE branch covered in §1.8).
        test_recipe:
