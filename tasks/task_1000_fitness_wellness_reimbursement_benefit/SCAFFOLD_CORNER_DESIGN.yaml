          assert:
            - "error_id == ERR_FORBIDDEN_ROLE; http 403"

      - name: auditor_cannot_create_employer
        claim_type: rbac_denial
        grounds: [roles."Auditor", "errors[ERR_FORBIDDEN_ROLE]"]
        distinguishing_aspect: "Auditor is read-only: any write endpoint denies it even with a well-formed payload."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
