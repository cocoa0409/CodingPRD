# =============================================================================
# Task 1978 — §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 19 instances across the nine Difficulty Rules of SKILL.md §0.5.
# All chains start from empty-DB; logical clock defaults to 2026-08-01T00:00:00Z.
# All ${var} references bind to captures earlier in the same instance.
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------- rule 1 --
  - rule_id: dual_variant_calc
    instances:
      - name: r1_direct_vs_effective_fill_rate_diverge_on_house_substitution
        grounds:
          - calculations.fill_rate
          - calculations.decision_slot_allocation
          - entities.ChannelDaySnapshot.fields.direct_fill_rate
          - entities.ChannelDaySnapshot.fields.effective_fill_rate
        distinguishing_aspect: |
          Fill-rate dual variant lives on the AdBreak/ChannelDaySnapshot domain
          (scheduling), NOT on the revenue domain: with 30 DIRECT + 30 HOUSE +
          30 slate seconds in a 90s break, direct_fill_rate is 0.3333 while
          effective_fill_rate is 0.6667 — two valid fill definitions over the
          same break yielding different numbers because HOUSE substitution
          counts only in the effective variant.
        test_recipe:
          setup:
            - "Channel ch (loop_duration_seconds 600), content ct (540s, AVAILABLE), ACTIVE grant g covering 2026-09-01 with max_plays 10"
            - "Loop lp for 2026-09-01: entry ct + 90s break br (tiles 600); VALIDATED"
            - "Campaign cmp (cpm 500, budget 5000, daily 5000, flight 2026-08-01..2026-12-31) ACTIVE with APPROVED 30s creative crv (IAB-9)"
            - "House ad h1 (network-wide, priority_weight 5, daily_impression_cap 1) ACTIVE"
            - "Decision run on br -> d1 DIRECT crv slot 0, d2 HOUSE h1 slot 1, slot 2 slate; loop LOCKED then channel LIVE then loop PUBLISHED"
          setup_api_calls:
            - { call: "POST /v1/channels", payload: { name: "Ch A", genre: "movies", timezone: "UTC", loop_duration_seconds: 600 }, as: PlatformAdmin, captures: { ch: $.data.id } }
            - { call: "POST /v1/content-assets", payload: { title: "Movie 540", content_type: "MOVIE", runtime_seconds: 540, rating: "PG", genre: "movies" }, as: ContentLicensing, captures: { ct: $.data.id } }
            - { call: "POST /v1/content-assets/${ct}/mark-available", payload: {}, as: ContentLicensing }
            - { call: "POST /v1/rights-grants", payload: { channel_id: "${ch}", content_id: "${ct}", window_start_utc: "2026-08-01T00:00:00Z", window_end_utc: "2026-10-01T00:00:00Z", max_plays: 10 }, as: ContentLicensing, captures: { g: $.data.id } }
            - { call: "POST /v1/rights-grants/${g}/activate", payload: {}, as: ContentLicensing }
            - { call: "POST /v1/playlist-loops", payload: { channel_id: "${ch}", broadcast_date: "2026-09-01" }, as: ChannelProgrammer, captures: { lp: $.data.id } }
            - { call: "POST /v1/playlist-loops/${lp}/entries", payload: { content_id: "${ct}" }, as: ChannelProgrammer }
            - { call: "POST /v1/playlist-loops/${lp}/ad-breaks", payload: { duration_seconds: 90 }, as: ChannelProgrammer, captures: { br: $.data.id, br_v: $.data.version } }
            - { call: "POST /v1/playlist-loops/${lp}/validate", payload: {}, as: ChannelProgrammer }
            - { call: "POST /v1/ad-campaigns", payload: { advertiser_name: "Acme", iab_category: "IAB-9", total_budget_cents: 5000, daily_budget_cents: 5000, cpm_cents: 500, flight_start_date: "2026-08-01", flight_end_date: "2026-12-31" }, as: AdOps, captures: { cmp: $.data.id } }
            - { call: "POST /v1/ad-creatives", payload: { campaign_id: "${cmp}", brand: "Acme Soda", iab_category: "IAB-9", duration_seconds: 30 }, as: AdOps, as_user_id: "ops-1", captures: { crv: $.data.id } }
            - { call: "POST /v1/ad-creatives/${crv}/approve", payload: {}, as: AdQualityReviewer, as_user_id: "rev-1" }
            - { call: "POST /v1/ad-campaigns/${cmp}/activate", payload: {}, as: AdOps, as_user_id: "ops-1" }
            - { call: "POST /v1/house-ads", payload: { name: "House Promo", priority_weight: 5, daily_impression_cap: 1 }, as: AdOps, as_user_id: "ops-1", captures: { h1: $.data.id } }
            - { call: "POST /v1/ad-breaks/${br}/decision-runs", payload: { expected_break_version: "${br_v}" }, as: AdOps, as_user_id: "ops-1", captures: { d1: "$.data[0].id", d2: "$.data[1].id" } }
            - { call: "POST /v1/playlist-loops/${lp}/lock", payload: {}, as: ChannelProgrammer }
            - { call: "POST /v1/channels/${ch}/go-live", payload: {}, as: PlatformAdmin }
            - { call: "GET /v1/channels/${ch}", payload: {}, as: PlatformAdmin, captures: { cv: $.data.version } }
            - { call: "POST /v1/playlist-loops/${lp}/publish", payload: { expected_channel_version: "${cv}" }, as: ChannelProgrammer }
          trigger:
            - { call: "POST /v1/channels/${ch}/snapshot-computations", payload: { snapshot_date: "2026-09-01" }, as: ChannelProgrammer, captures: { snap: $.data.id } }
          assert:
            - "ChannelDaySnapshot.${snap}.capacity_seconds == 90"
            - "ChannelDaySnapshot.${snap}.direct_seconds == 30"
            - "ChannelDaySnapshot.${snap}.house_seconds == 30"
            - "ChannelDaySnapshot.${snap}.direct_fill_rate == 0.3333"
            - "ChannelDaySnapshot.${snap}.effective_fill_rate == 0.6667"
            - "ChannelDaySnapshot.${snap}.direct_fill_rate != ChannelDaySnapshot.${snap}.effective_fill_rate (same break, same moment — variant divergence is house substitution)"
            - "FillDecision.${d1}.fill_type == DIRECT and FillDecision.${d1}.committed_cost_cents == 500"
            - "FillDecision.${d2}.fill_type == HOUSE and FillDecision.${d2}.committed_cost_cents == 0"

      - name: r1_provisional_vs_final_revenue_statement_diverge_on_unreconciled
        grounds:
          - calculations.revenue_share_statement
          - calculations.cpm_revenue_attribution
          - state_machines.RevenueReport.DRAFT_to_PROVISIONAL
          - state_machines.RevenueReport.PROVISIONAL_to_FINALIZED
        distinguishing_aspect: |
          Revenue dual variant lives on the RevenueReport domain (finance), NOT
          on scheduling: provisional counts COMMITTED+RECONCILED decisions
          (gross 330) while final counts RECONCILED only (gross 250) — identical
          events, different input-set filter, different statement numbers.
        test_recipe:
          setup:
            - "Channel ch (600s), content ct (540s) AVAILABLE, ACTIVE grant g (max_plays 10), loop lp 2026-09-01 tiled as entry ct + 30s break b1 + 30s break b2 (600 total), VALIDATED"
            - "Campaign c1 (cpm 500, IAB-9) with creative cr1; campaign c2 (cpm 400, IAB-7) with creative cr2; both ACTIVE; b1 decided with d1 (cr1), b2 decided with d2 (cr2) (b1/b2 adjacent so IAB-9 excluded from b2)"
            - "lp LOCKED (d1, d2 COMMITTED), channel LIVE, lp PUBLISHED; b1 and b2 AIRED"
            - "Platform p1 ACTIVE; agreement ag (channel ch, platform p1, below 2000 bps, above 4000 bps, threshold 100000, min 0, 2026-01-01..2026-12-31) ACTIVE"
            - "Impressions: d1 has 500 on p1, d2 has 200 on p1; ONLY b1 reconciled (d1 RECONCILED, d2 still COMMITTED)"
            - "Logical clock advanced to 2026-10-01 so period 2026-09 has elapsed"
          setup_api_calls:
            - { call: "POST /v1/channels", payload: { name: "Ch B", genre: "movies", timezone: "UTC", loop_duration_seconds: 600 }, as: PlatformAdmin, captures: { ch: $.data.id } }
            - { call: "POST /v1/content-assets", payload: { title: "Movie 540", content_type: "MOVIE", runtime_seconds: 540, rating: "PG", genre: "movies" }, as: ContentLicensing, captures: { ct: $.data.id } }
            - { call: "POST /v1/content-assets/${ct}/mark-available", payload: {}, as: ContentLicensing }
            - { call: "POST /v1/rights-grants", payload: { channel_id: "${ch}", content_id: "${ct}", window_start_utc: "2026-08-01T00:00:00Z", window_end_utc: "2026-10-01T00:00:00Z", max_plays: 10 }, as: ContentLicensing, captures: { g: $.data.id } }
            - { call: "POST /v1/rights-grants/${g}/activate", payload: {}, as: ContentLicensing }
            - { call: "POST /v1/playlist-loops", payload: { channel_id: "${ch}", broadcast_date: "2026-09-01" }, as: ChannelProgrammer, captures: { lp: $.data.id } }
            - { call: "POST /v1/playlist-loops/${lp}/entries", payload: { content_id: "${ct}" }, as: ChannelProgrammer }
            - { call: "POST /v1/playlist-loops/${lp}/ad-breaks", payload: { duration_seconds: 30 }, as: ChannelProgrammer, captures: { b1: $.data.id, b1_v: $.data.version } }
            - { call: "POST /v1/playlist-loops/${lp}/ad-breaks", payload: { duration_seconds: 30 }, as: ChannelProgrammer, captures: { b2: $.data.id, b2_v: $.data.version } }
            - { call: "POST /v1/playlist-loops/${lp}/validate", payload: {}, as: ChannelProgrammer }
            - { call: "POST /v1/ad-campaigns", payload: { advertiser_name: "Acme", iab_category: "IAB-9", total_budget_cents: 100000, daily_budget_cents: 100000, cpm_cents: 500, flight_start_date: "2026-08-01", flight_end_date: "2026-12-31" }, as: AdOps, captures: { c1: $.data.id } }
            - { call: "POST /v1/ad-creatives", payload: { campaign_id: "${c1}", brand: "Acme Soda", iab_category: "IAB-9", duration_seconds: 30 }, as: AdOps, as_user_id: "ops-1", captures: { cr1: $.data.id } }
            - { call: "POST /v1/ad-creatives/${cr1}/approve", payload: {}, as: AdQualityReviewer, as_user_id: "rev-1" }
            - { call: "POST /v1/ad-campaigns/${c1}/activate", payload: {}, as: AdOps, as_user_id: "ops-1" }
            - { call: "POST /v1/ad-campaigns", payload: { advertiser_name: "Beta", iab_category: "IAB-7", total_budget_cents: 100000, daily_budget_cents: 100000, cpm_cents: 400, flight_start_date: "2026-08-01", flight_end_date: "2026-12-31" }, as: AdOps, captures: { c2: $.data.id } }
            - { call: "POST /v1/ad-creatives", payload: { campaign_id: "${c2}", brand: "Beta Tools", iab_category: "IAB-7", duration_seconds: 30 }, as: AdOps, as_user_id: "ops-1", captures: { cr2: $.data.id } }
            - { call: "POST /v1/ad-creatives/${cr2}/approve", payload: {}, as: AdQualityReviewer, as_user_id: "rev-1" }
            - { call: "POST /v1/ad-campaigns/${c2}/activate", payload: {}, as: AdOps, as_user_id: "ops-1" }
            - { call: "POST /v1/ad-breaks/${b1}/decision-runs", payload: { expected_break_version: "${b1_v}" }, as: AdOps, as_user_id: "ops-1", captures: { d1: "$.data[0].id" } }
            - { call: "POST /v1/ad-breaks/${b2}/decision-runs", payload: { expected_break_version: "${b2_v}" }, as: AdOps, as_user_id: "ops-1", captures: { d2: "$.data[0].id" } }
            - { call: "POST /v1/playlist-loops/${lp}/lock", payload: {}, as: ChannelProgrammer }
            - { call: "POST /v1/channels/${ch}/go-live", payload: {}, as: PlatformAdmin }
            - { call: "GET /v1/channels/${ch}", payload: {}, as: PlatformAdmin, captures: { cv: $.data.version } }
            - { call: "POST /v1/playlist-loops/${lp}/publish", payload: { expected_channel_version: "${cv}" }, as: ChannelProgrammer }
            - { call: "POST /v1/ad-breaks/${b1}/mark-aired", payload: {}, as: ChannelProgrammer }
            - { call: "POST /v1/ad-breaks/${b2}/mark-aired", payload: {}, as: ChannelProgrammer }
            - { call: "POST /v1/distributor-platforms", payload: { name: "Roku-like", reporting_tier: "STANDARD" }, as: PlatformAdmin, captures: { p1: $.data.id } }
            - { call: "PATCH /v1/distributor-platforms/${p1}", payload: { target_status: "ACTIVE" }, as: PlatformAdmin }
            - { call: "POST /v1/distribution-agreements", payload: { channel_id: "${ch}", platform_id: "${p1}", rev_share_bps_below: 2000, rev_share_bps_above: 4000, tier_threshold_cents: 100000, minimum_guarantee_cents: 0, effective_start_date: "2026-01-01", effective_end_date: "2026-12-31" }, as: PlatformAdmin, captures: { ag: $.data.id } }
            - { call: "PATCH /v1/distribution-agreements/${ag}", payload: { target_status: "ACTIVE" }, as: PlatformAdmin }
            - { call: "POST /v1/viewership-events", payload: { channel_id: "${ch}", platform_id: "${p1}", event_type: "AD_IMPRESSION", break_id: "${b1}", decision_id: "${d1}", viewer_session_id: "s1", occurred_at_utc: "2026-09-01T00:07:30Z", quantity: 500 }, as: PlatformAdmin }
            - { call: "POST /v1/viewership-events", payload: { channel_id: "${ch}", platform_id: "${p1}", event_type: "AD_IMPRESSION", break_id: "${b2}", decision_id: "${d2}", viewer_session_id: "s2", occurred_at_utc: "2026-09-01T00:08:00Z", quantity: 200 }, as: PlatformAdmin }
            - { call: "POST /v1/ad-breaks/${b1}/reconcile", payload: {}, as: AdOps, as_user_id: "ops-1" }
            - { call: "POST /v1/_clock/set-current-utc", payload: { to_iso8601: "2026-10-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /v1/revenue-reports", payload: { channel_id: "${ch}", platform_id: "${p1}", period_month: "2026-09" }, as: FinanceAnalyst, as_user_id: "fin-1", captures: { rp: $.data.id } }
            - { call: "POST /v1/revenue-reports/${rp}/generate-provisional", payload: {}, as: FinanceAnalyst, as_user_id: "fin-1" }
          trigger:
            - { call: "POST /v1/revenue-reports/${rp}/finalize", payload: {}, as: FinanceController, as_user_id: "ctl-1" }
          assert:
            - "After generate-provisional: RevenueReport.${rp}.calculation_variant == PROVISIONAL, gross_revenue_cents == 330 (d1 reconciled 250 = round(500*500/1000); d2 committed-but-observed 80 = round(400*200/1000))"
            - "Provisional platform_share_cents == 66 (round_half_up(330*2000/10000)) and net_revenue_cents == 264"
            - "After finalize: RevenueReport.${rp}.calculation_variant == FINAL, gross_revenue_cents == 250 (RECONCILED d1 only; COMMITTED d2 excluded)"
            - "Final platform_share_cents == 50 (round_half_up(250*2000/10000)) and net_revenue_cents == 200"
            - "330 != 250 — identical events, variant input-set filter is the only difference"
            - "FillDecision.${d2}.decision_status == COMMITTED throughout (never reconciled)"

  # ---------------------------------------------------------------- rule 2 --
  - rule_id: combinatorial_formula
    instances:
      - name: r2_per_pair_rounding_then_sum_rejects_sum_then_round
        grounds:
          - calculations.cpm_revenue_attribution
          - state_machines.AdBreak.AIRED_to_RECONCILED
        distinguishing_aspect: |
          Mode (b) nested rounding: two reconciled decisions at cpm 500 with 3
          impressions each round per (decision, platform) pair FIRST
          (round(1.5)+round(1.5) = 2+2 = 4); the rejected sum-then-round order
          would give round(3.0) = 3 — the pinned order changes the cents.
        test_recipe:
          setup:
            - "Channel ch (600s) LIVE, loop lp 2026-09-01 PUBLISHED: entry ct540 + breaks b1 (30s) and b2 (30s)"
            - "Campaigns c1 (cpm 500, IAB-9, budget 100000, daily 100000) with creative cr1 and c2 (cpm 500, IAB-7, budget 100000, daily 100000) with creative cr2, both ACTIVE"
            - "b1 decided -> d1 (cr1), b2 decided -> d2 (cr2); both COMMITTED via lock; b1/b2 AIRED and RECONCILED with 3 impressions each on platform p1"
            - "Agreement ag (below 2000 bps, above 4000, threshold 100000, min 0) ACTIVE for (ch, p1); clock at 2026-10-01; report rp for 2026-09 generated provisional then finalized"
          setup_api_calls:
            - { call: "POST /v1/channels", payload: { name: "Ch C", genre: "movies", timezone: "UTC", loop_duration_seconds: 600 }, as: PlatformAdmin, captures: { ch: $.data.id } }
            - { call: "POST /v1/content-assets", payload: { title: "Movie 540", content_type: "MOVIE", runtime_seconds: 540, rating: "PG", genre: "movies" }, as: ContentLicensing, captures: { ct: $.data.id } }
            - { call: "POST /v1/content-assets/${ct}/mark-available", payload: {}, as: ContentLicensing }
            - { call: "POST /v1/rights-grants", payload: { channel_id: "${ch}", content_id: "${ct}", window_start_utc: "2026-08-01T00:00:00Z", window_end_utc: "2026-10-01T00:00:00Z", max_plays: 10 }, as: ContentLicensing, captures: { g: $.data.id } }
            - { call: "POST /v1/rights-grants/${g}/activate", payload: {}, as: ContentLicensing }
            - { call: "POST /v1/playlist-loops", payload: { channel_id: "${ch}", broadcast_date: "2026-09-01" }, as: ChannelProgrammer, captures: { lp: $.data.id } }
            - { call: "POST /v1/playlist-loops/${lp}/entries", payload: { content_id: "${ct}" }, as: ChannelProgrammer }
            - { call: "POST /v1/playlist-loops/${lp}/ad-breaks", payload: { duration_seconds: 30 }, as: ChannelProgrammer, captures: { b1: $.data.id, b1_v: $.data.version } }
            - { call: "POST /v1/playlist-loops/${lp}/ad-breaks", payload: { duration_seconds: 30 }, as: ChannelProgrammer, captures: { b2: $.data.id, b2_v: $.data.version } }
            - { call: "POST /v1/playlist-loops/${lp}/validate", payload: {}, as: ChannelProgrammer }
            - { call: "POST /v1/ad-campaigns", payload: { advertiser_name: "Acme", iab_category: "IAB-9", total_budget_cents: 100000, daily_budget_cents: 100000, cpm_cents: 500, flight_start_date: "2026-08-01", flight_end_date: "2026-12-31" }, as: AdOps, captures: { c1: $.data.id } }
            - { call: "POST /v1/ad-creatives", payload: { campaign_id: "${c1}", brand: "Acme Soda", iab_category: "IAB-9", duration_seconds: 30 }, as: AdOps, as_user_id: "ops-1", captures: { cr1: $.data.id } }
            - { call: "POST /v1/ad-creatives/${cr1}/approve", payload: {}, as: AdQualityReviewer, as_user_id: "rev-1" }
            - { call: "POST /v1/ad-campaigns/${c1}/activate", payload: {}, as: AdOps, as_user_id: "ops-1" }
            - { call: "POST /v1/ad-campaigns", payload: { advertiser_name: "Beta", iab_category: "IAB-7", total_budget_cents: 100000, daily_budget_cents: 100000, cpm_cents: 500, flight_start_date: "2026-08-01", flight_end_date: "2026-12-31" }, as: AdOps, captures: { c2: $.data.id } }
            - { call: "POST /v1/ad-creatives", payload: { campaign_id: "${c2}", brand: "Beta Tools", iab_category: "IAB-7", duration_seconds: 30 }, as: AdOps, as_user_id: "ops-1", captures: { cr2: $.data.id } }
            - { call: "POST /v1/ad-creatives/${cr2}/approve", payload: {}, as: AdQualityReviewer, as_user_id: "rev-1" }
            - { call: "POST /v1/ad-campaigns/${c2}/activate", payload: {}, as: AdOps, as_user_id: "ops-1" }
            - { call: "POST /v1/ad-breaks/${b1}/decision-runs", payload: { expected_break_version: "${b1_v}" }, as: AdOps, as_user_id: "ops-1", captures: { d1: "$.data[0].id" } }
            - { call: "POST /v1/ad-breaks/${b2}/decision-runs", payload: { expected_break_version: "${b2_v}" }, as: AdOps, as_user_id: "ops-1", captures: { d2: "$.data[0].id" } }
            - { call: "POST /v1/playlist-loops/${lp}/lock", payload: {}, as: ChannelProgrammer }
            - { call: "POST /v1/channels/${ch}/go-live", payload: {}, as: PlatformAdmin }
            - { call: "GET /v1/channels/${ch}", payload: {}, as: PlatformAdmin, captures: { cv: $.data.version } }
            - { call: "POST /v1/playlist-loops/${lp}/publish", payload: { expected_channel_version: "${cv}" }, as: ChannelProgrammer }
            - { call: "POST /v1/ad-breaks/${b1}/mark-aired", payload: {}, as: ChannelProgrammer }
            - { call: "POST /v1/ad-breaks/${b2}/mark-aired", payload: {}, as: ChannelProgrammer }
            - { call: "POST /v1/distributor-platforms", payload: { name: "Roku-like", reporting_tier: "STANDARD" }, as: PlatformAdmin, captures: { p1: $.data.id } }
            - { call: "PATCH /v1/distributor-platforms/${p1}", payload: { target_status: "ACTIVE" }, as: PlatformAdmin }
            - { call: "POST /v1/distribution-agreements", payload: { channel_id: "${ch}", platform_id: "${p1}", rev_share_bps_below: 2000, rev_share_bps_above: 4000, tier_threshold_cents: 100000, minimum_guarantee_cents: 0, effective_start_date: "2026-01-01", effective_end_date: "2026-12-31" }, as: PlatformAdmin, captures: { ag: $.data.id } }
            - { call: "PATCH /v1/distribution-agreements/${ag}", payload: { target_status: "ACTIVE" }, as: PlatformAdmin }
            - { call: "POST /v1/viewership-events", payload: { channel_id: "${ch}", platform_id: "${p1}", event_type: "AD_IMPRESSION", break_id: "${b1}", decision_id: "${d1}", viewer_session_id: "s1", occurred_at_utc: "2026-09-01T00:07:30Z", quantity: 3 }, as: PlatformAdmin }
            - { call: "POST /v1/viewership-events", payload: { channel_id: "${ch}", platform_id: "${p1}", event_type: "AD_IMPRESSION", break_id: "${b2}", decision_id: "${d2}", viewer_session_id: "s2", occurred_at_utc: "2026-09-01T00:08:00Z", quantity: 3 }, as: PlatformAdmin }
            - { call: "POST /v1/ad-breaks/${b1}/reconcile", payload: {}, as: AdOps, as_user_id: "ops-1" }
            - { call: "POST /v1/ad-breaks/${b2}/reconcile", payload: {}, as: AdOps, as_user_id: "ops-1" }
            - { call: "POST /v1/_clock/set-current-utc", payload: { to_iso8601: "2026-10-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /v1/revenue-reports", payload: { channel_id: "${ch}", platform_id: "${p1}", period_month: "2026-09" }, as: FinanceAnalyst, as_user_id: "fin-1", captures: { rp: $.data.id } }
            - { call: "POST /v1/revenue-reports/${rp}/generate-provisional", payload: {}, as: FinanceAnalyst, as_user_id: "fin-1" }
          trigger:
            - { call: "POST /v1/revenue-reports/${rp}/finalize", payload: {}, as: FinanceController, as_user_id: "ctl-1" }
          assert:
            - "FillDecision.${d1}.reconciled_cost_cents == 2 (round_half_up(500*3/1000) = round_half_up(1.5))"
            - "FillDecision.${d2}.reconciled_cost_cents == 2"
            - "RevenueReport.${rp}.gross_revenue_cents == 4 — per-pair rounding (2+2), NOT sum-then-round (3)"
            - "RevenueReport.${rp}.platform_share_cents == 1 (round_half_up(4*2000/10000) = round_half_up(0.8))"
            - "RevenueReport.${rp}.net_revenue_cents == 3"

      - name: r2_tiered_share_pinned_evaluation_order_marginal_split
        grounds:
          - calculations.revenue_share_statement
          - entities.DistributionAgreement.fields.locked_tier_threshold_cents
        distinguishing_aspect: |
          Mode (c) circular-looking dependency: the tier is selected by gross
          while the share determines net — the pinned order (gross -> tier split
          -> marginal share -> net) makes gross 2000 with threshold 1000 yield
          share 700 (1000*3000 + 1000*4000 bps), not 600 (flat below-rate) and
          not 800 (flat above-rate).
        test_recipe:
          setup:
            - "Channel ch (600s) LIVE, loop lp 2026-09-01 PUBLISHED with one 30s break b1 decided with d1 (campaign c1 cpm 1000, creative cr1 30s, budget 100000, daily 100000)"
            - "d1 RECONCILED with 2000 impressions on platform p1 -> gross 2000 = round_half_up(1000*2000/1000)"
            - "Agreement ag: below 3000 bps, above 4000 bps, threshold 1000, min 0, ACTIVE; clock 2026-10-01; report rp provisional then finalized"
          setup_api_calls:
            - { call: "POST /v1/channels", payload: { name: "Ch D", genre: "movies", timezone: "UTC", loop_duration_seconds: 600 }, as: PlatformAdmin, captures: { ch: $.data.id } }
