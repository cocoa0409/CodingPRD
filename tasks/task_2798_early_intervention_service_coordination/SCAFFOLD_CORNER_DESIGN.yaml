              as: Evaluator
            - call: "POST /ei/assessments/${eval_id}/complete"
              payload: { completion_date: "2026-04-01", eligibility_recommendation: "ELIGIBLE", family_unavailable_days: 0 }
              as: Evaluator
            - call: "POST /ei/assessments/${eval_id}/complete"
              payload: { completion_date: "2026-03-18", eligibility_recommendation: "ELIGIBLE", family_unavailable_days: 0 }
              as: Evaluator
          assert:
            - "Trigger 1: HTTP 422 with response.data.error_id == \"ERR_DATE_IN_FUTURE\""
            - "Trigger 2: HTTP 422 with response.data.error_id == \"ERR_INVALID_DATE_RANGE\" — 2026-03-01 precedes the referral_received_date 2026-03-02"
            - "Trigger 3: HTTP 422 with response.data.error_id == \"ERR_DATE_IN_FUTURE\" — priority 50 wins over the ordering rule"
            - "Trigger 4: HTTP 200 with response.data.status == \"COMPLETED\" and completion_date == \"2026-03-18\""
            - "Assessment.${eval_id}.status was \"SCHEDULED\" before trigger 4 — none of the three refusals mutated it"

      - name: consent_refused_when_a_clinic_line_lacks_the_plan_level_justification
