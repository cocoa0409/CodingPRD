          assert:
            - "error_id == ERR_PRESCRIBER_OPT_OUT_VIOLATION with HTTP 422 (safety priority 15 beats temporal priority 19)"
            - "delivery remains SCHEDULED"

      - name: include_jurisdiction_restricted_prescriber_rejected
        claim_type: Violation to Error
        grounds:
          - validations[priority=16]
          - errors[ERR_JURISDICTION_RESTRICTED]
          - entities.JurisdictionRule
        distinguishing_aspect: "A CA jurisdiction rule (restrict_prescriber_identifiable, effective_from 2026-01-01 open-ended) makes a forced include of a CA prescriber fail with ERR_JURISDICTION_RESTRICTED under the default clock 2026-09-01 (inside the half-open window); without the include, compile auto-excludes the prescriber and succeeds."
