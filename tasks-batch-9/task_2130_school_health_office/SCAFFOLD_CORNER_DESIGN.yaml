      - name: action_plan_revision_cycle_clears_consent_and_caps_at_two_rounds
        claim_type: cyclic
        grounds:
          - state_machines.ActionPlan.PENDING_PROVIDER_to_DRAFT
          - entities.ActionPlan.fields.revision_round
          - entities.ActionPlan.fields.guardian_consent_at
          - validations[priority=44]
          - errors[ERR_REVISION_LIMIT_REACHED]
        distinguishing_aspect: "Each REQUEST_REVISION returns the plan to DRAFT, increments revision_round and clears guardian_consent_at to null so the guardian must consent again; the third REQUEST_REVISION on a plan already at revision_round 2 is refused with ERR_REVISION_LIMIT_REACHED and the plan stays PENDING_PROVIDER."
