            - "key_status == REVOKED"
            - "active_keys == 0"
            - "exposures contains exactly one KEY_ISSUED and one KEY_REVOKED record for (A, build)"
      - name: nda_republish_repaper_cascade
        grounds:
          - state_machines.NdaAgreement.DRAFT_to_PUBLISHED
          - state_machines.NdaSignature.SIGNED_to_VOIDED
          - state_machines.ScreeningApplication.ENROLLED_to_APPROVED
        distinguishing_aspect: |
          Depth-3 chain from POST /playtests/nda-agreements/{id}/publish of a new
          version: publish retires the old agreement (link 1); retirement voids
          its SIGNED signature (link 2); the voided signature reverts the
          ENROLLED application to APPROVED, decrements enrolled_count and spawns
          a fresh PENDING signature pinned to the new version (link 3) — a
          different originating transition than breach substantiation.
        test_recipe:
          setup:
