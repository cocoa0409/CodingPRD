            - "AuthorizationRequest.${az1}.decided_at is null and expires_at is null and approved_units is null"
            - "AuthorizationRequest.${az1}.appointment_id == ${ap1} and treatment_plan_id == ${pl1} and payer_name == 'Northwind Health'"
            - "AuthorizationRequest.${az1}.version == 2"
            - "Appointment.${ap1}.readiness_status == 'PENDING' — SUBMITTED is not auth_ok"
            - "Appointment.${ap1}.schedule_status == 'TENTATIVE' and version == 1 — submitting does not version the appointment"

      - name: every_machine_is_born_in_its_declared_initial_state
