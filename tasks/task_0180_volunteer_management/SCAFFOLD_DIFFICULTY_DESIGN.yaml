              as_user_id: "${first_id}"
              captures: { su_first: $.data.id }
            - call: "GET /vm/shifts/${shift_id}"
              payload: {}
              as: ShiftCoordinator
              captures: { shift_v1: $.data.version, rc: $.data.reserved_count, st: $.data.status }
          trigger:
            - call: "POST /vm/shifts/${shift_id}/signups"
              payload: { volunteer_id: "${second_id}", expected_shift_version: "${shift_v1}" }
              as: Volunteer
              as_user_id: "${second_id}"
              captures: { err: $.data.error_id }
          assert:
            - "after first signup Shift.${shift_id}.reserved_count == 1 and status == FULL"
            - "second signup response status == 409 and data.error_id == ERR_SHIFT_FULL"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: signup_requires_volunteer_active_not_suspended
        grounds:
          - validations[priority=7]
          - state_machines.Signup.CONFIRMED_to_NO_SHOW
          - entities.Volunteer.fields.status
          - errors[ERR_VOLUNTEER_NOT_ELIGIBLE]
        distinguishing_aspect: "Entity pair Signup->Volunteer: a Signup may only be created when the acting Volunteer.status == ACTIVE; a SUSPENDED Volunteer (suspended by no-show strikes) is rejected ERR_VOLUNTEER_NOT_ELIGIBLE."
        test_recipe:
          setup:
            - "A Volunteer auto-SUSPENDED by reaching no_show_strike_limit 1 (one NO_SHOW), then attempting a fresh signup on an unrelated OPEN shift."
          setup_api_calls:
            - call: "POST /vm/organizations"
              payload: { name: "Strikes Org", no_show_strike_limit: 1, reliability_suspension_threshold: 0 }
              as: ShiftCoordinator
              captures: { org_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: ShiftCoordinator
            - call: "POST /vm/volunteers"
              payload: { organization_id: "${org_id}", full_name: "Susp V", email: "susp@x.com" }
              as: ShiftCoordinator
              captures: { vol_id: $.data.id }
            - call: "POST /vm/opportunities"
              payload: { organization_id: "${org_id}", title: "Strike Day" }
              as: ShiftCoordinator
              captures: { opp_id: $.data.id }
            - call: "POST /vm/shifts"
              payload: { opportunity_id: "${opp_id}", starts_at: "2026-07-01T09:00:00Z", ends_at: "2026-07-01T12:00:00Z", capacity: 5 }
              as: ShiftCoordinator
              captures: { shift_a: $.data.id, shift_a_v: $.data.version }
            - call: "POST /vm/shifts"
              payload: { opportunity_id: "${opp_id}", starts_at: "2026-07-08T09:00:00Z", ends_at: "2026-07-08T12:00:00Z", capacity: 5 }
              as: ShiftCoordinator
              captures: { shift_b: $.data.id, shift_b_v: $.data.version }
            - call: "POST /vm/opportunities/${opp_id}/publish"
              payload: {}
              as: ShiftCoordinator
            - call: "POST /vm/shifts/${shift_a}/signups"
              payload: { volunteer_id: "${vol_id}", expected_shift_version: "${shift_a_v}" }
              as: Volunteer
              as_user_id: "${vol_id}"
              captures: { su_a: $.data.id }
            - call: "POST /vm/signups/${su_a}/confirm"
              payload: {}
              as: Volunteer
              as_user_id: "${vol_id}"
            - call: "POST /vm/signups/${su_a}/mark-no-show"
              payload: {}
              as: ShiftCoordinator
            - call: "GET /vm/volunteers/${vol_id}"
              payload: {}
              as: ShiftCoordinator
              captures: { vstatus: $.data.status }
          trigger:
            - call: "POST /vm/shifts/${shift_b}/signups"
              payload: { volunteer_id: "${vol_id}", expected_shift_version: "${shift_b_v}" }
              as: Volunteer
              as_user_id: "${vol_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Volunteer.${vol_id}.status == SUSPENDED after the no-show"
            - "fresh signup response status == 403 and data.error_id == ERR_VOLUNTEER_NOT_ELIGIBLE"

      - name: group_approve_requires_opportunity_published_and_group_event
        grounds:
          - state_machines.CorporateGroup.PROPOSED_to_APPROVED
          - entities.Opportunity.fields.publication_status
          - entities.Opportunity.fields.is_group_event
          - errors[ERR_OPPORTUNITY_NOT_PUBLISHED]
        distinguishing_aspect: "Different entity pair CorporateGroup->Opportunity: a CorporateGroup may only move PROPOSED->APPROVED when its parent Opportunity is PUBLISHED and is_group_event==true; a DRAFT parent rejects approve with ERR_OPPORTUNITY_NOT_PUBLISHED."
        test_recipe:
          setup:
            - "A DRAFT Opportunity with is_group_event true, one Shift, and a PROPOSED CorporateGroup targeting that shift (opportunity NOT yet published)."
          setup_api_calls:
            - call: "POST /vm/organizations"
              payload: { name: "Helping Hands" }
              as: ShiftCoordinator
              captures: { org_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: ShiftCoordinator
            - call: "POST /vm/opportunities"
              payload: { organization_id: "${org_id}", title: "Corp Day", is_group_event: true }
              as: ShiftCoordinator
              captures: { opp_id: $.data.id }
            - call: "POST /vm/shifts"
              payload: { opportunity_id: "${opp_id}", starts_at: "2026-07-01T09:00:00Z", ends_at: "2026-07-01T12:00:00Z", capacity: 10 }
              as: ShiftCoordinator
              captures: { shift_id: $.data.id }
            - call: "POST /vm/corporate-groups"
              payload: { opportunity_id: "${opp_id}", sponsor_name: "Acme", requested_seats: 4, target_shift_id: "${shift_id}" }
              as: CorporateSponsor
              captures: { grp_id: $.data.id }
          trigger:
            - call: "POST /vm/corporate-groups/${grp_id}/approve"
              payload: {}
              as: ShiftCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409 and data.error_id == ERR_OPPORTUNITY_NOT_PUBLISHED"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: individual_signup_half_open_overlap_rejected
        grounds:
          - validations[priority=8]
          - errors[ERR_SHIFT_TIME_CONFLICT]
          - entities.Shift.fields.starts_at
          - entities.Shift.fields.ends_at
        distinguishing_aspect: "Half-open [starts_at, ends_at) interval semantics on the Shift resource via individual signup: shift B 11:00-13:00 strictly overlaps a held shift A 10:00-12:00 (overlap on [11:00,12:00)) and is rejected ERR_SHIFT_TIME_CONFLICT."
        test_recipe:
          setup:
            - "Volunteer holds a CONFIRMED Signup on shift A 10:00-12:00; shift B 11:00-13:00 overlaps; B has free capacity."
          setup_api_calls:
            - call: "POST /vm/organizations"
              payload: { name: "Helping Hands" }
              as: ShiftCoordinator
              captures: { org_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: ShiftCoordinator
            - call: "POST /vm/volunteers"
              payload: { organization_id: "${org_id}", full_name: "Ov V", email: "ov@x.com" }
              as: ShiftCoordinator
              captures: { vol_id: $.data.id }
            - call: "POST /vm/opportunities"
              payload: { organization_id: "${org_id}", title: "Overlap" }
              as: ShiftCoordinator
              captures: { opp_id: $.data.id }
            - call: "POST /vm/shifts"
              payload: { opportunity_id: "${opp_id}", starts_at: "2026-07-01T10:00:00Z", ends_at: "2026-07-01T12:00:00Z", capacity: 5 }
              as: ShiftCoordinator
              captures: { shift_a: $.data.id, shift_a_v: $.data.version }
            - call: "POST /vm/shifts"
              payload: { opportunity_id: "${opp_id}", starts_at: "2026-07-01T11:00:00Z", ends_at: "2026-07-01T13:00:00Z", capacity: 5 }
              as: ShiftCoordinator
              captures: { shift_b: $.data.id, shift_b_v: $.data.version }
            - call: "POST /vm/opportunities/${opp_id}/publish"
              payload: {}
              as: ShiftCoordinator
            - call: "POST /vm/shifts/${shift_a}/signups"
              payload: { volunteer_id: "${vol_id}", expected_shift_version: "${shift_a_v}" }
              as: Volunteer
              as_user_id: "${vol_id}"
              captures: { su_a: $.data.id }
            - call: "POST /vm/signups/${su_a}/confirm"
              payload: {}
              as: Volunteer
              as_user_id: "${vol_id}"
          trigger:
            - call: "POST /vm/shifts/${shift_b}/signups"
              payload: { volunteer_id: "${vol_id}", expected_shift_version: "${shift_b_v}" }
              as: Volunteer
              as_user_id: "${vol_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409 and data.error_id == ERR_SHIFT_TIME_CONFLICT"

      - name: adjacent_shifts_touching_endpoints_allowed
        grounds:
          - validations[priority=8]
          - entities.Shift.fields.starts_at
          - entities.Shift.fields.ends_at
          - state_machines.Signup.RESERVED_to_CONFIRMED
        distinguishing_aspect: "Different interval semantics (adjacency, gap==0) on the Shift resource: shift B 12:00-14:00 starts exactly when held shift A 10:00-12:00 ends; half-open intervals do NOT overlap at the touching endpoint, so the back-to-back signup SUCCEEDS (RESERVED), unlike the strict-overlap case."
        test_recipe:
          setup:
            - "Volunteer holds a CONFIRMED Signup on shift A 10:00-12:00; shift B 12:00-14:00 is adjacent (touching at 12:00)."
          setup_api_calls:
            - call: "POST /vm/organizations"
              payload: { name: "Helping Hands" }
              as: ShiftCoordinator
              captures: { org_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: ShiftCoordinator
            - call: "POST /vm/volunteers"
              payload: { organization_id: "${org_id}", full_name: "Ad V", email: "ad@x.com" }
              as: ShiftCoordinator
              captures: { vol_id: $.data.id }
            - call: "POST /vm/opportunities"
              payload: { organization_id: "${org_id}", title: "BackToBack" }
              as: ShiftCoordinator
              captures: { opp_id: $.data.id }
            - call: "POST /vm/shifts"
              payload: { opportunity_id: "${opp_id}", starts_at: "2026-07-01T10:00:00Z", ends_at: "2026-07-01T12:00:00Z", capacity: 5 }
              as: ShiftCoordinator
              captures: { shift_a: $.data.id, shift_a_v: $.data.version }
            - call: "POST /vm/shifts"
              payload: { opportunity_id: "${opp_id}", starts_at: "2026-07-01T12:00:00Z", ends_at: "2026-07-01T14:00:00Z", capacity: 5 }
              as: ShiftCoordinator
              captures: { shift_b: $.data.id, shift_b_v: $.data.version }
            - call: "POST /vm/opportunities/${opp_id}/publish"
              payload: {}
              as: ShiftCoordinator
            - call: "POST /vm/shifts/${shift_a}/signups"
              payload: { volunteer_id: "${vol_id}", expected_shift_version: "${shift_a_v}" }
              as: Volunteer
              as_user_id: "${vol_id}"
              captures: { su_a: $.data.id }
            - call: "POST /vm/signups/${su_a}/confirm"
              payload: {}
              as: Volunteer
              as_user_id: "${vol_id}"
          trigger:
            - call: "POST /vm/shifts/${shift_b}/signups"
              payload: { volunteer_id: "${vol_id}", expected_shift_version: "${shift_b_v}" }
              as: Volunteer
              as_user_id: "${vol_id}"
              captures: { su_b: $.data.id, su_b_status: $.data.status }
          assert:
            - "response status == 201"
            - "Signup.${su_b}.status == RESERVED"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: signup_cancel_restores_shift_reserved_count
        grounds:
          - state_machines.Signup.RESERVED_to_CONFIRMED
          - state_machines.Signup.CONFIRMED_to_CANCELLED
          - entities.Shift.fields.reserved_count
          - entities.Shift.fields.capacity
        distinguishing_aspect: "Conserved quantity = available seats (capacity - reserved_count) on the Shift: create-signup then cancel-signup leaves reserved_count back at its pre-signup value (1 -> 2 -> 1), so available seats are unchanged after the forward+compensating pair."
        test_recipe:
          setup:
            - "A capacity-3 Shift already holding 1 seat (one other volunteer signed up), reserved_count == 1."
          setup_api_calls:
            - call: "POST /vm/organizations"
              payload: { name: "Helping Hands" }
              as: ShiftCoordinator
              captures: { org_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: ShiftCoordinator
            - call: "POST /vm/volunteers"
              payload: { organization_id: "${org_id}", full_name: "Base V", email: "base@x.com" }
              as: ShiftCoordinator
              captures: { base_id: $.data.id }
            - call: "POST /vm/volunteers"
              payload: { organization_id: "${org_id}", full_name: "Comp V", email: "comp@x.com" }
              as: ShiftCoordinator
              captures: { vol_id: $.data.id }
            - call: "POST /vm/opportunities"
              payload: { organization_id: "${org_id}", title: "Seats" }
              as: ShiftCoordinator
              captures: { opp_id: $.data.id }
            - call: "POST /vm/shifts"
              payload: { opportunity_id: "${opp_id}", starts_at: "2026-07-01T09:00:00Z", ends_at: "2026-07-01T12:00:00Z", capacity: 3 }
              as: ShiftCoordinator
              captures: { shift_id: $.data.id, shift_v0: $.data.version }
            - call: "POST /vm/opportunities/${opp_id}/publish"
              payload: {}
              as: ShiftCoordinator
            - call: "POST /vm/shifts/${shift_id}/signups"
              payload: { volunteer_id: "${base_id}", expected_shift_version: "${shift_v0}" }
              as: Volunteer
              as_user_id: "${base_id}"
              captures: { su_base: $.data.id }
            - call: "GET /vm/shifts/${shift_id}"
              payload: {}
              as: ShiftCoordinator
              captures: { shift_v1: $.data.version, rc_before: $.data.reserved_count }
          trigger:
            - call: "POST /vm/shifts/${shift_id}/signups"
              payload: { volunteer_id: "${vol_id}", expected_shift_version: "${shift_v1}" }
              as: Volunteer
              as_user_id: "${vol_id}"
              captures: { su_comp: $.data.id }
            - call: "POST /vm/signups/${su_comp}/cancel"
              payload: {}
              as: Volunteer
              as_user_id: "${vol_id}"
            - call: "GET /vm/shifts/${shift_id}"
              payload: {}
              as: ShiftCoordinator
              captures: { rc_after: $.data.reserved_count }
          assert:
            - "before trigger Shift.${shift_id}.reserved_count == 1"
            - "after create+cancel Shift.${shift_id}.reserved_count == 1 (available seats conserved at capacity - reserved_count == 2)"

      - name: bg_reject_leaves_volunteer_tier_unchanged
        grounds:
          - state_machines.BackgroundCheck.IN_PROGRESS_to_CLEARED
          - state_machines.BackgroundCheck.IN_PROGRESS_to_REJECTED
          - calculations.bg_check_tier
          - entities.Volunteer.fields.bg_check_tier
        distinguishing_aspect: "Different conserved quantity = the Volunteer's effective bg_check_tier rank: a Volunteer cleared at STANDARD then a SECOND check that is REJECTED leaves bg_check_tier == STANDARD unchanged — the rejected check contributes zero, so the tier (a different conserved quantity than seat count) does not drift."
        test_recipe:
          setup:
            - "Volunteer cleared at STANDARD (bg_check_tier STANDARD). A second BASIC check is opened and IN_PROGRESS."
          setup_api_calls:
            - call: "POST /vm/organizations"
              payload: { name: "Helping Hands" }
              as: ComplianceOfficer
              captures: { org_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /vm/volunteers"
              payload: { organization_id: "${org_id}", full_name: "Tier V", email: "tier@x.com" }
              as: ComplianceOfficer
              captures: { vol_id: $.data.id }
            - call: "POST /vm/background-checks"
              payload: { volunteer_id: "${vol_id}", requested_tier: "STANDARD" }
              as: ComplianceOfficer
              captures: { chk1: $.data.id }
            - call: "POST /vm/background-checks/${chk1}/start"
              payload: {}
              as: ComplianceOfficer
            - call: "GET /vm/volunteers/${vol_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { vol_v1: $.data.version }
            - call: "POST /vm/background-checks/${chk1}/decide"
              payload: { decision: "CLEARED", expected_volunteer_version: "${vol_v1}" }
              as: ComplianceOfficer
            - call: "POST /vm/background-checks"
              payload: { volunteer_id: "${vol_id}", requested_tier: "BASIC" }
              as: ComplianceOfficer
              captures: { chk2: $.data.id }
            - call: "POST /vm/background-checks/${chk2}/start"
              payload: {}
              as: ComplianceOfficer
            - call: "GET /vm/volunteers/${vol_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { tier_before: $.data.bg_check_tier, vol_v2: $.data.version }
          trigger:
            - call: "POST /vm/background-checks/${chk2}/decide"
              payload: { decision: "REJECTED", expected_volunteer_version: "${vol_v2}" }
              as: ComplianceOfficer
            - call: "GET /vm/volunteers/${vol_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { tier_after: $.data.bg_check_tier }
          assert:
            - "before reject Volunteer.${vol_id}.bg_check_tier == STANDARD"
            - "after reject Volunteer.${vol_id}.bg_check_tier == STANDARD (tier rank conserved)"
