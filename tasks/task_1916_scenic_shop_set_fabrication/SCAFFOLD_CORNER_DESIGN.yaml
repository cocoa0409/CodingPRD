          - 'errors[ERR_CREDIT_LIMIT_EXCEEDED]'
        distinguishing_aspect: "Credit rule is strict-greater: outstanding 0 + 1000000 == limit 1000000 passes (equality allowed); a second accept (1000000 + 500000 > 1000000) fails with ERR_CREDIT_LIMIT_EXCEEDED."
        test_recipe:
          setup: ["client credit_limit 900000; bid A ROM area 100 A_SIMPLE -> price 900000 (== limit); bid B ROM area 50 A_SIMPLE -> price 450000; both SUBMITTED (load_in dates > 28 days out, no urgency)"]
          setup_api_calls:
            - call: "POST /scenic/shops"
              payload: { name: "Metro Scenic", weekly_crew_hours_capacity: 100, horizon_weeks: 4, bay_count: 2, truck_fleet_size: 6, labor_rate_cents_per_hour: 8000, overtime_multiplier_bp: 15000, overhead_pct_bp: 1000, margin_pct_bp: 2000 }
              as: ShopAdmin
              captures: { shop_id: $.data.id }
