      - name: target_assignment_referential_gates_rejected
        claim_type: Violation → Error
        grounds:
          - validations.priority_101
          - validations.priority_102
          - errors.ERR_JOB_LEVEL_TARGET_MISSING
          - errors.ERR_POOL_MISSING_FOR_UNIT
          - endpoints."POST /bonus-plans/{planId}/target-assignments"
        distinguishing_aspect: |
          Both gaps are only detectable when the bulk target assignment fans out:
          plan A has an L3 participant but only an L5 JobLevelTarget row, plan B has
          a participant in a unit with no pool. Each plan returns its own 422 and —
          because the endpoint is all-or-nothing — creates ZERO awards, leaving both
          plans in DRAFT with total_target_cents 0.
        test_recipe:
          setup:
            - "Plan A: L5 target row only, pool for unit H2, one L3 participant in H2."
            - "Plan B: L3 target row, pool for unit H2 only, one L3 participant in unit H3."
          setup_api_calls:
            - call: "POST /business-units"
