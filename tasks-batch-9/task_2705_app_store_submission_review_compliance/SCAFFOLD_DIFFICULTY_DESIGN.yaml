  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: occ_412_precedes_duplicate_build_409
        grounds:
          - concurrency_rules[submission-create-stale-app-record]
          - validations[priority=30]
          - validations[priority=65]
          - entities.AppRecord.fields.version
          - state_machines.Submission.DRAFT_to_DEVELOPER_WITHDRAWN
          - errors.ERR_STALE_APP_RECORD_VERSION
          - errors.ERR_DUPLICATE_BUILD_NUMBER
        distinguishing_aspect: |
          One POST /submissions that is BOTH stale (expected_app_record_version is the pre-sub1
          revision) AND duplicate (build_number 10 already exists on a DRAFT build) must return
          412 ERR_STALE_APP_RECORD_VERSION, never 409 ERR_DUPLICATE_BUILD_NUMBER; and because the
          DRAFT -> DEVELOPER_WITHDRAWN sweep is a SIDE EFFECT of a successful create, it cannot
          retroactively free build 10 for the control call that supplies the fresh version.
        test_recipe:
          setup:
            - "PublisherAccount ACTIVE (program_status ACTIVE, membership_paid_through_at 2027-08-01T00:00:00Z)"
            - "AppRecord IOS com.northwind.wallet with an ACTIVE DISTRIBUTION_CERT and an ACTIVE PROVISIONING_PROFILE linked to it"
            - "Exactly one Submission, build_number 10, state DRAFT; AppRecord.version has already advanced once because of that create"
            - "The client still holds the pre-create AppRecord.version value"
            - "Clock at its startup default 2026-08-01T00:00:00Z (no clock call needed)"
          setup_api_calls:
            - { call: "POST /publisher-accounts", payload: { legal_name: "Northwind Mobile Ltd", contact_email: "ops@northwind.example", membership_paid_through_at: "2027-08-01T00:00:00Z", commerce_program_tier: "STANDARD" }, as: PlatformPolicyAdmin, as_user_id: "u-policy-1", captures: { acct_id: "$.data.id", acct_v1: "$.data.version" } }
            - { call: "POST /signing-credentials", payload: { expected_publisher_account_version: "${acct_v1}", publisher_account_id: "${acct_id}", credential_type: "DISTRIBUTION_CERT", platform: "IOS", key_custody: "HSM", not_before: "2026-07-01T00:00:00Z", not_after: "2027-07-01T00:00:00Z" }, as: PublisherAdmin, as_user_id: "u-pubadmin-1", captures: { cert_id: "$.data.id" } }
            - { call: "POST /signing-credentials/${cert_id}/activate", payload: {}, as: PublisherAdmin, as_user_id: "u-pubadmin-1" }
            - { call: "GET /publisher-accounts/${acct_id}", payload: {}, as: PublisherAdmin, as_user_id: "u-pubadmin-1", captures: { acct_v2: "$.data.version" } }
            - { call: "POST /signing-credentials", payload: { expected_publisher_account_version: "${acct_v2}", publisher_account_id: "${acct_id}", credential_type: "PROVISIONING_PROFILE", platform: "IOS", key_custody: "CLOUD_MANAGED", not_before: "2026-07-01T00:00:00Z", not_after: "2027-07-01T00:00:00Z", linked_cert_id: "${cert_id}" }, as: PublisherAdmin, as_user_id: "u-pubadmin-1", captures: { prof_id: "$.data.id" } }
            - { call: "POST /signing-credentials/${prof_id}/activate", payload: {}, as: PublisherAdmin, as_user_id: "u-pubadmin-1" }
            - { call: "POST /app-records", payload: { publisher_account_id: "${acct_id}", bundle_id: "com.northwind.wallet", platform: "IOS", display_name: "Northwind Wallet", primary_category: "FINANCE" }, as: PublisherAdmin, as_user_id: "u-pubadmin-1", captures: { app_id: "$.data.id" } }
            - { call: "GET /app-records/${app_id}", payload: {}, as: ReleaseManager, as_user_id: "u-release-1", captures: { app_v1: "$.data.version" } }
            - { call: "POST /submissions", payload: { expected_app_record_version: "${app_v1}", app_record_id: "${app_id}", signing_credential_id: "${prof_id}", build_number: 10, version_string: "1.0.0", release_mode: "PHASED" }, as: ReleaseManager, as_user_id: "u-release-1", captures: { sub1_id: "$.data.id" } }
          trigger:
            - { call: "POST /submissions", payload: { expected_app_record_version: "${app_v1}", app_record_id: "${app_id}", signing_credential_id: "${prof_id}", build_number: 10, version_string: "1.0.1", release_mode: "PHASED" }, as: ReleaseManager, as_user_id: "u-release-1" }
            - { call: "GET /app-records/${app_id}", payload: {}, as: ReleaseManager, as_user_id: "u-release-1", captures: { app_v2: "$.data.version" } }
            - { call: "POST /submissions", payload: { expected_app_record_version: "${app_v2}", app_record_id: "${app_id}", signing_credential_id: "${prof_id}", build_number: 10, version_string: "1.0.1", release_mode: "PHASED" }, as: ReleaseManager, as_user_id: "u-release-1" }
            - { call: "POST /submissions", payload: { expected_app_record_version: "${app_v2}", app_record_id: "${app_id}", signing_credential_id: "${prof_id}", build_number: 11, version_string: "1.0.1", release_mode: "PHASED" }, as: ReleaseManager, as_user_id: "u-release-1", captures: { sub2_id: "$.data.id" } }
          assert:
            - "first POST /submissions (stale ${app_v1} + duplicate build 10) -> 412 ERR_STALE_APP_RECORD_VERSION"
            - "the 412 response body carries ERR_STALE_APP_RECORD_VERSION and NOT ERR_DUPLICATE_BUILD_NUMBER"
            - "second POST /submissions (fresh ${app_v2} + duplicate build 10) -> 409 ERR_DUPLICATE_BUILD_NUMBER"
            - "third POST /submissions (fresh ${app_v2} + build 11) -> 201"
            - "AppRecord.${app_id}.version == ${app_v2} + 1 after the 201 (neither refused call incremented it)"
            - "Submission.${sub1_id}.state == DEVELOPER_WITHDRAWN (swept by the successful build-11 create, not by either refused call)"
            - "Submission.${sub2_id}.state == DRAFT"
            - "Submission.${sub2_id}.build_number == 11"
            - "GET /submissions?app_record_id=${app_id} returns exactly 2 rows (no partially-created row from the 412 or the 409)"

      - name: frozen_posture_precedes_critical_finding
        grounds:
          - validations[priority=40]
          - validations[priority=55]
          - calculations.compliance_posture
          - state_machines.BehaviorFinding.OPEN_to_DISPUTED
          - state_machines.BehaviorFinding.DISPUTED_to_RECONCILED
          - state_machines.BehaviorFinding.OPEN_to_DISMISSED
          - errors.ERR_APP_COMPLIANCE_FROZEN
          - errors.ERR_CRITICAL_FINDING_UNRESOLVED
          - errors.ERR_WAIVER_NOT_PERMITTED
          - errors.ERR_DISCLOSURE_STILL_MISSING
        distinguishing_aspect: |
          An OPEN CRITICAL BehaviorFinding satisfies BOTH the posture gate at priority 40
          (F3 CRITICAL_FINDING_OPEN -> FROZEN) and the business-safety gate at priority 55, so
          POST /submissions/{id}/queue must answer ERR_APP_COMPLIANCE_FROZEN and never
          ERR_CRITICAL_FINDING_UNRESOLVED; DISPUTE does not lift the freeze because F3 covers
          DISPUTED as well, and DISMISS is refused on CRITICAL, leaving RECONCILE the only exit.
        test_recipe:
          setup:
            - "PublisherAccount ACTIVE; AppRecord IOS with one PASSED PRIVACY FeatureMapping (feature_compliance_index 100.00)"
            - "Submission build 10 in state PRE_REVIEW_PASSED, pre_review_checked_at 2026-08-01T00:00:00Z, declared_privacy_items = [{PRECISE_LOCATION, APP_FUNCTIONALITY, true, false}]"
            - "Clock advanced to 2026-08-01T06:00:00Z, then one CRITICAL finding matching the declared tuple and one MINOR finding on an UNDECLARED tuple, both OPEN"
            - "AppRecord.compliance_posture == FROZEN with posture_reason_codes == [CRITICAL_FINDING_OPEN]"
            - "One open ReviewCapacityWindow IOS/POOL_A with 5 slots"
          setup_api_calls:
