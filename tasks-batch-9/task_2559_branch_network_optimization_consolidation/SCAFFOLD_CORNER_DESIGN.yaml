            - "${obs6_fc} == 3000000000 and ${obs6_var} == 0, so DeNovoSitePlan.${plan_id}.ramp_attainment_bps == 10000 with ramp_status ON_TRACK (never MET: month 6 is not month 12)"
            - "${obs12_fc} == 12000000000, ${obs12_var} == -833 and ${obs12_breach} == false, so DeNovoSitePlan.${plan_id}.ramp_attainment_bps == 9167 (round_half_up of 9166.67)"
