            - "The recovery leg verifies the remedy on 2026-08-25 (inside the deadline) and then jumps the clock to 2028-09-01, 742 days after the upheld adjudication, so the 730-day trailing window no longer contains it: trailing recovers to 10000 while lifetime stays 8000."
