              captures: { err: $.data.error_id }
          assert: ["captured err == ERR_UNAUTHENTICATED"]

  # -------------------------------------------------------------------------
  - section: cross_cutting_complexity_layers
    instances:
      - name: session_assign_stale_version_returns_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[session-assign-supersede]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "After a first assign bumps Session.version 1->2, a second assign still carrying expected_session_version 1 is rejected with ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["A session; instructor A assigned (version advanced 1->2); a second instructor B available."]
          setup_api_calls:
            - call: "POST /tunnels"
              payload: { name: "T1", max_weight_kg: 120, default_capacity: 4, turnaround_minutes: 15 }
              as: Manager
              captures: { t_id: $.data.id }
            - call: "POST /instructors"
              payload: { name: "IvyA", cert_level: "L2" }
              as: Manager
              captures: { iA_id: $.data.id }
            - call: "POST /instructors"
              payload: { name: "IvyB", cert_level: "L2" }
              as: Manager
              captures: { iB_id: $.data.id }
            - call: "POST /sessions"
              payload: { tunnel_id: "${t_id}", start_utc: "2026-05-10T10:00:00Z", end_utc: "2026-05-10T10:30:00Z", capacity: 4 }
              as: FrontDesk
              captures: { s_id: $.data.id, s_v0: $.data.version }
            - call: "POST /sessions/${s_id}/assign-instructor"
              payload: { instructor_id: "${iA_id}", expected_session_version: "${s_v0}" }
              as: FrontDesk
          trigger:
            - call: "POST /sessions/${s_id}/assign-instructor"
              payload: { instructor_id: "${iB_id}", expected_session_version: "${s_v0}" }
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert: ["captured err == ERR_STALE_VERSION"]

      - name: session_reassign_correct_version_succeeds
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[session-assign-supersede]", entities.Session.fields.instructor_id, entities.Session.fields.version]
        distinguishing_aspect: "Reassigning with the current version (captured after the first assign) succeeds and supersedes the prior instructor; Session.version increments to 3."
        test_recipe:
          setup: ["A session with instructor A assigned; the post-assign version captured."]
          setup_api_calls:
            - call: "POST /tunnels"
              payload: { name: "T1", max_weight_kg: 120, default_capacity: 4, turnaround_minutes: 15 }
              as: Manager
              captures: { t_id: $.data.id }
            - call: "POST /instructors"
              payload: { name: "IvyA", cert_level: "L2" }
              as: Manager
              captures: { iA_id: $.data.id }
            - call: "POST /instructors"
              payload: { name: "IvyB", cert_level: "L2" }
              as: Manager
              captures: { iB_id: $.data.id }
            - call: "POST /sessions"
              payload: { tunnel_id: "${t_id}", start_utc: "2026-05-10T10:00:00Z", end_utc: "2026-05-10T10:30:00Z", capacity: 4 }
              as: FrontDesk
              captures: { s_id: $.data.id, s_v0: $.data.version }
            - call: "POST /sessions/${s_id}/assign-instructor"
              payload: { instructor_id: "${iA_id}", expected_session_version: "${s_v0}" }
              as: FrontDesk
              captures: { s_v1: $.data.version }
          trigger:
            - call: "POST /sessions/${s_id}/assign-instructor"
              payload: { instructor_id: "${iB_id}", expected_session_version: "${s_v1}" }
              as: FrontDesk
              captures: { s_v2: $.data.version }
          assert:
            - "Session.${s_id}.instructor_id == ${iB_id}"
            - "Session.${s_id}.version == 3"

      - name: instructor_tier_upgrade_on_second_close
        claim_type: rate_threshold_triggers
        grounds: [entities.Instructor.fields.sessions_completed, entities.Instructor.fields.tier, state_machines.Session.RUNNING_to_CLOSED]
        distinguishing_aspect: "SENIOR_UPGRADE_THRESHOLD is 2: after closing a first session (sessions_completed 1, still JUNIOR), closing a second brings sessions_completed to 2 and tier flips to SENIOR."
        test_recipe:
          setup: ["One instructor who has already had one session closed (sessions_completed 1, JUNIOR); a second staffed running session on a different tunnel by the same instructor."]
          setup_api_calls:
            - call: "POST /tunnels"
              payload: { name: "T1", max_weight_kg: 120, default_capacity: 4, turnaround_minutes: 15 }
              as: Manager
              captures: { t1_id: $.data.id }
            - call: "POST /tunnels"
              payload: { name: "T2", max_weight_kg: 120, default_capacity: 4, turnaround_minutes: 15 }
              as: Manager
              captures: { t2_id: $.data.id }
            - call: "POST /instructors"
              payload: { name: "Ivy", cert_level: "L2" }
              as: Manager
              captures: { i_id: $.data.id }
            - call: "POST /sessions"
              payload: { tunnel_id: "${t1_id}", start_utc: "2026-05-10T10:00:00Z", end_utc: "2026-05-10T10:30:00Z", capacity: 4 }
              as: FrontDesk
              captures: { s1_id: $.data.id, s1_v: $.data.version }
            - call: "POST /sessions/${s1_id}/assign-instructor"
              payload: { instructor_id: "${i_id}", expected_session_version: "${s1_v}" }
              as: FrontDesk
            - call: "POST /sessions/${s1_id}/start"
              payload: {}
              as: FrontDesk
            - call: "POST /sessions/${s1_id}/close"
              payload: {}
              as: FrontDesk
            - call: "POST /sessions"
              payload: { tunnel_id: "${t2_id}", start_utc: "2026-05-10T11:00:00Z", end_utc: "2026-05-10T11:30:00Z", capacity: 4 }
              as: FrontDesk
              captures: { s2_id: $.data.id, s2_v: $.data.version }
            - call: "POST /sessions/${s2_id}/assign-instructor"
              payload: { instructor_id: "${i_id}", expected_session_version: "${s2_v}" }
              as: FrontDesk
            - call: "POST /sessions/${s2_id}/start"
              payload: {}
              as: FrontDesk
          trigger:
            - call: "POST /sessions/${s2_id}/close"
              payload: {}
              as: FrontDesk
          assert:
            - "Instructor.${i_id}.sessions_completed == 2"
            - "Instructor.${i_id}.tier == SENIOR"

