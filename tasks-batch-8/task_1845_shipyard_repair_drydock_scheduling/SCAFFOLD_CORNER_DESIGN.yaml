  # ===================================================================
  # Section: validations
  # ===================================================================
  - section: validations
    instances:
      - name: existence_before_state_on_activate_unknown_reservation
        claim_type: priority_ordering
        grounds: ["validations[priority=4]", "validations[priority=5]", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "Activating a reservation id that does not exist returns ERR_NOT_FOUND (404); the state-machine check never runs — priority 4 beats priority 5."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /v1/dock-reservations/00000000-0000-4000-8000-000000000000/activate"
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { err: $.data.error_id }
          assert:
            - "captured err == ERR_NOT_FOUND"
      - name: forbidden_role_beats_not_found
        claim_type: priority_ordering
        grounds: ["validations[priority=2]", "validations[priority=4]", "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "A Subcontractor fetching a project with an unknown id gets ERR_FORBIDDEN (403), proving role authorization (priority 2) runs before existence (priority 4)."
        test_recipe:
          setup: ["one registered subcontractor exists; the project id queried does not exist"]
          setup_api_calls:
            - call: "POST /v1/subcontractors"
              payload: { name: "Gulf Steel LLC", trade_codes: ["HULL_STEEL"], day_rate_cents: 500000 }
              as: YardAdmin
              captures: { sc_id: $.data.id }
          trigger:
            - call: "GET /v1/repair-projects/00000000-0000-4000-8000-000000000000"
              as: Subcontractor
              as_user_id: "${sc_id}"
              captures: { err: $.data.error_id }
          assert:
            - "captured err == ERR_FORBIDDEN (not ERR_NOT_FOUND)"
      - name: reservation_end_before_start_returns_window_invalid
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_RESERVATION_WINDOW_INVALID]"]
        distinguishing_aspect: "end_utc equal to start_utc is rejected (strictly-after required) with ERR_RESERVATION_WINDOW_INVALID (422) before any overlap check runs."
        test_recipe:
          setup: ["DRAFT project exists"]
          setup_api_calls:
            - call: "POST /v1/docks"
              payload: { name: "Drydock 1", max_length_m: 230.0, max_beam_m: 40.0, max_depth_m: 12.0, daily_rate_cents: 400000 }
              as: YardAdmin
              captures: { dock_id: $.data.id }
