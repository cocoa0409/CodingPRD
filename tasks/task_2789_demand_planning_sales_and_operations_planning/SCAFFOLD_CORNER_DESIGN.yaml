          assert:
            - "${round_1} == 1, ${round_2} == 2 and ${round_3} == 3 — revision_round increments once per resubmit"
            - "Status is 422 and ${err} == \"ERR_REVISION_LIMIT_REACHED\" — the fourth resubmit is the one that breaks MAX_REVISION_ROUNDS 3"
            - "The OCC token ${fc_v4} was current, so the failure is the rate limit at priority 160 and not ERR_STALE_FORECAST_VERSION at priority 90"
            - "ConsensusAdjustment.${adj_id}.status is still \"REVISION_REQUESTED\", revision_round is still 3, delta_units is still 130, rationale is still \"round three\" and applied_delta_units is still 130"
            - "DemandForecast.${fc_id}.consensus_units == 1000 — no revision round ever endorsed anything"

      - name: adjustment_swing_at_exactly_25_percent_of_baseline_passes
        claim_type: Satisfaction to Pass
        grounds:
          - validations[priority=170]
          - errors.ERR_ADJUSTMENT_SWING_EXCEEDED
          - calculations.calc_consensus_units
        distinguishing_aspect: |
          The swing guardrail compares against round_half_up(baseline_units * 25 / 100), and the
          comparison is "may not EXCEED", so a baseline of 400 admits exactly 100 and refuses
          101 — a one-unit boundary. The limit is derived from baseline_units, never from the
          current consensus_units, so it does not drift as adjustments accumulate.
        test_recipe:
          setup:
            - "The base family, one MATURE item and one customer; a cycle over 2026-09..2026-09 (commitment 0) in DEMAND_REVIEW with one BASELINE forecast of 400 units."
          setup_api_calls:
            - call: "POST /sop/product-families"
              payload: { family_code: "FAM-BASE", name: "Base Family", accountable_planner_user_id: "planner-1", units_per_hour: 100, max_monthly_hours: 800 }
              as: SopAdmin
              captures: { fam_id: $.data.id }
            - call: "POST /sop/items"
              payload: { sku: "SKU-BASE", family_id: "${fam_id}", unit_price_cents: 1000, unit_cost_cents: 400, on_hand_units: 0, material_supply_cap_units: 100000, avg_monthly_demand_units: 1000, lifecycle_state: "MATURE" }
              as: SopAdmin
              captures: { item_id: $.data.id }
            - call: "POST /sop/customers"
              payload: { customer_code: "CUST-BASE", name: "Base Grocery", channel: "GROCERY", priority_rank: 3 }
              as: SopAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /sop/planning-cycles"
              payload: { cycle_code: "CY-SWING", horizon_start_month: "2026-09", horizon_end_month: "2026-09", financial_commitment_cents: 0, supply_review_policy: "NET_INVENTORY_FIRST" }
              as: SopAdmin
              captures: { cycle_id: $.data.id }
            - call: "POST /sop/demand-forecasts"
              payload: { cycle_id: "${cycle_id}", item_id: "${item_id}", customer_id: "${cust_id}", month: "2026-09", level_units: 400, trend_units_per_month: 0, seasonal_index: 1.0, causal_uplift_pct: 0 }
              as: DemandPlanner
              as_user_id: "planner-1"
              captures: { fc_id: $.data.id, fc_v0: $.data.version }
          trigger:
            - call: "POST /sop/consensus-adjustments"
              payload: { demand_forecast_id: "${fc_id}", adjustment_type: "SALES_INTELLIGENCE", delta_units: 101, rationale: "one unit over the guardrail", expected_demand_forecast_version: "${fc_v0}" }
              as: DemandPlanner
              as_user_id: "planner-1"
              captures: { err: $.data.error_id }
            - call: "POST /sop/consensus-adjustments"
              payload: { demand_forecast_id: "${fc_id}", adjustment_type: "SALES_INTELLIGENCE", delta_units: 100, rationale: "exactly at the guardrail", expected_demand_forecast_version: "${fc_v0}" }
              as: DemandPlanner
              as_user_id: "planner-1"
              captures: { adj_id: $.data.id }
            - call: "POST /sop/consensus-adjustments/${adj_id}/reviews"
              payload: { decision: "ENDORSE" }
              as: DemandReviewLead
              as_user_id: "lead-1"
          assert:
            - "The +101 create returns 422 with ${err} == \"ERR_ADJUSTMENT_SWING_EXCEEDED\" — the limit is round_half_up(400 * 25 / 100) == 100 and 101 exceeds it"
            - "DemandForecast.${fc_id}.version is still ${fc_v0} after the rejection, which is why the +100 create can reuse the same OCC token"
            - "The +100 create returns 201 with ConsensusAdjustment.${adj_id}.applied_delta_units == 100 — exactly at the limit is NOT exceeding it"
            - "After the ENDORSE, DemandForecast.${fc_id}.consensus_units == 500 and endorsed_adjustment_count == 1, while baseline_units is still 400"
            - "The guardrail is still 100 for any further adjustment because it is computed from baseline_units 400, not from the new consensus_units 500"

      - name: supply_plan_create_missing_x_user_id_header_unauthenticated_beats_unauthorized
        claim_type: Priority Ordering
        grounds:
          - validations[priority=10]
          - validations[priority=20]
          - errors.ERR_UNAUTHENTICATED
          - errors.ERR_UNAUTHORIZED
        distinguishing_aspect: |
          Priority 10 runs before priority 20, so a request that is BOTH unauthenticated (no
          X-User-ID) and unauthorized (CustomerRep may not create supply plans) must report 401
          ERR_UNAUTHENTICATED. Supplying the header while keeping the wrong role then flips the
          answer to 403 ERR_UNAUTHORIZED, proving both rules are live and correctly ordered.
        test_recipe:
          setup:
            - "One customer exists so that a CustomerRep identity is available; no cycle or item is needed because the request never reaches validation 30."
          setup_api_calls:
            - call: "POST /sop/customers"
              payload: { customer_code: "CUST-BASE", name: "Base Grocery", channel: "GROCERY", priority_rank: 3 }
              as: SopAdmin
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /sop/supply-plans"
              payload: { cycle_id: "00000000-0000-4000-8000-000000000001", item_id: "00000000-0000-4000-8000-000000000002" }
              as: CustomerRep
              captures: { err_noauth: $.data.error_id }
            - call: "POST /sop/supply-plans"
              payload: { cycle_id: "00000000-0000-4000-8000-000000000001", item_id: "00000000-0000-4000-8000-000000000002" }
              as: CustomerRep
              as_user_id: "${cust_id}"
              captures: { err_role: $.data.error_id }
          assert:
            - "The first call omits the X-User-ID header entirely and returns 401 with ${err_noauth} == \"ERR_UNAUTHENTICATED\""
            - "It is NOT 403 ERR_UNAUTHORIZED even though CustomerRep is also barred from POST /sop/supply-plans, and NOT 404 even though both body ids are unknown"
            - "The second call supplies X-User-ID and returns 403 with ${err_role} == \"ERR_UNAUTHORIZED\""
            - "It is still NOT 404 — priority 20 precedes the priority-50 foreign-key resolution, so the unknown cycle_id and item_id are never looked up"
            - "GET /sop/supply-plans as SopAdmin returns total_count == 0"

      - name: transition_invalid_enum_beats_unknown_cycle_returns_invalid_request
        claim_type: Priority Ordering
        grounds:
          - validations[priority=30]
          - validations[priority=40]
          - errors.ERR_INVALID_REQUEST
          - errors.ERR_CYCLE_NOT_FOUND
        distinguishing_aspect: |
          Body shape is validated at priority 30, before the path id is resolved at priority 40.
          A transition request that names a non-member target_status against a cycle id that
          does not exist must therefore answer 400 ERR_INVALID_REQUEST; fixing only the enum
          value flips the same request to 404 ERR_CYCLE_NOT_FOUND.
        test_recipe:
          setup:
            - "Empty database — no PlanningCycle is ever created, so the path id is guaranteed unresolvable."
          setup_api_calls: []
          trigger:
            - call: "POST /sop/planning-cycles/00000000-0000-4000-8000-0000000000ff/transitions"
              payload: { target_status: "NOT_A_STATUS" }
              as: SopAdmin
              captures: { err_shape: $.data.error_id }
            - call: "POST /sop/planning-cycles/00000000-0000-4000-8000-0000000000ff/transitions"
              payload: { target_status: "SUPPLY_REVIEW" }
              as: SopAdmin
              captures: { err_path: $.data.error_id }
          assert:
            - "The first call returns 400 with ${err_shape} == \"ERR_INVALID_REQUEST\" — NOT 404, because priority 30 precedes priority 40"
            - "The second call returns 404 with ${err_path} == \"ERR_CYCLE_NOT_FOUND\""
            - "Neither call returns 409 ERR_CYCLE_TRANSITION_INVALID — priority 120 is never reached without a subject row"
            - "GET /sop/planning-cycles as SopAdmin returns total_count == 0"

      - name: unknown_promotion_id_returns_promotion_not_found_before_not_approved
        claim_type: Priority Ordering
        grounds:
          - validations[priority=50]
          - validations[priority=130]
          - errors.ERR_PROMOTION_NOT_FOUND
          - errors.ERR_PROMOTION_NOT_APPROVED
        distinguishing_aspect: |
          Body foreign keys resolve at priority 50, before the referential-eligibility rules at
          130. A PROMOTION adjustment citing a nonexistent promotion_id must therefore return
          404 ERR_PROMOTION_NOT_FOUND, not the 422 ERR_PROMOTION_NOT_APPROVED that a DRAFT
          promotion would produce — "absent" and "not yet approved" are different answers.
        test_recipe:
          setup:
            - "The base family, one MATURE item and one customer; a cycle over 2026-09..2026-09 (commitment 0) in DEMAND_REVIEW with one BASELINE forecast of 1000 units. One DRAFT promotion exists for the contrast case."
          setup_api_calls:
            - call: "POST /sop/product-families"
              payload: { family_code: "FAM-BASE", name: "Base Family", accountable_planner_user_id: "planner-1", units_per_hour: 100, max_monthly_hours: 800 }
              as: SopAdmin
              captures: { fam_id: $.data.id }
            - call: "POST /sop/items"
              payload: { sku: "SKU-BASE", family_id: "${fam_id}", unit_price_cents: 1000, unit_cost_cents: 400, on_hand_units: 0, material_supply_cap_units: 100000, avg_monthly_demand_units: 1000, lifecycle_state: "MATURE" }
              as: SopAdmin
              captures: { item_id: $.data.id }
            - call: "POST /sop/customers"
              payload: { customer_code: "CUST-BASE", name: "Base Grocery", channel: "GROCERY", priority_rank: 3 }
              as: SopAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /sop/planning-cycles"
              payload: { cycle_code: "CY-FK", horizon_start_month: "2026-09", horizon_end_month: "2026-09", financial_commitment_cents: 0, supply_review_policy: "NET_INVENTORY_FIRST" }
              as: SopAdmin
              captures: { cycle_id: $.data.id }
            - call: "POST /sop/demand-forecasts"
              payload: { cycle_id: "${cycle_id}", item_id: "${item_id}", customer_id: "${cust_id}", month: "2026-09", level_units: 1000, trend_units_per_month: 0, seasonal_index: 1.0, causal_uplift_pct: 0 }
              as: DemandPlanner
              as_user_id: "planner-1"
              captures: { fc_id: $.data.id, fc_v0: $.data.version }
            - call: "POST /sop/promotions"
              payload: { item_id: "${item_id}", customer_id: "${cust_id}", start_month: "2026-09", end_month: "2026-09", lift_pct: 10, cannibalization_pct: 2 }
              as: DemandPlanner
              as_user_id: "planner-1"
              captures: { promo_id: $.data.id }
          trigger:
            - call: "POST /sop/consensus-adjustments"
              payload: { demand_forecast_id: "${fc_id}", adjustment_type: "PROMOTION", delta_units: 0, rationale: "citing a promotion that does not exist", promotion_id: "00000000-0000-4000-8000-0000000000aa", expected_demand_forecast_version: "${fc_v0}" }
              as: DemandPlanner
              as_user_id: "planner-1"
              captures: { err_missing: $.data.error_id }
            - call: "POST /sop/consensus-adjustments"
              payload: { demand_forecast_id: "${fc_id}", adjustment_type: "PROMOTION", delta_units: 0, rationale: "citing a draft promotion", promotion_id: "${promo_id}", expected_demand_forecast_version: "${fc_v0}" }
              as: DemandPlanner
              as_user_id: "planner-1"
              captures: { err_draft: $.data.error_id }
          assert:
            - "The unknown promotion_id returns 404 with ${err_missing} == \"ERR_PROMOTION_NOT_FOUND\""
            - "The existing DRAFT promotion returns 422 with ${err_draft} == \"ERR_PROMOTION_NOT_APPROVED\" — same endpoint, same payload shape, two different priorities"
            - "Neither call left an adjustment behind: GET /sop/consensus-adjustments?demand_forecast_id=${fc_id} returns total_count == 0"
            - "DemandForecast.${fc_id}.status is still \"BASELINE\" and version is still ${fc_v0}"

      - name: segregation_of_duties_beats_stale_cycle_version
        claim_type: Priority Ordering
        grounds:
          - validations[priority=80]
          - validations[priority=90]
          - concurrency_rules[scenario-select-stale-cycle]
          - errors.ERR_SEGREGATION_OF_DUTIES
        distinguishing_aspect: |
          Segregation of duties (priority 80) is checked before the OCC token (priority 90). The
          scenario's own author selecting it with a deliberately stale expected_cycle_version
          must get 403 ERR_SEGREGATION_OF_DUTIES, not 412 ERR_STALE_CYCLE_VERSION; a different
          executive sending the SAME stale token gets the 412, and only the current token
          succeeds.
        test_recipe:
          setup:
            - "The base family, item and customer with a 9-hour block inside 2026-09 (900 units); a cycle over 2026-09..2026-09 with financial_commitment_cents 2_000_000."
            - "One locked forecast of 1000 units and one PLANNED SupplyPlan with constrained_units 900 and shortfall_units 430, so plan_value_cents is 900_000 and gross_gap_cents is 1_100_000."
            - "A CAPACITY_INVESTMENT scenario for 5 added hours, authored by exec-1 and EVALUATED, with the cycle then advanced to EXECUTIVE_REVIEW."
          setup_api_calls:
            - call: "POST /sop/product-families"
              payload: { family_code: "FAM-BASE", name: "Base Family", accountable_planner_user_id: "planner-1", units_per_hour: 100, max_monthly_hours: 800 }
              as: SopAdmin
              captures: { fam_id: $.data.id }
            - call: "POST /sop/items"
              payload: { sku: "SKU-BASE", family_id: "${fam_id}", unit_price_cents: 1000, unit_cost_cents: 400, on_hand_units: 0, material_supply_cap_units: 100000, avg_monthly_demand_units: 1000, service_level_target_pct: 95.0, demand_cv: 0.20, lead_time_days: 30, lifecycle_state: "MATURE" }
              as: SopAdmin
              captures: { item_id: $.data.id }
            - call: "POST /sop/customers"
              payload: { customer_code: "CUST-BASE", name: "Base Grocery", channel: "GROCERY", priority_rank: 3 }
              as: SopAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /sop/capacity-blocks"
              payload: { family_id: "${fam_id}", start_date: "2026-09-01", end_date: "2026-09-30", available_hours: 9 }
              as: SupplyPlanner
              as_user_id: "supply-1"
            - call: "POST /sop/planning-cycles"
              payload: { cycle_code: "CY-SOD", horizon_start_month: "2026-09", horizon_end_month: "2026-09", financial_commitment_cents: 2000000, supply_review_policy: "NET_INVENTORY_FIRST" }
              as: SopAdmin
              captures: { cycle_id: $.data.id, cycle_v_stale: $.data.version }
            - call: "POST /sop/demand-forecasts"
              payload: { cycle_id: "${cycle_id}", item_id: "${item_id}", customer_id: "${cust_id}", month: "2026-09", level_units: 1000, trend_units_per_month: 0, seasonal_index: 1.0, causal_uplift_pct: 0 }
              as: DemandPlanner
              as_user_id: "planner-1"
            - call: "POST /sop/planning-cycles/${cycle_id}/transitions"
              payload: { target_status: "SUPPLY_REVIEW" }
              as: SopAdmin
            - call: "POST /sop/supply-plans"
              payload: { cycle_id: "${cycle_id}", item_id: "${item_id}" }
              as: SupplyPlanner
              as_user_id: "supply-1"
              captures: { plan_id: $.data.id }
            - call: "POST /sop/planning-cycles/${cycle_id}/transitions"
              payload: { target_status: "SCENARIO_REVIEW" }
              as: SopAdmin
            - call: "POST /sop/scenarios"
              payload: { cycle_id: "${cycle_id}", scenario_type: "CAPACITY_INVESTMENT", name: "Buy 5 hours", target_item_id: "${item_id}", added_capacity_hours: 5 }
              as: ExecutiveSponsor
              as_user_id: "exec-1"
              captures: { sc_id: $.data.id }
            - call: "POST /sop/scenarios/${sc_id}/evaluate"
              payload: {}
              as: SupplyPlanner
