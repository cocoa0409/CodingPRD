            - "${err_coverage} == ERR_BLOCK_COVERAGE_INSUFFICIENT (HTTP 422) once MAYOR + CHAMBER are present"
            - "${type_count} == 2, ${status} == APPROVED and ${submitted} == null - three refusals wrote nothing"

      - name: cutoff_spread_beyond_tolerance_blocks_submit_until_realigned
