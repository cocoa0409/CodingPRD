            - call: "POST /contacts"
              payload: { account_id: "${acct_id}", full_name: "Vv5", address_line1: "1 V", city: "LA", region: "CA", postal_code: "90001", country_code: "US" }
              as: AccountHolder
              as_user_id: "${acct_id}"
              captures: { contact_id: $.data.id }
            - call: "POST /cards"
              payload: { sku: "CVV5", title: "Bday", category: "BIRTHDAY", base_price_cents: 200, weight_grams: 10 }
