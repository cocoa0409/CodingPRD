# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml — §1.8 Test Targeting Index
# task_3098_investment_research_ratings_managed_data_licensing
# 9 rule_ids x 2 instances = 18 instances.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: quantitative_star_provisional_vs_final_diverge
        grounds:
          - calculations.quantitative_star_rating
          - entities.Rating.fields.provisional_stars
          - entities.Rating.fields.stars
        distinguishing_aspect: |
          Same fund row, same methodology: the provisional variant (return leg
          = R3 alone) yields 5 stars while the final variant (6000/4000 blend
          of R3/R5) yields 4 stars — a dual-variant divergence on the Rating
          entity domain.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z (default)."
            - "Category LG_GRW active (min_weight_bp 5000, EQUITY/TECH)."
            - "FundCompany FC1 ACTIVE. Fund F1 (ticker DIVGX) ACTIVE under FC1 with trailing_return_3y_bp=9000, trailing_return_5y_bp=2000, risk_score_bp=2000."
            - "Holdings snapshot ingested for F1 so the fund is rateable."
            - "Methodology QV1: QUANTITATIVE, version 1, EFFECTIVE, weight_return_bp=6000, weight_risk_bp=4000, rating_ceilings=[7000,5000,3000,1000]."
          setup_api_calls:
            - call: "POST /research/categories"
              payload: { category_code: "LG_GRW", dominant_asset_class: "EQUITY", dominant_sector: "TECH", min_weight_bp: 5000 }
              as: ResearchOps
              captures: { cat_id: $.data.id }
            - call: "POST /research/fund-companies"
              payload: { legal_name: "Divergence Capital", commercial_relationship: "NONE" }
              as: ResearchOps
              captures: { fc_id: $.data.id }
            - call: "POST /research/funds"
              payload: { fund_company_id: "${fc_id}", ticker: "DIVGX", inception_date: "2019-01-01", trailing_return_3y_bp: 9000, trailing_return_5y_bp: 2000, risk_score_bp: 2000 }
              as: ResearchOps
              captures: { fund_id: $.data.id }
            - call: "POST /research/funds/${fund_id}/holdings"
              payload: { as_of_date: "2026-08-31", holdings: [ { security_ticker: "AAA", asset_class: "EQUITY", sector: "TECH", weight_bp: 7000 }, { security_ticker: "BBB", asset_class: "EQUITY", sector: "TECH", weight_bp: 3000 } ] }
              as: ResearchOps
            - call: "POST /research/methodologies"
              payload: { methodology_code: "QV1", methodology_kind: "QUANTITATIVE", version_number: 1, effective_from: "2026-01-01", weight_return_bp: 6000, weight_risk_bp: 4000, rating_ceilings: [7000, 5000, 3000, 1000] }
              as: ResearchOps
              captures: { meth_id: $.data.id }
            - call: "POST /research/methodologies/${meth_id}/activate"
              payload: {}
              as: ResearchOps
          trigger:
            - call: "POST /research/ratings/compute"
              payload: { fund_id: "${fund_id}", methodology_id: "${meth_id}" }
              as: ResearchOps
              captures: { rating_id: $.data.id }
          assert:
            - "Rating.${rating_id}.stars == 4 (final variant: return_leg=(9000*6000+2000*4000)/10000=6200; score=(6200*6000+8000*4000)/10000=6920 < 7000)"
            - "Rating.${rating_id}.provisional_stars == 5 (provisional variant: return_leg=9000; score=(9000*6000+8000*4000)/10000=8600 >= 7000)"
            - "Rating.${rating_id}.stars != Rating.${rating_id}.provisional_stars"
            - "Rating.${rating_id}.rating_status == PROVISIONAL"

      - name: audit_penalty_standard_vs_repeat_offender
        grounds:
          - calculations.audit_penalty
          - entities.LicenseAudit.fields.penalty_cents
        distinguishing_aspect: |
          Same audit inputs (tier REDISTRIBUTION, 3 unlicensed uses): the
          standard variant yields 450000 cents while the repeat-offender
          variant yields 675000 cents — a dual-variant divergence on the
          LicenseAudit/Licensee entity domain, distinct from the Rating domain
          of the first instance.
        test_recipe:
          setup:
            - "Licensee L1 (first offense) with agreement AG1 REDISTRIBUTION ACTIVE; audit A1 filed with 3 unlicensed uses and closed PENALTY (standard variant)."
            - "Licensee L2 (repeat offender) with agreement AG2 REDISTRIBUTION ACTIVE; audit B1 filed with 1 use and closed PENALTY (standard variant, establishing a prior CLOSED_WITH_PENALTY); audit B2 on the same agreement AG2 filed with 3 uses (audits may be opened on an agreement regardless of licensee status, so L2 need not be reinstated between B1 and B2)."
          setup_api_calls:
            - call: "POST /research/licensees"
              payload: { licensee_name: "First Offense LLC" }
              as: LicenseAdmin
              captures: { l1_id: $.data.id }
            - call: "POST /research/licensees"
              payload: { licensee_name: "Repeat Offense LLC" }
              as: LicenseAdmin
              captures: { l2_id: $.data.id }
            - call: "POST /research/license-agreements"
              payload: { licensee_id: "${l1_id}", tier: "REDISTRIBUTION", seat_limit: 10, effective_from: "2026-01-01", base_fee_cents: 1000000 }
              as: LicenseAdmin
              captures: { ag1_id: $.data.id }
            - call: "POST /research/license-agreements"
              payload: { licensee_id: "${l2_id}", tier: "REDISTRIBUTION", seat_limit: 10, effective_from: "2026-01-01", base_fee_cents: 1000000 }
              as: LicenseAdmin
              captures: { ag2_id: $.data.id }
            - call: "POST /research/license-agreements/${ag1_id}/activate"
              payload: {}
              as: LicenseAdmin
            - call: "POST /research/license-agreements/${ag2_id}/activate"
              payload: {}
              as: LicenseAdmin
            - call: "POST /research/license-audits"
              payload: { agreement_id: "${ag1_id}" }
              as: LicenseAdmin
              captures: { a1_id: $.data.id }
            - call: "POST /research/license-audits/${a1_id}/file-findings"
              payload: { unlicensed_uses_found: 3 }
              as: LicenseAdmin
            - call: "POST /research/license-audits/${a1_id}/close"
              payload: { outcome: "PENALTY" }
              as: LicenseAdmin
              captures: { a1_closed: $.data.penalty_cents }
            - call: "POST /research/license-audits"
              payload: { agreement_id: "${ag2_id}" }
              as: LicenseAdmin
              captures: { b1_id: $.data.id }
            - call: "POST /research/license-audits/${b1_id}/file-findings"
              payload: { unlicensed_uses_found: 1 }
              as: LicenseAdmin
            - call: "POST /research/license-audits/${b1_id}/close"
              payload: { outcome: "PENALTY" }
              as: LicenseAdmin
            - call: "POST /research/license-audits"
              payload: { agreement_id: "${ag2_id}" }
              as: LicenseAdmin
              captures: { b2_id: $.data.id }
            - call: "POST /research/license-audits/${b2_id}/file-findings"
              payload: { unlicensed_uses_found: 3 }
              as: LicenseAdmin
          trigger:
            - call: "POST /research/license-audits/${b2_id}/close"
              payload: { outcome: "PENALTY" }
              as: LicenseAdmin
          assert:
            - "LicenseAudit.${a1_id}.penalty_cents == 450000 (standard: 150000*3, no prior penalty)"
            - "LicenseAudit.${b1_id}.penalty_cents == 150000 (standard: 150000*1 = 150000 >= 100000 floor)"
            - "LicenseAudit.${b2_id}.penalty_cents == 675000 (repeat-offender: 150000*3=450000 + 450000*5000/10000=225000)"
            - "LicenseAudit.${b2_id}.penalty_cents > LicenseAudit.${a1_id}.penalty_cents (identical use counts, different variants)"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: license_fee_tiered_discount_and_surcharge_interaction
        grounds:
          - calculations.license_fee_quote
          - validations[priority=11]
        distinguishing_aspect: |
          Mode (a): a formula with >=3 inputs and non-linear interaction —
          tier-dependent seat fee x seat-limit-dependent volume discount band x
          conditional derived-works surcharge, with the pinned 4-step evaluation
          order (discount before surcharge). DERIVED_WORKS with 11 seats at
          base 2000000 yields exactly 8687500 cents: seat raw 500000*11=5500000;
          discount 1000bp -> 5500000-550000=4950000; pre-surcharge 6950000;
          surcharge 2500bp -> 6950000+1737500=8687500.
        test_recipe:
          setup:
            - "Logical clock at the default 2026-09-01T00:00:00Z; fee-quote is a pure function endpoint needing no fixtures."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ResearchOps
          trigger:
            - call: "POST /research/license-agreements/fee-quote"
              payload: { tier: "DERIVED_WORKS", seat_limit: 11, base_fee_cents: 2000000 }
              as: LicenseAdmin
              captures: { fee: $.data.total_fee_cents }
            - call: "POST /research/license-agreements/fee-quote"
              payload: { tier: "DISPLAY", seat_limit: 11, base_fee_cents: 2000000 }
              as: LicenseAdmin
              captures: { fee_display: $.data.total_fee_cents }
          assert:
            - "fee == 8687500 (DERIVED_WORKS: 500000*11=5500000, -10% = 4950000, +2000000 = 6950000, +25% = 8687500)"
            - "fee_display == 3188000 (DISPLAY: 120000*11=1320000, -10% = 1188000, +2000000 = 3188000, no surcharge)"
            - "the volume band boundary is seat_limit >= 11 (10 seats would use 0 discount)"

      - name: quantitative_rating_floor_division_order_matters
        grounds:
          - calculations.quantitative_star_rating
        distinguishing_aspect: |
          Mode (b): nested integer floor division where the rounding order is
          pinned — (R3*6000 + R5*4000)/10000 floored BEFORE the weighted score,
          then the score floored again. With R3=9001, R5=2001, K=2000,
          WR=6000, WK=4000: return_leg = floor(62006000/10000)=6200 (NOT
          6201), score = floor((6200*6000 + 8000*4000)/10000) = 6920; a
          sum-then-round interpretation that keeps fractions yields
          6920.24 -> different stars boundary behavior at ceilings. This is a
          different mode from the tiered-pricing instance.
        test_recipe:
          setup:
            - "FundCompany ACTIVE; Fund FRACT with R3=9001, R5=2001, K=2000; holdings ingested; Methodology QV2 EFFECTIVE with WR=6000, WK=4000, ceilings [7000,5000,3000,1000]."
          setup_api_calls:
            - call: "POST /research/fund-companies"
              payload: { legal_name: "Fraction Funds", commercial_relationship: "NONE" }
              as: ResearchOps
              captures: { fc2_id: $.data.id }
            - call: "POST /research/funds"
              payload: { fund_company_id: "${fc2_id}", ticker: "FRACT", inception_date: "2018-06-01", trailing_return_3y_bp: 9001, trailing_return_5y_bp: 2001, risk_score_bp: 2000 }
              as: ResearchOps
              captures: { fund2_id: $.data.id }
            - call: "POST /research/categories"
              payload: { category_code: "FR_C", dominant_asset_class: "EQUITY", dominant_sector: "MIXED", min_weight_bp: 5000 }
              as: ResearchOps
            - call: "POST /research/funds/${fund2_id}/holdings"
              payload: { as_of_date: "2026-08-31", holdings: [ { security_ticker: "XXX", asset_class: "EQUITY", sector: "FINANCE", weight_bp: 10000 } ] }
              as: ResearchOps
            - call: "POST /research/methodologies"
              payload: { methodology_code: "QV2", methodology_kind: "QUANTITATIVE", version_number: 1, effective_from: "2026-01-01", weight_return_bp: 6000, weight_risk_bp: 4000, rating_ceilings: [7000, 5000, 3000, 1000] }
              as: ResearchOps
              captures: { meth2_id: $.data.id }
            - call: "POST /research/methodologies/${meth2_id}/activate"
              payload: {}
              as: ResearchOps
          trigger:
            - call: "POST /research/ratings/compute"
              payload: { fund_id: "${fund2_id}", methodology_id: "${meth2_id}" }
              as: ResearchOps
              captures: { rating2_id: $.data.id }
          assert:
            - "Rating.${rating2_id}.stars == 4 (return_leg floored to 6200 before scoring; score 6920 < 7000)"
            - "Rating.${rating2_id}.provisional_stars == 5 (provisional leg = 9001 -> score floor((9001*6000+8000*4000)/10000) = 8600 >= 7000)"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: rating_committee_review_cycles_back_to_provisional_on_rejection
        grounds:
          - state_machines.Rating.PROVISIONAL_to_COMMITTEE_REVIEW
          - state_machines.Rating.COMMITTEE_REVIEW_to_PROVISIONAL
          - state_machines.RatingProposal.transitions
        distinguishing_aspect: |
          Rating has a revision-loop cycle PROVISIONAL -> COMMITTEE_REVIEW ->
          PROVISIONAL (proposal rejected) -> COMMITTEE_REVIEW -> PUBLISHED; a
          cyclic, non-linear shape on the Rating entity.
        test_recipe:
          setup:
            - "FundCompany ACTIVE (commercial_relationship NONE); Fund CYCF ACTIVE; Methodology AM1 ANALYST EFFECTIVE; analyst rating created (PROVISIONAL)."
          setup_api_calls:
            - call: "POST /research/fund-companies"
              payload: { legal_name: "Cycle Asset Mgmt", commercial_relationship: "NONE" }
              as: ResearchOps
              captures: { fc3_id: $.data.id }
            - call: "POST /research/funds"
              payload: { fund_company_id: "${fc3_id}", ticker: "CYCF", inception_date: "2020-01-01", trailing_return_3y_bp: 5000, trailing_return_5y_bp: 5000, risk_score_bp: 3000 }
              as: ResearchOps
              captures: { fund3_id: $.data.id }
            - call: "POST /research/methodologies"
              payload: { methodology_code: "AM1", methodology_kind: "ANALYST", version_number: 1, effective_from: "2026-01-01", weight_return_bp: 5000, weight_risk_bp: 5000, rating_ceilings: [8000, 6000, 4000, 2000] }
              as: ResearchOps
              captures: { meth3_id: $.data.id }
            - call: "POST /research/methodologies/${meth3_id}/activate"
              payload: {}
              as: ResearchOps
            - call: "POST /research/ratings"
              payload: { fund_id: "${fund3_id}", methodology_id: "${meth3_id}" }
              as: Analyst
              as_user_id: "analyst-lead"
              captures: { rating3_id: $.data.id }
            - call: "POST /research/ratings/${rating3_id}/proposals"
              payload: { proposed_grade: "GOLD" }
              as: Analyst
              as_user_id: "analyst-lead"
              captures: { prop1_id: $.data.id }
            - call: "POST /research/proposals/${prop1_id}/votes"
              payload: { vote: "REJECT" }
              as: Analyst
              as_user_id: "voter-a"
            - call: "POST /research/proposals/${prop1_id}/votes"
              payload: { vote: "REJECT" }
              as: Analyst
              as_user_id: "voter-b"
            - call: "POST /research/proposals/${prop1_id}/votes"
              payload: { vote: "APPROVE" }
              as: Analyst
              as_user_id: "voter-c"
          trigger:
            - call: "POST /research/ratings/${rating3_id}/proposals"
              payload: { proposed_grade: "SILVER" }
              as: Analyst
              as_user_id: "analyst-lead"
              captures: { prop2_id: $.data.id }
          assert:
            - "RatingProposal.${prop1_id}.proposal_status == REJECTED (rejections 2 >= approvals 1 after 3 votes)"
            - "the first cycle returned Rating.${rating3_id} to PROVISIONAL, which is why the second proposal POST succeeds"
            - "Rating.${rating3_id}.rating_status == COMMITTEE_REVIEW after the trigger (second loop iteration)"
            - "RatingProposal.${prop2_id}.proposal_status == OPEN"

      - name: methodology_change_branching_withdraw_vs_effectuate
        grounds:
          - state_machines.MethodologyChange.transitions
          - state_machines.Methodology.EFFECTIVE_to_SUPERSEDED
        distinguishing_aspect: |
          MethodologyChange branches PROPOSED -> APPROVED -> {EFFECTIVE,
          WITHDRAWN} with divergent side-effect sets per branch (EFFECTIVE
          fires the restatement cascade, WITHDRAWN fires none) — a branching
          fork-join shape on a different entity (MethodologyChange) than the
          Rating cycle.
        test_recipe:
          setup:
            - "Methodology QV3 QUANTITATIVE EFFECTIVE; two changes proposed: CHG1 (restatement_required=false) and CHG2 (restatement_required=false); both approved."
          setup_api_calls:
            - call: "POST /research/methodologies"
              payload: { methodology_code: "QV3", methodology_kind: "QUANTITATIVE", version_number: 1, effective_from: "2026-01-01", weight_return_bp: 6000, weight_risk_bp: 4000, rating_ceilings: [7000, 5000, 3000, 1000] }
              as: ResearchOps
              captures: { meth4_id: $.data.id, meth4_v: $.data.version }
            - call: "POST /research/methodologies/${meth4_id}/activate"
              payload: {}
              as: ResearchOps
            - call: "GET /research/methodologies/${meth4_id}"
              payload: {}
              as: ResearchOps
              captures: { meth4_v2: $.data.version }
            - call: "POST /research/methodologies/${meth4_id}/changes"
              payload: { restatement_required: false, effective_date: "2026-09-01", expected_methodology_version: "${meth4_v2}" }
              as: ResearchOps
              captures: { chg1_id: $.data.id }
            - call: "GET /research/methodologies/${meth4_id}"
              payload: {}
              as: ResearchOps
              captures: { meth4_v3: $.data.version }
            - call: "POST /research/methodologies/${meth4_id}/changes"
              payload: { restatement_required: false, effective_date: "2026-09-01", expected_methodology_version: "${meth4_v3}" }
              as: ResearchOps
              captures: { chg2_id: $.data.id }
            - call: "POST /research/methodology-changes/${chg1_id}/approve"
              payload: {}
              as: ResearchOps
            - call: "POST /research/methodology-changes/${chg2_id}/approve"
              payload: {}
              as: ResearchOps
            - call: "POST /research/methodology-changes/${chg1_id}/withdraw"
              payload: {}
              as: ResearchOps
            - call: "POST /research/licensees"
              payload: { licensee_name: "Notice Recipient" }
              as: LicenseAdmin
              captures: { lic_n_id: $.data.id }
            - call: "POST /research/methodology-changes/${chg2_id}/notices"
              payload: { licensee_id: "${lic_n_id}", notice_channel: "PORTAL" }
              as: ResearchOps
          trigger:
            - call: "POST /research/methodology-changes/${chg2_id}/effectuate"
              payload: {}
              as: ResearchOps
          assert:
            - "MethodologyChange.${chg1_id}.change_status == WITHDRAWN (APPROVED branch forked to WITHDRAWN, no restatement side effects)"
            - "MethodologyChange.${chg2_id}.change_status == EFFECTIVE"
            - "MethodologyChange.${chg2_id}.restated_rating_count == 0 (restatement_required=false, so the EFFECTIVE branch fires no restatement cascade)"
            - "the two APPROVED siblings diverged into different terminal states with different side-effect sets"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: audit_penalty_cascades_to_licensee_suspension_and_seat_revocation
        grounds:
          - state_machines.LicenseAudit.FINDINGS_FILED_to_CLOSED_WITH_PENALTY
          - state_machines.Licensee.ACTIVE_to_SUSPENDED
          - state_machines.SeatEntitlement.ACTIVE_to_REVOKED
          - calculations.audit_penalty
        distinguishing_aspect: |
          Depth-3 chain: LicenseAudit close(PENALTY) mutates Licensee
          (arrears_cents += penalty -> status SUSPENDED); the Licensee
          suspension itself mutates every SeatEntitlement (ACTIVE -> REVOKED);
          each seat revocation itself mutates LicenseAgreement.seats_in_use
          back to 0. Each link is caused by the previous link, not by the
          original close call.
        test_recipe:
          setup:
            - "Licensee LC ACTIVE; agreement AGC (DERIVED_WORKS, seat_limit 2, ACTIVE); two seats granted (seats_in_use == 2); audit AUC opened and findings filed with 2 unlicensed uses."
          setup_api_calls:
            - call: "POST /research/licensees"
              payload: { licensee_name: "Cascade Client" }
              as: LicenseAdmin
              captures: { lc_id: $.data.id }
            - call: "POST /research/license-agreements"
              payload: { licensee_id: "${lc_id}", tier: "DERIVED_WORKS", seat_limit: 2, effective_from: "2026-01-01", base_fee_cents: 3000000 }
              as: LicenseAdmin
              captures: { agc_id: $.data.id }
            - call: "POST /research/license-agreements/${agc_id}/activate"
              payload: {}
              as: LicenseAdmin
            - call: "GET /research/license-agreements/${agc_id}"
              payload: {}
              as: LicenseAdmin
              captures: { agc_v: $.data.version }
            - call: "POST /research/license-agreements/${agc_id}/seats"
              payload: { workstation_user_id: "ws-1", expected_agreement_version: "${agc_v}" }
              as: LicenseAdmin
            - call: "GET /research/license-agreements/${agc_id}"
              payload: {}
              as: LicenseAdmin
              captures: { agc_v2: $.data.version }
            - call: "POST /research/license-agreements/${agc_id}/seats"
              payload: { workstation_user_id: "ws-2", expected_agreement_version: "${agc_v2}" }
              as: LicenseAdmin
            - call: "POST /research/license-audits"
              payload: { agreement_id: "${agc_id}" }
              as: LicenseAdmin
              captures: { auc_id: $.data.id }
            - call: "POST /research/license-audits/${auc_id}/file-findings"
              payload: { unlicensed_uses_found: 2 }
              as: LicenseAdmin
          trigger:
            - call: "POST /research/license-audits/${auc_id}/close"
              payload: { outcome: "PENALTY" }
              as: LicenseAdmin
          assert:
            - "LicenseAudit.${auc_id}.penalty_cents == 800000 (400000 * 2 uses, DERIVED_WORKS, first offense)"
            - "Licensee.${lc_id}.licensee_status == SUSPENDED and arrears_cents == 800000 (link 1: audit close -> licensee mutation)"
            - "LicenseAgreement.${agc_id}.seats_in_use == 0 (link 3: each seat revocation decremented the agreement counter)"
            - "GET /research/license-agreements/${agc_id}/seats shows both SeatEntitlement rows in REVOKED (link 2: licensee suspension -> seat revocations)"

      - name: fund_company_suspension_cascades_to_funds_and_rating_suppression
        grounds:
          - state_machines.FundCompany.ACTIVE_to_SUSPENDED
          - state_machines.Fund.ACTIVE_to_SUSPENDED
          - entities.Rating.fields.suppression_reason
        distinguishing_aspect: |
          Depth-2 chain from a DIFFERENT trigger (FundCompany suspend, not
          audit close): company suspension mutates each Fund (ACTIVE ->
          SUSPENDED); each fund suspension itself mutates the fund's
          non-terminal Rating rows (suppression_reason -> DISPUTE_HOLD).
        test_recipe:
          setup:
            - "FundCompany FCC ACTIVE; Fund FCS ACTIVE with a quantitative rating computed (PROVISIONAL); Methodology QV4 EFFECTIVE; holdings ingested."
          setup_api_calls:
            - call: "POST /research/categories"
              payload: { category_code: "CS_C", dominant_asset_class: "EQUITY", dominant_sector: "MIXED", min_weight_bp: 5000 }
              as: ResearchOps
            - call: "POST /research/fund-companies"
              payload: { legal_name: "Cascade Sponsor", commercial_relationship: "NONE" }
              as: ResearchOps
              captures: { fcc_id: $.data.id }
            - call: "POST /research/funds"
              payload: { fund_company_id: "${fcc_id}", ticker: "FCSC", inception_date: "2020-01-01", trailing_return_3y_bp: 8000, trailing_return_5y_bp: 8000, risk_score_bp: 2000 }
              as: ResearchOps
              captures: { fcs_id: $.data.id }
            - call: "POST /research/funds/${fcs_id}/holdings"
              payload: { as_of_date: "2026-08-31", holdings: [ { security_ticker: "ZZZ", asset_class: "EQUITY", sector: "TECH", weight_bp: 10000 } ] }
              as: ResearchOps
            - call: "POST /research/methodologies"
              payload: { methodology_code: "QV4", methodology_kind: "QUANTITATIVE", version_number: 1, effective_from: "2026-01-01", weight_return_bp: 6000, weight_risk_bp: 4000, rating_ceilings: [7000, 5000, 3000, 1000] }
              as: ResearchOps
              captures: { meth5_id: $.data.id }
            - call: "POST /research/methodologies/${meth5_id}/activate"
              payload: {}
              as: ResearchOps
            - call: "POST /research/ratings/compute"
              payload: { fund_id: "${fcs_id}", methodology_id: "${meth5_id}" }
              as: ResearchOps
              captures: { rating5_id: $.data.id }
          trigger:
            - call: "POST /research/fund-companies/${fcc_id}/suspend"
              payload: {}
              as: ResearchOps
          assert:
            - "FundCompany.${fcc_id}.company_status == SUSPENDED"
            - "Fund.${fcs_id}.fund_status == SUSPENDED (link 1: company -> fund)"
            - "Rating.${rating5_id}.suppression_reason == DISPUTE_HOLD (link 2: fund suspension -> rating suppression)"
            - "Rating.${rating5_id}.rating_status == PROVISIONAL (suppression does not itself transition the rating)"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: conflict_of_interest_beats_seat_style_fiscal_checks_and_state_loses_to_conflict
        grounds:
          - validations[priority=5]
          - validations[priority=6]
          - errors[ERR_CONFLICT_OF_INTEREST]
          - errors[ERR_INVALID_STATE_TRANSITION]
        distinguishing_aspect: |
          Error-category pair state vs business_safety: publishing a
          PROVISIONAL rating on a fund with an OPEN COMMERCIAL_RATING_CONFLICT
          flag fails the business_safety gate with ERR_CONFLICT_OF_INTEREST,
          while publishing a WITHDRAWN rating on the same conflicted fund
          fails the earlier state check with ERR_INVALID_STATE_TRANSITION —
          proving priority 5 (state) is evaluated before priority 6
          (business_safety).
        test_recipe:
          setup:
            - "FundCompany FCO with commercial_relationship LICENSED_CLIENT; Fund FCO1 ACTIVE; Methodology QV5 EFFECTIVE; holdings ingested; quantitative rating computed -> a COMMERCIAL_RATING_CONFLICT flag is OPEN; a second rating computed and withdrawn (terminal)."
          setup_api_calls:
            - call: "POST /research/categories"
              payload: { category_code: "CO_C", dominant_asset_class: "EQUITY", dominant_sector: "MIXED", min_weight_bp: 5000 }
              as: ResearchOps
            - call: "POST /research/fund-companies"
              payload: { legal_name: "Conflicted Sponsor", commercial_relationship: "LICENSED_CLIENT" }
              as: ResearchOps
              captures: { fco_id: $.data.id }
            - call: "POST /research/funds"
              payload: { fund_company_id: "${fco_id}", ticker: "FCO1", inception_date: "2020-01-01", trailing_return_3y_bp: 8000, trailing_return_5y_bp: 8000, risk_score_bp: 2000 }
              as: ResearchOps
              captures: { fco1_id: $.data.id }
            - call: "POST /research/funds/${fco1_id}/holdings"
              payload: { as_of_date: "2026-08-31", holdings: [ { security_ticker: "QRS", asset_class: "EQUITY", sector: "TECH", weight_bp: 10000 } ] }
              as: ResearchOps
            - call: "POST /research/methodologies"
              payload: { methodology_code: "QV5", methodology_kind: "QUANTITATIVE", version_number: 1, effective_from: "2026-01-01", weight_return_bp: 6000, weight_risk_bp: 4000, rating_ceilings: [7000, 5000, 3000, 1000] }
              as: ResearchOps
              captures: { meth6_id: $.data.id }
            - call: "POST /research/methodologies/${meth6_id}/activate"
              payload: {}
              as: ResearchOps
            - call: "POST /research/ratings/compute"
              payload: { fund_id: "${fco1_id}", methodology_id: "${meth6_id}" }
              as: ResearchOps
              captures: { rating6_id: $.data.id }
            - call: "POST /research/ratings/compute"
              payload: { fund_id: "${fco1_id}", methodology_id: "${meth6_id}" }
              as: ResearchOps
              captures: { rating6b_id: $.data.id }
            - call: "POST /research/ratings/${rating6b_id}/withdraw"
              payload: {}
              as: ResearchOps
          trigger:
            - call: "POST /research/ratings/${rating6_id}/publish"
              payload: {}
              as: ResearchOps
              captures: { e_conflict: $.data.error_id }
            - call: "POST /research/ratings/${rating6b_id}/publish"
              payload: {}
              as: ResearchOps
              captures: { e_state: $.data.error_id }
          assert:
            - "first trigger (PROVISIONAL rating, OPEN conflict flag) fails with error_id ERR_CONFLICT_OF_INTEREST and http 422"
            - "second trigger (WITHDRAWN rating, same OPEN conflict flag) fails with error_id ERR_INVALID_STATE_TRANSITION and http 409 — state (priority 5) is evaluated before the conflict gate (priority 6)"
            - "Rating.${rating6_id}.rating_status == PROVISIONAL (unchanged)"
            - "e_conflict == ERR_CONFLICT_OF_INTEREST and e_state == ERR_INVALID_STATE_TRANSITION"

      - name: sod_violation_beats_temporal_and_existence_beats_sod
        grounds:
          - validations[priority=3]
          - validations[priority=7]
          - errors[ERR_SOD_VIOLATION]
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: |
          A different error-category pair — existence vs business_safety
          (SoD): a vote by the proposer on a non-existent proposal id returns
          ERR_NOT_FOUND (priority 3), while the same vote on an existing
          proposal returns ERR_SOD_VIOLATION (priority 7) — and SoD itself
          must beat the duplicate-vote check's generic handling because both
          share priority 7 with a deterministic sub-order (proposer-check
          first).
        test_recipe:
          setup:
            - "Analyst rating with proposal opened by analyst-lead (PROVISIONAL -> COMMITTEE_REVIEW; proposal OPEN)."
          setup_api_calls:
            - call: "POST /research/fund-companies"
              payload: { legal_name: "SoD Sponsor", commercial_relationship: "NONE" }
              as: ResearchOps
              captures: { fcsd_id: $.data.id }
            - call: "POST /research/funds"
              payload: { fund_company_id: "${fcsd_id}", ticker: "SODF", inception_date: "2020-01-01", trailing_return_3y_bp: 5000, trailing_return_5y_bp: 5000, risk_score_bp: 3000 }
              as: ResearchOps
              captures: { fundsd_id: $.data.id }
            - call: "POST /research/methodologies"
              payload: { methodology_code: "AM2", methodology_kind: "ANALYST", version_number: 1, effective_from: "2026-01-01", weight_return_bp: 5000, weight_risk_bp: 5000, rating_ceilings: [8000, 6000, 4000, 2000] }
              as: ResearchOps
              captures: { meth7_id: $.data.id }
            - call: "POST /research/methodologies/${meth7_id}/activate"
              payload: {}
              as: ResearchOps
            - call: "POST /research/ratings"
              payload: { fund_id: "${fundsd_id}", methodology_id: "${meth7_id}" }
              as: Analyst
              as_user_id: "analyst-lead"
              captures: { rating7_id: $.data.id }
            - call: "POST /research/ratings/${rating7_id}/proposals"
              payload: { proposed_grade: "BRONZE" }
              as: Analyst
              as_user_id: "analyst-lead"
              captures: { prop7_id: $.data.id }
          trigger:
            - call: "POST /research/proposals/00000000-0000-0000-0000-000000000000/votes"
              payload: { vote: "APPROVE" }
              as: Analyst
              as_user_id: "analyst-lead"
              captures: { e_nf: $.data.error_id }
            - call: "POST /research/proposals/${prop7_id}/votes"
              payload: { vote: "APPROVE" }
              as: Analyst
              as_user_id: "analyst-lead"
              captures: { e_sod: $.data.error_id }
          assert:
            - "first trigger fails with error_id ERR_NOT_FOUND (existence, priority 3, beats SoD even though the voter is the proposer)"
            - "second trigger fails with error_id ERR_SOD_VIOLATION and http 422 (proposer may not vote on own proposal)"
            - "e_nf == ERR_NOT_FOUND and e_sod == ERR_SOD_VIOLATION"
            - "RatingProposal.${prop7_id}.approvals == 0 and rejections == 0 (no vote recorded)"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: seat_quota_boundary_exactly_at_limit
        grounds:
          - validations[priority=11]
          - entities.LicenseAgreement.fields.seat_limit
          - entities.LicenseAgreement.fields.seats_in_use
        distinguishing_aspect: |
          Numeric threshold boundary on the seats_in_use < seat_limit metric:
          granting the seat that takes seats_in_use from limit-1 to exactly
          limit succeeds (strict <), and the next grant fails with
          ERR_SEAT_LIMIT_REACHED — tested through the seats endpoint.
        test_recipe:
          setup:
            - "Licensee LB ACTIVE; agreement AGB (DISPLAY, seat_limit 2, ACTIVE)."
          setup_api_calls:
            - call: "POST /research/licensees"
              payload: { licensee_name: "Boundary Buyer" }
              as: LicenseAdmin
              captures: { lb_id: $.data.id }
            - call: "POST /research/license-agreements"
              payload: { licensee_id: "${lb_id}", tier: "DISPLAY", seat_limit: 2, effective_from: "2026-01-01", base_fee_cents: 500000 }
              as: LicenseAdmin
              captures: { agb_id: $.data.id }
            - call: "POST /research/license-agreements/${agb_id}/activate"
              payload: {}
              as: LicenseAdmin
            - call: "GET /research/license-agreements/${agb_id}"
              payload: {}
              as: LicenseAdmin
              captures: { agb_v: $.data.version }
          trigger:
            - call: "POST /research/license-agreements/${agb_id}/seats"
              payload: { workstation_user_id: "bw-1", expected_agreement_version: "${agb_v}" }
              as: LicenseAdmin
            - call: "GET /research/license-agreements/${agb_id}"
              payload: {}
              as: LicenseAdmin
              captures: { agb_v2: $.data.version }
            - call: "POST /research/license-agreements/${agb_id}/seats"
              payload: { workstation_user_id: "bw-2", expected_agreement_version: "${agb_v2}" }
              as: LicenseAdmin
              captures: { seat2_id: $.data.id }
            - call: "GET /research/license-agreements/${agb_id}"
              payload: {}
              as: LicenseAdmin
              captures: { agb_v3: $.data.version }
            - call: "POST /research/license-agreements/${agb_id}/seats"
              payload: { workstation_user_id: "bw-3", expected_agreement_version: "${agb_v3}" }
              as: LicenseAdmin
              captures: { e_quota: $.data.error_id }
          assert:
            - "first two grants succeed (201): seats_in_use reaches exactly seat_limit == 2"
            - "third grant fails with error_id ERR_SEAT_LIMIT_REACHED and http 422 (boundary is strict <: seats_in_use == seat_limit blocks)"
            - "e_quota == ERR_SEAT_LIMIT_REACHED"
            - "LicenseAgreement.${agb_id}.seats_in_use == 2"

      - name: holdings_snapshot_weight_sum_boundary_and_empty_eligible_set
        grounds:
          - validations[priority=10]
          - calculations.category_assignment
          - errors[ERR_SNAPSHOT_INVALID]
          - errors[ERR_NO_ELIGIBLE_CATEGORY]
        distinguishing_aspect: |
          A different metric (weights-sum equality vs an empty-set eligibility
          boundary) reached through a different endpoint
          (POST /funds/{id}/holdings and /assign-category): a snapshot summing
          to 9999 bp is rejected (must equal exactly 10000), and a snapshot of
          exactly 10000 bp that leaves the eligible-category set EMPTY fails
          category assignment with ERR_NO_ELIGIBLE_CATEGORY.
        test_recipe:
          setup:
            - "FundCompany ACTIVE; Fund FBND ACTIVE; one category with min_weight_bp 6000 (> the equity weight we will ingest)."
          setup_api_calls:
            - call: "POST /research/fund-companies"
              payload: { legal_name: "Boundary Sponsor", commercial_relationship: "NONE" }
              as: ResearchOps
              captures: { fcb_id: $.data.id }
            - call: "POST /research/funds"
              payload: { fund_company_id: "${fcb_id}", ticker: "FBND", inception_date: "2021-01-01", trailing_return_3y_bp: 5000, trailing_return_5y_bp: 5000, risk_score_bp: 3000 }
              as: ResearchOps
              captures: { fbnd_id: $.data.id }
            - call: "POST /research/categories"
              payload: { category_code: "STRICT6", dominant_asset_class: "EQUITY", dominant_sector: "MIXED", min_weight_bp: 6000 }
              as: ResearchOps
          trigger:
            - call: "POST /research/funds/${fbnd_id}/holdings"
              payload: { as_of_date: "2026-08-31", holdings: [ { security_ticker: "A1", asset_class: "EQUITY", sector: "TECH", weight_bp: 5999 }, { security_ticker: "A2", asset_class: "BOND", sector: "FINANCE", weight_bp: 4000 } ] }
              as: ResearchOps
              captures: { e_sum: $.data.error_id }
            - call: "POST /research/funds/${fbnd_id}/holdings"
              payload: { as_of_date: "2026-08-31", holdings: [ { security_ticker: "A1", asset_class: "EQUITY", sector: "TECH", weight_bp: 5000 }, { security_ticker: "A2", asset_class: "BOND", sector: "FINANCE", weight_bp: 5000 } ] }
              as: ResearchOps
            - call: "POST /research/funds/${fbnd_id}/assign-category"
              payload: {}
              as: ResearchOps
              captures: { e_empty: $.data.error_id }
          assert:
            - "first trigger (sum 9999) fails with error_id ERR_SNAPSHOT_INVALID and http 422 (e_sum == ERR_SNAPSHOT_INVALID)"
            - "second trigger (sum exactly 10000) is accepted (201): the equality boundary is inclusive"
            - "explicit assign-category then fails with error_id ERR_NO_ELIGIBLE_CATEGORY and http 422 (e_empty == ERR_NO_ELIGIBLE_CATEGORY): equity weight 5000 < min_weight_bp 6000 leaves the eligible set EMPTY"
            - "Fund.${fbnd_id}.category_id is null and category_assignment_revision == 0"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: rating_publish_gated_on_methodology_effective_and_fund_active
        grounds:
          - state_machines.Rating.PROVISIONAL_to_PUBLISHED
          - state_machines.Methodology.transitions
          - state_machines.Fund.transitions
        distinguishing_aspect: |
          Entity pair Rating -> Methodology: a quantitative rating computed
          while its methodology was EFFECTIVE cannot be published after the
          methodology is RETIRED; the valid transition set of Rating depends
          on Methodology.methodology_status.
        test_recipe:
          setup:
            - "FundCompany ACTIVE; Fund FDEP ACTIVE; holdings ingested; Methodology QV6 activated then used to compute a rating, then RETIRED."
