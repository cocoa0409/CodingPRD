    input: []
    output: RefrigerantProgram
    side_effects: ["state_machines.RefrigerantProgram.SELL_THROUGH_to_EXPIRED including the platform RETIRED cascade for each attached platform", "increments RefrigerantProgram.version by 1 and the version of every entity the retire cascade touches"]

