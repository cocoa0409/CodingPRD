      - name: ae_hold_misses_future_scheduled_visits_cascade
        claim_type: cascading_side_effects
        grounds: [state_machines.InfusionOrder.ACTIVE_to_ON_HOLD, state_machines.NursingVisit.SCHEDULED_to_MISSED]
        distinguishing_aspect: "When an adverse event holds an ACTIVE order, every future SCHEDULED visit is auto-MISSED in the same request (immediate consistency)."
        test_recipe:
          setup: ["vanco order ACTIVE (first visit completed) with one future SCHEDULED visit; clock at 2026-06-10T12:00Z so the future visit is genuinely future"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T12:00:00Z" }
