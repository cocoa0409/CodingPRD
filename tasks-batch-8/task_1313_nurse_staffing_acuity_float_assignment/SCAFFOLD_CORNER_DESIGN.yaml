              as: NurseAdmin
              captures: { c1: $.data.id }
            - call: "POST /nurses"
              payload: { full_name: "Core Two", employment_type: "CORE", competencies: ["ICU"], base_hourly_rate_cents: 5000, home_unit_id: "${u}" }
              as: NurseAdmin
              captures: { c2: $.data.id }
            - call: "POST /nurses"
              payload: { full_name: "Float G1", employment_type: "FLOAT_POOL", competencies: ["ICU"], base_hourly_rate_cents: 6000 }
              as: NurseAdmin
              captures: { g1: $.data.id }
            - call: "POST /nurses"
              payload: { full_name: "Float G2", employment_type: "FLOAT_POOL", competencies: ["ICU"], base_hourly_rate_cents: 6000 }
              as: NurseAdmin
              captures: { g2: $.data.id }
            - call: "POST /nurses"
              payload: { full_name: "Float G3", employment_type: "FLOAT_POOL", competencies: ["ICU"], base_hourly_rate_cents: 6000 }
              as: NurseAdmin
              captures: { g3: $.data.id }
            - call: "POST /shifts/${sh}/assignments"
              payload: { nurse_id: "${c1}", expected_shift_version: "${sh_v}" }
              as: ChargeNurse
