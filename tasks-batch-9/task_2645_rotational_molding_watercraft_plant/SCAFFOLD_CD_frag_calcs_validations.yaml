            - "WarrantyClaim.${clm1}.payout_basis == PRO_RATA_AGE with pre_fee_gross_cents == 353338: coverage_pct = round((60 - 7) / 60 * 100, 2) = round(88.333333..., 2) = 88.33, then round_half_up(400020 * 88.33 / 100 * 1.00) = round_half_up(353337.666) = 353338 — truncating the coverage to 88.33 is required, an unrounded 88.3333... would give 353351"
