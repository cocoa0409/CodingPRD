# =============================================================================
# SCAFFOLD — task_3169_leisure_route_seasonal_scheduling_travel_package_bundling
# §1.0–§1.7 seed tables. Difficulty design (§1.8) and corner design (§1.9)
# live in their own sibling files.
# =============================================================================

scenario: |
  Leisure Route Seasonal Scheduling & Travel Package Bundling (Allegiant):
  route selection from small cities to leisure destinations with low frequency
  and seasonal suspension, schedule publication far ahead with variable
  day-of-week operation to match demand peaks, aircraft utilization strategy
  accepting lower daily hours in exchange for peak-day flying, bundled packages
  combining air with hotel, rental car and attraction tickets through
  third-party suppliers, ancillary revenue from seat assignment, bags and
  priority with unbundled base fares, single-station operations where a
  cancellation strands passengers until the next scheduled flight, crew basing
  to support a dispersed network, package cancellation and supplier settlement.

domain_name: leisure-route-bundling
api_prefix: ""

# =============================================================================
# Complexity profile (§0.3)
# =============================================================================
complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: posture_driven_gating
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - scheduled_actions
  entity_topology: hierarchical
  state_machine_shape: posture_driven
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: peer_roles
  consistency_model: immediate

# =============================================================================
# §1.0 Response envelope (FIXED — emit verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (15 entities)
# =============================================================================
entities:
  - name: Station
    parent: null
    common_fields: true
    fields:
      - { name: iata_code, type: string, source: input, description: "Three-letter IATA airport code, unique across the network" }
      - { name: station_kind, type: enum, source: input, description: "ORIGIN_SMALL_CITY | LEISURE_DESTINATION" }
      - { name: timezone, type: string, source: input, description: "IANA timezone name, e.g. America/Phoenix" }
      - { name: single_station_flag, type: boolean, source: input, default: false, description: "true if this airline is the only scheduled carrier at this station — drives the stranded-passenger rule" }

  - name: Route
    parent: null
    common_fields: true
    fields:
      - { name: origin_station_id, type: string, source: input, description: "FK -> Station.id; must be ORIGIN_SMALL_CITY" }
      - { name: destination_station_id, type: string, source: input, description: "FK -> Station.id; must be LEISURE_DESTINATION" }
      - { name: route_posture, type: enum, source: system, description: "PLANNING | SEASONAL_ACTIVE | SEASONALLY_SUSPENDED | PERMANENTLY_CLOSED" }
      - { name: base_fare_cents, type: integer, source: input, description: "Unbundled base fare in cents — seat, bags and priority are NOT included" }
      - { name: weekly_frequency_cap, type: integer, source: input, description: "Maximum published departures per ISO week on this route (low frequency: 1–4)" }
      - { name: suspended_seasons_count, type: integer, source: computed, default: 0, description: "Running count of SeasonWindows closed in SUSPENDED state — feeds the posture recompute" }

  - name: SeasonWindow
    parent: Route
    common_fields: true
    fields:
      - { name: route_id, type: string, source: system, description: "FK -> Route.id" }
      - { name: season_label, type: string, source: input, description: "Human label, e.g. 'Winter 2026-27'" }
      - { name: window_start_date, type: string, source: input, description: "ISO date, inclusive" }
      - { name: window_end_date, type: string, source: input, description: "ISO date, inclusive, must be >= window_start_date" }
      - { name: window_status, type: enum, source: system, description: "OPEN | SUSPENDED | CLOSED" }
      - { name: suspension_reason, type: string, source: input, description: "Optional operator note recorded when window transitions to SUSPENDED" }

  - name: SchedulePublication
    parent: Route
    common_fields: true
    fields:
      - { name: route_id, type: string, source: system, description: "FK -> Route.id" }
      - { name: season_window_id, type: string, source: input, description: "FK -> SeasonWindow.id; must be OPEN at publish time" }
      - { name: operating_days_mask, type: array, source: input, description: "Array of ISO weekday numbers 1..7 (Mon..Sun) on which flights operate — variable day-of-week operation" }
      - { name: first_operating_date, type: string, source: input, description: "ISO date of first flight, inclusive; must be >= window_start_date and >= publish_horizon_min_days ahead of the publication clock" }
      - { name: last_operating_date, type: string, source: input, description: "ISO date of last flight, inclusive; must be <= window_end_date" }
      - { name: departure_time_local, type: string, source: input, description: "Local departure time at origin, HH:MM" }
      - { name: block_minutes, type: integer, source: input, description: "Scheduled block time in minutes" }
      - { name: publication_status, type: enum, source: system, description: "PUBLISHED | FROZEN | RETIRED" }
      - { name: published_at, type: string, source: system, description: "ISO8601 timestamp when publication occurred" }

  - name: Aircraft
    parent: null
    common_fields: true
    fields:
      - { name: tail_number, type: string, source: input, description: "Aircraft registration, unique" }
      - { name: seat_capacity, type: integer, source: input, description: "Certified passenger seat count" }
      - { name: daily_utilization_cap_minutes, type: integer, source: input, description: "Maximum block minutes this tail may fly per calendar day; lower-than-industry cap is the deliberate leisure utilization strategy" }
      - { name: peak_day_cap_minutes, type: integer, source: input, description: "Elevated cap applicable on days whose ISO weekday is in the route's peak-day set; must be >= daily_utilization_cap_minutes" }
      - { name: aircraft_status, type: enum, source: system, description: "IN_SERVICE | OUT_OF_SERVICE" }

  - name: FlightInstance
    parent: SchedulePublication
    common_fields: true
    fields:
      - { name: publication_id, type: string, source: system, description: "FK -> SchedulePublication.id" }
      - { name: route_id, type: string, source: system, description: "FK -> Route.id; denormalized from publication for query speed" }
      - { name: flight_date, type: string, source: system, description: "ISO date; generated at publish for every operating day in [first_operating_date, last_operating_date] whose weekday is in operating_days_mask" }
      - { name: aircraft_id, type: string, source: input, description: "FK -> Aircraft.id; null until tail assignment" }
      - { name: is_peak_day, type: boolean, source: computed, description: "true when the flight's ISO weekday is contained in the route's peak-day set recorded at publish time" }
      - { name: seats_sold, type: integer, source: computed, default: 0, description: "Count of Bookings in CONFIRMED or STRANDED_REBOOKED state against this flight" }
      - { name: flight_status, type: enum, source: system, description: "SCHEDULED | CANCELLED | OPERATED" }
      - { name: cancelled_by_disruption_id, type: string, source: system, description: "FK -> DisruptionEvent.id; null unless cancelled" }

  - name: CrewBase
    parent: null
    common_fields: true
    fields:
      - { name: base_station_id, type: string, source: input, description: "FK -> Station.id where this crew base is located" }
      - { name: base_code, type: string, source: input, description: "Short code, e.g. 'PIE'" }
      - { name: base_status, type: enum, source: system, description: "ACTIVE | CLOSED" }

  - name: CrewMember
    parent: CrewBase
    common_fields: true
    fields:
      - { name: crew_base_id, type: string, source: input, description: "FK -> CrewBase.id" }
      - { name: employee_number, type: string, source: input, description: "Unique employee number" }
      - { name: crew_role, type: enum, source: input, description: "CAPTAIN | FIRST_OFFICER | FLIGHT_ATTENDANT" }
      - { name: member_status, type: enum, source: system, description: "ACTIVE | FURLOUGHED" }

  - name: CrewAssignment
    parent: FlightInstance
    common_fields: true
    fields:
      - { name: flight_instance_id, type: string, source: system, description: "FK -> FlightInstance.id" }
      - { name: crew_member_id, type: string, source: input, description: "FK -> CrewMember.id; the crew member's CrewBase.base_station_id must equal the route's origin_station_id (crew basing to support a dispersed network)" }
      - { name: assignment_status, type: enum, source: system, description: "ASSIGNED | RELEASED" }

  - name: SupplierOffer
    parent: null
    common_fields: true
    fields:
      - { name: supplier_code, type: string, source: input, description: "Third-party supplier code (hotel chain, rental car brand, attraction operator)" }
      - { name: component_kind, type: enum, source: input, description: "HOTEL | RENTAL_CAR | ATTRACTION_TICKET" }
      - { name: destination_station_id, type: string, source: input, description: "FK -> Station.id; the leisure destination this offer serves" }
      - { name: net_cost_cents, type: integer, source: input, description: "What the airline owes the supplier per consumed unit" }
      - { name: sell_price_cents, type: integer, source: input, description: "What the customer pays for this component inside a bundle" }
      - { name: offer_status, type: enum, source: system, description: "OPEN | WITHDRAWN" }

  - name: Booking
    parent: null
    common_fields: true
    fields:
      - { name: flight_instance_id, type: string, source: input, description: "FK -> FlightInstance.id" }
      - { name: passenger_count, type: integer, source: input, description: "Seats occupied; must be >= 1" }
      - { name: booking_kind, type: enum, source: input, description: "AIR_ONLY | PACKAGE" }
      - { name: base_fare_total_cents, type: integer, source: computed, description: "passenger_count * Route.base_fare_cents at booking time (pinned snapshot)" }
      - { name: ancillary_total_cents, type: integer, source: computed, default: 0, description: "Sum of all non-VOIDED AncillaryPurchase.amount_cents for this booking" }
      - { name: package_bundle_id, type: string, source: system, description: "FK -> PackageBundle.id; null for AIR_ONLY" }
      - { name: stranded_until_date, type: string, source: system, description: "ISO date of the next SCHEDULED flight on the same route after a cancellation; null unless stranded" }
      - { name: booking_status, type: enum, source: system, description: "CONFIRMED | STRANDED | STRANDED_REBOOKED | CANCELLED" }

  - name: PackageBundle
    parent: Booking
    common_fields: true
    fields:
      - { name: booking_id, type: string, source: system, description: "FK -> Booking.id" }
      - { name: hotel_offer_id, type: string, source: input, description: "FK -> SupplierOffer.id; must be component_kind HOTEL and destination matches the route" }
      - { name: rental_car_offer_id, type: string, source: input, description: "FK -> SupplierOffer.id; nullable — when null no car component is bundled" }
      - { name: attraction_offer_id, type: string, source: input, description: "FK -> SupplierOffer.id; nullable" }
      - { name: bundle_price_cents, type: integer, source: computed, description: "Sum of sell_price_cents across included components, computed at bundle creation" }
      - { name: bundle_status, type: enum, source: system, description: "ACTIVE | CANCELLED | SETTLED" }

  - name: AncillaryPurchase
    parent: Booking
    common_fields: true
    fields:
      - { name: booking_id, type: string, source: system, description: "FK -> Booking.id" }
      - { name: ancillary_kind, type: enum, source: input, description: "SEAT_ASSIGNMENT | CHECKED_BAG | CARRY_ON_BAG | PRIORITY_BOARDING" }
      - { name: amount_cents, type: integer, source: input, description: "Charge in cents; must be > 0" }
      - { name: purchase_status, type: enum, source: system, description: "ACTIVE | VOIDED" }

  - name: DisruptionEvent
    parent: Route
    common_fields: true
    fields:
      - { name: route_id, type: string, source: system, description: "FK -> Route.id" }
      - { name: flight_instance_id, type: string, source: input, description: "FK -> FlightInstance.id being cancelled" }
      - { name: reason_code, type: enum, source: input, description: "WEATHER | MAINTENANCE | CREW_SHORTAGE | LOW_DEMAND" }
      - { name: disruption_status, type: enum, source: system, description: "DECLARED | RECOVERED" }

  - name: SupplierSettlement
    parent: null
    common_fields: true
    fields:
      - { name: supplier_code, type: string, source: input, description: "Supplier being settled; aggregates all PackageBundles consuming that supplier's offers in the settlement window" }
      - { name: period_start_date, type: string, source: input, description: "ISO date, inclusive" }
      - { name: period_end_date, type: string, source: input, description: "ISO date, inclusive" }
      - { name: gross_payable_cents, type: integer, source: computed, description: "Sum over consumed units of SupplierOffer.net_cost_cents — provisional variant counts bundles ACTIVE at any point in the window; final variant counts bundles still ACTIVE at close" }
      - { name: clawback_cents, type: integer, source: computed, default: 0, description: "Refund owed back to the airline for bundles cancelled after a provisional settlement was issued" }
      - { name: settlement_status, type: enum, source: system, description: "PROVISIONAL | FINALIZED | CLAWED_BACK" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Route
    initial_state: PLANNING
    terminal_states: [PERMANENTLY_CLOSED]
    transitions:
      - from: PLANNING
        to: SEASONAL_ACTIVE
        trigger: "POST /routes/{routeId}/activate"
        actor: NetworkPlanner
        preconditions:
          - "Route must be in PLANNING (ERR_ROUTE_NOT_PLANNING)"
          - "At least one SeasonWindow in OPEN status exists for the route (ERR_NO_OPEN_SEASON)"
        side_effects: []

      - from: SEASONAL_ACTIVE
        to: SEASONALLY_SUSPENDED
        trigger: "system (automatic when the route's last OPEN SeasonWindow transitions to SUSPENDED)"
        actor: system
        preconditions:
          - "Every SeasonWindow for the route is in SUSPENDED or CLOSED"
        side_effects:
          - "suspended_seasons_count increments by 1"

      - from: SEASONAL_ACTIVE
        to: SEASONALLY_SUSPENDED
        trigger: "POST /routes/{routeId}/suspend"
        actor: NetworkPlanner
        preconditions:
          - "Route must be in SEASONAL_ACTIVE (ERR_ROUTE_NOT_ACTIVE)"
        side_effects:
          - "Every OPEN SeasonWindow for the route -> SUSPENDED"
          - "Every PUBLISHED SchedulePublication in those windows -> FROZEN"
          - "Every SCHEDULED FlightInstance of those publications -> CANCELLED via a synthesized LOW_DEMAND DisruptionEvent"
          - "suspended_seasons_count increments by 1"

      - from: SEASONALLY_SUSPENDED
        to: SEASONAL_ACTIVE
        trigger: "POST /routes/{routeId}/reactivate"
        actor: NetworkPlanner
        preconditions:
          - "Route must be in SEASONALLY_SUSPENDED (ERR_ROUTE_NOT_SUSPENDED)"
          - "A new OPEN SeasonWindow is created in the same call or already exists"
        side_effects: []

      - from: SEASONAL_ACTIVE
        to: PERMANENTLY_CLOSED
        trigger: "POST /routes/{routeId}/close"
        actor: NetworkPlanner
        preconditions:
          - "No FlightInstance in SCHEDULED status on this route (ERR_ROUTE_HAS_LIVE_FLIGHTS)"
          - "No Booking in CONFIRMED, STRANDED or STRANDED_REBOOKED status on this route (ERR_ROUTE_HAS_LIVE_BOOKINGS)"
        side_effects: []

      - from: SEASONALLY_SUSPENDED
        to: PERMANENTLY_CLOSED
        trigger: "POST /routes/{routeId}/close"
        actor: NetworkPlanner
        preconditions:
          - "Same live-flight and live-booking preconditions as SEASONAL_ACTIVE close"
        side_effects: []

  - entity: SeasonWindow
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: SUSPENDED
        trigger: "POST /routes/{routeId}/season-windows/{windowId}/suspend or cascaded from route suspension"
        actor: "NetworkPlanner or system"
        preconditions:
          - "Window must be OPEN (ERR_WINDOW_NOT_OPEN)"
        side_effects:
          - "PUBLISHED SchedulePublications in this window -> FROZEN"
          - "If this was the route's last OPEN window, Route -> SEASONALLY_SUSPENDED"

      - from: SUSPENDED
        to: CLOSED
        trigger: "POST /routes/{routeId}/season-windows/{windowId}/close"
        actor: NetworkPlanner
        preconditions:
          - "Window must be SUSPENDED (ERR_WINDOW_NOT_SUSPENDED)"
          - "No PUBLISHED SchedulePublication remains in this window (ERR_PUBLICATIONS_STILL_LIVE)"
        side_effects: []

      - from: OPEN
        to: CLOSED
        trigger: "POST /routes/{routeId}/season-windows/{windowId}/close"
        actor: NetworkPlanner
        preconditions:
          - "Window must be OPEN or SUSPENDED"
          - "No PUBLISHED SchedulePublication remains in this window"
        side_effects: []

  - entity: SchedulePublication
    initial_state: PUBLISHED
    terminal_states: [RETIRED]
    transitions:
      - from: PUBLISHED
        to: FROZEN
        trigger: "cascaded from SeasonWindow suspension"
        actor: system
        preconditions: []
        side_effects:
          - "SCHEDULED FlightInstances -> CANCELLED (each spawns its own DisruptionEvent)"

      - from: PUBLISHED
        to: RETIRED
        trigger: "POST /routes/{routeId}/publications/{publicationId}/retire"
        actor: NetworkPlanner
        preconditions:
          - "Publication must be PUBLISHED (ERR_PUBLICATION_NOT_PUBLISHED)"
          - "No SCHEDULED FlightInstance with seats_sold > 0 (ERR_PUBLICATION_HAS_BOOKED_FLIGHTS)"
        side_effects:
          - "All remaining SCHEDULED FlightInstances with zero seats_sold -> CANCELLED (no DisruptionEvent; empty flights retire silently)"

      - from: FROZEN
        to: RETIRED
        trigger: "POST /routes/{routeId}/publications/{publicationId}/retire"
        actor: NetworkPlanner
        preconditions:
          - "Publication must be PUBLISHED or FROZEN"
        side_effects: []

  - entity: FlightInstance
    initial_state: SCHEDULED
    terminal_states: [CANCELLED, OPERATED]
    transitions:
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /routes/{routeId}/disruptions or cascaded from publication freeze/retire"
        actor: "OpsController or system"
        preconditions:
          - "Flight must be SCHEDULED (ERR_FLIGHT_NOT_SCHEDULED)"
        side_effects:
          - "cancelled_by_disruption_id set to the DisruptionEvent.id"
          - "Each CONFIRMED Booking on this flight -> STRANDED; stranded_until_date set to the flight_date of the next SCHEDULED FlightInstance on the same route (strictly later flight_date, tie-break by earliest created_at); if none exists, stranded_until_date is null"
          - "CrewAssignments on this flight -> RELEASED"

      - from: SCHEDULED
        to: OPERATED
        trigger: "POST /flight-instances/{flightInstanceId}/mark-operated"
        actor: OpsController
        preconditions:
          - "Flight must be SCHEDULED"
          - "Logical clock is on or after the flight_date"
        side_effects:
          - "Each STRANDED_REBOOKED Booking whose rebooked flight is this one -> CONFIRMED"

  - entity: Booking
    initial_state: CONFIRMED
    terminal_states: [CANCELLED]
    transitions:
      - from: CONFIRMED
        to: STRANDED
        trigger: "cascaded from FlightInstance cancellation"
        actor: system
        preconditions: []
        side_effects:
          - "stranded_until_date computed per FlightInstance cancellation rule"

      - from: STRANDED
        to: STRANDED_REBOOKED
        trigger: "POST /bookings/{bookingId}/rebook"
        actor: CustomerService
        preconditions:
          - "Booking must be STRANDED (ERR_BOOKING_NOT_STRANDED)"
          - "Target FlightInstance must be SCHEDULED on the same route (ERR_REBOOK_FLIGHT_INVALID)"
          - "Target flight must have seats_sold + booking.passenger_count <= Aircraft.seat_capacity (ERR_REBOOK_CAPACITY_EXCEEDED)"
        side_effects:
          - "flight_instance_id re-pointed to target flight"
          - "stranded_until_date cleared"
          - "seats_sold recomputed on both old and new flights"

      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /bookings/{bookingId}/cancel"
        actor: "Customer or CustomerService"
        preconditions:
          - "Booking must be CONFIRMED or STRANDED or STRANDED_REBOOKED (ERR_BOOKING_NOT_CANCELLABLE)"
        side_effects:
          - "AncillaryPurchases -> VOIDED; ancillary_total_cents recomputed to 0"
          - "If package_bundle_id is set, PackageBundle -> CANCELLED, which cascades a clawback_cents adjustment onto any PROVISIONAL SupplierSettlement covering the bundle's suppliers (see settlement calculations)"
          - "seats_sold on the flight decremented by passenger_count"

      - from: STRANDED
        to: CANCELLED
        trigger: "POST /bookings/{bookingId}/cancel"
        actor: "Customer or CustomerService"
        preconditions:
          - "Same as CONFIRMED cancel"
        side_effects:
          - "Same cascade as CONFIRMED cancel"

      - from: STRANDED_REBOOKED
        to: CANCELLED
        trigger: "POST /bookings/{bookingId}/cancel"
        actor: "Customer or CustomerService"
        preconditions:
          - "Same as CONFIRMED cancel"
        side_effects:
          - "Same cascade as CONFIRMED cancel"

  - entity: PackageBundle
    initial_state: ACTIVE
    terminal_states: [CANCELLED, SETTLED]
    transitions:
      - from: ACTIVE
        to: CANCELLED
        trigger: "cascaded from Booking cancellation"
        actor: system
        preconditions: []
        side_effects:
          - "For every supplier whose offer is consumed by this bundle: if a PROVISIONAL SupplierSettlement exists whose window covers the booking's flight_date, that settlement's clawback_cents increases by the offer's net_cost_cents and its status becomes CLAWED_BACK"

      - from: ACTIVE
        to: SETTLED
        trigger: "cascaded from SupplierSettlement finalization"
        actor: system
        preconditions: []
        side_effects: []

  - entity: SupplierSettlement
    initial_state: PROVISIONAL
    terminal_states: [FINALIZED, CLAWED_BACK]
    transitions:
      - from: PROVISIONAL
        to: FINALIZED
        trigger: "POST /supplier-settlements/{settlementId}/finalize"
        actor: FinanceAnalyst
        preconditions:
          - "Settlement must be PROVISIONAL (ERR_SETTLEMENT_NOT_PROVISIONAL)"
          - "Logical clock is strictly after period_end_date (ERR_SETTLEMENT_PERIOD_OPEN)"
        side_effects:
          - "gross_payable_cents recomputed under the final variant (only bundles still ACTIVE at finalization count)"
          - "Bundles counted -> SETTLED"

      - from: PROVISIONAL
        to: CLAWED_BACK
        trigger: "system (bundle cancellation while settlement still PROVISIONAL)"
        actor: system
        preconditions: []
        side_effects:
          - "clawback_cents incremented by the cancelled bundle's net_cost_cents for this supplier"

  - entity: AncillaryPurchase
    initial_state: ACTIVE
    terminal_states: [VOIDED]
    transitions:
      - from: ACTIVE
        to: VOIDED
        trigger: "cascaded from Booking cancellation, or POST /bookings/{bookingId}/ancillaries/{purchaseId}/void"
        actor: "Customer, CustomerService, or system"
        preconditions:
          - "Purchase must be ACTIVE (ERR_ANCILLARY_NOT_ACTIVE)"
        side_effects:
          - "Booking.ancillary_total_cents decremented by amount_cents"

  - entity: DisruptionEvent
    initial_state: DECLARED
    terminal_states: [RECOVERED]
    transitions:
      - from: DECLARED
        to: RECOVERED
        trigger: "system (when every Booking stranded by this disruption has been rebooked or cancelled)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: CrewAssignment
    initial_state: ASSIGNED
    terminal_states: [RELEASED]
    transitions:
      - from: ASSIGNED
        to: RELEASED
        trigger: "cascaded from FlightInstance cancellation, or DELETE /flight-instances/{flightInstanceId}/crew-assignments/{assignmentId}"
        actor: "CrewScheduler or system"
        preconditions:
          - "Assignment must be ASSIGNED (ERR_ASSIGNMENT_NOT_ASSIGNED)"
        side_effects: []

  - entity: Aircraft
    initial_state: IN_SERVICE
    terminal_states: [OUT_OF_SERVICE]
    transitions:
      - from: IN_SERVICE
        to: OUT_OF_SERVICE
        trigger: "POST /aircraft/{aircraftId}/retire"
        actor: OpsController
        preconditions:
          - "Aircraft must be IN_SERVICE"
          - "No SCHEDULED FlightInstance references this tail (ERR_AIRCRAFT_HAS_LIVE_FLIGHTS)"
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: publication-create-stale-window
    parent_entity: SeasonWindow
    write_endpoint: "POST /routes/{routeId}/publications"
    occ_field: "expected_window_version"
    description: |
      Publishing a SchedulePublication against a SeasonWindow whose version has
      advanced since the planner last observed it is rejected. This captures the
      case where another planner has just suspended or re-opened the window
      (changing its version) and the current planner's view of the window is
      therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: booking-create-stale-flight
    parent_entity: FlightInstance
    write_endpoint: "POST /bookings"
    occ_field: "expected_flight_version"
    description: |
      Creating a Booking against a FlightInstance whose version has advanced
      since the client last read it is rejected. This captures the case where a
      prior booking has just consumed the remaining seats (bumping
      seats_sold and version) and the current writer's capacity view is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: rebook-stale-booking
    parent_entity: Booking
    write_endpoint: "POST /bookings/{bookingId}/rebook"
    occ_field: "expected_booking_version"
    description: |
      Rebooking a Booking whose version has advanced since the agent last
      observed it is rejected. This captures the case where a cancellation
      cascade has already moved the booking out of STRANDED (or re-pointed it)
      and the current rebook request is acting on a stale record.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: stranded_until_date
    trigger: "FlightInstance -> CANCELLED"
    algorithm: forward_looking
    formula: |
      candidates = all FlightInstance f where
        f.route_id == cancelled.route_id
        AND f.flight_status == SCHEDULED
        AND f.flight_date > cancelled.flight_date
      if candidates is empty: stranded_until_date = null
      else:
        primary sort: f.flight_date ASC
        tie-break: f.created_at ASC (never id)
        stranded_until_date = head(candidates).flight_date
    input_set: "SCHEDULED flights on the same route only; CANCELLED and OPERATED excluded"
    precision: "ISO date, no rounding"

  - name: settlement_gross_payable
    trigger: "SupplierSettlement creation (provisional variant) and finalize (final variant)"
    algorithm: aggregation
    formula: |
      PROVISIONAL variant (at creation):
        included_bundles = PackageBundle b where
          b.supplier offer for this settlement's supplier_code is consumed
          AND b.bundle_status IN {ACTIVE, CANCELLED}
          AND b's booking flight_date IN [period_start_date, period_end_date] (inclusive both ends)
        gross_payable_cents = sum over included_bundles of SupplierOffer.net_cost_cents
      FINAL variant (at finalize):
        included_bundles = same window BUT bundle_status == ACTIVE only
          (bundles cancelled between provisional and final are excluded and
           their value lives in clawback_cents instead)
        gross_payable_cents = sum over included_bundles of SupplierOffer.net_cost_cents
      The two variants produce different totals whenever any bundle in the
      window has been cancelled between creation and finalize.
    input_set: "PackageBundles whose booking flight_date falls in the settlement window; variant differs on status filter"
    precision: "integer cents, no rounding"

  - name: aircraft_daily_utilization_check
    trigger: "FlightInstance tail assignment (POST /flight-instances/{id}/assign-aircraft)"
    algorithm: threshold
    formula: |
      day_minutes = sum of block_minutes over all SCHEDULED FlightInstances
        assigned to this Aircraft whose flight_date == target.flight_date
      proposed_total = day_minutes + target.block_minutes
      applicable_cap =
        if target.is_peak_day: Aircraft.peak_day_cap_minutes
        else: Aircraft.daily_utilization_cap_minutes
      if proposed_total > applicable_cap: reject ERR_UTILIZATION_CAP_EXCEEDED
      Boundary: proposed_total == applicable_cap is ALLOWED (strictly-greater rejects).
    constants:
      BOUNDARY_RULE: "reject iff proposed_total > applicable_cap; == passes"
    precision: "integer minutes"

  - name: weekly_frequency_check
    trigger: "SchedulePublication creation"
    algorithm: threshold
    formula: |
      For each ISO week W overlapped by [first_operating_date, last_operating_date]:
        published_departures_W = |operating_days_mask intersect weekdays_of(W) intersect [first..last]|
        already_published_W = count of SCHEDULED or PUBLISHED-derived FlightInstances
          on this route with flight_date in W from other non-RETIRED publications
        if published_departures_W + already_published_W > Route.weekly_frequency_cap:
          reject ERR_FREQUENCY_CAP_EXCEEDED
      Boundary: equal to cap is allowed (strictly-greater rejects).
    constants:
      BOUNDARY_RULE: "reject iff total > cap; == passes"
    precision: "integer counts"

  - name: package_bundle_price
    trigger: "PackageBundle creation (inside POST /bookings with booking_kind PACKAGE)"
    algorithm: aggregation
    formula: |
      bundle_price_cents = sum of sell_price_cents over the included components:
        hotel component always included
        rental_car component included iff rental_car_offer_id is non-null
        attraction component included iff attraction_offer_id is non-null
      Evaluation order is pinned:
        1. resolve each offer's sell_price_cents (frozen at booking time)
        2. sum in the order hotel, rental_car, attraction
        3. store as integer cents (no rounding needed — all inputs are integer cents)
    input_set: "the 1–3 SupplierOffers referenced by the bundle"
    precision: "integer cents"

  - name: base_fare_total
    trigger: "Booking creation"
    algorithm: aggregation
    formula: |
      base_fare_total_cents = passenger_count * Route.base_fare_cents
      Snapshot: the route's base_fare_cents at the moment of booking is pinned
      onto the Booking row; later route fare changes do NOT retroactively
      modify existing bookings.
    precision: "integer cents"

  - name: ancillary_total_recompute
    trigger: "AncillaryPurchase create / void"
    algorithm: aggregation
    formula: |
      Booking.ancillary_total_cents =
        sum of amount_cents over this booking's AncillaryPurchases
        where purchase_status == ACTIVE
      Recomputed eagerly on every ancillary mutation (immediate consistency).
    precision: "integer cents"

  - name: rebook_capacity_check
    trigger: "POST /bookings/{bookingId}/rebook"
    algorithm: threshold
    formula: |
      projected_seats = target_flight.seats_sold + booking.passenger_count
      capacity = target_flight.aircraft.seat_capacity
      if target_flight.aircraft_id is null: reject ERR_REBOOK_NO_AIRCRAFT
      if projected_seats > capacity: reject ERR_REBOOK_CAPACITY_EXCEEDED
      Boundary: projected_seats == capacity is ALLOWED (strictly-greater rejects).
    constants:
      BOUNDARY_RULE: "reject iff projected_seats > capacity; == passes"
    precision: "integer seats"

  - name: publish_horizon_check
    trigger: "SchedulePublication creation"
    algorithm: threshold
    formula: |
      days_ahead = (first_operating_date - logical_clock.current_date).days
      if days_ahead < PUBLISH_HORIZON_MIN_DAYS: reject ERR_PUBLISH_HORIZON_VIOLATION
      Boundary: days_ahead == PUBLISH_HORIZON_MIN_DAYS is ALLOWED.
    constants:
      PUBLISH_HORIZON_MIN_DAYS: 180
      BOUNDARY_RULE: "reject iff days_ahead < 180; == passes"
    precision: "integer days"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and well-formed"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Role must be authorized for the endpoint per §1.7"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Every id referenced in path or body must exist, validated left-to-right"
    error_id: "ERR_STATION_NOT_FOUND | ERR_ROUTE_NOT_FOUND | ERR_WINDOW_NOT_FOUND | ERR_PUBLICATION_NOT_FOUND | ERR_FLIGHT_NOT_FOUND | ERR_AIRCRAFT_NOT_FOUND | ERR_CREW_BASE_NOT_FOUND | ERR_CREW_MEMBER_NOT_FOUND | ERR_OFFER_NOT_FOUND | ERR_BOOKING_NOT_FOUND | ERR_BUNDLE_NOT_FOUND | ERR_ANCILLARY_NOT_FOUND | ERR_SETTLEMENT_NOT_FOUND | ERR_DISRUPTION_NOT_FOUND | ERR_ASSIGNMENT_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path or body ids"

  - priority: 4
    category: state
    check: "Target resource must be in the state required by the transition (see §1.2 preconditions)"
    error_id: "ERR_ROUTE_NOT_PLANNING | ERR_ROUTE_NOT_ACTIVE | ERR_ROUTE_NOT_SUSPENDED | ERR_WINDOW_NOT_OPEN | ERR_WINDOW_NOT_SUSPENDED | ERR_PUBLICATION_NOT_PUBLISHED | ERR_FLIGHT_NOT_SCHEDULED | ERR_BOOKING_NOT_STRANDED | ERR_BOOKING_NOT_CANCELLABLE | ERR_SETTLEMENT_NOT_PROVISIONAL | ERR_ANCILLARY_NOT_ACTIVE | ERR_ASSIGNMENT_NOT_ASSIGNED"
    http_status: 409
    applies_to: "state-transition endpoints"

  - priority: 5
    category: business_temporal
    check: "SchedulePublication dates must lie inside their SeasonWindow and satisfy the publish horizon"
    error_id: "ERR_PUBLISH_HORIZON_VIOLATION | ERR_PUBLICATION_OUTSIDE_WINDOW"
    http_status: 422
    applies_to: "POST /routes/{routeId}/publications"

  - priority: 6
    category: business_safety
    check: "Station kinds must match route direction (origin must be ORIGIN_SMALL_CITY, destination must be LEISURE_DESTINATION)"
    error_id: ERR_ROUTE_ENDPOINT_KIND_MISMATCH
    http_status: 422
    applies_to: "POST /routes"

  - priority: 7
    category: business_referential
    check: "Crew member's base station must equal the route origin station; crew base and member must be ACTIVE"
    error_id: "ERR_CREW_BASE_MISMATCH | ERR_CREW_MEMBER_INACTIVE"
    http_status: 422
    applies_to: "POST /flight-instances/{flightInstanceId}/crew-assignments"

  - priority: 8
    category: business_referential
    check: "Package bundle offers must exist, be OPEN, have the declared component_kind, and serve the route's destination station"
    error_id: "ERR_OFFER_WRONG_KIND | ERR_OFFER_WRONG_DESTINATION | ERR_OFFER_NOT_OPEN"
    http_status: 422
    applies_to: "POST /bookings with booking_kind PACKAGE"

  - priority: 9
    category: business_constraint
    check: "Frequency cap and aircraft utilization caps must be respected (strictly-greater rejects)"
    error_id: "ERR_FREQUENCY_CAP_EXCEEDED | ERR_UTILIZATION_CAP_EXCEEDED"
    http_status: 409
    applies_to: "publication creation; aircraft assignment"

  - priority: 10
    category: business_constraint
    check: "Rebook target must be SCHEDULED on the same route, have an aircraft assigned, and have capacity"
    error_id: "ERR_REBOOK_FLIGHT_INVALID | ERR_REBOOK_NO_AIRCRAFT | ERR_REBOOK_CAPACITY_EXCEEDED"
    http_status: 409
    applies_to: "POST /bookings/{bookingId}/rebook"

  - priority: 11
    category: business_fiscal
    check: "Settlement finalize requires clock strictly after period_end_date"
    error_id: ERR_SETTLEMENT_PERIOD_OPEN
    http_status: 422
    applies_to: "POST /supplier-settlements/{settlementId}/finalize"

  - priority: 12
    category: state
    check: "OCC: expected_*_version must equal the parent entity's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /routes/{routeId}/publications; POST /bookings; POST /bookings/{bookingId}/rebook"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Clock (test-driving) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. Before any call, the clock reads exactly 2026-09-01T00:00:00Z and MUST NOT fall back to real wall-clock time."
    roles: [NetworkPlanner, OpsController, CustomerService, FinanceAnalyst, CrewScheduler]
    code: 200
    input: [current_utc]
    output: { current_utc: string }
    side_effects: []

  # --- Station ---
  - method: POST
    path: "/stations"
    description: "Register an airport"
    roles: [NetworkPlanner]
    code: 201
    input: [iata_code, station_kind, timezone, "single_station_flag?"]
    output: Station
    side_effects: []

  - method: GET
    path: "/stations"
    description: "List stations"
    roles: [NetworkPlanner, OpsController, CustomerService, FinanceAnalyst, CrewScheduler]
    code: 200
    input: ["station_kind?", "limit?", "offset?"]
    output: "Station[]"
    side_effects: []

  - method: GET
    path: "/stations/{stationId}"
    description: "Get one station"
    roles: [NetworkPlanner, OpsController, CustomerService, FinanceAnalyst, CrewScheduler]
    code: 200
    input: []
    output: Station
    side_effects: []

  # --- Route ---
  - method: POST
    path: "/routes"
    description: "Create a leisure route (small-city origin to leisure destination)"
    roles: [NetworkPlanner]
    code: 201
    input: [origin_station_id, destination_station_id, base_fare_cents, weekly_frequency_cap]
    output: Route
    side_effects: ["route_posture = PLANNING", "suspended_seasons_count = 0"]

  - method: GET
    path: "/routes"
    description: "List routes"
    roles: [NetworkPlanner, OpsController, CustomerService, FinanceAnalyst, CrewScheduler]
    code: 200
    input: ["route_posture?", "origin_station_id?", "destination_station_id?", "limit?", "offset?"]
    output: "Route[]"
    side_effects: []

  - method: GET
    path: "/routes/{routeId}"
    description: "Get one route"
    roles: [NetworkPlanner, OpsController, CustomerService, FinanceAnalyst, CrewScheduler]
    code: 200
    input: []
    output: Route
    side_effects: []

  - method: POST
    path: "/routes/{routeId}/activate"
    description: "PLANNING -> SEASONAL_ACTIVE"
    roles: [NetworkPlanner]
    code: 200
    input: []
    output: Route
    side_effects: ["requires at least one OPEN SeasonWindow"]

  - method: POST
    path: "/routes/{routeId}/suspend"
    description: "SEASONAL_ACTIVE -> SEASONALLY_SUSPENDED with full cascade"
    roles: [NetworkPlanner]
    code: 200
    input: []
    output: Route
    side_effects:
      - "OPEN SeasonWindows -> SUSPENDED"
      - "PUBLISHED SchedulePublications -> FROZEN"
      - "SCHEDULED FlightInstances -> CANCELLED via synthesized LOW_DEMAND DisruptionEvents"
      - "CONFIRMED Bookings -> STRANDED with stranded_until_date recomputed"
      - "suspended_seasons_count += 1"

  - method: POST
    path: "/routes/{routeId}/reactivate"
    description: "SEASONALLY_SUSPENDED -> SEASONAL_ACTIVE"
    roles: [NetworkPlanner]
    code: 200
    input: []
    output: Route
    side_effects: []

  - method: POST
    path: "/routes/{routeId}/close"
    description: "-> PERMANENTLY_CLOSED; requires no live flights or bookings"
    roles: [NetworkPlanner]
    code: 200
    input: []
    output: Route
    side_effects: []

  # --- SeasonWindow ---
  - method: POST
    path: "/routes/{routeId}/season-windows"
    description: "Open a season window on a route"
    roles: [NetworkPlanner]
    code: 201
    input: [season_label, window_start_date, window_end_date, "suspension_reason?"]
    output: SeasonWindow
    side_effects: ["window_status = OPEN"]

  - method: GET
    path: "/routes/{routeId}/season-windows"
    description: "List windows for a route"
    roles: [NetworkPlanner, OpsController, CustomerService, FinanceAnalyst, CrewScheduler]
    code: 200
    input: ["window_status?", "limit?", "offset?"]
    output: "SeasonWindow[]"
    side_effects: []

  - method: GET
    path: "/routes/{routeId}/season-windows/{windowId}"
    description: "Get one window"
    roles: [NetworkPlanner, OpsController, CustomerService, FinanceAnalyst, CrewScheduler]
    code: 200
    input: []
    output: SeasonWindow
    side_effects: []

  - method: POST
    path: "/routes/{routeId}/season-windows/{windowId}/suspend"
    description: "OPEN -> SUSPENDED"
    roles: [NetworkPlanner]
    code: 200
    input: ["suspension_reason?"]
    output: SeasonWindow
    side_effects: ["PUBLISHED publications in window -> FROZEN", "if last OPEN window, route -> SEASONALLY_SUSPENDED"]

  - method: POST
    path: "/routes/{routeId}/season-windows/{windowId}/close"
    description: "OPEN or SUSPENDED -> CLOSED"
    roles: [NetworkPlanner]
    code: 200
    input: []
    output: SeasonWindow
    side_effects: []

  # --- SeasonWindow (flat reads for FK reverse-reachability) ---
  - method: GET
    path: "/season-windows"
    description: "List season windows across routes"
    roles: [NetworkPlanner, OpsController, CustomerService, FinanceAnalyst, CrewScheduler]
    code: 200
    input: ["route_id?", "window_status?", "limit?", "offset?"]
    output: "SeasonWindow[]"
    side_effects: []

  - method: GET
    path: "/season-windows/{windowId}"
    description: "Get one season window by id"
    roles: [NetworkPlanner, OpsController, CustomerService, FinanceAnalyst, CrewScheduler]
    code: 200
    input: []
    output: SeasonWindow
    side_effects: []

  # --- SchedulePublication (flat reads for FK reverse-reachability) ---
  - method: GET
    path: "/schedule-publications"
    description: "List publications across routes"
    roles: [NetworkPlanner, OpsController, CustomerService, FinanceAnalyst, CrewScheduler]
    code: 200
    input: ["route_id?", "season_window_id?", "publication_status?", "limit?", "offset?"]
    output: "SchedulePublication[]"
    side_effects: []

  - method: GET
    path: "/schedule-publications/{publicationId}"
    description: "Get one publication by id"
    roles: [NetworkPlanner, OpsController, CustomerService, FinanceAnalyst, CrewScheduler]
    code: 200
    input: []
    output: SchedulePublication
    side_effects: []

  # --- SchedulePublication ---
  - method: POST
    path: "/routes/{routeId}/publications"
    description: "Publish a seasonal day-of-week schedule; generates FlightInstances for every matching date"
    roles: [NetworkPlanner]
    code: 201
    input: [season_window_id, operating_days_mask, first_operating_date, last_operating_date, departure_time_local, block_minutes, expected_window_version]
    output: SchedulePublication
    side_effects:
      - "publication_status = PUBLISHED; published_at = logical clock"
      - "FlightInstances generated for each date in [first,last] whose ISO weekday is in operating_days_mask"
      - "each generated FlightInstance.flight_status = SCHEDULED, seats_sold = 0, is_peak_day computed"
      - "increments SeasonWindow.version by 1"

  - method: GET
    path: "/routes/{routeId}/publications"
    description: "List publications for a route"
    roles: [NetworkPlanner, OpsController, CustomerService, FinanceAnalyst, CrewScheduler]
    code: 200
    input: ["publication_status?", "limit?", "offset?"]
    output: "SchedulePublication[]"
    side_effects: []

  - method: GET
    path: "/routes/{routeId}/publications/{publicationId}"
    description: "Get one publication"
    roles: [NetworkPlanner, OpsController, CustomerService, FinanceAnalyst, CrewScheduler]
    code: 200
    input: []
    output: SchedulePublication
    side_effects: []

  - method: POST
    path: "/routes/{routeId}/publications/{publicationId}/retire"
    description: "PUBLISHED or FROZEN -> RETIRED; unbooked flights cancel silently"
    roles: [NetworkPlanner]
    code: 200
    input: []
    output: SchedulePublication
    side_effects: []

  # --- Aircraft ---
  - method: POST
    path: "/aircraft"
    description: "Register a tail"
    roles: [OpsController]
    code: 201
    input: [tail_number, seat_capacity, daily_utilization_cap_minutes, peak_day_cap_minutes]
    output: Aircraft
    side_effects: ["aircraft_status = IN_SERVICE"]

  - method: GET
    path: "/aircraft"
    description: "List aircraft"
    roles: [NetworkPlanner, OpsController, CustomerService, FinanceAnalyst, CrewScheduler]
    code: 200
    input: ["aircraft_status?", "limit?", "offset?"]
    output: "Aircraft[]"
    side_effects: []

  - method: GET
    path: "/aircraft/{aircraftId}"
    description: "Get one aircraft"
    roles: [NetworkPlanner, OpsController, CustomerService, FinanceAnalyst, CrewScheduler]
    code: 200
    input: []
    output: Aircraft
    side_effects: []

  - method: POST
    path: "/aircraft/{aircraftId}/retire"
    description: "IN_SERVICE -> OUT_OF_SERVICE"
    roles: [OpsController]
    code: 200
    input: []
    output: Aircraft
    side_effects: []

  # --- FlightInstance ---
  - method: GET
    path: "/flight-instances"
    description: "List flight instances, filterable"
    roles: [NetworkPlanner, OpsController, CustomerService, FinanceAnalyst, CrewScheduler]
    code: 200
    input: ["route_id?", "publication_id?", "aircraft_id?", "cancelled_by_disruption_id?", "flight_status?", "flight_date?", "limit?", "offset?"]
    output: "FlightInstance[]"
    side_effects: []

  - method: GET
    path: "/flight-instances/{flightInstanceId}"
    description: "Get one flight instance"
