# =============================================================================
# Task 994 — §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth walk over §1.1–§1.7 per references/claim-extraction-guide.md.
# All times rely on the logical clock default 2026-05-01T00:00:00Z unless a
# /_clock/set_current_utc call appears in the chain.
# =============================================================================
scaffold_corner_design:

  # ===================================================== 1. Entities
  - section: entities
    instances:
      - name: shopper_create_returns_defaults_and_201
        claim_type: creation
        grounds: [entities.Shopper]
        distinguishing_aspect: "Create returns 201 with system defaults: status ACTIVE, fraud_strikes 0, version 1."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /v1/shoppers", payload: { email: "c1@x.com", full_name: "Corner One", postal_code: "30001" }, as: Shopper, captures: { sh_id: $.data.id, sh_st: $.data.status, sh_fs: $.data.fraud_strikes, sh_v: $.data.version } }
          assert:
            - "sh_st == ACTIVE and sh_fs == 0 and sh_v == 1"
            - "sh_id is a server-minted UUID"

      - name: shopper_create_missing_required_email_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.Shopper.fields.email, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required email is rejected with ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /v1/shoppers", payload: { full_name: "No Email", postal_code: "30002" }, as: Shopper, captures: { err: $.data.error_id } }
          assert: ["err == ERR_INVALID_REQUEST"]

      - name: shopper_create_duplicate_email_rejected
        claim_type: type_constraints
        grounds: [entities.Shopper.fields.email]
        distinguishing_aspect: "Email uniqueness across shoppers: second create with the same email fails."
        test_recipe:
          setup: ["Shopper with email dup@x.com exists"]
          setup_api_calls:
            - { call: "POST /v1/shoppers", payload: { email: "dup@x.com", full_name: "First", postal_code: "30003" }, as: Shopper, captures: { sh1: $.data.id } }
          trigger:
            - { call: "POST /v1/shoppers", payload: { email: "dup@x.com", full_name: "Second", postal_code: "30004" }, as: Shopper, captures: { err: $.data.error_id } }
          assert: ["err == ERR_INVALID_REQUEST"]

      - name: return_order_boxless_default_false_applied
        claim_type: defaults
        grounds: [entities.ReturnOrder.fields.boxless]
        distinguishing_aspect: "Omitting boxless on a COUNTER_DROP create defaults it to false (QR not forced)."
        test_recipe:
          setup: ["Plan P; merchant M; OPEN cycle; shopper S"]
          setup_api_calls:
            - { call: "POST /v1/subscription-plans", payload: { tier: CUSTOM, monthly_fee_cents: 100, included_returns: 100, overage_fee_cents: 10, pickup_enabled: true, boxless_enabled: true, oversize_enabled: true, free_returns: false, oversize_surcharge_cents: 0, pickup_fee_cents: 0 }, as: PlatformAdmin, captures: { plan_id: $.data.id } }
            - { call: "POST /v1/subscription-plans/${plan_id}/publish", payload: {}, as: PlatformAdmin }
            - { call: "POST /v1/merchant-accounts", payload: { legal_name: "M-Def", plan_id: "${plan_id}" }, as: PlatformAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /v1/merchant-accounts/${m_id}/billing-cycles", payload: { period_start: "2026-04-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /v1/shoppers", payload: { email: "sdx@x.com", full_name: "S Def", postal_code: "30005" }, as: Shopper, captures: { sh_id: $.data.id } }
          trigger:
            - { call: "POST /v1/return-orders", payload: { shopper_id: "${sh_id}", merchant_id: "${m_id}", method: COUNTER_DROP, items: [ { sku: "DF", quantity: 1, unit_price_cents: 100, declared_condition: NEW, longest_side_cm: 10, weight_grams: 50 } ] }, as: Shopper, as_user_id: "${sh_id}", captures: { ro_box: $.data.boxless, ro_st: $.data.status } }
          assert:
            - "ro_box == false (default applied)"
            - "ro_st == INITIATED (initial state)"

      - name: merchant_create_computed_ledger_input_ignored
        claim_type: computed_fields
        grounds: [entities.MerchantAccount.fields.ledger_balance_cents]
        distinguishing_aspect: "Client-supplied ledger_balance_cents is ignored; server initializes the computed field to 0."
        test_recipe:
          setup: ["PUBLISHED plan exists"]
          setup_api_calls:
            - { call: "POST /v1/subscription-plans", payload: { tier: CUSTOM, monthly_fee_cents: 100, included_returns: 100, overage_fee_cents: 10, pickup_enabled: true, boxless_enabled: true, oversize_enabled: true, free_returns: false, oversize_surcharge_cents: 0, pickup_fee_cents: 0 }, as: PlatformAdmin, captures: { plan_id: $.data.id } }
            - { call: "POST /v1/subscription-plans/${plan_id}/publish", payload: {}, as: PlatformAdmin }
          trigger:
            - { call: "POST /v1/merchant-accounts", payload: { legal_name: "M-Sneaky", plan_id: "${plan_id}", ledger_balance_cents: 999999 }, as: PlatformAdmin, captures: { bal: $.data.ledger_balance_cents } }
          assert: ["bal == 0 (input ignored)"]

      - name: get_return_order_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET with a non-existent UUID yields ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /v1/return-orders/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: {}, as: PlatformAdmin, captures: { err: $.data.error_id } }
          assert: ["err == ERR_NOT_FOUND"]

      - name: refund_ledger_entry_immutable_no_version_field
        claim_type: immutability
        grounds: [entities.RefundLedgerEntry]
        distinguishing_aspect: "common_fields:false — the append-only ledger entry exposes id and created_at but no version/updated_at, and no update endpoint exists."
        test_recipe:
          setup: ["Order created (auto-appends ESTIMATE entry)"]
          setup_api_calls:
            - { call: "POST /v1/subscription-plans", payload: { tier: CUSTOM, monthly_fee_cents: 100, included_returns: 100, overage_fee_cents: 10, pickup_enabled: true, boxless_enabled: true, oversize_enabled: true, free_returns: false, oversize_surcharge_cents: 0, pickup_fee_cents: 0 }, as: PlatformAdmin, captures: { plan_id: $.data.id } }
            - { call: "POST /v1/subscription-plans/${plan_id}/publish", payload: {}, as: PlatformAdmin }
            - { call: "POST /v1/merchant-accounts", payload: { legal_name: "M-Imm", plan_id: "${plan_id}" }, as: PlatformAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /v1/merchant-accounts/${m_id}/billing-cycles", payload: { period_start: "2026-04-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /v1/shoppers", payload: { email: "sim@x.com", full_name: "S Imm", postal_code: "30006" }, as: Shopper, captures: { sh_id: $.data.id } }
            - { call: "POST /v1/return-orders", payload: { shopper_id: "${sh_id}", merchant_id: "${m_id}", method: COUNTER_DROP, items: [ { sku: "IM", quantity: 1, unit_price_cents: 100, declared_condition: NEW, longest_side_cm: 10, weight_grams: 50 } ] }, as: Shopper, as_user_id: "${sh_id}", captures: { ro_id: $.data.id } }
          trigger:
            - { call: "GET /v1/return-orders/${ro_id}/refund-ledger", payload: {}, as: PlatformAdmin, captures: { k0: "$.data[0].kind", amt0: "$.data[0].amount_cents" } }
          assert:
            - "k0 == ESTIMATE and amt0 == 100 (auto-appended at creation)"
            - "ledger entry objects carry no version field (immutable log)"

      - name: fk_reverse_membership_list_shows_tote_members
        claim_type: parent_relationships
        grounds: [entities.ReturnOrder.fields.tote_id]
        distinguishing_aspect: "GET /v1/consolidation-totes/{id}/return-orders returns exactly the tote's member orders (FK reverse reachability)."
        test_recipe:
          setup: ["Counter location, route, tote; order dropped off and added to tote"]
          setup_api_calls:
            - { call: "POST /v1/subscription-plans", payload: { tier: CUSTOM, monthly_fee_cents: 100, included_returns: 100, overage_fee_cents: 10, pickup_enabled: false, boxless_enabled: true, oversize_enabled: true, free_returns: false, oversize_surcharge_cents: 0, pickup_fee_cents: 0 }, as: PlatformAdmin, captures: { plan_id: $.data.id } }
            - { call: "POST /v1/subscription-plans/${plan_id}/publish", payload: {}, as: PlatformAdmin }
            - { call: "POST /v1/merchant-accounts", payload: { legal_name: "M-FK", plan_id: "${plan_id}" }, as: PlatformAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /v1/merchant-accounts/${m_id}/billing-cycles", payload: { period_start: "2026-04-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /v1/shoppers", payload: { email: "sfk@x.com", full_name: "S FK", postal_code: "30007" }, as: Shopper, captures: { sh_id: $.data.id } }
            - { call: "POST /v1/dropoff-locations", payload: { name: "L-FK", kind: COUNTER, postal_code: "30008" }, as: PlatformAdmin, captures: { loc_id: $.data.id } }
            - { call: "POST /v1/dropoff-locations/${loc_id}/activate", payload: {}, as: PlatformAdmin }
            - { call: "POST /v1/carrier-routes", payload: { origin_location_id: "${loc_id}", destination_facility: "FAC-9", weight_capacity_grams: 100000 }, as: CarrierDispatcher, captures: { route_id: $.data.id } }
            - { call: "POST /v1/consolidation-totes", payload: { route_id: "${route_id}", location_id: "${loc_id}" }, as: LocationOperator, as_user_id: "${loc_id}", captures: { tote_id: $.data.id, tote_v: $.data.version } }
            - { call: "POST /v1/return-orders", payload: { shopper_id: "${sh_id}", merchant_id: "${m_id}", method: COUNTER_DROP, items: [ { sku: "FK", quantity: 1, unit_price_cents: 100, declared_condition: NEW, longest_side_cm: 10, weight_grams: 50 } ] }, as: Shopper, as_user_id: "${sh_id}", captures: { ro1: $.data.id, ro1_v: $.data.version } }
            - { call: "POST /v1/return-orders/${ro1}/labels", payload: { label_type: CARRIER_LABEL, expected_return_order_version: "${ro1_v}" }, as: Shopper, as_user_id: "${sh_id}" }
            - { call: "POST /v1/return-orders/${ro1}/confirm-dropoff", payload: { location_id: "${loc_id}" }, as: LocationOperator, as_user_id: "${loc_id}" }
            - { call: "POST /v1/consolidation-totes/${tote_id}/return-orders", payload: { return_order_id: "${ro1}", expected_tote_version: "${tote_v}" }, as: LocationOperator, as_user_id: "${loc_id}" }
          trigger:
            - { call: "GET /v1/consolidation-totes/${tote_id}/return-orders", payload: {}, as: LocationOperator, as_user_id: "${loc_id}", captures: { m0: "$.data[0].id" } }
          assert: ["m0 == \"${ro1}\" and the list length == 1"]

  # ===================================================== 2. State Machines
  - section: state_machines
    instances:
      - name: label_double_void_terminal_lockdown
        claim_type: terminal_lockdown
        grounds: [state_machines.Label, "errors[ERR_LABEL_NOT_ACTIVE]"]
        distinguishing_aspect: "A VOIDED label rejects a second void with ERR_LABEL_NOT_ACTIVE; terminal states lock."
        test_recipe:
          setup: ["Plan; merchant; cycle; shopper; COUNTER_DROP order with an issued label"]
          setup_api_calls:
            - { call: "POST /v1/subscription-plans", payload: { tier: CUSTOM, monthly_fee_cents: 100, included_returns: 100, overage_fee_cents: 10, pickup_enabled: false, boxless_enabled: true, oversize_enabled: true, free_returns: false, oversize_surcharge_cents: 0, pickup_fee_cents: 0 }, as: PlatformAdmin, captures: { plan_id: $.data.id } }
            - { call: "POST /v1/subscription-plans/${plan_id}/publish", payload: {}, as: PlatformAdmin }
            - { call: "POST /v1/merchant-accounts", payload: { legal_name: "M-LV", plan_id: "${plan_id}" }, as: PlatformAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /v1/merchant-accounts/${m_id}/billing-cycles", payload: { period_start: "2026-04-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /v1/shoppers", payload: { email: "slv@x.com", full_name: "S LV", postal_code: "30009" }, as: Shopper, captures: { sh_id: $.data.id } }
            - { call: "POST /v1/return-orders", payload: { shopper_id: "${sh_id}", merchant_id: "${m_id}", method: COUNTER_DROP, items: [ { sku: "LV", quantity: 1, unit_price_cents: 100, declared_condition: NEW, longest_side_cm: 10, weight_grams: 50 } ] }, as: Shopper, as_user_id: "${sh_id}", captures: { ro_id: $.data.id, ro_v: $.data.version } }
            - { call: "POST /v1/return-orders/${ro_id}/labels", payload: { label_type: CARRIER_LABEL, expected_return_order_version: "${ro_v}" }, as: Shopper, as_user_id: "${sh_id}", captures: { lb_id: $.data.id } }
            - { call: "POST /v1/labels/${lb_id}/void", payload: {}, as: Shopper, as_user_id: "${sh_id}" }
          trigger:
            - { call: "POST /v1/labels/${lb_id}/void", payload: {}, as: Shopper, as_user_id: "${sh_id}", captures: { err: $.data.error_id } }
          assert: ["err == ERR_LABEL_NOT_ACTIVE"]

      - name: cancel_terminal_order_returns_already_terminal
        claim_type: terminal_lockdown
        grounds: [state_machines.ReturnOrder, "errors[ERR_ALREADY_TERMINAL]"]
        distinguishing_aspect: "Cancelling a REFUND_POSTED order fails with ERR_ALREADY_TERMINAL."
        test_recipe:
          setup: ["Order fulfilled to REFUND_POSTED via pickup path (single NEW item 100)"]
          setup_api_calls:
            - { call: "POST /v1/subscription-plans", payload: { tier: CUSTOM, monthly_fee_cents: 100, included_returns: 100, overage_fee_cents: 10, pickup_enabled: true, boxless_enabled: true, oversize_enabled: true, free_returns: false, oversize_surcharge_cents: 0, pickup_fee_cents: 0 }, as: PlatformAdmin, captures: { plan_id: $.data.id } }
            - { call: "POST /v1/subscription-plans/${plan_id}/publish", payload: {}, as: PlatformAdmin }
            - { call: "POST /v1/merchant-accounts", payload: { legal_name: "M-TC", plan_id: "${plan_id}" }, as: PlatformAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /v1/merchant-accounts/${m_id}/billing-cycles", payload: { period_start: "2026-04-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /v1/shoppers", payload: { email: "stc@x.com", full_name: "S TC", postal_code: "30010" }, as: Shopper, captures: { sh_id: $.data.id } }
            - { call: "POST /v1/courier-zones", payload: { zone_code: "ZTC", window_capacity: 10 }, as: PlatformAdmin, captures: { zone_id: $.data.id } }
            - { call: "POST /v1/return-orders", payload: { shopper_id: "${sh_id}", merchant_id: "${m_id}", method: HOME_PICKUP, boxless: true, items: [ { sku: "TC", quantity: 1, unit_price_cents: 100, declared_condition: NEW, longest_side_cm: 10, weight_grams: 50 } ] }, as: Shopper, as_user_id: "${sh_id}", captures: { ro_id: $.data.id } }
            - { call: "POST /v1/pickup-appointments", payload: { return_order_id: "${ro_id}", zone_id: "${zone_id}", window_start: "2026-05-01T00:30:00Z", window_end: "2026-05-01T02:30:00Z" }, as: Shopper, as_user_id: "${sh_id}", captures: { ap: $.data.id } }
            - { call: "POST /v1/pickup-appointments/${ap}/start", payload: {}, as: PlatformAdmin }
            - { call: "POST /v1/pickup-appointments/${ap}/collect", payload: {}, as: PlatformAdmin }
            - { call: "POST /v1/return-orders/${ro_id}/receive", payload: {}, as: PlatformAdmin }
            - { call: "GET /v1/return-orders/${ro_id}/items", payload: {}, as: PlatformAdmin, captures: { it1: "$.data[0].id" } }
            - { call: "POST /v1/return-items/${it1}/inspect", payload: { condition: NEW }, as: PlatformAdmin }
          trigger:
            - { call: "POST /v1/return-orders/${ro_id}/cancel", payload: {}, as: Shopper, as_user_id: "${sh_id}", captures: { err: $.data.error_id } }
          assert: ["err == ERR_ALREADY_TERMINAL"]

      - name: seal_empty_tote_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.ConsolidationTote.FILLING_to_SEALED, "errors[ERR_TOTE_EMPTY]"]
        distinguishing_aspect: "Sealing a tote with manifest_units == 0 fails with ERR_TOTE_EMPTY."
        test_recipe:
          setup: ["Counter location; route; empty tote"]
          setup_api_calls:
            - { call: "POST /v1/dropoff-locations", payload: { name: "L-ES", kind: COUNTER, postal_code: "30011" }, as: PlatformAdmin, captures: { loc_id: $.data.id } }
            - { call: "POST /v1/dropoff-locations/${loc_id}/activate", payload: {}, as: PlatformAdmin }
            - { call: "POST /v1/carrier-routes", payload: { origin_location_id: "${loc_id}", destination_facility: "FAC-10", weight_capacity_grams: 100000 }, as: CarrierDispatcher, captures: { route_id: $.data.id } }
            - { call: "POST /v1/consolidation-totes", payload: { route_id: "${route_id}", location_id: "${loc_id}" }, as: LocationOperator, as_user_id: "${loc_id}", captures: { tote_id: $.data.id } }
          trigger:
            - { call: "POST /v1/consolidation-totes/${tote_id}/seal", payload: {}, as: LocationOperator, as_user_id: "${loc_id}", captures: { err: $.data.error_id } }
          assert: ["err == ERR_TOTE_EMPTY"]

      - name: item_double_inspect_rejected
        claim_type: invalid_transition
        grounds: [state_machines.ReturnItem, "errors[ERR_ITEM_ALREADY_INSPECTED]"]
        distinguishing_aspect: "Second inspect on an INSPECTED item fails with ERR_ITEM_ALREADY_INSPECTED; multi-item order keeps the order INSPECTING so the error is item-scoped, not order-state."
        test_recipe:
          setup: ["Order with two items at INSPECTING; first item already inspected"]
          setup_api_calls:
            - { call: "POST /v1/subscription-plans", payload: { tier: CUSTOM, monthly_fee_cents: 100, included_returns: 100, overage_fee_cents: 10, pickup_enabled: true, boxless_enabled: true, oversize_enabled: true, free_returns: false, oversize_surcharge_cents: 0, pickup_fee_cents: 0 }, as: PlatformAdmin, captures: { plan_id: $.data.id } }
            - { call: "POST /v1/subscription-plans/${plan_id}/publish", payload: {}, as: PlatformAdmin }
            - { call: "POST /v1/merchant-accounts", payload: { legal_name: "M-DI", plan_id: "${plan_id}" }, as: PlatformAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /v1/merchant-accounts/${m_id}/billing-cycles", payload: { period_start: "2026-04-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /v1/shoppers", payload: { email: "sdi@x.com", full_name: "S DI", postal_code: "30012" }, as: Shopper, captures: { sh_id: $.data.id } }
            - { call: "POST /v1/courier-zones", payload: { zone_code: "ZDI", window_capacity: 10 }, as: PlatformAdmin, captures: { zone_id: $.data.id } }
            - { call: "POST /v1/return-orders", payload: { shopper_id: "${sh_id}", merchant_id: "${m_id}", method: HOME_PICKUP, boxless: true, items: [ { sku: "D1", quantity: 1, unit_price_cents: 100, declared_condition: NEW, longest_side_cm: 10, weight_grams: 50 }, { sku: "D2", quantity: 1, unit_price_cents: 200, declared_condition: NEW, longest_side_cm: 10, weight_grams: 50 } ] }, as: Shopper, as_user_id: "${sh_id}", captures: { ro_id: $.data.id } }
            - { call: "POST /v1/pickup-appointments", payload: { return_order_id: "${ro_id}", zone_id: "${zone_id}", window_start: "2026-05-01T00:30:00Z", window_end: "2026-05-01T02:30:00Z" }, as: Shopper, as_user_id: "${sh_id}", captures: { ap: $.data.id } }
            - { call: "POST /v1/pickup-appointments/${ap}/start", payload: {}, as: PlatformAdmin }
            - { call: "POST /v1/pickup-appointments/${ap}/collect", payload: {}, as: PlatformAdmin }
            - { call: "POST /v1/return-orders/${ro_id}/receive", payload: {}, as: PlatformAdmin }
            - { call: "GET /v1/return-orders/${ro_id}/items", payload: {}, as: PlatformAdmin, captures: { it1: "$.data[0].id", it2: "$.data[1].id" } }
            - { call: "POST /v1/return-items/${it1}/inspect", payload: { condition: NEW }, as: PlatformAdmin }
          trigger:
            - { call: "POST /v1/return-items/${it1}/inspect", payload: { condition: DAMAGED }, as: PlatformAdmin, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_ITEM_ALREADY_INSPECTED"
            - "ReturnOrder.${ro_id}.status == INSPECTING (second item still PENDING)"

      - name: out_of_service_slot_rejects_reservation
        claim_type: precondition_enforcement
        grounds: [state_machines.LockerSlot, "errors[ERR_SLOT_OUT_OF_SERVICE]"]
        distinguishing_aspect: "A slot flipped OUT_OF_SERVICE rejects new reservations with ERR_SLOT_OUT_OF_SERVICE."
        test_recipe:
          setup: ["LOCKER location with XL slot marked OUT_OF_SERVICE; LOCKER_QR order"]
          setup_api_calls:
            - { call: "POST /v1/subscription-plans", payload: { tier: CUSTOM, monthly_fee_cents: 100, included_returns: 100, overage_fee_cents: 10, pickup_enabled: false, boxless_enabled: true, oversize_enabled: true, free_returns: false, oversize_surcharge_cents: 0, pickup_fee_cents: 0 }, as: PlatformAdmin, captures: { plan_id: $.data.id } }
            - { call: "POST /v1/subscription-plans/${plan_id}/publish", payload: {}, as: PlatformAdmin }
            - { call: "POST /v1/merchant-accounts", payload: { legal_name: "M-OS", plan_id: "${plan_id}" }, as: PlatformAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /v1/merchant-accounts/${m_id}/billing-cycles", payload: { period_start: "2026-04-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /v1/shoppers", payload: { email: "sos@x.com", full_name: "S OS", postal_code: "30013" }, as: Shopper, captures: { sh_id: $.data.id } }
            - { call: "POST /v1/dropoff-locations", payload: { name: "L-OS", kind: LOCKER, postal_code: "30014" }, as: PlatformAdmin, captures: { loc_id: $.data.id } }
            - { call: "POST /v1/dropoff-locations/${loc_id}/activate", payload: {}, as: PlatformAdmin }
            - { call: "POST /v1/dropoff-locations/${loc_id}/locker-slots", payload: { size_class: XL }, as: PlatformAdmin, captures: { slot_id: $.data.id } }
            - { call: "POST /v1/locker-slots/${slot_id}/out-of-service", payload: {}, as: LocationOperator, as_user_id: "${loc_id}" }
            - { call: "POST /v1/return-orders", payload: { shopper_id: "${sh_id}", merchant_id: "${m_id}", method: LOCKER_QR, items: [ { sku: "OS", quantity: 1, unit_price_cents: 100, declared_condition: NEW, longest_side_cm: 20, weight_grams: 100 } ] }, as: Shopper, as_user_id: "${sh_id}", captures: { ro_id: $.data.id } }
          trigger:
