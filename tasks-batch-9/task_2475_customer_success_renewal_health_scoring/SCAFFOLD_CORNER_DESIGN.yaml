          - concurrency_rules[remediation-commitment-create-stale-case]
          - validations[priority=10]
          - errors.ERR_STALE_ESCALATION_VERSION
        distinguishing_aspect: "Creating the first commitment bumps the EscalationCase version, so reusing the same expected_escalation_case_version for a second commitment returns ERR_STALE_ESCALATION_VERSION (412) until the case is re-read."
        test_recipe:
          setup:
            - "One ACTIVE HIGH_TOUCH Csm with capacity_units_total 40."
            - "One ENTERPRISE Account, arr_cents 30000000, health_tier RED."
            - "One ACTIVE SavePlay and one OPEN EscalationCase whose version was captured at creation."
            - "One RemediationCommitment of 400000 cents already created with that captured version."
          setup_api_calls:
            - call: "POST /csms"
              payload: { full_name: "Ada Lovelace", coverage_specialty: "HIGH_TOUCH", capacity_units_total: 40 }
              as: CsOpsAdmin
              captures: { csm_a_id: $.data.id }
            - call: "POST /accounts"
              payload: { name: "Northwind Traders", arr_cents: 30000000, segment_band: "ENTERPRISE", contract_start_date: "2026-01-01", contract_end_date: "2026-12-31" }
              as: CsOpsAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /save-plays"
              payload: { account_id: "${acct_id}", owner_csm_id: "${csm_a_id}", risk_code: "SUPPORT_ESCALATION", play_type: "TECHNICAL_REMEDIATION", window_start_date: "2026-08-05", window_end_date: "2026-08-20" }
              as: CsmUser
              as_user_id: "${csm_a_id}"
              captures: { sp_id: $.data.id }
            - call: "POST /save-plays/${sp_id}/transition"
              payload: { action: "ACTIVATE" }
              as: CsmUser
              as_user_id: "${csm_a_id}"
            - call: "POST /escalation-cases"
              payload: { account_id: "${acct_id}", save_play_id: "${sp_id}", severity: "HIGH", summary: "Two-part remediation" }
              as: CsmUser
              as_user_id: "${csm_a_id}"
              captures: { esc_id: $.data.id, esc_v1: $.data.version }
            - call: "POST /escalation-cases/${esc_id}/remediation-commitments"
              payload: { description: "First tranche", due_date: "2026-08-25", credit_cents: 400000, expected_escalation_case_version: "${esc_v1}" }
              as: CsExecutive
              as_user_id: "exec-1"
              captures: { rc1_id: $.data.id }
          trigger:
            - call: "POST /escalation-cases/${esc_id}/remediation-commitments"
              payload: { description: "Second tranche with a stale version", due_date: "2026-08-27", credit_cents: 300000, expected_escalation_case_version: "${esc_v1}" }
              as: CsExecutive
              as_user_id: "exec-1"
              captures: { err_id: $.data.error_id }
            - call: "GET /escalation-cases/${esc_id}"
              payload: {}
              as: CsExecutive
              as_user_id: "exec-1"
              captures: { esc_v2: $.data.version }
            - call: "POST /escalation-cases/${esc_id}/remediation-commitments"
              payload: { description: "Second tranche with the fresh version", due_date: "2026-08-27", credit_cents: 300000, expected_escalation_case_version: "${esc_v2}" }
              as: CsExecutive
              as_user_id: "exec-1"
              captures: { rc2_id: $.data.id }
          assert:
            - "The first trigger call returns HTTP 412 with data.error_id == \"ERR_STALE_ESCALATION_VERSION\"."
            - "GET /escalation-cases/${esc_id}/remediation-commitments returns exactly 1 item immediately after the rejected call."
            - "${esc_v2} is strictly greater than ${esc_v1}."
            - "The third trigger call returns HTTP 201: RemediationCommitment.${rc2_id}.state == \"PROPOSED\" and round_index == 1 and credit_cents == 300000."
            - "Account.${acct_id}.remediation_credit_outstanding_cents == 0 (both commitments are still PROPOSED)."

      - name: reference_call_cap_is_a_cumulative_threshold_at_exactly_two
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.reference_calls_cap_derivation
          - validations[priority=32]
          - errors.ERR_REFERENCE_CALL_CAP_REACHED
          - state_machines.AdvocacyEnrollment.ACTIVE_to_ACTIVE
        distinguishing_aspect: "An SMB account caps reference calls at 2: calls one and two succeed (reference_calls_used 1 then 2) and the third returns ERR_REFERENCE_CALL_CAP_REACHED (409) because the admission test used < cap is strict."
        test_recipe:
          setup:
            - "One ACTIVE DIGITAL Csm with capacity_units_total 5."
            - "One SMB Account, arr_cents 900000, term 2026-01-01..2026-12-31, with one USAGE_PERIOD signal of index 86.00 and one ACTIVE CXO economic buyer, so snapshot_health_score is 77.60 -> GREEN."
            - "Segmentation run: arr below the 5000000 low-touch floor and health_tier GREEN, so coverage_tier is DIGITAL."
            - "One COMMITTED CoverageAssignment of 1 load_unit, so coverage_posture is OPEN."
            - "One REFERENCE AdvocacyEnrollment driven NOMINATED -> APPROVED -> ACTIVE with reference_calls_cap 2 snapshotted from the SMB band."
          setup_api_calls:
            - call: "POST /csms"
              payload: { full_name: "Ravi Menon", coverage_specialty: "DIGITAL", capacity_units_total: 5 }
              as: CsOpsAdmin
              captures: { csm_d_id: $.data.id }
            - call: "POST /accounts"
              payload: { name: "Tiny Tools Co", arr_cents: 900000, segment_band: "SMB", contract_start_date: "2026-01-01", contract_end_date: "2026-12-31" }
              as: CsOpsAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/signals"
              payload: { signal_kind: "USAGE_PERIOD", period_end_date: "2026-07-31", weekly_active_users: 90, licensed_seats: 100, feature_depth_pct: 80.00 }
              as: CsmUser
              as_user_id: "${csm_d_id}"
            - call: "POST /accounts/${acct_id}/sponsor-contacts"
              payload: { full_name: "Grace Chen", seniority: "CXO", is_economic_buyer: true }
              as: CsmUser
              as_user_id: "${csm_d_id}"
            - call: "POST /accounts/${acct_id}/health-recompute"
              payload: {}
              as: CsOpsAdmin
            - call: "POST /accounts/${acct_id}/segmentation"
              payload: {}
              as: CsOpsAdmin
              captures: { acct_v_seg: $.data.version }
            - call: "POST /coverage-assignments"
              payload: { account_id: "${acct_id}", expected_account_version: "${acct_v_seg}", csm_id: "${csm_d_id}" }
              as: CsOpsAdmin
              captures: { ca1_id: $.data.id }
            - call: "POST /accounts/${acct_id}/advocacy-enrollments"
              payload: { program_type: "REFERENCE" }
              as: AdvocacyManager
              as_user_id: "adv-1"
              captures: { enr_id: $.data.id }
            - call: "POST /advocacy-enrollments/${enr_id}/transition"
              payload: { action: "APPROVE" }
              as: AdvocacyManager
              as_user_id: "adv-1"
            - call: "POST /advocacy-enrollments/${enr_id}/transition"
              payload: { action: "ACTIVATE" }
              as: AdvocacyManager
              as_user_id: "adv-1"
            - call: "POST /advocacy-enrollments/${enr_id}/transition"
              payload: { action: "LOG_REFERENCE_CALL" }
              as: AdvocacyManager
              as_user_id: "adv-1"
            - call: "POST /advocacy-enrollments/${enr_id}/transition"
              payload: { action: "LOG_REFERENCE_CALL" }
              as: AdvocacyManager
              as_user_id: "adv-1"
          trigger:
            - call: "POST /advocacy-enrollments/${enr_id}/transition"
              payload: { action: "LOG_REFERENCE_CALL" }
              as: AdvocacyManager
              as_user_id: "adv-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 409 and data.error_id == \"ERR_REFERENCE_CALL_CAP_REACHED\"."
            - "AdvocacyEnrollment.${enr_id}.reference_calls_used == 2 and reference_calls_cap == 2 and state == \"ACTIVE\"."
            - "AdvocacyEnrollment.${enr_id}.last_reference_call_at == \"2026-08-01T00:00:00Z\" (stamped by the second call, not the rejected third)."
            - "Account.${acct_id}.coverage_tier == \"DIGITAL\" and reference_calls_cap == 2."
            - "CoverageAssignment.${ca1_id}.load_units == 1 and Csm.${csm_d_id}.capacity_units_available == 4."

      - name: release_cascade_chain_corner
        claim_type: cascading_side_effects
        grounds:
          - state_machines.CoverageAssignment.COMMITTED_to_RELEASED
          - calculations.csm_capacity_conservation
        excluded_because:
          difficulty_instance: transitive_cascade / release_cascade_promotes_a_queued_assignment_four_links_deep
          rationale: "The multi-level chain (release -> capacity return -> queued promotion -> posture flip on two accounts) is verified end-to-end with per-link asserts by the named §1.8 instance."

      - name: renewal_amount_dual_variant_corner
        claim_type: dual_variant_calculation
        grounds:
          - calculations.renewal_forecast_amounts
        excluded_because:
          difficulty_instance: dual_variant_calc / renewal_amount_cs_bottom_up_variant_diverges_from_finance_top_down
          rationale: "Both money variants and the delta on the finance switch are asserted by the named §1.8 instance."

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: coverage_assignment_create_response_already_reflects_the_committed_state
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - state_machines.CoverageAssignment.QUEUED_to_COMMITTED
          - calculations.csm_capacity_conservation
        distinguishing_aspect: "The consistency model is immediate: the POST /coverage-assignments response body itself already shows state COMMITTED with committed_at stamped, and the very next reads show capacity_units_committed 19 and coverage_posture OPEN with no intermediate QUEUED observation."
        test_recipe:
          setup:
            - "One ACTIVE HIGH_TOUCH Csm with capacity_units_total 40."
            - "One ENTERPRISE Account with no signals (health_tier RED), segmented to HIGH_TOUCH."
          setup_api_calls:
            - call: "POST /csms"
              payload: { full_name: "Ada Lovelace", coverage_specialty: "HIGH_TOUCH", capacity_units_total: 40 }
              as: CsOpsAdmin
              captures: { csm_a_id: $.data.id }
            - call: "POST /accounts"
              payload: { name: "Northwind Traders", arr_cents: 30000000, segment_band: "ENTERPRISE", contract_start_date: "2026-01-01", contract_end_date: "2026-12-31" }
              as: CsOpsAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/segmentation"
              payload: {}
              as: CsOpsAdmin
              captures: { acct_v_seg: $.data.version }
          trigger:
            - call: "POST /coverage-assignments"
              payload: { account_id: "${acct_id}", expected_account_version: "${acct_v_seg}", csm_id: "${csm_a_id}" }
              as: CsOpsAdmin
              captures: { ca1_id: $.data.id }
            - call: "GET /csms/${csm_a_id}"
              payload: {}
              as: CsOpsAdmin
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: CsOpsAdmin
          assert:
            - "The create response body already carries state == \"COMMITTED\", load_units == 19 and committed_at == \"2026-08-01T00:00:00Z\" (no QUEUED intermediate is ever observable)."
            - "The immediately following GET /csms/${csm_a_id} shows capacity_units_committed == 19 and capacity_units_available == 21."
            - "The immediately following GET /accounts/${acct_id} shows assigned_csm_id == ${csm_a_id} and coverage_posture == \"OPEN\"."
            - "GET /coverage-assignments/${ca1_id} returns the same state and load_units as the create response."

