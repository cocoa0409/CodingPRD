            - "hop 2: Order.${order_d3b}.order_status == AWAITING_PET_PASSING_DECISION, caused by the shipment hop"
            - "hop 3: AutoshipPlan.${plan_d3b}.plan_status == COMPASSIONATE_CANCELED, caused by the parked order"
            - "Pet.${pet_d3b}.pet_status == PASSED and pet_lifecycle_state == PASSED while the review stays OPEN"
            - "CompassionateReview.${rev_d3b}.affected_shipment_id == ${ship_d3b} and review_status == OPEN"
            - "no refund is written yet: Order.${order_d3b}.refunded_amount_cents == 0 before the review is decided"

