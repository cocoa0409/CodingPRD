              captures: { e_id: $.data.id }
            - call: POST /labor-encounters/${e_id}/assign-bed
              payload: { bed_id: "${bed_ldr_1}" }
              as: ChargeNurse
              as_user_id: "${s_charge}"
            - call: GET /labor-encounters/${e_id}
              payload: {}
              as: ChargeNurse
