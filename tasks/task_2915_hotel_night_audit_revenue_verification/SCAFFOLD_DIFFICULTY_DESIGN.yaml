            - "GET /night-audit/accounting-periods/${period_aug_id} returns status == OPEN (not TIED_OUT and not TIE_OUT_FAILED), tie_out_attempt_count == 0 - a blocked precondition does not consume a retry - tie_out_variance_amount == null and audit_trail_retention_until_date == null."
            - "The same read returns subsystem_total_amount == 217.75, and GET /night-audit/business-dates/${bd_p1_id} still returns status == CLOSED rather than ARCHIVED."
            - "GET /night-audit/business-dates?accounting_period_id=${period_aug_id} returns both dates, confirming ${bd_p2_id} really is a child of the same period."
            - "After ${bd_p2_id} is itself driven to CLOSED (it has no folios, so its total_revenue_amount is 0.00), repeating the trigger with gl_control_total_amount 217.75 returns 200 with status == TIED_OUT, tie_out_variance_amount == 0.00, audit_trail_retention_until_date == 2033-08-31 (the last day of 2026-08 plus AUDIT_RETENTION_YEARS 7), and both business dates now ARCHIVED."
            - "An implementation that filters the sum to CLOSED dates without first refusing the open one succeeds on the trigger and fails this instance."

      - name: controller_tier_allowance_requires_active_matching_approval_document
        grounds: "§1.4 priority 56 ERR_ALLOWANCE_DOCUMENT_MISSING; §1.1 AuthorizationDocument.allowance_id and doc_type ALLOWANCE_APPROVAL; §1.5 POST /night-audit/authorization-documents ('a PENDING document satisfies no gate'); §1.3 calculation allowance_approval_tier."
        distinguishing_aspect: >-
          A conditional cross-entity dependency: the paperwork requirement exists only because
          requested_amount reached the controller threshold, and the required document must name
          this exact allowance in allowance_id rather than merely exist for the property. It also
          isolates the PENDING-versus-ACTIVE distinction, which no other instance here tests.
        test_recipe:
          setup: "Standard property (allowance_controller_threshold_amount 1000.00); business date 2026-08-01 in ROOM_POSTING; one CASH folio at rate 200.00 with room and tax posted; a 1000.00 RATE_ERROR allowance requested by FrontDeskAgent u_fd_1 with a supporting reference and submitted, so its frozen tier is Controller and no ALLOWANCE_APPROVAL document exists yet."
