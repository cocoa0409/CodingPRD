          Issuing a lot to the wrong precinct in an impossible quantity violates
          lot-matches-precinct-style (category business_referential, priority 90) and
          issue-quantity-within-receipt (category business_fiscal, priority 120) at once; the ladder
          requires ERR_LOT_NOT_FOR_PRECINCT (409). The recipe isolates both rules on the same lot -
          right precinct with an over-large quantity gives ERR_ISSUE_QUANTITY_EXCEEDS_RECEIPT, wrong
