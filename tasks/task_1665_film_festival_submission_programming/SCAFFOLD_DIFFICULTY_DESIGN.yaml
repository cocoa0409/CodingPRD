            - { call: "POST /festival/slate-entries/${eB}/respond", payload: { accept: true }, as: FILMMAKER, as_user_id: "${submB}" }
            - { call: "POST /festival/slate-entries/${eC}/respond", payload: { accept: true }, as: FILMMAKER, as_user_id: "${submC}" }
            - { call: "GET /festival/exhibition-agreements", payload: { submission_id: "${filmA}" }, as: FESTIVAL_DIRECTOR, captures: { agA: "$.data[0].id" } }
