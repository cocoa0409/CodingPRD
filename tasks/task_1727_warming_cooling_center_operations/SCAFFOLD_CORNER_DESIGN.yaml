              as: OutreachWorker
              as_user_id: "${out1}"
              captures: { disp: $.data.id }
            - { call: "POST /api/transport-dispatches/${disp}/assign", payload: { vehicle_id: "${veh}" }, as: TransportCoordinator }
            - call: "GET /api/stays?transport_dispatch_id=${disp}"
              as: EOCManager
              captures: { stay: "$.data[0].id" }
          trigger:
            - call: "POST /api/stays/${stay}/check-in"
              payload: {}
              as: IntakeStaff
              as_user_id: "${lead1}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_DISPATCH_NOT_ARRIVED"
            - "GuestStay.${stay}.status remains RESERVED"
      - name: checkout_of_reserved_stay_rejected
        claim_type: invalid_transition
        grounds: [state_machines.GuestStay]
        distinguishing_aspect: "check-out is defined only from CHECKED_IN; on a RESERVED stay it returns ERR_INVALID_STATE and the reservation (and its held bed) is untouched."
        test_recipe:
          setup:
            - "Episode ACTIVE; SiteActivation OPEN; dispatch ASSIGNED leaving one stay RESERVED"
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T08:00:00Z" }, as: EOCManager }
            - call: "POST /api/episodes"
              payload: { mode: "COOLING", threshold_f: 100.0, sustained_hours_required: 1, scheduled_end_at: "2026-08-12T00:00:00Z" }
              as: EOCManager
              captures: { ep: $.data.id }
            - { call: "POST /api/episodes/${ep}/weather-readings", payload: { observed_at: "2026-08-10T06:00:00Z", temp_f: 95.0, heat_index_f: 101.0 }, as: EOCManager }
            - { call: "POST /api/episodes/${ep}/weather-readings", payload: { observed_at: "2026-08-10T06:15:00Z", temp_f: 95.0, heat_index_f: 101.0 }, as: EOCManager }
            - { call: "POST /api/episodes/${ep}/weather-readings", payload: { observed_at: "2026-08-10T06:30:00Z", temp_f: 95.0, heat_index_f: 101.0 }, as: EOCManager }
            - { call: "POST /api/episodes/${ep}/weather-readings", payload: { observed_at: "2026-08-10T06:45:00Z", temp_f: 95.0, heat_index_f: 101.0 }, as: EOCManager }
            - { call: "POST /api/episodes/${ep}/weather-readings", payload: { observed_at: "2026-08-10T07:00:00Z", temp_f: 95.0, heat_index_f: 101.0 }, as: EOCManager }
            - call: "POST /api/sites"
              payload: { name: "Rec Center", address: "1 Main St", bed_capacity: 4, pet_capacity: 0, locker_capacity: 0 }
              as: EOCManager
              captures: { site: $.data.id }
            - call: "POST /api/episodes/${ep}/site-activations"
              payload: { site_id: "${site}" }
              as: EOCManager
              captures: { sa: $.data.id }
            - call: "POST /api/staff-members"
              payload: { full_name: "Lead One", skills: ["SITE_LEAD"] }
              as: EOCManager
              captures: { lead1: $.data.id }
            - call: "POST /api/staff-members"
              payload: { full_name: "Lead Two", skills: ["SITE_LEAD"] }
              as: EOCManager
              captures: { lead2: $.data.id }
            - call: "POST /api/staff-members"
              payload: { full_name: "Outreach One", skills: ["OUTREACH"] }
              as: EOCManager
