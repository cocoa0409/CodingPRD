          - errors.ERR_REVISION_EXCEEDS_CAP
          - calculations.rov_evidence_admissibility.constants.ROV_REVISION_CAP_BPS
          - endpoints.POST_rov_requests_id_appraiser_response
        distinguishing_aspect: "The revision cap is an inclusive <= on round_half_up basis points: 49000000 against a 40000000 opinion is 2250 bps and is refused, while 48000000 is exactly 2000 bps and is accepted -- so the boundary value itself is legal."
        test_recipe:
          setup:
            - "A clean appraisal in RULES_CLEARED with a routed ROV request carrying two admissible closed sales."
          setup_api_calls:
            - call: "POST /appraisal-desk/amcs"
              payload: { name: "Revision Cap AMC" }
              as: ChiefAppraiser
              as_user_id: "chief_user_1"
              captures: { amc1_id: $.data.id }
            - call: "POST /appraisal-desk/appraisers"
              payload: { full_name: "Alice Author", license_number: "CA-AL-C711", license_state: "CA" }
              as: ChiefAppraiser
              as_user_id: "chief_user_1"
              captures: { apr_a_id: $.data.id, apr_a_v: $.data.version }
            - call: "POST /appraisal-desk/panel-memberships"
              payload: { appraiser_id: "${apr_a_id}", amc_id: "${amc1_id}", coverage_state: "CA", tier: "GENERAL", expected_appraiser_version: "${apr_a_v}" }
