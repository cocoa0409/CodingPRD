  # ===========================================================================
  # Rule 5 — priority_pair_validation_conflict (different error-category pairs)
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: application_state_error_beats_safety_error
        grounds:
          - validations[priority=5]
          - validations[priority=7]
          - errors.ERR_POSTING_NOT_PUBLISHED
          - errors.ERR_EMPLOYER_NOT_APPROVED_FOR_UNIVERSITY
        distinguishing_aspect: "Category pair state (p5) vs business_safety (p7): the posting is PAUSED (state violation) AND the employer holds no approval row at the university at all (safety violation) — one request violates both, and the answer must be the p5 state error ERR_POSTING_NOT_PUBLISHED, not the safety error."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. University ACTIVE; Sam ENROLLED (CS, 2027, US_CITIZEN). Employer Globex APPROVED (ELEVATED 51) but NO EmployerApproval row exists at the university. Globex posting PUBLISHED then PAUSED."
          setup_api_calls:
            - *d_clock
            - *d_uni
            - *d_uni_active
            - *d_stu
            - *d_emp2
            - *d_emp2_verify
            - *d_emp2_screen
            - call: "POST /job-postings"
              payload: { employer_id: "${emp2_id}", title: "Globex Intern", position_type: "INTERNSHIP", required_majors: ["CS"], min_graduation_year: 2026, max_graduation_year: 2028, required_documents: ["RESUME"], application_deadline: "2026-12-01T00:00:00Z" }
              as: EmployerRecruiter
              as_user_id: "${emp2_id}"
              captures: { post2_id: $.data.id }
            - call: "POST /job-postings/${post2_id}/transition"
              payload: { to: "SUBMITTED" }
              as: EmployerRecruiter
              as_user_id: "${emp2_id}"
            - call: "POST /job-postings/${post2_id}/transition"
              payload: { to: "PUBLISHED" }
              as: PlatformAdmin
            - call: "POST /job-postings/${post2_id}/transition"
              payload: { to: "PAUSED" }
              as: EmployerRecruiter
              as_user_id: "${emp2_id}"
          trigger:
            - call: "POST /applications"
              payload: { student_id: "${stu_id}", job_posting_id: "${post2_id}", submitted_documents: [{ doc_type: "RESUME", file_uri: "s3://docs/sam-resume.pdf" }] }
              as: Student
              as_user_id: "${stu_id}"
              captures: { conflict_err: $.data.error_id }
          assert:
            - "response is 409 with conflict_err == ERR_POSTING_NOT_PUBLISHED"
            - "conflict_err != ERR_EMPLOYER_NOT_APPROVED_FOR_UNIVERSITY — the p5 state violation wins even though the p7 safety violation is equally true (no approval row exists)"
            - "GET /applications?job_posting_id=${post2_id} returns 0 rows"

      - name: outreach_visibility_error_beats_capacity_error
        grounds:
          - validations[priority=7]
          - validations[priority=10]
          - errors.ERR_PROFILE_NOT_VISIBLE
          - errors.ERR_MESSAGE_LIMIT_REACHED
          - calculations.messaging_allowance
        distinguishing_aspect: "Category pair business_safety (p7) vs business_capacity/fiscal (p10): the employer has already burned its ELEVATED daily allowance of 2 (capacity violation pending) AND the recipient's profile is HIDDEN (safety violation) — the answer must be the p7 safety error ERR_PROFILE_NOT_VISIBLE. A different category pair than application_state_error_beats_safety_error."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. University ACTIVE (cap 10); Sam PUBLIC; employer Globex APPROVED (ELEVATED, effective cap 2) with approval APPROVED; 2 messages already sent to Sam today (allowance exhausted). Recipient Helen exists with profile_visibility == HIDDEN."
          setup_api_calls:
            - *d_clock
            - *d_uni
            - *d_uni_active
            - *d_stu
            - &d_stu_hidden
              call: "POST /students"
              payload: { university_id: "${uni_id}", email: "helen@stateu.edu", full_name: "Helen Park", major: "CS", graduation_year: 2027, work_authorization: "US_CITIZEN", profile_visibility: "HIDDEN" }
              as: CareerCenterAdmin
              as_user_id: "${uni_id}"
              captures: { stu_h_id: $.data.id }
            - *d_emp2
            - *d_emp2_verify
            - *d_emp2_screen
            - *d_appr2
            - *d_appr2_ok
            - call: "POST /outreach-messages"
              payload: { employer_id: "${emp2_id}", student_id: "${stu_id}", body: "Opportunity 1" }
              as: EmployerRecruiter
              as_user_id: "${emp2_id}"
            - call: "POST /outreach-messages"
              payload: { employer_id: "${emp2_id}", student_id: "${stu_id}", body: "Opportunity 2" }
              as: EmployerRecruiter
              as_user_id: "${emp2_id}"
          trigger:
            - call: "POST /outreach-messages"
              payload: { employer_id: "${emp2_id}", student_id: "${stu_h_id}", body: "Opportunity 3" }
              as: EmployerRecruiter
              as_user_id: "${emp2_id}"
              captures: { conflict_err2: $.data.error_id }
          assert:
            - "response is 403 with conflict_err2 == ERR_PROFILE_NOT_VISIBLE"
            - "conflict_err2 != ERR_MESSAGE_LIMIT_REACHED — p7 safety beats p10 capacity even though sent_today == 2 == effective_cap"
            - "GET /outreach-messages?employer_id=${emp2_id} returns exactly 2 rows"

  # ===========================================================================
  # Rule 6 — boundary_precision_check (different metrics, different endpoints)
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: message_cap_boundary_at_exactly_effective_cap
        grounds:
          - calculations.messaging_allowance
          - errors.ERR_MESSAGE_LIMIT_REACHED
        distinguishing_aspect: "Count metric on POST /outreach-messages with a strict '<' comparison: LOW_RISK employer against a university whose cap is 3 gets effective_cap == min(3, floor(5*200/100)) == 3; sends at sent_today == 0, 1, 2 pass and the send at sent_today == 3 (exactly the cap) fails — '==' is on the rejected side."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. Second university (cap 3) ACTIVE; student Mia PUBLIC; employer State Lab LOW_RISK (auto score 10: email-domain match -25, .edu TLD -15), APPROVED with approval APPROVED at this university."
          setup_api_calls:
            - *d_clock
            - call: "POST /universities"
              payload: { name: "Tech Institute", primary_domain: "tech.edu", employer_daily_message_cap: 3 }
              as: PlatformAdmin
              captures: { uni2_id: $.data.id }
            - call: "POST /universities/${uni2_id}/transition"
              payload: { to: "ACTIVE" }
              as: PlatformAdmin
            - call: "POST /students"
              payload: { university_id: "${uni2_id}", email: "mia@tech.edu", full_name: "Mia Torres", major: "EE", graduation_year: 2027, work_authorization: "US_CITIZEN", profile_visibility: "PUBLIC_TO_APPROVED_EMPLOYERS" }
              as: CareerCenterAdmin
              as_user_id: "${uni2_id}"
              captures: { stu_m_id: $.data.id }
            - call: "POST /employers"
              payload: { company_name: "State Lab", website_domain: "lab.stateu.edu", contact_email: "hr@lab.stateu.edu" }
              as: Anonymous
              captures: { emp3_id: $.data.id, emp3_tok: $.data.domain_verification_token }
            - call: "POST /employers/${emp3_id}/verify-domain"
              payload: { verification_token: "${emp3_tok}" }
              as: EmployerRecruiter
              as_user_id: "${emp3_id}"
            - call: "POST /employers/${emp3_id}/screen"
              payload: { decision: "CLEAR", analyst_signal_adjustment: 0 }
              as: PlatformAdmin
              captures: { emp3_v: $.data.version }
            - call: "POST /employer-approvals"
              payload: { employer_id: "${emp3_id}", university_id: "${uni2_id}" }
              as: EmployerRecruiter
              as_user_id: "${emp3_id}"
              captures: { appr3_id: $.data.id }
            - call: "POST /employer-approvals/${appr3_id}/decide"
              payload: { decision: "APPROVE", expected_employer_version: "${emp3_v}" }
              as: CareerCenterAdmin
              as_user_id: "${uni2_id}"
          trigger:
            - call: "POST /outreach-messages"
              payload: { employer_id: "${emp3_id}", student_id: "${stu_m_id}", body: "m1" }
              as: EmployerRecruiter
              as_user_id: "${emp3_id}"
            - call: "POST /outreach-messages"
              payload: { employer_id: "${emp3_id}", student_id: "${stu_m_id}", body: "m2" }
              as: EmployerRecruiter
              as_user_id: "${emp3_id}"
            - call: "POST /outreach-messages"
              payload: { employer_id: "${emp3_id}", student_id: "${stu_m_id}", body: "m3" }
              as: EmployerRecruiter
              as_user_id: "${emp3_id}"
            - call: "POST /outreach-messages"
              payload: { employer_id: "${emp3_id}", student_id: "${stu_m_id}", body: "m4" }
              as: EmployerRecruiter
              as_user_id: "${emp3_id}"
              captures: { m4_err: $.data.error_id }
          assert:
            - "Employer.${emp3_id}.trust_tier == LOW_RISK (auto score 10 <= 20), so tier_cap == floor(5*200/100) == 10 and effective_cap == min(3, 10) == 3 — the university side of the min binds"
            - "m1, m2, m3 all return 201"
            - "m4 returns 429 with m4_err == ERR_MESSAGE_LIMIT_REACHED (sent_today == 3 is NOT < 3)"

      - name: application_deadline_inclusive_boundary
        grounds:
          - calculations.posting_expiry_projection
          - errors.ERR_APPLICATION_DEADLINE_PASSED
          - validations[priority=8]
        distinguishing_aspect: "Timestamp metric on POST /applications (a different metric and endpoint than the message-count boundary): the deadline is INCLUSIVE — an apply at current_utc == application_deadline succeeds, and one second later fails with ERR_APPLICATION_DEADLINE_PASSED while the posting read projects EXPIRED."
        test_recipe:
          setup:
            - "Base fixture but the posting's application_deadline is 2026-10-01T12:00:00Z. Everything (university, approval, employer) APPROVED/ACTIVE; the posting is PUBLISHED before the clock moves."
          setup_api_calls:
            - *d_clock
            - *d_uni
            - *d_uni_active
            - *d_stu
            - *d_emp
            - *d_emp_verify
            - *d_emp_screen
            - *d_appr
            - *d_appr_ok
            - call: "POST /job-postings"
              payload: { employer_id: "${emp_id}", title: "Deadline Intern", position_type: "INTERNSHIP", required_majors: ["CS"], min_graduation_year: 2026, max_graduation_year: 2028, required_documents: ["RESUME"], application_deadline: "2026-10-01T12:00:00Z" }
              as: EmployerRecruiter
              as_user_id: "${emp_id}"
              captures: { post3_id: $.data.id }
            - call: "POST /job-postings/${post3_id}/transition"
              payload: { to: "SUBMITTED" }
              as: EmployerRecruiter
              as_user_id: "${emp_id}"
            - call: "POST /job-postings/${post3_id}/transition"
              payload: { to: "PUBLISHED" }
              as: PlatformAdmin
            - *d_stu2
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /applications"
              payload: { student_id: "${stu_id}", job_posting_id: "${post3_id}", submitted_documents: [{ doc_type: "RESUME", file_uri: "s3://docs/sam-resume.pdf" }] }
              as: Student
              as_user_id: "${stu_id}"
              captures: { app_on_deadline: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T12:00:01Z" }
              as: PlatformAdmin
            - call: "POST /applications"
              payload: { student_id: "${stu2_id}", job_posting_id: "${post3_id}", submitted_documents: [{ doc_type: "RESUME", file_uri: "s3://docs/sally-resume.pdf" }] }
              as: Student
              as_user_id: "${stu2_id}"
              captures: { late_err: $.data.error_id }
            - call: "GET /job-postings/${post3_id}"
              payload: {}
              as: PlatformAdmin
          assert:
            - "apply at exactly the deadline returns 201: Application.${app_on_deadline}.status == SUBMITTED (inclusive bound)"
            - "apply one second after returns 409 with late_err == ERR_APPLICATION_DEADLINE_PASSED"
            - "late_err != ERR_POSTING_NOT_PUBLISHED — expiry is temporal (p8), not a stored-state change"
            - "GET /job-postings/${post3_id} after 12:00:01Z reports status == EXPIRED (read-time projection) while the stored status was never rewritten"

  # ===========================================================================
  # Rule 7 — cross_entity_state_dependency (different entity pairs)
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: application_requires_university_level_approval
        grounds:
          - state_machines.EmployerApproval
          - errors.ERR_EMPLOYER_NOT_APPROVED_FOR_UNIVERSITY
          - validations[priority=7]
        distinguishing_aspect: "Entity pair Application -> EmployerApproval: a PUBLISHED posting by an APPROVED employer still rejects applications from a university whose approval row is merely PENDING; flipping that OTHER entity's row to APPROVED (with no change to posting or student) makes the identical request succeed."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. University ACTIVE; Sam ENROLLED; Acme APPROVED; posting PUBLISHED; EmployerApproval exists but is still PENDING (never decided)."
          setup_api_calls:
            - *d_clock
            - *d_uni
            - *d_uni_active
            - *d_stu
            - *d_emp
            - *d_emp_verify
            - *d_emp_screen
            - *d_appr
            - *d_post
            - *d_post_submit
            - *d_post_publish
          trigger:
            - call: "POST /applications"
              payload: { student_id: "${stu_id}", job_posting_id: "${post_id}", submitted_documents: [{ doc_type: "RESUME", file_uri: "s3://docs/sam-resume.pdf" }] }
              as: Student
              as_user_id: "${stu_id}"
              captures: { pending_apply_err: $.data.error_id }
            - call: "POST /employer-approvals/${appr_id}/decide"
              payload: { decision: "APPROVE", expected_employer_version: "${emp_v}" }
              as: CareerCenterAdmin
              as_user_id: "${uni_id}"
            - call: "POST /applications"
              payload: { student_id: "${stu_id}", job_posting_id: "${post_id}", submitted_documents: [{ doc_type: "RESUME", file_uri: "s3://docs/sam-resume.pdf" }] }
              as: Student
              as_user_id: "${stu_id}"
              captures: { app_ok: $.data.id }
          assert:
            - "while the approval is PENDING: apply returns 403 with pending_apply_err == ERR_EMPLOYER_NOT_APPROVED_FOR_UNIVERSITY"
            - "after decide APPROVE (no change to posting or student): the identical apply returns 201 and Application.${app_ok}.status == SUBMITTED"
            - "GET /job-postings/${post_id} shows active_application_count == 1"

      - name: signup_requires_signable_event_state
        grounds:
          - state_machines.CareerEvent
          - state_machines.EventSignup
          - errors.ERR_EVENT_NOT_SIGNABLE
          - validations[priority=5]
        distinguishing_aspect: "Entity pair EventSignup -> CareerEvent (different pair than Application -> EmployerApproval): signup to a SCHEDULED session is rejected while the parent event is DRAFT, succeeds once the event is OPEN, and is rejected again after the event is CANCELLED — the signup's legal moves are gated by the parent event's state, never by the signup itself."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. University ACTIVE; Sam ENROLLED; event in DRAFT with one SCHEDULED capacity-10 session."
          setup_api_calls:
            - *d_clock
            - *d_uni
            - *d_uni_active
            - *d_stu
            - call: "POST /career-events"
              payload: { university_id: "${uni_id}", title: "Fall Fair", starts_at: "2026-10-10T09:00:00Z", ends_at: "2026-10-10T17:00:00Z" }
              as: CareerCenterAdmin
              as_user_id: "${uni_id}"
              captures: { ev2_id: $.data.id, ev2_v: $.data.version }
            - call: "POST /career-events/${ev2_id}/sessions"
              payload: { title: "Booth 1", mode: "IN_PERSON", room_id: "GYM-A", starts_at: "2026-10-10T10:00:00Z", ends_at: "2026-10-10T11:00:00Z", signup_deadline: "2026-10-09T23:59:59Z", capacity: 10, expected_career_event_version: "${ev2_v}" }
              as: CareerCenterAdmin
              as_user_id: "${uni_id}"
              captures: { ses2_id: $.data.id }
          trigger:
            - call: "POST /event-signups"
              payload: { event_session_id: "${ses2_id}", student_id: "${stu_id}" }
              as: Student
              as_user_id: "${stu_id}"
              captures: { draft_signup_err: $.data.error_id }
            - call: "POST /career-events/${ev2_id}/transition"
              payload: { to: "OPEN" }
              as: CareerCenterAdmin
              as_user_id: "${uni_id}"
            - call: "POST /event-signups"
              payload: { event_session_id: "${ses2_id}", student_id: "${stu_id}" }
              as: Student
              as_user_id: "${stu_id}"
              captures: { sg_ok: $.data.id }
            - call: "POST /career-events/${ev2_id}/transition"
              payload: { to: "CANCELLED" }
              as: CareerCenterAdmin
              as_user_id: "${uni_id}"
            - *d_stu2
            - call: "POST /event-signups"
              payload: { event_session_id: "${ses2_id}", student_id: "${stu2_id}" }
              as: Student
              as_user_id: "${stu2_id}"
              captures: { cancelled_signup_err: $.data.error_id }
          assert:
            - "while event is DRAFT: signup returns 409 with draft_signup_err == ERR_EVENT_NOT_SIGNABLE"
            - "after OPEN: the identical signup returns 201 and EventSignup.${sg_ok}.status == REGISTERED"
            - "after CANCELLED: signup returns 409 with cancelled_signup_err == ERR_EVENT_NOT_SIGNABLE"
            - "cancellation cascade: GET /career-events/${ev2_id}/sessions shows [0].status == CANCELLED and GET /event-signups/${sg_ok} shows CANCELLED"

  # ===========================================================================
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: room_conflict_half_open_interval_semantics
        grounds:
          - calculations.room_conflict_detection
          - errors.ERR_SESSION_ROOM_CONFLICT
        distinguishing_aspect: "Resource = (event, room_id) with HALF-OPEN interval semantics: back-to-back sessions (11:00 start against a 10:00-11:00 session) are allowed, a 10:30-11:30 session in the same room is rejected, and a VIRTUAL session at 10:30-11:30 is allowed because room_id null never conflicts."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. University ACTIVE; event (window 2026-10-10 09:00-17:00) in DRAFT (sessions may be added while DRAFT or OPEN). Sessions already added: A IN_PERSON GYM-A 10:00-11:00, B IN_PERSON GYM-A 11:00-12:00 (adjacent, allowed), D VIRTUAL 10:30-11:30 (no room)."
          setup_api_calls:
            - *d_clock
            - *d_uni
            - *d_uni_active
            - call: "POST /career-events"
              payload: { university_id: "${uni_id}", title: "Fall Fair", starts_at: "2026-10-10T09:00:00Z", ends_at: "2026-10-10T17:00:00Z" }
              as: CareerCenterAdmin
              as_user_id: "${uni_id}"
              captures: { ev3_id: $.data.id, ev3_v: $.data.version }
            - call: "POST /career-events/${ev3_id}/sessions"
              payload: { title: "A", mode: "IN_PERSON", room_id: "GYM-A", starts_at: "2026-10-10T10:00:00Z", ends_at: "2026-10-10T11:00:00Z", signup_deadline: "2026-10-09T23:59:59Z", capacity: 10, expected_career_event_version: "${ev3_v}" }
              as: CareerCenterAdmin
              as_user_id: "${uni_id}"
              captures: { sesA_id: $.data.id }
            - call: "GET /career-events/${ev3_id}"
              payload: {}
              as: CareerCenterAdmin
              as_user_id: "${uni_id}"
              captures: { ev3_v2: $.data.version }
            - call: "POST /career-events/${ev3_id}/sessions"
              payload: { title: "B", mode: "IN_PERSON", room_id: "GYM-A", starts_at: "2026-10-10T11:00:00Z", ends_at: "2026-10-10T12:00:00Z", signup_deadline: "2026-10-09T23:59:59Z", capacity: 10, expected_career_event_version: "${ev3_v2}" }
              as: CareerCenterAdmin
              as_user_id: "${uni_id}"
              captures: { sesB_id: $.data.id }
            - call: "GET /career-events/${ev3_id}"
              payload: {}
              as: CareerCenterAdmin
              as_user_id: "${uni_id}"
              captures: { ev3_v3: $.data.version }
            - call: "POST /career-events/${ev3_id}/sessions"
              payload: { title: "D", mode: "VIRTUAL", starts_at: "2026-10-10T10:30:00Z", ends_at: "2026-10-10T11:30:00Z", signup_deadline: "2026-10-09T23:59:59Z", capacity: 50, expected_career_event_version: "${ev3_v3}" }
              as: CareerCenterAdmin
              as_user_id: "${uni_id}"
              captures: { sesD_id: $.data.id }
            - call: "GET /career-events/${ev3_id}"
              payload: {}
              as: CareerCenterAdmin
              as_user_id: "${uni_id}"
              captures: { ev3_v4: $.data.version }
          trigger:
            - call: "POST /career-events/${ev3_id}/sessions"
              payload: { title: "C", mode: "IN_PERSON", room_id: "GYM-A", starts_at: "2026-10-10T10:30:00Z", ends_at: "2026-10-10T11:30:00Z", signup_deadline: "2026-10-09T23:59:59Z", capacity: 10, expected_career_event_version: "${ev3_v4}" }
              as: CareerCenterAdmin
              as_user_id: "${uni_id}"
              captures: { room_err: $.data.error_id }
          assert:
            - "session B was accepted (201): exact adjacency 11:00 == A.ends_at is NOT a conflict under half-open semantics"
            - "session D was accepted (201): VIRTUAL sessions have room_id null and never conflict"
            - "session C returns 409 with room_err == ERR_SESSION_ROOM_CONFLICT (10:30 < A.ends 11:00 and A.starts 10:00 < 11:30)"
            - "GET /career-events/${ev3_id}/sessions returns exactly 3 rows (A, B, D); C was not persisted"

      - name: interview_buffer_fifteen_minute_gap_semantics
        grounds:
          - calculations.interview_buffer_conflict
          - errors.ERR_INTERVIEW_SCHEDULE_CONFLICT
        distinguishing_aspect: "Resource = interviewer_email calendar with BUFFERED semantics (BUFFER_MINUTES 15) — the opposite adjacency rule from room_conflict_detection: a gap of exactly 15 minutes (11:15 start after a 10:00-11:00 interview) passes, while an 11:10 start (10-minute gap) is rejected. Different resource entity (Interview vs EventSession) and different interval semantics (buffered vs half-open)."
        test_recipe:
          setup:
            - "Base fixture; Sam's application advanced to INTERVIEWING. Interviewer int@acme.com already holds I1 10:00-11:00 and I2 11:15-12:00 (exactly-15-minute gap, accepted); a different interviewer holds 10:30-11:30 without conflict."
          setup_api_calls:
            - *d_clock
            - *d_uni
            - *d_uni_active
            - *d_stu
            - *d_emp
            - *d_emp_verify
            - *d_emp_screen
            - *d_appr
            - *d_appr_ok
            - *d_post
            - *d_post_submit
            - *d_post_publish
            - *d_apply
            - *d_app_ur
            - *d_app_iv
            - *d_iv1
            - call: "POST /applications/${app_id}/interviews"
              payload: { interviewer_email: "int@acme.com", mode: "VIRTUAL", starts_at: "2026-10-05T11:15:00Z", ends_at: "2026-10-05T12:00:00Z" }
              as: EmployerRecruiter
              as_user_id: "${emp_id}"
              captures: { iv2_id: $.data.id }
            - call: "POST /applications/${app_id}/interviews"
              payload: { interviewer_email: "other@acme.com", mode: "VIRTUAL", starts_at: "2026-10-05T10:30:00Z", ends_at: "2026-10-05T11:30:00Z" }
              as: EmployerRecruiter
              as_user_id: "${emp_id}"
              captures: { iv3_id: $.data.id }
          trigger:
            - call: "POST /applications/${app_id}/interviews"
              payload: { interviewer_email: "int@acme.com", mode: "VIRTUAL", starts_at: "2026-10-05T11:10:00Z", ends_at: "2026-10-05T12:30:00Z" }
              as: EmployerRecruiter
              as_user_id: "${emp_id}"
              captures: { buf_err: $.data.error_id }
          assert:
            - "I2 was accepted (201): 11:15 == I1.ends 11:00 + 15min — a gap of exactly BUFFER_MINUTES is not '<' the buffered end"
            - "the 10:30-11:30 interview under other@acme.com was accepted: the buffer is scoped per interviewer_email"
            - "I3 returns 409 with buf_err == ERR_INTERVIEW_SCHEDULE_CONFLICT (11:10 < 11:00 + 15min)"
            - "GET /applications/${app_id}/interviews returns exactly 3 rows, all SCHEDULED"

  # ===========================================================================
  # Rule 9 — compensating_invariant (different conserved quantities)
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: signup_cancel_promotion_conserves_occupied_seats
        grounds:
          - calculations.occupied_seats
          - calculations.waitlist_promotion_order
          - state_machines.EventSignup.REGISTERED_to_CANCELLED
          - state_machines.EventSignup.WAITLISTED_to_REGISTERED
        distinguishing_aspect: "Conserved quantity = EventSession.occupied_seats == count(REGISTERED signups): a student's cancel (forward action) and the auto-promotion it fires (compensating action) run as a pair, so the seat count is 1 before the pair and 1 after it — with the identity of the occupant changed (Sam out, Wei in, by created_at FIFO)."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. University ACTIVE; event OPEN with one capacity-1 session; Sam's signup REGISTERED (occupied_seats == 1); Wei's signup WAITLISTED behind her."
          setup_api_calls:
            - *d_clock
            - *d_uni
            - *d_uni_active
            - *d_stu
            - *d_event
            - *d_event_open
            - *d_sess1
            - *d_signup1
            - *d_stu3
            - *d_signup3
          trigger:
            - call: "POST /event-signups/${sg1_id}/transition"
              payload: { to: "CANCELLED" }
              as: Student
              as_user_id: "${stu_id}"
          assert:
            - "before the pair: GET /career-events/${ev_id}/sessions reported [0].occupied_seats == 1 with Sam REGISTERED and Wei WAITLISTED"
            - "after the pair: occupied_seats is STILL 1 — cancel (-1) and promote (+1) compensate exactly"
            - "GET /event-signups/${sg1_id} shows CANCELLED; GET /event-signups/${sg3_id} shows REGISTERED with promoted_from_waitlist == true and registered_at non-null"
            - "GET /event-signups?event_session_id=${ses_id}&status=REGISTERED returns exactly 1 row — the computed count and the stored field agree"

      - name: application_submit_withdraw_conserves_active_count
        grounds:
          - calculations.active_application_count
          - state_machines.Application
          - entities.JobPosting.fields.active_application_count
        distinguishing_aspect: "Conserved quantity = JobPosting.active_application_count == count(Applications in {SUBMITTED, UNDER_REVIEW, INTERVIEWING, OFFER_EXTENDED}): submit (forward) then withdraw (compensating) returns the count to its pre-submit value — a different conserved quantity (posting workload) than the session seat count."
        test_recipe:
          setup:
            - "Base fixture with posting PUBLISHED; active_application_count starts at 0. Sam and Sally each hold an application; Sam then withdraws."
          setup_api_calls:
            - *d_clock
            - *d_uni
            - *d_uni_active
            - *d_stu
            - *d_emp
            - *d_emp_verify
            - *d_emp_screen
            - *d_appr
            - *d_appr_ok
            - *d_post
            - *d_post_submit
            - *d_post_publish
            - *d_stu2
          trigger:
            - call: "POST /applications"
              payload: { student_id: "${stu_id}", job_posting_id: "${post_id}", submitted_documents: [{ doc_type: "RESUME", file_uri: "s3://docs/sam-resume.pdf" }] }
              as: Student
              as_user_id: "${stu_id}"
              captures: { inv_app1: $.data.id }
            - call: "POST /applications"
              payload: { student_id: "${stu2_id}", job_posting_id: "${post_id}", submitted_documents: [{ doc_type: "RESUME", file_uri: "s3://docs/sally-resume.pdf" }] }
              as: Student
              as_user_id: "${stu2_id}"
              captures: { inv_app2: $.data.id }
            - call: "POST /applications/${inv_app1}/transition"
              payload: { to: "WITHDRAWN" }
              as: Student
              as_user_id: "${stu_id}"
            - call: "GET /job-postings/${post_id}"
              payload: {}
              as: PlatformAdmin
              captures: { final_count: $.data.active_application_count }
          assert:
            - "after two submits: active_application_count was 2 (0 -> 1 -> 2, one increment per create)"
            - "after Sam's withdraw: final_count == 1 — the pair submit+withdraw on Application.${inv_app1} nets zero"
            - "GET /applications?job_posting_id=${post_id} shows 2 rows: ${inv_app1} WITHDRAWN and ${inv_app2} SUBMITTED, and exactly 1 row matches the active-status set, equal to the stored field"
