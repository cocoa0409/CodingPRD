  # ==========================================================================
  # Rule 9 — Compensating-action invariants across DIFFERENT conserved quantities
  # ==========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: principal_accounting_conserved_through_chargeoff
        grounds:
          - calculations.outstanding_principal
          - state_machines.Draw.OUTSTANDING_to_WRITTEN_OFF
          - entities.LedgerEntry.fields.amount_cents
          - entities.LedgerEntry.fields.entry_type
        distinguishing_aspect: |
          Conserved quantity = total principal accounted-for. Invariant pinned as
          sum(DRAW_PRINCIPAL ledger amounts) == sum(PRINCIPAL_REPAYMENT) + sum(WRITE_OFF) +
          CreditLine.outstanding_principal_cents. After drawing 200000 (never repaid) and
          charging off, the 200000 DRAW_PRINCIPAL equals 0 repaid + 200000 written-off + 0
          outstanding — no drift.
        test_recipe:
          setup:
            - "A DEFAULTED CreditLine (nsf 5) with one OUTSTANDING draw 200000 (fee 16000, unrepaid); DEFAULT declared by co_default."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
