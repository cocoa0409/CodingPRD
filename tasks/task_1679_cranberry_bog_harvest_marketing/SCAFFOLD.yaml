scenario: |
  Cranberry Bog Harvest & Marketing Cooperative (Ocean Spray grower co-op): bog acreage & yield estimate, wet vs dry harvest scheduling & water management, delivery to receiving station & quality (color/firmness) grading, cooperative pool pricing & retain, frost protection irrigation events, renovation & vine planting cycle, member delivery quota & over-quota handling, patronage distribution

domain_name: cranberry-coop
api_prefix: /coop

complexity_profile:
  primary_archetype: quota_allocation        # member delivery quota, over-quota pool tagging
  secondary_archetype: ledger_reconciliation # provisional advances vs final pool settlement, patronage
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - optimistic_concurrency
  entity_topology: flat                      # peer entities linked by FK references; no nested URL ownership
  state_machine_shape: cyclic                # Delivery grade-dispute loop; Pool close/reopen; Bog renovation cycle
  relationship_patterns:
    - one_to_many        # Member→Bog, Season→Pool, Pool→PatronageDistribution
    - cross_aggregate    # Delivery references Season, Bog, ReceivingStation, HarvestTicket, Pool
  role_model: peer_roles                     # GrowerMember / FieldOfficer / StationOperator / PoolManager / CoopAdmin
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (flat topology; FK annotations canonical)
# =============================================================================
entities:
  - name: Season
    parent: null
    common_fields: true
    fields:
      - { name: year, type: integer, source: input, description: "Marketing year; unique across all seasons", constraints: "unique" }
      - { name: harvest_window_start, type: string, source: input, description: "ISO date; first day of harvest window (inclusive)" }
      - { name: harvest_window_end, type: string, source: input, description: "ISO date; last day of harvest window (inclusive); must be >= harvest_window_start" }
      - { name: baseline_barrels_per_acre, type: number, source: input, description: "Season baseline yield per acre used by the acreage-baseline quota variant and as fallback for bogs without an approved estimate" }
      - { name: status, type: enum, source: system, description: "SETUP | OPEN | HARVEST_CLOSED | SETTLED" }
    # machine: linear with two system auto-transitions (bubble-up from Pool states)

  - name: Member
    parent: null
    common_fields: true
    fields:
      - { name: member_code, type: string, source: input, description: "Co-op member code; unique", constraints: "unique" }
      - { name: full_name, type: string, source: input, description: "Member display name" }
      - { name: status, type: enum, source: system, description: "PENDING | ACTIVE | SUSPENDED | WITHDRAWN" }

  - name: MemberQuota
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: system, description: "FK -> Member.id" }
      - { name: season_id, type: string, source: system, description: "FK -> Season.id" }
      - { name: base_quota_barrels, type: number, source: computed, description: "Official quota (approved-estimate variant, or override if set)" }
      - { name: baseline_quota_barrels, type: number, source: computed, description: "Acreage-baseline variant quota (informational dual variant)" }
      - { name: base_quota_override, type: number, source: input, default: null, description: "Manual override set via PATCH; when non-null it wins over recomputation" }
      - { name: delivered_barrels, type: number, source: computed, description: "Sum of quota_applied_barrels over the member's ACCEPTED, non-VOIDED deliveries this season" }
      - { name: over_quota_barrels, type: number, source: computed, description: "Sum of over_quota_barrels over the member's ACCEPTED, non-VOIDED deliveries this season" }
      - { name: posture, type: enum, source: computed, description: "WITHIN_QUOTA when delivered_barrels <= base_quota_barrels else OVER_QUOTA" }
      - { name: quota_locked, type: boolean, source: system, default: false, description: "Set true when the season reaches HARVEST_CLOSED; blocks PATCH" }

  - name: Bog
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: system, description: "FK -> Member.id; owning grower (from X-User-ID for GrowerMember callers, from member_id input for CoopAdmin)" }
      - { name: name, type: string, source: input, description: "Bog name" }
      - { name: acres, type: number, source: input, description: "Planted acres; must be > 0" }
      - { name: variety, type: enum, source: input, description: "STEVENS | BEN_LEAR | MULICA_QUEEN | EARLY_BLACK" }
      - { name: sprinkler_demand_gpm, type: integer, source: input, description: "Frost-protection sprinkler draw in gallons per minute; must be > 0" }
      - { name: frost_damage_threshold_c, type: number, source: input, default: -2.0, description: "Actual temperature at or below this value during a completed frost event flags vine damage" }
      - { name: status, type: enum, source: system, description: "ACTIVE | RENOVATION_PLANNED | UNDER_RENOVATION | REPLANTED" }

  - name: YieldEstimate
    parent: null
    common_fields: true
    fields:
      - { name: bog_id, type: string, source: input, description: "FK -> Bog.id" }
      - { name: season_id, type: string, source: input, description: "FK -> Season.id" }
      - { name: member_id, type: string, source: system, description: "FK -> Member.id; copied from Bog.member_id at creation" }
      - { name: estimated_barrels, type: number, source: input, description: "Grower-declared expected barrels; must be > 0" }
      - { name: revision_count, type: integer, source: system, default: 0, description: "Increments on every revise transition" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | APPROVED | FLAGGED" }
      # uniqueness: at most one YieldEstimate per (bog_id, season_id)

  - name: ReceivingStation
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Station name" }
      - { name: daily_capacity_barrels, type: integer, source: input, description: "Aggregate intake capacity per calendar day across all scheduled+received deliveries; must be > 0" }

  - name: HarvestTicket
    parent: null
    common_fields: true
    fields:
      - { name: bog_id, type: string, source: input, description: "FK -> Bog.id" }
      - { name: season_id, type: string, source: input, description: "FK -> Season.id" }
      - { name: member_id, type: string, source: system, description: "FK -> Member.id; copied from Bog.member_id at creation" }
      - { name: method, type: enum, source: input, description: "WET | DRY — WET floods the bog from FLOOD_LEAD_HOURS before window_start until window_end" }
      - { name: window_start, type: datetime, source: input, description: "Harvest window start (UTC, half-open interval start)" }
      - { name: window_end, type: datetime, source: input, description: "Harvest window end (UTC, exclusive); must be > window_start" }
      - { name: status, type: enum, source: system, description: "REQUESTED | APPROVED | COMPLETED | CANCELLED | EXPIRED" }

  - name: FrostEvent
    parent: null
    common_fields: true
    fields:
      - { name: bog_id, type: string, source: input, description: "FK -> Bog.id" }
      - { name: season_id, type: string, source: input, description: "FK -> Season.id; the marketing season whose crop this event protects (drives the damage cascade target)" }
      - { name: window_start, type: datetime, source: input, description: "Sprinkler protection window start (UTC)" }
      - { name: window_end, type: datetime, source: input, description: "Sprinkler protection window end (UTC); must be > window_start" }
      - { name: forecast_min_temp_c, type: number, source: input, description: "Forecast minimum temperature driving the event" }
      - { name: actual_min_temp_c, type: number, source: input, default: null, description: "Observed minimum temperature; required input on the complete transition" }
      - { name: damage_flag, type: boolean, source: computed, default: false, description: "True when actual_min_temp_c <= bog.frost_damage_threshold_c at completion" }
      - { name: status, type: enum, source: system, description: "DECLARED | ACTIVE | COMPLETED | CANCELLED" }

  - name: Pool
    parent: null
    common_fields: true
    fields:
      - { name: season_id, type: string, source: input, description: "FK -> Season.id" }
      - { name: code, type: enum, source: input, description: "MAIN | OVER_QUOTA; unique per season", constraints: "unique per (season_id, code)" }
      - { name: provisional_advance_rate_per_barrel, type: number, source: input, description: "Advance rate (currency per weighted barrel) paid at delivery acceptance; mutable while OPEN via PATCH" }
      - { name: retain_pct, type: number, source: input, description: "Fraction of gross settlement withheld as co-op retain (0 <= p <= 1)" }
      - { name: status, type: enum, source: system, description: "OPEN | CLOSED | SETTLED" }
      - { name: accepted_net_barrels, type: number, source: computed, default: 0, description: "Sum of net_barrels over ACCEPTED deliveries tagged to this pool" }
      - { name: weighted_barrels_total, type: number, source: computed, default: 0, description: "Sum of weighted_barrels over ACCEPTED deliveries tagged to this pool" }
      - { name: advances_outstanding, type: number, source: computed, default: 0, description: "Sum of advance_amount over ACCEPTED, non-VOIDED deliveries tagged to this pool" }
      - { name: realized_revenue, type: number, source: input, default: null, description: "Pool realized revenue declared at settle" }
      - { name: operating_costs, type: number, source: input, default: null, description: "Pool operating costs declared at settle" }
      - { name: final_rate_per_weighted_barrel, type: number, source: computed, default: null, description: "round4((realized_revenue - operating_costs) / weighted_barrels_total) at settle" }
      - { name: coop_equity_residual, type: number, source: computed, default: null, description: "(realized_revenue - operating_costs) - sum(distribution gross_amount); rounding residual retained by the co-op" }

  - name: Delivery
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: system, description: "FK -> Member.id; grower who delivered (X-User-ID for GrowerMember callers)" }
      - { name: season_id, type: string, source: input, description: "FK -> Season.id" }
      - { name: bog_id, type: string, source: input, description: "FK -> Bog.id" }
      - { name: receiving_station_id, type: string, source: input, description: "FK -> ReceivingStation.id" }
      - { name: harvest_ticket_id, type: string, source: input, default: null, description: "FK -> HarvestTicket.id; optional link to the authorizing harvest ticket" }
      - { name: scheduled_date, type: string, source: input, description: "ISO date of the station appointment; must fall within the season harvest window" }
      - { name: expected_barrels, type: number, source: input, description: "Declared barrels for station capacity planning; must be > 0" }
      - { name: gross_barrels, type: number, source: input, default: null, description: "Scale weight in barrels at receiving" }
      - { name: tare_barrels, type: number, source: input, default: null, description: "Tare deduction in barrels at receiving; 0 <= tare <= gross" }
      - { name: net_barrels, type: number, source: computed, default: null, description: "round2(gross_barrels - tare_barrels) computed at receive" }
      - { name: color_score, type: number, source: input, default: null, description: "Colorimeter score 0..10 recorded at grading" }
      - { name: firmness_score, type: number, source: input, default: null, description: "Firmness score 0..10 recorded at grading" }
      - { name: foreign_matter_pct, type: number, source: input, default: null, description: "Foreign matter percentage recorded at grading" }
      - { name: grade, type: enum, source: computed, default: null, description: "A | B | C | REJECT computed from color/firmness/foreign-matter tiers" }
      - { name: premium_multiplier, type: number, source: computed, default: null, description: "1.10 for A, 1.00 for B, 0.90 for C, 0 for REJECT" }
      - { name: weighted_barrels, type: number, source: computed, default: null, description: "round2(net_barrels * premium_multiplier)" }
      - { name: quota_applied_barrels, type: number, source: computed, default: null, description: "Barrels credited against member quota at acceptance" }
      - { name: over_quota_barrels, type: number, source: computed, default: null, description: "Barrels above quota at acceptance, tagged to the OVER_QUOTA pool" }
      - { name: main_pool_id, type: string, source: system, default: null, description: "FK -> Pool.id; season's OPEN MAIN pool tagged at acceptance" }
      - { name: over_quota_pool_id, type: string, source: system, default: null, description: "FK -> Pool.id; season's OPEN OVER_QUOTA pool tagged at acceptance when over_quota_barrels > 0" }
      - { name: advance_amount, type: number, source: computed, default: null, description: "Provisional advance recorded at acceptance: round2(weighted_barrels * pool.provisional_advance_rate_per_barrel) per tagged pool portion" }
      - { name: dispute_count, type: integer, source: system, default: 0, description: "Number of grade disputes raised" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | RECEIVED | GRADED | DISPUTED | ACCEPTED | REJECTED | VOIDED" }

  - name: PatronageDistribution
    parent: null
    common_fields: true
    fields:
      - { name: pool_id, type: string, source: system, description: "FK -> Pool.id; set at pool settle" }
      - { name: member_id, type: string, source: system, description: "FK -> Member.id" }
      - { name: weighted_barrels, type: number, source: computed, description: "Member's weighted barrels in this pool at settle" }
      - { name: advance_paid, type: number, source: computed, description: "Sum of advance_amount over the member's ACCEPTED, non-VOIDED deliveries tagged to this pool" }
      - { name: gross_amount, type: number, source: computed, description: "round2(weighted_barrels * pool.final_rate_per_weighted_barrel)" }
      - { name: retain_amount, type: number, source: computed, description: "round2(gross_amount * pool.retain_pct)" }
      - { name: cash_amount, type: number, source: computed, description: "gross_amount - retain_amount - advance_paid (may be negative = amount due back)" }
      - { name: status, type: enum, source: system, description: "COMPUTED | APPROVED | PAID" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Season
    initial_state: SETUP
    terminal_states: [SETTLED]
    transitions:
      - from: SETUP
        to: OPEN
        trigger: "POST /coop/seasons/{id}/open"
        actor: CoopAdmin
        preconditions:
          - "at least one Member with status == ACTIVE exists"
        side_effects:
          - "create one MemberQuota per ACTIVE member for this season via calculation quota_base_barrels (approved_estimate variant for base_quota_barrels, acreage_baseline variant for baseline_quota_barrels)"
      - from: OPEN
        to: HARVEST_CLOSED
        trigger: "system (automatic when every Pool of the season is in {CLOSED, SETTLED} and at least one Pool exists)"
        actor: system
        preconditions: []
        side_effects:
          - "set quota_locked = true on every MemberQuota of this season (increments MemberQuota.version by 1 each)"
      - from: HARVEST_CLOSED
        to: OPEN
        trigger: "system (automatic when a Pool of the season transitions CLOSED -> OPEN)"
        actor: system
        preconditions: []
        side_effects:
          - "clear quota_locked on every MemberQuota of this season (increments MemberQuota.version by 1 each)"
        note: "Reopen compensation: keeps the season consistent while a pool cycles back to OPEN"
      - from: HARVEST_CLOSED
        to: SETTLED
        trigger: "system (automatic when every Pool of the season is SETTLED)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Member
    initial_state: PENDING
    terminal_states: [WITHDRAWN]
    transitions:
      - { from: PENDING, to: ACTIVE, trigger: "POST /coop/members/{id}/transition {to: ACTIVE}", actor: CoopAdmin, preconditions: [], side_effects: [] }
      - { from: ACTIVE, to: SUSPENDED, trigger: "POST /coop/members/{id}/transition {to: SUSPENDED}", actor: CoopAdmin, preconditions: [], side_effects: [] }
      - { from: SUSPENDED, to: ACTIVE, trigger: "POST /coop/members/{id}/transition {to: ACTIVE}", actor: CoopAdmin, preconditions: [], side_effects: [] }
      - from: ACTIVE
        to: WITHDRAWN
        trigger: "POST /coop/members/{id}/transition {to: WITHDRAWN}"
        actor: CoopAdmin
        preconditions:
          - "member has no Delivery with status IN {SCHEDULED, RECEIVED, GRADED, DISPUTED}"
        side_effects: []

  - entity: Bog
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - { from: ACTIVE, to: RENOVATION_PLANNED, trigger: "POST /coop/bogs/{id}/transition {to: RENOVATION_PLANNED}", actor: GrowerMember, preconditions: ["caller owns the bog (or FieldOfficer)"], side_effects: [] }
      - { from: RENOVATION_PLANNED, to: ACTIVE, trigger: "POST /coop/bogs/{id}/transition {to: ACTIVE} (cancel renovation)", actor: GrowerMember, preconditions: ["caller owns the bog (or FieldOfficer)"], side_effects: [] }
      - from: RENOVATION_PLANNED
        to: UNDER_RENOVATION
        trigger: "POST /coop/bogs/{id}/transition {to: UNDER_RENOVATION}"
        actor: FieldOfficer
        preconditions: []
        side_effects:
          - "recompute MemberQuota for (bog.member_id, each non-locked season quota): bog leaves ACTIVE so it drops out of both quota variants"
      - from: UNDER_RENOVATION
        to: REPLANTED
        trigger: "POST /coop/bogs/{id}/transition {to: REPLANTED}"
        actor: FieldOfficer
        preconditions: []
        side_effects: []
      - from: REPLANTED
        to: ACTIVE
        trigger: "POST /coop/bogs/{id}/transition {to: ACTIVE} (certify vines mature)"
        actor: FieldOfficer
        preconditions: []
        side_effects:
          - "recompute MemberQuota: bog re-enters the quota input set"

  - entity: YieldEstimate
    initial_state: SUBMITTED
    terminal_states: []
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /coop/yield-estimates/{id}/transition {to: APPROVED}"
        actor: FieldOfficer
        preconditions: ["bog.status == ACTIVE"]
        side_effects: ["recompute MemberQuota (approved-estimate variant now includes this estimate)"]
      - from: SUBMITTED
        to: FLAGGED
        trigger: "POST /coop/yield-estimates/{id}/transition {to: FLAGGED}"
        actor: FieldOfficer
        preconditions: []
        side_effects: ["recompute MemberQuota (estimate excluded while FLAGGED)"]
      - from: FLAGGED
        to: SUBMITTED
        trigger: "POST /coop/yield-estimates/{id}/transition {to: SUBMITTED, revised_estimated_barrels}"
        actor: GrowerMember
        preconditions: ["caller owns Bog.member_id"]
        side_effects: ["estimated_barrels := revised_estimated_barrels", "revision_count += 1"]
      - from: APPROVED
        to: FLAGGED
        trigger: "system (automatic when a FrostEvent on the same bog completes with damage_flag == true)"
        actor: system
        preconditions: []
        side_effects: ["recompute MemberQuota (estimate excluded while FLAGGED)"]

  - entity: HarvestTicket
    initial_state: REQUESTED
    terminal_states: [COMPLETED, CANCELLED, EXPIRED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /coop/harvest-tickets/{id}/transition {to: APPROVED}"
        actor: FieldOfficer
        preconditions:
          - "bog.status == ACTIVE (ERR_BOG_NOT_ACTIVE)"
          - "no overlap with another ticket on the same bog in status IN {REQUESTED, APPROVED} (half-open windows; re-checked at approval)"
        side_effects: []
      - { from: APPROVED, to: COMPLETED, trigger: "POST /coop/harvest-tickets/{id}/transition {to: COMPLETED}", actor: FieldOfficer, preconditions: [], side_effects: [] }
      - { from: REQUESTED, to: CANCELLED, trigger: "POST /coop/harvest-tickets/{id}/transition {to: CANCELLED}", actor: GrowerMember, preconditions: ["caller owns the ticket's bog (or FieldOfficer)"], side_effects: [] }
      - { from: APPROVED, to: CANCELLED, trigger: "POST /coop/harvest-tickets/{id}/transition {to: CANCELLED}", actor: GrowerMember, preconditions: ["caller owns the ticket's bog (or FieldOfficer)"], side_effects: [] }
      - from: REQUESTED
        to: EXPIRED
        trigger: "system (automatic during POST /coop/_clock/set_current_utc sweep when window_start < current clock)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: FrostEvent
    initial_state: DECLARED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - { from: DECLARED, to: ACTIVE, trigger: "POST /coop/frost-events/{id}/transition {to: ACTIVE}", actor: FieldOfficer, preconditions: [], side_effects: [] }
      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /coop/frost-events/{id}/transition {to: COMPLETED, actual_min_temp_c}"
        actor: FieldOfficer
        preconditions: ["actual_min_temp_c is provided"]
        side_effects:
          - "damage_flag := (actual_min_temp_c <= bog.frost_damage_threshold_c)"
          - "if damage_flag: the YieldEstimate for (bog_id, event.season_id) with status == APPROVED, if one exists, transitions APPROVED -> FLAGGED, which itself triggers a MemberQuota recompute, which itself may flip MemberQuota.posture to OVER_QUOTA"
      - { from: DECLARED, to: CANCELLED, trigger: "POST /coop/frost-events/{id}/transition {to: CANCELLED}", actor: FieldOfficer, preconditions: [], side_effects: [] }
      - { from: ACTIVE, to: CANCELLED, trigger: "POST /coop/frost-events/{id}/transition {to: CANCELLED}", actor: FieldOfficer, preconditions: [], side_effects: [] }

  - entity: Delivery
    initial_state: SCHEDULED
    terminal_states: [REJECTED, VOIDED]
    transitions:
      - from: SCHEDULED
        to: RECEIVED
        trigger: "POST /coop/deliveries/{id}/receive"
        actor: StationOperator
        preconditions:
          - "delivery.receiving_station_id == X-User-ID (ERR_FORBIDDEN)"
          - "tare_barrels <= gross_barrels (ERR_TARE_EXCEEDS_GROSS)"
        side_effects:
          - "net_barrels := round2(gross_barrels - tare_barrels)"
      - from: RECEIVED
        to: GRADED
        trigger: "POST /coop/deliveries/{id}/grade (computed grade IN {A, B, C})"
        actor: StationOperator
        preconditions: ["delivery.receiving_station_id == X-User-ID"]
        side_effects: ["grade, premium_multiplier, weighted_barrels computed via delivery_grade_assignment"]
      - from: RECEIVED
        to: REJECTED
        trigger: "POST /coop/deliveries/{id}/grade (computed grade == REJECT — automatic branch of the same call)"
        actor: StationOperator
        preconditions: ["delivery.receiving_station_id == X-User-ID"]
        side_effects: ["grade := REJECT, premium_multiplier := 0, weighted_barrels := 0"]
      - from: DISPUTED
        to: GRADED
        trigger: "POST /coop/deliveries/{id}/grade (re-grade with new scores; computed grade IN {A, B, C})"
        actor: StationOperator
        preconditions: ["delivery.receiving_station_id == X-User-ID"]
        side_effects: ["scores and grade replaced; grade, premium_multiplier, weighted_barrels recomputed"]
      - from: DISPUTED
        to: REJECTED
        trigger: "POST /coop/deliveries/{id}/grade (re-grade computes REJECT)"
        actor: StationOperator
        preconditions: ["delivery.receiving_station_id == X-User-ID"]
        side_effects: ["grade := REJECT, premium_multiplier := 0, weighted_barrels := 0"]
      - from: GRADED
        to: ACCEPTED
        trigger: "POST /coop/deliveries/{id}/accept"
        actor: PoolManager
        preconditions:
          - "season.status == OPEN (ERR_SEASON_NOT_OPEN)"
          - "season's MAIN pool with status == OPEN exists (ERR_POOL_NOT_OPEN)"
          - "if net_barrels > remaining quota: season's OVER_QUOTA pool with status == OPEN exists (ERR_OVER_QUOTA_POOL_UNAVAILABLE)"
        side_effects:
          - "over_quota_split: quota_applied_barrels / over_quota_barrels computed"
          - "tag main_pool_id := season MAIN pool; if over_quota_barrels > 0 tag over_quota_pool_id := season OVER_QUOTA pool"
          - "advance_amount := round2(quota-weighted * MAIN rate) + round2(over-weighted * OVER_QUOTA rate) where weighted portions split pro-rata by barrels"
          - "MemberQuota.delivered_barrels += quota_applied_barrels; MemberQuota.over_quota_barrels += over_quota_barrels; posture recomputed"
          - "MAIN pool accepted_net_barrels/weighted_barrels_total/advances_outstanding increased by the in-quota portion; OVER_QUOTA pool likewise for the over-quota portion (each tagged pool mutation bumps that pool's version)"
      - from: GRADED
        to: DISPUTED
        trigger: "POST /coop/deliveries/{id}/dispute"
        actor: GrowerMember
        preconditions: ["delivery.member_id == X-User-ID (ERR_FORBIDDEN)"]
        side_effects: ["dispute_count += 1"]
      - from: ACCEPTED
        to: VOIDED
        trigger: "POST /coop/deliveries/{id}/void"
        actor: PoolManager
        preconditions:
          - "every tagged pool (main_pool_id, over_quota_pool_id) has status == OPEN (ERR_POOL_NOT_OPEN)"
        side_effects:
          - "compensation: MemberQuota.delivered_barrels -= quota_applied_barrels; over_quota_barrels -= delivery.over_quota_barrels; posture recomputed"
          - "compensation: each tagged pool's accepted_net_barrels, weighted_barrels_total, advances_outstanding reduced by exactly this delivery's recorded contribution (pool version bumps)"

  - entity: Pool
    initial_state: OPEN
    terminal_states: [SETTLED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /coop/pools/{id}/transition {to: CLOSED}"
        actor: PoolManager
        preconditions:
          - "no Delivery of this pool's season with status IN {RECEIVED, GRADED, DISPUTED} (ERR_POOL_HAS_OPEN_DELIVERIES)"
        side_effects:
          - "if every Pool of the season is now in {CLOSED, SETTLED}: Season auto-transitions OPEN -> HARVEST_CLOSED, which locks all MemberQuota of the season"
      - from: CLOSED
        to: OPEN
        trigger: "POST /coop/pools/{id}/transition {to: OPEN} (reopen for late adjustments)"
        actor: PoolManager
        preconditions:
          - "season.status IN {OPEN, HARVEST_CLOSED} (ERR_SEASON_NOT_OPEN when season is SETTLED)"
        side_effects:
          - "if season.status == HARVEST_CLOSED: Season reverts HARVEST_CLOSED -> OPEN and MemberQuota.quota_locked cleared (cycle compensation)"
      - from: CLOSED
        to: SETTLED
        trigger: "POST /coop/pools/{id}/settle"
        actor: PoolManager
        preconditions:
          - "season.status == HARVEST_CLOSED (ERR_SEASON_NOT_OPEN)"
          - "realized_revenue >= operating_costs >= 0 (ERR_SETTLEMENT_INPUT_INVALID)"
          - "if weighted_barrels_total == 0 then realized_revenue == 0 and operating_costs == 0 (ERR_SETTLEMENT_INPUT_INVALID)"
          - "expected_pool_version matches pool.version (ERR_STALE_VERSION)"
        side_effects:
          - "pool_settlement_pricing computes final_rate_per_weighted_barrel and coop_equity_residual"
          - "create one PatronageDistribution (status COMPUTED) per member with weighted_barrels > 0 in this pool"
          - "if every Pool of the season is now SETTLED: Season auto-transitions HARVEST_CLOSED -> SETTLED"

  - entity: PatronageDistribution
    initial_state: COMPUTED
    terminal_states: [PAID]
    transitions:
      - { from: COMPUTED, to: APPROVED, trigger: "POST /coop/distributions/{id}/transition {to: APPROVED}", actor: PoolManager, preconditions: [], side_effects: [] }
      - { from: APPROVED, to: PAID, trigger: "POST /coop/distributions/{id}/transition {to: PAID}", actor: PoolManager, preconditions: [], side_effects: [] }

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: pool-rate-update-stale-version
    parent_entity: Pool
    write_endpoint: "PATCH /coop/pools/{id}"
    occ_field: expected_pool_version
    description: |
      Updating a Pool's provisional advance rate with an expected_pool_version
      that does not match the pool's current version is rejected. This captures
      the case where another writer has just adjusted the rate (a legitimate,
      superseding announcement) so the current writer's view of the pool is
      stale. Rate changes never retroactively alter advance_amount values
      already recorded on ACCEPTED deliveries.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: quota-adjust-stale-version
    parent_entity: MemberQuota
    write_endpoint: "PATCH /coop/quotas/{id}"
    occ_field: expected_quota_version
    description: |
      Adjusting a MemberQuota's base_quota_override with an
      expected_quota_version that does not match the quota's current version is
      rejected. Quota recomputes triggered by estimate or bog transitions also
      bump version, so any version the client observed before such a cascade is
      stale even if the client itself never wrote.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: quota_base_barrels
    trigger: "Season open (creates the MemberQuota row); YieldEstimate transitions APPROVED/FLAGGED; Bog transitions out of or back into ACTIVE; PATCH base_quota_override set/cleared"
    algorithm: aggregation
    formula: |
      baseline_quota_barrels = sum over the member's Bogs with status == ACTIVE
                               of round2(acres * season.baseline_barrels_per_acre)
      approved_estimate total = sum over the member's Bogs with status == ACTIVE of:
        if an APPROVED YieldEstimate exists for (bog, season): estimate.estimated_barrels
        else: round2(acres * season.baseline_barrels_per_acre)
      base_quota_barrels = base_quota_override if base_quota_override is not null
                           else round2(approved_estimate total)
      Recomputation is skipped when quota_locked == true (season HARVEST_CLOSED+).
    input_set: "Bogs of the member with status == ACTIVE only (RENOVATION_PLANNED/UNDER_RENOVATION/REPLANTED excluded); YieldEstimates with status == APPROVED only (SUBMITTED/FLAGGED excluded)"
    precision: "2 decimal places, round_half_up"
    variants:
      - name: acreage_baseline
        when: "stored on baseline_quota_barrels — provisional, acreage-only view of the same member/season"
        difference: "ignores all grower estimates; uses acres * baseline for every ACTIVE bog"
      - name: approved_estimate
        when: "stored on base_quota_barrels — official quota"
        difference: "uses approved grower estimates where present; baseline only as per-bog fallback"

  - name: delivery_grade_assignment
    trigger: "POST /coop/deliveries/{id}/grade (from RECEIVED or DISPUTED)"
    algorithm: threshold
    formula: |
      Inputs: color_score (0..10), firmness_score (0..10), foreign_matter_pct (>= 0), net_barrels.
      if foreign_matter_pct > 6.0: grade = REJECT
      elif color_score >= 8.0 and firmness_score >= 8.0 and foreign_matter_pct <= 2.0: grade = A
      elif color_score >= 7.0 and firmness_score >= 7.0 and foreign_matter_pct <= 4.0: grade = B
      elif color_score >= 6.0 and firmness_score >= 6.0 and foreign_matter_pct <= 6.0: grade = C
      else: grade = REJECT
      premium_multiplier = {A: 1.10, B: 1.00, C: 0.90, REJECT: 0}
      weighted_barrels = round2(net_barrels * premium_multiplier)
      Boundaries are inclusive (>= / <=): exactly 8.0/8.0/2.0 is grade A.
    input_set: "the single delivery being graded"
    constants:
      GRADE_A_MIN_SCORE: 8.0
      GRADE_B_MIN_SCORE: 7.0
      GRADE_C_MIN_SCORE: 6.0
      GRADE_A_MAX_FM: 2.0
      GRADE_B_MAX_FM: 4.0
      GRADE_C_MAX_FM: 6.0
      PREMIUM_A: 1.10
      PREMIUM_B: 1.00
      PREMIUM_C: 0.90
    precision: "scores compared exactly; weighted_barrels 2 decimal places, round_half_up"

  - name: over_quota_split
    trigger: "POST /coop/deliveries/{id}/accept"
    algorithm: threshold
    formula: |
      remaining = max(0, quota.base_quota_barrels - quota.delivered_barrels)
      quota_applied_barrels = min(delivery.net_barrels, remaining)
      over_quota_barrels = delivery.net_barrels - quota_applied_barrels
      Boundary: when delivered_barrels + net_barrels == base_quota_barrels exactly,
      over_quota_barrels == 0 and the delivery is fully in-quota (>= not >).
      If over_quota_barrels > 0 the season's OVER_QUOTA pool with status == OPEN is
      required; selector: pools where season_id == delivery.season_id AND
      code == OVER_QUOTA AND status == OPEN (at most one exists by uniqueness);
      empty candidate set -> ERR_OVER_QUOTA_POOL_UNAVAILABLE.
    input_set: "the delivery being accepted; the member's MemberQuota for the season"
    precision: "2 decimal places, round_half_up"

  - name: pool_settlement_pricing
    trigger: "POST /coop/pools/{id}/settle"
    algorithm: aggregation
    formula: |
      Pinned evaluation order (rounding order is part of the contract):
      1. net_pool_value = round2(realized_revenue - operating_costs)
      2. final_rate_per_weighted_barrel = round4(net_pool_value / weighted_barrels_total)
         (if weighted_barrels_total == 0: final_rate := 0, no distributions created)
      3. per member with weighted_barrels > 0 in this pool:
           gross_amount   = round2(member_weighted_barrels * final_rate_per_weighted_barrel)
           retain_amount  = round2(gross_amount * pool.retain_pct)
           advance_paid   = sum of advance_amount over the member's ACCEPTED, non-VOIDED
                            deliveries tagged to this pool
           cash_amount    = gross_amount - retain_amount - advance_paid
      4. coop_equity_residual = net_pool_value - sum(gross_amount over all created distributions)
         (may be negative; the residual is retained by the co-op, never reallocated to members)
      Member ordering for distribution creation: member.created_at ASC (creation order),
      tie impossible; never ordered by id.
    input_set: "ACCEPTED, non-VOIDED deliveries tagged to this pool (main_pool_id == pool or over_quota_pool_id == pool), grouped by member"
    precision: "rates 4 decimal places round_half_up; money 2 decimal places round_half_up"
    variants:
      - name: provisional_advance
        when: "recorded per delivery at acceptance (Delivery.advance_amount)"
        difference: "uses pool.provisional_advance_rate_per_barrel at acceptance time; later PATCHes of the rate never retroactively change recorded advances"
      - name: final_settlement
        when: "computed once at pool settle (PatronageDistribution gross/retain/cash)"
        difference: "uses final_rate_per_weighted_barrel derived from realized revenue and costs; for identical delivery data the per-barrel realization differs from the provisional advance rate"

  - name: harvest_window_overlap
    trigger: "POST /coop/harvest-tickets (create) and POST /coop/harvest-tickets/{id}/transition {to: APPROVED}"
    algorithm: interval_merge
    formula: |
      Windows are half-open [window_start, window_end). A new/approving ticket on bog B
      conflicts with any other ticket T where T.bog_id == B AND
      T.status IN {REQUESTED, APPROVED} AND
      T.window_start < new.window_end AND new.window_start < T.window_end.
      Adjacency (T.window_end == new.window_start) is NOT a conflict.
    input_set: "HarvestTickets on the same bog with status IN {REQUESTED, APPROVED}"

  - name: station_daily_capacity
    trigger: "POST /coop/deliveries (create)"
    algorithm: aggregation
    formula: |
      day_load = sum of expected_barrels over Deliveries D where
                 D.receiving_station_id == station AND D.scheduled_date == new.scheduled_date
                 AND D.status IN {SCHEDULED, RECEIVED}
      reject when day_load + new.expected_barrels > station.daily_capacity_barrels
      Boundary: exactly equal to daily_capacity_barrels is allowed (<= semantics).
      Aggregate-capacity semantics over a calendar-day bucket — not pairwise overlap.
    input_set: "Deliveries at the station on the same scheduled_date with status IN {SCHEDULED, RECEIVED}"

  - name: frost_wet_harvest_water_conflict
    trigger: "POST /coop/frost-events (create)"
    algorithm: interval_merge
    formula: |
      A WET HarvestTicket on the same bog occupies a flood interval
      [ticket.window_start - FLOOD_LEAD_HOURS, ticket.window_end).
      A new FrostEvent conflicts when its window intersects any such flood interval
      on the same bog for tickets with status IN {REQUESTED, APPROVED}:
        ticket_flood_start < frost.window_end AND frost.window_start < ticket.window_end
      DRY tickets occupy no flood interval and never conflict.
    input_set: "HarvestTickets on the same bog, method == WET, status IN {REQUESTED, APPROVED}"
    constants:
      FLOOD_LEAD_HOURS: 24

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 0
    category: business_constraint
    check: "Request shape: required fields present, types well-formed, enum members valid, scalar ranges enforced (acres > 0, sprinkler_demand_gpm > 0, daily_capacity_barrels > 0, expected_barrels > 0, estimated_barrels > 0, scores within 0..10, foreign_matter_pct >= 0, retain_pct within [0,1], rates >= 0, dates parseable)"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all"
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Role is permitted for the endpoint; entity-backed ownership: GrowerMember may only act on resources whose member_id == X-User-ID (bogs, estimates, tickets, delivery create/dispute); StationOperator may only receive/grade deliveries whose receiving_station_id == X-User-ID; transition-target role splits on bog/estimate/ticket transitions (renovation plan/cancel and estimate revise and ticket cancel are GrowerMember-or-FieldOfficer; renovation approve/complete/certify, estimate approve/flag, ticket approve/complete are FieldOfficer-only)"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Path and body-referenced resource ids exist (validated left-to-right); FK references (season_id, bog_id, receiving_station_id, harvest_ticket_id) resolve"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 4
    category: business_constraint
    check: "Optimistic concurrency: expected_pool_version / expected_quota_version must match the current entity version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "PATCH /coop/pools/{id}; PATCH /coop/quotas/{id}; POST /coop/pools/{id}/settle"
  - priority: 5
    category: state
    check: "Target resource is in a state from which the requested transition is defined (incl. terminal lockdown); duplicate creation uniqueness for (season.year), (member.member_code), (pool season_id+code), (estimate bog_id+season_id) is checked in the same band against live records"
    error_id: "ERR_INVALID_STATE | ERR_DUPLICATE_SEASON_YEAR | ERR_DUPLICATE_MEMBER_CODE | ERR_DUPLICATE_POOL_CODE | ERR_DUPLICATE_ESTIMATE"
    http_status: 409
    applies_to: "all transition/action endpoints; create endpoints with uniqueness constraints"
  - priority: 6
    category: business_temporal
    check: "Window sanity and season alignment: window_start < window_end; harvest-ticket windows and delivery scheduled_date must lie within the season's harvest window (inclusive dates)"
    error_id: "ERR_INVALID_WINDOW | ERR_WINDOW_OUTSIDE_SEASON"
    http_status: 422
    applies_to: "POST /coop/harvest-tickets; POST /coop/frost-events; POST /coop/deliveries"
  - priority: 7
    category: business_constraint
    check: "Resource occupation conflicts: harvest-window overlap on a bog (half-open intervals); station aggregate daily capacity; frost-event vs wet-harvest flood conflict"
    error_id: "ERR_HARVEST_WINDOW_OVERLAP | ERR_STATION_CAPACITY_EXCEEDED | ERR_WATER_SCHEDULE_CONFLICT"
    http_status: 409
    applies_to: "POST /coop/harvest-tickets; POST /coop/harvest-tickets/{id}/transition; POST /coop/deliveries; POST /coop/frost-events"
  - priority: 8
    category: business_referential
    check: "Referenced entities in compatible states, checked in this order: season status (season OPEN for delivery create/accept; season SETUP|OPEN for pool/estimate/ticket creation), bog ACTIVE for estimate/ticket creation and ticket approval, station exists (existence) and ticket consistency (ticket APPROVED and ticket.bog_id == delivery.bog_id when harvest_ticket_id given), quota not locked for PATCH"
    error_id: "ERR_SEASON_NOT_OPEN | ERR_BOG_NOT_ACTIVE | ERR_TICKET_INVALID | ERR_QUOTA_LOCKED"
    http_status: 409
    applies_to: "delivery create/accept; estimate create/approve; ticket create/approve; pool create; PATCH /coop/quotas/{id}"
  - priority: 9
    category: business_fiscal
    check: "Pool availability and settlement money rules: MAIN pool OPEN at accept; OVER_QUOTA pool OPEN when over-quota barrels arise; settle revenue/cost sanity"
    error_id: "ERR_POOL_NOT_OPEN | ERR_OVER_QUOTA_POOL_UNAVAILABLE | ERR_SETTLEMENT_INPUT_INVALID"
    http_status: 409
    applies_to: "POST /coop/deliveries/{id}/accept; POST /coop/deliveries/{id}/void; POST /coop/pools/{id}/settle"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- test-driving clock ---
  - method: POST
    path: "/coop/_clock/set_current_utc"
    description: "Set the server's logical clock (test-driving endpoint). Before any call, the logical clock reads exactly 2026-08-01T00:00:00Z and never falls back to wall-clock time. Side effect: expiry sweep moves REQUESTED HarvestTickets with window_start < current time to EXPIRED."
    roles: [CoopAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["HarvestTicket expiry sweep (REQUESTED and window_start < now -> EXPIRED)"]

  # --- Season ---
  - method: POST
    path: "/coop/seasons"
    description: "Create a season (status SETUP)"
    roles: [CoopAdmin]
    code: 201
    input: [year, harvest_window_start, harvest_window_end, baseline_barrels_per_acre]
    output: Season
    side_effects: ["status=SETUP"]
  - method: GET
    path: "/coop/seasons/{id}"
    description: "Get a season"
    roles: [CoopAdmin, GrowerMember, FieldOfficer, StationOperator, PoolManager]
    code: 200
    input: []
    output: Season
    side_effects: []
  - method: POST
    path: "/coop/seasons/{id}/open"
    description: "Open a season; creates MemberQuota rows for all ACTIVE members"
    roles: [CoopAdmin]
    code: 200
    input: []
    output: Season
    side_effects: ["status -> OPEN", "MemberQuota created per ACTIVE member via quota_base_barrels"]

  # --- Member ---
  - method: POST
    path: "/coop/members"
    description: "Register a member (status PENDING)"
    roles: [CoopAdmin]
    code: 201
    input: [member_code, full_name]
    output: Member
    side_effects: ["status=PENDING"]
  - method: GET
    path: "/coop/members/{id}"
    description: "Get a member"
    roles: [CoopAdmin, GrowerMember, FieldOfficer, StationOperator, PoolManager]
    code: 200
    input: []
    output: Member
    side_effects: []
  - method: POST
    path: "/coop/members/{id}/transition"
    description: "Member lifecycle transition (PENDING->ACTIVE, ACTIVE->SUSPENDED, SUSPENDED->ACTIVE, ACTIVE->WITHDRAWN)"
    roles: [CoopAdmin]
    code: 200
    input: [to]
    output: Member
    side_effects: ["status transition per Member machine"]

  # --- MemberQuota ---
  - method: GET
    path: "/coop/quotas/{id}"
    description: "Get a member quota"
    roles: [CoopAdmin, GrowerMember, FieldOfficer, StationOperator, PoolManager]
    code: 200
    input: []
    output: MemberQuota
    side_effects: []
  - method: GET
    path: "/coop/quotas"
    description: "List quotas (filterable)"
    roles: [CoopAdmin, GrowerMember, FieldOfficer, StationOperator, PoolManager]
    code: 200
    input: ["member_id?", "season_id?", "limit?", "offset?"]
    output: "MemberQuota[]"
    side_effects: []
  - method: PATCH
    path: "/coop/quotas/{id}"
    description: "Manually override base quota (sets base_quota_override); OCC-guarded"
    roles: [CoopAdmin]
    code: 200
    input: [base_quota_barrels, expected_quota_version]
    output: MemberQuota
    side_effects:
      - "base_quota_override := base_quota_barrels; base_quota_barrels := override value; posture recomputed"
      - "increments MemberQuota.version by 1"
      - "blocked when quota_locked == true (ERR_QUOTA_LOCKED)"

  # --- Bog ---
  - method: POST
    path: "/coop/bogs"
    description: "Register a bog (status ACTIVE); GrowerMember caller becomes owner, CoopAdmin must pass member_id"
    roles: [GrowerMember, CoopAdmin]
    code: 201
    input: ["member_id?", name, acres, variety, sprinkler_demand_gpm, "frost_damage_threshold_c?"]
    output: Bog
    side_effects: ["status=ACTIVE"]
  - method: GET
    path: "/coop/bogs/{id}"
    description: "Get a bog"
    roles: [CoopAdmin, GrowerMember, FieldOfficer, StationOperator, PoolManager]
    code: 200
    input: []
    output: Bog
    side_effects: []
  - method: GET
    path: "/coop/bogs"
    description: "List bogs (filterable)"
    roles: [CoopAdmin, GrowerMember, FieldOfficer, StationOperator, PoolManager]
    code: 200
    input: ["member_id?", "status?", "limit?", "offset?"]
    output: "Bog[]"
    side_effects: []
  - method: POST
    path: "/coop/bogs/{id}/transition"
    description: "Renovation cycle transition (ACTIVE<->RENOVATION_PLANNED by owner, ->UNDER_RENOVATION->REPLANTED->ACTIVE by FieldOfficer)"
    roles: [GrowerMember, FieldOfficer]
    code: 200
    input: [to]
    output: Bog
    side_effects: ["status transition per Bog machine", "MemberQuota recompute when bog enters/leaves ACTIVE"]

  # --- YieldEstimate ---
  - method: POST
    path: "/coop/yield-estimates"
    description: "Submit a grower yield estimate for a bog+season (at most one per pair)"
    roles: [GrowerMember]
    code: 201
    input: [bog_id, season_id, estimated_barrels]
    output: YieldEstimate
    side_effects: ["status=SUBMITTED"]
  - method: GET
    path: "/coop/yield-estimates/{id}"
    description: "Get a yield estimate"
    roles: [CoopAdmin, GrowerMember, FieldOfficer, StationOperator, PoolManager]
    code: 200
    input: []
    output: YieldEstimate
    side_effects: []
  - method: GET
    path: "/coop/yield-estimates"
    description: "List yield estimates (filterable)"
    roles: [CoopAdmin, GrowerMember, FieldOfficer, StationOperator, PoolManager]
    code: 200
    input: ["bog_id?", "season_id?", "member_id?", "status?", "limit?", "offset?"]
    output: "YieldEstimate[]"
    side_effects: []
  - method: POST
    path: "/coop/yield-estimates/{id}/transition"
    description: "Approve/flag (FieldOfficer) or revise a flagged estimate (owning GrowerMember)"
    roles: [GrowerMember, FieldOfficer]
    code: 200
    input: [to, "revised_estimated_barrels?"]
    output: YieldEstimate
    side_effects: ["status transition per YieldEstimate machine", "MemberQuota recompute on APPROVED/FLAGGED"]

  # --- ReceivingStation ---
  - method: POST
    path: "/coop/stations"
    description: "Register a receiving station"
    roles: [CoopAdmin]
    code: 201
    input: [name, daily_capacity_barrels]
    output: ReceivingStation
    side_effects: []
  - method: GET
    path: "/coop/stations/{id}"
    description: "Get a receiving station"
    roles: [CoopAdmin, GrowerMember, FieldOfficer, StationOperator, PoolManager]
    code: 200
    input: []
    output: ReceivingStation
    side_effects: []

  # --- HarvestTicket ---
  - method: POST
    path: "/coop/harvest-tickets"
    description: "Request a wet/dry harvest window on a bog (status REQUESTED)"
    roles: [GrowerMember]
    code: 201
    input: [bog_id, season_id, method, window_start, window_end]
    output: HarvestTicket
    side_effects: ["status=REQUESTED"]
  - method: GET
    path: "/coop/harvest-tickets/{id}"
    description: "Get a harvest ticket"
    roles: [CoopAdmin, GrowerMember, FieldOfficer, StationOperator, PoolManager]
    code: 200
    input: []
    output: HarvestTicket
    side_effects: []
  - method: GET
    path: "/coop/harvest-tickets"
    description: "List harvest tickets (filterable)"
    roles: [CoopAdmin, GrowerMember, FieldOfficer, StationOperator, PoolManager]
    code: 200
    input: ["bog_id?", "season_id?", "member_id?", "status?", "method?", "limit?", "offset?"]
    output: "HarvestTicket[]"
    side_effects: []
  - method: POST
    path: "/coop/harvest-tickets/{id}/transition"
    description: "Approve/complete (FieldOfficer) or cancel (owning GrowerMember or FieldOfficer)"
    roles: [GrowerMember, FieldOfficer]
    code: 200
    input: [to]
    output: HarvestTicket
    side_effects: ["status transition per HarvestTicket machine"]

  # --- FrostEvent ---
  - method: POST
    path: "/coop/frost-events"
    description: "Declare a frost-protection sprinkler event on a bog"
    roles: [FieldOfficer]
    code: 201
    input: [bog_id, season_id, window_start, window_end, forecast_min_temp_c]
    output: FrostEvent
    side_effects: ["status=DECLARED"]
  - method: GET
    path: "/coop/frost-events/{id}"
    description: "Get a frost event"
    roles: [CoopAdmin, GrowerMember, FieldOfficer, StationOperator, PoolManager]
    code: 200
    input: []
    output: FrostEvent
    side_effects: []
  - method: GET
    path: "/coop/frost-events"
    description: "List frost events (filterable)"
    roles: [CoopAdmin, GrowerMember, FieldOfficer, StationOperator, PoolManager]
    code: 200
    input: ["bog_id?", "season_id?", "status?", "limit?", "offset?"]
    output: "FrostEvent[]"
    side_effects: []
  - method: POST
    path: "/coop/frost-events/{id}/transition"
    description: "Activate/complete/cancel a frost event; completion evaluates vine damage"
    roles: [FieldOfficer]
    code: 200
    input: [to, "actual_min_temp_c?"]
    output: FrostEvent
    side_effects: ["status transition per FrostEvent machine", "damage_flag computed on completion", "damage cascade: estimate APPROVED->FLAGGED -> quota recompute -> posture flip"]

  # --- Pool ---
  - method: POST
    path: "/coop/pools"
    description: "Create a marketing pool for a season (code MAIN or OVER_QUOTA; unique per season)"
    roles: [PoolManager]
    code: 201
    input: [season_id, code, provisional_advance_rate_per_barrel, retain_pct]
    output: Pool
    side_effects: ["status=OPEN"]
  - method: GET
    path: "/coop/pools/{id}"
    description: "Get a pool"
    roles: [CoopAdmin, GrowerMember, FieldOfficer, StationOperator, PoolManager]
    code: 200
    input: []
    output: Pool
    side_effects: []
  - method: GET
    path: "/coop/pools"
    description: "List pools (filterable)"
    roles: [CoopAdmin, GrowerMember, FieldOfficer, StationOperator, PoolManager]
    code: 200
    input: ["season_id?", "code?", "status?", "limit?", "offset?"]
    output: "Pool[]"
    side_effects: []
  - method: PATCH
    path: "/coop/pools/{id}"
    description: "Update provisional advance rate while OPEN; OCC-guarded; never retroactive on recorded advances"
    roles: [PoolManager]
    code: 200
    input: [provisional_advance_rate_per_barrel, expected_pool_version]
    output: Pool
    side_effects: ["rate updated", "increments Pool.version by 1"]
  - method: POST
    path: "/coop/pools/{id}/transition"
    description: "Close (OPEN->CLOSED) or reopen (CLOSED->OPEN) a pool"
    roles: [PoolManager]
    code: 200
    input: [to]
    output: Pool
    side_effects: ["status transition per Pool machine", "close may auto-close the season and lock quotas", "reopen may revert season HARVEST_CLOSED->OPEN and unlock quotas"]
  - method: POST
    path: "/coop/pools/{id}/settle"
    description: "Settle a CLOSED pool: compute final rate, create PatronageDistribution rows, mark SETTLED; OCC-guarded"
    roles: [PoolManager]
    code: 200
    input: [realized_revenue, operating_costs, expected_pool_version]
    output: Pool
    side_effects:
      - "pool_settlement_pricing runs (final_rate_per_weighted_barrel, coop_equity_residual)"
      - "PatronageDistribution rows created (status COMPUTED) per member with weighted_barrels > 0"
      - "status -> SETTLED; season may auto-transition to SETTLED"
      - "increments Pool.version by 1"

  # --- Delivery ---
  - method: POST
    path: "/coop/deliveries"
    description: "Schedule a delivery appointment at a receiving station (status SCHEDULED)"
    roles: [GrowerMember]
    code: 201
    input: [season_id, bog_id, receiving_station_id, "harvest_ticket_id?", scheduled_date, expected_barrels]
    output: Delivery
    side_effects: ["status=SCHEDULED", "station daily capacity consumed"]
  - method: GET
    path: "/coop/deliveries/{id}"
    description: "Get a delivery"
    roles: [CoopAdmin, GrowerMember, FieldOfficer, StationOperator, PoolManager]
    code: 200
    input: []
    output: Delivery
    side_effects: []
  - method: GET
    path: "/coop/deliveries"
    description: "List deliveries (filterable)"
    roles: [CoopAdmin, GrowerMember, FieldOfficer, StationOperator, PoolManager]
    code: 200
    input: ["member_id?", "season_id?", "bog_id?", "receiving_station_id?", "main_pool_id?", "over_quota_pool_id?", "harvest_ticket_id?", "status?", "scheduled_date?", "limit?", "offset?"]
    output: "Delivery[]"
    side_effects: []
  - method: POST
    path: "/coop/deliveries/{id}/receive"
    description: "Station confirms scale weights; computes net_barrels"
    roles: [StationOperator]
    code: 200
    input: [gross_barrels, tare_barrels]
    output: Delivery
    side_effects: ["status -> RECEIVED", "net_barrels := round2(gross - tare)"]
  - method: POST
    path: "/coop/deliveries/{id}/grade"
    description: "Record color/firmness/foreign-matter and compute grade (passing -> GRADED, failing -> REJECTED); also used for re-grade from DISPUTED"
    roles: [StationOperator]
    code: 200
    input: [color_score, firmness_score, foreign_matter_pct]
    output: Delivery
    side_effects: ["delivery_grade_assignment computes grade/premium_multiplier/weighted_barrels", "status -> GRADED or REJECTED"]
  - method: POST
    path: "/coop/deliveries/{id}/accept"
    description: "Accept a graded delivery into pool(s): quota split, pool tagging, advance booking"
    roles: [PoolManager]
    code: 200
    input: []
    output: Delivery
    side_effects: ["status -> ACCEPTED", "over_quota_split runs", "MemberQuota and tagged Pool totals updated"]
  - method: POST
    path: "/coop/deliveries/{id}/dispute"
    description: "Grower disputes the grade (GRADED -> DISPUTED)"
    roles: [GrowerMember]
    code: 200
    input: []
    output: Delivery
    side_effects: ["status -> DISPUTED", "dispute_count += 1"]
  - method: POST
    path: "/coop/deliveries/{id}/void"
    description: "Void an accepted delivery; compensates quota, pool totals, and advances exactly"
    roles: [PoolManager]
    code: 200
    input: []
    output: Delivery
    side_effects: ["status -> VOIDED", "compensating reversal on MemberQuota and tagged Pools"]

  # --- PatronageDistribution ---
  - method: GET
    path: "/coop/distributions/{id}"
    description: "Get a patronage distribution"
    roles: [CoopAdmin, GrowerMember, FieldOfficer, StationOperator, PoolManager]
    code: 200
    input: []
    output: PatronageDistribution
    side_effects: []
  - method: GET
    path: "/coop/distributions"
    description: "List patronage distributions (filterable)"
    roles: [CoopAdmin, GrowerMember, FieldOfficer, StationOperator, PoolManager]
    code: 200
    input: ["pool_id?", "member_id?", "status?", "limit?", "offset?"]
    output: "PatronageDistribution[]"
    side_effects: []
  - method: POST
    path: "/coop/distributions/{id}/transition"
    description: "Approve then pay a distribution (COMPUTED->APPROVED->PAID)"
    roles: [PoolManager]
    code: 200
    input: [to]
    output: PatronageDistribution
    side_effects: ["status transition per PatronageDistribution machine"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or invalid X-User-Role / X-User-ID headers" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for the endpoint, or entity-backed ownership check failed (GrowerMember vs member_id, StationOperator vs receiving_station_id), or transition-target role split violated" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path or referenced resource id does not exist" }
  - { id: ERR_VALIDATION, http: 400, condition: "Missing required field, malformed value, out-of-range scalar, or invalid enum member" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_pool_version / expected_quota_version does not match the entity's current version" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource is not in a state from which the requested transition is defined (incl. terminal lockdown)" }
  - { id: ERR_DUPLICATE_SEASON_YEAR, http: 409, condition: "A season with the same year already exists" }
  - { id: ERR_DUPLICATE_MEMBER_CODE, http: 409, condition: "A member with the same member_code already exists" }
  - { id: ERR_DUPLICATE_POOL_CODE, http: 409, condition: "A pool with the same code already exists for the season" }
  - { id: ERR_DUPLICATE_ESTIMATE, http: 409, condition: "A yield estimate already exists for (bog_id, season_id)" }
  - { id: ERR_SEASON_NOT_OPEN, http: 409, condition: "Season is not in the required status (OPEN for delivery create/accept, HARVEST_CLOSED for settle, not-SETTLED for pool reopen)" }
  - { id: ERR_BOG_NOT_ACTIVE, http: 409, condition: "Bog status is not ACTIVE where required (estimate create/approve, ticket create/approve, delivery create)" }
  - { id: ERR_TICKET_INVALID, http: 409, condition: "harvest_ticket_id given but the ticket is not APPROVED or belongs to a different bog" }
  - { id: ERR_QUOTA_LOCKED, http: 409, condition: "PATCH on a MemberQuota whose season has reached HARVEST_CLOSED (quota_locked == true)" }
  - { id: ERR_INVALID_WINDOW, http: 422, condition: "window_start >= window_end" }
  - { id: ERR_WINDOW_OUTSIDE_SEASON, http: 422, condition: "Harvest-ticket window or delivery scheduled_date lies outside the season harvest window" }
  - { id: ERR_HARVEST_WINDOW_OVERLAP, http: 409, condition: "Harvest window overlaps another REQUESTED/APPROVED ticket on the same bog (half-open intervals; adjacency allowed)" }
  - { id: ERR_STATION_CAPACITY_EXCEEDED, http: 409, condition: "Aggregate expected_barrels of SCHEDULED/RECEIVED deliveries at the station that day plus the new delivery exceeds daily_capacity_barrels" }
  - { id: ERR_WATER_SCHEDULE_CONFLICT, http: 409, condition: "Frost event window intersects a wet-harvest flood interval (window_start - 24h .. window_end) on the same bog" }
  - { id: ERR_TARE_EXCEEDS_GROSS, http: 422, condition: "tare_barrels > gross_barrels at receiving" }
  - { id: ERR_POOL_NOT_OPEN, http: 409, condition: "Required pool is not OPEN (accept, void, rate PATCH on non-OPEN pool)" }
  - { id: ERR_OVER_QUOTA_POOL_UNAVAILABLE, http: 409, condition: "Acceptance would produce over-quota barrels but no OPEN OVER_QUOTA pool exists for the season" }
  - { id: ERR_POOL_HAS_OPEN_DELIVERIES, http: 409, condition: "Pool close blocked: season has deliveries in RECEIVED/GRADED/DISPUTED" }
  - { id: ERR_SETTLEMENT_INPUT_INVALID, http: 422, condition: "Settle inputs violate money rules (operating_costs < 0, realized_revenue < operating_costs, or zero weighted barrels with non-zero revenue/costs)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: CoopAdmin
    description: "Co-op administrator: seasons, members, stations, quota overrides, logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /coop/seasons, POST /coop/seasons/{id}/open"
      - "POST /coop/members, POST /coop/members/{id}/transition"
      - "POST /coop/stations"
      - "PATCH /coop/quotas/{id}"
      - "POST /coop/_clock/set_current_utc"
    shared_operations:
      - "All GET endpoints"
      - "POST /coop/bogs (with member_id input)"
  - name: GrowerMember
    description: "Grower-member acting on their own bogs, estimates, harvest tickets, deliveries"
    identity: "entity_backed:Member"
    exclusive_operations:
      - "POST /coop/yield-estimates, POST /coop/yield-estimates/{id}/transition {to: SUBMITTED} (revise own)"
      - "POST /coop/harvest-tickets"
      - "POST /coop/deliveries, POST /coop/deliveries/{id}/dispute (own deliveries)"
    shared_operations:
      - "All GET endpoints"
      - "POST /coop/bogs (own), POST /coop/bogs/{id}/transition {to: RENOVATION_PLANNED | ACTIVE from RENOVATION_PLANNED}"
      - "POST /coop/harvest-tickets/{id}/transition {to: CANCELLED}"
  - name: FieldOfficer
    description: "Co-op field officer: estimate review, harvest approval, frost protection, renovation supervision"
    identity: opaque
    exclusive_operations:
      - "POST /coop/yield-estimates/{id}/transition {to: APPROVED | FLAGGED}"
      - "POST /coop/harvest-tickets/{id}/transition {to: APPROVED | COMPLETED}"
      - "POST /coop/frost-events, POST /coop/frost-events/{id}/transition"
      - "POST /coop/bogs/{id}/transition {to: UNDER_RENOVATION | REPLANTED | ACTIVE from REPLANTED}"
    shared_operations:
      - "All GET endpoints"
  - name: StationOperator
    description: "Receiving-station operator; may only receive/grade deliveries booked at their own station"
    identity: "entity_backed:ReceivingStation"
    exclusive_operations:
      - "POST /coop/deliveries/{id}/receive"
      - "POST /coop/deliveries/{id}/grade"
    shared_operations:
      - "All GET endpoints"
  - name: PoolManager
    description: "Pool and money side: pools, advance rates, delivery acceptance/void, settlement, distributions"
    identity: opaque
    exclusive_operations:
      - "POST /coop/pools, PATCH /coop/pools/{id}, POST /coop/pools/{id}/transition, POST /coop/pools/{id}/settle"
      - "POST /coop/deliveries/{id}/accept, POST /coop/deliveries/{id}/void"
      - "POST /coop/distributions/{id}/transition"
    shared_operations:
      - "All GET endpoints"
