# =============================================================================
# §1.8 Scaffold Difficulty Design — Task 1873 (High-Voltage Cable Testing)
# 9 rules x >=2 instances = 25 active instances. All chains replay against
# SCAFFOLD.yaml §1.5 from empty-DB; clock default 2026-08-01T00:00:00Z.
# =============================================================================
scaffold_difficulty_design:
  # ------------------------------------------------------------------ Rule 1
  - rule_id: dual_variant_calc
    instances:
      - name: verdict_temperature_correction_flips_official_verdict
        grounds:
          - calculations.series_verdict
          - entities.TestSeries.fields.verdict_as_tested
          - entities.TestSeries.fields.verdict_temperature_corrected
          - entities.TestJob.fields.use_temperature_correction
        distinguishing_aspect: |
          Dual variant on the TestSeries/TestReading (diagnostics) domain: identical raw
          tan-delta readings (88.0 E-3 at T=35C) yield verdict_as_tested == FAIL but
          verdict_temperature_corrected == MONITOR because k(35C)=0.9 maps 88.0 -> 79.2;
          with use_temperature_correction=false the official verdict is FAIL and a fault
          is auto-created, while the corrected basis alone would not create one.
        test_recipe:
          setup:
            - "Circuit C (KV_15, length 2000, year 2015); window 2026-08-10 08:00 to 2026-08-12 12:00 APPROVED; job (methods [VLF_TAN_DELTA], budget 900000, flag false) PLANNED; permit GROUNDING_VERIFIED; unit assigned+confirmed; clock 2026-08-10T09:00Z; window ACTIVE; job IN_PROGRESS; series SETUP."
          setup_api_calls:
            - { call: "POST /cable-diagnostics/circuits", payload: { circuit_ref: "CKT-DV1", voltage_class: "KV_15", length_m: 2000, installation_year: 2015 }, as: SystemAdmin, captures: { c: "$.data.id" } }
            - { call: "POST /cable-diagnostics/outage-windows", payload: { circuit_id: "${c}", kind: "PLANNED_DIAGNOSTIC", window_start: "2026-08-10T08:00:00Z", window_end: "2026-08-12T12:00:00Z" }, as: NetworkPlanner, captures: { w: "$.data.id" } }
            - { call: "POST /cable-diagnostics/outage-windows/${w}/approve", as: NetworkPlanner }
            - { call: "POST /cable-diagnostics/test-jobs", payload: { circuit_id: "${c}", outage_window_id: "${w}", requested_methods: ["VLF_TAN_DELTA"], approved_budget_cents: 900000, use_temperature_correction: false }, as: NetworkPlanner, captures: { j: "$.data.id" } }
            - { call: "POST /cable-diagnostics/test-jobs/${j}/plan", as: NetworkPlanner }
            - { call: "POST /cable-diagnostics/isolation-permits", payload: { test_job_id: "${j}", isolation_points: ["SW-N", "SW-F"], ground_count: 2 }, as: SafetyOfficer, as_user_id: "so-1", captures: { p: "$.data.id" } }
            - { call: "POST /cable-diagnostics/isolation-permits/${p}/issue", as: SafetyOfficer, as_user_id: "so-1" }
            - { call: "POST /cable-diagnostics/isolation-permits/${p}/verify-grounding", as: SafetyOfficer, as_user_id: "so-2" }
            - { call: "POST /cable-diagnostics/mobile-units", payload: { unit_code: "VAN-1", capabilities: ["VLF", "PD", "TDR"], max_test_voltage_kv: 30.0 }, as: SystemAdmin, captures: { u: "$.data.id" } }
            - { call: "POST /cable-diagnostics/equipment-assignments", payload: { mobile_unit_id: "${u}", test_job_id: "${j}", mobilize_at: "2026-08-10T07:00:00Z", demobilize_at: "2026-08-12T12:00:00Z" }, as: DispatchCoordinator, captures: { a: "$.data.id" } }
            - { call: "POST /cable-diagnostics/equipment-assignments/${a}/confirm", as: DispatchCoordinator }
            - { call: "POST /cable-diagnostics/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T09:00:00Z" }, as: SystemAdmin }
            - { call: "POST /cable-diagnostics/outage-windows/${w}/activate", as: NetworkPlanner }
            - { call: "POST /cable-diagnostics/test-jobs/${j}/start", as: TestSupervisor }
            - { call: "POST /cable-diagnostics/test-series", payload: { test_job_id: "${j}", method: "VLF_TAN_DELTA", test_voltage_kv: 13.05 }, as: TestSupervisor, captures: { s: "$.data.id" } }
            - { call: "POST /cable-diagnostics/test-series/${s}/energize", as: TestSupervisor }
          trigger:
            - { call: "POST /cable-diagnostics/test-series/${s}/readings", payload: { step_index: 0, applied_voltage_kv: 4.35, tan_delta_e3: 88.0, ambient_temp_c: 35.0 }, as: FieldTechnician, as_user_id: "ft-1" }
            - { call: "POST /cable-diagnostics/test-series/${s}/readings", payload: { step_index: 1, applied_voltage_kv: 8.7, tan_delta_e3: 88.0, ambient_temp_c: 35.0 }, as: FieldTechnician, as_user_id: "ft-1" }
            - { call: "POST /cable-diagnostics/test-series/${s}/readings", payload: { step_index: 2, applied_voltage_kv: 13.05, tan_delta_e3: 88.0, ambient_temp_c: 35.0 }, as: FieldTechnician, as_user_id: "ft-1" }
            - { call: "POST /cable-diagnostics/test-series/${s}/evaluate", as: TestSupervisor, captures: { v_at: "$.data.verdict_as_tested", v_tc: "$.data.verdict_temperature_corrected", v_off: "$.data.verdict" } }
            - { call: "GET /cable-diagnostics/test-series/${s}/faults", as: TestSupervisor, captures: { f0: "$.data[0].id" } }
            - { call: "GET /cable-diagnostics/circuits/${c}", as: TestSupervisor, captures: { c_unres: "$.data.unresolved_fault_count" } }
          assert:
            - "TestSeries.${s}.verdict_as_tested == FAIL (max tan-delta 88.0 >= TD_FAIL_MIN 80.0)"
            - "TestSeries.${s}.verdict_temperature_corrected == MONITOR (88.0 * 0.9 = 79.2, in [5,80))"
            - "TestSeries.${s}.verdict == FAIL (flag false selects as-tested basis)"
            - "exactly one FaultRecord exists for series ${s} with status SUSPECTED"
            - "CableCircuit.${c}.unresolved_fault_count == 1"

      - name: fault_distance_standard_vs_calibrated_velocity
        grounds:
          - calculations.fault_distance_corridor
          - entities.FaultRecord.fields.pinpointed_distance_m
          - entities.FaultRecord.fields.alternate_distance_m
          - entities.CableCircuit.fields.calibrated_velocity_factor
        distinguishing_aspect: |
          Dual variant on the FaultRecord (fault-location) domain — a different entity
          domain from the series-verdict instance: one trace_time_us (20.0 us) produces
          pinpointed_distance_m == 1560.0 m under the standard VF 0.52 and
          alternate_distance_m == 1500.0 m under the calibrated VF 0.50.
        test_recipe:
          setup:
            - "Circuit C (KV_15, length 2000, calibrated_velocity_factor 0.50, year 2015); full prefix to job IN_PROGRESS with series ENERGIZING; FAIL readings logged and evaluated so a SUSPECTED fault exists."
          setup_api_calls:
            - { call: "POST /cable-diagnostics/circuits", payload: { circuit_ref: "CKT-DV2", voltage_class: "KV_15", length_m: 2000, installation_year: 2015, calibrated_velocity_factor: 0.50 }, as: SystemAdmin, captures: { c: "$.data.id" } }
            - { call: "POST /cable-diagnostics/outage-windows", payload: { circuit_id: "${c}", kind: "PLANNED_DIAGNOSTIC", window_start: "2026-08-10T08:00:00Z", window_end: "2026-08-12T12:00:00Z" }, as: NetworkPlanner, captures: { w: "$.data.id" } }
            - { call: "POST /cable-diagnostics/outage-windows/${w}/approve", as: NetworkPlanner }
            - { call: "POST /cable-diagnostics/test-jobs", payload: { circuit_id: "${c}", outage_window_id: "${w}", requested_methods: ["VLF_TAN_DELTA"], approved_budget_cents: 900000 }, as: NetworkPlanner, captures: { j: "$.data.id" } }
            - { call: "POST /cable-diagnostics/test-jobs/${j}/plan", as: NetworkPlanner }
            - { call: "POST /cable-diagnostics/isolation-permits", payload: { test_job_id: "${j}", isolation_points: ["SW-N"], ground_count: 2 }, as: SafetyOfficer, as_user_id: "so-1", captures: { p: "$.data.id" } }
            - { call: "POST /cable-diagnostics/isolation-permits/${p}/issue", as: SafetyOfficer, as_user_id: "so-1" }
            - { call: "POST /cable-diagnostics/isolation-permits/${p}/verify-grounding", as: SafetyOfficer, as_user_id: "so-2" }
            - { call: "POST /cable-diagnostics/mobile-units", payload: { unit_code: "VAN-1", capabilities: ["VLF", "PD", "TDR"], max_test_voltage_kv: 30.0 }, as: SystemAdmin, captures: { u: "$.data.id" } }
            - { call: "POST /cable-diagnostics/equipment-assignments", payload: { mobile_unit_id: "${u}", test_job_id: "${j}", mobilize_at: "2026-08-10T07:00:00Z", demobilize_at: "2026-08-12T12:00:00Z" }, as: DispatchCoordinator, captures: { a: "$.data.id" } }
            - { call: "POST /cable-diagnostics/equipment-assignments/${a}/confirm", as: DispatchCoordinator }
            - { call: "POST /cable-diagnostics/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T09:00:00Z" }, as: SystemAdmin }
            - { call: "POST /cable-diagnostics/outage-windows/${w}/activate", as: NetworkPlanner }
            - { call: "POST /cable-diagnostics/test-jobs/${j}/start", as: TestSupervisor }
            - { call: "POST /cable-diagnostics/test-series", payload: { test_job_id: "${j}", method: "VLF_TAN_DELTA", test_voltage_kv: 13.05 }, as: TestSupervisor, captures: { s: "$.data.id" } }
            - { call: "POST /cable-diagnostics/test-series/${s}/energize", as: TestSupervisor }
            - { call: "POST /cable-diagnostics/test-series/${s}/readings", payload: { step_index: 0, applied_voltage_kv: 4.35, tan_delta_e3: 90.0, ambient_temp_c: 20.0 }, as: FieldTechnician, as_user_id: "ft-1" }
            - { call: "POST /cable-diagnostics/test-series/${s}/readings", payload: { step_index: 1, applied_voltage_kv: 8.7, tan_delta_e3: 92.0, ambient_temp_c: 20.0 }, as: FieldTechnician, as_user_id: "ft-1" }
            - { call: "POST /cable-diagnostics/test-series/${s}/readings", payload: { step_index: 2, applied_voltage_kv: 13.05, tan_delta_e3: 95.0, ambient_temp_c: 20.0 }, as: FieldTechnician, as_user_id: "ft-1" }
            - { call: "POST /cable-diagnostics/test-series/${s}/evaluate", as: TestSupervisor }
            - { call: "GET /cable-diagnostics/test-series/${s}/faults", as: TestSupervisor, captures: { f: "$.data[0].id" } }
          trigger:
            - { call: "POST /cable-diagnostics/faults/${f}/pinpoint", payload: { trace_time_us: 20.0, pinpoint_method: "PULSE_ECHO", use_calibrated_velocity: false }, as: FaultCrewLead, captures: { d_sel: "$.data.pinpointed_distance_m", d_alt: "$.data.alternate_distance_m", vf: "$.data.velocity_factor_used", c_lo: "$.data.corridor_start_m", c_hi: "$.data.corridor_end_m" } }
          assert:
            - "FaultRecord.${f}.pinpointed_distance_m == 1560.0 (0.52 * 300 * 20.0 / 2)"
            - "FaultRecord.${f}.alternate_distance_m == 1500.0 (0.50 * 300 * 20.0 / 2)"
            - "FaultRecord.${f}.velocity_factor_used == 0.52"
            - "FaultRecord.${f}.corridor_start_m == 1404.0 and corridor_end_m == 1716.0 (half-width max(5.0, 156.0))"
            - "FaultRecord.${f}.status == PINPOINTED"

      - name: health_index_formal_vs_provisional_input_set
        grounds:
          - calculations.health_index_score
          - entities.HealthAssessment.fields.basis
          - entities.HealthAssessment.fields.health_index_score
        distinguishing_aspect: |
          Dual variant on the CableCircuit/HealthAssessment (asset-planning) domain: the
          same stored series data scores 96.2 (GOOD) under FORMAL (ACCEPTED series only)
          but 75.2 (FAIR) under PROVISIONAL (which also counts the EVALUATED 50.0-E-3
          series); input-set filtering alone moves the circuit across a band boundary.
        test_recipe:
          setup:
            - "Circuit C (KV_15, length 2000, installed 1996 -> age 30y at clock 2026); job IN_PROGRESS; series A ACCEPTED with tan-delta 3.0 (PASS); series B EVALUATED (not accepted) with tan-delta 50.0 (MONITOR); no faults; no PD series."
          setup_api_calls:
            - { call: "POST /cable-diagnostics/circuits", payload: { circuit_ref: "CKT-DV3", voltage_class: "KV_15", length_m: 2000, installation_year: 1996 }, as: SystemAdmin, captures: { c: "$.data.id" } }
            - { call: "POST /cable-diagnostics/outage-windows", payload: { circuit_id: "${c}", kind: "PLANNED_DIAGNOSTIC", window_start: "2026-08-10T08:00:00Z", window_end: "2026-08-12T12:00:00Z" }, as: NetworkPlanner, captures: { w: "$.data.id" } }
            - { call: "POST /cable-diagnostics/outage-windows/${w}/approve", as: NetworkPlanner }
            - { call: "POST /cable-diagnostics/test-jobs", payload: { circuit_id: "${c}", outage_window_id: "${w}", requested_methods: ["VLF_TAN_DELTA"], approved_budget_cents: 900000 }, as: NetworkPlanner, captures: { j: "$.data.id" } }
            - { call: "POST /cable-diagnostics/test-jobs/${j}/plan", as: NetworkPlanner }
            - { call: "POST /cable-diagnostics/isolation-permits", payload: { test_job_id: "${j}", isolation_points: ["SW-N"], ground_count: 2 }, as: SafetyOfficer, as_user_id: "so-1", captures: { p: "$.data.id" } }
            - { call: "POST /cable-diagnostics/isolation-permits/${p}/issue", as: SafetyOfficer, as_user_id: "so-1" }
            - { call: "POST /cable-diagnostics/isolation-permits/${p}/verify-grounding", as: SafetyOfficer, as_user_id: "so-2" }
            - { call: "POST /cable-diagnostics/mobile-units", payload: { unit_code: "VAN-1", capabilities: ["VLF", "PD", "TDR"], max_test_voltage_kv: 30.0 }, as: SystemAdmin, captures: { u: "$.data.id" } }
            - { call: "POST /cable-diagnostics/equipment-assignments", payload: { mobile_unit_id: "${u}", test_job_id: "${j}", mobilize_at: "2026-08-10T07:00:00Z", demobilize_at: "2026-08-12T12:00:00Z" }, as: DispatchCoordinator, captures: { a: "$.data.id" } }
            - { call: "POST /cable-diagnostics/equipment-assignments/${a}/confirm", as: DispatchCoordinator }
            - { call: "POST /cable-diagnostics/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T09:00:00Z" }, as: SystemAdmin }
            - { call: "POST /cable-diagnostics/outage-windows/${w}/activate", as: NetworkPlanner }
            - { call: "POST /cable-diagnostics/test-jobs/${j}/start", as: TestSupervisor }
            - { call: "POST /cable-diagnostics/test-series", payload: { test_job_id: "${j}", method: "VLF_TAN_DELTA", test_voltage_kv: 13.05 }, as: TestSupervisor, captures: { sa: "$.data.id" } }
            - { call: "POST /cable-diagnostics/test-series/${sa}/energize", as: TestSupervisor }
            - { call: "POST /cable-diagnostics/test-series/${sa}/readings", payload: { step_index: 0, applied_voltage_kv: 4.35, tan_delta_e3: 3.0, ambient_temp_c: 20.0 }, as: FieldTechnician, as_user_id: "ft-1" }
            - { call: "POST /cable-diagnostics/test-series/${sa}/readings", payload: { step_index: 1, applied_voltage_kv: 8.7, tan_delta_e3: 3.0, ambient_temp_c: 20.0 }, as: FieldTechnician, as_user_id: "ft-1" }
            - { call: "POST /cable-diagnostics/test-series/${sa}/readings", payload: { step_index: 2, applied_voltage_kv: 13.05, tan_delta_e3: 3.0, ambient_temp_c: 20.0 }, as: FieldTechnician, as_user_id: "ft-1" }
            - { call: "POST /cable-diagnostics/test-series/${sa}/evaluate", as: TestSupervisor }
            - { call: "POST /cable-diagnostics/test-series/${sa}/accept", as: NetworkPlanner }
            - { call: "POST /cable-diagnostics/test-series", payload: { test_job_id: "${j}", method: "VLF_TAN_DELTA", test_voltage_kv: 13.05 }, as: TestSupervisor, captures: { sb: "$.data.id" } }
            - { call: "POST /cable-diagnostics/test-series/${sb}/energize", as: TestSupervisor }
            - { call: "POST /cable-diagnostics/test-series/${sb}/readings", payload: { step_index: 0, applied_voltage_kv: 4.35, tan_delta_e3: 50.0, ambient_temp_c: 20.0 }, as: FieldTechnician, as_user_id: "ft-1" }
            - { call: "POST /cable-diagnostics/test-series/${sb}/readings", payload: { step_index: 1, applied_voltage_kv: 8.7, tan_delta_e3: 50.0, ambient_temp_c: 20.0 }, as: FieldTechnician, as_user_id: "ft-1" }
            - { call: "POST /cable-diagnostics/test-series/${sb}/readings", payload: { step_index: 2, applied_voltage_kv: 13.05, tan_delta_e3: 50.0, ambient_temp_c: 20.0 }, as: FieldTechnician, as_user_id: "ft-1" }
            - { call: "POST /cable-diagnostics/test-series/${sb}/evaluate", as: TestSupervisor }
            - { call: "GET /cable-diagnostics/circuits/${c}", as: AssetEngineer, captures: { cv1: "$.data.version" } }
          trigger:
            - { call: "POST /cable-diagnostics/health-assessments", payload: { circuit_id: "${c}", basis: "FORMAL", expected_circuit_version: "${cv1}" }, as: AssetEngineer, captures: { ha1: "$.data.id", s1: "$.data.health_index_score" } }
            - { call: "GET /cable-diagnostics/circuits/${c}", as: AssetEngineer, captures: { cv2: "$.data.version" } }
            - { call: "POST /cable-diagnostics/health-assessments", payload: { circuit_id: "${c}", basis: "PROVISIONAL", expected_circuit_version: "${cv2}" }, as: AssetEngineer, captures: { ha2: "$.data.id", s2: "$.data.health_index_score", sup: "$.data.supersedes_id" } }
            - { call: "GET /cable-diagnostics/health-assessments/${ha1}", as: AssetEngineer, captures: { ha1_status: "$.data.status" } }
          assert:
            - "HealthAssessment.${ha1}.health_index_score == 96.2 (formal: td_pen 0, pd_pen 0, fault_pen 0, age_pen 25 -> penalty 3.8)"
            - "HealthAssessment.${ha1}.band == GOOD and recommended_action == NONE"
            - "HealthAssessment.${ha2}.health_index_score == 75.2 (provisional adds td_pen 60: 21 + 3.75 = 24.75 -> 24.8)"
            - "HealthAssessment.${ha2}.band == FAIR and recommended_action == MONITOR"
            - "HealthAssessment.${ha2}.supersedes_id == ${ha1} and HealthAssessment.${ha1}.status == SUPERSEDED"
  # ------------------------------------------------------------------ Rule 2
  - rule_id: combinatorial_formula
    instances:
      - name: health_weighted_tiers_four_input_nonlinear
        grounds:
          - calculations.health_index_score
          - entities.HealthAssessment.fields.penalty_components
        distinguishing_aspect: |
          Mode (a) — four inputs with tiered, non-linear interaction: td 50.0 E-3 (pen 60),
          pd 600 pC (pen 55), 1 unresolved fault (pen 25), age 35y (pen 50) combine as
          0.35*60 + 0.30*55 + 0.20*25 + 0.15*50 = 50.0 -> score exactly 50.0 (POOR);
          changing any single tier flips the total non-linearly.
        test_recipe:
          setup:
            - "Circuit C (KV_15, length 2000, installed 1991 -> age 35y); job IN_PROGRESS (methods [VLF_WITH_PD]); one series EVALUATED with tan-delta 50.0 and pd 600 (verdict MONITOR); one manually-raised fault -> unresolved_fault_count == 1."
          setup_api_calls:
            - { call: "POST /cable-diagnostics/circuits", payload: { circuit_ref: "CKT-CF1", voltage_class: "KV_15", length_m: 2000, installation_year: 1991 }, as: SystemAdmin, captures: { c: "$.data.id" } }
            - { call: "POST /cable-diagnostics/outage-windows", payload: { circuit_id: "${c}", kind: "PLANNED_DIAGNOSTIC", window_start: "2026-08-10T08:00:00Z", window_end: "2026-08-12T12:00:00Z" }, as: NetworkPlanner, captures: { w: "$.data.id" } }
            - { call: "POST /cable-diagnostics/outage-windows/${w}/approve", as: NetworkPlanner }
            - { call: "POST /cable-diagnostics/test-jobs", payload: { circuit_id: "${c}", outage_window_id: "${w}", requested_methods: ["VLF_WITH_PD"], approved_budget_cents: 900000 }, as: NetworkPlanner, captures: { j: "$.data.id" } }
            - { call: "POST /cable-diagnostics/test-jobs/${j}/plan", as: NetworkPlanner }
            - { call: "POST /cable-diagnostics/isolation-permits", payload: { test_job_id: "${j}", isolation_points: ["SW-N"], ground_count: 2 }, as: SafetyOfficer, as_user_id: "so-1", captures: { p: "$.data.id" } }
            - { call: "POST /cable-diagnostics/isolation-permits/${p}/issue", as: SafetyOfficer, as_user_id: "so-1" }
            - { call: "POST /cable-diagnostics/isolation-permits/${p}/verify-grounding", as: SafetyOfficer, as_user_id: "so-2" }
            - { call: "POST /cable-diagnostics/mobile-units", payload: { unit_code: "VAN-1", capabilities: ["VLF", "PD", "TDR"], max_test_voltage_kv: 30.0 }, as: SystemAdmin, captures: { u: "$.data.id" } }
            - { call: "POST /cable-diagnostics/equipment-assignments", payload: { mobile_unit_id: "${u}", test_job_id: "${j}", mobilize_at: "2026-08-10T07:00:00Z", demobilize_at: "2026-08-12T12:00:00Z" }, as: DispatchCoordinator, captures: { a: "$.data.id" } }
            - { call: "POST /cable-diagnostics/equipment-assignments/${a}/confirm", as: DispatchCoordinator }
            - { call: "POST /cable-diagnostics/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T09:00:00Z" }, as: SystemAdmin }
            - { call: "POST /cable-diagnostics/outage-windows/${w}/activate", as: NetworkPlanner }
            - { call: "POST /cable-diagnostics/test-jobs/${j}/start", as: TestSupervisor }
            - { call: "POST /cable-diagnostics/test-series", payload: { test_job_id: "${j}", method: "VLF_WITH_PD", test_voltage_kv: 13.05 }, as: TestSupervisor, captures: { s: "$.data.id" } }
            - { call: "POST /cable-diagnostics/test-series/${s}/energize", as: TestSupervisor }
            - { call: "POST /cable-diagnostics/test-series/${s}/readings", payload: { step_index: 0, applied_voltage_kv: 4.35, tan_delta_e3: 50.0, pd_level_pc: 600, ambient_temp_c: 20.0 }, as: FieldTechnician, as_user_id: "ft-1" }
            - { call: "POST /cable-diagnostics/test-series/${s}/readings", payload: { step_index: 1, applied_voltage_kv: 8.7, tan_delta_e3: 50.0, pd_level_pc: 600, ambient_temp_c: 20.0 }, as: FieldTechnician, as_user_id: "ft-1" }
            - { call: "POST /cable-diagnostics/test-series/${s}/readings", payload: { step_index: 2, applied_voltage_kv: 13.05, tan_delta_e3: 50.0, pd_level_pc: 600, ambient_temp_c: 20.0 }, as: FieldTechnician, as_user_id: "ft-1" }
            - { call: "POST /cable-diagnostics/test-series/${s}/evaluate", as: TestSupervisor }
            - { call: "POST /cable-diagnostics/faults", payload: { test_series_id: "${s}" }, as: TestSupervisor, captures: { f: "$.data.id" } }
            - { call: "GET /cable-diagnostics/circuits/${c}", as: AssetEngineer, captures: { cv: "$.data.version" } }
          trigger:
            - { call: "POST /cable-diagnostics/health-assessments", payload: { circuit_id: "${c}", basis: "PROVISIONAL", expected_circuit_version: "${cv}" }, as: AssetEngineer, captures: { ha: "$.data.id", score: "$.data.health_index_score" } }
          assert:
            - "HealthAssessment.${ha}.penalty_components == { td_pen: 60, pd_pen: 55, fault_pen: 25, age_pen: 50 }"
            - "HealthAssessment.${ha}.health_index_score == 50.0"
            - "HealthAssessment.${ha}.band == POOR and recommended_action == PLAN_REPLACEMENT"

      - name: invoice_per_line_markup_rounding_beats_sum_rounding
        grounds:
          - calculations.job_invoice_cents
          - entities.TestJob.fields.committed_cost_cents
