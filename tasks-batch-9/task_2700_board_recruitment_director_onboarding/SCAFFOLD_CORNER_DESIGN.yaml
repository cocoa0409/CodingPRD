            - "Candidate.${cand_id}.status is still \"SLATE_ELIGIBLE\" and independence_result == \"INDEPENDENT\""
            - "NominationSlate.${slate_id}.nominee_count == 0, version still ${slate_v1}, status still \"DRAFT\""

      - name: quorum_is_checked_before_approval_and_then_approval_fails_on_its_own
        claim_type: violation_to_error
        grounds:
          - validations.priority_65.ERR_QUORUM_NOT_MET
          - validations.priority_65.ERR_APPROVAL_THRESHOLD_NOT_MET
          - calculations.committee_vote_tally
        distinguishing_aspect: |
          With the default quorum_size 3, a decide call on two CAST ballots returns ERR_QUORUM_NOT_MET; after
          a third ballot the tally is FOR 1, AGAINST 2, so approval_pct is round_half_up(100 * 1 / 3) ==
          33.33 and the same call now returns ERR_APPROVAL_THRESHOLD_NOT_MET. The slate stays in
          COMMITTEE_REVIEW through both refusals and no ballot is voided.
        test_recipe:
          setup:
            - "ACTIVE GovernancePolicy for cycle 2026 with default quorum_size 3 and approval_threshold_pct 66.67."
            - "Three SEATED independent voting directors (one chair, two members) and two SEATED independent incumbents who are the nominees."
            - "A slate for cycle 2026 in COMMITTEE_REVIEW carrying both incumbents, with a FOR ballot from the chair and an AGAINST ballot from the first member."
          setup_api_calls:
            - call: "POST /governance/policies"
              payload: { cycle_year: 2026, effective_from: "2026-01-01T00:00:00Z" }
              as: CorporateSecretary
              captures: { policy_id: $.data.id }
            - call: "POST /governance/directors"
              payload: { full_name: "Cora Chair", email: "cora@issuer.example", birth_date: "1962-01-01", appointed_on: "2019-01-01", initial_service_status: "SEATED", is_independent: true }
              as: CorporateSecretary
              captures: { chair_id: $.data.id }
            - call: "POST /governance/directors"
              payload: { full_name: "Mo Member", email: "mo@issuer.example", birth_date: "1965-01-01", appointed_on: "2020-01-01", initial_service_status: "SEATED", is_independent: true }
              as: CorporateSecretary
              captures: { mem1_id: $.data.id }
            - call: "POST /governance/directors"
              payload: { full_name: "Nia Member", email: "nia@issuer.example", birth_date: "1966-01-01", appointed_on: "2020-01-01", initial_service_status: "SEATED", is_independent: true }
              as: CorporateSecretary
              captures: { mem2_id: $.data.id }
            - call: "POST /governance/directors"
              payload: { full_name: "Nate Nominee", email: "nate@issuer.example", birth_date: "1968-01-01", appointed_on: "2021-01-01", initial_service_status: "SEATED", is_independent: true }
              as: CorporateSecretary
              captures: { nomdir1_id: $.data.id }
            - call: "POST /governance/directors"
              payload: { full_name: "Nora Nominee", email: "nora@issuer.example", birth_date: "1969-01-01", appointed_on: "2021-01-01", initial_service_status: "SEATED", is_independent: true }
              as: CorporateSecretary
              captures: { nomdir2_id: $.data.id }
            - call: "POST /governance/slates"
              payload: { cycle_year: 2026, seat_count: 9 }
              as: CorporateSecretary
              captures: { slate_id: $.data.id, slate_v1: $.data.version }
            - call: "POST /governance/slates/${slate_id}/nominees"
              payload: { ballot_order: 1, incumbent_director_id: "${nomdir1_id}", expected_slate_version: "${slate_v1}" }
              as: GovernanceStaff
              captures: { nom1_id: $.data.id }
            - call: "GET /governance/slates/${slate_id}"
              payload: {}
              as: GovernanceStaff
              captures: { slate_v2: $.data.version }
            - call: "POST /governance/slates/${slate_id}/nominees"
              payload: { ballot_order: 2, incumbent_director_id: "${nomdir2_id}", expected_slate_version: "${slate_v2}" }
              as: GovernanceStaff
              captures: { nom2_id: $.data.id }
