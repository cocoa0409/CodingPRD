              as: PlanAdmin
              captures: { pool_id: "$.data.id" }
            - call: "POST /participants"
              payload: { plan_id: "${plan_id}", business_unit_id: "${unit_id}", employee_code: "E100", full_name: "Mia Mover", job_level: "L3", base_salary_cents: 10000000, hire_date: "2025-06-01" }
              as: PlanAdmin
              captures: { p_id: "$.data.id" }
            - call: "POST /eligibility-events"
              payload: { participant_id: "${p_id}", event_type: "TRANSFER", effective_date: "2026-07-01", new_job_level: "L5", new_base_salary_cents: 20000000, new_business_unit_id: "${unit_id}", note: "promotion to L5" }
              as: HRBusinessPartner
            - call: "POST /eligibility-events"
              payload: { participant_id: "${p_id}", event_type: "LEAVE", effective_date: "2026-03-01", leave_end_date: "2026-05-31", paid_leave: false, note: "unpaid sabbatical, recorded late" }
