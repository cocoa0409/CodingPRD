    input: []
    output: SiteSurvey
    side_effects: []

  - method: GET
    path: "/private-wireless/designs/{id}"
    description: "Get one CoverageDesign by id"
    roles: [NetworkArchitect, RFEngineer]
    code: 200
    input: []
    output: CoverageDesign
    side_effects: []

  - method: GET
    path: "/private-wireless/coordination-requests/{id}"
    description: "Get one SpectrumCoordinationRequest by id"
    roles: [NetworkArchitect, RFEngineer, SpectrumCoordinator, SpectrumRegulator]
    code: 200
    input: []
    output: SpectrumCoordinationRequest
    side_effects: []

  - method: GET
    path: "/private-wireless/spectrum-assignments/{id}"
    description: "Get one SpectrumAssignment by id"
    roles: [NetworkArchitect, RFEngineer, SpectrumCoordinator, SpectrumRegulator, FieldTechnician]
    code: 200
    input: []
    output: SpectrumAssignment
    side_effects: []

  - method: GET
    path: "/private-wireless/slices/{id}"
    description: "Get one NetworkSlice by id"
    roles: [NetworkArchitect, RFEngineer, FieldTechnician]
    code: 200
    input: []
    output: NetworkSlice
    side_effects: []

  - method: GET
    path: "/private-wireless/slice-bindings/{id}"
    description: "Get one SliceBinding by id"
    roles: [NetworkArchitect, FieldTechnician]
    code: 200
    input: []
    output: SliceBinding
    side_effects: []

  - method: GET
    path: "/private-wireless/contracts/{id}"
    description: "Get one ServiceContract by id"
    roles: [NetworkArchitect, SpectrumRegulator]
    code: 200
    input: []
    output: ServiceContract
    side_effects: []

  - method: GET
    path: "/private-wireless/alerts/{id}"
    description: "Get one MonitoringAlert by id"
    roles: [NetworkArchitect, RFEngineer, FieldTechnician]
    code: 200
    input: []
    output: MonitoringAlert
    side_effects: []

  - method: GET
    path: "/private-wireless/remediations/{id}"
    description: "Get one CoverageRemediation by id"
    roles: [NetworkArchitect, RFEngineer, FieldTechnician]
    code: 200
    input: []
    output: CoverageRemediation
    side_effects: []

  # ---- Filtered list GETs for FK reverse-reachability of cross-references ----
  - method: GET
    path: "/private-wireless/surveys"
    description: "Filtered list of SiteSurveys; supports filter by surveyor_id"
    roles: [NetworkArchitect, RFEngineer, FieldTechnician]
    code: 200
    input: ["limit?", "offset?", "site_id?", "surveyor_id?", "status?"]
