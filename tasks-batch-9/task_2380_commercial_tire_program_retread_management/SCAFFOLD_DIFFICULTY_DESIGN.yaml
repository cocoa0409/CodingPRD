              as: PlantScheduler
              captures: { job2_id: $.data.id }
          assert:
            - "before the trigger RetreadLine.${line_id}.booked_minutes == 270 and Casing.${casing_id}.status == RETREAD_QUEUED"
            - "after the cancel RetreadJob.${job1_id}.status == CANCELLED, RetreadLine.${line_id}.booked_minutes == 0 (exactly the pre-scheduling value) and Casing.${casing_id}.status == INSPECTED"
            - "the casing's credit is untouched by the cancel: provisional_credit_cents == 12000 (no ACTIVE agreement, so the DEFAULT_CASING_CREDIT_CENTS rate applies at grade A) and no REVERSAL or ADJUSTMENT row was posted"
            - "re-booking the identical slot returns 201 and RetreadLine.${line_id}.booked_minutes == 270 again — no phantom reservation survived the cancel"
            - "the CANCELLED job still exists as a row and is excluded from the occupying set, so cancellation is additive rather than destructive"

      - name: manifest_void_restores_manifest_totals_and_casing_linkage
        grounds:
          - calculations.scrap_manifest_totals
          - state_machines.ScrapManifest.SIGNED_to_VOIDED
          - entities.ScrapManifest.fields.total_weight_lbs
          - entities.Casing.fields.scrap_manifest_id
        distinguishing_aspect: |
          CONSERVED QUANTITY: the manifest aggregate (tire_count, total_weight_lbs) together
          with the set of casings linked to it — a document-integrity invariant rather than a
          money ledger or a capacity counter. Voiding a SIGNED manifest returns the aggregate
          to (0, 0), clears every scrap_manifest_id, and also discards signed_by_user_id and
          signed_at, while deliberately leaving each casing's REJECTED status alone: voiding
          the paperwork must not un-condemn a tire.
