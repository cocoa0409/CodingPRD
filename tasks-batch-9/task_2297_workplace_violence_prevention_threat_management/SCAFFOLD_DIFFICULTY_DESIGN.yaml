            - call: "POST /employees"
              payload: { worksite_id: "${ws_id}", work_area_id: "${wa_front_id}", full_name: "Sofia Ortiz", job_function: "ADMIN" }
              as: ProgramAdmin
              captures: { so_id: $.data.id }
            - call: "POST /employees"
              payload: { worksite_id: "${ws_id}", work_area_id: "${wa_front_id}", full_name: "Marcus Reed", job_function: "ADMIN" }
              as: ProgramAdmin
              captures: { sm_id: $.data.id }
            - call: "POST /employees"
              payload: { worksite_id: "${ws_id}", work_area_id: "${wa_front_id}", full_name: "Dana Kim", job_function: "ADMIN", team_discipline: "HR" }
              as: ProgramAdmin
              captures: { lead_id: $.data.id }
            - call: "POST /employees"
              payload: { worksite_id: "${ws_id}", work_area_id: "${wa_front_id}", full_name: "Ivan Petrov", job_function: "ADMIN", team_discipline: "SECURITY" }
              as: ProgramAdmin
              captures: { sec_id: $.data.id }
            - call: "POST /employees"
              payload: { worksite_id: "${ws_id}", work_area_id: "${wa_front_id}", full_name: "Grace Liu", job_function: "ADMIN", team_discipline: "OPERATIONS" }
              as: ProgramAdmin
              captures: { ops_id: $.data.id }
            - call: "POST /employees"
              payload: { worksite_id: "${ws_id}", work_area_id: "${wa_front_id}", full_name: "Nora Bell", job_function: "ADMIN", team_discipline: "CLINICAL" }
              as: ProgramAdmin
              captures: { clin_id: $.data.id }
            - call: "POST /employees"
