        distinguishing_aspect: |
          Each of three panels is independently legal — every one is fully seated with complete
          region coverage and a readiness score of 100.00 — but the discipline permits only one
          concurrently active panel. Chartering the first succeeds, the overlapping second is
          rejected on the aggregate capacity rule, and the third, whose window starts exactly
          when the first ends, is chartered even though it overlaps the still-FORMING second
