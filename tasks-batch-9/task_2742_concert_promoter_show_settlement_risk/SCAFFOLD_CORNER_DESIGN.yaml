          setup:
            - "Logical clock 2026-08-01T00:00:00Z. Market Valid Market limit 5000000, Artist Valid Act, Venue Valid Hall cap 1000 / facility 0 / tax 0."
            - "Show SH_A is ON_SALE on an accepted FLAT_GUARANTEE offer of 500000 with one GA tier priced 5000 and allocation 400; 395 seats are sold, so available_qty is exactly 5."
