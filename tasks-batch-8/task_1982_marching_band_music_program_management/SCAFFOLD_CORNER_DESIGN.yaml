  # ---------------------------------------------------------------------------
  - section: endpoints
    instances:
      - name: ledger_subresource_reverse_reachability
        claim_type: computed_read
        grounds: [endpoints]
        distinguishing_aspect: "GET /band/students/{id}/ledger returns exactly that student's Payment rows, newest-capable list shape with envelope."
        test_recipe:
          setup: ["program; enrolled student with MANUAL_DEBIT 1200 and PAYMENT 200"]
          setup_api_calls:
            - { call: "POST /band/programs", payload: { season_name: "LG", music_budget_cents: 100000, repair_budget_cents: 50000 }, as: BandDirector, captures: { prog: $.data.id } }
            - { call: "POST /band/programs/${prog}/advance", payload: { to_state: "ENROLLMENT_OPEN" }, as: BandDirector }
            - { call: "POST /band/students", payload: { program_id: "${prog}", full_name: "LG", grade: 9, section: "BRASS" }, as: BandDirector, captures: { stu: $.data.id } }
            - { call: "POST /band/students/${stu}/enroll", payload: {}, as: BandDirector }
            - { call: "POST /band/payments", payload: { student_id: "${stu}", kind: "MANUAL_DEBIT", amount_cents: 1200 }, as: BoosterTreasurer }
            - { call: "POST /band/payments", payload: { student_id: "${stu}", kind: "PAYMENT", amount_cents: 200 }, as: BoosterTreasurer }
          trigger:
            - { call: "GET /band/students/${stu}/ledger", payload: {}, as: Any }
          assert:
            - "Ledger returns 2 rows with kinds MANUAL_DEBIT(1200) and PAYMENT(200); Student.${stu}.account_balance_cents == 1000"
      - name: retire_checked_out_instrument_rejected
        claim_type: conditional_action
        grounds: [state_machines.Instrument.AVAILABLE_to_RETIRED, "errors[ERR_INSTRUMENT_CHECKED_OUT]"]
        distinguishing_aspect: "Retire is only declared from AVAILABLE/IN_MAINTENANCE; a CHECKED_OUT instrument → ERR_INSTRUMENT_CHECKED_OUT."
        test_recipe:
          setup: ["program; enrolled student with ACTIVE assignment on instrument"]
          setup_api_calls:
            - { call: "POST /band/programs", payload: { season_name: "RC", music_budget_cents: 100000, repair_budget_cents: 50000 }, as: BandDirector, captures: { prog: $.data.id } }
            - { call: "POST /band/programs/${prog}/advance", payload: { to_state: "ENROLLMENT_OPEN" }, as: BandDirector }
            - { call: "POST /band/students", payload: { program_id: "${prog}", full_name: "RC", grade: 9, section: "BRASS" }, as: BandDirector, captures: { stu: $.data.id } }
            - { call: "POST /band/students/${stu}/enroll", payload: {}, as: BandDirector }
            - { call: "POST /band/instruments", payload: { program_id: "${prog}", serial_number: "SN-RC-1", instrument_type: "HORN", replacement_value_cents: 50000 }, as: EquipmentManager, captures: { inst: $.data.id } }
            - { call: "POST /band/instrument-assignments", payload: { student_id: "${stu}", instrument_id: "${inst}", due_date: "2026-08-20T00:00:00Z" }, as: EquipmentManager }
          trigger:
            - { call: "POST /band/instruments/${inst}/retire", payload: {}, as: EquipmentManager, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INSTRUMENT_CHECKED_OUT; Instrument.${inst}.status == CHECKED_OUT"
      - name: trip_supersede_and_active_trip_rejection
        claim_type: conditional_action
        grounds: [state_machines.Trip.PLANNING_to_SUPERSEDED, "errors[ERR_EVENT_HAS_ACTIVE_TRIP]"]
        distinguishing_aspect: "A second trip for the same event supersedes a PLANNING trip; once the first trip is ROSTER_OPEN the second create is rejected with ERR_EVENT_HAS_ACTIVE_TRIP."
        test_recipe:
          setup: ["program; event (version captured); trip T1 PLANNING"]
          setup_api_calls:
            - { call: "POST /band/programs", payload: { season_name: "SP", music_budget_cents: 100000, repair_budget_cents: 50000 }, as: BandDirector, captures: { prog: $.data.id } }
            - { call: "POST /band/programs/${prog}/advance", payload: { to_state: "ENROLLMENT_OPEN" }, as: BandDirector }
            - { call: "POST /band/events", payload: { program_id: "${prog}", event_type: "COMPETITION", facility: "AWAY", starts_at: "2026-09-15T15:00:00Z", ends_at: "2026-09-15T21:00:00Z", is_outdoor: true }, as: BandDirector, captures: { evt: $.data.id, ev_v: $.data.version } }
            - { call: "POST /band/trips", payload: { event_id: "${evt}", expected_event_version: "${ev_v}", capacity: 5, estimated_cost_cents: 5000, departure_at: "2026-09-15T06:00:00Z" }, as: BandDirector, captures: { t1: $.data.id } }
            - { call: "GET /band/events/${evt}", payload: {}, as: Any, captures: { ev_v2: $.data.version } }
          trigger:
            - { call: "POST /band/trips", payload: { event_id: "${evt}", expected_event_version: "${ev_v2}", capacity: 6, estimated_cost_cents: 6000, departure_at: "2026-09-15T06:00:00Z" }, as: BandDirector, captures: { t2: $.data.id } }
            - { call: "POST /band/trips/${t2}/open-roster", payload: {}, as: BandDirector }
            - { call: "GET /band/events/${evt}", payload: {}, as: Any, captures: { ev_v3: $.data.version } }
            - { call: "POST /band/trips", payload: { event_id: "${evt}", expected_event_version: "${ev_v3}", capacity: 7, estimated_cost_cents: 7000, departure_at: "2026-09-15T06:00:00Z" }, as: BandDirector, captures: { err: $.data.error_id } }
          assert:
            - "Trip.${t1}.status == SUPERSEDED after T2 creation"
            - "err == ERR_EVENT_HAS_ACTIVE_TRIP once T2 is ROSTER_OPEN"
      - name: trip_complete_requires_resolved_attendance
        claim_type: conditional_action
        grounds: [state_machines.Trip.FINALIZED_to_COMPLETED, "errors[ERR_UNRESOLVED_ENROLLMENTS_EXIST]"]
        distinguishing_aspect: "complete with a still-CONFIRMED (unmarked) enrollment → ERR_UNRESOLVED_ENROLLMENTS_EXIST; after mark-attendance the complete succeeds."
        test_recipe:
          setup: ["program; event; trip capacity 5 est 5000 dep 2026-09-15; enrolled student paid 5000 CONFIRMED; charter; roster locked; finalized at 5000"]
          setup_api_calls:
            - { call: "POST /band/programs", payload: { season_name: "TC", music_budget_cents: 100000, repair_budget_cents: 50000 }, as: BandDirector, captures: { prog: $.data.id } }
            - { call: "POST /band/programs/${prog}/advance", payload: { to_state: "ENROLLMENT_OPEN" }, as: BandDirector }
            - { call: "POST /band/events", payload: { program_id: "${prog}", event_type: "COMPETITION", facility: "AWAY", starts_at: "2026-09-15T15:00:00Z", ends_at: "2026-09-15T21:00:00Z", is_outdoor: true }, as: BandDirector, captures: { evt: $.data.id, evt_v: $.data.version } }
            - { call: "POST /band/trips", payload: { event_id: "${evt}", expected_event_version: "${evt_v}", capacity: 5, estimated_cost_cents: 5000, departure_at: "2026-09-15T06:00:00Z" }, as: BandDirector, captures: { trip: $.data.id } }
            - { call: "POST /band/trips/${trip}/open-roster", payload: {}, as: BandDirector }
            - { call: "POST /band/students", payload: { program_id: "${prog}", full_name: "TC", grade: 9, section: "BRASS" }, as: BandDirector, captures: { stu: $.data.id } }
            - { call: "POST /band/students/${stu}/enroll", payload: {}, as: BandDirector }
            - { call: "POST /band/trip-enrollments", payload: { trip_id: "${trip}", student_id: "${stu}" }, as: BandDirector, captures: { enr: $.data.id } }
            - { call: "POST /band/payments", payload: { student_id: "${stu}", kind: "PAYMENT", amount_cents: 5000, trip_enrollment_id: "${enr}" }, as: BoosterTreasurer }
            - { call: "POST /band/trip-enrollments/${enr}/confirm", payload: {}, as: BandDirector }
            - { call: "POST /band/truck-charters", payload: { program_id: "${prog}", event_id: "${evt}", vehicle_label: "TRUCK-5", capacity_weight_lb: 2000, capacity_volume_cuft: 200, window_start: "2026-09-15T04:00:00Z", window_end: "2026-09-16T02:00:00Z" }, as: EquipmentManager }
            - { call: "POST /band/trips/${trip}/lock-roster", payload: {}, as: BandDirector }
            - { call: "POST /band/trips/${trip}/finalize", payload: { actual_cost_cents: 5000 }, as: BoosterTreasurer }
          trigger:
            - { call: "POST /band/trips/${trip}/complete", payload: {}, as: BandDirector, captures: { err: $.data.error_id } }
            - { call: "POST /band/trip-enrollments/${enr}/mark-attendance", payload: { outcome: "ATTENDED" }, as: BandDirector }
            - { call: "POST /band/trips/${trip}/complete", payload: {}, as: BandDirector }
          assert:
            - "err == ERR_UNRESOLVED_ENROLLMENTS_EXIST while attendance unresolved"
            - "After ATTENDED: Trip.${trip}.status == COMPLETED; TripEnrollment.${enr}.payment_status == PAID (5000 paid == 5000 final share)"

