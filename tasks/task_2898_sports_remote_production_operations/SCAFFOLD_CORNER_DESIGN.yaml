              captures: { book_c: $.data.id }
          assert:
            - "First two bookings: HTTP 201 each; after them TransmissionPath.${path_id}.committed_mbps_total == 300 and active_booking_count == 2 (200 + 100 == 300 is accepted)"
            - "Overlapping 1 Mbps booking: HTTP 422 with error_id == ERR_PATH_CAPACITY_EXCEEDED and committed_mbps_total still 300"
            - "Adjacent 300 Mbps booking starting exactly at 2026-08-16T02:00:00Z: HTTP 201 with PathBooking.${book_c}.status == RESERVED"
            - "TransmissionPath.${path_id}.committed_mbps_total == 600 and active_booking_count == 3 - the ledger is not window-scoped even though the capacity gate is"
            - "GET /broadcast-ops/path-bookings?path_id=${path_id}&status=RESERVED returns total_count == 3"

      - name: venue_curfew_blocks_going_on_air_at_the_curfew_instant
        claim_type: temporal_validation
        grounds:
          - validations[priority=45]
          - errors[ERR_VENUE_CURFEW_EXCEEDED]
        distinguishing_aspect: |
          Everything about the production is ready - certified readiness 100.00, readiness_hold false,
          show in PRE_SHOW - and the ONLY reason the show cannot start is that the logical clock has
          reached the venue curfew exactly. The gate is strict (now < curfew), so the equality instant
          is refused, and the refusal must be ERR_VENUE_CURFEW_EXCEEDED rather than the readiness or
          stage errors that sit above it in the ladder.
