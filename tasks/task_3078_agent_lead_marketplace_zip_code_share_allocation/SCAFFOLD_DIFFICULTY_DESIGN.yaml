        as: PlatformAdmin
        captures:
          r0: $.data.id
      - call: POST /agents
        payload:
          full_name: R1
          email: r1@x.com
          license_number: L-R1
          license_state: TX
          brokerage_id: ${bro6}
        as: PlatformAdmin
      - call: POST /agents
        payload:
          full_name: R2
          email: r2@x.com
          license_number: L-R2
          license_state: TX
          brokerage_id: ${bro6}
        as: PlatformAdmin
      - call: POST /agents
        payload:
          full_name: R3
          email: r3@x.com
          license_number: L-R3
          license_state: TX
          brokerage_id: ${bro6}
        as: PlatformAdmin
      - call: POST /agents
        payload:
          full_name: R4
          email: r4@x.com
          license_number: L-R4
          license_state: TX
          brokerage_id: ${bro6}
        as: PlatformAdmin
      - call: POST /agents
        payload:
          full_name: R5
          email: r5@x.com
          license_number: L-R5
          license_state: TX
          brokerage_id: ${bro6}
        as: PlatformAdmin
      - call: POST /agents
        payload:
          full_name: R6
          email: r6@x.com
          license_number: L-R6
          license_state: TX
          brokerage_id: ${bro6}
        as: PlatformAdmin
      - call: POST /share-orders
        payload:
          market_id: ${mkt6}
          buyer_agent_id: ${r0}
          share_bps: 6000
          duration_days: 30
        as: Agent
        as_user_id: ${r0}
        captures:
          or0: $.data.id
      - call: POST /share-orders/${or0}/payments
        payload:
          amount_cents: 900000
          outcome: SUCCEEDED
          expected_market_version: ${mkt6_v}
        as: Agent
        as_user_id: ${r0}
      - call: POST /leads
        payload:
          market_id: ${mkt6}
          listing_id: null
          consumer_key: c-race@x.com
          listing_agent_id: null
        as: MarketplaceOps
        captures:
          ldr: $.data.id
      trigger:
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T00:06:00Z'
        as: PlatformAdmin
      - call: POST /ops-runs
        payload: {}
        as: MarketplaceOps
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T00:12:00Z'
        as: PlatformAdmin
      - call: POST /ops-runs
        payload: {}
        as: MarketplaceOps
        captures:
          sweep2: $.data.sweep_counts
      assert:
      - after sweep 1 Lead.${ldr}.lead_status == ROUTED and routing_attempts == 2 (self-loop with a fresh LeadAssignment)
      - the second LeadAssignment's candidate_agent_ids are disjoint from the first offer's (no repeats across attempts)
      - after sweep 2 Lead.${ldr}.lead_status == UNASSIGNED with routing_note 'pool exhausted' (4 agents banned, 3 left < ... none remain eligible
        after 2 attempts x 3 candidates among 7 agents minus order-buyer-only pool rules)
      - ShareOrder.${or0}.credits_cents == 9000 and Lead.${ldr} carries no accepted_agent_id
- rule_id: transitive_cascade
  instances:
  - name: expiry_cascade_to_market_repricing
    grounds:
    - state_machines.ShareOrder.ACTIVE_to_COMPLETED
    - calculations.ops_run_sweep
    - calculations.share_price_quote
    - entities.Market.fields.current_unit_price_cents
    distinguishing_aspect: 'Depth-3 chain from the ops-run trigger: sweep expires the order (hop 1),

      the expiry mutation releases allocated_bps on the Market (hop 2), and the

      released share flips the demand tier so a later quote reprices (hop 3) —

      each hop caused by the previous mutation, not by the sweep directly.

      '
    test_recipe:
      setup:
      - Clock at 2026-09-01T00:00:00Z. Market AZ/85001 base 10000; agent X order 6000 bps ACTIVE with duration 1 day, deposit paid (charged 0
        -> settles).
      - Agent Y waiting to buy 4000 bps.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /markets
        payload:
          zip_code: '85001'
          state_code: AZ
          base_lead_price_cents: 10000
        as: PlatformAdmin
        captures:
          mkt7: $.data.id
          mkt7_v: $.data.version
      - call: POST /brokerages
        payload:
          legal_name: B7 Realty
          primary_state: AZ
        as: PlatformAdmin
        captures:
          bro7: $.data.id
      - call: POST /agents
        payload:
          full_name: X
