# =============================================================================
# task_0777 — §1.9 Scaffold Corner Design (breadth coverage of §1.1–§1.7)
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: creator_creation_returns_201_with_fields
        claim_type: Creation
        grounds: [entities.Creator, endpoints]
        distinguishing_aspect: "POST /creators with email+display_name returns 201; status defaults ACTIVE; ledger fields initialized 0."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /creators"
              payload: { email: "c@x.com", display_name: "Ada" }
              as: PlatformAdmin
              captures: { creator_id: $.data.id }
          assert:
            - "Creator.${creator_id}.status == ACTIVE"
            - "Creator.${creator_id}.available_for_payout_cents == 0"
            - "Creator.${creator_id}.version == 1"

      - name: course_get_non_existent_not_found
        claim_type: Not Found
        grounds: [entities.Course, "errors[ERR_COURSE_NOT_FOUND]"]
        distinguishing_aspect: "GET /courses/{unknown} returns 404 ERR_COURSE_NOT_FOUND."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /courses/00000000-0000-0000-0000-000000000000"
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_COURSE_NOT_FOUND"

      - name: enrollment_missing_required_field_returns_400
        claim_type: Required Fields
        grounds: [entities.Enrollment, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /enrollments without price_plan_id returns 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Published course + student exist"]
          setup_api_calls:
            - call: "POST /creators"
              payload: { email: "c@x.com", display_name: "C" }
              as: PlatformAdmin
              captures: { creator_id: $.data.id }
            - call: "POST /students"
              payload: { email: "s@x.com", full_name: "S" }
              as: PlatformAdmin
              captures: { student_id: $.data.id }
            - call: "POST /courses"
              payload: { creator_id: "${creator_id}", title: "A" }
              as: Creator
              as_user_id: "${creator_id}"
              captures: { course_id: $.data.id }
          trigger:
            - call: "POST /enrollments"
              payload: { student_id: "${student_id}", course_id: "${course_id}" }
              as: Student
              as_user_id: "${student_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST"

      - name: lesson_default_is_published_applied
        claim_type: Defaults
        grounds: [entities.Lesson.fields.is_published, entities.Course.fields.published_lesson_count]
        distinguishing_aspect: "Omitting is_published defaults to true; the lesson counts in Course.published_lesson_count."
        test_recipe:
          setup: ["Course exists"]
          setup_api_calls:
            - call: "POST /creators"
              payload: { email: "c@x.com", display_name: "C" }
              as: PlatformAdmin
              captures: { creator_id: $.data.id }
            - call: "POST /courses"
              payload: { creator_id: "${creator_id}", title: "A" }
              as: Creator
              as_user_id: "${creator_id}"
              captures: { course_id: $.data.id }
            - call: "POST /lessons"
              payload: { course_id: "${course_id}", title: "L1", position: 1 }
              as: Creator
              as_user_id: "${creator_id}"
              captures: { lesson_id: $.data.id }
          trigger:
            - call: "GET /courses/${course_id}"
              as: Creator
              as_user_id: "${creator_id}"
          assert:
            - "Lesson.${lesson_id}.is_published == true"
            - "Course.${course_id}.published_lesson_count == 1"

      - name: course_system_status_ignores_client_input
        claim_type: System Fields
        grounds: [entities.Course.fields.status]
        distinguishing_aspect: "New Course is always DRAFT regardless of client-sent status; status is system-owned."
        test_recipe:
          setup: ["Creator exists"]
          setup_api_calls:
            - call: "POST /creators"
              payload: { email: "c@x.com", display_name: "C" }
              as: PlatformAdmin
              captures: { creator_id: $.data.id }
          trigger:
            - call: "POST /courses"
              payload: { creator_id: "${creator_id}", title: "A" }
              as: Creator
              as_user_id: "${creator_id}"
              captures: { course_id: $.data.id }
          assert:
            - "Course.${course_id}.status == DRAFT"

      - name: coupon_invalid_enum_returns_400
        claim_type: Type Constraints
        grounds: [entities.Coupon.fields.discount_type, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "discount_type outside {PERCENT,FIXED} returns 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Course exists"]
          setup_api_calls:
            - call: "POST /creators"
              payload: { email: "c@x.com", display_name: "C" }
              as: PlatformAdmin
              captures: { creator_id: $.data.id }
            - call: "POST /courses"
              payload: { creator_id: "${creator_id}", title: "A" }
              as: Creator
              as_user_id: "${creator_id}"
              captures: { course_id: $.data.id }
          trigger:
            - call: "POST /coupons"
              payload: { course_id: "${course_id}", code: "X", discount_type: "BOGUS", discount_value: 10, max_redemptions: 5, starts_at: "2026-01-01T00:00:00Z", expires_at: "2026-12-31T00:00:00Z" }
              as: Creator
              as_user_id: "${creator_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: pay_already_paid_invoice_returns_409
        claim_type: Idempotency
        grounds: [state_machines.Invoice.status.PENDING_to_PAID, "errors[ERR_INVOICE_NOT_PAYABLE]"]
        distinguishing_aspect: "Paying an invoice already PAID returns 409 ERR_INVOICE_NOT_PAYABLE (no double charge)."
        test_recipe:
          setup: ["Paid INITIAL invoice on a published ONE_TIME enrollment"]
          setup_api_calls:
            - call: "POST /creators"
              payload: { email: "c@x.com", display_name: "C" }
              as: PlatformAdmin
              captures: { creator_id: $.data.id }
            - call: "POST /students"
              payload: { email: "s@x.com", full_name: "S" }
              as: PlatformAdmin
              captures: { student_id: $.data.id }
            - call: "POST /courses"
              payload: { creator_id: "${creator_id}", title: "A" }
              as: Creator
              as_user_id: "${creator_id}"
              captures: { course_id: $.data.id }
            - call: "POST /lessons"
              payload: { course_id: "${course_id}", title: "L1", position: 1 }
              as: Creator
              as_user_id: "${creator_id}"
            - call: "POST /price-plans"
              payload: { course_id: "${course_id}", plan_type: "ONE_TIME", amount_cents: 20000 }
              as: Creator
              as_user_id: "${creator_id}"
              captures: { plan_id: $.data.id }
            - call: "POST /courses/${course_id}/set-status"
              payload: { status: "PUBLISHED" }
              as: Creator
              as_user_id: "${creator_id}"
            - call: "POST /enrollments"
              payload: { student_id: "${student_id}", course_id: "${course_id}", price_plan_id: "${plan_id}" }
              as: Student
              as_user_id: "${student_id}"
              captures: { enrollment_id: $.data.id }
            - call: "GET /invoices?enrollment_id=${enrollment_id}"
              as: Student
              as_user_id: "${student_id}"
              captures: { inv_id: "$.data[0].id" }
            - call: "POST /invoices/${inv_id}/pay"
              payload: {}
              as: Student
              as_user_id: "${student_id}"
          trigger:
            - call: "POST /invoices/${inv_id}/pay"
              payload: {}
              as: Student
              as_user_id: "${student_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVOICE_NOT_PAYABLE"

      - name: refund_unpaid_invoice_returns_409
        claim_type: invalid_transition
        grounds: [state_machines.Invoice.status.PAID_to_REFUNDED, "errors[ERR_INVOICE_NOT_REFUNDABLE]"]
        distinguishing_aspect: "Refunding a PENDING (unpaid) invoice returns 409 ERR_INVOICE_NOT_REFUNDABLE."
        test_recipe:
          setup: ["Published ONE_TIME enrollment with unpaid INITIAL invoice"]
          setup_api_calls:
            - call: "POST /creators"
              payload: { email: "c@x.com", display_name: "C" }
              as: PlatformAdmin
              captures: { creator_id: $.data.id }
            - call: "POST /students"
              payload: { email: "s@x.com", full_name: "S" }
              as: PlatformAdmin
              captures: { student_id: $.data.id }
            - call: "POST /courses"
              payload: { creator_id: "${creator_id}", title: "A" }
              as: Creator
              as_user_id: "${creator_id}"
              captures: { course_id: $.data.id }
            - call: "POST /lessons"
              payload: { course_id: "${course_id}", title: "L1", position: 1 }
              as: Creator
              as_user_id: "${creator_id}"
            - call: "POST /price-plans"
              payload: { course_id: "${course_id}", plan_type: "ONE_TIME", amount_cents: 20000 }
              as: Creator
              as_user_id: "${creator_id}"
              captures: { plan_id: $.data.id }
            - call: "POST /courses/${course_id}/set-status"
              payload: { status: "PUBLISHED" }
              as: Creator
              as_user_id: "${creator_id}"
            - call: "POST /enrollments"
              payload: { student_id: "${student_id}", course_id: "${course_id}", price_plan_id: "${plan_id}" }
              as: Student
              as_user_id: "${student_id}"
              captures: { enrollment_id: $.data.id }
            - call: "GET /invoices?enrollment_id=${enrollment_id}"
              as: Student
              as_user_id: "${student_id}"
              captures: { inv_id: "$.data[0].id" }
          trigger:
            - call: "POST /invoices/${inv_id}/refund"
              payload: {}
              as: Creator
              as_user_id: "${creator_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVOICE_NOT_REFUNDABLE"

      - name: publish_course_without_lesson_returns_409
        claim_type: Precondition Enforcement
        grounds: [state_machines.Course.status.DRAFT_to_PUBLISHED, "errors[ERR_COURSE_INVALID_STATUS_TRANSITION]"]
        distinguishing_aspect: "Publishing a course with 0 published lessons returns 409 ERR_COURSE_INVALID_STATUS_TRANSITION."
        test_recipe:
          setup: ["DRAFT course with an ACTIVE plan but no lessons"]
          setup_api_calls:
            - call: "POST /creators"
              payload: { email: "c@x.com", display_name: "C" }
              as: PlatformAdmin
              captures: { creator_id: $.data.id }
            - call: "POST /courses"
              payload: { creator_id: "${creator_id}", title: "A" }
              as: Creator
              as_user_id: "${creator_id}"
              captures: { course_id: $.data.id }
            - call: "POST /price-plans"
              payload: { course_id: "${course_id}", plan_type: "ONE_TIME", amount_cents: 20000 }
              as: Creator
              as_user_id: "${creator_id}"
          trigger:
            - call: "POST /courses/${course_id}/set-status"
              payload: { status: "PUBLISHED" }
              as: Creator
              as_user_id: "${creator_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_COURSE_INVALID_STATUS_TRANSITION"

      - name: payout_requested_to_paid_skip_returns_409
        claim_type: invalid_transition
        grounds: [state_machines.Payout.status.PROCESSING_to_PAID, "errors[ERR_PAYOUT_INVALID_STATUS_TRANSITION]"]
        distinguishing_aspect: "Advancing a REQUESTED payout straight to PAID (skipping PROCESSING) returns 409 ERR_PAYOUT_INVALID_STATUS_TRANSITION."
        test_recipe:
          setup: ["Creator with settled balance 18000 and one REQUESTED payout for 5000"]
          setup_api_calls:
            - call: "POST /creators"
              payload: { email: "c@x.com", display_name: "C" }
              as: PlatformAdmin
              captures: { creator_id: $.data.id }
            - call: "POST /students"
              payload: { email: "s@x.com", full_name: "S" }
              as: PlatformAdmin
              captures: { student_id: $.data.id }
            - call: "POST /courses"
              payload: { creator_id: "${creator_id}", title: "A", refund_window_days: 14 }
              as: Creator
              as_user_id: "${creator_id}"
              captures: { course_id: $.data.id }
            - call: "POST /lessons"
              payload: { course_id: "${course_id}", title: "L1", position: 1 }
              as: Creator
              as_user_id: "${creator_id}"
            - call: "POST /price-plans"
              payload: { course_id: "${course_id}", plan_type: "ONE_TIME", amount_cents: 20000 }
              as: Creator
              as_user_id: "${creator_id}"
              captures: { plan_id: $.data.id }
            - call: "POST /courses/${course_id}/set-status"
              payload: { status: "PUBLISHED" }
              as: Creator
              as_user_id: "${creator_id}"
            - call: "POST /enrollments"
              payload: { student_id: "${student_id}", course_id: "${course_id}", price_plan_id: "${plan_id}" }
              as: Student
              as_user_id: "${student_id}"
              captures: { enrollment_id: $.data.id }
            - call: "GET /invoices?enrollment_id=${enrollment_id}"
              as: Student
              as_user_id: "${student_id}"
              captures: { inv_id: "$.data[0].id" }
            - call: "POST /invoices/${inv_id}/pay"
              payload: {}
              as: Student
              as_user_id: "${student_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-16T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /creators/${creator_id}"
              as: Creator
              as_user_id: "${creator_id}"
              captures: { cv: $.data.version }
            - call: "POST /creators/${creator_id}/payouts"
              payload: { amount_cents: 5000, expected_creator_version: "${cv}" }
              as: Creator
              as_user_id: "${creator_id}"
              captures: { payout_id: $.data.id }
          trigger:
            - call: "POST /payouts/${payout_id}/set-status"
              payload: { status: "PAID" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_PAYOUT_INVALID_STATUS_TRANSITION"

      - name: cancel_enrollment_after_payment_returns_409
        claim_type: Precondition Enforcement
        grounds: [state_machines.Enrollment.billing_status.PENDING_to_CANCELLED, "errors[ERR_ENROLLMENT_INVALID_STATE]"]
        distinguishing_aspect: "Cancelling an enrollment that has a PAID invoice returns 409 ERR_ENROLLMENT_INVALID_STATE (cancel is pre-payment only)."
        test_recipe:
          setup: ["Paid ACTIVE ONE_TIME enrollment"]
          setup_api_calls:
            - call: "POST /creators"
              payload: { email: "c@x.com", display_name: "C" }
              as: PlatformAdmin
              captures: { creator_id: $.data.id }
            - call: "POST /students"
              payload: { email: "s@x.com", full_name: "S" }
              as: PlatformAdmin
              captures: { student_id: $.data.id }
            - call: "POST /courses"
              payload: { creator_id: "${creator_id}", title: "A" }
              as: Creator
              as_user_id: "${creator_id}"
              captures: { course_id: $.data.id }
            - call: "POST /lessons"
              payload: { course_id: "${course_id}", title: "L1", position: 1 }
              as: Creator
              as_user_id: "${creator_id}"
            - call: "POST /price-plans"
              payload: { course_id: "${course_id}", plan_type: "ONE_TIME", amount_cents: 20000 }
              as: Creator
              as_user_id: "${creator_id}"
              captures: { plan_id: $.data.id }
            - call: "POST /courses/${course_id}/set-status"
              payload: { status: "PUBLISHED" }
              as: Creator
              as_user_id: "${creator_id}"
            - call: "POST /enrollments"
              payload: { student_id: "${student_id}", course_id: "${course_id}", price_plan_id: "${plan_id}" }
              as: Student
              as_user_id: "${student_id}"
              captures: { enrollment_id: $.data.id }
            - call: "GET /invoices?enrollment_id=${enrollment_id}"
              as: Student
              as_user_id: "${student_id}"
              captures: { inv_id: "$.data[0].id" }
            - call: "POST /invoices/${inv_id}/pay"
              payload: {}
              as: Student
              as_user_id: "${student_id}"
          trigger:
            - call: "POST /enrollments/${enrollment_id}/cancel"
              payload: {}
              as: Student
              as_user_id: "${student_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_ENROLLMENT_INVALID_STATE"

  # ===========================================================================
  - section: calculations
    instances:
      - name: fixed_coupon_discount_applied
        claim_type: Correct Result
        grounds: [calculations.checkout_charge, entities.Enrollment.fields.discount_cents]
        distinguishing_aspect: "FIXED coupon value 3000 (< list 20000) yields discount_cents==3000, initial_charge_cents==17000."
        test_recipe:
          setup: ["Published ONE_TIME 20000 course with ACTIVE FIXED-3000 coupon FIX3K"]
          setup_api_calls:
            - call: "POST /creators"
              payload: { email: "c@x.com", display_name: "C" }
              as: PlatformAdmin
              captures: { creator_id: $.data.id }
            - call: "POST /students"
              payload: { email: "s@x.com", full_name: "S" }
              as: PlatformAdmin
              captures: { student_id: $.data.id }
            - call: "POST /courses"
              payload: { creator_id: "${creator_id}", title: "A" }
              as: Creator
              as_user_id: "${creator_id}"
              captures: { course_id: $.data.id }
            - call: "POST /lessons"
              payload: { course_id: "${course_id}", title: "L1", position: 1 }
              as: Creator
              as_user_id: "${creator_id}"
            - call: "POST /price-plans"
              payload: { course_id: "${course_id}", plan_type: "ONE_TIME", amount_cents: 20000 }
              as: Creator
              as_user_id: "${creator_id}"
              captures: { plan_id: $.data.id }
            - call: "POST /coupons"
              payload: { course_id: "${course_id}", code: "FIX3K", discount_type: "FIXED", discount_value: 3000, max_redemptions: 5, starts_at: "2026-01-01T00:00:00Z", expires_at: "2026-12-31T00:00:00Z" }
              as: Creator
              as_user_id: "${creator_id}"
            - call: "POST /courses/${course_id}/set-status"
              payload: { status: "PUBLISHED" }
              as: Creator
              as_user_id: "${creator_id}"
          trigger:
            - call: "POST /enrollments"
              payload: { student_id: "${student_id}", course_id: "${course_id}", price_plan_id: "${plan_id}", coupon_code: "FIX3K" }
              as: Student
              as_user_id: "${student_id}"
              captures: { enrollment_id: $.data.id }
          assert:
            - "Enrollment.${enrollment_id}.discount_cents == 3000"
            - "Enrollment.${enrollment_id}.initial_charge_cents == 17000"

      - name: installment_split_sums_to_discounted_total
        claim_type: waterfall_allocation
        grounds: [calculations.installment_split, entities.Invoice.fields.amount_cents]
        distinguishing_aspect: "PAYMENT_PLAN 10000/3 creates three invoices whose amounts sum to 10000; first two 3334, last 3332 (remainder)."
        test_recipe:
          setup: ["Published PAYMENT_PLAN 10000 num_installments 3 enrollment; three invoices created"]
          setup_api_calls:
            - call: "POST /creators"
              payload: { email: "c@x.com", display_name: "C" }
              as: PlatformAdmin
              captures: { creator_id: $.data.id }
            - call: "POST /students"
              payload: { email: "s@x.com", full_name: "S" }
              as: PlatformAdmin
              captures: { student_id: $.data.id }
            - call: "POST /courses"
              payload: { creator_id: "${creator_id}", title: "A" }
              as: Creator
              as_user_id: "${creator_id}"
              captures: { course_id: $.data.id }
            - call: "POST /lessons"
              payload: { course_id: "${course_id}", title: "L1", position: 1 }
              as: Creator
              as_user_id: "${creator_id}"
            - call: "POST /price-plans"
              payload: { course_id: "${course_id}", plan_type: "PAYMENT_PLAN", amount_cents: 10000, num_installments: 3 }
              as: Creator
              as_user_id: "${creator_id}"
              captures: { plan_id: $.data.id }
            - call: "POST /courses/${course_id}/set-status"
              payload: { status: "PUBLISHED" }
              as: Creator
              as_user_id: "${creator_id}"
            - call: "POST /enrollments"
              payload: { student_id: "${student_id}", course_id: "${course_id}", price_plan_id: "${plan_id}" }
              as: Student
              as_user_id: "${student_id}"
              captures: { enrollment_id: $.data.id }
          trigger:
            - call: "GET /enrollments/${enrollment_id}"
              as: Student
              as_user_id: "${student_id}"
          assert:
            - "Enrollment.${enrollment_id}.scheduled_total_cents == 10000"
            - "Enrollment.${enrollment_id}.initial_charge_cents == 3334"

      - name: quiz_attempt_passed_inclusive_boundary
        claim_type: Correct Result
        grounds: [entities.QuizAttempt.fields.passed]
        distinguishing_aspect: "Quiz score equal to quiz_passing_score (70==70) yields passed==true (inclusive >=)."
        test_recipe:
          setup: ["Paid ACTIVE enrollment; lesson is_quiz_required=true passing 70"]
          setup_api_calls:
            - call: "POST /creators"
              payload: { email: "c@x.com", display_name: "C" }
              as: PlatformAdmin
              captures: { creator_id: $.data.id }
            - call: "POST /students"
              payload: { email: "s@x.com", full_name: "S" }
              as: PlatformAdmin
              captures: { student_id: $.data.id }
            - call: "POST /courses"
              payload: { creator_id: "${creator_id}", title: "A" }
              as: Creator
              as_user_id: "${creator_id}"
              captures: { course_id: $.data.id }
            - call: "POST /lessons"
              payload: { course_id: "${course_id}", title: "L1", position: 1, is_quiz_required: true, quiz_passing_score: 70 }
              as: Creator
              as_user_id: "${creator_id}"
              captures: { lesson_id: $.data.id }
            - call: "POST /price-plans"
              payload: { course_id: "${course_id}", plan_type: "ONE_TIME", amount_cents: 20000 }
              as: Creator
              as_user_id: "${creator_id}"
              captures: { plan_id: $.data.id }
            - call: "POST /courses/${course_id}/set-status"
              payload: { status: "PUBLISHED" }
              as: Creator
              as_user_id: "${creator_id}"
            - call: "POST /enrollments"
              payload: { student_id: "${student_id}", course_id: "${course_id}", price_plan_id: "${plan_id}" }
              as: Student
              as_user_id: "${student_id}"
              captures: { enrollment_id: $.data.id }
            - call: "GET /invoices?enrollment_id=${enrollment_id}"
              as: Student
              as_user_id: "${student_id}"
              captures: { inv_id: "$.data[0].id" }
            - call: "POST /invoices/${inv_id}/pay"
              payload: {}
              as: Student
              as_user_id: "${student_id}"
          trigger:
            - call: "POST /enrollments/${enrollment_id}/quiz-attempts"
              payload: { lesson_id: "${lesson_id}", score: 70 }
