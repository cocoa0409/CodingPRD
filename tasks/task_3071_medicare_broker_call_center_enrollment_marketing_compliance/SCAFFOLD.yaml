# =============================================================================
# PRD Benchmark Seed Tables — task_3071
# Medicare Broker Call Center Enrollment & Marketing Compliance (eHealth)
# Difficulty target: beyond Expert (dense, tightly coupled, 9 difficulty rules
# each grounded twice, plus a full breadth corner index).
# =============================================================================

scenario: |
  Medicare Broker Call Center Enrollment & Marketing Compliance (eHealth): licensed agent
  staffing by state with appointment and certification requirements across carriers, scope of
  appointment capture before discussing plan types with retention of the record, call recording
  and retention obligations with disclaimer scripting and marketing rule adherence, plan
  comparison generation from formulary, pharmacy network and provider directory data,
  enrollment submission to carriers with acknowledgment and effectuation tracking, commission
  accounting with initial and renewal rates, rapid disenrollment chargebacks and carrier
  reconciliation, annual enrollment period staffing surge and licensing pipeline, complaint and
  secret shopper findings driving agent coaching

domain_name: medicare-broker-compliance
api_prefix: /

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation
    - rate_threshold_triggers
    - selector_policy
  entity_topology: flat
  state_machine_shape: compound
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - polymorphic
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# Table 1: Entity Relationship Table  (§1.1)
# =============================================================================
entities:
  - name: Agency
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Licensed brokerage / call-center legal name" }
      - { name: service_center_code, type: string, source: input, description: "Internal call-center site code" }
      - { name: aep_start_date, type: datetime, source: input, description: "Annual Enrollment Period open instant (ISO 8601 UTC)" }
      - { name: aep_end_date, type: datetime, source: input, description: "Annual Enrollment Period close instant (inclusive)" }
      - { name: aep_daily_submission_capacity, type: integer, source: input, description: "Maximum enrollment submissions that may carry an effective_date on any single AEP day" }
      - { name: recording_retention_days, type: integer, source: input, default: 2555, description: "Days a call recording must be retained" }
      - { name: soa_retention_days, type: integer, source: input, default: 3650, description: "Days a Scope of Appointment record must be retained" }
      - { name: soa_max_age_days, type: integer, source: input, default: 30, description: "Maximum age in days of a Scope of Appointment at enrollment submission" }
      - { name: rapid_disenrollment_day_limit, type: integer, source: input, default: 90, description: "Days from effective_date within which disenrollment is RAPID" }
      - { name: max_live_calls_per_agent, type: integer, source: input, default: 1, description: "Maximum live call intervals per agent, enforced by the overlap rule of §1.4 priority 10" }
      - { name: max_open_coaching_per_agent, type: integer, source: input, default: 2, description: "Maximum coaching assignments that may be open at once per agent" }
      - { name: compliance_posture, type: enum, source: computed, default: OPEN, description: "Derived agency posture that gates every child operation", constraints: "enum: OPEN | RESTRICTED | FROZEN" }
      - { name: posture_since, type: datetime, source: computed, description: "Instant the current compliance_posture was last set" }
      - { name: substantiated_complaint_rate, type: number, source: computed, description: "substantiated complaints divided by completed call sessions, 6dp" }
      - { name: loss_ratio, type: number, source: computed, description: "Finalized negative chargeback entries divided by the live book size, 6dp" }
      - { name: open_complaint_count, type: integer, source: computed, description: "Count of complaints in status OPEN or UNDER_REVIEW" }
      - { name: commission_balance_cents, type: number, source: computed, description: "Conserved money quantity: sum of amount_cents over every CommissionLedgerEntry whose status IN {PROVISIONAL, FINALIZED}" }

  - name: Carrier
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Carrier legal name" }
      - { name: naic_number, type: string, source: input, description: "NAIC company code" }
      - { name: contract_type, type: enum, source: input, description: "Whether the agency may appoint and enroll through this carrier", constraints: "enum: CONTRACTED | MARKETING_ONLY" }
      - { name: initial_commission_rate_pct, type: number, source: input, description: "First-year commission rate as a decimal fraction" }
      - { name: renewal_commission_rate_pct, type: number, source: input, description: "Renewal-year commission rate as a decimal fraction" }
      - { name: chargeback_clawback_pct, type: number, source: input, description: "Fraction of the initial commission clawed back on a rapid disenrollment" }
      - { name: ack_expected_within_days, type: integer, source: input, default: 5, description: "Days after submitted_on within which an acknowledgment is expected" }
      - { name: effectuation_expected_within_days, type: integer, source: input, default: 30, description: "Days after acknowledged_on within which effectuation is expected" }
      - { name: status, type: enum, source: system, description: "Carrier contracting status", constraints: "enum: ACTIVE | SUSPENDED" }

  - name: Agent
    parent: Agency
    common_fields: true
    fields:
      - { name: agency_id, type: string, source: input, description: "FK -> Agency.id; owning call center" }
      - { name: full_name, type: string, source: input, description: "Licensed agent full legal name" }
      - { name: national_producer_number, type: string, source: input, description: "NPN, unique within the agency" }
      - { name: hire_date, type: datetime, source: input, description: "Employment start instant" }
      - { name: status, type: enum, source: system, description: "Licensing pipeline and staffing status", constraints: "enum: PROVISIONING | LICENSED | CERTIFIED | ACTIVE | SUSPENDED | TERMINATED" }
      - { name: licensed_state_count, type: integer, source: computed, description: "Count of AgentStateLicense rows whose license_status == VALID" }
      - { name: certified_carrier_count, type: integer, source: computed, description: "Count of CarrierCertification rows in status CERTIFIED" }
      - { name: appointed_carrier_count, type: integer, source: computed, description: "Count of CarrierAppointment rows in status APPOINTED" }
      - { name: live_call_count, type: integer, source: computed, description: "Count of this agent's call sessions currently in status IN_PROGRESS" }
      - { name: active_enrollment_count, type: integer, source: computed, description: "Count of this agent's enrollments whose disenrollment_status == ENROLLED" }
      - { name: chargeback_tier, type: integer, source: computed, default: 0, description: "Increments by one on every rapid-disenrollment chargeback posted against this agent" }
      - { name: substantiated_complaint_count, type: integer, source: computed, default: 0, description: "Conserved strike quantity: substantiated complaints net of appeal reversals" }
      - { name: compliance_risk_score, type: number, source: computed, description: "Weighted compliance risk score, 2 decimal places" }
      - { name: coaching_flag, type: boolean, source: computed, default: false, description: "True while any CoachingAssignment for this agent is open" }
      - { name: open_coaching_count, type: integer, source: computed, description: "Count of CoachingAssignment rows in status ASSIGNED or IN_PROGRESS" }

  - name: AgentStateLicense
    parent: Agent
    common_fields: true
    fields:
      - { name: agent_id, type: string, source: input, description: "FK -> Agent.id; licensed agent" }
      - { name: state_code, type: string, source: input, description: "Two-letter state code of the resident/non-resident license" }
      - { name: license_number, type: string, source: input, description: "State-issued producer license number" }
      - { name: issued_on, type: datetime, source: input, description: "License issue instant" }
      - { name: expires_on, type: datetime, source: input, description: "License expiry instant" }
      - { name: license_status, type: enum, source: computed, description: "Derived on every read from the logical clock against expires_on", constraints: "enum: VALID | LAPSED" }

  - name: CarrierAppointment
    parent: Agent
    common_fields: true
    fields:
      - { name: agent_id, type: string, source: input, description: "FK -> Agent.id; agent seeking appointment" }
      - { name: carrier_id, type: string, source: input, description: "FK -> Carrier.id; appointing carrier" }
      - { name: state_code, type: string, source: input, description: "State the appointment authorizes" }
      - { name: requested_on, type: datetime, source: input, description: "Instant the appointment was requested" }
      - { name: appointed_on, type: datetime, source: system, description: "Instant the carrier granted the appointment" }
      - { name: terminated_on, type: datetime, source: system, description: "Instant the appointment ended" }
      - { name: status, type: enum, source: system, description: "Appointment lifecycle status", constraints: "enum: REQUESTED | APPOINTED | REJECTED | TERMINATED" }

  - name: CarrierCertification
    parent: Agent
    common_fields: true
    fields:
      - { name: agent_id, type: string, source: input, description: "FK -> Agent.id; certified agent" }
      - { name: carrier_id, type: string, source: input, description: "FK -> Carrier.id; certifying carrier" }
      - { name: product_type, type: enum, source: input, description: "Product line the certification covers", constraints: "enum: MA | MAPD | PDP | SNP" }
      - { name: certified_on, type: datetime, source: system, description: "Instant certification was granted" }
      - { name: expires_on, type: datetime, source: input, description: "Certification expiry instant (annual re-certification)" }
      - { name: status, type: enum, source: system, description: "Certification lifecycle status", constraints: "enum: PENDING | CERTIFIED | EXPIRED | REVOKED" }

  - name: Member
    parent: Agency
    common_fields: true
    fields:
      - { name: agency_id, type: string, source: input, description: "FK -> Agency.id; agency that owns the beneficiary book" }
      - { name: full_name, type: string, source: input, description: "Medicare beneficiary full name" }
      - { name: medicare_beneficiary_id, type: string, source: input, description: "CMS Medicare Beneficiary Identifier (MBI)" }
      - { name: date_of_birth, type: datetime, source: input, description: "Beneficiary date of birth" }
      - { name: state_code, type: string, source: input, description: "Beneficiary state of residence" }
      - { name: county_code, type: string, source: input, description: "Beneficiary county FIPS code" }
      - { name: drug_list, type: array, source: input, description: "Array of {drug_name, rxcui, monthly_fills} entries used for plan comparison" }
      - { name: provider_npis, type: array, source: input, description: "Array of provider NPI strings the beneficiary wants kept in network" }
      - { name: enrollment_count, type: integer, source: computed, description: "Count of this member's enrollments in any status" }

  - name: ScopeOfAppointment
    parent: Member
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; beneficiary granting the appointment" }
      - { name: agent_id, type: string, source: input, description: "FK -> Agent.id; agent who captured the scope" }
      - { name: capture_channel, type: enum, source: input, description: "Channel the scope was captured through", constraints: "enum: TELEPHONIC_RECORDED | WRITTEN | ELECTRONIC" }
      - { name: plan_types_authorized, type: array, source: input, description: "Plan types the beneficiary authorized discussion of, from {MA, MAPD, PDP, SNP}" }
      - { name: captured_on, type: datetime, source: input, description: "Instant the scope of appointment was captured" }
      - { name: expires_on, type: datetime, source: computed, description: "captured_on plus Agency.soa_max_age_days" }
      - { name: retained_until, type: datetime, source: computed, description: "captured_on plus Agency.soa_retention_days" }
      - { name: consumed_by_enrollment_id, type: string, source: computed, description: "id of the enrollment that consumed this scope, null until consumed" }
      - { name: status, type: enum, source: system, description: "Scope lifecycle status", constraints: "enum: CAPTURED | CONSUMED | VOIDED" }

  - name: CallSession
    parent: Agent
    common_fields: true
    fields:
      - { name: agent_id, type: string, source: input, description: "FK -> Agent.id; agent handling the call" }
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; beneficiary on the call" }
      - { name: scope_of_appointment_id, type: string, source: input, description: "FK -> ScopeOfAppointment.id; scope attached to this call before any plan type is discussed" }
      - { name: started_at, type: datetime, source: input, description: "Live interval open instant" }
      - { name: scheduled_end_at, type: datetime, source: input, description: "Live interval close instant; the live-call interval is [started_at, scheduled_end_at)" }
      - { name: actual_end_at, type: datetime, source: system, description: "Instant the call actually terminated" }
      - { name: recording_id, type: string, source: input, description: "Carrier or telephony recording identifier, null when no recording exists" }
      - { name: recording_retained_until, type: datetime, source: computed, description: "started_at plus Agency.recording_retention_days" }
      - { name: recording_status, type: enum, source: computed, description: "Derived on read against the logical clock", constraints: "enum: RECORDED | MISSING | EXPIRED" }
      - { name: disclaimer_script_code, type: string, source: input, description: "Code of the CMS disclaimer script that must be played" }
      - { name: disclaimer_delivered, type: boolean, source: input, description: "Whether the required disclaimer was delivered before plan discussion" }
      - { name: marketing_rule_set_version, type: string, source: input, description: "Marketing rule set version in force for this call" }
      - { name: status, type: enum, source: system, description: "Call lifecycle status", constraints: "enum: RINGING | IN_PROGRESS | COMPLETED | DROPPED | AMENDED" }

  - name: Plan
    parent: Carrier
    common_fields: true
    fields:
      - { name: carrier_id, type: string, source: input, description: "FK -> Carrier.id; sponsoring carrier" }
      - { name: plan_id_code, type: string, source: input, description: "CMS plan identifier, e.g. H1234-001-000" }
      - { name: plan_type, type: enum, source: input, description: "Product type of the plan", constraints: "enum: MA | MAPD | PDP | SNP" }
      - { name: state_code, type: string, source: input, description: "Service-area state" }
      - { name: county_code, type: string, source: input, description: "Service-area county FIPS code" }
      - { name: monthly_premium_cents, type: integer, source: input, description: "Part C/D monthly premium in cents, non-negative" }
      - { name: annual_drug_deductible_cents, type: integer, source: input, description: "Annual Part D deductible in cents" }
      - { name: star_rating, type: number, source: input, description: "CMS star rating, one decimal place, range 1.0-5.0" }
      - { name: formulary_id, type: string, source: input, description: "Formulary version identifier" }
      - { name: pharmacy_network_id, type: string, source: input, description: "Pharmacy network version identifier" }
      - { name: provider_directory_id, type: string, source: input, description: "Provider directory version identifier" }
      - { name: enrolled_member_count, type: integer, source: computed, description: "Conserved cardinality: count of enrollments on this plan with disenrollment_status == ENROLLED" }
      - { name: status, type: enum, source: system, description: "Plan marketing status", constraints: "enum: ACTIVE | TERMINATED" }

  - name: FormularyDrug
    parent: Plan
    common_fields: true
    fields:
      - { name: plan_id, type: string, source: input, description: "FK -> Plan.id; plan the formulary row belongs to" }
      - { name: drug_name, type: string, source: input, description: "Drug name as listed on the formulary" }
      - { name: rxcui, type: string, source: input, description: "RxNorm concept unique identifier" }
      - { name: tier, type: integer, source: input, description: "Formulary tier 1-5" }
      - { name: monthly_copay_cents, type: integer, source: input, description: "30-day tier copay in cents" }
      - { name: prior_authorization_required, type: boolean, source: input, description: "Whether the drug needs prior authorization" }
      - { name: covered, type: boolean, source: input, default: true, description: "Whether the drug is covered at all" }
      - { name: quantity_limit_days, type: integer, source: input, default: 30, description: "Days of supply each copay covers" }

  - name: PharmacyNetworkEntry
    parent: Plan
    common_fields: false
    fields:
      - { name: plan_id, type: string, source: input, description: "FK -> Plan.id; plan whose network this pharmacy belongs to" }
      - { name: pharmacy_npi, type: string, source: input, description: "Pharmacy NPI" }
      - { name: pharmacy_name, type: string, source: input, description: "Pharmacy trading name" }
      - { name: network_tier, type: enum, source: input, description: "Network position of the pharmacy", constraints: "enum: PREFERRED | STANDARD | OUT_OF_NETWORK" }
      - { name: cost_share_multiplier_pct, type: number, source: input, description: "Multiplier applied to the tier copay for this pharmacy, 1.0 for PREFERRED" }

  - name: ProviderDirectoryEntry
    parent: Plan
    common_fields: true
    fields:
      - { name: plan_id, type: string, source: input, description: "FK -> Plan.id; plan whose directory this provider belongs to" }
      - { name: provider_npi, type: string, source: input, description: "Provider NPI" }
      - { name: provider_name, type: string, source: input, description: "Provider name" }
      - { name: specialty, type: string, source: input, description: "Provider specialty" }
      - { name: network_status, type: enum, source: input, description: "Directory network position", constraints: "enum: IN_NETWORK | OUT_OF_NETWORK" }
      - { name: accepting_new_patients, type: boolean, source: input, description: "Whether the provider is accepting new patients" }
      - { name: last_attested_on, type: datetime, source: input, description: "Instant the directory row was last attested" }

  - name: Enrollment
    parent: CallSession
    common_fields: true
    fields:
      - { name: call_session_id, type: string, source: input, description: "FK -> CallSession.id; call the enrollment was submitted from" }
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; enrolling beneficiary" }
      - { name: plan_id, type: string, source: input, description: "FK -> Plan.id; plan being elected" }
      - { name: agent_id, type: string, source: input, description: "FK -> Agent.id; submitting agent" }
      - { name: scope_of_appointment_id, type: string, source: input, description: "FK -> ScopeOfAppointment.id; scope authorizing this submission" }
      - { name: carrier_id, type: string, source: input, description: "FK -> Carrier.id; receiving carrier" }
      - { name: effective_date, type: datetime, source: input, description: "Requested plan effective date" }
      - { name: submitted_on, type: datetime, source: system, description: "Instant the enrollment was submitted, from the logical clock" }
      - { name: acknowledged_on, type: datetime, source: system, description: "Instant the carrier acknowledged, null until acknowledged" }
      - { name: effectuated_on, type: datetime, source: system, description: "Instant the carrier effectuated, null until effectuated" }
      - { name: submission_status, type: enum, source: system, description: "Carrier-side submission dimension", constraints: "enum: SUBMITTED | ACKNOWLEDGED | EFFECTUATED | REJECTED | WITHDRAWN" }
      - { name: disenrollment_status, type: enum, source: system, description: "Membership dimension, evolves independently of submission_status", constraints: "enum: NOT_APPLICABLE | ENROLLED | RAPID_DISENROLLED | STANDARD_DISENROLLED" }
      - { name: disenrollment_date, type: datetime, source: system, description: "Instant the beneficiary left the plan, null while enrolled" }
      - { name: disenrollment_reason, type: string, source: input, description: "Reason code supplied with the disenrollment request" }
      - { name: disenrolled_day_number, type: integer, source: computed, description: "Whole days from effective_date to disenrollment_date, null while enrolled" }
      - { name: is_rapid_disenrollment, type: boolean, source: computed, description: "True when disenrolled_day_number <= Agency.rapid_disenrollment_day_limit" }
      - { name: provisional_commission_cents, type: number, source: computed, description: "Forward-looking book-of-business commission at submission, 2dp" }
      - { name: final_commission_cents, type: number, source: computed, description: "Chronological as-earned commission, 2dp" }

  - name: CommissionLedgerEntry
    parent: Enrollment
    common_fields: true
    fields:
      - { name: enrollment_id, type: string, source: input, description: "FK -> Enrollment.id; enrollment the entry accrues against" }
      - { name: carrier_reconciliation_id, type: string, source: input, description: "FK -> CarrierReconciliation.id; reconciliation period the entry is presented in" }
      - { name: entry_type, type: enum, source: system, description: "Ledger entry classification", constraints: "enum: INITIAL | RENEWAL | CHARGEBACK | ADJUSTMENT | REVERSAL" }
      - { name: amount_cents, type: number, source: computed, description: "Signed amount in cents; chargebacks are negative" }
      - { name: period_month, type: string, source: input, description: "Accounting month in YYYY-MM form" }
      - { name: posted_on, type: datetime, source: system, description: "Instant the entry was posted, from the logical clock" }
      - { name: status, type: enum, source: system, description: "Ledger posting status", constraints: "enum: PROVISIONAL | FINALIZED | REVERSED" }
      - { name: clawback_pct_applied, type: number, source: computed, description: "Clawback percentage selected by the agent chargeback tier at post time" }
      - { name: memo, type: string, source: input, description: "Free-text operational memo" }

  - name: CarrierReconciliation
    parent: Carrier
    common_fields: true
    fields:
      - { name: carrier_id, type: string, source: input, description: "FK -> Carrier.id; carrier being reconciled" }
      - { name: period_month, type: string, source: input, description: "Accounting month being reconciled, YYYY-MM" }
      - { name: carrier_reported_total_cents, type: integer, source: input, description: "Total the carrier reports as payable for the month" }
      - { name: internal_total_cents, type: number, source: computed, description: "Sum of internal ledger amounts presented in this period" }
      - { name: variance_cents, type: number, source: computed, description: "carrier_reported_total_cents minus internal_total_cents" }
      - { name: variance_variant, type: enum, source: computed, description: "Which variant produced internal_total_cents", constraints: "enum: PROVISIONAL | FINAL" }
      - { name: status, type: enum, source: system, description: "Reconciliation lifecycle status", constraints: "enum: OPEN | RECONCILED | DISPUTED" }

  - name: Complaint
    parent: Agent
    common_fields: true
    fields:
      - { name: agent_id, type: string, source: input, description: "FK -> Agent.id; agent the complaint concerns" }
      - { name: complaint_type, type: enum, source: input, description: "Alleged compliance failure", constraints: "enum: MISREPRESENTATION | SOA_MISSING | DISCLAIMER_MISSING | RECORDING_MISSING | UNAPPROVED_MARKETING | PLAN_MISREPRESENTATION | DISENROLLMENT_DELAY" }
      - { name: source, type: enum, source: input, description: "Originator of the complaint", constraints: "enum: BENEFICIARY | CMS | CARRIER | SECRET_SHOPPER" }
      - { name: severity, type: enum, source: input, description: "Carrier-assigned severity", constraints: "enum: LOW | MEDIUM | HIGH" }
      - { name: filed_on, type: datetime, source: input, description: "Instant the complaint was filed" }
      - { name: shopper_score, type: integer, source: input, description: "Secret-shopper score 0-100, required when source == SECRET_SHOPPER" }
      - { name: soa_requested_correctly, type: boolean, source: input, description: "Secret-shopper observation: was the scope of appointment requested" }
      - { name: disclaimer_played, type: boolean, source: input, description: "Secret-shopper observation: was the disclaimer played" }
      - { name: approved_marketing_used, type: boolean, source: input, description: "Secret-shopper observation: was only approved marketing used" }
      - { name: status, type: enum, source: system, description: "Complaint lifecycle status", constraints: "enum: OPEN | UNDER_REVIEW | SUBSTANTIATED | DISMISSED | APPEALED | CLOSED" }
      - { name: finding_code, type: string, source: computed, description: "Finding code stamped on substantiation" }
      - { name: substantiated_on, type: datetime, source: system, description: "Instant substantiation occurred" }

  - name: CoachingAssignment
    parent: Agent
    common_fields: true
    fields:
      - { name: agent_id, type: string, source: input, description: "FK -> Agent.id; agent being coached" }
      - { name: complaint_id, type: string, source: input, description: "Complaint that triggered the coaching, null for manual assignments" }
      - { name: coaching_type, type: enum, source: input, description: "Coaching curriculum assigned", constraints: "enum: SOA_RETRAINING | DISCLAIMER_RETRAINING | MARKETING_RULES | PLAN_DETAIL_ACCURACY | RECORDING_RETENTION" }
      - { name: triggered_by, type: enum, source: computed, description: "How the assignment came into being", constraints: "enum: COMPLAINT | SECRET_SHOPPER | MANUAL" }
      - { name: assigned_on, type: datetime, source: system, description: "Instant the assignment was created, from the logical clock" }
      - { name: due_on, type: datetime, source: computed, description: "assigned_on plus 14 days" }
      - { name: completed_on, type: datetime, source: system, description: "Instant the coaching was completed, null while open" }
      - { name: overdue_days, type: integer, source: computed, description: "Whole days the logical clock is past due_on, 0 while not overdue" }
      - { name: status, type: enum, source: system, description: "Coaching lifecycle status", constraints: "enum: ASSIGNED | IN_PROGRESS | COMPLETED | OVERDUE" }

# =============================================================================
# Table 2: State Machine Table  (§1.2)
# =============================================================================
state_machines:
  # --- Agency: derived posture gating every child operation -----------------
  - entity: Agency
    initial_state: OPEN
    terminal_states: []
    shape_note: "posture_driven — compliance_posture is a derived aggregate that gates every child mutation"
    transitions:
      - from: OPEN
        to: RESTRICTED
        trigger: "system (automatic when §1.3 agency_compliance_posture recomputes to RESTRICTED — either a substantiation moved the strike count, the rate crossed the threshold, or a coaching assignment became overdue)"
        actor: system
        preconditions:
          - "Recomputed compliance_posture == RESTRICTED and current compliance_posture == OPEN"
        side_effects:
          - "compliance_posture = RESTRICTED"
          - "posture_since = logical clock"
          - "Every Agent row of this agency with status ACTIVE → SUSPENDED"
          - "Every CallSession whose agent_id belongs to this agency and whose status is RINGING or IN_PROGRESS → DROPPED with actual_end_at = logical clock"
          - "Agent.live_call_count recomputed for every agent whose call was dropped"
          - "Agency.substantiated_complaint_rate recomputed (§1.3 agency_compliance_posture)"
          - "If the recomputed rate is >= 0.05: Agency.loss_ratio recomputed (§1.3 agency_compliance_loss_ratio)"

      - from: OPEN
        to: FROZEN
        trigger: "system (automatic when §1.3 agency_compliance_posture recomputes directly to FROZEN while the stored posture is still OPEN — the recomputation reads only the standing complaint and coaching state, so a single recompute can cross both thresholds at once)"
        actor: system
        preconditions:
          - "Recomputed compliance_posture == FROZEN and current compliance_posture == OPEN"
        side_effects:
          - "compliance_posture = FROZEN"
          - "posture_since = logical clock"
          - "Every Agent row of this agency with status ACTIVE → SUSPENDED"
          - "Every CallSession whose agent_id belongs to this agency and whose status is RINGING or IN_PROGRESS → DROPPED with actual_end_at = logical clock"
          - "Every Enrollment whose call session's agent belongs to this agency and whose submission_status is SUBMITTED or ACKNOWLEDGED → WITHDRAWN"
          - "For each withdrawn enrollment a §1.3 commission_ledger_entry REVERSAL is posted against every non-REVERSED entry of that enrollment"
          - "Agency.commission_balance_cents recomputed"
          - "Agency.substantiated_complaint_rate recomputed (§1.3 agency_compliance_posture)"
          - "Agency.loss_ratio recomputed (§1.3 agency_compliance_loss_ratio) — the FROZEN loss-ratio threshold is 0.20"
          - "Agent.compliance_risk_score recomputed for every agent of this agency"

      - from: RESTRICTED
        to: FROZEN
        trigger: "system (automatic when §1.3 agency_compliance_posture recomputes to FROZEN, i.e. 5 or more substantiated complaints in the trailing 365 days)"
        actor: system
        preconditions:
          - "Recomputed compliance_posture == FROZEN and current compliance_posture != FROZEN"
        side_effects:
          - "compliance_posture = FROZEN"
          - "posture_since = logical clock"
          - "Every Enrollment of this agency with submission_status IN {SUBMITTED, ACKNOWLEDGED} → WITHDRAWN"
          - "Each withdrawn enrollment posts a §1.3 commission_ledger_entry REVERSAL with amount_cents = -Sum of its non-REVERSED entries"
          - "Every CarrierReconciliation of this agency's carriers with status DISPUTED → OPEN and internal_total_cents recomputed"
          - "Agency.loss_ratio recomputed (§1.3 agency_compliance_loss_ratio) — the FROZEN loss-ratio threshold is 0.20"
          - "Agent.compliance_risk_score recomputed for every agent of this agency"

      - from: FROZEN
        to: RESTRICTED
        trigger: POST /agencies/{id}/posture-reset
        actor: ComplianceOfficer
        preconditions:
          - "Agency.compliance_posture == FROZEN (ERR_AGENCY_NOT_FROZEN)"
          - "Agency.open_complaint_count == 0 (ERR_SUBSTANTIATED_COMPLAINT_OPEN)"
          - "No CoachingAssignment — reached via Agent.agency_id == this agency_id — with status IN {ASSIGNED, IN_PROGRESS, OVERDUE} exists (ERR_COACHING_OVERDUE_BLOCKS_RESET)"
        side_effects:
          - "compliance_posture = RESTRICTED"
          - "posture_since = logical clock"
          - "Agent rows set to SUSPENDED by the freeze remain SUSPENDED — landing at RESTRICTED does not auto-reinstate"

      - from: RESTRICTED
        to: OPEN
        trigger: POST /agencies/{id}/posture-reset
        actor: ComplianceOfficer
        preconditions:
          - "Agency.compliance_posture == RESTRICTED (ERR_AGENCY_NOT_RESTRICTED)"
          - "Agency.substantiated_complaint_rate < 0.05 (ERR_SUBSTANTIATED_COMPLAINT_OPEN)"
          - "No CoachingAssignment of this agency with status IN {ASSIGNED, IN_PROGRESS, OVERDUE} exists (ERR_COACHING_OVERDUE_BLOCKS_RESET)"
        side_effects:
          - "compliance_posture = OPEN"
          - "posture_since = logical clock"
          - "Every Agent of this agency in status SUSPENDED with no open CoachingAssignment → ACTIVE"

  # --- Agent: licensing pipeline with branching, cycles, and terminal re-entry
  - entity: Agent
    initial_state: PROVISIONING
    terminal_states: [TERMINATED]
    shape_note: "branching + cyclic + terminal re-entry — TERMINATED re-enters at PROVISIONING through the rehire path"
    transitions:
      - from: PROVISIONING
        to: LICENSED
        trigger: POST /agents/{id}/licenses
        actor: LicensingCoordinator
        preconditions:
          - "Agency.compliance_posture IN {OPEN, RESTRICTED} (ERR_AGENCY_FROZEN)"
          - "No other AgentStateLicense for the same agent_id and state_code whose expires_on is strictly after the logical clock exists (ERR_DUPLICATE_STATE_LICENSE)"
          - "issued_on <= expires_on (ERR_INVALID_LICENSE_DATES)"
        side_effects:
          - "Agent.status → LICENSED"
          - "Agent.licensed_state_count recomputed"

      - from: LICENSED
        to: CERTIFIED
        trigger: POST /agents/{id}/certifications
        actor: LicensingCoordinator
        preconditions:
          - "Agent.status == LICENSED (ERR_AGENT_NOT_LICENSED)"
          - "Agency.compliance_posture IN {OPEN, RESTRICTED} (ERR_AGENCY_FROZEN)"
          - "Carrier.status == ACTIVE (ERR_CARRIER_NOT_FOUND)"
          - "Carrier.contract_type == CONTRACTED (ERR_CARRIER_NOT_CONTRACTED)"
          - "No CarrierCertification in status CERTIFIED exists for the same agent_id, carrier_id and product_type (ERR_DUPLICATE_CERTIFICATION)"
        side_effects:
          - "CarrierCertification.status → CERTIFIED with certified_on = logical clock"
          - "Agent.status → CERTIFIED"
          - "For every other Agent of the same agency that shares a CarrierAppointment carrier with this agent and is currently CERTIFIED, that agent's status → ACTIVE and its CarrierCertification for this carrier becomes CERTIFIED"
          - "Agent.certified_carrier_count, appointed_carrier_count and licensed_state_count recomputed for every affected agent — a cascade hop triggered by this transition, not by the original request"
          - "If the recomputed carrier-count is zero for an affected agent, that agent's status remains CERTIFIED and no appointment is created — the hop only advances agents whose appointment count would otherwise be positive"

      - from: CERTIFIED
        to: ACTIVE
        trigger: POST /agents/{id}/appointments
        actor: LicensingCoordinator
        preconditions:
          - "Agent.status == CERTIFIED (ERR_AGENT_NOT_CERTIFIED)"
          - "A CarrierCertification in status CERTIFIED exists for the requested carrier_id and product_type (ERR_CERTIFICATION_NOT_FOUND)"
          - "An AgentStateLicense with license_status VALID for the requested state_code exists at the logical clock (ERR_INVALID_STATE_LICENSE)"
          - "Agency.compliance_posture IN {OPEN, RESTRICTED} (ERR_AGENCY_FROZEN)"
        side_effects:
          - "CarrierAppointment.status → APPOINTED with appointed_on = logical clock"
          - "Agent.status → ACTIVE"
          - "Agent.licensed_state_count, certified_carrier_count and appointed_carrier_count recomputed"
          - "For every other Agent of the same agency a CarrierCertification now spans this state_code: recompute their licensed_state_count, certified_carrier_count and appointed_carrier_count"

      - from: ACTIVE
        to: SUSPENDED
        trigger: "system (automatic when Agency.compliance_posture becomes RESTRICTED or FROZEN, or when a Complaint against this agent is substantiated)"
        actor: system
        preconditions:
          - "Agent.status == ACTIVE"
        side_effects:
          - "Agent.status → SUSPENDED"
          - "Every CallSession of this agent with status RINGING or IN_PROGRESS → DROPPED with actual_end_at = logical clock"
          - "Agent.live_call_count recomputed"

      - from: SUSPENDED
        to: ACTIVE
        trigger: POST /agents/{id}/reinstate
        actor: ComplianceOfficer
        preconditions:
          - "Agent.status == SUSPENDED (ERR_AGENT_NOT_SUSPENDED)"
          - "Agency.compliance_posture == OPEN (ERR_AGENCY_NOT_OPEN)"
          - "No CoachingAssignment for this agent with status IN {ASSIGNED, IN_PROGRESS, OVERDUE} exists (ERR_COACHING_OPEN)"
          - "Agency.compliance_posture != FROZEN (ERR_AGENCY_FROZEN)"
          - "A CarrierAppointment with status APPOINTED exists for this agent (ERR_APPOINTMENT_MISSING)"
          - "A CarrierCertification with status CERTIFIED exists for this agent (ERR_CERTIFICATION_NOT_FOUND)"
          - "An AgentStateLicense with license_status VALID exists for this agent at the logical clock (ERR_INVALID_STATE_LICENSE)"
        side_effects:
          - "Agent.status → ACTIVE"

      - from: SUSPENDED
        to: TERMINATED
        trigger: POST /agents/{id}/terminate
        actor: DirectorOfSales
        preconditions:
          - "Agent.status IN {PROVISIONING, LICENSED, CERTIFIED, ACTIVE, SUSPENDED} (ERR_AGENT_ALREADY_TERMINATED)"
        side_effects:
          - "Agent.status → TERMINATED"
          - "Every CarrierAppointment of this agent with status APPOINTED → TERMINATED with terminated_on = logical clock"
          - "Every CarrierCertification of this agent with status CERTIFIED → EXPIRED"
          - "Every CallSession of this agent with status RINGING or IN_PROGRESS → DROPPED with actual_end_at = logical clock"
          - "Agent.live_call_count, certified_carrier_count and appointed_carrier_count recomputed"

      - from: TERMINATED
        to: PROVISIONING
        trigger: POST /agents/{id}/rehire
        actor: DirectorOfSales
        preconditions:
          - "Agent.status == TERMINATED (ERR_AGENT_NOT_TERMINATED)"
          - "Agency.compliance_posture IN {OPEN, RESTRICTED} (ERR_AGENCY_FROZEN)"
          - "hire_date is strictly after the terminated_on instant recorded by the most recent termination (ERR_REHIRE_BEFORE_TERMINATION)"
          - "Every CarrierCertification of this agent has expires_on before the rehire instant (ERR_RECERTIFICATION_REQUIRED)"
        side_effects:
          - "Agent.status → PROVISIONING"
          - "Agent.chargeback_tier reset to 0"
          - "Agent.coaching_flag = false and Agent.open_coaching_count = 0"
          - "Agent.licensed_state_count, certified_carrier_count and appointed_carrier_count recomputed"
        note: "TERMINATED is listed in terminal_states yet carries this single guarded outbound transition — the terminal state is re-entrant only through a fresh licensing pipeline."

  # --- CallSession: branching begin/terminate plus a completed→amended cycle -
  - entity: CallSession
    initial_state: RINGING
    terminal_states: [COMPLETED, DROPPED]
    shape_note: "branching (RINGING forks to IN_PROGRESS or DROPPED) plus a cyclic amendment loop COMPLETED→AMENDED→COMPLETED"
    transitions:
      - from: RINGING
        to: IN_PROGRESS
        trigger: POST /call-sessions/{id}/connect
        actor: LicensedAgent
        preconditions:
          - "Agent.status == ACTIVE (ERR_AGENT_NOT_ACTIVE)"
          - "Agency.compliance_posture IN {OPEN, RESTRICTED} (ERR_AGENCY_FROZEN)"
          - "No other CallSession of this agent with status IN_PROGRESS whose interval [started_at, scheduled_end_at) contains the logical clock exists (ERR_AGENT_HAS_ACTIVE_CALL)"
          - "The attached ScopeOfAppointment exists and captured_on <= logical clock (ERR_SCOPE_OF_APPOINTMENT_MISSING)"
          - "The attached ScopeOfAppointment.plan_types_authorized is non-empty (ERR_SCOPE_OF_APPOINTMENT_MISSING)"
          - "The attached ScopeOfAppointment.agent_id == this call's agent_id (ERR_SCOPE_AGENT_MISMATCH)"
          - "The attached ScopeOfAppointment.status == CAPTURED (ERR_SCOPE_OF_APPOINTMENT_CONSUMED)"
        side_effects:
          - "CallSession.status → IN_PROGRESS"
          - "Agent.live_call_count recomputed"

      - from: IN_PROGRESS
        to: COMPLETED
        trigger: POST /call-sessions/{id}/complete
        actor: LicensedAgent
        preconditions:
          - "CallSession.status == IN_PROGRESS (ERR_CALL_NOT_IN_PROGRESS)"
          - "disclaimer_delivered == true whenever recording_id is non-null (ERR_DISCLAIMER_NOT_DELIVERED)"
          - "recording_id is non-null unless the attached ScopeOfAppointment.capture_channel == WRITTEN (ERR_RECORDING_MISSING)"
          - "Member.agency_id == Agent.agency_id (ERR_MEMBER_NOT_IN_AGENCY)"
        side_effects:
          - "CallSession.status → COMPLETED"
          - "actual_end_at = logical clock"
          - "Agent.live_call_count recomputed"
          - "Agency.substantiated_complaint_rate recomputed (§1.3 agency_compliance_posture)"
          - "Agency.compliance_posture recomputed (§1.3 agency_compliance_posture)"
          - "Agent.compliance_risk_score recomputed (§1.3)"

      - from: IN_PROGRESS
        to: DROPPED
        trigger: POST /call-sessions/{id}/drop
        actor: LicensedAgent
        preconditions:
          - "CallSession.status IN {RINGING, IN_PROGRESS} (ERR_CALL_NOT_DROPPABLE)"
        side_effects:
          - "CallSession.status → DROPPED"
          - "actual_end_at = logical clock"
          - "Agent.live_call_count recomputed"
          - "Agency.substantiated_complaint_rate recomputed (§1.3 agency_compliance_posture)"
          - "Agency.compliance_posture recomputed (§1.3 agency_compliance_posture)"

      - from: RINGING
        to: DROPPED
        trigger: POST /call-sessions/{id}/drop
        actor: LicensedAgent
        preconditions:
          - "CallSession.status IN {RINGING, IN_PROGRESS} (ERR_CALL_NOT_DROPPABLE)"
        side_effects:
          - "CallSession.status → DROPPED"
          - "actual_end_at = logical clock"
          - "Agent.live_call_count recomputed"

      - from: COMPLETED
        to: AMENDED
        trigger: POST /call-sessions/{id}/amend
        actor: ComplianceOfficer
        preconditions:
          - "CallSession.status == COMPLETED (ERR_CALL_NOT_COMPLETED)"
          - "Agency.compliance_posture != FROZEN (ERR_AGENCY_FROZEN)"
          - "amendment_reason is a non-empty string (ERR_INVALID_REQUEST)"
        side_effects:
          - "CallSession.status → AMENDED"
        note: "No other field of the CallSession is mutated — an Enrollment already submitted from this call retains the superseded recording_id and disclaimer flags, which is the compliance gap the amendment records."

      - from: AMENDED
        to: COMPLETED
        trigger: POST /call-sessions/{id}/finalize-amendment
        actor: LicensedAgent
        preconditions:
          - "CallSession.status == AMENDED (ERR_CALL_NOT_AMENDED)"
          - "disclaimer_delivered == true"
          - "recording_id is non-null"
        side_effects:
          - "CallSession.status → COMPLETED"
          - "actual_end_at = logical clock"
          - "Agent.compliance_risk_score recomputed (§1.3)"

  # --- Enrollment: two independent state dimensions on one row ---------------
  - entity: Enrollment
    initial_state: SUBMITTED
    terminal_states: []
    shape_note: "parallel dimensions — submission_status (SUBMITTED × ACKNOWLEDGED × EFFECTUATED × REJECTED × WITHDRAWN) and disenrollment_status (NOT_APPLICABLE × ENROLLED × RAPID_DISENROLLED × STANDARD_DISENROLLED) evolve independently on the same row"
    transitions:
      - from: SUBMITTED
        to: ACKNOWLEDGED
        trigger: POST /enrollments/{id}/acknowledge
        actor: CarrierIntegration
        preconditions:
          - "Enrollment.submission_status == SUBMITTED (ERR_ENROLLMENT_NOT_SUBMITTED)"
          - "logical clock <= submitted_on + Carrier.ack_expected_within_days (ERR_ACK_WINDOW_EXPIRED)"
          - "Enrollment.carrier_id == the carrier_id in the request path (ERR_CARRIER_MISMATCH)"
        side_effects:
          - "submission_status → ACKNOWLEDGED"
          - "acknowledged_on = logical clock"
          - "A §1.3 commission_ledger_entry RENEWAL is posted in status PROVISIONAL"
          - "Agency.commission_balance_cents recomputed"

      - from: ACKNOWLEDGED
        to: EFFECTUATED
        trigger: POST /enrollments/{id}/effectuate
        actor: CarrierIntegration
        preconditions:
          - "submission_status IN {SUBMITTED, ACKNOWLEDGED} (ERR_ENROLLMENT_NOT_ACKNOWLEDGED)"
          - "logical clock <= acknowledged_on + Carrier.effectuation_expected_within_days (ERR_EFFECTUATION_WINDOW_EXPIRED)"
          - "The attached ScopeOfAppointment.status == CAPTURED (ERR_SCOPE_OF_APPOINTMENT_CONSUMED)"
        side_effects:
          - "submission_status → EFFECTUATED"
          - "effectuated_on = logical clock"
          - "disenrollment_status → ENROLLED"
          - "ScopeOfAppointment.status → CONSUMED and consumed_by_enrollment_id = this enrollment id"
          - "Agent.active_enrollment_count recomputed"
          - "Plan.enrolled_member_count recomputed"
          - "No new ledger entry is posted — the INITIAL entry carries its §1.3 amount and the RENEWAL entry, already posted at acknowledgment, is finalized by the carrier reconciliation"
          - "CarrierReconciliation.internal_total_cents and variance_cents recomputed for the OPEN period of this carrier"
          - "Agency.commission_balance_cents recomputed"

      - from: SUBMITTED
        to: EFFECTUATED
        trigger: POST /enrollments/{id}/effectuate
        actor: CarrierIntegration
        preconditions:
          - "submission_status IN {SUBMITTED, ACKNOWLEDGED} (ERR_ENROLLMENT_NOT_ACKNOWLEDGED)"
          - "The attached ScopeOfAppointment.status == CAPTURED (ERR_SCOPE_OF_APPOINTMENT_CONSUMED)"
        side_effects:
          - "submission_status → EFFECTUATED, effectuated_on = logical clock, disenrollment_status → ENROLLED"
          - "ScopeOfAppointment.status → CONSUMED and consumed_by_enrollment_id = this enrollment id"
          - "Agent.active_enrollment_count recomputed; Plan.enrolled_member_count recomputed"
          - "CarrierReconciliation.internal_total_cents and variance_cents recomputed for the OPEN period of this carrier"
          - "Agency.commission_balance_cents recomputed"

      - from: SUBMITTED
        to: REJECTED
        trigger: POST /enrollments/{id}/reject
        actor: CarrierIntegration
        preconditions:
          - "submission_status == SUBMITTED (ERR_ENROLLMENT_NOT_SUBMITTED)"
        side_effects:
          - "submission_status → REJECTED"
          - "The attached ScopeOfAppointment.status → VOIDED when it is CONSUMED; a CAPTURED scope stays CAPTURED"
          - "Agent.active_enrollment_count recomputed"

      - from: ACKNOWLEDGED
        to: REJECTED
        trigger: POST /enrollments/{id}/reject
        actor: CarrierIntegration
        preconditions:
          - "submission_status == ACKNOWLEDGED (ERR_ENROLLMENT_NOT_SUBMITTED)"
        side_effects:
          - "submission_status → REJECTED"
          - "The attached ScopeOfAppointment.status → VOIDED when it is CONSUMED; a CAPTURED scope stays CAPTURED"
          - "Agent.active_enrollment_count recomputed"

      - from: SUBMITTED
        to: WITHDRAWN
        trigger: POST /enrollments/{id}/withdraw
        actor: LicensedAgent
        preconditions:
          - "submission_status IN {SUBMITTED, ACKNOWLEDGED, REJECTED} (ERR_ENROLLMENT_NOT_WITHDRAWABLE)"
        side_effects:
          - "submission_status → WITHDRAWN"
          - "The attached ScopeOfAppointment.status → VOIDED when it is CONSUMED; a CAPTURED scope stays CAPTURED"
          - "Agent.chargeback_tier += 1"
          - "A §1.3 commission_ledger_entry REVERSAL is posted against every non-REVERSED entry of this enrollment"
          - "Agent.compliance_risk_score recomputed (§1.3)"
          - "Agency.commission_balance_cents recomputed"

      - from: ACKNOWLEDGED
        to: WITHDRAWN
        trigger: POST /enrollments/{id}/withdraw
        actor: LicensedAgent
        preconditions:
          - "submission_status IN {SUBMITTED, ACKNOWLEDGED, REJECTED} (ERR_ENROLLMENT_NOT_WITHDRAWABLE)"
        side_effects:
          - "submission_status → WITHDRAWN; the attached ScopeOfAppointment.status → VOIDED when it is CONSUMED, otherwise it stays CAPTURED"
          - "Agent.chargeback_tier += 1"
          - "A §1.3 commission_ledger_entry REVERSAL is posted against every non-REVERSED entry of this enrollment"

      - from: REJECTED
        to: WITHDRAWN
        trigger: POST /enrollments/{id}/withdraw
        actor: LicensedAgent
        preconditions:
          - "submission_status IN {SUBMITTED, ACKNOWLEDGED, REJECTED} (ERR_ENROLLMENT_NOT_WITHDRAWABLE)"
        side_effects:
          - "The attached ScopeOfAppointment.status → VOIDED when it is CONSUMED; a CAPTURED scope stays CAPTURED"
          - "Agent.chargeback_tier += 1"

      # --- disenrollment dimension: valid only once submission_status is EFFECTUATED
      - from: ENROLLED
        to: RAPID_DISENROLLED
        trigger: POST /enrollments/{id}/disenroll
        actor: CarrierIntegration
        preconditions:
          - "submission_status == EFFECTUATED and disenrollment_status == ENROLLED (ERR_ENROLLMENT_NOT_ENROLLED)"
          - "disenrollment_date is on or after effective_date (ERR_INVALID_REQUEST)"
          - "is_rapid_disenrollment == true, i.e. disenrolled_day_number <= Agency.rapid_disenrollment_day_limit (ERR_NOT_RAPID_DISENROLLMENT)"
        side_effects:
          - "disenrollment_status → RAPID_DISENROLLED"
          - "disenrollment_date and disenrollment_reason recorded"
          - "Agent.chargeback_tier += 1"
          - "A §1.3 commission_ledger_entry CHARGEBACK is posted in status FINALIZED with a strictly negative amount_cents"
          - "Agency.loss_ratio recomputed (§1.3 agency_compliance_loss_ratio)"
          - "Every open CarrierReconciliation of this enrollment's carrier → DISPUTED"
          - "Plan.enrolled_member_count and Agent.active_enrollment_count recomputed"
          - "Agent.compliance_risk_score recomputed (§1.3)"
          - "Agency.commission_balance_cents recomputed"

      - from: ENROLLED
        to: STANDARD_DISENROLLED
        trigger: POST /enrollments/{id}/disenroll
        actor: CarrierIntegration
        preconditions:
          - "submission_status == EFFECTUATED and disenrollment_status == ENROLLED (ERR_ENROLLMENT_NOT_ENROLLED)"
          - "disenrollment_date is on or after effective_date (ERR_INVALID_REQUEST)"
          - "is_rapid_disenrollment == false (ERR_RAPID_DISENROLLMENT_REQUIRES_CHARGEBACK)"
        side_effects:
          - "disenrollment_status → STANDARD_DISENROLLED"
          - "disenrollment_date and disenrollment_reason recorded"
          - "A §1.3 commission_ledger_entry CHARGEBACK is posted in status FINALIZED with amount_cents == 0"
          - "Plan.enrolled_member_count and Agent.active_enrollment_count recomputed"
          - "Agent.compliance_risk_score recomputed (§1.3)"

  # --- CommissionLedgerEntry: cyclic reinstatement back into the live ledger -
  - entity: CommissionLedgerEntry
    initial_state: PROVISIONAL
    terminal_states: []
    shape_note: "cyclic — REVERSED re-enters the live ledger as either PROVISIONAL (reinstate) or FINALIZED (reinstate-finalized)"
    transitions:
      - from: PROVISIONAL
        to: FINALIZED
        trigger: POST /commission-ledger-entries/{id}/finalize
        actor: DirectorOfSales
        preconditions:
          - "CommissionLedgerEntry.status == PROVISIONAL (ERR_LEDGER_ENTRY_NOT_PROVISIONAL)"
          - "Enrollment.disenrollment_status == ENROLLED for entry_type IN {INITIAL, RENEWAL} (ERR_ENROLLMENT_NOT_ENROLLED)"
        side_effects:
          - "status → FINALIZED"
          - "amount_cents recomputed from the current inputs under the §1.3 commission_ledger_entry FINAL variant"
          - "CarrierReconciliation.internal_total_cents and variance_cents recomputed for this entry's period_month and carrier"
          - "Agency.commission_balance_cents recomputed"
          - "Agency.loss_ratio recomputed (§1.3 agency_compliance_loss_ratio)"

      - from: PROVISIONAL
        to: REVERSED
        trigger: POST /commission-ledger-entries/{id}/reverse
        actor: DirectorOfSales
        preconditions:
          - "CommissionLedgerEntry.status IN {PROVISIONAL, FINALIZED} (ERR_LEDGER_ENTRY_NOT_REVERSIBLE)"
        side_effects:
          - "status → REVERSED"
          - "Agency.commission_balance_cents recomputed"
          - "CarrierReconciliation.internal_total_cents and variance_cents recomputed for this entry's period_month and carrier"
          - "Agency.loss_ratio recomputed (§1.3 agency_compliance_loss_ratio)"
          - "If Enrollment.submission_status == EFFECTUATED and disenrollment_status == ENROLLED: a §1.3 commission_ledger_entry ADJUSTMENT is posted in status PROVISIONAL"
          - "Agency.compliance_posture recomputed (§1.3)"
          - "If recomputed posture is FROZEN: the agency-wide FROZEN cascade of §1.2 Agency runs against the Enrollment rows still in SUBMITTED or ACKNOWLEDGED"

      - from: FINALIZED
        to: REVERSED
        trigger: POST /commission-ledger-entries/{id}/reverse
        actor: DirectorOfSales
        preconditions:
          - "CommissionLedgerEntry.status IN {PROVISIONAL, FINALIZED} (ERR_LEDGER_ENTRY_NOT_REVERSIBLE)"
        side_effects:
          - "status → REVERSED"
          - "Agency.commission_balance_cents recomputed"
          - "CarrierReconciliation.internal_total_cents and variance_cents recomputed for this entry's period_month and carrier"
          - "Agency.loss_ratio recomputed (§1.3 agency_compliance_loss_ratio)"

      - from: REVERSED
        to: PROVISIONAL
        trigger: POST /commission-ledger-entries/{id}/reinstate
        actor: DirectorOfSales
        preconditions:
          - "CommissionLedgerEntry.status == REVERSED (ERR_LEDGER_ENTRY_NOT_REVERSED)"
          - "Agency.compliance_posture != FROZEN (ERR_AGENCY_FROZEN)"
        side_effects:
          - "status → PROVISIONAL"
          - "Agency.commission_balance_cents recomputed"
          - "CarrierReconciliation.internal_total_cents and variance_cents recomputed for this entry's period_month and carrier"

      - from: REVERSED
        to: FINALIZED
        trigger: POST /commission-ledger-entries/{id}/reinstate-finalized
        actor: DirectorOfSales
        preconditions:
          - "CommissionLedgerEntry.status == REVERSED (ERR_LEDGER_ENTRY_NOT_REVERSED)"
          - "Enrollment.disenrollment_status == ENROLLED (ERR_ENROLLMENT_NOT_ENROLLED)"
          - "Agency.compliance_posture != FROZEN (ERR_AGENCY_FROZEN)"
        side_effects:
          - "status → FINALIZED"
          - "Agency.commission_balance_cents recomputed"
          - "CarrierReconciliation.internal_total_cents and variance_cents recomputed for this entry's period_month and carrier"

  # --- CarrierReconciliation: cyclic disputes ---------------------------------
  - entity: CarrierReconciliation
    initial_state: OPEN
    terminal_states: [RECONCILED]
    shape_note: "cyclic — DISPUTED reopens to OPEN, so a level-recognition pass is followed by another dispute round"
    transitions:
      - from: OPEN
        to: RECONCILED
        trigger: POST /carrier-reconciliations/{id}/reconcile
        actor: DirectorOfSales
        preconditions:
          - "CarrierReconciliation.status == OPEN (ERR_RECONCILIATION_NOT_OPEN)"
          - "The §1.3 carrier_reconciliation_variance produced variance_cents == 0 (ERR_RECONCILIATION_VARIANCE_NONZERO)"
        side_effects:
          - "status → RECONCILED"
          - "Every §1.3 commission_ledger_entry presented in this period with status PROVISIONAL → FINALIZED"
          - "Agency.commission_balance_cents recomputed"

      - from: OPEN
        to: DISPUTED
        trigger: POST /carrier-reconciliations/{id}/dispute
        actor: DirectorOfSales
        preconditions:
          - "CarrierReconciliation.status == OPEN (ERR_RECONCILIATION_NOT_OPEN)"
          - "The §1.3 carrier_reconciliation_variance produced variance_cents != 0 (ERR_RECONCILIATION_VARIANCE_ZERO)"
        side_effects:
          - "status → DISPUTED"
          - "Every §1.3 commission_ledger_entry presented in this period with status PROVISIONAL → FINALIZED"
          - "Agency.commission_balance_cents recomputed"

      - from: DISPUTED
        to: OPEN
        trigger: POST /carrier-reconciliations/{id}/reopen
        actor: DirectorOfSales
        preconditions:
          - "CarrierReconciliation.status == DISPUTED (ERR_RECONCILIATION_NOT_DISPUTED)"
          - "The §1.3 carrier_reconciliation_variance recomputed at the logical clock produced variance_cents != 0 (ERR_RECONCILIATION_VARIANCE_ZERO)"
        side_effects:
          - "status → OPEN"
          - "internal_total_cents and variance_cents recomputed for this period"

      - from: OPEN
        to: RECONCILED
        trigger: POST /carrier-reconciliations/{id}/level-recognize
        actor: DirectorOfSales
        preconditions:
          - "CarrierReconciliation.status == OPEN (ERR_RECONCILIATION_NOT_OPEN)"
          - "CarrierReconciliation.carrier_reported_total_cents has not been supplied for this period (ERR_CARRIER_REPORTED_TOTAL_PRESENT)"
        side_effects:
          - "carrier_reported_total_cents = internal_total_cents under the FINAL variant"
          - "status → RECONCILED"
          - "Every §1.3 commission_ledger_entry presented in this period with status PROVISIONAL → FINALIZED"
        note: "Level recognition: when no carrier-reported figure exists, the internal FINAL total becomes the reported total, so a DISPUTED period can never be dismissed this way."

  # --- Complaint: cyclic appeals ---------------------------------------------
  - entity: Complaint
    initial_state: OPEN
    terminal_states: [CLOSED]
    shape_note: "cyclic — APPEALED remands back to UNDER_REVIEW, so the same complaint can substantiate, be appealed, and substantiate again"
    transitions:
      - from: OPEN
        to: UNDER_REVIEW
        trigger: POST /complaints/{id}/begin-review
        actor: ComplianceOfficer
        preconditions:
          - "Complaint.status == OPEN (ERR_COMPLAINT_NOT_OPEN)"
        side_effects:
          - "status → UNDER_REVIEW"
          - "Agency.open_complaint_count recomputed"

      - from: UNDER_REVIEW
        to: SUBSTANTIATED
        trigger: POST /complaints/{id}/substantiate
        actor: ComplianceOfficer
        preconditions:
          - "Complaint.status == UNDER_REVIEW (ERR_COMPLAINT_NOT_UNDER_REVIEW)"
          - "Complaint.filed_on <= logical clock (ERR_COMPLAINT_FILED_IN_FUTURE)"
        side_effects:
          - "status → SUBSTANTIATED"
          - "finding_code = the §1.3 complaint_finding_codes result"
          - "substantiated_on = logical clock"
          - "Agent.substantiated_complaint_count += 1"
          - "Agency.substantiated_complaint_rate recomputed (§1.3 agency_compliance_posture)"
          - "Agency.open_complaint_count recomputed"
          - "Agent.compliance_risk_score recomputed (§1.3)"
          - "A §1.3 coaching_assignment is created with status ASSIGNED and triggered_by COMPLAINT"
          - "Agent.open_coaching_count += 1 and Agent.coaching_flag = true"
          - "Agency.compliance_posture recomputed (§1.3) — the RESTRICTED and FROZEN cascades of §1.2 Agency run when the recomputation crosses"

      - from: UNDER_REVIEW
        to: DISMISSED
        trigger: POST /complaints/{id}/dismiss
        actor: ComplianceOfficer
        preconditions:
          - "Complaint.status == UNDER_REVIEW (ERR_COMPLAINT_NOT_UNDER_REVIEW)"
        side_effects:
          - "status → DISMISSED"
          - "Agency.open_complaint_count recomputed"
          - "Agency.compliance_posture recomputed (§1.3)"

      - from: SUBSTANTIATED
        to: APPEALED
        trigger: POST /complaints/{id}/appeal
        actor: CarrierIntegration
        preconditions:
          - "Complaint.status == SUBSTANTIATED (ERR_COMPLAINT_NOT_SUBSTANTIATED)"
          - "logical clock <= substantiated_on + 30 days (ERR_APPEAL_WINDOW_EXPIRED)"
        side_effects:
          - "status → APPEALED"
          - "Agent.compliance_risk_score recomputed (§1.3)"

      - from: DISMISSED
        to: APPEALED
        trigger: POST /complaints/{id}/appeal
        actor: CarrierIntegration
        preconditions:
          - "Complaint.status == DISMISSED (ERR_COMPLAINT_NOT_SUBSTANTIATED)"
          - "logical clock <= the dismissing instant + 30 days (ERR_APPEAL_WINDOW_EXPIRED)"
        side_effects:
          - "status → APPEALED"
          - "Agent.compliance_risk_score recomputed (§1.3)"

      - from: APPEALED
        to: UNDER_REVIEW
        trigger: POST /complaints/{id}/remand
        actor: ComplianceOfficer
        preconditions:
          - "Complaint.status == APPEALED (ERR_COMPLAINT_NOT_APPEALED)"
        side_effects:
          - "status → UNDER_REVIEW"
          - "Agency.open_complaint_count recomputed"

      - from: APPEALED
        to: DISMISSED
        trigger: POST /complaints/{id}/dismiss
        actor: ComplianceOfficer
        preconditions:
          - "Complaint.status == APPEALED (ERR_COMPLAINT_NOT_APPEALED)"
          - "Agent.substantiated_complaint_count >= 1 (ERR_NO_SUBSTANTIATION_TO_REVERSE)"
        side_effects:
          - "status → DISMISSED"
          - "Agent.substantiated_complaint_count -= 1"
          - "Agency.substantiated_complaint_rate recomputed (§1.3 agency_compliance_posture)"
          - "Agent.compliance_risk_score recomputed (§1.3)"
          - "Agency.compliance_posture recomputed (§1.3)"

      - from: APPEALED
        to: CLOSED
        trigger: POST /complaints/{id}/close
        actor: ComplianceOfficer
        preconditions:
          - "Complaint.status IN {DISMISSED, SUBSTANTIATED} (ERR_COMPLAINT_NOT_CLOSABLE)"
        side_effects:
          - "status → CLOSED"
          - "Agency.open_complaint_count recomputed"
          - "Every CoachingAssignment with complaint_id == this id and status IN {ASSIGNED, IN_PROGRESS, OVERDUE} → COMPLETED with completed_on = logical clock"
          - "Agent.open_coaching_count recomputed; Agent.coaching_flag = false when it reaches 0"
          - "Agent.compliance_risk_score recomputed (§1.3)"
          - "Agency.compliance_posture recomputed (§1.3)"

      - from: DISMISSED
        to: CLOSED
        trigger: POST /complaints/{id}/close
        actor: ComplianceOfficer
        preconditions:
          - "Complaint.status IN {DISMISSED, SUBSTANTIATED} (ERR_COMPLAINT_NOT_CLOSABLE)"
        side_effects:
          - "status → CLOSED"
          - "Agency.open_complaint_count recomputed"
          - "Every CoachingAssignment with complaint_id == this id and status IN {ASSIGNED, IN_PROGRESS, OVERDUE} → COMPLETED with completed_on = logical clock"
          - "Agent.open_coaching_count recomputed; Agent.coaching_flag = false when it reaches 0"
          - "Agent.compliance_risk_score recomputed (§1.3)"
          - "Agency.compliance_posture recomputed (§1.3)"

      - from: SUBSTANTIATED
        to: CLOSED
        trigger: POST /complaints/{id}/close
        actor: ComplianceOfficer
        preconditions:
          - "Complaint.status IN {DISMISSED, SUBSTANTIATED} (ERR_COMPLAINT_NOT_CLOSABLE)"
        side_effects:
          - "status → CLOSED"
          - "Agency.open_complaint_count recomputed"
          - "Every CoachingAssignment with complaint_id == this id and status IN {ASSIGNED, IN_PROGRESS, OVERDUE} → COMPLETED with completed_on = logical clock"
          - "Agent.open_coaching_count recomputed; Agent.coaching_flag = false when it reaches 0"
          - "Agent.compliance_risk_score recomputed (§1.3)"
          - "Agency.compliance_posture recomputed (§1.3)"

  # --- CoachingAssignment: linear with an automatic overdue branch -----------
  - entity: CoachingAssignment
    initial_state: ASSIGNED
    terminal_states: [COMPLETED, OVERDUE]
    shape_note: "linear pipeline with an automatic time-driven branch into OVERDUE, from which completion is still reachable"
    transitions:
      - from: ASSIGNED
        to: IN_PROGRESS
        trigger: POST /coaching-assignments/{id}/start
        actor: Coach
        preconditions:
          - "CoachingAssignment.status == ASSIGNED (ERR_COACHING_NOT_ASSIGNED)"
        side_effects:
          - "status → IN_PROGRESS"

      - from: IN_PROGRESS
        to: COMPLETED
        trigger: POST /coaching-assignments/{id}/complete
        actor: Coach
        preconditions:
          - "CoachingAssignment.status == IN_PROGRESS (ERR_COACHING_NOT_IN_PROGRESS)"
        side_effects:
          - "status → COMPLETED"
          - "completed_on = logical clock"
          - "Agent.open_coaching_count recomputed; Agent.coaching_flag = false when it reaches 0"
          - "Agent.compliance_risk_score recomputed (§1.3)"
          - "Agency.compliance_posture recomputed (§1.3)"

      - from: ASSIGNED
        to: OVERDUE
        trigger: "system (automatic when §1.3 coaching_overdue_days recomputes above zero on any read or mutation)"
        actor: system
        preconditions:
          - "The §1.3 coaching_overdue_days result is >= 1"
          - "CoachingAssignment.status IN {ASSIGNED, IN_PROGRESS}"
        side_effects:
          - "status → OVERDUE"
          - "Agent.compliance_risk_score recomputed (§1.3)"
          - "Agency.compliance_posture recomputed (§1.3)"

      - from: IN_PROGRESS
        to: OVERDUE
        trigger: "system (automatic when §1.3 coaching_overdue_days recomputes above zero on any read or mutation)"
        actor: system
        preconditions:
          - "The §1.3 coaching_overdue_days result is >= 1"
          - "CoachingAssignment.status IN {ASSIGNED, IN_PROGRESS}"
        side_effects:
          - "status → OVERDUE"
          - "Agent.compliance_risk_score recomputed (§1.3)"
          - "Agency.compliance_posture recomputed (§1.3)"

      - from: OVERDUE
        to: COMPLETED
        trigger: POST /coaching-assignments/{id}/complete
        actor: Coach
        preconditions:
          - "CoachingAssignment.status == OVERDUE (ERR_COACHING_NOT_IN_PROGRESS)"
        side_effects:
          - "status → COMPLETED"
          - "completed_on = logical clock"
          - "Agent.open_coaching_count recomputed; Agent.coaching_flag = false when it reaches 0"
          - "Agent.compliance_risk_score recomputed (§1.3)"
          - "Agency.compliance_posture recomputed (§1.3)"

# =============================================================================
# §1.2.1 Concurrency Rules (true races only; OCC on the parent's version)
# =============================================================================
concurrency_rules:
  - rule_id: enrollment-create-stale-call-session
    parent_entity: CallSession
    write_endpoint: "POST /enrollments"
    occ_field: "expected_call_session_version"
    description: |
      Submitting an Enrollment against a CallSession whose version has advanced
      since the client last observed it is rejected. A single call may
      legitimately yield more than one plan submission, so a strictly sequential
      second submission is not a business error — the request is refused only
      because the caller's view of the CallSession is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: soa-capture-stale-member
    parent_entity: Member
    write_endpoint: "POST /scope-of-appointments"
    occ_field: "expected_member_version"
    description: |
      Capturing a ScopeOfAppointment against a Member whose version has advanced
      since the client last observed it is rejected. A beneficiary may grant a
      fresh scope after a prior one was voided, so the second capture is not a
      state error — it is refused because the caller's view of the Member is
      stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table  (§1.3)
# =============================================================================
calculations:
  - name: provisional_book_commission
    trigger: "Enrollment creation; used for the forward-looking book-of-business projection returned by GET /agencies/{id}/book-of-business"
    algorithm: forward_looking
    formula: |
      window_start = logical clock
      window_end   = logical clock + FORWARD_WINDOW_DAYS
      AEP_QUALIFYING(e) = ( e.agency_id == agency.id
                            AND e.submission_status IN {SUBMITTED, ACKNOWLEDGED, EFFECTUATED}
                            AND e.effective_date >= window_start
                            AND e.effective_date < window_end )
      FILL_MONTHS_FIRST_YEAR(e) = 12 - (whole calendar months from e.effective_date to 31 December of e.effective_date's year,
                                        counting the effective month itself)
      provisional_book_commission_cents =
            Sum over e in AEP_QUALIFYING of
                RoundHalfUp( e.plan.monthly_premium_cents * 12 * carrier(e).initial_commission_rate_pct )
          + Sum over e in AEP_QUALIFYING of
                RoundHalfUp( e.plan.monthly_premium_cents * FILL_MONTHS_FIRST_YEAR(e) * carrier(e).renewal_commission_rate_pct )
      Each Summand is rounded to the cent BEFORE summation; the two subtotals are then added.
    input_set: "Enrollments with submission_status IN {SUBMITTED, ACKNOWLEDGED, EFFECTUATED} whose effective_date falls in [logical clock, logical clock + 365 days). REJECTED and WITHDRAWN enrollments are excluded because their ScopeOfAppointment is VOIDED."
    constants:
      FORWARD_WINDOW_DAYS: 365
      METHOD_FEE_MULTIPLIER: 1.06
    precision: "2 decimal places, round_half_up, applied per enrollment term BEFORE summation"
    variants:
      - name: agency_book_total
        when: "GET /agencies/{agencyId}/book-of-business — the whole AEP window"
        difference: "Sum of every qualifying enrollment's two rounded terms"
      - name: per_enrollment_attribution
        when: "Enrollment.provisional_commission_cents — one enrollment's own share of the forward-looking projection"
        difference: "The same two rounded terms for that single enrollment, without the agency-wide window grouping"

  - name: earned_commission_projections
    trigger: "Enrollment effectuation, disenrollment, and any ledger finalization — the as-earned figure reconciled against carrier statements"
    algorithm: chronological
    formula: |
      Order the agency's enrollments ascending by effective_date; break ties by ascending created_at.
      running_effective_date = null
      earned_cents = 0
      for e in ordered enrollments:
          if e.submission_status != EFFECTUATED: continue
          if running_effective_date is null or (e.effective_date - running_effective_date) > LAPSE_GAP_DAYS:
              rate = carrier(e).initial_commission_rate_pct
          else:
              rate = carrier(e).renewal_commission_rate_pct
          running_effective_date = e.effective_date
          cutoff = min(logical clock, e.disenrollment_date) if e.disenrollment_date is not null else logical clock
          BILLED_MONTHS(e) = 1 if e.disenrollment_status != ENROLLED else max(1, whole months from e.effective_date to cutoff)
          earned_cents += RoundHalfUp( e.plan.monthly_premium_cents * BILLED_MONTHS(e) * rate )
      earned_commission_cents = earned_cents            # agency level
      Enrollment.final_commission_cents = the rounded term this enrollment contributed inside the pass
                                          (0 when the enrollment is not EFFECTUATED)
    input_set: "Enrollments with submission_status == EFFECTUATED, ordered by effective_date then created_at. Enrollments with disenrollment_status RAPID_DISENROLLED contribute BILLED_MONTHS = 1 because the plan never ran a full month."
    constants:
      LAPSE_GAP_DAYS: 0
    precision: "2 decimal places, round_half_up, accumulated in chronological order"

  - name: rapid_disenrollment_chargeback
    trigger: "POST /enrollments/{id}/disenroll"
    algorithm: threshold
    formula: |
      disenrolled_day_number = whole days from effective_date to disenrollment_date (half-open; same-day disenrollment is 0)
      is_rapid_disenrollment = ( disenrolled_day_number <= agency.rapid_disenrollment_day_limit )
      Evaluation order is pinned and MUST NOT be re-associated:
        1. BAND LOOKUP — select the single DAY_BANDS row whose min_day <= disenrolled_day_number <= max_day.
           If no row matches (disenrolled_day_number > 90) the enrollment is not rapid and NO chargeback is posted.
        2. base_pct = selected_band.base_pct
        3. HARD ESCALATION — if agent.chargeback_tier >= HARD_ESCALATION_TIER_THRESHOLD, base_pct = 1.00
        4. TIER ESCALATION — else if agent.chargeback_tier >= ESCALATION_TIER_THRESHOLD, base_pct = the base_pct of the
           band ONE STEP HIGHER in the DAY_BANDS list (DAY_0_30 has no higher band and stays 1.00)
        5. COMPLAINT ESCALATION — if Count(substantiated complaints against this agent with substantiated_on in
           [disenrollment_date - 30 days, disenrollment_date]) >= 2 and disenrolled_day_number <= 90, base_pct = 1.00
        6. absolute_initial = RoundHalfUp( plan.monthly_premium_cents * 12 * carrier.initial_commission_rate_pct )
        7. amount_cents = -RoundHalfUp( absolute_initial * base_pct )
        8. clawback_pct_applied = base_pct
        9. agent.chargeback_tier += 1
       10. agent.compliance_risk_score recomputed per §1.3 agent_compliance_risk_score
    input_set: "The single Enrollment under disenrollment, its Plan, its Carrier, its Agent, and the complaints substantiated against that Agent in the trailing 30 days."
    constants:
      DAY_BANDS:
        - { name: DAY_0_30,  min_day: 0,  max_day: 30, base_pct: 1.00, penalty_points: 10 }
        - { name: DAY_31_60, min_day: 31, max_day: 60, base_pct: 0.75, penalty_points: 15 }
        - { name: DAY_61_90, min_day: 61, max_day: 90, base_pct: 0.50, penalty_points: 20 }
      ESCALATION_TIER_THRESHOLD: 4
      HARD_ESCALATION_TIER_THRESHOLD: 7
      ESCALATION_COMPLAINT_WINDOW_DAYS: 30
    precision: "2 decimal places, round_half_up on the absolute initial commission, then negated"
    variants:
      - name: provisional
        when: "Posted as the contingent reserve when the enrollment is acknowledged, before any disenrollment exists — surfaced as Enrollment.provisional_commission_cents"
        difference: "Uses base_pct 1.00 unconditionally (steps 2–5 are skipped), so a plan with absolute_initial 3600 always carries a PROVISIONAL chargeback of -3600 regardless of the eventual day band or the agent's chargeback tier"
      - name: final
        when: "Posted as the FINALIZED CHARGEBACK when the disenrollment is recorded — surfaced as Enrollment.final_commission_cents and CommissionLedgerEntry.clawback_pct_applied"
        difference: "Runs steps 1–5, so the same absolute_initial 3600 yields -3600 at day 30 with chargeback_tier 0 (band DAY_0_30, 1.00), -2700 at day 31 with chargeback_tier 0 (band DAY_31_60, 0.75), and -3600 again at day 45 with chargeback_tier 4 (band DAY_31_60 escalated to the band above)"

  - name: carrier_reconciliation_variance
    trigger: "POST /carrier-reconciliations/{id}/reconcile, /dispute, /reopen and /level-recognize"
    algorithm: aggregation
    formula: |
      The variant is pinned by the request field internal_total_variant:
        PROVISIONAL -> internal_total_cents = Sum of l.amount_cents over CommissionLedgerEntry rows with
                        carrier_id == this carrier AND period_month == this period AND status IN {PROVISIONAL, FINALIZED}
        FINAL       -> internal_total_cents = Sum of l.amount_cents over CommissionLedgerEntry rows with
                        carrier_id == this carrier AND period_month == this period AND status == FINALIZED
      Entries are summed ascending by posted_on, ties broken by ascending created_at.
      variance_cents = carrier_reported_total_cents - internal_total_cents
      variance_variant = the variant used above
    input_set: "CommissionLedgerEntry rows of the reconciled carrier whose period_month equals the reconciliation's period_month. REVERSED entries are excluded under BOTH variants."
    constants:
      REVERSED_EXCLUDED: true
    precision: "2 decimal places, round_half_up, summed in ascending posted_on then ascending created_at"
    variants:
      - name: provisional_internal_total
        when: "internal_total_variant == PROVISIONAL — the default when a reconciliation is opened"
        difference: "Counts PROVISIONAL entries too, so a period holding one PROVISIONAL INITIAL of 60000 and one FINALIZED CHARGEBACK of -45000 reports internal_total_cents 15000"
      - name: final_internal_total
        when: "internal_total_variant == FINAL — used by the level-recognition path"
        difference: "Counts only FINALIZED entries, so the same period reports internal_total_cents -45000 and a variance 60000 larger"

  - name: formulary_drug_annual_cost
    trigger: "Plan comparison generation (POST /plan-comparisons)"
    algorithm: aggregation
    formula: |
      For each drug d in member.drug_list:
          rows = FormularyDrug rows of the plan where rxcui == d.rxcui OR drug_name == d.drug_name
          if rows is empty or every row has covered == false:
              plan_drug_status = NOT_COVERED
              drug_annual_cost_cents = 0
          else:
              row = the covered row with the lowest tier;
                    ties broken by ascending monthly_copay_cents, then by ascending created_at
              fills = ceil( d.monthly_fills * 30 / row.quantity_limit_days )
              drug_annual_cost_cents = RoundHalfUp( fills * row.monthly_copay_cents * DAYS_SUPPLY_RATIO_MULTIPLIER )
      plan_out_of_pocket_cents = plan.monthly_premium_cents * 12
                               + plan.annual_drug_deductible_cents
                               + Sum of drug_annual_cost_cents
      Each drug_annual_cost_cents is rounded to the cent BEFORE the Sum; the premium and deductible terms are exact integers.
    input_set: "The plan's FormularyDrug rows joined against the member's drug_list. Drugs the plan does not cover contribute 0 to the drug subtotal but are still reported as NOT_COVERED; prior_authorization_required does not change the cost."
    constants:
      DAYS_SUPPLY_RATIO_MULTIPLIER: 1.05
      DAYS_PER_FILL: 30
    precision: "2 decimal places, round_half_up, applied per drug BEFORE summation"

  - name: plan_comparison_score
    trigger: "POST /plan-comparisons"
    algorithm: weighted_scoring
    formula: |
      plan_type_affinity_match = 1 if plan.plan_type IN the plan types authorized by the member's most recent
                                 CAPTURED ScopeOfAppointment, else 0
      pharmacy_component       = 1 if the plan has >= 1 PharmacyNetworkEntry with network_tier IN {PREFERRED, STANDARD}, else 0
      provider_ratio           = Count(ProviderDirectoryEntry rows with network_status == IN_NETWORK
                                       AND accepting_new_patients == true
                                       AND provider_npi IN member.provider_npis)
                                 / max(1, Count(member.provider_npis))
      cost_score               = max(0, 1000 - plan_out_of_pocket_cents / COST_DIVISOR_CENTS)
      composite_score = Round2(
            WEIGHT_PLAN_TYPE * plan_type_affinity_match
          + WEIGHT_STAR      * plan.star_rating
          + WEIGHT_PHARMACY  * pharmacy_component
          + WEIGHT_PROVIDER  * provider_ratio
          + WEIGHT_COST      * cost_score )
      Each weighted term is rounded to 2dp, then the five rounded terms are summed and rounded once more.
      Ranking: descending composite_score; ties broken by ascending plan.monthly_premium_cents, then ascending
      plan.created_at. The top-ranked plan is the recommendation.
    input_set: "Plans whose status == ACTIVE and whose (state_code, county_code) equals the member's (state_code, county_code). Plans in status TERMINATED are excluded."
    constants:
      WEIGHT_PLAN_TYPE: 10
      WEIGHT_STAR: 12
      WEIGHT_PHARMACY: 8
      WEIGHT_PROVIDER: 15
      WEIGHT_COST: 1.0
      COST_DIVISOR_CENTS: 100
    precision: "2 decimal places, round_half_up per weighted term, then once for the sum"

  - name: complaint_finding_codes
    trigger: "POST /complaints/{id}/substantiate"
    algorithm: fixed
    formula: |
      finding_code = the first matching row of the table below, evaluated top to bottom:
        ("SHOPPER_SOA_FAILURE",         source == SECRET_SHOPPER and soa_requested_correctly == false)
        ("SHOPPER_DISCLAIMER_FAILURE",  source == SECRET_SHOPPER and disclaimer_played == false)
        ("SHOPPER_MARKETING_FAILURE",   source == SECRET_SHOPPER and approved_marketing_used == false)
        ("SHOPPER_LOW_SCORE",           source == SECRET_SHOPPER and shopper_score < SHOPPER_SCORE_FLOOR)
        ("SOA_VIOLATION",               complaint_type IN {SOA_MISSING, DISENROLLMENT_DELAY})
        ("DISCLAIMER_VIOLATION",        complaint_type == DISCLAIMER_MISSING)
        ("MARKETING_VIOLATION",         complaint_type IN {UNAPPROVED_MARKETING, MISREPRESENTATION, PLAN_MISREPRESENTATION})
        ("RECORDING_VIOLATION",         complaint_type == RECORDING_MISSING)
        ("GENERAL_FINDING",             otherwise)
    input_set: "The single Complaint under substantiation."
    constants:
      SHOPPER_SCORE_FLOOR: 70
    precision: "exact string; the row order is the priority order"

  - name: agent_compliance_risk_score
    trigger: "Any CallSession completion or drop, Enrollment disenrollment, Complaint substantiation, appeal reversal, CoachingAssignment creation, completion, or overdue recomputation"
    algorithm: weighted_scoring
    formula: |
      session_penalty = Sum over this agent's CallSession rows with status IN {COMPLETED, DROPPED} of
                          Round2( 3.0 * (recording_id is null or recording_status == MISSING)
                                + 7.0 * (disclaimer_delivered == false)
                                + 2.0 * (scope_of_appointment_id is null
                                         or the attached scope's plan_types_authorized is empty) )
      enrollment_penalty = 10.0 * Count(this agent's Enrollment rows with disenrollment_status == RAPID_DISENROLLED)
      complaint_penalty  = Sum over this agent's Complaint rows with status IN {SUBSTANTIATED, APPEALED}
                             and substantiated_on >= logical clock - RISK_WINDOW_DAYS of
                             COMPLAINT_SEVERITY_POINTS[severity]
      coaching_penalty   = 5.0 * Count(this agent's CoachingAssignment rows with status IN {ASSIGNED, IN_PROGRESS, OVERDUE})
      overdue_penalty    = 3.0 * Sum of max(0, overdue_days) over this agent's CoachingAssignment rows with status OVERDUE
      compliance_risk_score = Round2(session_penalty + enrollment_penalty + complaint_penalty + coaching_penalty + overdue_penalty)
    input_set: "Only this agent's own rows: CallSession status IN {COMPLETED, DROPPED}; Enrollment disenrollment_status == RAPID_DISENROLLED; Complaint status IN {SUBSTANTIATED, APPEALED} substantiated within RISK_WINDOW_DAYS; CoachingAssignment status IN {ASSIGNED, IN_PROGRESS, OVERDUE}. RINGING and IN_PROGRESS calls contribute nothing."
    constants:
      RISK_WINDOW_DAYS: 365
      SESSION_RECORDING_PENALTY: 3.0
      SESSION_DISCLAIMER_PENALTY: 7.0
      SESSION_SCOPE_PENALTY: 2.0
      RAPID_DISENROLLMENT_PENALTY: 10.0
      COMPLAINT_SEVERITY_POINTS: { LOW: 8.0, MEDIUM: 16.0, HIGH: 24.0 }
      COACHING_ASSIGNMENT_POINTS: 5.0
      OVERDUE_DAY_POINTS: 3.0
    precision: "2 decimal places, round_half_up; each per-session penalty is rounded, then the five summands are summed in the listed order and rounded once"

  - name: agency_compliance_posture
    trigger: "Any complaint substantiation, appeal reversal, coaching assignment creation or closure, call completion or drop, or enrollment withdrawal"
    algorithm: constraint_propagation
    formula: |
      substantiated_complaint_rate =
          Round6( Count(Complaint rows whose agent.agency_id == this agency.id and status IN {SUBSTANTIATED, APPEALED})
                  / max(1, Count(CallSession rows of this agency's agents with status IN {COMPLETED, AMENDED})) )
      strike_count = Count(Complaint rows whose agent.agency_id == this agency.id
                            and status IN {SUBSTANTIATED, APPEALED}
                            and substantiated_on >= logical clock - POSTURE_STRIKE_WINDOW_DAYS)
      loss_ratio   = the §1.3 agency_compliance_loss_ratio result
      Branches are evaluated top to bottom and the first match wins:
        if strike_count >= POSTURE_FREEZE_STRIKES                          -> FROZEN
        else if loss_ratio >= POSTURE_FREEZE_LOSS_RATIO                    -> FROZEN
        else if substantiated_complaint_rate >= POSTURE_RESTRICT_THRESHOLD -> RESTRICTED
        else if any CoachingAssignment of this agency's agents has overdue_days >= 1 -> RESTRICTED
        else                                                               -> OPEN
      The recomputation reads only the standing complaint, call, ledger and coaching state — never the
      stored posture — so a single recompute can jump straight from OPEN to FROZEN. When the recomputed
      posture differs from the stored one, the §1.2 Agency transitions run: OPEN→FROZEN when the jump is
      two levels, otherwise OPEN→RESTRICTED or RESTRICTED→FROZEN, and only one transition per recompute.
    input_set: "Complaints whose agent.agency_id equals this agency's id with status IN {SUBSTANTIATED, APPEALED}; CallSessions of this agency's agents with status IN {COMPLETED, AMENDED}; CoachingAssignments of this agency's agents with overdue_days >= 1."
    constants:
      POSTURE_FREEZE_STRIKES: 5
      POSTURE_FREEZE_LOSS_RATIO: 0.20
      POSTURE_RESTRICT_THRESHOLD: 0.05
      POSTURE_STRIKE_WINDOW_DAYS: 365
      POSTURE_OVERDUE_COACHING_DAYS: 1
    precision: "substantiated_complaint_rate to 6 decimal places, round_half_up; the posture enum is exact"

  - name: agency_compliance_loss_ratio
    trigger: "Any ledger finalization or reversal, any disenrollment, any complaint substantiation or appeal reversal, and any call completion or drop"
    algorithm: aggregation
    formula: |
      finalized_chargeback_total = Count(CommissionLedgerEntry rows whose enrollment.agency_id == this agency.id
                                         AND entry_type == CHARGEBACK
                                         AND status == FINALIZED
                                         AND amount_cents < 0)
      live_book_size = Count(Enrollment rows whose agency_id == this agency.id
                             AND disenrollment_status == ENROLLED)
      loss_ratio = Round6( finalized_chargeback_total / max(1, live_book_size) )
    input_set: "FINALIZED CHARGEBACK entries with a strictly negative amount_cents, counted once per entry (not summed by magnitude), divided by the count of enrollments currently in the ENROLLED disenrollment state."
    constants:
      LOSS_RATIO_SCOPE: "agency-wide; entries are attributed to the agency through their enrollment"
    precision: "6 decimal places, round_half_up"

  - name: coaching_overdue_days
    trigger: "Any read of a CoachingAssignment and any mutation of its agent"
    algorithm: decay_function
    formula: |
      due_on = assigned_on + COACHING_DUE_DAYS
      overdue_days = 0 if logical clock <= due_on else whole days from due_on to the logical clock
    input_set: "The single CoachingAssignment and the logical clock."
    constants:
      COACHING_DUE_DAYS: 14
    precision: "whole days (integer); the boundary is inclusive — the clock reading exactly due_on is not yet overdue"

  - name: commission_ledger_entry
    trigger: "Enrollment creation, acknowledgment, effectuation, withdrawal, disenrollment; ledger finalize, reverse, reinstate, reinstate-finalized"
    algorithm: tiered_pricing
    formula: |
      annual_initial = RoundHalfUp( plan.monthly_premium_cents * 12 * carrier.initial_commission_rate_pct )
      annual_renewal = RoundHalfUp( plan.monthly_premium_cents * 12 * carrier.renewal_commission_rate_pct )
      INITIAL:    amount_cents =  annual_initial
      RENEWAL:    amount_cents =  annual_renewal
      CHARGEBACK: amount_cents = -RoundHalfUp( annual_initial * selected_chargeback_pct )
      ADJUSTMENT: amount_cents =  the operator-supplied amount_cents when the request carries one
                                 (POST /corrections, POST /enrollments/{id}/commission-adjustment);
                                 otherwise RoundHalfUp( plan.monthly_premium_cents * RENEWAL_ADJUSTMENT_MONTHS
                                                       * carrier.renewal_commission_rate_pct )
      REVERSAL:   amount_cents = -Sum of amount_cents over every CommissionLedgerEntry of the same enrollment with status != REVERSED
      amount_cents is rounded to the cent at the point of the outer multiplication and only then negated or
      multiplied by the chargeback percentage — the order is pinned here and MUST NOT be re-associated.
    input_set: "The Enrollment and its Plan and Carrier. REVERSED entries are excluded from every base, including the REVERSAL base."
    constants:
      RENEWAL_ADJUSTMENT_MONTHS: 1
    precision: "2 decimal places, round_half_up at the outer multiplication, then negation"

  - name: aep_daily_submission_capacity_check
    trigger: "POST /enrollments"
    algorithm: threshold
    formula: |
      day = the UTC calendar day of enrollment.effective_date
      committed = Count(Enrollment rows with agency_id == agency.id
                        AND the UTC calendar day of effective_date == day
                        AND submission_status NOT IN {REJECTED, WITHDRAWN})
      capacity_available = ( committed < agency.aep_daily_submission_capacity )
    input_set: "Enrollments of the same agency whose effective_date falls on the same UTC calendar day and whose submission_status is not REJECTED or WITHDRAWN."
    constants: {}
    precision: "exact integer comparison; the boundary is strict — committed equal to capacity blocks the submission"

  - name: soa_validity_window
    trigger: "POST /enrollments and POST /call-sessions/{id}/connect"
    algorithm: threshold
    formula: |
      expires_on       = scope.captured_on + agency.soa_max_age_days
      retained_until   = scope.captured_on + agency.soa_retention_days
      is_usable(scope) = ( scope.status == CAPTURED
                           AND logical clock >= scope.captured_on
                           AND logical clock <= expires_on )
    input_set: "The single ScopeOfAppointment and its owning Agency."
    constants: {}
    precision: "exact datetime comparison; the boundary is inclusive — the clock reading exactly expires_on is still usable"

  - name: recording_retention_status
    trigger: "Any read of a CallSession"
    algorithm: decay_function
    formula: |
      recording_retained_until = call.started_at + agency.recording_retention_days
      recording_status = MISSING  if call.recording_id is null
                       = EXPIRED  if logical clock > call.recording_retained_until
                       = RECORDED otherwise
    input_set: "The single CallSession and its owning Agency's recording_retention_days."
    constants: {}
    precision: "exact datetime comparison; the clock reading exactly recording_retained_until is still RECORDED"

# =============================================================================
# Table 4: Validation Rules Table, ordered by priority  (§1.4)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must both be present; X-User-Role must name a role declared in §1.7; for entity_backed roles X-User-ID must be the id of an existing row of that entity"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all endpoints"

  - priority: 2
    category: auth
    check: "The acting role must be listed in the endpoint's roles; this is a strict allow-list, so a role absent from the list is denied rather than downgraded"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: "all endpoints"

  - priority: 3
    category: existence
    check: "Path resource ids must resolve, validated left-to-right in path order; the first unresolvable segment produces its entity-specific not-found error"
    error_id: "ERR_NOT_FOUND / ERR_{RESOURCE}_NOT_FOUND"
    http_status: 404
    applies_to: "all resource endpoints"

  - priority: 4
    category: business_referential
    check: "Ids supplied in the request BODY must resolve, validated in the order the endpoint's input list declares them; the first unresolvable id produces its entity-specific not-found error"
    error_id: "ERR_{RESOURCE}_NOT_FOUND"
    http_status: 404
    applies_to: "POST /call-sessions, POST /scope-of-appointments, POST /enrollments, POST /plans, POST /formulary-drugs, POST /pharmacy-network-entries, POST /provider-directory-entries, POST /complaints, POST /coaching-assignments, POST /commission-ledger-entries, POST /carrier-reconciliations, POST /agents/{id}/licenses, POST /agents/{id}/appointments, POST /agents/{id}/certifications"

  - priority: 5
    category: business_safety
    check: "Agency.compliance_posture must be OPEN or RESTRICTED; every mutating child operation is refused while the agency posture is FROZEN"
    error_id: ERR_AGENCY_FROZEN
    http_status: 403
    applies_to: "POST /call-sessions, POST /call-sessions/{id}/connect, POST /enrollments, POST /enrollments/{id}/withdraw, POST /agents/{id}/licenses, POST /agents/{id}/appointments, POST /agents/{id}/certifications, POST /agents/{id}/reinstate, POST /agents/{id}/rehire, POST /scope-of-appointments, POST /commission-ledger-entries/{id}/reinstate, POST /commission-ledger-entries/{id}/reinstate-finalized, POST /enrollments/{id}/disenroll"

  - priority: 6
    category: business_safety
    check: "A ScopeOfAppointment in status CAPTURED must exist for the member, must have been captured at or before the logical clock, must authorize plan types for the plan being discussed, and must not already have been consumed or voided"
    error_id: ERR_SCOPE_OF_APPOINTMENT_MISSING
    http_status: 422
    applies_to: "POST /call-sessions, POST /call-sessions/{id}/connect, POST /enrollments, POST /plan-comparisons"

  - priority: 7
    category: business_safety
    check: "The ScopeOfAppointment's agent_id must equal the enrolling or calling agent's id; a beneficiary's scope captured by one agent cannot be spent by another"
    error_id: ERR_SCOPE_AGENT_MISMATCH
    http_status: 403
    applies_to: "POST /call-sessions, POST /call-sessions/{id}/connect, POST /enrollments"

  - priority: 8
    category: business_safety
    check: "The plan type being discussed must be a member of ScopeOfAppointment.plan_types_authorized"
    error_id: ERR_PLAN_TYPE_NOT_AUTHORIZED
    http_status: 422
    applies_to: "POST /call-sessions/{id}/connect, POST /enrollments, POST /plan-comparisons"

  - priority: 9
    category: business_temporal
    check: "A recording must exist for the call and the CMS disclaimer script must have been delivered before any plan type is discussed; waived only when ScopeOfAppointment.capture_channel == WRITTEN"
    error_id: ERR_DISCLAIMER_NOT_DELIVERED
    http_status: 422
    applies_to: "POST /call-sessions/{id}/connect, POST /call-sessions/{id}/complete, POST /call-sessions/{id}/finalize-amendment"

  - priority: 10
    category: business_temporal
    check: "The agent's live-call interval [started_at, scheduled_end_at) must not overlap another live-call interval of the same agent; an interval that only touches at an endpoint does not overlap"
    error_id: ERR_AGENT_HAS_ACTIVE_CALL
    http_status: 409
    applies_to: "POST /call-sessions, POST /call-sessions/{id}/connect"

  - priority: 11
    category: business_safety
    check: "The agent must hold a CarrierAppointment in status APPOINTED, an AgentStateLicense with license_status VALID, and a CarrierCertification in status CERTIFIED for the carrier, product type and state of the plan being submitted"
    error_id: ERR_AGENT_NOT_APPOINTED
    http_status: 422
    applies_to: "POST /enrollments, POST /plan-comparisons"

  - priority: 12
    category: business_constraint
    check: "Plan, Member and Agent must all belong to the same Agency"
    error_id: ERR_MEMBER_NOT_IN_AGENCY
    http_status: 422
    applies_to: "POST /plan-comparisons, POST /enrollments"

  - priority: 13
    category: business_constraint
    check: "Member.state_code and Member.county_code must match Plan.state_code and Plan.county_code; the plan must also be in status ACTIVE"
    error_id: ERR_PLAN_NOT_IN_SERVICE_AREA
    http_status: 422
    applies_to: "POST /enrollments, POST /plan-comparisons"

  - priority: 14
    category: business_temporal
    check: "AEP calendar-window enforcement: when the enrollment's effective_date falls inside the agency's [aep_start_date, aep_end_date] window, the plan's plan_type must be MA, MAPD or SNP; PDP elections are refused inside the window"
    error_id: ERR_AEP_WINDOW_VIOLATION
    http_status: 422
    applies_to: "POST /enrollments"

  - priority: 15
    category: business_fiscal
    check: "The count of non-REJECTED, non-WITHDRAWN enrollments whose effective_date falls on the same UTC calendar day must be strictly below Agency.aep_daily_submission_capacity"
    error_id: ERR_AEP_DAILY_SUBMISSION_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /enrollments"

  - priority: 16
    category: state
    check: "The target resource must be in a state from which the requested transition is declared in §1.2"
    error_id: "ERR_*_NOT_* (e.g. ERR_CALL_NOT_IN_PROGRESS, ERR_CALL_NOT_COMPLETED, ERR_ENROLLMENT_NOT_SUBMITTED, ERR_LEDGER_ENTRY_NOT_PROVISIONAL, ERR_AGENT_NOT_CERTIFIED)"
    http_status: 409
    applies_to: "all action endpoints"

  - priority: 17
    category: state
    check: "Enrollment.disenrollment_status must be ENROLLED and submission_status must be EFFECTUATED before a disenrollment can be recorded"
    error_id: ERR_ENROLLMENT_NOT_ENROLLED
    http_status: 409
    applies_to: "POST /enrollments/{id}/disenroll"

  - priority: 18
    category: business_constraint
    check: "The enrollment's carrier-side window must still be open: acknowledgment before submitted_on + Carrier.ack_expected_within_days and effectuation before acknowledged_on + Carrier.effectuation_expected_within_days"
    error_id: "ERR_ACK_WINDOW_EXPIRED / ERR_EFFECTUATION_WINDOW_EXPIRED"
    http_status: 409
    applies_to: "POST /enrollments/{id}/acknowledge, POST /enrollments/{id}/effectuate"

  - priority: 19
    category: business_fiscal
    check: "The rapid-disenrollment chargeback may only be posted when is_rapid_disenrollment is true, and a standard disenrollment must carry a zero chargeback"
    error_id: "ERR_NOT_RAPID_DISENROLLMENT / ERR_RAPID_DISENROLLMENT_REQUIRES_CHARGEBACK"
    http_status: 409
    applies_to: "POST /enrollments/{id}/disenroll"

  - priority: 20
    category: business_fiscal
    check: "A correction ledger entry is refused unless it names an OPEN CarrierReconciliation for its carrier and period_month"
    error_id: ERR_NO_OPEN_RECONCILIATION
    http_status: 409
    applies_to: "POST /corrections"

  - priority: 21
    category: business_constraint
    check: "Reversal and reinstatement of a ledger entry must leave Agency.commission_balance_cents unchanged by the compensating pair: reverse then reinstate restores the exact pre-reversal value"
    error_id: ERR_COMMISSION_LEDGER_INVARIANT_VIOLATION
    http_status: 409
    applies_to: "POST /commission-ledger-entries/{id}/reverse, POST /commission-ledger-entries/{id}/reinstate"

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 5: API Endpoint Table  (§1.5)
# =============================================================================
endpoints:
  # --- Test-driving endpoints ------------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. At startup, before this endpoint is ever called, the logical clock reads exactly 2026-09-01T00:00:00Z and never falls back to real wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [current_utc]
    output: { current_utc: datetime }
    side_effects: ["The logical clock is set to the supplied instant; every clock-derived computed field is re-derived on its next read"]

  - method: POST
    path: "/_maintenance/recompute-compliance-posture"
    description: "Reserved engine namespace for PRD-generation-time extension. Do not target this namespace in tests. Force §1.3 agency_compliance_posture to recompute for the agency and run any posture cascade that becomes due; used by operators after bulk data loads."
    roles: [PlatformAdmin, ComplianceOfficer, DirectorOfSales, LicensingCoordinator, Coach, CarrierIntegration, LicensedAgent, Any]
    code: 200
    input: [agency_id]
    output: Agency
    side_effects: ["Agency.compliance_posture recomputed", "Agency OPEN→RESTRICTED or RESTRICTED→FROZEN cascade runs when the recomputation crosses"]

  # --- Agencies --------------------------------------------------------------
  - method: POST
    path: "/agencies"
    description: "Create a call-center agency"
    roles: [PlatformAdmin]
    code: 201
    input: [name, service_center_code, aep_start_date, aep_end_date, aep_daily_submission_capacity, "recording_retention_days?", "soa_retention_days?", "soa_max_age_days?", "rapid_disenrollment_day_limit?", "max_live_calls_per_agent?", "max_open_coaching_per_agent?"]
    output: Agency
    side_effects: ["compliance_posture initialized to OPEN", "commission_balance_cents initialized to 0", "open_complaint_count initialized to 0", "substantiated_complaint_rate initialized to 0"]

  - method: GET
    path: "/agencies"
    description: "List agencies"
    roles: [PlatformAdmin, DirectorOfSales, ComplianceOfficer, LicensingCoordinator, Coach, CarrierIntegration, LicensedAgent, Any]
    code: 200
    input: ["name?", "compliance_posture?", "limit?", "offset?"]
    output: "Agency[]"
    side_effects: []

  - method: GET
    path: "/agencies/{id}"
    description: "Get an agency"
    roles: [PlatformAdmin, DirectorOfSales, ComplianceOfficer, LicensingCoordinator, Coach, CarrierIntegration, LicensedAgent, Any]
    code: 200
    input: []
    output: Agency
    side_effects: []

  - method: PUT
    path: "/agencies/{id}"
    description: "Update mutable agency configuration"
    roles: [PlatformAdmin]
    code: 200
    input: ["name?", "service_center_code?", "aep_start_date?", "aep_end_date?", "aep_daily_submission_capacity?", "recording_retention_days?", "soa_retention_days?", "soa_max_age_days?", "rapid_disenrollment_day_limit?", "max_live_calls_per_agent?", "max_open_coaching_per_agent?", "expected_agency_version"]
    output: Agency
    side_effects: ["Agency.version incremented by 1", "Submitted expected_agency_version is compared against Agency.version; a mismatch yields ERR_STALE_VERSION", "recording_retained_until and soa expires_on recomputed for children when the retention inputs change"]

  - method: POST
    path: "/agencies/{id}/posture-reset"
    description: "Step the agency posture back one level: FROZEN→RESTRICTED or RESTRICTED→OPEN"
    roles: [ComplianceOfficer]
    code: 200
    input: ["target_posture"]
    output: Agency
    side_effects: ["compliance_posture → target_posture", "posture_since = logical clock", "RESTRICTED→OPEN re-activates SUSPENDED agents with no open coaching assignment"]

  - method: GET
    path: "/agencies/{id}/book-of-business"
    description: "Forward-looking book-of-business projection for the agency"
    roles: [PlatformAdmin, DirectorOfSales, ComplianceOfficer]
    code: 200
    input: ["window_days?"]
    output: { agency_id: string, window_start: datetime, window_end: datetime, provisional_book_commission_cents: number, qualifying_enrollment_count: integer }
    side_effects: ["Runs §1.3 provisional_book_commission"]

  - method: GET
    path: "/agencies/{id}/agents"
    description: "List the agency's agents"
    roles: [PlatformAdmin, DirectorOfSales, ComplianceOfficer, LicensingCoordinator, Coach, Any]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "Agent[]"
    side_effects: []

  - method: GET
    path: "/agencies/{id}/members"
    description: "List the agency's members"
    roles: [PlatformAdmin, DirectorOfSales, ComplianceOfficer, LicensedAgent, Any]
    code: 200
    input: ["state_code?", "limit?", "offset?"]
    output: "Member[]"
    side_effects: []

  # --- Carriers --------------------------------------------------------------
  - method: POST
    path: "/carriers"
    description: "Create a carrier"
    roles: [PlatformAdmin]
    code: 201
    input: [legal_name, naic_number, contract_type, initial_commission_rate_pct, renewal_commission_rate_pct, chargeback_clawback_pct, "ack_expected_within_days?", "effectuation_expected_within_days?"]
    output: Carrier
    side_effects: ["status initialized to ACTIVE"]

  - method: GET
    path: "/carriers"
    description: "List carriers"
    roles: [PlatformAdmin, DirectorOfSales, CarrierIntegration, ComplianceOfficer, LicensingCoordinator, Any]
    code: 200
    input: ["contract_type?", "status?", "limit?", "offset?"]
    output: "Carrier[]"
    side_effects: []

  - method: GET
    path: "/carriers/{id}"
    description: "Get a carrier"
    roles: [PlatformAdmin, DirectorOfSales, CarrierIntegration, ComplianceOfficer, LicensingCoordinator, Any]
    code: 200
    input: []
    output: Carrier
    side_effects: []

  - method: PUT
    path: "/carriers/{id}"
    description: "Update carrier rates and contractual status"
    roles: [PlatformAdmin]
    code: 200
    input: ["legal_name?", "initial_commission_rate_pct?", "renewal_commission_rate_pct?", "chargeback_clawback_pct?", "ack_expected_within_days?", "effectuation_expected_within_days?", "status?", "expected_carrier_version"]
    output: Carrier
    side_effects: ["Carrier.version incremented by 1", "Submitted expected_carrier_version is compared against Carrier.version; a mismatch yields ERR_STALE_VERSION"]

  - method: GET
    path: "/carriers/{id}/plans"
    description: "List the carrier's plans"
    roles: [PlatformAdmin, DirectorOfSales, ComplianceOfficer, LicensedAgent, Any]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "Plan[]"
    side_effects: []

