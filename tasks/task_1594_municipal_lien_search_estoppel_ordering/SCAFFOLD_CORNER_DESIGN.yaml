        claim_type: immediate
        grounds: [complexity_profile.consistency_model, calculations.task_unpaid_balance]
        distinguishing_aspect: "Mutations are visible in the triggering response itself (immediate consistency): the record-findings response already carries status IN_PROGRESS and the recomputed unpaid_balance_cents 300000; the complete response already carries fee_charged_cents 5000 — no re-read required."
        test_recipe:
          setup: ["Single-dept config; order identified; task PENDING at version 1"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ProviderAdmin }
            - call: "POST /jurisdictions"
              payload: { code: "FL-DADE", name: "Miami-Dade", state_code: "FL" }
              as: ProviderAdmin
              captures: { j_id: "$.data.id" }
            - call: "POST /statutes"
              payload: { jurisdiction_id: "${j_id}", effective_from: "2026-01-01", effective_to: null, estoppel_response_days: 10, estoppel_fee_cap_cents: 12000, estoppel_validity_days: 30 }
              as: ProviderAdmin
            - call: "POST /departments"
              payload: { jurisdiction_id: "${j_id}", dept_type: "UTILITY", name: "Water & Sewer", research_fee_cents: 5000, rush_surcharge_cents: 2500, supports_rush: true }
              as: ProviderAdmin
            - call: "POST /search-orders"
              payload: { property_address: "4 AI St", parcel_number: "P-AI4", closing_date: "2026-08-20", order_class: "STANDARD" }
              as: TitleAgent
              as_user_id: "agent_1"
              captures: { o_id: "$.data.id" }
            - { call: "POST /search-orders/${o_id}/identify-jurisdiction", payload: { jurisdiction_id: "${j_id}" }, as: ResearchAnalyst, as_user_id: "analyst_1" }
