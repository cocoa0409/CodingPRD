      - name: specification_supersession_target_must_be_ratified_first
        claim_type: parent_relationships
        grounds:
          - entities.Specification.fields.supersedes_specification_id
          - validations[priority=13]
          - validations[priority=51]
          - endpoints[GET /specifications]
        distinguishing_aspect: >
          supersedes_specification_id is the self-referential edge of the graph topology, and its target
          must already be RATIFIED or DEPRECATED. The identical create body therefore fails with 409
          while the target is DRAFT and succeeds the moment the target is ratified - and the resulting
          chain is queryable through the supersedes_specification_id list filter.
        test_recipe:
          setup:
            - "One DRAFT Specification S1 with one LIGHTING feature set."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /specifications"
              payload: { version_label: "SHIC-1.0", security_baseline_level: "SB1", effective_date: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { s1_id: $.data.id }
            - call: "POST /feature-sets"
              payload: { specification_id: "${s1_id}", device_type: "LIGHTING", feature_code: "CORE_ONOFF", obligation: "MANDATORY", test_case_count: 20 }
              as: ProgramAdmin
          trigger:
            - call: "POST /specifications"
              payload: { version_label: "SHIC-2.0", security_baseline_level: "SB2", effective_date: "2026-10-01T00:00:00Z", supersedes_specification_id: "${s1_id}" }
              as: ProgramAdmin
              captures: { err_draft_target: $.data.error_id }
            - call: "POST /specifications"
              payload: { version_label: "SHIC-2.0", security_baseline_level: "SB2", effective_date: "2026-10-01T00:00:00Z", supersedes_specification_id: "00000000-0000-4000-8000-000000000000" }
              as: ProgramAdmin
              captures: { err_unknown_target: $.data.error_id }
            - call: "POST /specifications/${s1_id}/ratify"
              payload: {}
              as: ProgramAdmin
            - call: "POST /specifications"
              payload: { version_label: "SHIC-2.0", security_baseline_level: "SB2", effective_date: "2026-10-01T00:00:00Z", sunset_date: "2026-09-30T00:00:00Z", supersedes_specification_id: "${s1_id}" }
              as: ProgramAdmin
              captures: { err_dates: $.data.error_id }
            - call: "POST /specifications"
              payload: { version_label: "SHIC-2.0", security_baseline_level: "SB2", effective_date: "2026-10-01T00:00:00Z", sunset_date: "2027-10-01T00:00:00Z", supersedes_specification_id: "${s1_id}", min_plugfest_credits: 4 }
              as: ProgramAdmin
              captures: { s2_id: $.data.id }
            - call: "GET /specifications"
              payload: { supersedes_specification_id: "${s1_id}", limit: 10, offset: 0 }
              as: PublicViewer
            - call: "POST /specifications"
              payload: { version_label: "SHIC-2.0", security_baseline_level: "SB3", effective_date: "2026-11-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { err_dup_label: $.data.error_id }
          assert:
            - "Superseding a DRAFT target returns 409 ERR_INVALID_SPECIFICATION_STATE"
            - "An unstored target returns 404 ERR_SPECIFICATION_NOT_FOUND"
            - "sunset_date at or before effective_date returns 422 ERR_INVALID_DATE_RANGE"
            - "Once S1 is RATIFIED the same body succeeds: Specification.${s2_id}.supersedes_specification_id == ${s1_id}, status == \"DRAFT\", min_plugfest_credits == 4"
            - "GET /specifications?supersedes_specification_id=${s1_id} returns total_count == 1 with data[0].id == ${s2_id}"
            - "A second row reusing version_label \"SHIC-2.0\" returns 409 ERR_DUPLICATE_NAME (validation priority 51)"
            - "Specification.${s1_id}.status is still \"RATIFIED\" - being superseded is not itself a transition"

  - section: state_machines
    instances:
      - name: specification_ratify_demands_coverage_and_refuses_a_second_call
        claim_type: idempotency
        grounds:
          - state_machines.Specification.transitions.DRAFT_to_RATIFIED
          - validations[priority=43]
          - validations[priority=13]
          - errors[ERR_MANDATORY_COVERAGE_INCOMPLETE]
        distinguishing_aspect: >
          Ratification has two preconditions beyond the status check and both report
          ERR_MANDATORY_COVERAGE_INCOMPLETE: an empty feature population, and a device_type that carries
          feature sets but no MANDATORY one. Once the transition succeeds the same trigger is no longer
          idempotent - the second call is 409 ERR_INVALID_SPECIFICATION_STATE, not another 200.
        test_recipe:
          setup:
            - "Empty database, clock at 2026-09-01T00:00:00Z."
            - "Specification S1 has no feature sets at all. Specification S2 has one THERMOSTAT OPTIONAL feature set and no MANDATORY one."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /specifications"
              payload: { version_label: "SHIC-EMPTY", security_baseline_level: "SB1", effective_date: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { s1_id: $.data.id }
            - call: "POST /specifications"
              payload: { version_label: "SHIC-OPTONLY", security_baseline_level: "SB1", effective_date: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { s2_id: $.data.id }
            - call: "POST /feature-sets"
              payload: { specification_id: "${s2_id}", device_type: "THERMOSTAT", feature_code: "ECO_MODE", obligation: "OPTIONAL", test_case_count: 8 }
              as: ProgramAdmin
              captures: { fs_opt_id: $.data.id }
          trigger:
            - call: "POST /specifications/${s1_id}/ratify"
              payload: {}
              as: ProgramAdmin
              captures: { err_empty: $.data.error_id }
            - call: "POST /specifications/${s2_id}/ratify"
              payload: {}
              as: ProgramAdmin
              captures: { err_no_mandatory: $.data.error_id }
            - call: "POST /feature-sets"
              payload: { specification_id: "${s2_id}", device_type: "THERMOSTAT", feature_code: "SETPOINT", obligation: "MANDATORY", test_case_count: 12 }
              as: ProgramAdmin
            - call: "POST /specifications/${s2_id}/ratify"
              payload: {}
              as: ProgramAdmin
            - call: "POST /specifications/${s2_id}/ratify"
