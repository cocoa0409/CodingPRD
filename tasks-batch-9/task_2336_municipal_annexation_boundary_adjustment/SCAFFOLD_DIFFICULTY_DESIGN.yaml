            - call: "POST /annexation-cases/${case_vi}/parcels"
              payload: { primary_owner_id: "${ow_vi}", parcel_apn: "VI-1", assessed_value_cents: 40000000, acreage: 5.00, is_developed: true, dwelling_units: 2 }
              as: MunicipalPlanner
              as_user_id: "${muni_vi}"
            - call: "POST /annexation-cases/${case_vi}/parcels"
              payload: { primary_owner_id: "${ow_vi}", parcel_apn: "VI-2", assessed_value_cents: 30000000, acreage: 5.00, is_developed: true, dwelling_units: 2 }
              as: MunicipalPlanner
              as_user_id: "${muni_vi}"
            - call: "POST /annexation-cases/${case_vi}/parcels"
              payload: { primary_owner_id: "${ow_vi}", parcel_apn: "VI-3", assessed_value_cents: 20000000, acreage: 5.00, is_developed: true, dwelling_units: 2 }
