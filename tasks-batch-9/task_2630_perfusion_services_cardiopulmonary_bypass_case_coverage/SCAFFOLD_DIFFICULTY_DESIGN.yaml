            - call: "POST /perfusionists/${p1}/ce-activities"
              payload: { category: "SAFETY", credit_hours: 7.5, activity_date: "2026-04-01T00:00:00Z", accreditation_body: "AMSECT" }
              as: ContractAdmin
              captures: { ce2: $.data.id }
            - call: "POST /call-rotation-slots"
              payload: { contract_id: "${c1}", perfusionist_id: "${p1}", slot_type: "PRIMARY_CALL", window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-04T00:00:00Z" }
              as: ChiefPerfusionist
              as_user_id: "${chief}"
              captures: { slot_p1: $.data.id }
            - call: "POST /bypass-cases"
              payload: { contract_id: "${c1}", surgeon_id: "${s1}", procedure_type: "CABG", scheduled_start: "2026-08-02T06:00:00Z", scheduled_end: "2026-08-02T12:00:00Z", acuity: "ELECTIVE" }
              as: ChiefPerfusionist
              as_user_id: "${chief}"
              captures: { case1: $.data.id, case1_v: $.data.version }
          trigger:
            - call: "POST /ce-activities/${ce1}/verification"
              payload: { decision: "VERIFIED", note: "transcript checked against the ABCP portal" }
              as: ContractAdmin
            - call: "POST /ce-activities/${ce2}/verification"
              payload: { decision: "VERIFIED", note: "AMSECT certificate on file" }
              as: ContractAdmin
            - call: "POST /ce-activities/${ce2}/verification"
              payload: { decision: "REVOKED", note: "AMSECT certificate withdrawn, hours cannot stand" }
              as: ContractAdmin
            - call: "POST /bypass-cases/${case1}/assign-perfusionist"
              payload: { perfusionist_id: "${p1}", expected_case_version: "${case1_v}" }
              as: ChiefPerfusionist
              as_user_id: "${chief}"
          assert:
            - "the baseline before the triggers is Perfusionist.${p1}.ce_credits_verified == 0.0 and ce_credits_pending == 20.0, with both CeActivity rows in SUBMITTED"
            - "after the first verification CeActivity.${ce1}.status == VERIFIED and Perfusionist.${p1}.ce_credits_verified == 12.5 with ce_credits_pending == 7.5 - the hours move between the two ledgers rather than being added twice"
            - "after the second verification Perfusionist.${p1}.ce_credits_verified == 20.0 and ce_credits_pending == 0.0"
            - "the revoke returns HTTP 200 with CeActivity.${ce2}.status == REVOKED, counted_toward_remediation == false, and version incremented; the row is retained, not deleted"
            - "the ledger lands exactly on its pre-verify value for that activity: Perfusionist.${p1}.ce_credits_verified == 12.5 and ce_credits_pending == 0.0 - the revoked hours are returned to neither bucket, and there is no 0.1 drift from the one-decimal rounding"
            - "Certification.${cert1}.status is still ACTIVE with probation_credits_banked == 0 and probation_count == 0, because none of these verifications happened under PROBATION"
            - "the final assignment returns HTTP 200: the ADMISSION variant reads 12.5 verified + 0.0 pending, giving 0.55 * (12.5 / 45) + 0.45 * (150 / 150) == 0.6027777... which rounds to 0.603 and clears READINESS_MIN_ADMISSION of 0.6"
            - "Perfusionist.${p1}.readiness_score == 0.603 with readiness_variant_last == ADMISSION; had the revoke not compensated the ledger the same call would have stored 0.694, so the difference is exactly CREDIT_WEIGHT * 7.5 / 45 before rounding"
