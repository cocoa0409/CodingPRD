# =============================================================================
# PRD Benchmark Seed Tables — Tea Blending & Packing Operations
# Difficulty target: beyond Expert (dense coupling, 13 entities, 58 endpoints)
# =============================================================================

scenario: |
  Tea Blending & Packing Operations (tea blender/packer): leaf lot sourcing &
  sensory grading, blend recipe consistency across lots, flavoring application
  & allergen control, tea-bag vs loose-pack line scheduling, moisture control &
  shelf-life, organic/fair-trade certification chain, private-label minimums,
  pesticide-residue testing & lot hold

domain_name: tea-blending-operations
api_prefix: /tea-ops

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: temporal_windowing
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - optimistic_concurrency
    - rate_threshold_triggers
  entity_topology: flat            # peer entities, FK references, no URL nesting of ownership
  state_machine_shape: cyclic      # retest loop (LeafLot), rework loop (BlendBatch), suspend/reinstate loops
  relationship_patterns: [one_to_many, many_to_many, cross_aggregate]
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Supplier
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Supplier / tea garden name" }
      - { name: origin_region, type: string, source: input, description: "Origin region or country" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED", default: ACTIVE }

  - name: LeafLot
    parent: null
    common_fields: true
    fields:
      - { name: supplier_id, type: string, source: input, description: "FK -> Supplier.id; sourcing supplier" }
      - { name: leaf_type, type: enum, source: input, description: "BLACK | GREEN | WHITE | OOLONG | HERBAL" }
      - { name: harvest_date, type: datetime, source: input, description: "Harvest date (YYYY-MM-DD, UTC date semantics)" }
      - { name: weight_kg, type: number, source: input, description: "Gross received weight in kg, > 0" }
      - { name: cost_per_kg_cents, type: integer, source: input, description: "Contract cost per kg in cents, >= 0" }
      - { name: moisture_pct, type: number, source: input, description: "Intake moisture percent, 0 < m <= 100" }
      - { name: remaining_weight_kg, type: number, source: computed, description: "weight_kg minus sum of ACTIVE BatchLotAllocation.allocated_kg; initialized = weight_kg" }
      - { name: registered_by_user_id, type: string, source: system, description: "X-User-ID of the ProcurementLead who registered the lot (SoD anchor)" }
      - { name: composite_grade, type: enum, source: computed, description: "NONE | A | B | C | REJECT; from latest GradeAssessment", default: NONE }
      - { name: latest_residue_verdict, type: enum, source: computed, description: "NONE | PASS | FAIL_SOFT | FAIL_HARD; from latest ResidueTest", default: NONE }
      - { name: status, type: enum, source: system, description: "REGISTERED | GRADED | LAB_SUBMITTED | ON_HOLD | RELEASED | REJECTED | DEPLETED" }

  - name: GradeAssessment
    parent: null
    common_fields: false
    fields:
      - { name: lot_id, type: string, source: system, description: "FK -> LeafLot.id; assessed lot" }
      - { name: grader_user_id, type: string, source: system, description: "X-User-ID of the SensoryGrader (SoD anchor)" }
      - { name: aroma_score, type: integer, source: input, description: "0..100" }
      - { name: briskness_score, type: integer, source: input, description: "0..100" }
      - { name: appearance_score, type: integer, source: input, description: "0..100" }
      - { name: composite_score, type: number, source: computed, description: "Weighted score, 1 decimal, round_half_up (see sensory_composite_grade)" }
      - { name: composite_grade, type: enum, source: computed, description: "A | B | C | REJECT per sensory_composite_grade thresholds" }

  - name: ResidueTest
    parent: null
    common_fields: false
    fields:
      - { name: lot_id, type: string, source: system, description: "FK -> LeafLot.id; tested lot" }
      - { name: lab_name, type: string, source: input, description: "Laboratory name" }
      - { name: measured_residue_ppm, type: number, source: input, description: "Measured pesticide residue ppm, >= 0" }
      - { name: test_method, type: string, source: input, description: "Lab method code (free-form string)" }
      - { name: submitted_by_user_id, type: string, source: system, description: "X-User-ID of the QALabAnalyst (SoD anchor)" }
      - { name: verdict, type: enum, source: computed, description: "PASS | FAIL_SOFT | FAIL_HARD per residue_verdict_threshold" }
      - { name: test_round, type: integer, source: computed, description: "1-based count of ResidueTest rows for this lot, chronological by created_at" }

  - name: Flavoring
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Flavoring agent name" }
      - { name: allergen_tags, type: array, source: input, description: "Subset of [TREE_NUT, SOY, GLUTEN, LACTOSE]; [] means allergen-free" }
      - { name: natural_certified, type: boolean, source: input, description: "True if certified natural (required for ORGANIC recipes)" }
      - { name: cost_per_kg_cents, type: integer, source: input, description: "Cost per kg in cents, >= 0" }
      - { name: status, type: enum, source: system, description: "ACTIVE | RETIRED", default: ACTIVE }

  - name: BlendRecipe
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Recipe name" }
      - { name: certification_target, type: enum, source: input, description: "CONVENTIONAL | ORGANIC | FAIR_TRADE" }
      - { name: pack_format, type: enum, source: input, description: "TEA_BAG | LOOSE_PACK" }
      - { name: components, type: array, source: input, description: "Array of {leaf_type, min_grade (A|B|C), pct}; pct values plus flavoring_pct MUST sum to exactly 100.00; grade ordering for min_grade comparison is A > B > C" }
      - { name: flavoring_id, type: string, source: input, description: "FK -> Flavoring.id; null when unflavored", default: null }
      - { name: flavoring_pct, type: number, source: input, description: "Percent of TOTAL batch weight reserved for flavoring; 0 when unflavored", default: 0 }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | RETIRED", default: DRAFT }

  - name: BlendBatch
    parent: null
    common_fields: true
    fields:
      - { name: recipe_id, type: string, source: input, description: "FK -> BlendRecipe.id; recipe being produced" }
      - { name: recipe_version, type: integer, source: system, description: "BlendRecipe.version pinned at lock-recipe" }
      - { name: pack_format, type: enum, source: system, description: "Snapshot of recipe.pack_format at creation: TEA_BAG | LOOSE_PACK" }
      - { name: target_weight_kg, type: number, source: input, description: "Target total batch weight incl. flavoring, > 0" }
      - { name: required_components, type: array, source: computed, description: "Snapshot at lock: [{leaf_type, min_grade, required_kg}] per recipe_component_scaling" }
      - { name: flavoring_kg, type: number, source: computed, description: "Kg of flavoring required, per recipe_component_scaling; 0 when unflavored" }
      - { name: allergen_tags, type: array, source: computed, description: "Copied from applied Flavoring.allergen_tags; [] until flavored", default: [] }
      - { name: measured_moisture_pct, type: number, source: input, description: "Post-blend moisture percent recorded by blend action" }
      - { name: yield_kg, type: number, source: computed, description: "Moisture-adjusted leaf yield per moisture_adjusted_yield (per-line rounding then sum)" }
      - { name: blended_by_user_id, type: string, source: system, description: "X-User-ID of the BlendMaster who ran blend (SoD anchor)" }
      - { name: provisional_cost_cents, type: integer, source: computed, description: "Forward-looking cost at finalize-allocation (see batch_cost_accounting)" }
      - { name: final_cost_cents, type: integer, source: computed, description: "Final cost at release incl. flavoring + waste (see batch_cost_accounting)" }
      - { name: actual_weight_kg, type: number, source: computed, description: "yield_kg + flavoring_kg, set at release" }
      - { name: cert_charges, type: array, source: system, description: "[{certificate_id, charged_kg}] consumed at first release; restored on recall", default: [] }
      - { name: status, type: enum, source: system, description: "DRAFT | RECIPE_LOCKED | ALLOCATED | BLENDED | FLAVORED | QC_REVIEW | ON_HOLD | RELEASED | RECALLED | CANCELLED" }

  - name: BatchLotAllocation
    parent: null
    common_fields: true
    fields:
      - { name: batch_id, type: string, source: system, description: "FK -> BlendBatch.id; owning batch" }
      - { name: lot_id, type: string, source: input, description: "FK -> LeafLot.id; allocated lot" }
      - { name: allocated_kg, type: number, source: input, description: "Kg drawn from the lot, > 0, <= lot.remaining_weight_kg" }
      - { name: line_cost_cents, type: integer, source: computed, description: "round_half_up(allocated_kg * lot.cost_per_kg_cents) at creation (per-line rounding)" }
      - { name: status, type: enum, source: system, description: "ACTIVE | RELEASED (RELEASED when the batch is cancelled pre-release)", default: ACTIVE }

  - name: FlavoringApplication
    parent: null
    common_fields: false
    fields:
      - { name: batch_id, type: string, source: system, description: "FK -> BlendBatch.id; flavored batch" }
      - { name: flavoring_id, type: string, source: input, description: "FK -> Flavoring.id; applied flavoring (must equal recipe.flavoring_id)" }
      - { name: applied_kg, type: number, source: input, description: "Kg applied; must equal batch.flavoring_kg exactly" }
      - { name: applied_by_user_id, type: string, source: system, description: "X-User-ID of the BlendMaster" }
      - { name: flavoring_cost_cents, type: integer, source: computed, description: "round_half_up(applied_kg * flavoring.cost_per_kg_cents)" }

  - name: PackagingLine
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Line name" }
      - { name: line_type, type: enum, source: input, description: "TEA_BAG | LOOSE_PACK" }
      - { name: status, type: enum, source: system, description: "ACTIVE | MAINTENANCE", default: ACTIVE }

  - name: ProductionRun
    parent: null
    common_fields: true
    fields:
      - { name: line_id, type: string, source: input, description: "FK -> PackagingLine.id; line booked" }
      - { name: batch_id, type: string, source: input, description: "FK -> BlendBatch.id; batch to pack (must be RELEASED)" }
      - { name: contract_id, type: string, source: input, description: "FK -> PrivateLabelContract.id; null for house-label runs", default: null }
      - { name: planned_start, type: datetime, source: input, description: "Window start (ISO8601 UTC); half-open interval [planned_start, planned_end)" }
      - { name: planned_end, type: datetime, source: input, description: "Window end (ISO8601 UTC), must be > planned_start" }
      - { name: planned_units, type: integer, source: input, description: "Planned packs, >= 1; >= contract.minimum_units_per_run when contract_id set" }
      - { name: actual_units, type: integer, source: input, description: "Recorded at complete; >= 1; >= contract minimum when contracted" }
      - { name: provisional_shelf_life_days, type: integer, source: computed, description: "Forward-looking estimate at creation (see packed_shelf_life)" }
      - { name: final_shelf_life_days, type: integer, source: computed, description: "Chronological value at completion (see packed_shelf_life)" }
      - { name: started_at, type: datetime, source: system, description: "Logical-clock timestamp at start" }
      - { name: completed_at, type: datetime, source: system, description: "Logical-clock timestamp at completion" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | IN_PROGRESS | COMPLETED | CANCELLED" }

  - name: PrivateLabelContract
    parent: null
    common_fields: true
    fields:
      - { name: customer_name, type: string, source: input, description: "Private-label customer" }
      - { name: recipe_id, type: string, source: input, description: "FK -> BlendRecipe.id; contracted recipe" }
      - { name: minimum_units_per_run, type: integer, source: input, description: "Private-label minimum per production run, >= 1" }
      - { name: contracted_total_units, type: integer, source: input, description: "Total contracted volume, >= minimum_units_per_run" }
      - { name: base_unit_price_cents, type: integer, source: input, description: "Base price per unit before tiers/cert multiplier, >= 1" }
      - { name: contract_unit_price_cents, type: integer, source: computed, description: "Computed at activation per contract_unit_price" }
      - { name: fulfilled_units, type: integer, source: computed, description: "Sum of actual_units of COMPLETED runs referencing this contract", default: 0 }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | FULFILLED | CANCELLED", default: DRAFT }

  - name: CertificateGrant
    parent: null
    common_fields: true
    fields:
      - { name: supplier_id, type: string, source: input, description: "FK -> Supplier.id; certified supplier" }
      - { name: cert_type, type: enum, source: input, description: "ORGANIC | FAIR_TRADE" }
      - { name: total_volume_kg, type: number, source: input, description: "Certified mass-balance volume, > 0" }
      - { name: consumed_volume_kg, type: number, source: computed, description: "Sum of charged kg over batches currently RELEASED under this grant", default: 0 }
      - { name: valid_from, type: datetime, source: input, description: "Validity start (YYYY-MM-DD, closed interval)" }
      - { name: valid_until, type: datetime, source: input, description: "Validity end (YYYY-MM-DD, closed interval), must be > valid_from" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED | EXPIRED", default: ACTIVE }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Supplier
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /tea-ops/suppliers/{id}/suspend"
        actor: ProcurementLead
        preconditions: ["supplier.status == ACTIVE"]
        side_effects:
          - "CASCADE link 1: every LeafLot of this supplier with status in {GRADED, LAB_SUBMITTED, RELEASED} transitions to ON_HOLD (REGISTERED, REJECTED, DEPLETED lots untouched)"
          - "CASCADE link 2 (caused by each lot's transition to ON_HOLD): every BlendBatch holding an ACTIVE BatchLotAllocation from a lot that just became ON_HOLD, with batch.status in {RECIPE_LOCKED, ALLOCATED, BLENDED, FLAVORED, QC_REVIEW, RELEASED}, transitions to ON_HOLD"
          - "CASCADE link 3 (caused by each batch's transition to ON_HOLD): every ProductionRun with run.status == SCHEDULED referencing a batch that just became ON_HOLD transitions to CANCELLED"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /tea-ops/suppliers/{id}/reinstate"
        actor: ProcurementLead
        preconditions: ["supplier.status == SUSPENDED"]
        side_effects: ["No automatic lot un-hold; held lots exit ON_HOLD only via a new residue test"]

  - entity: LeafLot
    initial_state: REGISTERED
    terminal_states: [REJECTED, DEPLETED]
    transitions:
      - from: REGISTERED
        to: GRADED
        trigger: "POST /tea-ops/leaf-lots/{id}/grade-assessments (composite_grade != REJECT)"
        actor: SensoryGrader
        preconditions: ["lot.status == REGISTERED", "X-User-ID != lot.registered_by_user_id (segregation of duties)"]
        side_effects: ["GradeAssessment persisted", "lot.composite_grade set to computed grade"]
      - from: REGISTERED
        to: REJECTED
        trigger: "POST /tea-ops/leaf-lots/{id}/grade-assessments (composite_grade == REJECT)"
        actor: SensoryGrader
        preconditions: ["lot.status == REGISTERED", "X-User-ID != lot.registered_by_user_id"]
        side_effects: ["GradeAssessment persisted with composite_grade REJECT"]
      - from: GRADED
        to: LAB_SUBMITTED
        trigger: "POST /tea-ops/leaf-lots/{id}/residue-tests (verdict == PASS)"
        actor: QALabAnalyst
        preconditions: ["lot.status == GRADED"]
        side_effects: ["ResidueTest persisted", "lot.latest_residue_verdict = PASS"]
      - from: GRADED
        to: ON_HOLD
        trigger: "POST /tea-ops/leaf-lots/{id}/residue-tests (verdict == FAIL_SOFT)"
        actor: QALabAnalyst
        preconditions: ["lot.status == GRADED"]
        side_effects: ["ResidueTest persisted", "lot.latest_residue_verdict = FAIL_SOFT", "lot-hold cascade links 2 and 3 fire as in Supplier.suspend"]
      - from: GRADED
        to: REJECTED
        trigger: "POST /tea-ops/leaf-lots/{id}/residue-tests (verdict == FAIL_HARD)"
        actor: QALabAnalyst
        preconditions: ["lot.status == GRADED"]
        side_effects: ["ResidueTest persisted", "lot.latest_residue_verdict = FAIL_HARD"]
      - from: ON_HOLD
        to: LAB_SUBMITTED
        trigger: "POST /tea-ops/leaf-lots/{id}/residue-tests (retest, verdict == PASS)"
        actor: QALabAnalyst
        preconditions: ["lot.status == ON_HOLD"]
        side_effects: ["ResidueTest persisted with incremented test_round", "lot.latest_residue_verdict = PASS"]
      - from: ON_HOLD
        to: ON_HOLD
        trigger: "POST /tea-ops/leaf-lots/{id}/residue-tests (retest, verdict == FAIL_SOFT)"
        actor: QALabAnalyst
        preconditions: ["lot.status == ON_HOLD"]
        side_effects: ["ResidueTest persisted", "lot remains ON_HOLD"]
      - from: ON_HOLD
        to: REJECTED
        trigger: "POST /tea-ops/leaf-lots/{id}/residue-tests (retest, verdict == FAIL_HARD)"
        actor: QALabAnalyst
        preconditions: ["lot.status == ON_HOLD"]
        side_effects: ["ResidueTest persisted", "lot.latest_residue_verdict = FAIL_HARD"]
      - from: LAB_SUBMITTED
        to: RELEASED
        trigger: "POST /tea-ops/leaf-lots/{id}/release"
        actor: QAManager
        preconditions:
          - "lot.status == LAB_SUBMITTED and lot.latest_residue_verdict == PASS"
          - "lot's Supplier.status == ACTIVE"
          - "lot.moisture_pct <= 7.0"
          - "X-User-ID != submitted_by_user_id of the latest ResidueTest (segregation of duties)"
        side_effects: ["lot released for allocation"]
      - from: RELEASED
        to: ON_HOLD
        trigger: "POST /tea-ops/leaf-lots/{id}/recall"
        actor: QAManager
        preconditions: ["lot.status == RELEASED"]
        side_effects:
          - "CASCADE link 2: every BlendBatch with an ACTIVE allocation from this lot and status in {RECIPE_LOCKED, ALLOCATED, BLENDED, FLAVORED, QC_REVIEW, RELEASED} transitions to ON_HOLD"
          - "CASCADE link 3: every ProductionRun with status == SCHEDULED referencing a batch that just became ON_HOLD transitions to CANCELLED"
      - from: RELEASED
        to: DEPLETED
        trigger: "system auto-transition when lot.remaining_weight_kg reaches exactly 0 after an allocation"
        actor: system
        preconditions: ["remaining_weight_kg == 0"]
        side_effects: []
      - from: DEPLETED
        to: RELEASED
        trigger: "system auto-transition when a cancellation releases allocations and remaining_weight_kg becomes > 0"
        actor: system
        preconditions: ["remaining_weight_kg > 0 after compensation"]
        side_effects: []

  - entity: Flavoring
    initial_state: ACTIVE
    terminal_states: [RETIRED]
    transitions:
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /tea-ops/flavorings/{id}/retire"
        actor: BlendMaster
        preconditions: ["flavoring.status == ACTIVE"]
        side_effects: ["Existing FlavoringApplication rows unaffected; future applications rejected with ERR_FLAVORING_NOT_ACTIVE"]

  - entity: BlendRecipe
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /tea-ops/recipes/{id}/activate"
        actor: BlendMaster
        preconditions: ["recipe.status == DRAFT", "component pct sum + flavoring_pct == 100.00", "flavoring_id null or references an ACTIVE Flavoring"]
        side_effects: []
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /tea-ops/recipes/{id}/retire"
        actor: BlendMaster
        preconditions: ["recipe.status == ACTIVE"]
        side_effects:
          - "CASCADE link 1: every BlendBatch with recipe_id == this recipe and status in {DRAFT, RECIPE_LOCKED} transitions to CANCELLED"
          - "CASCADE link 2 (caused by each such batch cancellation): that batch's ACTIVE allocations transition to RELEASED and each lot's remaining_weight_kg is restored (DEPLETED lots with remaining > 0 return to RELEASED)"

  - entity: BlendBatch
    initial_state: DRAFT
    terminal_states: [RECALLED, CANCELLED]
    transitions:
      - from: DRAFT
        to: RECIPE_LOCKED
        trigger: "POST /tea-ops/batches/{id}/lock-recipe"
        actor: BlendMaster
        preconditions: ["batch.status == DRAFT", "referenced BlendRecipe.status == ACTIVE"]
        side_effects: ["batch.recipe_version pinned to recipe.version", "required_components and flavoring_kg computed per recipe_component_scaling"]
      - from: RECIPE_LOCKED
        to: ALLOCATED
        trigger: "POST /tea-ops/batches/{id}/finalize-allocation"
        actor: BlendMaster
        preconditions:
          - "batch.status == RECIPE_LOCKED"
          - "for every required component: sum of ACTIVE allocations over lots whose leaf_type == component.leaf_type and composite_grade meets component.min_grade == component.required_kg exactly (3-decimal comparison)"
          - "for every component with required_kg > 25.0: no single lot supplies more than 70% of that component (share > 0.70 violates; exactly 0.70 is allowed)"
          - "every allocated lot currently has status in {RELEASED, DEPLETED}"
        side_effects: ["provisional_cost_cents computed per batch_cost_accounting (provisional variant)"]
      - from: ALLOCATED
        to: BLENDED
        trigger: "POST /tea-ops/batches/{id}/blend"
        actor: BlendMaster
        preconditions: ["batch.status == ALLOCATED"]
        side_effects: ["measured_moisture_pct recorded", "yield_kg computed per moisture_adjusted_yield", "blended_by_user_id stamped from X-User-ID"]
      - from: BLENDED
        to: FLAVORED
        trigger: "POST /tea-ops/batches/{id}/apply-flavoring"
        actor: BlendMaster
        preconditions:
          - "batch.status == BLENDED and recipe.flavoring_id is not null"
          - "if recipe.certification_target == ORGANIC then flavoring.natural_certified must be true"
          - "flavoring_id == recipe.flavoring_id"
          - "flavoring.status == ACTIVE"
          - "applied_kg == batch.flavoring_kg exactly (3-decimal comparison)"
        side_effects: ["FlavoringApplication persisted", "flavoring_cost_cents computed", "batch.allergen_tags = flavoring.allergen_tags"]
      - from: BLENDED
        to: QC_REVIEW
        trigger: "POST /tea-ops/batches/{id}/submit-qc (unflavored branch)"
        actor: BlendMaster
        preconditions: ["batch.status == BLENDED", "recipe.flavoring_id is null"]
        side_effects: []
      - from: FLAVORED
        to: QC_REVIEW
        trigger: "POST /tea-ops/batches/{id}/submit-qc (flavored branch)"
        actor: BlendMaster
        preconditions: ["batch.status == FLAVORED", "exactly one FlavoringApplication exists for the batch"]
        side_effects: []
      - from: ON_HOLD
        to: QC_REVIEW
        trigger: "POST /tea-ops/batches/{id}/submit-qc (rework loop)"
        actor: BlendMaster
        preconditions:
          - "batch.status == ON_HOLD"
          - "every lot referenced by the batch's ACTIVE allocations currently has status in {RELEASED, DEPLETED}"
          - "if the recipe is flavored, exactly one FlavoringApplication exists for the batch"
        side_effects: []
      - from: QC_REVIEW
        to: RELEASED
        trigger: "POST /tea-ops/batches/{id}/release"
        actor: QAManager
        preconditions:
          - "batch.status == QC_REVIEW"
          - "batch.measured_moisture_pct <= 7.0"
          - "if recipe.certification_target != CONVENTIONAL: for every supplier contributing ACTIVE allocations, the supplier holds a CertificateGrant with cert_type == recipe.certification_target, status == ACTIVE, valid_from <= current logical clock date <= valid_until, and remaining volume (total_volume_kg - consumed_volume_kg) >= the kg contributed by that supplier"
          - "X-User-ID != batch.blended_by_user_id (segregation of duties)"
        side_effects:
          - "first release only: cert_charges computed per certificate_volume_ledger and each charged CertificateGrant.consumed_volume_kg increased"
          - "final_cost_cents computed per batch_cost_accounting (final variant)"
          - "actual_weight_kg = yield_kg + flavoring_kg"
      - from: RELEASED
        to: RECALLED
        trigger: "POST /tea-ops/batches/{id}/recall"
        actor: QAManager
        preconditions: ["batch.status == RELEASED"]
        side_effects:
          - "COMPENSATION: each cert charge in batch.cert_charges is restored (CertificateGrant.consumed_volume_kg decreased by charged_kg); cert_charges cleared"
          - "CASCADE: every ProductionRun with status == SCHEDULED referencing this batch transitions to CANCELLED (IN_PROGRESS runs are untouched)"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /tea-ops/batches/{id}/cancel"
        actor: BlendMaster
        preconditions: ["batch.status == DRAFT"]
        side_effects: []
      - from: RECIPE_LOCKED
        to: CANCELLED
        trigger: "POST /tea-ops/batches/{id}/cancel"
        actor: BlendMaster
        preconditions: ["batch.status == RECIPE_LOCKED"]
        side_effects: ["COMPENSATION: ACTIVE allocations -> RELEASED; each lot.remaining_weight_kg increased by allocated_kg; lot DEPLETED -> RELEASED when restored above 0"]
      - from: ALLOCATED
        to: CANCELLED
        trigger: "POST /tea-ops/batches/{id}/cancel"
        actor: BlendMaster
        preconditions: ["batch.status == ALLOCATED"]
        side_effects: ["same allocation-release compensation as RECIPE_LOCKED -> CANCELLED"]
      - from: BLENDED
        to: CANCELLED
        trigger: "POST /tea-ops/batches/{id}/cancel"
        actor: BlendMaster
        preconditions: ["batch.status == BLENDED"]
        side_effects: ["same allocation-release compensation"]
      - from: FLAVORED
        to: CANCELLED
        trigger: "POST /tea-ops/batches/{id}/cancel"
        actor: BlendMaster
        preconditions: ["batch.status == FLAVORED"]
        side_effects: ["same allocation-release compensation"]
      - from: QC_REVIEW
        to: CANCELLED
        trigger: "POST /tea-ops/batches/{id}/cancel"
        actor: BlendMaster
        preconditions: ["batch.status == QC_REVIEW"]
        side_effects: ["same allocation-release compensation"]
      - from: ON_HOLD
        to: CANCELLED
        trigger: "POST /tea-ops/batches/{id}/cancel"
        actor: BlendMaster
        preconditions: ["batch.status == ON_HOLD"]
        side_effects: ["same allocation-release compensation"]

  - entity: PackagingLine
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: MAINTENANCE
        trigger: "POST /tea-ops/packaging-lines/{id}/enter-maintenance"
        actor: ProductionPlanner
        preconditions: ["line.status == ACTIVE"]
        side_effects: ["Existing SCHEDULED runs remain but cannot start while the line is in MAINTENANCE"]
      - from: MAINTENANCE
        to: ACTIVE
        trigger: "POST /tea-ops/packaging-lines/{id}/exit-maintenance"
        actor: ProductionPlanner
        preconditions: ["line.status == MAINTENANCE"]
        side_effects: []

  - entity: ProductionRun
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /tea-ops/runs/{id}/start"
        actor: ProductionPlanner
        preconditions:
          - "run.status == SCHEDULED"
          - "line.status == ACTIVE"
          - "logical clock now satisfies planned_start <= now < planned_end"
        side_effects: ["started_at = current logical clock"]
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /tea-ops/runs/{id}/complete"
        actor: ProductionPlanner
        preconditions:
          - "run.status == IN_PROGRESS"
          - "referenced BlendBatch.status == RELEASED"
          - "actual_units >= 1"
          - "if contract_id set: actual_units >= contract.minimum_units_per_run"
        side_effects:
          - "completed_at = current logical clock"
          - "final_shelf_life_days computed per packed_shelf_life (final variant)"
          - "if contract_id set: contract.fulfilled_units += actual_units"
          - "BUBBLE-UP: if contract.fulfilled_units >= contract.contracted_total_units, contract transitions ACTIVE -> FULFILLED"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /tea-ops/runs/{id}/cancel or cascade from batch hold/recall"
        actor: ProductionPlanner | system
        preconditions: ["run.status == SCHEDULED"]
        side_effects: ["line window freed"]

  - entity: PrivateLabelContract
    initial_state: DRAFT
    terminal_states: [FULFILLED, CANCELLED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /tea-ops/contracts/{id}/activate"
        actor: AccountManager
        preconditions: ["contract.status == DRAFT", "referenced BlendRecipe.status == ACTIVE"]
        side_effects: ["contract_unit_price_cents computed per contract_unit_price"]
      - from: ACTIVE
        to: FULFILLED
        trigger: "system auto-transition on ProductionRun completion crossing contracted_total_units"
        actor: system
        preconditions: ["fulfilled_units >= contracted_total_units"]
        side_effects: []
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /tea-ops/contracts/{id}/cancel"
        actor: AccountManager
        preconditions: ["contract.status == DRAFT"]
        side_effects: []
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /tea-ops/contracts/{id}/cancel"
        actor: AccountManager
        preconditions: ["contract.status == ACTIVE"]
        side_effects: []

  - entity: CertificateGrant
    initial_state: ACTIVE
    terminal_states: [EXPIRED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /tea-ops/certificates/{id}/suspend"
        actor: CertificationOfficer
        preconditions: ["cert.status == ACTIVE"]
        side_effects:
          - "CASCADE link 1: every BlendBatch whose recipe.certification_target == cert.cert_type holding an ACTIVE allocation from a lot whose supplier_id == cert.supplier_id, with batch.status in {RECIPE_LOCKED, ALLOCATED, BLENDED, FLAVORED, QC_REVIEW, RELEASED}, transitions to ON_HOLD"
          - "CASCADE link 2 (caused by each batch's transition to ON_HOLD): every ProductionRun with status == SCHEDULED referencing such a batch transitions to CANCELLED"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /tea-ops/certificates/{id}/reinstate"
        actor: CertificationOfficer
        preconditions: ["cert.status == SUSPENDED", "cert.valid_until >= current logical clock date"]
        side_effects: ["No automatic batch un-hold; held batches re-enter QC via submit-qc"]
      - from: ACTIVE
        to: EXPIRED
        trigger: "system sweep when the logical clock advances past valid_until"
        actor: system
        preconditions: ["cert.valid_until < current logical clock date"]
        side_effects: []
      - from: SUSPENDED
        to: EXPIRED
        trigger: "system sweep when the logical clock advances past valid_until"
        actor: system
        preconditions: ["cert.valid_until < current logical clock date"]
        side_effects: []

# =============================================================================
# 1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: allocation-create-stale-batch
    parent_entity: BlendBatch
    write_endpoint: "POST /tea-ops/batches/{id}/allocations"
    occ_field: expected_batch_version
    description: |
      Creating a BatchLotAllocation against a BlendBatch whose version has
      advanced beyond the client's last observed version is rejected. This
      captures the case where another writer has just added an allocation
      (legitimately mutating fill state) and the current writer's view of the
      batch is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: recipe-update-stale-recipe
    parent_entity: BlendRecipe
    write_endpoint: "PUT /tea-ops/recipes/{id}"
    occ_field: expected_recipe_version
    description: |
      Updating a DRAFT BlendRecipe whose version has advanced beyond the
      client's last observed version is rejected, so two edits based on the
      same observed version cannot both succeed.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: sensory_composite_grade
    trigger: "on POST /tea-ops/leaf-lots/{id}/grade-assessments"
    algorithm: weighted_scoring
    formula: |
      composite_score = round_half_up(aroma_score * 0.40 + briskness_score * 0.35 + appearance_score * 0.25, 1)
      composite_grade = A if composite_score >= 85.0
                        B if composite_score >= 70.0
                        C if composite_score >= 55.0
                        REJECT otherwise
    input_set: "the three input scores of this assessment only"
    constants:
      W_AROMA: 0.40
      W_BRISKNESS: 0.35
      W_APPEARANCE: 0.25
      GRADE_A_MIN: 85.0
      GRADE_B_MIN: 70.0
      GRADE_C_MIN: 55.0
    precision: "1 decimal place, round_half_up; threshold comparisons are inclusive (>="

  - name: residue_verdict_threshold
    trigger: "on POST /tea-ops/leaf-lots/{id}/residue-tests"
    algorithm: threshold
    formula: |
      verdict = PASS      if measured_residue_ppm <= RESIDUE_LIMIT_PPM
                FAIL_HARD if measured_residue_ppm > RESIDUE_LIMIT_PPM * HARD_FAIL_MULTIPLIER
                FAIL_SOFT otherwise
    input_set: "the single measured_residue_ppm of this test"
    constants:
      RESIDUE_LIMIT_PPM: 0.50
      HARD_FAIL_MULTIPLIER: 2.0
    precision: "exact decimal comparison; 0.50 passes (inclusive), 1.00 is FAIL_SOFT (hard-fail bound is exclusive), 1.01 is FAIL_HARD"

  - name: recipe_component_scaling
    trigger: "on POST /tea-ops/batches/{id}/lock-recipe"
    algorithm: constraint_propagation
    formula: |
      # Pinned evaluation order (flavoring is reserved BEFORE leaf normalization):
      flavoring_kg = round_half_up(target_weight_kg * flavoring_pct / 100, 3)
      leaf_pool_kg = target_weight_kg - flavoring_kg
      leaf_pct_sum = sum of components[].pct
      for each component: required_kg = round_half_up(leaf_pool_kg * component.pct / leaf_pct_sum, 3)
    input_set: "the batch's target_weight_kg and the recipe's components + flavoring_pct at lock time"
    constants: {}
    precision: "3 decimal places, round_half_up; flavoring reservation MUST be evaluated before component normalization"
    note: "Computing leaf shares on the full target_weight_kg instead of leaf_pool_kg over-allocates by flavoring_kg; the pinned order is the contract."

  - name: moisture_adjusted_yield
    trigger: "on POST /tea-ops/batches/{id}/blend"
    algorithm: aggregation
    formula: |
      # Per-line rounding THEN sum (pinned order; sum-then-round is a different result):
      for each ACTIVE allocation line:
        if line.lot.moisture_pct > TARGET_MOISTURE_PCT:
          line_yield_kg = round_half_up(line.allocated_kg * (1 - (line.lot.moisture_pct - TARGET_MOISTURE_PCT) / (100 - TARGET_MOISTURE_PCT)), 3)
        else:
          line_yield_kg = line.allocated_kg
      yield_kg = sum of line_yield_kg over all lines
    input_set: "the batch's ACTIVE BatchLotAllocation rows joined to their LeafLot.moisture_pct"
    constants:
      TARGET_MOISTURE_PCT: 5.0
    precision: "3 decimal places, round_half_up per line; sum of rounded lines (never round(sum))"

  - name: batch_cost_accounting
    trigger: "provisional variant on POST /tea-ops/batches/{id}/finalize-allocation; final variant on POST /tea-ops/batches/{id}/release"
    algorithm: aggregation
    formula: |
      provisional_cost_cents = sum over ACTIVE allocation lines of round_half_up(line.allocated_kg * line.lot.cost_per_kg_cents, 0)
      flavoring_cost_cents_total = sum over FlavoringApplication rows of flavoring_cost_cents (0 when unflavored)
      waste_cents = round_half_up((provisional_cost_cents + flavoring_cost_cents_total) * WASTE_FACTOR, 0)
      final_cost_cents = provisional_cost_cents + flavoring_cost_cents_total + waste_cents
    input_set: "provisional: ACTIVE allocations at finalize; final: same allocations + FlavoringApplication rows at release"
    constants:
      WASTE_FACTOR: 0.02
    precision: "0 decimal places (integer cents), round_half_up; per-line rounding before summation"
    variants:
      - name: provisional
        when: "at finalize-allocation"
        difference: "leaf cost only; no flavoring, no waste surcharge"
      - name: final
        when: "at release"
        difference: "provisional + flavoring cost + 2% waste surcharge on (leaf + flavoring); identical inputs therefore yield a strictly larger value whenever flavoring or waste is nonzero"

  - name: packed_shelf_life
    trigger: "provisional variant on POST /tea-ops/runs; final variant on POST /tea-ops/runs/{id}/complete"
    algorithm: forward_looking
    formula: |
      # Provisional (at run creation, forward-looking estimate):
      excess = max(0, batch.measured_moisture_pct - TARGET_MOISTURE_PCT)
      penalty_days = ceil(excess * 10) * 3
      provisional_shelf_life_days = BASE_SHELF_DAYS[batch.pack_format] - penalty_days
      # Final (at completion, chronological): harvest-age floor joins the estimate:
      harvest_term = min over ACTIVE allocations of (HARVEST_CEILING_DAYS - days_between(lot.harvest_date, date_of(run.completed_at)))
      final_shelf_life_days = min(provisional_shelf_life_days, harvest_term)
    input_set: "provisional: batch.measured_moisture_pct + batch.pack_format; final: plus harvest_date of every lot with an ACTIVE allocation and the logical-clock completion date"
    constants:
      TARGET_MOISTURE_PCT: 5.0
      BASE_SHELF_DAYS_TEA_BAG: 540
      BASE_SHELF_DAYS_LOOSE_PACK: 365
      HARVEST_CEILING_DAYS: 730
    precision: "integer days; days_between uses UTC calendar dates; ceil applied to (excess * 10) before multiplying by 3"
    variants:
      - name: provisional
        when: "at run creation"
        difference: "moisture-decay estimate only; ignores harvest age"
      - name: final
        when: "at run completion"
        difference: "min of the estimate and the oldest-lot harvest ceiling; strictly smaller whenever a constituent lot is old enough"

  - name: contract_unit_price
    trigger: "on POST /tea-ops/contracts/{id}/activate"
    algorithm: tiered_pricing
    formula: |
      discount = 0.15 if contracted_total_units >= 100000
                 0.10 if contracted_total_units >= 50000
                 0.05 if contracted_total_units >= 10000
                 0.00 otherwise
      cert_mult = 1.20 if recipe.certification_target == ORGANIC
                  1.10 if recipe.certification_target == FAIR_TRADE
                  1.00 otherwise
      contract_unit_price_cents = max(MIN_UNIT_PRICE_CENTS, round_half_up(base_unit_price_cents * cert_mult * (1 - discount), 0))
    input_set: "contract.base_unit_price_cents, contract.contracted_total_units, recipe.certification_target"
    constants:
      TIER1_UNITS: 10000
      TIER2_UNITS: 50000
      TIER3_UNITS: 100000
      MIN_UNIT_PRICE_CENTS: 1
    precision: "integer cents, round_half_up; tier boundaries inclusive (10000 exactly earns 0.05); average-rate discount applied to the whole price, not marginal"

  - name: certificate_volume_ledger
    trigger: "on first transition of a BlendBatch into RELEASED (charge) and on batch recall (restore)"
    algorithm: aggregation
    formula: |
      # Charge (release): group the batch's ACTIVE allocations by lot.supplier_id:
      for each supplier: charged_kg = sum of allocated_kg of that supplier's lots
      cert.consumed_volume_kg += charged_kg   (on the single ACTIVE cert of matching cert_type for that supplier)
      # Restore (recall): for each {certificate_id, charged_kg} in batch.cert_charges:
      cert.consumed_volume_kg -= charged_kg
      # Invariant: cert.consumed_volume_kg == sum of charged kg over batches currently in RELEASED that reference this cert
    input_set: "batch.cert_charges; allocations filtered to status == ACTIVE at release time"
    constants: {}
    precision: "3 decimal places; charge and restore MUST be exact inverses (no drift)"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present; role is one of the nine declared roles", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "acting role is listed in the endpoint's roles", error_id: ERR_FORBIDDEN, http_status: 403, applies_to: "all" }
  - { priority: 3, category: existence, check: "path ids exist (left-to-right), then body FK ids (supplier_id, recipe_id, lot_id, line_id, batch_id, contract_id, flavoring_id)", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all" }
  - { priority: 4, category: state, check: "OCC: expected_<parent>_version matches current parent version (allocation create, recipe PUT)", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "POST /tea-ops/batches/{id}/allocations, PUT /tea-ops/recipes/{id}" }
  - { priority: 5, category: state, check: "target entity not in a terminal state for this action", error_id: ERR_ALREADY_TERMINAL, http_status: 409, applies_to: "all action endpoints" }
  - { priority: 6, category: state, check: "endpoint-specific state precondition (lot GRADED/ON_HOLD for tests; LAB_SUBMITTED+PASS for release; batch DRAFT/RECIPE_LOCKED/ALLOCATED/BLENDED/etc.; recipe DRAFT for PUT/activate; line ACTIVE; contract ACTIVE; run window membership at start)", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all action endpoints (endpoint-specific codes: ERR_LOT_NOT_RELEASABLE, ERR_LOT_NOT_RELEASED, ERR_BATCH_NOT_RELEASABLE, ERR_BATCH_NOT_FLAVORABLE, ERR_RECIPE_NOT_ACTIVE, ERR_LINE_NOT_ACTIVE, ERR_CONTRACT_NOT_ACTIVE, ERR_FLAVORING_REQUIRED, ERR_RUN_OUTSIDE_WINDOW, ERR_SUPPLIER_SUSPENDED)" }
  - { priority: 7, category: state, check: "segregation of duties: grader != lot registrar; lot releaser != latest residue-test submitter; batch releaser != blended_by_user_id", error_id: ERR_SEGREGATION_OF_DUTIES, http_status: 403, applies_to: "POST grade-assessments, POST leaf-lots/{id}/release, POST batches/{id}/release" }
  - { priority: 8, category: business_safety, check: "moisture gates (lot release: lot.moisture_pct <= 7.0; batch release: measured_moisture_pct <= 7.0); organic flavoring rule; certification chain presence and volume at batch release", error_id: ERR_MOISTURE_OUT_OF_RANGE, http_status: 422, applies_to: "release endpoints (also ERR_SYNTHETIC_ON_ORGANIC, ERR_CERT_NOT_ACTIVE, ERR_CERT_VOLUME_EXHAUSTED)" }
  - { priority: 9, category: business_temporal, check: "window validity (start < end); line half-open overlap; allergen changeover buffer 45 min; certificate closed-interval overlap per (supplier_id, cert_type)", error_id: ERR_INVALID_WINDOW, http_status: 422, applies_to: "run create, run start, certificate create (also ERR_LINE_WINDOW_CONFLICT, ERR_ALLERGEN_CHANGEOVER_BUFFER, ERR_CERT_WINDOW_CONFLICT, ERR_RUN_OUTSIDE_WINDOW)" }
  - { priority: 10, category: business_constraint, check: "recipe composition sum; allocation leaf_type match, grade minimum, remaining weight, duplicate lot, exact fill, single-lot dominance <= 70% for components > 25 kg; flavoring id match and exact dose; contract-recipe match; line format match", error_id: ERR_RECIPE_COMPOSITION_INVALID, http_status: 422, applies_to: "recipe create/activate, allocations, finalize-allocation, apply-flavoring, run create (also ERR_ALLOCATION_TYPE_MISMATCH, ERR_ALLOCATION_GRADE_TOO_LOW, ERR_LOT_WEIGHT_EXCEEDED, ERR_DUPLICATE_LOT_ALLOCATION, ERR_FILL_INCOMPLETE, ERR_SINGLE_LOT_DOMINANCE, ERR_FLAVORING_MISMATCH, ERR_FLAVORING_DOSE_MISMATCH, ERR_CONTRACT_RECIPE_MISMATCH, ERR_LINE_FORMAT_MISMATCH)" }
  - { priority: 11, category: business_referential, check: "referenced Flavoring must be ACTIVE at recipe activate and at apply-flavoring", error_id: ERR_FLAVORING_NOT_ACTIVE, http_status: 422, applies_to: "POST /tea-ops/recipes/{id}/activate, POST /tea-ops/batches/{id}/apply-flavoring" }
  - { priority: 12, category: business_fiscal, check: "private-label minimum: planned_units (create) and actual_units (complete) >= contract.minimum_units_per_run when contract_id set", error_id: ERR_PRIVATE_LABEL_MINIMUM_UNMET, http_status: 422, applies_to: "POST /tea-ops/runs, POST /tea-ops/runs/{id}/complete" }
  - { priority: 13, category: business_constraint, check: "field shape: required fields present, enums in range, scores 0..100, weights/quantities > 0, ppm >= 0", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all (malformed payloads are rejected before business processing; note: header/role/existence/state still precede this per priorities 1-7)" }

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Supplier ---
  - { method: POST, path: "/tea-ops/suppliers", description: "Register a supplier", roles: &all_roles_proc [ProcurementLead], code: 201, input: [name, origin_region], output: Supplier, side_effects: ["status = ACTIVE"] }
  - method: GET
    path: "/tea-ops/suppliers/{id}"
    description: "Get a supplier"
    roles: &all_roles [ProcurementLead, SensoryGrader, QALabAnalyst, QAManager, BlendMaster, ProductionPlanner, AccountManager, CertificationOfficer, PlatformAdmin]
    code: 200
    input: []
    output: Supplier
    side_effects: []
  - { method: POST, path: "/tea-ops/suppliers/{id}/suspend", description: "Suspend a supplier; cascades lot holds -> batch holds -> run cancellations", roles: [ProcurementLead], code: 200, input: [], output: Supplier, side_effects: ["3-link cascade per Supplier state machine"] }
  - { method: POST, path: "/tea-ops/suppliers/{id}/reinstate", description: "Reinstate a suspended supplier (no automatic lot un-hold)", roles: [ProcurementLead], code: 200, input: [], output: Supplier, side_effects: ["status -> ACTIVE"] }

  # --- LeafLot ---
  - { method: POST, path: "/tea-ops/leaf-lots", description: "Register a leaf lot", roles: [ProcurementLead], code: 201, input: [supplier_id, leaf_type, harvest_date, weight_kg, cost_per_kg_cents, moisture_pct], output: LeafLot, side_effects: ["status = REGISTERED, remaining_weight_kg = weight_kg, registered_by_user_id = X-User-ID"] }
  - { method: GET, path: "/tea-ops/leaf-lots/{id}", description: "Get a leaf lot", roles: *all_roles, code: 200, input: [], output: LeafLot, side_effects: [] }
  - { method: GET, path: "/tea-ops/leaf-lots", description: "List leaf lots (FK reverse for supplier_id; filters)", roles: *all_roles, code: 200, input: ["supplier_id?", "leaf_type?", "status?", "limit?", "offset?"], output: "LeafLot[]", side_effects: [] }
  - { method: POST, path: "/tea-ops/leaf-lots/{id}/grade-assessments", description: "Submit sensory grading; computes composite grade; transitions lot", roles: [SensoryGrader], code: 201, input: [aroma_score, briskness_score, appearance_score], output: GradeAssessment, side_effects: ["lot REGISTERED -> GRADED or REJECTED per sensory_composite_grade"] }
  - { method: GET, path: "/tea-ops/leaf-lots/{id}/grade-assessments", description: "List grade assessments of a lot (FK reverse)", roles: *all_roles, code: 200, input: ["limit?", "offset?"], output: "GradeAssessment[]", side_effects: [] }
  - { method: POST, path: "/tea-ops/leaf-lots/{id}/residue-tests", description: "Submit pesticide residue test (initial or retest from ON_HOLD); computes verdict; auto-transitions lot", roles: [QALabAnalyst], code: 201, input: [lab_name, measured_residue_ppm, test_method], output: ResidueTest, side_effects: ["lot GRADED|ON_HOLD -> LAB_SUBMITTED (PASS) | ON_HOLD (FAIL_SOFT) | REJECTED (FAIL_HARD)"] }
  - { method: GET, path: "/tea-ops/leaf-lots/{id}/residue-tests", description: "List residue tests of a lot (FK reverse)", roles: *all_roles, code: 200, input: ["limit?", "offset?"], output: "ResidueTest[]", side_effects: [] }
  - { method: POST, path: "/tea-ops/leaf-lots/{id}/release", description: "QA release of a tested lot (SoD vs test submitter; supplier must be ACTIVE; moisture gate)", roles: [QAManager], code: 200, input: [], output: LeafLot, side_effects: ["lot LAB_SUBMITTED -> RELEASED"] }
  - { method: POST, path: "/tea-ops/leaf-lots/{id}/recall", description: "Recall a released lot; cascades batch holds -> run cancellations", roles: [QAManager], code: 200, input: [], output: LeafLot, side_effects: ["lot RELEASED -> ON_HOLD + cascade links 2-3"] }
  - { method: GET, path: "/tea-ops/leaf-lots/{id}/allocations", description: "List allocations drawing from this lot (FK reverse)", roles: *all_roles, code: 200, input: ["limit?", "offset?"], output: "BatchLotAllocation[]", side_effects: [] }

  # --- Flavoring ---
  - { method: POST, path: "/tea-ops/flavorings", description: "Register a flavoring agent", roles: [BlendMaster], code: 201, input: [name, allergen_tags, natural_certified, cost_per_kg_cents], output: Flavoring, side_effects: ["status = ACTIVE"] }
  - { method: GET, path: "/tea-ops/flavorings/{id}", description: "Get a flavoring", roles: *all_roles, code: 200, input: [], output: Flavoring, side_effects: [] }
  - { method: POST, path: "/tea-ops/flavorings/{id}/retire", description: "Retire a flavoring (future applications rejected)", roles: [BlendMaster], code: 200, input: [], output: Flavoring, side_effects: ["status -> RETIRED"] }
  - { method: GET, path: "/tea-ops/flavorings/{id}/flavoring-applications", description: "List applications of this flavoring (FK reverse)", roles: *all_roles, code: 200, input: ["limit?", "offset?"], output: "FlavoringApplication[]", side_effects: [] }

  # --- BlendRecipe ---
  - { method: POST, path: "/tea-ops/recipes", description: "Create a blend recipe (composition must sum to 100.00)", roles: [BlendMaster], code: 201, input: [name, certification_target, pack_format, components, "flavoring_id?", "flavoring_pct?"], output: BlendRecipe, side_effects: ["status = DRAFT"] }
  - { method: GET, path: "/tea-ops/recipes/{id}", description: "Get a recipe", roles: *all_roles, code: 200, input: [], output: BlendRecipe, side_effects: [] }
  - { method: GET, path: "/tea-ops/recipes", description: "List recipes (FK reverse for flavoring_id; filters)", roles: *all_roles, code: 200, input: ["flavoring_id?", "status?", "limit?", "offset?"], output: "BlendRecipe[]", side_effects: [] }
  - { method: PUT, path: "/tea-ops/recipes/{id}", description: "Update a DRAFT recipe (OCC on recipe version)", roles: [BlendMaster], code: 200, input: [expected_recipe_version, "name?", "certification_target?", "pack_format?", "components?", "flavoring_id?", "flavoring_pct?"], output: BlendRecipe, side_effects: ["increments BlendRecipe.version by 1"] }
  - { method: POST, path: "/tea-ops/recipes/{id}/activate", description: "Activate a recipe (re-validates composition and flavoring status)", roles: [BlendMaster], code: 200, input: [], output: BlendRecipe, side_effects: ["status -> ACTIVE"] }
  - { method: POST, path: "/tea-ops/recipes/{id}/retire", description: "Retire a recipe; cancels DRAFT/RECIPE_LOCKED batches with allocation compensation", roles: [BlendMaster], code: 200, input: [], output: BlendRecipe, side_effects: ["status -> RETIRED + 2-link cascade"] }

  # --- BlendBatch ---
  - { method: POST, path: "/tea-ops/batches", description: "Create a blend batch for an ACTIVE recipe", roles: [BlendMaster], code: 201, input: [recipe_id, target_weight_kg], output: BlendBatch, side_effects: ["status = DRAFT, pack_format snapshot"] }
  - { method: GET, path: "/tea-ops/batches/{id}", description: "Get a batch", roles: *all_roles, code: 200, input: [], output: BlendBatch, side_effects: [] }
  - { method: GET, path: "/tea-ops/batches", description: "List batches (FK reverse for recipe_id; filters)", roles: *all_roles, code: 200, input: ["recipe_id?", "status?", "limit?", "offset?"], output: "BlendBatch[]", side_effects: [] }
  - { method: POST, path: "/tea-ops/batches/{id}/lock-recipe", description: "Pin recipe version; compute required_components and flavoring_kg", roles: [BlendMaster], code: 200, input: [], output: BlendBatch, side_effects: ["status -> RECIPE_LOCKED, recipe_version pinned"] }
  - { method: POST, path: "/tea-ops/batches/{id}/allocations", description: "Allocate kg from a RELEASED lot (OCC on batch version)", roles: [BlendMaster], code: 201, input: [lot_id, allocated_kg, expected_batch_version], output: BatchLotAllocation, side_effects: ["line_cost_cents computed", "lot.remaining_weight_kg -= allocated_kg", "lot RELEASED -> DEPLETED when remaining hits 0", "increments BlendBatch.version by 1"] }
  - { method: GET, path: "/tea-ops/batches/{id}/allocations", description: "List allocations of a batch (FK reverse)", roles: *all_roles, code: 200, input: ["limit?", "offset?"], output: "BatchLotAllocation[]", side_effects: [] }
  - { method: POST, path: "/tea-ops/batches/{id}/finalize-allocation", description: "Verify exact component fill and dominance; compute provisional cost", roles: [BlendMaster], code: 200, input: [], output: BlendBatch, side_effects: ["status -> ALLOCATED, provisional_cost_cents computed"] }
  - { method: POST, path: "/tea-ops/batches/{id}/blend", description: "Record post-blend moisture; compute moisture-adjusted yield", roles: [BlendMaster], code: 200, input: [measured_moisture_pct], output: BlendBatch, side_effects: ["status -> BLENDED, yield_kg computed, blended_by_user_id stamped"] }
  - { method: POST, path: "/tea-ops/batches/{id}/apply-flavoring", description: "Apply the recipe's flavoring (allergen + organic rules, exact dose)", roles: [BlendMaster], code: 201, input: [flavoring_id, applied_kg], output: FlavoringApplication, side_effects: ["status -> FLAVORED, batch.allergen_tags set, flavoring_cost_cents computed"] }
  - { method: GET, path: "/tea-ops/batches/{id}/flavoring-applications", description: "List flavoring applications of a batch (FK reverse)", roles: *all_roles, code: 200, input: ["limit?", "offset?"], output: "FlavoringApplication[]", side_effects: [] }
  - { method: POST, path: "/tea-ops/batches/{id}/submit-qc", description: "Submit batch to QC (unflavored from BLENDED, flavored from FLAVORED, rework from ON_HOLD)", roles: [BlendMaster], code: 200, input: [], output: BlendBatch, side_effects: ["status -> QC_REVIEW"] }
  - { method: POST, path: "/tea-ops/batches/{id}/release", description: "QA release of a batch (moisture gate, certification chain + volume consumption, SoD vs blender)", roles: [QAManager], code: 200, input: [], output: BlendBatch, side_effects: ["status -> RELEASED, cert volume consumed (first release), final_cost_cents + actual_weight_kg computed"] }
  - { method: POST, path: "/tea-ops/batches/{id}/cancel", description: "Cancel a non-terminal batch; releases allocations back to lots", roles: [BlendMaster], code: 200, input: [], output: BlendBatch, side_effects: ["status -> CANCELLED, allocation compensation"] }
  - { method: POST, path: "/tea-ops/batches/{id}/recall", description: "Recall a released batch; restores certificate volume; cancels SCHEDULED runs", roles: [QAManager], code: 200, input: [], output: BlendBatch, side_effects: ["status -> RECALLED, cert_charges restored, SCHEDULED runs -> CANCELLED"] }

  # --- PackagingLine ---
  - { method: POST, path: "/tea-ops/packaging-lines", description: "Register a packaging line", roles: [ProductionPlanner], code: 201, input: [name, line_type], output: PackagingLine, side_effects: ["status = ACTIVE"] }
  - { method: GET, path: "/tea-ops/packaging-lines/{id}", description: "Get a packaging line", roles: *all_roles, code: 200, input: [], output: PackagingLine, side_effects: [] }
  - { method: POST, path: "/tea-ops/packaging-lines/{id}/enter-maintenance", description: "Take a line down (blocks new runs and starts)", roles: [ProductionPlanner], code: 200, input: [], output: PackagingLine, side_effects: ["status -> MAINTENANCE"] }
  - { method: POST, path: "/tea-ops/packaging-lines/{id}/exit-maintenance", description: "Return a line to service", roles: [ProductionPlanner], code: 200, input: [], output: PackagingLine, side_effects: ["status -> ACTIVE"] }

  # --- ProductionRun ---
  - { method: POST, path: "/tea-ops/runs", description: "Schedule a run: line format, batch RELEASED, contract checks, half-open overlap, 45-min allergen changeover buffer", roles: [ProductionPlanner], code: 201, input: [line_id, batch_id, planned_start, planned_end, planned_units, "contract_id?"], output: ProductionRun, side_effects: ["status = SCHEDULED, provisional_shelf_life_days computed"] }
  - { method: GET, path: "/tea-ops/runs/{id}", description: "Get a run", roles: *all_roles, code: 200, input: [], output: ProductionRun, side_effects: [] }
  - { method: GET, path: "/tea-ops/runs", description: "List runs (FK reverse for line_id, batch_id, contract_id; filters)", roles: *all_roles, code: 200, input: ["line_id?", "batch_id?", "contract_id?", "status?", "limit?", "offset?"], output: "ProductionRun[]", side_effects: [] }
  - { method: POST, path: "/tea-ops/runs/{id}/start", description: "Start a scheduled run (clock must be inside the window; line ACTIVE)", roles: [ProductionPlanner], code: 200, input: [], output: ProductionRun, side_effects: ["status -> IN_PROGRESS, started_at stamped"] }
  - { method: POST, path: "/tea-ops/runs/{id}/complete", description: "Complete a run (batch must still be RELEASED; contract minimum enforced on actual_units; shelf-life finalized; contract fulfillment credited)", roles: [ProductionPlanner], code: 200, input: [actual_units], output: ProductionRun, side_effects: ["status -> COMPLETED, final_shelf_life_days computed, contract.fulfilled_units credited, contract auto-FULFILLED at total"] }
  - { method: POST, path: "/tea-ops/runs/{id}/cancel", description: "Cancel a scheduled run", roles: [ProductionPlanner], code: 200, input: [], output: ProductionRun, side_effects: ["status -> CANCELLED"] }

  # --- PrivateLabelContract ---
  - { method: POST, path: "/tea-ops/contracts", description: "Create a private-label contract", roles: [AccountManager], code: 201, input: [customer_name, recipe_id, minimum_units_per_run, contracted_total_units, base_unit_price_cents], output: PrivateLabelContract, side_effects: ["status = DRAFT, fulfilled_units = 0"] }
  - { method: GET, path: "/tea-ops/contracts/{id}", description: "Get a contract", roles: *all_roles, code: 200, input: [], output: PrivateLabelContract, side_effects: [] }
  - { method: GET, path: "/tea-ops/contracts", description: "List contracts (FK reverse for recipe_id; filters)", roles: *all_roles, code: 200, input: ["recipe_id?", "status?", "limit?", "offset?"], output: "PrivateLabelContract[]", side_effects: [] }
  - { method: POST, path: "/tea-ops/contracts/{id}/activate", description: "Activate a contract (recipe must be ACTIVE); computes tiered unit price", roles: [AccountManager], code: 200, input: [], output: PrivateLabelContract, side_effects: ["status -> ACTIVE, contract_unit_price_cents computed"] }
  - { method: POST, path: "/tea-ops/contracts/{id}/cancel", description: "Cancel a DRAFT or ACTIVE contract", roles: [AccountManager], code: 200, input: [], output: PrivateLabelContract, side_effects: ["status -> CANCELLED"] }

  # --- CertificateGrant ---
  - { method: POST, path: "/tea-ops/certificates", description: "Grant a certificate (closed-interval overlap per supplier+cert_type rejected)", roles: [CertificationOfficer], code: 201, input: [supplier_id, cert_type, total_volume_kg, valid_from, valid_until], output: CertificateGrant, side_effects: ["status = ACTIVE, consumed_volume_kg = 0"] }
  - { method: GET, path: "/tea-ops/certificates/{id}", description: "Get a certificate", roles: *all_roles, code: 200, input: [], output: CertificateGrant, side_effects: [] }
  - { method: GET, path: "/tea-ops/certificates", description: "List certificates (FK reverse for supplier_id; filters)", roles: *all_roles, code: 200, input: ["supplier_id?", "cert_type?", "status?", "limit?", "offset?"], output: "CertificateGrant[]", side_effects: [] }
  - { method: POST, path: "/tea-ops/certificates/{id}/suspend", description: "Suspend a certificate; cascades batch holds -> run cancellations", roles: [CertificationOfficer], code: 200, input: [], output: CertificateGrant, side_effects: ["status -> SUSPENDED + 2-link cascade"] }
  - { method: POST, path: "/tea-ops/certificates/{id}/reinstate", description: "Reinstate a suspended certificate", roles: [CertificationOfficer], code: 200, input: [], output: CertificateGrant, side_effects: ["status -> ACTIVE"] }

  # --- Test-driving: logical clock ---
  - { method: POST, path: "/tea-ops/_clock/set_current_utc", description: "Set the logical clock (test-driving endpoint). Server default before any call is exactly 2026-08-01T00:00:00Z and MUST NOT fall back to wall-clock time. Side effect: certificate expiry sweep", roles: [PlatformAdmin], code: 200, input: [to_iso8601], output: "{ current_utc: string }", side_effects: ["certificates with valid_until < now transition to EXPIRED"] }

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID, or role not one of the nine declared roles" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Actor is the same user who performed the upstream step (grade vs register; lot release vs residue submission; batch release vs blend)" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced path or body resource id does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, invalid enum, score outside 0..100, non-positive quantity, negative ppm" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent entity's current version (OCC)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Generic invalid transition for the entity's current state" }
  - { id: ERR_ALREADY_TERMINAL, http: 409, condition: "Action on a terminal entity (REJECTED/DEPLETED lot, CANCELLED/RECALLED batch, COMPLETED/CANCELLED run, FULFILLED/CANCELLED contract, EXPIRED certificate, RETIRED recipe/flavoring)" }
  - { id: ERR_LOT_NOT_RELEASABLE, http: 409, condition: "Lot release attempted when not LAB_SUBMITTED with latest verdict PASS" }
  - { id: ERR_SUPPLIER_SUSPENDED, http: 409, condition: "Lot release while the lot's supplier is SUSPENDED" }
  - { id: ERR_LOT_NOT_RELEASED, http: 409, condition: "Allocation from a lot whose status is not RELEASED" }
  - { id: ERR_RECIPE_NOT_ACTIVE, http: 409, condition: "Batch create / batch lock-recipe / contract activate referencing a non-ACTIVE recipe" }
  - { id: ERR_BATCH_NOT_RELEASABLE, http: 409, condition: "Run create/complete referencing a batch that is not RELEASED; batch release from a state other than QC_REVIEW" }
  - { id: ERR_BATCH_NOT_FLAVORABLE, http: 409, condition: "apply-flavoring when the batch is not BLENDED or the recipe has no flavoring" }
  - { id: ERR_FLAVORING_REQUIRED, http: 409, condition: "submit-qc from BLENDED on a flavored recipe (flavoring must be applied first)" }
  - { id: ERR_LINE_NOT_ACTIVE, http: 409, condition: "Run create/start on a line in MAINTENANCE" }
  - { id: ERR_CONTRACT_NOT_ACTIVE, http: 409, condition: "Run create referencing a DRAFT/CANCELLED/FULFILLED contract" }
  - { id: ERR_RUN_OUTSIDE_WINDOW, http: 409, condition: "Run start when the logical clock is outside [planned_start, planned_end)" }
  - { id: ERR_MOISTURE_OUT_OF_RANGE, http: 422, condition: "Release gate: lot moisture_pct or batch measured_moisture_pct > 7.0" }
  - { id: ERR_SYNTHETIC_ON_ORGANIC, http: 422, condition: "Applying a flavoring with natural_certified == false to an ORGANIC-targeted recipe" }
  - { id: ERR_CERT_NOT_ACTIVE, http: 422, condition: "Batch release under a certification target with no ACTIVE, currently-valid CertificateGrant for a contributing supplier" }
  - { id: ERR_CERT_VOLUME_EXHAUSTED, http: 422, condition: "Certificate remaining volume (total - consumed) < the kg a supplier contributes to the releasing batch" }
  - { id: ERR_INVALID_WINDOW, http: 422, condition: "planned_start >= planned_end or valid_from >= valid_until" }
  - { id: ERR_LINE_WINDOW_CONFLICT, http: 409, condition: "Half-open overlap [start, end) with another SCHEDULED/IN_PROGRESS run on the same line (adjacency allowed)" }
  - { id: ERR_ALLERGEN_CHANGEOVER_BUFFER, http: 409, condition: "Gap to an adjacent run with a different allergen tag set < 45 minutes on the same line" }
  - { id: ERR_CERT_WINDOW_CONFLICT, http: 409, condition: "Closed-interval overlap with an existing ACTIVE/SUSPENDED CertificateGrant of the same (supplier_id, cert_type); shared boundary dates count as overlap" }
  - { id: ERR_RECIPE_COMPOSITION_INVALID, http: 422, condition: "Component pct sum + flavoring_pct != 100.00, empty components, or bad component shape" }
  - { id: ERR_ALLOCATION_TYPE_MISMATCH, http: 422, condition: "Allocated lot's leaf_type matches no recipe component" }
  - { id: ERR_ALLOCATION_GRADE_TOO_LOW, http: 422, condition: "Allocated lot's composite_grade below the matched component's min_grade" }
  - { id: ERR_LOT_WEIGHT_EXCEEDED, http: 422, condition: "allocated_kg > lot.remaining_weight_kg" }
  - { id: ERR_DUPLICATE_LOT_ALLOCATION, http: 409, condition: "Same lot allocated twice into one batch (ACTIVE allocations)" }
  - { id: ERR_FILL_INCOMPLETE, http: 422, condition: "finalize-allocation with a component's allocated total != required_kg exactly" }
  - { id: ERR_SINGLE_LOT_DOMINANCE, http: 422, condition: "One lot supplies > 70% of a component whose required_kg > 25.0" }
  - { id: ERR_FLAVORING_MISMATCH, http: 422, condition: "apply-flavoring with flavoring_id != recipe.flavoring_id" }
  - { id: ERR_FLAVORING_DOSE_MISMATCH, http: 422, condition: "applied_kg != batch.flavoring_kg exactly" }
  - { id: ERR_FLAVORING_NOT_ACTIVE, http: 422, condition: "Referenced flavoring is RETIRED (recipe activate or apply-flavoring)" }
  - { id: ERR_CONTRACT_RECIPE_MISMATCH, http: 422, condition: "Run's contract.recipe_id != batch.recipe_id" }
  - { id: ERR_LINE_FORMAT_MISMATCH, http: 422, condition: "PackagingLine.line_type != batch.pack_format" }
  - { id: ERR_PRIVATE_LABEL_MINIMUM_UNMET, http: 422, condition: "planned_units (create) or actual_units (complete) below contract.minimum_units_per_run" }

# =============================================================================
# 1.7 RBAC Matrix (all roles opaque: X-User-ID is an operator id, never an entity id)
# =============================================================================
roles:
  - name: ProcurementLead
    description: "Owns supplier registry and leaf-lot intake"
    identity: opaque
    exclusive_operations: ["POST /tea-ops/suppliers", "POST /tea-ops/suppliers/{id}/suspend", "POST /tea-ops/suppliers/{id}/reinstate", "POST /tea-ops/leaf-lots"]
    shared_operations: ["all GET endpoints"]
  - name: SensoryGrader
    description: "Performs sensory grading; must not grade lots they registered (SoD)"
    identity: opaque
    exclusive_operations: ["POST /tea-ops/leaf-lots/{id}/grade-assessments"]
    shared_operations: ["all GET endpoints"]
  - name: QALabAnalyst
    description: "Submits pesticide residue tests; must not release lots they tested (SoD)"
    identity: opaque
    exclusive_operations: ["POST /tea-ops/leaf-lots/{id}/residue-tests"]
    shared_operations: ["all GET endpoints"]
  - name: QAManager
    description: "Releases and recalls lots and batches; must not release batches they blended (SoD)"
    identity: opaque
    exclusive_operations: ["POST /tea-ops/leaf-lots/{id}/release", "POST /tea-ops/leaf-lots/{id}/recall", "POST /tea-ops/batches/{id}/release", "POST /tea-ops/batches/{id}/recall"]
    shared_operations: ["all GET endpoints"]
  - name: BlendMaster
    description: "Owns flavorings, recipes, batches, blending and flavoring application"
    identity: opaque
    exclusive_operations: ["POST /tea-ops/flavorings", "POST /tea-ops/flavorings/{id}/retire", "POST /tea-ops/recipes", "PUT /tea-ops/recipes/{id}", "POST /tea-ops/recipes/{id}/activate", "POST /tea-ops/recipes/{id}/retire", "POST /tea-ops/batches", "POST /tea-ops/batches/{id}/lock-recipe", "POST /tea-ops/batches/{id}/allocations", "POST /tea-ops/batches/{id}/finalize-allocation", "POST /tea-ops/batches/{id}/blend", "POST /tea-ops/batches/{id}/apply-flavoring", "POST /tea-ops/batches/{id}/submit-qc", "POST /tea-ops/batches/{id}/cancel"]
    shared_operations: ["all GET endpoints"]
  - name: ProductionPlanner
    description: "Owns packaging lines and production run scheduling/execution"
    identity: opaque
    exclusive_operations: ["POST /tea-ops/packaging-lines", "POST /tea-ops/packaging-lines/{id}/enter-maintenance", "POST /tea-ops/packaging-lines/{id}/exit-maintenance", "POST /tea-ops/runs", "POST /tea-ops/runs/{id}/start", "POST /tea-ops/runs/{id}/complete", "POST /tea-ops/runs/{id}/cancel"]
    shared_operations: ["all GET endpoints"]
  - name: AccountManager
    description: "Owns private-label contracts"
    identity: opaque
    exclusive_operations: ["POST /tea-ops/contracts", "POST /tea-ops/contracts/{id}/activate", "POST /tea-ops/contracts/{id}/cancel"]
    shared_operations: ["all GET endpoints"]
  - name: CertificationOfficer
    description: "Owns organic/fair-trade certificate grants"
    identity: opaque
    exclusive_operations: ["POST /tea-ops/certificates", "POST /tea-ops/certificates/{id}/suspend", "POST /tea-ops/certificates/{id}/reinstate"]
    shared_operations: ["all GET endpoints"]
  - name: PlatformAdmin
    description: "Operations-only role for the logical clock"
    identity: opaque
    exclusive_operations: ["POST /tea-ops/_clock/set_current_utc"]
    shared_operations: ["all GET endpoints"]
