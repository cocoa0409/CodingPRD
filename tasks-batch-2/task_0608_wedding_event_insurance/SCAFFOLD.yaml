# =============================================================================
# Task 0608 — Wedding & Special-Event Insurance (WedSafe / Markel style)
# SCAFFOLD.yaml  (§1.0–§1.7)
# =============================================================================

scenario: |
  608. Wedding & Special-Event Insurance (WedSafe/Markel style): event profile &
  coverage tiers (cancellation/liability/liquor), vendor-failure & deposit
  protection, additional-insured (venue) certificate, named-storm/force-majeure
  cutoff, claim & documentation, single-event vs annual, rider (rings/attire),
  refund/free-look

domain_name: wedding-event-insurance
api_prefix: ""

complexity_profile:
  primary_archetype: pricing engine
  secondary_archetype: compliance / audit
  complexity_layers:
    - dual_variant_calculation        # bind-time provisional premium vs settled premium-earned at claim/cancel
    - rate_threshold_triggers         # named-storm landfall cutoff, force-majeure window, deposit sublimit caps
    - cascading_side_effects          # policy bind → certificate issue → vendor protection activation; cancel cascades
    - optimistic_concurrency          # CREATE-with-supersede on Endorsement against a stale Policy.version
    - derived_field_reconciliation    # policy.total_premium_cents reconciled from base + rider + tier debits

  entity_topology: hybrid
  # Policy is the aggregate root (tree of EventProfile, Coverage, Rider, Certificate,
  # Endorsement, Claim) but Vendor and ForceMajeureEvent are flat peers referenced
  # by FK across the aggregate boundary.

  state_machine_shape: parallel
  # Policy carries two independent dimensions: lifecycle_status (QUOTED→BOUND→...)
  # and billing_status (UNPAID→PAID→REFUNDED). Claim has its own cyclic machine
  # (revision loop on documentation). Certificate and Endorsement add branching.

  relationship_patterns:
    - one_to_many        # Policy has many Coverages, Riders, Certificates, Claims
    - cross_aggregate    # Certificate.vendor_id -> Vendor; Claim.force_majeure_event_id -> ForceMajeureEvent
    - polymorphic        # ClaimDocument.subject_ref points at a Vendor or a Coverage line

  role_model: peer_roles
  # Policyholder owns its own policy lifecycle; UnderwritingAgent prices/binds/endorses;
  # ClaimsAdjuster owns claim adjudication; PlatformAdmin manages reference data & clock.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  # ---------------------------------------------------------------------------
  # Reference / configuration entities
  # ---------------------------------------------------------------------------
  - name: CoverageProduct
    parent: null
    common_fields: true
    description: "Configuration: a sellable coverage line (CANCELLATION / LIABILITY / LIQUOR_LIABILITY) with rating parameters."
    fields:
      - { name: coverage_type, type: enum, source: input, description: "CANCELLATION | LIABILITY | LIQUOR_LIABILITY", constraints: "one of {CANCELLATION, LIABILITY, LIQUOR_LIABILITY}; unique among ACTIVE products" }
      - { name: tier, type: enum, source: input, description: "BASIC | STANDARD | PREMIER — coverage tier", constraints: "one of {BASIC, STANDARD, PREMIER}" }
      - { name: base_premium_cents, type: integer, source: input, description: "Flat base premium for this product+tier, integer cents", constraints: ">= 0" }
      - { name: per_guest_premium_cents, type: integer, source: input, description: "Marginal premium added per attendee for rating, integer cents", constraints: ">= 0" }
      - { name: coverage_limit_cents, type: integer, source: input, description: "Maximum indemnity payable under one claim against this product, integer cents", constraints: "> 0" }
      - { name: deposit_sublimit_pct, type: number, source: input, description: "Fraction (0..1] of coverage_limit_cents that vendor-failure/deposit losses may consume", constraints: "0 < deposit_sublimit_pct <= 1; applies to CANCELLATION only" }
      - { name: liquor_required, type: boolean, source: input, default: false, description: "If true, this product may only be added when the event serves alcohol" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | RETIRED — retired products cannot be added to new policies", constraints: "one of {ACTIVE, RETIRED}" }

  - name: Vendor
    parent: null
    common_fields: true
    description: "Flat peer: a wedding vendor (caterer, florist, etc.) whose failure or deposit loss the policy can protect. Referenced cross-aggregate by Certificate and Coverage."
    fields:
      - { name: legal_name, type: string, source: input, description: "Vendor legal/business name" }
      - { name: category, type: enum, source: input, description: "VENUE | CATERER | FLORIST | PHOTOGRAPHER | ENTERTAINMENT | OTHER", constraints: "one of {VENUE, CATERER, FLORIST, PHOTOGRAPHER, ENTERTAINMENT, OTHER}" }
      - { name: deposit_paid_cents, type: integer, source: input, description: "Non-refundable deposit the insured has paid this vendor, integer cents", constraints: ">= 0" }
      - { name: status, type: enum, source: system, default: SOLVENT, description: "SOLVENT | FLAGGED | DEFAULTED — DEFAULTED unlocks vendor-failure claims", constraints: "one of {SOLVENT, FLAGGED, DEFAULTED}" }

  - name: ForceMajeureEvent
    parent: null
    common_fields: true
    description: "Flat peer: a declared named-storm / force-majeure event with a hard coverage cutoff instant. Referenced cross-aggregate by Claim."
    fields:
      - { name: peril_name, type: string, source: input, description: "Human name of the peril, e.g. 'Hurricane Della'" }
      - { name: peril_type, type: enum, source: input, description: "NAMED_STORM | PANDEMIC | WILDFIRE | CIVIL_AUTHORITY", constraints: "one of {NAMED_STORM, PANDEMIC, WILDFIRE, CIVIL_AUTHORITY}" }
      - { name: cutoff_at, type: datetime, source: input, description: "Binding cutoff instant. A policy BOUND at-or-after this instant cannot claim against this peril (named-storm cutoff rule).", constraints: "ISO 8601 UTC" }
      - { name: landfall_at, type: datetime, source: input, description: "When the peril actually struck; must be within the covered event window for a payout", constraints: "ISO 8601 UTC" }
      - { name: status, type: enum, source: system, default: WATCH, description: "WATCH | ACTIVE | EXPIRED — only ACTIVE perils support payouts", constraints: "one of {WATCH, ACTIVE, EXPIRED}" }

  # ---------------------------------------------------------------------------
  # Aggregate root: Policy (parallel state dimensions)
  # ---------------------------------------------------------------------------
  - name: Policy
    parent: null
    common_fields: true
    description: "Aggregate root. Carries TWO independent state dimensions: lifecycle_status and billing_status (parallel machine). single-event vs annual term."
    fields:
      - { name: policyholder_id, type: string, source: system, description: "Opaque X-User-ID of the Policyholder who created the policy (ownership key)" }
      - { name: policy_form, type: enum, source: input, description: "SINGLE_EVENT | ANNUAL — ANNUAL allows multiple EventProfiles; SINGLE_EVENT allows exactly one", constraints: "one of {SINGLE_EVENT, ANNUAL}" }
      - { name: serves_alcohol, type: boolean, source: input, default: false, description: "Whether the insured event(s) serve alcohol; gates LIQUOR_LIABILITY products" }
      - { name: free_look_days, type: integer, source: input, default: 15, description: "Free-look refund window length in days from bind_at", constraints: ">= 0" }
      - { name: bind_at, type: datetime, source: system, description: "Logical-clock instant at which the policy was BOUND; null until bind" }
      - { name: base_premium_cents, type: integer, source: computed, default: 0, description: "Sum of rated premium for all active Coverage lines at bind time" }
      - { name: rider_premium_cents, type: integer, source: computed, default: 0, description: "Sum of premium for all active Riders at bind time" }
      - { name: total_premium_cents, type: integer, source: computed, default: 0, description: "Reconciled = base_premium_cents + rider_premium_cents (derived-field reconciliation)" }
      - { name: premium_earned_cents, type: integer, source: computed, default: 0, description: "Settled premium retained by carrier on cancel after free-look (dual-variant of total_premium_cents)" }
      - { name: refund_due_cents, type: integer, source: computed, default: 0, description: "Refund owed to policyholder on cancellation" }
      - { name: lifecycle_status, type: enum, source: system, default: QUOTED, description: "QUOTED → BOUND → IN_FORCE → (EXPIRED | CANCELLED | CLAIMED_OUT). Dimension 1 of the parallel machine.", constraints: "one of {QUOTED, BOUND, IN_FORCE, EXPIRED, CANCELLED, CLAIMED_OUT}" }
      - { name: billing_status, type: enum, source: system, default: UNPAID, description: "UNPAID → PAID → (REFUNDED | EARNED). Dimension 2 of the parallel machine; evolves independently of lifecycle_status.", constraints: "one of {UNPAID, PAID, REFUNDED, EARNED}" }

  - name: EventProfile
    parent: Policy
    common_fields: true
    description: "A covered event under a Policy (single-event: exactly one; annual: many). Defines the covered window used for force-majeure landfall checks."
    fields:
      - { name: policy_id, type: string, source: system, description: "FK -> Policy.id; owning policy" }
      - { name: event_name, type: string, source: input, description: "e.g. 'Smith–Jones Wedding'" }
      - { name: venue_vendor_id, type: string, source: input, description: "Reference to a Vendor by id (the VENUE hosting this event); existence-validated, discoverable via GET /vendors", constraints: "referenced vendor must have category == VENUE" }
      - { name: expected_attendance, type: integer, source: input, description: "Headcount used in per-guest premium rating", constraints: ">= 1" }
      - { name: event_start_at, type: datetime, source: input, description: "Start instant of the covered event window", constraints: "ISO 8601 UTC; must be strictly after policy creation" }
      - { name: event_end_at, type: datetime, source: input, description: "End instant of the covered event window", constraints: "ISO 8601 UTC; must be strictly after event_start_at" }

  - name: Coverage
    parent: Policy
    common_fields: true
    description: "A selected coverage line on the Policy (instance of a CoverageProduct). Holds its rated premium and a running consumed-limit ledger."
    fields:
      - { name: policy_id, type: string, source: system, description: "FK -> Policy.id; owning policy" }
      - { name: coverage_product_id, type: string, source: input, description: "Reference to a CoverageProduct by id (the product+tier selected); existence-validated, discoverable via GET /coverage-products" }
      - { name: protected_vendor_id, type: string, source: input, required: false, description: "Reference to a Vendor by id whose deposit/failure this CANCELLATION line protects (CANCELLATION only); existence-validated" }
      - { name: rated_premium_cents, type: integer, source: computed, default: 0, description: "Premium for this line = product.base_premium_cents + product.per_guest_premium_cents * total_attendance" }
      - { name: consumed_limit_cents, type: integer, source: computed, default: 0, description: "Cumulative indemnity already paid against this line; cannot exceed product.coverage_limit_cents" }
      - { name: status, type: enum, source: system, default: SELECTED, description: "SELECTED → ACTIVE → (EXHAUSTED | VOIDED). ACTIVE at bind; EXHAUSTED when consumed_limit hits coverage_limit.", constraints: "one of {SELECTED, ACTIVE, EXHAUSTED, VOIDED}" }

  - name: Rider
    parent: Policy
    common_fields: true
    description: "Scheduled-property rider (rings / attire / gifts) endorsed onto a Policy, with its own sub-limit and flat premium."
    fields:
      - { name: policy_id, type: string, source: system, description: "FK -> Policy.id; owning policy" }
      - { name: rider_type, type: enum, source: input, description: "RINGS | ATTIRE | GIFTS | SPECIAL_PROPERTY", constraints: "one of {RINGS, ATTIRE, GIFTS, SPECIAL_PROPERTY}" }
      - { name: scheduled_value_cents, type: integer, source: input, description: "Declared insured value of the scheduled item(s), integer cents", constraints: "> 0" }
      - { name: rider_premium_cents, type: integer, source: computed, default: 0, description: "Premium = ceil(scheduled_value_cents * RIDER_RATE) clamped to [RIDER_MIN_PREMIUM, RIDER_MAX_PREMIUM]" }
      - { name: status, type: enum, source: system, default: SELECTED, description: "SELECTED → ACTIVE → VOIDED. ACTIVE once policy bound.", constraints: "one of {SELECTED, ACTIVE, VOIDED}" }

  - name: Certificate
    parent: Policy
    common_fields: true
    description: "Additional-insured certificate naming a venue (or other vendor) as additional insured. Issued only against a bound policy with LIABILITY."
    fields:
      - { name: policy_id, type: string, source: system, description: "FK -> Policy.id; owning policy" }
      - { name: vendor_id, type: string, source: input, description: "Reference to a Vendor by id (the additional insured, typically the VENUE); existence-validated, discoverable via GET /vendors" }
      - { name: additional_insured_name, type: string, source: input, description: "Name as it should appear on the certificate" }
      - { name: certificate_number, type: string, source: system, description: "System-minted human-readable certificate number" }
      - { name: status, type: enum, source: system, default: REQUESTED, description: "REQUESTED → ISSUED → (REVOKED). Issued only when a LIABILITY Coverage is ACTIVE.", constraints: "one of {REQUESTED, ISSUED, REVOKED}" }

  - name: Endorsement
    parent: Policy
    common_fields: true
    description: "A mid-term change request against a bound Policy (add coverage, raise attendance, add rider). Each apply is an independent write that mutates Policy.total_premium_cents and bumps Policy.version; it is guarded by OCC on Policy.version (a CREATE-with-supersede pattern: a prior apply makes any other still-DRAFT endorsement's previously-observed policy version stale)."
    fields:
      - { name: policy_id, type: string, source: system, description: "FK -> Policy.id; owning policy" }
      - { name: endorsement_type, type: enum, source: input, description: "ADD_COVERAGE | RAISE_ATTENDANCE | ADD_RIDER", constraints: "one of {ADD_COVERAGE, RAISE_ATTENDANCE, ADD_RIDER}" }
      - { name: premium_delta_cents, type: integer, source: computed, default: 0, description: "Additional premium this endorsement adds to the policy when applied" }
      - { name: payload_json, type: object, source: input, description: "Type-specific change payload (e.g. {coverage_product_id} or {new_attendance})" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT → APPLIED | REJECTED.", constraints: "one of {DRAFT, APPLIED, REJECTED}" }

  - name: Claim
    parent: Policy
    common_fields: true
    description: "A claim against the policy (cancellation / vendor-failure / force-majeure / property). Cyclic adjudication: SUBMITTED↔INFO_REQUESTED revision loop."
    fields:
      - { name: policy_id, type: string, source: system, description: "FK -> Policy.id; owning policy" }
      - { name: coverage_id, type: string, source: input, description: "Reference to a Coverage by id (the coverage line the claim draws against); existence-validated, forward-navigable via GET /policies/{id}/coverages/{coverageId}" }
      - { name: claim_type, type: enum, source: input, description: "CANCELLATION | VENDOR_FAILURE | FORCE_MAJEURE | PROPERTY", constraints: "one of {CANCELLATION, VENDOR_FAILURE, FORCE_MAJEURE, PROPERTY}" }
      - { name: vendor_id, type: string, source: input, required: false, description: "Reference to a Vendor by id; required for VENDOR_FAILURE (must be DEFAULTED at approval); existence-validated" }
      - { name: force_majeure_event_id, type: string, source: input, required: false, description: "Reference to a ForceMajeureEvent by id; required for FORCE_MAJEURE claims; existence-validated" }
      - { name: claimed_amount_cents, type: integer, source: input, description: "Loss amount claimed, integer cents", constraints: "> 0" }
      - { name: approved_amount_cents, type: integer, source: computed, default: 0, description: "Indemnity approved = min(claimed, remaining line limit, applicable sublimit)" }
      - { name: revision_count, type: integer, source: system, default: 0, description: "Number of times the claim has cycled back through INFO_REQUESTED" }
      - { name: status, type: enum, source: system, default: SUBMITTED, description: "SUBMITTED → INFO_REQUESTED → SUBMITTED (cycle) → (APPROVED | DENIED) → PAID.", constraints: "one of {SUBMITTED, INFO_REQUESTED, APPROVED, DENIED, PAID}" }

  - name: ClaimDocument
    parent: Claim
    common_fields: false
    description: "Append-only documentation attached to a Claim. Polymorphic subject_ref may point at a Vendor or a Coverage. Immutable (no version field). Reverse-reachable via GET /policies/{id}/claims/{claimId}/documents."
    fields:
      - { name: claim_id, type: string, source: system, description: "Owning Claim id; reverse-reachable via the claim's documents sub-resource list (GET /policies/{id}/claims/{claimId}/documents)" }
      - { name: doc_type, type: enum, source: input, description: "INVOICE | RECEIPT | POLICE_REPORT | VENDOR_CONTRACT | PHOTO", constraints: "one of {INVOICE, RECEIPT, POLICE_REPORT, VENDOR_CONTRACT, PHOTO}" }
      - { name: subject_kind, type: enum, source: input, required: false, description: "Polymorphic discriminator: VENDOR | COVERAGE | NONE", constraints: "one of {VENDOR, COVERAGE, NONE}" }
      - { name: subject_ref, type: string, source: input, required: false, description: "Polymorphic reference id; resolves to a Vendor.id when subject_kind==VENDOR, a Coverage.id when subject_kind==COVERAGE" }
      - { name: file_uri, type: string, source: input, description: "Opaque URI of the uploaded document" }

  - name: PremiumLedgerEntry
    parent: Policy
    common_fields: false
    description: "Append-only money ledger for a Policy: every premium debit, refund, and indemnity payout. Immutable audit record."
    fields:
      - { name: policy_id, type: string, source: system, description: "FK -> Policy.id; owning policy" }
      - { name: entry_kind, type: enum, source: input, description: "PREMIUM_CHARGE | ENDORSEMENT_CHARGE | REFUND | INDEMNITY_PAYOUT", constraints: "one of {PREMIUM_CHARGE, ENDORSEMENT_CHARGE, REFUND, INDEMNITY_PAYOUT}" }
      - { name: amount_cents, type: integer, source: input, description: "Signed amount in cents; charges positive, refunds/payouts negative to carrier balance" }
      - { name: memo, type: string, source: input, required: false, description: "Free-text memo" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  # ---- Policy DIMENSION 1: lifecycle_status -------------------------------
  - entity: Policy
    dimension: lifecycle_status
    initial_state: QUOTED
    terminal_states: [EXPIRED, CANCELLED, CLAIMED_OUT]
    transitions:
      - from: QUOTED
        to: BOUND
        trigger: "POST /policies/{id}/bind"
        actor: UnderwritingAgent
        preconditions:
          - "Policy.lifecycle_status == QUOTED (ERR_POLICY_NOT_QUOTED)"
          - "At least one EventProfile exists (ERR_NO_EVENT_PROFILE)"
          - "At least one Coverage in SELECTED status (ERR_NO_COVERAGE_SELECTED)"
          - "If policy_form == SINGLE_EVENT, exactly one EventProfile exists (ERR_SINGLE_EVENT_MULTIPLE_PROFILES)"
          - "If any SELECTED Coverage's product is LIQUOR_LIABILITY then Policy.serves_alcohol == true (ERR_LIQUOR_REQUIRES_ALCOHOL)"
        side_effects:
          - "Rate every SELECTED Coverage via rated_coverage_premium; set Coverage.rated_premium_cents; flip Coverage SELECTED→ACTIVE"
          - "Rate every SELECTED Rider via rider_premium; set Rider.rider_premium_cents; flip Rider SELECTED→ACTIVE"
          - "Recompute Policy.base_premium_cents, rider_premium_cents, total_premium_cents via policy_premium_reconciliation"
          - "Set Policy.bind_at = current logical clock"
          - "Append PremiumLedgerEntry(entry_kind=PREMIUM_CHARGE, amount_cents=+total_premium_cents)"
          - "increments Policy.version by 1"
        note: "Cascade depth-3 originates here: bind → (rate Coverage→ACTIVE) → (Coverage rating feeds policy_premium_reconciliation → total_premium_cents → ledger charge)."

      - from: BOUND
        to: IN_FORCE
        trigger: "POST /policies/{id}/activate-coverage"
        actor: UnderwritingAgent
        preconditions:
          - "Policy.lifecycle_status == BOUND (ERR_POLICY_NOT_BOUND)"
          - "Policy.billing_status == PAID (ERR_PREMIUM_UNPAID)"
        side_effects:
          - "increments Policy.version by 1"
        note: "Cross-entity-state dependency: lifecycle advance gated on the policy's own billing_status dimension."

      - from: IN_FORCE
        to: EXPIRED
        trigger: "POST /policies/{id}/expire"
        actor: system
        preconditions:
          - "Policy.lifecycle_status == IN_FORCE (ERR_POLICY_NOT_IN_FORCE)"
          - "Current logical clock is strictly after every EventProfile.event_end_at (ERR_EVENT_NOT_ENDED)"
        side_effects:
          - "Set Policy.billing_status = EARNED (full premium earned)"
          - "Set Policy.premium_earned_cents = Policy.total_premium_cents"
          - "increments Policy.version by 1"

      - from: BOUND
        to: CANCELLED
        trigger: "POST /policies/{id}/cancel"
        actor: Policyholder
        preconditions:
          - "Policy.lifecycle_status in {BOUND, IN_FORCE} (ERR_POLICY_NOT_CANCELLABLE)"
          - "No Claim in {SUBMITTED, INFO_REQUESTED, APPROVED} (ERR_OPEN_CLAIM_BLOCKS_CANCEL)"
        side_effects:
          - "Compute refund/earned split via cancellation_refund (free-look vs pro-rata)"
          - "Set Policy.refund_due_cents and Policy.premium_earned_cents"
          - "If refund_due_cents > 0: set Policy.billing_status = REFUNDED and append PremiumLedgerEntry(REFUND, -refund_due_cents); else set billing_status = EARNED"
          - "Cascade: flip every ACTIVE Coverage→VOIDED, every ACTIVE Rider→VOIDED, every ISSUED Certificate→REVOKED"
          - "increments Policy.version by 1"
        note: "Cascade depth-2 fan-in: cancel → (refund/earned split → billing dimension flip) AND (children VOIDED/REVOKED)."

      - from: IN_FORCE
        to: CANCELLED
        trigger: "POST /policies/{id}/cancel"
        actor: Policyholder
        preconditions:
          - "Policy.lifecycle_status in {BOUND, IN_FORCE} (ERR_POLICY_NOT_CANCELLABLE)"
          - "No Claim in {SUBMITTED, INFO_REQUESTED, APPROVED} (ERR_OPEN_CLAIM_BLOCKS_CANCEL)"
        side_effects:
          - "Compute refund/earned split via cancellation_refund (free-look vs pro-rata)"
          - "Set Policy.refund_due_cents and Policy.premium_earned_cents"
          - "If refund_due_cents > 0: set Policy.billing_status = REFUNDED and append PremiumLedgerEntry(REFUND, -refund_due_cents); else set billing_status = EARNED"
          - "Cascade: flip every ACTIVE Coverage→VOIDED, every ACTIVE Rider→VOIDED, every ISSUED Certificate→REVOKED"
          - "increments Policy.version by 1"

      - from: IN_FORCE
        to: CLAIMED_OUT
        trigger: "system (automatic when every ACTIVE Coverage reaches EXHAUSTED)"
        actor: system
        preconditions:
          - "Policy.lifecycle_status == IN_FORCE"
          - "Every Coverage on the policy is in {EXHAUSTED, VOIDED} and at least one is EXHAUSTED"
        side_effects:
          - "increments Policy.version by 1"
        note: "Bubble-up: child Coverage EXHAUSTED states aggregate to flip the parent lifecycle dimension."

  # ---- Policy DIMENSION 2: billing_status (parallel) ----------------------
  - entity: Policy
    dimension: billing_status
    initial_state: UNPAID
    terminal_states: [REFUNDED, EARNED]
    transitions:
      - from: UNPAID
        to: PAID
        trigger: "POST /policies/{id}/pay"
        actor: Policyholder
        preconditions:
          - "Policy.lifecycle_status == BOUND (ERR_POLICY_NOT_BOUND)"
          - "Policy.billing_status == UNPAID (ERR_PREMIUM_ALREADY_PAID)"
          - "Request amount_cents == Policy.total_premium_cents (ERR_PAYMENT_AMOUNT_MISMATCH)"
        side_effects:
          - "increments Policy.version by 1"
        note: "Parallel dimension: payment advances billing_status while lifecycle_status remains BOUND until activate-coverage."

      - from: PAID
        to: REFUNDED
        trigger: "side-effect of POST /policies/{id}/cancel when refund_due_cents > 0"
        actor: system
        preconditions:
          - "Policy.billing_status == PAID"
          - "Cancellation produced refund_due_cents > 0"
        side_effects:
          - "Append PremiumLedgerEntry(REFUND, -refund_due_cents)"

      - from: PAID
        to: EARNED
        trigger: "side-effect of expire, or of cancel when refund_due_cents == 0"
        actor: system
        preconditions:
          - "Policy.billing_status == PAID"
        side_effects:
          - "Set Policy.premium_earned_cents"

  # ---- Claim: cyclic adjudication (revision loop) -------------------------
  - entity: Claim
    initial_state: SUBMITTED
    terminal_states: [PAID, DENIED]
    transitions:
      - from: SUBMITTED
        to: INFO_REQUESTED
        trigger: "POST /policies/{id}/claims/{claimId}/request-info"
        actor: ClaimsAdjuster
        preconditions:
          - "Claim.status == SUBMITTED (ERR_CLAIM_NOT_SUBMITTED)"
        side_effects:
          - "increments Claim.version by 1"
        note: "Entry into the revision cycle."

      - from: INFO_REQUESTED
        to: SUBMITTED
        trigger: "POST /policies/{id}/claims/{claimId}/resubmit"
        actor: Policyholder
        preconditions:
          - "Claim.status == INFO_REQUESTED (ERR_CLAIM_NOT_INFO_REQUESTED)"
          - "At least one ClaimDocument has been added since entering INFO_REQUESTED (ERR_NO_NEW_DOCUMENTATION)"
        side_effects:
          - "Claim.revision_count += 1"
          - "increments Claim.version by 1"
        note: "Cycle edge: INFO_REQUESTED→SUBMITTED. revision_count is the loop counter; capped by claim_resubmit_cap calculation."

      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /policies/{id}/claims/{claimId}/approve"
        actor: ClaimsAdjuster
        preconditions:
          - "Claim.status == SUBMITTED (ERR_CLAIM_NOT_SUBMITTED)"
          - "Policy.lifecycle_status == IN_FORCE (ERR_POLICY_NOT_IN_FORCE)"
          - "Coverage.status == ACTIVE (ERR_COVERAGE_NOT_ACTIVE)"
          - "For VENDOR_FAILURE: referenced Vendor.status == DEFAULTED (ERR_VENDOR_NOT_DEFAULTED)"
          - "For FORCE_MAJEURE: ForceMajeureEvent.status == ACTIVE AND Policy.bind_at < event.cutoff_at AND event.landfall_at within some EventProfile window (ERR_FORCE_MAJEURE_NOT_COVERED)"
          - "At least one ClaimDocument exists (ERR_INSUFFICIENT_DOCUMENTATION)"
        side_effects:
          - "Compute approved_amount_cents via claim_indemnity (min of claimed, remaining line limit, sublimit)"
          - "Coverage.consumed_limit_cents += approved_amount_cents"
          - "If Coverage.consumed_limit_cents >= product.coverage_limit_cents: flip Coverage ACTIVE→EXHAUSTED"
          - "increments Claim.version by 1"
        note: "Cascade depth-3 origin: approve → (Coverage.consumed_limit bump) → (Coverage→EXHAUSTED) → (bubble-up: if all coverages exhausted, Policy→CLAIMED_OUT)."

      - from: SUBMITTED
        to: DENIED
        trigger: "POST /policies/{id}/claims/{claimId}/deny"
        actor: ClaimsAdjuster
        preconditions:
          - "Claim.status == SUBMITTED (ERR_CLAIM_NOT_SUBMITTED)"
        side_effects:
          - "increments Claim.version by 1"

      - from: APPROVED
        to: PAID
        trigger: "POST /policies/{id}/claims/{claimId}/pay"
        actor: ClaimsAdjuster
        preconditions:
          - "Claim.status == APPROVED (ERR_CLAIM_NOT_APPROVED)"
        side_effects:
          - "Append PremiumLedgerEntry(INDEMNITY_PAYOUT, -approved_amount_cents)"
          - "increments Claim.version by 1"

  # ---- Certificate: branching (issue vs revoke) ---------------------------
  - entity: Certificate
    initial_state: REQUESTED
    terminal_states: [REVOKED]
    transitions:
      - from: REQUESTED
        to: ISSUED
        trigger: "POST /policies/{id}/certificates/{certificateId}/issue"
        actor: UnderwritingAgent
        preconditions:
          - "Certificate.status == REQUESTED (ERR_CERTIFICATE_NOT_REQUESTED)"
          - "Policy.lifecycle_status in {BOUND, IN_FORCE} (ERR_POLICY_NOT_BOUND)"
          - "Policy has at least one ACTIVE Coverage whose product.coverage_type == LIABILITY (ERR_NO_LIABILITY_COVERAGE)"
        side_effects:
          - "Mint Certificate.certificate_number"
          - "increments Certificate.version by 1"
        note: "Cross-entity-state dependency: Certificate issuance gated on a sibling Coverage's state+type."

      - from: ISSUED
        to: REVOKED
        trigger: "POST /policies/{id}/certificates/{certificateId}/revoke (or cascade from policy cancel)"
        actor: UnderwritingAgent
        preconditions:
          - "Certificate.status == ISSUED (ERR_CERTIFICATE_NOT_ISSUED)"
        side_effects:
          - "increments Certificate.version by 1"

  # ---- Endorsement: branching (apply vs reject), OCC-guarded apply ----------
  - entity: Endorsement
    initial_state: DRAFT
    terminal_states: [APPLIED, REJECTED]
    transitions:
      - from: DRAFT
        to: APPLIED
        trigger: "POST /policies/{id}/endorsements/{endorsementId}/apply"
        actor: UnderwritingAgent
        preconditions:
          - "Endorsement.status == DRAFT (ERR_ENDORSEMENT_NOT_DRAFT)"
          - "Policy.lifecycle_status in {BOUND, IN_FORCE} (ERR_POLICY_NOT_BOUND)"
          - "Request expected_policy_version == Policy.version (ERR_STALE_POLICY_VERSION, 412)"
        side_effects:
          - "Apply payload_json: add Coverage / raise attendance / add Rider per endorsement_type"
          - "Compute premium_delta_cents via endorsement_premium_delta"
          - "Policy.total_premium_cents += premium_delta_cents (derived-field reconciliation)"
          - "Append PremiumLedgerEntry(ENDORSEMENT_CHARGE, +premium_delta_cents)"
          - "increments Policy.version by 1; increments Endorsement.version by 1"
        note: "Each apply is independent and bumps Policy.version; a second still-DRAFT endorsement applied with the version observed before this apply is stale and fails OCC (§1.2.1)."

      - from: DRAFT
        to: REJECTED
        trigger: "POST /policies/{id}/endorsements/{endorsementId}/reject"
        actor: UnderwritingAgent
        preconditions:
          - "Endorsement.status == DRAFT (ERR_ENDORSEMENT_NOT_DRAFT)"
        side_effects:
          - "increments Endorsement.version by 1"

  # ---- Vendor: solvency lifecycle (gates vendor-failure claims) ------------
  - entity: Vendor
    initial_state: SOLVENT
    terminal_states: []
    transitions:
      - from: SOLVENT
        to: FLAGGED
        trigger: "POST /vendors/{vendorId}/flag"
        actor: PlatformAdmin
        preconditions:
          - "Vendor.status == SOLVENT (ERR_VENDOR_NOT_SOLVENT)"
        side_effects:
          - "increments Vendor.version by 1"

      - from: FLAGGED
        to: DEFAULTED
        trigger: "POST /vendors/{vendorId}/default"
        actor: PlatformAdmin
        preconditions:
          - "Vendor.status == FLAGGED (ERR_VENDOR_NOT_FLAGGED)"
        side_effects:
          - "increments Vendor.version by 1"
        note: "DEFAULTED unlocks VENDOR_FAILURE claim approval (cross-entity-state dependency: Claim approval ← Vendor.status)."

      - from: FLAGGED
        to: SOLVENT
        trigger: "POST /vendors/{vendorId}/clear"
        actor: PlatformAdmin
        preconditions:
          - "Vendor.status == FLAGGED (ERR_VENDOR_NOT_FLAGGED)"
        side_effects:
          - "increments Vendor.version by 1"

  # ---- ForceMajeureEvent: peril lifecycle ---------------------------------
  - entity: ForceMajeureEvent
    initial_state: WATCH
    terminal_states: [EXPIRED]
    transitions:
      - from: WATCH
        to: ACTIVE
        trigger: "POST /force-majeure-events/{eventId}/activate"
        actor: PlatformAdmin
        preconditions:
          - "ForceMajeureEvent.status == WATCH (ERR_PERIL_NOT_WATCH)"
        side_effects:
          - "increments ForceMajeureEvent.version by 1"

      - from: ACTIVE
        to: EXPIRED
        trigger: "POST /force-majeure-events/{eventId}/expire"
        actor: PlatformAdmin
        preconditions:
          - "ForceMajeureEvent.status == ACTIVE (ERR_PERIL_NOT_ACTIVE)"
        side_effects:
          - "increments ForceMajeureEvent.version by 1"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: endorsement-apply-stale-policy
    parent_entity: Policy
    write_endpoint: "POST /policies/{id}/endorsements/{endorsementId}/apply"
    occ_field: "expected_policy_version"
    description: |
      Applying an Endorsement against a Policy whose version has advanced since
      the client last observed it is rejected. Applying any DRAFT endorsement
      legitimately mutates Policy.total_premium_cents and bumps Policy.version;
      a second apply on a different still-DRAFT endorsement that still carries
      the version observed before that change is operating on a stale view of
      the policy and is rejected on the version mismatch.
    error_id: ERR_STALE_POLICY_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: rated_coverage_premium
    trigger: "Coverage rating at POST /policies/{id}/bind (SELECTED→ACTIVE) and on ADD_COVERAGE / RAISE_ATTENDANCE endorsement apply"
    algorithm: aggregation
    formula: |
      total_attendance = sum of EventProfile.expected_attendance over ALL
                         EventProfiles on the policy (status filter: all event
                         profiles are live; there is no soft-delete).
      rated_premium_cents = product.base_premium_cents
                          + product.per_guest_premium_cents * total_attendance
      Coverage.rated_premium_cents := rated_premium_cents
    input_set: "All EventProfiles under the policy (annual policies sum every profile's attendance)."
    constants: {}
    precision: "integer cents (inputs already integer); no rounding needed"

  - name: rider_premium
    trigger: "Rider rating at POST /policies/{id}/bind (SELECTED→ACTIVE) and on ADD_RIDER endorsement apply"
    algorithm: threshold
    formula: |
      raw = ceil(scheduled_value_cents * RIDER_RATE)        # round UP to next cent
      rider_premium_cents = min(RIDER_MAX_PREMIUM, max(RIDER_MIN_PREMIUM, raw))
    input_set: "Single rider's scheduled_value_cents."
    constants:
      RIDER_RATE: 0.015          # 1.5% of scheduled value
      RIDER_MIN_PREMIUM: 2500    # cents floor
      RIDER_MAX_PREMIUM: 50000   # cents ceiling
    precision: "ceil to integer cents BEFORE clamping; clamp does not re-round"
    note: "Boundary-precision metric A: the floor/ceiling clamp on a per-rider basis."

  - name: policy_premium_reconciliation
    trigger: "POST /policies/{id}/bind; recomputed after every endorsement apply"
    algorithm: aggregation
    formula: |
      base_premium_cents  = sum of rated_premium_cents over Coverages with
                            status IN {SELECTED, ACTIVE} (VOIDED/EXHAUSTED excluded)
      rider_premium_cents = sum of rider_premium_cents over Riders with
                            status IN {SELECTED, ACTIVE} (VOIDED excluded)
      total_premium_cents = base_premium_cents + rider_premium_cents
      EVALUATION ORDER (pinned): rate each Coverage line FIRST, rate each Rider
      line SECOND, THEN sum the line subtotals — i.e. sum-of-rounded-lines, NOT
      round-of-sum. Rider lines are already clamped integers from rider_premium.
    input_set: "Coverages status IN {SELECTED, ACTIVE}; Riders status IN {SELECTED, ACTIVE}."
    constants: {}
    precision: "integer cents; reconciliation sums already-rounded line subtotals (sum-of-rounded order is pinned)"
    note: "Derived-field reconciliation: total_premium_cents kept consistent with line subtotals."

  - name: cancellation_refund
    trigger: "POST /policies/{id}/cancel (BOUND/IN_FORCE → CANCELLED)"
    algorithm: threshold
    formula: |
      days_since_bind = floor((current_clock - Policy.bind_at) / 86400 seconds)
      IF days_since_bind <= Policy.free_look_days:          # free-look window
          refund_due_cents    = Policy.total_premium_cents  # full refund
          premium_earned_cents = 0
      ELSE:                                                 # pro-rata earned
          earned = ceil(total_premium_cents * EARNED_MIN_RATIO)
          premium_earned_cents = earned
          refund_due_cents     = total_premium_cents - earned
      VARIANT divergence: at the EXACT boundary day == free_look_days the FULL
      refund applies (<=, not <).
    input_set: "Single policy; uses bind_at, free_look_days, total_premium_cents, logical clock."
    constants:
      EARNED_MIN_RATIO: 0.25     # carrier retains at least 25% once free-look passes
    precision: "ceil earned to integer cents; refund = total - earned (exact, no second rounding)"
    variants:
      - name: free_look_full_refund
        when: "days_since_bind <= free_look_days"
        difference: "Full premium refunded; premium_earned_cents = 0; billing_status → REFUNDED."
      - name: post_free_look_pro_rata
        when: "days_since_bind > free_look_days"
        difference: "Carrier retains ceil(total*0.25); refund = remainder; if remainder==0 billing_status → EARNED."
    note: "Dual-variant calc #1 — operates on POLICY money domain. Boundary-precision metric B: <= vs < at free_look_days."

  - name: claim_indemnity
    trigger: "POST /policies/{id}/claims/{claimId}/approve (Claim SUBMITTED→APPROVED)"
    algorithm: threshold
    formula: |
      product             = CoverageProduct of the claim's Coverage
      remaining_line      = product.coverage_limit_cents - Coverage.consumed_limit_cents
      IF claim_type == VENDOR_FAILURE OR claim_type == CANCELLATION:
          sublimit_cap = floor(product.coverage_limit_cents * product.deposit_sublimit_pct)
      ELSE:
          sublimit_cap = product.coverage_limit_cents      # no deposit sublimit
      approved_amount_cents = min(claimed_amount_cents, remaining_line, sublimit_cap)
      EVALUATION ORDER (pinned): compute remaining_line FIRST (depends on prior
      consumed_limit), compute sublimit_cap SECOND, THEN take the three-way min.
    input_set: "Single claim, its Coverage, the Coverage's product. consumed_limit is the running ledger."
    constants: {}
    precision: "floor sublimit_cap to integer cents; min over three integers (no further rounding)"
    note: "Dual-variant calc #2 — operates on CLAIM/coverage indemnity domain (different domain than cancellation_refund). Combinatorial: 3-input non-linear min with conditional sublimit branch."

  - name: endorsement_premium_delta
    trigger: "POST /policies/{id}/endorsements/{endorsementId}/apply (Endorsement DRAFT→APPLIED)"
    algorithm: aggregation
    formula: |
      ADD_COVERAGE:   delta = rated_coverage_premium for the new product line
                      (using CURRENT total_attendance)
      ADD_RIDER:      delta = rider_premium for the new rider
      RAISE_ATTENDANCE: let old_total = current sum of EventProfile.expected_attendance;
                      set the named EventProfile.expected_attendance = new_attendance;
                      new_total = recomputed sum;
                      delta = sum over ACTIVE Coverages of
                              product.per_guest_premium_cents * (new_total - old_total)
      premium_delta_cents := delta
    input_set: "Policy ACTIVE Coverages and all EventProfiles; the endorsement payload."
    constants: {}
    precision: "integer cents"
    note: "Circular-looking dependency made explicit: RAISE_ATTENDANCE delta depends on the attendance change AND on the set of ACTIVE Coverages; evaluation order pins old_total snapshot BEFORE mutation, new_total AFTER. (combinatorial mode (c))"

  - name: claim_resubmit_cap
    trigger: "POST /policies/{id}/claims/{claimId}/resubmit (Claim INFO_REQUESTED→SUBMITTED)"
    algorithm: threshold
    formula: |
      IF Claim.revision_count >= MAX_REVISIONS:            # already at cap
          reject with ERR_REVISION_CAP_EXCEEDED
      ELSE:
          Claim.revision_count += 1
      Boundary: revision_count == MAX_REVISIONS is the LAST blocked resubmit
      (i.e. revision_count may legally reach MAX_REVISIONS, the (MAX+1)th is barred).
    input_set: "Single claim's revision_count."
    constants:
      MAX_REVISIONS: 3
    precision: "integer count"
    note: "Cycle loop-bound. Boundary-precision: >= cap on a COUNT metric (distinct from cancellation's day boundary)."

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and well-formed"
    error_id: ERR_MISSING_USER_CONTEXT
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role in X-User-Role is permitted for this endpoint per §1.7"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: all

  - priority: 3
    category: auth
    check: "Acting Policyholder owns the target Policy (X-User-ID == Policy.policyholder_id) for policyholder-scoped writes (pay, cancel, resubmit, add documents)"
    error_id: ERR_NOT_POLICY_OWNER
    http_status: 403
    applies_to: "POST /policies/{id}/pay, POST /policies/{id}/cancel, POST /policies/{id}/claims/{claimId}/resubmit, POST /policies/{id}/claims/{claimId}/documents"

  - priority: 4
    category: existence
    check: "Every path-referenced resource exists, validated left-to-right (Policy before nested EventProfile/Coverage/Claim/etc.)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 5
    category: existence
    check: "Every FK in the request body resolves to an existing entity (coverage_product_id, vendor_id, venue_vendor_id, coverage_id, force_majeure_event_id)"
    error_id: ERR_REFERENCE_NOT_FOUND
    http_status: 404
    applies_to: "POST /policies/{id}/coverages, POST /policies/{id}/event-profiles, POST /policies/{id}/certificates, POST /policies/{id}/claims"

  - priority: 6
    category: business_referential
    check: "EventProfile.venue_vendor_id must reference a Vendor whose category == VENUE"
    error_id: ERR_VENUE_VENDOR_REQUIRED
    http_status: 422
    applies_to: "POST /policies/{id}/event-profiles"

  - priority: 7
    category: business_referential
    check: "Coverage.protected_vendor_id may be set ONLY when product.coverage_type == CANCELLATION"
    error_id: ERR_PROTECTED_VENDOR_NOT_ALLOWED
    http_status: 422
    applies_to: "POST /policies/{id}/coverages"

  - priority: 8
    category: state
    check: "Target resource is in a state from which the requested transition is defined (policy bind/pay/activate/cancel/expire; claim adjudication; certificate issue/revoke; endorsement apply/reject; vendor/peril transitions)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"

  - priority: 9
    category: business_constraint
    check: "SINGLE_EVENT policy may have at most one EventProfile"
    error_id: ERR_SINGLE_EVENT_MULTIPLE_PROFILES
    http_status: 422
    applies_to: "POST /policies/{id}/event-profiles, POST /policies/{id}/bind"

  - priority: 10
    category: business_constraint
    check: "EventProfile.event_end_at must be strictly after event_start_at; event_start_at strictly after policy created_at"
    error_id: ERR_INVALID_EVENT_WINDOW
    http_status: 422
    applies_to: "POST /policies/{id}/event-profiles"

  - priority: 11
    category: business_safety
    check: "LIQUOR_LIABILITY coverage may be added/bound only when Policy.serves_alcohol == true"
    error_id: ERR_LIQUOR_REQUIRES_ALCOHOL
    http_status: 422
    applies_to: "POST /policies/{id}/coverages, POST /policies/{id}/bind"

  - priority: 12
    category: business_constraint
    check: "RETIRED CoverageProduct cannot be added to a policy"
    error_id: ERR_PRODUCT_RETIRED
    http_status: 422
    applies_to: "POST /policies/{id}/coverages"

  - priority: 13
    category: business_constraint
    check: "A Policy may hold at most one Coverage per (coverage_type, tier) product; duplicate add is rejected"
    error_id: ERR_DUPLICATE_COVERAGE
    http_status: 409
    applies_to: "POST /policies/{id}/coverages"

  - priority: 14
    category: business_referential
    check: "Certificate issuance requires an ACTIVE Coverage of coverage_type == LIABILITY on the policy"
    error_id: ERR_NO_LIABILITY_COVERAGE
    http_status: 422
    applies_to: "POST /policies/{id}/certificates/{certificateId}/issue"

  - priority: 15
    category: business_referential
    check: "VENDOR_FAILURE claim requires vendor_id set and that Vendor.status == DEFAULTED at approval time"
    error_id: ERR_VENDOR_NOT_DEFAULTED
    http_status: 422
    applies_to: "POST /policies/{id}/claims, POST /policies/{id}/claims/{claimId}/approve"

  - priority: 16
    category: business_temporal
    check: "FORCE_MAJEURE claim is barred if Policy.bind_at >= ForceMajeureEvent.cutoff_at (named-storm cutoff)"
    error_id: ERR_BOUND_AFTER_CUTOFF
    http_status: 422
    applies_to: "POST /policies/{id}/claims, POST /policies/{id}/claims/{claimId}/approve"

  - priority: 17
    category: business_temporal
    check: "FORCE_MAJEURE payout requires ForceMajeureEvent.landfall_at to fall within [event_start_at, event_end_at] of some EventProfile on the policy"
    error_id: ERR_LANDFALL_OUTSIDE_WINDOW
    http_status: 422
    applies_to: "POST /policies/{id}/claims/{claimId}/approve"

  - priority: 18
    category: business_constraint
    check: "Claim approval requires at least one ClaimDocument attached"
    error_id: ERR_INSUFFICIENT_DOCUMENTATION
    http_status: 422
    applies_to: "POST /policies/{id}/claims/{claimId}/approve"

  - priority: 19
    category: business_constraint
    check: "Resubmit requires at least one ClaimDocument added since the claim last entered INFO_REQUESTED"
    error_id: ERR_NO_NEW_DOCUMENTATION
    http_status: 422
    applies_to: "POST /policies/{id}/claims/{claimId}/resubmit"

  - priority: 20
    category: business_constraint
    check: "Resubmit is barred once Claim.revision_count has reached MAX_REVISIONS (3)"
    error_id: ERR_REVISION_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /policies/{id}/claims/{claimId}/resubmit"

  - priority: 21
    category: business_constraint
    check: "Cancellation is barred while any Claim is in {SUBMITTED, INFO_REQUESTED, APPROVED}"
    error_id: ERR_OPEN_CLAIM_BLOCKS_CANCEL
    http_status: 409
    applies_to: "POST /policies/{id}/cancel"

  - priority: 22
    category: business_fiscal
    check: "Approved indemnity must not exceed the coverage line's remaining limit; a claim drawing on an EXHAUSTED line is rejected"
    error_id: ERR_COVERAGE_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /policies/{id}/claims/{claimId}/approve"

  - priority: 23
    category: business_fiscal
    check: "Payment amount_cents must equal Policy.total_premium_cents exactly"
    error_id: ERR_PAYMENT_AMOUNT_MISMATCH
    http_status: 422
    applies_to: "POST /policies/{id}/pay"

  - priority: 24
    category: business_constraint
    check: "Endorsement apply requires Policy.lifecycle_status in {BOUND, IN_FORCE}; coverage/rider/claim creation requires Policy.lifecycle_status == QUOTED (pre-bind) except claims which require IN_FORCE"
    error_id: ERR_POLICY_NOT_BOUND
    http_status: 409
    applies_to: "POST /policies/{id}/endorsements/{endorsementId}/apply"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- System / clock (test-driving) --------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. Server startup default is 2026-01-01T00:00:00Z; before any call the clock reads exactly this default and never falls back to wall-clock."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: datetime }"
    side_effects: ["logical clock set to to_iso8601"]

  # ---- CoverageProduct (reference config) ---------------------------------
  - method: POST
    path: "/coverage-products"
    description: "Create a sellable coverage product (type+tier+rating)."
    roles: [PlatformAdmin]
    code: 201
    input: [coverage_type, tier, base_premium_cents, per_guest_premium_cents, coverage_limit_cents, deposit_sublimit_pct, "liquor_required?"]
    output: CoverageProduct
    side_effects: ["status initialized ACTIVE"]

  - method: GET
    path: "/coverage-products"
    description: "List coverage products."
    roles: [PlatformAdmin, UnderwritingAgent, Policyholder, ClaimsAdjuster]
    code: 200
    input: ["coverage_type?", "tier?", "status?", "limit?", "offset?"]
    output: "CoverageProduct[]"
    side_effects: []

  - method: POST
    path: "/coverage-products/{productId}/retire"
    description: "Retire a coverage product (ACTIVE→RETIRED)."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: CoverageProduct
    side_effects: ["status ACTIVE→RETIRED"]

  # ---- Vendor (flat peer) -------------------------------------------------
  - method: POST
    path: "/vendors"
    description: "Create a vendor."
    roles: [PlatformAdmin, UnderwritingAgent]
    code: 201
    input: [legal_name, category, deposit_paid_cents]
    output: Vendor
    side_effects: ["status initialized SOLVENT"]

  - method: GET
    path: "/vendors"
    description: "List vendors (filterable)."
    roles: [PlatformAdmin, UnderwritingAgent, Policyholder, ClaimsAdjuster]
    code: 200
    input: ["category?", "status?", "limit?", "offset?"]
    output: "Vendor[]"
    side_effects: []

  - method: POST
    path: "/vendors/{vendorId}/flag"
    description: "Flag a vendor (SOLVENT→FLAGGED)."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Vendor
    side_effects: ["status SOLVENT→FLAGGED"]

  - method: POST
    path: "/vendors/{vendorId}/default"
    description: "Declare a vendor in default (FLAGGED→DEFAULTED); unlocks vendor-failure claims."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Vendor
    side_effects: ["status FLAGGED→DEFAULTED"]

  - method: POST
    path: "/vendors/{vendorId}/clear"
    description: "Clear a flagged vendor back to solvent (FLAGGED→SOLVENT)."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Vendor
    side_effects: ["status FLAGGED→SOLVENT"]

  # ---- ForceMajeureEvent (flat peer) --------------------------------------
  - method: POST
    path: "/force-majeure-events"
    description: "Declare a named-storm / force-majeure peril with a binding cutoff."
    roles: [PlatformAdmin]
    code: 201
    input: [peril_name, peril_type, cutoff_at, landfall_at]
    output: ForceMajeureEvent
    side_effects: ["status initialized WATCH"]

  - method: GET
    path: "/force-majeure-events"
    description: "List force-majeure events."
    roles: [PlatformAdmin, UnderwritingAgent, Policyholder, ClaimsAdjuster]
    code: 200
    input: ["peril_type?", "status?", "limit?", "offset?"]
    output: "ForceMajeureEvent[]"
    side_effects: []

  - method: POST
    path: "/force-majeure-events/{eventId}/activate"
    description: "Activate a peril (WATCH→ACTIVE)."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: ForceMajeureEvent
    side_effects: ["status WATCH→ACTIVE"]

  - method: POST
    path: "/force-majeure-events/{eventId}/expire"
    description: "Expire a peril (ACTIVE→EXPIRED)."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: ForceMajeureEvent
    side_effects: ["status ACTIVE→EXPIRED"]

  # ---- Policy (aggregate root) --------------------------------------------
  - method: POST
    path: "/policies"
    description: "Create a quoted policy (lifecycle QUOTED, billing UNPAID)."
    roles: [Policyholder]
    code: 201
    input: [policy_form, "serves_alcohol?", "free_look_days?"]
    output: Policy
    side_effects: ["lifecycle_status=QUOTED, billing_status=UNPAID; policyholder_id set from X-User-ID"]

  - method: GET
    path: "/policies"
    description: "List policies (filterable by status/form)."
    roles: [PlatformAdmin, UnderwritingAgent, Policyholder, ClaimsAdjuster]
    code: 200
    input: ["policy_form?", "lifecycle_status?", "billing_status?", "limit?", "offset?"]
    output: "Policy[]"
    side_effects: []

  - method: GET
    path: "/policies/{id}"
    description: "Get a policy with reconciled premium fields."
    roles: [PlatformAdmin, UnderwritingAgent, Policyholder, ClaimsAdjuster]
    code: 200
    input: []
    output: Policy
    side_effects: []

  - method: POST
    path: "/policies/{id}/bind"
    description: "Bind a quoted policy: rate coverages/riders, reconcile premium, charge ledger (QUOTED→BOUND)."
    roles: [UnderwritingAgent]
    code: 200
    input: []
    output: Policy
    side_effects: ["rate Coverages/Riders (SELECTED→ACTIVE)", "policy_premium_reconciliation", "set bind_at", "append PREMIUM_CHARGE ledger entry", "increments Policy.version by 1"]

  - method: POST
    path: "/policies/{id}/pay"
    description: "Pay the bound premium (billing UNPAID→PAID)."
    roles: [Policyholder]
    code: 200
    input: [amount_cents]
    output: Policy
    side_effects: ["billing_status UNPAID→PAID", "increments Policy.version by 1"]

  - method: POST
    path: "/policies/{id}/activate-coverage"
    description: "Put a paid bound policy in force (lifecycle BOUND→IN_FORCE)."
    roles: [UnderwritingAgent]
    code: 200
    input: []
    output: Policy
    side_effects: ["lifecycle_status BOUND→IN_FORCE", "increments Policy.version by 1"]

  - method: POST
    path: "/policies/{id}/cancel"
    description: "Cancel a bound/in-force policy: compute free-look vs pro-rata refund, cascade void children (→CANCELLED)."
    roles: [Policyholder]
    code: 200
    input: []
    output: Policy
    side_effects: ["cancellation_refund", "set refund_due_cents/premium_earned_cents", "billing_status→REFUNDED or EARNED", "cascade Coverage/Rider→VOIDED, Certificate→REVOKED", "append REFUND ledger entry when refund>0", "increments Policy.version by 1"]

  - method: POST
    path: "/policies/{id}/expire"
    description: "Expire an in-force policy after its events end (lifecycle IN_FORCE→EXPIRED, billing→EARNED)."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Policy
    side_effects: ["lifecycle_status IN_FORCE→EXPIRED", "billing_status→EARNED", "set premium_earned_cents", "increments Policy.version by 1"]

  - method: GET
    path: "/policies/{id}/ledger"
    description: "List the policy's premium/refund/payout ledger entries (PremiumLedgerEntry by policy_id)."
    roles: [PlatformAdmin, UnderwritingAgent, Policyholder, ClaimsAdjuster]
    code: 200
    input: ["entry_kind?", "limit?", "offset?"]
    output: "PremiumLedgerEntry[]"
    side_effects: []

  # ---- EventProfile (child of Policy) -------------------------------------
  - method: POST
    path: "/policies/{id}/event-profiles"
    description: "Add a covered event profile to a quoted policy."
    roles: [Policyholder]
    code: 201
    input: [event_name, venue_vendor_id, expected_attendance, event_start_at, event_end_at]
    output: EventProfile
    side_effects: []

  - method: GET
    path: "/policies/{id}/event-profiles"
    description: "List event profiles under a policy (reverse-reach for EventProfile.policy_id)."
    roles: [PlatformAdmin, UnderwritingAgent, Policyholder, ClaimsAdjuster]
    code: 200
    input: ["limit?", "offset?"]
    output: "EventProfile[]"
    side_effects: []

  # ---- Coverage (child of Policy) -----------------------------------------
  - method: POST
    path: "/policies/{id}/coverages"
    description: "Add a coverage line (SELECTED) to a quoted policy."
    roles: [Policyholder, UnderwritingAgent]
    code: 201
    input: [coverage_product_id, "protected_vendor_id?"]
    output: Coverage
    side_effects: ["status initialized SELECTED"]

  - method: GET
    path: "/policies/{id}/coverages"
    description: "List coverage lines under a policy (reverse-reach for Coverage.policy_id)."
    roles: [PlatformAdmin, UnderwritingAgent, Policyholder, ClaimsAdjuster]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "Coverage[]"
    side_effects: []

  - method: GET
    path: "/policies/{id}/coverages/{coverageId}"
    description: "Get a coverage line (rated_premium_cents, consumed_limit_cents)."
    roles: [PlatformAdmin, UnderwritingAgent, Policyholder, ClaimsAdjuster]
    code: 200
    input: []
    output: Coverage
    side_effects: []

  # ---- Rider (child of Policy) --------------------------------------------
  - method: POST
    path: "/policies/{id}/riders"
    description: "Add a scheduled-property rider (SELECTED) to a quoted policy."
    roles: [Policyholder, UnderwritingAgent]
    code: 201
    input: [rider_type, scheduled_value_cents]
    output: Rider
    side_effects: ["status initialized SELECTED"]

  - method: GET
    path: "/policies/{id}/riders"
    description: "List riders under a policy (reverse-reach for Rider.policy_id)."
    roles: [PlatformAdmin, UnderwritingAgent, Policyholder, ClaimsAdjuster]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "Rider[]"
    side_effects: []

  # ---- Certificate (child of Policy) --------------------------------------
  - method: POST
    path: "/policies/{id}/certificates"
    description: "Request an additional-insured certificate (REQUESTED) naming a vendor."
    roles: [Policyholder, UnderwritingAgent]
    code: 201
    input: [vendor_id, additional_insured_name]
    output: Certificate
    side_effects: ["status initialized REQUESTED"]

  - method: GET
    path: "/policies/{id}/certificates"
    description: "List certificates under a policy (reverse-reach for Certificate.policy_id)."
    roles: [PlatformAdmin, UnderwritingAgent, Policyholder, ClaimsAdjuster]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "Certificate[]"
    side_effects: []

  - method: POST
    path: "/policies/{id}/certificates/{certificateId}/issue"
    description: "Issue a requested certificate (REQUESTED→ISSUED); requires ACTIVE LIABILITY coverage."
    roles: [UnderwritingAgent]
    code: 200
    input: []
    output: Certificate
    side_effects: ["mint certificate_number", "status REQUESTED→ISSUED", "increments Certificate.version by 1"]

  - method: POST
    path: "/policies/{id}/certificates/{certificateId}/revoke"
    description: "Revoke an issued certificate (ISSUED→REVOKED)."
    roles: [UnderwritingAgent]
    code: 200
    input: []
    output: Certificate
    side_effects: ["status ISSUED→REVOKED", "increments Certificate.version by 1"]

  # ---- Endorsement (child of Policy; OCC) ---------------------------------
  - method: POST
    path: "/policies/{id}/endorsements"
    description: "Draft a mid-term endorsement against a bound policy (DRAFT)."
    roles: [UnderwritingAgent]
    code: 201
    input: [endorsement_type, payload_json]
    output: Endorsement
    side_effects: ["status initialized DRAFT"]

  - method: GET
    path: "/policies/{id}/endorsements"
    description: "List endorsements under a policy (reverse-reach for Endorsement.policy_id)."
    roles: [PlatformAdmin, UnderwritingAgent, Policyholder, ClaimsAdjuster]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "Endorsement[]"
    side_effects: []

  - method: POST
    path: "/policies/{id}/endorsements/{endorsementId}/apply"
    description: "Apply a draft endorsement (DRAFT→APPLIED); OCC on Policy.version; bumps Policy.total_premium_cents and Policy.version."
    roles: [UnderwritingAgent]
    code: 200
    input: [expected_policy_version]
    output: Endorsement
    side_effects: ["apply payload_json", "endorsement_premium_delta", "Policy.total_premium_cents += delta", "append ENDORSEMENT_CHARGE ledger entry", "increments Policy.version by 1", "increments Endorsement.version by 1"]

  - method: POST
    path: "/policies/{id}/endorsements/{endorsementId}/reject"
    description: "Reject a draft endorsement (DRAFT→REJECTED)."
    roles: [UnderwritingAgent]
    code: 200
    input: []
    output: Endorsement
    side_effects: ["status DRAFT→REJECTED", "increments Endorsement.version by 1"]

  # ---- Claim (child of Policy; cyclic) ------------------------------------
  - method: POST
    path: "/policies/{id}/claims"
    description: "File a claim against a coverage line (SUBMITTED)."
    roles: [Policyholder]
    code: 201
    input: [coverage_id, claim_type, claimed_amount_cents, "vendor_id?", "force_majeure_event_id?"]
    output: Claim
    side_effects: ["status initialized SUBMITTED, revision_count=0"]

  - method: GET
    path: "/policies/{id}/claims"
    description: "List claims under a policy (reverse-reach for Claim.policy_id)."
    roles: [PlatformAdmin, UnderwritingAgent, Policyholder, ClaimsAdjuster]
    code: 200
    input: ["status?", "claim_type?", "limit?", "offset?"]
    output: "Claim[]"
    side_effects: []

  - method: GET
    path: "/policies/{id}/claims/{claimId}"
    description: "Get a claim (approved_amount_cents, revision_count)."
    roles: [PlatformAdmin, UnderwritingAgent, Policyholder, ClaimsAdjuster]
    code: 200
    input: []
    output: Claim
    side_effects: []

  - method: POST
    path: "/policies/{id}/claims/{claimId}/documents"
    description: "Attach a document to a claim (append-only)."
    roles: [Policyholder]
    code: 201
    input: [doc_type, file_uri, "subject_kind?", "subject_ref?"]
    output: ClaimDocument
    side_effects: []

  - method: GET
    path: "/policies/{id}/claims/{claimId}/documents"
    description: "List a claim's documents (reverse-reach for ClaimDocument.claim_id)."
    roles: [PlatformAdmin, UnderwritingAgent, Policyholder, ClaimsAdjuster]
    code: 200
    input: ["doc_type?", "limit?", "offset?"]
    output: "ClaimDocument[]"
    side_effects: []

  - method: POST
    path: "/policies/{id}/claims/{claimId}/request-info"
    description: "Adjuster requests more info (SUBMITTED→INFO_REQUESTED)."
    roles: [ClaimsAdjuster]
    code: 200
    input: []
    output: Claim
    side_effects: ["status SUBMITTED→INFO_REQUESTED", "increments Claim.version by 1"]

  - method: POST
    path: "/policies/{id}/claims/{claimId}/resubmit"
    description: "Policyholder resubmits with new docs (INFO_REQUESTED→SUBMITTED); revision_count++ capped at 3."
    roles: [Policyholder]
    code: 200
    input: []
    output: Claim
    side_effects: ["claim_resubmit_cap check", "revision_count += 1", "status INFO_REQUESTED→SUBMITTED", "increments Claim.version by 1"]

  - method: POST
    path: "/policies/{id}/claims/{claimId}/approve"
    description: "Approve a claim (SUBMITTED→APPROVED); computes indemnity, bumps consumed_limit, may exhaust coverage."
    roles: [ClaimsAdjuster]
    code: 200
    input: []
    output: Claim
    side_effects: ["claim_indemnity", "set approved_amount_cents", "Coverage.consumed_limit_cents += approved", "Coverage→EXHAUSTED if limit hit", "bubble-up Policy→CLAIMED_OUT if all coverages exhausted", "increments Claim.version by 1"]

  - method: POST
    path: "/policies/{id}/claims/{claimId}/deny"
    description: "Deny a claim (SUBMITTED→DENIED)."
    roles: [ClaimsAdjuster]
    code: 200
    input: []
    output: Claim
    side_effects: ["status SUBMITTED→DENIED", "increments Claim.version by 1"]

  - method: POST
    path: "/policies/{id}/claims/{claimId}/pay"
    description: "Pay an approved claim (APPROVED→PAID); appends INDEMNITY_PAYOUT ledger entry."
    roles: [ClaimsAdjuster]
    code: 200
    input: []
    output: Claim
    side_effects: ["append INDEMNITY_PAYOUT ledger entry", "status APPROVED→PAID", "increments Claim.version by 1"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- auth / existence ---
  - { id: ERR_MISSING_USER_CONTEXT, http: 401, condition: "X-User-ID or X-User-Role header missing or malformed" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role not permitted for this operation" }
  - { id: ERR_NOT_POLICY_OWNER, http: 403, condition: "Acting Policyholder is not the owner of the target policy" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "A path-referenced resource does not exist" }
  - { id: ERR_REFERENCE_NOT_FOUND, http: 404, condition: "A body FK (product/vendor/coverage/peril) does not resolve" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body, missing required field, type mismatch, invalid enum" }

  # --- policy lifecycle / billing ---
  - { id: ERR_POLICY_NOT_QUOTED, http: 409, condition: "Operation requires policy in QUOTED but it is not" }
  - { id: ERR_POLICY_NOT_BOUND, http: 409, condition: "Operation requires policy lifecycle in {BOUND, IN_FORCE} but it is not" }
  - { id: ERR_POLICY_NOT_IN_FORCE, http: 409, condition: "Operation requires policy IN_FORCE but it is not" }
  - { id: ERR_POLICY_NOT_CANCELLABLE, http: 409, condition: "Policy lifecycle not in {BOUND, IN_FORCE} for cancel" }
  - { id: ERR_PREMIUM_UNPAID, http: 409, condition: "activate-coverage requires billing_status == PAID" }
  - { id: ERR_PREMIUM_ALREADY_PAID, http: 409, condition: "pay requires billing_status == UNPAID" }
  - { id: ERR_PAYMENT_AMOUNT_MISMATCH, http: 422, condition: "Payment amount_cents != Policy.total_premium_cents" }
  - { id: ERR_EVENT_NOT_ENDED, http: 409, condition: "expire requires clock strictly after every EventProfile.event_end_at" }
  - { id: ERR_OPEN_CLAIM_BLOCKS_CANCEL, http: 409, condition: "Cancel barred while a claim is SUBMITTED/INFO_REQUESTED/APPROVED" }

  # --- bind-time / structural ---
  - { id: ERR_NO_EVENT_PROFILE, http: 422, condition: "Bind requires at least one EventProfile" }
  - { id: ERR_NO_COVERAGE_SELECTED, http: 422, condition: "Bind requires at least one SELECTED Coverage" }
  - { id: ERR_SINGLE_EVENT_MULTIPLE_PROFILES, http: 422, condition: "SINGLE_EVENT policy has more than one EventProfile" }
  - { id: ERR_INVALID_EVENT_WINDOW, http: 422, condition: "event_end_at not strictly after event_start_at, or start not after creation" }
  - { id: ERR_VENUE_VENDOR_REQUIRED, http: 422, condition: "venue_vendor_id references a vendor whose category != VENUE" }
  - { id: ERR_PRODUCT_RETIRED, http: 422, condition: "Coverage add references a RETIRED product" }
  - { id: ERR_DUPLICATE_COVERAGE, http: 409, condition: "Policy already holds a coverage for this (coverage_type, tier)" }
  - { id: ERR_PROTECTED_VENDOR_NOT_ALLOWED, http: 422, condition: "protected_vendor_id set on a non-CANCELLATION coverage" }
  - { id: ERR_LIQUOR_REQUIRES_ALCOHOL, http: 422, condition: "LIQUOR_LIABILITY coverage on a policy with serves_alcohol == false" }

  # --- certificate ---
  - { id: ERR_CERTIFICATE_NOT_REQUESTED, http: 409, condition: "Issue requires certificate in REQUESTED" }
  - { id: ERR_CERTIFICATE_NOT_ISSUED, http: 409, condition: "Revoke requires certificate in ISSUED" }
  - { id: ERR_NO_LIABILITY_COVERAGE, http: 422, condition: "Certificate issuance requires an ACTIVE LIABILITY coverage" }

  # --- endorsement / OCC ---
  - { id: ERR_ENDORSEMENT_NOT_DRAFT, http: 409, condition: "Apply/reject requires endorsement in DRAFT" }
  - { id: ERR_STALE_POLICY_VERSION, http: 412, condition: "expected_policy_version != Policy.version on endorsement apply (OCC)" }

  # --- claim ---
  - { id: ERR_CLAIM_NOT_SUBMITTED, http: 409, condition: "request-info/approve/deny require claim in SUBMITTED" }
  - { id: ERR_CLAIM_NOT_INFO_REQUESTED, http: 409, condition: "resubmit requires claim in INFO_REQUESTED" }
  - { id: ERR_CLAIM_NOT_APPROVED, http: 409, condition: "pay requires claim in APPROVED" }
  - { id: ERR_COVERAGE_NOT_ACTIVE, http: 409, condition: "Claim approval requires its Coverage in ACTIVE" }
  - { id: ERR_INSUFFICIENT_DOCUMENTATION, http: 422, condition: "Approve requires at least one ClaimDocument" }
  - { id: ERR_NO_NEW_DOCUMENTATION, http: 422, condition: "Resubmit requires a new ClaimDocument since INFO_REQUESTED" }
  - { id: ERR_REVISION_CAP_EXCEEDED, http: 422, condition: "Resubmit barred after revision_count reaches 3" }
  - { id: ERR_VENDOR_NOT_DEFAULTED, http: 422, condition: "VENDOR_FAILURE claim requires referenced Vendor DEFAULTED" }
  - { id: ERR_BOUND_AFTER_CUTOFF, http: 422, condition: "FORCE_MAJEURE claim where Policy.bind_at >= peril.cutoff_at" }
  - { id: ERR_LANDFALL_OUTSIDE_WINDOW, http: 422, condition: "peril.landfall_at outside any EventProfile [start,end] window" }
  - { id: ERR_FORCE_MAJEURE_NOT_COVERED, http: 422, condition: "Force-majeure peril not ACTIVE or otherwise not coverable" }
  - { id: ERR_COVERAGE_LIMIT_EXCEEDED, http: 422, condition: "Approval draws on an EXHAUSTED line / exceeds remaining limit" }

  # --- vendor / peril lifecycle ---
  - { id: ERR_VENDOR_NOT_SOLVENT, http: 409, condition: "flag requires vendor SOLVENT" }
  - { id: ERR_VENDOR_NOT_FLAGGED, http: 409, condition: "default/clear requires vendor FLAGGED" }
  - { id: ERR_PERIL_NOT_WATCH, http: 409, condition: "activate requires peril WATCH" }
  - { id: ERR_PERIL_NOT_ACTIVE, http: 409, condition: "expire requires peril ACTIVE" }

  # --- generic state ---
  - { id: ERR_INVALID_STATE, http: 409, condition: "Generic invalid state transition not covered by a specific error" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Operator: manages reference data (products, vendors, perils), the logical clock, and admin lifecycle (retire, flag/default/clear, peril activate/expire, policy expire)."
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc — set clock"
      - "POST /coverage-products — create product"
      - "POST /coverage-products/{id}/retire — retire product"
      - "POST /vendors/{id}/flag — flag vendor"
      - "POST /vendors/{id}/default — default vendor"
      - "POST /vendors/{id}/clear — clear vendor"
      - "POST /force-majeure-events — create peril"
      - "POST /force-majeure-events/{id}/activate — activate peril"
      - "POST /force-majeure-events/{id}/expire — expire peril"
      - "POST /policies/{id}/expire — expire policy"
    shared_operations:
      - "POST /vendors — create vendor (shared with UnderwritingAgent)"
      - "GET endpoints (read-only) shared with all roles"

  - name: UnderwritingAgent
    description: "Prices and binds policies, issues/revokes certificates, drafts/applies/rejects endorsements."
    identity: opaque
    exclusive_operations:
      - "POST /policies/{id}/bind — bind policy"
      - "POST /policies/{id}/activate-coverage — put in force"
      - "POST /policies/{id}/certificates/{id}/issue — issue certificate"
      - "POST /policies/{id}/certificates/{id}/revoke — revoke certificate"
      - "POST /policies/{id}/endorsements — draft endorsement"
      - "POST /policies/{id}/endorsements/{id}/apply — apply endorsement"
      - "POST /policies/{id}/endorsements/{id}/reject — reject endorsement"
    shared_operations:
      - "POST /vendors — create vendor (shared with PlatformAdmin)"
      - "POST /policies/{id}/coverages — add coverage (shared with Policyholder)"
      - "POST /policies/{id}/riders — add rider (shared with Policyholder)"
      - "POST /policies/{id}/certificates — request certificate (shared with Policyholder)"
      - "GET endpoints (read-only) shared with all roles"

  - name: Policyholder
    description: "The insured. Creates and owns a Policy, adds event profiles/coverages/riders/certificate requests, pays, cancels, files claims, uploads documents, resubmits."
    identity: opaque
    exclusive_operations:
      - "POST /policies — create policy"
      - "POST /policies/{id}/event-profiles — add event profile"
      - "POST /policies/{id}/pay — pay premium"
      - "POST /policies/{id}/cancel — cancel policy"
      - "POST /policies/{id}/claims — file claim"
      - "POST /policies/{id}/claims/{id}/documents — upload document"
      - "POST /policies/{id}/claims/{id}/resubmit — resubmit claim"
    shared_operations:
      - "POST /policies/{id}/coverages — add coverage (shared with UnderwritingAgent)"
      - "POST /policies/{id}/riders — add rider (shared with UnderwritingAgent)"
      - "POST /policies/{id}/certificates — request certificate (shared with UnderwritingAgent)"
      - "GET endpoints (read-only) shared with all roles"

  - name: ClaimsAdjuster
    description: "Adjudicates claims: request-info, approve, deny, pay."
    identity: opaque
    exclusive_operations:
      - "POST /policies/{id}/claims/{id}/request-info — request info"
      - "POST /policies/{id}/claims/{id}/approve — approve claim"
      - "POST /policies/{id}/claims/{id}/deny — deny claim"
      - "POST /policies/{id}/claims/{id}/pay — pay claim"
    shared_operations:
      - "GET endpoints (read-only) shared with all roles"
