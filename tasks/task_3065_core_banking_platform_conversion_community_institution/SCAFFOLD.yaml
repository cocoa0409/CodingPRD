    side_effects: ["status -> OPEN"]
  - method: POST
    path: "/api/v1/defects/{did}/resolve"
    description: "Resolve a defect; stamps resolved_at, computes credit_eligible, cascades linked ancillary system"
    roles: [VendorTriageLead]
    code: 200
    input: []
    output: Defect
    side_effects: ["status -> RESOLVED", "resolved_at set", "credit_eligible computed", "linked system VERIFIED->INTEGRATING or RETEST_PASSED->FAILED"]
  - method: POST
    path: "/api/v1/defects/{did}/reopen"
    description: "Reopen a resolved defect; cascades OPEN credit claims to DISPUTED"
    roles: [ProjectManager]
    code: 200
    input: []
    output: Defect
    side_effects: ["status -> REOPENED", "reopened_count += 1", "credit_eligible := false", "OPEN ServiceCredit claims referencing it -> DISPUTED"]
  - method: POST
    path: "/api/v1/defects/{did}/close"
    description: "Close a resolved defect not referenced by any OPEN claim"
    roles: [ProjectManager]
    code: 200
    input: []
    output: Defect
    side_effects: ["status -> CLOSED"]

  # --- ServiceCredit ---
  - method: POST
    path: "/api/v1/service-credits"
    description: "Create a monthly vendor service credit claim over credit-eligible defects"
    roles: [FinanceController]
    code: 201
    input: [project_id, month, defect_ids]
    output: ServiceCredit
    side_effects: ["claim_status OPEN", "breach_hours and credit_cents computed"]
  - method: GET
    path: "/api/v1/service-credits"
    description: "List service credit claims"
    roles: [ProjectManager, VendorTriageLead, FinanceController]
    code: 200
    input: [project_id, "claim_status?", "month?", "limit?", "offset?"]
    output: "ServiceCredit[]"
    side_effects: []
  - method: GET
    path: "/api/v1/service-credits/{scid}"
    description: "Get a service credit claim"
    roles: [ProjectManager, VendorTriageLead, FinanceController]
    code: 200
    input: []
    output: ServiceCredit
    side_effects: []
  - method: POST
    path: "/api/v1/service-credits/{scid}/approve"
    description: "Approve an OPEN claim"
    roles: [FinanceController]
    code: 200
    input: []
    output: ServiceCredit
    side_effects: ["claim_status -> APPROVED"]
  - method: POST
    path: "/api/v1/service-credits/{scid}/pay"
    description: "Pay an approved claim (segregation of duties: approver cannot pay)"
    roles: [FinanceController]
    code: 200
    input: []
    output: ServiceCredit
    side_effects: ["claim_status -> PAID"]
  - method: POST
    path: "/api/v1/service-credits/{scid}/dispute"
    description: "Vendor disputes an OPEN or APPROVED claim"
    roles: [VendorTriageLead]
    code: 200
    input: [dispute_note]
    output: ServiceCredit
    side_effects: ["claim_status -> DISPUTED"]
  - method: POST
    path: "/api/v1/service-credits/{scid}/reopen"
    description: "Reopen a disputed claim; recomputes credit"
    roles: [FinanceController]
    code: 200
    input: []
    output: ServiceCredit
    side_effects: ["claim_status -> OPEN", "credit_cents recomputed"]
  - method: POST
    path: "/api/v1/service-credits/{scid}/reject"
    description: "Reject an OPEN claim whose defects lost eligibility"
    roles: [FinanceController]
    code: 200
    input: []
    output: ServiceCredit
    side_effects: ["claim_status -> REJECTED"]

  # --- CutoverPlan / CutoverTask ---
  - method: GET
    path: "/api/v1/plans"
    description: "List cutover plans of a project (0 or 1)"
    roles: [ProjectManager, ConversionEngineer, OperationsLead]
    code: 200
    input: [project_id]
    output: "CutoverPlan[]"
    side_effects: []
  - method: GET
    path: "/api/v1/plans/{pid}"
    description: "Get a cutover plan"
    roles: [ProjectManager, ConversionEngineer, OperationsLead]
    code: 200
    input: []
    output: CutoverPlan
    side_effects: []
  - method: POST
    path: "/api/v1/tasks"
    description: "Add a task to a DRAFT cutover plan"
    roles: [ProjectManager]
    code: 201
    input: [plan_id, task_name, sequence, conversion_window_start, conversion_window_end, owner_role, "depends_on_task_id?"]
    output: CutoverTask
    side_effects: ["status PENDING"]
  - method: GET
    path: "/api/v1/tasks"
    description: "List tasks of a plan"
    roles: [ProjectManager, ConversionEngineer, OperationsLead]
    code: 200
    input: [plan_id, "status?", "depends_on_task_id?", "limit?", "offset?"]
    output: "CutoverTask[]"
    side_effects: []
  - method: GET
    path: "/api/v1/tasks/{tid}"
    description: "Get a cutover task"
    roles: [ProjectManager, ConversionEngineer, OperationsLead]
    code: 200
    input: []
    output: CutoverTask
    side_effects: []
  - method: POST
    path: "/api/v1/plans/{pid}/schedule"
    description: "Validate window geometry and schedule the plan"
    roles: [ProjectManager]
    code: 200
    input: []
    output: CutoverPlan
    side_effects: ["status -> SCHEDULED"]
  - method: POST
    path: "/api/v1/plans/{pid}/go"
    description: "Declare GO at/after the go_no_go checkpoint"
    roles: [ProjectManager]
    code: 200
    input: []
    output: CutoverPlan
    side_effects: ["status -> GO"]
  - method: POST
    path: "/api/v1/plans/{pid}/rollback"
    description: "Roll back the cutover: tasks skipped, accounts blocked, project back to MOCK_CONVERSION"
    roles: [ProjectManager]
    code: 200
    input: []
    output: CutoverPlan
    side_effects: ["status -> ROLLED_BACK", "PENDING/RUNNING tasks -> SKIPPED", "accounts {MAPPED,CLEARED,EXCEPTION} -> BLOCKED", "project -> MOCK_CONVERSION", "baseline flag cleared"]
  - method: POST
    path: "/api/v1/tasks/{tid}/start"
    description: "Start a pending task within its conversion window after its dependency completed"
    roles: [ConversionEngineer, OperationsLead]
    code: 200
    input: []
    output: CutoverTask
    side_effects: ["status -> RUNNING"]
  - method: POST
    path: "/api/v1/tasks/{tid}/complete"
    description: "Complete a running task (window end + 30 minute grace)"
    roles: [ConversionEngineer, OperationsLead]
    code: 200
    input: []
    output: CutoverTask
    side_effects: ["status -> COMPLETE", "duration_minutes computed"]
  - method: POST
    path: "/api/v1/tasks/{tid}/fail"
    description: "Fail a running task"
    roles: [ConversionEngineer, OperationsLead]
    code: 200
    input: []
    output: CutoverTask
    side_effects: ["status -> FAILED"]


  # --- FK reverse-reachability sub-resource GETs ---
  - method: GET
    path: "/api/v1/product-types/{ptid}/accounts"
    description: "List accounts governed by a product type"
    roles: [ProjectManager, ConversionEngineer]
    code: 200
    input: ["limit?", "offset?"]
    output: "Account[]"
    side_effects: []
  - method: GET
    path: "/api/v1/gl-accounts/{gid}/accounts"
    description: "List accounts mapped to a GL account"
    roles: [ProjectManager, ConversionEngineer, FinanceController]
    code: 200
    input: ["limit?", "offset?"]
    output: "Account[]"
    side_effects: []
  - method: GET
    path: "/api/v1/staff/{id}/enrollments"
    description: "List enrollments of a staff member across sessions"
    roles: [ProjectManager, Trainer]
    code: 200
    input: ["limit?", "offset?"]
    output: "Enrollment[]"
    side_effects: []
  - method: GET
    path: "/api/v1/accounts/{aid}/customer-comms"
    description: "List customer communications for an account"
    roles: [ProjectManager, CommunicationsOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: "CustomerComm[]"
    side_effects: []
  - method: GET
    path: "/api/v1/ancillary-systems/{sid}/defects"
    description: "List defects linked to an ancillary system"
    roles: [ProjectManager, OperationsLead, VendorTriageLead]
    code: 200
    input: ["limit?", "offset?"]
    output: "Defect[]"
    side_effects: []
  - method: GET
    path: "/api/v1/tasks/{tid}/dependents"
    description: "List tasks that depend on a given task"
    roles: [ProjectManager, ConversionEngineer, OperationsLead]
    code: 200
    input: ["limit?", "offset?"]
    output: "CutoverTask[]"
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or unknown X-User-Role / X-User-ID headers" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted to call this endpoint" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id does not exist, or nested resource does not belong to the path parent" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body: missing required field, wrong type, or invalid enum value" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource state does not permit the requested transition" }
  - { id: ERR_OUTSIDE_WINDOW, http: 409, condition: "Clock is outside the required window (training window, cutover conversion window + grace, comm send time, plan window geometry)" }
  - { id: ERR_INVALID_REFERENCE, http: 422, condition: "Cross-entity reference invalid: kind mismatch, GL in another project, forward/self task dependency, linked system in another project" }
  - { id: ERR_INVARIANT_VIOLATION, http: 422, condition: "Entity invariant broken: illegal accrual/rate for kind, session capacity exceeded, duplicate enrollment, second CutoverPlan, second OPEN claim for the same month" }
  - { id: ERR_DUPLICATE, http: 409, condition: "Per-project uniqueness violated (product_code, gl_code, run_label, employee_code, legacy_account_number, ancillary system name)" }
  - { id: ERR_CREDIT_INELIGIBLE, http: 422, condition: "A referenced defect is not credit_eligible, its deadline month differs from the claim month, it is already in an OPEN claim, or approve/pay finds a defect no longer RESOLVED" }
  - { id: ERR_PHASE_GATE, http: 409, condition: "Project phase gate failed (advance/plan-cutover/go-live/close preconditions)" }
  - { id: ERR_FROZEN, http: 409, condition: "File freeze in effect: account mutation blocked while project is CUTOVER_PLANNED or LIVE" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Same user attempted both sides of a segregated pair (report/triage, approve/pay)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_project_version does not match the project's current version (OCC)" }
  - { id: ERR_RUN_IN_PROGRESS, http: 409, condition: "Another MockRun of the project is still RUNNING" }
  - { id: ERR_SESSION_OVERLAP, http: 409, condition: "Training session overlaps an existing non-CANCELLED session of the same branch (half-open interval semantics; touching endpoints allowed)" }
  - { id: ERR_FREEZE_CHANNEL_BUSY, http: 409, condition: "file_freeze_start falls inside another project's active cutover conversion window plus its 30-minute completion grace (aggregate capacity exclusion across projects)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ProjectManager
    description: "Institution-side conversion project manager; owns phase advancement, cutover planning, go/no-go, rollback, defect reopen/close, and the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /api/v1/conversions — create project"
      - "POST /api/v1/conversions/{id}/advance — advance phase"
      - "POST /api/v1/conversions/{id}/plan-cutover — plan cutover"
      - "POST /api/v1/conversions/{id}/go-live — go live"
      - "POST /api/v1/conversions/{id}/close — close project"
      - "POST /api/v1/tasks — add cutover task"
      - "POST /api/v1/plans/{pid}/schedule|go|rollback"
      - "POST /api/v1/defects/{did}/reopen|close"
      - "POST /api/v1/_clock/set_current_utc"
    shared_operations:
      - "GET endpoints across all resources"
      - "POST /api/v1/defects — report defect"
  - name: ConversionEngineer
    description: "Fiserv conversion engineer; owns product parameter design, GL/account mapping, exception clearing, mock runs"
    identity: opaque
    exclusive_operations:
      - "POST /api/v1/product-types and activate/deactivate/retire"
      - "POST /api/v1/gl-accounts"
      - "POST /api/v1/accounts and map/flag-exception/clear-exception"
      - "POST /api/v1/mock-runs and finalize"
    shared_operations:
      - "GET endpoints for projects, products, accounts, GLs, mock runs, cutover plans/tasks"
      - "POST cutover task start/complete/fail when owner_role is CONVERSION_ENGINEER"
  - name: OperationsLead
    description: "Institution operations lead; owns ancillary system reintegration"
    identity: opaque
    exclusive_operations:
      - "POST /api/v1/ancillary-systems and start-integration/verify/fail/retest"
    shared_operations:
      - "GET endpoints for projects, products, accounts, mock runs, ancillary systems, training, cutover"
      - "POST /api/v1/defects — report defect"
      - "POST cutover task start/complete/fail when owner_role is OPERATIONS_LEAD"
  - name: Trainer
    description: "Training coordinator; owns staff registry, sessions, enrollments"
    identity: opaque
    exclusive_operations:
      - "POST /api/v1/training-sessions and start/complete/cancel"
      - "POST /api/v1/staff"
      - "POST enrollments and attend/no-show/cancel"
    shared_operations:
      - "GET endpoints for projects, training sessions, staff, enrollments"
  - name: CommunicationsOfficer
    description: "Customer communications owner; manages waves of customer notices"
    identity: opaque
    exclusive_operations:
      - "POST /api/v1/customer-comms and schedule/send/deliver/fail/resend/cancel"
    shared_operations:
      - "GET endpoints for projects and customer comms"
  - name: VendorTriageLead
    description: "Vendor-side defect triage lead; triages, fixes, resolves defects; disputes credit claims"
    identity: opaque
    exclusive_operations:
      - "POST /api/v1/defects/{did}/triage|start-fix|reject-fix|resolve"
      - "POST /api/v1/service-credits/{scid}/dispute"
    shared_operations:
      - "GET endpoints for defects, service credits, ancillary systems, projects"
  - name: FinanceController
    description: "Institution finance controller; files, approves, reopens, rejects, pays service credit claims"
    identity: opaque
    exclusive_operations:
      - "POST /api/v1/service-credits"
      - "POST /api/v1/service-credits/{scid}/approve|pay|reopen|reject"
    shared_operations:
      - "GET endpoints for GLs, accounts, defects, service credits, projects"
