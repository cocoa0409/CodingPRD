            - "data.error_id == ERR_MEMBER_INELIGIBLE"
            - "TripRequest.${trip_id}.trip_status == DRAFT"

      - name: claim_requires_trip_completed
        grounds:
          - state_machines.TripRequest.UNBILLED_to_CLAIMED
          - entities.TripRequest.fields.trip_status
          - validations[priority=5]
        distinguishing_aspect: |
          The billing axis transition UNBILLED->CLAIMED depends on the same
          TripRequest's trip_status == COMPLETED (a within-entity cross-axis
          dependency, a distinct entity pairing from TripRequest<-Member). Claiming
          an ASSIGNED (not completed) trip fails ERR_INVALID_STATE.
        test_recipe:
          setup:
            - "An AMBULATORY trip ASSIGNED (not yet completed), billing_status UNBILLED."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { now_utc: "2026-03-01T08:00:00Z" }
              as: Coordinator
            - call: "POST /rate-schedules"
              payload: { modality: "AMBULATORY", base_fare_cents: 1500, loaded_rate_cents_per_mile: 120, dwell_free_minutes: 15, dwell_cents_per_minute: 40 }
