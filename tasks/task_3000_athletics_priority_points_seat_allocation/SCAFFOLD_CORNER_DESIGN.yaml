          - state_machines.PointDispute.status.transitions.UNDER_REVIEW_to_UPHELD
          - entities.Donor.fields.dispute_adjustment_points
        distinguishing_aspect: |
          An UPHELD decision must reconcile immediately (dispute_adjustment_points
          7.50 lifting certified_points from 15.00 to 22.50 without touching
          certified_base_points), and the subsequent recalculation run must FOLD
          the same adjustment rather than ADD it again — 22.50 both times, not
          30.00. That distinguishes a stored-adjustment design from an
          incremental one.
        test_recipe:
          setup:
            - "Logical clock at 2026-04-01T00:00:00.000Z."
            - "One NON_ALUMNUS INDIVIDUAL Donor with one RECEIVED ATHLETICS_ANNUAL gift of 1000000 cents dated 2026-03-01, scored to 15.00 by a first run."
