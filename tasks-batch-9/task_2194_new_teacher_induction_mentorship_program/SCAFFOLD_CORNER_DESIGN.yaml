              as: ProgramAdmin
              captures: { match_id: $.data.id }
            - call: "POST /mentor-matches/${match_id}/disposition"
              payload: { decision: "ACTIVATE" }
              as: ProgramAdmin
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-08-02T00:00:00Z" }
              as: ProgramAdmin
          assert:
            - "HTTP 200 with data.current_utc == \"2027-08-02T00:00:00Z\""
            - "GET /mentors/${mentor_id} reports certification_status == \"LAPSED\" and suspension_reason == null — a lapse is not a suspension"
            - "GET /mentors/${mentor_id} reports certification_expires_on == \"2027-08-01T00:00:00Z\" (unchanged) and active_caseload_count == 0"
            - "GET /mentor-matches/${match_id} reports match_status == \"SUSPENDED\" and suspended_at == \"2027-08-02T00:00:00Z\""
            - "GET /sites/${site_id} reports active_match_count == 0"
            - "GET /novice-teachers/${novice_id} still reports program_status == \"ACTIVE\" — the cascade stops at MentorMatch"
      - name: contact_log_dispute_resubmit_loop_bounded
        claim_type: cyclic
        grounds: [state_machines.ContactLog.transitions.DISPUTED_to_SUBMITTED, "errors[ERR_RESUBMIT_LIMIT_REACHED]"]
        excluded_because:
          difficulty_instance: non_linear_state_machine / contact_log_dispute_resubmit_cycle_bounded
          rationale: "The SUBMITTED->DISPUTED->SUBMITTED loop and its MAX_CONTACT_LOG_RESUBMITS=2 termination condition are walked exhaustively by the named §1.8 instance, including the third-resubmit refusal."

      - name: observation_phase_and_feedback_dimensions_are_independent
        claim_type: parallel
        grounds: [state_machines.ObservationCycle.transitions.POST_CONFERENCE_to_DOCUMENTED, entities.ObservationCycle.fields.feedback_review_status]
        excluded_because:
          difficulty_instance: non_linear_state_machine / observation_parallel_dimensions_with_join
          rationale: "The two independent ObservationCycle dimensions and their DOCUMENTED join point are exercised end-to-end, including the premature-advance refusal, by the named §1.8 instance."

      - name: packet_submit_guarded_by_cohort_and_licence_state
        claim_type: guarded_transitions
        grounds: [state_machines.CompletionCertification.transitions.ASSEMBLING_to_SUBMITTED_TO_STATE, "errors[ERR_COHORT_STATE_INVALID]"]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / packet_submission_requires_closed_cohort
          rationale: "Both cross-entity guards on the SUBMIT transition — Cohort.status == CLOSED and novice.license_advancement_status == RECOMMENDED — are separated and asserted by the named §1.8 instance."

      - name: mentor_suspension_cascades_down_to_matches_and_cycles
        claim_type: cascade_down
        grounds: [state_machines.Mentor.transitions.CERTIFIED_to_SUSPENDED, state_machines.MentorMatch.transitions.ACTIVE_to_SUSPENDED]
        excluded_because:
          difficulty_instance: transitive_cascade / mentor_suspension_two_hop_cascade
          rationale: "The parent-to-child cascade and its selectivity (only non-terminal ObservationCycle rows move) are asserted hop by hop by the named §1.8 instance."

      - name: prerequisite_attainment_unlocks_locked_dependent_row
        claim_type: bubble_up
        grounds: [state_machines.MilestoneAttainment.transitions.IN_PROGRESS_to_ATTAINED, state_machines.MilestoneAttainment.transitions.LOCKED_to_IN_PROGRESS, "endpoints[POST /milestone-attainments/{id}/decision]"]
        distinguishing_aspect: "Attaining a prerequisite must unlock exactly the dependent rows that name it: the LOCKED row for IND_M2 becomes IN_PROGRESS in the same request, while the novice's counters are frozen into the attained row's snapshot fields at their current zero values."
        test_recipe:
          setup: ["Two Milestones exist — IND_M1 at sequence_index 1 with no prerequisite, and IND_M2 at sequence_index 2 whose prerequisite_milestone_id is IND_M1; both carry zero evidence requirements and neither gates the licence recommendation. A novice created afterwards therefore holds an IN_PROGRESS attainment row for IND_M1 and a LOCKED row for IND_M2. The logical clock is at its startup default 2026-08-01T00:00:00Z."]
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Northgate High", site_code: "NG-001", region_code: "NORTH", mentor_slot_cap: 6 }
              as: ProgramAdmin
              captures: { site_id: $.data.id }
            - call: "POST /cohorts"
              payload: { name: "Induction 2026-27", program_year: 2026, region_code: "NORTH", seminar_sessions_required: 1 }
              as: ProgramAdmin
              captures: { cohort_id: $.data.id }
            - call: "POST /milestones"
              payload: { code: "IND_M1", title: "Orientation complete", sequence_index: 1, required_contact_minutes: 0, required_observation_cycles: 0, required_credited_seminars: 0, license_stage_unlocked: "PROVISIONAL", gates_license_recommendation: false }
              as: ProgramAdmin
              captures: { m1_id: $.data.id }
            - call: "POST /milestones"
              payload: { code: "IND_M2", title: "Mid-year review complete", sequence_index: 2, required_contact_minutes: 0, required_observation_cycles: 0, required_credited_seminars: 0, license_stage_unlocked: "PROVISIONAL", gates_license_recommendation: false, prerequisite_milestone_id: "${m1_id}" }
              as: ProgramAdmin
              captures: { m2_id: $.data.id }
            - call: "POST /novice-teachers"
              payload: { site_id: "${site_id}", cohort_id: "${cohort_id}", full_name: "Dana Pike", subject_area: "MATH", induction_year: 1 }
              as: ProgramAdmin
              captures: { novice_id: $.data.id }
            - call: "GET /milestone-attainments?novice_id=${novice_id}&milestone_id=${m1_id}"
              payload: {}
              as: ProgramAdmin
              captures: { a1_id: "$.data[0].id" }
            - call: "GET /milestone-attainments?novice_id=${novice_id}&milestone_id=${m2_id}"
              payload: {}
              as: ProgramAdmin
              captures: { a2_id: "$.data[0].id" }
          trigger:
            - call: "POST /milestone-attainments/${a1_id}/decision"
              payload: { decision: "ATTAIN", evidence_note: "Orientation roster and signed acknowledgement on file" }
              as: ProgramAdmin
              as_user_id: "u-program-office-1"
          assert:
