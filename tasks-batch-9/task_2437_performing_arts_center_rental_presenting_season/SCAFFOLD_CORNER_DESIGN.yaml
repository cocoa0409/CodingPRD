      - name: rigging_near_limit_at_exactly_ninety_percent_clears_without_equipment
        claim_type: threshold_boundary
        grounds:
          - "§1.3 technical_capability_assessment: near_limit_threshold_kg = round_half_up(0.90 * rigging_capacity_kg), comparison is `>=`."
          - "§1.4 priority 77: every gap OTHER than RIGGING_NEAR_LIMIT must be covered by a RESERVED equipment line before clearing."
          - "§1.2 TechRider GAP_IDENTIFIED -> CLEARED."
        distinguishing_aspect: >-
          Sits one kilogram either side of the 4500 kg threshold on a 5000 kg
          hall and pairs the boundary with the exemption that only this gap type
          enjoys: a GAP_IDENTIFIED rider whose only gap is RIGGING_NEAR_LIMIT
          clears with additional_equipment_cost_cents still 0 and the deposit
          untouched, which no other gap type permits.
        test_recipe:
          setup:
            - "Grand Hall exists with rigging_capacity_kg 5000, so the near-limit threshold is round_half_up(0.90 * 5000) = 4500 kg."
            - "Rental client 'Meridian Dance Company' (credit A, outstanding 0) exists."
            - "Booking A (Oct 1-3 2026) has a rider at 4499 kg / 200 A / 2 universes that was reviewed to CAPABLE with an empty gap list."
            - "Booking B (Oct 10-12 2026) has a rider at 4500 kg / 200 A / 2 universes still in SUBMITTED; both bookings have facility_fee_cents 700000 and deposit_required_cents 175000 (1 performance day + 1 load-in day, credit A)."
          setup_api_calls:
            - call: "POST /performance-spaces"
              as: CenterAdmin
              payload: { name: "Grand Hall", seat_capacity: 1200, base_facility_fee_cents: 500000, load_in_day_fee_cents: 200000, changeover_buffer_minutes: 120, rigging_capacity_kg: 5000, house_power_amps: 400, dmx_universes: 4 }
              captures: { space_id: "$.data.id" }
            - call: "POST /rental-clients"
              as: RentalManager
              payload: { org_name: "Meridian Dance Company", contact_email: "book@meridian.example", credit_rating: "A", is_nonprofit: false }
              captures: { client_id: "$.data.id" }
            - call: "POST /engagements"
              as: RentalManager
              payload: { engagement_type: "RENTAL", space_id: "${space_id}", rental_client_id: "${client_id}", title: "Booking A", load_in_start_utc: "2026-10-01T08:00:00Z", performance_start_utc: "2026-10-02T19:00:00Z", performance_end_utc: "2026-10-02T22:00:00Z", load_out_end_utc: "2026-10-03T02:00:00Z", performance_day_count: 1, load_in_day_count: 1 }
              captures: { eng_a: "$.data.id" }
            - call: "POST /engagements/${eng_a}/tech-riders"
              as: RentalClientContact
              as_user_id: "${client_id}"
              payload: { submitted_rigging_kg: 4499, requested_power_amps: 200, requested_dmx_universes: 2, requires_orchestra_pit: false }
              captures: { rider_a: "$.data.id" }
            - call: "POST /tech-riders/${rider_a}/review"
              as: TechnicalDirector
            - call: "POST /engagements"
              as: RentalManager
              payload: { engagement_type: "RENTAL", space_id: "${space_id}", rental_client_id: "${client_id}", title: "Booking B", load_in_start_utc: "2026-10-10T08:00:00Z", performance_start_utc: "2026-10-11T19:00:00Z", performance_end_utc: "2026-10-11T22:00:00Z", load_out_end_utc: "2026-10-12T02:00:00Z", performance_day_count: 1, load_in_day_count: 1 }
              captures: { eng_b: "$.data.id" }
            - call: "POST /engagements/${eng_b}/tech-riders"
              as: RentalClientContact
              as_user_id: "${client_id}"
              payload: { submitted_rigging_kg: 4500, requested_power_amps: 200, requested_dmx_universes: 2, requires_orchestra_pit: false }
              captures: { rider_b: "$.data.id" }
          trigger:
            - call: "POST /tech-riders/${rider_b}/review"
              as: TechnicalDirector
            - call: "POST /tech-riders/${rider_b}/clear"
