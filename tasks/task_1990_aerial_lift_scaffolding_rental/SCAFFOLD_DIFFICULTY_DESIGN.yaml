            - call: "POST /customer-accounts"
              payload: { company_name: "Standby Co", contact_email: "ops@standby.example", credit_limit_cents: 100000000 }
              as: BranchManager
              captures: { cust_id: $.data.id }
            - call: "POST /equipment-classes"
              payload: { class_code: "S19S", category: "AERIAL_LIFT", max_working_height_ft: 25, min_rental_days: 1, daily_rate_cents: 14500, weekly_rate_cents: 43500, monthly_rate_cents: 99000, replacement_value_cents: 2500000 }
              as: BranchManager
              captures: { class_id: $.data.id }
            - call: "POST /equipment-units"
              payload: { class_id: "${class_id}", serial_number: "S19S-001", ansi_standard_ref: "ANSI A92.22" }
              as: BranchManager
              captures: { unit1_id: $.data.id }
            - call: "POST /equipment-units"
              payload: { class_id: "${class_id}", serial_number: "S19S-002", ansi_standard_ref: "ANSI A92.22" }
              as: BranchManager
              captures: { unit2_id: $.data.id }
            - call: "POST /rental-contracts"
              payload: { customer_id: "${cust_id}", jobsite_address: "3 Loop Rd", damage_waiver_elected: false }
              as: RentalCoordinator
              captures: { contract_id: $.data.id, cv: $.data.version }
            - call: "POST /rental-lines"
              payload: { contract_id: "${contract_id}", unit_id: "${unit1_id}", requested_start_date: "2026-08-10", requested_end_date: "2026-08-15", required_working_height_ft: 20, expected_contract_version: "${cv}" }
              as: RentalCoordinator
              captures: { l1: $.data.id }
            - call: "GET /rental-contracts/${contract_id}"
              as: RentalCoordinator
              captures: { cv2: $.data.version }
            - call: "POST /rental-lines"
              payload: { contract_id: "${contract_id}", unit_id: "${unit2_id}", requested_start_date: "2026-08-10", requested_end_date: "2026-08-15", required_working_height_ft: 20, expected_contract_version: "${cv2}" }
              as: RentalCoordinator
              captures: { l2: $.data.id }
            - call: "POST /rental-contracts/${contract_id}/activate"
              as: RentalCoordinator
            - call: "POST /delivery-trips"
              payload: { contract_id: "${contract_id}", line_id: "${l1}", trip_type: "DELIVERY", driver_id: "drv-1", planned_start_utc: "2026-08-10T08:00:00Z", planned_end_utc: "2026-08-10T10:00:00Z" }
              as: RentalCoordinator
              captures: { t1: $.data.id }
            - call: "POST /delivery-trips"
              payload: { contract_id: "${contract_id}", line_id: "${l2}", trip_type: "DELIVERY", driver_id: "drv-2", planned_start_utc: "2026-08-10T08:00:00Z", planned_end_utc: "2026-08-10T10:00:00Z" }
              as: RentalCoordinator
              captures: { t2: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
