                payload: { quote_id: "${q1}", opening_ids: ["${o1}", "${o2}"], expected_quote_version: "${qv1}", preferred_vendor_id: "${v1}" }
                as: Franchisee
                as_user_id: "${t1}"
                captures: { ord1: $.data.id, cost: $.data.order_cost_cents }
            trigger:
              - call: "GET /blinds/territories/${t1}"
                as: Franchisee
                as_user_id: "${t1}"
                captures: { net: $.data.net_sales_cents, roy: $.data.royalty_accrued_cents, expo: $.data.open_order_exposure_cents, leads: $.data.open_leads_count, avail: $.data.available_kit_count, onloan: $.data.on_loan_kit_count, lost: $.data.lost_kit_count, chargeback: $.data.remake_chargeback_cents, ver: $.data.version }
              - call: "GET /blinds/territories/${t1}"
                as: Franchisor
                as_user_id: "hq-ops"
