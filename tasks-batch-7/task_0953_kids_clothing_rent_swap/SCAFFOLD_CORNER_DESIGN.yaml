      - name: corner_ccl_occ_stale_member_version_on_credit_application
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[credit-apply-stale-member]", "errors[ERR_STALE_MEMBER_VERSION]", "validations[priority=21]"]
        distinguishing_aspect: "The first application spends credit and advances Member.version; a second strictly-sequential application still carrying the earlier version is rejected with ERR_STALE_MEMBER_VERSION at 412, leaving the second charge untouched."
        test_recipe:
          setup: ["One ACTIVE member with 5000 cents of credit and two open charges of 1000 cents each; the first application has already been made against the PLAN_CHARGE."]
