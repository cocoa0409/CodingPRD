          setup:
            - "Unit UNIT-C24 budget 250000, video disabled; admitted patient age 60; ACTIVE FALL-only order (baseline 1.5, interval 24h, due 2026-08-02T00:00:00Z)."
            - "At the startup default clock an ELOPEMENT_ATTEMPT event is reported (occurred_at 2026-08-01T00:00:00Z), escalated and closed, which re-scores the order to 2.5 with the rolling variant and returns it to ACTIVE without moving last_reassessed_at."
