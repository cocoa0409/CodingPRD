            - call: "POST /pre-anesthesia-evaluations/${eval_id}/day-of-verification"
              payload: { intent: "CLEAR", fasting_solids_last_at: "2026-09-13T20:00:00Z", fasting_clears_last_at: "2026-09-14T06:00:00Z", escort_confirmed: false }
