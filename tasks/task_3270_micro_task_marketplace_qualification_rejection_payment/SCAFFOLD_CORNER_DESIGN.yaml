              payload: { name: "Acme Boundary" }
              as: Anonymous
              captures: { rid: $.data.id }
          trigger:
            - call: "POST /mkt/hits"
              payload: { requester_id: "${rid}", title: "Boundary Probe", reward_cents: 1000, max_assignments: 10, assignment_duration_minutes: 60, time_limit_minutes: 120 }
              as: Requester
              as_user_id: "${rid}"
              captures: { hit1: $.data.id }
          assert:
            - "HIT.${hit1}.funds_required_cents == 11550"
            - "the commission is round_half_up(10000 * 0.15) == 1500, not round_half_up(10000 * 0.20) == 2000"
            - "the fee tier sees pre_fee_cents 11500 < 20000, so fee_per_assignment_cents == 5"

