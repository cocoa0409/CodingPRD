  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_household_version_on_invoice_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[invoice-create-stale-household]", "errors[ERR_STALE_HOUSEHOLD_VERSION]"]
        distinguishing_aspect: "Finalizing an invoice with expected_household_version one behind the current version (a deposit bumped it after capture) returns ERR_STALE_HOUSEHOLD_VERSION (412); the matching version succeeds."
        test_recipe:
          setup: ["A household at version 1 (capture v0=1); then a deposit advances it to version 2; a completed appointment with one RESULTED lab order ready to bill."]
          setup_api_calls:
            - call: "POST /clinic/households"
              payload: { account_name: "Occ" }
              as: PracticeManager
              captures: { hh: $.data.id, hh_v0: $.data.version }
            - call: "POST /clinic/patients"
              payload: { household_id: "${hh}", name: "OccPet", species: "DOG", weight_kg: 10 }
              as: Receptionist
              captures: { pat: $.data.id }
            - call: "POST /clinic/deposits"
              payload: { household_id: "${hh}", amount_cents: 1000, expected_household_version: "${hh_v0}" }
              as: Receptionist
              captures: { hh_v1: $.data.version }
            - call: "POST /clinic/appointments"
              payload: { patient_id: "${pat}", scheduled_start: "2026-08-10T09:00:00Z", scheduled_end: "2026-08-10T10:00:00Z", visit_reason: "Lab" }
              as: Receptionist
              captures: { appt: $.data.id }
            - call: "POST /clinic/appointments/${appt}/transition"
              payload: { action: "check-in" }
              as: Receptionist
            - call: "POST /clinic/appointments/${appt}/transition"
              payload: { action: "begin-exam" }
              as: Veterinarian
            - call: "POST /clinic/lab-orders"
              payload: { appointment_id: "${appt}", order_type: "BLOODWORK", fee_cents: 7000 }
              as: Veterinarian
              captures: { lo: $.data.id }
            - call: "POST /clinic/lab-orders/${lo}/transition"
              payload: { action: "collect" }
              as: Veterinarian
            - call: "POST /clinic/lab-orders/${lo}/transition"
              payload: { action: "result", result_text: "ok" }
              as: Veterinarian
            - call: "POST /clinic/appointments/${appt}/transition"
              payload: { action: "complete" }
              as: Veterinarian
          trigger:
            - call: "POST /clinic/invoices"
              payload: { household_id: "${hh}", appointment_id: "${appt}", expected_household_version: "${hh_v0}" }
              as: PracticeManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_STALE_HOUSEHOLD_VERSION"
            - "http_status == 412"

      - name: deposit_version_increments_each_write
        claim_type: optimistic_concurrency
        grounds: [entities.Household.fields.account_credit_cents, endpoints]
        distinguishing_aspect: "Each deposit POST increments Household.version by 1 and adds to account_credit_cents; a second deposit using the prior (now stale) version is rejected with ERR_STALE_HOUSEHOLD_VERSION (412)."
        test_recipe:
          setup: ["A household at version 1."]
          setup_api_calls:
            - call: "POST /clinic/households"
              payload: { account_name: "Dep2" }
              as: Receptionist
              captures: { hh: $.data.id, hh_v0: $.data.version }
            - call: "POST /clinic/deposits"
              payload: { household_id: "${hh}", amount_cents: 5000, expected_household_version: "${hh_v0}" }
              as: Receptionist
              captures: { hh_v1: $.data.version }
          trigger:
            - call: "POST /clinic/deposits"
              payload: { household_id: "${hh}", amount_cents: 5000, expected_household_version: "${hh_v0}" }
              as: Receptionist
              captures: { err: $.data.error_id }
          assert:
            - "the first deposit set Household.${hh}.account_credit_cents == 5000 and version == 2"
            - "response error_id == ERR_STALE_HOUSEHOLD_VERSION"
            - "http_status == 412"

      - name: derived_lifetime_invoiced_reconciles_after_finalize
        claim_type: derived_field_reconciliation
        grounds: [entities.Household.fields.lifetime_invoiced_cents, calculations.invoice_actual_total]
        distinguishing_aspect: "After finalizing one invoice with actual_total 7000, Household.lifetime_invoiced_cents == 7000 (derived field reconciled from the invoice's actual_total_cents)."
        test_recipe:
          setup: ["A completed appointment with a single RESULTED lab order of 7000; household at its current version captured just before finalize."]
          setup_api_calls:
            - call: "POST /clinic/households"
              payload: { account_name: "Deriv" }
              as: PracticeManager
              captures: { hh: $.data.id }
            - call: "POST /clinic/patients"
              payload: { household_id: "${hh}", name: "DerivPet", species: "CAT", weight_kg: 5 }
