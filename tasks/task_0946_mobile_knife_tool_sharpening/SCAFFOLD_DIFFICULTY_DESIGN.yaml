              as_user_id: "${tech}"
            - call: "POST /sharpening/service-requests/${sr}/bench-intake"
              payload: { bench_day_id: "${bench}" }
              as: Technician
              as_user_id: "${tech}"
            - call: "POST /sharpening/request-items/${item_shear}/assess"
              payload: { assessed_damage_tier: "ROUTINE_HONE" }
              as: Technician
              as_user_id: "${tech}"
            - call: "POST /sharpening/request-items/${item_chef}/assess"
              payload: { assessed_damage_tier: "RE_TIP" }
              as: Technician
              as_user_id: "${tech}"
            - call: "POST /sharpening/request-items/${item_shear}/start-work"
              payload: {}
              as: Technician
              as_user_id: "${tech}"
            - call: "POST /sharpening/request-items/${item_shear}/complete-work"
              payload: {}
              as: Technician
              as_user_id: "${tech}"
            - call: "POST /sharpening/request-items/${item_chef}/start-work"
              payload: {}
              as: Technician
              as_user_id: "${tech}"
            - call: "POST /sharpening/request-items/${item_chef}/complete-work"
              payload: {}
              as: Technician
              as_user_id: "${tech}"
            - call: "POST /sharpening/service-requests/${sr}/deliver"
              payload: {}
              as: Technician
              as_user_id: "${tech}"
          trigger:
            - call: "POST /sharpening/invoices"
              payload: { account_id: "${acct}", service_request_id: "${sr}" }
              as: BillingClerk
              captures: { inv: $.data.id, inv_total: $.data.total_cents }
          assert:
            - "RequestItem.${item_shear}.allowance_applied == true"
            - "RequestItem.${item_shear}.charged_service_cents == 500"
            - "RequestItem.${item_shear}.part_fee_cents == 0"
            - "RequestItem.${item_chef}.allowance_applied == false"
            - "RequestItem.${item_chef}.final_gross_cents == 2025"
            - "RequestItem.${item_chef}.charged_service_cents == 2221"
            - "RequestItem.${item_chef}.part_fee_cents == 400"
            - "Invoice.${inv}.taxable_subtotal_cents == 2721"
            - "Invoice.${inv}.nontaxable_subtotal_cents == 400"
            - "Invoice.${inv}.tax_cents == 197"
            - "Invoice.${inv}.total_cents == 3318"
            - "Subscription.${sub}.allowance_remaining == 0"

      - name: invoice_tax_aggregate_rounding_not_per_line_mode_b
        grounds:
          - calculations.invoice_totals
          - entities.Invoice.fields.tax_cents
          - entities.Invoice.fields.taxable_subtotal_cents
        distinguishing_aspect: |
          Mode (b): the scaffold pins tax as one round_half_up over the aggregate taxable subtotal.
          Two 900-cent SERVICE lines make the two orders disagree by a cent - per-line rounding
          gives 65 + 65 = 130 while the pinned aggregate order gives round_half_up(130.5) = 131 -
          so tax_cents must read 131 and total_cents 1931.
        test_recipe:
          setup:
            - "One CHEF_KNIFE spec with list_price_cents 900."
            - "A non-subscriber PER_VISIT account whose tax_exempt is false."
            - "One delivered VAN_ROUTE request carrying two CHEF_KNIFE items, both ROUTINE_HONE at declaration and at assessment."
