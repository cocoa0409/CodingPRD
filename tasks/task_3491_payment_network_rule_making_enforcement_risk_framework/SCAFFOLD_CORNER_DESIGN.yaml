              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response status is 409 with data.error_id == ERR_PROPOSAL_NOT_EFFECTIVE"

      - name: snapshot_duplicate_period_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=5]
        distinguishing_aspect: "A second compute for the same (participant, period) pair fails 409 ERR_DUPLICATE_RESOURCE — snapshots are frozen at first computation and never recomputed."
        test_recipe:
          setup: ["P1 ACTIVE; the 2026-09 snapshot already computed."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /network/participants"
              payload: { legal_name: "Bank One", participant_type: "ODFI", routing_number: "111000025" }
              as: PlatformAdmin
              captures: { p1: $.data.id }
