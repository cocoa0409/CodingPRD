  - rule_id: priority_pair_validation_conflict
    instances:
      - name: submit_state_check_outranks_cost_in_use_cap_breach
        grounds:
          - validations[priority=40]
          - validations[priority=82]
          - errors.ERR_FORMULA_STATE_INVALID
          - errors.ERR_COST_IN_USE_CAP_EXCEEDED
          - calculations.formula_cost_in_use
          - entities.Formula.fields.cost_stale
        distinguishing_aspect: |
          Category pair state (priority 40) vs business_fiscal (priority 82) on the
          same request. After the solvent is repriced from 1215 to 1500 the APPROVED
          formula carries bench_cost_in_use_cents_per_tonne 81200 against a 74425
          cap, so the fiscal rule at 82 is genuinely violated — but the formula is
          APPROVED, not COSTED, so the state rule at 40 fires first and the response
          must be ERR_FORMULA_STATE_INVALID (409), never ERR_COST_IN_USE_CAP_EXCEEDED
          (422). An implementation that evaluates business rules before state rules
          returns the wrong error_id and the wrong HTTP status.
