          - entities.StateProgram.fields.filing_frequency
          - state_machines.FilingBatch.transitions
        distinguishing_aspect: "The period_key format is validated against the program's filing_frequency at PREPARE, not at creation: a CA (QUARTERLY) batch keyed 2026-08 is accepted as OPEN and only prepare answers 422 ERR_PERIOD_KEY_MALFORMED, leaving due_date null."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; the CA QUARTERLY program on file, one brokerage, and an OPEN FilingBatch on CA keyed 2026-08."
