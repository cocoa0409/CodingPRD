            - call: "POST /hie/participants/${pN_id}/conformance-tests"
              payload: { profile: "ADT_PUBLISHER", scheduled_start: "2026-08-01T00:00:00Z", scheduled_end: "2026-08-01T06:00:00Z" }
              as: HieAdmin
              captures: { ctN1_id: $.data.id, ctN1_attempt: $.data.attempt_number }
            - call: "POST /hie/conformance-tests/${ctN1_id}/results"
              payload: { assertions_total: 200, assertions_passed: 189, failure_categories: ["ADT_SEMANTICS"] }
              as: HieAdmin
            - call: "POST /hie/conformance-tests/${ctN1_id}/waiver"
              payload: { waiver_reason: "Interface engine upgrade already contracted; publisher gap accepted for one quarter." }
