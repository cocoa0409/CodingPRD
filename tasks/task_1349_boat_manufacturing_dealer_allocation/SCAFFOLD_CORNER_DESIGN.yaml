      - name: dual_variant_carrying_actual_vs_seasonal_off_peak
        claim_type: dual_variant_calculation
        grounds: ["calculations.carrying_cost_accrual"]
        distinguishing_aspect: "OFF_PEAK season factor 0.60 yields seasonal < actual: 10 days x 750 = 7500 actual vs rhu(7500*0.60)=4500 seasonal — proves variant divergence in the OTHER direction from the PEAK instance in §1.8."
