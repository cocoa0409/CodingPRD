      - name: route_cancel_with_collected_stop_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.CollectionRoute.IN_PROGRESS_to_CANCELLED, "errors[ERR_ROUTE_HAS_COLLECTED_STOPS]"]
        distinguishing_aspect: "Manual cancel is blocked while a stop is COLLECTED; after voiding the stop the cancel succeeds and cascades."
        test_recipe:
          setup: ["plant; supplier + agreement (base 10000, 2/lb, 100/mi); route DISPATCHED; stop ARRIVED then COLLECTED (actual 5000 lbs, 20 mi)"]
          setup_api_calls:
