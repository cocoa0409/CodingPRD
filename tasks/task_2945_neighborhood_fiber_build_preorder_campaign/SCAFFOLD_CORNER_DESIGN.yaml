      - name: build_zone_parallel_dimensions_move_independently
        claim_type: parallel
        grounds:
          - state_machines.BuildZone.campaign_status
          - state_machines.BuildZone.construction_status
        excluded_because:
          difficulty_instance: non_linear_state_machine / build_zone_parallel_campaign_and_construction_dimensions
          rationale: "That instance walks both dimensions in one chain and asserts campaign_status stays QUALIFIED across the SUSPENDED detour."

      - name: mdu_agreement_cycles_back_into_sent
        claim_type: cyclic
        grounds:
          - state_machines.MduOwnerAgreement.transitions.COUNTERED_to_SENT
        excluded_because:
          difficulty_instance: non_linear_state_machine / mdu_agreement_counter_offer_cycle_returns_to_sent
          rationale: "The loop, its offer_round bookkeeping and its termination condition are all asserted there."

      - name: qualification_run_cascades_down_to_children
        claim_type: Cascade down
        grounds:
          - state_machines.BuildZone.campaign_status.PREREG_OPEN_to_NOT_QUALIFIED
        excluded_because:
          difficulty_instance: transitive_cascade / not_qualified_run_cascades_zone_preorder_deposit_ledger_account
          rationale: "Zone -> preorder -> deposit -> ledger -> account is asserted hop by hop there."

      - name: pole_denial_adjusts_appointments_and_crew_cross_entity
        claim_type: Cross-entity
        grounds:
          - state_machines.PoleAttachmentRequest.status.SURVEYED_to_DENIED
        excluded_because:
          difficulty_instance: transitive_cascade / pole_denial_cascades_zone_suspend_appointment_cancel_crew_release
          rationale: "Appointment cancellation and crew-minute release from a pole decision are asserted there."

      - name: appointment_cancellation_compensates_crew_reservation
        claim_type: Compensation
        grounds:
          - state_machines.InstallAppointment.status.SCHEDULED_to_CANCELLED
        excluded_because:
