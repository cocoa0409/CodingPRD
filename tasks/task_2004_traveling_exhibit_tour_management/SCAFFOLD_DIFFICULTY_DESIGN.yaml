              captures: { tour_v: $.data.version }
            - call: "POST /tours/${tour_id}/stops"
              payload: { venue_id: "${venue_id}", install_start: "2026-09-01T00:00:00Z", open_date: "2026-09-03T00:00:00Z", close_date: "2026-10-03T00:00:00Z", teardown_end: "2026-10-06T00:00:00Z", projected_attendance: 1000, expected_tour_version: "${tour_v}" }
              as: TourManager
              captures: { stop_id: $.data.id }
            - call: "POST /tours/${tour_id}/certificates"
              payload: { tour_stop_id: "${stop_id}", insurer_name: "Axis", coverage_cents: 2000000, effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-11-01T00:00:00Z" }
              as: Insurer
            - call: "POST /tours/${tour_id}/shipments"
              payload: { origin_stop_id: null, destination_stop_id: "${stop_id}", depart_at: "2026-08-20T00:00:00Z", arrive_at: "2026-08-28T00:00:00Z", carrier_name: "Carrier X", crate_ids: ["${crate_id}"] }
              as: TourManager
              captures: { ship_id: $.data.id }
            - call: "POST /tours/${tour_id}/shipments/${ship_id}/transition"
              payload: { action: "DISPATCH" }
              as: Shipper
            - call: "POST /tours/${tour_id}/shipments/${ship_id}/transition"
              payload: { action: "DEPART" }
              as: Shipper
            - call: "POST /tours/${tour_id}/shipments/${ship_id}/transition"
              payload: { action: "RECEIVE" }
              as: Registrar
            - call: "POST /tours/${tour_id}/shipments/${ship_id}/reports"
              payload: { crate_id: "${crate_id}", inspector_name: "Reg", phase: "UNPACK", surface_score: 50, structural_score: 40, seal_intact: true }
