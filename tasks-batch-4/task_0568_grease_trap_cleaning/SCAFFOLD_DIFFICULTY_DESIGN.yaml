  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: technician_half_open_overlap
        grounds:
          - state_machines.WorkOrder.SCHEDULED_to_DISPATCHED
          - validations[priority=9]
        distinguishing_aspect: |
          On the Technician resource, [planned_start, planned_end) is half-open: a 11:00-13:00 window
          overlaps a dispatched 10:00-12:00 window (ERR_TECHNICIAN_SCHEDULE_CONFLICT), but a 12:00-14:00
          window abutting at the 12:00 endpoint (gap==0) is allowed.
        test_recipe:
          setup:
            - "One BASIC technician; three grease-trap equipment (eq1/eq2/eq3) at one site"
            - "WO1 (eq1, 10:00-12:00) dispatched to the technician"
          setup_api_calls:
            - call: "POST /customers"
              payload: { business_name: "Overlap Osteria", billing_email: "oo@x.com" }
              as: Admin
              captures: { cust_id: $.data.id }
            - call: "POST /sites"
              payload: { customer_id: "${cust_id}", address: "12 Ovl Rd", municipality_code: "MUNI-A", permit_number: "P-12" }
