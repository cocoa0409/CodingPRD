# =============================================================================
# 1.9 Scaffold Corner Design -- task 2923 crash preventability review and
# liability claim handling.
#
# Breadth probe over SCAFFOLD.yaml sections 1.1-1.7, walked against
# references/claim-extraction-guide.md. `section:` values are the guide's nine
# sections; `claim_type:` values are the guide's per-section row labels.
#
# Fixed actors (same ids as SCAFFOLD_DIFFICULTY_DESIGN.yaml):
#   sa-001   SafetyAdmin        disp-001 Dispatcher
#   sm-001   SafetyManager (decides)     sm-002 SafetyManager (grants appeals)
#   cm-001 / cm-002 / cm-003    CommitteeMember
#   adj-001  ClaimsAdjuster     cmgr-001 ClaimsManager      aud-001 Auditor
# Logical clock starts at 2026-08-01T00:00:00Z unless a recipe moves it.
# Hardcoded UUIDs of the form 00000000-0000-4000-8000-0000000000NN are
# deliberately absent from the database.
# =============================================================================
scaffold_corner_design:

  # =========================================================================
  - section: entities
    instances:

      - name: terminal_creation_returns_all_declared_fields_with_defaults
        claim_type: creation
        grounds:
          - entities.Terminal
          - endpoints[POST /terminals]
        distinguishing_aspect: "POST /terminals with the four required inputs returns 201 and every declared Terminal field, with all six computed counters at their empty-database values."
        test_recipe:
          setup:
            - "Empty database. Clock at 2026-08-01T00:00:00Z."
          setup_api_calls: []
          trigger:
            - call: "POST /terminals"
              payload: { name: "Springfield Terminal", terminal_code: "SPR01", region_code: "OH", annual_miles_millions: 4.0 }
              as: SafetyAdmin
              as_user_id: "sa-001"
              captures: { t_id: $.data.id, t_ver: $.data.version, act: $.data.active_driver_count, sus: $.data.suspended_driver_count, staff: $.data.staffing_posture, pc: $.data.preventable_crash_count, rate: $.data.crash_rate_per_million_miles, tier: $.data.risk_tier, late: $.data.late_filing_count }
          assert:
            - "HTTP 201 with response_type object and the meta envelope carrying api_request_id and api_request_timestamp"
            - "${t_id} is a bare UUID with no type prefix, and ${t_ver} == 1"
            - "name == Springfield Terminal, terminal_code == SPR01, region_code == OH, annual_miles_millions == 4.0 are echoed exactly"
            - "${act} == 0, ${sus} == 0 and ${staff} == OK — staffing_posture is OK when active_driver_count is 0, not a division by zero"
            - "${pc} == 0, ${rate} == 0.000 and ${tier} == STANDARD"
            - "${late} == 0"
            - "created_at and updated_at are equal ISO 8601 UTC instants with three fractional digits"

      - name: crash_retrieval_returns_stored_and_derived_fields
        claim_type: retrieval
        grounds:
          - endpoints[GET /crashes/{id}]
          - entities.Crash
          - calculations.crash_recordability
        distinguishing_aspect: "GET /crashes/{id} returns the fourteen stored intake fields byte-identically plus the recordability fields frozen at intake, proving the read path re-serialises rather than re-derives the frozen ones."
        test_recipe:
          setup:
            - "One Terminal, one Driver, one MODERATE crash with tow_away true and tow_reason DISABLING_DAMAGE, so it is DOT-recordable with a 72-hour window."
          setup_api_calls:
            - call: "POST /terminals"
              payload: { name: "Tiffin Terminal", terminal_code: "TIF01", region_code: "OH", annual_miles_millions: 2.0 }
              as: SafetyAdmin
              as_user_id: "sa-001"
              captures: { t_id: $.data.id }
            - call: "POST /drivers"
              payload: { terminal_id: "${t_id}", employee_code: "D-2001", full_name: "Ida Vaszary", cdl_number: "OH-CDL-2001", hire_date: "2012-04-09" }
              as: SafetyAdmin
              as_user_id: "sa-001"
              captures: { d_id: $.data.id }
            - call: "POST /crashes"
              payload: { driver_id: "${d_id}", terminal_id: "${t_id}", occurred_at: "2026-07-29T16:45:00Z", notified_at: "2026-07-29T17:10:00Z", location_text: "SR-18 at Township Rd 96", severity: "MODERATE", route_class: "REGIONAL", tow_away: true, tow_reason: "DISABLING_DAMAGE", injury_transported_count: 0, fatality_count: 0, hazmat_release: false, mechanical_factor: false, third_party_at_fault: false }
              as: Dispatcher
              as_user_id: "disp-001"
              captures: { c_id: $.data.id }
          trigger:
            - call: "GET /crashes/${c_id}"
              payload: {}
              as: Auditor
              as_user_id: "aud-001"
              captures: { occ: $.data.occurred_at, notif: $.data.notified_at, sev: $.data.severity, tow: $.data.tow_away, reason: $.data.tow_reason, rec: $.data.dot_recordable, codes: $.data.recordability_codes, due: $.data.report_due_at, rs: $.data.reporting_status, ps: $.data.preventability_status, ep: $.data.evidence_posture, ver: $.data.version }
          assert:
            - "HTTP 200; ${occ} == 2026-07-29T16:45:00Z and ${notif} == 2026-07-29T17:10:00Z"
            - "${sev} == MODERATE, ${tow} == true, ${reason} == DISABLING_DAMAGE"
            - "${rec} == true and ${codes} == [DISABLING_TOW]"
            - "${due} == 2026-08-01T16:45:00Z (occurred_at + 72h) and ${rs} == PENDING_FILING"
            - "${ps} == REPORTED and ${ep} == PARTIAL — no evidence item exists, so the required TELEMATICS_SNAPSHOT and FORWARD_CAMERA kinds are unsatisfied"
            - "${ver} == 1 — a read performs no write, even though evidence_posture is re-derived on read"

      - name: crashes_listing_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints[GET /crashes]
          - response_envelope.pagination_fields
        distinguishing_aspect: "GET /crashes with limit 2 over three rows returns 2 items with total_count 3 and has_more true, and the offset-2 page returns the remaining 1 item with has_more false."
        test_recipe:
          setup:
            - "One Terminal, one Driver and three crashes: two MODERATE on route_class REGIONAL and one MINOR on route_class LOCAL."
          setup_api_calls:
            - call: "POST /terminals"
              payload: { name: "Upper Sandusky Terminal", terminal_code: "UPS01", region_code: "OH", annual_miles_millions: 3.0 }
              as: SafetyAdmin
              as_user_id: "sa-001"
              captures: { t_id: $.data.id }
            - call: "POST /drivers"
              payload: { terminal_id: "${t_id}", employee_code: "D-2101", full_name: "Jonas Ferreira", cdl_number: "OH-CDL-2101", hire_date: "2013-01-15" }
              as: SafetyAdmin
              as_user_id: "sa-001"
              captures: { d_id: $.data.id }
            - call: "POST /crashes"
              payload: { driver_id: "${d_id}", terminal_id: "${t_id}", occurred_at: "2026-07-25T08:00:00Z", notified_at: "2026-07-25T08:15:00Z", location_text: "US-30 MM 60", severity: "MODERATE", route_class: "REGIONAL", tow_away: false, tow_reason: "NONE", injury_transported_count: 0, fatality_count: 0, hazmat_release: false, mechanical_factor: false, third_party_at_fault: false }
              as: Dispatcher
              as_user_id: "disp-001"
              captures: { c1: $.data.id }
            - call: "POST /crashes"
              payload: { driver_id: "${d_id}", terminal_id: "${t_id}", occurred_at: "2026-07-26T08:00:00Z", notified_at: "2026-07-26T08:15:00Z", location_text: "US-30 MM 62", severity: "MODERATE", route_class: "REGIONAL", tow_away: false, tow_reason: "NONE", injury_transported_count: 0, fatality_count: 0, hazmat_release: false, mechanical_factor: false, third_party_at_fault: false }
              as: Dispatcher
              as_user_id: "disp-001"
              captures: { c2: $.data.id }
            - call: "POST /crashes"
              payload: { driver_id: "${d_id}", terminal_id: "${t_id}", occurred_at: "2026-07-27T08:00:00Z", notified_at: "2026-07-27T08:15:00Z", location_text: "Dock 4", severity: "MINOR", route_class: "LOCAL", tow_away: false, tow_reason: "NONE", injury_transported_count: 0, fatality_count: 0, hazmat_release: false, mechanical_factor: false, third_party_at_fault: false }
              as: Dispatcher
              as_user_id: "disp-001"
              captures: { c3: $.data.id }
          trigger:
            - call: "GET /crashes"
              payload: { limit: 2, offset: 0 }
              as: Auditor
              as_user_id: "aud-001"
              captures: { page1: $.data }
            - call: "GET /crashes"
              payload: { limit: 2, offset: 2 }
              as: Auditor
              as_user_id: "aud-001"
              captures: { page2: $.data }
            - call: "GET /crashes"
              payload: { severity: "MINOR" }
              as: Auditor
              as_user_id: "aud-001"
              captures: { filtered: $.data }
          assert:
            - "${page1} carries 2 items with total_count 3, limit 2, offset 0 and has_more true; response_type is array"
            - "${page2} carries 1 item with total_count 3, limit 2, offset 2 and has_more false"
            - "The two pages together cover ${c1}, ${c2} and ${c3} exactly once each, with no row repeated across pages"
            - "${filtered} carries exactly 1 item, ${c3}, with total_count 1 — the severity filter is applied before pagination"
            - "GET /crashes with no limit returns all 3 rows with limit 10, the declared pagination default"

      - name: not_found_uuid_on_every_addressable_collection_returns_entity_scoped_error
        claim_type: not_found
        grounds:
          - validations[priority=10]
          - errors[ERR_TERMINAL_NOT_FOUND]
          - errors[ERR_DRIVER_NOT_FOUND]
          - errors[ERR_CRASH_NOT_FOUND]
          - errors[ERR_EVIDENCE_ITEM_NOT_FOUND]
          - errors[ERR_REVIEW_CASE_NOT_FOUND]
          - errors[ERR_CLAIM_NOT_FOUND]
          - errors[ERR_POLICY_LAYER_NOT_FOUND]
          - errors[ERR_DEMAND_NOT_FOUND]
          - errors[ERR_DISCIPLINARY_ACTION_NOT_FOUND]
          - errors[ERR_SUBROGATION_DEMAND_NOT_FOUND]
        distinguishing_aspect: "Each of the ten {id}-addressable collections answers a well-formed but absent UUID with its OWN entity-scoped 404 code, never a generic ERR_NOT_FOUND and never a 500."
        test_recipe:
          setup:
            - "Empty database — no row of any collection exists, so every path parameter below is guaranteed absent."
          setup_api_calls: []
          trigger:
            - call: "GET /terminals/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: Auditor
              as_user_id: "aud-001"
              captures: { e_terminal: $.data.error_id }
            - call: "GET /drivers/00000000-0000-4000-8000-000000000002"
              payload: {}
              as: Auditor
              as_user_id: "aud-001"
              captures: { e_driver: $.data.error_id }
            - call: "GET /crashes/00000000-0000-4000-8000-000000000003"
              payload: {}
              as: Auditor
              as_user_id: "aud-001"
              captures: { e_crash: $.data.error_id }
            - call: "GET /evidence-items/00000000-0000-4000-8000-000000000004"
              payload: {}
              as: Auditor
              as_user_id: "aud-001"
              captures: { e_evidence: $.data.error_id }
            - call: "GET /review-cases/00000000-0000-4000-8000-000000000005"
              payload: {}
              as: Auditor
              as_user_id: "aud-001"
              captures: { e_review: $.data.error_id }
            - call: "GET /claims/00000000-0000-4000-8000-000000000006"
              payload: {}
              as: Auditor
              as_user_id: "aud-001"
              captures: { e_claim: $.data.error_id }
            - call: "GET /policy-layers/00000000-0000-4000-8000-000000000007"
              payload: {}
              as: Auditor
              as_user_id: "aud-001"
              captures: { e_layer: $.data.error_id }
            - call: "GET /demands/00000000-0000-4000-8000-000000000008"
              payload: {}
              as: Auditor
              as_user_id: "aud-001"
              captures: { e_demand: $.data.error_id }
            - call: "GET /disciplinary-actions/00000000-0000-4000-8000-000000000009"
              payload: {}
              as: Auditor
              as_user_id: "aud-001"
              captures: { e_action: $.data.error_id }
            - call: "GET /subrogation-demands/00000000-0000-4000-8000-000000000010"
              payload: {}
              as: Auditor
              as_user_id: "aud-001"
              captures: { e_subro: $.data.error_id }
          assert:
            - "${e_terminal} == ERR_TERMINAL_NOT_FOUND with HTTP 404"
            - "${e_driver} == ERR_DRIVER_NOT_FOUND with HTTP 404"
            - "${e_crash} == ERR_CRASH_NOT_FOUND with HTTP 404"
            - "${e_evidence} == ERR_EVIDENCE_ITEM_NOT_FOUND with HTTP 404"
            - "${e_review} == ERR_REVIEW_CASE_NOT_FOUND with HTTP 404"
            - "${e_claim} == ERR_CLAIM_NOT_FOUND with HTTP 404"
            - "${e_layer} == ERR_POLICY_LAYER_NOT_FOUND with HTTP 404"
            - "${e_demand} == ERR_DEMAND_NOT_FOUND with HTTP 404"
            - "${e_action} == ERR_DISCIPLINARY_ACTION_NOT_FOUND with HTTP 404"
            - "${e_subro} == ERR_SUBROGATION_DEMAND_NOT_FOUND with HTTP 404"
            - "Every response carries response_type error with data.error_id and data.message, and no data payload of the addressed entity"

      - name: driver_creation_missing_required_cdl_number_returns_invalid_request
        claim_type: required_fields
        grounds:
          - validations[priority=5]
          - entities.Driver.fields.cdl_number
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "Omitting the required input cdl_number from POST /drivers is refused with ERR_INVALID_REQUEST (400) and creates no Driver row, and the same call with the field present succeeds."
        test_recipe:
          setup:
            - "One Terminal exists so the FK is valid and cannot be the reason for the refusal."
          setup_api_calls:
            - call: "POST /terminals"
              payload: { name: "Van Wert Terminal", terminal_code: "VAN01", region_code: "OH", annual_miles_millions: 1.5 }
              as: SafetyAdmin
              as_user_id: "sa-001"
              captures: { t_id: $.data.id }
          trigger:
            - call: "POST /drivers"
              payload: { terminal_id: "${t_id}", employee_code: "D-2201", full_name: "Kaya Lindqvist", hire_date: "2016-08-22" }
              as: SafetyAdmin
              as_user_id: "sa-001"
              captures: { err: $.data.error_id }
            - call: "POST /drivers"
              payload: { terminal_id: "${t_id}", employee_code: "D-2201", full_name: "Kaya Lindqvist", cdl_number: "OH-CDL-2201", hire_date: "2016-08-22" }
              as: SafetyAdmin
              as_user_id: "sa-001"
              captures: { d_id: $.data.id }
          assert:
            - "${err} == ERR_INVALID_REQUEST with HTTP 400"
            - "GET /drivers?terminal_id=${t_id} returned no rows immediately after the refusal — the partial payload created nothing"
            - "${d_id} is a new UUID with HTTP 201 once cdl_number is supplied, and employee_code D-2201 is therefore still available after the refusal"
            - "GET /terminals/${t_id} reports active_driver_count 1, so only the successful call moved the counter"

      - name: demand_creation_applies_declared_defaults
        claim_type: defaults
        grounds:
          - entities.Demand.fields.next_round_index
          - entities.Demand.fields.rescission_count
          - entities.Demand.fields.status
          - state_machines.Demand
        distinguishing_aspect: "A Demand created with only its five inputs takes status DEMANDED, next_round_index 1, round_count 0 and rescission_count 0, with every settlement field null — the declared defaults, not client-supplied values."
        test_recipe:
          setup:
            - "One Terminal, one Driver, one MODERATE crash and one Claim on it."
          setup_api_calls:
            - call: "POST /terminals"
              payload: { name: "Wapakoneta Terminal", terminal_code: "WAP01", region_code: "OH", annual_miles_millions: 2.5 }
              as: SafetyAdmin
              as_user_id: "sa-001"
              captures: { t_id: $.data.id }
            - call: "POST /drivers"
              payload: { terminal_id: "${t_id}", employee_code: "D-2301", full_name: "Lars Wembley", cdl_number: "OH-CDL-2301", hire_date: "2010-11-30" }
              as: SafetyAdmin
              as_user_id: "sa-001"
              captures: { d_id: $.data.id }
            - call: "POST /crashes"
              payload: { driver_id: "${d_id}", terminal_id: "${t_id}", occurred_at: "2026-07-29T13:00:00Z", notified_at: "2026-07-29T13:20:00Z", location_text: "SR-501 at Bellefontaine St", severity: "MODERATE", route_class: "REGIONAL", tow_away: false, tow_reason: "NONE", injury_transported_count: 0, fatality_count: 0, hazmat_release: false, mechanical_factor: false, third_party_at_fault: false }
              as: Dispatcher
              as_user_id: "disp-001"
              captures: { c_id: $.data.id }
            - call: "POST /claims"
              payload: { crash_id: "${c_id}", claimant_notice_date: "2026-07-30" }
              as: ClaimsAdjuster
              as_user_id: "adj-001"
              captures: { cl_id: $.data.id, prov: $.data.provisional_reserve_cents, out0: $.data.outstanding_reserve_cents, hs0: $.data.handling_status, rsv0: $.data.reserve_status, note0: $.data.adjuster_note }
          trigger:
            - call: "POST /claims/${cl_id}/demands"
              payload: { claimant_name: "Auglaize Mutual Insurance", claimant_type: "THIRD_PARTY_PROPERTY", demand_amount_cents: 750000, represented_by_counsel: false, demand_received_at: "2026-07-31T10:00:00Z" }
              as: ClaimsAdjuster
              as_user_id: "adj-001"
              captures: { st: $.data.status, nri: $.data.next_round_index, rc: $.data.round_count, resc: $.data.rescission_count, sa: $.data.settled_amount_cents, al: $.data.alae_cents, stot: $.data.settlement_total_cents, sat: $.data.settled_at, sref: $.data.settlement_reference }
          assert:
            - "${note0} == null — the optional adjuster_note defaults to null when omitted"
            - "${hs0} == SETUP and ${rsv0} == PROVISIONAL, the two declared initial states of the Claim's independent dimensions"
            - "${prov} == 2500000 and ${out0} == 2500000 — MODERATE severity base at multiplier 1.00 with no counsel, and outstanding is initialised to the provisional reserve"
            - "${st} == DEMANDED, the declared initial state"
            - "${nri} == 1 and ${rc} == 0 — the next round to mint is 1 and no round exists yet"
            - "${resc} == 0"
            - "${sa}, ${al}, ${stot}, ${sat} and ${sref} are all null"
            - "GET /claims/${cl_id} now reports handling_status NEGOTIATION — the first demand moved the claim, so the demand defaults are observed on a claim that did change state"

      - name: crash_computed_recordability_field_in_request_body_rejected
        claim_type: computed_fields
        grounds:
          - validations[priority=5]
          - entities.Crash.fields.dot_recordable
          - calculations.crash_recordability
        distinguishing_aspect: "A client-supplied dot_recordable is an unknown input for POST /crashes and is refused with ERR_INVALID_REQUEST rather than being honoured, and the server-derived value for the same intake facts is the opposite of what the client tried to assert."
        test_recipe:
          setup:
            - "One Terminal and one Driver. Clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /terminals"
              payload: { name: "Xenia Terminal", terminal_code: "XEN01", region_code: "OH", annual_miles_millions: 2.0 }
              as: SafetyAdmin
              as_user_id: "sa-001"
              captures: { t_id: $.data.id }
            - call: "POST /drivers"
              payload: { terminal_id: "${t_id}", employee_code: "D-2401", full_name: "Mira Osgood", cdl_number: "OH-CDL-2401", hire_date: "2017-05-05" }
              as: SafetyAdmin
              as_user_id: "sa-001"
              captures: { d_id: $.data.id }
          trigger:
            - call: "POST /crashes"
              payload: { driver_id: "${d_id}", terminal_id: "${t_id}", occurred_at: "2026-07-31T07:00:00Z", notified_at: "2026-07-31T07:05:00Z", location_text: "Yard lane 3", severity: "MINOR", route_class: "LOCAL", tow_away: true, tow_reason: "CONVENIENCE", injury_transported_count: 0, fatality_count: 0, hazmat_release: false, mechanical_factor: false, third_party_at_fault: false, dot_recordable: true }
              as: Dispatcher
              as_user_id: "disp-001"
              captures: { err: $.data.error_id }
            - call: "POST /crashes"
              payload: { driver_id: "${d_id}", terminal_id: "${t_id}", occurred_at: "2026-07-31T07:00:00Z", notified_at: "2026-07-31T07:05:00Z", location_text: "Yard lane 3", severity: "MINOR", route_class: "LOCAL", tow_away: true, tow_reason: "CONVENIENCE", injury_transported_count: 0, fatality_count: 0, hazmat_release: false, mechanical_factor: false, third_party_at_fault: false }
              as: Dispatcher
              as_user_id: "disp-001"
              captures: { c_id: $.data.id, rec: $.data.dot_recordable, codes: $.data.recordability_codes, due: $.data.report_due_at, rs: $.data.reporting_status }
          assert:
            - "${err} == ERR_INVALID_REQUEST with HTTP 400 — dot_recordable is a computed field and therefore an unknown input on POST /crashes"
            - "${rec} == false for the identical intake facts, the OPPOSITE of the value the first call tried to supply"
            - "${codes} == [] — a tow_away with tow_reason CONVENIENCE is not a DISABLING_TOW, so no code fires"
            - "${due} == null and ${rs} == NOT_REQUIRED"
            - "GET /crashes returns exactly 1 row, so the rejected call persisted nothing"

      - name: claim_creation_mints_system_fields_and_common_fields
        claim_type: system_fields
        grounds:
          - entities.Claim
          - endpoints[POST /claims]
        distinguishing_aspect: "POST /claims mints id, created_at, updated_at and version 1 server-side and leaves every system field that depends on a later action (counsel_assigned, counsel_assigned_at, litigation_flag, closed_at) at its unset value."
        test_recipe:
          setup:
            - "One Terminal, one Driver and one MODERATE crash with no evidence, so the claim scores 5 (REPORTED) + 5 (PARTIAL) = 10."
          setup_api_calls:
            - call: "POST /terminals"
              payload: { name: "Yellow Springs Terminal", terminal_code: "YSP01", region_code: "OH", annual_miles_millions: 1.0 }
              as: SafetyAdmin
              as_user_id: "sa-001"
              captures: { t_id: $.data.id }
            - call: "POST /drivers"
              payload: { terminal_id: "${t_id}", employee_code: "D-2501", full_name: "Nils Abernathy", cdl_number: "OH-CDL-2501", hire_date: "2009-02-02" }
              as: SafetyAdmin
              as_user_id: "sa-001"
              captures: { d_id: $.data.id }
            - call: "POST /crashes"
              payload: { driver_id: "${d_id}", terminal_id: "${t_id}", occurred_at: "2026-07-30T15:00:00Z", notified_at: "2026-07-30T15:30:00Z", location_text: "US-68 at Corry St", severity: "MODERATE", route_class: "LOCAL", tow_away: false, tow_reason: "NONE", injury_transported_count: 0, fatality_count: 0, hazmat_release: false, mechanical_factor: false, third_party_at_fault: false }
              as: Dispatcher
              as_user_id: "disp-001"
              captures: { c_id: $.data.id }
          trigger:
            - call: "POST /claims"
              payload: { crash_id: "${c_id}", claimant_notice_date: "2026-07-31", adjuster_note: "notice by letter" }
              as: ClaimsAdjuster
              as_user_id: "adj-001"
              captures: { cl_id: $.data.id, ver: $.data.version, score: $.data.litigation_risk_score, mult: $.data.litigation_risk_multiplier, creq: $.data.counsel_required, casg: $.data.counsel_assigned, cat: $.data.counsel_assigned_at, cfirm: $.data.counsel_firm_name, lflag: $.data.litigation_flag, closed: $.data.closed_at, ind: $.data.indemnity_paid_cents, alae: $.data.alae_paid_cents, rel: $.data.reserve_released_cents, subr: $.data.subrogation_recovered_cents, sir: $.data.sir_eroded_cents, insp: $.data.insured_paid_cents, alloc: $.data.layer_allocations, exp: $.data.claim_exposure_cents, inc: $.data.total_incurred_cents }
          assert:
            - "HTTP 201; ${cl_id} is a bare UUID and ${ver} == 1"
            - "${score} == 10, ${mult} == 1.00 and ${creq} == false"
            - "${casg} == false, ${cat} == null, ${cfirm} == null, ${lflag} == false, ${closed} == null"
