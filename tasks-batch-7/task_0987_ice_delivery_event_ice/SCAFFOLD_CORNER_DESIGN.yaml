# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Task 987 — Ice-Delivery & Event-Ice Service
# Breadth probe over §1.1–§1.7 claims NOT covered by SCAFFOLD_DIFFICULTY_DESIGN.
# Lean "mini book" fixture used where an instance only needs BLOCK,PALLET:
#   lines: [BLOCK,PALLET any-tier 21000]; deposit 1500; fee 4900; free >= 20000;
#   discount 500bps >= 50000; surge 1500bps.
# =============================================================================
scaffold_corner_design:
  - section: entities
    instances:
      - name: customer_creation_missing_required_field
        claim_type: required_fields
        grounds: [entities.Customer.fields.account_name, "errors[ERR_INVALID_REQUEST]", "validations[priority=3]"]
        distinguishing_aspect: "POST /customers without account_name fails schema validation with ERR_INVALID_REQUEST (400) before any existence check."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /customers"
              payload: { kind: BAR_RESTAURANT, tier: STANDARD, credit_terms: NET_30, credit_limit_cents: 1000 }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST (missing required account_name)"

      - name: customer_defaults_applied
        claim_type: defaults
        grounds: [entities.Customer.fields.credit_balance_cents, entities.Customer.fields.standing, entities.Customer.fields.outstanding_exposure_cents]
        distinguishing_aspect: "A freshly created customer carries credit_balance_cents 0, outstanding_exposure_cents 0, standing GOOD, version 1 — computed/system defaults without any input."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /customers"
              payload: { account_name: "New Bar", kind: BAR_RESTAURANT, tier: STANDARD, credit_terms: NET_30, credit_limit_cents: 1000 }
              as: PlatformAdmin
              captures: { bal: $.data.credit_balance_cents, expo: $.data.outstanding_exposure_cents, standing: $.data.standing, ver: $.data.version }
          assert:
            - "bal == 0 and expo == 0 and standing == GOOD and ver == 1"

      - name: order_not_found_error_envelope
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]", "validations[priority=4]"]
        distinguishing_aspect: "GET with a well-formed but unknown UUID returns 404 ERR_NOT_FOUND in the standard error envelope (response_type error, data.error_id present)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /orders/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_NOT_FOUND and HTTP status 404 and response_type == error"

      - name: order_create_invalid_enum_rejected
        claim_type: type_constraints
        grounds: [entities.Order.fields.channel, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "An invalid enum member (channel DRONE) is rejected with ERR_INVALID_REQUEST at priority 3 schema validation."
        test_recipe:
          setup: ["depot and customer exist"]
          setup_api_calls:
            - call: "POST /depots"
              payload: { name: "Depot E4", freezer_capacity_pallets: 10 }
              as: PlatformAdmin
              captures: { depot_id: $.data.id }
            - call: "POST /customers"
              payload: { account_name: "E4", kind: EVENT_ORGANIZER, tier: STANDARD, credit_terms: NET_30, credit_limit_cents: 100000 }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /orders"
              payload:
                customer_id: "${cust_id}"
                depot_id: "${depot_id}"
                channel: DRONE
                event_date: "2026-05-10"
                window_start: "10:00"
                window_end: "12:00"
                lines:
                  - { product_form: BLOCK, packaging: PALLET, quantity_units: 1 }
              as: CustomerAgent
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST (channel DRONE is not in {DELIVERY, WILL_CALL})"

      - name: payment_immutable_ledger_row
        claim_type: immutability
        grounds: [entities.Payment]
        distinguishing_aspect: "Payment (common_fields false) is an append-only ledger row: response carries id and created_at but no version/updated_at; with no open invoices the full amount becomes overpayment credited to the wallet."
        test_recipe:
          setup: ["customer exists"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { account_name: "E5", kind: BAR_RESTAURANT, tier: STANDARD, credit_terms: NET_30, credit_limit_cents: 100000 }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /payments"
              payload: { customer_id: "${cust_id}", amount_cents: 5000, method: CASH }
              as: BillingClerk
              as_user_id: clerk_1
              captures: { applied: $.data.applied_cents, over: $.data.overpayment_cents, ver: $.data.version }
            - call: "GET /customers/${cust_id}"
              as: BillingClerk
              as_user_id: clerk_1
              captures: { bal: $.data.credit_balance_cents }
          assert:
            - "applied == 0 and over == 5000 and bal == 5000 (empty eligible invoice set: entire payment overpays to wallet)"
            - "ver is absent from the Payment response (no version field on common_fields:false entities)"

      - name: order_computed_fields_from_lines
        claim_type: computed_fields
        grounds: [entities.Order.fields.pallets_required, entities.OrderLine.fields.unit_weight_lbs, entities.OrderLine.fields.line_total_cents, calculations.order_line_pricing]
        distinguishing_aspect: "Computed line/order fields derive from inputs: 21 CUBE bags hit tier 20-99 (unit 300), unit_weight_lbs 7, line_total 6300, and ceil(21/20) = 2 pallet spaces."
        test_recipe:
          setup: ["depot cap 10; mini+cube book ACTIVE; customer limit 500000"]
          setup_api_calls:
            - call: "POST /depots"
              payload: { name: "Depot E6", freezer_capacity_pallets: 10 }
              as: PlatformAdmin
              captures: { depot_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /price-books"
              payload:
                scope_label: "mini"
                effective_from: "2026-04-01T00:00:00Z"
                lines:
                  - { product_form: CUBE, packaging: BAG, tier_min_units: 1, tier_max_units: 19, unit_price_cents: 350 }
                  - { product_form: CUBE, packaging: BAG, tier_min_units: 20, tier_max_units: 99, unit_price_cents: 300 }
                  - { product_form: BLOCK, packaging: PALLET, tier_min_units: 1, tier_max_units: null, unit_price_cents: 21000 }
                pallet_deposit_cents: 1500
                delivery_fee_cents: 4900
                free_delivery_threshold_cents: 20000
                volume_discount_tiers:
                  - { threshold_cents: 50000, discount_bps: 500 }
                surge_surcharge_bps: 1500
              as: PlatformAdmin
            - call: "POST /customers"
              payload: { account_name: "E6", kind: EVENT_ORGANIZER, tier: STANDARD, credit_terms: NET_30, credit_limit_cents: 500000 }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /orders"
              payload:
                customer_id: "${cust_id}"
                depot_id: "${depot_id}"
                channel: WILL_CALL
                event_date: "2026-05-10"
                window_start: "10:00"
                window_end: "12:00"
                lines:
                  - { product_form: CUBE, packaging: BAG, quantity_units: 21 }
              as: CustomerAgent
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id, pallets: $.data.pallets_required }
          trigger:
            - call: "POST /orders/${order_id}/quote"
              as: CustomerAgent
              as_user_id: "${cust_id}"
              captures: { total: $.data.total_cents }
            - call: "GET /orders/${order_id}/lines"
              as: CustomerAgent
              as_user_id: "${cust_id}"
              captures: { w: "$.data[0].unit_weight_lbs", up: "$.data[0].unit_price_cents", lt: "$.data[0].line_total_cents" }
          assert:
            - "w == 7 and up == 300 and lt == 6300 (tier 20-99 flat rate)"
            - "pallets == 2 (ceil(21/20)) and total == 6300"

  - section: state_machines
    instances:
      - name: quote_from_quoted_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.Order.transitions.DRAFT_to_QUOTED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Re-quoting an already QUOTED order is not a declared transition (reprice is the only QUOTED->QUOTED path) and fails with ERR_INVALID_STATE."
        test_recipe:
          setup: ["depot cap 10; mini book ACTIVE; customer; order QUOTED"]
          setup_api_calls:
            - call: "POST /depots"
              payload: { name: "Depot S7", freezer_capacity_pallets: 10 }
              as: PlatformAdmin
              captures: { depot_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /price-books"
              payload:
                scope_label: "mini"
                effective_from: "2026-04-01T00:00:00Z"
                lines:
                  - { product_form: BLOCK, packaging: PALLET, tier_min_units: 1, tier_max_units: null, unit_price_cents: 21000 }
                pallet_deposit_cents: 1500
                delivery_fee_cents: 4900
                free_delivery_threshold_cents: 20000
                volume_discount_tiers:
                  - { threshold_cents: 50000, discount_bps: 500 }
                surge_surcharge_bps: 1500
              as: PlatformAdmin
            - call: "POST /customers"
              payload: { account_name: "S7", kind: BAR_RESTAURANT, tier: STANDARD, credit_terms: NET_30, credit_limit_cents: 200000 }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /orders"
              payload:
                customer_id: "${cust_id}"
                depot_id: "${depot_id}"
                channel: WILL_CALL
                event_date: "2026-05-10"
                window_start: "10:00"
                window_end: "12:00"
                lines:
                  - { product_form: BLOCK, packaging: PALLET, quantity_units: 1 }
              as: CustomerAgent
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/quote"
              as: CustomerAgent
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /orders/${order_id}/quote"
              as: CustomerAgent
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE (quote requires DRAFT)"

      - name: cancel_cancelled_terminal
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.Order.transitions.DRAFT_to_CANCELLED", "errors[ERR_ALREADY_TERMINAL]", "validations[priority=7]"]
        distinguishing_aspect: "A CANCELLED order is terminal: a second cancel returns ERR_ALREADY_TERMINAL and fires no side effects."
        test_recipe:
          setup: ["depot; customer; DRAFT order (no book needed: cancel from DRAFT has no pricing dependency)"]
          setup_api_calls:
            - call: "POST /depots"
              payload: { name: "Depot S8", freezer_capacity_pallets: 10 }
              as: PlatformAdmin
              captures: { depot_id: $.data.id }
            - call: "POST /customers"
              payload: { account_name: "S8", kind: BAR_RESTAURANT, tier: STANDARD, credit_terms: NET_30, credit_limit_cents: 200000 }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /orders"
              payload:
                customer_id: "${cust_id}"
                depot_id: "${depot_id}"
                channel: WILL_CALL
                event_date: "2026-05-10"
                window_start: "10:00"
                window_end: "12:00"
                lines:
                  - { product_form: BLOCK, packaging: PALLET, quantity_units: 1 }
              as: CustomerAgent
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/cancel"
              as: CustomerAgent
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /orders/${order_id}/cancel"
              as: CustomerAgent
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_ALREADY_TERMINAL"

      - name: stage_before_confirm_rejected
        claim_type: precondition_enforcement
        grounds: ["state_machines.Order.transitions.CONFIRMED_to_STAGED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Staging requires CONFIRMED (a RESERVED hold must exist); staging a QUOTED order fails with ERR_INVALID_STATE."
        test_recipe:
          setup: ["depot cap 10; mini book ACTIVE; customer; order QUOTED"]
          setup_api_calls:
            - call: "POST /depots"
              payload: { name: "Depot S9", freezer_capacity_pallets: 10 }
              as: PlatformAdmin
              captures: { depot_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /price-books"
              payload:
                scope_label: "mini"
                effective_from: "2026-04-01T00:00:00Z"
                lines:
                  - { product_form: BLOCK, packaging: PALLET, tier_min_units: 1, tier_max_units: null, unit_price_cents: 21000 }
                pallet_deposit_cents: 1500
                delivery_fee_cents: 4900
                free_delivery_threshold_cents: 20000
                volume_discount_tiers:
                  - { threshold_cents: 50000, discount_bps: 500 }
                surge_surcharge_bps: 1500
              as: PlatformAdmin
            - call: "POST /customers"
              payload: { account_name: "S9", kind: BAR_RESTAURANT, tier: STANDARD, credit_terms: NET_30, credit_limit_cents: 200000 }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /orders"
              payload:
                customer_id: "${cust_id}"
                depot_id: "${depot_id}"
                channel: WILL_CALL
                event_date: "2026-05-10"
                window_start: "10:00"
                window_end: "12:00"
                lines:
                  - { product_form: BLOCK, packaging: PALLET, quantity_units: 1 }
              as: CustomerAgent
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/quote"
              as: CustomerAgent
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /orders/${order_id}/stage"
              as: DepotManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE"

      - name: pickup_before_ready_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.Order.transitions.READY_FOR_PICKUP_to_PICKED_UP", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "confirm-pickup from STAGED (mark-ready not yet done) fails with ERR_INVALID_STATE."
        test_recipe:
          setup: ["depot cap 10; mini book ACTIVE; customer; WILL_CALL order CONFIRMED then STAGED"]
          setup_api_calls:
            - call: "POST /depots"
              payload: { name: "Depot S10", freezer_capacity_pallets: 10 }
              as: PlatformAdmin
              captures: { depot_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /price-books"
              payload:
                scope_label: "mini"
                effective_from: "2026-04-01T00:00:00Z"
                lines:
                  - { product_form: BLOCK, packaging: PALLET, tier_min_units: 1, tier_max_units: null, unit_price_cents: 21000 }
                pallet_deposit_cents: 1500
                delivery_fee_cents: 4900
                free_delivery_threshold_cents: 20000
                volume_discount_tiers:
                  - { threshold_cents: 50000, discount_bps: 500 }
                surge_surcharge_bps: 1500
              as: PlatformAdmin
            - call: "POST /customers"
              payload: { account_name: "S10", kind: BAR_RESTAURANT, tier: STANDARD, credit_terms: NET_30, credit_limit_cents: 200000 }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /orders"
              payload:
                customer_id: "${cust_id}"
                depot_id: "${depot_id}"
                channel: WILL_CALL
                event_date: "2026-05-10"
                window_start: "10:00"
                window_end: "12:00"
                lines:
                  - { product_form: BLOCK, packaging: PALLET, quantity_units: 1 }
              as: CustomerAgent
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/quote"
              as: CustomerAgent
              as_user_id: "${cust_id}"
            - call: "POST /orders/${order_id}/confirm"
              as: CustomerAgent
              as_user_id: "${cust_id}"
            - call: "POST /orders/${order_id}/stage"
              as: DepotManager
          trigger:
            - call: "POST /orders/${order_id}/confirm-pickup"
              as: CustomerAgent
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE (STAGED is not READY_FOR_PICKUP)"

      - name: cancel_quoted_releases_slot
        claim_type: side_effect_execution
        grounds: ["state_machines.Order.transitions.QUOTED_to_CANCELLED", "state_machines.DeliverySlot.transitions.FULL_to_OPEN", "calculations.slot_reservation_capacity"]
        distinguishing_aspect: "Cancelling a QUOTED order with a slot reservation releases the pallet: reserved 1 -> 0 and the capacity-1 slot flips FULL -> OPEN."
        test_recipe:
          setup: ["depot cap 10; mini book ACTIVE; customer; slot 2026-05-12 cap 1; DELIVERY order QUOTED with slot reserved (slot FULL)"]
          setup_api_calls:
            - call: "POST /depots"
              payload: { name: "Depot S11", freezer_capacity_pallets: 10 }
              as: PlatformAdmin
              captures: { depot_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /price-books"
              payload:
                scope_label: "mini"
                effective_from: "2026-04-01T00:00:00Z"
                lines:
                  - { product_form: BLOCK, packaging: PALLET, tier_min_units: 1, tier_max_units: null, unit_price_cents: 21000 }
                pallet_deposit_cents: 1500
                delivery_fee_cents: 4900
                free_delivery_threshold_cents: 20000
                volume_discount_tiers:
                  - { threshold_cents: 50000, discount_bps: 500 }
                surge_surcharge_bps: 1500
              as: PlatformAdmin
            - call: "POST /customers"
              payload: { account_name: "S11", kind: EVENT_ORGANIZER, tier: STANDARD, credit_terms: NET_30, credit_limit_cents: 200000 }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /delivery-slots"
              payload: { depot_id: "${depot_id}", date: "2026-05-12", window_start: "08:00", window_end: "18:00", capacity_pallets: 1 }
              as: Dispatcher
              captures: { slot_id: $.data.id }
            - call: "POST /orders"
              payload:
                customer_id: "${cust_id}"
                depot_id: "${depot_id}"
                channel: DELIVERY
                event_date: "2026-05-12"
                window_start: "09:00"
                window_end: "11:00"
                lines:
                  - { product_form: BLOCK, packaging: PALLET, quantity_units: 1 }
              as: CustomerAgent
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/quote"
              as: CustomerAgent
              as_user_id: "${cust_id}"
            - call: "POST /orders/${order_id}/reserve-slot"
              payload: { delivery_slot_id: "${slot_id}" }
              as: CustomerAgent
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /orders/${order_id}/cancel"
              as: CustomerAgent
              as_user_id: "${cust_id}"
            - call: "GET /depots/${depot_id}/delivery-slots"
              payload: { date: "2026-05-12" }
              as: Dispatcher
              captures: { slot_status: "$.data[0].status", slot_reserved: "$.data[0].reserved_pallets" }
            - call: "GET /orders/${order_id}"
              as: CustomerAgent
              as_user_id: "${cust_id}"
              captures: { slot_link: $.data.delivery_slot_id }
          assert:
            - "slot_reserved == 0 and slot_status == OPEN (FULL -> OPEN on release)"
            - "slot_link == null (delivery_slot_id cleared)"

      - name: will_call_no_show_sweep
        claim_type: side_effect_execution
        grounds: ["state_machines.Order.transitions.READY_FOR_PICKUP_to_NO_SHOW", "state_machines.ColdStorageHold.transitions.OCCUPIED_to_EXPIRED", "calculations.ops_run_sweeps"]
        distinguishing_aspect: "run_ops no-show sweep: a READY_FOR_PICKUP will-call order whose hold interval_end (window_end + 60min) is behind the clock flips to NO_SHOW and its hold to EXPIRED, freeing the pallet."
        test_recipe:
          setup: ["depot cap 10; mini book ACTIVE; customer; WILL_CALL order event 2026-05-03 window 10:00-12:00 CONFIRMED, STAGED, READY_FOR_PICKUP at clock 2026-05-01"]
          setup_api_calls:
            - call: "POST /depots"
              payload: { name: "Depot S12", freezer_capacity_pallets: 10 }
              as: PlatformAdmin
              captures: { depot_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /price-books"
              payload:
                scope_label: "mini"
                effective_from: "2026-04-01T00:00:00Z"
                lines:
                  - { product_form: BLOCK, packaging: PALLET, tier_min_units: 1, tier_max_units: null, unit_price_cents: 21000 }
                pallet_deposit_cents: 1500
                delivery_fee_cents: 4900
                free_delivery_threshold_cents: 20000
                volume_discount_tiers:
                  - { threshold_cents: 50000, discount_bps: 500 }
                surge_surcharge_bps: 1500
              as: PlatformAdmin
            - call: "POST /customers"
              payload: { account_name: "S12", kind: BAR_RESTAURANT, tier: STANDARD, credit_terms: NET_30, credit_limit_cents: 200000 }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /orders"
              payload:
                customer_id: "${cust_id}"
                depot_id: "${depot_id}"
                channel: WILL_CALL
                event_date: "2026-05-03"
                window_start: "10:00"
                window_end: "12:00"
                lines:
                  - { product_form: BLOCK, packaging: PALLET, quantity_units: 1 }
              as: CustomerAgent
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/quote"
              as: CustomerAgent
              as_user_id: "${cust_id}"
            - call: "POST /orders/${order_id}/confirm"
              as: CustomerAgent
              as_user_id: "${cust_id}"
            - call: "POST /orders/${order_id}/stage"
              as: DepotManager
            - call: "POST /orders/${order_id}/mark-ready"
              as: DepotManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-04T09:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /depots/${depot_id}/run-ops"
              as: PlatformAdmin
              captures: { ns_ids: $.data.no_show_order_ids, exp_holds: $.data.expired_hold_ids }
            - call: "GET /orders/${order_id}"
              as: PlatformAdmin
              captures: { ff: $.data.fulfillment_status, fulfilled: $.data.fulfilled_at }
            - call: "GET /depots/${depot_id}"
              as: PlatformAdmin
              captures: { free_after: $.data.freezer_free_pallets }
          assert:
            - "ns_ids contains order_id and ff == NO_SHOW and fulfilled is non-null (NO_SHOW sets fulfilled_at — still billable)"
