      - name: error_route_at_capacity_stub
        claim_type: Violation to Error
        grounds:
          - "errors[ERR_ROUTE_AT_CAPACITY]"
        excluded_because:
          difficulty_instance: route_capacity_reject_at_exact_max_stops
          rationale: "Triggered directly as the boundary rejection in that §1.8 instance."
      - name: error_truck_route_overlap_stub
        claim_type: Violation to Error
        grounds:
          - "errors[ERR_TRUCK_ROUTE_OVERLAP]"
