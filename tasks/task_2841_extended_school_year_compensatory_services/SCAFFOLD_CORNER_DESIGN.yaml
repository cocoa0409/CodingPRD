  - section: errors
    instances:
      - name: unknown_path_ids_return_the_entity_specific_not_found_error
        claim_type: violation_to_error
        grounds:
          - validations.priority_5_path_not_found
          - errors[ERR_DETERMINATION_NOT_FOUND]
          - errors[ERR_PROGRAM_NOT_FOUND]
          - errors[ERR_PROVIDER_NOT_FOUND]
          - errors[ERR_COMMITMENT_NOT_FOUND]
          - errors[ERR_ASSIGNMENT_NOT_FOUND]
          - errors[ERR_SERVICE_LOG_NOT_FOUND]
          - errors[ERR_AWARD_NOT_FOUND]
          - errors[ERR_MAKEUP_SESSION_NOT_FOUND]
          - errors[ERR_FUND_ALLOCATION_NOT_FOUND]
          - errors[ERR_DUE_PROCESS_RECORD_NOT_FOUND]
        distinguishing_aspect: "Each path parameter maps to its own 404 error_id - ten endpoints, ten distinct error_ids, never a generic ERR_INVALID_REQUEST."
        test_recipe:
          setup:
            - "Empty database apart from the logical clock; every id below is the all-zero UUID literal, which no row can hold."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-06-01T00:00:00Z" }
              as: CaseManager
          trigger:
            - call: "GET /esy/eligibility-determinations/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: CaseManager
            - call: "GET /esy/programs/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ProgramCoordinator
            - call: "GET /esy/providers/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ProgramCoordinator
            - call: "GET /esy/service-commitments/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: CaseManager
            - call: "POST /esy/provider-assignments/00000000-0000-0000-0000-000000000000/release"
              payload: { release_reason: "STAFF_REASSIGNED" }
              as: ProgramCoordinator
            - call: "GET /esy/service-logs/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: CaseManager
            - call: "GET /esy/compensatory-awards/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: CaseManager
            - call: "GET /esy/makeup-sessions/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: CaseManager
            - call: "PATCH /esy/fund-allocations/00000000-0000-0000-0000-000000000000"
              payload: { status: "FROZEN" }
              as: SpedDirector
            - call: "PATCH /esy/due-process-records/00000000-0000-0000-0000-000000000000"
              payload: { status: "RESOLVED" }
              as: ComplianceOfficer
          assert:
            - "Every trigger returns HTTP 404 with response.response_type == \"error\""
            - "Trigger 1: response.data.error_id == ERR_DETERMINATION_NOT_FOUND"
            - "Trigger 2: response.data.error_id == ERR_PROGRAM_NOT_FOUND"
            - "Trigger 3: response.data.error_id == ERR_PROVIDER_NOT_FOUND"
            - "Trigger 4: response.data.error_id == ERR_COMMITMENT_NOT_FOUND"
            - "Trigger 5: response.data.error_id == ERR_ASSIGNMENT_NOT_FOUND"
            - "Trigger 6: response.data.error_id == ERR_SERVICE_LOG_NOT_FOUND"
            - "Trigger 7: response.data.error_id == ERR_AWARD_NOT_FOUND"
            - "Trigger 8: response.data.error_id == ERR_MAKEUP_SESSION_NOT_FOUND"
            - "Trigger 9: response.data.error_id == ERR_FUND_ALLOCATION_NOT_FOUND"
            - "Trigger 10: response.data.error_id == ERR_DUE_PROCESS_RECORD_NOT_FOUND"

      - name: unknown_body_foreign_keys_return_the_referenced_entity_not_found
        claim_type: violation_to_error
        grounds:
          - validations.priority_6_body_fk_not_found
          - errors[ERR_STUDENT_NOT_FOUND]
          - errors[ERR_RUN_NOT_FOUND]
          - entities.ServiceCommitment.fields.transportation_run_id
          - endpoints.POST_/esy/service-commitments
        distinguishing_aspect: "transportation_run_id appears in no URL path, so its 404 is only reachable as a body foreign key: an unknown run id returns ERR_RUN_NOT_FOUND even though the same request also references a NOT_DETERMINED student (priority 6 precedes priority 21)."
        test_recipe:
          setup:
            - "Clock 2027-06-01T00:00:00Z; one PLANNING program P1; Student S2 exists with esy_eligibility_status NOT_DETERMINED; no TransportationRun rows."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-06-01T00:00:00Z" }
              as: CaseManager
            - call: "POST /esy/students"
              payload: { student_number: "S-2841-002", first_name: "Ben", last_name: "Okafor", grade_band: "MS_6_8", primary_disability: "SPECIFIC_LEARNING_DISABILITY", iep_weekly_minutes_total: 250, home_school_code: "MS-014" }
              as: CaseManager
              captures: { s2_id: $.data.id }
            - call: "POST /esy/programs"
              payload: { name: "Summer ESY 2027", school_year: "2026-2027", session_start_date: "2027-06-14", session_end_date: "2027-07-23", instructional_weekdays: ["MON", "TUE", "WED", "THU"], daily_minutes_cap: 90, blackout_dates: ["2027-06-30", "2027-07-05"] }
              as: ProgramCoordinator
              captures: { p1_id: $.data.id }
          trigger:
            - call: "POST /esy/service-commitments"
              payload: { program_id: "${p1_id}", student_id: "00000000-0000-0000-0000-000000000000", service_type: "SPECIALIZED_INSTRUCTION", iep_weekly_minutes: 250, staffing_ratio: "ONE_TO_THREE" }
              as: CaseManager
            - call: "POST /esy/service-commitments"
              payload: { program_id: "${p1_id}", student_id: "${s2_id}", service_type: "SPECIALIZED_INSTRUCTION", iep_weekly_minutes: 250, staffing_ratio: "ONE_TO_THREE", transportation_run_id: "00000000-0000-0000-0000-000000000000" }
              as: CaseManager
          assert:
            - "Trigger 1: HTTP 404 and response.data.error_id == ERR_STUDENT_NOT_FOUND"
            - "Trigger 2: HTTP 404 and response.data.error_id == ERR_RUN_NOT_FOUND"
            - "Trigger 2: response.data.error_id != ERR_STUDENT_NOT_ESY_ELIGIBLE"
            - "No ServiceCommitment row exists for program ${p1_id} (GET /esy/service-commitments?program_id=${p1_id} returns total_count == 0)"

