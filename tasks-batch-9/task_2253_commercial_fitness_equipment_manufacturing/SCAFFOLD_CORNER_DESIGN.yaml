# =============================================================================
# task_2253 - Commercial Fitness Equipment Manufacturing
# SCAFFOLD_CORNER_DESIGN.yaml -- §1.9 Corner-Case Coverage Design
#
# One entry per §1.9 section. Every instance is grounded in §1.1-§1.7 of
# SCAFFOLD.yaml and carries either a fully executable test_recipe or an
# `excluded_because:` pointer to the §1.8 difficulty instance that already
# proves the claim at higher intensity.
# =============================================================================

scaffold_corner_design:
- section: entities
  instances:
  - name: equipment_model_creation_returns_computed_lifecycle_and_envelope
    claim_type: creation
    grounds:
    - entities.EquipmentModel.fields.connected
    - entities.EquipmentModel.fields.lifecycle_status
    - endpoints[POST /equipment-models]
    distinguishing_aspect: A CARDIO model created with every required field returns 201 with connected == false (derived, not supplied), lifecycle_status PRE_RELEASE, released_revision_count 0 and version
      1, wrapped in the declared success envelope.
    test_recipe:
      setup:
      - Empty database; logical clock at the default 2026-08-01T00:00:00Z.
      - No models exist yet.
      setup_api_calls: []
      trigger:
      - call: POST /equipment-models
        payload: {name: T900 Treadmill, category: CARDIO, duty_class: FULL_COMMERCIAL, unit_list_price_cents: 479950, shipping_weight_kg: 212.5, allowed_finish_codes: [GRAPHITE, ARCTIC_WHITE, CLUB_RED]}
        as: ProductEngineer
        captures: {m1: $.data.id, m1_v: $.data.version}
      - call: GET /equipment-models/${m1}
        payload: {}
        as: ProductEngineer
      assert:
      - POST /equipment-models returns 201
      - EquipmentModel.${m1}.name == 'T900 Treadmill', category == CARDIO, duty_class == FULL_COMMERCIAL
      - EquipmentModel.${m1}.unit_list_price_cents == 479950 and shipping_weight_kg == 212.5
      - EquipmentModel.${m1}.allowed_finish_codes == ['GRAPHITE', 'ARCTIC_WHITE', 'CLUB_RED']
      - EquipmentModel.${m1}.connected == false and console_platform == null
      - EquipmentModel.${m1}.lifecycle_status == PRE_RELEASE and released_revision_count == 0
      - EquipmentModel.${m1}.version == 1, id is a bare UUID with no type prefix, created_at and updated_at are set
      - the response body carries meta.api_request_id, meta.api_request_timestamp and response_type == 'object'
  - name: model_revision_retrieval_returns_stored_and_derived_fields
    claim_type: retrieval
    grounds:
    - entities.ModelRevision.fields.min_required_cycles
    - endpoints[GET /model-revisions/{id}]
    distinguishing_aspect: GET /model-revisions/{id} echoes the stored revision and its derived min_required_cycles == 500000 (DUTY_MIN_CYCLES[FULL_COMMERCIAL]), with both cycle-count variants at 0 and
      every timestamp field still null.
    test_recipe:
      setup:
      - A FULL_COMMERCIAL model T900 Treadmill exists.
      - Revision T900-R1 was created against it with target_cycle_count 600000 and has not been submitted.
      setup_api_calls:
      - call: POST /equipment-models
        payload: {name: T900 Treadmill, category: CARDIO, duty_class: FULL_COMMERCIAL, unit_list_price_cents: 479950, shipping_weight_kg: 212.5, allowed_finish_codes: [GRAPHITE]}
        as: ProductEngineer
        captures: {m1: $.data.id, m1_v: $.data.version}
      - call: POST /model-revisions
        payload: {equipment_model_id: '${m1}', revision_code: T900-R1, target_cycle_count: 600000, expected_equipment_model_version: '${m1_v}'}
        as: ProductEngineer
        captures: {r1: $.data.id}
      trigger:
      - call: GET /model-revisions/${r1}
        payload: {}
        as: ProductEngineer
      assert:
      - GET returns 200 with ModelRevision.${r1}.revision_code == 'T900-R1' and target_cycle_count == 600000
      - ModelRevision.${r1}.equipment_model_id == ${m1} and status == DRAFT
      - ModelRevision.${r1}.min_required_cycles == 500000 (derived from the model's FULL_COMMERCIAL duty class)
      - ModelRevision.${r1}.verified_cycle_count == 0 and projected_cycle_count == 0
      - ModelRevision.${r1}.rework_count == 0
      - ModelRevision.${r1}.qualified_at, released_at, sunset_announced_at and firmware_support_until are all null
      - ModelRevision.${r1}.version == 1
  - name: equipment_model_listing_orders_by_created_at_with_pagination
    claim_type: listing
    grounds:
    - list_conventions.default_order
    - endpoints[GET /equipment-models]
    distinguishing_aspect: 'Three models created in a known order page out as created_at ASC: limit=2&offset=0 returns the first two with has_more true and total_count 3, limit=2&offset=2 returns only the
      third with has_more false, and category=CARDIO filters to one row.'
    test_recipe:
      setup:
      - 'Exactly three EquipmentModels exist, created in this order: T900 Treadmill (CARDIO), S500 Selectorised Press (STRENGTH), C700 Connected Bike (CONNECTED).'
      setup_api_calls:
      - call: POST /equipment-models
        payload: {name: T900 Treadmill, category: CARDIO, duty_class: FULL_COMMERCIAL, unit_list_price_cents: 479950, shipping_weight_kg: 212.5, allowed_finish_codes: [GRAPHITE]}
        as: ProductEngineer
        captures: {m1: $.data.id, m1_v: $.data.version}
      - call: POST /equipment-models
        payload: {name: S500 Selectorised Press, category: STRENGTH, duty_class: INSTITUTIONAL, unit_list_price_cents: 324575, shipping_weight_kg: 341.0, allowed_finish_codes: [GRAPHITE]}
        as: ProductEngineer
        captures: {m2: $.data.id, m2_v: $.data.version}
      - call: POST /equipment-models
        payload: {name: C700 Connected Bike, category: CONNECTED, duty_class: FULL_COMMERCIAL, unit_list_price_cents: 561325, shipping_weight_kg: 96.5, allowed_finish_codes: [GRAPHITE], console_platform: CONSOLE_T2}
        as: ProductEngineer
        captures: {m3: $.data.id, m3_v: $.data.version}
      trigger:
      - call: GET /equipment-models
        payload: {limit: 2, offset: 0}
        as: OrderPlanner
      - call: GET /equipment-models
        payload: {limit: 2, offset: 2}
        as: OrderPlanner
      - call: GET /equipment-models
        payload: {category: CARDIO}
        as: OrderPlanner
      assert:
      - the first page returns 200 with response_type == 'array', total_count == 3 and has_more == true
      - the first page's data[0].id == ${m1} and data[1].id == ${m2} (created_at ASC, id ASC tie-break)
      - the second page returns exactly 1 row with data[0].id == ${m3}, total_count == 3 and has_more == false
      - the category=CARDIO query returns exactly 1 row with data[0].id == ${m1}
      - no page contains a duplicated id
  - name: order_not_found_returns_order_not_found
    claim_type: not_found
    grounds:
    - validations[priority=3]
    - errors[ERR_ORDER_NOT_FOUND]
    - endpoints[GET /orders/{id}]
    distinguishing_aspect: A syntactically valid but unknown UUID in the order path returns 404 ERR_ORDER_NOT_FOUND, and the same unknown id on the order-line path returns the same code because OrderLine
      shares the Order not-found family.
    test_recipe:
      setup:
      - Empty database; no Order or OrderLine rows exist.
      setup_api_calls: []
      trigger:
      - call: GET /orders/00000000-0000-4000-8000-000000000000
        payload: {}
        as: OrderPlanner
        captures: {err_order: $.data.error_id}
      - call: GET /order-lines/00000000-0000-4000-8000-000000000000
        payload: {}
        as: OrderPlanner
        captures: {err_line: $.data.error_id}
      assert:
      - GET /orders/<unknown-uuid> returns 404 with error_id ERR_ORDER_NOT_FOUND
      - GET /order-lines/<unknown-uuid> returns 404 with error_id ERR_ORDER_NOT_FOUND
      - both responses carry response_type == 'error' and a non-empty data.message
      - no row is created as a side effect
  - name: missing_required_body_fields_return_invalid_request
    claim_type: required_fields
    grounds:
    - validations[priority=7]
    - errors[ERR_INVALID_REQUEST]
    - endpoints[POST /facilities]
    - endpoints[POST /orders]
    - endpoints[POST /test-rigs]
    distinguishing_aspect: 'Each endpoint''s required inputs are enforced individually: omitting freight_zone on POST /facilities, requested_install_window_end on POST /orders and parallel_station_count
      on POST /test-rigs each returns 400 ERR_INVALID_REQUEST with nothing persisted.'
    test_recipe:
      setup:
      - Facility f1 exists so the order probe's facility_id resolves and cannot mask the schema error.
      setup_api_calls:
      - call: POST /facilities
        payload: {account_name: Grandstand Fitness, freight_zone: Z1, credit_limit_cents: 500000000}
        as: OrderPlanner
        captures: {f1: $.data.id}
      trigger:
      - call: POST /facilities
        payload: {account_name: Northside Gym, credit_limit_cents: 100000}
        as: OrderPlanner
        captures: {err_zone: $.data.error_id}
      - call: POST /orders
        payload: {facility_id: '${f1}', requested_install_window_start: '2026-09-10T08:00:00Z'}
        as: OrderPlanner
        captures: {err_window: $.data.error_id}
      - call: POST /test-rigs
        payload: {name: RIG-Z, supported_duty_classes: [FULL_COMMERCIAL]}
        as: ProductEngineer
        captures: {err_stations: $.data.error_id}
      assert:
      - the facility probe (no freight_zone) returns 400 with error_id ERR_INVALID_REQUEST
      - the order probe (no requested_install_window_end) returns 400 with error_id ERR_INVALID_REQUEST
      - the test-rig probe (no parallel_station_count) returns 400 with error_id ERR_INVALID_REQUEST
      - GET /equipment-models still reports total_count == 0 and no Facility beyond ${f1} exists
      - each rejection happens at validations[priority=7], before any FK or state rule could run
  - name: declared_defaults_applied_when_optional_inputs_are_omitted
    claim_type: defaults
    grounds:
    - entities.Facility.fields.install_blackout_weekdays
    - entities.FirmwareRelease.fields.mandatory_security
    - entities.MaintenanceVisit.fields.reserved_units
    - entities.InstallJob.fields.travel_buffer_minutes
    - endpoints[POST /maintenance-visits]
    distinguishing_aspect: 'Four declared defaults materialise without being sent: Facility.install_blackout_weekdays [], FirmwareRelease.mandatory_security false, InstallJob.travel_buffer_minutes 120 and
      MaintenanceVisit.reserved_units 0 — the last one leaving the partner''s spare-stock ledger completely untouched.'
    test_recipe:
      setup:
      - T900-R1 is RELEASED; facility f1 was created without install_blackout_weekdays.
      - Firmware build FW-2.1.0 was created without mandatory_security.
      - Order o1 (1 x T900-R1) is INSTALLED and INVOICED; asset a1 is IN_SERVICE.
      - InstallJob j1 was created without any travel-buffer input.
      - PMProgram pm1 (PRO, 90-day interval) is ACTIVE and partner p1 has received no spare parts.
      setup_api_calls:
      - call: POST /equipment-models
        payload: {name: T900 Treadmill, category: CARDIO, duty_class: FULL_COMMERCIAL, unit_list_price_cents: 479950, shipping_weight_kg: 212.5, allowed_finish_codes: [GRAPHITE, ARCTIC_WHITE, CLUB_RED]}
        as: ProductEngineer
        captures: {m1: $.data.id, m1_v: $.data.version}
      - call: POST /model-revisions
        payload: {equipment_model_id: '${m1}', revision_code: T900-R1, target_cycle_count: 600000, expected_equipment_model_version: '${m1_v}'}
        as: ProductEngineer
        captures: {r1: $.data.id}
      - call: POST /model-revisions/${r1}/submit-for-testing
        payload: {}
        as: ProductEngineer
      - call: POST /test-rigs
        payload: {name: RIG-A, parallel_station_count: 2, supported_duty_classes: [FULL_COMMERCIAL, INSTITUTIONAL]}
        as: ProductEngineer
        captures: {g1: $.data.id}
      - call: POST /test-runs
        payload: {model_revision_id: '${r1}', test_rig_id: '${g1}', window_start: '2026-08-02T00:00:00Z', window_end: '2026-08-06T12:00:00Z', target_cycles: 300000}
        as: ProductEngineer
        captures: {x1: $.data.id}
      - call: POST /test-runs/${x1}/start
        payload: {}
        as: ProductEngineer
      - call: POST /test-runs/${x1}/complete
        payload: {outcome: PASSED, achieved_cycles: 300000}
        as: ProductEngineer
      - call: POST /test-runs
        payload: {model_revision_id: '${r1}', test_rig_id: '${g1}', window_start: '2026-08-06T00:00:00Z', window_end: '2026-08-10T12:00:00Z', target_cycles: 300000}
        as: ProductEngineer
        captures: {x2: $.data.id}
      - call: POST /test-runs/${x2}/start
        payload: {}
        as: ProductEngineer
      - call: POST /test-runs/${x2}/complete
        payload: {outcome: PASSED, achieved_cycles: 200000}
        as: ProductEngineer
      - call: POST /model-revisions/${r1}/qualify
        payload: {}
        as: ProductEngineer
      - call: POST /model-revisions/${r1}/release
        payload: {}
        as: ComplianceOfficer
        as_user_id: co-01
      - call: POST /facilities
        payload: {account_name: Grandstand Fitness, freight_zone: Z1, credit_limit_cents: 500000000}
        as: OrderPlanner
        captures: {f1: $.data.id}
      - call: POST /service-partners
        payload: {name: Meridian Service Co, region: R_NORTH, certified_categories: [CARDIO], certified_technician_count: 3, certified_hours_capacity: 100.0, training_current_until: '2027-12-31T00:00:00Z'}
        as: ServiceOpsAdmin
        captures: {p1: $.data.id}
      - call: POST /orders
        payload: {facility_id: '${f1}', requested_install_window_start: '2026-09-10T08:00:00Z', requested_install_window_end: '2026-09-10T18:00:00Z'}
        as: OrderPlanner
        captures: {o1: $.data.id}
      - call: POST /orders/${o1}/lines
        payload: {model_revision_id: '${r1}', quantity: 1, finish_codes: [GRAPHITE], layout_zone_label: ZONE-A}
        as: OrderPlanner
        captures: {l1: $.data.id}
      - call: GET /orders/${o1}
        payload: {}
        as: OrderPlanner
        captures: {o1_v: $.data.version}
      - call: POST /orders/${o1}/quote
        payload: {expected_order_version: '${o1_v}'}
        as: OrderPlanner
      - call: POST /orders/${o1}/confirm
        payload: {}
        as: OrderPlanner
      - call: POST /orders/${o1}/production/complete
        payload: {}
        as: OrderPlanner
      - call: POST /install-jobs
        payload: {order_id: '${o1}', service_partner_id: '${p1}', window_start: '2026-09-10T08:00:00Z', window_end: '2026-09-10T12:00:00Z', estimated_labor_hours: 3.0}
        as: OrderPlanner
        captures: {j1: $.data.id}
      - call: POST /install-jobs/${j1}/arrive
        payload: {}
        as: ServicePartnerTech
        as_user_id: ${p1}
      - call: POST /install-jobs/${j1}/complete
        payload: {actual_labor_hours: 3.0, punch_list_open_count: 0}
        as: ServicePartnerTech
        as_user_id: ${p1}
      - call: GET /serialized-assets
        payload: {facility_id: '${f1}'}
        as: OrderPlanner
        captures: {a1: '$.data[0].id'}
      - call: POST /firmware-releases
        payload: {version_string: FW-2.1.0, console_platform: CONSOLE_T2}
        as: ProductEngineer
        captures: {fw1: $.data.id}
      - call: POST /pm-programs
        payload: {facility_id: '${f1}', service_partner_id: '${p1}', tier: PRO, visit_interval_days: 90}
        as: ServiceOpsAdmin
        captures: {pm1: $.data.id}
      - call: POST /pm-programs/${pm1}/activate
        payload: {}
        as: ServiceOpsAdmin
      trigger:
      - call: POST /maintenance-visits
        payload: {pm_program_id: '${pm1}', serialized_asset_id: '${a1}', scheduled_date: '2026-09-18T09:00:00Z'}
        as: ServicePartnerTech
        as_user_id: ${p1}
        captures: {v1: $.data.id}
      - call: GET /facilities/${f1}
        payload: {}
        as: OrderPlanner
      - call: GET /firmware-releases/${fw1}
        payload: {}
        as: ProductEngineer
      - call: GET /install-jobs/${j1}
        payload: {}
        as: OrderPlanner
      - call: GET /service-partners/${p1}
        payload: {}
        as: ServiceOpsAdmin
      assert:
      - POST /maintenance-visits returns 201 with MaintenanceVisit.${v1}.reserved_units == 0 and status == SCHEDULED
      - Facility.${f1}.install_blackout_weekdays == [] (empty array default, not null)
      - FirmwareRelease.${fw1}.mandatory_security == false and status == ACTIVE
      - InstallJob.${j1}.travel_buffer_minutes == 120 (= INSTALL_TRAVEL_BUFFER_MINUTES)
      - ServicePartner.${p1}.spare_stock_received_units == 0, spare_stock_reserved_units == 0, spare_stock_on_hand_units == 0
      - MaintenanceVisit.${v1}.labor_hours == null and held_reason == null
  - name: order_line_unit_and_extended_price_are_computed_from_finish_and_duty
    claim_type: computed_fields
    grounds:
    - calculations.order_line_extended_price
    - entities.OrderLine.fields.unit_price_cents
    - entities.OrderLine.fields.extended_price_cents
    - endpoints[POST /orders/{id}/lines]
    distinguishing_aspect: 'A 3-unit T900 line with ARCTIC_WHITE + CLUB_RED prices itself: unit_price_cents == 479950 + 4500 + 7500 == 491950 and extended_price_cents == ROUND_HALF_UP(491950 x 3 x 1.06)
      == 1564401, both computed server-side and rolled into the order''s subtotal and chargeable weight.'
    test_recipe:
      setup:
      - T900-R1 is RELEASED on a FULL_COMMERCIAL model listed at 479950 cents, 212.5 kg.
      - Facility f1 is Z1 and order o1 is CONFIGURING with no lines.
      setup_api_calls:
      - call: POST /equipment-models
        payload: {name: T900 Treadmill, category: CARDIO, duty_class: FULL_COMMERCIAL, unit_list_price_cents: 479950, shipping_weight_kg: 212.5, allowed_finish_codes: [GRAPHITE, ARCTIC_WHITE, CLUB_RED]}
        as: ProductEngineer
        captures: {m1: $.data.id, m1_v: $.data.version}
      - call: POST /model-revisions
        payload: {equipment_model_id: '${m1}', revision_code: T900-R1, target_cycle_count: 600000, expected_equipment_model_version: '${m1_v}'}
        as: ProductEngineer
        captures: {r1: $.data.id}
      - call: POST /model-revisions/${r1}/submit-for-testing
        payload: {}
        as: ProductEngineer
      - call: POST /test-rigs
        payload: {name: RIG-A, parallel_station_count: 2, supported_duty_classes: [FULL_COMMERCIAL, INSTITUTIONAL]}
        as: ProductEngineer
        captures: {g1: $.data.id}
      - call: POST /test-runs
        payload: {model_revision_id: '${r1}', test_rig_id: '${g1}', window_start: '2026-08-02T00:00:00Z', window_end: '2026-08-06T12:00:00Z', target_cycles: 300000}
        as: ProductEngineer
        captures: {x1: $.data.id}
      - call: POST /test-runs/${x1}/start
        payload: {}
        as: ProductEngineer
      - call: POST /test-runs/${x1}/complete
        payload: {outcome: PASSED, achieved_cycles: 300000}
        as: ProductEngineer
      - call: POST /test-runs
        payload: {model_revision_id: '${r1}', test_rig_id: '${g1}', window_start: '2026-08-06T00:00:00Z', window_end: '2026-08-10T12:00:00Z', target_cycles: 300000}
        as: ProductEngineer
        captures: {x2: $.data.id}
      - call: POST /test-runs/${x2}/start
        payload: {}
        as: ProductEngineer
      - call: POST /test-runs/${x2}/complete
        payload: {outcome: PASSED, achieved_cycles: 200000}
        as: ProductEngineer
      - call: POST /model-revisions/${r1}/qualify
        payload: {}
        as: ProductEngineer
      - call: POST /model-revisions/${r1}/release
        payload: {}
        as: ComplianceOfficer
        as_user_id: co-01
      - call: POST /facilities
        payload: {account_name: Grandstand Fitness, freight_zone: Z1, credit_limit_cents: 500000000}
        as: OrderPlanner
        captures: {f1: $.data.id}
      - call: POST /orders
        payload: {facility_id: '${f1}', requested_install_window_start: '2026-09-10T08:00:00Z', requested_install_window_end: '2026-09-10T18:00:00Z'}
        as: OrderPlanner
        captures: {o1: $.data.id}
      trigger:
      - call: POST /orders/${o1}/lines
        payload: {model_revision_id: '${r1}', quantity: 3, finish_codes: [ARCTIC_WHITE, CLUB_RED], layout_zone_label: ZONE-A}
        as: OrderPlanner
        captures: {l1: $.data.id}
      - call: GET /orders/${o1}
        payload: {}
        as: OrderPlanner
      assert:
      - POST /orders/${o1}/lines returns 201 with OrderLine.${l1}.unit_price_cents == 491950
      - OrderLine.${l1}.extended_price_cents == 1564401 (491950 x 3 = 1475850, x 1.06 = 1564401 exactly)
      - OrderLine.${l1}.status == ACTIVE and assets_minted_count == 0
      - Order.${o1}.line_subtotal_cents == 1564401 and chargeable_weight_kg == 637.5
      - Order.${o1}.billing_status == UNQUOTED and quoted_total_cents == 0
      - Order.${o1}.install_amount_cents == 0 (no quote has run yet)
  - name: serialized_asset_serial_number_and_sequence_no_are_system_derived
    claim_type: system_fields
    grounds:
    - entities.SerializedAsset.fields.serial_number
    - entities.SerializedAsset.fields.sequence_no
    - state_machines.Order.fulfillment_status.IN_PRODUCTION_to_STAGED
    - endpoints[POST /orders/{id}/production/complete]
    distinguishing_aspect: Production completion mints 3 assets across two lines of the same revision with sequence_no 1..3 assigned in (OrderLine.created_at ASC, unit index ASC) order and serial_number
      '<revision_code>-' + 5-digit sequence — deterministic strings, never random and never derived from the row ids.
    test_recipe:
      setup:
      - T900-R1 is RELEASED; facility f1 is Z1.
      - Order o1 carries line l1 (2 units, created first) then line l2 (1 unit), both against T900-R1.
      - The order was quoted at 1680929 cents, confirmed and moved to STAGED.
      setup_api_calls:
      - call: POST /equipment-models
        payload: {name: T900 Treadmill, category: CARDIO, duty_class: FULL_COMMERCIAL, unit_list_price_cents: 479950, shipping_weight_kg: 212.5, allowed_finish_codes: [GRAPHITE, ARCTIC_WHITE, CLUB_RED]}
        as: ProductEngineer
        captures: {m1: $.data.id, m1_v: $.data.version}
      - call: POST /model-revisions
        payload: {equipment_model_id: '${m1}', revision_code: T900-R1, target_cycle_count: 600000, expected_equipment_model_version: '${m1_v}'}
        as: ProductEngineer
        captures: {r1: $.data.id}
      - call: POST /model-revisions/${r1}/submit-for-testing
        payload: {}
        as: ProductEngineer
      - call: POST /test-rigs
        payload: {name: RIG-A, parallel_station_count: 2, supported_duty_classes: [FULL_COMMERCIAL, INSTITUTIONAL]}
        as: ProductEngineer
        captures: {g1: $.data.id}
      - call: POST /test-runs
        payload: {model_revision_id: '${r1}', test_rig_id: '${g1}', window_start: '2026-08-02T00:00:00Z', window_end: '2026-08-06T12:00:00Z', target_cycles: 300000}
        as: ProductEngineer
        captures: {x1: $.data.id}
      - call: POST /test-runs/${x1}/start
        payload: {}
        as: ProductEngineer
      - call: POST /test-runs/${x1}/complete
        payload: {outcome: PASSED, achieved_cycles: 300000}
        as: ProductEngineer
      - call: POST /test-runs
        payload: {model_revision_id: '${r1}', test_rig_id: '${g1}', window_start: '2026-08-06T00:00:00Z', window_end: '2026-08-10T12:00:00Z', target_cycles: 300000}
        as: ProductEngineer
        captures: {x2: $.data.id}
      - call: POST /test-runs/${x2}/start
        payload: {}
        as: ProductEngineer
      - call: POST /test-runs/${x2}/complete
