              payload: { name: "Casc", timezone: "UTC", peak_start_minute: 1080, peak_end_minute: 1380, peak_multiplier: 1.5, deposit_pct: 0.2, cancellation_cutoff_hours: 24, grace_minutes: 15, overage_grace_minutes: 10 }
