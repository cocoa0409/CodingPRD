            - "SigningCredential.${cert_id}.status == REVOKED"
            - "SigningCredential.${cert_id}.revocation_reason == MANUAL"

      - name: report_compromise_blocks_the_in_flight_build_and_releases_its_review_slot
        claim_type: Cross-entity
        grounds:
          - state_machines.SigningCredential.transitions.ACTIVE_to_COMPROMISED.side_effects
          - state_machines.Submission.states.BLOCKED_INVALID_SIGNING
          - entities.ReviewWindow.fields.slots_reserved
          - entities.AppRecord.fields.compliance_posture
        distinguishing_aspect: "Reporting the DISTRIBUTION_CERT compromised walks three hops in one call - the linked profile goes REVOKED/COMPROMISE_CASCADE, the IN_REVIEW submission goes BLOCKED_INVALID_SIGNING with review_window_id nulled and its reserved slot returned to the pool, and the app posture drops to RESTRICTED - even though the compromise call itself never names the submission or the window."
        test_recipe:
          setup:
            - "Build 100 of Northwind Wallet is IN_REVIEW signed with the profile; ReviewWindow IOS/POOL_A has capacity 5 with slots_reserved 1, slots_consumed 0, slots_available 4."
          setup_api_calls: *CH_REVIEW
          trigger:
            - call: "POST /signing-credentials/${cert_id}/report-compromise"
              payload: {}
              as: PublisherAdmin
              as_user_id: "${acct_id}"
          assert:
            - "the response status is 200 and data.status == COMPROMISED"
            - "SigningCredential.${prof_id}.status == REVOKED"
            - "SigningCredential.${prof_id}.revocation_reason == COMPROMISE_CASCADE"
            - "Submission.${sub_id}.status == BLOCKED_INVALID_SIGNING"
            - "Submission.${sub_id}.review_window_id is null"
            - "ReviewWindow.${win_id}.slots_reserved == 0"
            - "ReviewWindow.${win_id}.slots_available == 5"
            - "ReviewWindow.${win_id}.blocked_submission_count == 1"
            - "AppRecord.${app_id}.compliance_posture == RESTRICTED"

      - name: immediate_release_mode_start_jumps_straight_to_completed_and_fully_released
