              captures: { veh_a_v1: $.data.version }
            - call: "POST /v1/transfer-requests"
              payload: { vehicle_id: "${veh_a}", customer_id: "${cust1}", to_store_id: "${s_dal}", supersedes_request_id: "${tr1}", expected_vehicle_version: "${veh_a_v1}" }
              as: Customer
              as_user_id: "${cust1}"
              captures: { tr2: $.data.id }
          assert:
