              as: PlatformAdmin
            - call: "POST /wiki/legal-requests"
              payload: { request_type: "USER_INFO", requesting_party: "Party A" }
              as: LegalCounsel
              captures: { l1_id: $.data.id }
            - call: "POST /wiki/legal-requests/${l1_id}/start-review"
              payload: {}
              as: LegalCounsel
            - call: "POST /wiki/legal-requests/${l1_id}/comply"
              payload: {}
              as: LegalCounsel
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /wiki/legal-requests"
              payload: { request_type: "SUBPOENA", requesting_party: "Party B" }
              as: LegalCounsel
              captures: { l2_id: $.data.id }
            - call: "POST /wiki/legal-requests/${l2_id}/start-review"
              payload: {}
              as: LegalCounsel
            - call: "POST /wiki/legal-requests/${l2_id}/reject"
              payload: {}
              as: LegalCounsel
            - call: "POST /wiki/transparency-reports"
