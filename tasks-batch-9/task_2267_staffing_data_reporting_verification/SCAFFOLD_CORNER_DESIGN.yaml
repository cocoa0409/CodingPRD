              as: PlatformAdmin
              as_user_id: "admin-01"
              captures: { w_ag: $.data.id }
            - &k_batch
              call: "POST /vendor-submissions"
              payload: { vendor_id: "${vend}", facility_id: "${fac}", reporting_period_id: "${per}", attested_by: "Northgate Ops Lead", lines: [{ worker_id: "${w_ag}", job_category_id: "${jc_rn}", work_date: "2026-04-02", shift_start: "07:00", shift_end: "15:00", allocations: [{ job_category_id: "${jc_rn}", percent: 100.00 }] }] }
