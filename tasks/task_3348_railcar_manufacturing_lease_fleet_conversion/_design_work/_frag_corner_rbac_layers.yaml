      - name: rbac_lessee_reads_own_outstanding_balance_succeeds
        claim_type: exclusive operations
        grounds:
          - roles.Lessee.shared_operations
          - roles.Lessee.identity
          - GET /api/v1/lessees/{id}/outstanding-balance
          - entities.Lessee.fields.outstanding_balance_cents
        distinguishing_aspect: "The entity_backed Lessee role reads the ledger breakdown through GET /lessees/{id}/outstanding-balance only when X-User-ID equals the path's lessee id, and the response carries all three declared components with literal zeros for a freshly minted account."
        test_recipe:
          setup:
            - "Empty DB; logical clock pinned to 2026-09-01T00:00:00Z."
            - "Two lessee accounts exist, A and B, both minted by LeaseAdministrator; neither has any settled return, completed SOLD order or settled sale, so both balances are structurally zero."
            - "§1.7 declares Lessee as entity_backed:Lessee whose shared_operations grant GET /lessees/{id}/outstanding-balance for its own id only."
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/v1/lessees"
              payload: { legal_name: "LESS-OWN-A", credit_tier: "A", utilization_threshold_pct: 50, credit_ceiling_cents: 4000000 }
              as: LeaseAdministrator
              captures: { ls_a_id: $.data.id }
            - call: "POST /api/v1/lessees"
              payload: { legal_name: "LESS-OWN-B", credit_tier: "B", utilization_threshold_pct: 60, credit_ceiling_cents: 4000000 }
              as: LeaseAdministrator
              captures: { ls_b_id: $.data.id }
          trigger:
            - call: "GET /api/v1/lessees/${ls_a_id}/outstanding-balance"
              payload: {}
              as: Lessee
              as_user_id: "${ls_a_id}"
              captures: { own_balance: $.data.outstanding_balance_cents, own_settled: $.data.settled_charges_cents, own_credits: $.data.credits_applied_cents }
          assert:
            - "The entity-backed read returns HTTP 200 with data.outstanding_balance_cents == ${own_balance} == 0"
            - "The breakdown is the full declared triple: data.settled_charges_cents == ${own_settled} == 0 and data.credits_applied_cents == ${own_credits} == 0"
            - "The response is the balance object rather than a Lessee row, so the read resolves the §1.3 lessee_balance_reconciliation view for the id in the path"
            - "The call succeeds with X-User-ID equal to the path id ${ls_a_id}, which is the only identity this entity_backed role may present"
            - "The sibling read against the other account is the denial half of this pair: rbac_lessee_denied_another_lessees_balance_returns_forbidden"

      - name: rbac_lessee_denied_another_lessees_balance_returns_forbidden
        claim_type: denial
        grounds:
