            - "GET /organizations returns exactly one row and its id is ${org_a}"
            - "Organization.${org_a}.state_code == CA - the refused request changed nothing on the incumbent row"

      - name: an_all_abstain_board_is_rejected
        claim_type: error_triggerable
        grounds:
          - errors.ERR_NO_ELIGIBLE_VOTES
