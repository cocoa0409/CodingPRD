            - call: "POST /accreditation/rounding-sessions"
              payload: { unit_id: "${v9_u1}", round_type: "LIFE_SAFETY", window_start: "2026-08-10T08:00:00Z", window_end: "2026-08-10T12:00:00Z" }
              as: SafetyOfficer
              captures: { v9_rs: $.data.id }
            - call: "POST /accreditation/rounding-sessions/${v9_rs}/deficiencies"
              payload: { standard_id: "${v9_s1}", description: "Egress door chained shut", severity: "HIGH" }
