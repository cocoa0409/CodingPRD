  - rule_id: resource_temporal_overlap
    instances:
      - name: tunnel_window_halfopen_adjacency
        grounds:
          - errors[ERR_TUNNEL_WINDOW_OVERLAP]
          - validations[priority=9]
          - entities.PasteurizationCycle.fields.tunnel_id
        distinguishing_aspect: |
          Half-open [start, end) interval semantics on the PasteurizationTunnel resource: a
          cycle starting exactly when the blocker ends (2026-05-02T00:00:00Z) is ACCEPTED,
          while one straddling the interior is rejected — pure adjacency, no buffer.
        test_recipe:
          setup:
            - "Tunnel t1; batch b1 (40t) with cycle pc1 SCHEDULED for 2026-05-01T00:00:00Z..2026-05-02T00:00:00Z (blocking)"
            - "Batch b2 (10t) MIXED, awaiting a cycle"
          setup_api_calls:
            - { call: "POST /api/pasteurization-tunnels", payload: { tunnel_code: "T1", capacity_tonnes: 100.0 }, as: CompostSupervisor, captures: { t_id: $.data.id } }
            - { call: "POST /api/substrate-batches", payload: { recipe: "PHASE_II_COMPOST", tonnage: 40.0 }, as: CompostSupervisor, captures: { b1_id: $.data.id } }
            - { call: "POST /api/pasteurization-cycles", payload: { batch_id: "${b1_id}", tunnel_id: "${t_id}", planned_start: "2026-05-01T00:00:00Z", planned_end: "2026-05-02T00:00:00Z" }, as: CompostSupervisor, captures: { pc1_id: $.data.id } }
            - { call: "POST /api/substrate-batches", payload: { recipe: "PHASE_II_COMPOST", tonnage: 10.0 }, as: CompostSupervisor, captures: { b2_id: $.data.id } }
          trigger:
            - call: "POST /api/pasteurization-cycles"
              payload: { batch_id: "${b2_id}", tunnel_id: "${t_id}", planned_start: "2026-05-01T12:00:00Z", planned_end: "2026-05-02T12:00:00Z" }
              as: CompostSupervisor
              captures: { err: $.data.error_id }
            - { call: "POST /api/pasteurization-cycles", payload: { batch_id: "${b2_id}", tunnel_id: "${t_id}", planned_start: "2026-05-02T00:00:00Z", planned_end: "2026-05-03T00:00:00Z" }, as: CompostSupervisor, captures: { pc2_id: $.data.id } }
          assert:
            - "Overlapping request rejected with ERR_TUNNEL_WINDOW_OVERLAP (interior straddle 05-01T12..05-02T12 vs 05-01T00..05-02T00)"
            - "Adjacent request (start == blocker end, 2026-05-02T00:00:00Z) returns 201 with status SCHEDULED"
            - "SubstrateBatch.${b2_id}.status == PASTEURIZING only after the adjacent create (failed request left it MIXED)"

      - name: room_window_turnover_buffer_gap
        grounds:
          - errors[ERR_ROOM_WINDOW_OVERLAP]
          - validations[priority=9]
          - entities.RoomCycle.fields.room_id
        distinguishing_aspect: |
          Different resource (GrowingRoom) with different interval semantics: the blocking
          interval extends 2 days past planned_end for cleanout — a cycle starting 1 day after
          the prior end is REJECTED, while starting exactly at planned_end + 2 days
          (2026-06-16) is accepted (half-open blocking interval).
        test_recipe:
          setup:
            - "Batch b1 SPAWNED (40t); cycle rc1 (20t) booked in room r1 for 2026-05-03..2026-06-14 (blocking until 2026-06-16T00:00:00Z)"
            - "Room version re-read after rc1 creation"
          setup_api_calls:
            - { call: "POST /api/varieties", payload: { variety_code: "WB1", display_name: "White Button", substrate_recipe: "PHASE_II_COMPOST", target_bioefficiency_pct: 25.0, shelf_life_days: 5, spawn_run_days: 3, casing_days: 2, max_flushes: 3, flush_yield_distribution: [0.5, 0.3, 0.2] }, as: CompostSupervisor, captures: { v_id: $.data.id } }
            - { call: "POST /api/pasteurization-tunnels", payload: { tunnel_code: "T1", capacity_tonnes: 100.0 }, as: CompostSupervisor, captures: { t_id: $.data.id } }
            - { call: "POST /api/rooms", payload: { room_code: "R1", capacity_tonnes: 50.0 }, as: FarmManager, captures: { r_id: $.data.id, r_v: $.data.version } }
            - { call: "POST /api/substrate-batches", payload: { recipe: "PHASE_II_COMPOST", tonnage: 40.0 }, as: CompostSupervisor, captures: { b_id: $.data.id } }
            - { call: "POST /api/pasteurization-cycles", payload: { batch_id: "${b_id}", tunnel_id: "${t_id}", planned_start: "2026-05-01T00:00:00Z", planned_end: "2026-05-02T00:00:00Z" }, as: CompostSupervisor, captures: { pc_id: $.data.id } }
            - { call: "POST /api/pasteurization-cycles/${pc_id}/start", payload: {}, as: CompostSupervisor }
            - { call: "POST /api/pasteurization-cycles/${pc_id}/complete", payload: { hours_at_target_temp: 8.0 }, as: CompostSupervisor }
            - { call: "POST /api/substrate-batches/${b_id}/spawn", payload: { variety_id: "${v_id}", spawn_kg: 280.0 }, as: CompostSupervisor }
            - { call: "POST /api/room-cycles", payload: { room_id: "${r_id}", batch_id: "${b_id}", allocated_tonnage: 20.0, planned_start: "2026-05-03T00:00:00Z", planned_end: "2026-06-14T00:00:00Z", expected_room_version: "${r_v}" }, as: FarmManager, captures: { rc1_id: $.data.id } }
            - { call: "GET /api/rooms/${r_id}", payload: {}, as: Any, captures: { r_v2: $.data.version } }
          trigger:
            - call: "POST /api/room-cycles"
              payload: { room_id: "${r_id}", batch_id: "${b_id}", allocated_tonnage: 10.0, planned_start: "2026-06-15T00:00:00Z", planned_end: "2026-06-30T00:00:00Z", expected_room_version: "${r_v2}" }
              as: FarmManager
              captures: { err: $.data.error_id }
            - { call: "POST /api/room-cycles", payload: { room_id: "${r_id}", batch_id: "${b_id}", allocated_tonnage: 15.0, planned_start: "2026-06-16T00:00:00Z", planned_end: "2026-06-30T00:00:00Z", expected_room_version: "${r_v2}" }, as: FarmManager, captures: { rc2_id: $.data.id } }
          assert:
            - "1-day gap (start 2026-06-15 < planned_end + 2d) rejected with ERR_ROOM_WINDOW_OVERLAP"
            - "Exact buffer-boundary start (2026-06-16 == planned_end + 2d) returns 201 with status SCHEDULED"
            - "SubstrateBatch.${b_id}.remaining_tonnage == 5.0 (40.0 - 20.0 - 15.0; the rejected attempt reserved nothing)"

  - rule_id: compensating_invariant
    instances:
      - name: tonnage_reserve_cancel_conservation
        grounds:
          - calculations.substrate_tonnage_ledger
          - state_machines.RoomCycle.SCHEDULED_to_CANCELLED
          - entities.SubstrateBatch.fields.remaining_tonnage
        distinguishing_aspect: |
          Conserved quantity: substrate mass. The create/cancel pair on a SCHEDULED cycle
          reserves then releases 25.0 t, returning batch.remaining_tonnage to exactly its
          pre-pair value (40.0): tonnage == remaining + sum(active allocations) holds at
          every step with zero drift.
        test_recipe:
          setup:
            - "Batch b1 SPAWNED (40.0 t, remaining 40.0); room r1 fresh (version 1)"
          setup_api_calls:
            - { call: "POST /api/varieties", payload: { variety_code: "WB1", display_name: "White Button", substrate_recipe: "PHASE_II_COMPOST", target_bioefficiency_pct: 25.0, shelf_life_days: 5, spawn_run_days: 3, casing_days: 2, max_flushes: 3, flush_yield_distribution: [0.5, 0.3, 0.2] }, as: CompostSupervisor, captures: { v_id: $.data.id } }
            - { call: "POST /api/pasteurization-tunnels", payload: { tunnel_code: "T1", capacity_tonnes: 100.0 }, as: CompostSupervisor, captures: { t_id: $.data.id } }
            - { call: "POST /api/rooms", payload: { room_code: "R1", capacity_tonnes: 50.0 }, as: FarmManager, captures: { r_id: $.data.id, r_v: $.data.version } }
            - { call: "POST /api/substrate-batches", payload: { recipe: "PHASE_II_COMPOST", tonnage: 40.0 }, as: CompostSupervisor, captures: { b_id: $.data.id } }
            - { call: "POST /api/pasteurization-cycles", payload: { batch_id: "${b_id}", tunnel_id: "${t_id}", planned_start: "2026-05-01T00:00:00Z", planned_end: "2026-05-02T00:00:00Z" }, as: CompostSupervisor, captures: { pc_id: $.data.id } }
            - { call: "POST /api/pasteurization-cycles/${pc_id}/start", payload: {}, as: CompostSupervisor }
            - { call: "POST /api/pasteurization-cycles/${pc_id}/complete", payload: { hours_at_target_temp: 8.0 }, as: CompostSupervisor }
            - { call: "POST /api/substrate-batches/${b_id}/spawn", payload: { variety_id: "${v_id}", spawn_kg: 280.0 }, as: CompostSupervisor }
          trigger:
            - { call: "POST /api/room-cycles", payload: { room_id: "${r_id}", batch_id: "${b_id}", allocated_tonnage: 25.0, planned_start: "2026-05-03T00:00:00Z", planned_end: "2026-06-14T00:00:00Z", expected_room_version: "${r_v}" }, as: FarmManager, captures: { rc_id: $.data.id } }
            - { call: "GET /api/substrate-batches/${b_id}", payload: {}, as: Any, captures: { remaining_mid: $.data.remaining_tonnage } }
            - { call: "POST /api/room-cycles/${rc_id}/cancel", payload: {}, as: FarmManager }
            - { call: "GET /api/substrate-batches/${b_id}", payload: {}, as: Any, captures: { remaining_end: $.data.remaining_tonnage } }
          assert:
            - "After create: SubstrateBatch.${b_id}.remaining_tonnage == 15.0 (40.0 - 25.0 reserved)"
            - "After cancel: SubstrateBatch.${b_id}.remaining_tonnage == 40.0 exactly (compensating release, no drift)"
            - "Invariant: remaining_tonnage + sum(allocated_tonnage over non-CANCELLED cycles) == tonnage (40.0 + 0.0 == 40.0)"
            - "RoomCycle.${rc_id}.status == CANCELLED and batch status remains SPAWNED (not EXHAUSTED)"

      - name: payroll_accrual_approve_dispute_conservation
        grounds:
          - calculations.payroll_accrual
          - state_machines.HarvestPiece.APPROVED_to_DISPUTED
          - entities.Worker.fields.accrued_unpaid_cents
        distinguishing_aspect: |
          Conserved quantity: payroll money (a different quantity type from substrate mass).
          The approve/dispute pair adds then subtracts the same per-piece final_pay_cents
          (2040), returning worker.accrued_unpaid_cents to exactly 0 with no cent of drift.
        test_recipe:
          setup:
            - "Batch SPAWNED; cycle rc1 FRUITING at clock 2026-05-08; flush f1 GRADED 60/30/10 (total 100.0)"
            - "Worker w1 (rate 50) with LOGGED piece p1 of 40.0 kg; accrued_unpaid_cents == 0"
          setup_api_calls:
            - { call: "POST /api/varieties", payload: { variety_code: "WB1", display_name: "White Button", substrate_recipe: "PHASE_II_COMPOST", target_bioefficiency_pct: 25.0, shelf_life_days: 5, spawn_run_days: 3, casing_days: 2, max_flushes: 3, flush_yield_distribution: [0.5, 0.3, 0.2] }, as: CompostSupervisor, captures: { v_id: $.data.id } }
            - { call: "POST /api/pasteurization-tunnels", payload: { tunnel_code: "T1", capacity_tonnes: 100.0 }, as: CompostSupervisor, captures: { t_id: $.data.id } }
            - { call: "POST /api/rooms", payload: { room_code: "R1", capacity_tonnes: 50.0 }, as: FarmManager, captures: { r_id: $.data.id, r_v: $.data.version } }
            - { call: "POST /api/substrate-batches", payload: { recipe: "PHASE_II_COMPOST", tonnage: 40.0 }, as: CompostSupervisor, captures: { b_id: $.data.id } }
            - { call: "POST /api/pasteurization-cycles", payload: { batch_id: "${b_id}", tunnel_id: "${t_id}", planned_start: "2026-05-01T00:00:00Z", planned_end: "2026-05-02T00:00:00Z" }, as: CompostSupervisor, captures: { pc_id: $.data.id } }
            - { call: "POST /api/pasteurization-cycles/${pc_id}/start", payload: {}, as: CompostSupervisor }
            - { call: "POST /api/pasteurization-cycles/${pc_id}/complete", payload: { hours_at_target_temp: 8.0 }, as: CompostSupervisor }
            - { call: "POST /api/substrate-batches/${b_id}/spawn", payload: { variety_id: "${v_id}", spawn_kg: 280.0 }, as: CompostSupervisor }
            - { call: "POST /api/room-cycles", payload: { room_id: "${r_id}", batch_id: "${b_id}", allocated_tonnage: 40.0, planned_start: "2026-05-03T00:00:00Z", planned_end: "2026-06-14T00:00:00Z", expected_room_version: "${r_v}" }, as: FarmManager, captures: { rc_id: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-05-03T00:00:00Z" }, as: FarmManager }
            - { call: "POST /api/room-cycles/${rc_id}/place", payload: {}, as: FarmManager }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-05-06T00:00:00Z" }, as: FarmManager }
            - { call: "POST /api/room-cycles/${rc_id}/advance", payload: {}, as: FarmManager }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-05-08T00:00:00Z" }, as: FarmManager }
            - { call: "POST /api/room-cycles/${rc_id}/advance", payload: {}, as: FarmManager }
            - { call: "POST /api/room-cycles/${rc_id}/flushes", payload: { total_kg: 100.0 }, as: FarmManager, captures: { f_id: $.data.id } }
            - { call: "POST /api/workers", payload: { full_name: "Wanda Picker", crew_code: "C1", piece_rate_cents_per_kg: 50 }, as: FarmManager, captures: { w_id: $.data.id } }
            - { call: "POST /api/flushes/${f_id}/pieces", payload: { worker_id: "${w_id}", kg_picked: 40.0 }, as: HarvestCrewLead, as_user_id: "${w_id}", captures: { p_id: $.data.id } }
            - { call: "POST /api/flushes/${f_id}/grade", payload: { grade_a_kg: 60.0, grade_b_kg: 30.0, cull_kg: 10.0 }, as: GradingInspector }
          trigger:
            - { call: "POST /api/pieces/${p_id}/approve", payload: {}, as: PayrollClerk }
            - { call: "GET /api/workers/${w_id}", payload: {}, as: Any, captures: { accrual_mid: $.data.accrued_unpaid_cents } }
            - { call: "POST /api/pieces/${p_id}/dispute", payload: {}, as: PayrollClerk }
            - { call: "GET /api/workers/${w_id}", payload: {}, as: Any, captures: { accrual_end: $.data.accrued_unpaid_cents } }
          assert:
            - "After approve: Worker.${w_id}.accrued_unpaid_cents == 2040"
            - "After dispute: Worker.${w_id}.accrued_unpaid_cents == 0 (exactly the pre-pair value; conserved)"
            - "HarvestPiece.${p_id}.status == DISPUTED with final_pay_cents retained at 2040 for audit"
            - "Worker.${w_id}.lifetime_paid_cents == 0 (nothing was ever paid out)"
