  instances:
  - name: cascade_effects_are_visible_in_the_same_response
    claim_type: immediate
    grounds:
    - complexity_profile.consistency_model
    - state_machines.JuniorLien.DEMAND_SENT_to_APPROVED
    - entities.ShortSaleCase.fields.junior_contribution_total_cents
    distinguishing_aspect: 'The consistency model is immediate: the junior-lien APPROVE response already carries approved_contribution_cents 600000, and an immediately following read of the case shows junior_contribution_total_cents
      600000 with no intervening call or delay.'
    test_recipe:
      setup:
      - One GSE case with a DEMAND_SENT JuniorLien at demand_cents 900000 and junior_contribution_total_cents 0.
      setup_api_calls:
