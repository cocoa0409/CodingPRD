        distinguishing_aspect: "Pure OCC probe inside DRAFT: PATCH with current version succeeds (v1->v2, photo_count 20->30); immediate replay of the same PATCH body with the OLD version is rejected 412 ERR_STALE_VERSION — two strictly sequential requests, no parallelism."
