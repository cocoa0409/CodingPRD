              payload: { wheel_id: "${wheel_id}", product_id: "${product_id}", cell_id: "CELL_A", window_start: "2026-08-12T12:00:00Z", window_end: "2026-08-12T14:00:00Z", planned_units: 43 }
              as: ProductionPlanner
