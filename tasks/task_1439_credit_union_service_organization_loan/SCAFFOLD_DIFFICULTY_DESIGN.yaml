            - { call: "POST /network/commitments/${cert_id}/approve-diligence", payload: {}, as: BuyerUser, as_user_id: "${buyer_id}" }
            - { call: "POST /network/commitments/${cert_id}/fund", payload: {}, as: BuyerUser, as_user_id: "${buyer_id}" }
            - { call: "POST /network/remittances", payload: { certificate_id: "${cert_id}", period_start: "2026-08-01T00:00:00Z", period_end: "2026-08-31T00:00:00Z", collections_cents: 5052083 }, as: OriginatorUser, as_user_id: "${orig_id}", captures: { rem_id: "$.data.id", rem_interest: "$.data.interest_portion_cents", rem_fee: "$.data.servicing_fee_cents", rem_principal: "$.data.principal_portion_cents" } }
