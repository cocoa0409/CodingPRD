              as: ChannelManager
              captures: { prog_b: $.data.id }
            - call: "POST /protein-ops/programs/${prog_b}/lifecycle"
              payload: { target_status: "ACTIVE" }
              as: ChannelManager
            - call: "POST /protein-ops/finished-goods-batches/${batch_id}/reserve"
              payload: { program_id: "${prog_a}", quantity_cases: 4 }
              as: ChannelManager
          trigger:
            - call: "POST /protein-ops/finished-goods-batches/${batch_id}/reserve"
              payload: { program_id: "${prog_b}", quantity_cases: 2 }
              as: ChannelManager
              captures: { err: $.data.error_id }
          assert:
