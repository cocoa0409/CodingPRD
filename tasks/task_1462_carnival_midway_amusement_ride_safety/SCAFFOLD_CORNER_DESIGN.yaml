            - { call: "POST /midway/rides", payload: { fair_id: "${fair_b}", name: "Ride B", manufacturer: "MFG", model: "X2", serial_number: "SN-EP-2", ride_class: "EXTREME", capacity_per_cycle: 2, min_rider_height_in: 52, max_rider_height_in: 84, wind_limit_mph: 20, cycle_inspection_interval: 2, annual_cert_expires_on: "2026-12-31" }, as: FairManager, as_user_id: "${sup_b}", captures: { ride_b: "$.data.id" } }
