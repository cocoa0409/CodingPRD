  - rule_id: compensating_invariant
    instances:
      - name: funding_pool_conserved_on_award_cancel
        grounds:
          - state_machines.Award.FUNDED_to_CANCELLED
          - state_machines.FundingAllocation.RESERVED_to_RELEASED
          - entities.FundingSource.fields.total_appropriation_cents
          - entities.FundingSource.fields.available_cents
        distinguishing_aspect: |
          Conserved quantity = FundingSource.total_appropriation_cents (the pool). The forward action
          (reserve 5,000,000) and its compensation (cancel -> release) leave available+reserved+disbursed
          == 10,000,000 unchanged; after cancel available returns to exactly 10,000,000 with reserved 0 and
          disbursed 0.
        test_recipe:
          setup:
            - "Fully funded SHARED_APPRECIATION award: 5,000,000 reserved from a 10,000,000 source (available 5,000,000, reserved 5,000,000, disbursed 0), award FUNDED, not closed."
