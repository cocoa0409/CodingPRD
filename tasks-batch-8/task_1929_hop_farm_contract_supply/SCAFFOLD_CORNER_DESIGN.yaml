# =============================================================================
# §1.9 Scaffold Corner Design — Task 1929 Hop Farm & Contract Supply
# Breadth coverage of every §1.1–§1.7 claim not already probed by §1.8.
# =============================================================================
scaffold_corner_design:
  - section: entities
    instances:
      - name: field_create_missing_required_returns_invalid_request
        claim_type: required_fields
        grounds:
          - entities.Field.fields.acreage
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "acreage is a required input with no default; omitting it yields ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/fields", payload: { name: "F1" }, as: FarmManager, captures: { err: $.data.error_id } }
          assert:
            - "captured err == ERR_INVALID_REQUEST"

      - name: field_create_system_id_input_ignored
        claim_type: system_fields
        grounds:
          - entities.Field
        distinguishing_aspect: "Client-supplied id in a create body is ignored; the server mints its own UUID."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/fields", payload: { name: "F1", acreage: 100, id: "00000000-0000-0000-0000-000000000000" }, as: FarmManager, captures: { real_id: $.data.id } }
          assert:
            - "captured real_id != '00000000-0000-0000-0000-000000000000' (server-minted, no type prefix)"

      - name: contract_get_not_found_returns_404
        claim_type: not_found
        grounds:
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET with a well-formed but non-existent UUID yields ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /api/contracts/00000000-0000-0000-0000-000000000000", payload: {}, as: ContractManager, captures: { err: $.data.error_id } }
          assert:
            - "captured err == ERR_NOT_FOUND"

      - name: plan_create_invalid_enum_returns_invalid_request
        claim_type: type_constraints
        grounds:
          - entities.PlantingPlan.fields.variety
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "variety outside {CASCADE, CENTENNIAL, CTZ, CITRA, MOSAIC} is rejected."
        test_recipe:
          setup: ["field F1 exists"]
          setup_api_calls:
            - { call: "POST /api/fields", payload: { name: "F1", acreage: 100 }, as: FarmManager, captures: { f_id: $.data.id } }
          trigger:
            - { call: "POST /api/planting-plans", payload: { field_id: "${f_id}", crop_year: 2026, variety: "GALAXY", planned_acreage: 40 }, as: FarmManager, captures: { err: $.data.error_id } }
          assert:
            - "captured err == ERR_INVALID_REQUEST"

      - name: plan_projected_yield_computed
        claim_type: computed_fields
        grounds:
          - entities.PlantingPlan.fields.projected_yield_lbs
          - calculations.projected_yield
        distinguishing_aspect: "projected_yield_lbs is server-computed as planned_acreage x variety base yield: 40 x 1800 == 72000 for CASCADE."
        test_recipe:
          setup: ["field F1 exists"]
          setup_api_calls:
            - { call: "POST /api/fields", payload: { name: "F1", acreage: 100 }, as: FarmManager, captures: { f_id: $.data.id } }
          trigger:
            - { call: "POST /api/planting-plans", payload: { field_id: "${f_id}", crop_year: 2026, variety: "CASCADE", planned_acreage: 40 }, as: FarmManager, captures: { py: $.data.projected_yield_lbs } }
          assert:
            - "captured py == 72000"

      - name: claim_default_coverage_applied
        claim_type: defaults
        grounds:
          - entities.InsuranceClaim.fields.coverage_pct
          - calculations.indemnity_payment
        distinguishing_aspect: "Omitting coverage_pct applies the 0.75 default: guarantee_lbs == 54000 for a 40-acre CASCADE plan."
        test_recipe:
          setup: ["CASCADE 2026 plan (40 ac) APPROVED->GROWING"]
          setup_api_calls:
            - { call: "POST /api/fields", payload: { name: "F1", acreage: 100 }, as: FarmManager, captures: { f_id: $.data.id } }
            - { call: "POST /api/planting-plans", payload: { field_id: "${f_id}", crop_year: 2026, variety: "CASCADE", planned_acreage: 40 }, as: FarmManager, captures: { p_id: $.data.id } }
            - { call: "POST /api/planting-plans/${p_id}/approve", payload: {}, as: FarmManager }
          trigger:
            - { call: "POST /api/insurance-claims", payload: { planting_plan_id: "${p_id}", price_election_cents_per_lb: 300 }, as: FarmManager, as_user_id: "grower-1", captures: { cov: $.data.coverage_pct, guar: $.data.guarantee_lbs } }
          assert:
            - "captured cov == 0.75 and guar == 54000"

      - name: labtest_immutability
        claim_type: immutability
        grounds:
          - entities.LabTest
        distinguishing_aspect: "LabTest has common_fields false: its read response carries no version or updated_at keys, and no update endpoint exists."
        test_recipe:
          setup: ["one DRIED lot with a PROVISIONAL test posted"]
          setup_api_calls:
            - { call: "POST /api/fields", payload: { name: "F1", acreage: 100 }, as: FarmManager, captures: { f_id: $.data.id } }
            - { call: "POST /api/planting-plans", payload: { field_id: "${f_id}", crop_year: 2026, variety: "CASCADE", planned_acreage: 40 }, as: FarmManager, captures: { p_id: $.data.id } }
            - { call: "POST /api/planting-plans/${p_id}/approve", payload: {}, as: FarmManager }
            - { call: "POST /api/planting-plans/${p_id}/open-harvest", payload: {}, as: FarmManager }
            - { call: "POST /api/kilns", payload: { name: "K1" }, as: FarmManager, captures: { k_id: $.data.id } }
            - { call: "POST /api/harvest-lots", payload: { planting_plan_id: "${p_id}", wet_lbs: 1875 }, as: FarmManager, captures: { lot_id: $.data.id } }
            - { call: "POST /api/harvest-lots/${lot_id}/load-kiln", payload: { kiln_id: "${k_id}", kiln_window_start: "2026-08-20T08:00:00Z", kiln_window_end: "2026-08-20T12:00:00Z" }, as: FarmManager }
            - { call: "POST /api/harvest-lots/${lot_id}/finish-drying", payload: { dried_lbs: 500 }, as: FarmManager }
            - { call: "POST /api/harvest-lots/${lot_id}/release", payload: {}, as: FarmManager }
            - { call: "POST /api/lab-tests", payload: { harvest_lot_id: "${lot_id}", test_type: "PROVISIONAL", alpha_pct: 12.0 }, as: LabTechnician, captures: { t_id: $.data.id } }
          trigger:
            - { call: "GET /api/lab-tests/${t_id}", payload: {}, as: LabTechnician }
          assert:
            - "response data contains id, created_at, harvest_lot_id, test_type, alpha_pct"
            - "response data contains no 'version' key and no 'updated_at' key"

      - name: pellet_lot_listing_pagination
        claim_type: listing
        grounds:
          - endpoints
          - response_envelope
        distinguishing_aspect: "GET /api/pellet-lots honors limit/offset with total_count and has_more envelope fields."
        test_recipe:
          setup: ["two AVAILABLE pellet lots (920 and 736 lbs) exist"]
          setup_api_calls:
            - { call: "POST /api/fields", payload: { name: "F1", acreage: 100 }, as: FarmManager, captures: { f_id: $.data.id } }
            - { call: "POST /api/planting-plans", payload: { field_id: "${f_id}", crop_year: 2026, variety: "CASCADE", planned_acreage: 40 }, as: FarmManager, captures: { p_id: $.data.id } }
            - { call: "POST /api/planting-plans/${p_id}/approve", payload: {}, as: FarmManager }
            - { call: "POST /api/planting-plans/${p_id}/open-harvest", payload: {}, as: FarmManager }
            - { call: "POST /api/kilns", payload: { name: "K1" }, as: FarmManager, captures: { k_id: $.data.id } }
            - { call: "POST /api/harvest-lots", payload: { planting_plan_id: "${p_id}", wet_lbs: 3750 }, as: FarmManager, captures: { lot1: $.data.id } }
            - { call: "POST /api/harvest-lots/${lot1}/load-kiln", payload: { kiln_id: "${k_id}", kiln_window_start: "2026-08-20T08:00:00Z", kiln_window_end: "2026-08-20T12:00:00Z" }, as: FarmManager }
            - { call: "POST /api/harvest-lots/${lot1}/finish-drying", payload: { dried_lbs: 1000 }, as: FarmManager }
            - { call: "POST /api/harvest-lots/${lot1}/release", payload: {}, as: FarmManager }
            - { call: "POST /api/harvest-lots", payload: { planting_plan_id: "${p_id}", wet_lbs: 3000 }, as: FarmManager, captures: { lot2: $.data.id } }
            - { call: "POST /api/harvest-lots/${lot2}/load-kiln", payload: { kiln_id: "${k_id}", kiln_window_start: "2026-08-20T12:30:00Z", kiln_window_end: "2026-08-20T16:00:00Z" }, as: FarmManager }
            - { call: "POST /api/harvest-lots/${lot2}/finish-drying", payload: { dried_lbs: 800 }, as: FarmManager }
            - { call: "POST /api/harvest-lots/${lot2}/release", payload: {}, as: FarmManager }
            - { call: "POST /api/pellet-lots", payload: { source_lot_ids: ["${lot1}"], storage_room: "R1" }, as: FarmManager, captures: { pl1: $.data.id } }
            - { call: "POST /api/pellet-lots", payload: { source_lot_ids: ["${lot2}"], storage_room: "R1" }, as: FarmManager, captures: { pl2: $.data.id } }
          trigger:
            - { call: "GET /api/pellet-lots?limit=1&offset=0", payload: {}, as: FarmManager, captures: { first: "$.data[0].id" } }
            - { call: "GET /api/pellet-lots?limit=1&offset=1", payload: {}, as: FarmManager, captures: { second: "$.data[0].id" } }
          assert:
            - "first page: exactly 1 item, total_count == 2, has_more == true"
            - "second page: captured second != captured first, has_more == false"

  - section: state_machines
    instances:
      - name: plan_open_harvest_from_draft_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.PlantingPlan
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "open-harvest is defined only from GROWING; from DRAFT it fails with ERR_INVALID_STATE."
        test_recipe:
          setup: ["plan in DRAFT"]
          setup_api_calls:
            - { call: "POST /api/fields", payload: { name: "F1", acreage: 100 }, as: FarmManager, captures: { f_id: $.data.id } }
            - { call: "POST /api/planting-plans", payload: { field_id: "${f_id}", crop_year: 2026, variety: "CASCADE", planned_acreage: 40 }, as: FarmManager, captures: { p_id: $.data.id } }
          trigger:
            - { call: "POST /api/planting-plans/${p_id}/open-harvest", payload: {}, as: FarmManager, captures: { err: $.data.error_id } }
          assert:
            - "captured err == ERR_INVALID_STATE"

      - name: allocation_cancel_from_settled_returns_invalid_state
        claim_type: terminal_lockdown
        grounds:
          - state_machines.Allocation
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "SETTLED is terminal; cancel from SETTLED fails with ERR_INVALID_STATE and leaves settlement fields intact."
        test_recipe:
          setup: ["allocation settled (pellet 736 @ final 12.0, contract vol 736, confirmed, delivered, settled)"]
          setup_api_calls:
            - { call: "POST /api/fields", payload: { name: "F1", acreage: 100 }, as: FarmManager, captures: { f_id: $.data.id } }
            - { call: "POST /api/planting-plans", payload: { field_id: "${f_id}", crop_year: 2026, variety: "CASCADE", planned_acreage: 40 }, as: FarmManager, captures: { p_id: $.data.id } }
            - { call: "POST /api/planting-plans/${p_id}/approve", payload: {}, as: FarmManager }
            - { call: "POST /api/planting-plans/${p_id}/open-harvest", payload: {}, as: FarmManager }
            - { call: "POST /api/kilns", payload: { name: "K1" }, as: FarmManager, captures: { k_id: $.data.id } }
            - { call: "POST /api/harvest-lots", payload: { planting_plan_id: "${p_id}", wet_lbs: 3000 }, as: FarmManager, captures: { lot_id: $.data.id } }
            - { call: "POST /api/harvest-lots/${lot_id}/load-kiln", payload: { kiln_id: "${k_id}", kiln_window_start: "2026-08-20T08:00:00Z", kiln_window_end: "2026-08-20T12:00:00Z" }, as: FarmManager }
            - { call: "POST /api/harvest-lots/${lot_id}/finish-drying", payload: { dried_lbs: 800 }, as: FarmManager }
            - { call: "POST /api/harvest-lots/${lot_id}/release", payload: {}, as: FarmManager }
            - { call: "POST /api/lab-tests", payload: { harvest_lot_id: "${lot_id}", test_type: "PROVISIONAL", alpha_pct: 12.0 }, as: LabTechnician }
            - { call: "POST /api/lab-tests", payload: { harvest_lot_id: "${lot_id}", test_type: "FINAL", alpha_pct: 12.0 }, as: LabTechnician }
            - { call: "POST /api/pellet-lots", payload: { source_lot_ids: ["${lot_id}"], storage_room: "R1" }, as: FarmManager, captures: { pellet_id: $.data.id } }
            - { call: "POST /api/contracts", payload: { brewery_name: "BrewCo", variety: "CASCADE", term_start_year: 2026, term_end_year: 2028, annual_volume_lbs: 736, base_price_cents_per_lb: 500, alpha_floor_pct: 12.0, alpha_premium_cents_per_point: 40, alpha_discount_cents_per_point: 60 }, as: ContractManager, captures: { c_id: $.data.id } }
            - { call: "POST /api/contracts/${c_id}/activate", payload: {}, as: ContractManager }
            - { call: "POST /api/allocation-runs", payload: { crop_year: 2026, variety: "CASCADE" }, as: ContractManager }
            - { call: "GET /api/allocations", payload: {}, as: ContractManager, captures: { a_id: "$.data[0].id" } }
            - { call: "POST /api/allocations/${a_id}/confirm", payload: {}, as: ContractManager }
            - { call: "POST /api/allocations/${a_id}/deliver", payload: {}, as: ContractManager }
            - { call: "POST /api/allocations/${a_id}/settle", payload: {}, as: ContractManager }
          trigger:
            - { call: "POST /api/allocations/${a_id}/cancel", payload: {}, as: ContractManager, captures: { err: $.data.error_id } }
            - { call: "GET /api/allocations/${a_id}", payload: {}, as: ContractManager, captures: { st: $.data.status, total: $.data.settlement_total_cents } }
          assert:
            - "captured err == ERR_INVALID_STATE"
            - "captured st == SETTLED and total == 368000 (unchanged)"

      - name: contract_created_in_draft_initial_state
        claim_type: initial_state
        grounds:
          - state_machines.Contract
        distinguishing_aspect: "A newly created contract starts in DRAFT with consecutive_shortfall_years 0 and version 1; GET agrees with the create response."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/contracts", payload: { brewery_name: "BrewCo", variety: "CASCADE", term_start_year: 2026, term_end_year: 2028, annual_volume_lbs: 736, base_price_cents_per_lb: 500, alpha_floor_pct: 12.0, alpha_premium_cents_per_point: 40, alpha_discount_cents_per_point: 60 }, as: ContractManager, captures: { c_id: $.data.id, st: $.data.status, v: $.data.version } }
            - { call: "GET /api/contracts/${c_id}", payload: {}, as: ContractManager, captures: { st2: $.data.status } }
          assert:
            - "captured st == DRAFT and v == 1; captured st2 == DRAFT (immediate consistency)"

      - name: plan_complete_blocked_by_lots_in_kiln
        claim_type: precondition_enforcement
        grounds:
          - state_machines.PlantingPlan.transitions
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "complete requires the kiln pipeline empty; a lot still IN_KILN blocks completion."
        test_recipe:
          setup: ["plan HARVESTING with one lot IN_KILN"]
          setup_api_calls:
            - { call: "POST /api/fields", payload: { name: "F1", acreage: 100 }, as: FarmManager, captures: { f_id: $.data.id } }
            - { call: "POST /api/planting-plans", payload: { field_id: "${f_id}", crop_year: 2026, variety: "CASCADE", planned_acreage: 40 }, as: FarmManager, captures: { p_id: $.data.id } }
            - { call: "POST /api/planting-plans/${p_id}/approve", payload: {}, as: FarmManager }
            - { call: "POST /api/planting-plans/${p_id}/open-harvest", payload: {}, as: FarmManager }
            - { call: "POST /api/kilns", payload: { name: "K1" }, as: FarmManager, captures: { k_id: $.data.id } }
            - { call: "POST /api/harvest-lots", payload: { planting_plan_id: "${p_id}", wet_lbs: 1000 }, as: FarmManager, captures: { lot_id: $.data.id } }
            - { call: "POST /api/harvest-lots/${lot_id}/load-kiln", payload: { kiln_id: "${k_id}", kiln_window_start: "2026-08-20T08:00:00Z", kiln_window_end: "2026-08-20T12:00:00Z" }, as: FarmManager }
          trigger:
            - { call: "POST /api/planting-plans/${p_id}/complete", payload: {}, as: FarmManager, captures: { err: $.data.error_id } }
          assert:
            - "captured err == ERR_INVALID_STATE"

      - name: contract_suspend_reinstate_cycle
        claim_type: valid_transition
        grounds:
          - state_machines.Contract.ACTIVE_to_SUSPENDED
          - state_machines.Contract.SUSPENDED_to_ACTIVE
        distinguishing_aspect: "The ACTIVE <-> SUSPENDED cycle is traversable: activate, suspend, reinstate returns the contract to ACTIVE with version incrementing by 1 per mutation."
        test_recipe:
          setup: ["contract exists (DRAFT)"]
          setup_api_calls:
            - { call: "POST /api/contracts", payload: { brewery_name: "BrewCo", variety: "CASCADE", term_start_year: 2026, term_end_year: 2028, annual_volume_lbs: 736, base_price_cents_per_lb: 500, alpha_floor_pct: 12.0, alpha_premium_cents_per_point: 40, alpha_discount_cents_per_point: 60 }, as: ContractManager, captures: { c_id: $.data.id } }
          trigger:
            - { call: "POST /api/contracts/${c_id}/activate", payload: {}, as: ContractManager, captures: { s1: $.data.status } }
            - { call: "POST /api/contracts/${c_id}/suspend", payload: {}, as: ContractManager, captures: { s2: $.data.status } }
            - { call: "POST /api/contracts/${c_id}/reinstate", payload: {}, as: ContractManager, captures: { s3: $.data.status, v3: $.data.version } }
          assert:
            - "captured s1 == ACTIVE, s2 == SUSPENDED, s3 == ACTIVE"
            - "captured v3 == 4 (create 1 + three transitions)"

      - name: kiln_release_frees_window
        claim_type: side_effect_execution
        grounds:
          - state_machines.HarvestLot.MOISTURE_CHECK_to_DRIED
          - calculations.kiln_window_conflict
        distinguishing_aspect: "Releasing a lot removes it from the kiln's occupying set: a later lot may load the identical window on the same kiln."
        test_recipe:
          setup: ["lot A DRIED (window 08:00-12:00 released); lot B HARVESTED"]
          setup_api_calls:
            - { call: "POST /api/fields", payload: { name: "F1", acreage: 100 }, as: FarmManager, captures: { f_id: $.data.id } }
            - { call: "POST /api/planting-plans", payload: { field_id: "${f_id}", crop_year: 2026, variety: "CASCADE", planned_acreage: 40 }, as: FarmManager, captures: { p_id: $.data.id } }
            - { call: "POST /api/planting-plans/${p_id}/approve", payload: {}, as: FarmManager }
            - { call: "POST /api/planting-plans/${p_id}/open-harvest", payload: {}, as: FarmManager }
            - { call: "POST /api/kilns", payload: { name: "K1" }, as: FarmManager, captures: { k_id: $.data.id } }
            - { call: "POST /api/harvest-lots", payload: { planting_plan_id: "${p_id}", wet_lbs: 1000 }, as: FarmManager, captures: { lot_a: $.data.id } }
            - { call: "POST /api/harvest-lots/${lot_a}/load-kiln", payload: { kiln_id: "${k_id}", kiln_window_start: "2026-08-20T08:00:00Z", kiln_window_end: "2026-08-20T12:00:00Z" }, as: FarmManager }
            - { call: "POST /api/harvest-lots/${lot_a}/finish-drying", payload: { dried_lbs: 263 }, as: FarmManager }
            - { call: "POST /api/harvest-lots/${lot_a}/release", payload: {}, as: FarmManager }
            - { call: "POST /api/harvest-lots", payload: { planting_plan_id: "${p_id}", wet_lbs: 1000 }, as: FarmManager, captures: { lot_b: $.data.id } }
          trigger:
            - { call: "POST /api/harvest-lots/${lot_b}/load-kiln", payload: { kiln_id: "${k_id}", kiln_window_start: "2026-08-20T08:00:00Z", kiln_window_end: "2026-08-20T12:00:00Z" }, as: FarmManager, captures: { b_st: $.data.status } }
          assert:
            - "captured b_st == IN_KILN (identical window accepted after A's release)"

  - section: calculations
    instances:
      - name: kiln_moisture_correct_result
        claim_type: correct_result
        grounds:
          - calculations.kiln_moisture
        distinguishing_aspect: "wet 1000, dried 280 -> moisture_pct == 14.3 via round_half_up((280 - 0.24 x 1000) / 280 x 100, 1)."
        test_recipe:
          setup: ["plan HARVESTING; lot wet 1000 loaded in kiln"]
          setup_api_calls:
            - { call: "POST /api/fields", payload: { name: "F1", acreage: 100 }, as: FarmManager, captures: { f_id: $.data.id } }
            - { call: "POST /api/planting-plans", payload: { field_id: "${f_id}", crop_year: 2026, variety: "CASCADE", planned_acreage: 40 }, as: FarmManager, captures: { p_id: $.data.id } }
            - { call: "POST /api/planting-plans/${p_id}/approve", payload: {}, as: FarmManager }
            - { call: "POST /api/planting-plans/${p_id}/open-harvest", payload: {}, as: FarmManager }
            - { call: "POST /api/kilns", payload: { name: "K1" }, as: FarmManager, captures: { k_id: $.data.id } }
            - { call: "POST /api/harvest-lots", payload: { planting_plan_id: "${p_id}", wet_lbs: 1000 }, as: FarmManager, captures: { lot_id: $.data.id } }
            - { call: "POST /api/harvest-lots/${lot_id}/load-kiln", payload: { kiln_id: "${k_id}", kiln_window_start: "2026-08-20T08:00:00Z", kiln_window_end: "2026-08-20T12:00:00Z" }, as: FarmManager }
          trigger:
            - { call: "POST /api/harvest-lots/${lot_id}/finish-drying", payload: { dried_lbs: 280 }, as: FarmManager, captures: { m: $.data.moisture_pct } }
          assert:
            - "captured m == 14.3"

      - name: moisture_exactly_at_threshold_release_allowed
        claim_type: boundary_edge
        grounds:
          - calculations.kiln_moisture
          - state_machines.HarvestLot.MOISTURE_CHECK_to_DRIED
        distinguishing_aspect: "wet 900, dried 240 -> moisture_pct == 10.0 exactly; the <= gate admits it (DRIED)."
        test_recipe:
          setup: ["plan HARVESTING; lot wet 900 loaded in kiln"]
          setup_api_calls:
            - { call: "POST /api/fields", payload: { name: "F1", acreage: 100 }, as: FarmManager, captures: { f_id: $.data.id } }
            - { call: "POST /api/planting-plans", payload: { field_id: "${f_id}", crop_year: 2026, variety: "CASCADE", planned_acreage: 40 }, as: FarmManager, captures: { p_id: $.data.id } }
            - { call: "POST /api/planting-plans/${p_id}/approve", payload: {}, as: FarmManager }
            - { call: "POST /api/planting-plans/${p_id}/open-harvest", payload: {}, as: FarmManager }
            - { call: "POST /api/kilns", payload: { name: "K1" }, as: FarmManager, captures: { k_id: $.data.id } }
            - { call: "POST /api/harvest-lots", payload: { planting_plan_id: "${p_id}", wet_lbs: 900 }, as: FarmManager, captures: { lot_id: $.data.id } }
