        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One WAIVED site with ACTIVE waiver coverage."
            - "op_trained is trained (PROVISIONAL x ACTIVE); op_locked is never trained, so it is PENDING x LOCKED_OUT with lockout_reason TRAINING_INCOMPLETE."
            - "One ACTIVE INTERFACED device."
