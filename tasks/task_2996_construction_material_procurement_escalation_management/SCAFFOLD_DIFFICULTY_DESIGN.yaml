        payload: {project_id: '${proj_id}', scope_code: STRUCT-STEEL-02, description: 'Structural steel frame package, area B', commodity_index_code: PPI_STEEL_MILL, estimated_cost: '1200000.00', required_onsite_date: '2027-03-01T00:00:00.000Z', fabrication_duration_days: 70, delivery_transit_days: 20, submittal_review_days: 21}
        as: BuyoutManager
        captures: {pkg2_id: $.data.id}
      - call: POST /procurement/suppliers
        payload: {legal_name: Northline Steel Mills, country_of_origin: US, declared_tariff_rate_pct: '0.00'}
        as: BuyoutManager
        captures: {sup2_id: $.data.id}
      - call: POST /procurement/substitution-requests
        payload: {material_package_id: '${pkg_id}', proposed_supplier_id: '${sup2_id}', driver: VALUE_ENGINEERING, proposed_product: Alternate HSS section from mill B, cost_delta: '45000.00', schedule_delta_days: 12}
        as: BuyoutManager
        captures: {sr_a_id: $.data.id}
      - call: POST /procurement/substitution-requests
        payload: {material_package_id: '${pkg2_id}', proposed_supplier_id: '${sup2_id}', driver: VALUE_ENGINEERING, proposed_product: Alternate HSS section from mill B, cost_delta: '45000.00', schedule_delta_days: 12}
        as: BuyoutManager
