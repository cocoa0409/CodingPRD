      - name: night_audit_noshow_cascade_charge_and_block_pickup_depth2
        grounds:
          - state_machines.NightAuditRun.IN_PROGRESS_to_COMPLETED
          - state_machines.Reservation.CONFIRMED_to_NO_SHOW
          - calculations.no_show_charge
          - calculations.block_pickup
          - entities.GroupBlock.fields.picked_up_rooms
          - entities.Folio.fields.room_charges_cents
        distinguishing_aspect: |
          Depth-2 chain from a DIFFERENT trigger (night-audit complete, vs the
          check-out trigger of the first cascade): audit -> Reservation
          CONFIRMED->NO_SHOW -> (that NO_SHOW) drops GroupBlock.picked_up_rooms and
          posts a no-show charge onto the folio; the block-pickup decrement is caused
