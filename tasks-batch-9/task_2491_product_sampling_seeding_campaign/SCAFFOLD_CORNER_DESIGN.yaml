  # ===========================================================================
  # Declared layers: optimistic_concurrency, cascading_side_effects,
  # dual_variant_calculation, rate_threshold_triggers, selector_policy.
  # Both §1.2.1 concurrency rules get their own stale-version instance below.
  - section: cross_cutting_complexity_layers
    instances:

      - name: occ_lift_analysis_rejects_stale_expected_campaign_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[lift-analysis-create-stale-campaign]
          - errors[ERR_STALE_CAMPAIGN_VERSION]
          - validations[priority=12]
          - endpoints[POST /lift-analyses]
        distinguishing_aspect: "The full OCC cycle on the Campaign parent: the first analysis succeeds with the observed version AND bumps Campaign.version as a side effect, so replaying the same expected_campaign_version is 412; re-reading the campaign and retrying succeeds and only then does the first analysis get superseded. This pins that the version the client must send is the campaign's, that a create is a write on the parent, and that a rejected create supersedes nothing."
        test_recipe:
          setup:
            - "One campaign in REVIEW_WINDOW with a single SCREEN_PASSED non-holdout enrollment, no shipments and no purchase matches."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /campaigns"
              payload: { name: "OCC Lift", objective_type: "AWARENESS", target_segment_codes: ["URBAN_MILLENNIAL"], syndication_retailer_ids: [], sampling_window_start: "2026-07-01T00:00:00Z", sampling_window_end: "2026-09-30T00:00:00Z", budget_total_cents: 1000000, holdout_pct: 0.0 }
              as: CampaignManager
              captures: { camp_id: $.data.id }
            - call: "POST /kit-lines"
              payload: { campaign_id: "${camp_id}", component_sku: "HERO-1", component_role: "HERO_PRODUCT", unit_cost_cents: 1417, quantity_per_kit: 1, component_discount_pct: 0.8 }
              as: CampaignManager
              captures: { kl1_id: $.data.id }
            - call: "POST /kit-lines/${kl1_id}/receipts"
              payload: { units: 10 }
              as: FulfillmentOps
            - call: "POST /campaigns/${camp_id}/open-screening"
              payload: {}
              as: CampaignManager
            - call: "POST /panelists"
              payload: { email: "oc2@example.com", display_name: "OC Two", address_hash: "H-OC2", account_opened_at: "2026-01-01T00:00:00Z", segment_code: "URBAN_MILLENNIAL" }
              as: Anonymous
              captures: { p1_id: $.data.id }
            - call: "POST /enrollments"
              payload: { campaign_id: "${camp_id}", panelist_id: "${p1_id}", screening_answers: { household_size: 3, attests_no_resale: true } }
              as: CampaignManager
              captures: { e1_id: $.data.id }
            - call: "POST /enrollments/${e1_id}/screen"
              payload: {}
              as: CampaignManager
            - call: "POST /campaigns/${camp_id}/activate-sampling"
              payload: {}
              as: CampaignManager
            - call: "POST /campaigns/${camp_id}/open-review-window"
              payload: {}
              as: CampaignManager
            - call: "GET /campaigns/${camp_id}"
              payload: {}
              as: CampaignManager
              captures: { camp_v: $.data.version }
          trigger:
            - call: "POST /lift-analyses"
              payload: { campaign_id: "${camp_id}", variant: "ITT", expected_campaign_version: "${camp_v}" }
              as: CampaignManager
              captures: { la1_id: $.data.id }
            - call: "POST /lift-analyses"
              payload: { campaign_id: "${camp_id}", variant: "ITT", expected_campaign_version: "${camp_v}" }
              as: CampaignManager
              captures: { err_id: $.data.error_id }
            - call: "GET /campaigns/${camp_id}"
              payload: {}
              as: CampaignManager
              captures: { camp_v2: $.data.version }
            - call: "POST /lift-analyses"
              payload: { campaign_id: "${camp_id}", variant: "ITT", expected_campaign_version: "${camp_v2}" }
              as: CampaignManager
              captures: { la2_id: $.data.id }
          assert:
            - "the first create returns HTTP status == 201 with treated_count == 1, holdout_count == 0, treated_conversion_rate == 0.0, holdout_conversion_rate == 0.0, lift_pct == 0.0 and power_status == INSUFFICIENT_POWER"
            - "the first create also returns effective_sample_count == 0, base_cost_per_sample_cents == 0, penalty_rate_pct == 10, diversion_penalty_cents == 0 and adjusted_cost_per_sample_cents == 0"
            - "the replayed create returns HTTP status == 412"
            - "${err_id} == ERR_STALE_CAMPAIGN_VERSION"
            - "${camp_v2} == ${camp_v} + 1 (only the successful create advanced the campaign)"
            - "the retry with the refreshed version returns HTTP status == 201 and ${la2_id} != ${la1_id}"
            - "LiftAnalysis.${la1_id}.superseded == true and LiftAnalysis.${la2_id}.superseded == false"
            - "GET /lift-analyses?campaign_id=${camp_id} returns total_count == 2 (the 412 created nothing)"

      - name: occ_allocation_rejects_stale_expected_enrollment_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[reship-create-stale-enrollment]
          - errors[ERR_STALE_ENROLLMENT_VERSION]
          - validations[priority=12]
          - endpoints[POST /sample-shipments]
        distinguishing_aspect: "The second concurrency rule, with a different parent entity and a different OCC field: screening bumps Enrollment.version, so an allocator holding the pre-screen version is refused with 412 — and because the OCC check sits at priority 12, ahead of capacity, stock and budget, the rejection leaves kit units, wave counts and campaign budget completely untouched. Retrying with the current version then succeeds."
        test_recipe:
          setup:
            - "One campaign in SAMPLING_ACTIVE with a single ACTIVE kit line holding 10 units (kit_unit_total 1, kit cost 283, freight 300, so a shipment commits 583)."
            - "One screened non-holdout enrollment; the pre-screen version and the post-screen version are both captured."
            - "One PLANNED wave with ample capacity."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /campaigns"
              payload: { name: "OCC Allocate", objective_type: "TRIAL_GENERATION", target_segment_codes: ["URBAN_MILLENNIAL"], syndication_retailer_ids: [], sampling_window_start: "2026-07-01T00:00:00Z", sampling_window_end: "2026-09-30T00:00:00Z", budget_total_cents: 1000000, holdout_pct: 0.0 }
              as: CampaignManager
              captures: { camp_id: $.data.id }
            - call: "POST /kit-lines"
              payload: { campaign_id: "${camp_id}", component_sku: "HERO-1", component_role: "HERO_PRODUCT", unit_cost_cents: 1417, quantity_per_kit: 1, component_discount_pct: 0.8 }
              as: CampaignManager
              captures: { kl1_id: $.data.id }
            - call: "POST /kit-lines/${kl1_id}/receipts"
              payload: { units: 10 }
              as: FulfillmentOps
            - call: "POST /campaigns/${camp_id}/open-screening"
              payload: {}
              as: CampaignManager
            - call: "POST /panelists"
              payload: { email: "oa1@example.com", display_name: "OA One", address_hash: "H-OA1", account_opened_at: "2026-01-01T00:00:00Z", segment_code: "URBAN_MILLENNIAL" }
              as: Anonymous
              captures: { p1_id: $.data.id }
            - call: "POST /enrollments"
              payload: { campaign_id: "${camp_id}", panelist_id: "${p1_id}", screening_answers: { household_size: 3, attests_no_resale: true } }
              as: CampaignManager
              captures: { e1_id: $.data.id, e1_v0: $.data.version }
            - call: "POST /enrollments/${e1_id}/screen"
              payload: {}
              as: CampaignManager
              captures: { e1_v1: $.data.version }
            - call: "POST /campaigns/${camp_id}/activate-sampling"
              payload: {}
              as: CampaignManager
            - call: "POST /fulfillment-centers"
              payload: { name: "North Pick Center", zone_code: "Z-NORTH", daily_pick_capacity_units: 100, freight_cents_per_kit: 300 }
              as: FulfillmentOps
              captures: { fc1_id: $.data.id }
            - call: "POST /fulfillment-waves"
              payload: { fulfillment_center_id: "${fc1_id}", window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-02T00:00:00Z", planned_capacity_units: 50 }
              as: FulfillmentOps
              captures: { w1_id: $.data.id }
          trigger:
            - call: "POST /sample-shipments"
              payload: { enrollment_id: "${e1_id}", fulfillment_wave_id: "${w1_id}", expected_enrollment_version: "${e1_v0}" }
              as: FulfillmentOps
              captures: { err_id: $.data.error_id }
            - call: "POST /sample-shipments"
              payload: { enrollment_id: "${e1_id}", fulfillment_wave_id: "${w1_id}", expected_enrollment_version: "${e1_v1}" }
              as: FulfillmentOps
              captures: { sh1_id: $.data.id }
          assert:
            - "the stale allocation returns HTTP status == 412"
            - "${err_id} == ERR_STALE_ENROLLMENT_VERSION"
            - "${e1_v1} == ${e1_v0} + 1"
            - "immediately after the 412: KitLine.${kl1_id}.units_available == 10 and units_reserved == 0, FulfillmentWave.${w1_id}.planned_unit_count == 0, Campaign.${camp_id}.allocated_sample_count == 0 and budget_committed_cents == 0"
            - "the retry with ${e1_v1} returns HTTP status == 201 with SampleShipment.${sh1_id}.status == ALLOCATED, kit_unit_total == 1 and committed_cost_cents == 583"
            - "after the retry: KitLine.${kl1_id}.units_available == 9 and units_reserved == 1, FulfillmentWave.${w1_id}.planned_unit_count == 1, Campaign.${camp_id}.allocated_sample_count == 1, budget_committed_cents == 583 and cost_per_sample_provisional_cents == 583"
            - "Enrollment.${e1_id}.version == ${e1_v1} + 1 (the allocation advanced the enrollment for the reship rule)"

      - name: occ_reship_accepts_the_current_enrollment_version_after_a_lost_shipment
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[reship-create-stale-enrollment]
          - state_machines.Enrollment.obligation_status[FORFEITED -> NONE]
          - entities.SampleShipment.fields.supersedes_shipment_id
        distinguishing_aspect: "The positive half of the reship rule, and the only path that walks the obligation axis backwards: after the shipment is lost the enrollment is FORFEITED, its version has moved twice more (release and loss), and a reship carrying the freshly read version plus supersedes_shipment_id is accepted, resetting the obligation to NONE while the LOST shipment stays in the final-cost numerator."
        test_recipe:
          setup:
            - "One campaign in SAMPLING_ACTIVE, single-line kit (283 + 300 freight = 583 per shipment), 10 units received."
            - "One screened non-holdout enrollment whose first shipment was released and then reported lost, so the obligation axis reads FORFEITED."
            - "A second PLANNED wave, because the first wave is now RELEASED and terminal."
