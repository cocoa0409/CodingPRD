              as: Scheduler
              captures: { appt1_id: $.data.id }
          trigger:
            - call: "POST /bone-density/payer-policies"
              payload: { payer_code: "PAY-X", name: "Rogue Plan", baseline_screening_min_interval_months: 24, high_risk_min_interval_months: 12, treatment_monitoring_min_interval_months: 12, vfa_covered: true, vfa_requires_height_loss_cm: 4.0, repeat_scan_grace_days: 30, max_lifetime_screening_scans: 6, appeal_allowed: false }
              as: Scheduler
            - call: "POST /bone-density/densitometers"
              payload: { serial_number: "HLG-0009", manufacturer: "NORLAND", model: "XR-600", site_code: "EAST", phantom_baseline_bmd_g_cm2: 1.0000, phantom_baseline_sd_g_cm2: 0.0100, appointment_buffer_minutes: 15, daily_scan_capacity: 12 }
              as: Technologist
              as_user_id: "tech-001"
            - call: "POST /bone-density/scan-appointments"
              payload: { scan_order_id: "${order1_id}", densitometer_id: "${dev_a_id}", start_utc: "2026-03-11T09:00:00Z", end_utc: "2026-03-11T09:30:00Z" }
              as: ProgramAdmin
            - call: "POST /bone-density/scan-appointments/${appt1_id}/scan-sessions"
              payload: { scan_mode: "ARRAY" }
              as: QualityReviewer
              as_user_id: "qa-001"
            - call: "POST /bone-density/frax-assessments"
              payload: { patient_id: "${pat_id}", risk_factor_profile_id: "${pat_id}" }
              as: Technologist
              as_user_id: "tech-001"
            - call: "POST /bone-density/diagnostic-reports"
              payload: { scan_session_id: "${appt1_id}" }
              as: QualityReviewer
              as_user_id: "qa-001"
            - call: "POST /bone-density/treatment-plans"
              payload: { patient_id: "${pat_id}", initiating_report_id: "${appt1_id}", drug_class: "BISPHOSPHONATE_ORAL", start_date: "2026-03-11" }
              as: Scheduler
            - call: "GET /bone-density/densitometers"
              payload: {}
              as: PatientPortalUser
              as_user_id: "${pat_id}"
            - call: "POST /bone-density/densitometers/${dev_a_id}/qc-runs"
              payload: { purpose: "DAILY_QC", phantom_bmd_g_cm2: 1.0050, scan_mode: "ARRAY" }
              as: ProgramAdmin
            - call: "POST /bone-density/scan-orders"
              payload: { patient_id: "${pat_id}", indication: "HIGH_RISK_CASE_FINDING", requested_sites: ["TOTAL_HIP"], requested_scan_date: "2026-03-12", vfa_requested: false }
              as: InterpretingPhysician
              as_user_id: "phys-001"
