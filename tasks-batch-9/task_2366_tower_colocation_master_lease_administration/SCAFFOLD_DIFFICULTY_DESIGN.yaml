        conserved_quantity: "Tower.reserved_load_units, Tower.reserved_ground_space_sqft, Tower.available_ground_space_sqft and Tower.occupied_elevation_bands — a pure function of the amendments in execution_status EXECUTED or TERMINATION_NOTICED"
        forward_action: "POST /tower-colo/site-amendments/{id}/execute with signature_received true"
        compensating_action: "POST /tower-colo/site-amendments/{id}/termination-notice followed by POST /tower-colo/site-amendments/{id}/complete-decommission with restoration_confirmed true"
        grounds:
          - calculations.tower_capacity_reconciliation
          - state_machines.SiteAmendment.axis_execution_status.TERMINATION_NOTICED_to_TERMINATED
          - entities.Tower.fields.occupied_elevation_bands
