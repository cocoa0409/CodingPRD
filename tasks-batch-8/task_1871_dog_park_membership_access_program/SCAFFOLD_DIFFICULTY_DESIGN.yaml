            - "no ParkVisit is created"

      - name: renewal_blocked_when_member_suspended
        grounds:
          - state_machines.Membership.ACTIVE_to_ACTIVE
          - entities.Member.fields.status
          - errors[ERR_MEMBER_NOT_ACTIVE]
        distinguishing_aspect: |
          Entity pair Membership -> Member: renewal is gated on Member.status IN
          {ACTIVE, LAPSED} checked BEFORE the membership's own state, so a
          SUSPENDED member's renewal fails with ERR_MEMBER_NOT_ACTIVE even though
          the OCC version presented is current — distinct pair from the
          ParkVisit -> Dog instance.
        test_recipe:
          setup:
            - "Clock 2026-08-01; member A active with membership (version 1); SEVERE report confirmed suspends A (membership cascade bumps version to 2)"
          setup_api_calls:
            - call: "POST /dog-park/_clock/set_current_utc"
