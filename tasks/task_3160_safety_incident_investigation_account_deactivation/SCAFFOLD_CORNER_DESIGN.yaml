  # ===========================================================================
  - section: calculations
    instances:

      - name: severity_saturating_aggravators_set_the_derivative_flag
        claim_type: Variable Divergence
        grounds:
          - calculations.incident_severity_classification
          - entities.SafetyIncident.fields.derivative_severity_flagged
          - calculations.incident_severity_classification.constants.BAND_MAX_LEVEL
        distinguishing_aspect: "The saturation flag is true only when the floor band had already reached S4 and at least one aggravator was therefore consumed by clamping — a FALSE/TRUE pair differing solely in category base level."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z. R1 policy with sd_floor_severity S4. One ACTIVE driver account."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /safety/platform-policies"
              payload: { region_code: "R1", sd_floor_severity: "S4" }
              as: PlatformAdmin
            - call: "POST /safety/accounts"
              payload: { account_type: "DRIVER", home_region_code: "R1", legal_name: "Owen Pike", contact_email: "owen.pike@example.com" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
          trigger:
            - call: "POST /safety/incidents"
              payload: { account_id: "${acct_id}", reporter_type: "THIRD_PARTY", incident_category: "SAFETY_VIOLATION", aggravator_codes: ["S3_INJURY", "S3_LAW_ENFORCEMENT_SEVERITY"] }
              as: SafetyInvestigator
              captures: { unsat_inc: $.data.id, unsat_sev: $.data.severity, unsat_flag: $.data.derivative_severity_flagged }
            - call: "POST /safety/incidents"
              payload: { account_id: "${acct_id}", reporter_type: "THIRD_PARTY", incident_category: "SEXUAL_MISCONDUCT", aggravator_codes: ["S3_INJURY"] }
              as: SafetyInvestigator
              captures: { sat_inc: $.data.id, sat_sev: $.data.severity, sat_flag: $.data.derivative_severity_flagged }
          assert:
            - "SafetyIncident.${unsat_inc}.severity == \"S4\" with derivative_severity_flagged == false, because raw_level is 4 for SAFETY_VIOLATION and exactly saturates rather than exceeding"
            - "SafetyIncident.${sat_inc}.severity == \"S4\" with derivative_severity_flagged == true, because the SEXUAL_MISCONDUCT floor of 4 plus one applied aggravator level exceeds BAND_MAX_LEVEL of 4"
            - "the two incidents land on the same severity band while their flags differ, so the flag carries information the band alone does not"

      - name: enforcement_risk_term_ignores_weight_for_a_warning_outcome
        claim_type: Input Set Filtering
        grounds:
          - calculations.risk_contagion_propagation
          - calculations.risk_contagion_propagation.constants.ENFORCEMENT_ACTIVE_WEIGHT
          - entities.Account.fields.risk_score
        distinguishing_aspect: "Two accounts whose incidents differ only in the committed decision category carry different propagated scores, because the DECIDED/WARNING row is excluded from the incident term while a DECIDED/RESTRICTED row is not."
        test_recipe:
          setup:
            - "Logical clock stepped across two decision instants. R1 policy with sd_floor_severity S4 and appeal_window_days 30. Two ACTIVE rider accounts, acct-warn and acct-restrict, each carrying one S2 PROPERTY_DAMAGE incident."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /safety/platform-policies"
              payload: { region_code: "R1", sd_floor_severity: "S4", appeal_window_days: 30 }
              as: PlatformAdmin
            - call: "POST /safety/accounts"
