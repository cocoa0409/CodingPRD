  - rule_id: cross_entity_state_dependency
    instances:
      - name: dispatch_blocked_while_pinned_lot_is_quarantined_then_allowed_after_release
        grounds:
          - validations[priority=18]
          - state_machines.InventoryLot.AVAILABLE_to_QUARANTINED
          - state_machines.InventoryLot.QUARANTINED_to_AVAILABLE
          - state_machines.DeliveryLoad.PLANNED_to_DISPATCHED
          - calculations.inventory_net_sellable_volume
        distinguishing_aspect: |
          The blocking state lives on the InventoryLot that the LOAD merely points at — neither
          the load, the order, the truck nor the request body changes between the rejected and
          the accepted dispatch. The moisture reading that quarantines the lot also flips it onto
          the settlement basis, so the very act of blocking the dispatch changes the lot's
          net_sellable_cubic_yards, which no single-entity reading of the dispatch call predicts.
        test_recipe:
          setup:
            - "Material at 1000 lb/cubic-yard, 15% moisture, 2000 cents/cubic-yard; lot of 100.00 gross cubic yards intaken at 15% (net 90.00 on the intake basis)."
            - "CONFIRMED DELIVERY order (CLASS_A, 0.0 miles) with one BULK line of 10.00 cubic yards; one PLANNED load of 10.00 cubic yards on a TRI_AXLE truck."
            - "A moisture reading of 18.0% is filed with set_quarantine true, moving the lot to QUARANTINED and onto the SETTLEMENT basis."
