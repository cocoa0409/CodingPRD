              as: StateAdoptionOfficer
              as_user_id: "${st_id_id}"
              captures: { cyc_id: $.data.id }
            - call: "POST /titles"
              payload: { isbn_base: "9780000011501", subject: "MATH", grade_low: 3, grade_high: 3, copyright_year: 2026, content_tags: ["NUMBER_SENSE"], page_count: 290, signature_page_capacity: 384, list_price_cents: 8700 }
              as: PublisherEditor
              captures: { ttl_id: $.data.id }
            - call: "POST /titles/${ttl_id}/release"
              payload: {}
              as: PublisherEditor
            - call: "POST /submissions"
              payload: { cycle_id: "${cyc_id}", title_id: "${ttl_id}" }
              as: PublisherEditor
              captures: { sub_id: $.data.id }
            - call: "POST /submissions/${sub_id}/correlations"
              payload: { standard_code: "ID.M.3.1", depth_level: "MASTERY", page_reference: "pp. 10-60", evidence_citation: "Unit 1 develops and assesses the standard to mastery." }
              as: PublisherEditor
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /adoption-cycles/${cyc_id}/phase-advance"
              payload: {}
              as: StateAdoptionOfficer
              as_user_id: "${st_id_id}"
            - call: "POST /submissions/${sub_id}/file"
              payload: {}
              as: PublisherEditor
            - call: "POST /committee-panels"
              payload: { cycle_id: "${cyc_id}", panel_label: "ID MATH Panel A", session_start_at: "2026-10-20T14:00:00Z", session_end_at: "2026-10-20T18:00:00Z", member_count: 4, quorum_required: 3 }
              as: StateAdoptionOfficer
