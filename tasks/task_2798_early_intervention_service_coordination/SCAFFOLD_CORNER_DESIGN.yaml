      - name: insurance_offset_requires_consent_and_a_policy_on_file
        claim_type: conditional_validation
        grounds:
          - validations[priority 40 -> ERR_INSURANCE_POLICY_REQUIRED]
          - calculations.family_cost_share
          - endpoints[POST /ei/cost-shares/{costShareId}/finalize]
        distinguishing_aspect: |
          Consent alone is not enough: without insurance_policy_id the determination is refused at
          422, with it the PROVISIONAL row is created, and only the FINAL variant at finalize turns
          that consent into a 60% offset. The tier is never re-derived from the post-offset amount —
          tier_code stays TIER_1 and effective_coinsurance_rate stays 0.05 even though
          final_monthly_fee_cents (1040) would fall in TIER_0 territory if re-tiered.
        test_recipe:
          setup:
            - "ACTIVE_SERVICES referral whose ACTIVE plan has one fee-eligible line: 4 sessions/month x 2 units x 6500 cents."
            - "Household size 4 -> fpl_threshold_cents == 1580000 + 3 * 555000 == 3245000."
