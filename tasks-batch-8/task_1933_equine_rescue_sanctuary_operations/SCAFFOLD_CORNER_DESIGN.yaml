            - { call: "POST /rescue-ops/barn-shifts", payload: { shift_date: "2026-08-05T00:00:00Z", start_time: "06:00", end_time: "08:00", barn_zone: MAIN_BARN, required_skill: FEEDING }, as: VolunteerCoordinator, captures: { sh: $.data.id } }
          trigger:
            - { call: "POST /rescue-ops/barn-shifts/${sh}/claim", payload: {}, as: Volunteer, as_user_id: "${v1}", captures: { st1: $.data.status, vol1: $.data.volunteer_id } }
            - { call: "POST /rescue-ops/barn-shifts/${sh}/release", payload: {}, as: Volunteer, as_user_id: "${v1}", captures: { st2: $.data.status, vol2: $.data.volunteer_id } }
            - { call: "POST /rescue-ops/barn-shifts/${sh}/claim", payload: {}, as: Volunteer, as_user_id: "${v2}", captures: { st3: $.data.status, vol3: $.data.volunteer_id } }
          assert:
            - "st1 == ASSIGNED AND vol1 == ${v1}"
            - "st2 == OPEN AND vol2 is null (release resets the slot)"
            - "st3 == ASSIGNED AND vol3 == ${v2} (cycle closed by a different volunteer)"

