              as: DenialsManager
            - call: "POST /rcm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-20T00:00:00Z" }
              as: RevenueCycleDirector
          trigger:
            - call: "GET /rcm/denial-cases/${d1}"
              payload: {}
              as: DenialsSpecialist
              captures: { score: $.data.priority_score, bucket: $.data.queue_bucket }
          assert:
            - "priority_score == 50.00 exactly (min(200000/10000,50)=20 + max(0,45-1.5*10)=30 + 0)"
            - "queue_bucket == HIGH (>= 50.00 boundary is inclusive)"

      - name: priority_zero_for_terminal_denial
        claim_type: input_set_filtering
        grounds: [calculations.queue_priority_score]
        distinguishing_aspect: "Terminal denials fall out of the scored input set: a RESOLVED_PAID denial reports priority_score 0.00 / LOW and is absent from the work queue."
        test_recipe:
          setup: ["payer A with level-1 policy; code CO-16; denial CLM-2204 (denied 100000) fully OVERTURNED at level 1 -> RESOLVED_PAID"]
