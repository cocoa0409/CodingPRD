          difficulty_instance: boundary_precision_check / threshold_head_exactly_at_species_floor
          rationale: "That §1.8 instance pins the instantaneous side of this layer: measured_head exactly equal to the cattle floor of 125000 is MANDATORY, one head below is EXEMPT."

      - name: delinquency_counter_resets_on_waiver
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.delinquency_points_and_tier.waiver_inverse
        excluded_because:
          difficulty_instance: compensating_invariant / entity_penalty_ledger_restored_by_waiver
          rationale: "That §1.8 instance covers the reset half of this layer: waiving an assessment subtracts exactly that row's points and money, restoring the ledger and, when the total leaves TIER_2, reinstating the registration."

  # ===========================================================================
  - section: consistency_model
    instances:

      - name: suspension_cascade_is_visible_in_the_same_response
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - state_machines.Registration.ACTIVE_to_SUSPENDED
          - state_machines.Submission.to_VOIDED
        distinguishing_aspect: |
          The declared immediate model tested where it is most expensive: a single
          suspend call has to void every live filing of the firm before it answers.
          The suspend response itself already reports SUSPENDED with
          suspended_reason ADMIN_ACTION, and the very next reads — with no delay,
          no retry and no background pass — show both the DRAFT and the SUBMITTED
          filing already VOIDED while the ACCEPTED filing of a different firm and
          the window ledger are untouched.
        test_recipe:
          setup:
            - "Alpha Packing (ACTIVE 2026 registration) has one DRAFT filing (EST-101) and one SUBMITTED filing (EST-102) in an OPEN window; Bravo Beef (ACTIVE 2026 registration under PRIOR_YEAR_ACTUAL) has one ACCEPTED filing of 100 head in the same window."
          setup_api_calls:
            - call: "POST /reporting-entities"
              payload: { legal_name: "Alpha Packing", entity_type: "PACKER", species_scope: "CATTLE" }
              as: ProgramAdmin
              captures: { ent_a: $.data.id }
            - call: "POST /plants"
              payload: { reporting_entity_id: "${ent_a}", plant_code: "EST-101", species: "CATTLE", annual_head_history: { "2021": 120000, "2022": 124000, "2023": 126000, "2024": 128000, "2025": 132000 }, boxed_beef_volume_lbs_prior_year: 2500000, forward_commitment_cap_head: 3000 }
              as: ProgramAdmin
              captures: { plant_a1: $.data.id }
            - call: "POST /plants"
              payload: { reporting_entity_id: "${ent_a}", plant_code: "EST-102", species: "CATTLE", annual_head_history: { "2021": 0, "2022": 0, "2023": 0, "2024": 0, "2025": 0 }, boxed_beef_volume_lbs_prior_year: 0, forward_commitment_cap_head: 500 }
              as: ProgramAdmin
              captures: { plant_a2: $.data.id }
            - call: "POST /reporting-entities"
              payload: { legal_name: "Bravo Beef", entity_type: "PACKER", species_scope: "CATTLE" }
              as: ProgramAdmin
              captures: { ent_b: $.data.id }
            - call: "POST /plants"
              payload: { reporting_entity_id: "${ent_b}", plant_code: "EST-202", species: "CATTLE", annual_head_history: { "2021": 100000, "2022": 110000, "2023": 120000, "2024": 130000, "2025": 150000 }, boxed_beef_volume_lbs_prior_year: 0, forward_commitment_cap_head: 1000 }
              as: ProgramAdmin
