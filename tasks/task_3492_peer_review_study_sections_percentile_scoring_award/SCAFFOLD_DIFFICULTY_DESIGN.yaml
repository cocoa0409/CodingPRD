            - { call: "POST /grants/institutes/${insti_id}/payline-decisions", payload: { base_payline_percentile: 100.0, expected_institute_version: "${insti_v}" }, as: ProgramOfficer }
            - { call: "GET /grants/applications/${app_a}/jit-requests", payload: {}, as: GrantsOfficer, captures: { jit_a: "$.data[0].id" } }
            - { call: "POST /grants/jit-requests/${jit_a}/submit-items", payload: { items_submitted: ["OTHER_SUPPORT", "BUDGET_JUSTIFICATION"] }, as: Applicant, as_user_id: "${pi_a}" }
            - { call: "POST /grants/jit-requests/${jit_a}/adjudicate", payload: { decision: "ACCEPT", budget_cut_pct: 0 }, as: GrantsOfficer }
            - { call: "POST /grants/applications/${app_a}/award", payload: { start_date: "2027-01-01T00:00:00Z" }, as: GrantsOfficer, captures: { award_a: $.data.id } }
            - { call: "POST /grants/awards/${award_a}/progress-reports", payload: { period_year: 1, actual_expenditure_cents: 12000000, publications_count: 1 }, as: Applicant, as_user_id: "${pi_a}", captures: { rep_a: $.data.id } }
            - { call: "POST /grants/progress-reports/${rep_a}/accept", payload: {}, as: GrantsOfficer }
          trigger:
            - { call: "POST /grants/awards/${award_a}/modifications", payload: { type: "TERMINATION", reason: "PI withdrew from research" }, as: GrantsOfficer, captures: { term_id: $.data.id, term_st: $.data.status, term_auto: $.data.auto_approved } }
            - { call: "GET /grants/institutes/${insti_id}", payload: {}, as: GrantsOfficer, captures: { committed: $.data.committed_cents, disbursed: $.data.disbursed_cents } }
            - { call: "GET /grants/awards/${award_a}", payload: {}, as: GrantsOfficer, captures: { aw_st: $.data.status } }
          assert:
            - "AwardModification.${term_id}.status == AUTO_APPROVED and auto_approved == true"
            - "Award.${award_a}.status == TERMINATED"
            - "Institute.${insti_id}.committed_cents == 0 (30000000 - 12000000 disbursed - 18000000 returned)"
            - "Institute.${insti_id}.disbursed_cents == 12000000"
            - "invariant: appropriation - reserve - committed - disbursed == 100000000 - 5000000 - 0 - 12000000 == 83000000 unchanged by the issue/disburse/terminate round-trip"

      - name: transfer_lineage_conserves_total_awarded
        grounds:
          - calculations.transfer_relinquishment
          - state_machines.Award.ACTIVE_to_TRANSFERRED
        distinguishing_aspect: |
          Conserved quantity: funds along a transfer lineage — original.total_awarded ==
          disbursed + retained_returned_to_institute + successor.total_awarded. With no disbursal,
