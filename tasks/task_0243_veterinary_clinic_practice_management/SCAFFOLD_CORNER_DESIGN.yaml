# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Veterinary Clinic Practice Management — Expert band
# Breadth probe over §1.1-§1.7. Walks references/claim-extraction-guide.md
# section-by-section; emits a corner instance per applicable testable claim that
# §1.8 does not already cover, and an excluded_because: stub where §1.8 covers it.
# Same seven-point per-instance contract as §1.8; all setup_api_calls reachable
# from empty-DB via §1.5; OCC version inputs are ${var}; formula asserts literal.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_household_returns_201_with_defaults
        claim_type: Creation
        grounds: [entities.Household, endpoints]
        distinguishing_aspect: "POST /clinic/households with account_name returns 201 with status=ACTIVE, account_credit_cents=0, lifetime_invoiced_cents=0, version=1."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /clinic/households"
              payload: { account_name: "Alpha" }
              as: Receptionist
              captures: { hh: $.data.id }
          assert:
            - "HTTP 201"
            - "Household.${hh}.status == ACTIVE"
            - "Household.${hh}.account_credit_cents == 0"
            - "Household.${hh}.version == 1"

      - name: get_patient_not_found_returns_404
        claim_type: Not Found
        grounds: [entities.Patient, "errors[ERR_PATIENT_NOT_FOUND]"]
        distinguishing_aspect: "GET /clinic/patients/{pid} with a non-existent UUID returns ERR_PATIENT_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /clinic/patients/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Receptionist
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_PATIENT_NOT_FOUND"
            - "http_status == 404"

      - name: create_patient_missing_required_species_returns_invalid_request
        claim_type: Required Fields
        grounds: [entities.Patient.fields.species, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /clinic/patients omitting required species returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["A household exists."]
          setup_api_calls:
            - call: "POST /clinic/households"
              payload: { account_name: "Beta" }
              as: Receptionist
              captures: { hh: $.data.id }
          trigger:
            - call: "POST /clinic/patients"
              payload: { household_id: "${hh}", name: "NoSpecies", weight_kg: 5 }
              as: Receptionist
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST"
            - "http_status == 400"

      - name: create_patient_bad_weight_returns_invalid_request
        claim_type: Type Constraints
        grounds: [entities.Patient.fields.weight_kg, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /clinic/patients with weight_kg <= 0 (here 0) returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["A household exists."]
          setup_api_calls:
            - call: "POST /clinic/households"
              payload: { account_name: "Gamma" }
              as: Receptionist
              captures: { hh: $.data.id }
          trigger:
            - call: "POST /clinic/patients"
              payload: { household_id: "${hh}", name: "Zero", species: "DOG", weight_kg: 0 }
              as: Receptionist
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST"
            - "http_status == 400"

      - name: create_patient_bad_species_enum_returns_invalid_request
        claim_type: Type Constraints
        grounds: [entities.Patient.fields.species, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /clinic/patients with species not in {DOG,CAT,RABBIT,FERRET} returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["A household exists."]
          setup_api_calls:
            - call: "POST /clinic/households"
              payload: { account_name: "Delta" }
              as: Receptionist
              captures: { hh: $.data.id }
          trigger:
            - call: "POST /clinic/patients"
              payload: { household_id: "${hh}", name: "Bird", species: "PARROT", weight_kg: 1 }
              as: Receptionist
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST"
            - "http_status == 400"

      - name: create_patient_unknown_household_returns_404
        claim_type: Parent Relationships
        grounds: [entities.Patient.fields.household_id, "errors[ERR_HOUSEHOLD_NOT_FOUND]"]
        distinguishing_aspect: "POST /clinic/patients with a household_id that does not resolve returns ERR_HOUSEHOLD_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /clinic/patients"
              payload: { household_id: "00000000-0000-4000-8000-000000000001", name: "Orphan", species: "CAT", weight_kg: 3 }
              as: Receptionist
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_HOUSEHOLD_NOT_FOUND"
            - "http_status == 404"

      - name: create_owner_duplicate_email_returns_email_taken
        claim_type: Type Constraints
        grounds: [entities.Owner.fields.email, "errors[ERR_OWNER_EMAIL_TAKEN]"]
        distinguishing_aspect: "POST /clinic/owners with an email already used by another owner returns ERR_OWNER_EMAIL_TAKEN (409)."
        test_recipe:
          setup: ["A household with one owner whose email is dup@x.com."]
          setup_api_calls:
            - call: "POST /clinic/households"
              payload: { account_name: "Eps" }
              as: Receptionist
              captures: { hh: $.data.id }
            - call: "POST /clinic/owners"
              payload: { household_id: "${hh}", full_name: "First", email: "dup@x.com" }
              as: Receptionist
              captures: { o1: $.data.id }
          trigger:
            - call: "POST /clinic/owners"
              payload: { household_id: "${hh}", full_name: "Second", email: "dup@x.com" }
              as: Receptionist
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_OWNER_EMAIL_TAKEN"
            - "http_status == 409"

      - name: system_fields_ignored_on_patient_create
        claim_type: System Fields
        grounds: [entities.Patient.fields.status]
        distinguishing_aspect: "Client-supplied status on POST /clinic/patients is ignored; server forces status=ACTIVE."
        test_recipe:
          setup: ["A household exists."]
          setup_api_calls:
            - call: "POST /clinic/households"
              payload: { account_name: "Zeta" }
              as: Receptionist
              captures: { hh: $.data.id }
          trigger:
            - call: "POST /clinic/patients"
              payload: { household_id: "${hh}", name: "Server", species: "DOG", weight_kg: 7 }
              as: Receptionist
              captures: { pat: $.data.id }
          assert:
            - "Patient.${pat}.status == ACTIVE"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: appointment_begin_exam_from_scheduled_invalid
        claim_type: Invalid Transitions
        grounds: [state_machines.Appointment.CHECKED_IN_to_IN_EXAM, "errors[ERR_APPOINTMENT_INVALID_STATE]"]
        distinguishing_aspect: "begin-exam on a SCHEDULED (not CHECKED_IN) appointment returns ERR_APPOINTMENT_INVALID_STATE (409); no state change."
        test_recipe:
          setup: ["A freshly SCHEDULED appointment."]
          setup_api_calls:
            - call: "POST /clinic/households"
              payload: { account_name: "Eta" }
              as: Receptionist
              captures: { hh: $.data.id }
            - call: "POST /clinic/patients"
              payload: { household_id: "${hh}", name: "Pat", species: "DOG", weight_kg: 10 }
              as: Receptionist
              captures: { pat: $.data.id }
            - call: "POST /clinic/appointments"
              payload: { patient_id: "${pat}", scheduled_start: "2026-08-01T09:00:00Z", scheduled_end: "2026-08-01T10:00:00Z", visit_reason: "X" }
              as: Receptionist
              captures: { appt: $.data.id }
          trigger:
            - call: "POST /clinic/appointments/${appt}/transition"
              payload: { action: "begin-exam" }
              as: Veterinarian
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_APPOINTMENT_INVALID_STATE"
            - "http_status == 409"

      - name: appointment_terminal_cancelled_lockdown
        claim_type: Terminal State Lockdown
        grounds: [state_machines.Appointment.SCHEDULED_to_CANCELLED, "errors[ERR_APPOINTMENT_INVALID_STATE]"]
        distinguishing_aspect: "Cancelling an already-CANCELLED appointment returns ERR_APPOINTMENT_INVALID_STATE (409); terminal states accept no transition."
        test_recipe:
          setup: ["A CANCELLED appointment."]
          setup_api_calls:
            - call: "POST /clinic/households"
              payload: { account_name: "Theta" }
              as: Receptionist
              captures: { hh: $.data.id }
            - call: "POST /clinic/patients"
              payload: { household_id: "${hh}", name: "Pat", species: "DOG", weight_kg: 10 }
              as: Receptionist
              captures: { pat: $.data.id }
            - call: "POST /clinic/appointments"
              payload: { patient_id: "${pat}", scheduled_start: "2026-08-02T09:00:00Z", scheduled_end: "2026-08-02T10:00:00Z", visit_reason: "X" }
              as: Receptionist
              captures: { appt: $.data.id }
            - call: "POST /clinic/appointments/${appt}/transition"
              payload: { action: "cancel" }
              as: Receptionist
          trigger:
            - call: "POST /clinic/appointments/${appt}/transition"
              payload: { action: "cancel" }
              as: Receptionist
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_APPOINTMENT_INVALID_STATE"
            - "http_status == 409"

      - name: appointment_no_show_too_early_rejected
        claim_type: Precondition Enforcement
        grounds: [state_machines.Appointment.SCHEDULED_to_NO_SHOW, "errors[ERR_APPOINTMENT_INVALID_STATE]"]
        distinguishing_aspect: "no-show before clock reaches scheduled_end is rejected with ERR_APPOINTMENT_INVALID_STATE (the too-early-for-no-show precondition); the default clock is well before the 2099 scheduled_end."
        test_recipe:
          setup: ["A SCHEDULED appointment whose scheduled_end is far in the future (2099)."]
          setup_api_calls:
            - call: "POST /clinic/households"
              payload: { account_name: "Iota" }
              as: Receptionist
              captures: { hh: $.data.id }
            - call: "POST /clinic/patients"
              payload: { household_id: "${hh}", name: "Pat", species: "DOG", weight_kg: 10 }
              as: Receptionist
              captures: { pat: $.data.id }
            - call: "POST /clinic/appointments"
              payload: { patient_id: "${pat}", scheduled_start: "2099-01-01T09:00:00Z", scheduled_end: "2099-01-01T10:00:00Z", visit_reason: "X" }
              as: Receptionist
              captures: { appt: $.data.id }
          trigger:
            - call: "POST /clinic/appointments/${appt}/transition"
              payload: { action: "no-show" }
              as: Receptionist
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_APPOINTMENT_INVALID_STATE"
            - "http_status == 409"

      - name: appointment_complete_blocked_by_open_lab_order
        claim_type: guarded transitions
        grounds: [state_machines.Appointment.IN_EXAM_to_COMPLETED, entities.LabOrder.fields.status]
        distinguishing_aspect: "complete on an IN_EXAM appointment with a LabOrder still ORDERED is rejected with ERR_APPOINTMENT_INVALID_STATE (open lab orders guard)."
        test_recipe:
          setup: ["An IN_EXAM appointment with one ORDERED lab order."]
          setup_api_calls:
            - call: "POST /clinic/households"
              payload: { account_name: "Kappa" }
              as: Receptionist
              captures: { hh: $.data.id }
            - call: "POST /clinic/patients"
              payload: { household_id: "${hh}", name: "Pat", species: "DOG", weight_kg: 10 }
              as: Receptionist
              captures: { pat: $.data.id }
            - call: "POST /clinic/appointments"
              payload: { patient_id: "${pat}", scheduled_start: "2026-08-03T09:00:00Z", scheduled_end: "2026-08-03T10:00:00Z", visit_reason: "X" }
              as: Receptionist
              captures: { appt: $.data.id }
            - call: "POST /clinic/appointments/${appt}/transition"
              payload: { action: "check-in" }
              as: Receptionist
            - call: "POST /clinic/appointments/${appt}/transition"
              payload: { action: "begin-exam" }
              as: Veterinarian
            - call: "POST /clinic/lab-orders"
              payload: { appointment_id: "${appt}", order_type: "BLOODWORK", fee_cents: 6000 }
              as: Veterinarian
              captures: { lo: $.data.id }
          trigger:
            - call: "POST /clinic/appointments/${appt}/transition"
              payload: { action: "complete" }
              as: Veterinarian
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_APPOINTMENT_INVALID_STATE"
            - "http_status == 409"

      - name: patient_deactivate_blocked_by_open_visit
        claim_type: Precondition Enforcement
        grounds: [state_machines.Patient.ACTIVE_to_INACTIVE, "errors[ERR_PATIENT_HAS_OPEN_VISITS]"]
        distinguishing_aspect: "Deactivating a patient with a SCHEDULED appointment returns ERR_PATIENT_HAS_OPEN_VISITS (409)."
        test_recipe:
          setup: ["An ACTIVE patient with one SCHEDULED appointment."]
          setup_api_calls:
            - call: "POST /clinic/households"
              payload: { account_name: "Lam" }
              as: Receptionist
              captures: { hh: $.data.id }
            - call: "POST /clinic/patients"
              payload: { household_id: "${hh}", name: "Pat", species: "DOG", weight_kg: 10 }
              as: Receptionist
              captures: { pat: $.data.id }
            - call: "POST /clinic/appointments"
              payload: { patient_id: "${pat}", scheduled_start: "2026-08-04T09:00:00Z", scheduled_end: "2026-08-04T10:00:00Z", visit_reason: "X" }
              as: Receptionist
              captures: { appt: $.data.id }
          trigger:
            - call: "POST /clinic/patients/${pat}/deactivate"
              payload: {}
              as: Receptionist
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_PATIENT_HAS_OPEN_VISITS"
            - "http_status == 409"

      - name: lab_order_result_requires_result_text
        claim_type: Precondition Enforcement
        grounds: [state_machines.LabOrder.status, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "result action on a COLLECTED lab order without result_text is rejected with ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["A COLLECTED lab order on an IN_EXAM appointment."]
          setup_api_calls:
            - call: "POST /clinic/households"
              payload: { account_name: "Mu" }
              as: Receptionist
              captures: { hh: $.data.id }
            - call: "POST /clinic/patients"
              payload: { household_id: "${hh}", name: "Pat", species: "CAT", weight_kg: 4 }
              as: Receptionist
              captures: { pat: $.data.id }
            - call: "POST /clinic/appointments"
              payload: { patient_id: "${pat}", scheduled_start: "2026-08-05T09:00:00Z", scheduled_end: "2026-08-05T10:00:00Z", visit_reason: "X" }
              as: Receptionist
              captures: { appt: $.data.id }
            - call: "POST /clinic/appointments/${appt}/transition"
              payload: { action: "check-in" }
              as: Receptionist
            - call: "POST /clinic/appointments/${appt}/transition"
              payload: { action: "begin-exam" }
              as: Veterinarian
            - call: "POST /clinic/lab-orders"
              payload: { appointment_id: "${appt}", order_type: "URINALYSIS", fee_cents: 3000 }
              as: Veterinarian
              captures: { lo: $.data.id }
            - call: "POST /clinic/lab-orders/${lo}/transition"
              payload: { action: "collect" }
              as: Veterinarian
          trigger:
            - call: "POST /clinic/lab-orders/${lo}/transition"
              payload: { action: "result" }
              as: Veterinarian
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST"
            - "http_status == 400"

      - name: estimate_reschedule_cycle_covered_by_difficulty
        claim_type: cyclic
        grounds: [state_machines.Estimate.DECLINED_to_DRAFT]
        excluded_because:
          difficulty_instance: non_linear_state_machine / estimate_decline_revise_cycle_back_to_draft
          rationale: "The DECLINED->DRAFT revision loop and revision increment are asserted by the named §1.8 instance."

      - name: appointment_reschedule_cycle_covered_by_difficulty
        claim_type: cyclic
        grounds: [state_machines.Appointment.IN_EXAM_to_SCHEDULED]
        excluded_because:
          difficulty_instance: non_linear_state_machine / appointment_reschedule_cycle_in_exam_back_to_scheduled
          rationale: "The IN_EXAM->SCHEDULED loop and reschedule_count increment are asserted by the named §1.8 instance."

  # ===========================================================================
  - section: calculations
    instances:
      - name: boarding_total_inclusive_day_count
        claim_type: Correct Result
        grounds: [calculations.boarding_total, entities.BoardingStay.fields.board_total_cents]
        distinguishing_aspect: "A stay 2026-07-01..2026-07-04 inclusive is 4 nights; at 5000/night board_total_cents == 20000."
        test_recipe:
          setup: ["A kennel with capacity 3; a patient."]
          setup_api_calls:
            - call: "POST /clinic/kennels"
              payload: { name: "KB", capacity: 3 }
              as: PracticeManager
              captures: { ken: $.data.id }
            - call: "POST /clinic/households"
              payload: { account_name: "Nu" }
              as: Receptionist
              captures: { hh: $.data.id }
            - call: "POST /clinic/patients"
              payload: { household_id: "${hh}", name: "Boarder", species: "DOG", weight_kg: 12 }
              as: Receptionist
              captures: { pat: $.data.id }
          trigger:
            - call: "POST /clinic/boarding-stays"
              payload: { patient_id: "${pat}", kennel_id: "${ken}", check_in_date: "2026-07-01T00:00:00Z", check_out_date: "2026-07-04T00:00:00Z", nightly_rate_cents: 5000 }
              as: Receptionist
              captures: { bs: $.data.id }
          assert:
            - "BoardingStay.${bs}.board_total_cents == 20000"

      - name: vaccine_reminder_lead_computed
        claim_type: Correct Result
        grounds: [calculations.vaccine_next_due, entities.Vaccination.fields.reminder_at, entities.Vaccination.fields.next_due_at]
        distinguishing_aspect: "A DHPP dose administered 2026-03-01 yields next_due_at 2026-03-22 (21 days) and reminder_at 2026-03-08 (next_due - 14 days)."
        test_recipe:
          setup: ["A patient with no prior DHPP dose."]
          setup_api_calls:
            - call: "POST /clinic/households"
              payload: { account_name: "Xi" }
              as: Receptionist
              captures: { hh: $.data.id }
            - call: "POST /clinic/patients"
              payload: { household_id: "${hh}", name: "Pup", species: "DOG", weight_kg: 6 }
              as: Receptionist
              captures: { pat: $.data.id }
          trigger:
            - call: "POST /clinic/vaccinations"
              payload: { patient_id: "${pat}", vaccine_code: "DHPP", administered_at: "2026-03-01T10:00:00Z" }
              as: Veterinarian
              captures: { vax: $.data.id }
          assert:
            - "Vaccination.${vax}.next_due_at == 2026-03-22T10:00:00Z"
            - "Vaccination.${vax}.reminder_at == 2026-03-08T10:00:00Z"

      - name: nonbundled_vaccine_fee_charged
        claim_type: Constants Applied
        grounds: [calculations.wellness_realized_savings, entities.Vaccination.fields.fee_cents]
        distinguishing_aspect: "A non-bundled vaccination charges the base vaccine fee (4500), fee_cents == 4500."
        test_recipe:
          setup: ["A patient with no wellness plan."]
          setup_api_calls:
            - call: "POST /clinic/households"
              payload: { account_name: "Omn" }
              as: Receptionist
              captures: { hh: $.data.id }
            - call: "POST /clinic/patients"
              payload: { household_id: "${hh}", name: "Cat2", species: "CAT", weight_kg: 5 }
              as: Receptionist
              captures: { pat: $.data.id }
          trigger:
            - call: "POST /clinic/vaccinations"
              payload: { patient_id: "${pat}", vaccine_code: "FVRCP", administered_at: "2026-04-01T10:00:00Z", bundled: false }
              as: Veterinarian
              captures: { vax: $.data.id }
          assert:
            - "Vaccination.${vax}.fee_cents == 4500"

      - name: estimate_rounding_order_covered_by_difficulty
        claim_type: Precision
        grounds: [calculations.estimate_projected_total]
        excluded_because:
          difficulty_instance: combinatorial_formula / estimate_rounding_order_per_line_then_sum
          rationale: "Round-per-line-then-sum precision is asserted by the named §1.8 instance."

      - name: surgery_tiered_total_covered_by_difficulty
        claim_type: Correct Result
        grounds: [calculations.surgery_total]
        excluded_because:
          difficulty_instance: combinatorial_formula / surgery_total_tiered_three_input_nonlinear
          rationale: "Weight-band tiered surgery total is asserted by the named §1.8 instance."

  # ===========================================================================
  - section: validations
    instances:
      - name: future_vaccine_administration_rejected
        claim_type: Violation to Error
        grounds: [entities.Vaccination.fields.administered_at, "errors[ERR_FUTURE_ADMINISTRATION]"]
        distinguishing_aspect: "A vaccination administered_at after the clock now (2099) is rejected with ERR_FUTURE_ADMINISTRATION (422)."
        test_recipe:
          setup: ["A patient."]
          setup_api_calls:
            - call: "POST /clinic/households"
              payload: { account_name: "Pi" }
              as: Receptionist
              captures: { hh: $.data.id }
            - call: "POST /clinic/patients"
              payload: { household_id: "${hh}", name: "FuturePet", species: "DOG", weight_kg: 8 }
              as: Receptionist
              captures: { pat: $.data.id }
          trigger:
            - call: "POST /clinic/vaccinations"
              payload: { patient_id: "${pat}", vaccine_code: "RABIES", administered_at: "2099-01-01T10:00:00Z" }
              as: Veterinarian
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_FUTURE_ADMINISTRATION"
            - "http_status == 422"

      - name: controlled_refill_cooldown_rejected
        claim_type: Violation to Error
        grounds: ["validations[priority=9]", entities.Prescription.fields.is_controlled, "errors[ERR_CONTROLLED_COOLDOWN]"]
        distinguishing_aspect: "A second refill of a controlled prescription within 30 days of the first (default clock advances < 30 days between the two sequential refills) is rejected with ERR_CONTROLLED_COOLDOWN (422)."
        test_recipe:
          setup: ["A controlled prescription with 3 authorized refills; one refill already dispensed (last_refill_at = clock now)."]
          setup_api_calls:
            - call: "POST /clinic/households"
              payload: { account_name: "Rho" }
              as: Receptionist
              captures: { hh: $.data.id }
            - call: "POST /clinic/patients"
              payload: { household_id: "${hh}", name: "Rx Pet", species: "DOG", weight_kg: 15 }
              as: Receptionist
              captures: { pat: $.data.id }
            - call: "POST /clinic/prescriptions"
              payload: { patient_id: "${pat}", drug_name: "Phenobarbital", refills_authorized: 3, is_controlled: true }
              as: Veterinarian
              captures: { rx: $.data.id }
            - call: "POST /clinic/prescriptions/${rx}/refill"
              payload: {}
              as: Veterinarian
          trigger:
            - call: "POST /clinic/prescriptions/${rx}/refill"
              payload: {}
              as: Veterinarian
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_CONTROLLED_COOLDOWN"
            - "http_status == 422"

      - name: no_refills_remaining_rejected
        claim_type: Violation to Error
