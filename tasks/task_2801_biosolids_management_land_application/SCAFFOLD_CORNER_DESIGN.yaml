          setup:
            - "One facility exists. The batch is created with the full nutrient and process payload but no advance-process call has been made."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
