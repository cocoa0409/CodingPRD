              captures: { hrbp_id: $.data.id }
            - call: "POST /hr-org-units/${ou_id}/employees"
              payload: { full_name: "E1", email: "e@x.com", job_family: "ENGINEERING", job_level: 5, manager_id: "${mgr_id}" }
              as: HRSystemAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /hr-org-units/${ou_id}/employees/${emp_id}/coaching-log-entries"
              payload: { occurred_at: "2026-07-01T10:00:00Z", category: "VELOCITY", severity: "DOCUMENTED", narrative: "Velocity coaching: sprint commitment vs delivery gap reviewed with recovery plan." }
              as: Manager
              as_user_id: "${mgr_id}"
