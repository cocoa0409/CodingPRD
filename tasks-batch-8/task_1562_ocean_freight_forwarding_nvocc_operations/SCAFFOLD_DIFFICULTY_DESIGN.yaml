            - { call: "POST /freight/invoices/${inv}/issue", payload: {}, as: FinanceController }
          trigger:
            - { call: "POST /freight/invoices/${inv}/payments", payload: { amount_cents: 50000 }, as: FinanceController, captures: { st1: $.data.status, bal1: $.data.balance_cents } }
            - { call: "POST /freight/invoices/${inv}/payments", payload: { amount_cents: 10000 }, as: FinanceController, captures: { st2: $.data.status, bal2: $.data.balance_cents } }
            - { call: "POST /freight/invoices/${inv}/payments", payload: { amount_cents: 17400 }, as: FinanceController, captures: { st3: $.data.status, bal3: $.data.balance_cents, paid3: $.data.paid_cents } }
          assert:
