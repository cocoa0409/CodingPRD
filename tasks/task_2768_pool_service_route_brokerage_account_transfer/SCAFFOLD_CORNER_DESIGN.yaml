  - section: validations
    note: "Table-4 claims over the 70 ordered rules: auth and envelope violations, the billing history/uniqueness/temporal trio, the escrow, down-payment and prequalification boundaries where satisfaction is one cent away from violation, the half-open guarantee and introduction rules, queue ordering, clock monotonicity, uniqueness, the financing identity, replacement targeting, the listed-MRR substantiation gate, listing-state gating, the exclusion write barrier, entity-backed ownership, the holdback release instant, plus two priority-pair stubs."
    instances:

      - name: listing_write_without_a_known_role_header_unauthenticated
        claim_type: violation_to_error
        grounds:
          - "validations[priority=1]"
          - "errors.ERR_UNAUTHENTICATED"
          - "roles"
          - "endpoints[POST /route-listings]"
          - "endpoints[GET /route-listings]"
        distinguishing_aspect: "Priority 1 fires ahead of every other rule and treats a MISSING header and an UNRECOGNISED role identically: the same well-formed listing body is refused 401 with no X-Role and 401 with X-Role: Auditor -- not 403, which is reserved for a known role that lacks the endpoint."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; one ACTIVE seller Sun Valley Pools LLC."
            - "No listing exists yet."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: {"current_utc": "2026-08-01T00:00:00Z"}
              as: PlatformAdmin
            - call: "POST /sellers"
              payload: {"legal_name": "Sun Valley Pools LLC", "state_code": "AZ", "license_number": "AZ-PA-1001"}
              as: Broker
              captures: {"seller_id": "$.data.id"}
          trigger:
            - call: "POST /route-listings"
              payload: {"seller_id": "${seller_id}", "region_code": "PHX-NE", "state_code": "AZ", "asking_price_cents": 460000, "listed_mrr_cents": 43000, "listed_account_count": 3, "exclusive_start_date": "2026-08-01", "exclusive_end_date": "2026-11-01"}
            - call: "POST /route-listings"
              payload: {"seller_id": "${seller_id}", "region_code": "PHX-NE", "state_code": "AZ", "asking_price_cents": 460000, "listed_mrr_cents": 43000, "listed_account_count": 3, "exclusive_start_date": "2026-08-01", "exclusive_end_date": "2026-11-01"}
              as: Auditor
            - call: "GET /route-listings"
              as: Auditor
            - call: "GET /route-listings"
              as: Broker
          assert:
            - "POST with NO X-Role header at all: HTTP 401, data.error_id == \"ERR_UNAUTHENTICATED\"."
            - "POST with X-Role: Auditor (not one of the five declared roles): HTTP 401, data.error_id == \"ERR_UNAUTHENTICATED\", NOT 403."
            - "GET /route-listings with X-Role: Auditor: HTTP 401, data.error_id == \"ERR_UNAUTHENTICATED\" -- reads are guarded too."
            - "GET /route-listings as Broker: HTTP 200 with total_count == 0, proving neither rejected POST created a listing."

      - name: pagination_limit_and_offset_out_of_range_rejected
        claim_type: violation_to_error
        grounds:
          - "response_envelope.pagination_defaults"
          - "validations[priority=6]"
          - "errors.ERR_VALIDATION"
          - "endpoints[GET /service-accounts]"
        distinguishing_aspect: "The pagination envelope's own bounds are validated, not silently clamped: limit 0 and limit 101 are 400s while limit 100 (the inclusive maximum) and offset 3 (one past the last row) both succeed -- a clamping implementation would return rows for limit 101 and never fail."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; AZ profile, seller, buyer."
            - "DRAFT listing PHX-NE with exactly three accounts A1, A2, A3."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: {"current_utc": "2026-08-01T00:00:00Z"}
              as: PlatformAdmin
            - call: "POST /state-license-profiles"
              payload: {"state_code": "AZ", "required_permit_types": ["PESTICIDE_APPLICATOR", "BUSINESS_TAX"], "reciprocity_states": ["NV"], "transfer_processing_days": 21, "cooling_off_days": 14, "provisional_operation_allowed": false}
              as: PlatformAdmin
              captures: {"az_profile_id": "$.data.id"}
            - call: "POST /sellers"
              payload: {"legal_name": "Sun Valley Pools LLC", "state_code": "AZ", "license_number": "AZ-PA-1001"}
              as: Broker
              captures: {"seller_id": "$.data.id"}
            - call: "POST /buyers"
              payload: {"legal_name": "Desert Blue Route Co", "state_code": "AZ", "license_status": "LICENSED", "prequalified_amount_cents": 30000000}
              as: Broker
              captures: {"buyer_id": "$.data.id"}
            - call: "POST /buyers/${buyer_id}/qualify"
