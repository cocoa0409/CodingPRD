              payload: {}
              as: Attorney
            - call: "POST /medical-providers"
              payload: { name: "Inv2 Hospital", contact: "i2@p.example" }
              as: Paralegal
              captures: { provider_id: $.data.id }
            - call: "POST /medical-records-requests"
              payload: { case_id: "${case_id}", provider_id: "${provider_id}" }
              as: Paralegal
              captures: { mrr_id: $.data.id }
            - call: "POST /medical-records-requests/${mrr_id}/receive"
              payload: {}
              as: Paralegal
            - call: "POST /medical-records-requests/${mrr_id}/review"
              payload: {}
              as: Attorney
            - call: "POST /damages-items"
              payload: { case_id: "${case_id}", category: "MEDICAL_BILLS", amount_cents: 500000 }
              as: Paralegal
              captures: { di_base_id: $.data.id }
            - call: "POST /damages-items/${di_base_id}/include"
              payload: {}
              as: Attorney
            - call: "POST /damages-items"
              payload: { case_id: "${case_id}", category: "PROPERTY", amount_cents: 300000 }
              as: Paralegal
              captures: { di_rt_id: $.data.id }
          trigger:
            - call: "POST /damages-items/${di_rt_id}/include"
              payload: {}
              as: Attorney
            - call: "GET /cases/${case_id}"
              payload: {}
              as: Attorney
              captures: { mid_total: $.data.included_damages_total_cents }
            - call: "POST /damages-items/${di_rt_id}/exclude"
