          - entities.StormEvent.fields.remaining_pool_units
        distinguishing_aspect: "CLOSED is reachable straight from DECLARED without passing through ALLOCATING; the pool counters stay at allocation_pool_units 25, allocated_units 0 and remaining_pool_units 25."
        test_recipe:
          setup:
            - "One StormEvent for region TX, severity WATCH, allocation_pool_units 25, still in DECLARED."
