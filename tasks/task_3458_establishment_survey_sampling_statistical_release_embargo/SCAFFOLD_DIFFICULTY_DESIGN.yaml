            - { call: "POST /survey/establishments", payload: { ein: "11-0001207", name: "RM5", industry_code: RETAIL, size_class: MEDIUM }, as: CollectionOfficer, captures: { rm5: $.data.id } }
            - { call: "POST /survey/panel-enrollments", payload: { establishment_id: "${rs1}", program_code: "CES" }, as: CollectionOfficer, captures: { en_rs1: $.data.id } }
            - { call: "POST /survey/panel-enrollments", payload: { establishment_id: "${rs2}", program_code: "CES" }, as: CollectionOfficer, captures: { en_rs2: $.data.id } }
