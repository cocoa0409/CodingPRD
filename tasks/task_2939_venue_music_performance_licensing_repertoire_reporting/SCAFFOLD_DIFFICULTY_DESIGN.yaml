          - entities.Venue.fields.voided_amount_cents
        distinguishing_aspect: |
          Conserved quantity: money, as the four-way ledger identity
          outstanding + settled + voided == lifetime_assessed on the Venue. The forward action is a
          part payment of 40017 against the 90017 INITIAL assessment; the compensating action is
          termination with void_unpaid_assessments == true, which must move exactly the unpaid
