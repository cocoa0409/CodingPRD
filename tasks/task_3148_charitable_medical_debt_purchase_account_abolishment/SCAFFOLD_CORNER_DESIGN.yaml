# =============================================================================
# S1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3148_charitable_medical_debt_purchase_account_abolishment
# =============================================================================
scaffold_corner_design:
- section: entities
  instances:
  - name: source_org_create_returns_defaults
    claim_type: Creation
    grounds:
    - entities.SourceOrganization
    - endpoints.POST_/api/source-organizations
    distinguishing_aspect: Creating an org with only the four required inputs returns 201 with status ACTIVE, version 1, and server-minted id/created_at/updated_at
      - status is never client-supplied.
    test_recipe:
      setup:
      - Logical clock at 2026-09-01T00:00:00Z. Empty database.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      trigger:
      - call: POST /api/source-organizations
        payload:
          name: Pecos Valley Physicians
          org_type: PHYSICIAN_GROUP
          state_code: NM
          contact_email: ap@pecos.example
        as: PlatformAdmin
        captures:
          org2: $.data.id
      assert:
      - the response status is 201 and response_type is object
      - SourceOrganization.${org2}.status == ACTIVE and version == 1
      - id, created_at, updated_at are non-null; created_at == 2026-09-01T00:00:00.000Z (logical clock)
      - meta.api_request_id and meta.api_request_timestamp are present
  - name: portfolio_create_defaults_draft_with_null_quote
    claim_type: Defaults
    grounds:
    - entities.Portfolio
    - endpoints.POST_/api/portfolios
    distinguishing_aspect: A new portfolio defaults status DRAFT, all computed totals 0, quoted_price_cents null, purchased_price_cents null,
      version 1.
    test_recipe:
      setup:
      - Logical clock set; one HOSPITAL org.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /api/source-organizations
        payload:
          name: Mercy General Hospital
          org_type: HOSPITAL
          state_code: TX
          contact_email: billing@org.example
        as: PlatformAdmin
        captures:
          org_id: $.data.id
      trigger:
      - call: POST /api/portfolios
        payload:
          source_org_id: ${org_id}
          label: Mercy Q3 bundle
          face_value_cents: 2200000
          asking_price_cents: 50000
        as: PortfolioAnalyst
        captures:
          pf_id: $.data.id
      assert:
      - Portfolio.${pf_id}.status == DRAFT
      - eligible_face_value_cents == 0, eligible_account_count == 0, abolished_face_value_cents == 0
      - quoted_price_cents is null and purchased_price_cents is null
      - version == 1
  - name: account_import_initializes_three_parallel_dimensions
    claim_type: System Fields
    grounds:
    - entities.DebtAccount
    - endpoints.POST_/api/portfolios/{id}/accounts
    distinguishing_aspect: Import stamps eligibility_status UNSCREENED, lifecycle_status AVAILABLE, and bureau_status from reported_to_bureau
      (REPORTED vs NOT_REPORTED) independently - the three dimensions evolve separately.
    test_recipe:
      setup:
      - Logical clock set; HOSPITAL org; DRAFT portfolio.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /api/source-organizations
        payload:
          name: Mercy General Hospital
          org_type: HOSPITAL
          state_code: TX
          contact_email: billing@org.example
        as: PlatformAdmin
        captures:
          org_id: $.data.id
      - call: POST /api/portfolios
        payload:
          source_org_id: ${org_id}
          label: Mercy Q3 bundle
          face_value_cents: 2200000
          asking_price_cents: 50000
        as: PortfolioAnalyst
        captures:
          pf_id: $.data.id
      trigger:
      - call: POST /api/portfolios/${pf_id}/accounts
        payload:
          accounts:
          - external_ref: X1
            debtor_household_key: HX1
            debtor_zip: '75030'
            debtor_state: TX
            household_size: 1
            annual_income_cents: 1000000
            is_insolvent: false
            balance_cents: 100000
            accrued_adjustment_cents: 0
            reported_to_bureau: true
            bureau_name: EXPERIAN
            mailing_address: 1 Main St
          - external_ref: X2
            debtor_household_key: HX2
            debtor_zip: '75031'
            debtor_state: TX
            household_size: 1
            annual_income_cents: 1000000
            is_insolvent: false
            balance_cents: 200000
            accrued_adjustment_cents: 0
            reported_to_bureau: false
            bureau_name: null
            mailing_address: 1 Main St
        as: PortfolioAnalyst
        captures:
          x1: $.data[0].id
          x2: $.data[1].id
      assert:
      - DebtAccount.${x1}.eligibility_status == UNSCREENED and lifecycle_status == AVAILABLE
      - DebtAccount.${x1}.bureau_status == REPORTED (reported_to_bureau true)
      - DebtAccount.${x2}.bureau_status == NOT_REPORTED (reported_to_bureau false)
      - both accounts carry abolished_amount_cents null, abolished_at null, version 1
  - name: portfolio_get_unknown_id_returns_not_found
    claim_type: Not Found
    grounds:
    - endpoints.GET_/api/portfolios/{id}
    - errors.ERR_NOT_FOUND
    - validations[priority=4]
    distinguishing_aspect: A well-formed but unallocated id on the path yields 404 ERR_NOT_FOUND from the path-existence check.
    test_recipe:
      setup:
      - Logical clock set. No portfolios exist.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      trigger:
      - call: GET /api/portfolios/00000000-0000-4000-8000-000000000000
        payload: {}
        as: PortfolioAnalyst
        captures:
          err: $.data.error_id
      assert:
      - the response status is 404 and error_id == ERR_NOT_FOUND
      - response_type is error and data carries both error_id and message
  - name: portfolio_create_missing_label_returns_invalid_request
    claim_type: Required Fields
    grounds:
    - validations[priority=1]
    - errors.ERR_INVALID_REQUEST
    - endpoints.POST_/api/portfolios
    distinguishing_aspect: label has no default; omitting it is a priority-1 request error (400), checked before existence or state rules.
    test_recipe:
      setup:
      - Logical clock set; one HOSPITAL org.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /api/source-organizations
        payload:
          name: Mercy General Hospital
          org_type: HOSPITAL
          state_code: TX
          contact_email: billing@org.example
        as: PlatformAdmin
        captures:
          org_id: $.data.id
      trigger:
      - call: POST /api/portfolios
        payload:
          source_org_id: ${org_id}
          face_value_cents: 1000
          asking_price_cents: 10
        as: PortfolioAnalyst
        captures:
          err: $.data.error_id
      assert:
      - the response status is 400 and error_id == ERR_INVALID_REQUEST
      - no portfolio is created
  - name: campaign_create_invalid_earmark_enum_rejected
    claim_type: Type Constraints
    grounds:
    - entities.DonorCampaign.fields.earmark_type
    - validations[priority=1]
    distinguishing_aspect: earmark_type outside {GEOGRAPHY, HOSPITAL, GENERAL} is a 400 ERR_INVALID_REQUEST enum violation.
    test_recipe:
      setup:
      - Logical clock set.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      trigger:
      - call: POST /api/donor-campaigns
        payload:
          name: Bogus
          earmark_type: COUNTY
          goal_cents: 1000
        as: DonorRelationsOfficer
        captures:
          err: $.data.error_id
      assert:
      - the response status is 400 and error_id == ERR_INVALID_REQUEST
  - name: account_import_household_size_zero_rejected
    claim_type: Type Constraints
    grounds:
    - entities.DebtAccount.fields.household_size
    - errors.ERR_INVALID_HOUSEHOLD_DATA
    distinguishing_aspect: household_size present but < 1 is a domain data error (422 ERR_INVALID_HOUSEHOLD_DATA); the bulk import is atomic,
      so the valid sibling account is not persisted either.
    test_recipe:
      setup:
      - Logical clock set; HOSPITAL org; DRAFT portfolio.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /api/source-organizations
        payload:
          name: Mercy General Hospital
          org_type: HOSPITAL
          state_code: TX
          contact_email: billing@org.example
        as: PlatformAdmin
        captures:
          org_id: $.data.id
      - call: POST /api/portfolios
        payload:
          source_org_id: ${org_id}
          label: Mercy Q3 bundle
          face_value_cents: 2200000
          asking_price_cents: 50000
        as: PortfolioAnalyst
        captures:
          pf_id: $.data.id
      trigger:
      - call: POST /api/portfolios/${pf_id}/accounts
        payload:
          accounts:
          - external_ref: BAD
            debtor_household_key: HB
            debtor_zip: '75040'
            debtor_state: TX
            household_size: 0
            annual_income_cents: 100
            is_insolvent: false
            balance_cents: 1000
            accrued_adjustment_cents: 0
            reported_to_bureau: false
            bureau_name: null
            mailing_address: 1 Main St
          - external_ref: GOOD
            debtor_household_key: HG
            debtor_zip: '75041'
            debtor_state: TX
            household_size: 1
            annual_income_cents: 100
            is_insolvent: false
            balance_cents: 1000
            accrued_adjustment_cents: 0
            reported_to_bureau: false
            bureau_name: null
            mailing_address: 1 Main St
        as: PortfolioAnalyst
        captures:
          err: $.data.error_id
      assert:
      - the response status is 422 and error_id == ERR_INVALID_HOUSEHOLD_DATA
      - GET /api/accounts?portfolio_id=${pf_id} returns 0 rows (atomic import, no partial persistence)
  - name: account_import_reported_without_bureau_name_rejected
    claim_type: Required Fields
    grounds:
    - entities.DebtAccount.fields.bureau_name
    - errors.ERR_INVALID_REQUEST
    distinguishing_aspect: reported_to_bureau true with bureau_name null is a conditional required-field violation -> 400 ERR_INVALID_REQUEST.
    test_recipe:
      setup:
      - Logical clock set; HOSPITAL org; DRAFT portfolio.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /api/source-organizations
        payload:
          name: Mercy General Hospital
          org_type: HOSPITAL
          state_code: TX
          contact_email: billing@org.example
        as: PlatformAdmin
        captures:
          org_id: $.data.id
      - call: POST /api/portfolios
        payload:
          source_org_id: ${org_id}
          label: Mercy Q3 bundle
          face_value_cents: 2200000
          asking_price_cents: 50000
        as: PortfolioAnalyst
        captures:
          pf_id: $.data.id
      trigger:
      - call: POST /api/portfolios/${pf_id}/accounts
        payload:
          accounts:
          - external_ref: NB
            debtor_household_key: HNB
            debtor_zip: '75042'
            debtor_state: TX
            household_size: 1
            annual_income_cents: 100
            is_insolvent: false
            balance_cents: 1000
            accrued_adjustment_cents: 0
            reported_to_bureau: true
            bureau_name: null
            mailing_address: 1 Main St
        as: PortfolioAnalyst
        captures:
          err: $.data.error_id
      assert:
      - the response status is 400 and error_id == ERR_INVALID_REQUEST
      - no accounts are persisted
  - name: donation_computed_fee_and_net_ignore_client_values
    claim_type: Computed Fields
    grounds:
    - entities.Donation.fields.fee_cents
    - entities.Donation.fields.net_cents
    - calculations.donation_netting
    distinguishing_aspect: 'fee_cents and net_cents are computed: gross 10001 yields fee 290 and net 9711 regardless of anything the client sends.'
    test_recipe:
      setup:
      - Logical clock set; one GENERAL campaign.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /api/donor-campaigns
        payload:
          name: Fee Fund
          earmark_type: GENERAL
          goal_cents: 1000000
        as: DonorRelationsOfficer
        captures:
          camp_id: $.data.id
      trigger:
      - call: POST /api/donor-campaigns/${camp_id}/donations
        payload:
          donor_name: F
          donor_email: f@x.com
          gross_cents: 10001
        as: DonorRelationsOfficer
        captures:
          df: $.data.id
      assert:
      - Donation.${df}.fee_cents == 290 (round_half_up(10001 * 0.029))
      - Donation.${df}.net_cents == 9711
      - Donation.${df}.status == PLEDGED
- section: state_machines
  instances:
  - name: policy_initial_state_draft_and_activation
    claim_type: Initial State
    grounds:
    - state_machines.EligibilityPolicy
    - endpoints.POST_/api/eligibility-policies
    distinguishing_aspect: A created policy starts DRAFT and is unusable for screening until activated; activation flips it to ACTIVE.
    test_recipe:
      setup:
      - Logical clock set.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /api/eligibility-policies
        payload:
          name: TX Standard 400%
          state_code: TX
          fpl_multiplier: 4.0
          insolvency_qualifies: true
          effective_from: '2026-01-01'
          effective_to: '2027-01-01'
        as: EligibilityOfficer
        captures:
          pol_id: $.data.id
      trigger:
      - call: GET /api/eligibility-policies/${pol_id}
        payload: {}
        as: EligibilityOfficer
      - call: POST /api/eligibility-policies/${pol_id}/activate
        payload: {}
        as: EligibilityOfficer
      - call: GET /api/eligibility-policies/${pol_id}
        payload: {}
        as: EligibilityOfficer
      assert:
      - initially EligibilityPolicy.${pol_id}.status == DRAFT
      - 'after activate: status == ACTIVE'
  - name: screening_with_draft_policy_rejected_not_active
    claim_type: Precondition Enforcement
    grounds:
    - state_machines.ScreeningRun
    - errors.ERR_POLICY_NOT_ACTIVE
    distinguishing_aspect: Creating a screening run against a DRAFT policy fails with ERR_POLICY_NOT_ACTIVE - the cross-entity gate fires before
      any account work.
    test_recipe:
      setup:
      - Logical clock set; HOSPITAL org; submitted portfolio with one account; policy left DRAFT.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /api/source-organizations
        payload:
          name: Mercy General Hospital
          org_type: HOSPITAL
          state_code: TX
          contact_email: billing@org.example
        as: PlatformAdmin
        captures:
          org_id: $.data.id
      - call: POST /api/eligibility-policies
        payload:
          name: TX Standard 400%
          state_code: TX
          fpl_multiplier: 4.0
          insolvency_qualifies: true
          effective_from: '2026-01-01'
          effective_to: '2027-01-01'
        as: EligibilityOfficer
        captures:
          pol_id: $.data.id
      - call: POST /api/portfolios
        payload:
          source_org_id: ${org_id}
          label: Mercy Q3 bundle
          face_value_cents: 2200000
          asking_price_cents: 50000
        as: PortfolioAnalyst
        captures:
          pf_id: $.data.id
      - call: POST /api/portfolios/${pf_id}/accounts
        payload:
          accounts:
          - external_ref: S1
            debtor_household_key: HS1
            debtor_zip: '75050'
            debtor_state: TX
            household_size: 1
            annual_income_cents: 100
            is_insolvent: false
            balance_cents: 1000
            accrued_adjustment_cents: 0
            reported_to_bureau: false
            bureau_name: null
            mailing_address: 1 Main St
        as: PortfolioAnalyst
        captures:
          s1: $.data[0].id
      - call: POST /api/portfolios/${pf_id}/submit
        payload: {}
        as: PortfolioAnalyst
      trigger:
      - call: POST /api/portfolios/${pf_id}/screening-runs
        payload:
          policy_id: ${pol_id}
        as: EligibilityOfficer
        captures:
          err: $.data.error_id
      assert:
      - the response status is 409 and error_id == ERR_POLICY_NOT_ACTIVE
      - no screening run is created; portfolio stays SUBMITTED
  - name: portfolio_submit_from_priced_is_invalid_transition
    claim_type: Invalid Transitions
    grounds:
    - state_machines.Portfolio
    - errors.ERR_INVALID_STATE
    distinguishing_aspect: submit is only legal from DRAFT; from PRICED it returns ERR_INVALID_STATE with no side effects.
    test_recipe:
      setup:
      - Logical clock set; standard chain through price-quote (portfolio PRICED).
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /api/source-organizations
        payload:
          name: Mercy General Hospital
          org_type: HOSPITAL
          state_code: TX
          contact_email: billing@org.example
        as: PlatformAdmin
        captures:
          org_id: $.data.id
      - call: POST /api/eligibility-policies
        payload:
          name: TX Standard 400%
          state_code: TX
          fpl_multiplier: 4.0
          insolvency_qualifies: true
          effective_from: '2026-01-01'
          effective_to: '2027-01-01'
        as: EligibilityOfficer
        captures:
          pol_id: $.data.id
      - call: POST /api/eligibility-policies/${pol_id}/activate
        payload: {}
        as: EligibilityOfficer
      - call: POST /api/portfolios
        payload:
          source_org_id: ${org_id}
          label: Mercy Q3 bundle
          face_value_cents: 2200000
          asking_price_cents: 50000
        as: PortfolioAnalyst
        captures:
          pf_id: $.data.id
      - call: POST /api/portfolios/${pf_id}/accounts
        payload:
          accounts: &id001
          - external_ref: A1
            debtor_household_key: H1
            debtor_zip: '75001'
            debtor_state: TX
            household_size: 1
            annual_income_cents: 5000000
            is_insolvent: false
            balance_cents: 1000000
            accrued_adjustment_cents: 50000
            reported_to_bureau: true
            bureau_name: EQUIFAX
            mailing_address: 1 Main St
          - external_ref: A2
            debtor_household_key: H1
            debtor_zip: '75002'
            debtor_state: TX
            household_size: 1
            annual_income_cents: 6260000
            is_insolvent: false
            balance_cents: 500000
            accrued_adjustment_cents: 0
            reported_to_bureau: false
            bureau_name: null
            mailing_address: 2 Oak Ave
          - external_ref: A3
            debtor_household_key: H2
            debtor_zip: '75003'
            debtor_state: TX
            household_size: 1
            annual_income_cents: 9999999
            is_insolvent: false
            balance_cents: 700000
            accrued_adjustment_cents: 0
            reported_to_bureau: false
            bureau_name: null
            mailing_address: 3 Pine Rd
        as: PortfolioAnalyst
        captures:
          a1: $.data[0].id
          a2: $.data[1].id
          a3: $.data[2].id
      - call: POST /api/portfolios/${pf_id}/submit
        payload: {}
        as: PortfolioAnalyst
      - call: POST /api/portfolios/${pf_id}/screening-runs
        payload:
          policy_id: ${pol_id}
        as: EligibilityOfficer
        captures:
          run_id: $.data.id
      - call: POST /api/screening-runs/${run_id}/execute
        payload: {}
        as: EligibilityOfficer
      - call: POST /api/portfolios/${pf_id}/price-quote
        payload: {}
        as: PortfolioAnalyst
        captures:
          pf_v_priced: $.data.version
      trigger:
      - call: POST /api/portfolios/${pf_id}/submit
        payload: {}
        as: PortfolioAnalyst
        captures:
          err: $.data.error_id
      assert:
      - the response status is 409 and error_id == ERR_INVALID_STATE
      - Portfolio.${pf_id}.status remains PRICED and quoted_price_cents unchanged (37500)
