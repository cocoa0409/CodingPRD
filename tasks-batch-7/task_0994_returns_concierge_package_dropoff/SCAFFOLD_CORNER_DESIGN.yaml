            - { call: "POST /v1/subscription-plans/${plan_id}/publish", payload: {}, as: PlatformAdmin }
            - { call: "POST /v1/merchant-accounts", payload: { legal_name: "M-LM", plan_id: "${plan_id}" }, as: PlatformAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /v1/merchant-accounts/${m_id}/billing-cycles", payload: { period_start: "2026-04-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /v1/shoppers", payload: { email: "slm@x.com", full_name: "S LM", postal_code: "30045" }, as: Shopper, captures: { sh_id: $.data.id } }
            - { call: "POST /v1/return-orders", payload: { shopper_id: "${sh_id}", merchant_id: "${m_id}", method: COUNTER_DROP, boxless: true, items: [ { sku: "LM", quantity: 1, unit_price_cents: 100, declared_condition: NEW, longest_side_cm: 10, weight_grams: 50 } ] }, as: Shopper, as_user_id: "${sh_id}", captures: { ro_id: $.data.id, ro_v: $.data.version } }
          trigger:
            - { call: "POST /v1/return-orders/${ro_id}/labels", payload: { label_type: CARRIER_LABEL, expected_return_order_version: "${ro_v}" }, as: Shopper, as_user_id: "${sh_id}", captures: { err: $.data.error_id } }
          assert: ["err == ERR_LABEL_METHOD_MISMATCH"]

      - name: error_pickup_window_past
        claim_type: violation_to_error
        grounds: ["errors[ERR_PICKUP_WINDOW_PAST]", "validations[priority=10]"]
        distinguishing_aspect: "Appointment with window_start before the current clock fails with ERR_PICKUP_WINDOW_PAST (order otherwise valid INITIATED)."
        test_recipe:
          setup: ["HOME_PICKUP order INITIATED; zone exists"]
          setup_api_calls:
            - { call: "POST /v1/subscription-plans", payload: { tier: CUSTOM, monthly_fee_cents: 100, included_returns: 100, overage_fee_cents: 10, pickup_enabled: true, boxless_enabled: true, oversize_enabled: true, free_returns: false, oversize_surcharge_cents: 0, pickup_fee_cents: 0 }, as: PlatformAdmin, captures: { plan_id: $.data.id } }
