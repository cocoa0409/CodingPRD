# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Breadth probe across §1.1–§1.7 claims not already covered by §1.8.

scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: farm_creation_defaults_and_required_fields
        claim_type: creation
        grounds:
          - 'entities.Farm'
          - 'endpoints."POST /glean/farms"'
        distinguishing_aspect: "POST with all required fields yields 201, active_flag defaults true, system id/created_at/version present; missing donor_tin yields ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /glean/farms"
              payload: { farm_name: "CornerFarm", contact_email: "cf@x.com", county_code: "CF1", donor_tin: "20-1111111" }
              as: ProgramCoordinator
              captures: { fid: $.data.id, ver: $.data.version, act: $.data.active_flag }
          trigger:
            - call: "POST /glean/farms"
              payload: { farm_name: "NoTIN", contact_email: "nt@x.com", county_code: "CF1" }
              as: ProgramCoordinator
              captures: { err_id: $.data.error_id }
          assert:
            - "act == true (default applied)"
            - "ver == 1 and Farm.${fid}.created_at is non-null"
            - "err_id == ERR_INVALID_REQUEST (missing required donor_tin)"

      - name: entity_not_found_envelope
        claim_type: not_found
        grounds:
          - 'errors[ERR_NOT_FOUND]'
          - 'response_envelope'
        distinguishing_aspect: "GET /glean/farms/{random-uuid} returns 404 ERR_NOT_FOUND inside the fixed error envelope with meta + response_type error."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /glean/farms/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: ProgramCoordinator
              captures: { err_id: $.data.error_id }
          assert:
            - "err_id == ERR_NOT_FOUND"
            - "HTTP status == 404 and envelope carries meta.api_request_id and response_type == error"

      - name: list_pagination_envelope
        claim_type: listing
        grounds:
          - 'response_envelope'
          - 'endpoints."GET /glean/volunteers"'
        distinguishing_aspect: "List endpoint honors limit/offset and reports total_count and has_more; defaults limit=10."
        test_recipe:
          setup: ["three volunteers registered"]
          setup_api_calls:
            - call: "POST /glean/volunteers"
              payload: { full_name: "P A", email: "pa@x.com" }
              as: ProgramCoordinator
            - call: "POST /glean/volunteers"
              payload: { full_name: "P B", email: "pb@x.com" }
              as: ProgramCoordinator
            - call: "POST /glean/volunteers"
              payload: { full_name: "P C", email: "pc@x.com" }
              as: ProgramCoordinator
          trigger:
            - call: "GET /glean/volunteers"
              payload: { limit: 2, offset: 0 }
              as: ProgramCoordinator
              captures: { first_email: "$.data[0].email" }
          assert:
            - "response array length == 2 (limit honored)"
            - "envelope exposes total_count == 3 and has_more == true"
            - "first_email is one of the three registered volunteer emails"

      - name: waiver_immutability_no_version_field
        claim_type: immutability
        grounds:
          - 'entities.Waiver'
        distinguishing_aspect: "Waiver has common_fields: false — response carries id + created_at only, no version/updated_at; no update endpoint exists."
        test_recipe:
          setup: ["event OPEN with leader and a volunteer"]
          setup_api_calls:
            - call: "POST /glean/farms"
              payload: { farm_name: "WF", contact_email: "wf@x.com", county_code: "WVV", donor_tin: "21-1111111" }
              as: ProgramCoordinator
              captures: { farm_id: $.data.id }
            - call: "POST /glean/vehicles"
              payload: { plate: "WP1", payload_capacity_lbs: 5000, refrigerated: false }
              as: ProgramCoordinator
              captures: { veh_id: $.data.id }
            - call: "POST /glean/volunteers"
              payload: { full_name: "WL", email: "wl@x.com", crew_leader_certified: true }
              as: ProgramCoordinator
              captures: { lead_id: $.data.id }
            - call: "POST /glean/volunteers"
              payload: { full_name: "WV", email: "wv@x.com" }
              as: ProgramCoordinator
              captures: { vol_id: $.data.id }
            - call: "POST /glean/offers"
              payload: { farm_id: "${farm_id}", crop_code: "ROOT_VEG", estimated_lbs: 100.0, window_start: "2026-08-05T00:00:00Z", window_end: "2026-08-20T00:00:00Z", perishability_class: "LOW", requires_refrigeration: false }
              as: ProgramCoordinator
              captures: { offer_id: $.data.id }
            - call: "POST /glean/events"
              payload: { surplus_offer_id: "${offer_id}", scheduled_start: "2026-08-10T08:00:00Z", scheduled_end: "2026-08-10T12:00:00Z", crew_leader_volunteer_id: "${lead_id}", assigned_vehicle_id: "${veh_id}", crew_capacity: 2 }
              as: ProgramCoordinator
              captures: { event_id: $.data.id }
          trigger:
            - call: "POST /glean/waivers"
              payload: { volunteer_id: "${vol_id}", glean_event_id: "${event_id}", signature_payload: "sigW", witness_volunteer_id: "${lead_id}" }
              as: Volunteer
              as_user_id: "${vol_id}"
              captures: { w: $.data }
          assert:
            - "Waiver response contains id, created_at, volunteer_id, glean_event_id, signed_at, signature_payload, witness_volunteer_id"
            - "Waiver response contains NO 'version' and NO 'updated_at' key (common_fields: false)"

      - name: templog_breach_flag_computed_not_input
        claim_type: computed_fields
        grounds:
          - 'entities.TempLog.fields.breach_flag'
          - 'calculations.cold_chain_breach'
        distinguishing_aspect: "Client-supplied breach_flag is ignored; server computes it from perishability threshold (LOW: 55.0)."
        test_recipe:
          setup: ["LOW-perishability event IN_PROGRESS"]
          setup_api_calls:
            - call: "POST /glean/farms"
              payload: { farm_name: "TF", contact_email: "tf@x.com", county_code: "TL1", donor_tin: "22-1111111" }
              as: ProgramCoordinator
              captures: { farm_id: $.data.id }
            - call: "POST /glean/vehicles"
              payload: { plate: "TP1", payload_capacity_lbs: 5000, refrigerated: false }
              as: ProgramCoordinator
              captures: { veh_id: $.data.id }
            - call: "POST /glean/volunteers"
              payload: { full_name: "TL", email: "tl@x.com", crew_leader_certified: true }
              as: ProgramCoordinator
              captures: { lead_id: $.data.id }
            - call: "POST /glean/offers"
              payload: { farm_id: "${farm_id}", crop_code: "ROOT_VEG", estimated_lbs: 100.0, window_start: "2026-08-05T00:00:00Z", window_end: "2026-08-20T00:00:00Z", perishability_class: "LOW", requires_refrigeration: false }
              as: ProgramCoordinator
              captures: { offer_id: $.data.id }
            - call: "POST /glean/events"
              payload: { surplus_offer_id: "${offer_id}", scheduled_start: "2026-08-10T08:00:00Z", scheduled_end: "2026-08-10T12:00:00Z", crew_leader_volunteer_id: "${lead_id}", assigned_vehicle_id: "${veh_id}", crew_capacity: 1 }
              as: ProgramCoordinator
              captures: { event_id: $.data.id }
          trigger:
            - call: "POST /glean/templogs"
              payload: { glean_event_id: "${event_id}", recorded_at: "2026-08-10T10:00:00Z", temp_f: 60.0 }
              as: FoodSafetyOfficer
              captures: { breach: $.data.breach_flag }
          assert:
            - "breach == true (LOW threshold 55.0; 60.0 > 55.0) — computed server-side, no client field accepted"

      - name: fk_reverse_reachability_subresources
        claim_type: parent_relationships
        grounds:
          - 'entities.Waiver.fields.glean_event_id'
          - 'endpoints."GET /glean/events/{id}/waivers"'
          - 'endpoints."GET /glean/agencies/{id}/distributions"'
          - 'endpoints."GET /glean/offers/{id}/receipt"'
        distinguishing_aspect: "Every FK in §1.1 is traversable from its parent via a GET sub-resource or filtered list returning Child[]."
        test_recipe:
          setup: ["farm, offer, event, volunteer+leader, waiver signed"]
          setup_api_calls:
            - call: "POST /glean/farms"
              payload: { farm_name: "RF", contact_email: "rf@x.com", county_code: "RF1", donor_tin: "23-1111111" }
              as: ProgramCoordinator
              captures: { farm_id: $.data.id }
            - call: "POST /glean/vehicles"
              payload: { plate: "RP1", payload_capacity_lbs: 5000, refrigerated: false }
              as: ProgramCoordinator
              captures: { veh_id: $.data.id }
            - call: "POST /glean/volunteers"
              payload: { full_name: "RL", email: "rl@x.com", crew_leader_certified: true }
              as: ProgramCoordinator
              captures: { lead_id: $.data.id }
            - call: "POST /glean/volunteers"
              payload: { full_name: "RV", email: "rv@x.com" }
              as: ProgramCoordinator
              captures: { vol_id: $.data.id }
            - call: "POST /glean/offers"
              payload: { farm_id: "${farm_id}", crop_code: "ROOT_VEG", estimated_lbs: 100.0, window_start: "2026-08-05T00:00:00Z", window_end: "2026-08-20T00:00:00Z", perishability_class: "LOW", requires_refrigeration: false }
              as: ProgramCoordinator
              captures: { offer_id: $.data.id }
            - call: "POST /glean/events"
              payload: { surplus_offer_id: "${offer_id}", scheduled_start: "2026-08-10T08:00:00Z", scheduled_end: "2026-08-10T12:00:00Z", crew_leader_volunteer_id: "${lead_id}", assigned_vehicle_id: "${veh_id}", crew_capacity: 2 }
              as: ProgramCoordinator
              captures: { event_id: $.data.id }
            - call: "POST /glean/waivers"
              payload: { volunteer_id: "${vol_id}", glean_event_id: "${event_id}", signature_payload: "sigR", witness_volunteer_id: "${lead_id}" }
              as: Volunteer
              as_user_id: "${vol_id}"
          trigger:
            - call: "GET /glean/farms/${farm_id}/offers"
              payload: {}
              as: ProgramCoordinator
              captures: { offer_back_id: "$.data[0].id" }
            - call: "GET /glean/events/${event_id}/waivers"
              payload: {}
              as: ProgramCoordinator
              captures: { waiver_event_id: "$.data[0].glean_event_id" }
            - call: "GET /glean/volunteers/${vol_id}/waivers"
              payload: {}
              as: ProgramCoordinator
              captures: { waiver_vol_id: "$.data[0].volunteer_id" }
            - call: "GET /glean/offers/${offer_id}/receipt"
              payload: {}
              as: ProgramCoordinator
          assert:
            - "offer_back_id == ${offer_id} (farm -> offers sub-resource returns the offer)"
            - "waiver_event_id == ${event_id} and waiver_vol_id == ${vol_id} (event -> waivers and volunteer -> waivers both resolve)"
            - "GET /glean/offers/${offer_id}/receipt returned an empty array before close (1:1 reverse GET array-of-0 form)"

      - name: offer_enum_and_window_type_constraints
        claim_type: type_constraints
        grounds:
          - 'entities.SurplusOffer.fields.perishability_class'
          - 'validations[priority=7]'
        distinguishing_aspect: "Invalid enum value for perishability_class -> ERR_INVALID_REQUEST; window_end <= window_start -> ERR_EVENT_WINDOW_OUTSIDE_OFFER-class 422 via ERR_INVALID_REQUEST on creation sanity."
        test_recipe:
          setup: ["farm exists"]
          setup_api_calls:
            - call: "POST /glean/farms"
              payload: { farm_name: "EF", contact_email: "ef@x.com", county_code: "EF1", donor_tin: "24-1111111" }
              as: ProgramCoordinator
              captures: { farm_id: $.data.id }
          trigger:
            - call: "POST /glean/offers"
              payload: { farm_id: "${farm_id}", crop_code: "ROOT_VEG", estimated_lbs: 100.0, window_start: "2026-08-05T00:00:00Z", window_end: "2026-08-20T00:00:00Z", perishability_class: "TURBO", requires_refrigeration: false }
              as: ProgramCoordinator
              captures: { err_enum: $.data.error_id }
            - call: "POST /glean/offers"
              payload: { farm_id: "${farm_id}", crop_code: "ROOT_VEG", estimated_lbs: 100.0, window_start: "2026-08-20T00:00:00Z", window_end: "2026-08-05T00:00:00Z", perishability_class: "LOW", requires_refrigeration: false }
              as: ProgramCoordinator
              captures: { err_window: $.data.error_id }
          assert:
            - "err_enum == ERR_INVALID_REQUEST (enum not in {HIGH, MEDIUM, LOW})"
            - "err_window == ERR_INVALID_REQUEST (window_end must be strictly after window_start)"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: event_terminal_lockdown_reconciled
        claim_type: terminal_state_lockdown
        grounds:
          - 'state_machines.GleanEvent'
          - 'errors[ERR_ALREADY_TERMINAL]'
        distinguishing_aspect: "From RECONCILED every further action (start/finish/cancel) is rejected ERR_ALREADY_TERMINAL or ERR_INVALID_STATE; no side effects fire."
        test_recipe:
          setup: ["event fully harvested and reconciled"]
          setup_api_calls:
            - call: "POST /glean/farms"
              payload: { farm_name: "TM", contact_email: "tm@x.com", county_code: "TM1", donor_tin: "25-1111111" }
              as: ProgramCoordinator
              captures: { farm_id: $.data.id }
            - call: "POST /glean/vehicles"
              payload: { plate: "TM1", payload_capacity_lbs: 5000, refrigerated: false }
              as: ProgramCoordinator
              captures: { veh_id: $.data.id }
            - call: "POST /glean/volunteers"
              payload: { full_name: "TML", email: "tml@x.com", crew_leader_certified: true }
              as: ProgramCoordinator
              captures: { lead_id: $.data.id }
            - call: "POST /glean/volunteers"
              payload: { full_name: "TMC", email: "tmc@x.com" }
              as: ProgramCoordinator
              captures: { coord_id: $.data.id }
            - call: "POST /glean/offers"
              payload: { farm_id: "${farm_id}", crop_code: "ROOT_VEG", estimated_lbs: 100.0, window_start: "2026-08-05T00:00:00Z", window_end: "2026-08-20T00:00:00Z", perishability_class: "LOW", requires_refrigeration: false }
              as: ProgramCoordinator
              captures: { offer_id: $.data.id }
            - call: "POST /glean/events"
              payload: { surplus_offer_id: "${offer_id}", scheduled_start: "2026-08-10T08:00:00Z", scheduled_end: "2026-08-10T12:00:00Z", crew_leader_volunteer_id: "${lead_id}", assigned_vehicle_id: "${veh_id}", crew_capacity: 1 }
              as: ProgramCoordinator
              captures: { event_id: $.data.id }
            - call: "POST /glean/events/${event_id}/publish"
              payload: {}
              as: ProgramCoordinator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: ProgramCoordinator
            - call: "POST /glean/events/${event_id}/start"
              payload: {}
              as: CrewLeader
              as_user_id: "${lead_id}"
            - call: "POST /glean/containers"
              payload: { label: "BIN-TM", tare_lbs: 10.0, capacity_lbs: 500, refrigerated: false }
              as: ProgramCoordinator
              captures: { cont_id: $.data.id }
            - call: "POST /glean/lots"
              payload: { glean_event_id: "${event_id}", container_id: "${cont_id}", gross_lbs: 60.0, cull_lbs: 0.0, recorded_by_volunteer_id: "${lead_id}" }
              as: CrewLeader
              as_user_id: "${lead_id}"
              captures: { lot_id: $.data.id }
            - call: "POST /glean/lots/${lot_id}/verify"
              payload: { verified_by_coordinator_id: "${coord_id}" }
              as: ProgramCoordinator
            - call: "POST /glean/events/${event_id}/finish"
              payload: {}
              as: CrewLeader
              as_user_id: "${lead_id}"
            - call: "POST /glean/events/${event_id}/reconcile"
              payload: {}
              as: ProgramCoordinator
          trigger:
            - call: "POST /glean/events/${event_id}/cancel"
              payload: {}
              as: ProgramCoordinator
              captures: { err_id: $.data.error_id }
          assert:
            - "err_id in {ERR_INVALID_STATE, ERR_ALREADY_TERMINAL} and HTTP status 409"
            - "GleanEvent.${event_id}.status == RECONCILED unchanged"

      - name: lot_invalid_from_verified_verify_again
        claim_type: invalid_transition
        grounds:
          - 'state_machines.HarvestLot'
        distinguishing_aspect: "Verifying an already-VERIFIED lot fails ERR_INVALID_STATE (no self-loop); rejecting a VERIFIED lot likewise fails."
        test_recipe:
          setup: ["event IN_PROGRESS with one VERIFIED lot"]
          setup_api_calls:
            - call: "POST /glean/farms"
              payload: { farm_name: "LM", contact_email: "lm@x.com", county_code: "LM1", donor_tin: "26-1111111" }
              as: ProgramCoordinator
              captures: { farm_id: $.data.id }
            - call: "POST /glean/vehicles"
              payload: { plate: "LM1", payload_capacity_lbs: 5000, refrigerated: false }
              as: ProgramCoordinator
              captures: { veh_id: $.data.id }
            - call: "POST /glean/volunteers"
              payload: { full_name: "LML", email: "lml@x.com", crew_leader_certified: true }
              as: ProgramCoordinator
              captures: { lead_id: $.data.id }
            - call: "POST /glean/volunteers"
              payload: { full_name: "LMC", email: "lmc@x.com" }
              as: ProgramCoordinator
              captures: { coord_id: $.data.id }
            - call: "POST /glean/offers"
              payload: { farm_id: "${farm_id}", crop_code: "ROOT_VEG", estimated_lbs: 100.0, window_start: "2026-08-05T00:00:00Z", window_end: "2026-08-20T00:00:00Z", perishability_class: "LOW", requires_refrigeration: false }
              as: ProgramCoordinator
              captures: { offer_id: $.data.id }
            - call: "POST /glean/events"
              payload: { surplus_offer_id: "${offer_id}", scheduled_start: "2026-08-10T08:00:00Z", scheduled_end: "2026-08-10T12:00:00Z", crew_leader_volunteer_id: "${lead_id}", assigned_vehicle_id: "${veh_id}", crew_capacity: 1 }
              as: ProgramCoordinator
              captures: { event_id: $.data.id }
            - call: "POST /glean/events/${event_id}/publish"
              payload: {}
              as: ProgramCoordinator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: ProgramCoordinator
            - call: "POST /glean/events/${event_id}/start"
              payload: {}
              as: CrewLeader
              as_user_id: "${lead_id}"
            - call: "POST /glean/containers"
              payload: { label: "BIN-LM", tare_lbs: 10.0, capacity_lbs: 500, refrigerated: false }
              as: ProgramCoordinator
              captures: { cont_id: $.data.id }
            - call: "POST /glean/lots"
              payload: { glean_event_id: "${event_id}", container_id: "${cont_id}", gross_lbs: 60.0, cull_lbs: 0.0, recorded_by_volunteer_id: "${lead_id}" }
              as: CrewLeader
              as_user_id: "${lead_id}"
              captures: { lot_id: $.data.id }
            - call: "POST /glean/lots/${lot_id}/verify"
              payload: { verified_by_coordinator_id: "${coord_id}" }
              as: ProgramCoordinator
          trigger:
            - call: "POST /glean/lots/${lot_id}/verify"
              payload: { verified_by_coordinator_id: "${coord_id}" }
              as: ProgramCoordinator
              captures: { err_id: $.data.error_id }
          assert:
            - "err_id == ERR_INVALID_STATE (VERIFIED is terminal for the lot machine)"
            - "HarvestLot.${lot_id}.status == VERIFIED unchanged"

      - name: incident_initial_state_open
        claim_type: initial_state
        grounds:
          - 'state_machines.FoodSafetyIncident'
        distinguishing_aspect: "Newly created incident starts OPEN with disposition field absent/OPEN."
        test_recipe:
          setup: ["event exists (any state) to attach incident"]
          setup_api_calls:
            - call: "POST /glean/farms"
              payload: { farm_name: "IM", contact_email: "im@x.com", county_code: "IM1", donor_tin: "27-1111111" }
              as: ProgramCoordinator
              captures: { farm_id: $.data.id }
            - call: "POST /glean/vehicles"
              payload: { plate: "IM1", payload_capacity_lbs: 5000, refrigerated: false }
              as: ProgramCoordinator
              captures: { veh_id: $.data.id }
            - call: "POST /glean/volunteers"
              payload: { full_name: "IML", email: "iml@x.com", crew_leader_certified: true }
              as: ProgramCoordinator
              captures: { lead_id: $.data.id }
            - call: "POST /glean/offers"
              payload: { farm_id: "${farm_id}", crop_code: "ROOT_VEG", estimated_lbs: 100.0, window_start: "2026-08-05T00:00:00Z", window_end: "2026-08-20T00:00:00Z", perishability_class: "LOW", requires_refrigeration: false }
              as: ProgramCoordinator
              captures: { offer_id: $.data.id }
            - call: "POST /glean/events"
              payload: { surplus_offer_id: "${offer_id}", scheduled_start: "2026-08-10T08:00:00Z", scheduled_end: "2026-08-10T12:00:00Z", crew_leader_volunteer_id: "${lead_id}", assigned_vehicle_id: "${veh_id}", crew_capacity: 1 }
              as: ProgramCoordinator
              captures: { event_id: $.data.id }
          trigger:
            - call: "POST /glean/incidents"
              payload: { glean_event_id: "${event_id}", severity: "CRITICAL", condemned_lbs: 10.0, reported_by_volunteer_id: "${lead_id}" }
              as: FoodSafetyOfficer
              captures: { inc_st: $.data.disposition }
          assert:
            - "inc_st == OPEN (initial_state of the disposition-driven machine)"

      - name: finish_requires_verified_lot_precondition
        claim_type: precondition_enforcement
        grounds:
          - 'state_machines.GleanEvent.IN_PROGRESS_to_HARVESTED'
          - 'errors[ERR_INVALID_STATE]'
        distinguishing_aspect: "finish with zero VERIFIED lots (one PENDING only) fails ERR_INVALID_STATE."
        test_recipe:
          setup: ["event IN_PROGRESS; one lot PENDING (not verified)"]
          setup_api_calls:
            - call: "POST /glean/farms"
              payload: { farm_name: "FP2", contact_email: "fp2@x.com", county_code: "FP2", donor_tin: "28-1111111" }
              as: ProgramCoordinator
              captures: { farm_id: $.data.id }
            - call: "POST /glean/vehicles"
              payload: { plate: "FP2", payload_capacity_lbs: 5000, refrigerated: false }
              as: ProgramCoordinator
              captures: { veh_id: $.data.id }
            - call: "POST /glean/volunteers"
              payload: { full_name: "FPL", email: "fpl@x.com", crew_leader_certified: true }
              as: ProgramCoordinator
              captures: { lead_id: $.data.id }
            - call: "POST /glean/offers"
              payload: { farm_id: "${farm_id}", crop_code: "ROOT_VEG", estimated_lbs: 100.0, window_start: "2026-08-05T00:00:00Z", window_end: "2026-08-20T00:00:00Z", perishability_class: "LOW", requires_refrigeration: false }
              as: ProgramCoordinator
              captures: { offer_id: $.data.id }
            - call: "POST /glean/events"
              payload: { surplus_offer_id: "${offer_id}", scheduled_start: "2026-08-10T08:00:00Z", scheduled_end: "2026-08-10T12:00:00Z", crew_leader_volunteer_id: "${lead_id}", assigned_vehicle_id: "${veh_id}", crew_capacity: 1 }
              as: ProgramCoordinator
              captures: { event_id: $.data.id }
            - call: "POST /glean/events/${event_id}/publish"
