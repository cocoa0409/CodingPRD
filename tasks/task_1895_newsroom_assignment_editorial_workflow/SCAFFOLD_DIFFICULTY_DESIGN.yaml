  - rule_id: boundary_precision_check
    instances:
      - name: assignment_cap_at_max
        grounds:
          - validations[priority=14]
          - errors[ERR_ASSIGNMENT_CAP_REACHED]
          - entities.StaffMember.fields.max_concurrent_assignments
        distinguishing_aspect: |
          Numeric-threshold boundary on the accept endpoint: with
          max_concurrent_assignments = 1 the first accept (accepted count 0 < 1)
          succeeds and the second accept (accepted count 1 >= 1) fails exactly at
          equality; the second boundary instance uses a different metric (set
          emptiness) on a different endpoint (submit-edit).
        test_recipe:
          setup:
            - "Reporter with max_concurrent_assignments = 1; two DRAFT stories A and B"
            - "Assignment A1 on story A ACCEPTED (accepted count now 1); assignment A2 on story B PROPOSED"
          setup_api_calls:
            - { call: "POST /newsroom/staff", payload: { full_name: "Desk Eleven", role_capability: DESK_EDITOR, home_desk: METRO, hourly_rate_cents: 6000 }, as: NewsDirector, captures: { desk_id: "$.data.id" } }
            - { call: "POST /newsroom/staff", payload: { full_name: "Rep Eleven", role_capability: REPORTER, home_desk: METRO, hourly_rate_cents: 6000, max_concurrent_assignments: 1 }, as: NewsDirector, captures: { rep_id: "$.data.id" } }
            - { call: "POST /newsroom/pitches", payload: { title: "Story A", summary: "a", desk: METRO, deadline_at: "2026-08-03T00:00:00Z", urgency: STANDARD }, as: Reporter, as_user_id: "${rep_id}", captures: { pa_id: "$.data.id" } }
            - { call: "POST /newsroom/pitches/${pa_id}/start-review", payload: {}, as: AssignmentEditor, as_user_id: "${desk_id}" }
            - { call: "POST /newsroom/pitches/${pa_id}/greenlight", payload: { story_type: PRINT }, as: AssignmentEditor, as_user_id: "${desk_id}", captures: { sa_id: "$.data.greenlit_story_id" } }
            - { call: "POST /newsroom/pitches", payload: { title: "Story B", summary: "b", desk: METRO, deadline_at: "2026-08-03T00:00:00Z", urgency: STANDARD }, as: Reporter, as_user_id: "${rep_id}", captures: { pb_id: "$.data.id" } }
            - { call: "POST /newsroom/pitches/${pb_id}/start-review", payload: {}, as: AssignmentEditor, as_user_id: "${desk_id}" }
            - { call: "POST /newsroom/pitches/${pb_id}/greenlight", payload: { story_type: PRINT }, as: AssignmentEditor, as_user_id: "${desk_id}", captures: { sb_id: "$.data.greenlit_story_id" } }
            - { call: "POST /newsroom/assignments", payload: { story_id: "${sa_id}", staff_id: "${rep_id}", assignment_role: REPORTER, start_at: "2026-08-01T08:00:00Z", end_at: "2026-08-01T09:00:00Z", planned_effort_minutes: 30 }, as: AssignmentEditor, as_user_id: "${desk_id}", captures: { a1_id: "$.data.id" } }
            - { call: "POST /newsroom/assignments/${a1_id}/accept", payload: {}, as: Reporter, as_user_id: "${rep_id}" }
            - { call: "POST /newsroom/assignments", payload: { story_id: "${sb_id}", staff_id: "${rep_id}", assignment_role: REPORTER, start_at: "2026-08-01T10:00:00Z", end_at: "2026-08-01T11:00:00Z", planned_effort_minutes: 30 }, as: AssignmentEditor, as_user_id: "${desk_id}", captures: { a2_id: "$.data.id" } }
          trigger:
            - { call: "POST /newsroom/assignments/${a2_id}/accept", payload: {}, as: Reporter, as_user_id: "${rep_id}", captures: { err: "$.data.error_id" } }
            - { call: "GET /newsroom/staff/${rep_id}", payload: {}, as: NewsDirector, captures: { ac: "$.data.active_assignment_count" } }
            - { call: "GET /newsroom/stories/${sb_id}/assignments", payload: {}, as: AssignmentEditor, as_user_id: "${desk_id}", captures: { a2_status: "$.data[0].status" } }
          assert:
            - "err == ERR_ASSIGNMENT_CAP_REACHED (accepted count 1 >= max 1; rejection exactly at equality)"
            - "a2_status == PROPOSED (failed accept did not transition)"
            - "ac == 2 (PROPOSED + ACCEPTED both count; unchanged by the failed accept)"

      - name: submit_edit_empty_reporter_set
        grounds:
          - validations[priority=10]
          - errors[ERR_NO_REPORTING_ASSIGNMENT]
          - state_machines.Story.DRAFT_to_IN_EDIT
        distinguishing_aspect: |
          Empty-set boundary on the submit-edit endpoint (different metric and
          endpoint from assignment_cap_at_max's numeric cap): zero active
          REPORTER assignments rejects, a PHOTOGRAPHER-only set still rejects,
          and exactly one ACCEPTED REPORTER assignment admits.
        test_recipe:
          setup:
            - "A DRAFT story with initially zero assignments; a reporter and a photographer on staff"
          setup_api_calls:
            - { call: "POST /newsroom/staff", payload: { full_name: "Desk Twelve", role_capability: DESK_EDITOR, home_desk: METRO, hourly_rate_cents: 6000 }, as: NewsDirector, captures: { desk_id: "$.data.id" } }
            - { call: "POST /newsroom/staff", payload: { full_name: "Rep Twelve", role_capability: REPORTER, home_desk: METRO, hourly_rate_cents: 6000 }, as: NewsDirector, captures: { rep_id: "$.data.id" } }
            - { call: "POST /newsroom/staff", payload: { full_name: "Phot Twelve", role_capability: PHOTOGRAPHER, home_desk: METRO, hourly_rate_cents: 5000 }, as: NewsDirector, captures: { phot_id: "$.data.id" } }
            - { call: "POST /newsroom/pitches", payload: { title: "Gallery opening", summary: "Art gallery opens", desk: FEATURES, deadline_at: "2026-08-03T00:00:00Z", urgency: STANDARD }, as: Reporter, as_user_id: "${rep_id}", captures: { p_id: "$.data.id" } }
            - { call: "POST /newsroom/pitches/${p_id}/start-review", payload: {}, as: AssignmentEditor, as_user_id: "${desk_id}" }
            - { call: "POST /newsroom/pitches/${p_id}/greenlight", payload: { story_type: PRINT }, as: AssignmentEditor, as_user_id: "${desk_id}", captures: { story_id: "$.data.greenlit_story_id" } }
          trigger:
            - { call: "POST /newsroom/stories/${story_id}/submit-edit", payload: {}, as: Reporter, as_user_id: "${rep_id}", captures: { err1: "$.data.error_id" } }
            - { call: "POST /newsroom/assignments", payload: { story_id: "${story_id}", staff_id: "${phot_id}", assignment_role: PHOTOGRAPHER, start_at: "2026-08-01T08:00:00Z", end_at: "2026-08-01T09:00:00Z", planned_effort_minutes: 45 }, as: AssignmentEditor, as_user_id: "${desk_id}", captures: { ap_id: "$.data.id" } }
            - { call: "POST /newsroom/assignments/${ap_id}/accept", payload: {}, as: Photographer, as_user_id: "${phot_id}" }
            - { call: "POST /newsroom/stories/${story_id}/submit-edit", payload: {}, as: Reporter, as_user_id: "${rep_id}", captures: { err2: "$.data.error_id" } }
            - { call: "POST /newsroom/assignments", payload: { story_id: "${story_id}", staff_id: "${rep_id}", assignment_role: REPORTER, start_at: "2026-08-01T08:00:00Z", end_at: "2026-08-01T09:00:00Z", planned_effort_minutes: 60 }, as: AssignmentEditor, as_user_id: "${desk_id}", captures: { ar_id: "$.data.id" } }
            - { call: "POST /newsroom/assignments/${ar_id}/accept", payload: {}, as: Reporter, as_user_id: "${rep_id}" }
            - { call: "POST /newsroom/stories/${story_id}/submit-edit", payload: {}, as: Reporter, as_user_id: "${rep_id}", captures: { st: "$.data.status" } }
          assert:
            - "err1 == ERR_NO_REPORTING_ASSIGNMENT (empty reporter set)"
            - "err2 == ERR_NO_REPORTING_ASSIGNMENT (PHOTOGRAPHER assignment does not count toward the reporter gate)"
            - "st == IN_EDIT (exactly one ACCEPTED REPORTER assignment crosses the boundary)"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: correction_issue_requires_published_story
        grounds:
          - state_machines.Correction.APPROVED_to_ISSUED
          - errors[ERR_STORY_NOT_PUBLISHED]
        distinguishing_aspect: |
          Entity pair Correction -> Story: an APPROVED correction cannot issue
          once its story has left PUBLISHED (here: retracted by an earlier
          RETRACTION); the second instance uses a different pair
          (Assignment -> StaffMember).
        test_recipe:
          setup:
            - "Full editorial staff; story PUBLISHED (slot [06:00,07:00), scheduler at 06:30)"
            - "c1 = RETRACTION correction (proposed by author, approved by ME); c2 = MAJOR correction (proposed, approved) — both approved while the story was PUBLISHED"
            - "c1 issued -> story RETRACTED"
          setup_api_calls:
            - { call: "POST /newsroom/staff", payload: { full_name: "Desk Thirteen", role_capability: DESK_EDITOR, home_desk: METRO, hourly_rate_cents: 6000 }, as: NewsDirector, captures: { desk_id: "$.data.id" } }
            - { call: "POST /newsroom/staff", payload: { full_name: "Rep Thirteen", role_capability: REPORTER, home_desk: METRO, hourly_rate_cents: 6000 }, as: NewsDirector, captures: { rep_id: "$.data.id" } }
            - { call: "POST /newsroom/staff", payload: { full_name: "Copy Thirteen", role_capability: COPY_EDITOR, home_desk: METRO, hourly_rate_cents: 6000 }, as: NewsDirector, captures: { copy_id: "$.data.id" } }
            - { call: "POST /newsroom/staff", payload: { full_name: "Fact Thirteen", role_capability: FACT_CHECKER, home_desk: METRO, hourly_rate_cents: 6000 }, as: NewsDirector, captures: { fact_id: "$.data.id" } }
            - { call: "POST /newsroom/staff", payload: { full_name: "Legal Thirteen", role_capability: LEGAL_REVIEWER, home_desk: METRO, hourly_rate_cents: 6000 }, as: NewsDirector, captures: { legal_id: "$.data.id" } }
            - { call: "POST /newsroom/staff", payload: { full_name: "ME Thirteen", role_capability: MANAGING_EDITOR, home_desk: METRO, hourly_rate_cents: 8000 }, as: NewsDirector, captures: { me_id: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: NewsDirector }
            - { call: "POST /newsroom/pitches", payload: { title: "Water main", summary: "Water main break coverage", desk: METRO, deadline_at: "2026-08-02T00:00:00Z", urgency: URGENT }, as: Reporter, as_user_id: "${rep_id}", captures: { p_id: "$.data.id" } }
            - { call: "POST /newsroom/pitches/${p_id}/start-review", payload: {}, as: AssignmentEditor, as_user_id: "${desk_id}" }
