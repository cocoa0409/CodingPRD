scaffold_difficulty_design:

  # -------------------------------------------------------------------------
  # Rule 1 — Dual-variant calculations across different entity domains
  # -------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: merit_increase_promo_vs_pip
        grounds:
          - calculations.merit_increase_amount
          - calculations.merit_increase_amount.variants.promo_eligible_path
          - calculations.merit_increase_amount.variants.pip_zero_path
          - entities.CompPlan.fields.merit_increase_cents
          - entities.Employee.fields.status
        distinguishing_aspect: |
          Operates on the CompPlan / Employee compensation domain. Same
          pinned_base_salary_cents (10_000_000) and final_rating (EXCEEDS) yield
          three different integer merit values depending on which variant fires:
          ACTIVE no-promo = 600_000; ACTIVE with promo = 1_100_000; ON_PIP = 0.
          The variants are pinned by Employee.status and CompPlan.promotion_to_level
          — both fields named in the formula's input set.
        test_recipe:
          setup:
            - "Create an ANNUAL Cycle C1 with merit_budget_cents=99_999_999_999."
            - "Create Employee subj (department='Eng', job_level=4, base_salary_cents=10_000_000, status=ACTIVE)."
            - "Create a FINALIZED ReviewCase RC for subj with final_rating=EXCEEDS (drive through DRAFT->SUBMITTED->LOCKED->FINALIZED via lock-reviews + calibration commit with proposed_ratings honoring the bell curve)."
          trigger:
            - "POST /cycles/{C1}/comp-plans body={subject_employee_id: subj, promotion_to_level: null}  -> plan A"
            - "POST /cycles/{C1}/comp-plans body={subject_employee_id: subj, promotion_to_level: 5} -> would need different subj; instead use second subject subj2 with same base; final_rating EXCEEDS, status ACTIVE -> plan B"
            - "Create subj3 with same base, drive to ON_PIP via a NEEDS_IMPROVEMENT calibration (separate session) -> plan C"
            - "POST .../comp-plans/{A}/propose; POST .../comp-plans/{B}/propose; POST .../comp-plans/{C}/propose"
          assert:
            - "plan A.merit_increase_cents == 600000"
            - "plan B.merit_increase_cents == 1100000"
            - "plan C.merit_increase_cents == 0"

      - name: weighted_goal_score_provisional_vs_final
        grounds:
          - calculations.weighted_goal_score
          - calculations.weighted_goal_score.variants.self_assessment_provisional
          - entities.ReviewCase.fields.weighted_goal_score
          - entities.Goal.fields.self_score
          - entities.Goal.fields.manager_score
        distinguishing_aspect: |
          Operates on the ReviewCase / Goal performance-evaluation domain (not
          on compensation). Same Goal set produces different weighted_goal_score
          depending on whether the case has been submitted (manager_score authoritative)
          or is still DRAFT (self_score substituted for null manager_score).
          Different entity domain than merit_increase_promo_vs_pip.
        test_recipe:
          setup:
            - "Create OPEN Cycle C and ReviewCase RC for subj in DRAFT."
            - "Add Goal g1 weight=60 self_score=5 manager_score=null."
            - "Add Goal g2 weight=40 self_score=3 manager_score=null."
          trigger:
            - "GET /cycles/{C}/review-cases/{RC} (DRAFT view, provisional variant active)"
            - "PATCH .../goals/{g1} body={manager_score:4}; PATCH .../goals/{g2} body={manager_score:2}"
            - "Add a third Goal? No — adjust weights: PATCH .../goals/{g1} body={weight:60}, .../goals/{g2} body={weight:40} (no change). Then drive RC through submit after adding 2 SUBMITTED FeedbackRequests."
            - "POST .../review-cases/{RC}/submit"
          assert:
            - "Before submit: weighted_goal_score == round_half_up((60*5 + 40*3)/100, 2) == 4.20  # provisional uses self_score"
            - "After submit: weighted_goal_score == round_half_up((60*4 + 40*2)/100, 2) == 3.20  # final uses manager_score"

  # -------------------------------------------------------------------------
  # Rule 2 — Combinatorial formulas across different modes
  # -------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: merit_tiered_rate_with_state_branching   # MODE (a): 3+ inputs, non-linear
        grounds:
          - calculations.merit_increase_amount
          - calculations.merit_increase_amount.constants
          - entities.Cycle.fields.cadence
          - entities.ReviewCase.fields.final_rating
          - entities.CompPlan.fields.promotion_to_level
          - entities.Employee.fields.status
        distinguishing_aspect: |
          MODE (a) — formula combines four inputs (Cycle.cadence,
          ReviewCase.final_rating, CompPlan.promotion_to_level, Employee.status)
          with non-linear interaction: cadence selects a row, rating selects a
          column, promotion adds a conditional 5% bump that only fires when
          rating IN {OUTSTANDING, EXCEEDS}, and Employee.status==ON_PIP
          short-circuits everything to 0. Five distinct numeric outputs exist
          for the same base salary depending on the cross product.
        test_recipe:
          setup:
            - "Create ANNUAL Cycle C_ann and SEMI_ANNUAL Cycle C_semi with ample budget."
            - "Create five employees e_out, e_exc, e_meet, e_pip, e_promo all with base_salary_cents=10_000_000, job_level=4."
            - "Drive five FINALIZED ReviewCases with ratings OUTSTANDING/EXCEEDS/MEETS/EXCEEDS/EXCEEDS respectively."
            - "Place e_pip ON_PIP via a NEEDS_IMPROVEMENT calibration on a parallel cycle."
          trigger:
            - "Create + propose CompPlans on C_ann for e_out (no promo), e_exc (no promo), e_meet (no promo), e_pip (no promo), e_promo (promotion_to_level=5)."
          assert:
            - "comp_plan(e_out).merit_increase_cents == 900000   # floor(10_000_000 * 9 / 100)"
            - "comp_plan(e_exc).merit_increase_cents == 600000   # floor(10_000_000 * 6 / 100)"
            - "comp_plan(e_meet).merit_increase_cents == 300000  # floor(10_000_000 * 3 / 100)"
            - "comp_plan(e_pip).merit_increase_cents == 0        # ON_PIP override"
            - "comp_plan(e_promo).merit_increase_cents == 1100000 # 600000 + floor(10_000_000 * 5 / 100)"

      - name: equity_refresh_multiplier_then_round    # MODE (b): nested rounding order matters
        grounds:
          - calculations.equity_refresh_amount
          - calculations.equity_refresh_amount.variants.round_then_sum
          - entities.Cycle.fields.cadence
          - entities.Employee.fields.job_level
          - entities.CompPlan.fields.promotion_to_level
        distinguishing_aspect: |
          MODE (b) — nested rounding where the pinned order is "apply multiplier,
          then round_half_up to integer units, then add the floor-bump". A
          'sum-then-round' implementation diverges on inputs that produce a
          fractional half from the multiplier. Different mode than Rule-2's
          first instance (which was mode-(a) non-linear interaction).
        test_recipe:
          setup:
            - "Create SEMI_ANNUAL Cycle C_semi with equity_refresh_pool_units=99_999."
            - "Create Employee e_l4 (job_level=4, status=ACTIVE), e_l1 (job_level=1, status=ACTIVE)."
            - "Drive FINALIZED ReviewCases for e_l4 (final_rating=EXCEEDS) and e_l1 (final_rating=MEETS)."
          trigger:
            - "POST /cycles/{C_semi}/comp-plans body={subject_employee_id: e_l4, promotion_to_level: 5} -> plan P_l4"
            - "POST /cycles/{C_semi}/comp-plans body={subject_employee_id: e_l1} -> plan P_l1"
            - "POST .../comp-plans/{P_l4}/propose ; POST .../comp-plans/{P_l1}/propose"
          assert:
            - "P_l4.equity_refresh_units == 225  # round_half_up(300 * 0.5) + floor(300 * 0.25) = 150 + 75"
            - "P_l1.equity_refresh_units == 25   # round_half_up(50 * 0.5) + 0 = 25"

  # -------------------------------------------------------------------------
  # Rule 3 — Non-linear state-machine shape on different entities
  # -------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: review_case_revision_cycle
        grounds:
          - state_machines.ReviewCase
          - state_machines.ReviewCase.DRAFT_to_SUBMITTED
          - state_machines.ReviewCase.SUBMITTED_to_RETURNED
          - state_machines.ReviewCase.RETURNED_to_DRAFT
          - entities.ReviewCase.fields.revision_count
        distinguishing_aspect: |
          ReviewCase carries an explicit cycle DRAFT -> SUBMITTED -> RETURNED ->
          DRAFT. Same row revisits state DRAFT after passing through SUBMITTED;
          the revision_count counter caps the cycle at 3. This is a cyclic
          shape, not a linear A->B->C->D pipeline.
        test_recipe:
          setup:
            - "Create OPEN Cycle C, Manager M, subject subj, with 2 SUBMITTED FeedbackRequests and Goals summing to weight 100."
            - "Create ReviewCase RC in DRAFT with valid manager_rating and goal scores."
          trigger:
            - "POST .../review-cases/{RC}/submit  -> SUBMITTED, revision_count=0"
            - "POST .../review-cases/{RC}/return  -> RETURNED, revision_count=1"
            - "POST .../review-cases/{RC}/reopen  -> DRAFT, revision_count=1"
            - "POST .../review-cases/{RC}/submit  -> SUBMITTED, revision_count=1"
            - "POST .../review-cases/{RC}/return  -> RETURNED, revision_count=2"
            - "POST .../review-cases/{RC}/reopen  -> DRAFT"
            - "POST .../review-cases/{RC}/submit  -> SUBMITTED"
            - "POST .../review-cases/{RC}/return  -> RETURNED, revision_count=3"
            - "POST .../review-cases/{RC}/reopen ; POST .../review-cases/{RC}/submit ; POST .../review-cases/{RC}/return  (4th return)"
          assert:
            - "First two .../return calls succeed and increment revision_count."
            - "Fourth .../return returns 422 ERR_REVISION_LIMIT (revision_count was already 3)."

      - name: pip_case_branching_pass_or_fail
        grounds:
          - state_machines.PIPCase
          - state_machines.PIPCase.ACTIVE_to_PASSED
          - state_machines.PIPCase.ACTIVE_to_FAILED
          - state_machines.PIPCase.ACTIVE_to_WITHDRAWN
          - entities.PIPCase.fields.status
          - entities.Employee.fields.status
        distinguishing_aspect: |
          PIPCase exhibits branching fork: from ACTIVE the machine can fork
          to PASSED, FAILED, or WITHDRAWN, with divergent side-effect sets per
          branch (PASSED -> Employee.status=ACTIVE; FAILED -> Employee.status=
          TERMINATED + cascade-reject open CompPlans; WITHDRAWN -> Employee.status=
          ACTIVE without the termination side-effects). Different entity than
          the cyclic ReviewCase machine.
        test_recipe:
          setup:
            - "Create three subjects subj_p, subj_f, subj_w via NEEDS_IMPROVEMENT calibrations creating ACTIVE PIPCases pip_p, pip_f, pip_w."
            - "subj_f additionally has a PROPOSED CompPlan plan_f under cycle (Cycle.status==COMP_PLANNING)."
          trigger:
            - "POST /_clock/advance to >= pip_p.ends_at AND pip_f.ends_at."
            - "POST .../pip-cases/{pip_p}/pass"
            - "POST .../pip-cases/{pip_f}/fail"
            - "POST .../pip-cases/{pip_w}/withdraw  (clock still < pip_w.ends_at — verify withdraw branch)"
          assert:
            - "Employee(subj_p).status == 'ACTIVE'."
            - "Employee(subj_f).status == 'TERMINATED' and CompPlan(plan_f).status == 'REJECTED'."
            - "Employee(subj_w).status == 'ACTIVE' (no termination side-effect)."

  # -------------------------------------------------------------------------
  # Rule 4 — Transitive cascade chains from different triggers
  # -------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: calibration_commit_to_pip_to_employee_status   # depth 3
        grounds:
          - state_machines.CalibrationSession.IN_SESSION_to_COMMITTED
          - state_machines.ReviewCase.LOCKED_to_FINALIZED
          - state_machines.PIPCase
          - entities.PIPCase.fields.status
          - entities.Employee.fields.status
        distinguishing_aspect: |
          Depth-3 cascade triggered by CalibrationSession commit:
          (1) CalibrationSession LOCKED -> FINALIZED writes ReviewCase.final_rating.
          (2) That mutation on ReviewCase itself triggers PIPCase creation when
              final_rating IN {NEEDS_IMPROVEMENT, UNSATISFACTORY}.
          (3) The PIPCase creation itself triggers Employee.status ACTIVE -> ON_PIP.
          Each hop is caused by the previous hop's mutation, not the original commit.
        test_recipe:
          setup:
            - "Create Cycle C with bell_curve_target {OUT:0, EXC:0, MEETS:67, NI:33, UNSAT:0}."
            - "Create 3 employees with 3 SUBMITTED ReviewCases all LOCKED (sum: ratings irrelevant — calibration will pin)."
            - "Create CalibrationSession S in IN_SESSION with proposed_ratings = [{rc1: MEETS}, {rc2: MEETS}, {rc3: NEEDS_IMPROVEMENT}]."
          trigger:
            - "POST /cycles/{C}/calibration-sessions/{S}/commit"
          assert:
            - "ReviewCase(rc3).status == 'FINALIZED' and rc3.final_rating == 'NEEDS_IMPROVEMENT'."
            - "Exactly one PIPCase exists for subj3 with status='ACTIVE' and duration_days==60."
            - "Employee(subj3).status == 'ON_PIP'."
            - "Employees subj1, subj2 remain status=='ACTIVE'."

      - name: pip_fail_to_comp_plan_to_employee_terminate    # depth 2
        grounds:
          - state_machines.PIPCase.ACTIVE_to_FAILED
          - state_machines.CompPlan.PROPOSED_to_REJECTED
          - entities.Employee.fields.status
        distinguishing_aspect: |
          Depth-2 cascade triggered by PIPCase /fail:
          (1) PIPCase ACTIVE -> FAILED writes Employee.status = TERMINATED.
          (2) That mutation on Employee itself triggers cascade-reject of every
              DRAFT/PROPOSED CompPlan whose subject_employee_id matches.
          Different triggering transition than the calibration cascade, so the
          scaffold captures two distinct propagation patterns.
        test_recipe:
          setup:
            - "Drive subj to ON_PIP via calibration commit (pip ACTIVE)."
            - "Drive Cycle to COMP_PLANNING. Create CompPlan plan_x for subj and PROPOSE it."
            - "POST /_clock/advance to >= pip.ends_at."
          trigger:
            - "POST .../pip-cases/{pip}/fail"
          assert:
            - "Employee(subj).status == 'TERMINATED'."
            - "CompPlan(plan_x).status == 'REJECTED' (cascade from Employee termination)."

  # -------------------------------------------------------------------------
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # -------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: pip_promo_vs_merit_budget   # business_safety vs business_fiscal
        grounds:
          - validations[priority=60]   # ERR_PROMO_BLOCKED_BY_PIP (business_safety)
          - validations[priority=90]   # ERR_MERIT_BUDGET_EXCEEDED (business_fiscal)
        distinguishing_aspect: |
          Two failures simultaneously possible: subject is ON_PIP AND promotion
          is set AND merit_increase would exceed budget. Categories
          business_safety (priority 60) vs business_fiscal (priority 90).
          Per ordering, ERR_PROMO_BLOCKED_BY_PIP wins.
        test_recipe:
          setup:
            - "Cycle with merit_budget_cents=1 (basically empty), COMP_PLANNING."
            - "Subject ON_PIP. Create CompPlan with promotion_to_level=subject.job_level+1."
            - "Propose then approve scenario where merit would exceed budget."
          trigger:
            - "POST .../comp-plans/{p}/approve"
          assert:
            - "Response error_id == 'ERR_PROMO_BLOCKED_BY_PIP' (priority 60 wins over priority 90)."

      - name: stale_pin_vs_merit_budget   # business_referential vs business_fiscal
        grounds:
          - validations[priority=70]   # ERR_PINNED_REVIEW_STALE (business_referential)
          - validations[priority=90]   # ERR_MERIT_BUDGET_EXCEEDED (business_fiscal)
        distinguishing_aspect: |
          Different category pair from the first conflict. Plan has stale
          pinned_review_case_version AND would exceed merit budget.
          ERR_PINNED_REVIEW_STALE (priority 70) wins over ERR_MERIT_BUDGET_EXCEEDED
          (priority 90).
        test_recipe:
          setup:
            - "Cycle in COMP_PLANNING. CompPlan p in PROPOSED with pinned_review_case_version=V."
            - "ReviewCase has since been bumped (e.g., admin override) so current version != V."
            - "merit_budget_consumed_cents + p.merit_increase_cents > merit_budget_cents."
          trigger:
            - "POST .../comp-plans/{p}/approve"
          assert:
            - "Response error_id == 'ERR_PINNED_REVIEW_STALE' (priority 70 wins over priority 90)."

  # -------------------------------------------------------------------------
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # -------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: merit_budget_exact_boundary   # numeric threshold, > vs >=
        grounds:
          - validations[priority=90]
          - entities.Cycle.fields.merit_budget_cents
          - entities.Cycle.fields.merit_budget_consumed_cents
        distinguishing_aspect: |
          Boundary precision on the merit budget check. The validation reads
          'merit_budget_consumed_cents + merit_increase_cents <= merit_budget_cents';
          a value equal to the budget (delta == 0) MUST pass, one cent over MUST
          fail. Tests the exact <= vs < boundary on /comp-plans/{id}/approve.
        test_recipe:
          setup:
            - "Cycle C: merit_budget_cents=1_000_000, merit_budget_consumed_cents=900_000, COMP_PLANNING."
            - "CompPlan p1 with merit_increase_cents=100_000 (exact remaining budget). p1 in PROPOSED."
            - "CompPlan p2 with merit_increase_cents=100_001. p2 in PROPOSED (parallel subject)."
          trigger:
            - "POST .../comp-plans/{p1}/approve"
            - "Roll back via /recall, then POST .../comp-plans/{p2}/approve"
          assert:
            - "p1 approve succeeds (consumed becomes 1_000_000 == budget; <= passes)."
            - "p2 approve returns 422 ERR_MERIT_BUDGET_EXCEEDED (1_000_001 > 1_000_000)."

      - name: peer_feedback_count_empty_set   # empty-collection / zero-count edge
        grounds:
          - validations[priority=81]
          - entities.ReviewCase.fields.peer_feedback_count
          - state_machines.FeedbackRequest.PENDING_to_SUBMITTED
        distinguishing_aspect: |
          Boundary on a different metric — collection cardinality, not currency.
          The submit check requires peer_feedback_count >= 2. Tests are exactly
          ZERO, ONE, and TWO submitted feedback requests, on a different endpoint
          (.../review-cases/{rid}/submit) than the merit boundary case.
        test_recipe:
          setup:
            - "OPEN Cycle, ReviewCase RC with all submit prerequisites met EXCEPT peer feedback."
            - "Add zero, then one, then two SUBMITTED FeedbackRequests in sequence (separate runs)."
          trigger:
            - "Run 1: POST .../review-cases/{RC}/submit with 0 SUBMITTED feedback requests."
            - "Run 2: After 1 SUBMITTED FeedbackRequest, POST .../review-cases/{RC}/submit."
            - "Run 3: After 2 SUBMITTED FeedbackRequests, POST .../review-cases/{RC}/submit."
          assert:
            - "Run 1 returns 422 ERR_PEER_FEEDBACK_INSUFFICIENT (count 0)."
            - "Run 2 returns 422 ERR_PEER_FEEDBACK_INSUFFICIENT (count 1)."
            - "Run 3 returns 200 (count 2 satisfies >= 2)."

  # -------------------------------------------------------------------------
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # -------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: review_case_submit_requires_cycle_open       # ReviewCase × Cycle pair
        grounds:
          - validations[priority=50]
          - state_machines.ReviewCase.DRAFT_to_SUBMITTED
          - entities.Cycle.fields.status
        distinguishing_aspect: |
          ReviewCase's DRAFT->SUBMITTED transition is gated on Cycle.status==OPEN.
          Two different entities (ReviewCase vs Cycle); ReviewCase's valid
          next-state set is empty while Cycle is in IN_CALIBRATION or
          COMP_PLANNING. Pair: (ReviewCase, Cycle).
        test_recipe:
          setup:
            - "Cycle C with ReviewCase RC in DRAFT with all submit prerequisites met."
            - "Move Cycle to IN_CALIBRATION via lock-reviews (after first arranging another ReviewCase in SUBMITTED so lock succeeds)."
          trigger:
            - "POST .../review-cases/{RC}/submit while Cycle.status == IN_CALIBRATION."
          assert:
            - "Response error_id == 'ERR_CYCLE_NOT_OPEN', http 409."

      - name: comp_plan_promote_requires_employee_not_pip  # CompPlan × Employee pair
        grounds:
          - validations[priority=60]
          - state_machines.CompPlan.DRAFT_to_PROPOSED
          - entities.Employee.fields.status
        distinguishing_aspect: |
          CompPlan's PROPOSED and APPROVED transitions reject promotion when
          Employee.status == ON_PIP. Different entity pair than (ReviewCase,
          Cycle): here it is (CompPlan, Employee). Both pair members differ.
        test_recipe:
          setup:
            - "Cycle in COMP_PLANNING. Employee subj currently ON_PIP."
            - "CompPlan p for subj with promotion_to_level=subj.job_level+1, status DRAFT."
          trigger:
            - "POST .../comp-plans/{p}/propose"
          assert:
            - "Response error_id == 'ERR_PROMO_BLOCKED_BY_PIP', http 422."

  # -------------------------------------------------------------------------
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # -------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: cycle_review_window_inverted    # closed-interval ordering
        grounds:
          - validations[priority=100]
          - entities.Cycle.fields.review_window_start
          - entities.Cycle.fields.review_window_end
        distinguishing_aspect: |
          Interval semantics for the Cycle review window: closed start, closed
          end, with strict 'end > start' geometry — empty intervals (end == start)
          are rejected, as are inverted intervals. Resource: Cycle.
        test_recipe:
          setup:
            - "No prerequisites."
          trigger:
            - "POST /cycles with review_window_start='2026-01-01T00:00:00Z', review_window_end='2026-01-01T00:00:00Z'."
          assert:
            - "Response error_id == 'ERR_TIME_WINDOW_INVALID', http 422 (rejects degenerate-zero interval)."

      - name: pip_case_ends_at_gate            # half-open temporal gate on different resource
        grounds:
          - validations[priority=85]
          - entities.PIPCase.fields.starts_at
          - entities.PIPCase.fields.ends_at
        distinguishing_aspect: |
          Different interval semantics: the PIPCase ACTIVE window uses a
          half-open gate 'pass/fail allowed only when clock_now() >= ends_at'.
          'Equal' is on the allowed side of the boundary — opposite to the
          Cycle window which rejects equal endpoints. Different resource
          (PIPCase vs Cycle) and different geometric treatment of equality.
        test_recipe:
          setup:
            - "Drive subj to ON_PIP via calibration. PIPCase pip has ends_at = T."
          trigger:
            - "POST /_clock/advance to T - 1 second. POST .../pip-cases/{pip}/pass  -> expect failure."
            - "POST /_clock/advance to T (exactly equal). POST .../pip-cases/{pip}/pass  -> expect success."
          assert:
            - "First pass returns 422 ERR_PIP_NOT_ELAPSED."
            - "Second pass returns 200 (equality on the allowed side: clock_now() >= ends_at)."

  # -------------------------------------------------------------------------
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # -------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: merit_budget_consumed_round_trip
        grounds:
          - state_machines.CompPlan.PROPOSED_to_APPROVED
          - state_machines.CompPlan.APPROVED_to_REJECTED   # via recall
          - entities.Cycle.fields.merit_budget_consumed_cents
        distinguishing_aspect: |
          Named conserved quantity: Cycle.merit_budget_consumed_cents.
          Invariant: for any plan p, the sequence (approve, recall) MUST leave
          Cycle.merit_budget_consumed_cents EXACTLY equal to its value before
          the approve. Pinned formula:
            consumed_after_pair == consumed_before_pair
          A cascade that runs end-to-end but leaves drift in this counter does
          NOT satisfy this.
        test_recipe:
          setup:
            - "Cycle C in COMP_PLANNING with merit_budget_cents=10_000_000, merit_budget_consumed_cents=500_000."
            - "CompPlan p with merit_increase_cents=300_000 in PROPOSED."
          trigger:
            - "Snapshot baseline := Cycle(C).merit_budget_consumed_cents  # 500_000"
            - "POST .../comp-plans/{p}/approve   # consumed becomes 800_000"
            - "POST .../comp-plans/{p}/recall    # consumed should release back to 500_000"
          assert:
            - "After approve: Cycle(C).merit_budget_consumed_cents == 800000."
            - "After recall:  Cycle(C).merit_budget_consumed_cents == 500000 == baseline (invariant holds)."

      - name: equity_pool_consumed_round_trip
        grounds:
          - state_machines.CompPlan.PROPOSED_to_APPROVED
          - state_machines.CompPlan.APPROVED_to_REJECTED
          - entities.Cycle.fields.equity_pool_consumed_units
        distinguishing_aspect: |
          Different conserved quantity: Cycle.equity_pool_consumed_units (RSU
          units, an integer count) rather than dollars (cents). Same invariant
          shape but on a structurally distinct conserved resource — confirms
          the scaffold pins compensating semantics on more than one currency
          dimension. Pinned formula:
            pool_consumed_after_pair == pool_consumed_before_pair
        test_recipe:
          setup:
            - "Cycle C in COMP_PLANNING with equity_refresh_pool_units=5000, equity_pool_consumed_units=200."
            - "CompPlan p with equity_refresh_units=150 in PROPOSED."
          trigger:
            - "Snapshot baseline := Cycle(C).equity_pool_consumed_units  # 200"
            - "POST .../comp-plans/{p}/approve  # pool becomes 350"
