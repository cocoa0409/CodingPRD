              payload: { name: "Q3B1", event_type: "HOUSE_SHOW", arena_id: "${ar_id}", event_date: "2026-09-28", start_time: "19:00", end_time: "21:00", tour_country_code: "US", roster_min_main: 0, roster_min_total: 0 }
              as: TourPlanner
              captures: { qb1_id: $.data.id }
            - call: "POST /touring/bookings"
              payload: { event_id: "${qb1_id}", talent_id: "${t_id}", segment_label: "MATCH_1" }
              as: TourPlanner
            - call: "POST /touring/_clock/set_current_utc"
