        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[settlement-create-stale-retailer]", entities.Retailer.fields.version]
        distinguishing_aspect: "Creating a settlement with the CURRENT expected_retailer_version succeeds (201) and increments Retailer.version by 1."
        test_recipe:
          setup: ["an ACTIVE retailer with one window ticket; observe its current version"]
          setup_api_calls:
            - call: "POST /games"
              payload: { name: "OccOk", game_type: "DAILY", claim_window_days: 10, federal_withholding_threshold_cents: 600000 }
              as: LotteryOfficer
              captures: { gid: $.data.id }
            - call: "POST /retailers"
              payload: { business_name: "OccOk Mart", tax_id: "TAX-CC2", commission_rate: 0.06 }
              as: LicensingAdmin
              captures: { rid: $.data.id }
            - call: "POST /retailers/${rid}/license/activate"
              payload: {}
              as: LicensingAdmin
            - call: "POST /terminals"
              payload: { retailer_id: "${rid}", serial_number: "SN-CC2" }
              as: LicensingAdmin
              captures: { tid: $.data.id }
            - call: "POST /terminals/${tid}/activate"
              payload: {}
              as: LicensingAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T00:00:00Z" }
              as: LotteryOfficer
            - call: "POST /tickets"
              payload: { game_id: "${gid}", terminal_id: "${tid}", serial: "OK-1", price_cents: 100, draw_date: "2026-05-10T00:00:00Z", declared_tier: 0, gross_prize_cents: 0 }
              as: TerminalOperator
            - call: "GET /retailers/${rid}"
              payload: {}
              as: LotteryOfficer
              captures: { rv: $.data.version }
          trigger:
            - call: "POST /commission-settlements"
              payload: { retailer_id: "${rid}", period_start: "2026-05-01T00:00:00Z", period_end: "2026-06-01T00:00:00Z", expected_retailer_version: "${rv}" }
              as: LotteryOfficer
              as_user_id: "u-prep"
              captures: { st: $.data.id }
            - call: "GET /retailers/${rid}"
              payload: {}
              as: LotteryOfficer
              captures: { rv2: $.data.version }
          assert:
            - "CommissionSettlement.${st}.status == DRAFT"
            - "Retailer.${rid}.version increased by exactly 1 relative to ${rv}"

      - name: revoke_cascade_n_level_end_to_end
        claim_type: cascading_side_effects
        grounds: [state_machines.Retailer.SUSPENDED_to_REVOKED, state_machines.Terminal.PROVISIONED_to_DEACTIVATED]
        distinguishing_aspect: "Revoke cascades BOTH a PROVISIONED and an ACTIVE terminal to DEACTIVATED in one transition (multi-target cascade verified end-to-end)."
        test_recipe:
          setup: ["a SUSPENDED retailer that had one ACTIVE and one PROVISIONED terminal at suspend time"]
          setup_api_calls:
            - call: "POST /retailers"
              payload: { business_name: "NLevel Mart", tax_id: "TAX-CC3" }
              as: LicensingAdmin
              captures: { rid: $.data.id }
            - call: "POST /retailers/${rid}/license/activate"
              payload: {}
              as: LicensingAdmin
            - call: "POST /terminals"
              payload: { retailer_id: "${rid}", serial_number: "SN-CC3A" }
              as: LicensingAdmin
              captures: { tA: $.data.id }
            - call: "POST /terminals/${tA}/activate"
              payload: {}
              as: LicensingAdmin
            - call: "POST /terminals"
              payload: { retailer_id: "${rid}", serial_number: "SN-CC3B" }
              as: LicensingAdmin
              captures: { tB: $.data.id }
            - call: "POST /retailers/${rid}/license/suspend"
              payload: {}
              as: LicensingAdmin
          trigger:
            - call: "POST /retailers/${rid}/license/revoke"
              payload: {}
              as: LicensingAdmin
          assert:
            - "Retailer.${rid}.license_status == REVOKED"
            - "Terminal.${tA}.status == DEACTIVATED"
            - "Terminal.${tB}.status == DEACTIVATED"

      - name: clock_default_governs_unset_deadline_comparisons
        claim_type: scheduled_actions
        grounds: [endpoints, calculations.ticket_claim_deadline]
        distinguishing_aspect: "Before any set_current_utc call the logical clock reads the startup default 2026-01-01T00:00:00Z; a ticket with draw_date 2026-01-01 and claim_window_days 30 (deadline 2026-01-31) is therefore still validatable as a winner without setting the clock."
        test_recipe:
          setup: ["ACTIVE retailer+terminal; NO clock set call (clock at startup default 2026-01-01); over-threshold winner draw_date 2026-01-01"]
          setup_api_calls:
            - call: "POST /games"
              payload: { name: "ClockGame", game_type: "INSTANT", claim_window_days: 30, federal_withholding_threshold_cents: 600000 }
              as: LotteryOfficer
              captures: { gid: $.data.id }
            - call: "POST /retailers"
              payload: { business_name: "Clock Mart", tax_id: "TAX-CC4" }
              as: LicensingAdmin
              captures: { rid: $.data.id }
            - call: "POST /retailers/${rid}/license/activate"
              payload: {}
              as: LicensingAdmin
            - call: "POST /terminals"
              payload: { retailer_id: "${rid}", serial_number: "SN-CC4" }
              as: LicensingAdmin
              captures: { tid: $.data.id }
            - call: "POST /terminals/${tid}/activate"
              payload: {}
              as: LicensingAdmin
            - call: "POST /tickets"
              payload: { game_id: "${gid}", terminal_id: "${tid}", serial: "CK-1", price_cents: 200, draw_date: "2026-01-01T00:00:00Z", declared_tier: 1, gross_prize_cents: 1000000 }
              as: TerminalOperator
              captures: { tk: $.data.id }
          trigger:
            - call: "POST /tickets/${tk}/validate"
              payload: {}
              as: TerminalOperator
          assert:
            - "Ticket.${tk}.validation_status == VALIDATED_WINNER"
            - "Ticket.${tk}.claim_deadline == 2026-01-31T00:00:00.000Z"

      - name: threshold_boundary_at_exactly_T_is_over_threshold_winner
        claim_type: rate_threshold_triggers
        grounds: [state_machines.Ticket.UNVALIDATED_to_VALIDATED_WINNER, entities.DrawingGame.fields.federal_withholding_threshold_cents]
        distinguishing_aspect: "A winner with gross_prize EXACTLY == threshold (600,000) routes to VALIDATED_WINNER (over-threshold central claim), proving the threshold uses >= not >; 599,999 would instead pay at counter."
        test_recipe:
          setup: ["ACTIVE retailer+terminal; winner gross_prize 600,000 == threshold; clock before deadline"]
          setup_api_calls:
            - call: "POST /games"
              payload: { name: "ThrGame", game_type: "INSTANT", claim_window_days: 30, federal_withholding_threshold_cents: 600000 }
              as: LotteryOfficer
              captures: { gid: $.data.id }
            - call: "POST /retailers"
              payload: { business_name: "Thr Mart", tax_id: "TAX-CC5" }
              as: LicensingAdmin
              captures: { rid: $.data.id }
            - call: "POST /retailers/${rid}/license/activate"
              payload: {}
              as: LicensingAdmin
            - call: "POST /terminals"
              payload: { retailer_id: "${rid}", serial_number: "SN-CC5" }
              as: LicensingAdmin
              captures: { tid: $.data.id }
            - call: "POST /terminals/${tid}/activate"
              payload: {}
              as: LicensingAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-05T00:00:00Z" }
              as: LotteryOfficer
            - call: "POST /tickets"
              payload: { game_id: "${gid}", terminal_id: "${tid}", serial: "TH-1", price_cents: 200, draw_date: "2026-01-10T00:00:00Z", declared_tier: 1, gross_prize_cents: 600000 }
              as: TerminalOperator
              captures: { tk: $.data.id }
          trigger:
            - call: "POST /tickets/${tk}/validate"
              payload: {}
              as: TerminalOperator
          assert:
            - "Ticket.${tk}.validation_status == VALIDATED_WINNER"

      - name: tickets_sold_count_derived_field_reconciles
        claim_type: derived_field_reconciliation
        grounds: [entities.Terminal.fields.tickets_sold_count]
        distinguishing_aspect: "Terminal.tickets_sold_count increments to 2 after two ticket sales on that terminal (derived counter stays consistent with sales)."
        test_recipe:
          setup: ["ACTIVE retailer+terminal; two tickets sold"]
          setup_api_calls:
            - call: "POST /games"
              payload: { name: "CntGame", game_type: "DAILY", claim_window_days: 10, federal_withholding_threshold_cents: 600000 }
              as: LotteryOfficer
              captures: { gid: $.data.id }
            - call: "POST /retailers"
              payload: { business_name: "Cnt Mart", tax_id: "TAX-CC6" }
              as: LicensingAdmin
              captures: { rid: $.data.id }
            - call: "POST /retailers/${rid}/license/activate"
              payload: {}
              as: LicensingAdmin
            - call: "POST /terminals"
              payload: { retailer_id: "${rid}", serial_number: "SN-CC6" }
              as: LicensingAdmin
              captures: { tid: $.data.id }
            - call: "POST /terminals/${tid}/activate"
              payload: {}
              as: LicensingAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T00:00:00Z" }
              as: LotteryOfficer
            - call: "POST /tickets"
              payload: { game_id: "${gid}", terminal_id: "${tid}", serial: "CN-1", price_cents: 100, draw_date: "2026-05-10T00:00:00Z", declared_tier: 0, gross_prize_cents: 0 }
              as: TerminalOperator
            - call: "POST /tickets"
              payload: { game_id: "${gid}", terminal_id: "${tid}", serial: "CN-2", price_cents: 100, draw_date: "2026-05-10T00:00:00Z", declared_tier: 0, gross_prize_cents: 0 }
              as: TerminalOperator
          trigger:
            - call: "GET /terminals/${tid}"
              payload: {}
              as: LicensingAdmin
          assert:
            - "Terminal.${tid}.tickets_sold_count == 2"

  # ===========================================================================
  # Section: consistency_model
  # ===========================================================================
  - section: consistency_model
    instances:
      - name: approve_response_immediately_shows_computed_withholding
        claim_type: immediate
        grounds: [calculations.prize_payout_calc, entities.PrizeClaim.fields.net_payout_cents]
        distinguishing_aspect: "The approve response body immediately reflects gross_payout/withholding/net (immediate consistency); no re-read needed."
        excluded_because:
          difficulty_instance: dual_variant_calc / prize_payout_cash_jackpot_vs_annuity_diverge_on_claim
          rationale: "Immediate visibility of computed payout fields in the approve response is asserted directly in the §1.8 dual-variant instance, which captures gross/net from the approve response envelope itself."
