# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# task_3383_volunteer_delivered_classroom_program_scheduling_curriculum_kits
# 9 rules x 2 instances = 18 instances. All recipes replay from empty-DB.
# Anchors for the shared base chain are defined in the first instance.
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: evaluation_provisional_vs_final_diverge_on_student_inclusion_and_hours
        grounds:
          - calculations.evaluation_metrics
          - entities.StudentParticipant.fields.survey_status
          - endpoints.GET_/ja-programs/partnership-agreements/{agreement_id}/evaluation
        distinguishing_aspect: |
          Same database, two variants: PROVISIONAL counts students with survey_status in
          {PRE_SUBMITTED, PAIRED, VALIDATED} and hours from TENTATIVE/SCHEDULED/NEEDS_SUBSTITUTE/DELIVERED
          sessions, while FINAL counts VALIDATED students and DELIVERED sessions only — producing
          students_included 4 vs 2 and total_volunteer_hours 8.0 vs 6.0 on identical data.
          Entity domain: student outcome surveys aggregated over sessions (distinct from the
          sponsor-funding domain of the sibling instance).
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. One office, PARTNER district, school grades 1-5."
            - "Partner1 ACTIVE with eligible vol1; partner2 ACTIVE with eligible vol2."
            - "Program JA-BIZ: session_count 4, 60min advisory, no capstone, students 4-30."
            - "Agreement (sponsor partner1, pledge 175000 = exact floor) ACTIVE."
            - "Delivery d1 (lead vol1, enrolled 4, required_kits 7) fully SCHEDULED with 4 confirmed sessions (Tuesdays 09-08..09-29) and 4 roster students."
            - "Delivery d2 (lead vol2, enrolled 10, required_kits 11) fully SCHEDULED with 4 confirmed sessions (Wednesdays 09-09..09-30): s1,s2 assigned vol2; s3,s4 assigned vol1."
            - "d1 all four sessions DELIVERED; d2 s1,s2 DELIVERED and s3,s4 still SCHEDULED (delivery IN_PROGRESS)."
            - "Surveys: s1 pre60/post80 VALIDATED, s2 pre70/post85 VALIDATED, s3 pre50/post60 PAIRED, s4 pre90 PRE_SUBMITTED."
          setup_api_calls:
            - &clk
              call: "POST /ja-programs/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - &office
              call: "POST /ja-programs/area-offices"
              payload: { name: "Metro Area Office", region_code: "METRO", max_districts: 5 }
              as: PlatformAdmin
              captures: { office_id: $.data.id }
            - &dist
              call: "POST /ja-programs/districts"
              payload: { area_office_id: "${office_id}", name: "Riverview Unified" }
              as: AreaDirector
              captures: { dist_id: $.data.id }
            - &dist_act
              call: "POST /ja-programs/districts/${dist_id}/transition"
              payload: { action: "ACTIVATE" }
              as: AreaDirector
            - &school
              call: "POST /ja-programs/schools"
              payload: { district_id: "${dist_id}", name: "Riverview Elementary", grade_band_low: 1, grade_band_high: 5, instructional_days: ["MON", "TUE", "WED", "THU", "FRI"] }
              as: AreaDirector
              captures: { school_id: $.data.id }
            - &partner1
              call: "POST /ja-programs/corporate-partners"
              payload: { name: "Acme Corp", industry: "Logistics" }
              as: PartnershipManager
              captures: { partner1_id: $.data.id }
            - &partner1_act
              call: "POST /ja-programs/corporate-partners/${partner1_id}/transition"
              payload: { action: "ACTIVATE" }
              as: PartnershipManager
            - &vol1
              call: "POST /ja-programs/volunteers"
              payload: { corporate_partner_id: "${partner1_id}", full_name: "Vol One", email: "vol1@acme.example" }
              as: PartnershipManager
              captures: { vol1_id: $.data.id }
            - &vol1_clear
              call: "POST /ja-programs/volunteers/${vol1_id}/credential-events"
              payload: { kind: "SCREENING", event: "CLEAR" }
              as: PartnershipManager
            - &vol1_begin
              call: "POST /ja-programs/volunteers/${vol1_id}/credential-events"
              payload: { kind: "TRAINING", event: "BEGIN" }
              as: PartnershipManager
            - &vol1_complete
              call: "POST /ja-programs/volunteers/${vol1_id}/credential-events"
              payload: { kind: "TRAINING", event: "COMPLETE" }
              as: PartnershipManager
            - &partner2
              call: "POST /ja-programs/corporate-partners"
              payload: { name: "Beta Corp", industry: "Finance" }
              as: PartnershipManager
              captures: { partner2_id: $.data.id }
            - &partner2_act
              call: "POST /ja-programs/corporate-partners/${partner2_id}/transition"
              payload: { action: "ACTIVATE" }
              as: PartnershipManager
            - &vol2
              call: "POST /ja-programs/volunteers"
              payload: { corporate_partner_id: "${partner2_id}", full_name: "Vol Two", email: "vol2@beta.example" }
              as: PartnershipManager
              captures: { vol2_id: $.data.id }
            - &vol2_clear
              call: "POST /ja-programs/volunteers/${vol2_id}/credential-events"
              payload: { kind: "SCREENING", event: "CLEAR" }
              as: PartnershipManager
            - &vol2_begin
              call: "POST /ja-programs/volunteers/${vol2_id}/credential-events"
              payload: { kind: "TRAINING", event: "BEGIN" }
              as: PartnershipManager
            - &vol2_complete
              call: "POST /ja-programs/volunteers/${vol2_id}/credential-events"
              payload: { kind: "TRAINING", event: "COMPLETE" }
              as: PartnershipManager
            - &prog4
              call: "POST /ja-programs/program-catalogs"
              payload: { code: "JA-BIZ", title: "Biz Basics", grade_band_low: 3, grade_band_high: 5, session_count: 4, minutes_per_session: 60, capstone_required: false, capstone_facility: "NONE", min_students: 4, max_students: 30 }
              as: PlatformAdmin
              captures: { prog4_id: $.data.id }
            - &agr4
              call: "POST /ja-programs/partnership-agreements"
              payload: { school_id: "${school_id}", program_catalog_id: "${prog4_id}", sponsor_partner_id: "${partner1_id}", school_year: "2026-2027", funding_pledged_cents: 175000 }
              as: AreaDirector
              captures: { agr_id: $.data.id }
            - &agr4_propose
              call: "POST /ja-programs/partnership-agreements/${agr_id}/transition"
              payload: { action: "PROPOSE" }
              as: AreaDirector
            - &agr4_activate
              call: "POST /ja-programs/partnership-agreements/${agr_id}/transition"
              payload: { action: "ACTIVATE" }
              as: AreaDirector
              captures: { agr_v: $.data.version }
            - &inv4
              call: "POST /ja-programs/kit-inventories"
              payload: { area_office_id: "${office_id}", program_catalog_id: "${prog4_id}" }
              as: LogisticsCoordinator
              captures: { inv4_id: $.data.id }
            - &inv4_assemble20
              call: "POST /ja-programs/kit-inventories/${inv4_id}/transition"
              payload: { action: "ASSEMBLE", quantity: 20 }
              as: LogisticsCoordinator
            - call: "POST /ja-programs/deliveries"
              payload: { agreement_id: "${agr_id}", lead_volunteer_id: "${vol1_id}", classroom_label: "Room 1", teacher_email: "t1@rv.example", enrolled_count: 4, expected_agreement_version: "${agr_v}" }
              as: ProgramCoordinator
              captures: { del1_id: $.data.id }
            - call: "POST /ja-programs/students"
              payload: { delivery_id: "${del1_id}", students: [{ full_name: "Stu A", external_ref: "A1" }, { full_name: "Stu B", external_ref: "B1" }, { full_name: "Stu C", external_ref: "C1" }, { full_name: "Stu D", external_ref: "D1" }] }
              as: ProgramCoordinator
              captures: { stu1: "$.data[0].id", stu2: "$.data[1].id", stu3: "$.data[2].id", stu4: "$.data[3].id" }
            - call: "POST /ja-programs/deliveries/${del1_id}/transition"
              payload: { action: "PLAN" }
              as: ProgramCoordinator
            - call: "POST /ja-programs/sessions"
              payload: { delivery_id: "${del1_id}", volunteer_id: "${vol1_id}", scheduled_date: "2026-09-08", start_minutes: 540, end_minutes: 600 }
              as: ProgramCoordinator
              captures: { s1d1: $.data.id }
            - call: "POST /ja-programs/sessions/${s1d1}/transition"
              payload: { action: "CONFIRM" }
              as: ProgramCoordinator
            - call: "POST /ja-programs/sessions"
              payload: { delivery_id: "${del1_id}", volunteer_id: "${vol1_id}", scheduled_date: "2026-09-15", start_minutes: 540, end_minutes: 600 }
              as: ProgramCoordinator
              captures: { s2d1: $.data.id }
            - call: "POST /ja-programs/sessions/${s2d1}/transition"
              payload: { action: "CONFIRM" }
              as: ProgramCoordinator
            - call: "POST /ja-programs/sessions"
              payload: { delivery_id: "${del1_id}", volunteer_id: "${vol1_id}", scheduled_date: "2026-09-22", start_minutes: 540, end_minutes: 600 }
              as: ProgramCoordinator
              captures: { s3d1: $.data.id }
            - call: "POST /ja-programs/sessions/${s3d1}/transition"
              payload: { action: "CONFIRM" }
              as: ProgramCoordinator
            - call: "POST /ja-programs/sessions"
              payload: { delivery_id: "${del1_id}", volunteer_id: "${vol1_id}", scheduled_date: "2026-09-29", start_minutes: 540, end_minutes: 600 }
              as: ProgramCoordinator
              captures: { s4d1: $.data.id }
            - call: "POST /ja-programs/sessions/${s4d1}/transition"
              payload: { action: "CONFIRM" }
              as: ProgramCoordinator
            - call: "POST /ja-programs/deliveries/${del1_id}/transition"
              payload: { action: "CONFIRM_TEACHER" }
              as: ProgramCoordinator
            - call: "POST /ja-programs/deliveries/${del1_id}/transition"
              payload: { action: "RESERVE_KITS" }
              as: ProgramCoordinator
            - call: "POST /ja-programs/deliveries/${del1_id}/transition"
              payload: { action: "SCHEDULE" }
              as: ProgramCoordinator
            - call: "GET /ja-programs/partnership-agreements/${agr_id}"
              payload: {}
              as: AreaDirector
              captures: { agr_v2: $.data.version }
            - call: "POST /ja-programs/deliveries"
