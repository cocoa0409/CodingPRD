# =============================================================================
# PRD Benchmark Seed Tables
# Task: task_3341_battery_storage_system_delivery_performance_guarantee_management
# =============================================================================

scenario: |
  Battery Storage System Delivery & Performance Guarantee Management (Fluence): project scoping with power and energy sizing against the intended market application and duty cycle, equipment supply agreements with delivery schedules, commissioning milestones and liquidated damages, capacity and round-trip efficiency guarantees measured through periodic testing protocols, augmentation planning where additional cells are added over time to maintain guaranteed capacity as the system degrades, long-term service agreements covering monitoring, maintenance, spare parts and software updates, safety design including thermal runaway mitigation, fire code compliance and local approval processes, bidding software integration for market participation with dispatch optimization, warranty claim handling and cell replacement logistics

domain_name: battery-storage-guarantees
api_prefix: /

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation
  entity_topology: flat
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: peer_roles
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1: Entity-Relationship Table (flat topology, FK links)
# =============================================================================
entities:
  - name: Project
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Project name" }
      - { name: market_application, type: enum, source: input, description: "ENERGY_ARBITRAGE | FREQUENCY_REGULATION | CAPACITY_FIRMING" }
      - { name: duty_cycle_profile, type: enum, source: input, description: "ONE_CYCLE_DAILY | TWO_CYCLES_DAILY | CONTINUOUS" }
      - { name: rated_power_mw, type: number, source: input, description: "Nameplate power rating in MW, must be > 0" }
      - { name: rated_energy_mwh, type: number, source: input, description: "Nameplate energy capacity in MWh, must be > 0" }
      - { name: budget_cents, type: integer, source: input, description: "Owner budget cap; ESA total price must not exceed it" }
      - { name: duration_hours, type: number, source: computed, description: "= rated_energy_mwh / rated_power_mw, 2 decimal places round_half_up" }
      - { name: sizing_status, type: enum, source: computed, description: "VALID | INVALID per sizing_validation calculation; constraints: VALID, INVALID" }
      - { name: commissioned_capacity_mwh, type: number, source: computed, default: 0, description: "Capacity commissioned at COD; set when the first COMMISSIONING milestone is ACHIEVED" }
      - { name: equivalent_cycles, type: integer, source: system, default: 0, description: "Most recent equivalent-cycle count supplied via recompute-projection" }
      - { name: projected_capacity_mwh, type: number, source: computed, description: "Forward-looking capacity projection per augmentation_requirement calculation" }
      - { name: augmentation_count, type: integer, source: computed, default: 0, description: "Number of AugmentationEvents in PLANNED or EXECUTED status" }

  - name: EquipmentSupplyAgreement
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> Project.id" }
      - { name: contracted_power_mw, type: number, source: input, description: "Contracted power in MW, must be > 0" }
      - { name: contracted_energy_mwh, type: number, source: input, description: "Contracted energy in MWh, must be > 0" }
      - { name: guaranteed_capacity_mwh, type: number, source: input, description: "Guaranteed usable capacity at POI in MWh, must be > 0 and <= contracted_energy_mwh" }
      - { name: guaranteed_rte_pct, type: number, source: input, description: "Guaranteed round-trip efficiency as a fraction in (0, 1]" }
      - { name: price_per_mwh_cents, type: integer, source: input, description: "Unit price per contracted MWh, non-negative integer" }
      - { name: total_price_cents, type: integer, source: computed, description: "= contracted_energy_mwh * price_per_mwh_cents (integer, energy rounded to 2 dp first)" }
      - { name: ld_rate_per_day_cents, type: integer, source: input, description: "Liquidated damages per day of late delivery, non-negative integer" }
      - { name: ld_cap_cents, type: integer, source: input, description: "Aggregate LD cap; accrual stops when accrued_ld_cents == ld_cap_cents" }
      - { name: accrued_ld_cents, type: integer, source: computed, default: 0, description: "Sum of ld_applied_cents over MISSED milestones, capped at ld_cap_cents" }
      - { name: waived_ld_cents, type: integer, source: computed, default: 0, description: "Sum of waived LD amounts via waive-ld" }
      - { name: net_ld_due_cents, type: integer, source: computed, default: 0, description: "= accrued_ld_cents - waived_ld_cents" }
      - { name: guaranteed_delivery_date, type: datetime, source: input, description: "Contractual delivery date (ISO 8601 date-time, UTC)" }
      - { name: longstop_date, type: datetime, source: input, description: "Longstop date; must be strictly after guaranteed_delivery_date" }
      - { name: status, type: enum, source: system, description: "DRAFT -> EXECUTED -> COMPLETED | TERMINATED; constraints: DRAFT, EXECUTED, COMPLETED, TERMINATED" }

  - name: DeliveryMilestone
    parent: null
    common_fields: true
    fields:
      - { name: esa_id, type: string, source: input, description: "FK -> EquipmentSupplyAgreement.id" }
      - { name: kind, type: enum, source: input, description: "DELIVERY | COMMISSIONING" }
      - { name: planned_date, type: datetime, source: input, description: "Planned milestone date" }
      - { name: actual_date, type: datetime, source: input, description: "Provided on record-outcome" }
      - { name: days_late, type: integer, source: computed, default: 0, description: "Whole days between planned_date and actual_date; 0 when actual_date <= planned_date" }
      - { name: ld_applied_cents, type: integer, source: computed, default: 0, description: "LD accrued by this milestone per liquidated_damages calculation" }
      - { name: ld_waived_cents, type: integer, source: computed, default: 0, description: "LD waived on this milestone via waive-ld" }
      - { name: status, type: enum, source: system, description: "SCHEDULED -> ACHIEVED | MISSED | CANCELLED; constraints: SCHEDULED, ACHIEVED, MISSED, CANCELLED" }

  - name: SafetyPermit
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> Project.id" }
      - { name: permit_type, type: enum, source: input, description: "THERMAL_RUNAWAY_PLAN | FIRE_CODE | LOCAL_APPROVAL" }
      - { name: authority_reference, type: string, source: input, description: "Free-text reference of the approving authority" }
      - { name: decided_at, type: datetime, source: system, description: "Logical-clock timestamp of the latest decision" }
      - { name: status, type: enum, source: system, description: "SUBMITTED -> APPROVED | REJECTED; REJECTED -> SUBMITTED via resubmit; constraints: SUBMITTED, APPROVED, REJECTED" }

  - name: PerformanceTest
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> Project.id" }
      - { name: test_type, type: enum, source: input, description: "CAPACITY_TEST | RTE_TEST" }
      - { name: window_start, type: datetime, source: input, description: "Inclusive start of the scheduled test window" }
      - { name: window_end, type: datetime, source: input, description: "Exclusive end of the scheduled test window; must be strictly after window_start" }
      - { name: measurement_basis, type: enum, source: computed, description: "NAMEPLATE for FREQUENCY_REGULATION projects else POI; constraints: NAMEPLATE, POI" }
      - { name: measured_capacity_mwh, type: number, source: input, description: "Raw measured discharge energy at the meter" }
      - { name: aux_load_mwh, type: number, source: input, description: "Auxiliary load during the test; subtracted under POI basis" }
      - { name: rte_intervals, type: array, source: input, description: "For RTE_TEST: list of {charge_mwh, discharge_mwh} pairs, at least 1 element" }
      - { name: evaluated_capacity_mwh, type: number, source: computed, description: "Basis-adjusted capacity per capacity_guarantee_evaluation" }
      - { name: measured_rte_pct, type: number, source: computed, description: "Per rte_evaluation for RTE_TEST" }
      - { name: result, type: enum, source: computed, description: "PASS | FAIL per the guarantee evaluation; constraints: PASS, FAIL" }
      - { name: status, type: enum, source: system, description: "SCHEDULED -> PASSED | FAILED | CANCELLED; constraints: SCHEDULED, PASSED, FAILED, CANCELLED" }

  - name: AugmentationEvent
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> Project.id" }
      - { name: planned_window_start, type: datetime, source: input, description: "Inclusive start of planned augmentation window" }
      - { name: planned_window_end, type: datetime, source: input, description: "Exclusive end of planned augmentation window; strictly after start" }
      - { name: added_capacity_mwh, type: number, source: input, description: "Capacity added by this augmentation, must be > 0" }
      - { name: origin, type: enum, source: system, description: "MANUAL when created via POST /augmentation-events, AUTO when created by a FAILED capacity test; constraints: MANUAL, AUTO" }
      - { name: status, type: enum, source: system, description: "PLANNED -> EXECUTED | CANCELLED; constraints: PLANNED, EXECUTED, CANCELLED" }

  - name: ServiceAgreement
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> Project.id" }
      - { name: annual_fee_cents, type: integer, source: input, description: "Annual LTSA fee, non-negative integer" }
      - { name: covers_monitoring, type: boolean, source: input, description: "Scope flag: remote monitoring" }
      - { name: covers_maintenance, type: boolean, source: input, description: "Scope flag: preventive maintenance" }
      - { name: covers_spare_parts, type: boolean, source: input, description: "Scope flag: spare parts coverage; required for credit-covered SparePartOrders" }
      - { name: covers_software_updates, type: boolean, source: input, description: "Scope flag: software updates" }
      - { name: start_date, type: datetime, source: input, description: "LTSA start (inclusive)" }
      - { name: end_date, type: datetime, source: input, description: "LTSA end (inclusive); strictly after start_date" }
      - { name: activated_at, type: datetime, source: system, description: "Logical-clock timestamp of first activation" }
      - { name: credit_pool_cents, type: integer, source: computed, default: 0, description: "Spare-parts credit pool per spare_parts_credit calculation" }
      - { name: credit_drawn_cents, type: integer, source: computed, default: 0, description: "Credits currently drawn by non-CANCELLED covered SparePartOrders" }
      - { name: status, type: enum, source: system, description: "DRAFT -> ACTIVE -> SUSPENDED -> ACTIVE (cycle) | EXPIRED; constraints: DRAFT, ACTIVE, SUSPENDED, EXPIRED" }

  - name: SparePartOrder
    parent: null
    common_fields: true
    fields:
      - { name: service_agreement_id, type: string, source: input, description: "FK -> ServiceAgreement.id" }
      - { name: warranty_claim_id, type: string, source: input, description: "FK -> WarrantyClaim.id; nullable, optional" }
      - { name: part_description, type: string, source: input, description: "Free-text part description" }
      - { name: part_cost_cents, type: integer, source: input, description: "Part cost, non-negative integer" }
      - { name: covered_by_credit, type: boolean, source: computed, description: "True when the order drew from the LTSA credit pool" }
      - { name: status, type: enum, source: system, description: "ORDERED -> SHIPPED -> DELIVERED -> INSTALLED | CANCELLED; constraints: ORDERED, SHIPPED, DELIVERED, INSTALLED, CANCELLED" }

  - name: WarrantyClaim
    parent: null
    common_fields: true
    fields:
      - { name: esa_id, type: string, source: input, description: "FK -> EquipmentSupplyAgreement.id" }
      - { name: defect_type, type: enum, source: input, description: "CELL_DEFECT | CAPACITY_SHORTFALL | RTE_SHORTFALL | BMS_FAULT" }
      - { name: claimed_capacity_loss_mwh, type: number, source: input, description: "Claimed capacity loss in MWh, must be > 0" }
      - { name: credit_variant, type: enum, source: input, description: "STRAIGHT_LINE | OUTPUT_BASED; selected at decide time" }
      - { name: credit_amount_cents, type: integer, source: computed, description: "Per warranty_credit calculation on APPROVED" }
      - { name: decided_at, type: datetime, source: system, description: "Logical-clock timestamp of the decision" }
      - { name: status, type: enum, source: system, description: "SUBMITTED -> UNDER_REVIEW -> APPROVED | REJECTED; APPROVED -> FULFILLED; constraints: SUBMITTED, UNDER_REVIEW, APPROVED, REJECTED, FULFILLED" }

  - name: BidSession
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> Project.id" }
      - { name: market, type: enum, source: input, description: "DAY_AHEAD | REAL_TIME" }
      - { name: window_start, type: datetime, source: input, description: "Inclusive start of the dispatch window" }
      - { name: window_end, type: datetime, source: input, description: "Exclusive end of the dispatch window; strictly after start" }
      - { name: offer_mwh, type: number, source: input, description: "Offered discharge energy, must be > 0" }
      - { name: offer_price_cents_per_mwh, type: integer, source: input, description: "Offer floor price, non-negative integer" }
      - { name: clearing_price_cents_per_mwh, type: integer, source: input, description: "Provided on record-clearing" }
      - { name: market_cleared_mwh, type: number, source: input, description: "Provided on record-clearing; market-clearing quantity" }
      - { name: cleared_mwh, type: number, source: computed, description: "Per dispatch_optimization" }
      - { name: revenue_cents, type: integer, source: computed, default: 0, description: "Per dispatch_optimization at settle" }
      - { name: status, type: enum, source: system, description: "OPEN -> CLEARED -> SETTLED; OPEN -> CANCELLED; constraints: OPEN, CLEARED, SETTLED, CANCELLED" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: EquipmentSupplyAgreement
    initial_state: DRAFT
    terminal_states: [COMPLETED, TERMINATED]
    transitions:
      - from: DRAFT
        to: EXECUTED
        trigger: "POST /equipment-supply-agreements/{id}/execute"
        actor: ProjectDeveloper
        preconditions:
          - "ESA must be in DRAFT (ERR_ESA_NOT_DRAFT)"
          - "Project.sizing_status == VALID (ERR_SIZING_INVALID)"
          - "ESA.guaranteed_capacity_mwh <= Project.rated_energy_mwh (ERR_GUARANTEE_EXCEEDS_RATED_ENERGY)"
          - "ESA.total_price_cents <= Project.budget_cents (ERR_BUDGET_EXCEEDED)"
          - "All three permit types for Project exist with status APPROVED: THERMAL_RUNAWAY_PLAN, FIRE_CODE, LOCAL_APPROVAL (ERR_PERMIT_MISSING_OR_UNAPPROVED)"
        side_effects:
          - "Project.version incremented (derived_field_reconciliation hook)"
      - from: EXECUTED
        to: COMPLETED
        trigger: "POST /equipment-supply-agreements/{id}/complete"
        actor: ProjectDeveloper
        preconditions:
          - "ESA must be in EXECUTED (ERR_ESA_NOT_EXECUTABLE_STATE)"
          - "Every DeliveryMilestone of this ESA with kind == DELIVERY is in ACHIEVED or CANCELLED status (ERR_DELIVERY_MILESTONES_OPEN)"
          - "At least one DeliveryMilestone of this ESA with kind == COMMISSIONING is in ACHIEVED status (ERR_NO_COMMISSIONING_ACHIEVED)"
        side_effects:
          - "Project.commissioned_capacity_mwh = ESA.contracted_energy_mwh (first commissioning ACHIEVED sets it earlier; complete reconciles)"
      - from: EXECUTED
        to: TERMINATED
        trigger: "system (automatic when accrued_ld_cents reaches ld_cap_cents on a milestone outcome)"
        actor: system
        preconditions:
          - "ESA.accrued_ld_cents == ESA.ld_cap_cents and ESA.ld_cap_cents > 0"
        side_effects:
          - "Cascade: every non-terminal DeliveryMilestone of this ESA (status SCHEDULED) -> CANCELLED"
          - "Cascade: every SparePartOrder whose warranty_claim_id references a WarrantyClaim of this ESA AND whose status is ORDERED -> CANCELLED; covered_by_credit orders restore ServiceAgreement.credit_drawn_cents (compensation)"
          - "Cascade: every WarrantyClaim of this ESA in SUBMITTED or UNDER_REVIEW -> REJECTED"

  - entity: DeliveryMilestone
    initial_state: SCHEDULED
    terminal_states: [ACHIEVED, MISSED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: ACHIEVED
        trigger: "POST /delivery-milestones/{id}/record-outcome with outcome ACHIEVED"
        actor: ProjectDeveloper
        preconditions:
          - "Milestone must be in SCHEDULED (ERR_MILESTONE_NOT_SCHEDULED)"
          - "actual_date <= planned_date (ERR_MILESTONE_OUTCOME_MISMATCH — an on-time outcome cannot be recorded late and vice versa: ACHIEVED requires actual_date <= planned_date, MISSED requires actual_date > planned_date)"
        side_effects:
          - "days_late = 0; ld_applied_cents = 0"
          - "If kind == COMMISSIONING and Project.commissioned_capacity_mwh == 0: Project.commissioned_capacity_mwh = ESA.contracted_energy_mwh; recomputes Project.projected_capacity_mwh (augmentation_requirement)"
      - from: SCHEDULED
        to: MISSED
        trigger: "POST /delivery-milestones/{id}/record-outcome with outcome MISSED"
        actor: ProjectDeveloper
        preconditions:
          - "Milestone must be in SCHEDULED (ERR_MILESTONE_NOT_SCHEDULED)"
          - "actual_date > planned_date (ERR_MILESTONE_OUTCOME_MISMATCH)"
        side_effects:
          - "days_late = whole calendar days from planned_date to actual_date"
          - "ld_applied_cents per liquidated_damages calculation; ESA.accrued_ld_cents += ld_applied_cents; ESA.net_ld_due_cents recomputed"
          - "If ESA.accrued_ld_cents reaches ESA.ld_cap_cents: ESA auto-transitions EXECUTED -> TERMINATED with its full cascade (transitive chain of depth 2)"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /delivery-milestones/{id}/cancel, or system cascade on ESA termination"
        actor: ProjectDeveloper | system
        preconditions:
          - "Milestone must be in SCHEDULED (ERR_MILESTONE_NOT_SCHEDULED)"
          - "For the API trigger: ESA must be in DRAFT or EXECUTED (ERR_ESA_TERMINAL_MILESTONE_LOCKED)"
        side_effects:
          - "ESA LD fields unchanged (no accrued LD on a cancelled milestone)"

  - entity: SafetyPermit
    initial_state: SUBMITTED
    terminal_states: [APPROVED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /safety-permits/{id}/decide with decision APPROVED"
        actor: SafetyAuthority
        preconditions:
          - "Permit must be in SUBMITTED (ERR_PERMIT_NOT_PENDING)"
        side_effects:
          - "decided_at = logical clock"
          - "Unblocks ESA execute when all three permit types are APPROVED"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /safety-permits/{id}/decide with decision REJECTED"
        actor: SafetyAuthority
        preconditions:
          - "Permit must be in SUBMITTED (ERR_PERMIT_NOT_PENDING)"
        side_effects:
          - "decided_at = logical clock"
      - from: REJECTED
        to: SUBMITTED
        trigger: "POST /safety-permits/{id}/resubmit"
        actor: ProjectDeveloper
        preconditions:
          - "Permit must be in REJECTED (ERR_PERMIT_NOT_REJECTED)"
        side_effects:
          - "decided_at cleared to null (a fresh decision is pending)"
          - "Cycle: REJECTED -> SUBMITTED permits a new decide; no bound on resubmission count"

  - entity: PerformanceTest
    initial_state: SCHEDULED
    terminal_states: [PASSED, FAILED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: PASSED
        trigger: "POST /performance-tests/{id}/record-results where the guarantee evaluation returns PASS"
        actor: PerformanceEngineer
        preconditions:
          - "Test must be in SCHEDULED (ERR_TEST_NOT_SCHEDULED)"
          - "Logical clock must be within [window_start, window_end) (ERR_TEST_WINDOW_NOT_OPEN)"
          - "For RTE_TEST: rte_intervals non-empty and every interval charge_mwh > 0 and discharge_mwh >= 0 (ERR_INVALID_RTE_INTERVALS)"
        side_effects:
          - "result = PASS; evaluated_capacity_mwh and (for RTE_TEST) measured_rte_pct computed per calculations"
      - from: SCHEDULED
        to: FAILED
        trigger: "POST /performance-tests/{id}/record-results where the guarantee evaluation returns FAIL"
        actor: PerformanceEngineer
        preconditions:
          - "Same as PASSED transition"
        side_effects:
          - "result = FAIL; evaluated_capacity_mwh and (for RTE_TEST) measured_rte_pct computed per calculations"
          - "For CAPACITY_TEST only: an AugmentationEvent is auto-created (origin AUTO, status PLANNED) covering the shortfall per augmentation_requirement; Project.projected_capacity_mwh recomputed (transitive chain depth 2)"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /performance-tests/{id}/cancel"
        actor: PerformanceEngineer
        preconditions:
          - "Test must be in SCHEDULED (ERR_TEST_NOT_SCHEDULED)"
        side_effects: []

  - entity: AugmentationEvent
    initial_state: PLANNED
    terminal_states: [EXECUTED, CANCELLED]
    note: "Creation precondition (not a transition): POST /augmentation-events requires Project.commissioned_capacity_mwh > 0 (ERR_PROJECT_NOT_COMMISSIONED); AUTO events are created by the system on capacity test FAIL regardless."
    transitions:
      - from: PLANNED
        to: EXECUTED
        trigger: "POST /augmentation-events/{id}/execute"
        actor: ServiceEngineer
        preconditions:
          - "Event must be in PLANNED (ERR_AUGMENTATION_NOT_PLANNED)"
          - "Logical clock must be within [planned_window_start, planned_window_end) (ERR_AUGMENTATION_WINDOW_NOT_OPEN)"
        side_effects:
          - "Project.projected_capacity_mwh and Project.augmentation_count recomputed (EXECUTED events count; PLANNED excluded from projected capacity)"
      - from: PLANNED
        to: CANCELLED
        trigger: "POST /augmentation-events/{id}/cancel"
        actor: ServiceEngineer
        preconditions:
          - "Event must be in PLANNED (ERR_AUGMENTATION_NOT_PLANNED)"
        side_effects:
          - "Project.augmentation_count recomputed; Project.projected_capacity_mwh unchanged (PLANNED events never contributed)"

  - entity: ServiceAgreement
    initial_state: DRAFT
    terminal_states: [EXPIRED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /service-agreements/{id}/activate"
        actor: ServiceManager
        preconditions:
          - "Agreement must be in DRAFT (ERR_LTSA_NOT_DRAFT)"
          - "start_date <= logical clock <= end_date (ERR_LTSA_NOT_IN_TERM)"
          - "activated_at must be null or (if re-activation is never from DRAFT) unused; DRAFT means never activated"
        side_effects:
          - "activated_at = logical clock"
          - "credit_pool_cents = floor(annual_fee_cents * SPARE_PARTS_POOL_PCT) per spare_parts_credit (computed once at first activation)"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /service-agreements/{id}/suspend"
        actor: ServiceManager
        preconditions:
          - "Agreement must be in ACTIVE (ERR_LTSA_NOT_ACTIVE)"
        side_effects: []
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /service-agreements/{id}/reactivate"
        actor: ServiceManager
        preconditions:
          - "Agreement must be in SUSPENDED (ERR_LTSA_NOT_SUSPENDED)"
          - "logical clock <= end_date (ERR_LTSA_NOT_IN_TERM)"
        side_effects: []
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (automatic on the first read or write touching the agreement when logical clock > end_date)"
        actor: system
        preconditions:
          - "Agreement in ACTIVE or SUSPENDED and logical clock > end_date"
        side_effects:
          - "Cascade: every SparePartOrder of this agreement in ORDERED or SHIPPED -> CANCELLED; covered_by_credit orders restore ServiceAgreement.credit_drawn_cents (compensation)"
          - "credit_pool_cents remains as computed (historical record); credit_drawn_cents recomputed after cascade"
      - from: SUSPENDED
        to: EXPIRED
        trigger: "system (same lazy expiry rule as ACTIVE -> EXPIRED)"
        actor: system
        preconditions:
          - "Agreement in ACTIVE or SUSPENDED and logical clock > end_date"
        side_effects:
          - "Same cascade as ACTIVE -> EXPIRED"

  - entity: SparePartOrder
    initial_state: ORDERED
    terminal_states: [INSTALLED, CANCELLED]
    transitions:
      - from: ORDERED
        to: SHIPPED
        trigger: "POST /spare-part-orders/{id}/ship"
        actor: ServiceEngineer
        preconditions:
          - "Order must be in ORDERED (ERR_ORDER_NOT_ORDERED)"
        side_effects: []
      - from: SHIPPED
        to: DELIVERED
        trigger: "POST /spare-part-orders/{id}/deliver"
        actor: ServiceEngineer
        preconditions:
          - "Order must be in SHIPPED (ERR_ORDER_NOT_SHIPPED)"
        side_effects: []
      - from: DELIVERED
        to: INSTALLED
        trigger: "POST /spare-part-orders/{id}/install"
        actor: ServiceEngineer
        preconditions:
          - "Order must be in DELIVERED (ERR_ORDER_NOT_DELIVERED)"
          - "If warranty_claim_id is set: the WarrantyClaim must be in APPROVED status (ERR_CLAIM_NOT_FULFILLABLE) — and this transition drives the claim to FULFILLED"
        side_effects:
          - "If warranty_claim_id is set: WarrantyClaim APPROVED -> FULFILLED (cross-entity state dependency)"
      - from: ORDERED
        to: CANCELLED
        trigger: "POST /spare-part-orders/{id}/cancel, or system cascade on LTSA expiry / ESA termination"
        actor: ServiceManager | system
        preconditions:
          - "Order must be in ORDERED or SHIPPED (ERR_ORDER_NOT_CANCELLABLE)"
        side_effects:
          - "If covered_by_credit: ServiceAgreement.credit_drawn_cents -= part_cost_cents (compensating invariant: credit pool conserved)"
      - from: SHIPPED
        to: CANCELLED
        trigger: "POST /spare-part-orders/{id}/cancel, or system cascade on LTSA expiry"
        actor: ServiceManager | system
        preconditions:
          - "Order must be in ORDERED or SHIPPED (ERR_ORDER_NOT_CANCELLABLE)"
        side_effects:
          - "If covered_by_credit: ServiceAgreement.credit_drawn_cents -= part_cost_cents"

  - entity: WarrantyClaim
    initial_state: SUBMITTED
    terminal_states: [REJECTED, FULFILLED]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /warranty-claims/{id}/start-review"
        actor: WarrantyAdmin
        preconditions:
          - "Claim must be in SUBMITTED (ERR_CLAIM_NOT_SUBMITTED)"
        side_effects: []
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /warranty-claims/{id}/decide with decision APPROVED and credit_variant"
        actor: WarrantyAdmin
        preconditions:
          - "Claim must be in UNDER_REVIEW (ERR_CLAIM_NOT_UNDER_REVIEW)"
          - "ESA of the claim must be in EXECUTED or COMPLETED (ERR_ESA_NOT_EXECUTABLE_STATE)"
        side_effects:
          - "credit_amount_cents computed per warranty_credit using the requested credit_variant; decided_at = logical clock"
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /warranty-claims/{id}/decide with decision REJECTED"
        actor: WarrantyAdmin
        preconditions:
          - "Claim must be in UNDER_REVIEW (ERR_CLAIM_NOT_UNDER_REVIEW)"
        side_effects:
          - "decided_at = logical clock; credit_amount_cents stays null"
      - from: APPROVED
        to: FULFILLED
        trigger: "system (when a linked SparePartOrder transitions DELIVERED -> INSTALLED)"
        actor: system
        preconditions:
          - "Claim in APPROVED and linked order reaches INSTALLED"
        side_effects: []
      - from: SUBMITTED
        to: REJECTED
        trigger: "system (cascade when the ESA is TERMINATED)"
        actor: system
        preconditions:
          - "Claim in SUBMITTED or UNDER_REVIEW when ESA auto-terminates"
        side_effects: []
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "system (cascade when the ESA is TERMINATED)"
        actor: system
        preconditions:
          - "Claim in SUBMITTED or UNDER_REVIEW when ESA auto-terminates"
        side_effects: []

  - entity: BidSession
    initial_state: OPEN
    terminal_states: [SETTLED, CANCELLED]
    transitions:
      - from: OPEN
        to: CLEARED
        trigger: "POST /bid-sessions/{id}/record-clearing"
        actor: MarketOperator
        preconditions:
          - "Session must be in OPEN (ERR_BID_SESSION_NOT_OPEN)"
        side_effects:
          - "cleared_mwh computed per dispatch_optimization (clearing step)"
      - from: CLEARED
        to: SETTLED
        trigger: "POST /bid-sessions/{id}/settle"
        actor: MarketOperator
        preconditions:
          - "Session must be in CLEARED (ERR_BID_SESSION_NOT_CLEARED)"
        side_effects:
          - "revenue_cents computed per dispatch_optimization (settlement step)"
      - from: OPEN
        to: CANCELLED
        trigger: "POST /bid-sessions/{id}/cancel"
        actor: MarketOperator
        preconditions:
          - "Session must be in OPEN (ERR_BID_SESSION_NOT_OPEN)"
        side_effects: []

# =============================================================================
# Table 2.1: Concurrency Rules (OCC on parent version — true races only)
# =============================================================================
concurrency_rules:
  - rule_id: esa-execute-stale-project
    parent_entity: Project
    write_endpoint: "POST /equipment-supply-agreements/{id}/execute"
    occ_field: "expected_project_version"
    description: |
      Executing an ESA against a Project whose version has advanced since the
      client last observed it is rejected with 412. This captures the case where
      another writer has just executed a sibling ESA (or a milestone outcome
      recomputed the project's capacity fields) and the current writer's view of
      the project — sizing status, budget, commissioned capacity — is stale.
    error_id: ERR_STALE_PROJECT_VERSION
    http_status: 412
  - rule_id: augmentation-execute-stale-project
    parent_entity: Project
    write_endpoint: "POST /augmentation-events/{id}/execute"
    occ_field: "expected_project_version"
    description: |
      Executing an augmentation event against a Project whose version has
      advanced since the client last observed it is rejected with 412. A second
      augmentation executor (or a failed capacity test that just auto-created
      an event) changes Project.projected_capacity_mwh and
      Project.augmentation_count; a writer holding the pre-change version is
      acting on a stale capacity baseline.
    error_id: ERR_STALE_PROJECT_VERSION
    http_status: 412
  - rule_id: ltsa-order-stale-agreement
    parent_entity: ServiceAgreement
    write_endpoint: "POST /spare-part-orders"
    occ_field: "expected_service_agreement_version"
    description: |
      Creating a SparePartOrder against a ServiceAgreement whose version has
      advanced since the client last observed it is rejected with 412. The
      credit pool balance (credit_pool_cents - credit_drawn_cents) may have
      changed under the reader; OCC forces a fresh read before drawing credit.
    error_id: ERR_STALE_LTSA_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: sizing_validation
    trigger: "Project creation and any change of market_application or duty_cycle_profile (input-only at creation)"
    algorithm: threshold
    formula: |
      duration_hours = round_half_up(rated_energy_mwh / rated_power_mw, 2)
      if market_application == CAPACITY_FIRMING:
          sizing_status = VALID iff duration_hours >= 4.00 AND duty_cycle_profile == ONE_CYCLE_DAILY
      elif market_application == FREQUENCY_REGULATION:
          sizing_status = VALID iff duty_cycle_profile == CONTINUOUS
      else:  # ENERGY_ARBITRAGE
          sizing_status = VALID iff duration_hours >= 2.00 AND duty_cycle_profile != CONTINUOUS
      Boundary: duration_hours == 4.00 exactly is VALID for CAPACITY_FIRMING
      (>= is inclusive); 3.99 is INVALID.
    input_set: "The project's own market_application, duty_cycle_profile, rated_power_mw, rated_energy_mwh"
    constants:
      MIN_FIRMING_DURATION_HOURS: 4.00
      MIN_ARBITRAGE_DURATION_HOURS: 2.00
    precision: "duration_hours at 2 decimal places, round_half_up"

  - name: liquidated_damages
    trigger: "DeliveryMilestone SCHEDULED -> MISSED"
    algorithm: chronological
    formula: |
      days_late = number of whole calendar days with planned_date < d <= actual_date
                (0 when actual_date <= planned_date; fractional part of a day counts
                as a full day when actual_date crosses into a new calendar day)
      headroom_cents = ESA.ld_cap_cents - ESA.accrued_ld_cents   (as of this outcome)
      effective_days = min(days_late, floor(headroom_cents / ESA.ld_rate_per_day_cents))
                       (0 when ld_rate_per_day_cents == 0)
      ld_applied_cents = effective_days * ESA.ld_rate_per_day_cents
      ESA.accrued_ld_cents += ld_applied_cents
      ESA.net_ld_due_cents = ESA.accrued_ld_cents - ESA.waived_ld_cents
      Terminal boundary: when accrued_ld_cents == ld_cap_cents (and cap > 0), the ESA
      auto-transitions to TERMINATED. accrued == cap exactly is the trigger.
      Evaluation order is pinned: milestones accrue in the order their outcomes are
      recorded; each accrual observes the cap headroom left by all prior accruals.
    input_set: "The milestone's planned_date/actual_date and the ESA's ld_rate_per_day_cents, ld_cap_cents, accrued_ld_cents"
    constants: {}
    precision: "integer cents; days_late is an integer count of calendar days"

  - name: capacity_guarantee_evaluation
    trigger: "PerformanceTest record-results for test_type == CAPACITY_TEST"
    algorithm: threshold
    formula: |
      measurement_basis = NAMEPLATE if Project.market_application == FREQUENCY_REGULATION else POI
      evaluated_capacity_mwh = measured_capacity_mwh - (aux_load_mwh if measurement_basis == POI else 0)
      evaluated_capacity_mwh rounded to 2 decimal places, round_half_up
      result = PASS iff evaluated_capacity_mwh >= ESA.guaranteed_capacity_mwh of the
      Project's ESA in status EXECUTED or COMPLETED (inclusive boundary: equality passes)
      On FAIL: an AugmentationEvent is auto-created per augmentation_requirement.
    input_set: "The test's measured_capacity_mwh, aux_load_mwh; the project's market_application; the active ESA's guaranteed_capacity_mwh"
    constants: {}
    precision: "2 decimal places, round_half_up"
    variants:
      - name: poi_basis
        when: "Project.market_application != FREQUENCY_REGULATION"
        difference: "Auxiliary load is subtracted: evaluated = measured - aux_load"
      - name: nameplate_basis
        when: "Project.market_application == FREQUENCY_REGULATION"
        difference: "Auxiliary load is ignored: evaluated = measured"

  - name: rte_evaluation
    trigger: "PerformanceTest record-results for test_type == RTE_TEST"
    algorithm: aggregation
    formula: |
      measured_rte_pct = round_half_up( sum(discharge_mwh over rte_intervals)
                                        / sum(charge_mwh over rte_intervals), 4 )
      result = PASS iff measured_rte_pct >= ESA.guaranteed_rte_pct (inclusive boundary)
      Intervals are aggregated as energy sums, never as an average of per-interval ratios.
    input_set: "The test's rte_intervals; the active ESA's guaranteed_rte_pct"
    constants: {}
    precision: "4 decimal places, round_half_up"

  - name: augmentation_requirement
    trigger: "Recomputed whenever Project.commissioned_capacity_mwh, the set of EXECUTED AugmentationEvents, or equivalent_cycles changes; drives the auto-created AugmentationEvent on capacity test FAIL"
    algorithm: forward_looking
    formula: |
      D = degradation rate per equivalent cycle for the project's market_application
          and duty_cycle_profile (see constants)
      cycle_penalty_mwh = Project.augmentation_count_EXECUTED * AUGMENTATION_PENALTY
                          * max(0, projected_before_penalty - 80)
        where projected_before_penalty = commissioned_capacity_mwh
                                         + sum(added_capacity_mwh over EXECUTED events)
                                         - D * equivalent_cycles
      projected_capacity_mwh = projected_before_penalty - cycle_penalty_mwh
      On capacity test FAIL:
        shortfall = ESA.guaranteed_capacity_mwh - min(projected_capacity_mwh, evaluated_capacity_mwh)
        auto AugmentationEvent.added_capacity_mwh = ceil(shortfall / (1 - AUGMENTATION_PENALTY) * 100) / 100
          (the 1/(1-penalty) gross-up pre-compensates the penalty the new event itself attracts)
        auto event window = [logical clock, logical clock + 30 days)
    input_set: "Project.commissioned_capacity_mwh, equivalent_cycles input, AugmentationEvents of the project with status EXECUTED only (PLANNED and CANCELLED excluded), the active ESA's guaranteed_capacity_mwh"
    constants:
      AUGMENTATION_PENALTY: 0.005
      AUGMENTATION_CAPACITY_FLOOR_MWH: 80
      DEGRADATION:
        ENERGY_ARBITRAGE: { ONE_CYCLE_DAILY: 0.0006, TWO_CYCLES_DAILY: 0.0012, CONTINUOUS: 0.0015 }
        FREQUENCY_REGULATION: { ONE_CYCLE_DAILY: 0.0004, TWO_CYCLES_DAILY: 0.0008, CONTINUOUS: 0.0010 }
        CAPACITY_FIRMING: { ONE_CYCLE_DAILY: 0.0005, TWO_CYCLES_DAILY: 0.0010, CONTINUOUS: 0.0012 }
    precision: "2 decimal places on projected_capacity_mwh and added_capacity_mwh, round_half_up; ceil applied at 0.01 MWh granularity for the auto event"
    note: "equivalent_cycles is supplied per recompute request (POST /projects/{id}/recompute-projection with equivalent_cycles); the projected_capacity_mwh field reflects the most recent recompute"

  - name: warranty_credit
    trigger: "WarrantyClaim UNDER_REVIEW -> APPROVED (decide with credit_variant)"
    algorithm: tiered_pricing
    formula: |
      Base rate: ESA.price_per_mwh_cents (P).
      STRAIGHT_LINE variant:
        credit_amount_cents = ceil(claimed_capacity_loss_mwh * P)
      OUTPUT_BASED variant:
        degradation_rate = 1 - ESA.guaranteed_rte_pct
        credit_amount_cents = claimed_capacity_loss_mwh * throughput_mwh
                              * ESA.guaranteed_rte_pct * P * degradation_rate
      Rounding order is pinned: every variant computes the full expression in exact
      arithmetic and rounds ONCE at the end to integer cents (round_half_up);
      no intermediate rounding.
      throughput_mwh is supplied in the decide payload for OUTPUT_BASED and must be > 0.
      Boundary: claimed_capacity_loss_mwh == ESA.guaranteed_capacity_mwh is still
      claimable (no upper cap on the claim relative to the guarantee).
    input_set: "The claim's claimed_capacity_loss_mwh, credit_variant; the ESA's price_per_mwh_cents and guaranteed_rte_pct; throughput_mwh from the decide payload"
    constants: {}
    precision: "integer cents, round_half_up, single final rounding"

  - name: spare_parts_credit
    trigger: "ServiceAgreement DRAFT -> ACTIVE (pool computation); SparePartOrder creation (draw); order CANCELLED (restore)"
    algorithm: aggregation
    formula: |
      credit_pool_cents = floor(annual_fee_cents * SPARE_PARTS_POOL_PCT)   — computed once at first activation
      On SparePartOrder creation against an ACTIVE agreement:
        if covers_spare_parts AND credit_pool_cents - credit_drawn_cents >= part_cost_cents:
            covered_by_credit = true; credit_drawn_cents += part_cost_cents
        elif covers_spare_parts:
            reject with ERR_CREDIT_POOL_EXHAUSTED  (no partial coverage — all or nothing)
        else:
            covered_by_credit = false; credit_drawn_cents unchanged
      On cancellation of a covered_by_credit order: credit_drawn_cents -= part_cost_cents.
      Conserved quantity (compensating invariant):
        credit_pool_cents == credit_drawn_cents + available_credit_cents
        where available_credit_cents = credit_pool_cents - sum(part_cost_cents over
        non-CANCELLED covered_by_credit orders). Draw + cancel returns to parity.
    input_set: "The agreement's annual_fee_cents, covers_spare_parts, and its SparePartOrders in status ORDERED, SHIPPED, DELIVERED or INSTALLED with covered_by_credit == true"
    constants:
      SPARE_PARTS_POOL_PCT: 0.30
    precision: "integer cents; pool floored"

  - name: dispatch_optimization
    trigger: "BidSession record-clearing (cleared_mwh) and settle (revenue_cents)"
    algorithm: constraint_propagation
    formula: |
      capacity_cap_mwh = min(Project.projected_capacity_mwh, market_cleared_mwh)
      if clearing_price_cents_per_mwh < offer_price_cents_per_mwh:
          cleared_mwh = 0                      (price floor: offer not taken below floor)
      else:
          cleared_mwh = min(offer_mwh, capacity_cap_mwh)
      revenue_cents (at settle) = round_half_up(cleared_mwh * clearing_price_cents_per_mwh)
      Evaluation order pinned: price floor evaluated BEFORE capacity cap; a below-floor
      clearing yields cleared_mwh == 0 even when capacity would allow the full offer.
    input_set: "The session's offer_mwh, offer_price_cents_per_mwh, clearing_price_cents_per_mwh, market_cleared_mwh; Project.projected_capacity_mwh at clearing time"
    constants: {}
    precision: "cleared_mwh at 2 decimal places round_half_up; revenue_cents integer round_half_up"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and the role must be one of the declared §1.7 roles"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all endpoints"
  - priority: 2
    category: auth
    check: "The role must be permitted for this endpoint per §1.5 roles"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: "all endpoints"
  - priority: 3
    category: existence
    check: "Every resource id in the path and every FK id in the body must exist; validated left-to-right, path before body"
    error_id: "ERR_NOT_FOUND (path) / ERR_{RESOURCE}_NOT_FOUND (body FK: ERR_PROJECT_NOT_FOUND, ERR_ESA_NOT_FOUND, ERR_LTSA_NOT_FOUND, ERR_CLAIM_NOT_FOUND, ERR_MILESTONE_NOT_FOUND, ERR_PERMIT_NOT_FOUND, ERR_TEST_NOT_FOUND, ERR_AUGMENTATION_NOT_FOUND, ERR_ORDER_NOT_FOUND, ERR_BID_SESSION_NOT_FOUND)"
    http_status: 404
    applies_to: "all resource endpoints"
  - priority: 3.5
    category: state
    check: "OCC: when the endpoint declares expected_<parent>_version, it must equal the parent's current version; checked BEFORE any business validation but after existence"
    error_id: "ERR_STALE_PROJECT_VERSION / ERR_STALE_LTSA_VERSION per §1.2.1"
    http_status: 412
    applies_to: "endpoints declared in §1.2.1 concurrency_rules"
  - priority: 4
    category: state
    check: "Target resource must be in a state from which the requested transition exists per §1.2 (e.g., milestone SCHEDULED, permit SUBMITTED, test SCHEDULED, agreement DRAFT/ACTIVE/SUSPENDED, claim SUBMITTED/UNDER_REVIEW, session OPEN/CLEARED)"
    error_id: "ERR_ESA_NOT_DRAFT / ERR_ESA_NOT_EXECUTABLE_STATE / ERR_MILESTONE_NOT_SCHEDULED / ERR_PERMIT_NOT_PENDING / ERR_PERMIT_NOT_REJECTED / ERR_TEST_NOT_SCHEDULED / ERR_AUGMENTATION_NOT_PLANNED / ERR_LTSA_NOT_DRAFT / ERR_LTSA_NOT_ACTIVE / ERR_LTSA_NOT_SUSPENDED / ERR_ORDER_NOT_ORDERED / ERR_ORDER_NOT_SHIPPED / ERR_ORDER_NOT_DELIVERED / ERR_ORDER_NOT_CANCELLABLE / ERR_CLAIM_NOT_SUBMITTED / ERR_CLAIM_NOT_UNDER_REVIEW / ERR_BID_SESSION_NOT_OPEN / ERR_BID_SESSION_NOT_CLEARED"
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 5
    category: business_safety
    check: "Safety permits: ESA execute requires all three permit types APPROVED for the project"
    error_id: ERR_PERMIT_MISSING_OR_UNAPPROVED
    http_status: 409
    applies_to: "POST /equipment-supply-agreements/{id}/execute"
  - priority: 6
    category: business_temporal
    check: "Temporal windows: performance test results only inside [window_start, window_end); augmentation execution only inside [planned_window_start, planned_window_end); LTSA activate/reactivate only within term; milestone outcome kind must agree with actual vs planned date ordering"
    error_id: "ERR_TEST_WINDOW_NOT_OPEN / ERR_AUGMENTATION_WINDOW_NOT_OPEN / ERR_LTSA_NOT_IN_TERM / ERR_MILESTONE_OUTCOME_MISMATCH"
    http_status: 409
    applies_to: "record-results, augmentation execute, LTSA activate/reactivate, milestone record-outcome"
  - priority: 7
    category: business_constraint
    check: "Structural integrity: no overlapping PerformanceTest windows on the same project among SCHEDULED/PASSED/FAILED tests (adjacent half-open windows allowed); no overlapping BidSession windows on the same project among OPEN/CLEARED sessions; window_end strictly after window_start; sizing_status VALID for ESA execute; guaranteed_capacity_mwh <= project rated_energy_mwh and <= contracted_energy_mwh"
    error_id: "ERR_TEST_WINDOW_OVERLAP / ERR_BID_WINDOW_OVERLAP / ERR_INVALID_WINDOW / ERR_SIZING_INVALID / ERR_GUARANTEE_EXCEEDS_RATED_ENERGY / ERR_PROJECT_NOT_COMMISSIONED"
    http_status: 409
    applies_to: "POST /performance-tests, POST /bid-sessions, POST /equipment-supply-agreements, POST /equipment-supply-agreements/{id}/execute, POST /augmentation-events"
  - priority: 8
    category: business_referential
    check: "Cross-entity state references: spare-part install requires linked claim APPROVED; claim decide requires ESA EXECUTED or COMPLETED; ESA complete requires all DELIVERY milestones ACHIEVED and at least one COMMISSIONING ACHIEVED; record-results/capacity evaluation requires the project to have an ESA in EXECUTED or COMPLETED"
    error_id: "ERR_CLAIM_NOT_FULFILLABLE / ERR_ESA_NOT_EXECUTABLE_STATE / ERR_DELIVERY_MILESTONES_OPEN / ERR_NO_COMMISSIONING_ACHIEVED / ERR_NO_ACTIVE_ESA"
    http_status: 409
    applies_to: "spare-part install, claim decide, ESA complete, record-results"
  - priority: 9
    category: business_fiscal
    check: "Fiscal checks last: ESA total_price_cents <= project budget_cents at execute; spare-part credit pool headroom at order creation; LD waiver amount <= accrued_ld_cents - waived_ld_cents"
    error_id: "ERR_BUDGET_EXCEEDED / ERR_CREDIT_POOL_EXHAUSTED / ERR_WAIVER_EXCEEDS_ACCRUED"
    http_status: 402
    applies_to: "ESA execute, POST /spare-part-orders, POST /equipment-supply-agreements/{id}/waive-ld"
  - priority: 10
    category: business_constraint
    check: "Request-shape checks on operation payloads: invalid enum values, non-positive quantities, missing required fields, rte_intervals empty or non-positive charge"
    error_id: "ERR_INVALID_REQUEST / ERR_INVALID_RTE_INTERVALS"
    http_status: 400
    applies_to: "all mutating endpoints"
    note: "Priority 10 runs after the state/business checks only for the request-shape aspects of the operation payload (e.g., outcome enum). Pure creation-time shape errors (missing required fields on POST) are checked at priority 3 alongside FK existence resolution, before any state check, so a malformed create never reaches a 409."

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  # --- Logical clock (test-driving) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Before any call, the logical clock reads exactly 2026-09-01T00:00:00Z and never falls back to wall-clock time; all date comparisons (windows, term checks, milestone lateness, lazy LTSA expiry) use this clock."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["May trigger lazy LTSA expiry cascade on subsequent reads/writes"]

  # --- Projects ---
  - method: POST
    path: "/projects"
    description: "Create a project with power/energy sizing against market application and duty cycle"
    roles: [ProjectDeveloper]
    code: 201
    input: [name, market_application, duty_cycle_profile, rated_power_mw, rated_energy_mwh, budget_cents]
    output: Project
    side_effects: ["duration_hours and sizing_status computed per sizing_validation"]
  - method: GET
    path: "/projects"
    description: "List projects (paginated)"
    roles: [ProjectDeveloper, PerformanceEngineer, ServiceManager, ServiceEngineer, WarrantyAdmin, SafetyAuthority, MarketOperator, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "Project[]"
    side_effects: []
  - method: GET
    path: "/projects/{id}"
    description: "Get one project"
    roles: [ProjectDeveloper, PerformanceEngineer, ServiceManager, ServiceEngineer, WarrantyAdmin, SafetyAuthority, MarketOperator, PlatformAdmin]
    code: 200
    input: []
    output: Project
    side_effects: []
  - method: POST
    path: "/projects/{id}/recompute-projection"
    description: "Recompute projected capacity for a supplied equivalent-cycle count"
    roles: [ProjectDeveloper, PerformanceEngineer]
    code: 200
    input: [equivalent_cycles]
    output: Project
    side_effects: ["equivalent_cycles stored; projected_capacity_mwh recomputed per augmentation_requirement"]

  # --- Equipment Supply Agreements ---
  - method: POST
    path: "/equipment-supply-agreements"
    description: "Create an ESA (starts DRAFT). guaranteed_capacity_mwh <= contracted_energy_mwh and longstop_date > guaranteed_delivery_date else ERR_INVALID_REQUEST."
    roles: [ProjectDeveloper]
    code: 201
    input: [project_id, contracted_power_mw, contracted_energy_mwh, guaranteed_capacity_mwh, guaranteed_rte_pct, price_per_mwh_cents, ld_rate_per_day_cents, ld_cap_cents, guaranteed_delivery_date, longstop_date]
    output: EquipmentSupplyAgreement
    side_effects: ["total_price_cents computed; status DRAFT"]
  - method: GET
    path: "/equipment-supply-agreements"
    description: "List ESAs, optionally filtered by project"
    roles: [ProjectDeveloper, PerformanceEngineer, ServiceManager, ServiceEngineer, WarrantyAdmin, SafetyAuthority, MarketOperator, PlatformAdmin]
    code: 200
    input: ["project_id?", "limit?", "offset?"]
    output: "EquipmentSupplyAgreement[]"
    side_effects: []
  - method: GET
    path: "/equipment-supply-agreements/{id}"
    description: "Get one ESA"
    roles: [ProjectDeveloper, PerformanceEngineer, ServiceManager, ServiceEngineer, WarrantyAdmin, SafetyAuthority, MarketOperator, PlatformAdmin]
    code: 200
    input: []
    output: EquipmentSupplyAgreement
    side_effects: []
  - method: POST
    path: "/equipment-supply-agreements/{id}/execute"
    description: "Execute a DRAFT ESA (OCC on the parent Project's version)"
    roles: [ProjectDeveloper]
    code: 200
    input: [expected_project_version]
    output: EquipmentSupplyAgreement
    side_effects: ["status DRAFT -> EXECUTED; increments Project.version by 1"]
  - method: POST
    path: "/equipment-supply-agreements/{id}/complete"
    description: "Complete an EXECUTED ESA once delivery milestones are achieved"
    roles: [ProjectDeveloper]
    code: 200
    input: []
    output: EquipmentSupplyAgreement
    side_effects: ["status EXECUTED -> COMPLETED"]
  - method: POST
    path: "/equipment-supply-agreements/{id}/waive-ld"
    description: "Waive accrued LD (partial waivers allowed; ESA must not be DRAFT)"
    roles: [ProjectDeveloper]
    code: 200
    input: [amount_cents]
    output: EquipmentSupplyAgreement
    side_effects: ["waived_ld_cents += amount_cents; net_ld_due_cents recomputed"]

  # --- Delivery Milestones ---
  - method: POST
    path: "/delivery-milestones"
    description: "Schedule a delivery or commissioning milestone on an EXECUTED ESA"
    roles: [ProjectDeveloper]
    code: 201
    input: [esa_id, kind, planned_date]
    output: DeliveryMilestone
    side_effects: ["status SCHEDULED"]
  - method: GET
    path: "/delivery-milestones"
    description: "List milestones, optionally filtered by ESA"
    roles: [ProjectDeveloper, PerformanceEngineer, ServiceManager, ServiceEngineer, WarrantyAdmin, SafetyAuthority, MarketOperator, PlatformAdmin]
    code: 200
    input: ["esa_id?", "limit?", "offset?"]
    output: "DeliveryMilestone[]"
    side_effects: []
  - method: GET
    path: "/delivery-milestones/{id}"
    description: "Get one milestone"
    roles: [ProjectDeveloper, PerformanceEngineer, ServiceManager, ServiceEngineer, WarrantyAdmin, SafetyAuthority, MarketOperator, PlatformAdmin]
    code: 200
    input: []
    output: DeliveryMilestone
    side_effects: []
  - method: POST
    path: "/delivery-milestones/{id}/record-outcome"
    description: "Record ACHIEVED or MISSED with the actual date; drives LD accrual and possible ESA auto-termination"
    roles: [ProjectDeveloper]
    code: 200
    input: [outcome, actual_date]
    output: DeliveryMilestone
    side_effects: ["per DeliveryMilestone state machine; ESA LD fields recomputed; on cap reached, ESA -> TERMINATED cascade"]
  - method: POST
    path: "/delivery-milestones/{id}/cancel"
    description: "Cancel a SCHEDULED milestone (ESA must be DRAFT or EXECUTED)"
    roles: [ProjectDeveloper]
    code: 200
    input: []
    output: DeliveryMilestone
    side_effects: ["status -> CANCELLED; ESA LD fields unchanged"]

  # --- Safety Permits ---
  - method: POST
    path: "/safety-permits"
    description: "Submit a safety permit (thermal runaway plan, fire code, or local approval)"
    roles: [ProjectDeveloper]
    code: 201
    input: [project_id, permit_type, authority_reference]
    output: SafetyPermit
    side_effects: ["status SUBMITTED"]
  - method: GET
    path: "/safety-permits"
    description: "List permits, optionally filtered by project"
    roles: [ProjectDeveloper, PerformanceEngineer, ServiceManager, ServiceEngineer, WarrantyAdmin, SafetyAuthority, MarketOperator, PlatformAdmin]
    code: 200
    input: ["project_id?", "limit?", "offset?"]
    output: "SafetyPermit[]"
    side_effects: []
  - method: GET
    path: "/safety-permits/{id}"
    description: "Get one permit"
    roles: [ProjectDeveloper, PerformanceEngineer, ServiceManager, ServiceEngineer, WarrantyAdmin, SafetyAuthority, MarketOperator, PlatformAdmin]
    code: 200
    input: []
    output: SafetyPermit
    side_effects: []
  - method: POST
    path: "/safety-permits/{id}/decide"
    description: "Approve or reject a SUBMITTED permit"
    roles: [SafetyAuthority]
    code: 200
    input: [decision]
    output: SafetyPermit
    side_effects: ["status -> APPROVED | REJECTED; decided_at = logical clock"]
  - method: POST
    path: "/safety-permits/{id}/resubmit"
    description: "Resubmit a REJECTED permit (cycle back to SUBMITTED)"
    roles: [ProjectDeveloper]
    code: 200
    input: []
    output: SafetyPermit
    side_effects: ["status REJECTED -> SUBMITTED"]

  # --- Performance Tests ---
  - method: POST
    path: "/performance-tests"
    description: "Schedule a capacity or RTE test window on a project that has an ESA in EXECUTED or COMPLETED"
    roles: [PerformanceEngineer]
    code: 201
    input: [project_id, test_type, window_start, window_end]
    output: PerformanceTest
    side_effects: ["status SCHEDULED; measurement_basis computed from project market_application"]
  - method: GET
    path: "/performance-tests"
    description: "List tests, optionally filtered by project"
    roles: [ProjectDeveloper, PerformanceEngineer, ServiceManager, ServiceEngineer, WarrantyAdmin, SafetyAuthority, MarketOperator, PlatformAdmin]
    code: 200
    input: ["project_id?", "limit?", "offset?"]
    output: "PerformanceTest[]"
    side_effects: []
  - method: GET
    path: "/performance-tests/{id}"
    description: "Get one test"
    roles: [ProjectDeveloper, PerformanceEngineer, ServiceManager, ServiceEngineer, WarrantyAdmin, SafetyAuthority, MarketOperator, PlatformAdmin]
    code: 200
    input: []
    output: PerformanceTest
    side_effects: []
  - method: POST
    path: "/performance-tests/{id}/record-results"
    description: "Record measurements inside the test window; computes result and may auto-create an augmentation event on capacity FAIL"
    roles: [PerformanceEngineer]
    code: 200
    input: ["measured_capacity_mwh?", "aux_load_mwh?", "rte_intervals?"]
    output: PerformanceTest
    side_effects: ["status -> PASSED | FAILED; capacity FAIL auto-creates AugmentationEvent (origin AUTO) and recomputes Project projection"]
  - method: POST
    path: "/performance-tests/{id}/cancel"
    description: "Cancel a SCHEDULED test"
    roles: [PerformanceEngineer]
    code: 200
    input: []
    output: PerformanceTest
    side_effects: ["status -> CANCELLED"]

  # --- Augmentation Events ---
  - method: POST
    path: "/augmentation-events"
    description: "Plan a manual augmentation on a commissioned project (commissioned_capacity_mwh > 0)"
    roles: [ServiceEngineer]
    code: 201
    input: [project_id, planned_window_start, planned_window_end, added_capacity_mwh]
    output: AugmentationEvent
    side_effects: ["status PLANNED; origin MANUAL; Project.augmentation_count recomputed"]
  - method: GET
    path: "/augmentation-events"
    description: "List augmentation events, optionally filtered by project"
    roles: [ProjectDeveloper, PerformanceEngineer, ServiceManager, ServiceEngineer, WarrantyAdmin, SafetyAuthority, MarketOperator, PlatformAdmin]
    code: 200
    input: ["project_id?", "limit?", "offset?"]
    output: "AugmentationEvent[]"
    side_effects: []
  - method: GET
    path: "/augmentation-events/{id}"
    description: "Get one augmentation event"
    roles: [ProjectDeveloper, PerformanceEngineer, ServiceManager, ServiceEngineer, WarrantyAdmin, SafetyAuthority, MarketOperator, PlatformAdmin]
    code: 200
    input: []
    output: AugmentationEvent
    side_effects: []
  - method: POST
    path: "/augmentation-events/{id}/execute"
    description: "Execute a planned augmentation inside its window (OCC on the parent Project's version)"
    roles: [ServiceEngineer]
    code: 200
    input: [expected_project_version]
    output: AugmentationEvent
    side_effects: ["status -> EXECUTED; Project.projected_capacity_mwh and augmentation_count recomputed; increments Project.version by 1"]
  - method: POST
    path: "/augmentation-events/{id}/cancel"
    description: "Cancel a PLANNED augmentation"
    roles: [ServiceEngineer]
    code: 200
    input: []
    output: AugmentationEvent
    side_effects: ["status -> CANCELLED; Project.augmentation_count recomputed"]

  # --- Service Agreements (LTSA) ---
  - method: POST
    path: "/service-agreements"
    description: "Create a long-term service agreement (starts DRAFT); end_date must be strictly after start_date"
    roles: [ServiceManager]
    code: 201
    input: [project_id, annual_fee_cents, covers_monitoring, covers_maintenance, covers_spare_parts, covers_software_updates, start_date, end_date]
    output: ServiceAgreement
    side_effects: ["status DRAFT"]
  - method: GET
    path: "/service-agreements"
    description: "List LTSAs, optionally filtered by project; reads may trigger lazy expiry"
    roles: [ProjectDeveloper, PerformanceEngineer, ServiceManager, ServiceEngineer, WarrantyAdmin, SafetyAuthority, MarketOperator, PlatformAdmin]
    code: 200
    input: ["project_id?", "limit?", "offset?"]
    output: "ServiceAgreement[]"
    side_effects: ["Lazy expiry: agreements past end_date flip to EXPIRED with cascade"]
  - method: GET
    path: "/service-agreements/{id}"
    description: "Get one LTSA; the read may trigger lazy expiry"
    roles: [ProjectDeveloper, PerformanceEngineer, ServiceManager, ServiceEngineer, WarrantyAdmin, SafetyAuthority, MarketOperator, PlatformAdmin]
    code: 200
    input: []
    output: ServiceAgreement
    side_effects: ["Lazy expiry when logical clock > end_date"]
  - method: POST
    path: "/service-agreements/{id}/activate"
    description: "Activate a DRAFT LTSA within its term; computes the spare-parts credit pool"
    roles: [ServiceManager]
    code: 200
    input: []
    output: ServiceAgreement
    side_effects: ["status -> ACTIVE; credit_pool_cents computed per spare_parts_credit; activated_at = logical clock"]
  - method: POST
    path: "/service-agreements/{id}/suspend"
    description: "Suspend an ACTIVE LTSA"
    roles: [ServiceManager]
    code: 200
    input: []
    output: ServiceAgreement
    side_effects: ["status -> SUSPENDED"]
  - method: POST
    path: "/service-agreements/{id}/reactivate"
    description: "Reactivate a SUSPENDED LTSA within its term"
    roles: [ServiceManager]
    code: 200
    input: []
    output: ServiceAgreement
    side_effects: ["status -> ACTIVE"]

  # --- Spare Part Orders ---
  - method: POST
    path: "/spare-part-orders"
    description: "Order a spare part against an ACTIVE LTSA (OCC on the agreement's version); draws from the credit pool when covered"
    roles: [ServiceManager, ServiceEngineer]
    code: 201
    input: [service_agreement_id, "warranty_claim_id?", part_description, part_cost_cents, expected_service_agreement_version]
    output: SparePartOrder
    side_effects: ["status ORDERED; covered_by_credit computed; credit_drawn_cents updated when covered; increments ServiceAgreement.version by 1"]
  - method: GET
    path: "/spare-part-orders"
    description: "List orders, optionally filtered by service agreement or warranty claim"
    roles: [ProjectDeveloper, PerformanceEngineer, ServiceManager, ServiceEngineer, WarrantyAdmin, SafetyAuthority, MarketOperator, PlatformAdmin]
    code: 200
    input: ["service_agreement_id?", "warranty_claim_id?", "limit?", "offset?"]
    output: "SparePartOrder[]"
    side_effects: []
  - method: GET
    path: "/spare-part-orders/{id}"
    description: "Get one order"
    roles: [ProjectDeveloper, PerformanceEngineer, ServiceManager, ServiceEngineer, WarrantyAdmin, SafetyAuthority, MarketOperator, PlatformAdmin]
    code: 200
    input: []
    output: SparePartOrder
    side_effects: []
  - method: POST
    path: "/spare-part-orders/{id}/ship"
    description: "Mark an ORDERED order shipped"
    roles: [ServiceEngineer]
    code: 200
    input: []
    output: SparePartOrder
    side_effects: ["status -> SHIPPED"]
  - method: POST
    path: "/spare-part-orders/{id}/deliver"
    description: "Mark a SHIPPED order delivered"
    roles: [ServiceEngineer]
    code: 200
    input: []
    output: SparePartOrder
    side_effects: ["status -> DELIVERED"]
  - method: POST
    path: "/spare-part-orders/{id}/install"
    description: "Install a DELIVERED order; fulfills the linked warranty claim"
    roles: [ServiceEngineer]
    code: 200
    input: []
    output: SparePartOrder
    side_effects: ["status -> INSTALLED; linked WarrantyClaim APPROVED -> FULFILLED"]
  - method: POST
    path: "/spare-part-orders/{id}/cancel"
    description: "Cancel an ORDERED or SHIPPED order; restores drawn credit"
    roles: [ServiceManager]
    code: 200
    input: []
    output: SparePartOrder
    side_effects: ["status -> CANCELLED; credit_drawn_cents restored when covered_by_credit"]

  # --- Warranty Claims ---
  - method: POST
    path: "/warranty-claims"
    description: "File a warranty claim against an ESA in EXECUTED or COMPLETED"
    roles: [WarrantyAdmin]
    code: 201
    input: [esa_id, defect_type, claimed_capacity_loss_mwh]
    output: WarrantyClaim
    side_effects: ["status SUBMITTED"]
  - method: GET
    path: "/warranty-claims"
    description: "List claims, optionally filtered by ESA"
    roles: [ProjectDeveloper, PerformanceEngineer, ServiceManager, ServiceEngineer, WarrantyAdmin, SafetyAuthority, MarketOperator, PlatformAdmin]
    code: 200
    input: ["esa_id?", "limit?", "offset?"]
    output: "WarrantyClaim[]"
    side_effects: []
  - method: GET
    path: "/warranty-claims/{id}"
    description: "Get one claim"
    roles: [ProjectDeveloper, PerformanceEngineer, ServiceManager, ServiceEngineer, WarrantyAdmin, SafetyAuthority, MarketOperator, PlatformAdmin]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: []
  - method: POST
    path: "/warranty-claims/{id}/start-review"
    description: "Move a SUBMITTED claim to UNDER_REVIEW"
    roles: [WarrantyAdmin]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: ["status -> UNDER_REVIEW"]
  - method: POST
    path: "/warranty-claims/{id}/decide"
    description: "Approve (with credit variant) or reject an UNDER_REVIEW claim"
    roles: [WarrantyAdmin]
    code: 200
    input: [decision, "credit_variant?", "throughput_mwh?"]
    output: WarrantyClaim
    side_effects: ["status -> APPROVED | REJECTED; credit_amount_cents computed per warranty_credit on APPROVED; decided_at = logical clock"]

  # --- Bid Sessions ---
  - method: POST
    path: "/bid-sessions"
    description: "Open a market bid window on a project that has an ESA in EXECUTED or COMPLETED"
    roles: [MarketOperator]
    code: 201
    input: [project_id, market, window_start, window_end, offer_mwh, offer_price_cents_per_mwh]
    output: BidSession
    side_effects: ["status OPEN"]
  - method: GET
    path: "/bid-sessions"
    description: "List bid sessions, optionally filtered by project"
    roles: [ProjectDeveloper, PerformanceEngineer, ServiceManager, ServiceEngineer, WarrantyAdmin, SafetyAuthority, MarketOperator, PlatformAdmin]
    code: 200
    input: ["project_id?", "limit?", "offset?"]
    output: "BidSession[]"
    side_effects: []
  - method: GET
    path: "/bid-sessions/{id}"
    description: "Get one bid session"
    roles: [ProjectDeveloper, PerformanceEngineer, ServiceManager, ServiceEngineer, WarrantyAdmin, SafetyAuthority, MarketOperator, PlatformAdmin]
    code: 200
    input: []
    output: BidSession
    side_effects: []
  - method: POST
    path: "/bid-sessions/{id}/record-clearing"
    description: "Record the market clearing outcome; computes cleared_mwh via dispatch_optimization"
    roles: [MarketOperator]
    code: 200
    input: [clearing_price_cents_per_mwh, market_cleared_mwh]
    output: BidSession
    side_effects: ["status -> CLEARED; cleared_mwh computed"]
  - method: POST
    path: "/bid-sessions/{id}/settle"
    description: "Settle a CLEARED session; computes revenue_cents"
    roles: [MarketOperator]
    code: 200
    input: []
    output: BidSession
    side_effects: ["status -> SETTLED; revenue_cents computed"]
  - method: POST
    path: "/bid-sessions/{id}/cancel"
    description: "Cancel an OPEN session"
    roles: [MarketOperator]
    code: 200
    input: []
    output: BidSession
    side_effects: ["status -> CANCELLED"]

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  # --- Auth ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or the role is not a declared role" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role is not permitted for this endpoint" }

  # --- Not found ---
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path-segment resource id does not exist" }
  - { id: ERR_PROJECT_NOT_FOUND, http: 404, condition: "Body project_id does not reference an existing Project" }
  - { id: ERR_ESA_NOT_FOUND, http: 404, condition: "Body esa_id does not reference an existing EquipmentSupplyAgreement" }
  - { id: ERR_LTSA_NOT_FOUND, http: 404, condition: "Body service_agreement_id does not reference an existing ServiceAgreement" }
  - { id: ERR_CLAIM_NOT_FOUND, http: 404, condition: "Body warranty_claim_id does not reference an existing WarrantyClaim" }
  - { id: ERR_MILESTONE_NOT_FOUND, http: 404, condition: "Referenced DeliveryMilestone does not exist" }
  - { id: ERR_PERMIT_NOT_FOUND, http: 404, condition: "Referenced SafetyPermit does not exist" }
  - { id: ERR_TEST_NOT_FOUND, http: 404, condition: "Referenced PerformanceTest does not exist" }
  - { id: ERR_AUGMENTATION_NOT_FOUND, http: 404, condition: "Referenced AugmentationEvent does not exist" }
  - { id: ERR_ORDER_NOT_FOUND, http: 404, condition: "Referenced SparePartOrder does not exist" }
  - { id: ERR_BID_SESSION_NOT_FOUND, http: 404, condition: "Referenced BidSession does not exist" }

  # --- OCC ---
  - { id: ERR_STALE_PROJECT_VERSION, http: 412, condition: "expected_project_version does not equal the Project's current version" }
  - { id: ERR_STALE_LTSA_VERSION, http: 412, condition: "expected_service_agreement_version does not equal the ServiceAgreement's current version" }

  # --- State ---
  - { id: ERR_ESA_NOT_DRAFT, http: 409, condition: "ESA execute/waive-ld precondition: ESA not in DRAFT" }
  - { id: ERR_ESA_NOT_EXECUTABLE_STATE, http: 409, condition: "ESA must be in EXECUTED (or COMPLETED where noted) for this operation" }
  - { id: ERR_MILESTONE_NOT_SCHEDULED, http: 409, condition: "DeliveryMilestone must be SCHEDULED" }
  - { id: ERR_ESA_TERMINAL_MILESTONE_LOCKED, http: 409, condition: "Milestone cancel requires the ESA in DRAFT or EXECUTED" }
  - { id: ERR_PERMIT_NOT_PENDING, http: 409, condition: "SafetyPermit decide requires SUBMITTED" }
  - { id: ERR_PERMIT_NOT_REJECTED, http: 409, condition: "SafetyPermit resubmit requires REJECTED" }
  - { id: ERR_TEST_NOT_SCHEDULED, http: 409, condition: "PerformanceTest must be SCHEDULED" }
  - { id: ERR_AUGMENTATION_NOT_PLANNED, http: 409, condition: "AugmentationEvent must be PLANNED" }
  - { id: ERR_LTSA_NOT_DRAFT, http: 409, condition: "LTSA activate requires DRAFT" }
  - { id: ERR_LTSA_NOT_ACTIVE, http: 409, condition: "Operation requires the LTSA in ACTIVE" }
  - { id: ERR_LTSA_NOT_SUSPENDED, http: 409, condition: "LTSA reactivate requires SUSPENDED" }
  - { id: ERR_ORDER_NOT_ORDERED, http: 409, condition: "SparePartOrder ship requires ORDERED" }
  - { id: ERR_ORDER_NOT_SHIPPED, http: 409, condition: "SparePartOrder deliver requires SHIPPED" }
  - { id: ERR_ORDER_NOT_DELIVERED, http: 409, condition: "SparePartOrder install requires DELIVERED" }
  - { id: ERR_ORDER_NOT_CANCELLABLE, http: 409, condition: "SparePartOrder cancel requires ORDERED or SHIPPED" }
  - { id: ERR_CLAIM_NOT_SUBMITTED, http: 409, condition: "WarrantyClaim start-review requires SUBMITTED" }
  - { id: ERR_CLAIM_NOT_UNDER_REVIEW, http: 409, condition: "WarrantyClaim decide requires UNDER_REVIEW" }
  - { id: ERR_CLAIM_NOT_FULFILLABLE, http: 409, condition: "SparePartOrder install with a linked claim requires the claim APPROVED" }
  - { id: ERR_BID_SESSION_NOT_OPEN, http: 409, condition: "BidSession must be OPEN" }
  - { id: ERR_BID_SESSION_NOT_CLEARED, http: 409, condition: "BidSession settle requires CLEARED" }

  # --- Business: safety ---
  - { id: ERR_PERMIT_MISSING_OR_UNAPPROVED, http: 409, condition: "ESA execute: not all three permit types are APPROVED for the project" }

  # --- Business: temporal ---
  - { id: ERR_TEST_WINDOW_NOT_OPEN, http: 409, condition: "record-results outside [window_start, window_end)" }
  - { id: ERR_AUGMENTATION_WINDOW_NOT_OPEN, http: 409, condition: "augmentation execute outside [planned_window_start, planned_window_end)" }
  - { id: ERR_LTSA_NOT_IN_TERM, http: 409, condition: "LTSA activate/reactivate outside [start_date, end_date]" }
  - { id: ERR_MILESTONE_OUTCOME_MISMATCH, http: 409, condition: "ACHIEVED outcome with actual_date > planned_date, or MISSED outcome with actual_date <= planned_date" }

  # --- Business: constraint ---
  - { id: ERR_TEST_WINDOW_OVERLAP, http: 409, condition: "PerformanceTest window overlaps another non-CANCELLED test window on the same project (half-open adjacency allowed)" }
  - { id: ERR_BID_WINDOW_OVERLAP, http: 409, condition: "BidSession window overlaps another OPEN or CLEARED session window on the same project (half-open adjacency allowed)" }
  - { id: ERR_INVALID_WINDOW, http: 409, condition: "window_end/planned_window_end not strictly after its start" }
  - { id: ERR_SIZING_INVALID, http: 409, condition: "ESA execute: Project.sizing_status is INVALID for the market application and duty cycle" }
  - { id: ERR_GUARANTEE_EXCEEDS_RATED_ENERGY, http: 409, condition: "ESA execute: guaranteed_capacity_mwh exceeds the project's rated_energy_mwh" }
  - { id: ERR_PROJECT_NOT_COMMISSIONED, http: 409, condition: "Manual augmentation requires Project.commissioned_capacity_mwh > 0" }

  # --- Business: referential ---
  - { id: ERR_DELIVERY_MILESTONES_OPEN, http: 409, condition: "ESA complete: a DELIVERY milestone is not ACHIEVED" }
  - { id: ERR_NO_COMMISSIONING_ACHIEVED, http: 409, condition: "ESA complete: no COMMISSIONING milestone is ACHIEVED" }
  - { id: ERR_NO_ACTIVE_ESA, http: 409, condition: "Operation requires the project to have an ESA in EXECUTED or COMPLETED" }

  # --- Business: fiscal ---
  - { id: ERR_BUDGET_EXCEEDED, http: 402, condition: "ESA execute: total_price_cents exceeds Project.budget_cents" }
  - { id: ERR_CREDIT_POOL_EXHAUSTED, http: 402, condition: "SparePartOrder cost exceeds remaining LTSA credit pool (no partial coverage)" }
  - { id: ERR_WAIVER_EXCEEDS_ACCRUED, http: 402, condition: "LD waiver amount exceeds accrued_ld_cents - waived_ld_cents" }

  # --- Request shape ---
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, invalid enum value, non-positive quantity, or violated input constraint (e.g., longstop_date <= guaranteed_delivery_date, guaranteed_capacity_mwh > contracted_energy_mwh)" }
  - { id: ERR_INVALID_RTE_INTERVALS, http: 400, condition: "RTE_TEST record-results: rte_intervals missing, empty, or an interval has charge_mwh <= 0 or discharge_mwh < 0" }

# =============================================================================
# Table 7: RBAC Matrix (all roles opaque — X-User-ID is an operator id)
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Platform operator; drives the logical clock and has read access to everything"
    identity: "opaque"
    exclusive_operations:
      - "POST /_clock/set_current_utc"
    shared_operations: ["All GET endpoints"]
  - name: ProjectDeveloper
    description: "Owner-side developer; scopes projects, executes supply agreements, schedules milestones and permits, waives LDs"
    identity: "opaque"
    exclusive_operations:
      - "POST /projects"
      - "POST /equipment-supply-agreements + execute/complete/waive-ld"
      - "POST /delivery-milestones + record-outcome/cancel"
      - "POST /safety-permits + resubmit"
    shared_operations: ["All GET endpoints", "POST /projects/{id}/recompute-projection"]
  - name: PerformanceEngineer
    description: "Test engineer; schedules and records capacity and RTE tests"
    identity: "opaque"
    exclusive_operations:
      - "POST /performance-tests + record-results/cancel"
    shared_operations: ["All GET endpoints", "POST /projects/{id}/recompute-projection"]
  - name: ServiceManager
    description: "Service commercial manager; owns LTSA lifecycle and can order and cancel spare parts"
    identity: "opaque"
    exclusive_operations:
      - "POST /service-agreements + activate/suspend/reactivate"
      - "POST /spare-part-orders/{id}/cancel"
    shared_operations: ["All GET endpoints", "POST /spare-part-orders"]
  - name: ServiceEngineer
    description: "Field service engineer; executes augmentations and moves spare-part orders through ship/deliver/install"
    identity: "opaque"
    exclusive_operations:
      - "POST /augmentation-events + execute/cancel"
      - "POST /spare-part-orders/{id}/ship, deliver, install"
    shared_operations: ["All GET endpoints", "POST /spare-part-orders"]
  - name: WarrantyAdmin
    description: "Warranty administrator; files, reviews, and decides warranty claims"
    identity: "opaque"
    exclusive_operations:
      - "POST /warranty-claims + start-review/decide"
    shared_operations: ["All GET endpoints"]
  - name: SafetyAuthority
    description: "Authority having jurisdiction; decides safety permits"
    identity: "opaque"
    exclusive_operations:
