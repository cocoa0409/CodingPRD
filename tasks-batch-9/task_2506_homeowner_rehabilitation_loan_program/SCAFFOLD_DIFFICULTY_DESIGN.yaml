            - call: "POST /rehab/work-items"
              payload: { write_up_id: "${wu_id}", description: "Full roof replacement", category: "ROOF", priority_class: "HEALTH_SAFETY", estimated_cost_cents: 2800000, is_lead_hazard_reduction: false, is_historic_sensitive: false }
              as: RehabSpecialist
