              payload: { expected_equipment_asset_version: "${asset_v1}", scheduled_window_start: "2026-08-12T00:00:00Z", scheduled_window_end: "2026-08-13T00:00:00Z" }
              as: CounterSales
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_STALE_VERSION (${asset_v1} is stale; asset version is now 2)"
            - "HTTP status == 412"
            - "Inspection.${i1_id} remains SCHEDULED (no supersede occurred)"

