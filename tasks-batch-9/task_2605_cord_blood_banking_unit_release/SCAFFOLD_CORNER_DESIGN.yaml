        claim_type: error_triggerable
        grounds: "§1.4 priority 9 -> ERR_INVALID_LISTING_STATE 'suspending a listing that is not ACTIVE'; §1.4 priority 23 ERR_DUPLICATE_ACTIVE_LISTING 'the unit already has a RegistryListing in status ACTIVE or SUSPENDED'."
        distinguishing_aspect: "Suspension parks the unit in UNAVAILABLE, which is exactly the state the UNAVAILABLE -> LISTED edge admits — so the second POST is state-legal and the refusal must come from the duplicate-listing rule at priority 23 rather than from priority 9, while the replayed suspend proves the listing row's own state code."
