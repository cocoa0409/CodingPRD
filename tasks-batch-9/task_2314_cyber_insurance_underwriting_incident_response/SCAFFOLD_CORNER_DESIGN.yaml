scaffold_corner_design:
  - section: entities
    instances:
      - name: control_requirement_created_with_every_declared_field
        claim_type: creation
        grounds:
          - entities.ControlRequirement
          - endpoints[POST /cyber/control-requirements]
        distinguishing_aspect: |
          POST /cyber/control-requirements with every input field present returns 201 and the response
          echoes control_key, min_level_required, weight, is_mandatory and remediation_grace_days exactly
          as sent, with a server-minted id and created_at.
        test_recipe:
          setup:
            - "Empty database with the logical clock pinned to its default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /cyber/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: Underwriter
              as_user_id: "u-underwriter-1"
          trigger:
            - call: "POST /cyber/control-requirements"
              payload: { control_key: "MFA_PRIVILEGED", min_level_required: "FULL", weight: 30, is_mandatory: true, remediation_grace_days: 45 }
              as: Underwriter
              as_user_id: "u-underwriter-1"
              captures: { cr_id: "$.data.id" }
          assert:
            - "the response status is 201 and $.data.id is a non-empty server-minted identifier"
            - "ControlRequirement.${cr_id}.control_key == MFA_PRIVILEGED and min_level_required == FULL"
            - "ControlRequirement.${cr_id}.weight == 30 and is_mandatory == true"
            - "ControlRequirement.${cr_id}.remediation_grace_days == 45"
            - "the envelope carries meta.api_request_id, meta.api_request_timestamp and response_type == object"
            - "GET /cyber/control-requirements returns total_count == 1"
      - name: insured_account_get_returns_the_stored_row
        claim_type: retrieval
        grounds:
          - entities.InsuredAccount
          - endpoints[GET /cyber/insured-accounts/{insured_account_id}]
        distinguishing_aspect: |
          GET /cyber/insured-accounts/{insured_account_id} returns exactly the row created by the POST,
          including the computed open_remediation_count of 0.
        test_recipe:
          setup:
            - "One InsuredAccount created for Aurora Health at the default clock 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /cyber/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: Underwriter
              as_user_id: "u-underwriter-1"
            - call: "POST /cyber/insured-accounts"
              payload: { legal_name: "Aurora Health", industry_code: "HEALTHCARE", annual_revenue_usd: 43800000, record_count: 12345, primary_dependency_key: "CSP_ALPHA" }
              as: Underwriter
              as_user_id: "u-underwriter-1"
              captures: { acct_a_id: "$.data.id" }
          trigger:
            - call: "GET /cyber/insured-accounts/${acct_a_id}"
              payload: {}
              as: Underwriter
              as_user_id: "u-underwriter-1"
          assert:
            - "the response status is 200 and $.data.id == ${acct_a_id}"
            - "InsuredAccount.${acct_a_id}.legal_name == Aurora Health and industry_code == HEALTHCARE"
            - "InsuredAccount.${acct_a_id}.annual_revenue_usd == 43800000 and record_count == 12345"
            - "InsuredAccount.${acct_a_id}.primary_dependency_key == CSP_ALPHA"
            - "InsuredAccount.${acct_a_id}.open_remediation_count == 0"
      - name: applications_list_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - entities.Application
          - endpoints[GET /cyber/applications]
        distinguishing_aspect: |
          GET /cyber/applications with limit 2 over three applications of one account returns two rows,
          total_count 3 and has_more true; the same query at offset 2 returns one row and has_more false.
        test_recipe:
          setup:
            - "One InsuredAccount with three DRAFT Applications, each requesting a different aggregate limit."
            - "Pagination defaults are limit 10 and offset 0, so the explicit limit of 2 is what forces the split."
          setup_api_calls:
            - call: "POST /cyber/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: Underwriter
              as_user_id: "u-underwriter-1"
            - call: "POST /cyber/insured-accounts"
              payload: { legal_name: "Aurora Health", industry_code: "HEALTHCARE", annual_revenue_usd: 43800000, record_count: 12345, primary_dependency_key: "CSP_ALPHA" }
              as: Underwriter
              as_user_id: "u-underwriter-1"
              captures: { acct_a_id: "$.data.id" }
            - call: "POST /cyber/applications"
              payload: { insured_account_id: "${acct_a_id}", requested_aggregate_limit_usd: 250000, requested_retention_usd: 0, dependent_bi_definition: "NAMED_ONLY" }
              as: Underwriter
              as_user_id: "u-underwriter-1"
              captures: { app_1_id: "$.data.id" }
            - call: "POST /cyber/applications"
              payload: { insured_account_id: "${acct_a_id}", requested_aggregate_limit_usd: 500000, requested_retention_usd: 0, dependent_bi_definition: "NAMED_ONLY" }
              as: Underwriter
              as_user_id: "u-underwriter-1"
              captures: { app_2_id: "$.data.id" }
            - call: "POST /cyber/applications"
              payload: { insured_account_id: "${acct_a_id}", requested_aggregate_limit_usd: 750000, requested_retention_usd: 0, dependent_bi_definition: "NAMED_ONLY" }
              as: Underwriter
              as_user_id: "u-underwriter-1"
              captures: { app_3_id: "$.data.id" }
          trigger:
            - call: "GET /cyber/applications"
              payload: { insured_account_id: "${acct_a_id}", limit: 2, offset: 0 }
              as: Underwriter
              as_user_id: "u-underwriter-1"
            - call: "GET /cyber/applications"
              payload: { insured_account_id: "${acct_a_id}", limit: 2, offset: 2 }
              as: Underwriter
              as_user_id: "u-underwriter-1"
          assert:
            - "the first response returns total_count == 3, has_more == true and exactly 2 rows in $.data"
            - "the second response returns total_count == 3, has_more == false and exactly 1 row in $.data"
            - "every returned row has insured_account_id == ${acct_a_id}"
            - "response_type == array on both calls"
      - name: policy_get_with_unknown_id_returns_not_found
        claim_type: not_found
        grounds:
          - entities.Policy
          - errors[ERR_POLICY_NOT_FOUND]
          - validations[priority=3]
        distinguishing_aspect: |
          A GET on /cyber/policies/{policy_id} with a syntactically valid but non-existent UUID returns
          HTTP 404 with error_id ERR_POLICY_NOT_FOUND and no data payload.
        test_recipe:
          setup:
            - "Empty database apart from the pinned clock, so no Policy row exists at all."
          setup_api_calls:
            - call: "POST /cyber/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: Underwriter
              as_user_id: "u-underwriter-1"
          trigger:
            - call: "GET /cyber/policies/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Underwriter
              as_user_id: "u-underwriter-1"
              captures: { err: "$.data.error_id" }
          assert:
            - "the response status is 404 and error_id == ERR_POLICY_NOT_FOUND"
            - "response_type == error and $.data.message is a non-empty string"
      - name: application_create_missing_dependent_bi_definition_returns_invalid_request
        claim_type: required_fields
        grounds:
          - entities.Application.fields.dependent_bi_definition
          - validations[priority=7]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          dependent_bi_definition is declared `source: input` with no default, so omitting it from
          POST /cyber/applications must return HTTP 400 ERR_INVALID_REQUEST and create no Application.
        test_recipe:
          setup:
            - "One InsuredAccount for Aurora Health; no Application exists yet."
          setup_api_calls:
            - call: "POST /cyber/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: Underwriter
              as_user_id: "u-underwriter-1"
            - call: "POST /cyber/insured-accounts"
              payload: { legal_name: "Aurora Health", industry_code: "HEALTHCARE", annual_revenue_usd: 43800000, record_count: 12345, primary_dependency_key: "CSP_ALPHA" }
              as: Underwriter
              as_user_id: "u-underwriter-1"
              captures: { acct_a_id: "$.data.id" }
          trigger:
            - call: "POST /cyber/applications"
              payload: { insured_account_id: "${acct_a_id}", requested_aggregate_limit_usd: 5000000, requested_retention_usd: 250000 }
              as: Underwriter
              as_user_id: "u-underwriter-1"
              captures: { err: "$.data.error_id" }
          assert:
            - "the response status is 400 and error_id == ERR_INVALID_REQUEST"
            - "GET /cyber/applications with insured_account_id ${acct_a_id} returns total_count == 0"
      - name: control_requirement_defaults_non_mandatory_and_thirty_grace_days
        claim_type: defaults
        grounds:
          - entities.ControlRequirement.fields.is_mandatory
          - entities.ControlRequirement.fields.remediation_grace_days
        distinguishing_aspect: |
          Omitting is_mandatory and remediation_grace_days applies the declared defaults false and 30,
          not null and not a server error.
        test_recipe:
          setup:
            - "Empty database with the clock pinned to 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /cyber/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: Underwriter
              as_user_id: "u-underwriter-1"
          trigger:
            - call: "POST /cyber/control-requirements"
              payload: { control_key: "EMAIL_FILTERING", min_level_required: "PARTIAL", weight: 15 }
              as: Underwriter
              as_user_id: "u-underwriter-1"
              captures: { cr2_id: "$.data.id" }
          assert:
            - "the response status is 201"
            - "ControlRequirement.${cr2_id}.is_mandatory == false"
            - "ControlRequirement.${cr2_id}.remediation_grace_days == 30"
            - "GET /cyber/control-requirements with is_mandatory true returns total_count == 0"
      - name: panel_vendor_defaults_active_zero_record_rate_and_no_engagements
        claim_type: defaults
        grounds:
          - entities.PanelVendor.fields.status
          - entities.PanelVendor.fields.per_record_notification_rate_usd
          - entities.PanelVendor.fields.active_engagement_count
        distinguishing_aspect: |
          Empanelling a firm without status and without per_record_notification_rate_usd yields status
          ACTIVE, per_record_notification_rate_usd 0.00 and active_engagement_count 0.
        test_recipe:
          setup:
            - "Empty panel at the default clock 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /cyber/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: Underwriter
              as_user_id: "u-underwriter-1"
          trigger:
            - call: "POST /cyber/panel-vendors"
              payload: { vendor_name: "Harbor PR", vendor_type: "PR_CRISIS", pre_approved_hourly_rate_usd: 300, specialty_sectors: ["HEALTHCARE"], tier: 2, capacity_concurrent_engagements: 3 }
              as: PanelAdmin
              as_user_id: "u-panel-1"
              captures: { pv_id: "$.data.id" }
          assert:
            - "the response status is 201"
            - "PanelVendor.${pv_id}.status == ACTIVE"
            - "PanelVendor.${pv_id}.per_record_notification_rate_usd == 0.00"
            - "PanelVendor.${pv_id}.active_engagement_count == 0"
      - name: incident_claim_defaults_dependency_none_records_zero_and_no_reservation
        claim_type: defaults
        grounds:
          - entities.IncidentClaim.fields.dependency_key
          - entities.IncidentClaim.fields.affected_record_count
          - entities.IncidentClaim.fields.reservation_of_rights
          - entities.IncidentClaim.fields.reserved_amount_usd
        distinguishing_aspect: |
          Creating a claim without dependency_key and without affected_record_count applies the declared
          defaults NONE and 0, while reservation_of_rights stays false and every money ledger starts 0.00.
        test_recipe:
          setup:
            - "A bound Aurora Health policy with the five-section tower; logical clock at 2026-09-10T00:00:00Z."
          setup_api_calls:
            - call: "POST /cyber/control-requirements"
              payload: { control_key: "MFA_PRIVILEGED", min_level_required: "FULL", weight: 30, is_mandatory: true }
              as: Underwriter
              as_user_id: "u-underwriter-1"
            - call: "POST /cyber/control-requirements"
              payload: { control_key: "OFFLINE_BACKUPS", min_level_required: "FULL", weight: 25, is_mandatory: true }
              as: Underwriter
              as_user_id: "u-underwriter-1"
            - call: "POST /cyber/control-requirements"
              payload: { control_key: "EDR_COVERAGE", min_level_required: "PARTIAL", weight: 20, is_mandatory: true }
              as: Underwriter
              as_user_id: "u-underwriter-1"
            - call: "POST /cyber/control-requirements"
              payload: { control_key: "EMAIL_FILTERING", min_level_required: "PARTIAL", weight: 15, is_mandatory: false }
              as: Underwriter
              as_user_id: "u-underwriter-1"
            - call: "POST /cyber/control-requirements"
              payload: { control_key: "INCIDENT_RESPONSE_PLAN", min_level_required: "PARTIAL", weight: 10, is_mandatory: false }
              as: Underwriter
              as_user_id: "u-underwriter-1"
            - call: "POST /cyber/insured-accounts"
              payload: { legal_name: "Aurora Health", industry_code: "HEALTHCARE", annual_revenue_usd: 43800000, record_count: 12345, primary_dependency_key: "CSP_ALPHA" }
              as: Underwriter
              as_user_id: "u-underwriter-1"
              captures: { acct_a_id: "$.data.id" }
            - call: "POST /cyber/applications"
              payload: { insured_account_id: "${acct_a_id}", requested_aggregate_limit_usd: 5000000, requested_retention_usd: 250000, dependent_bi_definition: "NAMED_PLUS_SUPPLY_CHAIN" }
              as: Underwriter
              as_user_id: "u-underwriter-1"
              captures: { app_a_id: "$.data.id" }
            - call: "POST /cyber/applications/${app_a_id}/control-attestations"
              payload: { control_key: "MFA_PRIVILEGED", attested_level: "FULL" }
              as: Underwriter
              as_user_id: "u-underwriter-1"
            - call: "POST /cyber/applications/${app_a_id}/control-attestations"
              payload: { control_key: "OFFLINE_BACKUPS", attested_level: "FULL" }
              as: Underwriter
              as_user_id: "u-underwriter-1"
            - call: "POST /cyber/applications/${app_a_id}/control-attestations"
              payload: { control_key: "EDR_COVERAGE", attested_level: "FULL" }
              as: Underwriter
              as_user_id: "u-underwriter-1"
            - call: "POST /cyber/applications/${app_a_id}/control-attestations"
              payload: { control_key: "EMAIL_FILTERING", attested_level: "FULL" }
              as: Underwriter
              as_user_id: "u-underwriter-1"
            - call: "POST /cyber/applications/${app_a_id}/control-attestations"
              payload: { control_key: "INCIDENT_RESPONSE_PLAN", attested_level: "PARTIAL" }
              as: Underwriter
              as_user_id: "u-underwriter-1"
            - call: "POST /cyber/applications/${app_a_id}/submit"
              payload: {}
              as: Underwriter
              as_user_id: "u-underwriter-1"
            - call: "POST /cyber/applications/${app_a_id}/external-scans"
              payload: { scan_vendor_name: "Perimeter Signal", scan_score: 68 }
              as: Underwriter
              as_user_id: "u-underwriter-1"
              captures: { scan_app_a_id: "$.data.id" }
            - call: "POST /cyber/external-scans/${scan_app_a_id}/complete"
              payload: { outcome: "COMPLETED", findings: [{ control_key: "EMAIL_FILTERING", severity: "HIGH", observed_level: "PARTIAL" }] }
              as: Underwriter
              as_user_id: "u-underwriter-1"
            - call: "GET /cyber/applications/${app_a_id}"
              payload: {}
              as: Underwriter
              as_user_id: "u-underwriter-1"
              captures: { app_a_v1: "$.data.version" }
            - call: "POST /cyber/applications/${app_a_id}/quote"
              payload: { expected_application_version: "${app_a_v1}" }
              as: Underwriter
              as_user_id: "u-underwriter-1"
              captures: { app_a_v2: "$.data.version" }
            - call: "POST /cyber/applications/${app_a_id}/bind"
              payload: { expected_application_version: "${app_a_v2}", period_start: "2026-08-01T00:00:00Z", period_end: "2027-08-01T00:00:00Z", bi_baseline_method: "TRAILING_12M", coverage_sections: [{ section_key: "FIRST_PARTY_RESPONSE", sublimit_usd: 1000000, waiting_period_hours: null, coinsurance_pct: 0.0, erosion_priority: 10 }, { section_key: "BUSINESS_INTERRUPTION", sublimit_usd: 2000000, waiting_period_hours: 12, coinsurance_pct: 0.1, erosion_priority: 20 }, { section_key: "DEPENDENT_BI", sublimit_usd: 500000, waiting_period_hours: 24, coinsurance_pct: 0.2, erosion_priority: 30 }, { section_key: "THIRD_PARTY_LIABILITY", sublimit_usd: 3000000, waiting_period_hours: null, coinsurance_pct: 0.0, erosion_priority: 40 }, { section_key: "CYBER_EXTORTION", sublimit_usd: 500000, waiting_period_hours: null, coinsurance_pct: 0.0, erosion_priority: 50 }], named_dependency_keys: ["CSP_ALPHA"] }
              as: Underwriter
              as_user_id: "u-underwriter-2"
              captures: { pol_a_id: "$.data.id" }
            - call: "POST /cyber/_clock/set_current_utc"
              payload: { current_utc: "2026-09-10T00:00:00Z" }
              as: Underwriter
              as_user_id: "u-underwriter-1"
          trigger:
            - call: "POST /cyber/incident-claims"
              payload: { policy_id: "${pol_a_id}", incident_type: "BEC", incident_discovered_at: "2026-09-05T00:00:00Z" }
              as: ClaimsAdjuster
              as_user_id: "u-adjuster-1"
              captures: { clm_def_id: "$.data.id" }
          assert:
            - "the response status is 201"
            - "IncidentClaim.${clm_def_id}.dependency_key == NONE and affected_record_count == 0"
            - "IncidentClaim.${clm_def_id}.reservation_of_rights == false"
            - "IncidentClaim.${clm_def_id}.reserved_amount_usd == 0.00, retention_absorbed_usd == 0.00, paid_total_usd == 0.00, unallocated_loss_usd == 0.00"
            - "IncidentClaim.${clm_def_id}.proof_review_round == 0"
      - name: application_attested_score_and_indicative_premium_computed_at_submit
        claim_type: computed_fields
        grounds:
          - entities.Application.fields.attested_control_score
          - entities.Application.fields.indicative_premium_usd
          - calculations.control_posture_score
          - calculations.premium_quote
        distinguishing_aspect: |
          attested_control_score and indicative_premium_usd are `source: computed`: the submit call sends
          no such fields yet the row comes back with 95.00 and 25398.00 derived from the attestations.
        test_recipe:
          setup:
            - "Full five-row control catalog with weights 30/25/20/15/10."
            - "Aurora Health account (HEALTHCARE, revenue 43800000, dependency CSP_ALPHA) with a DRAFT Application requesting aggregate 5000000 and retention 250000."
            - "Attestations FULL/FULL/FULL/FULL/PARTIAL are already recorded, and the submit payload is empty."
          setup_api_calls:
            - call: "POST /cyber/control-requirements"
              payload: { control_key: "MFA_PRIVILEGED", min_level_required: "FULL", weight: 30, is_mandatory: true }
              as: Underwriter
              as_user_id: "u-underwriter-1"
            - call: "POST /cyber/control-requirements"
              payload: { control_key: "OFFLINE_BACKUPS", min_level_required: "FULL", weight: 25, is_mandatory: true }
              as: Underwriter
              as_user_id: "u-underwriter-1"
            - call: "POST /cyber/control-requirements"
              payload: { control_key: "EDR_COVERAGE", min_level_required: "PARTIAL", weight: 20, is_mandatory: true }
              as: Underwriter
              as_user_id: "u-underwriter-1"
            - call: "POST /cyber/control-requirements"
              payload: { control_key: "EMAIL_FILTERING", min_level_required: "PARTIAL", weight: 15, is_mandatory: false }
              as: Underwriter
              as_user_id: "u-underwriter-1"
            - call: "POST /cyber/control-requirements"
              payload: { control_key: "INCIDENT_RESPONSE_PLAN", min_level_required: "PARTIAL", weight: 10, is_mandatory: false }
              as: Underwriter
              as_user_id: "u-underwriter-1"
            - call: "POST /cyber/insured-accounts"
              payload: { legal_name: "Aurora Health", industry_code: "HEALTHCARE", annual_revenue_usd: 43800000, record_count: 12345, primary_dependency_key: "CSP_ALPHA" }
              as: Underwriter
              as_user_id: "u-underwriter-1"
              captures: { acct_a_id: "$.data.id" }
            - call: "POST /cyber/applications"
              payload: { insured_account_id: "${acct_a_id}", requested_aggregate_limit_usd: 5000000, requested_retention_usd: 250000, dependent_bi_definition: "NAMED_PLUS_SUPPLY_CHAIN" }
              as: Underwriter
              as_user_id: "u-underwriter-1"
              captures: { app_a_id: "$.data.id" }
            - call: "POST /cyber/applications/${app_a_id}/control-attestations"
              payload: { control_key: "MFA_PRIVILEGED", attested_level: "FULL" }
              as: Underwriter
              as_user_id: "u-underwriter-1"
            - call: "POST /cyber/applications/${app_a_id}/control-attestations"
              payload: { control_key: "OFFLINE_BACKUPS", attested_level: "FULL" }
              as: Underwriter
              as_user_id: "u-underwriter-1"
            - call: "POST /cyber/applications/${app_a_id}/control-attestations"
              payload: { control_key: "EDR_COVERAGE", attested_level: "FULL" }
              as: Underwriter
              as_user_id: "u-underwriter-1"
            - call: "POST /cyber/applications/${app_a_id}/control-attestations"
              payload: { control_key: "EMAIL_FILTERING", attested_level: "FULL" }
              as: Underwriter
              as_user_id: "u-underwriter-1"
            - call: "POST /cyber/applications/${app_a_id}/control-attestations"
              payload: { control_key: "INCIDENT_RESPONSE_PLAN", attested_level: "PARTIAL" }
              as: Underwriter
              as_user_id: "u-underwriter-1"
          trigger:
            - call: "POST /cyber/applications/${app_a_id}/submit"
              payload: {}
              as: Underwriter
              as_user_id: "u-underwriter-1"
          assert:
            - "Application.${app_a_id}.status == SUBMITTED"
            - "Application.${app_a_id}.attested_control_score == 95.00"
            - "Application.${app_a_id}.indicative_premium_usd == 25398.00"
            - "Application.${app_a_id}.verified_control_score == null and premium_usd == null"
            - "Application.${app_a_id}.mandatory_gap_count == 0 and mandatory_gap_control_keys == []"
      - name: external_scan_critical_finding_count_computed_from_findings
        claim_type: computed_fields
        grounds:
          - entities.ExternalScan.fields.critical_finding_count
          - entities.ExternalScan.fields.completed_at
          - state_machines.ExternalScan.PENDING_to_COMPLETED
        distinguishing_aspect: |
          critical_finding_count is computed from the findings array (two CRITICAL entries out of three)
          and completed_at is stamped from the logical clock, neither being client-supplied.
        test_recipe:
          setup:
            - "Full control catalog, Aurora Health account and a SUBMITTED Application with attestations FULL/FULL/FULL/FULL/PARTIAL."
            - "One PENDING ExternalScan on that application; logical clock at 2026-08-05T00:00:00Z."
          setup_api_calls:
            - call: "POST /cyber/control-requirements"
