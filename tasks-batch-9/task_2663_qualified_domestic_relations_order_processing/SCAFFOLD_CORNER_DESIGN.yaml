          trigger:
            - call: "POST /attorney-authorizations/${auth_id}/revoke"
              payload: {}
              as: PlanAdministrator
              captures: { st1: $.data.status, revoked1: $.data.revoked_at }
            - call: "POST /attorney-authorizations/${auth_id}/revoke"
              payload: {}
              as: PlanAdministrator
              captures: { e_second_revoke: $.data.error_id }
            - call: "POST /_ops/run-segregation-sweep"
              payload: {}
              as: PlanAdministrator
              captures: { holds1: $.data.expired_hold_ids, cases1: $.data.lapsed_case_ids, drafts1: $.data.denied_draft_order_ids, notices1: $.data.expired_notice_ids, aps1: $.data.closed_ap_account_ids }
            - call: "GET /qdro-cases/${case_id}"
              payload: {}
              as: PlanAdministrator
              captures: { review_after1: $.data.review_status, seg_after1: $.data.segregation_status, v_after1: $.data.version }
            - call: "POST /_ops/run-segregation-sweep"
              payload: {}
              as: PlanAdministrator
              captures: { holds2: $.data.expired_hold_ids, cases2: $.data.lapsed_case_ids, drafts2: $.data.denied_draft_order_ids, notices2: $.data.expired_notice_ids, aps2: $.data.closed_ap_account_ids }
            - call: "GET /qdro-cases/${case_id}"
              payload: {}
              as: PlanAdministrator
              captures: { review_after2: $.data.review_status, seg_after2: $.data.segregation_status, v_after2: $.data.version }
          assert:
            - "${st1} == \"REVOKED\" and ${revoked1} == \"2028-03-02T00:00:01Z\" — the first revoke stamps the logical clock."
            - "${e_second_revoke} == \"ERR_AUTHORIZATION_NOT_ACTIVE\" with HTTP 409 — a repeated revoke is an error, not an idempotent success; GET /qdro-cases/${case_id}/attorney-authorizations with status=REVOKED returns exactly 1 row whose revoked_at is still \"2028-03-02T00:00:01Z\" (not restamped)."
            - "${holds1} has exactly 1 element, ${cases1} == [\"${case_id}\"], ${drafts1} == [\"${draft_id}\"], ${notices1} == [] and ${aps1} == [] — the first sweep lapses the single expired hold and denies its live draft."
            - "${review_after1} == \"DENIED\" and ${seg_after1} == \"LAPSED\"."
            - "${holds2} == [], ${cases2} == [], ${drafts2} == [], ${notices2} == [] and ${aps2} == [] with HTTP 200 — the second sweep is a successful no-op, not a 409 and not a repeat cascade."
            - "${review_after2} == \"DENIED\", ${seg_after2} == \"LAPSED\" and ${v_after2} == ${v_after1} — the case version did NOT move on the second sweep, which is the only way to prove no work was redone."
            - "GET /qdro-cases/${case_id}/communications with template_code=SEGREGATION_LAPSE_NOTICE returns exactly 2 rows, not 4 — the lapse notices were appended once."
            - "GET /plan-accounts/${acct_id} reports held_amount_cents 0 and available_balance_cents 1000000 after both sweeps — the released capacity is restored once and not double-credited."

      - name: shared_payment_qualification_releases_instead_of_converting
        claim_type: conditional_cascade
        grounds:
          - state_machines[QdroCase.segregation_status].transitions[HELD->RELEASED_TO_PARTICIPANT]
          - state_machines[SegregationHold].transitions[HELD->RELEASED]
          - state_machines[AlternatePayeeAccount].transitions[ESTABLISHED->CLOSED]
          - calculations.benefit_assignment_projection.variants[SHARED_PAYMENT]
          - calculations.distribution_settlement
          - errors.ERR_SHARED_PAYMENT_AMOUNT_MISMATCH
          - endpoints[POST /_ops/run-segregation-sweep]
        distinguishing_aspect: |
          The qualification cascade's L3/L4/L5/L6 links are all CONDITIONAL on the case's approach. For
          SHARED_PAYMENT the hold is RELEASED (not CONVERTED), segregation_date stays null, no MoneySource
          is debited, the payee account is established with balance 0 and a per-period amount, and the case
          lands on RELEASED_TO_PARTICIPANT — the same endpoint, the same actor, an entirely different
          side-effect set. Downstream, the payee's distributions must be exactly the per-period amount
          (anything else is ERR_SHARED_PAYMENT_AMOUNT_MISMATCH) and are funded from the PARTICIPANT's
          pools, and the account is closed later by sweep phase 3 rather than by exhaustion.
        test_recipe:
          setup:
            - "A PUBLISHED plan allowing both approaches, PERIOD_END, requires_model_language true, clock 2026-09-01."
            - "A participant with benefit_commenced true, a plan account with monthly_payment_cents 320000, one assignable PRE_TAX_DEFERRAL source of 1000000 with basis 0, and a snapshot on 2026-06-30 of 1000000."
            - "A case valued 2026-06-30 whose payee was born 1960-01-15 (already past 59.5) receives a 4000 bps SHARED_PAYMENT draft ending 2027-12-31."
          setup_api_calls:
            - call: "POST /plans"
              payload: { plan_name: "Shared Plan", plan_type: "DEFINED_CONTRIBUTION", model_language_version: "MLA-2026.1", acceptable_formula_codes: ["PERCENTAGE_OF_ACCOUNT"], allowed_approaches: ["SEPARATE_INTEREST", "SHARED_PAYMENT"], requires_model_language: true, earnings_adjustment_method: "PERIOD_END" }
              as: PlanAdministrator
              captures: { plan_id: $.data.id }
            - call: "POST /plans/${plan_id}/procedure-status"
              payload: { to_status: "PUBLISHED" }
              as: PlanAdministrator
            - call: "POST /participants"
              payload: { plan_id: "${plan_id}", full_name: "Retired Participant", ssn_last4: "4040", date_of_birth: "1958-04-04", participation_start_date: "1990-01-01", benefit_commenced: true }
              as: PlanAdministrator
              captures: { part_id: $.data.id }
            - call: "POST /participants/${part_id}/plan-accounts"
              payload: { monthly_payment_cents: 320000 }
              as: PlanAdministrator
              captures: { acct_id: $.data.id }
            - call: "POST /plan-accounts/${acct_id}/money-sources"
              payload: { source_code: "PRE_TAX_DEFERRAL", balance_cents: 1000000, basis_cents: 0 }
              as: PlanAdministrator
            - call: "POST /plan-accounts/${acct_id}/valuation-snapshots"
              payload: { as_of_date: "2026-06-30", balance_cents: 1000000, source: "TRUSTEE_STATEMENT" }
              as: PlanAdministrator
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlanAdministrator
            - call: "POST /qdro-cases"
              payload: { participant_id: "${part_id}", alternate_payee_name: "Shared Payee", valuation_date: "2026-06-30", marital_period_start: "2012-03-01", marital_period_end: "2026-02-01", alternate_payee_dob: "1960-01-15", alternate_payee_address_on_file: true }
              as: QdroAnalyst
              captures: { case_id: $.data.id, case_v: $.data.version }
            - call: "POST /draft-orders"
              payload: { qdro_case_id: "${case_id}", expected_case_version: "${case_v}", document_reference: "DRO-2663-SHARE", uses_model_language: true, proposed_approach: "SHARED_PAYMENT", proposed_formula_code: "PERCENTAGE_OF_ACCOUNT", proposed_percentage_bps: 4000, proposed_shared_payment_end_date: "2027-12-31" }
              as: QdroAnalyst
              captures: { draft_id: $.data.id }
            - call: "GET /segregation-holds"
              payload: { qdro_case_id: "${case_id}" }
              as: PlanAdministrator
              captures: { hold_id: "$.data[0].id", hold_amt: "$.data[0].hold_amount_cents" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-15T00:00:00Z" }
              as: PlanAdministrator
          trigger:
            - call: "POST /draft-orders/${draft_id}/qualify"
              payload: {}
              as: PlanAdministrator
              as_user_id: "admin-5"
              captures: { draft_final: $.data.status }
            - call: "GET /segregation-holds/${hold_id}"
              payload: {}
              as: PlanAdministrator
              captures: { hold_final: $.data.status, hold_segdate: $.data.segregation_date, hold_growth: $.data.earnings_growth_bps, hold_earn: $.data.earnings_adjustment_cents }
            - call: "GET /qdro-cases/${case_id}/alternate-payee-accounts"
              payload: {}
              as: PlanAdministrator
              captures: { ap_id: "$.data[0].id", ap_mode: "$.data[0].payment_mode", ap_bal: "$.data[0].balance_cents", ap_per: "$.data[0].per_period_amount_cents", ap_end: "$.data[0].shared_payment_end_date", ap_v: "$.data[0].version" }
            - call: "POST /alternate-payee-accounts/${ap_id}/distributions"
              payload: { expected_ap_account_version: "${ap_v}", election: "CASH", gross_amount_cents: 128001 }
              as: AlternatePayee
              as_user_id: "${ap_id}"
              captures: { e_mismatch: $.data.error_id }
            - call: "POST /alternate-payee-accounts/${ap_id}/distributions"
              payload: { expected_ap_account_version: "${ap_v}", election: "CASH", gross_amount_cents: 128000 }
              as: AlternatePayee
              as_user_id: "${ap_id}"
              captures: { d_wh: $.data.federal_withheld_cents, d_fee: $.data.admin_fee_cents, d_net: $.data.net_amount_cents, d_code: $.data.distribution_code, d_basis: $.data.basis_recovery_cents }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-12-31T23:59:59Z" }
              as: PlanAdministrator
            - call: "POST /_ops/run-segregation-sweep"
              payload: {}
              as: PlanAdministrator
              captures: { aps_early: $.data.closed_ap_account_ids }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2028-01-01T00:00:00Z" }
              as: PlanAdministrator
            - call: "POST /_ops/run-segregation-sweep"
              payload: {}
              as: PlanAdministrator
              captures: { aps_late: $.data.closed_ap_account_ids }
          assert:
            - "${hold_amt} == 400000 at placement, but ${hold_final} == \"RELEASED\" (never CONVERTED), ${hold_segdate} == null, ${hold_growth} == 0 and ${hold_earn} == 0 — a SHARED_PAYMENT qualification releases the hold with both earnings fields untouched, even though a valuation snapshot exists."
            - "${draft_final} == \"QUALIFIED\" and GET /qdro-cases/${case_id} reports review_status \"QUALIFIED\" with segregation_status \"RELEASED_TO_PARTICIPANT\" — not CONVERTED."
            - "${ap_mode} == \"SHARED_PAYMENT\", ${ap_bal} == 0, ${ap_per} == 128000 (floor of 320000 * 4000 / 10000) and ${ap_end} == \"2027-12-31\" — the payee gets a periodic slice, not a principal balance."
            - "GET /plan-accounts/${acct_id} immediately after qualification reports vested_balance_cents 1000000, assignable_base_cents 1000000, held_amount_cents 0 and available_balance_cents 1000000 — NO MoneySource was debited, which is the L5 divergence from the SEPARATE_INTEREST path."
            - "${e_mismatch} == \"ERR_SHARED_PAYMENT_AMOUNT_MISMATCH\" with HTTP 422 — a shared-payment distribution must equal per_period_amount_cents exactly; 128001 is refused even though the participant's account could fund it."
            - "${d_basis} == 0, ${d_wh} == 25600, ${d_fee} == 5000, ${d_net} == 97400 and ${d_code} == \"CODE_7\" — the pools come from the PARTICIPANT's account (after_tax_basis 0 over assignable_base 1000000), taxable 128000 clears the 20000 floor, net_before_fee 102400 lands in the mid tier, and the payee born 1960-01-15 is past 59.5 so the code is CODE_7 rather than CODE_2."
            - "GET /plan-accounts/${acct_id} after the distribution reports vested_balance_cents 872000 and assignable_base_cents 872000 — a SHARED_PAYMENT slice debits the participant's assignable sources, and GET /alternate-payee-accounts/${ap_id} still reports balance_cents 0 with total_distributed_gross_cents 128000."
            - "${aps_early} == [] at clock 2027-12-31T23:59:59Z — phase 3 fires only when the clock's DATE is strictly greater than shared_payment_end_date, so the last day of the window is still open."
            - "${aps_late} == [\"${ap_id}\"] at clock 2028-01-01T00:00:00Z and GET /alternate-payee-accounts/${ap_id} then reports status \"CLOSED\" with version incremented — a SHARED_PAYMENT account is closed by the sweep, never by exhaustion."

      - name: qualification_cascade_touches_six_levels_downstream
        claim_type: side_effect_execution
        grounds:
          - endpoints[POST /draft-orders/{id}/qualify]
          - state_machines.DraftOrder.status
          - state_machines.QdroCase.segregation_status
          - calculations.earnings_adjustment
        distinguishing_aspect: |
          Qualification is the widest side-effect list in the scaffold: one call must apply all six levels
          — draft to QUALIFIED, case review to QUALIFIED, hold to CONVERTED with the earnings adjustment
          folded in, payee account established, the participant's money sources debited and re-derived,
          case segregation status advanced with two communications appended — and every level must be
          observable, not just the first.
        excluded_because:
          difficulty_instance: qualification_six_level_segregation_to_payee_cascade
          rationale: |
            The SEPARATE_INTEREST qualification cascade (L1 draft -> L2 case review -> L3 hold conversion
            with earnings -> L4 payee account establishment -> L5 money-source debits and account
            re-derivation -> L6 case segregation status plus the two determination communications) is
            asserted level by level, with every intermediate money figure pinned, by the §1.8
            transitive_cascade instance. Repeating it here would duplicate the same chain.

      - name: segregation_lapse_denies_the_live_draft_downstream
        claim_type: cascade_down
        grounds:
          - endpoints[POST /_ops/run-segregation-sweep]
          - state_machines.SegregationHold.status
          - state_machines.DraftOrder.status
          - state_machines.DeficiencyNotice.status
        distinguishing_aspect: |
          The lapse cascade runs downward from a hold nobody touched: the sweep expires the hold, restores
          the account, lapses the case, denies the live draft with denial_reason SEGREGATION_LAPSED and
          expires its outstanding notices — so a draft order changes state without anyone calling an
          endpoint on it.
        excluded_because:
          difficulty_instance: segregation_lapse_sweep_five_level_denial_cascade
          rationale: |
            Sweep phase 1's downward cascade (hold EXPIRED -> account balances restored -> case LAPSED ->
            live draft DENIED with SEGREGATION_LAPSED -> case DENIED plus lapse communications) is
            asserted end to end, including the untouched neighbour case, by the §1.8 transitive_cascade
            instance.

      - name: hold_state_changes_keep_the_account_ledger_in_step
        claim_type: ledger_sync
        grounds:
          - state_machines.SegregationHold.status
          - calculations.plan_account_derived_balances
          - endpoints[POST /segregation-holds/{id}/release]
        distinguishing_aspect: |
          Every hold status change must be mirrored in the ancestor plan account's held_amount_cents and
          available_balance_cents in the same request — placement, supersede re-sizing, conversion,
          release and expiry each move the ledger in a different direction, and only conversion also
          reduces vested_balance_cents.
        excluded_because:
          difficulty_instance: custody_conservation_across_supersede_conversion_and_release
          rationale: |
            The reconciliation of PlanAccount.held_amount_cents / available_balance_cents against every
            SegregationHold status change — placement, supersede-driven re-sizing, conversion and release —
            is asserted as a conservation identity by the §1.8 compensating_invariant instance.

      - name: voiding_a_distribution_reverses_every_original_side_effect
        claim_type: compensation
        grounds:
          - state_machines.Distribution.status
          - endpoints[POST /distributions/{id}/void]
          - calculations.ap_account_derived_totals
          - calculations.tax_report_net_position
        distinguishing_aspect: |
          A void is a compensation rather than a new payment: the funding side must be credited back to
          the exact cent, the payee account's totals must be re-derived from the ISSUED set only, and the
          tax ledger must gain a negated line rather than losing the original — so replaying the same
          distribution afterwards must produce identical figures with no drift.
        excluded_because:
          difficulty_instance: distribution_void_three_level_compensating_cascade
          rationale: |
            The void's L1..L4 compensation (status VOIDED, funding side restored, negated corrective tax
            line appended, payee-account version incremented) and the drift-free replay afterwards are
            asserted by the §1.8 transitive_cascade instance.

      - name: review_and_segregation_dimensions_advance_independently
        claim_type: parallel_dimensions
        grounds:
          - state_machines.QdroCase.review_status
          - state_machines.QdroCase.segregation_status
        distinguishing_aspect: |
          One entity carries two independent state dimensions: review_status is driven by the review
          actions while segregation_status is driven by the hold's lifecycle, so the pair advances on
          different triggers and several combinations (QUALIFIED with NONE, INTAKE with CONVERTED) must be
          unreachable.
        excluded_because:
          difficulty_instance: qdro_case_parallel_review_and_segregation_dimensions
          rationale: |
            The parallel state_machine_shape claim — that QdroCase.review_status and
            QdroCase.segregation_status move on independent triggers and that illegal combinations are
            unreachable — is the entire subject of the §1.8 non_linear_state_machine instance.

      - name: draft_order_revision_cycle_loops_without_forgetting
        claim_type: cyclic_shape
        grounds:
          - state_machines.DraftOrder.status
          - state_machines.DeficiencyNotice.status
          - endpoints[POST /draft-orders/{id}/resubmit]
        distinguishing_aspect: |
          The cyclic shape means the same state is re-entered with more history each time: UNDER_REVIEW ->
          DEFICIENT -> UNDER_REVIEW must increment revision_number, cure exactly the notice that caused
          the cycle, and retain reviewed_by_user_id, so the loop is not a reset.
        excluded_because:
          difficulty_instance: draft_order_deficiency_revision_cycle_preserves_review_memory
          rationale: |
            The UNDER_REVIEW -> DEFICIENT -> UNDER_REVIEW cycle, its revision_number accounting, the
            per-notice CURED/EXPIRED bookkeeping and the persistence of reviewed_by_user_id across the loop
            are asserted by the §1.8 non_linear_state_machine instance.

      - name: hold_release_is_guarded_by_the_cases_review_status
        claim_type: guarded_transition
        grounds:
          - state_machines.SegregationHold.status
          - endpoints[POST /segregation-holds/{id}/release]
          - errors.ERR_CASE_NOT_DENIED
        distinguishing_aspect: |
          The HELD -> RELEASED edge is guarded by a state that lives on a different entity: the release is
          legal only once the owning case's review_status is DENIED, so the guard must be re-evaluated per
          request against the case rather than inferred from the hold alone.
        excluded_because:
          difficulty_instance: hold_release_blocked_until_case_review_status_denied
          rationale: |
            The guarded SegregationHold HELD -> RELEASED transition (permitted only while the owning
            QdroCase.review_status == DENIED, else ERR_CASE_NOT_DENIED) is asserted across every
            non-DENIED review state by the §1.8 cross_entity_state_dependency instance.

  - section: calculations
    instances:
      - name: non_assignable_sources_and_non_held_holds_are_excluded_from_their_input_sets
        claim_type: input_set_filtering
        grounds:
          - calculations.assignable_base.input_set
          - calculations.plan_account_derived_balances.input_set
          - calculations.per_source_allocation.input_set
          - calculations.ap_after_tax_basis_carryover
          - calculations.gross_assigned_amount
        distinguishing_aspect: |
          Two different filters run over the same account. The assignable base counts only
          is_assignable == true rows, so a LOAN_RECEIVABLE balance inflates vested_balance_cents but must
          NOT enlarge the assignment — sizing the hold off vested instead of assignable is the classic
          error and it is worth 120000 cents here. Separately, held_amount_cents counts only holds in
          status HELD, so the moment a hold CONVERTS it must drop out of that sum even though the row
          still exists. The allocation vector inherits the first filter and is ordered by source_code
          ASCII ascending, which decides which source absorbs the remainder and how much after-tax basis
          travels to the payee.
        test_recipe:
          setup:
            - "A PUBLISHED plan (PERIOD_END, 5000 bps ceiling), clock 2026-09-01."
            - "One participant (benefit_commenced false) with one account holding AFTER_TAX 200000 / basis 50000 (assignable), PRE_TAX_DEFERRAL 500000 / basis 0 (assignable) and LOAN_RECEIVABLE 300000 / basis 0 (NOT assignable)."
            - "A snapshot on 2026-06-30 of 1000000 and no later snapshot, so the conversion credits zero earnings."
          setup_api_calls:
            - call: "POST /plans"
              payload: { plan_name: "Filter Plan", plan_type: "DEFINED_CONTRIBUTION", model_language_version: "MLA-2026.1", acceptable_formula_codes: ["PERCENTAGE_OF_ACCOUNT"], allowed_approaches: ["SEPARATE_INTEREST"], earnings_adjustment_method: "PERIOD_END" }
              as: PlanAdministrator
              captures: { plan_id: $.data.id }
            - call: "POST /plans/${plan_id}/procedure-status"
              payload: { to_status: "PUBLISHED" }
              as: PlanAdministrator
            - call: "POST /participants"
              payload: { plan_id: "${plan_id}", full_name: "Loan Holder", ssn_last4: "5050", date_of_birth: "1972-05-05", participation_start_date: "2004-01-01" }
              as: PlanAdministrator
              captures: { part_id: $.data.id }
            - call: "POST /participants/${part_id}/plan-accounts"
              payload: {}
              as: PlanAdministrator
              captures: { acct_id: $.data.id }
            - call: "POST /plan-accounts/${acct_id}/money-sources"
              payload: { source_code: "AFTER_TAX", balance_cents: 200000, basis_cents: 50000, is_assignable: true }
              as: PlanAdministrator
            - call: "POST /plan-accounts/${acct_id}/money-sources"
              payload: { source_code: "PRE_TAX_DEFERRAL", balance_cents: 500000, basis_cents: 0, is_assignable: true }
              as: PlanAdministrator
            - call: "POST /plan-accounts/${acct_id}/money-sources"
              payload: { source_code: "LOAN_RECEIVABLE", balance_cents: 300000, basis_cents: 0, is_assignable: false }
              as: PlanAdministrator
            - call: "POST /plan-accounts/${acct_id}/valuation-snapshots"
              payload: { as_of_date: "2026-06-30", balance_cents: 1000000, source: "TRUSTEE_STATEMENT" }
              as: PlanAdministrator
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlanAdministrator
            - call: "POST /qdro-cases"
              payload: { participant_id: "${part_id}", alternate_payee_name: "Filter Payee", valuation_date: "2026-06-30", marital_period_start: "2012-03-01", marital_period_end: "2026-02-01", alternate_payee_dob: "1974-04-04", alternate_payee_address_on_file: true }
              as: QdroAnalyst
              captures: { case_id: $.data.id, case_v: $.data.version }
          trigger:
            - call: "GET /plan-accounts/${acct_id}"
              payload: {}
              as: PlanAdministrator
              captures: { vested0: $.data.vested_balance_cents, base0: $.data.assignable_base_cents, basis0: $.data.after_tax_basis_cents, held0: $.data.held_amount_cents }
            - call: "POST /draft-orders"
              payload: { qdro_case_id: "${case_id}", expected_case_version: "${case_v}", document_reference: "DRO-2663-FILT", uses_model_language: true, proposed_approach: "SEPARATE_INTEREST", proposed_formula_code: "PERCENTAGE_OF_ACCOUNT", proposed_percentage_bps: 4000 }
              as: QdroAnalyst
              captures: { draft_id: $.data.id }
            - call: "GET /segregation-holds"
              payload: { qdro_case_id: "${case_id}" }
              as: PlanAdministrator
              captures: { hold_id: "$.data[0].id", hold_amt: "$.data[0].hold_amount_cents" }
            - call: "GET /plan-accounts/${acct_id}"
              payload: {}
              as: PlanAdministrator
              captures: { held1: $.data.held_amount_cents, avail1: $.data.available_balance_cents }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-15T00:00:00Z" }
              as: PlanAdministrator
            - call: "POST /draft-orders/${draft_id}/qualify"
              payload: {}
              as: PlanAdministrator
              as_user_id: "admin-3"
            - call: "GET /qdro-cases/${case_id}/alternate-payee-accounts"
              payload: {}
              as: PlanAdministrator
              captures: { ap_bal: "$.data[0].balance_cents", ap_basis: "$.data[0].after_tax_basis_cents" }
            - call: "GET /plan-accounts/${acct_id}"
              payload: {}
              as: PlanAdministrator
              captures: { vested2: $.data.vested_balance_cents, base2: $.data.assignable_base_cents, basis2: $.data.after_tax_basis_cents, held2: $.data.held_amount_cents, avail2: $.data.available_balance_cents }
            - call: "GET /plan-accounts/${acct_id}/money-sources"
              payload: {}
              as: PlanAdministrator
              captures: { ms_first_code: "$.data[0].source_code", ms_first_bal: "$.data[0].balance_cents" }
          assert:
            - "${vested0} == 1000000 but ${base0} == 700000 and ${basis0} == 50000 — the LOAN_RECEIVABLE row is counted in vested and excluded from both assignable aggregates; ${held0} == 0."
            - "${hold_amt} == 280000 (4000 bps of the 700000 assignable base), NOT 400000 — an implementation that sizes the hold off vested_balance_cents fails by exactly 120000 cents."
            - "${held1} == 280000 and ${avail1} == 720000 — available_balance_cents is vested minus HELD holds, so the loan balance is still available to the participant."
            - "${ap_bal} == 280000 and ${ap_basis} == 20000 — the allocation vector is [AFTER_TAX 80000, PRE_TAX_DEFERRAL 200000] in source_code ASCII order (the last source absorbs the remainder), and the basis carryover is floor(50000 * 80000 / 200000) == 20000; the loan source contributes nothing to either figure."
            - "${vested2} == 720000, ${base2} == 420000, ${basis2} == 30000 — each assignable source was debited its allocation and its pro-rata basis, and 20000 + 30000 == 50000 conserves the account's original basis exactly."
            - "${held2} == 0 and ${avail2} == 720000 — the hold row still exists but is CONVERTED, so it contributes 0 to held_amount_cents; GET /segregation-holds/${hold_id} confirms status \"CONVERTED\" rather than a deleted row."
            - "${ms_first_code} == \"AFTER_TAX\" and ${ms_first_bal} == 120000 — the money sources list is ordered by source_code and the first assignable source shows the 80000 debit."
            - "GET /segregation-holds with plan_account_id=${acct_id} and status=HELD returns 0 rows, while the unfiltered listing returns 1 row — the state filter is real."

      - name: coverture_fraction_uses_half_open_day_counts_and_caps_at_one_hundred_percent
        claim_type: chronological
        grounds:
          - calculations.marital_coverture_fraction
          - calculations.gross_assigned_amount
          - errors.ERR_ASSIGNED_AMOUNT_ZERO
          - validations[priority=65]
        distinguishing_aspect: |
          The coverture fraction is a ratio of two whole-day counts, both half-open: marital days from
          marital_period_start up to but excluding marital_period_end, and participation days from the
          participant's participation_start_date up to but excluding the case's valuation_date. With
          2012-03-01 -> 2026-02-01 over 2004-01-01 -> 2026-06-30 the counts are 5085 and 8216, giving
          round_half_up(10000 * 5085 / 8216) == 6189 bps; counting either endpoint inclusively yields 6190
          or 6188 and fails. The ratio is then clamped to 10000 bps (a marriage longer than the
          participation period cannot assign more than the whole account) and a zero-length participation
          period yields 0 bps, which collapses the assignment to zero cents and is refused outright rather
          than creating a worthless hold.
        test_recipe:
          setup:
            - "A PUBLISHED plan accepting COVERTURE_FRACTION with the default 5000 bps ceiling, clock 2026-09-01."
            - "Three participants, each with one account holding a single assignable PRE_TAX_DEFERRAL source of 1000000: NORMAL joined 2004-01-01, LATE joined 2020-01-01, SAME joined 2026-06-30 (the valuation date itself)."
            - "All three cases share the marital period 2012-03-01 -> 2026-02-01 and the valuation date 2026-06-30."
          setup_api_calls:
            - call: "POST /plans"
              payload: { plan_name: "Coverture Plan", plan_type: "DEFINED_CONTRIBUTION", model_language_version: "MLA-2026.1", acceptable_formula_codes: ["COVERTURE_FRACTION", "PERCENTAGE_OF_ACCOUNT"], allowed_approaches: ["SEPARATE_INTEREST"], earnings_adjustment_method: "PERIOD_END" }
              as: PlanAdministrator
              captures: { plan_id: $.data.id }
            - call: "POST /plans/${plan_id}/procedure-status"
              payload: { to_status: "PUBLISHED" }
              as: PlanAdministrator
            - call: "POST /participants"
              payload: { plan_id: "${plan_id}", full_name: "Normal Tenure", ssn_last4: "6060", date_of_birth: "1970-06-06", participation_start_date: "2004-01-01" }
              as: PlanAdministrator
              captures: { pN: $.data.id }
            - call: "POST /participants/${pN}/plan-accounts"
              payload: {}
              as: PlanAdministrator
              captures: { aN: $.data.id }
            - call: "POST /plan-accounts/${aN}/money-sources"
              payload: { source_code: "PRE_TAX_DEFERRAL", balance_cents: 1000000 }
              as: PlanAdministrator
            - call: "POST /participants"
              payload: { plan_id: "${plan_id}", full_name: "Late Tenure", ssn_last4: "7070", date_of_birth: "1970-07-07", participation_start_date: "2020-01-01" }
              as: PlanAdministrator
              captures: { pL: $.data.id }
            - call: "POST /participants/${pL}/plan-accounts"
              payload: {}
              as: PlanAdministrator
              captures: { aL: $.data.id }
            - call: "POST /plan-accounts/${aL}/money-sources"
              payload: { source_code: "PRE_TAX_DEFERRAL", balance_cents: 1000000 }
              as: PlanAdministrator
            - call: "POST /participants"
              payload: { plan_id: "${plan_id}", full_name: "Same Day Tenure", ssn_last4: "8080", date_of_birth: "1970-08-08", participation_start_date: "2026-06-30" }
              as: PlanAdministrator
              captures: { pS: $.data.id }
            - call: "POST /participants/${pS}/plan-accounts"
              payload: {}
              as: PlanAdministrator
              captures: { aS: $.data.id }
            - call: "POST /plan-accounts/${aS}/money-sources"
              payload: { source_code: "PRE_TAX_DEFERRAL", balance_cents: 1000000 }
              as: PlanAdministrator
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlanAdministrator
            - call: "POST /qdro-cases"
              payload: { participant_id: "${pN}", alternate_payee_name: "Normal Payee", valuation_date: "2026-06-30", marital_period_start: "2012-03-01", marital_period_end: "2026-02-01", alternate_payee_dob: "1972-02-02", alternate_payee_address_on_file: true }
              as: QdroAnalyst
              captures: { caseN: $.data.id, caseN_v: $.data.version }
            - call: "POST /qdro-cases"
              payload: { participant_id: "${pL}", alternate_payee_name: "Late Payee", valuation_date: "2026-06-30", marital_period_start: "2012-03-01", marital_period_end: "2026-02-01", alternate_payee_dob: "1972-02-02", alternate_payee_address_on_file: true }
              as: QdroAnalyst
              captures: { caseL: $.data.id, caseL_v: $.data.version }
            - call: "POST /qdro-cases"
              payload: { participant_id: "${pS}", alternate_payee_name: "Same Day Payee", valuation_date: "2026-06-30", marital_period_start: "2012-03-01", marital_period_end: "2026-02-01", alternate_payee_dob: "1972-02-02", alternate_payee_address_on_file: true }
              as: QdroAnalyst
              captures: { caseS: $.data.id, caseS_v: $.data.version }
          trigger:
            - call: "POST /draft-orders"
              payload: { qdro_case_id: "${caseN}", expected_case_version: "${caseN_v}", document_reference: "DRO-2663-COVN", uses_model_language: true, proposed_approach: "SEPARATE_INTEREST", proposed_formula_code: "COVERTURE_FRACTION", proposed_percentage_bps: 5000 }
              as: QdroAnalyst
              captures: { draftN: $.data.id }
            - call: "GET /segregation-holds"
              payload: { qdro_case_id: "${caseN}" }
              as: PlanAdministrator
              captures: { holdN: "$.data[0].hold_amount_cents" }
            - call: "GET /qdro-cases/${caseN}/benefit-projection"
              payload: {}
              as: QdroAnalyst
              captures: { projN: $.data.gross_assigned_amount_cents, baseN: $.data.assignable_base_cents }
            - call: "POST /draft-orders"
              payload: { qdro_case_id: "${caseL}", expected_case_version: "${caseL_v}", document_reference: "DRO-2663-COVL", uses_model_language: true, proposed_approach: "SEPARATE_INTEREST", proposed_formula_code: "COVERTURE_FRACTION", proposed_percentage_bps: 4000 }
              as: QdroAnalyst
              captures: { draftL: $.data.id }
            - call: "GET /segregation-holds"
              payload: { qdro_case_id: "${caseL}" }
              as: PlanAdministrator
              captures: { holdL: "$.data[0].hold_amount_cents" }
            - call: "POST /draft-orders"
              payload: { qdro_case_id: "${caseS}", expected_case_version: "${caseS_v}", document_reference: "DRO-2663-COVS", uses_model_language: true, proposed_approach: "SEPARATE_INTEREST", proposed_formula_code: "COVERTURE_FRACTION", proposed_percentage_bps: 5000 }
              as: QdroAnalyst
              captures: { e_zero: $.data.error_id }
          assert:
            - "${holdN} == 309400 and ${projN} == 309400 with ${baseN} == 1000000 — coverture_bps is 6189 (round_half_up of 10000 * 5085 / 8216), effective_bps is floor(6189 * 5000 / 10000) == 3094, and the amount is floor(1000000 * 3094 / 10000). An inclusive day count on either endpoint gives 6190 or 6188 bps and a different amount."
            - "${holdL} == 400000 — the LATE participant's raw ratio is 10000 * 5085 / 2372 == 21437 bps, clamped to 10000, so effective_bps is floor(10000 * 4000 / 10000) == 4000 and the amount is 400000 rather than 857480; without the clamp the order would also breach the 5000 bps plan ceiling."
            - "${e_zero} == \"ERR_ASSIGNED_AMOUNT_ZERO\" with HTTP 422 — participation_days is 0 (participation_start_date equals the valuation date), so coverture_bps is 0 by the guard rather than a division error, the assignment collapses to 0 cents, and the receipt is refused instead of creating a zero-value hold."
            - "GET /qdro-cases/${caseS} still reports review_status \"INTAKE\" and segregation_status \"NONE\", and GET /segregation-holds with plan_account_id=${aS} returns 0 rows — nothing was persisted for the refused receipt."
            - "GET /plan-accounts/${aN} reports held_amount_cents 309400 and GET /plan-accounts/${aL} reports 400000 — each participant's own tenure drives its own hold, and creating the cases in a different order cannot change either figure because both are pure functions of the stored dates."

      - name: benefit_projection_prices_the_road_not_taken_without_mutating_anything
        claim_type: forward_looking
        grounds:
          - calculations.benefit_assignment_projection
          - endpoints[GET /qdro-cases/{id}/benefit-projection]
          - calculations.earnings_growth_bps
          - calculations.per_source_allocation
        distinguishing_aspect: |
          The projection is a pure read that re-evaluates from current pending state on every call: it must
          reflect a money source added AFTER the draft was received (so the projected assignment and the
          already-placed hold legitimately disagree), and it must honour the optional `approach` override
          even when that approach could never be qualified for this participant — pricing the road not
          taken is the whole point. It also must not write: no version moves, no hold is re-sized, no
          communication is appended.
        test_recipe:
          setup:
            - "A PUBLISHED plan allowing both approaches, PERIOD_END, 5000 bps ceiling."
            - "A participant with benefit_commenced true and monthly_payment_cents 320000, one assignable PRE_TAX_DEFERRAL source of 1000000 (basis 0), snapshots on 2026-06-30 of 1000000 and on 2026-09-30 of 1100000."
            - "A case valued 2026-06-30 receives a 4000 bps SHARED_PAYMENT draft at clock 2026-09-01; the clock then moves to 2026-09-15 so the projection's segregation date is 2026-09-15."
          setup_api_calls:
            - call: "POST /plans"
              payload: { plan_name: "Projection Plan", plan_type: "DEFINED_CONTRIBUTION", model_language_version: "MLA-2026.1", acceptable_formula_codes: ["PERCENTAGE_OF_ACCOUNT"], allowed_approaches: ["SEPARATE_INTEREST", "SHARED_PAYMENT"], earnings_adjustment_method: "PERIOD_END" }
              as: PlanAdministrator
              captures: { plan_id: $.data.id }
            - call: "POST /plans/${plan_id}/procedure-status"
              payload: { to_status: "PUBLISHED" }
              as: PlanAdministrator
            - call: "POST /participants"
              payload: { plan_id: "${plan_id}", full_name: "Projected Participant", ssn_last4: "9191", date_of_birth: "1959-09-09", participation_start_date: "1995-01-01", benefit_commenced: true }
              as: PlanAdministrator
              captures: { part_id: $.data.id }
            - call: "POST /participants/${part_id}/plan-accounts"
              payload: { monthly_payment_cents: 320000 }
              as: PlanAdministrator
              captures: { acct_id: $.data.id }
            - call: "POST /plan-accounts/${acct_id}/money-sources"
              payload: { source_code: "PRE_TAX_DEFERRAL", balance_cents: 1000000, basis_cents: 0 }
              as: PlanAdministrator
            - call: "POST /plan-accounts/${acct_id}/valuation-snapshots"
              payload: { as_of_date: "2026-06-30", balance_cents: 1000000, source: "TRUSTEE_STATEMENT" }
              as: PlanAdministrator
            - call: "POST /plan-accounts/${acct_id}/valuation-snapshots"
              payload: { as_of_date: "2026-09-30", balance_cents: 1100000, source: "TRUSTEE_STATEMENT" }
              as: PlanAdministrator
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlanAdministrator
            - call: "POST /qdro-cases"
              payload: { participant_id: "${part_id}", alternate_payee_name: "Projected Payee", valuation_date: "2026-06-30", marital_period_start: "2012-03-01", marital_period_end: "2026-02-01", alternate_payee_dob: "1961-01-01", alternate_payee_address_on_file: true }
              as: QdroAnalyst
              captures: { case_id: $.data.id, case_v: $.data.version }
            - call: "POST /draft-orders"
              payload: { qdro_case_id: "${case_id}", expected_case_version: "${case_v}", document_reference: "DRO-2663-PROJ", uses_model_language: true, proposed_approach: "SHARED_PAYMENT", proposed_formula_code: "PERCENTAGE_OF_ACCOUNT", proposed_percentage_bps: 4000, proposed_shared_payment_end_date: "2027-12-31" }
              as: QdroAnalyst
              captures: { draft_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-15T00:00:00Z" }
              as: PlanAdministrator
          trigger:
            - call: "GET /qdro-cases/${case_id}/benefit-projection"
              payload: {}
              as: QdroAnalyst
              captures: { eff0: $.data.effective_approach }
            - call: "GET /qdro-cases/${case_id}/benefit-projection"
              payload: {}
              as: PlanAdministrator
              captures: { eff1: $.data.effective_approach, per1: $.data.shared_payment_per_period_cents, bal1: $.data.separate_interest_balance_cents, growth1: $.data.earnings_growth_bps, earn1: $.data.earnings_adjustment_cents, snaps1: $.data.valuation_snapshot_count }
            - call: "GET /qdro-cases/${case_id}/benefit-projection"
              payload: { approach: "SEPARATE_INTEREST" }
              as: PlanAdministrator
              captures: { eff2: $.data.effective_approach, per2: $.data.shared_payment_per_period_cents, bal2: $.data.separate_interest_balance_cents, growth2: $.data.earnings_growth_bps, earn2: $.data.earnings_adjustment_cents, gross2: $.data.gross_assigned_amount_cents, carry2: $.data.after_tax_basis_carryover_cents }
            - call: "POST /plan-accounts/${acct_id}/money-sources"
              payload: { source_code: "EMPLOYER_MATCH", balance_cents: 500000, basis_cents: 0, is_assignable: true }
              as: PlanAdministrator
            - call: "GET /qdro-cases/${case_id}/benefit-projection"
              payload: { approach: "SEPARATE_INTEREST" }
              as: PlanAdministrator
              captures: { base3: $.data.assignable_base_cents, gross3: $.data.gross_assigned_amount_cents, earn3: $.data.earnings_adjustment_cents, bal3: $.data.separate_interest_balance_cents }
            - call: "GET /qdro-cases/${case_id}/benefit-projection"
              payload: { approach: "SHARED_PAYMENT" }
              as: PlanAdministrator
              captures: { per3: $.data.shared_payment_per_period_cents, bal3s: $.data.separate_interest_balance_cents }
            - call: "GET /qdro-cases/${case_id}"
              payload: {}
              as: PlanAdministrator
              captures: { case_v_after: $.data.version, review_after: $.data.review_status }
          assert:
            - "${eff0} == \"SHARED_PAYMENT\" — the analyst may read the projection (as may the administrator, the participant and an authorized attorney), and with no override it uses the case's own operative approach."
            - "${eff1} == \"SHARED_PAYMENT\" with ${per1} == 128000 (floor of 320000 * 4000 / 10000), ${bal1} == 0, ${growth1} == 0 and ${earn1} == 0 — the shared-payment variant credits no interval earnings even though two snapshots exist; ${snaps1} == 2."
            - "${eff2} == \"SEPARATE_INTEREST\" with ${per2} == 0, ${gross2} == 400000, ${growth2} == 1000 bps (round_half_up of 10000 * (1100000 - 1000000) / 1000000, the earliest snapshot on or after the 2026-09-15 segregation date), ${earn2} == 40000, ${bal2} == 440000 and ${carry2} == 0 — the override prices an approach this participant could never qualify for, since benefit_commenced is true."
            - "${base3} == 1500000, ${gross3} == 600000 (4000 bps of the new base, still under the 750000 percentage ceiling), ${earn3} == 60000 (per-source round_half_up over the allocation vector [EMPLOYER_MATCH 200000, PRE_TAX_DEFERRAL 400000]) and ${bal3} == 660000 — the projection re-evaluates from current state rather than from a snapshot taken at receipt."
            - "${per3} == 128000 and ${bal3s} == 0 — the shared-payment projection is keyed on monthly_payment_cents, so adding 500000 of new principal does not move it at all: the same fixture answers 660000 or 128000 depending only on the override."
            - "GET /segregation-holds with qdro_case_id=${case_id} still reports hold_amount_cents 400000 — the hold was sized at receipt from the then-current 1000000 base and is NOT re-sized by a projection, so the projected 600000 and the held 400000 legitimately differ until a resubmission."
            - "${case_v_after} == ${case_v} + 1 (the single increment from the draft receipt) and ${review_after} == \"UNDER_REVIEW\" — none of the five projection reads moved a version or a state, and GET /qdro-cases/${case_id}/communications returns exactly 1 row (the receipt acknowledgment)."

      - name: deficiency_codes_propagate_to_a_deterministic_sorted_set
        claim_type: constraint_propagation
        grounds:
          - calculations.deficiency_evaluation
          - entities.DraftOrder.fields.deficiency_codes
          - entities.Plan.fields.permits_benefit_not_otherwise_available
        distinguishing_aspect: |
          The evaluator is a set-then-sort pipeline over eight independent predicates, and three of its
          properties are easy to get wrong: SURVIVOR_ANNUITY_FOR_AP and REQUIRES_QJSA_FOR_AP_SPOUSE
          collapse into the SINGLE code PROHIBITED_FORM_NOT_OFFERED (a draft carrying both yields one code,
          not two), LUMP_SUM_ELECTION is explicitly benign on a defined-contribution plan and must
          contribute nothing, and MARITAL_PERIOD_UNDEFINED is conditional on the formula — the same case
          with an undefined marital end is clean under PERCENTAGE_OF_ACCOUNT and deficient under
          COVERTURE_FRACTION. The output is ASCII-ascending, so the array order is itself part of the contract.
        test_recipe:
          setup:
            - "A PUBLISHED plan requiring model language, accepting [PERCENTAGE_OF_ACCOUNT, COVERTURE_FRACTION] only, with permits_benefit_not_otherwise_available false, clock 2026-09-01."
            - "Three participants each with one account holding an assignable PRE_TAX_DEFERRAL source of 1000000."
