scaffold_difficulty_design:

  # ===========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: credit_tally_provisional_vs_final_on_renewal_cycle
        grounds:
          - calculations.credit_tally
          - entities.RenewalCycle.fields.provisional_earned_hours
          - entities.RenewalCycle.fields.final_earned_hours
          - state_machines.Completion.PENDING_VERIFICATION_to_VERIFIED
        distinguishing_aspect: |
          On RenewalCycle, provisional_earned_hours counts PENDING_VERIFICATION+VERIFIED
          while final_earned_hours counts VERIFIED only; with one VERIFIED (30.0) and one
          PENDING (6.0) completion the two figures diverge (36.0 vs 30.0) on the cycle entity.
        test_recipe:
          setup:
            - "Board CA (total 30.0, ETHICS min 4.0, SUBSTANCE min 2.0, cycle_length 24mo)."
            - "Provider P accredited until 2030; GENERAL course G=30.0h, ETHICS course E=6.0h."
            - "Licensee L with an OPEN cycle; one GENERAL completion VERIFIED (30.0h) and one ETHICS completion PENDING (6.0h)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: BoardAdmin
            - call: "POST /license-boards"
              payload: { name: "CA Board", jurisdiction_code: "CA", credit_unit: "CLE", cycle_length_months: 24, total_required_hours: 30.0, carryover_cap_hours: 10.0, reminder_lead_days: 60, audit_cooldown_days: 365 }
              as: BoardAdmin
              captures: { board_id: $.data.id }
            - call: "POST /license-boards/${board_id}/requirements"
              payload: { category: "ETHICS", min_hours: 4.0 }
              as: BoardAdmin
            - call: "POST /license-boards/${board_id}/requirements"
              payload: { category: "SUBSTANCE", min_hours: 2.0 }
              as: BoardAdmin
            - call: "POST /providers"
              payload: { name: "Provider P", board_id: "${board_id}" }
              as: BoardAdmin
              captures: { provider_id: $.data.id }
            - call: "POST /providers/${provider_id}/accredit"
              payload: { accredited_until: "2030-01-01T00:00:00Z" }
              as: BoardAdmin
            - call: "POST /courses"
              payload: { provider_id: "${provider_id}", title: "G30", category: "GENERAL", credit_hours: 30.0 }
              as: BoardAdmin
              captures: { course_g_id: $.data.id }
            - call: "POST /courses"
              payload: { provider_id: "${provider_id}", title: "E6", category: "ETHICS", credit_hours: 6.0 }
              as: BoardAdmin
              captures: { course_e_id: $.data.id }
            - call: "POST /licensees"
              payload: { full_name: "L One", home_board_id: "${board_id}", license_number: "L-001" }
              as: BoardAdmin
              captures: { lic_id: $.data.id }
            - call: "POST /renewal-cycles"
              payload: { licensee_id: "${lic_id}", board_id: "${board_id}", cycle_start: "2026-01-01T00:00:00Z" }
              as: BoardAdmin
              captures: { cycle_id: $.data.id }
            - call: "POST /completions"
              payload: { licensee_id: "${lic_id}", course_id: "${course_g_id}", cycle_id: "${cycle_id}", completed_at: "2026-02-01T00:00:00Z" }
              as: Licensee
              as_user_id: "${lic_id}"
              captures: { comp_g_id: $.data.id }
            - call: "POST /completions/${comp_g_id}/verify"
              payload: {}
              as: BoardAdmin
            - call: "POST /completions"
              payload: { licensee_id: "${lic_id}", course_id: "${course_e_id}", cycle_id: "${cycle_id}", completed_at: "2026-02-01T00:00:00Z" }
              as: Licensee
              as_user_id: "${lic_id}"
              captures: { comp_e_id: $.data.id }
          trigger:
            - call: "GET /renewal-cycles/${cycle_id}"
              payload: {}
              as: BoardAdmin
              captures: { prov: $.data.provisional_earned_hours, fin: $.data.final_earned_hours }
          assert:
            - "RenewalCycle.${cycle_id}.provisional_earned_hours == 36.0"
            - "RenewalCycle.${cycle_id}.final_earned_hours == 30.0"
            - "RenewalCycle.${cycle_id}.status == OPEN"

      - name: audit_risk_score_intake_vs_review_final_on_licensee
        grounds:
          - calculations.audit_risk_score
          - entities.Licensee.fields.audit_risk_score
          - state_machines.Completion.PENDING_VERIFICATION_to_REJECTED
          - state_machines.Audit.ATTESTATION_PENDING_to_UNDER_REVIEW
        distinguishing_aspect: |
          On Licensee, the intake_estimate variant (recomputed at reject) counts the REJECTED
          completion (score 5) while the review_final variant (recomputed at attestation) excludes
          a rejection that was resubmitted-and-verified (score 0) — different entity domain than
          credit_tally and a genuinely different number on the same licensee.
        test_recipe:
          setup:
            - "Board CA, Provider P accredited, ETHICS course E=4.0h, SUBSTANCE course S=2.0h, GENERAL course G=24.0h."
            - "Licensee L; cycle OPEN. One ETHICS completion is rejected then resubmitted+verified; G and S verified so requirements MET; an audit reaches ATTESTATION_PENDING and the licensee attests."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: BoardAdmin
            - call: "POST /license-boards"
              payload: { name: "CA Board", jurisdiction_code: "CA", credit_unit: "CLE", cycle_length_months: 24, total_required_hours: 30.0, carryover_cap_hours: 10.0, reminder_lead_days: 60, audit_cooldown_days: 365 }
              as: BoardAdmin
              captures: { board_id: $.data.id }
            - call: "POST /license-boards/${board_id}/requirements"
              payload: { category: "ETHICS", min_hours: 4.0 }
              as: BoardAdmin
            - call: "POST /license-boards/${board_id}/requirements"
              payload: { category: "SUBSTANCE", min_hours: 2.0 }
              as: BoardAdmin
            - call: "POST /providers"
              payload: { name: "Provider P", board_id: "${board_id}" }
              as: BoardAdmin
              captures: { provider_id: $.data.id }
            - call: "POST /providers/${provider_id}/accredit"
              payload: { accredited_until: "2030-01-01T00:00:00Z" }
              as: BoardAdmin
            - call: "POST /courses"
              payload: { provider_id: "${provider_id}", title: "E4", category: "ETHICS", credit_hours: 4.0 }
              as: BoardAdmin
              captures: { course_e_id: $.data.id }
            - call: "POST /courses"
              payload: { provider_id: "${provider_id}", title: "S2", category: "SUBSTANCE", credit_hours: 2.0 }
              as: BoardAdmin
              captures: { course_s_id: $.data.id }
            - call: "POST /courses"
              payload: { provider_id: "${provider_id}", title: "G24", category: "GENERAL", credit_hours: 24.0 }
              as: BoardAdmin
              captures: { course_g_id: $.data.id }
            - call: "POST /licensees"
              payload: { full_name: "L Two", home_board_id: "${board_id}", license_number: "L-002" }
              as: BoardAdmin
              captures: { lic_id: $.data.id }
            - call: "POST /renewal-cycles"
              payload: { licensee_id: "${lic_id}", board_id: "${board_id}", cycle_start: "2026-01-01T00:00:00Z" }
              as: BoardAdmin
              captures: { cycle_id: $.data.id }
            - call: "POST /completions"
              payload: { licensee_id: "${lic_id}", course_id: "${course_e_id}", cycle_id: "${cycle_id}", completed_at: "2026-02-01T00:00:00Z" }
              as: Licensee
              as_user_id: "${lic_id}"
              captures: { comp_e_id: $.data.id }
            - call: "POST /completions/${comp_e_id}/reject"
              payload: { reason: "missing certificate" }
              as: BoardAdmin
            - call: "GET /licensees/${lic_id}"
              payload: {}
              as: BoardAdmin
              captures: { intake_score: $.data.audit_risk_score }
            - call: "POST /completions/${comp_e_id}/resubmit"
              payload: {}
              as: Licensee
              as_user_id: "${lic_id}"
            - call: "POST /completions/${comp_e_id}/verify"
              payload: {}
              as: BoardAdmin
            - call: "POST /completions"
              payload: { licensee_id: "${lic_id}", course_id: "${course_s_id}", cycle_id: "${cycle_id}", completed_at: "2026-02-01T00:00:00Z" }
              as: Licensee
              as_user_id: "${lic_id}"
              captures: { comp_s_id: $.data.id }
            - call: "POST /completions/${comp_s_id}/verify"
              payload: {}
              as: BoardAdmin
            - call: "POST /completions"
              payload: { licensee_id: "${lic_id}", course_id: "${course_g_id}", cycle_id: "${cycle_id}", completed_at: "2026-02-01T00:00:00Z" }
              as: Licensee
              as_user_id: "${lic_id}"
              captures: { comp_g_id: $.data.id }
            - call: "POST /completions/${comp_g_id}/verify"
              payload: {}
              as: BoardAdmin
            - call: "POST /audits"
              payload: { cycle_id: "${cycle_id}" }
              as: BoardAdmin
              as_user_id: "admin-initiator"
              captures: { audit_id: $.data.id }
            - call: "POST /audits/${audit_id}/request-attestation"
              payload: {}
              as: BoardAdmin
              as_user_id: "admin-initiator"
          trigger:
            - call: "POST /audits/${audit_id}/attestations"
              payload: { statement: "I attest these completions are accurate.", attested_hours: 30.0 }
              as: Licensee
              as_user_id: "${lic_id}"
            - call: "GET /licensees/${lic_id}"
              payload: {}
              as: BoardAdmin
              captures: { final_score: $.data.audit_risk_score }
          assert:
            - "Licensee.${lic_id}.audit_risk_score == 5 immediately after the reject (intake_estimate: one REJECTED -> W_REJECT*1)"
            - "Licensee.${lic_id}.audit_risk_score == 0 after attestation (review_final: rejection was resubmitted-and-verified, no late completions)"

  # ===========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: requirement_satisfaction_waterfall_mode_a_nonlinear
        grounds:
          - calculations.requirement_satisfaction
          - entities.CreditRequirement.fields.min_hours
          - entities.RenewalCycle.fields.final_earned_hours
        distinguishing_aspect: |
          Mode (a): the waterfall has >=3 inputs (per-category hours, category mins, total) with
          non-linear interaction — min()/max() per category plus overflow spilling into a derived
          general_pool; SUBSTANCE short by 1.0 keeps the cycle OPEN even though total hours (31.0)
          exceed total_required_hours (30.0).
        test_recipe:
          setup:
            - "Board CA (total 30.0, ETHICS min 4.0, SUBSTANCE min 2.0). Provider P accredited."
            - "VERIFIED hours: ETHICS 5.0, SUBSTANCE 1.0, GENERAL 25.0 (total 31.0). SUBSTANCE short by 1.0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: BoardAdmin
            - call: "POST /license-boards"
              payload: { name: "CA Board", jurisdiction_code: "CA", credit_unit: "CLE", cycle_length_months: 24, total_required_hours: 30.0, carryover_cap_hours: 10.0, reminder_lead_days: 60, audit_cooldown_days: 365 }
              as: BoardAdmin
              captures: { board_id: $.data.id }
            - call: "POST /license-boards/${board_id}/requirements"
              payload: { category: "ETHICS", min_hours: 4.0 }
              as: BoardAdmin
            - call: "POST /license-boards/${board_id}/requirements"
              payload: { category: "SUBSTANCE", min_hours: 2.0 }
              as: BoardAdmin
            - call: "POST /providers"
              payload: { name: "Provider P", board_id: "${board_id}" }
              as: BoardAdmin
              captures: { provider_id: $.data.id }
            - call: "POST /providers/${provider_id}/accredit"
              payload: { accredited_until: "2030-01-01T00:00:00Z" }
              as: BoardAdmin
            - call: "POST /courses"
              payload: { provider_id: "${provider_id}", title: "E5", category: "ETHICS", credit_hours: 5.0 }
              as: BoardAdmin
              captures: { course_e_id: $.data.id }
            - call: "POST /courses"
              payload: { provider_id: "${provider_id}", title: "S1", category: "SUBSTANCE", credit_hours: 1.0 }
              as: BoardAdmin
              captures: { course_s_id: $.data.id }
            - call: "POST /courses"
              payload: { provider_id: "${provider_id}", title: "G25", category: "GENERAL", credit_hours: 25.0 }
              as: BoardAdmin
              captures: { course_g_id: $.data.id }
            - call: "POST /licensees"
              payload: { full_name: "L Three", home_board_id: "${board_id}", license_number: "L-003" }
              as: BoardAdmin
              captures: { lic_id: $.data.id }
            - call: "POST /renewal-cycles"
              payload: { licensee_id: "${lic_id}", board_id: "${board_id}", cycle_start: "2026-01-01T00:00:00Z" }
              as: BoardAdmin
              captures: { cycle_id: $.data.id }
            - call: "POST /completions"
              payload: { licensee_id: "${lic_id}", course_id: "${course_e_id}", cycle_id: "${cycle_id}", completed_at: "2026-02-01T00:00:00Z" }
              as: Licensee
              as_user_id: "${lic_id}"
              captures: { comp_e_id: $.data.id }
            - call: "POST /completions/${comp_e_id}/verify"
              payload: {}
              as: BoardAdmin
            - call: "POST /completions"
              payload: { licensee_id: "${lic_id}", course_id: "${course_s_id}", cycle_id: "${cycle_id}", completed_at: "2026-02-01T00:00:00Z" }
              as: Licensee
              as_user_id: "${lic_id}"
              captures: { comp_s_id: $.data.id }
            - call: "POST /completions/${comp_s_id}/verify"
              payload: {}
              as: BoardAdmin
            - call: "POST /completions"
              payload: { licensee_id: "${lic_id}", course_id: "${course_g_id}", cycle_id: "${cycle_id}", completed_at: "2026-02-01T00:00:00Z" }
              as: Licensee
              as_user_id: "${lic_id}"
              captures: { comp_g_id: $.data.id }
          trigger:
            - call: "POST /completions/${comp_g_id}/verify"
              payload: {}
              as: BoardAdmin
            - call: "GET /renewal-cycles/${cycle_id}"
              payload: {}
              as: BoardAdmin
              captures: { st: $.data.status, fin: $.data.final_earned_hours }
          assert:
            - "RenewalCycle.${cycle_id}.final_earned_hours == 31.0"
            - "RenewalCycle.${cycle_id}.status == OPEN (SUBSTANCE deficit 1.0 keeps it unmet despite total 31.0 >= 30.0)"

      - name: carryover_round_per_category_then_sum_mode_b
        grounds:
          - calculations.carryover_computation
          - entities.RenewalCycle.fields.carryover_out_hours
          - state_machines.RenewalCycle.OPEN_to_REQUIREMENTS_MET
        distinguishing_aspect: |
          Mode (b): rounding order matters — per-category surpluses 1.04/5.04/0.04 round to 1.0/5.0/0.0
          and sum to 6.0 (round-per-category-then-sum), whereas sum-then-round would give round(6.12)=6.1.
          The scaffold pins round-each-category-then-sum-then-cap, so carryover_out_hours == 6.0.
        test_recipe:
          setup:
            - "Board CA (total 30.0, ETHICS min 4.0, SUBSTANCE min 2.0, carryover_cap 10.0)."
            - "VERIFIED hours give per-category surpluses ETHICS 1.04, GENERAL 5.04, SUBSTANCE 0.04:"
            - "ETHICS 5.04 (req 4.0), SUBSTANCE 2.04 (req 2.0), GENERAL 29.04 (general_required 24.0 -> surplus 5.04)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: BoardAdmin
            - call: "POST /license-boards"
              payload: { name: "CA Board", jurisdiction_code: "CA", credit_unit: "CLE", cycle_length_months: 24, total_required_hours: 30.0, carryover_cap_hours: 10.0, reminder_lead_days: 60, audit_cooldown_days: 365 }
              as: BoardAdmin
              captures: { board_id: $.data.id }
            - call: "POST /license-boards/${board_id}/requirements"
              payload: { category: "ETHICS", min_hours: 4.0 }
              as: BoardAdmin
            - call: "POST /license-boards/${board_id}/requirements"
              payload: { category: "SUBSTANCE", min_hours: 2.0 }
              as: BoardAdmin
            - call: "POST /providers"
              payload: { name: "Provider P", board_id: "${board_id}" }
              as: BoardAdmin
              captures: { provider_id: $.data.id }
            - call: "POST /providers/${provider_id}/accredit"
              payload: { accredited_until: "2030-01-01T00:00:00Z" }
              as: BoardAdmin
            - call: "POST /courses"
              payload: { provider_id: "${provider_id}", title: "E504", category: "ETHICS", credit_hours: 5.04 }
              as: BoardAdmin
              captures: { course_e_id: $.data.id }
            - call: "POST /courses"
              payload: { provider_id: "${provider_id}", title: "S204", category: "SUBSTANCE", credit_hours: 2.04 }
              as: BoardAdmin
              captures: { course_s_id: $.data.id }
            - call: "POST /courses"
              payload: { provider_id: "${provider_id}", title: "G2904", category: "GENERAL", credit_hours: 29.04 }
              as: BoardAdmin
              captures: { course_g_id: $.data.id }
            - call: "POST /licensees"
              payload: { full_name: "L Four", home_board_id: "${board_id}", license_number: "L-004" }
              as: BoardAdmin
              captures: { lic_id: $.data.id }
            - call: "POST /renewal-cycles"
              payload: { licensee_id: "${lic_id}", board_id: "${board_id}", cycle_start: "2026-01-01T00:00:00Z" }
              as: BoardAdmin
              captures: { cycle_id: $.data.id }
            - call: "POST /completions"
              payload: { licensee_id: "${lic_id}", course_id: "${course_e_id}", cycle_id: "${cycle_id}", completed_at: "2026-02-01T00:00:00Z" }
              as: Licensee
              as_user_id: "${lic_id}"
              captures: { comp_e_id: $.data.id }
            - call: "POST /completions/${comp_e_id}/verify"
              payload: {}
              as: BoardAdmin
            - call: "POST /completions"
              payload: { licensee_id: "${lic_id}", course_id: "${course_s_id}", cycle_id: "${cycle_id}", completed_at: "2026-02-01T00:00:00Z" }
              as: Licensee
              as_user_id: "${lic_id}"
              captures: { comp_s_id: $.data.id }
            - call: "POST /completions/${comp_s_id}/verify"
              payload: {}
              as: BoardAdmin
            - call: "POST /completions"
              payload: { licensee_id: "${lic_id}", course_id: "${course_g_id}", cycle_id: "${cycle_id}", completed_at: "2026-02-01T00:00:00Z" }
              as: Licensee
              as_user_id: "${lic_id}"
              captures: { comp_g_id: $.data.id }
          trigger:
            - call: "POST /completions/${comp_g_id}/verify"
              payload: {}
              as: BoardAdmin
            - call: "GET /renewal-cycles/${cycle_id}"
              payload: {}
              as: BoardAdmin
              captures: { co: $.data.carryover_out_hours, st: $.data.status }
          assert:
            - "RenewalCycle.${cycle_id}.status == REQUIREMENTS_MET"
            - "RenewalCycle.${cycle_id}.carryover_out_hours == 6.0 (per-category round 1.0+5.0+0.0; sum-then-round would be 6.1)"

  # ===========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: completion_reject_resubmit_verify_cycle
        grounds:
          - state_machines.Completion.PENDING_VERIFICATION_to_REJECTED
          - state_machines.Completion.REJECTED_to_PENDING_VERIFICATION
          - state_machines.Completion.PENDING_VERIFICATION_to_VERIFIED
        distinguishing_aspect: |
          Completion exhibits a true cycle PENDING_VERIFICATION -> REJECTED -> PENDING_VERIFICATION
          -> VERIFIED; the entity returns to a state it previously left, which a linear pipeline cannot.
        test_recipe:
          setup:
            - "Board CA, Provider P accredited, ETHICS course E=4.0h, Licensee L with OPEN cycle."
            - "One ETHICS completion submitted."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: BoardAdmin
            - call: "POST /license-boards"
              payload: { name: "CA Board", jurisdiction_code: "CA", credit_unit: "CLE", cycle_length_months: 24, total_required_hours: 30.0, carryover_cap_hours: 10.0, reminder_lead_days: 60, audit_cooldown_days: 365 }
              as: BoardAdmin
              captures: { board_id: $.data.id }
            - call: "POST /providers"
              payload: { name: "Provider P", board_id: "${board_id}" }
              as: BoardAdmin
              captures: { provider_id: $.data.id }
            - call: "POST /providers/${provider_id}/accredit"
              payload: { accredited_until: "2030-01-01T00:00:00Z" }
              as: BoardAdmin
            - call: "POST /courses"
              payload: { provider_id: "${provider_id}", title: "E4", category: "ETHICS", credit_hours: 4.0 }
              as: BoardAdmin
              captures: { course_e_id: $.data.id }
            - call: "POST /licensees"
              payload: { full_name: "L Five", home_board_id: "${board_id}", license_number: "L-005" }
              as: BoardAdmin
              captures: { lic_id: $.data.id }
            - call: "POST /renewal-cycles"
              payload: { licensee_id: "${lic_id}", board_id: "${board_id}", cycle_start: "2026-01-01T00:00:00Z" }
              as: BoardAdmin
              captures: { cycle_id: $.data.id }
            - call: "POST /completions"
              payload: { licensee_id: "${lic_id}", course_id: "${course_e_id}", cycle_id: "${cycle_id}", completed_at: "2026-02-01T00:00:00Z" }
              as: Licensee
              as_user_id: "${lic_id}"
              captures: { comp_id: $.data.id }
            - call: "POST /completions/${comp_id}/reject"
              payload: { reason: "bad scan" }
              as: BoardAdmin
            - call: "POST /completions/${comp_id}/resubmit"
              payload: {}
              as: Licensee
              as_user_id: "${lic_id}"
          trigger:
            - call: "POST /completions/${comp_id}/verify"
              payload: {}
              as: BoardAdmin
              captures: { st: $.data.status }
          assert:
            - "Completion.${comp_id}.status == VERIFIED after the REJECTED->PENDING_VERIFICATION->VERIFIED loop"

      - name: audit_under_review_request_attestation_loop
        grounds:
          - state_machines.Audit.ATTESTATION_PENDING_to_UNDER_REVIEW
          - state_machines.Audit.UNDER_REVIEW_to_ATTESTATION_PENDING
          - state_machines.Audit.UNDER_REVIEW_to_PASSED
        distinguishing_aspect: |
          Audit (a different entity than Completion) loops UNDER_REVIEW -> ATTESTATION_PENDING ->
          UNDER_REVIEW when the auditor requests a corrected attestation, then forks to PASSED — a
          revision cycle on a fork-join machine, not a linear pipeline.
        test_recipe:
          setup:
            - "Board CA, Provider P accredited, requirements met (ETHICS 4.0, SUBSTANCE 2.0, GENERAL 24.0 all VERIFIED)."
            - "Audit initiated by admin-initiator, attestation requested, licensee attests (UNDER_REVIEW), auditor requests a fresh attestation, licensee attests again (UNDER_REVIEW)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: BoardAdmin
            - call: "POST /license-boards"
              payload: { name: "CA Board", jurisdiction_code: "CA", credit_unit: "CLE", cycle_length_months: 24, total_required_hours: 30.0, carryover_cap_hours: 10.0, reminder_lead_days: 60, audit_cooldown_days: 365 }
              as: BoardAdmin
