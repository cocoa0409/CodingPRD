            - call: "POST /quotes"
              payload: { property_id: "${prop_id}", soiling_level: "MODERATE", expected_property_version: "${prop_v}" }
              as: Dispatcher
              captures: { quote_id: $.data.id }
          trigger:
            - call: "POST /quotes/${quote_id}/send"
              payload: {}
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
