  - rule_id: transitive_cascade
    instances:
      - name: concert_cancel_service_engagement_musician_chain
        grounds:
          - state_machines.Concert.SCHEDULED_to_CANCELLED
          - state_machines.RehearsalService.PUBLISHED_to_CANCELLED
          - state_machines.MusicianEngagement.CONFIRMED_to_VOIDED
          - calculations.musician_service_credit_invariant
          - entities.Musician.fields.services_charged_ytd
        distinguishing_aspect: |
          CASCADE A, depth 4, triggered by concert cancellation: cancel mutates the Concert,
          the CANCELLED concert mutates its RehearsalService, the CANCELLED service mutates
          its MusicianEngagement to VOIDED, and the VOIDED engagement mutates the Musician's
          services_charged_ytd and ytd_earnings_cents — each hop caused by the previous hop,
          not by the original request.
        test_recipe:
          setup:
            - "Season 2027 in PLANNING with a union agreement at scale 20000"
            - "One PROGRAMMED concert with a PUBLISHED 180-minute service (30-minute break, minimum_complement 1)"
            - "Rank-and-file violinist with no overscale and no doubling engaged on it, so provisional pay is 20000, services_charged_ytd is 1 and ytd_earnings_cents is 20000"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ArtisticAdmin
            - call: "POST /orchestra/seasons"
