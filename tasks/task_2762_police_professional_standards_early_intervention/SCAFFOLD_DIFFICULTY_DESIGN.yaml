              as: RecordsCustodian
              captures: { chan_total: $.data.total_complaints, chan_sustained: $.data.sustained_complaints, chan_rate: $.data.sustain_rate_pct }
          assert:
            - "${demo_min_cell} == 3, ${demo_total} == 5, ${demo_sustained} == 1 and ${demo_rate} == 20.0"
            - "the DEMOGRAPHIC report groups array holds exactly 3 rows in the order DG_A, DG_B, SUPPRESSED"
            - "the DG_A row has total_complaints 3, sustained_complaints 0, sustain_rate_pct 0.0 and suppressed false, because a cell of exactly 3 is disclosed"
            - "the DG_B row has total_complaints null, sustained_complaints null, sustain_rate_pct null and suppressed true, because 2 is strictly less than 3"
            - "the trailing SUPPRESSED row has total_complaints 2, sustained_complaints 1 and sustain_rate_pct 50.0, and is always disclosed"
            - "${all_breakdown} == ALL, ${all_total} == 5, ${all_sustained} == 1 and ${all_rate} == 20.0, with a single group ALL of total 5 and suppressed false"
            - "${chan_total} == 5, ${chan_sustained} == 1 and ${chan_rate} == 20.0, with a single group SUPERVISOR of total 5 and no SUPPRESSED row"

      - name: interview_notice_accepted_at_exactly_forty_eight_hours_and_rejected_at_forty_seven
        grounds:
          - calculations.interview_notice_and_appeal_windows
          - validations[priority=9]
          - endpoints["POST /investigations/{id}/interview-sessions"]
          - endpoints["POST /interview-sessions/{id}/postpone"]
          - entities.InterviewSession.fields.notice_hours
        distinguishing_aspect: |
          notice_hours is a floor over whole hours tested non-strictly, so a notice served exactly
          48 hours before the start is accepted while one served 47 hours 59 minutes before is
          rejected with ERR_INSUFFICIENT_NOTICE; the postponement recomputes the window from the
          new pair of timestamps and applies the identical boundary, and the original notice never
          carries over.
        test_recipe:
          setup:
            - "One CLASS_II complaint carries one allegation, its investigation is ASSIGNED to Investigator Ahn and no session exists yet."
            - "The hearing room has concurrent_capacity 1 and no bookings, and the subject officer has no other session, so neither the room rule nor the rest buffer can fire."
            - "The logical clock stands at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /units"
              payload: { name: "Internal Affairs", unit_role: "INTERNAL_AFFAIRS", command_code: "IA", peer_group_code: "PG_IA", sworn_headcount: 12, intake_enabled: true }
              as: SystemAdmin
              captures: { ia_unit_id: $.data.id }
            - call: "POST /units"
              payload: { name: "Patrol North", unit_role: "PATROL_DIVISION", command_code: "PN", peer_group_code: "PG_NORTH", sworn_headcount: 60, intake_enabled: true }
              as: SystemAdmin
              captures: { patrol_unit_id: $.data.id }
            - call: "POST /officers"
              payload: { unit_id: "${ia_unit_id}", badge_number: "IA-001", full_name: "Commander Reyes", rank: "CAPTAIN", assignment_type: "ADMIN", annual_salary_cents: 14000000, demographic_code: "DG_A", hire_date: "2008-03-01T00:00:00Z", is_investigator: false, certification_level: 3, max_case_load: 0 }
              as: SystemAdmin
              captures: { cmdr_id: $.data.id }
            - call: "POST /officers"
              payload: { unit_id: "${ia_unit_id}", badge_number: "IA-101", full_name: "Investigator Ahn", rank: "SERGEANT", assignment_type: "INVESTIGATIVE", annual_salary_cents: 11000000, demographic_code: "DG_B", hire_date: "2014-05-12T00:00:00Z", is_investigator: true, certification_level: 3, max_case_load: 3 }
              as: SystemAdmin
              captures: { inv_a_id: $.data.id }
            - call: "POST /officers"
              payload: { unit_id: "${patrol_unit_id}", badge_number: "PN-010", full_name: "Sergeant Doyle", rank: "SERGEANT", assignment_type: "PATROL", annual_salary_cents: 10500000, demographic_code: "DG_A", hire_date: "2012-02-02T00:00:00Z" }
              as: SystemAdmin
              captures: { sup_id: $.data.id }
            - call: "POST /officers"
              payload: { unit_id: "${patrol_unit_id}", badge_number: "PN-501", full_name: "Officer Vance", rank: "OFFICER", assignment_type: "PATROL", annual_salary_cents: 9100013, demographic_code: "DG_C", hire_date: "2019-09-16T00:00:00Z" }
              as: SystemAdmin
              captures: { subj_id: $.data.id }
            - call: "POST /hearing-rooms"
              payload: { facility_code: "HQ", room_name: "Interview 1", concurrent_capacity: 1, recording_enabled: true }
              as: SystemAdmin
              captures: { room1_id: $.data.id }
            - call: "POST /complaints"
              payload: { intake_channel: "SUPERVISOR", narrative: "Pursuit policy violation.", incident_datetime: "2026-07-18T22:00:00Z", alleged_injury: false, reported_allegation_types: ["PURSUIT_VIOLATION"], subject_unit_id: "${patrol_unit_id}", complainant_name: "Sergeant Doyle", complainant_contact: "doyle@dept.gov", complainant_demographic_code: "DG_A", reporting_supervisor_officer_id: "${sup_id}" }
              as: Supervisor
              as_user_id: "${sup_id}"
              captures: { c1_id: $.data.id }
            - call: "POST /complaints/${c1_id}/allegations"
              payload: { subject_officer_id: "${subj_id}", allegation_type: "PURSUIT_VIOLATION", narrative: "Pursuit continued past the abort order.", offense_class: "B" }
              as: IACommander
              as_user_id: "${cmdr_id}"
              captures: { a1_id: $.data.id }
            - call: "POST /complaints/${c1_id}/investigations"
              payload: { opening_note: "Opened." }
              as: IACommander
              as_user_id: "${cmdr_id}"
              captures: { i1_id: $.data.id, i1_v: $.data.version }
            - call: "POST /investigations/${i1_id}/assignments"
              payload: { expected_investigation_version: "${i1_v}", investigator_officer_id: "${inv_a_id}" }
              as: IACommander
              as_user_id: "${cmdr_id}"
              captures: { i1_status_assigned: $.data.status }
          trigger:
            - call: "POST /investigations/${i1_id}/interview-sessions"
              payload: { subject_officer_id: "${subj_id}", hearing_room_id: "${room1_id}", scheduled_start: "2026-08-10T09:00:00Z", scheduled_end: "2026-08-10T10:30:00Z", notice_served_at: "2026-08-08T09:01:00Z", representation_status: "REP_PRESENT" }
              as: Investigator
              as_user_id: "${inv_a_id}"
              captures: { short_notice_error: $.data.error_id }
            - call: "POST /investigations/${i1_id}/interview-sessions"
              payload: { subject_officer_id: "${subj_id}", hearing_room_id: "${room1_id}", scheduled_start: "2026-08-10T09:00:00Z", scheduled_end: "2026-08-10T10:30:00Z", notice_served_at: "2026-08-08T09:00:00Z", representation_status: "REP_PRESENT" }
              as: Investigator
              as_user_id: "${inv_a_id}"
              captures: { s1_id: $.data.id, s1_hours: $.data.notice_hours, s1_minutes: $.data.duration_minutes, s1_postpones: $.data.postpone_count }
            - call: "POST /interview-sessions/${s1_id}/postpone"
              payload: { new_scheduled_start: "2026-08-15T09:00:00Z", new_scheduled_end: "2026-08-15T11:00:00Z", new_notice_served_at: "2026-08-13T09:01:00Z", postpone_reason: "Representative unavailable." }
              as: Investigator
              as_user_id: "${inv_a_id}"
              captures: { postpone_error: $.data.error_id }
            - call: "POST /interview-sessions/${s1_id}/postpone"
              payload: { new_scheduled_start: "2026-08-15T09:00:00Z", new_scheduled_end: "2026-08-15T11:00:00Z", new_notice_served_at: "2026-08-13T09:00:00Z", postpone_reason: "Representative unavailable." }
              as: Investigator
              as_user_id: "${inv_a_id}"
              captures: { s1_status2: $.data.status, s1_hours2: $.data.notice_hours, s1_minutes2: $.data.duration_minutes, s1_postpones2: $.data.postpone_count, s1_start2: $.data.scheduled_start }
          assert:
            - "${i1_status_assigned} == ASSIGNED"
            - "the first trigger call responds 422 and ${short_notice_error} == ERR_INSUFFICIENT_NOTICE, because floor(47.983) is 47"
            - "the second trigger call responds 201 with ${s1_hours} == 48, ${s1_minutes} == 90 and ${s1_postpones} == 0"
            - "the third trigger call responds 422 and ${postpone_error} == ERR_INSUFFICIENT_NOTICE, and InterviewSession.${s1_id}.postpone_count is still 0 with scheduled_start unchanged at 2026-08-10T09:00:00Z"
            - "the fourth trigger call responds 200 with ${s1_status2} == SCHEDULED, ${s1_hours2} == 48, ${s1_minutes2} == 120, ${s1_postpones2} == 1 and ${s1_start2} == 2026-08-15T09:00:00Z"
            - "Investigation.${i1_id}.status == IN_PROGRESS, moved by the first accepted session"

      - name: eis_decay_and_window_edges_at_one_hundred_eighty_and_three_hundred_sixty_five_days
        grounds:
          - calculations.eis_composite_score
          - endpoints["POST /officers/{id}/activity-events"]
          - endpoints["GET /officers/{id}/eis-profile"]
          - entities.Officer.fields.eis_score
        distinguishing_aspect: |
          An event aged exactly DECAY_FRESH_DAYS of 180 keeps decay 1.0 while an event one day
          older is halved, and an event aged exactly WINDOW_DAYS of 365 is excluded outright while
          one aged 364 still counts at the stale factor, so a single day of age changes the
          weighted total by 1.50 in one direction and 3.00 in the other.
        test_recipe:
          setup:
            - "Officer Pike and Officer Quill are both PATROL officers in the same unit, so the assignment multiplier is 1.0 for both."
            - "Neither officer has any activity event, complaint or alert before the trigger."
            - "The logical clock stands at 2026-08-01T00:00:00Z, so 2026-02-02 is exactly 180 days old, 2026-02-01 is 181 days old, 2025-08-02 is 364 days old and 2025-08-01 is exactly 365 days old."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /units"
              payload: { name: "Internal Affairs", unit_role: "INTERNAL_AFFAIRS", command_code: "IA", peer_group_code: "PG_IA", sworn_headcount: 12, intake_enabled: true }
