            - "trigger call 6 returns 200 with CmarProject.${proj}.final_savings_pool == 35000.00 (recoverable base 1190000.00 less settled 1155000.00, where settled is 1000000.00 + 140000.00 + 10000.00 undisputed plus the 5000.00 audit adjustment)"
            - "CmarProject.${proj}.final_cm_savings_share == 11114.40 (tier rate 0.35 on ratio 0.0281 yields 12250.00, capped by 0.25 * 44457.60)"
            - "CmarProject.${proj}.final_owner_savings_share == 23885.60"
            - "CmarProject.${proj}.closeout_status == FINAL_COMPUTED and gmp_status == EXECUTED (execute was false, so no settlement was written)"

  # ===================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: cost_report_half_open_periods_abut_but_never_overlap
        grounds:
          - validations.priority_101_ERR_COST_PERIOD_OVERLAP
          - entities.CostReport.fields.period_start
          - entities.CostReport.fields.period_end
          - state_machines.CostReport.OPEN_to_RECONCILED
        distinguishing_aspect: |
          The monthly reporting period is HALF-OPEN [period_start, period_end), so a period
          starting at the exact instant a neighbour ends is legal while an overlap of a single
          second is not, and the rule is status-blind: reconciling the incumbent report does
          not free its interval. Containment in both directions is tested, so an implementation
          comparing only start-versus-start or only end-versus-end passes some cases and fails
          others.
        test_recipe:
          setup:
            - "one CmarProject 'Lakeshore Library Renovation' with gmp_status EXECUTED"
            - "one CostReport covering [2026-08-01T00:00:00Z, 2026-09-01T00:00:00Z)"
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "Lakeshore Library Renovation", owner_org: "Lakeshore Library District", cm_fee_pct: 0.04, insurance_rate: 0.01, precon_fee_amount: 30000.00 }
              as: ProgramAdmin
              captures: { proj: $.data.id, projv1: $.data.version }
            - call: "POST /estimates"
              payload: { project_id: "${proj}", milestone_code: "CD_100", submitted_cost_of_work: 1000000.00, expected_project_version: "${projv1}" }
              as: ConstructionManager
              captures: { est: $.data.id }
            - call: "POST /estimates/${est}/submit"
              payload: {}
              as: ConstructionManager
            - call: "POST /estimates/${est}/reconcile"
              payload: { decision: "ACCEPT" }
              as: OwnerRepresentative
            - call: "GET /projects/${proj}"
              payload: {}
              as: ConstructionManager
              captures: { projv2: $.data.version }
            - call: "POST /gmp-proposals"
              payload: { project_id: "${proj}", based_on_estimate_id: "${est}", cost_of_work_total: 1000000.00, general_conditions_total: 100000.00, owner_contingency_amount: 50000.00, construction_contingency_amount: 40000.00, expected_project_version: "${projv2}" }
              as: ConstructionManager
              captures: { prop: $.data.id }
            - call: "POST /gmp-proposals/${prop}/submit"
              payload: {}
              as: ConstructionManager
            - call: "POST /gmp-proposals/${prop}/decide"
              payload: { decision: "EXECUTE" }
              as: OwnerRepresentative
            - call: "POST /cost-reports"
              payload: { project_id: "${proj}", period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z" }
              as: ConstructionManager
              captures: { cr_aug: $.data.id }
            - call: "POST /cost-reports/${cr_aug}/lines"
              payload: { cost_code: "01-100", quantity: 1, unit_rate: 120000.00, markup_pct: 0.0000, disputed: false }
              as: ConstructionManager
          trigger:
            - call: "POST /cost-reports"
              payload: { project_id: "${proj}", period_start: "2026-09-01T00:00:00Z", period_end: "2026-10-01T00:00:00Z" }
              as: ConstructionManager
              captures: { cr_sep: $.data.id }
            - call: "POST /cost-reports"
              payload: { project_id: "${proj}", period_start: "2026-08-31T23:59:59Z", period_end: "2026-09-30T23:59:59Z" }
              as: ConstructionManager
            - call: "POST /cost-reports"
              payload: { project_id: "${proj}", period_start: "2026-08-10T00:00:00Z", period_end: "2026-08-20T00:00:00Z" }
              as: ConstructionManager
            - call: "POST /cost-reports"
              payload: { project_id: "${proj}", period_start: "2026-07-01T00:00:00Z", period_end: "2026-11-01T00:00:00Z" }
              as: ConstructionManager
            - call: "POST /cost-reports/${cr_aug}/reconcile"
              payload: { decision: "RECONCILE", reconciliation_note: "August closed" }
              as: OwnerRepresentative
            - call: "POST /cost-reports"
              payload: { period_start: "2026-08-15T00:00:00Z", period_end: "2026-08-25T00:00:00Z", project_id: "${proj}" }
              as: ConstructionManager
            - call: "POST /cost-reports"
              payload: { project_id: "${proj}", period_start: "2026-10-01T00:00:00Z", period_end: "2026-11-01T00:00:00Z" }
              as: ConstructionManager
              captures: { cr_oct: $.data.id }
          assert:
            - "trigger call 1 returns 201 because 2026-09-01T00:00:00Z is the excluded end of the August period, so the gap is exactly zero and adjacency is legal"
            - "trigger call 2 returns 409 with error.code == ERR_COST_PERIOD_OVERLAP - it overlaps August by one second and September by all but one second"
            - "trigger call 3 returns 409 ERR_COST_PERIOD_OVERLAP - the candidate is strictly contained in the August period"
            - "trigger call 4 returns 409 ERR_COST_PERIOD_OVERLAP - the candidate strictly contains both existing periods"
            - "trigger call 5 returns 200 with CostReport.${cr_aug}.status == RECONCILED"
            - "trigger call 6 returns 409 ERR_COST_PERIOD_OVERLAP, proving the rule is status-blind: a RECONCILED period still occupies its interval"
            - "trigger call 7 returns 201 with CostReport.${cr_oct}.period_start == 2026-10-01T00:00:00Z"
            - "GET /cost-reports?project_id=${proj} returns exactly 3 rows: ${cr_aug}, ${cr_sep}, ${cr_oct}"
            - "no rejected call created a row, so GET /cost-reports?project_id=${proj}&status=OPEN returns exactly 2 rows"

      - name: subcontract_windows_need_seventy_two_clear_hours_from_blocking_siblings_only
        grounds:
          - validations.priority_102_ERR_PERFORMANCE_WINDOW_BUFFER_VIOLATION
          - global_constants.MOBILIZATION_BUFFER_HOURS
          - entities.Subcontract.fields.performance_start
          - entities.Subcontract.fields.performance_end
          - state_machines.Subcontract.DEFAULT_NOTICED_to_TERMINATED_FOR_DEFAULT
          - concurrency_rules.subcontract-create-stale-work-package
        distinguishing_aspect: |
          The performance window is a CLOSED interval and the separation required is
          MOBILIZATION_BUFFER_HOURS 72 of clear time, so a candidate touching a sibling's end
          instant is rejected, a candidate one second short of 72 hours is rejected, and a
          candidate at exactly 72 hours is accepted. The blocking set is then narrowed:
          once the incumbent is TERMINATED_FOR_DEFAULT its window stops blocking entirely and
          a replacement may reuse the very interval that was refused before.
