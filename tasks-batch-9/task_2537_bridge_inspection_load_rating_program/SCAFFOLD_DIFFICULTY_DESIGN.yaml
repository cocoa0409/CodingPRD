          Creating a load rating is legal or illegal purely because of the state of a THIRD entity -
          the source Inspection - which the create payload only references by id. The same payload,
          the same bridge, the same numbers: rejected while the inspection sits in SUBMITTED, accepted
          once QA moves it to ACCEPTED. The rating engineer's own role, the bridge state and the OCC
