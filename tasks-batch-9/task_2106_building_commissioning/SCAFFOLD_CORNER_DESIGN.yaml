  # ===========================================================================
  - section: validations
    instances:

      - name: role_check_precedes_existence_check_on_unknown_issue
        claim_type: priority_ordering
        grounds:
          - validations[priority=3]
          - validations[priority=4]
          - errors[ERR_ROLE_NOT_PERMITTED]
        distinguishing_aspect: "A Contractor voiding a non-existent issue answers 403 ERR_ROLE_NOT_PERMITTED, not 404 ERR_ISSUE_NOT_FOUND, because authorization sits at priority 3 and path existence at priority 4."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /issues/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/void"
              payload: { reason: "not mine to void" }
              as: Contractor
              as_user_id: "u-contractor-1"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_ROLE_NOT_PERMITTED"
            - "HTTP status is 403"

      - name: existence_check_precedes_state_check_on_unknown_checklist
        claim_type: priority_ordering
        grounds:
          - validations[priority=4]
          - validations[priority=11]
          - errors[ERR_CHECKLIST_NOT_FOUND]
        distinguishing_aspect: "Verifying a checklist id that does not exist answers 404 ERR_CHECKLIST_NOT_FOUND rather than 409 ERR_INVALID_STATE, because existence sits at priority 4 and the state precondition at priority 11."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /prefunctional-checklists/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/verify"
              payload: {}
              as: CxAuthority
              as_user_id: "u-cxa-1"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_CHECKLIST_NOT_FOUND"
            - "HTTP status is 404"

      - name: retainage_cap_blocks_the_issue_that_would_cross_ten_percent
        claim_type: aggregate_validation
        grounds:
          - validations[priority=33]
          - errors[ERR_RETAINAGE_CAP_EXCEEDED]
          - calculations.issue_retainage_hold
        distinguishing_aspect: "Each issue is individually legal, but the second one would take the roll-up to 105000 against a cap of floor(1000000 * 0.10) = 100000, so it answers 422 ERR_RETAINAGE_CAP_EXCEEDED and the roll-up stays at 75000."
        test_recipe:
          setup:
            - "Project P with contract_value_cents 1000000, so the retainage cap is 100000 cents."
            - "EquipmentUnit ELS with contract_value_cents 1000000 and criticality LIFE_SAFETY."
            - "One OPEN S1 issue already holds 75000 cents."
          setup_api_calls:
            - call: "POST /cx-projects"
              payload: { name: "Cap Cx", building_name: "Cap Block", project_type: "NEW_CONSTRUCTION", contract_value_cents: 1000000 }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
              captures: { p: $.data.id }
            - call: "POST /equipment-units"
              payload: { project_id: "${p}", tag: "FA-CP", system_type: "FIRE_ALARM", criticality: "LIFE_SAFETY", contract_value_cents: 1000000, weight_units: 10 }
              as: CxAuthority
              as_user_id: "u-cxa-1"
              captures: { els: $.data.id }
            - call: "POST /issues"
              payload: { project_id: "${p}", origin: "DESIGN_REVIEW", severity: "S1", description: "Detector spacing violation", equipment_id: "${els}" }
              as: CxAuthority
              as_user_id: "u-cxa-1"
              captures: { i1: $.data.id, hold1: $.data.retainage_hold_cents }
          trigger:
            - call: "POST /issues"
              payload: { project_id: "${p}", origin: "DESIGN_REVIEW", severity: "S2", description: "Battery calculation missing", equipment_id: "${els}" }
              as: CxAuthority
              as_user_id: "u-cxa-1"
              captures: { err: $.data.error_id }
          assert:
            - "${hold1} == 75000"
            - "${err} == ERR_RETAINAGE_CAP_EXCEEDED with HTTP 422"
            - "CxProject.${p}.retainage_withheld_cents == 75000 (the rejected issue wrote nothing)"
            - "GET /issues?project_id=${p} returns total_count == 1"
            - "readiness.retainage_cap_cents == 100000"

      - name: invalid_window_outranks_seasonal_overlap_on_deferred_test_create
        claim_type: priority_conflict
        grounds:
          - validations[priority=18]
          - validations[priority=20]
          - errors[ERR_INVALID_WINDOW]
          - errors[ERR_SEASONAL_WINDOW_CONFLICT]
        distinguishing_aspect: "A window whose end precedes its start AND whose span would straddle an occupied seasonal window answers 422 ERR_INVALID_WINDOW, because window well-formedness sits at priority 18 and overlap detection at priority 20."
        test_recipe:
          setup:
            - "Project P with an APPROVED CxPlan pinning R1 and EquipmentUnit E1 INSTALLED."
            - "DeferredTest DT1 occupies [2026-11-01T00:00Z, 2026-12-01T00:00Z)."
