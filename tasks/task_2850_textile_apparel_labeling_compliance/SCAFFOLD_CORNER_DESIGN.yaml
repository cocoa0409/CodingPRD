scaffold_corner_design:
  - section: entities
    instances:
      - name: market_requirement_create_returns_every_declared_field
        claim_type: creation
        grounds:
          - entities.MarketRequirement
          - endpoints[POST /labeling/market-requirements]
          - response_envelope.success
        distinguishing_aspect: "A registry row created with all eight declared inputs comes back at 201 with every field echoed and with id and created_at minted by the server - and, being common_fields false, with no updated_at and no version."
        test_recipe:
          setup:
            - "Empty database; no market is registered yet."
          setup_api_calls: []
          trigger:
            - call: "POST /labeling/market-requirements"
              payload: { market_code: "CA", required_languages: ["en", "fr"], fiber_tolerance_pp: 3.0, absolute_claim_tolerance_pp: 0.3, min_durability_cycles: 25, marking_duty_rate: 0.100, requires_identity_disclosure: true, requires_origin_statement: true }
              as: ComplianceAdmin
              captures: { mr_id: $.data.id, mr_created_at: $.data.created_at, mr_langs: $.data.required_languages }
          assert:
            - "HTTP 201 and response_type == \"object\""
            - "${mr_id} is a server-minted UUID with no type prefix, and ${mr_created_at} is an ISO 8601 UTC instant with three fractional digits"
            - "${mr_langs} == [\"en\", \"fr\"] in the submitted order"
            - "MarketRequirement.market_code == \"CA\", fiber_tolerance_pp == 3.0, absolute_claim_tolerance_pp == 0.3, min_durability_cycles == 25, marking_duty_rate == 0.100, requires_identity_disclosure == true, requires_origin_statement == true"
            - "meta.api_request_id and meta.api_request_timestamp are both present on the envelope"

      - name: brand_get_by_id_returns_the_stored_row
        claim_type: retrieval
        grounds:
          - entities.Brand
          - endpoints[GET /labeling/brands/{id}]
        distinguishing_aspect: "A freshly registered brand reads back with its four computed/system defaults intact - responsible_brand_id resolved to itself under SELF_OF_RECORD, a 0.00 ledger, a zero critical count and posture OPEN - which distinguishes a real read from a response echoing the create payload."
        test_recipe:
          setup:
            - "One BRAND_OWNER brand exists with responsibility_mode SELF_OF_RECORD."
          setup_api_calls:
            - call: "POST /labeling/brands"
              payload: { legal_name: "Northline Apparel Co", party_type: "BRAND_OWNER", rn_number: "RN12345", responsibility_mode: "SELF_OF_RECORD" }
              as: ComplianceAdmin
              captures: { brand_id: $.data.id }
          trigger:
            - call: "GET /labeling/brands/${brand_id}"
              payload: {}
              as: ComplianceAdmin
              captures: { rb: $.data.responsible_brand_id, ledger: $.data.outstanding_penalty_usd, crit: $.data.critical_audit_finding_count, posture: $.data.posture, ver: $.data.version }
          assert:
            - "HTTP 200 and ${rb} == \"${brand_id}\" (SELF_OF_RECORD resolves the responsibility chain to the row itself)"
            - "${ledger} == 0.00 and ${crit} == 0 and ${posture} == \"OPEN\""
            - "${ver} == 1 and Brand.licensor_brand_id == null"

      - name: material_inputs_listing_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints[GET /labeling/material-inputs]
          - response_envelope.pagination_defaults
          - response_envelope.pagination_fields
        distinguishing_aspect: "Three nodes on one style, read with limit 2, must return exactly 2 rows with total_count 3 and has_more true, then offset 2 returns the last row with has_more false - so the envelope's counters describe the whole filtered set and not the page."
        test_recipe:
          setup:
            - "One style carries three MaterialInput nodes: a FIBER root, a YARN child of that root, and a FABRIC child of the YARN node."
          setup_api_calls:
            - call: "POST /labeling/brands"
              payload: { legal_name: "Northline Apparel Co", party_type: "BRAND_OWNER", rn_number: "RN12345", responsibility_mode: "SELF_OF_RECORD" }
              as: ComplianceAdmin
              captures: { brand_id: $.data.id }
            - call: "POST /labeling/market-requirements"
              payload: { market_code: "US", required_languages: ["en"], fiber_tolerance_pp: 3.0, absolute_claim_tolerance_pp: 0.0, min_durability_cycles: 20, marking_duty_rate: 0.100, requires_identity_disclosure: true, requires_origin_statement: true }
              as: ComplianceAdmin
            - call: "POST /labeling/styles"
              payload: { brand_id: "${brand_id}", style_code: "NL-4410", product_class: "WOVEN_OUTERWEAR", target_market_codes: ["US"], net_weight_grams: 320.0, declared_fibers: [{ fiber_generic_name: "COTTON", declared_pct: 100.0, ornamentation_exempt: false }] }
              as: BrandAdmin
              as_user_id: "${brand_id}"
              captures: { style_id: $.data.id }
            - call: "POST /labeling/styles/${style_id}/material-inputs"
              payload: { stage: "FIBER", country_code: "IN", value_added_usd: 2.00, weight_grams: 500.0, is_ornamentation: false }
              as: BrandAdmin
              as_user_id: "${brand_id}"
              captures: { n1_id: $.data.id }
            - call: "POST /labeling/styles/${style_id}/material-inputs"
              payload: { stage: "YARN", country_code: "IN", value_added_usd: 3.00, weight_grams: 480.0, is_ornamentation: false, parent_input_id: "${n1_id}" }
              as: BrandAdmin
              as_user_id: "${brand_id}"
              captures: { n2_id: $.data.id }
            - call: "POST /labeling/styles/${style_id}/material-inputs"
              payload: { stage: "FABRIC", country_code: "CN", value_added_usd: 6.00, weight_grams: 950.0, is_ornamentation: false, parent_input_id: "${n2_id}" }
              as: BrandAdmin
              as_user_id: "${brand_id}"
          trigger:
            - call: "GET /labeling/material-inputs?style_id=${style_id}&limit=2&offset=0"
              payload: {}
              as: ComplianceAdmin
            - call: "GET /labeling/material-inputs?style_id=${style_id}&limit=2&offset=2"
              payload: {}
              as: ComplianceAdmin
          assert:
            - "First call: HTTP 200, response_type == \"array\", exactly 2 rows, total_count == 3, has_more == true, limit == 2, offset == 0"
            - "Second call: exactly 1 row, total_count == 3, has_more == false, offset == 2"
            - "The FABRIC row carries depth == 2 and the YARN row depth == 1, and the FIBER root depth == 0"

      - name: style_get_with_unknown_id_not_found
        claim_type: not_found
        grounds:
          - endpoints[GET /labeling/styles/{id}]
          - validations[priority=20]
          - errors.ERR_STYLE_NOT_FOUND
        distinguishing_aspect: "A syntactically valid UUID that matches no row must answer ERR_STYLE_NOT_FOUND at 404 with the error envelope, not an empty 200 object."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "GET /labeling/styles/2f1a9b7c-0000-4000-8000-000000000000"
              payload: {}
              as: ComplianceAdmin
              captures: { err: $.data.error_id, msg: $.data.message }
          assert:
            - "HTTP 404, response_type == \"error\", ${err} == \"ERR_STYLE_NOT_FOUND\" and ${msg} is a non-blank string"

      - name: style_create_missing_product_class_returns_invalid_request
        claim_type: required_fields
        grounds:
          - endpoints[POST /labeling/styles]
          - validations[priority=35]
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "product_class carries no default, so omitting it is a shape violation answered at priority 35 - and no Style row is persisted, which separates a rejected create from a create with a guessed default."
        test_recipe:
          setup:
            - "One brand exists and market US is registered."
          setup_api_calls:
            - call: "POST /labeling/brands"
              payload: { legal_name: "Northline Apparel Co", party_type: "BRAND_OWNER", rn_number: "RN12345", responsibility_mode: "SELF_OF_RECORD" }
              as: ComplianceAdmin
              captures: { brand_id: $.data.id }
            - call: "POST /labeling/market-requirements"
              payload: { market_code: "US", required_languages: ["en"], fiber_tolerance_pp: 3.0, absolute_claim_tolerance_pp: 0.0, min_durability_cycles: 20, marking_duty_rate: 0.100, requires_identity_disclosure: true, requires_origin_statement: true }
              as: ComplianceAdmin
          trigger:
            - call: "POST /labeling/styles"
              payload: { brand_id: "${brand_id}", style_code: "NL-4410", target_market_codes: ["US"], net_weight_grams: 320.0, declared_fibers: [{ fiber_generic_name: "COTTON", declared_pct: 100.0, ornamentation_exempt: false }] }
              as: BrandAdmin
              as_user_id: "${brand_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400 and ${err} == \"ERR_INVALID_REQUEST\""
            - "GET /labeling/brands/${brand_id}/styles returns total_count == 0"

      - name: style_create_without_declared_fibers_defaults_to_an_empty_declaration
        claim_type: defaults
        grounds:
          - entities.Style.fields.declared_fibers
          - entities.Style.fields.effective_fiber_content_text
          - entities.Style.fields.label_readiness
          - endpoints[POST /labeling/styles]
          - validations[priority=78]
        distinguishing_aspect: "declared_fibers is the one optional create input: omitting it yields the declared default [] with an empty effective_fiber_content_text and label_readiness BLOCKED, and priority 78 does NOT fire on the empty array - the empty declaration is only refused later, when a label or a fiber bench is requested."
        test_recipe:
          setup:
            - "One brand exists and market US is registered."
          setup_api_calls:
            - call: "POST /labeling/brands"
              payload: { legal_name: "Northline Apparel Co", party_type: "BRAND_OWNER", rn_number: "RN12345", responsibility_mode: "SELF_OF_RECORD" }
              as: ComplianceAdmin
              captures: { brand_id: $.data.id }
            - call: "POST /labeling/market-requirements"
              payload: { market_code: "US", required_languages: ["en"], fiber_tolerance_pp: 3.0, absolute_claim_tolerance_pp: 0.0, min_durability_cycles: 20, marking_duty_rate: 0.100, requires_identity_disclosure: true, requires_origin_statement: true }
              as: ComplianceAdmin
          trigger:
            - call: "POST /labeling/styles"
              payload: { brand_id: "${brand_id}", style_code: "NL-BARE-1", product_class: "WOVEN_OUTERWEAR", target_market_codes: ["US"], net_weight_grams: 300.0 }
              as: BrandAdmin
              as_user_id: "${brand_id}"
              captures: { fibers: $.data.declared_fibers, text: $.data.effective_fiber_content_text, readiness: $.data.label_readiness, sub: $.data.substantiation_state, org: $.data.origin_state }
          assert:
            - "HTTP 201, ${fibers} == [] and ${text} == \"\""
            - "${readiness} == \"BLOCKED\", ${sub} == \"FIBER_DECLARED\" and ${org} == \"ORIGIN_UNDETERMINED\""

      - name: style_effective_fiber_content_text_buckets_sub_five_percent_lines_into_other_fiber
        claim_type: computed_fields
        grounds:
          - calculations.effective_fiber_content_text
          - entities.Style.fields.effective_fiber_content_text
          - endpoints[POST /labeling/styles]
        distinguishing_aspect: "The 3.0 ELASTANE line is below the 5.0 listing threshold, so it must be printed as a trailing OTHER FIBER bucket rather than by name, and the two listed lines are ordered by declared_pct DESC - a naive echo of the submitted array in submitted order produces a different string."
        test_recipe:
          setup:
            - "One brand exists and market US is registered."
          setup_api_calls:
            - call: "POST /labeling/brands"
              payload: { legal_name: "Northline Apparel Co", party_type: "BRAND_OWNER", rn_number: "RN12345", responsibility_mode: "SELF_OF_RECORD" }
              as: ComplianceAdmin
              captures: { brand_id: $.data.id }
            - call: "POST /labeling/market-requirements"
              payload: { market_code: "US", required_languages: ["en"], fiber_tolerance_pp: 3.0, absolute_claim_tolerance_pp: 0.0, min_durability_cycles: 20, marking_duty_rate: 0.100, requires_identity_disclosure: true, requires_origin_statement: true }
              as: ComplianceAdmin
          trigger:
            - call: "POST /labeling/styles"
              payload: { brand_id: "${brand_id}", style_code: "NL-4410", product_class: "WOVEN_OUTERWEAR", target_market_codes: ["US"], net_weight_grams: 320.0, declared_fibers: [{ fiber_generic_name: "ELASTANE", declared_pct: 3.0, ornamentation_exempt: false }, { fiber_generic_name: "COTTON", declared_pct: 60.0, ornamentation_exempt: false }, { fiber_generic_name: "POLYESTER", declared_pct: 37.0, ornamentation_exempt: false }] }
              as: BrandAdmin
              as_user_id: "${brand_id}"
              captures: { text: $.data.effective_fiber_content_text }
          assert:
            - "HTTP 201 and ${text} == \"60.0% COTTON, 37.0% POLYESTER, 3.0% OTHER FIBER\""
            - "Style.declared_fibers still holds the three submitted lines in the submitted order (only the rendered string is reordered)"

      - name: style_create_with_supplied_substantiation_state_input_ignored
        claim_type: system_fields
        grounds:
          - entities.Style.fields.substantiation_state
          - entities.Style.fields.origin_state
          - entities.Style.fields.label_readiness
          - endpoints[POST /labeling/styles]
        distinguishing_aspect: "substantiation_state, origin_state, label_readiness, id, created_at and version are server-owned: a create that also sends substantiation_state FIBER_SUBSTANTIATED and version 9 must still persist FIBER_DECLARED at version 1, so the fiber evidence gate cannot be jumped by payload."
        test_recipe:
          setup:
            - "One brand exists and market US is registered."
          setup_api_calls:
            - call: "POST /labeling/brands"
              payload: { legal_name: "Northline Apparel Co", party_type: "BRAND_OWNER", rn_number: "RN12345", responsibility_mode: "SELF_OF_RECORD" }
              as: ComplianceAdmin
              captures: { brand_id: $.data.id }
            - call: "POST /labeling/market-requirements"
              payload: { market_code: "US", required_languages: ["en"], fiber_tolerance_pp: 3.0, absolute_claim_tolerance_pp: 0.0, min_durability_cycles: 20, marking_duty_rate: 0.100, requires_identity_disclosure: true, requires_origin_statement: true }
              as: ComplianceAdmin
          trigger:
            - call: "POST /labeling/styles"
              payload: { brand_id: "${brand_id}", style_code: "NL-4410", product_class: "WOVEN_OUTERWEAR", target_market_codes: ["US"], net_weight_grams: 320.0, declared_fibers: [{ fiber_generic_name: "COTTON", declared_pct: 100.0, ornamentation_exempt: false }], substantiation_state: "FIBER_SUBSTANTIATED", label_readiness: "READY", version: 9 }
              as: BrandAdmin
              as_user_id: "${brand_id}"
              captures: { sub: $.data.substantiation_state, readiness: $.data.label_readiness, ver: $.data.version }
          assert:
            - "${sub} == \"FIBER_DECLARED\", ${readiness} == \"BLOCKED\" and ${ver} == 1"
            - "The three supplied server-owned keys are ignored rather than rejected: the response is HTTP 201"

      - name: style_create_with_unknown_product_class_returns_invalid_enum
        claim_type: type_constraints
        grounds:
          - entities.Style.fields.product_class
          - validations[priority=35]
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "product_class is an enum of exactly four members; a fifth value is a shape violation at priority 35 even though every other field is well formed."
        test_recipe:
          setup:
            - "One brand exists and market US is registered."
          setup_api_calls:
            - call: "POST /labeling/brands"
              payload: { legal_name: "Northline Apparel Co", party_type: "BRAND_OWNER", rn_number: "RN12345", responsibility_mode: "SELF_OF_RECORD" }
              as: ComplianceAdmin
              captures: { brand_id: $.data.id }
            - call: "POST /labeling/market-requirements"
              payload: { market_code: "US", required_languages: ["en"], fiber_tolerance_pp: 3.0, absolute_claim_tolerance_pp: 0.0, min_durability_cycles: 20, marking_duty_rate: 0.100, requires_identity_disclosure: true, requires_origin_statement: true }
              as: ComplianceAdmin
          trigger:
            - call: "POST /labeling/styles"
              payload: { brand_id: "${brand_id}", style_code: "NL-4410", product_class: "SWIMWEAR", target_market_codes: ["US"], net_weight_grams: 320.0, declared_fibers: [{ fiber_generic_name: "COTTON", declared_pct: 100.0, ornamentation_exempt: false }] }
              as: BrandAdmin
              as_user_id: "${brand_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400 and ${err} == \"ERR_INVALID_REQUEST\""

      - name: market_requirement_row_carries_no_version_and_has_no_update_endpoint
        claim_type: immutability
        grounds:
          - entities.MarketRequirement
          - endpoints[GET /labeling/market-requirements]
        distinguishing_aspect: "MarketRequirement declares common_fields false, so the row exposes only id and created_at - no updated_at, no version, and no PATCH/PUT path exists in the whole §1.5 surface; a second registration of the same market_code is a duplicate rather than an update."
        test_recipe:
          setup:
            - "Market US is registered once."
          setup_api_calls:
            - call: "POST /labeling/market-requirements"
              payload: { market_code: "US", required_languages: ["en"], fiber_tolerance_pp: 3.0, absolute_claim_tolerance_pp: 0.0, min_durability_cycles: 20, marking_duty_rate: 0.100, requires_identity_disclosure: true, requires_origin_statement: true }
              as: ComplianceAdmin
              captures: { mr_id: $.data.id }
          trigger:
            - call: "GET /labeling/market-requirements?market_code=US"
              payload: {}
              as: ComplianceAdmin
          assert:
            - "HTTP 200, exactly 1 row whose id == \"${mr_id}\", total_count == 1"
            - "The row exposes id and created_at and does NOT expose updated_at or version"

      - name: material_input_create_under_unknown_style_not_found
        claim_type: parent_relationships
        grounds:
          - entities.MaterialInput.parent
          - validations[priority=20]
          - errors.ERR_STYLE_NOT_FOUND
        distinguishing_aspect: "MaterialInput is a child of Style and is only addressable through the nested path, so an unknown parent id in the path is answered by the priority-20 path check before any body field is examined - even when the body itself is well formed."
        test_recipe:
          setup:
            - "Empty database except the acting brand."
          setup_api_calls:
            - call: "POST /labeling/brands"
              payload: { legal_name: "Northline Apparel Co", party_type: "BRAND_OWNER", rn_number: "RN12345", responsibility_mode: "SELF_OF_RECORD" }
              as: ComplianceAdmin
              captures: { brand_id: $.data.id }
          trigger:
            - call: "POST /labeling/styles/2f1a9b7c-0000-4000-8000-000000000000/material-inputs"
              payload: { stage: "FIBER", country_code: "IN", value_added_usd: 2.00, weight_grams: 500.0, is_ornamentation: false }
              as: ComplianceAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404 and ${err} == \"ERR_STYLE_NOT_FOUND\""

      - name: material_input_parent_belonging_to_another_style_is_rejected
        claim_type: parent_relationships
        grounds:
          - entities.MaterialInput.fields.parent_input_id
          - validations[priority=80]
          - errors.ERR_MATERIAL_STAGE_ORDER
        distinguishing_aspect: "The supply graph is self-referential but strictly per style: a parent_input_id that resolves to a live node of a DIFFERENT style is a stage-order violation at priority 80, not a 404 - the row exists, it is simply not in this style's graph, which is what keeps the two styles' topological pools disjoint."
        test_recipe:
          setup:
            - "One brand owns two styles S1 and S2; S2 carries a FIBER root node."
          setup_api_calls:
            - call: "POST /labeling/brands"
              payload: { legal_name: "Northline Apparel Co", party_type: "BRAND_OWNER", rn_number: "RN12345", responsibility_mode: "SELF_OF_RECORD" }
              as: ComplianceAdmin
              captures: { brand_id: $.data.id }
            - call: "POST /labeling/market-requirements"
              payload: { market_code: "US", required_languages: ["en"], fiber_tolerance_pp: 3.0, absolute_claim_tolerance_pp: 0.0, min_durability_cycles: 20, marking_duty_rate: 0.100, requires_identity_disclosure: true, requires_origin_statement: true }
              as: ComplianceAdmin
            - call: "POST /labeling/styles"
              payload: { brand_id: "${brand_id}", style_code: "NL-S1", product_class: "WOVEN_OUTERWEAR", target_market_codes: ["US"], net_weight_grams: 320.0, declared_fibers: [{ fiber_generic_name: "COTTON", declared_pct: 100.0, ornamentation_exempt: false }] }
              as: BrandAdmin
              as_user_id: "${brand_id}"
              captures: { s1_id: $.data.id }
            - call: "POST /labeling/styles"
              payload: { brand_id: "${brand_id}", style_code: "NL-S2", product_class: "WOVEN_OUTERWEAR", target_market_codes: ["US"], net_weight_grams: 310.0, declared_fibers: [{ fiber_generic_name: "COTTON", declared_pct: 100.0, ornamentation_exempt: false }] }
              as: BrandAdmin
              as_user_id: "${brand_id}"
              captures: { s2_id: $.data.id }
            - call: "POST /labeling/styles/${s2_id}/material-inputs"
              payload: { stage: "FIBER", country_code: "IN", value_added_usd: 2.00, weight_grams: 500.0, is_ornamentation: false }
              as: BrandAdmin
              as_user_id: "${brand_id}"
              captures: { foreign_node_id: $.data.id }
          trigger:
            - call: "POST /labeling/styles/${s1_id}/material-inputs"
              payload: { stage: "YARN", country_code: "IN", value_added_usd: 3.00, weight_grams: 480.0, is_ornamentation: false, parent_input_id: "${foreign_node_id}" }
              as: BrandAdmin
              as_user_id: "${brand_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422 and ${err} == \"ERR_MATERIAL_STAGE_ORDER\""
            - "GET /labeling/material-inputs?style_id=${s1_id} returns total_count == 0"

  - section: state_machines
    instances:
      - name: style_is_created_in_fiber_declared_and_origin_undetermined
        claim_type: initial_state
        grounds:
          - state_machines[entity=Style]
          - entities.Style.fields.substantiation_state
          - entities.Style.fields.origin_state
        distinguishing_aspect: "Style carries two independent state dimensions, so a newly created row must sit at the initial state of BOTH - FIBER_DECLARED and ORIGIN_UNDETERMINED - and at version 1 with no evidence rows attached."
        test_recipe:
          setup:
            - "One brand exists and market US is registered."
          setup_api_calls:
            - call: "POST /labeling/brands"
              payload: { legal_name: "Northline Apparel Co", party_type: "BRAND_OWNER", rn_number: "RN12345", responsibility_mode: "SELF_OF_RECORD" }
              as: ComplianceAdmin
              captures: { brand_id: $.data.id }
            - call: "POST /labeling/market-requirements"
              payload: { market_code: "US", required_languages: ["en"], fiber_tolerance_pp: 3.0, absolute_claim_tolerance_pp: 0.0, min_durability_cycles: 20, marking_duty_rate: 0.100, requires_identity_disclosure: true, requires_origin_statement: true }
              as: ComplianceAdmin
          trigger:
            - call: "POST /labeling/styles"
              payload: { brand_id: "${brand_id}", style_code: "NL-4410", product_class: "WOVEN_OUTERWEAR", target_market_codes: ["US"], net_weight_grams: 320.0, declared_fibers: [{ fiber_generic_name: "COTTON", declared_pct: 100.0, ornamentation_exempt: false }] }
              as: BrandAdmin
              as_user_id: "${brand_id}"
              captures: { style_id: $.data.id, sub: $.data.substantiation_state, org: $.data.origin_state, ver: $.data.version }
            - call: "GET /labeling/styles/${style_id}/lab-tests"
              payload: {}
              as: ComplianceAdmin
          assert:
            - "${sub} == \"FIBER_DECLARED\" and ${org} == \"ORIGIN_UNDETERMINED\" and ${ver} == 1"
            - "The lab-test listing returns total_count == 0"

      - name: label_spec_submit_moves_draft_to_pending_approval
        claim_type: valid_transition
        grounds:
          - state_machines[entity=LabelSpec].transitions.DRAFT_to_PENDING_APPROVAL
          - endpoints[POST /labeling/label-specs/{id}/submit]
        distinguishing_aspect: "Submit is the only edge out of DRAFT toward approval and it records nothing but the state move: authored_by_user_id was already frozen at creation, approved_by_user_id must still be null after the submit, and version increments by exactly one."
        test_recipe:
          setup:
            - "Market US is registered; one brand owns style NL-4410 with a two-node supply graph, a DRAFT origin determination and a PASSED CARE_PERFORMANCE test at 30 C."
            - "A DRAFT PERMANENT_LABEL authored by user-spec-1 pins that determination and that care test."
          setup_api_calls:
            - call: "POST /labeling/market-requirements"
