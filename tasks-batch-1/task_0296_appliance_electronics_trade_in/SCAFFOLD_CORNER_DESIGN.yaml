# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth probe across the claim-extraction-guide sections. Same literal/
# placeholder/reachability discipline as §1.8. Fixtures match §1.8's canonical
# Catalog/DeviceModel (PHN-1 SMARTPHONE base 60000) unless noted.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_trade_in_returns_201_with_defaults
        claim_type: Creation
        grounds:
          - entities.TradeIn.fields.status
          - entities.TradeIn.fields.declared_defects
          - entities.TradeIn.fields.declared_powers_on
        distinguishing_aspect: "POST /trade-ins with required fields only returns 201; status defaults DRAFT, declared_defects defaults [], declared_powers_on defaults true."
        test_recipe:
          setup: ["Catalog + model + customer exist."]
          setup_api_calls:
            - call: "POST /catalogs"
              payload: { name: "TIC", currency: "USD", price_lock_hours: 168, requote_tolerance_pct: 0.15, data_wipe_required_categories: [], recycle_floor_value_cents: 5000 }
              as: CatalogAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /catalogs/${cat_id}/device-models"
              payload: { manufacturer: "Acme", model_code: "PHN-1", category: "SMARTPHONE", base_value_cents: 60000, condition_multipliers: { FLAWLESS: 1.0, GOOD: 0.8, FAIR: 0.6, POOR: 0.35 }, defect_deductions: { CRACKED_SCREEN: 12000, BATTERY_DEGRADED: 4000, WATER_DAMAGE: 20000, MISSING_PARTS: 5000, WONT_POWER_ON: 15000, DENTED_BODY: 3000 } }
              as: CatalogAdmin
              captures: { dm_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "ce1@x.com", full_name: "CE1" }
              as: CatalogAdmin
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /trade-ins"
              payload: { customer_id: "${cust_id}", device_model_id: "${dm_id}", declared_grade: "GOOD" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ti_id: $.data.id }
          assert:
            - "TradeIn.${ti_id}.status == DRAFT"
            - "TradeIn.${ti_id}.declared_defects == []"
            - "TradeIn.${ti_id}.declared_powers_on == true"
            - "TradeIn.${ti_id}.version == 1"

      - name: get_trade_in_not_found_returns_404
        claim_type: Not Found
        grounds: [entities.TradeIn]
        distinguishing_aspect: "GET /trade-ins/{random-uuid} for a non-existent id returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /trade-ins/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: CatalogAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NOT_FOUND"

      - name: create_trade_in_missing_declared_grade_returns_400
        claim_type: Required Fields
        grounds: [entities.TradeIn.fields.declared_grade, "validations[priority=6]"]
        distinguishing_aspect: "POST /trade-ins omitting required declared_grade returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Catalog + model + customer exist."]
          setup_api_calls:
            - call: "POST /catalogs"
              payload: { name: "TIC", currency: "USD", price_lock_hours: 168, requote_tolerance_pct: 0.15, data_wipe_required_categories: [], recycle_floor_value_cents: 5000 }
              as: CatalogAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /catalogs/${cat_id}/device-models"
              payload: { manufacturer: "Acme", model_code: "PHN-1", category: "SMARTPHONE", base_value_cents: 60000, condition_multipliers: { FLAWLESS: 1.0, GOOD: 0.8, FAIR: 0.6, POOR: 0.35 }, defect_deductions: { CRACKED_SCREEN: 12000, BATTERY_DEGRADED: 4000, WATER_DAMAGE: 20000, MISSING_PARTS: 5000, WONT_POWER_ON: 15000, DENTED_BODY: 3000 } }
              as: CatalogAdmin
              captures: { dm_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "ce2@x.com", full_name: "CE2" }
              as: CatalogAdmin
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /trade-ins"
              payload: { customer_id: "${cust_id}", device_model_id: "${dm_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST"

      - name: create_trade_in_bad_fk_returns_404
        claim_type: Parent Relationships
        grounds: [entities.TradeIn.fields.device_model_id, "validations[priority=5]"]
        distinguishing_aspect: "POST /trade-ins with a device_model_id that does not resolve returns ERR_FK_NOT_FOUND (404)."
        test_recipe:
          setup: ["Customer exists; device_model_id is a random non-existent uuid."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "ce3@x.com", full_name: "CE3" }
              as: CatalogAdmin
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /trade-ins"
              payload: { customer_id: "${cust_id}", device_model_id: "00000000-0000-4000-8000-0000000000aa", declared_grade: "GOOD" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_FK_NOT_FOUND"

      - name: device_model_id_and_timestamps_are_system_minted
        claim_type: System Fields
        grounds: [entities.DeviceModel.fields.status, entities.DeviceModel.fields.category]
        distinguishing_aspect: "POST device-model: server mints id/created_at/updated_at/version and sets status=ACTIVE by default; client cannot override status."
        test_recipe:
          setup: ["Catalog exists."]
          setup_api_calls:
            - call: "POST /catalogs"
              payload: { name: "TIC", currency: "USD", price_lock_hours: 168, requote_tolerance_pct: 0.15, data_wipe_required_categories: [], recycle_floor_value_cents: 5000 }
              as: CatalogAdmin
              captures: { cat_id: $.data.id }
          trigger:
            - call: "POST /catalogs/${cat_id}/device-models"
              payload: { manufacturer: "Acme", model_code: "PHN-9", category: "LAPTOP", base_value_cents: 80000, condition_multipliers: { FLAWLESS: 1.0, GOOD: 0.8, FAIR: 0.6, POOR: 0.35 }, defect_deductions: { CRACKED_SCREEN: 12000, BATTERY_DEGRADED: 4000, WATER_DAMAGE: 20000, MISSING_PARTS: 5000, WONT_POWER_ON: 15000, DENTED_BODY: 3000 } }
              as: CatalogAdmin
              captures: { dm_id: $.data.id }
          assert:
            - "DeviceModel.${dm_id}.status == ACTIVE"
            - "DeviceModel.${dm_id}.version == 1"

      - name: duplicate_model_code_returns_409
        claim_type: Type Constraints
        grounds: [entities.DeviceModel.fields.model_code, "validations[priority=16]", "errors[ERR_DUPLICATE]"]
        distinguishing_aspect: "A second ACTIVE device-model with the same model_code in the same catalog returns ERR_DUPLICATE (409)."
        test_recipe:
          setup: ["Catalog with PHN-1 already registered."]
          setup_api_calls:
            - call: "POST /catalogs"
              payload: { name: "TIC", currency: "USD", price_lock_hours: 168, requote_tolerance_pct: 0.15, data_wipe_required_categories: [], recycle_floor_value_cents: 5000 }
              as: CatalogAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /catalogs/${cat_id}/device-models"
              payload: { manufacturer: "Acme", model_code: "PHN-1", category: "SMARTPHONE", base_value_cents: 60000, condition_multipliers: { FLAWLESS: 1.0, GOOD: 0.8, FAIR: 0.6, POOR: 0.35 }, defect_deductions: { CRACKED_SCREEN: 12000, BATTERY_DEGRADED: 4000, WATER_DAMAGE: 20000, MISSING_PARTS: 5000, WONT_POWER_ON: 15000, DENTED_BODY: 3000 } }
              as: CatalogAdmin
              captures: { dm_id: $.data.id }
          trigger:
            - call: "POST /catalogs/${cat_id}/device-models"
              payload: { manufacturer: "Globex", model_code: "PHN-1", category: "SMARTPHONE", base_value_cents: 50000, condition_multipliers: { FLAWLESS: 1.0, GOOD: 0.8, FAIR: 0.6, POOR: 0.35 }, defect_deductions: { CRACKED_SCREEN: 12000, BATTERY_DEGRADED: 4000, WATER_DAMAGE: 20000, MISSING_PARTS: 5000, WONT_POWER_ON: 15000, DENTED_BODY: 3000 } }
              as: CatalogAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_DUPLICATE"

      - name: device_model_bad_multipliers_returns_422
        claim_type: Type Constraints
        grounds: [entities.DeviceModel.fields.condition_multipliers, "validations[priority=17]", "errors[ERR_INVALID_MULTIPLIERS]"]
        distinguishing_aspect: "POST device-model whose condition_multipliers omit a required grade key (no POOR) returns ERR_INVALID_MULTIPLIERS (422)."
        test_recipe:
          setup: ["Catalog exists."]
          setup_api_calls:
            - call: "POST /catalogs"
              payload: { name: "TIC", currency: "USD", price_lock_hours: 168, requote_tolerance_pct: 0.15, data_wipe_required_categories: [], recycle_floor_value_cents: 5000 }
              as: CatalogAdmin
              captures: { cat_id: $.data.id }
          trigger:
            - call: "POST /catalogs/${cat_id}/device-models"
              payload: { manufacturer: "Acme", model_code: "PHN-2", category: "SMARTPHONE", base_value_cents: 60000, condition_multipliers: { FLAWLESS: 1.0, GOOD: 0.8, FAIR: 0.6 }, defect_deductions: { CRACKED_SCREEN: 12000, BATTERY_DEGRADED: 4000, WATER_DAMAGE: 20000, MISSING_PARTS: 5000, WONT_POWER_ON: 15000, DENTED_BODY: 3000 } }
              as: CatalogAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_MULTIPLIERS"

      - name: customer_wallet_and_lifetime_default_zero
        claim_type: Defaults
        grounds: [entities.Customer.fields.wallet_balance_cents, entities.Customer.fields.lifetime_payout_cents]
        distinguishing_aspect: "A freshly created Customer has wallet_balance_cents == 0 and lifetime_payout_cents == 0."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /customers"
              payload: { email: "ce4@x.com", full_name: "CE4" }
              as: CatalogAdmin
              captures: { cust_id: $.data.id }
          assert:
            - "Customer.${cust_id}.wallet_balance_cents == 0"
            - "Customer.${cust_id}.lifetime_payout_cents == 0"

      - name: duplicate_customer_email_returns_409
        claim_type: Type Constraints
        grounds: [entities.Customer.fields.email, "validations[priority=16]", "errors[ERR_DUPLICATE]"]
        distinguishing_aspect: "Registering a second customer with an already-used email (case-insensitive) returns ERR_DUPLICATE (409)."
        test_recipe:
          setup: ["Customer dup@x.com exists."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "dup@x.com", full_name: "First" }
              as: CatalogAdmin
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /customers"
              payload: { email: "DUP@x.com", full_name: "Second" }
              as: CatalogAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_DUPLICATE"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: ship_kit_from_draft_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.TradeIn.QUOTED_to_KIT_SENT, "validations[priority=7]"]
        distinguishing_aspect: "POST /ship-kit on a DRAFT trade-in (no quote yet) is rejected with ERR_INVALID_STATE; status stays DRAFT."
        test_recipe:
          setup: ["Trade-in created, never quoted (DRAFT)."]
          setup_api_calls:
            - call: "POST /catalogs"
              payload: { name: "TIC", currency: "USD", price_lock_hours: 168, requote_tolerance_pct: 0.15, data_wipe_required_categories: [], recycle_floor_value_cents: 5000 }
              as: CatalogAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /catalogs/${cat_id}/device-models"
              payload: { manufacturer: "Acme", model_code: "PHN-1", category: "SMARTPHONE", base_value_cents: 60000, condition_multipliers: { FLAWLESS: 1.0, GOOD: 0.8, FAIR: 0.6, POOR: 0.35 }, defect_deductions: { CRACKED_SCREEN: 12000, BATTERY_DEGRADED: 4000, WATER_DAMAGE: 20000, MISSING_PARTS: 5000, WONT_POWER_ON: 15000, DENTED_BODY: 3000 } }
              as: CatalogAdmin
              captures: { dm_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "sm1@x.com", full_name: "SM1" }
              as: CatalogAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /trade-ins"
              payload: { customer_id: "${cust_id}", device_model_id: "${dm_id}", declared_grade: "GOOD" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ti_id: $.data.id }
          trigger:
            - call: "POST /trade-ins/${ti_id}/ship-kit"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "TradeIn.${ti_id}.status == DRAFT"

      - name: double_quote_from_quoted_returns_invalid_state
        claim_type: Idempotency
        grounds: [state_machines.TradeIn.DRAFT_to_QUOTED, "validations[priority=7]"]
        distinguishing_aspect: "Calling /quote twice: the second call on an already-QUOTED trade-in returns ERR_INVALID_STATE (DRAFT->QUOTED no longer legal)."
        test_recipe:
          setup: ["Trade-in already quoted once (QUOTED)."]
          setup_api_calls:
            - call: "POST /catalogs"
              payload: { name: "TIC", currency: "USD", price_lock_hours: 168, requote_tolerance_pct: 0.15, data_wipe_required_categories: [], recycle_floor_value_cents: 5000 }
              as: CatalogAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /catalogs/${cat_id}/device-models"
              payload: { manufacturer: "Acme", model_code: "PHN-1", category: "SMARTPHONE", base_value_cents: 60000, condition_multipliers: { FLAWLESS: 1.0, GOOD: 0.8, FAIR: 0.6, POOR: 0.35 }, defect_deductions: { CRACKED_SCREEN: 12000, BATTERY_DEGRADED: 4000, WATER_DAMAGE: 20000, MISSING_PARTS: 5000, WONT_POWER_ON: 15000, DENTED_BODY: 3000 } }
              as: CatalogAdmin
              captures: { dm_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "sm2@x.com", full_name: "SM2" }
              as: CatalogAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /trade-ins"
              payload: { customer_id: "${cust_id}", device_model_id: "${dm_id}", declared_grade: "GOOD" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ti_id: $.data.id }
            - call: "POST /trade-ins/${ti_id}/quote"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /trade-ins/${ti_id}/quote"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "TradeIn.${ti_id}.status == QUOTED"

      - name: cancel_from_paid_terminal_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds: [state_machines.TradeIn.DRAFT_to_CANCELLED, "validations[priority=7]"]
        distinguishing_aspect: "Cancel on a PAID (terminal) trade-in is rejected with ERR_INVALID_STATE; no cancel transition exists from PAID."
        test_recipe:
          setup: ["FLAWLESS trade-in driven to PAID (accepted then paid by ACH)."]
          setup_api_calls:
            - call: "POST /catalogs"
              payload: { name: "TIC", currency: "USD", price_lock_hours: 168, requote_tolerance_pct: 0.15, data_wipe_required_categories: [], recycle_floor_value_cents: 5000 }
              as: CatalogAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /catalogs/${cat_id}/device-models"
              payload: { manufacturer: "Acme", model_code: "PHN-1", category: "SMARTPHONE", base_value_cents: 60000, condition_multipliers: { FLAWLESS: 1.0, GOOD: 0.8, FAIR: 0.6, POOR: 0.35 }, defect_deductions: { CRACKED_SCREEN: 12000, BATTERY_DEGRADED: 4000, WATER_DAMAGE: 20000, MISSING_PARTS: 5000, WONT_POWER_ON: 15000, DENTED_BODY: 3000 } }
              as: CatalogAdmin
              captures: { dm_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "sm3@x.com", full_name: "SM3" }
              as: CatalogAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /trade-ins"
              payload: { customer_id: "${cust_id}", device_model_id: "${dm_id}", declared_grade: "FLAWLESS" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ti_id: $.data.id }
            - call: "POST /trade-ins/${ti_id}/quote"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /trade-ins/${ti_id}/ship-kit"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /trade-ins/${ti_id}/receive"
              payload: {}
              as: GradingAgent
            - call: "POST /trade-ins/${ti_id}/inspect"
              payload: { verified_grade: "FLAWLESS", verified_defects: [], verified_powers_on: true }
              as: GradingAgent
            - call: "POST /trade-ins/${ti_id}/payouts"
              payload: { method: "ACH" }
              as: FinanceOperator
          trigger:
            - call: "POST /trade-ins/${ti_id}/cancel"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "TradeIn.${ti_id}.status == PAID"

      - name: accept_requote_happy_path_honors_requote
        claim_type: Valid Transition
        grounds: [state_machines.TradeIn.REQUOTED_to_ACCEPTED, entities.TradeIn.fields.final_value_cents]
        distinguishing_aspect: "Accepting a re-quote (REQUOTED->ACCEPTED) honors the REQUOTE quote: final_value_cents == inspected_value 16000, REQUOTE quote HONORED."
        test_recipe:
          setup: ["Trade-in inspected FAIR+WATER_DAMAGE -> REQUOTED at 16000; client reads current version."]
          setup_api_calls:
            - call: "POST /catalogs"
              payload: { name: "TIC", currency: "USD", price_lock_hours: 168, requote_tolerance_pct: 0.15, data_wipe_required_categories: [], recycle_floor_value_cents: 5000 }
              as: CatalogAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /catalogs/${cat_id}/device-models"
              payload: { manufacturer: "Acme", model_code: "PHN-1", category: "SMARTPHONE", base_value_cents: 60000, condition_multipliers: { FLAWLESS: 1.0, GOOD: 0.8, FAIR: 0.6, POOR: 0.35 }, defect_deductions: { CRACKED_SCREEN: 12000, BATTERY_DEGRADED: 4000, WATER_DAMAGE: 20000, MISSING_PARTS: 5000, WONT_POWER_ON: 15000, DENTED_BODY: 3000 } }
              as: CatalogAdmin
              captures: { dm_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "sm4@x.com", full_name: "SM4" }
              as: CatalogAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /trade-ins"
              payload: { customer_id: "${cust_id}", device_model_id: "${dm_id}", declared_grade: "GOOD", declared_defects: ["CRACKED_SCREEN"], declared_powers_on: true }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ti_id: $.data.id }
            - call: "POST /trade-ins/${ti_id}/quote"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /trade-ins/${ti_id}/ship-kit"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /trade-ins/${ti_id}/receive"
              payload: {}
              as: GradingAgent
            - call: "POST /trade-ins/${ti_id}/inspect"
              payload: { verified_grade: "FAIR", verified_defects: ["WATER_DAMAGE"], verified_powers_on: true }
              as: GradingAgent
              captures: { ti_ver: $.data.version }
          trigger:
            - call: "POST /trade-ins/${ti_id}/accept-requote"
              payload: { expected_trade_in_version: "${ti_ver}" }
              as: Customer
              as_user_id: "${cust_id}"
          assert:
            - "TradeIn.${ti_id}.status == ACCEPTED"
            - "TradeIn.${ti_id}.final_value_cents == 16000"
            - "GET /trade-ins/${ti_id}/quotes -> the REQUOTE Quote.status == HONORED"

      - name: decline_requote_returns_device_and_rejects
        claim_type: Valid Transition
        grounds: [state_machines.TradeIn.REQUOTED_to_REJECTED, entities.DispositionRecord.fields.disposition]
        distinguishing_aspect: "Declining a re-quote drives TradeIn to REJECTED, supersedes the REQUOTE quote, and creates a RETURN_TO_CUSTOMER disposition record."
        test_recipe:
          setup: ["Trade-in REQUOTED at 16000; client reads current version then declines."]
          setup_api_calls:
            - call: "POST /catalogs"
              payload: { name: "TIC", currency: "USD", price_lock_hours: 168, requote_tolerance_pct: 0.15, data_wipe_required_categories: [], recycle_floor_value_cents: 5000 }
              as: CatalogAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /catalogs/${cat_id}/device-models"
              payload: { manufacturer: "Acme", model_code: "PHN-1", category: "SMARTPHONE", base_value_cents: 60000, condition_multipliers: { FLAWLESS: 1.0, GOOD: 0.8, FAIR: 0.6, POOR: 0.35 }, defect_deductions: { CRACKED_SCREEN: 12000, BATTERY_DEGRADED: 4000, WATER_DAMAGE: 20000, MISSING_PARTS: 5000, WONT_POWER_ON: 15000, DENTED_BODY: 3000 } }
              as: CatalogAdmin
              captures: { dm_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "sm5@x.com", full_name: "SM5" }
              as: CatalogAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /trade-ins"
              payload: { customer_id: "${cust_id}", device_model_id: "${dm_id}", declared_grade: "GOOD", declared_defects: ["CRACKED_SCREEN"], declared_powers_on: true }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ti_id: $.data.id }
            - call: "POST /trade-ins/${ti_id}/quote"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /trade-ins/${ti_id}/ship-kit"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /trade-ins/${ti_id}/receive"
              payload: {}
              as: GradingAgent
            - call: "POST /trade-ins/${ti_id}/inspect"
              payload: { verified_grade: "FAIR", verified_defects: ["WATER_DAMAGE"], verified_powers_on: true }
              as: GradingAgent
              captures: { ti_ver: $.data.version }
          trigger:
            - call: "POST /trade-ins/${ti_id}/decline-requote"
              payload: { expected_trade_in_version: "${ti_ver}" }
              as: Customer
              as_user_id: "${cust_id}"
          assert:
