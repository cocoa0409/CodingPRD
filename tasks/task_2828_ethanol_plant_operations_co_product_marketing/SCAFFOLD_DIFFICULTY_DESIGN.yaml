# =============================================================================
# §1.8 SCAFFOLD DIFFICULTY DESIGN — Ethanol Plant Operations & Co-Product
# Marketing (task 2828). Nine §0.5 difficulty rules, two differentiated
# instances each = 18 instances. Every `grounds:` ref resolves into
# SCAFFOLD.yaml §1.1-§1.6; every setup chain runs from an empty database using
# only §1.5 endpoints; every numeric assertion below was executed against the
# §1.3 formulas and their constants before being written down.
#
# Fixture conventions used throughout:
#   * logical clock default 2026-08-01T00:00:00Z, advanced forward only
#   * plant base_grind_cap_bushels 120000, baseline_ci_g_per_mj 60.0
#   * marks: corn 440.00 c/bu, ethanol 178.00 c/gal, natgas 265.75 c/MMBtu,
#     soybean meal 330.00 USD/ton, SBO 46.80 c/lb
#   * tanks T-101 ETHANOL_200_PROOF, T-201 DENATURANT, T-301 DENATURED_E100
#     (settling_buffer_minutes 120), track TRK-A spot_capacity 110
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: crush_margin_mark_to_market_vs_realized_diverge_on_same_month
        grounds:
          - calculations.crush_margin
          - calculations.plant_inventory_and_coverage
          - calculations.co_product_invoice
          - entities.Plant.fields.rolling_yield_gal_per_bushel
          - entities.UnitTrainShipment.fields.invoice_amount_cents
          - entities.CornDelivery.fields.net_price_cents_per_bushel
        distinguishing_aspect: |
          The two crush-margin variants read disjoint input sets over identical
          plant state — MARK_TO_MARKET prices corn at mark_corn_cents_per_bushel
          440.00 while REALIZED prices it at the volume-weighted
          net_price_cents_per_bushel 411.20 of SETTLED deliveries — so the same
          GET returns net 300.82 and net 336.46 in one response, 35.64 c/bu apart.
        test_recipe:
          setup:
            - "Plant exists with base_grind_cap_bushels 120000, coverage_floor_bushels 5000, baseline_ci_g_per_mj 60.0 and rin_generation_enabled true."
            - "Marks posted for 2026-10: corn 440.00, ethanol 178.00, natgas 265.75, soybean meal 330.00, SBO 46.80."
            - "One SETTLED delivery of 91218.48 net dry bushels at net_price_cents_per_bushel 411.20."
            - "One COMPLETED 90000.00-bushel batch producing 259920.00 gal ethanol and 765.000 tons DDGS, so rolling_yield_gal_per_bushel is 2.888."
            - "One INVOICED unit train shipment of 265900.00 gal at 181.50 c/gal (invoice_amount_cents 48260850)."
            - "One SHIPPED INDEX DDGS sale of 750.000 tons that settled at 326.37 USD/ton (invoice_amount_cents 23866834), after which the soybean meal mark is restored to 330.00."
          setup_api_calls:
            - call: "POST /ethanol-ops/plants"
              payload: { name: "Prairie Gold Ethanol", nameplate_capacity_gallons: 120000000, base_grind_cap_bushels: 120000, coverage_floor_bushels: 5000, baseline_ci_g_per_mj: 60.0, rin_generation_enabled: true }
              as: PlantManager
              as_user_id: "pm-01"
              captures: { plant_id: $.data.id }
            - call: "POST /ethanol-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlantManager
              as_user_id: "pm-01"
            - call: "POST /ethanol-ops/plants/${plant_id}/market-marks"
              payload: { marks_effective_month: "2026-10", mark_corn_cents_per_bushel: 440.00, mark_ethanol_cents_per_gallon: 178.00, mark_natgas_cents_per_mmbtu: 265.75, mark_soybean_meal_usd_per_ton: 330.00, mark_sbo_cents_per_lb: 46.80 }
              as: PlantManager
              as_user_id: "pm-01"
            - call: "POST /ethanol-ops/product-tanks"
              payload: { tank_code: "T-101", product_type: "ETHANOL_200_PROOF", capacity_gallons: 1000000.00, opening_gallons: 0.00 }
              as: ProcessOperator
              as_user_id: "op-01"
              captures: { t101_id: $.data.id }
            - call: "POST /ethanol-ops/product-tanks"
              payload: { tank_code: "T-201", product_type: "DENATURANT", capacity_gallons: 600000.00, opening_gallons: 500000.00 }
              as: ProcessOperator
              as_user_id: "op-01"
              captures: { t201_id: $.data.id }
            - call: "POST /ethanol-ops/product-tanks"
              payload: { tank_code: "T-301", product_type: "DENATURED_E100", capacity_gallons: 1000000.00, opening_gallons: 0.00, settling_buffer_minutes: 120 }
              as: ProcessOperator
              as_user_id: "op-01"
              captures: { t301_id: $.data.id }
            - call: "POST /ethanol-ops/corn-contracts"
              payload: { supplier_name: "Cedar Ridge Elevator", delivery_month: "2026-10", bushels_contracted: 200000.00, basis_cents_per_bushel: -18.0 }
              as: GrainBuyer
              as_user_id: "gb-01"
              captures: { c1_id: $.data.id }
            - call: "POST /ethanol-ops/corn-contracts/${c1_id}/price"
              payload: { futures_price_cents_per_bushel: 458.0 }
              as: GrainBuyer
              as_user_id: "gb-01"
            - call: "POST /ethanol-ops/corn-contracts/${c1_id}/deliveries"
              payload: { ticket_number: "TK-0001", gross_weight_lbs: 5500000.00, tare_weight_lbs: 300000.00 }
              as: ScaleOperator
              as_user_id: "scale-01"
              captures: { d1_id: $.data.id }
            - call: "POST /ethanol-ops/corn-deliveries/${d1_id}/grade"
              payload: { moisture_pct: 16.50, test_weight_lb_per_bu: 53.2, foreign_material_pct: 3.40, damaged_kernels_pct: 6.00, aflatoxin_ppb: 4 }
              as: ScaleOperator
              as_user_id: "scale-01"
            - call: "POST /ethanol-ops/corn-deliveries/${d1_id}/settle"
              payload: {}
              as: GrainAccountant
              as_user_id: "acct-01"
            - call: "POST /ethanol-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-09-03T00:00:00Z" }
              as: ProcessOperator
              as_user_id: "op-01"
            - call: "POST /ethanol-ops/fermentation-batches"
              payload: { batch_code: "FB-1001", corn_bushels_charged: 90000.00, charge_test_weight_lb_per_bu: 56.5, destination_tank_id: "${t101_id}" }
              as: ProcessOperator
              as_user_id: "op-01"
              captures: { b1_id: $.data.id }
            - call: "POST /ethanol-ops/fermentation-batches/${b1_id}/health-readings"
              payload: { hours_elapsed: 12, lactic_acid_ppm: 400, acetic_acid_ppm: 150, temperature_c: 32.0 }
              as: ProcessOperator
              as_user_id: "op-01"
            - call: "POST /ethanol-ops/fermentation-batches/${b1_id}/distill"
              payload: {}
              as: ProcessOperator
              as_user_id: "op-01"
            - call: "POST /ethanol-ops/fermentation-batches/${b1_id}/complete"
              payload: {}
              as: ProcessOperator
              as_user_id: "op-01"
            - call: "POST /ethanol-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-09-04T06:00:00Z" }
              as: ProcessOperator
              as_user_id: "op-01"
            - call: "GET /ethanol-ops/product-tanks/${t301_id}"
              payload: {}
              as: ProcessOperator
              as_user_id: "op-01"
              captures: { t301_v: $.data.version }
            - call: "POST /ethanol-ops/denaturant-blends"
              payload: { blend_code: "BL-2001", neat_source_tank_id: "${t101_id}", denaturant_source_tank_id: "${t201_id}", destination_tank_id: "${t301_id}", expected_destination_tank_version: "${t301_v}", neat_gallons: 259920.00, denaturant_gallons: 5990.00, window_start: "2026-09-04T08:00:00Z", window_end: "2026-09-04T12:00:00Z" }
              as: ProcessOperator
              as_user_id: "op-01"
              captures: { bl1_id: $.data.id }
            - call: "POST /ethanol-ops/denaturant-blends/${bl1_id}/execute"
              payload: {}
              as: ProcessOperator
              as_user_id: "op-01"
            - call: "POST /ethanol-ops/loading-tracks"
              payload: { track_code: "TRK-A", spot_capacity: 110, loading_rate_cars_per_hour: 20, is_active: true }
              as: LogisticsCoordinator
              as_user_id: "log-01"
              captures: { trk_id: $.data.id, trk_v: $.data.version }
            - call: "POST /ethanol-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-09-05T05:00:00Z" }
              as: LogisticsCoordinator
              as_user_id: "log-01"
            - call: "POST /ethanol-ops/unit-train-shipments"
              payload: { shipment_code: "UT-3001", track_id: "${trk_id}", expected_track_version: "${trk_v}", source_tank_id: "${t301_id}", destination_terminal: "Chicago Rail Terminal", railcar_count: 100, gallons_per_railcar: 2659.00, window_start: "2026-09-05T06:00:00Z", window_end: "2026-09-05T12:00:00Z", price_cents_per_gallon: 181.50 }
              as: LogisticsCoordinator
              as_user_id: "log-01"
              captures: { sh1_id: $.data.id }
            - call: "POST /ethanol-ops/unit-train-shipments/${sh1_id}/load"
              payload: {}
              as: LogisticsCoordinator
              as_user_id: "log-01"
            - call: "POST /ethanol-ops/unit-train-shipments/${sh1_id}/bill-of-lading"
              payload: { bol_number: "BOL-0001" }
              as: LogisticsCoordinator
              as_user_id: "log-01"
            - call: "POST /ethanol-ops/unit-train-shipments/${sh1_id}/invoice"
              payload: {}
              as: LogisticsCoordinator
              as_user_id: "log-01"
            - call: "POST /ethanol-ops/co-product-sales"
              payload: { sale_code: "CS-4001", buyer_name: "Heartland Feeds", product: "DDGS_DRY", pricing_basis: "INDEX", quantity: 750.000, index_pct: 0.92, freight_rate_per_unit: 3.25, quote_expires_at: "2026-09-10T00:00:00Z" }
              as: GrainBuyer
              as_user_id: "gb-01"
              captures: { s1_id: $.data.id }
            - call: "POST /ethanol-ops/plants/${plant_id}/market-marks"
              payload: { marks_effective_month: "2026-10", mark_corn_cents_per_bushel: 440.00, mark_ethanol_cents_per_gallon: 178.00, mark_natgas_cents_per_mmbtu: 265.75, mark_soybean_meal_usd_per_ton: 362.50, mark_sbo_cents_per_lb: 46.80 }
              as: RiskManager
              as_user_id: "risk-01"
            - call: "POST /ethanol-ops/co-product-sales/${s1_id}/respond"
              payload: { decision: "ACCEPT" }
              as: GrainBuyer
              as_user_id: "gb-01"
            - call: "POST /ethanol-ops/co-product-sales/${s1_id}/ship"
              payload: {}
              as: LogisticsCoordinator
              as_user_id: "log-01"
            - call: "POST /ethanol-ops/plants/${plant_id}/market-marks"
              payload: { marks_effective_month: "2026-10", mark_corn_cents_per_bushel: 440.00, mark_ethanol_cents_per_gallon: 178.00, mark_natgas_cents_per_mmbtu: 265.75, mark_soybean_meal_usd_per_ton: 330.00, mark_sbo_cents_per_lb: 46.80 }
              as: PlantManager
              as_user_id: "pm-01"
          trigger:
            - call: "GET /ethanol-ops/plants/${plant_id}/crush-margin"
              payload: {}
              as: RiskManager
              as_user_id: "risk-01"
          assert:
            - "MARK_TO_MARKET ethanol leg == 514.06 cents per bushel"
            - "MARK_TO_MARKET ddgs leg == 258.06 cents per bushel"
            - "MARK_TO_MARKET corn oil leg == 22.46 cents per bushel"
            - "MARK_TO_MARKET gross == 794.58 and MARK_TO_MARKET corn cost == 440.00"
            - "MARK_TO_MARKET natgas cost == 21.26 and conversion cost == 32.50"
            - "MARK_TO_MARKET net == 300.82 cents per bushel"
            - "REALIZED ethanol leg == 536.23 cents per bushel"
            - "REALIZED co-product leg == 265.19 cents per bushel"
            - "REALIZED corn cost == 411.20 cents per bushel, not the 440.00 mark"
            - "REALIZED net == 336.46 cents per bushel"
            - "REALIZED net - MARK_TO_MARKET net == 35.64 cents per bushel in the same response"
            - "Plant.${plant_id}.rolling_yield_gal_per_bushel == 2.888"

      - name: co_product_settlement_price_collar_diverges_from_quote_basis
        grounds:
          - calculations.co_product_settlement_price
          - calculations.co_product_invoice
          - state_machines.CoProductSale.status.QUOTED_to_ACCEPTED
          - entities.CoProductSale.fields.collar_ceiling
          - entities.CoProductSale.fields.quote_reference_mark
        distinguishing_aspect: |
          Two DDGS_DRY sales of 750.000 tons that both carry quoted_price 303.60
          settle at different prices once the soybean meal mark rallies to
          362.50: the FLAT_QUOTE variant ignores the mark and settles at 303.60
          with null collar bounds, while the INDEX_RESTRIKE variant re-strikes to
          333.50 and is truncated to the 326.37 collar ceiling — a 22.77 USD/ton
          divergence on the same entity in the same instant.
        test_recipe:
          setup:
            - "Plant exists with marks posted for 2026-10 including soybean meal 330.00 USD/ton."
            - "Sale CS-5001 is a FLAT DDGS_DRY quote of 750.000 tons at quoted_price 303.60 with freight_rate_per_unit 3.25."
            - "Sale CS-5002 is an INDEX DDGS_DRY quote of 750.000 tons with index_pct 0.92, so the server derives quoted_price 303.60 from the 330.00 mark, with freight_rate_per_unit 3.25."
            - "The soybean meal mark is then re-posted at 362.50 USD/ton, before either sale is answered."
          setup_api_calls:
            - call: "POST /ethanol-ops/plants"
              payload: { name: "Prairie Gold Ethanol", nameplate_capacity_gallons: 120000000, base_grind_cap_bushels: 120000, coverage_floor_bushels: 5000, baseline_ci_g_per_mj: 60.0, rin_generation_enabled: true }
              as: PlantManager
              as_user_id: "pm-01"
              captures: { plant_id: $.data.id }
            - call: "POST /ethanol-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlantManager
              as_user_id: "pm-01"
            - call: "POST /ethanol-ops/plants/${plant_id}/market-marks"
              payload: { marks_effective_month: "2026-10", mark_corn_cents_per_bushel: 440.00, mark_ethanol_cents_per_gallon: 178.00, mark_natgas_cents_per_mmbtu: 265.75, mark_soybean_meal_usd_per_ton: 330.00, mark_sbo_cents_per_lb: 46.80 }
              as: PlantManager
              as_user_id: "pm-01"
            - call: "POST /ethanol-ops/co-product-sales"
              payload: { sale_code: "CS-5001", buyer_name: "Heartland Feeds", product: "DDGS_DRY", pricing_basis: "FLAT", quantity: 750.000, quoted_price: 303.60, freight_rate_per_unit: 3.25, quote_expires_at: "2026-09-10T00:00:00Z" }
              as: GrainBuyer
              as_user_id: "gb-01"
              captures: { flat_id: $.data.id }
            - call: "POST /ethanol-ops/co-product-sales"
              payload: { sale_code: "CS-5002", buyer_name: "Heartland Feeds", product: "DDGS_DRY", pricing_basis: "INDEX", quantity: 750.000, index_pct: 0.92, freight_rate_per_unit: 3.25, quote_expires_at: "2026-09-10T00:00:00Z" }
              as: GrainBuyer
              as_user_id: "gb-01"
              captures: { index_id: $.data.id, index_quoted_price: $.data.quoted_price }
            - call: "POST /ethanol-ops/plants/${plant_id}/market-marks"
              payload: { marks_effective_month: "2026-10", mark_corn_cents_per_bushel: 440.00, mark_ethanol_cents_per_gallon: 178.00, mark_natgas_cents_per_mmbtu: 265.75, mark_soybean_meal_usd_per_ton: 362.50, mark_sbo_cents_per_lb: 46.80 }
              as: RiskManager
              as_user_id: "risk-01"
          trigger:
            - call: "POST /ethanol-ops/co-product-sales/${flat_id}/respond"
              payload: { decision: "ACCEPT" }
              as: GrainBuyer
              as_user_id: "gb-01"
            - call: "POST /ethanol-ops/co-product-sales/${index_id}/respond"
              payload: { decision: "ACCEPT" }
              as: GrainBuyer
              as_user_id: "gb-01"
          assert:
            - "CoProductSale.${index_id}.quoted_price == 303.60 (derived from the 330.00 mark at quote time)"
            - "CoProductSale.${flat_id}.settlement_price == 303.60"
            - "CoProductSale.${flat_id}.collar_floor == null and CoProductSale.${flat_id}.collar_ceiling == null"
            - "CoProductSale.${flat_id}.subtotal_usd == 227700.00"
            - "CoProductSale.${flat_id}.volume_rebate_usd == 3415.50"
            - "CoProductSale.${flat_id}.freight_usd == 2437.50"
            - "CoProductSale.${flat_id}.invoice_amount_cents == 22184700"
            - "CoProductSale.${index_id}.collar_floor == 280.83 and CoProductSale.${index_id}.collar_ceiling == 326.37"
            - "CoProductSale.${index_id}.settlement_price == 326.37, not the re-struck 333.50"
            - "CoProductSale.${index_id}.subtotal_usd == 244777.50"
            - "CoProductSale.${index_id}.volume_rebate_usd == 3671.66"
            - "CoProductSale.${index_id}.invoice_amount_cents == 23866834"
            - "CoProductSale.${index_id}.invoice_amount_cents - CoProductSale.${flat_id}.invoice_amount_cents == 1682134"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: health_index_per_reading_rounding_beats_weight_then_round
        grounds:
          - calculations.fermentation_health_index
          - entities.FermentationHealthReading.fields.reading_score
          - entities.FermentationBatch.fields.fermentation_health_index
          - state_machines.FermentationBatch.status.FERMENTING_to_HEALTH_WATCH
        distinguishing_aspect: |
          The index is a three-stage composite — per-reading penalty capping,
          rounding each reading_score to 2 decimals, then normalising [0.5, 0.3,
          0.2] to 6 decimals and weighting the ROUNDED scores — and the pinned
          order yields 62.80 where weighting the unrounded 68.065 / 94.119 /
          41.889 raw scores yields 62.79.
        test_recipe:
          setup:
            - "Plant exists with base_grind_cap_bushels 120000 and coverage_floor_bushels 5000."
            - "Tank T-101 is an empty ETHANOL_200_PROOF tank."
            - "Contract C-1 is PRICED at futures 458.0 with basis -18.0 and one settled 940.00-bushel delivery, so corn_inventory_bushels is 940.00."
            - "Batch FB-2001 is charged with 900.00 bushels at charge test weight 54.0."
            - "Two health readings already exist: hours_elapsed 12 with lactic 1163 / acetic 344 / 35.4 C, and hours_elapsed 24 with lactic 820 / acetic 361 / 31.8 C."
          setup_api_calls:
            - call: "POST /ethanol-ops/plants"
              payload: { name: "Prairie Gold Ethanol", nameplate_capacity_gallons: 120000000, base_grind_cap_bushels: 120000, coverage_floor_bushels: 5000, baseline_ci_g_per_mj: 60.0, rin_generation_enabled: true }
              as: PlantManager
              as_user_id: "pm-01"
              captures: { plant_id: $.data.id }
            - call: "POST /ethanol-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlantManager
              as_user_id: "pm-01"
            - call: "POST /ethanol-ops/product-tanks"
              payload: { tank_code: "T-101", product_type: "ETHANOL_200_PROOF", capacity_gallons: 1000000.00, opening_gallons: 0.00 }
              as: ProcessOperator
              as_user_id: "op-01"
              captures: { t101_id: $.data.id }
            - call: "POST /ethanol-ops/corn-contracts"
              payload: { supplier_name: "Cedar Ridge Elevator", delivery_month: "2026-10", bushels_contracted: 200000.00, basis_cents_per_bushel: -18.0 }
              as: GrainBuyer
              as_user_id: "gb-01"
              captures: { c1_id: $.data.id }
            - call: "POST /ethanol-ops/corn-contracts/${c1_id}/price"
              payload: { futures_price_cents_per_bushel: 458.0 }
              as: GrainBuyer
              as_user_id: "gb-01"
            - call: "POST /ethanol-ops/corn-contracts/${c1_id}/deliveries"
              payload: { ticket_number: "TK-0001", gross_weight_lbs: 78640.00, tare_weight_lbs: 26000.00 }
              as: ScaleOperator
              as_user_id: "scale-01"
              captures: { d1_id: $.data.id }
            - call: "POST /ethanol-ops/corn-deliveries/${d1_id}/grade"
              payload: { moisture_pct: 15.00, test_weight_lb_per_bu: 54.0, foreign_material_pct: 3.00, damaged_kernels_pct: 5.00, aflatoxin_ppb: 3 }
              as: ScaleOperator
              as_user_id: "scale-01"
            - call: "POST /ethanol-ops/corn-deliveries/${d1_id}/settle"
              payload: {}
              as: GrainAccountant
              as_user_id: "acct-01"
            - call: "POST /ethanol-ops/fermentation-batches"
              payload: { batch_code: "FB-2001", corn_bushels_charged: 900.00, charge_test_weight_lb_per_bu: 54.0, destination_tank_id: "${t101_id}" }
              as: ProcessOperator
              as_user_id: "op-01"
              captures: { b1_id: $.data.id }
            - call: "POST /ethanol-ops/fermentation-batches/${b1_id}/health-readings"
              payload: { hours_elapsed: 12, lactic_acid_ppm: 1163, acetic_acid_ppm: 344, temperature_c: 35.4 }
              as: ProcessOperator
              as_user_id: "op-01"
              captures: { r1_score: $.data.reading_score }
            - call: "POST /ethanol-ops/fermentation-batches/${b1_id}/health-readings"
              payload: { hours_elapsed: 24, lactic_acid_ppm: 820, acetic_acid_ppm: 361, temperature_c: 31.8 }
              as: ProcessOperator
              as_user_id: "op-01"
              captures: { r2_score: $.data.reading_score }
          trigger:
            - call: "POST /ethanol-ops/fermentation-batches/${b1_id}/health-readings"
              payload: { hours_elapsed: 36, lactic_acid_ppm: 1237, acetic_acid_ppm: 552, temperature_c: 36.9 }
              as: ProcessOperator
              as_user_id: "op-01"
              captures: { r3_score: $.data.reading_score }
          assert:
            - "${r1_score} == 68.07 (lactic penalty 17.06, acetic penalty 3.56, temperature penalty 11.31)"
            - "${r2_score} == 94.12 (lactic penalty 0.94, acetic penalty 4.94, temperature penalty 0.00)"
            - "${r3_score} == 41.89 (lactic penalty 20.54, acetic penalty 20.41, temperature penalty 17.16)"
            - "FermentationBatch.${b1_id}.fermentation_health_index == 62.80"
            - "FermentationBatch.${b1_id}.fermentation_health_index != 62.79"
            - "FermentationBatch.${b1_id}.status == HEALTH_WATCH"

      - name: co_product_invoice_rebate_tier_keyed_on_subtotal_not_net
        grounds:
          - calculations.co_product_invoice
          - calculations.co_product_settlement_price
          - entities.CoProductSale.fields.volume_rebate_usd
          - entities.CoProductSale.fields.freight_usd
        distinguishing_aspect: |
          The invoice composes a unit conversion, an inclusive tier ladder and an
          inclusive freight cap in one pinned order: a 200.000-ton FLAT sale at
          251.00 gives subtotal exactly 50200.00, which selects the HIGH 1.50%
          tier and produces 4694700 cents, whereas selecting the tier on the
          freight-net 47700.00 would select the LOW 0.75% tier and produce
          4732350 cents.
        test_recipe:
          setup:
            - "Plant exists with marks posted for 2026-10 (soybean meal 330.00 USD/ton)."
            - "Sale CS-6001 is a FLAT DDGS_DRY quote for 200.000 tons at quoted_price 251.00 with freight_rate_per_unit 12.50, so freight lands exactly on the 2500.00 cap."
          setup_api_calls:
