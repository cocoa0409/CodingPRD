          The eligible population is walked at its two smallest cardinalities on the same engagement: at
          eligible_component_count 0 the plan is refused with ERR_EMPTY_SAMPLE_POPULATION, and at
          eligible_component_count 1 it succeeds with component_sample_size 1 - not 2 - because the
