scaffold_difficulty_design:
  # ===========================================================================
  # Rule 1 — dual_variant_calc (different entity domains)
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: campus_index_campus_scoped_vs_system_projected
        grounds:
          - calculations.campus_composite_index
          - entities.Campus.fields.composite_index_pct
          - endpoints: "GET /accreditation/systems/{systemId}/dashboard"
        distinguishing_aspect: |
          campus_composite_index has two variants on different subjects: the
          persisted per-campus variant (Campus.composite_index_pct, recomputed on
          finalize) and the read-time system_scoped_projection variant
          (dashboard aggregate over all IN_SCOPE campuses). Same finalized
          ratings, different aggregation domains, different values.
        test_recipe:
          setup:
            - "One system with two campuses A (enrollment 500) and B (enrollment 300), both IN_SCOPE"
            - "Standards: L1 weight 30, T1 weight 50"
            - "Term created and advanced to SELF_STUDY (requires every campus x standard rating row to exist)"
            - "Campus A ratings: L1=4 FINALIZED, T1=3 FINALIZED"
            - "Campus B ratings: L1=2 FINALIZED, T1=1 FINALIZED"
            - "Campus A composite = (4*30+3*50)/(80)*25 = 84.375 -> 84.38"
            - "System projection = (4*30+3*50+2*30+1*50)/(160)*25 = (120+150+60+50)/160*25 = 380/160*25 = 59.375 -> 59.38"
          setup_api_calls:
            - call: "POST /accreditation/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: AccreditationOfficer
            - call: "POST /accreditation/standards"
              payload: { code: "L1", title: "Leadership 1", domain: "LEADERSHIP", weight_pct: 30, evidence_min_items: 0 }
              as: AccreditationOfficer
              captures: { std_l1: $.data.id }
            - call: "POST /accreditation/standards"
              payload: { code: "T1", title: "Teaching 1", domain: "LEARNING", weight_pct: 50, evidence_min_items: 0 }
              as: AccreditationOfficer
              captures: { std_t1: $.data.id }
            - call: "POST /accreditation/systems"
              payload: { name: "Dual County Schools", system_type: "DISTRICT" }
              as: AccreditationOfficer
              captures: { sys_id: $.data.id }
            - call: "POST /accreditation/systems/${sys_id}/campuses"
              payload: { name: "Campus A", enrollment: 500 }
              as: AccreditationOfficer
              captures: { campus_a: $.data.id }
            - call: "POST /accreditation/systems/${sys_id}/campuses"
              payload: { name: "Campus B", enrollment: 300 }
              as: AccreditationOfficer
              captures: { campus_b: $.data.id }
            - call: "POST /accreditation/systems/${sys_id}/terms"
              payload: { term_start: "2026-09-01T00:00:00Z", term_length_years: 5 }
              as: AccreditationOfficer
              captures: { term_id: $.data.id, term_v: $.data.version }
            # PREPARATION -> SELF_STUDY requires one rating row per campus x standard
            - call: "POST /accreditation/ratings"
              payload: { term_id: "${term_id}", campus_id: "${campus_a}", standard_id: "${std_l1}", rating: 4, expected_term_version: "${term_v}" }
              as: SchoolLeader
              captures: { r_al1: $.data.id }
            - call: "GET /accreditation/terms/${term_id}"
              payload: {}
              as: AccreditationOfficer
              captures: { term_v2: $.data.version }
            - call: "POST /accreditation/ratings"
              payload: { term_id: "${term_id}", campus_id: "${campus_a}", standard_id: "${std_t1}", rating: 3, expected_term_version: "${term_v2}" }
              as: SchoolLeader
              captures: { r_at1: $.data.id }
            - call: "GET /accreditation/terms/${term_id}"
              payload: {}
              as: AccreditationOfficer
              captures: { term_v3: $.data.version }
            - call: "POST /accreditation/ratings"
              payload: { term_id: "${term_id}", campus_id: "${campus_b}", standard_id: "${std_l1}", rating: 2, expected_term_version: "${term_v3}" }
              as: SchoolLeader
              captures: { r_bl1: $.data.id }
            - call: "GET /accreditation/terms/${term_id}"
              payload: {}
              as: AccreditationOfficer
              captures: { term_v4: $.data.version }
            - call: "POST /accreditation/ratings"
              payload: { term_id: "${term_id}", campus_id: "${campus_b}", standard_id: "${std_t1}", rating: 1, expected_term_version: "${term_v4}" }
              as: SchoolLeader
              captures: { r_bt1: $.data.id }
            - call: "POST /accreditation/terms/${term_id}/advance"
              payload: {}
              as: AccreditationOfficer
            # Now in SELF_STUDY: submit + finalize all four
            - call: "POST /accreditation/ratings/${r_al1}/submit"
              payload: {}
              as: SchoolLeader
            - call: "POST /accreditation/ratings/${r_al1}/finalize"
              payload: {}
              as: AccreditationOfficer
            - call: "POST /accreditation/ratings/${r_at1}/submit"
              payload: {}
              as: SchoolLeader
            - call: "POST /accreditation/ratings/${r_at1}/finalize"
              payload: {}
              as: AccreditationOfficer
            - call: "POST /accreditation/ratings/${r_bl1}/submit"
              payload: {}
              as: SchoolLeader
            - call: "POST /accreditation/ratings/${r_bl1}/finalize"
              payload: {}
              as: AccreditationOfficer
            - call: "POST /accreditation/ratings/${r_bt1}/submit"
              payload: {}
              as: SchoolLeader
            - call: "POST /accreditation/ratings/${r_bt1}/finalize"
              payload: {}
              as: AccreditationOfficer
          trigger:
            - call: "GET /accreditation/campuses/${campus_a}"
              payload: {}
              as: AccreditationOfficer
            - call: "GET /accreditation/systems/${sys_id}/dashboard"
              payload: {}
              as: AccreditationOfficer
          assert:
            - "Campus.${campus_a}.composite_index_pct == 84.38"
            - "dashboard.projected_index_pct == 59.38"
            - "dashboard.campus_count_in_scope == 2"
            - "dashboard.finalized_rating_count == 4"
            - "Campus A persisted composite (84.38) != system projection (59.38) over identical underlying ratings"

      - name: visit_fee_provisional_vs_final_settlement
        grounds:
          - calculations.visit_fee_invoice_amount
          - entities.Invoice.fields.amount_cents
        distinguishing_aspect: |
          visit_fee_invoice_amount has a provisional_at_confirm variant (counts
          CONFIRMED/IN_FIELD/REPORT_DRAFT visits) and a final_at_report_issued
          variant (counts REPORT_ISSUED only). Identical visit durations produce
          different invoice amounts depending on which variant the issuance
          context selects — a provisional read at CONFIRMED projects 5 days while
          the final invoice issued after REPORT_ISSUED settles only the issued
          visit's days.
        test_recipe:
          setup:
            - "Fee schedule effective 2026-01-01 with visit_day_rate_cents = 75000"
            - "System with one campus; term in REVIEW"
            - "Two visits on the same campus, non-overlapping: V1 2027-03-01..2027-03-04 (3 days), V2 2027-04-10..2027-04-12 (2 days)"
            - "V1 confirmed and advanced to REPORT_ISSUED; V2 still CONFIRMED"
            - "Provisional projection at this moment counts V2 only (CONFIRMED) = 2 days"
            - "Final VISIT_FEE invoice after V1 issued = 3 days * 75000 = 225000"
          setup_api_calls:
            - call: "POST /accreditation/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: AccreditationOfficer
            - call: "POST /accreditation/fee-schedules"
              payload: { effective_from: "2026-01-01T00:00:00Z", base_system_fee_cents: 500000, per_campus_fee_cents: 120000, large_campus_fee_cents: 200000, large_campus_threshold: 1000, visit_day_rate_cents: 75000 }
              as: AccreditationOfficer
            - call: "POST /accreditation/standards"
              payload: { code: "L1", title: "Leadership 1", domain: "LEADERSHIP", weight_pct: 100, evidence_min_items: 0 }
              as: AccreditationOfficer
              captures: { std_l1: $.data.id }
            - call: "POST /accreditation/systems"
              payload: { name: "Pine Valley Schools", system_type: "DISTRICT" }
              as: AccreditationOfficer
              captures: { sys_id: $.data.id }
            - call: "POST /accreditation/systems/${sys_id}/campuses"
              payload: { name: "Pine Campus", enrollment: 400 }
              as: AccreditationOfficer
              captures: { campus_id: $.data.id }
            - call: "POST /accreditation/systems/${sys_id}/terms"
              payload: { term_start: "2026-09-01T00:00:00Z", term_length_years: 5 }
              as: AccreditationOfficer
              captures: { term_id: $.data.id, term_v: $.data.version }
            - call: "POST /accreditation/ratings"
              payload: { term_id: "${term_id}", campus_id: "${campus_id}", standard_id: "${std_l1}", rating: 3, expected_term_version: "${term_v}" }
              as: SchoolLeader
              captures: { r_1: $.data.id }
            - call: "POST /accreditation/terms/${term_id}/advance"
              payload: {}
              as: AccreditationOfficer
            - call: "POST /accreditation/ratings/${r_1}/submit"
              payload: {}
              as: SchoolLeader
            - call: "POST /accreditation/ratings/${r_1}/finalize"
              payload: {}
              as: AccreditationOfficer
            - call: "POST /accreditation/terms/${term_id}/advance"
              payload: {}
              as: AccreditationOfficer
            # term is now REVIEW; create reviewer and visits
            - call: "POST /accreditation/reviewers"
              payload: { full_name: "Rita Reviewer", email: "rita@accreditor.org" }
              as: AccreditationOfficer
              captures: { rev_id: $.data.id }
            - call: "POST /accreditation/terms/${term_id}/visits"
              payload: { campus_id: "${campus_id}", lead_reviewer_id: "${rev_id}", starts_on: "2027-03-01T00:00:00Z", ends_on: "2027-03-04T00:00:00Z" }
              as: AccreditationOfficer
              captures: { visit_1: $.data.id }
            - call: "POST /accreditation/visits/${visit_1}/assignments"
              payload: { reviewer_id: "${rev_id}", role_on_team: "CHAIR" }
              as: AccreditationOfficer
            - call: "POST /accreditation/visits/${visit_1}/confirm"
              payload: {}
              as: AccreditationOfficer
            # move clock into visit, then past end, then issue report
            - call: "POST /accreditation/_clock/set_current_utc"
              payload: { to_iso8601: "2027-03-02T00:00:00Z" }
              as: AccreditationOfficer
            - call: "POST /accreditation/_clock/set_current_utc"
              payload: { to_iso8601: "2027-03-05T00:00:00Z" }
              as: AccreditationOfficer
            - call: "POST /accreditation/visits/${visit_1}/findings"
              payload: { standard_id: "${std_l1}", severity: "RECOMMENDATION", narrative: "Strengthen distributed leadership." }
              as: Reviewer
              as_user_id: "${rev_id}"
              captures: { f_1: $.data.id }
            - call: "POST /accreditation/findings/${f_1}/issue"
              payload: {}
              as: Reviewer
              as_user_id: "${rev_id}"
            - call: "POST /accreditation/visits/${visit_1}/issue-report"
              payload: {}
              as: Reviewer
              as_user_id: "${rev_id}"
            # second visit, confirmed only
            - call: "POST /accreditation/reviewers"
              payload: { full_name: "Vic Reviewer", email: "vic@accreditor.org" }
              as: AccreditationOfficer
              captures: { rev_2: $.data.id }
            - call: "POST /accreditation/terms/${term_id}/visits"
              payload: { campus_id: "${campus_id}", lead_reviewer_id: "${rev_2}", starts_on: "2027-04-10T00:00:00Z", ends_on: "2027-04-12T00:00:00Z" }
              as: AccreditationOfficer
              captures: { visit_2: $.data.id }
            - call: "POST /accreditation/visits/${visit_2}/assignments"
              payload: { reviewer_id: "${rev_2}", role_on_team: "CHAIR" }
              as: AccreditationOfficer
            - call: "POST /accreditation/visits/${visit_2}/confirm"
              payload: {}
              as: AccreditationOfficer
          trigger:
            - call: "POST /accreditation/systems/${sys_id}/invoices"
              payload: { billing_year: 2027, invoice_type: "VISIT_FEE" }
              as: SystemBursar
              captures: { inv_id: $.data.id, inv_amt: $.data.amount_cents }
          assert:
            - "Invoice.${inv_id}.amount_cents == 225000"
            - "Final variant counts only REPORT_ISSUED visit (3 days * 75000); the still-CONFIRMED 2-day visit is excluded from the final settlement"
            - "A provisional read before V1 issued would have counted both (5 days * 75000 = 375000); the variants diverge on identical visit durations"

  # ===========================================================================
  # Rule 2 — combinatorial_formula (different modes)
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: annual_fee_tiered_composition_with_credit
        grounds:
          - calculations.annual_fee_invoice_amount
          - entities.Invoice.fields.amount_cents
          - entities.FeeSchedule.fields.large_campus_threshold
        distinguishing_aspect: |
          Mode (a): >=3 inputs with non-linear interaction — base fee + tiered
          per-campus rate selection keyed on enrollment vs large_campus_threshold
          (>= boundary) + credit offset via min(fee_credit_cents, amount). Tier
          membership, count split, and credit cap interact conditionally.
        test_recipe:
          setup:
            - "Fee schedule: base 500000, per_campus 120000, large 200000, threshold 1000"
            - "System with 3 IN_SCOPE campuses: enrollment 999 (small), 1000 (large — boundary >=), 1500 (large)"
            - "system.fee_credit_cents = 0 (no credit)"
            - "Expected: 500000 + 1*120000 + 2*200000 = 1020000"
          setup_api_calls:
            - call: "POST /accreditation/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: AccreditationOfficer
            - call: "POST /accreditation/fee-schedules"
              payload: { effective_from: "2026-01-01T00:00:00Z", base_system_fee_cents: 500000, per_campus_fee_cents: 120000, large_campus_fee_cents: 200000, large_campus_threshold: 1000, visit_day_rate_cents: 75000 }
              as: AccreditationOfficer
            - call: "POST /accreditation/systems"
              payload: { name: "Tiered County", system_type: "DISTRICT" }
              as: AccreditationOfficer
              captures: { sys_id: $.data.id }
            - call: "POST /accreditation/systems/${sys_id}/campuses"
              payload: { name: "Small Campus", enrollment: 999 }
              as: AccreditationOfficer
            - call: "POST /accreditation/systems/${sys_id}/campuses"
              payload: { name: "Boundary Campus", enrollment: 1000 }
              as: AccreditationOfficer
            - call: "POST /accreditation/systems/${sys_id}/campuses"
              payload: { name: "Large Campus", enrollment: 1500 }
              as: AccreditationOfficer
          trigger:
            - call: "POST /accreditation/systems/${sys_id}/invoices"
              payload: { billing_year: 2026, invoice_type: "ANNUAL_FEE" }
              as: SystemBursar
              captures: { inv_id: $.data.id }
          assert:
            - "Invoice.amount_cents == 1020000"
            - "Enrollment 1000 == threshold bills at the large rate (>= boundary)"
            - "Enrollment 999 bills at the small rate"

      - name: composite_index_nested_rounding_order
        grounds:
          - calculations.campus_composite_index
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters — scaffold pins
          weight-normalize in raw space FIRST, then a single round_half_up to 2
          decimals at the end. The 84.375 half-cent case disambiguates
          round_half_up (84.38) from round_half_even (84.38 vs 84.37 ambiguous
          at the tie — pinned rule resolves it) and from per-line rounding
          (forbidden by the formula's explicit single-round contract).
        test_recipe:
          setup:
            - "Standards: L1 weight 30, T1 weight 50"
            - "One campus with ratings L1=4 FINALIZED, T1=3 FINALIZED"
            - "raw = (4*30 + 3*50)/80 * 25 = 270/80 * 25 = 3.375 * 25 = 84.375"
            - "Pinned order: single round_half_up at the end -> 84.38"
          setup_api_calls:
            - call: "POST /accreditation/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: AccreditationOfficer
            - call: "POST /accreditation/standards"
              payload: { code: "L1", title: "Leadership 1", domain: "LEADERSHIP", weight_pct: 30, evidence_min_items: 0 }
              as: AccreditationOfficer
              captures: { std_l1: $.data.id }
            - call: "POST /accreditation/standards"
              payload: { code: "T1", title: "Teaching 1", domain: "LEARNING", weight_pct: 50, evidence_min_items: 0 }
              as: AccreditationOfficer
              captures: { std_t1: $.data.id }
            - call: "POST /accreditation/systems"
              payload: { name: "Rounding County", system_type: "SINGLE_SCHOOL" }
              as: AccreditationOfficer
              captures: { sys_id: $.data.id }
            - call: "POST /accreditation/systems/${sys_id}/campuses"
              payload: { name: "Only Campus", enrollment: 200 }
              as: AccreditationOfficer
              captures: { campus_id: $.data.id }
            - call: "POST /accreditation/systems/${sys_id}/terms"
              payload: { term_start: "2026-09-01T00:00:00Z", term_length_years: 5 }
              as: AccreditationOfficer
              captures: { term_id: $.data.id, term_v: $.data.version }
            - call: "POST /accreditation/ratings"
              payload: { term_id: "${term_id}", campus_id: "${campus_id}", standard_id: "${std_l1}", rating: 4, expected_term_version: "${term_v}" }
              as: SchoolLeader
              captures: { r_1: $.data.id }
            - call: "GET /accreditation/terms/${term_id}"
              payload: {}
              as: AccreditationOfficer
              captures: { term_v2: $.data.version }
            - call: "POST /accreditation/ratings"
              payload: { term_id: "${term_id}", campus_id: "${campus_id}", standard_id: "${std_t1}", rating: 3, expected_term_version: "${term_v2}" }
              as: SchoolLeader
              captures: { r_2: $.data.id }
            - call: "POST /accreditation/terms/${term_id}/advance"
              payload: {}
              as: AccreditationOfficer
            - call: "POST /accreditation/ratings/${r_1}/submit"
              payload: {}
              as: SchoolLeader
            - call: "POST /accreditation/ratings/${r_1}/finalize"
              payload: {}
              as: AccreditationOfficer
            - call: "POST /accreditation/ratings/${r_2}/submit"
              payload: {}
              as: SchoolLeader
            - call: "POST /accreditation/ratings/${r_2}/finalize"
              payload: {}
              as: AccreditationOfficer
          trigger:
            - call: "GET /accreditation/campuses/${campus_id}"
              payload: {}
              as: AccreditationOfficer
          assert:
            - "Campus.${campus_id}.composite_index_pct == 84.38"
            - "84.375 rounds half-up to 84.38 (not banker's 84.38 vs 84.37 ambiguity resolved by pinned round_half_up at the final step only)"

  # ===========================================================================
  # Rule 3 — non_linear_state_machine (different entities)
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: rating_finalize_reopen_resubmit_cycle
        grounds:
          - state_machines.SelfStudyRating.FINALIZED_to_REOPENED
          - state_machines.SelfStudyRating.REOPENED_to_SUBMITTED
        distinguishing_aspect: |
          SelfStudyRating has a revision cycle DRAFT->SUBMITTED->FINALIZED->
          REOPENED->SUBMITTED->FINALIZED — a non-linear loop on the rating
          entity, distinct from linear pipelines.
        test_recipe:
          setup:
            - "SINGLE_SCHOOL system, one campus, one standard L1 (weight 100, evidence_min_items 0)"
            - "Term in SELF_STUDY; rating L1=2 FINALIZED"
            - "Campus composite after first finalize: (2*100/100)*25 = 50.00"
          setup_api_calls:
            - call: "POST /accreditation/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: AccreditationOfficer
            - call: "POST /accreditation/standards"
              payload: { code: "L1", title: "Leadership 1", domain: "LEADERSHIP", weight_pct: 100, evidence_min_items: 0 }
              as: AccreditationOfficer
              captures: { std_l1: $.data.id }
            - call: "POST /accreditation/systems"
              payload: { name: "Cycle School", system_type: "SINGLE_SCHOOL" }
              as: AccreditationOfficer
              captures: { sys_id: $.data.id }
            - call: "POST /accreditation/systems/${sys_id}/campuses"
              payload: { name: "Main", enrollment: 300 }
              as: AccreditationOfficer
              captures: { campus_id: $.data.id }
            - call: "POST /accreditation/systems/${sys_id}/terms"
              payload: { term_start: "2026-09-01T00:00:00Z", term_length_years: 5 }
              as: AccreditationOfficer
              captures: { term_id: $.data.id, term_v: $.data.version }
            - call: "POST /accreditation/ratings"
              payload: { term_id: "${term_id}", campus_id: "${campus_id}", standard_id: "${std_l1}", rating: 2, expected_term_version: "${term_v}" }
              as: SchoolLeader
              captures: { r_1: $.data.id }
            - call: "POST /accreditation/terms/${term_id}/advance"
              payload: {}
              as: AccreditationOfficer
            - call: "POST /accreditation/ratings/${r_1}/submit"
              payload: {}
              as: SchoolLeader
            - call: "POST /accreditation/ratings/${r_1}/finalize"
              payload: {}
              as: AccreditationOfficer
          trigger:
            - call: "POST /accreditation/ratings/${r_1}/reopen"
              payload: {}
              as: AccreditationOfficer
            - call: "GET /accreditation/campuses/${campus_id}"
              payload: {}
              as: AccreditationOfficer
            - call: "POST /accreditation/ratings/${r_1}/submit"
              payload: {}
              as: SchoolLeader
            - call: "POST /accreditation/ratings/${r_1}/finalize"
              payload: {}
              as: AccreditationOfficer
            - call: "GET /accreditation/ratings/${r_1}"
              payload: {}
              as: AccreditationOfficer
          assert:
            - "After reopen: Rating.status == REOPENED and Campus.composite_index_pct == null (no FINALIZED ratings remain)"
            - "After resubmit+refinalize: Rating.status == FINALIZED and Campus.composite_index_pct == 50.00"
            - "The loop DRAFT->SUBMITTED->FINALIZED->REOPENED->SUBMITTED->FINALIZED is traversable"

      - name: survey_window_threshold_branch_invalidate_vs_close
        grounds:
          - state_machines.SurveyWindow.OPEN_to_CLOSED
        distinguishing_aspect: |
          SurveyWindow OPEN->{CLOSED | INVALIDATED} is a branching fork where
          the target state depends on the participation threshold evaluation at
          close time — a conditional branch, not a linear step. On the entity
          SurveyWindow (different from SelfStudyRating).
        test_recipe:
          setup:
            - "Term in SELF_STUDY; instrument min_participation_pct 67"
            - "Window W_LOW: eligible_count 3, exactly 2 responses (2*100=200 < 67*3=201 -> INVALIDATED on close)"
          setup_api_calls:
            - call: "POST /accreditation/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: AccreditationOfficer
            - call: "POST /accreditation/standards"
              payload: { code: "L1", title: "Leadership 1", domain: "LEADERSHIP", weight_pct: 100, evidence_min_items: 0 }
              as: AccreditationOfficer
              captures: { std_l1: $.data.id }
            - call: "POST /accreditation/systems"
              payload: { name: "Survey County", system_type: "DISTRICT" }
              as: AccreditationOfficer
              captures: { sys_id: $.data.id }
            - call: "POST /accreditation/systems/${sys_id}/campuses"
              payload: { name: "North", enrollment: 500 }
              as: AccreditationOfficer
              captures: { campus_id: $.data.id }
            - call: "POST /accreditation/systems/${sys_id}/terms"
              payload: { term_start: "2026-09-01T00:00:00Z", term_length_years: 5 }
              as: AccreditationOfficer
              captures: { term_id: $.data.id, term_v: $.data.version }
            - call: "POST /accreditation/ratings"
              payload: { term_id: "${term_id}", campus_id: "${campus_id}", standard_id: "${std_l1}", rating: 3, expected_term_version: "${term_v}" }
              as: SchoolLeader
            - call: "POST /accreditation/terms/${term_id}/advance"
              payload: {}
              as: AccreditationOfficer
