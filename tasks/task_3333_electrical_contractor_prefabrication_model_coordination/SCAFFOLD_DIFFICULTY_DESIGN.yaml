  - rule_id: resource_temporal_overlap
    instances:
      - name: hoisting_window_frozen_overlap_on_same_window_id
        grounds:
          - validations[priority=14]
          - entities.PrefabOrder.fields.hoisting_window_id
          - entities.Project.fields.laydown_slots
          - errors[ERR_HOISTING_WINDOW_CONFLICT]
        distinguishing_aspect: |
          Half-open interval semantics with a shared booking identity and an all-or-nothing clash: two orders booked
          against the same hoisting_window_id whose half-open windows [start, end) overlap are both refused, while an
          order whose window merely abuts the frozen one at the identical instant is accepted because the end instant
          is exclusive.
        test_recipe:
          setup:
            - "project P-OV1 with laydown capacity 4, shop_utilization_pct 0.50 and a coordinated model version carrying four takeoff lines, four racks and four work packages all booked on hoisting_window_id HW-OV1"
            - "the four orders share power_on 2026-12-01T00:00:00Z so their derived windows abut rather than overlap"
