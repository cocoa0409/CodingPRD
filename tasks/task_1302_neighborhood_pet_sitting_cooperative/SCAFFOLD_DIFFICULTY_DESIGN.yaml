          trigger:
            - call: "POST /coop/sitting-requests/${req2_id}/claims/${claim2_id}/accept"
              payload: { expected_sitting_request_version: "${req2_v_now}" }
              as: Member
              as_user_id: "${f3_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409 and error_id == ERR_INVALID_STATE (priority 5 state wins over priority 10 business_temporal)"
            - "error_id != ERR_SITTER_OVERLAP despite F2's overlapping CONFIRMED assignment"
            - "OCC passed: expected_sitting_request_version matched the post-cancel version, so the failure is the state rule, not ERR_STALE_VERSION"

      - name: accept_forbidden_beats_sitter_overlap
        grounds:
          - validations[priority=6]
          - validations[priority=10]
          - calculations.sitter_overlap_check
        distinguishing_aspect: |
          Error-category pair {business_safety, business_temporal} (different pair
          from the other two instances): non-owner F1 attempts to accept F2's claim
          on F3's request while F2 is overlap-busy. Priority 6 < 10, so the response
          must be 403 ERR_FORBIDDEN, never ERR_SITTER_OVERLAP.
        test_recipe:
          setup:
            - "Founders VETTED; F2 sits F1's canonical request 10:00-14:00 (CONFIRMED)"
            - "F3 posts R2 2026-09-10T12:00-16:00 (OPEN); F2's claim on R2 is PENDING; R2 version observed by F1 via GET"
          setup_api_calls:
            - *mk_f1
            - *mk_f2
            - *mk_f3
            - *ref_f1f2
            - *ref_f1f3
            - *ref_f2f1
            - *ref_f2f3
            - *ref_f3f1
            - *ref_f3f2
            - *liab_f1
            - *liab_f2
            - *liab_f3
            - *sub_f1
            - *sub_f2
            - *sub_f3
            - *acc_f1f2
            - *acc_f1f3
            - *acc_f2f1
            - *acc_f2f3
            - *acc_f3f1
            - *acc_f3f2
            - *fin_f1
            - *fin_f2
            - *fin_f3
            - *pet_f1
            - *req_a
            - *claim_f2
            - *accept_a
            - call: "POST /coop/members/${f3_id}/pet-profiles"
              payload: { pet_name: "Kiwi", species: "BIRD", routine_notes: "Cover cage at night.", medical_notes: "None.", emergency_vet_name: "Maple Vet Clinic", emergency_vet_phone: "+15550911", emergency_vet_address: "12 Maple St", liability_waiver_accepted: true }
              as: Member
              as_user_id: "${f3_id}"
              captures: { pet3_id: $.data.id }
            - call: "POST /coop/sitting-requests"
              payload: { pet_profile_id: "${pet3_id}", start_at: "2026-09-10T12:00:00Z", end_at: "2026-09-10T16:00:00Z", instructions: "Overlapping afternoon sit" }
              as: Member
              as_user_id: "${f3_id}"
              captures: { req2_id: $.data.id }
            - call: "POST /coop/sitting-requests/${req2_id}/claims"
              payload: { message: "F2 double-books" }
              as: Member
              as_user_id: "${f2_id}"
              captures: { claim2_id: $.data.id }
            - call: "GET /coop/sitting-requests/${req2_id}"
              as: Member
              as_user_id: "${f1_id}"
              captures: { req2_v_now: $.data.version }
          trigger:
            - call: "POST /coop/sitting-requests/${req2_id}/claims/${claim2_id}/accept"
              payload: { expected_sitting_request_version: "${req2_v_now}" }
              as: Member
              as_user_id: "${f1_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 403 and error_id == ERR_FORBIDDEN (priority 6 business_safety wins: caller is not the request owner)"
            - "error_id != ERR_SITTER_OVERLAP despite F2's overlapping CONFIRMED assignment"
            - "SittingClaim.${claim2_id}.status still PENDING and SittingRequest.${req2_id}.status still OPEN (no side effects fired)"

  # ===========================================================================
  # Rule 6 — boundary_precision_check (4 instances, distinct metrics+endpoints)
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: early_departure_exactly_quarter_vs_over
        grounds:
          - calculations.sitting_credit_settlement
          - entities.SittingAssignment.fields.credit_hours_settled
        distinguishing_aspect: |
          Metric: early_fraction (ratio), endpoint POST /sitting-assignments/{id}/settle.
          The rule fires on strict `> 0.25`: sit A actual 3.0h of 4.0h -> fraction
          exactly 0.25 -> NOT prorated, settled == 4.00; sit B actual 2h59m of 4.0h ->
          fraction 0.254166... > 0.25 -> prorated, settled ==
          round_half_up(2.983333 x 1.0 x 0.5) == 1.49. One minute of checkout time
          flips the branch.
        test_recipe:
          setup:
            - "Founders VETTED; F1 owns pet; sit A 2026-09-10T10:00-14:00 checked out at 13:00 (actual 3.0h); sit B 2026-09-11T10:00-14:00 checked out at 12:59 (actual 2h59m); both COMPLETED_PENDING_REVIEW"
          setup_api_calls:
            - *mk_f1
            - *mk_f2
            - *mk_f3
            - *ref_f1f2
            - *ref_f1f3
            - *ref_f2f1
            - *ref_f2f3
            - *ref_f3f1
            - *ref_f3f2
            - *liab_f1
            - *liab_f2
            - *liab_f3
            - *sub_f1
            - *sub_f2
            - *sub_f3
            - *acc_f1f2
            - *acc_f1f3
            - *acc_f2f1
            - *acc_f2f3
            - *acc_f3f1
            - *acc_f3f2
            - *fin_f1
            - *fin_f2
            - *fin_f3
            - *pet_f1
            - *req_a
            - *claim_f2
            - *accept_a
            - *get_asg
            - *get_ho
            - *clock_0830
            - *confirm_ho
            - *clock_1000
            - *checkin_1000
            - call: "POST /coop/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T13:00:00Z" }
              as: CoopAdmin
            - call: "POST /coop/sitting-assignments/${asg_id}/checkout"
              payload: {}
              as: Member
              as_user_id: "${f2_id}"
            - call: "POST /coop/sitting-requests"
              payload: { pet_profile_id: "${pet1_id}", start_at: "2026-09-11T10:00:00Z", end_at: "2026-09-11T14:00:00Z", instructions: "Sit B boundary" }
              as: Member
              as_user_id: "${f1_id}"
