# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml — §1.9 Coverage Index for Non-Difficulty Tests
# Breadth walk over §1.1-§1.7 claims not covered by §1.8. Money in integer cents.
# =============================================================================
scaffold_corner_design:
- section: entities
  instances:
  - name: e_district_creation_defaults
    claim_type: creation
    grounds:
    - entities.District.fields.status
    - entities.District.fields.annual_interest_rate_bp
    - entities.District.fields.remand_count
    distinguishing_aspect: Creating a district without annual_interest_rate_bp applies the 400 default and initializes status DRAFT with zeroed computed counters.
    test_recipe:
      setup:
      - Empty database
      setup_api_calls:
      - call: POST /districts
        payload:
          name: ENT-DEFAULT
          methodology: FRONT_FOOT
          interest_method: SIMPLE
          season_start_mmdd: 03-01
          season_end_mmdd: 11-30
        as: CityClerk
        captures:
          st: $.data.status
          rate: $.data.annual_interest_rate_bp
          rc: $.data.remand_count
          tf: $.data.total_frontage_ft
          ec: $.data.eligible_parcel_count
          v: $.data.version
          flag: $.data.overrun_flag
          allpaid: $.data.all_assessments_paid
      trigger: []
      assert:
      - ${st} == DRAFT
      - ${rate} == 400 (default applied)
      - ${rc} == 0
      - ${tf} == 0 and ${ec} == 0
      - ${v} == 1
      - ${flag} == false
      - ${allpaid} == false
  - name: e_district_missing_methodology_returns_invalid_request
    claim_type: required_fields
    grounds:
    - entities.District.fields.methodology
    - errors[ERR_INVALID_REQUEST]
    distinguishing_aspect: Omitting required input field methodology is rejected with ERR_INVALID_REQUEST (400).
    test_recipe:
      setup:
      - Empty database
      setup_api_calls: []
      trigger:
      - call: POST /districts
        payload:
          name: X
          interest_method: SIMPLE
          season_start_mmdd: 03-01
          season_end_mmdd: 11-30
        as: CityClerk
        captures:
          err: $.data.error_id
      assert:
      - ${err} == ERR_INVALID_REQUEST
  - name: e_district_invalid_enum_returns_invalid_request
    claim_type: type_constraints
    grounds:
    - entities.District.fields.methodology
    - errors[ERR_INVALID_REQUEST]
    distinguishing_aspect: A methodology value outside {PER_PARCEL, FRONT_FOOT} is rejected with ERR_INVALID_REQUEST.
    test_recipe:
      setup:
      - Empty database
      setup_api_calls: []
      trigger:
      - call: POST /districts
        payload:
          name: X
          methodology: BY_VALUE
          interest_method: SIMPLE
          season_start_mmdd: 03-01
          season_end_mmdd: 11-30
        as: CityClerk
        captures:
          err: $.data.error_id
      assert:
      - ${err} == ERR_INVALID_REQUEST
  - name: e_district_computed_fields_input_ignored
    claim_type: computed_fields
    grounds:
    - entities.District.fields.total_frontage_ft
    distinguishing_aspect: Client-supplied computed fields (total_frontage_ft, remand_count) in the create payload are ignored; the server returns the computed zero values.
    test_recipe:
      setup:
      - Empty database
      setup_api_calls: []
      trigger:
      - call: POST /districts
        payload:
          name: ENT-COMPUTED
          methodology: PER_PARCEL
          interest_method: SIMPLE
          season_start_mmdd: 03-01
          season_end_mmdd: 11-30
          total_frontage_ft: 999.99
          remand_count: 7
        as: CityClerk
        captures:
          tf: $.data.total_frontage_ft
          rc: $.data.remand_count
      assert:
      - ${tf} == 0 and ${rc} == 0 (client input for computed fields ignored)
  - name: e_district_not_found_returns_404
    claim_type: not_found
    grounds:
    - errors[ERR_DISTRICT_NOT_FOUND]
    distinguishing_aspect: GET on a non-existent district id yields ERR_DISTRICT_NOT_FOUND (404).
    test_recipe:
      setup:
      - Empty database
      setup_api_calls: []
      trigger:
      - call: GET /districts/00000000-0000-4000-8000-000000000000
        payload: {}
        as: CityClerk
        captures:
          err: $.data.error_id
      assert:
      - ${err} == ERR_DISTRICT_NOT_FOUND
  - name: e_owner_duplicate_email_rejected
    claim_type: type_constraints
    grounds:
    - entities.PropertyOwner.fields.email
    - errors[ERR_DUPLICATE_OWNER_EMAIL]
    distinguishing_aspect: Owner email is globally unique; the second registration with the same email fails with ERR_DUPLICATE_OWNER_EMAIL (409).
    test_recipe:
      setup:
      - Owner with email ent-dup@x.test already registered
      setup_api_calls:
      - call: POST /owners
        payload:
          full_name: First
          email: ent-dup@x.test
          mailing_address: 1 A St
        as: CityClerk
      trigger:
      - call: POST /owners
        payload:
          full_name: Second
          email: ent-dup@x.test
          mailing_address: 2 A St
        as: CityClerk
        captures:
          err: $.data.error_id
      assert:
      - ${err} == ERR_DUPLICATE_OWNER_EMAIL
  - name: e_parcel_frontage_zero_boundary
    claim_type: type_constraints
    grounds:
    - entities.Parcel.fields.frontage_ft
    - errors[ERR_INVALID_REQUEST]
    distinguishing_aspect: 'frontage_ft must be > 0: exactly 0.00 is rejected while 0.01 is accepted (lower boundary).'
    test_recipe:
      setup:
      - District ENT-F in DRAFT with an owner
      setup_api_calls:
      - call: POST /districts
        payload:
          name: ENT-F
          methodology: PER_PARCEL
          interest_method: SIMPLE
          season_start_mmdd: 03-01
          season_end_mmdd: 11-30
        as: CityClerk
        captures:
          ef_d: $.data.id
      - call: POST /owners
        payload:
          full_name: Owner ef1
          email: ef-o1@x.test
          mailing_address: 1 Main St
        as: CityClerk
        captures:
          ef_o1: $.data.id
      trigger:
      - call: POST /parcels
        payload:
          district_id: ${ef_d}
          owner_id: ${ef_o1}
          parcel_number: P-001
          frontage_ft: 0.0
        as: CityClerk
        captures:
          err: $.data.error_id
      - call: POST /parcels
        payload:
          district_id: ${ef_d}
          owner_id: ${ef_o1}
          parcel_number: P-001
          frontage_ft: 0.01
        as: CityClerk
        captures:
          ok: $.data.id
          fr: $.data.frontage_ft
      assert:
      - 0.00 -> ${err} == ERR_INVALID_REQUEST
      - 0.01 -> 201 with frontage_ft 0.01
  - name: e_parcel_number_scoped_uniqueness
    claim_type: type_constraints
    grounds:
    - entities.Parcel.fields.parcel_number
    - errors[ERR_DUPLICATE_PARCEL_NUMBER]
    distinguishing_aspect: 'parcel_number uniqueness is scoped to the district: duplicate inside one district is rejected, the same number in a different district is accepted.'
    test_recipe:
      setup:
      - Districts EN-A and EN-B in DRAFT, each with an owner; EN-A already has parcel P-001
      setup_api_calls:
      - call: POST /districts
        payload:
          name: EN-A
          methodology: PER_PARCEL
          interest_method: SIMPLE
          season_start_mmdd: 03-01
          season_end_mmdd: 11-30
        as: CityClerk
        captures:
          ena_d: $.data.id
      - call: POST /owners
        payload:
          full_name: Owner ena1
          email: ena-o1@x.test
          mailing_address: 1 Main St
        as: CityClerk
        captures:
          ena_o1: $.data.id
      - call: POST /parcels
        payload:
          district_id: ${ena_d}
          owner_id: ${ena_o1}
          parcel_number: P-001
          frontage_ft: 50.0
        as: CityClerk
        captures:
          ena_p1: $.data.id
      - call: POST /districts
        payload:
          name: EN-B
          methodology: PER_PARCEL
          interest_method: SIMPLE
          season_start_mmdd: 03-01
          season_end_mmdd: 11-30
        as: CityClerk
        captures:
          enb_d: $.data.id
      - call: POST /owners
        payload:
          full_name: Owner enb1
          email: enb-o1@x.test
          mailing_address: 1 Main St
        as: CityClerk
        captures:
          enb_o1: $.data.id
      trigger:
      - call: POST /parcels
        payload:
          district_id: ${ena_d}
          owner_id: ${ena_o1}
          parcel_number: P-001
          frontage_ft: 60.0
        as: CityClerk
        captures:
          err: $.data.error_id
      - call: POST /parcels
        payload:
          district_id: ${enb_d}
          owner_id: ${enb_o1}
          parcel_number: P-001
          frontage_ft: 60.0
        as: CityClerk
        captures:
          ok: $.data.id
      assert:
      - Same district duplicate -> ${err} == ERR_DUPLICATE_PARCEL_NUMBER
      - Same number in a different district -> 201
  - name: e_parcel_fk_existence_left_to_right
    claim_type: parent_relationships
    grounds:
    - entities.Parcel.fields.district_id
    - entities.Parcel.fields.owner_id
    - validations[priority=3]
    - errors[ERR_DISTRICT_NOT_FOUND]
    distinguishing_aspect: 'With both FK ids bogus, the body fields are validated in declared input order: district_id fails first with ERR_DISTRICT_NOT_FOUND (not ERR_OWNER_NOT_FOUND).'
    test_recipe:
      setup:
      - Empty database
      setup_api_calls: []
      trigger:
      - call: POST /parcels
        payload:
          district_id: 00000000-0000-4000-8000-000000000000
          owner_id: 00000000-0000-4000-8000-000000000000
          parcel_number: P-001
          frontage_ft: 10.0
        as: CityClerk
        captures:
          err: $.data.error_id
      assert:
      - ${err} == ERR_DISTRICT_NOT_FOUND
  - name: e_fk_reverse_lists
    claim_type: listing
    grounds:
    - entities.Parcel.fields.district_id
    - entities.Parcel.fields.owner_id
    distinguishing_aspect: 'Reverse-reachability GETs return children arrays: /districts/{id}/parcels lists both parcels, /owners/{id}/parcels lists only that owner''s parcel.'
    test_recipe:
      setup:
      - District ENT-R with parcels P-001 (owner 1) and P-002 (owner 2)
      setup_api_calls:
      - call: POST /districts
        payload:
          name: ENT-R
          methodology: PER_PARCEL
          interest_method: SIMPLE
          season_start_mmdd: 03-01
          season_end_mmdd: 11-30
        as: CityClerk
        captures:
          er_d: $.data.id
      - call: POST /owners
        payload:
          full_name: Owner er1
          email: er-o1@x.test
          mailing_address: 1 Main St
        as: CityClerk
        captures:
          er_o1: $.data.id
      - call: POST /owners
        payload:
          full_name: Owner er2
          email: er-o2@x.test
          mailing_address: 2 Main St
        as: CityClerk
        captures:
          er_o2: $.data.id
      - call: POST /parcels
        payload:
          district_id: ${er_d}
          owner_id: ${er_o1}
          parcel_number: P-001
          frontage_ft: 50.0
        as: CityClerk
        captures:
          er_p1: $.data.id
      - call: POST /parcels
        payload:
          district_id: ${er_d}
          owner_id: ${er_o2}
          parcel_number: P-002
          frontage_ft: 60.0
        as: CityClerk
        captures:
          er_p2: $.data.id
      trigger:
      - call: GET /districts/${er_d}/parcels
        payload: {}
        as: CityClerk
        captures:
          n0: $.data[0].parcel_number
          n1: $.data[1].parcel_number
      - call: GET /owners/${er_o2}/parcels
        payload: {}
        as: CityClerk
        captures:
          own: $.data[0].parcel_number
      assert:
      - 'District list ordered by parcel_number ASC: [P-001, P-002]'
      - Owner 2's list contains exactly P-002
  - name: e_district_list_pagination
    claim_type: listing
    grounds:
    - response_envelope.pagination_defaults
    distinguishing_aspect: 'limit/offset paginate the district list deterministically (created_at ASC): limit=2 returns the first two of three with has_more true; offset=2 returns the last one.'
    test_recipe:
      setup:
      - Three districts created in order D1, D2, D3
      setup_api_calls:
      - call: POST /districts
        payload:
          name: PG-1
          methodology: PER_PARCEL
          interest_method: SIMPLE
          season_start_mmdd: 03-01
          season_end_mmdd: 11-30
        as: CityClerk
        captures:
          pg1: $.data.id
      - call: POST /districts
        payload:
          name: PG-2
          methodology: PER_PARCEL
          interest_method: SIMPLE
          season_start_mmdd: 03-01
          season_end_mmdd: 11-30
        as: CityClerk
        captures:
          pg2: $.data.id
      - call: POST /districts
        payload:
          name: PG-3
          methodology: PER_PARCEL
          interest_method: SIMPLE
          season_start_mmdd: 03-01
          season_end_mmdd: 11-30
        as: CityClerk
        captures:
          pg3: $.data.id
      trigger:
      - call: GET /districts
        payload:
          limit: 2
          offset: 0
        as: CityClerk
        captures:
          r0: $.data[0].id
          r1: $.data[1].id
      - call: GET /districts
        payload:
          limit: 2
          offset: 2
        as: CityClerk
        captures:
          r2: $.data[0].id
      assert:
      - Page 1 rows == [${pg1}, ${pg2}] and envelope carries total_count == 3, has_more == true
      - Page 2 rows == [${pg3}] with has_more == false
  - name: e_payment_event_has_no_version
    claim_type: immutability
    grounds:
    - entities.Payment
    distinguishing_aspect: 'Payment is an append-only event (common_fields false): the creation response carries id and created_at but no version or updated_at fields.'
    test_recipe:
      setup:
      - District EIM in BILLING with year-1 invoice ISSUED; owner posts the 104,000 payoff at the due date
      setup_api_calls:
      - call: POST /districts
        payload:
          name: EIM
          methodology: PER_PARCEL
          interest_method: SIMPLE
          season_start_mmdd: 03-01
          season_end_mmdd: 11-30
        as: CityClerk
        captures:
          eim_d: $.data.id
      - call: POST /owners
        payload:
          full_name: Owner eim1
          email: eim-o1@x.test
          mailing_address: 1 Main St
        as: CityClerk
        captures:
          eim_o1: $.data.id
      - call: POST /parcels
        payload:
          district_id: ${eim_d}
          owner_id: ${eim_o1}
          parcel_number: P-001
          frontage_ft: 100.0
        as: CityClerk
        captures:
          eim_p1: $.data.id
      - call: POST /petitions
        payload:
          district_id: ${eim_d}
        as: CityClerk
        captures:
          eim_pet: $.data.id
      - call: POST /signatures
        payload:
          petition_id: ${eim_pet}
          parcel_id: ${eim_p1}
        as: PropertyOwner
        as_user_id: ${eim_o1}
        captures:
          eim_s1: $.data.id
      - call: POST /signatures/${eim_s1}/verify
        payload: {}
        as: CityClerk
      - call: POST /petitions/${eim_pet}/close
        payload: {}
        as: CityClerk
      - call: GET /districts/${eim_d}
        payload: {}
        as: CityClerk
        captures:
          eim_dv_est: $.data.version
      - call: POST /cost-estimates
        payload:
          district_id: ${eim_d}
          expected_district_version: ${eim_dv_est}
          contract_price_cents: 100000
          contingency_cents: 0
        as: CityEngineer
        as_user_id: eng-1
        captures:
          eim_e: $.data.id
      - call: POST /cost-estimates/${eim_e}/approve
        payload: {}
        as: CityEngineer
        as_user_id: eng-1
      - call: POST /hearings
        payload:
          district_id: ${eim_d}
          hearing_date: '2026-08-15T00:00:00Z'
          venue: EIM Hearing Room
        as: CityClerk
        captures:
          eim_h: $.data.id
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-15T10:00:00Z'
        as: SystemAdmin
      - call: POST /hearings/${eim_h}/record-held
        payload: {}
        as: CityClerk
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-31T00:00:00Z'
        as: SystemAdmin
      - call: POST /districts/${eim_d}/close-objection-window
        payload: {}
        as: CityClerk
      - call: GET /districts/${eim_d}
        payload: {}
        as: CouncilPresident
        captures:
          eim_dv_res: $.data.version
      - call: POST /resolutions
        payload:
          district_id: ${eim_d}
          expected_district_version: ${eim_dv_res}
          motion: APPROVE
          votes_for: 3
          votes_against: 0
        as: CouncilPresident
        as_user_id: council-1
        captures:
          eim_res: $.data.id
      - call: GET /districts/${eim_d}/parcel-assessments
        payload: {}
        as: FinanceOfficer
        captures:
          eim_a0: $.data[0].id
      - call: POST /parcel-assessments/${eim_a0}/select-payment-option
        payload:
          option: INSTALLMENTS
          term_years: 5
        as: PropertyOwner
        as_user_id: ${eim_o1}
      - call: POST /construction-phases
        payload:
          district_id: ${eim_d}
          name: PH1
          crew_name: Alpha
          start_date: '2026-09-10'
          end_date: '2026-10-10'
          estimated_cost_cents: 50000
        as: CityEngineer
        as_user_id: eng-1
        captures:
          eim_ph: $.data.id
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-10T09:00:00Z'
        as: SystemAdmin
      - call: POST /construction-phases/${eim_ph}/start
        payload: {}
        as: CityEngineer
        as_user_id: eng-1
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-10-10T17:00:00Z'
        as: SystemAdmin
      - call: POST /construction-phases/${eim_ph}/complete
        payload: {}
        as: CityEngineer
        as_user_id: eng-1
      - call: POST /districts/${eim_d}/complete-construction
        payload: {}
        as: CityEngineer
        as_user_id: eng-1
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-10-20T00:00:00Z'
        as: SystemAdmin
      - call: POST /districts/${eim_d}/finalize-true-up
        payload: {}
        as: FinanceOfficer
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2027-09-20T00:00:00Z'
        as: SystemAdmin
      - call: POST /districts/${eim_d}/billing-run
        payload: {}
        as: FinanceOfficer
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2027-10-20T00:00:00Z'
        as: SystemAdmin
      - call: GET /parcel-assessments/${eim_a0}
        payload: {}
        as: PropertyOwner
        as_user_id: ${eim_o1}
        captures:
          eim_av_p: $.data.version
      - call: POST /payments
        payload:
          parcel_assessment_id: ${eim_a0}
          expected_parcel_assessment_version: ${eim_av_p}
          amount_cents: 104000
          method: ACH
        as: PropertyOwner
        as_user_id: ${eim_o1}
        captures:
          pay_id: $.data.id
      trigger:
      - call: GET /payments/${pay_id}
        payload: {}
        as: FinanceOfficer
        captures:
          amt: $.data.amount_cents
      assert:
      - POST /payments response data has no 'version' and no 'updated_at' key
      - GET /payments/${pay_id} returns amount_cents == 104000 with id and created_at only among system fields
  - name: e_parcel_create_after_draft_rejected
    claim_type: parent_relationships
    grounds:
    - entities.Parcel.fields.district_id
    - errors[ERR_DISTRICT_NOT_DRAFT]
    distinguishing_aspect: Parcels may only be added while the parent district is DRAFT; adding after a petition opened (PETITIONING) fails with ERR_DISTRICT_NOT_DRAFT.
    test_recipe:
      setup:
      - District ENT-P in PETITIONING
      setup_api_calls:
      - call: POST /districts
        payload:
          name: ENT-P
          methodology: PER_PARCEL
          interest_method: SIMPLE
          season_start_mmdd: 03-01
          season_end_mmdd: 11-30
        as: CityClerk
        captures:
          ep_d: $.data.id
      - call: POST /owners
        payload:
          full_name: Owner ep1
          email: ep-o1@x.test
          mailing_address: 1 Main St
        as: CityClerk
        captures:
          ep_o1: $.data.id
      - call: POST /parcels
        payload:
          district_id: ${ep_d}
          owner_id: ${ep_o1}
          parcel_number: P-001
          frontage_ft: 100.0
        as: CityClerk
        captures:
          ep_p1: $.data.id
      - call: POST /petitions
        payload:
          district_id: ${ep_d}
        as: CityClerk
      trigger:
      - call: POST /parcels
        payload:
          district_id: ${ep_d}
          owner_id: ${ep_o1}
          parcel_number: P-002
          frontage_ft: 10.0
        as: CityClerk
        captures:
          err: $.data.error_id
      assert:
      - ${err} == ERR_DISTRICT_NOT_DRAFT
- section: state_machines
  instances:
  - name: sm_petition_double_close_rejected
    claim_type: invalid_transition
    grounds:
    - state_machines.Petition.CIRCULATING_to_CLOSED_VERIFIED
    - errors[ERR_PETITION_NOT_CIRCULATING]
    distinguishing_aspect: Closing an already-closed petition is rejected with ERR_PETITION_NOT_CIRCULATING; the close is not idempotent.
    test_recipe:
      setup:
      - District with a passing 1-parcel petition already closed (CLOSED_VERIFIED)
      setup_api_calls:
      - call: POST /districts
        payload:
          name: SDC
          methodology: PER_PARCEL
          interest_method: SIMPLE
          season_start_mmdd: 03-01
          season_end_mmdd: 11-30
        as: CityClerk
        captures:
          sdc_d: $.data.id
      - call: POST /owners
        payload:
          full_name: Owner sdc1
          email: sdc-o1@x.test
          mailing_address: 1 Main St
        as: CityClerk
        captures:
          sdc_o1: $.data.id
      - call: POST /parcels
        payload:
          district_id: ${sdc_d}
          owner_id: ${sdc_o1}
          parcel_number: P-001
          frontage_ft: 100.0
        as: CityClerk
        captures:
          sdc_p1: $.data.id
      - call: POST /petitions
        payload:
          district_id: ${sdc_d}
        as: CityClerk
        captures:
          sdc_pet: $.data.id
      - call: POST /signatures
        payload:
          petition_id: ${sdc_pet}
          parcel_id: ${sdc_p1}
        as: PropertyOwner
        as_user_id: ${sdc_o1}
        captures:
          sdc_s1: $.data.id
      - call: POST /signatures/${sdc_s1}/verify
        payload: {}
        as: CityClerk
      - call: POST /petitions/${sdc_pet}/close
        payload: {}
        as: CityClerk
