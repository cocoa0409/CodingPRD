        distinguishing_aspect: "Any endpoint call without X-User-ID/X-User-Role -> 401 ERR_UNAUTHENTICATED."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /privacy/retention-policies"
              payload: { policy_code: "RP-X", duration_days: 10, disposal_action: DELETE }
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_UNAUTHENTICATED (401)"

      - name: err_forbidden_role_on_admin_endpoint
        claim_type: violation_to_error
        grounds: ["errors[ERR_FORBIDDEN_ROLE]"]
        distinguishing_aspect: "DataSteward attempting a PrivacyAdmin-exclusive operation (notice creation) -> 403."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
