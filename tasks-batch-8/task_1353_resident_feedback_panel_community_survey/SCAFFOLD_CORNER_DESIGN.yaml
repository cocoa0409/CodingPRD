# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml — §1.9 Coverage Index for Non-Difficulty Tests
# Resident Feedback Panel & Community Survey Program
# Breadth coverage of every §1.1–§1.7 claim not already probed by §1.8.
# Logical clock default at startup: 2026-08-01T00:00:00Z.
# Sections/claim_types follow references/claim-extraction-guide.md.
# =============================================================================

scaffold_corner_design:

  # ===========================================================================
  # From Table 1 (Entities)
  # ===========================================================================
  - section: entities
    instances:
      - name: corner_cell_create_defaults
        claim_type: creation
        grounds: ["entities.PanelCell", "state_machines.PanelCell"]
        distinguishing_aspect: "Cell creation returns 201 with system fields: status OPEN, reserved_count 0, active_count 0, version 1."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /feedback-panel/panel-cells", payload: { age_band: "AGE_45_64", district: "D3", tenure_bucket: "OWNER", target_size: 7 }, as: PanelManager, captures: { cell_id: $.data.id, st: $.data.status, rc: $.data.reserved_count, ac: $.data.active_count, v: $.data.version } }
          assert:
            - "st == OPEN"
            - "rc == 0"
            - "ac == 0"
            - "v == 1"

      - name: corner_panelist_create_defaults
        claim_type: defaults
        grounds: ["entities.Panelist.fields.preferred_locale", "entities.Panelist.fields.status"]
        distinguishing_aspect: "Omitting preferred_locale defaults it to 'en'; a new panelist starts APPLICANT with missed_streak 0 and last_contacted_at null."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /feedback-panel/panelists", payload: { external_ref: "px@x", full_name: "P X", age_band: "AGE_65_PLUS", district: "D9", tenure_bucket: "OWNER" }, as: PanelManager, captures: { loc: $.data.preferred_locale, st: $.data.status, ms: $.data.missed_streak, lc: $.data.last_contacted_at } }
          assert:
            - "loc == en"
            - "st == APPLICANT"
            - "ms == 0"
            - "lc == null"

      - name: corner_panelist_enroll_resolves_home_cell
        claim_type: computed_fields
        grounds: ["entities.Panelist.fields.home_cell_id", "state_machines.Panelist.APPLICANT_to_ACTIVE"]
        distinguishing_aspect: "Enroll resolves home_cell_id from the (age_band, district, tenure_bucket) triple and bumps the cell's active_count to 1 in the same request."
        test_recipe:
          setup: ["Cell AGE_30_44/D2/OWNER target 2 exists; panelist with the matching triple registered"]
          setup_api_calls:
            - { call: "POST /feedback-panel/panel-cells", payload: { age_band: "AGE_30_44", district: "D2", tenure_bucket: "OWNER", target_size: 2 }, as: PanelManager, captures: { cell_id: $.data.id } }
            - { call: "POST /feedback-panel/panelists", payload: { external_ref: "p1@x", full_name: "P One", age_band: "AGE_30_44", district: "D2", tenure_bucket: "OWNER", preferred_locale: "en" }, as: PanelManager, captures: { p1_id: $.data.id } }
          trigger:
            - { call: "POST /feedback-panel/panelists/${p1_id}/enroll", payload: {}, as: PanelManager, captures: { hc: $.data.home_cell_id, st: $.data.status } }
            - { call: "GET /feedback-panel/panel-cells/${cell_id}", payload: {}, as: PanelManager, captures: { ac: $.data.active_count } }
          assert:
            - "hc == ${cell_id}"
            - "st == ACTIVE"
            - "ac == 1"

      - name: corner_wave_create_derives_pool
        claim_type: computed_fields
        grounds: ["entities.SurveyWave.fields.incentive_pool_available_cents", "entities.SurveyWave.fields.status"]
        distinguishing_aspect: "Wave creation derives available == incentive_pool_total_cents, reserved 0, paid 0, invited_count 0, completed_count 0, status DRAFT."
        test_recipe:
          setup: ["Locked instrument exists"]
          setup_api_calls:
            - { call: "POST /feedback-panel/instruments", payload: { title: "S", question_count: 5, required_locales: ["en"], base_locale: "en" }, as: SurveyDesigner, captures: { instr_id: $.data.id } }
            - { call: "POST /feedback-panel/instruments/${instr_id}/submit-review", payload: {}, as: SurveyDesigner }
            - { call: "POST /feedback-panel/translations", payload: { instrument_id: "${instr_id}", locale: "en", translator_ref: "tr-1" }, as: SurveyDesigner, captures: { tr_en: $.data.id } }
            - { call: "POST /feedback-panel/translations/${tr_en}/certify", payload: {}, as: SurveyDesigner }
            - { call: "POST /feedback-panel/instruments/${instr_id}/approve", payload: {}, as: SurveyDesigner }
            - { call: "POST /feedback-panel/instruments/${instr_id}/lock", payload: {}, as: SurveyDesigner }
          trigger:
            - { call: "POST /feedback-panel/survey-waves", payload: { wave_code: "W9", instrument_id: "${instr_id}", opens_at: "2026-08-02T00:00:00Z", closes_at: "2026-08-10T00:00:00Z", min_response_rate: 0.5, incentive_pool_total_cents: 42000, base_incentive_cents: 500 }, as: PanelManager, captures: { avail: $.data.incentive_pool_available_cents, res: $.data.incentive_pool_reserved_cents, paid: $.data.incentive_pool_paid_cents, inv: $.data.invited_count, comp: $.data.completed_count, st: $.data.status } }
          assert:
            - "avail == 42000"
            - "res == 0"
            - "paid == 0"
            - "inv == 0"
            - "comp == 0"
            - "st == DRAFT"

      - name: corner_get_wave_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_WAVE_NOT_FOUND]", "validations[priority=3]"]
        distinguishing_aspect: "GET with a well-formed but unknown wave UUID returns 404 ERR_WAVE_NOT_FOUND."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /feedback-panel/survey-waves/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: {}, as: PanelManager, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_WAVE_NOT_FOUND"

      - name: corner_invalid_enum_age_band_returns_400
        claim_type: type_constraints
        grounds: ["entities.Panelist.fields.age_band", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "age_band outside {AGE_18_29, AGE_30_44, AGE_45_64, AGE_65_PLUS} is rejected with ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /feedback-panel/panelists", payload: { external_ref: "p1@x", full_name: "P One", age_band: "TEEN", district: "D1", tenure_bucket: "RENTER" }, as: PanelManager, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_REQUEST"

      - name: corner_cell_create_extra_system_fields_input_ignored
        claim_type: system_fields
        grounds: ["entities.PanelCell.fields.status", "entities.PanelCell.fields.reserved_count"]
        distinguishing_aspect: "Client-supplied system/computed fields (status, reserved_count, version) in a create payload are ignored; the server returns its own derived values."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /feedback-panel/panel-cells", payload: { age_band: "AGE_18_29", district: "D1", tenure_bucket: "RENTER", target_size: 3, status: "SATURATED", reserved_count: 99, version: 42 }, as: PanelManager, captures: { st: $.data.status, rc: $.data.reserved_count, v: $.data.version } }
          assert:
            - "st == OPEN"
            - "rc == 0"
            - "v == 1"

      - name: corner_completeness_range_returns_400
        claim_type: type_constraints
        grounds: ["entities.Response.fields.completeness_pct", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "completeness_pct 120 (above the [0,100] range) is rejected ERR_INVALID_REQUEST before any state change; the invitation stays SENT."
        test_recipe:
          setup: ["Cell target 5; P1 ACTIVE; locked instrument; wave FIELDING at 2026-08-03; inv1 SENT"]
          setup_api_calls:
            - { call: "POST /feedback-panel/panel-cells", payload: { age_band: "AGE_18_29", district: "D1", tenure_bucket: "RENTER", target_size: 5 }, as: PanelManager, captures: { c1_id: $.data.id } }
            - { call: "POST /feedback-panel/panelists", payload: { external_ref: "p1@x", full_name: "P One", age_band: "AGE_18_29", district: "D1", tenure_bucket: "RENTER", preferred_locale: "en" }, as: PanelManager, captures: { p1_id: $.data.id } }
            - { call: "POST /feedback-panel/panelists/${p1_id}/enroll", payload: {}, as: PanelManager }
            - { call: "POST /feedback-panel/instruments", payload: { title: "S", question_count: 5, required_locales: ["en"], base_locale: "en" }, as: SurveyDesigner, captures: { instr_id: $.data.id } }
            - { call: "POST /feedback-panel/instruments/${instr_id}/submit-review", payload: {}, as: SurveyDesigner }
            - { call: "POST /feedback-panel/translations", payload: { instrument_id: "${instr_id}", locale: "en", translator_ref: "tr-1" }, as: SurveyDesigner, captures: { tr_en: $.data.id } }
            - { call: "POST /feedback-panel/translations/${tr_en}/certify", payload: {}, as: SurveyDesigner }
            - { call: "POST /feedback-panel/instruments/${instr_id}/approve", payload: {}, as: SurveyDesigner }
            - { call: "POST /feedback-panel/instruments/${instr_id}/lock", payload: {}, as: SurveyDesigner }
            - { call: "POST /feedback-panel/survey-waves", payload: { wave_code: "W1", instrument_id: "${instr_id}", opens_at: "2026-08-02T00:00:00Z", closes_at: "2026-08-10T00:00:00Z", min_response_rate: 0.5, incentive_pool_total_cents: 100000, base_incentive_cents: 1000 }, as: PanelManager, captures: { wave_id: $.data.id } }
            - { call: "POST /feedback-panel/survey-waves/${wave_id}/arm", payload: {}, as: PanelManager }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: PanelManager }
            - { call: "POST /feedback-panel/survey-waves/${wave_id}/open-fielding", payload: {}, as: PanelManager }
            - { call: "POST /feedback-panel/invitations", payload: { wave_id: "${wave_id}", panelist_id: "${p1_id}" }, as: PanelManager, captures: { inv1: $.data.id } }
          trigger:
            - { call: "POST /feedback-panel/responses", payload: { invitation_id: "${inv1}", answers_payload: { q1: 1 }, completeness_pct: 120, completion_seconds: 300 }, as: PanelManager, captures: { err: $.data.error_id } }
            - { call: "GET /feedback-panel/invitations/${inv1}", payload: {}, as: PanelManager, captures: { inv_st: $.data.status } }
          assert:
            - "err == ERR_INVALID_REQUEST"
            - "inv_st == SENT"

  # ===========================================================================
  # From Table 2 (State Machines)
  # ===========================================================================
  - section: state_machines
    instances:
      - name: corner_wave_arm_twice_returns_409
        claim_type: invalid_transition
        grounds: ["state_machines.SurveyWave.DRAFT_to_ARMED", "errors[ERR_WAVE_INVALID_STATE]"]
        distinguishing_aspect: "Arming an already-ARMED wave is not a declared transition and fails ERR_WAVE_INVALID_STATE (409)."
        test_recipe:
          setup: ["Locked instrument; wave created and armed"]
          setup_api_calls:
            - { call: "POST /feedback-panel/instruments", payload: { title: "S", question_count: 5, required_locales: ["en"], base_locale: "en" }, as: SurveyDesigner, captures: { instr_id: $.data.id } }
            - { call: "POST /feedback-panel/instruments/${instr_id}/submit-review", payload: {}, as: SurveyDesigner }
            - { call: "POST /feedback-panel/translations", payload: { instrument_id: "${instr_id}", locale: "en", translator_ref: "tr-1" }, as: SurveyDesigner, captures: { tr_en: $.data.id } }
            - { call: "POST /feedback-panel/translations/${tr_en}/certify", payload: {}, as: SurveyDesigner }
            - { call: "POST /feedback-panel/instruments/${instr_id}/approve", payload: {}, as: SurveyDesigner }
            - { call: "POST /feedback-panel/instruments/${instr_id}/lock", payload: {}, as: SurveyDesigner }
            - { call: "POST /feedback-panel/survey-waves", payload: { wave_code: "W1", instrument_id: "${instr_id}", opens_at: "2026-08-02T00:00:00Z", closes_at: "2026-08-10T00:00:00Z", min_response_rate: 0.5, incentive_pool_total_cents: 10000, base_incentive_cents: 1000 }, as: PanelManager, captures: { wave_id: $.data.id } }
            - { call: "POST /feedback-panel/survey-waves/${wave_id}/arm", payload: {}, as: PanelManager }
          trigger:
            - { call: "POST /feedback-panel/survey-waves/${wave_id}/arm", payload: {}, as: PanelManager, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_WAVE_INVALID_STATE"
            - "SurveyWave.${wave_id}.status == ARMED"

      - name: corner_cancelled_wave_terminal_lockdown
        claim_type: terminal_lockdown
        grounds: ["state_machines.SurveyWave.DRAFT_to_CANCELLED", "errors[ERR_WAVE_ALREADY_TERMINAL]"]
        distinguishing_aspect: "A CANCELLED wave rejects arm and close with ERR_WAVE_ALREADY_TERMINAL; terminal states admit no outgoing transitions."
        test_recipe:
          setup: ["Locked instrument; wave created then cancelled from DRAFT"]
          setup_api_calls:
            - { call: "POST /feedback-panel/instruments", payload: { title: "S", question_count: 5, required_locales: ["en"], base_locale: "en" }, as: SurveyDesigner, captures: { instr_id: $.data.id } }
            - { call: "POST /feedback-panel/instruments/${instr_id}/submit-review", payload: {}, as: SurveyDesigner }
            - { call: "POST /feedback-panel/translations", payload: { instrument_id: "${instr_id}", locale: "en", translator_ref: "tr-1" }, as: SurveyDesigner, captures: { tr_en: $.data.id } }
            - { call: "POST /feedback-panel/translations/${tr_en}/certify", payload: {}, as: SurveyDesigner }
            - { call: "POST /feedback-panel/instruments/${instr_id}/approve", payload: {}, as: SurveyDesigner }
            - { call: "POST /feedback-panel/instruments/${instr_id}/lock", payload: {}, as: SurveyDesigner }
            - { call: "POST /feedback-panel/survey-waves", payload: { wave_code: "W1", instrument_id: "${instr_id}", opens_at: "2026-08-02T00:00:00Z", closes_at: "2026-08-10T00:00:00Z", min_response_rate: 0.5, incentive_pool_total_cents: 10000, base_incentive_cents: 1000 }, as: PanelManager, captures: { wave_id: $.data.id } }
            - { call: "POST /feedback-panel/survey-waves/${wave_id}/cancel", payload: {}, as: PanelManager }
          trigger:
            - { call: "POST /feedback-panel/survey-waves/${wave_id}/arm", payload: {}, as: PanelManager, captures: { err_arm: $.data.error_id } }
            - { call: "POST /feedback-panel/survey-waves/${wave_id}/close", payload: {}, as: PanelManager, captures: { err_close: $.data.error_id } }
          assert:
            - "err_arm == ERR_WAVE_ALREADY_TERMINAL"
            - "err_close == ERR_WAVE_ALREADY_TERMINAL"

      - name: corner_invitation_decline_twice_returns_409
        claim_type: idempotency
        grounds: ["state_machines.Invitation.SENT_to_DECLINED", "errors[ERR_INVITATION_NOT_OPEN]"]
        distinguishing_aspect: "Declining an already-DECLINED invitation fails ERR_INVITATION_NOT_OPEN; terminal invitations admit no further triggers."
        test_recipe:
          setup: ["Cell target 5; P1 ACTIVE; locked instrument; wave FIELDING at 2026-08-03; inv1 SENT then DECLINED"]
          setup_api_calls:
            - { call: "POST /feedback-panel/panel-cells", payload: { age_band: "AGE_18_29", district: "D1", tenure_bucket: "RENTER", target_size: 5 }, as: PanelManager, captures: { c1_id: $.data.id } }
            - { call: "POST /feedback-panel/panelists", payload: { external_ref: "p1@x", full_name: "P One", age_band: "AGE_18_29", district: "D1", tenure_bucket: "RENTER", preferred_locale: "en" }, as: PanelManager, captures: { p1_id: $.data.id } }
            - { call: "POST /feedback-panel/panelists/${p1_id}/enroll", payload: {}, as: PanelManager }
            - { call: "POST /feedback-panel/instruments", payload: { title: "S", question_count: 5, required_locales: ["en"], base_locale: "en" }, as: SurveyDesigner, captures: { instr_id: $.data.id } }
            - { call: "POST /feedback-panel/instruments/${instr_id}/submit-review", payload: {}, as: SurveyDesigner }
            - { call: "POST /feedback-panel/translations", payload: { instrument_id: "${instr_id}", locale: "en", translator_ref: "tr-1" }, as: SurveyDesigner, captures: { tr_en: $.data.id } }
            - { call: "POST /feedback-panel/translations/${tr_en}/certify", payload: {}, as: SurveyDesigner }
            - { call: "POST /feedback-panel/instruments/${instr_id}/approve", payload: {}, as: SurveyDesigner }
            - { call: "POST /feedback-panel/instruments/${instr_id}/lock", payload: {}, as: SurveyDesigner }
            - { call: "POST /feedback-panel/survey-waves", payload: { wave_code: "W1", instrument_id: "${instr_id}", opens_at: "2026-08-02T00:00:00Z", closes_at: "2026-08-10T00:00:00Z", min_response_rate: 0.5, incentive_pool_total_cents: 100000, base_incentive_cents: 1000 }, as: PanelManager, captures: { wave_id: $.data.id } }
            - { call: "POST /feedback-panel/survey-waves/${wave_id}/arm", payload: {}, as: PanelManager }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: PanelManager }
            - { call: "POST /feedback-panel/survey-waves/${wave_id}/open-fielding", payload: {}, as: PanelManager }
            - { call: "POST /feedback-panel/invitations", payload: { wave_id: "${wave_id}", panelist_id: "${p1_id}" }, as: PanelManager, captures: { inv1: $.data.id } }
            - { call: "POST /feedback-panel/invitations/${inv1}/decline", payload: {}, as: PanelManager }
          trigger:
            - { call: "POST /feedback-panel/invitations/${inv1}/decline", payload: {}, as: PanelManager, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVITATION_NOT_OPEN"

      - name: corner_response_on_declined_invitation_returns_409
        claim_type: precondition_enforcement
        grounds: ["state_machines.Response", "errors[ERR_INVITATION_NOT_OPEN]"]
        distinguishing_aspect: "Submitting a response against a DECLINED invitation fails ERR_INVITATION_NOT_OPEN and mints no award."
        test_recipe:
          setup: ["Cell target 5; P1 ACTIVE; locked instrument; wave FIELDING at 2026-08-03; inv1 DECLINED"]
          setup_api_calls:
            - { call: "POST /feedback-panel/panel-cells", payload: { age_band: "AGE_18_29", district: "D1", tenure_bucket: "RENTER", target_size: 5 }, as: PanelManager, captures: { c1_id: $.data.id } }
            - { call: "POST /feedback-panel/panelists", payload: { external_ref: "p1@x", full_name: "P One", age_band: "AGE_18_29", district: "D1", tenure_bucket: "RENTER", preferred_locale: "en" }, as: PanelManager, captures: { p1_id: $.data.id } }
            - { call: "POST /feedback-panel/panelists/${p1_id}/enroll", payload: {}, as: PanelManager }
            - { call: "POST /feedback-panel/instruments", payload: { title: "S", question_count: 5, required_locales: ["en"], base_locale: "en" }, as: SurveyDesigner, captures: { instr_id: $.data.id } }
            - { call: "POST /feedback-panel/instruments/${instr_id}/submit-review", payload: {}, as: SurveyDesigner }
            - { call: "POST /feedback-panel/translations", payload: { instrument_id: "${instr_id}", locale: "en", translator_ref: "tr-1" }, as: SurveyDesigner, captures: { tr_en: $.data.id } }
            - { call: "POST /feedback-panel/translations/${tr_en}/certify", payload: {}, as: SurveyDesigner }
            - { call: "POST /feedback-panel/instruments/${instr_id}/approve", payload: {}, as: SurveyDesigner }
            - { call: "POST /feedback-panel/instruments/${instr_id}/lock", payload: {}, as: SurveyDesigner }
            - { call: "POST /feedback-panel/survey-waves", payload: { wave_code: "W1", instrument_id: "${instr_id}", opens_at: "2026-08-02T00:00:00Z", closes_at: "2026-08-10T00:00:00Z", min_response_rate: 0.5, incentive_pool_total_cents: 100000, base_incentive_cents: 1000 }, as: PanelManager, captures: { wave_id: $.data.id } }
            - { call: "POST /feedback-panel/survey-waves/${wave_id}/arm", payload: {}, as: PanelManager }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: PanelManager }
            - { call: "POST /feedback-panel/survey-waves/${wave_id}/open-fielding", payload: {}, as: PanelManager }
            - { call: "POST /feedback-panel/invitations", payload: { wave_id: "${wave_id}", panelist_id: "${p1_id}" }, as: PanelManager, captures: { inv1: $.data.id } }
            - { call: "POST /feedback-panel/invitations/${inv1}/decline", payload: {}, as: PanelManager }
          trigger:
            - { call: "POST /feedback-panel/responses", payload: { invitation_id: "${inv1}", answers_payload: { q1: 1 }, completeness_pct: 100, completion_seconds: 300 }, as: PanelManager, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVITATION_NOT_OPEN"
            - "GET /feedback-panel/responses?invitation_id=${inv1} returns total_count == 0"

      - name: corner_reactivate_active_panelist_returns_409
        claim_type: precondition_enforcement
        grounds: ["state_machines.Panelist.LAPSED_to_ACTIVE", "errors[ERR_PANELIST_NOT_LAPSED]"]
        distinguishing_aspect: "Reactivate is valid only from LAPSED; calling it on an ACTIVE panelist fails ERR_PANELIST_NOT_LAPSED."
        test_recipe:
          setup: ["Cell target 5; P1 enrolled (ACTIVE)"]
          setup_api_calls:
            - { call: "POST /feedback-panel/panel-cells", payload: { age_band: "AGE_18_29", district: "D1", tenure_bucket: "RENTER", target_size: 5 }, as: PanelManager, captures: { c1_id: $.data.id } }
            - { call: "POST /feedback-panel/panelists", payload: { external_ref: "p1@x", full_name: "P One", age_band: "AGE_18_29", district: "D1", tenure_bucket: "RENTER", preferred_locale: "en" }, as: PanelManager, captures: { p1_id: $.data.id } }
            - { call: "POST /feedback-panel/panelists/${p1_id}/enroll", payload: {}, as: PanelManager }
          trigger:
            - { call: "POST /feedback-panel/panelists/${p1_id}/reactivate", payload: {}, as: PanelManager, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_PANELIST_NOT_LAPSED"
            - "Panelist.${p1_id}.status == ACTIVE"

      - name: corner_reminder_cadence_too_soon_then_allowed
        claim_type: precondition_enforcement
        grounds: ["state_machines.Invitation.SENT_to_SENT", "errors[ERR_REMINDER_CADENCE_TOO_SOON]"]
        distinguishing_aspect: "A reminder 24h after dispatch fails ERR_REMINDER_CADENCE_TOO_SOON; at exactly +48h the inclusive boundary allows it and reminder_count becomes 1."
        test_recipe:
          setup: ["Cell target 5; P1 ACTIVE; locked instrument; wave FIELDING; inv1 SENT at 2026-08-03T00:00:00Z"]
          setup_api_calls:
            - { call: "POST /feedback-panel/panel-cells", payload: { age_band: "AGE_18_29", district: "D1", tenure_bucket: "RENTER", target_size: 5 }, as: PanelManager, captures: { c1_id: $.data.id } }
            - { call: "POST /feedback-panel/panelists", payload: { external_ref: "p1@x", full_name: "P One", age_band: "AGE_18_29", district: "D1", tenure_bucket: "RENTER", preferred_locale: "en" }, as: PanelManager, captures: { p1_id: $.data.id } }
            - { call: "POST /feedback-panel/panelists/${p1_id}/enroll", payload: {}, as: PanelManager }
            - { call: "POST /feedback-panel/instruments", payload: { title: "S", question_count: 5, required_locales: ["en"], base_locale: "en" }, as: SurveyDesigner, captures: { instr_id: $.data.id } }
            - { call: "POST /feedback-panel/instruments/${instr_id}/submit-review", payload: {}, as: SurveyDesigner }
            - { call: "POST /feedback-panel/translations", payload: { instrument_id: "${instr_id}", locale: "en", translator_ref: "tr-1" }, as: SurveyDesigner, captures: { tr_en: $.data.id } }
            - { call: "POST /feedback-panel/translations/${tr_en}/certify", payload: {}, as: SurveyDesigner }
