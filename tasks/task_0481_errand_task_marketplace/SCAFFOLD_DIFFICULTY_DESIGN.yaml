              as: Dispatcher
            - call: "POST /bookings"
              payload: { client_id: "${cl_id}", category_id: "${cat_id}", dispatch_mode: "SCHEDULED", scheduled_start: "2026-06-26T10:00:00Z", estimated_hours: 1.0 }
              as: Client
              as_user_id: "${cl_id}"
              captures: { bk_id: $.data.id }
            - call: "POST /bookings/${bk_id}/offer"
              payload: {}
              as: Client
              as_user_id: "${cl_id}"
            - call: "POST /bookings/${bk_id}/claim"
              payload: { tasker_id: "${tk_id}", expected_tasker_version: "${tk_v0}" }
              as: Dispatcher
            - call: "GET /taskers/${tk_id}"
              payload: {}
              as: Dispatcher
              captures: { count_after_claim: $.data.active_booking_count }
          trigger:
            - call: "POST /bookings/${bk_id}/cancel"
              payload: { cancelled_by: "CLIENT" }
              as: Client
              as_user_id: "${cl_id}"
            - call: "GET /taskers/${tk_id}"
              payload: {}
              as: Dispatcher
              captures: { count_after_cancel: $.data.active_booking_count }
          assert:
            - "Tasker.${tk_id}.active_booking_count == 1 after claim"
            - "Tasker.${tk_id}.active_booking_count == 0 after cancel (conserved back to start)"
            - "Cancellation(booking=${bk_id}).fee_tier == FREE"

      - name: file_then_dismiss_incident_conserves_tasker_trust_score
        grounds:
          - state_machines.TrustIncident.transitions.OPEN_to_DISMISSED
          - calculations.trust_score
          - entities.Tasker.fields.trust_score
        distinguishing_aspect: |
          Conserved quantity #2 (different type — trust_score points, not a booking
          count) = trust_score == max(100 - sum(OPEN/UPHELD penalties),0). Filing a
          MEDIUM incident (-15 -> 85) then dismissing it (+15 -> 100) restores
          trust_score exactly to its pre-incident value with zero drift.
        test_recipe:
          setup:
            - "Clock 2026-06-25T08:00:00Z; Tasker ACTIVE trust_score=100, no incidents."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-25T08:00:00Z" }
              as: TrustSafetyOfficer
            - call: "POST /taskers"
              payload: { full_name: "Tina Trust", hourly_rate_cents: 5000 }
              as: Dispatcher
              captures: { tk_id: $.data.id }
            - call: "POST /trust-incidents"
              payload: { tasker_id: "${tk_id}", severity: "MEDIUM" }
              as: TrustSafetyOfficer
              captures: { inc_id: $.data.id }
            - call: "GET /taskers/${tk_id}"
              payload: {}
              as: Dispatcher
              captures: { score_after_file: $.data.trust_score }
          trigger:
            - call: "POST /trust-incidents/${inc_id}/dismiss"
              payload: {}
              as: TrustSafetyOfficer
            - call: "GET /taskers/${tk_id}"
              payload: {}
              as: Dispatcher
              captures: { score_after_dismiss: $.data.trust_score }
          assert:
            - "Tasker.${tk_id}.trust_score == 85 after filing MEDIUM incident"
            - "Tasker.${tk_id}.trust_score == 100 after dismiss (conserved back to start)"
            - "Tasker.${tk_id}.status == ACTIVE throughout (85 and 100 both >= 70)"
