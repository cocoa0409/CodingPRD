# SCAFFOLD_DIFFICULTY_DESIGN.yaml  (SKILL.md §1.8 — Test Targeting Index)
# Task: task_2507_false_alarm_reduction_alarm_permit_program
# Depth probe: one block per §0.5 difficulty rule the scaffold actually exercises.
# All paths carry the §1.0 api_prefix /false-alarm-program. All roles are §1.7 roles.
# The first fee-schedule payload is anchored as &fs_base (33 required §1.5 inputs at
# their §1.1 defaults); later instances alias it with YAML merge keys and override only
# the knobs their claim needs.
scaffold_difficulty_design:

  # =========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: occurrence_index_rolling_365_counts_across_the_renewal_boundary
        grounds:
          - calculations.false_alarm_occurrence_index
          - calculations.escalating_false_alarm_fee
          - entities.FeeSchedule.fields.counting_window_mode
          - entities.AlarmSite.fields.chargeable_count_rolling_365
          - entities.AlarmSite.fields.chargeable_count_permit_year
          - state_machines.FalseAlarmIncident.UNDER_REVIEW_to_COUNTED
        distinguishing_aspect: >-
          Under the ROLLING_365 variant the fourth chargeable incident of one premises gets
          occurrence_index 4 and a 25000-cent tier fee because the trailing-365-day window
          still contains the two 2025 incidents that the 2025-12-15 permit renewal pushed out
          of the permit-year window, and the divergence is directly observable on the same row
          set: chargeable_count_rolling_365 is 4 while chargeable_count_permit_year is 2.
        test_recipe:
          setup:
            - "One ACTIVE FeeSchedule with counting_window_mode = ROLLING_365, free_alarm_allowance 2, tier 3 = 10000, tier 4 = 25000, probation_threshold_count 4, suspension_threshold_count 6."
            - "One RESIDENTIAL AlarmSite (occupancy multiplier 1.00) with two ACTIVE ECV-callable SiteContacts and four PERMITTED AlarmSystems (one per incident, because §1.4 priority 18 keeps a DISPATCHED request open on its own system)."
            - "All four permits renewed on 2025-12-15, so every permit term_start_at is 2025-12-15 and the permit-year window opens there."
            - "Three prior COUNTED incidents at 2025-03-01, 2025-06-01 and 2026-01-10; the fourth is reported at 2026-02-10 and is still REPORTED when the trigger runs."
          setup_api_calls:
            - call: "POST /false-alarm-program/_clock/set_current_utc"
              payload: {current_utc: "2025-01-01T00:00:00Z"}
              as: ProgramAdministrator
            - call: "POST /false-alarm-program/fee-schedules"
              payload: &fs_base
                schedule_code: "FS-2507-ROLL"
                effective_from: "2025-01-01T00:00:00Z"
                counting_window_mode: "ROLLING_365"
                free_alarm_allowance: 2
                fee_tiers:
                  - {from_index: 1, to_index: 2, base_fee_cents: 0}
                  - {from_index: 3, to_index: 3, base_fee_cents: 10000}
                  - {from_index: 4, to_index: 4, base_fee_cents: 25000}
                  - {from_index: 5, to_index: 5, base_fee_cents: 40000}
                  - {from_index: 6, to_index: null, base_fee_cents: 75000}
                occupancy_multipliers: {RESIDENTIAL: 1.00, COMMERCIAL: 1.50, SCHOOL: 1.25, FINANCIAL: 2.00, GOVERNMENT: 1.00}
                non_ecv_surcharge_pct: 0.20
                unpermitted_multiplier: 2.00
                suspension_period_aggravation_cents: 50000
                per_incident_fee_cap_cents: 100000
                probation_threshold_count: 4
                suspension_threshold_count: 6
                appeal_filing_days: 20
                permit_term_days: 365
                renewal_grace_days: 30
                new_installation_grace_days: 30
                permit_issue_fee_cents: 5000
                permit_renewal_fee_cents: 3000
                late_renewal_tiers:
                  - {max_days_late: 15, fee_cents: 1500}
                  - {max_days_late: 30, fee_cents: 3000}
                  - {max_days_late: null, fee_cents: 6000}
                unpermitted_operation_penalty_cents: 20000
                reinstatement_base_fee_cents: 60000
                reinstatement_escalation_pct: 0.50
                admin_fee_pct: 0.05
                admin_fee_min_cents: 500
                admin_fee_max_cents: 5000
                invoice_due_days: 30
                late_penalty_pct: 0.10
                delinquency_days: 90
                collections_referral_threshold_cents: 25000
                delinquent_balance_block_cents: 50000
                exempt_cause_codes: ["SEVERE_WEATHER", "UTILITY_POWER_FAILURE", "TELEPHONE_LINE_FAILURE", "AUTHORIZED_TEST_WITH_NOTICE", "CRIMINAL_OFFENSE_CONFIRMED", "NEW_INSTALLATION_GRACE"]
                company_probation_score_threshold: 0.70
                company_suspension_score_threshold: 0.50
              as: ProgramAdministrator
              captures: {sched_id: $.data.id}
            - call: "POST /false-alarm-program/fee-schedules/${sched_id}/activate"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /false-alarm-program/alarm-companies"
              payload: {legal_name: "Sentinel Monitoring LLC", license_number: "AC-2507-001", contact_email: "ops@sentinel2507.example", contact_phone: "+15550100101", score_mode: "VOLUME_WEIGHTED"}
              as: ProgramAdministrator
              captures: {company_id: $.data.id}
            - call: "POST /false-alarm-program/alarm-sites"
              payload: {address_key: "2507-ROLL-118-ROLLING-WAY", street_address: "118 Rolling Way", city: "Fairview", zip_code: "44011", occupancy_class: "RESIDENTIAL", police_beat: "B12"}
              as: ProgramAdministrator
              captures: {site_id: $.data.id}
            - call: "POST /false-alarm-program/site-contacts"
              payload: {alarm_site_id: "${site_id}", full_name: "Dana Reyes", phone_number: "+15550100201", relationship: "OWNER", contact_priority: 1, is_ecv_callable: true}
              as: ProgramAdministrator
              captures: {c1: $.data.id}
            - call: "POST /false-alarm-program/site-contacts"
