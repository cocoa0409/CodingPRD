            - "Clock at 2026-09-01T00:00:00Z."
            - "Trustee T (limit 10000000) vouches two applications, each fully funded privately by trustee endorsement to the full requested amount (quorum 5 satisfied by 4 community endorsements + 1 trustee endorsement)."
            - "Loan P: principal 400000, term 4 months, lender KA endorses 375000 plus trustee endorsement 25000; public phase skipped? No — quorum met, public opened, no contributions needed; disburse at 2026-09-01."
            - "Loan Q: principal 1600000, term 4 months; lender KA contributes 400000 in public phase (25% of principal), other lenders fund the rest; disbursed at 2026-09-01."
