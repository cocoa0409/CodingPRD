# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# task_0694_watersports_school — breadth probe across claim-extraction-guide sections.
# Names are unique across §1.8 + §1.9. Formula-derived asserts are literals.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_school_returns_201_with_system_fields
        claim_type: Creation
        grounds:
          - entities.School
          - endpoints
        distinguishing_aspect: "POST /schools with name returns 201, operating_status=OPEN, storm_advisory_active=false, version=1, open_session_count=0."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /schools"
              payload: { name: "New School" }
              as: SchoolAdmin
              captures: { sch: $.data.id, st: $.data.operating_status, v: $.data.version }
          assert:
            - "School.${sch}.operating_status == OPEN"
            - "School.${sch}.storm_advisory_active == false"
            - "School.${sch}.version == 1"
            - "School.${sch}.open_session_count == 0"

      - name: get_school_nonexistent_returns_not_found
        claim_type: Not Found
        grounds:
          - entities.School
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "GET /schools/{id} with a random UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /schools/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: SchoolAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_NOT_FOUND"

      - name: create_enrollment_missing_required_field_returns_validation
        claim_type: Required Fields
        grounds:
          - entities.Enrollment
          - "errors[ERR_VALIDATION]"
        distinguishing_aspect: "POST /enrollments without planned_sessions returns ERR_VALIDATION (400) — required input with no default."
        test_recipe:
          setup: ["A school, student with SIGNED waiver, and a level exist."]
          setup_api_calls:
            - call: "POST /schools"
              payload: { name: "V School" }
              as: SchoolAdmin
              captures: { sch: $.data.id }
            - call: "POST /courses"
              payload: { school_id: "${sch}", discipline: "SURF", title: "C", kind: "LESSON" }
              as: SchoolAdmin
              captures: { crs: $.data.id }
            - call: "POST /levels"
              payload: { course_id: "${crs}", rank: 1, name: "L1", max_students_per_instructor: 4, base_price_cents: 5000, min_age: 0, requires_swim_test: false, required_equipment_type: "NONE" }
              as: SchoolAdmin
              captures: { lvl: $.data.id }
            - call: "POST /students"
              payload: { school_id: "${sch}", full_name: "Mia", birthdate: "2000-01-01" }
              as: SchoolAdmin
              captures: { stu: $.data.id }
            - call: "POST /waivers"
              payload: { student_id: "${stu}", signed_by: "Mia", expires_at: "2026-12-31T00:00:00Z" }
              as: SchoolAdmin
          trigger:
            - call: "POST /enrollments"
              payload: { school_id: "${sch}", student_id: "${stu}", course_level_id: "${lvl}", party_size: 1 }
              as: SchoolAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_VALIDATION"

      - name: level_requires_swim_test_default_true
        claim_type: Defaults
        grounds:
          - entities.CourseLevel.fields.requires_swim_test
        distinguishing_aspect: "POST /levels omitting requires_swim_test stores default true."
        test_recipe:
          setup: ["A school and course exist."]
          setup_api_calls:
            - call: "POST /schools"
              payload: { name: "D School" }
              as: SchoolAdmin
              captures: { sch: $.data.id }
            - call: "POST /courses"
              payload: { school_id: "${sch}", discipline: "SURF", title: "C", kind: "LESSON" }
              as: SchoolAdmin
              captures: { crs: $.data.id }
          trigger:
            - call: "POST /levels"
              payload: { course_id: "${crs}", rank: 1, name: "L1", max_students_per_instructor: 4, base_price_cents: 5000, min_age: 0, required_equipment_type: "NONE" }
              as: SchoolAdmin
              captures: { lvl: $.data.id, rst: $.data.requires_swim_test }
          assert:
            - "CourseLevel.${lvl}.requires_swim_test == true"

      - name: student_age_years_computed_from_clock
        claim_type: Computed Fields
        grounds:
          - entities.Student.fields.age_years
          - endpoints
        distinguishing_aspect: "age_years is computed from birthdate vs logical clock: clock 2026-03-01, birthdate 2014-03-01 -> age_years == 12 (input age ignored)."
        test_recipe:
          setup: ["Clock set to 2026-03-01."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: SchoolAdmin
            - call: "POST /schools"
              payload: { name: "Age School" }
              as: SchoolAdmin
              captures: { sch: $.data.id }
          trigger:
            - call: "POST /students"
              payload: { school_id: "${sch}", full_name: "Kid", birthdate: "2014-03-01" }
              as: SchoolAdmin
              captures: { stu: $.data.id, age: $.data.age_years }
          assert:
            - "Student.${stu}.age_years == 12"

      - name: list_schools_pagination_envelope
        claim_type: Listing
        grounds:
          - entities.School
          - endpoints
        distinguishing_aspect: "GET /schools returns paginated array with total_count and has_more in meta/envelope."
        test_recipe:
          setup: ["Two schools exist."]
          setup_api_calls:
            - call: "POST /schools"
              payload: { name: "S1" }
              as: SchoolAdmin
            - call: "POST /schools"
              payload: { name: "S2" }
              as: SchoolAdmin
          trigger:
            - call: "GET /schools"
              payload: { limit: 1, offset: 0 }
              as: SchoolAdmin
          assert:
            - "response.response_type == array"
            - "response.data length == 1 with has_more true and total_count >= 2"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: cancel_session_from_completed_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Session.status.SCHEDULED_to_CANCELLED
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "A COMPLETED session cannot be cancelled (CANCELLED only from SCHEDULED/WEATHER_HOLD) -> ERR_INVALID_STATE."
        test_recipe:
          setup: ["A session driven to COMPLETED (started in tide window, completed)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-05T08:30:00Z" }
              as: SchoolAdmin
            - call: "POST /schools"
              payload: { name: "Cm School" }
              as: SchoolAdmin
              captures: { sch: $.data.id }
            - call: "POST /courses"
              payload: { school_id: "${sch}", discipline: "SURF", title: "C", kind: "LESSON" }
              as: SchoolAdmin
              captures: { crs: $.data.id }
            - call: "POST /levels"
              payload: { course_id: "${crs}", rank: 1, name: "L1", max_students_per_instructor: 4, base_price_cents: 5000, min_age: 0, requires_swim_test: false, required_equipment_type: "NONE" }
              as: SchoolAdmin
              captures: { lvl: $.data.id }
            - call: "POST /instructors"
              payload: { school_id: "${sch}", full_name: "Kai", certified_disciplines: ["SURF"] }
              as: SchoolAdmin
              captures: { inst: $.data.id }
            - call: "POST /sessions"
              payload: { school_id: "${sch}", course_level_id: "${lvl}", instructor_id: "${inst}", starts_at: "2026-03-05T09:00:00Z", ends_at: "2026-03-05T10:00:00Z", tide_window_start: "2026-03-05T08:00:00Z", tide_window_end: "2026-03-05T12:00:00Z", capacity: 4 }
              as: SchoolAdmin
              captures: { ses: $.data.id }
            - call: "POST /sessions/${ses}/start"
              payload: {}
              as: SchoolAdmin
            - call: "POST /sessions/${ses}/complete"
              payload: {}
              as: SchoolAdmin
          trigger:
            - call: "POST /sessions/${ses}/cancel"
              payload: {}
              as: SchoolAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: start_session_outside_tide_window_returns_invalid_state
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Session.status.SCHEDULED_to_IN_PROGRESS
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Starting a SCHEDULED session when the clock is before tide_window_start fails the tide precondition -> ERR_INVALID_STATE."
        test_recipe:
          setup: ["A SCHEDULED session; clock set BEFORE its tide_window_start."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-05T06:00:00Z" }
              as: SchoolAdmin
            - call: "POST /schools"
              payload: { name: "Td School" }
              as: SchoolAdmin
              captures: { sch: $.data.id }
            - call: "POST /courses"
              payload: { school_id: "${sch}", discipline: "SURF", title: "C", kind: "LESSON" }
              as: SchoolAdmin
              captures: { crs: $.data.id }
            - call: "POST /levels"
              payload: { course_id: "${crs}", rank: 1, name: "L1", max_students_per_instructor: 4, base_price_cents: 5000, min_age: 0, requires_swim_test: false, required_equipment_type: "NONE" }
              as: SchoolAdmin
              captures: { lvl: $.data.id }
            - call: "POST /instructors"
              payload: { school_id: "${sch}", full_name: "Kai", certified_disciplines: ["SURF"] }
              as: SchoolAdmin
              captures: { inst: $.data.id }
            - call: "POST /sessions"
              payload: { school_id: "${sch}", course_level_id: "${lvl}", instructor_id: "${inst}", starts_at: "2026-03-05T09:00:00Z", ends_at: "2026-03-05T10:00:00Z", tide_window_start: "2026-03-05T08:00:00Z", tide_window_end: "2026-03-05T12:00:00Z", capacity: 4 }
              as: SchoolAdmin
              captures: { ses: $.data.id }
          trigger:
            - call: "POST /sessions/${ses}/start"
              payload: {}
              as: SchoolAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: session_initial_state_scheduled
        claim_type: Initial State
        grounds:
          - state_machines.Session.status
          - entities.Session.fields.status
        distinguishing_aspect: "A freshly scheduled session starts in status SCHEDULED."
        test_recipe:
          setup: ["A school, level, instructor exist."]
          setup_api_calls:
            - call: "POST /schools"
              payload: { name: "In School" }
              as: SchoolAdmin
              captures: { sch: $.data.id }
            - call: "POST /courses"
              payload: { school_id: "${sch}", discipline: "SURF", title: "C", kind: "LESSON" }
              as: SchoolAdmin
              captures: { crs: $.data.id }
            - call: "POST /levels"
              payload: { course_id: "${crs}", rank: 1, name: "L1", max_students_per_instructor: 4, base_price_cents: 5000, min_age: 0, requires_swim_test: false, required_equipment_type: "NONE" }
              as: SchoolAdmin
              captures: { lvl: $.data.id }
            - call: "POST /instructors"
              payload: { school_id: "${sch}", full_name: "Kai", certified_disciplines: ["SURF"] }
              as: SchoolAdmin
              captures: { inst: $.data.id }
          trigger:
            - call: "POST /sessions"
              payload: { school_id: "${sch}", course_level_id: "${lvl}", instructor_id: "${inst}", starts_at: "2026-03-10T09:00:00Z", ends_at: "2026-03-10T10:00:00Z", tide_window_start: "2026-03-10T08:00:00Z", tide_window_end: "2026-03-10T12:00:00Z", capacity: 4 }
              as: SchoolAdmin
              captures: { ses: $.data.id, st: $.data.status }
          assert:
            - "Session.${ses}.status == SCHEDULED"

      - name: terminal_returned_rental_cannot_be_cancelled
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.RentalAgreement.status.ACTIVE_to_RETURNED
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "A RETURNED (terminal) rental rejects cancel -> ERR_INVALID_STATE."
        test_recipe:
          setup: ["A rental driven RESERVED->ACTIVE->RETURNED; clock past starts_at."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-03T00:00:00Z" }
              as: SchoolAdmin
            - call: "POST /schools"
              payload: { name: "Rt School" }
              as: SchoolAdmin
              captures: { sch: $.data.id }
            - call: "POST /students"
              payload: { school_id: "${sch}", full_name: "Leo", birthdate: "2000-01-01" }
              as: SchoolAdmin
              captures: { stu: $.data.id }
            - call: "POST /equipment"
              payload: { school_id: "${sch}", equipment_type: "BOARD", asset_tag: "B-1", hourly_rate_cents: 1000, deposit_cents: 0 }
              as: SchoolAdmin
              captures: { eq: $.data.id, eqv: $.data.version }
            - call: "POST /rentals"
              payload: { school_id: "${sch}", student_id: "${stu}", equipment_item_id: "${eq}", starts_at: "2026-03-02T09:00:00Z", ends_at: "2026-03-02T12:00:00Z", expected_equipment_version: "${eqv}" }
              as: SchoolAdmin
              captures: { rent: $.data.id }
            - call: "POST /rentals/${rent}/checkout"
              payload: {}
              as: SchoolAdmin
            - call: "POST /rentals/${rent}/return"
              payload: {}
              as: SchoolAdmin
          trigger:
            - call: "POST /rentals/${rent}/cancel"
              payload: {}
              as: SchoolAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: clear_hold_from_scheduled_returns_invalid_state
        claim_type: Idempotency
        grounds:
          - state_machines.Session.status.WEATHER_HOLD_to_SCHEDULED
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "clear-hold on an already-SCHEDULED session (not WEATHER_HOLD) -> ERR_INVALID_STATE."
        test_recipe:
          setup: ["A SCHEDULED session that has never been held."]
          setup_api_calls:
            - call: "POST /schools"
              payload: { name: "Ch School" }
              as: SchoolAdmin
              captures: { sch: $.data.id }
            - call: "POST /courses"
              payload: { school_id: "${sch}", discipline: "SURF", title: "C", kind: "LESSON" }
              as: SchoolAdmin
              captures: { crs: $.data.id }
            - call: "POST /levels"
              payload: { course_id: "${crs}", rank: 1, name: "L1", max_students_per_instructor: 4, base_price_cents: 5000, min_age: 0, requires_swim_test: false, required_equipment_type: "NONE" }
              as: SchoolAdmin
              captures: { lvl: $.data.id }
            - call: "POST /instructors"
              payload: { school_id: "${sch}", full_name: "Kai", certified_disciplines: ["SURF"] }
              as: SchoolAdmin
              captures: { inst: $.data.id }
            - call: "POST /sessions"
              payload: { school_id: "${sch}", course_level_id: "${lvl}", instructor_id: "${inst}", starts_at: "2026-03-10T09:00:00Z", ends_at: "2026-03-10T10:00:00Z", tide_window_start: "2026-03-10T08:00:00Z", tide_window_end: "2026-03-10T12:00:00Z", capacity: 4 }
              as: SchoolAdmin
              captures: { ses: $.data.id }
          trigger:
            - call: "POST /sessions/${ses}/clear-hold"
              payload: {}
              as: SchoolAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: certification_card_issued_on_certification_course_completion
        claim_type: Side Effect Execution
        grounds:
          - state_machines.Enrollment.progress_status.ACTIVE_to_COMPLETED
          - entities.CertificationCard
          - entities.Course.fields.kind
        distinguishing_aspect: "Completing a CERTIFICATION-course enrollment issues exactly one CertificationCard discoverable via GET /certification-cards?enrollment_id=."
        test_recipe:
          setup: ["CERTIFICATION course; enrollment planned 1, party 1; student attends the single session; PAID."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: SchoolAdmin
            - call: "POST /schools"
              payload: { name: "Cert School" }
              as: SchoolAdmin
              captures: { sch: $.data.id }
            - call: "POST /courses"
              payload: { school_id: "${sch}", discipline: "SAIL", title: "Cert Sail", kind: "CERTIFICATION" }
              as: SchoolAdmin
              captures: { crs: $.data.id }
            - call: "POST /levels"
              payload: { course_id: "${crs}", rank: 1, name: "L1", max_students_per_instructor: 4, base_price_cents: 5000, min_age: 0, requires_swim_test: false, required_equipment_type: "NONE" }
              as: SchoolAdmin
              captures: { lvl: $.data.id }
            - call: "POST /instructors"
              payload: { school_id: "${sch}", full_name: "Ana", certified_disciplines: ["SAIL"] }
              as: SchoolAdmin
              captures: { inst: $.data.id }
            - call: "POST /students"
              payload: { school_id: "${sch}", full_name: "Mia", birthdate: "2000-01-01" }
              as: SchoolAdmin
              captures: { stu: $.data.id }
            - call: "POST /waivers"
              payload: { student_id: "${stu}", signed_by: "Mia", expires_at: "2026-12-31T00:00:00Z" }
              as: SchoolAdmin
            - call: "POST /enrollments"
              payload: { school_id: "${sch}", student_id: "${stu}", course_level_id: "${lvl}", planned_sessions: 1, party_size: 1 }
              as: SchoolAdmin
              captures: { enr: $.data.id }
            - call: "POST /enrollments/${enr}/pay"
              payload: {}
              as: SchoolAdmin
            - call: "POST /sessions"
              payload: { school_id: "${sch}", course_level_id: "${lvl}", instructor_id: "${inst}", starts_at: "2026-03-05T09:00:00Z", ends_at: "2026-03-05T10:00:00Z", tide_window_start: "2026-03-05T08:00:00Z", tide_window_end: "2026-03-05T12:00:00Z", capacity: 4 }
              as: SchoolAdmin
              captures: { ses: $.data.id, v0: $.data.version }
            - call: "POST /bookings"
              payload: { session_id: "${ses}", enrollment_id: "${enr}", expected_session_version: "${v0}" }
              as: SchoolAdmin
              captures: { bk: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-05T08:30:00Z" }
              as: SchoolAdmin
            - call: "POST /sessions/${ses}/start"
              payload: {}
              as: SchoolAdmin
            - call: "POST /bookings/${bk}/check-in"
              payload: {}
              as: SchoolAdmin
            - call: "POST /sessions/${ses}/complete"
              payload: {}
              as: SchoolAdmin
            - call: "POST /enrollments/${enr}/complete"
              payload: {}
              as: SchoolAdmin
          trigger:
            - call: "GET /certification-cards"
              payload: { enrollment_id: "${enr}" }
              as: SchoolAdmin
          assert:
            - "response.data length == 1 (one CertificationCard for this enrollment)"
            - "response.data[0].discipline == SAIL"

  # ===========================================================================
  - section: calculations
    instances:
      - name: rental_fee_tier_boundary_at_two_hours
        claim_type: Constants Applied
        grounds:
          - calculations.rental_fee
          - entities.RentalAgreement.fields.rental_fee_cents
        distinguishing_aspect: "At exactly 2h the tier-1 boundary holds: 2h@rate1000 -> 2000 (no tier-2 charge)."
        test_recipe:
          setup: ["Equipment rate 1000; rental window exactly 2h."]
          setup_api_calls:
            - call: "POST /schools"
              payload: { name: "Tb School" }
              as: SchoolAdmin
              captures: { sch: $.data.id }
            - call: "POST /students"
              payload: { school_id: "${sch}", full_name: "Leo", birthdate: "2000-01-01" }
              as: SchoolAdmin
              captures: { stu: $.data.id }
            - call: "POST /equipment"
              payload: { school_id: "${sch}", equipment_type: "KAYAK", asset_tag: "K-1", hourly_rate_cents: 1000, deposit_cents: 0 }
              as: SchoolAdmin
              captures: { eq: $.data.id, eqv: $.data.version }
          trigger:
            - call: "POST /rentals"
              payload: { school_id: "${sch}", student_id: "${stu}", equipment_item_id: "${eq}", starts_at: "2026-03-02T09:00:00Z", ends_at: "2026-03-02T11:00:00Z", expected_equipment_version: "${eqv}" }
              as: SchoolAdmin
              captures: { rent: $.data.id, fee: $.data.rental_fee_cents }
          assert:
            - "RentalAgreement.${rent}.rental_fee_cents == 2000"

      - name: refund_half_tier_at_thirty_six_hours
        claim_type: Correct Result
        grounds:
          - calculations.enrollment_refund
          - entities.Enrollment.fields.refund_cents
        distinguishing_aspect: "Earliest remaining session 36h out (>=24, <48) -> 50% refund of estimate 10000 -> 5000."
        test_recipe:
          setup: ["Clock 2026-03-01T00:00:00Z; estimate 10000; one remaining booked session at 2026-03-02T12:00:00Z (36h out); PAID then WITHDRAWN."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: SchoolAdmin
            - call: "POST /schools"
              payload: { name: "Hf School" }
              as: SchoolAdmin
              captures: { sch: $.data.id }
            - call: "POST /courses"
              payload: { school_id: "${sch}", discipline: "SURF", title: "C", kind: "LESSON" }
              as: SchoolAdmin
              captures: { crs: $.data.id }
            - call: "POST /levels"
              payload: { course_id: "${crs}", rank: 1, name: "L1", max_students_per_instructor: 4, base_price_cents: 10000, min_age: 0, requires_swim_test: false, required_equipment_type: "NONE" }
              as: SchoolAdmin
              captures: { lvl: $.data.id }
            - call: "POST /instructors"
              payload: { school_id: "${sch}", full_name: "Kai", certified_disciplines: ["SURF"] }
              as: SchoolAdmin
              captures: { inst: $.data.id }
            - call: "POST /students"
              payload: { school_id: "${sch}", full_name: "Mia", birthdate: "2000-01-01" }
              as: SchoolAdmin
              captures: { stu: $.data.id }
            - call: "POST /waivers"
              payload: { student_id: "${stu}", signed_by: "Mia", expires_at: "2026-12-31T00:00:00Z" }
              as: SchoolAdmin
            - call: "POST /enrollments"
              payload: { school_id: "${sch}", student_id: "${stu}", course_level_id: "${lvl}", planned_sessions: 1, party_size: 1 }
              as: SchoolAdmin
              captures: { enr: $.data.id }
            - call: "POST /enrollments/${enr}/pay"
              payload: {}
              as: SchoolAdmin
            - call: "POST /sessions"
              payload: { school_id: "${sch}", course_level_id: "${lvl}", instructor_id: "${inst}", starts_at: "2026-03-02T12:00:00Z", ends_at: "2026-03-02T13:00:00Z", tide_window_start: "2026-03-02T11:00:00Z", tide_window_end: "2026-03-02T15:00:00Z", capacity: 4 }
              as: SchoolAdmin
              captures: { ses: $.data.id, v0: $.data.version }
            - call: "POST /bookings"
              payload: { session_id: "${ses}", enrollment_id: "${enr}", expected_session_version: "${v0}" }
              as: SchoolAdmin
