          - calculations.grant_pool_waterfall
        distinguishing_aspect: "The pool ceiling is checked after a bucket has been resolved, so the third reservation is refused with ERR_GRANT_CYCLE_POOL_EXHAUSTED even though its TIER_ANY fallback bucket had room, and once the cycle is CLOSED the same reservation and any new submission both fail earlier with ERR_GRANT_CYCLE_CLOSED."
        test_recipe:
          setup:
            - "A 400,000-cent cycle: tier caps are TIER_LOW 240,000, TIER_MID 160,000 and TIER_ANY 100,000"
            - "Grant 1 TIER_LOW estimate 240,000 -> award 240,000 reserved in TIER_LOW (bucket exactly full)"
            - "Grant 2 TIER_MID estimate 200,000 -> award 150,000 reserved in TIER_MID; pool now holds 390,000 of 400,000"
            - "Grant 3 TIER_MID estimate 20,000 -> award 15,000: TIER_MID would reach 165,000 > 160,000 so it falls back to TIER_ANY (0 + 15,000 <= 100,000), but the pool would reach 405,000"
