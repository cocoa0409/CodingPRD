            - { call: "GET /geo/subcontractors/${s_id}", payload: {}, as: ProjectManager, captures: { hrs: "$.data.committed_rig_hours" } }
          assert:
            - "captured err == ERR_RIG_DOUBLE_BOOKED (15:00 start overlaps [08:00, 16:00))"
            - "ra2 created successfully (adjacent start == 16:00 == prior end is legal under half-open semantics)"
            - "captured hrs == 24.0 (8h + 16h committed)"
