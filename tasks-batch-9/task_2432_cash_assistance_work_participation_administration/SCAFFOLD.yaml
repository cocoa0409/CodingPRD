scenario: |
  Generate task harder than expert level!

  2432. Cash Assistance & Work Participation Administration (state temporary assistance program): application, eligibility determination and benefit calculation with countable income and resource rules, time limit tracking with extensions and hardship exemptions, work requirement assignment with allowable activity categories and hourly requirements by family type, participation verification, good cause and sanction progression with conciliation, supportive service authorization for transportation, child care and work expenses, work participation rate calculation and caseload reduction credit for federal reporting, diversion assistance as an alternative to ongoing benefits, overpayment establishment, recovery and fraud referral

domain_name: cash-assistance-work-participation
api_prefix: ""   # flat topology: every collection is a top-level path segment

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - rate_threshold_triggers
    - cascading_side_effects
    - dual_variant_calculation
    - optimistic_concurrency
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - self_referential      # ComplianceEpisode.prior_episode_id -> ComplianceEpisode.id
    - cross_aggregate       # SupportiveServiceAuthorization spans AssistanceCase + WorkAssignment
  role_model: segregation_of_duties
  consistency_model: immediate
  difficulty_level: beyond_expert
  notes: |
    Three non-linear machines: AssistanceCase carries two independent state
    dimensions (benefit_status x compliance_status); ComplianceEpisode cycles
    SANCTION_IMPOSED -> CURE_PENDING -> SANCTION_IMPOSED with level escalation;
    Application forks DETERMINED -> {APPROVED, DENIED, DIVERSION_OFFERED} and
    loops DIVERSION_OFFERED -> DETERMINED on decline.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Household
    parent: null
    common_fields: true
    fields:
      - name: head_of_household_name
        type: string
        source: input
        description: Name of the head of the assistance unit.
      - name: county_code
        type: string
        source: input
        description: Administering county office code.
        constraints: exactly 3 uppercase letters
      - name: household_size
        type: integer
        source: input
        description: Number of persons in the assistance unit.
        constraints: ">= 1"
      - name: adult_count
        type: integer
        source: input
        description: Number of work-eligible adults in the assistance unit.
        constraints: ">= 0"
      - name: youngest_child_age_months
        type: integer
        source: input
        description: Age in months of the youngest child; 0 when there is no child.
        constraints: ">= 0"
      - name: has_subsidized_child_care
        type: boolean
        source: input
        description: Whether the unit receives federally subsidized child care.
        default: false
      - name: family_type
        type: enum
        source: computed
        description: Federal family-type classification driving hourly requirements.
        constraints: "CHILD_ONLY | SINGLE_PARENT_CHILD_UNDER_6 | SINGLE_PARENT | TWO_PARENT_NO_SUBSIDIZED_CHILD_CARE | TWO_PARENT_WITH_SUBSIDIZED_CHILD_CARE"
      - name: prior_state_clock_months
        type: integer
        source: system
        description: State time-limit months carried in from another jurisdiction or legacy system.
        default: 0
      - name: prior_federal_clock_months
        type: integer
        source: system
        description: Federal 60-month clock months carried in from another jurisdiction.
        default: 0
      - name: state_clock_months_used
        type: integer
        source: computed
        description: prior_state_clock_months plus count of state-countable TimeLimitMonth rows across all cases of this household.
      - name: federal_clock_months_used
        type: integer
        source: computed
        description: prior_federal_clock_months plus count of federal-countable TimeLimitMonth rows across all cases of this household.
      - name: extension_months_used
        type: integer
        source: computed
        description: Count of issued non-child-only TimeLimitMonth rows made state-non-countable by a GRANTED TimeLimitExtension.
      - name: issued_countable_months
        type: integer
        source: computed
        description: Count of TimeLimitMonth rows with assistance_issued true whose case family_type is not CHILD_ONLY (the conserved month quantity).
      - name: diversion_ineligible_through_month
        type: string
        source: computed
        description: Last month (YYYY-MM) inclusive during which this household may not be determined for ongoing assistance; null when no ACCEPTED DiversionGrant exists.

  - name: Application
    parent: null
    common_fields: true
    fields:
      - name: household_id
        type: string
        source: input
        description: FK -> Household.id; the applying assistance unit.
      - name: application_month
        type: string
        source: input
        description: Month of application in YYYY-MM.
      - name: requested_program
        type: enum
        source: input
        description: Whether the applicant will consider diversion assistance.
        constraints: "ONGOING_ASSISTANCE | DIVERSION_CONSIDERED"
      - name: budgeting_method
        type: enum
        source: input
        description: Income-budgeting variant selector used by countable_income_determination.
        default: PROSPECTIVE
        constraints: "PROSPECTIVE | RETROSPECTIVE"
      - name: status
        type: enum
        source: system
        description: Application lifecycle state.
        default: RECEIVED
        constraints: "RECEIVED | DETERMINED | DIVERSION_OFFERED | APPROVED | DENIED | DIVERTED | WITHDRAWN"
      - name: snapshot_family_type
        type: enum
        source: computed
        description: Household.family_type frozen at determination time; null before determination.
      - name: countable_income_cents
        type: integer
        source: computed
        description: Output of countable_income_determination; null before determination.
      - name: countable_resources_cents
        type: integer
        source: computed
        description: Output of countable_resource_determination; null before determination.
      - name: determined_benefit_cents
        type: integer
        source: computed
        description: Output of benefit_amount_calculation with sanction_pct 0.00; null before determination.
      - name: determined_by_user_id
        type: string
        source: system
        description: X-User-ID of the Caseworker who ran the determination; null before determination.
      - name: decided_by_user_id
        type: string
        source: system
        description: X-User-ID of the EligibilitySupervisor who approved or denied; null before decision.
      - name: denial_reason
        type: enum
        source: system
        description: Reason recorded on denial.
        default: NONE
        constraints: "NONE | RESOURCES_OVER_LIMIT | ZERO_BENEFIT | TIME_LIMIT | FAILURE_TO_COOPERATE | OTHER"
      - name: withdrawal_reason
        type: string
        source: system
        description: Free-text reason recorded on withdrawal; null otherwise.

  - name: IncomeSource
    parent: Application
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: input
        description: FK -> Application.id; the application this income belongs to.
      - name: source_type
        type: enum
        source: input
        description: Income category.
        constraints: "EARNED | UNEARNED_CHILD_SUPPORT | UNEARNED_SSI | UNEARNED_UI"
      - name: gross_monthly_cents
        type: integer
        source: input
        description: Anticipated gross monthly amount used by the PROSPECTIVE variant.
        constraints: ">= 0"
      - name: month_1_cents
        type: integer
        source: input
        description: Gross amount for the first of the three retrospective base months.
        default: 0
      - name: month_2_cents
        type: integer
        source: input
        description: Gross amount for the second retrospective base month.
        default: 0
      - name: month_3_cents
        type: integer
        source: input
        description: Gross amount for the third retrospective base month.
        default: 0
      - name: is_recurring
        type: boolean
        source: input
        description: Whether the income is expected to continue; PROSPECTIVE counts only recurring income.
      - name: verification_status
        type: enum
        source: system
        description: Verification outcome recorded by the Caseworker.
        default: UNVERIFIED
        constraints: "UNVERIFIED | VERIFIED | REFUSED"

  - name: ResourceItem
    parent: Application
    common_fields: false
    fields:
      - name: application_id
        type: string
        source: input
        description: FK -> Application.id; the application this resource belongs to.
      - name: item_type
        type: enum
        source: input
        description: Resource category.
        constraints: "LIQUID_ASSET | VEHICLE | REAL_PROPERTY | RETIREMENT"
      - name: gross_value_cents
        type: integer
        source: input
        description: Fair market value in cents.
        constraints: ">= 0"
      - name: encumbrance_cents
        type: integer
        source: input
        description: Verified debt secured by the item.
        default: 0
      - name: exclusion_type
        type: enum
        source: input
        description: Statutory exclusion claimed for the item.
        constraints: "NONE | PRIMARY_VEHICLE | HOMESTEAD | RETIREMENT_ACCOUNT"
      - name: countable_value_cents
        type: integer
        source: computed
        description: 0 when an exclusion applies, else max(0, gross_value_cents - encumbrance_cents).

  - name: AssistanceCase
    parent: null
    common_fields: true
    fields:
      - name: household_id
        type: string
        source: system
        description: FK -> Household.id; copied from the approved application.
      - name: application_id
        type: string
        source: system
        description: FK -> Application.id; the application that produced this case.
      - name: case_number
        type: string
        source: system
        description: Human-readable case number minted at approval.
      - name: certification_start_month
        type: string
        source: system
        description: First month of the certification period in YYYY-MM.
      - name: benefit_status
        type: enum
        source: system
        description: Payment dimension of the case (independent of compliance_status).
        default: PENDING_ISSUANCE
        constraints: "PENDING_ISSUANCE | ACTIVE | SUSPENDED | CLOSED"
      - name: compliance_status
        type: enum
        source: system
        description: Work-program dimension of the case (independent of benefit_status).
        constraints: "NOT_REQUIRED | EXEMPT | ASSIGNED | CONCILIATION_PENDING | SANCTIONED | CURE_PENDING"
      - name: closure_reason
        type: enum
        source: system
        description: Why the case closed.
        default: NONE
        constraints: "NONE | TIME_LIMIT | FULL_FAMILY_SANCTION"
      - name: family_type
        type: enum
        source: system
        description: Household.family_type frozen at approval; drives required hours.
      - name: household_size
        type: integer
        source: system
        description: Household.household_size frozen at approval; drives the payment standard.
      - name: countable_income_cents
        type: integer
        source: system
        description: Application.countable_income_cents frozen at approval.
      - name: sanction_level
        type: integer
        source: computed
        description: Highest sanction level currently in force from this case's ComplianceEpisode rows.
        default: 0
      - name: sanction_pct
        type: number
        source: computed
        description: Grant-reduction fraction implied by sanction_level.
        default: 0.00
      - name: benefit_amount_cents
        type: integer
        source: computed
        description: Output of benefit_amount_calculation for the current sanction_pct.
      - name: required_weekly_hours
        type: integer
        source: computed
        description: Total weekly hour requirement for family_type.
      - name: required_core_weekly_hours
        type: integer
        source: computed
        description: Core-activity weekly hour requirement for family_type.
      - name: required_monthly_hours
        type: integer
        source: computed
        description: required_weekly_hours * WEEKS_PER_REPORT_MONTH.
      - name: required_core_monthly_hours
        type: integer
        source: computed
        description: required_core_weekly_hours * WEEKS_PER_REPORT_MONTH.
      - name: supportive_fy_authorized_cents
        type: integer
        source: computed
        description: Sum of authorized_amount_cents over this case's AUTHORIZED SupportiveServiceAuthorization rows in the current federal fiscal year.
        default: 0

  - name: TimeLimitMonth
    parent: AssistanceCase
    common_fields: false
    fields:
      - name: case_id
        type: string
        source: input
        description: FK -> AssistanceCase.id; the case that issued this month.
      - name: benefit_month
        type: string
        source: input
        description: Issued month in YYYY-MM.
      - name: assistance_issued
        type: boolean
        source: system
        description: Always true for rows created by an issuance.
        default: true
      - name: state_clock_countable
        type: boolean
        source: computed
        description: Whether this month counts against the 24-month state limit.
      - name: federal_clock_countable
        type: boolean
        source: computed
        description: Whether this month counts against the 60-month federal limit.
      - name: non_countable_reason
        type: enum
        source: computed
        description: Why the month is excluded from the state clock.
        default: NONE
        constraints: "NONE | CHILD_ONLY_CASE | GRANTED_EXTENSION"

  - name: TimeLimitExtension
    parent: AssistanceCase
    common_fields: true
    fields:
      - name: case_id
        type: string
        source: input
        description: FK -> AssistanceCase.id; the case requesting the hardship extension.
      - name: extension_type
        type: enum
        source: input
        description: Hardship category claimed.
        constraints: "HARDSHIP_DOMESTIC_VIOLENCE | HARDSHIP_DISABILITY | HARDSHIP_LOCAL_LABOR_MARKET | HARDSHIP_CARETAKER"
      - name: months_requested
        type: integer
        source: input
        description: Number of extension months requested.
        constraints: "1..12"
      - name: first_effective_month
        type: string
        source: input
        description: First month covered by the extension in YYYY-MM.
      - name: months_granted
        type: integer
        source: system
        description: Months actually granted by the supervisor.
        default: 0
      - name: last_effective_month
        type: string
        source: computed
        description: first_effective_month + months_granted - 1, inclusive; null until granted.
      - name: status
        type: enum
        source: system
        description: Extension lifecycle state.
        default: REQUESTED
        constraints: "REQUESTED | GRANTED | DENIED | REVOKED"
      - name: denial_reason
        type: string
        source: system
        description: Free-text denial reason; null otherwise.
      - name: revocation_reason
        type: string
        source: system
        description: Free-text revocation reason; null otherwise.
      - name: decided_by_user_id
        type: string
        source: system
        description: X-User-ID of the EligibilitySupervisor who granted, denied or revoked.

  - name: WorkAssignment
    parent: AssistanceCase
    common_fields: true
    fields:
      - name: case_id
        type: string
        source: input
        description: FK -> AssistanceCase.id; the case assigned to this activity.
      - name: activity_category
        type: enum
        source: input
        description: Allowable federal activity category.
        constraints: "UNSUBSIDIZED_EMPLOYMENT | SUBSIDIZED_EMPLOYMENT | WORK_EXPERIENCE | ON_THE_JOB_TRAINING | JOB_SEARCH_READINESS | COMMUNITY_SERVICE | VOCATIONAL_EDUCATION | JOB_SKILLS_TRAINING_DIRECT | EDUCATION_RELATED_TO_EMPLOYMENT | SECONDARY_SCHOOL"
      - name: is_core
        type: boolean
        source: computed
        description: True when activity_category is in CORE_CATEGORIES.
      - name: scheduled_weekly_hours
        type: integer
        source: input
        description: Weekly hours scheduled for this activity.
        constraints: "1..60"
      - name: start_date
        type: string
        source: input
        description: Inclusive start date (YYYY-MM-DD) of the assignment interval.
      - name: end_date
        type: string
        source: input
        description: Exclusive end date (YYYY-MM-DD) of the assignment interval (half-open [start_date, end_date)).
      - name: status
        type: enum
        source: system
        description: Assignment lifecycle state.
        default: PROPOSED
        constraints: "PROPOSED | ACTIVE | COMPLETED | TERMINATED"
      - name: termination_reason
        type: enum
        source: system
        description: Reason recorded when the assignment leaves ACTIVE or PROPOSED.
        default: NONE
        constraints: "NONE | COMPLETED_ACTIVITY | NONCOMPLIANCE | CASE_CLOSED | PLAN_CHANGE"
      - name: cumulative_verified_hours
        type: integer
        source: computed
        description: Sum of verified_hours over this assignment's VERIFIED ParticipationReport rows.
        default: 0
      - name: compliance_flag
        type: enum
        source: computed
        description: SHORTFALL when the most recent verification left the case-month participation predicate false.
        default: NONE
        constraints: "NONE | SHORTFALL"

  - name: ParticipationReport
    parent: WorkAssignment
    common_fields: true
    fields:
      - name: work_assignment_id
        type: string
        source: input
        description: FK -> WorkAssignment.id; the assignment whose hours are reported.
      - name: report_month
        type: string
        source: input
        description: Reported month in YYYY-MM.
      - name: reported_hours
        type: integer
        source: input
        description: Hours claimed by the participant or provider.
        constraints: "0..744"
      - name: verification_source
        type: enum
        source: input
        description: Documentation type backing the report; SELF_REPORT is credited at 50 percent.
        constraints: "EMPLOYER_ATTESTATION | TIMESHEET | THIRD_PARTY | SELF_REPORT"
      - name: status
        type: enum
        source: system
        description: Report lifecycle state.
        default: SUBMITTED
        constraints: "SUBMITTED | VERIFIED | REJECTED"
      - name: verified_hours
        type: integer
        source: computed
        description: Credited hours after applying the verification_source factor; null until verified.
      - name: core_hours_credited
        type: integer
        source: computed
        description: verified_hours when the assignment is core, else 0.
        default: 0
      - name: non_core_hours_credited
        type: integer
        source: computed
        description: verified_hours when the assignment is non-core, else 0.
        default: 0
      - name: rejection_reason
        type: string
        source: system
        description: Free-text rejection reason; null otherwise.

  - name: ComplianceEpisode
    parent: AssistanceCase
    common_fields: true
    fields:
      - name: case_id
        type: string
        source: input
        description: FK -> AssistanceCase.id; the case under noncompliance review.
      - name: prior_episode_id
        type: string
        source: input
        description: FK -> ComplianceEpisode.id; the earlier episode whose sanction_level this episode escalates from; null for a first episode.
      - name: allegation_reason
        type: enum
        source: input
        description: Basis of the noncompliance allegation.
        constraints: "HOURS_SHORTFALL | REFUSED_ASSIGNMENT | QUIT_EMPLOYMENT | MISSED_APPOINTMENT"
      - name: origin
        type: enum
        source: system
        description: Whether the episode was auto-created by a shortfall verification or referred by staff.
        constraints: "SYSTEM_SHORTFALL | CASEWORKER_REFERRAL"
      - name: status
        type: enum
        source: system
        description: Episode lifecycle state; cycles SANCTION_IMPOSED -> CURE_PENDING -> SANCTION_IMPOSED.
        default: ALLEGED
        constraints: "ALLEGED | CONCILIATION | SANCTION_IMPOSED | CURE_PENDING | RESOLVED_COMPLIANT | GOOD_CAUSE_GRANTED"
      - name: conciliation_start_date
        type: string
        source: system
        description: Logical-clock date (YYYY-MM-DD) when conciliation began; null before start.
      - name: conciliation_deadline_date
        type: string
        source: computed
        description: conciliation_start_date + CONCILIATION_DAYS; sanction may not be imposed before this date.
      - name: sanction_level
        type: integer
        source: computed
        description: Sanction step currently in force for this episode (0 when none imposed).
        default: 0
      - name: sanction_pct
        type: number
        source: computed
        description: SANCTION_PCT_BY_LEVEL[sanction_level].
        default: 0.00
      - name: sanction_imposed_month
        type: string
        source: computed
        description: Logical-clock month (YYYY-MM) of the first sanction imposition on this episode; used by the WPR sanction disregard.
      - name: good_cause_reason
        type: enum
        source: system
        description: Good-cause basis when granted.
        default: NONE
        constraints: "NONE | DOMESTIC_VIOLENCE | NO_CHILD_CARE_AVAILABLE | ILLNESS | TRANSPORTATION_UNAVAILABLE"
      - name: cure_plan_note
        type: string
        source: system
        description: Free-text cure plan recorded when the cure period opens; null otherwise.

  - name: SupportiveServiceAuthorization
    parent: AssistanceCase
    common_fields: true
    fields:
      - name: case_id
        type: string
        source: input
        description: FK -> AssistanceCase.id; the case receiving the supportive service.
      - name: work_assignment_id
        type: string
        source: input
        description: FK -> WorkAssignment.id; the activity the service supports.
      - name: service_type
        type: enum
        source: input
        description: Supportive service category, each with its own fiscal-year cap.
        constraints: "TRANSPORTATION | CHILD_CARE | WORK_EXPENSE"
      - name: requested_amount_cents
        type: integer
        source: input
        description: Amount requested by the participant or specialist.
        constraints: ">= 1"
      - name: period_start
        type: string
        source: input
        description: Inclusive first date (YYYY-MM-DD) of the service period.
      - name: period_end
        type: string
        source: input
        description: Inclusive last date (YYYY-MM-DD) of the service period (closed interval [period_start, period_end]).
      - name: fiscal_year
        type: integer
        source: computed
        description: Federal fiscal year of period_start (year + 1 when month >= 10).
      - name: authorized_amount_cents
        type: integer
        source: computed
        description: Waterfall-allocated amount; 0 while REQUESTED, HELD or VOIDED.
        default: 0
      - name: status
        type: enum
        source: system
        description: Authorization lifecycle state; HELD -> REQUESTED forms a cycle.
        default: REQUESTED
        constraints: "REQUESTED | HELD | AUTHORIZED | VOIDED"
      - name: void_reason
        type: string
        source: system
        description: Free-text void reason; null otherwise.

  - name: DiversionGrant
    parent: Application
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: input
        description: FK -> Application.id; the application offered diversion instead of ongoing assistance.
      - name: monthly_benefit_basis_cents
        type: integer
        source: system
        description: Application.determined_benefit_cents frozen when the offer was made.
      - name: lump_sum_cents
        type: integer
        source: computed
        description: min(monthly_benefit_basis_cents * DIVERSION_MULTIPLIER, DIVERSION_MAX_CENTS).
      - name: ineligibility_months
        type: integer
        source: computed
        description: min(DIVERSION_MAX_INELIGIBILITY_MONTHS, ceil(lump_sum_cents / monthly_benefit_basis_cents)).
      - name: ineligibility_end_month
        type: string
        source: computed
        description: application_month + ineligibility_months - 1, inclusive, in YYYY-MM.
      - name: status
        type: enum
        source: system
        description: Offer lifecycle state.
        default: OFFERED
        constraints: "OFFERED | ACCEPTED | DECLINED"
      - name: decline_reason
        type: string
        source: system
        description: Free-text decline reason; null otherwise.

  - name: Overpayment
    parent: AssistanceCase
    common_fields: true
    fields:
      - name: case_id
        type: string
        source: input
        description: FK -> AssistanceCase.id; the case that was overpaid.
      - name: claim_type
        type: enum
        source: input
        description: Cause of the overpayment; drives the recoupment percentage.
        constraints: "AGENCY_ERROR | CLIENT_ERROR | SUSPECTED_FRAUD"
      - name: months_covered
        type: array
        source: input
        description: Non-empty list of YYYY-MM months the claim covers; each must have an issued TimeLimitMonth on the case.
      - name: gross_amount_cents
        type: integer
        source: input
        description: Gross overissued amount before any underpayment offset.
        constraints: ">= 1"
      - name: offsetting_underpayment_cents
        type: integer
        source: input
        description: Underpaid amount available to offset under the NET method.
        default: 0
      - name: computation_method
        type: enum
        source: input
        description: Establishment variant selector.
        constraints: "GROSS | NET"
      - name: established_amount_cents
        type: integer
        source: computed
        description: Amount established as debt by overpayment_establishment; 0 while DRAFT.
        default: 0
      - name: total_recovered_cents
        type: integer
        source: computed
        description: Sum of signed_amount_cents over this claim's RecoveryTransaction rows.
        default: 0
      - name: balance_cents
        type: integer
        source: computed
        description: established_amount_cents - total_recovered_cents.
        default: 0
      - name: monthly_recoupment_cents
        type: integer
        source: computed
        description: Monthly benefit recoupment amount set at establishment and re-set on fraud substantiation.
        default: 0
      - name: status
        type: enum
        source: system
        description: Claim lifecycle state; SATISFIED -> IN_RECOVERY on reversal forms a cycle.
        default: DRAFT
        constraints: "DRAFT | ESTABLISHED | IN_RECOVERY | SATISFIED | WRITTEN_OFF"
      - name: recoupment_status
        type: enum
        source: system
        description: Whether benefit recoupment is running; paused while the case is SUSPENDED or CLOSED.
        default: NOT_STARTED
        constraints: "NOT_STARTED | ACTIVE | PAUSED"
      - name: fraud_referral_status
        type: enum
        source: system
        description: Independent fraud-investigation dimension of the claim.
        default: NOT_REFERRED
        constraints: "NOT_REFERRED | REFERRED | SUBSTANTIATED | UNSUBSTANTIATED"
      - name: established_by_user_id
        type: string
        source: system
        description: X-User-ID of the officer who established the claim; a different officer must write it off.
      - name: write_off_reason
        type: string
        source: system
        description: Free-text write-off reason; null otherwise.
      - name: referral_note
        type: string
        source: system
        description: Free-text fraud referral note; null otherwise.

  - name: RecoveryTransaction
    parent: Overpayment
    common_fields: false
    fields:
      - name: overpayment_id
        type: string
        source: input
        description: FK -> Overpayment.id; the claim this ledger entry applies to.
      - name: method
        type: enum
        source: input
        description: Recovery channel; RECOUPMENT_REVERSAL credits the participant back.
        constraints: "BENEFIT_RECOUPMENT | CASH_PAYMENT | TAX_INTERCEPT | RECOUPMENT_REVERSAL"
      - name: amount_cents
        type: integer
        source: input
        description: Absolute amount of the entry.
        constraints: ">= 1"
      - name: applied_month
        type: string
        source: input
        description: Month the entry is booked to, in YYYY-MM.
      - name: signed_amount_cents
        type: integer
        source: computed
        description: -amount_cents when method is RECOUPMENT_REVERSAL, else +amount_cents.

  - name: FederalReportingPeriod
    parent: null
    common_fields: true
    fields:
      - name: fiscal_year
        type: integer
        source: input
        description: Federal fiscal year (October of FY-1 through September of FY).
      - name: quarter
        type: integer
        source: input
        description: Federal fiscal quarter; 1 = Oct-Dec, 2 = Jan-Mar, 3 = Apr-Jun, 4 = Jul-Sep.
        constraints: "1..4"
      - name: prior_year_caseload
        type: number
        source: input
        description: Average monthly caseload of the comparison year, used by the caseload reduction credit.
        constraints: ">= 0"
      - name: eligibility_change_caseload_effect
        type: number
        source: input
        description: Percentage points of caseload decline attributable to eligibility-rule changes, which may not be credited.
        constraints: ">= 0"
      - name: current_caseload
        type: number
        source: computed
        description: Average monthly UNADJUSTED denominator across the quarter's three months.
        default: 0.00
      - name: wpr_all_families_pct
        type: number
        source: computed
        description: All-families work participation rate over the sanction-disregard-ADJUSTED denominator.
        default: 0.00
      - name: wpr_two_parent_pct
        type: number
        source: computed
        description: Two-parent work participation rate over the adjusted two-parent denominator.
        default: 0.00
      - name: caseload_reduction_credit_pct
        type: number
        source: computed
        description: Credited percentage-point reduction, capped at CRC_MAX_PCT.
        default: 0.00
      - name: adjusted_target_all_families_pct
        type: number
        source: computed
        description: max(0.00, WPR_STATUTORY_TARGET_ALL_PCT - caseload_reduction_credit_pct).
        default: 50.00
      - name: target_met
        type: boolean
        source: computed
        description: wpr_all_families_pct >= adjusted_target_all_families_pct.
        default: false
      - name: status
        type: enum
        source: system
        description: Reporting period lifecycle state.
        default: OPEN
        constraints: "OPEN | CALCULATED | CERTIFIED"
      - name: calculated_by_user_id
        type: string
        source: system
        description: X-User-ID of the analyst who last calculated; a different analyst must certify.
      - name: certified_by_user_id
        type: string
        source: system
        description: X-User-ID of the analyst who certified; null before certification.

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Application
    initial_state: RECEIVED
    terminal_states: [APPROVED, DENIED, DIVERTED, WITHDRAWN]
    shape: branching_with_cycle
    transitions:
      - from: RECEIVED
        to: DETERMINED
        trigger: "POST /applications/{id}/determine"
        actor: Caseworker
        preconditions:
          - "Application.status == RECEIVED"
          - "Household.diversion_ineligible_through_month is null OR Application.application_month > Household.diversion_ineligible_through_month (string compare on YYYY-MM)"
        side_effects:
          - "Application.snapshot_family_type := Household.family_type"
          - "recompute Application.countable_income_cents via countable_income_determination"
          - "recompute Application.countable_resources_cents via countable_resource_determination"
          - "recompute Application.determined_benefit_cents via benefit_amount_calculation with sanction_pct 0.00"
          - "Application.determined_by_user_id := X-User-ID"
      - from: DETERMINED
        to: APPROVED
        trigger: "POST /applications/{id}/approve"
        actor: EligibilitySupervisor
        preconditions:
          - "Application.status == DETERMINED"
          - "X-User-ID != Application.determined_by_user_id"
          - "Household.state_clock_months_used < STATE_TIME_LIMIT_MONTHS OR a GRANTED TimeLimitExtension on any case of this household covers certification_start_month"
          - "Application.countable_resources_cents <= RESOURCE_LIMIT_CENTS"
          - "Application.determined_benefit_cents > 0"
        side_effects:
          - "Application.decided_by_user_id := X-User-ID"
          - "create AssistanceCase with benefit_status PENDING_ISSUANCE, closure_reason NONE, family_type/household_size/countable_income_cents snapshotted, benefit_amount_cents := Application.determined_benefit_cents, sanction_level 0, sanction_pct 0.00, supportive_fy_authorized_cents 0"
          - "AssistanceCase.compliance_status := NOT_REQUIRED when family_type == CHILD_ONLY, else ASSIGNED"
          - "recompute AssistanceCase.required_weekly_hours / required_core_weekly_hours / required_monthly_hours / required_core_monthly_hours via required_hours_by_family_type"
      - from: DETERMINED
        to: DENIED
        trigger: "POST /applications/{id}/deny"
        actor: EligibilitySupervisor
        preconditions:
          - "Application.status == DETERMINED"
          - "X-User-ID != Application.determined_by_user_id"
        side_effects:
          - "Application.denial_reason := request denial_reason"
          - "Application.decided_by_user_id := X-User-ID"
      - from: DETERMINED
        to: DIVERSION_OFFERED
        trigger: "POST /applications/{id}/diversion-grants"
        actor: EligibilitySupervisor
        preconditions:
          - "Application.status == DETERMINED"
          - "Application.requested_program == DIVERSION_CONSIDERED"
          - "Application.determined_benefit_cents > 0"
        side_effects:
          - "create DiversionGrant in OFFERED with monthly_benefit_basis_cents := Application.determined_benefit_cents"
          - "recompute DiversionGrant.lump_sum_cents / ineligibility_months / ineligibility_end_month via diversion_lump_sum"
      - from: DIVERSION_OFFERED
        to: DIVERTED
        trigger: "POST /diversion-grants/{id}/accept"
        actor: Applicant
        preconditions:
          - "DiversionGrant.status == OFFERED"
          - "X-User-ID == Application.household_id"
        side_effects:
          - "DiversionGrant.status := ACCEPTED"
          - "recompute Household.diversion_ineligible_through_month := DiversionGrant.ineligibility_end_month"
      - from: DIVERSION_OFFERED
        to: DETERMINED
        trigger: "POST /diversion-grants/{id}/decline"
        actor: Applicant
        note: "cycle back to DETERMINED so ongoing assistance can still be approved"
        preconditions:
          - "DiversionGrant.status == OFFERED"
          - "X-User-ID == Application.household_id"
        side_effects:
          - "DiversionGrant.status := DECLINED"
          - "DiversionGrant.decline_reason := request decline_reason"
      - from: RECEIVED
        to: WITHDRAWN
        trigger: "POST /applications/{id}/withdraw"
        actor: Applicant | Caseworker
        preconditions: ["Application.status IN {RECEIVED, DETERMINED, DIVERSION_OFFERED}"]
        side_effects: ["Application.withdrawal_reason := request withdrawal_reason"]
      - from: DETERMINED
        to: WITHDRAWN
        trigger: "POST /applications/{id}/withdraw"
        actor: Applicant | Caseworker
        preconditions: ["Application.status IN {RECEIVED, DETERMINED, DIVERSION_OFFERED}"]
        side_effects: ["Application.withdrawal_reason := request withdrawal_reason"]
      - from: DIVERSION_OFFERED
        to: WITHDRAWN
        trigger: "POST /applications/{id}/withdraw"
        actor: Applicant | Caseworker
        preconditions: ["Application.status IN {RECEIVED, DETERMINED, DIVERSION_OFFERED}"]
        side_effects:
          - "Application.withdrawal_reason := request withdrawal_reason"
          - "every DiversionGrant of this application with status OFFERED := DECLINED"

  - entity: AssistanceCase
    dimension: benefit_status
    initial_state: PENDING_ISSUANCE
    terminal_states: [CLOSED]
    shape: parallel_dimension_a
    note: "benefit_status evolves independently of compliance_status on the same row"
    transitions:
      - from: PENDING_ISSUANCE
        to: ACTIVE
        trigger: "POST /cases/{id}/issuances"
        actor: Caseworker
        preconditions:
          - "AssistanceCase.benefit_status IN {PENDING_ISSUANCE, ACTIVE}"
          - "no TimeLimitMonth exists for (case_id, benefit_month)"
        side_effects:
          - "create TimeLimitMonth with assistance_issued true"
          - "recompute TimeLimitMonth.state_clock_countable / federal_clock_countable / non_countable_reason via time_limit_clock"
          - "recompute Household.state_clock_months_used / federal_clock_months_used / extension_months_used / issued_countable_months"
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /cases/{id}/issuances"
        actor: Caseworker
        preconditions:
          - "AssistanceCase.benefit_status IN {PENDING_ISSUANCE, ACTIVE}"
          - "no TimeLimitMonth exists for (case_id, benefit_month)"
        side_effects:
          - "create TimeLimitMonth with assistance_issued true"
          - "recompute TimeLimitMonth countability and Household clock fields via time_limit_clock"
      - from: ACTIVE
        to: CLOSED
        trigger: "system, evaluated at the end of POST /cases/{id}/issuances"
        actor: system
        preconditions:
          - "after the issuance, Household.state_clock_months_used >= STATE_TIME_LIMIT_MONTHS"
          - "no GRANTED TimeLimitExtension on this case covers the issued benefit_month"
        side_effects:
          - "AssistanceCase.closure_reason := TIME_LIMIT"
          - "every WorkAssignment of the case with status IN {PROPOSED, ACTIVE} := TERMINATED with termination_reason CASE_CLOSED"
          - "every Overpayment of the case with recoupment_status ACTIVE := PAUSED"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system, evaluated inside POST /compliance-episodes/{id}/impose-sanction"
        actor: system
        preconditions: ["the sanction just imposed set AssistanceCase.sanction_level == 2"]
        side_effects:
          - "every Overpayment of the case with recoupment_status ACTIVE := PAUSED"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "system, evaluated inside POST /compliance-episodes/{id}/resolve-compliant or /grant-good-cause"
        actor: system
        preconditions: ["after the resolution AssistanceCase.sanction_level == 0"]
        side_effects:
          - "every Overpayment of the case with recoupment_status PAUSED := ACTIVE"
      - from: ACTIVE
        to: CLOSED
        trigger: "system, evaluated inside POST /compliance-episodes/{id}/impose-sanction"
        actor: system
        preconditions: ["the sanction just imposed set AssistanceCase.sanction_level == 3"]
        side_effects:
          - "AssistanceCase.closure_reason := FULL_FAMILY_SANCTION"
          - "AssistanceCase.benefit_amount_cents := 0"
          - "every WorkAssignment of the case with status IN {PROPOSED, ACTIVE} := TERMINATED with termination_reason CASE_CLOSED"
          - "every Overpayment of the case with recoupment_status ACTIVE := PAUSED"
      - from: SUSPENDED
        to: CLOSED
        trigger: "system, evaluated inside POST /compliance-episodes/{id}/impose-sanction"
        actor: system
        preconditions: ["the sanction just imposed set AssistanceCase.sanction_level == 3"]
        side_effects:
          - "AssistanceCase.closure_reason := FULL_FAMILY_SANCTION"
          - "AssistanceCase.benefit_amount_cents := 0"
          - "every WorkAssignment of the case with status IN {PROPOSED, ACTIVE} := TERMINATED with termination_reason CASE_CLOSED"

  - entity: AssistanceCase
    dimension: compliance_status
    initial_state: ASSIGNED
    terminal_states: []
    shape: parallel_dimension_b
    note: "initial value is NOT_REQUIRED for CHILD_ONLY cases and ASSIGNED otherwise"
    transitions:
      - from: ASSIGNED
        to: CONCILIATION_PENDING
        trigger: "POST /compliance-episodes  OR  system cascade inside POST /participation-reports/{id}/verify"
        actor: WorkProgramSpecialist | system
        preconditions: ["AssistanceCase.compliance_status IN {ASSIGNED, EXEMPT, CURE_PENDING}"]
        side_effects: ["a ComplianceEpisode in ALLEGED now exists for the case"]
      - from: EXEMPT
        to: CONCILIATION_PENDING
        trigger: "POST /compliance-episodes"
        actor: WorkProgramSpecialist
        preconditions: ["AssistanceCase.compliance_status IN {ASSIGNED, EXEMPT, CURE_PENDING}"]
        side_effects: ["a ComplianceEpisode in ALLEGED now exists for the case"]
      - from: CURE_PENDING
        to: CONCILIATION_PENDING
        trigger: "POST /compliance-episodes with prior_episode_id"
        actor: WorkProgramSpecialist
        note: "cross-episode escalation loop"
        preconditions: ["AssistanceCase.compliance_status IN {ASSIGNED, EXEMPT, CURE_PENDING}"]
        side_effects: ["a ComplianceEpisode in ALLEGED now exists for the case"]
      - from: CONCILIATION_PENDING
        to: SANCTIONED
        trigger: "POST /compliance-episodes/{id}/impose-sanction"
        actor: EligibilitySupervisor
        preconditions: ["the episode transitioned CONCILIATION -> SANCTION_IMPOSED"]
        side_effects: ["recompute AssistanceCase.sanction_level / sanction_pct / benefit_amount_cents"]
      - from: CONCILIATION_PENDING
        to: ASSIGNED
        trigger: "POST /compliance-episodes/{id}/resolve-compliant"
        actor: WorkProgramSpecialist
        preconditions: ["the episode transitioned CONCILIATION -> RESOLVED_COMPLIANT"]
        side_effects:
          - "every SupportiveServiceAuthorization of the case with status HELD stays HELD until released"
      - from: CONCILIATION_PENDING
        to: EXEMPT
        trigger: "POST /compliance-episodes/{id}/grant-good-cause"
        actor: EligibilitySupervisor
        preconditions: ["the episode transitioned CONCILIATION -> GOOD_CAUSE_GRANTED"]
        side_effects: ["recompute AssistanceCase.sanction_level / sanction_pct / benefit_amount_cents"]
      - from: SANCTIONED
        to: CURE_PENDING
        trigger: "POST /compliance-episodes/{id}/begin-cure"
        actor: WorkProgramSpecialist
        preconditions: ["the episode transitioned SANCTION_IMPOSED -> CURE_PENDING"]
        side_effects: ["ComplianceEpisode.cure_plan_note recorded"]
      - from: CURE_PENDING
        to: ASSIGNED
        trigger: "POST /compliance-episodes/{id}/resolve-compliant"
        actor: WorkProgramSpecialist
        preconditions: ["the episode transitioned CURE_PENDING -> RESOLVED_COMPLIANT"]
        side_effects: ["recompute AssistanceCase.sanction_level / sanction_pct / benefit_amount_cents"]
      - from: CURE_PENDING
        to: SANCTIONED
        trigger: "POST /compliance-episodes/{id}/impose-sanction"
        actor: EligibilitySupervisor
        note: "same-episode escalation when the cure fails"
        preconditions: ["the episode transitioned CURE_PENDING -> SANCTION_IMPOSED"]
        side_effects: ["recompute AssistanceCase.sanction_level / sanction_pct / benefit_amount_cents"]

  - entity: ComplianceEpisode
    initial_state: ALLEGED
    terminal_states: [RESOLVED_COMPLIANT, GOOD_CAUSE_GRANTED]
    shape: cyclic
    transitions:
      - from: ALLEGED
        to: CONCILIATION
        trigger: "POST /compliance-episodes/{id}/start-conciliation"
        actor: WorkProgramSpecialist
        preconditions: ["ComplianceEpisode.status == ALLEGED"]
        side_effects:
          - "ComplianceEpisode.conciliation_start_date := logical clock date (UTC date part)"
          - "ComplianceEpisode.conciliation_deadline_date := conciliation_start_date + CONCILIATION_DAYS days"
      - from: CONCILIATION
        to: RESOLVED_COMPLIANT
        trigger: "POST /compliance-episodes/{id}/resolve-compliant"
        actor: WorkProgramSpecialist
        preconditions: ["ComplianceEpisode.status IN {CONCILIATION, CURE_PENDING}"]
        side_effects:
          - "ComplianceEpisode.sanction_level := 0; sanction_pct := 0.00"
          - "AssistanceCase.compliance_status := ASSIGNED"
          - "recompute AssistanceCase.sanction_level / sanction_pct via case_sanction_rollup"
          - "recompute AssistanceCase.benefit_amount_cents via benefit_amount_calculation"
      - from: CONCILIATION
        to: GOOD_CAUSE_GRANTED
        trigger: "POST /compliance-episodes/{id}/grant-good-cause"
        actor: EligibilitySupervisor
        preconditions: ["ComplianceEpisode.status == CONCILIATION"]
        side_effects:
          - "ComplianceEpisode.good_cause_reason := request good_cause_reason"
          - "ComplianceEpisode.sanction_level := 0; sanction_pct := 0.00"
          - "AssistanceCase.compliance_status := EXEMPT"
          - "recompute AssistanceCase.sanction_level / sanction_pct / benefit_amount_cents"
      - from: CONCILIATION
        to: SANCTION_IMPOSED
        trigger: "POST /compliance-episodes/{id}/impose-sanction"
        actor: EligibilitySupervisor
        preconditions:
          - "ComplianceEpisode.status IN {CONCILIATION, CURE_PENDING}"
          - "ComplianceEpisode.good_cause_reason == NONE"
          - "logical clock date >= ComplianceEpisode.conciliation_deadline_date"
        side_effects:
          - "CASCADE B step 1: ComplianceEpisode.sanction_level := (prior_episode_id is null ? 1 : ComplianceEpisode.prior_episode_id -> sanction_level + 1), capped at 3; sanction_pct := SANCTION_PCT_BY_LEVEL[sanction_level]; sanction_imposed_month := logical clock month"
          - "CASCADE B step 2 (caused by step 1): AssistanceCase.sanction_level / sanction_pct recomputed via case_sanction_rollup and AssistanceCase.benefit_amount_cents recomputed via benefit_amount_calculation"
          - "CASCADE B step 3 (caused by step 2): AssistanceCase.benefit_status ACTIVE -> SUSPENDED when the new AssistanceCase.sanction_level == 2, or ACTIVE|SUSPENDED -> CLOSED with closure_reason FULL_FAMILY_SANCTION when it == 3"
          - "CASCADE B step 4 (caused by step 3): every Overpayment of the case with recoupment_status ACTIVE := PAUSED"
          - "AssistanceCase.compliance_status := SANCTIONED"
      - from: CURE_PENDING
        to: SANCTION_IMPOSED
        trigger: "POST /compliance-episodes/{id}/impose-sanction"
        actor: EligibilitySupervisor
        note: "cycle: SANCTION_IMPOSED -> CURE_PENDING -> SANCTION_IMPOSED with level escalation"
        preconditions:
          - "ComplianceEpisode.status IN {CONCILIATION, CURE_PENDING}"
          - "ComplianceEpisode.good_cause_reason == NONE"
          - "logical clock date >= ComplianceEpisode.conciliation_deadline_date"
        side_effects:
          - "ComplianceEpisode.sanction_level := min(3, ComplianceEpisode.sanction_level + 1); sanction_pct := SANCTION_PCT_BY_LEVEL[sanction_level]"
          - "AssistanceCase.sanction_level / sanction_pct / benefit_amount_cents recomputed (CASCADE B steps 2-4 apply identically)"
          - "AssistanceCase.compliance_status := SANCTIONED"
      - from: SANCTION_IMPOSED
        to: CURE_PENDING
        trigger: "POST /compliance-episodes/{id}/begin-cure"
        actor: WorkProgramSpecialist
        preconditions: ["ComplianceEpisode.status == SANCTION_IMPOSED"]
        side_effects:
          - "ComplianceEpisode.cure_plan_note := request cure_plan_note"
          - "AssistanceCase.compliance_status := CURE_PENDING"
      - from: CURE_PENDING
        to: RESOLVED_COMPLIANT
        trigger: "POST /compliance-episodes/{id}/resolve-compliant"
        actor: WorkProgramSpecialist
        preconditions: ["ComplianceEpisode.status IN {CONCILIATION, CURE_PENDING}"]
        side_effects:
          - "ComplianceEpisode.sanction_level := 0; sanction_pct := 0.00"
          - "AssistanceCase.compliance_status := ASSIGNED"
          - "recompute AssistanceCase.sanction_level / sanction_pct / benefit_amount_cents"
          - "AssistanceCase.benefit_status SUSPENDED -> ACTIVE when the recomputed AssistanceCase.sanction_level == 0"
          - "every Overpayment of the case with recoupment_status PAUSED := ACTIVE once the case is ACTIVE again"

  - entity: TimeLimitExtension
    initial_state: REQUESTED
    terminal_states: [DENIED, REVOKED]
    shape: branching_with_revert
    transitions:
      - from: REQUESTED
        to: GRANTED
        trigger: "POST /extensions/{id}/grant"
        actor: EligibilitySupervisor
        preconditions:
          - "TimeLimitExtension.status == REQUESTED"
          - "AssistanceCase.benefit_status IN {ACTIVE, SUSPENDED}"
          - "1 <= months_granted <= months_requested"
          - "Household.extension_months_used + months_granted <= MAX_HARDSHIP_EXTENSION_MONTHS"
        side_effects:
          - "TimeLimitExtension.months_granted := request months_granted; last_effective_month := first_effective_month + months_granted - 1; decided_by_user_id := X-User-ID"
          - "CASCADE C step 1: every TimeLimitMonth of the case whose benefit_month falls in [first_effective_month, last_effective_month] gets state_clock_countable false and non_countable_reason GRANTED_EXTENSION (federal_clock_countable unchanged)"
          - "CASCADE C step 2 (caused by step 1): Household.state_clock_months_used / extension_months_used recomputed via time_limit_clock"
      - from: REQUESTED
        to: DENIED
        trigger: "POST /extensions/{id}/deny"
        actor: EligibilitySupervisor
        preconditions: ["TimeLimitExtension.status == REQUESTED"]
        side_effects: ["TimeLimitExtension.denial_reason := request denial_reason; decided_by_user_id := X-User-ID"]
      - from: GRANTED
        to: REVOKED
        trigger: "POST /extensions/{id}/revoke"
        actor: EligibilitySupervisor
        note: "compensating action for the grant; the conserved month quantity must not drift"
        preconditions: ["TimeLimitExtension.status == GRANTED"]
        side_effects:
          - "TimeLimitExtension.revocation_reason := request revocation_reason; months_granted := 0; last_effective_month := null"
          - "every TimeLimitMonth previously excluded by this extension is restored to state_clock_countable true with non_countable_reason NONE unless another GRANTED extension still covers it"
          - "Household.state_clock_months_used / extension_months_used recomputed via time_limit_clock"
          - "AssistanceCase.benefit_status ACTIVE -> CLOSED with closure_reason TIME_LIMIT when the recomputed Household.state_clock_months_used >= STATE_TIME_LIMIT_MONTHS"

  - entity: WorkAssignment
    initial_state: PROPOSED
    terminal_states: [COMPLETED, TERMINATED]
    shape: branching_fork_join
    transitions:
      - from: PROPOSED
        to: ACTIVE
        trigger: "POST /work-assignments/{id}/activate"
        actor: WorkProgramSpecialist
        preconditions:
          - "WorkAssignment.status == PROPOSED"
          - "AssistanceCase.benefit_status == ACTIVE"
          - "AssistanceCase.compliance_status IN {ASSIGNED, CONCILIATION_PENDING, CURE_PENDING}"
          - "aggregate scheduled_weekly_hours over overlapping assignments <= MAX_SCHEDULED_WEEKLY_HOURS per work_assignment_hour_capacity"
        side_effects: ["WorkAssignment.status := ACTIVE"]
      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /work-assignments/{id}/terminate with termination_reason COMPLETED_ACTIVITY"
        actor: WorkProgramSpecialist
        note: "fork branch 1 - benign closure, supportive authorizations survive"
        preconditions: ["WorkAssignment.status IN {PROPOSED, ACTIVE}"]
        side_effects:
          - "WorkAssignment.termination_reason := COMPLETED_ACTIVITY"
          - "WorkAssignment.cumulative_verified_hours frozen at its current value"
          - "SupportiveServiceAuthorization rows of this assignment are left untouched"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /work-assignments/{id}/terminate with termination_reason IN {NONCOMPLIANCE, CASE_CLOSED, PLAN_CHANGE}"
        actor: WorkProgramSpecialist | system
        note: "fork branch 2 - adverse closure, supportive authorizations are voided and caps restored"
        preconditions: ["WorkAssignment.status IN {PROPOSED, ACTIVE}"]
        side_effects:
          - "WorkAssignment.termination_reason := request termination_reason"
          - "every SupportiveServiceAuthorization of this assignment with status IN {REQUESTED, HELD, AUTHORIZED} := VOIDED with void_reason ASSIGNMENT_TERMINATED and authorized_amount_cents := 0"
          - "recompute AssistanceCase.supportive_fy_authorized_cents via supportive_service_waterfall cap ledger"
      - from: PROPOSED
        to: TERMINATED
        trigger: "POST /work-assignments/{id}/terminate with termination_reason IN {NONCOMPLIANCE, CASE_CLOSED, PLAN_CHANGE}"
        actor: WorkProgramSpecialist | system
        preconditions: ["WorkAssignment.status IN {PROPOSED, ACTIVE}"]
        side_effects:
          - "WorkAssignment.termination_reason := request termination_reason"
          - "every SupportiveServiceAuthorization of this assignment with status IN {REQUESTED, HELD, AUTHORIZED} := VOIDED with authorized_amount_cents := 0"
          - "recompute AssistanceCase.supportive_fy_authorized_cents"
      - from: PROPOSED
        to: COMPLETED
        trigger: "POST /work-assignments/{id}/terminate with termination_reason COMPLETED_ACTIVITY"
        actor: WorkProgramSpecialist
        preconditions: ["WorkAssignment.status IN {PROPOSED, ACTIVE}"]
        side_effects: ["WorkAssignment.termination_reason := COMPLETED_ACTIVITY"]

  - entity: ParticipationReport
    initial_state: SUBMITTED
    terminal_states: [VERIFIED, REJECTED]
    shape: branching
    transitions:
      - from: SUBMITTED
        to: VERIFIED
        trigger: "POST /participation-reports/{id}/verify"
        actor: WorkProgramSpecialist
        preconditions:
          - "ParticipationReport.status == SUBMITTED"
          - "WorkAssignment.status IN {ACTIVE, COMPLETED}"
          - "0 <= verified_hours <= ParticipationReport.reported_hours"
        side_effects:
          - "CASCADE A step 1: ParticipationReport.status := VERIFIED and verified_hours / core_hours_credited / non_core_hours_credited computed via participation_credit"
          - "CASCADE A step 2 (caused by step 1): WorkAssignment.cumulative_verified_hours recomputed, and WorkAssignment.compliance_flag := SHORTFALL when the case-month participation predicate is false, else NONE"
          - "CASCADE A step 3 (caused by step 2): when WorkAssignment.compliance_flag became SHORTFALL and AssistanceCase.compliance_status == ASSIGNED, create a ComplianceEpisode in ALLEGED with allegation_reason HOURS_SHORTFALL and origin SYSTEM_SHORTFALL, and set AssistanceCase.compliance_status := CONCILIATION_PENDING"
          - "CASCADE A step 4 (caused by step 3): every SupportiveServiceAuthorization of the case with status REQUESTED := HELD"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /participation-reports/{id}/reject"
        actor: WorkProgramSpecialist
        preconditions: ["ParticipationReport.status == SUBMITTED"]
        side_effects:
          - "ParticipationReport.rejection_reason := request rejection_reason"
          - "ParticipationReport.verified_hours := 0; core_hours_credited := 0; non_core_hours_credited := 0"

  - entity: SupportiveServiceAuthorization
    initial_state: REQUESTED
    terminal_states: [VOIDED]
    shape: cyclic
    transitions:
      - from: REQUESTED
        to: HELD
        trigger: "system cascade inside POST /participation-reports/{id}/verify (CASCADE A step 4)"
        actor: system
        preconditions: ["SupportiveServiceAuthorization.status == REQUESTED", "AssistanceCase.compliance_status became CONCILIATION_PENDING"]
        side_effects: ["SupportiveServiceAuthorization.status := HELD"]
      - from: HELD
        to: REQUESTED
        trigger: "POST /supportive-service-authorizations/{id}/release-hold"
        actor: WorkProgramSpecialist
        note: "cycle REQUESTED -> HELD -> REQUESTED"
        preconditions:
          - "SupportiveServiceAuthorization.status == HELD"
          - "AssistanceCase.compliance_status IN {ASSIGNED, EXEMPT, NOT_REQUIRED}"
        side_effects: ["SupportiveServiceAuthorization.status := REQUESTED"]
      - from: REQUESTED
        to: AUTHORIZED
        trigger: "POST /supportive-service-authorizations/{id}/authorize"
        actor: WorkProgramSpecialist
        preconditions:
          - "SupportiveServiceAuthorization.status == REQUESTED"
          - "WorkAssignment.status == ACTIVE"
          - "supportive_service_waterfall yields authorized_amount_cents > 0"
        side_effects:
          - "recompute SupportiveServiceAuthorization.authorized_amount_cents via supportive_service_waterfall"
          - "recompute AssistanceCase.supportive_fy_authorized_cents"
      - from: AUTHORIZED
        to: VOIDED
        trigger: "POST /supportive-service-authorizations/{id}/void"
        actor: WorkProgramSpecialist | FiscalOfficer
        note: "compensating action for authorize; the fiscal-year cap ledger must not drift"
        preconditions: ["SupportiveServiceAuthorization.status IN {REQUESTED, HELD, AUTHORIZED}"]
        side_effects:
          - "SupportiveServiceAuthorization.void_reason := request void_reason"
          - "SupportiveServiceAuthorization.authorized_amount_cents := 0"
          - "recompute AssistanceCase.supportive_fy_authorized_cents, restoring the freed cap headroom exactly"
      - from: REQUESTED
        to: VOIDED
        trigger: "POST /supportive-service-authorizations/{id}/void"
        actor: WorkProgramSpecialist | FiscalOfficer
        preconditions: ["SupportiveServiceAuthorization.status IN {REQUESTED, HELD, AUTHORIZED}"]
        side_effects: ["SupportiveServiceAuthorization.void_reason := request void_reason"]
      - from: HELD
        to: VOIDED
        trigger: "POST /supportive-service-authorizations/{id}/void"
        actor: WorkProgramSpecialist | FiscalOfficer
        preconditions: ["SupportiveServiceAuthorization.status IN {REQUESTED, HELD, AUTHORIZED}"]
        side_effects: ["SupportiveServiceAuthorization.void_reason := request void_reason"]

  - entity: Overpayment
    dimension: status
    initial_state: DRAFT
    terminal_states: [WRITTEN_OFF]
    shape: cyclic
    transitions:
      - from: DRAFT
        to: ESTABLISHED
        trigger: "POST /overpayments/{id}/establish"
        actor: FiscalOfficer | FraudInvestigator
        preconditions:
          - "Overpayment.status == DRAFT"
          - "every month in months_covered has a TimeLimitMonth with assistance_issued true on the case"
        side_effects:
          - "recompute Overpayment.established_amount_cents / monthly_recoupment_cents / balance_cents via overpayment_establishment"
          - "Overpayment.established_by_user_id := X-User-ID"
          - "Overpayment.recoupment_status := NOT_STARTED"
      - from: ESTABLISHED
        to: IN_RECOVERY
        trigger: "POST /overpayments/{id}/recovery-transactions"
        actor: FiscalOfficer
        preconditions:
          - "Overpayment.status IN {ESTABLISHED, IN_RECOVERY, SATISFIED}"
          - "expected_overpayment_version == Overpayment.version"
          - "for method BENEFIT_RECOUPMENT: AssistanceCase.benefit_status == ACTIVE"
          - "for non-reversal methods: amount_cents <= Overpayment.balance_cents"
          - "for RECOUPMENT_REVERSAL: amount_cents <= Overpayment.total_recovered_cents"
        side_effects:
          - "create RecoveryTransaction with signed_amount_cents computed"
          - "recompute Overpayment.total_recovered_cents and balance_cents"
          - "Overpayment.recoupment_status := ACTIVE"
          - "increments Overpayment.version by 1"
      - from: IN_RECOVERY
        to: IN_RECOVERY
        trigger: "POST /overpayments/{id}/recovery-transactions"
        actor: FiscalOfficer
        preconditions: ["Overpayment.status IN {ESTABLISHED, IN_RECOVERY, SATISFIED}", "expected_overpayment_version == Overpayment.version"]
        side_effects:
          - "create RecoveryTransaction; recompute total_recovered_cents and balance_cents"
          - "increments Overpayment.version by 1"
      - from: IN_RECOVERY
        to: SATISFIED
        trigger: "system, evaluated at the end of POST /overpayments/{id}/recovery-transactions"
        actor: system
        preconditions: ["Overpayment.balance_cents == 0 after the entry"]
        side_effects: ["Overpayment.recoupment_status := NOT_STARTED"]
      - from: SATISFIED
        to: IN_RECOVERY
        trigger: "POST /overpayments/{id}/recovery-transactions with method RECOUPMENT_REVERSAL"
        actor: FiscalOfficer
        note: "cycle IN_RECOVERY -> SATISFIED -> IN_RECOVERY"
        preconditions: ["Overpayment.status IN {ESTABLISHED, IN_RECOVERY, SATISFIED}", "Overpayment.balance_cents > 0 after the entry"]
        side_effects:
          - "recompute total_recovered_cents and balance_cents"
          - "Overpayment.recoupment_status := ACTIVE"
          - "increments Overpayment.version by 1"
      - from: ESTABLISHED
        to: WRITTEN_OFF
        trigger: "POST /overpayments/{id}/write-off"
        actor: FiscalOfficer
        preconditions:
          - "Overpayment.status IN {ESTABLISHED, IN_RECOVERY}"
          - "X-User-ID != Overpayment.established_by_user_id"
        side_effects: ["Overpayment.write_off_reason := request write_off_reason", "Overpayment.recoupment_status := NOT_STARTED"]
      - from: IN_RECOVERY
        to: WRITTEN_OFF
        trigger: "POST /overpayments/{id}/write-off"
        actor: FiscalOfficer
        preconditions:
          - "Overpayment.status IN {ESTABLISHED, IN_RECOVERY}"
          - "X-User-ID != Overpayment.established_by_user_id"
        side_effects: ["Overpayment.write_off_reason := request write_off_reason", "Overpayment.recoupment_status := NOT_STARTED"]

  - entity: Overpayment
    dimension: fraud_referral_status
    initial_state: NOT_REFERRED
    terminal_states: [SUBSTANTIATED, UNSUBSTANTIATED]
    shape: parallel_dimension
    transitions:
      - from: NOT_REFERRED
        to: REFERRED
        trigger: "POST /overpayments/{id}/fraud-referral"
        actor: FraudInvestigator
        preconditions:
          - "Overpayment.fraud_referral_status == NOT_REFERRED"
          - "Overpayment.status IN {ESTABLISHED, IN_RECOVERY, SATISFIED}"
        side_effects: ["Overpayment.referral_note := request referral_note"]
      - from: REFERRED
        to: SUBSTANTIATED
        trigger: "POST /overpayments/{id}/fraud-disposition with disposition SUBSTANTIATED"
        actor: FraudInvestigator
        preconditions: ["Overpayment.fraud_referral_status == REFERRED"]
        side_effects:
          - "recompute Overpayment.monthly_recoupment_cents via overpayment_establishment using FRAUD_SUBSTANTIATED_RECOUPMENT_PCT"
      - from: REFERRED
        to: UNSUBSTANTIATED
        trigger: "POST /overpayments/{id}/fraud-disposition with disposition UNSUBSTANTIATED"
        actor: FraudInvestigator
        preconditions: ["Overpayment.fraud_referral_status == REFERRED"]
        side_effects: ["Overpayment.monthly_recoupment_cents unchanged"]

  - entity: FederalReportingPeriod
    initial_state: OPEN
    terminal_states: [CERTIFIED]
    shape: linear_with_self_loop
    transitions:
      - from: OPEN
        to: CALCULATED
        trigger: "POST /reporting-periods/{id}/calculate"
        actor: StateReportingAnalyst
        preconditions: ["FederalReportingPeriod.status IN {OPEN, CALCULATED}"]
        side_effects:
          - "recompute current_caseload / wpr_all_families_pct / wpr_two_parent_pct / caseload_reduction_credit_pct / adjusted_target_all_families_pct / target_met via work_participation_rate"
          - "FederalReportingPeriod.calculated_by_user_id := X-User-ID"
      - from: CALCULATED
        to: CALCULATED
        trigger: "POST /reporting-periods/{id}/calculate"
        actor: StateReportingAnalyst
        preconditions: ["FederalReportingPeriod.status IN {OPEN, CALCULATED}"]
        side_effects: ["all computed rate fields recomputed from current data", "calculated_by_user_id := X-User-ID"]
      - from: CALCULATED
        to: CERTIFIED
        trigger: "POST /reporting-periods/{id}/certify"
        actor: StateReportingAnalyst
        preconditions:
          - "FederalReportingPeriod.status == CALCULATED"
          - "X-User-ID != FederalReportingPeriod.calculated_by_user_id"
          - "no ParticipationReport with status SUBMITTED has report_month inside the quarter"
        side_effects: ["FederalReportingPeriod.certified_by_user_id := X-User-ID"]

# =============================================================================
# 1.2.1 Concurrency Rules (OCC on the parent's version only)
# =============================================================================
concurrency_rules:
  - rule_id: supportive-auth-create-stale-case
    parent_entity: AssistanceCase
    write_endpoint: "POST /supportive-service-authorizations"
    occ_field: "expected_case_version"
    description: |
      Creating a SupportiveServiceAuthorization against an AssistanceCase whose
      version has advanced past the value the client last observed is rejected.
      This captures the case where the case's fiscal-year cap ledger or
      compliance posture has already moved (another authorization consumed
      headroom, or a cascade put the case into CONCILIATION_PENDING), so the
      requester's view of remaining cap is stale.
    error_id: ERR_STALE_CASE_VERSION
    http_status: 412
  - rule_id: compliance-episode-create-stale-case
    parent_entity: AssistanceCase
    write_endpoint: "POST /compliance-episodes"
    occ_field: "expected_case_version"
    description: |
      Creating a ComplianceEpisode against an AssistanceCase whose version has
      advanced since the client last read it is rejected. A newly created
      episode legitimately supersedes the prior compliance posture, so a stale
      view could escalate a sanction the case has already cured.
    error_id: ERR_STALE_CASE_VERSION
    http_status: 412
  - rule_id: recovery-txn-stale-overpayment
    parent_entity: Overpayment
    write_endpoint: "POST /overpayments/{id}/recovery-transactions"
    occ_field: "expected_overpayment_version"
    description: |
      Posting a RecoveryTransaction against an Overpayment whose version has
      advanced past the value the client last observed is rejected, because the
      balance the entry was sized against no longer holds.
    error_id: ERR_STALE_OVERPAYMENT_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation & Business Rule Table
# =============================================================================
calculations:
  - name: constants
    description: |
      All fixed program parameters. Every monetary value is an integer number of
      cents; every percentage that appears in a stored field is a decimal with
      exactly 2 places. round_half_up(x) means round to the nearest integer with
      ties going away from zero; round_half_up(x, 2) means the same to 2 decimal
      places. floor(x) truncates toward negative infinity. All month arithmetic
      is on YYYY-MM strings interpreted as calendar months.
    constants:
      PAYMENT_STANDARD_CENTS: { 1: 26000, 2: 39000, 3: 49000, 4: 59000, 5: 68000, 6: 76000 }
      ADDL_PERSON_CENTS: 7000
      RATABLE_REDUCTION_FACTOR: 0.85
      MAX_GRANT_CENTS: 90000
      MINIMUM_ISSUANCE_CENTS: 1000
      FLAT_EARNED_DISREGARD_CENTS: 12000
      EARNED_PCT_DISREGARD: 0.50
      CHILD_SUPPORT_PASSTHROUGH_CENTS: 5000
      RESOURCE_LIMIT_CENTS: 200000
      STATE_TIME_LIMIT_MONTHS: 24
      FEDERAL_TIME_LIMIT_MONTHS: 60
      MAX_HARDSHIP_EXTENSION_MONTHS: 12
      REQUIRED_WEEKLY_HOURS:
        CHILD_ONLY: 0
        SINGLE_PARENT_CHILD_UNDER_6: 20
        SINGLE_PARENT: 30
        TWO_PARENT_NO_SUBSIDIZED_CHILD_CARE: 35
        TWO_PARENT_WITH_SUBSIDIZED_CHILD_CARE: 55
      REQUIRED_CORE_WEEKLY_HOURS:
        CHILD_ONLY: 0
        SINGLE_PARENT_CHILD_UNDER_6: 20
        SINGLE_PARENT: 20
        TWO_PARENT_NO_SUBSIDIZED_CHILD_CARE: 30
        TWO_PARENT_WITH_SUBSIDIZED_CHILD_CARE: 50
      WEEKS_PER_REPORT_MONTH: 4
      SELF_REPORT_CREDIT_FACTOR: 0.50
      MAX_SCHEDULED_WEEKLY_HOURS: 60
      CORE_CATEGORIES:
        - UNSUBSIDIZED_EMPLOYMENT
        - SUBSIDIZED_EMPLOYMENT
        - WORK_EXPERIENCE
        - ON_THE_JOB_TRAINING
        - JOB_SEARCH_READINESS
        - COMMUNITY_SERVICE
        - VOCATIONAL_EDUCATION
      NON_CORE_CATEGORIES:
        - JOB_SKILLS_TRAINING_DIRECT
        - EDUCATION_RELATED_TO_EMPLOYMENT
        - SECONDARY_SCHOOL
      SANCTION_PCT_BY_LEVEL: { 0: 0.00, 1: 0.25, 2: 0.50, 3: 1.00 }
      CONCILIATION_DAYS: 30
      SUPPORTIVE_CAPS_CENTS: { TRANSPORTATION: 60000, CHILD_CARE: 240000, WORK_EXPENSE: 30000 }
      SUPPORTIVE_CASE_FY_CAP_CENTS: 300000
      DIVERSION_MULTIPLIER: 3
      DIVERSION_MAX_CENTS: 200000
      DIVERSION_MAX_INELIGIBILITY_MONTHS: 12
      RECOUPMENT_PCT_BY_CLAIM: { AGENCY_ERROR: 0.05, CLIENT_ERROR: 0.10, SUSPECTED_FRAUD: 0.20 }
      FRAUD_SUBSTANTIATED_RECOUPMENT_PCT: 0.25
      MIN_RECOUPMENT_CENTS: 1000
      WPR_STATUTORY_TARGET_ALL_PCT: 50.00
      WPR_STATUTORY_TARGET_TWO_PARENT_PCT: 90.00
      CRC_MAX_PCT: 50.00
      SANCTION_DISREGARD_MAX_MONTHS: 3

  - name: family_type_derivation
    entity: Household
    output_fields: [family_type]
    description: |
      Evaluated on every Household create. The branches are tested in this exact
      order and the first match wins:
        1. adult_count == 0                                  -> CHILD_ONLY
        2. adult_count >= 2 AND has_subsidized_child_care     -> TWO_PARENT_WITH_SUBSIDIZED_CHILD_CARE
        3. adult_count >= 2                                   -> TWO_PARENT_NO_SUBSIDIZED_CHILD_CARE
        4. youngest_child_age_months < 72                     -> SINGLE_PARENT_CHILD_UNDER_6
        5. otherwise                                          -> SINGLE_PARENT
      Boundary: youngest_child_age_months exactly 72 yields SINGLE_PARENT (the
      under-6 exemption uses a strict less-than).

  - name: payment_standard
    entity: Application
    output_fields: []
    description: |
      Helper used by benefit_amount_calculation.
        household_size <= 6 -> PAYMENT_STANDARD_CENTS[household_size]
        household_size >  6 -> PAYMENT_STANDARD_CENTS[6] + (household_size - 6) * ADDL_PERSON_CENTS

  - name: countable_income_determination
    entity: Application
    output_fields: [countable_income_cents]
    variant_selector: Application.budgeting_method
    description: |
      DUAL VARIANT. The two budgeting methods differ in BOTH which IncomeSource
      rows are included AND how each row's monthly figure is derived. They are
      not two constants in one formula; they are two distinct pipelines.

      Variant PROSPECTIVE:
        included rows  = IncomeSource rows of the application with
                         verification_status == VERIFIED AND is_recurring == true
        row_monthly(s) = s.gross_monthly_cents

      Variant RETROSPECTIVE:
        included rows  = IncomeSource rows of the application with
                         verification_status IN {VERIFIED, UNVERIFIED}
                         (REFUSED rows are excluded; is_recurring is ignored)
        row_monthly(s) = floor((s.month_1_cents + s.month_2_cents + s.month_3_cents) / 3)

      ROUNDING ORDER IS PINNED for RETROSPECTIVE: each source is averaged and
      floored FIRST, then the floored per-source figures are summed. Summing the
      three months across all sources and averaging once at the end is wrong and
      can differ by 1 cent.

      Then, identically for both variants:
        gross_earned          = sum of row_monthly(s) over included rows with source_type == EARNED
        gross_unearned        = sum of row_monthly(s) over included rows with source_type != EARNED
        child_support_total   = sum of row_monthly(s) over included rows with source_type == UNEARNED_CHILD_SUPPORT
        after_flat            = max(0, gross_earned - FLAT_EARNED_DISREGARD_CENTS)
        countable_earned      = round_half_up(after_flat * EARNED_PCT_DISREGARD)
        countable_unearned    = gross_unearned - min(child_support_total, CHILD_SUPPORT_PASSTHROUGH_CENTS)
        countable_income_cents = countable_earned + countable_unearned

  - name: countable_resource_determination
    entity: [ResourceItem, Application]
    output_fields: [ResourceItem.countable_value_cents, Application.countable_resources_cents]
    description: |
      Per ResourceItem:
        exclusion_type != NONE -> countable_value_cents = 0
        exclusion_type == NONE -> countable_value_cents = max(0, gross_value_cents - encumbrance_cents)
      Per Application:
        countable_resources_cents = sum of countable_value_cents over the
        application's ResourceItem rows (0 when there are none)
      Eligibility gate at approve:
        countable_resources_cents <= RESOURCE_LIMIT_CENTS passes; strictly
        greater fails with ERR_RESOURCE_LIMIT_EXCEEDED. Exactly
        RESOURCE_LIMIT_CENTS is eligible.

  - name: benefit_amount_calculation
    entity: [Application, AssistanceCase]
    output_fields: [Application.determined_benefit_cents, AssistanceCase.benefit_amount_cents]
    description: |
      COMBINATORIAL: five interacting operations (deficit floor, ratable
      reduction, maximum-grant cap, sanction reduction, minimum-issuance floor)
      whose evaluation order is pinned. Reordering the cap and the ratable
      reduction, or applying the sanction before the cap, produces different
      integers.

      Inputs: household_size, countable_income_cents, sanction_pct
      (0.00 at determination; AssistanceCase.sanction_pct thereafter).

      Step 1  std            = payment_standard(household_size)
      Step 2  deficit        = max(0, std - countable_income_cents)
      Step 3  pre_sanction   = round_half_up(deficit * RATABLE_REDUCTION_FACTOR)
      Step 4  capped         = min(pre_sanction, MAX_GRANT_CENTS)
      Step 5  sanction_cut   = round_half_up(capped * sanction_pct)
              after_sanction = capped - sanction_cut
      Step 6  benefit        = 0 when after_sanction < MINIMUM_ISSUANCE_CENTS,
                               else after_sanction

      Boundary: after_sanction exactly MINIMUM_ISSUANCE_CENTS is payable.
      At approve, benefit == 0 fails with ERR_INELIGIBLE_ZERO_BENEFIT.

  - name: case_sanction_rollup
    entity: AssistanceCase
    output_fields: [sanction_level, sanction_pct]
    description: |
      After any ComplianceEpisode transition:
        sanction_level = max(ComplianceEpisode.sanction_level) over the case's
                         episodes whose status == SANCTION_IMPOSED or CURE_PENDING,
                         or 0 when there are none
        sanction_pct   = SANCTION_PCT_BY_LEVEL[sanction_level]
      benefit_amount_cents is then recomputed via benefit_amount_calculation.

  - name: time_limit_clock
    entity: [TimeLimitMonth, Household]
    output_fields:
      - TimeLimitMonth.state_clock_countable
      - TimeLimitMonth.federal_clock_countable
      - TimeLimitMonth.non_countable_reason
      - Household.state_clock_months_used
      - Household.federal_clock_months_used
      - Household.extension_months_used
      - Household.issued_countable_months
    description: |
      DUAL VARIANT on the clock being ticked. The two clocks apply DIFFERENT
      exclusion sets to the same TimeLimitMonth rows, so they diverge.

      Variant STATE_CLOCK (24-month state limit):
        a month is countable when assistance_issued == true
        AND the case family_type != CHILD_ONLY
        AND no GRANTED TimeLimitExtension of the case covers benefit_month
            (i.e. first_effective_month <= benefit_month <= last_effective_month)
        exclusion reason recorded: CHILD_ONLY_CASE, else GRANTED_EXTENSION, else NONE

      Variant FEDERAL_CLOCK (60-month federal limit):
        a month is countable when assistance_issued == true
        AND the case family_type != CHILD_ONLY
        Hardship extension months are state-funded and therefore DO NOT stop the
        federal clock. This is the divergence: an extension-covered month is
        federal-countable but not state-countable.

      Rollups on Household (over every TimeLimitMonth of every case of the household):
        issued_countable_months  = count(assistance_issued AND family_type != CHILD_ONLY)
        extension_months_used    = count(those with non_countable_reason == GRANTED_EXTENSION)
        state_clock_months_used  = prior_state_clock_months + count(state_clock_countable)
        federal_clock_months_used = prior_federal_clock_months + count(federal_clock_countable)

      CONSERVED INVARIANT (must hold after every issuance, grant and revoke):
        (state_clock_months_used - prior_state_clock_months) + extension_months_used
          == issued_countable_months
          == (federal_clock_months_used - prior_federal_clock_months)

      Approve gate: state_clock_months_used >= STATE_TIME_LIMIT_MONTHS fails with
      ERR_TIME_LIMIT_EXHAUSTED unless a GRANTED extension covers the
      certification_start_month.

  - name: required_hours_by_family_type
    entity: AssistanceCase
    output_fields: [required_weekly_hours, required_core_weekly_hours, required_monthly_hours, required_core_monthly_hours]
    description: |
      required_weekly_hours       = REQUIRED_WEEKLY_HOURS[family_type]
      required_core_weekly_hours  = REQUIRED_CORE_WEEKLY_HOURS[family_type]
      required_monthly_hours      = required_weekly_hours * WEEKS_PER_REPORT_MONTH
      required_core_monthly_hours = required_core_weekly_hours * WEEKS_PER_REPORT_MONTH
      A CHILD_ONLY case has all four at 0 and compliance_status NOT_REQUIRED.

  - name: participation_credit
    entity: [ParticipationReport, WorkAssignment, AssistanceCase]
    output_fields:
      - ParticipationReport.verified_hours
      - ParticipationReport.core_hours_credited
      - ParticipationReport.non_core_hours_credited
      - WorkAssignment.cumulative_verified_hours
      - WorkAssignment.compliance_flag
    description: |
      Per-report crediting (at verify):
        raw            = request verified_hours (0 <= raw <= reported_hours)
        factor         = SELF_REPORT_CREDIT_FACTOR when verification_source == SELF_REPORT, else 1.00
        verified_hours = floor(raw * factor)
        WorkAssignment.is_core == true  -> core_hours_credited = verified_hours, non_core_hours_credited = 0
        WorkAssignment.is_core == false -> non_core_hours_credited = verified_hours, core_hours_credited = 0

      Assignment rollup:
        cumulative_verified_hours = sum of verified_hours over the assignment's
        VERIFIED ParticipationReport rows

      Case-month participation predicate (evaluated for the report's report_month
      over every VERIFIED ParticipationReport belonging to any WorkAssignment of
      the case, in this pinned order):
        month_core       = sum(core_hours_credited)
        month_non_core   = sum(non_core_hours_credited)
        countable_non_core = month_non_core when month_core >= required_core_monthly_hours, else 0
        participating    = (month_core >= required_core_monthly_hours)
                           AND ((month_core + countable_non_core) >= required_monthly_hours)
      Non-core hours are FORFEITED entirely, not partially, when the core
      threshold is missed. Both comparisons are inclusive (>=).
      WorkAssignment.compliance_flag := SHORTFALL when participating is false,
      else NONE. A false predicate drives CASCADE A step 3.

  - name: work_assignment_hour_capacity
    entity: WorkAssignment
    output_fields: []
    description: |
      Scheduling capacity check at create and at activate. Assignment date ranges
      are HALF-OPEN [start_date, end_date): two assignments overlap when
        a.start_date < b.end_date AND b.start_date < a.end_date
      so an assignment ending 2026-10-01 and one starting 2026-10-01 do NOT
      overlap. For the candidate assignment, over every WorkAssignment of the
      same case with status IN {PROPOSED, ACTIVE} that overlaps the candidate
      (excluding the candidate itself):
        aggregate = candidate.scheduled_weekly_hours + sum(other.scheduled_weekly_hours)
      aggregate > MAX_SCHEDULED_WEEKLY_HOURS fails with
      ERR_SCHEDULED_HOURS_CAPACITY_EXCEEDED. Exactly
      MAX_SCHEDULED_WEEKLY_HOURS is allowed.
      is_core = activity_category IN CORE_CATEGORIES.

  - name: supportive_service_waterfall
    entity: [SupportiveServiceAuthorization, AssistanceCase]
    output_fields: [SupportiveServiceAuthorization.fiscal_year, SupportiveServiceAuthorization.authorized_amount_cents, AssistanceCase.supportive_fy_authorized_cents]
    description: |
      Federal fiscal year from period_start (YYYY-MM-DD):
        fiscal_year = year + 1 when month >= 10, else year
        (2026-10-01 -> FY 2027; 2026-09-30 -> FY 2026)

      Service period intervals are CLOSED and INCLUSIVE [period_start, period_end]:
        two authorizations overlap when
          a.period_start <= b.period_end AND b.period_start <= a.period_end
        so periods sharing a single endpoint DO overlap. At create, the candidate
        must not overlap any SupportiveServiceAuthorization of the same case with
        the same service_type and status IN {REQUESTED, HELD, AUTHORIZED}, else
        ERR_SERVICE_PERIOD_OVERLAP.

      At authorize, the waterfall (pinned order):
        type_used      = sum(authorized_amount_cents) over the case's AUTHORIZED
                         authorizations with the same service_type and fiscal_year
        remaining_type = SUPPORTIVE_CAPS_CENTS[service_type] - type_used
        case_used      = sum(authorized_amount_cents) over the case's AUTHORIZED
                         authorizations with the same fiscal_year
        remaining_case = SUPPORTIVE_CASE_FY_CAP_CENTS - case_used
        authorized_amount_cents = min(requested_amount_cents, remaining_type, remaining_case)
      authorized_amount_cents == 0 fails with ERR_SUPPORTIVE_CAP_EXHAUSTED and no
      state change occurs. A partial authorization (0 < authorized < requested) is
      allowed and the row still becomes AUTHORIZED.

      AssistanceCase.supportive_fy_authorized_cents = sum(authorized_amount_cents)
      over the case's AUTHORIZED authorizations for the CURRENT fiscal year
      derived from the logical clock.

      CONSERVED INVARIANT per (case, service_type, fiscal_year):
        type_used + remaining_type == SUPPORTIVE_CAPS_CENTS[service_type]
      This must hold after authorize and after the compensating void.

  - name: diversion_lump_sum
    entity: [DiversionGrant, Household]
    output_fields: [lump_sum_cents, ineligibility_months, ineligibility_end_month, Household.diversion_ineligible_through_month]
    description: |
      basis = monthly_benefit_basis_cents (copied from Application.determined_benefit_cents; must be > 0, else ERR_DIVERSION_REQUIRES_BENEFIT)
        lump_sum_cents        = min(basis * DIVERSION_MULTIPLIER, DIVERSION_MAX_CENTS)
        ineligibility_months  = min(DIVERSION_MAX_INELIGIBILITY_MONTHS, ceil(lump_sum_cents / basis))
        ineligibility_end_month = Application.application_month advanced by (ineligibility_months - 1) calendar months
      On accept: Household.diversion_ineligible_through_month := ineligibility_end_month.
      A later determine whose application_month <= that value fails with
      ERR_DIVERSION_INELIGIBILITY_ACTIVE; the first month strictly after it passes.

  - name: overpayment_establishment
    entity: [Overpayment, RecoveryTransaction]
    output_fields: [established_amount_cents, monthly_recoupment_cents, total_recovered_cents, balance_cents, RecoveryTransaction.signed_amount_cents]
    variant_selector: Overpayment.computation_method
    description: |
      DUAL VARIANT on computation_method. The two variants consume different
      inputs, not just different constants.

      Variant GROSS:
        established_amount_cents = gross_amount_cents
        (offsetting_underpayment_cents is ignored entirely)

      Variant NET:
        established_amount_cents = max(0, gross_amount_cents - offsetting_underpayment_cents)

      Recoupment sizing (both variants):
        pct = FRAUD_SUBSTANTIATED_RECOUPMENT_PCT when fraud_referral_status == SUBSTANTIATED,
              else RECOUPMENT_PCT_BY_CLAIM[claim_type]
        monthly_recoupment_cents = max(MIN_RECOUPMENT_CENTS, round_half_up(AssistanceCase.benefit_amount_cents * pct))

      Ledger:
        signed_amount_cents = -amount_cents when method == RECOUPMENT_REVERSAL, else +amount_cents
        total_recovered_cents = sum(signed_amount_cents) over the overpayment's RecoveryTransaction rows
        balance_cents         = established_amount_cents - total_recovered_cents

      Guards: a non-reversal entry with amount_cents > balance_cents fails with
      ERR_RECOVERY_EXCEEDS_BALANCE; a RECOUPMENT_REVERSAL with
      amount_cents > total_recovered_cents fails with ERR_REVERSAL_EXCEEDS_RECOVERED.

      CONSERVED INVARIANT: established_amount_cents == balance_cents + total_recovered_cents
      after every entry and every reversal.

  - name: work_participation_rate
    entity: FederalReportingPeriod
    output_fields: [current_caseload, wpr_all_families_pct, wpr_two_parent_pct, caseload_reduction_credit_pct, adjusted_target_all_families_pct, target_met]
    description: |
      COMBINATORIAL: five stages, each consuming the previous stage's output,
      with two different denominators in play. Executing the stages in any other
      order (in particular deriving current_caseload from the sanction-adjusted
      denominator) yields different numbers.

      The quarter's three months are derived from fiscal_year and quarter:
        Q1 = Oct, Nov, Dec of (fiscal_year - 1); Q2 = Jan, Feb, Mar of fiscal_year;
        Q3 = Apr, May, Jun of fiscal_year; Q4 = Jul, Aug, Sep of fiscal_year.

      Stage 1 - raw monthly denominators.
        For each month m in the quarter, D_m = the set of AssistanceCase rows that
        have a TimeLimitMonth for m with assistance_issued == true and whose
        family_type != CHILD_ONLY.

      Stage 2 - sanction disregard, applied per case per fiscal year.
        A case-month is "sanctioned" when the case has a ComplianceEpisode with
        sanction_imposed_month <= m and status IN {SANCTION_IMPOSED, CURE_PENDING}.
        Walk each case's sanctioned months CHRONOLOGICALLY from the first month of
        the fiscal year (October) forward; the first
        SANCTION_DISREGARD_MAX_MONTHS such months are removed from their D_m; the
        4th and every later sanctioned month REMAINS in D_m. Result: adjusted
        denominators A_m.

      Stage 3 - numerator.
        N_m = the subset of A_m for which the participation_credit case-month
        predicate is true for month m.

      Stage 4 - rates.
        den_all = |A_Oct| + |A_Nov| + |A_Dec| (using the quarter's own three months)
        num_all = |N_Oct| + |N_Nov| + |N_Dec|
        wpr_all_families_pct = 0.00 when den_all == 0,
                               else round_half_up(100 * num_all / den_all, 2)
        Restricting A_m and N_m to cases whose family_type is
        TWO_PARENT_NO_SUBSIDIZED_CHILD_CARE or TWO_PARENT_WITH_SUBSIDIZED_CHILD_CARE
        gives den_two / num_two and
        wpr_two_parent_pct = 0.00 when den_two == 0,
                             else round_half_up(100 * num_two / den_two, 2)

      Stage 5 - caseload reduction credit.
        current_caseload = round_half_up((|D_Oct| + |D_Nov| + |D_Dec|) / 3, 2)
          NOTE: this uses the UNADJUSTED D_m from stage 1, never the adjusted A_m.
        raw_decline_pct = 0.00 when prior_year_caseload == 0,
                          else round_half_up(100 * (prior_year_caseload - current_caseload) / prior_year_caseload, 2)
        caseload_reduction_credit_pct = min(CRC_MAX_PCT, max(0.00, round_half_up(raw_decline_pct - eligibility_change_caseload_effect, 2)))
        adjusted_target_all_families_pct = max(0.00, WPR_STATUTORY_TARGET_ALL_PCT - caseload_reduction_credit_pct)
        target_met = wpr_all_families_pct >= adjusted_target_all_families_pct

      Empty-quarter behaviour: no issued months at all gives wpr_all 0.00,
      wpr_two_parent 0.00, current_caseload 0.00, raw_decline_pct 100.00 when
      prior_year_caseload > 0, and target_met is still evaluated with >=.

# =============================================================================
# 1.4 Validation Rule Table (global priority ladder; lowest number wins)
# =============================================================================
validations:
  - priority: 1
    category: auth
    rule: "X-User-ID header present and non-empty; X-User-Role header present and non-empty"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "every endpoint except POST /_clock/set_current_utc"
  - priority: 2
    category: authz
    rule: "X-User-Role is one of the roles declared for the endpoint in section 1.5"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "every endpoint except POST /_clock/set_current_utc"
  - priority: 3
    category: path_existence
    rule: |
      Every {id} path segment resolves to an existing row, checked left to right.
      Each resource has its own error: Household -> ERR_HOUSEHOLD_NOT_FOUND,
      Application -> ERR_APPLICATION_NOT_FOUND, IncomeSource -> ERR_INCOME_SOURCE_NOT_FOUND,
      AssistanceCase -> ERR_CASE_NOT_FOUND, TimeLimitExtension -> ERR_EXTENSION_NOT_FOUND,
      WorkAssignment -> ERR_WORK_ASSIGNMENT_NOT_FOUND,
      ParticipationReport -> ERR_PARTICIPATION_REPORT_NOT_FOUND,
      ComplianceEpisode -> ERR_COMPLIANCE_EPISODE_NOT_FOUND,
      SupportiveServiceAuthorization -> ERR_AUTHORIZATION_NOT_FOUND,
      Overpayment -> ERR_OVERPAYMENT_NOT_FOUND,
      DiversionGrant -> ERR_DIVERSION_GRANT_NOT_FOUND,
      FederalReportingPeriod -> ERR_REPORTING_PERIOD_NOT_FOUND.
    error_id: "ERR_<RESOURCE>_NOT_FOUND"
    http_status: 404
    applies_to: "every endpoint with a path parameter"
  - priority: 4
    category: body_fk_existence
    rule: |
      Every foreign key supplied in the request body resolves to an existing row,
      checked in the order the fields are declared in the endpoint's input list.
      Uses the same per-resource not-found error ids as priority 3.
    error_id: "ERR_<RESOURCE>_NOT_FOUND"
    http_status: 404
    applies_to: "POST /applications, POST /cases/{id}/... , POST /compliance-episodes, POST /supportive-service-authorizations, POST /overpayments"
  - priority: 5
    category: schema
    rule: |
      Request body parses as an object; all required fields present; no unknown
      field is honoured (unknown fields are ignored, not rejected); every field
      matches its declared type, enum domain, numeric bound, and string format
      (YYYY-MM for months, YYYY-MM-DD for dates, ISO-8601 for timestamps).
      Query parameters limit (1..100) and offset (>= 0) are validated here too.
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "every endpoint with a body or query parameters"
  - priority: 6
    category: ownership
    rule: |
      When X-User-Role is Applicant, X-User-ID must equal the Household.id that
      owns the target resource (directly for Household endpoints, transitively via
      Application.household_id for application and diversion endpoints).
    error_id: ERR_NOT_HOUSEHOLD_OWNER
    http_status: 403
    applies_to: "GET /households/{id}, GET /households/{id}/applications, POST /applications, GET /applications/{id}, POST /applications/{id}/withdraw, POST /diversion-grants/{id}/accept, POST /diversion-grants/{id}/decline"
  - priority: 7
    category: segregation_of_duties
    rule: |
      The acting X-User-ID must differ from the recorded actor of the paired
      earlier step: approve/deny require X-User-ID != Application.determined_by_user_id;
      write-off requires X-User-ID != Overpayment.established_by_user_id;
      certify requires X-User-ID != FederalReportingPeriod.calculated_by_user_id.
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /applications/{id}/approve, POST /applications/{id}/deny, POST /overpayments/{id}/write-off, POST /reporting-periods/{id}/certify"
  - priority: 10
    category: concurrency
    rule: |
      expected_case_version must equal the current AssistanceCase.version;
      expected_overpayment_version must equal the current Overpayment.version.
      Checked after authentication, authorization, existence and schema, and
      before any state or business rule.
    error_id: "ERR_STALE_CASE_VERSION | ERR_STALE_OVERPAYMENT_VERSION"
    http_status: 412
    applies_to: "POST /supportive-service-authorizations, POST /compliance-episodes, POST /overpayments/{id}/recovery-transactions"
  - priority: 20
    category: state
    rule: |
      The target entity is in a state from which the requested transition is
      declared in section 1.2. Per-entity errors: ERR_INVALID_APPLICATION_STATE,
      ERR_INVALID_CASE_STATE, ERR_INVALID_EXTENSION_STATE,
      ERR_INVALID_ASSIGNMENT_STATE, ERR_INVALID_REPORT_STATE,
      ERR_INVALID_EPISODE_STATE, ERR_INVALID_AUTHORIZATION_STATE,
      ERR_INVALID_OVERPAYMENT_STATE, ERR_INVALID_PERIOD_STATE,
      ERR_INVALID_DIVERSION_STATE.
    error_id: "ERR_INVALID_<ENTITY>_STATE"
    http_status: 409
    applies_to: "every transition endpoint"
  - priority: 25
    category: cross_entity_state
    rule: |
      The owning AssistanceCase must be in benefit_status ACTIVE for:
      work-assignment activate, participation-report create, and a
      RecoveryTransaction with method BENEFIT_RECOUPMENT.
    error_id: ERR_CASE_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /work-assignments/{id}/activate, POST /work-assignments/{id}/participation-reports, POST /overpayments/{id}/recovery-transactions"
  - priority: 26
    category: cross_entity_state
    rule: |
      Authorizing a SupportiveServiceAuthorization requires its WorkAssignment to
      be in status ACTIVE. The check exists only on authorize; creating an
      authorization against a PROPOSED assignment is permitted.
      Releasing a hold requires AssistanceCase.compliance_status IN
      {ASSIGNED, EXEMPT, NOT_REQUIRED}.
    error_id: ERR_ASSIGNMENT_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /supportive-service-authorizations/{id}/authorize, POST /supportive-service-authorizations/{id}/release-hold"
  - priority: 27
    category: cross_entity_state
    rule: |
      Certifying a FederalReportingPeriod requires that no ParticipationReport
      with status SUBMITTED has a report_month inside the period's quarter.
    error_id: ERR_UNVERIFIED_REPORTS_IN_QUARTER
    http_status: 409
    applies_to: "POST /reporting-periods/{id}/certify"
  - priority: 30
    category: business_safety
    rule: |
      Approving an application whose household has
      state_clock_months_used >= STATE_TIME_LIMIT_MONTHS is refused unless a
      GRANTED TimeLimitExtension covers the certification_start_month.
    error_id: ERR_TIME_LIMIT_EXHAUSTED
    http_status: 422
    applies_to: "POST /applications/{id}/approve"
  - priority: 32
    category: business_safety
    rule: |
      Imposing a sanction requires the episode's conciliation period to be over:
      the logical clock date must be >= ComplianceEpisode.conciliation_deadline_date.
    error_id: ERR_CONCILIATION_NOT_COMPLETE
    http_status: 422
    applies_to: "POST /compliance-episodes/{id}/impose-sanction"
  - priority: 34
    category: business_safety
    rule: |
      Imposing a sanction is refused when the episode already has a
      good_cause_reason other than NONE.
    error_id: ERR_GOOD_CAUSE_ACTIVE
    http_status: 422
    applies_to: "POST /compliance-episodes/{id}/impose-sanction"
  - priority: 36
    category: business_safety
    rule: |
      Granting an extension is refused when months_granted exceeds
      months_requested, or when Household.extension_months_used + months_granted
      would exceed MAX_HARDSHIP_EXTENSION_MONTHS.
    error_id: ERR_EXTENSION_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /extensions/{id}/grant"
  - priority: 40
    category: business_temporal
    rule: |
      Determining an application is refused when the household has an active
      diversion ineligibility window covering the application_month
      (application_month <= Household.diversion_ineligible_through_month).
    error_id: ERR_DIVERSION_INELIGIBILITY_ACTIVE
    http_status: 422
    applies_to: "POST /applications/{id}/determine"
  - priority: 42
    category: business_temporal
    rule: |
      A new SupportiveServiceAuthorization must not have a closed inclusive
      [period_start, period_end] interval overlapping any existing authorization
      of the same case with the same service_type and status IN
      {REQUESTED, HELD, AUTHORIZED}. period_end must be >= period_start.
    error_id: ERR_SERVICE_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /supportive-service-authorizations"
  - priority: 44
    category: business_temporal
    rule: |
      An issuance for a (case_id, benefit_month) pair that already has a
      TimeLimitMonth row is refused.
    error_id: ERR_DUPLICATE_ISSUANCE_MONTH
    http_status: 409
    applies_to: "POST /cases/{id}/issuances"
  - priority: 46
    category: business_temporal
    rule: |
      A ParticipationReport for a (work_assignment_id, report_month) pair that
      already exists with status IN {SUBMITTED, VERIFIED} is refused.
    error_id: ERR_DUPLICATE_REPORT_MONTH
    http_status: 409
    applies_to: "POST /work-assignments/{id}/participation-reports"
  - priority: 48
    category: business_temporal
    rule: |
      report_month must intersect the assignment's half-open
      [start_date, end_date) range: the first day of report_month must be
      < end_date and the last day of report_month must be >= start_date.
    error_id: ERR_REPORT_MONTH_OUTSIDE_ASSIGNMENT
    http_status: 422
    applies_to: "POST /work-assignments/{id}/participation-reports"
  - priority: 50
    category: business_constraint
    rule: |
      Aggregate scheduled_weekly_hours across the case's overlapping
      PROPOSED/ACTIVE assignments must not exceed MAX_SCHEDULED_WEEKLY_HOURS per
      work_assignment_hour_capacity. Also enforced at create.
    error_id: ERR_SCHEDULED_HOURS_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /cases/{id}/work-assignments, POST /work-assignments/{id}/activate"
  - priority: 52
    category: business_referential
    rule: |
      On POST /supportive-service-authorizations the referenced WorkAssignment's
      case_id must equal the referenced case_id.
    error_id: ERR_WORK_ASSIGNMENT_CASE_MISMATCH
    http_status: 422
    applies_to: "POST /supportive-service-authorizations"
  - priority: 54
    category: business_referential
    rule: |
      On POST /compliance-episodes, when prior_episode_id is supplied it must
      reference a ComplianceEpisode of the same case whose status is
      SANCTION_IMPOSED or CURE_PENDING.
    error_id: ERR_PRIOR_EPISODE_MISMATCH
    http_status: 422
    applies_to: "POST /compliance-episodes"
  - priority: 56
    category: business_referential
    rule: |
      Every month in Overpayment.months_covered must have a TimeLimitMonth row on
      the case with assistance_issued true.
    error_id: ERR_OVERPAID_MONTH_NOT_ISSUED
    http_status: 422
    applies_to: "POST /overpayments/{id}/establish"
  - priority: 60
    category: business_fiscal
    rule: |
      Approving an application whose countable_resources_cents exceeds
      RESOURCE_LIMIT_CENTS is refused. Exactly at the limit passes.
    error_id: ERR_RESOURCE_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /applications/{id}/approve"
  - priority: 62
    category: business_fiscal
    rule: |
      Approving an application whose determined_benefit_cents is 0 (income at or
      above the ratably reduced standard, or a grant below
      MINIMUM_ISSUANCE_CENTS) is refused.
    error_id: ERR_INELIGIBLE_ZERO_BENEFIT
    http_status: 422
    applies_to: "POST /applications/{id}/approve"
  - priority: 64
    category: business_fiscal
    rule: |
      Authorizing a supportive service whose waterfall result is 0 is refused;
      no partial row is created and no cap is consumed.
    error_id: ERR_SUPPORTIVE_CAP_EXHAUSTED
    http_status: 422
    applies_to: "POST /supportive-service-authorizations/{id}/authorize"
  - priority: 66
    category: business_fiscal
    rule: |
      A RecoveryTransaction whose method is not RECOUPMENT_REVERSAL and whose
      amount_cents exceeds Overpayment.balance_cents is refused.
    error_id: ERR_RECOVERY_EXCEEDS_BALANCE
    http_status: 422
    applies_to: "POST /overpayments/{id}/recovery-transactions"
  - priority: 68
    category: business_fiscal
    rule: |
      A RECOUPMENT_REVERSAL whose amount_cents exceeds
      Overpayment.total_recovered_cents is refused.
    error_id: ERR_REVERSAL_EXCEEDS_RECOVERED
    http_status: 422
    applies_to: "POST /overpayments/{id}/recovery-transactions"
  - priority: 70
    category: business_fiscal
    rule: |
      Offering a diversion grant requires Application.determined_benefit_cents > 0
      to size the lump sum.
    error_id: ERR_DIVERSION_REQUIRES_BENEFIT
    http_status: 422
    applies_to: "POST /applications/{id}/diversion-grants"

# =============================================================================
# 1.5 API Endpoint Table  (api_prefix is empty; every path is absolute)
#   Role anchors:
#     R_ALL   - every role, used for broad reads and the test clock
#     R_STAFF - every non-applicant role
# =============================================================================
endpoints:
  # --- Household ------------------------------------------------------------
  - method: POST
    path: /households
    roles: [Caseworker]
    input: [head_of_household_name, county_code, household_size, adult_count, youngest_child_age_months, "has_subsidized_child_care?"]
    output: Household
    description: |
      Register an assistance unit at intake. family_type is derived immediately via
      family_type_derivation; all clock rollups start at 0 and
      diversion_ineligible_through_month starts null. The returned id is the
      X-User-ID that the Applicant role must present for this household.
  - method: GET
    path: /households/{id}
    roles: &R_ALL [Applicant, Caseworker, EligibilitySupervisor, WorkProgramSpecialist, FiscalOfficer, FraudInvestigator, StateReportingAnalyst]
    input: []
    output: Household
    description: |
      Read one household with its current family_type and all four clock rollups
      (state_clock_months_used, federal_clock_months_used, extension_months_used,
      issued_countable_months). An Applicant may read only its own household.
  - method: GET
    path: /households/{id}/applications
    roles: *R_ALL
    input: ["status?", "limit?", "offset?"]
    output: Application[]
    description: Paginated applications of one household, newest first, optionally filtered by status.
  - method: POST
    path: /households/{id}/prior-assistance-record
    roles: &R_STAFF [Caseworker, EligibilitySupervisor, WorkProgramSpecialist, FiscalOfficer, FraudInvestigator, StateReportingAnalyst]
    input: [source_state_code, state_clock_months, federal_clock_months]
    output: Household
    description: |
      Record time-limit months carried in from another jurisdiction or a legacy
      system. Sets Household.prior_state_clock_months and
      prior_federal_clock_months and recomputes both rollups via time_limit_clock.
      This is the supported way to place a household near or at the 24-month state
      limit without issuing two dozen months of benefits.

  # --- Application, income, resources ---------------------------------------
  - method: POST
    path: /applications
    roles: [Applicant, Caseworker]
    input: [household_id, application_month, requested_program, "budgeting_method?"]
    output: Application
    description: |
      File an application in RECEIVED. budgeting_method selects the
      countable_income_determination variant and defaults to PROSPECTIVE. An
      Applicant may file only for its own household.
  - method: GET
    path: /applications/{id}
    roles: *R_ALL
    input: []
    output: Application
    description: Read one application including snapshot_family_type and the three determination outputs.
  - method: POST
    path: /applications/{id}/income-sources
    roles: [Caseworker]
    input: [source_type, gross_monthly_cents, "month_1_cents?", "month_2_cents?", "month_3_cents?", is_recurring]
    output: IncomeSource
    description: |
      Attach a reported income source in verification_status UNVERIFIED.
      gross_monthly_cents feeds the PROSPECTIVE variant; the three month figures
      feed the RETROSPECTIVE variant and default to 0. Allowed only while the
      application is in RECEIVED.
  - method: GET
    path: /applications/{id}/income-sources
    roles: *R_ALL
    input: ["source_type?", "verification_status?", "limit?", "offset?"]
    output: IncomeSource[]
    description: Paginated income sources of one application.
  - method: POST
    path: /income-sources/{id}/verify
    roles: [Caseworker]
    input: [verification_status]
    output: IncomeSource
    description: |
      Set verification_status to VERIFIED or REFUSED. Only VERIFIED recurring
      sources count under PROSPECTIVE budgeting; REFUSED sources are excluded
      under both variants while UNVERIFIED sources still count under
      RETROSPECTIVE budgeting.
  - method: POST
    path: /applications/{id}/resource-items
    roles: [Caseworker]
    input: [item_type, gross_value_cents, "encumbrance_cents?", exclusion_type]
    output: ResourceItem
    description: |
      Attach a countable or excluded resource. countable_value_cents is derived
      via countable_resource_determination: excluded items count 0, others count
      max(0, gross_value_cents - encumbrance_cents).
  - method: GET
    path: /applications/{id}/resource-items
    roles: *R_ALL
    input: ["item_type?", "limit?", "offset?"]
    output: ResourceItem[]
    description: Paginated resource items of one application with their computed countable values.
  - method: POST
    path: /applications/{id}/determine
    roles: [Caseworker]
    input: []
    output: Application
    description: |
      Run eligibility determination: RECEIVED -> DETERMINED. Snapshots
      Household.family_type, computes countable_income_cents (variant-selected by
      budgeting_method), countable_resources_cents, and determined_benefit_cents
      (benefit_amount_calculation with sanction_pct 0.00), and records
      determined_by_user_id. Refused with ERR_DIVERSION_INELIGIBILITY_ACTIVE while
      a diversion ineligibility window covers application_month.
  - method: POST
    path: /applications/{id}/approve
    roles: [EligibilitySupervisor]
    input: [certification_start_month]
    output: AssistanceCase
    description: |
      DETERMINED -> APPROVED and create the AssistanceCase. Requires a different
      X-User-ID than determined_by_user_id (ERR_SEGREGATION_OF_DUTIES), an
      unexhausted state clock (ERR_TIME_LIMIT_EXHAUSTED), resources at or under
      RESOURCE_LIMIT_CENTS (ERR_RESOURCE_LIMIT_EXCEEDED) and a positive benefit
      (ERR_INELIGIBLE_ZERO_BENEFIT). The new case starts in benefit_status
      PENDING_ISSUANCE with compliance_status ASSIGNED, or NOT_REQUIRED when
      family_type is CHILD_ONLY, and its four hour requirements are computed via
      required_hours_by_family_type. Returns the created case.
  - method: POST
    path: /applications/{id}/deny
    roles: [EligibilitySupervisor]
    input: [denial_reason]
    output: Application
    description: DETERMINED -> DENIED with a recorded reason; requires a different actor than the determiner.
  - method: POST
    path: /applications/{id}/withdraw
    roles: [Applicant, Caseworker]
    input: [withdrawal_reason]
    output: Application
    description: |
      Applicant-initiated withdrawal from RECEIVED, DETERMINED or
      DIVERSION_OFFERED. Any OFFERED DiversionGrant of the application is set to
      DECLINED.
  - method: POST
    path: /applications/{id}/diversion-grants
    roles: [EligibilitySupervisor]
    input: []
    output: DiversionGrant
    description: |
      Offer diversion assistance instead of ongoing benefits: DETERMINED ->
      DIVERSION_OFFERED. Requires requested_program DIVERSION_CONSIDERED and
      determined_benefit_cents > 0 (ERR_DIVERSION_REQUIRES_BENEFIT). The grant's
      lump_sum_cents, ineligibility_months and ineligibility_end_month are
      computed via diversion_lump_sum from the determined benefit.
  - method: GET
    path: /applications/{id}/diversion-grants
    roles: *R_ALL
    input: ["status?", "limit?", "offset?"]
    output: DiversionGrant[]
    description: Paginated diversion grants offered on one application.
  - method: POST
    path: /diversion-grants/{id}/accept
    roles: [Applicant]
    input: []
    output: DiversionGrant
    description: |
      Accept the lump sum: grant OFFERED -> ACCEPTED, application
      DIVERSION_OFFERED -> DIVERTED, and
      Household.diversion_ineligible_through_month := ineligibility_end_month.
      No AssistanceCase is created and no time-limit month is consumed.
  - method: POST
    path: /diversion-grants/{id}/decline
    roles: [Applicant]
    input: [decline_reason]
    output: DiversionGrant
    description: |
      Decline the lump sum: grant OFFERED -> DECLINED and the application cycles
      DIVERSION_OFFERED -> DETERMINED so ongoing assistance can still be
      approved. No ineligibility window is created.

  # --- AssistanceCase, issuance, time limits --------------------------------
  - method: GET
    path: /cases/{id}
    roles: *R_ALL
    input: []
    output: AssistanceCase
    description: |
      Read one case with both state dimensions (benefit_status and
      compliance_status), the sanction rollup, the current benefit amount, the
      four hour requirements and supportive_fy_authorized_cents. version is the
      value to echo back as expected_case_version on guarded writes.
  - method: GET
    path: /cases
    roles: *R_STAFF
    input: ["household_id?", "application_id?", "benefit_status?", "compliance_status?", "limit?", "offset?"]
    output: AssistanceCase[]
    description: Paginated case search filtered by household, originating application, or either state dimension.
  - method: POST
    path: /cases/{id}/issuances
    roles: [Caseworker]
    input: [benefit_month]
    output: TimeLimitMonth
    description: |
      Issue one month of assistance. Creates the TimeLimitMonth ledger row with
      assistance_issued true, evaluates both clock variants via time_limit_clock,
      recomputes all four Household rollups, and moves the case
      PENDING_ISSUANCE -> ACTIVE on the first issuance. A second issuance for the
      same benefit_month is refused with ERR_DUPLICATE_ISSUANCE_MONTH. When the
      recomputed state clock reaches STATE_TIME_LIMIT_MONTHS and no granted
      extension covers the month, the case closes with closure_reason TIME_LIMIT.
  - method: GET
    path: /cases/{id}/time-limit-months
    roles: *R_ALL
    input: ["benefit_month?", "limit?", "offset?"]
    output: TimeLimitMonth[]
    description: |
      Paginated month-by-month time-limit ledger for one case, each row carrying
      state_clock_countable, federal_clock_countable and non_countable_reason so
      the two clock variants can be compared row by row.
  - method: POST
    path: /cases/{id}/extensions
    roles: [Caseworker, WorkProgramSpecialist]
    input: [extension_type, months_requested, first_effective_month]
    output: TimeLimitExtension
    description: |
      Request a hardship extension of the state time limit in status REQUESTED.
      months_requested is 1..12 and first_effective_month is the first month the
      extension would shield.
  - method: GET
    path: /cases/{id}/extensions
    roles: *R_ALL
    input: ["status?", "limit?", "offset?"]
    output: TimeLimitExtension[]
    description: Paginated hardship extension requests for one case with their granted month ranges.
  - method: POST
    path: /extensions/{id}/grant
    roles: [EligibilitySupervisor]
    input: [months_granted]
    output: TimeLimitExtension
    description: |
      REQUESTED -> GRANTED. months_granted must be 1..months_requested and must
      keep Household.extension_months_used within MAX_HARDSHIP_EXTENSION_MONTHS
      (ERR_EXTENSION_LIMIT_EXCEEDED). Sets last_effective_month, flips the covered
      TimeLimitMonth rows to state-non-countable with non_countable_reason
      GRANTED_EXTENSION, and recomputes the Household clock rollups. The federal
      clock is untouched.
  - method: POST
    path: /extensions/{id}/deny
    roles: [EligibilitySupervisor]
    input: [denial_reason]
    output: TimeLimitExtension
    description: REQUESTED -> DENIED with a recorded reason; no clock field changes.
  - method: POST
    path: /extensions/{id}/revoke
    roles: [EligibilitySupervisor]
    input: [revocation_reason]
    output: TimeLimitExtension
    description: |
      GRANTED -> REVOKED. The compensating action for a grant: months_granted goes
      back to 0, every month this extension shielded becomes state-countable again
      unless another granted extension still covers it, and the Household rollups
      are recomputed so the conserved month invariant in time_limit_clock still
      holds. If the restored state clock has reached the limit the case closes
      with closure_reason TIME_LIMIT.

  # --- Work assignments and participation -----------------------------------
  - method: POST
    path: /cases/{id}/work-assignments
    roles: [WorkProgramSpecialist]
    input: [activity_category, scheduled_weekly_hours, start_date, end_date]
    output: WorkAssignment
    description: |
      Assign a work activity in status PROPOSED. is_core is derived from
      activity_category against CORE_CATEGORIES. The date range is half-open
      [start_date, end_date), so an assignment ending on the day another begins
      does not overlap it. Aggregate scheduled_weekly_hours across overlapping
      PROPOSED/ACTIVE assignments of the case must stay within
      MAX_SCHEDULED_WEEKLY_HOURS.
  - method: GET
    path: /cases/{id}/work-assignments
    roles: *R_ALL
    input: ["status?", "activity_category?", "limit?", "offset?"]
    output: WorkAssignment[]
    description: Paginated work assignments of one case with their core flag, cumulative verified hours and compliance flag.
  - method: GET
    path: /work-assignments/{id}
    roles: *R_ALL
    input: []
    output: WorkAssignment
    description: Read one work assignment including is_core, cumulative_verified_hours and compliance_flag.
  - method: POST
    path: /work-assignments/{id}/activate
    roles: [WorkProgramSpecialist]
    input: []
    output: WorkAssignment
    description: |
      PROPOSED -> ACTIVE. Requires the owning case to be in benefit_status ACTIVE
      (ERR_CASE_NOT_ACTIVE), its compliance_status to be one of ASSIGNED,
      CONCILIATION_PENDING or CURE_PENDING, and the aggregate weekly-hour capacity
      check to pass (ERR_SCHEDULED_HOURS_CAPACITY_EXCEEDED).
  - method: POST
    path: /work-assignments/{id}/terminate
    roles: [WorkProgramSpecialist]
    input: [termination_reason]
    output: WorkAssignment
    description: |
      Terminate an assignment. The reason forks the outcome: COMPLETED_ACTIVITY
      lands in status COMPLETED and leaves the assignment's supportive service
      authorizations untouched, while NONCOMPLIANCE, CASE_CLOSED or PLAN_CHANGE
      land in status TERMINATED and void every REQUESTED, HELD or AUTHORIZED
      authorization of the assignment, restoring the fiscal-year cap headroom.
  - method: POST
    path: /work-assignments/{id}/participation-reports
    roles: [Caseworker, WorkProgramSpecialist]
    input: [report_month, reported_hours, verification_source]
    output: ParticipationReport
    description: |
      Report hours for one month against one assignment, in status SUBMITTED.
      report_month must intersect the assignment's half-open date range
      (ERR_REPORT_MONTH_OUTSIDE_ASSIGNMENT) and must not duplicate an existing
      SUBMITTED or VERIFIED report for the assignment
      (ERR_DUPLICATE_REPORT_MONTH). Requires the case to be ACTIVE.
  - method: GET
    path: /work-assignments/{id}/participation-reports
    roles: *R_ALL
    input: ["report_month?", "status?", "limit?", "offset?"]
    output: ParticipationReport[]
    description: Paginated participation reports of one assignment with their credited core and non-core hours.
  - method: POST
    path: /participation-reports/{id}/verify
    roles: [WorkProgramSpecialist]
    input: [verified_hours]
    output: ParticipationReport
    description: |
      SUBMITTED -> VERIFIED and the head of CASCADE A. verified_hours is 0..
      reported_hours and is discounted by SELF_REPORT_CREDIT_FACTOR when the
      report's verification_source is SELF_REPORT. Credits are split core versus
      non-core by the assignment's is_core flag, the assignment's cumulative hours
      and compliance flag are recomputed, and a core-hour shortfall for the month
      opens a ComplianceEpisode and puts every REQUESTED supportive service
      authorization of the case on hold.
  - method: POST
    path: /participation-reports/{id}/reject
    roles: [WorkProgramSpecialist]
    input: [rejection_reason]
    output: ParticipationReport
    description: |
      SUBMITTED -> REJECTED with zero credited hours. Rejected reports never enter
      the participation predicate or the work participation rate numerator.

  # --- Compliance, conciliation and sanctions -------------------------------
  - method: POST
    path: /compliance-episodes
    roles: [WorkProgramSpecialist]
    input: [case_id, allegation_reason, expected_case_version, "prior_episode_id?"]
    output: ComplianceEpisode
    description: |
      Open a noncompliance episode in status ALLEGED with origin
      CASEWORKER_REFERRAL and put the case into compliance_status
      CONCILIATION_PENDING. expected_case_version must match the case's current
      version (ERR_STALE_CASE_VERSION). prior_episode_id chains a repeat
      occurrence so the sanction ladder escalates; it must reference an episode of
      the same case in SANCTION_IMPOSED or CURE_PENDING
      (ERR_PRIOR_EPISODE_MISMATCH). Increments AssistanceCase.version by 1.
  - method: GET
    path: /compliance-episodes/{id}
    roles: *R_ALL
    input: []
    output: ComplianceEpisode
    description: Read one episode with its conciliation window, sanction level and percentage, and good-cause reason.
  - method: GET
    path: /compliance-episodes
    roles: *R_STAFF
    input: ["case_id?", "prior_episode_id?", "status?", "limit?", "offset?"]
    output: ComplianceEpisode[]
    description: Paginated episode search by case, by chained predecessor episode, or by status.
  - method: POST
    path: /compliance-episodes/{id}/start-conciliation
    roles: [WorkProgramSpecialist]
    input: []
    output: ComplianceEpisode
    description: |
      ALLEGED -> CONCILIATION. Stamps conciliation_start_date from the logical
      clock and sets conciliation_deadline_date to CONCILIATION_DAYS days later.
      No sanction may be imposed before that deadline.
  - method: POST
    path: /compliance-episodes/{id}/grant-good-cause
    roles: [EligibilitySupervisor]
    input: [good_cause_reason]
    output: ComplianceEpisode
    description: |
      CONCILIATION -> GOOD_CAUSE_GRANTED. Clears the episode's sanction level,
      moves the case's compliance_status to EXEMPT, and recomputes the case
      sanction rollup and benefit amount. A later impose-sanction on the same
      episode is refused with ERR_GOOD_CAUSE_ACTIVE.
  - method: POST
    path: /compliance-episodes/{id}/resolve-compliant
    roles: [WorkProgramSpecialist]
    input: []
    output: ComplianceEpisode
    description: |
      CONCILIATION -> RESOLVED_COMPLIANT or CURE_PENDING -> RESOLVED_COMPLIANT.
      Zeroes the episode's sanction, returns the case's compliance_status to
      ASSIGNED, recomputes the sanction rollup and benefit amount, un-suspends the
      case when the rollup returns to level 0, and resumes any paused recoupment.
  - method: POST
    path: /compliance-episodes/{id}/impose-sanction
    roles: [EligibilitySupervisor]
    input: []
    output: ComplianceEpisode
    description: |
      CONCILIATION -> SANCTION_IMPOSED, or CURE_PENDING -> SANCTION_IMPOSED with
      the level escalated by one. Requires the conciliation deadline to have
      passed (ERR_CONCILIATION_NOT_COMPLETE) and no active good cause
      (ERR_GOOD_CAUSE_ACTIVE). Head of CASCADE B: the episode level sets
      sanction_pct from SANCTION_PCT_BY_LEVEL, the case sanction rollup and
      benefit amount are recomputed, a level-2 rollup suspends the case while a
      level-3 rollup closes it with closure_reason FULL_FAMILY_SANCTION, and
      either outcome pauses active recoupment on the case's overpayments.
  - method: POST
    path: /compliance-episodes/{id}/begin-cure
    roles: [WorkProgramSpecialist]
    input: [cure_plan_note]
    output: ComplianceEpisode
    description: |
      SANCTION_IMPOSED -> CURE_PENDING with a recorded cure plan; the case's
      compliance_status becomes CURE_PENDING. The sanction percentage stays in
      force during the cure, so a failed cure escalates rather than restarts.

  # --- Supportive services ---------------------------------------------------
  - method: POST
    path: /supportive-service-authorizations
    roles: [WorkProgramSpecialist]
    input: [case_id, work_assignment_id, service_type, requested_amount_cents, period_start, period_end, expected_case_version]
    output: SupportiveServiceAuthorization
    description: |
      Request transportation, child care or work-expense support for one work
      assignment in status REQUESTED with authorized_amount_cents 0. fiscal_year is
      derived from period_start. The service period is a closed inclusive interval
      and must not overlap another REQUESTED, HELD or AUTHORIZED authorization of
      the same case and service_type (ERR_SERVICE_PERIOD_OVERLAP). The referenced
      assignment must belong to the referenced case
      (ERR_WORK_ASSIGNMENT_CASE_MISMATCH). expected_case_version must match the
      case's current version (ERR_STALE_CASE_VERSION) and the write increments
      AssistanceCase.version by 1.
  - method: GET
    path: /supportive-service-authorizations/{id}
    roles: *R_ALL
    input: []
    output: SupportiveServiceAuthorization
    description: Read one authorization with its requested and authorized amounts, fiscal year and status.
  - method: GET
    path: /supportive-service-authorizations
    roles: *R_STAFF
    input: ["case_id?", "work_assignment_id?", "service_type?", "status?", "limit?", "offset?"]
    output: SupportiveServiceAuthorization[]
    description: Paginated authorization search by case, assignment, service type or status.
  - method: POST
    path: /supportive-service-authorizations/{id}/authorize
    roles: [WorkProgramSpecialist]
    input: []
    output: SupportiveServiceAuthorization
    description: |
      REQUESTED -> AUTHORIZED. The owning WorkAssignment must be ACTIVE
      (ERR_ASSIGNMENT_NOT_ACTIVE). authorized_amount_cents is the
      supportive_service_waterfall minimum of the request, the remaining
      per-service-type fiscal-year cap and the remaining per-case fiscal-year cap;
      a partial award is normal. A zero result is refused with
      ERR_SUPPORTIVE_CAP_EXHAUSTED and consumes no cap.
  - method: POST
    path: /supportive-service-authorizations/{id}/void
    roles: [WorkProgramSpecialist, FiscalOfficer]
    input: [void_reason]
    output: SupportiveServiceAuthorization
    description: |
      Void a REQUESTED, HELD or AUTHORIZED authorization. The compensating action
      for authorize: authorized_amount_cents returns to 0 and the freed
      per-service-type and per-case fiscal-year headroom is restored exactly, so
      the conserved cap invariant in supportive_service_waterfall still holds.
  - method: POST
    path: /supportive-service-authorizations/{id}/release-hold
    roles: [WorkProgramSpecialist]
    input: []
    output: SupportiveServiceAuthorization
    description: |
      HELD -> REQUESTED once the case's compliance_status is back to ASSIGNED,
      EXEMPT or NOT_REQUIRED (ERR_ASSIGNMENT_NOT_ACTIVE otherwise). The hold is
      imposed by CASCADE A, not by any direct call.

  # --- Overpayments, recovery and fraud -------------------------------------
  - method: POST
    path: /overpayments
    roles: [FiscalOfficer, FraudInvestigator]
    input: [case_id, claim_type, months_covered, gross_amount_cents, computation_method, "offsetting_underpayment_cents?"]
    output: Overpayment
    description: |
      Draft an overpayment claim in status DRAFT with zeroed ledger fields.
      computation_method selects the overpayment_establishment variant: GROSS
      ignores offsetting_underpayment_cents entirely while NET subtracts it.
      months_covered is a non-empty list of YYYY-MM months.
  - method: GET
    path: /overpayments/{id}
    roles: *R_STAFF
    input: []
    output: Overpayment
    description: |
      Read one overpayment with its established amount, monthly recoupment amount,
      total recovered, balance, recoupment status and fraud referral status.
      version is the value to echo back as expected_overpayment_version.
  - method: GET
    path: /cases/{id}/overpayments
    roles: *R_STAFF
    input: ["status?", "recoupment_status?", "limit?", "offset?"]
    output: Overpayment[]
    description: Paginated overpayment claims against one case.
  - method: POST
    path: /overpayments/{id}/establish
    roles: [FiscalOfficer, FraudInvestigator]
    input: []
    output: Overpayment
    description: |
      DRAFT -> ESTABLISHED. Computes established_amount_cents by the selected
      variant, sizes monthly_recoupment_cents from the case's current benefit and
      the claim type, opens the balance, and records established_by_user_id. Every
      month in months_covered must have been issued
      (ERR_OVERPAID_MONTH_NOT_ISSUED).
  - method: POST
    path: /overpayments/{id}/recovery-transactions
    roles: [FiscalOfficer]
    input: [method, amount_cents, applied_month, expected_overpayment_version]
    output: RecoveryTransaction
    description: |
      Post a recovery ledger entry. BENEFIT_RECOUPMENT requires the case to be
      ACTIVE (ERR_CASE_NOT_ACTIVE). Non-reversal entries may not exceed the
      balance (ERR_RECOVERY_EXCEEDS_BALANCE); a RECOUPMENT_REVERSAL carries a
      negative signed amount and may not exceed total_recovered_cents
      (ERR_REVERSAL_EXCEEDS_RECOVERED). The overpayment's total recovered and
      balance are recomputed, the claim moves to IN_RECOVERY or SATISFIED, and a
      reversal can bring a SATISFIED claim back to IN_RECOVERY.
      expected_overpayment_version must match the current version
      (ERR_STALE_OVERPAYMENT_VERSION) and the write increments Overpayment.version
      by 1.
  - method: GET
    path: /overpayments/{id}/recovery-transactions
    roles: *R_STAFF
    input: ["method?", "applied_month?", "limit?", "offset?"]
    output: RecoveryTransaction[]
    description: Paginated recovery ledger for one overpayment with each entry's signed amount.
  - method: POST
    path: /overpayments/{id}/write-off
    roles: [FiscalOfficer]
    input: [write_off_reason]
    output: Overpayment
    description: |
      ESTABLISHED or IN_RECOVERY -> WRITTEN_OFF. Requires a different X-User-ID
      than established_by_user_id (ERR_SEGREGATION_OF_DUTIES) and stops recoupment.
  - method: POST
    path: /overpayments/{id}/fraud-referral
    roles: [FraudInvestigator]
    input: [referral_note]
    output: Overpayment
    description: |
      Refer an established claim for fraud investigation: fraud_referral_status
      NOT_REFERRED -> REFERRED. This dimension moves independently of the
      recovery status.
  - method: POST
    path: /overpayments/{id}/fraud-disposition
    roles: [FraudInvestigator]
    input: [disposition]
    output: Overpayment
    description: |
      Close the referral: REFERRED -> SUBSTANTIATED or UNSUBSTANTIATED. A
      substantiated finding re-sizes monthly_recoupment_cents at
      FRAUD_SUBSTANTIATED_RECOUPMENT_PCT of the case's current benefit; an
      unsubstantiated finding leaves it unchanged. Neither changes the established
      amount or the balance.

  # --- Federal reporting -----------------------------------------------------
  - method: POST
    path: /reporting-periods
    roles: [StateReportingAnalyst]
    input: [fiscal_year, quarter, prior_year_caseload, eligibility_change_caseload_effect]
    output: FederalReportingPeriod
    description: |
      Open a federal reporting quarter in status OPEN with all computed rate fields
      at their defaults. prior_year_caseload and
      eligibility_change_caseload_effect are the caseload-reduction-credit inputs.
  - method: GET
    path: /reporting-periods/{id}
    roles: *R_STAFF
    input: []
    output: FederalReportingPeriod
    description: Read one reporting period with both participation rates, the credit, the adjusted target and the target_met flag.
  - method: POST
    path: /reporting-periods/{id}/calculate
    roles: [StateReportingAnalyst]
    input: []
    output: FederalReportingPeriod
    description: |
      OPEN -> CALCULATED, or CALCULATED -> CALCULATED to recompute. Runs
      work_participation_rate over the quarter's three months: raw monthly
      denominators, the chronological three-month-per-fiscal-year sanction
      disregard, the participation numerator, both rates, and then the caseload
      reduction credit from the UNADJUSTED caseload. Records calculated_by_user_id.
  - method: POST
    path: /reporting-periods/{id}/certify
    roles: [StateReportingAnalyst]
    input: []
    output: FederalReportingPeriod
    description: |
      CALCULATED -> CERTIFIED. Requires a different X-User-ID than
      calculated_by_user_id (ERR_SEGREGATION_OF_DUTIES) and no ParticipationReport
      still in SUBMITTED with a report_month inside the quarter
      (ERR_UNVERIFIED_REPORTS_IN_QUARTER).

  # --- Test-driving endpoint -------------------------------------------------
  - method: POST
    path: /_clock/set_current_utc
    roles: *R_ALL
    input: [to_iso8601]
    output: { current_utc: string }
    description: |
      Set the service's logical clock, which is the only source of "now" for
      conciliation_start_date, conciliation_deadline_date comparisons,
      sanction_imposed_month and the current fiscal year used by
      supportive_fy_authorized_cents. The clock starts at 2026-08-01T00:00:00Z on
      every service startup and only ever moves when this endpoint is called, so
      deadline and fiscal-year behaviour is fully deterministic. Requires no
      authentication headers.

# =============================================================================
# 1.6 Error Catalog
# =============================================================================
errors:
  - error_id: ERR_UNAUTHENTICATED
    http_status: 401
    message: "Authentication headers are missing."
    trigger: "X-User-ID or X-User-Role absent or empty."
  - error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    message: "This role may not perform this operation."
    trigger: "X-User-Role is not listed for the endpoint."
  - error_id: ERR_NOT_HOUSEHOLD_OWNER
    http_status: 403
    message: "An applicant may act only on its own household."
    trigger: "X-User-Role is Applicant and X-User-ID is not the owning Household.id."
  - error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    message: "The acting user may not both prepare and dispose of this action."
    trigger: "Approver equals the determiner, writer-off equals the establisher, or certifier equals the calculator."
  - error_id: ERR_HOUSEHOLD_NOT_FOUND
    http_status: 404
    message: "Household not found."
    trigger: "Path or body household_id does not resolve."
  - error_id: ERR_APPLICATION_NOT_FOUND
    http_status: 404
    message: "Application not found."
    trigger: "Path or body application_id does not resolve."
  - error_id: ERR_INCOME_SOURCE_NOT_FOUND
    http_status: 404
    message: "Income source not found."
    trigger: "Path income source id does not resolve."
  - error_id: ERR_CASE_NOT_FOUND
    http_status: 404
    message: "Assistance case not found."
    trigger: "Path or body case_id does not resolve."
  - error_id: ERR_EXTENSION_NOT_FOUND
    http_status: 404
    message: "Time limit extension not found."
    trigger: "Path extension id does not resolve."
  - error_id: ERR_WORK_ASSIGNMENT_NOT_FOUND
    http_status: 404
    message: "Work assignment not found."
    trigger: "Path or body work_assignment_id does not resolve."
  - error_id: ERR_PARTICIPATION_REPORT_NOT_FOUND
    http_status: 404
    message: "Participation report not found."
    trigger: "Path participation report id does not resolve."
  - error_id: ERR_COMPLIANCE_EPISODE_NOT_FOUND
    http_status: 404
    message: "Compliance episode not found."
    trigger: "Path episode id or body prior_episode_id does not resolve."
  - error_id: ERR_AUTHORIZATION_NOT_FOUND
    http_status: 404
    message: "Supportive service authorization not found."
    trigger: "Path authorization id does not resolve."
  - error_id: ERR_OVERPAYMENT_NOT_FOUND
    http_status: 404
    message: "Overpayment not found."
    trigger: "Path overpayment id does not resolve."
  - error_id: ERR_DIVERSION_GRANT_NOT_FOUND
    http_status: 404
    message: "Diversion grant not found."
    trigger: "Path diversion grant id does not resolve."
  - error_id: ERR_REPORTING_PERIOD_NOT_FOUND
    http_status: 404
    message: "Reporting period not found."
    trigger: "Path reporting period id does not resolve."
  - error_id: ERR_INVALID_REQUEST
    http_status: 400
    message: "The request body or query string is invalid."
    trigger: "Missing required field, wrong type, out-of-domain enum, out-of-range number, or malformed month, date or timestamp."
  - error_id: ERR_STALE_CASE_VERSION
    http_status: 412
    message: "The assistance case has changed since it was read."
    trigger: "expected_case_version does not equal AssistanceCase.version."
  - error_id: ERR_STALE_OVERPAYMENT_VERSION
    http_status: 412
    message: "The overpayment has changed since it was read."
    trigger: "expected_overpayment_version does not equal Overpayment.version."
  - error_id: ERR_INVALID_APPLICATION_STATE
    http_status: 409
    message: "The application is not in a state that allows this transition."
    trigger: "determine, approve, deny, withdraw or diversion offer from a disallowed status."
  - error_id: ERR_INVALID_CASE_STATE
    http_status: 409
    message: "The assistance case is not in a state that allows this operation."
    trigger: "Issuance or extension request against a CLOSED case."
  - error_id: ERR_INVALID_EXTENSION_STATE
    http_status: 409
    message: "The extension is not in a state that allows this transition."
    trigger: "grant or deny of a non-REQUESTED extension, or revoke of a non-GRANTED extension."
  - error_id: ERR_INVALID_ASSIGNMENT_STATE
    http_status: 409
    message: "The work assignment is not in a state that allows this transition."
    trigger: "activate of a non-PROPOSED assignment, or terminate of an already COMPLETED or TERMINATED assignment."
  - error_id: ERR_INVALID_REPORT_STATE
    http_status: 409
    message: "The participation report is not in a state that allows this transition."
    trigger: "verify or reject of a report that is not SUBMITTED."
  - error_id: ERR_INVALID_EPISODE_STATE
    http_status: 409
    message: "The compliance episode is not in a state that allows this transition."
    trigger: "start-conciliation, grant-good-cause, resolve-compliant, impose-sanction or begin-cure from a disallowed status."
  - error_id: ERR_INVALID_AUTHORIZATION_STATE
    http_status: 409
    message: "The authorization is not in a state that allows this transition."
    trigger: "authorize of a non-REQUESTED row, release-hold of a non-HELD row, or void of an already VOIDED row."
  - error_id: ERR_INVALID_OVERPAYMENT_STATE
    http_status: 409
    message: "The overpayment is not in a state that allows this operation."
    trigger: "establish of a non-DRAFT claim, a recovery entry against a DRAFT or WRITTEN_OFF claim, write-off of a claim that is not ESTABLISHED or IN_RECOVERY, or a fraud transition from the wrong referral status."
  - error_id: ERR_INVALID_PERIOD_STATE
    http_status: 409
    message: "The reporting period is not in a state that allows this transition."
    trigger: "certify of a period that is not CALCULATED, or calculate of a CERTIFIED period."
  - error_id: ERR_INVALID_DIVERSION_STATE
    http_status: 409
    message: "The diversion grant is not in a state that allows this transition."
    trigger: "accept or decline of a grant that is not OFFERED."
  - error_id: ERR_CASE_NOT_ACTIVE
    http_status: 409
    message: "The assistance case must be active for this operation."
    trigger: "Activating an assignment, filing a participation report, or posting a BENEFIT_RECOUPMENT entry while the case is PENDING_ISSUANCE, SUSPENDED or CLOSED."
  - error_id: ERR_ASSIGNMENT_NOT_ACTIVE
    http_status: 409
    message: "The related work assignment or case posture does not permit this operation."
    trigger: "Authorizing supportive service while the assignment is not ACTIVE, or releasing a hold while the case is still in a compliance action."
  - error_id: ERR_UNVERIFIED_REPORTS_IN_QUARTER
    http_status: 409
    message: "Participation reports in this quarter are still unverified."
    trigger: "certify while a ParticipationReport with status SUBMITTED has a report_month inside the quarter."
  - error_id: ERR_TIME_LIMIT_EXHAUSTED
    http_status: 422
    message: "The household has exhausted the state time limit."
    trigger: "approve when state_clock_months_used has reached STATE_TIME_LIMIT_MONTHS with no granted extension covering the certification month."
  - error_id: ERR_CONCILIATION_NOT_COMPLETE
    http_status: 422
    message: "The conciliation period has not ended."
    trigger: "impose-sanction before conciliation_deadline_date."
  - error_id: ERR_GOOD_CAUSE_ACTIVE
    http_status: 422
    message: "Good cause has been granted for this episode."
    trigger: "impose-sanction on an episode whose good_cause_reason is not NONE."
  - error_id: ERR_EXTENSION_LIMIT_EXCEEDED
    http_status: 422
    message: "The requested extension exceeds what may be granted."
    trigger: "months_granted above months_requested, or a household extension total above MAX_HARDSHIP_EXTENSION_MONTHS."
  - error_id: ERR_DIVERSION_INELIGIBILITY_ACTIVE
    http_status: 422
    message: "The household is inside a diversion ineligibility period."
    trigger: "determine with application_month at or before Household.diversion_ineligible_through_month."
  - error_id: ERR_SERVICE_PERIOD_OVERLAP
    http_status: 409
    message: "The service period overlaps an existing authorization of the same type."
    trigger: "A closed inclusive [period_start, period_end] interval intersecting a REQUESTED, HELD or AUTHORIZED row of the same case and service_type."
  - error_id: ERR_DUPLICATE_ISSUANCE_MONTH
    http_status: 409
    message: "Assistance has already been issued for this month."
    trigger: "A TimeLimitMonth already exists for the case and benefit_month."
  - error_id: ERR_DUPLICATE_REPORT_MONTH
    http_status: 409
    message: "A participation report already exists for this month."
    trigger: "A SUBMITTED or VERIFIED report already exists for the assignment and report_month."
  - error_id: ERR_REPORT_MONTH_OUTSIDE_ASSIGNMENT
    http_status: 422
    message: "The report month does not fall inside the assignment period."
    trigger: "report_month does not intersect the assignment's half-open date range."
  - error_id: ERR_SCHEDULED_HOURS_CAPACITY_EXCEEDED
    http_status: 422
    message: "Scheduled weekly hours exceed the allowed maximum for overlapping assignments."
    trigger: "Aggregate scheduled_weekly_hours over overlapping PROPOSED or ACTIVE assignments above MAX_SCHEDULED_WEEKLY_HOURS."
  - error_id: ERR_WORK_ASSIGNMENT_CASE_MISMATCH
    http_status: 422
    message: "The work assignment does not belong to the given case."
    trigger: "WorkAssignment.case_id differs from the case_id in the authorization request."
  - error_id: ERR_PRIOR_EPISODE_MISMATCH
    http_status: 422
    message: "The prior episode does not belong to this case or is not sanctioned."
    trigger: "prior_episode_id references another case's episode or one not in SANCTION_IMPOSED or CURE_PENDING."
  - error_id: ERR_OVERPAID_MONTH_NOT_ISSUED
    http_status: 422
    message: "A month covered by the claim was never issued."
    trigger: "A month in months_covered has no TimeLimitMonth with assistance_issued true on the case."
  - error_id: ERR_RESOURCE_LIMIT_EXCEEDED
    http_status: 422
    message: "Countable resources exceed the program limit."
    trigger: "approve with countable_resources_cents above RESOURCE_LIMIT_CENTS."
  - error_id: ERR_INELIGIBLE_ZERO_BENEFIT
    http_status: 422
    message: "The calculated benefit is zero."
    trigger: "approve with determined_benefit_cents equal to 0, including a grant below MINIMUM_ISSUANCE_CENTS."
  - error_id: ERR_SUPPORTIVE_CAP_EXHAUSTED
    http_status: 422
    message: "No supportive service funding remains for this service type or case."
    trigger: "The supportive_service_waterfall minimum evaluates to 0."
  - error_id: ERR_RECOVERY_EXCEEDS_BALANCE
    http_status: 422
    message: "The recovery amount exceeds the outstanding balance."
    trigger: "A non-reversal entry with amount_cents above Overpayment.balance_cents."
  - error_id: ERR_REVERSAL_EXCEEDS_RECOVERED
    http_status: 422
    message: "The reversal amount exceeds the amount recovered."
    trigger: "A RECOUPMENT_REVERSAL with amount_cents above Overpayment.total_recovered_cents."
  - error_id: ERR_DIVERSION_REQUIRES_BENEFIT
    http_status: 422
    message: "A diversion grant requires a positive determined benefit."
    trigger: "diversion offer when determined_benefit_cents is 0 or null."

# =============================================================================
# 1.7 RBAC / Role Table
# =============================================================================
roles:
  - name: Applicant
    identity: "entity_backed:Household"
    description: |
      The head of an assistance unit, identified by presenting the Household.id as
      X-User-ID. May read its own household and applications, file and withdraw an
      application, and accept or decline a diversion offer. Every applicant-facing
      read and write is subject to the ownership check at priority 6.
    permissions:
      read: [Household, Application, IncomeSource, ResourceItem, AssistanceCase, TimeLimitMonth, TimeLimitExtension, WorkAssignment, ParticipationReport, ComplianceEpisode, SupportiveServiceAuthorization, DiversionGrant]
      write: [Application, DiversionGrant]
  - name: Caseworker
    identity: opaque
    description: |
      County intake and maintenance worker. Registers households, records income
      and resources, verifies income, runs the determination, issues monthly
      assistance, and requests hardship extensions. May not approve or deny the
      determination it produced.
    permissions:
      read: "all entities"
      write: [Household, Application, IncomeSource, ResourceItem, TimeLimitMonth, TimeLimitExtension, ParticipationReport]
  - name: EligibilitySupervisor
    identity: opaque
    description: |
      Disposes of determinations and adverse actions: approve, deny, offer
      diversion, grant, deny or revoke extensions, grant good cause, and impose
      sanctions. Enforced as a different user from the determining Caseworker.
    permissions:
      read: "all entities"
      write: [Application, AssistanceCase, TimeLimitExtension, DiversionGrant, ComplianceEpisode]
  - name: WorkProgramSpecialist
    identity: opaque
    description: |
      Manages the work-requirement side: assigns and terminates activities,
      files and verifies participation, opens episodes, runs conciliation and
      cures, and requests, authorizes, releases and voids supportive services.
    permissions:
      read: "all entities"
      write: [WorkAssignment, ParticipationReport, ComplianceEpisode, SupportiveServiceAuthorization, TimeLimitExtension]
  - name: FiscalOfficer
    identity: opaque
    description: |
      Owns the money ledgers: drafts and establishes overpayments, posts recovery
      and reversal entries, writes off uncollectible claims, and voids supportive
      service authorizations. May not write off a claim it established.
    permissions:
      read: [AssistanceCase, TimeLimitMonth, Overpayment, RecoveryTransaction, SupportiveServiceAuthorization, WorkAssignment, Household, Application, FederalReportingPeriod, ComplianceEpisode, ParticipationReport, TimeLimitExtension, IncomeSource, ResourceItem, DiversionGrant]
      write: [Overpayment, RecoveryTransaction, SupportiveServiceAuthorization]
  - name: FraudInvestigator
    identity: opaque
    description: |
      Handles suspected client fraud: drafts and establishes fraud claims, refers
      them for investigation, and records the disposition that re-sizes recoupment.
      Has no authority over benefit determination or work assignments.
    permissions:
      read: "all entities"
      write: [Overpayment]
  - name: StateReportingAnalyst
    identity: opaque
    description: |
      Prepares and certifies the federal work participation report. Opens
      quarters, runs the rate and caseload-reduction-credit calculation, and
      certifies a quarter calculated by a different analyst.
    permissions:
      read: "all entities"
      write: [FederalReportingPeriod]
