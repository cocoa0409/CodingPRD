              as: ProviderAdmin
              as_user_id: "${prov_id}"
              captures: { code_id: $.data.id }
            - call: "POST /exam-sessions"
              payload: { candidate_id: "${cand_id}", exam_form_id: "${form_id}", access_code_id: "${code_id}", delivery_mode: "IN_PERSON", scheduled_start_at: "2026-09-10T09:00:00Z", testing_site_id: "${site_id}", proctor_id: "${proc_id}" }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
              captures: { sess_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T08:45:00Z" }
              as: PlatformAdmin
            - call: "POST /exam-sessions/${sess_id}/check-in"
              payload: { id_document_type: "GOVT_PHOTO_ID", id_document_expires_on: "2030-01-31", proctor_attestation: true }
              as: Proctor
              as_user_id: "${proc_id}"
