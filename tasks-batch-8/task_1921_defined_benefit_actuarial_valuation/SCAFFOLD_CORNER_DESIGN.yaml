    claim_type: correct_result
    grounds:
    - entities.AssetStatement.fields.market_value_end
    - calculations.asset_smoothing_corridor
    distinguishing_aspect: market_value_end satisfies the roll-forward invariant; a large gain clamps smoothed value at the 0.80 floor — covering both the invariant and the FLOOR branch.
    test_recipe:
      setup:
      - plan; statement mv_begin 50000, contributions 10000, benefits 3000, return 43000 -> mv_end 100000, expected 2500, gain 40500
      setup_api_calls:
      - call: POST /v1/plans
        payload:
          sponsor_name: Floor Co
