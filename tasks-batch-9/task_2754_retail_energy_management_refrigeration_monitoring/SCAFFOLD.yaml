scenario: |
  2754. Retail Energy Management & Refrigeration Monitoring (retail chain energy operations): building management system deployment with setpoint standards by climate zone and store format, demand monitoring with peak shaving strategies and demand response event participation, refrigeration case temperature monitoring with alarm thresholds, escalation and food safety documentation, lighting schedules, occupancy controls and daylight harvesting with override management, utility bill validation, rate schedule optimization and tariff switching analysis, equipment fault detection and diagnostics driving maintenance work orders before failure, energy performance benchmarking across stores with outlier investigation, capital retrofit prioritization with measured savings verification

domain_name: retail-energy-refrigeration-ops
api_prefix: "/energy-ops"

complexity_profile:
  primary_archetype: posture-driven gating
  secondary_archetype: pricing engine
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - scheduled_actions

  entity_topology: hybrid
  # Store is the operational hub (utility accounts, refrigeration cases, lighting
  # overrides, faults, retrofit projects hang off it), SetpointStandard is a flat
  # peer configuration table with a SELF-REFERENTIAL supersession chain, and
  # DemandInterval/UtilityBill/DemandResponseEvent form a metering satellite
  # cluster under UtilityAccount. Store.energy_posture is a derived aggregate over
  # four different child families and gates child mutations.

  state_machine_shape: posture_driven
  # Store.energy_posture (NORMAL/CONSTRAINED/CURTAILED/LOCKED) is derived from
  # refrigeration, demand-response, BMS and work-order children with a strict
  # precedence ladder and gates DR activation, override creation and commissioning.
  # Layered on top: Store.bms_status is CYCLIC (ACTIVE->DEGRADED->COMMISSIONING->
  # ACTIVE), TempExcursion is CYCLIC (ACKNOWLEDGED->OPEN on re-breach),
  # DemandResponseEvent carries PARALLEL dimensions (event_state x settlement_state)
  # and RetrofitProject BRANCHES (APPROVED -> {VERIFIED | SHORTFALL_REVIEW}).

  relationship_patterns:
    - one_to_many          # Store -> RefrigerationCase / LightingOverride / FaultDiagnostic / RetrofitProject
    - self_referential     # SetpointStandard.supersedes_standard_id -> SetpointStandard.id
    - cross_aggregate      # TempExcursion (refrigeration aggregate) gates DemandResponseEvent (metering aggregate) via Store.energy_posture
    - polymorphic          # MaintenanceWorkOrder window conflicts are resolved against the store reached through FaultDiagnostic.store_id

  role_model: segregation_of_duties
  # The user who recomputes a utility bill may not authorize its adjustment; the
  # user who proposes a retrofit may not approve it. Layered on peer ownership:
  # StoreManager/BmsGateway are entity_backed on Store and may only act on their
  # own store.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Store
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: code
        type: string
        source: input
        description: human-readable store code
        constraints: "unique across all Store rows; 1-32 chars"
      - name: climate_zone
        type: enum
        source: input
        description: ASHRAE-style climate zone used to select setpoint standards
        constraints: "one of HOT_HUMID | HOT_DRY | MIXED | MARINE | COLD"
      - name: store_format
        type: enum
        source: input
        description: retail format used together with climate_zone to select setpoint standards
        constraints: "one of SUPERCENTER | NEIGHBORHOOD | EXPRESS"
      - name: floor_area_sqft
        type: integer
        source: input
        description: conditioned floor area, denominator of the EUI benchmark
        constraints: "> 0"
      - name: blended_rate_usd_per_kwh
        type: number
        source: input
        description: blended electricity rate used to monetise retrofit savings
        default: 0.11
        constraints: "> 0; 4 decimal places"
      - name: bms_status
        type: enum
        source: system
        description: building-management-system deployment state; cyclic lifecycle
        default: NOT_DEPLOYED
        constraints: "one of NOT_DEPLOYED | COMMISSIONING | ACTIVE | DEGRADED"
      - name: active_standard_id
        type: string
        source: system
        description: "FK -> SetpointStandard.id; the setpoint standard bound at the last commissioning; null while NOT_DEPLOYED"
        default: null
      - name: energy_posture
        type: enum
        source: computed
        description: derived aggregate posture over refrigeration, demand-response, BMS and work-order children; gates child mutations (see calculations.store_energy_posture)
        default: NORMAL
        constraints: "one of NORMAL | CONSTRAINED | CURTAILED | LOCKED"
      - name: override_budget_kwh_month
        type: number
        source: input
        description: monthly lighting-override energy allowance in kWh
        default: 500.0
        constraints: ">= 0; 2 decimal places"
      - name: override_kwh_used_month
        type: number
        source: computed
        description: sum of projected_kwh over this store's LightingOverride rows with state IN {SCHEDULED, ACTIVE, EXPIRED} whose start_iso falls in the calendar month (UTC) of the request clock
        default: 0.00
      - name: verified_savings_kwh_ytd
        type: number
        source: computed
        description: kWh ledger; MUST equal SUM(RetrofitProject.measured_savings_kwh) over this store's projects in state VERIFIED
        default: 0.00
      - name: portfolio_realization_rate
        type: number
        source: computed
        description: mean realization_rate over this store's RetrofitProject rows in state IN {VERIFIED, SHORTFALL_REVIEW}, rounded to 4 dp; equals constant DEFAULT_REALIZATION_RATE when that set is empty
        default: 0.8500
      - name: eui_kbtu_per_sqft
        type: number
        source: computed
        description: energy-use intensity over the trailing-365-day validated-bill window (see calculations.store_eui_benchmark); null when no qualifying bill exists
        default: null
      - name: benchmark_percentile
        type: number
        source: computed
        description: percentile of this store's EUI inside its peer group (same climate_zone + store_format), 1 dp; null when eui_kbtu_per_sqft is null
        default: null
      - name: benchmark_outlier_flag
        type: boolean
        source: computed
        description: true when eui_kbtu_per_sqft >= outlier threshold derived from the peer median (see calculations.store_eui_benchmark)
        default: false
      - name: lighting_on_time_local
        type: string
        source: input
        description: daily lighting schedule ON time, local HH:MM
        default: "05:30"
      - name: lighting_off_time_local
        type: string
        source: input
        description: daily lighting schedule OFF time, local HH:MM
        default: "23:00"
      - name: daylight_harvest_enabled
        type: boolean
        source: input
        description: whether daylight harvesting dimming is enabled for the store
        default: true
      - name: occupancy_control_enabled
        type: boolean
        source: input
        description: whether occupancy-sensor lighting control is enabled for the store
        default: true
      - name: alarm_case_count
        type: integer
        source: computed
        description: count of this store's RefrigerationCase rows with monitoring_state == ALARM
        default: 0
      - name: urgent_work_order_count
        type: integer
        source: computed
        description: count of MaintenanceWorkOrder rows with priority == URGENT and state IN {OPEN, SCHEDULED} reached through FaultDiagnostic.store_id == this store
        default: 0

  - name: SetpointStandard
    parent: null
    common_fields: true
    kind: configuration
    fields:
      - name: climate_zone
        type: enum
        source: input
        description: climate zone this standard governs
        constraints: "one of HOT_HUMID | HOT_DRY | MIXED | MARINE | COLD"
      - name: store_format
        type: enum
        source: input
        description: store format this standard governs
        constraints: "one of SUPERCENTER | NEIGHBORHOOD | EXPRESS"
      - name: season
        type: enum
        source: input
        description: seasonal band this standard governs
        constraints: "one of SUMMER | WINTER"
      - name: cooling_setpoint_f
        type: number
        source: input
        description: mandated cooling setpoint in degrees F
        constraints: "60.0 <= value <= 85.0"
      - name: heating_setpoint_f
        type: number
        source: input
        description: mandated heating setpoint in degrees F
        constraints: "55.0 <= value <= 78.0; must be < cooling_setpoint_f"
      - name: deadband_f
        type: number
        source: input
        description: mandated deadband between heating and cooling in degrees F
        constraints: ">= 1.0"
      - name: lighting_lux_target
        type: integer
        source: input
        description: mandated sales-floor illuminance target in lux
        constraints: "> 0"
      - name: status
        type: enum
        source: system
        description: publication lifecycle of the standard
        default: DRAFT
        constraints: "one of DRAFT | PUBLISHED | SUPERSEDED"
      - name: revision
        type: integer
        source: system
        description: revision counter; 1 for a standard with no supersedes_standard_id, otherwise predecessor.revision + 1
        default: 1
      - name: supersedes_standard_id
        type: string
        source: input
        description: "FK -> SetpointStandard.id; self-referential supersession pointer; null for the first standard of a scope"
        default: null
      - name: published_at_iso
        type: datetime
        source: system
        description: logical-clock instant at which status became PUBLISHED; null while DRAFT
        default: null
      - name: published_by_user_id
        type: string
        source: system
        description: X-User-ID of the EnergyManager who published this standard
        default: null

  - name: UtilityAccount
    parent: Store
    common_fields: true
    kind: resource
    fields:
      - name: store_id
        type: string
        source: system
        description: "FK -> Store.id; taken from the creation path, not the body"
      - name: utility_name
        type: string
        source: input
        description: serving utility name
      - name: rate_schedule_code
        type: string
        source: input
        description: currently effective tariff code
      - name: rate_family
        type: enum
        source: input
        description: selects which peak-demand variant the bill recompute uses
        constraints: "one of TOU_DEMAND | FLAT_DEMAND"
      - name: demand_charge_per_kw
        type: number
        source: input
        description: USD per billable kW of demand
        constraints: "> 0; 2 decimal places"
      - name: rate_on_peak
        type: number
        source: input
        description: USD per kWh during on-peak intervals
        constraints: "> 0; 4 decimal places"
      - name: rate_off_peak
        type: number
        source: input
        description: USD per kWh during off-peak intervals
        constraints: "> 0; 4 decimal places"
      - name: ratchet_peak_kw
        type: number
        source: input
        description: highest billed demand of the trailing eleven months, input of the ratchet floor
        default: 0.0
        constraints: ">= 0; 1 decimal place"
      - name: candidate_rate_schedule_code
        type: string
        source: input
        description: alternate tariff evaluated by the tariff-comparison read and adopted by tariff-switch
        default: null
      - name: candidate_rate_family
        type: enum
        source: input
        description: rate family of the candidate tariff
        default: null
        constraints: "one of TOU_DEMAND | FLAT_DEMAND | null"
      - name: candidate_demand_charge_per_kw
        type: number
        source: input
        description: USD per billable kW under the candidate tariff
        default: null
      - name: candidate_rate_on_peak
        type: number
        source: input
        description: USD per on-peak kWh under the candidate tariff
        default: null
      - name: candidate_rate_off_peak
        type: number
        source: input
        description: USD per off-peak kWh under the candidate tariff
        default: null
      - name: tariff_state
        type: enum
        source: system
        description: STABLE when the effective tariff is settled; PENDING_SWITCH once a switch is scheduled and until it is applied
        default: STABLE
        constraints: "one of STABLE | PENDING_SWITCH"
      - name: tariff_switch_effective_from_iso
        type: datetime
        source: input
        description: instant from which the scheduled switch applies; null while STABLE
        default: null
      - name: tariff_locked_until_iso
        type: datetime
        source: system
        description: instant before which no further switch may be scheduled; set to effective instant + TARIFF_LOCK_DAYS when a scheduled switch is applied
        default: null
      - name: dr_enrollment_state
        type: enum
        source: system
        description: demand-response program enrollment; SUSPENDED after DR_OPTOUT_SUSPEND_COUNT system opt-outs
        default: ENROLLED
        constraints: "one of ENROLLED | SUSPENDED"
      - name: dr_optout_count
        type: integer
        source: computed
        description: count of this account's DemandResponseEvent rows with event_state == OPTED_OUT and opt_out_reason == FOOD_SAFETY_POSTURE
        default: 0
      - name: dr_incentive_accrued_usd
        type: number
        source: computed
        description: USD ledger; MUST equal SUM(DemandResponseEvent.incentive_usd) over this account's events with settlement_state == SETTLED
        default: 0.00

  - name: UtilityBill
    parent: UtilityAccount
    common_fields: true
    kind: resource
    fields:
      - name: utility_account_id
        type: string
        source: system
        description: "FK -> UtilityAccount.id; taken from the creation path, not the body"
      - name: period_start_iso
        type: datetime
        source: input
        description: inclusive start of the billing period
      - name: period_end_iso
        type: datetime
        source: input
        description: exclusive end of the billing period
        constraints: "> period_start_iso"
      - name: on_peak_kwh
        type: number
        source: input
        description: utility-stated on-peak consumption
        constraints: ">= 0"
      - name: off_peak_kwh
        type: number
        source: input
        description: utility-stated off-peak consumption
        constraints: ">= 0"
      - name: billed_kwh
        type: number
        source: input
        description: utility-stated total consumption; numerator of the EUI benchmark
        constraints: ">= 0"
      - name: billed_peak_kw
        type: number
        source: input
        description: utility-stated peak demand as printed on the bill (never used by the recompute, retained for evidence)
        constraints: ">= 0"
      - name: billed_amount_usd
        type: number
        source: input
        description: utility-stated invoice total
        constraints: ">= 0; 2 decimal places"
      - name: recomputed_amount_usd
        type: number
        source: computed
        description: independently recomputed invoice total (calculations.bill_recompute_total)
        default: null
      - name: recomputed_energy_cost_usd
        type: number
        source: computed
        description: step-1 energy component of the recompute
        default: null
      - name: recomputed_demand_cost_usd
        type: number
        source: computed
        description: step-3 demand component of the recompute
        default: null
      - name: recomputed_rider_cost_usd
        type: number
        source: computed
        description: step-5 rider component of the recompute
        default: null
      - name: recomputed_surcharge_usd
        type: number
        source: computed
        description: step-7 high-usage surcharge component of the recompute
        default: null
      - name: billable_demand_kw
        type: number
        source: computed
        description: ratchet-adjusted billable demand selected by calculations.period_peak_demand
        default: null
      - name: peak_basis
        type: enum
        source: computed
        description: which peak variant produced billable_demand_kw
        default: null
        constraints: "one of COINCIDENT_PEAK | ANYTIME_PEAK | null"
      - name: variance_pct
        type: number
        source: computed
        description: signed percentage by which billed_amount_usd exceeds recomputed_amount_usd, 2 dp
        default: null
      - name: validation_state
        type: enum
        source: system
        description: bill validation lifecycle
        default: RECEIVED
        constraints: "one of RECEIVED | VALIDATED | VARIANCE_FLAGGED | DISPUTED | ADJUSTED"
      - name: recomputed_by_user_id
        type: string
        source: system
        description: X-User-ID of the EnergyAnalyst who ran the recompute; segregation-of-duties counterparty
        default: null
      - name: dispute_reason
        type: string
        source: input
        description: free-text reason recorded when the bill is disputed
        default: null
      - name: adjusted_amount_usd
        type: number
        source: input
        description: negotiated final amount recorded when the dispute is settled
        default: null
      - name: adjusted_by_user_id
        type: string
        source: system
        description: X-User-ID of the EnergyManager who authorised the adjustment
        default: null

  - name: DemandInterval
    parent: UtilityAccount
    common_fields: false
    kind: event
    fields:
      - name: utility_account_id
        type: string
        source: system
        description: "FK -> UtilityAccount.id; taken from the creation path, not the body"
      - name: interval_start_iso
        type: datetime
        source: input
        description: inclusive start of the 15-minute metering interval
      - name: kw_demand
        type: number
        source: input
        description: average demand over the interval in kW
        constraints: ">= 0; 1 decimal place"
      - name: is_on_peak
        type: boolean
        source: input
        description: whether the utility classifies this interval as on-peak
      - name: is_dr_event_day
        type: boolean
        source: input
        description: whether this interval belongs to a demand-response event day (excluded from baseline candidates)
        default: false

  - name: DemandResponseEvent
    parent: UtilityAccount
    common_fields: true
    kind: resource
    fields:
      - name: utility_account_id
        type: string
        source: system
        description: "FK -> UtilityAccount.id; taken from the creation path, not the body"
      - name: program_code
        type: string
        source: input
        description: utility demand-response program identifier
      - name: curtailment_start_iso
        type: datetime
        source: input
        description: inclusive start of the curtailment window
      - name: curtailment_end_iso
        type: datetime
        source: input
        description: inclusive end of the curtailment window
        constraints: "> curtailment_start_iso"
      - name: target_reduction_kw
        type: number
        source: input
        description: contracted reduction obligation in kW
        constraints: "> 0; 1 decimal place"
      - name: baseline_kw
        type: number
        source: computed
        description: computed at notify from historical intervals (calculations.dr_baseline_kw)
        default: null
      - name: total_reduction_kwh
        type: number
        source: computed
        description: delivered reduction, rounded per interval then summed (calculations.dr_event_settlement)
        default: null
      - name: performance_pct
        type: number
        source: computed
        description: delivered reduction as a percentage of the contracted kWh obligation, 1 dp
        default: null
      - name: incentive_usd
        type: number
        source: computed
        description: settlement credit; contributes to UtilityAccount.dr_incentive_accrued_usd while settlement_state == SETTLED
        default: 0.00
      - name: penalty_usd
        type: number
        source: computed
        description: settlement charge levied when performance_pct < PERF_FLOOR_PCT
        default: 0.00
      - name: event_state
        type: enum
        source: system
        description: participation dimension; advances independently of settlement_state
        default: SCHEDULED
        constraints: "one of SCHEDULED | NOTIFIED | ACTIVE | COMPLETED | OPTED_OUT"
      - name: settlement_state
        type: enum
        source: system
        description: money dimension; advances independently of event_state
        default: PENDING
        constraints: "one of PENDING | SETTLED | REVERSED"
      - name: notified_at_iso
        type: datetime
        source: system
        description: logical-clock instant of the notify call
        default: null
      - name: opt_out_reason
        type: enum
        source: system
        description: why the event was abandoned
        default: null
        constraints: "one of FOOD_SAFETY_POSTURE | null"
      - name: reversal_reason
        type: string
        source: input
        description: free-text justification recorded when a settlement is reversed
        default: null

  - name: RefrigerationCase
    parent: Store
    common_fields: true
    kind: resource
    fields:
      - name: store_id
        type: string
        source: system
        description: "FK -> Store.id; taken from the creation path, not the body"
      - name: case_code
        type: string
        source: input
        description: case identifier on the store floor
        constraints: "unique within the owning store"
      - name: case_type
        type: enum
        source: input
        description: temperature class of the case
        constraints: "one of MEDIUM_TEMP | LOW_TEMP | ICE_CREAM"
      - name: product_class
        type: enum
        source: input
        description: product family held in the case, recorded on food-safety documentation
        constraints: "one of DAIRY | MEAT | FROZEN | PRODUCE"
      - name: alarm_high_f
        type: number
        source: input
        description: inclusive high alarm threshold in degrees F
        constraints: "1 decimal place; > alarm_low_f"
      - name: alarm_low_f
        type: number
        source: input
        description: inclusive low alarm threshold in degrees F
        constraints: "1 decimal place"
      - name: product_value_usd
        type: number
        source: input
        description: retail value of product held in the case, copied onto each excursion
        constraints: ">= 0; 2 decimal places"
      - name: monitoring_state
        type: enum
        source: system
        description: alarm-monitoring dimension of the case
        default: ARMED
        constraints: "one of ARMED | ALARM | BYPASSED"
      - name: consecutive_breach_count
        type: integer
        source: computed
        description: length of the current unbroken run of breaching readings; reset to 0 by a non-breaching reading, by rearming and by excursion closure
        default: 0
      - name: last_reading_temp_f
        type: number
        source: computed
        description: temp_f of the most recent ingested reading
        default: null
      - name: last_reading_iso
        type: datetime
        source: computed
        description: logical-clock instant of the most recent ingested reading
        default: null

  - name: TempExcursion
    parent: RefrigerationCase
    common_fields: true
    kind: resource
    fields:
      - name: case_id
        type: string
        source: system
        description: "FK -> RefrigerationCase.id; set by the cascade that opens the excursion"
      - name: first_breach_iso
        type: datetime
        source: system
        description: reading instant of the first breach in the run that opened this excursion
      - name: last_breach_iso
        type: datetime
        source: system
        description: reading instant of the most recent breach attributed to this excursion
      - name: peak_temp_f
        type: number
        source: computed
        description: maximum temp_f over all breaching readings attributed to this excursion
      - name: exposure_minutes
        type: integer
        source: computed
        description: whole minutes between first_breach_iso and last_breach_iso
        default: 0
      - name: state
        type: enum
        source: system
        description: food-safety excursion lifecycle; cyclic between ACKNOWLEDGED and OPEN
        default: OPEN
        constraints: "one of OPEN | ACKNOWLEDGED | ESCALATED | DISPOSITION_REQUIRED | CLOSED"
      - name: product_value_usd
        type: number
        source: system
        description: copy of RefrigerationCase.product_value_usd at the instant the excursion opened
      - name: mandatory_disposition
        type: enum
        source: computed
        description: DISCARD once exposure_minutes >= DISPOSITION_MINUTES, otherwise NONE
        default: NONE
        constraints: "one of NONE | DISCARD"
      - name: acknowledged_by_user_id
        type: string
        source: system
        description: X-User-ID of the StoreManager who acknowledged the excursion
        default: null
      - name: disposition
        type: enum
        source: input
        description: documented product disposition
        default: null
        constraints: "one of RETAIN | DISCARD | null"
      - name: corrective_action_note
        type: string
        source: input
        description: food-safety corrective action narrative
        default: null
      - name: documented_by_user_id
        type: string
        source: system
        description: X-User-ID of the actor who documented the disposition
        default: null
      - name: documented_at_iso
        type: datetime
        source: system
        description: logical-clock instant of documentation
        default: null
      - name: closed_at_iso
        type: datetime
        source: system
        description: logical-clock instant of closure
        default: null

  - name: LightingOverride
    parent: Store
    common_fields: true
    kind: resource
    fields:
      - name: store_id
        type: string
        source: system
        description: "FK -> Store.id; taken from the creation path, not the body"
      - name: zone
        type: enum
        source: input
        description: lighting zone the override applies to; overlap is evaluated per (store_id, zone)
        constraints: "one of SALES_FLOOR | PARKING | BACKROOM | EXTERIOR_SIGN"
      - name: override_type
        type: enum
        source: input
        description: which automatic control the override defeats
        constraints: "one of SCHEDULE_EXTEND | DAYLIGHT_HARVEST_DISABLE | OCCUPANCY_DISABLE"
      - name: start_iso
        type: datetime
        source: input
        description: inclusive start of the override window
      - name: end_iso
        type: datetime
        source: input
        description: exclusive end of the override window
        constraints: "> start_iso; window duration <= OVERRIDE_MAX_HOURS"
      - name: zone_load_kw
        type: number
        source: input
        description: connected lighting load of the zone in kW
        constraints: "> 0; 1 decimal place"
      - name: projected_kwh
        type: number
        source: computed
        description: round(zone_load_kw * window duration in hours, 2); charged against Store.override_budget_kwh_month
      - name: state
        type: enum
        source: system
        description: override lifecycle; SCHEDULED/ACTIVE advance on the logical clock
        default: SCHEDULED
        constraints: "one of SCHEDULED | ACTIVE | EXPIRED | REVOKED"
      - name: requested_reason
        type: string
        source: input
        description: business justification for the override
      - name: revoked_by_user_id
        type: string
        source: system
        description: X-User-ID of the revoking actor; null when revoke_source == SYSTEM_POSTURE
        default: null
      - name: revoke_source
        type: enum
        source: system
        description: whether the revocation was a user action or a posture cascade
        default: null
        constraints: "one of USER | SYSTEM_POSTURE | null"

  - name: FaultDiagnostic
    parent: Store
    common_fields: true
    kind: resource
    fields:
      - name: store_id
        type: string
        source: system
        description: "FK -> Store.id; taken from the creation path, not the body"
      - name: equipment_ref
        type: string
        source: input
        description: equipment tag the fault was raised against; work-order window conflicts are evaluated per equipment_ref
      - name: equipment_class
        type: enum
        source: input
        description: equipment family; REFRIGERATION attracts the food-safety weight in the fault score
        constraints: "one of REFRIGERATION | HVAC | LIGHTING"
      - name: fault_code
        type: string
        source: input
        description: FDD rule identifier
      - name: severity
        type: enum
        source: input
        description: diagnostic severity band
        constraints: "one of INFO | MINOR | MAJOR | CRITICAL"
      - name: occurrence_count
        type: integer
        source: input
        description: how many times the FDD rule has fired for this equipment
        constraints: ">= 1"
      - name: affected_load_kw
        type: number
        source: input
        description: connected load affected by the fault in kW
        constraints: ">= 0; 1 decimal place"
      - name: fault_score
        type: number
        source: computed
        description: weighted diagnostic score, 1 dp (calculations.fault_score)
      - name: state
        type: enum
        source: system
        description: diagnostic lifecycle
        default: DETECTED
        constraints: "one of DETECTED | TRIAGED | SUPPRESSED | RESOLVED"
      - name: detected_at_iso
        type: datetime
        source: system
        description: logical-clock instant at which the fault was reported
      - name: triaged_by_user_id
        type: string
        source: system
        description: X-User-ID of the MaintenanceTech who triaged the fault
        default: null

  - name: MaintenanceWorkOrder
    parent: FaultDiagnostic
    common_fields: true
    kind: resource
    fields:
      - name: fault_id
        type: string
        source: system
        description: "FK -> FaultDiagnostic.id; set by the triage cascade that creates the work order"
      - name: priority
        type: enum
        source: computed
        description: URGENT when the originating fault_score >= WORK_ORDER_URGENT_THRESHOLD, otherwise ROUTINE
        constraints: "one of URGENT | ROUTINE"
      - name: state
        type: enum
        source: system
        description: work-order lifecycle
        default: OPEN
        constraints: "one of OPEN | SCHEDULED | COMPLETED"
      - name: scheduled_start_iso
        type: datetime
        source: input
        description: inclusive start of the maintenance window
        default: null
      - name: scheduled_end_iso
        type: datetime
        source: input
        description: inclusive end of the maintenance window
        default: null
      - name: completed_at_iso
        type: datetime
        source: system
        description: logical-clock instant of completion
        default: null
      - name: completion_note
        type: string
        source: input
        description: technician completion narrative
        default: null

  - name: RetrofitProject
    parent: Store
    common_fields: true
    kind: resource
    fields:
      - name: store_id
        type: string
        source: system
        description: "FK -> Store.id; taken from the creation path, not the body"
      - name: measure_type
        type: enum
        source: input
        description: capital measure being proposed
        constraints: "one of LED_RETROFIT | CASE_DOORS | ECM_MOTORS | HVAC_RTU_REPLACEMENT | EMS_UPGRADE"
      - name: capex_usd
        type: number
        source: input
        description: installed capital cost
        constraints: "> 0; 2 decimal places"
      - name: projected_annual_savings_kwh
        type: number
        source: input
        description: engineering estimate of annual savings
        constraints: "> 0; 2 decimal places"
      - name: annual_savings_usd
        type: number
        source: computed
        description: round(projected_annual_savings_kwh * Store.blended_rate_usd_per_kwh, 2)
      - name: payback_years
        type: number
        source: computed
        description: payback under the variant selected by priority_basis, 2 dp
      - name: priority_score
        type: number
        source: computed
        description: ranking score under the variant selected by priority_basis, 1 dp (calculations.retrofit_priority_score)
      - name: priority_basis
        type: enum
        source: computed
        description: which priority variant produced priority_score
        default: SIMPLE_PAYBACK
        constraints: "one of SIMPLE_PAYBACK | RISK_ADJUSTED"
      - name: state
        type: enum
        source: system
        description: capital-project lifecycle; branches at measurement and cycles back from SHORTFALL_REVIEW
        default: PROPOSED
        constraints: "one of PROPOSED | APPROVED | VERIFIED | SHORTFALL_REVIEW | REJECTED"
      - name: escalated_review
        type: boolean
        source: computed
        description: set true by the posture cascade when the store leaves NORMAL while this project is PROPOSED
        default: false
      - name: proposed_by_user_id
        type: string
        source: system
        description: X-User-ID of the proposing EnergyManager; segregation-of-duties counterparty
      - name: approved_by_user_id
        type: string
        source: system
        description: X-User-ID of the approving EnergyManager
        default: null
      - name: install_completed_iso
        type: datetime
        source: input
        description: instant the measure finished installation, start of the M&V post period
        default: null
      - name: baseline_period_kwh
        type: number
        source: input
        description: metered consumption of the pre-installation baseline period
        default: null
      - name: post_period_kwh
        type: number
        source: input
        description: metered consumption of the post-installation measurement period
        default: null
      - name: mv_period_days
        type: integer
        source: input
        description: length of the M&V post period in days
        default: null
      - name: adjusted_baseline_kwh
        type: number
        source: computed
        description: weather-normalised baseline (calculations.measured_savings_verification)
        default: null
      - name: measured_savings_kwh
        type: number
        source: computed
        description: verified savings; contributes to Store.verified_savings_kwh_ytd while state == VERIFIED
        default: null
      - name: realization_rate
        type: number
        source: computed
        description: measured savings over prorated projection, 4 dp
        default: null
      - name: revocation_reason
        type: string
        source: input
        description: free-text justification recorded when a verification is revoked
        default: null

# =============================================================================
# 1.2 State Machine Table
#   Every transition carries a stable `id:`; §1.8/§1.9 ground on
#   `state_machines.<Entity>.transitions.<id>`.
#   A `from:` list means the transition is legal from each listed state with
#   identical preconditions and side effects.
# =============================================================================
state_machines:
  - entity: Store
    dimension: bms_status
    initial_state: NOT_DEPLOYED
    terminal_states: []
    transitions:
      - id: bms_commission_initial
        from: NOT_DEPLOYED
        to: COMMISSIONING
        trigger: "POST /energy-ops/stores/{id}/bms-commissioning"
        actor: EnergyManager
        preconditions:
          - "body standard_id resolves to a SetpointStandard row"
          - "that standard has status == PUBLISHED"
          - "that standard has climate_zone == store.climate_zone AND store_format == store.store_format"
          - "store.energy_posture != LOCKED"
          - "body expected_store_version == store.version"
        side_effects:
          - "sets Store.active_standard_id = body standard_id"
          - "increments Store.version by 1"
          - "refreshes Store.updated_at"
      - id: bms_activate
        from: COMMISSIONING
        to: ACTIVE
        trigger: "POST /energy-ops/stores/{id}/bms-activation"
        actor: EnergyManager
        preconditions:
          - "store.bms_status == COMMISSIONING"
          - "the SetpointStandard referenced by store.active_standard_id still has status == PUBLISHED (version-pinning re-validation; a standard that became SUPERSEDED between commissioning and activation is rejected with ERR_STANDARD_NOT_PUBLISHED)"
        side_effects:
          - "recomputes Store.energy_posture per calculations.store_energy_posture"
          - "increments Store.version by 1"
      - id: bms_recommission
        from: DEGRADED
        to: COMMISSIONING
        trigger: "POST /energy-ops/stores/{id}/bms-commissioning"
        actor: EnergyManager
        preconditions:
          - "same preconditions as bms_commission_initial"
        side_effects:
          - "sets Store.active_standard_id = body standard_id"
          - "increments Store.version by 1"
        note: "closes the ACTIVE -> DEGRADED -> COMMISSIONING -> ACTIVE cycle"
      - id: bms_restandardise
        from: ACTIVE
        to: COMMISSIONING
        trigger: "POST /energy-ops/stores/{id}/bms-commissioning"
        actor: EnergyManager
        preconditions:
          - "same preconditions as bms_commission_initial"
        side_effects:
          - "supersedes the prior standard binding: Store.active_standard_id = body standard_id"
          - "increments Store.version by 1"
        note: "the legitimate-supersede write guarded by concurrency_rules.store-commissioning-stale-version"
      - id: bms_degrade_on_urgent_work_order
        from: ACTIVE
        to: DEGRADED
        trigger: "system cascade, link 2 of the POST /energy-ops/fault-diagnostics/{id}/triage chain"
        actor: system
        preconditions:
          - "store.bms_status == ACTIVE"
          - "the work order created by link 1 has priority == URGENT and its fault has equipment_class == REFRIGERATION"
        side_effects:
          - "sets Store.bms_status = DEGRADED"
          - "link 3: recomputes Store.energy_posture, which raises NORMAL -> CONSTRAINED"
          - "increments Store.version by 1"
      - id: bms_degrade_on_standard_superseded
        from: ACTIVE
        to: DEGRADED
        trigger: "system cascade, link 2 of the POST /energy-ops/setpoint-standards/{id}/publish chain"
        actor: system
        preconditions:
          - "store.bms_status == ACTIVE"
          - "store.active_standard_id == the standard that link 1 moved to SUPERSEDED"
        side_effects:
          - "sets Store.bms_status = DEGRADED (deployed setpoints no longer match the governing standard)"
          - "link 3: recomputes Store.energy_posture, which raises NORMAL -> CONSTRAINED"
          - "increments Store.version by 1"

  - entity: Store
    dimension: energy_posture
    initial_state: NORMAL
    terminal_states: []
    transitions:
      - id: posture_raise_constrained
        from: NORMAL
        to: CONSTRAINED
        trigger: "system recompute after any mutation that changes an input of calculations.store_energy_posture"
        actor: system
        preconditions:
          - "no TempExcursion of this store is in ESCALATED or DISPOSITION_REQUIRED"
          - "no DemandResponseEvent of this store's account is in ACTIVE"
          - "at least one of: a RefrigerationCase of this store is in ALARM; store.bms_status == DEGRADED; store.urgent_work_order_count >= 1"
        side_effects:
          - "sets Store.energy_posture = CONSTRAINED"
          - "every LightingOverride of this store with state == ACTIVE and override_type == SCHEDULE_EXTEND is revoked (revoke_source = SYSTEM_POSTURE)"
          - "every RetrofitProject of this store with state == PROPOSED gets escalated_review = true"
      - id: posture_raise_locked
        from: [NORMAL, CONSTRAINED, CURTAILED]
        to: LOCKED
        trigger: "system recompute after a TempExcursion of this store enters ESCALATED or DISPOSITION_REQUIRED"
        actor: system
        preconditions:
          - "at least one TempExcursion reached through RefrigerationCase.store_id == this store is in state ESCALATED or DISPOSITION_REQUIRED"
        side_effects:
          - "sets Store.energy_posture = LOCKED"
          - "every DemandResponseEvent of this store's UtilityAccount with event_state == NOTIFIED moves to OPTED_OUT with opt_out_reason = FOOD_SAFETY_POSTURE"
          - "every LightingOverride of this store with state == ACTIVE and override_type == SCHEDULE_EXTEND is revoked (revoke_source = SYSTEM_POSTURE)"
          - "every RetrofitProject of this store with state == PROPOSED gets escalated_review = true"
      - id: posture_raise_curtailed
        from: [NORMAL, CONSTRAINED]
        to: CURTAILED
        trigger: "system recompute after POST /energy-ops/demand-response-events/{id}/activate"
        actor: system
        preconditions:
          - "no TempExcursion of this store is in ESCALATED or DISPOSITION_REQUIRED"
          - "at least one DemandResponseEvent of this store's account has event_state == ACTIVE"
        side_effects:
          - "sets Store.energy_posture = CURTAILED"
          - "every LightingOverride of this store with state == ACTIVE and override_type == SCHEDULE_EXTEND is revoked (revoke_source = SYSTEM_POSTURE)"
      - id: posture_release_from_curtailed
        from: CURTAILED
        to: NORMAL
        trigger: "system recompute during the POST /energy-ops/_clock/set_current_utc sweep that completes the last ACTIVE demand-response event"
        actor: system
        preconditions:
          - "no DemandResponseEvent of this store's account remains in ACTIVE"
          - "no RefrigerationCase of this store is in ALARM, store.bms_status != DEGRADED, store.urgent_work_order_count == 0"
        side_effects:
          - "sets Store.energy_posture = NORMAL"
      - id: posture_release_from_locked
        from: LOCKED
        to: CONSTRAINED
        trigger: "system recompute after POST /energy-ops/excursions/{id}/close"
        actor: system
        preconditions:
          - "no TempExcursion of this store remains in ESCALATED or DISPOSITION_REQUIRED"
          - "no DemandResponseEvent of this store's account is ACTIVE"
          - "at least one of the CONSTRAINED inputs still holds (a case in ALARM, bms_status == DEGRADED, or urgent_work_order_count >= 1)"
        side_effects:
          - "sets Store.energy_posture = CONSTRAINED"
      - id: posture_release_to_normal
        from: [CONSTRAINED, LOCKED]
        to: NORMAL
        trigger: "system recompute after the last posture input clears (excursion close, case rearm, work-order completion or bms reactivation)"
        actor: system
        preconditions:
          - "none of the LOCKED, CURTAILED or CONSTRAINED inputs holds"
        side_effects:
          - "sets Store.energy_posture = NORMAL"
          - "already-revoked LightingOverride rows are NOT restored (revocation is not reversible)"

  - entity: SetpointStandard
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - id: standard_publish
        from: DRAFT
        to: PUBLISHED
        trigger: "POST /energy-ops/setpoint-standards/{id}/publish"
        actor: EnergyManager
        preconditions:
          - "standard.status == DRAFT"
          - "if standard.supersedes_standard_id != null, that predecessor has status == PUBLISHED"
        side_effects:
          - "sets status = PUBLISHED, published_at_iso = clock, published_by_user_id = X-User-ID"
          - "link 1 (cascade): when supersedes_standard_id != null, the predecessor moves to SUPERSEDED"
          - "link 2 (cascade): every Store whose active_standard_id == the predecessor and whose bms_status == ACTIVE moves to DEGRADED"
          - "link 3 (cascade): each such Store recomputes energy_posture, raising NORMAL -> CONSTRAINED"
      - id: standard_superseded
        from: PUBLISHED
        to: SUPERSEDED
        trigger: "system cascade, link 1 of the standard_publish chain of a successor standard"
        actor: system
        preconditions:
          - "the successor standard names this row in supersedes_standard_id and is being published"
        side_effects:
          - "sets status = SUPERSEDED"
          - "increments version by 1"

  - entity: UtilityBill
    initial_state: RECEIVED
    terminal_states: [VALIDATED, ADJUSTED]
    transitions:
      - id: bill_recompute_validated
        from: RECEIVED
        to: VALIDATED
        trigger: "POST /energy-ops/utility-bills/{id}/recompute"
        actor: EnergyAnalyst
        preconditions:
          - "bill.validation_state == RECEIVED"
          - "at least one DemandInterval of the account has interval_start_iso in [period_start_iso, period_end_iso)"
          - "abs(variance_pct) <= BILL_VARIANCE_TOLERANCE_PCT"
        side_effects:
          - "writes recomputed_* components, billable_demand_kw, peak_basis, variance_pct per calculations.bill_recompute_total"
          - "sets recomputed_by_user_id = X-User-ID"
          - "makes the bill eligible for calculations.store_eui_benchmark"
      - id: bill_recompute_flagged
        from: RECEIVED
        to: VARIANCE_FLAGGED
        trigger: "POST /energy-ops/utility-bills/{id}/recompute"
        actor: EnergyAnalyst
        preconditions:
          - "bill.validation_state == RECEIVED"
          - "at least one DemandInterval of the account has interval_start_iso in [period_start_iso, period_end_iso)"
          - "abs(variance_pct) > BILL_VARIANCE_TOLERANCE_PCT"
        side_effects:
          - "writes the same recomputed_* fields as bill_recompute_validated"
          - "sets recomputed_by_user_id = X-User-ID"
      - id: bill_dispute
        from: VARIANCE_FLAGGED
        to: DISPUTED
        trigger: "POST /energy-ops/utility-bills/{id}/dispute"
        actor: EnergyAnalyst
        preconditions:
          - "bill.validation_state == VARIANCE_FLAGGED"
        side_effects:
          - "stores dispute_reason"
      - id: bill_adjust
        from: DISPUTED
        to: ADJUSTED
        trigger: "POST /energy-ops/utility-bills/{id}/adjustment"
        actor: EnergyManager
        preconditions:
          - "bill.validation_state == DISPUTED"
          - "X-User-ID != bill.recomputed_by_user_id (segregation of duties)"
          - "the owning UtilityAccount has tariff_state == STABLE"
        side_effects:
          - "stores adjusted_amount_usd and adjusted_by_user_id"
          - "makes the bill eligible for calculations.store_eui_benchmark"

  - entity: DemandResponseEvent
    dimension: event_state
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, OPTED_OUT]
    transitions:
      - id: dr_notify
        from: SCHEDULED
        to: NOTIFIED
        trigger: "POST /energy-ops/demand-response-events/{id}/notify"
        actor: EnergyManager
        preconditions:
          - "event.event_state == SCHEDULED"
          - "the owning UtilityAccount has dr_enrollment_state == ENROLLED"
          - "calculations.dr_baseline_kw finds at least one candidate interval"
        side_effects:
          - "writes baseline_kw and notified_at_iso"
      - id: dr_activate
        from: NOTIFIED
        to: ACTIVE
        trigger: "POST /energy-ops/demand-response-events/{id}/activate"
        actor: EnergyManager
        preconditions:
          - "event.event_state == NOTIFIED"
          - "clock >= curtailment_start_iso"
          - "the owning account's Store has energy_posture IN {NORMAL, CONSTRAINED}"
        side_effects:
          - "recomputes the Store's energy_posture, raising it to CURTAILED"
      - id: dr_clock_complete
        from: ACTIVE
        to: COMPLETED
        trigger: "POST /energy-ops/_clock/set_current_utc sweep"
        actor: system
        preconditions:
          - "event.event_state == ACTIVE"
          - "new clock value >= curtailment_end_iso"
        side_effects:
          - "recomputes the Store's energy_posture, releasing CURTAILED"
          - "leaves settlement_state untouched (parallel dimension)"
      - id: dr_posture_optout
        from: NOTIFIED
        to: OPTED_OUT
        trigger: "system cascade, link 3 of the POST /energy-ops/refrigeration-cases/{id}/readings escalation chain"
        actor: system
        preconditions:
          - "event.event_state == NOTIFIED"
          - "the owning account's Store just moved to energy_posture == LOCKED"
        side_effects:
          - "sets opt_out_reason = FOOD_SAFETY_POSTURE"
          - "link 4: increments UtilityAccount.dr_optout_count; when it reaches DR_OPTOUT_SUSPEND_COUNT the account's dr_enrollment_state becomes SUSPENDED"

  - entity: DemandResponseEvent
    dimension: settlement_state
    initial_state: PENDING
    terminal_states: [REVERSED]
    transitions:
      - id: dr_settle
        from: PENDING
        to: SETTLED
        trigger: "POST /energy-ops/demand-response-events/{id}/settle"
        actor: EnergyAnalyst
        preconditions:
          - "event.settlement_state == PENDING"
          - "event.event_state == COMPLETED"
          - "clock >= curtailment_end_iso"
        side_effects:
          - "writes total_reduction_kwh, performance_pct, incentive_usd, penalty_usd per calculations.dr_event_settlement"
          - "credits UtilityAccount.dr_incentive_accrued_usd by exactly incentive_usd"
          - "leaves event_state == COMPLETED (parallel dimension)"
      - id: dr_reverse_settlement
        from: SETTLED
        to: REVERSED
        trigger: "POST /energy-ops/demand-response-events/{id}/reverse-settlement"
        actor: EnergyManager
        preconditions:
          - "event.settlement_state == SETTLED"
        side_effects:
          - "debits UtilityAccount.dr_incentive_accrued_usd by exactly the event's incentive_usd"
          - "retains incentive_usd and performance_pct as evidence; stores reversal_reason"
          - "leaves event_state == COMPLETED (parallel dimension)"

  - entity: RefrigerationCase
    initial_state: ARMED
    terminal_states: []
    transitions:
      - id: case_alarm_on_breach_run
        from: ARMED
        to: ALARM
        trigger: "POST /energy-ops/refrigeration-cases/{id}/readings"
        actor: BmsGateway
        preconditions:
          - "case.monitoring_state == ARMED"
          - "the ingested reading breaches per calculations.excursion_exposure (temp_f >= alarm_high_f OR temp_f <= alarm_low_f)"
          - "consecutive_breach_count after this reading >= GRACE_READINGS"
          - "no TempExcursion of this case is in a non-CLOSED state"
        side_effects:
          - "link 1: creates a TempExcursion in OPEN with first_breach_iso = the reading instant of the first breach in the current run, product_value_usd copied from the case"
          - "link 2: recomputes the owning Store's energy_posture, raising NORMAL -> CONSTRAINED"
      - id: case_rearm_on_close
        from: ALARM
        to: ARMED
        trigger: "system cascade from POST /energy-ops/excursions/{id}/close"
        actor: system
        preconditions:
          - "no TempExcursion of this case remains in a non-CLOSED state"
        side_effects:
          - "resets consecutive_breach_count to 0"
          - "recomputes the owning Store's energy_posture"
      - id: case_bypass
        from: ARMED
        to: BYPASSED
        trigger: "POST /energy-ops/refrigeration-cases/{id}/monitoring-state with target_state = BYPASSED"
        actor: MaintenanceTech
        preconditions:
          - "case.monitoring_state == ARMED (bypassing a case in ALARM is rejected)"
        side_effects:
          - "resets consecutive_breach_count to 0"
          - "subsequent readings are stored on the case but excluded from excursion evaluation"
      - id: case_rearm
        from: BYPASSED
        to: ARMED
        trigger: "POST /energy-ops/refrigeration-cases/{id}/monitoring-state with target_state = ARMED"
        actor: MaintenanceTech
        preconditions:
          - "case.monitoring_state == BYPASSED"
        side_effects:
          - "resets consecutive_breach_count to 0"

  - entity: TempExcursion
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - id: excursion_acknowledge
        from: OPEN
        to: ACKNOWLEDGED
        trigger: "POST /energy-ops/excursions/{id}/acknowledge"
        actor: StoreManager
        preconditions:
          - "excursion.state == OPEN"
          - "X-User-ID == the store id reached through RefrigerationCase.store_id"
        side_effects:
          - "sets acknowledged_by_user_id = X-User-ID"
      - id: excursion_rebreach
        from: ACKNOWLEDGED
        to: OPEN
        trigger: "POST /energy-ops/refrigeration-cases/{id}/readings with a further breaching reading"
        actor: system
        preconditions:
          - "excursion.state == ACKNOWLEDGED"
          - "the new reading breaches and exposure_minutes < ESCALATE_MINUTES after the update"
        side_effects:
          - "reopens the excursion (cyclic ACKNOWLEDGED -> OPEN)"
          - "updates last_breach_iso, peak_temp_f and exposure_minutes"
        note: "closes the OPEN -> ACKNOWLEDGED -> OPEN cycle"
      - id: excursion_escalate
        from: [OPEN, ACKNOWLEDGED]
        to: ESCALATED
        trigger: "POST /energy-ops/refrigeration-cases/{id}/readings with a breaching reading"
        actor: system
        preconditions:
          - "exposure_minutes after the update >= ESCALATE_MINUTES"
          - "exposure_minutes after the update < DISPOSITION_MINUTES"
        side_effects:
          - "link 2: recomputes the owning Store's energy_posture, raising it to LOCKED"
          - "link 3: every DemandResponseEvent of the store's account in NOTIFIED moves to OPTED_OUT"
          - "link 4: UtilityAccount.dr_optout_count increments and dr_enrollment_state becomes SUSPENDED at DR_OPTOUT_SUSPEND_COUNT"
      - id: excursion_disposition_required
        from: [OPEN, ACKNOWLEDGED, ESCALATED]
        to: DISPOSITION_REQUIRED
        trigger: "POST /energy-ops/refrigeration-cases/{id}/readings with a breaching reading"
        actor: system
        preconditions:
          - "exposure_minutes after the update >= DISPOSITION_MINUTES"
        side_effects:
          - "sets mandatory_disposition = DISCARD"
          - "keeps the owning Store at energy_posture LOCKED"
      - id: excursion_close
        from: [OPEN, ACKNOWLEDGED, ESCALATED, DISPOSITION_REQUIRED]
        to: CLOSED
        trigger: "POST /energy-ops/excursions/{id}/close"
        actor: FoodSafetyOfficer
        preconditions:
          - "excursion.state != CLOSED"
          - "disposition != null AND corrective_action_note != null (food-safety documentation complete)"
        side_effects:
          - "sets closed_at_iso = clock"
          - "cascade: the owning RefrigerationCase rearms (ALARM -> ARMED) when no other non-CLOSED excursion remains, resetting consecutive_breach_count"
          - "cascade: the owning Store recomputes energy_posture"

  - entity: LightingOverride
    initial_state: SCHEDULED
    terminal_states: [EXPIRED, REVOKED]
    transitions:
      - id: override_created_active
        from: SCHEDULED
        to: ACTIVE
        trigger: "POST /energy-ops/stores/{id}/lighting-overrides when start_iso <= clock < end_iso"
        actor: StoreManager
        preconditions:
          - "start_iso <= clock < end_iso at creation time"
        side_effects:
          - "the row is persisted directly in ACTIVE"
          - "charges projected_kwh against Store.override_kwh_used_month"
        note: "a window entirely in the future is persisted in SCHEDULED instead, and a SCHEDULED row is charged against Store.override_kwh_used_month exactly as an ACTIVE one is, per calculations.lighting_override_projection step 3"
      - id: override_clock_activate
        from: SCHEDULED
        to: ACTIVE
        trigger: "POST /energy-ops/_clock/set_current_utc sweep"
        actor: system
        preconditions:
          - "new clock value >= start_iso AND < end_iso"
        side_effects:
          - "sets state = ACTIVE"
      - id: override_clock_expire
        from: [SCHEDULED, ACTIVE]
        to: EXPIRED
        trigger: "POST /energy-ops/_clock/set_current_utc sweep"
        actor: system
        preconditions:
          - "new clock value >= end_iso"
        side_effects:
          - "sets state = EXPIRED"
          - "leaves projected_kwh charged against Store.override_kwh_used_month for the calendar month"
      - id: override_revoke_user
        from: [SCHEDULED, ACTIVE]
        to: REVOKED
        trigger: "POST /energy-ops/lighting-overrides/{id}/revoke"
        actor: EnergyManager
        preconditions:
          - "override.state IN {SCHEDULED, ACTIVE}"
        side_effects:
          - "sets revoke_source = USER and revoked_by_user_id = X-User-ID"
          - "releases projected_kwh from Store.override_kwh_used_month"
      - id: override_revoke_posture
        from: ACTIVE
        to: REVOKED
        trigger: "system cascade from any posture transition that leaves NORMAL"
        actor: system
        preconditions:
          - "override.state == ACTIVE AND override_type == SCHEDULE_EXTEND"
        side_effects:
          - "sets revoke_source = SYSTEM_POSTURE and leaves revoked_by_user_id null"
          - "releases projected_kwh from Store.override_kwh_used_month"

  - entity: FaultDiagnostic
    initial_state: DETECTED
    terminal_states: [SUPPRESSED, RESOLVED]
    transitions:
      - id: fault_triage_work_order
        from: DETECTED
        to: TRIAGED
        trigger: "POST /energy-ops/fault-diagnostics/{id}/triage with outcome = WORK_ORDER"
        actor: MaintenanceTech
        preconditions:
          - "fault.state == DETECTED"
        side_effects:
          - "sets triaged_by_user_id = X-User-ID"
          - "link 1: creates a MaintenanceWorkOrder in OPEN with priority = URGENT when fault_score >= WORK_ORDER_URGENT_THRESHOLD, else ROUTINE"
          - "link 2: when that work order is URGENT and equipment_class == REFRIGERATION, the Store moves bms_status ACTIVE -> DEGRADED"
          - "link 3: the Store recomputes energy_posture, raising NORMAL -> CONSTRAINED"
          - "link 4: every RetrofitProject of that Store in PROPOSED gets escalated_review = true"
      - id: fault_triage_suppress
        from: DETECTED
        to: SUPPRESSED
        trigger: "POST /energy-ops/fault-diagnostics/{id}/triage with outcome = SUPPRESS"
        actor: MaintenanceTech
        preconditions:
          - "fault.state == DETECTED"
          - "fault_score < SUPPRESSION_MAX_SCORE"
        side_effects:
          - "sets triaged_by_user_id = X-User-ID"
          - "no work order is created; the fault leaves calculations.retrofit_priority_score's fault-density input set"
      - id: fault_resolve
        from: TRIAGED
        to: RESOLVED
        trigger: "system cascade from POST /energy-ops/work-orders/{id}/complete"
        actor: system
        preconditions:
          - "the completing work order's fault_id == this fault"
        side_effects:
          - "sets state = RESOLVED"
          - "cascade: Store.urgent_work_order_count decrements and energy_posture is recomputed"

  - entity: MaintenanceWorkOrder
    initial_state: OPEN
    terminal_states: [COMPLETED]
    transitions:
      - id: work_order_schedule
        from: OPEN
        to: SCHEDULED
        trigger: "POST /energy-ops/work-orders/{id}/schedule"
        actor: MaintenanceTech
        preconditions:
          - "work_order.state IN {OPEN, SCHEDULED}"
          - "no other MaintenanceWorkOrder on the same equipment_ref (reached through FaultDiagnostic.equipment_ref) with state IN {OPEN with a window set, SCHEDULED} collides under validations[priority=103] buffered closed-interval arithmetic"
          - "fewer than WORK_ORDER_STORE_CAPACITY (2) other SCHEDULED work orders of the same store overlap the requested window"
        side_effects:
          - "stores scheduled_start_iso and scheduled_end_iso"
      - id: work_order_reschedule
        from: SCHEDULED
        to: SCHEDULED
        trigger: "POST /energy-ops/work-orders/{id}/schedule"
        actor: MaintenanceTech
        preconditions:
          - "same preconditions as work_order_schedule, evaluated with this work order excluded from the conflict set"
        side_effects:
          - "overwrites scheduled_start_iso and scheduled_end_iso"
        note: "self-loop; rescheduling is idempotent in state but not in stored window"
      - id: work_order_complete
        from: [OPEN, SCHEDULED]
        to: COMPLETED
        trigger: "POST /energy-ops/work-orders/{id}/complete"
        actor: MaintenanceTech
        preconditions:
          - "work_order.state IN {OPEN, SCHEDULED}"
        side_effects:
          - "sets completed_at_iso = clock and stores completion_note"
          - "link 1: the owning FaultDiagnostic moves TRIAGED -> RESOLVED"
          - "link 2: because that fault is no longer TRIAGED, Store.urgent_work_order_count decrements"
          - "link 3: because that count changed, Store.energy_posture is recomputed (CONSTRAINED -> NORMAL when no other input holds); Store.bms_status remains DEGRADED and requires an explicit recommission"

  - entity: RetrofitProject
    initial_state: PROPOSED
    terminal_states: [REJECTED]
    transitions:
      - id: retrofit_approve
        from: PROPOSED
        to: APPROVED
        trigger: "POST /energy-ops/retrofit-projects/{id}/approve with decision = APPROVE"
        actor: EnergyManager
        preconditions:
          - "project.state == PROPOSED"
          - "X-User-ID != project.proposed_by_user_id (segregation of duties)"
          - "the owning Store has bms_status IN {ACTIVE, DEGRADED}"
        side_effects:
          - "sets approved_by_user_id = X-User-ID"
          - "switches priority_basis to RISK_ADJUSTED and rewrites payback_years and priority_score per the risk_adjusted variant"
      - id: retrofit_reject
        from: PROPOSED
        to: REJECTED
        trigger: "POST /energy-ops/retrofit-projects/{id}/approve with decision = REJECT"
        actor: EnergyManager
        preconditions:
          - "project.state == PROPOSED"
          - "X-User-ID != project.proposed_by_user_id"
        side_effects:
          - "sets approved_by_user_id = X-User-ID and leaves priority_basis at SIMPLE_PAYBACK"
      - id: retrofit_measure_verified
        from: [APPROVED, SHORTFALL_REVIEW]
        to: VERIFIED
        trigger: "POST /energy-ops/retrofit-projects/{id}/submit-measurement"
        actor: EnergyAnalyst
        preconditions:
          - "project.state IN {APPROVED, SHORTFALL_REVIEW}"
          - "mv_period_days >= MV_MIN_PERIOD_DAYS"
          - "realization_rate >= VERIFY_FLOOR_RATE"
        side_effects:
          - "writes adjusted_baseline_kwh, measured_savings_kwh, realization_rate"
          - "credits Store.verified_savings_kwh_ytd by exactly measured_savings_kwh"
          - "recomputes Store.portfolio_realization_rate"
      - id: retrofit_measure_shortfall
        from: [APPROVED, SHORTFALL_REVIEW]
        to: SHORTFALL_REVIEW
        trigger: "POST /energy-ops/retrofit-projects/{id}/submit-measurement"
        actor: EnergyAnalyst
        preconditions:
          - "project.state IN {APPROVED, SHORTFALL_REVIEW}"
          - "mv_period_days >= MV_MIN_PERIOD_DAYS"
          - "realization_rate < VERIFY_FLOOR_RATE"
        side_effects:
          - "writes adjusted_baseline_kwh, measured_savings_kwh, realization_rate"
          - "credits nothing to Store.verified_savings_kwh_ytd"
          - "recomputes Store.portfolio_realization_rate"
        note: "the divergent branch of the fork; the two branches differ in the ledger side effect"
      - id: retrofit_revoke_verification
        from: VERIFIED
        to: SHORTFALL_REVIEW
        trigger: "POST /energy-ops/retrofit-projects/{id}/revoke-verification"
        actor: EnergyManager
        preconditions:
          - "project.state == VERIFIED"
        side_effects:
          - "debits Store.verified_savings_kwh_ytd by exactly the project's measured_savings_kwh"
          - "stores revocation_reason and recomputes Store.portfolio_realization_rate"

# =============================================================================
# 1.2.1 Concurrency Rules  (OCC on the parent's `version` only)
# =============================================================================
concurrency_rules:
  - rule_id: store-commissioning-stale-version
    parent_entity: Store
    write_endpoint: "POST /energy-ops/stores/{id}/bms-commissioning"
    occ_field: "expected_store_version"
    description: |
      Binding a setpoint standard to a Store whose version has advanced since the
      client last read it is rejected. A commissioning write legitimately
      supersedes the store's prior standard binding (state_machines.Store.
      transitions.bms_restandardise), so the write cannot be rejected by any
      state precondition: a second commissioning against an already-commissioned
      store is a valid product operation. The stale-version check is therefore
      the only thing that distinguishes a writer acting on a current view of the
      store from one whose view predates another commissioning, posture change or
      cascade.
    error_id: ERR_STALE_STORE_VERSION
    http_status: 412

  - rule_id: tariff-switch-stale-account-version
    parent_entity: UtilityAccount
    write_endpoint: "POST /energy-ops/utility-accounts/{id}/tariff-switch"
    occ_field: "expected_utility_account_version"
    description: |
      Scheduling a tariff switch against a UtilityAccount whose version has
      advanced since the client last read it is rejected. While tariff_state is
      PENDING_SWITCH a further switch legitimately supersedes the pending one
      (the lock is only stamped when a scheduled switch is applied), so the write
      has no state precondition to fail against; only the stale-version check
      separates a writer who has seen the pending switch from one who has not.
    error_id: ERR_STALE_ACCOUNT_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules
#   All arithmetic is Decimal with ROUND_HALF_UP. Every rounding step is stated
#   in order; where a step says "round" the result is materialised at the given
#   precision before it is used by the next step.
# =============================================================================
calculations:
  - name: period_peak_demand
    entity: UtilityBill
    output_fields: [billable_demand_kw, peak_basis]
    trigger: "POST /energy-ops/utility-bills/{id}/recompute (step 2 of bill_recompute_total)"
    algorithm_type: threshold
    dual_variant: true
    constants:
      RATCHET_FLOOR_FRACTION: 0.80
    input_set: |
      DemandInterval rows whose utility_account_id == the bill's utility_account_id
      AND period_start_iso <= interval_start_iso < period_end_iso (half-open).
      No state filter applies: DemandInterval is an immutable event entity.
    variants:
      - variant: coincident_peak
        applies_when: "the owning UtilityAccount has rate_family == TOU_DEMAND"
        formula: |
          1. eligible = input_set filtered to is_on_peak == true
          2. rank eligible by kw_demand DESC, then interval_start_iso ASC, then created_at ASC
          3. observed_peak_kw = kw_demand of the first ranked row (1 decimal place, already stored at 1 dp)
          4. peak_basis = "COINCIDENT_PEAK"
      - variant: anytime_peak
        applies_when: "the owning UtilityAccount has rate_family == FLAT_DEMAND"
        formula: |
          1. eligible = the whole input_set (on-peak and off-peak intervals alike)
          2. rank eligible by kw_demand DESC, then interval_start_iso ASC, then created_at ASC
          3. observed_peak_kw = kw_demand of the first ranked row
          4. peak_basis = "ANYTIME_PEAK"
    formula: |
      5. ratchet_floor_kw = round(RATCHET_FLOOR_FRACTION * account.ratchet_peak_kw, 1)
      6. billable_demand_kw = max(observed_peak_kw, ratchet_floor_kw)   # 1 decimal place
    rounding: "ratchet_floor_kw and billable_demand_kw to 1 decimal place, ROUND_HALF_UP"
    empty_set_behavior: |
      When eligible is empty the recompute is rejected with ERR_DEMAND_DATA_MISSING
      (422, validations priority 105). The bill stays in RECEIVED and no
      recomputed_* field is written. Note this is evaluated per variant: an
      account with only off-peak intervals fails under coincident_peak while the
      same data would succeed under anytime_peak.
    worked_examples:
      - "TOU_DEMAND, on-peak interval peak 1310.5, ratchet_peak_kw 1500.0 -> ratchet_floor_kw 1200.0 -> billable_demand_kw 1310.5, peak_basis COINCIDENT_PEAK"
      - "FLAT_DEMAND, same intervals with an off-peak 1402.0 interval, ratchet_peak_kw 1500.0 -> billable_demand_kw 1402.0, peak_basis ANYTIME_PEAK"
      - "TOU_DEMAND, on-peak peak only 900.0, ratchet_peak_kw 1500.0 -> ratchet_floor_kw 1200.0 wins -> billable_demand_kw 1200.0"

  - name: bill_recompute_total
    entity: UtilityBill
    output_fields: [recomputed_energy_cost_usd, recomputed_demand_cost_usd, recomputed_rider_cost_usd, recomputed_surcharge_usd, recomputed_amount_usd, variance_pct]
    trigger: "POST /energy-ops/utility-bills/{id}/recompute"
    algorithm_type: tiered_pricing
    constants:
      RIDER_RATE: 0.0375
      SURCHARGE_THRESHOLD_USD: 20000.00
      SURCHARGE_RATE: 0.015
      BILL_VARIANCE_TOLERANCE_PCT: 2.00
    formula: |
      1. energy_cost = round(bill.on_peak_kwh * account.rate_on_peak
                             + bill.off_peak_kwh * account.rate_off_peak, 2)
         -> recomputed_energy_cost_usd
      2. billable_demand_kw and peak_basis per calculations.period_peak_demand
      3. demand_cost = round(billable_demand_kw * account.demand_charge_per_kw, 2)
         -> recomputed_demand_cost_usd
      4. base_subtotal = energy_cost + demand_cost          # both already at 2 dp
      5. rider_cost = round(base_subtotal * RIDER_RATE, 2)  -> recomputed_rider_cost_usd
      6. pre_surcharge_total = base_subtotal + rider_cost
      7. surcharge = 0.00 when pre_surcharge_total < SURCHARGE_THRESHOLD_USD,
                     else round((pre_surcharge_total - SURCHARGE_THRESHOLD_USD) * SURCHARGE_RATE, 2)
         -> recomputed_surcharge_usd
      8. recomputed_amount_usd = pre_surcharge_total + surcharge
      9. variance_pct = round((bill.billed_amount_usd - recomputed_amount_usd)
                              / recomputed_amount_usd * 100, 2)
      10. validation_state = VALIDATED when abs(variance_pct) <= BILL_VARIANCE_TOLERANCE_PCT,
                             else VARIANCE_FLAGGED
    rounding: |
      Each of steps 1, 3, 5, 7 and 9 rounds to 2 decimal places BEFORE its result
      feeds the next step (round-each-step). The surcharge is charged only on the
      excess above SURCHARGE_THRESHOLD_USD, never on the whole subtotal, and the
      rider is computed on base_subtotal only - never on the surcharge.
    worked_examples:
      - "on_peak_kwh 240000, off_peak_kwh 518000, rate_on_peak 0.1450, rate_off_peak 0.0800, demand_charge_per_kw 14.50, billable_demand_kw 1310.5: energy 76240.00, demand 19002.25, base 95242.25, rider 3571.58, pre 98813.83, surcharge 1182.21, total 99996.04; billed_amount_usd 102500.00 -> variance_pct 2.50 -> VARIANCE_FLAGGED"
      - "same bill on a FLAT_DEMAND account (billable_demand_kw 1402.0): demand 20329.00, base 96569.00, rider 3621.34, pre 100190.34, surcharge 1202.86, total 101393.20; billed_amount_usd 102500.00 -> variance_pct 1.09 -> VALIDATED"
      - "small bill on_peak_kwh 36000, off_peak_kwh 54000, billable_demand_kw 300.0: energy 9540.00, demand 4350.00, base 13890.00, rider 520.88, pre 14410.88 < 20000.00 -> surcharge 0.00, total 14410.88"

  - name: dr_baseline_kw
    entity: DemandResponseEvent
    output_fields: [baseline_kw]
    trigger: "POST /energy-ops/demand-response-events/{id}/notify"
    algorithm_type: chronological
    constants:
      BASELINE_LOOKBACK_INTERVALS: 10
      BASELINE_TOP_N: 3
    input_set: |
      DemandInterval rows of the event's utility_account_id with
      is_on_peak == true AND is_dr_event_day == false AND
      interval_start_iso < event.curtailment_start_iso.
    formula: |
      1. candidates = input_set ordered by interval_start_iso DESC, then created_at DESC;
         keep the first BASELINE_LOOKBACK_INTERVALS rows
      2. rank candidates by kw_demand DESC, then interval_start_iso ASC, then created_at ASC;
         keep the first BASELINE_TOP_N rows (fewer when candidates is smaller)
      3. baseline_kw = round(sum(kw_demand of kept rows) / count(kept rows), 2)
    rounding: "2 decimal places, ROUND_HALF_UP; the division is performed once, on the exact sum"
    empty_set_behavior: |
      When the input_set is empty the notify call is rejected with
      ERR_BASELINE_DATA_INSUFFICIENT (422, validations priority 104); the event
      stays in SCHEDULED and baseline_kw stays null. One or two candidates are
      NOT an error: the mean is taken over however many rows survive step 2.
    worked_examples:
      - "top three eligible intervals 1290.5, 1275.0, 1245.0 -> baseline_kw 1270.17"
      - "an interval with is_dr_event_day == true and a higher kw_demand is present but excluded, so baseline_kw is unchanged at 1270.17"

  - name: dr_event_settlement
    entity: DemandResponseEvent
    output_fields: [total_reduction_kwh, performance_pct, incentive_usd, penalty_usd]
    trigger: "POST /energy-ops/demand-response-events/{id}/settle"
    algorithm_type: aggregation
    constants:
      INTERVAL_HOURS: 0.25
      INCENTIVE_RATE_USD_PER_KWH: 0.42
      PENALTY_RATE_USD_PER_KWH: 0.18
      PERFORMANCE_FLOOR_PCT: 75.0
    input_set: |
      DemandInterval rows of the event's utility_account_id with
      curtailment_start_iso <= interval_start_iso < curtailment_end_iso (half-open).
    formula: |
      1. for each interval in the input_set, ordered by interval_start_iso ASC then created_at ASC:
           interval_reduction_kwh = round(max(0, event.baseline_kw - interval.kw_demand)
                                          * INTERVAL_HOURS, 2)
      2. total_reduction_kwh = sum of the rounded per-interval values (round-each-then-sum;
         summing the unrounded products and rounding once is NOT the specified order)
      3. target_kwh = round(event.target_reduction_kw * INTERVAL_HOURS
                            * count(input_set), 2)
      4. performance_pct = round(total_reduction_kwh / target_kwh * 100, 1)
      5. when performance_pct >= PERFORMANCE_FLOOR_PCT:
           incentive_usd = round(total_reduction_kwh * INCENTIVE_RATE_USD_PER_KWH, 2)
           penalty_usd   = 0.00
         otherwise:
           incentive_usd = 0.00
           penalty_usd   = round((target_kwh - total_reduction_kwh) * PENALTY_RATE_USD_PER_KWH, 2)
      6. UtilityAccount.dr_incentive_accrued_usd += incentive_usd
    rounding: "per-interval 2 dp, total is an exact sum of 2 dp values, performance_pct 1 dp, money 2 dp"
    empty_set_behavior: |
      When the input_set is empty, total_reduction_kwh = 0.00, target_kwh = 0.00 and
      performance_pct = 0.0 by definition (the 0/0 division is not evaluated);
      incentive_usd = 0.00 and penalty_usd = 0.00. The event still settles.
    worked_examples:
      - "baseline_kw 1270.17, target_reduction_kw 200.0, four intervals at 1050.0 / 1020.5 / 1100.0 / 1080.0 -> per-interval 55.04, 62.42, 42.54, 47.54 -> total_reduction_kwh 207.54 (sum-then-round would give 207.55), target_kwh 200.00, performance_pct 103.8, incentive_usd 87.17, penalty_usd 0.00"
      - "same baseline and target, four intervals at 1250.0 / 1255.5 / 1240.0 / 1259.5 -> per-interval 5.04, 3.67, 7.54, 2.67 -> total_reduction_kwh 18.92, performance_pct 9.5 < 75.0 -> incentive_usd 0.00, penalty_usd 32.59"

  - name: store_energy_posture
    entity: Store
    output_fields: [energy_posture]
    trigger: "recomputed synchronously at the end of every request that mutates one of its inputs"
    algorithm_type: constraint_propagation
    constants:
      DR_OPTOUT_SUSPEND_COUNT: 3
    input_set: |
      For the store S:
        excursions(S) = TempExcursion rows reached through RefrigerationCase.store_id == S.id
        cases(S)      = RefrigerationCase rows with store_id == S.id
        events(S)     = DemandResponseEvent rows reached through UtilityAccount.store_id == S.id
    formula: |
      Evaluated as a strict precedence ladder, first match wins:
      1. LOCKED      when any row of excursions(S) has state IN {ESCALATED, DISPOSITION_REQUIRED}
      2. CURTAILED   when any row of events(S) has event_state == ACTIVE
      3. CONSTRAINED when any of:
                       - any row of cases(S) has monitoring_state == ALARM
                       - S.bms_status == DEGRADED
                       - S.urgent_work_order_count >= 1
      4. NORMAL      otherwise
      Coupled cascade constant: each system opt-out driven by rule 1 increments
      UtilityAccount.dr_optout_count, and the account's dr_enrollment_state
      becomes SUSPENDED as soon as dr_optout_count >= DR_OPTOUT_SUSPEND_COUNT (3).
    rounding: "not applicable"
    empty_set_behavior: "a store with no children evaluates to NORMAL"
    worked_examples:
      - "one case in ALARM with its excursion still OPEN -> CONSTRAINED (rule 3)"
      - "that excursion reaches ESCALATED -> LOCKED (rule 1 outranks rule 3)"
      - "an ACTIVE demand-response event while a case is in ALARM -> CURTAILED (rule 2 outranks rule 3)"
      - "an ACTIVE demand-response event while an excursion is ESCALATED -> LOCKED (rule 1 outranks rule 2)"

  - name: excursion_exposure
    entity: TempExcursion
    output_fields: [peak_temp_f, exposure_minutes, state, mandatory_disposition]
    trigger: "POST /energy-ops/refrigeration-cases/{id}/readings"
    algorithm_type: threshold
    constants:
      GRACE_READINGS: 2
      ESCALATE_MINUTES: 120
      DISPOSITION_MINUTES: 240
    input_set: |
      The readings posted against a RefrigerationCase whose monitoring_state is
      ARMED or ALARM. Readings posted against a BYPASSED case are stored on the
      case (last_reading_temp_f / last_reading_iso) but take no part in breach
      evaluation and never open or extend an excursion.
    formula: |
      1. a reading BREACHES when reading.temp_f >= case.alarm_high_f
         OR reading.temp_f <= case.alarm_low_f (both bounds inclusive)
      2. a breaching reading increments case.consecutive_breach_count;
         a non-breaching reading resets it to 0 (and does not close an open excursion)
      3. when consecutive_breach_count reaches GRACE_READINGS and the case has no
         non-CLOSED excursion, a TempExcursion is created with
         first_breach_iso = the reading instant of the FIRST breach of the current run
      4. for an existing non-CLOSED excursion, each further breaching reading sets
         last_breach_iso = that reading instant and
         peak_temp_f = the largest absolute deviation seen so far, recorded as the
         actual temp_f of the reading whose deviation from the nearer alarm bound is
         greatest (ties resolved by the earlier reading instant)
      5. exposure_minutes = whole minutes between first_breach_iso and last_breach_iso
         (integer floor of the elapsed seconds / 60)
      6. state ladder, evaluated after step 5, first match wins:
           exposure_minutes >= DISPOSITION_MINUTES -> DISPOSITION_REQUIRED, mandatory_disposition = DISCARD
           exposure_minutes >= ESCALATE_MINUTES    -> ESCALATED, mandatory_disposition = NONE
           otherwise                                -> OPEN (an ACKNOWLEDGED excursion reverts to OPEN)
    rounding: "exposure_minutes is an integer floor; temperatures are 1 decimal place"
    empty_set_behavior: "a case with no readings has consecutive_breach_count 0, no excursion and monitoring_state ARMED"
    worked_examples:
      - "alarm_high_f 41.0, reading temp_f 41.0 -> BREACHES (inclusive bound); the second consecutive breach opens the excursion"
      - "alarm_low_f 28.0, reading temp_f 27.9 -> BREACHES on the low side"
      - "first_breach_iso 2026-08-01T04:00:00Z, last_breach_iso 2026-08-01T06:00:00Z -> exposure_minutes 120 -> ESCALATED (>= 120 is inclusive)"
      - "last_breach_iso 2026-08-01T05:59:00Z -> exposure_minutes 119 -> stays OPEN"
      - "last_breach_iso 2026-08-01T08:00:00Z -> exposure_minutes 240 -> DISPOSITION_REQUIRED with mandatory_disposition DISCARD"

  - name: fault_score
    entity: FaultDiagnostic
    output_fields: [fault_score]
    trigger: "POST /energy-ops/stores/{id}/fault-diagnostics"
    algorithm_type: weighted_scoring
    constants:
      SEVERITY_WEIGHT_INFO: 5
      SEVERITY_WEIGHT_MINOR: 20
      SEVERITY_WEIGHT_MAJOR: 45
      SEVERITY_WEIGHT_CRITICAL: 70
      PERSISTENCE_STEP: 0.1
      PERSISTENCE_MAX_OCCURRENCES: 10
      LOAD_DIVISOR_KW: 200.0
      LOAD_FACTOR_CAP: 1.25
      REFRIGERATION_BONUS: 15.00
      SCORE_CAP: 100.0
      WORK_ORDER_URGENT_THRESHOLD: 70.0
      SUPPRESSION_MAX_SCORE: 50.0
    formula: |
      1. severity_weight = SEVERITY_WEIGHT_<severity>
      2. persistence_factor = round(1 + PERSISTENCE_STEP
                                    * min(occurrence_count - 1, PERSISTENCE_MAX_OCCURRENCES), 2)
      3. load_factor = min(LOAD_FACTOR_CAP,
                           round(1 + affected_load_kw / LOAD_DIVISOR_KW, 4))
      4. weighted = round(severity_weight * persistence_factor, 2)
      5. loaded = round(weighted * load_factor, 2)
      6. with_class = loaded + REFRIGERATION_BONUS when equipment_class == REFRIGERATION,
                      else loaded
      7. fault_score = min(SCORE_CAP, round(with_class, 1))
      Downstream: the work order created at triage has priority URGENT when
      fault_score >= WORK_ORDER_URGENT_THRESHOLD, else ROUTINE; a fault may only be
      SUPPRESSED when fault_score < SUPPRESSION_MAX_SCORE.
    rounding: "steps 2 and 4-5 to 2 dp, step 3 to 4 dp, final score to 1 dp, all ROUND_HALF_UP"
    empty_set_behavior: "not applicable; every input is a field of the fault itself"
    worked_examples:
      - "CRITICAL, occurrence_count 5, affected_load_kw 60.0, REFRIGERATION: persistence 1.40, load_factor capped at 1.25, weighted 98.00, loaded 122.50, with_class 137.50 -> fault_score 100.0 (cap)"
      - "MAJOR, occurrence_count 6, affected_load_kw 20.0, REFRIGERATION: persistence 1.50, load_factor 1.1000, weighted 67.50, loaded 74.25, with_class 89.25 -> fault_score 89.3 -> URGENT"
      - "MAJOR, occurrence_count 3, affected_load_kw 30.0, HVAC: persistence 1.20, load_factor 1.1500, weighted 54.00 -> fault_score 62.1 -> ROUTINE"
      - "CRITICAL, occurrence_count 1, affected_load_kw 0.0, HVAC: persistence 1.00, load_factor 1.0000 -> fault_score 70.0 -> URGENT (>= 70.0 is inclusive)"
      - "MAJOR, occurrence_count 2, affected_load_kw 2.0, LIGHTING: persistence 1.10, load_factor 1.0100, weighted 49.50 -> fault_score 50.0 -> suppression REJECTED (< 50.0 is exclusive)"
      - "MINOR, occurrence_count 2, affected_load_kw 10.0, LIGHTING: persistence 1.10, load_factor 1.0500, weighted 22.00 -> fault_score 23.1 -> suppression allowed"

  - name: lighting_override_projection
    entity: LightingOverride
    output_fields: [projected_kwh]
    trigger: "POST /energy-ops/stores/{id}/lighting-overrides"
    algorithm_type: aggregation
    constants:
      OVERRIDE_MAX_HOURS: 12
    formula: |
      1. window_hours = exact elapsed minutes between start_iso and end_iso divided by 60
         (kept exact, not rounded); a window longer than OVERRIDE_MAX_HOURS is rejected
         with ERR_INVALID_REQUEST
      2. projected_kwh = round(zone_load_kw * window_hours, 2)
      3. Store.override_kwh_used_month = sum of projected_kwh over that store's
         LightingOverride rows with state IN {SCHEDULED, ACTIVE, EXPIRED} whose
         start_iso falls in the calendar month (UTC) of the request clock.
         REVOKED rows are excluded, which is how a revocation releases budget.
      4. the create is admitted only when
         round(Store.override_kwh_used_month + projected_kwh, 2) <= Store.override_budget_kwh_month
         (equality is admitted); otherwise ERR_OVERRIDE_BUDGET_EXCEEDED
         (422, validations priority 120)
    rounding: "2 decimal places, ROUND_HALF_UP"
    empty_set_behavior: "a store with no overrides in the month has override_kwh_used_month 0.00"
    worked_examples:
      - "zone_load_kw 37.5 over an 8 hour window -> projected_kwh 300.00"
      - "a second override 25.0 kW over 8 hours -> 200.00, cumulative exactly 500.00 against a 500.0 budget -> ADMITTED"
      - "a third override 40.0 kW over 2 hours -> 80.00, cumulative 580.00 > 500.0 -> ERR_OVERRIDE_BUDGET_EXCEEDED"
      - "revoking the 200.00 override drops override_kwh_used_month to 300.00, after which the 80.00 override is admitted"

  - name: retrofit_priority_score
    entity: RetrofitProject
    output_fields: [annual_savings_usd, payback_years, priority_score, priority_basis]
    trigger: "POST /energy-ops/stores/{id}/retrofit-projects (simple_payback) and POST /energy-ops/retrofit-projects/{id}/approve (risk_adjusted)"
    algorithm_type: weighted_scoring
    dual_variant: true
    constants:
      DEFAULT_REALIZATION_RATE: 0.85
      PAYBACK_PENALTY_PER_YEAR: 10
      FAULT_DENSITY_BONUS: 8
      FAULT_DENSITY_CAP: 3
      SCORE_MIN: 0.0
      SCORE_MAX: 100.0
    variants:
      - variant: simple_payback
        applies_when: "at proposal time (state PROPOSED); priority_basis = SIMPLE_PAYBACK"
        formula: |
          1. annual_savings_usd = round(projected_annual_savings_kwh
                                        * store.blended_rate_usd_per_kwh, 2)
          2. payback_years = round(capex_usd / annual_savings_usd, 2)
          3. priority_score = min(SCORE_MAX, max(SCORE_MIN,
               round(100 - PAYBACK_PENALTY_PER_YEAR * payback_years, 1)))
      - variant: risk_adjusted
        applies_when: "at approval time (PROPOSED -> APPROVED); priority_basis = RISK_ADJUSTED"
        formula: |
          1. annual_savings_usd = round(round(projected_annual_savings_kwh
                                              * store.blended_rate_usd_per_kwh, 2)
                                        * DEFAULT_REALIZATION_RATE, 2)
          2. payback_years = round(capex_usd / annual_savings_usd, 2)
          3. fault_density = count of FaultDiagnostic rows of the same store with
             equipment_class == REFRIGERATION AND state IN {DETECTED, TRIAGED}
          4. priority_score = min(SCORE_MAX, max(SCORE_MIN,
               round(100 - PAYBACK_PENALTY_PER_YEAR * payback_years
                     + FAULT_DENSITY_BONUS * min(FAULT_DENSITY_CAP, fault_density), 1)))
    rounding: "money 2 dp, payback_years 2 dp, priority_score 1 dp, all ROUND_HALF_UP"
    empty_set_behavior: |
      fault_density 0 contributes no bonus. projected_annual_savings_kwh is
      constrained > 0 so annual_savings_usd is never 0 and the division in step 2
      is always defined.
    worked_examples:
      - "capex_usd 240240.00, projected_annual_savings_kwh 520000.00, blended_rate_usd_per_kwh 0.11: annual_savings_usd 57200.00, payback_years 4.20, priority_score 58.0 (SIMPLE_PAYBACK)"
      - "the same project at approval with 0 refrigeration faults: annual_savings_usd 48620.00, payback_years 4.94, priority_score 50.6 (RISK_ADJUSTED) - a delta of -7.4 against the proposal score"
      - "the same project at approval with 1 refrigeration fault in DETECTED: priority_score 58.6"
      - "the same project at approval with 5 refrigeration faults: bonus capped at 3 -> priority_score 74.6"

  - name: measured_savings_verification
    entity: RetrofitProject
    output_fields: [adjusted_baseline_kwh, measured_savings_kwh, realization_rate]
    trigger: "POST /energy-ops/retrofit-projects/{id}/submit-measurement"
    algorithm_type: projection
    constants:
      CLIMATE_ADJUST_HOT_HUMID: 1.08
      CLIMATE_ADJUST_HOT_DRY: 1.05
      CLIMATE_ADJUST_MIXED: 1.00
      CLIMATE_ADJUST_MARINE: 0.96
      CLIMATE_ADJUST_COLD: 0.93
      MV_MIN_PERIOD_DAYS: 60
      VERIFY_FLOOR_RATE: 0.8000
      DAYS_PER_YEAR: 365
    formula: |
      1. reject with ERR_MV_PERIOD_TOO_SHORT (422, validations priority 112) when
         mv_period_days < MV_MIN_PERIOD_DAYS
      2. climate_factor = CLIMATE_ADJUST_<store.climate_zone>
      3. adjusted_baseline_kwh = round(baseline_period_kwh * climate_factor, 2)
      4. measured_savings_kwh = round(adjusted_baseline_kwh - post_period_kwh, 2)
      5. expected_savings_kwh = round(projected_annual_savings_kwh
                                      * mv_period_days / DAYS_PER_YEAR, 2)
      6. realization_rate = round(measured_savings_kwh / expected_savings_kwh, 4)
      7. state = VERIFIED when realization_rate >= VERIFY_FLOOR_RATE
         (Store.verified_savings_kwh_ytd += measured_savings_kwh),
         else SHORTFALL_REVIEW (no ledger credit)
      8. Store.portfolio_realization_rate = round(mean of realization_rate over the
         store's projects in state IN {VERIFIED, SHORTFALL_REVIEW}, 4), or
         DEFAULT_REALIZATION_RATE when that set is empty
    rounding: "kWh 2 dp, realization_rate 4 dp, portfolio_realization_rate 4 dp, ROUND_HALF_UP"
    empty_set_behavior: "step 8 falls back to DEFAULT_REALIZATION_RATE (0.85) when the store has no measured project"
    worked_examples:
      - "HOT_HUMID store, baseline_period_kwh 300000.00, mv_period_days 90, projected_annual_savings_kwh 520000.00: climate_factor 1.08, adjusted_baseline_kwh 324000.00, expected_savings_kwh 128219.18"
      - "post_period_kwh 260000.00 -> measured_savings_kwh 64000.00, realization_rate 0.4991 -> SHORTFALL_REVIEW"
      - "post_period_kwh 220000.00 -> measured_savings_kwh 104000.00, realization_rate 0.8111 -> VERIFIED, Store.verified_savings_kwh_ytd 104000.00"
      - "post_period_kwh 221424.66 -> measured_savings_kwh 102575.34, realization_rate exactly 0.8000 -> VERIFIED (the floor is inclusive)"
      - "a COLD store with the same baseline: climate_factor 0.93, adjusted_baseline_kwh 279000.00"

  - name: store_eui_benchmark
    entity: Store
    output_fields: [eui_kbtu_per_sqft, benchmark_percentile, benchmark_outlier_flag]
    trigger: "GET /energy-ops/benchmark-report"
    algorithm_type: aggregation
    constants:
      KWH_TO_KBTU: 3.412
      TRAILING_WINDOW_DAYS: 365
      OUTLIER_MEDIAN_MULTIPLE: 1.30
    input_set: |
      For each store S: UtilityBill rows reached through UtilityAccount.store_id == S.id
      with validation_state IN {VALIDATED, ADJUSTED} and
      clock - TRAILING_WINDOW_DAYS days <= period_end_iso <= clock.
      Bills in RECEIVED, VARIANCE_FLAGGED or DISPUTED are excluded.
    formula: |
      1. window_kwh(S) = sum of billed_kwh over the input_set of S
      2. eui_kbtu_per_sqft(S) = round(window_kwh(S) * KWH_TO_KBTU / S.floor_area_sqft, 2);
         null when the input_set is empty
      3. peer_group(S) = stores with the same climate_zone AND store_format AND a
         non-null eui, INCLUDING S
      4. peers(S) = peer_group(S) excluding S itself
      5. peer_median(S) = the central value of peers(S) sorted by eui ASC then
         created_at ASC; when count(peers) is even it is
         round(mean of the two central values, 2)
      6. outlier_threshold(S) = round(OUTLIER_MEDIAN_MULTIPLE * peer_median(S), 2)
      7. benchmark_outlier_flag(S) = eui(S) >= outlier_threshold(S)   # inclusive
      8. benchmark_percentile(S) = round(100 * count(rows of peer_group(S) with
         eui <= eui(S)) / count(peer_group(S)), 1)
    rounding: "eui 2 dp, threshold 2 dp, percentile 1 dp, ROUND_HALF_UP"
    empty_set_behavior: |
      A store with no qualifying bill has eui_kbtu_per_sqft null,
      benchmark_percentile null and benchmark_outlier_flag false, and is excluded
      from every other store's peer_group. When peers(S) is empty the threshold is
      undefined: benchmark_outlier_flag stays false and benchmark_percentile is 100.0.
    worked_examples:
      - "four HOT_DRY / NEIGHBORHOOD stores of 40000 sqft with window_kwh 90000 / 100000 / 360000 / 130000 -> eui 7.68 / 8.53 / 30.71 / 11.09"
      - "for the 11.09 store: peers 7.68, 8.53, 30.71 -> peer_median 8.53 -> outlier_threshold 11.09 -> flag true (inclusive boundary), percentile 75.0"
      - "for the 30.71 store: peers 7.68, 8.53, 11.09 -> peer_median 8.53 -> threshold 11.09 -> flag true, percentile 100.0"
      - "for the 7.68 store: peers 8.53, 11.09, 30.71 -> peer_median 11.09 -> threshold 14.42 -> flag false, percentile 25.0"
      - "if the 8.53 store's bill is still RECEIVED it drops out: the 11.09 store then has peers 7.68 and 30.71 -> even count -> peer_median 19.20 -> threshold 24.96 -> flag false"

  - name: tariff_switch_projection
    entity: UtilityAccount
    output_fields: [current_annual_cost_usd, candidate_annual_cost_usd, annual_delta_usd, switch_recommended]
    trigger: "GET /energy-ops/utility-accounts/{id}/tariff-comparison (read-only projection; the same numbers gate POST /energy-ops/utility-accounts/{id}/tariff-switch)"
    algorithm_type: forward_looking
    constants:
      ANNUALIZATION_MONTHS: 12
      SWITCH_MIN_SAVINGS_USD: 2500.00
    input_set: |
      The reference bill = the account's UtilityBill rows with validation_state IN
      {VALIDATED, ADJUSTED} ranked by period_end_iso DESC, then created_at DESC;
      the first row wins.
    formula: |
      1. current_annual_cost_usd = round(reference_bill.recomputed_amount_usd
                                         * ANNUALIZATION_MONTHS, 2)
      2. candidate_amount_usd = calculations.bill_recompute_total re-run over the
         reference bill's kWh with candidate_rate_on_peak, candidate_rate_off_peak
         and candidate_demand_charge_per_kw, and with
         calculations.period_peak_demand re-selected under candidate_rate_family
         (so a TOU -> FLAT candidate switches the peak basis to ANYTIME_PEAK)
      3. candidate_annual_cost_usd = round(candidate_amount_usd * ANNUALIZATION_MONTHS, 2)
      4. annual_delta_usd = candidate_annual_cost_usd - current_annual_cost_usd
      5. switch_recommended = annual_delta_usd <= -SWITCH_MIN_SAVINGS_USD   # inclusive
      A tariff-switch request whose projection has switch_recommended == false is
      rejected with ERR_TARIFF_SWITCH_NOT_JUSTIFIED (422, validations priority 122).
    rounding: "2 decimal places, ROUND_HALF_UP; the rider and surcharge steps of the candidate recompute follow bill_recompute_total exactly"
    empty_set_behavior: |
      When the account has no VALIDATED or ADJUSTED bill, all four outputs are null
      and a tariff-switch request is rejected with ERR_TARIFF_SWITCH_NOT_JUSTIFIED.
      When any candidate_* field is null the same rejection applies.
    worked_examples:
      - "reference bill recomputed_amount_usd 99996.04 -> current_annual_cost_usd 1199952.48; candidate TOU rates 0.1100 / 0.0700 / 11.00 on billable_demand_kw 1310.5 -> candidate_amount_usd 80865.32 -> candidate_annual_cost_usd 970383.84 -> annual_delta_usd -229568.64 -> switch_recommended true"
      - "candidate rates 0.1460 / 0.0805 / 14.60 -> candidate_amount_usd 100659.52 -> candidate_annual_cost_usd 1207914.24 -> annual_delta_usd 7961.76 -> switch_recommended false"
      - "candidate_rate_family FLAT_DEMAND with the same candidate rates re-selects the peak basis to the 1402.0 anytime peak -> candidate_amount_usd 81925.23 -> candidate_annual_cost_usd 983102.76 -> annual_delta_usd -216849.72"

# =============================================================================
# 1.4 Validation Rules  (evaluated in ascending priority; the FIRST violated
#     rule determines the response. Every priority value is unique.)
# =============================================================================
validations:
  - priority: 10
    category: auth
    rule: "X-User-ID header is present and non-empty on every endpoint"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all endpoints"
  - priority: 20
    category: auth
    rule: "the caller's role is permitted to invoke this endpoint per roles (§1.7)"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all endpoints"
  - priority: 30
    category: schema
    rule: "the request body and query parameters parse, every required field is present, every enum value is a declared member, every numeric field satisfies its declared range and decimal precision, every datetime is ISO-8601 with a Z offset, and end > start on every window field pair (period_end_iso, curtailment_end_iso, end_iso, scheduled_end_iso). A LightingOverride window longer than OVERRIDE_MAX_HOURS and a SetpointStandard with heating_setpoint_f >= cooling_setpoint_f are rejected here."
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all endpoints with a body or query parameters"
  - priority: 40
    category: existence
    rule: "the store id in the path (or in a body field naming a store) resolves"
    error_id: ERR_STORE_NOT_FOUND
    http_status: 404
    applies_to: "every /stores/{id}/... endpoint"
  - priority: 41
    category: existence
    rule: "the setpoint standard id in the path or in body standard_id / supersedes_standard_id resolves"
    error_id: ERR_STANDARD_NOT_FOUND
    http_status: 404
    applies_to: "POST /energy-ops/setpoint-standards, POST /energy-ops/setpoint-standards/{id}/publish, GET /energy-ops/setpoint-standards/{id}, POST /energy-ops/stores/{id}/bms-commissioning"
  - priority: 42
    category: existence
    rule: "the utility account id in the path resolves"
    error_id: ERR_ACCOUNT_NOT_FOUND
    http_status: 404
    applies_to: "every /utility-accounts/{id}/... endpoint"
  - priority: 43
    category: existence
    rule: "the utility bill id in the path resolves"
    error_id: ERR_BILL_NOT_FOUND
    http_status: 404
    applies_to: "every /utility-bills/{id}/... endpoint"
  - priority: 44
    category: existence
    rule: "the demand-response event id in the path resolves"
    error_id: ERR_DR_EVENT_NOT_FOUND
    http_status: 404
    applies_to: "every /demand-response-events/{id}/... endpoint"
  - priority: 45
    category: existence
    rule: "the refrigeration case id in the path resolves"
    error_id: ERR_CASE_NOT_FOUND
    http_status: 404
    applies_to: "every /refrigeration-cases/{id}/... endpoint"
  - priority: 46
    category: existence
    rule: "the excursion id in the path resolves"
    error_id: ERR_EXCURSION_NOT_FOUND
    http_status: 404
    applies_to: "every /excursions/{id}/... endpoint"
  - priority: 47
    category: existence
    rule: "the lighting override id in the path resolves"
    error_id: ERR_OVERRIDE_NOT_FOUND
    http_status: 404
    applies_to: "POST /energy-ops/lighting-overrides/{id}/revoke"
  - priority: 48
    category: existence
    rule: "the fault diagnostic id in the path resolves"
    error_id: ERR_FAULT_NOT_FOUND
    http_status: 404
    applies_to: "every /fault-diagnostics/{id}/... endpoint"
  - priority: 49
    category: existence
    rule: "the work order id in the path resolves"
    error_id: ERR_WORK_ORDER_NOT_FOUND
    http_status: 404
    applies_to: "every /work-orders/{id}/... endpoint"
  - priority: 50
    category: existence
    rule: "the retrofit project id in the path resolves"
    error_id: ERR_RETROFIT_NOT_FOUND
    http_status: 404
    applies_to: "every /retrofit-projects/{id}/... endpoint"
  - priority: 52
    category: auth
    rule: "an entity_backed caller (StoreManager, BmsGateway) may only act on the store whose id equals its X-User-ID, including stores reached transitively through RefrigerationCase.store_id and UtilityAccount.store_id"
    error_id: ERR_STORE_SCOPE_VIOLATION
    http_status: 403
    applies_to: "POST /energy-ops/stores/{id}/lighting-overrides, POST /energy-ops/refrigeration-cases/{id}/readings, POST /energy-ops/excursions/{id}/acknowledge, GET /energy-ops/stores/{id}"
  - priority: 54
    category: auth
    rule: "segregation of duties: X-User-ID must differ from bill.recomputed_by_user_id when authorizing an adjustment, and from project.proposed_by_user_id when approving or rejecting a retrofit"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /energy-ops/utility-bills/{id}/adjustment, POST /energy-ops/retrofit-projects/{id}/approve"
  - priority: 60
    category: state
    rule: "the store's bms_status permits the requested BMS transition (see state_machines.Store dimension bms_status)"
    error_id: ERR_BMS_STATE_INVALID
    http_status: 409
    applies_to: "POST /energy-ops/stores/{id}/bms-commissioning, POST /energy-ops/stores/{id}/bms-activation"
  - priority: 61
    category: state
    rule: "the standard's status permits publication (DRAFT only)"
    error_id: ERR_STANDARD_STATE_INVALID
    http_status: 409
    applies_to: "POST /energy-ops/setpoint-standards/{id}/publish"
  - priority: 62
    category: state
    rule: "the bill's validation_state permits the requested action (RECEIVED for recompute, VARIANCE_FLAGGED for dispute, DISPUTED for adjustment)"
    error_id: ERR_BILL_STATE_INVALID
    http_status: 409
    applies_to: "POST /energy-ops/utility-bills/{id}/recompute, /dispute, /adjustment"
  - priority: 63
    category: state
    rule: "the event's event_state permits the requested action (SCHEDULED for notify, NOTIFIED for activate)"
    error_id: ERR_DR_EVENT_STATE_INVALID
    http_status: 409
    applies_to: "POST /energy-ops/demand-response-events/{id}/notify, /activate"
  - priority: 64
    category: state
    rule: "the event's settlement_state permits the requested action (PENDING for settle, SETTLED for reverse-settlement) and event_state == COMPLETED for settle"
    error_id: ERR_SETTLEMENT_STATE_INVALID
    http_status: 409
    applies_to: "POST /energy-ops/demand-response-events/{id}/settle, /reverse-settlement"
  - priority: 65
    category: state
    rule: "the case's monitoring_state permits the requested action: BYPASSED is reachable only from ARMED, ARMED only from BYPASSED, and a target_state equal to the current state is rejected"
    error_id: ERR_CASE_STATE_INVALID
    http_status: 409
    applies_to: "POST /energy-ops/refrigeration-cases/{id}/monitoring-state"
  - priority: 66
    category: state
    rule: "the excursion's state permits the requested action (OPEN for acknowledge, any non-CLOSED state for document-disposition and close)"
    error_id: ERR_EXCURSION_STATE_INVALID
    http_status: 409
    applies_to: "POST /energy-ops/excursions/{id}/acknowledge, /document-disposition, /close"
  - priority: 67
    category: state
    rule: "the override's state permits revocation (SCHEDULED or ACTIVE only)"
    error_id: ERR_OVERRIDE_STATE_INVALID
    http_status: 409
    applies_to: "POST /energy-ops/lighting-overrides/{id}/revoke"
  - priority: 68
    category: state
    rule: "the fault's state permits triage (DETECTED only)"
    error_id: ERR_FAULT_STATE_INVALID
    http_status: 409
    applies_to: "POST /energy-ops/fault-diagnostics/{id}/triage"
  - priority: 69
    category: state
    rule: "the work order's state permits the requested action (OPEN or SCHEDULED for schedule and complete; a COMPLETED work order is locked)"
    error_id: ERR_WORK_ORDER_STATE_INVALID
    http_status: 409
    applies_to: "POST /energy-ops/work-orders/{id}/schedule, /complete"
  - priority: 70
    category: state
    rule: "the retrofit project's state permits the requested action (PROPOSED for approve, APPROVED or SHORTFALL_REVIEW for submit-measurement, VERIFIED for revoke-verification)"
    error_id: ERR_RETROFIT_STATE_INVALID
    http_status: 409
    applies_to: "POST /energy-ops/retrofit-projects/{id}/approve, /submit-measurement, /revoke-verification"
  - priority: 72
    category: concurrency
    rule: "body expected_store_version equals the store's current version"
    error_id: ERR_STALE_STORE_VERSION
    http_status: 412
    applies_to: "POST /energy-ops/stores/{id}/bms-commissioning"
  - priority: 73
    category: concurrency
    rule: "body expected_utility_account_version equals the account's current version"
    error_id: ERR_STALE_ACCOUNT_VERSION
    http_status: 412
    applies_to: "POST /energy-ops/utility-accounts/{id}/tariff-switch"
  - priority: 80
    category: business_safety
    rule: "a demand-response event may not be activated while the owning store's energy_posture is LOCKED or CURTAILED, a lighting override may not be created while the store's energy_posture is LOCKED, and a BMS commissioning may not be started while the store's energy_posture is LOCKED: food-safety posture outranks every energy program"
    error_id: ERR_FOOD_SAFETY_HOLD
    http_status: 409
    applies_to: "POST /energy-ops/demand-response-events/{id}/activate, POST /energy-ops/stores/{id}/lighting-overrides, POST /energy-ops/stores/{id}/bms-commissioning"
  - priority: 81
    category: business_safety
    rule: "when the excursion's mandatory_disposition == DISCARD the documented disposition must be DISCARD; RETAIN is refused"
    error_id: ERR_DISPOSITION_MANDATE_VIOLATION
    http_status: 422
    applies_to: "POST /energy-ops/excursions/{id}/document-disposition"
  - priority: 82
    category: business_safety
    rule: "an excursion may only be closed once disposition and corrective_action_note are both recorded"
    error_id: ERR_FOOD_SAFETY_DOC_INCOMPLETE
    http_status: 422
    applies_to: "POST /energy-ops/excursions/{id}/close"
  - priority: 83
    category: business_safety
    rule: "a fault may only be suppressed when fault_score < SUPPRESSION_MAX_SCORE (50.0)"
    error_id: ERR_FAULT_SUPPRESSION_FORBIDDEN
    http_status: 422
    applies_to: "POST /energy-ops/fault-diagnostics/{id}/triage with outcome = SUPPRESS"
  - priority: 90
    category: business_referential
    rule: "the setpoint standard named by body standard_id has status == PUBLISHED, and at activation the standard still bound to the store has status == PUBLISHED"
    error_id: ERR_STANDARD_NOT_PUBLISHED
    http_status: 409
    applies_to: "POST /energy-ops/stores/{id}/bms-commissioning, POST /energy-ops/stores/{id}/bms-activation, POST /energy-ops/setpoint-standards/{id}/publish (the predecessor named by supersedes_standard_id)"
  - priority: 91
    category: business_referential
    rule: "the setpoint standard's climate_zone and store_format both match the store's"
    error_id: ERR_STANDARD_SCOPE_MISMATCH
    http_status: 422
    applies_to: "POST /energy-ops/stores/{id}/bms-commissioning"
  - priority: 92
    category: business_referential
    rule: "the store's bms_status is ACTIVE or DEGRADED before refrigeration cases, fault diagnostics, lighting overrides or retrofit approvals are accepted"
    error_id: ERR_BMS_NOT_COMMISSIONED
    http_status: 409
    applies_to: "POST /energy-ops/stores/{id}/refrigeration-cases, POST /energy-ops/stores/{id}/fault-diagnostics, POST /energy-ops/stores/{id}/lighting-overrides, POST /energy-ops/retrofit-projects/{id}/approve"
  - priority: 93
    category: business_referential
    rule: "the owning account's dr_enrollment_state is ENROLLED before a demand-response event is created or notified"
    error_id: ERR_DR_ENROLLMENT_SUSPENDED
    http_status: 409
    applies_to: "POST /energy-ops/utility-accounts/{id}/demand-response-events, POST /energy-ops/demand-response-events/{id}/notify"
  - priority: 94
    category: business_referential
    rule: "a bill adjustment is refused while the owning account has tariff_state == PENDING_SWITCH"
    error_id: ERR_TARIFF_SWITCH_IN_PROGRESS
    http_status: 409
    applies_to: "POST /energy-ops/utility-bills/{id}/adjustment"
  - priority: 100
    category: business_constraint
    rule: "at most one SetpointStandard in status DRAFT or PUBLISHED may exist per (climate_zone, store_format, season) triple, EXCEPT that a DRAFT successor which names the existing PUBLISHED standard of that triple in supersedes_standard_id is admitted"
    error_id: ERR_DUPLICATE_STANDARD_SCOPE
    http_status: 409
    applies_to: "POST /energy-ops/setpoint-standards"
  - priority: 101
    category: business_constraint
    rule: "a lighting override must not overlap another override of the same store and zone in state SCHEDULED or ACTIVE; windows are HALF-OPEN [start_iso, end_iso), so a window starting exactly when another ends is admitted"
    error_id: ERR_OVERRIDE_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /energy-ops/stores/{id}/lighting-overrides"
  - priority: 102
    category: business_constraint
    rule: "a demand-response event must not overlap another event of the same utility account in event_state SCHEDULED, NOTIFIED or ACTIVE; windows are CLOSED [curtailment_start_iso, curtailment_end_iso] and additionally separated by a mandatory DR_RECOVERY_GAP_MINUTES (240) recovery gap measured from the earlier event's curtailment_end_iso"
    error_id: ERR_DR_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /energy-ops/utility-accounts/{id}/demand-response-events"
  - priority: 103
    category: business_constraint
    rule: "a work order window must not overlap another SCHEDULED work order on the same equipment_ref, treating windows as CLOSED intervals; the work order being rescheduled is excluded from its own conflict set"
    error_id: ERR_WORK_ORDER_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /energy-ops/work-orders/{id}/schedule"
  - priority: 104
    category: business_constraint
    rule: "calculations.dr_baseline_kw finds at least one eligible interval"
    error_id: ERR_BASELINE_DATA_INSUFFICIENT
    http_status: 422
    applies_to: "POST /energy-ops/demand-response-events/{id}/notify"
  - priority: 105
    category: business_constraint
    rule: "calculations.period_peak_demand finds at least one eligible interval under the account's rate_family"
    error_id: ERR_DEMAND_DATA_MISSING
    http_status: 422
    applies_to: "POST /energy-ops/utility-bills/{id}/recompute"
  - priority: 110
    category: business_temporal
    rule: "an event may only be activated at or after curtailment_start_iso, and may only be settled at or after curtailment_end_iso"
    error_id: ERR_CURTAILMENT_NOT_ELAPSED
    http_status: 422
    applies_to: "POST /energy-ops/demand-response-events/{id}/activate, /settle"
  - priority: 111
    category: business_temporal
    rule: "a tariff switch is refused while clock < account.tariff_locked_until_iso, and body effective_from_iso must be strictly after the clock"
    error_id: ERR_TARIFF_LOCK_ACTIVE
    http_status: 409
    applies_to: "POST /energy-ops/utility-accounts/{id}/tariff-switch"
  - priority: 112
    category: business_temporal
    rule: "mv_period_days >= MV_MIN_PERIOD_DAYS (60) and install_completed_iso is at or before the clock"
    error_id: ERR_MV_PERIOD_TOO_SHORT
    http_status: 422
    applies_to: "POST /energy-ops/retrofit-projects/{id}/submit-measurement"
  - priority: 120
    category: business_fiscal
    rule: "round(store.override_kwh_used_month + projected_kwh, 2) <= store.override_budget_kwh_month (equality admitted)"
    error_id: ERR_OVERRIDE_BUDGET_EXCEEDED
    http_status: 422
    applies_to: "POST /energy-ops/stores/{id}/lighting-overrides"
  - priority: 121
    category: business_fiscal
    rule: "at most WORK_ORDER_STORE_CAPACITY (2) work orders of the same store may occupy mutually overlapping windows: the request is rejected when 2 or more other SCHEDULED work orders of the same store already overlap the requested window, regardless of equipment_ref"
    error_id: ERR_WORK_ORDER_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /energy-ops/work-orders/{id}/schedule"
  - priority: 122
    category: business_fiscal
    rule: "calculations.tariff_switch_projection yields switch_recommended == true"
    error_id: ERR_TARIFF_SWITCH_NOT_JUSTIFIED
    http_status: 422
    applies_to: "POST /energy-ops/utility-accounts/{id}/tariff-switch"

# =============================================================================
# 1.5 API Endpoint Table  (54 endpoints: 20 reads + 34 mutations)
#   `input:` lists body fields for mutations and query parameters for reads;
#   a trailing `?` marks an optional field.
