  # ===========================================================================
  # Section: validations
  # ===========================================================================
  - section: validations
    instances:
      - name: missing_x_user_role_header_returns_unauthenticated
        claim_type: Violation → Error
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "Request to any non-public endpoint without X-User-Role header returns 401 ERR_UNAUTHENTICATED."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /v1/loans"
              payload: {}
              as: ""
              as_user_id: ""
              captures: { err: $.data.error_id }
          assert:
            - "response.status_code == 401"
            - "response.error_id == ERR_UNAUTHENTICATED"

      - name: borrower_listing_other_borrowers_returns_not_resource_owner
        claim_type: Violation → Error
        grounds:
          - validations[priority=11]
          - errors[ERR_NOT_RESOURCE_OWNER]
        distinguishing_aspect: "Borrower role attempting GET /v1/loans/{loan_id} for a loan owned by a different borrower returns 403 ERR_NOT_RESOURCE_OWNER."
        test_recipe:
          setup: ["Two Borrowers each with one Loan; Borrower B attempts to read Borrower A's loan."]
          setup_api_calls:
            - call: "POST /v1/_clock/advance"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: LoanServicer
              as_user_id: "svc-1"
            - call: "POST /v1/borrowers"
              payload: { ssn_last4: "1717", full_name: "Owner A", date_of_birth: "1990-01-01", email: "ownera@example.com" }
              as: LoanServicer
              as_user_id: "svc-1"
              captures: { brw_a: $.data.id }
            - call: "POST /v1/borrowers"
              payload: { ssn_last4: "1818", full_name: "Other B", date_of_birth: "1990-01-01", email: "otherb@example.com" }
              as: LoanServicer
              as_user_id: "svc-1"
              captures: { brw_b: $.data.id }
            - call: "POST /v1/loans"
              payload: { borrower_id: "${brw_a}", loan_type: "DIRECT_UNSUBSIDIZED", original_principal_cents: 100000, interest_rate_bps: 0, disbursement_date: "2026-06-01" }
              as: LoanServicer
              as_user_id: "svc-1"
              captures: { loan_a: $.data.id }
          trigger:
            - call: "GET /v1/loans/${loan_a}"
              payload: {}
              as: Borrower
              as_user_id: "${brw_b}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status_code == 403"
            - "response.error_id == ERR_NOT_RESOURCE_OWNER"

      - name: validation_priority_existence_before_state
        claim_type: Priority Ordering
        grounds:
          - validations[priority=20]
          - validations[priority=21]
        distinguishing_aspect: "Request that fails BOTH existence (non-existent loan_id) AND state (would-be invalid) returns ERR_NOT_FOUND (priority 20), not ERR_INVALID_STATE."
        test_recipe:
          setup: ["Empty DB (no loans)."]
          setup_api_calls:
            - call: "POST /v1/_clock/advance"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: LoanServicer
              as_user_id: "svc-1"
          trigger:
            - call: "POST /v1/loans/00000000-0000-0000-0000-000000000000/servicing-events"
              payload: { event_type: "DEFERMENT_END", effective_on: "2026-06-01", reason_code: "OTHER" }
              as: LoanServicer
              as_user_id: "svc-1"
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_NOT_FOUND"
            - "response.http_status == 404"

      - name: certification_period_end_before_start_returns_invalid
        claim_type: Violation → Error
        grounds:
          - validations[priority=28]
          - errors[ERR_CERTIFICATION_FIELDS_INVALID]
        distinguishing_aspect: "POST /employment-certifications with period_end_on < period_start_on returns 422 ERR_CERTIFICATION_FIELDS_INVALID."
        test_recipe:
