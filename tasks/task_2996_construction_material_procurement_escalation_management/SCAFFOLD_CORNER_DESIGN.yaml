        captures: {sup2_id: $.data.id}
      - call: POST /procurement/quotes
        payload: {material_package_id: '${pkg_id}', supplier_id: '${sup2_id}', base_price: '1120000.00', received_at: '2026-08-01T00:00:00.000Z', price_hold_days: 45}
        as: SupplierRep
        as_user_id: ${sup2_id}
        captures: {q2_id: $.data.id}
      - call: GET /procurement/projects/${proj_id}
        payload: {}
        as: BuyoutManager
        captures: {pv1: $.data.version}
      - call: POST /procurement/purchase-commitments
        payload: {quote_id: '${q_id}', po_number: PO-2996-0001, expected_project_version: '${pv1}', is_early_buyout: false}
        as: BuyoutManager
        captures: {pc1_id: $.data.id}
      - call: GET /procurement/projects/${proj_id}
        payload: {}
        as: BuyoutManager
        captures: {pv2: $.data.version}
      trigger:
      - call: POST /procurement/purchase-commitments
        payload: {quote_id: '${q2_id}', po_number: PO-2996-0002, expected_project_version: '${pv2}', is_early_buyout: false}
        as: BuyoutManager
        captures: {err: $.data.error_id}
      - call: GET /procurement/quotes/${q2_id}
        payload: {}
        as: BuyoutManager
      - call: GET /procurement/projects/${proj_id}
        payload: {}
        as: BuyoutManager
      assert:
      - the first trigger call fails with error_id ERR_PACKAGE_ALREADY_COMMITTED and HTTP 409
      - Quote.${q2_id}.status == OPEN (the rejected buyout did not convert it)
      - MaterialPackage.${pkg_id}.open_quote_count == 2
      - MaterialPackage.${pkg_id}.status == BOUGHT_OUT (from the first, still PENDING, commitment)
      - Project.${proj_id}.version == ${pv2} and committed_total_cost == 0.00
  - name: cross_entity_validation_a_clause_from_another_quote_is_a_mismatch
    claim_type: cross_entity_validation
    grounds:
    - validations[priority=65]
    - errors[ERR_AGREEMENT_QUOTE_MISMATCH]
    - entities.EscalationAgreement.fields.quote_id
    distinguishing_aspect: 'Attachability (priority 60) passes because the clause is EXECUTED, and the referential check at priority 65 is what fires: the clause hangs off the first supplier''s quote while the buyout is against the second supplier''s quote, so ERR_AGREEMENT_QUOTE_MISMATCH (422) is returned rather than any state error.'
    test_recipe:
      setup:
