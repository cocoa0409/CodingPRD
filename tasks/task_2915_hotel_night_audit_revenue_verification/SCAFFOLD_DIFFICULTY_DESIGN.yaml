              captures: { bd_empty_id: "$.data.id" }
            - call: "POST /night-audit/business-dates/${bd_empty_id}/post-room-and-tax"
              payload: {}
              as: NightAuditor
              as_user_id: "u_na_1"
            - call: "POST /night-audit/business-dates"
              payload: { property_id: "${prop_id}", business_date: "2026-08-02", out_of_order_room_count: 100 }
              as: NightAuditor
              as_user_id: "u_na_1"
              captures: { bd_noavail_id: "$.data.id" }
            - call: "POST /night-audit/folios"
              payload: { property_id: "${prop_id}", arrival_business_date_id: "${bd_noavail_id}", confirmation_code: "CF-9501", guest_name: "Tam Fox", room_number: "907", nights_count: 1, contracted_rate_amount: 200.00, rate_plan_code: "BAR", market_segment: "TRANSIENT", settlement_method: "CASH", scheduled_checkout_at: "2026-08-03T11:00:00.000Z" }
              as: FrontDeskAgent
