              as: Bidder
              as_user_id: "${bidder_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T18:05:00Z" }
              as: PlatformAdmin
            - call: "POST /auction-lots/${lot_id}/close"
              payload: {}
              as: AuctionOps
              as_user_id: "ops-closer-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T18:10:00Z" }
              as: PlatformAdmin
            - call: "POST /auction-lots/${lot_id}/sale-contract"
              payload: {}
