  # ---------------------------------------------------------------------------
  - section: cross_cutting_layers
    instances:
      - name: occ_stale_version_on_retirement_approve_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[retirement-approve-stale-application]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "Approver captured version 4, then a review cycle bumped it to 5; approve with expected_application_version=4 -> 412 ERR_STALE_VERSION; re-read and approve with 5 succeeds."
        test_recipe:
          setup: ["Vested member (5 lines, FAS 5,000,000), application UNDER_REVIEW after one RETURN/REVIEW_OK cycle; approver holds a stale version from before the second review"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: FundAdmin }
            - call: "POST /pension-funds"
              payload: { fund_name: "State Retirement", cola_rate_pct: 0.025, earnings_limit_annual_cents: 3000000 }
              as: FundAdmin
            - call: "POST /employers"
              payload: { name: "City Hall", employer_code: "CH" }
              as: FundAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /members"
              payload: { employer_id: "${emp_id}", full_name: "Stale Stella", date_of_birth: "1966-01-01", hire_date: "2016-01-01" }
              as: MemberServicesAnalyst
              captures: { mem_id: $.data.id }
            - call: "POST /employers/${emp_id}/contribution-reports"
              payload: { period_start: "2019-01-01", period_end: "2024-01-01", declared_total_cents: 2000000 }
              as: EmployerClerk
              as_user_id: "${emp_id}"
              captures: { rep1: $.data.id }
            - { call: "POST /contribution-reports/${rep1}/lines", payload: { member_id: "${mem_id}", fiscal_year: 2019, period_salary_cents: 5000000, contribution_amount_cents: 400000 }, as: EmployerClerk, as_user_id: "${emp_id}", captures: { z19: $.data.id } }
            - { call: "POST /contribution-reports/${rep1}/lines", payload: { member_id: "${mem_id}", fiscal_year: 2020, period_salary_cents: 5000000, contribution_amount_cents: 400000 }, as: EmployerClerk, as_user_id: "${emp_id}", captures: { z20: $.data.id } }
            - { call: "POST /contribution-reports/${rep1}/lines", payload: { member_id: "${mem_id}", fiscal_year: 2021, period_salary_cents: 5000000, contribution_amount_cents: 400000 }, as: EmployerClerk, as_user_id: "${emp_id}", captures: { z21: $.data.id } }
            - { call: "POST /contribution-reports/${rep1}/lines", payload: { member_id: "${mem_id}", fiscal_year: 2022, period_salary_cents: 5000000, contribution_amount_cents: 400000 }, as: EmployerClerk, as_user_id: "${emp_id}", captures: { z22: $.data.id } }
            - { call: "POST /contribution-reports/${rep1}/lines", payload: { member_id: "${mem_id}", fiscal_year: 2023, period_salary_cents: 5000000, contribution_amount_cents: 400000 }, as: EmployerClerk, as_user_id: "${emp_id}", captures: { z23: $.data.id } }
            - { call: "POST /contribution-reports/${rep1}/submit", payload: {}, as: EmployerClerk, as_user_id: "${emp_id}" }
            - { call: "POST /contribution-reports/${rep1}/lines/${z19}/review", payload: { decision: "ACCEPT" }, as: MemberServicesAnalyst }
            - { call: "POST /contribution-reports/${rep1}/lines/${z20}/review", payload: { decision: "ACCEPT" }, as: MemberServicesAnalyst }
            - { call: "POST /contribution-reports/${rep1}/lines/${z21}/review", payload: { decision: "ACCEPT" }, as: MemberServicesAnalyst }
            - { call: "POST /contribution-reports/${rep1}/lines/${z22}/review", payload: { decision: "ACCEPT" }, as: MemberServicesAnalyst }
            - { call: "POST /contribution-reports/${rep1}/lines/${z23}/review", payload: { decision: "ACCEPT" }, as: MemberServicesAnalyst }
            - { call: "POST /contribution-reports/${rep1}/finalize", payload: {}, as: MemberServicesAnalyst }
            - call: "POST /members/${mem_id}/retirement-applications"
              payload: { option_election: "SINGLE_LIFE" }
              as: Member
              as_user_id: "${mem_id}"
              captures: { app_id: $.data.id }
            - { call: "POST /retirement-applications/${app_id}/submit", payload: {}, as: Member, as_user_id: "${mem_id}" }
            - { call: "POST /retirement-applications/${app_id}/review", payload: { outcome: "REVIEW_OK" }, as: MemberServicesAnalyst, as_user_id: "analyst-1" }
            - call: "GET /retirement-applications/${app_id}"
              payload: {}
              as: BenefitApprover
              captures: { ver_seen: $.data.version }
            - { call: "POST /retirement-applications/${app_id}/review", payload: { outcome: "RETURN", review_note: "recheck salary" }, as: MemberServicesAnalyst, as_user_id: "analyst-1" }
            - { call: "POST /retirement-applications/${app_id}/review", payload: { outcome: "REVIEW_OK" }, as: MemberServicesAnalyst, as_user_id: "analyst-1" }
          trigger:
            - call: "POST /retirement-applications/${app_id}/approve"
              payload: { expected_application_version: "${ver_seen} - 1" }
              as: BenefitApprover
              as_user_id: "approver-1"
              captures: { err: $.data.error_id }
            - call: "GET /retirement-applications/${app_id}"
              payload: {}
              as: BenefitApprover
              captures: { ver_now: $.data.version }
            - call: "POST /retirement-applications/${app_id}/approve"
              payload: { expected_application_version: "${ver_now}" }
              as: BenefitApprover
              as_user_id: "approver-1"
              captures: { final_status: $.data.status }
          assert:
            - "First approve (stale version ver_seen - 1): error_id == ERR_STALE_VERSION, HTTP 412"
            - "Second approve (fresh version): status == APPROVED and final_monthly_cents == 35417"
            - "version on the approved application == ver_now + 1"

      - name: occ_stale_version_on_purchase_payment_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[purchase-payment-stale-plan]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "Payer captured version at plan open, pays installment 1 (version bumps), then replays the same expected version for installment 2 -> 412 ERR_STALE_VERSION."
        test_recipe:
          setup: ["Member with salary; purchase quoted 1,000,001 accepted into 12 installments; payment 1 applied with version pv0"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: FundAdmin }
            - call: "POST /pension-funds"
              payload: { fund_name: "State Retirement", cola_rate_pct: 0.025, earnings_limit_annual_cents: 3000000 }
              as: FundAdmin
            - call: "POST /employers"
              payload: { name: "City Hall", employer_code: "CH" }
              as: FundAdmin
              captures: { emp_id: $.data.id }
