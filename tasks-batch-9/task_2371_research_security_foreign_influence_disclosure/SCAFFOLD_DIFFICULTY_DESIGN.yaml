  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: grant_headcount_returns_to_two_after_suspend_and_conditional_restore
        grounds:
          - state_machines.Project.security_status.CLEARED_to_SUSPENDED
          - state_machines.Project.security_status.SUSPENDED_to_CLEARED
          - entities.Project.fields.active_grant_count
          - calculations.project_controlled_area_posture
          - entities.ControlledAccessGrant.fields.status_reason
        distinguishing_aspect: |
          active_grant_count is a conserved headcount: suspending the project drives it 2 -> 0 and
          the posture to LOCKED_DOWN, and re-clearing restores exactly the grants that carry
          status_reason PROJECT_SUSPENDED, in created_at ASC order, bringing the count back to
          precisely 2 with status_reason reset to NONE. Decrementing on a SUSPENDED-to-REVOKED
          path, or restoring grants suspended for other reasons, leaves the count off by one.
        test_recipe:
          setup:
            - "Logical clock at the default 2026-08-01T00:00:00Z."
            - "Project P with controlled_area_capacity 2 and security CLEARED."
            - "Investigators INV_A and INV_B, both ACTIVE personnel on P with COMPLETED CONTROLLED_AREA_SAFETY assignments."
            - "Grants G_A and G_B, both over [2026-09-01, 2026-12-01) and both ACTIVE, so active_grant_count is 2 and controlled_area_posture is RESTRICTED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /projects"
