    distinguishing_aspect: 'The at-risk component is min() over THREE independently computed candidates (risk-loaded remainder 4283491, risk-loaded cap 3598132, benefit-share cap of target_bonus_cents) and the winner changes with target_bonus_cents alone: at 30000000 the benefit cap is slack (6000000) so the 0.35 risk-loaded cap binds, at 10000000 the benefit cap (2000000) binds instead.'
    test_recipe:
