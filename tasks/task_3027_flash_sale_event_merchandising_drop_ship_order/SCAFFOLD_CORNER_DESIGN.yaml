  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:

      - name: purchase_order_create_with_a_stale_vendor_version_returns_stale_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[po-create-stale-vendor]
          - validations[priority=5]
          - errors.ERR_STALE_VERSION
          - endpoints.POST_/purchase-orders
        distinguishing_aspect: "The po-create-stale-vendor rule is a genuine OCC race rather than a state precondition: a second buy for the same vendor and event would legitimately supersede the first under the product semantics, so it is refused only because the client's snapshot of the standing and floor fields the new buy would snapshot is stale."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. A vendor, shop and live event with a 10-unit listing; the vendor's version is read and then advanced by a first buy creation."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: Merchandiser
            - call: "POST /vendors"
              payload: { legal_name: "Northwind Outfitters", vendor_tier: "STANDARD" }
              as: Merchandiser
              captures: { vendor_id: $.data.id, vendor_v0: $.data.version }
            - call: "POST /shops"
              payload: { vendor_id: "${vendor_id}", shop_name: "Northwind Brand Shop" }
              as: Merchandiser
              captures: { shop_id: $.data.id }
            - call: "POST /events"
              payload: { shop_id: "${shop_id}", event_title: "OCC Event", starts_at: "2026-09-01T00:00:00Z", ends_at: "2026-09-10T00:00:00Z", ship_time_quote_days: 14 }
              as: Merchandiser
              captures: { event_id: $.data.id }
            - call: "POST /listings"
              payload: { event_id: "${event_id}", vendor_sku: "NW-OCC-1", unit_price_cents: 300, vendor_unit_cost_cents: 150, allocation_units: 10, reveal_at: "2026-09-01T00:00:00Z" }
              as: Merchandiser
            - call: "POST /events/${event_id}/schedule"
              payload: {}
              as: Merchandiser
            - call: "POST /events/${event_id}/launch"
              payload: {}
              as: Merchandiser
          trigger:
            - call: "POST /purchase-orders"
              payload: { vendor_id: "${vendor_id}", event_id: "${event_id}", expected_vendor_version: "${vendor_v0}" }
              as: InventoryPlanner
            - call: "POST /purchase-orders"
              payload: { vendor_id: "${vendor_id}", event_id: "${event_id}", expected_vendor_version: "${vendor_v0}" }
              as: InventoryPlanner
              captures: { error_id: $.data.error_id }
          assert:
            - "the first create succeeds with 201 because ${vendor_v0} is the version the client last observed"
            - "the second create returns 412 and error_id == ERR_STALE_VERSION"
            - "GET /vendors/${vendor_id} reports a version strictly greater than ${vendor_v0} — the first create's own side effect advanced it"
            - "GET /purchase-orders?vendor_id=${vendor_id} returns exactly 1 row, so the stale create persisted nothing"
            - "the second create is not a state rejection: the vendor is still STANDARD/EXCELLENT and a buy for the same event is a permitted superseding write once the fresh vendor version is supplied"

      - name: return_request_create_with_a_stale_confirmation_version_returns_stale_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[return-request-stale-confirmation]
          - validations[priority=5]
          - errors.ERR_STALE_VERSION
          - endpoints.POST_/returns
        distinguishing_aspect: "The return-request-stale-confirmation rule is a genuine OCC race on a second entity family: revising an undecided ReturnRequest on the same line is legitimate, so the second create is refused only because the line's version — and therefore the settlement basis the new request would be computed from — has moved."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. A vendor, shop and live event with a listing, an order with one confirmed line, captured and consolidated into a dispatched and delivered parcel."
            - "The line's version is read while the order is still CROSS_DOCKED, before any return is filed."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: Merchandiser
            - call: "POST /vendors"
              payload: { legal_name: "Northwind Outfitters", vendor_tier: "STANDARD" }
              as: Merchandiser
              captures: { vendor_id: $.data.id, vendor_v0: $.data.version }
            - call: "POST /shops"
              payload: { vendor_id: "${vendor_id}", shop_name: "Northwind Brand Shop" }
              as: Merchandiser
              captures: { shop_id: $.data.id }
            - call: "POST /events"
              payload: { shop_id: "${shop_id}", event_title: "Return OCC Event", starts_at: "2026-09-01T00:00:00Z", ends_at: "2026-09-10T00:00:00Z", ship_time_quote_days: 14 }
              as: Merchandiser
              captures: { event_id: $.data.id }
            - call: "POST /listings"
              payload: { event_id: "${event_id}", vendor_sku: "NW-ROC-1", unit_price_cents: 800, vendor_unit_cost_cents: 400, allocation_units: 5, reveal_at: "2026-09-01T00:00:00Z" }
              as: Merchandiser
              captures: { listing_id: $.data.id }
            - call: "POST /events/${event_id}/schedule"
              payload: {}
              as: Merchandiser
            - call: "POST /events/${event_id}/launch"
              payload: {}
              as: Merchandiser
            - call: "POST /customers"
              payload: { email: "c1@example.com", full_name: "Casey One" }
              as: Any
              captures: { customer_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${customer_id}" }
              as: Customer
              as_user_id: "${customer_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/lines"
              payload: { listing_id: "${listing_id}", quantity: 1 }
              as: Customer
              as_user_id: "${customer_id}"
              captures: { line_id: $.data.id }
            - call: "POST /orders/${order_id}/submit"
              payload: {}
              as: Customer
              as_user_id: "${customer_id}"
            - call: "POST /purchase-orders"
              payload: { vendor_id: "${vendor_id}", event_id: "${event_id}", expected_vendor_version: "${vendor_v0}" }
              as: InventoryPlanner
              captures: { po_id: $.data.id }
            - call: "POST /purchase-orders/${po_id}/add-line"
              payload: { listing_id: "${listing_id}", quantity_ordered: 1 }
              as: InventoryPlanner
            - call: "POST /purchase-orders/${po_id}/issue"
              payload: { expected_vendor_version: "${vendor_v0}" }
              as: InventoryPlanner
            - call: "POST /confirmations/${line_id}/confirm"
              payload: { confirm_units: 1 }
              as: Vendor
              as_user_id: "${vendor_id}"
            - call: "POST /vendor-shipments"
              payload: { purchase_order_id: "${po_id}", quantity_shipped: 1, carrier_tracking_code: "ROC-TRK-1", shipped_at: "2026-09-01T06:00:00Z", allocations: [{ listing_id: "${listing_id}", quantity: 1 }] }
              as: Vendor
              as_user_id: "${vendor_id}"
              captures: { ship_id: $.data.id }
            - call: "POST /vendor-shipments/${ship_id}/receive"
              payload: { arrived_at: "2026-09-01T09:00:00Z", bucket_units_reported: 1 }
              as: CrossDockOperator
            - call: "POST /orders/${order_id}/capture"
              payload: {}
              as: InventoryPlanner
            - call: "GET /orders/${order_id}"
              payload: {}
              as: Any
              captures: { order_v_pre_consolidate: $.data.version }
            - call: "POST /orders/${order_id}/consolidate"
              payload: { expected_order_version: "${order_v_pre_consolidate}" }
              as: CrossDockOperator
              captures: { parcel_id: $.data.id }
            - call: "POST /parcels/${parcel_id}/seal"
              payload: {}
              as: CrossDockOperator
            - call: "POST /parcels/${parcel_id}/dispatch"
              payload: {}
              as: CrossDockOperator
            - call: "POST /parcels/${parcel_id}/deliver"
              payload: {}
              as: CrossDockOperator
            - call: "GET /confirmations/${line_id}"
              payload: {}
              as: Any
              captures: { line_v_stale: $.data.version }
          trigger:
            - call: "POST /returns"
              payload: { confirmation_id: "${line_id}", reason_code: "DAMAGED", expected_confirmation_version: "${line_v_stale}" }
              as: Customer
              as_user_id: "${customer_id}"
              captures: { return_id: $.data.id }
            - call: "POST /returns"
              payload: { confirmation_id: "${line_id}", reason_code: "NOT_AS_DESCRIBED", expected_confirmation_version: "${line_v_stale}" }
              as: Customer
              as_user_id: "${customer_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "the first return succeeds with 201 and Confirmation.${line_id}.version has advanced past ${line_v_stale}"
            - "the second return returns 412 and error_id == ERR_STALE_VERSION"
            - "GET /confirmations/${line_id}/returns returns exactly 1 row, the first request"
            - "the second request is not a state rejection: the line is still SHIPPED and a superseding return on the same line is a permitted write once the fresh confirmation version is supplied"
            - "the refused request moved no balance: GET /customers/${customer_id} reports unchanged store_credit_balance_cents and refund_balance_cents"

  # ===========================================================================
  # §1.8 coverage stubs — corners already exercised by a named difficulty
  # instance. No test_recipe is emitted for these.
  # ===========================================================================
  - section: state_machines
    instances:

      - name: stub_cascade_side_effects_on_short_ship_exercised_by_difficulty
        claim_type: Side Effect Execution
        grounds:
          - state_machines.PurchaseOrder.ISSUED_to_CLOSED_SHORT
          - state_machines.Confirmation.VENDOR_CONFIRMED_to_SHORT_SHIPPED
        excluded_because:
          difficulty_instance: po_close_short_four_hop_cascade_to_refund
          rationale: "Each hop's side effect is asserted at the named instance, which walks the chain hop by hop and pins the ordered state of the two axes."

      - name: stub_initial_states_of_the_two_order_axes_exercised_by_difficulty
        claim_type: Initial State
        grounds:
          - state_machines.CustomerOrder.order_status
          - state_machines.CustomerOrder.payment_status
        excluded_because:
          difficulty_instance: customer_order_dual_axis_parallel_state
          rationale: "A newly created order's AGGREGATING and AUTHORIZED starting values on both axes are asserted as the precondition of the named instance."

  - section: calculations
    instances:

      - name: stub_dual_variant_divergence_exercised_by_difficulty
        claim_type: Variant Divergence
        grounds:
          - calculations.order_refund_claim
          - calculations.oversell_allocation
        excluded_because:
          difficulty_instance: order_refund_variant_divergence_on_short_shipped_line
          rationale: "The same-inputs-different-results property of both dual-variant calculations is asserted directly by the two named Rule 1 instances."

      - name: stub_penalty_cap_result_exercised_by_difficulty
        claim_type: Correct Result
        grounds:
          - calculations.event_net_contribution
          - calculations.event_net_contribution.constants[MAX_PENALTY_RATE]
        excluded_because:
          difficulty_instance: event_net_contribution_nested_min_max_with_penalty_cap
          rationale: "The min-clamped penalty and the max-clamped floor are computed to literal cents in the named instance's assertions."

      - name: stub_nested_rounding_order_exercised_by_difficulty
        claim_type: Precision
        grounds:
          - calculations.cross_dock_dispatch_eta
        excluded_because:
          difficulty_instance: cross_dock_eta_pins_per_line_days_before_the_cutoff_roll
          rationale: "The pinned order of the per-line day count and the dispatch cut-off roll is asserted as the difference between the accepted and rejected landing instants."

  - section: validations
    instances:

      - name: stub_priority_ordering_conflict_exercised_by_difficulty
        claim_type: Priority Ordering
        grounds:
          - validations[priority=6]
          - validations[priority=10]
        excluded_because:
          difficulty_instance: cancellation_state_precondition_defeats_closed_window
          rationale: "The state-versus-temporal ordering of the two priorities is asserted by the named Rule 5 instance when both rules are violated at once."

      - name: stub_cross_entity_validation_exercised_by_difficulty
        claim_type: Cross-entity validation
        grounds:
          - state_machines.CustomerOrder.AGGREGATING_to_AWAITING_VENDOR
          - state_machines.Shop.OPEN_to_SUSPENDED
        excluded_because:
          difficulty_instance: order_submission_requires_shop_open_and_event_live
          rationale: "The order transition's dependence on a field of a wholly different entity is asserted by the named Rule 7 instance, including the removal of the gate."

      - name: stub_aggregate_validation_exercised_by_difficulty
        claim_type: Aggregate validation
        grounds:
          - calculations.cross_dock_bucket_capacity
          - errors.ERR_DOCK_BUCKET_CAPACITY_EXCEEDED
        excluded_because:
          difficulty_instance: cross_dock_six_hour_bucket_aggregate_capacity_conflict
          rationale: "The individually-valid-but-collectively-over-capacity property is asserted by the named Rule 8 instance, which refuses a shipment that would fit alone."

  - section: errors
    instances:

      - name: stub_fill_rate_error_exercised_by_difficulty
        claim_type: violation_to_error
        grounds:
          - errors.ERR_FILL_RATE_BELOW_FLOOR
          - validations[priority=11]
        excluded_because:
          difficulty_instance: ramped_fill_rate_floor_inclusive_at_the_boundary
          rationale: "Both the refusal one ten-thousandth below the floor and the admission exactly at it are asserted as the failure and success paths of the named Rule 6 instance."

      - name: stub_dock_capacity_error_exercised_by_difficulty
        claim_type: violation_to_error
        grounds:
          - errors.ERR_DOCK_BUCKET_CAPACITY_EXCEEDED
          - validations[priority=10]
        excluded_because:
          difficulty_instance: cross_dock_zero_count_bucket_boundary_is_exclusive
          rationale: "The bucket-overflow refusal and the exactly-at-cap admission are asserted as the two outcomes of the named Rule 6 instance."

      - name: stub_brand_window_error_exercised_by_difficulty
        claim_type: violation_to_error
        grounds:
          - errors.ERR_BRAND_WINDOW_OVERLAP
          - validations[priority=9]
        excluded_because:
          difficulty_instance: shop_brand_window_closed_interval_buffer_overlap
          rationale: "The buffered-window collision refusal, including the touching-boundary case, is asserted by the named Rule 8 instance."

  - section: cross_cutting_complexity_layers
    instances:

      - name: stub_cascading_side_effects_exercised_by_difficulty
        claim_type: cascading_side_effects
        grounds:
          - state_machines.Event.LIVE_to_CLOSED
          - state_machines.CustomerOrder.AWAITING_VENDOR_to_CANCELLED
        excluded_because:
          difficulty_instance: event_close_three_hop_cascade_to_refund_ledger
          rationale: "The depth-3 close cascade and its ledger consequence are asserted hop by hop by the named Rule 4 instance."

      - name: stub_dual_variant_switch_exercised_by_difficulty
        claim_type: dual_variant_calculation
        grounds:
          - calculations.event_net_contribution.variants[projected_while_live]
          - calculations.event_net_contribution.variants[realized_on_closure]
        excluded_because:
          difficulty_instance: order_refund_variant_divergence_on_short_shipped_line
          rationale: "The switch between the two valid algorithms for the same inputs is asserted by the named Rule 1 instance, which returns both variants' figures for one line."
