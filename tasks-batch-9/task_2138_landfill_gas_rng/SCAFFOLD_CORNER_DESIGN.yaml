              as: ComplianceOfficer
              as_user_id: "officer-alice"
              captures: { cr_id: $.data.id }
            - call: "POST /compliance-reports/${cr_id}/status"
              payload: { to_status: "SUBMITTED" }
              as: ComplianceOfficer
              as_user_id: "officer-alice"
            - call: "POST /compliance-reports/${cr_id}/status"
              payload: { to_status: "UNDER_REVIEW" }
              as: ComplianceOfficer
              as_user_id: "officer-bob"
            - call: "POST /compliance-reports/${cr_id}/status"
              payload: { to_status: "RETURNED", return_reason: "Stack test data not attached" }
              as: ComplianceOfficer
              as_user_id: "officer-bob"
          trigger:
            - call: "POST /compliance-reports/${cr_id}/status"
              payload: { to_status: "DRAFT" }
              as: ComplianceOfficer
              as_user_id: "officer-alice"
            - call: "POST /compliance-reports/${cr_id}/status"
              payload: { to_status: "SUBMITTED" }
              as: ComplianceOfficer
              as_user_id: "officer-alice"
          assert:
            - "After the DRAFT call ComplianceReport.${cr_id}.status == DRAFT and revision_count == 1"
            - "After the SUBMITTED call ComplianceReport.${cr_id}.status == SUBMITTED and revision_count == 1"
            - "ComplianceReport.${cr_id}.prepared_by_user_id == 'officer-alice'"
            - "ComplianceReport.${cr_id}.reviewed_by_user_id == 'officer-bob'"
            - "ComplianceReport.${cr_id}.exceedance_flag == false"
            - "LandfillSite.${site_id}.compliance_posture == COMPLIANT"

