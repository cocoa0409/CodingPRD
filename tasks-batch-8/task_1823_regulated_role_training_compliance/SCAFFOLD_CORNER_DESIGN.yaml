        distinguishing_aspect: "Employee (entity-backed) calling the ComplianceAdmin-only campaign open endpoint is denied at role check (P2), before any state evaluation."
        test_recipe:
          setup: ["Regulator REG-RB4; campaign CMP-RB4 DRAFT (window 2026-08-01..2026-09-01); clock 2026-08-03T09:00:00Z"]
