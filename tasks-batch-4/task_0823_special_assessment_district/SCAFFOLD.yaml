scenario: "Special Assessment District & Improvement Bond: district formation & parcel benefit, assessment-roll apportionment, bond levy & annual installment, prepayment/payoff calculation, delinquency & foreclosure, reassessment/reallocation, disclosure report, lien"
domain_name: "special-assessment-district"
api_prefix: ""

complexity_profile:
  primary_archetype: "Pricing engine"
  secondary_archetype: "Compliance / audit"
  complexity_layers:
    - "dual_variant_calculation"
    - "cascading_side_effects"
    - "rate_threshold_triggers"
    - "optimistic_concurrency"

  entity_topology: "flat"
  # Peer entities (District, Parcel, Roll, Bond, Installment, Payment, PayoffQuote,
  # Lien, Foreclosure) linked by explicit foreign keys; Parcel is self-referential
  # (parent_parcel_id) so subdivisions form a shallow tree without URL nesting.

  state_machine_shape: "branching"
  # District close-hearing forks FORMED vs ABANDONED with divergent side effects;
  # Parcel cycles ACTIVE->IN_FORECLOSURE->ACTIVE; Foreclosure forks JUDGMENT->{SALE,REDEEMED}.

  relationship_patterns:
    - "one_to_many"
    - "self_referential"
    - "cross_aggregate"

  role_model: "peer_roles"
  # DistrictAdministrator owns formation/apportionment/bond; CountyTreasurer owns
  # money movement (payments, delinquency, payoff, redemption); ParcelOwner acts on
  # own parcel; Auditor is read-only.

  consistency_model: "immediate"

# Cross-cutting numeric constants referenced by §1.3 formulas and §1.4 rules.
# Every symbol used in any formula below is declared here or in the calc's own
# constants: block with a concrete value.
constants:
  GRACE_DAYS: 30                        # days after due_date before an unpaid installment may be marked DELINQUENT
  DELINQUENCY_PENALTY_PCT: 0.10         # one-time penalty on the delinquent installment's amount_due
  DELINQUENCY_MONTHLY_INTEREST_PCT: 0.015  # redemption interest accrued per whole month delinquent
  FORECLOSURE_DELINQUENT_THRESHOLD: 3   # count of DELINQUENT installments on a parcel required to initiate foreclosure
  QUOTE_VALIDITY_DAYS: 30               # a QUOTED payoff quote's valid_until = quote_date + this many days
  DAY_COUNT_BASIS: 360                  # 30/360 day-count denominator for accrued-interest proration
  DEFAULT_PROTEST_THRESHOLD_PCT: 50     # default majority-protest threshold when a district omits protest_threshold_pct
  DEFAULT_COUPON_RATE_BPS: 500          # default bond coupon rate in basis points (5.00%)
  DEFAULT_TERM_YEARS: 10                # default bond amortization term
  DEFAULT_RESERVE_FUND_PCT: 0.10        # default reserve fund as fraction of apportioned principal
  DEFAULT_ADMIN_FEE_BPS: 0              # default annual admin fee in basis points of outstanding principal
  DEFAULT_PREPAYMENT_PREMIUM_PCT: 0.03  # default prepayment premium as fraction of remaining principal
  ROUNDING: "round_half_up to whole cents (integer) unless a formula pins another order"

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ===========================================================================
# §1.1 Entity-Relationship Table
# ===========================================================================
entities:
  - name: AssessmentDistrict
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Human-readable district name"
      - name: formation_method
        type: enum
        source: input
        description: "Apportionment basis for this district"
        constraints: "one of BENEFIT_UNITS, FRONT_FOOTAGE, LAND_AREA"
      - name: total_project_cost_cents
        type: integer
        source: input
        description: "Total improvement construction cost to spread across parcels"
        constraints: ">= 0"
      - name: incidental_cost_cents
        type: integer
        source: input
        description: "Engineering/incidental costs added to the assessable total"
        default: 0
        constraints: ">= 0"
      - name: protest_threshold_pct
        type: number
        source: input
        description: "Majority-protest cutoff; abandon when protest weight ratio strictly exceeds this percent"
        default: 50
        constraints: "0 < value <= 100; defaults to DEFAULT_PROTEST_THRESHOLD_PCT"
      - name: status
        type: enum
        source: system
        description: "District lifecycle state"
        default: PROPOSED
        constraints: "one of PROPOSED, PROTEST_PERIOD, FORMED, ABANDONED"
      - name: total_benefit_units
        type: number
        source: computed
        description: "Sum over ACTIVE parcels of the weight selected by formation_method (benefit_units | front_footage_ft | land_area_sqft); apportionment denominator"
      - name: total_apportioned_principal_cents
        type: integer
        source: computed
        description: "Set when the district's DRAFT roll is CONFIRMED; equals total_project_cost_cents + incidental_cost_cents"
      - name: formed_at
        type: datetime
        source: system
        description: "Timestamp the district transitioned to FORMED; null otherwise"
        default: null

  - name: Parcel
    parent: AssessmentDistrict
    common_fields: true
    fields:
      - name: district_id
        type: string
        source: input
        description: "FK -> AssessmentDistrict.id"
      - name: parent_parcel_id
        type: string
        source: input
        description: "FK -> Parcel.id; null unless this parcel was created by a subdivision of another parcel"
        default: null
      - name: apn
        type: string
        source: input
        description: "Assessor Parcel Number, unique within a district"
      - name: owner_name
        type: string
        source: input
        description: "Current owner of record"
      - name: land_area_sqft
        type: number
        source: input
        description: "Parcel land area; apportionment weight when formation_method = LAND_AREA"
        constraints: ">= 0"
      - name: front_footage_ft
        type: number
        source: input
        description: "Parcel street frontage; apportionment weight when formation_method = FRONT_FOOTAGE"
        constraints: ">= 0"
      - name: benefit_units
        type: number
        source: input
        description: "Assigned benefit units; apportionment weight when formation_method = BENEFIT_UNITS; also the protest-weight unit"
        constraints: ">= 0"
      - name: assessed_principal_cents
        type: integer
        source: computed
        description: "Parcel's apportioned share of principal; set when the roll is CONFIRMED"
        default: 0
      - name: remaining_principal_cents
        type: integer
        source: computed
        description: "Unpaid principal ledger; initialized to assessed_principal_cents at roll confirm, debited by each PAID installment's principal_cents, zeroed on payoff"
        default: 0
      - name: status
        type: enum
        source: system
        description: "Parcel lifecycle state"
        default: ACTIVE
        constraints: "one of ACTIVE, SUBDIVIDED, PAID_OFF, IN_FORECLOSURE, WITHDRAWN"

  - name: ProtestFiling
    parent: Parcel
    common_fields: false
    fields:
      - name: parcel_id
        type: string
        source: input
        description: "FK -> Parcel.id"
      - name: filed_by
        type: string
        source: input
        description: "Name/identifier of the protesting owner of record"
      - name: weight_units
        type: number
        source: computed
        description: "Protest weight snapshot = the parcel's weight per the district's formation_method at filing time"

  - name: AssessmentRoll
    parent: AssessmentDistrict
    common_fields: true
    fields:
      - name: district_id
        type: string
        source: input
        description: "FK -> AssessmentDistrict.id"
      - name: method
        type: enum
        source: input
        description: "Apportionment basis used by this roll; defaults to the district's formation_method"
        constraints: "one of BENEFIT_UNITS, FRONT_FOOTAGE, LAND_AREA"
      - name: status
        type: enum
        source: system
        description: "Roll lifecycle state"
        default: DRAFT
        constraints: "one of DRAFT, CONFIRMED, SUPERSEDED"
      - name: total_apportioned_cents
        type: integer
        source: computed
        description: "Assessable total spread by this roll = district.total_project_cost_cents + district.incidental_cost_cents"
      - name: confirmed_at
        type: datetime
        source: system
        description: "Timestamp the roll was CONFIRMED; null otherwise"
        default: null

  - name: ImprovementBond
    parent: AssessmentDistrict
    common_fields: true
    fields:
      - name: district_id
        type: string
        source: input
        description: "FK -> AssessmentDistrict.id"
      - name: coupon_rate_bps
        type: integer
        source: input
        description: "Annual coupon rate in basis points"
        default: 500
        constraints: "> 0; defaults to DEFAULT_COUPON_RATE_BPS"
      - name: term_years
        type: integer
        source: input
        description: "Amortization term in whole years; number of annual installments generated per parcel"
        default: 10
        constraints: ">= 1; defaults to DEFAULT_TERM_YEARS"
      - name: issuance_date
        type: datetime
        source: input
        description: "Bond dated date; first installment due one year after this date"
      - name: reserve_fund_pct
        type: number
        source: input
        description: "Reserve fund as a fraction of apportioned principal"
        default: 0.10
        constraints: ">= 0; defaults to DEFAULT_RESERVE_FUND_PCT"
      - name: reserve_fund_cents
        type: integer
        source: computed
        description: "round_half_up(district.total_apportioned_principal_cents * reserve_fund_pct)"
      - name: issuance_cost_cents
        type: integer
        source: input
        description: "Underwriting/issuance costs folded into par"
        default: 0
        constraints: ">= 0"
      - name: admin_fee_bps
        type: integer
        source: input
        description: "Annual administrative fee in basis points of outstanding principal"
        default: 0
        constraints: ">= 0; defaults to DEFAULT_ADMIN_FEE_BPS"
      - name: prepayment_premium_pct
        type: number
        source: input
        description: "Prepayment premium as a fraction of remaining principal at payoff"
        default: 0.03
        constraints: ">= 0; defaults to DEFAULT_PREPAYMENT_PREMIUM_PCT"
      - name: par_amount_cents
        type: integer
        source: computed
        description: "district.total_apportioned_principal_cents + reserve_fund_cents + issuance_cost_cents"
      - name: status
        type: enum
        source: system
        description: "Bond lifecycle state"
        default: AUTHORIZED
        constraints: "one of AUTHORIZED, ISSUED, CALLED, RETIRED, DEFAULTED"

  - name: Installment
    parent: Parcel
    common_fields: true
    fields:
      - name: parcel_id
        type: string
        source: input
        description: "FK -> Parcel.id"
      - name: bond_id
        type: string
        source: input
        description: "FK -> ImprovementBond.id"
      - name: installment_year
        type: integer
        source: input
        description: "1-based amortization year; unique per (parcel_id, bond_id)"
        constraints: ">= 1"
      - name: due_date
        type: datetime
        source: input
        description: "Installment due date"
      - name: principal_cents
        type: integer
        source: computed
        description: "Principal component for this year (see amortization_schedule calc)"
        default: 0
      - name: interest_cents
        type: integer
        source: computed
        description: "Interest component = round_half_up(outstanding_principal * coupon_rate_bps/10000)"
        default: 0
      - name: admin_fee_cents
        type: integer
        source: computed
        description: "round_half_up(outstanding_principal * admin_fee_bps/10000)"
        default: 0
      - name: penalty_cents
        type: integer
        source: computed
        description: "One-time delinquency penalty; 0 until DELINQUENT"
        default: 0
      - name: redemption_interest_cents
        type: integer
        source: computed
        description: "Accrued redemption interest while DELINQUENT; 0 otherwise"
        default: 0
      - name: amount_due_cents
        type: integer
        source: computed
        description: "principal_cents + interest_cents + admin_fee_cents (+ penalty_cents + redemption_interest_cents when DELINQUENT)"
        default: 0
      - name: status
        type: enum
        source: system
        description: "Installment lifecycle state"
        default: SCHEDULED
        constraints: "one of SCHEDULED, DUE, PAID, DELINQUENT, DEFAULTED, CANCELLED"

  - name: Payment
    parent: Installment
    common_fields: false
    fields:
      - name: installment_id
        type: string
        source: input
        description: "FK -> Installment.id"
      - name: amount_cents
        type: integer
        source: input
        description: "Payment amount; must equal the installment's current amount_due_cents exactly"
        constraints: "> 0"
      - name: payment_date
        type: datetime
        source: input
        description: "Date the payment is received"
      - name: paid_by
        type: string
        source: input
        description: "Name/identifier of the payer"
      - name: reversed
        type: boolean
        source: system
        description: "True after this payment is reversed"
        default: false
      - name: reversed_at
        type: datetime
        source: system
        description: "Timestamp of reversal; null otherwise"
        default: null

  - name: PayoffQuote
    parent: Parcel
    common_fields: true
    fields:
      - name: parcel_id
        type: string
        source: input
        description: "FK -> Parcel.id"
      - name: quote_mode
        type: enum
        source: input
        description: "Payoff timing basis"
        constraints: "one of IMMEDIATE, NEXT_CALL_DATE"
      - name: quote_date
        type: datetime
        source: input
        description: "As-of date for the payoff computation"
      - name: remaining_principal_cents
        type: integer
        source: computed
        description: "Snapshot of parcel.remaining_principal_cents at quote time"
      - name: accrued_interest_cents
        type: integer
        source: computed
        description: "Interest accrued to quote basis (see payoff_quote calc variants)"
      - name: prepayment_premium_cents
        type: integer
        source: computed
        description: "round_half_up(remaining_principal_cents * bond.prepayment_premium_pct)"
      - name: reserve_credit_cents
        type: integer
        source: computed
        description: "Parcel's pro-rata reserve refund = round_half_up(remaining_principal_cents / district.total_apportioned_principal_cents * bond.reserve_fund_cents)"
      - name: total_payoff_cents
        type: integer
        source: computed
        description: "remaining_principal_cents + accrued_interest_cents + prepayment_premium_cents - reserve_credit_cents"
      - name: valid_until
        type: datetime
        source: computed
        description: "quote_date + QUOTE_VALIDITY_DAYS"
      - name: status
        type: enum
        source: system
        description: "Quote lifecycle state"
        default: QUOTED
        constraints: "one of QUOTED, HONORED, EXPIRED, VOIDED"

  - name: Lien
    parent: Parcel
    common_fields: true
    fields:
      - name: parcel_id
        type: string
        source: input
        description: "FK -> Parcel.id"
      - name: lien_type
        type: enum
        source: system
        description: "Kind of lien"
        constraints: "one of ASSESSMENT, DELINQUENCY"
      - name: amount_cents
        type: integer
        source: computed
        description: "Secured amount: parcel.remaining_principal_cents for ASSESSMENT liens; the delinquent installment amount_due_cents for DELINQUENCY liens"
      - name: recorded_date
        type: datetime
        source: system
        description: "Logical-clock date the lien was recorded"
      - name: status
        type: enum
        source: system
        description: "Lien lifecycle state"
        default: RECORDED
        constraints: "one of RECORDED, RELEASED, FORECLOSED"

  - name: ForeclosureAction
    parent: Parcel
    common_fields: true
    fields:
      - name: parcel_id
        type: string
        source: input
        description: "FK -> Parcel.id"
      - name: delinquent_installment_count
        type: integer
        source: computed
        description: "Count of DELINQUENT installments on the parcel at initiation"
      - name: delinquent_amount_cents
        type: integer
        source: computed
        description: "Sum of amount_due_cents over the parcel's DELINQUENT installments at initiation"
      - name: redemption_amount_cents
        type: integer
        source: computed
        description: "Amount required to redeem = delinquent_amount_cents snapshot; null until computed"
        default: null
      - name: status
        type: enum
        source: system
        description: "Foreclosure lifecycle state"
        default: INITIATED
        constraints: "one of INITIATED, NOTICED, JUDGMENT, SALE, REDEEMED, CANCELLED"

# ===========================================================================
# §1.2 State Machine Table
# ===========================================================================
state_machines:
  - entity: AssessmentDistrict
    initial_state: PROPOSED
    terminal_states: [ABANDONED]
    transitions:
      - from: PROPOSED
        to: PROTEST_PERIOD
        trigger: "POST /districts/{id}/open-protest"
        actor: DistrictAdministrator
        preconditions:
          - "district.status == PROPOSED"
          - "at least one Parcel exists with status == ACTIVE for this district"
        side_effects:
          - "recompute district.total_benefit_units as sum over ACTIVE parcels of the weight selected by formation_method"
        note: "Opens the majority-protest window."
      - from: PROTEST_PERIOD
        to: FORMED
        trigger: "POST /districts/{id}/close-hearing"
        actor: DistrictAdministrator
        preconditions:
          - "district.status == PROTEST_PERIOD"
          - "protest_ratio (see calc protest_ratio) <= protest_threshold_pct/100"
        side_effects:
          - "set district.formed_at = current logical clock"
        note: "Fork branch A: protest weight did NOT exceed threshold."
      - from: PROTEST_PERIOD
        to: ABANDONED
        trigger: "POST /districts/{id}/close-hearing"
        actor: DistrictAdministrator
        preconditions:
          - "district.status == PROTEST_PERIOD"
          - "protest_ratio > protest_threshold_pct/100"
        side_effects:
          - "cascade: every Parcel with status == ACTIVE transitions to WITHDRAWN"
          - "cascade(from parcel WITHDRAWN): every SCHEDULED or DUE Installment of that parcel transitions to CANCELLED (none exist pre-bond, but the rule is stated for completeness)"
        note: "Fork branch B, divergent side-effect set: majority protest abandons the district."

  - entity: AssessmentRoll
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: CONFIRMED
        trigger: "POST /rolls/{id}/confirm"
        actor: DistrictAdministrator
        preconditions:
          - "roll.status == DRAFT"
          - "parent district.status == FORMED"
        side_effects:
          - "run calc apportionment: set each ACTIVE parcel.assessed_principal_cents"
          - "set each ACTIVE parcel.remaining_principal_cents = its assessed_principal_cents MINUS principal already paid on that parcel (0 on first roll)"
          - "set district.total_apportioned_principal_cents = roll.total_apportioned_cents"
          - "record one ASSESSMENT Lien per ACTIVE parcel with amount_cents = parcel.remaining_principal_cents (skip if an unreleased ASSESSMENT lien already exists for that parcel)"
          - "supersede: any previously CONFIRMED roll of this district transitions to SUPERSEDED"
          - "cascade(reassessment): if a bond of this district is ISSUED, every SCHEDULED Installment is re-amortized against the parcel's new remaining_principal_cents (see calc amortization_schedule)"
        note: "Confirming a second roll on a FORMED district is the reassessment/reallocation path."

  - entity: ImprovementBond
    initial_state: AUTHORIZED
    terminal_states: [RETIRED, DEFAULTED, CALLED]
    transitions:
      - from: AUTHORIZED
        to: ISSUED
        trigger: "POST /bonds/{id}/issue"
        actor: DistrictAdministrator
        preconditions:
          - "bond.status == AUTHORIZED"
          - "the parent district has a roll with status == CONFIRMED (cross-entity dependency on AssessmentRoll)"
          - "no other ImprovementBond of this district has an amortization window overlapping this bond's window (see validation resource_temporal_overlap / bond)"
        side_effects:
          - "compute bond.reserve_fund_cents and bond.par_amount_cents"
          - "generate term_years Installments per ACTIVE parcel via calc amortization_schedule (installment_year 1..term_years, due_date = issuance_date + year*1yr, status SCHEDULED)"
        note: "Levies the bond and lays down the annual installment schedule."
      - from: ISSUED
        to: CALLED
        trigger: "system: last ACTIVE parcel's payoff honored"
        actor: system
        preconditions:
          - "no Parcel of this district has remaining_principal_cents > 0"
        side_effects:
          - "no further installments accrue"
        note: "All parcels prepaid."
      - from: ISSUED
        to: DEFAULTED
        trigger: "system: a foreclosure SALE occurs on any parcel of this district"
        actor: system
        preconditions:
          - "at least one ForeclosureAction of a parcel in this district reached SALE"
        side_effects: []
        note: "Bond marked defaulted on foreclosure sale."
      - from: ISSUED
        to: RETIRED
        trigger: "system: the final installment_year of every parcel is PAID or CANCELLED"
        actor: system
        preconditions:
          - "no Installment of this bond has status IN {SCHEDULED, DUE, DELINQUENT}"
          - "at least one Installment of this bond has status == PAID"
        side_effects: []
        note: "Bond fully amortized and retired at term end."

  - entity: Parcel
    initial_state: ACTIVE
    terminal_states: [WITHDRAWN, SUBDIVIDED]
    transitions:
      - from: ACTIVE
        to: SUBDIVIDED
        trigger: "POST /parcels/{id}/subdivide"
        actor: DistrictAdministrator
        preconditions:
          - "parcel.status == ACTIVE"
          - "sum of child benefit_units in request == parcel.benefit_units (benefit-unit conservation)"
        side_effects:
          - "create each child Parcel with parent_parcel_id = this parcel, status ACTIVE"
          - "reallocate: each child.remaining_principal_cents = round_half_up(parent.remaining_principal_cents * child.benefit_units / parent.benefit_units), remainder cents assigned by descending benefit_units then created_at ASC"
          - "child.assessed_principal_cents set to child.remaining_principal_cents"
          - "carry SCHEDULED installments: cancel parent's SCHEDULED installments and generate re-amortized SCHEDULED installments for each child (if a bond is ISSUED)"
        note: "Self-referential split; conserves benefit units and remaining principal."
      - from: SUBDIVIDED
        to: ACTIVE
        trigger: "POST /parcels/{id}/consolidate"
        actor: DistrictAdministrator
        preconditions:
          - "parcel.status == SUBDIVIDED"
          - "every child parcel has status == ACTIVE and remaining_principal_cents unchanged since subdivision"
        side_effects:
          - "each child Parcel transitions to WITHDRAWN and its SCHEDULED installments transition to CANCELLED"
          - "restore parent to ACTIVE; parent.remaining_principal_cents unchanged (conservation compensating action)"
          - "regenerate parent's SCHEDULED installments if a bond is ISSUED"
        note: "Compensating action reversing a subdivision; benefit-unit total is unchanged throughout."
      - from: ACTIVE
        to: IN_FORECLOSURE
        trigger: "system: POST /parcels/{id}/foreclosures succeeds"
        actor: system
        preconditions:
          - "parcel.status == ACTIVE"
          - "count of DELINQUENT installments on parcel >= FORECLOSURE_DELINQUENT_THRESHOLD"
        side_effects:
          - "no ledger change"
        note: "Cross-entity gate on Installment states."
      - from: IN_FORECLOSURE
        to: ACTIVE
        trigger: "system: ForeclosureAction reaches REDEEMED via POST /foreclosures/{id}/advance with to_status=REDEEMED"
        actor: system
        preconditions:
          - "parcel.status == IN_FORECLOSURE"
        side_effects:
          - "no ledger change (installments settled by the redeem transition itself)"
        note: "Cyclic recovery path back to ACTIVE."
      - from: ACTIVE
        to: PAID_OFF
        trigger: "system: parcel.remaining_principal_cents reaches 0 (final installment PAID or payoff honored)"
        actor: system
        preconditions:
          - "parcel.remaining_principal_cents == 0"
        side_effects:
          - "cascade: every unreleased Lien on this parcel transitions to RELEASED"
          - "cascade: any SCHEDULED or DUE Installment of this parcel transitions to CANCELLED"
        note: "Terminal for the money lifecycle; reached from ACTIVE only."
      - from: ACTIVE
        to: WITHDRAWN
        trigger: "system: district close-hearing abandons the district"
        actor: system
        preconditions:
          - "parent district transitioning to ABANDONED"
        side_effects: []
        note: "Cascade target of district abandonment."

  - entity: Installment
    initial_state: SCHEDULED
    terminal_states: [PAID, DEFAULTED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: DUE
        trigger: "system: logical clock reaches installment.due_date"
        actor: system
        preconditions:
          - "installment.status == SCHEDULED"
          - "current clock >= installment.due_date"
        side_effects: []
        note: "An installment is payable once DUE (evaluated lazily on read/mark)."
      - from: DUE
        to: PAID
        trigger: "POST /installments/{id}/payments"
        actor: CountyTreasurer
        preconditions:
          - "installment.status == DUE"
          - "payment.amount_cents == installment.amount_due_cents"
          - "parcel.status IN {ACTIVE, IN_FORECLOSURE} (cross-entity dependency on Parcel)"
        side_effects:
          - "debit parcel.remaining_principal_cents by installment.principal_cents"
          - "bubble-up: if parcel.remaining_principal_cents == 0, trigger Parcel ACTIVE->PAID_OFF cascade"
        note: "Owner may also pay own installment."
      - from: DUE
        to: DELINQUENT
        trigger: "POST /installments/{id}/mark-delinquent"
        actor: CountyTreasurer
        preconditions:
          - "installment.status == DUE"
          - "current clock >= installment.due_date + GRACE_DAYS"
        side_effects:
          - "set penalty_cents = round_half_up(amount_due_cents * DELINQUENCY_PENALTY_PCT) (base amount before penalty)"
          - "set redemption_interest_cents per calc delinquency_charges"
          - "recompute amount_due_cents to include penalty + redemption interest"
          - "record a DELINQUENCY Lien on the parcel with amount_cents = new amount_due_cents"
        note: "Threshold-gated by GRACE_DAYS."
      - from: DELINQUENT
        to: PAID
        trigger: "POST /installments/{id}/payments"
        actor: CountyTreasurer
        preconditions:
          - "installment.status == DELINQUENT"
          - "payment.amount_cents == installment.amount_due_cents (principal + interest + admin + penalty + redemption interest)"
        side_effects:
          - "debit parcel.remaining_principal_cents by installment.principal_cents"
          - "release the DELINQUENCY Lien tied to this installment"
        note: "Redemption of a delinquent installment."
      - from: DELINQUENT
        to: DEFAULTED
        trigger: "system: ForeclosureAction on the parcel reaches SALE"
        actor: system
        preconditions:
          - "installment.status == DELINQUENT"
        side_effects: []
        note: "Foreclosure sale defaults the delinquent installments."
      - from: SCHEDULED
        to: CANCELLED
        trigger: "system: parcel paid off, subdivided, or district abandoned"
        actor: system
        preconditions:
          - "installment.status == SCHEDULED"
        side_effects: []
        note: "Housekeeping cancellation."
      - from: DUE
        to: CANCELLED
        trigger: "system: parcel paid off via payoff honor"
        actor: system
        preconditions:
          - "installment.status == DUE"
          - "parcel transitioning to PAID_OFF"
        side_effects: []

  - entity: PayoffQuote
    initial_state: QUOTED
    terminal_states: [HONORED, EXPIRED, VOIDED]
    transitions:
      - from: QUOTED
        to: HONORED
        trigger: "POST /payoff-quotes/{id}/honor"
        actor: CountyTreasurer
        preconditions:
          - "quote.status == QUOTED (a quote past valid_until has already lazily transitioned to EXPIRED, so it is no longer QUOTED)"
          - "parcel.status == ACTIVE (cross-entity dependency on Parcel)"
        side_effects:
          - "set parcel.remaining_principal_cents = 0"
          - "cascade: Parcel ACTIVE->PAID_OFF (releases liens, cancels remaining installments)"
          - "if this is the last parcel with remaining principal, bubble-up ImprovementBond ISSUED->CALLED"
        note: "Prepayment/payoff settlement."
      - from: QUOTED
        to: EXPIRED
        trigger: "system: logical clock passes quote.valid_until"
        actor: system
        preconditions:
          - "quote.status == QUOTED"
          - "current clock > quote.valid_until"
        side_effects: []
      - from: QUOTED
        to: VOIDED
        trigger: "system: a newer PayoffQuote is created for the same parcel"
        actor: system
        preconditions:
          - "quote.status == QUOTED"
        side_effects: []
        note: "Newest quote supersedes prior QUOTED quotes on the same parcel."

  - entity: Lien
    initial_state: RECORDED
    terminal_states: [RELEASED, FORECLOSED]
    transitions:
      - from: RECORDED
        to: RELEASED
        trigger: "system: parcel paid off, or the delinquent installment securing this lien is PAID"
        actor: system
        preconditions:
          - "lien.status == RECORDED"
        side_effects: []
      - from: RECORDED
        to: FORECLOSED
        trigger: "system: ForeclosureAction on the parcel reaches SALE"
        actor: system
        preconditions:
          - "lien.status == RECORDED"
        side_effects: []

  - entity: ForeclosureAction
    initial_state: INITIATED
    terminal_states: [SALE, REDEEMED, CANCELLED]
    transitions:
      - from: INITIATED
        to: NOTICED
        trigger: "POST /foreclosures/{id}/advance with to_status=NOTICED"
        actor: DistrictAdministrator
        preconditions:
          - "foreclosure.status == INITIATED"
        side_effects: []
      - from: NOTICED
        to: JUDGMENT
        trigger: "POST /foreclosures/{id}/advance with to_status=JUDGMENT"
        actor: DistrictAdministrator
        preconditions:
          - "foreclosure.status == NOTICED"
        side_effects:
          - "set foreclosure.redemption_amount_cents = foreclosure.delinquent_amount_cents"
      - from: JUDGMENT
        to: SALE
        trigger: "POST /foreclosures/{id}/advance with to_status=SALE"
        actor: CountyTreasurer
        preconditions:
          - "foreclosure.status == JUDGMENT"
        side_effects:
          - "cascade: parcel stays IN_FORECLOSURE; every DELINQUENT Installment of the parcel transitions to DEFAULTED"
          - "cascade: every RECORDED Lien of the parcel transitions to FORECLOSED"
          - "cascade: the parent ImprovementBond transitions ISSUED->DEFAULTED"
        note: "Fork branch A (divergent side effects)."
      - from: JUDGMENT
        to: REDEEMED
        trigger: "POST /foreclosures/{id}/advance with to_status=REDEEMED"
        actor: CountyTreasurer
        preconditions:
          - "foreclosure.status == JUDGMENT"
        side_effects:
          - "every DELINQUENT Installment of the parcel transitions to PAID (redemption settles them); parcel.remaining_principal_cents debited by each such installment's principal_cents"
          - "every DELINQUENCY Lien of the parcel transitions to RELEASED"
          - "cascade: Parcel IN_FORECLOSURE->ACTIVE"
        note: "Fork branch B (divergent side effects): owner redeems."
      - from: INITIATED
        to: CANCELLED
        trigger: "POST /foreclosures/{id}/advance with to_status=CANCELLED"
        actor: DistrictAdministrator
        preconditions:
          - "foreclosure.status == INITIATED"
        side_effects:
          - "if the parcel is IN_FORECLOSURE and no other active foreclosure exists, revert Parcel IN_FORECLOSURE->ACTIVE"

# ===========================================================================
# §1.2.1 Concurrency Rules
# ===========================================================================
concurrency_rules:
  - rule_id: payoff-quote-create-stale-parcel
    parent_entity: Parcel
    write_endpoint: "POST /parcels/{id}/payoff-quotes"
    occ_field: "expected_parcel_version"
    description: |
      Creating a PayoffQuote against a Parcel whose version has advanced since the
      client last observed it is rejected. A new quote legitimately supersedes any
      prior QUOTED quote on the same parcel (voiding it), so a second create is a
      valid product operation rather than a duplicate; but if the parcel's version
      moved between the client's read and this create — e.g. an installment payment
      debited remaining_principal_cents — the quote would be computed on stale
      principal, so the stale-version create is rejected.
    error_id: ERR_STALE_PARCEL_VERSION
    http_status: 412

# ===========================================================================
# §1.3 Calculation Rules Table
# ===========================================================================
calculations:
  - name: apportionment
    trigger: "state_machines.AssessmentRoll.DRAFT_to_CONFIRMED (POST /rolls/{id}/confirm)"
    algorithm: "waterfall_allocation"
    formula: |
      # Inputs: assessable = district.total_project_cost_cents + district.incidental_cost_cents
      # weight(parcel) = benefit_units | front_footage_ft | land_area_sqft, selected by roll.method
      # denom = sum of weight(p) over ACTIVE parcels
      # ROUNDING ORDER IS PINNED: floor each parcel share to whole cents FIRST, then
      # distribute the leftover cents one at a time.
      for p in ACTIVE parcels:
          raw_p        = assessable * weight(p) / denom            # exact rational
          floor_p      = floor(raw_p)                              # whole cents, truncated down
      remainder = assessable - sum(floor_p)                        # >= 0 leftover cents
      order parcels by weight(p) DESC, then created_at ASC          # deterministic, no id
      give +1 cent to the first `remainder` parcels in that order
      p.assessed_principal_cents = floor_p (+1 if it received a remainder cent)
      # sum over parcels of assessed_principal_cents == assessable  (exact, no drift)
    input_set: "ACTIVE parcels of the district (SUBDIVIDED/WITHDRAWN excluded)"
    constants:
      TIE_BREAK: "weight DESC, then created_at ASC"
    precision: "whole cents; floor-then-distribute (NOT round-then-sum)"
    variants:
      - name: by_benefit_units
        when: "roll.method == BENEFIT_UNITS"
        difference: "weight(p) = p.benefit_units"
      - name: by_land_area
        when: "roll.method == LAND_AREA"
        difference: "weight(p) = p.land_area_sqft; same inputs yield different per-parcel principal than by_benefit_units"
      - name: by_front_footage
        when: "roll.method == FRONT_FOOTAGE"
        difference: "weight(p) = p.front_footage_ft"

  - name: amortization_schedule
    trigger: "state_machines.ImprovementBond.AUTHORIZED_to_ISSUED (POST /bonds/{id}/issue); also re-run on reassessment roll confirm and on subdivide/consolidate"
    algorithm: "constraint_propagation"
    formula: |
      # Per parcel, amortize P0 = parcel.assessed_principal_cents (or remaining on re-amortize)
      # at annual rate r = coupon_rate_bps / 10000 over n = term_years, LEVEL debt service.
      level_ds = round_half_up( P0 * r / (1 - (1 + r) ** (-n)) )   # constant each year
      outstanding = P0
      for year k in 1..n:                                          # strict ascending year order
          interest_k  = round_half_up(outstanding * r)
          admin_k     = round_half_up(outstanding * (admin_fee_bps / 10000))
          if k < n:
              principal_k = level_ds - interest_k
          else:
              principal_k = outstanding                            # final year absorbs rounding drift
          amount_due_k = principal_k + interest_k + admin_k
          outstanding = outstanding - principal_k
          due_date_k  = bond.issuance_date + k years
      # sum of principal_k over k == P0  (exact by final-year absorption)
    input_set: "Each ACTIVE parcel; years 1..term_years processed in ascending order"
    constants:
      RATE_DIVISOR: 10000
    precision: "whole cents, round_half_up; year order ascending is pinned"

  - name: payoff_quote
    trigger: "POST /parcels/{id}/payoff-quotes"
    algorithm: "forward_looking"
    formula: |
      rem  = parcel.remaining_principal_cents
      r    = bond.coupon_rate_bps / 10000
      premium       = round_half_up(rem * bond.prepayment_premium_pct)
      reserve_credit = round_half_up(rem / district.total_apportioned_principal_cents * bond.reserve_fund_cents)
      total_payoff  = rem + accrued_interest + premium - reserve_credit
      valid_until   = quote_date + QUOTE_VALIDITY_DAYS
    input_set: "Single parcel with remaining_principal_cents > 0 under an ISSUED bond"
    constants:
      DAY_COUNT_BASIS: 360
    precision: "whole cents, round_half_up"
    variants:
      - name: immediate
        when: "quote_mode == IMMEDIATE"
        difference: "accrued_interest = round_half_up(rem * r * days_30_360(bond.issuance_date, quote_date) / DAY_COUNT_BASIS) — prorated to the quote_date"
      - name: next_call_date
        when: "quote_mode == NEXT_CALL_DATE"
        difference: "accrued_interest = round_half_up(rem * r) — a full year's interest to the next annual call date; strictly larger than immediate for a same-year quote, so total_payoff differs"

  - name: delinquency_charges
    trigger: "state_machines.Installment.DUE_to_DELINQUENT (POST /installments/{id}/mark-delinquent)"
    algorithm: "threshold"
    formula: |
      base = principal_cents + interest_cents + admin_fee_cents        # pre-delinquency amount_due
      penalty_cents = round_half_up(base * DELINQUENCY_PENALTY_PCT)
      months_late   = floor( days_30_360(due_date, current_clock) / 30 )   # whole months since due
      redemption_interest_cents = round_half_up(base * DELINQUENCY_MONTHLY_INTEREST_PCT * months_late)
      amount_due_cents = base + penalty_cents + redemption_interest_cents
    input_set: "A single DUE installment being marked DELINQUENT"
    constants:
      DELINQUENCY_PENALTY_PCT: 0.10
      DELINQUENCY_MONTHLY_INTEREST_PCT: 0.015
      MONTH_DAYS: 30
    precision: "whole cents, round_half_up"

  - name: protest_ratio
    trigger: "state_machines.AssessmentDistrict.PROTEST_PERIOD_to_{FORMED,ABANDONED} (POST /districts/{id}/close-hearing)"
    algorithm: "aggregation"
    formula: |
      protest_weight = sum over parcels having >= 1 ProtestFiling of weight(parcel)   # by formation_method
      ratio = protest_weight / district.total_benefit_units
      # BOUNDARY PINNED: majority protest iff ratio > protest_threshold_pct/100 (STRICT >)
      # ratio == threshold EXACTLY  -> NOT majority -> district FORMS.
    input_set: "ACTIVE parcels of the district with at least one ProtestFiling (a parcel with multiple filings counts once)"
    constants:
      COMPARATOR: "strict greater-than"
    precision: "exact rational comparison; do not round ratio before comparing"

  - name: subdivision_reallocation
    trigger: "state_machines.Parcel.ACTIVE_to_SUBDIVIDED (POST /parcels/{id}/subdivide)"
    algorithm: "waterfall_allocation"
    formula: |
      # Conserve parent.remaining_principal_cents across children by benefit_units share.
      parent_rem = parent.remaining_principal_cents
      denom      = parent.benefit_units
      for c in children:
          floor_c = floor(parent_rem * c.benefit_units / denom)
      remainder = parent_rem - sum(floor_c)
      order children by benefit_units DESC, then created_at ASC
      give +1 cent to the first `remainder` children
      c.remaining_principal_cents = floor_c (+1 if it got a remainder cent)
      c.assessed_principal_cents  = c.remaining_principal_cents
      # sum of c.remaining_principal_cents == parent_rem  (exact) — principal conserved
      # sum of c.benefit_units == parent.benefit_units (required precondition) — benefit units conserved
    input_set: "Child parcels supplied in the subdivide request"
    constants:
      TIE_BREAK: "benefit_units DESC, then created_at ASC"
    precision: "whole cents; floor-then-distribute"

# ===========================================================================
# §1.4 Validation Rules Table (ordered by priority)
# ===========================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all except GET (reads allow Auditor); write endpoints require auth"
  - priority: 2
    category: auth
    check: "acting role is permitted for the operation per §1.7; ParcelOwner X-User-ID must equal the target parcel's id for owner-scoped writes"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "path resources exist, validated left-to-right"
    error_id: ERR_DISTRICT_NOT_FOUND
    http_status: 404
    applies_to: "endpoints with {id} for the respective resource (district/parcel/roll/bond/installment/payment/quote/foreclosure return their own NOT_FOUND)"
  - priority: 4
    category: business_constraint
    check: "OCC: payload expected_parcel_version equals the parcel's current version"
    error_id: ERR_STALE_PARCEL_VERSION
    http_status: 412
    applies_to: "POST /parcels/{id}/payoff-quotes"
  - priority: 5
    category: state
    check: "target resource is in a state that permits the requested transition"
    error_id: ERR_INVALID_DISTRICT_STATE
    http_status: 409
    applies_to: "POST /districts/{id}/open-protest, POST /districts/{id}/close-hearing"
  - priority: 5
    category: state
    check: "roll.status == DRAFT to confirm"
    error_id: ERR_INVALID_ROLL_STATE
    http_status: 409
    applies_to: "POST /rolls/{id}/confirm"
  - priority: 5
    category: state
    check: "bond.status == AUTHORIZED to issue"
    error_id: ERR_INVALID_BOND_STATE
    http_status: 409
    applies_to: "POST /bonds/{id}/issue"
  - priority: 5
    category: state
    check: "parcel.status permits the action (ACTIVE for subdivide/payoff-quote/foreclosure; SUBDIVIDED for consolidate)"
    error_id: ERR_INVALID_PARCEL_STATE
    http_status: 409
    applies_to: "POST /parcels/{id}/subdivide, POST /parcels/{id}/consolidate, POST /parcels/{id}/foreclosures"
  - priority: 5
    category: state
    check: "installment.status IN {DUE, DELINQUENT} to accept payment; DUE to mark-delinquent; SCHEDULED status blocks payment (not yet payable), CANCELLED/PAID/DEFAULTED reject"
    error_id: ERR_INSTALLMENT_NOT_PAYABLE
    http_status: 409
    applies_to: "POST /installments/{id}/payments, POST /installments/{id}/mark-delinquent"
  - priority: 5
    category: state
    check: "quote.status == QUOTED to honor"
    error_id: ERR_INVALID_QUOTE_STATE
    http_status: 409
    applies_to: "POST /payoff-quotes/{id}/honor"
  - priority: 5
    category: state
    check: "foreclosure.status permits the requested to_status transition"
    error_id: ERR_INVALID_FORECLOSURE_STATE
    http_status: 409
    applies_to: "POST /foreclosures/{id}/advance"
  - priority: 6
    category: business_referential
    check: "parcel's parent district.status == FORMED (a formed district is required before quoting a payoff or confirming a roll)"
    error_id: ERR_DISTRICT_NOT_FORMED
    http_status: 409
    applies_to: "POST /parcels/{id}/payoff-quotes, POST /rolls/{id}/confirm"
  - priority: 6
    category: business_referential
    check: "the parent district has a roll with status == CONFIRMED before a bond may be issued"
    error_id: ERR_NO_CONFIRMED_ROLL
    http_status: 409
    applies_to: "POST /bonds/{id}/issue"
  - priority: 7
    category: business_constraint
    check: "apn unique within the district"
    error_id: ERR_APN_DUPLICATE
    http_status: 409
    applies_to: "POST /districts/{id}/parcels, POST /parcels/{id}/subdivide (child apns)"
  - priority: 7
    category: business_constraint
    check: "sum of child benefit_units == parent.benefit_units (benefit-unit conservation)"
    error_id: ERR_BENEFIT_UNITS_MISMATCH
    http_status: 422
    applies_to: "POST /parcels/{id}/subdivide"
  - priority: 7
    category: business_constraint
    check: "no existing non-CANCELLED Installment for the same (parcel_id, bond_id, installment_year) — discrete-year point collision"
    error_id: ERR_INSTALLMENT_YEAR_CONFLICT
    http_status: 409
    applies_to: "POST /parcels/{id}/installments"
  - priority: 7
    category: business_constraint
    check: "no other ISSUED bond of the district has an amortization window [issuance_year, issuance_year+term_years) overlapping this bond's window (half-open; adjacency allowed)"
    error_id: ERR_BOND_TERM_OVERLAP
    http_status: 409
    applies_to: "POST /bonds/{id}/issue"
  - priority: 7
    category: business_constraint
    check: "count of DELINQUENT installments on the parcel >= FORECLOSURE_DELINQUENT_THRESHOLD"
    error_id: ERR_FORECLOSURE_THRESHOLD_NOT_MET
    http_status: 409
    applies_to: "POST /parcels/{id}/foreclosures"
  - priority: 8
    category: business_temporal
    check: "quote_date >= bond.issuance_date (cannot quote a payoff dated before the bond exists)"
    error_id: ERR_QUOTE_DATE_INVALID
    http_status: 422
    applies_to: "POST /parcels/{id}/payoff-quotes"
  - priority: 8
    category: business_temporal
    check: "current clock >= installment.due_date + GRACE_DAYS to mark delinquent"
    error_id: ERR_GRACE_NOT_ELAPSED
    http_status: 409
    applies_to: "POST /installments/{id}/mark-delinquent"
  - priority: 9
    category: business_fiscal
    check: "payment.amount_cents == installment.amount_due_cents exactly"
    error_id: ERR_PAYMENT_AMOUNT_MISMATCH
    http_status: 422
    applies_to: "POST /installments/{id}/payments"
  - priority: 10
    category: business_constraint
    check: "required body fields present and well-typed; enum values legal; numeric fields within declared constraints"
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: "all write endpoints"

# ===========================================================================
# §1.5 API Endpoint Table
# ===========================================================================
endpoints:
  - method: POST
    path: "/districts"
    description: "Create a proposed assessment district"
    roles: [DistrictAdministrator]
    code: 201
    input: [name, formation_method, total_project_cost_cents, "incidental_cost_cents?", "protest_threshold_pct?"]
    output: AssessmentDistrict
    side_effects: ["create district with status PROPOSED"]
  - method: GET
    path: "/districts/{id}"
    description: "Fetch a district"
    roles: [DistrictAdministrator, CountyTreasurer, ParcelOwner, Auditor]
    code: 200
    input: []
    output: AssessmentDistrict
    side_effects: []
  - method: POST
    path: "/districts/{id}/open-protest"
    description: "Open the majority-protest period"
    roles: [DistrictAdministrator]
    code: 200
    input: []
    output: AssessmentDistrict
    side_effects: ["recompute total_benefit_units", "status PROPOSED->PROTEST_PERIOD"]
  - method: POST
    path: "/districts/{id}/close-hearing"
    description: "Close the protest hearing; form or abandon by protest ratio"
    roles: [DistrictAdministrator]
    code: 200
    input: []
    output: AssessmentDistrict
    side_effects: ["run calc protest_ratio", "FORMED when ratio <= threshold else ABANDONED", "on ABANDONED cascade parcels to WITHDRAWN"]
  - method: POST
    path: "/districts/{id}/parcels"
    description: "Add a parcel to a district"
    roles: [DistrictAdministrator]
    code: 201
    input: [apn, owner_name, "benefit_units?", "land_area_sqft?", "front_footage_ft?"]
    output: Parcel
    side_effects: ["create Parcel status ACTIVE with district_id from path"]
  - method: GET
    path: "/districts/{id}/parcels"
    description: "List parcels of a district (reverse lookup for Parcel.district_id)"
    roles: [DistrictAdministrator, CountyTreasurer, ParcelOwner, Auditor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Parcel[]
    side_effects: []
  - method: GET
    path: "/parcels/{id}"
    description: "Fetch a parcel"
    roles: [DistrictAdministrator, CountyTreasurer, ParcelOwner, Auditor]
    code: 200
    input: []
    output: Parcel
    side_effects: []
  - method: GET
    path: "/parcels"
    description: "List/filter parcels (reverse lookup for Parcel.parent_parcel_id via parent_parcel_id filter)"
    roles: [DistrictAdministrator, CountyTreasurer, ParcelOwner, Auditor]
    code: 200
    input: ["district_id?", "parent_parcel_id?", "status?", "limit?", "offset?"]
    output: Parcel[]
    side_effects: []
  - method: POST
    path: "/parcels/{id}/subdivide"
    description: "Split a parcel into child parcels, conserving benefit units and remaining principal"
    roles: [DistrictAdministrator]
    code: 200
    input: [children]
    output: Parcel
    side_effects: ["create child Parcels", "run calc subdivision_reallocation", "parcel ACTIVE->SUBDIVIDED", "re-amortize child installments if bond ISSUED"]
  - method: POST
    path: "/parcels/{id}/consolidate"
    description: "Reverse a subdivision, restoring the parent parcel"
    roles: [DistrictAdministrator]
    code: 200
    input: []
    output: Parcel
    side_effects: ["children ACTIVE->WITHDRAWN", "parcel SUBDIVIDED->ACTIVE with unchanged remaining_principal_cents", "regenerate parent installments if bond ISSUED"]
  - method: POST
    path: "/parcels/{id}/protests"
    description: "File a protest against the assessment (owner of record)"
    roles: [ParcelOwner]
    code: 201
    input: [filed_by]
    output: ProtestFiling
    side_effects: ["snapshot weight_units from parcel per district formation_method"]
  - method: GET
    path: "/parcels/{id}/protests"
    description: "List protests on a parcel (reverse lookup for ProtestFiling.parcel_id)"
    roles: [DistrictAdministrator, CountyTreasurer, ParcelOwner, Auditor]
    code: 200
    input: ["limit?", "offset?"]
    output: ProtestFiling[]
    side_effects: []
  - method: POST
    path: "/districts/{id}/rolls"
    description: "Create a DRAFT assessment roll for a formed district (also the reassessment entry point)"
    roles: [DistrictAdministrator]
    code: 201
    input: ["method?"]
    output: AssessmentRoll
    side_effects: ["create AssessmentRoll status DRAFT", "set total_apportioned_cents"]
  - method: GET
    path: "/districts/{id}/rolls"
    description: "List rolls of a district (reverse lookup for AssessmentRoll.district_id)"
    roles: [DistrictAdministrator, CountyTreasurer, ParcelOwner, Auditor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: AssessmentRoll[]
    side_effects: []
  - method: POST
    path: "/rolls/{id}/confirm"
    description: "Confirm a roll, apportioning principal to parcels"
    roles: [DistrictAdministrator]
    code: 200
    input: []
    output: AssessmentRoll
    side_effects: ["run calc apportionment", "set parcel assessed/remaining principal", "record ASSESSMENT liens", "supersede prior CONFIRMED roll", "re-amortize SCHEDULED installments if bond ISSUED"]
  - method: POST
    path: "/districts/{id}/bonds"
    description: "Authorize an improvement bond for a district"
    roles: [DistrictAdministrator]
    code: 201
    input: [issuance_date, "coupon_rate_bps?", "term_years?", "reserve_fund_pct?", "issuance_cost_cents?", "admin_fee_bps?", "prepayment_premium_pct?"]
    output: ImprovementBond
    side_effects: ["create ImprovementBond status AUTHORIZED"]
  - method: GET
    path: "/districts/{id}/bonds"
    description: "List bonds of a district (reverse lookup for ImprovementBond.district_id)"
    roles: [DistrictAdministrator, CountyTreasurer, ParcelOwner, Auditor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ImprovementBond[]
    side_effects: []
  - method: POST
    path: "/bonds/{id}/issue"
    description: "Issue the bond and generate the per-parcel annual installment schedule"
    roles: [DistrictAdministrator]
    code: 200
    input: []
    output: ImprovementBond
    side_effects: ["compute reserve_fund_cents and par_amount_cents", "run calc amortization_schedule generating installments", "bond AUTHORIZED->ISSUED"]
  - method: POST
    path: "/parcels/{id}/installments"
    description: "Add a supplemental installment for a specific year (adjustment/reassessment charge)"
    roles: [DistrictAdministrator]
    code: 201
    input: [bond_id, installment_year, due_date, principal_cents, "interest_cents?", "admin_fee_cents?"]
    output: Installment
    side_effects: ["create Installment status SCHEDULED", "reject on (parcel_id, bond_id, installment_year) collision"]
  - method: GET
    path: "/installments/{id}"
    description: "Fetch an installment"
    roles: [DistrictAdministrator, CountyTreasurer, ParcelOwner, Auditor]
    code: 200
    input: []
    output: Installment
    side_effects: []
  - method: GET
    path: "/installments"
    description: "List/filter installments (reverse lookup for Installment.parcel_id and Installment.bond_id)"
    roles: [DistrictAdministrator, CountyTreasurer, ParcelOwner, Auditor]
    code: 200
    input: ["parcel_id?", "bond_id?", "status?", "installment_year?", "limit?", "offset?"]
    output: Installment[]
    side_effects: []
  - method: POST
    path: "/installments/{id}/payments"
    description: "Record a payment against an installment"
    roles: [CountyTreasurer, ParcelOwner]
    code: 201
    input: [amount_cents, payment_date, paid_by]
    output: Payment
    side_effects: ["installment DUE/DELINQUENT->PAID", "debit parcel.remaining_principal_cents by principal_cents", "cascade parcel PAID_OFF when remaining hits 0", "release DELINQUENCY lien if delinquent"]
  - method: GET
    path: "/installments/{id}/payments"
    description: "List payments on an installment (reverse lookup for Payment.installment_id)"
    roles: [DistrictAdministrator, CountyTreasurer, ParcelOwner, Auditor]
    code: 200
    input: ["limit?", "offset?"]
    output: Payment[]
    side_effects: []
  - method: POST
    path: "/payments/{id}/reverse"
    description: "Reverse a prior payment (compensating action)"
    roles: [CountyTreasurer]
    code: 200
    input: []
    output: Payment
    side_effects: ["mark payment reversed", "installment PAID->DUE (or ->DELINQUENT if past grace)", "credit parcel.remaining_principal_cents by principal_cents", "if parcel was PAID_OFF revert to ACTIVE and re-record ASSESSMENT lien"]
  - method: POST
    path: "/installments/{id}/mark-delinquent"
    description: "Mark a past-grace DUE installment delinquent"
    roles: [CountyTreasurer]
    code: 200
    input: []
    output: Installment
    side_effects: ["run calc delinquency_charges", "installment DUE->DELINQUENT", "record DELINQUENCY lien"]
  - method: POST
    path: "/parcels/{id}/payoff-quotes"
    description: "Compute a prepayment/payoff quote (newest supersedes prior QUOTED quote)"
    roles: [ParcelOwner, CountyTreasurer]
    code: 201
    input: [quote_mode, quote_date, expected_parcel_version]
    output: PayoffQuote
    side_effects: ["run calc payoff_quote", "void prior QUOTED quotes on the parcel", "increments Parcel.version by 1"]
  - method: GET
    path: "/parcels/{id}/payoff-quotes"
    description: "List payoff quotes on a parcel (reverse lookup for PayoffQuote.parcel_id)"
    roles: [DistrictAdministrator, CountyTreasurer, ParcelOwner, Auditor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: PayoffQuote[]
    side_effects: []
  - method: POST
    path: "/payoff-quotes/{id}/honor"
    description: "Settle a payoff quote, paying the parcel in full"
    roles: [CountyTreasurer]
    code: 200
    input: []
    output: PayoffQuote
    side_effects: ["set parcel.remaining_principal_cents = 0", "cascade parcel ACTIVE->PAID_OFF (release liens, cancel installments)", "bubble-up bond ISSUED->CALLED when last parcel prepaid"]
  - method: POST
    path: "/parcels/{id}/foreclosures"
    description: "Initiate foreclosure on a parcel past the delinquency threshold"
    roles: [DistrictAdministrator]
    code: 201
    input: []
    output: ForeclosureAction
    side_effects: ["compute delinquent_installment_count and delinquent_amount_cents", "create ForeclosureAction status INITIATED", "cascade parcel ACTIVE->IN_FORECLOSURE"]
  - method: GET
    path: "/parcels/{id}/foreclosures"
    description: "List foreclosure actions on a parcel (reverse lookup for ForeclosureAction.parcel_id)"
    roles: [DistrictAdministrator, CountyTreasurer, ParcelOwner, Auditor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ForeclosureAction[]
    side_effects: []
  - method: POST
    path: "/foreclosures/{id}/advance"
    description: "Advance a foreclosure to NOTICED, JUDGMENT, SALE, REDEEMED, or CANCELLED"
    roles: [DistrictAdministrator, CountyTreasurer]
    code: 200
    input: [to_status]
    output: ForeclosureAction
    side_effects: ["apply the requested transition and its cascades (SALE defaults installments+liens+bond; REDEEMED settles delinquents and reverts parcel to ACTIVE)"]
  - method: GET
    path: "/parcels/{id}/liens"
    description: "List liens on a parcel (reverse lookup for Lien.parcel_id)"
    roles: [DistrictAdministrator, CountyTreasurer, ParcelOwner, Auditor]
    code: 200
    input: ["status?", "lien_type?", "limit?", "offset?"]
    output: Lien[]
    side_effects: []
  - method: GET
    path: "/parcels/{id}/disclosure"
    description: "Computed disclosure report for a parcel"
    roles: [DistrictAdministrator, CountyTreasurer, ParcelOwner, Auditor]
    code: 200
    input: []
    output: { remaining_principal_cents: integer, annual_installment_cents: integer, next_due_date: string, delinquent_installment_count: integer, lien_status: string, foreclosure_status: string }
    side_effects: []
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock. Startup default is 2026-03-01T00:00:00Z; before any call the clock reads exactly this default and never falls back to wall-clock time."
    roles: [DistrictAdministrator, CountyTreasurer]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["set logical clock; lazily promotes SCHEDULED->DUE and QUOTED->EXPIRED on subsequent reads"]

# ===========================================================================
# §1.6 Error Code Catalog
# ===========================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing/unknown X-User-Role or X-User-ID on a protected endpoint"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "Role not permitted, or ParcelOwner acting on a parcel it does not own"
  - id: ERR_VALIDATION
    http: 422
    condition: "Missing required field, bad type, illegal enum, or numeric constraint violation"
  - id: ERR_DISTRICT_NOT_FOUND
    http: 404
    condition: "District id in path does not exist"
  - id: ERR_PARCEL_NOT_FOUND
    http: 404
    condition: "Parcel id in path does not exist"
  - id: ERR_ROLL_NOT_FOUND
    http: 404
    condition: "Roll id in path does not exist"
  - id: ERR_BOND_NOT_FOUND
    http: 404
    condition: "Bond id in path does not exist"
  - id: ERR_INSTALLMENT_NOT_FOUND
    http: 404
    condition: "Installment id in path does not exist"
  - id: ERR_PAYMENT_NOT_FOUND
    http: 404
    condition: "Payment id in path does not exist"
  - id: ERR_QUOTE_NOT_FOUND
    http: 404
    condition: "Payoff quote id in path does not exist"
  - id: ERR_FORECLOSURE_NOT_FOUND
    http: 404
    condition: "Foreclosure id in path does not exist"
  - id: ERR_STALE_PARCEL_VERSION
    http: 412
    condition: "expected_parcel_version does not match the parcel's current version on payoff-quote create"
  - id: ERR_INVALID_DISTRICT_STATE
    http: 409
    condition: "District not in a state permitting the requested formation transition"
  - id: ERR_INVALID_PARCEL_STATE
    http: 409
    condition: "Parcel not in a state permitting subdivide/consolidate/foreclosure"
  - id: ERR_INVALID_ROLL_STATE
    http: 409
    condition: "Roll not DRAFT when confirm is attempted"
  - id: ERR_INVALID_BOND_STATE
    http: 409
    condition: "Bond not AUTHORIZED when issue is attempted"
  - id: ERR_INSTALLMENT_NOT_PAYABLE
    http: 409
    condition: "Installment not DUE/DELINQUENT for payment, or not DUE for mark-delinquent (SCHEDULED/CANCELLED/PAID/DEFAULTED)"
  - id: ERR_INVALID_QUOTE_STATE
    http: 409
    condition: "Payoff quote not QUOTED when honor is attempted"
  - id: ERR_INVALID_FORECLOSURE_STATE
    http: 409
    condition: "Requested foreclosure to_status is not a legal transition from the current status"
  - id: ERR_DISTRICT_NOT_FORMED
    http: 409
    condition: "Operation requires the parent district to be FORMED"
  - id: ERR_NO_CONFIRMED_ROLL
    http: 409
    condition: "Bond issue attempted with no CONFIRMED roll for the district"
  - id: ERR_APN_DUPLICATE
    http: 409
    condition: "APN already used by another parcel in the same district"
  - id: ERR_BENEFIT_UNITS_MISMATCH
    http: 422
    condition: "Sum of child benefit_units != parent.benefit_units on subdivide"
  - id: ERR_INSTALLMENT_YEAR_CONFLICT
    http: 409
    condition: "A non-CANCELLED installment already exists for (parcel_id, bond_id, installment_year)"
  - id: ERR_BOND_TERM_OVERLAP
    http: 409
    condition: "Another ISSUED bond's amortization window overlaps this bond's window"
  - id: ERR_FORECLOSURE_THRESHOLD_NOT_MET
    http: 409
    condition: "Parcel has fewer than FORECLOSURE_DELINQUENT_THRESHOLD delinquent installments"
  - id: ERR_QUOTE_DATE_INVALID
    http: 422
    condition: "quote_date earlier than bond.issuance_date"
  - id: ERR_GRACE_NOT_ELAPSED
    http: 409
    condition: "mark-delinquent attempted before due_date + GRACE_DAYS"
  - id: ERR_PAYMENT_AMOUNT_MISMATCH
    http: 422
    condition: "Payment amount_cents != installment.amount_due_cents"

# ===========================================================================
# §1.7 RBAC Matrix
# ===========================================================================
roles:
  - name: DistrictAdministrator
    description: "Forms districts, manages parcels, apportions rolls, authorizes/issues bonds, drives foreclosure procedure"
    identity: "opaque"
    exclusive_operations:
      - "POST /districts"
      - "POST /districts/{id}/open-protest"
      - "POST /districts/{id}/close-hearing"
      - "POST /districts/{id}/parcels"
      - "POST /parcels/{id}/subdivide"
      - "POST /parcels/{id}/consolidate"
      - "POST /districts/{id}/rolls"
      - "POST /rolls/{id}/confirm"
      - "POST /districts/{id}/bonds"
      - "POST /bonds/{id}/issue"
      - "POST /parcels/{id}/installments"
      - "POST /parcels/{id}/foreclosures"
    shared_operations:
      - "POST /foreclosures/{id}/advance"
      - "POST /_clock/set_current_utc"
      - "all GET reads"
  - name: CountyTreasurer
    description: "Handles money movement: payments, reversals, delinquency, payoff honoring, foreclosure sale/redemption"
    identity: "opaque"
    exclusive_operations:
      - "POST /payments/{id}/reverse"
      - "POST /installments/{id}/mark-delinquent"
      - "POST /payoff-quotes/{id}/honor"
    shared_operations:
      - "POST /installments/{id}/payments"
      - "POST /parcels/{id}/payoff-quotes"
      - "POST /foreclosures/{id}/advance"
      - "POST /_clock/set_current_utc"
      - "all GET reads"
  - name: ParcelOwner
    description: "Owner of record acting on their own parcel; X-User-ID equals the owned parcel's id"
    identity: "entity_backed:Parcel"
    exclusive_operations:
      - "POST /parcels/{id}/protests"
    shared_operations:
      - "POST /installments/{id}/payments"
      - "POST /parcels/{id}/payoff-quotes"
      - "all GET reads for own parcel"
  - name: Auditor
    description: "Read-only oversight of all resources and disclosure reports"
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "all GET reads"
