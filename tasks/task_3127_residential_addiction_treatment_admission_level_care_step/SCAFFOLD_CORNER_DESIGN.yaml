  instances:
  - name: facility_ops_run_executes_its_stages_in_the_pinned_order
    claim_type: Action endpoint
    grounds:
    - endpoints.POST_/treatment-network/facilities/{id}/facility-ops/run
    - calculations.facility_ops_batch
    - entities.Facility.fields.ops_epoch
    distinguishing_aspect: One ops run advances the epoch first, then banks authorized days, then recomputes
      compliance posture, so the posture written in the run response already reflects the expiry that
      the same run detected.
    test_recipe:
      setup:
      - Logical clock at 2026-09-01T00:00:00Z. A licensed facility whose ACCREDITATION_BODY expires exactly
        one month later, with no RECOVERY_HOUSE row.
      setup_api_calls:
      - call: POST /treatment-network/_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
