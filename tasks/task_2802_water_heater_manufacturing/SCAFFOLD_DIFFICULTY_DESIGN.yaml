  - rule_id: combinatorial_formula
    instances:
      - name: uef_effective_minimum_multistage_tier_derate_credit
        grounds:
          - calculations.uef_compliance_margin
          - entities.EfficiencyTest.fields.effective_minimum
          - entities.ProductModel.fields.insulation_r_value
          - endpoints[POST /mfg/efficiency-tests/{id}/record-result]
          - state_machines.EfficiencyTest.SCHEDULED_to_PASSED
          - state_machines.EfficiencyTest.SCHEDULED_to_FAILED
        distinguishing_aspect: >
          Mode (a) multi-stage: effective_minimum is a three-stage composition - a two-way fuel/capacity
          tier lookup, PLUS a sample-size derate, MINUS a capped R-value credit - and the three test rows
          exercise a different cell of every stage at once (GAS/small/sample3/R20 -> 0.5600,
          HEAT_PUMP/large/sample2/R25 -> 2.8800 with the credit CLAMPED at 0.03 from a raw 0.045, and
          GAS/large/sample1/R16 -> 0.5700 with zero credit). Any implementation that flattens a stage
          (drops the capacity split, forgets the derate, or omits the credit cap) misses at least one row,
          and the third row also flips the terminal state from PASSED to FAILED.
        test_recipe:
          setup:
            - "Three product models differ on fuel_type, nominal_capacity_gallons and insulation_r_value."
            - "One SCHEDULED UEF test exists per model, with sample_size 3, 2 and 1 respectively."
            - "The logical clock is 2026-08-05T06:00:00Z, past every test window_end."
          setup_api_calls:
            - call: "POST /mfg/product-models"
              payload: { model_code: "GX50-T", fuel_type: "GAS", nominal_capacity_gallons: 50, channel: "TRADE", insulation_r_value: 20, is_private_label: false }
              as: ComplianceEngineer
              captures: { m1_id: $.data.id }

            - call: "POST /mfg/product-models"
              payload: { model_code: "HP65-B", fuel_type: "HEAT_PUMP", nominal_capacity_gallons: 65, channel: "BUILDER", insulation_r_value: 25, is_private_label: false }
              as: ComplianceEngineer
              captures: { m2_id: $.data.id }

            - call: "POST /mfg/product-models"
              payload: { model_code: "GX75-R", fuel_type: "GAS", nominal_capacity_gallons: 75, channel: "RETAIL", insulation_r_value: 16, is_private_label: false }
              as: ComplianceEngineer
              captures: { m3_id: $.data.id }

            - call: "POST /mfg/test-cells"
              payload: { cell_code: "CELL-1", parallel_slots: 2, cooldown_hours: 12 }
              as: PlantAdmin
              captures: { cell1_id: $.data.id }

            - call: "POST /mfg/efficiency-tests"
              payload: { product_model_id: "${m1_id}", test_cell_id: "${cell1_id}", test_type: "UEF", sample_size: 3, window_start: "2026-08-02T06:00:00Z", window_end: "2026-08-02T10:00:00Z" }
              as: ComplianceEngineer
              captures: { ta_id: $.data.id }
            - call: "POST /mfg/efficiency-tests"
              payload: { product_model_id: "${m2_id}", test_cell_id: "${cell1_id}", test_type: "UEF", sample_size: 2, window_start: "2026-08-03T06:00:00Z", window_end: "2026-08-03T10:00:00Z" }
              as: ComplianceEngineer
              captures: { tb_id: $.data.id }
            - call: "POST /mfg/efficiency-tests"
              payload: { product_model_id: "${m3_id}", test_cell_id: "${cell1_id}", test_type: "UEF", sample_size: 1, window_start: "2026-08-04T06:00:00Z", window_end: "2026-08-04T10:00:00Z" }
              as: ComplianceEngineer
              captures: { tc_id: $.data.id }

            - call: "POST /mfg/_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T06:00:00Z" }
              as: PlantAdmin
          trigger:
            - call: "POST /mfg/efficiency-tests/${ta_id}/record-result"
              payload: { measured_value: 0.5850 }
              as: QualityInspector
            - call: "POST /mfg/efficiency-tests/${tb_id}/record-result"
              payload: { measured_value: 2.9500 }
              as: QualityInspector
            - call: "POST /mfg/efficiency-tests/${tc_id}/record-result"
              payload: { measured_value: 0.5650 }
              as: QualityInspector
          assert:
            - "EfficiencyTest.${ta_id}.effective_minimum == 0.5600 and margin == 0.0250 and status == PASSED"
            - "EfficiencyTest.${tb_id}.effective_minimum == 2.8800 and margin == 0.0700 and status == PASSED"
            - "EfficiencyTest.${tc_id}.effective_minimum == 0.5700 and margin == -0.0050 and status == FAILED"
            - "ProductModel.${m1_id}.certification_status == TEST_PENDING and ProductModel.${m2_id}.certification_status == TEST_PENDING and ProductModel.${m3_id}.certification_status == TEST_PENDING"
            - "all three models still have uef_rated == null (only an approved certification publishes a rating)"
      - name: certified_uef_round_per_test_then_mean
        grounds:
          - calculations.certified_rating_rounding
          - entities.RatingCertification.fields.certified_uef
          - entities.RatingCertification.fields.certified_fhr
          - entities.RatingCertification.fields.certified_recovery
          - state_machines.RatingCertification.DRAFT_to_SUBMITTED
        distinguishing_aspect: >
          Mode (b) order-of-operations: the three PASSED UEF measurements 0.5850 / 0.5850 / 0.5840 are each
          rounded to 2 dp FIRST (0.59, 0.59, 0.58) and only then averaged (1.76/3 = 0.5867 -> 0.59), whereas
          the transposed order - mean 0.584667 then round - yields 0.58. The same instance simultaneously
          pins two other per-metric precisions (FHR 62.5 -> 63 at 0 dp, RECOVERY 41.25 -> 41.3 at 1 dp), so a
          single shared rounding width is also detected.
        test_recipe:
          setup:
            - "Model GX50-T has three PASSED UEF tests measuring 0.5850, 0.5850 and 0.5840."
            - "It also has one PASSED FIRST_HOUR_RATING test at 62.5 and one PASSED RECOVERY test at 41.25."
            - "A DRAFT RatingCertification exists for the model and has not been submitted."
          setup_api_calls:
            - call: "POST /mfg/product-models"
