# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Breadth walk of claim-extraction-guide sections against §1.1–§1.7.
# Same shared literals and conventions as SCAFFOLD_DIFFICULTY_DESIGN.yaml.
# Instance names are unique across BOTH design files.
scaffold_corner_design:
  # ==================================================================
  - section: entities
    instances:
      - name: c_ent_program_creation_applies_computed_defaults
        claim_type: creation
        grounds: [entities.Program, "endpoints[POST /programs]"]
        distinguishing_aspect: "A created program initializes all computed fiscal fields deterministically: pool remaining == budget, liabilities and paid_out == 0, version == 1."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - { call: "POST /programs", payload: { name: "P", season_start: "2026-08-01T00:00:00Z", season_end: "2026-09-01T00:00:00Z", match_pool_budget_cents: 50000 }, as: ProgramAdmin, captures: { prog: $.data.id, rem: $.data.match_pool_remaining_cents, fwd: $.data.liability_forward_cents, rlz: $.data.liability_realized_cents, paid: $.data.paid_out_cents, v: $.data.version } }
          trigger: []
          assert:
            - "match_pool_remaining_cents == 50000 (initialized to budget)"
            - "liability_forward_cents == 0 and liability_realized_cents == 0 and paid_out_cents == 0"
            - "version == 1 and status fields absent (Program has no state machine)"

      - name: c_ent_shopper_default_status_enrolled
        claim_type: defaults
        grounds: [entities.Shopper.fields.status, state_machines.Shopper]
        distinguishing_aspect: "Shopper starts ENROLLED (not ACTIVE): issuance is impossible until verify; season_match_used_cents defaults 0."
        test_recipe:
          setup: ["program exists"]
          setup_api_calls:
            - { call: "POST /programs", payload: { name: "P", season_start: "2026-08-01T00:00:00Z", season_end: "2026-09-01T00:00:00Z", match_pool_budget_cents: 50000 }, as: ProgramAdmin, captures: { prog: $.data.id } }
          trigger:
            - { call: "POST /shoppers", payload: { program_id: "${prog}", external_benefit_ref: "EBT-1", benefit_type: "WIC" }, as: BoothOperator, captures: { shop: $.data.id, st: $.data.status, used: $.data.season_match_used_cents } }
          assert:
            - "Shopper.status == ENROLLED on creation (initial state)"
            - "season_match_used_cents == 0"

      - name: c_ent_market_day_inverted_window_rejected
        claim_type: type_constraints
        grounds: ["validations[priority=8]", entities.MarketDay.fields.closes_at]
        distinguishing_aspect: "closes_at <= opens_at is a schema-level impossibility rejected ERR_INVALID_REQUEST before any overlap logic runs."
        test_recipe:
          setup: ["program + market exist"]
          setup_api_calls:
            - { call: "POST /programs", payload: { name: "P", season_start: "2026-08-01T00:00:00Z", season_end: "2026-09-01T00:00:00Z", match_pool_budget_cents: 50000 }, as: ProgramAdmin, captures: { prog: $.data.id } }
            - { call: "POST /markets", payload: { program_id: "${prog}", name: "M", city: "C" }, as: ProgramAdmin, captures: { mkt: $.data.id } }
          trigger:
            - { call: "POST /market-days", payload: { market_id: "${mkt}", date: "2026-08-01", opens_at: "2026-08-01T14:00:00Z", closes_at: "2026-08-01T08:00:00Z" }, as: MarketManager, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST (400)"

      - name: c_ent_match_batch_denomination_constraint
        claim_type: type_constraints
        grounds: ["validations[priority=8]", entities.TokenBatch.fields.denomination_cents]
        distinguishing_aspect: "MATCH batches may only carry denomination 100; a MATCH batch of 500 violates the kind/denumination coupling and is rejected ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["program + market exist"]
          setup_api_calls:
            - { call: "POST /programs", payload: { name: "P", season_start: "2026-08-01T00:00:00Z", season_end: "2026-09-01T00:00:00Z", match_pool_budget_cents: 50000 }, as: ProgramAdmin, captures: { prog: $.data.id } }
            - { call: "POST /markets", payload: { program_id: "${prog}", name: "M", city: "C" }, as: ProgramAdmin, captures: { mkt: $.data.id } }
          trigger:
            - { call: "POST /token-batches", payload: { market_id: "${mkt}", kind: "MATCH", denomination_cents: 500, serial_start: 300001, serial_end: 300100 }, as: ProgramAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST (400)"

      - name: c_ent_token_system_fields_stamped_from_batch
        claim_type: system_fields
        grounds: [entities.Token.fields.serial_number, calculations.token_denomination_split]
        distinguishing_aspect: "Token serial_number/kind/denomination are system-stamped from the supplying batch at mint: first base-100 serial is 200001 and first match serial is 300001; client input cannot influence them."
        test_recipe:
          setup:
            - "Base setup; issuance charge 300 (base 3x100, match 300)"
          setup_api_calls:
            - { call: "POST /programs", payload: { name: "P", season_start: "2026-08-01T00:00:00Z", season_end: "2026-09-01T00:00:00Z", match_pool_budget_cents: 100000 }, as: ProgramAdmin, captures: { prog: $.data.id } }
            - { call: "POST /markets", payload: { program_id: "${prog}", name: "M", city: "C" }, as: ProgramAdmin, captures: { mkt: $.data.id } }
            - { call: "POST /token-batches", payload: { market_id: "${mkt}", kind: "BASE", denomination_cents: 500, serial_start: 100001, serial_end: 100100 }, as: ProgramAdmin, captures: { b5: $.data.id } }
            - { call: "POST /token-batches/${b5}/activate", payload: {}, as: ProgramAdmin }
            - { call: "POST /token-batches", payload: { market_id: "${mkt}", kind: "BASE", denomination_cents: 100, serial_start: 200001, serial_end: 200200 }, as: ProgramAdmin, captures: { b1: $.data.id } }
            - { call: "POST /token-batches/${b1}/activate", payload: {}, as: ProgramAdmin }
            - { call: "POST /token-batches", payload: { market_id: "${mkt}", kind: "MATCH", denomination_cents: 100, serial_start: 300001, serial_end: 300500 }, as: ProgramAdmin, captures: { bm: $.data.id } }
            - { call: "POST /token-batches/${bm}/activate", payload: {}, as: ProgramAdmin }
            - { call: "POST /shoppers", payload: { program_id: "${prog}", external_benefit_ref: "EBT-1", benefit_type: "SNAP" }, as: BoothOperator, captures: { shop: $.data.id } }
            - { call: "POST /shoppers/${shop}/verify", payload: {}, as: ProgramAdmin, captures: { shop_v: $.data.version } }
            - { call: "POST /market-days", payload: { market_id: "${mkt}", date: "2026-08-01", opens_at: "2026-08-01T08:00:00Z", closes_at: "2026-08-01T14:00:00Z" }, as: MarketManager, captures: { day: $.data.id } }
            - { call: "POST /market-days/${day}/open", payload: {}, as: MarketManager }
          trigger:
            - { call: "POST /issuances", payload: { shopper_id: "${shop}", market_day_id: "${day}", benefit_charged_cents: 300, expected_shopper_version: "${shop_v}" }, as: BoothOperator, captures: { iss: $.data.id } }
            - { call: "GET /tokens", payload: { issuance_id: "${iss}" }, as: BoothOperator, captures: { s0: "$.data[0].serial_number", s3: "$.data[3].serial_number", k3: "$.data[3].kind", d3: "$.data[3].denomination_cents" } }
          assert:
            - "tokens[0].serial_number == 200001 (first BASE-100 serial of batch b1)"
            - "tokens[3].serial_number == 300001 AND kind == MATCH AND denomination_cents == 100 (first match token)"
            - "6 tokens minted total (3 base + 3 match)"

      - name: c_ent_get_missing_program_returns_not_found
        claim_type: not_found
        grounds: ["validations[priority=5]", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET on a well-formed but absent UUID returns the canonical 404 envelope."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /programs/00000000-0000-0000-0000-000000000000", payload: {}, as: ProgramAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_NOT_FOUND (404)"

      - name: c_ent_shopper_list_filters_status_and_paginates
        claim_type: listing
        grounds: ["endpoints[GET /programs/{id}/shoppers]", response_envelope]
        distinguishing_aspect: "List endpoint honors status filter AND limit/offset: 3 shoppers (2 ACTIVE), status=ACTIVE returns exactly 2; unfiltered limit=2 reports total_count 3 and has_more true."
        test_recipe:
          setup: ["program exists"]
          setup_api_calls:
            - { call: "POST /programs", payload: { name: "P", season_start: "2026-08-01T00:00:00Z", season_end: "2026-09-01T00:00:00Z", match_pool_budget_cents: 50000 }, as: ProgramAdmin, captures: { prog: $.data.id } }
            - { call: "POST /shoppers", payload: { program_id: "${prog}", external_benefit_ref: "EBT-1", benefit_type: "SNAP" }, as: BoothOperator, captures: { s1: $.data.id } }
            - { call: "POST /shoppers", payload: { program_id: "${prog}", external_benefit_ref: "EBT-2", benefit_type: "WIC" }, as: BoothOperator, captures: { s2: $.data.id } }
            - { call: "POST /shoppers", payload: { program_id: "${prog}", external_benefit_ref: "EBT-3", benefit_type: "SENIOR" }, as: BoothOperator, captures: { s3: $.data.id } }
            - { call: "POST /shoppers/${s1}/verify", payload: {}, as: ProgramAdmin }
            - { call: "POST /shoppers/${s2}/verify", payload: {}, as: ProgramAdmin }
          trigger:
            - { call: "GET /programs/${prog}/shoppers", payload: { status: "ACTIVE" }, as: ProgramAdmin }
            - { call: "GET /programs/${prog}/shoppers", payload: { limit: 2, offset: 0 }, as: ProgramAdmin }
          assert:
            - "status=ACTIVE filter returns exactly 2 rows (EBT-1, EBT-2; EBT-3 stays ENROLLED)"
            - "unfiltered page: 2 rows returned, total_count == 3, has_more == true"

      - name: c_ent_child_creation_requires_existing_parent
        claim_type: parent_relationships
        grounds: [entities.Market.fields.program_id, "errors[ERR_REFERENCE_NOT_FOUND]"]
        distinguishing_aspect: "Market creation with a bogus program_id fails referential existence (422), not a generic 400."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /markets", payload: { program_id: "00000000-0000-0000-0000-000000000000", name: "M", city: "C" }, as: ProgramAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_REFERENCE_NOT_FOUND (422)"

      - name: c_ent_duplicate_benefit_ref_rejected
        claim_type: creation
        grounds: ["validations[priority=25]", "errors[ERR_DUPLICATE_ENROLLMENT]"]
        distinguishing_aspect: "external_benefit_ref is unique per program among non-SUSPENDED shoppers: second enrollment with the same ref fails; the SAME ref under a different program succeeds."
        test_recipe:
          setup: ["two programs exist; shopper EBT-1 enrolled in program 1"]
          setup_api_calls:
            - { call: "POST /programs", payload: { name: "P1", season_start: "2026-08-01T00:00:00Z", season_end: "2026-09-01T00:00:00Z", match_pool_budget_cents: 50000 }, as: ProgramAdmin, captures: { p1: $.data.id } }
            - { call: "POST /programs", payload: { name: "P2", season_start: "2026-08-01T00:00:00Z", season_end: "2026-09-01T00:00:00Z", match_pool_budget_cents: 50000 }, as: ProgramAdmin, captures: { p2: $.data.id } }
            - { call: "POST /shoppers", payload: { program_id: "${p1}", external_benefit_ref: "EBT-1", benefit_type: "SNAP" }, as: BoothOperator }
          trigger:
            - { call: "POST /shoppers", payload: { program_id: "${p1}", external_benefit_ref: "EBT-1", benefit_type: "SNAP" }, as: BoothOperator, captures: { err: $.data.error_id } }
            - { call: "POST /shoppers", payload: { program_id: "${p2}", external_benefit_ref: "EBT-1", benefit_type: "SNAP" }, as: BoothOperator, captures: { ok_id: $.data.id } }
          assert:
            - "duplicate within program 1: error_id == ERR_DUPLICATE_ENROLLMENT (409)"
            - "same ref in program 2: 201 created (uniqueness is program-scoped)"

  # ==================================================================
  - section: state_machines
    instances:
      - name: c_sm_token_minted_into_initial_state_issued
        claim_type: initial_state
        grounds: [state_machines.Token]
        distinguishing_aspect: "Every minted token starts ISSUED with redeemed_vendor_id and submission_id null."
        test_recipe:
          setup: ["base setup; one issuance charge 100 (base 1x100)"]
          setup_api_calls:
            - { call: "POST /programs", payload: { name: "P", season_start: "2026-08-01T00:00:00Z", season_end: "2026-09-01T00:00:00Z", match_pool_budget_cents: 100000 }, as: ProgramAdmin, captures: { prog: $.data.id } }
            - { call: "POST /markets", payload: { program_id: "${prog}", name: "M", city: "C" }, as: ProgramAdmin, captures: { mkt: $.data.id } }
            - { call: "POST /token-batches", payload: { market_id: "${mkt}", kind: "BASE", denomination_cents: 500, serial_start: 100001, serial_end: 100100 }, as: ProgramAdmin, captures: { b5: $.data.id } }
            - { call: "POST /token-batches/${b5}/activate", payload: {}, as: ProgramAdmin }
            - { call: "POST /token-batches", payload: { market_id: "${mkt}", kind: "BASE", denomination_cents: 100, serial_start: 200001, serial_end: 200200 }, as: ProgramAdmin, captures: { b1: $.data.id } }
            - { call: "POST /token-batches/${b1}/activate", payload: {}, as: ProgramAdmin }
            - { call: "POST /token-batches", payload: { market_id: "${mkt}", kind: "MATCH", denomination_cents: 100, serial_start: 300001, serial_end: 300500 }, as: ProgramAdmin, captures: { bm: $.data.id } }
            - { call: "POST /token-batches/${bm}/activate", payload: {}, as: ProgramAdmin }
            - { call: "POST /shoppers", payload: { program_id: "${prog}", external_benefit_ref: "EBT-1", benefit_type: "SNAP" }, as: BoothOperator, captures: { shop: $.data.id } }
            - { call: "POST /shoppers/${shop}/verify", payload: {}, as: ProgramAdmin, captures: { shop_v: $.data.version } }
            - { call: "POST /market-days", payload: { market_id: "${mkt}", date: "2026-08-01", opens_at: "2026-08-01T08:00:00Z", closes_at: "2026-08-01T14:00:00Z" }, as: MarketManager, captures: { day: $.data.id } }
            - { call: "POST /market-days/${day}/open", payload: {}, as: MarketManager }
            - { call: "POST /issuances", payload: { shopper_id: "${shop}", market_day_id: "${day}", benefit_charged_cents: 100, expected_shopper_version: "${shop_v}" }, as: BoothOperator, captures: { iss: $.data.id } }
          trigger:
            - { call: "GET /tokens", payload: { issuance_id: "${iss}" }, as: BoothOperator, captures: { st: "$.data[0].status", rv: "$.data[0].redeemed_vendor_id", sid: "$.data[0].submission_id" } }
          assert:
            - "token status == ISSUED, redeemed_vendor_id == null, submission_id == null"

      - name: c_sm_batch_recall_from_sealed_rejected
        claim_type: invalid_transition
        grounds: [state_machines.TokenBatch, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "RECALL is not in the transition set from SEALED — a never-activated batch cannot be recalled."
        test_recipe:
          setup: ["program + market + one SEALED batch"]
          setup_api_calls:
            - { call: "POST /programs", payload: { name: "P", season_start: "2026-08-01T00:00:00Z", season_end: "2026-09-01T00:00:00Z", match_pool_budget_cents: 50000 }, as: ProgramAdmin, captures: { prog: $.data.id } }
            - { call: "POST /markets", payload: { program_id: "${prog}", name: "M", city: "C" }, as: ProgramAdmin, captures: { mkt: $.data.id } }
            - { call: "POST /token-batches", payload: { market_id: "${mkt}", kind: "BASE", denomination_cents: 500, serial_start: 100001, serial_end: 100100 }, as: ProgramAdmin, captures: { b5: $.data.id } }
          trigger:
            - { call: "POST /token-batches/${b5}/recall", payload: {}, as: ProgramAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE (409); batch remains SEALED"

      - name: c_sm_close_is_one_way_second_close_rejected
        claim_type: invalid_transition
        grounds: [state_machines.MarketDay, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "OPEN -> CLOSED consumes the only close edge; a second close on a CLOSED day is an invalid-from rejection."
        test_recipe:
          setup: ["program + market + day created and opened then closed"]
          setup_api_calls:
            - { call: "POST /programs", payload: { name: "P", season_start: "2026-08-01T00:00:00Z", season_end: "2026-09-01T00:00:00Z", match_pool_budget_cents: 50000 }, as: ProgramAdmin, captures: { prog: $.data.id } }
            - { call: "POST /markets", payload: { program_id: "${prog}", name: "M", city: "C" }, as: ProgramAdmin, captures: { mkt: $.data.id } }
            - { call: "POST /market-days", payload: { market_id: "${mkt}", date: "2026-08-01", opens_at: "2026-08-01T08:00:00Z", closes_at: "2026-08-01T14:00:00Z" }, as: MarketManager, captures: { day: $.data.id } }
            - { call: "POST /market-days/${day}/open", payload: {}, as: MarketManager }
            - { call: "POST /market-days/${day}/close", payload: {}, as: MarketManager }
          trigger:
            - { call: "POST /market-days/${day}/close", payload: {}, as: MarketManager, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE (409)"

      - name: c_sm_open_requires_clock_date_match_then_succeeds
        claim_type: precondition_enforcement
        grounds: [state_machines.MarketDay.SCHEDULED_to_OPEN, "errors[ERR_MARKET_DAY_NOT_OPEN]"]
        distinguishing_aspect: "Open is gated on the logical clock: day dated 2026-08-02 cannot open while the clock reads 2026-08-01 (default), and opens cleanly after the clock advances."
        test_recipe:
          setup: ["program + market + day dated 2026-08-02"]
          setup_api_calls:
            - { call: "POST /programs", payload: { name: "P", season_start: "2026-08-01T00:00:00Z", season_end: "2026-09-01T00:00:00Z", match_pool_budget_cents: 50000 }, as: ProgramAdmin, captures: { prog: $.data.id } }
            - { call: "POST /markets", payload: { program_id: "${prog}", name: "M", city: "C" }, as: ProgramAdmin, captures: { mkt: $.data.id } }
            - { call: "POST /market-days", payload: { market_id: "${mkt}", date: "2026-08-02", opens_at: "2026-08-02T08:00:00Z", closes_at: "2026-08-02T14:00:00Z" }, as: MarketManager, captures: { day: $.data.id } }
          trigger:
            - { call: "POST /market-days/${day}/open", payload: {}, as: MarketManager, captures: { err: $.data.error_id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /market-days/${day}/open", payload: {}, as: MarketManager, captures: { st: $.data.status } }
          assert:
            - "first open: error_id == ERR_MARKET_DAY_NOT_OPEN (clock date 2026-08-01 != day date 2026-08-02)"
            - "after clock set: open succeeds, status == OPEN"

      - name: c_sm_issuance_void_blocked_once_token_redeemed
        claim_type: precondition_enforcement
        grounds: [state_machines.Issuance.ACTIVE_to_VOIDED, "errors[ERR_ISSUANCE_NOT_VOIDABLE]"]
        distinguishing_aspect: "Void is all-or-nothing: after any single token leaves ISSUED, the whole issuance is no longer voidable."
        test_recipe:
          setup: ["base setup; issuance charge 200 (2 base tokens); vendor redeemed serial 200001"]
          setup_api_calls:
            - { call: "POST /programs", payload: { name: "P", season_start: "2026-08-01T00:00:00Z", season_end: "2026-09-01T00:00:00Z", match_pool_budget_cents: 100000 }, as: ProgramAdmin, captures: { prog: $.data.id } }
            - { call: "POST /markets", payload: { program_id: "${prog}", name: "M", city: "C" }, as: ProgramAdmin, captures: { mkt: $.data.id } }
            - { call: "POST /token-batches", payload: { market_id: "${mkt}", kind: "BASE", denomination_cents: 500, serial_start: 100001, serial_end: 100100 }, as: ProgramAdmin, captures: { b5: $.data.id } }
            - { call: "POST /token-batches/${b5}/activate", payload: {}, as: ProgramAdmin }
            - { call: "POST /token-batches", payload: { market_id: "${mkt}", kind: "BASE", denomination_cents: 100, serial_start: 200001, serial_end: 200200 }, as: ProgramAdmin, captures: { b1: $.data.id } }
            - { call: "POST /token-batches/${b1}/activate", payload: {}, as: ProgramAdmin }
            - { call: "POST /token-batches", payload: { market_id: "${mkt}", kind: "MATCH", denomination_cents: 100, serial_start: 300001, serial_end: 300500 }, as: ProgramAdmin, captures: { bm: $.data.id } }
            - { call: "POST /token-batches/${bm}/activate", payload: {}, as: ProgramAdmin }
            - { call: "POST /shoppers", payload: { program_id: "${prog}", external_benefit_ref: "EBT-1", benefit_type: "SNAP" }, as: BoothOperator, captures: { shop: $.data.id } }
            - { call: "POST /shoppers/${shop}/verify", payload: {}, as: ProgramAdmin, captures: { shop_v: $.data.version } }
            - { call: "POST /market-days", payload: { market_id: "${mkt}", date: "2026-08-01", opens_at: "2026-08-01T08:00:00Z", closes_at: "2026-08-01T14:00:00Z" }, as: MarketManager, captures: { day: $.data.id } }
            - { call: "POST /market-days/${day}/open", payload: {}, as: MarketManager }
            - { call: "POST /vendors", payload: { market_id: "${mkt}", legal_name: "V", stall_number: "S1" }, as: ProgramAdmin, captures: { vend: $.data.id } }
            - { call: "POST /vendors/${vend}/approve", payload: {}, as: ProgramAdmin }
            - { call: "POST /issuances", payload: { shopper_id: "${shop}", market_day_id: "${day}", benefit_charged_cents: 200, expected_shopper_version: "${shop_v}" }, as: BoothOperator, captures: { iss: $.data.id } }
            - { call: "POST /tokens/redeem", payload: { serial_number: 200001 }, as: Vendor, as_user_id: "${vend}" }
          trigger:
            - { call: "POST /issuances/${iss}/void", payload: {}, as: BoothOperator, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_ISSUANCE_NOT_VOIDABLE; issuance stays ACTIVE; no pool credit occurs"

      - name: c_sm_reverse_redemption_by_other_vendor_forbidden
        claim_type: precondition_enforcement
        grounds: [state_machines.Token.REDEEMED_to_ISSUED, "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "Reverse-redemption is ownership-checked: only the vendor who redeemed the token may reverse it."
        test_recipe:
          setup: ["base setup; TWO ACTIVE vendors A and B; A redeemed serial 200001"]
          setup_api_calls:
            - { call: "POST /programs", payload: { name: "P", season_start: "2026-08-01T00:00:00Z", season_end: "2026-09-01T00:00:00Z", match_pool_budget_cents: 100000 }, as: ProgramAdmin, captures: { prog: $.data.id } }
            - { call: "POST /markets", payload: { program_id: "${prog}", name: "M", city: "C" }, as: ProgramAdmin, captures: { mkt: $.data.id } }
            - { call: "POST /token-batches", payload: { market_id: "${mkt}", kind: "BASE", denomination_cents: 500, serial_start: 100001, serial_end: 100100 }, as: ProgramAdmin, captures: { b5: $.data.id } }
            - { call: "POST /token-batches/${b5}/activate", payload: {}, as: ProgramAdmin }
            - { call: "POST /token-batches", payload: { market_id: "${mkt}", kind: "BASE", denomination_cents: 100, serial_start: 200001, serial_end: 200200 }, as: ProgramAdmin, captures: { b1: $.data.id } }
            - { call: "POST /token-batches/${b1}/activate", payload: {}, as: ProgramAdmin }
