      - name: retest_same_technician_sod_violation
        claim_type: violation_to_error
        grounds: ["errors[ERR_RETEST_SO_DUTY_VIOLATION]", state_machines.GrainLot.TESTED_to_TESTED, "validations[priority=8]"]
        distinguishing_aspect: "Dispute-retest SoD: certifying the retest with the SAME technician (tech-1) who certified the DISPUTED test is rejected; a different technician (tech-2) succeeds and supersedes the disputed test."
        test_recipe:
          setup: ["lot certified 22.5 by tech-1; owner disputed; retest 21.0 created by tech-2"]
          setup_api_calls:
            - { call: "POST /grain-drying/customers", payload: { name: "C1", credit_limit_cents: 500000 }, as: ElevatorManager, captures: { cust: $.data.id } }
            - { call: "POST /grain-drying/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T08:00:00Z" }, as: ElevatorManager }
            - { call: "POST /grain-drying/grain-lots", payload: { customer_id: "${cust}", commodity: "CORN", gross_weight_lbs: 44000, tare_weight_lbs: 34000, target_moisture_pct: 15.0 }, as: IntakeTechnician, captures: { lot: $.data.id, lot_v: $.data.version } }
            - { call: "POST /grain-drying/moisture-tests", payload: { lot_id: "${lot}", sample_moisture_pct: 22.5, expected_grain_lot_version: "${lot_v}" }, as: IntakeTechnician, as_user_id: "tech-1", captures: { test1: $.data.id } }
            - { call: "POST /grain-drying/moisture-tests/${test1}/certify", payload: {}, as: IntakeTechnician, as_user_id: "tech-1" }
            - { call: "POST /grain-drying/moisture-tests/${test1}/dispute", payload: {}, as: Grower, as_user_id: "${cust}" }
            - { call: "GET /grain-drying/grain-lots/${lot}", as: ElevatorManager, captures: { lot_v2: $.data.version } }
            - { call: "POST /grain-drying/moisture-tests", payload: { lot_id: "${lot}", sample_moisture_pct: 21.0, expected_grain_lot_version: "${lot_v2}", supersedes_test_id: "${test1}" }, as: IntakeTechnician, as_user_id: "tech-2", captures: { test2: $.data.id } }
          trigger:
            - { call: "POST /grain-drying/moisture-tests/${test2}/certify", payload: {}, as: IntakeTechnician, as_user_id: "tech-1", captures: { err: $.data.error_id } }
            - { call: "POST /grain-drying/moisture-tests/${test2}/certify", payload: {}, as: IntakeTechnician, as_user_id: "tech-2", captures: { st2: $.data.status } }
            - { call: "GET /grain-drying/moisture-tests/${test1}", as: ElevatorManager, captures: { st1: $.data.status } }
          assert:
            - "certify by tech-1 -> ERR_RETEST_SO_DUTY_VIOLATION, http 403 (same certifier as the disputed test)"
            - "certify by tech-2 succeeds: ${test2} CERTIFIED"
            - "MoistureTest.${test1}.status == SUPERSEDED"
            - "GrainLot.${lot}.intake_moisture_pct == 21.0"

