            - "Incident I1 of V detected 2026-08-02T00:00:00Z, affected 5, tier 1 (severity LOW), left UNCONTAINED so base(I1) = [2026-08-02T00:00:00Z, 2026-08-05T00:00:00Z] and expanded(I1) = [2026-07-30T00:00:00Z, 2026-08-08T00:00:00Z]."
