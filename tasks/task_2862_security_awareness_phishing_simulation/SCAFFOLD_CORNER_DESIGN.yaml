            - "the scope_department FINANCE filter returns exactly one row, ${w_black}"
            - "a create whose end_at is not strictly after start_at returns HTTP 400 ERR_INVALID_REQUEST"

      - name: incident_links_root_cause_employee_and_filters_by_it
        claim_type: cross_reference_link
        grounds:
          - endpoints[POST /awareness/incidents]
          - endpoints[GET /awareness/incidents]
          - validations[priority 5]
          - errors[ERR_EMPLOYEE_NOT_FOUND]
        distinguishing_aspect: "root_cause_employee_id is an optional cross-reference that is still resolved when supplied: an unknown id returns ERR_EMPLOYEE_NOT_FOUND (404) while a valid one creates the link and makes the incident retrievable through the root_cause_employee_id filter, and omitting it leaves the incident unlinked."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; one ACTIVE employee in ENGINEERING."
          setup_api_calls:
            - { call: "POST /awareness/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /awareness/employees", payload: { email: "ivan.incident@corp.example", full_name: "Ivan Incident", department: "ENGINEERING", role_code: "ENGINEER", hire_date: "2017-01-01" }, as: ProgramAdmin, captures: { e: "$.data.id" } }
          trigger:
            - { call: "POST /awareness/incidents", payload: { incident_type: "CREDENTIAL_PHISHING", severity: "HIGH", department: "ENGINEERING", occurred_at: "2026-07-30T14:00:00Z", summary: "Reused password harvested by a real lure.", root_cause_employee_id: "${e}" }, as: SecurityAnalyst, captures: { i_linked: "$.data.id" } }
            - { call: "POST /awareness/incidents", payload: { incident_type: "CREDENTIAL_PHISHING", severity: "LOW", department: "ENGINEERING", occurred_at: "2026-07-31T14:00:00Z", summary: "Unattributed credential harvesting attempt." }, as: SecurityAnalyst, captures: { i_free: "$.data.id" } }
            - { call: "GET /awareness/incidents", payload: { root_cause_employee_id: "${e}" }, as: SecurityAnalyst }
          assert:
            - "both creates return HTTP 201; IncidentRecord.${i_linked}.root_cause_employee_id == ${e} and IncidentRecord.${i_free}.root_cause_employee_id == null"
            - "the filtered listing returns exactly one row, ${i_linked}, with total_count == 1"
            - "both incidents carry phish_related == true (CREDENTIAL_PHISHING is a phishing incident type)"
            - "a create whose root_cause_employee_id is a random unknown UUID returns HTTP 404 ERR_EMPLOYEE_NOT_FOUND and writes no row"

