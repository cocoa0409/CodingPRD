  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: bay_reserved_minutes_create_cancel
        grounds:
          - state_machines.Inspection.IN_PROGRESS_to_CANCELLED
          - entities.InspectionBay.fields.reserved_minutes
          - entities.Inspection.fields.scheduled_end
        distinguishing_aspect: "Conserved quantity bay.reserved_minutes: creating an inspection adds 60 minutes and cancelling releases exactly 60, so sum(reserved_minutes) returns to its pre-create value (0)."
        test_recipe:
          setup:
            - "Active carrier; REFERRED overweight screening; a bay with reserved_minutes 0."
          setup_api_calls:
