            - "LaneRate.${rate_1}.imbalance_factor == 1.25 (hop 2: forward-looking factor recomputed from net_flow 1, fleet_total 2)"
            - "Reservation.${rsv_b}.price_snapshot.quoted_rate_cents_per_day == 7000 (hop 3: surcharge 2000 now applies because 1.25 > 1.0)"
            - "Reservation.${rsv_b}.price_snapshot.total_quoted_cents == 7000"

      - name: dealer_suspend_mass_reassign_chain
        grounds:
          - state_machines.Dealer.ACTIVE_to_SUSPENDED
          - state_machines.Reservation.CONFIRMED_to_REASSIGNED
          - state_machines.EquipmentUnit.HELD_to_AVAILABLE
          - state_machines.EquipmentUnit.AVAILABLE_to_HELD
        distinguishing_aspect: |
          Depth-2+ cascade from a different trigger (Dealer suspend, not a
          rental event): suspending DA forces each live reservation at DA to
