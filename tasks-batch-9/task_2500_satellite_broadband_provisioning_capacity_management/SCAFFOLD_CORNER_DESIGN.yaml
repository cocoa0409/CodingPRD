              captures: { term1_id: "$.data.id" }
            - { call: "POST /satellite-broadband/terminals/${term1_id}/deliver", payload: {}, as: LogisticsCoordinator }
            - { call: "POST /satellite-broadband/terminals/${term1_id}/obstruction-scans", payload: { obstructed_sample_count: 1, total_sample_count: 200 }, as: Subscriber, as_user_id: "${sub1_id}" }
