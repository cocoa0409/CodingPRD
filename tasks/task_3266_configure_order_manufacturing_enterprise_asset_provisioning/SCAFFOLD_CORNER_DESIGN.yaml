          assert:
            - "error_id == ERR_INVALID_STATE (409)   # request is PENDING, not REJECTED"
            - "SubstitutionRequest.${sm8_sr}.round == 1"

      - name: recycle_recovery_request_is_terminal_for_credit
        claim_type: terminal_lockdown
