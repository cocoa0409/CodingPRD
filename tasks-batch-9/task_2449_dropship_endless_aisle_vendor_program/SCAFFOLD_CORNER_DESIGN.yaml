        as: VendorOpsAnalyst
      - call: POST /dropship/vendors/${ve_id}/integration-tests
        payload:
          message_type: CATALOG
          sample_payload_digest: sha256-enum-catalog
        as: VendorOpsAnalyst
        as_user_id: ops-recorder-enum
        captures:
          te_id: $.data.id
