      - name: quote_accept_cascade_depth2
        grounds:
          - state_machines.Quote.PRESENTED_to_ACCEPTED
          - state_machines.EquipmentItem.SCHEDULED_to_ORDERED
          - state_machines.FabricationOrder (auto-spawned PENDING_SHOP_DRAWING)
