              as: ProjectEngineer
              captures: { plan_id: $.data.id }
            - call: "POST /hydrotest-plans/${plan_id}/approval"
              payload: { decision: "APPROVE" }
              as: ProjectEngineer
              as_user_id: "pe-1"
            - call: "GET /water-sources/${ws_id}"
              as: ErectionSuperintendent
              captures: { ws_v1: $.data.version }
            - call: "POST /water-withdrawals"
              payload: { hydrotest_plan_id: "${plan_id}", water_source_id: "${ws_id}", window_start_utc: "2026-08-11T00:00:00Z", window_end_utc: "2026-08-11T20:00:00Z", rate_gpm: 400, reserved_volume_gal: 400000, expected_water_source_version: "${ws_v1}" }
              as: ErectionSuperintendent
            - call: "POST /settlement-surveys"
