            - "trigger call 2: HTTP 409 with error_id ERR_PRIORITY_SCORE_BELOW_THRESHOLD; PriorityCandidate.${cand_b}.status stays SCORED and selection_rationale stays null"
            - "AssessmentCycle.${cyc}.selected_priority_count == 1"

      - name: advance_to_prioritization_with_zero_completed_interviews_rejected
        grounds:
          - validations.priority_23.ERR_NO_COMMUNITY_INPUT
          - entities.AssessmentCycle.fields.completed_interview_count
          - state_machines.AssessmentCycle.INPUT_GATHERING_to_PRIORITIZATION
        distinguishing_aspect: |
          The community-input gate is a count threshold at exactly 1, and only
          COMPLETED sessions count. A SCHEDULED session and a CANCELLED session
          both leave completed_interview_count at 0, so the advance is rejected
          twice; completing one session moves the count to exactly 1 and the
          same advance then succeeds.
