  # ===========================================================================
  - section: cross_cutting
    instances:
      - name: occ_claim_offer_stale_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[claim-offer-stale-version]", "errors[ERR_STALE_CLAIM_VERSION]"]
        distinguishing_aspect: "OCC on Claim.version: a second sequential offer carrying the pre-first-offer version (1) is rejected with ERR_STALE_CLAIM_VERSION (412) even though the claim state (OFFER_MADE) legitimately accepts offers."
        test_recipe:
          setup: ["DELIVERED shipment; claim FILED at version 1"]
          setup_api_calls:
            - { call: "POST /api/products", payload: { product_code: "RIBEYE-OC1", kind: "PRIMAL", species: "BEEF", max_fat_pct: 12.0, shelf_life_days: 21, required_temp_max_f: 40 }, as: DeskAdmin, captures: { rib_id: "$.data.id" } }
