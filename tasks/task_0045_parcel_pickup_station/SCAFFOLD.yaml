scenario: |
  Community parcel pickup station platform: station management with station profile,
  business hours, storage capacity, staff assignment, and station-level shelf-zone
  configuration; parcel inbound registration with courier-company-side handover,
  parcel scanning, recipient phone-number matching, shelf-position assignment, and
  exception parcel (damaged/wrong-delivery) handling; pickup code generation with
  code generation rules, multi-channel notification (SMS/IM), code re-issuance on
  loss, on-behalf-pickup authorization, and pickup verification (code/face/ID);
  overtime reminder with free storage period configuration, tiered reminder
  intervals, escalation reminder, and overtime fee triggering; return parcel
  workflow with long-stay parcel identification, recipient-confirmation request,
  courier-recall coordination, return-shipment record, and disposal of unclaimed
  parcels; monthly billing with courier-company-paid handover fee, recipient-paid
  storage fee (if applicable), bill generation, payment collection, and dispute
  handling; service quality assessment with mis-shelving rate, lost-parcel rate,
  complaint rate, response timeliness, and assessment-based revenue adjustment;
  event-driven synchronization with payment, IM, and courier-company systems;
  audit logging for parcel status and billing records.

domain_name: parcel-pickup-station
api_prefix: /stations

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: pricing_engine
  complexity_layers:
    - cascading_side_effects
    - rate_threshold_triggers
    - scheduled_deferred_actions
    - derived_field_reconciliation
    - dual_variant_calculation
    - idempotency
  entity_topology: hybrid
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - polymorphic
  role_model: peer_roles
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Station
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Display name of the pickup station.
        constraints: 1..100 chars
      - name: address
        type: string
        source: input
        description: Street address of the station.
      - name: business_hours_open
        type: string
        source: input
        description: Daily opening time in HH:MM (24h) local.
        constraints: matches ^[0-2][0-9]:[0-5][0-9]$
      - name: business_hours_close
        type: string
        source: input
        description: Daily closing time in HH:MM (24h) local.
        constraints: business_hours_close > business_hours_open
      - name: storage_capacity
        type: integer
        source: input
        description: Maximum number of parcels the station can simultaneously hold.
        constraints: ">= 1"
      - name: free_storage_hours
        type: integer
        source: input
        description: Free storage period before overtime fees accrue.
        default: 72
        constraints: ">= 1"
      - name: status
        type: enum
        source: computed
        description: Station operational state.
        constraints: "{ACTIVE, SUSPENDED, CLOSED}"
        default: ACTIVE
      - name: current_occupancy
        type: integer
        source: computed
        description: |
          Denormalized count of Parcels at this station whose status IN
          {SHELVED, OVERTIME, AWAITING_RETURN}. Recomputed on every parcel
          status change.
        default: 0
      - name: quality_score
        type: number
        source: computed
        description: |
          Latest QualityAssessment.composite_score for the most recently CLOSED
          assessment period for this station; null until first assessment closes.
        default: null

  - name: ShelfZone
    parent: Station
    common_fields: true
    fields:
      - name: station_id
        type: string
        source: input
        description: Owning Station id (foreign key).
      - name: zone_code
        type: string
        source: input
        description: Zone code, e.g., "A", "B", "COLD-1".
        constraints: unique per station; 1..16 chars
      - name: row_count
        type: integer
        source: input
        description: Number of rows in this zone.
        constraints: ">= 1"
      - name: column_count
        type: integer
        source: input
        description: Number of columns per row.
        constraints: ">= 1"
      - name: zone_type
        type: enum
        source: input
        description: Zone classification.
        constraints: "{STANDARD, OVERSIZED, FRAGILE, COLD}"
        default: STANDARD
      - name: capacity
        type: integer
        source: computed
        description: row_count * column_count.
      - name: occupied_slots
        type: integer
        source: computed
        description: |
          Count of Parcels currently assigned to this zone with status IN
          {SHELVED, OVERTIME, AWAITING_RETURN}.
        default: 0

  - name: Staff
    parent: Station
    common_fields: true
    fields:
      - name: station_id
        type: string
        source: input
        description: Station this staff member belongs to.
      - name: full_name
        type: string
        source: input
        description: Staff member name.
      - name: phone
        type: string
        source: input
        description: Contact phone in E.164-ish form (digits, 6..15 chars).
      - name: role_kind
        type: enum
        source: input
        description: Staff capability.
        constraints: "{CLERK, MANAGER}"
      - name: status
        type: enum
        source: computed
        description: Employment state.
        constraints: "{ACTIVE, OFF_DUTY, TERMINATED}"
        default: ACTIVE

  - name: Parcel
    parent: Station
    common_fields: true
    fields:
      - name: station_id
        type: string
        source: input
        description: Receiving Station id.
      - name: courier_company_id
        type: string
        source: input
        description: External courier-company identifier (opaque string).
      - name: tracking_number
        type: string
        source: input
        description: Courier tracking number; unique per courier_company_id.
      - name: recipient_phone
        type: string
        source: input
        description: Recipient phone number (digits, 6..15 chars).
      - name: recipient_name
        type: string
        source: input
        description: Recipient display name (optional, may be null).
        default: null
      - name: weight_grams
        type: integer
        source: input
        description: Declared weight in grams.
        constraints: ">= 1"
      - name: size_class
        type: enum
        source: input
        description: Volumetric class.
        constraints: "{S, M, L, XL}"
      - name: shelf_zone_id
        type: string
        source: computed
        description: Assigned ShelfZone id, or null while UNREGISTERED/REJECTED.
        default: null
      - name: shelf_position
        type: string
        source: computed
        description: |
          Row/column slot label "Rxx-Cyy" inside shelf_zone_id; pinned at
          ACCEPT_AND_SHELVE; null while UNREGISTERED/REJECTED.
        default: null
      - name: status
        type: enum
        source: computed
        description: Parcel lifecycle state.
        constraints: "{UNREGISTERED, SHELVED, OVERTIME, AWAITING_RETURN, PICKED_UP, RETURNED, DISPOSED, REJECTED}"
        default: UNREGISTERED
      - name: exception_type
        type: enum
        source: computed
        description: Exception classification when REJECTED.
        constraints: "{NONE, DAMAGED, WRONG_DELIVERY}"
        default: NONE
      - name: shelved_at
        type: datetime
        source: computed
        description: Timestamp the parcel transitioned to SHELVED.
        default: null
      - name: free_storage_deadline
        type: datetime
        source: computed
        description: shelved_at + Station.free_storage_hours hours; immutable once set.
        default: null
      - name: picked_up_at
        type: datetime
        source: computed
        description: Timestamp the parcel transitioned to PICKED_UP.
        default: null
      - name: returned_at
        type: datetime
        source: computed
        description: Timestamp the parcel transitioned to RETURNED.
        default: null
      - name: long_stay_flagged_at
        type: datetime
        source: computed
        description: Timestamp at which long-stay (return candidate) was flagged.
        default: null
      - name: storage_fee_total
        type: number
        source: computed
        description: |
          Provisional storage fee in CNY computed at every billing snapshot,
          finalized on PICKED_UP. Stored to 2 decimals, round_half_up.
        default: 0
      - name: storage_fee_locked
        type: boolean
        source: computed
        description: |
          True once parcel reaches PICKED_UP / RETURNED / DISPOSED so the
          recorded storage_fee_total is final.
        default: false

  - name: PickupCode
    parent: Parcel
    common_fields: true
    fields:
      - name: parcel_id
        type: string
        source: input
        description: Owning Parcel id.
      - name: code
        type: string
        source: computed
        description: |
          Six-digit numeric pickup code; unique across all PickupCode rows whose
          status == ACTIVE.
        constraints: matches ^\d{6}$
      - name: status
        type: enum
        source: computed
        description: Code lifecycle.
        constraints: "{ACTIVE, REISSUED, CONSUMED, VOIDED}"
        default: ACTIVE
      - name: issued_at
        type: datetime
        source: computed
        description: Timestamp the code was minted.
      - name: issue_reason
        type: enum
        source: computed
        description: Why the code was issued.
        constraints: "{INITIAL, REISSUED_LOST}"
        default: INITIAL
      - name: consumed_at
        type: datetime
        source: computed
        description: Timestamp the code transitioned to CONSUMED.
        default: null
      - name: superseded_by
        type: string
        source: computed
        description: |
          PickupCode.id of the replacement code when this row's status == REISSUED;
          null otherwise.
        default: null

  - name: PickupAuthorization
    parent: Parcel
    common_fields: false
    fields:
      - name: parcel_id
        type: string
        source: input
        description: Parcel being delegated.
      - name: delegate_name
        type: string
        source: input
        description: Authorized pickup person name.
      - name: delegate_id_number
        type: string
        source: input
        description: Government ID number of the delegate.
      - name: delegate_phone
        type: string
        source: input
        description: Phone of the delegate.
      - name: granted_at
        type: datetime
        source: system
        description: Timestamp authorization was created.
      - name: expires_at
        type: datetime
        source: input
        description: Authorization expiry; must be > granted_at and <= Parcel.free_storage_deadline + 7 days.
      - name: status
        type: enum
        source: computed
        description: Authorization state.
        constraints: "{ACTIVE, CONSUMED, EXPIRED, REVOKED}"
        default: ACTIVE

  - name: ReminderRecord
    parent: Parcel
    common_fields: false
    fields:
      - name: parcel_id
        type: string
        source: input
        description: Parcel being reminded.
      - name: tier
        type: enum
        source: computed
        description: Reminder tier per §1.3 reminder_schedule.
        constraints: "{T1_INITIAL, T2_FOLLOWUP, T3_ESCALATION, T4_RETURN_CONFIRM}"
      - name: channel
        type: enum
        source: computed
        description: Notification channel.
        constraints: "{SMS, IM}"
      - name: sent_at
        type: datetime
        source: system
        description: Timestamp the reminder was emitted.
      - name: triggered_by
        type: enum
        source: computed
        description: Which sweep emitted this reminder.
        constraints: "{INBOUND, OVERTIME_SWEEP, LONG_STAY_SWEEP}"

  - name: ReturnShipment
    parent: Parcel
    common_fields: true
    fields:
      - name: parcel_id
        type: string
        source: input
        description: Parcel being returned.
      - name: courier_company_id
        type: string
        source: computed
        description: Mirrors Parcel.courier_company_id at return-creation time.
      - name: courier_tracking_return
        type: string
        source: input
        description: Return-leg tracking number from the courier.
      - name: status
        type: enum
        source: computed
        description: Return workflow state.
        constraints: "{REQUESTED, COURIER_ACCEPTED, COURIER_DECLINED, SHIPPED, DISPOSED}"
        default: REQUESTED
      - name: requested_at
        type: datetime
        source: system
        description: Timestamp the return was requested.
      - name: courier_response_at
        type: datetime
        source: computed
        description: Timestamp the courier responded.
        default: null
      - name: shipped_at
        type: datetime
        source: computed
        description: Timestamp the return shipment was confirmed shipped.
        default: null

  - name: BillingPeriod
    parent: Station
    common_fields: true
    fields:
      - name: station_id
        type: string
        source: input
        description: Station the billing period covers.
      - name: period_yyyymm
        type: string
        source: input
        description: Period identifier in YYYYMM form.
        constraints: matches ^\d{6}$; unique per station_id
      - name: period_start
        type: datetime
        source: computed
        description: Inclusive UTC start (YYYY-MM-01T00:00:00.000Z).
      - name: period_end
        type: datetime
        source: computed
        description: Exclusive UTC end (first day of following month).
      - name: status
        type: enum
        source: computed
        description: Billing-period lifecycle.
        constraints: "{OPEN, CLOSED, SETTLED, DISPUTED}"
        default: OPEN
      - name: handover_fee_total
        type: number
        source: computed
        description: Sum of Bill.handover_fee_amount for all Bills under this period.
        default: 0
      - name: storage_fee_total
        type: number
        source: computed
        description: Sum of Bill.storage_fee_amount for all Bills under this period.
        default: 0
      - name: quality_adjustment_factor
        type: number
        source: computed
        description: |
          Multiplier applied to handover_fee_total at CLOSE time based on the
          QualityAssessment.composite_score for this period (see §1.3
          quality_adjustment).
        default: 1.0
      - name: final_total
        type: number
        source: computed
        description: |
          final_total = round(handover_fee_total * quality_adjustment_factor +
          storage_fee_total, 2, half_up); pinned at CLOSE time.
        default: 0

  - name: Bill
    parent: BillingPeriod
    common_fields: true
    fields:
      - name: billing_period_id
        type: string
        source: input
        description: Owning BillingPeriod id.
      - name: payer_kind
        type: enum
        source: input
        description: Who owes this bill.
        constraints: "{COURIER_COMPANY, RECIPIENT}"
      - name: payer_ref
        type: string
        source: input
        description: |
          When payer_kind == COURIER_COMPANY: courier_company_id.
          When payer_kind == RECIPIENT: recipient_phone (E.164-ish).
      - name: handover_fee_amount
        type: number
        source: computed
        description: |
          Sum of HANDOVER_FEE_PER_PARCEL across all Parcels in the period for
          this courier company; zero for RECIPIENT bills.
        default: 0
      - name: storage_fee_amount
        type: number
        source: computed
        description: |
          Sum of Parcel.storage_fee_total finalized within the period for this
          recipient; zero for COURIER_COMPANY bills.
        default: 0
      - name: parcel_count
        type: integer
        source: computed
        description: Number of parcels rolled up into this bill.
        default: 0
      - name: status
        type: enum
        source: computed
        description: Bill state.
        constraints: "{DRAFT, ISSUED, PAID, DISPUTED, RESOLVED, WRITTEN_OFF}"
        default: DRAFT
      - name: issued_at
        type: datetime
        source: computed
        description: Timestamp the bill transitioned to ISSUED.
        default: null
      - name: paid_at
        type: datetime
        source: computed
        description: Timestamp the bill transitioned to PAID.
        default: null
      - name: dispute_reason
        type: string
        source: computed
        description: Reason text recorded when entering DISPUTED.
        default: null

  - name: QualityAssessment
    parent: Station
    common_fields: true
    fields:
      - name: station_id
        type: string
        source: input
        description: Station being assessed.
      - name: period_yyyymm
        type: string
        source: input
        description: Assessment period (YYYYMM); unique per station_id.
      - name: mis_shelving_rate
        type: number
        source: computed
        description: |
          count(Parcels in period with at least one ShelfReassignment audit event
          on a non-staff-initiated correction) / count(Parcels SHELVED in period).
        default: 0
      - name: lost_parcel_rate
        type: number
        source: computed
        description: count(Parcels REJECTED with exception_type==WRONG_DELIVERY in period)/count(Parcels inbound in period).
        default: 0
      - name: complaint_rate
        type: number
        source: computed
        description: count(Bills DISPUTED in period)/count(Bills ISSUED in period).
        default: 0
      - name: response_timeliness_score
        type: number
        source: computed
        description: |
          Average of (1 - clamp((reminder_delay_minutes - SLA_MINUTES)/SLA_MINUTES, 0, 1))
          across all ReminderRecord rows in period; 1.0 means all on time, 0.0 means none.
        default: 1.0
      - name: composite_score
        type: number
        source: computed
        description: |
          Weighted sum; see calculations.quality_composite. Range 0.00..1.00.
        default: 1.0
      - name: status
        type: enum
        source: computed
        description: Assessment state.
        constraints: "{DRAFT, CLOSED}"
        default: DRAFT
      - name: closed_at
        type: datetime
        source: computed
        description: Timestamp the assessment closed.
        default: null

  - name: AuditEvent
    parent: null
    common_fields: false
    fields:
      - name: subject_kind
        type: enum
        source: input
        description: Which entity type the event is about.
        constraints: "{Parcel, Bill, PickupCode, ReturnShipment}"
      - name: subject_id
        type: string
        source: input
        description: Id of the subject.
      - name: action
        type: string
        source: input
        description: Action name, e.g., "INBOUND_ACCEPTED", "BILL_DISPUTED".
      - name: actor_role
        type: string
        source: input
        description: Role of the actor that produced the event.
      - name: actor_id
        type: string
        source: input
        description: X-User-ID at the time of the event.
      - name: from_state
        type: string
        source: input
        description: State before the event (null for create).
        default: null
      - name: to_state
        type: string
        source: input
        description: State after the event (null for non-state changes).
        default: null
      - name: payload
        type: object
        source: input
        description: |
          Free-form JSON object capturing the diff or action body (e.g.,
          {"from_zone": "A", "to_zone": "B"} for ShelfReassignment).

  - name: SystemEventOutbox
    parent: null
    common_fields: false
    fields:
      - name: target_system
        type: enum
        source: input
        description: External system the event targets.
        constraints: "{PAYMENT, IM, COURIER}"
      - name: event_name
        type: string
        source: input
        description: Event name, e.g., "BILL_ISSUED", "RETURN_REQUESTED", "PICKUP_CODE_SENT".
      - name: subject_kind
        type: enum
        source: input
        description: Subject entity kind.
        constraints: "{Bill, Parcel, PickupCode, ReturnShipment}"
      - name: subject_id
        type: string
        source: input
        description: Id of the subject.
      - name: payload
        type: object
        source: input
        description: Event payload (idempotency-keyed by event_name+subject_id+sequence).
      - name: sequence
        type: integer
        source: system
        description: Monotonic counter per (subject_kind, subject_id).
      - name: emitted_at
        type: datetime
        source: system
        description: Timestamp the event was placed on the outbox.

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Parcel
    initial_state: UNREGISTERED
    terminal_states: [PICKED_UP, RETURNED, DISPOSED, REJECTED]
    transitions:
      - from: UNREGISTERED
        to: SHELVED
        trigger: "POST /stations/{station_id}/parcels (accept_and_shelve=true)"
        actor: Clerk
        preconditions:
          - "Station.status == ACTIVE"
          - "Station.current_occupancy < Station.storage_capacity"
          - "Target ShelfZone has occupied_slots < capacity"
          - "exception_type == NONE"
          - "No other ACTIVE Parcel for the same (courier_company_id, tracking_number)"
        side_effects:
          - "Set shelf_zone_id, shelf_position, shelved_at = now()"
          - "Compute free_storage_deadline = shelved_at + Station.free_storage_hours hours"
          - "Station.current_occupancy += 1; ShelfZone.occupied_slots += 1"
          - "Mint PickupCode (issue_reason=INITIAL, status=ACTIVE) via calc pickup_code_minting"
          - "Emit ReminderRecord (tier=T1_INITIAL, channel=SMS, triggered_by=INBOUND)"
          - "Append AuditEvent(action=INBOUND_ACCEPTED)"
          - "Append SystemEventOutbox(target=IM, event=PICKUP_CODE_SENT)"

      - from: UNREGISTERED
        to: REJECTED
        trigger: "POST /stations/{station_id}/parcels (exception_type in {DAMAGED, WRONG_DELIVERY})"
        actor: Clerk
        preconditions:
          - "Station.status IN {ACTIVE, SUSPENDED}"
          - "exception_type != NONE"
        side_effects:
          - "Do NOT consume capacity or shelf slot"
          - "Append AuditEvent(action=INBOUND_REJECTED, payload.exception_type)"

      - from: SHELVED
        to: OVERTIME
        trigger: "POST /_sweep/run with mode=overtime; system, when now() >= free_storage_deadline"
        actor: system
        preconditions:
          - "now() >= free_storage_deadline"
          - "status == SHELVED"
        side_effects:
          - "Recompute storage_fee_total via calc storage_fee.provisional"
          - "Emit ReminderRecord per §1.3 reminder_schedule tier T2_FOLLOWUP or T3_ESCALATION"
          - "Append AuditEvent(action=OVERTIME_FLAGGED)"

      - from: OVERTIME
        to: AWAITING_RETURN
        trigger: "POST /_sweep/run with mode=long_stay; system, when now() >= shelved_at + LONG_STAY_HOURS"
        actor: system
        preconditions:
          - "now() >= shelved_at + LONG_STAY_HOURS (constant 168h)"
          - "status == OVERTIME"
        side_effects:
          - "Set long_stay_flagged_at = now()"
          - "Emit ReminderRecord (tier=T4_RETURN_CONFIRM, channel=IM, triggered_by=LONG_STAY_SWEEP)"
          - "Append AuditEvent(action=LONG_STAY_FLAGGED)"

      - from: SHELVED
        to: PICKED_UP
        trigger: "POST /parcels/{id}/pickup (verification body)"
        actor: Clerk
        preconditions:
          - "Verification body matches one of: ACTIVE PickupCode.code; or ACTIVE PickupAuthorization for delegate ID; or face match flag"
          - "If using PickupAuthorization: now() < PickupAuthorization.expires_at AND its status == ACTIVE"
          - "If using PickupCode: PickupCode.status == ACTIVE"
        side_effects:
          - "Finalize storage_fee_total via calc storage_fee.final; set storage_fee_locked = true"
          - "If storage_fee_total > 0: lazy-create / append to RECIPIENT Bill for current period"
          - "Set picked_up_at = now(); set status = PICKED_UP"
          - "PickupCode.status: ACTIVE -> CONSUMED; PickupCode.consumed_at = now() (when code used)"
          - "PickupAuthorization.status: ACTIVE -> CONSUMED (when authorization used)"
          - "Station.current_occupancy -= 1; ShelfZone.occupied_slots -= 1"
          - "Append AuditEvent(action=PICKED_UP)"

      - from: OVERTIME
        to: PICKED_UP
        trigger: "POST /parcels/{id}/pickup (verification body)"
        actor: Clerk
        preconditions:
          - "Same as SHELVED -> PICKED_UP"
        side_effects:
          - "Same as SHELVED -> PICKED_UP (storage fee already accruing)"

      - from: AWAITING_RETURN
        to: PICKED_UP
        trigger: "POST /parcels/{id}/pickup (verification body) before return is COURIER_ACCEPTED"
        actor: Clerk
        preconditions:
          - "No ReturnShipment for this parcel with status IN {COURIER_ACCEPTED, SHIPPED, DISPOSED}"
          - "Verification body valid"
        side_effects:
          - "Same as SHELVED -> PICKED_UP plus: any REQUESTED ReturnShipment is auto-voided (status -> COURIER_DECLINED with note)"

      - from: AWAITING_RETURN
        to: RETURNED
        trigger: "POST /return-shipments/{id}/ship (system event from courier)"
        actor: system
        preconditions:
          - "ReturnShipment.status == COURIER_ACCEPTED"
        side_effects:
          - "Set returned_at = now(); set status = RETURNED"
          - "Finalize storage_fee_total via calc storage_fee.final; storage_fee_locked = true"
          - "Station.current_occupancy -= 1; ShelfZone.occupied_slots -= 1"
          - "Append AuditEvent(action=RETURNED)"
          - "Append SystemEventOutbox(target=COURIER, event=RETURN_SHIPPED)"

      - from: AWAITING_RETURN
        to: DISPOSED
        trigger: "POST /parcels/{id}/dispose"
        actor: Manager
        preconditions:
          - "long_stay_flagged_at IS NOT NULL"
          - "now() >= long_stay_flagged_at + DISPOSAL_GRACE_HOURS (constant 240h)"
          - "No ReturnShipment.status IN {COURIER_ACCEPTED, SHIPPED}"
        side_effects:
          - "Set status = DISPOSED; storage_fee_locked = true"
          - "Station.current_occupancy -= 1; ShelfZone.occupied_slots -= 1"
          - "Append AuditEvent(action=DISPOSED)"

  - entity: PickupCode
    initial_state: ACTIVE
    terminal_states: [CONSUMED, VOIDED]
    transitions:
      - from: ACTIVE
        to: REISSUED
        trigger: "POST /parcels/{parcel_id}/pickup-codes (reason=LOST)"
        actor: Recipient
        preconditions:
          - "Parcel.status IN {SHELVED, OVERTIME, AWAITING_RETURN}"
          - "An ACTIVE PickupCode exists for this parcel"
        side_effects:
          - "Old code.status -> REISSUED; new code minted via calc pickup_code_minting"
          - "Old code.superseded_by = new_code.id"
          - "Append SystemEventOutbox(target=IM, event=PICKUP_CODE_REISSUED)"
      - from: ACTIVE
        to: CONSUMED
        trigger: "POST /parcels/{id}/pickup (code verification)"
        actor: Clerk
        preconditions:
          - "Parent Parcel transitions to PICKED_UP"
        side_effects:
          - "consumed_at = now()"
      - from: ACTIVE
        to: VOIDED
        trigger: "Parent Parcel reaches RETURNED or DISPOSED"
        actor: system
        preconditions:
          - "Parcel terminal state in {RETURNED, DISPOSED}"
        side_effects: ["Set consumed_at = null"]
      - from: REISSUED
        to: VOIDED
        trigger: "Parent Parcel reaches RETURNED or DISPOSED"
        actor: system
        preconditions:
          - "Parcel terminal state in {RETURNED, DISPOSED}"
        side_effects: []

  - entity: ReturnShipment
    initial_state: REQUESTED
    terminal_states: [SHIPPED, DISPOSED, COURIER_DECLINED]
    transitions:
      - from: REQUESTED
        to: COURIER_ACCEPTED
        trigger: "POST /return-shipments/{id}/courier-response (decision=accept)"
        actor: system
        preconditions:
          - "Parent Parcel.status == AWAITING_RETURN"
        side_effects:
          - "courier_response_at = now()"
          - "Append AuditEvent(action=RETURN_ACCEPTED)"
      - from: REQUESTED
        to: COURIER_DECLINED
        trigger: "POST /return-shipments/{id}/courier-response (decision=decline)"
        actor: system
        preconditions:
          - "Parent Parcel.status == AWAITING_RETURN"
        side_effects:
          - "courier_response_at = now()"
      - from: COURIER_ACCEPTED
        to: SHIPPED
        trigger: "POST /return-shipments/{id}/ship"
        actor: system
        preconditions:
          - "Parent Parcel.status == AWAITING_RETURN"
        side_effects:
          - "shipped_at = now()"
          - "Parent Parcel transitions AWAITING_RETURN -> RETURNED"

  - entity: BillingPeriod
    initial_state: OPEN
    terminal_states: [SETTLED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /stations/{station_id}/billing-periods/{period}/close"
        actor: Manager
        preconditions:
          - "now() >= period_end"
          - "QualityAssessment for this (station_id, period_yyyymm) has status == CLOSED"
        side_effects:
          - "Snapshot quality_adjustment_factor from QualityAssessment.composite_score (calc quality_adjustment)"
          - "Recompute handover_fee_total, storage_fee_total, final_total (calcs handover_fee, storage_fee.final, period_final_total)"
          - "All child Bills with status==DRAFT transition to ISSUED"
          - "Append SystemEventOutbox(target=PAYMENT, event=BILL_ISSUED) per bill"
      - from: CLOSED
        to: SETTLED
        trigger: "Auto when all child Bills.status IN {PAID, WRITTEN_OFF, RESOLVED}"
        actor: system
        preconditions:
          - "Every Bill under this period is in {PAID, WRITTEN_OFF, RESOLVED}"
        side_effects: ["Append AuditEvent(action=PERIOD_SETTLED)"]
      - from: CLOSED
        to: DISPUTED
        trigger: "Auto when any child Bill enters DISPUTED"
        actor: system
        preconditions:
          - "At least one child Bill.status == DISPUTED"
        side_effects: []
      - from: DISPUTED
        to: CLOSED
        trigger: "Auto when no child Bill is DISPUTED anymore"
        actor: system
        preconditions:
          - "No child Bill.status == DISPUTED"
        side_effects: []

  - entity: Bill
    initial_state: DRAFT
    terminal_states: [PAID, WRITTEN_OFF, RESOLVED]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "Parent BillingPeriod transitions OPEN -> CLOSED"
        actor: system
        preconditions:
          - "BillingPeriod.status transitioning to CLOSED"
        side_effects:
          - "issued_at = now()"
          - "Append SystemEventOutbox(target=PAYMENT, event=BILL_ISSUED)"
      - from: ISSUED
        to: PAID
        trigger: "POST /bills/{id}/payments (idempotency_key)"
        actor: PaymentSystem
        preconditions:
          - "Parent BillingPeriod.status IN {CLOSED, DISPUTED}"
        side_effects:
          - "paid_at = now()"
          - "If all sibling Bills also terminal: BillingPeriod transitions CLOSED -> SETTLED"
      - from: ISSUED
        to: DISPUTED
        trigger: "POST /bills/{id}/dispute"
        actor: Recipient | CourierCompany
        preconditions:
          - "Parent BillingPeriod.status IN {CLOSED, DISPUTED}"
        side_effects:
          - "Record dispute_reason"
          - "Bubble up: BillingPeriod -> DISPUTED"
      - from: DISPUTED
        to: RESOLVED
        trigger: "POST /bills/{id}/resolve-dispute"
        actor: Manager
        preconditions:
          - "Bill.status == DISPUTED"
        side_effects:
          - "Possibly recompute amounts via calc storage_fee.final or handover_fee (adjustment recorded in payload)"
          - "Bubble up: if no sibling DISPUTED, BillingPeriod -> CLOSED"
      - from: DISPUTED
        to: WRITTEN_OFF
        trigger: "POST /bills/{id}/write-off"
        actor: Manager
        preconditions:
          - "Bill.status == DISPUTED"
        side_effects:
          - "Bubble up bookkeeping (same as RESOLVED)"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - scenario: "Two clerks attempt to pickup the same parcel concurrently"
    guarantee: "At most one pickup succeeds; second is rejected"
    error_id: ERR_PARCEL_ALREADY_PICKED_UP
    http_status: 409
    serialization: "First-writer-wins on Parcel.status (UNREGISTERED|SHELVED|OVERTIME|AWAITING_RETURN -> PICKED_UP)"

  - scenario: "Pickup and dispose race on the same AWAITING_RETURN parcel"
    guarantee: "Exactly one wins; loser rejected"
    error_id: ERR_INVALID_PARCEL_STATE
    http_status: 409
    serialization: "First-writer-wins on Parcel.status"

  - scenario: "Two inbound registrations claim the same shelf slot in the same zone"
    guarantee: "At most one parcel occupies a given (shelf_zone_id, shelf_position)"
    error_id: ERR_SHELF_POSITION_OCCUPIED
    http_status: 409
    serialization: "First-writer-wins on (shelf_zone_id, shelf_position) uniqueness over Parcel rows with status IN {SHELVED, OVERTIME, AWAITING_RETURN}"

  - scenario: "Two reissue requests for the same parcel collide"
    guarantee: "At most one new ACTIVE PickupCode exists per parcel"
    error_id: ERR_PICKUP_CODE_REISSUE_RACE
    http_status: 409
    serialization: "First-writer-wins on PickupCode.status flip ACTIVE -> REISSUED"

  - scenario: "Two payments arrive for the same Bill with the same idempotency_key"
    guarantee: "Second is treated as duplicate and returns the original result"
    error_id: ERR_IDEMPOTENCY_REPLAY
    http_status: 200
    serialization: "Idempotency-key dedup on (Bill.id, idempotency_key)"

  - scenario: "Two payments with different idempotency_keys arrive for the same already-PAID bill"
    guarantee: "Only the first transitions to PAID; subsequent rejected"
    error_id: ERR_BILL_ALREADY_PAID
    http_status: 409
    serialization: "First-writer-wins on Bill.status ISSUED -> PAID"

  - scenario: "Close billing period while a Bill is concurrently disputed"
    guarantee: "Either CLOSE sees the dispute (period ends up DISPUTED after close) or the dispute sees DRAFT bill state and is rejected"
    error_id: ERR_BILL_NOT_ISSUED
    http_status: 409
    serialization: "Bill.status transitions are linearized after BillingPeriod close"

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: pickup_code_minting
    trigger: "Parcel UNREGISTERED->SHELVED, and PickupCode ACTIVE->REISSUED"
    algorithm: selector_policy
    formula: |
      candidate = random 6-digit string in 000000..999999
      reject if (exists PickupCode.code == candidate AND PickupCode.status == ACTIVE)
      retry up to RETRY_LIMIT (=20) times; on exhaustion raise ERR_PICKUP_CODE_GENERATION_EXHAUSTED
    input_set: "Active PickupCode rows across the whole platform"
    constants:
      CODE_LENGTH: 6
      RETRY_LIMIT: 20
    precision: "exact integer formatted as zero-padded 6 digits"

  - name: storage_fee
    trigger: "Parcel SHELVED->OVERTIME, OVERTIME->PICKED_UP, AWAITING_RETURN->RETURNED, AWAITING_RETURN->DISPOSED; BillingPeriod close snapshot"
    algorithm: tiered_pricing
    formula: |
      # Tiered hourly accrual after free_storage_deadline (per parcel)
      let t = now() (or PICKED_UP/RETURNED/DISPOSED timestamp for final)
      if t <= free_storage_deadline: return 0.00
      overdue_hours = ceil((t - free_storage_deadline) / 1h)         # ceiling on hours
      tier1 = min(overdue_hours, T1_HOURS)                            # first 24h
      tier2 = max(0, min(overdue_hours - T1_HOURS, T2_HOURS))         # next 72h
      tier3 = max(0, overdue_hours - T1_HOURS - T2_HOURS)             # 96h+
      raw   = tier1*RATE1 + tier2*RATE2 + tier3*RATE3
      # Apply SIZE_MULTIPLIER per Parcel.size_class then round
      final = round(raw * SIZE_MULTIPLIER[size_class], 2, half_up)
      return final
    input_set: "Single Parcel; only counted if t > free_storage_deadline"
    constants:
      T1_HOURS: 24
      T2_HOURS: 72
      RATE1: 0.50
      RATE2: 1.00
      RATE3: 2.00
      SIZE_MULTIPLIER:
        S: 1.0
        M: 1.0
        L: 1.5
        XL: 2.0
    precision: "2 decimals, round_half_up; rounded ONCE after multiplying by size multiplier"
    variants:
      - name: provisional
        when: "Called during OVERTIME sweep and during BillingPeriod CLOSE snapshot before parcel terminal state; uses t = now()"
        difference: "Recomputed on each call; written to storage_fee_total but storage_fee_locked stays false"
      - name: final
        when: "Called when Parcel reaches PICKED_UP / RETURNED / DISPOSED; uses t = the terminal-state timestamp"
        difference: "Result is locked; subsequent recomputes MUST not alter storage_fee_total"

  - name: handover_fee
    trigger: "BillingPeriod close: aggregate per courier_company_id"
    algorithm: aggregation
    formula: |
      # For each (BillingPeriod, courier_company_id):
      # Count parcels whose shelved_at is in [period_start, period_end) AND
      # whose terminal status is not REJECTED, with handover_fee_qualified.
      n = count(Parcel where station_id==period.station_id
                          AND courier_company_id==X
                          AND shelved_at >= period_start
                          AND shelved_at <  period_end
                          AND status != REJECTED)
      handover_fee_amount = round(n * HANDOVER_FEE_PER_PARCEL, 2, half_up)
    input_set: |
      Parcels with shelved_at IN [period_start, period_end); exclude REJECTED (which
      were never shelved). Re-inbound after REJECTED produces a new Parcel row.
    constants:
      HANDOVER_FEE_PER_PARCEL: 0.80
    precision: "2 decimals, round_half_up"

  - name: quality_adjustment
    trigger: "BillingPeriod OPEN->CLOSED"
    algorithm: weighted_scoring
    formula: |
      # Computed inside QualityAssessment, then read at period close.
      composite = round(
          W_MIS_SHELVING   * (1 - mis_shelving_rate)
        + W_LOST_PARCEL    * (1 - lost_parcel_rate)
        + W_COMPLAINT      * (1 - complaint_rate)
        + W_RESPONSE_TIME  * response_timeliness_score
      , 2, half_up)
      # Tiered adjustment factor — pinned mapping of composite -> factor:
      if composite >= 0.95: factor = 1.05
      elif composite >= 0.85: factor = 1.00
      elif composite >= 0.70: factor = 0.95
      else: factor = 0.85
      return factor
    input_set: "QualityAssessment.composite_score for the same (station_id, period_yyyymm)"
    constants:
      W_MIS_SHELVING: 0.30
      W_LOST_PARCEL: 0.30
      W_COMPLAINT: 0.20
      W_RESPONSE_TIME: 0.20
      SLA_MINUTES: 15
    precision: "composite to 2 decimals round_half_up; factor selected by >= tier; tiers use >= (closed lower bound)"

  - name: quality_composite
    trigger: "POST /stations/{station_id}/quality-assessments/{period}/close"
    algorithm: weighted_scoring
    formula: |
      same as quality_adjustment composite stage (no factor lookup)
    input_set: "Reminders + Parcels + Bills inside [period_start, period_end)"
    constants:
      SLA_MINUTES: 15
    precision: "Composite to 2 decimals; component rates each to 4 decimals before mixing (round inputs THEN sum-then-round)"

  - name: period_final_total
    trigger: "BillingPeriod close"
    algorithm: aggregation
    formula: |
      handover_total = sum(Bill.handover_fee_amount for Bill in period)
      storage_total  = sum(Bill.storage_fee_amount  for Bill in period)
      adjusted_handover = round(handover_total * quality_adjustment_factor, 2, half_up)
      final_total = round(adjusted_handover + storage_total, 2, half_up)
    input_set: "All Bills under this BillingPeriod after handover/storage aggregation"
    constants: {}
    precision: |
      Rounding order is PINNED: round(handover_total * factor) FIRST, then
      add storage_total, then round again. Do NOT round (handover_total*factor +
      storage_total) in one shot.

  - name: reminder_schedule
    trigger: "POST /_sweep/run (overtime + long-stay)"
    algorithm: threshold
    formula: |
      For each SHELVED parcel: if now() >= free_storage_deadline AND no T2_FOLLOWUP yet -> emit (T2_FOLLOWUP, SMS)
      For each OVERTIME parcel: if now() >= free_storage_deadline + ESCALATION_HOURS AND no T3_ESCALATION yet -> emit (T3_ESCALATION, IM)
      For each OVERTIME parcel: if now() >= shelved_at + LONG_STAY_HOURS -> transition to AWAITING_RETURN AND emit (T4_RETURN_CONFIRM, IM)
    input_set: "All non-terminal Parcels at the station; sweep is idempotent (no duplicate ReminderRecord per tier per parcel)"
    constants:
      ESCALATION_HOURS: 24
      LONG_STAY_HOURS: 168
      DISPOSAL_GRACE_HOURS: 240
      SLA_MINUTES: 15

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present"
    error_id: ERR_AUTH_MISSING
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "X-User-Role permitted for this endpoint per §1.7"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all
  - priority: 3
    category: existence
    check: "All path-segment ids resolve left-to-right (station_id, then parcel_id, etc.)"
    error_id: ERR_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: all
  - priority: 4
    category: existence
    check: "Foreign keys in body (e.g., shelf_zone_id, billing_period_id) resolve"
    error_id: ERR_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: all
  - priority: 5
    category: state
    check: "Station.status == ACTIVE for inbound and pickup actions; ACTIVE or SUSPENDED for read"
    error_id: ERR_STATION_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /stations/{id}/parcels; POST /parcels/{id}/pickup"
  - priority: 6
    category: state
    check: "Parcel.status compatible with action (state machine)"
    error_id: ERR_INVALID_PARCEL_STATE
    http_status: 409
    applies_to: "all parcel mutations"
  - priority: 7
    category: state
    check: "Bill.status compatible with action (state machine)"
    error_id: ERR_INVALID_BILL_STATE
    http_status: 409
    applies_to: "all bill mutations"
  - priority: 8
    category: business_safety
    check: "exception_type IN {DAMAGED, WRONG_DELIVERY} -> Parcel goes to REJECTED, NO shelf assignment occupied"
    error_id: ERR_EXCEPTION_PARCEL_CANNOT_SHELVE
    http_status: 422
    applies_to: "POST /stations/{id}/parcels"
  - priority: 9
    category: business_referential
    check: "ShelfZone.station_id == path station_id"
    error_id: ERR_SHELF_ZONE_STATION_MISMATCH
    http_status: 422
    applies_to: "POST /stations/{id}/parcels"
  - priority: 10
    category: business_constraint
    check: "Target shelf_position not occupied by another Parcel with status IN {SHELVED, OVERTIME, AWAITING_RETURN}"
    error_id: ERR_SHELF_POSITION_OCCUPIED
    http_status: 409
    applies_to: "POST /stations/{id}/parcels"
  - priority: 11
    category: business_constraint
    check: "ShelfZone.occupied_slots < ShelfZone.capacity"
    error_id: ERR_SHELF_ZONE_FULL
    http_status: 409
    applies_to: "POST /stations/{id}/parcels"
  - priority: 12
    category: business_constraint
    check: "Station.current_occupancy < Station.storage_capacity"
    error_id: ERR_STATION_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /stations/{id}/parcels"
  - priority: 13
    category: business_constraint
    check: "(courier_company_id, tracking_number) unique among Parcels with status NOT IN {REJECTED}"
    error_id: ERR_DUPLICATE_TRACKING_NUMBER
    http_status: 409
    applies_to: "POST /stations/{id}/parcels"
  - priority: 14
    category: business_safety
    check: "Pickup verification: provided code matches an ACTIVE PickupCode for this parcel, OR a valid PickupAuthorization, OR face_match==true (server-trusted flag)"
    error_id: ERR_PICKUP_VERIFICATION_FAILED
    http_status: 422
    applies_to: "POST /parcels/{id}/pickup"
  - priority: 15
    category: business_temporal
    check: "PickupAuthorization.expires_at > granted_at AND <= Parcel.free_storage_deadline + 7 days"
    error_id: ERR_AUTHORIZATION_EXPIRY_INVALID
    http_status: 422
    applies_to: "POST /parcels/{id}/authorizations"
  - priority: 16
    category: business_temporal
    check: "DISPOSE only when now() >= long_stay_flagged_at + DISPOSAL_GRACE_HOURS"
    error_id: ERR_DISPOSAL_TOO_EARLY
    http_status: 422
    applies_to: "POST /parcels/{id}/dispose"
  - priority: 17
    category: business_constraint
    check: "BillingPeriod close requires now() >= period_end"
    error_id: ERR_PERIOD_NOT_ENDED
    http_status: 422
    applies_to: "POST /stations/{id}/billing-periods/{p}/close"
  - priority: 18
    category: business_referential
    check: "BillingPeriod close requires QualityAssessment for same period in status CLOSED"
    error_id: ERR_QUALITY_ASSESSMENT_NOT_CLOSED
    http_status: 422
    applies_to: "POST /stations/{id}/billing-periods/{p}/close"
  - priority: 19
    category: business_fiscal
    check: "Dispute payload includes non-empty reason"
    error_id: ERR_DISPUTE_REASON_REQUIRED
    http_status: 422
    applies_to: "POST /bills/{id}/dispute"
  - priority: 20
    category: business_fiscal
    check: "Payment idempotency_key required and unique per Bill"
    error_id: ERR_IDEMPOTENCY_KEY_REQUIRED
    http_status: 422
    applies_to: "POST /bills/{id}/payments"
  - priority: 21
    category: business_temporal
    check: "Reminder sweep tier conditions; if no parcel qualifies, sweep is a no-op (200 with empty list)"
    error_id: ERR_NONE
    http_status: 200
    applies_to: "POST /_sweep/run"
  - priority: 22
    category: business_constraint
    check: "version (if provided) matches current entity.version (OCC)"
    error_id: ERR_VERSION_CONFLICT
    http_status: 409
    applies_to: "all PATCH/PUT"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Test-driving endpoints (REQUIRED for testability per SKILL.md §1.5) ----
  - method: POST
    path: "/_clock/advance"
    description: "Advance the server's logical clock by N seconds (test harness)."
    roles: [PlatformAdmin]
    code: 200
    input: ["seconds"]
    output: "object {now}"
    side_effects: ["Server now() shifts forward by N seconds"]

  - method: POST
    path: "/_sweep/run"
    description: "Run overtime + long-stay sweep across all Parcels; idempotent (no duplicate reminders)."
    roles: [PlatformAdmin, Manager]
    code: 200
    input: ["station_id?"]
    output: "object {reminders_emitted, parcels_to_overtime, parcels_to_awaiting_return}"
    side_effects:
      - "Parcel SHELVED->OVERTIME for any past free_storage_deadline"
      - "Parcel OVERTIME->AWAITING_RETURN for any past shelved_at+LONG_STAY_HOURS"
      - "Emit ReminderRecord per calc reminder_schedule"
      - "Recompute storage_fee_total provisional for all OVERTIME parcels"

  - method: POST
    path: "/_events/courier/inbound"
    description: "Simulate a courier-company-side handover handshake (test-driving external event)."
    roles: [PlatformAdmin]
    code: 200
    input: ["courier_company_id", "tracking_number", "station_id", "recipient_phone", "weight_grams", "size_class"]
    output: "object {accepted_at}"
    side_effects: ["No DB write; pre-step before POST /stations/{id}/parcels; emits SystemEventOutbox(target=COURIER, event=INBOUND_HANDSHAKE)"]

  # ---- Station + ShelfZone + Staff ----
  - method: POST
    path: "/stations"
    description: "Create a station."
    roles: [PlatformAdmin]
    code: 201
    input: ["name", "address", "business_hours_open", "business_hours_close", "storage_capacity", "free_storage_hours?"]
    output: Station

  - method: GET
    path: "/stations"
    description: "List stations (paginated)."
    roles: [PlatformAdmin, Manager, Clerk]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "Station[]"

  - method: GET
    path: "/stations/{station_id}"
    description: "Read a station."
    roles: [PlatformAdmin, Manager, Clerk]
    code: 200
    input: []
    output: Station

  - method: PATCH
    path: "/stations/{station_id}"
    description: "Update station profile (name, hours, capacity, free_storage_hours, status)."
    roles: [PlatformAdmin, Manager]
    code: 200
    input: ["name?", "address?", "business_hours_open?", "business_hours_close?", "storage_capacity?", "free_storage_hours?", "status?", "version?"]
    output: Station

  - method: POST
    path: "/stations/{station_id}/shelf-zones"
    description: "Create a shelf zone."
    roles: [Manager]
    code: 201
    input: ["zone_code", "row_count", "column_count", "zone_type?"]
    output: ShelfZone

  - method: GET
    path: "/stations/{station_id}/shelf-zones"
    description: "List shelf zones for a station."
    roles: [Manager, Clerk]
    code: 200
    input: ["limit?", "offset?"]
    output: "ShelfZone[]"

  - method: POST
    path: "/stations/{station_id}/staff"
    description: "Create staff."
    roles: [Manager]
    code: 201
    input: ["full_name", "phone", "role_kind"]
    output: Staff

  - method: PATCH
    path: "/staff/{staff_id}"
    description: "Update staff status."
    roles: [Manager]
    code: 200
    input: ["status?", "role_kind?", "version?"]
    output: Staff

  # ---- Parcels ----
  - method: POST
    path: "/stations/{station_id}/parcels"
    description: "Register an inbound parcel; assigns shelf position or rejects as exception."
    roles: [Clerk]
    code: 201
    input: ["courier_company_id", "tracking_number", "recipient_phone", "recipient_name?", "weight_grams", "size_class", "shelf_zone_id?", "shelf_position?", "exception_type?"]
    output: Parcel
    side_effects:
      - "On accept: state machine UNREGISTERED -> SHELVED with full cascade"
      - "On exception: state machine UNREGISTERED -> REJECTED"

  - method: GET
    path: "/stations/{station_id}/parcels"
    description: "List parcels at a station."
    roles: [Manager, Clerk]
    code: 200
    input: ["limit?", "offset?", "status?", "recipient_phone?"]
    output: "Parcel[]"

  - method: GET
    path: "/parcels/{parcel_id}"
    description: "Read a parcel."
    roles: [Manager, Clerk, Recipient, CourierCompany]
    code: 200
    input: []
    output: Parcel

  - method: PATCH
    path: "/parcels/{parcel_id}/shelf"
    description: "Reassign a shelf slot (mis-shelving correction). Counted toward mis_shelving_rate."
    roles: [Clerk, Manager]
    code: 200
    input: ["shelf_zone_id", "shelf_position", "version?"]
    output: Parcel
    side_effects: ["Append AuditEvent(action=SHELF_REASSIGNED, payload.from/to)"]

  - method: POST
    path: "/parcels/{parcel_id}/pickup"
    description: "Pick up a parcel using code, authorization, or face match."
    roles: [Clerk]
    code: 200
    input: ["verification_method", "code?", "authorization_id?", "delegate_id_number?", "face_match?"]
    output: Parcel
    side_effects: ["State transitions SHELVED|OVERTIME|AWAITING_RETURN -> PICKED_UP"]

  - method: POST
    path: "/parcels/{parcel_id}/dispose"
    description: "Manager disposes an unclaimed parcel."
    roles: [Manager]
    code: 200
    input: ["reason?"]
    output: Parcel

  # ---- Pickup Codes ----
  - method: POST
    path: "/parcels/{parcel_id}/pickup-codes"
    description: "Mint or re-issue a pickup code (reason=LOST)."
    roles: [Clerk, Recipient]
    code: 201
    input: ["reason"]
    output: PickupCode

  - method: GET
    path: "/parcels/{parcel_id}/pickup-codes"
    description: "List pickup codes for a parcel (history)."
    roles: [Clerk, Manager, Recipient]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "PickupCode[]"

  # ---- Pickup Authorizations ----
  - method: POST
    path: "/parcels/{parcel_id}/authorizations"
    description: "Create an on-behalf-pickup authorization."
    roles: [Recipient]
    code: 201
    input: ["delegate_name", "delegate_id_number", "delegate_phone", "expires_at"]
    output: PickupAuthorization

  - method: PATCH
    path: "/authorizations/{authorization_id}"
    description: "Revoke an authorization."
    roles: [Recipient]
    code: 200
    input: ["status"]
    output: PickupAuthorization

  # ---- Reminders ----
  - method: GET
    path: "/parcels/{parcel_id}/reminders"
    description: "List reminder records for a parcel."
    roles: [Manager, Clerk, Recipient]
    code: 200
    input: ["limit?", "offset?"]
    output: "ReminderRecord[]"

  # ---- Returns ----
  - method: POST
    path: "/parcels/{parcel_id}/return-shipments"
    description: "Request a return shipment (long-stay parcel)."
    roles: [Manager]
    code: 201
    input: ["courier_tracking_return?"]
    output: ReturnShipment

  - method: POST
    path: "/return-shipments/{return_shipment_id}/courier-response"
    description: "Record courier accept/decline (driven by courier-system event)."
    roles: [PlatformAdmin, CourierCompany]
    code: 200
    input: ["decision"]
    output: ReturnShipment

  - method: POST
    path: "/return-shipments/{return_shipment_id}/ship"
    description: "Mark return shipment shipped; transitions parent Parcel to RETURNED."
    roles: [PlatformAdmin, CourierCompany]
    code: 200
    input: ["courier_tracking_return"]
    output: ReturnShipment

  # ---- Billing ----
  - method: POST
    path: "/stations/{station_id}/billing-periods"
    description: "Create (or fetch) a billing period for a YYYYMM."
    roles: [Manager, PlatformAdmin]
    code: 201
    input: ["period_yyyymm"]
    output: BillingPeriod

  - method: POST
    path: "/stations/{station_id}/billing-periods/{period_yyyymm}/close"
    description: "Close a billing period: snapshot fees, factor, issue Bills."
    roles: [Manager]
    code: 200
    input: []
    output: BillingPeriod

  - method: GET
    path: "/stations/{station_id}/billing-periods/{period_yyyymm}"
    description: "Read a billing period with rollups."
    roles: [Manager, PlatformAdmin]
    code: 200
    input: []
    output: BillingPeriod

  - method: GET
    path: "/billing-periods/{billing_period_id}/bills"
    description: "List bills under a period."
    roles: [Manager, PlatformAdmin, CourierCompany, Recipient]
    code: 200
    input: ["limit?", "offset?", "payer_kind?", "status?"]
    output: "Bill[]"

  - method: GET
    path: "/bills/{bill_id}"
    description: "Read a bill."
    roles: [Manager, PlatformAdmin, CourierCompany, Recipient]
    code: 200
    input: []
    output: Bill

  - method: POST
    path: "/bills/{bill_id}/payments"
    description: "Record a payment (idempotent by idempotency_key)."
    roles: [PaymentSystem]
    code: 200
    input: ["idempotency_key", "amount"]
    output: Bill

  - method: POST
    path: "/bills/{bill_id}/dispute"
    description: "Open a dispute on an issued bill."
    roles: [Recipient, CourierCompany]
    code: 200
    input: ["reason"]
    output: Bill

  - method: POST
    path: "/bills/{bill_id}/resolve-dispute"
    description: "Resolve dispute (manager)."
    roles: [Manager]
    code: 200
    input: ["adjustment_amount?", "note?"]
    output: Bill

  - method: POST
    path: "/bills/{bill_id}/write-off"
    description: "Write off a disputed bill."
    roles: [Manager]
    code: 200
    input: ["note?"]
    output: Bill

  # ---- Quality Assessments ----
  - method: POST
    path: "/stations/{station_id}/quality-assessments"
    description: "Create (or fetch) a quality assessment for a YYYYMM."
    roles: [Manager, PlatformAdmin]
    code: 201
    input: ["period_yyyymm"]
    output: QualityAssessment

  - method: POST
    path: "/stations/{station_id}/quality-assessments/{period_yyyymm}/close"
    description: "Close the quality assessment: compute composite_score."
    roles: [Manager]
    code: 200
    input: []
    output: QualityAssessment

  - method: GET
    path: "/stations/{station_id}/quality-assessments/{period_yyyymm}"
    description: "Read a quality assessment."
    roles: [Manager, PlatformAdmin]
    code: 200
    input: []
    output: QualityAssessment

  # ---- Audit ----
  - method: GET
    path: "/audit-events"
    description: "List audit events (filterable)."
    roles: [PlatformAdmin, Manager]
    code: 200
    input: ["limit?", "offset?", "subject_kind?", "subject_id?"]
    output: "AuditEvent[]"

  # ---- Outbox (for verifying event sync) ----
  - method: GET
    path: "/system-events"
    description: "List system events emitted to PAYMENT/IM/COURIER (test introspection)."
    roles: [PlatformAdmin]
    code: 200
    input: ["limit?", "offset?", "target_system?", "event_name?", "subject_id?"]
    output: "SystemEventOutbox[]"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_AUTH_MISSING
    http: 401
    condition: "X-User-Role or X-User-ID header missing"
  - id: ERR_FORBIDDEN
    http: 403
    condition: "Role not permitted for endpoint"
  - id: ERR_RESOURCE_NOT_FOUND
    http: 404
    condition: "Path id or body foreign-key does not resolve"
  - id: ERR_STATION_NOT_ACTIVE
    http: 409
    condition: "Station.status != ACTIVE for operations requiring ACTIVE"
  - id: ERR_INVALID_PARCEL_STATE
    http: 409
    condition: "Parcel.status incompatible with requested action"
  - id: ERR_INVALID_BILL_STATE
    http: 409
    condition: "Bill.status incompatible with requested action"
  - id: ERR_INVALID_RETURN_STATE
    http: 409
    condition: "ReturnShipment.status incompatible with requested action"
  - id: ERR_EXCEPTION_PARCEL_CANNOT_SHELVE
    http: 422
    condition: "Inbound request has exception_type != NONE but also requests shelf assignment"
  - id: ERR_SHELF_ZONE_STATION_MISMATCH
    http: 422
    condition: "ShelfZone.station_id != path station_id"
  - id: ERR_SHELF_POSITION_OCCUPIED
    http: 409
    condition: "Requested shelf_position already occupied by an active parcel"
  - id: ERR_SHELF_ZONE_FULL
    http: 409
    condition: "ShelfZone.occupied_slots >= capacity"
  - id: ERR_STATION_CAPACITY_EXCEEDED
    http: 409
    condition: "Station.current_occupancy >= storage_capacity"
  - id: ERR_DUPLICATE_TRACKING_NUMBER
    http: 409
    condition: "Active parcel with same (courier_company_id, tracking_number) already exists"
  - id: ERR_PICKUP_VERIFICATION_FAILED
    http: 422
    condition: "No matching ACTIVE PickupCode, valid PickupAuthorization, or face_match=true"
  - id: ERR_PARCEL_ALREADY_PICKED_UP
    http: 409
    condition: "Concurrent pickup races where a peer already moved the parcel to PICKED_UP"
  - id: ERR_PICKUP_CODE_GENERATION_EXHAUSTED
    http: 409
    condition: "Could not mint a unique 6-digit code within RETRY_LIMIT attempts"
  - id: ERR_PICKUP_CODE_REISSUE_RACE
    http: 409
    condition: "Two reissue requests for the same parcel collide"
  - id: ERR_AUTHORIZATION_EXPIRY_INVALID
    http: 422
    condition: "expires_at <= granted_at or > Parcel.free_storage_deadline + 7 days"
  - id: ERR_AUTHORIZATION_EXPIRED
    http: 422
    condition: "PickupAuthorization used after expires_at or in non-ACTIVE status"
  - id: ERR_DISPOSAL_TOO_EARLY
    http: 422
    condition: "Now < long_stay_flagged_at + DISPOSAL_GRACE_HOURS"
  - id: ERR_PERIOD_NOT_ENDED
    http: 422
    condition: "Now < period_end at close attempt"
  - id: ERR_QUALITY_ASSESSMENT_NOT_CLOSED
    http: 422
    condition: "QualityAssessment.status != CLOSED at BillingPeriod close"
  - id: ERR_BILL_NOT_ISSUED
    http: 409
    condition: "Disputing or paying a Bill that is not ISSUED"
  - id: ERR_BILL_ALREADY_PAID
    http: 409
    condition: "Payment for a Bill already in PAID"
  - id: ERR_DISPUTE_REASON_REQUIRED
    http: 422
    condition: "Dispute request missing reason"
  - id: ERR_IDEMPOTENCY_KEY_REQUIRED
    http: 422
    condition: "Payment request missing idempotency_key"
  - id: ERR_IDEMPOTENCY_REPLAY
    http: 200
    condition: "Replay of same idempotency_key returns prior result"
  - id: ERR_VERSION_CONFLICT
    http: 409
    condition: "OCC: provided version != current entity.version"
  - id: ERR_VALIDATION
    http: 422
    condition: "Generic schema/range violation"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Operator of the platform; creates stations, runs sweeps, drives external events."
    identity: opaque
    exclusive_operations:
      - "POST /stations"
      - "POST /_clock/advance"
      - "POST /_events/courier/inbound"
      - "GET /system-events"
    shared_operations:
      - "POST /_sweep/run (shared with Manager)"
      - "PATCH /stations/{id}"
      - "POST /stations/{id}/billing-periods"
      - "POST /return-shipments/{id}/courier-response"
      - "POST /return-shipments/{id}/ship"
      - "GET /audit-events"

  - name: Manager
    description: "Station manager; configures shelves, staff, runs billing and assessments."
    identity: entity_backed:Staff
    exclusive_operations:
      - "POST /stations/{id}/shelf-zones"
      - "POST /stations/{id}/staff"
      - "PATCH /staff/{id}"
      - "POST /parcels/{id}/dispose"
      - "POST /parcels/{id}/return-shipments"
      - "POST /stations/{id}/billing-periods/{p}/close"
      - "POST /bills/{id}/resolve-dispute"
      - "POST /bills/{id}/write-off"
      - "POST /stations/{id}/quality-assessments/{p}/close"
    shared_operations:
      - "POST /_sweep/run"
      - "PATCH /parcels/{id}/shelf"

  - name: Clerk
    description: "Front-desk clerk; receives inbound parcels and handles pickups."
    identity: entity_backed:Staff
    exclusive_operations:
      - "POST /stations/{id}/parcels"
      - "POST /parcels/{id}/pickup"
    shared_operations:
      - "POST /parcels/{id}/pickup-codes"
      - "PATCH /parcels/{id}/shelf"

  - name: Recipient
    description: "End user; requests code reissues, creates authorizations, reads own parcels and bills."
    identity: opaque
    exclusive_operations:
      - "POST /parcels/{id}/authorizations"
      - "PATCH /authorizations/{id}"
    shared_operations:
      - "POST /parcels/{id}/pickup-codes"
      - "POST /bills/{id}/dispute"

  - name: CourierCompany
    description: "Courier-side actor; responds to returns and disputes courier-side bills."
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "POST /return-shipments/{id}/courier-response"
      - "POST /return-shipments/{id}/ship"
      - "POST /bills/{id}/dispute"

  - name: PaymentSystem
    description: "External payment system that records bill payments."
    identity: opaque
    exclusive_operations:
      - "POST /bills/{id}/payments"
    shared_operations: []
