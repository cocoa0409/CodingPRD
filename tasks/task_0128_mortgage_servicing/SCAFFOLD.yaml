scenario: "128. Mortgage Servicing: payment posting, Escrow annual analysis, PMI removal conditions, tax/insurance disbursement, forbearance/Foreclosure, pre-foreclosure mediation (HAMP-style)."
domain_name: "mortgage-servicing"
api_prefix: "/loans"

complexity_profile:
  primary_archetype: "Ledger reconciliation"
  secondary_archetype: "Compliance / audit"
  complexity_layers:
    - "Dual-variant calculation"
    - "Cascading side effects"
    - "Rate / threshold triggers"
    - "Scheduled / deferred actions"
  entity_topology: hybrid
  # Loan is the root resource. Payment, EscrowAnalysis, Disbursement nest under Loan.
  # ForbearancePlan, ForeclosureCase, MediationCase are peer entities referencing Loan
  # but with their own lifecycles that gate Loan-level actions (cross-cutting).
  state_machine_shape: branching
  # Loan posture branches into CURRENT/DELINQUENT/FORBEARANCE/DEFAULT/FORECLOSURE, with
  # forbearance → cure-or-default branching, and mediation → modification/foreclosure branching.
  relationship_patterns:
    - one_to_many       # Loan has many Payments, Disbursements, EscrowAnalyses
    - cross_aggregate   # ForeclosureCase references Loan; MediationCase references ForeclosureCase
  role_model: segregation_of_duties
  # Servicer posts payments and triggers escrow analysis, but loss-mitigation underwriter
  # approves modifications; foreclosure attorney files foreclosure milestones; PMI removal
  # underwriter is segregated from the servicer who received the borrower request.
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ─────────────────────────────────────────────────────────────────────────────
# §1.1 Entity-Relationship Table
# ─────────────────────────────────────────────────────────────────────────────
entities:
  - name: Borrower
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Primary borrower legal name."
        constraints: "Non-empty, max 200 chars."
      - name: email
        type: string
        source: input
        description: "Contact email for borrower notices."
      - name: hardship_attested_at
        type: datetime
        source: system
        description: "Set when borrower submits a hardship affidavit (required for forbearance & mediation)."
        default: null

  - name: Loan
    parent: null
    common_fields: true
    fields:
      - name: borrower_id
        type: string
        source: input
        description: "FK → Borrower.id. Single primary borrower per loan."
      - name: origination_date
        type: datetime
        source: input
        description: "Date the loan was originated (date only, UTC midnight)."
      - name: original_principal_cents
        type: integer
        source: input
        description: "Original principal balance in cents at origination."
        constraints: ">= 100000 (≥ $1,000)."
      - name: original_appraised_value_cents
        type: integer
        source: input
        description: "Original property appraised value in cents (used for PMI LTV at origination)."
        constraints: "> 0."
      - name: interest_rate_bps
        type: integer
        source: input
        description: "Annual nominal interest rate, basis points (e.g. 625 == 6.25%). Fixed-rate only."
        constraints: "1 .. 5000."
      - name: term_months
        type: integer
        source: input
        description: "Total amortization term in months."
        constraints: "60 .. 480."
      - name: scheduled_payment_cents
        type: integer
        source: computed
        description: "Scheduled monthly P&I payment from standard amortization (see calculation `monthly_pi_payment`)."
      - name: principal_balance_cents
        type: integer
        source: computed
        description: "Current outstanding principal. Decremented by the principal portion of each posted payment."
      - name: escrow_balance_cents
        type: integer
        source: computed
        description: "Current escrow account balance. Credited by escrow portion of payments; debited by tax/insurance disbursements."
      - name: monthly_escrow_payment_cents
        type: integer
        source: computed
        description: "Current monthly escrow component, set by latest FINALIZED EscrowAnalysis (or initial setup)."
        default: 0
      - name: pmi_monthly_cents
        type: integer
        source: input
        description: "Monthly PMI premium in cents. Becomes zero when PMI is removed."
        default: 0
      - name: pmi_status
        type: enum
        source: computed
        description: "Lifecycle of PMI coverage for this loan."
        constraints: "One of {ACTIVE, REMOVAL_REQUESTED, REMOVED, AUTO_TERMINATED}."
        default: "ACTIVE"
      - name: next_due_date
        type: datetime
        source: computed
        description: "First unpaid installment due date (UTC midnight). Advances by one month when an installment is FULLY satisfied."
      - name: posture
        type: enum
        source: computed
        description: "Derived loan posture. See state machine `Loan.posture`."
        constraints: "One of {CURRENT, DELINQUENT, FORBEARANCE, DEFAULT, FORECLOSURE, REINSTATED, PAID_OFF}."
        default: "CURRENT"
      - name: delinquency_days
        type: integer
        source: computed
        description: "now - next_due_date in whole days (floor); 0 if next_due_date >= today. Recomputed on clock advance and on every payment."
        default: 0

  - name: Payment
    parent: Loan
    common_fields: true
    fields:
      - name: loan_id
        type: string
        source: input
        description: "FK → Loan.id."
      - name: received_date
        type: datetime
        source: input
        description: "Date funds were received (UTC midnight)."
      - name: amount_cents
        type: integer
        source: input
        description: "Total payment amount in cents."
        constraints: "> 0."
      - name: allocation_principal_cents
        type: integer
        source: computed
        description: "Cents applied to principal by the posting waterfall."
      - name: allocation_interest_cents
        type: integer
        source: computed
        description: "Cents applied to interest by the posting waterfall."
      - name: allocation_escrow_cents
        type: integer
        source: computed
        description: "Cents applied to escrow."
      - name: allocation_late_fee_cents
        type: integer
        source: computed
        description: "Cents applied to outstanding late fees."
      - name: allocation_suspense_cents
        type: integer
        source: computed
        description: "Residual cents parked in suspense (partial-payment leftover)."
      - name: status
        type: enum
        source: computed
        description: "Lifecycle of a payment record."
        constraints: "One of {POSTED, REVERSED}."
        default: "POSTED"
      - name: reversed_at
        type: datetime
        source: system
        description: "Timestamp when reversed; null if active."
        default: null

  - name: EscrowAnalysis
    parent: Loan
    common_fields: false   # immutable snapshot once FINALIZED
    fields:
      - name: loan_id
        type: string
        source: input
        description: "FK → Loan.id."
      - name: analysis_date
        type: datetime
        source: input
        description: "Effective date of the analysis (UTC midnight)."
      - name: status
        type: enum
        source: computed
        description: "Analysis lifecycle."
        constraints: "One of {PROVISIONAL, FINALIZED, SUPERSEDED}."
        default: "PROVISIONAL"
      - name: projected_disbursements_cents
        type: integer
        source: computed
        description: "Sum of forecast tax & insurance disbursements for next 12 months (see `escrow_annual_projection`)."
      - name: required_cushion_cents
        type: integer
        source: computed
        description: "RESPA-style two-month cushion = 2 × (projected_disbursements_cents / 12), rounded up to whole cents."
      - name: starting_balance_cents
        type: integer
        source: input
        description: "Escrow balance at analysis_date."
      - name: shortage_cents
        type: integer
        source: computed
        description: "max(0, target_balance - starting_balance_cents), where target_balance = required_cushion_cents."
      - name: surplus_cents
        type: integer
        source: computed
        description: "max(0, starting_balance_cents - (required_cushion_cents + projected_disbursements_cents))."
      - name: new_monthly_escrow_cents
        type: integer
        source: computed
        description: "New monthly escrow component = ceil((projected_disbursements_cents + shortage_cents) / 12). Surplus refunds are NOT amortized; they are issued as a separate Disbursement of type SURPLUS_REFUND when > $50."
      - name: finalized_at
        type: datetime
        source: system
        description: "Set when status transitions PROVISIONAL → FINALIZED."
        default: null

  - name: Disbursement
    parent: Loan
    common_fields: true
    fields:
      - name: loan_id
        type: string
        source: input
        description: "FK → Loan.id."
      - name: type
        type: enum
        source: input
        description: "Disbursement category."
        constraints: "One of {PROPERTY_TAX, HAZARD_INSURANCE, SURPLUS_REFUND}."
      - name: scheduled_date
        type: datetime
        source: input
        description: "Date the disbursement is scheduled to be paid (UTC midnight)."
      - name: amount_cents
        type: integer
        source: input
        description: "Amount in cents."
        constraints: "> 0."
      - name: status
        type: enum
        source: computed
        description: "Disbursement lifecycle."
        constraints: "One of {SCHEDULED, PAID, FAILED, CANCELED}."
        default: "SCHEDULED"
      - name: paid_at
        type: datetime
        source: system
        description: "Timestamp when transitioned to PAID."
        default: null
      - name: failure_reason
        type: enum
        source: system
        description: "If status=FAILED, why."
        constraints: "One of {INSUFFICIENT_ESCROW, null}."
        default: null

  - name: ForbearancePlan
    parent: null
    common_fields: true
    fields:
      - name: loan_id
        type: string
        source: input
        description: "FK → Loan.id. A loan may have at most one ACTIVE plan."
      - name: start_date
        type: datetime
        source: input
        description: "First month of forbearance (UTC midnight; must be ≤ Loan.next_due_date)."
      - name: months
        type: integer
        source: input
        description: "Number of months payments are paused."
        constraints: "1 .. 12."
      - name: end_date
        type: datetime
        source: computed
        description: "start_date + months months (exclusive upper bound)."
      - name: total_paused_cents
        type: integer
        source: computed
        description: "Sum of scheduled installments (P&I + escrow) that would have been due in the window."
      - name: repayment_method
        type: enum
        source: input
        description: "How the paused amount is repaid after the plan ends."
        constraints: "One of {LUMP_SUM, REPAYMENT_PLAN_12M, DEFERRAL}."
      - name: status
        type: enum
        source: computed
        description: "Plan lifecycle."
        constraints: "One of {ACTIVE, COMPLETED, BREACHED, CANCELED}."
        default: "ACTIVE"
      - name: cure_balance_cents
        type: integer
        source: computed
        description: "Outstanding repayment amount owed after the plan ends. Zero until end_date passes; then equals total_paused_cents minus any post-plan payments applied to cure."

  - name: PmiRemovalRequest
    parent: null
    common_fields: true
    fields:
      - name: loan_id
        type: string
        source: input
        description: "FK → Loan.id."
      - name: trigger
        type: enum
        source: input
        description: "Why removal is being evaluated."
        constraints: "One of {BORROWER_REQUEST, AUTO_TERMINATION}."
      - name: current_appraised_value_cents
        type: integer
        source: input
        description: "Most recent appraised value supplied with the request. Required for BORROWER_REQUEST; ignored for AUTO_TERMINATION."
        default: null
      - name: evaluated_ltv_bps
        type: integer
        source: computed
        description: "LTV used for the eligibility decision, in basis points (e.g. 7800 == 78.00%)."
      - name: decision
        type: enum
        source: computed
        description: "Outcome of underwriting evaluation."
        constraints: "One of {APPROVED, DENIED, PENDING}."
        default: "PENDING"
      - name: denial_reason
        type: enum
        source: system
        description: "Populated when decision=DENIED."
        constraints: "One of {LTV_TOO_HIGH, PAYMENT_HISTORY_INSUFFICIENT, LOAN_NOT_CURRENT, null}."
        default: null

  - name: ForeclosureCase
    parent: null
    common_fields: true
    fields:
      - name: loan_id
        type: string
        source: input
        description: "FK → Loan.id. At most one open case per loan."
      - name: opened_at
        type: datetime
        source: system
        description: "When the case was opened."
      - name: status
        type: enum
        source: computed
        description: "Foreclosure case lifecycle."
        constraints: "One of {NOI_ISSUED, MEDIATION_OPEN, FILED, AUCTION_SCHEDULED, CLOSED_REINSTATED, CLOSED_MODIFIED, CLOSED_SOLD}."
        default: "NOI_ISSUED"
      - name: noi_sent_at
        type: datetime
        source: system
        description: "When the Notice Of Intent letter was issued (start of the regulatory clock)."
      - name: filed_at
        type: datetime
        source: system
        description: "Court filing timestamp; null until status=FILED or later."
        default: null
      - name: auction_date
        type: datetime
        source: system
        description: "Scheduled auction date (UTC midnight); null unless AUCTION_SCHEDULED."
        default: null
      - name: reinstatement_quote_cents
        type: integer
        source: computed
        description: "Total cents required to bring the loan current and close the case (past-due P&I + escrow + late fees + foreclosure_costs_cents)."
      - name: foreclosure_costs_cents
        type: integer
        source: input
        description: "Accumulated legal + filing costs charged to the borrower for reinstatement."
        default: 0

  - name: MediationCase
    parent: ForeclosureCase
    common_fields: true
    fields:
      - name: foreclosure_case_id
        type: string
        source: input
        description: "FK → ForeclosureCase.id. Exactly one active mediation per foreclosure case."
      - name: opened_at
        type: datetime
        source: system
        description: "When the mediation was opened (REQUESTED → OPEN transition)."
        default: null
      - name: status
        type: enum
        source: computed
        description: "Mediation lifecycle (HAMP-style negotiation)."
        constraints: "One of {REQUESTED, OPEN, OFFER_EXTENDED, OFFER_ACCEPTED, OFFER_REJECTED, FAILED, COMPLETED}."
        default: "REQUESTED"
      - name: offered_new_rate_bps
        type: integer
        source: input
        description: "Underwriter-offered new interest rate; only valid in OFFER_EXTENDED transition."
        default: null
      - name: offered_term_extension_months
        type: integer
        source: input
        description: "Underwriter-offered term extension in months; only valid in OFFER_EXTENDED transition."
        default: null
      - name: offered_principal_forbearance_cents
        type: integer
        source: input
        description: "Underwriter-offered non-interest-bearing principal forbearance amount."
        default: 0
      - name: target_payment_cents
        type: integer
        source: computed
        description: "Modified scheduled_payment_cents implied by the accepted offer (see calc `hamp_modified_payment`)."
      - name: rejection_reason
        type: enum
        source: system
        description: "If OFFER_REJECTED, why."
        constraints: "One of {DTI_TOO_HIGH, AFFORDABILITY_FLOOR, BORROWER_REFUSED, null}."
        default: null

# ─────────────────────────────────────────────────────────────────────────────
# §1.2 State Machine Table
# ─────────────────────────────────────────────────────────────────────────────
state_machines:

  # 1) Loan posture — branching with revert + cross-entity guards
  - entity: Loan
    initial_state: CURRENT
    terminal_states: [PAID_OFF]
    transitions:
      - from: CURRENT
        to: DELINQUENT
        trigger: "system: clock advance causes delinquency_days to become >= 1 with no ACTIVE ForbearancePlan"
        actor: system
        preconditions:
          - "Loan.posture == CURRENT"
          - "delinquency_days >= 1 after recomputation"
          - "no ForbearancePlan with status=ACTIVE for this loan"
        side_effects:
          - "Loan.posture := DELINQUENT"
          - "Loan.updated_at refreshed"

      - from: DELINQUENT
        to: CURRENT
        trigger: "POST /loans/{id}/payments brings next_due_date forward so delinquency_days == 0"
        actor: Servicer
        preconditions:
          - "After payment posting, delinquency_days == 0"
        side_effects:
          - "Loan.posture := CURRENT"

      - from: DELINQUENT
        to: FORBEARANCE
        trigger: "POST /loans/{id}/forbearance-plans approved"
        actor: LossMitigationUnderwriter
        preconditions:
          - "Borrower.hardship_attested_at IS NOT NULL"
          - "no other ForbearancePlan with status=ACTIVE for this loan"
          - "Loan.posture IN {CURRENT, DELINQUENT} (forbearance may pre-empt delinquency)"
        side_effects:
          - "Loan.posture := FORBEARANCE"
          - "next_due_date frozen until ForbearancePlan.end_date"

      - from: CURRENT
        to: FORBEARANCE
        trigger: "POST /loans/{id}/forbearance-plans approved (pre-emptive)"
        actor: LossMitigationUnderwriter
        preconditions:
          - "Borrower.hardship_attested_at IS NOT NULL"
          - "no ForbearancePlan with status=ACTIVE for this loan"
        side_effects:
          - "Loan.posture := FORBEARANCE"

      - from: FORBEARANCE
        to: CURRENT
        trigger: "system: ForbearancePlan transitions to COMPLETED with cure_balance_cents == 0"
        actor: system
        preconditions:
          - "ForbearancePlan.status == COMPLETED for this loan"
          - "ForbearancePlan.cure_balance_cents == 0"
        side_effects:
          - "Loan.posture := CURRENT"

      - from: FORBEARANCE
        to: DEFAULT
        trigger: "system: ForbearancePlan transitions to BREACHED"
        actor: system
        preconditions:
          - "ForbearancePlan.status == BREACHED for this loan"
        side_effects:
          - "Loan.posture := DEFAULT"

      - from: DELINQUENT
        to: DEFAULT
        trigger: "system: delinquency_days >= 120 and no ACTIVE ForbearancePlan"
        actor: system
        preconditions:
          - "Loan.posture == DELINQUENT"
          - "delinquency_days >= 120"
          - "no ForbearancePlan with status=ACTIVE for this loan"
        side_effects:
          - "Loan.posture := DEFAULT"

      - from: DEFAULT
        to: FORECLOSURE
        trigger: "POST /foreclosure-cases (servicer opens case)"
        actor: ForeclosureAttorney
        preconditions:
          - "Loan.posture == DEFAULT"
          - "delinquency_days >= 120"
          - "no ForeclosureCase with status IN {NOI_ISSUED, MEDIATION_OPEN, FILED, AUCTION_SCHEDULED} for this loan"
        side_effects:
          - "Loan.posture := FORECLOSURE"
          - "ForeclosureCase created in status NOI_ISSUED"
          - "ForeclosureCase.noi_sent_at := now()"

      - from: FORECLOSURE
        to: REINSTATED
        trigger: "POST /foreclosure-cases/{id}/reinstate (full reinstatement quote paid)"
        actor: Servicer
        preconditions:
          - "ForeclosureCase.status IN {NOI_ISSUED, MEDIATION_OPEN, FILED, AUCTION_SCHEDULED}"
          - "Payment.amount_cents >= ForeclosureCase.reinstatement_quote_cents"
        side_effects:
          - "ForeclosureCase.status := CLOSED_REINSTATED"
          - "Loan.posture := REINSTATED"
          - "delinquency_days := 0"
          - "next_due_date advanced past all paid arrears"

      - from: REINSTATED
        to: CURRENT
        trigger: "system: 1 fully-on-time payment posted after REINSTATED"
        actor: system
        preconditions:
          - "Loan.posture == REINSTATED"
          - "≥1 Payment with status=POSTED and received_date ≤ next_due_date after reinstatement"
        side_effects:
          - "Loan.posture := CURRENT"

      - from: FORECLOSURE
        to: CURRENT
        trigger: "system: MediationCase transitions to COMPLETED with accepted modification"
        actor: system
        preconditions:
          - "MediationCase.status == COMPLETED for the open case"
          - "ForeclosureCase.status := CLOSED_MODIFIED"
        side_effects:
          - "Loan.posture := CURRENT"
          - "Loan.scheduled_payment_cents := MediationCase.target_payment_cents"
          - "Loan.interest_rate_bps := MediationCase.offered_new_rate_bps (if not null)"
          - "Loan.term_months extended by MediationCase.offered_term_extension_months"

      - from: CURRENT
        to: PAID_OFF
        trigger: "POST /loans/{id}/payments where principal_balance_cents reaches 0"
        actor: Servicer
        preconditions:
          - "Loan.posture == CURRENT"
          - "After posting, principal_balance_cents == 0 AND escrow_balance_cents >= 0"
        side_effects:
          - "Loan.posture := PAID_OFF"
          - "All SCHEDULED Disbursements with type=SURPLUS_REFUND remain; all PROPERTY_TAX/HAZARD_INSURANCE SCHEDULED disbursements transition to CANCELED"

  # 2) Payment lifecycle — linear + reversal cascade
  - entity: Payment
    initial_state: POSTED
    terminal_states: [REVERSED]
    transitions:
      - from: (none)
        to: POSTED
        trigger: "POST /loans/{id}/payments"
        actor: Servicer
        preconditions:
          - "Loan exists and Loan.posture != PAID_OFF"
          - "amount_cents > 0"
          - "Loan does not have status=NOI_ISSUED OR MEDIATION_OPEN OR FILED OR AUCTION_SCHEDULED on a ForeclosureCase, EXCEPT when amount_cents >= ForeclosureCase.reinstatement_quote_cents (reinstatement path)"
        side_effects:
          - "Allocate via waterfall (see calc `payment_waterfall_allocation`): late fees → interest → principal → escrow → suspense"
          - "Loan.principal_balance_cents decremented by allocation_principal_cents"
          - "Loan.escrow_balance_cents incremented by allocation_escrow_cents"
          - "Loan.next_due_date advanced one month per fully-satisfied installment"
          - "Loan.delinquency_days recomputed"
          - "Loan.posture may transition CURRENT/DELINQUENT per recomputation (depth-2 cascade)"
          - "If Loan.posture==REINSTATED and payment is fully on-time → CURRENT (depth-3 cascade root)"

      - from: POSTED
        to: REVERSED
        trigger: "POST /loans/{loan_id}/payments/{payment_id}/reverse"
        actor: Servicer
        preconditions:
          - "Payment.status == POSTED"
          - "Loan.posture != PAID_OFF"
        side_effects:
          - "Payment.reversed_at := now(), Payment.status := REVERSED"
          - "Loan.principal_balance_cents incremented by allocation_principal_cents"
          - "Loan.escrow_balance_cents decremented by allocation_escrow_cents"
          - "Loan.next_due_date rolled back by satisfied-installment count"
          - "Loan.delinquency_days recomputed"
          - "INVARIANT: principal_balance_cents + sum(POSTED Payment.allocation_principal_cents) == original_principal_cents - sum(modification principal forbearance)"

  # 3) EscrowAnalysis — diamond with branching + auto-supersede (cyclic via SUPERSEDED)
  - entity: EscrowAnalysis
    initial_state: PROVISIONAL
    terminal_states: [SUPERSEDED]
    transitions:
      - from: (none)
        to: PROVISIONAL
        trigger: "POST /loans/{id}/escrow-analyses"
        actor: Servicer
        preconditions:
          - "Loan exists and Loan.posture != PAID_OFF"
          - "analysis_date >= Loan.origination_date"
          - "starting_balance_cents == current Loan.escrow_balance_cents"
        side_effects:
          - "Compute projected_disbursements_cents, required_cushion_cents, shortage_cents, surplus_cents, new_monthly_escrow_cents (see calc `escrow_annual_projection`)"

      - from: PROVISIONAL
        to: FINALIZED
        trigger: "POST /loans/{loan_id}/escrow-analyses/{id}/finalize"
        actor: Servicer
        preconditions:
          - "EscrowAnalysis.status == PROVISIONAL"
          - "No other FINALIZED EscrowAnalysis exists with analysis_date >= this analysis_date"
        side_effects:
          - "EscrowAnalysis.status := FINALIZED, finalized_at := now()"
          - "Loan.monthly_escrow_payment_cents := new_monthly_escrow_cents"
          - "If surplus_cents > 5000 (i.e. > $50), create Disbursement(type=SURPLUS_REFUND, amount=surplus_cents, scheduled_date=now+30d, status=SCHEDULED)"
          - "Any prior FINALIZED EscrowAnalysis on this loan transitions to SUPERSEDED"

      - from: PROVISIONAL
        to: SUPERSEDED
        trigger: "system: a newer PROVISIONAL escrow-analysis on the same loan is FINALIZED"
        actor: system
        preconditions: ["A different EscrowAnalysis on this loan transitions to FINALIZED"]
        side_effects: ["EscrowAnalysis.status := SUPERSEDED"]

      - from: FINALIZED
        to: SUPERSEDED
        trigger: "system: another EscrowAnalysis on the same loan transitions PROVISIONAL → FINALIZED with a later analysis_date"
        actor: system
        preconditions: ["Newer analysis FINALIZED on same loan"]
        side_effects: ["EscrowAnalysis.status := SUPERSEDED"]

  # 4) Disbursement — linear with retry semantics
  - entity: Disbursement
    initial_state: SCHEDULED
    terminal_states: [PAID, CANCELED]
    transitions:
      - from: SCHEDULED
        to: PAID
        trigger: "system: clock advances to scheduled_date AND Loan.escrow_balance_cents >= amount_cents"
        actor: system
        preconditions:
          - "now() >= scheduled_date"
          - "Disbursement.status == SCHEDULED"
          - "Loan.escrow_balance_cents >= amount_cents"
          - "Loan.posture != PAID_OFF"
        side_effects:
          - "Disbursement.status := PAID, paid_at := now()"
          - "Loan.escrow_balance_cents decremented by amount_cents"

      - from: SCHEDULED
        to: FAILED
        trigger: "system: clock advances to scheduled_date AND Loan.escrow_balance_cents < amount_cents"
        actor: system
        preconditions:
          - "now() >= scheduled_date"
          - "Loan.escrow_balance_cents < amount_cents"
        side_effects:
          - "Disbursement.status := FAILED, failure_reason := INSUFFICIENT_ESCROW"
          - "Loan accumulates an escrow shortage that the next EscrowAnalysis must amortize"

      - from: FAILED
        to: PAID
        trigger: "POST /loans/{loan_id}/disbursements/{id}/retry"
        actor: Servicer
        preconditions:
          - "Disbursement.status == FAILED"
          - "Loan.escrow_balance_cents >= amount_cents"
        side_effects:
          - "Disbursement.status := PAID, paid_at := now(), failure_reason := null"
          - "Loan.escrow_balance_cents decremented by amount_cents"

      - from: SCHEDULED
        to: CANCELED
        trigger: "POST /loans/{loan_id}/disbursements/{id}/cancel"
        actor: Servicer
        preconditions: ["Disbursement.status == SCHEDULED"]
        side_effects: ["Disbursement.status := CANCELED"]

  # 5) ForbearancePlan — branching with breach revert
  - entity: ForbearancePlan
    initial_state: ACTIVE
    terminal_states: [COMPLETED, BREACHED, CANCELED]
    transitions:
      - from: (none)
        to: ACTIVE
        trigger: "POST /loans/{id}/forbearance-plans"
        actor: LossMitigationUnderwriter
        preconditions:
          - "Borrower.hardship_attested_at IS NOT NULL"
          - "No other ForbearancePlan with status=ACTIVE for this loan"
          - "Loan.posture IN {CURRENT, DELINQUENT}"
        side_effects:
          - "ForbearancePlan.end_date := start_date + months"
          - "ForbearancePlan.total_paused_cents := months × (Loan.scheduled_payment_cents + Loan.monthly_escrow_payment_cents)"
          - "Loan.posture transitions to FORBEARANCE (see Loan SM)"

      - from: ACTIVE
        to: COMPLETED
        trigger: "system: clock advances past end_date AND cure_balance_cents == 0 (DEFERRAL or already-paid LUMP_SUM/REPAYMENT_PLAN)"
        actor: system
        preconditions:
          - "now() >= end_date"
          - "cure_balance_cents == 0 (re-evaluated after applying any post-end payments to cure)"
        side_effects:
          - "ForbearancePlan.status := COMPLETED"
          - "If repayment_method == DEFERRAL: principal_balance_cents += total_paused_cents (deferred to maturity, no interest accrual on the deferral); else cure_balance_cents was satisfied by post-end payments"
          - "Loan.posture := CURRENT (see Loan SM)"

      - from: ACTIVE
        to: BREACHED
        trigger: "system: clock advances >= 30 days past end_date AND cure_balance_cents > 0"
        actor: system
        preconditions:
          - "now() - end_date >= 30 days"
          - "cure_balance_cents > 0"
        side_effects:
          - "ForbearancePlan.status := BREACHED"
          - "Loan.posture := DEFAULT (see Loan SM)"

      - from: ACTIVE
        to: CANCELED
        trigger: "POST /loans/{loan_id}/forbearance-plans/{id}/cancel"
        actor: LossMitigationUnderwriter
        preconditions:
          - "ForbearancePlan.status == ACTIVE"
          - "now() < end_date"
        side_effects:
          - "ForbearancePlan.status := CANCELED"
          - "Loan.posture reverts to DELINQUENT or CURRENT based on recomputed delinquency_days"

  # 6) PmiRemovalRequest — branching (approve/deny) + auto-termination shortcut
  - entity: PmiRemovalRequest
    initial_state: PENDING
    terminal_states: [APPROVED, DENIED]
    transitions:
      - from: (none)
        to: PENDING
        trigger: "POST /loans/{id}/pmi-removal-requests"
        actor: Servicer | system
        preconditions:
          - "Loan.pmi_status == ACTIVE"
          - "If trigger=BORROWER_REQUEST: current_appraised_value_cents > 0"
        side_effects:
          - "Loan.pmi_status := REMOVAL_REQUESTED"
          - "Compute evaluated_ltv_bps (see calc `pmi_ltv_evaluation`)"

      - from: PENDING
        to: APPROVED
        trigger: "POST /loans/{loan_id}/pmi-removal-requests/{id}/approve"
        actor: PmiUnderwriter
        preconditions:
          - "PmiRemovalRequest.decision == PENDING"
          - "evaluated_ltv_bps <= 8000 (≤ 80.00%) for BORROWER_REQUEST OR <= 7800 (≤ 78.00%) for AUTO_TERMINATION"
          - "Loan.posture == CURRENT"
          - "No Payment with status=POSTED and received_date > next_due_date in last 24 scheduled months (BORROWER_REQUEST only)"
        side_effects:
          - "PmiRemovalRequest.decision := APPROVED"
          - "Loan.pmi_status := REMOVED (BORROWER_REQUEST) or AUTO_TERMINATED (AUTO_TERMINATION)"
          - "Loan.pmi_monthly_cents := 0"
          - "Next FINALIZED EscrowAnalysis will drop PMI from projected disbursements"

      - from: PENDING
        to: DENIED
        trigger: "POST /loans/{loan_id}/pmi-removal-requests/{id}/deny"
        actor: PmiUnderwriter
        preconditions:
          - "PmiRemovalRequest.decision == PENDING"
        side_effects:
          - "PmiRemovalRequest.decision := DENIED"
          - "PmiRemovalRequest.denial_reason set per failing criterion"
          - "Loan.pmi_status := ACTIVE (reverted)"

  # 7) ForeclosureCase — cyclic-with-revert + mediation branch
  - entity: ForeclosureCase
    initial_state: NOI_ISSUED
    terminal_states: [CLOSED_REINSTATED, CLOSED_MODIFIED, CLOSED_SOLD]
    transitions:
      - from: NOI_ISSUED
        to: MEDIATION_OPEN
        trigger: "POST /foreclosure-cases/{id}/mediation-cases (borrower requests mediation)"
        actor: Borrower | Servicer
        preconditions:
          - "ForeclosureCase.status == NOI_ISSUED"
          - "now() - noi_sent_at < 30 days (mediation must be requested within the 30-day NOI window)"
          - "Borrower.hardship_attested_at IS NOT NULL"
        side_effects:
          - "ForeclosureCase.status := MEDIATION_OPEN"
          - "MediationCase created in status REQUESTED"

      - from: NOI_ISSUED
        to: FILED
        trigger: "POST /foreclosure-cases/{id}/file"
        actor: ForeclosureAttorney
        preconditions:
          - "ForeclosureCase.status == NOI_ISSUED"
          - "now() - noi_sent_at >= 30 days (cannot file before NOI window expires)"
          - "No MediationCase with status NOT IN {FAILED, OFFER_REJECTED, COMPLETED} exists for this case"
        side_effects:
          - "ForeclosureCase.status := FILED, filed_at := now()"

      - from: MEDIATION_OPEN
        to: FILED
        trigger: "system: MediationCase transitions to FAILED OR OFFER_REJECTED"
        actor: system
        preconditions:
          - "MediationCase.status IN {FAILED, OFFER_REJECTED}"
          - "now() - noi_sent_at >= 30 days"
        side_effects:
          - "ForeclosureCase.status := FILED, filed_at := now()"

      - from: MEDIATION_OPEN
        to: CLOSED_MODIFIED
        trigger: "system: MediationCase transitions to COMPLETED"
        actor: system
        preconditions: ["MediationCase.status == COMPLETED for this case"]
        side_effects:
          - "ForeclosureCase.status := CLOSED_MODIFIED"
          - "Loan.posture := CURRENT (see Loan SM)"

      - from: FILED
        to: AUCTION_SCHEDULED
        trigger: "POST /foreclosure-cases/{id}/schedule-auction"
        actor: ForeclosureAttorney
        preconditions:
          - "ForeclosureCase.status == FILED"
          - "now() - filed_at >= 60 days"
          - "auction_date >= now() + 30 days (statutory notice)"
        side_effects:
          - "ForeclosureCase.status := AUCTION_SCHEDULED"
          - "ForeclosureCase.auction_date := input auction_date"

      - from: NOI_ISSUED
        to: CLOSED_REINSTATED
        trigger: "POST /foreclosure-cases/{id}/reinstate"
        actor: Servicer
        preconditions:
          - "Payment.amount_cents >= reinstatement_quote_cents"
        side_effects:
          - "ForeclosureCase.status := CLOSED_REINSTATED"
          - "Loan.posture := REINSTATED"

      - from: MEDIATION_OPEN
        to: CLOSED_REINSTATED
        trigger: "POST /foreclosure-cases/{id}/reinstate"
        actor: Servicer
        preconditions:
          - "Payment.amount_cents >= reinstatement_quote_cents"
        side_effects:
          - "ForeclosureCase.status := CLOSED_REINSTATED"
          - "Loan.posture := REINSTATED"
          - "Any OPEN MediationCase auto-transitions to FAILED"

      - from: FILED
        to: CLOSED_REINSTATED
        trigger: "POST /foreclosure-cases/{id}/reinstate"
        actor: Servicer
        preconditions:
          - "Payment.amount_cents >= reinstatement_quote_cents"
        side_effects: ["ForeclosureCase.status := CLOSED_REINSTATED", "Loan.posture := REINSTATED"]

      - from: AUCTION_SCHEDULED
        to: CLOSED_REINSTATED
        trigger: "POST /foreclosure-cases/{id}/reinstate"
        actor: Servicer
        preconditions:
          - "Payment.amount_cents >= reinstatement_quote_cents"
          - "now() < auction_date - 5 days (reinstatement cutoff)"
        side_effects: ["ForeclosureCase.status := CLOSED_REINSTATED", "Loan.posture := REINSTATED"]

      - from: AUCTION_SCHEDULED
        to: CLOSED_SOLD
        trigger: "system: clock advances past auction_date"
        actor: system
        preconditions: ["now() >= auction_date"]
        side_effects:
          - "ForeclosureCase.status := CLOSED_SOLD"
          - "Loan.posture remains FORECLOSURE (terminal for posting purposes)"

  # 8) MediationCase — branching with revision loop (cyclic OFFER_EXTENDED ↔ OFFER_REJECTED)
  - entity: MediationCase
    initial_state: REQUESTED
    terminal_states: [COMPLETED, FAILED]
    transitions:
      - from: REQUESTED
        to: OPEN
        trigger: "POST /mediation-cases/{id}/open"
        actor: LossMitigationUnderwriter
        preconditions:
          - "MediationCase.status == REQUESTED"
          - "ForeclosureCase.status == MEDIATION_OPEN"
        side_effects:
          - "MediationCase.status := OPEN, opened_at := now()"

      - from: OPEN
        to: OFFER_EXTENDED
        trigger: "POST /mediation-cases/{id}/extend-offer"
        actor: LossMitigationUnderwriter
        preconditions:
          - "MediationCase.status == OPEN"
          - "offered_new_rate_bps > 0 (or null if no rate change)"
          - "offered_term_extension_months >= 0"
          - "computed target_payment_cents <= Loan.scheduled_payment_cents (HAMP: offer must reduce payment)"
        side_effects:
          - "MediationCase.status := OFFER_EXTENDED"
          - "MediationCase.target_payment_cents computed via `hamp_modified_payment`"

      - from: OFFER_EXTENDED
        to: OFFER_ACCEPTED
        trigger: "POST /mediation-cases/{id}/accept-offer"
        actor: Borrower | Servicer
        preconditions:
          - "MediationCase.status == OFFER_EXTENDED"
        side_effects:
          - "MediationCase.status := OFFER_ACCEPTED"

      - from: OFFER_EXTENDED
        to: OFFER_REJECTED
        trigger: "POST /mediation-cases/{id}/reject-offer"
        actor: Borrower | Servicer | LossMitigationUnderwriter
        preconditions:
          - "MediationCase.status == OFFER_EXTENDED"
        side_effects:
          - "MediationCase.status := OFFER_REJECTED"
          - "MediationCase.rejection_reason set per body"

      - from: OFFER_REJECTED
        to: OFFER_EXTENDED
        trigger: "POST /mediation-cases/{id}/extend-offer (revised)"
        actor: LossMitigationUnderwriter
        preconditions:
          - "MediationCase.status == OFFER_REJECTED"
          - "ForeclosureCase.status == MEDIATION_OPEN"
          - "rejection_reason != BORROWER_REFUSED (refusal ends negotiation)"
        side_effects:
          - "MediationCase.status := OFFER_EXTENDED with new terms"
          - "MediationCase.target_payment_cents recomputed"
        note: "Cyclic revision loop — extends, rejects, re-extends."

      - from: OFFER_ACCEPTED
        to: COMPLETED
        trigger: "POST /mediation-cases/{id}/complete"
        actor: LossMitigationUnderwriter
        preconditions:
          - "MediationCase.status == OFFER_ACCEPTED"
        side_effects:
          - "MediationCase.status := COMPLETED"
          - "ForeclosureCase.status := CLOSED_MODIFIED (cascade)"
          - "Loan.scheduled_payment_cents, interest_rate_bps, term_months updated per offer (cascade)"
          - "Loan.posture := CURRENT (cascade)"

      - from: OFFER_REJECTED
        to: FAILED
        trigger: "POST /mediation-cases/{id}/fail"
        actor: LossMitigationUnderwriter | system
        preconditions:
          - "MediationCase.status == OFFER_REJECTED"
          - "rejection_reason == BORROWER_REFUSED OR (now() - ForeclosureCase.noi_sent_at >= 60 days)"
        side_effects:
          - "MediationCase.status := FAILED"
          - "ForeclosureCase.status transitions to FILED (cascade) if NOI window has expired"

      - from: OPEN
        to: FAILED
        trigger: "system: clock advances such that now() - ForeclosureCase.noi_sent_at >= 90 days with no OFFER_EXTENDED"
        actor: system
        preconditions: ["now() - ForeclosureCase.noi_sent_at >= 90 days", "MediationCase.status == OPEN"]
        side_effects:
          - "MediationCase.status := FAILED"

# ─────────────────────────────────────────────────────────────────────────────
# §1.2.1 Concurrency Rules
# ─────────────────────────────────────────────────────────────────────────────
concurrency_rules:
  - scenario: "Two servicers post payments on the same loan simultaneously"
    guarantee: "Both payments POSTED; allocations applied serially in received_date then created_at order; balances reflect both"
    error_id: ERR_CONCURRENT_UPDATE
    http_status: 409
    serialization: "First-writer-wins on Loan.version; loser must retry with refreshed Loan"

  - scenario: "Two PROVISIONAL EscrowAnalyses on the same loan finalized simultaneously"
    guarantee: "Exactly one finalize succeeds; the other is rejected so monthly_escrow_payment_cents is set deterministically"
    error_id: ERR_ESCROW_ANALYSIS_CONFLICT
    http_status: 409
    serialization: "First-writer-wins on EscrowAnalysis.id; loser sees the winner already FINALIZED"

  - scenario: "Underwriter approves PMI removal while servicer posts a late payment that breaks 24-month on-time history"
    guarantee: "If late-payment posting commits first, the subsequent approve is rejected; if approve commits first, posting succeeds without affecting pmi_status"
    error_id: ERR_PMI_HISTORY_INSUFFICIENT
    http_status: 422
    serialization: "First-writer-wins on Loan.version observed when PMI approval re-validates payment history at commit time"

  - scenario: "Two foreclosure attorneys open a ForeclosureCase on the same loan simultaneously"
    guarantee: "At most one open ForeclosureCase per loan; second is rejected"
    error_id: ERR_FORECLOSURE_CASE_EXISTS
    http_status: 409
    serialization: "First-writer-wins on Loan.id uniqueness of (loan_id, status IN {NOI_ISSUED, MEDIATION_OPEN, FILED, AUCTION_SCHEDULED})"

  - scenario: "Mediation extends an offer while another underwriter completes a different OFFER_ACCEPTED record"
    guarantee: "Once a MediationCase is in OFFER_ACCEPTED, /extend-offer is rejected"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on MediationCase.status"

  - scenario: "Borrower-initiated reinstatement payment lands while attorney schedules auction"
    guarantee: "If reinstatement payment commits first (and amount ≥ quote), schedule-auction is rejected; if schedule-auction commits first, reinstatement still allowed up to auction_date - 5 days"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on ForeclosureCase.status"

# ─────────────────────────────────────────────────────────────────────────────
# §1.3 Calculation Rules Table
# ─────────────────────────────────────────────────────────────────────────────
calculations:

  - name: monthly_pi_payment
    trigger: "On Loan creation; on MediationCase COMPLETED (loan modification)"
    algorithm: aggregation
    formula: |
      r = interest_rate_bps / 10000 / 12          # monthly rate
      n = term_months
      P = original_principal_cents (or current principal_balance_cents for modification)
      if r == 0:
          payment = ceil(P / n)
      else:
          payment = ceil( P * r * (1+r)^n / ((1+r)^n - 1) )
      Loan.scheduled_payment_cents := payment     # whole cents, round HALF_UP at the final division ONLY
    input_set: "Single loan, post-modification uses MediationCase target rate/term/principal_forbearance."
    constants:
      ROUNDING: ROUND_HALF_UP_FINAL_ONLY
    precision: "Whole cents, single rounding at the formula output (no per-month rounding)."

  - name: payment_waterfall_allocation
    trigger: "On POST /loans/{id}/payments (transition (none)→POSTED)"
    algorithm: waterfall_allocation
    formula: |
      remaining = amount_cents
      # Step 1: outstanding late fees (sum of unpaid late fees on Loan, in this MVP modelled as
      # outstanding_late_fees_cents := max(0, delinquency_days // 30) * 5000 capped at 25000)
      late_fee_due = min(remaining, outstanding_late_fees_cents)
      remaining -= late_fee_due
      # Step 2: accrued interest on past-due P&I installments
      interest_due = sum over each past-due installment of (principal_balance_at_installment * r)
      interest_alloc = min(remaining, interest_due)
      remaining -= interest_alloc
      # Step 3: principal on past-due installments
      principal_alloc = min(remaining, past_due_principal_cents)
      remaining -= principal_alloc
      # Step 4: escrow on past-due installments
      escrow_alloc = min(remaining, past_due_escrow_cents)
      remaining -= escrow_alloc
      # Step 5: residual → suspense (does NOT advance next_due_date until installment fully covered)
      suspense_alloc = remaining
    input_set: "All outstanding installments with due_date <= received_date AND not yet fully satisfied. Tie-break: oldest due_date first."
    constants:
      LATE_FEE_PER_MONTH_CENTS: 5000
      LATE_FEE_CAP_CENTS: 25000
    precision: "Whole cents. Per-installment interest computed as floor(principal_balance * r) and summed."
    variants:
      - name: standard_waterfall
        when: "Loan.posture IN {CURRENT, DELINQUENT}"
        difference: "Order: late_fee → interest → principal → escrow → suspense"
      - name: foreclosure_reinstatement_waterfall
        when: "Loan has open ForeclosureCase AND amount_cents >= ForeclosureCase.reinstatement_quote_cents"
        difference: "Order: foreclosure_costs_cents → late_fee → interest → principal → escrow → suspense. Different inclusion set: ALL past-due installments PLUS ForeclosureCase.foreclosure_costs_cents, settled in one go."

  - name: escrow_annual_projection
    trigger: "On POST /loans/{id}/escrow-analyses (PROVISIONAL); recomputed on /finalize before commit"
    algorithm: forward_looking
    formula: |
      projected_disbursements_cents = sum over next 12 months [analysis_date, analysis_date + 365d)
                                       of all SCHEDULED Disbursements of type IN {PROPERTY_TAX, HAZARD_INSURANCE}
                                       + Loan.pmi_monthly_cents * 12 (only if pmi_status == ACTIVE)
      required_cushion_cents = ceil(projected_disbursements_cents / 12) * 2          # 2-month cushion, ceil
      shortage_cents = max(0, required_cushion_cents - starting_balance_cents)
      surplus_cents  = max(0, starting_balance_cents - (required_cushion_cents + projected_disbursements_cents))
      new_monthly_escrow_cents = ceil( (projected_disbursements_cents + shortage_cents) / 12 )
    input_set: "Disbursements with status=SCHEDULED AND scheduled_date IN [analysis_date, analysis_date+365d). Excludes SURPLUS_REFUND."
    constants:
      WINDOW_DAYS: 365
      CUSHION_MONTHS: 2
      SURPLUS_REFUND_FLOOR_CENTS: 5000
    precision: "Whole cents. ceil() applied AT MOST ONCE per output field; no intermediate rounding inside a single field's computation."
    variants:
      - name: provisional_projection
        when: "Computed during POST /loans/{id}/escrow-analyses (PROVISIONAL)"
        difference: "Uses Disbursements as of the request commit time; never modifies Loan.monthly_escrow_payment_cents."
      - name: finalized_projection
        when: "Re-computed at /finalize commit time"
        difference: "Re-reads Disbursements at commit (may differ from PROVISIONAL if disbursements were added/canceled between); writes Loan.monthly_escrow_payment_cents and may emit a SURPLUS_REFUND Disbursement when surplus_cents > SURPLUS_REFUND_FLOOR_CENTS."

  - name: pmi_ltv_evaluation
    trigger: "On POST /loans/{id}/pmi-removal-requests"
    algorithm: threshold
    formula: |
      if trigger == AUTO_TERMINATION:
          # Use scheduled-amortization assumption: original_appraised_value, current principal_balance
          basis_value = original_appraised_value_cents
      else:
          basis_value = current_appraised_value_cents
      evaluated_ltv_bps = floor( (principal_balance_cents * 10000) / basis_value )
      eligible = (
        (trigger == BORROWER_REQUEST AND evaluated_ltv_bps <= 8000) OR
        (trigger == AUTO_TERMINATION AND evaluated_ltv_bps <= 7800)
      )
    input_set: "Single loan; basis value depends on trigger."
    constants:
      AUTO_TERM_LTV_BPS: 7800        # 78.00%
      BORROWER_REQ_LTV_BPS: 8000     # 80.00%
    precision: "Integer basis points, floor()."

  - name: reinstatement_quote
    trigger: "On GET /foreclosure-cases/{id}/quote and on POST /foreclosure-cases/{id}/reinstate (re-checked at commit)"
    algorithm: aggregation
    formula: |
      reinstatement_quote_cents = sum over each past-due installment from next_due_date up to today of
                                     (P&I installment + escrow installment)
                                  + outstanding_late_fees_cents
                                  + ForeclosureCase.foreclosure_costs_cents
                                  + escrow_shortage_from_failed_disbursements_cents
      # escrow_shortage_from_failed_disbursements_cents := max(0, -current_escrow_balance_cents)
    input_set: "All installments due in [Loan.next_due_date, today]. Failed disbursement shortage included only if it produced a negative escrow balance."
    constants: {}
    precision: "Whole cents. Single sum; no intermediate rounding."

  - name: hamp_modified_payment
    trigger: "On POST /mediation-cases/{id}/extend-offer (and recomputed on accept-offer/complete cascade)"
    algorithm: tiered_pricing
    formula: |
      # HAMP-style waterfall (apply in order; stop when target met OR all steps exhausted)
      P_remaining = principal_balance_cents - offered_principal_forbearance_cents
      r_new       = (offered_new_rate_bps OR interest_rate_bps) / 10000 / 12
      n_new       = (term_months - months_elapsed_since_origination) + offered_term_extension_months
      target_payment_cents = ceil( P_remaining * r_new * (1+r_new)^n_new / ((1+r_new)^n_new - 1) )
      # Affordability floor: target_payment_cents must be ≥ floor_payment_cents (no negative-amortization)
      floor_payment_cents = ceil( P_remaining / n_new )
      if target_payment_cents < floor_payment_cents:
          raise ERR_HAMP_AFFORDABILITY_FLOOR
      # Reduction guard: target_payment_cents must be < current scheduled_payment_cents
      if target_payment_cents >= Loan.scheduled_payment_cents:
          raise ERR_HAMP_NOT_A_REDUCTION
    input_set: "Single loan + the offer fields on MediationCase. Evaluation order: principal forbearance → rate reduction → term extension."
    constants:
      ROUNDING: ROUND_HALF_UP_FINAL_ONLY
    precision: "Whole cents, single final ceil()."
    variants:
      - name: offer_at_extension
        when: "Computed during /extend-offer"
        difference: "Inputs: offer fields on MediationCase as provided in this request body. Result stored on MediationCase.target_payment_cents."
      - name: offer_at_completion
        when: "Recomputed during /complete cascade"
        difference: "Re-uses the stored MediationCase fields, BUT uses Loan.principal_balance_cents AS OF the cascade commit (which may have changed since extension if any payments were posted). If recomputed target_payment_cents diverges from the stored value by > 100 cents, the transition fails with ERR_HAMP_STALE_OFFER."

  - name: forbearance_cure_balance
    trigger: "Continuously evaluated after ForbearancePlan.end_date and after every Payment.posted that targets cure"
    algorithm: chronological
    formula: |
      cure_balance_cents = total_paused_cents
      for each Payment with received_date >= ForbearancePlan.end_date, status=POSTED, ordered by received_date ASC, created_at ASC:
          applied_to_cure = min(cure_balance_cents, allocation_principal_cents + allocation_interest_cents + allocation_escrow_cents)
          cure_balance_cents -= applied_to_cure
      # repayment_method-specific:
      # LUMP_SUM: one payment must fully satisfy cure within 30 days post-end
      # REPAYMENT_PLAN_12M: cure spread over 12 months; per-month minimum = ceil(total_paused_cents / 12)
      # DEFERRAL: cure_balance_cents := 0 immediately on COMPLETED transition; total_paused_cents added to principal at maturity
    input_set: "Payments with received_date >= end_date AND status=POSTED."
    constants:
      BREACH_GRACE_DAYS: 30
    precision: "Whole cents; cure_balance_cents floored at 0."

# ─────────────────────────────────────────────────────────────────────────────
# §1.4 Validation Rules Table (Ordered by Priority)
# ─────────────────────────────────────────────────────────────────────────────
validations:
  # ── Auth ─────────────────────────────────────────
  - priority: 1
    category: auth
    check: "X-User-Role header is present and is one of the declared roles"
    error_id: ERR_AUTH_MISSING
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "X-User-ID header is present"
    error_id: ERR_AUTH_MISSING
    http_status: 401
    applies_to: all

  # ── Authorization ────────────────────────────────
  - priority: 3
    category: auth
    check: "Acting role is permitted for this endpoint per RBAC matrix"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 4
    category: auth
    check: "Segregation of duties: a single X-User-ID cannot both extend-offer AND accept-offer on the same MediationCase; and cannot both post payment of a cure batch AND finalize the forbearance plan as COMPLETED"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /mediation-cases/{id}/accept-offer, POST /loans/{loan_id}/forbearance-plans/{id}/complete (system normally) — when manually triggered by Servicer"

  # ── Existence ────────────────────────────────────
  - priority: 5
    category: existence
    check: "Path parameter loan_id resolves to an existing Loan (left-to-right)"
    error_id: ERR_LOAN_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints whose path includes /loans/{id}"

  - priority: 6
    category: existence
    check: "Nested resource id (Payment, EscrowAnalysis, Disbursement, ForbearancePlan, PmiRemovalRequest, ForeclosureCase, MediationCase) resolves under its declared parent"
    error_id: ERR_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: "all nested item endpoints"

  # ── State preconditions ──────────────────────────
  - priority: 7
    category: state
    check: "Loan.posture must allow the operation (e.g., no payments after PAID_OFF; no escrow analysis on PAID_OFF; no PMI removal request on AUTO_TERMINATED)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "POST /payments, POST /escrow-analyses, POST /pmi-removal-requests"

  - priority: 8
    category: state
    check: "Source state matches the transition's `from` state (e.g., can only /finalize a PROVISIONAL EscrowAnalysis; only /reverse a POSTED Payment)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"

  - priority: 9
    category: state
    check: "Optimistic concurrency: if request body includes `version`, it must equal current Loan/Plan/Case.version"
    error_id: ERR_CONCURRENT_UPDATE
    http_status: 409
    applies_to: "PATCH /loans/{id}, all action endpoints accepting `version`"

  # ── Business: safety / compliance (regulatory) ───
  - priority: 10
    category: business_safety
    check: "ForeclosureCase cannot transition NOI_ISSUED → FILED until 30 days have elapsed since noi_sent_at (NOI window)"
    error_id: ERR_NOI_WINDOW_NOT_ELAPSED
    http_status: 422
    applies_to: "POST /foreclosure-cases/{id}/file"

  - priority: 11
    category: business_safety
    check: "ForeclosureCase cannot schedule auction until 60 days after filed_at AND auction_date must be ≥ now() + 30 days (statutory notice)"
    error_id: ERR_AUCTION_NOTICE_VIOLATION
    http_status: 422
    applies_to: "POST /foreclosure-cases/{id}/schedule-auction"

  - priority: 12
    category: business_safety
    check: "MediationCase cannot be requested after NOI window has expired (30 days since noi_sent_at)"
    error_id: ERR_MEDIATION_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /foreclosure-cases/{id}/mediation-cases"

  - priority: 13
    category: business_safety
    check: "ForbearancePlan creation requires Borrower.hardship_attested_at IS NOT NULL"
    error_id: ERR_HARDSHIP_AFFIDAVIT_MISSING
    http_status: 422
    applies_to: "POST /loans/{id}/forbearance-plans, POST /foreclosure-cases/{id}/mediation-cases"

  # ── Business: referential (cross-entity exclusivity) ─
  - priority: 14
    category: business_referential
    check: "At most one ForbearancePlan with status=ACTIVE per Loan"
    error_id: ERR_FORBEARANCE_PLAN_EXISTS
    http_status: 409
    applies_to: "POST /loans/{id}/forbearance-plans"

  - priority: 15
    category: business_referential
    check: "At most one open ForeclosureCase (status IN {NOI_ISSUED, MEDIATION_OPEN, FILED, AUCTION_SCHEDULED}) per Loan"
    error_id: ERR_FORECLOSURE_CASE_EXISTS
    http_status: 409
    applies_to: "POST /foreclosure-cases"

  - priority: 16
    category: business_referential
    check: "At most one active MediationCase (status NOT IN {FAILED, OFFER_REJECTED, COMPLETED}) per ForeclosureCase"
    error_id: ERR_MEDIATION_ALREADY_OPEN
    http_status: 409
    applies_to: "POST /foreclosure-cases/{id}/mediation-cases"

  # ── Business: constraint (eligibility / formulas) ─
  - priority: 17
    category: business_constraint
    check: "PMI removal via BORROWER_REQUEST: evaluated_ltv_bps <= 8000; via AUTO_TERMINATION: evaluated_ltv_bps <= 7800"
    error_id: ERR_PMI_LTV_TOO_HIGH
    http_status: 422
    applies_to: "POST /loans/{loan_id}/pmi-removal-requests/{id}/approve"

  - priority: 18
    category: business_constraint
    check: "PMI removal via BORROWER_REQUEST: Loan.posture == CURRENT AND no Payment with received_date > scheduled due_date in last 24 scheduled months"
    error_id: ERR_PMI_HISTORY_INSUFFICIENT
    http_status: 422
    applies_to: "POST /loans/{loan_id}/pmi-removal-requests/{id}/approve"

  - priority: 19
    category: business_constraint
    check: "HAMP offer must reduce payment: computed target_payment_cents < Loan.scheduled_payment_cents"
    error_id: ERR_HAMP_NOT_A_REDUCTION
    http_status: 422
    applies_to: "POST /mediation-cases/{id}/extend-offer"

  - priority: 20
    category: business_constraint
    check: "HAMP offer affordability floor: target_payment_cents >= ceil(P_remaining / n_new) (no negative amortization)"
    error_id: ERR_HAMP_AFFORDABILITY_FLOOR
    http_status: 422
    applies_to: "POST /mediation-cases/{id}/extend-offer"

  - priority: 21
    category: business_constraint
    check: "HAMP stale offer: at /complete cascade, recomputed target_payment_cents must be within 100 cents of stored value"
    error_id: ERR_HAMP_STALE_OFFER
    http_status: 422
    applies_to: "POST /mediation-cases/{id}/complete"

  - priority: 22
    category: business_constraint
    check: "EscrowAnalysis.analysis_date >= Loan.origination_date AND starting_balance_cents == current Loan.escrow_balance_cents"
    error_id: ERR_ESCROW_BASELINE_MISMATCH
    http_status: 422
    applies_to: "POST /loans/{id}/escrow-analyses"

  - priority: 23
    category: business_temporal
    check: "Reinstatement on AUCTION_SCHEDULED case requires now() < auction_date - 5 days"
    error_id: ERR_REINSTATEMENT_CUTOFF
    http_status: 422
    applies_to: "POST /foreclosure-cases/{id}/reinstate"

  - priority: 24
    category: business_temporal
    check: "ForbearancePlan.start_date must be ≤ Loan.next_due_date (cannot start in the future of arrears)"
    error_id: ERR_FORBEARANCE_DATE_INVALID
    http_status: 422
    applies_to: "POST /loans/{id}/forbearance-plans"

  # ── Business: fiscal ─────────────────────────────
  - priority: 25
    category: business_fiscal
    check: "Payment amount_cents > 0"
    error_id: ERR_PAYMENT_AMOUNT_INVALID
    http_status: 422
    applies_to: "POST /loans/{id}/payments"

  - priority: 26
    category: business_fiscal
    check: "Reinstatement: Payment.amount_cents >= ForeclosureCase.reinstatement_quote_cents (re-checked at commit)"
    error_id: ERR_REINSTATEMENT_INSUFFICIENT
    http_status: 422
    applies_to: "POST /foreclosure-cases/{id}/reinstate"

  - priority: 27
    category: business_fiscal
    check: "Disbursement retry requires Loan.escrow_balance_cents >= amount_cents"
    error_id: ERR_INSUFFICIENT_ESCROW
    http_status: 422
    applies_to: "POST /loans/{loan_id}/disbursements/{id}/retry"

# ─────────────────────────────────────────────────────────────────────────────
# §1.5 API Endpoint Table
# ─────────────────────────────────────────────────────────────────────────────
endpoints:

  # ── Borrower ──────────────────────────────────────
  - method: POST
    path: "/borrowers"
    description: "Create a borrower."
    roles: [Servicer, PlatformAdmin]
    code: 201
    input: [full_name, email]
    output: Borrower
    side_effects: []

  - method: POST
    path: "/borrowers/{id}/hardship-attestation"
    description: "Record borrower hardship affidavit submission. Required for forbearance and mediation."
    roles: [Servicer, Borrower]
    code: 200
    input: []
    output: Borrower
    side_effects: ["Borrower.hardship_attested_at := now()"]

  - method: GET
    path: "/borrowers/{id}"
    description: "Fetch a borrower."
    roles: [Servicer, PlatformAdmin, Borrower]
    code: 200
    input: []
    output: Borrower
    side_effects: []

  # ── Loan ──────────────────────────────────────────
  - method: POST
    path: "/loans"
    description: "Originate (book) a loan. Servicer-only."
    roles: [Servicer, PlatformAdmin]
    code: 201
    input: ["borrower_id", "origination_date", "original_principal_cents", "original_appraised_value_cents", "interest_rate_bps", "term_months", "pmi_monthly_cents?", "monthly_escrow_payment_cents?"]
    output: Loan
    side_effects:
      - "Compute scheduled_payment_cents via calc `monthly_pi_payment`"
      - "Initialise principal_balance_cents := original_principal_cents"
      - "Initialise escrow_balance_cents := 0; next_due_date := origination_date + 1 month"
      - "Initialise posture := CURRENT, pmi_status := ACTIVE if pmi_monthly_cents > 0 else REMOVED"

  - method: GET
    path: "/loans/{id}"
    description: "Fetch a loan with all derived fields."
    roles: [Servicer, PlatformAdmin, Borrower, LossMitigationUnderwriter, PmiUnderwriter, ForeclosureAttorney]
    code: 200
    input: []
    output: Loan
    side_effects: []

  - method: GET
    path: "/loans"
    description: "List loans with pagination + filters."
    roles: [Servicer, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?", "posture?", "pmi_status?", "borrower_id?"]
    output: Loan[]
    side_effects: []

  # ── Payments ──────────────────────────────────────
  - method: POST
    path: "/loans/{id}/payments"
    description: "Post a payment; runs waterfall allocation; may cascade posture changes (depth-3)."
    roles: [Servicer, Borrower]
    code: 201
    input: ["received_date", "amount_cents", "version?"]
    output: Payment
    side_effects:
      - "Run calc `payment_waterfall_allocation`"
      - "Update Loan principal_balance_cents, escrow_balance_cents, next_due_date, delinquency_days"
      - "Cascade Loan posture (CURRENT/DELINQUENT/PAID_OFF/REINSTATED→CURRENT)"
      - "If Loan has ACTIVE ForbearancePlan past end_date, run calc `forbearance_cure_balance` (depth-3 cascade)"

  - method: POST
    path: "/loans/{loan_id}/payments/{id}/reverse"
    description: "Reverse a posted payment (servicer correction); rolls back allocations and posture."
    roles: [Servicer]
    code: 200
    input: []
    output: Payment
    side_effects: ["See Payment state machine POSTED→REVERSED"]

  - method: GET
    path: "/loans/{id}/payments"
    description: "List payments on a loan."
    roles: [Servicer, PlatformAdmin, Borrower]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: Payment[]
    side_effects: []

  # ── Escrow Analysis ───────────────────────────────
  - method: POST
    path: "/loans/{id}/escrow-analyses"
    description: "Create a PROVISIONAL escrow analysis."
    roles: [Servicer]
    code: 201
    input: [analysis_date, starting_balance_cents]
    output: EscrowAnalysis
    side_effects: ["Compute projection (variant `provisional_projection`)"]

  - method: POST
    path: "/loans/{loan_id}/escrow-analyses/{id}/finalize"
    description: "Finalize an escrow analysis; updates Loan.monthly_escrow_payment_cents and may emit a SURPLUS_REFUND disbursement."
    roles: [Servicer]
    code: 200
    input: []
    output: EscrowAnalysis
    side_effects: ["See EscrowAnalysis SM PROVISIONAL→FINALIZED (depth-3 cascade: analysis → Loan.monthly_escrow → SURPLUS_REFUND Disbursement)"]

  - method: GET
    path: "/loans/{id}/escrow-analyses"
    description: "List escrow analyses (incl. SUPERSEDED)."
    roles: [Servicer, Borrower]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: EscrowAnalysis[]
    side_effects: []

  # ── Disbursements ─────────────────────────────────
  - method: POST
    path: "/loans/{id}/disbursements"
    description: "Schedule a tax or insurance disbursement."
    roles: [Servicer]
    code: 201
    input: [type, scheduled_date, amount_cents]
    output: Disbursement
    side_effects: []

  - method: POST
    path: "/loans/{loan_id}/disbursements/{id}/retry"
    description: "Retry a FAILED disbursement (after escrow has funds)."
    roles: [Servicer]
    code: 200
    input: []
    output: Disbursement
    side_effects: ["See Disbursement SM FAILED→PAID"]

  - method: POST
    path: "/loans/{loan_id}/disbursements/{id}/cancel"
    description: "Cancel a SCHEDULED disbursement."
    roles: [Servicer]
    code: 200
    input: []
    output: Disbursement
    side_effects: []

  - method: GET
    path: "/loans/{id}/disbursements"
    description: "List disbursements on a loan."
    roles: [Servicer, Borrower, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?", "status?", "type?"]
    output: Disbursement[]
    side_effects: []

  # ── Forbearance ───────────────────────────────────
  - method: POST
    path: "/loans/{id}/forbearance-plans"
    description: "Create and ACTIVE-ate a forbearance plan."
    roles: [LossMitigationUnderwriter]
    code: 201
    input: [start_date, months, repayment_method]
    output: ForbearancePlan
    side_effects: ["See ForbearancePlan SM; cascades Loan.posture := FORBEARANCE"]

  - method: POST
    path: "/loans/{loan_id}/forbearance-plans/{id}/cancel"
    description: "Cancel an ACTIVE forbearance plan before end_date."
    roles: [LossMitigationUnderwriter]
    code: 200
    input: []
    output: ForbearancePlan
    side_effects: ["See ForbearancePlan SM ACTIVE→CANCELED"]

  - method: GET
    path: "/loans/{id}/forbearance-plans"
    description: "List forbearance plans on a loan."
    roles: [Servicer, LossMitigationUnderwriter, Borrower]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: ForbearancePlan[]
    side_effects: []

  # ── PMI Removal ───────────────────────────────────
  - method: POST
    path: "/loans/{id}/pmi-removal-requests"
    description: "File a PMI removal request (BORROWER_REQUEST or AUTO_TERMINATION)."
    roles: [Servicer, Borrower]
    code: 201
    input: ["trigger", "current_appraised_value_cents?"]
    output: PmiRemovalRequest
    side_effects: ["Compute evaluated_ltv_bps via calc `pmi_ltv_evaluation`; set Loan.pmi_status := REMOVAL_REQUESTED"]

  - method: POST
    path: "/loans/{loan_id}/pmi-removal-requests/{id}/approve"
    description: "Underwriter approves removal."
    roles: [PmiUnderwriter]
    code: 200
    input: []
    output: PmiRemovalRequest
    side_effects: ["See PmiRemovalRequest SM PENDING→APPROVED; sets Loan.pmi_status := REMOVED/AUTO_TERMINATED; Loan.pmi_monthly_cents := 0"]

  - method: POST
    path: "/loans/{loan_id}/pmi-removal-requests/{id}/deny"
    description: "Underwriter denies removal."
    roles: [PmiUnderwriter]
    code: 200
    input: [denial_reason]
    output: PmiRemovalRequest
    side_effects: ["See PmiRemovalRequest SM PENDING→DENIED; Loan.pmi_status reverts to ACTIVE"]

  # ── Foreclosure ───────────────────────────────────
  - method: POST
    path: "/foreclosure-cases"
    description: "Open a foreclosure case (issues NOI)."
    roles: [ForeclosureAttorney]
    code: 201
    input: ["loan_id", "foreclosure_costs_cents?"]
    output: ForeclosureCase
    side_effects: ["See ForeclosureCase SM (none)→NOI_ISSUED; Loan.posture := FORECLOSURE"]

  - method: GET
    path: "/foreclosure-cases/{id}/quote"
    description: "Compute current reinstatement quote (idempotent read)."
    roles: [Servicer, Borrower, ForeclosureAttorney]
    code: 200
    input: []
    output: ForeclosureCase
    side_effects: ["Compute reinstatement_quote_cents via calc `reinstatement_quote` (read-only)"]

  - method: POST
    path: "/foreclosure-cases/{id}/file"
    description: "File foreclosure in court (after NOI window)."
    roles: [ForeclosureAttorney]
    code: 200
    input: []
    output: ForeclosureCase
    side_effects: ["See ForeclosureCase SM NOI_ISSUED→FILED"]

  - method: POST
    path: "/foreclosure-cases/{id}/schedule-auction"
    description: "Schedule the foreclosure auction date."
    roles: [ForeclosureAttorney]
    code: 200
    input: [auction_date]
    output: ForeclosureCase
    side_effects: ["See ForeclosureCase SM FILED→AUCTION_SCHEDULED"]

  - method: POST
    path: "/foreclosure-cases/{id}/reinstate"
    description: "Borrower pays full reinstatement quote; case closes; loan REINSTATED."
    roles: [Servicer, Borrower]
    code: 200
    input: [payment_amount_cents]
    output: ForeclosureCase
    side_effects: ["Create Payment with amount_cents=payment_amount_cents; close case; Loan.posture := REINSTATED (depth-3 cascade)"]

  - method: GET
    path: "/foreclosure-cases"
    description: "List foreclosure cases."
    roles: [ForeclosureAttorney, Servicer, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?", "status?", "loan_id?"]
    output: ForeclosureCase[]
    side_effects: []

  # ── Mediation ─────────────────────────────────────
  - method: POST
    path: "/foreclosure-cases/{id}/mediation-cases"
    description: "Borrower requests pre-foreclosure mediation (within NOI window)."
    roles: [Servicer, Borrower]
    code: 201
    input: []
    output: MediationCase
    side_effects: ["See ForeclosureCase SM NOI_ISSUED→MEDIATION_OPEN; MediationCase status REQUESTED"]

  - method: POST
    path: "/mediation-cases/{id}/open"
    description: "Underwriter opens the mediation for negotiation."
    roles: [LossMitigationUnderwriter]
    code: 200
    input: []
    output: MediationCase
    side_effects: ["See MediationCase SM REQUESTED→OPEN"]

  - method: POST
    path: "/mediation-cases/{id}/extend-offer"
    description: "Underwriter extends a HAMP-style modification offer."
    roles: [LossMitigationUnderwriter]
    code: 200
    input: ["offered_new_rate_bps?", "offered_term_extension_months?", "offered_principal_forbearance_cents?"]
    output: MediationCase
    side_effects: ["Compute target_payment_cents via calc `hamp_modified_payment`; advance to OFFER_EXTENDED"]

  - method: POST
    path: "/mediation-cases/{id}/accept-offer"
    description: "Borrower accepts the extended offer."
    roles: [Borrower, Servicer]
    code: 200
    input: []
    output: MediationCase
    side_effects: ["See MediationCase SM OFFER_EXTENDED→OFFER_ACCEPTED"]

  - method: POST
    path: "/mediation-cases/{id}/reject-offer"
    description: "Borrower/underwriter rejects the offer (may extend a revised one)."
    roles: [Borrower, Servicer, LossMitigationUnderwriter]
    code: 200
    input: [rejection_reason]
    output: MediationCase
    side_effects: ["See MediationCase SM OFFER_EXTENDED→OFFER_REJECTED"]

  - method: POST
    path: "/mediation-cases/{id}/complete"
    description: "Finalize an accepted offer: modifies loan terms; closes foreclosure case as MODIFIED."
    roles: [LossMitigationUnderwriter]
    code: 200
    input: []
    output: MediationCase
    side_effects: ["See MediationCase SM OFFER_ACCEPTED→COMPLETED; depth-3 cascade through ForeclosureCase → Loan"]

  - method: POST
    path: "/mediation-cases/{id}/fail"
    description: "End mediation in failure (manual cutoff)."
    roles: [LossMitigationUnderwriter]
    code: 200
    input: []
    output: MediationCase
    side_effects: ["See MediationCase SM OFFER_REJECTED→FAILED"]

  - method: GET
    path: "/mediation-cases/{id}"
    description: "Fetch a mediation case."
    roles: [LossMitigationUnderwriter, Servicer, Borrower, ForeclosureAttorney]
    code: 200
    input: []
    output: MediationCase
    side_effects: []

  # ── Test-driving infrastructure (required by §1.5 testability) ──
  - method: POST
    path: "/_clock/advance"
    description: "Advance the server's logical clock by N days. Triggers any time-gated transitions (CURRENT→DELINQUENT, DELINQUENT→DEFAULT, ForbearancePlan ACTIVE→COMPLETED/BREACHED, Disbursement SCHEDULED→PAID/FAILED, ForeclosureCase AUCTION_SCHEDULED→CLOSED_SOLD, MediationCase OPEN→FAILED)."
    roles: [PlatformAdmin]
    code: 200
    input: [days]
    output: null
    side_effects: ["Recompute delinquency_days; evaluate every time-gated transition listed above in deterministic order: (1) ForbearancePlan completions/breaches, (2) Loan posture recomputation, (3) Disbursement maturations, (4) ForeclosureCase auctions, (5) MediationCase timeouts"]

  - method: POST
    path: "/_sweep/run"
    description: "Run the periodic batch sweep without advancing the clock. Re-evaluates Loan.posture, processes due Disbursements, etc."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: null
    side_effects: ["Same evaluation as /_clock/advance with days=0"]

# ─────────────────────────────────────────────────────────────────────────────
# §1.6 Error Code Catalog
# ─────────────────────────────────────────────────────────────────────────────
errors:
  # Auth
  - id: ERR_AUTH_MISSING
    http: 401
    condition: "X-User-Role or X-User-ID header missing/invalid."
  - id: ERR_FORBIDDEN
    http: 403
    condition: "Acting role not permitted for this endpoint."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "Same X-User-ID attempted to perform two segregated steps (e.g., extend-offer then accept-offer on same MediationCase)."

  # Existence
  - id: ERR_LOAN_NOT_FOUND
    http: 404
    condition: "loan_id in path does not resolve."
  - id: ERR_RESOURCE_NOT_FOUND
    http: 404
    condition: "Nested resource id (payment, escrow analysis, disbursement, forbearance plan, PMI request, foreclosure case, mediation case) does not resolve under its parent."

  # State & concurrency
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Source state does not allow this transition (e.g., reverse a non-POSTED payment, finalize a SUPERSEDED analysis)."
  - id: ERR_CONCURRENT_UPDATE
    http: 409
    condition: "Version mismatch on optimistic concurrency check."
  - id: ERR_ESCROW_ANALYSIS_CONFLICT
    http: 409
    condition: "Another EscrowAnalysis was FINALIZED concurrently on the same loan."
  - id: ERR_FORBEARANCE_PLAN_EXISTS
    http: 409
    condition: "Loan already has an ACTIVE ForbearancePlan."
  - id: ERR_FORECLOSURE_CASE_EXISTS
    http: 409
    condition: "Loan already has an open ForeclosureCase."
  - id: ERR_MEDIATION_ALREADY_OPEN
    http: 409
    condition: "ForeclosureCase already has an active MediationCase."

  # Compliance / safety
  - id: ERR_NOI_WINDOW_NOT_ELAPSED
    http: 422
    condition: "Attempted to FILE foreclosure before 30 days since noi_sent_at."
  - id: ERR_AUCTION_NOTICE_VIOLATION
    http: 422
    condition: "Auction scheduled too early (< 60 days post-filing OR < 30 days statutory notice)."
  - id: ERR_MEDIATION_WINDOW_CLOSED
    http: 422
    condition: "Mediation requested after the NOI 30-day window."
  - id: ERR_HARDSHIP_AFFIDAVIT_MISSING
    http: 422
    condition: "Forbearance/mediation requested without Borrower.hardship_attested_at."
  - id: ERR_REINSTATEMENT_CUTOFF
    http: 422
    condition: "Reinstatement attempted within 5 days of auction_date."

  # Eligibility / formula
  - id: ERR_PMI_LTV_TOO_HIGH
    http: 422
    condition: "evaluated_ltv_bps exceeds the threshold for the request trigger."
  - id: ERR_PMI_HISTORY_INSUFFICIENT
    http: 422
    condition: "Loan not CURRENT or has a late payment in the last 24 scheduled months (BORROWER_REQUEST only)."
  - id: ERR_HAMP_NOT_A_REDUCTION
    http: 422
    condition: "HAMP offer would not reduce the scheduled payment."
  - id: ERR_HAMP_AFFORDABILITY_FLOOR
    http: 422
    condition: "HAMP offer falls below the principal-only floor (would cause negative amortization)."
  - id: ERR_HAMP_STALE_OFFER
    http: 422
    condition: "At /complete, recomputed target_payment_cents diverges from stored value by > 100 cents."

  # Inputs / fiscal
  - id: ERR_ESCROW_BASELINE_MISMATCH
    http: 422
    condition: "starting_balance_cents does not equal current Loan.escrow_balance_cents OR analysis_date < origination_date."
  - id: ERR_PAYMENT_AMOUNT_INVALID
    http: 422
    condition: "Payment amount_cents <= 0."
  - id: ERR_REINSTATEMENT_INSUFFICIENT
    http: 422
    condition: "Reinstatement payment_amount_cents < reinstatement_quote_cents."
  - id: ERR_INSUFFICIENT_ESCROW
    http: 422
    condition: "Disbursement retry attempted when escrow_balance_cents < amount_cents."
  - id: ERR_FORBEARANCE_DATE_INVALID
    http: 422
    condition: "ForbearancePlan.start_date > Loan.next_due_date."

# ─────────────────────────────────────────────────────────────────────────────
# §1.7 RBAC Matrix
# ─────────────────────────────────────────────────────────────────────────────
roles:

  - name: Borrower
    description: "The mortgagor. May submit payments, request PMI removal/forbearance/mediation, view own loan."
    identity: "entity_backed:Borrower"
    exclusive_operations: []
    shared_operations:
      - "POST /borrowers/{id}/hardship-attestation"
      - "POST /loans/{id}/payments (for own loan only)"
      - "POST /loans/{id}/pmi-removal-requests (for own loan, trigger=BORROWER_REQUEST)"
      - "POST /foreclosure-cases/{id}/mediation-cases (for own loan)"
      - "POST /mediation-cases/{id}/accept-offer"
      - "POST /mediation-cases/{id}/reject-offer"
      - "POST /foreclosure-cases/{id}/reinstate (for own loan)"
      - "GET /loans/{id}, /payments, /disbursements, /escrow-analyses (for own loan)"

  - name: Servicer
    description: "The loan-servicing operator. Originates loans, posts/reverses payments, schedules disbursements, runs escrow analyses, files PMI requests."
    identity: "opaque"
    exclusive_operations:
      - "POST /loans"
      - "POST /loans/{loan_id}/payments/{id}/reverse"
      - "POST /loans/{id}/escrow-analyses"
      - "POST /loans/{loan_id}/escrow-analyses/{id}/finalize"
      - "POST /loans/{id}/disbursements"
      - "POST /loans/{loan_id}/disbursements/{id}/retry"
      - "POST /loans/{loan_id}/disbursements/{id}/cancel"
    shared_operations:
      - "POST /borrowers"
      - "POST /borrowers/{id}/hardship-attestation"
      - "POST /loans/{id}/payments"
      - "POST /loans/{id}/pmi-removal-requests"
      - "POST /foreclosure-cases/{id}/mediation-cases"
      - "POST /foreclosure-cases/{id}/reinstate"
      - "GET endpoints"

  - name: LossMitigationUnderwriter
    description: "Underwriter for loss-mitigation workflows: approves forbearance plans and runs mediation (HAMP offers)."
    identity: "opaque"
    exclusive_operations:
      - "POST /loans/{id}/forbearance-plans"
      - "POST /loans/{loan_id}/forbearance-plans/{id}/cancel"
      - "POST /mediation-cases/{id}/open"
      - "POST /mediation-cases/{id}/extend-offer"
      - "POST /mediation-cases/{id}/complete"
      - "POST /mediation-cases/{id}/fail"
    shared_operations:
      - "POST /mediation-cases/{id}/reject-offer"
      - "GET /loans/{id}, /mediation-cases/{id}"

  - name: PmiUnderwriter
    description: "Underwriter dedicated to PMI removal eligibility. Segregated from Servicer."
    identity: "opaque"
    exclusive_operations:
      - "POST /loans/{loan_id}/pmi-removal-requests/{id}/approve"
      - "POST /loans/{loan_id}/pmi-removal-requests/{id}/deny"
    shared_operations:
      - "GET /loans/{id}"

  - name: ForeclosureAttorney
    description: "Files and manages foreclosure proceedings."
    identity: "opaque"
    exclusive_operations:
      - "POST /foreclosure-cases"
      - "POST /foreclosure-cases/{id}/file"
      - "POST /foreclosure-cases/{id}/schedule-auction"
    shared_operations:
      - "GET /foreclosure-cases"

  - name: PlatformAdmin
    description: "Operational admin; can list anything and run test-driving endpoints."
    identity: "opaque"
    exclusive_operations:
      - "POST /_clock/advance"
      - "POST /_sweep/run"
    shared_operations:
      - "POST /borrowers"
      - "POST /loans"
      - "GET endpoints"
