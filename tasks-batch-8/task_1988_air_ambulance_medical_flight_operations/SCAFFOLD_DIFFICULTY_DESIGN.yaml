            - { call: "POST /air-ambulance/mission-requests", payload: { patient_id: "${pat_id}", transport_class: "EMERGENCY_INTERFACILITY", origin_facility: "Clinic West", destination_facility: "County General", reported_cardio: 2, reported_resp: 1, reported_neuro: 1, reported_interventions: 0, onset_iso: "2026-07-31T10:00:00Z" }, as: Dispatcher, captures: { req_id: "$.data.id" } }
            - { call: "POST /air-ambulance/mission-requests/${req_id}/triage", payload: { verified_cardio: 2, verified_resp: 1, verified_neuro: 1, verified_interventions: 0 }, as: MedicalDirector }
            - { call: "POST /air-ambulance/mission-requests/${req_id}/accept", payload: { aircraft_id: "${ac_id}", crew: [{ crew_member_id: "${pilot_id}", role_in_mission: "PILOT" }, { crew_member_id: "${nurse_id}", role_in_mission: "NURSE" }], estimated_loaded_miles: 1, planned_launch_iso: "2026-08-01T06:00:00Z", planned_duration_min: 60 }, as: Dispatcher, captures: { m_id: "$.data.id", m_v: "$.data.version" } }
            - { call: "POST /air-ambulance/weather-assessments", payload: { mission_id: "${m_id}", ceiling_ft: 1000, visibility_sm: 5.0, wind_kt: 10, precip: "NONE", day_night: "DAY", terrain: "FLAT", expected_mission_version: "${m_v}" }, as: FlightCrew, as_user_id: "${pilot_id}" }
            - { call: "POST /air-ambulance/missions/${m_id}/advance", payload: { to_state: "LAUNCHED" }, as: FlightCrew, as_user_id: "${pilot_id}" }
            - { call: "POST /air-ambulance/missions/${m_id}/advance", payload: { to_state: "AT_PATIENT" }, as: FlightCrew, as_user_id: "${pilot_id}" }
            - { call: "POST /air-ambulance/missions/${m_id}/advance", payload: { to_state: "IN_TRANSIT" }, as: FlightCrew, as_user_id: "${pilot_id}" }
            - { call: "POST /air-ambulance/missions/${m_id}/advance", payload: { to_state: "AT_DESTINATION" }, as: FlightCrew, as_user_id: "${pilot_id}" }
            - { call: "POST /air-ambulance/missions/${m_id}/advance", payload: { to_state: "COMPLETED" }, as: FlightCrew, as_user_id: "${pilot_id}" }
            - { call: "POST /air-ambulance/invoices", payload: { mission_id: "${m_id}" }, as: BillingSpecialist, captures: { inv_id: "$.data.id" } }
            - { call: "POST /air-ambulance/invoices/${inv_id}/finalize", payload: { actual_loaded_miles: 0.5 }, as: BillingSpecialist }
            - { call: "POST /air-ambulance/patient-care-reports", payload: { mission_id: "${m_id}", author_crew_id: "${pilot_id}", vitals_summary: "stable", interventions_summary: "none", meds_summary: "none" }, as: FlightCrew, as_user_id: "${pilot_id}", captures: { pcr_id: "$.data.id" } }
            - { call: "POST /air-ambulance/patient-care-reports/${pcr_id}/submit", as: FlightCrew, as_user_id: "${pilot_id}" }
          trigger:
            - { call: "POST /air-ambulance/invoices/${inv_id}/submit", as: BillingSpecialist, captures: { err: "$.data.error_id" } }
            - { call: "POST /air-ambulance/patient-care-reports/${pcr_id}/qa-review", payload: { outcome: "APPROVED", deficiency_points: 0 }, as: QaReviewer, as_user_id: "qa-officer-9" }
            - { call: "POST /air-ambulance/invoices/${inv_id}/submit", as: BillingSpecialist, captures: { claim: "$.data.claim_status" } }
          assert:
            - "err == ERR_PCR_NOT_APPROVED (PCR was SUBMITTED, not QA_APPROVED)"
            - "claim == SUBMITTED after the PCR reached QA_APPROVED — the Invoice transition depends on PatientCareReport state"

      - name: international_launch_requires_ready_case
        grounds:
          - validations[priority=18]
          - state_machines.Mission.PLANNING_to_LAUNCHED
          - state_machines.RepatriationCase.COLLECTING_to_READY_TO_FLY
        distinguishing_aspect: |
          Entity pair Mission -> RepatriationCase (different pair from
          Invoice -> PatientCareReport): an INTERNATIONAL_REPATRIATION mission
          cannot launch while its documentation case sits in COLLECTING, even
          with a fresh GO assessment and an emergency override.
        test_recipe:
          setup:
            - "INTERNATIONAL_REPATRIATION request (destination_country MX) triaged with emergency_override true, accepted on a CCT_CAPABLE rotor, PLANNING; repatriation case created but no documents (COLLECTING); fresh GO assessment posted"
          setup_api_calls:
            - { call: "POST /air-ambulance/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: OpsAdmin }
            - { call: "POST /air-ambulance/bases", payload: { name: "Base Sigma", region: "SW-US" }, as: OpsAdmin, captures: { base_id: "$.data.id" } }
            - { call: "POST /air-ambulance/aircraft", payload: { base_id: "${base_id}", tail_number: "N707IN", aircraft_class: "ROTOR_WING", medical_config: "CCT_CAPABLE" }, as: OpsAdmin, captures: { ac_id: "$.data.id" } }
            - { call: "POST /air-ambulance/crew-members", payload: { base_id: "${base_id}", full_name: "Pat Pilot", crew_role: "PILOT" }, as: OpsAdmin, captures: { pilot_id: "$.data.id" } }
            - { call: "POST /air-ambulance/crew-members", payload: { base_id: "${base_id}", full_name: "Nina Nurse", crew_role: "NURSE" }, as: OpsAdmin, captures: { nurse_id: "$.data.id" } }
            - { call: "POST /air-ambulance/patients", payload: { full_name: "Rita Repat", date_of_birth: "1955-02-20", weight_kg: 68 }, as: Dispatcher, captures: { pat_id: "$.data.id" } }
            - { call: "POST /air-ambulance/mission-requests", payload: { patient_id: "${pat_id}", transport_class: "INTERNATIONAL_REPATRIATION", origin_facility: "Cancun Clinic", destination_facility: "County General", destination_country: "MX", reported_cardio: 2, reported_resp: 1, reported_neuro: 1, reported_interventions: 0, onset_iso: "2026-07-31T10:00:00Z" }, as: Dispatcher, captures: { req_id: "$.data.id" } }
            - { call: "POST /air-ambulance/mission-requests/${req_id}/triage", payload: { verified_cardio: 2, verified_resp: 1, verified_neuro: 1, verified_interventions: 0, emergency_override: true }, as: MedicalDirector }
            - { call: "POST /air-ambulance/mission-requests/${req_id}/accept", payload: { aircraft_id: "${ac_id}", crew: [{ crew_member_id: "${pilot_id}", role_in_mission: "PILOT" }, { crew_member_id: "${nurse_id}", role_in_mission: "NURSE" }], estimated_loaded_miles: 300, planned_launch_iso: "2026-08-01T08:00:00Z", planned_duration_min: 240 }, as: Dispatcher, captures: { m_id: "$.data.id", m_v: "$.data.version" } }
            - { call: "POST /air-ambulance/repatriation-cases", payload: { mission_id: "${m_id}", destination_country: "MX", receiving_facility: "County General" }, as: Dispatcher, captures: { case_id: "$.data.id" } }
            - { call: "POST /air-ambulance/weather-assessments", payload: { mission_id: "${m_id}", ceiling_ft: 1000, visibility_sm: 5.0, wind_kt: 10, precip: "NONE", day_night: "DAY", terrain: "FLAT", expected_mission_version: "${m_v}" }, as: FlightCrew, as_user_id: "${pilot_id}", captures: { d: "$.data.decision" } }
          trigger:
            - { call: "POST /air-ambulance/missions/${m_id}/advance", payload: { to_state: "LAUNCHED" }, as: Dispatcher, captures: { err: "$.data.error_id" } }
          assert:
            - "d == GO (weather gate satisfied — failure must come from the repatriation dependency)"
            - "err == ERR_REPATRIATION_NOT_READY (case is COLLECTING, not READY_TO_FLY)"
            - "Mission.${m_id}.status remains PLANNING and RepatriationCase.${case_id}.status remains COLLECTING"

      - name: accept_requires_aircraft_not_in_maintenance
        grounds:
          - validations[priority=15]
          - state_machines.Aircraft.AVAILABLE_to_MAINTENANCE
          - state_machines.MissionRequest.TRIAGED_to_ACCEPTED
        distinguishing_aspect: |
          Entity pair MissionRequest(accept) -> Aircraft (third distinct
          pair): accept is rejected with ERR_AIRCRAFT_NOT_AVAILABLE when the
          referenced tail sits in MAINTENANCE, even though the request is
          TRIAGED and the crew composition is valid.
        test_recipe:
          setup:
            - "Base with one rotor tail placed into MAINTENANCE; TRIAGED ALS request"
          setup_api_calls:
