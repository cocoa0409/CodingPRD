            - call: "POST /staff-credentials/${mgr_cred_id}/verify"
              payload: { decision: "ACCEPT" }
              as: OperatorAdmin
            - call: "POST /staff-credentials/${mgr_cred_id}/renew"
              payload: { credential_number: "AHA-772", expires_on: "2028-06-30" }
              as: OperatorAdmin
          assert:
            - "Replayed verify -> HTTP 409 AND data.error_id == \"ERR_CREDENTIAL_NOT_PENDING\""
            - "renew -> HTTP 409 AND data.error_id == \"ERR_CREDENTIAL_NOT_RENEWABLE\""
            - "StaffCredential.${mgr_cred_id}.status == \"VERIFIED\" AND credential_number == \"AHA-771\" AND expires_on == \"2027-06-30\" (unchanged)"
            - "StaffMember.${mgr_id}.duty_status == \"ACTIVE_DUTY\""

      - name: credential_cycle_returns_to_verified_after_renewal
        claim_type: cyclic
        grounds:
          - state_machines.StaffCredential.EXPIRED_to_PENDING_VERIFICATION
          - state_machine_shape.cyclic
        excluded_because:
          difficulty_instance: non_linear_state_machine / credential_expiry_renew_reverify_cycle_returns_to_verified
          rationale: "The named §1.8 instance drives PENDING -> VERIFIED -> EXPIRED -> PENDING -> VERIFIED through the daily readiness run and asserts the loop closes on the same state with a new expires_on."

      - name: member_eligibility_and_badge_dimensions_are_independent
        claim_type: parallel
        grounds:
          - state_machines.Member.eligibility_status
          - state_machines.Member.access_status
          - state_machine_shape.parallel
        excluded_because:
          difficulty_instance: non_linear_state_machine / member_eligibility_and_access_dimensions_move_independently
          rationale: "The named §1.8 instance moves eligibility_status and access_status separately and asserts each combined state, which is exactly this row's claim."

      - name: contract_suspension_cascades_to_children
        claim_type: cascade_down
        grounds:
          - state_machines.ClientContract.ACTIVE_to_SUSPENDED.side_effects
          - complexity_layers.cascading_side_effects
        excluded_because:
          difficulty_instance: transitive_cascade / contract_suspend_four_link_cascade_offering_session_assignment_ledger
          rationale: "The named §1.8 instance verifies all four cascade links end-to-end, including that terminal children are left alone."

      - name: voiding_participation_reverses_its_side_effects
