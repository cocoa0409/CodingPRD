            - { call: "POST /mro/parts-requisitions/${rq}/source-approval", payload: { approved: true }, as: PartsBuyer }
            - { call: "POST /mro/parts-requisitions/${rq}/receive", payload: { unit_cost_cents: 250000 }, as: PartsBuyer }
            - { call: "POST /mro/parts-requisitions/${rq}/issue", payload: {}, as: Technician }
            - { call: "POST /mro/work-orders/${wo}/complete-repair", payload: {}, as: Technician, as_user_id: "tech-1" }
