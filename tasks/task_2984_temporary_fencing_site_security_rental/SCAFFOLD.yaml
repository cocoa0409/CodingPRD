# =============================================================================
# SCAFFOLD.yaml — Temporary Fencing & Site Security Rental (National Construction Rentals)
# §1.0 Response Envelope · §1.1 Entities · §1.2 State Machines · §1.2.1 Concurrency
# §1.3 Calculations · §1.4 Validations · §1.5 Endpoints · §1.6 Errors · §1.7 RBAC
# =============================================================================

scenario: |
  2984. Temporary Fencing & Site Security Rental (National Construction Rentals): panel/post configuration quoting by linear foot with wind-load screen options, delivery, install and relocation labor scheduling, permit and sidewalk-closure coordination with the municipality, monthly rental billing with partial-month proration, damage, theft and missing-panel reconciliation at removal, event vs construction contract terms and cancellation windows, gate, barricade and water-barrier add-on inventory, jobsite phase moves and re-set orders

domain_name: temporary-fencing-site-security-rental
api_prefix: /fence-rentals

# -----------------------------------------------------------------------------
# §0 Complexity Profile
# -----------------------------------------------------------------------------
complexity_profile:
  difficulty_level: expert_plus            # §0.4 Expert band, deliberately denser coupling
  primary_archetype: pricing_engine
  secondary_archetype: temporal_windowing
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - rate_threshold_triggers

  entity_topology: flat
  # Peer collections under a single namespace prefix; every association is an
  # explicit FK field on the child, never a nested URL path. Two self-referential
  # FKs (WorkOrder.predecessor_work_order_id) give the fleet-order graph.

  state_machine_shape: parallel
  non_linear_shapes_present:
    - "cyclic: PermitApplication SUBMITTED -> REVISION_REQUESTED -> SUBMITTED (bounded municipal review rounds)"
    - "parallel: RentalContract lifecycle_status x billing_status evolve on the same row"
    - "branching: WorkOrder SCHEDULED -> {COMPLETED | PARTIAL | ABORTED} with divergent side-effect sets"

  relationship_patterns:
    - one_to_many          # CustomerAccount -> Jobsite -> Quote -> RentalContract -> WorkOrder/Invoice
    - self_referential     # WorkOrder.predecessor_work_order_id -> WorkOrder.id
    - cross_aggregate      # WorkOrder completion mutates FenceProduct fleet counts and CustomerAccount balance

  role_model: segregation_of_duties
  # Peer ownership across staff roles (commercial / dispatch / permitting / yard)
  # plus two hard four-eyes rules: an Invoice may not be voided by the same
  # X-User-ID that issued it, and a reconciliation may not be finalized by the
  # X-User-ID that completed the removal work order.

  consistency_model: immediate

# -----------------------------------------------------------------------------
# §1.0 Response Envelope (FIXED — verbatim)
# -----------------------------------------------------------------------------
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# -----------------------------------------------------------------------------
# §1.1 Entity-Relationship Table
# -----------------------------------------------------------------------------
entities:

  - name: Municipality
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: municipal jurisdiction display name
      - name: jurisdiction_code
        type: string
        source: input
        description: short permitting code, unique across all municipalities
        constraints: "3-12 chars, uppercase letters/digits/hyphen; unique"
      - name: permit_lead_time_days
        type: integer
        source: input
        description: minimum whole days between a permit submission and the start of its sidewalk-closure window
        constraints: ">= 0"
      - name: max_concurrent_closure_linear_feet
        type: integer
        source: input
        description: aggregate sidewalk-closure footage this jurisdiction allows to be committed by overlapping permits
        constraints: "> 0"
      - name: permit_review_rounds_allowed
        type: integer
        source: input
        default: 2
        description: how many REQUEST_REVISION rounds a permit may accumulate before resubmission is refused
        constraints: ">= 0"
      - name: rental_tax_rate_bp
        type: integer
        source: input
        description: rental tax rate in basis points, applied to every invoice subtotal
        constraints: "0..2000"
      - name: allows_solid_wind_screen
        type: boolean
        source: input
        default: true
        description: whether SOLID_130 wind-load screen is permitted in this jurisdiction
      - name: committed_closure_linear_feet
        type: integer
        source: computed
        default: 0
        description: "sum of closure_linear_feet over PermitApplication rows with municipality reached through jobsite_id whose status IN {SUBMITTED, APPROVED} and whose window satisfies closure_start_utc <= logical_clock < closure_end_utc"

  - name: CustomerAccount
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: billing legal entity name
      - name: billing_email
        type: string
        source: input
        description: invoice delivery address
      - name: credit_limit_cents
        type: integer
        source: input
        description: open-balance ceiling above which fleet dispatch is blocked
        constraints: ">= 0"
      - name: open_balance_cents
        type: integer
        source: computed
        default: 0
        description: "SUM over Invoice rows of this account with status IN {ISSUED, PARTIALLY_PAID} of (total_cents - amount_paid_cents)"
      - name: lifetime_credited_cents
        type: integer
        source: computed
        default: 0
        description: "SUM over Invoice rows of this account with status == VOID of (total_cents - amount_paid_cents_at_void)"
      - name: credit_hold_flag
        type: boolean
        source: computed
        default: false
        description: "true exactly when open_balance_cents > credit_limit_cents (strictly greater; equality does NOT hold the account)"

  - name: Jobsite
    parent: null
    common_fields: true
    fields:
      - name: customer_account_id
        type: string
        source: input
        description: "FK -> CustomerAccount.id; the account billed for every contract on this jobsite"
      - name: municipality_id
        type: string
        source: input
        description: "FK -> Municipality.id; permitting jurisdiction and tax authority for this jobsite"
      - name: site_label
        type: string
        source: input
        description: operator-facing jobsite name
      - name: address_line
        type: string
        source: input
        description: street address used on delivery tickets
      - name: site_condition
        type: enum
        source: input
        description: post-setting ground condition, drives install labor rate
        constraints: "SOIL | ASPHALT | CONCRETE"
      - name: phase_count
        type: integer
        source: input
        default: 1
        description: number of construction phases the fence line may be re-set through
        constraints: ">= 1"
      - name: requires_sidewalk_closure
        type: boolean
        source: input
        default: false
        description: whether fence work on this jobsite occupies public sidewalk and therefore requires an APPROVED permit before dispatch

  - name: FenceProduct
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: catalog code referenced by quote lines, unique across products
        constraints: "3-16 chars; unique"
      - name: category
        type: enum
        source: input
        description: fleet family; FENCE_PANEL is priced by linear foot, all others are priced per unit as add-ons
        constraints: "FENCE_PANEL | GATE | BARRICADE | WATER_BARRIER"
      - name: description
        type: string
        source: input
        description: human-readable catalog description
      - name: panel_length_ft
        type: integer
        source: input
        description: nominal panel length; required when category == FENCE_PANEL, must be null otherwise
        constraints: "> 0 when category == FENCE_PANEL, else null"
      - name: unit_monthly_rate_cents
        type: integer
        source: input
        description: per-unit monthly rental rate used for add-on quote lines; MUST be 0 when category == FENCE_PANEL
        constraints: ">= 0"
      - name: replacement_cost_cents_per_unit
        type: integer
        source: input
        description: new-unit replacement cost used by the removal loss assessment
        constraints: "> 0"
      - name: fleet_age_months
        type: integer
        source: input
        description: age of this product's fleet batch in whole months, drives the depreciated-value loss variant
        constraints: ">= 0"
      - name: wind_load_rating_mph
        type: integer
        source: input
        description: certified wind-load rating; null for products with no rating
        constraints: "> 0 or null"
      - name: owned_count
        type: integer
        source: input
        description: total units the fleet owns; the conserved quantity for this product
        constraints: "> 0"
      - name: available_count
        type: integer
        source: computed
        description: units in the yard and assignable; initialized to owned_count at creation
      - name: reserved_count
        type: integer
        source: computed
        default: 0
        description: units held for SCHEDULED delivery/install work orders but not yet on a jobsite
      - name: deployed_count
        type: integer
        source: computed
        default: 0
        description: units standing on a jobsite under an ACTIVE or DEMOBILIZING contract
      - name: damaged_count
        type: integer
        source: computed
        default: 0
        description: units returned damaged and taken out of service by a finalized reconciliation
      - name: lost_count
        type: integer
        source: computed
        default: 0
        description: units never returned (theft or missing) per a finalized reconciliation

  - name: Crew
    parent: null
    common_fields: true
    fields:
      - name: crew_code
        type: string
        source: input
        description: dispatch identifier, unique across crews
        constraints: "3-16 chars; unique"
      - name: depot_code
        type: string
        source: input
        description: home yard code
      - name: daily_capacity_hours
        type: number
        source: input
        description: labor hours this crew may hold across SCHEDULED work orders on any single UTC calendar date
        constraints: "> 0, one decimal place"
      - name: certified_for_solid_screen
        type: boolean
        source: input
        default: false
        description: whether this crew may install SOLID_130 wind-load screen

  - name: Quote
    parent: null
    common_fields: true
    fields:
      - name: jobsite_id
        type: string
        source: input
        description: "FK -> Jobsite.id; the jobsite this configuration prices"
      - name: contract_type
        type: enum
        source: input
        description: commercial terms family; selects surge vs term discount, proration variant, and cancellation notice window
        constraints: "EVENT | CONSTRUCTION"
      - name: linear_feet
        type: integer
        source: input
        description: total fence line ordered, in whole feet; drives tier rate selection
        constraints: "> 0"
      - name: panel_product_code
        type: string
        source: input
        description: FenceProduct.code of the FENCE_PANEL product supplying the fence line
      - name: wind_screen
        type: enum
        source: input
        default: NONE
        description: wind-load screen option applied to the whole fence line
        constraints: "NONE | MESH_70 | SOLID_130"
      - name: term_months
        type: integer
        source: input
        description: committed rental term in whole months; EVENT requires exactly 1, CONSTRUCTION requires >= 3
        constraints: ">= 1"
      - name: addon_lines
        type: array
        source: input
        default: []
        description: "add-on request lines, each { product_code: string, quantity: integer > 0 }; product_code must resolve to a FenceProduct whose category != FENCE_PANEL"
      - name: accepted_by_name
        type: string
        source: input
        default: null
        description: name the customer contact signed the acceptance under; supplied only on POST /quotes/{id}/accept and null until then
      - name: status
        type: enum
        source: system
        default: DRAFT
        description: quote lifecycle state
        constraints: "DRAFT | ISSUED | ACCEPTED | CONVERTED | SUPERSEDED | EXPIRED"
      - name: panel_unit_count
        type: integer
        source: computed
        description: "ceil(linear_feet / FenceProduct.panel_length_ft) for panel_product_code"
      - name: tier_rate_cents_per_ft
        type: integer
        source: computed
        description: linear-foot tier rate selected by calculations.quote_pricing step S1
      - name: monthly_recurring_cents
        type: integer
        source: computed
        description: post-surge / post-term-discount monthly rental (panels + screen + add-ons)
      - name: install_labor_cents
        type: integer
        source: computed
        description: one-time post-setting labor including the mobilization minimum
      - name: permit_handling_fee_cents
        type: integer
        source: computed
        description: permit coordination fee, waived when monthly_recurring_cents >= PERMIT_FEE_WAIVER_THRESHOLD_CENTS
      - name: one_time_cents
        type: integer
        source: computed
        description: install_labor_cents + DELIVERY_FEE_CENTS + permit_handling_fee_cents
      - name: priced_lines
        type: array
        source: computed
        description: "per-line breakdown, each { line_type: PANEL_RENTAL|WIND_SCREEN|ADDON_RENTAL, product_code: string|null, quantity: integer, amount_cents: integer }"
      - name: issued_at_utc
        type: datetime
        source: system
        description: logical-clock instant the quote was issued; null while DRAFT
      - name: valid_through_utc
        type: datetime
        source: computed
        description: issued_at_utc + QUOTE_VALIDITY_DAYS; null while DRAFT

  - name: PermitApplication
    parent: null
    common_fields: true
    fields:
      - name: jobsite_id
        type: string
        source: input
        description: "FK -> Jobsite.id; the jobsite whose sidewalk this permit closes"
      - name: closure_linear_feet
        type: integer
        source: input
        description: sidewalk footage this permit occupies against the municipal corridor allowance
        constraints: "> 0"
      - name: closure_start_utc
        type: datetime
        source: input
        description: inclusive start of the closure window
      - name: closure_end_utc
        type: datetime
        source: input
        description: exclusive end of the closure window; windows are half-open [start, end)
      - name: sidewalk_closure_type
        type: enum
        source: input
        description: physical closure pattern requested from the municipality
        constraints: "FULL | PARTIAL | LANE_SHIFT"
      - name: status
        type: enum
        source: system
        default: DRAFT
        description: permit lifecycle state
        constraints: "DRAFT | SUBMITTED | REVISION_REQUESTED | APPROVED | DENIED | CLOSED"
      - name: revision_round
        type: integer
        source: system
        default: 0
        description: count of REQUEST_REVISION decisions recorded against this permit
      - name: submitted_at_utc
        type: datetime
        source: system
        description: logical-clock instant of the most recent submission; null while DRAFT
      - name: decided_at_utc
        type: datetime
        source: system
        description: logical-clock instant of the most recent municipal decision; null before the first decision
      - name: reviewer_note
        type: string
        source: input
        description: free-text municipal reviewer note recorded with a decision; null when never supplied
      - name: required_change_summary
        type: string
        source: input
        description: change the municipality demands before resubmission; null unless the last decision was REQUEST_REVISION

  - name: RentalContract
    parent: null
    common_fields: true
    fields:
      - name: quote_id
        type: string
        source: input
        description: "FK -> Quote.id; the ACCEPTED quote this contract converts"
      - name: customer_account_id
        type: string
        source: system
        description: "FK -> CustomerAccount.id; copied from the quote's jobsite at creation"
      - name: jobsite_id
        type: string
        source: system
        description: "FK -> Jobsite.id; copied from the quote at creation"
      - name: pinned_quote_version
        type: integer
        source: system
        description: Quote.version observed at conversion; the contract's commercial terms are frozen against this version
      - name: contract_type
        type: enum
        source: system
        description: copied from the quote; selects proration variant and cancellation notice window
        constraints: "EVENT | CONSTRUCTION"
      - name: monthly_recurring_cents
        type: integer
        source: system
        description: copied from Quote.monthly_recurring_cents at conversion
      - name: install_labor_cents
        type: integer
        source: system
        description: copied from Quote.install_labor_cents at conversion
      - name: one_time_cents
        type: integer
        source: system
        description: copied from Quote.one_time_cents at conversion
      - name: ordered_linear_feet
        type: integer
        source: system
        description: copied from Quote.linear_feet at conversion
      - name: deployed_linear_feet
        type: integer
        source: computed
        default: 0
        description: sum of completed_linear_feet over this contract's DELIVERY_INSTALL work orders with status IN {COMPLETED, PARTIAL}
      - name: fleet_commitments
        type: array
        source: computed
        description: "units this contract owes the yard, each { product_code: string, unit_count: integer }; panel line = Quote.panel_unit_count, one entry per addon line"
      - name: addons_deployed
        type: boolean
        source: computed
        default: false
        description: true once the contract's first DELIVERY_INSTALL work order has reached COMPLETED or PARTIAL and add-on units have moved available -> deployed
      - name: lifecycle_status
        type: enum
        source: system
        default: PENDING_MOBILIZATION
        description: mobilization dimension of the contract's parallel state
        constraints: "PENDING_MOBILIZATION | ACTIVE | DEMOBILIZING | CLOSED | CANCELLED"
      - name: billing_status
        type: enum
        source: system
        default: NOT_BILLED
        description: money dimension of the contract's parallel state, independent of lifecycle_status
        constraints: "NOT_BILLED | CURRENT | PAST_DUE | SETTLED"
      - name: billing_anchor_utc
        type: datetime
        source: system
        description: logical-clock instant the first install work order reached COMPLETED or PARTIAL; start of the first billable period
      - name: billed_through_utc
        type: datetime
        source: system
        description: exclusive end of the last billed period; null until the first periodic invoice
      - name: cancellation_fee_cents
        type: integer
        source: computed
        default: 0
        description: fee assessed by calculations.cancellation_fee when the contract was cancelled; 0 otherwise
      - name: current_phase
        type: integer
        source: system
        default: 1
        description: jobsite phase the fence line currently occupies; advanced by a completed RESET work order
      - name: terms_acknowledged_by
        type: string
        source: input
        description: name of the person who acknowledged the EVENT/CONSTRUCTION terms at conversion

  - name: WorkOrder
    parent: null
    common_fields: true
    fields:
      - name: contract_id
        type: string
        source: input
        description: "FK -> RentalContract.id; the contract this labor visit serves"
      - name: crew_id
        type: string
        source: input
        description: "FK -> Crew.id; assigned at dispatch, null while PLANNED"
      - name: predecessor_work_order_id
        type: string
        source: system
        description: "FK -> WorkOrder.id; the order this one supersedes or continues, null for independent orders"
      - name: predecessor_relation
        type: enum
        source: system
        description: how this order relates to predecessor_work_order_id; null when predecessor_work_order_id is null
        constraints: "SUPERSEDES | REMAINDER_OF"
      - name: work_order_type
        type: enum
        source: input
        description: labor visit family; drives productivity rate, reservation behavior and permit gating
        constraints: "DELIVERY_INSTALL | RELOCATION | REMOVAL | RESET"
      - name: ordered_linear_feet
        type: integer
        source: input
        description: fence footage this visit handles
        constraints: "> 0 and <= RentalContract.ordered_linear_feet"
      - name: phase_from
        type: integer
        source: input
        description: jobsite phase the fence line leaves; required for RESET, null otherwise
      - name: phase_to
        type: integer
        source: input
        description: jobsite phase the fence line moves to; required for RESET, null otherwise
      - name: scheduled_start_utc
        type: datetime
        source: input
        description: crew arrival instant
      - name: estimated_labor_hours
        type: number
        source: computed
        description: output of calculations.crew_labor_hours, in quarter-hour steps
      - name: scheduled_end_utc
        type: datetime
        source: computed
        description: scheduled_start_utc + estimated_labor_hours
      - name: status
        type: enum
        source: system
        default: PLANNED
        description: work-order lifecycle state
        constraints: "PLANNED | SCHEDULED | COMPLETED | PARTIAL | ABORTED | CANCELLED | SUPERSEDED"
      - name: completed_linear_feet
        type: integer
        source: system
        default: 0
        description: footage actually handled; equals ordered_linear_feet on COMPLETED, strictly less on PARTIAL
      - name: reserved_unit_counts
        type: array
        source: computed
        description: "units held by this order while SCHEDULED, each { product_code: string, unit_count: integer }; empty for RELOCATION, RESET and REMOVAL"
      - name: completed_by_user_id
        type: string
        source: system
        description: X-User-ID that recorded completion; null until COMPLETED or PARTIAL
      - name: abort_reason_code
        type: string
        source: input
        description: reason recorded on ABORTED; null otherwise
      - name: cancel_reason_code
        type: string
        source: input
        description: reason recorded on CANCELLED; null otherwise

  - name: Invoice
    parent: null
    common_fields: true
    fields:
      - name: contract_id
        type: string
        source: input
        description: "FK -> RentalContract.id; the billed contract"
      - name: invoice_kind
        type: enum
        source: system
        description: what generated this invoice
        constraints: "MOBILIZATION | PERIODIC | CANCELLATION | FINAL"
      - name: period_start_utc
        type: datetime
        source: system
        description: inclusive start of the billed period; null on MOBILIZATION, CANCELLATION and FINAL invoices
      - name: period_end_utc
        type: datetime
        source: system
        description: exclusive end of the billed period; null on MOBILIZATION, CANCELLATION and FINAL invoices
      - name: billable_days
        type: integer
        source: computed
        default: 0
        description: "floor((period_end_utc - period_start_utc) / 86400 seconds); 0 on non-PERIODIC invoices"
      - name: lines
        type: array
        source: computed
        description: "invoice lines, each { line_type: INSTALL_LABOR|DELIVERY|PERMIT_HANDLING|RENTAL|CANCELLATION_FEE|LOSS|DAMAGE, product_code: string|null, quantity: integer, amount_cents: integer }"
      - name: subtotal_cents
        type: integer
        source: computed
        description: sum of already-rounded lines[].amount_cents
      - name: tax_cents
        type: integer
        source: computed
        description: rental tax on subtotal_cents at the jobsite municipality's rental_tax_rate_bp
      - name: late_fee_cents
        type: integer
        source: computed
        default: 0
        description: late fee on subtotal_cents when the contract's billing_status is PAST_DUE at issuance
      - name: total_cents
        type: integer
        source: computed
        description: subtotal_cents + tax_cents + late_fee_cents
      - name: amount_paid_cents
        type: integer
        source: computed
        default: 0
        description: cash allocated to this invoice by payments
      - name: status
        type: enum
        source: system
        default: ISSUED
        description: invoice settlement state
        constraints: "ISSUED | PARTIALLY_PAID | PAID | VOID"
      - name: issued_at_utc
        type: datetime
        source: system
        description: logical-clock instant of issuance
      - name: due_at_utc
        type: datetime
        source: computed
        description: issued_at_utc + NET_TERMS_DAYS
      - name: issued_by_user_id
        type: string
        source: system
        description: X-User-ID credited with issuing this invoice; the four-eyes counterparty for voiding
      - name: void_reason_code
        type: string
        source: input
        description: reason recorded on VOID; null otherwise

  - name: RemovalReconciliation
    parent: null
    common_fields: true
    fields:
      - name: contract_id
        type: string
        source: system
        description: "FK -> RentalContract.id; the demobilizing contract being reconciled"
      - name: work_order_id
        type: string
        source: system
        description: "FK -> WorkOrder.id; the REMOVAL work order whose completion opened this reconciliation"
      - name: deployed_snapshot
        type: array
        source: system
        description: "units the yard expects back, each { product_code: string, unit_count: integer }; panels = ceil(RentalContract.deployed_linear_feet / panel_length_ft), add-on entries present only when RentalContract.addons_deployed is true"
      - name: unit_returns
        type: array
        source: input
        default: []
        description: "yard count at finalization, each { product_code: string, returned: integer, damaged: integer, missing: integer }"
      - name: theft_police_report_number
        type: string
        source: input
        description: police report reference for missing units; null when no report was filed
      - name: assessment_variant
        type: enum
        source: computed
        description: loss variant selected by calculations.reconciliation_loss_assessment; null while OPEN
        constraints: "REPLACEMENT_COST | DEPRECIATED_VALUE"
      - name: loss_charge_cents
        type: integer
        source: computed
        default: 0
        description: charge for missing units under the selected variant
      - name: damage_charge_cents
        type: integer
        source: computed
        default: 0
        description: charge for damaged units, always at undepreciated replacement cost x DAMAGE_CHARGE_PCT
      - name: status
        type: enum
        source: system
        default: OPEN
        description: reconciliation state
        constraints: "OPEN | FINALIZED"
      - name: finalized_by_user_id
        type: string
        source: system
        description: X-User-ID that finalized; null while OPEN
      - name: auditor_note
        type: string
        source: input
        description: free-text yard note; null when not supplied

# -----------------------------------------------------------------------------
# §1.2 State Machine Table
# Each transition carries a transition_id used verbatim by §1.8/§1.9 grounds refs
# as state_machines.<Entity>.<transition_id>.
# -----------------------------------------------------------------------------
state_machines:

  - entity: Quote
    initial_state: DRAFT
    terminal_states: [CONVERTED, SUPERSEDED, EXPIRED]
    transitions:
      - transition_id: DRAFT_to_ISSUED
        from: DRAFT
        to: ISSUED
        trigger: "POST /fence-rentals/quotes/{id}/issue"
        actor: AccountManager
        preconditions:
          - "Quote.status == DRAFT"
        side_effects:
          - "sets issued_at_utc = logical clock"
          - "sets valid_through_utc = issued_at_utc + QUOTE_VALIDITY_DAYS (14 days)"
          - "increments Quote.version by 1"
      - transition_id: ISSUED_to_ACCEPTED
        from: ISSUED
        to: ACCEPTED
        trigger: "POST /fence-rentals/quotes/{id}/accept"
        actor: CustomerContact
        preconditions:
          - "Quote.status == ISSUED"
          - "logical clock <= Quote.valid_through_utc"
          - "X-User-ID == Jobsite.customer_account_id of the quote's jobsite_id"
        side_effects:
          - "records Quote.accepted_by_name from the request body when supplied, leaving it null otherwise"
          - "increments Quote.version by 1"
      - transition_id: ACCEPTED_to_CONVERTED
        from: ACCEPTED
        to: CONVERTED
        trigger: "POST /fence-rentals/contracts"
        actor: AccountManager
        preconditions:
          - "Quote.status == ACCEPTED"
        side_effects:
          - "creates RentalContract with lifecycle_status PENDING_MOBILIZATION and billing_status NOT_BILLED"
          - "copies contract_type, monthly_recurring_cents, install_labor_cents, one_time_cents, linear_feet -> ordered_linear_feet onto the contract"
          - "sets RentalContract.pinned_quote_version = Quote.version observed at conversion (version-pinning)"
          - "derives RentalContract.fleet_commitments from Quote.panel_unit_count and Quote.addon_lines"
          - "increments Quote.version by 1"
      - transition_id: DRAFT_to_SUPERSEDED
        from: DRAFT
        to: SUPERSEDED
        trigger: "POST /fence-rentals/jobsites/{id}/quotes (a newer quote is created on the same jobsite)"
        actor: AccountManager
        preconditions:
          - "Quote.status == DRAFT"
          - "Quote.jobsite_id == the jobsite receiving the new quote"
        side_effects:
          - "increments Quote.version by 1"
        note: "Conditional cascade: only DRAFT and ISSUED quotes on that jobsite are touched; CONVERTED/EXPIRED/SUPERSEDED quotes are left alone."
      - transition_id: ISSUED_to_SUPERSEDED
        from: ISSUED
        to: SUPERSEDED
        trigger: "POST /fence-rentals/jobsites/{id}/quotes (a newer quote is created on the same jobsite)"
        actor: AccountManager
        preconditions:
          - "Quote.status == ISSUED"
          - "logical clock <= Quote.valid_through_utc"
        side_effects:
          - "increments Quote.version by 1"
      - transition_id: ISSUED_to_EXPIRED
        from: ISSUED
        to: EXPIRED
        trigger: "POST /fence-rentals/jobsites/{id}/quotes (a newer quote is created on the same jobsite)"
        actor: system
        preconditions:
          - "Quote.status == ISSUED"
          - "logical clock > Quote.valid_through_utc"
        side_effects:
          - "increments Quote.version by 1"
        note: "Validity is evaluated against the logical clock at the moment a new quote supersedes the jobsite's open quotes; an elapsed quote lands in EXPIRED rather than SUPERSEDED."

  - entity: PermitApplication
    initial_state: DRAFT
    terminal_states: [DENIED, CLOSED]
    transitions:
      - transition_id: DRAFT_to_SUBMITTED
        from: DRAFT
        to: SUBMITTED
        trigger: "POST /fence-rentals/permits/{id}/submit"
        actor: MunicipalLiaison
        preconditions:
          - "PermitApplication.status == DRAFT"
          - "closure_start_utc >= logical clock + Municipality.permit_lead_time_days x 86400 seconds"
          - "calculations.closure_corridor_utilization admits closure_linear_feet for the requested window"
        side_effects:
          - "sets submitted_at_utc = logical clock"
          - "recomputes Municipality.committed_closure_linear_feet"
          - "increments PermitApplication.version by 1"
      - transition_id: REVISION_REQUESTED_to_SUBMITTED
        from: REVISION_REQUESTED
        to: SUBMITTED
        trigger: "POST /fence-rentals/permits/{id}/submit (resubmission after a municipal revision request)"
        actor: MunicipalLiaison
        preconditions:
          - "PermitApplication.status == REVISION_REQUESTED"
          - "PermitApplication.revision_round <= Municipality.permit_review_rounds_allowed"
          - "closure_start_utc (after applying any supplied window overrides) >= logical clock + Municipality.permit_lead_time_days x 86400 seconds"
          - "calculations.closure_corridor_utilization admits the revised footage and window"
        side_effects:
          - "applies supplied closure_linear_feet / closure_start_utc / closure_end_utc overrides"
          - "sets submitted_at_utc = logical clock"
          - "clears required_change_summary to null"
          - "recomputes Municipality.committed_closure_linear_feet"
          - "increments PermitApplication.version by 1"
        note: "This edge closes the cycle SUBMITTED -> REVISION_REQUESTED -> SUBMITTED; the loop is bounded by revision_round vs Municipality.permit_review_rounds_allowed."
      - transition_id: SUBMITTED_to_APPROVED
        from: SUBMITTED
        to: APPROVED
        trigger: "POST /fence-rentals/permits/{id}/municipal-decision with decision == APPROVE"
        actor: MunicipalLiaison
        preconditions:
          - "PermitApplication.status == SUBMITTED"
        side_effects:
          - "sets decided_at_utc = logical clock"
          - "stores reviewer_note when supplied"
          - "recomputes Municipality.committed_closure_linear_feet"
          - "increments PermitApplication.version by 1"
      - transition_id: SUBMITTED_to_REVISION_REQUESTED
        from: SUBMITTED
        to: REVISION_REQUESTED
        trigger: "POST /fence-rentals/permits/{id}/municipal-decision with decision == REQUEST_REVISION"
        actor: MunicipalLiaison
        preconditions:
          - "PermitApplication.status == SUBMITTED"
        side_effects:
          - "increments revision_round by 1"
          - "stores required_change_summary and reviewer_note when supplied"
          - "sets decided_at_utc = logical clock"
          - "recomputes Municipality.committed_closure_linear_feet (a REVISION_REQUESTED permit no longer holds corridor footage)"
          - "increments PermitApplication.version by 1"
      - transition_id: SUBMITTED_to_DENIED
        from: SUBMITTED
        to: DENIED
        trigger: "POST /fence-rentals/permits/{id}/municipal-decision with decision == DENY"
        actor: MunicipalLiaison
        preconditions:
          - "PermitApplication.status == SUBMITTED"
        side_effects:
          - "sets decided_at_utc = logical clock"
          - "recomputes Municipality.committed_closure_linear_feet"
          - "increments PermitApplication.version by 1"
      - transition_id: APPROVED_to_CLOSED
        from: APPROVED
        to: CLOSED
        trigger: "system: RentalContract on the same jobsite_id enters DEMOBILIZING"
        actor: system
        preconditions:
          - "PermitApplication.status == APPROVED"
          - "PermitApplication.jobsite_id == RentalContract.jobsite_id of the demobilizing contract"
        side_effects:
          - "recomputes Municipality.committed_closure_linear_feet, releasing this permit's closure_linear_feet"
          - "increments PermitApplication.version by 1"
        note: "Hop 3 of the removal cascade; caused by the contract's DEMOBILIZING transition, not directly by the removal work order."

  - entity: RentalContract
    initial_state: PENDING_MOBILIZATION
    terminal_states: [CLOSED, CANCELLED]
    note: |
      Parallel dimensions on one row. lifecycle_status tracks mobilization
      (PENDING_MOBILIZATION -> ACTIVE -> DEMOBILIZING -> CLOSED, or -> CANCELLED)
      while billing_status tracks money (NOT_BILLED -> CURRENT <-> PAST_DUE ->
      SETTLED). The two advance independently: a contract may be ACTIVE+PAST_DUE
      or DEMOBILIZING+CURRENT. Only the CLOSED edge reads the other dimension.
    transitions:
      - transition_id: PENDING_MOBILIZATION_to_ACTIVE
        from: PENDING_MOBILIZATION
        to: ACTIVE
        trigger: "system: the contract's first DELIVERY_INSTALL WorkOrder reaches COMPLETED or PARTIAL"
        actor: system
        preconditions:
          - "RentalContract.lifecycle_status == PENDING_MOBILIZATION"
        side_effects:
          - "sets billing_anchor_utc = logical clock"
          - "recomputes deployed_linear_feet from the install work order's completed_linear_feet"
          - "sets addons_deployed = true and moves each add-on commitment available_count -> deployed_count on FenceProduct"
          - "hop 3 of the mobilization cascade: because the contract became ACTIVE, a MOBILIZATION Invoice is issued with lines INSTALL_LABOR, DELIVERY and (when non-zero) PERMIT_HANDLING"
          - "increments RentalContract.version by 1"
      - transition_id: ACTIVE_to_DEMOBILIZING
        from: ACTIVE
        to: DEMOBILIZING
        trigger: "system: a REMOVAL WorkOrder on this contract reaches COMPLETED"
        actor: system
        preconditions:
          - "RentalContract.lifecycle_status == ACTIVE"
        side_effects:
          - "hop 2 of the removal cascade: creates a RemovalReconciliation in OPEN with deployed_snapshot taken from deployed_linear_feet and fleet_commitments"
          - "hop 3 of the removal cascade: because the contract entered DEMOBILIZING, every PermitApplication with this jobsite_id and status == APPROVED transitions to CLOSED"
          - "increments RentalContract.version by 1"
      - transition_id: DEMOBILIZING_to_CLOSED
        from: DEMOBILIZING
        to: CLOSED
        trigger: "system: billing_status becomes SETTLED while lifecycle_status == DEMOBILIZING"
        actor: system
        preconditions:
          - "RentalContract.lifecycle_status == DEMOBILIZING"
          - "RentalContract.billing_status == SETTLED"
          - "the contract's RemovalReconciliation has status == FINALIZED"
        side_effects:
          - "increments RentalContract.version by 1"
      - transition_id: PENDING_MOBILIZATION_to_CANCELLED
        from: PENDING_MOBILIZATION
        to: CANCELLED
        trigger: "POST /fence-rentals/contracts/{id}/cancel"
        actor: AccountManager
        preconditions:
          - "RentalContract.lifecycle_status == PENDING_MOBILIZATION"
        side_effects:
          - "computes cancellation_fee_cents via calculations.cancellation_fee"
          - "every WorkOrder on this contract with status IN {PLANNED, SCHEDULED} transitions to CANCELLED, releasing reserved_unit_counts back to FenceProduct.available_count"
          - "when cancellation_fee_cents > 0 a CANCELLATION Invoice is issued with a single CANCELLATION_FEE line"
          - "increments RentalContract.version by 1"
      - transition_id: billing_NOT_BILLED_to_CURRENT
        from: "billing_status == NOT_BILLED"
        to: "billing_status == CURRENT"
        trigger: "system: the first Invoice for this contract is issued (MOBILIZATION, PERIODIC, CANCELLATION or FINAL)"
        actor: system
        preconditions:
          - "RentalContract.billing_status == NOT_BILLED"
        side_effects:
          - "hop 4 of the mobilization cascade: because the invoice was issued, CustomerAccount.open_balance_cents is recomputed upward by the invoice total_cents"
          - "increments RentalContract.version by 1"
      - transition_id: billing_CURRENT_to_PAST_DUE
        from: "billing_status == CURRENT"
        to: "billing_status == PAST_DUE"
        trigger: "system: re-evaluated at the start of POST /fence-rentals/contracts/{id}/billing-runs and at POST /fence-rentals/accounts/{id}/payments"
        actor: system
        preconditions:
          - "at least one Invoice of this contract has status IN {ISSUED, PARTIALLY_PAID} and due_at_utc <= logical clock"
        side_effects:
          - "any PERIODIC invoice issued while billing_status == PAST_DUE carries late_fee_cents per calculations.invoice_total_rollup"
          - "increments RentalContract.version by 1"
      - transition_id: billing_PAST_DUE_to_CURRENT
        from: "billing_status == PAST_DUE"
        to: "billing_status == CURRENT"
        trigger: "POST /fence-rentals/accounts/{id}/payments"
        actor: AccountManager
        preconditions:
          - "no Invoice of this contract has status IN {ISSUED, PARTIALLY_PAID} with due_at_utc <= logical clock"
          - "at least one Invoice of this contract still has status IN {ISSUED, PARTIALLY_PAID}"
        side_effects:
          - "increments RentalContract.version by 1"
      - transition_id: billing_SETTLED_to_CURRENT
        from: "billing_status == SETTLED"
        to: "billing_status == CURRENT"
        trigger: "system: a new Invoice is issued for a contract whose ledger had been fully settled or voided"
        actor: system
        preconditions:
          - "RentalContract.billing_status == SETTLED"
          - "RentalContract.lifecycle_status != CLOSED"
        side_effects:
          - "CustomerAccount.open_balance_cents rises by the new invoice's total_cents"
          - "increments RentalContract.version by 1"
        note: "SETTLED is not terminal in the billing dimension: a contract whose only invoice was voided settles, then re-opens when the next period is billed. lifecycle_status is untouched by this edge."

      - transition_id: billing_to_SETTLED
        from: "billing_status IN {CURRENT, PAST_DUE}"
        to: "billing_status == SETTLED"
        trigger: "POST /fence-rentals/accounts/{id}/payments or POST /fence-rentals/invoices/{id}/void"
        actor: AccountManager
        preconditions:
          - "every Invoice of this contract has status IN {PAID, VOID}"
        side_effects:
          - "when lifecycle_status == DEMOBILIZING and the contract's RemovalReconciliation is FINALIZED, cascades lifecycle_status DEMOBILIZING -> CLOSED"
          - "increments RentalContract.version by 1"

  - entity: WorkOrder
    initial_state: PLANNED
    terminal_states: [COMPLETED, PARTIAL, ABORTED, CANCELLED, SUPERSEDED]
    transitions:
      - transition_id: PLANNED_to_SCHEDULED
        from: PLANNED
        to: SCHEDULED
        trigger: "POST /fence-rentals/work-orders/{id}/dispatch"
        actor: DispatchCoordinator
        preconditions:
          - "WorkOrder.status == PLANNED"
          - "the referenced Crew exists"
          - "when Jobsite.requires_sidewalk_closure is true and work_order_type IN {DELIVERY_INSTALL, RELOCATION, RESET}: a PermitApplication exists for the contract's jobsite_id with status == APPROVED whose [closure_start_utc, closure_end_utc) contains both scheduled_start_utc and scheduled_end_utc"
          - "when Quote.wind_screen == SOLID_130: Crew.certified_for_solid_screen is true"
          - "calculations.crew_labor_hours output does not collide with another SCHEDULED WorkOrder of the same crew per validations priority 15"
          - "the crew's committed hours for the scheduled UTC date plus estimated_labor_hours <= Crew.daily_capacity_hours"
          - "when work_order_type == DELIVERY_INSTALL: FenceProduct.available_count for the panel product >= ceil(ordered_linear_feet / panel_length_ft)"
          - "CustomerAccount.credit_hold_flag is false"
        side_effects:
          - "sets crew_id"
          - "when work_order_type == DELIVERY_INSTALL: sets reserved_unit_counts = [{ panel product, ceil(ordered_linear_feet / panel_length_ft) }] and moves that many units FenceProduct.available_count -> reserved_count"
          - "for RELOCATION, RESET and REMOVAL: reserved_unit_counts stays empty (the panels are already deployed on the jobsite)"
          - "increments WorkOrder.version by 1"
      - transition_id: SCHEDULED_to_COMPLETED_install
        from: SCHEDULED
        to: COMPLETED
        trigger: "POST /fence-rentals/work-orders/{id}/complete with completed_linear_feet == ordered_linear_feet on a DELIVERY_INSTALL order"
        actor: DispatchCoordinator
        preconditions:
          - "WorkOrder.status == SCHEDULED"
          - "work_order_type == DELIVERY_INSTALL"
          - "completed_linear_feet == ordered_linear_feet"
        side_effects:
          - "sets completed_linear_feet and completed_by_user_id = X-User-ID"
          - "hop 1 of the mobilization cascade: moves every reserved_unit_counts entry FenceProduct.reserved_count -> deployed_count"
          - "hop 2 of the mobilization cascade: because this order reached COMPLETED, the contract transitions PENDING_MOBILIZATION -> ACTIVE (see RentalContract.PENDING_MOBILIZATION_to_ACTIVE), which itself issues the MOBILIZATION invoice, which itself lifts CustomerAccount.open_balance_cents, which itself may raise credit_hold_flag"
          - "increments WorkOrder.version by 1"
      - transition_id: SCHEDULED_to_PARTIAL_install
        from: SCHEDULED
        to: PARTIAL
        trigger: "POST /fence-rentals/work-orders/{id}/complete with 0 < completed_linear_feet < ordered_linear_feet on a DELIVERY_INSTALL order"
        actor: DispatchCoordinator
        preconditions:
          - "WorkOrder.status == SCHEDULED"
          - "work_order_type == DELIVERY_INSTALL"
          - "0 < completed_linear_feet < ordered_linear_feet"
        side_effects:
          - "sets completed_linear_feet and completed_by_user_id = X-User-ID"
          - "moves ceil(completed_linear_feet / panel_length_ft) units FenceProduct.reserved_count -> deployed_count and returns the untouched remainder reserved_count -> available_count"
          - "creates a follow-up WorkOrder in PLANNED with the same work_order_type, ordered_linear_feet = ordered_linear_feet - completed_linear_feet, predecessor_work_order_id = this order and predecessor_relation = REMAINDER_OF"
          - "transitions the contract PENDING_MOBILIZATION -> ACTIVE exactly as the COMPLETED branch does"
          - "increments WorkOrder.version by 1"
        note: "Divergence from the COMPLETED branch: a remainder order is created and the unused reservation is released. The ABORTED branch does neither and leaves the contract in PENDING_MOBILIZATION."
      - transition_id: SCHEDULED_to_COMPLETED_removal
        from: SCHEDULED
        to: COMPLETED
        trigger: "POST /fence-rentals/work-orders/{id}/complete with completed_linear_feet == ordered_linear_feet on a REMOVAL order"
        actor: DispatchCoordinator
        preconditions:
          - "WorkOrder.status == SCHEDULED"
          - "work_order_type == REMOVAL"
          - "completed_linear_feet == ordered_linear_feet"
          - "RentalContract.lifecycle_status == ACTIVE"
        side_effects:
          - "sets completed_linear_feet and completed_by_user_id = X-User-ID"
          - "hop 1 of the removal cascade: because this order reached COMPLETED, the contract transitions ACTIVE -> DEMOBILIZING (see RentalContract.ACTIVE_to_DEMOBILIZING), which itself opens the RemovalReconciliation and closes the jobsite's APPROVED permits, which itself releases the municipality's committed corridor footage"
          - "units stay in FenceProduct.deployed_count until the reconciliation is finalized"
          - "increments WorkOrder.version by 1"
      - transition_id: SCHEDULED_to_COMPLETED_reset
        from: SCHEDULED
        to: COMPLETED
        trigger: "POST /fence-rentals/work-orders/{id}/complete with completed_linear_feet == ordered_linear_feet on a RESET or RELOCATION order"
        actor: DispatchCoordinator
        preconditions:
          - "WorkOrder.status == SCHEDULED"
          - "work_order_type IN {RESET, RELOCATION}"
          - "completed_linear_feet == ordered_linear_feet"
          - "RentalContract.lifecycle_status == ACTIVE"
        side_effects:
          - "sets completed_linear_feet and completed_by_user_id = X-User-ID"
          - "when work_order_type == RESET: sets RentalContract.current_phase = phase_to"
          - "fleet counts are unchanged (the panels move within the jobsite)"
          - "increments WorkOrder.version by 1"
      - transition_id: SCHEDULED_to_ABORTED
        from: SCHEDULED
        to: ABORTED
        trigger: "POST /fence-rentals/work-orders/{id}/abort"
        actor: DispatchCoordinator
        preconditions:
          - "WorkOrder.status == SCHEDULED"
        side_effects:
          - "stores abort_reason_code"
          - "releases every reserved_unit_counts entry FenceProduct.reserved_count -> available_count and empties reserved_unit_counts"
          - "clears crew_id to null, freeing the crew's window and daily hours"
          - "leaves RentalContract.lifecycle_status and billing_status untouched and issues no invoice"
          - "increments WorkOrder.version by 1"
      - transition_id: PLANNED_to_CANCELLED
        from: PLANNED
        to: CANCELLED
        trigger: "POST /fence-rentals/work-orders/{id}/cancel or cascade from RentalContract.PENDING_MOBILIZATION_to_CANCELLED"
        actor: DispatchCoordinator
        preconditions:
          - "WorkOrder.status == PLANNED"
        side_effects:
          - "stores cancel_reason_code"
          - "increments WorkOrder.version by 1"
      - transition_id: SCHEDULED_to_CANCELLED
        from: SCHEDULED
        to: CANCELLED
        trigger: "POST /fence-rentals/work-orders/{id}/cancel or cascade from RentalContract.PENDING_MOBILIZATION_to_CANCELLED"
        actor: DispatchCoordinator
        preconditions:
          - "WorkOrder.status == SCHEDULED"
        side_effects:
          - "stores cancel_reason_code"
          - "releases every reserved_unit_counts entry FenceProduct.reserved_count -> available_count and empties reserved_unit_counts"
          - "clears crew_id to null"
          - "increments WorkOrder.version by 1"
        note: "Compensating action for PLANNED_to_SCHEDULED; the pair must leave FenceProduct.available_count exactly where it started."
      - transition_id: PLANNED_to_SUPERSEDED
        from: PLANNED
        to: SUPERSEDED
        trigger: "POST /fence-rentals/contracts/{id}/reset-orders (a newer re-set order is accepted for the same contract)"
        actor: system
        preconditions:
          - "WorkOrder.status == PLANNED"
          - "WorkOrder.work_order_type == RESET"
          - "WorkOrder.contract_id == the contract receiving the new re-set order"
        side_effects:
          - "increments WorkOrder.version by 1"
      - transition_id: SCHEDULED_to_SUPERSEDED
        from: SCHEDULED
        to: SUPERSEDED
        trigger: "POST /fence-rentals/contracts/{id}/reset-orders (a newer re-set order is accepted for the same contract)"
        actor: system
        preconditions:
          - "WorkOrder.status == SCHEDULED"
          - "WorkOrder.work_order_type == RESET"
        side_effects:
          - "clears crew_id to null, freeing the superseded order's crew window and daily hours"
          - "increments WorkOrder.version by 1"

  - entity: Invoice
    initial_state: ISSUED
    terminal_states: [PAID, VOID]
    transitions:
      - transition_id: ISSUED_to_PARTIALLY_PAID
        from: ISSUED
        to: PARTIALLY_PAID
        trigger: "POST /fence-rentals/accounts/{id}/payments (allocation covers part of this invoice)"
        actor: AccountManager
        preconditions:
          - "Invoice.status == ISSUED"
          - "0 < allocated amount < total_cents - amount_paid_cents"
        side_effects:
          - "increases amount_paid_cents by the allocated amount"
          - "recomputes CustomerAccount.open_balance_cents and credit_hold_flag"
          - "increments Invoice.version by 1"
      - transition_id: ISSUED_to_PAID
        from: ISSUED
        to: PAID
        trigger: "POST /fence-rentals/accounts/{id}/payments (allocation covers the full open amount)"
        actor: AccountManager
        preconditions:
          - "Invoice.status == ISSUED"
          - "allocated amount == total_cents - amount_paid_cents"
        side_effects:
          - "sets amount_paid_cents = total_cents"
          - "recomputes CustomerAccount.open_balance_cents and credit_hold_flag"
          - "re-evaluates RentalContract.billing_status (-> CURRENT or SETTLED)"
          - "increments Invoice.version by 1"
      - transition_id: PARTIALLY_PAID_to_PAID
        from: PARTIALLY_PAID
        to: PAID
        trigger: "POST /fence-rentals/accounts/{id}/payments (allocation clears the remainder)"
        actor: AccountManager
        preconditions:
          - "Invoice.status == PARTIALLY_PAID"
          - "allocated amount == total_cents - amount_paid_cents"
        side_effects:
          - "sets amount_paid_cents = total_cents"
          - "recomputes CustomerAccount.open_balance_cents and credit_hold_flag"
          - "re-evaluates RentalContract.billing_status"
          - "increments Invoice.version by 1"
      - transition_id: ISSUED_to_VOID
        from: ISSUED
        to: VOID
        trigger: "POST /fence-rentals/invoices/{id}/void"
        actor: AccountManager
        preconditions:
          - "Invoice.status IN {ISSUED, PARTIALLY_PAID}"
          - "X-User-ID != Invoice.issued_by_user_id"
        side_effects:
          - "stores void_reason_code"
          - "decreases CustomerAccount.open_balance_cents by exactly (total_cents - amount_paid_cents) and increases lifetime_credited_cents by the same amount"
          - "re-evaluates CustomerAccount.credit_hold_flag and RentalContract.billing_status"
          - "increments Invoice.version by 1"
        note: "Compensating action for invoice issuance; the pair must leave CustomerAccount.open_balance_cents exactly where it started."
      - transition_id: PARTIALLY_PAID_to_VOID
        from: PARTIALLY_PAID
        to: VOID
        trigger: "POST /fence-rentals/invoices/{id}/void"
        actor: AccountManager
        preconditions:
          - "Invoice.status == PARTIALLY_PAID"
          - "X-User-ID != Invoice.issued_by_user_id"
        side_effects:
          - "stores void_reason_code"
          - "decreases CustomerAccount.open_balance_cents by exactly (total_cents - amount_paid_cents); already-collected cash is not refunded"
          - "increases lifetime_credited_cents by the same amount"
          - "increments Invoice.version by 1"

  - entity: RemovalReconciliation
    initial_state: OPEN
    terminal_states: [FINALIZED]
    transitions:
      - transition_id: OPEN_to_FINALIZED
        from: OPEN
        to: FINALIZED
        trigger: "POST /fence-rentals/reconciliations/{id}/finalize"
        actor: YardAuditor
        preconditions:
          - "RemovalReconciliation.status == OPEN"
          - "unit_returns covers exactly the product codes in deployed_snapshot"
          - "for every entry: returned + damaged + missing == the matching deployed_snapshot unit_count"
          - "X-User-ID != WorkOrder.completed_by_user_id of work_order_id"
        side_effects:
          - "selects assessment_variant and computes loss_charge_cents / damage_charge_cents via calculations.reconciliation_loss_assessment"
          - "hop 1 of the reconciliation cascade: because the reconciliation was finalized, each product's counts move FenceProduct.deployed_count -> available_count (returned), -> damaged_count (damaged) and -> lost_count (missing)"
          - "hop 2 of the reconciliation cascade: because damaged_count / lost_count moved, a FINAL Invoice is issued carrying a LOSS line and a DAMAGE line whenever loss_charge_cents + damage_charge_cents > 0; when the sum is 0 no invoice is created at all"
          - "hop 3 of the reconciliation cascade: because the FINAL invoice was issued, CustomerAccount.open_balance_cents rises by its total_cents and credit_hold_flag is re-evaluated"
          - "sets finalized_by_user_id = X-User-ID"
          - "increments RemovalReconciliation.version by 1"

# -----------------------------------------------------------------------------
# §1.2.1 Concurrency Rules — OCC on the parent's `version` only
# -----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: quote-create-stale-jobsite
    parent_entity: Jobsite
    write_endpoint: "POST /fence-rentals/jobsites/{id}/quotes"
    occ_field: "expected_jobsite_version"
    description: |
      Creating a Quote against a Jobsite whose version has advanced since the
      client last observed it is rejected. A new quote legitimately supersedes
      the jobsite's DRAFT and still-valid ISSUED quotes (and expires the elapsed
      ones), so a writer holding a stale view of the jobsite would silently
      discard a configuration it never saw; the stale-version check forces it to
      re-read the jobsite first.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: reset-order-create-stale-contract
    parent_entity: RentalContract
    write_endpoint: "POST /fence-rentals/contracts/{id}/reset-orders"
    occ_field: "expected_contract_version"
    description: |
      Creating a re-set order against a RentalContract whose version has
      advanced since the client last observed it is rejected. A new re-set order
      legitimately supersedes the contract's PLANNED or SCHEDULED RESET order, so
      a writer working from a stale contract view would cancel a phase move it
      never saw and re-plan against an out-of-date current_phase.
    error_id: ERR_STALE_VERSION
    http_status: 412

# -----------------------------------------------------------------------------
# §1.3 Calculation Rules
# Every monetary result is an integer number of cents produced with
# round_half_up (Python Decimal + ROUND_HALF_UP). No float accumulation:
# each named step below is evaluated, rounded where the step says "round_half_up",
# and the rounded integer is what the next step consumes.
# -----------------------------------------------------------------------------
calculations:

  - name: quote_pricing
    algorithm_type: tiered_pricing
    trigger: "POST /fence-rentals/jobsites/{id}/quotes"
    description: |
      Prices a panel/post configuration by linear foot. Five independent inputs
      each select a different factor and all five land in one formula:
      linear_feet picks the footage tier, wind_screen picks BOTH a multiplicative
      factor and an additive per-foot adder, contract_type picks the recurring
      adjustment family, term_months picks the discount inside the CONSTRUCTION
      family, site_condition picks the labor rate per foot, and the add-on mix
      contributes both recurring rent and per-unit install labor.
    inputs:
      - "Quote.linear_feet"
      - "Quote.wind_screen"
      - "Quote.contract_type"
      - "Quote.term_months"
      - "Jobsite.site_condition"
      - "Quote.addon_lines[] -> FenceProduct.unit_monthly_rate_cents"
      - "FenceProduct.panel_length_ft of the panel product"
    formula: |
      S1  tier_rate_cents_per_ft = PANEL_TIER_RATE_CENTS_PER_FT applied as a FLAT
          rate on the TOTAL footage (not marginal): the whole run is priced at the
          rate of the band linear_feet falls in.
            linear_feet <=  250 -> 62
            linear_feet <=  500 -> 54
            linear_feet <= 1000 -> 47
            linear_feet >  1000 -> 41
      S2  panel_base_cents = linear_feet * tier_rate_cents_per_ft
      S3  screened_panel_cents = round_half_up(panel_base_cents * SCREEN_FACTOR[wind_screen])
      S4  screen_adder_cents = linear_feet * SCREEN_ADDER_CENTS_PER_FT[wind_screen]
      S5  addon_monthly_cents = SUM over addon_lines of
            (quantity * FenceProduct.unit_monthly_rate_cents of the referenced product)
      S6  pre_adjustment_monthly_cents =
            screened_panel_cents + screen_adder_cents + addon_monthly_cents
      S7  adjustment_factor =
            contract_type == EVENT        -> EVENT_SURGE_FACTOR (1.25)
            contract_type == CONSTRUCTION -> 1 - TERM_DISCOUNT_RATE where
              term_months >= 12 -> 0.14
              term_months >=  6 -> 0.08
              otherwise         -> 0.00
          (term_months never discounts an EVENT quote; the surge is unconditional.)
      S8  monthly_recurring_cents =
            round_half_up(pre_adjustment_monthly_cents * adjustment_factor)
      S9  install_labor_cents = max(
            MOBILIZATION_MINIMUM_CENTS,
            linear_feet * CONDITION_LABOR_CENTS_PER_FT[Jobsite.site_condition]
              + ADDON_INSTALL_LABOR_CENTS * addon_unit_count )
      S10 permit_handling_fee_cents =
            0 when monthly_recurring_cents >= PERMIT_FEE_WAIVER_THRESHOLD_CENTS
            PERMIT_HANDLING_FEE_CENTS otherwise
          EVALUATION ORDER IS LOAD-BEARING: the waiver test reads the S8
          POST-adjustment figure, never the S6 pre-adjustment subtotal. A quote
          whose pre_adjustment_monthly_cents clears the threshold but whose
          discounted monthly_recurring_cents falls back under it still pays the
          handling fee.
      S11 one_time_cents = install_labor_cents + DELIVERY_FEE_CENTS
                           + permit_handling_fee_cents
      S12 panel_unit_count = ceil(linear_feet / FenceProduct.panel_length_ft)
      S13 addon_unit_count = SUM of quantity over addon_lines
      S14 valid_through_utc is NOT set here; it is set at issue time
          (state_machines.Quote.DRAFT_to_ISSUED).
    constants:
      PANEL_TIER_RATE_CENTS_PER_FT: { "250": 62, "500": 54, "1000": 47, "above": 41 }
      SCREEN_FACTOR: { NONE: 1.00, MESH_70: 1.15, SOLID_130: 1.35 }
      SCREEN_ADDER_CENTS_PER_FT: { NONE: 0, MESH_70: 12, SOLID_130: 26 }
      CONDITION_LABOR_CENTS_PER_FT: { SOIL: 95, ASPHALT: 140, CONCRETE: 210 }
      MOBILIZATION_MINIMUM_CENTS: 35000
      ADDON_INSTALL_LABOR_CENTS: 2500
      EVENT_SURGE_FACTOR: 1.25
      TERM_DISCOUNT_RATE: { "12": 0.14, "6": 0.08, "below": 0.00 }
      DELIVERY_FEE_CENTS: 18500
      PERMIT_HANDLING_FEE_CENTS: 12500
      PERMIT_FEE_WAIVER_THRESHOLD_CENTS: 150000
    precision: "integer cents; round_half_up at S3 and S8 only. S2, S4, S5, S6, S9, S11 are exact integer arithmetic."
    worked_example: |
      linear_feet 500, wind_screen MESH_70, CONSTRUCTION, term_months 12,
      site_condition SOIL, addons GATE_12 x2 (4500/unit) + WATER_BARRIER_6 x4 (2200/unit):
        S1 54 -> S2 27000 -> S3 31050 -> S4 6000 -> S5 17800 -> S6 54850
        S7 0.86 -> S8 47171
        S9 max(35000, 500*95 + 2500*6) = max(35000, 62500) = 62500
        S10 47171 < 150000 -> 12500
        S11 62500 + 18500 + 12500 = 93500
        S12 ceil(500/10) = 50   S13 6

  - name: invoice_period_charge
    algorithm_type: threshold
    trigger: "POST /fence-rentals/contracts/{id}/billing-runs"
    description: |
      Turns one billing window into a single RENTAL line. Partial months prorate,
      but the two contract families prorate by genuinely different arithmetic, not
      by a different constant.
    inputs:
      - "RentalContract.contract_type"
      - "RentalContract.monthly_recurring_cents"
      - "period_start_utc, period_end_utc from the billing-run request body"
    variants:
      - variant_id: event_daily_proration
        applies_when: "RentalContract.contract_type == EVENT"
        formula: |
          E1 raw_days = whole days in the half-open window
             [period_start_utc, period_end_utc)
          E2 billable_days = max(MINIMUM_EVENT_BILLABLE_DAYS, raw_days)
          E3 daily_rate_cents = round_half_up(monthly_recurring_cents / DAYS_PER_RENTAL_MONTH)
          E4 rental_cents = daily_rate_cents * billable_days
          The daily rate is rounded to whole cents FIRST and the rounded rate is
          then multiplied by the day count. Multiplying first and rounding once at
          the end is a different number.
      - variant_id: construction_cycle_proration
        applies_when: "RentalContract.contract_type == CONSTRUCTION"
        formula: |
          C1 raw_days = whole days in [period_start_utc, period_end_utc)
          C2 full_cycles = floor(raw_days / BILLING_CYCLE_DAYS)
          C3 remainder_days = raw_days - full_cycles * BILLING_CYCLE_DAYS
          C4 rental_cents = full_cycles * monthly_recurring_cents
               + round_half_up(monthly_recurring_cents * remainder_days / BILLING_CYCLE_DAYS)
          There is no minimum day floor and no daily rate: whole 28-day cycles bill
          at the full monthly figure and only the remainder is prorated, multiplying
          first and rounding once.
    variant_selection: "RentalContract.contract_type, copied from the converted Quote. Never overridable on the billing-run request."
    constants:
      DAYS_PER_RENTAL_MONTH: 30
      BILLING_CYCLE_DAYS: 28
      MINIMUM_EVENT_BILLABLE_DAYS: 3
    precision: "integer cents; round_half_up once per variant (E3 for EVENT, the remainder term of C4 for CONSTRUCTION)."
    worked_example: |
      Same monthly_recurring_cents 60000, same 17-day window:
        EVENT        -> daily 2000, 2000 * 17            = 34000
        CONSTRUCTION -> 0 cycles, round_half_up(60000*17/28) = 36429
      Same monthly 60000 over a 31-day window, CONSTRUCTION:
        1 full cycle 60000 + round_half_up(60000*3/28) 6429 = 66429

  - name: invoice_total_rollup
    algorithm_type: aggregation
    trigger: "every Invoice issuance: mobilization, billing-run, cancellation, reconciliation FINAL"
    description: |
      Rolls invoice lines into the money on the face of the invoice. The order of
      rounding vs summing vs taxing is pinned, and the late fee deliberately sits
      OUTSIDE the taxable base.
    inputs:
      - "Invoice.lines[].amount_cents"
      - "Municipality.rental_tax_rate_bp reached through Jobsite.municipality_id"
      - "RentalContract.billing_status observed at the START of the operation"
      - "the account's open amount on invoices already past due"
    formula: |
      R1 every line amount_cents is already an integer produced by its own
         calculation (quote_pricing, invoice_period_charge,
         reconciliation_loss_assessment, cancellation_fee)
      R2 subtotal_cents = SUM of line amount_cents (exact integer sum)
      R3 tax_cents = round_half_up(subtotal_cents * rental_tax_rate_bp / 10000)
         Tax is computed on the ROUNDED subtotal, once, never per line.
      R4 late_fee_cents =
           round_half_up(past_due_open_cents * LATE_FEE_RATE)
             when RentalContract.billing_status == PAST_DUE at the start of the
             operation AND the invoice being issued is a PERIODIC invoice;
           0 otherwise.
         past_due_open_cents = SUM over the contract's invoices with status IN
           {ISSUED, PARTIALLY_PAID} and due_at_utc <= logical clock of
           (total_cents - amount_paid_cents), measured BEFORE this invoice exists.
      R5 total_cents = subtotal_cents + tax_cents + late_fee_cents
         The late fee is NOT part of the taxable base: it is added after R3.
      R6 due_at_utc = issued_at_utc + NET_TERMS_DAYS
      R7 amount_paid_cents starts at 0
    constants:
      LATE_FEE_RATE: 0.015
      NET_TERMS_DAYS: 30
      TAX_BASIS_POINTS_DENOMINATOR: 10000
    precision: "integer cents; round_half_up at R3 and R4 only."
    worked_example: |
      Mobilization invoice, lines INSTALL_LABOR 62500 + DELIVERY 18500
      + PERMIT_HANDLING 12500, rental_tax_rate_bp 890, billing_status NOT_BILLED:
        R2 93500  R3 round_half_up(93500*890/10000) = 8322  R4 0  R5 101822
      Periodic invoice, RENTAL 66429, same tax rate, billing_status PAST_DUE with
      66429 already past due:
        R2 66429  R3 5912  R4 round_half_up(66429*0.015) = 996  R5 73337

  - name: reconciliation_loss_assessment
    algorithm_type: threshold
    trigger: "POST /fence-rentals/reconciliations/{id}/finalize"
    description: |
      Prices missing (stolen) and damaged panels/add-ons at removal. Theft is
      assessed by one of two variants; damage is always assessed the same way, so
      a single reconciliation exercises both a variant-selected term and a
      variant-invariant term.
    inputs:
      - "RemovalReconciliation.unit_returns[] (returned, damaged, missing per product_code)"
      - "FenceProduct.replacement_cost_cents_per_unit"
      - "FenceProduct.fleet_age_months"
      - "RemovalReconciliation.theft_police_report_number"
      - "RentalContract.contract_type"
    variants:
      - variant_id: replacement_cost
        applies_when: "theft_police_report_number is null OR RentalContract.contract_type == EVENT"
        formula: |
          A1 loss_charge_cents = SUM over unit_returns of
               (missing * FenceProduct.replacement_cost_cents_per_unit)
          Full undepreciated replacement value: no police report means the operator
          carries no insurance recovery, and EVENT contracts are excluded from the
          depreciation concession by contract terms.
      - variant_id: depreciated_value
        applies_when: "theft_police_report_number is present AND RentalContract.contract_type == CONSTRUCTION"
        formula: |
          B1 gross_loss_cents = SUM over unit_returns of
               (missing * FenceProduct.replacement_cost_cents_per_unit)
          B2 depreciation_factor per product = max(
               DEPRECIATION_FLOOR_PCT,
               1 - DEPRECIATION_PCT_PER_MONTH * FenceProduct.fleet_age_months )
          B3 loss_charge_cents = SUM over unit_returns of round_half_up(
               missing * replacement_cost_cents_per_unit * depreciation_factor )
          The floor is per product, so an old panel line stops depreciating at 40%
          while a young line in the same reconciliation is still on the curve.
      - variant_id: damage_charge_invariant
        applies_when: "always, in both variants above"
        formula: |
          D1 damage_charge_cents = SUM over unit_returns of round_half_up(
               damaged * replacement_cost_cents_per_unit * DAMAGE_CHARGE_PCT )
          Damage is never depreciated and never depends on the police report.
    variant_selection: "presence of theft_police_report_number AND RentalContract.contract_type; both conditions must hold for depreciated_value."
    constants:
      DAMAGE_CHARGE_PCT: 0.35
      DEPRECIATION_PCT_PER_MONTH: 0.02
      DEPRECIATION_FLOOR_PCT: 0.40
    precision: "integer cents; round_half_up per product line at B3 and D1, then exact integer summation."
    worked_example: |
      50 deployed panels, replacement_cost_cents_per_unit 24000, fleet_age_months 18,
      5 missing, 2 damaged, CONSTRUCTION contract:
        replacement_cost  -> loss 5*24000 = 120000
        depreciated_value -> factor max(0.40, 1-0.36) = 0.64,
                             loss round_half_up(120000*0.64) = 76800
        damage (both)     -> round_half_up(2*24000*0.35) = 16800
      FINAL invoice subtotals: 136800 (replacement) vs 93600 (depreciated).

  - name: crew_labor_hours
    algorithm_type: threshold
    trigger: "POST /fence-rentals/work-orders/{id}/dispatch"
    description: |
      Estimates how long a crew is consumed by one order. The productivity rate
      depends on the order type, add-on handling only burdens the two order types
      that physically touch inventory, and the result is quantised upward.
    inputs:
      - "WorkOrder.ordered_linear_feet"
      - "WorkOrder.work_order_type"
      - "RentalContract.fleet_commitments -> total add-on unit count"
    formula: |
      H1 productivity_ft_per_hour = TYPE_PRODUCTIVITY_FT_PER_HOUR[work_order_type]
           DELIVERY_INSTALL -> 120
           RELOCATION       ->  80
           REMOVAL          -> 200
           RESET            ->  90
      H2 base_hours = ordered_linear_feet / productivity_ft_per_hour  (exact rational)
      H3 addon_hours = ADDON_HANDLING_HOURS_PER_UNIT * addon_unit_count
           applied ONLY when work_order_type IN {DELIVERY_INSTALL, REMOVAL};
           RELOCATION and RESET move already-deployed add-ons in place and add 0.
      H4 raw_hours = base_hours + addon_hours
      H5 quantised_hours = ceil_to_quarter(raw_hours)   # smallest multiple of 0.25 >= raw_hours
      H6 estimated_labor_hours = max(MINIMUM_BILLABLE_LABOR_HOURS, quantised_hours)
      H7 scheduled_end_utc = scheduled_start_utc + estimated_labor_hours
      H8 crew_blocked_until_utc = scheduled_end_utc + CREW_TRAVEL_BUFFER_MINUTES
         (the buffer extends only the TRAILING edge of the interval, never the
         leading edge)
    constants:
      TYPE_PRODUCTIVITY_FT_PER_HOUR: { DELIVERY_INSTALL: 120, RELOCATION: 80, REMOVAL: 200, RESET: 90 }
      ADDON_HANDLING_HOURS_PER_UNIT: 0.25
      MINIMUM_BILLABLE_LABOR_HOURS: 2.0
      QUARTER_HOUR: 0.25
      CREW_TRAVEL_BUFFER_MINUTES: 90
    precision: "hours as a decimal with 2 fractional digits, always a multiple of 0.25; ceil (never round) at H5."
    worked_example: |
      500 ft DELIVERY_INSTALL with 6 add-on units:
        H2 4.1666.. + H3 1.50 = 5.6666.. -> H5 5.75 -> H6 5.75
        start 08:00 -> end 13:45 -> blocked_until 15:15
      250 ft REMOVAL with 0 add-on units:
        H2 1.25 -> H5 1.25 -> H6 max(2.0, 1.25) = 2.00
      200 ft RESET: 2.2222.. -> 2.25 (no add-on burden even though add-ons exist)

  - name: closure_corridor_utilization
    algorithm_type: aggregation
    trigger: "POST /fence-rentals/permits/{id}/submit"
    description: |
      A municipality caps how much sidewalk-closure footage may be committed at
      any instant. Each permit is individually legal; only the overlapping
      collective can breach the cap.
    inputs:
      - "PermitApplication.closure_linear_feet, closure_start_utc, closure_end_utc of the candidate"
      - "sibling PermitApplication rows whose jobsite_id resolves to the same municipality_id"
      - "Municipality.max_concurrent_closure_linear_feet"
    formula: |
      U1 candidate window = [closure_start_utc, closure_end_utc)  (half-open)
      U2 contending set = PermitApplication rows where
           resolved municipality_id == the candidate's municipality_id
           AND id != candidate id
           AND status IN {SUBMITTED, APPROVED}
           AND their [closure_start_utc, closure_end_utc) INTERSECTS the candidate
               window, where intersection means
               other.closure_start_utc < candidate.closure_end_utc
               AND candidate.closure_start_utc < other.closure_end_utc
           (a window that starts exactly when another ends does NOT intersect)
      U3 committed_linear_feet = SUM of closure_linear_feet over the contending set
      U4 projected = committed_linear_feet + candidate.closure_linear_feet
      U5 admitted when projected <= Municipality.max_concurrent_closure_linear_feet;
         refused with ERR_CLOSURE_CAPACITY_EXCEEDED when projected exceeds it
         strictly. Equality is admitted.
      U6 Municipality.committed_closure_linear_feet is the same aggregate evaluated
         against the logical clock instead of a candidate window: the sum over
         SUBMITTED/APPROVED rows whose window contains the clock.
      Rows in DRAFT, REVISION_REQUESTED, DENIED and CLOSED hold no footage.
    constants: {}
    precision: "integer linear feet; no rounding."
    worked_example: |
      max_concurrent_closure_linear_feet 800.
      P-1 300 ft over [2026-08-10, 2026-08-20) APPROVED.
      P-2 600 ft over [2026-08-15, 2026-08-25): contending 300, projected 900 > 800 -> refused.
      P-3 600 ft over [2026-08-20, 2026-08-30): P-1 ends exactly at the start, no
        intersection, contending 0, projected 600 <= 800 -> admitted.

  - name: cancellation_fee
    algorithm_type: threshold
    trigger: "POST /fence-rentals/contracts/{id}/cancel"
    description: |
      Event and construction contracts carry different cancellation windows and
      different penalty arithmetic. The notice clock runs from the logical clock to
      the scheduled start of the contract's FIRST install order.
    inputs:
      - "RentalContract.contract_type"
      - "RentalContract.monthly_recurring_cents"
      - "RentalContract.install_labor_cents"
      - "the contract's first DELIVERY_INSTALL WorkOrder scheduled_start_utc"
      - "logical clock"
    formula: |
      F1 reference order = the contract's WorkOrder rows with
           work_order_type == DELIVERY_INSTALL AND status IN {PLANNED, SCHEDULED},
         ordered by scheduled_start_utc ASC (rows with a null scheduled_start_utc
         sort last), then created_at ASC, then id ASC; take the first row.
      F2 when no such row exists, or the chosen row has a null scheduled_start_utc,
         cancellation_fee_cents = 0 (nothing was ever committed to a crew).
      F3 notice_seconds = scheduled_start_utc - logical clock (may be negative)
      F4 free_notice_hours = FREE_CANCELLATION_NOTICE_HOURS[contract_type]
           EVENT        ->  72
           CONSTRUCTION -> 168
      F5 when notice_seconds >= free_notice_hours * 3600 ->
           cancellation_fee_cents = 0 (the boundary itself is free)
      F6 otherwise
           EVENT        -> round_half_up(monthly_recurring_cents * 0.50)
                             + install_labor_cents
           CONSTRUCTION -> round_half_up(monthly_recurring_cents * 0.25)
                             + MOBILIZATION_MINIMUM_CENTS
         EVENT forfeits the actual install labor it had committed; CONSTRUCTION
         forfeits a flat mobilization minimum regardless of what its labor was.
    constants:
      FREE_CANCELLATION_NOTICE_HOURS: { EVENT: 72, CONSTRUCTION: 168 }
      EVENT_CANCELLATION_PCT: 0.50
      CONSTRUCTION_CANCELLATION_PCT: 0.25
      MOBILIZATION_MINIMUM_CENTS: 35000
    precision: "integer cents; round_half_up on the percentage term only."
    worked_example: |
      EVENT contract, monthly_recurring_cents 60000, install_labor_cents 48750,
      install scheduled 71 hours after the logical clock:
        F5 71 < 72 -> F6 round_half_up(30000) + 48750 = 78750
      At exactly 72 hours of notice the fee is 0 and no CANCELLATION invoice exists.

  - name: account_exposure
    algorithm_type: waterfall_allocation
    trigger: "POST /fence-rentals/accounts/{id}/payments, every Invoice issuance, POST /fence-rentals/invoices/{id}/void"
    description: |
      Keeps the account's open balance and credit hold in step with the invoice
      ledger, and allocates an incoming payment across open invoices oldest-due
      first.
    inputs:
      - "Invoice rows of the account (status, total_cents, amount_paid_cents, due_at_utc, created_at)"
      - "CustomerAccount.credit_limit_cents"
      - "payment amount_cents"
    formula: |
      W1 allocation order = the account's Invoice rows with status IN
         {ISSUED, PARTIALLY_PAID}, ordered by due_at_utc ASC, then created_at ASC,
         then id ASC.
      W2 walk the ordered list carrying remaining = amount_cents; each invoice
         absorbs applied = min(remaining, total_cents - amount_paid_cents);
         amount_paid_cents += applied; remaining -= applied. An invoice reaching
         amount_paid_cents == total_cents becomes PAID; one that absorbed a
         non-zero amount but is not full becomes PARTIALLY_PAID. The first bucket
         fills completely before the second receives anything.
      W3 when remaining > 0 after the whole list, the payment is refused in full
         with ERR_PAYMENT_EXCEEDS_BALANCE and NOTHING is applied: no invoice is
         mutated, no partial allocation is retained.
      W4 open_balance_cents = SUM over Invoice rows with status IN
         {ISSUED, PARTIALLY_PAID} of (total_cents - amount_paid_cents)
      W5 credit_hold_flag = open_balance_cents > credit_limit_cents
         STRICTLY greater; an account sitting exactly on its limit is not held.
      W6 voiding an invoice reduces open_balance_cents by exactly
         (total_cents - amount_paid_cents) at the moment of the void and adds the
         same amount to lifetime_credited_cents. Cash already collected is not
         refunded, so a void never moves amount_paid_cents.
      W7 W4 and W5 are re-evaluated inside the same request as every issuance,
         payment and void; the response body of that request already shows the new
         open_balance_cents and credit_hold_flag.
    constants: {}
    precision: "integer cents; exact integer arithmetic, no rounding anywhere in the waterfall."
    worked_example: |
      credit_limit_cents 100000, two open invoices A total 101822 due 08-31 and
      B total 31189 due 09-05, open_balance_cents 133011 -> credit_hold_flag true.
      A payment of 101822 fills A completely (PAID) and leaves B untouched
      (still ISSUED), open_balance_cents 31189 -> credit_hold_flag false.
      A payment of 133012 is refused with ERR_PAYMENT_EXCEEDS_BALANCE and both
      invoices keep amount_paid_cents 0.

# -----------------------------------------------------------------------------
# §1.4 Validation Rules — evaluated in strict ascending `priority` order.
# The FIRST rule whose condition is violated determines the response; no later
# rule is evaluated. Every endpoint runs the whole ladder from priority 1.
# -----------------------------------------------------------------------------
validations:

  - priority: 1
    category: authentication
    rule: "X-User-ID and X-User-Role headers must both be present and non-empty. A header supplied as an empty string counts as absent."
    applies_to: "every endpoint except POST /_clock/set_current_utc"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401

  - priority: 2
    category: authorization
    rule: "X-User-Role must be one of the roles listed in the endpoint's allowed_roles. The role string is matched exactly and case-sensitively; an unrecognised role value is a role failure, not a shape failure."
    applies_to: "every endpoint except POST /_clock/set_current_utc"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403

  - priority: 3
    category: request_integrity
    rule: |
      Request shape: every required input field present; every field of the
      declared JSON type (integers sent as JSON numbers, money and counts as
      integers, never strings); every enum field one of its declared members;
      linear_feet, addon_lines[].quantity, term_months, closure_linear_feet, amount_cents,
      credit_limit_cents, replacement_cost_cents_per_unit, unit_monthly_rate_cents,
      daily_capacity_hours all strictly positive where declared "> 0" and
      non-negative where declared ">= 0"; every instant a valid ISO-8601 UTC
      timestamp ending in Z; every window satisfying end > start; pagination
      limit within 1..100 and offset >= 0; no unknown fields; and on
      POST /work-orders/{id}/complete, 0 < completed_linear_feet <=
      the path order's ordered_linear_feet.
    applies_to: "every endpoint with a request body or query string"
    error_id: ERR_VALIDATION
    http_status: 400

  - priority: 4
    category: existence
    rule: "Every {id} path segment must resolve to a stored entity of the expected type."
    applies_to: "every endpoint with a path parameter"
    error_id: "ERR_MUNICIPALITY_NOT_FOUND | ERR_ACCOUNT_NOT_FOUND | ERR_JOBSITE_NOT_FOUND | ERR_PRODUCT_NOT_FOUND | ERR_QUOTE_NOT_FOUND | ERR_PERMIT_NOT_FOUND | ERR_CONTRACT_NOT_FOUND | ERR_WORK_ORDER_NOT_FOUND | ERR_INVOICE_NOT_FOUND | ERR_RECONCILIATION_NOT_FOUND"
    http_status: 404

  - priority: 5
    category: existence
    rule: "Every foreign key supplied in a request body or query string must resolve to a stored entity of the referenced type: customer_account_id, municipality_id, jobsite_id, quote_id, contract_id, crew_id, panel_product_code, addon_lines[].product_code, unit_returns[].product_code."
    applies_to: "POST /jobsites, POST /jobsites/{id}/quotes, POST /permits, POST /contracts, POST /contracts/{id}/work-orders, POST /contracts/{id}/reset-orders, POST /work-orders/{id}/dispatch, POST /reconciliations/{id}/finalize, every filtered list endpoint"
    error_id: "the NOT_FOUND error of the referenced entity type (see priority 4)"
    http_status: 404

  - priority: 6
    category: ownership
    rule: "A CustomerContact may only read and act on rows that resolve to its own CustomerAccount: X-User-ID must equal the CustomerAccount.id reached through Jobsite.customer_account_id (for jobsites and quotes) or RentalContract.customer_account_id (for contracts, work orders, invoices and reconciliations). Staff roles are unscoped."
    applies_to: "every GET endpoint and POST /quotes/{id}/accept"
    error_id: ERR_ACCOUNT_SCOPE_VIOLATION
    http_status: 403

  - priority: 7
    category: authorization
    rule: |
      Segregation of duties, keyed on X-User-ID:
        - POST /invoices/{id}/void is refused when X-User-ID == Invoice.issued_by_user_id
        - POST /reconciliations/{id}/finalize is refused when X-User-ID ==
          WorkOrder.completed_by_user_id of the reconciliation's work_order_id
      Holding the correct role is not sufficient; the acting user must be a
      different person from the one who created the artefact being reversed or
      certified.
    applies_to: "POST /invoices/{id}/void, POST /reconciliations/{id}/finalize"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403

  - priority: 8
    category: concurrency
    rule: "When the endpoint declares an OCC field (§1.2.1), the supplied expected_<parent>_version must equal the parent's current version. Checked before any state or business rule so a stale writer never learns why its write would otherwise have failed."
    applies_to: "POST /jobsites/{id}/quotes, POST /contracts/{id}/reset-orders"
    error_id: ERR_STALE_VERSION
    http_status: 412

  - priority: 9
    category: state
    rule: "The path entity's current state must be in the from-set of the transition the endpoint triggers (§1.2). Includes terminal-state lockdown and second-attempt idempotency failures."
    applies_to: "POST /quotes/{id}/issue, POST /quotes/{id}/accept, POST /permits/{id}/submit, POST /permits/{id}/municipal-decision, POST /contracts, POST /contracts/{id}/work-orders, POST /contracts/{id}/reset-orders, POST /contracts/{id}/cancel, POST /contracts/{id}/billing-runs, POST /work-orders/{id}/dispatch, POST /work-orders/{id}/complete, POST /work-orders/{id}/abort, POST /work-orders/{id}/cancel, POST /invoices/{id}/void, POST /reconciliations/{id}/finalize"
    error_id: "ERR_QUOTE_STATE | ERR_PERMIT_STATE | ERR_CONTRACT_STATE | ERR_WORK_ORDER_STATE | ERR_INVOICE_STATE | ERR_RECONCILIATION_STATE"
    http_status: 409

  - priority: 10
    category: cross_entity
    rule: |
      Permit coverage at dispatch. When Jobsite.requires_sidewalk_closure is true
      and work_order_type IN {DELIVERY_INSTALL, RELOCATION, RESET}:
        - some PermitApplication on the contract's jobsite_id must have
          status == APPROVED, else ERR_PERMIT_NOT_APPROVED
        - that permit's half-open window [closure_start_utc, closure_end_utc) must
          contain both scheduled_start_utc and scheduled_end_utc, else
          ERR_PERMIT_WINDOW_ELAPSED
      REMOVAL orders never require a closure permit.
    applies_to: "POST /work-orders/{id}/dispatch"
    error_id: "ERR_PERMIT_NOT_APPROVED | ERR_PERMIT_WINDOW_ELAPSED"
    http_status: 409

  - priority: 11
    category: business_safety
    rule: "wind_screen == SOLID_130 is refused when the jobsite's Municipality has allows_solid_wind_screen == false. A 130 mph solid screen is a jurisdictional wind-load question, decided before any pricing arithmetic runs."
    applies_to: "POST /jobsites/{id}/quotes"
    error_id: ERR_WIND_LOAD_NOT_PERMITTED
    http_status: 409

  - priority: 12
    category: business_safety
    rule: "A crew dispatched to an order whose contract was quoted with wind_screen == SOLID_130 must have Crew.certified_for_solid_screen == true. Certification is checked before the crew's calendar: an uncertified crew is refused even when its window is wide open, and a certified crew with a colliding window fails later at priority 14 instead."
    applies_to: "POST /work-orders/{id}/dispatch"
    error_id: ERR_CREW_NOT_CERTIFIED
    http_status: 409

  - priority: 13
    category: business_temporal
    rule: "On submission, closure_start_utc must be at least Municipality.permit_lead_time_days whole days after the logical clock: closure_start_utc >= clock + permit_lead_time_days x 86400 seconds. Exactly at the boundary is admitted."
    applies_to: "POST /permits/{id}/submit"
    error_id: ERR_PERMIT_LEAD_TIME_NOT_MET
    http_status: 409

  - priority: 14
    category: business_temporal
    rule: |
      A crew's committed intervals may not overlap. The interval a SCHEDULED work
      order occupies is [scheduled_start_utc, scheduled_end_utc +
      CREW_TRAVEL_BUFFER_MINUTES), half-open, with the buffer extending only the
      trailing edge. A candidate order collides when its own
      [scheduled_start_utc, scheduled_end_utc + buffer) intersects that of any
      other SCHEDULED order of the same crew. A candidate starting exactly at an
      existing order's buffered end does not collide.
    applies_to: "POST /work-orders/{id}/dispatch"
    error_id: ERR_CREW_WINDOW_CONFLICT
    http_status: 409

  - priority: 15
    category: business_capacity
    rule: "Sum of estimated_labor_hours over the crew's SCHEDULED orders whose scheduled_start_utc falls on the same UTC calendar date as the candidate, plus the candidate's own estimated_labor_hours, must be <= Crew.daily_capacity_hours. Each order individually fits; only the day's collective can breach the cap. Equality is admitted."
    applies_to: "POST /work-orders/{id}/dispatch"
    error_id: ERR_CREW_CAPACITY_EXCEEDED
    http_status: 409

  - priority: 16
    category: business_temporal
    rule: "A billing run's window must satisfy period_end_utc > period_start_utc, period_start_utc >= RentalContract.billing_anchor_utc, period_end_utc <= the logical clock, and period_start_utc >= the period_end_utc of the contract's most recent PERIODIC invoice (no overlapping or retroactive re-billing of a window already invoiced)."
    applies_to: "POST /contracts/{id}/billing-runs"
    error_id: ERR_BILLING_PERIOD_INVALID
    http_status: 409

  - priority: 17
    category: business_capacity
    rule: "calculations.closure_corridor_utilization must admit the candidate: committed footage over intersecting SUBMITTED/APPROVED permits of the same municipality plus the candidate's closure_linear_feet must not exceed Municipality.max_concurrent_closure_linear_feet. Equality is admitted."
    applies_to: "POST /permits/{id}/submit"
    error_id: ERR_CLOSURE_CAPACITY_EXCEEDED
    http_status: 409

  - priority: 18
    category: business_capacity
    rule: "A resubmission from REVISION_REQUESTED is refused once PermitApplication.revision_round exceeds Municipality.permit_review_rounds_allowed. With permit_review_rounds_allowed = 2 a permit may be resubmitted at revision_round 1 and 2 and is refused at revision_round 3, bounding the review cycle."
    applies_to: "POST /permits/{id}/submit"
    error_id: ERR_PERMIT_REVISION_LIMIT
    http_status: 409

  - priority: 19
    category: business_capacity
    rule: "Dispatching a DELIVERY_INSTALL order requires FenceProduct.available_count >= ceil(ordered_linear_feet / panel_length_ft) for the panel product, and available_count >= unit_count for every add-on product in the contract's fleet_commitments. Units already reserved by another SCHEDULED order are not available."
    applies_to: "POST /work-orders/{id}/dispatch"
    error_id: ERR_INSUFFICIENT_FLEET
    http_status: 409

  - priority: 20
    category: uniqueness
    rule: "Municipality.jurisdiction_code and FenceProduct.code must each be unique across all rows of their entity, compared case-sensitively."
    applies_to: "POST /municipalities, POST /products"
    error_id: ERR_DUPLICATE_CODE
    http_status: 409

  - priority: 21
    category: business_integrity
    rule: "panel_product_code must reference a FenceProduct with category == FENCE_PANEL, and every addon_lines[].product_code must reference a FenceProduct with category IN {GATE, BARRICADE, WATER_BARRIER}. A FENCE_PANEL product listed as an add-on, or a gate listed as the panel product, is refused."
    applies_to: "POST /jobsites/{id}/quotes"
    error_id: ERR_INVALID_ADDON_CATEGORY
    http_status: 409

  - priority: 22
    category: business_integrity
    rule: "A re-set order's phase_to must lie within 1..Jobsite.phase_count and must differ from RentalContract.current_phase. Re-setting the fence to the phase it already occupies is refused."
    applies_to: "POST /contracts/{id}/reset-orders"
    error_id: ERR_INVALID_PHASE_MOVE
    http_status: 409

  - priority: 23
    category: business_integrity
    rule: "unit_returns must cover exactly the product codes present in RemovalReconciliation.deployed_snapshot (no missing entry, no extra entry, no duplicate entry), and for every entry returned + damaged + missing must equal that product's deployed unit_count in the snapshot. Every deployed unit must be accounted for as returned, damaged or missing."
    applies_to: "POST /reconciliations/{id}/finalize"
    error_id: ERR_PANEL_COUNT_MISMATCH
    http_status: 409

  - priority: 24
    category: business_integrity
    rule: "term_months must be >= MINIMUM_CONSTRUCTION_TERM_MONTHS (3) when contract_type == CONSTRUCTION, and must be exactly 1 when contract_type == EVENT. An event fence is quoted for a single billing month and prorated by day."
    applies_to: "POST /jobsites/{id}/quotes"
    error_id: ERR_BELOW_MINIMUM_TERM
    http_status: 409

  - priority: 25
    category: business_fiscal
    rule: "Dispatch is refused while the contract's CustomerAccount has credit_hold_flag == true (open_balance_cents strictly greater than credit_limit_cents). Checked last among the dispatch rules: an order in the wrong state, on an unpermitted site, with an uncertified crew, a colliding window, an over-capacity day or short fleet reports that failure instead."
    applies_to: "POST /work-orders/{id}/dispatch"
    error_id: ERR_ACCOUNT_CREDIT_HOLD
    http_status: 402

  - priority: 26
    category: business_fiscal
    rule: "A payment's amount_cents must not exceed the account's total open amount across ISSUED and PARTIALLY_PAID invoices. An over-payment is refused in full and no invoice is mutated."
    applies_to: "POST /accounts/{id}/payments"
    error_id: ERR_PAYMENT_EXCEEDS_BALANCE
    http_status: 409

# -----------------------------------------------------------------------------
# §1.5 Endpoint Inventory
# Flat collections under /fence-rentals. Sub-resource POSTs exist only where the
# parent is genuinely the transaction boundary (quotes on a jobsite, work orders
# and re-set orders on a contract, payments on an account). Every FK in §1.1 is
# reverse-reachable through a filtered list endpoint.
# -----------------------------------------------------------------------------
endpoints:

  # --- Municipality ----------------------------------------------------------
  - method: POST
    path: /fence-rentals/municipalities
    purpose: register a permitting jurisdiction
    roles: [PlatformAdmin]
    input:
      - name
      - jurisdiction_code
      - permit_lead_time_days
      - max_concurrent_closure_linear_feet
      - rental_tax_rate_bp
      - permit_review_rounds_allowed?
      - allows_solid_wind_screen?
    output: Municipality
    side_effects:
      - "sets committed_closure_linear_feet to 0"

  - method: GET
    path: /fence-rentals/municipalities/{id}
    purpose: read one jurisdiction including its live committed closure footage
    roles: [PlatformAdmin, AccountManager, MunicipalLiaison, DispatchCoordinator, YardAuditor]
    input: []
    output: Municipality
    side_effects: []

  - method: GET
    path: /fence-rentals/municipalities
    purpose: list jurisdictions
    roles: [PlatformAdmin, AccountManager, MunicipalLiaison, DispatchCoordinator, YardAuditor]
    input:
      - jurisdiction_code?
      - limit?
      - offset?
    output: Municipality[]
    side_effects: []

  # --- CustomerAccount -------------------------------------------------------
  - method: POST
    path: /fence-rentals/accounts
    purpose: open a billing account
    roles: [PlatformAdmin, AccountManager]
    input:
      - legal_name
      - billing_email
      - credit_limit_cents
    output: CustomerAccount
    side_effects:
      - "sets open_balance_cents 0, lifetime_credited_cents 0, credit_hold_flag false"

  - method: GET
    path: /fence-rentals/accounts/{id}
    purpose: read an account with its live exposure
    roles: [PlatformAdmin, AccountManager, CustomerContact, YardAuditor]
    input: []
    output: CustomerAccount
    side_effects: []

  - method: GET
    path: /fence-rentals/accounts
    purpose: list accounts
    roles: [PlatformAdmin, AccountManager]
    input:
      - credit_hold_flag?
      - limit?
      - offset?
    output: CustomerAccount[]
    side_effects: []

  - method: POST
    path: /fence-rentals/accounts/{id}/payments
    purpose: apply a payment across the account's open invoices oldest-due first
    roles: [AccountManager]
    input:
      - amount_cents
    output: CustomerAccount
    side_effects:
      - "allocates the payment per calculations.account_exposure W1-W2"
      - "moves each touched Invoice to PARTIALLY_PAID or PAID"
      - "recomputes open_balance_cents and credit_hold_flag"
      - "re-evaluates RentalContract.billing_status for every touched contract (-> CURRENT or SETTLED)"
      - "may cascade RentalContract DEMOBILIZING -> CLOSED"
      - "refuses the whole payment with ERR_PAYMENT_EXCEEDS_BALANCE when it exceeds the open total"

  # --- FenceProduct ----------------------------------------------------------
  - method: POST
    path: /fence-rentals/products
    purpose: register a panel, gate, barricade or water-barrier product with its fleet
    roles: [PlatformAdmin]
    input:
      - code
      - category
      - description
      - unit_monthly_rate_cents
      - replacement_cost_cents_per_unit
      - fleet_age_months
      - owned_count
      - panel_length_ft?
      - wind_load_rating_mph?
    output: FenceProduct
    side_effects:
      - "sets available_count = owned_count and reserved_count / deployed_count / damaged_count / lost_count to 0"

  - method: GET
    path: /fence-rentals/products/{id}
    purpose: read one product with its live fleet counts
    roles: [PlatformAdmin, AccountManager, DispatchCoordinator, YardAuditor]
    input: []
    output: FenceProduct
    side_effects: []

  - method: GET
    path: /fence-rentals/products
    purpose: list products
    roles: [PlatformAdmin, AccountManager, DispatchCoordinator, YardAuditor]
    input:
      - code?
      - category?
      - limit?
      - offset?
    output: FenceProduct[]
    side_effects: []

  # --- Crew ------------------------------------------------------------------
  - method: POST
    path: /fence-rentals/crews
    purpose: register an install crew with its daily capacity and certification
    roles: [PlatformAdmin, DispatchCoordinator]
    input:
      - crew_code
      - depot_code
      - daily_capacity_hours
      - certified_for_solid_screen?
    output: Crew
    side_effects: []

  - method: GET
    path: /fence-rentals/crews/{id}
    purpose: read one crew
    roles: [PlatformAdmin, DispatchCoordinator, AccountManager]
    input: []
    output: Crew
    side_effects: []

  - method: GET
    path: /fence-rentals/crews
    purpose: list crews
    roles: [PlatformAdmin, DispatchCoordinator, AccountManager]
    input:
      - depot_code?
      - certified_for_solid_screen?
      - limit?
      - offset?
    output: Crew[]
    side_effects: []

  # --- Jobsite ---------------------------------------------------------------
  - method: POST
    path: /fence-rentals/jobsites
    purpose: register a jobsite under an account and a jurisdiction
    roles: [PlatformAdmin, AccountManager]
    input:
      - customer_account_id
      - municipality_id
      - site_label
      - address_line
      - site_condition
      - phase_count?
      - requires_sidewalk_closure?
    output: Jobsite
    side_effects: []

  - method: GET
    path: /fence-rentals/jobsites/{id}
    purpose: read one jobsite
    roles: [PlatformAdmin, AccountManager, CustomerContact, DispatchCoordinator, MunicipalLiaison, YardAuditor]
    input: []
    output: Jobsite
    side_effects: []

  - method: GET
    path: /fence-rentals/jobsites
    purpose: list jobsites, filtered by owning account or jurisdiction
    roles: [PlatformAdmin, AccountManager, CustomerContact, DispatchCoordinator, MunicipalLiaison, YardAuditor]
    input:
      - customer_account_id?
      - municipality_id?
      - limit?
      - offset?
    output: Jobsite[]
    side_effects: []

  # --- Quote -----------------------------------------------------------------
  - method: POST
    path: /fence-rentals/jobsites/{id}/quotes
    purpose: price a panel/post configuration on a jobsite, superseding its open quotes
    roles: [AccountManager]
    input:
      - expected_jobsite_version
      - contract_type
      - linear_feet
      - panel_product_code
      - term_months
      - wind_screen?
      - addon_lines?
    output: Quote
    side_effects:
      - "runs calculations.quote_pricing, storing tier_rate_cents_per_ft, panel_unit_count, monthly_recurring_cents, install_labor_cents, permit_handling_fee_cents, one_time_cents and priced_lines"
      - "creates the quote in DRAFT"
      - "conditional cascade: DRAFT and still-valid ISSUED quotes on this jobsite move to SUPERSEDED; ISSUED quotes past valid_through_utc move to EXPIRED; CONVERTED, EXPIRED and SUPERSEDED quotes are untouched"
      - "increments Jobsite.version by 1"

  - method: GET
    path: /fence-rentals/quotes/{id}
    purpose: read one quote with its priced lines
    roles: [PlatformAdmin, AccountManager, CustomerContact, DispatchCoordinator]
    input: []
    output: Quote
    side_effects: []

  - method: GET
    path: /fence-rentals/quotes
    purpose: list quotes, filtered by jobsite or status
    roles: [PlatformAdmin, AccountManager, CustomerContact, DispatchCoordinator]
    input:
      - jobsite_id?
      - status?
      - limit?
      - offset?
    output: Quote[]
    side_effects: []

  - method: POST
    path: /fence-rentals/quotes/{id}/issue
    purpose: issue a drafted quote to the customer and start its validity clock
    roles: [AccountManager]
    input: []
    output: Quote
    side_effects:
      - "DRAFT -> ISSUED; sets issued_at_utc and valid_through_utc = issued_at_utc + 14 days"
      - "increments Quote.version by 1"

  - method: POST
    path: /fence-rentals/quotes/{id}/accept
    purpose: customer acceptance of an issued quote
    roles: [CustomerContact]
    input:
      - accepted_by_name?
    output: Quote
    side_effects:
      - "ISSUED -> ACCEPTED"
      - "increments Quote.version by 1"

  # --- PermitApplication -----------------------------------------------------
  - method: POST
    path: /fence-rentals/permits
    purpose: draft a sidewalk-closure permit application for a jobsite
    roles: [MunicipalLiaison]
    input:
      - jobsite_id
      - closure_linear_feet
      - closure_start_utc
      - closure_end_utc
      - sidewalk_closure_type
    output: PermitApplication
    side_effects:
      - "creates the application in DRAFT with revision_round 0; holds no corridor footage yet"

  - method: GET
    path: /fence-rentals/permits/{id}
    purpose: read one permit application
    roles: [PlatformAdmin, MunicipalLiaison, AccountManager, DispatchCoordinator, CustomerContact]
    input: []
    output: PermitApplication
    side_effects: []

  - method: GET
    path: /fence-rentals/permits
    purpose: list permit applications, filtered by jobsite or status
    roles: [PlatformAdmin, MunicipalLiaison, AccountManager, DispatchCoordinator, CustomerContact]
    input:
      - jobsite_id?
      - status?
      - limit?
      - offset?
    output: PermitApplication[]
    side_effects: []

  - method: POST
    path: /fence-rentals/permits/{id}/submit
    purpose: submit or resubmit a permit application to the municipality
    roles: [MunicipalLiaison]
    input:
      - closure_linear_feet?
      - closure_start_utc?
      - closure_end_utc?
    output: PermitApplication
    side_effects:
      - "DRAFT -> SUBMITTED, or REVISION_REQUESTED -> SUBMITTED (the cycle edge)"
      - "applies any supplied window / footage overrides before the lead-time and corridor checks run"
      - "sets submitted_at_utc and clears required_change_summary"
      - "recomputes Municipality.committed_closure_linear_feet"
      - "increments PermitApplication.version by 1"

  - method: POST
    path: /fence-rentals/permits/{id}/municipal-decision
    purpose: record the municipality's approval, denial or revision request
    roles: [MunicipalLiaison]
    input:
      - decision
      - reviewer_note?
      - required_change_summary?
    output: PermitApplication
    side_effects:
      - "APPROVE -> APPROVED; DENY -> DENIED; REQUEST_REVISION -> REVISION_REQUESTED with revision_round incremented by 1"
      - "sets decided_at_utc"
      - "recomputes Municipality.committed_closure_linear_feet (DENIED and REVISION_REQUESTED release their footage)"
      - "increments PermitApplication.version by 1"

  # --- RentalContract --------------------------------------------------------
  - method: POST
    path: /fence-rentals/contracts
    purpose: convert an accepted quote into a rental contract
    roles: [AccountManager]
    input:
      - quote_id
      - terms_acknowledged_by
    output: RentalContract
    side_effects:
      - "Quote ACCEPTED -> CONVERTED"
      - "creates the contract with lifecycle_status PENDING_MOBILIZATION, billing_status NOT_BILLED, current_phase 1"
      - "pins pinned_quote_version, contract_type, monthly_recurring_cents, install_labor_cents, one_time_cents and ordered_linear_feet from the quote"
      - "derives fleet_commitments from Quote.panel_unit_count and Quote.addon_lines"
      - "increments Quote.version by 1"

  - method: GET
    path: /fence-rentals/contracts/{id}
    purpose: read one contract with both of its parallel status dimensions
    roles: [PlatformAdmin, AccountManager, CustomerContact, DispatchCoordinator, YardAuditor]
    input: []
    output: RentalContract
    side_effects: []

  - method: GET
    path: /fence-rentals/contracts
    purpose: list contracts, filtered by account, quote, jobsite or lifecycle status
    roles: [PlatformAdmin, AccountManager, CustomerContact, DispatchCoordinator, YardAuditor]
    input:
      - customer_account_id?
      - quote_id?
      - jobsite_id?
      - lifecycle_status?
      - billing_status?
      - limit?
      - offset?
    output: RentalContract[]
    side_effects: []

  - method: POST
    path: /fence-rentals/contracts/{id}/work-orders
    purpose: plan a delivery/install, relocation or removal order on a contract
    roles: [DispatchCoordinator]
    input:
      - work_order_type
      - ordered_linear_feet
      - scheduled_start_utc?
      - phase_from?
      - phase_to?
    output: WorkOrder
    side_effects:
      - "creates the order in PLANNED with completed_linear_feet 0 and no crew"
      - "reserves nothing: fleet is only reserved at dispatch"

  - method: POST
    path: /fence-rentals/contracts/{id}/reset-orders
    purpose: order a jobsite phase move, superseding any open re-set order on the contract
    roles: [DispatchCoordinator]
    input:
      - expected_contract_version
      - ordered_linear_feet
      - phase_to
      - scheduled_start_utc?
    output: WorkOrder
    side_effects:
      - "creates a RESET WorkOrder in PLANNED with phase_from = RentalContract.current_phase and the supplied phase_to"
      - "conditional cascade: the contract's existing RESET orders in PLANNED or SCHEDULED move to SUPERSEDED, releasing any crew they held"
      - "increments RentalContract.version by 1"

  - method: GET
    path: /fence-rentals/work-orders/{id}
    purpose: read one work order with its estimate and reservations
    roles: [PlatformAdmin, AccountManager, DispatchCoordinator, CustomerContact, YardAuditor]
    input: []
    output: WorkOrder
    side_effects: []

  - method: GET
    path: /fence-rentals/work-orders
    purpose: list work orders, filtered by contract, crew, status or predecessor
    roles: [PlatformAdmin, AccountManager, DispatchCoordinator, CustomerContact, YardAuditor]
    input:
      - contract_id?
      - crew_id?
      - status?
      - work_order_type?
      - predecessor_work_order_id?
      - limit?
      - offset?
    output: WorkOrder[]
    side_effects: []

  - method: POST
    path: /fence-rentals/work-orders/{id}/dispatch
    purpose: assign a crew and a start time, reserving fleet
    roles: [DispatchCoordinator]
    input:
      - crew_id
      - scheduled_start_utc
    output: WorkOrder
    side_effects:
      - "PLANNED -> SCHEDULED"
      - "runs calculations.crew_labor_hours, storing estimated_labor_hours and scheduled_end_utc"
      - "for DELIVERY_INSTALL: sets reserved_unit_counts and moves FenceProduct.available_count -> reserved_count"
      - "runs validations priorities 10, 12, 14, 15, 19 and 25 in that order"
      - "increments WorkOrder.version by 1"

  - method: POST
    path: /fence-rentals/work-orders/{id}/complete
    purpose: report an order finished, in full or in part
    roles: [DispatchCoordinator]
    input:
      - completed_linear_feet
    output: WorkOrder
    side_effects:
      - "SCHEDULED -> COMPLETED when completed_linear_feet == ordered_linear_feet, SCHEDULED -> PARTIAL when it is strictly less"
      - "sets completed_by_user_id = X-User-ID"
      - "DELIVERY_INSTALL: moves reserved units -> deployed_count, releases the unbuilt remainder -> available_count, and drives the contract PENDING_MOBILIZATION -> ACTIVE, which issues the MOBILIZATION invoice, which lifts CustomerAccount.open_balance_cents, which may raise credit_hold_flag"
      - "PARTIAL on a DELIVERY_INSTALL additionally creates a remainder WorkOrder in PLANNED with predecessor_work_order_id set and predecessor_relation REMAINDER_OF"
      - "REMOVAL: drives the contract ACTIVE -> DEMOBILIZING, which opens the RemovalReconciliation and closes the jobsite's APPROVED permits, releasing municipal corridor footage"
      - "RESET: sets RentalContract.current_phase = phase_to"
      - "increments WorkOrder.version by 1"

  - method: POST
    path: /fence-rentals/work-orders/{id}/abort
    purpose: abandon a dispatched order in the field
    roles: [DispatchCoordinator]
    input:
      - abort_reason_code
    output: WorkOrder
    side_effects:
      - "SCHEDULED -> ABORTED"
      - "releases every reservation reserved_count -> available_count and clears crew_id"
      - "creates no remainder order, issues no invoice and leaves the contract's lifecycle_status untouched"
      - "increments WorkOrder.version by 1"

  - method: POST
    path: /fence-rentals/work-orders/{id}/cancel
    purpose: cancel a planned or scheduled order before it runs
    roles: [DispatchCoordinator, AccountManager]
    input:
      - cancel_reason_code
    output: WorkOrder
    side_effects:
      - "PLANNED or SCHEDULED -> CANCELLED"
      - "releases every reservation reserved_count -> available_count and clears crew_id"
      - "increments WorkOrder.version by 1"

  - method: POST
    path: /fence-rentals/contracts/{id}/cancel
    purpose: cancel a contract before mobilization, assessing the window-based fee
    roles: [AccountManager]
    input:
      - cancel_reason_code
    output: RentalContract
    side_effects:
      - "PENDING_MOBILIZATION -> CANCELLED"
      - "runs calculations.cancellation_fee and stores cancellation_fee_cents"
      - "cancels every PLANNED or SCHEDULED WorkOrder on the contract, releasing their reservations"
      - "issues a CANCELLATION Invoice when cancellation_fee_cents > 0 and lifts CustomerAccount.open_balance_cents by its total_cents; issues no invoice at all when the fee is 0"
      - "increments RentalContract.version by 1"

  - method: POST
    path: /fence-rentals/contracts/{id}/billing-runs
    purpose: bill one rental period, prorating by the contract's own variant
    roles: [AccountManager]
    input:
      - period_start_utc
      - period_end_utc
    output: Invoice
    side_effects:
      - "runs calculations.invoice_period_charge (event_daily_proration or construction_cycle_proration) then calculations.invoice_total_rollup"
      - "issues a PERIODIC Invoice in ISSUED with issued_by_user_id = X-User-ID and due_at_utc = issued_at_utc + 30 days"
      - "sets RentalContract.billed_through_utc = period_end_utc"
      - "carries late_fee_cents when the contract was PAST_DUE at the start of the run"
      - "lifts CustomerAccount.open_balance_cents and re-evaluates credit_hold_flag"
      - "advances RentalContract.billing_status NOT_BILLED -> CURRENT on the first invoice"

  # --- Invoice ---------------------------------------------------------------
  - method: GET
    path: /fence-rentals/invoices/{id}
    purpose: read one invoice with its lines and money
    roles: [PlatformAdmin, AccountManager, CustomerContact, YardAuditor]
    input: []
    output: Invoice
    side_effects: []

  - method: GET
    path: /fence-rentals/invoices
    purpose: list invoices, filtered by contract, kind or status
    roles: [PlatformAdmin, AccountManager, CustomerContact, YardAuditor]
    input:
      - contract_id?
      - status?
      - invoice_kind?
      - limit?
      - offset?
    output: Invoice[]
    side_effects: []

  - method: POST
    path: /fence-rentals/invoices/{id}/void
    purpose: void an issued or partly paid invoice, credited back to the account
    roles: [AccountManager]
    input:
      - void_reason_code
    output: Invoice
    side_effects:
      - "ISSUED or PARTIALLY_PAID -> VOID"
      - "reduces CustomerAccount.open_balance_cents by exactly (total_cents - amount_paid_cents) and raises lifetime_credited_cents by the same amount"
      - "re-evaluates credit_hold_flag and RentalContract.billing_status"
      - "refused with ERR_SEGREGATION_OF_DUTIES when X-User-ID == issued_by_user_id"
      - "increments Invoice.version by 1"

  # --- RemovalReconciliation -------------------------------------------------
  - method: GET
    path: /fence-rentals/reconciliations/{id}
    purpose: read one removal reconciliation
    roles: [PlatformAdmin, AccountManager, YardAuditor, DispatchCoordinator, CustomerContact]
    input: []
    output: RemovalReconciliation
    side_effects: []

  - method: GET
    path: /fence-rentals/reconciliations
    purpose: list reconciliations, filtered by contract, removal order or status
    roles: [PlatformAdmin, AccountManager, YardAuditor, DispatchCoordinator, CustomerContact]
    input:
      - contract_id?
      - work_order_id?
      - status?
      - limit?
      - offset?
    output: RemovalReconciliation[]
    side_effects: []

  - method: POST
    path: /fence-rentals/reconciliations/{id}/finalize
    purpose: certify what came back, what was damaged and what was stolen
    roles: [YardAuditor]
    input:
      - unit_returns
      - theft_police_report_number?
      - auditor_note?
    output: RemovalReconciliation
    side_effects:
      - "OPEN -> FINALIZED with finalized_by_user_id = X-User-ID"
      - "selects assessment_variant and runs calculations.reconciliation_loss_assessment, storing loss_charge_cents and damage_charge_cents"
      - "moves each product's counts deployed_count -> available_count / damaged_count / lost_count"
      - "issues a FINAL Invoice with LOSS and DAMAGE lines when loss_charge_cents + damage_charge_cents > 0, and none at all when the sum is 0"
      - "lifts CustomerAccount.open_balance_cents by the FINAL invoice total_cents and re-evaluates credit_hold_flag"
      - "refused with ERR_SEGREGATION_OF_DUTIES when X-User-ID == the removal order's completed_by_user_id"
      - "increments RemovalReconciliation.version by 1"

  # --- Test-driving clock ----------------------------------------------------
  - method: POST
    path: /_clock/set_current_utc
    purpose: set the logical clock every temporal rule reads
    roles: [PlatformAdmin]
    input:
      - current_utc
    output: { current_utc: datetime }
    side_effects:
      - "sets the logical clock; defaults to 2026-08-01T00:00:00Z when never called"
      - "recomputes no derived field on its own: aggregates are re-evaluated when the next request reads them"

# -----------------------------------------------------------------------------
# §1.6 Error Catalog — every entry is reachable from at least one §1.4 rule.
# -----------------------------------------------------------------------------
errors:
  - error_id: ERR_UNAUTHENTICATED
    http_status: 401
    when: "X-User-ID or X-User-Role missing or empty"
  - error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    when: "X-User-Role not in the endpoint's allowed roles"
  - error_id: ERR_VALIDATION
    http_status: 400
    when: "missing required field, wrong JSON type, unknown enum member, non-positive quantity, malformed instant, inverted window, pagination out of range, unknown field, or completed_linear_feet outside (0, ordered_linear_feet]"
  - error_id: ERR_MUNICIPALITY_NOT_FOUND
    http_status: 404
    when: "municipality id in a path or body does not resolve"
  - error_id: ERR_ACCOUNT_NOT_FOUND
    http_status: 404
    when: "customer account id in a path or body does not resolve"
  - error_id: ERR_JOBSITE_NOT_FOUND
    http_status: 404
    when: "jobsite id in a path or body does not resolve"
  - error_id: ERR_PRODUCT_NOT_FOUND
    http_status: 404
    when: "product id in a path, or a product code in panel_product_code / addon_lines / unit_returns, does not resolve"
  - error_id: ERR_CREW_NOT_FOUND
    http_status: 404
    when: "crew id in a path or in a dispatch body does not resolve"
  - error_id: ERR_QUOTE_NOT_FOUND
    http_status: 404
    when: "quote id in a path or body does not resolve"
  - error_id: ERR_PERMIT_NOT_FOUND
    http_status: 404
    when: "permit application id in a path does not resolve"
  - error_id: ERR_CONTRACT_NOT_FOUND
    http_status: 404
    when: "contract id in a path or query does not resolve"
  - error_id: ERR_WORK_ORDER_NOT_FOUND
    http_status: 404
    when: "work order id in a path or query does not resolve"
  - error_id: ERR_INVOICE_NOT_FOUND
    http_status: 404
    when: "invoice id in a path does not resolve"
  - error_id: ERR_RECONCILIATION_NOT_FOUND
    http_status: 404
    when: "reconciliation id in a path does not resolve"
  - error_id: ERR_ACCOUNT_SCOPE_VIOLATION
    http_status: 403
    when: "a CustomerContact reads or acts on a row belonging to a different CustomerAccount"
  - error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    when: "an invoice is voided by the user who issued it, or a reconciliation is finalized by the user who completed the removal order"
  - error_id: ERR_STALE_VERSION
    http_status: 412
    when: "expected_jobsite_version or expected_contract_version does not match the parent's current version"
  - error_id: ERR_QUOTE_STATE
    http_status: 409
    when: "a quote transition is attempted from a state outside the transition's from-set"
  - error_id: ERR_PERMIT_STATE
    http_status: 409
    when: "a permit transition is attempted from a state outside the transition's from-set"
  - error_id: ERR_CONTRACT_STATE
    http_status: 409
    when: "a contract operation is attempted against an incompatible lifecycle_status or billing_status"
  - error_id: ERR_WORK_ORDER_STATE
    http_status: 409
    when: "a work order transition is attempted from a state outside the transition's from-set"
  - error_id: ERR_INVOICE_STATE
    http_status: 409
    when: "an invoice is voided when already PAID or VOID"
  - error_id: ERR_RECONCILIATION_STATE
    http_status: 409
    when: "a reconciliation is finalized when already FINALIZED"
  - error_id: ERR_PERMIT_NOT_APPROVED
    http_status: 409
    when: "a closure-requiring order is dispatched with no APPROVED permit on its jobsite"
  - error_id: ERR_PERMIT_WINDOW_ELAPSED
    http_status: 409
    when: "the APPROVED permit's half-open closure window does not contain the order's whole scheduled interval"
  - error_id: ERR_WIND_LOAD_NOT_PERMITTED
    http_status: 409
    when: "SOLID_130 is quoted in a jurisdiction with allows_solid_wind_screen false"
  - error_id: ERR_CREW_NOT_CERTIFIED
    http_status: 409
    when: "a crew without certified_for_solid_screen is dispatched to a SOLID_130 contract"
  - error_id: ERR_PERMIT_LEAD_TIME_NOT_MET
    http_status: 409
    when: "closure_start_utc is less than permit_lead_time_days after the logical clock at submission"
  - error_id: ERR_CREW_WINDOW_CONFLICT
    http_status: 409
    when: "the candidate order's buffered interval intersects another SCHEDULED order of the same crew"
  - error_id: ERR_CREW_CAPACITY_EXCEEDED
    http_status: 409
    when: "the crew's committed hours for that UTC date plus the candidate's estimate exceed daily_capacity_hours"
  - error_id: ERR_BILLING_PERIOD_INVALID
    http_status: 409
    when: "a billing window is inverted, precedes billing_anchor_utc, ends after the logical clock, or overlaps an already-invoiced window"
  - error_id: ERR_CLOSURE_CAPACITY_EXCEEDED
    http_status: 409
    when: "committed plus candidate closure footage over intersecting permits exceeds max_concurrent_closure_linear_feet"
  - error_id: ERR_PERMIT_REVISION_LIMIT
    http_status: 409
    when: "resubmission is attempted once revision_round exceeds permit_review_rounds_allowed"
  - error_id: ERR_INSUFFICIENT_FLEET
    http_status: 409
    when: "available_count is short of the panels or add-on units a dispatch would reserve"
  - error_id: ERR_DUPLICATE_CODE
    http_status: 409
    when: "jurisdiction_code or product code already exists"
  - error_id: ERR_INVALID_ADDON_CATEGORY
    http_status: 409
    when: "panel_product_code does not reference a FENCE_PANEL product, or an addon line references a FENCE_PANEL product"
  - error_id: ERR_INVALID_PHASE_MOVE
    http_status: 409
    when: "phase_to is outside 1..Jobsite.phase_count or equals the contract's current_phase"
  - error_id: ERR_PANEL_COUNT_MISMATCH
    http_status: 409
    when: "unit_returns does not cover the deployed_snapshot exactly, or a line's returned + damaged + missing does not equal its deployed unit_count"
  - error_id: ERR_BELOW_MINIMUM_TERM
    http_status: 409
    when: "a CONSTRUCTION quote has term_months below 3, or an EVENT quote has term_months other than 1"
  - error_id: ERR_ACCOUNT_CREDIT_HOLD
    http_status: 402
    when: "dispatch is attempted while the contract's account has credit_hold_flag true"
  - error_id: ERR_PAYMENT_EXCEEDS_BALANCE
    http_status: 409
    when: "a payment exceeds the account's total open invoice amount"

# -----------------------------------------------------------------------------
# §1.7 RBAC Matrix — segregation of duties across commercial, dispatch,
# permitting and yard functions. No role is a superset of another: PlatformAdmin
# owns the reference data but cannot quote, dispatch, permit, bill or certify.
# -----------------------------------------------------------------------------
roles:

  - role: PlatformAdmin
    id_semantics: opaque
    description: "Reference-data owner: jurisdictions, products and fleet, crews. Deliberately excluded from every commercial and operational action."
    exclusive_operations:
      - "POST /fence-rentals/municipalities"
      - "POST /fence-rentals/products"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /fence-rentals/accounts (with AccountManager)"
      - "POST /fence-rentals/crews (with DispatchCoordinator)"
      - "every GET"
    test_user_ids: ["pa-001"]

  - role: AccountManager
    id_semantics: opaque
    description: "Commercial owner: accounts, jobsites, quoting, conversion, cancellation, billing, payments and voids. Cannot dispatch a crew, cannot touch a permit, cannot certify a removal."
    exclusive_operations:
      - "POST /fence-rentals/jobsites/{id}/quotes"
      - "POST /fence-rentals/quotes/{id}/issue"
      - "POST /fence-rentals/contracts"
      - "POST /fence-rentals/contracts/{id}/cancel"
      - "POST /fence-rentals/contracts/{id}/billing-runs"
      - "POST /fence-rentals/accounts/{id}/payments"
      - "POST /fence-rentals/invoices/{id}/void"
    shared_operations:
      - "POST /fence-rentals/accounts (with PlatformAdmin)"
      - "POST /fence-rentals/jobsites (with PlatformAdmin)"
      - "POST /fence-rentals/work-orders/{id}/cancel (with DispatchCoordinator)"
      - "every GET"
    test_user_ids: ["am-001", "am-002"]
    note: "Two distinct ids exist because ERR_SEGREGATION_OF_DUTIES on invoice void requires a second AccountManager who did not issue the invoice."

  - role: CustomerContact
    id_semantics: "entity_backed:CustomerAccount"
    description: "The customer. X-User-ID IS the CustomerAccount.id, so every read and write is scoped to that account by validation priority 6."
    exclusive_operations:
      - "POST /fence-rentals/quotes/{id}/accept"
    shared_operations:
      - "GET on its own jobsites, quotes, permits, contracts, work orders, invoices and reconciliations"
    test_user_ids: ["<the CustomerAccount.id under test>"]

  - role: DispatchCoordinator
    id_semantics: opaque
    description: "Field operations owner: plans, dispatches, completes, aborts and cancels work orders, and orders phase moves. Cannot quote, bill or certify a removal."
    exclusive_operations:
      - "POST /fence-rentals/contracts/{id}/work-orders"
      - "POST /fence-rentals/contracts/{id}/reset-orders"
      - "POST /fence-rentals/work-orders/{id}/dispatch"
      - "POST /fence-rentals/work-orders/{id}/complete"
      - "POST /fence-rentals/work-orders/{id}/abort"
    shared_operations:
      - "POST /fence-rentals/crews (with PlatformAdmin)"
      - "POST /fence-rentals/work-orders/{id}/cancel (with AccountManager)"
      - "every GET"
    test_user_ids: ["dc-001"]

  - role: MunicipalLiaison
    id_semantics: opaque
    description: "Permitting owner: drafts, submits and resubmits applications and records the municipality's decision. Cannot dispatch against the permit it obtained."
    exclusive_operations:
      - "POST /fence-rentals/permits"
      - "POST /fence-rentals/permits/{id}/submit"
      - "POST /fence-rentals/permits/{id}/municipal-decision"
    shared_operations:
      - "GET on municipalities, jobsites and permits"
    test_user_ids: ["ml-001"]

  - role: YardAuditor
    id_semantics: opaque
    description: "Returns owner: certifies what came back from a removal and what is damaged or stolen. Cannot complete the removal order it certifies."
    exclusive_operations:
      - "POST /fence-rentals/reconciliations/{id}/finalize"
    shared_operations:
      - "GET on products, contracts, work orders, invoices and reconciliations"
    test_user_ids: ["ya-001"]
