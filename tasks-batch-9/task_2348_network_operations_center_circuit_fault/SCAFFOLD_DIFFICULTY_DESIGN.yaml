              payload: { incident_id: "${i1_id}", circuit_id: "${c1_id}", carrier_reference: "NLC-TT-88007" }
              as: NocAnalyst
              captures: { t1_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T05:00:00Z" }
              as: PlatformAdmin
            - call: "POST /carrier-tickets/${t1_id}/carrier-update"
              payload: { update: "RESTORED", restored_at: "2026-08-10T05:00:00Z" }
              as: CarrierLiaison
              as_user_id: "${nlc_id}"
            - call: "POST /alarms/${a1_id}/clear"
              payload: { cleared_at: "2026-08-10T05:00:00Z" }
              as: NocAnalyst
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T05:30:00Z" }
              as: PlatformAdmin
