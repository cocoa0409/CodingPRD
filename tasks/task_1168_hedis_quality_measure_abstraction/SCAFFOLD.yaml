  - method: POST
    path: "/hedis/samples/{sampleId}/finalize"
    description: "Finalize the sample (DRAWN -> FINALIZED) after chase/IRR gates"
    roles: [QualityAnalyst]
    code: 200
    input: []
    output: Sample
    side_effects: ["bulk auto-confirm SUBMITTED non-over-read abstractions -> CONFIRMED", "run.sample_numerator_count recompute", "increments Sample.version by 1"]
  - method: POST
    path: "/hedis/samples/{sampleId}/evaluate-irr"
    description: "Compute irr_ratio, set irr_state, escalate required_overread_fraction per tiers, run selector top-up"
    roles: [QualityAnalyst]
    code: 200
    input: []
    output: Sample
    side_effects: ["overread_fraction_tiering", "irr_agreement_ratio", "requires_overread selector top-up", "increments Sample.version by 1"]
  - method: GET
    path: "/hedis/samples/{id}/chart-chases"
    description: "List chases of a sample (FK reverse reachability) Results ordered by created_at ASC (mint order); where mint order follows a business key (population entries, chart chases) that order is member_ref ASC."
    roles: [QualityAdmin, QualityAnalyst, Abstractor, OverReader, ProviderRelations, Auditor, QualityDirector]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "ChartChase[]"
    side_effects: []

  # --- ChartChase ---
  - method: GET
    path: "/hedis/chart-chases/{chaseId}"
    description: "Get a chart chase"
    roles: [QualityAdmin, QualityAnalyst, Abstractor, OverReader, ProviderRelations, Auditor, QualityDirector]
    code: 200
    input: []
    output: ChartChase
    side_effects: []
  - method: POST
    path: "/hedis/chart-chases/{chaseId}/receive"
    description: "Mark chart received (REQUESTED -> RECEIVED)"
    roles: [QualityAnalyst]
    code: 200
    input: []
    output: ChartChase
    side_effects: ["increments ChartChase.version by 1"]
  - method: POST
    path: "/hedis/chart-chases/{chaseId}/reject-unreadable"
    description: "Reject a received chart as unreadable (RECEIVED -> REJECTED_UNREADABLE)"
    roles: [QualityAnalyst]
    code: 200
    input: []
    output: ChartChase
    side_effects: ["increments ChartChase.version by 1"]
  - method: POST
    path: "/hedis/chart-chases/{chaseId}/rechase"
    description: "Re-chase (REJECTED_UNREADABLE|WITHDRAWN -> REQUESTED; chase_round += 1)"
    roles: [QualityAnalyst]
    code: 200
    input: []
    output: ChartChase
    side_effects: ["chase_round += 1", "increments ChartChase.version by 1"]
  - method: POST
    path: "/hedis/chart-chases/{chaseId}/withdraw"
    description: "Withdraw a pending chase (REQUESTED -> WITHDRAWN)"
    roles: [QualityAnalyst]
    code: 200
    input: []
    output: ChartChase
    side_effects: ["increments ChartChase.version by 1"]
  - method: POST
    path: "/hedis/chart-chases/{chaseId}/mark-excluded"
    description: "Record a valid sample exclusion (e.g., member deceased) reducing the hybrid denominator"
    roles: [QualityAnalyst]
    code: 200
    input: [reason]
    output: ChartChase
    side_effects: ["run.sample_exclusion_count += 1", "increments ChartChase.version by 1"]
  - method: GET
    path: "/hedis/chart-chases/{id}/abstractions"
    description: "List abstractions of a chase (FK reverse reachability) Results ordered by created_at ASC (mint order); where mint order follows a business key (population entries, chart chases) that order is member_ref ASC."
    roles: [QualityAdmin, QualityAnalyst, Abstractor, OverReader, ProviderRelations, Auditor, QualityDirector]
    code: 200
    input: ["limit?", "offset?"]
    output: "Abstraction[]"
    side_effects: []

  # --- Abstraction ---
  - method: POST
    path: "/hedis/abstractions"
    description: "Create an abstraction on a RECEIVED chase; abstractor = X-User-ID"
    roles: [Abstractor]
    code: 201
    input: [chase_id, result]
    output: Abstraction
    side_effects: ["abstractor_user_id=X-User-ID", "status=DRAFT"]
  - method: GET
    path: "/hedis/abstractions/{abstractionId}"
    description: "Get an abstraction"
    roles: [QualityAdmin, QualityAnalyst, Abstractor, OverReader, ProviderRelations, Auditor, QualityDirector]
    code: 200
    input: []
    output: Abstraction
    side_effects: []
  - method: PUT
    path: "/hedis/abstractions/{abstractionId}"
    description: "Edit result while DRAFT (remediation correction)"
    roles: [Abstractor]
    code: 200
    input: [result]
    output: Abstraction
    side_effects: ["requires status == DRAFT", "X-User-ID == abstractor_user_id", "increments Abstraction.version by 1"]
  - method: POST
    path: "/hedis/abstractions/{abstractionId}/submit"
    description: "Submit (DRAFT|REMEDIATION -> SUBMITTED)"
    roles: [Abstractor]
    code: 200
    input: []
    output: Abstraction
    side_effects: ["chase RECEIVED -> ABSTRACTED on first submit", "over-read selector top-up", "run.sample_numerator_count recompute", "increments Abstraction.version by 1"]
  - method: POST
    path: "/hedis/abstractions/{abstractionId}/retract"
    description: "Retract (SUBMITTED|REMEDIATION -> DRAFT); compensates the submit side effects"
    roles: [Abstractor]
    code: 200
    input: []
    output: Abstraction
    side_effects: ["chase ABSTRACTED -> RECEIVED when retracting the submitting abstraction", "run.sample_numerator_count recompute", "increments Abstraction.version by 1"]
  - method: GET
    path: "/hedis/abstractions/{id}/over-reads"
    description: "List over-read reviews of an abstraction (FK reverse reachability) Results ordered by created_at ASC (mint order); where mint order follows a business key (population entries, chart chases) that order is member_ref ASC."
    roles: [QualityAdmin, QualityAnalyst, Abstractor, OverReader, Auditor, QualityDirector]
    code: 200
    input: ["limit?", "offset?"]
    output: "OverReadReview[]"
    side_effects: []

  # --- OverReadReview ---
  - method: POST
    path: "/hedis/over-reads"
    description: "Record an over-read review. Preconditions: abstraction status == SUBMITTED AND requires_overread == true (else ERR_INVALID_STATE); reviewer X-User-ID != abstraction.abstractor_user_id (ERR_SOD_SELF_OVERREAD); a prior review for the current round cannot coexist with SUBMITTED (state guard); final_result required iff outcome == DISAGREE (ERR_INVALID_REQUEST)."
    roles: [OverReader]
    code: 201
    input: [abstraction_id, outcome, "final_result?"]
    output: OverReadReview
    side_effects: ["AGREE: abstraction SUBMITTED -> OVERREAD_PASSED", "DISAGREE: abstraction SUBMITTED -> REMEDIATION with remediation_count/fraction-override/selector-top-up cascade per Abstraction state machine", "run.sample_numerator_count recompute"]

  # --- Supplemental ---
  - method: POST
    path: "/hedis/supplemental-batches"
    description: "Create a supplemental data batch for a run"
    roles: [QualityAnalyst]
    code: 201
    input: [run_id, source_type]
    output: SupplementalDataBatch
    side_effects: ["status=RECEIVED"]
  - method: GET
    path: "/hedis/supplemental-batches/{batchId}"
    description: "Get a batch"
    roles: [QualityAdmin, QualityAnalyst, Abstractor, OverReader, ProviderRelations, Auditor, QualityDirector]
    code: 200
    input: []
    output: SupplementalDataBatch
    side_effects: []
  - method: POST
    path: "/hedis/supplemental-batches/{batchId}/screen"
    description: "Screen records: member matching per variant, measurement-year window, duplicates (RECEIVED -> SCREENED)"
    roles: [QualityAnalyst]
    code: 200
    input: []
    output: SupplementalDataBatch
    side_effects: ["supplemental_record_matching", "record dispositions set", "accepted_record_count set", "increments SupplementalDataBatch.version by 1"]
  - method: POST
    path: "/hedis/supplemental-batches/{batchId}/accept"
    description: "Accept a screened batch; applies numerator/gap cascades (SCREENED -> ACCEPTED)"
    roles: [QualityAnalyst]
    code: 200
    input: []
    output: SupplementalDataBatch
    side_effects: ["admin_compliant flips", "GapItem auto-close cascade", "Provider.open_gap_count reconciliation", "run numerator recompute", "increments SupplementalDataBatch.version by 1"]
  - method: POST
    path: "/hedis/supplemental-batches/{batchId}/reject"
    description: "Reject a screened batch (SCREENED -> REJECTED); no numerator effects"
    roles: [QualityAnalyst]
    code: 200
    input: []
    output: SupplementalDataBatch
    side_effects: ["increments SupplementalDataBatch.version by 1"]
  - method: GET
    path: "/hedis/supplemental-batches/{id}/records"
    description: "List records of a batch (FK reverse reachability) Results ordered by created_at ASC (mint order); where mint order follows a business key (population entries, chart chases) that order is member_ref ASC."
    roles: [QualityAdmin, QualityAnalyst, Abstractor, OverReader, ProviderRelations, Auditor, QualityDirector]
    code: 200
    input: ["disposition?", "limit?", "offset?"]
    output: "SupplementalRecord[]"
    side_effects: []
  - method: POST
    path: "/hedis/supplemental-records"
    description: "Add a record to a batch (batch must be RECEIVED)"
    roles: [QualityAnalyst]
    code: 201
    input: [batch_id, member_ref, service_date, evidence_code]
    output: SupplementalRecord
    side_effects: ["disposition=PENDING", "batch.record_count += 1"]

  # --- GapItem ---
  - method: POST
    path: "/hedis/gap-items/{gapId}/mark-outreach-done"
    description: "Provider outreach completed (OPEN -> OUTREACH_DONE)"
    roles: [ProviderRelations]
    code: 200
    input: []
    output: GapItem
    side_effects: ["increments GapItem.version by 1"]
  - method: POST
    path: "/hedis/gap-items/{gapId}/close"
    description: "Close a gap after outreach (OUTREACH_DONE -> CLOSED_COMPLIANT | CLOSED_NONCOMPLIANT)"
    roles: [ProviderRelations]
    code: 200
    input: [outcome]
    output: GapItem
    side_effects: ["closure_source=MANUAL", "Provider.open_gap_count -= 1", "increments GapItem.version by 1"]

  # --- Audit ---
  - method: POST
    path: "/hedis/audit-engagements"
    description: "Schedule an audit engagement; half-open window overlap check per auditor_user_id"
    roles: [Auditor]
    code: 201
    input: [season_id, measure_run_id, auditor_user_id, window_start, window_end]
    output: AuditEngagement
    side_effects: ["status=SCHEDULED"]
  - method: GET
    path: "/hedis/audit-engagements/{engagementId}"
    description: "Get an engagement"
    roles: [QualityAdmin, QualityAnalyst, Auditor, QualityDirector]
    code: 200
    input: []
    output: AuditEngagement
    side_effects: []
  - method: POST
    path: "/hedis/audit-engagements/{engagementId}/begin-review"
    description: "Begin review inside the engagement window (SCHEDULED -> IN_REVIEW; run.audit_status -> IN_REVIEW)"
    roles: [Auditor]
    code: 200
    input: []
    output: AuditEngagement
    side_effects: ["run.audit_status=IN_REVIEW", "increments AuditEngagement.version by 1"]
  - method: POST
    path: "/hedis/audit-engagements/{engagementId}/complete"
    description: "Complete with outcome PASS|FAIL (IN_REVIEW -> COMPLETED; FAIL auto-mints CRITICAL finding)"
    roles: [Auditor]
    code: 200
    input: [outcome]
    output: AuditEngagement
    side_effects: ["run.audit_status=AUDIT_PASSED|AUDIT_FAILED", "FAIL: auto AuditFinding(CRITICAL, OPEN)", "increments AuditEngagement.version by 1"]
  - method: GET
    path: "/hedis/audit-engagements/{id}/findings"
    description: "List findings of an engagement (FK reverse reachability) Results ordered by created_at ASC (mint order); where mint order follows a business key (population entries, chart chases) that order is member_ref ASC."
    roles: [QualityAdmin, QualityAnalyst, Auditor, QualityDirector]
    code: 200
    input: ["status?", "severity?", "limit?", "offset?"]
    output: "AuditFinding[]"
    side_effects: []
  - method: POST
    path: "/hedis/audit-findings"
    description: "File a finding on an engagement"
    roles: [Auditor]
    code: 201
    input: [engagement_id, severity, summary]
    output: AuditFinding
    side_effects: ["status=OPEN"]
  - method: POST
    path: "/hedis/audit-findings/{findingId}/resolve"
    description: "Resolve a finding (OPEN -> RESOLVED)"
    roles: [Auditor]
    code: 200
    input: []
    output: AuditFinding
    side_effects: ["increments AuditFinding.version by 1"]

# =============================================================================
# §1.6 Error Code Catalog (34 codes)
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing/empty" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Required field missing, enum value outside its declared set, or span_start > span_end" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role not permitted for this endpoint, or abstraction ownership check failed (PUT/submit/retract by non-author)" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or body FK id does not resolve" }
  - { id: ERR_PROVIDER_NOT_FOUND, http: 404, condition: "attributed_provider_ref does not resolve to an existing Provider.provider_ref" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_season_version / expected_measure_run_version does not match the parent's current version (OCC)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource's state machine forbids the transition, or a cross-entity state guard fails (sample not DRAWN, chase not RECEIVED, spec not ACTIVE, batch not RECEIVED, run not SUBMITTED at begin-review, etc.)" }
  - { id: ERR_RUN_NOT_SUBMITTABLE, http: 409, condition: "submit called while run.reporting_status != RATE_COMPUTED (checked before the deadline check)" }
  - { id: ERR_SEASON_NOT_OPEN, http: 409, condition: "submit called while the run's season is not OPEN" }
  - { id: ERR_SOD_SELF_OVERREAD, http: 403, condition: "Over-reader X-User-ID equals the abstraction's abstractor_user_id (segregation of duties)" }
  - { id: ERR_SOD_SUBMITTER_CERTIFY, http: 403, condition: "Certifier X-User-ID equals run.submitted_by_user_id (segregation of duties)" }
  - { id: ERR_SUBMISSION_DEADLINE_PASSED, http: 422, condition: "submit while logical clock now > season.submission_deadline (checked after run-state and season-state checks)" }
  - { id: ERR_OUTSIDE_ENGAGEMENT_WINDOW, http: 422, condition: "begin-review while logical clock now is outside [window_start, window_end)" }
  - { id: ERR_ENGAGEMENT_WINDOW_INVALID, http: 422, condition: "window_end <= window_start on engagement create" }
  - { id: ERR_UNAPPROVED_SUPPLEMENTAL_SOURCE, http: 422, condition: "accept: batch.source_type not in season.approved_supplemental_sources (checked before per-record denominator referential check)" }
  - { id: ERR_RECORD_MEMBER_NOT_IN_DENOMINATOR, http: 422, condition: "accept: at least one record references a member_ref absent from the run's non-excluded population entries" }
  - { id: ERR_DUPLICATE_MEASURE_CODE, http: 409, condition: "(season_id, hedis_measure_code) already exists" }
  - { id: ERR_DUPLICATE_MEMBER_REF, http: 409, condition: "member_ref already registered" }
  - { id: ERR_DUPLICATE_PROVIDER_REF, http: 409, condition: "provider_ref already registered" }
  - { id: ERR_SAMPLE_ALREADY_EXISTS, http: 409, condition: "run already has a sample" }
  - { id: ERR_DUPLICATE_ABSTRACTION, http: 409, condition: "a non-terminal abstraction already exists for this chase" }
  - { id: ERR_ENROLLMENT_OVERLAP, http: 409, condition: "CLOSED-interval overlap between enrollment segments of the same member (touching endpoints overlap)" }
  - { id: ERR_AUDITOR_WINDOW_OVERLAP, http: 409, condition: "HALF-OPEN window overlap between engagements of the same auditor_user_id (adjacent end == start allowed)" }
  - { id: ERR_METHOD_NOT_HYBRID, http: 422, condition: "POST /hedis/samples on an ADMINISTRATIVE run" }
  - { id: ERR_EXCLUSION_NOT_ALLOWED, http: 422, condition: "population-entry exclude on a HYBRID run whose sample already exists" }
  - { id: ERR_SAMPLE_BELOW_FLOOR, http: 422, condition: "eligible pool (non-excluded population entries) < spec.sample_size_floor at sample draw" }
  - { id: ERR_DENOMINATOR_ZERO, http: 422, condition: "compute-rate with denominator_count == 0" }
  - { id: ERR_CHASES_IN_FLIGHT, http: 422, condition: "finalize while a chase is REQUESTED or REJECTED_UNREADABLE" }
  - { id: ERR_UNABSTRACTED_CHARTS, http: 422, condition: "finalize while a RECEIVED chase lacks a submitted abstraction" }
  - { id: ERR_OVERREADS_OUTSTANDING, http: 422, condition: "finalize while a SUBMITTED requires_overread abstraction lacks an over-read" }
  - { id: ERR_IRR_NOT_PASSED, http: 422, condition: "finalize while any abstraction requires_overread and irr_state != PASSED" }
  - { id: ERR_RUN_NOT_CERTIFIABLE, http: 422, condition: "certify (CERTIFIED) while audit_status != AUDIT_PASSED or OPEN CRITICAL findings exist via engagement link" }
  - { id: ERR_DUPLICATE_SERVICE_DATE, http: 409, condition: "identical (member_ref, service_date, evidence_code) record already exists in the same batch at create time" }

# =============================================================================
# §1.7 RBAC Matrix (segregation_of_duties model; all roles opaque)
# =============================================================================
roles:
  - name: QualityAdmin
    description: "Quality department administrator; owns reference data: clock, seasons, spec loads, members, enrollment, providers"
    identity: opaque
    exclusive_operations:
      - "POST /hedis/_clock/set_current_utc"
      - "POST /hedis/seasons; POST .../open; POST .../close-submission"
      - "POST /hedis/measure-specifications; POST .../activate; POST .../retire"
      - "POST /hedis/members; POST /hedis/enrollment-segments; POST /hedis/providers"
    shared_operations:
      - "All GET endpoints"
  - name: QualityAnalyst
    description: "Quality analyst; runs population identification, sampling, chases, rates, submission, supplemental data"
    identity: opaque
    exclusive_operations:
      - "POST /hedis/measure-runs; POST .../identify-population; POST .../compute-rate; POST .../submit; POST .../reopen"
      - "POST /hedis/samples; POST .../finalize; POST .../evaluate-irr"
      - "POST /hedis/population-entries/{id}/exclude"
      - "POST /hedis/chart-chases/{id}/receive|reject-unreadable|rechase|withdraw|mark-excluded"
      - "POST /hedis/supplemental-batches(+screen/accept/reject); POST /hedis/supplemental-records"
    shared_operations:
      - "All GET endpoints"
  - name: Abstractor
    description: "Certified chart abstractor; creates and edits own abstractions"
    identity: opaque
    exclusive_operations:
      - "POST /hedis/abstractions; PUT /hedis/abstractions/{id}; POST .../submit; POST .../retract (own rows only: X-User-ID == abstractor_user_id)"
    shared_operations:
      - "All GET endpoints"
  - name: OverReader
    description: "Over-read reviewer; must differ from the abstractor of the reviewed abstraction (SoD)"
    identity: opaque
    exclusive_operations:
      - "POST /hedis/over-reads"
    shared_operations:
      - "All GET endpoints except /hedis/measure-runs/{runId}/gap-items and gap-burden are unrestricted; over-read listing included"
  - name: ProviderRelations
    description: "Provider outreach coordinator; works the gap list"
    identity: opaque
    exclusive_operations:
      - "POST /hedis/gap-items/{id}/mark-outreach-done; POST /hedis/gap-items/{id}/close"
    shared_operations:
      - "GET gap list endpoints; all other GET endpoints"
  - name: Auditor
    description: "Licensed HEDIS auditor; runs engagements and files/resolves findings"
    identity: opaque
    exclusive_operations:
      - "POST /hedis/audit-engagements; POST .../begin-review; POST .../complete"
      - "POST /hedis/audit-findings; POST .../resolve"
    shared_operations:
      - "All GET endpoints"
  - name: QualityDirector
    description: "Quality director; certifies submitted measures; must not be the run's submitter (SoD)"
    identity: opaque
    exclusive_operations:
      - "POST /hedis/measure-runs/{id}/certify"
    shared_operations:
      - "All GET endpoints"
