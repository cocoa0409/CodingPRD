        distinguishing_aspect: "One endpoint is genuinely shared by two roles with different identity models: the ProviderAdmin drives ENABLE and SUSPEND on its own customer while the opaque Regulator drives RESTORE on the same row, and the assignment cascade fires identically no matter which role issued the action."
