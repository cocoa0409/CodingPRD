      excluded_because:
        difficulty_instance: transitive_cascade / overdue_sweep_cascades_four_levels_to_franchise_agreement
        rationale: Two machines advance from a single sweep call - the corrective action's remediation track and the location's franchise-agreement track - and the difficulty instance already asserts both
          end states plus the ledger row that couples them, so a corner duplicate would add no discrimination.
