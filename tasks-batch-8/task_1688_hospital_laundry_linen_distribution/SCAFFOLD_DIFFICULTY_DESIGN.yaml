            - "ParLevel.${p1}: effective_par == 30 (ceil(20*1.5)), on_hand == 30 (waterfall: CRITICAL first, deficit 10 filled from S1 reserve 10)"
            - "ParLevel.${p3}: effective_par == 15, on_hand == 10 (S1 reserve exhausted by U1; STANDARD unit gets 0)"
            - "ParLevel.${p2}: effective_par == 45, on_hand == 45 (S2 reserve 20 - 15 = 5)"
            - "LinenStock.${s1}.reserve_pieces == 0 and LinenStock.${s2}.reserve_pieces == 5"

