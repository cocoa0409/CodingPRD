  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: blocked_pair_count_conservation
        grounds:
          - entities.Importer.fields.blocked_pair_count
          - entities.CorrectiveAction.fields.pre_action_blocked_pair_count
          - state_machines.CorrectiveAction.transitions.IMPORT_SUSPENSION_to_CLOSED_RESOLVED
          - state_machines.EntrySubmission.transitions.HELD_to_ACCEPTED
          - endpoints["POST /fsvp/corrective-actions/{id}/closure"]
        distinguishing_aspect: "Conserved quantity = Importer.blocked_pair_count: it is 0 before the FAIL attestation, 1 while the pair is blocked and the import suspension is in force, and must return to EXACTLY the recorded pre_action_blocked_pair_count of 0 on CLOSE_RESOLVED — not 1 (forgotten unblock) and not -1 (double decrement) — while the held entry line returns to ACCEPTED with held_reason null."
