              as: LicensingOfficer
            - call: "POST /mft/licensees/${sup_id}/activate"
              payload: {}
              as: LicensingOfficer
            - call: "POST /mft/licensees"
              payload: { legal_name: "Ridgeway Fuel Distribution Inc", fein: "41-1000002", license_type: "DISTRIBUTOR", mailing_state: "MN", gross_net_election: "NET" }
              as: LicensingOfficer
              captures: { dist_id: $.data.id, dist_v0: $.data.version }
            - call: "POST /mft/licensees/${dist_id}/bonds"
              payload: { amount_cents: 1500000, surety_name: "Granite Surety Co", effective_date: "2026-07-01", expected_licensee_version: "${dist_v0}" }
              as: LicensingOfficer
              captures: { dist_bond_id: $.data.id }
            - call: "POST /mft/licensees/${dist_id}/activate"
              payload: {}
              as: LicensingOfficer
            - call: "POST /mft/licensees/${dist_id}/revoke"
              payload: { reason: "Evasion referral - licence revoked" }
              as: LicensingOfficer
            - call: "POST /mft/terminals"
              payload: { terminal_control_number: "T41-MN-2553", name: "Saint Paul Park Rack", state_code: "MN" }
              as: LicensingOfficer
              captures: { term_id: $.data.id }
          trigger:
            - call: "POST /mft/rack-removals"
              payload: { terminal_id: "${term_id}", position_holder_licensee_id: "${sup_id}", purchaser_licensee_id: "${dist_id}", product_code: "UNDYED_DIESEL", gross_gallons: 8000.00, net_gallons: 7960.00, removal_date: "2026-07-15", destination_state: "MN", bill_of_lading_number: "BOL-CONF-0001" }
              as: ReturnsExaminer
          assert:
            - "the trigger returns 422 with error_id == ERR_PURCHASER_LICENSE_INVALID (priority 100 wins)"
            - "the trigger does NOT return ERR_PURCHASER_BOND_DEFICIENT even though priority 500 is also violated"
            - "Licensee.${dist_id}.status == REVOKED, posted_bond_cents == 0, required_bond_cents == 1500000, bond_deficiency_cents == 1500000"
            - "BondInstrument.${dist_bond_id}.status == FORFEITED with release_reason == LICENSE_REVOKED"
            - "GET /mft/rack-removals filtered by purchaser_licensee_id == ${dist_id} returns total_count 0 (no row was written)"

