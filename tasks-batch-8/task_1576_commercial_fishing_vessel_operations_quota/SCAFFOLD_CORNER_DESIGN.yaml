          assert:
            - "error_id == ERR_SETTLEMENT_UNDERWATER (http 422): net_before_fee == 40000 - 50000 < 0"

  # -------------------------------------------------------------- endpoints ---
  - section: endpoints
    instances:
      - name: pagination_limit_offset_has_more
        claim_type: listing
        grounds:
          - response_envelope
        distinguishing_aspect: "Pagination fields limit/offset/total_count/has_more behave with the declared defaults (default limit 10) across three trips."
        test_recipe:
          setup: ["one vessel with three PLANNED trips on one opening"]
          setup_api_calls:
            - { call: "POST /vessels", payload: { vessel_name: "FV Aurora", license_number: "LIC-P1", home_port: "HOMER", length_ft: 58, observer_coverage_class: "PARTIAL" }, as: FisheriesRegulator, captures: { v1: $.data.id } }
            - { call: "POST /vessels/${v1}/activate", as: FisheriesRegulator }
            - { call: "POST /vessels/${v1}/permits", payload: { fishery_code: "HALIBUT", gear_type: "LONGLINE", valid_from: "2026-01-01T00:00:00Z", valid_to: "2026-12-31T23:59:59Z" }, as: FisheriesRegulator }
            - { call: "POST /season-openings", payload: { fishery_code: "HALIBUT", area_code: "3A", opens_at: "2026-08-05T00:00:00Z", closes_at: "2026-08-25T00:00:00Z", tac_pounds: 100000 }, as: FisheriesRegulator, captures: { o1: $.data.id } }
            - { call: "POST /fishing-trips", payload: { vessel_id: "${v1}", season_opening_id: "${o1}", planned_departure_utc: "2026-08-10T06:00:00Z", planned_return_utc: "2026-08-12T06:00:00Z" }, as: VesselOwner, as_user_id: "${v1}" }
            - { call: "POST /fishing-trips", payload: { vessel_id: "${v1}", season_opening_id: "${o1}", planned_departure_utc: "2026-08-12T06:00:00Z", planned_return_utc: "2026-08-14T06:00:00Z" }, as: VesselOwner, as_user_id: "${v1}" }
            - { call: "POST /fishing-trips", payload: { vessel_id: "${v1}", season_opening_id: "${o1}", planned_departure_utc: "2026-08-14T06:00:00Z", planned_return_utc: "2026-08-16T06:00:00Z" }, as: VesselOwner, as_user_id: "${v1}" }
          trigger:
            - { call: "GET /fishing-trips?limit=2&offset=0", as: FisheriesRegulator }
            - { call: "GET /fishing-trips?limit=2&offset=2", as: FisheriesRegulator }
          assert:
            - "page 1: 2 rows, total_count == 3, has_more == true"
            - "page 2: 1 row, total_count == 3, has_more == false"
            - "no params: default limit 10 returns all 3 rows"

      - name: response_envelope_success_and_error
        claim_type: listing
        grounds:
          - response_envelope
        distinguishing_aspect: "Every response carries meta.api_request_id, meta.api_request_timestamp, response_type; errors carry data.error_id and data.message."
        test_recipe:
          setup: ["nothing beyond one vessel"]
          setup_api_calls:
            - { call: "POST /vessels", payload: { vessel_name: "FV Aurora", license_number: "LIC-P2", home_port: "HOMER", length_ft: 58, observer_coverage_class: "PARTIAL" }, as: FisheriesRegulator, captures: { v1: $.data.id } }
          trigger:
            - { call: "GET /vessels/${v1}", as: FisheriesRegulator }
            - { call: "GET /vessels/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", as: FisheriesRegulator, captures: { err: $.data.error_id } }
          assert:
            - "success body: meta.api_request_id present, response_type == object, data holds the Vessel"
            - "error body: response_type == error, data.error_id == ERR_VESSEL_NOT_FOUND, data.message present"

      - name: availability_computed_read_fields
        claim_type: computed_read
        grounds:
          - calculations.available_quota
        excluded_because:
          difficulty_instance: quota_committed_vs_conservative_divergence
          rationale: "Both availability variants and their delta are asserted there."

  # ----------------------------------------------------------------- errors ---
  - section: errors
    instances:
      - name: clock_regression_rejected
        claim_type: violation_to_error
        grounds:
          - errors[ERR_CLOCK_REGRESSION]
        distinguishing_aspect: "The logical clock is monotonic; setting it backwards (or to the same instant) is rejected."
        test_recipe:
          setup: ["clock advanced to 2026-08-10"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: FisheriesRegulator }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T00:00:00Z" }, as: FisheriesRegulator, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_CLOCK_REGRESSION (http 400); clock stays at 2026-08-10T00:00:00Z"

      - name: gear_event_illegal_rejected
        claim_type: violation_to_error
        grounds:
          - calculations.gear_operational_units
          - errors[ERR_INVALID_GEAR_EVENT]
        distinguishing_aspect: "MAINTENANCE_START for more units than units_operational (and MAINTENANCE_END beyond units_in_maintenance) is rejected; the projection never goes negative."
        test_recipe:
          setup: ["gear asset LONGLINE units_total 4"]
          setup_api_calls:
            - { call: "POST /vessels", payload: { vessel_name: "FV Aurora", license_number: "LIC-ER2", home_port: "HOMER", length_ft: 58, observer_coverage_class: "PARTIAL" }, as: FisheriesRegulator, captures: { v1: $.data.id } }
            - { call: "POST /vessels/${v1}/activate", as: FisheriesRegulator }
            - { call: "POST /vessels/${v1}/gear-assets", payload: { gear_type: "LONGLINE", units_total: 4 }, as: VesselOwner, as_user_id: "${v1}", captures: { g1: $.data.id } }
          trigger:
            - { call: "POST /gear-assets/${g1}/events", payload: { event_type: "MAINTENANCE_START", units: 5, occurred_at: "2026-08-02T00:00:00Z" }, as: VesselOwner, as_user_id: "${v1}", captures: { err: $.data.error_id } }
            - { call: "POST /gear-assets/${g1}/events", payload: { event_type: "MAINTENANCE_END", units: 1, occurred_at: "2026-08-02T01:00:00Z" }, as: VesselOwner, as_user_id: "${v1}", captures: { err2: $.data.error_id } }
          assert:
            - "MAINTENANCE_START 5 of 4 operational -> ERR_INVALID_GEAR_EVENT (http 422)"
            - "MAINTENANCE_END with 0 in maintenance -> ERR_INVALID_GEAR_EVENT"
            - "GearAsset.units_operational == 4 and units_in_maintenance == 0 after both rejections"

  # ------------------------------------------------------------------- rbac ---
  - section: rbac
    instances:
      - name: rbac_crew_member_cannot_create_vessel
        claim_type: role_denial
        grounds:
          - roles[VesselOwner]
          - errors[ERR_FORBIDDEN_ROLE]
        distinguishing_aspect: "CrewMember is excluded from POST /vessels (FisheriesRegulator-only)."
        test_recipe:
          setup: ["nothing"]
          setup_api_calls: []
          trigger:
            - { call: "POST /vessels", payload: { vessel_name: "FV X", license_number: "LIC-R1", home_port: "HOMER", length_ft: 40, observer_coverage_class: "EXEMPT" }, as: CrewMember, as_user_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_FORBIDDEN_ROLE (http 403)"

      - name: rbac_observer_cannot_adjudicate_violation
        claim_type: role_denial
        grounds:
          - roles[Observer]
        distinguishing_aspect: "Adjudication is regulator-only; observers report but never judge."
        test_recipe:
          setup: ["one vessel and one OPEN violation"]
          setup_api_calls:
            - { call: "POST /vessels", payload: { vessel_name: "FV Aurora", license_number: "LIC-R2", home_port: "HOMER", length_ft: 58, observer_coverage_class: "PARTIAL" }, as: FisheriesRegulator, captures: { v1: $.data.id } }
            - { call: "POST /violations", payload: { vessel_id: "${v1}", violation_type: "MANUAL_CITATION", details: "logbook" }, as: FisheriesRegulator, captures: { n1: $.data.id } }
          trigger:
            - { call: "POST /violations/${n1}/adjudicate", as: Observer, as_user_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_FORBIDDEN_ROLE (http 403); violation stays OPEN"

      - name: rbac_captain_cannot_verify_landing
        claim_type: role_denial
        grounds:
          - roles[Captain]
        distinguishing_aspect: "The captain declares the landing; only the regulator verifies it (segregation of duties between reporter and verifier)."
        test_recipe:
          setup: ["trip RETURNED with SUBMITTED declaration"]
          setup_api_calls:
            - { call: "POST /vessels", payload: { vessel_name: "FV Aurora", license_number: "LIC-R3", home_port: "HOMER", length_ft: 58, observer_coverage_class: "PARTIAL" }, as: FisheriesRegulator, captures: { v1: $.data.id } }
            - { call: "POST /vessels/${v1}/activate", as: FisheriesRegulator }
