  # ---------------------------------------------------------------------------
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_classification_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[case-reclassification-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Two strictly sequential classification creates: the first advances case.version 1->2; the second, still carrying expected_case_version=1, is rejected 412 ERR_STALE_VERSION — supersede is legitimate, staleness is not."
        test_recipe:
          setup: ["Case created (version 1)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T10:00:00Z" }, as: SystemAdmin }
            - { call: "POST /api/hospital-units", payload: { name: "ED", category: "EMERGENCY" }, as: SystemAdmin, captures: { u1: $.data.id } }
            - { call: "POST /api/patient-cases", payload: { patient_ref: "P-0601", unit_id: "${u1}", received_at: "2026-08-03T09:00:00Z", channel: "PHONE", description: "Concern", grievance_category: "OTHER" }, as: IntakeCoordinator, captures: { c1: $.data.id, c1v: $.data.version } }
          trigger:
            - { call: "POST /api/patient-cases/${c1}/classification-decisions", payload: { decision: "COMPLAINT", rationale_code: "INITIAL_INTAKE", expected_case_version: "${c1v}" }, as: IntakeCoordinator, captures: { d1: $.data.id } }
            - { call: "POST /api/patient-cases/${c1}/classification-decisions", payload: { decision: "GRIEVANCE", rationale_code: "ESCALATION_OF_CONCERN", expected_case_version: "${c1v}" }, as: IntakeCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "First create succeeded (201) and advanced case.version to 2"
            - "err == 'ERR_STALE_VERSION' and HTTP 412 (stale expected_case_version == 1)"
            - "GET /api/patient-cases/${c1} classification still == 'COMPLAINT' (supersede did not apply)"

      - name: occ_stale_assignment_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[case-assignment-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Same OCC shape on the assignments endpoint: after a successful PRIMARY assignment bumps the case version, a second create carrying the pre-assignment version -> 412 ERR_STALE_VERSION."
        test_recipe:
          setup: ["Case CLASSIFIED at version 2; investigators inv1, inv2"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T10:00:00Z" }, as: SystemAdmin }
            - { call: "POST /api/hospital-units", payload: { name: "ED", category: "EMERGENCY" }, as: SystemAdmin, captures: { u1: $.data.id } }
            - { call: "POST /api/staff-members", payload: { full_name: "Ivy One", capabilities: ["INVESTIGATOR"] }, as: SystemAdmin, captures: { inv1: $.data.id } }
            - { call: "POST /api/staff-members", payload: { full_name: "Ivy Two", capabilities: ["INVESTIGATOR"] }, as: SystemAdmin, captures: { inv2: $.data.id } }
            - { call: "POST /api/staff-members", payload: { full_name: "Dana Director", capabilities: ["DIRECTOR"] }, as: SystemAdmin, captures: { dir: $.data.id } }
            - { call: "POST /api/patient-cases", payload: { patient_ref: "P-0602", unit_id: "${u1}", received_at: "2026-08-03T09:00:00Z", channel: "PHONE", description: "Concern", grievance_category: "OTHER" }, as: IntakeCoordinator, captures: { c1: $.data.id, c1v: $.data.version } }
            - { call: "POST /api/patient-cases/${c1}/classification-decisions", payload: { decision: "GRIEVANCE", rationale_code: "INITIAL_INTAKE", expected_case_version: "${c1v}" }, as: IntakeCoordinator }
            - { call: "GET /api/patient-cases/${c1}", as: PatientRelationsDirector, as_user_id: "${dir}", captures: { c1v2: $.data.version } }
          trigger:
            - { call: "POST /api/patient-cases/${c1}/assignments", payload: { investigator_id: "${inv1}", expected_case_version: "${c1v2}" }, as: PatientRelationsDirector, as_user_id: "${dir}", captures: { as1: $.data.id } }
            - { call: "POST /api/patient-cases/${c1}/assignments", payload: { investigator_id: "${inv2}", expected_case_version: "${c1v2}" }, as: PatientRelationsDirector, as_user_id: "${dir}", captures: { err: $.data.error_id } }
          assert:
            - "First assignment 201 (inv1 ACTIVE, version now 3)"
            - "err == 'ERR_STALE_VERSION' (second create carried version 2)"
            - "GET /api/case-assignments?case_id=${c1}&status=ACTIVE has exactly 1 row (inv1) — no supersede occurred"

      - name: cascade_side_effects_reopen_chain
        claim_type: cascading_side_effects
        grounds: [state_machines.PatientCase.CLOSED_to_REOPENED]
        excluded_because:
          difficulty_instance: transitive_cascade / poor_satisfaction_score_reopen_cascade
          rationale: "N-level cascade asserted hop-by-hop in the named §1.8 instance."

      - name: dual_variant_timeline_layer
        claim_type: dual_variant_calculation
        grounds: [calculations.regulatory_due_dates]
        excluded_because:
          difficulty_instance: dual_variant_calc / case_timeline_calendar_vs_business_variants
          rationale: "Both variants and their divergence asserted in the named §1.8 instance."

      - name: rate_threshold_systemic_layer
        claim_type: rate_threshold_triggers
        grounds: [calculations.systemic_issue_threshold]
        excluded_because:
          difficulty_instance: boundary_precision_check / third_grievance_triggers_systemic_escalation
          rationale: "Cumulative threshold boundary (2 vs 3) asserted in the named §1.8 instance."

      - name: derived_counters_reconciled_immediately
        claim_type: derived_field_reconciliation
        grounds: [entities.HospitalUnit.fields.open_case_count, entities.StaffMember.fields.open_assignment_count]
        excluded_because:
          difficulty_instance: compensating_invariant / assign_release_supersede_conserves_open_count
          rationale: "Counter reconciliation after assign/release/supersede asserted in the named §1.8 instance; closure-side reconciliation in corner instance closure_completes_assignments_and_creates_followup."

