  - name: requisition_for_an_unknown_client_id_returns_not_found
    claim_type: parent_relationships
    grounds: entities.RoleRequisition.client_id (FK -> Client.id); validations.payload_reference_exists;
      errors[ERR_CLIENT_NOT_FOUND]
    distinguishing_aspect: The parent is resolved from the request body, so an unknown client_id is a
