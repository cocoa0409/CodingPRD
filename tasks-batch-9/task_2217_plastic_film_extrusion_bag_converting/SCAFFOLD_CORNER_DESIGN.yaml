            - { call: "GET /regrind-pools/${pool_fd}/balance", payload: {}, as: QualityManager }
          assert:
            - "POST /film-rolls/${roll3}/scrap -> 200 and FilmRoll.${roll3}.status == SCRAPPED"
            - "RegrindPool.${pool_fd}.cumulative_in_kg == 62.000 and available_kg == 62.000"
            - "RegrindPool.${pool_fd}.generation_count == 2 and embedded_pcr_pct == 0.000"
            - "GET /regrind-transactions filtered by pool_id ${pool_fd} would return two IN rows (12.000 and 50.000)"
      - name: start_print_enforces_its_transition_preconditions
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /print-jobs/{id}/start-print]
        excluded_because:
          difficulty_instance: non_linear_state_machine / print_job_registration_and_color_dimensions_advance_independently
          rationale: "The precondition matrix for this action endpoint is enumerated in the named 1.8 instance."
  - section: errors
    instances:
      - name: reusing_a_product_code_is_rejected
        claim_type: error_triggerable
        grounds:
          - validations[priority=7]
          - errors[ERR_DUPLICATE_CODE]
        distinguishing_aspect: "Uniqueness is checked at priority 7, after schema and FK resolution but before every state and business rule, and the second POST leaves the first row untouched."
        test_recipe:
          setup:
            - "product P-NF-1 already registered"
          setup_api_calls:
            - *a_clock_d1_0600
            - *a_p_nf
          trigger:
            - { call: "POST /products", payload: { product_code: "P-NF-1", customer_code: "CUST-NF", bag_style: "GUSSETED", food_contact_required: false, target_gauge_micron: 40.0, gauge_tolerance_pct: 10.0, layflat_width_mm: 400.0, bag_length_mm: 600.0, gusset_depth_mm: 60.0, perforation_required: true, min_bottom_seal_n_per_15mm: 18.0, min_strength_index: 25.0, max_regrind_pct_food: 10.0, max_regrind_pct_nonfood: 35.0, declared_recycled_content_pct: 0.0, assumed_regrind_pcr_pct: 25.0, bags_per_case: 250, min_partial_case_bags: 100, cases_per_pallet: 30, count_accuracy_tolerance_pct: 3.0, required_layer_count: 1 }, as: PlantAdmin }
          assert:
            - "the second POST /products -> 409 ERR_DUPLICATE_CODE"
            - "GET /products filtered by customer_code CUST-NF returns total_count 1"
      - name: completing_a_run_with_scrap_but_no_matching_pool_is_rejected
        claim_type: error_triggerable
        grounds:
          - errors[ERR_NO_ELIGIBLE_REGRIND_POOL]
          - calculations.pool_mass_balance
        distinguishing_aspect: "Scrap must always land somewhere: with no LLDPE / NON_FOOD_ONLY pool in the database the completion cannot book its 100.0 kg and is refused outright rather than silently dropping the mass."
        test_recipe:
          setup:
            - "RUN-NF-1 RUNNING with five 40.0 micron readings and NO regrind pool created at all"
          setup_api_calls:
            - *a_clock_d1_0600
            - *a_p_nf
            - *a_g_ll
            - *a_line_nf
            - *a_r0_new
            - *a_r0_c1
            - *a_r0_sub
            - *a_r0_app
            - *a_run1_new
            - *a_run1_start
            - *a_g1_40
            - *a_g1_40
            - *a_g1_40
            - *a_g1_40
            - *a_g1_40
          trigger:
            - { call: "POST /extrusion-runs/${run1}/complete", payload: { gross_output_kg: 500.0, scrap_kg: 100.0 }, as: ExtrusionOperator }
          assert:
            - "POST /extrusion-runs/${run1}/complete -> 409 ERR_NO_ELIGIBLE_REGRIND_POOL"
            - "ExtrusionRun.${run1}.status == RUNNING and net_output_kg == null"
            - "GET /regrind-pools returns total_count 0"
