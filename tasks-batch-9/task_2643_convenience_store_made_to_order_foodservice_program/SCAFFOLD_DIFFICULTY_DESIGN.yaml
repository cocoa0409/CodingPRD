              payload: { store_id: "${store_id}", menu_item_id: "${pretzel_id}", holding_unit_id: "${unit_id}", slot_index: 1, planned_qty: 24, bake_start_at: "2026-08-01T10:39:00Z" }
              as: KitchenAssociate
              captures: { err_id: $.data.error_id }
