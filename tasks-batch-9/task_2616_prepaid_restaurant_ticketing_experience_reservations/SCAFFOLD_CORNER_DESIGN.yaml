      - name: priority_ordering_unauthorized_beats_pagination_and_not_found_beats_state
        claim_type: Priority Ordering
        grounds:
          - validations.priority_3_ERR_UNAUTHORIZED
          - validations.priority_8_ERR_INVALID_PAGINATION
          - validations.priority_5_ERR_RESTAURANT_NOT_FOUND
        distinguishing_aspect: "A request that breaks two rules at once always yields the lower-priority-number error: a Guest listing guests with limit 0 gets 403 not 400, and an action on a non-existent id gets 404 rather than the 409 or 422 its body would otherwise earn."
        test_recipe:
          setup:
            - "one restaurant, two guests; no other state is required"
            - "logical clock pinned at 2026-09-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /restaurants"
              payload: { name: "Corner Priority House", service_charge_bp: 725, hold_ttl_minutes: 20, offer_ttl_minutes: 15, max_offer_rounds: 2, goodwill_credit_cap_cents: 20000, prep_lead_minutes: 45, refund_scrutiny_threshold_cents: 300000 }
              as: PlatformAdmin
              captures: { r_id: $.data.id }
            - call: "POST /guests"
              payload: { email: "prio-a@corner.test", display_name: "Priority Guest A" }
              as: PlatformAdmin
              captures: { ga_id: $.data.id }
          trigger:
            - call: "GET /guests?limit=0"
              payload: {}
              as: Guest
              as_user_id: "${ga_id}"
              captures: { e_role_first: $.data.error_id }
            - call: "GET /guests?limit=0"
              payload: {}
              as: PlatformAdmin
              captures: { e_limit_low: $.data.error_id }
            - call: "GET /guests?limit=101"
              payload: {}
              as: PlatformAdmin
              captures: { e_limit_high: $.data.error_id }
            - call: "GET /guests?offset=-1"
              payload: {}
              as: PlatformAdmin
              captures: { e_offset: $.data.error_id }
            - call: "GET /guests?limit=100&offset=0"
              payload: {}
              as: PlatformAdmin
              captures: { ok_first: "$.data[0].id" }
            - call: "POST /services"
              payload: { restaurant_id: "rst_missing", service_date: "2026-09-10", meal_period: "DINNER", seating_start_utc: "2026-09-11T02:00:00Z", seating_end_utc: "2026-09-10T22:00:00Z", turn_time_minutes: 150, seats_capacity: 20 }
              as: RestaurantManager
              as_user_id: "rst_missing"
              captures: { e_missing_parent: $.data.error_id }
          assert:
            - "${e_role_first} == ERR_UNAUTHORIZED with HTTP 403: GET /guests excludes the Guest role, and priority 3 pre-empts the priority 8 pagination rule that limit=0 also breaks"
            - "${e_limit_low} == ERR_INVALID_PAGINATION with HTTP 400 for limit 0, one below the inclusive floor of 1"
            - "${e_limit_high} == ERR_INVALID_PAGINATION with HTTP 400 for limit 101, one above the inclusive ceiling of 100"
            - "${e_offset} == ERR_INVALID_PAGINATION with HTTP 400 for a negative offset"
            - "limit=100 with offset=0 returns 200 with total_count 1, has_more false and ${ok_first} == ${ga_id}: both extremes of the legal window are accepted"
            - "${e_missing_parent} == ERR_RESTAURANT_NOT_FOUND with HTTP 404 even though the body also inverts seating_start_utc and seating_end_utc, which would otherwise be an ERR_VALIDATION at priority 7"

      - name: priority_conflict_not_sellable_beats_insufficient_seats
        claim_type: Priority conflict
