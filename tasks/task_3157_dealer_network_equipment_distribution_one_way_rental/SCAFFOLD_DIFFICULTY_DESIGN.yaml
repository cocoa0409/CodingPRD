  # =====================================================================
  # Rule 4 — transitive_cascade (depth >= 3 and depth >= 2)
  # =====================================================================
  - rule_id: transitive_cascade
    instances:
      - name: return_cascade_unit_handoff_imbalance_future_quote
        grounds:
          - state_machines.RentalAgreement.ACTIVE_to_RETURNED
          - state_machines.EquipmentUnit.OUT_to_AVAILABLE
          - calculations.lane_imbalance
          - calculations.quote_rated_price
        distinguishing_aspect: |
          Depth-3 cascade: agreement return -> unit OUT->AVAILABLE with dealer
          handoff (hop 1) -> lane_imbalance recomputed on the touched lane
          (hop 2, caused by the unit landing, not by the return directly) ->
          imbalance_factor crossing IMBALANCE_THRESHOLD changes the surcharge
          on the NEXT quote for the same lane (hop 3, caused by the factor
          change). A new reservation on the same lane prices differently purely
          because of the earlier return.
        test_recipe:
          setup:
            - "Locations A (NORTH) and B (SOUTH); dealers DA at A, DB at B"
            - "ACTIVE rate A->B TRUCK_10FT OFF_PEAK base 5000, surcharge 2000, commission 0.10"
            - "Exactly 2 TRUCK_10FT units in fleet (fleet_total = 2): U1 at DA, U2 already returned at B (so net_flow A->B counts once U2's agreement is RETURNED — arrange one prior completed one-way A->B return)"
            - "After the prior return, forward-looking imbalance includes that net_flow=1: factor = 1 + 0.5*(1+0)/2 = 1.25 > 1.0, so the surcharge flips ON for new quotes on lane A->B"
            - "Customer C2 quotes the same lane AFTER the prior return"
          setup_api_calls:
            - call: "POST /rental-network/locations"
              payload: { location_code: "PHX-07", city: "Phoenix", geo_zone: "NORTH", storage_capacity: 10 }
              as: NetworkAdmin
              captures: { loc_a: $.data.id }
            - call: "POST /rental-network/locations"
              payload: { location_code: "TUS-07", city: "Tucson", geo_zone: "SOUTH", storage_capacity: 10 }
