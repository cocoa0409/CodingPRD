            - { call: "POST /api/customers", payload: { name: "Buyer OC1", customer_code: "CUST-OC1", credit_limit_cents: 100000000, allocation_tier: "TIER_1" }, as: DeskAdmin, captures: { cust_id: "$.data.id" } }
            - { call: "POST /api/price-sheets", payload: { week_start_date: "2026-08-03" }, as: Trader, captures: { s1_id: "$.data.id" } }
            - { call: "POST /api/price-sheets/${s1_id}/lines", payload: { product_id: "${rib_id}", price_per_lb_cents: 700, weekly_supply_lbs: 100000 }, as: Trader, captures: { line_id: "$.data.id" } }
