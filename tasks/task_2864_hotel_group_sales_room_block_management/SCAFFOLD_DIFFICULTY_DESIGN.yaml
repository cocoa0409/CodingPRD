            - call: "POST /group-sales/function-space-holds"
              payload: { lead_id: "${lead_id}", space_code: "GRAND_BALLROOM", start_at: "2026-11-09T09:00:00Z", end_at: "2026-11-09T12:00:00Z", attendee_count: 120 }
              as: SalesManager
              as_user_id: "sm-001"
              captures: { hold1_id: "$.data.id", hold1_status: "$.data.status" }
          trigger:
            - call: "POST /group-sales/function-space-holds"
              payload: { lead_id: "${lead_id}", space_code: "GRAND_BALLROOM", start_at: "2026-11-09T12:00:00Z", end_at: "2026-11-09T13:00:00Z", attendee_count: 40 }
              as: SalesManager
              as_user_id: "sm-001"
              captures: { buffer_error: "$.data.error_id" }
            - call: "POST /group-sales/function-space-holds"
              payload: { lead_id: "${lead_id}", space_code: "SALON_A", start_at: "2026-11-09T12:00:00Z", end_at: "2026-11-09T13:00:00Z", attendee_count: 40 }
              as: SalesManager
              as_user_id: "sm-001"
              captures: { other_space_id: "$.data.id", other_space_status: "$.data.status" }
            - call: "POST /group-sales/function-space-holds"
              payload: { lead_id: "${lead_id}", space_code: "GRAND_BALLROOM", start_at: "2026-11-09T12:45:00Z", end_at: "2026-11-09T14:00:00Z", attendee_count: 60 }
              as: SalesManager
              as_user_id: "sm-001"
              captures: { at_buffer_id: "$.data.id", at_buffer_status: "$.data.status" }
            - call: "POST /group-sales/function-space-holds/${hold1_id}/release"
