# =============================================================================
# SCAFFOLD — 1099 Vendor Reporting & W-9 Collection (accounts payable tax reporting)
# §1.0–§1.7 only. §1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml;
# §1.9 lives in SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  1099 Vendor Reporting & W-9 Collection (accounts payable tax reporting): vendor
  onboarding TIN collection & TIN matching, 1099-eligible classification by payment
  type & box mapping, backup withholding trigger & remittance, corrections & B-notice
  response process, state direct-reporting requirements, e-filing threshold &
  transmittal, payment aggregation across systems & duplicate vendor cleanup,
  recipient copy delivery

domain_name: vendor-tax-reporting-1099
api_prefix: /tax1099

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - rate_threshold_triggers
    - derived_field_reconciliation
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - self_referential
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (flat topology — peers linked by FK fields)
# =============================================================================
entities:
  - name: TaxYear
    parent: null
    common_fields: true
    fields:
      - { name: tax_year, type: integer, source: input, description: "Calendar year, e.g. 2025. Unique across TaxYear rows." }
      - { name: period_start, type: datetime, source: input, description: "Inclusive start of the covered period (ISO8601 UTC)." }
      - { name: period_end_exclusive, type: datetime, source: input, description: "Exclusive end of the covered period; half-open interval [period_start, period_end_exclusive)." }
      - { name: efiling_threshold_count, type: integer, source: input, default: 10, description: "Qualifying-return count at or above which all transmittals for the year must be e-filed." }
      - { name: nec_reportable_threshold_cents, type: integer, source: input, default: 60000, description: "Minimum aggregate NEC reportable cents that triggers an NEC return for a vendor-year (>=)." }
      - { name: misc_reportable_threshold_cents, type: integer, source: input, default: 60000, description: "Minimum aggregate MISC reportable cents that triggers a MISC return for a vendor-year (>=)." }
      - { name: recipient_copy_deadline, type: datetime, source: input, description: "Latest logical-clock instant at which recipient copy delivery is accepted (inclusive)." }
      - { name: backup_withholding_rate_bps, type: integer, source: system, default: 2400, description: "Backup withholding rate in basis points (2400 = 24%)." }
      - { name: status, type: enum, source: system, description: "OPEN | CLOSED", constraints: "OPEN at creation; CLOSED via close action" }

  - name: Vendor
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Vendor legal name as it should appear on filings." }
      - { name: tin, type: string, source: input, default: null, description: "9-digit taxpayer identification number; nullable at create, populated from a MATCHED W-9.", constraints: "exactly 9 ASCII digits when present" }
      - { name: tin_type, type: enum, source: input, default: null, description: "SSN | EIN; null until a W-9 supplies it." }
      - { name: entity_classification, type: enum, source: input, description: "INDIVIDUAL_SOLE_PROP | C_CORP | S_CORP | PARTNERSHIP | LLC_C | LLC_S | LLC_P | TRUST_ESTATE | TAX_EXEMPT" }
      - { name: address_line1, type: string, source: input, description: "Mailing address line 1." }
      - { name: address_city, type: string, source: input, description: "Mailing address city." }
      - { name: address_state, type: string, source: input, description: "2-letter state code driving state direct-reporting obligations." }
      - { name: address_postal, type: string, source: input, description: "Postal code." }
      - { name: e_delivery_consent, type: boolean, source: input, default: false, description: "Recipient consent to electronic Copy B delivery." }
      - { name: tin_match_status, type: enum, source: system, description: "NOT_SUBMITTED | PENDING_MATCH | MATCHED | MISMATCHED" }
      - { name: mismatch_count_3yr, type: integer, source: system, default: 0, description: "Count of this vendor's MISMATCHED W9Submissions whose created_at falls within [logical_clock - 3 years, logical_clock]." }
      - { name: b_notice_stage, type: enum, source: system, description: "NONE | FIRST | SECOND — highest open BNotice stage; SECOND persists until TaxAdmin override resolve." }
      - { name: backup_withholding_flag, type: boolean, source: computed, description: "true iff tin_match_status == MISMATCHED OR b_notice_stage == SECOND; gates per-payment withholding at posting time." }
      - { name: withholding_balance_cents, type: integer, source: computed, default: 0, description: "Signed sum of this vendor's WithholdingEntry rows with status UNREMITTED (DEBIT_WITHHELD positive, REVERSAL negative)." }
      - { name: merged_into_vendor_id, type: string, source: system, default: null, description: "FK -> Vendor.id; set when this vendor was merged away as a duplicate source." }
      - { name: status, type: enum, source: system, description: "ACTIVE | MERGED | DEACTIVATED" }

  - name: W9Submission
    parent: null
    common_fields: true
    fields:
      - { name: vendor_id, type: string, source: system, description: "FK -> Vendor.id; taken from the URL path at creation." }
      - { name: submitted_legal_name, type: string, source: input, description: "Name exactly as written on the W-9." }
      - { name: submitted_tin, type: string, source: input, description: "9-digit TIN from the W-9.", constraints: "exactly 9 ASCII digits" }
      - { name: submitted_tin_type, type: enum, source: input, description: "SSN | EIN" }
      - { name: signature_name, type: string, source: input, description: "Signer name (attestation)." }
      - { name: match_result, type: enum, source: system, description: "PENDING | MATCHED | MISMATCHED" }
      - { name: mismatch_reason_code, type: string, source: system, default: null, description: "IRS mismatch reason code supplied on a MISMATCHED result." }

  - name: Payment
    parent: null
    common_fields: true
    fields:
      - { name: vendor_id, type: string, source: input, description: "FK -> Vendor.id" }
      - { name: source_system, type: enum, source: input, description: "AP_ERP | CORP_CARD | MANUAL | FIELD_OFFICE — payments aggregate across all four systems onto one vendor-year return." }
      - { name: payment_type, type: enum, source: input, description: "SERVICE | RENT | ROYALTY | ATTORNEY_FEE | MEDICAL_HEALTH | PRIZE_AWARD | GOODS | REIMBURSEMENT" }
      - { name: amount_cents, type: integer, source: input, description: "Gross payment amount in cents; must be > 0." }
      - { name: payment_date, type: datetime, source: input, description: "Date of payment; determines tax_year and remittance quarter." }
      - { name: tax_year, type: integer, source: computed, description: "Calendar year of payment_date." }
      - { name: is_reportable, type: boolean, source: computed, description: "Result of box_classification over (payment_type, vendor.entity_classification)." }
      - { name: reportable_box, type: enum, source: computed, description: "NEC_1 | MISC_1 | MISC_2 | MISC_3 | MISC_6 | NONE" }
      - { name: withheld_cents, type: integer, source: computed, default: 0, description: "Per-payment backup withholding: round_half_up(amount_cents * 2400 / 10000) when vendor.backup_withholding_flag is true at posting, else 0." }
      - { name: status, type: enum, source: system, description: "POSTED | VOIDED" }

  - name: WithholdingEntry
    parent: null
    common_fields: false
    fields:
      - { name: vendor_id, type: string, source: system, description: "FK -> Vendor.id" }
      - { name: payment_id, type: string, source: system, description: "FK -> Payment.id" }
      - { name: reverses_entry_id, type: string, source: system, default: null, description: "FK -> WithholdingEntry.id; set on REVERSAL entries to name the DEBIT_WITHHELD row being reversed." }
      - { name: remittance_id, type: string, source: system, default: null, description: "FK -> Remittance.id; stamped when swept by a remittance submit." }
      - { name: tax_year, type: integer, source: system, description: "Calendar year of the underlying payment." }
      - { name: quarter, type: integer, source: system, description: "ceil(payment_date.month / 3), range 1..4." }
      - { name: entry_type, type: enum, source: system, description: "DEBIT_WITHHELD | REVERSAL" }
      - { name: amount_cents, type: integer, source: system, description: "Signed cents: positive for DEBIT_WITHHELD, negative for REVERSAL." }
      - { name: status, type: enum, source: system, description: "UNREMITTED | REMITTED | REVERSED" }

  - name: Remittance
    parent: null
    common_fields: true
    fields:
      - { name: tax_year, type: integer, source: input, description: "Tax year whose withheld entries this remittance covers." }
      - { name: quarter, type: integer, source: input, description: "Quarter 1..4 of the underlying payments." }
      - { name: amount_cents, type: integer, source: computed, description: "Accrual basis: signed sum of UNREMITTED entries for (tax_year, quarter); recomputed on every entry mutation while DRAFT, locked at submit." }
      - { name: statutory_expected_cents, type: integer, source: computed, default: null, description: "Statutory basis computed at submit: round_half_up(24% * sum of amount_cents of POSTED payments in (tax_year, quarter) whose withheld_cents > 0). Diverges from amount_cents by per-payment rounding drift." }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of the TaxSpecialist who created the draft." }
      - { name: submitted_by_user_id, type: string, source: system, default: null, description: "X-User-ID of the TaxTransmitter who submitted; must differ from created_by_user_id." }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | ACKNOWLEDGED | REJECTED" }

  - name: TaxReturn
    parent: null
    common_fields: true
    fields:
      - { name: vendor_id, type: string, source: system, description: "FK -> Vendor.id" }
      - { name: tax_year, type: integer, source: system, description: "Year the return reports." }
      - { name: form_type, type: enum, source: system, description: "NEC | MISC — derived from the reportable boxes present." }
      - { name: box_amounts, type: object, source: computed, description: "Current authoritative amounts: { box_1_cents, box_2_cents, box_3_cents, box_4_cents, box_6_cents } (unused boxes 0). box_4_cents = federal tax withheld. Recomputed to FINAL basis at seal and on invalidation events." }
      - { name: provisional_box_amounts, type: object, source: computed, description: "PROVISIONAL snapshot captured at generate time over payments existing at that moment; frozen thereafter." }
      - { name: amount_basis, type: enum, source: system, description: "PROVISIONAL | FINAL — which aggregation variant currently backs box_amounts." }
      - { name: is_correction, type: boolean, source: system, default: false, description: "true when created via the correct action." }
      - { name: corrects_return_id, type: string, source: system, default: null, description: "FK -> TaxReturn.id; the ACCEPTED return this correction supersedes." }
      - { name: transmittal_id, type: string, source: system, default: null, description: "FK -> Transmittal.id; set at seal, cleared on transmittal REJECTED." }
      - { name: federal_status, type: enum, source: system, description: "DRAFT | VALIDATED | TRANSMITTED | ACCEPTED | SUPERSEDED | VOIDED" }
      - { name: recipient_copy_status, type: enum, source: system, description: "PENDING | E_DELIVERED | POSTAL_SENT | UNDELIVERABLE — parallel dimension, independent of federal_status." }
      - { name: copy_delivered_at, type: datetime, source: system, default: null, description: "Logical-clock timestamp of the latest successful copy delivery." }

  - name: Transmittal
    parent: null
    common_fields: true
    fields:
      - { name: tax_year, type: integer, source: input, description: "Year being transmitted." }
      - { name: form_type, type: enum, source: input, description: "NEC | MISC — a transmittal carries one form type." }
      - { name: filing_channel, type: enum, source: computed, default: null, description: "EFILE | PAPER — recommended channel computed at seal from the e-filing threshold rule; re-evaluated against the declared channel at submit." }
      - { name: return_count, type: integer, source: computed, default: 0, description: "Number of member returns attached at seal." }
      - { name: sealed_by_user_id, type: string, source: system, default: null, description: "X-User-ID of the TaxSpecialist who sealed." }
      - { name: submitted_by_user_id, type: string, source: system, default: null, description: "X-User-ID of the TaxTransmitter who submitted; must differ from sealed_by_user_id." }
      - { name: status, type: enum, source: system, description: "OPEN | SEALED | SUBMITTED | ACCEPTED | REJECTED" }

  - name: StateRule
    parent: null
    common_fields: true
    fields:
      - { name: state_code, type: string, source: input, description: "2-letter state code this rule governs." }
      - { name: participates_in_cfsf, type: boolean, source: input, description: "true = state receives federal data via the Combined Federal/State Filing program; false = payer may owe a direct filing." }
      - { name: direct_reporting_threshold_cents, type: integer, source: input, description: "Vendor-year reportable total at or above which a direct state filing is required when participates_in_cfsf is false." }
      - { name: effective_from, type: datetime, source: input, description: "Closed-interval start (inclusive)." }
      - { name: effective_to, type: datetime, source: input, description: "Closed-interval end (inclusive); two rules for one state_code may not overlap under closed-interval semantics (touching endpoints DO overlap)." }

  - name: StateObligation
    parent: null
    common_fields: true
    fields:
      - { name: vendor_id, type: string, source: system, description: "FK -> Vendor.id" }
      - { name: state_rule_id, type: string, source: system, description: "FK -> StateRule.id" }
      - { name: tax_year, type: integer, source: system, description: "Year evaluated." }
      - { name: required_channel, type: enum, source: computed, description: "CFSF_FORWARD | DIRECT_FILE | NOT_REQUIRED — from state_direct_reporting_channel." }
      - { name: reportable_amount_cents, type: integer, source: computed, description: "Vendor's total reportable cents (NEC_1 + MISC_* boxes, POSTED payments) for the year at evaluation time." }
      - { name: status, type: enum, source: system, description: "PENDING | FILED_VIA_CFSF | FILED_DIRECT | NOT_REQUIRED" }

  - name: BNotice
    parent: null
    common_fields: true
    fields:
      - { name: vendor_id, type: string, source: input, description: "FK -> Vendor.id" }
      - { name: notice_year, type: integer, source: input, description: "Calendar year printed on the IRS notice." }
      - { name: stage, type: enum, source: computed, description: "FIRST | SECOND — SECOND iff a prior BNotice for the same vendor exists with notice_year in [notice_year - 2, notice_year] created earlier, OR vendor.mismatch_count_3yr >= 2 at creation time." }
      - { name: status, type: enum, source: system, description: "OPEN | RESOLVED" }
      - { name: resolved_by_user_id, type: string, source: system, default: null, description: "X-User-ID that resolved the notice." }

  - name: VendorMergeRequest
    parent: null
    common_fields: true
    fields:
      - { name: source_vendor_id, type: string, source: input, description: "FK -> Vendor.id; duplicate vendor that will be merged away." }
      - { name: target_vendor_id, type: string, source: input, description: "FK -> Vendor.id; surviving vendor." }
      - { name: reason, type: string, source: input, description: "Free-text justification for the merge." }
      - { name: requested_by_user_id, type: string, source: system, description: "X-User-ID of the APClerk who requested the merge." }
      - { name: reviewed_by_user_id, type: string, source: system, default: null, description: "X-User-ID of the TaxAdmin who approved/rejected; must differ from requested_by_user_id on approve." }
      - { name: status, type: enum, source: system, description: "PENDING | EXECUTED | REJECTED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: TaxYear
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /tax1099/tax-years/{taxYearId}/close"
        actor: TaxAdmin
        preconditions:
          - "TaxYear is OPEN (else ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "Payments whose payment_date falls inside [period_start, period_end_exclusive) can no longer be created or voided (ERR_TAX_YEAR_CLOSED / ERR_PAYMENT_NOT_VOIDABLE)"

  - entity: Vendor
    initial_state: ACTIVE
    terminal_states: [MERGED, DEACTIVATED]
    transitions:
      - from: ACTIVE
        to: MERGED
        trigger: "POST /tax1099/vendor-merge-requests/{requestId}/approve (this vendor is the source)"
        actor: TaxAdmin
        preconditions:
          - "Merge request PENDING, source != target, equal TINs, both vendors ACTIVE"
        side_effects:
          - "merged_into_vendor_id = target id"
          - "Payments, non-PENDING_MATCH W9Submissions, WithholdingEntries, TaxReturns, BNotices, StateObligations re-parented to target"
          - "Source DRAFT/VALIDATED returns whose (tax_year, form_type) key collides with an existing non-terminal target return are VOIDED instead of re-parented"
      - from: ACTIVE
        to: DEACTIVATED
        trigger: "POST /tax1099/vendors/{vendorId}/deactivate"
        actor: TaxAdmin
        preconditions:
          - "withholding_balance_cents == 0 (else ERR_VENDOR_HAS_OPEN_OBLIGATIONS)"
          - "No DRAFT or VALIDATED TaxReturn for this vendor (else ERR_VENDOR_HAS_OPEN_OBLIGATIONS)"
        side_effects: []

  - entity: Vendor.tin_match_status
    initial_state: NOT_SUBMITTED
    terminal_states: []
    transitions:
      - from: NOT_SUBMITTED
        to: PENDING_MATCH
        trigger: "POST /tax1099/vendors/{vendorId}/w9-submissions"
        actor: APClerk | VendorPortal
        preconditions:
          - "Vendor status == ACTIVE (else ERR_VENDOR_NOT_ACTIVE)"
        side_effects: []
      - from: MATCHED
        to: PENDING_MATCH
        trigger: "POST /tax1099/vendors/{vendorId}/w9-submissions (re-submission)"
        actor: APClerk | VendorPortal
        preconditions:
          - "Vendor status == ACTIVE"
        side_effects:
          - "Existing VALIDATED TaxReturns for open years remain VALIDATED but cannot transition further until match resolves to MATCHED or MISMATCHED? NO — pin: validate is blocked while PENDING_MATCH (ERR_W9_NOT_ON_FILE); existing VALIDATED returns are unaffected"
      - from: MISMATCHED
        to: PENDING_MATCH
        trigger: "POST /tax1099/vendors/{vendorId}/w9-submissions (re-submission)"
        actor: APClerk | VendorPortal
        preconditions:
          - "Vendor status == ACTIVE"
        side_effects:
          - "backup_withholding_flag recomputed: stays true iff b_notice_stage == SECOND"
      - from: PENDING_MATCH
        to: MATCHED
        trigger: "POST /tax1099/w9-submissions/{submissionId}/record-match-result {match_result: MATCHED}"
        actor: IRSSystem
        preconditions:
          - "Submission match_result == PENDING (else ERR_INVALID_STATE_TRANSITION)"
          - "Vendor status == ACTIVE (else ERR_VENDOR_NOT_ACTIVE)"
        side_effects:
          - "vendor.tin = submitted_tin; vendor.tin_type = submitted_tin_type; vendor.legal_name = submitted_legal_name"
          - "backup_withholding_flag recomputed (true iff b_notice_stage == SECOND)"
      - from: PENDING_MATCH
        to: MISMATCHED
        trigger: "POST /tax1099/w9-submissions/{submissionId}/record-match-result {match_result: MISMATCHED}"
        actor: IRSSystem
        preconditions:
          - "Submission match_result == PENDING"
          - "Vendor status == ACTIVE"
        side_effects:
          - "mismatch_count_3yr += 1"
          - "backup_withholding_flag = true"
          - "mismatch_reason_code copied from request"

  - entity: W9Submission
    initial_state: PENDING
    terminal_states: [MATCHED, MISMATCHED]
    transitions:
      - from: PENDING
        to: MATCHED
        trigger: "POST /tax1099/w9-submissions/{submissionId}/record-match-result"
        actor: IRSSystem
        preconditions: ["match_result == PENDING"]
        side_effects: ["Vendor.tin_match_status -> MATCHED (see Vendor.tin_match_status machine)"]
      - from: PENDING
        to: MISMATCHED
        trigger: "POST /tax1099/w9-submissions/{submissionId}/record-match-result"
        actor: IRSSystem
        preconditions: ["match_result == PENDING"]
        side_effects: ["Vendor.tin_match_status -> MISMATCHED; mismatch_count_3yr += 1"]

  - entity: Payment
    initial_state: POSTED
    terminal_states: [VOIDED]
    transitions:
      - from: POSTED
        to: VOIDED
        trigger: "POST /tax1099/payments/{paymentId}/void"
        actor: APClerk | TaxAdmin
        preconditions:
          - "Payment status == POSTED (else ERR_INVALID_STATE_TRANSITION)"
          - "Covering TaxYear is OPEN (else ERR_PAYMENT_NOT_VOIDABLE)"
          - "Payment is not included in any ACCEPTED TaxReturn (else ERR_PAYMENT_NOT_VOIDABLE)"
          - "Payment's withholding entry, if any, is not REMITTED (else ERR_PAYMENT_NOT_VOIDABLE)"
        side_effects:
          - "If withheld_cents > 0: the DEBIT_WITHHELD entry becomes REVERSED and a new REVERSAL entry (-withheld_cents) is created already in status REVERSED (the pair nets to zero and leaves the UNREMITTED pool atomically)"
          - "vendor.withholding_balance_cents recomputed"
          - "DRAFT Remittances for (tax_year, quarter) recompute amount_cents"
          - "Vendor's DRAFT/VALIDATED TaxReturns for tax_year recompute box_amounts (FINAL basis); VALIDATED ones revert to DRAFT"

  - entity: WithholdingEntry
    initial_state: UNREMITTED
    terminal_states: [REMITTED, REVERSED]
    transitions:
      - from: UNREMITTED
        to: REMITTED
        trigger: "POST /tax1099/remittances/{remittanceId}/submit (sweep)"
        actor: TaxTransmitter
        preconditions:
          - "Entry matches remittance (tax_year, quarter)"
        side_effects:
          - "remittance_id stamped"
          - "vendor.withholding_balance_cents recomputed"
      - from: UNREMITTED
        to: REVERSED
        trigger: "POST /tax1099/withholding-entries/{entryId}/reverse OR payment void cascade"
        actor: TaxAdmin | system
        preconditions:
          - "entry_type == DEBIT_WITHHELD (REVERSAL entries cannot be reversed: ERR_INVALID_STATE_TRANSITION)"
          - "status == UNREMITTED (else ERR_ENTRY_ALREADY_REMITTED when REMITTED, ERR_INVALID_STATE_TRANSITION when REVERSED)"
        side_effects:
          - "A REVERSAL entry (-amount_cents, reverses_entry_id = this entry) is created with status REVERSED (the pair nets to zero and leaves the UNREMITTED pool atomically)"
          - "vendor.withholding_balance_cents recomputed; DRAFT remittances recompute; vendor DRAFT/VALIDATED returns recompute box_4_cents and VALIDATED revert to DRAFT"

  - entity: Remittance
    initial_state: DRAFT
    terminal_states: [ACKNOWLEDGED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /tax1099/remittances/{remittanceId}/submit"
        actor: TaxTransmitter
        preconditions:
          - "status == DRAFT"
          - "submitted_by_user_id != created_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
          - "amount_cents > 0 at submit time (else ERR_NOTHING_TO_REMIT)"
        side_effects:
          - "All UNREMITTED entries for (tax_year, quarter) -> REMITTED with remittance_id stamped"
          - "statutory_expected_cents computed and frozen"
      - from: SUBMITTED
        to: ACKNOWLEDGED
        trigger: "POST /tax1099/remittances/{remittanceId}/record-outcome {outcome: ACKNOWLEDGED}"
        actor: IRSSystem
        preconditions: ["status == SUBMITTED"]
        side_effects: []
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /tax1099/remittances/{remittanceId}/record-outcome {outcome: REJECTED}"
        actor: IRSSystem
        preconditions: ["status == SUBMITTED"]
        side_effects:
          - "Swept entries revert to UNREMITTED; remittance_id cleared"
          - "vendor.withholding_balance_cents recomputed per vendor"
      - from: REJECTED
        to: DRAFT
        trigger: "POST /tax1099/remittances/{remittanceId}/reopen"
        actor: TaxSpecialist
        preconditions: ["status == REJECTED"]
        side_effects: ["amount_cents recomputed from current UNREMITTED entries"]

  - entity: TaxReturn.federal_status
    initial_state: DRAFT
    terminal_states: [SUPERSEDED, VOIDED]
    transitions:
      - from: DRAFT
        to: VALIDATED
        trigger: "POST /tax1099/returns/{returnId}/validate"
        actor: TaxSpecialist
        preconditions:
          - "federal_status == DRAFT (else ERR_INVALID_STATE_TRANSITION)"
          - "vendor.tin_match_status in {MATCHED, MISMATCHED} (else ERR_W9_NOT_ON_FILE)"
          - "vendor.tin is not null (else ERR_W9_NOT_ON_FILE)"
          - "vendor.status == ACTIVE (else ERR_VENDOR_NOT_ACTIVE)"
        side_effects: []
      - from: VALIDATED
        to: DRAFT
        trigger: "system (invalidation: merge re-parent, payment void on same vendor-year, withholding reversal on same vendor-year, entity_classification PATCH on vendor)"
        actor: system
        preconditions: []
        side_effects: ["box_amounts recomputed on FINAL basis over current POSTED payments"]
      - from: DRAFT
        to: VOIDED
        trigger: "POST /tax1099/returns/{returnId}/void"
        actor: TaxSpecialist
        preconditions: ["federal_status == DRAFT"]
        side_effects: []
      - from: DRAFT
        to: VOIDED
        trigger: "system (merge key-collision cascade)"
        actor: system
        preconditions: ["Merge re-parent would create duplicate non-terminal (vendor, tax_year, form_type) key"]
        side_effects: []
      - from: VALIDATED
        to: TRANSMITTED
        trigger: "POST /tax1099/transmittals/{transmittalId}/seal"
        actor: TaxSpecialist
        preconditions: ["Selected by seal: federal_status == VALIDATED, matching tax_year + form_type, transmittal_id IS NULL"]
        side_effects:
          - "transmittal_id set"
          - "box_amounts recomputed on FINAL basis; amount_basis = FINAL"
      - from: TRANSMITTED
        to: VALIDATED
        trigger: "system (transmittal REJECTED)"
        actor: system
        preconditions: []
        side_effects: ["transmittal_id cleared"]
      - from: TRANSMITTED
        to: ACCEPTED
        trigger: "system (transmittal ACCEPTED)"
        actor: system
        preconditions: []
        side_effects:
          - "If is_correction: the return named by corrects_return_id transitions ACCEPTED -> SUPERSEDED atomically in the same step"
      - from: ACCEPTED
        to: SUPERSEDED
        trigger: "system (correction acceptance)"
        actor: system
        preconditions: ["A correction TaxReturn with corrects_return_id == this return reaches ACCEPTED"]
        side_effects: []

  - entity: TaxReturn.recipient_copy_status
    initial_state: PENDING
    terminal_states: []
    transitions:
      - from: PENDING
        to: E_DELIVERED
        trigger: "POST /tax1099/returns/{returnId}/deliver-copy {channel: ELECTRONIC}"
        actor: TaxSpecialist
        preconditions:
          - "federal_status in {VALIDATED, TRANSMITTED, ACCEPTED} (else ERR_INVALID_STATE_TRANSITION)"
          - "vendor.e_delivery_consent == true (else ERR_ELECTRONIC_CONSENT_REQUIRED)"
          - "logical clock <= tax_year's recipient_copy_deadline (else ERR_COPY_DEADLINE_PASSED)"
        side_effects: ["copy_delivered_at = logical clock"]
      - from: PENDING
        to: POSTAL_SENT
        trigger: "POST /tax1099/returns/{returnId}/deliver-copy {channel: POSTAL}"
        actor: TaxSpecialist
        preconditions:
          - "federal_status in {VALIDATED, TRANSMITTED, ACCEPTED}"
          - "logical clock <= recipient_copy_deadline"
        side_effects: ["copy_delivered_at = logical clock"]
      - from: POSTAL_SENT
        to: UNDELIVERABLE
        trigger: "POST /tax1099/returns/{returnId}/record-copy-bounce"
        actor: IRSSystem
        preconditions: ["recipient_copy_status == POSTAL_SENT"]
        side_effects: []
      - from: UNDELIVERABLE
        to: E_DELIVERED
        trigger: "POST /tax1099/returns/{returnId}/deliver-copy {channel: ELECTRONIC}"
        actor: TaxSpecialist
        preconditions:
          - "federal_status in {VALIDATED, TRANSMITTED, ACCEPTED}"
          - "vendor.e_delivery_consent == true"
          - "logical clock <= recipient_copy_deadline"
        side_effects: ["copy_delivered_at = logical clock"]
      - from: UNDELIVERABLE
        to: POSTAL_SENT
        trigger: "POST /tax1099/returns/{returnId}/deliver-copy {channel: POSTAL}"
        actor: TaxSpecialist
        preconditions:
          - "federal_status in {VALIDATED, TRANSMITTED, ACCEPTED}"
          - "logical clock <= recipient_copy_deadline"
        side_effects: ["copy_delivered_at = logical clock"]

  - entity: Transmittal
    initial_state: OPEN
    terminal_states: [ACCEPTED]
    transitions:
      - from: OPEN
        to: SEALED
        trigger: "POST /tax1099/transmittals/{transmittalId}/seal"
        actor: TaxSpecialist
        preconditions:
          - "status == OPEN (else ERR_INVALID_STATE_TRANSITION)"
          - "At least one eligible return (else ERR_TRANSMITTAL_EMPTY)"
        side_effects:
          - "Eligibility filter: TaxReturn with federal_status == VALIDATED, tax_year == this.tax_year, form_type == this.form_type, transmittal_id IS NULL; selection order created_at ASC (ordering is observational only — all eligible are taken)"
          - "Member returns -> TRANSMITTED with transmittal_id set; each recomputed to FINAL basis"
          - "return_count = number of member returns"
          - "filing_channel computed AFTER member transition: qualifying_count = count of TaxReturns for tax_year with federal_status in {VALIDATED, TRANSMITTED, ACCEPTED}; EFILE iff qualifying_count >= TaxYear.efiling_threshold_count else PAPER"
          - "sealed_by_user_id = caller X-User-ID"
      - from: SEALED
        to: SUBMITTED
        trigger: "POST /tax1099/transmittals/{transmittalId}/submit"
        actor: TaxTransmitter
        preconditions:
          - "status == SEALED"
          - "submitted_by_user_id != sealed_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
          - "No member return's vendor has an OPEN SECOND BNotice (else ERR_UNRESOLVED_SECOND_B_NOTICE)"
          - "If request channel == PAPER: recomputed qualifying_count (same formula as seal, evaluated at submit) must be < efiling_threshold_count (else ERR_EFILE_REQUIRED)"
        side_effects: ["submitted_by_user_id = caller X-User-ID"]
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /tax1099/transmittals/{transmittalId}/record-outcome {outcome: ACCEPTED}"
        actor: IRSSystem
        preconditions: ["status == SUBMITTED"]
        side_effects:
          - "Member returns -> ACCEPTED (corrections supersede their originals atomically)"
          - "StateObligations with tax_year == this.tax_year, required_channel == CFSF_FORWARD, status == PENDING -> FILED_VIA_CFSF"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /tax1099/transmittals/{transmittalId}/record-outcome {outcome: REJECTED}"
        actor: IRSSystem
        preconditions: ["status == SUBMITTED"]
        side_effects: ["Member returns -> VALIDATED with transmittal_id cleared"]
      - from: REJECTED
        to: OPEN
        trigger: "POST /tax1099/transmittals/{transmittalId}/reopen"
        actor: TaxSpecialist
        preconditions: ["status == REJECTED"]
        side_effects: ["filing_channel = null; return_count = 0; sealed_by_user_id = null"]

  - entity: StateObligation
    initial_state: PENDING
    terminal_states: [FILED_VIA_CFSF, FILED_DIRECT, NOT_REQUIRED]
    transitions:
      - from: PENDING
        to: FILED_DIRECT
        trigger: "POST /tax1099/state-obligations/{obligationId}/mark-filed"
        actor: TaxSpecialist
        preconditions:
          - "status == PENDING"
          - "required_channel == DIRECT_FILE (else ERR_INVALID_STATE_TRANSITION)"
        side_effects: []
      - from: PENDING
        to: NOT_REQUIRED
        trigger: "system (re-evaluation after vendor merge or payment void drops reportable_amount_cents below threshold) — modeled lazily: evaluate recomputes and may flip status"
        actor: system
        preconditions: []
        side_effects: []
      - from: PENDING
        to: FILED_VIA_CFSF
        trigger: "system (transmittal ACCEPTED for same tax_year)"
        actor: system
        preconditions: ["required_channel == CFSF_FORWARD"]
        side_effects: []

  - entity: BNotice
    initial_state: OPEN
    terminal_states: [RESOLVED]
    transitions:
      - from: OPEN
        to: RESOLVED
        trigger: "POST /tax1099/b-notices/{noticeId}/resolve"
        actor: TaxSpecialist | TaxAdmin
        preconditions:
          - "status == OPEN"
          - "stage FIRST: vendor.tin_match_status == MATCHED from a W9Submission created after this notice (else ERR_B_NOTICE_NOT_RESOLVABLE)"
          - "stage SECOND: caller role == TaxAdmin AND resolution_code == IRS_SSA_VALIDATION (else ERR_B_NOTICE_NOT_RESOLVABLE; TaxSpecialist may never resolve SECOND)"
        side_effects:
          - "resolved_by_user_id = caller"
          - "vendor.b_notice_stage recomputed = highest stage among remaining OPEN notices (NONE if none)"
          - "vendor.backup_withholding_flag recomputed"

  - entity: VendorMergeRequest
    initial_state: PENDING
    terminal_states: [EXECUTED, REJECTED]
    transitions:
      - from: PENDING
        to: EXECUTED
        trigger: "POST /tax1099/vendor-merge-requests/{requestId}/approve"
        actor: TaxAdmin
        preconditions:
          - "status == PENDING"
          - "reviewed_by_user_id != requested_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
          - "source_vendor_id != target_vendor_id (else ERR_SELF_MERGE)"
          - "Both vendors status == ACTIVE (else ERR_VENDOR_NOT_ACTIVE)"
          - "source.tin == target.tin and both non-null (else ERR_TIN_MISMATCH_ON_MERGE)"
          - "Source has no PENDING_MATCH W9Submission (else ERR_VENDOR_HAS_OPEN_OBLIGATIONS)"
        side_effects:
          - "Source Vendor -> MERGED with merged_into_vendor_id = target"
          - "Payments re-parented to target (vendor_id rewritten; tax_year/is_reportable/reportable_box unchanged — classification was fixed at posting)"
          - "WithholdingEntries re-parented; target.withholding_balance_cents recomputed as combined sum"
          - "BNotices re-parented; target.b_notice_stage = max(source, target) under ordering NONE < FIRST < SECOND"
          - "Non-PENDING_MATCH W9Submissions re-parented"
          - "TaxReturns re-parented; key-colliding DRAFT/VALIDATED source returns VOIDED; surviving DRAFT/VALIDATED target returns invalidated to DRAFT with recomputed box_amounts"
          - "StateObligations re-parented to target"
      - from: PENDING
        to: REJECTED
        trigger: "POST /tax1099/vendor-merge-requests/{requestId}/reject"
        actor: TaxAdmin
        preconditions: ["status == PENDING"]
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (true races only; OCC on parent version)
# =============================================================================
concurrency_rules:
  - rule_id: vendor-master-stale-update
    parent_entity: Vendor
    write_endpoint: "PATCH /tax1099/vendors/{vendorId}"
    occ_field: expected_vendor_version
    description: |
      Updating a Vendor whose version has advanced since the client last observed
      it is rejected. Two clerks editing the same vendor master record (address fix
      vs. e-delivery consent) would otherwise silently overwrite each other's view;
      the writer holding a stale expected_vendor_version loses with 412 and must
      re-read before retrying.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: return-correction-stale-version
    parent_entity: TaxReturn
    write_endpoint: "POST /tax1099/returns/{returnId}/correct"
    occ_field: expected_return_version
    description: |
      Creating a correction against an ACCEPTED TaxReturn whose version has advanced
      since the client last observed it is rejected: another writer may have just
      created a competing correction draft (which legitimately supersedes the prior
      draft per the single-active-correction rule), making this writer's view stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: box_classification
    trigger: "Payment creation"
    algorithm: constraint_propagation
    formula: |
      CORP_EXEMPT = {C_CORP, S_CORP, LLC_C, LLC_S}
      if payment_type in {GOODS, REIMBURSEMENT}:        -> (is_reportable=false, reportable_box=NONE)
      elif payment_type == ATTORNEY_FEE:                -> (true, NEC_1)   # corporate exemption does NOT apply
      elif payment_type == MEDICAL_HEALTH:              -> (true, MISC_6)  # corporate exemption does NOT apply
      elif payment_type == SERVICE:                     -> CORP_EXEMPT contains vendor.entity_classification ? (false, NONE) : (true, NEC_1)
      elif payment_type == RENT:                        -> CORP_EXEMPT contains vendor.entity_classification ? (false, NONE) : (true, MISC_1)
      elif payment_type == ROYALTY:                     -> CORP_EXEMPT contains vendor.entity_classification ? (false, NONE) : (true, MISC_2)
      elif payment_type == PRIZE_AWARD:                 -> CORP_EXEMPT contains vendor.entity_classification ? (false, NONE) : (true, MISC_3)
      Classification is computed once at posting from the vendor's CURRENT
      entity_classification and is frozen on the Payment; later classification
      changes invalidate open returns but never rewrite posted payments.
    input_set: "The new Payment plus its Vendor.entity_classification"
    precision: "enum output; no rounding"
    variants: []

  - name: backup_withholding_amount
    trigger: "Payment creation when vendor.backup_withholding_flag == true"
    algorithm: aggregation
    formula: |
      PINNED ROUNDING ORDER (per-payment first, then sum):
        withheld_cents(payment) = round_half_up(payment.amount_cents * rate_bps / 10000)
      where rate_bps = covering TaxYear.backup_withholding_rate_bps (default 2400).
      A DEBIT_WITHHELD entry of withheld_cents is created per payment.
      Vendor.withholding_balance_cents = sum of signed amount_cents over the vendor's
      UNREMITTED entries. The alternative order (sum payments, then multiply, then
      round once) is FORBIDDEN — it diverges from per-payment rounding by up to
      1 cent per payment.
    input_set: "The new Payment only (flag state of its Vendor at posting)"
    constants:
      DEFAULT_RATE_BPS: 2400
    precision: "whole cents, round_half_up applied per payment"
    variants: []

  - name: reportable_box_aggregation
    trigger: "returns/generate (PROVISIONAL), transmittal seal (FINAL), invalidation events (FINAL)"
    algorithm: aggregation
    formula: |
      For vendor V, tax_year Y, form F:
        box sums = sum over Payments with vendor_id == V, tax_year == Y,
                   status == POSTED, is_reportable == true, grouped by reportable_box.
        box_4_cents = sum of withheld_cents over the SAME payment set
                      (POSTED, in-year, regardless of is_reportable).
      NEC form exists iff NEC_1 sum >= TaxYear.nec_reportable_threshold_cents.
      MISC form exists iff (MISC_1 + MISC_2 + MISC_3 + MISC_6) >= TaxYear.misc_reportable_threshold_cents.
    input_set: "Payments of one vendor for one tax year (see variants for the snapshot filter)"
    precision: "whole cents (integer sums)"
    variants:
      - name: PROVISIONAL
        when: "At returns/generate"
        difference: "Input set = payments whose created_at <= generate call time (i.e., payments that exist at generation); snapshot frozen into provisional_box_amounts and box_amounts; amount_basis = PROVISIONAL."
      - name: FINAL
        when: "At transmittal seal and on invalidation events"
        difference: "Input set = ALL POSTED payments with tax_year == Y, including payments recorded after generate but dated in-year; result overwrites box_amounts and sets amount_basis = FINAL. provisional_box_amounts is never overwritten."

  - name: withholding_reconciliation
    trigger: "Remittance submit"
    algorithm: aggregation
    formula: |
      accrual (authoritative, locked into amount_cents):
        amount_cents = sum of signed amount_cents over UNREMITTED entries
                       with matching (tax_year, quarter)
      statutory (comparison, frozen into statutory_expected_cents):
        statutory_expected_cents = round_half_up(
            sum(amount_cents of POSTED payments in (tax_year, quarter) with withheld_cents > 0)
            * rate_bps / 10000)
      The two bases legitimately diverge: accrual sums per-payment rounded values,
      statutory rounds once over the aggregate. The API exposes both; it does NOT
      reject on divergence.
    input_set: "Entries and payments of one (tax_year, quarter)"
    precision: "whole cents, round_half_up"
    variants:
      - name: ACCRUAL
        when: "Remittance draft creation and DRAFT-time recompute"
        difference: "Ledger-based: sum of per-payment rounded signed entries."
      - name: STATUTORY
        when: "Submit-time comparison snapshot"
        difference: "Payment-based: single rounding over the aggregate gross of withheld-bearing payments."

  - name: efile_threshold_channel
    trigger: "Transmittal seal (recommendation) and transmittal submit (enforcement)"
    algorithm: threshold
    formula: |
      CIRCULAR-LOOKING DEPENDENCY — evaluation order is pinned:
        1. At seal: member returns are transitioned VALIDATED -> TRANSMITTED FIRST.
        2. THEN qualifying_count(Y) = count of TaxReturn with tax_year == Y AND
           federal_status in {VALIDATED, TRANSMITTED, ACCEPTED}.
        3. recommended channel = EFILE iff qualifying_count >= TaxYear.efiling_threshold_count else PAPER.
      At submit the SAME three steps are re-evaluated with the request's declared
      channel: declared PAPER is rejected with ERR_EFILE_REQUIRED iff the
      recomputed qualifying_count >= threshold. Because member returns are already
      TRANSMITTED, the count INCLUDES this transmittal's own returns — this is
      intentional and pinned (a 10-return transmittal always e-files).
    input_set: "All TaxReturns of the tax year"
    constants:
      DEFAULT_EFILE_THRESHOLD: 10
    precision: "integer count comparison, >= is inclusive"
    variants: []

  - name: b_notice_stage_determination
    trigger: "BNotice creation"
    algorithm: chronological
    formula: |
      stage = SECOND iff either:
        (a) exists another BNotice for the same vendor with
            notice_year in [new.notice_year - 2, new.notice_year] and created_at < new.created_at, OR
        (b) vendor.mismatch_count_3yr >= 2 at creation time.
      Otherwise FIRST. Evaluation is chronological by created_at ASC; ties
      (impossible via API ordering) would break by created_at ASC only — never by id.
    input_set: "Vendor's existing BNotices and mismatch_count_3yr"
    precision: "boolean classification"
    variants: []

  - name: state_direct_reporting_channel
    trigger: "state-obligations/evaluate"
    algorithm: threshold
    formula: |
      For each vendor with status in {ACTIVE} (MERGED/DEACTIVATED vendors are skipped)
      that has at least one POSTED in-year payment:
        rule = StateRule where state_code == vendor.address_state AND
               effective_from <= evaluate-time logical clock <= effective_to
               (closed interval). If multiple match, the one with the LATEST
               effective_from wins; a tie is impossible because overlapping rules
               for one state are rejected at creation.
        If no rule matches: no obligation row is created for that vendor.
        reportable_amount_cents = sum of amount_cents over POSTED in-year
          payments with is_reportable == true (all boxes, NEC + MISC).
        required_channel =
          CFSF_FORWARD  if rule.participates_in_cfsf
          DIRECT_FILE   elif reportable_amount_cents >= rule.direct_reporting_threshold_cents
          NOT_REQUIRED  otherwise
        status mirrors required_channel: CFSF_FORWARD/DIRECT_FILE -> PENDING,
        NOT_REQUIRED -> NOT_REQUIRED.
      Re-evaluation for an existing (vendor, tax_year) obligation UPDATES the row
      in place (PENDING rows only; terminal rows are left untouched).
    input_set: "ACTIVE vendors with POSTED in-year payments; StateRules effective at evaluate time"
    precision: "whole cents; >= inclusive threshold"
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and non-empty"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all
  - priority: 2
    category: auth
    check: "Caller role is listed in the endpoint's roles; for VendorPortal calls, X-User-ID must equal the path vendor's id"
    error_id: ERR_FORBIDDEN_FOR_ROLE
    http_status: 403
    applies_to: all
  - priority: 3
    category: existence
    check: "Every id in the path resolves to an existing resource (validated left-to-right)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all resource endpoints
  - priority: 4
    category: state
    check: "Target resource is in a from-state of the requested transition"
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    applies_to: "All action/transition endpoints"
  - priority: 5
    category: state
    check: "OCC: expected_<parent>_version in the request equals the parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "PATCH /tax1099/vendors/{vendorId}; POST /tax1099/returns/{returnId}/correct"
  - priority: 6
    category: business_safety
    check: "W-9/TIN compliance: payment requires vendor.tin_match_status in {MATCHED, MISMATCHED}; return validate requires the same; transmittal submit rejects when any member vendor has an OPEN SECOND BNotice"
    error_id: "ERR_W9_NOT_ON_FILE / ERR_UNRESOLVED_SECOND_B_NOTICE"
    http_status: 409
    applies_to: "POST /tax1099/payments; POST /tax1099/returns/{id}/validate; POST /tax1099/transmittals/{id}/submit"
  - priority: 7
    category: business_safety
    check: "Segregation of duties: remittance submitter != creator; transmittal submitter != sealer; merge approver != requester"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "submit and approve endpoints"
  - priority: 8
    category: business_temporal
    check: "payment_date must fall inside an existing TaxYear's half-open period and that year must be OPEN; recipient copy delivery must occur at or before recipient_copy_deadline (logical clock)"
    error_id: "ERR_NO_TAX_YEAR / ERR_TAX_YEAR_CLOSED / ERR_COPY_DEADLINE_PASSED"
    http_status: 422
    applies_to: "POST /tax1099/payments; POST /tax1099/returns/{id}/deliver-copy; POST /tax1099/payments/{id}/void"
  - priority: 9
    category: business_referential
    check: "Referenced entities usable: vendor ACTIVE for payments/W-9/corrections; merge requires distinct ACTIVE vendors with equal non-null TINs and no PENDING_MATCH W-9 on the source"
    error_id: "ERR_VENDOR_NOT_ACTIVE / ERR_SELF_MERGE / ERR_TIN_MISMATCH_ON_MERGE / ERR_VENDOR_HAS_OPEN_OBLIGATIONS"
    http_status: 409
    applies_to: "payments, w9-submissions, vendor PATCH, merge approve, vendor deactivate, return validate"
  - priority: 10
    category: business_constraint
    check: "Structural rules: TIN format; TaxYear half-open non-overlap; StateRule closed-interval non-overlap per state; transmittal non-empty at seal; PAPER channel allowed only below e-file threshold; ELECTRONIC copy requires consent; single active correction per return; payment voidable"
    error_id: "ERR_INVALID_TIN_FORMAT / ERR_TAX_YEAR_OVERLAP / ERR_STATE_RULE_OVERLAP / ERR_TRANSMITTAL_EMPTY / ERR_EFILE_REQUIRED / ERR_ELECTRONIC_CONSENT_REQUIRED / ERR_RETURN_NOT_CORRECTABLE / ERR_PAYMENT_NOT_VOIDABLE"
    http_status: 422
    applies_to: "respective create/action endpoints"
  - priority: 11
    category: business_fiscal
    check: "Money rules: amount_cents > 0 on payments; remittance draft requires a non-empty positive UNREMITTED entry set"
    error_id: "ERR_INVALID_AMOUNT / ERR_NOTHING_TO_REMIT"
    http_status: 422
    applies_to: "POST /tax1099/payments; POST /tax1099/remittances"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  - method: POST
    path: "/tax1099/_clock/set_current_utc"
    description: "Set the logical clock (test-driving endpoint). Server startup default is exactly 2026-08-01T00:00:00Z; before any call the clock reads this default and never falls back to wall-clock time."
    roles: [TaxAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: datetime }"
    side_effects: ["Logical clock advanced (used by copy deadline, mismatch 3-year window, state-rule effectiveness)"]

  - method: POST
    path: "/tax1099/tax-years"
    description: "Create a TaxYear configuration (OPEN)"
    roles: [TaxAdmin]
    code: 201
    input: [tax_year, period_start, period_end_exclusive, recipient_copy_deadline, "efiling_threshold_count?", "nec_reportable_threshold_cents?", "misc_reportable_threshold_cents?"]
    output: TaxYear
    side_effects: ["ERR_TAX_YEAR_OVERLAP if [period_start, period_end_exclusive) intersects any existing TaxYear (half-open; touching endpoints allowed)", "ERR_INVALID_REQUEST if period_end_exclusive <= period_start or tax_year duplicates an existing row"]

  - method: POST
    path: "/tax1099/tax-years/{taxYearId}/close"
    description: "Close a tax year — freezes payment posting/voiding for its period"
    roles: [TaxAdmin]
    code: 200
    input: []
    output: TaxYear
    side_effects: ["status -> CLOSED"]

  - method: POST
    path: "/tax1099/vendors"
    description: "Onboard a vendor"
    roles: [APClerk, TaxAdmin]
    code: 201
    input: [legal_name, entity_classification, address_line1, address_city, address_state, address_postal, "tin?", "tin_type?", "e_delivery_consent?"]
    output: Vendor
    side_effects: ["status=ACTIVE, tin_match_status=NOT_SUBMITTED, b_notice_stage=NONE, balances/counters 0; ERR_INVALID_TIN_FORMAT if tin present and not 9 digits"]

  - method: GET
    path: "/tax1099/vendors/{vendorId}"
    description: "Get a vendor (VendorPortal callers may only read their own vendor id)"
    roles: [APClerk, TaxAdmin, TaxSpecialist, VendorPortal]
    code: 200
    input: []
    output: Vendor
    side_effects: []

  - method: GET
    path: "/tax1099/vendors"
    description: "List vendors with filters and pagination"
    roles: [APClerk, TaxAdmin, TaxSpecialist]
    code: 200
    input: ["status?", "tin_match_status?", "b_notice_stage?", "merged_into_vendor_id?", "limit?", "offset?"]
    output: Vendor[]
    side_effects: []

  - method: PATCH
    path: "/tax1099/vendors/{vendorId}"
    description: "Update vendor master data (OCC-guarded)"
    roles: [APClerk, TaxAdmin]
    code: 200
    input: ["legal_name?", "address_line1?", "address_city?", "address_state?", "address_postal?", "e_delivery_consent?", "entity_classification?", expected_vendor_version]
    output: Vendor
    side_effects:
      - "increments Vendor.version by 1"
      - "If entity_classification changed: DRAFT/VALIDATED TaxReturns for open years are invalidated (VALIDATED -> DRAFT) with box_amounts recomputed FINAL; posted Payments are NOT reclassified"
      - "ERR_STALE_VERSION on version mismatch; ERR_VENDOR_NOT_ACTIVE when vendor MERGED or DEACTIVATED"

  - method: POST
    path: "/tax1099/vendors/{vendorId}/deactivate"
    description: "Deactivate a vendor with no open obligations"
    roles: [TaxAdmin]
    code: 200
    input: []
    output: Vendor
    side_effects: ["status -> DEACTIVATED; ERR_VENDOR_HAS_OPEN_OBLIGATIONS when withholding_balance_cents != 0 or DRAFT/VALIDATED returns exist"]

  - method: POST
    path: "/tax1099/vendors/{vendorId}/w9-submissions"
    description: "Submit a W-9 for the vendor (VendorPortal must act on its own vendor id)"
    roles: [APClerk, VendorPortal]
    code: 201
    input: [submitted_legal_name, submitted_tin, submitted_tin_type, signature_name]
    output: W9Submission
    side_effects: ["W9Submission created PENDING; vendor.tin_match_status -> PENDING_MATCH; ERR_INVALID_TIN_FORMAT; ERR_VENDOR_NOT_ACTIVE"]

  - method: GET
    path: "/tax1099/w9-submissions/{submissionId}"
    description: "Get a single W-9 submission"
    roles: [APClerk, TaxAdmin, TaxSpecialist]
    code: 200
    input: []
    output: W9Submission
    side_effects: []

  - method: GET
    path: "/tax1099/w9-submissions"
    description: "List W-9 submissions"
    roles: [APClerk, TaxAdmin, TaxSpecialist]
    code: 200
    input: ["vendor_id?", "match_result?", "limit?", "offset?"]
    output: W9Submission[]
    side_effects: []

  - method: POST
    path: "/tax1099/w9-submissions/{submissionId}/record-match-result"
    description: "IRS TIN-matching feed: record the outcome for a pending submission"
    roles: [IRSSystem]
    code: 200
    input: [match_result, "mismatch_reason_code?"]
    output: W9Submission
    side_effects: ["Vendor.tin_match_status transitions per machine; on MATCHED vendor tin/tin_type/legal_name updated; on MISMATCHED mismatch_count_3yr += 1 and backup_withholding_flag set; ERR_INVALID_REQUEST when match_result == MISMATCHED and mismatch_reason_code absent"]

  - method: POST
    path: "/tax1099/payments"
    description: "Record a payment from any source system"
    roles: [APClerk]
    code: 201
    input: [vendor_id, source_system, payment_type, amount_cents, payment_date]
    output: Payment
    side_effects:
      - "tax_year, is_reportable, reportable_box computed via box_classification"
      - "withheld_cents computed via backup_withholding_amount; when > 0 a DEBIT_WITHHELD WithholdingEntry is created (UNREMITTED)"
      - "vendor.withholding_balance_cents recomputed; DRAFT remittances for (tax_year, quarter) recompute amount_cents"
      - "ERR_W9_NOT_ON_FILE, ERR_NO_TAX_YEAR, ERR_TAX_YEAR_CLOSED, ERR_VENDOR_NOT_ACTIVE, ERR_INVALID_AMOUNT per validation order"

  - method: GET
    path: "/tax1099/payments/{paymentId}"
    description: "Get a single payment"
    roles: [APClerk, TaxAdmin, TaxSpecialist]
    code: 200
    input: []
    output: Payment
    side_effects: []

  - method: GET
    path: "/tax1099/payments"
    description: "List payments"
    roles: [APClerk, TaxAdmin, TaxSpecialist]
    code: 200
    input: ["vendor_id?", "tax_year?", "payment_type?", "source_system?", "status?", "limit?", "offset?"]
    output: Payment[]
    side_effects: []

  - method: POST
    path: "/tax1099/payments/{paymentId}/void"
    description: "Void a posted payment (cascades: withholding reversal, balance and remittance recompute, return invalidation)"
    roles: [APClerk, TaxAdmin]
    code: 200
    input: []
    output: Payment
    side_effects: ["Payment -> VOIDED plus cascade per Payment state machine; ERR_PAYMENT_NOT_VOIDABLE when year closed, entry REMITTED, or payment inside an ACCEPTED return"]

  - method: GET
    path: "/tax1099/withholding-entries/{entryId}"
    description: "Get a single withholding ledger entry"
    roles: [APClerk, TaxAdmin, TaxSpecialist]
    code: 200
    input: []
    output: WithholdingEntry
    side_effects: []

  - method: GET
    path: "/tax1099/withholding-entries"
    description: "List withholding ledger entries"
    roles: [APClerk, TaxAdmin, TaxSpecialist]
    code: 200
    input: ["vendor_id?", "payment_id?", "remittance_id?", "reverses_entry_id?", "entry_type?", "status?", "tax_year?", "limit?", "offset?"]
    output: WithholdingEntry[]
    side_effects: []

  - method: POST
    path: "/tax1099/withholding-entries/{entryId}/reverse"
    description: "Manually reverse an unremitted withholding entry (e.g., withheld in error)"
    roles: [TaxAdmin]
    code: 200
    input: []
    output: WithholdingEntry
    side_effects: ["Creates REVERSAL entry, marks original REVERSED, recomputes balance/remittances/returns per WithholdingEntry machine; ERR_ENTRY_ALREADY_REMITTED when REMITTED"]

  - method: POST
    path: "/tax1099/remittances"
    description: "Draft a quarterly backup-withholding remittance"
    roles: [TaxSpecialist]
    code: 201
    input: [tax_year, quarter]
    output: Remittance
    side_effects: ["amount_cents computed (accrual) from current UNREMITTED entries; ERR_NOTHING_TO_REMIT when the set is empty or sums to <= 0; created_by_user_id = caller"]

  - method: GET
    path: "/tax1099/remittances/{remittanceId}"
    description: "Get a remittance"
    roles: [TaxSpecialist, TaxAdmin, TaxTransmitter]
    code: 200
    input: []
    output: Remittance
    side_effects: []

  - method: POST
    path: "/tax1099/remittances/{remittanceId}/submit"
    description: "Submit a draft remittance to the IRS (SoD: not the creator)"
    roles: [TaxTransmitter]
    code: 200
    input: []
    output: Remittance
    side_effects: ["Sweeps UNREMITTED entries -> REMITTED; freezes amount_cents; computes statutory_expected_cents; ERR_SEGREGATION_OF_DUTIES; ERR_NOTHING_TO_REMIT when amount drained to 0 while DRAFT"]

  - method: POST
    path: "/tax1099/remittances/{remittanceId}/record-outcome"
    description: "IRS feed: remittance acknowledged or rejected"
    roles: [IRSSystem]
    code: 200
    input: [outcome]
    output: Remittance
    side_effects: ["ACKNOWLEDGED terminal; REJECTED un-sweeps entries back to UNREMITTED; ERR_INVALID_REQUEST when outcome not in {ACKNOWLEDGED, REJECTED}"]

  - method: POST
    path: "/tax1099/remittances/{remittanceId}/reopen"
    description: "Reopen a rejected remittance as DRAFT"
    roles: [TaxSpecialist]
    code: 200
    input: []
    output: Remittance
    side_effects: ["status -> DRAFT; amount_cents recomputed"]

  - method: POST
    path: "/tax1099/returns/generate"
    description: "Bulk-generate DRAFT returns for a tax year (PROVISIONAL aggregation, threshold-gated, idempotent per key)"
    roles: [TaxSpecialist]
    code: 201
    input: [tax_year]
    output: "{ generated_count: integer, generated_return_ids: array, skipped_count: integer }"
    side_effects:
      - "For each vendor with status in {ACTIVE, MERGED, DEACTIVATED} — all vendors are scanned so merged-away duplicates' payments ride on the target vendor via vendor_id rewrite; effectively vendors holding POSTED reportable payments — create NEC and/or MISC DRAFT per reportable_box_aggregation threshold rules"
      - "A (vendor, tax_year, form_type) key that already has a non-terminal (DRAFT/VALIDATED/TRANSMITTED/ACCEPTED) return is skipped and counted in skipped_count"
      - "ERR_NO_TAX_YEAR when no TaxYear row exists for tax_year"

  - method: GET
    path: "/tax1099/returns/{returnId}"
    description: "Get a return"
    roles: [TaxSpecialist, TaxAdmin]
    code: 200
    input: []
    output: TaxReturn
    side_effects: []

  - method: GET
    path: "/tax1099/returns"
    description: "List returns"
    roles: [TaxSpecialist, TaxAdmin]
    code: 200
    input: ["vendor_id?", "tax_year?", "form_type?", "federal_status?", "transmittal_id?", "corrects_return_id?", "limit?", "offset?"]
    output: TaxReturn[]
    side_effects: []

  - method: POST
    path: "/tax1099/returns/{returnId}/validate"
    description: "Validate a draft return"
    roles: [TaxSpecialist]
    code: 200
    input: []
    output: TaxReturn
    side_effects: ["federal_status -> VALIDATED"]

  - method: POST
    path: "/tax1099/returns/{returnId}/void"
    description: "Void an erroneous draft return"
    roles: [TaxSpecialist]
    code: 200
    input: []
    output: TaxReturn
    side_effects: ["federal_status -> VOIDED"]

  - method: POST
    path: "/tax1099/returns/{returnId}/correct"
    description: "Create a correction return against an ACCEPTED original (OCC-guarded)"
    roles: [TaxSpecialist]
    code: 201
    input: [expected_return_version]
    output: TaxReturn
    side_effects:
      - "increments the ORIGINAL TaxReturn.version by 1"
      - "New TaxReturn created DRAFT with is_correction=true, corrects_return_id=original, box_amounts recomputed FINAL over current ledger, provisional_box_amounts = same FINAL snapshot"
      - "ERR_RETURN_NOT_CORRECTABLE when original not ACCEPTED or another non-terminal correction already exists"
      - "ERR_STALE_VERSION on version mismatch"

  - method: POST
    path: "/tax1099/returns/{returnId}/deliver-copy"
    description: "Deliver recipient Copy B by POSTAL or ELECTRONIC channel"
    roles: [TaxSpecialist]
    code: 200
    input: [channel]
    output: TaxReturn
    side_effects: ["recipient_copy_status transition per machine; copy_delivered_at stamped; ERR_INVALID_REQUEST for unknown channel; ERR_ELECTRONIC_CONSENT_REQUIRED; ERR_COPY_DEADLINE_PASSED"]

  - method: POST
    path: "/tax1099/returns/{returnId}/record-copy-bounce"
    description: "Delivery feed: postal copy returned undeliverable"
    roles: [IRSSystem]
    code: 200
    input: []
    output: TaxReturn
    side_effects: ["recipient_copy_status POSTAL_SENT -> UNDELIVERABLE"]

  - method: POST
    path: "/tax1099/transmittals"
    description: "Create an OPEN transmittal batch for (tax_year, form_type)"
    roles: [TaxSpecialist]
    code: 201
    input: [tax_year, form_type]
    output: Transmittal
    side_effects: ["ERR_NO_TAX_YEAR when no TaxYear row exists for tax_year"]

  - method: GET
    path: "/tax1099/transmittals/{transmittalId}"
    description: "Get a transmittal"
    roles: [TaxSpecialist, TaxAdmin, TaxTransmitter]
    code: 200
    input: []
    output: Transmittal
    side_effects: []

  - method: POST
    path: "/tax1099/transmittals/{transmittalId}/seal"
    description: "Seal all eligible VALIDATED returns into the batch and compute recommended channel"
    roles: [TaxSpecialist]
    code: 200
    input: []
    output: Transmittal
    side_effects: ["Member selection per state machine; members -> TRANSMITTED (FINAL recompute); return_count and filing_channel set; sealed_by_user_id stamped; ERR_TRANSMITTAL_EMPTY"]

  - method: POST
    path: "/tax1099/transmittals/{transmittalId}/submit"
    description: "Submit a sealed transmittal with a declared channel (SoD: not the sealer)"
    roles: [TaxTransmitter]
    code: 200
    input: [channel]
    output: Transmittal
    side_effects: ["ERR_SEGREGATION_OF_DUTIES; ERR_UNRESOLVED_SECOND_B_NOTICE; ERR_EFILE_REQUIRED; ERR_INVALID_REQUEST for unknown channel"]

  - method: POST
    path: "/tax1099/transmittals/{transmittalId}/record-outcome"
    description: "IRS feed: transmittal accepted or rejected"
    roles: [IRSSystem]
    code: 200
    input: [outcome]
    output: Transmittal
    side_effects: ["ACCEPTED: members -> ACCEPTED (corrections supersede originals), CFSF obligations -> FILED_VIA_CFSF; REJECTED: members revert -> VALIDATED, transmittal_id cleared"]

  - method: POST
    path: "/tax1099/transmittals/{transmittalId}/reopen"
    description: "Reopen a rejected transmittal as OPEN"
    roles: [TaxSpecialist]
    code: 200
    input: []
    output: Transmittal
    side_effects: ["status -> OPEN; filing_channel/return_count/sealed_by reset"]

  - method: POST
    path: "/tax1099/state-rules"
    description: "Create a state reporting rule (closed effective interval, no per-state overlap)"
    roles: [TaxAdmin]
    code: 201
    input: [state_code, participates_in_cfsf, direct_reporting_threshold_cents, effective_from, effective_to]
    output: StateRule
    side_effects: ["ERR_STATE_RULE_OVERLAP when another rule for state_code has effective_from <= new.effective_to AND new.effective_from <= existing.effective_to (closed-closed: touching endpoints overlap); ERR_INVALID_REQUEST when effective_to < effective_from"]

  - method: POST
    path: "/tax1099/state-obligations/evaluate"
    description: "Compute/refresh per-vendor state obligations for a tax year"
    roles: [TaxSpecialist]
    code: 200
    input: [tax_year]
    output: "{ evaluated_count: integer, created_obligation_ids: array, updated_count: integer }"
    side_effects: ["Per state_direct_reporting_channel; ERR_NO_TAX_YEAR when no TaxYear row exists for tax_year"]

  - method: GET
    path: "/tax1099/state-obligations/{obligationId}"
    description: "Get a single state obligation"
    roles: [TaxSpecialist, TaxAdmin]
    code: 200
    input: []
    output: StateObligation
    side_effects: []

  - method: GET
    path: "/tax1099/state-obligations"
    description: "List state obligations"
    roles: [TaxSpecialist, TaxAdmin]
    code: 200
    input: ["vendor_id?", "state_rule_id?", "tax_year?", "status?", "limit?", "offset?"]
    output: StateObligation[]
    side_effects: []

  - method: POST
    path: "/tax1099/state-obligations/{obligationId}/mark-filed"
    description: "Mark a DIRECT_FILE obligation as filed directly with the state"
    roles: [TaxSpecialist]
    code: 200
    input: []
    output: StateObligation
    side_effects: ["status -> FILED_DIRECT"]

  - method: POST
    path: "/tax1099/b-notices"
    description: "Record an inbound IRS B-notice (CP2100) for a vendor"
    roles: [IRSSystem]
    code: 201
    input: [vendor_id, notice_year]
    output: BNotice
    side_effects: ["stage computed via b_notice_stage_determination; vendor.b_notice_stage = max(current, new stage); when stage == SECOND vendor.backup_withholding_flag is set and cannot clear via W-9 match"]

  - method: GET
    path: "/tax1099/b-notices/{noticeId}"
    description: "Get a single B-notice"
    roles: [TaxSpecialist, TaxAdmin, IRSSystem]
    code: 200
    input: []
    output: BNotice
    side_effects: []

  - method: GET
    path: "/tax1099/b-notices"
    description: "List B-notices"
    roles: [TaxSpecialist, TaxAdmin, IRSSystem]
    code: 200
    input: ["vendor_id?", "status?", "limit?", "offset?"]
    output: BNotice[]
    side_effects: []

  - method: POST
    path: "/tax1099/b-notices/{noticeId}/resolve"
    description: "Resolve an open B-notice (FIRST: fresh MATCHED W-9; SECOND: TaxAdmin with IRS_SSA_VALIDATION code)"
    roles: [TaxSpecialist, TaxAdmin]
    code: 200
    input: ["resolution_code?"]
    output: BNotice
    side_effects: ["status -> RESOLVED; vendor.b_notice_stage and backup_withholding_flag recomputed; ERR_B_NOTICE_NOT_RESOLVABLE per stage rules"]

  - method: POST
    path: "/tax1099/vendor-merge-requests"
    description: "Request a duplicate-vendor cleanup merge"
    roles: [APClerk]
    code: 201
    input: [source_vendor_id, target_vendor_id, reason]
    output: VendorMergeRequest
    side_effects: ["requested_by_user_id = caller; ERR_SELF_MERGE when source == target (validated at request time); ERR_NOT_FOUND for unknown vendor ids"]

  - method: POST
    path: "/tax1099/vendor-merge-requests/{requestId}/approve"
    description: "Approve and execute a merge (SoD: not the requester)"
    roles: [TaxAdmin]
    code: 200
    input: []
    output: VendorMergeRequest
    side_effects: ["Full merge cascade per VendorMergeRequest machine; ERR_SEGREGATION_OF_DUTIES; ERR_TIN_MISMATCH_ON_MERGE; ERR_VENDOR_NOT_ACTIVE; ERR_VENDOR_HAS_OPEN_OBLIGATIONS"]

  - method: POST
    path: "/tax1099/vendor-merge-requests/{requestId}/reject"
    description: "Reject a pending merge request"
    roles: [TaxAdmin]
    code: 200
    input: []
    output: VendorMergeRequest
    side_effects: ["status -> REJECTED"]

  - method: GET
    path: "/tax1099/vendor-merge-requests/{requestId}"
    description: "Get a single merge request"
    roles: [APClerk, TaxAdmin]
    code: 200
    input: []
    output: VendorMergeRequest
    side_effects: []

  - method: GET
    path: "/tax1099/vendor-merge-requests"
    description: "List merge requests"
    roles: [APClerk, TaxAdmin]
    code: 200
    input: ["source_vendor_id?", "target_vendor_id?", "status?", "limit?", "offset?"]
    output: VendorMergeRequest[]
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing/empty" }
  - { id: ERR_FORBIDDEN_FOR_ROLE, http: 403, condition: "Role not allowed for endpoint, or VendorPortal X-User-ID != path vendor id" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id does not resolve to an existing resource" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body, unknown field, invalid enum member, missing required field, missing mismatch_reason_code on MISMATCHED result, bad date ranges" }
  - { id: ERR_INVALID_STATE_TRANSITION, http: 409, condition: "Resource not in a from-state of the requested transition" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not equal the parent's current version" }
  - { id: ERR_INVALID_TIN_FORMAT, http: 422, condition: "TIN present but not exactly 9 ASCII digits" }
  - { id: ERR_W9_NOT_ON_FILE, http: 409, condition: "Operation requires vendor.tin_match_status in {MATCHED, MISMATCHED} with tin present" }
  - { id: ERR_VENDOR_NOT_ACTIVE, http: 409, condition: "Operation requires vendor.status == ACTIVE" }
  - { id: ERR_VENDOR_HAS_OPEN_OBLIGATIONS, http: 409, condition: "Deactivate/merge blocked: nonzero withholding balance, open returns, or pending W-9 on merge source" }
  - { id: ERR_NO_TAX_YEAR, http: 422, condition: "No TaxYear row covers the referenced year/date" }
  - { id: ERR_TAX_YEAR_CLOSED, http: 409, condition: "Covering TaxYear exists but is CLOSED" }
  - { id: ERR_TAX_YEAR_OVERLAP, http: 409, condition: "New TaxYear half-open period intersects an existing TaxYear" }
  - { id: ERR_INVALID_AMOUNT, http: 422, condition: "amount_cents missing or <= 0" }
  - { id: ERR_PAYMENT_NOT_VOIDABLE, http: 409, condition: "Void blocked: year closed, withholding entry REMITTED, or payment inside an ACCEPTED return" }
  - { id: ERR_ENTRY_ALREADY_REMITTED, http: 409, condition: "Reverse attempted on a REMITTED withholding entry" }
  - { id: ERR_NOTHING_TO_REMIT, http: 409, condition: "Remittance draft/submit with an empty or non-positive UNREMITTED set" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Same X-User-ID on both sides of a segregated step (create/submit, seal/submit, request/approve)" }
  - { id: ERR_UNRESOLVED_SECOND_B_NOTICE, http: 409, condition: "Transmittal submit blocked: a member return's vendor has an OPEN SECOND BNotice" }
  - { id: ERR_B_NOTICE_NOT_RESOLVABLE, http: 409, condition: "Resolve violates stage rules (FIRST without fresh MATCHED W-9; SECOND without TaxAdmin + IRS_SSA_VALIDATION)" }
  - { id: ERR_RETURN_NOT_CORRECTABLE, http: 409, condition: "Correct attempted on non-ACCEPTED return or while another non-terminal correction exists" }
  - { id: ERR_TRANSMITTAL_EMPTY, http: 409, condition: "Seal found zero eligible VALIDATED returns" }
  - { id: ERR_EFILE_REQUIRED, http: 409, condition: "PAPER declared at submit while recomputed qualifying_count >= efiling_threshold_count" }
  - { id: ERR_COPY_DEADLINE_PASSED, http: 409, condition: "deliver-copy after the tax year's recipient_copy_deadline (logical clock)" }
  - { id: ERR_ELECTRONIC_CONSENT_REQUIRED, http: 409, condition: "ELECTRONIC copy delivery without vendor.e_delivery_consent" }
  - { id: ERR_STATE_RULE_OVERLAP, http: 409, condition: "StateRule closed effective interval intersects another rule for the same state_code" }
  - { id: ERR_SELF_MERGE, http: 422, condition: "Merge source and target are the same vendor" }
  - { id: ERR_TIN_MISMATCH_ON_MERGE, http: 409, condition: "Merge source and target TINs differ or either is null" }

# =============================================================================
# §1.7 RBAC Matrix (segregation_of_duties model)
# =============================================================================
roles:
  - name: APClerk
    description: "Accounts payable clerk: vendor onboarding, W-9 intake, payment recording, duplicate-merge requests"
    identity: opaque
    exclusive_operations:
      - "POST /tax1099/vendors (shared with TaxAdmin)"
      - "POST /tax1099/payments"
      - "POST /tax1099/vendor-merge-requests"
    shared_operations:
      - "PATCH /tax1099/vendors/{id} (with TaxAdmin)"
      - "POST /tax1099/payments/{id}/void (with TaxAdmin)"
      - "POST /tax1099/vendors/{id}/w9-submissions (with VendorPortal)"
      - "GET endpoints for vendors, payments, withholding entries, W-9s, merge requests"
  - name: TaxSpecialist
    description: "Tax reporting preparer: return generation/validation/correction, copy delivery, transmittal preparation and sealing, remittance drafting, state obligation evaluation, FIRST B-notice resolution"
    identity: opaque
    exclusive_operations:
      - "POST /tax1099/returns/generate, validate, void, correct, deliver-copy"
      - "POST /tax1099/transmittals create, seal, reopen"
      - "POST /tax1099/remittances create, reopen"
      - "POST /tax1099/state-obligations/evaluate and mark-filed"
    shared_operations:
      - "POST /tax1099/b-notices/{id}/resolve (FIRST stage only; with TaxAdmin)"
  - name: TaxTransmitter
    description: "Authorized transmitter: submits remittances and transmittals. Segregated from preparation steps by user id."
    identity: opaque
    exclusive_operations:
      - "POST /tax1099/remittances/{id}/submit"
      - "POST /tax1099/transmittals/{id}/submit"
    shared_operations:
      - "GET /tax1099/remittances/{id}"
      - "GET /tax1099/transmittals/{id}"
  - name: TaxAdmin
    description: "Tax administrator: tax-year and state-rule configuration, vendor master overrides, withholding reversals, merge adjudication, SECOND B-notice override, logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /tax1099/tax-years and close"
      - "POST /tax1099/state-rules"
      - "POST /tax1099/vendors/{id}/deactivate"
      - "POST /tax1099/withholding-entries/{id}/reverse"
      - "POST /tax1099/vendor-merge-requests/{id}/approve and reject"
      - "POST /tax1099/_clock/set_current_utc"
    shared_operations:
      - "POST /tax1099/vendors (with APClerk)"
      - "POST /tax1099/b-notices/{id}/resolve (both stages; with TaxSpecialist for FIRST)"
  - name: IRSSystem
    description: "Inbound government feeds: TIN match results, remittance/transmittal outcomes, B-notices (CP2100), postal bounce feed"
    identity: opaque
    exclusive_operations:
      - "POST /tax1099/w9-submissions/{id}/record-match-result"
      - "POST /tax1099/remittances/{id}/record-outcome"
      - "POST /tax1099/transmittals/{id}/record-outcome"
      - "POST /tax1099/b-notices"
      - "POST /tax1099/returns/{id}/record-copy-bounce"
    shared_operations:
      - "GET /tax1099/b-notices"
  - name: VendorPortal
    description: "Vendor self-service: submits its own W-9 and reads its own vendor record"
    identity: entity_backed:Vendor
    exclusive_operations: []
    shared_operations:
