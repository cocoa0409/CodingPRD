          Pair (Site, Permit) — a different entity pair from (Site, DrawingSet):
          Site PERMITTING -> MOBILIZED requires the site's BUILDING Permit in
          ISSUED; while the permit is UNDER_REVIEW the transition fails with
          ERR_PERMIT_NOT_ISSUED and succeeds only after issuance.
        test_recipe:
          setup:
