# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Tour Merchandise & Venue Split Management
# Breadth walk of SCAFFOLD.yaml §1.1–§1.7 per references/claim-extraction-guide.md.
# Corners already exercised by §1.8 appear as excluded_because stubs.
# =============================================================================
scaffold_corner_design:
  # ===========================================================================
  - section: entities
    instances:
      - name: tour_create_applies_defaults_and_initial_state
        claim_type: defaults
        grounds: [entities.Tour.fields.default_size_curve, entities.Tour.fields.cash_variance_tolerance_cents, state_machines.Tour.initial_state]
        distinguishing_aspect: "Omitting the two defaulted inputs yields default_size_curve {S:1,M:2,L:2,XL:1} and tolerance 1000; a new tour starts PLANNING with version 1."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /merch/tours"
              payload: { name: "CD Tour", artist_name: "Artist", standard_rate_bps: 1000, tier_threshold_cents: 500000, tier_bonus_bps: 500, licensed_flat_per_unit_cents: 500, licensed_rate_bps: 2000 }
              as: TourManager
              as_user_id: "tm-1"
              captures: { t_id: $.data.id }
          trigger:
            - call: "GET /merch/tours/${t_id}"
              payload: {}
              as: TourManager
              as_user_id: "tm-1"
          assert:
            - "Tour.${t_id}.default_size_curve == {\"S\":1,\"M\":2,\"L\":2,\"XL\":1}"
            - "Tour.${t_id}.cash_variance_tolerance_cents == 1000"
            - "Tour.${t_id}.status == PLANNING and version == 1"
            - "Tour.${t_id}.royalty_payable_cents == 0"

      - name: product_create_rejects_computed_field_input
        claim_type: computed_fields
        grounds: [entities.Product.fields.warehouse_stock_by_size]
        distinguishing_aspect: "Client-supplied value for the computed field warehouse_stock_by_size is rejected with ERR_VALIDATION rather than silently stored."
        test_recipe:
          setup: ["one tour exists"]
          setup_api_calls:
            - call: "POST /merch/tours"
              payload: { name: "CD2 Tour", artist_name: "Artist", cash_variance_tolerance_cents: 1000, standard_rate_bps: 1000, tier_threshold_cents: 500000, tier_bonus_bps: 500, licensed_flat_per_unit_cents: 500, licensed_rate_bps: 2000 }
              as: TourManager
              as_user_id: "tm-1"
              captures: { t_id: $.data.id }
          trigger:
            - call: "POST /merch/products"
              payload: { tour_id: "${t_id}", sku: "CD2-X", name: "X", product_type: "REGULAR", royalty_treatment: "STANDARD", sized: false, base_price_cents: 4000, initial_stock_by_size: { OS: 10 }, warehouse_stock_by_size: { OS: 9999 } }
              as: TourManager
              as_user_id: "tm-1"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_VALIDATION and HTTP 400 (computed/system fields are not writable)"
            - "no Product row is created"

      - name: seller_list_pagination_envelope
        claim_type: listing
        grounds: [response_envelope.pagination_fields, response_envelope.pagination_defaults]
        distinguishing_aspect: "With 3 sellers, limit=2 returns 2 rows with total_count 3 and has_more true; offset=2 returns the last row with has_more false."
        test_recipe:
          setup: ["tour with three rostered sellers"]
          setup_api_calls:
            - call: "POST /merch/tours"
              payload: { name: "CD3 Tour", artist_name: "Artist", cash_variance_tolerance_cents: 1000, standard_rate_bps: 1000, tier_threshold_cents: 500000, tier_bonus_bps: 500, licensed_flat_per_unit_cents: 500, licensed_rate_bps: 2000 }
              as: TourManager
              as_user_id: "tm-1"
              captures: { t_id: $.data.id }
            - call: "POST /merch/sellers"
              payload: { tour_id: "${t_id}", display_name: "S1", seller_code: "CD3-1" }
              as: TourManager
              as_user_id: "tm-1"
            - call: "POST /merch/sellers"
              payload: { tour_id: "${t_id}", display_name: "S2", seller_code: "CD3-2" }
              as: TourManager
              as_user_id: "tm-1"
            - call: "POST /merch/sellers"
              payload: { tour_id: "${t_id}", display_name: "S3", seller_code: "CD3-3" }
              as: TourManager
              as_user_id: "tm-1"
          trigger:
            - call: "GET /merch/sellers"
              payload: { tour_id: "${t_id}", limit: 2, offset: 0 }
              as: TourManager
              as_user_id: "tm-1"
            - call: "GET /merch/sellers"
              payload: { tour_id: "${t_id}", limit: 2, offset: 2 }
              as: TourManager
              as_user_id: "tm-1"
          assert:
            - "first page: response_type == array, exactly 2 rows, total_count == 3, has_more == true"
            - "second page: exactly 1 row, total_count == 3, has_more == false"
            - "omitting limit/offset uses defaults limit=10 offset=0"

      - name: allocation_on_hand_computed_after_sale
        claim_type: computed_fields
        grounds: [entities.Allocation.fields.quantity_on_hand, entities.Allocation.fields.quantity_sold]
        distinguishing_aspect: "After generating 100 OS units and selling 10, the allocation reads quantity_sold == 10 and quantity_on_hand == 90 — both computed, never stored from input."
        test_recipe:
          setup: ["ACTIVE tour; FLAT show opened; OS product priced 4000 with 100 allocated; seller A session open (float 5000)"]
          setup_api_calls:
            - call: "POST /merch/tours"
              payload: { name: "CD4 Tour", artist_name: "Artist", cash_variance_tolerance_cents: 1000, standard_rate_bps: 1000, tier_threshold_cents: 500000, tier_bonus_bps: 500, licensed_flat_per_unit_cents: 500, licensed_rate_bps: 2000 }
              as: TourManager
              as_user_id: "tm-1"
              captures: { t_id: $.data.id }
            - call: "POST /merch/tours/${t_id}/activate"
              payload: {}
              as: TourManager
              as_user_id: "tm-1"
            - call: "POST /merch/shows"
              payload: { tour_id: "${t_id}", city: "Aspen", venue_name: "CD4 Hall", show_date: "2026-08-28T20:00:00Z", commission_mode: "FLAT", flat_commission_bps: 1500 }
              as: TourManager
              as_user_id: "tm-1"
              captures: { s_id: $.data.id }
            - call: "POST /merch/products"
              payload: { tour_id: "${t_id}", sku: "CD4-TEE", name: "Tee", product_type: "REGULAR", royalty_treatment: "STANDARD", sized: false, base_price_cents: 4000, initial_stock_by_size: { OS: 500 } }
              as: TourManager
              as_user_id: "tm-1"
              captures: { p_id: $.data.id }
            - call: "POST /merch/show-products"
              payload: { show_id: "${s_id}", product_id: "${p_id}", price_cents: 4000 }
              as: TourManager
              as_user_id: "tm-1"
            - call: "POST /merch/shows/${s_id}/allocations/generate"
              payload: { product_id: "${p_id}", total_units: 100 }
              as: TourManager
              as_user_id: "tm-1"
              captures: { a_id: "$.data[0].id" }
            - call: "POST /merch/sellers"
              payload: { tour_id: "${t_id}", display_name: "Seller A", seller_code: "CD4-A" }
              as: TourManager
              as_user_id: "tm-1"
              captures: { sl_a: $.data.id }
            - call: "POST /merch/shows/${s_id}/open"
              payload: {}
              as: TourManager
              as_user_id: "tm-1"
            - call: "POST /merch/seller-sessions"
              payload: { show_id: "${s_id}", seller_id: "${sl_a}", cash_float_cents: 5000 }
              as: TourManager
              as_user_id: "tm-1"
              captures: { ss_id: $.data.id }
            - call: "POST /merch/sale-records"
              payload: { session_id: "${ss_id}", allocation_id: "${a_id}", quantity: 10, tender: "CARD" }
              as: Seller
              as_user_id: "${sl_a}"
          trigger:
            - call: "GET /merch/allocations/${a_id}"
              payload: {}
              as: TourManager
              as_user_id: "tm-1"
          assert:
            - "Allocation.${a_id}.quantity_allocated == 100 and quantity_sold == 10 and quantity_on_hand == 90"
            - "SellerSession.${ss_id}.expected_cash_cents == 5000 (CARD sale never enters the cash drawer)"

      - name: show_create_rejects_malformed_commission_tiers
        claim_type: type_constraints
        grounds: [entities.Show.fields.commission_tiers, "validations[priority=7.5]"]
        distinguishing_aspect: "A TIERED show whose tier list lacks the trailing null up_to_cents tier is rejected with ERR_INVALID_COMMISSION_CONFIG."
        test_recipe:
          setup: ["one tour exists"]
          setup_api_calls:
            - call: "POST /merch/tours"
              payload: { name: "CD5 Tour", artist_name: "Artist", cash_variance_tolerance_cents: 1000, standard_rate_bps: 1000, tier_threshold_cents: 500000, tier_bonus_bps: 500, licensed_flat_per_unit_cents: 500, licensed_rate_bps: 2000 }
              as: TourManager
              as_user_id: "tm-1"
              captures: { t_id: $.data.id }
          trigger:
            - call: "POST /merch/shows"
              payload: { tour_id: "${t_id}", city: "Moab", venue_name: "CD5 Hall", show_date: "2026-08-29T20:00:00Z", commission_mode: "TIERED", commission_tiers: [ { up_to_cents: 500000, rate_bps: 1000 } ] }
              as: TourManager
              as_user_id: "tm-1"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_COMMISSION_CONFIG, HTTP 400; no Show row created"

      - name: online_order_for_sized_product_requires_size
        claim_type: required_fields
        grounds: [entities.OnlineOrder.fields.size, entities.Product.fields.sized]
        distinguishing_aspect: "Ordering a sized product online without a size is ERR_VALIDATION; the same order with size M succeeds."
        test_recipe:
          setup: ["ACTIVE tour with a sized product (warehouse M stock 50)"]
          setup_api_calls:
            - call: "POST /merch/tours"
              payload: { name: "CD6 Tour", artist_name: "Artist", cash_variance_tolerance_cents: 1000, standard_rate_bps: 1000, tier_threshold_cents: 500000, tier_bonus_bps: 500, licensed_flat_per_unit_cents: 500, licensed_rate_bps: 2000 }
              as: TourManager
              as_user_id: "tm-1"
              captures: { t_id: $.data.id }
            - call: "POST /merch/tours/${t_id}/activate"
              payload: {}
              as: TourManager
              as_user_id: "tm-1"
            - call: "POST /merch/products"
              payload: { tour_id: "${t_id}", sku: "CD6-HOODIE", name: "Hoodie", product_type: "REGULAR", royalty_treatment: "STANDARD", sized: true, base_price_cents: 8000, initial_stock_by_size: { M: 50 } }
              as: TourManager
              as_user_id: "tm-1"
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /merch/online-orders"
              payload: { tour_id: "${t_id}", product_id: "${p_id}", quantity: 1 }
              as: TourManager
              as_user_id: "tm-1"
              captures: { err: $.data.error_id }
            - call: "POST /merch/online-orders"
              payload: { tour_id: "${t_id}", product_id: "${p_id}", size: "M", quantity: 1 }
              as: TourManager
              as_user_id: "tm-1"
              captures: { o_id: $.data.id }
          assert:
            - "sizeless order: err == ERR_VALIDATION, HTTP 400"
            - "sized order: created 201, OnlineOrder.${o_id}.status == PLACED, unit_price_cents == 8000 pinned from base price"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: show_reopen_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Show.SCHEDULED_to_OPEN]
        distinguishing_aspect: "OPEN is not a valid from-state for open; a second open returns ERR_INVALID_SHOW_STATE and the show stays OPEN."
        test_recipe:
          setup: ["ACTIVE tour with an OPEN show"]
          setup_api_calls:
            - call: "POST /merch/tours"
              payload: { name: "SM1 Tour", artist_name: "Artist", cash_variance_tolerance_cents: 1000, standard_rate_bps: 1000, tier_threshold_cents: 500000, tier_bonus_bps: 500, licensed_flat_per_unit_cents: 500, licensed_rate_bps: 2000 }
              as: TourManager
              as_user_id: "tm-1"
              captures: { t_id: $.data.id }
            - call: "POST /merch/tours/${t_id}/activate"
              payload: {}
              as: TourManager
              as_user_id: "tm-1"
            - call: "POST /merch/shows"
              payload: { tour_id: "${t_id}", city: "Lodi", venue_name: "SM1 Hall", show_date: "2026-08-30T20:00:00Z", commission_mode: "FLAT", flat_commission_bps: 1500 }
              as: TourManager
              as_user_id: "tm-1"
              captures: { s_id: $.data.id }
            - call: "POST /merch/shows/${s_id}/open"
              payload: {}
              as: TourManager
              as_user_id: "tm-1"
          trigger:
            - call: "POST /merch/shows/${s_id}/open"
              payload: {}
              as: TourManager
              as_user_id: "tm-1"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_SHOW_STATE, HTTP 409; Show.${s_id}.status remains OPEN"

      - name: show_cancel_after_open_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Show.SCHEDULED_to_CANCELLED]
        distinguishing_aspect: "Cancel exists only from SCHEDULED; cancelling an OPEN show is ERR_INVALID_SHOW_STATE (post-doors cancellations are out of scope)."
        test_recipe:
          setup: ["ACTIVE tour with an OPEN show"]
          setup_api_calls:
            - call: "POST /merch/tours"
              payload: { name: "SM2 Tour", artist_name: "Artist", cash_variance_tolerance_cents: 1000, standard_rate_bps: 1000, tier_threshold_cents: 500000, tier_bonus_bps: 500, licensed_flat_per_unit_cents: 500, licensed_rate_bps: 2000 }
              as: TourManager
              as_user_id: "tm-1"
              captures: { t_id: $.data.id }
            - call: "POST /merch/tours/${t_id}/activate"
              payload: {}
              as: TourManager
              as_user_id: "tm-1"
            - call: "POST /merch/shows"
              payload: { tour_id: "${t_id}", city: "Lodi", venue_name: "SM2 Hall", show_date: "2026-08-30T20:00:00Z", commission_mode: "FLAT", flat_commission_bps: 1500 }
              as: TourManager
              as_user_id: "tm-1"
              captures: { s_id: $.data.id }
            - call: "POST /merch/shows/${s_id}/open"
              payload: {}
              as: TourManager
              as_user_id: "tm-1"
          trigger:
            - call: "POST /merch/shows/${s_id}/cancel"
              payload: {}
              as: TourManager
              as_user_id: "tm-1"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_SHOW_STATE, HTTP 409; Show.${s_id}.status remains OPEN"

      - name: settlement_dispute_after_finalize_rejected
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Settlement.RECONCILED_to_FINALIZED, state_machines.Settlement.RECONCILED_to_DISPUTED]
        distinguishing_aspect: "FINALIZED is terminal: disputing a finalized settlement fails with ERR_SETTLEMENT_NOT_RECONCILED and rebase-royalty fails with ERR_INVALID_SETTLEMENT_STATE."
        test_recipe:
          setup:
            - "ACTIVE tour; FLAT 1500 show; OS product price 2000, 100 allocated; sellers A and B"
            - "Session A sold 8 CASH (16000), counted 21000, verified by B; settlement reconciled by acct-1 and finalized by acct-2"
          setup_api_calls:
            - call: "POST /merch/tours"
              payload: { name: "SM3 Tour", artist_name: "Artist", cash_variance_tolerance_cents: 1000, standard_rate_bps: 1000, tier_threshold_cents: 500000, tier_bonus_bps: 500, licensed_flat_per_unit_cents: 500, licensed_rate_bps: 2000 }
              as: TourManager
              as_user_id: "tm-1"
              captures: { t_id: $.data.id }
            - call: "POST /merch/tours/${t_id}/activate"
              payload: {}
              as: TourManager
              as_user_id: "tm-1"
            - call: "POST /merch/shows"
              payload: { tour_id: "${t_id}", city: "Madera", venue_name: "SM3 Hall", show_date: "2026-08-31T20:00:00Z", commission_mode: "FLAT", flat_commission_bps: 1500 }
              as: TourManager
              as_user_id: "tm-1"
              captures: { s_id: $.data.id }
            - call: "POST /merch/products"
              payload: { tour_id: "${t_id}", sku: "SM3-CAP", name: "Cap", product_type: "REGULAR", royalty_treatment: "STANDARD", sized: false, base_price_cents: 2000, initial_stock_by_size: { OS: 500 } }
              as: TourManager
              as_user_id: "tm-1"
              captures: { p_id: $.data.id }
            - call: "POST /merch/show-products"
              payload: { show_id: "${s_id}", product_id: "${p_id}", price_cents: 2000 }
              as: TourManager
              as_user_id: "tm-1"
            - call: "POST /merch/shows/${s_id}/allocations/generate"
              payload: { product_id: "${p_id}", total_units: 100 }
              as: TourManager
              as_user_id: "tm-1"
              captures: { a_id: "$.data[0].id" }
            - call: "POST /merch/sellers"
              payload: { tour_id: "${t_id}", display_name: "Seller A", seller_code: "SM3-A" }
              as: TourManager
              as_user_id: "tm-1"
              captures: { sl_a: $.data.id }
            - call: "POST /merch/sellers"
              payload: { tour_id: "${t_id}", display_name: "Seller B", seller_code: "SM3-B" }
              as: TourManager
              as_user_id: "tm-1"
              captures: { sl_b: $.data.id }
            - call: "POST /merch/shows/${s_id}/open"
              payload: {}
              as: TourManager
              as_user_id: "tm-1"
            - call: "POST /merch/seller-sessions"
              payload: { show_id: "${s_id}", seller_id: "${sl_a}", cash_float_cents: 5000 }
              as: TourManager
              as_user_id: "tm-1"
              captures: { ss_id: $.data.id }
            - call: "POST /merch/sale-records"
              payload: { session_id: "${ss_id}", allocation_id: "${a_id}", quantity: 8, tender: "CASH" }
              as: Seller
              as_user_id: "${sl_a}"
            - call: "POST /merch/seller-sessions/${ss_id}/count-out"
              payload: { counted_cash_cents: 21000 }
              as: Seller
              as_user_id: "${sl_a}"
            - call: "POST /merch/seller-sessions/${ss_id}/verify"
              payload: { decision: "APPROVE" }
              as: Seller
              as_user_id: "${sl_b}"
            - call: "POST /merch/shows/${s_id}/begin-reconciliation"
              payload: {}
              as: TourManager
              as_user_id: "tm-1"
              captures: { st_id: $.data.settlement_id }
            - call: "POST /merch/settlements/${st_id}/reconcile"
              payload: {}
              as: Accountant
              as_user_id: "acct-1"
            - call: "POST /merch/settlements/${st_id}/finalize"
              payload: {}
              as: Accountant
              as_user_id: "acct-2"
          trigger:
            - call: "POST /merch/settlements/${st_id}/dispute"
              payload: { reason: "too late" }
              as: VenueRep
              as_user_id: "venue-1"
              captures: { err: $.data.error_id }
            - call: "POST /merch/settlements/${st_id}/rebase-royalty"
              payload: {}
              as: Accountant
              as_user_id: "acct-1"
              captures: { err2: $.data.error_id }
          assert:
            - "err == ERR_SETTLEMENT_NOT_RECONCILED (dispute requires RECONCILED)"
            - "err2 == ERR_INVALID_SETTLEMENT_STATE (rebase never allowed once FINALIZED)"
            - "Settlement.${st_id}.status remains FINALIZED"

      - name: sale_record_void_twice_rejected
        claim_type: terminal_state_lockdown
        grounds: [state_machines.SaleRecord.ACTIVE_to_VOIDED]
        distinguishing_aspect: "VOIDED is terminal: a second void returns ERR_ALREADY_TERMINAL and no further ledger reversal occurs."
        test_recipe:
          setup: ["ACTIVE tour; OPEN show; session with one ACTIVE CASH sale of 2 units @4000"]
          setup_api_calls:
            - call: "POST /merch/tours"
              payload: { name: "SM4 Tour", artist_name: "Artist", cash_variance_tolerance_cents: 1000, standard_rate_bps: 1000, tier_threshold_cents: 500000, tier_bonus_bps: 500, licensed_flat_per_unit_cents: 500, licensed_rate_bps: 2000 }
              as: TourManager
              as_user_id: "tm-1"
              captures: { t_id: $.data.id }
            - call: "POST /merch/tours/${t_id}/activate"
              payload: {}
              as: TourManager
              as_user_id: "tm-1"
            - call: "POST /merch/shows"
              payload: { tour_id: "${t_id}", city: "Visalia", venue_name: "SM4 Hall", show_date: "2026-09-01T20:00:00Z", commission_mode: "FLAT", flat_commission_bps: 1500 }
              as: TourManager
              as_user_id: "tm-1"
              captures: { s_id: $.data.id }
            - call: "POST /merch/products"
              payload: { tour_id: "${t_id}", sku: "SM4-TEE", name: "Tee", product_type: "REGULAR", royalty_treatment: "STANDARD", sized: false, base_price_cents: 4000, initial_stock_by_size: { OS: 500 } }
              as: TourManager
              as_user_id: "tm-1"
              captures: { p_id: $.data.id }
            - call: "POST /merch/show-products"
              payload: { show_id: "${s_id}", product_id: "${p_id}", price_cents: 4000 }
              as: TourManager
              as_user_id: "tm-1"
            - call: "POST /merch/shows/${s_id}/allocations/generate"
              payload: { product_id: "${p_id}", total_units: 50 }
              as: TourManager
              as_user_id: "tm-1"
              captures: { a_id: "$.data[0].id" }
            - call: "POST /merch/sellers"
              payload: { tour_id: "${t_id}", display_name: "Seller A", seller_code: "SM4-A" }
              as: TourManager
              as_user_id: "tm-1"
              captures: { sl_a: $.data.id }
            - call: "POST /merch/shows/${s_id}/open"
              payload: {}
              as: TourManager
              as_user_id: "tm-1"
            - call: "POST /merch/seller-sessions"
              payload: { show_id: "${s_id}", seller_id: "${sl_a}", cash_float_cents: 5000 }
              as: TourManager
              as_user_id: "tm-1"
              captures: { ss_id: $.data.id }
            - call: "POST /merch/sale-records"
              payload: { session_id: "${ss_id}", allocation_id: "${a_id}", quantity: 2, tender: "CASH" }
              as: Seller
              as_user_id: "${sl_a}"
              captures: { sr_id: $.data.id }
            - call: "POST /merch/sale-records/${sr_id}/void"
              payload: { void_reason: "miskey" }
              as: Seller
              as_user_id: "${sl_a}"
          trigger:
            - call: "POST /merch/sale-records/${sr_id}/void"
              payload: { void_reason: "again" }
              as: Seller
              as_user_id: "${sl_a}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_ALREADY_TERMINAL, HTTP 409"
            - "Allocation.${a_id}.quantity_sold remains 0 (single reversal only)"

      - name: shipment_receive_from_draft_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Shipment.DISPATCHED_to_RECEIVED]
        distinguishing_aspect: "Receive requires DISPATCHED; receiving a DRAFT shipment fails with ERR_SHIPMENT_NOT_DISPATCHED and creates no allocation rows."
        test_recipe:
          setup: ["tour with OS product (stock 1000) and a show on 2026-08-10; one DRAFT warehouse shipment"]
          setup_api_calls:
            - call: "POST /merch/tours"
