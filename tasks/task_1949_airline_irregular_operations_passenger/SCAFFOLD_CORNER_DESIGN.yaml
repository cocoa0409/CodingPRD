# =============================================================================
# Task 1949: Airline Irregular Operations & Passenger Rebooking
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Sections and claim_type values follow references/claim-extraction-guide.md.
# =============================================================================

scaffold_corner_design:
  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: passenger_creation_defaults
        claim_type: defaults
        grounds: [entities.Passenger.fields.loyalty_tier, entities.Passenger.fields.special_service_codes]
        distinguishing_aspect: "Omitting optional fields applies declared defaults: loyalty_tier NONE, special_service_codes []."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls:
            - { call: "POST /irops/passengers", payload: { full_name: "Def D", contact_email: "def@x.com" }, as: ReaccommodationAgent, captures: { pax: "$.data.id" } }
          trigger:
            - { call: "GET /irops/passengers/${pax}", as: OpsController }
          assert:
            - "Passenger.${pax}.loyalty_tier == NONE"
            - "Passenger.${pax}.special_service_codes == []"

      - name: flight_creation_creates_cabin_inventories
        claim_type: creation
        grounds: [entities.CabinInventory, "endpoints.POST /irops/flights"]
        distinguishing_aspect: "Flight create fans out one CabinInventory per cabins entry with seats_sold 0 and seats_available == capacity."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls:
            - { call: "POST /irops/flights", payload: { flight_number: "OC1", origin: "HUB", destination: "DST", sched_dep_utc: "2026-08-10T10:00:00Z", sched_arr_utc: "2026-08-10T11:30:00Z", distance_km: 900, operating_carrier: "OC", cabins: [{ cabin: "ECONOMY", capacity: 100 }, { cabin: "BUSINESS", capacity: 20 }] }, as: OpsController, captures: { f: "$.data.id" } }
          trigger:
            - { call: "GET /irops/flights/${f}/cabin-inventories", as: OpsController }
          assert:
            - "exactly 2 CabinInventory rows exist for flight ${f}"
            - "ECONOMY row: seats_sold == 0, interline_seats_committed == 0, seats_available == 100"
            - "BUSINESS row: seats_available == 20"

      - name: booking_computed_fields_at_creation
        claim_type: computed_fields
        grounds: [entities.Booking.fields.refund_amount_cents, entities.Booking.fields.credit_amount_cents]
        distinguishing_aspect: "Computed money fields initialize from the itinerary: with no FLOWN segments refund_amount_cents == fare_cents and credit_amount_cents == round_half_up(fare * 1.10)."
        test_recipe:
          setup: ["one flight, one passenger"]
          setup_api_calls:
            - { call: "POST /irops/passengers", payload: { full_name: "Cmp C", contact_email: "cmp@x.com" }, as: ReaccommodationAgent, captures: { pax: "$.data.id" } }
            - { call: "POST /irops/flights", payload: { flight_number: "OC2", origin: "HUB", destination: "DST", sched_dep_utc: "2026-08-10T10:00:00Z", sched_arr_utc: "2026-08-10T11:00:00Z", distance_km: 1000, operating_carrier: "OC", cabins: [{ cabin: "ECONOMY", capacity: 50 }] }, as: OpsController, captures: { f: "$.data.id" } }
          trigger:
            - { call: "POST /irops/bookings", payload: { passenger_id: "${pax}", fare_cents: 12345, cabin: "ECONOMY", party_size: 1, segments: [{ flight_id: "${f}", seq_no: 1 }] }, as: ReaccommodationAgent, captures: { bk: "$.data.id" } }
          assert:
            - "Booking.${bk}.booking_status == ACTIVE and compensation_status == NONE (initial states)"
            - "Booking.${bk}.refund_amount_cents == 12345 (zero FLOWN segments)"
            - "Booking.${bk}.credit_amount_cents == 13580 (round_half_up(12345 * 1.10) = round_half_up(13579.5))"

      - name: entity_system_fields_on_create
        claim_type: system_fields
        grounds: [entities.Flight]
        distinguishing_aspect: "Server mints id (UUID), created_at/updated_at (ISO8601 ms), version 1 on creation."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls:
            - { call: "POST /irops/flights", payload: { flight_number: "OC3", origin: "HUB", destination: "DST", sched_dep_utc: "2026-08-10T10:00:00Z", sched_arr_utc: "2026-08-10T11:00:00Z", distance_km: 900, operating_carrier: "OC", cabins: [{ cabin: "ECONOMY", capacity: 50 }] }, as: OpsController, captures: { f: "$.data.id", fv: "$.data.version" } }
          trigger:
            - { call: "GET /irops/flights/${f}", as: OpsController }
          assert:
            - "id is a bare UUID without type prefix; version == 1; created_at == updated_at; flight_status == SCHEDULED; crew_coverage_status == CREW_SHORT (no LEGAL CAPTAIN/FIRST_OFFICER assignments yet)"

      - name: passenger_create_missing_required_field
        claim_type: required_fields
        grounds: [entities.Passenger.fields.full_name, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Missing required input full_name -> 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /irops/passengers", payload: { contact_email: "nofield@x.com" }, as: ReaccommodationAgent, captures: { err: "$.data.error_id" } }
          assert:
            - "response 400 with error_id == ERR_INVALID_REQUEST"

      - name: voucher_issue_invalid_enum_value
        claim_type: type_constraints
        grounds: [entities.Voucher.fields.voucher_type, "errors[ERR_INVALID_ENUM]"]
        distinguishing_aspect: "Enum input outside the declared domain -> 400 ERR_INVALID_ENUM (before any state/business check)."
        test_recipe:
          setup: ["booking id can be any UUID — enum validation (priority 5) precedes existence (priority 6)"]
          setup_api_calls: []
          trigger:
            - { call: "POST /irops/bookings/00000000-0000-4000-8000-000000000000/vouchers", payload: { voucher_type: "FOOD" }, as: ReaccommodationAgent, captures: { err: "$.data.error_id" } }
          assert:
            - "response 400 with error_id == ERR_INVALID_ENUM"

      - name: flight_get_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but non-existent UUID -> 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /irops/flights/00000000-0000-4000-8000-000000000000", as: OpsController, captures: { err: "$.data.error_id" } }
          assert:
            - "response 404 with error_id == ERR_NOT_FOUND"

      - name: cost_entry_append_only_immutability
        claim_type: immutability
        grounds: [entities.CostEntry]
        distinguishing_aspect: "common_fields: false — CostEntry rows expose id and created_at but no version/updated_at, and no update/delete endpoint exists."
        test_recipe:
          setup: ["controllable event RECOVERY; disrupted booking; one TRANSPORT voucher issued (posts one ACCRUAL CostEntry)"]
          setup_api_calls:
            - { call: "POST /irops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T06:00:00Z" }, as: OpsAdmin }
            - { call: "POST /irops/passengers", payload: { full_name: "Imm I", contact_email: "imm@x.com" }, as: ReaccommodationAgent, captures: { pax: "$.data.id" } }
            - { call: "POST /irops/flights", payload: { flight_number: "OC4", origin: "HUB", destination: "DST", sched_dep_utc: "2026-08-10T09:00:00Z", sched_arr_utc: "2026-08-10T10:00:00Z", distance_km: 900, operating_carrier: "OC", cabins: [{ cabin: "ECONOMY", capacity: 100 }] }, as: OpsController, captures: { f: "$.data.id", fv: "$.data.version" } }
            - { call: "POST /irops/disruption-events", payload: { event_code: "MECH-C1", hub: "HUB", classification: "MECHANICAL", cost_cap_cents: 100000 }, as: DutyManager, captures: { ev: "$.data.id" } }
            - { call: "POST /irops/disruption-events/${ev}/assess", payload: {}, as: DutyManager }
            - { call: "POST /irops/bookings", payload: { passenger_id: "${pax}", fare_cents: 12000, cabin: "ECONOMY", party_size: 1, segments: [{ flight_id: "${f}", seq_no: 1 }] }, as: ReaccommodationAgent, captures: { bk: "$.data.id" } }
            - { call: "POST /irops/flights/${f}/cancel", payload: { disruption_event_id: "${ev}", expected_flight_version: "${fv}" }, as: OpsController }
            - { call: "POST /irops/disruption-events/${ev}/declare-recovery", payload: {}, as: DutyManager }
            - { call: "POST /irops/bookings/${bk}/vouchers", payload: { voucher_type: "TRANSPORT" }, as: ReaccommodationAgent }
          trigger:
            - { call: "GET /irops/disruption-events/${ev}/cost-entries", as: FinanceProcessor }
          assert:
            - "data[0] contains id and created_at but neither version nor updated_at"
            - "data[0].entry_kind == ACCRUAL and data[0].amount_cents == 5000 and data[0].source_type == VOUCHER"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: flight_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Flight, "errors[ERR_FLIGHT_NOT_CANCELLABLE]", "errors[ERR_FLIGHT_NOT_DELAYABLE]"]
        distinguishing_aspect: "From ARRIVED both cancel and delay are rejected; terminal state admits no further transitions."
        test_recipe:
          setup: ["flight F flown to ARRIVED"]
          setup_api_calls:
            - { call: "POST /irops/flights", payload: { flight_number: "OC5", origin: "HUB", destination: "DST", sched_dep_utc: "2026-08-10T08:00:00Z", sched_arr_utc: "2026-08-10T09:00:00Z", distance_km: 900, operating_carrier: "OC", cabins: [{ cabin: "ECONOMY", capacity: 50 }] }, as: OpsController, captures: { f: "$.data.id", fv: "$.data.version" } }
            - { call: "POST /irops/disruption-events", payload: { event_code: "WX-C2", hub: "HUB", classification: "WEATHER", cost_cap_cents: 1000 }, as: DutyManager, captures: { ev: "$.data.id" } }
            - { call: "POST /irops/flights/${f}/depart", payload: { act_dep_utc: "2026-08-10T08:05:00Z" }, as: OpsController }
            - { call: "POST /irops/flights/${f}/record-actuals", payload: { act_arr_utc: "2026-08-10T09:05:00Z" }, as: OpsController, captures: { fv2: "$.data.version" } }
          trigger:
            - { call: "POST /irops/flights/${f}/cancel", payload: { disruption_event_id: "${ev}", expected_flight_version: "${fv2}" }, as: OpsController, captures: { err1: "$.data.error_id" } }
            - { call: "POST /irops/flights/${f}/delay", payload: { new_sched_dep_utc: "2026-08-10T12:00:00Z", new_sched_arr_utc: "2026-08-10T13:00:00Z", expected_flight_version: "${fv2}" }, as: OpsController, captures: { err2: "$.data.error_id" } }
          assert:
            - "cancel on ARRIVED -> 409 ERR_FLIGHT_NOT_CANCELLABLE"
            - "delay on ARRIVED -> 409 ERR_FLIGHT_NOT_DELAYABLE"

      - name: event_invalid_from_transitions
        claim_type: invalid_transition
        grounds: [state_machines.DisruptionEvent, "errors[ERR_EVENT_INVALID_STATE]"]
        distinguishing_aspect: "close from OPEN and a repeated assess from ASSESSING are both invalid-from rejections."
        test_recipe:
          setup: ["fresh event E"]
          setup_api_calls:
            - { call: "POST /irops/disruption-events", payload: { event_code: "WX-C3", hub: "HUB", classification: "WEATHER", cost_cap_cents: 1000 }, as: DutyManager, captures: { ev: "$.data.id", st0: "$.data.event_status" } }
          trigger:
            - { call: "POST /irops/disruption-events/${ev}/close", payload: {}, as: DutyManager, captures: { err1: "$.data.error_id" } }
            - { call: "POST /irops/disruption-events/${ev}/assess", payload: {}, as: DutyManager }
            - { call: "POST /irops/disruption-events/${ev}/assess", payload: {}, as: DutyManager, captures: { err2: "$.data.error_id" } }
          assert:
            - "initial event_status == OPEN"
            - "close from OPEN -> 409 ERR_EVENT_INVALID_STATE"
            - "second assess from ASSESSING -> 409 ERR_EVENT_INVALID_STATE"

      - name: voucher_redeem_after_void_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Voucher, "errors[ERR_VOUCHER_NOT_OPEN]"]
        distinguishing_aspect: "VOIDED is terminal; redeem afterwards -> ERR_VOUCHER_NOT_OPEN."
        test_recipe:
          setup: ["event RECOVERY; disrupted booking; TRANSPORT voucher issued then voided"]
          setup_api_calls:
            - { call: "POST /irops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T06:00:00Z" }, as: OpsAdmin }
            - { call: "POST /irops/passengers", payload: { full_name: "Vic V", contact_email: "vic@x.com" }, as: ReaccommodationAgent, captures: { pax: "$.data.id" } }
            - { call: "POST /irops/flights", payload: { flight_number: "OC6", origin: "HUB", destination: "DST", sched_dep_utc: "2026-08-10T09:00:00Z", sched_arr_utc: "2026-08-10T10:00:00Z", distance_km: 900, operating_carrier: "OC", cabins: [{ cabin: "ECONOMY", capacity: 100 }] }, as: OpsController, captures: { f: "$.data.id", fv: "$.data.version" } }
            - { call: "POST /irops/disruption-events", payload: { event_code: "MECH-C4", hub: "HUB", classification: "MECHANICAL", cost_cap_cents: 100000 }, as: DutyManager, captures: { ev: "$.data.id" } }
            - { call: "POST /irops/disruption-events/${ev}/assess", payload: {}, as: DutyManager }
            - { call: "POST /irops/bookings", payload: { passenger_id: "${pax}", fare_cents: 12000, cabin: "ECONOMY", party_size: 1, segments: [{ flight_id: "${f}", seq_no: 1 }] }, as: ReaccommodationAgent, captures: { bk: "$.data.id" } }
            - { call: "POST /irops/flights/${f}/cancel", payload: { disruption_event_id: "${ev}", expected_flight_version: "${fv}" }, as: OpsController }
            - { call: "POST /irops/disruption-events/${ev}/declare-recovery", payload: {}, as: DutyManager }
            - { call: "POST /irops/bookings/${bk}/vouchers", payload: { voucher_type: "TRANSPORT" }, as: ReaccommodationAgent, captures: { v: "$.data.id" } }
            - { call: "POST /irops/vouchers/${v}/void", payload: {}, as: FinanceProcessor }
          trigger:
            - { call: "POST /irops/vouchers/${v}/redeem", payload: { actual_amount_cents: 5000 }, as: FinanceProcessor, captures: { err: "$.data.error_id" } }
          assert:
            - "409 ERR_VOUCHER_NOT_OPEN; no additional CostEntry is posted"

      - name: election_process_twice_rejected
        claim_type: idempotency
        grounds: [state_machines.RefundElection, "errors[ERR_ELECTION_NOT_PENDING]"]
        distinguishing_aspect: "Processing a PROCESSED election fails with ERR_ELECTION_NOT_PENDING; cost entries are posted exactly once."
        test_recipe:
          setup: ["controllable event; cancelled flight; booking ELIGIBLE_PENDING; REFUND election created and processed"]
          setup_api_calls:
            - { call: "POST /irops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T06:00:00Z" }, as: OpsAdmin }
            - { call: "POST /irops/passengers", payload: { full_name: "Wes W", contact_email: "wes@x.com" }, as: ReaccommodationAgent, captures: { pax: "$.data.id" } }
            - { call: "POST /irops/flights", payload: { flight_number: "OC7", origin: "HUB", destination: "DST", sched_dep_utc: "2026-08-10T09:00:00Z", sched_arr_utc: "2026-08-10T10:00:00Z", distance_km: 900, operating_carrier: "OC", cabins: [{ cabin: "ECONOMY", capacity: 100 }] }, as: OpsController, captures: { f: "$.data.id", fv: "$.data.version" } }
            - { call: "POST /irops/disruption-events", payload: { event_code: "MECH-C5", hub: "HUB", classification: "MECHANICAL", cost_cap_cents: 1000000 }, as: DutyManager, captures: { ev: "$.data.id" } }
            - { call: "POST /irops/disruption-events/${ev}/assess", payload: {}, as: DutyManager }
            - { call: "POST /irops/bookings", payload: { passenger_id: "${pax}", fare_cents: 12000, cabin: "ECONOMY", party_size: 1, segments: [{ flight_id: "${f}", seq_no: 1 }] }, as: ReaccommodationAgent, captures: { bk: "$.data.id" } }
            - { call: "POST /irops/flights/${f}/cancel", payload: { disruption_event_id: "${ev}", expected_flight_version: "${fv}" }, as: OpsController }
            - { call: "POST /irops/bookings/${bk}/refund-elections", payload: { election: "REFUND" }, as: ReaccommodationAgent, captures: { el: "$.data.id" } }
            - { call: "POST /irops/refund-elections/${el}/process", payload: {}, as: FinanceProcessor }
          trigger:
            - { call: "POST /irops/refund-elections/${el}/process", payload: {}, as: FinanceProcessor, captures: { err: "$.data.error_id" } }
            - { call: "GET /irops/disruption-events/${ev}/cost-entries", as: FinanceProcessor }
          assert:
            - "second process -> 409 ERR_ELECTION_NOT_PENDING"
            - "cost ledger still holds exactly 4 entries (REFUND accrual+settlement 12000, COMPENSATION accrual+settlement 25000) — no double posting"

      - name: escalate_committed_case_rejected
        claim_type: invalid_transition
        grounds: [state_machines.ReaccommodationCase, "errors[ERR_CASE_NOT_COMMITTABLE]"]
        distinguishing_aspect: "escalate requires QUEUED or OFFERED; from COMMITTED it fails ERR_CASE_NOT_COMMITTABLE."
        test_recipe:
          setup: ["event RECOVERY; booking disrupted; case committed onto recovery flight R"]
          setup_api_calls:
            - { call: "POST /irops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T06:00:00Z" }, as: OpsAdmin }
            - { call: "POST /irops/passengers", payload: { full_name: "Xan X", contact_email: "xan@x.com" }, as: ReaccommodationAgent, captures: { pax: "$.data.id" } }
            - { call: "POST /irops/flights", payload: { flight_number: "OC8", origin: "HUB", destination: "DST", sched_dep_utc: "2026-08-10T09:00:00Z", sched_arr_utc: "2026-08-10T10:00:00Z", distance_km: 900, operating_carrier: "OC", cabins: [{ cabin: "ECONOMY", capacity: 100 }] }, as: OpsController, captures: { f: "$.data.id", fv: "$.data.version" } }
            - { call: "POST /irops/flights", payload: { flight_number: "OC9", origin: "HUB", destination: "DST", sched_dep_utc: "2026-08-10T14:00:00Z", sched_arr_utc: "2026-08-10T15:00:00Z", distance_km: 900, operating_carrier: "OC", cabins: [{ cabin: "ECONOMY", capacity: 100 }] }, as: OpsController }
            - { call: "POST /irops/disruption-events", payload: { event_code: "MECH-C6", hub: "HUB", classification: "MECHANICAL", cost_cap_cents: 1000000 }, as: DutyManager, captures: { ev: "$.data.id" } }
            - { call: "POST /irops/disruption-events/${ev}/assess", payload: {}, as: DutyManager }
            - { call: "POST /irops/bookings", payload: { passenger_id: "${pax}", fare_cents: 12000, cabin: "ECONOMY", party_size: 1, segments: [{ flight_id: "${f}", seq_no: 1 }] }, as: ReaccommodationAgent, captures: { bk: "$.data.id" } }
            - { call: "POST /irops/flights/${f}/cancel", payload: { disruption_event_id: "${ev}", expected_flight_version: "${fv}" }, as: OpsController }
            - { call: "GET /irops/reaccommodation-cases?booking_id=${bk}", as: ReaccommodationAgent, captures: { cs: "$.data[0].id" } }
            - { call: "POST /irops/reaccommodation-cases/${cs}/generate-options", payload: { include_interline: false }, as: ReaccommodationAgent, captures: { csv: "$.data.version" } }
            - { call: "GET /irops/reaccommodation-cases/${cs}/options", as: ReaccommodationAgent, captures: { opt: "$.data[0].id" } }
            - { call: "POST /irops/reaccommodation-cases/${cs}/commit", payload: { option_id: "${opt}", expected_case_version: "${csv}" }, as: ReaccommodationAgent }
          trigger:
            - { call: "POST /irops/reaccommodation-cases/${cs}/escalate", payload: {}, as: ReaccommodationAgent, captures: { err: "$.data.error_id" } }
          assert:
            - "409 ERR_CASE_NOT_COMMITTABLE; case remains COMMITTED"

      - name: interline_suspend_toggle_cycle
        claim_type: valid_transition
        grounds: [state_machines.InterlineAgreement]
        distinguishing_aspect: "Agreement toggles ACTIVE -> SUSPENDED -> ACTIVE; each toggle increments version."
        test_recipe:
          setup: ["one agreement"]
          setup_api_calls:
            - { call: "POST /irops/interline-agreements", payload: { partner_carrier: "ZZ", origin: "HUB", destination: "DST", cabin_map: { ECONOMY: "Y" }, settlement_rate_pct: 60, seats_quota_per_flight: 4 }, as: OpsAdmin, captures: { ag: "$.data.id" } }
          trigger:
            - { call: "POST /irops/interline-agreements/${ag}/suspend", payload: {}, as: OpsAdmin, captures: { s1: "$.data.agreement_status", v1: "$.data.version" } }
            - { call: "POST /irops/interline-agreements/${ag}/suspend", payload: {}, as: OpsAdmin, captures: { s2: "$.data.agreement_status", v2: "$.data.version" } }
          assert:
            - "first toggle: agreement_status == SUSPENDED, version == 2"
            - "second toggle: agreement_status == ACTIVE, version == 3"

      - name: booking_completed_rollup
        claim_type: side_effect_execution
        grounds: [state_machines.Booking.ACTIVE_to_COMPLETED, state_machines.BookingSegment.CONFIRMED_to_FLOWN]
        distinguishing_aspect: "Flight ARRIVED flows its CONFIRMED segments and the booking auto-completes when every segment is terminal with at least one FLOWN."
        test_recipe:
          setup: ["single-segment booking on flight F"]
          setup_api_calls:
            - { call: "POST /irops/passengers", payload: { full_name: "Yan Y", contact_email: "yan@x.com" }, as: ReaccommodationAgent, captures: { pax: "$.data.id" } }
            - { call: "POST /irops/flights", payload: { flight_number: "OC10", origin: "HUB", destination: "DST", sched_dep_utc: "2026-08-10T08:00:00Z", sched_arr_utc: "2026-08-10T09:00:00Z", distance_km: 900, operating_carrier: "OC", cabins: [{ cabin: "ECONOMY", capacity: 50 }] }, as: OpsController, captures: { f: "$.data.id" } }
            - { call: "POST /irops/bookings", payload: { passenger_id: "${pax}", fare_cents: 12000, cabin: "ECONOMY", party_size: 1, segments: [{ flight_id: "${f}", seq_no: 1 }] }, as: ReaccommodationAgent, captures: { bk: "$.data.id" } }
            - { call: "POST /irops/flights/${f}/depart", payload: { act_dep_utc: "2026-08-10T08:05:00Z" }, as: OpsController }
          trigger:
            - { call: "POST /irops/flights/${f}/record-actuals", payload: { act_arr_utc: "2026-08-10T09:05:00Z" }, as: OpsController }
            - { call: "GET /irops/bookings/${bk}", as: ReaccommodationAgent }
            - { call: "GET /irops/booking-segments?booking_id=${bk}", as: ReaccommodationAgent }
          assert:
            - "segment segment_status == FLOWN"
            - "Booking.${bk}.booking_status == COMPLETED (bubble-up rollup)"

      - name: case_voided_on_booking_cancel_conditional_cascade
        claim_type: conditional_cascade
        grounds: [state_machines.ReaccommodationCase.OFFERED_to_VOIDED, state_machines.ReaccommodationOption.PROPOSED_to_EXPIRED]
        distinguishing_aspect: "Booking cancel voids the open case and expires its PROPOSED options — only because the case was non-terminal."
        test_recipe:
          setup: ["event RECOVERY; booking disrupted; case OFFERED with one PROPOSED option"]
          setup_api_calls:
            - { call: "POST /irops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T06:00:00Z" }, as: OpsAdmin }
