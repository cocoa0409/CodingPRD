          - validations[priority=29]
        distinguishing_aspect: "A POST missing a required input field returns the error envelope rather than a bare message: response_type is the string \"error\", data carries error_id ERR_INVALID_REQUEST with a message, and meta still carries api_request_id / api_request_timestamp, so the failure is machine-readable and not an object envelope."
