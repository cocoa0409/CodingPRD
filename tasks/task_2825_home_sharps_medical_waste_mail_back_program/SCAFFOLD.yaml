scenario: |
  2825. Home Sharps & Medical Waste Mail-Back Program (Sharps Compliance): container size selection by patient volume and therapy type, DOT-compliant mail-back packaging and postal acceptance rules, prepaid return label activation and shipment tracking to the treatment facility, destruction certificate issuance and retention, program sponsorship by manufacturer or health plan with per-kit accounting, non-conforming waste rejection and customer notification, state-by-state household sharps disposal law variance, replacement container auto-ship cadence
domain_name: home-sharps-mailback-program
api_prefix: "/sharps"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - ops_run_checkpoint

  entity_topology: graph
  # Peer configuration entities (StateSharpsRule, PackagingSpec, TreatmentFacility) are
  # referenced by FK from several aggregates at once; Kit is self-referential through
  # `supersedes_kit_id`; Shipment fans in three FKs (Kit, ReturnLabel, TreatmentFacility);
  # DestructionCertificate fans in three more. No single ownership tree exists.

  state_machine_shape: parallel
  # Shipment carries two independent state axes on one row (transport_status ×
  # conformance_status). Kit is cyclic (RECEIVED -> RETURNED_TO_PATIENT ->
  # ACTIVE_FILLING -> SEALED again). Enrollment and Patient are branching
  # (approve/deny forks with divergent side-effect sets).

  relationship_patterns:
    - one_to_many          # SponsorshipProgram -> Enrollment -> Kit
    - many_to_many         # StateSharpsRule <-> TreatmentFacility <-> Shipment routing
    - self_referential     # Kit.supersedes_kit_id -> Kit.id (auto-ship replacement chain)
    - cross_aggregate      # Shipment/DestructionCertificate reference Kit, ReturnLabel, TreatmentFacility

  role_model: segregation_of_duties
  # The operator who records the conformance screening on a Shipment (IntakeTechnician,
  # persisted as Shipment.screened_by_user_id) MUST NOT be the operator who issues the
  # DestructionCertificate for that same Shipment (DestructionOfficer).

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: StateSharpsRule
    parent: null
    common_fields: true
    kind: configuration
    fields:
      - name: state_code
        type: string
        source: input
        description: Two-letter USPS state code the household-sharps rule applies to
        constraints: exactly 2 uppercase letters; unique across all StateSharpsRule rows
      - name: household_sharps_classification
        type: enum
        source: input
        description: How the state classifies used household sharps
        constraints: one of {REGULATED_MEDICAL_WASTE, CONDITIONALLY_EXEMPT, HOUSEHOLD_EXEMPT}
      - name: mail_back_permitted
        type: boolean
        source: input
        description: Whether the state permits mail-back of household sharps at all
      - name: max_container_volume_liters
        type: number
        source: input
        description: Largest single mail-back container volume the state allows, in liters
        constraints: "> 0; compared with <= against the size catalog volume_liters"
      - name: requires_state_manifest
        type: boolean
        source: input
        description: Whether the state requires a state manifest number on every activated shipment
        default: false
      - name: certificate_retention_years
        type: integer
        source: input
        description: Years a destruction certificate must be retained under this state's law
        constraints: integer 0..30
      - name: notification_deadline_hours
        type: integer
        source: input
        description: Hours after a NonConformanceEvent is opened within which the customer must be notified
        constraints: integer 1..720
        default: 72

  - name: PackagingSpec
    parent: null
    common_fields: true
    kind: configuration
    fields:
      - name: spec_code
        type: string
        source: input
        description: Internal code for this DOT/USPS-approved mail-back packaging specification
        constraints: 1..32 chars; unique across all PackagingSpec rows
      - name: un_specification_code
        type: string
        source: input
        description: UN packaging specification marking printed on the outer box (e.g. "UN 4G/X7.5/S/26")
      - name: postal_service
        type: enum
        source: input
        description: Carrier service the prepaid label is drawn on
        constraints: one of {USPS_PARCEL_SELECT_MAILBACK, UPS_GROUND_MEDICAL}
      - name: hazard_class
        type: enum
        source: input
        description: Hazard classification the outer packaging is certified for
        constraints: one of {UN3291_SHARPS_ONLY, UN3291_REGULATED_MEDICAL_WASTE}
      - name: max_gross_weight_grams
        type: integer
        source: input
        description: Maximum gross weight the postal service accepts for this spec, in grams
        constraints: integer 100..31700
      - name: allowed_container_sizes
        type: array
        source: input
        description: Inner container sizes this outer packaging is certified to hold
        constraints: non-empty array of {ONE_QUART, TWO_GALLON, THREE_GALLON, EIGHT_GALLON}
      - name: requires_absorbent
        type: boolean
        source: input
        description: Whether absorbent material must be declared at label activation for this spec
        default: false
      - name: status
        type: enum
        source: input
        description: Whether the spec may be used on new labels
        constraints: one of {ACTIVE, RETIRED}
        default: ACTIVE

  - name: TreatmentFacility
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: name
        type: string
        source: input
        description: Permitted medical-waste treatment facility name
      - name: state_rule_id
        type: string
        source: input
        description: FK -> StateSharpsRule.id; the state whose law governs the facility's intake and retention
      - name: permit_number
        type: string
        source: input
        description: State treatment permit number; also the certificate-number prefix
        constraints: 1..32 chars; unique across all TreatmentFacility rows
      - name: accepted_hazard_classes
        type: array
        source: input
        description: Hazard classes the facility's permit covers
        constraints: non-empty array of {UN3291_SHARPS_ONLY, UN3291_REGULATED_MEDICAL_WASTE}
      - name: daily_intake_capacity_units
        type: integer
        source: input
        description: Sharps units the facility may accept for a single UTC intake date
        constraints: integer 1..100000
      - name: pending_intake_units
        type: integer
        source: computed
        description: Units currently in the facility's custody chain — incremented on label activation, decremented on destruction, RETURN_TO_PATIENT remediation, or LOST transport
        default: 0
      - name: destroyed_units_total
        type: integer
        source: computed
        description: Lifetime units destroyed at this facility under non-voided certificates
        default: 0
      - name: certificates_issued_count
        type: integer
        source: computed
        description: Count of DestructionCertificate rows ever issued at this facility, including voided ones; drives the certificate_number sequence
        default: 0
      - name: status
        type: enum
        source: input
        description: Whether the facility may receive shipments and issue certificates
        constraints: one of {ACTIVE, SUSPENDED}
        default: ACTIVE

  - name: Sponsor
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: legal_name
        type: string
        source: input
        description: Legal name of the sponsoring manufacturer or health plan
      - name: sponsor_type
        type: enum
        source: input
        description: Sponsor category; selects the destruction rate and the rebate-tier table used at settlement
        constraints: one of {MANUFACTURER, HEALTH_PLAN}
      - name: contact_email
        type: string
        source: input
        description: Sponsor program contact address
      - name: status
        type: enum
        source: input
        description: Whether the sponsor may approve enrollments and fund kits
        constraints: one of {ACTIVE, SUSPENDED}
        default: ACTIVE

  - name: SponsorshipProgram
    parent: Sponsor
    common_fields: true
    kind: resource
    fields:
      - name: sponsor_id
        type: string
        source: input
        description: FK -> Sponsor.id; the sponsor funding this program
      - name: program_code
        type: string
        source: input
        description: Sponsor-facing program code
        constraints: 1..32 chars; unique across all SponsorshipProgram rows
      - name: funding_ceiling_cents
        type: integer
        source: input
        description: Total cents the sponsor has committed to this program
        constraints: integer 1..100000000
      - name: per_kit_allowance_cents
        type: integer
        source: input
        description: Per-kit cap applied to both the provisional reservation and the final settlement
        constraints: integer 1..100000000
      - name: reserved_cents
        type: integer
        source: computed
        description: "Open provisional reservations: sum(RESERVATION) - sum(RESERVATION_RELEASE) over this program's SponsorLedgerEntry rows"
        default: 0
      - name: committed_cents
        type: integer
        source: computed
        description: "Settled spend: sum(COMMITMENT) - sum(COMMITMENT_REVERSAL) over this program's SponsorLedgerEntry rows"
        default: 0
      - name: available_cents
        type: integer
        source: computed
        description: funding_ceiling_cents - reserved_cents - committed_cents; recomputed after every ledger append
      - name: kits_issued_count
        type: integer
        source: computed
        description: Count of Kit rows whose enrollment belongs to this program and whose status is not VOIDED
        default: 0
      - name: kits_settled_count
        type: integer
        source: computed
        description: Count of DestructionCertificate rows with status ISSUED against kits of this program
        default: 0
      - name: provisional_total_cents
        type: integer
        source: computed
        description: Sum of Kit.provisional_cost_cents over kits of this program that carry an ISSUED DestructionCertificate
        default: 0
      - name: final_total_cents
        type: integer
        source: computed
        description: Sum of DestructionCertificate.final_kit_cost_cents over ISSUED certificates of this program
        default: 0
      - name: status
        type: enum
        source: computed
        description: ACTIVE while available_cents > 0; EXHAUSTED at exactly available_cents == 0
        constraints: one of {ACTIVE, EXHAUSTED}
        default: ACTIVE

  - name: Patient
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: full_name
        type: string
        source: input
        description: Patient legal name
      - name: state_rule_id
        type: string
        source: input
        description: FK -> StateSharpsRule.id; the household-sharps law of the patient's residence state
      - name: therapy_type
        type: enum
        source: input
        description: Therapy driving sharps volume; selects UNITS_PER_ITEM and the container eligibility filter
        constraints: one of {INSULIN_PEN_NEEDLES, INSULIN_SYRINGES, AUTOINJECTOR_PENS, INFUSION_SETS, LANCETS_ONLY}
      - name: weekly_sharps_count
        type: integer
        source: input
        description: Sharps items the patient discards per week, self-reported at intake
        constraints: integer 1..500
      - name: contact_email
        type: string
        source: input
        description: Address used for non-conforming-waste customer notification
      - name: screening_risk_score
        type: integer
        source: computed
        description: Decay-weighted non-conformance score, recomputed at conformance screening and at every auto-ship run; >= 60 at screening time suspends the patient
        default: 0
      - name: audit_risk_score
        type: integer
        source: computed
        description: Undecayed lifetime non-conformance score plus late-kit penalty, recomputed only at auto-ship runs; >= 60 makes the run skip the enrollment without suspending
        default: 0
      - name: suspended_at
        type: datetime
        source: computed
        description: ISO 8601 UTC instant of the most recent risk-driven suspension; null when never suspended
      - name: status
        type: enum
        source: computed
        description: Patient lifecycle state; see §1.2
        constraints: one of {PENDING_ELIGIBILITY, ELIGIBLE, INELIGIBLE, ENROLLED, SUSPENDED, WITHDRAWN}
        default: PENDING_ELIGIBILITY

  - name: Enrollment
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: patient_id
        type: string
        source: input
        description: FK -> Patient.id; the enrolled patient
      - name: sponsorship_program_id
        type: string
        source: input
        description: FK -> SponsorshipProgram.id; the program paying for this patient's kits
      - name: cadence_days
        type: integer
        source: input
        description: Replacement-container auto-ship cadence in days; also the fill horizon used by container sizing
        constraints: integer 14..180
      - name: kits_authorized
        type: integer
        source: input
        description: Maximum number of non-voided kits this enrollment may hold over its lifetime
        constraints: integer 1..24
      - name: requested_container_size
        type: enum
        source: input
        description: Optional operator override recorded on the enrollment; when set it is the default requested size for kit issuance
        constraints: one of {ONE_QUART, TWO_GALLON, THREE_GALLON, EIGHT_GALLON} or null
        default: null
      - name: kits_issued
        type: integer
        source: computed
        description: Count of Kit rows for this enrollment whose status is not VOIDED
        default: 0
      - name: next_autoship_due_date
        type: string
        source: computed
        description: UTC calendar date (YYYY-MM-DD) the next replacement container becomes due; set on activation and after each issuance, cleared to null on PAUSED/TERMINATED/REJECTED
      - name: activated_at
        type: datetime
        source: computed
        description: ISO 8601 UTC instant of the sponsor APPROVE decision; null before that
      - name: sponsor_decision_note
        type: string
        source: input
        description: Free-text note recorded with the sponsor decision; null before the decision
        default: null
      - name: status
        type: enum
        source: computed
        description: Enrollment lifecycle state; see §1.2
        constraints: one of {DRAFT, PENDING_SPONSOR_APPROVAL, ACTIVE, PAUSED, REJECTED, TERMINATED}
        default: DRAFT

  - name: Kit
    parent: Enrollment
    common_fields: true
    kind: resource
    fields:
      - name: enrollment_id
        type: string
        source: input
        description: FK -> Enrollment.id; the enrollment this kit was issued under
      - name: supersedes_kit_id
        type: string
        source: computed
        description: FK -> Kit.id; the prior kit this one replaces (supersede-on-issue or auto-ship replacement); null for a first kit
        default: null
      - name: auto_ship_run_id
        type: string
        source: computed
        description: FK -> AutoShipRun.id; the run that created this kit; null for operator-issued kits
        default: null
      - name: container_size
        type: enum
        source: computed
        description: Container size held by this kit; taken from the request when supplied and eligible, otherwise selected by §1.3 container_size_selection
        constraints: one of {ONE_QUART, TWO_GALLON, THREE_GALLON, EIGHT_GALLON}
      - name: capacity_units
        type: integer
        source: computed
        description: SIZE_CATALOG capacity_units of container_size
      - name: volume_liters
        type: number
        source: computed
        description: SIZE_CATALOG volume_liters of container_size
      - name: required_units
        type: integer
        source: computed
        description: Sizing demand computed at issuance by §1.3 container_size_selection
      - name: fill_units
        type: integer
        source: input
        description: Units the patient declares at seal time; 0 until the kit is sealed
        default: 0
      - name: sealed_gross_weight_grams
        type: integer
        source: input
        description: Gross weight the patient declares at seal time; null until sealed
        default: null
      - name: provisional_cost_cents
        type: integer
        source: computed
        description: Provisional reservation booked against the program at issuance by §1.3 kit_cost_provisional
      - name: issued_at
        type: datetime
        source: computed
        description: ISO 8601 UTC logical-clock instant of issuance
      - name: seal_deadline_date
        type: string
        source: computed
        description: UTC calendar date (YYYY-MM-DD) = issued_at date + cadence_days + SEAL_GRACE_DAYS; a still-unsealed kit past this date is a late kit for audit_risk_score
      - name: acknowledged_at
        type: datetime
        source: computed
        description: ISO 8601 UTC instant of the most recent patient receipt acknowledgement; null before the first one
      - name: status
        type: enum
        source: computed
        description: Kit lifecycle state; see §1.2 (cyclic through RETURNED_TO_PATIENT)
        constraints: one of {ISSUED, ACTIVE_FILLING, SEALED, IN_TRANSIT, RECEIVED, RETURNED_TO_PATIENT, DESTROYED, VOIDED}
        default: ISSUED
      - name: void_reason
        type: string
        source: input
        description: Reason recorded when the kit is voided (operator void, supersede, or LOST transport); null otherwise
        default: null

  - name: ReturnLabel
    parent: Kit
    common_fields: true
    kind: resource
    fields:
      - name: kit_id
        type: string
        source: input
        description: FK -> Kit.id; the sealed kit this prepaid label belongs to
      - name: packaging_spec_id
        type: string
        source: input
        description: FK -> PackagingSpec.id; the DOT/postal packaging specification pinned onto this label at print time
      - name: postal_service
        type: enum
        source: computed
        description: Copied from the pinned PackagingSpec.postal_service at print time
        constraints: one of {USPS_PARCEL_SELECT_MAILBACK, UPS_GROUND_MEDICAL}
      - name: tracking_number
        type: string
        source: computed
        description: Deterministic tracking number minted at print time as "<postal_service_prefix>-<permit-free sequence>"; see §1.3 tracking_number_minting
      - name: valid_from
        type: datetime
        source: computed
        description: ISO 8601 UTC logical-clock instant at print time; start of the label's exclusive occupancy window on the kit
      - name: valid_until
        type: datetime
        source: computed
        description: valid_from + LABEL_VALIDITY_DAYS; end of the occupancy window, treated as a CLOSED endpoint for conflict detection
      - name: voided_at
        type: datetime
        source: computed
        description: ISO 8601 UTC instant the label was voided; null unless status is VOIDED
        default: null
      - name: activated_at
        type: datetime
        source: computed
        description: ISO 8601 UTC instant of postal acceptance (activation); null until activated
        default: null
      - name: status
        type: enum
        source: computed
        description: Label lifecycle state; see §1.2
        constraints: one of {PRINTED, ACTIVATED, VOIDED}
        default: PRINTED

  - name: Shipment
    parent: ReturnLabel
    common_fields: true
    kind: resource
    fields:
      - name: kit_id
        type: string
        source: computed
        description: FK -> Kit.id; copied from the activated label
      - name: return_label_id
        type: string
        source: computed
        description: FK -> ReturnLabel.id; the label whose activation created this shipment
      - name: treatment_facility_id
        type: string
        source: input
        description: FK -> TreatmentFacility.id; destination facility chosen at activation
      - name: scheduled_intake_date
        type: string
        source: input
        description: UTC calendar date (YYYY-MM-DD) the facility is booked to receive this shipment; the half-open day bucket [date T00:00:00Z, date+1 T00:00:00Z) that intake capacity is measured over
      - name: declared_gross_weight_grams
        type: integer
        source: input
        description: Gross weight declared at postal acceptance
        constraints: integer 1..100000
      - name: observed_gross_weight_grams
        type: integer
        source: input
        description: Gross weight the intake technician measures at screening; null until screened
        default: null
      - name: custody_units
        type: integer
        source: computed
        description: Units this shipment adds to TreatmentFacility.pending_intake_units at activation; equals Kit.fill_units at activation time and never changes afterwards
      - name: state_manifest_number
        type: string
        source: input
        description: State manifest number supplied at activation; required when the patient's StateSharpsRule.requires_state_manifest is true
        default: null
      - name: tendered_at
        type: datetime
        source: computed
        description: ISO 8601 UTC instant of activation / postal acceptance
      - name: delivered_at
        type: datetime
        source: computed
        description: ISO 8601 UTC instant the DELIVERED transport event was recorded; null before that
        default: null
      - name: screened_by_user_id
        type: string
        source: computed
        description: X-User-ID of the IntakeTechnician who recorded the conformance screening; the segregation-of-duties comparison value
        default: null
      - name: transport_status
        type: enum
        source: computed
        description: Transport axis of the shipment; evolves independently of conformance_status
        constraints: one of {TENDERED, IN_TRANSIT, DELIVERED, LOST}
        default: TENDERED
      - name: conformance_status
        type: enum
        source: computed
        description: Waste-conformance axis of the shipment; evolves independently of transport_status
        constraints: one of {UNSCREENED, CONFORMING, NON_CONFORMING, REMEDIATED}
        default: UNSCREENED

  - name: NonConformanceEvent
    parent: Shipment
    common_fields: true
    kind: resource
    fields:
      - name: shipment_id
        type: string
        source: computed
        description: FK -> Shipment.id; the shipment screened NON_CONFORMING
      - name: reason_code
        type: enum
        source: input
        description: Why the waste was rejected; selects REASON_WEIGHTS for both risk-score variants
        constraints: one of {UNAPPROVED_WASTE_TYPE, LOOSE_SHARPS_IN_BOX, UNSEALED_CONTAINER, OVERFILLED_CONTAINER, WEIGHT_EXCEEDS_SPEC, MISSING_ABSORBENT}
      - name: notification_deadline_at
        type: datetime
        source: computed
        description: created_at + patient StateSharpsRule.notification_deadline_hours; customer notification after this instant is rejected
      - name: notified_at
        type: datetime
        source: computed
        description: ISO 8601 UTC instant the customer notification was recorded; null while OPEN
        default: null
      - name: notification_channel
        type: enum
        source: input
        description: Channel used for the customer notification; null while OPEN
        constraints: one of {EMAIL, PHONE, POSTAL_MAIL} or null
        default: null
      - name: remediation_action
        type: enum
        source: input
        description: Disposition chosen for the rejected waste; null until remediated
        constraints: one of {RETURN_TO_PATIENT, ON_SITE_REPACK, DISPOSE_AS_RMW} or null
        default: null
      - name: status
        type: enum
        source: computed
        description: Event lifecycle state; see §1.2
        constraints: one of {OPEN, CUSTOMER_NOTIFIED, RESOLVED}
        default: OPEN

  - name: DestructionCertificate
    parent: Shipment
    common_fields: true
    kind: resource
    fields:
      - name: shipment_id
        type: string
        source: computed
        description: FK -> Shipment.id; the delivered, CONFORMING shipment that was destroyed
      - name: kit_id
        type: string
        source: computed
        description: FK -> Kit.id; copied from the shipment
      - name: treatment_facility_id
        type: string
        source: computed
        description: FK -> TreatmentFacility.id; copied from the shipment
      - name: certificate_number
        type: string
        source: computed
        description: "Deterministic identifier \"CERT-<facility.permit_number>-<seq>\" where seq = facility.certificates_issued_count + 1 zero-padded to 5 digits"
      - name: destroyed_units
        type: integer
        source: input
        description: Units destroyed; must equal Kit.fill_units exactly
        constraints: integer 0..100000
      - name: destruction_date
        type: string
        source: computed
        description: UTC calendar date (YYYY-MM-DD) of the logical clock at issuance
      - name: retention_until_date
        type: string
        source: computed
        description: Retention deadline from §1.3 certificate_retention_deadline (Feb-29 anniversaries clamp to Feb 28)
      - name: issued_by_user_id
        type: string
        source: computed
        description: X-User-ID of the DestructionOfficer who issued the certificate
      - name: final_kit_cost_cents
        type: integer
        source: computed
        description: Final settlement amount from §1.3 kit_cost_final_settlement, committed to the program
      - name: rebate_pct_applied
        type: number
        source: computed
        description: Rebate percentage the tier table selected (0, 0.03, or 0.06)
      - name: voided_at
        type: datetime
        source: computed
        description: ISO 8601 UTC instant of certificate void; null unless status is VOIDED
        default: null
      - name: void_reason
        type: string
        source: input
        description: Reason recorded at void; null otherwise
        default: null
      - name: status
        type: enum
        source: computed
        description: Certificate lifecycle state; see §1.2
        constraints: one of {ISSUED, VOIDED}
        default: ISSUED

  - name: SponsorLedgerEntry
    parent: SponsorshipProgram
    common_fields: false
    kind: event
    fields:
      - name: sponsorship_program_id
        type: string
        source: computed
        description: FK -> SponsorshipProgram.id; the program whose balances this entry moved
      - name: kit_id
        type: string
        source: computed
        description: FK -> Kit.id; the kit the entry accounts for; null on FUNDING_ADJUSTMENT entries, which move the ceiling and belong to no kit
      - name: entry_type
        type: enum
        source: computed
        description: Ledger movement kind
        constraints: one of {RESERVATION, RESERVATION_RELEASE, COMMITMENT, COMMITMENT_REVERSAL, FUNDING_ADJUSTMENT}
      - name: amount_cents
        type: integer
        source: computed
        description: Signed movement in cents (RESERVATION and COMMITMENT positive, their reversals negative, FUNDING_ADJUSTMENT signed as submitted)
      - name: sequence_no
        type: integer
        source: computed
        description: Monotonic per-program append sequence starting at 1; pins the order of same-instant appends
      - name: reserved_after_cents
        type: integer
        source: computed
        description: SponsorshipProgram.reserved_cents immediately after this append
      - name: committed_after_cents
        type: integer
        source: computed
        description: SponsorshipProgram.committed_cents immediately after this append
      - name: available_after_cents
        type: integer
        source: computed
        description: SponsorshipProgram.available_cents immediately after this append
      - name: memo
        type: string
        source: computed
        description: Human-readable origin of the movement (e.g. "kit issuance", "kit void", "certificate settlement")

  - name: AutoShipRun
    parent: null
    common_fields: false
    kind: event
    fields:
      - name: as_of_date
        type: string
        source: input
        description: UTC calendar date (YYYY-MM-DD) the run evaluates due dates against; defaults to the logical clock's UTC date
        default: null
      - name: run_at
        type: datetime
        source: computed
        description: ISO 8601 UTC logical-clock instant the run executed
      - name: enrollments_evaluated
        type: integer
        source: computed
        description: Count of ACTIVE enrollments inspected by this run
        default: 0
      - name: kits_created
        type: integer
        source: computed
        description: Count of replacement kits the run issued
        default: 0
      - name: kits_skipped_not_due
        type: integer
        source: computed
        description: Count of ACTIVE enrollments whose next_autoship_due_date is after as_of_date
        default: 0
      - name: kits_skipped_unfilled
        type: integer
        source: computed
        description: Count of due enrollments skipped because their most recent kit is still ISSUED or ACTIVE_FILLING
        default: 0
      - name: kits_skipped_risk
        type: integer
        source: computed
        description: Count of due enrollments skipped because the patient's audit_risk_score >= RISK_SUSPEND_THRESHOLD
        default: 0
      - name: kits_skipped_funding
        type: integer
        source: computed
        description: Count of due enrollments skipped because the program could not cover the provisional cost
        default: 0
      - name: created_kit_ids
        type: array
        source: computed
        description: Ids of the kits this run created, in processing order (enrollment created_at ASC)
        default: []

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  - entity: Patient
    initial_state: PENDING_ELIGIBILITY
    terminal_states: [INELIGIBLE, WITHDRAWN]
    transitions:
      - from: PENDING_ELIGIBILITY
        to: ELIGIBLE
        trigger: "POST /sharps/patients/{id}/eligibility-review with decision=APPROVE"
        actor: ProgramAdmin
        preconditions:
          - "patient.status == PENDING_ELIGIBILITY"
        side_effects:
          - "sets Patient.status = ELIGIBLE"
          - "increments Patient.version by 1"
      - from: PENDING_ELIGIBILITY
        to: INELIGIBLE
        trigger: "POST /sharps/patients/{id}/eligibility-review with decision=DENY"
        actor: ProgramAdmin
        preconditions:
          - "patient.status == PENDING_ELIGIBILITY"
        side_effects:
          - "sets Patient.status = INELIGIBLE (terminal; no Enrollment may ever be created)"
          - "increments Patient.version by 1"
        note: "Divergent branch: DENY is terminal and permanently blocks enrollment creation, APPROVE is not."
      - from: ELIGIBLE
        to: ENROLLED
        trigger: "system event: an Enrollment for this patient reaches ACTIVE (sponsor APPROVE)"
        actor: system
        preconditions:
          - "patient.status == ELIGIBLE"
        side_effects:
          - "sets Patient.status = ENROLLED"
          - "increments Patient.version by 1"
        note: "Bubble-up: child Enrollment activation drives the parent Patient forward."
      - from: ENROLLED
        to: SUSPENDED
        trigger: "system event: screening_risk_score recomputed at conformance screening reaches >= RISK_SUSPEND_THRESHOLD"
        actor: system
        preconditions:
          - "patient.status == ENROLLED"
          - "the recomputed Patient.screening_risk_score >= 60"
        side_effects:
          - "sets Patient.status = SUSPENDED and Patient.suspended_at = current logical clock instant"
          - "CASCADE hop 2: every Enrollment of this patient with status == ACTIVE transitions ACTIVE -> PAUSED"
          - "CASCADE hop 3: because each of those enrollments became PAUSED, it clears next_autoship_due_date to null and every Kit of that enrollment with status == ISSUED transitions ISSUED -> VOIDED with void_reason 'ENROLLMENT_PAUSED' (kits already ACTIVE_FILLING are physically in the patient's hands and are NOT voided)"
          - "CASCADE hop 4: because each of those kits became VOIDED, a RESERVATION_RELEASE SponsorLedgerEntry of -Kit.provisional_cost_cents is appended and SponsorshipProgram.reserved_cents is decreased by that amount"
          - "CASCADE hop 5: because reserved_cents decreased, SponsorshipProgram.available_cents is recomputed and the program transitions EXHAUSTED -> ACTIVE when available_cents > 0"
          - "increments Patient.version by 1"
      - from: SUSPENDED
        to: ENROLLED
        trigger: "POST /sharps/patients/{id}/status-actions with action=REINSTATE"
        actor: ProgramAdmin
        preconditions:
          - "patient.status == SUSPENDED"
        side_effects:
          - "sets Patient.status = ENROLLED and leaves suspended_at at its historical value"
          - "every Enrollment of this patient with status == PAUSED transitions PAUSED -> ACTIVE and its next_autoship_due_date is set to the current logical clock UTC date (immediately due)"
          - "increments Patient.version by 1"
      - from: ENROLLED
        to: WITHDRAWN
        trigger: "POST /sharps/patients/{id}/status-actions with action=WITHDRAW"
        actor: ProgramAdmin
        preconditions:
          - "patient.status IN {ELIGIBLE, ENROLLED, SUSPENDED}"
        side_effects:
          - "sets Patient.status = WITHDRAWN (terminal)"
          - "every Enrollment of this patient with status IN {DRAFT, PENDING_SPONSOR_APPROVAL, ACTIVE, PAUSED} transitions to TERMINATED and clears next_autoship_due_date"
          - "because each of those enrollments became TERMINATED, every Kit of that enrollment with status == ISSUED transitions ISSUED -> VOIDED with void_reason 'ENROLLMENT_TERMINATED'; kits in ACTIVE_FILLING, SEALED, IN_TRANSIT, RECEIVED, RETURNED_TO_PATIENT are left untouched"
          - "because each of those kits became VOIDED, a RESERVATION_RELEASE SponsorLedgerEntry is appended and SponsorshipProgram.reserved_cents decreases"
          - "increments Patient.version by 1"
      - from: SUSPENDED
        to: WITHDRAWN
        trigger: "POST /sharps/patients/{id}/status-actions with action=WITHDRAW"
        actor: ProgramAdmin
        preconditions:
          - "patient.status == SUSPENDED"
        side_effects:
          - "same side-effect set as ENROLLED -> WITHDRAWN"
          - "increments Patient.version by 1"
      - from: ELIGIBLE
        to: WITHDRAWN
        trigger: "POST /sharps/patients/{id}/status-actions with action=WITHDRAW"
        actor: ProgramAdmin
        preconditions:
          - "patient.status == ELIGIBLE"
        side_effects:
          - "sets Patient.status = WITHDRAWN; DRAFT/PENDING_SPONSOR_APPROVAL enrollments transition to TERMINATED"
          - "increments Patient.version by 1"

  - entity: Enrollment
    initial_state: DRAFT
    terminal_states: [REJECTED, TERMINATED]
    transitions:
      - from: DRAFT
        to: PENDING_SPONSOR_APPROVAL
        trigger: "POST /sharps/enrollments/{id}/submit"
        actor: ProgramAdmin
        preconditions:
          - "enrollment.status == DRAFT"
          - "patient.status IN {ELIGIBLE, ENROLLED}"
          - "sponsor.status == ACTIVE"
        side_effects:
          - "sets Enrollment.status = PENDING_SPONSOR_APPROVAL"
          - "increments Enrollment.version by 1"
      - from: PENDING_SPONSOR_APPROVAL
        to: ACTIVE
        trigger: "POST /sharps/enrollments/{id}/sponsor-decision with decision=APPROVE"
        actor: SponsorRepresentative
        preconditions:
          - "enrollment.status == PENDING_SPONSOR_APPROVAL"
          - "X-User-ID equals SponsorshipProgram.sponsor_id of enrollment.sponsorship_program_id"
          - "sponsor.status == ACTIVE"
          - "SponsorshipProgram.status == ACTIVE"
        side_effects:
          - "sets Enrollment.status = ACTIVE, activated_at = current logical clock instant, sponsor_decision_note = the submitted note"
          - "sets Enrollment.next_autoship_due_date = current logical clock UTC date (the enrollment is immediately due for its first replacement container)"
          - "CASCADE: Patient ELIGIBLE -> ENROLLED"
          - "increments Enrollment.version by 1"
      - from: PENDING_SPONSOR_APPROVAL
        to: REJECTED
        trigger: "POST /sharps/enrollments/{id}/sponsor-decision with decision=REJECT"
        actor: SponsorRepresentative
        preconditions:
          - "enrollment.status == PENDING_SPONSOR_APPROVAL"
          - "X-User-ID equals SponsorshipProgram.sponsor_id of enrollment.sponsorship_program_id"
        side_effects:
          - "sets Enrollment.status = REJECTED (terminal), sponsor_decision_note = the submitted note"
          - "leaves next_autoship_due_date null, does NOT touch Patient.status, and appends NO SponsorLedgerEntry"
          - "increments Enrollment.version by 1"
        note: "Fork sibling of APPROVE with a strictly different side-effect set: no patient promotion, no due date, no ledger activity."
      - from: ACTIVE
        to: PAUSED
        trigger: "system event: the enrollment's Patient transitions ENROLLED -> SUSPENDED"
        actor: system
        preconditions:
          - "enrollment.status == ACTIVE"
        side_effects:
          - "sets Enrollment.status = PAUSED and next_autoship_due_date = null"
          - "voids the enrollment's Kit rows in status ISSUED (see Patient cascade hop 3)"
          - "increments Enrollment.version by 1"
      - from: PAUSED
        to: ACTIVE
        trigger: "system event: the enrollment's Patient transitions SUSPENDED -> ENROLLED"
        actor: system
        preconditions:
          - "enrollment.status == PAUSED"
        side_effects:
          - "sets Enrollment.status = ACTIVE and next_autoship_due_date = current logical clock UTC date"
          - "increments Enrollment.version by 1"
      - from: ACTIVE
        to: TERMINATED
        trigger: "system event: the enrollment's Patient transitions to WITHDRAWN"
        actor: system
        preconditions:
          - "enrollment.status IN {DRAFT, PENDING_SPONSOR_APPROVAL, ACTIVE, PAUSED}"
        side_effects:
          - "sets Enrollment.status = TERMINATED (terminal) and next_autoship_due_date = null"
          - "voids the enrollment's Kit rows in status ISSUED, each appending a RESERVATION_RELEASE SponsorLedgerEntry"
          - "increments Enrollment.version by 1"
      - from: PAUSED
        to: TERMINATED
        trigger: "system event: the enrollment's Patient transitions to WITHDRAWN"
        actor: system
        preconditions:
          - "enrollment.status == PAUSED"
        side_effects:
          - "same side-effect set as ACTIVE -> TERMINATED"
          - "increments Enrollment.version by 1"

  - entity: Kit
    initial_state: ISSUED
    terminal_states: [VOIDED]
    transitions:
      - from: null
        to: ISSUED
        trigger: "POST /sharps/enrollments/{id}/kits"
        actor: ProgramAdmin
        preconditions:
          - "enrollment.status == ACTIVE"
          - "patient.status == ENROLLED"
          - "expected_enrollment_version == enrollment.version"
          - "enrollment.kits_issued < enrollment.kits_authorized, evaluated AFTER any supersede void below"
          - "SponsorshipProgram.available_cents >= the new kit's provisional_cost_cents, evaluated AFTER any supersede release below"
        side_effects:
          - "STEP 1 (supersede): if the enrollment already has a Kit with status IN {ISSUED, ACTIVE_FILLING}, that kit (the most recent such kit by created_at DESC) transitions to VOIDED with void_reason 'SUPERSEDED_BY_REPLACEMENT', a RESERVATION_RELEASE SponsorLedgerEntry of -prior.provisional_cost_cents is appended (next sequence_no), and SponsorshipProgram.reserved_cents decreases accordingly"
          - "STEP 2: mints the Kit with status ISSUED, required_units / container_size / capacity_units / volume_liters from §1.3 container_size_selection, provisional_cost_cents from §1.3 kit_cost_provisional, issued_at = current logical clock instant, seal_deadline_date = issued_at UTC date + cadence_days + SEAL_GRACE_DAYS, supersedes_kit_id = the superseded kit's id (else null)"
          - "STEP 3: appends a RESERVATION SponsorLedgerEntry of +provisional_cost_cents (next sequence_no) and increases SponsorshipProgram.reserved_cents"
          - "STEP 4: recomputes SponsorshipProgram.available_cents, kits_issued_count and status (ACTIVE -> EXHAUSTED at exactly available_cents == 0)"
          - "STEP 5: sets Enrollment.next_autoship_due_date = issued_at UTC date + cadence_days, recomputes Enrollment.kits_issued and increments Enrollment.version by 1"
      - from: ISSUED
        to: ACTIVE_FILLING
        trigger: "POST /sharps/kits/{id}/acknowledge-receipt"
        actor: Patient
        preconditions:
          - "kit.status IN {ISSUED, RETURNED_TO_PATIENT}"
          - "X-User-ID equals Enrollment.patient_id of kit.enrollment_id"
          - "enrollment.status == ACTIVE"
        side_effects:
          - "sets Kit.status = ACTIVE_FILLING and acknowledged_at = current logical clock instant"
          - "increments Kit.version by 1"
      - from: RETURNED_TO_PATIENT
        to: ACTIVE_FILLING
        trigger: "POST /sharps/kits/{id}/acknowledge-receipt (second acknowledgement after a rejected shipment was mailed back)"
        actor: Patient
        preconditions:
          - "kit.status == RETURNED_TO_PATIENT"
          - "X-User-ID equals Enrollment.patient_id of kit.enrollment_id"
          - "enrollment.status == ACTIVE"
        side_effects:
          - "sets Kit.status = ACTIVE_FILLING and refreshes acknowledged_at"
          - "increments Kit.version by 1"
        note: "CYCLE: the kit re-enters the filling stage it already passed through, so ACTIVE_FILLING -> SEALED -> ... may run again on the same row."
      - from: ACTIVE_FILLING
        to: SEALED
        trigger: "POST /sharps/kits/{id}/seal"
        actor: Patient
        preconditions:
          - "kit.status == ACTIVE_FILLING"
          - "X-User-ID equals Enrollment.patient_id of kit.enrollment_id"
          - "enrollment.status == ACTIVE (cross-entity guard: a PAUSED or TERMINATED enrollment blocks sealing)"
          - "1 <= fill_units <= kit.capacity_units"
        side_effects:
          - "sets Kit.status = SEALED, fill_units and sealed_gross_weight_grams from the request"
          - "increments Kit.version by 1"
      - from: SEALED
        to: IN_TRANSIT
        trigger: "POST /sharps/shipments/{id}/transport-events with event_type=IN_TRANSIT"
        actor: LogisticsCoordinator
        preconditions:
          - "kit.status == SEALED"
          - "the shipment's transport_status == TENDERED"
        side_effects:
          - "sets Kit.status = IN_TRANSIT"
          - "increments Kit.version by 1"
      - from: IN_TRANSIT
        to: RECEIVED
        trigger: "POST /sharps/shipments/{id}/transport-events with event_type=DELIVERED"
        actor: LogisticsCoordinator
        preconditions:
          - "kit.status == IN_TRANSIT"
        side_effects:
          - "sets Kit.status = RECEIVED"
          - "increments Kit.version by 1"
      - from: RECEIVED
        to: DESTROYED
        trigger: "POST /sharps/shipments/{id}/destruction-certificates"
        actor: DestructionOfficer
        preconditions:
          - "kit.status == RECEIVED"
        side_effects:
          - "sets Kit.status = DESTROYED"
          - "increments Kit.version by 1"
      - from: DESTROYED
        to: RECEIVED
        trigger: "POST /sharps/destruction-certificates/{id}/void"
        actor: DestructionOfficer
        preconditions:
          - "kit.status == DESTROYED"
          - "the certificate being voided has status == ISSUED"
        side_effects:
          - "sets Kit.status = RECEIVED so a corrected certificate can be issued"
          - "increments Kit.version by 1"
        note: "Compensation: reverses the destruction bookkeeping (see DestructionCertificate ISSUED -> VOIDED)."
      - from: RECEIVED
        to: RETURNED_TO_PATIENT
        trigger: "POST /sharps/non-conformance-events/{id}/remediate with action=RETURN_TO_PATIENT"
        actor: IntakeTechnician
        preconditions:
          - "kit.status == RECEIVED"
          - "the patient's StateSharpsRule.household_sharps_classification != REGULATED_MEDICAL_WASTE"
        side_effects:
          - "sets Kit.status = RETURNED_TO_PATIENT"
          - "decreases TreatmentFacility.pending_intake_units by Shipment.custody_units"
          - "transitions the shipment's ReturnLabel ACTIVATED -> VOIDED with voided_at = now (starting the LABEL_VOID_QUARANTINE_HOURS window)"
          - "increments Kit.version by 1"
      - from: ISSUED
        to: VOIDED
        trigger: "POST /sharps/kits/{id}/void, supersede-on-issue, enrollment PAUSED cascade, or enrollment TERMINATED cascade"
        actor: ProgramAdmin | system
        preconditions:
          - "kit.status IN {ISSUED, ACTIVE_FILLING} for the operator void; kit.status == ISSUED for the PAUSED/TERMINATED cascades"
        side_effects:
          - "sets Kit.status = VOIDED and void_reason"
          - "appends a RESERVATION_RELEASE SponsorLedgerEntry of -Kit.provisional_cost_cents (next sequence_no) and decreases SponsorshipProgram.reserved_cents"
          - "recomputes SponsorshipProgram.available_cents, kits_issued_count, status (EXHAUSTED -> ACTIVE when available_cents > 0) and Enrollment.kits_issued"
          - "increments Kit.version by 1"
      - from: ACTIVE_FILLING
        to: VOIDED
        trigger: "POST /sharps/kits/{id}/void"
        actor: ProgramAdmin
        preconditions:
          - "kit.status == ACTIVE_FILLING"
        side_effects:
          - "same ledger and program side-effect set as ISSUED -> VOIDED"
          - "increments Kit.version by 1"
      - from: SEALED
        to: VOIDED
        trigger: "POST /sharps/shipments/{id}/transport-events with event_type=LOST (shipment still TENDERED)"
        actor: LogisticsCoordinator
        preconditions:
          - "kit.status == SEALED"
        side_effects:
          - "sets Kit.status = VOIDED with void_reason 'SHIPMENT_LOST'"
          - "appends a RESERVATION_RELEASE SponsorLedgerEntry and decreases SponsorshipProgram.reserved_cents"
          - "decreases TreatmentFacility.pending_intake_units by Shipment.custody_units"
          - "increments Kit.version by 1"
      - from: IN_TRANSIT
        to: VOIDED
        trigger: "POST /sharps/shipments/{id}/transport-events with event_type=LOST"
        actor: LogisticsCoordinator
        preconditions:
          - "kit.status == IN_TRANSIT"
        side_effects:
          - "same side-effect set as SEALED -> VOIDED on LOST"
          - "increments Kit.version by 1"

  - entity: ReturnLabel
    initial_state: PRINTED
    terminal_states: [VOIDED]
    transitions:
      - from: null
        to: PRINTED
        trigger: "POST /sharps/kits/{id}/return-labels"
        actor: LogisticsCoordinator
        preconditions:
          - "kit.status == SEALED"
          - "packaging_spec.status == ACTIVE"
          - "no live or quarantined label window conflict on the kit per §1.4 priority 24 (ERR_LABEL_WINDOW_CONFLICT)"
        side_effects:
          - "mints the ReturnLabel with status PRINTED, postal_service copied from the spec, tracking_number from §1.3 tracking_number_minting, valid_from = current logical clock instant, valid_until = valid_from + LABEL_VALIDITY_DAYS"
      - from: PRINTED
        to: ACTIVATED
        trigger: "POST /sharps/return-labels/{id}/activate"
        actor: LogisticsCoordinator
        preconditions:
          - "label.status == PRINTED"
          - "current logical clock instant <= label.valid_until"
          - "all §1.4 postal-acceptance rules pass (priorities 13-22)"
        side_effects:
          - "sets ReturnLabel.status = ACTIVATED and activated_at = current logical clock instant"
          - "creates the Shipment (transport_status TENDERED, conformance_status UNSCREENED, custody_units = Kit.fill_units, tendered_at = now)"
          - "increases TreatmentFacility.pending_intake_units by the new Shipment.custody_units"
          - "increments ReturnLabel.version by 1"
      - from: PRINTED
        to: VOIDED
        trigger: "POST /sharps/return-labels/{id}/void"
        actor: LogisticsCoordinator
        preconditions:
          - "label.status == PRINTED"
        side_effects:
          - "sets ReturnLabel.status = VOIDED and voided_at = current logical clock instant, starting the LABEL_VOID_QUARANTINE_HOURS window on the kit"
          - "increments ReturnLabel.version by 1"
      - from: ACTIVATED
        to: VOIDED
        trigger: "system event: RETURN_TO_PATIENT remediation or LOST transport on the label's shipment"
        actor: system
        preconditions:
          - "label.status == ACTIVATED"
        side_effects:
          - "sets ReturnLabel.status = VOIDED and voided_at = current logical clock instant"
          - "increments ReturnLabel.version by 1"

  - entity: Shipment
    dimension: transport_status
    initial_state: TENDERED
    terminal_states: [DELIVERED, LOST]
    note: "Transport axis. Independent of the conformance axis below: no transition here writes conformance_status, and no conformance transition writes transport_status."
    transitions:
      - from: TENDERED
        to: IN_TRANSIT
        trigger: "POST /sharps/shipments/{id}/transport-events with event_type=IN_TRANSIT"
        actor: LogisticsCoordinator
        preconditions:
          - "shipment.transport_status == TENDERED"
        side_effects:
          - "sets Shipment.transport_status = IN_TRANSIT and leaves conformance_status at UNSCREENED"
          - "CASCADE: Kit SEALED -> IN_TRANSIT"
          - "increments Shipment.version by 1"
      - from: IN_TRANSIT
        to: DELIVERED
        trigger: "POST /sharps/shipments/{id}/transport-events with event_type=DELIVERED"
        actor: LogisticsCoordinator
        preconditions:
          - "shipment.transport_status == IN_TRANSIT"
        side_effects:
          - "sets Shipment.transport_status = DELIVERED and delivered_at = current logical clock instant; conformance_status remains UNSCREENED"
          - "CASCADE: Kit IN_TRANSIT -> RECEIVED"
          - "increments Shipment.version by 1"
      - from: TENDERED
        to: LOST
        trigger: "POST /sharps/shipments/{id}/transport-events with event_type=LOST"
        actor: LogisticsCoordinator
        preconditions:
          - "shipment.transport_status IN {TENDERED, IN_TRANSIT}"
        side_effects:
          - "CASCADE hop 1: sets Shipment.transport_status = LOST"
          - "CASCADE hop 2: because the shipment became LOST, its Kit transitions SEALED|IN_TRANSIT -> VOIDED with void_reason 'SHIPMENT_LOST' and its ReturnLabel transitions ACTIVATED -> VOIDED"
          - "CASCADE hop 3: because the kit became VOIDED, a RESERVATION_RELEASE SponsorLedgerEntry of -Kit.provisional_cost_cents is appended, SponsorshipProgram.reserved_cents decreases and TreatmentFacility.pending_intake_units decreases by Shipment.custody_units"
          - "CASCADE hop 4: because reserved_cents decreased, SponsorshipProgram.available_cents is recomputed and the program transitions EXHAUSTED -> ACTIVE when available_cents > 0"
          - "increments Shipment.version by 1"
      - from: IN_TRANSIT
        to: LOST
        trigger: "POST /sharps/shipments/{id}/transport-events with event_type=LOST"
        actor: LogisticsCoordinator
        preconditions:
          - "shipment.transport_status == IN_TRANSIT"
        side_effects:
          - "same four-hop cascade as TENDERED -> LOST"
          - "increments Shipment.version by 1"

  - entity: Shipment
    dimension: conformance_status
    initial_state: UNSCREENED
    terminal_states: [CONFORMING, REMEDIATED]
    note: "Conformance axis on the same Shipment row. Screening requires transport_status == DELIVERED but never modifies it."
    transitions:
      - from: UNSCREENED
        to: CONFORMING
        trigger: "POST /sharps/shipments/{id}/conformance-screening with outcome=CONFORMING"
        actor: IntakeTechnician
        preconditions:
          - "shipment.conformance_status == UNSCREENED"
          - "shipment.transport_status == DELIVERED (cross-axis guard)"
          - "observed_gross_weight_grams <= the pinned PackagingSpec.max_gross_weight_grams"
        side_effects:
          - "sets Shipment.conformance_status = CONFORMING, observed_gross_weight_grams and screened_by_user_id = X-User-ID; transport_status is untouched"
          - "recomputes Patient.screening_risk_score per §1.3 patient_risk_score (variant SCREENING)"
          - "increments Shipment.version by 1"
      - from: UNSCREENED
        to: NON_CONFORMING
        trigger: "POST /sharps/shipments/{id}/conformance-screening with outcome=NON_CONFORMING"
        actor: IntakeTechnician
        preconditions:
          - "shipment.conformance_status == UNSCREENED"
          - "shipment.transport_status == DELIVERED"
          - "reason_code is supplied"
        side_effects:
          - "CASCADE hop 1: sets Shipment.conformance_status = NON_CONFORMING, observed_gross_weight_grams and screened_by_user_id = X-User-ID"
          - "CASCADE hop 2: because the shipment became NON_CONFORMING, a NonConformanceEvent is created with status OPEN, the submitted reason_code and notification_deadline_at = created_at + patient StateSharpsRule.notification_deadline_hours, and Patient.screening_risk_score is recomputed per §1.3 patient_risk_score (variant SCREENING) over the enlarged event set"
          - "CASCADE hop 3: when (and only when) the recomputed screening_risk_score >= RISK_SUSPEND_THRESHOLD, Patient ENROLLED -> SUSPENDED (which itself pauses enrollments, voids ISSUED kits and releases reservations — see the Patient machine hops 2-5)"
          - "increments Shipment.version by 1"
      - from: NON_CONFORMING
        to: REMEDIATED
        trigger: "POST /sharps/non-conformance-events/{id}/remediate"
        actor: IntakeTechnician
        preconditions:
          - "shipment.conformance_status == NON_CONFORMING"
          - "the NonConformanceEvent.status == CUSTOMER_NOTIFIED"
        side_effects:
          - "sets Shipment.conformance_status = REMEDIATED; transport_status stays DELIVERED"
          - "action=RETURN_TO_PATIENT: Kit RECEIVED -> RETURNED_TO_PATIENT, TreatmentFacility.pending_intake_units -= Shipment.custody_units, ReturnLabel ACTIVATED -> VOIDED"
          - "action=ON_SITE_REPACK: Kit stays RECEIVED and remains certifiable; pending_intake_units unchanged; REMEDIATION_SURCHARGE_CENTS[ON_SITE_REPACK] enters the final settlement"
          - "action=DISPOSE_AS_RMW: Kit stays RECEIVED and remains certifiable; pending_intake_units unchanged; REMEDIATION_SURCHARGE_CENTS[DISPOSE_AS_RMW] enters the final settlement"
          - "sets NonConformanceEvent.status = RESOLVED and remediation_action"
          - "increments Shipment.version by 1"

  - entity: NonConformanceEvent
    initial_state: OPEN
    terminal_states: [RESOLVED]
    transitions:
      - from: OPEN
        to: CUSTOMER_NOTIFIED
        trigger: "POST /sharps/non-conformance-events/{id}/notify-customer"
        actor: IntakeTechnician
        preconditions:
          - "event.status == OPEN"
          - "current logical clock instant <= event.notification_deadline_at"
        side_effects:
          - "sets status = CUSTOMER_NOTIFIED, notified_at = current logical clock instant, notification_channel from the request"
          - "increments NonConformanceEvent.version by 1"
      - from: CUSTOMER_NOTIFIED
        to: RESOLVED
        trigger: "POST /sharps/non-conformance-events/{id}/remediate"
        actor: IntakeTechnician
        preconditions:
          - "event.status == CUSTOMER_NOTIFIED"
          - "action != RETURN_TO_PATIENT when the patient's StateSharpsRule.household_sharps_classification == REGULATED_MEDICAL_WASTE"
          - "action != DISPOSE_AS_RMW unless TreatmentFacility.accepted_hazard_classes contains UN3291_REGULATED_MEDICAL_WASTE"
        side_effects:
          - "sets status = RESOLVED and remediation_action"
          - "drives the Shipment conformance axis NON_CONFORMING -> REMEDIATED and the action-specific kit/facility/label effects listed there"
          - "increments NonConformanceEvent.version by 1"

  - entity: DestructionCertificate
    initial_state: ISSUED
    terminal_states: [VOIDED]
    transitions:
      - from: null
        to: ISSUED
        trigger: "POST /sharps/shipments/{id}/destruction-certificates"
        actor: DestructionOfficer
        preconditions:
          - "shipment.transport_status == DELIVERED"
          - "shipment.conformance_status IN {CONFORMING, REMEDIATED}"
          - "kit.status == RECEIVED"
          - "no other DestructionCertificate with status ISSUED exists for this shipment"
          - "TreatmentFacility.status == ACTIVE (cross-entity guard)"
          - "TreatmentFacility.accepted_hazard_classes contains the pinned PackagingSpec.hazard_class"
          - "X-User-ID != Shipment.screened_by_user_id (segregation of duties)"
          - "destroyed_units == Kit.fill_units"
        side_effects:
          - "mints the certificate with certificate_number, destruction_date, retention_until_date (§1.3 certificate_retention_deadline), final_kit_cost_cents and rebate_pct_applied (§1.3 kit_cost_final_settlement), issued_by_user_id = X-User-ID"
          - "CASCADE: Kit RECEIVED -> DESTROYED"
          - "appends a RESERVATION_RELEASE SponsorLedgerEntry of -Kit.provisional_cost_cents (sequence_no n) and then a COMMITMENT SponsorLedgerEntry of +final_kit_cost_cents (sequence_no n+1), in that pinned order"
          - "recomputes SponsorshipProgram.reserved_cents, committed_cents, available_cents, kits_settled_count, provisional_total_cents, final_total_cents and status"
          - "increments TreatmentFacility.certificates_issued_count by 1, decreases pending_intake_units by Shipment.custody_units and increases destroyed_units_total by destroyed_units"
      - from: ISSUED
        to: VOIDED
        trigger: "POST /sharps/destruction-certificates/{id}/void"
        actor: DestructionOfficer
        preconditions:
          - "certificate.status == ISSUED"
        side_effects:
          - "sets status = VOIDED, voided_at and void_reason"
          - "appends a COMMITMENT_REVERSAL SponsorLedgerEntry of -final_kit_cost_cents (sequence_no n) and then a RESERVATION SponsorLedgerEntry of +Kit.provisional_cost_cents (sequence_no n+1), in that pinned order, restoring the pre-certificate balances exactly"
          - "CASCADE: Kit DESTROYED -> RECEIVED"
          - "increases TreatmentFacility.pending_intake_units by Shipment.custody_units, decreases destroyed_units_total by destroyed_units, and leaves certificates_issued_count unchanged (so the certificate_number sequence never reuses a number)"
          - "recomputes SponsorshipProgram balances, kits_settled_count and status"

  - entity: SponsorshipProgram
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: EXHAUSTED
        trigger: "system event: available_cents recomputed to exactly 0 after a RESERVATION, COMMITMENT or FUNDING_ADJUSTMENT append"
        actor: system
        preconditions:
          - "program.status == ACTIVE"
          - "available_cents == 0"
        side_effects:
          - "sets SponsorshipProgram.status = EXHAUSTED (new kit issuance is refused by §1.4 priority 23)"
          - "increments SponsorshipProgram.version by 1"
      - from: EXHAUSTED
        to: ACTIVE
        trigger: "system event: available_cents recomputed above 0 by a RESERVATION_RELEASE, COMMITMENT_REVERSAL or positive FUNDING_ADJUSTMENT"
        actor: system
        preconditions:
          - "program.status == EXHAUSTED"
          - "available_cents > 0"
        side_effects:
          - "sets SponsorshipProgram.status = ACTIVE"
          - "increments SponsorshipProgram.version by 1"

  - entity: Sponsor
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /sharps/sponsors/{id}/status-actions with action=SUSPEND"
        actor: ProgramAdmin
        preconditions:
          - "sponsor.status == ACTIVE"
        side_effects:
          - "sets Sponsor.status = SUSPENDED; existing programs, enrollments and kits are untouched, but no new program may be created under this sponsor and no new enrollment may be created against its programs (§1.4 priority 31, ERR_SPONSOR_NOT_ACTIVE)"
          - "increments Sponsor.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /sharps/sponsors/{id}/status-actions with action=REINSTATE"
        actor: ProgramAdmin
        preconditions:
          - "sponsor.status == SUSPENDED"
        side_effects:
          - "sets Sponsor.status = ACTIVE"
          - "increments Sponsor.version by 1"

  - entity: TreatmentFacility
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /sharps/treatment-facilities/{id}/status-actions with action=SUSPEND"
        actor: ProgramAdmin
        preconditions:
          - "facility.status == ACTIVE"
        side_effects:
          - "sets TreatmentFacility.status = SUSPENDED; in-flight shipments keep their custody units but no certificate may be issued and no label may be activated to this facility"
          - "increments TreatmentFacility.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /sharps/treatment-facilities/{id}/status-actions with action=REINSTATE"
        actor: ProgramAdmin
        preconditions:
          - "facility.status == SUSPENDED"
        side_effects:
          - "sets TreatmentFacility.status = ACTIVE"
          - "increments TreatmentFacility.version by 1"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on the parent's `version` — the only sanctioned mechanism)
# =============================================================================
concurrency_rules:
  - rule_id: kit-issue-stale-enrollment
    parent_entity: Enrollment
    write_endpoint: "POST /sharps/enrollments/{id}/kits"
    occ_field: "expected_enrollment_version"
    description: |
      Issuing a Kit against an Enrollment whose version has advanced since the
      client last read it is rejected. Kit issuance legitimately supersedes the
      enrollment's currently open kit (STEP 1 of the issuance side effects), so a
      second issuance carrying the version the client observed before the first
      issuance would otherwise silently void a kit the client never saw and
      re-reserve funds against a stale balance. The stale-version check turns that
      into a deterministic 412.
    error_id: ERR_STALE_ENROLLMENT_VERSION
    http_status: 412

  - rule_id: funding-adjustment-stale-program
    parent_entity: SponsorshipProgram
    write_endpoint: "POST /sharps/programs/{id}/funding-adjustments"
    occ_field: "expected_program_version"
    description: |
      Adjusting a program's funding ceiling from a stale read is rejected. Funding
      adjustments are additive and would each legitimately succeed on their own, so
      no state precondition can separate a fresh adjustment from one computed against
      a ceiling that has since moved; the version check is the only guard.
    error_id: ERR_STALE_PROGRAM_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: container_size_selection
    trigger: "POST /sharps/enrollments/{id}/kits (operator issuance) and every kit created by POST /sharps/auto-ship-runs"
    algorithm: threshold
    formula: |
      # ---- demand, computed with ONE ceiling at the very end (pinned rounding order) ----
      UPI            = UNITS_PER_ITEM[patient.therapy_type]
      required_units = ceil( patient.weekly_sharps_count * UPI * enrollment.cadence_days * 115 / 700 )
      #   115/700 folds SAFETY_MARGIN (1.15) and the 7-day week into a single exact rational.
      #   PINNED: the multiplication is exact integer arithmetic and exactly one ceil() is applied
      #   to the final quotient. Ceiling the weekly-to-cadence quotient first and then applying
      #   the margin is a DIFFERENT, forbidden order (it can inflate required_units by one unit
      #   and thereby pick a larger container).

      # ---- candidate set (eligibility filter over SIZE_CATALOG) ----
      candidates = [ s in SIZE_CATALOG where
                       s.volume_liters   <= state_rule.max_container_volume_liters   # inclusive
                   AND s.capacity_units  >= required_units                            # inclusive
                   AND ( patient.therapy_type != 'INFUSION_SETS'  OR s.volume_liters >= 7.6 )
                   AND ( patient.therapy_type != 'LANCETS_ONLY'   OR s.volume_liters <= 11.4 ) ]

      # ---- ranking (fully pinned; no random field participates) ----
      rank key   = (s.capacity_units ASC, s.volume_liters ASC, s.size_code ASC)
      selected   = first(candidates ordered by rank key)

      # ---- request override ----
      if request.container_size (or enrollment.requested_container_size when the request omits it) is not null:
          if that size is in candidates -> selected = that size
          else                         -> ERR_CONTAINER_SIZE_NOT_PERMITTED (422)
      if candidates is empty           -> ERR_NO_ELIGIBLE_CONTAINER_SIZE (422)

      # ---- seal horizon (same issuance-time calculation; pins Kit.seal_deadline_date) ----
      seal_deadline_date = (issued_at UTC calendar date) plus (enrollment.cadence_days + SEAL_GRACE_DAYS) CALENDAR DAYS
      #   Plain day arithmetic on the UTC calendar date; the time-of-day of issued_at is discarded.
    input_set: "The patient's therapy_type and weekly_sharps_count, the enrollment's cadence_days, the patient's StateSharpsRule.max_container_volume_liters, and the four fixed SIZE_CATALOG rows. Kit rows already issued do NOT influence sizing."
    constants:
      SIZE_CATALOG:
        ONE_QUART:    { volume_liters: 0.9,  capacity_units: 100,  unit_cost_cents: 1450 }
        TWO_GALLON:   { volume_liters: 7.6,  capacity_units: 800,  unit_cost_cents: 2600 }
        THREE_GALLON: { volume_liters: 11.4, capacity_units: 1300, unit_cost_cents: 3400 }
        EIGHT_GALLON: { volume_liters: 30.3, capacity_units: 3600, unit_cost_cents: 6900 }
      UNITS_PER_ITEM:
        INSULIN_PEN_NEEDLES: 1
        INSULIN_SYRINGES: 2
        AUTOINJECTOR_PENS: 6
        INFUSION_SETS: 9
        LANCETS_ONLY: 1
      SAFETY_MARGIN_NUMERATOR: 115
      SAFETY_MARGIN_DENOMINATOR: 100
      DAYS_PER_WEEK: 7
      SEAL_GRACE_DAYS: 14
    precision: "required_units is an integer (single ceiling); volume comparisons use exact decimal arithmetic to one decimal place"
    variants:
      - name: OPERATOR_ISSUANCE
        when: "POST /sharps/enrollments/{id}/kits"
        difference: "request.container_size may override the ranked selection (still filtered through `candidates`)"
      - name: AUTO_SHIP_ISSUANCE
        when: "POST /sharps/auto-ship-runs"
        difference: "no per-request override exists; enrollment.requested_container_size is consulted instead, and an empty candidate set aborts the whole run with ERR_NO_ELIGIBLE_CONTAINER_SIZE (422) leaving no AutoShipRun row and no kits"

  - name: kit_cost_provisional
    trigger: "kit issuance (POST /sharps/enrollments/{id}/kits, and each kit minted by POST /sharps/auto-ship-runs) — STEP 3 of the issuance side effects"
    algorithm: aggregation
    formula: |
      base_cents            = SIZE_CATALOG[kit.container_size].unit_cost_cents
      estimated_grams       = kit.capacity_units * ESTIMATED_GRAMS_PER_UNIT      # capacity, NOT fill_units (nothing is filled yet)
      estimated_transport   = round_half_up( estimated_grams * TRANSPORT_RATE_CENTS_PER_KG / 1000 )
      provisional_cost_cents = base_cents + estimated_transport
      # PINNED ASYMMETRY vs the final variant: at issuance the per-kit allowance is a HARD GATE —
      # provisional_cost_cents > program.per_kit_allowance_cents raises
      # ERR_PER_KIT_ALLOWANCE_EXCEEDED (422) and no kit is created, so provisional_cost_cents is
      # never clamped. At settlement the allowance is a SILENT CAP (min()), never an error.
    input_set: "Only the kit's own container_size (through SIZE_CATALOG) and, as a gate, the program's per_kit_allowance_cents. No shipment or destruction data exists yet, which is precisely why this variant diverges from the final settlement."
    constants:
      ESTIMATED_GRAMS_PER_UNIT: 4
      TRANSPORT_RATE_CENTS_PER_KG: 38
    precision: "whole cents, round_half_up on the transport component before the min()"
    variants:
      - name: PROVISIONAL_RESERVATION
        when: "kit issuance; booked as a RESERVATION SponsorLedgerEntry against reserved_cents"
        difference: "capacity-based weight estimate, no destruction fee, no remediation surcharge, no rebate"
      - name: FINAL_SETTLEMENT
        when: "certificate issuance; see calculations.kit_cost_final_settlement"
        difference: "measured weight, per-unit destruction fee, remediation surcharge and sponsor-type rebate tier — the two variants therefore return DIFFERENT cent amounts for the same kit, and the delta is what the RESERVATION_RELEASE + COMMITMENT pair reconciles"

  - name: kit_cost_final_settlement
    trigger: "POST /sharps/shipments/{id}/destruction-certificates (the DestructionCertificate null -> ISSUED transition)"
    algorithm: tiered_pricing
    formula: |
      # ---- PINNED EVALUATION ORDER: each component is rounded to whole cents FIRST, then summed.
      #      (Summing exact values and rounding once at the end is a DIFFERENT, forbidden order and
      #       differs by a cent whenever a component lands on a half-cent — HEALTH_PLAN's 2.5 c/unit
      #       destruction rate makes that reachable.)
      base_cents        = SIZE_CATALOG[kit.container_size].unit_cost_cents
      transport_cents   = round_half_up( shipment.observed_gross_weight_grams * TRANSPORT_RATE_CENTS_PER_KG / 1000 )
      destruction_cents = round_half_up( certificate.destroyed_units * DESTRUCTION_RATE_CENTS_PER_UNIT[sponsor.sponsor_type] )
      surcharge_cents   = REMEDIATION_SURCHARGE_CENTS[ nonconformance_event.remediation_action of this shipment, else 'NONE' ]

      pre_rebate_cents  = base_cents + transport_cents + destruction_cents + surcharge_cents
      capped_cents      = min( program.per_kit_allowance_cents, pre_rebate_cents )

      # ---- circular-looking dependency, resolved by an explicit order ----
      #      rebate_pct is keyed on a cumulative total that INCLUDES this kit, while committed_cents
      #      itself only ever grows by POST-rebate amounts. PINNED: the tier basis is
      #      program.committed_cents as it stands BEFORE this certificate PLUS this kit's
      #      capped PRE-rebate amount. Keying the tier on the post-rebate figure is forbidden and
      #      returns a different tier exactly at a tier boundary.
      tier_basis_cents  = program.committed_cents (before this append) + capped_cents
      rebate_pct        = 0.00                                    if sponsor.sponsor_type == 'HEALTH_PLAN'
                        = REBATE_TIERS lookup on tier_basis_cents if sponsor.sponsor_type == 'MANUFACTURER'
      rebate_cents      = round_half_up( capped_cents * rebate_pct )
      final_kit_cost_cents = capped_cents - rebate_cents
    input_set: "The kit's container_size and fill_units, the shipment's observed_gross_weight_grams, the resolved remediation_action (null when the shipment was screened CONFORMING), the sponsor's sponsor_type, the program's per_kit_allowance_cents and its committed_cents as of the instant before this certificate's ledger appends (COMMITMENT_REVERSAL amounts from voided certificates are already netted out of that figure)."
    constants:
      TRANSPORT_RATE_CENTS_PER_KG: 38
      DESTRUCTION_RATE_CENTS_PER_UNIT: { MANUFACTURER: 3, HEALTH_PLAN: 2.5 }
      REMEDIATION_SURCHARGE_CENTS: { NONE: 0, RETURN_TO_PATIENT: 0, ON_SITE_REPACK: 500, DISPOSE_AS_RMW: 900 }
      REBATE_TIERS:
        - { basis_min_cents: 0,     basis_max_cents: 14999,    rebate_pct: 0.00 }
        - { basis_min_cents: 15000, basis_max_cents: 29999,    rebate_pct: 0.03 }
        - { basis_min_cents: 30000, basis_max_cents: 100000000, rebate_pct: 0.06 }
    precision: "whole cents; round_half_up applied independently to transport_cents, destruction_cents and rebate_cents, in that order, before any addition or subtraction"

  - name: patient_risk_score
    trigger: "variant SCREENING recomputes on every POST /sharps/shipments/{id}/conformance-screening (both outcomes); variant AUDIT recomputes only inside POST /sharps/auto-ship-runs, which also refreshes the SCREENING value for every in-scope patient"
    algorithm: weighted_scoring
    formula: |
      events = NonConformanceEvent rows E where
                 E.shipment_id -> Shipment.kit_id -> Kit.enrollment_id -> Enrollment.patient_id == patient.id
                 AND E.status IN {OPEN, CUSTOMER_NOTIFIED, RESOLVED}      # i.e. every event ever opened
      age_days(E) = floor( (current_logical_clock - E.created_at) / 86400 seconds )

      # ---- variant SCREENING (decayed) ----
      decay(E) = 1.0  if age_days(E) <= 90
               = 0.5  if 91 <= age_days(E) <= 180
               = 0.0  if age_days(E) >  180
      screening_risk_score = min( 100, round_half_up( SUM over events of REASON_WEIGHTS[E.reason_code] * decay(E) ) )
      #   PINNED: the decayed terms are summed EXACTLY (halves are kept) and round_half_up is applied
      #   ONCE to the total. Rounding each decayed term first and then summing is a DIFFERENT,
      #   forbidden order (two 0.5-decayed odd weights differ by a full point).

      # ---- variant AUDIT (undecayed + lateness) ----
      late_kits = count of Kit K where K.enrollment_id in this patient's enrollments
                    AND K.status IN {ISSUED, ACTIVE_FILLING}
                    AND K.seal_deadline_date < current logical clock UTC date
      audit_risk_score = min( 100, SUM over events of REASON_WEIGHTS[E.reason_code]
                                   + LATE_KIT_PENALTY * late_kits )

      # ---- threshold (SCREENING only) ----
      if variant == SCREENING and screening_risk_score >= RISK_SUSPEND_THRESHOLD and patient.status == ENROLLED:
          Patient ENROLLED -> SUSPENDED (cascade)
      # An auto-ship run NEVER suspends: audit_risk_score >= RISK_SUSPEND_THRESHOLD only makes the run
      # skip that enrollment (kits_skipped_risk += 1) and never writes Patient.status.
    input_set: "All NonConformanceEvent rows reachable from the patient through Shipment -> Kit -> Enrollment, regardless of event status; plus, for AUDIT only, the patient's Kit rows still in ISSUED or ACTIVE_FILLING past their seal_deadline_date."
    constants:
      REASON_WEIGHTS:
        UNAPPROVED_WASTE_TYPE: 40
        LOOSE_SHARPS_IN_BOX: 45
        UNSEALED_CONTAINER: 30
        OVERFILLED_CONTAINER: 25
        WEIGHT_EXCEEDS_SPEC: 20
        MISSING_ABSORBENT: 15
      DECAY_FRESH_MAX_AGE_DAYS: 90
      DECAY_HALF_MAX_AGE_DAYS: 180
      LATE_KIT_PENALTY: 10
      RISK_SUSPEND_THRESHOLD: 60
      SCORE_CEILING: 100
    precision: "integer 0..100; exactly one round_half_up per variant, applied to the full sum"
    variants:
      - name: SCREENING
        when: "conformance screening, and refreshed inside auto-ship runs"
        difference: "age decay applied (1.0 / 0.5 / 0.0); no lateness penalty; crossing 60 suspends the patient"
      - name: AUDIT
        when: "auto-ship run skip decisions"
        difference: "no decay at all plus LATE_KIT_PENALTY per late kit — for the same event set the two variants return DIFFERENT integers, and only AUDIT can be pushed over 60 by lateness alone"

  - name: label_validity_window
    trigger: "POST /sharps/kits/{id}/return-labels (label creation) and every read of ReturnLabel"
    algorithm: interval_merge
    formula: |
      valid_from  = current logical clock instant
      valid_until = valid_from + LABEL_VALIDITY_DAYS days                  # exact instant arithmetic
      window(L)   = [ L.valid_from , L.valid_until ]                       # CLOSED on both ends

      # A new label for the same kit is rejected when its window TOUCHES a live label's window.
      # Adjacency counts as a conflict: an instant equal to a live label's valid_until is a conflict,
      # one second later is not.
      live_labels = ReturnLabel rows L2 where L2.kit_id == kit.id AND L2.status IN {PRINTED, ACTIVATED}
      conflict    = EXISTS L2 in live_labels with
                      new.valid_from <= L2.valid_until AND L2.valid_from <= new.valid_until
      if conflict -> ERR_LABEL_WINDOW_CONFLICT (409)

      # A VOIDED label keeps blocking for a quarantine period measured from the void instant,
      # so voiding does not immediately free the kit.
      quarantined = EXISTS L3 where L3.kit_id == kit.id AND L3.status == VOIDED
                      AND current logical clock < L3.voided_at + LABEL_VOID_QUARANTINE_HOURS
      if quarantined -> ERR_LABEL_WINDOW_CONFLICT (409)

      # Activation-time expiry check (separate error, business_temporal band)
      on POST /sharps/return-labels/{id}/activate:
        if current logical clock instant > label.valid_until -> ERR_LABEL_EXPIRED (422)
        # activating exactly AT valid_until is still allowed (<= comparison)
    input_set: "All ReturnLabel rows for the same kit_id in status PRINTED, ACTIVATED (window overlap) or VOIDED (void quarantine). Labels belonging to other kits never conflict."
    constants:
      LABEL_VALIDITY_DAYS: 45
      LABEL_VOID_QUARANTINE_HOURS: 24
    precision: "instants compared to the second against the logical clock; both the window endpoints and the quarantine boundary are inclusive on the live side (== valid_until conflicts, == voided_at + 24h is free)"

  - name: facility_intake_occupancy
    trigger: "POST /sharps/return-labels/{id}/activate (the moment a shipment is tendered against a scheduled_intake_date)"
    algorithm: aggregation
    formula: |
      # Aggregate booking, not a per-shipment check: each individual shipment can be well under the
      # ceiling while the day's total exceeds it.
      open(S) = S.transport_status != LOST
                AND NOT EXISTS a DestructionCertificate for S with status ISSUED
                AND NOT (S has a RESOLVED NonConformanceEvent with remediation_action == RETURN_TO_PATIENT)
      #   "open" == the units are still the facility's problem: booked in transit, or physically held
      #   awaiting destruction. A LOST parcel never arrives; a destroyed or returned parcel is gone.
      booked_units(F, D) = SUM over Shipment S of S.custody_units where
                             S.treatment_facility_id == F.id
                             AND S.scheduled_intake_date == D
                             AND open(S)
      new_custody_units  = kit.fill_units                # frozen onto Shipment.custody_units at activation
      if booked_units(F, D) + new_custody_units > F.daily_intake_capacity_units:
          -> ERR_FACILITY_INTAKE_CAPACITY_EXCEEDED (409)
      else:
          F.pending_intake_units += new_custody_units
      # Releases (each subtracts exactly the custody_units that were added, see §1.2): transport LOST,
      # DestructionCertificate ISSUED, and RETURN_TO_PATIENT remediation. Delivery does NOT release,
      # and voiding a certificate re-books the units.
    input_set: "Shipments sharing the facility AND the exact scheduled_intake_date that are still open, summed over their custody_units. A different intake date, a LOST parcel, a certified-destroyed parcel and a returned-to-patient parcel each contribute nothing; a merely DELIVERED parcel still contributes."
    constants:
      RELEASING_EVENTS: [transport_LOST, certificate_ISSUED, remediation_RETURN_TO_PATIENT]
      OCCUPYING_TRANSPORT_STATUSES: [TENDERED, IN_TRANSIT, DELIVERED]
    precision: "integer container units; the comparison is strictly greater-than, so landing exactly on daily_intake_capacity_units is allowed"

  - name: certificate_retention_deadline
    trigger: "POST /sharps/shipments/{id}/destruction-certificates"
    algorithm: threshold
    formula: |
      patient_years  = StateSharpsRule(patient.state_rule_id).certificate_retention_years
      facility_years = StateSharpsRule(facility.state_rule_id).certificate_retention_years
      retention_years = max( patient_years, facility_years, FEDERAL_MIN_RETENTION_YEARS )
      retention_until_date = destruction_date plus retention_years CALENDAR years
      #   Calendar-year addition, not 365-day multiplication: a 2028-02-29 destruction date with
      #   3 retention years yields 2031-02-28 (Feb-29 anniversaries clamp to Feb 28).
    input_set: "Exactly two StateSharpsRule rows — the patient's and the treatment facility's — plus the federal floor. The sponsor's state is irrelevant."
    constants:
      FEDERAL_MIN_RETENTION_YEARS: 3
    precision: "whole calendar years; leap-day anniversaries clamp down to Feb 28"

  - name: tracking_number_minting
    trigger: "tracking_number on POST /sharps/kits/{id}/return-labels; certificate_number on POST /sharps/shipments/{id}/destruction-certificates"
    algorithm: aggregation
    formula: |
      # tracking_number (ReturnLabel) — global, monotonic, no randomness
      seq            = count(all ReturnLabel rows, including VOIDED ones) + 1
      tracking_number = POSTAL_PREFIX[packaging_spec.postal_service] + "-" + zero_pad(seq, 8)

      # certificate_number (DestructionCertificate) — scoped to the facility
      cseq            = facility.certificates_issued_count + 1     # counter includes voided certificates
      certificate_number = "CERT-" + facility.permit_number + "-" + zero_pad(cseq, 5)
      # Voided rows are NEVER reused, so a re-issued certificate for the same shipment gets a new number.
    input_set: "Row counts only — every ReturnLabel ever created (global) and TreatmentFacility.certificates_issued_count for that facility. Voided rows still consume their sequence number."
    constants:
      POSTAL_PREFIX:
        USPS_PARCEL_SELECT_MAILBACK: "USPSMB"
        UPS_GROUND_MEDICAL: "UPSGM"
      TRACKING_SEQUENCE_WIDTH: 8
      CERTIFICATE_SEQUENCE_WIDTH: 5
    precision: "zero-padded fixed-width integers; no UUID or random component participates"

  - name: autoship_due_evaluation
    trigger: "POST /sharps/auto-ship-runs (the ops-run checkpoint)"
    algorithm: chronological
    formula: |
      scope = Enrollment rows E where E.status == ACTIVE, processed in E.created_at ASC
              (E.created_at ASC is the sole sanctioned ordering; no other field — and in
               particular never E.id — participates in the processing order)

      # STEP A — refresh risk for every patient with a non-terminal enrollment (status not in
      #          {REJECTED, TERMINATED}); BOTH variants of calculations.patient_risk_score are
      #          recomputed and stored. This step NEVER writes Patient.status.
      # STEP B — for each E in scope, evaluate skip reasons in this PINNED order and stop at the
      #          first one that fires:
      #   1. not_due    : E.next_autoship_due_date > run.as_of_date              -> kits_skipped_not_due  += 1
      #   2. risk       : patient.audit_risk_score >= RISK_SUSPEND_THRESHOLD     -> kits_skipped_risk      += 1
      #   3. unfilled   : most recent Kit of E (created_at DESC) has status
      #                   IN {ISSUED, ACTIVE_FILLING}                            -> kits_skipped_unfilled  += 1
      #   4. funding    : program.available_cents < provisional_cost_cents of the
      #                   kit that WOULD be issued                               -> kits_skipped_funding   += 1
      #   otherwise     : issue a Kit exactly as POST /sharps/enrollments/{id}/kits does, with
      #                   supersedes_kit_id = most recent prior Kit of E by created_at DESC (null if
      #                   none) and auto_ship_run_id = this run; then
      #                   E.next_autoship_due_date = run.as_of_date + E.cadence_days
      #                                                                          -> kits_created          += 1
      # A run that issues zero kits is still a successful 201 with an AutoShipRun row.
      # kits_authorized is still enforced and is NOT a skip reason: if a due, unskipped enrollment
      # has kits_issued >= kits_authorized the run raises ERR_KIT_AUTHORIZATION_EXHAUSTED (409) and
      # aborts entirely, leaving no AutoShipRun row and no kits.
    input_set: "Every Enrollment in status ACTIVE (PAUSED, DRAFT, PENDING_SPONSOR_APPROVAL, REJECTED and TERMINATED enrollments are out of scope entirely), each one's most recent Kit, its patient's refreshed audit_risk_score, and its program's available_cents as it stands after the kits already issued earlier in the SAME run."
    constants:
      RISK_SUSPEND_THRESHOLD: 60
      UNFILLED_KIT_STATUSES: [ISSUED, ACTIVE_FILLING]
      SKIP_REASON_ORDER: [not_due, risk, unfilled, funding]
    precision: "counters are integers; funding is compared in whole cents against the running available_cents, so an earlier enrollment in the same run can starve a later one"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority — lowest number wins)
# =============================================================================
# Domain priority order inside the business band, pinned for the whole API:
#   business_safety (state/regulatory/patient safety)
#     -> business_referential (identity & ownership)
#     -> business_constraint (packaging, routing, capacity, uniqueness, counters)
#     -> business_temporal (windows and deadlines)
#     -> business_fiscal (per-kit allowance, then the program pool)
# Rationale: a shipment that a state forbids must never be diagnosed as a budget problem, and a
# budget problem must never mask a packaging-compliance defect.
validations:

  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present and X-User-Role is one of the six declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "the acting X-User-Role appears in the endpoint's roles list"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: all

  - priority: 3
    category: business_constraint
    check: "request body/query shape: required fields present, types correct, enum values in range, integers within declared bounds, dates ISO-8601 YYYY-MM-DD, instants ISO-8601 UTC, limit in 1..100, offset >= 0, arrays non-empty where declared"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

  - priority: 4
    category: existence
    check: "every id referenced in the PATH exists, validated left-to-right, before any id in the BODY is looked up"
    error_id: "ERR_<ENTITY>_NOT_FOUND (the specific code for the first missing id)"
    http_status: 404
    applies_to: all endpoints with path or body ids

  - priority: 4
    category: existence
    check: "StateSharpsRule referenced by state_rule_id exists"
    error_id: ERR_STATE_RULE_NOT_FOUND
    http_status: 404
    applies_to: "POST /sharps/treatment-facilities, POST /sharps/patients, GET /sharps/patients, GET /sharps/treatment-facilities"

  - priority: 4
    category: existence
    check: "PackagingSpec referenced by packaging_spec_id exists"
    error_id: ERR_PACKAGING_SPEC_NOT_FOUND
    http_status: 404
    applies_to: "POST /sharps/kits/{id}/return-labels, GET /sharps/return-labels"

  - priority: 4
    category: existence
    check: "TreatmentFacility referenced by id or treatment_facility_id exists"
    error_id: ERR_FACILITY_NOT_FOUND
    http_status: 404
    applies_to: "POST /sharps/return-labels/{id}/activate, POST /sharps/treatment-facilities/{id}/status-actions, GET /sharps/treatment-facilities/{id}, GET /sharps/destruction-certificates, GET /sharps/shipments"

  - priority: 4
    category: existence
    check: "Sponsor referenced by path id exists"
    error_id: ERR_SPONSOR_NOT_FOUND
    http_status: 404
    applies_to: "POST /sharps/sponsors/{id}/status-actions, POST /sharps/sponsors/{id}/programs, GET /sharps/sponsors/{id}, GET /sharps/sponsors/{id}/programs"

  - priority: 4
    category: existence
    check: "SponsorshipProgram referenced by id or sponsorship_program_id exists"
    error_id: ERR_PROGRAM_NOT_FOUND
    http_status: 404
    applies_to: "POST /sharps/programs/{id}/funding-adjustments, POST /sharps/enrollments, GET /sharps/programs/{id}, GET /sharps/sponsors/{id}/programs, GET /sharps/enrollments, GET /sharps/ledger-entries"

  - priority: 4
    category: existence
    check: "Patient referenced by id or patient_id exists"
    error_id: ERR_PATIENT_NOT_FOUND
    http_status: 404
    applies_to: "POST /sharps/patients/{id}/eligibility-review, POST /sharps/patients/{id}/status-actions, POST /sharps/enrollments, GET /sharps/patients/{id}, GET /sharps/enrollments"

  - priority: 4
    category: existence
    check: "Enrollment referenced by path id or enrollment_id exists"
    error_id: ERR_ENROLLMENT_NOT_FOUND
    http_status: 404
    applies_to: "POST /sharps/enrollments/{id}/submit, POST /sharps/enrollments/{id}/sponsor-decision, POST /sharps/enrollments/{id}/kits, GET /sharps/enrollments/{id}, GET /sharps/kits"

  - priority: 4
    category: existence
    check: "Kit referenced by path id, kit_id or supersedes_kit_id exists"
    error_id: ERR_KIT_NOT_FOUND
    http_status: 404
    applies_to: "POST /sharps/kits/{id}/acknowledge-receipt, POST /sharps/kits/{id}/seal, POST /sharps/kits/{id}/void, POST /sharps/kits/{id}/return-labels, GET /sharps/kits/{id}, GET /sharps/kits, GET /sharps/return-labels, GET /sharps/shipments, GET /sharps/destruction-certificates, GET /sharps/ledger-entries"

  - priority: 4
    category: existence
    check: "ReturnLabel referenced by path id or return_label_id exists"
    error_id: ERR_LABEL_NOT_FOUND
    http_status: 404
    applies_to: "POST /sharps/return-labels/{id}/activate, POST /sharps/return-labels/{id}/void, GET /sharps/return-labels/{id}, GET /sharps/shipments"

  - priority: 4
    category: existence
    check: "Shipment referenced by path id or shipment_id exists"
    error_id: ERR_SHIPMENT_NOT_FOUND
    http_status: 404
    applies_to: "POST /sharps/shipments/{id}/transport-events, POST /sharps/shipments/{id}/conformance-screening, POST /sharps/shipments/{id}/destruction-certificates, GET /sharps/shipments/{id}, GET /sharps/shipments/{id}/non-conformance-events, GET /sharps/destruction-certificates"

  - priority: 4
    category: existence
    check: "NonConformanceEvent referenced by path id exists"
    error_id: ERR_NONCONFORMANCE_EVENT_NOT_FOUND
    http_status: 404
    applies_to: "POST /sharps/non-conformance-events/{id}/notify-customer, POST /sharps/non-conformance-events/{id}/remediate"

  - priority: 4
    category: existence
    check: "DestructionCertificate referenced by path id exists"
    error_id: ERR_CERTIFICATE_NOT_FOUND
    http_status: 404
    applies_to: "POST /sharps/destruction-certificates/{id}/void, GET /sharps/destruction-certificates/{id}"

  - priority: 4
    category: existence
    check: "SponsorLedgerEntry referenced by path id exists"
    error_id: ERR_LEDGER_ENTRY_NOT_FOUND
    http_status: 404
    applies_to: "GET /sharps/ledger-entries/{id}"

  - priority: 4
    category: existence
    check: "AutoShipRun referenced by path id or auto_ship_run_id exists"
    error_id: ERR_AUTOSHIP_RUN_NOT_FOUND
    http_status: 404
    applies_to: "GET /sharps/auto-ship-runs/{id}, GET /sharps/kits"

  - priority: 5
    category: business_referential
    check: "when X-User-Role is Patient, X-User-ID must equal the Patient.id that owns the target kit (through Kit -> Enrollment -> Patient); when X-User-Role is SponsorRepresentative, X-User-ID must equal the Sponsor.id that owns the target program (through Enrollment -> SponsorshipProgram -> Sponsor, or directly for program endpoints)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /sharps/kits/{id}/acknowledge-receipt, POST /sharps/kits/{id}/seal, POST /sharps/enrollments/{id}/sponsor-decision, POST /sharps/programs/{id}/funding-adjustments"

  - priority: 6
    category: state
    check: "the target Enrollment is in a state the requested operation allows (submit requires DRAFT; sponsor-decision requires PENDING_SPONSOR_APPROVAL; kit issuance requires ACTIVE)"
    error_id: ERR_INVALID_ENROLLMENT_STATE
    http_status: 409
    applies_to: "POST /sharps/enrollments/{id}/submit, POST /sharps/enrollments/{id}/sponsor-decision, POST /sharps/enrollments/{id}/kits, POST /sharps/kits/{id}/seal (cross-entity guard: the kit's Enrollment must be ACTIVE, so a PAUSED or TERMINATED enrollment blocks the seal before any kit-state or payload-range check below)"

  - priority: 7
    category: state
    check: "the target Patient is in a state the requested operation allows (eligibility-review requires PENDING_ELIGIBILITY; enrollment creation requires ELIGIBLE or ENROLLED; SUSPEND requires ENROLLED; REINSTATE requires SUSPENDED; WITHDRAW requires a non-terminal status)"
    error_id: ERR_INVALID_PATIENT_STATE
    http_status: 409
    applies_to: "POST /sharps/patients/{id}/eligibility-review, POST /sharps/patients/{id}/status-actions, POST /sharps/enrollments"

  - priority: 8
    category: state
    check: "the target Kit is in a state the requested operation allows (acknowledge-receipt requires ISSUED; seal requires ACTIVE_FILLING; label printing requires SEALED; void requires ISSUED or ACTIVE_FILLING)"
    error_id: ERR_INVALID_KIT_STATE
    http_status: 409
    applies_to: "POST /sharps/kits/{id}/acknowledge-receipt, POST /sharps/kits/{id}/seal, POST /sharps/kits/{id}/void, POST /sharps/kits/{id}/return-labels"

  - priority: 9
    category: state
    check: "the target ReturnLabel is in a state the requested operation allows (activate requires PRINTED; manual void requires PRINTED — an ACTIVATED label is voided only by the system cascade of a RETURN_TO_PATIENT remediation or a LOST shipment)"
    error_id: ERR_INVALID_LABEL_STATE
    http_status: 409
    applies_to: "POST /sharps/return-labels/{id}/activate, POST /sharps/return-labels/{id}/void"

  - priority: 10
    category: state
    check: "the requested transport event is legal from the shipment's current transport_status (IN_TRANSIT requires TENDERED; DELIVERED requires IN_TRANSIT; LOST requires TENDERED or IN_TRANSIT); screening requires transport_status DELIVERED"
    error_id: ERR_INVALID_SHIPMENT_STATE
    http_status: 409
    applies_to: "POST /sharps/shipments/{id}/transport-events, POST /sharps/shipments/{id}/conformance-screening"

  - priority: 11
    category: state
    check: "the target NonConformanceEvent is in a state the requested operation allows (notify-customer requires OPEN; remediate requires CUSTOMER_NOTIFIED)"
    error_id: ERR_INVALID_NONCONFORMANCE_STATE
    http_status: 409
    applies_to: "POST /sharps/non-conformance-events/{id}/notify-customer, POST /sharps/non-conformance-events/{id}/remediate"

  - priority: 12
    category: state
    check: "the target DestructionCertificate is ISSUED (an already VOIDED certificate cannot be voided again)"
    error_id: ERR_INVALID_CERTIFICATE_STATE
    http_status: 409
    applies_to: "POST /sharps/destruction-certificates/{id}/void"

  - priority: 13
    category: state
    check: "expected_enrollment_version equals Enrollment.version"
    error_id: ERR_STALE_ENROLLMENT_VERSION
    http_status: 412
    applies_to: "POST /sharps/enrollments/{id}/kits"

  - priority: 13
    category: state
    check: "expected_program_version equals SponsorshipProgram.version"
    error_id: ERR_STALE_PROGRAM_VERSION
    http_status: 412
    applies_to: "POST /sharps/programs/{id}/funding-adjustments"

  # ---- business_safety band (14-17) ----
  - priority: 14
    category: business_safety
    check: "the patient's StateSharpsRule.mail_back_permitted is true — a state that prohibits household-sharps mail-back blocks label activation outright, and this outranks every packaging, routing, capacity, window and funding check"
    error_id: ERR_STATE_MAILBACK_PROHIBITED
    http_status: 422
    applies_to: "POST /sharps/return-labels/{id}/activate"

  - priority: 15
    category: business_safety
    check: "X-User-ID of the DestructionOfficer differs from Shipment.screened_by_user_id (segregation of duties: the technician who screened the shipment may not certify its destruction)"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /sharps/shipments/{id}/destruction-certificates"

  - priority: 16
    category: business_safety
    check: "fill_units <= Kit.capacity_units at seal time (an overfilled sharps container is a needlestick hazard)"
    error_id: ERR_CONTAINER_OVERFILLED
    http_status: 422
    applies_to: "POST /sharps/kits/{id}/seal"

  - priority: 17
    category: business_safety
    check: "the requested remediation_action is legal here: RETURN_TO_PATIENT is forbidden when the patient's StateSharpsRule.household_sharps_classification is REGULATED_MEDICAL_WASTE, and DISPOSE_AS_RMW is forbidden when the receiving facility's accepted_hazard_classes does not include UN3291_REGULATED_MEDICAL_WASTE"
    error_id: ERR_REMEDIATION_NOT_ALLOWED_FOR_STATE
    http_status: 422
    applies_to: "POST /sharps/non-conformance-events/{id}/remediate"

  # ---- business_constraint band (18-31) ----
  - priority: 18
    category: business_constraint
    check: "Kit.container_size appears in PackagingSpec.allowed_container_sizes"
    error_id: ERR_PACKAGING_SPEC_MISMATCH
    http_status: 422
    applies_to: "POST /sharps/kits/{id}/return-labels"

  - priority: 18
    category: business_constraint
    check: "the PackagingSpec.status is ACTIVE (a RETIRED spec may not back a new label)"
    error_id: ERR_PACKAGING_SPEC_RETIRED
    http_status: 422
    applies_to: "POST /sharps/kits/{id}/return-labels"

  - priority: 19
    category: business_constraint
    check: "declared_gross_weight_grams (at activation) and observed_gross_weight_grams (on a CONFORMING screening) are both <= PackagingSpec.max_gross_weight_grams"
    error_id: ERR_POSTAL_WEIGHT_EXCEEDED
    http_status: 422
    applies_to: "POST /sharps/return-labels/{id}/activate, POST /sharps/shipments/{id}/conformance-screening"

  - priority: 20
    category: business_constraint
    check: "absorbent_declared is true when the label's PackagingSpec.requires_absorbent is true"
    error_id: ERR_ABSORBENT_MATERIAL_REQUIRED
    http_status: 422
    applies_to: "POST /sharps/return-labels/{id}/activate"

  - priority: 21
    category: business_constraint
    check: "state_manifest_number is present and non-empty when the patient's StateSharpsRule.requires_state_manifest is true"
    error_id: ERR_STATE_MANIFEST_REQUIRED
    http_status: 422
    applies_to: "POST /sharps/return-labels/{id}/activate"

  - priority: 22
    category: business_constraint
    check: "the chosen TreatmentFacility.accepted_hazard_classes includes the label's PackagingSpec.hazard_class"
    error_id: ERR_FACILITY_NOT_PERMITTED
    http_status: 422
    applies_to: "POST /sharps/return-labels/{id}/activate"

  - priority: 23
    category: business_constraint
    check: "the TreatmentFacility referenced by the operation is in status ACTIVE — cross-entity gate: a SUSPENDED facility can neither be routed new shipments nor certify destruction of shipments it already holds"
    error_id: ERR_INVALID_FACILITY_STATE
    http_status: 409
    applies_to: "POST /sharps/return-labels/{id}/activate, POST /sharps/shipments/{id}/destruction-certificates"

  - priority: 24
    category: business_constraint
    check: "the new label's [valid_from, valid_until] closed instant window does not touch or overlap the window of any PRINTED or ACTIVATED label of the same kit, and no VOIDED label of that kit is still inside its LABEL_VOID_QUARANTINE_HOURS window (§1.3 label_validity_window)"
    error_id: ERR_LABEL_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /sharps/kits/{id}/return-labels"

  - priority: 25
    category: business_constraint
    check: "aggregate booking: SUM of custody_units over TENDERED/IN_TRANSIT shipments already routed to this facility for this exact scheduled_intake_date, plus this shipment's custody_units, is <= TreatmentFacility.daily_intake_capacity_units (§1.3 facility_intake_occupancy)"
    error_id: ERR_FACILITY_INTAKE_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /sharps/return-labels/{id}/activate"

  - priority: 26
    category: business_constraint
    check: "the candidate container-size set of §1.3 container_size_selection is non-empty"
    error_id: ERR_NO_ELIGIBLE_CONTAINER_SIZE
    http_status: 422
    applies_to: "POST /sharps/enrollments/{id}/kits, POST /sharps/auto-ship-runs"

  - priority: 27
    category: business_constraint
    check: "an explicitly requested container_size (request field, else Enrollment.requested_container_size) is a member of the candidate set"
    error_id: ERR_CONTAINER_SIZE_NOT_PERMITTED
    http_status: 422
    applies_to: "POST /sharps/enrollments/{id}/kits, POST /sharps/auto-ship-runs"

  - priority: 28
    category: business_constraint
    check: "Enrollment.kits_issued < Enrollment.kits_authorized, evaluated AFTER any supersede-void of the enrollment's outstanding kit"
    error_id: ERR_KIT_AUTHORIZATION_EXHAUSTED
    http_status: 409
    applies_to: "POST /sharps/enrollments/{id}/kits, POST /sharps/auto-ship-runs"

  - priority: 29
    category: business_constraint
    check: "the shipment's transport_status is DELIVERED and its conformance_status is CONFORMING or REMEDIATED before a destruction certificate may be issued"
    error_id: ERR_DELIVERY_REQUIRED_BEFORE_DESTRUCTION
    http_status: 409
    applies_to: "POST /sharps/shipments/{id}/destruction-certificates"

  - priority: 30
    category: business_constraint
    check: "the shipment has no DestructionCertificate in status ISSUED (a voided certificate does not block re-issuance)"
    error_id: ERR_CERTIFICATE_ALREADY_ISSUED
    http_status: 409
    applies_to: "POST /sharps/shipments/{id}/destruction-certificates"

  - priority: 30
    category: business_constraint
    check: "the shipment's conformance_status is still UNSCREENED (a shipment is screened exactly once; a NON_CONFORMING shipment moves on through remediation, never through a second screening)"
    error_id: ERR_SHIPMENT_ALREADY_SCREENED
    http_status: 409
    applies_to: "POST /sharps/shipments/{id}/conformance-screening"

  - priority: 31
    category: business_constraint
    check: "destroyed_units equals Kit.fill_units exactly (the destruction certificate must reconcile to the sealed count, neither more nor less)"
    error_id: ERR_DESTROYED_UNITS_MISMATCH
    http_status: 422
    applies_to: "POST /sharps/shipments/{id}/destruction-certificates"

  - priority: 31
    category: business_constraint
    check: "state_code is not already used by another StateSharpsRule"
    error_id: ERR_DUPLICATE_STATE_RULE
    http_status: 409
    applies_to: "POST /sharps/state-rules"

  - priority: 31
    category: business_constraint
    check: "spec_code is not already used by another PackagingSpec"
    error_id: ERR_DUPLICATE_SPEC_CODE
    http_status: 409
    applies_to: "POST /sharps/packaging-specs"

  - priority: 31
    category: business_constraint
    check: "permit_number is not already used by another TreatmentFacility"
    error_id: ERR_DUPLICATE_PERMIT_NUMBER
    http_status: 409
    applies_to: "POST /sharps/treatment-facilities"

  - priority: 31
    category: business_constraint
    check: "the patient does not already have an Enrollment in status DRAFT, PENDING_SPONSOR_APPROVAL, ACTIVE or PAUSED against the same sponsorship_program_id"
    error_id: ERR_DUPLICATE_ACTIVE_ENROLLMENT
    http_status: 409
    applies_to: "POST /sharps/enrollments"

  - priority: 31
    category: business_constraint
    check: "the Sponsor owning the program is in status ACTIVE"
    error_id: ERR_SPONSOR_NOT_ACTIVE
    http_status: 422
    applies_to: "POST /sharps/sponsors/{id}/programs, POST /sharps/enrollments"

  # ---- business_temporal band (32-33) ----
  - priority: 32
    category: business_temporal
    check: "the current logical clock instant is <= ReturnLabel.valid_until"
    error_id: ERR_LABEL_EXPIRED
    http_status: 422
    applies_to: "POST /sharps/return-labels/{id}/activate"

  - priority: 33
    category: business_temporal
    check: "the current logical clock instant is <= NonConformanceEvent.notification_deadline_at when recording the customer notification"
    error_id: ERR_NOTIFICATION_DEADLINE_PASSED
    http_status: 422
    applies_to: "POST /sharps/non-conformance-events/{id}/notify-customer"

  # ---- business_fiscal band (34-35), always last ----
  - priority: 34
    category: business_fiscal
    check: "the kit's provisional_cost_cents (§1.3 kit_cost_provisional) is <= SponsorshipProgram.per_kit_allowance_cents — a hard gate at issuance, unlike the silent cap applied at final settlement"
    error_id: ERR_PER_KIT_ALLOWANCE_EXCEEDED
    http_status: 422
    applies_to: "POST /sharps/enrollments/{id}/kits, POST /sharps/auto-ship-runs"

  - priority: 35
    category: business_fiscal
    check: "SponsorshipProgram.available_cents >= the kit's provisional_cost_cents, evaluated AFTER any supersede reservation release in the same request"
    error_id: ERR_PROGRAM_FUNDING_EXHAUSTED
    http_status: 422
    applies_to: "POST /sharps/enrollments/{id}/kits"

  - priority: 35
    category: business_fiscal
    check: "a funding adjustment may not push funding_ceiling_cents below reserved_cents + committed_cents (a sponsor cannot claw back money already reserved or committed)"
    error_id: ERR_FUNDING_BELOW_OBLIGATIONS
    http_status: 422
    applies_to: "POST /sharps/programs/{id}/funding-adjustments"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
# Every business path is nested under api_prefix "/sharps". The single test-driving endpoint
# lives under the "/_" namespace. All list endpoints accept limit?/offset? and return the
# pagination fields declared in §1.0.
endpoints:

  # ---- configuration ------------------------------------------------------
  - method: POST
    path: "/sharps/state-rules"
    description: "Register the household-sharps disposal law of one US state"
    roles: [ProgramAdmin]
    code: 201
    input: [state_code, household_sharps_classification, mail_back_permitted, max_container_volume_liters, certificate_retention_years, "requires_state_manifest?", "notification_deadline_hours?"]
    output: StateSharpsRule
    side_effects: ["none — a pure configuration row that later gates sizing, activation, remediation and retention"]

  - method: POST
    path: "/sharps/packaging-specs"
    description: "Register a DOT/UN-marked mail-back outer packaging specification and the postal service it is accepted on"
    roles: [ProgramAdmin]
    code: 201
    input: [spec_code, un_specification_code, postal_service, hazard_class, max_gross_weight_grams, allowed_container_sizes, "requires_absorbent?", "status?"]
    output: PackagingSpec
    side_effects: ["none"]

  - method: POST
    path: "/sharps/treatment-facilities"
    description: "Register a permitted medical-waste treatment facility with its daily intake capacity"
    roles: [ProgramAdmin]
    code: 201
    input: [name, state_rule_id, permit_number, accepted_hazard_classes, daily_intake_capacity_units, "status?"]
    output: TreatmentFacility
    side_effects: ["initialises pending_intake_units, destroyed_units_total and certificates_issued_count to 0"]

  - method: POST
    path: "/sharps/treatment-facilities/{id}/status-actions"
    description: "Suspend or reinstate a treatment facility (SUSPEND blocks new routing and destruction certification; REINSTATE restores it)"
    roles: [ProgramAdmin]
    code: 200
    input: [action, "reason?"]
    output: TreatmentFacility
    side_effects: ["TreatmentFacility ACTIVE <-> SUSPENDED per §1.2", "shipments already TENDERED or IN_TRANSIT to the facility keep their custody_units booked — suspension never rewrites pending_intake_units"]

  # ---- sponsorship --------------------------------------------------------
  - method: POST
    path: "/sharps/sponsors"
    description: "Register a program sponsor (device manufacturer or health plan)"
    roles: [ProgramAdmin]
    code: 201
    input: [legal_name, sponsor_type, contact_email, "status?"]
    output: Sponsor
    side_effects: ["sponsor_type fixes the destruction rate and the rebate-tier behaviour used by §1.3 kit_cost_final_settlement"]

  - method: POST
    path: "/sharps/sponsors/{id}/status-actions"
    description: "Suspend or reinstate a sponsor (SUSPEND / REINSTATE); a SUSPENDED sponsor may open no new program and take on no new enrollment"
    roles: [ProgramAdmin]
    code: 200
    input: [action, "reason?"]
    output: Sponsor
    side_effects: ["Sponsor ACTIVE <-> SUSPENDED per §1.2", "existing programs, enrollments, kits and ledger balances are untouched — the gate is evaluated only on POST /sharps/sponsors/{id}/programs and POST /sharps/enrollments (§1.4 priority 31)", "increments Sponsor.version by 1"]

  - method: POST
    path: "/sharps/sponsors/{id}/programs"
    description: "Open a funded sponsorship program under a sponsor; sponsor_id comes from the path"
    roles: [ProgramAdmin]
    code: 201
    input: [program_code, funding_ceiling_cents, per_kit_allowance_cents]
    output: SponsorshipProgram
    side_effects: ["sets reserved_cents = 0, committed_cents = 0, available_cents = funding_ceiling_cents, status = ACTIVE (or EXHAUSTED when funding_ceiling_cents == 0)"]

  - method: POST
    path: "/sharps/programs/{id}/funding-adjustments"
    description: "Raise or lower a program's funding ceiling under optimistic concurrency control on the program's version"
    roles: [ProgramAdmin, SponsorRepresentative]
    code: 200
    input: [delta_cents, expected_program_version, "memo?"]
    output: SponsorshipProgram
    side_effects: ["§1.2.1 OCC: expected_program_version must equal SponsorshipProgram.version else ERR_STALE_PROGRAM_VERSION", "funding_ceiling_cents += delta_cents (never below reserved_cents + committed_cents)", "appends a FUNDING_ADJUSTMENT SponsorLedgerEntry with amount_cents = delta_cents (signed as submitted), kit_id = null, memo copied from the request and the three after-balances snapshotted", "recomputes available_cents and flips status EXHAUSTED <-> ACTIVE", "increments SponsorshipProgram.version by 1"]

  # ---- patients and enrollment -------------------------------------------
  - method: POST
    path: "/sharps/patients"
    description: "Enrol a household sharps generator with their therapy type, weekly sharps volume and governing state rule"
    roles: [ProgramAdmin]
    code: 201
    input: [full_name, state_rule_id, therapy_type, weekly_sharps_count, contact_email]
    output: Patient
    side_effects: ["status = PENDING_ELIGIBILITY, screening_risk_score = 0, audit_risk_score = 0"]

  - method: POST
    path: "/sharps/patients/{id}/eligibility-review"
    description: "Record the program's eligibility determination for a patient (branching fork: APPROVE -> ELIGIBLE, DENY -> INELIGIBLE)"
    roles: [ProgramAdmin]
    code: 200
    input: [decision, "note?"]
    output: Patient
    side_effects: ["Patient PENDING_ELIGIBILITY -> ELIGIBLE or -> INELIGIBLE (terminal) per §1.2"]

  - method: POST
    path: "/sharps/patients/{id}/status-actions"
    description: "Suspend, reinstate or withdraw a patient; SUSPEND and WITHDRAW drive the multi-hop cascade of §1.2"
    roles: [ProgramAdmin]
    code: 200
    input: [action, "reason?"]
    output: Patient
    side_effects: ["SUSPEND: ENROLLED -> SUSPENDED, pauses every ACTIVE enrollment, voids their ISSUED kits, releases those reservations and may un-exhaust the program (cascade hops 2-5)", "REINSTATE: SUSPENDED -> ENROLLED and reactivates PAUSED enrollments as immediately due", "WITHDRAW: terminates every non-terminal enrollment, voids only their ISSUED kits with void_reason 'ENROLLMENT_TERMINATED' and releases those reservations — kits already in ACTIVE_FILLING, SEALED, IN_TRANSIT, RECEIVED or RETURNED_TO_PATIENT are physically out in the field and are left untouched"]

  - method: POST
    path: "/sharps/enrollments"
    description: "Create a draft enrollment binding a patient to a sponsorship program with an auto-ship cadence"
    roles: [ProgramAdmin]
    code: 201
    input: [patient_id, sponsorship_program_id, cadence_days, kits_authorized, "requested_container_size?"]
    output: Enrollment
    side_effects: ["status = DRAFT, kits_issued = 0, next_autoship_due_date = null, version = 1"]

  - method: POST
    path: "/sharps/enrollments/{id}/submit"
    description: "Submit a draft enrollment for the sponsor's funding decision"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: Enrollment
    side_effects: ["Enrollment DRAFT -> PENDING_SPONSOR_APPROVAL", "increments Enrollment.version by 1"]

  - method: POST
    path: "/sharps/enrollments/{id}/sponsor-decision"
    description: "The sponsor approves or rejects funding for a submitted enrollment (branching fork with divergent side effects)"
    roles: [SponsorRepresentative]
    code: 200
    input: [decision, "sponsor_decision_note?"]
    output: Enrollment
    side_effects: ["APPROVE: PENDING_SPONSOR_APPROVAL -> ACTIVE, sets activated_at, sets next_autoship_due_date to today, promotes Patient ELIGIBLE -> ENROLLED", "REJECT: PENDING_SPONSOR_APPROVAL -> REJECTED (terminal), leaves Patient.status untouched and appends no ledger entry", "increments Enrollment.version by 1"]

  # ---- kits ---------------------------------------------------------------
  - method: POST
    path: "/sharps/enrollments/{id}/kits"
    description: "Issue (or replace) the enrollment's sharps container kit; the server selects the container size and reserves funding"
    roles: [ProgramAdmin, LogisticsCoordinator]
    code: 201
    input: [expected_enrollment_version, "container_size?"]
    output: Kit
    side_effects: ["§1.2.1 OCC: expected_enrollment_version must equal Enrollment.version else ERR_STALE_ENROLLMENT_VERSION", "STEP 1 supersede-void of the enrollment's outstanding kit with a RESERVATION_RELEASE ledger entry", "STEP 2 container sizing per §1.3 container_size_selection", "STEP 3 RESERVATION ledger entry of +provisional_cost_cents per §1.3 kit_cost_provisional", "STEP 4 recompute program reserved_cents/available_cents/kits_issued_count/status", "STEP 5 advance Enrollment.next_autoship_due_date, kits_issued and version"]

  - method: POST
    path: "/sharps/kits/{id}/acknowledge-receipt"
    description: "The patient confirms physical receipt of the kit, which begins the filling period"
    roles: [Patient, ProgramAdmin]
    code: 200
    input: []
    output: Kit
    side_effects: ["Kit ISSUED -> ACTIVE_FILLING and sets acknowledged_at"]

  - method: POST
    path: "/sharps/kits/{id}/seal"
    description: "The patient seals the filled container, declaring the sharps count and gross weight"
    roles: [Patient, ProgramAdmin]
    code: 200
    input: [fill_units, sealed_gross_weight_grams]
    output: Kit
    side_effects: ["Kit ACTIVE_FILLING -> SEALED with fill_units and sealed_gross_weight_grams", "cross-entity gate: the kit's Enrollment must be ACTIVE - a PAUSED or TERMINATED enrollment blocks the seal with ERR_INVALID_ENROLLMENT_STATE per §1.4 priority 6"]

  - method: POST
    path: "/sharps/kits/{id}/void"
    description: "Administratively void an unshipped kit and release its reservation"
    roles: [ProgramAdmin, LogisticsCoordinator]
    code: 200
    input: [void_reason]
    output: Kit
    side_effects: ["Kit ISSUED or ACTIVE_FILLING -> VOIDED (terminal)", "appends a RESERVATION_RELEASE ledger entry of -provisional_cost_cents and lowers reserved_cents", "recomputes available_cents and flips program EXHAUSTED -> ACTIVE when available_cents > 0", "recomputes Enrollment.kits_issued"]

  # ---- labels and shipments ----------------------------------------------
  - method: POST
    path: "/sharps/kits/{id}/return-labels"
    description: "Print a prepaid DOT-compliant mail-back return label for a sealed kit"
    roles: [LogisticsCoordinator, ProgramAdmin]
    code: 201
    input: [packaging_spec_id]
    output: ReturnLabel
    side_effects: ["mints tracking_number per §1.3 tracking_number_minting", "sets valid_from = now and valid_until = now + LABEL_VALIDITY_DAYS per §1.3 label_validity_window", "rejects a window that touches a live label of the same kit, or a kit still inside a voided label's quarantine"]

  - method: POST
    path: "/sharps/return-labels/{id}/activate"
    description: "Activate the prepaid label: the parcel is tendered to the postal service and routed to a treatment facility, creating the Shipment"
    roles: [LogisticsCoordinator]
    code: 201
    input: [treatment_facility_id, scheduled_intake_date, declared_gross_weight_grams, "state_manifest_number?", "absorbent_declared?"]
    output: Shipment
    side_effects: ["ReturnLabel PRINTED -> ACTIVATED with activated_at", "creates the Shipment with transport_status TENDERED, conformance_status UNSCREENED and custody_units = Kit.fill_units", "the Kit stays SEALED until the first carrier scan (SEALED -> IN_TRANSIT happens on the IN_TRANSIT transport event)", "books custody_units against TreatmentFacility.pending_intake_units per §1.3 facility_intake_occupancy"]

  - method: POST
    path: "/sharps/return-labels/{id}/void"
    description: "Void a printed (not yet activated) return label; voiding starts the kit's label quarantine window"
    roles: [LogisticsCoordinator, ProgramAdmin]
    code: 200
    input: ["void_reason?"]
    output: ReturnLabel
    side_effects: ["ReturnLabel PRINTED -> VOIDED with voided_at = now, starting LABEL_VOID_QUARANTINE_HOURS on the kit"]

  - method: POST
    path: "/sharps/shipments/{id}/transport-events"
    description: "Record a carrier scan on the transport dimension of the shipment (IN_TRANSIT, DELIVERED or LOST)"
    roles: [LogisticsCoordinator]
    code: 200
    input: [event_type]
    output: Shipment
    side_effects: ["advances transport_status only — conformance_status is never touched by a transport event (parallel dimensions)", "DELIVERED sets delivered_at and CASCADES Kit IN_TRANSIT -> RECEIVED; custody_units stay booked against TreatmentFacility.pending_intake_units because the waste is now physically held awaiting destruction", "LOST drives the 4-hop cascade of §1.2: label void, kit void, reservation release plus capacity release, program un-exhaust"]

  - method: POST
    path: "/sharps/shipments/{id}/conformance-screening"
    description: "The intake technician screens the delivered parcel and records conformance or non-conformance"
    roles: [IntakeTechnician]
    code: 200
    input: [outcome, observed_gross_weight_grams, "reason_code?"]
    output: Shipment
    side_effects: ["advances conformance_status only", "records screened_by_user_id from X-User-ID, which later blocks that same operator from certifying destruction", "CONFORMING: recomputes Patient.screening_risk_score", "NON_CONFORMING: opens a NonConformanceEvent with a notification deadline and drives the risk/suspension cascade of §1.2"]

  - method: POST
    path: "/sharps/non-conformance-events/{id}/notify-customer"
    description: "Record the customer notification for a non-conforming shipment before the state's deadline"
    roles: [IntakeTechnician, ProgramAdmin]
    code: 200
    input: [notification_channel]
    output: NonConformanceEvent
    side_effects: ["NonConformanceEvent OPEN -> CUSTOMER_NOTIFIED with notified_at"]

  - method: POST
    path: "/sharps/non-conformance-events/{id}/remediate"
    description: "Resolve a notified non-conformance by choosing a state-legal remediation action"
    roles: [IntakeTechnician, ProgramAdmin]
    code: 200
    input: [remediation_action]
    output: NonConformanceEvent
    side_effects: ["NonConformanceEvent CUSTOMER_NOTIFIED -> RESOLVED", "ON_SITE_REPACK / DISPOSE_AS_RMW: Shipment conformance_status NON_CONFORMING -> REMEDIATED, unlocking destruction certification with a surcharge", "RETURN_TO_PATIENT: Kit RECEIVED -> RETURNED_TO_PATIENT (the patient's next acknowledge-receipt moves it on to ACTIVE_FILLING), voids the label and restores TreatmentFacility.pending_intake_units by exactly custody_units"]

  # ---- destruction --------------------------------------------------------
  - method: POST
    path: "/sharps/shipments/{id}/destruction-certificates"
    description: "Issue the destruction certificate for a delivered, conforming (or remediated) shipment and settle the kit's final cost"
    roles: [DestructionOfficer]
    code: 201
    input: [destroyed_units]
    output: DestructionCertificate
    side_effects: ["segregation of duties: X-User-ID must differ from Shipment.screened_by_user_id", "mints certificate_number and retention_until_date per §1.3", "computes final_kit_cost_cents and rebate_pct_applied per §1.3 kit_cost_final_settlement", "Kit RECEIVED -> DESTROYED", "appends RESERVATION_RELEASE then COMMITMENT ledger entries in that pinned order and recomputes the program totals and status", "increments TreatmentFacility.destroyed_units_total and certificates_issued_count"]

  - method: POST
    path: "/sharps/destruction-certificates/{id}/void"
    description: "Void an issued destruction certificate, reversing the settlement exactly"
    roles: [DestructionOfficer, ProgramAdmin]
    code: 200
    input: [void_reason]
    output: DestructionCertificate
    side_effects: ["DestructionCertificate ISSUED -> VOIDED with voided_at", "Kit DESTROYED -> RECEIVED (the cycle re-opens)", "appends a COMMITMENT_REVERSAL of -final_kit_cost_cents and then a RESERVATION of +Kit.provisional_cost_cents, restoring the pre-certificate reserved/committed/available triple exactly", "decrements TreatmentFacility.destroyed_units_total but NOT certificates_issued_count (numbers are never reused)"]

  # ---- ops run and clock --------------------------------------------------
  - method: POST
    path: "/sharps/auto-ship-runs"
    description: "Run the replacement-container auto-ship checkpoint for all ACTIVE enrollments as of a date"
    roles: [ProgramAdmin]
    code: 201
    input: ["as_of_date?"]
    output: AutoShipRun
    side_effects: ["refreshes BOTH risk variants for every patient with a non-terminal enrollment and never writes Patient.status", "issues replacement kits with supersedes_kit_id and auto_ship_run_id set, per §1.3 autoship_due_evaluation", "records the four skip counters and created_kit_ids", "defaults as_of_date to the current logical clock UTC date when omitted"]

  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint: set the server's logical UTC clock. The clock's startup default is exactly 2026-08-01T00:00:00Z and the server MUST NOT fall back to wall-clock time before this endpoint is called."
    roles: [ProgramAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["all created_at/updated_at values, label windows, notification deadlines, seal deadlines, risk decay ages and auto-ship due dates read from this clock"]

  # ---- reads: configuration ----------------------------------------------
  - method: GET
    path: "/sharps/state-rules/{id}"
    description: "Retrieve one state's household-sharps rule"
    roles: [ProgramAdmin, LogisticsCoordinator, IntakeTechnician, DestructionOfficer, SponsorRepresentative]
    code: 200
    input: []
    output: StateSharpsRule
    side_effects: []

  - method: GET
    path: "/sharps/state-rules"
    description: "List state rules, optionally filtered by state_code"
    roles: [ProgramAdmin, LogisticsCoordinator, IntakeTechnician, DestructionOfficer, SponsorRepresentative]
    code: 200
    input: ["state_code?", "mail_back_permitted?", "limit?", "offset?"]
    output: StateSharpsRule[]
    side_effects: []

  - method: GET
    path: "/sharps/packaging-specs/{id}"
    description: "Retrieve one packaging specification"
    roles: [ProgramAdmin, LogisticsCoordinator, IntakeTechnician]
    code: 200
    input: []
    output: PackagingSpec
    side_effects: []

  - method: GET
    path: "/sharps/packaging-specs"
    description: "List packaging specifications"
    roles: [ProgramAdmin, LogisticsCoordinator, IntakeTechnician]
    code: 200
    input: ["postal_service?", "hazard_class?", "status?", "limit?", "offset?"]
    output: PackagingSpec[]
    side_effects: []

  - method: GET
    path: "/sharps/treatment-facilities/{id}"
    description: "Retrieve one treatment facility with its live pending_intake_units and destruction counters"
    roles: [ProgramAdmin, LogisticsCoordinator, IntakeTechnician, DestructionOfficer]
    code: 200
    input: []
    output: TreatmentFacility
    side_effects: []

  - method: GET
    path: "/sharps/treatment-facilities"
    description: "List treatment facilities; FK reverse-lookup for StateSharpsRule -> TreatmentFacility"
    roles: [ProgramAdmin, LogisticsCoordinator, IntakeTechnician, DestructionOfficer]
    code: 200
    input: ["state_rule_id?", "status?", "limit?", "offset?"]
    output: TreatmentFacility[]
    side_effects: []

  # ---- reads: sponsorship -------------------------------------------------
  - method: GET
    path: "/sharps/sponsors/{id}"
    description: "Retrieve one sponsor"
    roles: [ProgramAdmin, SponsorRepresentative]
    code: 200
    input: []
    output: Sponsor
    side_effects: []

  - method: GET
    path: "/sharps/sponsors"
    description: "List sponsors"
    roles: [ProgramAdmin, SponsorRepresentative]
    code: 200
    input: ["sponsor_type?", "status?", "limit?", "offset?"]
    output: Sponsor[]
    side_effects: []

  - method: GET
    path: "/sharps/sponsors/{id}/programs"
    description: "List the sponsorship programs of one sponsor; FK reverse-lookup for Sponsor -> SponsorshipProgram"
    roles: [ProgramAdmin, SponsorRepresentative]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: SponsorshipProgram[]
    side_effects: []

  - method: GET
    path: "/sharps/programs/{id}"
    description: "Retrieve one sponsorship program with its reserved/committed/available triple, both accounting totals and its ACTIVE/EXHAUSTED status"
    roles: [ProgramAdmin, SponsorRepresentative]
    code: 200
    input: []
    output: SponsorshipProgram
    side_effects: []

  - method: GET
    path: "/sharps/programs"
    description: "List sponsorship programs; alternate FK reverse-lookup for Sponsor -> SponsorshipProgram"
    roles: [ProgramAdmin, SponsorRepresentative]
    code: 200
    input: ["sponsor_id?", "status?", "limit?", "offset?"]
    output: SponsorshipProgram[]
    side_effects: []

  - method: GET
    path: "/sharps/ledger-entries/{id}"
    description: "Retrieve one immutable sponsor ledger entry"
    roles: [ProgramAdmin, SponsorRepresentative]
    code: 200
    input: []
    output: SponsorLedgerEntry
    side_effects: []

  - method: GET
    path: "/sharps/ledger-entries"
    description: "List sponsor ledger entries in sequence_no ASC order; FK reverse-lookup for SponsorshipProgram -> SponsorLedgerEntry and Kit -> SponsorLedgerEntry"
    roles: [ProgramAdmin, SponsorRepresentative]
    code: 200
    input: ["sponsorship_program_id?", "kit_id?", "entry_type?", "limit?", "offset?"]
    output: SponsorLedgerEntry[]
    side_effects: []

  # ---- reads: patients, enrollments, kits ---------------------------------
  - method: GET
    path: "/sharps/patients/{id}"
    description: "Retrieve one patient with both risk-score variants"
    roles: [ProgramAdmin, LogisticsCoordinator, IntakeTechnician, Patient]
    code: 200
    input: []
    output: Patient
    side_effects: []

  - method: GET
    path: "/sharps/patients"
    description: "List patients; FK reverse-lookup for StateSharpsRule -> Patient"
    roles: [ProgramAdmin, LogisticsCoordinator, IntakeTechnician]
    code: 200
    input: ["state_rule_id?", "status?", "limit?", "offset?"]
    output: Patient[]
    side_effects: []

  - method: GET
    path: "/sharps/enrollments/{id}"
    description: "Retrieve one enrollment, including the version an OCC-guarded kit issuance must echo"
    roles: [ProgramAdmin, LogisticsCoordinator, SponsorRepresentative, Patient]
    code: 200
    input: []
    output: Enrollment
    side_effects: []

  - method: GET
    path: "/sharps/enrollments"
    description: "List enrollments; FK reverse-lookup for Patient -> Enrollment and SponsorshipProgram -> Enrollment"
    roles: [ProgramAdmin, LogisticsCoordinator, SponsorRepresentative]
    code: 200
    input: ["patient_id?", "sponsorship_program_id?", "status?", "limit?", "offset?"]
    output: Enrollment[]
    side_effects: []

  - method: GET
    path: "/sharps/kits/{id}"
    description: "Retrieve one kit with its selected container size, required_units and provisional cost"
    roles: [ProgramAdmin, LogisticsCoordinator, IntakeTechnician, DestructionOfficer, Patient]
    code: 200
    input: []
    output: Kit
    side_effects: []

  - method: GET
    path: "/sharps/kits"
    description: "List kits; FK reverse-lookup for Enrollment -> Kit, Kit -> Kit (supersedes chain) and AutoShipRun -> Kit"
    roles: [ProgramAdmin, LogisticsCoordinator, IntakeTechnician, DestructionOfficer]
    code: 200
    input: ["enrollment_id?", "supersedes_kit_id?", "auto_ship_run_id?", "status?", "limit?", "offset?"]
    output: Kit[]
    side_effects: []

  # ---- reads: labels, shipments, non-conformance, certificates -----------
  - method: GET
    path: "/sharps/return-labels/{id}"
    description: "Retrieve one return label with its tracking number and validity window"
    roles: [ProgramAdmin, LogisticsCoordinator, IntakeTechnician, Patient]
    code: 200
    input: []
    output: ReturnLabel
    side_effects: []

  - method: GET
    path: "/sharps/return-labels"
    description: "List return labels; FK reverse-lookup for Kit -> ReturnLabel and PackagingSpec -> ReturnLabel"
    roles: [ProgramAdmin, LogisticsCoordinator, IntakeTechnician]
    code: 200
    input: ["kit_id?", "packaging_spec_id?", "status?", "limit?", "offset?"]
    output: ReturnLabel[]
    side_effects: []

  - method: GET
    path: "/sharps/shipments/{id}"
    description: "Retrieve one shipment showing both independent state dimensions"
    roles: [ProgramAdmin, LogisticsCoordinator, IntakeTechnician, DestructionOfficer]
    code: 200
    input: []
    output: Shipment
    side_effects: []

  - method: GET
    path: "/sharps/shipments"
    description: "List shipments; FK reverse-lookup for Kit -> Shipment, ReturnLabel -> Shipment and TreatmentFacility -> Shipment"
    roles: [ProgramAdmin, LogisticsCoordinator, IntakeTechnician, DestructionOfficer]
    code: 200
    input: ["kit_id?", "return_label_id?", "treatment_facility_id?", "transport_status?", "conformance_status?", "scheduled_intake_date?", "limit?", "offset?"]
    output: Shipment[]
    side_effects: []

  - method: GET
    path: "/sharps/shipments/{id}/non-conformance-events"
    description: "List the non-conformance events opened against one shipment; FK reverse-lookup for Shipment -> NonConformanceEvent"
    roles: [ProgramAdmin, LogisticsCoordinator, IntakeTechnician, DestructionOfficer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: NonConformanceEvent[]
    side_effects: []

  - method: GET
    path: "/sharps/non-conformance-events/{id}"
    description: "Retrieve one non-conformance event with its notification deadline and remediation action"
    roles: [ProgramAdmin, LogisticsCoordinator, IntakeTechnician, DestructionOfficer]
    code: 200
    input: []
    output: NonConformanceEvent
    side_effects: []

  - method: GET
    path: "/sharps/non-conformance-events"
    description: "List non-conformance events; alternate FK reverse-lookup for Shipment -> NonConformanceEvent"
    roles: [ProgramAdmin, LogisticsCoordinator, IntakeTechnician, DestructionOfficer]
    code: 200
    input: ["shipment_id?", "reason_code?", "status?", "limit?", "offset?"]
    output: NonConformanceEvent[]
    side_effects: []

  - method: GET
    path: "/sharps/destruction-certificates/{id}"
    description: "Retrieve one destruction certificate with its retention deadline and final settled cost"
    roles: [ProgramAdmin, DestructionOfficer, SponsorRepresentative, IntakeTechnician]
    code: 200
    input: []
    output: DestructionCertificate
    side_effects: []

  - method: GET
    path: "/sharps/destruction-certificates"
    description: "List destruction certificates; FK reverse-lookup for Shipment -> DestructionCertificate, Kit -> DestructionCertificate and TreatmentFacility -> DestructionCertificate"
    roles: [ProgramAdmin, DestructionOfficer, SponsorRepresentative, IntakeTechnician]
    code: 200
    input: ["shipment_id?", "kit_id?", "treatment_facility_id?", "status?", "limit?", "offset?"]
    output: DestructionCertificate[]
    side_effects: []

  # ---- reads: ops runs ----------------------------------------------------
  - method: GET
    path: "/sharps/auto-ship-runs/{id}"
    description: "Retrieve one auto-ship run with its four skip counters and created_kit_ids"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: AutoShipRun
    side_effects: []

  - method: GET
    path: "/sharps/auto-ship-runs"
    description: "List auto-ship runs in created_at ASC order"
    roles: [ProgramAdmin]
    code: 200
    input: ["as_of_date?", "limit?", "offset?"]
    output: AutoShipRun[]
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:

  # ---- auth ----
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or X-User-Role is not one of the six declared roles"
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "the acting role is not listed in the endpoint's roles"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "a Patient acts on a kit belonging to another patient, or a SponsorRepresentative acts on a program belonging to another sponsor"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the DestructionOfficer's X-User-ID equals Shipment.screened_by_user_id"

  # ---- request shape ----
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing required field, wrong type, unknown enum value, out-of-range integer, malformed date/instant, limit outside 1..100, negative offset, or empty array where non-empty is required"

  # ---- existence ----
  - id: ERR_STATE_RULE_NOT_FOUND
    http: 404
    condition: "state_rule_id (path or body) matches no StateSharpsRule"
  - id: ERR_PACKAGING_SPEC_NOT_FOUND
    http: 404
    condition: "packaging_spec_id matches no PackagingSpec"
  - id: ERR_FACILITY_NOT_FOUND
    http: 404
    condition: "facility id or treatment_facility_id matches no TreatmentFacility"
  - id: ERR_SPONSOR_NOT_FOUND
    http: 404
    condition: "sponsor id matches no Sponsor"
  - id: ERR_PROGRAM_NOT_FOUND
    http: 404
    condition: "program id or sponsorship_program_id matches no SponsorshipProgram"
  - id: ERR_PATIENT_NOT_FOUND
    http: 404
    condition: "patient id or patient_id matches no Patient"
  - id: ERR_ENROLLMENT_NOT_FOUND
    http: 404
    condition: "enrollment id or enrollment_id matches no Enrollment"
  - id: ERR_KIT_NOT_FOUND
    http: 404
    condition: "kit id, kit_id or supersedes_kit_id matches no Kit"
  - id: ERR_LABEL_NOT_FOUND
    http: 404
    condition: "return label id or return_label_id matches no ReturnLabel"
  - id: ERR_SHIPMENT_NOT_FOUND
    http: 404
    condition: "shipment id or shipment_id matches no Shipment"
  - id: ERR_NONCONFORMANCE_EVENT_NOT_FOUND
    http: 404
    condition: "non-conformance event id matches no NonConformanceEvent"
  - id: ERR_CERTIFICATE_NOT_FOUND
    http: 404
    condition: "destruction certificate id matches no DestructionCertificate"
  - id: ERR_LEDGER_ENTRY_NOT_FOUND
    http: 404
    condition: "ledger entry id matches no SponsorLedgerEntry"
  - id: ERR_AUTOSHIP_RUN_NOT_FOUND
    http: 404
    condition: "auto-ship run id or auto_ship_run_id matches no AutoShipRun"

  # ---- state preconditions ----
  - id: ERR_INVALID_ENROLLMENT_STATE
    http: 409
    condition: "the enrollment is not in the state the operation requires (submit needs DRAFT, sponsor-decision needs PENDING_SPONSOR_APPROVAL, kit issuance needs ACTIVE)"
  - id: ERR_INVALID_PATIENT_STATE
    http: 409
    condition: "the patient is not in the state the operation requires (review needs PENDING_ELIGIBILITY, enrollment needs ELIGIBLE or ENROLLED, SUSPEND needs ENROLLED, REINSTATE needs SUSPENDED, WITHDRAW needs a non-terminal status)"
  - id: ERR_INVALID_KIT_STATE
    http: 409
    condition: "the kit is not in the state the operation requires (acknowledge needs ISSUED, seal needs ACTIVE_FILLING, label printing needs SEALED, void needs ISSUED or ACTIVE_FILLING)"
  - id: ERR_INVALID_LABEL_STATE
    http: 409
    condition: "activate on a label that is not PRINTED, or manual void on a label that is not PRINTED (already ACTIVATED or already VOIDED)"
  - id: ERR_INVALID_SHIPMENT_STATE
    http: 409
    condition: "the transport event is illegal from the current transport_status, or screening is attempted before transport_status DELIVERED"
  - id: ERR_INVALID_NONCONFORMANCE_STATE
    http: 409
    condition: "notify-customer on an event that is not OPEN, or remediate on an event that is not CUSTOMER_NOTIFIED"
  - id: ERR_INVALID_CERTIFICATE_STATE
    http: 409
    condition: "void on a DestructionCertificate that is already VOIDED"
  - id: ERR_STALE_ENROLLMENT_VERSION
    http: 412
    condition: "expected_enrollment_version does not equal Enrollment.version (§1.2.1)"
  - id: ERR_STALE_PROGRAM_VERSION
    http: 412
    condition: "expected_program_version does not equal SponsorshipProgram.version (§1.2.1)"

  # ---- business_safety ----
  - id: ERR_STATE_MAILBACK_PROHIBITED
    http: 422
    condition: "the patient's state has mail_back_permitted = false at label activation"
  - id: ERR_CONTAINER_OVERFILLED
    http: 422
    condition: "fill_units at seal exceeds the kit's capacity_units"
  - id: ERR_REMEDIATION_NOT_ALLOWED_FOR_STATE
    http: 422
    condition: "RETURN_TO_PATIENT requested where the state classifies household sharps as REGULATED_MEDICAL_WASTE, or DISPOSE_AS_RMW requested at a facility not permitted for UN3291_REGULATED_MEDICAL_WASTE"

  # ---- business_constraint ----
  - id: ERR_PACKAGING_SPEC_MISMATCH
    http: 422
    condition: "the kit's container_size is not in the chosen PackagingSpec.allowed_container_sizes"
  - id: ERR_PACKAGING_SPEC_RETIRED
    http: 422
    condition: "the chosen PackagingSpec has status RETIRED"
  - id: ERR_POSTAL_WEIGHT_EXCEEDED
    http: 422
    condition: "declared or observed gross weight exceeds PackagingSpec.max_gross_weight_grams"
  - id: ERR_ABSORBENT_MATERIAL_REQUIRED
    http: 422
    condition: "the spec requires absorbent material and absorbent_declared is absent or false at activation"
  - id: ERR_STATE_MANIFEST_REQUIRED
    http: 422
    condition: "the patient's state requires a manifest and state_manifest_number is absent or empty at activation"
  - id: ERR_FACILITY_NOT_PERMITTED
    http: 422
    condition: "the facility's accepted_hazard_classes does not include the packaging spec's hazard_class"
  - id: ERR_INVALID_FACILITY_STATE
    http: 409
    condition: "the TreatmentFacility is SUSPENDED at label activation or at destruction-certificate issuance"
  - id: ERR_LABEL_WINDOW_CONFLICT
    http: 409
    condition: "the new label's closed validity window touches or overlaps a PRINTED/ACTIVATED label of the same kit, or the kit is still inside a voided label's 24-hour quarantine"
  - id: ERR_FACILITY_INTAKE_CAPACITY_EXCEEDED
    http: 409
    condition: "aggregate custody_units already booked at the facility for that scheduled_intake_date plus this shipment's units exceeds daily_intake_capacity_units"
  - id: ERR_NO_ELIGIBLE_CONTAINER_SIZE
    http: 422
    condition: "no catalog size satisfies the state volume cap, the required-units demand and the therapy-specific constraints"
  - id: ERR_CONTAINER_SIZE_NOT_PERMITTED
    http: 422
    condition: "an explicitly requested container_size is not in the eligible candidate set"
  - id: ERR_KIT_AUTHORIZATION_EXHAUSTED
    http: 409
    condition: "Enrollment.kits_issued has reached kits_authorized (evaluated after any supersede void)"
  - id: ERR_DELIVERY_REQUIRED_BEFORE_DESTRUCTION
    http: 409
    condition: "destruction certification attempted before transport_status DELIVERED and conformance_status CONFORMING or REMEDIATED"
  - id: ERR_CERTIFICATE_ALREADY_ISSUED
    http: 409
    condition: "the shipment already carries a DestructionCertificate in status ISSUED"
  - id: ERR_SHIPMENT_ALREADY_SCREENED
    http: 409
    condition: "conformance screening attempted on a shipment whose conformance_status is no longer UNSCREENED"
  - id: ERR_DESTROYED_UNITS_MISMATCH
    http: 422
    condition: "destroyed_units does not equal the kit's fill_units"
  - id: ERR_DUPLICATE_STATE_RULE
    http: 409
    condition: "a StateSharpsRule already exists for that state_code"
  - id: ERR_DUPLICATE_SPEC_CODE
    http: 409
    condition: "a PackagingSpec already exists with that spec_code"
  - id: ERR_DUPLICATE_PERMIT_NUMBER
    http: 409
    condition: "a TreatmentFacility already exists with that permit_number"
  - id: ERR_DUPLICATE_ACTIVE_ENROLLMENT
    http: 409
    condition: "the patient already has a DRAFT, PENDING_SPONSOR_APPROVAL, ACTIVE or PAUSED enrollment in the same program"
  - id: ERR_SPONSOR_NOT_ACTIVE
    http: 422
    condition: "the sponsor owning the program is not in status ACTIVE"

  # ---- business_temporal ----
  - id: ERR_LABEL_EXPIRED
    http: 422
    condition: "activation attempted after ReturnLabel.valid_until"
  - id: ERR_NOTIFICATION_DEADLINE_PASSED
    http: 422
    condition: "customer notification recorded after NonConformanceEvent.notification_deadline_at"

  # ---- business_fiscal ----
  - id: ERR_PER_KIT_ALLOWANCE_EXCEEDED
    http: 422
    condition: "the kit's provisional_cost_cents exceeds SponsorshipProgram.per_kit_allowance_cents at issuance"
  - id: ERR_PROGRAM_FUNDING_EXHAUSTED
    http: 422
    condition: "SponsorshipProgram.available_cents is below the kit's provisional_cost_cents at operator issuance"
  - id: ERR_FUNDING_BELOW_OBLIGATIONS
    http: 422
    condition: "a funding adjustment would push funding_ceiling_cents below reserved_cents + committed_cents"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:

  - name: ProgramAdmin
    description: "Program operator: seeds configuration, manages sponsors, patients and enrollments, issues kits, runs the auto-ship checkpoint and drives the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /sharps/state-rules"
      - "POST /sharps/packaging-specs"
      - "POST /sharps/treatment-facilities"
      - "POST /sharps/treatment-facilities/{id}/status-actions"
      - "POST /sharps/sponsors"
      - "POST /sharps/sponsors/{id}/status-actions"
      - "POST /sharps/sponsors/{id}/programs"
      - "POST /sharps/patients"
      - "POST /sharps/patients/{id}/eligibility-review"
      - "POST /sharps/patients/{id}/status-actions"
      - "POST /sharps/enrollments"
      - "POST /sharps/enrollments/{id}/submit"
      - "POST /sharps/auto-ship-runs"
      - "GET /sharps/auto-ship-runs, GET /sharps/auto-ship-runs/{id}"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /sharps/programs/{id}/funding-adjustments (with SponsorRepresentative)"
      - "POST /sharps/enrollments/{id}/kits (with LogisticsCoordinator)"
      - "POST /sharps/kits/{id}/acknowledge-receipt, POST /sharps/kits/{id}/seal (with Patient)"
      - "POST /sharps/kits/{id}/void, POST /sharps/kits/{id}/return-labels, POST /sharps/return-labels/{id}/void (with LogisticsCoordinator)"
      - "POST /sharps/non-conformance-events/{id}/notify-customer, POST /sharps/non-conformance-events/{id}/remediate (with IntakeTechnician)"
      - "POST /sharps/destruction-certificates/{id}/void (with DestructionOfficer)"
      - "all GET endpoints"

  - name: SponsorRepresentative
    description: "Acts for one sponsor: approves or rejects funding for submitted enrollments and adjusts its programs' funding ceilings"
    identity: "entity_backed:Sponsor"
    exclusive_operations:
      - "POST /sharps/enrollments/{id}/sponsor-decision"
    shared_operations:
      - "POST /sharps/programs/{id}/funding-adjustments (with ProgramAdmin, restricted to its own programs)"
      - "GET /sharps/sponsors/{id}, GET /sharps/sponsors/{id}/programs, GET /sharps/programs, GET /sharps/programs/{id}, GET /sharps/enrollments, GET /sharps/enrollments/{id}, GET /sharps/ledger-entries, GET /sharps/destruction-certificates"

  - name: Patient
    description: "The household sharps generator: confirms receipt of a kit and seals the filled container"
    identity: "entity_backed:Patient"
    exclusive_operations: []
    shared_operations:
      - "POST /sharps/kits/{id}/acknowledge-receipt (with ProgramAdmin, only for its own kits)"
      - "POST /sharps/kits/{id}/seal (with ProgramAdmin, only for its own kits)"
      - "GET /sharps/patients/{id}, GET /sharps/enrollments/{id}, GET /sharps/kits/{id}, GET /sharps/return-labels/{id}"

  - name: LogisticsCoordinator
    description: "Runs the outbound and inbound logistics: issues and voids kits, prints and activates labels, records carrier scans"
    identity: opaque
    exclusive_operations:
      - "POST /sharps/return-labels/{id}/activate"
      - "POST /sharps/shipments/{id}/transport-events"
    shared_operations:
      - "POST /sharps/enrollments/{id}/kits (with ProgramAdmin)"
      - "POST /sharps/kits/{id}/void, POST /sharps/kits/{id}/return-labels, POST /sharps/return-labels/{id}/void (with ProgramAdmin)"
      - "GET endpoints for state rules, specs, facilities, patients, enrollments, kits, labels, shipments and non-conformance events"

  - name: IntakeTechnician
    description: "Facility intake operator: screens delivered parcels for conformance and handles customer notification and remediation. The screener is recorded on the Shipment and is thereby barred from certifying that shipment's destruction."
    identity: opaque
    exclusive_operations:
      - "POST /sharps/shipments/{id}/conformance-screening"
    shared_operations:
      - "POST /sharps/non-conformance-events/{id}/notify-customer, POST /sharps/non-conformance-events/{id}/remediate (with ProgramAdmin)"
      - "GET endpoints for state rules, specs, facilities, patients, kits, labels, shipments, non-conformance events and destruction certificates"

  - name: DestructionOfficer
    description: "Certifies destruction of screened waste and settles the sponsor's final per-kit cost. Segregation of duties: MUST NOT be the same X-User-ID that screened the shipment."
    identity: opaque
    exclusive_operations:
      - "POST /sharps/shipments/{id}/destruction-certificates"
    shared_operations:
      - "POST /sharps/destruction-certificates/{id}/void (with ProgramAdmin)"
      - "GET /sharps/state-rules, GET /sharps/state-rules/{id}, GET /sharps/treatment-facilities, GET /sharps/treatment-facilities/{id}, GET /sharps/kits, GET /sharps/kits/{id}, GET /sharps/shipments, GET /sharps/shipments/{id}, GET /sharps/shipments/{id}/non-conformance-events, GET /sharps/destruction-certificates, GET /sharps/destruction-certificates/{id}"
