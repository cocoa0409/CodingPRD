            - "after setup: Policy.${pol}.status == REFERRED, referral_status == PENDING, referred_by_user_id == uw-1, referral_required == true, total_insured_value_cents == 60000000, sum_of_part_premiums_cents == 2628075 and written_premium_cents == 2733198"
            - "trigger[0] HTTP status == 200"
            - "trigger[0] response Policy.status == DECLINED, referral_status == DECLINED and referral_decided_by_user_id == mgr-1"
            - "trigger[1] response InstallationFloater.${flt}.status == VOIDED, termination_trigger == CANCELLATION and unearned_return_cents == 0"
            - "trigger[2] response Jobsite.${js}.status == RELEASED, active_floater_count == 0, security_score == 3 and security_tier == TIER_2 (the release does not undo the survey)"
            - "after trigger[0]: Policy.${pol}.written_premium_cents == 2733198 and premium_balance_cents == 0 - the DECLINE transition neither re-quotes nor writes any LedgerEntry, so GET /inland-marine/policies/${pol}/ledger-entries returns 0 rows"
            - "after trigger[0]: EquipmentItem.${it1}.status == RATED - the decline cascade stops at the coverage parts and never takes the schedule off risk the way cancellation does"
            - "trigger[3] HTTP status == 409"
            - "trigger[3] response error_id == ERR_POLICY_NOT_BINDABLE - the priority 40 status check fires, NOT the priority 70 ERR_REFERRAL_REQUIRED that this un-approved referral would also fail"
            - "trigger[4] HTTP status == 409"
            - "trigger[4] response error_id == ERR_PART_VOID - and this holds even though ${pol_v1} is now stale by the one bump the setup's own item create produced, because the priority 40 target-part-state check pre-empts the priority 45 ERR_STALE_POLICY_VERSION check"
            - "trigger[5] response: exactly 2 rows, CoveragePart.${cp_sched}.status == VOID with rated_premium_cents == 2557500 and CoveragePart.${cp_flt}.status == VOID with rated_premium_cents == 70575 - VOIDing a part changes its status only and does not zero the stored premium"
            - "an APPROVE decision on the identical setup would leave both parts ACTIVE, the floater PENDING and the jobsite SURVEYED, so every observation above is attributable to the DECLINE branch alone"

      - name: corner_salvage_waived_branch_credits_nothing_and_still_closes
        claim_type: Valid Transition
        grounds:
          - state_machines.Claim.PENDING_to_WAIVED
          - state_machines.Claim.SETTLED_to_CLOSED
          - endpoints[POST /inland-marine/claims/{id}/salvage-recovery]
          - errors[ERR_CLAIM_NOT_SETTLED]
        distinguishing_aspect: |
          salvage_proceeds_cents == 0 is not a no-op and not an error - it is the WAIVED
          branch, which takes the same PENDING exit and the same join to CLOSED as
          RECOVERED while deliberately omitting BOTH of the recovery branch's money
          effects: no SALVAGE_RECOVERY ledger row and no restoration of
          aggregate_available_cents, so the part stays drawn down at 191940000 and
          incurred_loss_cents stays at the full 8060000. WAIVED is terminal, so the
          insured cannot follow a waiver with a recovery.
        test_recipe:
          setup:
            - "Empty database, logical clock at its 2026-08-01T00:00:00Z default."
            - "One IN_FORCE T2_URBAN policy (minimum 100000, written 180251) with one ACTIVE ACV excavator insured at 8160000 on a SCHEDULED_EQUIPMENT part: deductible 100000, per_item_limit 20000000, aggregate 200000000."
            - "One claim on that item, inspected at repair_estimate 7000000 (above the 6120000 constructive-total-loss threshold), adjusted TOTAL_LOSS by adj-1 and SETTLED by mgr-1 for 8060000, so salvage_status is PENDING and aggregate_available_cents is 191940000."
          setup_api_calls:
            - call: "POST /inland-marine/rate-rules"
              payload: { equipment_type: "EXCAVATOR", territory_code: "T2_URBAN", age_band_min_years: 0, age_band_max_years: 5, base_rate_bp: 180, theft_hazard_grade: "A" }
              as: Actuary
              captures: { rr: $.data.id }
            - call: "POST /inland-marine/rate-rules/${rr}/publish"
              payload: {}
              as: Actuary
            - call: "POST /inland-marine/policies"
              payload: { policyholder_name: "Waived Salvage Excavation", territory_code: "T2_URBAN", effective_date: "2026-08-01", expiration_date: "2027-08-01", minimum_premium_cents: 100000 }
              as: Underwriter
              captures: { pol: $.data.id }
            - call: "POST /inland-marine/policies/${pol}/coverage-parts"
              payload: { part_type: "SCHEDULED_EQUIPMENT", valuation_basis: "ACV", rating_basis: "SCHEDULED", deductible_cents: 100000, per_item_limit_cents: 20000000, aggregate_limit_cents: 200000000 }
              as: Underwriter
              captures: { cp: $.data.id }
            - call: "GET /inland-marine/policies/${pol}"
              payload: {}
              as: Underwriter
              captures: { pol_v1: $.data.version }
            - call: "POST /inland-marine/coverage-parts/${cp}/equipment-items"
              payload: { description: "Excavator E1", equipment_type: "EXCAVATOR", model_year: 2022, original_cost_cents: 12000000, ownership: "OWNED", expected_policy_version: "${pol_v1}" }
              as: Underwriter
              captures: { it1: $.data.id }
            - call: "POST /inland-marine/policies/${pol}/quote"
              payload: {}
              as: Underwriter
            - call: "POST /inland-marine/policies/${pol}/bind"
              payload: {}
              as: Underwriter
            - call: "POST /inland-marine/policies/${pol}/activate"
              payload: {}
              as: Underwriter
            - call: "POST /inland-marine/equipment-items/${it1}/activate"
              payload: {}
              as: Underwriter
            - call: "POST /inland-marine/policies/${pol}/claims"
              payload: { coverage_part_id: "${cp}", loss_date: "2026-08-01", loss_type: "FIRE", equipment_item_id: "${it1}" }
              as: Underwriter
              captures: { clm: $.data.id }
            - call: "POST /inland-marine/claims/${clm}/inspect"
              payload: { repair_estimate_cents: 7000000, actual_value_at_loss_cents: 8160000 }
              as: ClaimsAdjuster
              as_user_id: "adj-1"
            - call: "POST /inland-marine/claims/${clm}/adjust"
              payload: { adjustment_basis: "TOTAL_LOSS" }
              as: ClaimsAdjuster
              as_user_id: "adj-1"
            - call: "POST /inland-marine/claims/${clm}/settle"
              payload: {}
              as: UnderwritingManager
              as_user_id: "mgr-1"
          trigger:
            - call: "POST /inland-marine/claims/${clm}/salvage-recovery"
              payload: { salvage_proceeds_cents: 0 }
              as: ClaimsAdjuster
              as_user_id: "adj-1"
            - call: "GET /inland-marine/coverage-parts/${cp}"
              payload: {}
              as: UnderwritingManager
              as_user_id: "mgr-1"
            - call: "GET /inland-marine/claims/${clm}/ledger-entries"
              payload: { limit: 100, offset: 0 }
              as: ClaimsAdjuster
              as_user_id: "adj-1"
            - call: "POST /inland-marine/claims/${clm}/salvage-recovery"
              payload: { salvage_proceeds_cents: 1500000 }
              as: ClaimsAdjuster
              as_user_id: "adj-1"
          assert:
            - "after setup: Claim.${clm}.adjustment_status == SETTLED, salvage_status == PENDING, settlement_paid_cents == 8060000; CoveragePart.${cp}.aggregate_paid_net_cents == 8060000 and aggregate_available_cents == 191940000"
            - "trigger[0] HTTP status == 200"
            - "trigger[0] response Claim.salvage_status == WAIVED, salvage_proceeds_cents == 0, salvage_credit_cents == 0 and adjustment_status == CLOSED - the axes join on the waiver exactly as they do on a recovery"
            - "trigger[1] response CoveragePart.${cp}.aggregate_paid_net_cents == 8060000 and aggregate_available_cents == 191940000 - both unchanged by the waiver, so 200000000 == 191940000 + 8060000 still holds"
            - "after trigger[0]: Policy.${pol}.incurred_loss_cents == 8060000 (no credit), written_premium_cents == 100000 and total_insured_value_cents == 0 - the write-off effects all came from the settle call, none from the waiver"
            - "trigger[2] response: exactly 1 row - CLAIM_SETTLEMENT +8060000 with claim_id ${clm}; the waiver appends NO SALVAGE_RECOVERY row, which is the single observable difference from a 1500000 recovery on the identical setup"
            - "trigger[3] HTTP status == 409"
            - "trigger[3] response error_id == ERR_CLAIM_NOT_SETTLED - WAIVED is terminal on the salvage axis, so a waiver cannot be revised into a recovery even though adjustment_status is CLOSED and the proceeds are now positive"
            - "after trigger[3]: Claim.${clm}.salvage_status == WAIVED, salvage_proceeds_cents == 0 and CoveragePart.${cp}.aggregate_available_cents == 191940000 (the rejected call changed nothing)"
            - "EquipmentItem.${it1}.status == TOTALED throughout: the waiver does not put the wreck back on risk"

  # =========================================================================
  # Calculations
  # =========================================================================
  - section: calculations
    instances:

      - name: corner_jobsite_security_tier_weighted_scoring
        claim_type: Correct Result
        grounds:
          - calculations.jobsite_security_tier
          - endpoints[POST /inland-marine/jobsites/{id}/security-survey]
          - entities.Jobsite.security_score
          - entities.Jobsite.security_tier
        distinguishing_aspect: |
          Four jobsites surveyed with four different control sets prove the guard is
          worth two points and that all three cutoffs are inclusive: no controls
          scores 0 -> TIER_0, the guard ALONE scores 2 -> TIER_1, three unweighted
          controls without the guard score 3 -> TIER_2, and only the full set scores
          5 -> TIER_3.
        test_recipe:
          setup:
            - "Four UNSURVEYED Jobsites in T2_URBAN, no policy or coverage part required."
          setup_api_calls:
            - call: "POST /inland-marine/jobsites"
              payload: { name: "Bare Lot", territory_code: "T2_URBAN" }
              as: Underwriter
              captures: { js0: $.data.id }
            - call: "POST /inland-marine/jobsites"
              payload: { name: "Guard Only", territory_code: "T2_URBAN" }
              as: Underwriter
              captures: { js1: $.data.id }
            - call: "POST /inland-marine/jobsites"
              payload: { name: "Three Controls", territory_code: "T2_URBAN" }
              as: Underwriter
              captures: { js2: $.data.id }
            - call: "POST /inland-marine/jobsites"
              payload: { name: "Full Controls", territory_code: "T2_URBAN" }
              as: Underwriter
              captures: { js3: $.data.id }
          trigger:
            - call: "POST /inland-marine/jobsites/${js0}/security-survey"
              payload: { fenced: false, lighting: false, alarm_monitored: false, guarded_24h: false }
              as: Underwriter
            - call: "POST /inland-marine/jobsites/${js1}/security-survey"
              payload: { fenced: false, lighting: false, alarm_monitored: false, guarded_24h: true }
              as: Underwriter
            - call: "POST /inland-marine/jobsites/${js2}/security-survey"
              payload: { fenced: true, lighting: true, alarm_monitored: true, guarded_24h: false }
              as: Underwriter
            - call: "POST /inland-marine/jobsites/${js3}/security-survey"
              payload: { fenced: true, lighting: true, alarm_monitored: true, guarded_24h: true }
              as: Underwriter
          assert:
            - "after setup: every jobsite has security_score == 0, security_tier == TIER_0, status == UNSURVEYED and surveyed_at is null"
            - "trigger[0] HTTP status == 200"
            - "after trigger[0]: Jobsite.${js0}.security_score == 0 and security_tier == TIER_0 and status == SURVEYED"
            - "after trigger[1]: Jobsite.${js1}.security_score == 2 and security_tier == TIER_1"
            - "after trigger[2]: Jobsite.${js2}.security_score == 3 and security_tier == TIER_2"
            - "after trigger[3]: Jobsite.${js3}.security_score == 5 and security_tier == TIER_3"
            - "after trigger[3]: Jobsite.${js3}.surveyed_at == 2026-08-01T00:00:00Z and active_floater_count == 0"
            - "the guarded-only site (score 2) and the three-control site (score 3) differ by one point yet land in different tiers, proving TIER_2_MIN_SCORE == 3 is inclusive"

      - name: corner_rate_rule_selection_ignores_draft_and_honours_age_band
        claim_type: Input Set Filtering
        grounds:
          - calculations.rate_rule_selection
          - validations[priority=62]
          - errors[ERR_NO_PUBLISHED_RATE_RULE]
          - endpoints[POST /inland-marine/rate-rules/{id}/publish]
          - endpoints[POST /inland-marine/coverage-parts/{id}/equipment-items]
        distinguishing_aspect: |
          The rating input set is PUBLISHED rate cells only: with an exactly matching
          DRAFT cell for age band 0-5 and a PUBLISHED cell for age band 6-12 on file,
          creating an age-2 EXCAVATOR is rejected with ERR_NO_PUBLISHED_RATE_RULE
          (the matching cell is invisible and the published cell is out of band);
          publishing the same cell makes the byte-identical create succeed and stamp
          applied_base_rate_bp 180.
        test_recipe:
          setup:
            - "One DRAFT RateRule: EXCAVATOR, T2_URBAN, age band 0-5, base_rate_bp 180, theft_hazard_grade A."
            - "One PUBLISHED RateRule: EXCAVATOR, T2_URBAN, age band 6-12, base_rate_bp 150, theft_hazard_grade B."
            - "One DRAFT Policy in T2_URBAN, 2026-08-01 to 2027-08-01, minimum_premium_cents 50000."
            - "One ACTIVE SCHEDULED_EQUIPMENT CoveragePart, valuation_basis ACV, per_item_limit_cents 20000000, aggregate_limit_cents 200000000."
            - "Logical clock at the default 2026-08-01T00:00:00Z, so a model_year 2024 unit is age 2."
          setup_api_calls:
            - call: "POST /inland-marine/rate-rules"
              payload: { equipment_type: "EXCAVATOR", territory_code: "T2_URBAN", age_band_min_years: 0, age_band_max_years: 5, base_rate_bp: 180, theft_hazard_grade: "A" }
              as: Actuary
              captures: { rr_draft: $.data.id }
            - call: "POST /inland-marine/rate-rules"
              payload: { equipment_type: "EXCAVATOR", territory_code: "T2_URBAN", age_band_min_years: 6, age_band_max_years: 12, base_rate_bp: 150, theft_hazard_grade: "B" }
              as: Actuary
              captures: { rr_old: $.data.id }
            - call: "POST /inland-marine/rate-rules/${rr_old}/publish"
              payload: {}
              as: Actuary
            - call: "POST /inland-marine/policies"
              payload: { policyholder_name: "Draft Cell Contracting", territory_code: "T2_URBAN", effective_date: "2026-08-01", expiration_date: "2027-08-01", minimum_premium_cents: 50000 }
              as: Underwriter
              captures: { pol: $.data.id }
            - call: "POST /inland-marine/policies/${pol}/coverage-parts"
              payload: { part_type: "SCHEDULED_EQUIPMENT", valuation_basis: "ACV", per_item_limit_cents: 20000000, aggregate_limit_cents: 200000000 }
              as: Underwriter
              captures: { cp: $.data.id }
            - call: "GET /inland-marine/policies/${pol}"
              payload: {}
              as: Underwriter
              captures: { pol_v1: $.data.version }
          trigger:
            - call: "POST /inland-marine/coverage-parts/${cp}/equipment-items"
              payload: { description: "Mini excavator", equipment_type: "EXCAVATOR", model_year: 2024, original_cost_cents: 1000000, ownership: "OWNED", expected_policy_version: "${pol_v1}" }
              as: Underwriter
            - call: "POST /inland-marine/rate-rules/${rr_draft}/publish"
              payload: {}
              as: Actuary
            - call: "POST /inland-marine/coverage-parts/${cp}/equipment-items"
              payload: { description: "Mini excavator", equipment_type: "EXCAVATOR", model_year: 2024, original_cost_cents: 1000000, ownership: "OWNED", expected_policy_version: "${pol_v1}" }
              as: Underwriter
              captures: { itm: $.data.id }
          assert:
            - "trigger[0] HTTP status == 422"
            - "trigger[0] response error_id == ERR_NO_PUBLISHED_RATE_RULE"
            - "after trigger[0]: CoveragePart.${cp}.rated_premium_cents == 0 and the part has zero EquipmentItem children"
            - "after trigger[0]: the owning Policy's version is unchanged, so the retry in trigger[2] may reuse ${pol_v1}"
            - "after trigger[1]: RateRule.${rr_draft}.status == PUBLISHED and published_at == 2026-08-01T00:00:00Z"
            - "trigger[2] HTTP status == 201"
            - "after trigger[2]: EquipmentItem.${itm}.applied_rate_rule_id == ${rr_draft} (NOT ${rr_old})"
            - "after trigger[2]: EquipmentItem.${itm}.age_years_at_rating == 2 and applied_base_rate_bp == 180"
            - "after trigger[2]: EquipmentItem.${itm}.insured_value_cents == 840000 and rated_premium_cents == 17842"
            - "after trigger[2]: CoveragePart.${cp}.rated_premium_cents == 17842"

      - name: corner_equipment_insured_value_depreciation_floor
        claim_type: Correct Result
        grounds:
          - calculations.equipment_insured_value
          - calculations.rate_rule_selection
          - calculations.coverage_part_equipment_premium
          - calculations.policy_written_premium
          - endpoints[POST /inland-marine/coverage-parts/{id}/equipment-items]
        distinguishing_aspect: |
          Three units with the SAME original_cost_cents 4000000 and three model years
          separate the linear part of the ACV decay from its floor: age 5 retains
          6000 bp (2400000), age 10 retains exactly 2000 bp (800000) and age 11 would
          retain -800 bp but is floored to the same 800000, so the age-10 and age-11
          units carry byte-identical insured values and premiums.
        test_recipe:
          setup:
            - "Two PUBLISHED RateRules for EXCAVATOR / T2_URBAN: age band 0-5 at base_rate_bp 180 grade A, and age band 6-30 at base_rate_bp 150 grade B."
            - "One DRAFT Policy in T2_URBAN, 2026-08-01 to 2027-08-01, minimum_premium_cents 50000."
            - "One ACTIVE SCHEDULED_EQUIPMENT CoveragePart, valuation_basis ACV, per_item_limit_cents 20000000, aggregate_limit_cents 200000000."
            - "Logical clock at 2026-08-01T00:00:00Z, so model years 2021 / 2016 / 2015 are ages 5 / 10 / 11."
          setup_api_calls:
            - call: "POST /inland-marine/rate-rules"
              payload: { equipment_type: "EXCAVATOR", territory_code: "T2_URBAN", age_band_min_years: 0, age_band_max_years: 5, base_rate_bp: 180, theft_hazard_grade: "A" }
              as: Actuary
              captures: { rr_new: $.data.id }
            - call: "POST /inland-marine/rate-rules/${rr_new}/publish"
              payload: {}
              as: Actuary
            - call: "POST /inland-marine/rate-rules"
              payload: { equipment_type: "EXCAVATOR", territory_code: "T2_URBAN", age_band_min_years: 6, age_band_max_years: 30, base_rate_bp: 150, theft_hazard_grade: "B" }
              as: Actuary
              captures: { rr_old: $.data.id }
            - call: "POST /inland-marine/rate-rules/${rr_old}/publish"
              payload: {}
              as: Actuary
            - call: "POST /inland-marine/policies"
              payload: { policyholder_name: "Decay Fleet Services", territory_code: "T2_URBAN", effective_date: "2026-08-01", expiration_date: "2027-08-01", minimum_premium_cents: 50000 }
              as: Underwriter
              captures: { pol: $.data.id }
            - call: "POST /inland-marine/policies/${pol}/coverage-parts"
              payload: { part_type: "SCHEDULED_EQUIPMENT", valuation_basis: "ACV", per_item_limit_cents: 20000000, aggregate_limit_cents: 200000000 }
              as: Underwriter
              captures: { cp: $.data.id }
          trigger:
            - call: "GET /inland-marine/policies/${pol}"
              payload: {}
              as: Underwriter
              captures: { pol_v1: $.data.version }
            - call: "POST /inland-marine/coverage-parts/${cp}/equipment-items"
              payload: { description: "Excavator age 5", equipment_type: "EXCAVATOR", model_year: 2021, original_cost_cents: 4000000, ownership: "OWNED", expected_policy_version: "${pol_v1}" }
              as: Underwriter
              captures: { i5: $.data.id }
            - call: "GET /inland-marine/policies/${pol}"
              payload: {}
              as: Underwriter
              captures: { pol_v2: $.data.version }
            - call: "POST /inland-marine/coverage-parts/${cp}/equipment-items"
              payload: { description: "Excavator age 10", equipment_type: "EXCAVATOR", model_year: 2016, original_cost_cents: 4000000, ownership: "OWNED", expected_policy_version: "${pol_v2}" }
              as: Underwriter
              captures: { i10: $.data.id }
            - call: "GET /inland-marine/policies/${pol}"
              payload: {}
              as: Underwriter
              captures: { pol_v3: $.data.version }
            - call: "POST /inland-marine/coverage-parts/${cp}/equipment-items"
              payload: { description: "Excavator age 11", equipment_type: "EXCAVATOR", model_year: 2015, original_cost_cents: 4000000, ownership: "OWNED", expected_policy_version: "${pol_v3}" }
              as: Underwriter
              captures: { i11: $.data.id }
            - call: "POST /inland-marine/policies/${pol}/quote"
              payload: {}
              as: Underwriter
          assert:
            - "after trigger[1]: EquipmentItem.${i5}.age_years_at_rating == 5 and applied_rate_rule_id == ${rr_new}"
            - "after trigger[1]: EquipmentItem.${i5}.insured_value_cents == 2400000 and rated_premium_cents == 50976"
            - "after trigger[3]: EquipmentItem.${i10}.age_years_at_rating == 10 and applied_rate_rule_id == ${rr_old}"
            - "after trigger[3]: EquipmentItem.${i10}.insured_value_cents == 800000 and rated_premium_cents == 13200"
            - "after trigger[5]: EquipmentItem.${i11}.age_years_at_rating == 11 and applied_rate_rule_id == ${rr_old}"
            - "after trigger[5]: EquipmentItem.${i11}.insured_value_cents == 800000 and rated_premium_cents == 13200"
            - "after trigger[5]: CoveragePart.${cp}.rated_premium_cents == 77376"
            - "trigger[6] HTTP status == 200"
            - "after trigger[6]: Policy.${pol}.sum_of_part_premiums_cents == 77376 and written_premium_cents == 80471"
            - "after trigger[6]: Policy.${pol}.total_insured_value_cents == 4000000 and referral_required == false"
            - "the age-10 unit sits exactly ON the floor (10 * 800 == 8000 -> retained 2000) and the age-11 unit is clamped to it, so both retain 800000 from the same 4000000 cost"

      - name: corner_valuation_basis_four_branches_diverge_on_one_cost
        claim_type: Correct Result
        grounds:
          - calculations.equipment_insured_value
          - calculations.equipment_item_premium
          - entities.EquipmentItem.valuation_basis
          - entities.CoveragePart.valuation_basis
          - endpoints[POST /inland-marine/coverage-parts/{id}/equipment-items]
        distinguishing_aspect: |
          All four valuation branches run against a single ACV part: AGREED_VALUE takes
          stated_value_cents 60000000 untouched by age or index, REPLACEMENT_COST
          indexes 4000000 up to 4400000, STATED_AMOUNT takes min(3500000, 4400000)
          == 3500000, and the item that omits valuation_basis inherits the part's ACV
          and depreciates the same 4000000 down to 800000 - four different insured
          values from two distinct original costs.
        test_recipe:
          setup:
            - "One PUBLISHED RateRule: CRANE, T2_URBAN, age band 0-5, base_rate_bp 310, theft_hazard_grade B."
            - "One PUBLISHED RateRule: LOADER, T2_URBAN, age band 6-12, base_rate_bp 205, theft_hazard_grade B, replacement_cost_index_bp 11000."
            - "One DRAFT Policy in T2_URBAN, 2026-08-01 to 2027-08-01, minimum_premium_cents 50000."
            - "One ACTIVE SCHEDULED_EQUIPMENT CoveragePart, valuation_basis ACV, per_item_limit_cents 100000000, aggregate_limit_cents 200000000."
            - "Logical clock at 2026-08-01T00:00:00Z, so model_year 2024 is age 2 and model_year 2016 is age 10."
          setup_api_calls:
            - call: "POST /inland-marine/rate-rules"
              payload: { equipment_type: "CRANE", territory_code: "T2_URBAN", age_band_min_years: 0, age_band_max_years: 5, base_rate_bp: 310, theft_hazard_grade: "B" }
              as: Actuary
              captures: { rr_crane: $.data.id }
            - call: "POST /inland-marine/rate-rules/${rr_crane}/publish"
              payload: {}
              as: Actuary
            - call: "POST /inland-marine/rate-rules"
              payload: { equipment_type: "LOADER", territory_code: "T2_URBAN", age_band_min_years: 6, age_band_max_years: 12, base_rate_bp: 205, theft_hazard_grade: "B", replacement_cost_index_bp: 11000 }
              as: Actuary
              captures: { rr_loader: $.data.id }
            - call: "POST /inland-marine/rate-rules/${rr_loader}/publish"
              payload: {}
              as: Actuary
            - call: "POST /inland-marine/policies"
              payload: { policyholder_name: "Four Basis Rigging", territory_code: "T2_URBAN", effective_date: "2026-08-01", expiration_date: "2027-08-01", minimum_premium_cents: 50000 }
              as: Underwriter
              captures: { pol: $.data.id }
            - call: "POST /inland-marine/policies/${pol}/coverage-parts"
              payload: { part_type: "SCHEDULED_EQUIPMENT", valuation_basis: "ACV", per_item_limit_cents: 100000000, aggregate_limit_cents: 200000000 }
              as: Underwriter
              captures: { cp: $.data.id }
          trigger:
            - call: "GET /inland-marine/policies/${pol}"
              payload: {}
              as: Underwriter
              captures: { pol_v1: $.data.version }
            - call: "POST /inland-marine/coverage-parts/${cp}/equipment-items"
              payload: { description: "Tower crane on agreed value", equipment_type: "CRANE", model_year: 2024, original_cost_cents: 30000000, ownership: "OWNED", valuation_basis: "AGREED_VALUE", stated_value_cents: 60000000, expected_policy_version: "${pol_v1}" }
