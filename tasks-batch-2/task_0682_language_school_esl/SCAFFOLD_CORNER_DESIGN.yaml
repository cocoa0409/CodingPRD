          - errors[ERR_NOT_FULL_COURSE_OF_STUDY]
        distinguishing_aspect: "International INITIAL student with a single 9-hour ENROLLED cohort (sum 9 < 18) is blocked on activate-status with ERR_NOT_FULL_COURSE_OF_STUDY; PLACEMENT_PENDING/WAITLISTED hours are excluded."
        test_recipe:
          setup: ["International student I-20 issued, ENROLLED into one 9-weekly-hour cohort only."]
          setup_api_calls:
