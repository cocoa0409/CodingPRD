            - { call: "POST /psm/moc-requests/${m_id}/mark-implemented", payload: {}, as: Requester, as_user_id: "${req_id}" }
            - { call: "GET /psm/moc-requests/${m_id}", as: PsmManager, captures: { m_v: $.data.version } }
            - { call: "POST /psm/moc-requests/${m_id}/pssrs", payload: { field_window_start: "2026-05-01", field_window_end: "2026-05-05", expected_moc_version: "${m_v}" }, as: PssrLead, as_user_id: "${lead_id}", captures: { p_id: $.data.id } }
            - { call: "POST /psm/pssrs/${p_id}/begin-fieldwork", payload: {}, as: PssrLead, as_user_id: "${lead_id}" }
            - { call: "POST /psm/pssrs/${p_id}/approve", payload: {}, as: PssrLead, as_user_id: "${lead_id}" }
