      - name: case_assess_before_respond_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.ServiceCase.RESPONDED_to_APPROVED
          - state_machines.ServiceCase.RESPONDED_to_DENIED
          - validations.priority_23_ERR_INVALID_CASE_STATE
        distinguishing_aspect: |
          The response commitment cannot be skipped on the way to an assessment:
          an OPEN case refuses assess with 409 even though every other
          precondition (contract ACTIVE, replaceable module present) holds. The
          recipe then walks the DENY fork, which must write denial_reason, zero
          the credit, null the assessment_basis and pin NO module — the mirror
          image of the APPROVE fork's side-effect set.
        test_recipe:
          setup:
            - "An FP10-IN 1x1 project is COMMISSIONED; GOLD contract ${sc} is ACTIVE (response_hours 8); case ${case} is OPEN for MODULE_FAULT on module ${m1} with severity MAJOR, reported at 2026-08-05T10:00:00.000Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: PlantAdmin
