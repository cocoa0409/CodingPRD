              captures: { s13: $.data.id, s13v: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-08T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /bookings"
              payload: { spot_id: "${s13}", driver_id: "${d13}", rate_kind: "HOURLY", start_at: "2026-04-09T10:00:00Z", end_at: "2026-04-09T11:00:00Z", expected_spot_version: "${s13v}" }
              as: Driver
              as_user_id: "${d13}"
              captures: { b13b: $.data.id }
            - call: "POST /violations"
              payload: { booking_id: "${b13b}", violation_kind: "NO_SHOW", base_points: 4 }
              as: Host
              as_user_id: "${h13}"
              captures: { vr13: $.data.id }
            - call: "POST /violations/${vr13}/confirm"
              payload: {}
              as: PlatformAdmin
            - call: "GET /spots/${s13}"
              payload: {}
              as: Host
              as_user_id: "${h13}"
              captures: { s13v2: $.data.version }
          trigger:
            - call: "POST /bookings"
