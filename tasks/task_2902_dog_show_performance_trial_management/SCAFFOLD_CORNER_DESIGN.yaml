      - name: temperature_reading_on_a_draft_show_returns_invalid_state
        claim_type: conditional_action
        grounds:
          - state_machines.Show.APPROVED_to_APPROVED
          - state_machines.Show.IN_PROGRESS_to_IN_PROGRESS
          - validations.priority_8
          - errors.ERR_INVALID_STATE
          - endpoints[POST /dog-shows/shows/{id}/temperature-readings]
        distinguishing_aspect: "Temperature logging is a self-loop declared only on APPROVED and IN_PROGRESS, so on a DRAFT show the identical body is refused with the generic ERR_INVALID_STATE and the heat fields must stay untouched - null level, null index, zero readings."
        test_recipe:
          setup:
            - "Show Autumn Classic (${show_id}) was created but never submitted, so it is still DRAFT with temperature_reading_count 0 and current_advisory_level null."
            - "The reading itself is well formed: 29.0 C at 65 percent humidity, which would compute a heat index of 32.0 and a RED advisory on an APPROVED show."
            - "The caller is a ShowSecretary, the only role the endpoint admits."
          setup_api_calls:
            - call: "POST /dog-shows/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: SanctionOfficer
              as_user_id: "so-alpha"
