          assert:
            - "second create while SUBMITTED: ERR_DUPLICATE_ACTIVE_CLEARANCE (409)"
            - "third create while CLEARED: ERR_DUPLICATE_ACTIVE_CLEARANCE (409) — CLEARED is non-terminal for this invariant"

