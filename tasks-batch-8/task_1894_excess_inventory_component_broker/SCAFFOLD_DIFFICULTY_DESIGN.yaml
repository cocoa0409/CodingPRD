            - call: "POST /buy-offers"
              payload: { seller_id: "${s10_id}", mpn: "ATmega328P", quantity: 10, ask_price_per_unit_cents: 8000, provenance_doc_url: "https://docs.x.com/p10.pdf" }
              as: Seller
              as_user_id: "${s10_id}"
              captures: { o10_id: $.data.id }
            - call: "POST /buy-offers/${o10_id}/accept"
              payload: { agreed_unit_price_cents: 8000, acquisition_mode: "BROKER_OWNED" }
