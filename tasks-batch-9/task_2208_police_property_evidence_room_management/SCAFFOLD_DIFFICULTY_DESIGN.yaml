  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: appraised_value_exactly_500000_requires_high_value_vault
        grounds:
          - "calculations.required_storage_category"
          - "entities.EvidenceItem.fields.required_storage_category"
          - "validations[priority=17]"
          - "errors[ERR_STORAGE_CATEGORY_MISMATCH]"
        distinguishing_aspect: |
          Metric APPRAISED_VALUE_CENTS at the inclusive HIGH_VALUE_THRESHOLD_CENTS boundary, observed on
          POST /evidence-items: 499999 yields required_storage_category GENERAL while exactly 500000
          yields HIGH_VALUE_VAULT, so a strict `>` comparison misclassifies the boundary item.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z with the canonical room, locations G-01 and V-01, and case 26-00001."
          setup_api_calls:
            - *k_clock
            - *k_room
            - *k_stat_th3
            - *k_stat_ab1
            - *k_loc_g
            - *k_loc_v
            - *k_loc_r
            - *k_loc_r2
            - *k_loc_y
            - *k_tech
            - *k_tech2
            - *k_lab
            - *k_inv
            - *k_aud
            - *k_case1
            - *k_case2
          trigger:
            - call: "POST /evidence-items"
              payload: { case_id: "${case1_id}", item_description: "Coin album just under threshold", category: "GENERAL", packaging_type: "RIGID_BOX", appraised_value_cents: 499999, seized_at: "2026-07-31T15:00:00Z" }
              as: EvidenceTechnician
              as_user_id: "${tech_id}"
              captures: { low_id: $.data.id, low_cat: $.data.required_storage_category }
            - call: "POST /evidence-items"
              payload: { case_id: "${case1_id}", item_description: "Coin album at threshold", category: "GENERAL", packaging_type: "RIGID_BOX", appraised_value_cents: 500000, seized_at: "2026-07-31T15:10:00Z" }
              as: EvidenceTechnician
              as_user_id: "${tech_id}"
              captures: { at_id: $.data.id, at_cat: $.data.required_storage_category }
            - call: "POST /evidence-items/${low_id}/storage-assignment"
              payload: { storage_location_id: "${loc_g_id}" }
              as: EvidenceTechnician
              as_user_id: "${tech_id}"
            - call: "POST /evidence-items/${at_id}/storage-assignment"
              payload: { storage_location_id: "${loc_v_id}" }
              as: EvidenceTechnician
              as_user_id: "${tech_id}"
          assert:
            - "${low_cat} == 'GENERAL' for appraised_value_cents == 499999"
            - "${at_cat} == 'HIGH_VALUE_VAULT' for appraised_value_cents == 500000 (threshold is inclusive)"
            - "EvidenceItem.${low_id}.storage_location_id == ${loc_g_id} and custody_state == 'STORED'"
            - "EvidenceItem.${at_id}.storage_location_id == ${loc_v_id} and custody_state == 'STORED'"
            - "StorageLocation.${loc_g_id}.occupied_slots == 1 and StorageLocation.${loc_v_id}.occupied_slots == 1"
            - "Assigning ${at_id} to ${loc_g_id} instead would return HTTP 409 ERR_STORAGE_CATEGORY_MISMATCH"

      - name: reconcile_with_zero_expected_items_yields_zero_risk_index
        grounds:
          - "calculations.audit_risk_index"
          - "entities.AuditSession.fields.expected_item_count"
          - "entities.AuditSession.fields.risk_index"
          - "state_machines.AuditSession.IN_PROGRESS_to_RECONCILED"
          - "state_machines.StorageLocation.SEALED_FOR_AUDIT_to_OPEN"
        distinguishing_aspect: |
          Metric EXPECTED_ITEM_COUNT at its empty-set boundary of 0, observed on
          POST /audit-sessions/{sessionId}/reconcile: an audit of a location holding no STORED item
          must produce risk_index exactly 0.00 with zero discrepancies and must still leave the room
          RESTRICTED because the seal is held, rather than dividing by an empty weight set or reporting
          an OPEN posture.
        test_recipe:
          setup:
            - "Location R-02 exists and holds no evidence item at all."
            - "An audit session on R-02 is scheduled and started."
          setup_api_calls:
            - *k_clock
            - *k_room
            - *k_stat_th3
            - *k_stat_ab1
            - *k_loc_g
            - *k_loc_v
            - *k_loc_r
            - *k_loc_r2
            - *k_loc_y
            - *k_tech
            - *k_tech2
            - *k_lab
            - *k_inv
            - *k_aud
            - *k_case1
            - *k_case2
            - call: "POST /audit-sessions"
              payload: { storage_location_id: "${loc_r2_id}", auditor_id: "${aud_id}", scheduled_start_at: "2026-08-08T09:00:00Z", scheduled_end_at: "2026-08-08T17:00:00Z", expected_storage_location_version: "${loc_r2_v}" }
              as: InternalAuditor
              as_user_id: "${aud_id}"
              captures: { sess_id: $.data.id }
            - call: "POST /audit-sessions/${sess_id}/start"
              payload: {}
              as: InternalAuditor
              as_user_id: "${aud_id}"
          trigger:
            - call: "POST /audit-sessions/${sess_id}/reconcile"
              payload: {}
              as: InternalAuditor
              as_user_id: "${aud_id}"
              captures: { risk: $.data.risk_index, expected: $.data.expected_item_count }
            - call: "POST /audit-sessions/${sess_id}/close"
              payload: {}
              as: InternalAuditor
              as_user_id: "${aud_id}"
          assert:
            - "${expected} == 0 and AuditSession.${sess_id}.expected_evidence_item_ids == []"
            - "${risk} == 0.00 and AuditSession.${sess_id}.missing_count == 0 and misplaced_count == 0"
            - "GET /discrepancies?audit_session_id=${sess_id} returns total_count == 0"
            - "While the session is RECONCILED but not closed, PropertyRoom.${room_id}.posture == 'RESTRICTED' and sealed_location_count == 1"
            - "After close: StorageLocation.${loc_r2_id}.status == 'OPEN', sealed_by_audit_session_id == null, PropertyRoom.${room_id}.sealed_location_count == 0 and posture == 'OPEN'"

      - name: sweep_marks_item_eligible_when_release_at_equals_clock
        grounds:
          - "calculations.retention_release_at"
          - "state_machines.EvidenceItem.RETAINED_to_DISPOSAL_ELIGIBLE"
          - "entities.PropertyRoom.fields.last_sweep_at"
          - "entities.PropertyRoom.fields.disposal_eligible_count"
        distinguishing_aspect: |
          Metric RETENTION_RELEASE_AT versus the logical clock at millisecond resolution, observed on
          POST /property-rooms/{roomId}/daily-sweep: at 2027-07-31T23:59:59.999Z the item stays
          RETAINED and one millisecond later at exactly 2027-08-01T00:00:00Z it becomes
          DISPOSAL_ELIGIBLE, pinning the comparison as inclusive (<=).
        test_recipe:
          setup:
            - "One GENERAL item stored in G-01 under case 26-00001 (statute TH-3), intake at 2026-08-01, PRELIMINARY retention_release_at 2027-08-01T00:00:00Z."
            - "The case is left OPEN so no adjudication cascade rewrites the retention date."
          setup_api_calls:
            - *k_clock
            - *k_room
            - *k_stat_th3
            - *k_stat_ab1
            - *k_loc_g
            - *k_loc_v
            - *k_loc_r
            - *k_loc_r2
            - *k_loc_y
            - *k_tech
            - *k_tech2
            - *k_lab
            - *k_inv
            - *k_aud
            - *k_case1
            - *k_case2
            - call: "POST /evidence-items"
              payload: { case_id: "${case1_id}", item_description: "Shell casing envelope", category: "GENERAL", packaging_type: "SEALED_ENVELOPE", appraised_value_cents: 500, seized_at: "2026-07-31T18:00:00Z" }
              as: EvidenceTechnician
              as_user_id: "${tech_id}"
              captures: { item_id: $.data.id, release_at: $.data.retention_release_at }
            - call: "POST /evidence-items/${item_id}/storage-assignment"
              payload: { storage_location_id: "${loc_g_id}" }
              as: EvidenceTechnician
              as_user_id: "${tech_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-07-31T23:59:59.999Z" }
              as: PropertyRoomManager
          trigger:
            - call: "POST /property-rooms/${room_id}/daily-sweep"
              payload: {}
              as: PropertyRoomManager
              captures: { count_before: $.data.disposal_eligible_count }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-08-01T00:00:00Z" }
              as: PropertyRoomManager
            - call: "POST /property-rooms/${room_id}/daily-sweep"
              payload: {}
              as: PropertyRoomManager
              captures: { count_after: $.data.disposal_eligible_count }
          assert:
            - "${release_at} == '2027-08-01T00:00:00.000Z'"
            - "One millisecond before: ${count_before} == 0 and EvidenceItem.${item_id}.disposition_state == 'RETAINED'"
            - "At exactly the release instant: ${count_after} == 1 and EvidenceItem.${item_id}.disposition_state == 'DISPOSAL_ELIGIBLE'"
            - "PropertyRoom.${room_id}.last_sweep_at == '2027-08-01T00:00:00.000Z' after the second sweep"
            - "EvidenceItem.${item_id}.custody_state == 'STORED' throughout and StorageLocation.${loc_g_id}.occupied_slots == 1"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: final_retention_requires_case_adjudicated
        grounds:
          - "validations[priority=11]"
          - "errors[ERR_CASE_STATE_INVALID]"
          - "calculations.retention_release_at"
          - "concurrency_rules[retention-determination-create-stale-item]"
          - "entities.Case.fields.status"
        distinguishing_aspect: |
          Entity pair RETENTIONDETERMINATION -> CASE: an explicit basis FINAL determination on an item is
          refused with ERR_CASE_STATE_INVALID while the parent Case is only CHARGED, and the identical
          request succeeds once the Case reaches ADJUDICATED, so the gate lives on the case rather than
          on the item.
        test_recipe:
          setup:
            - "One GENERAL item stored in G-01 under case 26-00001; the case is charged but NOT adjudicated."
            - "Clock at 2026-09-15T00:00:00Z."
          setup_api_calls:
            - *k_clock
            - *k_room
            - *k_stat_th3
            - *k_stat_ab1
            - *k_loc_g
            - *k_loc_v
            - *k_loc_r
            - *k_loc_r2
            - *k_loc_y
            - *k_tech
            - *k_tech2
            - *k_lab
            - *k_inv
            - *k_aud
            - *k_case1
            - *k_case2
            - call: "POST /evidence-items"
              payload: { case_id: "${case1_id}", item_description: "Burglary pry bar", category: "GENERAL", packaging_type: "RIGID_BOX", appraised_value_cents: 4000, seized_at: "2026-07-31T19:00:00Z" }
              as: EvidenceTechnician
              as_user_id: "${tech_id}"
              captures: { item_id: $.data.id }
            - call: "POST /evidence-items/${item_id}/storage-assignment"
              payload: { storage_location_id: "${loc_g_id}" }
              as: EvidenceTechnician
              as_user_id: "${tech_id}"
            - call: "POST /cases/${case1_id}/charge"
              payload: {}
              as: Investigator
              as_user_id: "${inv_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-15T00:00:00Z" }
              as: PropertyRoomManager
            - call: "GET /evidence-items/${item_id}"
              payload: {}
              as: PropertyRoomManager
              captures: { item_v1: $.data.version }
          trigger:
            - call: "POST /retention-determinations"
              payload: { evidence_item_id: "${item_id}", basis: "FINAL", expected_evidence_item_version: "${item_v1}" }
              as: PropertyRoomManager
              captures: { err_id: $.data.error_id }
            - call: "POST /cases/${case1_id}/adjudicate"
              payload: {}
              as: CourtClerk
            - call: "GET /evidence-items/${item_id}"
              payload: {}
              as: PropertyRoomManager
              captures: { item_v2: $.data.version }
            - call: "POST /retention-determinations"
              payload: { evidence_item_id: "${item_id}", basis: "FINAL", expected_evidence_item_version: "${item_v2}" }
              as: PropertyRoomManager
              captures: { det_id: $.data.id, det_release: $.data.computed_release_at }
          assert:
            - "While Case.${case1_id}.status == 'CHARGED' the first trigger returns HTTP 409 with ${err_id} == 'ERR_CASE_STATE_INVALID'"
            - "No RetentionDetermination was created by the refused call: GET /retention-determinations?evidence_item_id=${item_id} returns total_count == 1 (the PRELIMINARY intake row)"
            - "EvidenceItem.${item_id}.retention_release_at is still '2027-08-01T00:00:00.000Z' and version == ${item_v1} after the refusal"
            - "After adjudication the identical basis FINAL request succeeds with HTTP 201, ${det_release} == '2027-04-16T00:00:00.000Z' and resolved_basis == 'FINAL'"
            - "RetentionDetermination.${det_id}.superseded == false and statute_days_applied == 213"

      - name: return_blocked_while_storage_location_sealed
        grounds:
          - "validations[priority=11]"
          - "errors[ERR_LOCATION_SEALED]"
          - "state_machines.StorageLocation.OPEN_to_SEALED_FOR_AUDIT"
          - "state_machines.CustodyTransfer.RELEASED_to_RETURNED"
          - "entities.StorageLocation.fields.status"
        distinguishing_aspect: |
          Entity pair CUSTODYTRANSFER -> STORAGELOCATION: returning a checked-out item is refused with
          ERR_LOCATION_SEALED purely because its assigned bin is SEALED_FOR_AUDIT, and the identical
          return succeeds the moment the audit session closes and the bin reverts to OPEN, so the gate
          lives on the location rather than on the transfer.
        test_recipe:
          setup:
            - "One GENERAL item stored in G-01 under case 26-00001, released to I-300 so it is CHECKED_OUT."
            - "An audit session on G-01 is then started, sealing the bin (the CHECKED_OUT item is not in the expected snapshot)."
          setup_api_calls:
            - *k_clock
