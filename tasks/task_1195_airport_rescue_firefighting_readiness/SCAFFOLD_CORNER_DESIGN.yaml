  - section: rbac
    instances:
      - name: rbac_firefighter_cannot_create_vehicle_unauthorized
        claim_type: rbac_exclusive_denied
        grounds: ["roles[Firefighter]", "errors[ERR_INSUFFICIENT_PERMISSIONS]"]
        distinguishing_aspect: "The entity-backed Firefighter role is denied ArffChief's exclusive vehicle-create operation with ERR_INSUFFICIENT_PERMISSIONS (403)."
        test_recipe:
          setup: ["Profile exists; firefighter created (supplies the entity-backed X-User-ID)"]
          setup_api_calls:
            - { call: "POST /arff/airport-profile", payload: { airport_code: "KDEMO", certificated_index: "C" }, as: AirportManager }
            - { call: "POST /arff/firefighters", payload: { employee_no: "FF-101", full_name: "Ann Lee" }, as: ArffChief, captures: { ff1: $.data.id } }
          trigger:
            - { call: "POST /arff/vehicles", payload: { call_sign: "RED-9", water_capacity_gal: 1000, dry_chem_capacity_lb: 100 }, as: Firefighter, as_user_id: "${ff1}", captures: { err: $.data.error_id } }
          assert:
            - "${err} == \"ERR_INSUFFICIENT_PERMISSIONS\""

