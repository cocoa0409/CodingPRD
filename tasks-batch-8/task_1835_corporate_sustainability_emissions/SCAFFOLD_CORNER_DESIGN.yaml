            - { call: "POST /sustainability/cycles/${cyc}/transition", payload: { to_state: "DATA_COLLECTION" }, as: SustainabilityManager }
            - { call: "POST /sustainability/activity-records", payload: { cycle_id: "${cyc}", site_id: "${site}", factor_id: "${f}", activity_type: "STATIONARY_FUEL", quantity: 10, unit: "therm", period_start: "2026-01-01T00:00:00Z", period_end: "2026-02-01T00:00:00Z" }, as: SiteDataSteward, as_user_id: "steward-1", captures: { r1: $.data.id } }
            - { call: "POST /sustainability/activity-records/${r1}/transition", payload: { to_state: "UNDER_REVIEW" }, as: SiteDataSteward, as_user_id: "steward-1" }
            - { call: "POST /sustainability/activity-records/${r1}/transition", payload: { to_state: "APPROVED" }, as: SustainabilityAnalyst, as_user_id: "analyst-1" }
            - { call: "POST /sustainability/activity-records", payload: { cycle_id: "${cyc}", site_id: "${site}", factor_id: "${f}", activity_type: "STATIONARY_FUEL", quantity: 999, unit: "therm", period_start: "2026-02-01T00:00:00Z", period_end: "2026-03-01T00:00:00Z" }, as: SiteDataSteward, as_user_id: "steward-1", captures: { r2: $.data.id } }
            - { call: "POST /sustainability/activity-records", payload: { cycle_id: "${cyc}", site_id: "${site}", factor_id: "${f}", activity_type: "STATIONARY_FUEL", quantity: 999, unit: "therm", period_start: "2026-03-01T00:00:00Z", period_end: "2026-04-01T00:00:00Z" }, as: SiteDataSteward, as_user_id: "steward-1", captures: { r3: $.data.id } }
            - { call: "POST /sustainability/activity-records/${r3}/transition", payload: { to_state: "UNDER_REVIEW" }, as: SiteDataSteward, as_user_id: "steward-1" }
            - { call: "POST /sustainability/activity-records/${r3}/transition", payload: { to_state: "REJECTED", reason: "Bad meter read" }, as: SustainabilityAnalyst, as_user_id: "analyst-1" }
          trigger:
            - { call: "GET /sustainability/cycles/${cyc}", as: SustainabilityManager, captures: { cyc_v: $.data.version } }
            - { call: "POST /sustainability/cycles/${cyc}/inventory/recalculate", payload: { expected_cycle_version: "${cyc_v}" }, as: SustainabilityManager, captures: { s1: $.data.scope1_tco2e, tot: $.data.total_tco2e } }
          assert:
            - "scope1_tco2e == 10.0 and total_tco2e == 10.0 (SUBMITTED r2 and REJECTED r3 contribute nothing)"

      - name: recalc_with_zero_records_yields_zeros
        claim_type: correct_result
        grounds: [calculations.inventory_aggregation, calculations.assurance_readiness_pct]
        distinguishing_aspect: "Empty input set is not an error: recalculating a cycle with zero APPROVED records yields all scope totals 0.0 and readiness_pct stays 0.0."
        test_recipe:
          setup: ["cycle FY2026 in DATA_COLLECTION with no records"]
          setup_api_calls:
            - { call: "POST /sustainability/cycles", payload: { name: "FY2026", reporting_year: 2026 }, as: SustainabilityManager, captures: { cyc: $.data.id, ready0: $.data.readiness_pct } }
            - { call: "POST /sustainability/cycles/${cyc}/transition", payload: { to_state: "DATA_COLLECTION" }, as: SustainabilityManager }
          trigger:
            - { call: "GET /sustainability/cycles/${cyc}", as: SustainabilityManager, captures: { cyc_v: $.data.version } }
            - { call: "POST /sustainability/cycles/${cyc}/inventory/recalculate", payload: { expected_cycle_version: "${cyc_v}" }, as: SustainabilityManager, captures: { s1: $.data.scope1_tco2e, s2l: $.data.scope2_location_tco2e, s2m: $.data.scope2_market_tco2e, s3: $.data.scope3_tco2e, tot: $.data.total_tco2e, ist: $.data.status } }
          assert:
            - "all scope totals == 0.0 and total_tco2e == 0.0; inventory status == CURRENT"
            - "cycle readiness_pct == 0.0 at creation (empty approved set, no division by zero)"

      - name: trajectory_tolerance_boundary_on_track_then_off
        claim_type: constants_applied
        grounds: [calculations.target_trajectory_status]
        distinguishing_aspect: "TOLERANCE_PCT_POINTS = 2.0 with >= semantics: at total 920.0 the actual reduction (8.0%) sits exactly on required(10.0%) - 2.0 and evaluates ON_TRACK; one more therm (921.0 -> 7.9%) flips OFF_TRACK."
        test_recipe:
          setup: ["factor 1.0; cycle FY2026 in DATA_COLLECTION; ACTIVE target base 1000, reduction 50%, 2025->2030, coverage SCOPE1_2_3; r1 APPROVED 920 therm"]
          setup_api_calls:
            - { call: "POST /sustainability/sites", payload: { name: "Plant", country_code: "US", grid_region_code: "CA" }, as: SustainabilityManager, captures: { site: $.data.id } }
            - { call: "POST /sustainability/emission-factors", payload: { scope_category: "SCOPE1_STATIONARY", region_code: "GLOBAL", unit: "therm", value_tco2e_per_unit: 1.0, library_version: 1, valid_from: "2026-01-01T00:00:00Z", valid_to: "2026-12-31T23:59:59Z" }, as: SustainabilityManager, captures: { f: $.data.id } }
            - { call: "POST /sustainability/emission-factors/${f}/transition", payload: { to_state: "PUBLISHED" }, as: SustainabilityManager }
            - { call: "POST /sustainability/cycles", payload: { name: "FY2026", reporting_year: 2026 }, as: SustainabilityManager, captures: { cyc: $.data.id } }
            - { call: "POST /sustainability/cycles/${cyc}/transition", payload: { to_state: "DATA_COLLECTION" }, as: SustainabilityManager }
            - { call: "POST /sustainability/targets", payload: { name: "50-by-2030", base_year: 2025, target_year: 2030, reduction_pct: 50, scope_coverage: "SCOPE1_2_3", base_year_total_tco2e: 1000 }, as: SustainabilityManager, captures: { tgt: $.data.id } }
            - { call: "POST /sustainability/targets/${tgt}/transition", payload: { to_state: "APPROVED" }, as: SustainabilityManager }
            - { call: "POST /sustainability/targets/${tgt}/transition", payload: { to_state: "ACTIVE" }, as: SustainabilityManager }
            - { call: "POST /sustainability/activity-records", payload: { cycle_id: "${cyc}", site_id: "${site}", factor_id: "${f}", activity_type: "STATIONARY_FUEL", quantity: 920, unit: "therm", period_start: "2026-01-01T00:00:00Z", period_end: "2026-02-01T00:00:00Z" }, as: SiteDataSteward, as_user_id: "steward-1", captures: { r1: $.data.id } }
            - { call: "POST /sustainability/activity-records/${r1}/transition", payload: { to_state: "UNDER_REVIEW" }, as: SiteDataSteward, as_user_id: "steward-1" }
            - { call: "POST /sustainability/activity-records/${r1}/transition", payload: { to_state: "APPROVED" }, as: SustainabilityAnalyst, as_user_id: "analyst-1" }
            - { call: "POST /sustainability/activity-records", payload: { cycle_id: "${cyc}", site_id: "${site}", factor_id: "${f}", activity_type: "STATIONARY_FUEL", quantity: 1, unit: "therm", period_start: "2026-02-01T00:00:00Z", period_end: "2026-03-01T00:00:00Z" }, as: SiteDataSteward, as_user_id: "steward-1", captures: { r2: $.data.id } }
            - { call: "POST /sustainability/activity-records/${r2}/transition", payload: { to_state: "UNDER_REVIEW" }, as: SiteDataSteward, as_user_id: "steward-1" }
          trigger:
            - { call: "GET /sustainability/cycles/${cyc}", as: SustainabilityManager, captures: { v1: $.data.version } }
            - { call: "POST /sustainability/cycles/${cyc}/inventory/recalculate", payload: { expected_cycle_version: "${v1}" }, as: SustainabilityManager }
            - { call: "GET /sustainability/targets/${tgt}", as: SustainabilityManager, captures: { traj_on: $.data.trajectory_status } }
            - { call: "POST /sustainability/activity-records/${r2}/transition", payload: { to_state: "APPROVED" }, as: SustainabilityAnalyst, as_user_id: "analyst-1" }
            - { call: "GET /sustainability/cycles/${cyc}", as: SustainabilityManager, captures: { v2: $.data.version } }
            - { call: "POST /sustainability/cycles/${cyc}/inventory/recalculate", payload: { expected_cycle_version: "${v2}" }, as: SustainabilityManager }
            - { call: "GET /sustainability/targets/${tgt}", as: SustainabilityManager, captures: { traj_off: $.data.trajectory_status } }
          assert:
            - "with only r1 APPROVED (total 920.0): trajectory_status == ON_TRACK (actual 8.0% exactly on the 10.0% - 2.0 boundary, >= inclusive)"
            - "after approving r2 (total 921.0 -> actual 7.9% < 8.0%): trajectory_status == OFF_TRACK"

      - name: questionnaire_completeness_75pct
        claim_type: correct_result
        grounds: [calculations.questionnaire_completeness]
        distinguishing_aspect: "CDP requires 4 sections; answering 3 yields completeness_pct == 75.0 (round_half_up 1dp)."
        test_recipe:
          setup: ["cycle FY2026 in DATA_COLLECTION; CDP questionnaire created"]
          setup_api_calls:
            - { call: "POST /sustainability/cycles", payload: { name: "FY2026", reporting_year: 2026 }, as: SustainabilityManager, captures: { cyc: $.data.id } }
            - { call: "POST /sustainability/cycles/${cyc}/transition", payload: { to_state: "DATA_COLLECTION" }, as: SustainabilityManager }
            - { call: "POST /sustainability/questionnaire-responses", payload: { cycle_id: "${cyc}", framework: "CDP" }, as: DisclosureLead, as_user_id: "lead-1", captures: { qr: $.data.id } }
          trigger:
            - { call: "POST /sustainability/questionnaire-responses/${qr}/answers", payload: { section_key: "GOVERNANCE", answer_text: "Board oversight" }, as: DisclosureLead, as_user_id: "lead-1" }
            - { call: "POST /sustainability/questionnaire-responses/${qr}/answers", payload: { section_key: "RISKS", answer_text: "Risk register" }, as: DisclosureLead, as_user_id: "lead-1" }
            - { call: "POST /sustainability/questionnaire-responses/${qr}/answers", payload: { section_key: "EMISSIONS", answer_text: "Inventory summary" }, as: DisclosureLead, as_user_id: "lead-1", captures: { comp: $.data.completeness_pct } }
            - { call: "POST /sustainability/questionnaire-responses/${qr}/answers", payload: { section_key: "BOGUS", answer_text: "not a real section" }, as: DisclosureLead, as_user_id: "lead-1", captures: { err: $.data.error_id } }
          assert:
            - "after 3 of 4 required CDP sections: completeness_pct == 75.0"
            - "a section_key outside the framework's required list (BOGUS) is rejected with error_id == ERR_INVALID_REQUEST"

      - name: voided_records_excluded_from_inventory
        claim_type: input_set_filtering
        grounds: [calculations.inventory_aggregation, state_machines.ActivityRecord.APPROVED_to_VOIDED]
        distinguishing_aspect: "VOIDED records drop out of the APPROVED input set; covered end-to-end by the difficulty instance."
        excluded_because:
          difficulty_instance: compensating_invariant / record_approve_void_conserves_approved_totals
          rationale: "That instance asserts the post-void recalc total returns to exactly 10.0, proving VOIDED exclusion."

      - name: rounding_precision_pinned_per_record_then_sum
        claim_type: precision
        grounds: [calculations.inventory_aggregation, calculations.record_tco2e]
        distinguishing_aspect: "Pinned nested rounding (4dp per record, then sum, then 2dp) vs sum-then-round."
        excluded_because:
          difficulty_instance: combinatorial_formula / inventory_nested_rounding_order
          rationale: "Difficulty instance asserts scope1 == 0.01 where the forbidden order yields 0.00."

  # ===========================================================================
  # Section: validations
  # ===========================================================================
  - section: validations
    instances:
      - name: record_period_outside_cycle_year_returns_error
        claim_type: violation_to_error
        grounds:
          - validations[priority=9]
          - errors[ERR_PERIOD_OUTSIDE_CYCLE_YEAR]
        distinguishing_aspect: "With the cycle-state gate satisfied (DATA_COLLECTION), a period fully inside 2025 for a 2026 cycle fails purely on the temporal rule."
        test_recipe:
          setup: ["site active; factor PUBLISHED with a window covering mid-2025; cycle FY2026 in DATA_COLLECTION"]
          setup_api_calls:
            - { call: "POST /sustainability/sites", payload: { name: "Plant", country_code: "US", grid_region_code: "CA" }, as: SustainabilityManager, captures: { site: $.data.id } }
            - { call: "POST /sustainability/emission-factors", payload: { scope_category: "SCOPE1_STATIONARY", region_code: "GLOBAL", unit: "therm", value_tco2e_per_unit: 0.5, library_version: 1, valid_from: "2025-01-01T00:00:00Z", valid_to: "2026-12-31T23:59:59Z" }, as: SustainabilityManager, captures: { f: $.data.id } }
            - { call: "POST /sustainability/emission-factors/${f}/transition", payload: { to_state: "PUBLISHED" }, as: SustainabilityManager }
            - { call: "POST /sustainability/cycles", payload: { name: "FY2026", reporting_year: 2026 }, as: SustainabilityManager, captures: { cyc: $.data.id } }
            - { call: "POST /sustainability/cycles/${cyc}/transition", payload: { to_state: "DATA_COLLECTION" }, as: SustainabilityManager }
          trigger:
            - { call: "POST /sustainability/activity-records", payload: { cycle_id: "${cyc}", site_id: "${site}", factor_id: "${f}", activity_type: "STATIONARY_FUEL", quantity: 10, unit: "therm", period_start: "2025-06-01T00:00:00Z", period_end: "2025-07-01T00:00:00Z" }, as: SiteDataSteward, as_user_id: "steward-1", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_PERIOD_OUTSIDE_CYCLE_YEAR (422); no record persisted"

      - name: instrument_vintage_window_boundary
        claim_type: violation_to_error
        grounds:
          - validations[priority=9]
          - errors[ERR_VINTAGE_INELIGIBLE]
          - state_machines.RenewableInstrument.PROCURED_to_RETIRED
        distinguishing_aspect: "Vintage window is inclusive: vintage_year == cycle year - 3 (2023 for 2026) retires fine; vintage_year 2022 (one year older) fails ERR_VINTAGE_INELIGIBLE."
        test_recipe:
          setup: ["site active; cycle FY2026 in DATA_COLLECTION; instrument A vintage 2023, instrument B vintage 2022"]
          setup_api_calls:
            - { call: "POST /sustainability/sites", payload: { name: "Alpha", country_code: "US", grid_region_code: "CA" }, as: SustainabilityManager, captures: { site: $.data.id } }
            - { call: "POST /sustainability/cycles", payload: { name: "FY2026", reporting_year: 2026 }, as: SustainabilityManager, captures: { cyc: $.data.id } }
            - { call: "POST /sustainability/cycles/${cyc}/transition", payload: { to_state: "DATA_COLLECTION" }, as: SustainabilityManager }
            - { call: "POST /sustainability/instruments", payload: { registry: "M-RETS", serial_number: "S-V23", technology: "WIND", vintage_year: 2023, quantity_mwh: 10 }, as: SustainabilityManager, captures: { inst_a: $.data.id } }
            - { call: "POST /sustainability/instruments", payload: { registry: "M-RETS", serial_number: "S-V22", technology: "WIND", vintage_year: 2022, quantity_mwh: 10 }, as: SustainabilityManager, captures: { inst_b: $.data.id } }
          trigger:
            - { call: "POST /sustainability/instruments/${inst_b}/retire", payload: { cycle_id: "${cyc}", site_id: "${site}" }, as: SustainabilityManager, captures: { err: $.data.error_id } }
            - { call: "POST /sustainability/instruments/${inst_a}/retire", payload: { cycle_id: "${cyc}", site_id: "${site}" }, as: SustainabilityManager, captures: { st: $.data.status } }
          assert:
            - "vintage 2022: error_id == ERR_VINTAGE_INELIGIBLE (2022 < 2026 - 3)"
            - "vintage 2023 (exactly cycle year - 3): status == RETIRED (inclusive lower boundary)"

      - name: record_unit_mismatch_returns_error
        claim_type: violation_to_error
        grounds:
          - validations[priority=12]
          - errors[ERR_UNIT_MISMATCH]
        distinguishing_aspect: "Record unit must equal the factor's unit: kWh against an MWh factor fails ERR_UNIT_MISMATCH; so does an activity_type/scope_category mismatch."
        test_recipe:
          setup: ["site active; SCOPE2_GRID factor (unit MWh) PUBLISHED; cycle FY2026 in DATA_COLLECTION"]
          setup_api_calls:
            - { call: "POST /sustainability/sites", payload: { name: "Alpha", country_code: "US", grid_region_code: "CA" }, as: SustainabilityManager, captures: { site: $.data.id } }
            - { call: "POST /sustainability/emission-factors", payload: { scope_category: "SCOPE2_GRID", region_code: "CA", unit: "MWh", value_tco2e_per_unit: 0.4, library_version: 1, valid_from: "2026-01-01T00:00:00Z", valid_to: "2026-12-31T23:59:59Z" }, as: SustainabilityManager, captures: { f: $.data.id } }
            - { call: "POST /sustainability/emission-factors/${f}/transition", payload: { to_state: "PUBLISHED" }, as: SustainabilityManager }
            - { call: "POST /sustainability/cycles", payload: { name: "FY2026", reporting_year: 2026 }, as: SustainabilityManager, captures: { cyc: $.data.id } }
            - { call: "POST /sustainability/cycles/${cyc}/transition", payload: { to_state: "DATA_COLLECTION" }, as: SustainabilityManager }
          trigger:
            - { call: "POST /sustainability/activity-records", payload: { cycle_id: "${cyc}", site_id: "${site}", factor_id: "${f}", activity_type: "ELECTRICITY", quantity: 10, unit: "kWh", period_start: "2026-01-01T00:00:00Z", period_end: "2026-02-01T00:00:00Z" }, as: SiteDataSteward, as_user_id: "steward-1", captures: { err1: $.data.error_id } }
            - { call: "POST /sustainability/activity-records", payload: { cycle_id: "${cyc}", site_id: "${site}", factor_id: "${f}", activity_type: "STATIONARY_FUEL", quantity: 10, unit: "MWh", period_start: "2026-01-01T00:00:00Z", period_end: "2026-02-01T00:00:00Z" }, as: SiteDataSteward, as_user_id: "steward-1", captures: { err2: $.data.error_id } }
          assert:
            - "unit mismatch (kWh vs MWh): error_id == ERR_UNIT_MISMATCH"
            - "category mismatch (STATIONARY_FUEL against SCOPE2_GRID factor): error_id == ERR_UNIT_MISMATCH"

      - name: duplicate_instrument_serial_returns_409
        claim_type: violation_to_error
        grounds:
          - validations[priority=13]
          - errors[ERR_DUPLICATE_INSTRUMENT_SERIAL]
        distinguishing_aspect: "A second non-EXPIRED instrument with the same (registry, serial_number) is rejected; a different serial succeeds."
        test_recipe:
          setup: ["one PROCURED instrument registered (M-RETS, S-900)"]
          setup_api_calls:
            - { call: "POST /sustainability/instruments", payload: { registry: "M-RETS", serial_number: "S-900", technology: "SOLAR", vintage_year: 2026, quantity_mwh: 10 }, as: SustainabilityManager }
          trigger:
            - { call: "POST /sustainability/instruments", payload: { registry: "M-RETS", serial_number: "S-900", technology: "WIND", vintage_year: 2026, quantity_mwh: 5 }, as: SustainabilityManager, captures: { err: $.data.error_id } }
            - { call: "POST /sustainability/instruments", payload: { registry: "M-RETS", serial_number: "S-901", technology: "WIND", vintage_year: 2026, quantity_mwh: 5 }, as: SustainabilityManager, captures: { ok: $.data.id } }
          assert:
            - "duplicate (registry, serial_number): error_id == ERR_DUPLICATE_INSTRUMENT_SERIAL (409)"
            - "different serial: 201 created"

      - name: duplicate_questionnaire_framework_returns_409
        claim_type: violation_to_error
        grounds:
          - validations[priority=13]
          - errors[ERR_DUPLICATE_QUESTIONNAIRE]
        distinguishing_aspect: "One QuestionnaireResponse per (cycle_id, framework): a second CDP for the same cycle fails; a GRI for the same cycle succeeds."
        test_recipe:
          setup: ["cycle FY2026 in DATA_COLLECTION; CDP questionnaire exists"]
          setup_api_calls:
            - { call: "POST /sustainability/cycles", payload: { name: "FY2026", reporting_year: 2026 }, as: SustainabilityManager, captures: { cyc: $.data.id } }
            - { call: "POST /sustainability/cycles/${cyc}/transition", payload: { to_state: "DATA_COLLECTION" }, as: SustainabilityManager }
            - { call: "POST /sustainability/questionnaire-responses", payload: { cycle_id: "${cyc}", framework: "CDP" }, as: DisclosureLead, as_user_id: "lead-1" }
          trigger:
            - { call: "POST /sustainability/questionnaire-responses", payload: { cycle_id: "${cyc}", framework: "CDP" }, as: DisclosureLead, as_user_id: "lead-1", captures: { err: $.data.error_id } }
            - { call: "POST /sustainability/questionnaire-responses", payload: { cycle_id: "${cyc}", framework: "GRI" }, as: DisclosureLead, as_user_id: "lead-1", captures: { ok: $.data.id } }
          assert:
            - "second CDP: error_id == ERR_DUPLICATE_QUESTIONNAIRE (409)"
            - "GRI for the same cycle: 201 created"

      - name: questionnaire_submit_review_incomplete_sections_returns_error
        claim_type: violation_to_error
        grounds:
          - validations[priority=15]
          - errors[ERR_SECTION_INCOMPLETE]
          - state_machines.QuestionnaireResponse.DRAFT_to_IN_REVIEW
        distinguishing_aspect: "Submit-review with only 3 of 4 required CDP sections answered fails ERR_SECTION_INCOMPLETE; after answering the 4th it succeeds."
        test_recipe:
          setup: ["cycle FY2026 in DATA_COLLECTION; CDP questionnaire with GOVERNANCE, RISKS, EMISSIONS answered (TARGETS missing)"]
          setup_api_calls:
            - { call: "POST /sustainability/cycles", payload: { name: "FY2026", reporting_year: 2026 }, as: SustainabilityManager, captures: { cyc: $.data.id } }
            - { call: "POST /sustainability/cycles/${cyc}/transition", payload: { to_state: "DATA_COLLECTION" }, as: SustainabilityManager }
            - { call: "POST /sustainability/questionnaire-responses", payload: { cycle_id: "${cyc}", framework: "CDP" }, as: DisclosureLead, as_user_id: "lead-1", captures: { qr: $.data.id } }
            - { call: "POST /sustainability/questionnaire-responses/${qr}/answers", payload: { section_key: "GOVERNANCE", answer_text: "Board oversight" }, as: DisclosureLead, as_user_id: "lead-1" }
            - { call: "POST /sustainability/questionnaire-responses/${qr}/answers", payload: { section_key: "RISKS", answer_text: "Risk register" }, as: DisclosureLead, as_user_id: "lead-1" }
            - { call: "POST /sustainability/questionnaire-responses/${qr}/answers", payload: { section_key: "EMISSIONS", answer_text: "Inventory summary" }, as: DisclosureLead, as_user_id: "lead-1" }
          trigger:
            - { call: "POST /sustainability/questionnaire-responses/${qr}/transition", payload: { to_state: "IN_REVIEW" }, as: DisclosureLead, as_user_id: "lead-1", captures: { err: $.data.error_id } }
            - { call: "POST /sustainability/questionnaire-responses/${qr}/answers", payload: { section_key: "TARGETS", answer_text: "50 by 2030" }, as: DisclosureLead, as_user_id: "lead-1" }
            - { call: "POST /sustainability/questionnaire-responses/${qr}/transition", payload: { to_state: "IN_REVIEW" }, as: DisclosureLead, as_user_id: "lead-1", captures: { st: $.data.status } }
          assert:
            - "3/4 answered: error_id == ERR_SECTION_INCOMPLETE (422)"
            - "4/4 answered: transition succeeds, status == IN_REVIEW"

      - name: disclose_without_submitted_questionnaire_returns_error
        claim_type: violation_to_error
        grounds:
          - state_machines.ReportingCycle.ASSURED_to_DISCLOSED
          - errors[ERR_NO_SUBMITTED_QUESTIONNAIRE]
        distinguishing_aspect: "An ASSURED cycle with no SUBMITTED QuestionnaireResponse cannot disclose: ERR_NO_SUBMITTED_QUESTIONNAIRE."
        test_recipe:
          setup: ["cycle FY2026 fully prepared through ASSURED (record + verified evidence, readiness 100.0); NO questionnaire exists"]
          setup_api_calls:
            - { call: "POST /sustainability/sites", payload: { name: "Plant", country_code: "US", grid_region_code: "CA" }, as: SustainabilityManager, captures: { site: $.data.id } }
            - { call: "POST /sustainability/emission-factors", payload: { scope_category: "SCOPE1_STATIONARY", region_code: "GLOBAL", unit: "therm", value_tco2e_per_unit: 0.5, library_version: 1, valid_from: "2026-01-01T00:00:00Z", valid_to: "2026-12-31T23:59:59Z" }, as: SustainabilityManager, captures: { f: $.data.id } }
            - { call: "POST /sustainability/emission-factors/${f}/transition", payload: { to_state: "PUBLISHED" }, as: SustainabilityManager }
            - { call: "POST /sustainability/cycles", payload: { name: "FY2026", reporting_year: 2026 }, as: SustainabilityManager, captures: { cyc: $.data.id } }
            - { call: "POST /sustainability/cycles/${cyc}/transition", payload: { to_state: "DATA_COLLECTION" }, as: SustainabilityManager }
            - { call: "POST /sustainability/activity-records", payload: { cycle_id: "${cyc}", site_id: "${site}", factor_id: "${f}", activity_type: "STATIONARY_FUEL", quantity: 100, unit: "therm", period_start: "2026-01-01T00:00:00Z", period_end: "2026-02-01T00:00:00Z" }, as: SiteDataSteward, as_user_id: "steward-1", captures: { rec: $.data.id } }
            - { call: "POST /sustainability/activity-records/${rec}/transition", payload: { to_state: "UNDER_REVIEW" }, as: SiteDataSteward, as_user_id: "steward-1" }
            - { call: "POST /sustainability/activity-records/${rec}/transition", payload: { to_state: "APPROVED" }, as: SustainabilityAnalyst, as_user_id: "analyst-1" }
            - { call: "POST /sustainability/activity-records/${rec}/evidence", payload: { file_name: "invoice.pdf", sha256_hex: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa" }, as: SiteDataSteward, as_user_id: "steward-1", captures: { ev: $.data.id } }
            - { call: "POST /sustainability/evidence-items/${ev}/transition", payload: { to_state: "VERIFIED" }, as: SustainabilityAnalyst, as_user_id: "analyst-1" }
            - { call: "GET /sustainability/cycles/${cyc}", as: SustainabilityManager, captures: { cyc_v: $.data.version } }
            - { call: "POST /sustainability/cycles/${cyc}/inventory/recalculate", payload: { expected_cycle_version: "${cyc_v}" }, as: SustainabilityManager }
            - { call: "POST /sustainability/cycles/${cyc}/transition", payload: { to_state: "UNDER_REVIEW" }, as: SustainabilityManager }
            - { call: "POST /sustainability/cycles/${cyc}/transition", payload: { to_state: "LOCKED" }, as: SustainabilityManager }
            - { call: "POST /sustainability/cycles/${cyc}/transition", payload: { to_state: "UNDER_ASSURANCE" }, as: SustainabilityManager }
            - { call: "POST /sustainability/cycles/${cyc}/transition", payload: { to_state: "ASSURED", assurance_statement: "Limited assurance" }, as: AssuranceProvider, as_user_id: "assurer-1" }
          trigger:
            - { call: "POST /sustainability/cycles/${cyc}/transition", payload: { to_state: "DISCLOSED" }, as: SustainabilityManager, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_NO_SUBMITTED_QUESTIONNAIRE; cycle stays ASSURED"

      - name: approve_large_record_evidence_gate_boundary
        claim_type: violation_to_error
        grounds:
          - validations[priority=8]
          - errors[ERR_EVIDENCE_REQUIRED]
        distinguishing_aspect: "Evidence mandate is >= 1000: a 999.99-quantity record approves with no evidence; a exactly-1000 record fails ERR_EVIDENCE_REQUIRED until a VERIFIED item exists."
        test_recipe:
          setup: ["cycle FY2026 in DATA_COLLECTION; r_small 999.99 therm and r_large 1000 therm both UNDER_REVIEW; no evidence yet"]
          setup_api_calls:
            - { call: "POST /sustainability/sites", payload: { name: "Plant", country_code: "US", grid_region_code: "CA" }, as: SustainabilityManager, captures: { site: $.data.id } }
            - { call: "POST /sustainability/emission-factors", payload: { scope_category: "SCOPE1_STATIONARY", region_code: "GLOBAL", unit: "therm", value_tco2e_per_unit: 0.5, library_version: 1, valid_from: "2026-01-01T00:00:00Z", valid_to: "2026-12-31T23:59:59Z" }, as: SustainabilityManager, captures: { f: $.data.id } }
            - { call: "POST /sustainability/emission-factors/${f}/transition", payload: { to_state: "PUBLISHED" }, as: SustainabilityManager }
            - { call: "POST /sustainability/cycles", payload: { name: "FY2026", reporting_year: 2026 }, as: SustainabilityManager, captures: { cyc: $.data.id } }
            - { call: "POST /sustainability/cycles/${cyc}/transition", payload: { to_state: "DATA_COLLECTION" }, as: SustainabilityManager }
            - { call: "POST /sustainability/activity-records", payload: { cycle_id: "${cyc}", site_id: "${site}", factor_id: "${f}", activity_type: "STATIONARY_FUEL", quantity: 999.99, unit: "therm", period_start: "2026-01-01T00:00:00Z", period_end: "2026-02-01T00:00:00Z" }, as: SiteDataSteward, as_user_id: "steward-1", captures: { r_small: $.data.id } }
            - { call: "POST /sustainability/activity-records/${r_small}/transition", payload: { to_state: "UNDER_REVIEW" }, as: SiteDataSteward, as_user_id: "steward-1" }
            - { call: "POST /sustainability/activity-records", payload: { cycle_id: "${cyc}", site_id: "${site}", factor_id: "${f}", activity_type: "STATIONARY_FUEL", quantity: 1000, unit: "therm", period_start: "2026-02-01T00:00:00Z", period_end: "2026-03-01T00:00:00Z" }, as: SiteDataSteward, as_user_id: "steward-1", captures: { r_large: $.data.id } }
            - { call: "POST /sustainability/activity-records/${r_large}/transition", payload: { to_state: "UNDER_REVIEW" }, as: SiteDataSteward, as_user_id: "steward-1" }
          trigger:
            - { call: "POST /sustainability/activity-records/${r_small}/transition", payload: { to_state: "APPROVED" }, as: SustainabilityAnalyst, as_user_id: "analyst-1", captures: { st_small: $.data.status } }
            - { call: "POST /sustainability/activity-records/${r_large}/transition", payload: { to_state: "APPROVED" }, as: SustainabilityAnalyst, as_user_id: "analyst-1", captures: { err: $.data.error_id } }
            - { call: "POST /sustainability/activity-records/${r_large}/evidence", payload: { file_name: "meter.pdf", sha256_hex: "eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee" }, as: SiteDataSteward, as_user_id: "steward-1", captures: { ev: $.data.id } }
            - { call: "POST /sustainability/evidence-items/${ev}/transition", payload: { to_state: "VERIFIED" }, as: SustainabilityAnalyst, as_user_id: "analyst-1" }
            - { call: "POST /sustainability/activity-records/${r_large}/transition", payload: { to_state: "APPROVED" }, as: SustainabilityAnalyst, as_user_id: "analyst-1", captures: { st_large: $.data.status } }
          assert:
            - "999.99 therm approves without evidence: status == APPROVED (below the >= 1000 gate)"
            - "1000 therm without VERIFIED evidence: error_id == ERR_EVIDENCE_REQUIRED (exact boundary triggers the gate)"
            - "after verifying one evidence item: approve succeeds, status == APPROVED"

      - name: activate_target_with_provisional_baseline_returns_error
        claim_type: violation_to_error
        grounds:
          - validations[priority=15]
          - errors[ERR_BASELINE_RECALC_REQUIRED]
          - state_machines.EmissionTarget.APPROVED_to_ACTIVE
        distinguishing_aspect: "Activation with baseline_source PROVISIONAL while a LOCKED base-year cycle exists fails ERR_BASELINE_RECALC_REQUIRED; after recalculate-baseline it activates."
        test_recipe:
          setup: ["LOCKED 2025 base cycle (one APPROVED record 100 therm at factor 1.0, inventory FROZEN); target base_year 2025 base 100 in APPROVED"]
          setup_api_calls:
            - { call: "POST /sustainability/sites", payload: { name: "Plant", country_code: "US", grid_region_code: "CA" }, as: SustainabilityManager, captures: { site: $.data.id } }
            - { call: "POST /sustainability/emission-factors", payload: { scope_category: "SCOPE1_STATIONARY", region_code: "GLOBAL", unit: "therm", value_tco2e_per_unit: 1.0, library_version: 1, valid_from: "2025-01-01T00:00:00Z", valid_to: "2025-12-31T23:59:59Z" }, as: SustainabilityManager, captures: { f: $.data.id } }
            - { call: "POST /sustainability/emission-factors/${f}/transition", payload: { to_state: "PUBLISHED" }, as: SustainabilityManager }
            - { call: "POST /sustainability/cycles", payload: { name: "FY2025", reporting_year: 2025 }, as: SustainabilityManager, captures: { cyc: $.data.id } }
            - { call: "POST /sustainability/cycles/${cyc}/transition", payload: { to_state: "DATA_COLLECTION" }, as: SustainabilityManager }
            - { call: "POST /sustainability/activity-records", payload: { cycle_id: "${cyc}", site_id: "${site}", factor_id: "${f}", activity_type: "STATIONARY_FUEL", quantity: 100, unit: "therm", period_start: "2025-01-01T00:00:00Z", period_end: "2025-02-01T00:00:00Z" }, as: SiteDataSteward, as_user_id: "steward-1", captures: { rec: $.data.id } }
            - { call: "POST /sustainability/activity-records/${rec}/transition", payload: { to_state: "UNDER_REVIEW" }, as: SiteDataSteward, as_user_id: "steward-1" }
            - { call: "POST /sustainability/activity-records/${rec}/transition", payload: { to_state: "APPROVED" }, as: SustainabilityAnalyst, as_user_id: "analyst-1" }
            - { call: "GET /sustainability/cycles/${cyc}", as: SustainabilityManager, captures: { cyc_v: $.data.version } }
            - { call: "POST /sustainability/cycles/${cyc}/inventory/recalculate", payload: { expected_cycle_version: "${cyc_v}" }, as: SustainabilityManager }
            - { call: "POST /sustainability/cycles/${cyc}/transition", payload: { to_state: "UNDER_REVIEW" }, as: SustainabilityManager }
            - { call: "POST /sustainability/cycles/${cyc}/transition", payload: { to_state: "LOCKED" }, as: SustainabilityManager }
            - { call: "POST /sustainability/targets", payload: { name: "T1", base_year: 2025, target_year: 2030, reduction_pct: 50, scope_coverage: "SCOPE1_2_3", base_year_total_tco2e: 100 }, as: SustainabilityManager, captures: { tgt: $.data.id, tgt_v: $.data.version } }
            - { call: "POST /sustainability/targets/${tgt}/transition", payload: { to_state: "APPROVED" }, as: SustainabilityManager }
          trigger:
            - { call: "POST /sustainability/targets/${tgt}/transition", payload: { to_state: "ACTIVE" }, as: SustainabilityManager, captures: { err: $.data.error_id } }
            - { call: "GET /sustainability/targets/${tgt}", as: SustainabilityManager, captures: { tgt_v2: $.data.version } }
            - { call: "POST /sustainability/targets/${tgt}/recalculate-baseline", payload: { base_cycle_id: "${cyc}", expected_target_version: "${tgt_v2}" }, as: SustainabilityManager, captures: { src: $.data.baseline_source } }
            - { call: "POST /sustainability/targets/${tgt}/transition", payload: { to_state: "ACTIVE" }, as: SustainabilityManager, captures: { st: $.data.status } }
          assert:
            - "activation with PROVISIONAL baseline while FY2025 is LOCKED: error_id == ERR_BASELINE_RECALC_REQUIRED"
            - "after recalculate-baseline: baseline_source == RECALCULATED and activation succeeds (status == ACTIVE)"

      - name: record_create_with_draft_factor_returns_error
        claim_type: violation_to_error
        grounds:
          - validations[priority=16]
          - errors[ERR_FACTOR_NOT_PUBLISHED]
        distinguishing_aspect: "At creation the referenced factor must already be PUBLISHED: a DRAFT factor fails ERR_FACTOR_NOT_PUBLISHED even though it exists."
        test_recipe:
          setup: ["site active; factor left in DRAFT; cycle FY2026 in DATA_COLLECTION"]
          setup_api_calls:
            - { call: "POST /sustainability/sites", payload: { name: "Plant", country_code: "US", grid_region_code: "CA" }, as: SustainabilityManager, captures: { site: $.data.id } }
            - { call: "POST /sustainability/emission-factors", payload: { scope_category: "SCOPE1_STATIONARY", region_code: "GLOBAL", unit: "therm", value_tco2e_per_unit: 0.5, library_version: 1, valid_from: "2026-01-01T00:00:00Z", valid_to: "2026-12-31T23:59:59Z" }, as: SustainabilityManager, captures: { f: $.data.id } }
            - { call: "POST /sustainability/cycles", payload: { name: "FY2026", reporting_year: 2026 }, as: SustainabilityManager, captures: { cyc: $.data.id } }
            - { call: "POST /sustainability/cycles/${cyc}/transition", payload: { to_state: "DATA_COLLECTION" }, as: SustainabilityManager }
          trigger:
            - { call: "POST /sustainability/activity-records", payload: { cycle_id: "${cyc}", site_id: "${site}", factor_id: "${f}", activity_type: "STATIONARY_FUEL", quantity: 10, unit: "therm", period_start: "2026-01-01T00:00:00Z", period_end: "2026-02-01T00:00:00Z" }, as: SiteDataSteward, as_user_id: "steward-1", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_FACTOR_NOT_PUBLISHED (422)"

      - name: error_period_overlap_covered_by_difficulty
        claim_type: violation_to_error
        grounds:
          - errors[ERR_PERIOD_OVERLAP]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / activity_periods_half_open_overlap_and_adjacency
          rationale: "Asserted as the failure leg of the half-open overlap difficulty instance."

      - name: error_factor_window_overlap_covered_by_difficulty
        claim_type: violation_to_error
        grounds:
          - errors[ERR_FACTOR_WINDOW_OVERLAP]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / factor_windows_closed_touching_is_overlap
          rationale: "Asserted as the failure leg of the closed-window overlap difficulty instance."

      - name: error_readiness_threshold_covered_by_difficulty
        claim_type: violation_to_error
        grounds:
          - errors[ERR_READINESS_BELOW_THRESHOLD]
        excluded_because:
          difficulty_instance: boundary_precision_check / readiness_threshold_exactly_80_passes
          rationale: "Asserted at readiness 60.0 in the difficulty instance's first trigger leg."

      - name: error_cycle_not_collecting_covered_by_difficulty
        claim_type: violation_to_error
        grounds:
          - errors[ERR_CYCLE_NOT_COLLECTING]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / record_create_requires_cycle_collecting
          rationale: "Asserted as the cross-entity gate failure in the difficulty instance (also exercised in create_record_state_beats_temporal and disclosed_cycle_terminal_lockdown)."

      - name: error_site_inactive_covered_by_difficulty
        claim_type: violation_to_error
        grounds:
          - errors[ERR_SITE_INACTIVE]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / instrument_retire_requires_active_site
          rationale: "Asserted as the failure path of the difficulty instance."

      - name: error_segregation_at_approve_covered_by_difficulty
        claim_type: violation_to_error
        grounds:
          - errors[ERR_SEGREGATION_OF_DUTIES]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / approve_record_safety_beats_referential
          rationale: "Asserted as the winning error of the safety-vs-referential priority pair; evidence-side SoD is exercised in evidence_reject_and_sod_guard."

      - name: error_factor_not_published_at_approve_covered_by_difficulty
        claim_type: violation_to_error
        grounds:
          - errors[ERR_FACTOR_NOT_PUBLISHED]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / approve_record_safety_beats_referential
          rationale: "Asserted as the second trigger leg (post-approval-attempt referential failure); the create-time leg is covered by record_create_with_draft_factor_returns_error."

  # ===========================================================================
  # Section: endpoints
  # ===========================================================================
  - section: endpoints
    instances:
      - name: inventory_results_filter_by_cycle
        claim_type: computed_read
        grounds:
          - endpoints[GET /sustainability/inventory-results]
          - entities.InventoryResult.fields.cycle_id
        distinguishing_aspect: "The filtered list returns exactly the singleton InventoryResult of the requested cycle (array of length 1), isolating it from a second cycle's result."
        test_recipe:
          setup: ["two cycles FY2025 and FY2026, each recalculated once (both CURRENT)"]
          setup_api_calls:
            - { call: "POST /sustainability/cycles", payload: { name: "FY2025", reporting_year: 2025 }, as: SustainabilityManager, captures: { cyc_a: $.data.id } }
            - { call: "POST /sustainability/cycles/${cyc_a}/transition", payload: { to_state: "DATA_COLLECTION" }, as: SustainabilityManager }
            - { call: "GET /sustainability/cycles/${cyc_a}", as: SustainabilityManager, captures: { va: $.data.version } }
            - { call: "POST /sustainability/cycles/${cyc_a}/inventory/recalculate", payload: { expected_cycle_version: "${va}" }, as: SustainabilityManager }
            - { call: "POST /sustainability/cycles", payload: { name: "FY2026", reporting_year: 2026 }, as: SustainabilityManager, captures: { cyc_b: $.data.id } }
            - { call: "POST /sustainability/cycles/${cyc_b}/transition", payload: { to_state: "DATA_COLLECTION" }, as: SustainabilityManager }
            - { call: "GET /sustainability/cycles/${cyc_b}", as: SustainabilityManager, captures: { vb: $.data.version } }
            - { call: "POST /sustainability/cycles/${cyc_b}/inventory/recalculate", payload: { expected_cycle_version: "${vb}" }, as: SustainabilityManager }
          trigger:
            - { call: "GET /sustainability/inventory-results", payload: { cycle_id: "${cyc_a}" }, as: SustainabilityManager, captures: { row_cycle: "$.data[0].cycle_id", row_status: "$.data[0].status" } }
          assert:
            - "filtered list returns exactly 1 row and its cycle_id == ${cyc_a}"
            - "row status == CURRENT (recalculated), response_type == array"

      - name: evidence_upload_computes_retention_and_supersede_chain_visible
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /sustainability/activity-records/{id}/evidence]
          - entities.EvidenceItem.fields.retention_until
          - entities.EvidenceItem.fields.supersedes_evidence_id
        distinguishing_aspect: "Upload computes retention_until = cycle reporting_year-12-31T23:59:59Z + 7 years (2033-12-31T23:59:59Z for FY2026) and the supersede chain is discoverable via the supersedes_evidence_id filter."
        test_recipe:
          setup: ["cycle FY2026 in DATA_COLLECTION; one record APPROVED with VERIFIED evidence ev1"]
          setup_api_calls:
            - { call: "POST /sustainability/sites", payload: { name: "Plant", country_code: "US", grid_region_code: "CA" }, as: SustainabilityManager, captures: { site: $.data.id } }
            - { call: "POST /sustainability/emission-factors", payload: { scope_category: "SCOPE1_STATIONARY", region_code: "GLOBAL", unit: "therm", value_tco2e_per_unit: 0.5, library_version: 1, valid_from: "2026-01-01T00:00:00Z", valid_to: "2026-12-31T23:59:59Z" }, as: SustainabilityManager, captures: { f: $.data.id } }
            - { call: "POST /sustainability/emission-factors/${f}/transition", payload: { to_state: "PUBLISHED" }, as: SustainabilityManager }
            - { call: "POST /sustainability/cycles", payload: { name: "FY2026", reporting_year: 2026 }, as: SustainabilityManager, captures: { cyc: $.data.id } }
            - { call: "POST /sustainability/cycles/${cyc}/transition", payload: { to_state: "DATA_COLLECTION" }, as: SustainabilityManager }
            - { call: "POST /sustainability/activity-records", payload: { cycle_id: "${cyc}", site_id: "${site}", factor_id: "${f}", activity_type: "STATIONARY_FUEL", quantity: 100, unit: "therm", period_start: "2026-01-01T00:00:00Z", period_end: "2026-02-01T00:00:00Z" }, as: SiteDataSteward, as_user_id: "steward-1", captures: { rec: $.data.id } }
            - { call: "POST /sustainability/activity-records/${rec}/transition", payload: { to_state: "UNDER_REVIEW" }, as: SiteDataSteward, as_user_id: "steward-1" }
            - { call: "POST /sustainability/activity-records/${rec}/transition", payload: { to_state: "APPROVED" }, as: SustainabilityAnalyst, as_user_id: "analyst-1" }
            - { call: "POST /sustainability/activity-records/${rec}/evidence", payload: { file_name: "invoice-v1.pdf", sha256_hex: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa" }, as: SiteDataSteward, as_user_id: "steward-1", captures: { ev1: $.data.id, ret: $.data.retention_until } }
            - { call: "POST /sustainability/evidence-items/${ev1}/transition", payload: { to_state: "VERIFIED" }, as: SustainabilityAnalyst, as_user_id: "analyst-1" }
          trigger:
            - { call: "POST /sustainability/activity-records/${rec}/evidence", payload: { file_name: "invoice-v2.pdf", sha256_hex: "bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb", supersedes_evidence_id: "${ev1}" }, as: SiteDataSteward, as_user_id: "steward-1", captures: { ev2: $.data.id } }
            - { call: "GET /sustainability/evidence-items", payload: { supersedes_evidence_id: "${ev1}" }, as: SustainabilityManager, captures: { child: "$.data[0].id" } }
          assert:
            - "ev1 retention_until == 2033-12-31T23:59:59Z (computed: 2026 cycle year end + 7 years)"
            - "filtered list by supersedes_evidence_id == ev1 returns exactly the replacement item ev2 (self-referential chain is queryable)"

  # ===========================================================================
  # Section: errors (residual triggers not covered elsewhere)
  # ===========================================================================
  - section: errors
    instances:
      - name: engagement_respond_after_close_returns_invalid_state
        claim_type: violation_to_error
        grounds:
          - errors[ERR_INVALID_STATE]
          - state_machines.SupplierEngagement
        distinguishing_aspect: "respond on a CLOSED_NO_DATA engagement violates the from-state set {INVITED, NEEDS_REVISION} and fails ERR_INVALID_STATE."
        test_recipe:
          setup: ["cycle FY2026 in DATA_COLLECTION; engagement with due_date 2026-06-01 auto-closed by clock advance to 2026-09-01"]
          setup_api_calls:
            - { call: "POST /sustainability/cycles", payload: { name: "FY2026", reporting_year: 2026 }, as: SustainabilityManager, captures: { cyc: $.data.id } }
            - { call: "POST /sustainability/cycles/${cyc}/transition", payload: { to_state: "DATA_COLLECTION" }, as: SustainabilityManager }
            - { call: "POST /sustainability/supplier-engagements", payload: { cycle_id: "${cyc}", supplier_name: "Late Co", category: "CAPITAL_GOODS", spend_usd: 5000, contact_user_id: "supplier-9", due_date: "2026-06-01T00:00:00Z" }, as: SustainabilityAnalyst, as_user_id: "analyst-1", captures: { eng: $.data.id } }
            - { call: "POST /sustainability/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: SustainabilityManager, captures: { closed: $.data.engagements_closed } }
          trigger:
            - { call: "POST /sustainability/supplier-engagements/${eng}/respond", payload: { supplier_tco2e: 3.0 }, as: SupplierContact, as_user_id: "supplier-9", captures: { err: $.data.error_id } }
          assert:
            - "clock advance reports engagements_closed == 1 and GET engagement shows status == CLOSED_NO_DATA"
            - "respond after close: error_id == ERR_INVALID_STATE"

  # ===========================================================================
  # Section: roles (RBAC)
  # ===========================================================================
  - section: roles
    instances:
      - name: steward_cannot_create_emission_factor
        claim_type: role_denied
        grounds:
          - roles[SustainabilityManager]
          - roles[SiteDataSteward]
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: "EmissionFactor creation is Manager-exclusive: a SiteDataSteward caller is refused with ERR_UNAUTHORIZED (403)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /sustainability/emission-factors", payload: { scope_category: "SCOPE2_GRID", region_code: "CA", unit: "MWh", value_tco2e_per_unit: 0.4, library_version: 1, valid_from: "2026-01-01T00:00:00Z", valid_to: "2026-12-31T23:59:59Z" }, as: SiteDataSteward, as_user_id: "steward-1", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_UNAUTHORIZED (403)"

      - name: manager_cannot_respond_to_engagement
        claim_type: role_denied
        grounds:
          - roles[SupplierContact]
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: "respond is SupplierContact-exclusive: even the SustainabilityManager role is refused with ERR_UNAUTHORIZED."
        test_recipe:
          setup: ["cycle FY2026 in DATA_COLLECTION; engagement INVITED with contact supplier-1"]
          setup_api_calls:
            - { call: "POST /sustainability/cycles", payload: { name: "FY2026", reporting_year: 2026 }, as: SustainabilityManager, captures: { cyc: $.data.id } }
            - { call: "POST /sustainability/cycles/${cyc}/transition", payload: { to_state: "DATA_COLLECTION" }, as: SustainabilityManager }
            - { call: "POST /sustainability/supplier-engagements", payload: { cycle_id: "${cyc}", supplier_name: "Acme Steel", category: "PURCHASED_GOODS", spend_usd: 10000, contact_user_id: "supplier-1", due_date: "2026-12-31T00:00:00Z" }, as: SustainabilityAnalyst, as_user_id: "analyst-1", captures: { eng: $.data.id } }
          trigger:
            - { call: "POST /sustainability/supplier-engagements/${eng}/respond", payload: { supplier_tco2e: 7.5 }, as: SustainabilityManager, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_UNAUTHORIZED (role gate fires before ownership comparison)"

      - name: wrong_supplier_contact_cannot_respond
        claim_type: role_denied
        grounds:
          - roles[SupplierContact]
          - entities.SupplierEngagement.fields.contact_user_id
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: "Ownership check for the opaque SupplierContact role: X-User-ID supplier-2 != contact_user_id supplier-1 fails ERR_UNAUTHORIZED; supplier-1 succeeds."
        test_recipe:
          setup: ["cycle FY2026 in DATA_COLLECTION; engagement INVITED with contact supplier-1"]
          setup_api_calls:
            - { call: "POST /sustainability/cycles", payload: { name: "FY2026", reporting_year: 2026 }, as: SustainabilityManager, captures: { cyc: $.data.id } }
            - { call: "POST /sustainability/cycles/${cyc}/transition", payload: { to_state: "DATA_COLLECTION" }, as: SustainabilityManager }
            - { call: "POST /sustainability/supplier-engagements", payload: { cycle_id: "${cyc}", supplier_name: "Acme Steel", category: "PURCHASED_GOODS", spend_usd: 10000, contact_user_id: "supplier-1", due_date: "2026-12-31T00:00:00Z" }, as: SustainabilityAnalyst, as_user_id: "analyst-1", captures: { eng: $.data.id } }
          trigger:
            - { call: "POST /sustainability/supplier-engagements/${eng}/respond", payload: { supplier_tco2e: 7.5 }, as: SupplierContact, as_user_id: "supplier-2", captures: { err: $.data.error_id } }
            - { call: "POST /sustainability/supplier-engagements/${eng}/respond", payload: { supplier_tco2e: 7.5 }, as: SupplierContact, as_user_id: "supplier-1", captures: { st: $.data.status } }
          assert:
            - "supplier-2: error_id == ERR_UNAUTHORIZED"
            - "supplier-1 (the registered contact): status == RESPONDED"

      - name: review_decision_by_preparer_returns_sod
        claim_type: segregation_of_duties
        grounds:
          - validations[priority=7]
          - roles[SustainabilityManager]
          - entities.QuestionnaireResponse.fields.prepared_by_user_id
          - errors[ERR_SEGREGATION_OF_DUTIES]
        distinguishing_aspect: "The questionnaire reviewer must differ from the preparer: a review-decision carrying the preparer's user id (lead-1) fails ERR_SEGREGATION_OF_DUTIES; a different manager approves."
        test_recipe:
          setup: ["cycle FY2026 in DATA_COLLECTION; CDP questionnaire prepared by lead-1, fully answered, IN_REVIEW"]
          setup_api_calls:
            - { call: "POST /sustainability/cycles", payload: { name: "FY2026", reporting_year: 2026 }, as: SustainabilityManager, captures: { cyc: $.data.id } }
            - { call: "POST /sustainability/cycles/${cyc}/transition", payload: { to_state: "DATA_COLLECTION" }, as: SustainabilityManager }
            - { call: "POST /sustainability/questionnaire-responses", payload: { cycle_id: "${cyc}", framework: "CDP" }, as: DisclosureLead, as_user_id: "lead-1", captures: { qr: $.data.id } }
            - { call: "POST /sustainability/questionnaire-responses/${qr}/answers", payload: { section_key: "GOVERNANCE", answer_text: "Board oversight" }, as: DisclosureLead, as_user_id: "lead-1" }
            - { call: "POST /sustainability/questionnaire-responses/${qr}/answers", payload: { section_key: "RISKS", answer_text: "Risk register" }, as: DisclosureLead, as_user_id: "lead-1" }
            - { call: "POST /sustainability/questionnaire-responses/${qr}/answers", payload: { section_key: "EMISSIONS", answer_text: "Inventory summary" }, as: DisclosureLead, as_user_id: "lead-1" }
            - { call: "POST /sustainability/questionnaire-responses/${qr}/answers", payload: { section_key: "TARGETS", answer_text: "50 by 2030" }, as: DisclosureLead, as_user_id: "lead-1" }
            - { call: "POST /sustainability/questionnaire-responses/${qr}/transition", payload: { to_state: "IN_REVIEW" }, as: DisclosureLead, as_user_id: "lead-1" }
          trigger:
            - { call: "POST /sustainability/questionnaire-responses/${qr}/review-decision", payload: { decision: "APPROVE" }, as: SustainabilityManager, as_user_id: "lead-1", captures: { err: $.data.error_id } }
            - { call: "POST /sustainability/questionnaire-responses/${qr}/review-decision", payload: { decision: "APPROVE", review_notes: "ok" }, as: SustainabilityManager, as_user_id: "manager-1", captures: { st: $.data.status, by: $.data.review_decision_by } }
          assert:
            - "decision by user id lead-1 (the preparer): error_id == ERR_SEGREGATION_OF_DUTIES"
            - "decision by manager-1: status == APPROVED, review_decision_by == manager-1"

      - name: site_create_missing_auth_returns_unauthenticated
        claim_type: role_denied
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "A call with no recognized role header is refused with ERR_UNAUTHENTICATED (401) before any authorization or existence check."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /sustainability/sites", payload: { name: "Gamma", country_code: "US", grid_region_code: "WA" }, as: Anonymous, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_UNAUTHENTICATED (401)"

  # ===========================================================================
  # Section: cross-cutting complexity layers
  # ===========================================================================
  - section: cross_cutting_layers
    instances:
      - name: recalculate_with_stale_cycle_version_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[recalc-stale-cycle]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "OCC on ReportingCycle.version: a recalculate carrying the version observed before an intervening approval (which bumped the version) is rejected 412; refetching and retrying succeeds."
        test_recipe:
          setup: ["cycle FY2026 in DATA_COLLECTION; client has observed version N; one record approved afterwards (cascade bumps version to N+1)"]
          setup_api_calls:
            - { call: "POST /sustainability/sites", payload: { name: "Plant", country_code: "US", grid_region_code: "CA" }, as: SustainabilityManager, captures: { site: $.data.id } }
            - { call: "POST /sustainability/emission-factors", payload: { scope_category: "SCOPE1_STATIONARY", region_code: "GLOBAL", unit: "therm", value_tco2e_per_unit: 0.5, library_version: 1, valid_from: "2026-01-01T00:00:00Z", valid_to: "2026-12-31T23:59:59Z" }, as: SustainabilityManager, captures: { f: $.data.id } }
            - { call: "POST /sustainability/emission-factors/${f}/transition", payload: { to_state: "PUBLISHED" }, as: SustainabilityManager }
            - { call: "POST /sustainability/cycles", payload: { name: "FY2026", reporting_year: 2026 }, as: SustainabilityManager, captures: { cyc: $.data.id } }
            - { call: "POST /sustainability/cycles/${cyc}/transition", payload: { to_state: "DATA_COLLECTION" }, as: SustainabilityManager }
            - { call: "GET /sustainability/cycles/${cyc}", as: SustainabilityManager, captures: { v_stale: $.data.version } }
            - { call: "POST /sustainability/activity-records", payload: { cycle_id: "${cyc}", site_id: "${site}", factor_id: "${f}", activity_type: "STATIONARY_FUEL", quantity: 10, unit: "therm", period_start: "2026-01-01T00:00:00Z", period_end: "2026-02-01T00:00:00Z" }, as: SiteDataSteward, as_user_id: "steward-1", captures: { rec: $.data.id } }
            - { call: "POST /sustainability/activity-records/${rec}/transition", payload: { to_state: "UNDER_REVIEW" }, as: SiteDataSteward, as_user_id: "steward-1" }
            - { call: "POST /sustainability/activity-records/${rec}/transition", payload: { to_state: "APPROVED" }, as: SustainabilityAnalyst, as_user_id: "analyst-1" }
          trigger:
            - { call: "POST /sustainability/cycles/${cyc}/inventory/recalculate", payload: { expected_cycle_version: "${v_stale}" }, as: SustainabilityManager, captures: { err: $.data.error_id } }
            - { call: "GET /sustainability/cycles/${cyc}", as: SustainabilityManager, captures: { v_fresh: $.data.version } }
            - { call: "POST /sustainability/cycles/${cyc}/inventory/recalculate", payload: { expected_cycle_version: "${v_fresh}" }, as: SustainabilityManager, captures: { ist: $.data.status } }
          assert:
            - "recalculate with the pre-approval version: error_id == ERR_STALE_VERSION (412)"
            - "recalculate with the freshly read version: status == CURRENT (200)"

      - name: baseline_recalc_with_stale_target_version_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[baseline-recalc-stale-target]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "OCC on EmissionTarget.version: the create-time version (1) is stale once the target moved to APPROVED (2); recalculate-baseline with the stale version fails 412, with the fresh version succeeds."
        test_recipe:
          setup: ["LOCKED 2025 base cycle (frozen total 100.00); target T created (version captured) then moved to APPROVED"]
          setup_api_calls:
            - { call: "POST /sustainability/sites", payload: { name: "Plant", country_code: "US", grid_region_code: "CA" }, as: SustainabilityManager, captures: { site: $.data.id } }
            - { call: "POST /sustainability/emission-factors", payload: { scope_category: "SCOPE1_STATIONARY", region_code: "GLOBAL", unit: "therm", value_tco2e_per_unit: 1.0, library_version: 1, valid_from: "2025-01-01T00:00:00Z", valid_to: "2025-12-31T23:59:59Z" }, as: SustainabilityManager, captures: { f: $.data.id } }
            - { call: "POST /sustainability/emission-factors/${f}/transition", payload: { to_state: "PUBLISHED" }, as: SustainabilityManager }
            - { call: "POST /sustainability/cycles", payload: { name: "FY2025", reporting_year: 2025 }, as: SustainabilityManager, captures: { cyc: $.data.id } }
            - { call: "POST /sustainability/cycles/${cyc}/transition", payload: { to_state: "DATA_COLLECTION" }, as: SustainabilityManager }
            - { call: "POST /sustainability/activity-records", payload: { cycle_id: "${cyc}", site_id: "${site}", factor_id: "${f}", activity_type: "STATIONARY_FUEL", quantity: 100, unit: "therm", period_start: "2025-01-01T00:00:00Z", period_end: "2025-02-01T00:00:00Z" }, as: SiteDataSteward, as_user_id: "steward-1", captures: { rec: $.data.id } }
            - { call: "POST /sustainability/activity-records/${rec}/transition", payload: { to_state: "UNDER_REVIEW" }, as: SiteDataSteward, as_user_id: "steward-1" }
            - { call: "POST /sustainability/activity-records/${rec}/transition", payload: { to_state: "APPROVED" }, as: SustainabilityAnalyst, as_user_id: "analyst-1" }
            - { call: "GET /sustainability/cycles/${cyc}", as: SustainabilityManager, captures: { cyc_v: $.data.version } }
            - { call: "POST /sustainability/cycles/${cyc}/inventory/recalculate", payload: { expected_cycle_version: "${cyc_v}" }, as: SustainabilityManager }
            - { call: "POST /sustainability/cycles/${cyc}/transition", payload: { to_state: "UNDER_REVIEW" }, as: SustainabilityManager }
            - { call: "POST /sustainability/cycles/${cyc}/transition", payload: { to_state: "LOCKED" }, as: SustainabilityManager }
            - { call: "POST /sustainability/targets", payload: { name: "T1", base_year: 2025, target_year: 2030, reduction_pct: 50, scope_coverage: "SCOPE1_2_3", base_year_total_tco2e: 90 }, as: SustainabilityManager, captures: { tgt: $.data.id, tgt_v_stale: $.data.version } }
            - { call: "POST /sustainability/targets/${tgt}/transition", payload: { to_state: "APPROVED" }, as: SustainabilityManager }
          trigger:
            - { call: "POST /sustainability/targets/${tgt}/recalculate-baseline", payload: { base_cycle_id: "${cyc}", expected_target_version: "${tgt_v_stale}" }, as: SustainabilityManager, captures: { err: $.data.error_id } }
            - { call: "GET /sustainability/targets/${tgt}", as: SustainabilityManager, captures: { tgt_v_fresh: $.data.version } }
            - { call: "POST /sustainability/targets/${tgt}/recalculate-baseline", payload: { base_cycle_id: "${cyc}", expected_target_version: "${tgt_v_fresh}" }, as: SustainabilityManager, captures: { base: $.data.base_year_total_tco2e, src: $.data.baseline_source } }
          assert:
            - "stale create-time version after APPROVED transition: error_id == ERR_STALE_VERSION (412)"
            - "fresh version: base_year_total_tco2e == 100.0 and baseline_source == RECALCULATED"

      - name: factor_snapshot_pinned_at_approval
        claim_type: version_pinning_on_approval
        grounds: [entities.ActivityRecord.fields.factor_value_snapshot, calculations.record_tco2e, state_machines.EmissionFactor.PUBLISHED_to_RETIRED]
        distinguishing_aspect: "Approval pins factor_value_snapshot: retiring the factor and publishing a 0.9 replacement for the same key/window does NOT change the approved record's contribution — scope1 stays 50.0 after recalc."
        test_recipe:
          setup: ["cycle FY2026 in DATA_COLLECTION; factor v1 (0.5) PUBLISHED; record 100 therm APPROVED (snapshot 0.5, tco2e 50.0000); factor v1 RETIRED; replacement factor v2 (0.9) same key/window PUBLISHED"]
          setup_api_calls:
            - { call: "POST /sustainability/sites", payload: { name: "Plant", country_code: "US", grid_region_code: "CA" }, as: SustainabilityManager, captures: { site: $.data.id } }
            - { call: "POST /sustainability/emission-factors", payload: { scope_category: "SCOPE1_STATIONARY", region_code: "GLOBAL", unit: "therm", value_tco2e_per_unit: 0.5, library_version: 1, valid_from: "2026-01-01T00:00:00Z", valid_to: "2026-12-31T23:59:59Z" }, as: SustainabilityManager, captures: { f1: $.data.id } }
            - { call: "POST /sustainability/emission-factors/${f1}/transition", payload: { to_state: "PUBLISHED" }, as: SustainabilityManager }
            - { call: "POST /sustainability/cycles", payload: { name: "FY2026", reporting_year: 2026 }, as: SustainabilityManager, captures: { cyc: $.data.id } }
            - { call: "POST /sustainability/cycles/${cyc}/transition", payload: { to_state: "DATA_COLLECTION" }, as: SustainabilityManager }
            - { call: "POST /sustainability/activity-records", payload: { cycle_id: "${cyc}", site_id: "${site}", factor_id: "${f1}", activity_type: "STATIONARY_FUEL", quantity: 100, unit: "therm", period_start: "2026-01-01T00:00:00Z", period_end: "2026-02-01T00:00:00Z" }, as: SiteDataSteward, as_user_id: "steward-1", captures: { rec: $.data.id } }
            - { call: "POST /sustainability/activity-records/${rec}/transition", payload: { to_state: "UNDER_REVIEW" }, as: SiteDataSteward, as_user_id: "steward-1" }
            - { call: "POST /sustainability/activity-records/${rec}/transition", payload: { to_state: "APPROVED" }, as: SustainabilityAnalyst, as_user_id: "analyst-1", captures: { snap: $.data.factor_value_snapshot } }
            - { call: "POST /sustainability/emission-factors/${f1}/transition", payload: { to_state: "RETIRED" }, as: SustainabilityManager }
            - { call: "POST /sustainability/emission-factors", payload: { scope_category: "SCOPE1_STATIONARY", region_code: "GLOBAL", unit: "therm", value_tco2e_per_unit: 0.9, library_version: 2, valid_from: "2026-01-01T00:00:00Z", valid_to: "2026-12-31T23:59:59Z" }, as: SustainabilityManager, captures: { f2: $.data.id } }
            - { call: "POST /sustainability/emission-factors/${f2}/transition", payload: { to_state: "PUBLISHED" }, as: SustainabilityManager }
          trigger:
            - { call: "GET /sustainability/cycles/${cyc}", as: SustainabilityManager, captures: { cyc_v: $.data.version } }
            - { call: "POST /sustainability/cycles/${cyc}/inventory/recalculate", payload: { expected_cycle_version: "${cyc_v}" }, as: SustainabilityManager, captures: { s1: $.data.scope1_tco2e } }
          assert:
            - "approval response factor_value_snapshot == 0.5 (pinned at approval)"
            - "after retiring the 0.5 factor and publishing a 0.9 replacement, recalc still yields scope1_tco2e == 50.0 (snapshot used, not the live library)"

      - name: clock_advances_past_due_date_closes_engagement
        claim_type: scheduled_actions
        grounds:
          - state_machines.SupplierEngagement.INVITED_to_CLOSED_NO_DATA
          - endpoints[POST /sustainability/_clock/set_current_utc]
        distinguishing_aspect: "Due-based system transition driven by the logical clock: advancing past due_date closes the INVITED engagement (engagements_closed == 1) and marks the inventory STALE."
        test_recipe:
          setup: ["cycle FY2026 in DATA_COLLECTION; one engagement INVITED with due_date 2026-06-01; inventory CURRENT after a recalc"]
          setup_api_calls:
            - { call: "POST /sustainability/cycles", payload: { name: "FY2026", reporting_year: 2026 }, as: SustainabilityManager, captures: { cyc: $.data.id } }
            - { call: "POST /sustainability/cycles/${cyc}/transition", payload: { to_state: "DATA_COLLECTION" }, as: SustainabilityManager }
            - { call: "POST /sustainability/supplier-engagements", payload: { cycle_id: "${cyc}", supplier_name: "Late Co", category: "UPSTREAM_TRANSPORT", spend_usd: 5000, contact_user_id: "supplier-1", due_date: "2026-06-01T00:00:00Z" }, as: SustainabilityAnalyst, as_user_id: "analyst-1", captures: { eng: $.data.id } }
            - { call: "GET /sustainability/cycles/${cyc}", as: SustainabilityManager, captures: { cyc_v: $.data.version } }
            - { call: "POST /sustainability/cycles/${cyc}/inventory/recalculate", payload: { expected_cycle_version: "${cyc_v}" }, as: SustainabilityManager }
          trigger:
            - { call: "POST /sustainability/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: SustainabilityManager, captures: { closed: $.data.engagements_closed } }
            - { call: "GET /sustainability/supplier-engagements/${eng}", as: SustainabilityManager, captures: { st: $.data.status } }
            - { call: "GET /sustainability/inventory-results", payload: { cycle_id: "${cyc}" }, as: SustainabilityManager, captures: { inv: "$.data[0].status" } }
          assert:
            - "clock response engagements_closed == 1 (due_date 2026-06-01 < 2026-09-01)"
            - "engagement status == CLOSED_NO_DATA (system transition, no manual action)"
            - "InventoryResult.status == STALE (auto-close fired the staleness side effect)"

      - name: clock_past_target_year_evaluates_achieved_and_missed
        claim_type: scheduled_actions
        grounds: [state_machines.EmissionTarget.ACTIVE_to_ACHIEVED, state_machines.EmissionTarget.ACTIVE_to_MISSED]
        distinguishing_aspect: "Year-boundary evaluation at clock advance: the ON_TRACK target ends ACHIEVED and the never-evaluated (NOT_EVALUATED) target ends MISSED when the clock enters 2031."
        test_recipe:
          setup: ["cycle FY2026 in DATA_COLLECTION; target T1 ACTIVE with trajectory ON_TRACK (recalc with zero records: actual 100.0% >= required 10.0% - 2.0); target T2 ACTIVE, never evaluated (NOT_EVALUATED)"]
          setup_api_calls:
            - { call: "POST /sustainability/cycles", payload: { name: "FY2026", reporting_year: 2026 }, as: SustainabilityManager, captures: { cyc: $.data.id } }
            - { call: "POST /sustainability/cycles/${cyc}/transition", payload: { to_state: "DATA_COLLECTION" }, as: SustainabilityManager }
            - { call: "POST /sustainability/targets", payload: { name: "T1", base_year: 2025, target_year: 2030, reduction_pct: 50, scope_coverage: "SCOPE1_2_3", base_year_total_tco2e: 1000 }, as: SustainabilityManager, captures: { t1: $.data.id } }
            - { call: "POST /sustainability/targets/${t1}/transition", payload: { to_state: "APPROVED" }, as: SustainabilityManager }
            - { call: "POST /sustainability/targets/${t1}/transition", payload: { to_state: "ACTIVE" }, as: SustainabilityManager }
            - { call: "GET /sustainability/cycles/${cyc}", as: SustainabilityManager, captures: { cyc_v: $.data.version } }
            - { call: "POST /sustainability/cycles/${cyc}/inventory/recalculate", payload: { expected_cycle_version: "${cyc_v}" }, as: SustainabilityManager }
            - { call: "POST /sustainability/targets", payload: { name: "T2", base_year: 2025, target_year: 2030, reduction_pct: 60, scope_coverage: "SCOPE1_2_3", base_year_total_tco2e: 1000 }, as: SustainabilityManager, captures: { t2: $.data.id } }
            - { call: "POST /sustainability/targets/${t2}/transition", payload: { to_state: "APPROVED" }, as: SustainabilityManager }
            - { call: "POST /sustainability/targets/${t2}/transition", payload: { to_state: "ACTIVE" }, as: SustainabilityManager }
          trigger:
            - { call: "POST /sustainability/_clock/set_current_utc", payload: { to_iso8601: "2031-01-01T00:00:00Z" }, as: SustainabilityManager, captures: { evaluated: $.data.targets_evaluated } }
            - { call: "GET /sustainability/targets/${t1}", as: SustainabilityManager, captures: { s1: $.data.status } }
            - { call: "GET /sustainability/targets/${t2}", as: SustainabilityManager, captures: { s2: $.data.status } }
          assert:
            - "clock response targets_evaluated == 2 (both ACTIVE targets with target_year 2030 < 2031)"
            - "T1 (trajectory_status ON_TRACK): status == ACHIEVED"
            - "T2 (trajectory_status NOT_EVALUATED, never recalculated while watching): status == MISSED"

      - name: clock_expires_procured_instrument_past_vintage_window
        claim_type: scheduled_actions
        grounds: [state_machines.RenewableInstrument.PROCURED_to_EXPIRED]
        distinguishing_aspect: "A PROCURED instrument expires when the clock year exceeds vintage_year + 3 (vintage 2022 expires once the clock reads any 2026 date); an EXPIRED instrument can no longer be retired (ERR_INVALID_STATE)."
        test_recipe:
          setup: ["site active; cycle FY2026 in DATA_COLLECTION; instrument vintage 2022 still PROCURED"]
          setup_api_calls:
            - { call: "POST /sustainability/sites", payload: { name: "Alpha", country_code: "US", grid_region_code: "CA" }, as: SustainabilityManager, captures: { site: $.data.id } }
            - { call: "POST /sustainability/cycles", payload: { name: "FY2026", reporting_year: 2026 }, as: SustainabilityManager, captures: { cyc: $.data.id } }
            - { call: "POST /sustainability/cycles/${cyc}/transition", payload: { to_state: "DATA_COLLECTION" }, as: SustainabilityManager }
            - { call: "POST /sustainability/instruments", payload: { registry: "M-RETS", serial_number: "S-OLD", technology: "HYDRO", vintage_year: 2022, quantity_mwh: 10 }, as: SustainabilityManager, captures: { inst: $.data.id } }
          trigger:
            - { call: "POST /sustainability/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T00:00:00Z" }, as: SustainabilityManager, captures: { expired: $.data.instruments_expired } }
            - { call: "GET /sustainability/instruments/${inst}", as: SustainabilityManager, captures: { st: $.data.status } }
            - { call: "POST /sustainability/instruments/${inst}/retire", payload: { cycle_id: "${cyc}", site_id: "${site}" }, as: SustainabilityManager, captures: { err: $.data.error_id } }
          assert:
            - "clock response instruments_expired == 1 (2026 > 2022 + 3)"
            - "instrument status == EXPIRED"
            - "retire after expiry: error_id == ERR_INVALID_STATE (EXPIRED is terminal)"

      - name: supersede_drops_readiness_until_reverified
        claim_type: derived_field_reconciliation
        grounds: [state_machines.EvidenceItem.VERIFIED_to_SUPERSEDED, calculations.assurance_readiness_pct]
        distinguishing_aspect: "Superseding the only VERIFIED evidence recomputes readiness DOWN: the old item goes SUPERSEDED, its replacement is UPLOADED (uncovered), so the cycle's readiness_pct drops from 100.0 to 0.0 until the replacement is verified."
        test_recipe:
          setup: ["cycle FY2026 in DATA_COLLECTION; one APPROVED record qty 100 with ev1 VERIFIED (readiness 100.0)"]
          setup_api_calls:
            - { call: "POST /sustainability/sites", payload: { name: "Plant", country_code: "US", grid_region_code: "CA" }, as: SustainabilityManager, captures: { site: $.data.id } }
            - { call: "POST /sustainability/emission-factors", payload: { scope_category: "SCOPE1_STATIONARY", region_code: "GLOBAL", unit: "therm", value_tco2e_per_unit: 0.5, library_version: 1, valid_from: "2026-01-01T00:00:00Z", valid_to: "2026-12-31T23:59:59Z" }, as: SustainabilityManager, captures: { f: $.data.id } }
            - { call: "POST /sustainability/emission-factors/${f}/transition", payload: { to_state: "PUBLISHED" }, as: SustainabilityManager }
            - { call: "POST /sustainability/cycles", payload: { name: "FY2026", reporting_year: 2026 }, as: SustainabilityManager, captures: { cyc: $.data.id } }
            - { call: "POST /sustainability/cycles/${cyc}/transition", payload: { to_state: "DATA_COLLECTION" }, as: SustainabilityManager }
            - { call: "POST /sustainability/activity-records", payload: { cycle_id: "${cyc}", site_id: "${site}", factor_id: "${f}", activity_type: "STATIONARY_FUEL", quantity: 100, unit: "therm", period_start: "2026-01-01T00:00:00Z", period_end: "2026-02-01T00:00:00Z" }, as: SiteDataSteward, as_user_id: "steward-1", captures: { rec: $.data.id } }
            - { call: "POST /sustainability/activity-records/${rec}/transition", payload: { to_state: "UNDER_REVIEW" }, as: SiteDataSteward, as_user_id: "steward-1" }
            - { call: "POST /sustainability/activity-records/${rec}/transition", payload: { to_state: "APPROVED" }, as: SustainabilityAnalyst, as_user_id: "analyst-1" }
            - { call: "POST /sustainability/activity-records/${rec}/evidence", payload: { file_name: "invoice-v1.pdf", sha256_hex: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa" }, as: SiteDataSteward, as_user_id: "steward-1", captures: { ev1: $.data.id } }
            - { call: "POST /sustainability/evidence-items/${ev1}/transition", payload: { to_state: "VERIFIED" }, as: SustainabilityAnalyst, as_user_id: "analyst-1" }
            - { call: "GET /sustainability/cycles/${cyc}", as: SustainabilityManager, captures: { ready_before: $.data.readiness_pct } }
          trigger:
            - { call: "POST /sustainability/activity-records/${rec}/evidence", payload: { file_name: "invoice-v2.pdf", sha256_hex: "bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb", supersedes_evidence_id: "${ev1}" }, as: SiteDataSteward, as_user_id: "steward-1", captures: { ev2: $.data.id } }
            - { call: "GET /sustainability/evidence-items/${ev1}", as: SustainabilityManager, captures: { ev1_st: $.data.status } }
            - { call: "GET /sustainability/cycles/${cyc}", as: SustainabilityManager, captures: { ready_after: $.data.readiness_pct } }
          assert:
            - "before supersede: readiness_pct == 100.0"
            - "after supersede: ev1 status == SUPERSEDED and readiness_pct == 0.0 (replacement ev2 is UPLOADED, not yet VERIFIED)"

      - name: dual_variant_scope2_covered_by_difficulty
        claim_type: dual_variant_calculation
        grounds: [calculations.market_based_scope2]
        excluded_because:
          difficulty_instance: dual_variant_calc / scope2_location_vs_market_divergence
          rationale: "Both variants asserted with literal totals (40.0 vs 35.0) in the difficulty instance."

      - name: dual_variant_scope3_covered_by_difficulty
        claim_type: dual_variant_calculation
        grounds: [calculations.inventory_aggregation]
        excluded_because:
          difficulty_instance: dual_variant_calc / scope3_supplier_specific_vs_spend_based
          rationale: "Both variants asserted with literal totals (7.5 vs 5.0) in the difficulty instance."

      - name: approval_and_retirement_cascades_covered_by_difficulty
        claim_type: cascading_side_effects
        grounds: [state_machines.ActivityRecord.UNDER_REVIEW_to_APPROVED, state_machines.RenewableInstrument.PROCURED_to_RETIRED]
        excluded_because:
          difficulty_instance: transitive_cascade / approval_cascade_inventory_target_questionnaire
          rationale: "Both cascade chains (approval- and retirement-triggered) asserted hop-by-hop in the two difficulty instances."

  # ===========================================================================
  # Section: consistency model (immediate)
  # ===========================================================================
  - section: consistency_model
    instances:
      - name: approval_response_immediate_consistency
        claim_type: immediate
        grounds: [state_machines.ActivityRecord.UNDER_REVIEW_to_APPROVED, entities.ActivityRecord.fields.tco2e]
        distinguishing_aspect: "The approval response itself carries the computed fields (tco2e 50.0, factor_value_snapshot 0.5, status APPROVED) — no re-read is needed to observe the mutation."
        test_recipe:
          setup: ["cycle FY2026 in DATA_COLLECTION; factor 0.5 PUBLISHED; record 100 therm in UNDER_REVIEW"]
          setup_api_calls:
            - { call: "POST /sustainability/sites", payload: { name: "Plant", country_code: "US", grid_region_code: "CA" }, as: SustainabilityManager, captures: { site: $.data.id } }
            - { call: "POST /sustainability/emission-factors", payload: { scope_category: "SCOPE1_STATIONARY", region_code: "GLOBAL", unit: "therm", value_tco2e_per_unit: 0.5, library_version: 1, valid_from: "2026-01-01T00:00:00Z", valid_to: "2026-12-31T23:59:59Z" }, as: SustainabilityManager, captures: { f: $.data.id } }
            - { call: "POST /sustainability/emission-factors/${f}/transition", payload: { to_state: "PUBLISHED" }, as: SustainabilityManager }
            - { call: "POST /sustainability/cycles", payload: { name: "FY2026", reporting_year: 2026 }, as: SustainabilityManager, captures: { cyc: $.data.id } }
            - { call: "POST /sustainability/cycles/${cyc}/transition", payload: { to_state: "DATA_COLLECTION" }, as: SustainabilityManager }
            - { call: "POST /sustainability/activity-records", payload: { cycle_id: "${cyc}", site_id: "${site}", factor_id: "${f}", activity_type: "STATIONARY_FUEL", quantity: 100, unit: "therm", period_start: "2026-01-01T00:00:00Z", period_end: "2026-02-01T00:00:00Z" }, as: SiteDataSteward, as_user_id: "steward-1", captures: { rec: $.data.id } }
            - { call: "POST /sustainability/activity-records/${rec}/transition", payload: { to_state: "UNDER_REVIEW" }, as: SiteDataSteward, as_user_id: "steward-1" }
          trigger:
            - { call: "POST /sustainability/activity-records/${rec}/transition", payload: { to_state: "APPROVED" }, as: SustainabilityAnalyst, as_user_id: "analyst-1", captures: { st: $.data.status, tco: $.data.tco2e, snap: $.data.factor_value_snapshot, rev: $.data.reviewed_by_user_id } }
          assert:
            - "approval response: status == APPROVED, tco2e == 50.0, factor_value_snapshot == 0.5, reviewed_by_user_id == analyst-1 (all visible in the same response)"

      - name: reanswering_emissions_clears_stale_flag
        claim_type: immediate
        grounds:
          - entities.QuestionnaireResponse.fields.emissions_section_stale
          - endpoints[POST /sustainability/questionnaire-responses/{id}/answers]
        distinguishing_aspect: "The stale flag set by the approval cascade is cleared immediately and ONLY by re-answering the EMISSIONS section — answering a different section (TARGETS) leaves it true."
        test_recipe:
          setup: ["cycle FY2026 in DATA_COLLECTION; CDP questionnaire fully answered; ACTIVE target watching the cycle; inventory CURRENT; a record approval has just set emissions_section_stale == true"]
          setup_api_calls:
            - { call: "POST /sustainability/sites", payload: { name: "Plant", country_code: "US", grid_region_code: "CA" }, as: SustainabilityManager, captures: { site: $.data.id } }
            - { call: "POST /sustainability/emission-factors", payload: { scope_category: "SCOPE1_STATIONARY", region_code: "GLOBAL", unit: "therm", value_tco2e_per_unit: 0.5, library_version: 1, valid_from: "2026-01-01T00:00:00Z", valid_to: "2026-12-31T23:59:59Z" }, as: SustainabilityManager, captures: { f: $.data.id } }
            - { call: "POST /sustainability/emission-factors/${f}/transition", payload: { to_state: "PUBLISHED" }, as: SustainabilityManager }
            - { call: "POST /sustainability/cycles", payload: { name: "FY2026", reporting_year: 2026 }, as: SustainabilityManager, captures: { cyc: $.data.id } }
            - { call: "POST /sustainability/cycles/${cyc}/transition", payload: { to_state: "DATA_COLLECTION" }, as: SustainabilityManager }
            - { call: "POST /sustainability/questionnaire-responses", payload: { cycle_id: "${cyc}", framework: "CDP" }, as: DisclosureLead, as_user_id: "lead-1", captures: { qr: $.data.id } }
            - { call: "POST /sustainability/questionnaire-responses/${qr}/answers", payload: { section_key: "GOVERNANCE", answer_text: "Board oversight" }, as: DisclosureLead, as_user_id: "lead-1" }
            - { call: "POST /sustainability/questionnaire-responses/${qr}/answers", payload: { section_key: "RISKS", answer_text: "Risk register" }, as: DisclosureLead, as_user_id: "lead-1" }
            - { call: "POST /sustainability/questionnaire-responses/${qr}/answers", payload: { section_key: "EMISSIONS", answer_text: "Inventory summary" }, as: DisclosureLead, as_user_id: "lead-1" }
            - { call: "POST /sustainability/questionnaire-responses/${qr}/answers", payload: { section_key: "TARGETS", answer_text: "50 by 2030" }, as: DisclosureLead, as_user_id: "lead-1" }
            - { call: "POST /sustainability/targets", payload: { name: "T", base_year: 2025, target_year: 2030, reduction_pct: 50, scope_coverage: "SCOPE1_2_3", base_year_total_tco2e: 1000 }, as: SustainabilityManager, captures: { tgt: $.data.id } }
            - { call: "POST /sustainability/targets/${tgt}/transition", payload: { to_state: "APPROVED" }, as: SustainabilityManager }
            - { call: "POST /sustainability/targets/${tgt}/transition", payload: { to_state: "ACTIVE" }, as: SustainabilityManager }
            - { call: "POST /sustainability/activity-records", payload: { cycle_id: "${cyc}", site_id: "${site}", factor_id: "${f}", activity_type: "STATIONARY_FUEL", quantity: 100, unit: "therm", period_start: "2026-01-01T00:00:00Z", period_end: "2026-02-01T00:00:00Z" }, as: SiteDataSteward, as_user_id: "steward-1", captures: { rec: $.data.id } }
            - { call: "POST /sustainability/activity-records/${rec}/transition", payload: { to_state: "UNDER_REVIEW" }, as: SiteDataSteward, as_user_id: "steward-1" }
            - { call: "POST /sustainability/activity-records/${rec}/transition", payload: { to_state: "APPROVED" }, as: SustainabilityAnalyst, as_user_id: "analyst-1" }
            - { call: "GET /sustainability/questionnaire-responses/${qr}", as: DisclosureLead, as_user_id: "lead-1", captures: { stale_set: $.data.emissions_section_stale } }
          trigger:
            - { call: "POST /sustainability/questionnaire-responses/${qr}/answers", payload: { section_key: "TARGETS", answer_text: "revised targets text" }, as: DisclosureLead, as_user_id: "lead-1", captures: { stale_mid: $.data.emissions_section_stale } }
            - { call: "POST /sustainability/questionnaire-responses/${qr}/answers", payload: { section_key: "EMISSIONS", answer_text: "revised emissions text" }, as: DisclosureLead, as_user_id: "lead-1", captures: { stale_end: $.data.emissions_section_stale } }
          assert:
            - "after the approval cascade: emissions_section_stale == true"
            - "answering TARGETS does NOT clear it (still true) — only EMISSIONS clears the flag"
            - "answering EMISSIONS: emissions_section_stale == false in the same response"
