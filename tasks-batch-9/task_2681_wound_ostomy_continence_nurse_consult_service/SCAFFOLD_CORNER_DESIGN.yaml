            - "Derivation: the candidate set is {A1 observed 2026-08-03T00:00:00Z (SUPERSEDED but still in scope), A2 observed 2026-08-01T00:00:00Z}; ordered by observed_at ASC the earliest is 2026-08-01T00:00:00Z, which is NOT after window_end 2026-08-01T12:00:00Z, so the HAPI branch does not fire and the result falls through to INDETERMINATE"
