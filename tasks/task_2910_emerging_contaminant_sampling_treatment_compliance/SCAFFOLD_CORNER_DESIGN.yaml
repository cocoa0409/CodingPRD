      - name: the_notification_submission_gates_fire_in_ladder_order
        claim_type: error_triggerable
        grounds:
          - errors[ERR_NOTIFICATION_CONTENT_INCOMPLETE]
          - errors[ERR_DELIVERY_METHOD_INSUFFICIENT]
          - errors[ERR_NOTIFICATION_STATE_INVALID]
          - validations[priority=99]
