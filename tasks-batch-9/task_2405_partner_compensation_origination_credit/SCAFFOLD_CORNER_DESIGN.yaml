      - name: responsible_matter_count_reconciles_across_create_close_and_write_off
        claim_type: derived_field_reconciliation
        grounds:
          - entities.Partner.fields.responsible_matter_count
          - state_machines[Matter].transitions[OPEN->CLOSED]
          - state_machines[Matter].transitions[OPEN->WRITTEN_OFF]
          - endpoints[POST /comp/matters]
        distinguishing_aspect: |
          The derived counter is defined as the count of OPEN matters where the partner is
          responsible attorney, so it walks 0 -> 1 -> 2 -> 1 -> 0 across two creates, one
          CLOSED and one WRITTEN_OFF - the write-off decrements it even though the matter
          row still exists, because the definition filters on state, not on existence.
        test_recipe:
          setup:
