            - { call: "POST /ingredients", payload: { product_id: "${p1}", name: "A", crop_type: "NON_CROP", declared_weight_pct: 60.00 }, as: BrandRep, as_user_id: "${b1}" }
          trigger:
            - { call: "POST /ingredients", payload: { product_id: "${p1}", name: "B", crop_type: "NON_CROP", declared_weight_pct: 40.00 }, as: BrandRep, as_user_id: "${b1}", captures: { okB: $.data.id } }
            - { call: "POST /ingredients", payload: { product_id: "${p1}", name: "C", crop_type: "NON_CROP", declared_weight_pct: 0.01 }, as: BrandRep, as_user_id: "${b1}", captures: { err: $.data.error_id } }
          assert:
            - "60.00 + 40.00 == 100 exactly: accepted (201)"
            - "adding 0.01 (sum 100.01): error_id == ERR_WEIGHT_SUM_EXCEEDED and http status == 422"

      - name: sample_with_foreign_ingredient_returns_cross_reference
        claim_type: violation_to_error
        grounds: ["validations[priority=7]", "errors[ERR_CROSS_REFERENCE_MISMATCH]"]
        distinguishing_aspect: "Referential isolation: the plan is ACTIVE and the ingredient exists, but belongs to another product -> ERR_CROSS_REFERENCE_MISMATCH (state gate passes, priority 7 fires)."
        test_recipe:
