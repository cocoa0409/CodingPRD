# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Sports Game Licensing, Roster Updates & Likeness Royalties
# =============================================================================
scaffold_corner_design:

  - section: entities
    instances:
      - name: create_agreement_missing_required_field_returns_invalid_input
        claim_type: required_fields
        grounds: ["entities.LicenseAgreement", "endpoints", "errors[ERR_INVALID_INPUT]"]
        distinguishing_aspect: "POST /licensing/agreements without royalty_model is rejected with ERR_INVALID_INPUT before any state is persisted."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /licensing/agreements"
              payload: { licensor_type: "LEAGUE", licensor_name: "L", exclusivity_scope: "NONE", sport_category: "AMFOOT_PRO", term_start_on: "2026-01-01", term_end_on: "2026-12-31", royalty_rate_bps: 1000, minimum_guarantee_cents: 0, mg_recoupable: false, audit_window_days: 90 }
              as: LicensingAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST or ERR_INVALID_INPUT (400)"
            - "No LicenseAgreement is persisted"

      - name: athlete_defaults_status_ineligible_until_granted
        claim_type: defaults
        grounds: [entities.Athlete.fields.athlete_status]
        distinguishing_aspect: "A newly created athlete starts with athlete_status == INELIGIBLE and current_overall_rating null before any likeness grant or roster publication."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls:
            - call: "POST /licensing/athletes"
              payload: { full_name: "Rookie", sport_category: "AMFOOT_PRO", athlete_class: "ACTIVE_PRO", college_opt_in: false }
              as: RightsOfficer
              captures: { ath_id: $.data.id }
          trigger:
            - call: "GET /licensing/athletes/${ath_id}"
              payload: {}
              as: RightsOfficer
              captures: { st: $.data.athlete_status }
          assert:
            - "athlete_status == INELIGIBLE at creation"
            - "current_overall_rating is null"

      - name: get_nonexistent_agreement_returns_not_found
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]", "validations[priority=3]"]
        distinguishing_aspect: "GET on a well-formed but unknown agreement id returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /licensing/agreements/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: LicensingAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404 with error_id == ERR_NOT_FOUND"

      - name: ledger_entry_immutable_append_only
        claim_type: immutability
        grounds: [entities.WalletLedgerEntry]
        distinguishing_aspect: "WalletLedgerEntry declares common_fields: false — no update/delete endpoints exist and no version field is present on responses."
        test_recipe:
          setup:
            - "Agreement ACTIVE; season LIVE; wallet with a GRANT credit posted"
          setup_api_calls:
            - call: "POST /licensing/agreements"
              payload: { licensor_type: "LEAGUE", licensor_name: "L", exclusivity_scope: "NONE", sport_category: "AMFOOT_PRO", term_start_on: "2026-01-01", term_end_on: "2026-12-31", royalty_model: "PERCENT_OF_NET", royalty_rate_bps: 1000, minimum_guarantee_cents: 0, mg_recoupable: false, audit_window_days: 90 }
              as: LicensingAdmin
              captures: { agr_id: $.data.id }
            - call: "POST /licensing/agreements/${agr_id}/activate"
              payload: {}
              as: LicensingAdmin
            - call: "POST /licensing/seasons"
              payload: { title_code: "PIGSKIN26", sport_category: "AMFOOT_PRO", season_label: "2026-27", agreement_id: "${agr_id}", season_opens_on: "2026-08-01", season_closes_on: "2027-02-01" }
              as: LiveOpsManager
              captures: { season_id: $.data.id }
            - call: "POST /licensing/wallets"
              payload: { season_id: "${season_id}", owner_tag: "imm" }
              as: LiveOpsManager
              captures: { w_id: $.data.id }
            - call: "POST /licensing/wallets/${w_id}/ledger-entries"
              payload: { direction: "CREDIT", amount_vc: 100, reason_code: "GRANT" }
              as: LiveOpsManager
              captures: { entry_id: $.data.id }
          trigger:
            - call: "GET /licensing/wallets/${w_id}/ledger-entries"
              payload: {}
              as: LiveOpsManager
          assert:
            - "Ledger entry response contains id and created_at but no version or updated_at field (common_fields: false)"
            - "entry_status == POSTED"

      - name: college_athlete_grant_requires_opt_in
        claim_type: type_constraints
        grounds: ["errors[ERR_COLLEGE_OPT_IN_REQUIRED]", state_machines.LikenessGrant.PENDING_to_GRANTED]
        distinguishing_aspect: "A COLLEGE athlete with college_opt_in=false cannot be GRANTED; the transition fails with ERR_COLLEGE_OPT_IN_REQUIRED."
        test_recipe:
          setup:
            - "Agreement ACTIVE; COLLEGE athlete with college_opt_in=false; likeness grant PENDING"
          setup_api_calls:
            - call: "POST /licensing/agreements"
              payload: { licensor_type: "COLLEGE_BODY", licensor_name: "College Assoc", exclusivity_scope: "NONE", sport_category: "AMFOOT_PRO", term_start_on: "2026-01-01", term_end_on: "2026-12-31", royalty_model: "PERCENT_OF_NET", royalty_rate_bps: 800, minimum_guarantee_cents: 0, mg_recoupable: false, audit_window_days: 60 }
              as: LicensingAdmin
              captures: { agr_id: $.data.id }
            - call: "POST /licensing/agreements/${agr_id}/activate"
              payload: {}
              as: LicensingAdmin
            - call: "POST /licensing/athletes"
              payload: { full_name: "College QB", sport_category: "AMFOOT_PRO", athlete_class: "COLLEGE", college_opt_in: false }
              as: RightsOfficer
              captures: { ath_id: $.data.id }
            - call: "POST /licensing/likeness-grants"
              payload: { athlete_id: "${ath_id}", agreement_id: "${agr_id}", grant_kind: "NIL_COLLEGE", term_start_on: "2026-01-01", term_end_on: "2026-12-31", royalty_share_bps: 300, payment_destination: "nil-trust-1" }
              as: RightsOfficer
              captures: { grant_id: $.data.id }
          trigger:
            - call: "POST /licensing/likeness-grants/${grant_id}/grant"
              payload: {}
              as: RightsOfficer
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_COLLEGE_OPT_IN_REQUIRED (409)"
            - "LikenessGrant.${grant_id}.grant_status remains PENDING"

  - section: state_machines
    instances:
      - name: terminal_agreement_rejects_further_transitions
        claim_type: terminal_state_lockdown
        grounds: [state_machines.LicenseAgreement, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A TERMINATED agreement rejects suspend/reinstate/terminate with ERR_INVALID_STATE; no side effects fire."
        test_recipe:
          setup:
            - "Agreement created, activated, suspended, terminated"
          setup_api_calls:
            - call: "POST /licensing/agreements"
              payload: { licensor_type: "LEAGUE", licensor_name: "L", exclusivity_scope: "NONE", sport_category: "AMFOOT_PRO", term_start_on: "2026-01-01", term_end_on: "2026-12-31", royalty_model: "PERCENT_OF_NET", royalty_rate_bps: 1000, minimum_guarantee_cents: 0, mg_recoupable: false, audit_window_days: 90 }
              as: LicensingAdmin
              captures: { agr_id: $.data.id }
            - call: "POST /licensing/agreements/${agr_id}/activate"
              payload: {}
              as: LicensingAdmin
            - call: "POST /licensing/agreements/${agr_id}/suspend"
              payload: {}
              as: LicensingAdmin
            - call: "POST /licensing/agreements/${agr_id}/terminate"
              payload: {}
              as: LicensingAdmin
          trigger:
            - call: "POST /licensing/agreements/${agr_id}/reinstate"
              payload: {}
              as: LicensingAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (409)"
            - "LicenseAgreement.${agr_id}.agreement_status remains TERMINATED"

      - name: rollback_only_on_head_batch
        claim_type: precondition_enforcement
        grounds: [state_machines.RosterBatch.PUBLISHED_to_ROLLED_BACK, "errors[ERR_ROLLBACK_NOT_HEAD]"]
        distinguishing_aspect: "Rollback is rejected with ERR_ROLLBACK_NOT_HEAD when the batch is PUBLISHED but a later batch has already been published (published_epoch < season.roster_epoch)."
        test_recipe:
          setup:
            - "Agreement ACTIVE; season with batches B1 and B2 published in order (B2 superseded B1)"
          setup_api_calls:
            - call: "POST /licensing/agreements"
              payload: { licensor_type: "LEAGUE", licensor_name: "L", exclusivity_scope: "NONE", sport_category: "AMFOOT_PRO", term_start_on: "2026-01-01", term_end_on: "2026-12-31", royalty_model: "PERCENT_OF_NET", royalty_rate_bps: 1000, minimum_guarantee_cents: 0, mg_recoupable: false, audit_window_days: 90 }
              as: LicensingAdmin
              captures: { agr_id: $.data.id }
            - call: "POST /licensing/agreements/${agr_id}/activate"
              payload: {}
              as: LicensingAdmin
            - call: "POST /licensing/seasons"
              payload: { title_code: "PIGSKIN26", sport_category: "AMFOOT_PRO", season_label: "2026-27", agreement_id: "${agr_id}", season_opens_on: "2026-08-01", season_closes_on: "2027-02-01" }
              as: LiveOpsManager
              captures: { season_id: $.data.id }
            - call: "POST /licensing/athletes"
              payload: { full_name: "RB", sport_category: "AMFOOT_PRO", athlete_class: "ACTIVE_PRO", college_opt_in: false }
              as: RightsOfficer
              captures: { ath_id: $.data.id }
            - call: "POST /licensing/likeness-grants"
              payload: { athlete_id: "${ath_id}", agreement_id: "${agr_id}", grant_kind: "GROUP_PA", term_start_on: "2026-01-01", term_end_on: "2026-12-31", royalty_share_bps: 100, payment_destination: "pa-1" }
              as: RightsOfficer
              captures: { grant_id: $.data.id }
            - call: "POST /licensing/likeness-grants/${grant_id}/grant"
              payload: {}
              as: RightsOfficer
            - call: "POST /licensing/roster-batches"
              payload: { season_id: "${season_id}", batch_label: "B1", submitted_by: "op-1" }
              as: RosterOperator
              as_user_id: "op-1"
              captures: { b1_id: $.data.id }
            - call: "POST /licensing/roster-batches/${b1_id}/entries"
              payload: { athlete_id: "${ath_id}", entry_kind: "ADD", overall_rating: 80 }
              as: RosterOperator
              as_user_id: "op-1"
            - call: "POST /licensing/roster-batches/${b1_id}/validate"
              payload: {}
              as: RosterOperator
              as_user_id: "op-1"
            - call: "GET /licensing/seasons/${season_id}"
              payload: {}
              as: LiveOpsManager
              captures: { sv1: $.data.version }
            - call: "POST /licensing/roster-batches/${b1_id}/publish"
              payload: { expected_season_version: "${sv1}" }
              as: RosterReviewer
              as_user_id: "reviewer-1"
            - call: "POST /licensing/roster-batches"
              payload: { season_id: "${season_id}", batch_label: "B2", submitted_by: "op-1" }
              as: RosterOperator
              as_user_id: "op-1"
              captures: { b2_id: $.data.id }
            - call: "POST /licensing/roster-batches/${b2_id}/entries"
              payload: { athlete_id: "${ath_id}", entry_kind: "UPDATE_ATTRIBUTE", overall_rating: 82 }
              as: RosterOperator
              as_user_id: "op-1"
            - call: "POST /licensing/roster-batches/${b2_id}/validate"
              payload: {}
              as: RosterOperator
              as_user_id: "op-1"
            - call: "GET /licensing/seasons/${season_id}"
              payload: {}
              as: LiveOpsManager
              captures: { sv2: $.data.version }
            - call: "POST /licensing/roster-batches/${b2_id}/publish"
              payload: { expected_season_version: "${sv2}" }
              as: RosterReviewer
              as_user_id: "reviewer-1"
          trigger:
            - call: "POST /licensing/roster-batches/${b1_id}/rollback"
              payload: {}
              as: RosterReviewer
              as_user_id: "reviewer-1"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_ROLLBACK_NOT_HEAD (409) — B1 is SUPERSEDED, not the head"
            - "RosterBatch.${b1_id}.batch_status remains SUPERSEDED"

      - name: grant_revoke_from_granted_rejected
        claim_type: invalid_transition
        grounds: [state_machines.LikenessGrant, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "LikenessGrant has no GRANTED -> REVOKED edge; revoke requires the SUSPENDED intermediate state."
        test_recipe:
          setup:
            - "Agreement ACTIVE; athlete; grant GRANTED"
          setup_api_calls:
            - call: "POST /licensing/agreements"
              payload: { licensor_type: "PLAYERS_ASSOCIATION", licensor_name: "PA", exclusivity_scope: "NONE", sport_category: "AMFOOT_PRO", term_start_on: "2026-01-01", term_end_on: "2026-12-31", royalty_model: "PERCENT_OF_NET", royalty_rate_bps: 1000, minimum_guarantee_cents: 0, mg_recoupable: false, audit_window_days: 90 }
              as: LicensingAdmin
              captures: { agr_id: $.data.id }
            - call: "POST /licensing/agreements/${agr_id}/activate"
              payload: {}
              as: LicensingAdmin
            - call: "POST /licensing/athletes"
              payload: { full_name: "G", sport_category: "AMFOOT_PRO", athlete_class: "ACTIVE_PRO", college_opt_in: false }
              as: RightsOfficer
              captures: { ath_id: $.data.id }
            - call: "POST /licensing/likeness-grants"
              payload: { athlete_id: "${ath_id}", agreement_id: "${agr_id}", grant_kind: "GROUP_PA", term_start_on: "2026-01-01", term_end_on: "2026-12-31", royalty_share_bps: 100, payment_destination: "pa-2" }
              as: RightsOfficer
              captures: { grant_id: $.data.id }
            - call: "POST /licensing/likeness-grants/${grant_id}/grant"
              payload: {}
              as: RightsOfficer
          trigger:
            - call: "POST /licensing/likeness-grants/${grant_id}/revoke"
              payload: {}
              as: RightsOfficer
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (409)"
            - "LikenessGrant.${grant_id}.grant_status remains GRANTED"

      - name: agreement_terminate_blocked_by_open_audit
        claim_type: precondition_enforcement
        grounds: [state_machines.LicenseAgreement.SUSPENDED_to_TERMINATED, "errors[ERR_AUDIT_BLOCKS_TERMINATION]"]
        distinguishing_aspect: "Terminate on a SUSPENDED agreement is rejected with ERR_AUDIT_BLOCKS_TERMINATION while any OPEN or FINDINGS_FILED audit case references it."
        test_recipe:
          setup:
            - "Agreement ACTIVE; statement FINALIZED; audit case OPEN; agreement then SUSPENDED"
          setup_api_calls:
            - call: "POST /licensing/agreements"
              payload: { licensor_type: "LEAGUE", licensor_name: "L", exclusivity_scope: "NONE", sport_category: "AMFOOT_PRO", term_start_on: "2026-01-01", term_end_on: "2026-12-31", royalty_model: "PERCENT_OF_NET", royalty_rate_bps: 1000, minimum_guarantee_cents: 0, mg_recoupable: false, audit_window_days: 90 }
              as: LicensingAdmin
              captures: { agr_id: $.data.id }
            - call: "POST /licensing/agreements/${agr_id}/activate"
              payload: {}
              as: LicensingAdmin
            - call: "POST /licensing/royalty-statements"
              payload: { agreement_id: "${agr_id}", period_start_on: "2026-08-01", period_end_on: "2026-08-31", gross_sales_cents: 100000, returns_cents: 0, pending_sales_cents: 0 }
              as: FinanceController
              captures: { stmt_id: $.data.id }
            - call: "POST /licensing/royalty-statements/${stmt_id}/compute-provisional"
              payload: {}
              as: FinanceController
            - call: "POST /licensing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T00:00:00Z" }
              as: LicensingAdmin
            - call: "POST /licensing/royalty-statements/${stmt_id}/finalize"
              payload: {}
              as: FinanceController
            - call: "POST /licensing/audit-cases"
              payload: { agreement_id: "${agr_id}", statement_id: "${stmt_id}", opened_by_role: "LEAGUE_AUDITOR" }
              as: LeagueAuditor
              captures: { case_id: $.data.id }
            - call: "POST /licensing/agreements/${agr_id}/suspend"
              payload: {}
              as: LicensingAdmin
          trigger:
            - call: "POST /licensing/agreements/${agr_id}/terminate"
              payload: {}
              as: LicensingAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_AUDIT_BLOCKS_TERMINATION (409)"
            - "LicenseAgreement.${agr_id}.agreement_status remains SUSPENDED"

      - name: sunset_season_cascades_drops_wallets_tournaments
        claim_type: cascade_down
        grounds: [state_machines.LiveSeason.LIVE_to_SUNSET]
        distinguishing_aspect: "Sunsetting a LIVE season cascades: RELEASED drops -> ENDED, OPEN wallets -> FROZEN, REGISTRATION_OPEN programs -> CANCELED with REFUND credits posted to entrant wallets."
        test_recipe:
          setup:
            - "Agreement ACTIVE; season LIVE with one RELEASED VANITY drop, one OPEN wallet funded 2000, and one REGISTRATION_OPEN program (entry_fee 500) with one paid entry"
          setup_api_calls:
            - call: "POST /licensing/agreements"
              payload: { licensor_type: "LEAGUE", licensor_name: "L", exclusivity_scope: "NONE", sport_category: "AMFOOT_PRO", term_start_on: "2026-01-01", term_end_on: "2026-12-31", royalty_model: "PERCENT_OF_NET", royalty_rate_bps: 1000, minimum_guarantee_cents: 0, mg_recoupable: false, audit_window_days: 90 }
              as: LicensingAdmin
              captures: { agr_id: $.data.id }
            - call: "POST /licensing/agreements/${agr_id}/activate"
              payload: {}
              as: LicensingAdmin
            - call: "POST /licensing/seasons"
              payload: { title_code: "PIGSKIN26", sport_category: "AMFOOT_PRO", season_label: "2026-27", agreement_id: "${agr_id}", season_opens_on: "2026-08-01", season_closes_on: "2027-02-01" }
              as: LiveOpsManager
              captures: { season_id: $.data.id }
            - call: "POST /licensing/athletes"
              payload: { full_name: "S", sport_category: "AMFOOT_PRO", athlete_class: "ACTIVE_PRO", college_opt_in: false }
              as: RightsOfficer
              captures: { ath_id: $.data.id }
            - call: "POST /licensing/likeness-grants"
              payload: { athlete_id: "${ath_id}", agreement_id: "${agr_id}", grant_kind: "GROUP_PA", term_start_on: "2026-01-01", term_end_on: "2026-12-31", royalty_share_bps: 100, payment_destination: "pa-3" }
              as: RightsOfficer
              captures: { grant_id: $.data.id }
            - call: "POST /licensing/likeness-grants/${grant_id}/grant"
              payload: {}
              as: RightsOfficer
            - call: "POST /licensing/roster-batches"
              payload: { season_id: "${season_id}", batch_label: "LAUNCH", submitted_by: "op-1" }
              as: RosterOperator
              as_user_id: "op-1"
              captures: { batch_id: $.data.id }
            - call: "POST /licensing/roster-batches/${batch_id}/entries"
              payload: { athlete_id: "${ath_id}", entry_kind: "ADD", overall_rating: 80 }
              as: RosterOperator
              as_user_id: "op-1"
            - call: "POST /licensing/roster-batches/${batch_id}/validate"
              payload: {}
              as: RosterOperator
              as_user_id: "op-1"
            - call: "GET /licensing/seasons/${season_id}"
              payload: {}
              as: LiveOpsManager
              captures: { sv: $.data.version }
            - call: "POST /licensing/roster-batches/${batch_id}/publish"
              payload: { expected_season_version: "${sv}" }
              as: RosterReviewer
              as_user_id: "reviewer-1"
            - call: "POST /licensing/seasons/${season_id}/launch"
              payload: {}
              as: LiveOpsManager
            - call: "POST /licensing/content-drops"
              payload: { season_id: "${season_id}", drop_kind: "VANITY", drop_label: "V", price_vc: 100, scheduled_start_at: "2026-08-15T00:00:00Z", scheduled_end_at: "2026-12-15T00:00:00Z" }
              as: LiveOpsManager
              captures: { drop_id: $.data.id }
            - call: "POST /licensing/content-drops/${drop_id}/release"
              payload: {}
              as: LiveOpsManager
            - call: "POST /licensing/wallets"
              payload: { season_id: "${season_id}", owner_tag: "sunset-player" }
              as: LiveOpsManager
              captures: { w_id: $.data.id }
            - call: "POST /licensing/wallets/${w_id}/ledger-entries"
              payload: { direction: "CREDIT", amount_vc: 2000, reason_code: "GRANT" }
              as: LiveOpsManager
            - call: "POST /licensing/tournaments"
              payload: { season_id: "${season_id}", program_label: "SUNSET_CUP", league_sanctioned: true, entry_fee_vc: 500, registration_opens_at: "2026-08-01T00:00:00Z", registration_closes_at: "2026-12-01T00:00:00Z" }
              as: LiveOpsManager
              captures: { prog_id: $.data.id }
            - call: "POST /licensing/tournaments/${prog_id}/open-registration"
              payload: {}
              as: LiveOpsManager
            - call: "POST /licensing/tournaments/${prog_id}/entries"
              payload: { wallet_id: "${w_id}" }
              as: LiveOpsManager
              captures: { e_id: $.data.id }
          trigger:
            - call: "POST /licensing/seasons/${season_id}/sunset"
              payload: {}
              as: LiveOpsManager
            - call: "GET /licensing/content-drops/${drop_id}"
              payload: {}
              as: LiveOpsManager
              captures: { d_st: $.data.drop_status }
            - call: "GET /licensing/wallets/${w_id}"
              payload: {}
              as: LiveOpsManager
              captures: { w_st: $.data.wallet_status, w_bal: $.data.vc_balance }
            - call: "GET /licensing/tournaments/${prog_id}"
              payload: {}
              as: LiveOpsManager
              captures: { p_st: $.data.program_status }
          assert:
            - "ContentDrop.${drop_id}.drop_status == ENDED"
            - "PlayerWallet.${w_id}.wallet_status == FROZEN"
            - "TournamentProgram.${prog_id}.program_status == CANCELED"
            - "TournamentEntry.${e_id}.entry_status == REFUNDED"
            - "Wallet balance restored to 2000 (500 entry fee refunded via REFUND credit)"

      - name: tournament_entry_idempotent_double_registration_rejected
        claim_type: idempotency
        grounds: [state_machines.TournamentProgram, entities.TournamentEntry]
        distinguishing_aspect: "Registering the same wallet twice into the same program is rejected; the second POST does not create a duplicate entry or double-debit the fee."
        test_recipe:
          setup:
            - "Agreement ACTIVE; season LIVE; program REGISTRATION_OPEN with entry_fee 100; wallet funded 1000; wallet already registered once"
          setup_api_calls:
            - call: "POST /licensing/agreements"
              payload: { licensor_type: "LEAGUE", licensor_name: "L", exclusivity_scope: "NONE", sport_category: "AMFOOT_PRO", term_start_on: "2026-01-01", term_end_on: "2026-12-31", royalty_model: "PERCENT_OF_NET", royalty_rate_bps: 1000, minimum_guarantee_cents: 0, mg_recoupable: false, audit_window_days: 90 }
              as: LicensingAdmin
              captures: { agr_id: $.data.id }
            - call: "POST /licensing/agreements/${agr_id}/activate"
              payload: {}
              as: LicensingAdmin
            - call: "POST /licensing/seasons"
