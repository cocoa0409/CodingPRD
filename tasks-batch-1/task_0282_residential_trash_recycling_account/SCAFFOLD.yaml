    roles: [Dispatcher, AccountHolder]
    code: 200
    input: ["limit?", "offset?"]
    output: Payment[]
    side_effects: []
  - method: GET
    path: "/accounts/{id}/pickup-schedules"
    description: "List an account's pickup schedule rows ordered by (service_date ASC, then stream with TRASH before RECYCLING on the same date); effective_pickup_date reflects holiday shift. Optional stream filter and status filter (reverse-reachability for PickupSchedule.account_id)."
    roles: [Dispatcher, AccountHolder]
    code: 200
