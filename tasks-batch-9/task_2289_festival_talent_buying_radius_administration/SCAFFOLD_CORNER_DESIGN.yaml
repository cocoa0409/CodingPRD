            - call: "GET /festival-ops/announcement-waves/${wave}"
              as: TalentBuyer
            - call: "POST /festival-ops/bookings/${bk_v}/cancel"
              payload: { cancelling_party: "ARTIST", cancellation_reason: "Illness." }
              as: BusinessAffairs
            - call: "GET /festival-ops/announcement-waves/${wave}"
              as: TalentBuyer
            - call: "GET /festival-ops/festivals/${fest}"
              as: TalentBuyer
            - call: "POST /festival-ops/bookings/${bk}/cancel"
              payload: { cancelling_party: "PROMOTER", cancellation_reason: "Storm." }
              as: TalentBuyer
            - call: "GET /festival-ops/announcement-waves/${wave}"
              as: TalentBuyer
            - call: "GET /festival-ops/festivals/${fest}"
              as: TalentBuyer
          assert:
            - "first call: assignment_count == 2, headliner_count == 1, version == 3"
            - "third call: assignment_count == 1 and headliner_count == 1 - the cancelled member was billing_position 2"
            - "fourth call: headliner_anchor_count == 1 and committed_budget_cents == 1800000"
            - "sixth call: assignment_count == 0, headliner_count == 0 and status == \"PLANNED\""
            - "seventh call: headliner_anchor_count == 0 and committed_budget_cents == 0"
            - "GET /festival-ops/bookings with announcement_wave_id ${wave} returns total_count 0, matching the recounted assignment_count"

      - name: channel_advisory_at_exactly_96_yields_zero_overage
        claim_type: rate_threshold_triggers
        grounds:
          - entities.AdvancePacket.fields.channel_overage
          - validations[priority 67]
        distinguishing_aspect: |
          STAGE_CHANNEL_ADVISORY is an exclusive threshold on a running stage-day
          total: a first submission of exactly 96 channels stores channel_overage 0,
          and a one-channel second packet on the same stage-day takes the total to 97
          and stores 1 - not 97 and not 112 - while both remain far inside the 112 hard
          max. The overage is stamped per packet from the total INCLUDING that packet,
          so the second packet carries the whole 1 and the first is never restamped.
        test_recipe:
          setup:
            - "Canonical base fixture plus Vela Roan (ROCK, draw 72); two accepted bookings share Aurora Main on 2026-12-04 at billing_position 1 (21:00) and 2 (18:00)."
            - "Two DRAFT advance packets carry input_channel_count 96 and 1."
          setup_api_calls:
            - call: "POST /festival-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: TalentBuyer
            - call: "POST /festival-ops/festivals"
              payload: { name: "Harbor Lights Festival", edition_year: 2026, market_latitude: 47.6062, market_longitude: -122.3321, event_start_date: "2026-12-04", event_end_date: "2026-12-06", talent_budget_cents: 10000000, contingency_reserve_pct: 0.05 }
              as: TalentBuyer
              captures: { fest: "$.data.id", fest_v: "$.data.version" }
            - call: "POST /festival-ops/budget-tiers"
              payload: { festival_id: "${fest}", tier_code: "HEADLINER", tier_rank: 1, allocation_pct: 0.5, max_slots: 5, genre_focus: "MIXED" }
              as: TalentBuyer
              captures: { tier_h: "$.data.id" }
            - call: "POST /festival-ops/budget-tiers"
              payload: { festival_id: "${fest}", tier_code: "MID_CARD", tier_rank: 2, allocation_pct: 0.3, max_slots: 5, genre_focus: "MIXED" }
              as: TalentBuyer
              captures: { tier_m: "$.data.id" }
            - call: "POST /festival-ops/budget-tiers"
              payload: { festival_id: "${fest}", tier_code: "EMERGING", tier_rank: 3, allocation_pct: 0.2, max_slots: 5, genre_focus: "MIXED" }
              as: TalentBuyer
              captures: { tier_e: "$.data.id" }
            - call: "POST /festival-ops/festivals/${fest}/allocate-tiers"
              payload: { expected_festival_version: "${fest_v}" }
              as: TalentBuyer
            - call: "POST /festival-ops/stages"
              payload: { festival_id: "${fest}", name: "Aurora Main", capacity: 24000, daily_curfew_minute: 1380, daily_program_minutes_cap: 600, changeover_buffer_minutes: 30, is_flagship: true }
              as: ProductionManager
              captures: { stage_a: "$.data.id" }
            - call: "POST /festival-ops/artists"
              payload: { legal_name: "Nova Kade LLC", performing_name: "Nova Kade", primary_genre: "ELECTRONIC", agency: "Meridian Talent", draw_score: 72, default_radius_miles: 100 }
              as: TalentBuyer
              captures: { artist_n: "$.data.id" }
            - call: "POST /festival-ops/artists"
              payload: { legal_name: "Vela Roan Touring Ltd", performing_name: "Vela Roan", primary_genre: "ROCK", agency: "Meridian Talent", draw_score: 72, default_radius_miles: 100 }
              as: TalentBuyer
              captures: { artist_v: "$.data.id" }
            - call: "POST /festival-ops/offers"
              payload: { festival_id: "${fest}", artist_id: "${artist_n}", budget_tier_id: "${tier_h}", stage_id: "${stage_a}", guarantee_cents: 1800000, billing_position: 1, set_length_minutes: 90, slot_start_utc: "2026-12-04T21:00:00Z", offer_expires_utc: "2026-09-15T00:00:00Z", radius_miles: 150, window_start_date: "2026-10-05", window_end_date: "2027-01-04" }
              as: TalentBuyer
              captures: { offer_1: "$.data.id" }
            - call: "POST /festival-ops/offers/${offer_1}/issue"
              as: TalentBuyer
            - call: "POST /festival-ops/offers/${offer_1}/accept"
              as: ArtistRep
              as_user_id: "${artist_n}"
              captures: { bk: "$.data.id" }
            - call: "POST /festival-ops/offers"
              payload: { festival_id: "${fest}", artist_id: "${artist_v}", budget_tier_id: "${tier_h}", stage_id: "${stage_a}", guarantee_cents: 1800000, billing_position: 2, set_length_minutes: 90, slot_start_utc: "2026-12-04T18:00:00Z", offer_expires_utc: "2026-09-15T00:00:00Z", radius_miles: 150, window_start_date: "2026-10-05", window_end_date: "2027-01-04" }
              as: TalentBuyer
              captures: { offer_v: "$.data.id" }
            - call: "POST /festival-ops/offers/${offer_v}/issue"
              as: TalentBuyer
            - call: "POST /festival-ops/offers/${offer_v}/accept"
              as: ArtistRep
              as_user_id: "${artist_v}"
              captures: { bk_v: "$.data.id" }
            - call: "POST /festival-ops/advance-packets"
              payload: { booking_id: "${bk}", stage_plot_ref: "SP-AURORA-1", input_channel_count: 96, monitor_mix_count: 8, travel_party_size: 12 }
              as: ArtistRep
              as_user_id: "${artist_n}"
              captures: { pk_n: "$.data.id" }
            - call: "POST /festival-ops/advance-packets"
              payload: { booking_id: "${bk_v}", stage_plot_ref: "SP-AURORA-2", input_channel_count: 1, monitor_mix_count: 8, travel_party_size: 12 }
              as: ArtistRep
              as_user_id: "${artist_v}"
              captures: { pk_v: "$.data.id" }
          trigger:
            - call: "POST /festival-ops/advance-packets/${pk_n}/submit"
              as: ArtistRep
              as_user_id: "${artist_n}"
            - call: "POST /festival-ops/advance-packets/${pk_v}/submit"
              as: ArtistRep
              as_user_id: "${artist_v}"
            - call: "GET /festival-ops/advance-packets/${pk_n}"
              as: ProductionManager
          assert:
            - "first call: HTTP 200 with data.channel_overage == 0 at a stage-day total of exactly 96"
            - "second call: HTTP 200 with data.channel_overage == 1 at a stage-day total of 97"
            - "second call: data.status == \"SUBMITTED\" - 97 is nowhere near the 112 hard max"
            - "third call: data.channel_overage is still 0 - earlier packets are not restamped when the total grows"

      - name: cascading_commitment_side_effects_on_accept
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers
          - endpoints[POST /festival-ops/offers/{id}/accept]
        excluded_because:
          difficulty_instance: transitive_cascade / accept_offer_depth5_commitment_cascade
          rationale: "That instance is the canonical depth-5 cascade walk and asserts every hop including the supersede sweep."

      - name: cascading_enforcement_side_effects_on_violation
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers
          - endpoints[POST /festival-ops/competing-performances/{id}/adjudicate]
        excluded_because:
          difficulty_instance: transitive_cascade / violation_adjudication_depth4_enforcement_cascade
          rationale: "That instance asserts CASCADE-3 from the report through the clause, the installments and the settlement dimension."

      - name: dual_variant_layer_across_three_calculations
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers
          - calculations.rider_cost_estimate.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / rider_scope_variant_divergence_on_booking
          rationale: "That instance drives every divergence source between PROPOSED_SCOPE and CONTRACTED_SCOPE on one booking."

  - section: consistency model
    instances:

      - name: writes_are_immediately_visible_to_the_next_read
        claim_type: immediate_visibility
        grounds:
          - complexity_profile.consistency_model
          - response_envelope.envelope_fields
          - calculations.budget_commitment_conservation
        distinguishing_aspect: |
          The declared model is `immediate`, so there is no eventual-consistency
          allowance anywhere: the acceptance response already carries the committed
          booking, and the very next reads of the tier, the festival, the stage and
          the installment collection - issued with no delay, no retry and no polling -
          all show the post-cascade values. A read-your-writes lag of even one call
          would break the four assertions that follow the write.
        test_recipe:
          setup:
            - "Canonical base fixture with one ISSUED Nova Kade offer at guarantee 1800000."
          setup_api_calls:
            - call: "POST /festival-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: TalentBuyer
            - call: "POST /festival-ops/festivals"
              payload: { name: "Harbor Lights Festival", edition_year: 2026, market_latitude: 47.6062, market_longitude: -122.3321, event_start_date: "2026-12-04", event_end_date: "2026-12-06", talent_budget_cents: 10000000, contingency_reserve_pct: 0.05 }
              as: TalentBuyer
              captures: { fest: "$.data.id", fest_v: "$.data.version" }
            - call: "POST /festival-ops/budget-tiers"
              payload: { festival_id: "${fest}", tier_code: "HEADLINER", tier_rank: 1, allocation_pct: 0.5, max_slots: 5, genre_focus: "MIXED" }
              as: TalentBuyer
              captures: { tier_h: "$.data.id" }
            - call: "POST /festival-ops/budget-tiers"
              payload: { festival_id: "${fest}", tier_code: "MID_CARD", tier_rank: 2, allocation_pct: 0.3, max_slots: 5, genre_focus: "MIXED" }
              as: TalentBuyer
              captures: { tier_m: "$.data.id" }
            - call: "POST /festival-ops/budget-tiers"
              payload: { festival_id: "${fest}", tier_code: "EMERGING", tier_rank: 3, allocation_pct: 0.2, max_slots: 5, genre_focus: "MIXED" }
              as: TalentBuyer
              captures: { tier_e: "$.data.id" }
            - call: "POST /festival-ops/festivals/${fest}/allocate-tiers"
              payload: { expected_festival_version: "${fest_v}" }
              as: TalentBuyer
            - call: "POST /festival-ops/stages"
              payload: { festival_id: "${fest}", name: "Aurora Main", capacity: 24000, daily_curfew_minute: 1380, daily_program_minutes_cap: 600, changeover_buffer_minutes: 30, is_flagship: true }
              as: ProductionManager
              captures: { stage_a: "$.data.id" }
            - call: "POST /festival-ops/artists"
              payload: { legal_name: "Nova Kade LLC", performing_name: "Nova Kade", primary_genre: "ELECTRONIC", agency: "Meridian Talent", draw_score: 72, default_radius_miles: 100 }
              as: TalentBuyer
              captures: { artist_n: "$.data.id" }
            - call: "POST /festival-ops/offers"
              payload: { festival_id: "${fest}", artist_id: "${artist_n}", budget_tier_id: "${tier_h}", stage_id: "${stage_a}", guarantee_cents: 1800000, billing_position: 1, set_length_minutes: 90, slot_start_utc: "2026-12-04T21:00:00Z", offer_expires_utc: "2026-09-15T00:00:00Z", radius_miles: 150, window_start_date: "2026-10-05", window_end_date: "2027-01-04" }
              as: TalentBuyer
              captures: { offer_1: "$.data.id" }
            - call: "POST /festival-ops/offers/${offer_1}/issue"
              as: TalentBuyer
          trigger:
            - call: "POST /festival-ops/offers/${offer_1}/accept"
              as: ArtistRep
              as_user_id: "${artist_n}"
              captures: { bk: "$.data.id" }
            - call: "GET /festival-ops/budget-tiers/${tier_h}"
              as: FinanceController
            - call: "GET /festival-ops/festivals/${fest}/budget-summary"
              as: FinanceController
            - call: "GET /festival-ops/stages/${stage_a}"
              as: ProductionManager
            - call: "GET /festival-ops/bookings/${bk}/payment-installments"
              as: FinanceController
          assert:
            - "first call: HTTP 201 with data.contract_status == \"PENDING_RIDER\" and data.guarantee_cents == 1800000 in the write response itself"
            - "second call: data.committed_cents == 1800000 and data.slots_committed == 1 on the first read after the write"
            - "third call: committed_budget_cents == 1800000 == tier_committed_sum_cents == booking_committed_sum_cents"
            - "fourth call: data.booked_minutes == 90"
            - "fifth call: total_count == 2 with data[0].amount_cents == 900000 and data[1].amount_cents == 900000"
            - "every response carries meta.api_request_id and the same data shape on the first attempt - no retry loop is needed anywhere"

