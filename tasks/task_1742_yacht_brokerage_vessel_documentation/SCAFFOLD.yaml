    roles: [ListingAgent]
    code: 200
    input: []
    output: ListingAgreement
    side_effects: ["listing.status = CANCELLED", "PENDING/COUNTERED offers -> EXPIRED", "syndication_status = WITHDRAWN"]
  - method: PUT
    path: "/yacht/listings/{id}/price"
