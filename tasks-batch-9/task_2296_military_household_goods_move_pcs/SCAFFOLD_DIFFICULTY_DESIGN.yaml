          trigger:
            - call: "POST /hhg/shipments"
              payload: { order_id: "${o_id}", entitlement_id: "${ent_id}", tsp_id: "${tsp_id}", shipment_code: "SHP-0017", shipment_method: "HHG", origin_market_code: "MKT-BWI", requested_pack_date: "2026-08-14T00:00:00Z", requested_pickup_date: "2026-08-17T00:00:00Z", requested_delivery_date: "2026-08-24T00:00:00Z", expected_entitlement_version: "${ent_v}" }
              as: MoveCounselor
              as_user_id: "counselor-01"
              captures: { err: $.data.error_id }
            - call: "POST /hhg/entitlements/${ent_id}/authorize"
              payload: { admin_weight_bump_lbs: 0 }
              as: MoveCounselor
              as_user_id: "counselor-01"
              captures: { ent_v2: $.data.version }
            - call: "POST /hhg/shipments"
              payload: { order_id: "${o_id}", entitlement_id: "${ent_id}", tsp_id: "${tsp_id}", shipment_code: "SHP-0017", shipment_method: "HHG", origin_market_code: "MKT-BWI", requested_pack_date: "2026-08-14T00:00:00Z", requested_pickup_date: "2026-08-17T00:00:00Z", requested_delivery_date: "2026-08-24T00:00:00Z", expected_entitlement_version: "${ent_v2}" }
