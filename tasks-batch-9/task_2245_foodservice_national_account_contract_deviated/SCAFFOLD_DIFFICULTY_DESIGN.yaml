              captures: { err_id: $.data.error_id }
          assert:
            - "Contract.${ct_id}.status == SUSPENDED"
            - "the trigger returns HTTP 409"
            - "${err_id} == ERR_CONTRACT_NOT_ACTIVE"
            - "${err_id} != ERR_DEVIATED_PRICE_ABOVE_CEILING"
            - "GET /nac/deviation-agreements?contract_id=${ct_id} returns 0 rows (nothing was persisted)"
            - "Contract.${ct_id}.version is unchanged from ${ct_ver}"

