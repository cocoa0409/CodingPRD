          The compensation is deliberately PARTIAL and the asymmetry is the claim: dismissing the
          appealed case subtracts the 60 applied points, zeroes points_applied, returns standing to
          GOOD_STANDING and restores the SUSPENDED entitlement with its pool reservations
          re-deducted — but the sandbox lease revoked by the same cascade is explicitly NOT restored.
