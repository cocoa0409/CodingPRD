# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or malformed" }
  - { id: ERR_FORBIDDEN_FOR_ROLE, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id does not exist" }
  - { id: ERR_CASE_CLOSED, http: 409, condition: "Mutation attempted on a CLOSED or CONVERTED_DISMISSED case" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Entity not in a valid from-state for the requested transition" }
  - { id: ERR_NOT_ASSIGNED_TRUSTEE, http: 403, condition: "X-User-ID is not the case's assigned trustee (or creditor self-service id mismatch)" }
  - { id: ERR_BAR_DATE_NOT_PASSED, http: 409, condition: "begin_liquidation attempted while logical time <= claim_bar_date" }
  - { id: ERR_INVALID_BAR_DATE, http: 422, condition: "set_bar_date with bar_date <= case.filed_on" }
  - { id: ERR_NO_ASSETS_SCHEDULED, http: 409, condition: "begin_investigation with zero assets and no no-asset report path" }
  - { id: ERR_CLAIMS_UNREVIEWED, http: 409, condition: "begin_liquidation while claims remain in FILED" }
  - { id: ERR_ASSETS_PENDING_SALE, http: 409, condition: "begin_distribution with assets in MARKED_FOR_SALE or IN_AUCTION" }
  - { id: ERR_OBJECTIONS_PENDING, http: 409, condition: "begin_distribution while any claim is OBJECTED" }
  - { id: ERR_NO_FUNDS_TO_DISTRIBUTE, http: 409, condition: "begin_distribution or plan proposal with non-positive distributable pool" }
  - { id: ERR_PLAN_EXECUTING, http: 409, condition: "convert_or_dismiss while a plan is EXECUTING" }
  - { id: ERR_PLAN_ALREADY_ACTIVE, http: 409, condition: "plan confirm while another plan of the case is CONFIRMED or EXECUTING" }
  - { id: ERR_CASE_NOT_IN_DISTRIBUTION, http: 409, condition: "plan confirm while case status != DISTRIBUTION" }
  - { id: ERR_STALE_CASE_VERSION, http: 412, condition: "expected_case_version does not match current case.version (OCC)" }
  - { id: ERR_OBJECTION_ALREADY_PENDING, http: 409, condition: "Second objection filed against a claim with a PENDING objection" }
  - { id: ERR_SETTLEMENT_NOT_PARTIAL, http: 422, condition: "settle outcome PARTIAL with settled_amount_cents >= claim.filed_amount_cents" }
  - { id: ERR_CASE_BEYOND_REOPEN, http: 409, condition: "claim reopen attempted after case entered DISTRIBUTION" }
  - { id: ERR_DIVIDEND_POSTED, http: 409, condition: "reopen/vacate/withdraw blocked because a POSTED dividend references the target" }
  - { id: ERR_ASSET_EXEMPT, http: 409, condition: "mark_for_sale on an exempt asset" }
  - { id: ERR_SALE_ALREADY_PENDING, http: 409, condition: "sale proposed for an asset with a PROPOSED or APPROVED sale" }
  - { id: ERR_BELOW_MINIMUM_PRICE, http: 422, condition: "hammer_price_cents below max(sale_costs, half scheduled value floor)" }
  - { id: ERR_OBJECTION_WINDOW_OPEN, http: 409, condition: "sale consummate before effective_on" }
  - { id: ERR_OBJECTION_WINDOW_CLOSED, http: 409, condition: "sale cancel of an APPROVED sale on/after effective_on" }
  - { id: ERR_TRANSFER_NOT_AVOIDABLE, http: 409, condition: "analyze on a transfer outside the lookback window" }
  - { id: ERR_INVALID_DEMAND_AMOUNT, http: 422, condition: "demand_amount_cents not in (0, transfer_amount_cents]" }
  - { id: ERR_PLAN_RELIES_ON_RECOVERY, http: 409, condition: "rescind a JUDGMENT action while the case is in DISTRIBUTION or a plan is active" }
  - { id: ERR_APPROVAL_EXCEEDS_REQUEST, http: 422, condition: "fee approval amount greater than requested amount" }
  - { id: ERR_FEE_NOT_YET_EFFECTIVE, http: 409, condition: "fee pay before effective_on" }
  - { id: ERR_INSUFFICIENT_ESTATE_FUNDS, http: 409, condition: "disbursement would drive estate cash negative (or pool non-positive)" }
  - { id: ERR_DUPLICATE, http: 409, condition: "Uniqueness violation (case_number, creditor_ref)" }
  - { id: ERR_REFERENTIAL_INTEGRITY, http: 422, condition: "FK target missing or belongs to a different case (secured asset, objection claim, sale asset, deposit action)" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body: missing required field, wrong type, negative amount, bad enum" }
  - { id: ERR_FINAL_REPORT_NOT_READY, http: 409, condition: "final_report file/approve while unresolved fees or dividends remain" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: Trustee
    description: "Chapter 7 panel trustee assigned to the case; administers assets, reviews and objects to claims, proposes plans, files fee applications"
    identity: "opaque"
    exclusive_operations:
      - "POST /trustee/cases/{id}/begin_investigation"
      - "POST /trustee/cases/{id}/begin_liquidation"
      - "POST /trustee/cases/{id}/begin_distribution"
      - "POST /trustee/cases/{id}/file_no_asset_report"
      - "POST /trustee/claims/{id}/review, /allow, /reopen"
      - "POST /trustee/claims/{id}/objections"
      - "POST /trustee/objections/{id}/settle, /withdraw"
      - "POST /trustee/assets/{id}/investigate, /mark_for_sale, /abandon"
      - "POST /trustee/cases/{id}/sales"
      - "POST /trustee/sales/{id}/consummate"
      - "POST /trustee/cases/{id}/avoidance_actions (+ analyze/demand/settle/abandon)"
      - "POST /trustee/cases/{id}/plans"
      - "POST /trustee/dividends/{id}/post, /void"
      - "POST /trustee/fee_applications/{id}/pay"
      - "POST /trustee/cases/{id}/final_report/file"
    shared_operations:
      - "POST /trustee/cases/{id}/fee_applications (with Clerk)"
      - "GET endpoints (with all roles)"

  - name: Clerk
    description: "Bankruptcy clerk; opens cases, registers creditors, administers the bar date and the claims register intake"
    identity: "opaque"
    exclusive_operations:
      - "POST /trustee/cases"
      - "POST /trustee/creditors"
      - "POST /trustee/cases/{id}/set_bar_date"
    shared_operations:
      - "POST /trustee/cases/{id}/claims (intake on behalf of creditors, with Creditor)"
      - "POST /trustee/cases/{id}/assets (schedule intake, with Trustee)"
      - "POST /trustee/cases/{id}/fee_applications (intake, with Trustee)"
      - "GET endpoints"

  - name: Court
    description: "The bankruptcy court; rules on objections, approves sales and fees, confirms plans, closes cases"
    identity: "opaque"
    exclusive_operations:
      - "POST /trustee/_clock/set_current_utc"
      - "POST /trustee/objections/{id}/sustain, /overrule"
      - "POST /trustee/assets/{id}/release_exemption"
      - "POST /trustee/sales/{id}/approve"
      - "POST /trustee/avoidance_actions/{id}/enter_judgment, /rescind"
      - "POST /trustee/plans/{id}/confirm, /vacate"
      - "POST /trustee/fee_applications/{id}/approve, /deny"
      - "POST /trustee/cases/{id}/convert_or_dismiss"
      - "POST /trustee/cases/{id}/final_report/approve"
    shared_operations:
      - "POST /trustee/sales/{id}/cancel (with Trustee)"
      - "GET endpoints"

  - name: Creditor
    description: "A creditor of the estate; files proofs of claim and may withdraw its own claim"
    identity: "entity_backed:Creditor"
    exclusive_operations:
      - "POST /trustee/claims/{id}/withdraw (own claims only)"
    shared_operations:
      - "POST /trustee/cases/{id}/claims (file own claim, with Clerk)"
      - "GET endpoints"
