            - "PracticeSession.${sess2}.counts_toward_minimum == false because 30 < MIN_QUALIFYING_SESSION_MINUTES"
            - "GET /practice-sessions?season_id=${season} returns total_count == 2 (the rejected 11:10 request wrote nothing)"

