            - "the accept returns HTTP 409 with error.error_id == ERR_REPORT_STATE_INVALID and AuditReport.${ar26_id}.status is still \"DRAFT\""
            - "the execute returns HTTP 409 with error.error_id == ERR_ACTION_STATE_INVALID and Member.${m_c_id}.status is still \"PETITIONED\""
