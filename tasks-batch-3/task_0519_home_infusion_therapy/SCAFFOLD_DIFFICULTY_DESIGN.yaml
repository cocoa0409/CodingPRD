              payload: { order_id: "${order_id}", pump_id: "${pump_id}", delivery_at: "2026-06-10T09:00:00Z", retrieval_at: "2026-06-17T09:00:00Z" }
              as: Pharmacist
              captures: { c1: $.data.id }
            - call: "POST /compounds/${c1}/compound"
              payload: {}
              as: Pharmacist
            - call: "POST /compounds"
              payload: { order_id: "${order_id}", pump_id: "${pump_id}", delivery_at: "2026-06-18T08:59:00Z", retrieval_at: "2026-06-25T08:59:00Z" }
