          - validations[priority=9]
          - errors[ERR_SEVERITY_BELOW_HOLD_FLOOR]
        distinguishing_aspect: |
          A single request on the appeal-window endpoint violates both a state precondition
          (priority 6) and a business-temporal deadline (priority 10); the state error must
          win, and the sibling request on the hold endpoint must instead surface the
          severity-floor error — two different error-category pairs.
