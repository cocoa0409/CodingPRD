  # ===========================================================================
  - section: calculations
    instances:
      - name: booking_quote_tier_boundary_three_vs_four_days
        claim_type: tiered_pricing tier boundary
        grounds: ["calculations.booking_quote", "entities.Reservation.fields.rental_days"]
        distinguishing_aspect: "A 3-day rental uses tier1 (mult 1.00) -> 15000 while a 4-day rental crosses into tier2 (mult 0.90) -> 18000; the tier boundary is at exactly 4 days."
        test_recipe:
          setup: ["Two reservations on the same catalog (daily_rate 5000): one 3-day, one 4-day, for different customers each with their own unit."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: StoreManager
            - call: "POST /catalogs"
              payload: { style_name: "Tux H2", category: "FORMALWEAR", daily_rate_cents: 5000, deposit_cents: 20000, replacement_value_cents: 80000, waiver_daily_rate_cents: 1200, cleaning_buffer_days: 2, late_fee_daily_rate_cents: 2000 }
              as: StoreManager
              captures: { cat_id: $.data.id }
            - call: "POST /garment-units"
              payload: { catalog_id: "${cat_id}", size_code: "M" }
              as: StoreManager
              captures: { unit1_id: $.data.id }
            - call: "POST /garment-units"
              payload: { catalog_id: "${cat_id}", size_code: "M" }
              as: StoreManager
              captures: { unit2_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Gi G", email: "gi@x.com" }
              as: StoreClerk
              captures: { cust1_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Ho H", email: "ho@x.com" }
              as: StoreClerk
              captures: { cust2_id: $.data.id }
            - call: "POST /reservations"
              payload: { customer_id: "${cust1_id}", catalog_id: "${cat_id}", requested_size_code: "M", event_date_iso: "2026-09-04T00:00:00Z", pickup_window_start_iso: "2026-09-01T09:00:00Z", return_window_end_iso: "2026-09-03T09:00:00Z", damage_waiver_opted: false }
              as: StoreClerk
              captures: { resv3_id: $.data.id }
            - call: "POST /reservations"
              payload: { customer_id: "${cust2_id}", catalog_id: "${cat_id}", requested_size_code: "M", event_date_iso: "2026-09-05T00:00:00Z", pickup_window_start_iso: "2026-09-01T09:00:00Z", return_window_end_iso: "2026-09-04T09:00:00Z", damage_waiver_opted: false }
              as: StoreClerk
              captures: { resv4_id: $.data.id }
          trigger:
            - call: "POST /reservations/${resv3_id}/confirm"
              payload: {}
              as: StoreClerk
              captures: { q3: $.data.quoted_charge_cents }
            - call: "POST /reservations/${resv4_id}/confirm"
              payload: {}
              as: StoreClerk
              captures: { q4: $.data.quoted_charge_cents }
          assert:
            - "Reservation.${resv3_id}.rental_days == 3"
            - "Reservation.${resv3_id}.quoted_charge_cents == 15000"   # 5000*1.00*3
            - "Reservation.${resv4_id}.rental_days == 4"
            - "Reservation.${resv4_id}.quoted_charge_cents == 18000"   # round(5000*0.90)=4500 *4

      - name: lost_return_damage_fee_is_full_replacement
        claim_type: Correct Result
        grounds: ["calculations.settlement_charges", "entities.Settlement.fields.damage_fee_cents"]
        distinguishing_aspect: "A LOST disposition sets damage_fee_cents to the full replacement_value (80000), not the 60% damaged rate; net beyond deposit is 60000."
        test_recipe:
          setup: ["A picked-up reservation returned LOST on time; replacement_value 80000, deposit 20000, no waiver."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: StoreManager
            - call: "POST /catalogs"
              payload: { style_name: "Tux G2", category: "FORMALWEAR", daily_rate_cents: 5000, deposit_cents: 20000, replacement_value_cents: 80000, waiver_daily_rate_cents: 1200, cleaning_buffer_days: 2, late_fee_daily_rate_cents: 2000 }
              as: StoreManager
              captures: { cat_id: $.data.id }
            - call: "POST /garment-units"
              payload: { catalog_id: "${cat_id}", size_code: "M" }
              as: StoreManager
              captures: { unit_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Ida I", email: "ida@x.com" }
              as: StoreClerk
              captures: { cust_id: $.data.id }
            - call: "POST /customers/${cust_id}/measurement-profiles"
              payload: { chest_cm: 100, waist_cm: 84, inseam_cm: 80 }
              as: StoreClerk
              captures: { mp_id: $.data.id }
            - call: "POST /reservations"
              payload: { customer_id: "${cust_id}", catalog_id: "${cat_id}", requested_size_code: "M", event_date_iso: "2026-09-04T00:00:00Z", pickup_window_start_iso: "2026-09-01T09:00:00Z", return_window_end_iso: "2026-09-03T17:00:00Z", damage_waiver_opted: false }
              as: StoreClerk
              captures: { resv_id: $.data.id }
            - call: "POST /reservations/${resv_id}/confirm"
              payload: {}
              as: StoreClerk
            - call: "POST /fit-checks"
              payload: { reservation_id: "${resv_id}", measurement_profile_id: "${mp_id}" }
              as: StoreClerk
            - call: "POST /reservations/${resv_id}/pickup"
              payload: {}
              as: StoreClerk
          trigger:
            - call: "POST /reservations/${resv_id}/return"
              payload: { returned_at_iso: "2026-09-03T12:00:00Z", disposition: "LOST" }
              as: StoreClerk
              captures: { dmg: $.data.damage_fee_cents, net: $.data.net_charge_cents }
          assert:
            - "Settlement.${resv_id}.damage_fee_cents == 80000"     # full replacement value
            - "Settlement.${resv_id}.net_charge_cents == 60000"     # 80000 - deposit 20000
            - "Settlement.${resv_id}.deposit_refund_cents == 0"

  # ===========================================================================
  - section: errors
    instances:
      - name: party_lock_from_forming_returns_invalid_state
        claim_type: violation_to_error
        grounds: ["state_machines.PartyOrder", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Locking a party still in FORMING (below required_member_count) returns ERR_INVALID_STATE (409) — lock is only defined from READY."
        test_recipe:
          setup: ["A FORMING party (required_member_count 2, zero confirmed members)."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: StoreManager
            - call: "POST /customers"
              payload: { full_name: "Jay J", email: "jay@x.com" }
              as: StoreClerk
              captures: { coord_id: $.data.id }
            - call: "POST /party-orders"
              payload: { coordinator_customer_id: "${coord_id}", event_date_iso: "2026-09-06T00:00:00Z", required_member_count: 2 }
              as: Customer
              as_user_id: "${coord_id}"
              captures: { party_id: $.data.id, party_v0: $.data.version }
          trigger:
            - call: "POST /party-orders/${party_id}/lock"
              payload: { expected_party_order_version: "${party_v0}" }
              as: Customer
              as_user_id: "${coord_id}"
              captures: { err: $.data.error_id }
          assert:
            - "PartyOrder.${party_id}.posture == FORMING"
            - "response code == 409"
            - "error_id == ERR_INVALID_STATE"

