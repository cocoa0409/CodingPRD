# =============================================================================
# PRD Benchmark Seed Tables — Wedding & Event Planning (full-service planner)
# Difficulty: Expert
# =============================================================================

scenario: |
  741. Wedding & Event Planning (full-service planner): client package
  (full/partial/day-of) & contract, budget & vendor selection/booking, timeline
  & run-of-show, vendor-payment & COI tracking, design/décor & rental
  coordination, guest/RSVP & seating, day-of staffing & logistics,
  change/cancellation

domain_name: wedding-event-planning
api_prefix: /planning

complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: quota_allocation
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - derived_field_reconciliation
    - optimistic_concurrency
  entity_topology: flat
  # flat: peer entities addressed by their own collection under a shared /planning
  # namespace, linked by explicit foreign keys (event_id, vendor_id, ...). No
  # entity id appears in another entity's URL path; children are discovered by
  # filtered-list GETs. Chosen for diversity (flat is under-represented).
  state_machine_shape: cyclic
  # Contract carries a revision cycle (DRAFT->SENT->DRAFT) and Guest carries an
  # RSVP cycle (ACCEPTED<->DECLINED); other machines are linear-with-branch.
  relationship_patterns:
    - one_to_many        # EventProject -> {Contract, VendorBooking, Guest, Table, ...}
    - many_to_many       # SeatAssignment (Guest x Table), StaffAssignment (StaffMember x shift)
    - cross_aggregate    # VendorBooking.book reads Vendor's COI state across aggregates
  role_model: peer_roles
  # Planner (operator, opaque) drives planning; Client (entity_backed:EventProject)
  # owns client-side actions on their own event; Vendor (entity_backed:Vendor)
  # owns COI submission for their own vendor record.
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: EventProject
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: couple_names, type: string, source: input, description: "Display name(s) of the client/couple" }
      - { name: event_date, type: datetime, source: input, description: "Wedding/event day (ISO 8601 UTC); anchor for day-count and COI-validity rules" }
      - { name: venue_name, type: string, source: input, description: "Primary venue name" }
      - { name: package_type, type: enum, source: input, description: "FULL | PARTIAL | DAY_OF — service package tier", constraints: "one of {FULL, PARTIAL, DAY_OF}" }
      - { name: total_budget_cents, type: integer, source: input, description: "Client total budget in integer cents", constraints: ">= 0" }
      - { name: guest_count_estimate, type: integer, source: input, description: "Planning-time estimated headcount used in PARTIAL planner-fee formula", constraints: ">= 0" }
      - { name: active_contract_id, type: string, source: system, default: null, description: "Id of the currently active Contract for this event (back-reference; the prior active contract is VOIDed on supersede). Not a hard FK: pointer set/cleared by contract create." }
      - { name: committed_spend_cents, type: integer, source: computed, default: 0, description: "Sum of contracted_cost_cents over VendorBookings in {BOOKED, COMPLETED}" }
      - { name: projected_spend_cents, type: integer, source: computed, default: 0, description: "Forward-looking spend: BOOKED/COMPLETED at contracted_cost_cents plus PROPOSED at estimated_cost_cents" }
      - { name: budget_balance_cents, type: integer, source: computed, description: "= total_budget_cents - committed_spend_cents (committed view; may be negative only transiently — CREATE-time guards forbid crossing)" }
      - { name: total_deposits_due_cents, type: integer, source: computed, default: 0, description: "Sum over BOOKED bookings of round_half_up(contracted_cost_cents * DEPOSIT_RATE); rounded per booking then summed" }
      - { name: estimated_headcount, type: integer, source: computed, default: 0, description: "Sum of party_size over Guests whose rsvp_status IN {INVITED, ACCEPTED}" }
      - { name: confirmed_headcount, type: integer, source: computed, default: 0, description: "Sum of party_size over Guests whose rsvp_status == ACCEPTED" }
      - { name: cancellation_fee_cents, type: integer, source: computed, default: 0, description: "Set on cancel: tiered percentage of active contract planner_fee_cents by days_to_event" }
      - { name: status, type: enum, source: system, description: "DRAFT -> BOOKING -> COMPLETED, plus CANCELLED", constraints: "one of {DRAFT, BOOKING, COMPLETED, CANCELLED}" }

  - name: Contract
    parent: null
    common_fields: true
    fields:
      - { name: event_id, type: string, source: input, description: "FK -> EventProject.id" }
      - { name: package_type, type: enum, source: system, description: "Copied from EventProject.package_type at creation", constraints: "one of {FULL, PARTIAL, DAY_OF}" }
      - { name: planner_fee_cents, type: integer, source: computed, description: "Planner fee computed from event package_type/total_budget_cents/guest_count_estimate at creation" }
      - { name: revision_count, type: integer, source: computed, default: 0, description: "Increments each time SENT -> DRAFT (revision requested)" }
      - { name: signed_at, type: datetime, source: computed, default: null, description: "Logical-clock timestamp stamped when Client signs (SENT -> SIGNED)" }
      - { name: status, type: enum, source: system, description: "DRAFT -> SENT -> SIGNED -> COUNTERSIGNED; SENT -> DRAFT (revision); any non-terminal + COUNTERSIGNED -> VOID (supersede/cancel)", constraints: "one of {DRAFT, SENT, SIGNED, COUNTERSIGNED, VOID}" }

  - name: Vendor
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Vendor business name" }
      - { name: category, type: enum, source: input, description: "Service category (covers design/décor and rentals via FLORAL/RENTAL)", constraints: "one of {CATERING, FLORAL, RENTAL, PHOTO, VENUE, STAFFING, OTHER}" }
      - { name: contact_email, type: string, source: input, description: "Vendor contact email" }

  - name: COI
    parent: null
    common_fields: true
    fields:
      - { name: vendor_id, type: string, source: input, description: "FK -> Vendor.id" }
      - { name: policy_number, type: string, source: input, description: "Insurance policy number" }
      - { name: coverage_amount_cents, type: integer, source: input, description: "Insured coverage amount in cents", constraints: ">= 0" }
      - { name: coverage_expiry_date, type: datetime, source: input, description: "Policy expiry (ISO 8601 UTC); a COI is valid for an event only if this is >= event.event_date" }
      - { name: status, type: enum, source: system, description: "PENDING -> VERIFIED; PENDING/VERIFIED -> EXPIRED (clock sweep when now >= coverage_expiry_date)", constraints: "one of {PENDING, VERIFIED, EXPIRED}" }

  - name: VendorBooking
    parent: null
    common_fields: true
    fields:
      - { name: event_id, type: string, source: input, description: "FK -> EventProject.id" }
      - { name: vendor_id, type: string, source: input, description: "FK -> Vendor.id" }
      - { name: service_description, type: string, source: input, description: "What the vendor provides for this event" }
      - { name: estimated_cost_cents, type: integer, source: input, description: "Provisional estimate captured while PROPOSED; feeds projected_spend_cents", constraints: ">= 0" }
      - { name: contracted_cost_cents, type: integer, source: input, default: null, description: "Final contracted cost, supplied on book; feeds committed_spend_cents", constraints: ">= 0 when set" }
      - { name: deposit_cents, type: integer, source: computed, default: null, description: "= round_half_up(contracted_cost_cents * DEPOSIT_RATE), computed on book" }
      - { name: balance_cents, type: integer, source: computed, default: null, description: "= contracted_cost_cents - deposit_cents, computed on book" }
      - { name: status, type: enum, source: system, description: "PROPOSED -> BOOKED -> COMPLETED; PROPOSED/BOOKED -> CANCELLED", constraints: "one of {PROPOSED, BOOKED, COMPLETED, CANCELLED}" }

  - name: VendorPayment
    parent: null
    common_fields: true
    fields:
      - { name: vendor_booking_id, type: string, source: system, description: "FK -> VendorBooking.id" }
      - { name: payment_type, type: enum, source: system, description: "DEPOSIT | BALANCE — both minted when the parent booking is booked", constraints: "one of {DEPOSIT, BALANCE}" }
      - { name: amount_cents, type: integer, source: computed, description: "DEPOSIT => booking.deposit_cents; BALANCE => booking.balance_cents" }
      - { name: paid_at, type: datetime, source: computed, default: null, description: "Logical-clock timestamp stamped on pay (SCHEDULED -> PAID)" }
      - { name: status, type: enum, source: system, description: "SCHEDULED -> PAID; SCHEDULED -> VOID (cascade when parent booking is cancelled)", constraints: "one of {SCHEDULED, PAID, VOID}" }

  - name: TimelineBlock
    parent: null
    common_fields: true
    fields:
      - { name: event_id, type: string, source: input, description: "FK -> EventProject.id" }
      - { name: label, type: string, source: input, description: "Run-of-show item label" }
      - { name: zone, type: enum, source: input, description: "Physical area the block occupies", constraints: "one of {CEREMONY_SPACE, RECEPTION_HALL, KITCHEN, LOADING_DOCK, SUITE}" }
      - { name: block_type, type: enum, source: input, description: "Kind of run-of-show block", constraints: "one of {LOAD_IN, SETUP, CEREMONY, COCKTAIL, RECEPTION, TEARDOWN}" }
      - { name: start_offset_min, type: integer, source: input, description: "Start, minutes from event-day 00:00 (half-open interval start)", constraints: ">= 0" }
      - { name: end_offset_min, type: integer, source: input, description: "End, minutes from event-day 00:00 (half-open interval end, exclusive)", constraints: "> start_offset_min" }

  - name: Guest
    parent: null
    common_fields: true
    fields:
      - { name: event_id, type: string, source: input, description: "FK -> EventProject.id" }
      - { name: guest_name, type: string, source: input, description: "Guest/party display name" }
      - { name: party_size, type: integer, source: input, description: "Number of seats this party consumes", constraints: ">= 1" }
      - { name: meal_choice, type: enum, source: input, default: NONE, description: "Meal selection", constraints: "one of {NONE, STANDARD, VEGETARIAN, VEGAN, KIDS}" }
      - { name: rsvp_status, type: enum, source: system, description: "INVITED -> ACCEPTED | DECLINED; ACCEPTED <-> DECLINED (cycle)", constraints: "one of {INVITED, ACCEPTED, DECLINED}" }

  - name: Table
    parent: null
    common_fields: true
    fields:
      - { name: event_id, type: string, source: input, description: "FK -> EventProject.id" }
      - { name: table_label, type: string, source: input, description: "Table label/number" }
      - { name: capacity, type: integer, source: input, description: "Maximum seats at this table", constraints: ">= 1" }
      - { name: occupied_seats, type: integer, source: computed, default: 0, description: "= sum of seats_used over SeatAssignments referencing this table; kept reconciled on assign/remove/RSVP-decline" }

  - name: SeatAssignment
    parent: null
    common_fields: true
    fields:
      - { name: event_id, type: string, source: input, description: "FK -> EventProject.id" }
      - { name: guest_id, type: string, source: input, description: "FK -> Guest.id" }
      - { name: table_id, type: string, source: input, description: "FK -> Table.id" }
      - { name: seats_used, type: integer, source: computed, description: "Snapshot of guest.party_size at assignment time; the amount released on removal" }

  - name: StaffMember
    parent: null
    common_fields: true
    fields:
      - { name: event_id, type: string, source: input, description: "FK -> EventProject.id" }
      - { name: staff_name, type: string, source: input, description: "Staff display name" }
      - { name: role_title, type: enum, source: input, description: "Day-of role", constraints: "one of {COORDINATOR, SERVER, BARTENDER, SECURITY, RUNNER}" }
      - { name: hourly_rate_cents, type: integer, source: input, description: "Hourly labor rate in cents", constraints: ">= 0" }

  - name: StaffAssignment
    parent: null
    common_fields: true
    fields:
      - { name: event_id, type: string, source: input, description: "FK -> EventProject.id" }
      - { name: staff_member_id, type: string, source: input, description: "FK -> StaffMember.id" }
      - { name: shift_start_offset_min, type: integer, source: input, description: "Shift start, minutes from event-day 00:00 (closed interval, buffer-padded on overlap check)", constraints: ">= 0" }
      - { name: shift_end_offset_min, type: integer, source: input, description: "Shift end, minutes from event-day 00:00", constraints: "> shift_start_offset_min" }
      - { name: labor_cost_cents, type: integer, source: computed, description: "= round_half_up(staff.hourly_rate_cents * (shift_end_offset_min - shift_start_offset_min) / 60)" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  # ---- Contract: revision cycle (non-linear) ----
  - entity: Contract
    initial_state: DRAFT
    terminal_states: [COUNTERSIGNED, VOID]
    transitions:
      - from: DRAFT
        to: SENT
        trigger: "POST /planning/contracts/{contractId}/send"
        actor: Planner
        preconditions:
          - "Contract.status == DRAFT (else ERR_CONTRACT_NOT_DRAFT)"
        side_effects: []
      - from: SENT
        to: SIGNED
        trigger: "POST /planning/contracts/{contractId}/sign"
        actor: Client
        preconditions:
          - "Contract.status == SENT (else ERR_CONTRACT_NOT_SENT)"
          - "Acting Client owns the event: X-User-ID == Contract.event_id (else ERR_OWNERSHIP_VIOLATION)"
        side_effects:
          - "signed_at = current logical clock"
      - from: SENT
        to: DRAFT
        trigger: "POST /planning/contracts/{contractId}/request-revision"
        actor: Client | Planner
        preconditions:
          - "Contract.status == SENT (else ERR_CONTRACT_NOT_SENT)"
          - "If actor is Client: X-User-ID == Contract.event_id (else ERR_OWNERSHIP_VIOLATION)"
        side_effects:
          - "revision_count += 1"
        note: "Revision loop DRAFT->SENT->DRAFT makes this machine cyclic."
      - from: SIGNED
        to: COUNTERSIGNED
        trigger: "POST /planning/contracts/{contractId}/countersign"
        actor: Planner
        preconditions:
          - "Contract.status == SIGNED (else ERR_CONTRACT_NOT_SIGNED)"
        side_effects: []
      - from: DRAFT
        to: VOID
        trigger: "system: superseded by a newer Contract create for the same event, or EventProject cancel"
        actor: system
        preconditions:
          - "Contract is the prior active_contract of its event when a new Contract is created, OR the event is being cancelled"
        side_effects: []
      - from: SENT
        to: VOID
        trigger: "system: superseded by a newer Contract create for the same event, or EventProject cancel"
        actor: system
        preconditions: []
        side_effects: []
      - from: SIGNED
        to: VOID
        trigger: "system: superseded by a newer Contract create for the same event, or EventProject cancel"
        actor: system
        preconditions: []
        side_effects: []
      - from: COUNTERSIGNED
        to: VOID
        trigger: "system: EventProject cancel voids the countersigned active contract"
        actor: system
        preconditions: []
        side_effects: []

  # ---- EventProject: linear-with-cancel; cross-entity guarded ----
  - entity: EventProject
    initial_state: DRAFT
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: DRAFT
        to: BOOKING
        trigger: "POST /planning/events/{eventId}/confirm"
        actor: Planner
        preconditions:
          - "EventProject.status == DRAFT (else ERR_EVENT_NOT_DRAFT)"
          - "The event's active_contract exists and Contract.status == COUNTERSIGNED (else ERR_CONTRACT_NOT_COUNTERSIGNED) — cross-entity dependency on Contract"
        side_effects: []
        note: "Guarded transition: EventProject cannot enter BOOKING until its Contract is COUNTERSIGNED."
      - from: BOOKING
        to: COMPLETED
        trigger: "POST /planning/events/{eventId}/complete"
        actor: Planner
        preconditions:
          - "EventProject.status == BOOKING (else ERR_EVENT_NOT_BOOKING)"
          - "current logical clock >= event_date (else ERR_EVENT_DATE_NOT_REACHED)"
          - "No VendorBooking for this event is in PROPOSED (else ERR_UNRESOLVED_BOOKINGS) — cross-entity dependency on VendorBooking"
        side_effects:
          - "For each VendorBooking of this event in BOOKED: transition BOOKED -> COMPLETED (cascade)"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /planning/events/{eventId}/cancel"
        actor: Planner
        preconditions:
          - "EventProject.status IN {DRAFT, BOOKING} (else ERR_EVENT_NOT_CANCELLABLE)"
        side_effects:
          - "cancellation_fee_cents = tiered pct of active contract planner_fee_cents by days_to_event (calc cancellation_fee)"
          - "If active_contract exists and not VOID: transition it -> VOID"
          - "For each VendorBooking in {PROPOSED, BOOKED}: transition -> CANCELLED (cascade; each booking cancel itself voids its SCHEDULED payments and restores budget)"
      - from: BOOKING
        to: CANCELLED
        trigger: "POST /planning/events/{eventId}/cancel"
        actor: Planner
        preconditions:
          - "EventProject.status IN {DRAFT, BOOKING} (else ERR_EVENT_NOT_CANCELLABLE)"
        side_effects:
          - "cancellation_fee_cents = tiered pct of active contract planner_fee_cents by days_to_event (calc cancellation_fee)"
          - "If active_contract exists and not VOID: transition it -> VOID"
          - "For each VendorBooking in {PROPOSED, BOOKED}: transition -> CANCELLED (cascade; each booking cancel itself voids its SCHEDULED payments and restores budget)"

  # ---- VendorBooking: linear-with-cancel; cross-entity guarded; ledger sync ----
  - entity: VendorBooking
    initial_state: PROPOSED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: PROPOSED
        to: BOOKED
        trigger: "POST /planning/vendor-bookings/{bookingId}/book"
        actor: Planner
        preconditions:
          - "VendorBooking.status == PROPOSED (else ERR_BOOKING_NOT_PROPOSED)"
          - "Parent EventProject.status == BOOKING (else ERR_EVENT_NOT_BOOKING)"
          - "Vendor has a COI with status == VERIFIED and coverage_expiry_date >= event.event_date (else ERR_COI_NOT_VERIFIED) — cross-entity dependency on COI/Vendor"
          - "committed_spend_cents + contracted_cost_cents <= total_budget_cents (else ERR_BUDGET_EXCEEDED) — fiscal, checked LAST"
        side_effects:
          - "contracted_cost_cents set from request body"
          - "deposit_cents = round_half_up(contracted_cost_cents * DEPOSIT_RATE); balance_cents = contracted_cost_cents - deposit_cents (calc vendor_payment_split)"
          - "Mint two VendorPayments (DEPOSIT amount=deposit_cents, BALANCE amount=balance_cents), each SCHEDULED"
          - "Recompute EventProject.committed_spend_cents, projected_spend_cents, budget_balance_cents, total_deposits_due_cents (calc budget_rollup)"
      - from: BOOKED
        to: COMPLETED
        trigger: "system: parent EventProject complete (cascade)"
        actor: system
        preconditions:
          - "Parent EventProject transitioning BOOKING -> COMPLETED"
        side_effects:
          - "Recompute EventProject.committed_spend_cents (COMPLETED still counts as committed; value unchanged)"
      - from: PROPOSED
        to: CANCELLED
        trigger: "POST /planning/vendor-bookings/{bookingId}/cancel  (or cascade from EventProject cancel)"
        actor: Planner | system
        preconditions:
          - "VendorBooking.status IN {PROPOSED, BOOKED} (else ERR_BOOKING_NOT_CANCELLABLE)"
        side_effects:
          - "Recompute EventProject.projected_spend_cents (PROPOSED estimate removed) (calc budget_rollup)"
      - from: BOOKED
        to: CANCELLED
        trigger: "POST /planning/vendor-bookings/{bookingId}/cancel  (or cascade from EventProject cancel)"
        actor: Planner | system
        preconditions:
          - "VendorBooking.status IN {PROPOSED, BOOKED} (else ERR_BOOKING_NOT_CANCELLABLE)"
        side_effects:
          - "For each VendorPayment of this booking in SCHEDULED: transition SCHEDULED -> VOID (cascade)"
          - "Restore budget: committed_spend_cents -= contracted_cost_cents; recompute budget_balance_cents, total_deposits_due_cents (compensating; calc budget_rollup)"

  # ---- VendorPayment: linear-with-void ----
  - entity: VendorPayment
    initial_state: SCHEDULED
    terminal_states: [PAID, VOID]
    transitions:
      - from: SCHEDULED
        to: PAID
        trigger: "POST /planning/vendor-payments/{paymentId}/pay"
        actor: Planner
        preconditions:
          - "VendorPayment.status == SCHEDULED (else ERR_PAYMENT_NOT_SCHEDULED). A SCHEDULED payment only exists on a BOOKED booking (a cancelled booking has already VOIDed its payments), so no separate booking-state check is needed."
        side_effects:
          - "paid_at = current logical clock"
      - from: SCHEDULED
        to: VOID
        trigger: "system: parent VendorBooking cancel (cascade)"
        actor: system
        preconditions:
          - "Parent VendorBooking transitioning -> CANCELLED"
        side_effects: []

  # ---- Guest: RSVP cycle (non-linear) ----
  - entity: Guest
    initial_state: INVITED
    terminal_states: []
    transitions:
      - from: INVITED
        to: ACCEPTED
        trigger: "POST /planning/guests/{guestId}/rsvp {rsvp_status: ACCEPTED}"
        actor: Planner | Client
        preconditions:
          - "If actor is Client: X-User-ID == Guest.event_id (else ERR_OWNERSHIP_VIOLATION)"
        side_effects:
          - "Recompute event estimated_headcount / confirmed_headcount (calc catering_headcount)"
      - from: INVITED
        to: DECLINED
        trigger: "POST /planning/guests/{guestId}/rsvp {rsvp_status: DECLINED}"
        actor: Planner | Client
        preconditions:
          - "If actor is Client: X-User-ID == Guest.event_id (else ERR_OWNERSHIP_VIOLATION)"
        side_effects:
          - "Recompute event estimated_headcount / confirmed_headcount (calc catering_headcount)"
      - from: ACCEPTED
        to: DECLINED
        trigger: "POST /planning/guests/{guestId}/rsvp {rsvp_status: DECLINED}"
        actor: Planner | Client
        preconditions:
          - "If actor is Client: X-User-ID == Guest.event_id (else ERR_OWNERSHIP_VIOLATION)"
        side_effects:
          - "If a SeatAssignment references this guest: delete it and decrement its Table.occupied_seats by seats_used (cascade)"
          - "Recompute event estimated_headcount / confirmed_headcount (calc catering_headcount)"
      - from: DECLINED
        to: ACCEPTED
        trigger: "POST /planning/guests/{guestId}/rsvp {rsvp_status: ACCEPTED}"
        actor: Planner | Client
        preconditions:
          - "If actor is Client: X-User-ID == Guest.event_id (else ERR_OWNERSHIP_VIOLATION)"
        side_effects:
          - "Recompute event estimated_headcount / confirmed_headcount (calc catering_headcount)"
        note: "ACCEPTED<->DECLINED makes this machine cyclic; re-accepting does NOT re-seat automatically."

  # ---- COI: verify + clock-driven expiry ----
  - entity: COI
    initial_state: PENDING
    terminal_states: [EXPIRED]
    transitions:
      - from: PENDING
        to: VERIFIED
        trigger: "POST /planning/cois/{coiId}/verify"
        actor: Planner
        preconditions:
          - "COI.status == PENDING (else ERR_COI_NOT_PENDING)"
          - "coverage_expiry_date > current logical clock (else ERR_COI_EXPIRED)"
        side_effects: []
      - from: PENDING
        to: EXPIRED
        trigger: "system: clock set where current logical clock >= coverage_expiry_date"
        actor: system
        preconditions: []
        side_effects: []
      - from: VERIFIED
        to: EXPIRED
        trigger: "system: clock set where current logical clock >= coverage_expiry_date"
        actor: system
        preconditions: []
        side_effects: []

# =============================================================================
# 1.2.1 Concurrency Rules  (OCC on parent version — true CREATE-with-supersede race)
# =============================================================================
concurrency_rules:
  - rule_id: contract-supersede-stale-event
    parent_entity: EventProject
    write_endpoint: "POST /planning/contracts"
    occ_field: "expected_event_version"
    description: |
      Creating a Contract against an EventProject whose version has advanced
      since the client last observed it is rejected. A Contract create
      legitimately supersedes the event's prior active contract (VOIDing it and
      bumping the event version); a second create still carrying the pre-supersede
      version is stale and must be rejected. Stated purely as a stale-version
      check on the parent, triggerable by two strictly sequential requests.
    error_id: ERR_STALE_EVENT_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: planner_fee
    trigger: "Contract creation (POST /planning/contracts)"
    algorithm: tiered_pricing
    formula: |
      inputs: package_type, total_budget_cents (B), guest_count_estimate (G)
      switch package_type:
        DAY_OF:  fee = FLAT_DAY_OF
        PARTIAL: fee = BASE_PARTIAL + PER_GUEST * G
        FULL:    rate = 0.12 if B <= FULL_TIER_1
                        else 0.15 if B <= FULL_TIER_2
                        else 0.18
                 fee = BASE_FULL + round_half_up(rate * B)
      => Contract.planner_fee_cents = fee
    input_set: "single Contract's own event fields at creation time"
    constants:
      FLAT_DAY_OF: 250000
      BASE_PARTIAL: 400000
      PER_GUEST: 5000
      BASE_FULL: 800000
      FULL_TIER_1: 5000000     # <= 5,000,000 -> 12%
      FULL_TIER_2: 15000000    # <= 15,000,000 -> 15% ; above -> 18%
      FULL_RATE_1: 0.12
      FULL_RATE_2: 0.15
      FULL_RATE_3: 0.18
    precision: "round_half_up to integer cents; tier selection uses <= (inclusive upper edge)"
    variants:
      - name: full_tiered
        when: "package_type == FULL"
        difference: "budget-tier percentage on the whole budget plus BASE_FULL"
      - name: partial_per_guest
        when: "package_type == PARTIAL"
        difference: "linear per-guest term, independent of budget"

  - name: budget_rollup
    trigger: "VendorBooking create / book / cancel; EventProject complete; read of EventProject"
    algorithm: aggregation
    formula: |
      committed_spend_cents  = sum(vb.contracted_cost_cents
                                   for vb in bookings(event) if vb.status IN {BOOKED, COMPLETED})
      projected_spend_cents  = sum( (vb.contracted_cost_cents if vb.status IN {BOOKED, COMPLETED}
                                     else vb.estimated_cost_cents)
                                   for vb in bookings(event) if vb.status IN {PROPOSED, BOOKED, COMPLETED})
      budget_balance_cents   = total_budget_cents - committed_spend_cents
      total_deposits_due_cents = sum(round_half_up(vb.contracted_cost_cents * DEPOSIT_RATE)
                                   for vb in bookings(event) if vb.status == BOOKED)   # round per booking THEN sum
    input_set: "all VendorBookings of the event; CANCELLED excluded from every sum"
    constants:
      DEPOSIT_RATE: 0.30
    precision: "integer cents; deposits rounded per-booking (round_half_up) before summation"
    variants:
      - name: committed_actual
        when: "authoritative balance / fiscal guard"
        difference: "only BOOKED+COMPLETED at contracted_cost_cents; excludes PROPOSED"
      - name: projected_forward
        when: "planning outlook"
        difference: "adds PROPOSED bookings at estimated_cost_cents; diverges from committed whenever a PROPOSED booking exists"

  - name: catering_headcount
    trigger: "Guest create; Guest rsvp transition; read of EventProject"
    algorithm: aggregation
    formula: |
      estimated_headcount = sum(g.party_size for g in guests(event) if g.rsvp_status IN {INVITED, ACCEPTED})
      confirmed_headcount = sum(g.party_size for g in guests(event) if g.rsvp_status == ACCEPTED)
    input_set: "all Guests of the event; DECLINED excluded from both"
    precision: "integer count"
    variants:
      - name: estimated_planning
        when: "planning outlook (order more chairs/meals)"
        difference: "includes not-yet-responded INVITED parties"
      - name: confirmed_final
        when: "final catering guarantee"
        difference: "ACCEPTED only; diverges from estimated whenever an INVITED party exists"

  - name: vendor_payment_split
    trigger: "VendorBooking book (POST /planning/vendor-bookings/{bookingId}/book)"
    algorithm: waterfall_allocation
    formula: |
      deposit_cents = round_half_up(contracted_cost_cents * DEPOSIT_RATE)
      balance_cents = contracted_cost_cents - deposit_cents      # exact remainder, never re-rounded
      # deposit is rounded FIRST; balance absorbs the rounding residue so
      # deposit_cents + balance_cents == contracted_cost_cents exactly.
    input_set: "the single VendorBooking being booked"
    constants:
      DEPOSIT_RATE: 0.30
    precision: "round_half_up on deposit only; balance is exact subtraction (rounding order pinned: round deposit, then subtract)"

  - name: cancellation_fee
    trigger: "EventProject cancel (POST /planning/events/{eventId}/cancel)"
    algorithm: threshold
    formula: |
      pf = active contract planner_fee_cents (0 if no active contract)
      days_to_event = floor((event_date - current_logical_clock) / 86400 seconds)   # may be negative
      rate = 0.25 if days_to_event >= FAR_DAYS
             else 0.50 if days_to_event >= NEAR_DAYS
             else 1.00
      cancellation_fee_cents = round_half_up(rate * pf)
    input_set: "the event's active contract planner_fee_cents and the current clock"
    constants:
      FAR_DAYS: 90      # >= 90 days out -> 25%
      NEAR_DAYS: 30     # >= 30 and < 90 -> 50% ; < 30 -> 100%
    precision: "round_half_up to integer cents; boundaries use >= (90 and 30 inclusive of the lower tier's floor)"

  - name: staff_labor_cost
    trigger: "StaffAssignment create (POST /planning/staff-assignments)"
    algorithm: aggregation
    formula: |
      minutes = shift_end_offset_min - shift_start_offset_min
      labor_cost_cents = round_half_up(staff.hourly_rate_cents * minutes / 60)
    input_set: "the single StaffAssignment being created and its StaffMember rate"
    precision: "round_half_up to integer cents"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and X-User-Role is a known role"
    error_id: ERR_MISSING_OR_INVALID_HEADERS
    http_status: 400
    applies_to: all

  - priority: 2
    category: auth
    check: "Role is permitted to invoke this operation per the RBAC matrix"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 3
    category: auth
    check: "For entity_backed roles acting on an owned resource, X-User-ID equals the resource's owning id (Client: event id; Vendor: vendor id)"
    error_id: ERR_OWNERSHIP_VIOLATION
    http_status: 403
    applies_to: "Client sign/request-revision/guest-create/guest-rsvp; Vendor coi-create"

  - priority: 4
    category: existence
    check: "All path and body resource ids resolve to existing resources (validated left-to-right)"
    error_id: "ERR_{RESOURCE}_NOT_FOUND"
    http_status: 404
    applies_to: all

  - priority: 5
    category: business_constraint
    check: "Request body well-formed: required fields present, enum members valid, integers non-negative"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all create/mutation endpoints"

  - priority: 6
    category: business_temporal
    check: "Interval well-formed: end_offset_min > start_offset_min (timeline & staff shift)"
    error_id: ERR_INVALID_INTERVAL
    http_status: 422
    applies_to: "POST /planning/timeline-blocks; POST /planning/staff-assignments"

  - priority: 7
    category: state
    check: "OCC: expected_event_version matches EventProject.version (contract create)"
    error_id: ERR_STALE_EVENT_VERSION
    http_status: 412
    applies_to: "POST /planning/contracts"
    note: "Checked before business logic on the create path."

  - priority: 8
    category: state
    check: "Target resource is in a state that permits the requested transition (each transition names its own specific error, e.g. ERR_CONTRACT_NOT_DRAFT, ERR_BOOKING_NOT_PROPOSED, ERR_EVENT_NOT_BOOKING)"
    error_id: "ERR_{ENTITY}_NOT_{STATE}"
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 9
    category: state
    check: "Seat assignment: the Guest is ACCEPTED"
    error_id: ERR_GUEST_NOT_ACCEPTED
    http_status: 409
    applies_to: "POST /planning/seat-assignments"

  - priority: 10
    category: business_referential
    check: "Seat assignment: guest_id and table_id belong to the SAME event named by event_id"
    error_id: ERR_SEAT_EVENT_MISMATCH
    http_status: 400
    applies_to: "POST /planning/seat-assignments"

  - priority: 11
    category: business_safety
    check: "Vendor booking book: the Vendor has a VERIFIED COI whose coverage_expiry_date >= event.event_date"
    error_id: ERR_COI_NOT_VERIFIED
    http_status: 403
    applies_to: "POST /planning/vendor-bookings/{bookingId}/book"

  - priority: 12
    category: business_constraint
    check: |
      Temporal overlap. TimelineBlock: reject if another block in the SAME event+zone has a
      half-open interval [s2,e2) overlapping [start,end) — i.e. start < e2 AND s2 < end;
      adjacency (end == s2 or e2 == start) is allowed. StaffAssignment: reject if the SAME
      staff_member has another shift within BUFFER_MIN (=30) minutes — i.e. NOT
      (end + 30 <= s2 OR e2 + 30 <= start); the 30-minute gap is measured on the closed
      interval and is inclusive (a gap of exactly 30 is allowed).
    error_id: "ERR_TIMELINE_OVERLAP / ERR_STAFF_DOUBLE_BOOKED"
    http_status: 409
    applies_to: "POST /planning/timeline-blocks; POST /planning/staff-assignments"

  - priority: 13
    category: business_constraint
    check: "Seat assignment: guest not already seated (uniqueness); table has capacity (occupied_seats + party_size <= capacity)"
    error_id: "ERR_GUEST_ALREADY_SEATED / ERR_TABLE_CAPACITY_EXCEEDED"
    http_status: 409
    applies_to: "POST /planning/seat-assignments"

  - priority: 14
    category: business_fiscal
    check: "Vendor booking book: committed_spend_cents + contracted_cost_cents <= total_budget_cents (fiscal, LAST)"
    error_id: ERR_BUDGET_EXCEEDED
    http_status: 402
    applies_to: "POST /planning/vendor-bookings/{bookingId}/book"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Logical clock (test-driving) ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock. Startup default is 2026-03-01T00:00:00Z; before any set, the clock reads exactly this default and never falls back to wall-clock time. On set, sweeps every COI whose coverage_expiry_date <= the new clock to EXPIRED."
    roles: [Planner]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["logical clock updated", "COIs with coverage_expiry_date <= new clock -> EXPIRED"]

  # ---- EventProject ----
  - method: POST
    path: "/planning/events"
    description: "Create an event project"
    roles: [Planner]
    code: 201
    input: [couple_names, event_date, venue_name, package_type, total_budget_cents, guest_count_estimate]
    output: EventProject
    side_effects: ["status=DRAFT", "version=1", "all computed budget/headcount fields initialized to 0"]
  - method: GET
    path: "/planning/events"
    description: "List event projects"
    roles: [Planner, Client, Vendor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "EventProject[]"
    side_effects: []
  - method: GET
    path: "/planning/events/{eventId}"
    description: "Get one event project (computed budget & headcount fields reflect current state)"
    roles: [Planner, Client, Vendor]
    code: 200
    input: []
    output: EventProject
    side_effects: []
  - method: POST
    path: "/planning/events/{eventId}/confirm"
    description: "DRAFT -> BOOKING; requires the active contract to be COUNTERSIGNED"
    roles: [Planner]
    code: 200
    input: []
    output: EventProject
    side_effects: ["status -> BOOKING"]
  - method: POST
    path: "/planning/events/{eventId}/complete"
    description: "BOOKING -> COMPLETED; requires clock >= event_date and no PROPOSED bookings"
    roles: [Planner]
    code: 200
    input: []
    output: EventProject
    side_effects: ["status -> COMPLETED", "BOOKED bookings -> COMPLETED (cascade)"]
  - method: POST
    path: "/planning/events/{eventId}/cancel"
    description: "DRAFT/BOOKING -> CANCELLED; computes cancellation_fee, voids contract, cascades booking cancels"
    roles: [Planner]
    code: 200
    input: []
    output: EventProject
    side_effects:
      - "status -> CANCELLED"
      - "cancellation_fee_cents computed (calc cancellation_fee)"
      - "active contract -> VOID"
      - "non-terminal VendorBookings -> CANCELLED (cascade), which voids their SCHEDULED payments and restores budget"

  # ---- Contract ----
  - method: POST
    path: "/planning/contracts"
    description: "Create/supersede a contract for an event. Requires expected_event_version (OCC). Supersedes and VOIDs the event's prior active contract, sets active_contract_id, computes planner_fee_cents, increments EventProject.version by 1."
    roles: [Planner]
    code: 201
    input: [event_id, expected_event_version]
    output: Contract
    side_effects:
      - "Contract created in DRAFT with planner_fee_cents (calc planner_fee) and package_type copied from event"
      - "prior active contract (if any) -> VOID"
      - "EventProject.active_contract_id set to the new contract"
      - "increments EventProject.version by 1"
  - method: GET
    path: "/planning/contracts"
    description: "List contracts (filter by event_id)"
    roles: [Planner, Client, Vendor]
    code: 200
    input: ["event_id?", "limit?", "offset?"]
    output: "Contract[]"
    side_effects: []
  - method: GET
    path: "/planning/contracts/{contractId}"
    description: "Get one contract"
    roles: [Planner, Client, Vendor]
    code: 200
    input: []
    output: Contract
    side_effects: []
  - method: POST
    path: "/planning/contracts/{contractId}/send"
    description: "DRAFT -> SENT"
    roles: [Planner]
    code: 200
    input: []
    output: Contract
    side_effects: ["status -> SENT"]
  - method: POST
    path: "/planning/contracts/{contractId}/sign"
    description: "SENT -> SIGNED (Client signs own event's contract)"
    roles: [Client]
    code: 200
    input: []
    output: Contract
    side_effects: ["status -> SIGNED", "signed_at stamped"]
  - method: POST
    path: "/planning/contracts/{contractId}/countersign"
    description: "SIGNED -> COUNTERSIGNED (Planner)"
    roles: [Planner]
    code: 200
    input: []
    output: Contract
    side_effects: ["status -> COUNTERSIGNED"]
  - method: POST
    path: "/planning/contracts/{contractId}/request-revision"
    description: "SENT -> DRAFT (revision loop); increments revision_count"
    roles: [Client, Planner]
    code: 200
    input: []
    output: Contract
    side_effects: ["status -> DRAFT", "revision_count += 1"]

  # ---- Vendor ----
  - method: POST
    path: "/planning/vendors"
    description: "Create a vendor directory entry"
    roles: [Planner]
    code: 201
    input: [name, category, contact_email]
    output: Vendor
    side_effects: []
  - method: GET
    path: "/planning/vendors"
    description: "List vendors (filter by category)"
    roles: [Planner, Client, Vendor]
    code: 200
    input: ["category?", "limit?", "offset?"]
    output: "Vendor[]"
    side_effects: []
  - method: GET
    path: "/planning/vendors/{vendorId}"
    description: "Get one vendor"
    roles: [Planner, Client, Vendor]
    code: 200
    input: []
    output: Vendor
    side_effects: []

  # ---- COI ----
  - method: POST
    path: "/planning/cois"
    description: "Submit a Certificate of Insurance for a vendor (PENDING). Vendor may submit only for its own vendor_id."
    roles: [Vendor, Planner]
    code: 201
    input: [vendor_id, policy_number, coverage_amount_cents, coverage_expiry_date]
    output: COI
    side_effects: ["status=PENDING"]
  - method: GET
    path: "/planning/cois"
    description: "List COIs (filter by vendor_id)"
    roles: [Planner, Client, Vendor]
    code: 200
    input: ["vendor_id?", "limit?", "offset?"]
    output: "COI[]"
    side_effects: []
  - method: GET
    path: "/planning/cois/{coiId}"
    description: "Get one COI"
    roles: [Planner, Client, Vendor]
    code: 200
    input: []
    output: COI
    side_effects: []
  - method: POST
    path: "/planning/cois/{coiId}/verify"
    description: "PENDING -> VERIFIED (Planner); rejects if coverage_expiry_date <= clock"
    roles: [Planner]
    code: 200
    input: []
    output: COI
    side_effects: ["status -> VERIFIED"]

  # ---- VendorBooking ----
  - method: POST
    path: "/planning/vendor-bookings"
    description: "Propose a vendor booking (PROPOSED) with an estimated cost"
    roles: [Planner]
    code: 201
    input: [event_id, vendor_id, service_description, estimated_cost_cents]
    output: VendorBooking
    side_effects: ["status=PROPOSED", "recompute projected_spend_cents (calc budget_rollup)"]
  - method: GET
    path: "/planning/vendor-bookings"
    description: "List vendor bookings (filter by event_id and/or vendor_id)"
    roles: [Planner, Client, Vendor]
    code: 200
    input: ["event_id?", "vendor_id?", "limit?", "offset?"]
    output: "VendorBooking[]"
    side_effects: []
  - method: GET
    path: "/planning/vendor-bookings/{bookingId}"
    description: "Get one vendor booking"
    roles: [Planner, Client, Vendor]
    code: 200
    input: []
    output: VendorBooking
    side_effects: []
  - method: POST
    path: "/planning/vendor-bookings/{bookingId}/book"
    description: "PROPOSED -> BOOKED with contracted cost; requires event BOOKING, vendor VERIFIED COI, budget. Mints DEPOSIT+BALANCE payments."
    roles: [Planner]
    code: 200
    input: [contracted_cost_cents]
    output: VendorBooking
    side_effects:
      - "status -> BOOKED"
      - "deposit_cents/balance_cents computed (calc vendor_payment_split)"
      - "two VendorPayments minted (DEPOSIT, BALANCE), SCHEDULED"
      - "recompute committed/projected/balance/total_deposits_due (calc budget_rollup)"
  - method: POST
    path: "/planning/vendor-bookings/{bookingId}/cancel"
    description: "PROPOSED/BOOKED -> CANCELLED; voids SCHEDULED payments and restores budget"
    roles: [Planner]
    code: 200
    input: []
    output: VendorBooking
    side_effects:
      - "status -> CANCELLED"
      - "SCHEDULED payments of this booking -> VOID (cascade)"
      - "restore committed_spend_cents; recompute balance/total_deposits_due (calc budget_rollup)"

  # ---- VendorPayment (minted by book; no direct create) ----
  - method: GET
    path: "/planning/vendor-payments"
    description: "List vendor payments (filter by vendor_booking_id) — discovery channel for cascade-minted payments"
    roles: [Planner, Client, Vendor]
    code: 200
    input: ["vendor_booking_id?", "limit?", "offset?"]
    output: "VendorPayment[]"
    side_effects: []
  - method: GET
    path: "/planning/vendor-payments/{paymentId}"
    description: "Get one vendor payment"
    roles: [Planner, Client, Vendor]
    code: 200
    input: []
    output: VendorPayment
    side_effects: []
  - method: POST
    path: "/planning/vendor-payments/{paymentId}/pay"
    description: "SCHEDULED -> PAID (Planner)"
    roles: [Planner]
    code: 200
    input: []
    output: VendorPayment
    side_effects: ["status -> PAID", "paid_at stamped"]

  # ---- TimelineBlock ----
  - method: POST
    path: "/planning/timeline-blocks"
    description: "Add a run-of-show block; rejects if it overlaps another block in the same event+zone (half-open interval)"
    roles: [Planner]
    code: 201
    input: [event_id, label, zone, block_type, start_offset_min, end_offset_min]
    output: TimelineBlock
    side_effects: []
  - method: GET
    path: "/planning/timeline-blocks"
    description: "List timeline blocks (filter by event_id and/or zone)"
    roles: [Planner, Client, Vendor]
    code: 200
    input: ["event_id?", "zone?", "limit?", "offset?"]
    output: "TimelineBlock[]"
    side_effects: []
  - method: GET
    path: "/planning/timeline-blocks/{blockId}"
    description: "Get one timeline block"
    roles: [Planner, Client, Vendor]
    code: 200
    input: []
    output: TimelineBlock
    side_effects: []

  # ---- Guest ----
  - method: POST
    path: "/planning/guests"
    description: "Add a guest/party (INVITED). Client may add only to their own event."
    roles: [Planner, Client]
    code: 201
    input: [event_id, guest_name, party_size, "meal_choice?"]
    output: Guest
    side_effects: ["status=INVITED", "recompute estimated_headcount (calc catering_headcount)"]
  - method: GET
    path: "/planning/guests"
    description: "List guests (filter by event_id and/or rsvp_status)"
    roles: [Planner, Client, Vendor]
    code: 200
    input: ["event_id?", "rsvp_status?", "limit?", "offset?"]
    output: "Guest[]"
    side_effects: []
  - method: GET
    path: "/planning/guests/{guestId}"
    description: "Get one guest"
    roles: [Planner, Client, Vendor]
    code: 200
    input: []
    output: Guest
    side_effects: []
  - method: POST
    path: "/planning/guests/{guestId}/rsvp"
    description: "Change RSVP (INVITED/ACCEPTED/DECLINED cycle). Client may change only their own event's guests. ACCEPTED->DECLINED unseats."
    roles: [Planner, Client]
    code: 200
    input: [rsvp_status, "meal_choice?"]
    output: Guest
    side_effects:
      - "rsvp_status transition per Guest state machine"
      - "on ACCEPTED->DECLINED: delete the guest's SeatAssignment and decrement table.occupied_seats (cascade)"
      - "recompute headcounts (calc catering_headcount)"

  # ---- Table ----
  - method: POST
    path: "/planning/tables"
    description: "Add a reception table with a fixed capacity"
    roles: [Planner]
    code: 201
    input: [event_id, table_label, capacity]
    output: Table
    side_effects: ["occupied_seats=0"]
  - method: GET
    path: "/planning/tables"
    description: "List tables (filter by event_id)"
    roles: [Planner, Client, Vendor]
    code: 200
    input: ["event_id?", "limit?", "offset?"]
    output: "Table[]"
    side_effects: []
  - method: GET
    path: "/planning/tables/{tableId}"
    description: "Get one table (occupied_seats reconciled)"
    roles: [Planner, Client, Vendor]
    code: 200
    input: []
    output: Table
    side_effects: []

  # ---- SeatAssignment ----
  - method: POST
    path: "/planning/seat-assignments"
    description: "Seat an ACCEPTED guest at a table; enforces same-event, uniqueness, capacity"
    roles: [Planner]
    code: 201
    input: [event_id, guest_id, table_id]
    output: SeatAssignment
    side_effects: ["seats_used = guest.party_size", "table.occupied_seats += seats_used (derived reconciliation)"]
  - method: GET
    path: "/planning/seat-assignments"
    description: "List seat assignments (filter by event_id, guest_id, and/or table_id)"
    roles: [Planner, Client, Vendor]
    code: 200
    input: ["event_id?", "guest_id?", "table_id?", "limit?", "offset?"]
    output: "SeatAssignment[]"
    side_effects: []
  - method: GET
    path: "/planning/seat-assignments/{assignmentId}"
    description: "Get one seat assignment"
    roles: [Planner, Client, Vendor]
    code: 200
    input: []
    output: SeatAssignment
    side_effects: []
  - method: DELETE
    path: "/planning/seat-assignments/{assignmentId}"
    description: "Remove a seat assignment; releases seats back to the table"
    roles: [Planner]
    code: 204
    input: []
    output: null
    side_effects: ["table.occupied_seats -= seats_used (compensating; derived reconciliation)"]

  # ---- StaffMember ----
  - method: POST
    path: "/planning/staff-members"
    description: "Add a day-of staff member to the event roster"
    roles: [Planner]
    code: 201
    input: [event_id, staff_name, role_title, hourly_rate_cents]
    output: StaffMember
    side_effects: []
  - method: GET
    path: "/planning/staff-members"
    description: "List staff members (filter by event_id)"
    roles: [Planner, Client, Vendor]
    code: 200
    input: ["event_id?", "limit?", "offset?"]
    output: "StaffMember[]"
    side_effects: []
  - method: GET
    path: "/planning/staff-members/{staffId}"
    description: "Get one staff member"
    roles: [Planner, Client, Vendor]
    code: 200
    input: []
    output: StaffMember
    side_effects: []

  # ---- StaffAssignment ----
  - method: POST
    path: "/planning/staff-assignments"
    description: "Assign a staff member to a shift; rejects if within BUFFER minutes of another shift for the same staff"
    roles: [Planner]
    code: 201
    input: [event_id, staff_member_id, shift_start_offset_min, shift_end_offset_min]
    output: StaffAssignment
    side_effects: ["labor_cost_cents computed (calc staff_labor_cost)"]
  - method: GET
    path: "/planning/staff-assignments"
    description: "List staff assignments (filter by event_id and/or staff_member_id)"
    roles: [Planner, Client, Vendor]
    code: 200
    input: ["event_id?", "staff_member_id?", "limit?", "offset?"]
    output: "StaffAssignment[]"
    side_effects: []
  - method: GET
    path: "/planning/staff-assignments/{assignmentId}"
    description: "Get one staff assignment"
    roles: [Planner, Client, Vendor]
    code: 200
    input: []
    output: StaffAssignment
    side_effects: []

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  # --- auth / authz / ownership ---
  - { id: ERR_MISSING_OR_INVALID_HEADERS, http: 400, condition: "X-User-ID or X-User-Role header missing or role unknown" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted for this operation per RBAC matrix" }
  - { id: ERR_OWNERSHIP_VIOLATION, http: 403, condition: "entity_backed role acting on a resource it does not own (Client not owner of event; Vendor not owner of vendor_id)" }
  # --- not found ---
  - { id: ERR_EVENT_NOT_FOUND, http: 404, condition: "EventProject id does not exist" }
  - { id: ERR_CONTRACT_NOT_FOUND, http: 404, condition: "Contract id does not exist" }
  - { id: ERR_VENDOR_NOT_FOUND, http: 404, condition: "Vendor id does not exist" }
  - { id: ERR_COI_NOT_FOUND, http: 404, condition: "COI id does not exist" }
  - { id: ERR_BOOKING_NOT_FOUND, http: 404, condition: "VendorBooking id does not exist" }
  - { id: ERR_PAYMENT_NOT_FOUND, http: 404, condition: "VendorPayment id does not exist" }
  - { id: ERR_TIMELINE_BLOCK_NOT_FOUND, http: 404, condition: "TimelineBlock id does not exist" }
  - { id: ERR_GUEST_NOT_FOUND, http: 404, condition: "Guest id does not exist" }
  - { id: ERR_TABLE_NOT_FOUND, http: 404, condition: "Table id does not exist" }
  - { id: ERR_SEAT_ASSIGNMENT_NOT_FOUND, http: 404, condition: "SeatAssignment id does not exist" }
  - { id: ERR_STAFF_MEMBER_NOT_FOUND, http: 404, condition: "StaffMember id does not exist" }
  - { id: ERR_STAFF_ASSIGNMENT_NOT_FOUND, http: 404, condition: "StaffAssignment id does not exist" }
  # --- input ---
  - { id: ERR_VALIDATION, http: 400, condition: "Malformed body: missing required field, invalid enum, negative integer where non-negative required" }
  - { id: ERR_INVALID_INTERVAL, http: 422, condition: "Interval end_offset_min <= start_offset_min (timeline or staff shift)" }
  - { id: ERR_SEAT_EVENT_MISMATCH, http: 400, condition: "Seat assignment guest_id/table_id do not both belong to event_id" }
  # --- OCC ---
  - { id: ERR_STALE_EVENT_VERSION, http: 412, condition: "expected_event_version does not match EventProject.version on contract create" }
  # --- state ---
  - { id: ERR_EVENT_NOT_DRAFT, http: 409, condition: "Event must be DRAFT to confirm" }
  - { id: ERR_EVENT_NOT_BOOKING, http: 409, condition: "Event must be BOOKING (booking/seat/complete operations)" }
  - { id: ERR_EVENT_NOT_CANCELLABLE, http: 409, condition: "Event must be DRAFT or BOOKING to cancel" }
  - { id: ERR_EVENT_DATE_NOT_REACHED, http: 409, condition: "Complete attempted before clock >= event_date" }
  - { id: ERR_UNRESOLVED_BOOKINGS, http: 409, condition: "Complete attempted while a VendorBooking is still PROPOSED" }
  - { id: ERR_CONTRACT_NOT_DRAFT, http: 409, condition: "Contract must be DRAFT to send" }
  - { id: ERR_CONTRACT_NOT_SENT, http: 409, condition: "Contract must be SENT to sign or request revision" }
  - { id: ERR_CONTRACT_NOT_SIGNED, http: 409, condition: "Contract must be SIGNED to countersign" }
  - { id: ERR_CONTRACT_NOT_COUNTERSIGNED, http: 409, condition: "Event confirm requires the active contract to be COUNTERSIGNED" }
  - { id: ERR_BOOKING_NOT_PROPOSED, http: 409, condition: "VendorBooking must be PROPOSED to book" }
  - { id: ERR_BOOKING_NOT_CANCELLABLE, http: 409, condition: "VendorBooking must be PROPOSED or BOOKED to cancel" }
  - { id: ERR_PAYMENT_NOT_SCHEDULED, http: 409, condition: "VendorPayment must be SCHEDULED to pay" }
  - { id: ERR_GUEST_NOT_ACCEPTED, http: 409, condition: "Seat assignment requires the guest to be ACCEPTED" }
  - { id: ERR_COI_NOT_PENDING, http: 409, condition: "COI must be PENDING to verify" }
  # --- business ---
  - { id: ERR_COI_EXPIRED, http: 422, condition: "Verify attempted on a COI whose coverage_expiry_date <= current clock" }
  - { id: ERR_COI_NOT_VERIFIED, http: 403, condition: "Book requires a VERIFIED COI with coverage_expiry_date >= event.event_date" }
  - { id: ERR_TIMELINE_OVERLAP, http: 409, condition: "Timeline block overlaps another block in the same event+zone (half-open)" }
  - { id: ERR_STAFF_DOUBLE_BOOKED, http: 409, condition: "Staff assignment within BUFFER minutes of another shift for the same staff" }
  - { id: ERR_GUEST_ALREADY_SEATED, http: 409, condition: "Guest already has a seat assignment" }
  - { id: ERR_TABLE_CAPACITY_EXCEEDED, http: 409, condition: "occupied_seats + party_size > capacity" }
  - { id: ERR_BUDGET_EXCEEDED, http: 402, condition: "committed_spend_cents + contracted_cost_cents > total_budget_cents on book" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Planner
    description: "Full-service planning operator: drives events, contracts (draft/send/countersign/revision), vendor directory, COI verification, bookings, payments, timeline, tables, seating, staffing, and the clock."
    identity: opaque
    exclusive_operations:
      - "POST /planning/events — create event"
      - "POST /planning/events/{eventId}/confirm — DRAFT->BOOKING"
      - "POST /planning/events/{eventId}/complete — BOOKING->COMPLETED"
      - "POST /planning/events/{eventId}/cancel — cancel"
      - "POST /planning/contracts — create/supersede contract"
      - "POST /planning/contracts/{contractId}/send — send"
      - "POST /planning/contracts/{contractId}/countersign — countersign"
      - "POST /planning/vendors — create vendor"
      - "POST /planning/cois/{coiId}/verify — verify COI"
      - "POST /planning/vendor-bookings — propose booking"
      - "POST /planning/vendor-bookings/{bookingId}/book — book"
      - "POST /planning/vendor-bookings/{bookingId}/cancel — cancel booking"
      - "POST /planning/vendor-payments/{paymentId}/pay — pay"
      - "POST /planning/timeline-blocks — add timeline block"
      - "POST /planning/tables — add table"
      - "POST /planning/seat-assignments — seat a guest"
      - "DELETE /planning/seat-assignments/{assignmentId} — unseat"
      - "POST /planning/staff-members — add staff member"
      - "POST /planning/staff-assignments — assign shift"
      - "POST /_clock/set_current_utc — set logical clock"
    shared_operations:
      - "POST /planning/contracts/{contractId}/request-revision — request revision (with Client)"
      - "POST /planning/cois — submit COI (with Vendor)"
      - "POST /planning/guests — add guest (with Client)"
      - "POST /planning/guests/{guestId}/rsvp — change RSVP (with Client)"
      - "GET (all list/detail read endpoints, with Client and Vendor)"

  - name: Client
    description: "The client/couple. Acts only on their own event (X-User-ID == that EventProject.id): signs the contract, requests revisions, and manages their guest list/RSVPs."
    identity: "entity_backed:EventProject"
    exclusive_operations:
      - "POST /planning/contracts/{contractId}/sign — SENT->SIGNED on own event's contract"
    shared_operations:
      - "POST /planning/contracts/{contractId}/request-revision — request revision (with Planner)"
      - "POST /planning/guests — add guest to own event (with Planner)"
      - "POST /planning/guests/{guestId}/rsvp — change RSVP on own event's guests (with Planner)"
      - "GET (all list/detail read endpoints)"

  - name: Vendor
    description: "A vendor. Acts only on its own vendor record (X-User-ID == that Vendor.id): submits Certificates of Insurance."
    identity: "entity_backed:Vendor"
    exclusive_operations: []
    shared_operations:
      - "POST /planning/cois — submit a COI for own vendor_id (with Planner)"
      - "GET (all list/detail read endpoints)"
