              as: OpsAdmin
              captures: { crew_id: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust_id}", site_address: "6 Lawn Way" }
              as: SalesRep
              captures: { proj_id: $.data.id }
            - call: "POST /site-measures"
              payload: { project_id: "${proj_id}", gross_area_sqft: 600, longest_run_ft: 20, slope_pct: 1.0 }
              as: SalesRep
              captures: { measure_id: $.data.id }
            - call: "POST /design-layouts"
              payload: { project_id: "${proj_id}", site_measure_id: "${measure_id}", turf_product_id: "${turf_id}", infill_product_id: "${infill_id}", variant: "STANDARD" }
              as: SalesRep
              captures: { design_id: $.data.id }
            - call: "POST /design-layouts/${design_id}/accept"
              payload: {}
              as: SalesRep
            - call: "POST /base-prep-scopes"
              payload: { project_id: "${proj_id}", design_layout_id: "${design_id}", base_depth_in: 3 }
              as: SalesRep
              captures: { scope_id: $.data.id }
            - call: "POST /base-prep-scopes/${scope_id}/finalize"
              payload: {}
              as: SalesRep
            - call: "POST /warranty-plans"
              payload: { project_id: "${proj_id}", tier: "BASIC" }
              as: SalesRep
              captures: { warranty_id: $.data.id }
            - call: "POST /quotes"
              payload: { project_id: "${proj_id}", design_layout_id: "${design_id}", base_prep_scope_id: "${scope_id}", deposit_pct: 0.30 }
              as: SalesRep
              captures: { quote_id: $.data.id }
            - call: "POST /quotes/${quote_id}/send"
              payload: {}
              as: SalesRep
            - call: "GET /projects/${proj_id}"
              payload: {}
              as: OpsAdmin
              captures: { v_pre_accept: $.data.version }
            - call: "POST /quotes/${quote_id}/accept"
              payload: { expected_project_version: "${v_pre_accept}" }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /payments"
              payload: { project_id: "${proj_id}", kind: "DEPOSIT", amount_cents: 129470 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { dep_pay_id: $.data.id }
            - call: "POST /_payments/settle"
              payload: { payment_id: "${dep_pay_id}" }
              as: OpsAdmin
            - call: "POST /install-jobs"
              payload: { project_id: "${proj_id}", crew_id: "${crew_id}", scheduled_start: "2026-04-05T09:00:00Z", scheduled_end: "2026-04-05T17:00:00Z" }
              as: Scheduler
              captures: { job_id: $.data.id }
            - call: "POST /install-jobs/${job_id}/start"
              payload: {}
              as: Scheduler
          trigger:
            - call: "POST /install-jobs/${job_id}/complete"
              payload: {}
              as: Scheduler
              captures: { final_status: $.data.status }
          assert:
            - "InstallJob.${job_id}.status == COMPLETED"
            - "Project.${proj_id}.workflow_status == INSTALLED"
            - "Project.${proj_id}.finance_status == BALANCE_DUE"
            - "WarrantyPlan.${warranty_id}.status == ACTIVE (COMPLETE branch activates warranty; ABORT branch would leave it PENDING)"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      # --- Instance 1: depth >= 3 cancel -> abort job + create refund -> settle -> REFUNDED
      - name: cancel_refund_chain_depth3
        grounds:
          - state_machines.Project.workflow_status.DEPOSIT_PAID_to_CANCELLED
          - state_machines.Payment.PENDING_to_SETTLED
          - state_machines.Project.finance_status.DEPOSIT_DUE_to_REFUNDED
        distinguishing_aspect: |
          Depth-3 cascade triggered by project cancel: cancel (A) ABORTs the SCHEDULED
          InstallJob and creates a PENDING REFUND Payment (B); settling that REFUND (C)
          flips Project.finance_status to REFUNDED. Each hop is caused by the prior hop.
        test_recipe:
          setup:
            - "STANDARD project deposit-paid (deposit 129470 SETTLED), SCHEDULED with one InstallJob."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Gus G", email: "gus@x.com" }
