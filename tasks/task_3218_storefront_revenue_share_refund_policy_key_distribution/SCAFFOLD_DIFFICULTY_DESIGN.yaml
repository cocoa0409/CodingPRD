              payload: {}
              as: PlatformOps
            - call: "POST /storefront/titles"
              payload: { developer_account_id: "${dv_id}", title_name: "Gate Game", base_price_usd_cents: 700, early_access: false }
              as: Developer
              as_user_id: "${dv_id}"
              captures: { t_id: $.data.id }
