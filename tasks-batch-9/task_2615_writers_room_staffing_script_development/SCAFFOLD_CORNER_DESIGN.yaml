              as: Writer
              as_user_id: "${ar3}"
          assert:
            - "After trigger call 1: status == PANEL_VOTING, votes_cast_count == 1, vote_ledger has exactly one entry keyed by ${ar1}, leading_writer_id == ${w1} (tie 50/50 broken by the earlier CreditSubmission.created_at) and concurrence_pct == 1.0"
            - "After trigger call 2: status is still PANEL_VOTING, votes_cast_count == 2, leading_writer_id == ${w2} (means 45/55) and concurrence_pct == 1.0 (both ballots are within the 10-point band of the 55 mean)"
            - "After trigger call 3: status is still PANEL_VOTING and votes_cast_count == 3, leading_writer_id == ${w2}, concurrence_pct == 1.0"
            - "Episode.${ep1}.credit_status == IN_ARBITRATION and final_credit_shares == {} - no share is written before determine"
            - "CreditArbitration.${arb}.outcome == NONE and determined_credit_string == null"

      - name: cyclic_revision_loop_on_a_script_assignment
        claim_type: cyclic
        grounds:
          - state_machines.ScriptAssignment.transitions.DELIVERED_to_IN_NOTES
          - state_machines.ScriptAssignment.transitions.IN_NOTES_to_DRAFTING
        excluded_because:
          difficulty_instance: non_linear_state_machine / script_assignment_revision_loop_traversed_twice_then_capped
          rationale: "That §1.8 instance traverses the DELIVERED -> IN_NOTES -> DRAFTING loop twice and asserts the third pass is refused with ERR_REVISION_CAP_EXCEEDED, which is exactly the cyclic-shape claim."

      - name: guarded_transition_assignment_create_requires_a_confirmed_seat_and_active_room
        claim_type: guarded_transitions
        grounds:
          - validations.priority_70_business_referential
          - errors.ERR_WRITER_NOT_STAFFED
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / assignment_creation_requires_confirmed_seat_and_active_room_together
          rationale: "That §1.8 instance drives all four combinations of seat status and room status and asserts ERR_WRITER_NOT_STAFFED for each failing pair."

      - name: compensation_void_reverses_every_original_side_effect
        claim_type: compensation
        grounds:
          - state_machines.ScriptAssignment.transitions.to_VOID
          - calculations.fee_ledger_conservation
        excluded_because:
          difficulty_instance: compensating_invariant / void_restores_season_committed_fee_and_drives_the_assignment_ledger_sum_to_zero
          rationale: "That §1.8 instance asserts the money, the guarantee slot, the episode readiness and the milestone freeze after the void, with no drift."

  - section: calculations
    instances:
      - name: writer_level_determination_is_inclusive_at_every_threshold_boundary
        claim_type: correct_result
        grounds:
          - calculations.writer_level_determination
          - calculations.writer_level_determination.constants.COMPARISON
          - endpoints.POST_/writers
          - endpoints.POST_/writers/{writer_id}/credit-history
        distinguishing_aspect: |
          All four thresholds are >= (inclusive), so each band must be probed at threshold-1 and at the
          threshold itself: 1 -> STAFF_WRITER but 2 -> STORY_EDITOR, 3 -> STORY_EDITOR but 4 ->
          EXEC_STORY_EDITOR, 6 -> EXEC_STORY_EDITOR but 7 -> CO_PRODUCER, 11 -> CO_PRODUCER but 12 ->
          PRODUCER. A > comparison misclassifies exactly the four boundary writers. The re-determination
          path must reach the same verdict as a fresh create at the same credit count.
        test_recipe:
          setup:
            - "Agreement AG with level_credit_thresholds { STORY_EDITOR: 2, EXEC_STORY_EDITOR: 4, CO_PRODUCER: 7, PRODUCER: 12 }."
          setup_api_calls:
            - *C_AG
          trigger:
            - call: "POST /writers"
              payload: { legal_name: "Band One Low", guild_member_id: "GM-3001", agreement_id: "${ag}", career_episodic_credits: 1 }
              as: GuildAdministrator
              captures: { b1: "$.data.id" }
            - call: "POST /writers"
              payload: { legal_name: "Band Two Edge", guild_member_id: "GM-3002", agreement_id: "${ag}", career_episodic_credits: 2 }
              as: GuildAdministrator
              captures: { b2: "$.data.id" }
            - call: "POST /writers"
              payload: { legal_name: "Band Two High", guild_member_id: "GM-3003", agreement_id: "${ag}", career_episodic_credits: 3 }
              as: GuildAdministrator
              captures: { b3: "$.data.id" }
            - call: "POST /writers"
              payload: { legal_name: "Band Three Edge", guild_member_id: "GM-3004", agreement_id: "${ag}", career_episodic_credits: 4 }
              as: GuildAdministrator
              captures: { b4: "$.data.id" }
            - call: "POST /writers"
              payload: { legal_name: "Band Three High", guild_member_id: "GM-3005", agreement_id: "${ag}", career_episodic_credits: 6 }
              as: GuildAdministrator
              captures: { b6: "$.data.id" }
            - call: "POST /writers"
              payload: { legal_name: "Band Four Edge", guild_member_id: "GM-3006", agreement_id: "${ag}", career_episodic_credits: 7 }
              as: GuildAdministrator
              captures: { b7: "$.data.id" }
            - call: "POST /writers"
              payload: { legal_name: "Band Four High", guild_member_id: "GM-3007", agreement_id: "${ag}", career_episodic_credits: 11 }
              as: GuildAdministrator
              captures: { b11: "$.data.id" }
            - call: "POST /writers/${b11}/credit-history"
              payload: { episodic_credits_awarded: 1, agreement_id: "${ag}" }
              as: GuildAdministrator
          assert:
            - "Writer.${b1}.determined_level == STAFF_WRITER (1 < 2) and Writer.${b2}.determined_level == STORY_EDITOR (2 >= 2, inclusive)"
            - "Writer.${b3}.determined_level == STORY_EDITOR (3 < 4) and Writer.${b4}.determined_level == EXEC_STORY_EDITOR (4 >= 4)"
            - "Writer.${b6}.determined_level == EXEC_STORY_EDITOR (6 < 7) and Writer.${b7}.determined_level == CO_PRODUCER (7 >= 7)"
            - "After the award, Writer.${b11}.career_episodic_credits == 12, determined_level == PRODUCER (12 >= 12) and version == 2 - a re-determination reaches the same band a fresh create at 12 credits would"
            - "Every one of the seven writers carries level_determination_agreement_id == ${ag} and active_seat_count == 0"
            - "GET /writers?determined_level=EXEC_STORY_EDITOR returns exactly 2 rows (${b4} and ${b6})"

      - name: script_fee_derivation_spans_both_lengths_and_three_type_shares
        claim_type: correct_result
        grounds:
          - calculations.script_fee_derivation
          - entities.Episode.fields.length_format
          - entities.ScriptAssignment.fields.gross_fee_cents
        distinguishing_aspect: |
          The fee is base(length) * share(type) and BOTH factors must be read per assignment, not per
          season: the same TELEPLAY share of 0.70 yields 3500000 on the ONE_HOUR episode and 1750000 on
          the HALF_HOUR one, even though the Season's own length_format is ONE_HOUR. gross_fee_cents is
          also independent of the guarantee: the second W1 teleplay has the same gross as the first while
          its payable_fee_cents differs, because the seat's single slot was already spent.
        test_recipe:
          setup:
            - "Canonical fixture through A1 (TELEPLAY W1, ONE_HOUR EP1) and A2 (STORY W2)."
            - "A second episode EP2 is HALF_HOUR on production unit UNIT_B, so no turnaround conflict arises."
          setup_api_calls:
            - *C_AG
            - *C_SR
            - *C_W1
            - *C_W2
            - *C_SE
            - *C_AW1
            - *C_AW2
            - *C_RM
            - *C_OPEN
            - *C_S1
            - *C_ACC1
            - *C_GRV
            - *C_S2
            - *C_ACC2
            - *C_ACTIVATE
            - *C_EP1
            - *C_A1
            - *C_GEP
            - *C_A2
          trigger:
            - call: "POST /seasons/${se}/episodes"
              payload: { episode_number: 2, length_format: "HALF_HOUR", production_unit: "UNIT_B", production_start_date: "2026-11-16T00:00:00Z", shoot_days: 8 }
              as: StudioExecutive
              captures: { ep2: "$.data.id", ev5: "$.data.version" }
            - call: "POST /episodes/${ep2}/script-assignments"
              payload: { writer_id: "${w1}", assignment_type: "TELEPLAY", expected_episode_version: "${ev5}" }
              as: Showrunner
              as_user_id: "${sr}"
              captures: { a3: "$.data.id" }
            - call: "GET /episodes/${ep2}"
              payload: {}
              as: StudioExecutive
              captures: { ev6: "$.data.version" }
            - call: "POST /episodes/${ep2}/script-assignments"
              payload: { writer_id: "${w2}", assignment_type: "STORY_AND_TELEPLAY", expected_episode_version: "${ev6}" }
              as: Showrunner
              as_user_id: "${sr}"
              captures: { a4: "$.data.id" }
          assert:
            - "ScriptAssignment.${a1}.gross_fee_cents == 3500000 (ONE_HOUR 5000000 * TELEPLAY 0.70) and ScriptAssignment.${a2}.gross_fee_cents == 1500000 (5000000 * STORY 0.30)"
            - "ScriptAssignment.${a3}.gross_fee_cents == 1750000 (HALF_HOUR 2500000 * TELEPLAY 0.70): the episode's own length_format is used, not the Season's ONE_HOUR"
            - "ScriptAssignment.${a4}.gross_fee_cents == 2500000 (HALF_HOUR 2500000 * STORY_AND_TELEPLAY 1.00)"
            - "ScriptAssignment.${a3}.guarantee_slot_applied == false and payable_fee_cents == 1750000, while ${a1}.payable_fee_cents == 1750000 against a gross of 3500000 - identical payables from different grosses"
            - "Season.${se}.script_fee_committed_cents == 7500000 (1750000 + 1500000 + 1750000 + 2500000)"
            - "Episode.${ep2}.script_readiness == IN_PROGRESS and GET /script-assignments?episode_id=${ep2} returns exactly 2 rows"

      - name: fees_and_thresholds_come_from_the_named_agreement_not_the_newest_card
        claim_type: constants_applied
        grounds:
          - calculations.script_fee_derivation.input_set
          - calculations.writer_level_determination.input_set
          - entities.Season.fields.guild_agreement_id
          - entities.Writer.fields.level_determination_agreement_id
        distinguishing_aspect: |
          Two rate cards coexist and each calculation reads a DIFFERENT pointer: script_fee_derivation
          reads the agreement named by the assignment's Season, while writer_level_determination reads the
          agreement_id in the writer's own request. With AG3 pricing a ONE_HOUR script at 8000000 and
          moving the STORY_EDITOR threshold to 5 credits, the same 6 credits produce EXEC_STORY_EDITOR
          under AG and STORY_EDITOR under AG3, and the same TELEPLAY share produces 5600000 under AG3
          against 3500000 under AG. An implementation that latches "the current agreement" fails both.
        test_recipe:
          setup:
            - "Agreement AG (MBA 2026) already exists and season SE points at it."
            - "A second agreement AG3 (MBA 2028) prices ONE_HOUR at 8000000 and HALF_HOUR at 3000000 with level thresholds { STORY_EDITOR: 5, EXEC_STORY_EDITOR: 9, CO_PRODUCER: 14, PRODUCER: 20 }."
          setup_api_calls:
            - *C_AG
            - *C_SR
            - *C_W3
            - &C_AG3
              call: "POST /guild-agreements"
              payload:
                mba_year: 2028
                min_weekly_cents_by_level: { STAFF_WRITER: 450000, STORY_EDITOR: 600000, EXEC_STORY_EDITOR: 700000, CO_PRODUCER: 850000, PRODUCER: 1000000 }
                script_fee_cents_by_length: { HALF_HOUR: 3000000, ONE_HOUR: 8000000 }
                type_share_pct_by_assignment_type: { STORY: 0.30, TELEPLAY: 0.70, STORY_AND_TELEPLAY: 1.00, REWRITE: 0.35, PRODUCTION_POLISH: 0.175 }
                guarantee_offset_pct_by_level: { STAFF_WRITER: 0.0, STORY_EDITOR: 0.5, EXEC_STORY_EDITOR: 0.5, CO_PRODUCER: 1.0, PRODUCER: 1.0 }
                level_credit_thresholds: { STORY_EDITOR: 5, EXEC_STORY_EDITOR: 9, CO_PRODUCER: 14, PRODUCER: 20 }
                diversity_subsidy_cap_weekly_cents: 250000
                facility_fee_tiers: { TIER_1: 200000, TIER_2: 350000, TIER_3: 500000 }
                facility_tier_subtotal_bounds: { TIER_1_MAX: 1500000, TIER_2_MAX: 3000000 }
                format_surcharge_pct: { IN_PERSON: 1.0, REMOTE: 0.4, MINI_ROOM: 0.6 }
                outline_lead_days: 42
                first_draft_lead_days: 28
                second_draft_lead_days: 14
                polish_lead_days: 3
                clearance_item_weights: { NAME: 5, TRADEMARK: 15, DEPICTION: 25 }
              as: GuildAdministrator
              captures: { ag3: "$.data.id" }
            - call: "POST /seasons"
              payload: { guild_agreement_id: "${ag3}", showrunner_writer_id: "${sr}", title: "Dayspring S1", episode_order: 6, length_format: "ONE_HOUR", production_start_date: "2026-11-02T00:00:00Z", staffing_window_start: "2026-08-01T00:00:00Z", staffing_window_end: "2026-09-30T00:00:00Z", ready_script_target: 2, staffing_budget_weekly_cents: 5000000, script_fee_budget_cents: 60000000 }
              as: StudioExecutive
              captures: { se3: "$.data.id" }
            - call: "POST /writers/${w3}/availability-windows"
              payload: { start_date: "2026-08-15T00:00:00Z", end_date: "2027-06-01T00:00:00Z", commitment_type: "NON_EXCLUSIVE" }
              as: Writer
              as_user_id: "${w3}"
              captures: { aw3: "$.data.id" }
            - call: "POST /seasons/${se3}/rooms"
              payload: { name: "Dayspring Room", format: "IN_PERSON", seat_capacity: 2, duration_weeks_committed: 26, start_date: "2026-09-01T00:00:00Z", end_date: "2027-03-01T00:00:00Z" }
              as: Showrunner
              as_user_id: "${sr}"
              captures: { rm4: "$.data.id" }
            - call: "POST /rooms/${rm4}/open-staffing"
              payload: {}
              as: Showrunner
              as_user_id: "${sr}"
              captures: { rv4: "$.data.version" }
            - call: "POST /rooms/${rm4}/seats"
              payload: { writer_id: "${w3}", level_at_hire: "STAFF_WRITER", offered_weekly_compensation_cents: 450000, exclusivity: "NON_EXCLUSIVE", start_date: "2026-09-01T00:00:00Z", end_date: "2027-03-01T00:00:00Z", episodic_guarantee_count: 0, expected_room_version: "${rv4}" }
              as: Showrunner
              as_user_id: "${sr}"
              captures: { s4: "$.data.id" }
            - call: "POST /room-seats/${s4}/accept"
              payload: {}
              as: Writer
              as_user_id: "${w3}"
            - call: "POST /rooms/${rm4}/activate"
              payload: {}
              as: StudioExecutive
            - call: "POST /seasons/${se3}/episodes"
              payload: { episode_number: 1, length_format: "ONE_HOUR", production_unit: "UNIT_A", production_start_date: "2026-11-02T00:00:00Z", shoot_days: 8 }
              as: StudioExecutive
              captures: { ep3: "$.data.id", ev7: "$.data.version" }
            - call: "POST /seasons/${se3}/episodes"
              payload: { episode_number: 2, length_format: "HALF_HOUR", production_unit: "UNIT_B", production_start_date: "2026-11-16T00:00:00Z", shoot_days: 8 }
              as: StudioExecutive
              captures: { ep4: "$.data.id", ev8: "$.data.version" }
          trigger:
            - call: "POST /episodes/${ep3}/script-assignments"
              payload: { writer_id: "${w3}", assignment_type: "TELEPLAY", expected_episode_version: "${ev7}" }
              as: Showrunner
              as_user_id: "${sr}"
              captures: { a5: "$.data.id" }
            - call: "POST /episodes/${ep4}/script-assignments"
              payload: { writer_id: "${w3}", assignment_type: "STORY", expected_episode_version: "${ev8}" }
              as: Showrunner
              as_user_id: "${sr}"
              captures: { a6: "$.data.id" }
            - call: "POST /writers"
              payload: { legal_name: "Card Three Writer", guild_member_id: "GM-3101", agreement_id: "${ag3}", career_episodic_credits: 6 }
              as: GuildAdministrator
              captures: { w6: "$.data.id" }
            - call: "POST /writers"
              payload: { legal_name: "Card One Writer", guild_member_id: "GM-3102", agreement_id: "${ag}", career_episodic_credits: 6 }
              as: GuildAdministrator
              captures: { w7: "$.data.id" }
          assert:
            - "ScriptAssignment.${a5}.gross_fee_cents == 5600000 (AG3's ONE_HOUR 8000000 * 0.70), not 3500000"
            - "ScriptAssignment.${a6}.gross_fee_cents == 900000 (AG3's HALF_HOUR 3000000 * 0.30)"
            - "Season.${se3}.script_fee_committed_cents == 6500000 while Season.${se}.script_fee_committed_cents is untouched by these two creates"
            - "Writer.${w6}.determined_level == STORY_EDITOR with level_determination_agreement_id == ${ag3} (6 >= 5 but 6 < 9)"
            - "Writer.${w7}.determined_level == EXEC_STORY_EDITOR with level_determination_agreement_id == ${ag} (6 >= 4 but 6 < 7) - identical credits, different card, different level"
            - "Writer.${w3}.determined_level == STAFF_WRITER and level_determination_agreement_id == ${ag}: joining a season written on AG3 never re-determines a writer"

      - name: the_season_commitment_sums_only_staffing_and_active_rooms
        claim_type: input_set_filtering
        grounds:
          - calculations.season_staffing_commitment.input_set
          - entities.Season.fields.staffing_commitment_weekly_cents
          - entities.WritersRoom.fields.weekly_burn_cents
        distinguishing_aspect: |
          Three rooms of one season sit in three different states and only two of them count: the ACTIVE
          IN_PERSON room contributes 800000, the STAFFING REMOTE room contributes 80000 (200000 * 0.4),
          and the OPEN room contributes nothing even though it reports weekly_burn_cents 200000 of its
          own. Wrapping the ACTIVE room then drops it out of the same sum while its own burn field stays
          non-zero - so the season figure can never be read as "sum of every room".
        test_recipe:
          setup:
            - "Room RM is ACTIVE with S1 CONFIRMED (600000 weekly, IN_PERSON)."
          setup_api_calls:
            - *C_AG
            - *C_SR
            - *C_W1
            - *C_SE
            - *C_AW1
            - *C_RM
            - *C_OPEN
            - *C_S1
            - *C_ACC1
            - *C_ACTIVATE
          trigger:
            - call: "POST /seasons/${se}/rooms"
              payload: { name: "Remote Annex", format: "REMOTE", seat_capacity: 2, duration_weeks_committed: 26, start_date: "2026-09-01T00:00:00Z", end_date: "2027-03-01T00:00:00Z" }
              as: Showrunner
              as_user_id: "${sr}"
              captures: { rm5: "$.data.id" }
            - call: "POST /rooms/${rm5}/open-staffing"
              payload: {}
              as: Showrunner
              as_user_id: "${sr}"
            - call: "POST /seasons/${se}/rooms"
              payload: { name: "Unopened Room", format: "IN_PERSON", seat_capacity: 2, duration_weeks_committed: 26, start_date: "2026-09-01T00:00:00Z", end_date: "2027-03-01T00:00:00Z" }
              as: Showrunner
              as_user_id: "${sr}"
              captures: { rm6: "$.data.id" }
            - *C_WRAP
          assert:
            - "After trigger call 2: Season.${se}.staffing_commitment_weekly_cents == 880000 (800000 ACTIVE + 80000 STAFFING)"
            - "After trigger call 3: the sum is still 880000 - WritersRoom.${rm6}.weekly_burn_cents == 200000 but an OPEN room is outside the input set"
            - "WritersRoom.${rm5}.facility_tier == TIER_1, facility_surcharge_weekly_cents == 80000 and weekly_burn_cents == 80000"
            - "After trigger call 4: Season.${se}.staffing_commitment_weekly_cents == 80000 - only the STAFFING annex remains"
            - "WritersRoom.${rm}.weekly_burn_cents == 200000 after the wrap (its seats released, its own facility surcharge retained) - a non-zero room burn that the season no longer counts"

      - name: coverage_counts_an_episode_only_when_readiness_and_clearance_both_qualify
        claim_type: input_set_filtering
        grounds:
          - calculations.script_coverage_index.input_set
          - calculations.script_coverage_index.constants.AT_RISK_MAX_GAP
          - entities.Season.fields.ready_script_count
          - entities.Season.fields.coverage_posture
        distinguishing_aspect: |
          The ready count is a conjunction over two independent Episode dimensions, so an episode that is
          READY with clearance still PENDING contributes ZERO. The count is observed at five points on one
          episode - NOT_STARTED, IN_PROGRESS, READY+PENDING, READY+CLEARED, LOCKED+CLEARED - and only the
          last two count, driving the posture from AT_RISK (gap 1 <= 2) to COVERED (gap 0).
        test_recipe:
          setup:
            - "Season SE has ready_script_target 1 and a single episode EP1."
          setup_api_calls:
            - *C_AG
            - *C_SR
            - *C_W1
            - *C_W2
            - *C_SE
            - *C_AW1
            - *C_AW2
            - *C_RM
            - *C_OPEN
            - *C_S1
            - *C_ACC1
            - *C_GRV
            - *C_S2
            - *C_ACC2
            - *C_ACTIVATE
            - *C_EP1
          trigger:
            - *C_A1
            - *C_MLIST
            - *C_D1
            - *C_D2
            - *C_D3
            - *C_APP1
            - *C_CR
            - *C_IT1
            - *C_DEC_CLEARED
            - *C_LOCK
          assert:
            - "Before trigger call 1 (EP1 NOT_STARTED): Season.${se}.ready_script_count == 0, coverage_gap == 1, coverage_posture == AT_RISK"
            - "After trigger call 1 (EP1 IN_PROGRESS): ready_script_count == 0 and the posture is unchanged"
            - "After trigger call 6 (EP1 READY, clearance_posture PENDING): ready_script_count == 0 - readiness alone never counts"
            - "After trigger call 9 (EP1 READY, clearance_posture CLEARED): ready_script_count == 1, coverage_gap == 0, coverage_posture == COVERED"
            - "After trigger call 10 (EP1 LOCKED): ready_script_count == 1 - LOCKED is inside the readiness input set, so the count does not fall back"
            - "Episode.${ep1}.locked_at == 2026-08-01T00:00:00.000Z"

      - name: milestone_due_dates_are_lead_day_offsets_stamped_at_end_of_day
        claim_type: correct_result
        grounds:
          - calculations.milestone_schedule_derivation
          - calculations.milestone_schedule_derivation.constants.DUE_TIME_OF_DAY
          - entities.Milestone.fields.due_date
        distinguishing_aspect: |
          Every due date is production_start minus a per-type lead in whole calendar days, stamped
          23:59:59.999Z - never midnight and never the raw production start. A second episode starting
          2027-01-04 forces the subtraction across a month and a year boundary (42 -> 2026-11-23,
          28 -> 2026-12-07, 14 -> 2026-12-21, 3 -> 2027-01-01), which catches implementations that
          subtract weeks or clamp inside the month.
        test_recipe:
          setup:
            - "Canonical fixture with EP1 (production start 2026-11-02) and A1 already created."
            - "Agreement lead days: outline 42, first draft 28, second draft 14, polish 3."
          setup_api_calls:
            - *C_AG
            - *C_SR
            - *C_W1
            - *C_W2
            - *C_SE
            - *C_AW1
            - *C_AW2
            - *C_RM
            - *C_OPEN
            - *C_S1
            - *C_ACC1
            - *C_GRV
            - *C_S2
            - *C_ACC2
            - *C_ACTIVATE
