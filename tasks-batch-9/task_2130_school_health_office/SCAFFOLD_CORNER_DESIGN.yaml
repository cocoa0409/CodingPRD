      - name: screening_rescreen_cycle_capped_at_three_rounds
        claim_type: cyclic
        grounds:
          - state_machines.Screening.RESCREEN_DUE_to_SCHEDULED
          - entities.Screening.fields.cycle_number
          - validations[priority=46]
          - errors[ERR_RESCREEN_LIMIT_REACHED]
        distinguishing_aspect: "Each SCHEDULE_RESCREEN closes the SCHEDULED -> RESCREEN_DUE -> SCHEDULED loop, increments cycle_number and clears outcome and result_value to null; the request made while cycle_number is already 3 is refused with ERR_RESCREEN_LIMIT_REACHED and the row stays RESCREEN_DUE."
        test_recipe:
          setup:
            - "School JUNI38 with an RN on an ACTIVE Monday block and one ENROLLED student; clock pinned at 2026-08-03T09:00:00Z for every record-result so the on-coverage row passes."
            - "One VISION Screening driven around the rescreen loop twice with result_value 35 (INCONCLUSIVE: 30 < 35 < 40), so cycle_number is 3 and the row rests at RESCREEN_DUE."
          setup_api_calls:
            - call: "POST /health-office/schools"
              payload: { name: "Juniper Elementary", building_code: "JUN38", cot_capacity: 2, emergency_protocol_enabled: true }
              as: DistrictHealthAdmin
              captures: { sch_id: $.data.id }
            - call: "POST /health-office/nurses"
              payload: { full_name: "Rita Nolan", credential: "RN", weekly_contracted_minutes: 2400, delegation_authorized: false }
              as: DistrictHealthAdmin
              captures: { rn_id: $.data.id }
            - call: "POST /health-office/coverage-assignments"
              payload: { nurse_id: "${rn_id}", school_id: "${sch_id}", weekday: "MON", start_minute: 480, end_minute: 960, effective_from: "2026-07-01T00:00:00Z" }
              as: DistrictHealthAdmin
              captures: { cov_id: $.data.id }
            - call: "POST /health-office/students"
              payload: { school_id: "${sch_id}", full_name: "Jun Park", grade_level: 2, date_of_birth: "2018-12-12T00:00:00Z", allergy_severity: "NONE", chronic_condition_codes: [], immunization_status: "COMPLIANT" }
              as: DistrictHealthAdmin
              captures: { stu_id: $.data.id }
            - call: "POST /health-office/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: DistrictHealthAdmin
            - call: "POST /health-office/screenings"
              payload: { student_id: "${stu_id}", school_id: "${sch_id}", screening_type: "VISION", scheduled_for: "2026-08-03T10:00:00Z" }
              as: SchoolNurse
              as_user_id: "${rn_id}"
              captures: { scr_id: $.data.id, cycle_0: $.data.cycle_number }
            - call: "POST /health-office/screenings/${scr_id}/record-result"
              payload: { result_value: 35, screened_by_nurse_id: "${rn_id}" }
              as: SchoolNurse
              as_user_id: "${rn_id}"
              captures: { outcome_1: $.data.outcome, due_1: $.data.rescreen_due_at }
            - call: "POST /health-office/screenings/${scr_id}/follow-up"
              payload: { action: "SCHEDULE_RESCREEN", scheduled_for: "2026-08-10T10:00:00Z" }
              as: SchoolNurse
              as_user_id: "${rn_id}"
              captures: { cycle_2: $.data.cycle_number }
            - call: "POST /health-office/screenings/${scr_id}/record-result"
              payload: { result_value: 35, screened_by_nurse_id: "${rn_id}" }
              as: SchoolNurse
              as_user_id: "${rn_id}"
            - call: "POST /health-office/screenings/${scr_id}/follow-up"
              payload: { action: "SCHEDULE_RESCREEN", scheduled_for: "2026-08-17T10:00:00Z" }
              as: SchoolNurse
              as_user_id: "${rn_id}"
              captures: { cycle_3: $.data.cycle_number }
            - call: "POST /health-office/screenings/${scr_id}/record-result"
              payload: { result_value: 35, screened_by_nurse_id: "${rn_id}" }
              as: SchoolNurse
              as_user_id: "${rn_id}"
              captures: { status_before_cap: $.data.status }
          trigger:
            - call: "POST /health-office/screenings/${scr_id}/follow-up"
              payload: { action: "SCHEDULE_RESCREEN", scheduled_for: "2026-08-24T10:00:00Z" }
              as: SchoolNurse
              as_user_id: "${rn_id}"
              captures: { err: $.data.error_id }
          assert:
            - "At creation: Screening.${scr_id}.cycle_number == 1 and Screening.${scr_id}.status == SCHEDULED"
            - "First result 35: Screening.${scr_id}.outcome == INCONCLUSIVE, status == RESCREEN_DUE, rescreen_due_at == 2026-08-17T09:00:00.000Z"
            - "After first SCHEDULE_RESCREEN: cycle_number == 2, status == SCHEDULED, outcome == null, result_value == null"
            - "After second SCHEDULE_RESCREEN: cycle_number == 3"
            - "Third SCHEDULE_RESCREEN: HTTP status == 409 and data.error_id == ERR_RESCREEN_LIMIT_REACHED"
            - "Screening.${scr_id}.cycle_number == 3 (not incremented)"
            - "Screening.${scr_id}.status == RESCREEN_DUE (unchanged)"

      - name: lot_quarantine_restore_cycle_returns_lot_to_available
        claim_type: cyclic
        grounds:
          - state_machines.MedicationStockLot.AVAILABLE_to_QUARANTINED
          - state_machines.MedicationStockLot.QUARANTINED_to_AVAILABLE
          - calculations.school_days_of_supply
          - concurrency_rules[lot-inventory-action-stale-lot]
        distinguishing_aspect: "The AVAILABLE -> QUARANTINED -> AVAILABLE loop is closed by RESTORE: epinephrine_days_of_supply falls from 33.33 to 0.00 on quarantine and returns to exactly 33.33 on restore, with received_total never moving."
        test_recipe:
          setup:
            - "School KESTREL39 with no students and one AVAILABLE stock-protocol EPINEPHRINE lot of 10 units (days_of_supply 33.33)."
            - "No AdministrationRecord draws on the lot, so the quarantine cascade has nothing to void."
          setup_api_calls:
            - call: "POST /health-office/schools"
              payload: { name: "Kestrel Elementary", building_code: "KES39", cot_capacity: 2, emergency_protocol_enabled: true }
