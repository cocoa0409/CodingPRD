# =============================================================================
# §1.0–§1.7 Seed Tables — task_3106
# Integrated Payer-Provider Budgeting & Internal Referral Management
# (capitated member revenue funding an owned delivery system)
# =============================================================================

scenario: |
  Integrated Payer-Provider Budgeting & Internal Referral Management (Kaiser Permanente): capitated member revenue funding an owned delivery system rather than fee-for-service claims, medical group compensation arrangements decoupled from procedure volume, internal referral rules keeping care in network with authorization exceptions for unavailable services, capacity planning where appointment supply is a budgeting decision rather than a market outcome, outside services spending management for contracted care and emergency claims, regional operating budgets balancing premium revenue against staffing and facility investment, member transfer between regions with benefit and network differences, quality and access metrics governing internal accountability

domain_name: integrated-payer-provider-budgeting
api_prefix: /

complexity_profile:
  primary_archetype: posture-driven gating
  secondary_archetype: quota / allocation
  complexity_layers:
    - cascading side effects
    - dual-variant calculation
    - rate / threshold triggers
    - optimistic concurrency
    - selector policy
  entity_topology: flat
  state_machine_shape: posture_driven
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - self_referential
  role_model: peer_roles
  consistency_model: immediate

# =============================================================================
# §1.1 Entity-Relationship Table (13 entities)
# =============================================================================
entities:
  - name: Region
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: name, type: string, source: input, description: "Operating region display name" }
      - { name: state_codes, type: array, source: input, description: "Two-letter state codes served by this region; non-empty" }
      - { name: posture, type: enum, source: system, default: "OPEN", constraints: "OPEN | RESTRICTED | FROZEN — derived operating posture gating all child mutations" }
      - { name: margin_target_pct, type: number, source: input, description: "Target operating margin as a fraction of premium revenue (e.g. 0.03)" }
      - { name: capitation_index, type: number, source: input, default: 1.0, description: "Region capitation multiplier applied to every base rate; a region's cost structure relative to the system average" }
      - { name: premium_revenue_cents, type: integer, source: computed, description: "Sum of capitation_rate_cents over Member rows whose region_id == this region and status IN {ACTIVE, TRANSFER_PENDING}" }
      - { name: employed_delivery_cost_cents, type: integer, source: computed, description: "Sum of comp_total_cents over Provider rows in this region" }
      - { name: outside_services_spend_cents, type: integer, source: computed, description: "Sum of final_liability_cents over OutsideServiceClaim rows in this region whose status IN {PAID, ADJUDICATED}" }
      - { name: operating_margin_cents, type: integer, source: computed, description: "Settled margin: premium_revenue_cents - employed_delivery_cost_cents - outside_services_spend_cents - staffing_and_facility_cents" }
      - { name: computed_margin_cents, type: integer, source: computed, description: "Forward margin recomputed from each member's current risk_score and each provider's current panel: the computed_forward variant of the region_operating_budget rule" }
      - { name: referential_integration_credit_cents, type: integer, source: computed, description: "Sum of ReferentialIntegration settlement_account_cents over this region's non-terminated integrations, weighted by integration_credit_rate[risk_sharing_model]" }
      - { name: open_alert_count, type: integer, source: computed, description: "Count of AlertNotification rows in this region with status == RAISED" }
      - { name: staffing_and_facility_cents, type: integer, source: computed, description: "Sum over CareSite rows of (staffing_fte_filled * FTE_COST_CENTS) + facility_investment_spent_cents" }
      - { name: capacity_budget_appointments, type: integer, source: computed, description: "Sum of budgeted_slots over CapacityPlan rows in this region with status IN {ACTIVE, ADJUSTED, UNDER_REVIEW}" }
      - { name: capacity_committed_appointments, type: integer, source: computed, description: "Sum of committed_slots over CapacityPlan rows in this region with status IN {ACTIVE, ADJUSTED, UNDER_REVIEW}" }
      - { name: access_breach_pct, type: number, source: computed, description: "Rounded share of non-cancelled Appointment rows in this region whose access_status == BREACHED_ACCESS_TARGET" }
      - { name: quality_composite_score, type: number, source: computed, description: "Weighted composite of FINALIZED QualityMetric rows for this region" }
      - { name: member_count, type: integer, source: computed, description: "Count of Member rows in this region with status IN {ACTIVE, TRANSFER_PENDING}" }

  - name: Member
    parent: Region
    common_fields: true
    fields:
      - { name: region_id, type: string, source: system, description: "FK -> Region.id; region of record that receives this member's capitation" }
      - { name: member_ref, type: string, source: input, description: "External subscriber reference, unique across all members" }
      - { name: attributed_provider_id, type: string, source: input, description: "FK -> Provider.id; the provider whose panel this member counts toward" }
      - { name: plan_product, type: enum, source: input, constraints: "COMMERCIAL_HMO | MEDICARE_ADVANTAGE | MEDICAID_MANAGED | DUAL_ELIGIBLE" }
      - { name: benefit_tier, type: enum, source: input, constraints: "TIER_1 | TIER_2 | TIER_3" }
      - { name: risk_score, type: number, source: input, description: "Risk adjustment factor, 0.5 to 5.0" }
      - { name: coverage_effective_date, type: datetime, source: input, description: "Date coverage begins in the region of record" }
      - { name: capitation_rate_cents, type: integer, source: computed, description: "Monthly capitation the region of record receives for this member" }
      - { name: status, type: enum, source: system, default: "ACTIVE", constraints: "ACTIVE | TRANSFER_PENDING | SUSPENDED | TERMINATED" }

  - name: CareSite
    parent: Region
    common_fields: true
    fields:
      - { name: region_id, type: string, source: system, description: "FK -> Region.id; region whose operating budget funds this facility" }
      - { name: site_name, type: string, source: input, description: "Facility display name" }
      - { name: site_type, type: enum, source: input, constraints: "MEDICAL_CENTER | HOSPITAL | MEDICAL_OFFICE" }
      - { name: licensed_beds, type: integer, source: input, description: "Licensed inpatient beds, 0 for office sites" }
      - { name: staffing_fte_budget, type: number, source: input, description: "Budgeted full-time-equivalent staff for the period" }
      - { name: staffing_fte_filled, type: number, source: computed, description: "Filled FTE; starts at 0 and is set by POST /care-sites/{id}/staffing" }
      - { name: facility_investment_budget_cents, type: integer, source: input, description: "Approved facility investment for the period" }
      - { name: facility_investment_spent_cents, type: integer, source: computed, description: "Cumulative facility investment drawn" }

  - name: Department
    parent: CareSite
    common_fields: true
    fields:
      - { name: care_site_id, type: string, source: system, description: "FK -> CareSite.id; facility this department operates in" }
      - { name: region_id, type: string, source: system, description: "FK -> Region.id; denormalized region of the parent site" }
      - { name: specialty, type: enum, source: input, constraints: "PRIMARY_CARE | CARDIOLOGY | ORTHOPEDICS | ONCOLOGY | RADIOLOGY | BEHAVIORAL_HEALTH" }
      - { name: appointment_slots_budgeted, type: integer, source: input, description: "Weekly appointment supply the department budget authorizes" }
      - { name: appointment_slots_committed, type: integer, source: computed, description: "Weekly slots currently held by non-cancelled appointments" }
      - { name: wait_threshold_days, type: integer, source: input, default: 14, description: "Access target in days; wait_days >= this value is an access breach" }
      - { name: accepting_internal_referrals, type: boolean, source: input, default: true, description: "Whether the department accepts new internal referrals" }
      - { name: status, type: enum, source: system, default: "OPEN", constraints: "OPEN | CONSTRAINED | CLOSED" }

  - name: Provider
    parent: CareSite
    common_fields: true
    fields:
      - { name: care_site_id, type: string, source: system, description: "FK -> CareSite.id; facility the provider is based at" }
      - { name: region_id, type: string, source: system, description: "FK -> Region.id; region whose premium funds this provider's compensation" }
      - { name: provider_name, type: string, source: input, description: "Provider display name" }
      - { name: specialty, type: enum, source: input, constraints: "PRIMARY_CARE | CARDIOLOGY | ORTHOPEDICS | ONCOLOGY | RADIOLOGY | BEHAVIORAL_HEALTH" }
      - { name: compensation_model, type: enum, source: input, default: "PANEL_CAPITATION", constraints: "SALARY | PANEL_CAPITATION | QUALITY_BONUS" }
      - { name: base_component_cents, type: integer, source: input, description: "Fixed monthly base compensation, independent of procedure volume" }
      - { name: panel_size_target, type: integer, source: input, description: "Panel size the capitation component is calibrated to" }
      - { name: panel_size_assigned, type: integer, source: computed, default: 0, description: "Count of Member rows with attributed_provider_id == this provider and status == ACTIVE" }
      - { name: quality_score, type: number, source: computed, default: 0, description: "Latest FINALIZED QUALITY_COMPOSITE measured_value for this provider, 0 to 100; 0 until a composite metric finalizes" }
      - { name: panel_capitation_component_cents, type: integer, source: computed, description: "panel_size_assigned * panel_rate_cents[specialty], round_half_up" }
      - { name: quality_bonus_cents, type: integer, source: computed, description: "base_component_cents * QUALITY_BONUS_RATE when quality_score >= QUALITY_BONUS_THRESHOLD, else 0" }
      - { name: volume_component_cents, type: integer, source: computed, description: "Procedure-volume compensation; pinned to 0 by the volume-decoupling invariant" }
      - { name: comp_total_cents, type: integer, source: computed, description: "Monthly total compensation (base + panel capitation + quality bonus + volume)" }
      - { name: status, type: enum, source: system, default: "ACTIVE", constraints: "ACTIVE | PANEL_CLOSED" }

  - name: NetworkService
    parent: Region
    common_fields: true
    fields:
      - { name: region_id, type: string, source: system, description: "FK -> Region.id; region whose network is described" }
      - { name: service_code, type: string, source: input, description: "Service code; unique within a region" }
      - { name: service_name, type: string, source: input, description: "Human-readable service name" }
      - { name: availability_status, type: enum, source: input, default: "AVAILABLE", constraints: "AVAILABLE | CONSTRAINED | UNAVAILABLE" }
      - { name: available_provider_count, type: integer, source: computed, description: "Count of ACTIVE Provider rows whose specialty matches the mapping of service_code" }
      - { name: capacity_note, type: string, source: input, description: "Free-text capacity note" }

  - name: Appointment
    parent: Department
    common_fields: true
    fields:
      - { name: department_id, type: string, source: system, description: "FK -> Department.id; department supplying the appointment slot" }
      - { name: provider_id, type: string, source: system, description: "FK -> Provider.id; provider delivering the visit" }
      - { name: member_id, type: string, source: system, description: "FK -> Member.id; member receiving care" }
      - { name: referral_id, type: string, source: input, description: "FK -> Referral.id; the authorizing referral, required when appointment_type == SPECIALTY" }
      - { name: appointment_type, type: enum, source: input, constraints: "ROUTINE | SPECIALTY | URGENT | FOLLOW_UP" }
      - { name: start_utc, type: datetime, source: input, description: "Appointment start instant" }
      - { name: duration_minutes, type: integer, source: input, default: 20, description: "Slot length in minutes" }
      - { name: wait_days, type: number, source: computed, description: "Calendar days from booking instant to start_utc, 1 decimal place" }
      - { name: fulfillment_status, type: enum, source: system, constraints: "REQUESTED | SCHEDULED | COMPLETED | CANCELLED" }
      - { name: access_status, type: enum, source: system, constraints: "WITHIN_ACCESS_TARGET | BREACHED_ACCESS_TARGET" }
      - { name: hold_status, type: enum, source: system, default: "NONE", constraints: "NONE | REFERRAL_HOLD" }

  - name: Referral
    parent: Member
    common_fields: true
    fields:
      - { name: member_id, type: string, source: system, description: "FK -> Member.id; member being referred" }
      - { name: requesting_department_id, type: string, source: input, description: "FK -> Department.id; department raising the referral" }
      - { name: target_department_id, type: string, source: input, description: "FK -> Department.id; in-network department expected to deliver the service" }
      - { name: service_code, type: string, source: input, description: "Service being referred" }
      - { name: referral_type, type: enum, source: input, default: "INTERNAL", constraints: "INTERNAL | OUTSIDE_NETWORK" }
      - { name: external_contract_count, type: integer, source: input, default: 0, description: "Out-of-network contracts this referral would open; a value above EXTERNAL_CONTRACT_MAX is an unauthorized network expansion" }
      - { name: authorization_exception, type: boolean, source: input, default: false, description: "Whether an out-of-network authorization exception is claimed" }
      - { name: exception_reason, type: enum, source: input, constraints: "SERVICE_UNAVAILABLE_IN_NETWORK | EMERGENCY | OUT_OF_AREA | REGULATORY_MANDATE" }
      - { name: appeal_rounds, type: integer, source: computed, description: "Number of appeal rounds completed; increments on each APPEALED -> DENIED/AUTHORIZED hop" }
      - { name: effective_decision_at, type: datetime, source: computed, description: "Instant of the most recent authorize/deny decision" }
      - { name: expires_at, type: datetime, source: computed, description: "created_at + 90 days; an AUTHORIZED referral past this instant is EXPIRED" }
      - { name: status, type: enum, source: system, constraints: "PENDING_TRIAGE | AUTHORIZED | SCHEDULED | COMPLETED | DENIED | APPEALED | EXPIRED | HELD" }

  - name: OutsideServiceClaim
    parent: Region
    common_fields: true
    fields:
      - { name: member_id, type: string, source: system, description: "FK -> Member.id; member whose care generated the claim" }
      - { name: region_id, type: string, source: system, description: "FK -> Region.id; region whose outside-services budget pays the claim" }
      - { name: vendor_name, type: string, source: input, description: "Contracted outside vendor or facility name" }
      - { name: service_code, type: string, source: input, description: "Service code billed by the outside vendor" }
      - { name: claim_type, type: enum, source: input, constraints: "EMERGENCY | CONTRACTED | OUT_OF_AREA | DIRECT" }
      - { name: emergency_flag, type: boolean, source: input, default: false, description: "Whether the claim arose from emergency care" }
      - { name: billed_amount_cents, type: integer, source: input, description: "Amount billed by the outside vendor" }
      - { name: provisional_liability_cents, type: integer, source: computed, description: "Forward-looking liability booked at submission" }
      - { name: final_liability_cents, type: integer, source: computed, description: "Chronological liability pinned at adjudication" }
      - { name: submitted_at, type: datetime, source: system, description: "Submission instant (logical clock)" }
      - { name: adjudicated_at, type: datetime, source: computed, description: "Adjudication instant (logical clock)" }
      - { name: appeal_rounds, type: integer, source: computed, description: "Number of appeal rounds; increments on each APPEALED -> DENIED/ADJUDICATED hop" }
      - { name: status, type: enum, source: system, constraints: "SUBMITTED | PENDED | ADJUDICATED | PAID | DENIED | APPEALED" }

  - name: RegionalBudget
    parent: Region
    common_fields: true
    fields:
      - { name: region_id, type: string, source: system, description: "FK -> Region.id; region this operating budget covers" }
      - { name: period, type: string, source: input, description: "Budget period in YYYY-MM form; unique within a region" }
      - { name: premium_revenue_cents, type: integer, source: computed, description: "Capitation revenue snapshot taken at creation" }
      - { name: employed_delivery_cost_cents, type: integer, source: computed, description: "Employed delivery cost snapshot taken at creation" }
      - { name: staffing_budget_cents, type: integer, source: input, description: "Staffing budget line" }
      - { name: outside_services_budget_cents, type: integer, source: input, description: "Outside services budget line" }
      - { name: outside_services_committed_cents, type: integer, source: computed, description: "Sum of final_liability_cents over this region's claims in the period, plus non-terminated ReferentialIntegration settlement_account_cents reported as outside services" }
      - { name: facility_investment_cents, type: integer, source: input, description: "Facility investment budget line" }
      - { name: division_deductible_cents, type: integer, source: computed, description: "Division deductible pool remaining; initialized from the creation input, consumed by each adjudication and restored by each denial" }
      - { name: division_deductible_original_cents, type: integer, source: computed, description: "Snapshot of the division deductible pool at budget creation; restoration caps at this value" }
      - { name: system_deductible_cents, type: integer, source: input, description: "System-level deductible retained above the division pool and never reimbursed to the division" }
      - { name: ort_contract_rate, type: number, source: input, default: 1.0, description: "Contracted payment rate applied to the division's committed outside-services liability" }
      - { name: division_liability_cents, type: integer, source: computed, description: "round_half_up(outside_services_committed_cents * ort_contract_rate) - division_deductible_cents" }
      - { name: net_liability_cents, type: integer, source: computed, description: "The named conserved quantity: division_liability_cents - system_deductible_cents" }
      - { name: operating_margin_cents, type: integer, source: computed, description: "premium_revenue_cents - staffing - outside_services_committed - facility_investment - employed_delivery" }
      - { name: status, type: enum, source: system, default: "DRAFT", constraints: "DRAFT | SUBMITTED | APPROVED | CLOSED | REOPENED" }

  - name: CapacityPlan
    parent: Region
    common_fields: true
    fields:
      - { name: region_id, type: string, source: system, description: "FK -> Region.id; region the supply plan belongs to" }
      - { name: department_id, type: string, source: input, description: "FK -> Department.id; department whose appointment supply is budgeted" }
      - { name: period, type: string, source: input, description: "Plan period in YYYY-MM form; unique per department" }
      - { name: budgeted_slots, type: integer, source: input, description: "Appointment supply the budget authorizes for the department" }
      - { name: committed_slots, type: integer, source: computed, description: "Slots held by non-cancelled appointments in the department for the period" }
      - { name: supply_shortfall_slots, type: integer, source: computed, description: "max(0, committed_slots - budgeted_slots)" }
      - { name: panel_target, type: integer, source: input, description: "Member panel the supply is calibrated to serve" }
      - { name: recalculation_epoch, type: integer, source: computed, description: "Increments each time committed_slots is recomputed" }
      - { name: status, type: enum, source: system, default: "PLANNING", constraints: "PLANNING | UNDER_REVIEW | ACTIVE | ADJUSTED | FROZEN" }

  - name: MemberTransfer
    parent: Member
    common_fields: true
    fields:
      - { name: member_id, type: string, source: system, description: "FK -> Member.id; member being transferred between regions" }
      - { name: from_region_id, type: string, source: input, description: "FK -> Region.id; region of record the member leaves" }
      - { name: to_region_id, type: string, source: input, description: "FK -> Region.id; region of record the member joins" }
      - { name: effective_utc, type: datetime, source: input, description: "Instant the transfer takes effect" }
      - { name: benefit_difference_cents, type: integer, source: computed, description: "to_region capitation minus from_region capitation for this member" }
      - { name: network_difference_flag, type: boolean, source: computed, description: "True when the two regions' NetworkService availability profiles differ for the member's plan_product" }
      - { name: status, type: enum, source: system, constraints: "REQUESTED | PENDING_EFFECTIVE | COMPLETED | REJECTED | CANCELLED" }

  - name: QualityMetric
    parent: Region
    common_fields: true
    fields:
      - { name: region_id, type: string, source: system, description: "FK -> Region.id; region the metric scores" }
      - { name: metric_code, type: enum, source: input, constraints: "ACCESS_WAIT_DAYS | QUALITY_COMPOSITE | MEMBER_SATISFACTION | PANEL_AVAILABILITY" }
      - { name: period, type: string, source: input, description: "Measurement period in YYYY-MM form" }
      - { name: target_value, type: number, source: input, description: "Accountability target for the period" }
      - { name: measured_value, type: number, source: computed, description: "Measured value; ACCESS_WAIT_DAYS is the mean wait_days over the region's non-cancelled appointments" }
      - { name: weighted_component_score, type: number, source: computed, description: "Component score after weighting and per-component rounding" }
      - { name: accountable_provider_id, type: string, source: input, description: "FK -> Provider.id; provider accountable for remediation" }
      - { name: status, type: enum, source: system, default: "MEASURING", constraints: "MEASURING | FINALIZED | REMEDIATION | REOPENED" }

  - name: ReferentialIntegration
    parent: Region
    common_fields: true
    fields:
      - { name: region_id, type: string, source: system, description: "FK -> Region.id; region whose affairs this integration governs" }
      - { name: integration_type, type: enum, source: input, constraints: "PAYER_ENTITY | MEDICAL_GROUP | HOSPITAL_ENTITY | TPA_PLATFORM" }
      - { name: risk_sharing_model, type: enum, source: input, default: "CAPITATED", constraints: "CAPITATED | SHARED_SAVINGS | BUNDLED | NOT_AT_RISK" }
      - { name: bound_effective_date, type: datetime, source: input, description: "Instant the integration takes effect" }
      - { name: cost_reporting_basis_cents, type: integer, source: input, description: "The referenced entity's reported delivery cost, used as the risk-sharing basis" }
      - { name: shared_savings_rate, type: number, source: input, default: 0.0, description: "Fraction of the basis credited to the region under SHARED_SAVINGS" }
      - { name: per_diem_days, type: integer, source: input, description: "Exception-bed days the affiliated entity reports under this binding" }
      - { name: per_diem_rate_cents, type: integer, source: input, description: "Per-day rate for the exception-bed component" }
      - { name: per_diem_cap_cents, type: integer, source: input, description: "Cap on the exception-bed component; the per-diem component is the min of days x rate and this cap" }
      - { name: interim_claim_count, type: integer, source: input, description: "Interim claims reported in the period; crossing INTERIM_CLAIM_THRESHOLD selects the high interim rate" }
      - { name: settlement_account_cents, type: integer, source: computed, description: "Integration credit booked against the region's operating budget: min(round_half_up(per_diem_days * per_diem_rate_cents), per_diem_cap_cents) + round_half_up(cost_reporting_basis_cents * integration_credit_rate[risk_sharing_model])" }
      - { name: settlement_posted_cents, type: integer, source: computed, description: "Portion of settlement_account_cents already posted into the region's premium revenue" }
      - { name: status, type: enum, source: system, default: "PROPOSED", constraints: "PROPOSED | BOUND | ENROLLED | CONTRACTED | TERMINATED" }

  - name: AlertNotification
    parent: Region
    common_fields: true
    fields:
      - { name: region_id, type: string, source: system, description: "FK -> Region.id; region the alert belongs to" }
      - { name: alert_type, type: enum, source: input, constraints: "POSTURE_CHANGE | BUDGET_BREACH | QUALITY_GAP | CAPACITY_SHORTFALL" }
      - { name: severity, type: enum, source: input, default: "INFO", constraints: "INFO | WARNING | CRITICAL" }
      - { name: payload_ref_type, type: string, source: input, description: "Entity type the alert refers to (e.g. Region, Department, QualityMetric)" }
      - { name: payload_ref_id, type: string, source: input, description: "Identifier of the referenced entity" }
      - { name: raised_at, type: datetime, source: computed, description: "Logical-clock instant the alert was raised" }
      - { name: status, type: enum, source: system, default: "RAISED", constraints: "RAISED | ACKNOWLEDGED" }

# =============================================================================
# §1.2 State Machine Table (10 machines)
# =============================================================================
state_machines:
  - entity: Region
    initial_state: OPEN
    terminal_states: [FROZEN]
    shape: posture_driven
    transitions:
      - from: OPEN
        to: RESTRICTED
        trigger: "system (automatic when operating_margin_cents < 0)"
        actor: system
        preconditions:
          - "operating_margin_cents < 0"
          - "posture == OPEN"
        side_effects:
          - "set Region.posture = RESTRICTED"
          - "compute Region.operating_margin_cents and Region.access_breach_pct"
          - "for each CapacityPlan in this region with status IN {PLANNING, UNDER_REVIEW, ACTIVE, ADJUSTED}: recompute committed_slots, supply_shortfall_slots, recalculation_epoch += 1 (Cascade 1 hop H1)"
          - "for each Department in this region with (appointment_slots_committed >= appointment_slots_budgeted) OR (status == CONSTRAINED): if Department.status == OPEN set Department.status = CONSTRAINED (Cascade 1 hop H2)"
          - "for each Referral with target_department_id in this region and status == PENDING_TRIAGE: set Referral.status = HELD (Cascade 1 hop H3); for each Appointment with referral_id == that Referral and fulfillment_status == REQUESTED: set Appointment.hold_status = REFERRAL_HOLD (Cascade 1 hop H4)"
          - "insert one AlertNotification row with alert_type = POSTURE_CHANGE, severity = INFO, payload_ref_type = Region, payload_ref_id = this region, status = RAISED; recompute Region.open_alert_count (Cascade 1 hop H5)"

      - from: OPEN
        to: RESTRICTED
        trigger: "system (automatic when capacity_committed_appointments > capacity_budget_appointments)"
        actor: system
        preconditions:
          - "capacity_committed_appointments > capacity_budget_appointments"
          - "posture == OPEN"
        side_effects:
          - "set Region.posture = RESTRICTED"
          - "for each Referral with target_department_id in this region and status == PENDING_TRIAGE: set Referral.status = HELD (Cascade 1 hop H5a)"
          - "for each Provider in this region with status == ACTIVE: set Provider.status = PANEL_CLOSED (Cascade 1 hop H5b)"
          - "insert one AlertNotification row with alert_type = CAPACITY_SHORTFALL, severity = WARNING, payload_ref_type = Region, payload_ref_id = this region, status = RAISED (Cascade 1 hop H5c)"

      - from: RESTRICTED
        to: FROZEN
        trigger: "system (automatic when operating_margin_cents < -MARGIN_FREEZE_FLOOR_CENTS)"
        actor: system
        preconditions:
          - "operating_margin_cents < -MARGIN_FREEZE_FLOOR_CENTS"
          - "posture == RESTRICTED"
        side_effects:
          - "set Region.posture = FROZEN"
          - "for each Provider in this region with status == ACTIVE: set Provider.status = PANEL_CLOSED"
          - "for each CapacityPlan in this region with status == ACTIVE: set CapacityPlan.status = FROZEN"
          - "insert one AlertNotification row with alert_type = POSTURE_CHANGE, severity = CRITICAL, payload_ref_type = Region, payload_ref_id = this region, status = RAISED; recompute Region.open_alert_count (Cascade 1 hop H6)"

      - from: RESTRICTED
        to: OPEN
        trigger: "system (automatic when operating_margin_cents >= 0)"
        actor: system
        preconditions:
          - "operating_margin_cents >= 0"
          - "posture == RESTRICTED"
        side_effects:
          - "set Region.posture = OPEN"
          - "for each Referral with target_department_id in this region and status == HELD: set Referral.status = PENDING_TRIAGE"

      - from: FROZEN
        to: RESTRICTED
        trigger: "system (automatic when operating_margin_cents >= 0)"
        actor: system
        preconditions:
          - "operating_margin_cents >= 0"
          - "posture == FROZEN"
        side_effects:
          - "set Region.posture = RESTRICTED"

  - entity: Member
    initial_state: ACTIVE
    terminal_states: [TERMINATED]
    transitions:
      - from: ACTIVE
        to: TRANSFER_PENDING
        trigger: "POST /member-transfers (accepted, awaits effective date)"
        actor: system
        preconditions:
          - "Member.status == ACTIVE"
          - "an accepted MemberTransfer row references this member"
        side_effects:
          - "set Member.status = TRANSFER_PENDING"

      - from: TRANSFER_PENDING
        to: ACTIVE
        trigger: "POST /member-transfers/{id}/complete"
        actor: RegionalFinanceOfficer
        preconditions:
          - "Member.status == TRANSFER_PENDING"
          - "clock >= transfer.effective_utc"
        side_effects:
          - "Member.region_id = to_region_id; from-region Member count decreases and to-region Member count increases"
          - "Member.capitation_rate_cents recomputed at the to_region rate"
          - "Member.status = ACTIVE"

      - from: TRANSFER_PENDING
        to: SUSPENDED
        trigger: "POST /member-transfers/{id}/reject"
        actor: RegionalFinanceOfficer
        preconditions:
          - "Member.status == TRANSFER_PENDING"
          - "MemberTransfer in PENDING_EFFECTIVE"
        side_effects:
          - "Member.status = SUSPENDED"
          - "no capitation is booked into the destination region"

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /member-transfers/{id}/reject"
        actor: RegionalFinanceOfficer
        preconditions:
          - "Member.status == SUSPENDED"
          - "a MemberTransfer for this member is cancelled by the destination region"
        side_effects:
          - "Member.status = ACTIVE"
          - "Member remains with region_id unchanged at the origin region"

      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /members/{id}/terminate"
        actor: RegionalFinanceOfficer
        preconditions:
          - "Member.status == ACTIVE"
        side_effects:
          - "Member.status = TERMINATED"
          - "Region.premium_revenue_cents recomputed excluding this member"

  - entity: Referral
    initial_state: PENDING_TRIAGE
    terminal_states: [COMPLETED, EXPIRED]
    shape: cyclic_negotiation_loop
    transitions:
      - from: PENDING_TRIAGE
        to: AUTHORIZED
        trigger: "POST /referrals/{id}/authorize"
        actor: UtilizationReviewer
        preconditions:
          - "Referral.status == PENDING_TRIAGE"
          - "when referral_type == OUTSIDE_NETWORK: authorization_exception == true AND exception_reason == SERVICE_UNAVAILABLE_IN_NETWORK"
          - "target department exists and accepting_internal_referrals == true"
        side_effects:
          - "set Referral.status = AUTHORIZED"
          - "set Referral.effective_decision_at = logical clock"
          - "set Referral.expires_at = Referral.created_at + 90 days"

      - from: PENDING_TRIAGE
        to: DENIED
        trigger: "POST /referrals/{id}/deny"
        actor: UtilizationReviewer
        preconditions:
          - "Referral.status == PENDING_TRIAGE"
        side_effects:
          - "set Referral.status = DENIED"
          - "set Referral.effective_decision_at = logical clock"
          - "for each Appointment with referral_id == this referral and hold_status == REFERRAL_HOLD: set Appointment.hold_status = NONE (Cascade 2 hop A1)"

      - from: AUTHORIZED
        to: SCHEDULED
        trigger: "POST /appointments"
        actor: AccessScheduler
        preconditions:
          - "Referral.status == AUTHORIZED"
          - "logical clock < Referral.expires_at"
        side_effects:
          - "set Referral.status = SCHEDULED"
          - "the created Appointment carries referral_id = this referral and hold_status = NONE"

      - from: AUTHORIZED
        to: EXPIRED
        trigger: "system (automatic when logical clock >= expires_at); also enforced as a booking precondition returning ERR_REFERRAL_EXPIRED"
        actor: system
        preconditions:
          - "Referral.status == AUTHORIZED"
          - "logical clock >= Referral.expires_at"
        side_effects:
          - "set Referral.status = EXPIRED"
          - "no new Appointment may be created against this referral"

      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /appointments/{id}/complete"
        actor: CareTeamMember
        preconditions:
          - "Referral.status == SCHEDULED"
          - "the referenced Appointment status == SCHEDULED"
        side_effects:
          - "set Referral.status = COMPLETED"

      - from: DENIED
        to: APPEALED
        trigger: "POST /referrals/{id}/appeal"
        actor: UtilizationReviewer
        preconditions:
          - "Referral.status == DENIED"
          - "Referral.appeal_rounds < APPEAL_ROUNDS_MAX"
        side_effects:
          - "set Referral.status = APPEALED"
          - "set Referral.appeal_rounds = Referral.appeal_rounds + 1"

      - from: APPEALED
        to: AUTHORIZED
        trigger: "POST /referrals/{id}/authorize"
        actor: UtilizationReviewer
        preconditions:
          - "Referral.status == APPEALED"
        side_effects:
          - "set Referral.status = AUTHORIZED"
          - "set Referral.effective_decision_at = logical clock"
          - "retain Referral.appeal_rounds"

      - from: APPEALED
        to: DENIED
        trigger: "POST /referrals/{id}/deny"
        actor: UtilizationReviewer
        preconditions:
          - "Referral.status == APPEALED"
          - "Referral.appeal_rounds < APPEAL_ROUNDS_MAX"
        side_effects:
          - "set Referral.status = DENIED"

      - from: PENDING_TRIAGE
        to: HELD
        trigger: "system (automatic when the target region posture moves to RESTRICTED)"
        actor: system
        preconditions:
          - "Referral.status == PENDING_TRIAGE"
          - "the target department's region posture == RESTRICTED"
        side_effects:
          - "set Referral.status = HELD"
          - "for each Appointment with referral_id == this referral and fulfillment_status == REQUESTED: set Appointment.hold_status = REFERRAL_HOLD"

      - from: HELD
        to: PENDING_TRIAGE
        trigger: "system (automatic when the target region posture returns to OPEN)"
        actor: system
        preconditions:
          - "Referral.status == HELD"
          - "target region posture == OPEN"
        side_effects:
          - "set Referral.status = PENDING_TRIAGE"

  - entity: Appointment
    initial_state: REQUESTED
    terminal_states: [COMPLETED, CANCELLED]
    shape: parallel_dimensions
    transitions:
      - from: REQUESTED
        to: SCHEDULED
        trigger: "POST /appointments"
        actor: AccessScheduler
        preconditions:
          - "Department.status != CLOSED"
          - "Department.appointment_slots_committed + 1 <= Department.appointment_slots_budgeted"
          - "when appointment_type == SPECIALTY: a Referral row exists whose id equals the supplied referral_id, whose member_id equals the supplied member_id, whose status IN {AUTHORIZED, APPEALED}, and whose target_department_id equals the supplied department_id"
        side_effects:
          - "set Appointment.fulfillment_status = SCHEDULED"
          - "compute Appointment.wait_days, Appointment.access_status, Appointment.hold_status"
          - "Department.appointment_slots_committed += 1 (Cascade 3 hop C2)"
          - "if the referenced Referral has status == AUTHORIZED: set Referral.status = SCHEDULED (Cascade 3 hop C3)"
          - "if Department.appointment_slots_committed reaches Department.appointment_slots_budgeted: set Department.status = CONSTRAINED (Cascade 3 hop C4)"
          - "for the CapacityPlan covering this department: recompute committed_slots, supply_shortfall_slots, recalculation_epoch += 1 (Cascade 3 hop C1)"
          - "recompute the parent region's operating_margin_cents; the resulting posture ladder may cascade onward into AlertNotification rows (Cascade 3 hop C5)"

      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /appointments/{id}/cancel"
        actor: AccessScheduler
        preconditions:
          - "Appointment.fulfillment_status == REQUESTED"
        side_effects:
          - "set Appointment.fulfillment_status = CANCELLED"

      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /appointments/{id}/complete"
        actor: CareTeamMember
        preconditions:
          - "Appointment.fulfillment_status == SCHEDULED"
        side_effects:
          - "set Appointment.fulfillment_status = COMPLETED"
          - "if the referenced Referral has status == SCHEDULED: set Referral.status = COMPLETED"
          - "the parent Region's access_breach_pct recomputed"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /appointments/{id}/cancel"
        actor: AccessScheduler
        preconditions:
          - "Appointment.fulfillment_status == SCHEDULED"
        side_effects:
          - "set Appointment.fulfillment_status = CANCELLED"
          - "Department.appointment_slots_committed -= 1"
          - "if the referenced Referral has status == SCHEDULED: set Referral.status = AUTHORIZED"
          - "for the CapacityPlan covering this department: recompute committed_slots, supply_shortfall_slots, recalculation_epoch += 1"

  - entity: OutsideServiceClaim
    initial_state: SUBMITTED
    terminal_states: [PAID, DENIED]
    shape: cyclic_appeal_loop
    transitions:
      - from: SUBMITTED
        to: PENDED
        trigger: "system (automatic when the region's outside-services budget line is exceeded)"
        actor: system
        preconditions:
          - "region's outside_services_committed_cents > regional_budget.outside_services_budget_cents"
        side_effects:
          - "set OutsideServiceClaim.status = PENDED"

      - from: SUBMITTED
        to: ADJUDICATED
        trigger: "POST /outside-service-claims/{id}/adjudicate"
        actor: RegionalFinanceOfficer
        preconditions:
          - "OutsideServiceClaim.status == SUBMITTED"
          - "region's outside_services_committed_cents <= regional_budget.outside_services_budget_cents"
        side_effects:
          - "compute OutsideServiceClaim.final_liability_cents (chronological, pinned)"
          - "set OutsideServiceClaim.adjudicated_at = logical clock"
          - "set OutsideServiceClaim.status = ADJUDICATED"
          - "Region.outside_services_spend_cents += final_liability_cents (Cascade 3 hop C1)"
          - "RegionalBudget.outside_services_committed_cents += final_liability_cents"
          - "compute Region.operating_margin_cents"
          - "when the recomputed operating_margin_cents < 0: run the Region posture ladder, moving the region OPEN -> RESTRICTED (Cascade 3 hop C2)"

      - from: PENDED
        to: ADJUDICATED
        trigger: "POST /outside-service-claims/{id}/adjudicate"
        actor: RegionalFinanceOfficer
        preconditions:
          - "OutsideServiceClaim.status == PENDED"
          - "region's outside_services_committed_cents <= regional_budget.outside_services_budget_cents"
        side_effects:
          - "same as SUBMITTED -> ADJUDICATED"

      - from: APPEALED
        to: ADJUDICATED
        trigger: "POST /outside-service-claims/{id}/adjudicate"
        actor: RegionalFinanceOfficer
        preconditions:
          - "OutsideServiceClaim.status == APPEALED"
          - "region's outside_services_committed_cents <= regional_budget.outside_services_budget_cents"
        side_effects:
          - "same as SUBMITTED -> ADJUDICATED"

      - from: ADJUDICATED
        to: PAID
        trigger: "POST /outside-service-claims/{id}/pay"
        actor: RegionalFinanceOfficer
        preconditions:
          - "OutsideServiceClaim.status == ADJUDICATED"
          - "RegionalBudget.status == APPROVED"
        side_effects:
          - "set OutsideServiceClaim.status = PAID"

      - from: ADJUDICATED
        to: DENIED
        trigger: "POST /outside-service-claims/{id}/deny"
        actor: UtilizationReviewer
        preconditions:
          - "OutsideServiceClaim.status == ADJUDICATED"
        side_effects:
          - "set OutsideServiceClaim.status = DENIED"
          - "Region.outside_services_spend_cents -= final_liability_cents"
          - "RegionalBudget.outside_services_committed_cents -= final_liability_cents"

      - from: DENIED
        to: APPEALED
        trigger: "POST /outside-service-claims/{id}/appeal"
        actor: UtilizationReviewer
        preconditions:
          - "OutsideServiceClaim.status == DENIED"
          - "OutsideServiceClaim.appeal_rounds < APPEAL_ROUNDS_MAX"
        side_effects:
          - "set OutsideServiceClaim.status = APPEALED"
          - "set OutsideServiceClaim.appeal_rounds = OutsideServiceClaim.appeal_rounds + 1"

      - from: APPEALED
        to: DENIED
        trigger: "POST /outside-service-claims/{id}/deny"
        actor: UtilizationReviewer
        preconditions:
          - "OutsideServiceClaim.status == APPEALED"
          - "OutsideServiceClaim.appeal_rounds < APPEAL_ROUNDS_MAX"
        side_effects:
          - "set OutsideServiceClaim.status = DENIED"

  - entity: RegionalBudget
    initial_state: DRAFT
    terminal_states: [CLOSED]
    shape: branching
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /regional-budgets/{id}/submit"
        actor: RegionalFinanceOfficer
        preconditions:
          - "RegionalBudget.status == DRAFT"
          - "operating_margin_cents >= 0 OR Region.posture != FROZEN"
        side_effects:
          - "set RegionalBudget.status = SUBMITTED"
          - "recompute RegionalBudget.operating_margin_cents"
          - "recompute the parent Region's operating_margin_cents"
          - "if the recomputed RegionalBudget.operating_margin_cents < 0: insert one AlertNotification row with alert_type = BUDGET_BREACH, severity = WARNING, payload_ref_type = RegionalBudget, payload_ref_id = this budget, status = RAISED (Cascade 2 hop G2)"

      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /regional-budgets/{id}/approve"
        actor: BudgetAppropriationsCommittee
        preconditions:
          - "RegionalBudget.status == SUBMITTED"
        side_effects:
          - "set RegionalBudget.status = APPROVED"
          - "snapshot RegionalBudget.premium_revenue_cents and employed_delivery_cost_cents"

      - from: SUBMITTED
        to: DRAFT
        trigger: "POST /regional-budgets/{id}/return"
        actor: BudgetAppropriationsCommittee
        preconditions:
          - "RegionalBudget.status == SUBMITTED"
        side_effects:
          - "set RegionalBudget.status = DRAFT"

      - from: APPROVED
        to: CLOSED
        trigger: "POST /regional-budgets/{id}/close"
        actor: RegionalFinanceOfficer
        preconditions:
          - "RegionalBudget.status == APPROVED"
        side_effects:
          - "set RegionalBudget.status = CLOSED"

      - from: APPROVED
        to: REOPENED
        trigger: "POST /regional-budgets/{id}/reopen"
        actor: BudgetAppropriationsCommittee
        preconditions:
          - "RegionalBudget.status == APPROVED"
        side_effects:
          - "set RegionalBudget.status = REOPENED"

      - from: CLOSED
        to: REOPENED
        trigger: "POST /regional-budgets/{id}/reopen"
        actor: BudgetAppropriationsCommittee
        preconditions:
          - "RegionalBudget.status == CLOSED"
        side_effects:
          - "set RegionalBudget.status = REOPENED"

      - from: REOPENED
        to: SUBMITTED
        trigger: "POST /regional-budgets/{id}/submit"
        actor: RegionalFinanceOfficer
        preconditions:
          - "RegionalBudget.status == REOPENED"
        side_effects:
          - "set RegionalBudget.status = SUBMITTED"

  - entity: CapacityPlan
    initial_state: PLANNING
    terminal_states: [FROZEN]
    transitions:
      - from: PLANNING
        to: UNDER_REVIEW
        trigger: "POST /capacity-plans/{id}/review"
        actor: AccessScheduler
        preconditions:
          - "CapacityPlan.status == PLANNING"
          - "budgeted_slots >= panel_target / PANEL_TARGET_MEMBERS_PER_SLOT"
        side_effects:
          - "set CapacityPlan.status = UNDER_REVIEW"

      - from: UNDER_REVIEW
        to: ACTIVE
        trigger: "POST /capacity-plans/{id}/activate"
        actor: RegionalFinanceOfficer
        preconditions:
          - "CapacityPlan.status == UNDER_REVIEW"
          - "parent region posture IN {OPEN, RESTRICTED}"
        side_effects:
          - "set CapacityPlan.status = ACTIVE"
          - "recompute committed_slots = count of the department's non-cancelled appointments for the period"
          - "Region.capacity_budget_appointments recomputed"

      - from: ACTIVE
        to: ADJUSTED
        trigger: "POST /capacity-plans/{id}/adjust"
        actor: RegionalFinanceOfficer
        preconditions:
          - "CapacityPlan.status == ACTIVE"
          - "budgeted_slots >= committed_slots"
        side_effects:
          - "set CapacityPlan.status = ADJUSTED"
          - "set CapacityPlan.budgeted_slots to the supplied value"
          - "CapacityPlan.recalculation_epoch += 1"

      - from: ADJUSTED
        to: UNDER_REVIEW
        trigger: "POST /capacity-plans/{id}/review"
        actor: AccessScheduler
        preconditions:
          - "CapacityPlan.status IN {PLANNING, ADJUSTED}"
          - "budgeted_slots >= panel_target / PANEL_TARGET_MEMBERS_PER_SLOT"
        side_effects:
          - "set CapacityPlan.status = UNDER_REVIEW"

      - from: UNDER_REVIEW
        to: PLANNING
        trigger: "POST /capacity-plans/{id}/return"
        actor: AccessScheduler
        preconditions:
          - "CapacityPlan.status == UNDER_REVIEW"
        side_effects:
          - "set CapacityPlan.status = PLANNING"

      - from: ACTIVE
        to: UNDER_REVIEW
        trigger: "system (automatic when committed_slots exceeds budgeted_slots)"
        actor: system
        preconditions:
          - "CapacityPlan.status == ACTIVE"
          - "committed_slots > budgeted_slots"
        side_effects:
          - "set CapacityPlan.status = UNDER_REVIEW (Cascade 1 hop H3)"
          - "recompute the parent Region's capacity_committed_appointments and capacity_budget_appointments"
          - "when Region.capacity_committed_appointments > Region.capacity_budget_appointments: run the Region capacity posture trigger (Cascade 1 hop H4)"

      - from: ACTIVE
        to: FROZEN
        trigger: "system (automatic when the parent Region posture == FROZEN)"
        actor: system
        preconditions:
          - "parent Region.posture == FROZEN"
        side_effects:
          - "set CapacityPlan.status = FROZEN"

  - entity: MemberTransfer
    initial_state: REQUESTED
    terminal_states: [COMPLETED, REJECTED, CANCELLED]
    shape: branching_fork_join
    transitions:
      - from: REQUESTED
        to: PENDING_EFFECTIVE
        trigger: "POST /member-transfers/{id}/accept"
        actor: RegionalFinanceOfficer
        preconditions:
          - "MemberTransfer.status == REQUESTED"
          - "destination Region.posture != FROZEN"
        side_effects:
          - "set MemberTransfer.status = PENDING_EFFECTIVE"
          - "set Member.status = TRANSFER_PENDING (Cascade 4 hop T1)"

      - from: REQUESTED
        to: REJECTED
        trigger: "POST /member-transfers/{id}/reject"
        actor: RegionalFinanceOfficer
        preconditions:
          - "MemberTransfer.status == REQUESTED"
        side_effects:
          - "set MemberTransfer.status = REJECTED"

      - from: PENDING_EFFECTIVE
        to: COMPLETED
        trigger: "POST /member-transfers/{id}/complete"
        actor: RegionalFinanceOfficer
        preconditions:
          - "MemberTransfer.status == PENDING_EFFECTIVE"
          - "logical clock >= MemberTransfer.effective_utc"
        side_effects:
          - "set MemberTransfer.status = COMPLETED"
          - "set Member.region_id = to_region_id; recompute Member.capitation_rate_cents (Cascade 4 hop T2)"
          - "set Member.status = ACTIVE (Cascade 4 hop T3)"
          - "recompute the destination Region's premium_revenue_cents"
          - "for each Provider in to_region_id with status == ACTIVE: recompute panel_size_assigned, quality_score, volume_component_cents, panel_capitation_component_cents, quality_bonus_cents, comp_total_cents (Cascade 4 hop T4)"
          - "recompute the destination Region's employed_delivery_cost_cents"
          - "recompute the destination Region's referential_integration_credit_cents and computed_margin_cents (Cascade 4 hop T5)"

      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /member-transfers/{id}/cancel"
        actor: RegionalFinanceOfficer
        preconditions:
          - "MemberTransfer.status == REQUESTED"
        side_effects:
          - "set MemberTransfer.status = CANCELLED"

      - from: PENDING_EFFECTIVE
        to: CANCELLED
        trigger: "POST /member-transfers/{id}/cancel"
        actor: RegionalFinanceOfficer
        preconditions:
          - "MemberTransfer.status == PENDING_EFFECTIVE"
          - "logical clock < MemberTransfer.effective_utc"
        side_effects:
          - "set MemberTransfer.status = CANCELLED"
          - "set Member.status = ACTIVE with region_id unchanged"

  - entity: ReferentialIntegration
    initial_state: PROPOSED
    terminal_states: [TERMINATED]
    shape: branching_fork_join
    transitions:
      - from: PROPOSED
        to: BOUND
        trigger: "POST /referential-integrations/{id}/bind"
        actor: BudgetAppropriationsCommittee
        preconditions:
          - "ReferentialIntegration.status == PROPOSED"
          - "Region.posture != FROZEN"
        side_effects:
          - "set ReferentialIntegration.status = BOUND"
          - "Region.referential_integration_credit_cents += round_half_up(cost_reporting_basis_cents * integration_credit_rate[risk_sharing_model]) (Cascade 5 hop RI-1)"
          - "recompute the parent Region's computed_margin_cents (Cascade 5 hop RI-2)"
          - "increments Region.version by 1"

      - from: BOUND
        to: ENROLLED
        trigger: "POST /referential-integrations/{id}/enroll"
        actor: BudgetAppropriationsCommittee
        preconditions:
          - "ReferentialIntegration.status == BOUND"
        side_effects:
          - "set ReferentialIntegration.status = ENROLLED"
          - "posted portion of settlement_account_cents added to Region.premium_revenue_cents; Region.referential_integration_credit_cents recomputed"
          - "RegionalBudget.outside_services_committed_cents += the unposted remainder"

      - from: ENROLLED
        to: CONTRACTED
        trigger: "POST /referential-integrations/{id}/contract"
        actor: BudgetAppropriationsCommittee
        preconditions:
          - "ReferentialIntegration.status == ENROLLED"
        side_effects:
          - "set ReferentialIntegration.status = CONTRACTED"
          - "settlement_posted_cents set to settlement_account_cents"
          - "the parent Region's computed_margin_cents recomputed"

      - from: BOUND
        to: TERMINATED
        trigger: "POST /referential-integrations/{id}/terminate"
        actor: BudgetAppropriationsCommittee
        preconditions:
          - "ReferentialIntegration.status IN {BOUND, ENROLLED}"
        side_effects:
          - "set ReferentialIntegration.status = TERMINATED"
          - "Region.referential_integration_credit_cents -= this integration's contribution"
          - "recompute the parent Region's computed_margin_cents"
          - "increments Region.version by 1"

      - from: ENROLLED
        to: TERMINATED
        trigger: "POST /referential-integrations/{id}/terminate"
        actor: BudgetAppropriationsCommittee
        preconditions:
          - "ReferentialIntegration.status IN {BOUND, ENROLLED}"
        side_effects:
          - "set ReferentialIntegration.status = TERMINATED"
          - "Region.premium_revenue_cents -= settlement_posted_cents"
          - "RegionalBudget.outside_services_committed_cents -= the unposted remainder"
          - "recompute the parent Region's computed_margin_cents"

  - entity: QualityMetric
    initial_state: MEASURING
    terminal_states: []
    shape: cyclic
    transitions:
      - from: MEASURING
        to: FINALIZED
        trigger: "POST /quality-metrics/{id}/finalize"
        actor: QualityReviewBoard
        preconditions:
          - "QualityMetric.status IN {MEASURING, REOPENED}"
          - "logged_internal_referral_pct == 1.0 for the region and period"
        side_effects:
          - "compute QualityMetric.measured_value"
          - "compute QualityMetric.weighted_component_score"
          - "set QualityMetric.status = FINALIZED"
          - "if metric_code == QUALITY_COMPOSITE: set the accountable Provider's quality_score = measured_value and recompute that provider's comp_total_cents, the parent Region's employed_delivery_cost_cents and operating_margin_cents (Cascade 5 hop Q2)"
          - "when the recomputed operating_margin_cents < 0: run the Region posture ladder, moving the region OPEN -> RESTRICTED (Cascade 5 hop Q3)"
          - "insert one AlertNotification row with alert_type = QUALITY_GAP, severity = WARNING, payload_ref_type = QualityMetric, payload_ref_id = this metric, status = RAISED (Cascade 5 hop Q4)"

      - from: FINALIZED
        to: REMEDIATION
        trigger: "system (automatic when measured_value misses target_value)"
        actor: system
        preconditions:
          - "QualityMetric.status == FINALIZED"
          - "measured_value < target_value"
        side_effects:
          - "set QualityMetric.status = REMEDIATION"
          - "set the accountable Provider.status = PANEL_CLOSED"

      - from: REMEDIATION
        to: REOPENED
        trigger: "POST /quality-metrics/{id}/reopen"
        actor: QualityReviewBoard
        preconditions:
          - "QualityMetric.status == REMEDIATION"
        side_effects:
          - "set QualityMetric.status = REOPENED"

      - from: REOPENED
        to: FINALIZED
        trigger: "POST /quality-metrics/{id}/finalize"
        actor: QualityReviewBoard
        preconditions:
          - "QualityMetric.status IN {MEASURING, REOPENED}"
          - "logged_internal_referral_pct == 1.0 for the region and period"
        side_effects:
          - "recompute QualityMetric.measured_value and weighted_component_score"
          - "set QualityMetric.status = FINALIZED"
          - "when the recomputed operating_margin_cents < 0: run the Region posture ladder (Cascade 5 hop Q3)"

# =============================================================================
# §1.3 Calculation Rules Table (8 calculation rules)
# =============================================================================
calculations:
  - name: capitation_rate_cents
    trigger: "member registration, and member transfer completion (POST /member-transfers/{id}/complete)"
    algorithm: tiered_pricing
    formula: |
      BASE_RATE = base_rate_cents[plan_product]
      region_multiplier = Region.capitation_index of the member's region of record
      adjusted_base = round_half_up(BASE_RATE * region_multiplier)
      risk_component = round_half_up(adjusted_base * risk_score)
      raw_rate = adjusted_base + risk_component
      LOWER = round_half_up(adjusted_base * CAPITATION_FLOOR_MULTIPLIER)
      UPPER = round_half_up(adjusted_base * CAPITATION_CEIL_MULTIPLIER)
      capitation_rate_cents = clamp(raw_rate, LOWER, UPPER)
      # clamp(x, lo, hi): if x < lo -> lo; if x > hi -> hi; else x
    input_set: "one Member row; BASE_RATE selected by plan_product; risk_score is the Member's own field; region_multiplier is the Region row's capitation_index"
    constants:
      BASE_RATE_COMMERCIAL_HMO_CENTS: 42000
      BASE_RATE_MEDICARE_ADVANTAGE_CENTS: 95000
      BASE_RATE_MEDICAID_MANAGED_CENTS: 28000
      BASE_RATE_DUAL_ELIGIBLE_CENTS: 118000
      CAPITATION_FLOOR_MULTIPLIER: 0.5
      CAPITATION_CEIL_MULTIPLIER: 2.5
    precision: "integer cents, round_half_up"
    variants:
      - name: blind_average
        when: "a region-level revenue estimate is produced before member-level risk scores are loaded"
        difference: "uses the un-weighted BASE_RATE for every member with no risk_score and no capitation_index, so the estimate excludes both the member's risk score and the region's capitation index"
      - name: risk_adjusted_clamped
        when: "member registration and transfer completion"
        difference: "applies the region capitation_index and then clamps each member's rate at LOWER / UPPER, so members with extreme risk_score land at the floor or ceiling rather than at their raw proportional rate"

  - name: provider_comp_total_cents
    trigger: "provider creation, member registration/termination/transfer affecting the panel, quality-metric finalization, and referential-integration transition"
    algorithm: combinatorial_formula
    formula: |
      panel_capitation_component_cents = round_half_up(panel_size_assigned * panel_rate_cents[specialty])
      quality_bonus_cents = 0
      if quality_score >= QUALITY_BONUS_THRESHOLD: quality_bonus_cents = round_half_up((base_component_cents + panel_capitation_component_cents) * QUALITY_BONUS_RATE)
      volume_component_cents = 0   # pinned: compensation is decoupled from procedure volume
      comp_total_cents = base_component_cents + panel_capitation_component_cents + quality_bonus_cents + volume_component_cents
    input_set: "one Provider row; panel_size_assigned is derived from Member rows in the same region whose attributed specialty == provider.specialty and status == ACTIVE"
    constants:
      PANEL_RATE_PRIMARY_CARE_CENTS: 900
      PANEL_RATE_CARDIOLOGY_CENTS: 1400
      PANEL_RATE_ORTHOPEDICS_CENTS: 1500
      PANEL_RATE_ONCOLOGY_CENTS: 1800
      PANEL_RATE_RADIOLOGY_CENTS: 1100
      PANEL_RATE_BEHAVIORAL_HEALTH_CENTS: 1000
      QUALITY_BONUS_THRESHOLD: 85
      QUALITY_BONUS_RATE: 0.10
    precision: "integer cents, round_half_up"
    evaluation_order: "panel_capitation_component_cents is evaluated first; quality_bonus_cents is keyed on (base_component_cents + panel_capitation_component_cents) and is evaluated second; comp_total_cents sums all four components last. A bonus computed on base alone yields a different total."

  - name: region_operating_budget
    trigger: "any mutation of Member, Provider, CareSite, OutsideServiceClaim or RegionalBudget in the region; provider compensation model change; care-site staffing change; referential-integration binding change"
    algorithm: constraint_propagation
    formula: |
      SETTLED (Region.operating_margin_cents, the variant gating the posture ladder and the fiscal-line validation):
        premium_revenue_cents             = sum(Member.capitation_rate_cents)  for Member where region_id == R and status IN {ACTIVE, TRANSFER_PENDING}
        employed_delivery_cost_cents      = sum(Provider.comp_total_cents)     for Provider where region_id == R
        outside_services_spend_cents      = sum(OutsideServiceClaim.final_liability_cents) for OutsideServiceClaim where region_id == R and status IN {PAID, ADJUDICATED}
        staffing_and_facility_cents       = sum(CareSite.staffing_fte_filled * FTE_COST_CENTS + CareSite.facility_investment_spent_cents) for CareSite where region_id == R
        operating_margin_cents            = premium_revenue_cents
                                            - employed_delivery_cost_cents
                                            - outside_services_spend_cents
                                            - staffing_and_facility_cents
      COMPUTED (Region.computed_margin_cents, the forward variant):
        expected_premium_revenue_cents = sum over in-force members of capitation recomputed at the member's CURRENT risk_score
                                         plus, for ReferentialIntegration rows in this region with status IN {BOUND, ENROLLED, CONTRACTED},
                                             cost_reporting_basis_cents * integration_credit_rate[risk_sharing_model]
        computed_margin_cents          = expected_premium_revenue_cents - employed_delivery_cost_cents - outside_services_spend_cents - staffing_and_facility_cents
      margin_gap_cents                 = operating_margin_cents - round_half_up(premium_revenue_cents * margin_target_pct)
    input_set: "drafts in {DRAFT, SUBMITTED, APPROVED}; every referral whose effective_decision_at falls inside the period supplies escalated_deductible_cents, and the region's committed claims in the period supply committed_claim_liability_cents"
    constants:
      FTE_COST_CENTS: 1250000
      MARGIN_FREEZE_FLOOR_CENTS: 500000000
    precision: "integer cents, round_half_up"
    evaluation_order: |
      Pass all six components first. First-level aggregates are computed in this order:
      (1) expected_premium_revenue_cents = sum of each in-force member's capitation_rate_cents recomputed with that member's latest risk_score;
      (2) employed_delivery_cost_cents = sum of each provider's comp_total_cents recomputed with the provider's latest panel_size_assigned;
      (3) escalated_deductible_cents = sum over referrals with effective_decision_at inside the period of (referral-level deductible reconsumption);
      (4) projected_claim_liability_cents = sum of seeded claim-line liabilities over the region's claims in the period.
      Then computed_revenue_cents = expected_premium_revenue_cents, computed_expense_cents = employed_delivery_cost_cents + staffing_budget_cents + escalated_deductible_cents + projected_claim_liability_cents + facility_investment_cents, and computed_margin_cents = computed_revenue_cents - computed_expense_cents.
      settled_margin_cents is evaluated LAST from persisted rows and never feeds back into computed_margin_cents. The two are the same number only when the period has no un-adjudicated claims and no pending transfers.
    variants:
      - name: computed_forward
        when: "budget submission and margin planning (POST /regional-budgets/{id}/submit)"
        difference: "recomputes each in-force member's capitation at that member's current risk_score and each provider's compensation at that provider's current panel_size_assigned, and projects claim liability from claim-line data, so a member whose risk_score changed after enrollment moves computed_revenue_cents even though no cash line changed"
      - name: settled_chronological
        when: "period close and post-close reporting"
        difference: "sums only persisted member capitation_rate_cents and persisted provider comp_total_cents rows, and counts only claims in {PAID, ADJUDICATED}; un-adjudicated claims and pending transfers are excluded, so it reports a different margin on identical data"

  - name: capacity_supply_balance
    trigger: "capitation enrollment change, capacity-plan activation/adjustment, and every appointment create/cancel"
    algorithm: quota_allocation
    formula: |
      committed_slots = count of Appointment rows in the department's period where fulfillment_status IN {REQUESTED, SCHEDULED, COMPLETED}
      supply_shortfall_slots = max(0, committed_slots - budgeted_slots)
      utilization_pct = round_half_up(100 * committed_slots / budgeted_slots)
      recalculation_epoch += 1 on every recompute
    input_set: "one CapacityPlan row; committed_slots counts appointments whose department_id == plan.department_id and whose start_utc falls inside plan.period"
    constants:
      PANEL_TARGET_MEMBERS_PER_SLOT: 1.5
    precision: "integer slots; utilization_pct to 2 decimal places, round_half_up"
    variants:
      - name: budgeted_supply_view
        when: "capacity planning and budget approval"
        difference: "uses budgeted_slots as the denominator, so supply is a budgeting decision; a department whose clinicians could physically deliver more slots still reports the budgeted figure"
      - name: actual_supply_view
        when: "access reporting after the period closes"
        difference: "uses the count of slots that were actually filled and delivered, so the same department reports a different supply number than the budgeted view"

  - name: internal_referral_rate
    trigger: "referral decision (authorize/deny) and appointment completion; gates quality-metric finalization"
    algorithm: weighted_scoring
    formula: |
      For a region R and period P:
        referral_decisions = Referral rows with effective_decision_at in period P
        logged_internal_referral_pct = round_half_up(referred_inside_count / total_authorized_count)
      QUALITY_COMPOSITE component scoring, per component c with weight w_c:
        component_score_c = round_half_up(100 * clamp(measured_value_c / target_value_c, 0, 1))
        weighted_component_score_c = round_half_up(w_c * component_score_c)
      quality_composite_score = sum over components of weighted_component_score_c
    input_set: "authorized referrals only (Referral status IN {AUTHORIZED, SCHEDULED, COMPLETED}); denied referrals are excluded"
    constants:
      WEIGHT_ACCESS: 0.40
      WEIGHT_QUALITY: 0.30
      WEIGHT_SATISFACTION: 0.20
      WEIGHT_PANEL: 0.10
    precision: "weighted_component_score_c rounded per component before summing; quality_composite_score is an integer 0..100"
    nested_rounding_note: "round per component first, then sum — rounding the weighted sum once instead produces a different integer (see variant single_round_sum)"

  - name: access_wait_metric
    trigger: "appointment booking and access reporting per region and period"
    algorithm: aggregation
    formula: |
      wait_days = round_half_up_to_1dp((start_utc - booking_instant) / 86400)
      access_status = BREACHED_ACCESS_TARGET if wait_days >= department.wait_threshold_days else WITHIN_ACCESS_TARGET
      region access_breach_pct = round_half_up(100 * breached_count / non_cancelled_count)
      ACCESS_WAIT_DAYS measured_value = round_half_up_to_1dp(sum(wait_days) / count(non-cancelled appointments in period))
    input_set: "excluded: appointments with fulfillment_status == CANCELLED or access_status != BREACHED_ACCESS_TARGET for the breach counter"
    constants:
      ACCESS_PCT_PRECISION_DP: 2
    precision: "wait_days to 1 decimal place; access_breach_pct to 2 decimal places, round_half_up"
    boundary_note: "wait_days == wait_threshold_days is a breach (>=), wait_days == wait_threshold_days - 0.1 is not"

  - name: outside_services_liability
    trigger: "claim submission (provisional) and claim adjudication (final)"
    algorithm: dual_variant
    formula: |
      PROVISIONAL (at POST /outside-service-claims):
        billed = billed_amount_cents
        provisional_liability_cents = round_half_up(billed * vendor_allowable_pct[vendor_name])
        if emergency_flag == true:
          provisional_liability_cents = round_half_up(billed * EMERGENCY_PAY_RATE)
      FINAL (at POST /outside-service-claims/{id}/adjudicate):
        sort the claim's line items by (line_number ASC, created_at ASC)
        running_total = 0
        running_liability = 0
        for each line item in sorted order:
          running_total += line_amount_cents
          if running_total <= ANNUAL_DEDUCTIBLE_CENTS:
            line_liability = 0
          else:
            excess = running_total - ANNUAL_DEDUCTIBLE_CENTS
            if excess >= line_amount_cents: line_liability = round_half_up(line_amount_cents * COINSURANCE_RATE)
            else: line_liability = round_half_up(excess * COINSURANCE_RATE)
          running_liability += line_liability
        final_liability_cents = min(running_liability, OUT_OF_POCKET_CAP_CENTS)
    input_set: "line items are the claim's own children; the deductible is consumed chronologically across line items, so the final liability depends on line order"
    constants:
      ANNUAL_DEDUCTIBLE_CENTS: 150000
      COINSURANCE_RATE: 0.20
      OUT_OF_POCKET_CAP_CENTS: 600000
      EMERGENCY_PAY_RATE: 0.75
      vendor_allowable_pct:
        "KP Affiliate": 0.80
        "Default": 0.70
      CONTRACTED_LINE_NUMBERS: "line items sorted by (line_number ASC, created_at ASC)"
    precision: "integer cents, round_half_up"
    variants:
      - name: provisional_pct_of_billed
        when: "claim submission"
        difference: "applies a flat vendor allowable percentage (or the emergency rate) to the whole billed amount, ignoring the deductible — so provisional_liability_cents != final_liability_cents for the same claim"
      - name: final_deductible_chronological
        when: "claim adjudication"
        difference: "consumes ANNUAL_DEDUCTIBLE_CENTS line by line in chronological order, applies COINSURANCE_RATE only to the post-deductible excess, and caps the total at OUT_OF_POCKET_CAP_CENTS"

  - name: referential_integration_settlement
    trigger: "referential-integration creation, bind, enroll and contract"
    algorithm: combinatorial_formula
    formula: |
      # Mode (a) non-linear multi-input cap
      per_diem_component_cents = min(round_half_up(per_diem_days * per_diem_rate_cents), per_diem_cap_cents)
      # Mode (a) threshold branch on interim volume
      effective_credit_rate = integration_credit_rate[risk_sharing_model]
      if interim_claim_count > INTERIM_CLAIM_THRESHOLD: effective_credit_rate = effective_credit_rate * INTERIM_HIGH_MULTIPLIER
      basis_component_cents = round_half_up(cost_reporting_basis_cents * effective_credit_rate)
      settlement_account_cents = per_diem_component_cents + basis_component_cents
      Region.referential_integration_credit_cents = sum over non-TERMINATED integrations of settlement_account_cents
      # The shared_savings_rate input is captured but does NOT scale the settlement on its own;
      # it is read only through integration_credit_rate[SHARED_SAVINGS].
    input_set: "one ReferentialIntegration row; integration_credit_rate is keyed by risk_sharing_model"
    constants:
      INTERIM_CLAIM_THRESHOLD: 40
      INTERIM_HIGH_MULTIPLIER: 1.5
      integration_credit_rate:
        CAPITATED: 0.12
        SHARED_SAVINGS: 0.20
        BUNDLED: 0.08
        NOT_AT_RISK: 0.0
    precision: "integer cents, round_half_up"

  - name: referral_authorization_rule
    trigger: "referral creation and referral authorize (POST /referrals/{id}/authorize)"
    algorithm: threshold
    formula: |
      in_network_available = there exists a Department D in the member's region such that
                             D.specialty == specialty_of(referral.service_code)
                             AND D.accepting_internal_referrals == true
                             AND D.status IN {OPEN, CONSTRAINED}
      if referral_type == INTERNAL:
        authorized = in_network_available
      if referral_type == OUTSIDE_NETWORK:
        authorized = (authorization_exception == true)
                     AND (exception_reason == SERVICE_UNAVAILABLE_IN_NETWORK or exception_reason == EMERGENCY)
                     AND (in_network_available == false or exception_reason == EMERGENCY)
      candidate selection when more than one department qualifies:
        filter   = Department D where D.region_id == member.region_id AND D.specialty == specialty_of(service_code) AND D.accepting_internal_referrals == true AND D.status IN {OPEN, CONSTRAINED}
        rank     = D.appointment_slots_budgeted - D.appointment_slots_committed  DESC
        tie_break= D.created_at ASC
        fallback = if the filtered candidate set is empty, the referral is DENIED with ERR_NO_IN_NETWORK_CAPACITY
    input_set: "departments in the member's region of record only; departments in other regions never satisfy in_network_available; a referral service_code is a specialty enum value and specialty_of(service_code) is that value verbatim"
    constants:
      REFERRAL_EXPIRY_DAYS: 90
      APPEAL_ROUNDS_MAX: 2
    precision: "n/a (boolean decision; capacity ranking is integer slots)"
    variants:
      - name: in_network_default
        when: "referral_type == INTERNAL"
        difference: "requires a qualifying in-network department; an authorization_exception flag alone never authorizes an internal referral"
      - name: outside_network_exception
        when: "referral_type == OUTSIDE_NETWORK"
        difference: "requires authorization_exception == true and SERVICE_UNAVAILABLE_IN_NETWORK or EMERGENCY; when the network IS available an EMERGENCY reason still authorizes while SERVICE_UNAVAILABLE_IN_NETWORK does not"

# =============================================================================
# §1.2.1 Concurrency Rules
# Every entry passes the serial-observability filter: the loser is rejected on a
# stale `version` value, not on a state field the winner changed. Two strictly
# sequential requests reproduce each rule deterministically.
# =============================================================================
concurrency_rules:
  - rule_id: transfer-create-stale-member
    parent_entity: Member
    write_endpoint: "POST /member-transfers"
    occ_field: "expected_member_version"
    description: |
      Creating a MemberTransfer against a Member whose version has advanced
      since the client last observed it is rejected. This captures the case
      where the member's region of record has already been rewritten (by a
      completed transfer, a termination, or a capitation recomputation) and the
      writer's view of the member is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: claim-create-stale-member
    parent_entity: Member
    write_endpoint: "POST /regions/{id}/outside-service-claims"
    occ_field: "expected_member_version"
    description: |
      Submitting an OutsideServiceClaim against a Member whose version has
      advanced since the client last observed it is rejected; the member's
      capitation and panel attribution may already have been rewritten, so the
      claim would be priced against a stale member snapshot.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: appointment-create-stale-member
    parent_entity: Member
    write_endpoint: "POST /appointments"
    occ_field: "expected_member_version"
    description: |
      Booking an Appointment for a Member whose version has advanced since the
      client last observed it is rejected, because the member's region of
      record and network profile may already have been rewritten.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: referral-create-stale-member
    parent_entity: Member
    write_endpoint: "POST /referrals"
    occ_field: "expected_member_version"
    description: |
      Raising a Referral for a Member whose version has advanced since the
      client last observed it is rejected — the member's region of record may
      have been rewritten by a completed transfer, which changes which
      departments count as in-network.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.5 Response Envelope (FIXED — copied verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and valid"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all endpoints"

  - priority: 2
    category: auth
    check: "The acting role must hold the operation in its exclusive_operations or shared_operations set"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: "all endpoints"

  - priority: 3
    category: existence
    check: "Every id appearing as a path segment must resolve to a stored row; validated left-to-right, first miss wins"
    error_id: "ERR_{RESOURCE}_NOT_FOUND (ERR_REGION_NOT_FOUND, ERR_MEMBER_NOT_FOUND, ERR_CARE_SITE_NOT_FOUND, ERR_DEPARTMENT_NOT_FOUND, ERR_PROVIDER_NOT_FOUND, ERR_NETWORK_SERVICE_NOT_FOUND, ERR_APPOINTMENT_NOT_FOUND, ERR_REFERRAL_NOT_FOUND, ERR_OUTSIDE_CLAIM_NOT_FOUND, ERR_REGIONAL_BUDGET_NOT_FOUND, ERR_CAPACITY_PLAN_NOT_FOUND, ERR_MEMBER_TRANSFER_NOT_FOUND, ERR_QUALITY_METRIC_NOT_FOUND)"
    http_status: 404
    applies_to: "all path-scoped endpoints"

  - priority: 4
    category: existence
    check: "Every id supplied in a request body must resolve to a stored row"
    error_id: ERR_REFERENCED_RESOURCE_NOT_FOUND
    http_status: 422
    applies_to: "POST /referrals, POST /appointments, POST /member-transfers, POST /regions/{id}/capacity-plans, POST /regions/{id}/quality-metrics, POST /regions/{id}/outside-service-claims"

  - priority: 5
    category: business_referential
    check: "Cross-region referential integrity: the member, department, provider, referral and claim rows named in one request must all resolve to the same region of record, except for an explicitly typed OUTSIDE_NETWORK referral or an OUT_OF_AREA claim"
    error_id: ERR_CROSS_REGION_REFERENCE
    http_status: 422
    applies_to: "POST /referrals, POST /appointments, POST /regions/{id}/outside-service-claims"

  - priority: 6
    category: state
    check: "The target row must occupy a state from which the requested trigger is declared in §1.2"
    error_id: "ERR_INVALID_STATE (state-machine specific: ERR_REFERRAL_NOT_DECIDABLE, ERR_CLAIM_NOT_ADJUDICABLE, ERR_BUDGET_NOT_APPROVED, ERR_BUDGET_NOT_SUBMITTABLE, ERR_CAPACITY_PLAN_NOT_ACTIVATABLE, ERR_TRANSFER_NOT_COMPLETABLE, ERR_METRIC_NOT_FINALIZABLE)"
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 6a
    category: state
    check: "Claim adjudication requires an APPROVED RegionalBudget for the region and period"
    error_id: ERR_BUDGET_NOT_APPROVED
    http_status: 409
    applies_to: "POST /outside-service-claims/{id}/adjudicate, POST /referral-claims/bulk-adjudicate"

  - priority: 7
    category: business_temporal
    check: "A referral decision (POST /referrals, POST /referrals/{id}/authorize, POST /referrals/{id}/deny) requires the logical clock to be at or before Referral.created_at + REFERRAL_TRIAGE_WINDOW_DAYS"
    error_id: ERR_REFERRAL_TRIAGE_WINDOW_EXPIRED
    http_status: 409
    applies_to: "POST /referrals, POST /referrals/{id}/authorize, POST /referrals/{id}/deny"

  - priority: 8
    category: business_safety
    check: "Internal referral network availability: an INTERNAL referral requires a department in the member's region of record whose specialty maps to the referral's service_code and whose accepting_internal_referrals == true and status IN {OPEN, CONSTRAINED}; an OUTSIDE_NETWORK referral requires authorization_exception == true with exception_reason IN {SERVICE_UNAVAILABLE_IN_NETWORK, EMERGENCY}"
    error_id: ERR_SERVICE_NOT_AVAILABLE_IN_NETWORK
    http_status: 409
    applies_to: "POST /referrals, POST /referrals/{id}/authorize, POST /appointments"

  - priority: 8a
    category: business_safety
    check: "When appointment_type == SPECIALTY, the referral named by referral_id must exist, must belong to the supplied member_id, must name the supplied department_id as target_department_id, and must be in status AUTHORIZED (a PENDING_TRIAGE, DENIED, HELD, EXPIRED or COMPLETED referral never authorizes a booking)"
    error_id: ERR_REFERRAL_NOT_AUTHORIZED
    http_status: 409
    applies_to: "POST /appointments"

  - priority: 8b
    category: business_safety
    check: "external_contract_count must not exceed EXTERNAL_CONTRACT_MAX; exceeding it is an unauthorized external network expansion"
    error_id: ERR_UNAUTHORIZED_NETWORK_EXPANSION
    http_status: 409
    applies_to: "POST /referrals"

  - priority: 8c
    category: business_constraint
    check: "An appeal may be opened only while appeal_rounds < APPEAL_ROUNDS_MAX on the referral or the claim; at the maximum the appeal is refused"
    error_id: ERR_APPEAL_ROUNDS_EXHAUSTED
    http_status: 409
    applies_to: "POST /referrals/{id}/appeal, POST /outside-service-claims/{id}/appeal"

  - priority: 9
    category: business_temporal
    check: "An appointment may only be booked against a referral whose logical clock position is strictly before Referral.expires_at; an AUTHORIZED referral at or past expires_at is EXPIRED and cannot be booked"
    error_id: ERR_REFERRAL_EXPIRED
    http_status: 409
    applies_to: "POST /appointments"

  - priority: 10
    category: business_temporal
    check: "Completing a MemberTransfer requires the logical clock to be at or after MemberTransfer.effective_utc"
    error_id: ERR_TRANSFER_EFFECTIVE_DATE_NOT_REACHED
    http_status: 409
    applies_to: "POST /member-transfers/{id}/complete"

  - priority: 11
    category: business_safety
    check: "Provider compensation must stay decoupled from procedure volume: a compensation_model change or a provider creation must not introduce a non-zero volume_component_cents"
    error_id: ERR_VOLUME_COMPONENT_NOT_PERMITTED
    http_status: 422
    applies_to: "POST /providers, POST /providers/{id}/compensation-model"

  - priority: 12
    category: business_constraint
    check: "Region operating posture gate: mutations of Member, CareSite, Department, Provider, CapacityPlan, Referral and OutsideServiceClaim are rejected while the target region's posture is FROZEN"
    error_id: ERR_REGION_POSTURE_FROZEN
    http_status: 409
    applies_to: "POST /regions/{id}/members, POST /regions/{id}/care-sites, POST /care-sites/{id}/staffing, POST /care-sites/{id}/departments, POST /care-sites/{id}/providers, POST /providers/{id}/compensation-model, POST /regions/{id}/capacity-plans, POST /capacity-plans/{id}/activate, POST /capacity-plans/{id}/adjust, POST /referrals, POST /appointments, POST /regions/{id}/outside-service-claims"

  - priority: 11a
    category: business_constraint
    check: "A region may hold only one QualityMetric per (metric_code, period) pair; a second metric for the same pair is rejected"
    error_id: ERR_DUPLICATE_QUALITY_METRIC
    http_status: 409
    applies_to: "POST /regions/{id}/quality-metrics"

  - priority: 12a
    category: business_constraint
    check: "A department may hold only one CapacityPlan per period; a second plan for the same (department_id, period) pair is rejected"
    error_id: ERR_DUPLICATE_CAPACITY_PLAN
    http_status: 409
    applies_to: "POST /regions/{id}/capacity-plans"

  - priority: 12b
    category: business_constraint
    check: "A provider may not hold two non-cancelled appointments on the same calendar day whose [start_utc, start_utc + duration_minutes) instants intersect"
    error_id: ERR_PROVIDER_SCHEDULE_OVERLAP
    http_status: 409
    applies_to: "POST /appointments"

  - priority: 13
    category: business_constraint
    check: "Department appointment supply may not be over-committed: Department.appointment_slots_committed + 1 must not exceed Department.appointment_slots_budgeted, and Department.status must not be CLOSED"
    error_id: ERR_DEPARTMENT_CAPACITY_EXHAUSTED
    http_status: 409
    applies_to: "POST /appointments"

  - priority: 14
    category: business_constraint
    check: "Site staffing may not exceed the site's own budgeted full-time-equivalent headcount: staffing_fte_filled must not exceed staffing_fte_budget"
    error_id: ERR_FTE_BUDGET_EXCEEDED
    http_status: 409
    applies_to: "POST /care-sites/{id}/staffing"

  - priority: 15
    category: business_fiscal
    check: "The region's approved fiscal line must hold: staffing_and_facility_cents must not exceed the staffing_budget_cents of the region's latest RegionalBudget, and a booking is rejected when staffing_and_facility_cents is at or above that line and the latest RegionalBudget is not APPROVED"
    error_id: ERR_BUDGET_FISCAL_LINE_EXCEEDED
    http_status: 402
    applies_to: "POST /care-sites/{id}/staffing, POST /appointments, POST /regions/{id}/outside-service-claims, POST /regions/{id}/members"

# =============================================================================
# §1.5 API Endpoint Table (36 endpoints)
# =============================================================================
endpoints:
  # --- Region ---
  - method: POST
    path: "/regions"
    description: "Create an operating Region"
    roles: [PlatformAdmin]
    code: 201
    input: [name, state_codes, margin_target_pct, "capitation_index?"]
    output: Region
    side_effects: ["posture initialized to OPEN", "premium_revenue_cents initialized to 0", "operating_margin_cents initialized to 0"]

  - method: GET
    path: "/regions"
    description: "List operating Regions"
    roles: [PlatformAdmin, RegionalFinanceOfficer, AccessScheduler, UtilizationReviewer, QualityReviewBoard, BudgetAppropriationsCommittee, CareTeamMember, Provider]
    code: 200
    input: ["posture?", "state_code?", "limit?", "offset?"]
    output: "Region[]"
    side_effects: []

  - method: GET
    path: "/regions/{id}"
    description: "Get one Region with its computed operating aggregates"
    roles: [PlatformAdmin, RegionalFinanceOfficer, AccessScheduler, UtilizationReviewer, QualityReviewBoard, BudgetAppropriationsCommittee, CareTeamMember, Provider]
    code: 200
    input: []
    output: Region
    side_effects: []

  # --- Member ---
  - method: POST
    path: "/regions/{id}/members"
    description: "Enroll a Member into a Region; recomputes capitation and region revenue"
    roles: [RegionalFinanceOfficer]
    code: 201
    input: [member_ref, "attributed_provider_id?", plan_product, benefit_tier, risk_score, coverage_effective_date]
    output: Member
    side_effects:
      - "capitation_rate_cents computed by the capitation_rate_cents rule"
      - "status initialized to ACTIVE"
      - "the parent Region's premium_revenue_cents, member_count and operating_margin_cents recomputed"
      - "every ACTIVE Provider in the region has panel_size_assigned, quality_bonus_cents and comp_total_cents recomputed"
      - "increments Region.version by 1, and increments the version of every recomputed Provider"

  - method: GET
    path: "/regions/{id}/members"
    description: "List the Members of a Region"
    roles: [PlatformAdmin, RegionalFinanceOfficer, AccessScheduler, UtilizationReviewer, QualityReviewBoard, BudgetAppropriationsCommittee, CareTeamMember, Provider]
    code: 200
    input: ["status?", "plan_product?", "limit?", "offset?"]
    output: "Member[]"
    side_effects: []

  - method: GET
    path: "/members/{id}"
    description: "Get one Member"
    roles: [PlatformAdmin, RegionalFinanceOfficer, AccessScheduler, UtilizationReviewer, QualityReviewBoard, BudgetAppropriationsCommittee, CareTeamMember, Provider]
    code: 200
    input: []
    output: Member
    side_effects: []

  - method: POST
    path: "/members/{id}/terminate"
    description: "Terminate a Member's coverage; recomputes region revenue"
    roles: [RegionalFinanceOfficer]
    code: 200
    input: ["expected_member_version"]
    output: Member
    side_effects:
      - "status -> TERMINATED"
      - "the parent Region's premium_revenue_cents, member_count and operating_margin_cents recomputed"
      - "increments Member.version by 1 and Region.version by 1"

  - method: PATCH
    path: "/members/{id}"
    description: "Correct a member's risk score; recomputes capitation and the region's forward margin"
    roles: [RegionalFinanceOfficer]
    code: 200
    input: [risk_score, expected_member_version]
    output: Member
    side_effects:
      - "capitation_rate_cents recomputed by the capitation_rate_cents rule"
      - "the parent Region's premium_revenue_cents, computed_margin_cents and operating_margin_cents recomputed"
      - "increments Member.version by 1 and Region.version by 1"

  # --- CareSite ---
  - method: POST
    path: "/regions/{id}/care-sites"
    description: "Open a CareSite funded by a Region's operating budget"
    roles: [RegionalFinanceOfficer]
    code: 201
    input: [site_name, site_type, licensed_beds, staffing_fte_budget, facility_investment_budget_cents]
    output: CareSite
    side_effects: ["staffing_fte_filled initialized to 0", "facility_investment_spent_cents initialized to 0", "the parent Region's operating_margin_cents recomputed", "increments Region.version by 1"]

  - method: GET
    path: "/regions/{id}/care-sites"
    description: "List the CareSites of a Region"
    roles: [PlatformAdmin, RegionalFinanceOfficer, AccessScheduler, UtilizationReviewer, QualityReviewBoard, BudgetAppropriationsCommittee, CareTeamMember, Provider]
    code: 200
    input: ["site_type?", "limit?", "offset?"]
    output: "CareSite[]"
    side_effects: []

  - method: POST
    path: "/care-sites/{id}/staffing"
    description: "Set filled staffing full-time-equivalents for a CareSite"
    roles: [RegionalFinanceOfficer]
    code: 200
    input: [staffing_fte_filled]
    output: CareSite
    side_effects: ["the parent Region's staffing_and_facility_cents and operating_margin_cents recomputed", "increments CareSite.version by 1 and Region.version by 1"]

  # --- Department ---
  - method: POST
    path: "/care-sites/{id}/departments"
    description: "Open a clinical Department inside a CareSite"
    roles: [AccessScheduler]
    code: 201
    input: [specialty, appointment_slots_budgeted, wait_threshold_days]
    output: Department
    side_effects: ["appointment_slots_committed initialized to 0", "accepting_internal_referrals initialized to true", "status initialized to OPEN"]

  - method: GET
    path: "/care-sites/{id}/departments"
    description: "List the Departments of a CareSite"
    roles: [PlatformAdmin, RegionalFinanceOfficer, AccessScheduler, UtilizationReviewer, QualityReviewBoard, BudgetAppropriationsCommittee, CareTeamMember, Provider]
    code: 200
    input: ["specialty?", "status?", "accepting_internal_referrals?", "limit?", "offset?"]
    output: "Department[]"
    side_effects: []

  - method: PATCH
    path: "/departments/{id}"
    description: "Adjust a Department's capacity flags"
    roles: [AccessScheduler]
    code: 200
    input: ["accepting_internal_referrals?", "wait_threshold_days?", "status?"]
    output: Department
    side_effects: ["status may be written to any of OPEN, CONSTRAINED or CLOSED; CLOSED stops the department accepting new bookings", "recomputes the parent Region's capacity_committed_appointments", "increments Department.version by 1"]

  # --- Provider ---
  - method: POST
    path: "/care-sites/{id}/providers"
    description: "Register a Provider at a CareSite under a compensation arrangement"
    roles: [RegionalFinanceOfficer]
    code: 201
    input: [provider_name, specialty, compensation_model, base_component_cents, panel_size_target]
    output: Provider
    side_effects: ["volume_component_cents pinned to 0", "panel_size_assigned recomputed from the region's member population", "comp_total_cents computed", "the parent Region's employed_delivery_cost_cents and operating_margin_cents recomputed", "increments Region.version by 1"]

  - method: GET
    path: "/care-sites/{id}/providers"
    description: "List the Providers of a CareSite"
    roles: [PlatformAdmin, RegionalFinanceOfficer, AccessScheduler, UtilizationReviewer, QualityReviewBoard, BudgetAppropriationsCommittee, CareTeamMember, Provider]
    code: 200
    input: ["specialty?", "status?", "limit?", "offset?"]
    output: "Provider[]"
    side_effects: []

  - method: GET
    path: "/providers/{id}"
    description: "Get one Provider with its compensation breakdown"
    roles: [PlatformAdmin, RegionalFinanceOfficer, AccessScheduler, UtilizationReviewer, QualityReviewBoard, BudgetAppropriationsCommittee, CareTeamMember, Provider]
    code: 200
    input: []
    output: Provider
    side_effects: []

  - method: PATCH
    path: "/providers/{id}/compensation-model"
    description: "Change a Provider's compensation model; dismantles any volume-linked component"
    roles: [RegionalFinanceOfficer]
    code: 200
    input: [compensation_model, base_component_cents, panel_size_target]
    output: Provider
    side_effects: ["volume_component_cents pinned to 0 under every model", "panel_capitation_component_cents recomputed from panel_size_assigned", "quality_bonus_cents recomputed", "comp_total_cents recomputed", "the parent Region's employed_delivery_cost_cents and operating_margin_cents recomputed", "increments Provider.version by 1 and Region.version by 1"]

  # --- NetworkService ---
  - method: POST
    path: "/regions/{id}/network-services"
    description: "Declare a network service and its availability in a Region"
    roles: [AccessScheduler]
    code: 201
    input: [service_code, service_name, availability_status, capacity_note]
    output: NetworkService
    side_effects: ["available_provider_count recomputed from the region's ACTIVE Providers"]

  - method: GET
    path: "/regions/{id}/network-services"
    description: "List the NetworkServices of a Region"
    roles: [PlatformAdmin, RegionalFinanceOfficer, AccessScheduler, UtilizationReviewer, QualityReviewBoard, BudgetAppropriationsCommittee, CareTeamMember, Provider]
    code: 200
    input: ["availability_status?", "limit?", "offset?"]
    output: "NetworkService[]"
    side_effects: []

  # --- Appointment ---
  - method: POST
    path: "/appointments"
    description: "Book an Appointment slot for a Member in a Department"
    roles: [AccessScheduler]
    code: 201
    input: ["department_id", "provider_id", "member_id", "referral_id?", "appointment_type", "start_utc", "duration_minutes", "expected_member_version"]
    output: Appointment
    side_effects:
      - "fulfillment_status -> SCHEDULED, wait_days / access_status / hold_status computed"
      - "Department.appointment_slots_committed incremented by 1"
      - "the parent Department's status may move OPEN -> CONSTRAINED when committed reaches budgeted"
      - "a Referral in AUTHORIZED status moves to SCHEDULED"
      - "increments Member.version by 1, Referral.version by 1 and Department.version by 1"

  - method: GET
    path: "/appointments"
    description: "List Appointments with filters"
    roles: [PlatformAdmin, RegionalFinanceOfficer, AccessScheduler, UtilizationReviewer, QualityReviewBoard, BudgetAppropriationsCommittee, CareTeamMember, Provider]
    code: 200
    input: ["department_id?", "member_id?", "provider_id?", "referral_id?", "fulfillment_status?", "access_status?", "limit?", "offset?"]
    output: "Appointment[]"
    side_effects: []

  - method: GET
    path: "/appointments/{id}"
    description: "Get one Appointment"
    roles: [PlatformAdmin, RegionalFinanceOfficer, AccessScheduler, UtilizationReviewer, QualityReviewBoard, BudgetAppropriationsCommittee, CareTeamMember, Provider]
    code: 200
    input: []
    output: Appointment
    side_effects: []

  - method: POST
    path: "/appointments/{id}/cancel"
    description: "Cancel an Appointment and release its slot"
    roles: [AccessScheduler]
    code: 200
    input: []
    output: Appointment
    side_effects:
      - "fulfillment_status -> CANCELLED"
      - "Department.appointment_slots_committed decremented by 1"
      - "a Referral in SCHEDULED status reverts to AUTHORIZED"
      - "increments Appointment.version by 1 and Department.version by 1"

  - method: POST
    path: "/appointments/{id}/complete"
    description: "Mark an Appointment delivered and close any linked Referral"
    roles: [CareTeamMember]
    code: 200
    input: []
    output: Appointment
    side_effects:
      - "fulfillment_status -> COMPLETED"
      - "a Referral in SCHEDULED status moves to COMPLETED"
      - "the parent Region's access_breach_pct recomputed"
      - "increments Appointment.version by 1 and Referral.version by 1"

  # --- Referral ---
  - method: POST
    path: "/referrals"
    description: "Raise a referral; resolves the in-network target department or requires an outside-network exception"
    roles: [AccessScheduler]
    code: 201
    input: [member_id, requesting_department_id, target_department_id, service_code, referral_type, authorization_exception, exception_reason, external_contract_count, expected_member_version]
    output: Referral
    side_effects:
      - "status initialized to PENDING_TRIAGE"
      - "appeal_rounds initialized to 0"
      - "increments Member.version by 1"

  - method: GET
    path: "/referrals"
    description: "List Referrals with filters"
    roles: [PlatformAdmin, RegionalFinanceOfficer, AccessScheduler, UtilizationReviewer, QualityReviewBoard, BudgetAppropriationsCommittee, CareTeamMember, Provider]
    code: 200
    input: ["member_id?", "target_department_id?", "requesting_department_id?", "status?", "limit?", "offset?"]
    output: "Referral[]"
    side_effects: []

  - method: GET
    path: "/referrals/{id}"
    description: "Get one Referral"
    roles: [PlatformAdmin, RegionalFinanceOfficer, AccessScheduler, UtilizationReviewer, QualityReviewBoard, BudgetAppropriationsCommittee, CareTeamMember, Provider]
    code: 200
    input: []
    output: Referral
    side_effects: []

  - method: POST
    path: "/referrals/{id}/authorize"
    description: "Authorize a referral, including from the appeal loop"
    roles: [UtilizationReviewer]
    code: 200
    input: []
    output: Referral
    side_effects: ["status -> AUTHORIZED", "effective_decision_at set to the logical clock", "expires_at set to created_at + 90 days", "increments Referral.version by 1"]

  - method: POST
    path: "/referrals/{id}/deny"
    description: "Deny a referral, including from the appeal loop"
    roles: [UtilizationReviewer]
    code: 200
    input: []
    output: Referral
    side_effects: ["status -> DENIED", "effective_decision_at set to the logical clock", "Appointments holding a REFERRAL_HOLD for this referral release the hold", "increments Referral.version by 1"]

  - method: POST
    path: "/referrals/{id}/appeal"
    description: "Open an appeal round on a denied referral"
    roles: [UtilizationReviewer]
    code: 200
    input: []
    output: Referral
    side_effects: ["status -> APPEALED", "appeal_rounds incremented by 1", "increments Referral.version by 1"]

  # --- OutsideServiceClaim ---
  - method: POST
    path: "/regions/{id}/outside-service-claims"
    description: "Submit an outside-service claim; books provisional liability against the region's outside-services budget"
    roles: [RegionalFinanceOfficer]
    code: 201
    input: [member_id, vendor_name, service_code, claim_type, emergency_flag, billed_amount_cents, provider_type, claim_line_number, emergency_inject_once, derived_claim_type, expected_member_version]
    output: OutsideServiceClaim
    side_effects:
      - "provisional_liability_cents computed by the outside_services_liability rule using billed_amount_cents"
      - "claim_line_number, provider_type and derived_claim_type determine which claim line supplies ANNUAL_DEDUCTIBLE_CENTS consumption"
      - "status initialized to SUBMITTED, or PENDED when the region's outside_services_committed_cents already exceeds its budget line"
      - "increments Member.version by 1"

  - method: GET
    path: "/regions/{id}/outside-service-claims"
    description: "List the outside-service claims of a Region"
    roles: [PlatformAdmin, RegionalFinanceOfficer, UtilizationReviewer, BudgetAppropriationsCommittee]
    code: 200
    input: ["status?", "claim_type?", "limit?", "offset?"]
    output: "OutsideServiceClaim[]"
    side_effects: []

  - method: POST
    path: "/outside-service-claims/{id}/adjudicate"
    description: "Adjudicate a claim, pinning its final liability"
    roles: [RegionalFinanceOfficer]
    code: 200
    input: []
    output: OutsideServiceClaim
    side_effects:
      - "final_liability_cents computed by the outside_services_liability rule"
      - "status -> ADJUDICATED"
      - "adjudicated_at set to the logical clock"
      - "the parent Region's outside_services_spend_cents and operating_margin_cents recomputed"
      - "the region's outside_services_committed_cents recomputed"
      - "increments OutsideServiceClaim.version by 1 and Region.version by 1"

  - method: POST
    path: "/outside-service-claims/{id}/pay"
    description: "Pay an adjudicated claim"
    roles: [RegionalFinanceOfficer]
    code: 200
    input: []
    output: OutsideServiceClaim
    side_effects: ["status -> PAID", "increments OutsideServiceClaim.version by 1"]

  - method: POST
    path: "/outside-service-claims/{id}/deny"
    description: "Deny an adjudicated claim or an appeal; reverses any booked liability"
    roles: [UtilizationReviewer]
    code: 200
    input: []
    output: OutsideServiceClaim
    side_effects: ["status -> DENIED", "the booked final_liability_cents is reversed out of the region's outside_services_spend_cents and committed total", "increments OutsideServiceClaim.version by 1 and Region.version by 1"]

  - method: POST
    path: "/outside-service-claims/{id}/appeal"
    description: "Open an appeal round on a denied claim"
    roles: [UtilizationReviewer]
    code: 200
    input: []
    output: OutsideServiceClaim
    side_effects: ["status -> APPEALED", "appeal_rounds incremented by 1", "increments OutsideServiceClaim.version by 1"]

  # --- RegionalBudget ---
  - method: POST
    path: "/regions/{id}/regional-budgets"
    description: "Open an operating budget for a region and period"
    roles: [RegionalFinanceOfficer]
    code: 201
    input: [period, staffing_budget_cents, outside_services_budget_cents, facility_investment_cents, system_deductible_cents]
    output: RegionalBudget
    side_effects: ["premium_revenue_cents and employed_delivery_cost_cents snapshotted from the Region", "outside_services_committed_cents computed from the region's booked claims", "operating_margin_cents computed", "division_deductible_cents and division_deductible_original_cents initialized from system_deductible_cents", "status initialized to DRAFT"]

  - method: GET
    path: "/regions/{id}/regional-budgets"
    description: "List the operating budgets of a Region"
    roles: [PlatformAdmin, RegionalFinanceOfficer, BudgetAppropriationsCommittee]
    code: 200
    input: ["period?", "status?", "limit?", "offset?"]
    output: "RegionalBudget[]"
    side_effects: []

  - method: GET
    path: "/regional-budgets"
    description: "List regional operating budgets across all regions"
    roles: [PlatformAdmin, BudgetAppropriationsCommittee]
    code: 200
    input: ["region_id?", "status?", "limit?", "offset?"]
    output: "RegionalBudget[]"
    side_effects: []

  - method: GET
    path: "/regional-budgets/{id}"
    description: "Get one RegionalBudget"
    roles: [PlatformAdmin, RegionalFinanceOfficer, BudgetAppropriationsCommittee]
    code: 200
    input: []
    output: RegionalBudget
    side_effects: []

  - method: POST
    path: "/referral-claims/bulk-adjudicate"
    description: "Adjudicate every SUBMITTED outside-service claim for one referral in a single request"
    roles: [RegionalFinanceOfficer]
    code: 200
    input: [referral_id]
    output: null
    side_effects:
      - "final_liability_cents pinned for each linked OutsideServiceClaim in SUBMITTED or APPEALED"
      - "each claim moves to ADJUDICATED"
      - "each affected Region's outside_services_spend_cents and operating_margin_cents recomputed"
      - "increments the version of every adjudicated claim and of each affected Region"

  - method: POST
    path: "/regional-budgets/{id}/submit"
    description: "Submit a budget for committee approval"
    roles: [RegionalFinanceOfficer]
    code: 200
    input: []
    output: RegionalBudget
    side_effects: ["status -> SUBMITTED", "operating_margin_cents recomputed", "the parent Region's operating_margin_cents recomputed", "increments RegionalBudget.version by 1 and Region.version by 1"]

  - method: POST
    path: "/regional-budgets/{id}/approve"
    description: "Approve a submitted budget"
    roles: [BudgetAppropriationsCommittee]
    code: 200
    input: []
    output: RegionalBudget
    side_effects: ["status -> APPROVED", "revenue and employed-delivery-cost snapshots frozen", "increments RegionalBudget.version by 1"]

  - method: POST
    path: "/regional-budgets/{id}/return"
    description: "Return a submitted budget to draft"
    roles: [BudgetAppropriationsCommittee]
    code: 200
    input: []
    output: RegionalBudget
    side_effects: ["status -> DRAFT", "increments RegionalBudget.version by 1"]

  - method: POST
    path: "/regional-budgets/{id}/close"
    description: "Close an approved budget period"
    roles: [RegionalFinanceOfficer]
    code: 200
    input: []
    output: RegionalBudget
    side_effects: ["status -> CLOSED", "increments RegionalBudget.version by 1"]

  - method: POST
    path: "/regional-budgets/{id}/reopen"
    description: "Reopen an approved or closed budget period"
    roles: [BudgetAppropriationsCommittee]
    code: 200
    input: []
    output: RegionalBudget
    side_effects: ["status -> REOPENED", "increments RegionalBudget.version by 1"]

  # --- CapacityPlan ---
  - method: POST
    path: "/regions/{id}/capacity-plans"
    description: "Budget appointment supply for a department and period"
    roles: [RegionalFinanceOfficer]
    code: 201
    input: [department_id, period, budgeted_slots, panel_target]
    output: CapacityPlan
    side_effects: ["committed_slots computed from the department's non-cancelled appointments", "supply_shortfall_slots computed", "recalculation_epoch initialized to 1", "status initialized to PLANNING", "the parent Region's capacity_budget_appointments recomputed"]

  - method: GET
    path: "/regions/{id}/capacity-plans"
    description: "List the capacity plans of a Region"
    roles: [PlatformAdmin, RegionalFinanceOfficer, AccessScheduler, BudgetAppropriationsCommittee]
    code: 200
    input: ["department_id?", "status?", "limit?", "offset?"]
    output: "CapacityPlan[]"
    side_effects: []

  - method: POST
    path: "/capacity-plans/{id}/review"
    description: "Send a capacity plan to review"
    roles: [AccessScheduler]
    code: 200
    input: []
    output: CapacityPlan
    side_effects: ["status -> UNDER_REVIEW", "increments CapacityPlan.version by 1"]

  - method: POST
    path: "/capacity-plans/{id}/activate"
    description: "Activate a reviewed capacity plan; committed appointment supply becomes binding"
    roles: [RegionalFinanceOfficer]
    code: 200
    input: []
    output: CapacityPlan
    side_effects: ["status -> ACTIVE", "committed_slots recomputed", "recalculation_epoch incremented", "the parent Region's capacity_committed_appointments recomputed", "increments CapacityPlan.version by 1 and Region.version by 1"]

  - method: POST
    path: "/capacity-plans/{id}/adjust"
    description: "Adjust the budgeted supply of an active capacity plan"
    roles: [RegionalFinanceOfficer]
    code: 200
    input: [budgeted_slots]
    output: CapacityPlan
    side_effects: ["status -> ADJUSTED", "supply_shortfall_slots recomputed", "recalculation_epoch incremented", "the parent Region's capacity_budget_appointments recomputed", "increments CapacityPlan.version by 1"]

  - method: POST
    path: "/capacity-plans/{id}/return"
    description: "Return a reviewed capacity plan to planning"
    roles: [AccessScheduler]
    code: 200
    input: []
    output: CapacityPlan
    side_effects: ["status -> PLANNING", "increments CapacityPlan.version by 1"]

  # --- MemberTransfer ---
  - method: POST
    path: "/member-transfers"
    description: "Request a transfer of a member between regions"
    roles: [RegionalFinanceOfficer]
    code: 201
    input: [member_id, from_region_id, to_region_id, effective_utc, expected_member_version]
    output: MemberTransfer
    side_effects: ["benefit_difference_cents computed", "network_difference_flag computed", "status initialized to REQUESTED", "increments Member.version by 1"]

  - method: GET
    path: "/member-transfers"
    description: "List member transfers with filters"
    roles: [PlatformAdmin, RegionalFinanceOfficer, BudgetAppropriationsCommittee]
    code: 200
    input: ["member_id?", "from_region_id?", "to_region_id?", "status?", "limit?", "offset?"]
    output: "MemberTransfer[]"
    side_effects: []

  - method: POST
    path: "/member-transfers/{id}/accept"
    description: "Accept a transfer request at the destination region"
    roles: [RegionalFinanceOfficer]
    code: 200
    input: []
    output: MemberTransfer
    side_effects: ["status -> PENDING_EFFECTIVE", "the member moves to TRANSFER_PENDING", "increments MemberTransfer.version by 1 and Member.version by 1"]

  - method: POST
    path: "/member-transfers/{id}/reject"
    description: "Reject a transfer request"
    roles: [RegionalFinanceOfficer]
    code: 200
    input: []
    output: MemberTransfer
    side_effects: ["status -> REJECTED", "the member's region of record is unchanged", "increments MemberTransfer.version by 1"]

  - method: POST
    path: "/member-transfers/{id}/complete"
    description: "Complete a transfer once its effective instant has passed"
    roles: [RegionalFinanceOfficer]
    code: 200
    input: []
    output: MemberTransfer
    side_effects:
      - "status -> COMPLETED"
      - "the member's region of record becomes the destination region"
      - "capitation_rate_cents recomputed at the destination rate"
      - "the destination region's premium_revenue_cents, member_count and operating_margin_cents recomputed"
      - "every ACTIVE Provider in the destination region has panel_size_assigned, quality_bonus_cents and comp_total_cents recomputed"
      - "the destination region's employed_delivery_cost_cents recomputed"
      - "increments MemberTransfer.version by 1, Member.version by 1 and Region.version by 1 for both regions"

  - method: POST
    path: "/member-transfers/{id}/cancel"
    description: "Cancel a transfer request"
    roles: [RegionalFinanceOfficer]
    code: 200
    input: []
    output: MemberTransfer
    side_effects: ["status -> CANCELLED", "the member returns to ACTIVE with its region of record unchanged when the transfer had not yet taken effect", "increments MemberTransfer.version by 1 and Member.version by 1"]

  # --- QualityMetric ---
  - method: POST
    path: "/regions/{id}/quality-metrics"
    description: "Open a quality/access metric for a region and period"
    roles: [QualityReviewBoard]
    code: 201
    input: [metric_code, period, target_value, accountable_provider_id]
    output: QualityMetric
    side_effects: ["status initialized to MEASURING", "measured_value initialized to 0"]

  - method: GET
    path: "/regions/{id}/quality-metrics"
    description: "List the quality metrics of a Region"
    roles: [PlatformAdmin, RegionalFinanceOfficer, QualityReviewBoard, BudgetAppropriationsCommittee]
    code: 200
    input: ["metric_code?", "period?", "status?", "limit?", "offset?"]
    output: "QualityMetric[]"
    side_effects: []

  - method: POST
    path: "/quality-metrics/{id}/finalize"
    description: "Finalize a metric; requires fully logged internal referral activity"
    roles: [QualityReviewBoard]
    code: 200
    input: []
    output: QualityMetric
    side_effects:
      - "measured_value computed (ACCESS_WAIT_DAYS uses the mean of the region's non-cancelled appointment wait_days)"
      - "weighted_component_score computed"
      - "status -> FINALIZED"
      - "a QUALITY_COMPOSITE metric writes its measured_value onto the accountable provider's quality_score and recomputes that provider's comp_total_cents"
      - "the parent Region's quality_composite_score recomputed"
      - "increments QualityMetric.version by 1, Region.version by 1 and Provider.version by 1"

  - method: POST
    path: "/quality-metrics/{id}/reopen"
    description: "Reopen a metric in remediation for re-measurement"
    roles: [QualityReviewBoard]
    code: 200
    input: []
    output: QualityMetric
    side_effects: ["status -> REOPENED", "increments QualityMetric.version by 1"]

  # --- ReferentialIntegration ---
  - method: POST
    path: "/regions/{id}/referential-integrations"
    description: "Propose a binding with an affiliated payer or delivery entity"
    roles: [BudgetAppropriationsCommittee]
    code: 201
    input: [integration_type, risk_sharing_model, bound_effective_date, cost_reporting_basis_cents, shared_savings_rate, per_diem_days, per_diem_rate_cents, per_diem_cap_cents, interim_claim_count]
    output: ReferentialIntegration
    side_effects: ["settlement_account_cents computed", "settlement_posted_cents initialized to 0", "status initialized to PROPOSED"]

  - method: GET
    path: "/regions/{id}/referential-integrations"
    description: "List the referential integrations of a Region"
    roles: [PlatformAdmin, RegionalFinanceOfficer, BudgetAppropriationsCommittee]
    code: 200
    input: ["integration_type?", "status?", "limit?", "offset?"]
    output: "ReferentialIntegration[]"
    side_effects: []

  - method: POST
    path: "/referential-integrations/{id}/bind"
    description: "Bind an integration, booking its credit against the region's forward margin"
    roles: [BudgetAppropriationsCommittee]
    code: 200
    input: []
    output: ReferentialIntegration
    side_effects: ["status -> BOUND", "Region.referential_integration_credit_cents increased by the integration credit", "Region.computed_margin_cents recomputed", "increments ReferentialIntegration.version by 1 and Region.version by 1"]

  - method: POST
    path: "/referential-integrations/{id}/enroll"
    description: "Enroll a bound integration; posts the credit and reports the remainder as outside services"
    roles: [BudgetAppropriationsCommittee]
    code: 200
    input: []
    output: ReferentialIntegration
    side_effects: ["status -> ENROLLED", "Region.premium_revenue_cents increased by settlement_posted_cents", "the region's outside_services_committed_cents increased by the unposted remainder", "increments ReferentialIntegration.version by 1 and Region.version by 1"]

  - method: POST
    path: "/referential-integrations/{id}/contract"
    description: "Contract an enrolled integration at full settlement"
    roles: [BudgetAppropriationsCommittee]
    code: 200
    input: []
    output: ReferentialIntegration
    side_effects: ["status -> CONTRACTED", "settlement_posted_cents set to settlement_account_cents", "Region.computed_margin_cents recomputed", "increments ReferentialIntegration.version by 1"]

  - method: POST
    path: "/referential-integrations/{id}/terminate"
    description: "Terminate a bound or enrolled integration and reverse its booking"
    roles: [BudgetAppropriationsCommittee]
    code: 200
    input: []
    output: ReferentialIntegration
    side_effects: ["status -> TERMINATED", "Region.referential_integration_credit_cents reduced by this integration's contribution", "Region.premium_revenue_cents reduced by settlement_posted_cents", "the region's outside_services_committed_cents reduced by the unposted remainder", "increments ReferentialIntegration.version by 1 and Region.version by 1"]

  # --- Reverse-reachability reads for flat cross-entity links ---
  - method: GET
    path: "/outside-service-claims"
    description: "List outside-service claims with filters"
    roles: [PlatformAdmin, RegionalFinanceOfficer, UtilizationReviewer, BudgetAppropriationsCommittee]
    code: 200
    input: ["member_id?", "region_id?", "status?", "limit?", "offset?"]
    output: "OutsideServiceClaim[]"
    side_effects: []

  - method: GET
    path: "/providers"
    description: "List Providers with filters"
    roles: [PlatformAdmin, RegionalFinanceOfficer, AccessScheduler, UtilizationReviewer, QualityReviewBoard, BudgetAppropriationsCommittee, CareTeamMember, Provider]
    code: 200
    input: ["care_site_id?", "region_id?", "specialty?", "limit?", "offset?"]
    output: "Provider[]"
    side_effects: []

  - method: GET
    path: "/capacity-plans"
    description: "List capacity plans with filters"
    roles: [PlatformAdmin, RegionalFinanceOfficer, AccessScheduler, BudgetAppropriationsCommittee]
    code: 200
    input: ["region_id?", "department_id?", "status?", "limit?", "offset?"]
    output: "CapacityPlan[]"
    side_effects: []

  - method: GET
    path: "/quality-metrics"
    description: "List quality metrics with filters"
    roles: [PlatformAdmin, RegionalFinanceOfficer, QualityReviewBoard, BudgetAppropriationsCommittee]
    code: 200
    input: ["region_id?", "accountable_provider_id?", "metric_code?", "status?", "limit?", "offset?"]
    output: "QualityMetric[]"
    side_effects: []

  - method: GET
    path: "/care-sites"
    description: "List CareSites with filters"
    roles: [PlatformAdmin, RegionalFinanceOfficer, AccessScheduler, UtilizationReviewer, QualityReviewBoard, BudgetAppropriationsCommittee, CareTeamMember, Provider]
    code: 200
    input: ["region_id?", "site_type?", "limit?", "offset?"]
    output: "CareSite[]"
    side_effects: []

  - method: GET
    path: "/departments"
    description: "List Departments with filters"
    roles: [PlatformAdmin, RegionalFinanceOfficer, AccessScheduler, UtilizationReviewer, QualityReviewBoard, BudgetAppropriationsCommittee, CareTeamMember, Provider]
    code: 200
    input: ["care_site_id?", "region_id?", "specialty?", "limit?", "offset?"]
    output: "Department[]"
    side_effects: []

  - method: POST
    path: "/referrals/{id}/capacity-plans"
    description: "Budget appointment supply for the referral's target department and a period"
    roles: [AccessScheduler]
    code: 201
    input: [period, budgeted_slots, panel_target]
    output: CapacityPlan
    side_effects: ["creates a CapacityPlan whose department_id is this referral's target_department_id and whose status is PLANNING", "committed_slots and supply_shortfall_slots computed", "the parent region's capacity_budget_appointments recomputed"]

  - method: POST
    path: "/provider-compensation-plans"
    description: "Draft a compensation plan that ties a quality bonus to a quality target without any procedure-volume component"
    roles: [RegionalFinanceOfficer]
    code: 201
    input: [provider_id, base_component_cents, panel_size_target, bonus_quality_target, volume_linked]
    output: null
    side_effects: ["a plan with volume_linked == true is recorded and rejected with ERR_VOLUME_COMPONENT_NOT_PERMITTED; a plan with volume_linked == false is recorded as DRAFT"]

  - method: POST
    path: "/_inject/member-risk-score"
    description: "Test-driving endpoint: set a member's risk_score directly and recompute only the region's forward margin variant"
    roles: [PlatformAdmin]
    code: 200
    input: [member_id, risk_score]
    output: Member
    side_effects: ["Member.risk_score set to the supplied value", "the parent Region's computed_margin_cents recomputed from the new risk_score", "the persisted Member.capitation_rate_cents and Region.premium_revenue_cents are NOT changed, so the settled margin is unchanged"]

  # --- AlertNotification ---
  - method: GET
    path: "/regions/{id}/alerts"
    description: "List the alerts raised against a Region"
    roles: [PlatformAdmin, RegionalFinanceOfficer, AccessScheduler, UtilizationReviewer, QualityReviewBoard, BudgetAppropriationsCommittee, CareTeamMember, Provider]
    code: 200
    input: ["alert_type?", "severity?", "status?", "limit?", "offset?"]
    output: "AlertNotification[]"
    side_effects: []

  - method: POST
    path: "/alerts/{id}/acknowledge"
    description: "Acknowledge a raised alert"
    roles: [RegionalFinanceOfficer]
    code: 200
    input: []
    output: AlertNotification
    side_effects: ["status -> ACKNOWLEDGED", "the parent Region's open_alert_count recomputed", "increments AlertNotification.version by 1"]

  # --- Single-resource reads completing reverse reachability ---
  - method: GET
    path: "/members"
    description: "List Members across regions with filters"
    roles: [PlatformAdmin, RegionalFinanceOfficer, AccessScheduler, UtilizationReviewer, QualityReviewBoard, BudgetAppropriationsCommittee, CareTeamMember, Provider]
    code: 200
