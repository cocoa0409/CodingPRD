            - "RouteValuation.${val_t1}.weighted_avg_account_age_months == 30"
            - "RouteValuation.${val_t1}.base_multiple == 10.0"
            - "RouteValuation.${val_t1}.age_adjustment == 0.0"
            - "RouteValuation.${val_t1}.effective_multiple == 10.0"
            - "RouteValuation.${val_t1}.valuation_cents == 300000"
            - "RouteValuation.${val_t2}.recurring_mrr_cents == 29999"
            - "RouteValuation.${val_t2}.weighted_avg_account_age_months == 30"
            - "RouteValuation.${val_t2}.base_multiple == 9.0"
            - "RouteValuation.${val_t2}.age_adjustment == 0.0"
            - "RouteValuation.${val_t2}.effective_multiple == 9.0"
            - "RouteValuation.${val_t2}.valuation_cents == 269991"
            - "a 1-cent drop in recurring_mrr_cents costs 30009 cents of valuation because it crosses MRR_TIER_1_CENTS, not because of any age change"
            - "RouteValuation.${val_t3}.recurring_mrr_cents == 100000"
            - "RouteValuation.${val_t3}.weighted_avg_account_age_months == 17"
            - "RouteValuation.${val_t3}.base_multiple == 11.0"
            - "RouteValuation.${val_t3}.age_adjustment == -1.0"
            - "RouteValuation.${val_t3}.effective_multiple == 10.0"
            - "RouteValuation.${val_t3}.valuation_cents == 1000000"
            - "RouteValuation.${val_t1}.effective_multiple == RouteValuation.${val_t3}.effective_multiple even though their base_multiple values differ by 1.0 - the age band cancels the tier"
            - "RouteValuation.${val_t1}.repair_component_cents == 0 and RouteValuation.${val_t2}.repair_component_cents == 0 and RouteValuation.${val_t3}.repair_component_cents == 0"

      - name: verification_rounds_each_month_before_averaging
