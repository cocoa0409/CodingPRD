  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: cold_chain_failure_precedes_capacity_overrun_on_fresh_order
        grounds:
          - validations[priority=8]
          - validations[priority=10]
          - errors[ERR_COLD_CHAIN_BROKEN]
          - errors[ERR_WINDOW_CAPACITY_EXCEEDED]
          - endpoints.POST_/franchise/fresh-orders
        distinguishing_aspect: |
          The `business_temporal` vs `business_safety` error-category pair: a fresh order that is BOTH
          over the window's remaining capacity AND placed from a store whose cold-chain certificate is
          missing fails first on the safety check at priority 8 and returns ERR_COLD_CHAIN_BROKEN,
          never the capacity error at priority 10.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T12:00:00Z. One franchisee with an ACTIVE store whose cold_chain_certified is FALSE, and a SCHEDULED delivery window with capacity_units 500."
          setup_api_calls:
            - call: "POST /franchise/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T12:00:00Z" }
              as: FranchisorAdmin
            - call: "POST /franchise/franchisees"
              payload: { legal_name: "Delta Fresh LLC", owner_name: "Nora Ballard", entity_type: "LLC", stated_net_worth_cents: 30000000 }
              as: FranchisorAdmin
              captures: { fI_id: $.data.id }
            - call: "POST /franchise/stores"
              payload: { franchisee_id: "${fI_id}", store_number: "MS-4400", state_code: "MS", format: "RURAL", opened_on: "2024-04-01T00:00:00Z", cold_chain_certified: false }
              as: FranchisorAdmin
              captures: { stI_id: $.data.id }
            - call: "POST /franchise/delivery-windows"
              payload: { store_id: "${stI_id}", commissary_code: "COMM-MS-1", day_of_week: "THU", window_start: "2026-09-10T06:00:00Z", window_end: "2026-09-10T10:00:00Z", capacity_units: 500 }
              as: FranchisorAdmin
              captures: { dwI_id: $.data.id }
          trigger:
            - call: "POST /franchise/fresh-orders"
              payload: { store_id: "${stI_id}", delivery_window_id: "${dwI_id}", sku_code: "SKU-X", ordered_units: 5000, unit_cost_cents: 250 }
              as: Franchisee
              as_user_id: "${fI_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 409 and err_id == ERR_COLD_CHAIN_BROKEN"
            - "err_id != ERR_WINDOW_CAPACITY_EXCEEDED"
            - "GET /fresh-orders?store_id=${stI_id} returns 0 rows and DeliveryWindow.${dwI_id}.reserved_units == 0"
            - "the request violated BOTH the priority-8 safety rule and the priority-10 capacity rule, and the lower priority number won"

      - name: stated_net_worth_failure_precedes_store_not_active_on_agreement_activate
        grounds:
          - validations[priority=18]
          - validations[priority=32]
          - errors[ERR_MIN_NET_WORTH_NOT_MET]
          - errors[ERR_STORE_NOT_ACTIVE]
          - endpoints.POST_/franchise/agreements/{id}/activate
        distinguishing_aspect: |
          The `business_fiscal` vs `business_referential` error-category pair — a DIFFERENT pair from the
          temporal/safety instance: an agreement whose covering store is TERMINATED and whose franchisee
          states less than the agreement minimum is stopped by the fiscal rule at priority 18 and returns
          ERR_MIN_NET_WORTH_NOT_MET, not the referential store-state rule at priority 32.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T12:00:00Z. One franchisee stating only 5000000 cents, whose store was cascaded to TERMINATED when that franchisee was itself terminated, and a freshly drafted agreement on that TERMINATED store carrying minimum_net_worth_cents 10000000."
          setup_api_calls:
            - call: "POST /franchise/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T12:00:00Z" }
              as: FranchisorAdmin
            - call: "POST /franchise/franchisees"
              payload: { legal_name: "Tombigbee Operator LLC", owner_name: "Greg Halloran", entity_type: "LLC", stated_net_worth_cents: 5000000 }
              as: FranchisorAdmin
              captures: { fK_id: $.data.id }
            - call: "POST /franchise/stores"
              payload: { franchisee_id: "${fK_id}", store_number: "AL-7001", state_code: "AL", format: "RURAL", opened_on: "2023-01-01T00:00:00Z", cold_chain_certified: true }
              as: FranchisorAdmin
              captures: { stK_id: $.data.id }
            - call: "POST /franchise/franchisees/${fK_id}/terminate"
              payload: {}
              as: FranchisorAdmin
            - call: "POST /franchise/agreements"
              payload: { franchisee_id: "${fK_id}", store_id: "${stK_id}", split_pct: 0.50, waste_share_pct: 0.50, shrink_responsibility_pct: 0.50, rebate_pass_pct: 1.0, minimum_net_worth_cents: 10000000, term_start: "2026-09-01T00:00:00Z", term_end: "2031-09-01T00:00:00Z", renewal_window_days: 90 }
              as: FranchisorAdmin
              captures: { agK_id: $.data.id }
          trigger:
            - call: "POST /franchise/agreements/${agK_id}/activate"
              payload: {}
              as: FranchisorAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 409 and err_id == ERR_MIN_NET_WORTH_NOT_MET"
            - "err_id != ERR_STORE_NOT_ACTIVE"
            - "FranchiseAgreement.${agK_id}.status is still DRAFT"
            - "Store.${stK_id}.status == TERMINATED and the request violated BOTH the priority-18 fiscal rule and the priority-32 store-state rule, and the fiscal rule won on ordering"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: settlement_gross_profit_exactly_20000000_earns_the_high_tier_bonus
        grounds:
          - calculations.gross_profit_split
          - entities.Settlement.fields.eligible_split_pct
          - entities.Settlement.fields.gross_profit_cents
          - endpoints.POST_/franchise/settlements/{id}/reconcile
        distinguishing_aspect: |
          A numeric threshold crossing on the settlement split base, reachable through
          POST /settlements/{id}/reconcile: the tier_bonus uses `>=`, so gross_profit_cents of exactly
