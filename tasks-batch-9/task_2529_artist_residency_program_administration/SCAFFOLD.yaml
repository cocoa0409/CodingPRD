scenario: "Generate task harder than expert level!\n\n2529. Artist Residency Program Administration (artist residency organization): application cycle with discipline categories, portfolio requirements and fee waivers, selection panel review with scoring rubrics, conflict declarations and cohort balance considerations, residency scheduling with session lengths, studio assignment and facility capability matching, housing, meal and stipend administration with tax reporting on stipends, visa sponsorship for international residents with timeline management, studio safety, equipment training and material handling requirements, open studio, exhibition and community engagement obligations, alumni network, follow-on opportunities and outcome tracking for funders"

domain_name: artist-residency-program-administration
api_prefix: ""           # flat top-level collections, e.g.: /cycles, /applications, /residencies

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

complexity_profile:
  primary_archetype: multi_party_negotiation
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - selector_policy

  entity_topology: flat
  # Every entity is a peer addressed at a top-level collection (/cycles, /applications,
  # /residencies, /studios, ...). Ownership is expressed only through FK fields in request
  # bodies and filtered-list query parameters; the only nested URLs are read sub-resources
  # and action verbs on a single resource. No entity is reachable solely through a parent path.

  state_machine_shape: cyclic
  # Application loops SUBMITTED -> REVISION_REQUESTED -> SUBMITTED (bounded at 2 rounds);
  # VisaCase loops DOCS_SUBMITTED -> DOCS_REQUESTED -> DOCS_SUBMITTED (request-for-evidence
  # rounds); Residency carries two independent state axes (status x compliance_status) where
  # the compliance axis itself cycles CLEARED <-> SUSPENDED.

  relationship_patterns:
    - one_to_many          # Cycle -> Discipline/Application/Residency; Residency -> Obligation/StipendDisbursement
    - many_to_many         # PanelAssignment is the Application x Panelist junction
    - self_referential     # Residency.predecessor_residency_id -> Residency.id (alumni follow-on chain)
    - cross_aggregate      # StudioAssignment/HousingAssignment bridge the facility aggregate and the residency aggregate

  role_model: segregation_of_duties
  # A Panelist who scored (or declared a conflict on) any application in a cycle may not act
  # as the PanelChair who locks that cycle's slate; the FinanceOfficer who generated a stipend
  # schedule may not be the FinanceOfficer who marks its disbursements PAID.

  consistency_model: immediate

difficulty_level: expert_plus
# 15 entities / 72 endpoints / 74 error codes / 11 calculations (3 carrying divergent variants,
# 6 variants total) / 71 ordered validations / 10 state machines across 9 entities (Residency carries
# two parallel axes; the Application and VisaCase machines and the Residency compliance axis are
# cyclic; the Cycle machine is compound, guarded by children-derived predicates) / 3 OCC races /
# 3 multi-level cascades (depths 4, 5 and 4) / 8 roles under segregation of duties.

constants:
  HOST_COUNTRY: "US"
  RUBRIC_WEIGHT_ARTISTIC_MERIT: 35
  RUBRIC_WEIGHT_FEASIBILITY: 27
  RUBRIC_WEIGHT_COMMUNITY_FIT: 23
  RUBRIC_WEIGHT_TECHNICAL_READINESS: 15
  RUBRIC_SCORE_MIN: 0
  RUBRIC_SCORE_MAX: 10
  EXPERTISE_MATCH_MULTIPLIER: 1.00
  EXPERTISE_MISMATCH_MULTIPLIER: 0.90
  TRIM_MIN_PANELISTS: 4
  MAX_REVISION_ROUNDS: 2
  FEE_WAIVER_INCOME_CEILING_CENTS: 3500000
  MIN_SESSION_WEEKS: 4
  MAX_SESSION_WEEKS: 16
  STIPEND_PERIOD_WEEKS: 2
  WITHHOLDING_EXEMPT_THRESHOLD_CENTS: 60000
  NRA_WITHHOLDING_RATE: 0.30
  TREATY_WITHHOLDING_RATE: 0.15
  VISA_LEAD_DAYS: 90
  VISA_EARLIEST_ENTRY_LEAD_DAYS: 30
  VISA_BACKLOG_DAYS_DEFAULT: 21
  VISA_BACKLOG_DAYS_HIGH_VOLUME: 45
  HIGH_VOLUME_VISA_COUNTRIES: ["IN", "CN", "NG", "BR"]
  VISA_J1_MIN_SESSION_WEEKS: 9
  STUDIO_TURNAROUND_DAYS: 2
  VENTILATION_RANK: { NONE: 0, LOCAL: 1, FUME_HOOD: 2 }
  OBLIGATION_BASE_OPEN_STUDIO: 1
  OBLIGATION_BASE_EXHIBITION: 1
  OBLIGATION_BASE_ARTIST_TALK: 1
  OBLIGATION_WORKSHOP_WEEKS_PER_UNIT: 4
  DEFAULT_CLOCK_UTC: "2026-08-01T00:00:00Z"

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: Cycle
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: human-readable cycle code
        constraints: "unique across Cycle; 1-32 chars"
      - name: open_at
        type: datetime
        source: input
        description: inclusive start of the application submission window (ISO 8601 UTC)
      - name: close_at
        type: datetime
        source: input
        description: inclusive end of the application submission window (ISO 8601 UTC)
        constraints: "must be strictly after open_at"
      - name: application_fee_cents
        type: integer
        source: input
        description: fee charged per application unless waived
        constraints: ">= 0"
      - name: panel_quorum
        type: integer
        source: input
        description: minimum number of PanelAssignment rows in status SCORED before an Application may become SCORED
        constraints: ">= 2"
      - name: cohort_target_size
        type: integer
        source: input
        description: total number of residency slots the cycle awards
        constraints: ">= 1"
      - name: alumni_reserve_pct
        type: number
        source: input
        description: fraction of cohort_target_size reserved for returning alumni during slate allocation
        constraints: "0 <= alumni_reserve_pct <= 1; at most 2 decimal places"
      - name: stipend_pool_cents
        type: integer
        source: input
        description: total stipend money the funder awarded to this cycle
        constraints: ">= 0"
      - name: slate_min_score
        type: number
        source: input
        description: minimum Application.final_panel_score required to enter the slate candidate pool
        constraints: "0.00 <= slate_min_score <= 100.00, 2 decimal places"
      - name: stipend_weekly_rate_cents
        type: integer
        source: input
        description: default weekly stipend rate applied to residencies of this cycle
        constraints: ">= 0"
      - name: session_length_options_weeks
        type: array
        source: input
        description: allowed session lengths in whole weeks
        constraints: "non-empty array of integers, each in [MIN_SESSION_WEEKS, MAX_SESSION_WEEKS]"
      - name: status
        type: enum
        source: system
        description: cycle stage
        default: DRAFT
        constraints: "one of {DRAFT, OPEN, SCREENING, PANEL_REVIEW, SLATE_LOCKED, CLOSED}"
      - name: stipend_committed_cents
        type: integer
        source: computed
        description: "ledger of stipend money bound to live residencies; see calculations.cycle_stipend_ledger"
        default: 0
      - name: stipend_uncommitted_cents
        type: integer
        source: computed
        description: "stipend_pool_cents - stipend_committed_cents"
        default: 0
      - name: slots_filled_count
        type: integer
        source: computed
        description: "count of Residency rows of this cycle whose status IN {SCHEDULED, IN_RESIDENCE, COMPLETED, TERMINATED}"
        default: 0
      - name: slots_open_count
        type: integer
        source: computed
        description: "cohort_target_size - slots_filled_count, floored at 0"
        default: 0
      - name: slate_ready_count
        type: integer
        source: computed
        description: "count of Application rows of this cycle whose status == SCORED"
        default: 0
      - name: alumni_reserved_slots
        type: integer
        source: computed
        description: "ceil(alumni_reserve_pct * cohort_target_size); see calculations.slate_allocation"
        default: 0
      - name: panel_review_complete
        type: boolean
        source: computed
        description: "true when slate_ready_count >= 1 AND no Application of this cycle is in status PANEL_REVIEW"
        default: false

  - name: Discipline
    parent: null
    common_fields: false
    fields:
      - name: cycle_id
        type: string
        source: input
        description: "FK -> Cycle.id; the cycle whose discipline category this row configures"
      - name: code
        type: string
        source: input
        description: short discipline code used for ranking order and reporting
        constraints: "unique per cycle_id; uppercase A-Z0-9_, 2-16 chars"
      - name: name
        type: string
        source: input
        description: display name of the discipline category
      - name: portfolio_min_items
        type: integer
        source: input
        description: minimum PortfolioItem rows required before an Application in this discipline may be submitted
        constraints: ">= 1"
      - name: portfolio_max_items
        type: integer
        source: input
        description: maximum PortfolioItem rows allowed on an Application in this discipline
        constraints: ">= portfolio_min_items"
      - name: required_media_types
        type: array
        source: input
        description: every media type that must appear at least once among the application's portfolio items
        constraints: "subset of {IMAGE, VIDEO, AUDIO, TEXT, MODEL_3D}, may be empty"
      - name: requires_hazmat_review
        type: boolean
        source: input
        description: when true, residents in this discipline who declared hazardous materials need HAZMAT_HANDLING training
        default: false
      - name: cohort_min_slots
        type: integer
        source: input
        description: slots the slate allocator must fill from this discipline before general allocation
        constraints: ">= 0"
      - name: cohort_max_slots
        type: integer
        source: input
        description: hard ceiling on slots this discipline may occupy in the cohort
        constraints: ">= cohort_min_slots"
      - name: required_capability_tags
        type: array
        source: input
        description: capability tags a Studio must carry to host a residency of this discipline
        constraints: "subset of {WELDING, KILN, DARKROOM, WET_LAB, PRINT_PRESS, CLEAN_ONLY}, may be empty"
      - name: required_ventilation_class
        type: enum
        source: input
        description: minimum studio ventilation class for this discipline
        default: NONE
        constraints: "one of {NONE, LOCAL, FUME_HOOD}"

  - name: Applicant
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: applicant legal name
      - name: email
        type: string
        source: input
        description: contact email
        constraints: "unique across Applicant"
      - name: affiliation_org
        type: string
        source: input
        description: applicant's current institutional affiliation, compared against Panelist.affiliation_org for conflicts
      - name: citizenship_country
        type: string
        source: input
        description: ISO 3166-1 alpha-2 country of citizenship
        constraints: "exactly 2 uppercase letters"
      - name: treaty_country
        type: boolean
        source: input
        description: whether the applicant's citizenship country has a reduced-rate tax treaty with HOST_COUNTRY
        default: false
      - name: declared_annual_income_cents
        type: integer
        source: input
        description: self-declared annual income used for the application fee waiver test
        constraints: ">= 0"
      - name: is_international
        type: boolean
        source: computed
        description: "citizenship_country != HOST_COUNTRY"
        default: false
      - name: completed_residency_count
        type: integer
        source: computed
        description: "count of Residency rows with applicant_id == this.id AND status == COMPLETED"
        default: 0

  - name: Application
    parent: null
    common_fields: true
    fields:
      - name: cycle_id
        type: string
        source: input
        description: "FK -> Cycle.id; the cycle this application competes in"
      - name: applicant_id
        type: string
        source: input
        description: "FK -> Applicant.id; the applying artist"
      - name: discipline_id
        type: string
        source: input
        description: "FK -> Discipline.id; the discipline category applied to; its cycle_id must equal this row's cycle_id"
      - name: requested_session_length_weeks
        type: integer
        source: input
        description: session length in whole weeks the applicant is requesting
        constraints: "must be a member of Cycle.session_length_options_weeks"
      - name: project_statement
        type: string
        source: input
        description: narrative project proposal
        constraints: "1-4000 chars"
      - name: fee_waiver_requested
        type: boolean
        source: input
        description: whether the applicant asked for the application fee to be waived
        default: false
      - name: fee_status
        type: enum
        source: system
        description: settlement state of the application fee
        default: PENDING
        constraints: "one of {PENDING, PAID, WAIVED}"
      - name: fee_waiver_reason
        type: string
        source: system
        description: reason recorded by the ProgramAdmin when the fee was waived or the waiver denied; null until a fee-resolution call
      - name: status
        type: enum
        source: system
        description: application lifecycle state
        default: DRAFT
        constraints: "one of {DRAFT, SUBMITTED, REVISION_REQUESTED, PANEL_REVIEW, SCORED, OFFERED, WAITLISTED, REJECTED, ACCEPTED, DECLINED}"
      - name: revision_round
        type: integer
        source: system
        description: number of REVISION_REQUESTED rounds this application has been through
        default: 0
      - name: portfolio_item_count
        type: integer
        source: computed
        description: "count of PortfolioItem rows with application_id == this.id"
        default: 0
      - name: portfolio_media_types
        type: array
        source: computed
        description: "distinct PortfolioItem.media_type values present on this application, sorted ascending"
      - name: hazardous_materials_declared
        type: boolean
        source: computed
        description: "true when at least one PortfolioItem of this application has hazardous_materials_declared == true"
        default: false
      - name: assigned_panelist_count
        type: integer
        source: computed
        description: "count of PanelAssignment rows for this application with status IN {ASSIGNED, SCORED}"
        default: 0
      - name: scored_panelist_count
        type: integer
        source: computed
        description: "count of PanelAssignment rows for this application with status == SCORED"
        default: 0
      - name: provisional_screening_score
        type: number
        source: computed
        description: "untrimmed mean panel score; see calculations.application_composite_score variant provisional_screening_score; null when scored_panelist_count == 0"
      - name: final_panel_score
        type: number
        source: computed
        description: "quorum-gated trimmed mean panel score; see calculations.application_composite_score variant final_panel_score; null until quorum is met and null again if quorum is lost"
      - name: rank_in_discipline
        type: integer
        source: computed
        description: "1-based rank of this application inside its discipline by final_panel_score DESC then created_at ASC, over applications of the same discipline_id with status == SCORED; null when final_panel_score is null"
      - name: waitlist_rank
        type: integer
        source: computed
        description: "1-based cycle-wide rank among status == WAITLISTED applications by final_panel_score DESC then created_at ASC; null unless status == WAITLISTED"

  - name: PortfolioItem
    parent: null
    common_fields: false
    fields:
      - name: application_id
        type: string
        source: input
        description: "FK -> Application.id; the application this work sample belongs to"
      - name: media_type
        type: enum
        source: input
        description: media type of the work sample
        constraints: "one of {IMAGE, VIDEO, AUDIO, TEXT, MODEL_3D}"
      - name: title
        type: string
        source: input
        description: title of the work sample
        constraints: "1-200 chars"
      - name: file_size_mb
        type: number
        source: input
        description: uploaded file size in megabytes
        constraints: "> 0 and <= 200"
      - name: hazardous_materials_declared
        type: boolean
        source: input
        description: whether producing this work involves hazardous materials
        default: false

  - name: Panelist
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: panelist name
      - name: email
        type: string
        source: input
        description: contact email
        constraints: "unique across Panelist"
      - name: affiliation_org
        type: string
        source: input
        description: panelist's institutional affiliation, compared against Applicant.affiliation_org for conflicts
      - name: discipline_expertise
        type: array
        source: input
        description: Discipline.code values this panelist is credentialed in; drives the rubric expertise multiplier
        constraints: "array of strings, may be empty"
      - name: chair_eligible
        type: boolean
        source: input
        description: whether this panelist may act in the PanelChair role
        default: false
      - name: status
        type: enum
        source: system
        description: panel participation state
        default: ACTIVE
        constraints: "one of {ACTIVE, RECUSED_FOR_CYCLE}"
      - name: recused_cycle_id
        type: string
        source: system
        description: "FK -> Cycle.id; set when status becomes RECUSED_FOR_CYCLE, null otherwise"
      - name: assigned_count
        type: integer
        source: computed
        description: "count of PanelAssignment rows with panelist_id == this.id AND status IN {ASSIGNED, SCORED}"
        default: 0
      - name: conflict_count
        type: integer
        source: computed
        description: "count of PanelAssignment rows with panelist_id == this.id AND status == CONFLICT_DECLARED"
        default: 0

  - name: PanelAssignment
    parent: null
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: input
        description: "FK -> Application.id; the application under review"
      - name: panelist_id
        type: string
        source: input
        description: "FK -> Panelist.id; the reviewer"
      - name: status
        type: enum
        source: system
        description: review state of this reviewer-application pair
        default: ASSIGNED
        constraints: "one of {ASSIGNED, SCORED, CONFLICT_DECLARED, VACATED}"
      - name: conflict_type
        type: enum
        source: system
        description: declared conflict category; null unless status == CONFLICT_DECLARED
        constraints: "one of {SAME_AFFILIATION, PRIOR_MENTORSHIP, FAMILIAL, FINANCIAL}"
      - name: conflict_detail
        type: string
        source: system
        description: free-text conflict explanation; null unless status == CONFLICT_DECLARED
      - name: score_artistic_merit
        type: integer
        source: system
        description: rubric criterion score recorded from the scores call; null until status == SCORED and cleared back to null on VACATED
        constraints: "integer in [RUBRIC_SCORE_MIN, RUBRIC_SCORE_MAX]"
      - name: score_feasibility
        type: integer
        source: system
        description: rubric criterion score recorded from the scores call; null until status == SCORED and cleared back to null on VACATED
        constraints: "integer in [RUBRIC_SCORE_MIN, RUBRIC_SCORE_MAX]"
      - name: score_community_fit
        type: integer
        source: system
        description: rubric criterion score recorded from the scores call; null until status == SCORED and cleared back to null on VACATED
        constraints: "integer in [RUBRIC_SCORE_MIN, RUBRIC_SCORE_MAX]"
      - name: score_technical_readiness
        type: integer
        source: system
        description: rubric criterion score recorded from the scores call; null until status == SCORED and cleared back to null on VACATED
        constraints: "integer in [RUBRIC_SCORE_MIN, RUBRIC_SCORE_MAX]"
      - name: notes
        type: string
        source: system
        description: reviewer notes recorded from the scores call
      - name: scored_at
        type: datetime
        source: system
        description: logical-clock instant at which the scores were recorded; null unless status == SCORED
      - name: expertise_matched
        type: boolean
        source: computed
        description: "true when the Discipline.code of the application's discipline_id is a member of Panelist.discipline_expertise"
        default: false
      - name: panelist_total_100
        type: number
        source: computed
        description: "this reviewer's weighted, expertise-adjusted score on a 0.00-100.00 scale; see calculations.application_composite_score; null unless status == SCORED"

  - name: Residency
    parent: null
    common_fields: true
    fields:
      - name: cycle_id
        type: string
        source: input
        description: "FK -> Cycle.id; the cycle funding this residency"
      - name: application_id
        type: string
        source: input
        description: "FK -> Application.id; the accepted application; null for follow-on residencies created without a new application"
      - name: applicant_id
        type: string
        source: input
        description: "FK -> Applicant.id; the resident artist"
      - name: predecessor_residency_id
        type: string
        source: input
        description: "FK -> Residency.id; the completed residency this follow-on residency extends; null for cycle-selected residencies"
      - name: discipline_code
        type: string
        source: system
        description: Discipline.code copied from the accepted application's discipline, or from the discipline_id supplied when the residency was created directly
      - name: session_start_date
        type: string
        source: system
        description: inclusive first date of the residency session (YYYY-MM-DD); null until scheduled
      - name: session_end_date
        type: string
        source: computed
        description: "session_start_date + (session_length_weeks * 7) - 1 day (YYYY-MM-DD, inclusive); null until scheduled"
      - name: session_length_weeks
        type: integer
        source: system
        description: session length in whole weeks; null until scheduled
        constraints: "member of Cycle.session_length_options_weeks"
      - name: status
        type: enum
        source: system
        description: residency lifecycle axis, independent of compliance_status
        default: SCHEDULED
        constraints: "one of {SCHEDULED, IN_RESIDENCE, COMPLETED, TERMINATED, WITHDRAWN}"
      - name: compliance_status
        type: enum
        source: system
        description: safety/training axis, evolves independently of status
        default: TRAINING_PENDING
        constraints: "one of {TRAINING_PENDING, CLEARED, SUSPENDED}"
      - name: required_training_types
        type: array
        source: computed
        description: "['SAFETY_ORIENTATION'] plus one EQUIPMENT_<TAG> entry per tag in the discipline's required_capability_tags, plus 'HAZMAT_HANDLING' when the discipline requires hazmat review AND the source application declared hazardous materials; sorted ascending"
      - name: completed_training_types
        type: array
        source: system
        description: training types recorded through the trainings endpoint, sorted ascending, de-duplicated
      - name: visa_required
        type: boolean
        source: computed
        description: "Applicant.is_international of applicant_id"
        default: false
      - name: stipend_basis
        type: enum
        source: system
        description: which stipend variant currently backs stipend_total_cents
        default: PROVISIONAL
        constraints: "one of {PROVISIONAL, FINAL_SETTLED}"
      - name: stipend_weekly_rate_cents
        type: integer
        source: system
        description: effective weekly rate for this residency; Cycle.stipend_weekly_rate_cents unless a schedule call supplied weekly_rate_override_cents
      - name: stipend_total_cents
        type: integer
        source: computed
        description: "see calculations.residency_stipend_total (variants provisional_award and final_settled)"
        default: 0
      - name: stipend_paid_gross_cents
        type: integer
        source: computed
        description: "sum of StipendDisbursement.gross_cents for this residency where status == PAID"
        default: 0
      - name: withholding_to_date_cents
        type: integer
        source: computed
        description: "sum of StipendDisbursement.withholding_cents for this residency where status == PAID"
        default: 0
      - name: tax_form_type
        type: enum
        source: computed
        description: "'W9' when Applicant.is_international is false, else '1042S'"
        constraints: "one of {W9, 1042S}"
      - name: actual_weeks_in_residence
        type: integer
        source: computed
        description: "ceil((termination_or_completion_date - session_start_date + 1 day) / 7) in whole weeks; null while status IN {SCHEDULED, WITHDRAWN}"
      - name: assigned_studio_code
        type: string
        source: system
        description: Studio.code of the residency's StudioAssignment in status ACTIVE; null when none
      - name: assigned_housing_unit_code
        type: string
        source: system
        description: HousingUnit.code of the residency's HousingAssignment in status ACTIVE; null when none
      - name: obligations_required_total
        type: integer
        source: computed
        description: "sum of Obligation.required_count for this residency where status != WAIVED"
        default: 0
      - name: obligations_completed_total
        type: integer
        source: computed
        description: "sum of Obligation.completed_count for this residency where status != WAIVED"
        default: 0
      - name: obligations_breached_count
        type: integer
        source: computed
        description: "count of Obligation rows for this residency with status == BREACHED"
        default: 0

  - name: Studio
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: studio code, also the deterministic tie-break key for auto-selection
        constraints: "unique across Studio; uppercase A-Z0-9_-, 2-16 chars"
      - name: capability_tags
        type: array
        source: input
        description: facility capabilities this studio provides
        constraints: "non-empty subset of {WELDING, KILN, DARKROOM, WET_LAB, PRINT_PRESS, CLEAN_ONLY}"
      - name: ventilation_class
        type: enum
        source: input
        description: ventilation grade of the studio
        default: NONE
        constraints: "one of {NONE, LOCAL, FUME_HOOD}"
      - name: max_concurrent_residents
        type: integer
        source: input
        description: how many ACTIVE studio assignments may cover the same calendar date
        constraints: ">= 1"
      - name: status
        type: enum
        source: input
        description: availability of the studio
        default: AVAILABLE
        constraints: "one of {AVAILABLE, MAINTENANCE, DECOMMISSIONED}"
      - name: reserved_resident_days
        type: integer
        source: computed
        description: "sum of StudioAssignment.occupied_days for this studio where status == ACTIVE; the conserved quantity of the studio-day invariant"
        default: 0
      - name: active_assignment_count
        type: integer
        source: computed
        description: "count of StudioAssignment rows for this studio with status == ACTIVE"
        default: 0

  - name: StudioAssignment
    parent: null
    common_fields: true
    fields:
      - name: studio_id
        type: string
        source: input
        description: "FK -> Studio.id; the occupied studio; when the create request omits it the server selects one per calculations.studio_auto_selection"
      - name: residency_id
        type: string
        source: input
        description: "FK -> Residency.id; the residency occupying the studio"
      - name: start_date
        type: string
        source: input
        description: inclusive first occupied date (YYYY-MM-DD)
      - name: end_date
        type: string
        source: input
        description: inclusive last occupied date (YYYY-MM-DD)
        constraints: "must be >= start_date"
      - name: occupied_days
        type: integer
        source: computed
        description: "end_date - start_date + 1, in whole days (closed interval)"
        default: 0
      - name: status
        type: enum
        source: system
        description: occupancy state
        default: ACTIVE
        constraints: "one of {ACTIVE, RELEASED}"
      - name: selection_mode
        type: enum
        source: system
        description: whether the studio was named by the caller or chosen by the selector
        constraints: "one of {EXPLICIT, AUTO_SELECTED}"
      - name: released_reason
        type: string
        source: system
        description: reason recorded when status became RELEASED; null while ACTIVE

  - name: HousingUnit
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: housing unit code
        constraints: "unique across HousingUnit; uppercase A-Z0-9_-, 2-16 chars"
      - name: bed_count
        type: integer
        source: input
        description: how many ACTIVE housing assignments may overlap on the same night
        constraints: ">= 1"
      - name: meal_plan_included
        type: boolean
        source: input
        description: whether residents in this unit may select the meal plan
        default: false
      - name: accessibility_features
        type: array
        source: input
        description: accessibility features present in the unit
        constraints: "subset of {STEP_FREE, ROLL_IN_SHOWER, VISUAL_ALARM, GROUND_FLOOR}, may be empty"
      - name: status
        type: enum
        source: input
        description: availability of the unit
        default: AVAILABLE
        constraints: "one of {AVAILABLE, MAINTENANCE}"
      - name: occupied_bed_nights
        type: integer
        source: computed
        description: "sum of HousingAssignment.bed_nights for this unit where status == ACTIVE"
        default: 0

  - name: HousingAssignment
    parent: null
    common_fields: true
    fields:
      - name: housing_unit_id
        type: string
        source: input
        description: "FK -> HousingUnit.id; the occupied unit"
      - name: residency_id
        type: string
        source: input
        description: "FK -> Residency.id; the residency housed"
      - name: check_in_date
        type: string
        source: input
        description: inclusive first night (YYYY-MM-DD); interval is half-open [check_in_date, check_out_date)
      - name: check_out_date
        type: string
        source: input
        description: exclusive departure date (YYYY-MM-DD); the resident does not occupy a bed on this date
        constraints: "must be strictly after check_in_date"
      - name: meal_plan_selected
        type: boolean
        source: input
        description: whether the resident takes the meal plan
        default: false
      - name: bed_nights
        type: integer
        source: computed
        description: "check_out_date - check_in_date, in whole days (half-open interval)"
        default: 0
      - name: status
        type: enum
        source: system
        description: occupancy state
        default: ACTIVE
        constraints: "one of {ACTIVE, RELEASED}"
      - name: released_reason
        type: string
        source: system
        description: reason recorded when status became RELEASED; null while ACTIVE

  - name: VisaCase
    parent: null
    common_fields: true
    fields:
      - name: residency_id
        type: string
        source: input
        description: "FK -> Residency.id; the sponsored residency; created by cascade when an international applicant's offer is accepted"
      - name: case_type
        type: enum
        source: system
        description: "'J1_RESEARCH_SCHOLAR' when Residency.session_length_weeks >= VISA_J1_MIN_SESSION_WEEKS at scheduling time, else 'B1_SHORT_TERM'; 'B1_SHORT_TERM' until the residency is scheduled"
        default: B1_SHORT_TERM
        constraints: "one of {J1_RESEARCH_SCHOLAR, B1_SHORT_TERM}"
      - name: status
        type: enum
        source: system
        description: sponsorship pipeline state
        default: INITIATED
        constraints: "one of {INITIATED, DOCS_REQUESTED, DOCS_SUBMITTED, FILED, APPROVED, DENIED}"
      - name: requested_doc_list
        type: array
        source: system
        description: documents most recently requested from the resident
      - name: submitted_doc_list
        type: array
        source: system
        description: documents most recently submitted by the resident
      - name: consulate_appointment_date
        type: string
        source: system
        description: consulate interview date recorded at filing (YYYY-MM-DD); null before filing
      - name: rfe_round
        type: integer
        source: system
        description: number of times documents were re-requested after a submission (request-for-evidence loops)
        default: 0
      - name: backlog_days
        type: integer
        source: computed
        description: "VISA_BACKLOG_DAYS_HIGH_VOLUME when the applicant's citizenship_country is in HIGH_VOLUME_VISA_COUNTRIES, else VISA_BACKLOG_DAYS_DEFAULT"
        default: 21
      - name: filing_deadline_date
        type: string
        source: computed
        description: "see calculations.visa_timeline; null until the residency is scheduled"
      - name: earliest_entry_date
        type: string
        source: computed
        description: "see calculations.visa_timeline; null until the residency is scheduled"
      - name: days_to_filing_deadline
        type: integer
        source: computed
        description: "filing_deadline_date - date(logical clock now), in whole days; negative once the deadline has passed; null until the residency is scheduled"

  - name: StipendDisbursement
    parent: null
    common_fields: true
    fields:
      - name: residency_id
        type: string
        source: input
        description: "FK -> Residency.id; the residency being paid"
      - name: period_index
        type: integer
        source: system
        description: 1-based disbursement period ordinal within the residency schedule
        constraints: ">= 1"
      - name: period_start_date
        type: string
        source: computed
        description: "session_start_date + (period_index - 1) * STIPEND_PERIOD_WEEKS * 7 days (YYYY-MM-DD)"
      - name: period_end_date
        type: string
        source: computed
        description: "min(period_start_date + STIPEND_PERIOD_WEEKS * 7 - 1 days, Residency.session_end_date) (YYYY-MM-DD)"
      - name: gross_cents
        type: integer
        source: computed
        description: "per-period gross from calculations.stipend_period_split"
        default: 0
      - name: withholding_cents
        type: integer
        source: computed
        description: "amount withheld at payment time; see calculations.stipend_withholding; 0 while status == SCHEDULED"
        default: 0
      - name: net_cents
        type: integer
        source: computed
        description: "gross_cents - withholding_cents; 0 while status == SCHEDULED"
        default: 0
      - name: withholding_rate
        type: number
        source: computed
        description: "0.00 for W9 residents, TREATY_WITHHOLDING_RATE for treaty 1042S residents, NRA_WITHHOLDING_RATE otherwise; null while status == SCHEDULED"
      - name: cumulative_taxable_cents
        type: integer
        source: computed
        description: "the taxable slice of this disbursement per calculations.stipend_withholding; null while status == SCHEDULED"
      - name: tax_form_type
        type: enum
        source: computed
        description: "Residency.tax_form_type at the time the schedule was generated"
        constraints: "one of {W9, 1042S}"
      - name: status
        type: enum
        source: system
        description: disbursement state
        default: SCHEDULED
        constraints: "one of {SCHEDULED, PAID, VOIDED, REVERSED}"
      - name: paid_on_date
        type: string
        source: system
        description: date the disbursement was paid (YYYY-MM-DD); null unless status IN {PAID, REVERSED}
      - name: scheduled_by_user_id
        type: string
        source: system
        description: X-User-ID of the FinanceOfficer who generated this schedule row (opaque operator id, not an entity id)
      - name: paid_by_user_id
        type: string
        source: system
        description: X-User-ID of the FinanceOfficer who marked this row PAID; null until paid

  - name: Obligation
    parent: null
    common_fields: true
    fields:
      - name: residency_id
        type: string
        source: input
        description: "FK -> Residency.id; the residency carrying the engagement obligation; rows are created by cascade when the residency is scheduled"
      - name: obligation_type
        type: enum
        source: system
        description: public engagement obligation category
        constraints: "one of {OPEN_STUDIO, EXHIBITION, COMMUNITY_WORKSHOP, ARTIST_TALK}"
      - name: required_count
        type: integer
        source: system
        description: "how many events of this type the resident owes; see calculations.obligation_provisioning"
        constraints: ">= 1"
      - name: completed_count
        type: integer
        source: system
        description: how many events of this type have been logged
        default: 0
      - name: total_attendance
        type: integer
        source: system
        description: cumulative attendance across logged events of this type
        default: 0
      - name: due_date
        type: string
        source: system
        description: Residency.session_end_date at provisioning time (YYYY-MM-DD)
      - name: status
        type: enum
        source: system
        description: obligation settlement state
        default: PENDING
        constraints: "one of {PENDING, SATISFIED, WAIVED, BREACHED}"
      - name: waived_reason
        type: string
        source: system
        description: reason recorded when status became WAIVED; null otherwise

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
# Shapes in play:
#   Cycle              : linear pipeline with compound (children-derived) guards
#   Application        : cyclic (revision loop) + branching (offer / waitlist / reject)
#   PanelAssignment    : branching with compensation (VACATED clears recorded scores)
#   Residency          : PARALLEL DIMENSIONS - `status` and `compliance_status` evolve
#                        independently on the same row; the compliance axis is itself cyclic
#   VisaCase           : cyclic (request-for-evidence rounds) + branching adjudication
#   StipendDisbursement: branching with compensation (REVERSED)
#   Obligation         : branching (satisfy / waive / breach)
#   StudioAssignment / HousingAssignment : two-state occupancy with ledger sync
state_machines:

  - entity: Cycle
    state_field: status
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: OPEN
        trigger: "POST /cycles/{id}/stage with to_status=OPEN"
        actor: ProgramAdmin
        preconditions:
          - "at least one Discipline row exists with cycle_id == this cycle"
          - "sum of Discipline.cohort_min_slots over this cycle's disciplines <= Cycle.cohort_target_size"
        side_effects:
          - "increments Cycle.version by 1"
        note: "applications may only be created and submitted while status == OPEN"
      - from: OPEN
        to: SCREENING
        trigger: "POST /cycles/{id}/stage with to_status=SCREENING"
        actor: ProgramAdmin
        preconditions:
          - "no Application of this cycle is in status DRAFT"
        side_effects:
          - "increments Cycle.version by 1"
      - from: SCREENING
        to: PANEL_REVIEW
        trigger: "POST /cycles/{id}/stage with to_status=PANEL_REVIEW"
        actor: ProgramAdmin
        preconditions:
          - "no Application of this cycle is in status SUBMITTED (every submission has been advanced, sent back, or rejected)"
        side_effects:
          - "increments Cycle.version by 1"
      - from: PANEL_REVIEW
        to: SLATE_LOCKED
        trigger: "POST /cycles/{id}/lock-slate"
        actor: PanelChair
        preconditions:
          - "Cycle.panel_review_complete == true"
          - "for every Discipline of this cycle, the count of slate-eligible Applications in that discipline is >= Discipline.cohort_min_slots"
          - "acting PanelChair's X-User-ID is not the panelist_id of any PanelAssignment whose application_id belongs to this cycle and whose status IN {SCORED, CONFLICT_DECLARED}"
        side_effects:
          - "runs calculations.slate_allocation over the cycle's SCORED applications"
          - "each selected Application transitions SCORED -> OFFERED"
          - "each non-selected slate-eligible Application transitions SCORED -> WAITLISTED and receives waitlist_rank"
          - "each SCORED Application with final_panel_score < Cycle.slate_min_score transitions SCORED -> REJECTED"
          - "recomputes Cycle.alumni_reserved_slots, Cycle.slate_ready_count"
          - "increments Cycle.version by 1"
      - from: SLATE_LOCKED
        to: CLOSED
        trigger: "POST /cycles/{id}/stage with to_status=CLOSED"
        actor: ProgramAdmin
        preconditions:
          - "no Application of this cycle is in status OFFERED (every offer has been accepted or declined)"
        side_effects:
          - "each Application of this cycle still in status WAITLISTED transitions WAITLISTED -> REJECTED"
          - "recomputes Cycle.slots_open_count"
          - "increments Cycle.version by 1"
        note: "GET /cycles/{id}/funder-outcome-report is readable in every stage but only reports final numbers once CLOSED"

  - entity: Application
    state_field: status
    initial_state: DRAFT
    terminal_states: [REJECTED, ACCEPTED, DECLINED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /applications/{id}/submit"
        actor: Applicant
        preconditions:
          - "Cycle.status == OPEN"
          - "logical clock now is within [Cycle.open_at, Cycle.close_at]"
          - "Application.fee_status IN {PAID, WAIVED}"
          - "Discipline.portfolio_min_items <= Application.portfolio_item_count <= Discipline.portfolio_max_items"
          - "every member of Discipline.required_media_types appears in Application.portfolio_media_types"
        side_effects:
          - "recomputes Application.portfolio_item_count, portfolio_media_types, hazardous_materials_declared"
          - "increments Application.version by 1"
      - from: SUBMITTED
        to: REVISION_REQUESTED
        trigger: "POST /applications/{id}/screening-decision with decision=REQUEST_REVISION"
        actor: ProgramAdmin
        preconditions:
          - "Cycle.status == SCREENING"
          - "Application.revision_round < MAX_REVISION_ROUNDS"
        side_effects:
          - "increments Application.revision_round by 1"
          - "increments Application.version by 1"
        note: "cycle edge - the application returns to the applicant for rework"
      - from: REVISION_REQUESTED
        to: SUBMITTED
        trigger: "POST /applications/{id}/submit"
        actor: Applicant
        preconditions:
          - "Cycle.status == SCREENING"
          - "Discipline.portfolio_min_items <= Application.portfolio_item_count <= Discipline.portfolio_max_items"
          - "every member of Discipline.required_media_types appears in Application.portfolio_media_types"
        side_effects:
          - "recomputes Application.portfolio_item_count, portfolio_media_types, hazardous_materials_declared"
          - "increments Application.version by 1"
        note: "closes the revision cycle SUBMITTED -> REVISION_REQUESTED -> SUBMITTED; the application submission window is NOT re-checked here because screening happens after close_at"
      - from: SUBMITTED
        to: PANEL_REVIEW
        trigger: "POST /applications/{id}/screening-decision with decision=ADVANCE"
        actor: ProgramAdmin
        preconditions:
          - "Cycle.status == SCREENING"
        side_effects:
          - "increments Application.version by 1"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /applications/{id}/screening-decision with decision=REJECT"
        actor: ProgramAdmin
        preconditions:
          - "Cycle.status == SCREENING"
        side_effects:
          - "every PanelAssignment of this application in status ASSIGNED transitions ASSIGNED -> VACATED"
          - "increments Application.version by 1"
      - from: PANEL_REVIEW
        to: SCORED
        trigger: "system, on the POST /panel-assignments/{id}/scores call that raises Application.scored_panelist_count to Cycle.panel_quorum"
        actor: system
        preconditions:
          - "Application.scored_panelist_count >= Cycle.panel_quorum after the score is recorded"
        side_effects:
          - "computes Application.final_panel_score via calculations.application_composite_score variant final_panel_score"
          - "recomputes Application.rank_in_discipline"
          - "increments Cycle.slate_ready_count by 1 and recomputes Cycle.panel_review_complete"
          - "increments Application.version by 1"
      - from: SCORED
        to: PANEL_REVIEW
        trigger: "system, cascade link 4 of the severe-conflict recusal chain (see PanelAssignment ASSIGNED->CONFLICT_DECLARED and SCORED->VACATED)"
        actor: system
        preconditions:
          - "Application.scored_panelist_count < Cycle.panel_quorum after a PanelAssignment left status SCORED"
        side_effects:
          - "sets Application.final_panel_score = null and Application.rank_in_discipline = null"
          - "recomputes Application.provisional_screening_score over the remaining SCORED assignments"
          - "decrements Cycle.slate_ready_count by 1 and recomputes Cycle.panel_review_complete (cascade link 5)"
          - "increments Application.version by 1"
        note: "reverse edge - quorum loss demotes a scored application back into review"
      - from: SCORED
        to: OFFERED
        trigger: "system, during POST /cycles/{id}/lock-slate slate allocation"
        actor: system
        preconditions:
          - "the application is selected by calculations.slate_allocation"
        side_effects:
          - "increments Application.version by 1"
      - from: SCORED
        to: WAITLISTED
        trigger: "system, during POST /cycles/{id}/lock-slate slate allocation"
        actor: system
        preconditions:
          - "Application.final_panel_score >= Cycle.slate_min_score AND the application is not selected"
        side_effects:
          - "sets Application.waitlist_rank"
          - "increments Application.version by 1"
      - from: SCORED
        to: REJECTED
        trigger: "system, during POST /cycles/{id}/lock-slate slate allocation"
        actor: system
        preconditions:
          - "Application.final_panel_score < Cycle.slate_min_score"
        side_effects:
          - "increments Application.version by 1"
      - from: WAITLISTED
        to: OFFERED
        trigger: "POST /applications/{id}/screening-decision with decision=PROMOTE_FROM_WAITLIST"
        actor: ProgramAdmin
        preconditions:
          - "Cycle.status == SLATE_LOCKED"
          - "Cycle.slots_open_count >= 1"
        side_effects:
          - "sets Application.waitlist_rank = null"
          - "recomputes waitlist_rank of the remaining WAITLISTED applications"
          - "increments Application.version by 1"
      - from: WAITLISTED
        to: REJECTED
        trigger: "system, on Cycle SLATE_LOCKED -> CLOSED"
        actor: system
        preconditions:
          - "Cycle.status becomes CLOSED"
        side_effects:
          - "sets Application.waitlist_rank = null"
          - "increments Application.version by 1"
      - from: OFFERED
        to: ACCEPTED
        trigger: "POST /applications/{id}/offer-response with response=ACCEPT"
        actor: Applicant
        preconditions:
          - "Cycle.status == SLATE_LOCKED"
          - "Cycle.stipend_uncommitted_cents >= requested_session_length_weeks * Cycle.stipend_weekly_rate_cents"
        side_effects:
          - "CASCADE A link 1: creates a Residency in status SCHEDULED / compliance_status TRAINING_PENDING with cycle_id, application_id, applicant_id, discipline_code, stipend_weekly_rate_cents = Cycle.stipend_weekly_rate_cents, stipend_basis = PROVISIONAL and session dates null"
          - "CASCADE A link 2 (caused by link 1): the new Residency's provisional stipend is committed - Cycle.stipend_committed_cents increases by requested_session_length_weeks * Cycle.stipend_weekly_rate_cents, Cycle.stipend_uncommitted_cents and Cycle.slots_filled_count/slots_open_count are recomputed"
          - "CASCADE A link 3 (caused by link 1): when Residency.visa_required == true a VisaCase is created for it in status INITIATED with case_type B1_SHORT_TERM"
          - "increments Application.version by 1 and Cycle.version by 1"
      - from: OFFERED
        to: DECLINED
        trigger: "POST /applications/{id}/offer-response with response=DECLINE"
        actor: Applicant
        preconditions:
          - "Cycle.status == SLATE_LOCKED"
        side_effects:
          - "recomputes Cycle.slots_open_count"
          - "increments Application.version by 1"

  - entity: PanelAssignment
    state_field: status
    initial_state: ASSIGNED
    terminal_states: [VACATED]
    transitions:
      - from: ASSIGNED
        to: SCORED
        trigger: "POST /panel-assignments/{id}/scores"
        actor: Panelist
        preconditions:
          - "Cycle.status == PANEL_REVIEW"
          - "Application.status IN {PANEL_REVIEW, SCORED}"
          - "Panelist.status == ACTIVE"
          - "acting X-User-ID == PanelAssignment.panelist_id"
          - "all four rubric scores are integers in [RUBRIC_SCORE_MIN, RUBRIC_SCORE_MAX]"
        side_effects:
          - "records the four rubric scores, notes and scored_at"
          - "computes PanelAssignment.panelist_total_100 and expertise_matched"
          - "recomputes Application.scored_panelist_count and Application.provisional_screening_score"
          - "when Application.scored_panelist_count reaches Cycle.panel_quorum, drives Application PANEL_REVIEW -> SCORED"
          - "increments PanelAssignment.version by 1 and Application.version by 1"
      - from: ASSIGNED
        to: CONFLICT_DECLARED
        trigger: "POST /panel-assignments/{id}/declare-conflict"
        actor: Panelist
        preconditions:
          - "Cycle.status == PANEL_REVIEW"
          - "acting X-User-ID == PanelAssignment.panelist_id"
        side_effects:
          - "CASCADE B link 1: records conflict_type and conflict_detail, clears the four rubric score fields and scored_at to null"
          - "recomputes Application.assigned_panelist_count"
          - "CASCADE B link 2 (caused by link 1, only when conflict_type IN {FAMILIAL, FINANCIAL}): the Panelist auto-recuses - Panelist.status becomes RECUSED_FOR_CYCLE and Panelist.recused_cycle_id is set to the application's cycle_id"
          - "CASCADE B link 3 (caused by link 2): every OTHER PanelAssignment of that panelist whose application belongs to the same cycle and whose status IN {ASSIGNED, SCORED} transitions to VACATED"
          - "increments PanelAssignment.version by 1 and Application.version by 1"
        note: "SAME_AFFILIATION and PRIOR_MENTORSHIP stop at link 1; FAMILIAL and FINANCIAL continue through links 2-5"
      - from: SCORED
        to: CONFLICT_DECLARED
        trigger: "POST /panel-assignments/{id}/declare-conflict"
        actor: Panelist
        preconditions:
          - "Cycle.status == PANEL_REVIEW"
          - "acting X-User-ID == PanelAssignment.panelist_id"
        side_effects:
          - "same links 1-3 as ASSIGNED -> CONFLICT_DECLARED"
          - "compensation: the cleared rubric scores are removed from Application.scored_panelist_count and Application.provisional_screening_score is recomputed over the remaining SCORED assignments"
          - "when Application.scored_panelist_count falls below Cycle.panel_quorum this drives Application SCORED -> PANEL_REVIEW"
          - "increments PanelAssignment.version by 1 and Application.version by 1"
      - from: ASSIGNED
        to: VACATED
        trigger: "system, cascade link 3 of the severe-conflict recusal chain, or Application SUBMITTED -> REJECTED"
        actor: system
        preconditions:
          - "the owning Panelist became RECUSED_FOR_CYCLE, or the reviewed Application became REJECTED"
        side_effects:
          - "recomputes Application.assigned_panelist_count (cascade link 4)"
          - "increments PanelAssignment.version by 1"
      - from: SCORED
        to: VACATED
        trigger: "system, cascade link 3 of the severe-conflict recusal chain"
        actor: system
        preconditions:
          - "the owning Panelist became RECUSED_FOR_CYCLE"
        side_effects:
          - "compensation: clears the four rubric score fields, scored_at and panelist_total_100 to null"
          - "CASCADE B link 4 (caused by link 3): recomputes Application.scored_panelist_count and Application.provisional_screening_score; an Application in SCORED whose scored_panelist_count drops below Cycle.panel_quorum is driven SCORED -> PANEL_REVIEW"
          - "increments PanelAssignment.version by 1 and Application.version by 1"

  - entity: Residency
    state_field: status
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, TERMINATED, WITHDRAWN]
    transitions:
      - from: SCHEDULED
        to: IN_RESIDENCE
        trigger: "POST /residencies/{id}/lifecycle with action=CHECK_IN"
        actor: ProgramAdmin
        preconditions:
          - "Residency.session_start_date is not null"
          - "date(logical clock now) >= Residency.session_start_date"
          - "Residency.compliance_status == CLEARED"
          - "when Residency.visa_required == true, the residency's VisaCase.status == APPROVED"
        side_effects:
          - "increments Residency.version by 1"
        note: "cross-entity guard - the visa condition couples Residency to VisaCase"
      - from: IN_RESIDENCE
        to: COMPLETED
        trigger: "POST /residencies/{id}/lifecycle with action=COMPLETE"
        actor: ProgramAdmin
        preconditions:
          - "date(logical clock now) >= Residency.session_end_date"
        side_effects:
          - "sets Residency.actual_weeks_in_residence = Residency.session_length_weeks"
          - "every Obligation of this residency with status == PENDING and completed_count < required_count transitions PENDING -> BREACHED"
          - "every StudioAssignment of this residency with status == ACTIVE transitions ACTIVE -> RELEASED (released_reason='RESIDENCY_COMPLETED') and Studio.reserved_resident_days is recomputed"
          - "every HousingAssignment of this residency with status == ACTIVE transitions ACTIVE -> RELEASED and HousingUnit.occupied_bed_nights is recomputed"
          - "recomputes Applicant.completed_residency_count of the resident"
          - "increments Residency.version by 1"
      - from: IN_RESIDENCE
        to: TERMINATED
        trigger: "POST /residencies/{id}/lifecycle with action=TERMINATE"
        actor: ProgramAdmin
        preconditions:
          - "date(logical clock now) <= Residency.session_end_date"
        side_effects:
          - "CASCADE C link 1: sets Residency.actual_weeks_in_residence = ceil((date(now) - session_start_date + 1 day) / 7)"
          - "CASCADE C link 2 (caused by link 1): every StipendDisbursement of this residency with status == SCHEDULED transitions SCHEDULED -> VOIDED"
          - "CASCADE C link 3 (caused by link 2): because the surviving schedule no longer covers the planned session, Residency.stipend_basis becomes FINAL_SETTLED and Residency.stipend_total_cents is recomputed with calculations.residency_stipend_total variant final_settled"
          - "CASCADE C link 4 (caused by link 3): Cycle.stipend_committed_cents is reduced by (old stipend_total_cents - new stipend_total_cents) and Cycle.stipend_uncommitted_cents is recomputed"
          - "every StudioAssignment of this residency with status == ACTIVE transitions ACTIVE -> RELEASED (released_reason='RESIDENCY_TERMINATED'), Studio.reserved_resident_days recomputed, Residency.assigned_studio_code set to null"
          - "every HousingAssignment of this residency with status == ACTIVE transitions ACTIVE -> RELEASED, HousingUnit.occupied_bed_nights recomputed, Residency.assigned_housing_unit_code set to null"
          - "increments Residency.version by 1 and Cycle.version by 1"
      - from: SCHEDULED
        to: WITHDRAWN
        trigger: "POST /residencies/{id}/lifecycle with action=WITHDRAW"
        actor: Applicant
        preconditions:
          - "acting X-User-ID == Residency.applicant_id"
        side_effects:
          - "compensation of Application OFFERED -> ACCEPTED: Cycle.stipend_committed_cents is reduced by the residency's full stipend_total_cents, restoring Cycle.stipend_committed_cents to its exact pre-acceptance value"
          - "every StipendDisbursement of this residency with status == SCHEDULED transitions SCHEDULED -> VOIDED"
          - "every StudioAssignment and HousingAssignment of this residency with status == ACTIVE transitions ACTIVE -> RELEASED, and Studio.reserved_resident_days / HousingUnit.occupied_bed_nights are recomputed"
          - "every Obligation of this residency with status == PENDING transitions PENDING -> WAIVED (waived_reason='RESIDENCY_WITHDRAWN')"
          - "the residency's VisaCase, when present and status NOT IN {APPROVED, DENIED}, transitions to DENIED (reason recorded as sponsorship withdrawn)"
          - "recomputes Cycle.slots_filled_count and Cycle.slots_open_count"
          - "increments Residency.version by 1 and Cycle.version by 1"

  - entity: Residency
    state_field: compliance_status
    initial_state: TRAINING_PENDING
    terminal_states: []
    transitions:
      - from: TRAINING_PENDING
        to: CLEARED
        trigger: "system, on the POST /residencies/{id}/trainings call after which completed_training_types covers required_training_types"
        actor: system
        preconditions:
          - "every member of Residency.required_training_types appears in Residency.completed_training_types"
        side_effects:
          - "increments Residency.version by 1"
        note: "independent of the status axis - a residency may be CLEARED while still SCHEDULED, or TRAINING_PENDING while already TERMINATED"
      - from: CLEARED
        to: SUSPENDED
        trigger: "POST /residencies/{id}/compliance with action=SUSPEND"
        actor: FacilitiesManager
        preconditions:
          - "Residency.status IN {SCHEDULED, IN_RESIDENCE}"
        side_effects:
          - "every StudioAssignment of this residency with status == ACTIVE transitions ACTIVE -> RELEASED (released_reason='COMPLIANCE_SUSPENDED'), Studio.reserved_resident_days recomputed, Residency.assigned_studio_code set to null"
          - "increments Residency.version by 1"
      - from: SUSPENDED
        to: CLEARED
        trigger: "POST /residencies/{id}/compliance with action=REINSTATE"
        actor: FacilitiesManager
        preconditions:
          - "Residency.status IN {SCHEDULED, IN_RESIDENCE}"
          - "every member of Residency.required_training_types appears in Residency.completed_training_types"
        side_effects:
          - "increments Residency.version by 1"
        note: "closes the compliance cycle CLEARED -> SUSPENDED -> CLEARED; studio assignment is NOT restored automatically"
      - from: TRAINING_PENDING
        to: SUSPENDED
        trigger: "POST /residencies/{id}/compliance with action=SUSPEND"
        actor: FacilitiesManager
        preconditions:
          - "Residency.status IN {SCHEDULED, IN_RESIDENCE}"
        side_effects:
          - "increments Residency.version by 1"

  - entity: VisaCase
    state_field: status
    initial_state: INITIATED
    terminal_states: [APPROVED, DENIED]
    transitions:
      - from: INITIATED
        to: DOCS_REQUESTED
        trigger: "POST /visa-cases/{id}/docs with action=REQUEST"
        actor: VisaCoordinator
        preconditions:
          - "Residency.status == SCHEDULED"
          - "doc_list is a non-empty array"
        side_effects:
          - "sets requested_doc_list"
          - "increments VisaCase.version by 1"
      - from: DOCS_REQUESTED
        to: DOCS_SUBMITTED
        trigger: "POST /visa-cases/{id}/docs with action=SUBMIT"
        actor: VisaCoordinator
        preconditions:
          - "Residency.status == SCHEDULED"
          - "doc_list covers every member of requested_doc_list"
        side_effects:
          - "sets submitted_doc_list"
          - "increments VisaCase.version by 1"
      - from: DOCS_SUBMITTED
        to: DOCS_REQUESTED
        trigger: "POST /visa-cases/{id}/docs with action=REQUEST"
        actor: VisaCoordinator
        preconditions:
          - "Residency.status == SCHEDULED"
          - "doc_list is a non-empty array"
        side_effects:
          - "increments VisaCase.rfe_round by 1"
          - "replaces requested_doc_list"
          - "increments VisaCase.version by 1"
        note: "cycle edge - request-for-evidence rounds"
      - from: DOCS_SUBMITTED
        to: FILED
        trigger: "POST /visa-cases/{id}/adjudication with action=FILE"
        actor: VisaCoordinator
        preconditions:
          - "Residency.session_start_date is not null (so filing_deadline_date is defined)"
          - "date(logical clock now) <= VisaCase.filing_deadline_date"
          - "date(logical clock now) <= consulate_appointment_date <= VisaCase.earliest_entry_date"
        side_effects:
          - "sets consulate_appointment_date"
          - "recomputes case_type from Residency.session_length_weeks"
          - "increments VisaCase.version by 1"
      - from: FILED
        to: APPROVED
        trigger: "POST /visa-cases/{id}/adjudication with action=APPROVE"
        actor: VisaCoordinator
        preconditions: []
        side_effects:
          - "increments VisaCase.version by 1"
      - from: FILED
        to: DENIED
        trigger: "POST /visa-cases/{id}/adjudication with action=DENY"
        actor: VisaCoordinator
        preconditions: []
        side_effects:
          - "increments VisaCase.version by 1"
      - from: DOCS_REQUESTED
        to: DENIED
        trigger: "system, on Residency SCHEDULED -> WITHDRAWN"
        actor: system
        preconditions:
          - "the sponsored Residency left status SCHEDULED for WITHDRAWN"
        side_effects:
          - "increments VisaCase.version by 1"
      - from: INITIATED
        to: DENIED
        trigger: "system, on Residency SCHEDULED -> WITHDRAWN"
        actor: system
        preconditions:
          - "the sponsored Residency left status SCHEDULED for WITHDRAWN"
        side_effects:
          - "increments VisaCase.version by 1"
      - from: DOCS_SUBMITTED
        to: DENIED
        trigger: "system, on Residency SCHEDULED -> WITHDRAWN"
        actor: system
        preconditions:
          - "the sponsored Residency left status SCHEDULED for WITHDRAWN"
        side_effects:
          - "increments VisaCase.version by 1"
      - from: FILED
        to: DENIED
        trigger: "system, on Residency SCHEDULED -> WITHDRAWN"
        actor: system
        preconditions:
          - "the sponsored Residency left status SCHEDULED for WITHDRAWN"
        side_effects:
          - "increments VisaCase.version by 1"

  - entity: StipendDisbursement
    state_field: status
    initial_state: SCHEDULED
    terminal_states: [VOIDED, REVERSED]
    transitions:
      - from: SCHEDULED
        to: PAID
        trigger: "POST /stipend-disbursements/{id}/settlement with action=PAY"
        actor: FinanceOfficer
        preconditions:
          - "Residency.status IN {IN_RESIDENCE, COMPLETED}"
          - "Residency.compliance_status != SUSPENDED"
          - "acting X-User-ID != StipendDisbursement.scheduled_by_user_id"
          - "every StipendDisbursement of the same residency with a lower period_index has status IN {PAID, VOIDED, REVERSED}"
          - "when this row has the highest period_index of the residency's non-VOIDED schedule, Residency.obligations_breached_count == 0"
        side_effects:
          - "computes withholding_rate, cumulative_taxable_cents, withholding_cents and net_cents via calculations.stipend_withholding"
          - "sets paid_on_date and paid_by_user_id"
          - "recomputes Residency.stipend_paid_gross_cents and Residency.withholding_to_date_cents"
          - "increments StipendDisbursement.version by 1 and Residency.version by 1"
      - from: SCHEDULED
        to: VOIDED
        trigger: "POST /stipend-disbursements/{id}/settlement with action=VOID, or system cascade from Residency IN_RESIDENCE -> TERMINATED / SCHEDULED -> WITHDRAWN"
        actor: FinanceOfficer
        preconditions:
          - "StipendDisbursement.status == SCHEDULED"
        side_effects:
          - "sets withholding_cents = 0, net_cents = 0"
          - "increments StipendDisbursement.version by 1"
      - from: PAID
        to: REVERSED
        trigger: "POST /stipend-disbursements/{id}/settlement with action=REVERSE"
        actor: FinanceOfficer
        preconditions:
          - "acting X-User-ID != StipendDisbursement.paid_by_user_id"
        side_effects:
          - "compensation: recomputes Residency.stipend_paid_gross_cents and Residency.withholding_to_date_cents excluding this row, restoring both to their exact pre-payment values"
          - "keeps gross_cents, withholding_cents and net_cents on the row for tax-reporting history but excludes the row from both residency ledgers"
          - "increments StipendDisbursement.version by 1 and Residency.version by 1"

  - entity: Obligation
    state_field: status
    initial_state: PENDING
    terminal_states: [SATISFIED, WAIVED, BREACHED]
    transitions:
      - from: PENDING
        to: SATISFIED
        trigger: "system, on the POST /obligations/{id}/progress action=LOG_COMPLETION call that raises completed_count to required_count"
        actor: system
        preconditions:
          - "Obligation.completed_count >= Obligation.required_count after the increment"
        side_effects:
          - "recomputes Residency.obligations_completed_total"
          - "increments Obligation.version by 1 and Residency.version by 1"
      - from: PENDING
        to: WAIVED
        trigger: "POST /obligations/{id}/progress with action=WAIVE, or system cascade from Residency SCHEDULED -> WITHDRAWN"
        actor: ProgramAdmin
        preconditions:
          - "Residency.status IN {SCHEDULED, IN_RESIDENCE, WITHDRAWN}"
        side_effects:
          - "sets waived_reason"
          - "recomputes Residency.obligations_required_total and Residency.obligations_completed_total (waived rows leave both sums)"
          - "increments Obligation.version by 1 and Residency.version by 1"
      - from: PENDING
        to: BREACHED
        trigger: "system, on Residency IN_RESIDENCE -> COMPLETED"
        actor: system
        preconditions:
          - "Obligation.completed_count < Obligation.required_count when the residency completes"
        side_effects:
          - "recomputes Residency.obligations_breached_count"
          - "increments Obligation.version by 1 and Residency.version by 1"

  - entity: StudioAssignment
    state_field: status
    initial_state: ACTIVE
    terminal_states: [RELEASED]
    transitions:
      - from: ACTIVE
        to: RELEASED
        trigger: "POST /studio-assignments/{id}/release, or system cascade from Residency COMPLETED / TERMINATED / WITHDRAWN, or from Residency compliance CLEARED -> SUSPENDED"
        actor: FacilitiesManager
        preconditions:
          - "StudioAssignment.status == ACTIVE"
        side_effects:
          - "sets released_reason"
          - "ledger sync: recomputes Studio.reserved_resident_days and Studio.active_assignment_count, restoring reserved_resident_days to its exact pre-assignment value when no other ACTIVE assignment was added"
          - "sets Residency.assigned_studio_code = null"
          - "increments StudioAssignment.version by 1, Studio.version by 1 and Residency.version by 1"

  - entity: HousingAssignment
    state_field: status
    initial_state: ACTIVE
    terminal_states: [RELEASED]
    transitions:
      - from: ACTIVE
        to: RELEASED
        trigger: "POST /housing-assignments/{id}/release, or system cascade from Residency COMPLETED / TERMINATED / WITHDRAWN"
        actor: ProgramAdmin
        preconditions:
          - "HousingAssignment.status == ACTIVE"
        side_effects:
          - "sets released_reason"
          - "ledger sync: recomputes HousingUnit.occupied_bed_nights"
          - "sets Residency.assigned_housing_unit_code = null"
          - "increments HousingAssignment.version by 1, HousingUnit.version by 1 and Residency.version by 1"

# =============================================================================
# 1.2.1 Concurrency Rules  (OCC on the parent entity's `version` only)
# =============================================================================
concurrency_rules:
  - rule_id: studio-assignment-create-stale-residency
    parent_entity: Residency
    write_endpoint: "POST /studio-assignments"
    occ_field: "expected_residency_version"
    description: |
      Creating a StudioAssignment for a Residency whose `version` has advanced since the
      client last observed it is rejected. The product spec lets a newly created assignment
      legitimately supersede the residency's previous studio (reassignment is a normal
      facilities operation), so the write cannot be refused by any state precondition - the
      residency is in exactly the state the caller expects it to be in. The stale-version
      check is therefore the only thing that stops a caller from reassigning a studio on top
      of a residency picture that has already moved on (a release, a compliance suspension,
      or another reassignment).
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: housing-assignment-create-stale-unit
    parent_entity: HousingUnit
    write_endpoint: "POST /housing-assignments"
    occ_field: "expected_housing_unit_version"
    description: |
      Creating a HousingAssignment against a HousingUnit whose `version` has advanced since
      the client last observed it is rejected. A multi-bed unit legitimately accepts further
      assignments, so a second create against the same unit is a valid product operation and
      no state precondition rejects it; the stale-version check is what prevents a caller
      from booking a bed against an occupancy picture (occupied_bed_nights, released rows)
      that has already changed.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: stipend-schedule-create-stale-residency
    parent_entity: Residency
    write_endpoint: "POST /residencies/{id}/stipend-schedule"
    occ_field: "expected_residency_version"
    description: |
      Generating a stipend schedule for a Residency whose `version` has advanced since the
      client last observed it is rejected. Regenerating a schedule legitimately supersedes the
      residency's prior SCHEDULED disbursements (that is how a rate correction is applied), so
      a second generation call is a valid operation that no state precondition refuses; the
      stale-version check is what stops a regeneration from being computed against an
      out-of-date session length, weekly rate or payment history.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: application_composite_score
    trigger: "on POST /panel-assignments/{id}/scores (recorded and recomputed), on PanelAssignment SCORED -> CONFLICT_DECLARED / SCORED -> VACATED (recomputed), and read back on GET /applications/{id}"
    algorithm: weighted_scoring
    formula: |
      # -- per-reviewer leg (PanelAssignment.panelist_total_100) --
      weighted_raw   = (RUBRIC_WEIGHT_ARTISTIC_MERIT      * score_artistic_merit
                      + RUBRIC_WEIGHT_FEASIBILITY         * score_feasibility
                      + RUBRIC_WEIGHT_COMMUNITY_FIT       * score_community_fit
                      + RUBRIC_WEIGHT_TECHNICAL_READINESS * score_technical_readiness) / 10
      # weights sum to 100 and scores run 0..10, so weighted_raw already lies on a 0.0..100.0 scale
      multiplier     = EXPERTISE_MATCH_MULTIPLIER  if expertise_matched
                       else EXPERTISE_MISMATCH_MULTIPLIER
      panelist_total_100 = round_half_up(weighted_raw * multiplier, 2)   # rounded AT the reviewer level

      # -- aggregation leg (Application score fields) --
      scored = [ pa.panelist_total_100 for pa in PanelAssignment
                 where pa.application_id == application.id and pa.status == SCORED ]
      n = len(scored)
      if n == 0: both score fields are null

      # variant provisional_screening_score  (untrimmed)
      provisional_screening_score = round_half_up(sum(scored) / n, 2)

      # variant final_panel_score  (quorum-gated, trimmed)
      if n < Cycle.panel_quorum:
          final_panel_score = null
      elif n >= TRIM_MIN_PANELISTS:
          kept = scored with exactly one occurrence of max(scored) removed
                        and exactly one occurrence of min(scored) removed
          final_panel_score = round_half_up(sum(kept) / len(kept), 2)
      else:
          final_panel_score = round_half_up(sum(scored) / n, 2)
    input_set: |
      Only PanelAssignment rows in status SCORED contribute. Rows in ASSIGNED (not yet reviewed),
      CONFLICT_DECLARED (scores cleared to null) and VACATED (scores cleared to null) are excluded,
      which is why a recusal cascade lowers both scores and can null out final_panel_score entirely.
    constants:
      RUBRIC_WEIGHT_ARTISTIC_MERIT: 35
      RUBRIC_WEIGHT_FEASIBILITY: 27
      RUBRIC_WEIGHT_COMMUNITY_FIT: 23
      RUBRIC_WEIGHT_TECHNICAL_READINESS: 15
      EXPERTISE_MATCH_MULTIPLIER: 1.00
      EXPERTISE_MISMATCH_MULTIPLIER: 0.90
      TRIM_MIN_PANELISTS: 4
    precision: "2 decimal places, round_half_up; rounding is applied twice - once per reviewer and once on the mean"
    variants:
      - name: provisional_screening_score
        when: "always maintained, from the first SCORED assignment onward; it is the number a ProgramAdmin sees mid-review and the only score available before quorum"
        difference: "untrimmed arithmetic mean over every SCORED assignment, with no quorum gate and no high/low trim"
      - name: final_panel_score
        when: "the authoritative slate number; computed only once scored_panelist_count >= Cycle.panel_quorum and nulled again if quorum is lost"
        difference: "quorum-gated, and once TRIM_MIN_PANELISTS reviewers have scored it drops exactly one highest and one lowest reviewer total before averaging, so it diverges from provisional_screening_score on identical data"
    worked_example: |
      Four SCORED reviewers on one application, panel_quorum = 2:
        R1 scores 9/8/8/7, expertise matched  -> (315+216+184+105)/10 = 82.0 * 1.00 = 82.00
        R2 scores 8/8/8/8, expertise matched  -> (280+216+184+120)/10 = 80.0 * 1.00 = 80.00
        R3 scores 9/9/8/8, expertise MISSING  -> (315+243+184+120)/10 = 86.2 * 0.90 = 77.58
        R4 scores 7/7/7/7, expertise matched  -> (245+189+161+105)/10 = 70.0 * 1.00 = 70.00
      provisional_screening_score = (82.00+80.00+77.58+70.00)/4 = 309.58/4 = 77.395 -> 77.40
      final_panel_score           = drop 82.00 and 70.00 -> (80.00+77.58)/2 = 78.79
      The two variants differ by 1.39 on identical data, and the provisional leg lands exactly on a
      half-cent (77.395) so round_half_up is observable.

  - name: slate_allocation
    trigger: "POST /cycles/{id}/lock-slate"
    algorithm: waterfall_allocation
    formula: |
      eligible = [ app for app in Application
                   where app.cycle_id == cycle.id
                     and app.status == SCORED
                     and app.final_panel_score >= cycle.slate_min_score ]
      merit_order(list) = sort by (final_panel_score DESC, created_at ASC)

      # RESERVE IS PINNED TO THE TARGET, NOT TO WHAT IS LEFT
      alumni_reserved_slots = ceil(cycle.alumni_reserve_pct * cycle.cohort_target_size)
      general_slots         = cycle.cohort_target_size - alumni_reserved_slots
      if general_slots < 0: reject with ERR_ALUMNI_RESERVE_EXCEEDS_COHORT

      selected = []          # ordered, capacity cycle.cohort_target_size
      per_discipline = {}    # discipline_code -> count already selected

      # bucket 1 - discipline minimums, disciplines walked in Discipline.code ASC order
      for d in cycle.disciplines sorted by code ASC:
          pool = merit_order([a for a in eligible if a.discipline_id == d.id and a not in selected])
          for a in pool[: d.cohort_min_slots]:
              if len(selected) == cycle.cohort_target_size: break
              selected.append(a); per_discipline[d.code] += 1
          if per_discipline[d.code] < d.cohort_min_slots:
              reject with ERR_DISCIPLINE_MINIMUM_UNFILLABLE     # empty-candidate-set edge

      # bucket 2 - alumni reserve, measured against the PINNED reserve
      alumni_selected = count(a in selected where Applicant(a).completed_residency_count >= 1)
      for a in merit_order([a for a in eligible if a not in selected
                            and Applicant(a).completed_residency_count >= 1]):
          if alumni_selected >= alumni_reserved_slots: break
          if len(selected) == cycle.cohort_target_size: break
          if per_discipline[discipline_code(a)] >= Discipline(a).cohort_max_slots: continue
          selected.append(a); alumni_selected += 1; per_discipline[discipline_code(a)] += 1

      # bucket 3 - general merit, fills whatever the first two buckets left
      for a in merit_order([a for a in eligible if a not in selected]):
          if len(selected) == cycle.cohort_target_size: break
          if per_discipline[discipline_code(a)] >= Discipline(a).cohort_max_slots: continue
          selected.append(a)

      # outcomes
      each a in selected                          -> Application SCORED -> OFFERED
      each a in eligible not in selected          -> Application SCORED -> WAITLISTED (waitlist_rank by merit_order)
      each SCORED app not in eligible             -> Application SCORED -> REJECTED
      cycle.alumni_reserved_slots = alumni_reserved_slots
    input_set: |
      Only Applications of this cycle in status SCORED are considered; SCORED applications below
      cycle.slate_min_score are rejected rather than waitlisted. Applications still in PANEL_REVIEW
      cannot be present because lock-slate requires Cycle.panel_review_complete == true.
    constants: {}
    precision: "integer slot counts; ceil() on the alumni reserve; no fractional slots"
    ordering_note: |
      Every ordering input is deterministic and non-random: merit order is (final_panel_score DESC,
      created_at ASC), discipline order is Discipline.code ASC, and no entity `id` participates in
      any decision.
    worked_example: |
      cohort_target_size = 10, alumni_reserve_pct = 0.25, two disciplines each with
      cohort_min_slots = 1 (so bucket 1 consumes 2 slots).
        alumni_reserved_slots = ceil(0.25 * 10) = 3   (pinned to the target)
        general_slots         = 10 - 3 = 7
      The reserve is NOT recomputed against the 8 slots that survive bucket 1: that reading would
      give ceil(0.25 * 8) = 2 and hand one extra slot to general merit.

  - name: cycle_stipend_ledger
    trigger: "Application OFFERED -> ACCEPTED, Residency IN_RESIDENCE -> TERMINATED, Residency SCHEDULED -> WITHDRAWN, POST /residencies/{id}/schedule, POST /residencies/{id}/stipend-schedule"
    algorithm: aggregation
    formula: |
      stipend_committed_cents = sum( r.stipend_total_cents
                                     for r in Residency where r.cycle_id == cycle.id
                                       and r.status IN {SCHEDULED, IN_RESIDENCE, COMPLETED, TERMINATED} )
      stipend_uncommitted_cents = cycle.stipend_pool_cents - stipend_committed_cents
      slots_filled_count = count( r for r in Residency where r.cycle_id == cycle.id
                                  and r.status IN {SCHEDULED, IN_RESIDENCE, COMPLETED, TERMINATED} )
      slots_open_count   = max(0, cycle.cohort_target_size - slots_filled_count)
    input_set: |
      WITHDRAWN residencies leave both the money ledger and the slot ledger entirely; TERMINATED
      residencies stay in both but with their stipend_total_cents already reduced to the
      final_settled figure. This is the conserved-quantity ledger of the money invariant.
    constants: {}
    precision: "integer cents; no rounding at this level"

  - name: residency_stipend_total
    trigger: "Application OFFERED -> ACCEPTED (provisional), POST /residencies/{id}/schedule and POST /residencies/{id}/stipend-schedule (provisional, re-based), Residency IN_RESIDENCE -> TERMINATED (final)"
    algorithm: aggregation
    formula: |
      weeks_planned = residency.session_length_weeks
                      (falls back to Application.requested_session_length_weeks before scheduling,
                       and to 0 for an invited residency that has neither yet)
      # variant provisional_award
      stipend_total_cents = residency.stipend_weekly_rate_cents * weeks_planned
      # variant final_settled
      weeks_served        = ceil( (settlement_date - residency.session_start_date + 1 day) / 7 )
      stipend_total_cents = residency.stipend_weekly_rate_cents * weeks_served
    input_set: |
      Uses only the residency's own effective weekly rate and week count. The residency's
      StipendDisbursement rows do NOT feed this number - the schedule is derived FROM it, so a
      VOIDED disbursement never double-counts.
    constants:
      MIN_SESSION_WEEKS: 4
      MAX_SESSION_WEEKS: 16
    precision: "integer cents, exact (rate x whole weeks); weeks_served uses ceil so a partial week counts as a full week"
    variants:
      - name: provisional_award
        when: "Residency.stipend_basis == PROVISIONAL, i.e. from offer acceptance until the residency completes or terminates"
        difference: "prices the FULL planned session length, so the cycle ledger commits the whole award up front"
      - name: final_settled
        when: "Residency.stipend_basis == FINAL_SETTLED, set by the IN_RESIDENCE -> TERMINATED cascade"
        difference: "prices only the ceil-rounded weeks actually served up to the settlement date, which releases the difference back to Cycle.stipend_uncommitted_cents"
    worked_example: |
      weekly rate 70000, session 2026-11-02 .. 2026-12-27 (8 weeks).
        provisional_award = 70000 * 8 = 560000
      Terminated on 2026-11-20: days served = 19 -> ceil(19/7) = 3 weeks
        final_settled     = 70000 * 3 = 210000
      The switch releases 560000 - 210000 = 350000 cents back to the cycle.

  - name: stipend_period_split
    trigger: "POST /residencies/{id}/stipend-schedule"
    algorithm: chronological
    formula: |
      weeks       = residency.session_length_weeks
      weekly_rate = weekly_rate_override_cents if supplied else Cycle.stipend_weekly_rate_cents
      period_count = ceil(weeks / STIPEND_PERIOD_WEEKS)
      remaining    = weeks
      for i in 1 .. period_count:                       # strictly ascending period_index
          weeks_in_period  = min(STIPEND_PERIOD_WEEKS, remaining)
          remaining       -= weeks_in_period
          period_start_date = residency.session_start_date + (i - 1) * STIPEND_PERIOD_WEEKS * 7 days
          period_end_date   = min(period_start_date + STIPEND_PERIOD_WEEKS * 7 - 1 days,
                                  residency.session_end_date)
          gross_cents       = weekly_rate * weeks_in_period
          emit StipendDisbursement(period_index = i, status = SCHEDULED,
                                   scheduled_by_user_id = acting X-User-ID)
      # regeneration: every existing SCHEDULED row of the residency is VOIDED first;
      # PAID and REVERSED rows are left untouched and their period_index values are reused,
      # so a regenerated schedule always restarts at period_index 1.
      residency.stipend_weekly_rate_cents = weekly_rate
      residency.stipend_total_cents       = weekly_rate * weeks     # provisional_award, re-based
    input_set: |
      Only the residency's own session dates and effective weekly rate. A residency whose weeks are
      not a multiple of STIPEND_PERIOD_WEEKS gets a short final period (e.g. 5 weeks -> 2 + 2 + 1),
      and the short period is priced at the true week count, never at a full period.
    constants:
      STIPEND_PERIOD_WEEKS: 2
    precision: "integer cents; each period is rate x whole weeks so no rounding occurs in the split itself"
    worked_example: |
      8 weeks at 70000/wk -> 4 periods of 140000 (sum 560000).
      5 weeks at 70000/wk -> 140000, 140000, 70000 (sum 350000), the third period covering one week.

  - name: stipend_withholding
    trigger: "POST /stipend-disbursements/{id}/settlement with action=PAY (variant withheld_actual), and GET /residencies/{id}/tax-report (both variants)"
    algorithm: threshold
    formula: |
      # rate selection - resident tax status, not the payment amount
      if residency.tax_form_type == 'W9':                    rate = 0.00
      elif Applicant(residency).treaty_country == true:      rate = TREATY_WITHHOLDING_RATE
      else:                                                  rate = NRA_WITHHOLDING_RATE

      # variant withheld_actual - evaluated per disbursement, in ascending period_index order
      cumulative_before = sum( d.gross_cents for d in this residency's StipendDisbursement
                               where d.status == PAID and d.period_index < this.period_index )
      cumulative_after  = cumulative_before + this.gross_cents
      taxable_slice     = max(0, cumulative_after  - WITHHOLDING_EXEMPT_THRESHOLD_CENTS)
                        - max(0, cumulative_before - WITHHOLDING_EXEMPT_THRESHOLD_CENTS)
      withholding_cents = round_half_up(taxable_slice * rate)      # to whole cents
      net_cents         = this.gross_cents - withholding_cents
      cumulative_taxable_cents = taxable_slice

      # variant statutory_liability - evaluated once over the whole year
      annual_gross      = sum( d.gross_cents for d in this residency's StipendDisbursement
                               where d.status == PAID )
      annual_taxable    = max(0, annual_gross - WITHHOLDING_EXEMPT_THRESHOLD_CENTS)
      statutory_cents   = round_half_up(annual_taxable * rate)

      reconciliation_delta_cents = sum(withholding_cents over PAID rows) - statutory_cents
    input_set: |
      Only StipendDisbursement rows in status PAID contribute to either variant. SCHEDULED rows are
      not yet income, VOIDED rows were never paid, and REVERSED rows are excluded from both ledgers
      even though their historical withholding figures remain on the row for the tax form.
      The threshold is CUMULATIVE across the residency's paid disbursements, not per disbursement,
      so a payment can be partly exempt and partly taxable.
    constants:
      WITHHOLDING_EXEMPT_THRESHOLD_CENTS: 60000
      NRA_WITHHOLDING_RATE: 0.30
      TREATY_WITHHOLDING_RATE: 0.15
    precision: "rate carries 2 decimal places; withholding is rounded to whole cents with round_half_up at the point the rate is applied"
    variants:
      - name: withheld_actual
        when: "computed on every PAY call and summed into Residency.withholding_to_date_cents; this is the money actually held back"
        difference: "applies the rate to each disbursement's taxable slice and rounds EACH result to whole cents before summing"
      - name: statutory_liability
        when: "computed by GET /residencies/{id}/tax-report as the year-end 1042-S / W-9 liability line"
        difference: "applies the rate ONCE to the annual taxable base and rounds ONCE, so it can differ from the sum of the per-payment roundings; the gap is reported as reconciliation_delta_cents (positive = over-withheld)"
    worked_example: |
      Treaty 1042S resident, weekly_rate_override_cents = 43751, 8 weeks -> 4 periods of 87502
      (annual gross 350008), rate 0.15:
        D1 cum 0 -> 87502     taxable 27502  withholding round_half_up(4125.30)  =  4125
        D2 cum 87502 -> 175004  taxable 87502  withholding round_half_up(13125.30) = 13125
        D3 taxable 87502  -> 13125
        D4 taxable 87502  -> 13125
        withheld_actual total = 43500
        statutory_liability  = round_half_up((350008 - 60000) * 0.15) = round_half_up(43501.20) = 43501
        reconciliation_delta_cents = 43500 - 43501 = -1
      Threshold boundary, NRA resident, override 15000, 8 weeks -> 4 periods of 30000, rate 0.30:
        D1 cum 0 -> 30000      taxable 0      withholding 0
        D2 cum 30000 -> 60000  taxable 0      withholding 0   <-- cumulative EXACTLY at the threshold
        D3 cum 60000 -> 90000  taxable 30000  withholding 9000
        D4 taxable 30000 -> 9000
      At exactly WITHHOLDING_EXEMPT_THRESHOLD_CENTS the withholding is still 0; only the first cent
      ABOVE the threshold is taxable.

  - name: visa_timeline
    trigger: "VisaCase creation (INITIATED), POST /residencies/{id}/schedule, POST /visa-cases/{id}/adjudication with action=FILE, and every GET of a VisaCase"
    algorithm: forward_looking
    formula: |
      if residency.session_start_date is null:
          backlog_days = as below; filing_deadline_date = null; earliest_entry_date = null
                                    days_to_filing_deadline = null
      backlog_days = VISA_BACKLOG_DAYS_HIGH_VOLUME
                     if Applicant(residency).citizenship_country in HIGH_VOLUME_VISA_COUNTRIES
                     else VISA_BACKLOG_DAYS_DEFAULT
      filing_deadline_date    = residency.session_start_date - (VISA_LEAD_DAYS + backlog_days) days
      earliest_entry_date     = residency.session_start_date - VISA_EARLIEST_ENTRY_LEAD_DAYS days
      days_to_filing_deadline = filing_deadline_date - date(logical clock now)
      case_type = 'J1_RESEARCH_SCHOLAR' if residency.session_length_weeks >= VISA_J1_MIN_SESSION_WEEKS
                  else 'B1_SHORT_TERM'
      # filing window, enforced on action=FILE
      require date(now) <= filing_deadline_date
      require date(now) <= consulate_appointment_date <= earliest_entry_date
    input_set: |
      Derived entirely from the sponsored Residency's session_start_date / session_length_weeks and
      the Applicant's citizenship_country. Rescheduling a residency re-derives every field, which can
      move a case from inside its filing window to outside it without the case itself being touched.
    constants:
      VISA_LEAD_DAYS: 90
      VISA_EARLIEST_ENTRY_LEAD_DAYS: 30
      VISA_BACKLOG_DAYS_DEFAULT: 21
      VISA_BACKLOG_DAYS_HIGH_VOLUME: 45
      HIGH_VOLUME_VISA_COUNTRIES: ["IN", "CN", "NG", "BR"]
      VISA_J1_MIN_SESSION_WEEKS: 9
    precision: "whole calendar days; all dates are YYYY-MM-DD in UTC"
    worked_example: |
      session_start_date 2026-11-02:
        citizenship IN (high volume) -> backlog 45 -> filing_deadline_date = 2026-11-02 - 135d = 2026-06-20
        citizenship FR (default)     -> backlog 21 -> filing_deadline_date = 2026-11-02 - 111d = 2026-07-14
        earliest_entry_date          = 2026-11-02 - 30d = 2026-10-03
      An 8-week session is B1_SHORT_TERM (8 < 9); a 9-week session is J1_RESEARCH_SCHOLAR.

  - name: studio_auto_selection
    trigger: "POST /studio-assignments when studio_id is omitted"
    algorithm: selector_policy
    formula: |
      d = the Discipline whose code == residency.discipline_code within residency.cycle_id
      # -- eligibility filter (all clauses required) --
      candidates = [ s for s in Studio where
            s.status == 'AVAILABLE'
        and set(d.required_capability_tags) is a subset of set(s.capability_tags)
        and VENTILATION_RANK[s.ventilation_class] >= VENTILATION_RANK[d.required_ventilation_class]
        and (residency did not declare hazardous materials
             or VENTILATION_RANK[s.ventilation_class] >= VENTILATION_RANK['FUME_HOOD'])
        and ( s.max_concurrent_residents == 1
              and no_interval_conflict(s, requested start_date, requested end_date)
              or s.max_concurrent_residents > 1
              and concurrent_active_assignments(s, requested window) + 1 <= s.max_concurrent_residents ) ]
      # -- ranking (ascending on every key: prefer the LEAST over-provisioned studio) --
      candidates sorted by ( VENTILATION_RANK[s.ventilation_class] ASC,
                             len(s.capability_tags)                ASC,
                             s.max_concurrent_residents            ASC,
                             s.code                                ASC )   # deterministic tie-break
      # -- fallback --
      if candidates is empty: reject with ERR_NO_STUDIO_AVAILABLE (409)
      chosen = candidates[0]; selection_mode = 'AUTO_SELECTED'

      # interval semantics used by no_interval_conflict - CLOSED interval PLUS a turnaround buffer
      # existing ACTIVE assignment a on studio s blocks [a.start_date, a.end_date + STUDIO_TURNAROUND_DAYS]
      no_interval_conflict(s, start, end) is false when, for any ACTIVE a on s,
            start <= (a.end_date + STUDIO_TURNAROUND_DAYS) and (end + STUDIO_TURNAROUND_DAYS) >= a.start_date
      # the buffered-closed rule governs SINGLE-OCCUPANCY studios only; a shared studio
      # (max_concurrent_residents > 1) instead admits overlapping tenants up to its headcount, so a
      # studio's own capacity selects which of the two interval semantics applies to it
    input_set: |
      Only Studio rows in status AVAILABLE (MAINTENANCE and DECOMMISSIONED are never candidates) and
      only StudioAssignment rows in status ACTIVE (RELEASED rows free their window immediately).
    constants:
      VENTILATION_RANK: { NONE: 0, LOCAL: 1, FUME_HOOD: 2 }
      STUDIO_TURNAROUND_DAYS: 2
    precision: "whole calendar days; ranking keys are integers and a string code, never a random id"
    ordering_note: |
      The tie-break is Studio.code ASC, an operator-assigned business key. Studio.id (a random
      identifier) is never consulted; when two studios are identical on every ranking key the winner
      is fully predictable from the codes alone.
    worked_example: |
      A studio holding an ACTIVE assignment 2026-11-02 .. 2026-12-27 is blocked through 2026-12-29
      once STUDIO_TURNAROUND_DAYS is added, so a request starting 2026-12-29 conflicts and an
      otherwise identical request starting 2026-12-30 does not.

  - name: housing_occupancy
    trigger: "POST /housing-assignments, HousingAssignment ACTIVE -> RELEASED, and every GET of a HousingUnit"
    algorithm: interval_merge
    formula: |
      # HALF-OPEN interval [check_in_date, check_out_date) - deliberately different from studios
      bed_nights = check_out_date - check_in_date            # in whole days
      overlap(x, y) is true when x.check_in_date < y.check_out_date
                              and y.check_in_date < x.check_out_date
      # adjacency is NOT a conflict: one resident checking out on date D and another checking in on
      # date D share no night, and there is no turnaround buffer on housing.
      concurrent_nights(unit, window) = for each night n in the requested window,
            count of ACTIVE HousingAssignment on unit whose half-open interval contains n
      require max over n of concurrent_nights(unit, window) < unit.bed_count   # aggregate capacity
      # the half-open overlap predicate governs SINGLE-BED units only (bed_count == 1), where any shared
      # night is a conflict; a multi-bed unit instead admits overlapping tenants up to bed_count, so a
      # unit's own bed_count selects which of the two rules applies to it
      occupied_bed_nights = sum( a.bed_nights for a in HousingAssignment
                                 where a.housing_unit_id == unit.id and a.status == ACTIVE )
      # meal plan gate
      if meal_plan_selected and not unit.meal_plan_included: reject ERR_MEAL_PLAN_NOT_AVAILABLE
    input_set: "Only HousingAssignment rows in status ACTIVE occupy beds; RELEASED rows release their nights immediately."
    constants: {}
    precision: "whole nights; the check_out_date night is never counted"
    worked_example: |
      An ACTIVE assignment 2026-11-02 .. 2026-12-28 occupies 56 bed-nights (nights of 11-02 through
      12-27). On a 1-bed unit a new request checking in 2026-12-28 is accepted (adjacent, no shared
      night) while one checking in 2026-12-27 is rejected - the exact opposite boundary from the
      closed-plus-buffer studio rule.

  - name: obligation_provisioning
    trigger: "POST /residencies/{id}/schedule (once session_length_weeks is known)"
    algorithm: aggregation
    formula: |
      weeks = residency.session_length_weeks
      emit Obligation(OPEN_STUDIO,       required_count = OBLIGATION_BASE_OPEN_STUDIO)
      emit Obligation(EXHIBITION,        required_count = OBLIGATION_BASE_EXHIBITION)
      emit Obligation(ARTIST_TALK,       required_count = OBLIGATION_BASE_ARTIST_TALK)
      workshops = floor(weeks / OBLIGATION_WORKSHOP_WEEKS_PER_UNIT)
      if workshops >= 1:
          emit Obligation(COMMUNITY_WORKSHOP, required_count = workshops)
      every emitted row: status = PENDING, completed_count = 0, total_attendance = 0,
                         due_date = residency.session_end_date
      # rescheduling does not duplicate rows: an existing PENDING row of the same obligation_type
      # has its required_count and due_date re-derived in place.
    input_set: "Only the residency's own session_length_weeks and session_end_date; SATISFIED, WAIVED and BREACHED rows are never re-derived."
    constants:
      OBLIGATION_BASE_OPEN_STUDIO: 1
      OBLIGATION_BASE_EXHIBITION: 1
      OBLIGATION_BASE_ARTIST_TALK: 1
      OBLIGATION_WORKSHOP_WEEKS_PER_UNIT: 4
    precision: "integer counts; floor() on the workshop derivation"
    worked_example: |
      An 8-week residency gets 4 obligations with required_count 1, 1, 1 and floor(8/4) = 2,
      so obligations_required_total = 5. A 5-week residency gets floor(5/4) = 1 workshop
      (obligations_required_total = 4), and a 4-week residency also gets exactly 1.

  - name: funder_outcome_metrics
    trigger: "GET /cycles/{id}/funder-outcome-report"
    algorithm: projection
    formula: |
      residencies = [ r for r in Residency where r.cycle_id == cycle.id ]
      awarded_count    = count(r where r.status IN {SCHEDULED, IN_RESIDENCE, COMPLETED, TERMINATED})
      completed_count  = count(r where r.status == COMPLETED)
      terminated_count = count(r where r.status == TERMINATED)
      withdrawn_count  = count(r where r.status == WITHDRAWN)
      completion_rate_pct = round_half_up(100 * completed_count / awarded_count, 2)
                            if awarded_count > 0 else null
      international_share_pct = round_half_up(100 * count(r where r.visa_required) / awarded_count, 2)
                                if awarded_count > 0 else null
      obligation_fulfilment_pct = round_half_up(
            100 * sum(r.obligations_completed_total) / sum(r.obligations_required_total), 2)
            if sum(r.obligations_required_total) > 0 else null
      total_attendance      = sum( o.total_attendance for o in Obligation of these residencies )
      stipend_paid_cents    = sum( r.stipend_paid_gross_cents )
      withholding_cents     = sum( r.withholding_to_date_cents )
      follow_on_count       = count(r where r.predecessor_residency_id is not null)
      alumni_share_pct      = round_half_up(100 * count(r where
                                Applicant(r).completed_residency_count >= 1) / awarded_count, 2)
                              if awarded_count > 0 else null
      breached_obligation_count = sum( r.obligations_breached_count )
    input_set: |
      WITHDRAWN residencies are counted in withdrawn_count but excluded from awarded_count and from
      every rate that divides by it, so a withdrawal changes both the numerator and the denominator.
      Obligation percentages exclude WAIVED rows because they are already out of both residency sums.
    constants: {}
    precision: "percentages to 2 decimal places, round_half_up; money in integer cents; null rather than 0 when the denominator is 0"

# =============================================================================
# 1.4 Validation Rules Table (Ordered by Priority)
# =============================================================================
# Domain priority order, after the standard auth -> existence -> shape -> state prefix:
#   safety / compliance  ->  referential (cross-entity) ->  temporal  ->  constraint
#   ->  capacity & fiscal (last)
# Rationale: a resident who has not finished equipment training must be told about the training,
# not about a calendar clash; a residency that is not even scheduled must be told that before it is
# told about a meal plan; and money is always the last thing checked, so an ineligible offer is
# reported as an offer problem rather than as a budget problem.
#
# Deliberate priority-conflict pairs (a single request violates both; the lower priority wins):
#   P22 ERR_APPLICATION_NOT_OFFERED (state)             <  P71 ERR_STIPEND_POOL_EXHAUSTED (business_fiscal)
#   P35 ERR_COMPLIANCE_SUSPENDED   (business_safety)    <  P46 ERR_STUDIO_INTERVAL_CONFLICT (business_temporal)
#   P26 ERR_RESIDENCY_NOT_SCHEDULED (state)             <  P57 ERR_MEAL_PLAN_NOT_AVAILABLE (business_constraint)
validations:

  - priority: 1
    category: auth
    check: "X-User-ID header is present and non-empty on every request"
    error_id: ERR_MISSING_USER_ID
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "X-User-Role header is present and is one of {ProgramAdmin, Applicant, Panelist, PanelChair, FinanceOfficer, VisaCoordinator, FacilitiesManager, Funder}"
    error_id: ERR_INVALID_ROLE
    http_status: 401
    applies_to: all

  - priority: 3
    category: auth
    check: "the X-User-Role is permitted to perform this operation per the §1.7 RBAC matrix"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 4
    category: auth
    check: "for the entity-backed roles Applicant, Panelist and PanelChair, X-User-ID resolves to an existing row of the backing entity (Applicant / Panelist / Panelist)"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all endpoints whose allowed roles include Applicant, Panelist or PanelChair"

  - priority: 5
    category: auth
    check: "a PanelChair's backing Panelist row has chair_eligible == true"
    error_id: ERR_CHAIR_NOT_ELIGIBLE
    http_status: 403
    applies_to: "POST /cycles/{id}/lock-slate"

  - priority: 6
    category: existence
    check: "every resource named by a path parameter exists, validated left to right"
    error_id: "ERR_CYCLE_NOT_FOUND | ERR_DISCIPLINE_NOT_FOUND | ERR_APPLICANT_NOT_FOUND | ERR_APPLICATION_NOT_FOUND | ERR_PORTFOLIO_ITEM_NOT_FOUND | ERR_PANELIST_NOT_FOUND | ERR_PANEL_ASSIGNMENT_NOT_FOUND | ERR_RESIDENCY_NOT_FOUND | ERR_STUDIO_NOT_FOUND | ERR_STUDIO_ASSIGNMENT_NOT_FOUND | ERR_HOUSING_UNIT_NOT_FOUND | ERR_HOUSING_ASSIGNMENT_NOT_FOUND | ERR_VISA_CASE_NOT_FOUND | ERR_DISBURSEMENT_NOT_FOUND | ERR_OBLIGATION_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path parameters"

  - priority: 7
    category: existence
    check: "every foreign key supplied in the request body resolves to an existing row, validated in declaration order"
    error_id: "ERR_CYCLE_NOT_FOUND | ERR_DISCIPLINE_NOT_FOUND | ERR_APPLICANT_NOT_FOUND | ERR_APPLICATION_NOT_FOUND | ERR_PANELIST_NOT_FOUND | ERR_RESIDENCY_NOT_FOUND | ERR_STUDIO_NOT_FOUND | ERR_HOUSING_UNIT_NOT_FOUND"
    http_status: 404
    applies_to: "POST /disciplines, POST /applications, POST /portfolio-items, POST /panel-assignments, POST /residencies, POST /studio-assignments, POST /housing-assignments, POST /visa-cases"

  - priority: 8
    category: business_constraint
    check: "every required body field is present with the declared JSON type; unknown enum members, wrong types and malformed YYYY-MM-DD / ISO-8601 values are rejected"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all POST, PUT and PATCH endpoints"

  - priority: 9
    category: business_constraint
    check: "declared numeric and string range constraints hold (rubric scores in [0,10], file_size_mb in (0,200], alumni_reserve_pct in [0,1], panel_quorum >= 2, session lengths in [MIN_SESSION_WEEKS, MAX_SESSION_WEEKS], close_at strictly after open_at, end_date >= start_date, check_out_date strictly after check_in_date)"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all POST, PUT and PATCH endpoints"

  - priority: 10
    category: business_constraint
    check: "pagination limit is in [1,100] and offset is >= 0"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all list endpoints"

  - priority: 11
    category: business_constraint
    check: "business keys are unique in their scope: Cycle.code, Applicant.email, Panelist.email, Studio.code, HousingUnit.code globally, and Discipline.code per cycle_id"
    error_id: ERR_DUPLICATE_CODE
    http_status: 409
    applies_to: "POST /cycles, POST /applicants, POST /panelists, POST /studios, POST /housing-units, POST /disciplines"

  - priority: 12
    category: business_referential
    check: "the Discipline named by discipline_id belongs to the Cycle named by cycle_id"
    error_id: ERR_DISCIPLINE_CYCLE_MISMATCH
    http_status: 422
    applies_to: "POST /applications"

  - priority: 13
    category: state
    check: "the supplied expected_<parent>_version equals the parent's current version (see §1.2.1)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /studio-assignments, POST /housing-assignments, POST /residencies/{id}/stipend-schedule"

  - priority: 14
    category: auth
    check: "an acting Applicant is the applicant_id of the Application or Residency being operated on"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "PATCH /applications/{id}, POST /applications/{id}/submit, POST /applications/{id}/offer-response, POST /portfolio-items, DELETE /portfolio-items/{id}, POST /residencies/{id}/lifecycle with action=WITHDRAW"

  - priority: 15
    category: auth
    check: "an acting Panelist is the panelist_id of the PanelAssignment being operated on"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "POST /panel-assignments/{id}/scores, POST /panel-assignments/{id}/declare-conflict"

  - priority: 16
    category: state
    check: "the requested Cycle stage transition is an edge of the Cycle state machine"
    error_id: ERR_CYCLE_STAGE_INVALID
    http_status: 409
    applies_to: "POST /cycles/{id}/stage, POST /cycles/{id}/lock-slate"

  - priority: 17
    category: state
    check: "Cycle.status == OPEN when an Application is created or first submitted, and Discipline rows may only be created or updated while Cycle.status == DRAFT"
    error_id: ERR_CYCLE_NOT_OPEN
    http_status: 409
    applies_to: "POST /applications, POST /applications/{id}/submit, POST /disciplines"

  - priority: 18
    category: state
    check: "the Cycle is in the stage the operation requires: SCREENING for screening decisions and for a REVISION_REQUESTED resubmission, PANEL_REVIEW for panel assignment / scoring / conflict declaration, SLATE_LOCKED for offer responses and waitlist promotion"
    error_id: ERR_CYCLE_STAGE_INVALID
    http_status: 409
    applies_to: "POST /applications/{id}/screening-decision, POST /applications/{id}/submit, POST /panel-assignments, POST /panel-assignments/{id}/scores, POST /panel-assignments/{id}/declare-conflict, POST /applications/{id}/offer-response"

  - priority: 19
    category: state
    check: "the Application is in a status from which the requested transition is an edge of the Application state machine"
    error_id: ERR_APPLICATION_STATE_INVALID
    http_status: 409
    applies_to: "POST /applications/{id}/submit, POST /applications/{id}/screening-decision, PATCH /applications/{id}, POST /panel-assignments"

  - priority: 20
    category: state
    check: "an Application in a terminal status (REJECTED, ACCEPTED, DECLINED) accepts no further transitions and no mutation of its fields"
    error_id: ERR_APPLICATION_STATE_INVALID
    http_status: 409
    applies_to: "POST /applications/{id}/submit, POST /applications/{id}/screening-decision, POST /applications/{id}/offer-response, PATCH /applications/{id}"

  - priority: 21
    category: state
    check: "Application.revision_round < MAX_REVISION_ROUNDS before a REQUEST_REVISION decision"
    error_id: ERR_REVISION_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /applications/{id}/screening-decision"

  - priority: 22
    category: state
    check: "Application.status == OFFERED before an offer response is recorded"
    error_id: ERR_APPLICATION_NOT_OFFERED
    http_status: 409
    applies_to: "POST /applications/{id}/offer-response"
    conflict_note: "beats P71 ERR_STIPEND_POOL_EXHAUSTED - an ACCEPT on a WAITLISTED application whose stipend also would not fit the pool is reported as an offer-state problem, never as a budget problem"

  - priority: 23
    category: state
    check: "Application.status == WAITLISTED before a PROMOTE_FROM_WAITLIST decision"
    error_id: ERR_APPLICATION_STATE_INVALID
    http_status: 409
    applies_to: "POST /applications/{id}/screening-decision"

  - priority: 24
    category: state
    check: "the PanelAssignment is in a status from which the requested transition is an edge (ASSIGNED or SCORED); VACATED and CONFLICT_DECLARED are terminal for scoring, and an ACTIVE-only release target must still be ACTIVE"
    error_id: ERR_ASSIGNMENT_STATE_INVALID
    http_status: 409
    applies_to: "POST /panel-assignments/{id}/scores, POST /panel-assignments/{id}/declare-conflict"

  - priority: 25
    category: state
    check: "the Panelist being assigned or scoring has status == ACTIVE (a RECUSED_FOR_CYCLE panelist is frozen for that cycle)"
    error_id: ERR_PANELIST_RECUSED
    http_status: 409
    applies_to: "POST /panel-assignments, POST /panel-assignments/{id}/scores"

  - priority: 26
    category: state
    check: "Residency.status == SCHEDULED for scheduling, stipend-schedule generation, visa document / adjudication work, housing assignment, obligation waiver and withdrawal"
    error_id: ERR_RESIDENCY_NOT_SCHEDULED
    http_status: 409
    applies_to: "POST /residencies/{id}/schedule, POST /residencies/{id}/stipend-schedule, POST /housing-assignments, POST /visa-cases/{id}/docs, POST /visa-cases/{id}/adjudication, POST /residencies/{id}/lifecycle with action=WITHDRAW"
    conflict_note: "beats P57 ERR_MEAL_PLAN_NOT_AVAILABLE - a housing request naming a no-meal unit for an already IN_RESIDENCE residency is reported as a residency-state problem"

  - priority: 27
    category: state
    check: "the requested Residency lifecycle action is an edge of the Residency status machine from its current status, and the three terminal statuses COMPLETED, TERMINATED and WITHDRAWN accept none"
    error_id: ERR_RESIDENCY_STATE_INVALID
    http_status: 409
    applies_to: "POST /residencies/{id}/lifecycle, POST /residencies/{id}/compliance, POST /residencies/{id}/trainings, POST /studio-assignments"

  - priority: 28
    category: state
    check: "the requested VisaCase transition is an edge of the VisaCase machine from its current status; APPROVED and DENIED are terminal"
    error_id: ERR_VISA_STATE_INVALID
    http_status: 409
    applies_to: "POST /visa-cases/{id}/docs, POST /visa-cases/{id}/adjudication"

  - priority: 29
    category: state
    check: "the requested StipendDisbursement settlement action is an edge of its machine (PAY and VOID require SCHEDULED, REVERSE requires PAID)"
    error_id: ERR_DISBURSEMENT_STATE_INVALID
    http_status: 409
    applies_to: "POST /stipend-disbursements/{id}/settlement"

  - priority: 30
    category: state
    check: "Obligation.status == PENDING before completions are logged or the obligation is waived"
    error_id: ERR_OBLIGATION_NOT_PENDING
    http_status: 409
    applies_to: "POST /obligations/{id}/progress"

  - priority: 31
    category: state
    check: "the StudioAssignment or HousingAssignment being released has status == ACTIVE"
    error_id: ERR_ASSIGNMENT_STATE_INVALID
    http_status: 409
    applies_to: "POST /studio-assignments/{id}/release, POST /housing-assignments/{id}/release"

  - priority: 32
    category: state
    check: "an explicitly named Studio has status == AVAILABLE, and a named HousingUnit has status == AVAILABLE"
    error_id: ERR_FACILITY_UNAVAILABLE
    http_status: 409
    applies_to: "POST /studio-assignments, POST /housing-assignments"

  - priority: 33
    category: business_safety
    check: "the training_type being recorded is a member of Residency.required_training_types"
    error_id: ERR_TRAINING_TYPE_NOT_REQUIRED
    http_status: 422
    applies_to: "POST /residencies/{id}/trainings"

  - priority: 34
    category: business_safety
    check: "Residency.compliance_status == CLEARED before check-in, and every member of required_training_types is covered before a REINSTATE"
    error_id: ERR_TRAINING_NOT_COMPLETE
    http_status: 422
    applies_to: "POST /residencies/{id}/lifecycle with action=CHECK_IN, POST /residencies/{id}/compliance with action=REINSTATE"

  - priority: 35
    category: business_safety
    check: "Residency.compliance_status != SUSPENDED when a studio is assigned or a disbursement is paid"
    error_id: ERR_COMPLIANCE_SUSPENDED
    http_status: 422
    applies_to: "POST /studio-assignments, POST /stipend-disbursements/{id}/settlement with action=PAY"
    conflict_note: "beats P46 ERR_STUDIO_INTERVAL_CONFLICT on POST /studio-assignments - safety before scheduling: a suspended resident is told about the suspension even when the window they asked for was never bookable"

  - priority: 36
    category: business_safety
    check: "the studio's capability_tags are a superset of the residency discipline's required_capability_tags"
    error_id: ERR_STUDIO_CAPABILITY_MISMATCH
    http_status: 422
    applies_to: "POST /studio-assignments"

  - priority: 37
    category: business_safety
    check: "VENTILATION_RANK[studio.ventilation_class] >= VENTILATION_RANK[discipline.required_ventilation_class], and >= VENTILATION_RANK['FUME_HOOD'] whenever the source application declared hazardous materials"
    error_id: ERR_VENTILATION_INSUFFICIENT
    http_status: 422
    applies_to: "POST /studio-assignments"

  - priority: 38
    category: business_referential
    check: "when Residency.visa_required == true, the residency's VisaCase.status == APPROVED before check-in"
    error_id: ERR_VISA_NOT_APPROVED
    http_status: 422
    applies_to: "POST /residencies/{id}/lifecycle with action=CHECK_IN"

  - priority: 39
    category: business_referential
    check: "a VisaCase may only be created for a Residency whose visa_required == true, and at most one VisaCase may exist per residency"
    error_id: ERR_VISA_NOT_REQUIRED
    http_status: 422
    applies_to: "POST /visa-cases"

  - priority: 40
    category: business_referential
    check: "on a SUBMIT docs action the supplied doc_list covers every member of VisaCase.requested_doc_list"
    error_id: ERR_VISA_DOCS_INCOMPLETE
    http_status: 422
    applies_to: "POST /visa-cases/{id}/docs"

  - priority: 41
    category: business_referential
    check: "when predecessor_residency_id is supplied it names a Residency with status == COMPLETED whose applicant_id equals the new residency's applicant_id; when discipline_id is supplied its cycle_id equals the new residency's cycle_id"
    error_id: ERR_PREDECESSOR_NOT_COMPLETED
    http_status: 422
    applies_to: "POST /residencies"

  - priority: 42
    category: business_temporal
    check: "date(logical clock now) lies within the inclusive window [Cycle.open_at, Cycle.close_at] on a first submission"
    error_id: ERR_SUBMISSION_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /applications/{id}/submit"

  - priority: 43
    category: business_temporal
    check: "session_length_weeks is a member of Cycle.session_length_options_weeks"
    error_id: ERR_SESSION_LENGTH_NOT_OFFERED
    http_status: 422
    applies_to: "POST /applications, POST /residencies/{id}/schedule"

  - priority: 44
    category: business_temporal
    check: "session_start_date is not earlier than date(logical clock now)"
    error_id: ERR_SESSION_START_IN_PAST
    http_status: 422
    applies_to: "POST /residencies/{id}/schedule"

  - priority: 45
    category: business_temporal
    check: "a studio or housing window lies inside the residency session: start_date >= session_start_date and end_date <= session_end_date for studios, check_in_date >= session_start_date and check_out_date <= session_end_date + 1 day for housing"
    error_id: ERR_ASSIGNMENT_OUTSIDE_SESSION
    http_status: 422
    applies_to: "POST /studio-assignments, POST /housing-assignments"

  - priority: 46
    category: business_temporal
    check: "on a SINGLE-OCCUPANCY studio (Studio.max_concurrent_residents == 1) the requested window does not
      overlap any ACTIVE StudioAssignment of that studio under CLOSED-interval semantics extended by
      STUDIO_TURNAROUND_DAYS on each existing assignment. Shared studios (max_concurrent_residents > 1) are
      exempt from this check and are governed by the aggregate headcount rule at P68 instead"
    error_id: ERR_STUDIO_INTERVAL_CONFLICT
    http_status: 409
    applies_to: "POST /studio-assignments"

  - priority: 47
    category: business_temporal
    check: "on a SINGLE-BED housing unit (HousingUnit.bed_count == 1) the requested window does not
      overlap the unit's ACTIVE HousingAssignment under HALF-OPEN [check_in_date, check_out_date)
      semantics with no buffer, and adjacency (one resident's check_out_date equal to another's
      check_in_date) is explicitly allowed. Multi-bed units (bed_count > 1) are exempt from this check
      and are governed by the aggregate bed-night rule at P69 instead"
    error_id: ERR_HOUSING_INTERVAL_CONFLICT
    http_status: 409
    applies_to: "POST /housing-assignments"

  - priority: 48
    category: business_temporal
    check: "date(logical clock now) <= VisaCase.filing_deadline_date on a FILE action"
    error_id: ERR_VISA_FILING_DEADLINE_PASSED
    http_status: 422
    applies_to: "POST /visa-cases/{id}/adjudication"

  - priority: 49
    category: business_temporal
    check: "date(logical clock now) <= consulate_appointment_date <= VisaCase.earliest_entry_date on a FILE action"
    error_id: ERR_CONSULATE_DATE_OUT_OF_WINDOW
    http_status: 422
    applies_to: "POST /visa-cases/{id}/adjudication"

  - priority: 50
    category: business_temporal
    check: "every StipendDisbursement of the same residency with a lower period_index has already left status SCHEDULED before this row may be paid"
    error_id: ERR_DISBURSEMENT_OUT_OF_ORDER
    http_status: 409
    applies_to: "POST /stipend-disbursements/{id}/settlement"

  - priority: 51
    category: business_constraint
    check: "Application.portfolio_item_count lies within [Discipline.portfolio_min_items, Discipline.portfolio_max_items] at submission, and adding an item would not exceed portfolio_max_items"
    error_id: ERR_PORTFOLIO_ITEM_COUNT
    http_status: 422
    applies_to: "POST /applications/{id}/submit, POST /portfolio-items"

  - priority: 52
    category: business_constraint
    check: "every member of Discipline.required_media_types appears at least once among the application's portfolio items at submission"
    error_id: ERR_PORTFOLIO_MEDIA_MISSING
    http_status: 422
    applies_to: "POST /applications/{id}/submit"

  - priority: 53
    category: business_constraint
    check: "Application.fee_status IN {PAID, WAIVED} at submission"
    error_id: ERR_FEE_UNSETTLED
    http_status: 422
    applies_to: "POST /applications/{id}/submit"

  - priority: 54
    category: business_constraint
    check: "a WAIVE fee resolution requires Application.fee_waiver_requested == true and Applicant.declared_annual_income_cents <= FEE_WAIVER_INCOME_CEILING_CENTS"
    error_id: ERR_FEE_WAIVER_NOT_ELIGIBLE
    http_status: 422
    applies_to: "POST /applications/{id}/fee-resolution"

  - priority: 55
    category: business_constraint
    check: "Application.fee_status == PENDING before a fee resolution is recorded"
    error_id: ERR_FEE_ALREADY_SETTLED
    http_status: 409
    applies_to: "POST /applications/{id}/fee-resolution"

  - priority: 56
    category: business_constraint
    check: "at most one Application per (cycle_id, applicant_id) pair, and at most one PanelAssignment per (application_id, panelist_id) pair"
    error_id: ERR_DUPLICATE_ASSOCIATION
    http_status: 409
    applies_to: "POST /applications, POST /panel-assignments"

  - priority: 57
    category: business_constraint
    check: "meal_plan_selected may only be true when the named HousingUnit has meal_plan_included == true"
    error_id: ERR_MEAL_PLAN_NOT_AVAILABLE
    http_status: 422
    applies_to: "POST /housing-assignments"

  - priority: 58
    category: business_constraint
    check: "a Panelist whose affiliation_org equals the Applicant's affiliation_org may not record scores; the shared affiliation must be resolved through declare-conflict first"
    error_id: ERR_AFFILIATION_CONFLICT
    http_status: 422
    applies_to: "POST /panel-assignments/{id}/scores"

  - priority: 59
    category: business_constraint
    check: "the acting PanelChair's X-User-ID is not the panelist_id of any PanelAssignment in this cycle whose status IN {SCORED, CONFLICT_DECLARED}; the FinanceOfficer paying a disbursement is not its scheduled_by_user_id; the FinanceOfficer reversing a disbursement is not its paid_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /cycles/{id}/lock-slate, POST /stipend-disbursements/{id}/settlement"

  - priority: 60
    category: business_constraint
    check: "Cycle.panel_review_complete == true before the slate is locked"
    error_id: ERR_PANEL_REVIEW_INCOMPLETE
    http_status: 409
    applies_to: "POST /cycles/{id}/lock-slate"

  - priority: 61
    category: business_constraint
    check: "for every Discipline of the cycle, at least cohort_min_slots slate-eligible Applications exist when the slate is allocated (the empty-candidate-set edge)"
    error_id: ERR_DISCIPLINE_MINIMUM_UNFILLABLE
    http_status: 422
    applies_to: "POST /cycles/{id}/lock-slate"

  - priority: 62
    category: business_constraint
    check: "ceil(alumni_reserve_pct * cohort_target_size) <= cohort_target_size when the slate is allocated"
    error_id: ERR_ALUMNI_RESERVE_EXCEEDS_COHORT
    http_status: 422
    applies_to: "POST /cycles/{id}/lock-slate"

  - priority: 63
    category: business_constraint
    check: "the sum of Discipline.cohort_min_slots over the cycle's disciplines is <= Cycle.cohort_target_size, and at least one Discipline exists, before the cycle opens"
    error_id: ERR_COHORT_MINIMUMS_EXCEED_TARGET
    http_status: 422
    applies_to: "POST /cycles/{id}/stage"

  - priority: 64
    category: business_constraint
    check: "at least one Studio survives the eligibility filter when studio_id is omitted from the create request"
    error_id: ERR_NO_STUDIO_AVAILABLE
    http_status: 409
    applies_to: "POST /studio-assignments"

  - priority: 65
    category: business_constraint
    check: "Residency.obligations_breached_count == 0 before the highest-period_index disbursement of a residency may be paid"
    error_id: ERR_OBLIGATIONS_OUTSTANDING
    http_status: 422
    applies_to: "POST /stipend-disbursements/{id}/settlement"

  - priority: 66
    category: business_constraint
    check: "Residency.session_start_date is not null (the residency has been scheduled) before a stipend schedule, studio assignment, housing assignment or visa filing is attempted"
    error_id: ERR_RESIDENCY_NOT_SCHEDULED
    http_status: 409
    applies_to: "POST /residencies/{id}/stipend-schedule, POST /studio-assignments, POST /housing-assignments, POST /visa-cases/{id}/adjudication"

  - priority: 67
    category: business_constraint
    check: "a Residency may not be rescheduled once any StipendDisbursement of it has status == PAID"
    error_id: ERR_RESIDENCY_ALREADY_PAID
    http_status: 409
    applies_to: "POST /residencies/{id}/schedule"

  - priority: 68
    category: business_fiscal
    check: "on a SHARED studio (Studio.max_concurrent_residents > 1) the number of ACTIVE StudioAssignment rows
      covering any single date of the requested window, counting the request itself, is <= Studio.max_concurrent_residents;
      each individual overlap is legal, but collectively they exceed the studio's headcount"
    error_id: ERR_STUDIO_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /studio-assignments"

  - priority: 69
    category: business_fiscal
    check: "the aggregate number of ACTIVE HousingAssignment rows covering any single night of the requested window is < HousingUnit.bed_count"
    error_id: ERR_HOUSING_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /housing-assignments"

  - priority: 70
    category: business_fiscal
    check: "Cycle.slots_open_count >= 1 before an offer is accepted or a waitlisted application is promoted"
    error_id: ERR_NO_SLOTS_AVAILABLE
    http_status: 409
    applies_to: "POST /applications/{id}/offer-response, POST /applications/{id}/screening-decision"

  - priority: 71
    category: business_fiscal
    check: "Cycle.stipend_uncommitted_cents >= the stipend this operation would commit (requested_session_length_weeks * effective weekly rate)"
    error_id: ERR_STIPEND_POOL_EXHAUSTED
    http_status: 409
    applies_to: "POST /applications/{id}/offer-response, POST /residencies/{id}/schedule, POST /residencies/{id}/stipend-schedule"
    conflict_note: "the last check in the ladder - money is only ever reported once every state, safety, referential, temporal and constraint check has passed"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
# Conventions
#   * every primary path parameter is literally `{id}`; nested secondary parameters are named
#   * flat top-level collections (api_prefix is empty), so every entity is directly addressable
#   * every FK declared in §1.1 is reverse-reachable through its child collection's filtered list
#   * headers on every call: X-User-ID and X-User-Role
#   * Discipline and PortfolioItem are immutable (common_fields: false) - no PATCH, no version
endpoints:

  # ---------------------------------------------------------------- test-driving
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Sets the server's logical clock. Every deadline, window, session-date and
      'now' comparison in the system reads this clock and never the wall clock. Before any call
      to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z, which is the
      mandatory startup default; it must never fall back to real wall-clock time. Test-driving
      endpoint: outside the public business surface, inside the scaffold contract."
    roles: [ProgramAdmin]
    code: 200
    input: [current_utc]
    output: { current_utc: string }
    side_effects:
      - "recomputes VisaCase.days_to_filing_deadline on every read thereafter"
      - "no entity row is written and no version is incremented"

  # ---------------------------------------------------------------- cycles
  - method: POST
    path: "/cycles"
    description: "Creates an application cycle in status DRAFT."
    roles: [ProgramAdmin]
    code: 201
    input: [code, open_at, close_at, application_fee_cents, panel_quorum, cohort_target_size, alumni_reserve_pct, stipend_pool_cents, slate_min_score, stipend_weekly_rate_cents, session_length_options_weeks]
    output: Cycle
    side_effects:
      - "initialises the ledger fields to stipend_committed_cents = 0 and stipend_uncommitted_cents = stipend_pool_cents"

  - method: GET
    path: "/cycles"
    description: "Lists cycles."
    roles: [ProgramAdmin, PanelChair, FinanceOfficer, Funder, VisaCoordinator, FacilitiesManager]
    code: 200
    input: ["status?", "code?", "limit?", "offset?"]
    output: Cycle[]
    side_effects: []

  - method: GET
    path: "/cycles/{id}"
    description: "Reads one cycle with its live ledger and slate counters."
    roles: [ProgramAdmin, PanelChair, FinanceOfficer, Funder, VisaCoordinator, FacilitiesManager]
    code: 200
    input: []
    output: Cycle
    side_effects: []

  - method: PATCH
    path: "/cycles/{id}"
    description: "Updates cycle configuration while it is still in DRAFT."
    roles: [ProgramAdmin]
    code: 200
    input: ["open_at?", "close_at?", "application_fee_cents?", "panel_quorum?", "cohort_target_size?", "alumni_reserve_pct?", "stipend_pool_cents?", "slate_min_score?", "stipend_weekly_rate_cents?", "session_length_options_weeks?"]
    output: Cycle
    side_effects:
      - "recomputes stipend_uncommitted_cents and slots_open_count"
      - "increments Cycle.version by 1"

  - method: POST
    path: "/cycles/{id}/stage"
    description: "Advances the cycle along its stage pipeline (OPEN, SCREENING, PANEL_REVIEW, CLOSED)."
    roles: [ProgramAdmin]
    code: 200
    input: [to_status]
    output: Cycle
    side_effects:
      - "runs the Cycle state machine preconditions for the requested edge"
      - "on SLATE_LOCKED -> CLOSED rejects every remaining WAITLISTED application and recomputes slots_open_count"
      - "increments Cycle.version by 1"

  - method: POST
    path: "/cycles/{id}/lock-slate"
    description: "Runs slate allocation and moves the cycle PANEL_REVIEW -> SLATE_LOCKED. Chair-only,
      and the chair must not have reviewed in this cycle (segregation of duties)."
    roles: [PanelChair]
    code: 200
    input: []
    output: Cycle
    side_effects:
      - "runs calculations.slate_allocation"
      - "drives each candidate Application SCORED -> OFFERED / WAITLISTED / REJECTED and assigns waitlist_rank"
      - "sets Cycle.alumni_reserved_slots and recomputes slate_ready_count"
      - "increments Cycle.version by 1 and each affected Application.version by 1"

  - method: GET
    path: "/cycles/{id}/funder-outcome-report"
    description: "Computed read: the funder-facing outcome roll-up for the cycle."
    roles: [ProgramAdmin, Funder]
    code: 200
    input: []
    output: { awarded_count: integer, completed_count: integer, terminated_count: integer, withdrawn_count: integer, completion_rate_pct: number, international_share_pct: number, alumni_share_pct: number, follow_on_count: integer, obligation_fulfilment_pct: number, breached_obligation_count: integer, total_attendance: integer, stipend_paid_cents: integer, withholding_cents: integer }
    side_effects:
      - "runs calculations.funder_outcome_metrics; writes nothing"

  # ---------------------------------------------------------------- disciplines
  - method: POST
    path: "/disciplines"
    description: "Adds a discipline category to a DRAFT cycle. Immutable once created."
    roles: [ProgramAdmin]
    code: 201
    input: [cycle_id, code, name, portfolio_min_items, portfolio_max_items, required_media_types, "requires_hazmat_review?", cohort_min_slots, cohort_max_slots, required_capability_tags, "required_ventilation_class?"]
    output: Discipline
    side_effects: []

  - method: GET
    path: "/disciplines"
    description: "Lists disciplines, filterable by cycle (reverse reachability for Discipline.cycle_id)."
    roles: [ProgramAdmin, PanelChair, Panelist, Applicant, FacilitiesManager, Funder]
    code: 200
    input: ["cycle_id?", "code?", "limit?", "offset?"]
    output: Discipline[]
    side_effects: []

  - method: GET
    path: "/disciplines/{id}"
    description: "Reads one discipline configuration."
    roles: [ProgramAdmin, PanelChair, Panelist, Applicant, FacilitiesManager, Funder]
    code: 200
    input: []
    output: Discipline
    side_effects: []

  # ---------------------------------------------------------------- applicants
  - method: POST
    path: "/applicants"
    description: "Registers an artist. is_international is derived from citizenship_country."
    roles: [ProgramAdmin, Applicant]
    code: 201
    input: [full_name, email, affiliation_org, citizenship_country, "treaty_country?", declared_annual_income_cents]
    output: Applicant
    side_effects:
      - "computes is_international as citizenship_country != HOST_COUNTRY"

  - method: GET
    path: "/applicants"
    description: "Lists artists."
