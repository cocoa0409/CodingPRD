      - name: certify_destruction_credit_expiry_cascade_depth_four
        grounds:
          - endpoints.POST_/scrap-manifests/{manifest_id}/certify-destruction
          - state_machines.ScrapManifest.TRANSPORTED_to_CERTIFIED_DESTROYED
          - state_machines.Casing.REJECTED_to_SCRAPPED
          - calculations.casing_credit_balance
          - entities.ServiceLocation.fields.casings_in_holding_count
        distinguishing_aspect: |
          DEPTH 4 chain triggered by a COMPLIANCE event, not a production event: certifying
          destruction. Hop 1 certifies the manifest; hop 2 fires BECAUSE the manifest was
          certified (its listed casing REJECTED -> SCRAPPED); hop 3 fires BECAUSE that casing
          reached SCRAPPED while still carrying 10500 cents of accrued credit (EXPIRY entry
          of -10500); hop 4 fires BECAUSE hop 3 posted a ledger row (fleet balance 10500 -> 0
          and the holding-location count 1 -> 0). The casing arrives in REJECTED via the
          CASING_FAILURE fork, which is precisely why it still carries credit to write off.
        test_recipe:
          setup:
            - "ACTIVE agreement with casing_credit_rate_cents 15000, DRIVE policy, one retread line"
            - "one casing collected and graded B at retread_count 0, accruing 10500 cents"
            - "a job on that casing started and then failed with failure_reason CASING_FAILURE, which condemns the casing to REJECTED WITHOUT posting any reversal, so the 10500 survives"
            - "a DRAFT manifest with hauler_capacity_lbs 500 carrying that one 125-lb casing, signed by a ComplianceOfficer other than the inspector and transported"
            - "the logical clock stays at 2026-08-01T00:00:00Z, well inside the location's 2027-12-31 scrap permit"
