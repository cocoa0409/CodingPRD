  - section: consistency_model
    instances:
      - name: immediate_consistency_derived_fields_visible_in_same_response
        claim_type: immediate_consistency
        grounds:
          - complexity_profile.consistency_model
          - endpoints.POST /seed-ops/certification-tags
        distinguishing_aspect: "consistency_model is immediate, so every cascade of a single write is already visible in that write's own response and in an immediately following read - no lag, no background reconciliation."
        test_recipe:
