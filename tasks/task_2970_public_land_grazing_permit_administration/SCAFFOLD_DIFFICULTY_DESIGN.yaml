              captures: { final13_id: "$.data.items[0].id" }
          assert:
            - "PastureUseRecord.${ur13_id}.actual_aums == 74.67"
            - "AnnualOperatingInstruction.${aoi13_id}.actual_aums_total == 74.67"
            - "AnnualOperatingInstruction.${aoi13_id}.aoi_status == BILLED"
            - "GrazingBill.${bill13_id}.bill_status == VOIDED"
            - "GrazingBill.${final13_id}.billed_aums == 75.00"
            - "GrazingBill.${final13_id}.base_amount_cents == 12900"
            - "GrazingBill.${final13_id}.admin_fee_cents == 0"
            - "GrazingBill.${final13_id}.total_amount_cents == 12900"
            - "GrazingBill.${final13_id}.superseded_bill_id == ${bill13_id}"
            - "Permittee.${m17_id}.outstanding_balance_cents == 12900"
            - "paired control at the floor: an identical fixture reported as 75 head over 30 days (2026-04-01 to 2026-05-01) gives actual_aums_total 75.00, billed_aums 75.00 and total_amount_cents 12900 — the same figure, so the floor was applied as max() and not added"
            - "paired control just above the floor: an identical fixture reported as 113 head over 20 days (2026-04-01 to 2026-04-21) gives actual_aums_total 75.33, billed_aums 75.33 and total_amount_cents 12957 (round_half_up(75.33 * 172) = round_half_up(12956.76))"
            - "an implementation that floors or rounds billed_aums to a whole number before pricing yields 12900 for the 75.33 case and fails"

      - name: cost_share_remainder_penny_boundary
        grounds:
          - calculations.cost_share_allocation
          - validations.priority_33
          - entities.RangeImprovementProject.fields.allocated_share_cents
          - endpoints.POST_range_improvement_projects_allocate_cost_share
        distinguishing_aspect: |
          A third metric (integer cents of an allocation pool) on a third endpoint: POST
          /range-improvement-projects/{projectId}/allocate-cost-share. total_cost_cents 1000001
          at permittee_share_pct 0.5 lands exactly on a half cent, so permittee_share_cents must
          be round_half_up(500000.5) = 500001. Splitting that pool across permits of 150 / 100 /
          50 AUMs produces raw shares 250000.5 / 166667.0 / 83333.5 — TWO exact half cents.
          Rounding them half-up hands out 500002 cents, one cent MORE than exists; the required
          floor-then-distribute-the-remainder algorithm yields 250001 / 166667 / 83333, summing
          to exactly 500001 with the single leftover cent going to the largest permit.
