            - "DispositionOrder.${do_id}.channel_fee_cents == 3000, NOT 4500"
            - "DispositionOrder.${do_id}.net_recovery_cents == 22000, NOT 20500"
            - "ReturnLine.${line_id}.recovery_value_cents == 22000 after execution"
            - "The RECOVERY_CREDIT ShrinkLedgerEntry has amount_cents == 20350 (22000 - round_half_up(22000 * 0.075) == 22000 - 1650)"
            - "Client.${c_id}.settlement_balance_cents == 20350"

  # ===================================================================== #
  # RULE 3 — non_linear_state_machine                                     #
  # Instance 1 entity: ReturnLine (two parallel state dimensions).         #
  # Instance 2 entity: RefurbWorkOrder (IN_TEST -> TEST_FAILED cycle).     #
  # ===================================================================== #
  - rule_id: non_linear_state_machine
    instances:
      - name: return_line_parallel_dimensions_evolve_independently
        grounds:
          - state_machines.ReturnLine.DISPOSITION_ASSIGNED_to_DISPOSITIONED
          - state_machines.ReturnLine.HOLD_PENDING_DISPOSITION_to_FRAUD_HOLD
          - state_machines.ReturnLine.FRAUD_HOLD_to_RELEASE_PENDING
          - entities.ReturnLine.fields.disposition_state
          - entities.ReturnLine.fields.financial_state
          - calculations.return_line_fraud_score
        distinguishing_aspect: |
          Non-linearity here is the parallel-dimension shape on the ReturnLine row: the physical
          dimension walks RECEIVED_UNGRADED -> DISPOSITION_ASSIGNED -> DISPOSITIONED while the
          money dimension sits in FRAUD_HOLD across that entire walk, and clearing the hold later
          moves financial_state to RELEASE_PENDING while leaving disposition_state at
          DISPOSITIONED. The other non_linear_state_machine instance is a cycle on
          RefurbWorkOrder, a different entity.
        test_recipe:
          setup:
            - "Client CLFRAUD: SL_STANDARD, restock_grade_floor A, liquidation_floor_pct 0.30, donation_allowed false, fraud_tolerance_cents 4000, refund_hold_hours 48, max_refund_exposure_cents 100000000."
            - "CatalogItem SERIAL-1: declared_value_cents 20000, unit_weight_grams 1200, serialized true, not refurb_eligible, secondary_market_floor_cents 1000, hazard_class NONE, regulated_flag false."
            - "The authorized line declares serial SER-AAA but the clerk scans SER-BBB, so the SERIAL_MISMATCH check fails for 40 points; the receipt weighs the full expected 1400 grams so EMPTY_BOX passes."
            - "Grading C makes the value deficit 20000 - 7200 == 12800, above the 4000 tolerance, so VALUE_ANOMALY fails for another 20 points."
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Fraud Client", client_code: "CLFRAUD", service_level: "SL_STANDARD", inventory_ownership: "CLIENT_OWNED", restock_grade_floor: "A", refund_hold_hours: 48, liquidation_floor_pct: 0.30, fraud_tolerance_cents: 4000, donation_allowed: false, destroy_requires_dual_signoff: false, max_refund_exposure_cents: 100000000 }
              as: CenterAdmin
              as_user_id: "u_admin"
              captures: { c_id: $.data.id }
            - call: "POST /catalog-items"
              payload: { client_id: "${c_id}", sku: "SERIAL-1", description: "Serialized widget", declared_value_cents: 20000, unit_weight_grams: 1200, serialized: true, refurb_eligible: false, secondary_market_floor_cents: 1000, hazard_class: "NONE", regulated_flag: false }
              as: CenterAdmin
              as_user_id: "u_admin"
              captures: { item_id: $.data.id }
            - call: "POST /secondary-market-channels"
              payload: { name: "Alpha Auction", channel_code: "AUC1", channel_type: "AUCTION", accepted_grades: ["A", "B", "C", "D"], fee_pct: 0.12, hazard_certified: false, recall_certified: false, min_lot_value_cents: 0, concurrent_lot_capacity: 5 }
              as: CenterAdmin
              as_user_id: "u_admin"
              captures: { ch_id: $.data.id }
            - call: "POST /return-authorizations"
              payload: { client_id: "${c_id}", order_reference: "ORD-1005", customer_reference: "CUST-5", order_placed_at: "2026-07-25T00:00:00Z", expires_at: "2026-09-01T00:00:00Z" }
              as: CenterAdmin
              as_user_id: "u_admin"
              captures: { rma_id: $.data.id }
            - call: "POST /return-authorizations/${rma_id}/lines"
              payload: { catalog_item_id: "${item_id}", authorized_quantity: 1, reason_code: "DEFECTIVE", declared_serial: "SER-AAA" }
              as: CenterAdmin
              as_user_id: "u_admin"
              captures: { rl_id: $.data.id }
            - call: "POST /return-authorizations/${rma_id}/issue"
              payload: {}
              as: CenterAdmin
              as_user_id: "u_admin"
            - call: "POST /receipts"
              payload: { rma_id: "${rma_id}", tracking_reference: "TRK-5", gross_weight_grams: 1400 }
              as: ReceivingClerk
              as_user_id: "u_clerk"
              captures: { rcpt_id: $.data.id }
            - call: "POST /receipts/${rcpt_id}/lines"
              payload: { rma_line_id: "${rl_id}", quantity: 1, reason_code: "DEFECTIVE", scanned_serial: "SER-BBB" }
              as: ReceivingClerk
              as_user_id: "u_clerk"
              captures: { line_id: $.data.id, receipt_score: $.data.fraud_score_receipt }
            - call: "POST /return-lines/${line_id}/grade"
              payload: { condition_grade: "C" }
              as: GradingInspector
              as_user_id: "u_grader"
              captures: { line_ver: $.data.version }
          trigger:
            - call: "POST /disposition-orders"
              payload: { return_line_id: "${line_id}", expected_return_line_version: "${line_ver}", channel_id: "${ch_id}", disposition: "LIQUIDATE", quantity: 1, channel_window_start_at: "2026-08-02T08:00:00Z", channel_window_end_at: "2026-08-02T12:00:00Z" }
              as: DispositionSupervisor
              as_user_id: "u_super"
              captures: { do_id: $.data.id }
            - call: "POST /disposition-orders/${do_id}/approve"
              payload: {}
              as: DispositionSupervisor
              as_user_id: "u_super"
            - call: "POST /disposition-orders/${do_id}/execute"
              payload: {}
              as: DispositionSupervisor
              as_user_id: "u_super"
            - call: "GET /return-lines/${line_id}"
              payload: {}
              as: RefundAnalyst
              as_user_id: "u_analyst"
            - call: "POST /return-lines/${line_id}/clear-fraud-hold"
              payload: { resolution_note: "Serial re-verified against carrier photo evidence" }
              as: RefundAnalyst
              as_user_id: "u_analyst"
          assert:
            - "At line scan, ReturnLine.${line_id}.fraud_score_receipt == 40 (SERIAL_MISMATCH only; EMPTY_BOX passes at 1400 >= 840 grams)"
            - "After grading, ReturnLine.${line_id}.fraud_score_release == 60 (40 SERIAL_MISMATCH + 20 VALUE_ANOMALY; REPEAT_RETURNER passes with a single RMA)"
            - "GET /return-lines/${line_id}/fraud-checks returns exactly 4 rows: SERIAL_MISMATCH FAIL weight_points 40 evaluated_stage RECEIPT, EMPTY_BOX PASS weight_points 0 evaluated_stage RECEIPT, VALUE_ANOMALY FAIL weight_points 20 evaluated_stage GRADING, REPEAT_RETURNER PASS weight_points 0 evaluated_stage GRADING"
            - "After grading, ReturnLine.${line_id}.disposition_state == DISPOSITION_ASSIGNED while financial_state == FRAUD_HOLD (60 is at or above 50 and below 90)"
            - "After the order executes, ReturnLine.${line_id}.disposition_state == DISPOSITIONED but financial_state is STILL FRAUD_HOLD — the execute cascade only promotes HOLD_PENDING_DISPOSITION lines to RELEASE_PENDING"
            - "DispositionOrder.${do_id}.gross_lot_value_cents == 7200 and channel_fee_cents == 1296 and net_recovery_cents == 5904, and the RECOVERY_CREDIT ShrinkLedgerEntry is 5461"
            - "After clear-fraud-hold, ReturnLine.${line_id}.financial_state == RELEASE_PENDING and disposition_state == DISPOSITIONED (unchanged), proving the two dimensions moved independently"
            - "ReturnLine.${line_id}.fraud_score_release is still 60 after the hold is cleared — the score is evidence, the state is the gate"

      - name: refurb_work_order_rework_cycle_terminates_at_two
        grounds:
          - state_machines.RefurbWorkOrder.OPEN_to_IN_TEST
          - state_machines.RefurbWorkOrder.IN_TEST_to_TEST_FAILED
          - state_machines.RefurbWorkOrder.TEST_FAILED_to_IN_TEST
          - state_machines.RefurbWorkOrder.TEST_FAILED_to_ABANDONED
          - entities.RefurbWorkOrder.fields.rework_cycles
          - validations[priority=45]
          - calculations.refurb_total_cost
        distinguishing_aspect: |
          Non-linearity here is a true cycle on the RefurbWorkOrder entity: IN_TEST -> TEST_FAILED
          -> IN_TEST is re-entered twice, rework_cycles increments only on re-entry (0, 1, 2), and
          the third re-entry attempt is rejected with ERR_REWORK_LIMIT_EXCEEDED while the order
          stays in TEST_FAILED. The other non_linear_state_machine instance is the parallel
          dimension pair on ReturnLine, a different entity.
        test_recipe:
          setup:
            - "Client CLREF: SL_STANDARD, restock_grade_floor A, liquidation_floor_pct 0.30, donation_allowed false, fraud_tolerance_cents 100000000, max_refund_exposure_cents 100000000."
            - "CatalogItem REFURB-1: declared_value_cents 20000, unit_weight_grams 1200, not serialized, refurb_eligible true, secondary_market_floor_cents 1000, hazard_class NONE, regulated_flag false — so grading C selects REFURBISH (projected refurb margin round_half_up(20000 * 0.65) - 6000 == 7000 > 0)."
            - "ProcessingBay BAY-G1 of bay_type GENERAL with buffer_minutes 30."
            - "One received line of quantity 1 graded C with an OPEN RefurbWorkOrder assigned to technician u_tech; QA results are recorded by u_qa so the self-inspection rule never fires."
