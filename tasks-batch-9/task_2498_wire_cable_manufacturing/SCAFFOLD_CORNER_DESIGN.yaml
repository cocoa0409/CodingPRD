      - name: inventory_reposition_returns_a_non_entity_summary_and_skips_unreleased_skus
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /inventory/reposition]
          - calculations.inventory_reposition_target
          - calculations.metal_volatility_index
        distinguishing_aspect: "This is the only endpoint whose output is not a §1.1 entity: it returns a summary object with as_of_date, evaluated_count, skipped_count and the product_ids actually repositioned, and it carries no id or version. The scope rule is status-driven, so a DRAFT SKU is counted as skipped and keeps its previous target even when it is named explicitly in product_ids."
        test_recipe:
          setup:
            - "One COPPER quote (2026-07-30 at 4.10) and no ALUMINUM quote, so both volatility windows hold fewer than VOLATILITY_MIN_QUOTES 3 rows."
            - "SKU THHN-12-CU RELEASED with base_target_kft 100.0 and demand_index defaulted to 1.0; SKU XHHW-10-AL left DRAFT with base_target_kft 40.0 and demand_index 0.70."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
            - call: "POST /metal-price-quotes"
              payload: { metal: "COPPER", effective_date: "2026-07-30", settlement_price_usd_per_lb: 4.10, source: "COMEX" }
              as: ProcurementBuyer
            - call: "POST /compounds"
              payload: { compound_code: "PVC-90-INS", layer_role: "INSULATION", temp_rating_c: 90, flame_test: "VW_1", max_voltage_v: 600, wet_rated: true, filler_pct: 12.5 }
              as: ProcessEngineer
              captures: { ins_id: $.data.id }
            - call: "POST /compounds/${ins_id}/qualify"
              payload: {}
              as: ProcessEngineer
            - call: "POST /listing-certifications"
              payload: { agency: "UL", file_number: "E12345", product_family_code: "BLDG-WIRE", initial_listing_date: "2026-06-01", inspection_interval_days: 90 }
              as: CertificationOfficer
              captures: { cert_id: $.data.id }
            - call: "POST /listing-certifications/${cert_id}/inspections"
              payload: { inspection_date: "2026-06-05", inspector_code: "INS-7", findings_count: 0, outcome: "PASS" }
              as: CertificationOfficer
            - call: "POST /catalog-products"
              payload: { product_code: "THHN-12-CU", awg_size: "12", conductor_metal: "COPPER", conductor_construction: "STRANDED_7", application_rating: "THHN", voltage_class: "LV_600", temp_rating_c: 90, insulation_thickness_mils: 28.0, conductor_lbs_per_kft: 19.8, insulation_compound_id: "${ins_id}", listing_certification_id: "${cert_id}", base_target_kft: 100.0 }
              as: ProcessEngineer
              captures: { cu_id: $.data.id }
            - call: "POST /catalog-products/${cu_id}/release"
              payload: {}
              as: ProcessEngineer
            - call: "POST /catalog-products"
              payload: { product_code: "XHHW-10-AL", awg_size: "10", conductor_metal: "ALUMINUM", conductor_construction: "STRANDED_7", application_rating: "XHHW_2", voltage_class: "LV_600", temp_rating_c: 90, insulation_thickness_mils: 30.0, conductor_lbs_per_kft: 12.0, insulation_compound_id: "${ins_id}", listing_certification_id: "${cert_id}", base_target_kft: 40.0, demand_index: 0.70 }
              as: ProcessEngineer
              captures: { al_id: $.data.id }
          trigger:
            - call: "POST /inventory/reposition"
              payload: { as_of_date: "2026-08-01" }
              as: ProcessEngineer
              captures: { run1_eval: $.data.evaluated_count, run1_skip: $.data.skipped_count, run1_date: $.data.as_of_date }
            - call: "GET /catalog-products/${cu_id}"
              payload: {}
              as: ProcessEngineer
              captures: { cu_target: $.data.target_inventory_kft, cu_vol: $.data.volatility_index }
            - call: "GET /catalog-products/${al_id}"
              payload: {}
              as: ProcessEngineer
              captures: { al_target_before: $.data.target_inventory_kft }
            - call: "POST /inventory/reposition"
              payload: { as_of_date: "2026-08-01", product_ids: ["${al_id}"] }
              as: ProcessEngineer
              captures: { run2_eval: $.data.evaluated_count, run2_skip: $.data.skipped_count }
            - call: "POST /catalog-products/${al_id}/release"
              payload: {}
              as: ProcessEngineer
            - call: "POST /inventory/reposition"
              payload: { as_of_date: "2026-08-01", product_ids: ["${al_id}"] }
              as: ProcessEngineer
              captures: { run3_eval: $.data.evaluated_count, run3_skip: $.data.skipped_count }
            - call: "GET /catalog-products/${al_id}"
              payload: {}
              as: ProcessEngineer
              captures: { al_target_after: $.data.target_inventory_kft, al_vol: $.data.volatility_index }
          assert:
            - "run 1 response_type == \"object\" and the payload has no id, no created_at and no version: ${run1_date} == \"2026-08-01\", ${run1_eval} == 1, ${run1_skip} == 1, and product_ids == [the THHN SKU id] only"
            - "${cu_vol} == 0.0000 because the COPPER window holds 1 quote < VOLATILITY_MIN_QUOTES 3, so volatility_damper is 1 - min(0.40, 0.80 * 0.0000) == 1"
            - "${cu_target} == 100.0 = round_half_up(min(max(100.0 * 1.00 * 1, 25.0), 150.0), 1) - demand_index 1.0 falls in the mid band [0.80, 1.20] so the multiplier is 1.00"
            - "${al_target_before} == 0 - the DRAFT SKU kept the value it was created with"
            - "run 2 names the DRAFT SKU explicitly and still refuses to reposition it: ${run2_eval} == 0, ${run2_skip} == 1, product_ids == [] - the explicit filter narrows the scope, it does not override the status rule"
            - "run 3, after the release: ${run3_eval} == 1, ${run3_skip} == 0"
            - "${al_vol} == 0.0000 (no ALUMINUM quote exists at all) and ${al_target_after} == 12.0 = round_half_up(min(max(40.0 * 0.30 * 1, 10.0), 60.0), 1) - demand_index 0.70 < 0.80 takes the low multiplier, and the raw 12.0 clears the 10.0 floor"
            - "run 3 touched only the SKU it named: ${cu_target} is still 100.0"

