            - "One incumbent ACTIVE BORROWER_PROVIDED policy with dwelling_coverage_cents 5200000 covering [2026-08-01, 2027-08-01)."
            - "The loan is re-read after that write so a fresh expected_loan_version is in hand."
          setup_api_calls:
            - call: "POST /chattel/_clock/set_current_utc"
