              as_user_id: "admin-legal-1"
              captures: { pC4_ver: $.data.version }
            - call: "POST /hie/participants/${pC4_id}/data-feeds"
              payload: { feed_type: "ADT", expected_participant_version: "${pC4_ver}" }
              as: HieAdmin
              captures: { feedC4_id: $.data.id }
          trigger:
            - call: "POST /hie/data-feeds/${feedC4_id}/quality-samples"
              payload: { period_start: "2026-06-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z", messages_received: 8000, messages_rejected: 100, required_fields_missing_count: 250, duplicate_count: 60, timeliness_p95_seconds: 900 }
              as: HieAdmin
              captures: { sampC4_id: $.data.id }
            - call: "GET /hie/participants/${pC4_id}/scorecard"
              payload: {}
              as: HieAdmin
              captures: { scC4_completeness: $.data.completeness_component, scC4_rejection: $.data.rejection_component, scC4_duplicate: $.data.duplicate_component, scC4_timeliness: $.data.timeliness_component, scC4_base: $.data.base_quality_score, scC4_penalty: $.data.penalty_points, scC4_score: $.data.quality_score, scC4_grade: $.data.grade, scC4_p95: $.data.average_p95_seconds }
          assert:
