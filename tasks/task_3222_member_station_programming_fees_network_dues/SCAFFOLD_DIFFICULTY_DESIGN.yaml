  - rule_id: priority_pair_validation_conflict
    instances:
      - name: priority_state_over_fiscal_mode
        grounds:
          - validations[priority=8]
          - validations[priority=27]
          - validations[priority=32]
        distinguishing_aspect: "A single enact request trips both the state precondition and the fiscal pool invariant; the state-versus-business_fiscal pair resolves in favour of priority 7, and the same endpoint later surfaces the fiscal error once the state precondition is satisfied."
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z; two ELIGIBLE stations in one fiscal-2026 batch whose pool was allocated at 240001 cents, then a third station approved into the same batch so the batch now owes 360001 against a 240001 pool; the proposal is still in DRAFT"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /network/programming-fee-schedules"
              payload: { schedule_code: "FY2026H", fiscal_year: 2026, base_fee_cents: 1200000, revenue_rate_bps: 250, market_size_multiplier_bps: 12500, minimum_fee_cents: 100000, maximum_fee_cents: 5000000, annual_adjustment_bps: 0, effective_from: "2026-06-01T00:00:00Z", effective_to: "2027-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /network/member-stations"
              payload: { call_sign: "WAMU", licensee_name: "District Licensee", state_code: "DC", dma_market_rank: 9, dma_households: 2300000, coverage_population: 100000, full_time_staff_count: 8, newsroom_staff_count: 4, annual_local_revenue_cents: 4800000, board_seat_region: "REGION_SOUTH" }
              as: PlatformAdmin
              captures: { st_i1: "$.data.id" }
            - call: "POST /network/member-stations/${st_i1}/submit-eligibility"
              payload: {}
              as: StationManager
              as_user_id: "${st_i1}"
            - call: "POST /network/member-stations/${st_i1}/approve-eligibility"
              payload: {}
              as: NetworkComplianceAuditor
              captures: { st_i1_ver: "$.data.version" }
            - call: "POST /network/member-stations"
              payload: { call_sign: "WETA", licensee_name: "Potomac Licensee", state_code: "VA", dma_market_rank: 22, dma_households: 700000, coverage_population: 60000, full_time_staff_count: 6, newsroom_staff_count: 3, annual_local_revenue_cents: 4800000, board_seat_region: "REGION_SOUTH" }
              as: PlatformAdmin
              captures: { st_i2: "$.data.id" }
            - call: "POST /network/member-stations/${st_i2}/submit-eligibility"
              payload: {}
              as: StationManager
              as_user_id: "${st_i2}"
            - call: "POST /network/member-stations/${st_i2}/approve-eligibility"
              payload: {}
              as: NetworkComplianceAuditor
              captures: { st_i2_ver: "$.data.version" }
            - call: "GET /network/member-stations/${st_i1}/assessments"
              payload: {}
              as: NetworkComplianceAuditor
              captures: { assmt_i1: "$.data[0].id" }
            - call: "POST /network/programming-fee-assessments/${assmt_i1}/allocate-pool"
              payload: { total_pot_cents: 240001 }
              as: NetworkGovernanceOfficer
            - call: "POST /network/member-stations"
              payload: { call_sign: "WFMU", licensee_name: "Jersey Licensee", state_code: "NJ", dma_market_rank: 1, dma_households: 7000000, coverage_population: 140000, full_time_staff_count: 9, newsroom_staff_count: 5, annual_local_revenue_cents: 4800000, board_seat_region: "REGION_NORTHEAST" }
              as: PlatformAdmin
              captures: { st_i3: "$.data.id" }
            - call: "POST /network/member-stations/${st_i3}/submit-eligibility"
              payload: {}
              as: StationManager
              as_user_id: "${st_i3}"
            - call: "POST /network/member-stations/${st_i3}/approve-eligibility"
              payload: {}
              as: NetworkComplianceAuditor
            - call: "POST /network/dues-proposals"
              payload: { fiscal_year: 2027, proposed_base_fee_cents: 1350000, proposed_revenue_rate_bps: 275, quorum_required_votes: 1, effective_from: "2026-08-01T00:00:00Z" }
              as: NetworkGovernanceOfficer
              captures: { prop_i_id: "$.data.id", prop_i_ver: "$.data.version" }
          trigger:
            - call: "POST /network/dues-proposals/${prop_i_id}/enact"
              payload: { expected_proposal_version: "${prop_i_ver}" }
              as: NetworkGovernanceOfficer
            - call: "POST /network/dues-proposals/${prop_i_id}/open"
              payload: {}
              as: NetworkGovernanceOfficer
              captures: { prop_i_ver: "$.data.version" }
            - call: "POST /network/dues-proposals/${prop_i_id}/votes"
              payload: { station_id: "${st_i1}", vote_choice: "YES", current_rate_bps: 250, expected_station_version: "${st_i1_ver}" }
              as: StationManager
              as_user_id: "${st_i1}"
