            - call: "GET /lab/examination-requests"
              payload: { case_id: "${c1}", status: "CANCELLED" }
              as: CaseManager
          assert:
            - "HTTP status == 200"
            - "Method.${m1}.validation_status == RETIRED"
            - "Method.${m1}.retired_at_utc == 2026-08-01T00:00:00Z"
            - "ExaminationRequest.${r1}.status == CANCELLED"
            - "ExaminationRequest.${r2}.status == ASSIGNED"
            - "the filtered listing returns total_count == 1 with the single row id == ${r1}"
            - "Case.${c1}.open_examination_request_count == 1"
            - "Case.${c1}.workflow_status == IN_PROGRESS"
            - "Assignment.${asg2}.status == ACTIVE"
            - "Analyst.${a1}.assigned_casework_hours == 4.00"

      - name: complete_analysis_releases_hours_and_checks_the_evidence_back_in
        claim_type: side_effect_execution
        grounds:
          - state_machines.ExaminationRequest.IN_ANALYSIS_to_TECH_REVIEW
          - state_machines.EvidenceItem.IN_ANALYSIS_to_IN_VAULT
          - state_machines.Assignment.ACTIVE_to_COMPLETED
          - calculations.committed_casework_hours_invariant
        distinguishing_aspect: "One complete-analysis call fires three declared side effects at once: actual_hours_logged is stored as 9.25, the ACTIVE Assignment becomes COMPLETED and de-encumbers exactly its snapshotted 8.00 hours (not the 9.25 logged), and the evidence item returns IN_VAULT with checkout_count still 1."
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-08-01T00:00:00Z."
            - "Analyst A1: BIOLOGY, competency 4, capacity 40.00, training 8.00 -> available_hours 32.00."
            - "Method M1 VALIDATED, BIOLOGY, standard_hours_per_item 4.00, min_competency_level 3, max_items_per_request 6, is_consumptive true."
            - "Case C1 (AGG_ASSAULT) ACCEPTED with one BIOLOGICAL vault item E1."
            - "Request R1 (item_count 2) -> estimated_hours 8.00, assigned to A1 and started, so E1 is IN_ANALYSIS with checkout_count 1 and A1 holds 8.00 encumbered hours."
            - "Hand-executed workload formulas after completion: projected 0.00 / 0.00 pct; realized round_half_up(9.25 / 32.00 * 100, 2) == 28.91 pct."
          setup_api_calls:
            - call: "POST /lab/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: LabDirector
            - call: "POST /lab/analysts"
