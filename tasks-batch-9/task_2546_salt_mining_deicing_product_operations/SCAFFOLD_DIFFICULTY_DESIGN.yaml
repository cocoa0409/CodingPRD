              as: ContractAdministrator
              captures: { fc9_id: $.data.id }
            - call: "POST /salt/bid-contracts"
              payload: { season_forecast_id: "${fc9_id}", customer_name: "City of Buffalo", jurisdiction_level: "MUNICIPAL", state_code: "NY", product_line: "HIGHWAY_DEICING", committed_tons: 5000, guaranteed_price_per_ton: 68.55, min_take_pct: 80, max_take_pct: 110, failure_to_supply_penalty_per_ton: 22.00, price_guarantee_cap_pct: 10 }
              as: ContractAdministrator
              captures: { c9_id: $.data.id }
            - call: "POST /salt/bid-contracts/${c9_id}/submit"
              payload: {}
              as: ContractAdministrator
            - call: "POST /salt/bid-contracts/${c9_id}/decision"
              payload: { outcome: "AWARD" }
              as: ContractAdministrator
              captures: { c9_status: $.data.status }
            - call: "GET /salt/bid-contracts/${c9_id}"
              payload: {}
              as: ContractAdministrator
              captures: { c9_v: $.data.version }
          trigger:
            - call: "POST /salt/delivery-orders"
              payload: { bid_contract_id: "${c9_id}", depot_id: "${d9a}", requested_tons: 9000, required_by: "2026-12-01T00:00:00Z", market_index_price_per_ton: 70.00, storm_priority: "ROUTINE", expected_bid_contract_version: "${c9_v}" }
              as: ContractAdministrator
              captures: { conflict_err_b: $.data.error_id }
          assert:
            - "${c9_status} == AWARDED"
            - "${conflict_err_b} == ERR_CONTRACT_INVALID_STATE with HTTP 409 — priority 11 (state) wins over the also-violated priority 37 ERR_TAKE_BAND_EXCEEDED (9000 > 5500.00)"
            - "${conflict_err_b} != ERR_TAKE_BAND_EXCEEDED and ${conflict_err_b} != ERR_STALE_BID_CONTRACT_VERSION (the OCC value was read fresh, so priority 10 passed)"
            - "GET /salt/delivery-orders?bid_contract_id=${c9_id} returns 0 rows"
            - "BidContract.${c9_id}.version is unchanged from ${c9_v} — a rejected create does not bump the OCC parent"

  - rule_id: boundary_precision_check
    instances:
      - name: grade_tier_boundary_at_exactly_95_and_90_pct_nacl
        grounds:
          - calculations.panel_recoverable_tons
          - entities.Panel.fields.recoverable_tons
          - entities.Panel.fields.grade_pct_nacl
        distinguishing_aspect: |
          Tests the two GRADE-TIER thresholds of a threshold algorithm at exact equality and one
          hundredth below: 95.00 takes factor 1.00 (617600.00) while 94.99 drops to 0.96 (594176.00),
          and 90.00 still takes 0.96 (594176.00) while 89.99 drops to 0.88 (547328.00). The pair
          94.99 / 90.00 proves the mid tier is a closed-below, open-above band by producing the SAME
          tonnage from two different grades.
        test_recipe:
          setup:
            - "Clock at 2026-08-10T00:00:00Z."
            - "Mine Retsof (NY, rated 24000 t/day), compliance_state COMPLIANT."
            - "Panel A already created with gross 1000000 t, extraction_ratio 60 pct, grade 95.0, insolubles 5.0, pillar recovery allowed."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: MinePlanner
            - call: "POST /salt/mines"
              payload: { name: "Retsof", state_code: "NY", rated_hoist_tons_per_day: 24000 }
              as: MinePlanner
              captures: { m10_id: $.data.id }
            - call: "POST /salt/panels"
              payload: { mine_id: "${m10_id}", panel_code: "P-A", gross_tons_in_place: 1000000, extraction_ratio_pct: 60, grade_pct_nacl: 95.0, insolubles_pct: 5.0, pillar_recovery_allowed: true }
              as: MinePlanner
              captures: { pa_id: $.data.id, pa_rec: $.data.recoverable_tons }
          trigger:
            - call: "POST /salt/panels"
              payload: { mine_id: "${m10_id}", panel_code: "P-B", gross_tons_in_place: 1000000, extraction_ratio_pct: 60, grade_pct_nacl: 94.99, insolubles_pct: 5.0, pillar_recovery_allowed: true }
              as: MinePlanner
              captures: { pb_id: $.data.id, pb_rec: $.data.recoverable_tons }
            - call: "POST /salt/panels"
              payload: { mine_id: "${m10_id}", panel_code: "P-C", gross_tons_in_place: 1000000, extraction_ratio_pct: 60, grade_pct_nacl: 90.0, insolubles_pct: 5.0, pillar_recovery_allowed: true }
              as: MinePlanner
              captures: { pc_id: $.data.id, pc_rec: $.data.recoverable_tons }
            - call: "POST /salt/panels"
              payload: { mine_id: "${m10_id}", panel_code: "P-D", gross_tons_in_place: 1000000, extraction_ratio_pct: 60, grade_pct_nacl: 89.99, insolubles_pct: 5.0, pillar_recovery_allowed: true }
              as: MinePlanner
              captures: { pd_id: $.data.id, pd_rec: $.data.recoverable_tons }
          assert:
            - "${pa_rec} == 617600.00 — grade exactly at GRADE_TIER_HIGH_PCT 95.0 takes GRADE_FACTOR_HIGH 1.00"
            - "${pb_rec} == 594176.00 — 94.99 is one hundredth below the threshold and takes 0.96"
            - "${pc_rec} == 594176.00 — grade exactly at GRADE_TIER_MID_PCT 90.0 still takes 0.96, so P-B and P-C are byte-identical in tonnage"
            - "${pd_rec} == 547328.00 — 89.99 falls to GRADE_FACTOR_LOW 0.88"
            - "${pa_rec} - ${pb_rec} == 23424.00 — the whole tier step, computed as 600000 x 0.04 x 0.976"
            - "every value is stored with exactly 2 decimal places (ROUND_HALF_UP), and none of the four is clipped by hard_cap_tons 720000.00"
            - "all four panels report insolubles_penalty behaviour consistently: (5.0 - 3.0) x 0.012 == 0.024, well under the 0.20 cap"

      - name: covered_storage_auto_surge_at_exactly_ninety_percent_of_capacity
        grounds:
          - state_machines.Depot.OPEN_to_SURGE_system
          - entities.Depot.fields.covered_stored_tons
          - entities.Depot.fields.covered_utilization_pct
          - calculations.treatment_yield_and_purity
          - endpoints[GET /salt/depots/{id}/storage-posture]
        distinguishing_aspect: |
          Tests a RATE THRESHOLD whose comparison is deliberately made on the unrounded
          cross-multiplied ratio rather than on the 2-decimal displayed field: at 35999.10 t of 40000 t
          the displayed covered_utilization_pct is already 90.00 (89.99775 rounded half-up) yet the
          depot stays OPEN, and 0.90 t more lands exactly on 36000.00 and flips it to SURGE. An
          implementation that tests the rounded field auto-surges one batch too early.
        test_recipe:
          setup:
            - "Clock at 2026-08-10T00:00:00Z."
            - "Mine Retsof (NY, rated 24000 t/day), panel P-1 PRODUCING (grade 95.0), one run of 40000 t over a 48 h window (833.3333 t/h) already HOISTED with 40000 t."
            - "Depot A (NY, OPEN) with covered_capacity_tons 40000 and open_pad_capacity_tons 20000."
            - "Two MEDIUM HIGHWAY_DEICING batches at 0.0 pct moisture have already passed QC: 39000 t input -> 35100.00 t and 999 t input -> 899.10 t, so covered_stored_tons is 35999.10."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: MinePlanner
            - call: "POST /salt/mines"
