  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: migration_batch_quarantine_remediation_revisit_cycle
        grounds:
          - state_machines.MigrationBatch.SCHEDULED_to_QUARANTINED
          - state_machines.MigrationBatch.QUARANTINED_to_SCHEDULED
          - state_machines.MigrationBatch.SCHEDULED_to_VALIDATED
          - state_machines.MigrationBatch.VALIDATED_to_RECONCILED
          - calculations.chart_migration_validation
          - entities.MigrationBatch.fields.remediation_round
        distinguishing_aspect: |
          The batch re-enters SCHEDULED after QUARANTINED and is validated a
          second time, so SCHEDULED is visited twice with remediation_round
          rising 0 -> 1 while the reserved cutover window is preserved; a linear
          reading of the machine cannot produce a VALIDATED batch whose
          remediation_round is 1.
        test_recipe:
          setup:
            - "One Affiliation CLOSED at 2026-09-01T00:00:00Z; one AFFILIATED Practice in IL with charts_total_expected 5000 and integration_posture STABILIZING."
            - "One MigrationBatch STAGED with records_total 5000, scheduled into the cutover window [2026-10-01T00:00:00Z, 2026-10-02T00:00:00Z]; the logical clock is then advanced into that window."
          setup_api_calls:
            - call: "POST /dso/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: DsoIntegrationLead
            - call: "POST /dso/affiliations"
              payload: { seller_group_name: "Elm Ridge Dental Group", purchase_price_cents: 450000000, earnout_pool_cents: 90000000, baseline_ebitda_cents: 90000000, baseline_net_collections_cents: 400000000, post_close_doctor_term_months: 36 }
