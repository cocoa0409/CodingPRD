            - "ReconciliationRun.${run_seq_id}.unduplicated_reach_pct - ReconciliationRun.${run_agg_id}.unduplicated_reach_pct == 1.0500 on identical input data"

  - rule_id: combinatorial_formula
    instances:
      - name: invoice_commission_rounded_per_line_then_summed
        grounds:
          - calculations.invoice_net_payable
          - entities.Invoice.fields.agency_commission_cents
          - entities.Invoice.fields.gross_billable_cents
          - entities.BuyUnit.fields.line_commission_cents
          - entities.Buy.fields.commission_rate
          - endpoints[POST /upfront/invoices]
        distinguishing_aspect: |
          Mode (b) - rounding order. The three billable lines have nets 1,100,150 /
          660,050 / 440,250 cents, each of which multiplied by the 0.0700 commission rate
          lands exactly on a half cent, so rounding half-up per line gives 154,033 cents
          while summing the nets first and rounding once gives 154,032 cents; the invoice
          MUST report 154,033 and gross_billable_cents 2,354,483.
        test_recipe:
          setup:
            - "one AUTOMOTIVE advertiser with 45-day payment terms and one seller"
            - "an APPROVED campaign with a single 100 percent LINEAR_TV SCATTER LATE allocation over a 10,000,000 cent budget"
            - "a PLACED buy guaranteeing 1,000,000 impressions at CPM 2200 (net 2,200,000 cents, so the small commission tier applies and Buy.commission_rate is 0.0700)"
            - "three AIRED unit lines: 2 units at 550,075 cents airing to 2026-11-15, 5 units at 132,010 cents airing to 2026-11-29, 3 units at 146,750 cents airing to 2026-12-15"
            - "the logical clock has been moved to 2026-12-16T00:00:00Z so every air window has elapsed"
          setup_api_calls:
            - call: "POST /upfront/advertisers"
              payload: { name: "Northwind Motors", category_code: "AUTOMOTIVE", credit_limit_cents: 100000000, payment_terms_days: 45, sequential_liability_enabled: true }
              as: AgencyController
              as_user_id: "controller-01"
              captures: { adv2_id: $.data.id }
            - call: "POST /upfront/sellers"
              payload: { name: "Cascade Cable", platform_types: ["LINEAR", "CTV"], make_good_capacity_impressions: 5000000 }
              as: AgencyController
              as_user_id: "controller-01"
              captures: { sel2_id: $.data.id }
            - call: "POST /upfront/campaigns"
              payload: { advertiser_id: "${adv2_id}", name: "Model Launch Scatter", target_demo: "A18-49", universe_thousands: 100000, reach_goal_pct: 40.0, frequency_goal: 3.0, total_budget_cents: 10000000, flight_start: "2026-11-01T00:00:00Z", flight_end: "2026-12-31T23:59:59Z", fiscal_quarter: "2026Q4" }
              as: AgencyPlanner
              as_user_id: "planner-01"
              captures: { c2_id: $.data.id }
            - call: "POST /upfront/channel-allocations"
              payload: { campaign_id: "${c2_id}", channel: "LINEAR_TV", allocation_pct: 100.00, planned_cpm_cents: 2200, planned_market: "SCATTER", primary_daypart: "LATE" }
              as: AgencyPlanner
              as_user_id: "planner-01"
              captures: { al3_id: $.data.id }
            - call: "POST /upfront/campaigns/${c2_id}/submit-plan"
              payload: {}
              as: AgencyPlanner
              as_user_id: "planner-01"
            - call: "POST /upfront/campaigns/${c2_id}/approve-plan"
