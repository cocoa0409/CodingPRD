      - name: stop_sequences_must_be_contiguous_and_instants_non_decreasing
        claim_type: Violation to Error
        grounds:
          - errors.ERR_STOP_SEQUENCE_DISORDER
          - validations[priority 14 temporal]
        distinguishing_aspect: "ERR_STOP_SEQUENCE_DISORDER covers two distinct shapes at the same 422: a sequence that is not exactly stop_count + 1 (so the very first stop cannot be numbered 2), and an arrival that precedes the previous stop's departure. An arrival exactly equal to that departure is legal, which is the boundary that separates the two."
        test_recipe:
          setup:
            - "TRIP-V2 is DRAFT with no stops at store S-5002 (600 cases/h, docks open all day)."
          setup_api_calls:
            - call: "POST /fleet/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: FleetPlanner
            - call: "POST /fleet/domiciles"
              payload: { domicile_code: "DOM-V2", region_code: "MIDWEST", tractor_capacity: 20, driver_headcount_target: 10, fixed_ownership_cents_per_day: 10000, overhead_cents_per_day: 3000, dedicated_rate_cents_per_mile: 280, dedicated_rate_cents_per_case: 205 }
              as: FleetPlanner
              captures: { dom_id: $.data.id }
            - call: "POST /fleet/stores"
              payload: { store_code: "S-5002", region_code: "MIDWEST", dock_count: 2, cases_per_hour_unload_rate: 600, dock_open_minute: 0, dock_close_minute: 1439 }
              as: FleetPlanner
              captures: { store_id: $.data.id }
            - call: "POST /fleet/replenishment-orders"
              payload: { store_id: "${store_id}", cases: 600, weight_lbs: 13200, requested_window_start: "2026-08-20T06:00:00Z", requested_window_end: "2026-08-20T18:00:00Z", temperature_mode: "DRY", priority: 1 }
              as: FleetPlanner
              captures: { order_id: $.data.id }
            - call: "POST /fleet/trips"
              payload: { trip_code: "TRIP-V2", domicile_id: "${dom_id}", planned_start_at: "2026-08-20T06:00:00Z" }
              as: FleetPlanner
              captures: { trip_id: $.data.id }
          trigger:
            - call: "POST /fleet/trips/${trip_id}/stops"
              payload: { sequence: 2, stop_type: "DELIVERY", store_id: "${store_id}", replenishment_order_id: "${order_id}", scheduled_arrival_at: "2026-08-20T08:00:00Z", scheduled_departure_at: "2026-08-20T09:15:00Z", drive_minutes_from_prev: 120, miles_from_prev: 100, segment_loaded: true, cases: 600 }
              as: FleetPlanner
              captures: { gap_err: $.data.error_id }
            - call: "POST /fleet/trips/${trip_id}/stops"
              payload: { sequence: 1, stop_type: "DELIVERY", store_id: "${store_id}", replenishment_order_id: "${order_id}", scheduled_arrival_at: "2026-08-20T08:00:00Z", scheduled_departure_at: "2026-08-20T09:15:00Z", drive_minutes_from_prev: 120, miles_from_prev: 100, segment_loaded: true, cases: 600 }
              as: FleetPlanner
              captures: { s1_id: $.data.id, s1_seq: $.data.sequence }
            - call: "POST /fleet/trips/${trip_id}/stops"
              payload: { sequence: 2, stop_type: "FUEL", scheduled_arrival_at: "2026-08-20T09:00:00Z", scheduled_departure_at: "2026-08-20T09:25:00Z", drive_minutes_from_prev: 20, miles_from_prev: 15, segment_loaded: false }
              as: FleetPlanner
              captures: { back_err: $.data.error_id }
            - call: "POST /fleet/trips/${trip_id}/stops"
              payload: { sequence: 2, stop_type: "FUEL", scheduled_arrival_at: "2026-08-20T09:15:00Z", scheduled_departure_at: "2026-08-20T09:40:00Z", drive_minutes_from_prev: 20, miles_from_prev: 15, segment_loaded: false }
              as: FleetPlanner
              captures: { s2_id: $.data.id, s2_seq: $.data.sequence, s2_service: $.data.service_minutes }
            - call: "GET /fleet/trips/${trip_id}/stops"
              payload: { limit: 10, offset: 0 }
              as: FleetPlanner
              captures: { first_seq: "$.data[0].sequence" }
          assert:
            - "${gap_err} == ERR_STOP_SEQUENCE_DISORDER with HTTP 422 - the first stop of a trip must be sequence 1, i.e. stop_count + 1"
            - "${s1_seq} == 1 with HTTP 201 once the sequence is right"
            - "${back_err} == ERR_STOP_SEQUENCE_DISORDER with HTTP 422 - 09:00 precedes stop 1's departure at 09:15"
            - "${s2_seq} == 2 and ${s2_service} == 25 - an arrival exactly equal to the previous departure is accepted"
            - "${first_seq} == 1 and the listing reports total_count 2"

