              payload: { code: "METRO-02", name: "Harbor District", permit_required_trades: [], permit_responsible_party: "RETAILER", inspection_required: false, min_liability_coverage_cents: 100000000, permit_unit_threshold: 0, inspection_lead_days: 3, max_concurrent_inspections: 2, background_check_recency_days: 365, license_required: true, labor_complexity_multiplier: 1.00, status: "ACTIVE" }
              as: ProgramAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Dana Reyes", email: "dana@example.com", jurisdiction_id: "${jur_id}" }
              as: ProgramAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust_id}", service_category_id: "${cat_id}", jurisdiction_id: "${jur_id}", site_address: "18 Larch Way", estimated_units: 420.00, requested_install_date: "2026-08-25T13:00:00.000Z" }
              as: ProjectCoordinator
              captures: { proj_id: $.data.id }
            - call: "POST /projects/${proj_id}/deposit"
              payload: { amount_cents: 51306 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { pv_stale: $.data.version }
            - call: "POST /projects/${proj_id}/cancel"
              payload: { cancel_reason: "Customer withdrew before measurement" }
              as: ProjectCoordinator
              captures: { pv_fresh: $.data.version, fin1: $.data.financial_status, ref1: $.data.deposit_refunded_cents, held1: $.data.deposit_held_cents }
          trigger:
            - call: "POST /projects/${proj_id}/reinstate"
              payload: { expected_project_version: "${pv_stale}", reinstate_note: "Customer changed their mind" }
              as: ProjectCoordinator
              captures: { e_stale: $.data.error_id }
            - call: "POST /projects/${proj_id}/reinstate"
              payload: { expected_project_version: "${pv_fresh}", reinstate_note: "Customer changed their mind" }
              as: ProjectCoordinator
              captures: { ful2: $.data.fulfillment_status, fin2: $.data.financial_status, held2: $.data.deposit_held_cents, ref2: $.data.deposit_refunded_cents, pv2: $.data.version }
          assert:
            - "${fin1} == 'REFUNDED' AND ${ref1} == 51306 AND ${held1} == 0 AND ${pv_fresh} == ${pv_stale} + 1 — the cooling-off tier waived everything"
            - "${e_stale} == 'ERR_STALE_PROJECT_VERSION' with HTTP 412 — the cancellation is what made the client's view stale"
            - "After the 412, Project.${proj_id}.fulfillment_status == 'CANCELLED' AND deposit_refunded_cents == 51306 AND version == ${pv_fresh}"
            - "${ful2} == 'MEASURE_PENDING' AND ${fin2} == 'DEPOSIT_HELD' AND ${held2} == 51306 AND ${ref2} == 0 AND ${pv2} == ${pv_fresh} + 1"

      - name: occ_installer_remove_rejects_a_view_predating_the_event_that_made_removal_legal
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.installer-remove-stale-installer
          - errors.ERR_STALE_INSTALLER_VERSION
          - endpoints[POST /installers/{id}/remove]
          - endpoints[POST /installers/{id}/scorecard-events]
          - entities.Installer.fields.removal_eligible
        distinguishing_aspect: "The very event that flips removal_eligible to true also advances Installer.version, so the manager who read the installer one event ago is refused 412 even though the removal has just become legal — and the re-read version then removes an installer whose composite sits exactly on 70.00."
        test_recipe:
          setup:
            - "One ACTIVE installer in METRO-02 with four manual events filed at the clock: PUNCH_SAFETY, PUNCH_MINOR and two CSAT_SURVEY(csat 2). Quality 67.00, timeliness 82.00, satisfaction 66.00, composite 71.25 — above the removal ceiling, so removal_eligible is still false and the installer sits in PROBATION."
            - "A fifth CSAT_SURVEY(csat 2) then takes satisfaction to 61.00 and the composite to exactly 70.00, flipping removal_eligible to true and bumping the version."
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { code: "METRO-02", name: "Harbor District", permit_required_trades: [], permit_responsible_party: "RETAILER", inspection_required: false, min_liability_coverage_cents: 100000000, permit_unit_threshold: 0, inspection_lead_days: 3, max_concurrent_inspections: 2, background_check_recency_days: 365, license_required: true, labor_complexity_multiplier: 1.00, status: "ACTIVE" }
              as: ProgramAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /installers"
              payload: { legal_name: "Northside Flooring LLC", contact_email: "ops@northside.example", primary_trade_code: "FLOORING", liability_coverage_cents: 200000000, insurance_expires_on: "2027-06-30T00:00:00.000Z" }
              as: NetworkManager
              captures: { inst_id: $.data.id }
            - call: "POST /installers/${inst_id}/credentials"
              payload: { jurisdiction_id: "${jur_id}", trade_code: "FLOORING", license_number: "FL-99213", license_expires_on: "2027-05-31T00:00:00.000Z", permit_pulling_authorized: false }
              as: NetworkManager
              captures: { cred_id: $.data.id }
            - call: "POST /installer-credentials/${cred_id}/verify"
              payload: { verification_decision: "VERIFY" }
              as: NetworkManager
            - call: "POST /installers/${inst_id}/background-check"
              payload: { result: "PASS", completed_at: "2026-07-15T00:00:00.000Z" }
              as: NetworkManager
            - call: "POST /installers/${inst_id}/activate"
              payload: {}
              as: NetworkManager
            - call: "POST /installers/${inst_id}/scorecard-events"
              payload: { event_type: "PUNCH_SAFETY", occurred_at: "2026-08-01T00:00:00.000Z" }
              as: ServiceManager
            - call: "POST /installers/${inst_id}/scorecard-events"
              payload: { event_type: "PUNCH_MINOR", occurred_at: "2026-08-01T00:00:00.000Z" }
              as: ServiceManager
            - call: "POST /installers/${inst_id}/scorecard-events"
              payload: { event_type: "CSAT_SURVEY", occurred_at: "2026-08-01T00:00:00.000Z", csat_score: 2 }
              as: ServiceManager
            - call: "POST /installers/${inst_id}/scorecard-events"
              payload: { event_type: "CSAT_SURVEY", occurred_at: "2026-08-01T00:00:00.000Z", csat_score: 2 }
              as: ServiceManager
            - call: "GET /installers/${inst_id}"
              payload: {}
              as: ServiceManager
              captures: { iv_stale: $.data.version, comp4: $.data.composite_score, elig4: $.data.removal_eligible, st4: $.data.status }
            - call: "POST /installers/${inst_id}/scorecard-events"
              payload: { event_type: "CSAT_SURVEY", occurred_at: "2026-08-01T00:00:00.000Z", csat_score: 2 }
              as: ServiceManager
            - call: "GET /installers/${inst_id}"
              payload: {}
              as: ServiceManager
              captures: { iv_fresh: $.data.version, comp5: $.data.composite_score, elig5: $.data.removal_eligible, ec5: $.data.rolling_event_count }
          trigger:
            - call: "POST /installers/${inst_id}/remove"
              payload: { removal_reason: "Composite at the removal ceiling", expected_installer_version: "${iv_stale}" }
              as: ServiceManager
              captures: { e_stale: $.data.error_id }
            - call: "POST /installers/${inst_id}/remove"
              payload: { removal_reason: "Composite at the removal ceiling", expected_installer_version: "${iv_fresh}" }
              as: ServiceManager
              captures: { st6: $.data.status, iv6: $.data.version }
          assert:
            - "${comp4} == 71.25 AND ${elig4} == false AND ${st4} == 'PROBATION' — four events are enough for PROBATION but not for removal"
            - "${comp5} == 70.00 AND ${elig5} == true AND ${ec5} == 5 AND ${iv_fresh} == ${iv_stale} + 1"
            - "${e_stale} == 'ERR_STALE_INSTALLER_VERSION' with HTTP 412 — the eligibility-granting event is the write that invalidated the manager's view"
            - "After the 412, Installer.${inst_id}.status == 'PROBATION' AND removed_at == null AND version == ${iv_fresh}"
            - "${st6} == 'REMOVED' AND removed_at == '2026-08-01T00:00:00.000Z' AND ${iv6} == ${iv_fresh} + 1"

      - name: probation_threshold_fires_at_exactly_seventy_eight_and_resets_above_it
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.installer_scorecard
          - state_machines.Installer.status.ACTIVE_to_PROBATION
          - state_machines.Installer.status.PROBATION_to_ACTIVE
          - entities.Installer.fields.composite_score
        distinguishing_aspect: "Four events land the composite on exactly PROBATION_COMPOSITE_MAX 78.00 and the inclusive comparison drives ACTIVE -> PROBATION; a fifth ON_TIME_COMPLETION lifts it to 80.95, strictly above the ceiling, and the installer resets to ACTIVE — the same threshold read in both directions in one timeline."
        test_recipe:
          setup:
            - "One ACTIVE installer in METRO-02 with no prior events, so the composite starts at BASE_SCORE 85.00."
            - "All events are filed at the clock 2026-08-01T00:00:00.000Z, so every one of them is inside the 90-day rolling window at full weight."
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { code: "METRO-02", name: "Harbor District", permit_required_trades: [], permit_responsible_party: "RETAILER", inspection_required: false, min_liability_coverage_cents: 100000000, permit_unit_threshold: 0, inspection_lead_days: 3, max_concurrent_inspections: 2, background_check_recency_days: 365, license_required: true, labor_complexity_multiplier: 1.00, status: "ACTIVE" }
