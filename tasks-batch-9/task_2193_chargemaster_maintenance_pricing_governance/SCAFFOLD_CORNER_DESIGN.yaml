      - name: department_revenue_code_allowlist_applies_only_when_populated_and_yields_to_the_mapping_check
        claim_type: conditional_validation
        grounds:
          - validations[priority=23]
          - validations[priority=24]
          - entities.Department.allowed_revenue_code_values
        distinguishing_aspect: "Department CC-100 restricts allowed_revenue_code_values to ['0300'] while CC-200 leaves it empty. The identical HCPCS body is rejected with ERR_REVENUE_CODE_MAPPING_INVALID in CC-100 while code_value is null (priority 23 outranks 24 even though both fail), then with ERR_DEPARTMENT_REVENUE_CODE_NOT_ALLOWED once code_value is supplied, and is accepted unchanged in CC-200 because the empty allowlist disables the rule entirely."
