              as_user_id: "${md_id}"
            - call: "PATCH /nonprofits/organizations/${md_id}"
              payload: { expected_organization_version: "${md_v0}", demographic_records: [{ category: "AGE_BAND", value_code: "AGE_35_44", disclosure_level: "PUBLIC", fiscal_year: 2025 }] }
              as: OrganizationUser
              as_user_id: "${md_id}"
              captures: { md_v1: $.data.version }
            - call: "POST /nonprofits/filings"
              payload: { organization_id: "${md_id}", form_type: "FORM_990", form_version_year: 2023, tax_year: 2024, coverage_start: "2024-01-01T00:00:00Z", coverage_end: "2024-12-31T00:00:00Z", source: "IRS_BULK_XML", expected_organization_version: "${md_v1}" }
              as: OrganizationUser
              as_user_id: "${md_id}"
              captures: { md_f24: $.data.id }
            - call: "POST /nonprofits/filings/${md_f24}/extract"
              payload: { raw_lines: [{ line_code: "TOTREV", raw_value: "4000000.00", raw_format: "USD_WHOLE", is_revenue_component: true }] }
              as: PlatformVerifier
              as_user_id: "ver-dana"
            - call: "POST /nonprofits/filings/${md_f24}/normalize"
