# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth probe across the claim-extraction-guide sections. Every setup_api_calls
# chain drives empty-DB -> precondition using only §1.5 endpoints. Names are
# unique across this file and SCAFFOLD_DIFFICULTY_DESIGN.yaml.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_incident_returns_201_with_defaults
        claim_type: Creation
        grounds:
          - entities.Incident.fields.op_status
          - entities.Incident.fields.activation_level
          - entities.Incident.fields.declaration_status
        distinguishing_aspect: "POST /eoc/incidents with name+hazard_type returns 201 with op_status=MONITORING, activation_level=LEVEL_3, declaration_status=INELIGIBLE, declaration_category=EMERGENCY, version=1."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /eoc/incidents"
              payload: { name: "New Watch", hazard_type: "FLOOD" }
              as: EOCManager
              captures: { inc_id: $.data.id }
          assert:
            - "Incident.${inc_id}.op_status == MONITORING"
            - "Incident.${inc_id}.activation_level == LEVEL_3"
            - "Incident.${inc_id}.declaration_status == INELIGIBLE"
            - "Incident.${inc_id}.declaration_category == EMERGENCY"
            - "Incident.${inc_id}.version == 1"

      - name: create_incident_missing_required_field_returns_400
        claim_type: Required Fields
        grounds:
          - entities.Incident.fields.hazard_type
          - errors[ERR_VALIDATION]
        distinguishing_aspect: "POST /eoc/incidents without hazard_type returns ERR_VALIDATION (400); no incident is created."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /eoc/incidents"
              payload: { name: "Nameless Hazard" }
              as: EOCManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_VALIDATION (HTTP 400)"

      - name: get_incident_not_found_returns_404
        claim_type: Not Found
        grounds:
          - errors[ERR_INCIDENT_NOT_FOUND]
        distinguishing_aspect: "GET /eoc/incidents/{unknown-uuid} returns ERR_INCIDENT_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /eoc/incidents/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: EOCManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INCIDENT_NOT_FOUND (HTTP 404)"

      - name: pool_computed_units_available_on_create
        claim_type: Computed Fields
        grounds:
          - entities.ResourcePool.fields.units_available
          - calculations.resource_pool_availability
        distinguishing_aspect: "A newly created ResourcePool with total_units=8 has units_available=8, units_reserved=0, units_committed=0."
        test_recipe:
          setup: ["A Jurisdiction exists."]
          setup_api_calls:
            - call: "POST /eoc/jurisdictions"
              payload: { name: "Pool Owner" }
              as: EOCManager
              captures: { jur_id: $.data.id }
          trigger:
            - call: "POST /eoc/resource-pools"
              payload: { jurisdiction_id: "${jur_id}", resource_type: "VEHICLE", total_units: 8 }
              as: LogisticsChief
              captures: { pool_id: $.data.id }
          assert:
            - "ResourcePool.${pool_id}.units_available == 8"
            - "ResourcePool.${pool_id}.units_reserved == 0"
            - "ResourcePool.${pool_id}.units_committed == 0"

      - name: resource_request_default_priority_applied
        claim_type: Defaults
        grounds:
          - entities.ResourceRequest.fields.priority
        distinguishing_aspect: "POST /eoc/resource-requests without priority defaults priority=MEDIUM and status=DRAFT."
        test_recipe:
          setup: ["Incident exists (MONITORING is fine; creation does not require ACTIVATED)."]
          setup_api_calls:
            - call: "POST /eoc/incidents"
              payload: { name: "Draft Ctx", hazard_type: "FLOOD" }
              as: EOCManager
              captures: { inc_id: $.data.id }
          trigger:
            - call: "POST /eoc/resource-requests"
              payload: { incident_id: "${inc_id}", resource_type: "SUPPLY", requested_quantity: 2 }
              as: OperationsChief
              captures: { req_id: $.data.id }
          assert:
            - "ResourceRequest.${req_id}.priority == MEDIUM"
            - "ResourceRequest.${req_id}.status == DRAFT"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: cancel_task_from_completed_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Task.ASSIGNED_to_COMPLETED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "A COMPLETED Task cannot be CANCELLED; the transition returns ERR_INVALID_STATE (409) and the task stays COMPLETED."
        test_recipe:
          setup: ["Incident ACTIVATED; PUBLISHED IAP; Task ASSIGNED then COMPLETED (no backing request)."]
          setup_api_calls:
            - call: "POST /eoc/incidents"
              payload: { name: "SM Ctx", hazard_type: "EARTHQUAKE" }
              as: EOCManager
              captures: { inc_id: $.data.id }
            - call: "POST /eoc/incidents/${inc_id}/transition"
              payload: { to_status: "ACTIVATED" }
              as: EOCManager
            - call: "GET /eoc/incidents/${inc_id}"
              payload: {}
              as: PlanningChief
              captures: { inc_v: $.data.version }
            - call: "POST /eoc/incident-action-plans"
              payload: { incident_id: "${inc_id}", operational_period_start: "2026-03-01T06:00:00Z", operational_period_end: "2026-03-02T06:00:00Z", expected_incident_version: "${inc_v}" }
              as: PlanningChief
              captures: { iap_id: $.data.id }
            - call: "POST /eoc/incident-action-plans/${iap_id}/transition"
              payload: { to_status: "PUBLISHED" }
              as: PlanningChief
            - call: "POST /eoc/tasks"
              payload: { iap_id: "${iap_id}", title: "Recon" }
              as: PlanningChief
              captures: { task_id: $.data.id }
            - call: "POST /eoc/tasks/${task_id}/transition"
              payload: { to_status: "ASSIGNED" }
              as: OperationsChief
            - call: "POST /eoc/tasks/${task_id}/transition"
              payload: { to_status: "COMPLETED" }
              as: OperationsChief
          trigger:
            - call: "POST /eoc/tasks/${task_id}/transition"
              payload: { to_status: "CANCELLED" }
              as: OperationsChief
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE (HTTP 409)"
            - "Task.${task_id}.status == COMPLETED"

      - name: costrecord_void_then_actual_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.CostRecord.ESTIMATED_to_VOID
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "A VOID CostRecord (terminal) cannot transition to ACTUAL; ERR_INVALID_STATE (409) is returned."
        test_recipe:
          setup: ["Incident ACTIVATED; CostRecord created then VOID."]
          setup_api_calls:
            - call: "POST /eoc/incidents"
              payload: { name: "Fin Ctx", hazard_type: "WILDFIRE" }
              as: EOCManager
              captures: { inc_id: $.data.id }
            - call: "POST /eoc/incidents/${inc_id}/transition"
              payload: { to_status: "ACTIVATED" }
              as: EOCManager
            - call: "GET /eoc/incidents/${inc_id}"
              payload: {}
              as: FinanceChief
              captures: { inc_v: $.data.version }
            - call: "POST /eoc/cost-records"
              payload: { incident_id: "${inc_id}", category: "LABOR", estimated_cost: 250.00, expected_incident_version: "${inc_v}" }
              as: FinanceChief
              captures: { cost_id: $.data.id }
            - call: "POST /eoc/cost-records/${cost_id}/transition"
              payload: { to_status: "VOID" }
              as: FinanceChief
          trigger:
            - call: "POST /eoc/cost-records/${cost_id}/transition"
              payload: { to_status: "ACTUAL", actual_cost: 300.00 }
              as: FinanceChief
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE (HTTP 409)"
            - "CostRecord.${cost_id}.status == VOID"

      - name: shelter_close_with_occupants_rejected
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Shelter.OPEN_to_CLOSED
          - errors[ERR_SHELTER_OCCUPIED]
        distinguishing_aspect: "An OPEN shelter with current_occupancy=5 cannot close; ERR_SHELTER_OCCUPIED (409) is returned and the shelter stays OPEN."
        test_recipe:
          setup: ["Incident ACTIVATED; Shelter OPEN with current_occupancy=5."]
          setup_api_calls:
            - call: "POST /eoc/incidents"
              payload: { name: "Shelter Ctx", hazard_type: "HURRICANE" }
              as: EOCManager
              captures: { inc_id: $.data.id }
            - call: "POST /eoc/incidents/${inc_id}/transition"
              payload: { to_status: "ACTIVATED" }
              as: EOCManager
            - call: "POST /eoc/shelters"
              payload: { incident_id: "${inc_id}", name: "Gym A", capacity: 50 }
              as: OperationsChief
              captures: { sh_id: $.data.id }
            - call: "POST /eoc/shelters/${sh_id}/transition"
              payload: { to_status: "OPEN" }
              as: OperationsChief
            - call: "POST /eoc/shelters/${sh_id}/occupancy"
              payload: { check_in: 5 }
              as: OperationsChief
          trigger:
            - call: "POST /eoc/shelters/${sh_id}/transition"
              payload: { to_status: "CLOSED" }
              as: OperationsChief
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_SHELTER_OCCUPIED (HTTP 409)"
            - "Shelter.${sh_id}.status == OPEN"

      - name: shelter_close_when_empty_succeeds
        claim_type: Valid Transition
        grounds:
          - state_machines.Shelter.OPEN_to_CLOSED
          - entities.Shelter.fields.current_occupancy
        distinguishing_aspect: "An OPEN shelter with current_occupancy=0 and reserved_occupancy=0 closes successfully (zero-count boundary satisfied)."
        test_recipe:
          setup: ["Incident ACTIVATED; Shelter OPEN with no occupants."]
          setup_api_calls:
            - call: "POST /eoc/incidents"
              payload: { name: "Empty Shelter Ctx", hazard_type: "HURRICANE" }
              as: EOCManager
              captures: { inc_id: $.data.id }
            - call: "POST /eoc/incidents/${inc_id}/transition"
              payload: { to_status: "ACTIVATED" }
              as: EOCManager
            - call: "POST /eoc/shelters"
              payload: { incident_id: "${inc_id}", name: "Gym B", capacity: 50 }
              as: OperationsChief
              captures: { sh_id: $.data.id }
            - call: "POST /eoc/shelters/${sh_id}/transition"
              payload: { to_status: "OPEN" }
              as: OperationsChief
          trigger:
            - call: "POST /eoc/shelters/${sh_id}/transition"
              payload: { to_status: "CLOSED" }
              as: OperationsChief
          assert:
            - "Shelter.${sh_id}.status == CLOSED"
            - "Shelter.${sh_id}.closed_at is not null"

      - name: iap_adjacent_operational_periods_allowed
        claim_type: Valid Transition
        grounds:
          - state_machines.IncidentActionPlan.DRAFT_to_PUBLISHED
          - entities.IncidentActionPlan.fields.operational_period_end
        distinguishing_aspect: "Two IAPs whose periods touch at a boundary (prev.end == next.start) both PUBLISH successfully — adjacency is not an overlap under half-open semantics."
        test_recipe:
          setup: ["Incident ACTIVATED; IAP #1 [2026-03-01T06:00:00Z, 2026-03-02T06:00:00Z) PUBLISHED; IAP #2 [2026-03-02T06:00:00Z, 2026-03-03T06:00:00Z) DRAFT."]
          setup_api_calls:
            - call: "POST /eoc/incidents"
              payload: { name: "Adjacency Ctx", hazard_type: "HURRICANE" }
              as: EOCManager
              captures: { inc_id: $.data.id }
            - call: "POST /eoc/incidents/${inc_id}/transition"
              payload: { to_status: "ACTIVATED" }
              as: EOCManager
            - call: "GET /eoc/incidents/${inc_id}"
              payload: {}
              as: PlanningChief
              captures: { inc_v1: $.data.version }
            - call: "POST /eoc/incident-action-plans"
              payload: { incident_id: "${inc_id}", operational_period_start: "2026-03-01T06:00:00Z", operational_period_end: "2026-03-02T06:00:00Z", expected_incident_version: "${inc_v1}" }
              as: PlanningChief
              captures: { iap1: $.data.id }
            - call: "POST /eoc/incident-action-plans/${iap1}/transition"
              payload: { to_status: "PUBLISHED" }
              as: PlanningChief
            - call: "GET /eoc/incidents/${inc_id}"
              payload: {}
              as: PlanningChief
              captures: { inc_v2: $.data.version }
            - call: "POST /eoc/incident-action-plans"
              payload: { incident_id: "${inc_id}", operational_period_start: "2026-03-02T06:00:00Z", operational_period_end: "2026-03-03T06:00:00Z", expected_incident_version: "${inc_v2}" }
              as: PlanningChief
              captures: { iap2: $.data.id }
          trigger:
            - call: "POST /eoc/incident-action-plans/${iap2}/transition"
              payload: { to_status: "PUBLISHED" }
              as: PlanningChief
          assert:
            - "IncidentActionPlan.${iap2}.status == PUBLISHED"
            - "Incident.${inc_id}.current_iap_id == ${iap2}"

      - name: resubmit_denied_request_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.ResourceRequest.SUBMITTED_to_DENIED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "A DENIED (terminal) ResourceRequest cannot be moved back to SUBMITTED; ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["Incident ACTIVATED; ResourceRequest SUBMITTED then DENIED."]
          setup_api_calls:
            - call: "POST /eoc/incidents"
              payload: { name: "Deny Ctx", hazard_type: "HAZMAT" }
              as: EOCManager
              captures: { inc_id: $.data.id }
            - call: "POST /eoc/incidents/${inc_id}/transition"
              payload: { to_status: "ACTIVATED" }
              as: EOCManager
            - call: "POST /eoc/resource-requests"
              payload: { incident_id: "${inc_id}", resource_type: "EQUIPMENT", requested_quantity: 2 }
              as: OperationsChief
              captures: { req_id: $.data.id }
            - call: "POST /eoc/resource-requests/${req_id}/transition"
              payload: { to_status: "SUBMITTED" }
              as: OperationsChief
            - call: "POST /eoc/resource-requests/${req_id}/transition"
              payload: { to_status: "DENIED" }
              as: LogisticsChief
          trigger:
            - call: "POST /eoc/resource-requests/${req_id}/transition"
              payload: { to_status: "SUBMITTED" }
              as: OperationsChief
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE (HTTP 409)"
            - "ResourceRequest.${req_id}.status == DENIED"

  # ===========================================================================
  - section: calculations
    instances:
      - name: federal_share_zero_when_ineligible
        claim_type: Constants Applied
        grounds:
          - calculations.federal_share_percentage
          - entities.Incident.fields.federal_share_estimated
        distinguishing_aspect: "With declaration_status=INELIGIBLE, pct=0.0 so federal_share_estimated=0 even though a 1000.00 eligible ESTIMATED cost record raises total_committed_cost to 1000.00."
        test_recipe:
          setup: ["Incident ACTIVATED, no validated damage (INELIGIBLE); one eligible ESTIMATED CostRecord estimated_cost=1000.00."]
          setup_api_calls:
            - call: "POST /eoc/incidents"
              payload: { name: "Ineligible Ctx", hazard_type: "FLOOD" }
              as: EOCManager
              captures: { inc_id: $.data.id }
            - call: "POST /eoc/incidents/${inc_id}/transition"
              payload: { to_status: "ACTIVATED" }
              as: EOCManager
            - call: "GET /eoc/incidents/${inc_id}"
              payload: {}
              as: FinanceChief
              captures: { inc_v: $.data.version }
          trigger:
            - call: "POST /eoc/cost-records"
              payload: { incident_id: "${inc_id}", category: "CONTRACT", estimated_cost: 1000.00, eligible: true, expected_incident_version: "${inc_v}" }
              as: FinanceChief
              captures: { cost_id: $.data.id }
          assert:
            - "Incident.${inc_id}.declaration_status == INELIGIBLE"
            - "Incident.${inc_id}.federal_share_estimated == 0"
            - "Incident.${inc_id}.total_committed_cost == 1000.00"

      - name: ineligible_costrecord_excluded_from_federal_share
        claim_type: Input Set Filtering
        grounds:
          - calculations.incident_cost_rollup
          - entities.CostRecord.fields.eligible
        distinguishing_aspect: "With declaration ELIGIBLE and pct=0.75, an eligible=false CostRecord (1000.00) contributes to total_committed_cost (1000.00) but is excluded from federal_share_estimated (0)."
        test_recipe:
          setup: ["Incident ACTIVATED, declaration ELIGIBLE (damage=5,000,000); one eligible=false ESTIMATED CostRecord estimated_cost=1000.00."]
          setup_api_calls:
            - call: "POST /eoc/incidents"
              payload: { name: "Filter Ctx", hazard_type: "FLOOD" }
              as: EOCManager
              captures: { inc_id: $.data.id }
            - call: "POST /eoc/incidents/${inc_id}/transition"
              payload: { to_status: "ACTIVATED" }
              as: EOCManager
            - call: "POST /eoc/damage-assessments"
              payload: { incident_id: "${inc_id}", site_name: "Dam 2", estimated_loss: 5000000, infrastructure_category: "CAT_E_BUILDINGS" }
              as: PlanningChief
              captures: { da_id: $.data.id }
            - call: "POST /eoc/damage-assessments/${da_id}/transition"
              payload: { to_status: "VALIDATED" }
              as: PlanningChief
            - call: "GET /eoc/incidents/${inc_id}"
              payload: {}
              as: FinanceChief
              captures: { inc_v: $.data.version }
          trigger:
            - call: "POST /eoc/cost-records"
              payload: { incident_id: "${inc_id}", category: "CONTRACT", estimated_cost: 1000.00, eligible: false, expected_incident_version: "${inc_v}" }
              as: FinanceChief
              captures: { cost_id: $.data.id }
          assert:
            - "Incident.${inc_id}.total_committed_cost == 1000.00"
            - "Incident.${inc_id}.federal_share_estimated == 0"

      - name: pool_reservation_on_source
        claim_type: Correct Result
        grounds:
          - calculations.resource_pool_availability
          - state_machines.ResourceRequest.SUBMITTED_to_SOURCED
        distinguishing_aspect: "SOURCED reserves units: a 4-unit request against a 10-unit pool moves units_reserved to 4 and units_available to 6 while units_committed stays 0."
        test_recipe:
          setup: ["Incident ACTIVATED; pool total_units=10; ResourceRequest (4 units) SUBMITTED."]
          setup_api_calls:
            - call: "POST /eoc/incidents"
              payload: { name: "Reserve Ctx", hazard_type: "WILDFIRE" }
              as: EOCManager
              captures: { inc_id: $.data.id }
            - call: "POST /eoc/incidents/${inc_id}/transition"
              payload: { to_status: "ACTIVATED" }
              as: EOCManager
            - call: "POST /eoc/jurisdictions"
              payload: { name: "Reserve Owner" }
              as: EOCManager
              captures: { jur_id: $.data.id }
            - call: "POST /eoc/resource-pools"
              payload: { jurisdiction_id: "${jur_id}", resource_type: "PERSONNEL", total_units: 10 }
              as: LogisticsChief
              captures: { pool_id: $.data.id }
            - call: "POST /eoc/resource-requests"
              payload: { incident_id: "${inc_id}", resource_type: "PERSONNEL", requested_quantity: 4 }
              as: OperationsChief
              captures: { req_id: $.data.id }
            - call: "POST /eoc/resource-requests/${req_id}/transition"
              payload: { to_status: "SUBMITTED" }
              as: OperationsChief
          trigger:
            - call: "POST /eoc/resource-requests/${req_id}/transition"
              payload: { to_status: "SOURCED", pool_id: "${pool_id}" }
              as: LogisticsChief
          assert:
            - "ResourcePool.${pool_id}.units_reserved == 4"
            - "ResourcePool.${pool_id}.units_available == 6"
            - "ResourcePool.${pool_id}.units_committed == 0"

  # ===========================================================================
  - section: validations
    instances:
      - name: submit_request_zero_quantity_returns_invalid_quantity
        claim_type: Violation → Error
        grounds:
          - validations[priority=10]
          - errors[ERR_INVALID_QUANTITY]
          - state_machines.ResourceRequest.DRAFT_to_SUBMITTED
        distinguishing_aspect: "Submitting a ResourceRequest whose requested_quantity=0 on an ACTIVATED incident returns ERR_INVALID_QUANTITY (422)."
        test_recipe:
          setup: ["Incident ACTIVATED; DRAFT ResourceRequest with requested_quantity=0."]
          setup_api_calls:
            - call: "POST /eoc/incidents"
              payload: { name: "Qty Ctx", hazard_type: "PUBLIC_HEALTH" }
              as: EOCManager
              captures: { inc_id: $.data.id }
            - call: "POST /eoc/incidents/${inc_id}/transition"
              payload: { to_status: "ACTIVATED" }
              as: EOCManager
            - call: "POST /eoc/resource-requests"
              payload: { incident_id: "${inc_id}", resource_type: "SUPPLY", requested_quantity: 0 }
              as: OperationsChief
              captures: { req_id: $.data.id }
          trigger:
            - call: "POST /eoc/resource-requests/${req_id}/transition"
              payload: { to_status: "SUBMITTED" }
              as: OperationsChief
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_QUANTITY (HTTP 422)"
            - "ResourceRequest.${req_id}.status == DRAFT"

      - name: incident_transition_missing_target
        claim_type: Violation → Error
        grounds:
          - validations[priority=10]
          - errors[ERR_MISSING_TRANSITION_TARGET]
        distinguishing_aspect: "POST /eoc/incidents/{id}/transition with neither to_status nor to_activation_level returns ERR_MISSING_TRANSITION_TARGET (422)."
        test_recipe:
          setup: ["An Incident exists."]
          setup_api_calls:
            - call: "POST /eoc/incidents"
              payload: { name: "Target Ctx", hazard_type: "FLOOD" }
              as: EOCManager
              captures: { inc_id: $.data.id }
          trigger:
            - call: "POST /eoc/incidents/${inc_id}/transition"
              payload: {}
              as: EOCManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_MISSING_TRANSITION_TARGET (HTTP 422)"

      - name: cost_record_exceeds_ceiling
        claim_type: Violation → Error
        grounds:
          - validations[priority=11]
          - errors[ERR_COST_CEILING_EXCEEDED]
          - entities.Incident.fields.cost_ceiling
        distinguishing_aspect: "Creating a CostRecord whose estimated_cost (200.00) would push total_committed_cost above cost_ceiling (100) returns ERR_COST_CEILING_EXCEEDED (409)."
        test_recipe:
          setup: ["Incident ACTIVATED with cost_ceiling=100 and no cost records yet."]
          setup_api_calls:
            - call: "POST /eoc/incidents"
              payload: { name: "Ceiling Ctx", hazard_type: "WILDFIRE", cost_ceiling: 100 }
              as: EOCManager
              captures: { inc_id: $.data.id }
            - call: "POST /eoc/incidents/${inc_id}/transition"
              payload: { to_status: "ACTIVATED" }
              as: EOCManager
            - call: "GET /eoc/incidents/${inc_id}"
              payload: {}
              as: FinanceChief
              captures: { inc_v: $.data.version }
          trigger:
            - call: "POST /eoc/cost-records"
              payload: { incident_id: "${inc_id}", category: "LABOR", estimated_cost: 200.00, expected_incident_version: "${inc_v}" }
              as: FinanceChief
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_COST_CEILING_EXCEEDED (HTTP 409)"

  # ===========================================================================
  - section: rbac
    instances:
      - name: operations_chief_cannot_create_resource_pool
        claim_type: Role Denial
        grounds:
          - roles.OperationsChief
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: "OperationsChief calling POST /eoc/resource-pools (LogisticsChief-exclusive) returns ERR_UNAUTHORIZED (403)."
        test_recipe:
          setup: ["A Jurisdiction exists."]
          setup_api_calls:
            - call: "POST /eoc/jurisdictions"
              payload: { name: "RBAC Owner" }
              as: EOCManager
              captures: { jur_id: $.data.id }
          trigger:
            - call: "POST /eoc/resource-pools"
              payload: { jurisdiction_id: "${jur_id}", resource_type: "VEHICLE", total_units: 4 }
              as: OperationsChief
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_UNAUTHORIZED (HTTP 403)"

      - name: liaison_cannot_create_incident
        claim_type: Role Denial
        grounds:
          - roles.JurisdictionLiaison
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: "JurisdictionLiaison calling POST /eoc/incidents (EOCManager-exclusive) returns ERR_UNAUTHORIZED (403)."
        test_recipe:
          setup: ["A Jurisdiction exists so the liaison has an identity id."]
          setup_api_calls:
            - call: "POST /eoc/jurisdictions"
              payload: { name: "Liaison Home" }
              as: EOCManager
              captures: { jur_id: $.data.id }
          trigger:
            - call: "POST /eoc/incidents"
              payload: { name: "Illegal", hazard_type: "FLOOD" }
              as: JurisdictionLiaison
              as_user_id: "${jur_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_UNAUTHORIZED (HTTP 403)"

      - name: mutual_aid_offer_by_wrong_jurisdiction_owner
        claim_type: Role Denial
        grounds:
          - validations[priority=4]
          - errors[ERR_NOT_RESOURCE_OWNER]
          - state_machines.MutualAidRequest.REQUESTED_to_OFFERED
        distinguishing_aspect: "A JurisdictionLiaison whose X-User-ID is a DIFFERENT jurisdiction than to_jurisdiction_id cannot OFFER; ERR_NOT_RESOURCE_OWNER (403)."
        test_recipe:
          setup: ["Incident ACTIVATED; two Jurisdictions (target jur1, other jur2); MutualAidRequest to jur1 in REQUESTED."]
          setup_api_calls:
            - call: "POST /eoc/incidents"
              payload: { name: "Owner Ctx", hazard_type: "FLOOD" }
              as: EOCManager
              captures: { inc_id: $.data.id }
            - call: "POST /eoc/incidents/${inc_id}/transition"
              payload: { to_status: "ACTIVATED" }
              as: EOCManager
            - call: "POST /eoc/jurisdictions"
              payload: { name: "Target Jur" }
              as: EOCManager
              captures: { jur1: $.data.id }
            - call: "POST /eoc/jurisdictions"
              payload: { name: "Other Jur" }
              as: EOCManager
              captures: { jur2: $.data.id }
            - call: "POST /eoc/mutual-aid-requests"
              payload: { incident_id: "${inc_id}", to_jurisdiction_id: "${jur1}", resource_type: "PERSONNEL", requested_units: 3 }
              as: LogisticsChief
              captures: { ma_id: $.data.id }
          trigger:
            - call: "POST /eoc/mutual-aid-requests/${ma_id}/transition"
              payload: { to_status: "OFFERED", offered_units: 3 }
              as: JurisdictionLiaison
              as_user_id: "${jur2}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NOT_RESOURCE_OWNER (HTTP 403)"
            - "MutualAidRequest.${ma_id}.status == REQUESTED"

  # ===========================================================================
  - section: endpoints
    instances:
      - name: situation_report_snapshot_reflects_state
        claim_type: Computed read
        grounds:
          - entities.Incident.fields.op_status
          - entities.Incident.fields.declaration_status
        distinguishing_aspect: "GET /eoc/incidents/{id}/situation-report returns a snapshot whose op_status=ACTIVATED, open_shelter_count=1, total_shelter_occupancy=7 after opening a shelter and checking in 7."
        test_recipe:
          setup: ["Incident ACTIVATED; one OPEN shelter with current_occupancy=7."]
          setup_api_calls:
            - call: "POST /eoc/incidents"
              payload: { name: "SitRep Ctx", hazard_type: "HURRICANE" }
              as: EOCManager
              captures: { inc_id: $.data.id }
            - call: "POST /eoc/incidents/${inc_id}/transition"
              payload: { to_status: "ACTIVATED" }
              as: EOCManager
            - call: "POST /eoc/shelters"
              payload: { incident_id: "${inc_id}", name: "Arena", capacity: 200 }
              as: OperationsChief
              captures: { sh_id: $.data.id }
            - call: "POST /eoc/shelters/${sh_id}/transition"
              payload: { to_status: "OPEN" }
              as: OperationsChief
            - call: "POST /eoc/shelters/${sh_id}/occupancy"
              payload: { check_in: 7 }
              as: OperationsChief
          trigger:
            - call: "GET /eoc/incidents/${inc_id}/situation-report"
              payload: {}
              as: PlanningChief
          assert:
            - "situation-report.op_status == ACTIVATED"
            - "situation-report.open_shelter_count == 1"
            - "situation-report.total_shelter_occupancy == 7"

      - name: list_incident_resource_requests_reverse_reachability
        claim_type: Listing
        grounds:
          - entities.ResourceRequest.fields.incident_id
        distinguishing_aspect: "GET /eoc/incidents/{id}/resource-requests returns the incident's requests as an array (reverse-reachability for ResourceRequest.incident_id)."
        test_recipe:
          setup: ["Incident ACTIVATED with one DRAFT ResourceRequest."]
          setup_api_calls:
            - call: "POST /eoc/incidents"
              payload: { name: "List Ctx", hazard_type: "FLOOD" }
              as: EOCManager
              captures: { inc_id: $.data.id }
            - call: "POST /eoc/incidents/${inc_id}/transition"
              payload: { to_status: "ACTIVATED" }
              as: EOCManager
            - call: "POST /eoc/resource-requests"
              payload: { incident_id: "${inc_id}", resource_type: "SUPPLY", requested_quantity: 2 }
              as: OperationsChief
              captures: { req_id: $.data.id }
          trigger:
            - call: "GET /eoc/incidents/${inc_id}/resource-requests"
              payload: {}
              as: LogisticsChief
          assert:
            - "response data is an array containing a ResourceRequest with id == ${req_id}"

      - name: filter_tasks_by_iap_reverse_reachability
        claim_type: Listing
        grounds:
          - entities.Task.fields.iap_id
        distinguishing_aspect: "GET /eoc/tasks?iap_id={iap} returns tasks belonging to that IAP (reverse-reachability for Task.iap_id)."
        test_recipe:
          setup: ["Incident ACTIVATED; a DRAFT IAP; one PLANNED Task under it."]
          setup_api_calls:
            - call: "POST /eoc/incidents"
              payload: { name: "Task List Ctx", hazard_type: "EARTHQUAKE" }
              as: EOCManager
              captures: { inc_id: $.data.id }
            - call: "POST /eoc/incidents/${inc_id}/transition"
              payload: { to_status: "ACTIVATED" }
              as: EOCManager
            - call: "GET /eoc/incidents/${inc_id}"
              payload: {}
              as: PlanningChief
              captures: { inc_v: $.data.version }
            - call: "POST /eoc/incident-action-plans"
              payload: { incident_id: "${inc_id}", operational_period_start: "2026-03-01T06:00:00Z", operational_period_end: "2026-03-02T06:00:00Z", expected_incident_version: "${inc_v}" }
              as: PlanningChief
              captures: { iap_id: $.data.id }
            - call: "POST /eoc/tasks"
              payload: { iap_id: "${iap_id}", title: "Survey" }
              as: PlanningChief
              captures: { task_id: $.data.id }
          trigger:
            - call: "GET /eoc/tasks?iap_id=${iap_id}"
              payload: {}
              as: OperationsChief
          assert:
            - "response data is an array containing a Task with id == ${task_id}"

  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_iap_create_conflict
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[iap-create-stale-incident]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "After IAP #1 create advances Incident.version 2->3, a second IAP create still carrying expected_incident_version=2 is rejected ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["Incident ACTIVATED (version=2); client observed version=2; IAP #1 created (version advances to 3)."]
          setup_api_calls:
            - call: "POST /eoc/incidents"
              payload: { name: "OCC IAP Ctx", hazard_type: "FLOOD" }
              as: EOCManager
              captures: { inc_id: $.data.id }
            - call: "POST /eoc/incidents/${inc_id}/transition"
              payload: { to_status: "ACTIVATED" }
              as: EOCManager
            - call: "GET /eoc/incidents/${inc_id}"
              payload: {}
              as: PlanningChief
              captures: { inc_v: $.data.version }
            - call: "POST /eoc/incident-action-plans"
              payload: { incident_id: "${inc_id}", operational_period_start: "2026-03-01T06:00:00Z", operational_period_end: "2026-03-02T06:00:00Z", expected_incident_version: "${inc_v}" }
              as: PlanningChief
              captures: { iap1: $.data.id }
          trigger:
            - call: "POST /eoc/incident-action-plans"
              payload: { incident_id: "${inc_id}", operational_period_start: "2026-03-03T06:00:00Z", operational_period_end: "2026-03-04T06:00:00Z", expected_incident_version: "${inc_v}" }
              as: PlanningChief
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_STALE_VERSION (HTTP 412)"

      - name: occ_stale_cost_record_create_conflict
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[cost-record-create-stale-incident]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "After cost record #1 create advances Incident.version 2->3, a second cost record create still carrying expected_incident_version=2 is rejected ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["Incident ACTIVATED (version=2); client observed version=2; CostRecord #1 created (version advances to 3)."]
          setup_api_calls:
            - call: "POST /eoc/incidents"
              payload: { name: "OCC Cost Ctx", hazard_type: "WILDFIRE" }
              as: EOCManager
              captures: { inc_id: $.data.id }
            - call: "POST /eoc/incidents/${inc_id}/transition"
              payload: { to_status: "ACTIVATED" }
              as: EOCManager
            - call: "GET /eoc/incidents/${inc_id}"
              payload: {}
              as: FinanceChief
              captures: { inc_v: $.data.version }
            - call: "POST /eoc/cost-records"
              payload: { incident_id: "${inc_id}", category: "LABOR", estimated_cost: 100.00, expected_incident_version: "${inc_v}" }
              as: FinanceChief
              captures: { cost1: $.data.id }
          trigger:
            - call: "POST /eoc/cost-records"
              payload: { incident_id: "${inc_id}", category: "MATERIALS", estimated_cost: 100.00, expected_incident_version: "${inc_v}" }
              as: FinanceChief
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_STALE_VERSION (HTTP 412)"

      - name: occ_fresh_version_iap_create_succeeds
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[iap-create-stale-incident]
          - entities.Incident.fields.version
        distinguishing_aspect: "Re-reading Incident.version (=3) after IAP #1 create and supplying it as expected_incident_version lets IAP #2 create succeed (201)."
        test_recipe:
          setup: ["Incident ACTIVATED; IAP #1 created (version now 3); client re-reads version=3."]
          setup_api_calls:
            - call: "POST /eoc/incidents"
              payload: { name: "OCC Fresh Ctx", hazard_type: "FLOOD" }
              as: EOCManager
              captures: { inc_id: $.data.id }
            - call: "POST /eoc/incidents/${inc_id}/transition"
              payload: { to_status: "ACTIVATED" }
              as: EOCManager
            - call: "GET /eoc/incidents/${inc_id}"
              payload: {}
              as: PlanningChief
              captures: { inc_v1: $.data.version }
            - call: "POST /eoc/incident-action-plans"
              payload: { incident_id: "${inc_id}", operational_period_start: "2026-03-01T06:00:00Z", operational_period_end: "2026-03-02T06:00:00Z", expected_incident_version: "${inc_v1}" }
              as: PlanningChief
              captures: { iap1: $.data.id }
            - call: "GET /eoc/incidents/${inc_id}"
              payload: {}
              as: PlanningChief
              captures: { inc_v2: $.data.version }
          trigger:
            - call: "POST /eoc/incident-action-plans"
              payload: { incident_id: "${inc_id}", operational_period_start: "2026-03-03T06:00:00Z", operational_period_end: "2026-03-04T06:00:00Z", expected_incident_version: "${inc_v2}" }
              as: PlanningChief
              captures: { iap2: $.data.id }
          assert:
            - "IncidentActionPlan.${iap2}.status == DRAFT"
            - "Incident.${inc_id}.version == 4"

