# =============================================================================
# task_2546 — Salt Mining & Deicing Product Operations
# Seed tables §1.0–§1.7 (SCAFFOLD.yaml)
# Difficulty band: beyond Expert (§0.4) — 12 entities, 58 endpoints, 46 errors,
# 9 calculations (3 dual-variant), 10 state machines (parallel + cyclic +
# branching + compound), 3 OCC races.
# =============================================================================

scenario: |
  Generate task harder than expert level!

  2546. Salt Mining & Deicing Product Operations (salt mining and evaporation
  producer): mine planning with room and pillar development, ore quality and
  hoisting capacity, crushing, screening and treatment with anticaking and
  corrosion inhibitor additives, seasonal demand forecasting with winter
  severity uncertainty and pre-season stockpiling, municipal and state bid
  contracts with tonnage commitments, price guarantees and failure-to-supply
  penalties, logistics across rail, barge and truck to depots with inventory
  positioning near markets, depot management with covered storage and loadout
  capacity during storm events, product lines across highway deicing, water
  conditioning, food grade and chemical feedstock with quality requirements,
  mine safety compliance and ground control programs

domain_name: salt-deicing-ops
api_prefix: /salt

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: graph
  # graph: Allocation is a true many-to-many junction between DeliveryOrder and
  # StockpileLot; Shipment carries two FKs into the same parent collection
  # (origin_depot_id, destination_depot_id); TreatmentBatch and StockpileLot
  # both point at Depot. All URLs are flat (`/salt/<collection>/{id}`) — no
  # entity is addressed through a parent path segment.

  state_machine_shape: parallel
  # Mine carries two independent state dimensions on one row
  # (hoist_state × compliance_state) that evolve through different endpoints and
  # multiply into one derived capacity number. Panel (PRODUCING↔SUSPENDED),
  # TreatmentBatch (PENDING→PENDING rework self-loop), Depot (OPEN↔SURGE↔CLOSED),
  # DeliveryOrder (REQUESTED↔ALLOCATED/SHORTED) and StockpileLot
  # (AVAILABLE↔QUARANTINED) are cyclic; BidContract is fork-join branching
  # (SUBMITTED→{AWARDED,LOST}, ACTIVE→{CLOSED,FORFEITED}); ProductionRun is
  # compound (auto-CLOSED when every child TreatmentBatch is terminal).

  relationship_patterns:
    - one_to_many          # Mine→Panel, Panel→GroundControlInspection, BidContract→DeliveryOrder
    - many_to_many         # DeliveryOrder ↔ StockpileLot via Allocation
    - cross_aggregate      # TreatmentBatch (mining aggregate) writes StockpileLot (logistics aggregate)

  role_model: segregation_of_duties
  # The X-User-ID that creates a TreatmentBatch may not decide its QC, and the
  # X-User-ID that filed a GroundControlInspection may not issue the Mine
  # compliance-action that cites it. Seven roles otherwise own disjoint
  # resource families, and DepotManager is entity-backed on its own Depot.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Mine
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Mine name", constraints: "1..120 chars, required" }
      - { name: state_code, type: string, source: input, description: "Two-letter US state code of the mine", constraints: "exactly 2 uppercase letters" }
      - { name: rated_hoist_tons_per_day, type: number, source: input, description: "Nameplate shaft hoisting capacity in tons per 24h", constraints: "> 0" }
      - { name: ground_control_plan_version, type: integer, source: input, default: 1, description: "Version number of the filed ground control plan", constraints: ">= 1" }
      - { name: hoist_state, type: enum, source: system, default: HOIST_AVAILABLE, description: "State dimension A — HOIST_AVAILABLE | HOIST_DERATED | HOIST_DOWN", constraints: "HOIST_AVAILABLE | HOIST_DERATED | HOIST_DOWN" }
      - { name: compliance_state, type: enum, source: system, default: COMPLIANT, description: "State dimension B — COMPLIANT | CITED | WITHDRAWAL_ORDER", constraints: "COMPLIANT | CITED | WITHDRAWAL_ORDER" }
      - { name: effective_hoist_tons_per_day, type: number, source: computed, description: "= rated_hoist_tons_per_day * hoist_factor(hoist_state) * compliance_factor(compliance_state) per calculations.mine_effective_hoist_capacity" }
      - { name: scheduled_hoist_tons_open, type: number, source: computed, default: 0, description: "Sum of ProductionRun.planned_tons for runs on this mine with status == SCHEDULED" }
      - { name: producing_panel_count, type: integer, source: computed, default: 0, description: "Count of Panel rows on this mine with status == PRODUCING" }
      - { name: last_compliance_action_at, type: datetime, source: system, description: "Logical-clock timestamp of the most recent compliance-action call; null before the first one" }

  - name: Panel
    parent: Mine
    common_fields: true
    fields:
      - { name: mine_id, type: string, source: input, description: "FK -> Mine.id; the mine this room-and-pillar panel belongs to" }
      - { name: panel_code, type: string, source: input, description: "Operator panel label", constraints: "unique per mine_id, 1..40 chars" }
      - { name: gross_tons_in_place, type: number, source: input, description: "Geological tons in place inside the panel outline", constraints: "> 0" }
      - { name: extraction_ratio_pct, type: number, source: input, description: "Percent of gross tons removed by first-pass room development", constraints: "> 0 and <= 75" }
      - { name: grade_pct_nacl, type: number, source: input, description: "Assayed NaCl grade of the panel ore in percent", constraints: ">= 80 and <= 100, 2 decimals" }
      - { name: insolubles_pct, type: number, source: input, description: "Assayed acid-insolubles content in percent", constraints: ">= 0 and <= 30, 2 decimals" }
      - { name: pillar_recovery_allowed, type: boolean, source: input, default: false, description: "True when the ground control plan permits secondary pillar recovery in this panel" }
      - { name: recoverable_tons, type: number, source: computed, description: "Per calculations.panel_recoverable_tons; recomputed on every mine compliance-action while status IN {PLANNED, DEVELOPED, PRODUCING, SUSPENDED}" }
      - { name: mined_tons, type: number, source: computed, default: 0, description: "Sum of ProductionRun.hoisted_tons for runs on this panel with status IN {HOISTED, CLOSED}" }
      - { name: status, type: enum, source: system, default: PLANNED, description: "PLANNED | DEVELOPED | PRODUCING | SUSPENDED | DEPLETED | ABANDONED", constraints: "PLANNED | DEVELOPED | PRODUCING | SUSPENDED | DEPLETED | ABANDONED" }
      - { name: ground_control_defect_count, type: integer, source: computed, default: 0, description: "Count of GroundControlInspection rows on this panel with finding == DEFECT" }
      - { name: open_defect, type: boolean, source: computed, default: false, description: "True when the panel's latest GroundControlInspection by created_at DESC has finding == DEFECT" }
      - { name: suspended_by_user_id, type: string, source: system, description: "X-User-ID of the GroundControlEngineer whose DEFECT inspection last suspended this panel; null when never suspended" }

  - name: GroundControlInspection
    parent: Panel
    common_fields: false
    fields:
      - { name: panel_id, type: string, source: input, description: "FK -> Panel.id; the panel inspected" }
      - { name: roof_span_ft, type: number, source: input, description: "Unsupported roof span measured at the inspection point in feet", constraints: "> 0 and <= 120" }
      - { name: convergence_rate_in_per_day, type: number, source: input, description: "Measured roof-to-floor convergence in inches per day", constraints: ">= 0, 3 decimals" }
      - { name: finding, type: enum, source: input, description: "PASS | ADVISORY | DEFECT", constraints: "PASS | ADVISORY | DEFECT" }
      - { name: inspector_user_id, type: string, source: system, description: "X-User-ID of the GroundControlEngineer that filed this immutable inspection record" }
      - { name: caused_suspension, type: boolean, source: computed, default: false, description: "True when filing this record moved the panel PRODUCING -> SUSPENDED" }

  - name: ProductionRun
    parent: Mine
    common_fields: true
    fields:
      - { name: mine_id, type: string, source: input, description: "FK -> Mine.id; the mine whose shaft hoists this run" }
      - { name: panel_id, type: string, source: input, description: "FK -> Panel.id; the panel mined by this run" }
      - { name: planned_tons, type: number, source: input, description: "Tons planned to be hoisted inside the hoist window", constraints: "> 0" }
      - { name: hoist_window_start, type: datetime, source: input, description: "Inclusive start of the shaft window reserved for this run (ISO 8601 UTC)" }
      - { name: hoist_window_end, type: datetime, source: input, description: "Exclusive end of the shaft window reserved for this run (ISO 8601 UTC)", constraints: "> hoist_window_start" }
      - { name: planned_tons_per_hour, type: number, source: computed, description: "= planned_tons / ((hoist_window_end - hoist_window_start) in hours), 4 decimals" }
      - { name: hoisted_tons, type: number, source: input, default: 0, description: "Tons actually hoisted, supplied at the hoist call" }
      - { name: status, type: enum, source: system, default: SCHEDULED, description: "SCHEDULED | HOISTED | HELD | CLOSED | VOIDED", constraints: "SCHEDULED | HOISTED | HELD | CLOSED | VOIDED" }
      - { name: held_reason, type: enum, source: system, description: "GROUND_CONTROL | CAPACITY; null unless status == HELD", constraints: "GROUND_CONTROL | CAPACITY" }
      - { name: open_batch_count, type: integer, source: computed, default: 0, description: "Count of TreatmentBatch rows on this run with qc_state == PENDING" }

  - name: TreatmentBatch
    parent: ProductionRun
    common_fields: true
    fields:
      - { name: production_run_id, type: string, source: input, description: "FK -> ProductionRun.id; the hoisted run whose ore feeds this crush/screen/treat batch" }
      - { name: depot_id, type: string, source: input, description: "FK -> Depot.id; depot that receives the StockpileLot minted when this batch passes QC" }
      - { name: product_line, type: enum, source: input, description: "HIGHWAY_DEICING | WATER_CONDITIONING | FOOD_GRADE | CHEMICAL_FEEDSTOCK", constraints: "HIGHWAY_DEICING | WATER_CONDITIONING | FOOD_GRADE | CHEMICAL_FEEDSTOCK" }
      - { name: screen_spec, type: enum, source: input, description: "COARSE | MEDIUM | FINE screen cut applied on the treatment line", constraints: "COARSE | MEDIUM | FINE" }
      - { name: anticaking_ppm, type: number, source: input, description: "Anticaking agent dose in parts per million", constraints: ">= 0 and <= 200, 2 decimals" }
      - { name: corrosion_inhibitor_pct, type: number, source: input, description: "Corrosion inhibitor dose as percent of product mass", constraints: ">= 0 and <= 5, 2 decimals" }
      - { name: input_tons, type: number, source: input, description: "Run ore tons fed into this batch", constraints: "> 0" }
      - { name: moisture_pct, type: number, source: input, description: "Free moisture of the feed in percent", constraints: ">= 0 and <= 12, 2 decimals" }
      - { name: storage_kind, type: enum, source: input, description: "COVERED | OPEN_PAD — storage the minted StockpileLot will occupy at depot_id", constraints: "COVERED | OPEN_PAD" }
      - { name: yield_tons, type: number, source: computed, description: "Per calculations.treatment_yield_and_purity; recomputed on every REWORK decision" }
      - { name: purity_pct_nacl, type: number, source: computed, description: "Per calculations.treatment_yield_and_purity, 3 decimals" }
      - { name: qc_state, type: enum, source: system, default: PENDING, description: "PENDING | PASSED | FAILED", constraints: "PENDING | PASSED | FAILED" }
      - { name: rework_count, type: integer, source: computed, default: 0, description: "Number of REWORK decisions taken on this batch; hard limit 2" }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of the QualityLab user that created this batch; the segregation-of-duties comparand at validations priority 3" }
      - { name: qc_decided_by_user_id, type: string, source: system, description: "X-User-ID of the QualityLab user that recorded the latest qc-decision; null while untouched" }

  - name: Depot
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Depot name", constraints: "1..120 chars" }
      - { name: state_code, type: string, source: input, description: "Two-letter US state code the depot serves", constraints: "exactly 2 uppercase letters" }
      - { name: covered_capacity_tons, type: number, source: input, description: "Tons of enclosed (roofed) storage at this depot", constraints: ">= 0" }
      - { name: open_pad_capacity_tons, type: number, source: input, description: "Tons of open-pad storage at this depot", constraints: ">= 0" }
      - { name: loadout_rate_tons_per_hour, type: number, source: input, description: "Sustained loadout throughput of the single loadout bay", constraints: "> 0" }
      - { name: outbound_freight_rate_per_ton, type: number, source: input, description: "Freight billed per ton shipped out of this depot to a customer", constraints: ">= 0, 3 decimals" }
      - { name: depot_state, type: enum, source: system, default: OPEN, description: "OPEN | SURGE | CLOSED", constraints: "OPEN | SURGE | CLOSED" }
      - { name: covered_stored_tons, type: number, source: computed, default: 0, description: "Sum of StockpileLot.tons_on_hand at this depot with storage_kind == COVERED and lot_state IN {AVAILABLE, QUARANTINED}" }
      - { name: open_pad_stored_tons, type: number, source: computed, default: 0, description: "Sum of StockpileLot.tons_on_hand at this depot with storage_kind == OPEN_PAD and lot_state IN {AVAILABLE, QUARANTINED}" }
      - { name: covered_utilization_pct, type: number, source: computed, default: 0, description: "= round(covered_stored_tons * 100 / covered_capacity_tons, 2); 0 when covered_capacity_tons == 0" }
      - { name: storm_state_set_by_user_id, type: string, source: system, description: "X-User-ID of the DepotManager that last set depot_state manually; null when only auto-transitions have fired" }

  - name: StockpileLot
    parent: Depot
    common_fields: true
    fields:
      - { name: depot_id, type: string, source: input, description: "FK -> Depot.id; where this lot physically sits" }
      - { name: treatment_batch_id, type: string, source: input, description: "FK -> TreatmentBatch.id; the batch whose QC PASS minted the tonnage in this lot" }
      - { name: product_line, type: enum, source: system, description: "Copied from the minting TreatmentBatch.product_line", constraints: "HIGHWAY_DEICING | WATER_CONDITIONING | FOOD_GRADE | CHEMICAL_FEEDSTOCK" }
      - { name: purity_pct_nacl, type: number, source: system, description: "Copied from the minting TreatmentBatch.purity_pct_nacl, 3 decimals" }
      - { name: storage_kind, type: enum, source: system, description: "COVERED | OPEN_PAD — set from TreatmentBatch.storage_kind at mint, or from Shipment.destination_storage_kind at receipt", constraints: "COVERED | OPEN_PAD" }
      - { name: tons_on_hand, type: number, source: computed, description: "Physical tons in the pile; decremented when a Shipment on this lot is LOADED, incremented at receipt" }
      - { name: tons_reserved, type: number, source: computed, default: 0, description: "Sum of Allocation.tons on this lot with state == RESERVED" }
      - { name: tons_available, type: number, source: computed, description: "= tons_on_hand - tons_reserved; conserved-quantity invariant per calculations.lot_tonnage_conservation" }
      - { name: lot_state, type: enum, source: system, default: AVAILABLE, description: "AVAILABLE | QUARANTINED | DEPLETED", constraints: "AVAILABLE | QUARANTINED | DEPLETED" }
      - { name: quarantine_reason, type: string, source: input, description: "Free-text reason recorded by QualityLab when lot_state was last set to QUARANTINED; null otherwise" }

  - name: Shipment
    parent: null
    common_fields: true
    fields:
      - { name: stockpile_lot_id, type: string, source: input, description: "FK -> StockpileLot.id; the lot drawn down by this movement" }
      - { name: origin_depot_id, type: string, source: input, description: "FK -> Depot.id; depot whose loadout bay is occupied by the load window" }
      - { name: destination_depot_id, type: string, source: input, description: "FK -> Depot.id; depot that receives the tons" }
      - { name: mode, type: enum, source: input, description: "RAIL | BARGE | TRUCK", constraints: "RAIL | BARGE | TRUCK" }
      - { name: tons, type: number, source: input, description: "Tons moved by this shipment", constraints: "> 0" }
      - { name: load_window_start, type: datetime, source: input, description: "Inclusive start of the origin depot loadout-bay occupation (ISO 8601 UTC)" }
      - { name: load_window_end, type: datetime, source: input, description: "Inclusive end of the origin depot loadout-bay occupation (ISO 8601 UTC)", constraints: "> load_window_start" }
      - { name: destination_storage_kind, type: enum, source: input, description: "COVERED | OPEN_PAD storage the tons occupy at destination_depot_id after receipt", constraints: "COVERED | OPEN_PAD" }
      - { name: required_gap_minutes, type: integer, source: computed, description: "Mode switch buffer this shipment imposes on its neighbours at the origin bay: RAIL 45, BARGE 20, TRUCK 0" }
      - { name: status, type: enum, source: system, default: PLANNED, description: "PLANNED | LOADED | RECEIVED | CANCELLED", constraints: "PLANNED | LOADED | RECEIVED | CANCELLED" }
      - { name: received_lot_id, type: string, source: computed, description: "id of the StockpileLot minted or incremented at destination_depot_id on receipt; null before receipt" }

  - name: SeasonForecast
    parent: null
    common_fields: true
    fields:
      - { name: season_code, type: string, source: input, description: "Winter season label such as 2026-27", constraints: "matches ^\\d{4}-\\d{2}$; unique per region_code" }
      - { name: region_code, type: string, source: input, description: "Market region label such as NY-CENTRAL", constraints: "1..30 chars" }
      - { name: normal_season_tons, type: number, source: input, description: "Tons the region consumes in a normal winter", constraints: "> 0" }
      - { name: severity_index, type: integer, source: input, description: "Winter severity outlook, 0 = mildest, 100 = most severe", constraints: ">= 0 and <= 100" }
      - { name: prior_season_1_actual_tons, type: number, source: input, description: "Actual tons consumed in the most recent completed season", constraints: ">= 0" }
      - { name: prior_season_2_actual_tons, type: number, source: input, description: "Actual tons consumed two seasons ago", constraints: ">= 0" }
      - { name: prior_season_3_actual_tons, type: number, source: input, description: "Actual tons consumed three seasons ago", constraints: ">= 0" }
      - { name: method, type: enum, source: input, description: "SEVERITY_WEIGHTED | TRAILING_BASELINE — selects which variant of calculations.preseason_stockpile_target is binding", constraints: "SEVERITY_WEIGHTED | TRAILING_BASELINE" }
      - { name: preseason_lock_date, type: datetime, source: input, description: "Last logical-clock instant at which a BidContract on this forecast may be activated (ISO 8601 UTC)" }
      - { name: target_tons_severity_weighted, type: number, source: computed, description: "SEVERITY_WEIGHTED variant output of calculations.preseason_stockpile_target" }
      - { name: target_tons_trailing_baseline, type: number, source: computed, description: "TRAILING_BASELINE variant output of calculations.preseason_stockpile_target" }
      - { name: binding_target_tons, type: number, source: computed, description: "= target_tons_severity_weighted when method == SEVERITY_WEIGHTED, else target_tons_trailing_baseline" }
      - { name: variant_spread_tons, type: number, source: computed, description: "= round(target_tons_severity_weighted - target_tons_trailing_baseline, 2); signed" }

  - name: BidContract
    parent: null
    common_fields: true
    fields:
      - { name: season_forecast_id, type: string, source: input, description: "FK -> SeasonForecast.id; the season/region outlook this bid was priced against" }
      - { name: customer_name, type: string, source: input, description: "Awarding public body", constraints: "1..120 chars" }
      - { name: jurisdiction_level, type: enum, source: input, description: "MUNICIPAL | COUNTY | STATE", constraints: "MUNICIPAL | COUNTY | STATE" }
      - { name: state_code, type: string, source: input, description: "Two-letter US state code the tonnage must be delivered in", constraints: "exactly 2 uppercase letters" }
      - { name: product_line, type: enum, source: input, description: "Product line the commitment is written against", constraints: "HIGHWAY_DEICING | WATER_CONDITIONING | FOOD_GRADE | CHEMICAL_FEEDSTOCK" }
      - { name: committed_tons, type: number, source: input, description: "Season tonnage commitment", constraints: "> 0" }
      - { name: guaranteed_price_per_ton, type: number, source: input, description: "Guaranteed unit price in USD per ton", constraints: "> 0, 2 decimals" }
      - { name: min_take_pct, type: number, source: input, description: "Minimum percent of committed_tons the customer must take; also the failure-to-supply tolerance band", constraints: ">= 50 and <= 100" }
      - { name: max_take_pct, type: number, source: input, description: "Maximum percent of committed_tons the customer may order", constraints: ">= 100 and <= 200" }
      - { name: failure_to_supply_penalty_per_ton, type: number, source: input, description: "USD penalty per ton the producer fails to supply", constraints: ">= 0, 2 decimals" }
      - { name: price_guarantee_cap_pct, type: number, source: input, description: "Percent above guaranteed_price_per_ton at which the price guarantee starts crediting the customer", constraints: ">= 0 and <= 50" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | SUBMITTED | AWARDED | LOST | ACTIVE | CLOSED | FORFEITED", constraints: "DRAFT | SUBMITTED | AWARDED | LOST | ACTIVE | CLOSED | FORFEITED" }
      - { name: submitted_by_user_id, type: string, source: system, description: "X-User-ID of the ContractAdministrator that submitted the bid; null while DRAFT" }
      - { name: decided_by_user_id, type: string, source: system, description: "X-User-ID of the ComplianceOfficer that awarded or lost the bid; null before the decision" }
      - { name: contract_value_usd, type: number, source: computed, description: "= round(committed_tons * guaranteed_price_per_ton, 2)" }
      - { name: fulfilled_tons, type: number, source: computed, default: 0, description: "Per calculations.contract_fulfillment_ledger — DELIVERED orders only" }
      - { name: open_committed_tons, type: number, source: computed, description: "= max(0, committed_tons - fulfilled_tons)" }
      - { name: take_pct, type: number, source: computed, default: 0, description: "= round(fulfilled_tons * 100 / committed_tons, 2)" }
      - { name: penalty_accrued_usd, type: number, source: computed, default: 0, description: "Per-event ledger: sum of DeliveryOrder.shortfall_penalty_usd on this contract with penalty_state == ACCRUED" }
      - { name: season_penalty_usd, type: number, source: computed, description: "SEASON_AGGREGATE variant output of calculations.shortfall_penalty, written only by close-season; null before" }
      - { name: penalty_reconciliation_delta_usd, type: number, source: computed, description: "= round(season_penalty_usd - penalty_accrued_usd, 2); written only by close-season" }
      - { name: supply_reliability_score, type: number, source: computed, default: 100, description: "Per calculations.supply_reliability_score; floor 0, ceiling 100" }
      - { name: breach_watch, type: boolean, source: computed, default: false, description: "True once penalty_accrued_usd >= 0.05 * contract_value_usd" }

  - name: DeliveryOrder
    parent: BidContract
    common_fields: true
    fields:
      - { name: bid_contract_id, type: string, source: input, description: "FK -> BidContract.id; the contract this release draws against" }
      - { name: depot_id, type: string, source: input, description: "FK -> Depot.id; depot the customer wants to load out of" }
      - { name: requested_tons, type: number, source: input, description: "Tons requested by the public body", constraints: "> 0" }
      - { name: required_by, type: datetime, source: input, description: "Deadline the tons must be delivered by (ISO 8601 UTC)", constraints: "> logical clock at creation" }
      - { name: storm_priority, type: enum, source: input, default: ROUTINE, description: "ROUTINE | STORM_EMERGENCY — widens depot eligibility and doubles the per-event penalty rate", constraints: "ROUTINE | STORM_EMERGENCY" }
      - { name: allocated_tons, type: number, source: computed, default: 0, description: "Sum of Allocation.tons on this order with state IN {RESERVED, CONSUMED}" }
      - { name: shorted_tons, type: number, source: computed, default: 0, description: "= max(0, requested_tons - allocated_tons) frozen at the allocate call that shorted the order" }
      - { name: status, type: enum, source: system, default: REQUESTED, description: "REQUESTED | ALLOCATED | SHORTED | DELIVERED", constraints: "REQUESTED | ALLOCATED | SHORTED | DELIVERED" }
      - { name: penalty_state, type: enum, source: system, default: NONE, description: "NONE | ACCRUED | WAIVED", constraints: "NONE | ACCRUED | WAIVED" }
      - { name: shortfall_penalty_usd, type: number, source: computed, default: 0, description: "PER_EVENT variant output of calculations.shortfall_penalty" }
      - { name: market_index_price_per_ton, type: number, source: input, description: "Rock-salt market index at delivery, supplied on the deliver call; drives the price-guarantee credit" }
      - { name: product_subtotal_usd, type: number, source: computed, description: "Per calculations.delivery_invoice_amount; null before delivery" }
      - { name: freight_subtotal_usd, type: number, source: computed, description: "Per calculations.delivery_invoice_amount; null before delivery" }
      - { name: storm_surcharge_usd, type: number, source: computed, description: "Per calculations.delivery_invoice_amount; null before delivery" }
      - { name: guarantee_credit_usd, type: number, source: computed, description: "Per calculations.delivery_invoice_amount; null before delivery" }
      - { name: invoice_total_usd, type: number, source: computed, description: "Per calculations.delivery_invoice_amount; null before delivery" }
      - { name: delivered_at, type: datetime, source: system, description: "Logical-clock instant the order reached DELIVERED; null before" }

  - name: Allocation
    parent: null
    common_fields: true
    fields:
      - { name: delivery_order_id, type: string, source: input, description: "FK -> DeliveryOrder.id; the release this reservation serves" }
      - { name: stockpile_lot_id, type: string, source: input, description: "FK -> StockpileLot.id; the pile the tons are held in" }
      - { name: tons, type: number, source: input, description: "Tons reserved out of the lot", constraints: "> 0" }
      - { name: origin, type: enum, source: system, description: "MANUAL when created by POST /salt/allocations, WATERFALL when minted by the allocate call", constraints: "MANUAL | WATERFALL" }
      - { name: rank_position, type: integer, source: system, default: 1, description: "1-based position this lot occupied in the waterfall ranking; always 1 for MANUAL rows" }
      - { name: state, type: enum, source: system, default: RESERVED, description: "RESERVED | CONSUMED | RELEASED", constraints: "RESERVED | CONSUMED | RELEASED" }

# =============================================================================
# §1.2 State Machine Table
# Ten machines. Mine is emitted twice — one entry per independent state
# dimension carried on the same row (parallel shape). Grounds references in the
# design files use `state_machines.Mine.hoist_state.<FROM>_to_<TO>` and
# `state_machines.Mine.compliance_state.<FROM>_to_<TO>`; every other machine
# uses `state_machines.<Entity>.<FROM>_to_<TO>`.
# =============================================================================
state_machines:
  - entity: Mine
    dimension: hoist_state
    initial_state: HOIST_AVAILABLE
    terminal_states: []
    note: |
      Dimension A of Mine. Evolves only through POST /salt/mines/{id}/hoist-status
      and through the auto-derate cascade fired by a DEFECT ground control
      inspection. Independent of compliance_state: the two dimensions multiply
      into effective_hoist_tons_per_day and neither constrains the other's
      transitions.
    transitions:
      - from: HOIST_AVAILABLE
        to: HOIST_DERATED
        trigger: "POST /salt/mines/{id}/hoist-status with to_state = HOIST_DERATED"
        actor: MinePlanner
        preconditions: ["Mine exists", "to_state != current hoist_state"]
        side_effects:
          - "recompute Mine.effective_hoist_tons_per_day per calculations.mine_effective_hoist_capacity (hoist_factor 1.00 -> 0.55)"
          - "capacity re-fit cascade: while the aggregate concurrent hourly rate of runs with status == SCHEDULED exceeds effective_hoist_tons_per_day / 24 at any instant, move the latest-starting offending run to HELD with held_reason = CAPACITY, scanning candidates by hoist_window_start DESC then created_at DESC"
          - "each run moved to HELD removes its planned_tons from Mine.scheduled_hoist_tons_open"
          - "increments Mine.version by 1"
      - from: HOIST_DERATED
        to: HOIST_AVAILABLE
        trigger: "POST /salt/mines/{id}/hoist-status with to_state = HOIST_AVAILABLE"
        actor: MinePlanner
        preconditions: ["Mine exists", "to_state != current hoist_state"]
        side_effects:
          - "recompute Mine.effective_hoist_tons_per_day (hoist_factor 0.55 -> 1.00)"
          - "no automatic un-hold: runs already HELD stay HELD until POST /salt/production-runs/{id}/reinstate"
          - "increments Mine.version by 1"
      - from: HOIST_AVAILABLE
        to: HOIST_DOWN
        trigger: "POST /salt/mines/{id}/hoist-status with to_state = HOIST_DOWN"
        actor: MinePlanner
        preconditions: ["Mine exists", "to_state != current hoist_state"]
        side_effects:
          - "recompute Mine.effective_hoist_tons_per_day to 0.00 (hoist_factor 0.00)"
          - "capacity re-fit cascade holds every run with status == SCHEDULED (held_reason = CAPACITY) because any positive hourly rate exceeds a zero capacity"
          - "Mine.scheduled_hoist_tons_open falls to 0"
          - "increments Mine.version by 1"
      - from: HOIST_DERATED
        to: HOIST_DOWN
        trigger: "POST /salt/mines/{id}/hoist-status with to_state = HOIST_DOWN"
        actor: MinePlanner
        preconditions: ["Mine exists", "to_state != current hoist_state"]
        side_effects: ["same as HOIST_AVAILABLE_to_HOIST_DOWN", "increments Mine.version by 1"]
      - from: HOIST_DOWN
        to: HOIST_AVAILABLE
        trigger: "POST /salt/mines/{id}/hoist-status with to_state = HOIST_AVAILABLE"
        actor: MinePlanner
        preconditions: ["Mine exists", "to_state != current hoist_state"]
        side_effects: ["recompute Mine.effective_hoist_tons_per_day", "increments Mine.version by 1"]
      - from: HOIST_DOWN
        to: HOIST_DERATED
        trigger: "POST /salt/mines/{id}/hoist-status with to_state = HOIST_DERATED"
        actor: MinePlanner
        preconditions: ["Mine exists", "to_state != current hoist_state"]
        side_effects: ["recompute Mine.effective_hoist_tons_per_day", "increments Mine.version by 1"]
      - from: HOIST_AVAILABLE
        to: HOIST_DERATED
        trigger: "system — hop 2 of the DEFECT cascade fired by POST /salt/ground-control-inspections (finding = DEFECT)"
        actor: system
        preconditions:
          - "hop 1 of the cascade moved a Panel PRODUCING -> SUSPENDED"
          - "Mine.producing_panel_count > 0 after that suspension"
        side_effects:
          - "recompute Mine.effective_hoist_tons_per_day (hoist_factor 0.55)"
          - "hop 3: because hoist_state changed, every run with status == SCHEDULED on the suspended panel moves to HELD with held_reason = GROUND_CONTROL, and the capacity re-fit cascade then holds further SCHEDULED runs on other panels until the aggregate hourly rate fits the new capacity (held_reason = CAPACITY)"
          - "hop 4: because those runs left SCHEDULED, Mine.scheduled_hoist_tons_open is recomputed downward by exactly the sum of their planned_tons"
          - "increments Mine.version by 1"
        note: "Reached only as a cascade hop; no endpoint drives this edge directly."
      - from: HOIST_AVAILABLE
        to: HOIST_DOWN
        trigger: "system — hop 2 of the DEFECT cascade when the suspended panel was the mine's last PRODUCING panel"
        actor: system
        preconditions: ["hop 1 moved a Panel PRODUCING -> SUSPENDED", "Mine.producing_panel_count == 0 after that suspension"]
        side_effects:
          - "recompute Mine.effective_hoist_tons_per_day to 0.00"
          - "hop 3: every SCHEDULED run on the mine moves to HELD (held_reason = GROUND_CONTROL for runs on the suspended panel, CAPACITY for the rest)"
          - "hop 4: Mine.scheduled_hoist_tons_open falls to 0"
          - "increments Mine.version by 1"

  - entity: Mine
    dimension: compliance_state
    initial_state: COMPLIANT
    terminal_states: []
    note: |
      Dimension B of Mine. Evolves only through POST /salt/mines/{id}/compliance-action
      (ComplianceOfficer). WITHDRAWAL_ORDER zeroes effective capacity through the
      compliance_factor even when hoist_state is HOIST_AVAILABLE, and revokes the
      pillar-recovery bonus in calculations.panel_recoverable_tons.
    transitions:
      - from: COMPLIANT
        to: CITED
        trigger: "POST /salt/mines/{id}/compliance-action with action = CITE"
        actor: ComplianceOfficer
        preconditions: ["Mine exists", "action produces a state different from compliance_state"]
        side_effects:
          - "recompute Mine.effective_hoist_tons_per_day (compliance_factor 1.00 -> 0.80)"
          - "recompute Panel.recoverable_tons for every panel on this mine with status IN {PLANNED, DEVELOPED, PRODUCING, SUSPENDED} — the pillar_bonus_tons term drops to 0 because it requires compliance_state == COMPLIANT"
          - "capacity re-fit cascade per the hoist_state entries (offending SCHEDULED runs -> HELD, held_reason = CAPACITY)"
          - "sets Mine.last_compliance_action_at to the logical clock"
          - "increments Mine.version by 1"
      - from: CITED
        to: WITHDRAWAL_ORDER
        trigger: "POST /salt/mines/{id}/compliance-action with action = WITHDRAW"
        actor: ComplianceOfficer
        preconditions: ["Mine exists", "action produces a state different from compliance_state"]
        side_effects:
          - "recompute Mine.effective_hoist_tons_per_day to 0.00 (compliance_factor 0.00)"
          - "every run with status == SCHEDULED on this mine moves to HELD with held_reason = GROUND_CONTROL"
          - "Mine.scheduled_hoist_tons_open falls to 0"
          - "sets Mine.last_compliance_action_at; increments Mine.version by 1"
      - from: COMPLIANT
        to: WITHDRAWAL_ORDER
        trigger: "POST /salt/mines/{id}/compliance-action with action = WITHDRAW"
        actor: ComplianceOfficer
        preconditions: ["Mine exists", "action produces a state different from compliance_state"]
        side_effects: ["same as CITED_to_WITHDRAWAL_ORDER, plus revocation of pillar_bonus_tons on non-terminal panels", "increments Mine.version by 1"]
      - from: CITED
        to: COMPLIANT
        trigger: "POST /salt/mines/{id}/compliance-action with action = CLEAR"
        actor: ComplianceOfficer
        preconditions: ["Mine exists", "action produces a state different from compliance_state"]
        side_effects:
          - "recompute Mine.effective_hoist_tons_per_day (compliance_factor 0.80 -> 1.00)"
          - "recompute Panel.recoverable_tons for panels with status IN {PLANNED, DEVELOPED, PRODUCING, SUSPENDED} — pillar_bonus_tons is restored where pillar_recovery_allowed == true"
          - "sets Mine.last_compliance_action_at; increments Mine.version by 1"
      - from: WITHDRAWAL_ORDER
        to: COMPLIANT
        trigger: "POST /salt/mines/{id}/compliance-action with action = CLEAR"
        actor: ComplianceOfficer
        preconditions: ["Mine exists", "action produces a state different from compliance_state"]
        side_effects: ["same as CITED_to_COMPLIANT", "increments Mine.version by 1"]

  - entity: Panel
    initial_state: PLANNED
    terminal_states: [DEPLETED, ABANDONED]
    note: "Cyclic: PRODUCING -> SUSPENDED -> PRODUCING may repeat twice; the third DEFECT inspection abandons the panel."
    transitions:
      - from: PLANNED
        to: DEVELOPED
        trigger: "POST /salt/panels/{id}/develop"
        actor: MinePlanner
        preconditions: ["Panel.status == PLANNED", "Mine.compliance_state != WITHDRAWAL_ORDER"]
        side_effects: ["increments Panel.version by 1"]
      - from: DEVELOPED
        to: PRODUCING
        trigger: "POST /salt/panels/{id}/start-production"
        actor: MinePlanner
        preconditions:
          - "Panel.status == DEVELOPED"
          - "Panel.open_defect == false"
          - "Mine.compliance_state == COMPLIANT"
          - "Mine.hoist_state != HOIST_DOWN"
        side_effects: ["increments Mine.producing_panel_count by 1", "increments Panel.version and Mine.version by 1"]
      - from: PRODUCING
        to: SUSPENDED
        trigger: "system — hop 1 of the DEFECT cascade fired by POST /salt/ground-control-inspections (finding = DEFECT)"
        actor: system
        preconditions: ["Panel.status == PRODUCING", "the filed inspection's finding == DEFECT"]
        side_effects:
          - "sets Panel.suspended_by_user_id to the filing inspector's X-User-ID"
          - "recomputes Panel.ground_control_defect_count and Panel.open_defect (true)"
          - "decrements Mine.producing_panel_count by 1"
          - "hop 2: because the panel left PRODUCING, Mine.hoist_state moves to HOIST_DERATED (producing_panel_count > 0) or HOIST_DOWN (producing_panel_count == 0) — see the Mine.hoist_state machine for hops 3 and 4"
          - "increments Panel.version by 1"
      - from: PRODUCING
        to: SUSPENDED
        trigger: "POST /salt/panels/{id}/suspend"
        actor: "GroundControlEngineer | ComplianceOfficer"
        preconditions: ["Panel.status == PRODUCING"]
        side_effects:
          - "sets Panel.suspended_by_user_id to the caller's X-User-ID"
          - "decrements Mine.producing_panel_count by 1"
          - "does NOT set Panel.open_defect (only a DEFECT inspection does), so re-entry needs no remediation"
          - "hops 2-4 of the cascade fire exactly as for the DEFECT path (Mine.hoist_state, HELD runs, scheduled_hoist_tons_open)"
          - "increments Panel.version and Mine.version by 1"
      - from: SUSPENDED
        to: PRODUCING
        trigger: "POST /salt/panels/{id}/start-production"
        actor: MinePlanner
        preconditions:
          - "Panel.status == SUSPENDED (validations priority 13 admits DEVELOPED or SUSPENDED on this trigger)"
          - "Panel.open_defect == false — cleared by POST /salt/panels/{id}/remediate-defect (validations priority 24)"
          - "Mine.compliance_state == COMPLIANT"
          - "Mine.hoist_state != HOIST_DOWN"
        side_effects:
          - "increments Mine.producing_panel_count by 1"
          - "clears Panel.suspended_by_user_id to null"
          - "increments Panel.version and Mine.version by 1"
        note: "The same trigger serves DEVELOPED -> PRODUCING and the SUSPENDED -> PRODUCING re-entry; only the re-entry is guarded by open_defect. Re-entry does NOT un-hold production runs and does NOT restore Mine.hoist_state; each must be restored explicitly."
      - from: PRODUCING
        to: DEPLETED
        trigger: "POST /salt/panels/{id}/deplete"
        actor: MinePlanner
        preconditions: ["Panel.status IN {PRODUCING, SUSPENDED}"]
        side_effects:
          - "decrements Mine.producing_panel_count by 1 when the panel was PRODUCING"
          - "every ProductionRun on this panel with status IN {SCHEDULED, HELD} moves to VOIDED and its planned_tons leaves Mine.scheduled_hoist_tons_open"
          - "Panel.recoverable_tons is frozen and never recomputed again"
          - "increments Panel.version and Mine.version by 1"
      - from: SUSPENDED
        to: ABANDONED
        trigger: "POST /salt/panels/{id}/abandon"
        actor: "MinePlanner | ComplianceOfficer"
        preconditions: ["Panel.status IN {PLANNED, DEVELOPED, PRODUCING, SUSPENDED}"]
        side_effects:
          - "same side effects as the system-driven third-DEFECT abandonment"
          - "increments Panel.version and Mine.version by 1"
      - from: SUSPENDED
        to: ABANDONED
        trigger: "system — filing a third DEFECT inspection on the panel"
        actor: system
        preconditions: ["Panel.ground_control_defect_count reaches 3 after the inspection is filed"]
        side_effects:
          - "every ProductionRun on this panel with status IN {SCHEDULED, HELD} moves to VOIDED"
          - "each voided run's planned_tons leaves Mine.scheduled_hoist_tons_open"
          - "Panel.recoverable_tons is frozen at its current value and never recomputed again"
          - "increments Panel.version by 1"
      - from: PRODUCING
        to: DEPLETED
        trigger: "system — POST /salt/production-runs/{id}/hoist pushes Panel.mined_tons >= Panel.recoverable_tons"
        actor: system
        preconditions: ["Panel.status == PRODUCING", "Panel.mined_tons >= Panel.recoverable_tons after the hoist is recorded"]
        side_effects:
          - "decrements Mine.producing_panel_count by 1"
          - "every ProductionRun on this panel with status == SCHEDULED moves to VOIDED and its planned_tons leaves Mine.scheduled_hoist_tons_open"
          - "increments Panel.version by 1"

  - entity: ProductionRun
    initial_state: SCHEDULED
    terminal_states: [CLOSED, VOIDED]
    note: "Cyclic through SCHEDULED -> HELD -> SCHEDULED; compound on the way out (auto-CLOSED when every child TreatmentBatch is terminal)."
    transitions:
      - from: SCHEDULED
        to: HOISTED
        trigger: "POST /salt/production-runs/{id}/hoist"
        actor: MinePlanner
        preconditions:
          - "ProductionRun.status == SCHEDULED"
          - "Mine.compliance_state == COMPLIANT"
          - "Mine.hoist_state != HOIST_DOWN"
          - "Panel.status == PRODUCING"
          - "Panel.mined_tons + hoisted_tons <= Panel.recoverable_tons"
        side_effects:
          - "stores hoisted_tons; recomputes Panel.mined_tons"
          - "removes planned_tons from Mine.scheduled_hoist_tons_open"
          - "auto-transitions Panel PRODUCING -> DEPLETED when Panel.mined_tons >= Panel.recoverable_tons"
          - "increments ProductionRun.version, Panel.version and Mine.version by 1"
      - from: SCHEDULED
        to: HELD
        trigger: "system — hop 3 of the DEFECT cascade, the capacity re-fit cascade, or a WITHDRAWAL_ORDER compliance action"
        actor: system
        preconditions: ["ProductionRun.status == SCHEDULED"]
        side_effects:
          - "sets held_reason to GROUND_CONTROL (panel/compliance driven) or CAPACITY (aggregate-rate driven)"
          - "hop 4: removes planned_tons from Mine.scheduled_hoist_tons_open"
          - "increments ProductionRun.version by 1"
      - from: HELD
        to: SCHEDULED
        trigger: "POST /salt/production-runs/{id}/reinstate"
        actor: MinePlanner
        preconditions:
          - "ProductionRun.status == HELD"
          - "Mine.compliance_state == COMPLIANT"
          - "Mine.hoist_state != HOIST_DOWN"
          - "Panel.status == PRODUCING"
          - "the run's hourly rate still fits the aggregate half-open window capacity check in calculations.hoist_window_aggregate_capacity"
        side_effects:
          - "clears held_reason to null"
          - "adds planned_tons back to Mine.scheduled_hoist_tons_open"
          - "increments ProductionRun.version and Mine.version by 1"
      - from: HOISTED
        to: CLOSED
        trigger: "system — the last child TreatmentBatch on this run leaves qc_state == PENDING; also POST /salt/production-runs/{id}/close when open_batch_count is already 0"
        actor: "system | MinePlanner"
        preconditions: ["ProductionRun.status == HOISTED", "ProductionRun.open_batch_count == 0", "for the automatic path only: at least one TreatmentBatch exists on the run"]
        side_effects: ["increments ProductionRun.version by 1"]
        note: "Compound/bubble-up: a run whose last batch leaves qc_state == PENDING closes itself. A run with ZERO batches never auto-closes and is closed explicitly by POST /salt/production-runs/{id}/close, which is the only manual driver of this edge."
      - from: SCHEDULED
        to: VOIDED
        trigger: "system — the run's panel reaches ABANDONED or DEPLETED"
        actor: system
        preconditions: ["ProductionRun.status == SCHEDULED"]
        side_effects: ["removes planned_tons from Mine.scheduled_hoist_tons_open", "increments ProductionRun.version by 1"]
      - from: HELD
        to: VOIDED
        trigger: "system — the run's panel reaches ABANDONED"
        actor: system
        preconditions: ["ProductionRun.status == HELD"]
        side_effects: ["increments ProductionRun.version by 1"]

  - entity: TreatmentBatch
    initial_state: PENDING
    terminal_states: [PASSED, FAILED]
    note: "PENDING -> PENDING self-loop on REWORK (max 2), each loop shrinking yield_tons by a 0.97 factor."
    transitions:
      - from: PENDING
        to: PASSED
        trigger: "POST /salt/treatment-batches/{id}/qc-decision with decision = PASS"
        actor: QualityLab
        preconditions:
          - "TreatmentBatch.qc_state == PENDING"
          - "TreatmentBatch.purity_pct_nacl >= the product line's min_purity constant in calculations.treatment_yield_and_purity"
          - "for product_line IN {FOOD_GRADE, WATER_CONDITIONING}: storage_kind == COVERED"
          - "Depot.covered_stored_tons + yield_tons <= Depot.covered_capacity_tons when storage_kind == COVERED, else open_pad_stored_tons + yield_tons <= open_pad_capacity_tons"
        side_effects:
          - "mints a StockpileLot at depot_id with tons_on_hand = yield_tons, product_line and purity copied from the batch, storage_kind copied from the batch, lot_state = AVAILABLE"
          - "recomputes Depot.covered_stored_tons / open_pad_stored_tons and covered_utilization_pct"
          - "auto-transitions Depot OPEN -> SURGE when covered_stored_tons * 100 >= covered_capacity_tons * 90"
          - "sets qc_decided_by_user_id; decrements ProductionRun.open_batch_count"
          - "auto-transitions ProductionRun HOISTED -> CLOSED when open_batch_count reaches 0"
          - "increments TreatmentBatch.version and Depot.version by 1"
      - from: PENDING
        to: FAILED
        trigger: "POST /salt/treatment-batches/{id}/qc-decision with decision = FAIL"
        actor: QualityLab
        preconditions: ["TreatmentBatch.qc_state == PENDING"]
        side_effects:
          - "no StockpileLot is minted; the batch tonnage is scrapped"
          - "sets qc_decided_by_user_id; decrements ProductionRun.open_batch_count"
          - "auto-transitions ProductionRun HOISTED -> CLOSED when open_batch_count reaches 0"
          - "increments TreatmentBatch.version by 1"
      - from: PENDING
        to: PENDING
        trigger: "POST /salt/treatment-batches/{id}/qc-decision with decision = REWORK"
        actor: QualityLab
        preconditions: ["TreatmentBatch.qc_state == PENDING", "TreatmentBatch.rework_count < 2"]
        side_effects:
          - "increments rework_count by 1"
          - "recomputes yield_tons with the rework loss factor 0.97 ** rework_count per calculations.treatment_yield_and_purity"
          - "purity_pct_nacl is NOT recomputed — reworking re-screens the same ore"
          - "sets qc_decided_by_user_id; ProductionRun.open_batch_count is unchanged"
          - "increments TreatmentBatch.version by 1"

  - entity: Depot
    initial_state: OPEN
    terminal_states: []
    note: "Cyclic OPEN <-> SURGE <-> CLOSED. SURGE is reachable both manually and by the covered-utilization threshold trigger."
    transitions:
      - from: OPEN
        to: SURGE
        trigger: "POST /salt/depots/{id}/posture with depot_state = SURGE"
        actor: "DepotManager | LogisticsPlanner"
        preconditions: ["Depot exists", "when X-User-Role == DepotManager, X-User-ID == Depot.id (validations priority 4)", "depot_state in the payload != current depot_state"]
        side_effects: ["sets storm_state_set_by_user_id to X-User-ID", "widens allocation eligibility: SURGE depots are candidates only for STORM_EMERGENCY orders", "increments Depot.version by 1"]
      - from: OPEN
        to: SURGE
        trigger: "system — a QC PASS or shipment receipt pushes covered_stored_tons * 100 >= covered_capacity_tons * 90"
        actor: system
        preconditions: ["Depot.depot_state == OPEN", "covered_stored_tons * 100 >= covered_capacity_tons * 90 after the tonnage lands"]
        side_effects: ["storm_state_set_by_user_id is left untouched (null when no manual call ever happened)", "increments Depot.version by 1"]
        note: "The comparison is on the unrounded cross-multiplied ratio, NOT on the 2-decimal covered_utilization_pct field, so 35999/40000 tons stays OPEN while 36000/40000 flips to SURGE."
      - from: SURGE
        to: OPEN
        trigger: "POST /salt/depots/{id}/posture with depot_state = OPEN"
        actor: "DepotManager | LogisticsPlanner"
        preconditions: ["Depot exists", "when X-User-Role == DepotManager, X-User-ID == Depot.id (validations priority 4)", "depot_state in the payload != current depot_state"]
        side_effects: ["sets storm_state_set_by_user_id", "increments Depot.version by 1"]
        note: "Allowed even while covered_utilization_pct is still at or above 90 — the auto-SURGE rule fires only when tonnage lands, never on the manual edge."
      - from: OPEN
        to: CLOSED
        trigger: "POST /salt/depots/{id}/posture with depot_state = CLOSED"
        actor: "DepotManager | LogisticsPlanner"
        preconditions: ["Depot exists", "when X-User-Role == DepotManager, X-User-ID == Depot.id (validations priority 4)", "depot_state in the payload != current depot_state"]
        side_effects:
          - "sets storm_state_set_by_user_id"
          - "every StockpileLot at this depot leaves the allocation candidate set for every order class (see calculations.storm_allocation_waterfall)"
          - "existing Allocation rows with state == RESERVED are NOT touched"
          - "increments Depot.version by 1"
      - from: SURGE
        to: CLOSED
        trigger: "POST /salt/depots/{id}/posture with depot_state = CLOSED"
        actor: "DepotManager | LogisticsPlanner"
        preconditions: ["Depot exists", "when X-User-Role == DepotManager, X-User-ID == Depot.id (validations priority 4)", "depot_state in the payload != current depot_state"]
        side_effects: ["same as OPEN_to_CLOSED", "increments Depot.version by 1"]
      - from: CLOSED
        to: OPEN
        trigger: "POST /salt/depots/{id}/posture with depot_state = OPEN"
        actor: "DepotManager | LogisticsPlanner"
        preconditions: ["Depot exists", "when X-User-Role == DepotManager, X-User-ID == Depot.id (validations priority 4)", "depot_state in the payload != current depot_state"]
        side_effects: ["sets storm_state_set_by_user_id", "increments Depot.version by 1"]

  - entity: StockpileLot
    initial_state: AVAILABLE
    terminal_states: [DEPLETED]
    note: "Cyclic AVAILABLE <-> QUARANTINED; DEPLETED is reached only by draining the pile to zero."
    transitions:
      - from: AVAILABLE
        to: QUARANTINED
        trigger: "POST /salt/stockpile-lots/{id}/quarantine-state with to_state = QUARANTINED"
        actor: QualityLab
        preconditions: ["StockpileLot.lot_state == AVAILABLE", "quarantine_reason present"]
        side_effects:
          - "stores quarantine_reason"
          - "the lot leaves every allocation candidate set; tons_reserved and existing RESERVED allocations are untouched"
          - "Depot.covered_stored_tons / open_pad_stored_tons are unchanged — quarantined tons still occupy the shed"
          - "increments StockpileLot.version by 1"
      - from: QUARANTINED
        to: AVAILABLE
        trigger: "POST /salt/stockpile-lots/{id}/quarantine-state with to_state = AVAILABLE"
        actor: QualityLab
        preconditions: ["StockpileLot.lot_state == QUARANTINED"]
        side_effects: ["clears quarantine_reason to null", "increments StockpileLot.version by 1"]
      - from: AVAILABLE
        to: DEPLETED
        trigger: "system — POST /salt/shipments/{id}/load drains tons_on_hand to exactly 0"
        actor: system
        preconditions: ["StockpileLot.tons_on_hand == 0 after the load", "StockpileLot.tons_reserved == 0"]
        side_effects: ["the lot leaves every candidate set permanently", "increments StockpileLot.version by 1"]

  - entity: Shipment
    initial_state: PLANNED
    terminal_states: [RECEIVED, CANCELLED]
    transitions:
      - from: PLANNED
        to: LOADED
        trigger: "POST /salt/shipments/{id}/load"
        actor: DepotManager
        preconditions:
          - "Shipment.status == PLANNED"
          - "X-User-ID == Shipment.origin_depot_id"
          - "origin Depot.depot_state != CLOSED"
          - "StockpileLot.lot_state == AVAILABLE"
          - "StockpileLot.tons_available >= Shipment.tons"
        side_effects:
          - "decrements StockpileLot.tons_on_hand by tons and recomputes tons_available"
          - "recomputes origin Depot.covered_stored_tons / open_pad_stored_tons and covered_utilization_pct"
          - "auto-transitions the lot AVAILABLE -> DEPLETED when tons_on_hand reaches 0 and tons_reserved == 0"
          - "increments Shipment.version, StockpileLot.version and Depot.version by 1"
      - from: LOADED
        to: RECEIVED
        trigger: "POST /salt/shipments/{id}/receive"
        actor: DepotManager
        preconditions:
          - "Shipment.status == LOADED"
          - "X-User-ID == Shipment.destination_depot_id"
          - "destination Depot.depot_state != CLOSED"
          - "destination_storage_kind == COVERED for product lines FOOD_GRADE and WATER_CONDITIONING"
          - "destination covered/open-pad free capacity >= tons for the chosen destination_storage_kind"
        side_effects:
          - "mints a StockpileLot at destination_depot_id (tons_on_hand = tons, treatment_batch_id / product_line / purity copied from the source lot, storage_kind = destination_storage_kind, lot_state = AVAILABLE) and records its id in Shipment.received_lot_id"
          - "recomputes destination Depot.covered_stored_tons / open_pad_stored_tons and covered_utilization_pct"
          - "auto-transitions destination Depot OPEN -> SURGE when covered_stored_tons * 100 >= covered_capacity_tons * 90"
          - "increments Shipment.version and destination Depot.version by 1"
      - from: PLANNED
        to: CANCELLED
        trigger: "POST /salt/shipments/{id}/cancel"
        actor: LogisticsPlanner
        preconditions: ["Shipment.status == PLANNED"]
        side_effects: ["frees the origin depot loadout-bay window for overlap checks", "increments Shipment.version by 1"]
      - from: LOADED
        to: CANCELLED
        trigger: "POST /salt/shipments/{id}/cancel"
        actor: LogisticsPlanner
        preconditions: ["Shipment.status == LOADED"]
        side_effects:
          - "compensation: adds tons back to the source StockpileLot.tons_on_hand and reverses a DEPLETED auto-transition back to AVAILABLE"
          - "recomputes origin Depot stored tons and covered_utilization_pct; a depot auto-moved to SURGE is NOT moved back"
          - "frees the loadout-bay window"
          - "increments Shipment.version, StockpileLot.version and Depot.version by 1"

  - entity: BidContract
    initial_state: DRAFT
    terminal_states: [LOST, CLOSED, FORFEITED]
    note: "Branching fork-join: SUBMITTED forks to {AWARDED, LOST} with disjoint side-effect sets, and ACTIVE forks to {CLOSED, FORFEITED} on the season-close take test."
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /salt/bid-contracts/{id}/submit"
        actor: ContractAdministrator
        preconditions: ["BidContract.status == DRAFT"]
        side_effects: ["stores submitted_by_user_id = X-User-ID", "increments BidContract.version by 1"]
      - from: SUBMITTED
        to: AWARDED
        trigger: "POST /salt/bid-contracts/{id}/decision with outcome = AWARD"
        actor: ComplianceOfficer
        preconditions: ["BidContract.status == SUBMITTED", "X-User-ID != BidContract.submitted_by_user_id (segregation of duties)"]
        side_effects: ["stores decided_by_user_id", "computes contract_value_usd", "increments BidContract.version by 1"]
      - from: SUBMITTED
        to: LOST
        trigger: "POST /salt/bid-contracts/{id}/decision with outcome = LOSE"
        actor: ComplianceOfficer
        preconditions: ["BidContract.status == SUBMITTED", "X-User-ID != BidContract.submitted_by_user_id (segregation of duties)"]
        side_effects:
          - "stores decided_by_user_id"
          - "terminal: contract_value_usd stays null, no DeliveryOrder may ever reference this contract"
          - "increments BidContract.version by 1"
        note: "Divergent branch: AWARD prices the contract and opens the activation path; LOSE freezes it with no fiscal fields."
      - from: AWARDED
        to: ACTIVE
        trigger: "POST /salt/bid-contracts/{id}/activate"
        actor: ComplianceOfficer
        preconditions:
          - "BidContract.status == AWARDED"
          - "logical clock <= SeasonForecast.preseason_lock_date"
          - "calculations.contract_fulfillment_ledger.preseason_coverage_tons >= committed_tons * min_take_pct / 100"
        side_effects: ["initialises supply_reliability_score to 100 and breach_watch to false", "increments BidContract.version by 1"]
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /salt/bid-contracts/{id}/close-season with outcome branch take_pct >= min_take_pct"
        actor: ComplianceOfficer
        preconditions: ["BidContract.status == ACTIVE", "take_pct >= min_take_pct"]
        side_effects:
          - "computes season_penalty_usd via the SEASON_AGGREGATE variant of calculations.shortfall_penalty"
          - "computes penalty_reconciliation_delta_usd = season_penalty_usd - penalty_accrued_usd"
          - "every DeliveryOrder on this contract with status IN {REQUESTED, SHORTED} keeps its status; no cascade"
          - "increments BidContract.version by 1"
      - from: ACTIVE
        to: FORFEITED
        trigger: "POST /salt/bid-contracts/{id}/close-season with outcome branch take_pct < min_take_pct"
        actor: ComplianceOfficer
        preconditions: ["BidContract.status == ACTIVE", "take_pct < min_take_pct"]
        side_effects:
          - "computes season_penalty_usd and penalty_reconciliation_delta_usd exactly as the CLOSED branch"
          - "additionally sets supply_reliability_score to max(0, supply_reliability_score - 25)"
          - "increments BidContract.version by 1"
        note: "Divergent branch: FORFEITED carries the extra reliability haircut, CLOSED does not."

  - entity: DeliveryOrder
    initial_state: REQUESTED
    terminal_states: [DELIVERED]
    note: "Cyclic: REQUESTED -> ALLOCATED|SHORTED -> REQUESTED via release-allocations."
    transitions:
      - from: REQUESTED
        to: ALLOCATED
        trigger: "POST /salt/delivery-orders/{id}/allocate, or POST /salt/allocations bringing allocated_tons to >= requested_tons"
        actor: LogisticsPlanner
        preconditions: ["DeliveryOrder.status == REQUESTED", "BidContract.status == ACTIVE", "the waterfall covers requested_tons in full"]
        side_effects:
          - "creates Allocation rows with state = RESERVED and origin = WATERFALL (allocate) or MANUAL (POST /salt/allocations)"
          - "recomputes StockpileLot.tons_reserved and tons_available for every touched lot"
          - "recomputes DeliveryOrder.allocated_tons; shorted_tons stays 0"
          - "increments DeliveryOrder.version and each touched StockpileLot.version by 1"
      - from: REQUESTED
        to: SHORTED
        trigger: "POST /salt/delivery-orders/{id}/allocate covering 0 < allocated_tons < requested_tons"
        actor: LogisticsPlanner
        preconditions: ["DeliveryOrder.status == REQUESTED", "BidContract.status == ACTIVE", "the candidate pool is non-empty but insufficient"]
        side_effects:
          - "creates the partial Allocation rows (state = RESERVED, origin = WATERFALL)"
          - "freezes shorted_tons = requested_tons - allocated_tons"
          - "hop 1: computes shortfall_penalty_usd via the PER_EVENT variant of calculations.shortfall_penalty and sets penalty_state = ACCRUED"
          - "hop 2: because this order accrued a penalty, BidContract.penalty_accrued_usd is recomputed and BidContract.supply_reliability_score is recomputed"
          - "hop 3: because penalty_accrued_usd crossed 5% of contract_value_usd, BidContract.breach_watch flips to true"
          - "increments DeliveryOrder.version, BidContract.version and each touched StockpileLot.version by 1"
      - from: ALLOCATED
        to: REQUESTED
        trigger: "POST /salt/delivery-orders/{id}/release-allocations"
        actor: LogisticsPlanner
        preconditions: ["DeliveryOrder.status IN {ALLOCATED, SHORTED}", "at least one Allocation with state == RESERVED exists on the order"]
        side_effects:
          - "every Allocation with state == RESERVED moves to RELEASED"
          - "each touched StockpileLot.tons_reserved decreases by the released tons and tons_available rises by the same amount; tons_on_hand is untouched"
          - "allocated_tons returns to 0 and shorted_tons returns to 0"
          - "compensation: penalty_state ACCRUED -> WAIVED is NOT automatic; the penalty survives a release"
          - "increments DeliveryOrder.version and each touched StockpileLot.version by 1"
      - from: SHORTED
        to: REQUESTED
        trigger: "POST /salt/delivery-orders/{id}/release-allocations"
        actor: LogisticsPlanner
        preconditions: ["DeliveryOrder.status == SHORTED", "at least one Allocation with state == RESERVED exists on the order"]
        side_effects: ["same as ALLOCATED_to_REQUESTED", "increments DeliveryOrder.version by 1"]
      - from: ALLOCATED
        to: DELIVERED
        trigger: "POST /salt/delivery-orders/{id}/deliver"
        actor: LogisticsPlanner
        preconditions:
          - "DeliveryOrder.status IN {ALLOCATED, SHORTED}"
          - "BidContract.status == ACTIVE"
          - "logical clock <= DeliveryOrder.required_by"
        side_effects:
          - "every Allocation with state == RESERVED on the order moves to CONSUMED"
          - "each touched StockpileLot.tons_on_hand and tons_reserved both decrease by the consumed tons; tons_available is unchanged by the consumption"
          - "computes the five invoice fields per calculations.delivery_invoice_amount and stamps delivered_at"
          - "recomputes BidContract.fulfilled_tons, open_committed_tons and take_pct"
          - "increments DeliveryOrder.version, BidContract.version and each touched StockpileLot.version by 1"
      - from: SHORTED
        to: DELIVERED
        trigger: "POST /salt/delivery-orders/{id}/deliver"
        actor: LogisticsPlanner
        preconditions: ["DeliveryOrder.status == SHORTED", "BidContract.status == ACTIVE", "logical clock <= required_by"]
        side_effects: ["same as ALLOCATED_to_DELIVERED; the accrued penalty is left in place", "increments DeliveryOrder.version by 1"]

  - entity: Allocation
    initial_state: RESERVED
    terminal_states: [CONSUMED, RELEASED]
    transitions:
      - from: RESERVED
        to: CONSUMED
        trigger: "system — POST /salt/delivery-orders/{id}/deliver"
        actor: system
        preconditions: ["Allocation.state == RESERVED"]
        side_effects: ["source lot tons_on_hand and tons_reserved both fall by Allocation.tons", "increments Allocation.version by 1"]
      - from: RESERVED
        to: RELEASED
        trigger: "POST /salt/allocations/{id}/release (single row) or POST /salt/delivery-orders/{id}/release-allocations (every RESERVED row on the order)"
        actor: system
        preconditions: ["Allocation.state == RESERVED"]
        side_effects: ["source lot tons_reserved falls by Allocation.tons and tons_available rises by the same amount", "increments Allocation.version by 1"]

# =============================================================================
# §1.2.1 Concurrency Rules — OCC on a parent entity's `version` only
# =============================================================================
concurrency_rules:
  - rule_id: allocation-create-stale-lot
    parent_entity: StockpileLot
    write_endpoint: "POST /salt/allocations"
    occ_field: "expected_stockpile_lot_version"
    description: |
      Creating an Allocation against a StockpileLot whose version has advanced
      since the client last read it is rejected. The lot's tons_available is a
      derived field that any other reservation, release, load or receipt moves
      without changing lot_state, so a second reservation carrying a stale
      version has priced its tonnage against an availability figure the server
      no longer holds. The product semantics genuinely permit a second
      reservation against the same lot, so the stale-version check — not a state
      precondition — is what separates the two writes.
    error_id: ERR_STALE_STOCKPILE_LOT_VERSION
    http_status: 412

  - rule_id: delivery-order-create-stale-contract
    parent_entity: BidContract
    write_endpoint: "POST /salt/delivery-orders"
    occ_field: "expected_bid_contract_version"
    description: |
      Creating a DeliveryOrder against a BidContract whose version has advanced
      since the client last read it is rejected. Every new release legitimately
      consumes take-band headroom that the previous reader still believes is
      free, and the contract stays ACTIVE throughout, so no state precondition
      distinguishes the two writes — only the version does.
    error_id: ERR_STALE_BID_CONTRACT_VERSION
    http_status: 412

  - rule_id: production-run-create-stale-mine
    parent_entity: Mine
    write_endpoint: "POST /salt/production-runs"
    occ_field: "expected_mine_version"
    description: |
      Creating a ProductionRun against a Mine whose version has advanced since
      the client last read it is rejected. The aggregate hoist-window capacity
      check is evaluated against effective_hoist_tons_per_day and the set of
      SCHEDULED runs, both of which move with every hoist-status change,
      compliance action, cascade hop and sibling run creation while the mine
      remains schedulable — so a planner working from a stale mine read has
      sized its window against capacity the server no longer offers.
    error_id: ERR_STALE_MINE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# All monetary and tonnage arithmetic is decimal (never binary float);
# every `round(x, n)` below means half-up rounding to n decimal places.
# =============================================================================
calculations:
  - name: panel_recoverable_tons
    trigger: "POST /salt/panels (create) and re-run for every Panel with status IN {PLANNED, DEVELOPED, PRODUCING, SUSPENDED} on POST /salt/mines/{id}/compliance-action; never re-run once status IN {DEPLETED, ABANDONED}"
    algorithm: threshold
    formula: |
      base_tons = gross_tons_in_place * (extraction_ratio_pct / 100)
      grade_factor =
          1.00  if grade_pct_nacl >= 95.0
          0.96  if 90.0 <= grade_pct_nacl < 95.0
          0.88  if grade_pct_nacl < 90.0
      insolubles_penalty = min(0.20, max(0.0, insolubles_pct - 3.0) * 0.012)
      pillar_bonus_tons =
          0.08 * (gross_tons_in_place - base_tons)
            if pillar_recovery_allowed == true AND Mine.compliance_state == COMPLIANT
          else 0.0
      hard_cap_tons = gross_tons_in_place * 0.72
      recoverable_tons = round(min(base_tons * grade_factor * (1 - insolubles_penalty)
                                   + pillar_bonus_tons,
                                  hard_cap_tons), 2)
      # Evaluation order is pinned: grade tier first, then the insolubles
      # multiplier, then the additive pillar bonus, and the hard cap LAST — the
      # cap therefore also clips the pillar bonus.
    input_set: "Panel input fields plus the parent Mine.compliance_state at evaluation time. Panel.status is irrelevant to the value but gates whether a re-run happens at all."
    constants:
      GRADE_TIER_HIGH_PCT: 95.0
      GRADE_TIER_MID_PCT: 90.0
      GRADE_FACTOR_HIGH: 1.00
      GRADE_FACTOR_MID: 0.96
      GRADE_FACTOR_LOW: 0.88
      INSOLUBLES_FREE_PCT: 3.0
      INSOLUBLES_PENALTY_PER_PCT: 0.012
      INSOLUBLES_PENALTY_CAP: 0.20
      PILLAR_BONUS_FRACTION: 0.08
      HARD_CAP_FRACTION: 0.72
    precision: "2 decimal places, round_half_up"

  - name: mine_effective_hoist_capacity
    trigger: "every Mine mutation: POST /salt/mines (create), POST /salt/mines/{id}/hoist-status, POST /salt/mines/{id}/compliance-action, and every cascade hop that changes either state dimension"
    algorithm: constraint_propagation
    formula: |
      hoist_factor      = 1.00 (HOIST_AVAILABLE) | 0.55 (HOIST_DERATED) | 0.00 (HOIST_DOWN)
      compliance_factor = 1.00 (COMPLIANT)       | 0.80 (CITED)         | 0.00 (WITHDRAWAL_ORDER)
      effective_hoist_tons_per_day =
          round(rated_hoist_tons_per_day * hoist_factor * compliance_factor, 2)
      mine_hourly_capacity = effective_hoist_tons_per_day / 24
    input_set: "The two independent Mine state dimensions; the product is taken over BOTH dimensions, so CITED + HOIST_DERATED yields 0.55 * 0.80 = 0.44 of nameplate, not the weaker of the two."
    constants:
      HOIST_FACTOR_AVAILABLE: 1.00
      HOIST_FACTOR_DERATED: 0.55
      HOIST_FACTOR_DOWN: 0.00
      COMPLIANCE_FACTOR_COMPLIANT: 1.00
      COMPLIANCE_FACTOR_CITED: 0.80
      COMPLIANCE_FACTOR_WITHDRAWAL: 0.00
      HOURS_PER_DAY: 24
    precision: "2 decimal places, round_half_up; mine_hourly_capacity is compared unrounded"

  - name: hoist_window_aggregate_capacity
    trigger: "POST /salt/production-runs (create) and POST /salt/production-runs/{id}/reinstate"
    algorithm: interval_merge
    formula: |
      # HALF-OPEN interval semantics: a window is [hoist_window_start, hoist_window_end).
      # Two windows that merely touch (A.end == B.start) do NOT overlap.
      # AGGREGATE-CAPACITY semantics: overlap is permitted as long as the SUM of
      # concurrent hourly rates never exceeds the mine's hourly capacity.
      window_hours          = (hoist_window_end - hoist_window_start) in hours (exact, may be fractional)
      planned_tons_per_hour = round(planned_tons / window_hours, 4)
      peer_set = ProductionRun rows on the same mine_id with status IN {SCHEDULED}
                 (HELD, HOISTED, CLOSED and VOIDED runs release their window)
      events = for the candidate window and every peer window:
                 (start, +rate) and (end, -rate)
      sort events by timestamp ASC, and at equal timestamps -end events BEFORE +start
                 events (this is what makes touching windows non-overlapping)
      sweep the sorted events keeping running_rate;
      peak_concurrent_rate = max(running_rate) over the sweep restricted to
                             instants inside the candidate window
      REJECT with ERR_HOIST_CAPACITY_EXCEEDED when
             peak_concurrent_rate > mine_hourly_capacity
      # Boundary: peak exactly equal to mine_hourly_capacity is ACCEPTED (> not >=).
    input_set: "Candidate window plus peer runs with status == SCHEDULED only; mine_hourly_capacity comes from calculations.mine_effective_hoist_capacity evaluated at request time."
    constants:
      TIE_BREAK: "end events before start events at equal timestamps"
    precision: "planned_tons_per_hour at 4 decimal places, round_half_up; the capacity comparison uses those 4-decimal rates"

  - name: depot_loadout_bay_conflict
    trigger: "POST /salt/shipments (create)"
    algorithm: interval_merge
    formula: |
      # CLOSED interval semantics with a mode switch buffer, and PAIRWISE
      # EXCLUSIVE occupation: the single loadout bay serves one shipment at a
      # time, so touching endpoints DO collide.
      buffer_minutes(mode) = 45 (RAIL) | 20 (BARGE) | 0 (TRUCK)
      required_gap_minutes(new)  = buffer_minutes(new.mode)          # stored on the row
      peer_set = Shipment rows with the same origin_depot_id and status IN {PLANNED, LOADED}
      for each peer P:
          gap_minutes = max(required_gap_minutes(new), buffer_minutes(P.mode))
          blocked_from = P.load_window_start - gap_minutes
          blocked_to   = P.load_window_end   + gap_minutes
          collision when new.load_window_start <= blocked_to
                     AND new.load_window_end   >= blocked_from
                     (closed on both ends — equality collides)
      REJECT the first collision found, scanning peers by load_window_start ASC
      then created_at ASC, with ERR_LOADOUT_BAY_CONFLICT
    input_set: "Peer shipments on the same origin depot with status IN {PLANNED, LOADED}; RECEIVED and CANCELLED shipments release the bay."
    constants:
      BUFFER_MINUTES_RAIL: 45
      BUFFER_MINUTES_BARGE: 20
      BUFFER_MINUTES_TRUCK: 0
    precision: "whole minutes; timestamps compared at second resolution"
    note: "Deliberately different interval geometry from hoist_window_aggregate_capacity: closed + buffered + pairwise-exclusive here, half-open + aggregate-sum there."

  - name: treatment_yield_and_purity
    trigger: "POST /salt/treatment-batches (create); yield_tons alone is recomputed on every REWORK qc-decision"
    algorithm: weighted_scoring
    formula: |
      screen_yield_factor  = 0.94 (COARSE) | 0.90 (MEDIUM) | 0.82 (FINE)
      screen_upgrade_pct   = 0.5  (COARSE) | 1.2  (MEDIUM) | 2.5  (FINE)
      rework_loss_factor   = 0.97 ** rework_count           # 1.0 while rework_count == 0
      yield_tons = round(input_tons * screen_yield_factor
                         * (1 - moisture_pct / 100) * rework_loss_factor, 2)
      purity_pct_nacl = round(min(99.9, Panel.grade_pct_nacl + screen_upgrade_pct), 3)
      # Panel is reached as ProductionRun.panel_id -> Panel.id.
      # Product-line specs (inclusive bounds on both ends):
      #   HIGHWAY_DEICING    min_purity 92.0  anticaking_ppm [0, 60]  inhibitor_pct [0.0, 1.5]  screens {COARSE, MEDIUM}
      #   WATER_CONDITIONING min_purity 99.5  anticaking_ppm [0, 0]   inhibitor_pct [0.0, 0.0]  screens {COARSE}
      #   FOOD_GRADE         min_purity 99.6  anticaking_ppm [4, 12]  inhibitor_pct [0.0, 0.0]  screens {FINE}
      #   CHEMICAL_FEEDSTOCK min_purity 96.0  anticaking_ppm [0, 25]  inhibitor_pct [0.0, 0.0]  screens {MEDIUM, FINE}
    input_set: "Batch input fields plus the grade of the panel behind the run. purity_pct_nacl is frozen at create and is NOT recomputed by a rework."
    constants:
      SCREEN_YIELD_COARSE: 0.94
      SCREEN_YIELD_MEDIUM: 0.90
      SCREEN_YIELD_FINE: 0.82
      SCREEN_UPGRADE_COARSE: 0.5
      SCREEN_UPGRADE_MEDIUM: 1.2
      SCREEN_UPGRADE_FINE: 2.5
      REWORK_LOSS_FACTOR: 0.97
      REWORK_LIMIT: 2
      PURITY_CEILING: 99.9
    precision: "yield_tons 2 decimals round_half_up; purity_pct_nacl 3 decimals round_half_up"

  - name: preseason_stockpile_target
    trigger: "POST /salt/season-forecasts (create) and PATCH /salt/season-forecasts/{id} (severity revision)"
    algorithm: forward_looking
    formula: |
      # BOTH variants are always computed and stored; `method` only decides which
      # one is binding.
      # --- variant SEVERITY_WEIGHTED (scenario blend over an uncertain winter)
      w_severe = severity_index / 100
      w_mild   = (100 - severity_index) / 100 * 0.40
      w_normal = 1 - w_severe - w_mild
      target_tons_severity_weighted =
          round(( normal_season_tons * 0.75 * w_mild
                + normal_season_tons * 1.00 * w_normal
                + normal_season_tons * 1.40 * w_severe ) * 1.05, 2)
      # --- variant TRAILING_BASELINE (chronological recency-weighted history)
      weighted_trailing = ( prior_season_1_actual_tons * 3
                          + prior_season_2_actual_tons * 2
                          + prior_season_3_actual_tons * 1 ) / 6
      severity_uplift = 1.00 if severity_index <= 40
                        1.10 if 41 <= severity_index <= 70
                        1.25 if severity_index >= 71
      target_tons_trailing_baseline = round(weighted_trailing * severity_uplift * 1.05, 2)
      # --- selection and spread
      binding_target_tons = target_tons_severity_weighted if method == SEVERITY_WEIGHTED
                            else target_tons_trailing_baseline
      variant_spread_tons = round(target_tons_severity_weighted
                                  - target_tons_trailing_baseline, 2)
    input_set: "Only the forecast row's own inputs. The severity index feeds BOTH variants but through different shapes — a continuous scenario weighting on one side and a three-step uplift on the other — so the two targets diverge for every input where the blend and the step disagree."
    constants:
      SCENARIO_MILD_FACTOR: 0.75
      SCENARIO_NORMAL_FACTOR: 1.00
      SCENARIO_SEVERE_FACTOR: 1.40
      MILD_WEIGHT_SCALE: 0.40
      SAFETY_STOCK_FACTOR: 1.05
      TRAILING_WEIGHTS: "3 / 2 / 1 over seasons 1 / 2 / 3, divided by 6"
      UPLIFT_LOW: 1.00
      UPLIFT_MID: 1.10
      UPLIFT_HIGH: 1.25
      UPLIFT_MID_FLOOR_INDEX: 41
      UPLIFT_HIGH_FLOOR_INDEX: 71
    precision: "2 decimal places, round_half_up"
    variants:
      - name: SEVERITY_WEIGHTED
        when: "SeasonForecast.method == SEVERITY_WEIGHTED — used by regions that price the coming winter's uncertainty directly"
        difference: "Blends three demand scenarios with weights that move continuously with severity_index; ignores realised history entirely."
      - name: TRAILING_BASELINE
        when: "SeasonForecast.method == TRAILING_BASELINE — used by regions with three clean seasons of metered usage"
        difference: "Anchors on recency-weighted realised tonnage and applies a three-step severity uplift, so it is flat across whole bands of severity_index where the weighted blend keeps moving."

  - name: storm_allocation_waterfall
    trigger: "POST /salt/delivery-orders/{id}/allocate"
    algorithm: waterfall_allocation
    formula: |
      # ---- eligibility filter (candidate set), all predicates over entity fields
      candidate lots L are StockpileLot rows where
          L.product_line == BidContract.product_line   (contract of the order)
          AND L.lot_state == AVAILABLE
          AND L.tons_available > 0
          AND Depot(L.depot_id).state_code == BidContract.state_code
          AND Depot(L.depot_id).depot_state IN
                {OPEN}            when DeliveryOrder.storm_priority == ROUTINE
                {OPEN, SURGE}     when DeliveryOrder.storm_priority == STORM_EMERGENCY
      # ---- ranking expression (total order, no random inputs)
      ORDER BY same_depot_flag DESC,                       -- 1 when L.depot_id == DeliveryOrder.depot_id else 0
               Depot(L.depot_id).outbound_freight_rate_per_ton ASC,
               L.tons_available DESC,
               L.created_at ASC                            -- final tie-break; `id` is never consulted
      # ---- fill
      remaining = DeliveryOrder.requested_tons
      rank = 1
      for L in ranked order:
          take = min(remaining, L.tons_available)
          if take > 0:
              create Allocation(delivery_order_id, stockpile_lot_id = L.id, tons = take,
                                origin = WATERFALL, rank_position = rank, state = RESERVED)
              remaining = remaining - take
              rank = rank + 1
          if remaining == 0: break
      allocated_tons = requested_tons - remaining
      # ---- outcome
      allocated_tons == 0                  -> REJECT with ERR_NO_ELIGIBLE_STOCKPILE (empty-pool fallback,
                                              no Allocation row is written, order stays REQUESTED)
      0 < allocated_tons < requested_tons  -> order -> SHORTED, shorted_tons = remaining,
                                              PER_EVENT penalty cascade fires
      allocated_tons == requested_tons     -> order -> ALLOCATED
    input_set: "Only lots passing the eligibility filter above enter the waterfall; QUARANTINED and DEPLETED lots, lots at CLOSED depots, lots at SURGE depots for ROUTINE orders, lots in the wrong state_code and lots of a different product_line are excluded even when physically full."
    constants:
      ROUTINE_ELIGIBLE_DEPOT_STATES: "{OPEN}"
      STORM_ELIGIBLE_DEPOT_STATES: "{OPEN, SURGE}"
    precision: "tonnage at 2 decimal places, round_half_up; `take` is exact and never rounded up"

  - name: shortfall_penalty
    trigger: "PER_EVENT variant on POST /salt/delivery-orders/{id}/allocate when the order shorts; SEASON_AGGREGATE variant on POST /salt/bid-contracts/{id}/close-season"
    algorithm: tiered_pricing
    formula: |
      # --- variant PER_EVENT (written to DeliveryOrder.shortfall_penalty_usd)
      shorted_tons   = requested_tons - allocated_tons
      storm_multiplier = 2.00 if storm_priority == STORM_EMERGENCY else 1.00
      order_value_usd  = round(requested_tons * BidContract.guaranteed_price_per_ton, 2)
      shortfall_penalty_usd = round(min(
              shorted_tons * BidContract.failure_to_supply_penalty_per_ton * storm_multiplier,
              order_value_usd * 0.15), 2)
      # --- variant SEASON_AGGREGATE (written to BidContract.season_penalty_usd)
      season_shorted_tons  = max(0, committed_tons - fulfilled_tons)
      tolerance_tons       = committed_tons * (100 - min_take_pct) / 100
      billable_short_tons  = max(0, season_shorted_tons - tolerance_tons)
      season_penalty_usd   = round(billable_short_tons
                                   * failure_to_supply_penalty_per_ton, 2)
      penalty_reconciliation_delta_usd = round(season_penalty_usd
                                               - penalty_accrued_usd, 2)
      # The aggregate variant knows nothing about storm multipliers or per-order
      # caps and absorbs the whole min-take tolerance band once; the per-event
      # variant applies the multiplier and the 15% cap per order and never sees
      # the band. Identical delivery history therefore yields two different
      # totals, and penalty_reconciliation_delta_usd is the signed gap.
    input_set: "PER_EVENT: the single DeliveryOrder plus its contract's rate fields. SEASON_AGGREGATE: the contract's committed_tons and fulfilled_tons, where fulfilled_tons counts DELIVERED orders only (see contract_fulfillment_ledger)."
    constants:
      STORM_MULTIPLIER: 2.00
      PER_EVENT_CAP_FRACTION: 0.15
    precision: "2 decimal places, round_half_up"
    variants:
      - name: PER_EVENT
        when: "At each allocate call that leaves the order short"
        difference: "Charges the storm multiplier, caps at 15% of that order's value, and ignores the season tolerance band entirely."
      - name: SEASON_AGGREGATE
        when: "Once, at close-season, on the contract"
        difference: "Nets the whole season against the min-take tolerance band, drops both the storm multiplier and the per-order cap, and replaces rather than adds to the per-event ledger."

  - name: delivery_invoice_amount
    trigger: "POST /salt/delivery-orders/{id}/deliver"
    algorithm: aggregation
    formula: |
      # ROUNDING ORDER IS PINNED: round EACH allocation line to cents FIRST, then
      # sum the rounded lines. Summing raw products and rounding once at the end
      # is WRONG and differs by whole cents on multi-line orders.
      lines = Allocation rows on this order with state IN {RESERVED, CONSUMED},
              processed in created_at ASC order (rank_position ASC is the same
              order for waterfall rows; created_at is authoritative)
      for each line:
          line_product_usd = round(line.tons * BidContract.guaranteed_price_per_ton, 2)
          line_freight_usd = round(line.tons
                                   * Depot(line.lot.depot_id).outbound_freight_rate_per_ton, 2)
      product_subtotal_usd = sum(line_product_usd)      # sum of ALREADY-rounded lines
      freight_subtotal_usd = sum(line_freight_usd)      # sum of ALREADY-rounded lines
      total_allocated_tons = sum(line.tons)
      storm_surcharge_usd  = round((product_subtotal_usd + freight_subtotal_usd) * 0.06, 2)
                             if storm_priority == STORM_EMERGENCY else 0.00
      guarantee_ceiling_per_ton = BidContract.guaranteed_price_per_ton
                                  * (1 + BidContract.price_guarantee_cap_pct / 100)
      guarantee_credit_usd = round(max(0, market_index_price_per_ton
                                          - guarantee_ceiling_per_ton)
                                   * total_allocated_tons, 2)
      invoice_total_usd = round(product_subtotal_usd + freight_subtotal_usd
                                + storm_surcharge_usd - guarantee_credit_usd, 2)
    input_set: "Allocation rows with state IN {RESERVED, CONSUMED} at the instant deliver runs (they become CONSUMED in the same request); RELEASED rows are excluded. Freight uses the SOURCE lot's depot rate, not the order's depot rate."
    constants:
      STORM_SURCHARGE_FRACTION: 0.06
      GUARANTEE_CEILING: "guaranteed_price_per_ton * (1 + price_guarantee_cap_pct / 100), unrounded"
    precision: "2 decimal places, round_half_up, applied per line and again on each subtotal-derived figure"

  - name: contract_fulfillment_ledger
    trigger: "POST /salt/delivery-orders/{id}/deliver (fulfilled side), POST /salt/bid-contracts/{id}/activate (coverage side), and read-time on GET /salt/bid-contracts/{id}"
    algorithm: aggregation
    formula: |
      fulfilled_tons = sum(DeliveryOrder.allocated_tons
                           WHERE bid_contract_id == C.id AND status == DELIVERED)
                       # REQUESTED, ALLOCATED and SHORTED orders contribute nothing
      open_committed_tons = max(0, committed_tons - fulfilled_tons)
      take_pct = round(fulfilled_tons * 100 / committed_tons, 2)
      penalty_accrued_usd = round(sum(DeliveryOrder.shortfall_penalty_usd
                                      WHERE bid_contract_id == C.id
                                        AND penalty_state == ACCRUED), 2)
      breach_watch = penalty_accrued_usd >= 0.05 * contract_value_usd
      # take-band headroom checked at POST /salt/delivery-orders
      take_band_consumed_tons = sum(DeliveryOrder.requested_tons
                                WHERE bid_contract_id == C.id
                                  AND status IN {REQUESTED, ALLOCATED, SHORTED, DELIVERED})
      REJECT a new order with ERR_TAKE_BAND_EXCEEDED when
          take_band_consumed_tons + new.requested_tons > committed_tons * max_take_pct / 100
      # pre-season coverage checked at POST /salt/bid-contracts/{id}/activate
      preseason_coverage_tons = sum(StockpileLot.tons_available
              WHERE lot_state == AVAILABLE
                AND product_line == C.product_line
                AND Depot(depot_id).state_code == C.state_code
                AND Depot(depot_id).depot_state IN {OPEN, SURGE})
      REJECT activation with ERR_PRESEASON_COVERAGE_SHORT when
          preseason_coverage_tons < committed_tons * min_take_pct / 100
    input_set: "Explicit status filters on both sides: fulfilled_tons counts DELIVERED only; the take band counts every non-terminal AND delivered order so that released tonnage still consumes headroom; coverage counts AVAILABLE lots at OPEN or SURGE depots in the contract's own state_code."
    constants:
      BREACH_WATCH_FRACTION: 0.05
    precision: "tonnage and USD at 2 decimals round_half_up; take_pct at 2 decimals; the breach_watch and take-band comparisons are made on unrounded products"

  - name: supply_reliability_score
    trigger: "POST /salt/delivery-orders/{id}/allocate when the order shorts, POST /salt/delivery-orders/{id}/waive-penalty, and POST /salt/bid-contracts/{id}/close-season (FORFEITED branch only)"
    algorithm: decay_function
    formula: |
      cumulative_shorted_tons = sum(DeliveryOrder.shorted_tons
                                    WHERE bid_contract_id == C.id
                                      AND penalty_state == ACCRUED)
      shortfall_haircut = min(40, round(cumulative_shorted_tons * 100
                                        / committed_tons, 2))
      forfeit_haircut   = 25 if status == FORFEITED else 0
      supply_reliability_score = max(0, min(100,
              100 - shortfall_haircut - forfeit_haircut))
    input_set: "Only orders whose penalty_state is still ACCRUED count — waiving a penalty removes its order from cumulative_shorted_tons and lifts the score back up."
    constants:
      HAIRCUT_CAP: 40
      FORFEIT_HAIRCUT: 25
      SCORE_FLOOR: 0
      SCORE_CEILING: 100
    precision: "2 decimal places, round_half_up"

  - name: lot_tonnage_conservation
    trigger: "invariant re-checked after every Allocation write: POST /salt/allocations, POST /salt/delivery-orders/{id}/allocate, .../release-allocations, .../deliver"
    algorithm: aggregation
    formula: |
      # Conserved quantity #1 — TONS on a StockpileLot.
      # Invariant that MUST hold after every request that touches the lot:
      L.tons_available == L.tons_on_hand - sum(A.tons for A in Allocation
                                               WHERE A.stockpile_lot_id == L.id
                                                 AND A.state == RESERVED)
      # Forward action  : reserve  -> tons_reserved +t, tons_available -t, tons_on_hand unchanged
      # Compensation    : release  -> tons_reserved -t, tons_available +t, tons_on_hand unchanged
      #   => reserve followed by release restores tons_available AND tons_on_hand
      #      to their exact pre-reservation values (zero drift, 2-decimal equality)
      # Consumption     : deliver  -> tons_reserved -t, tons_on_hand -t, tons_available unchanged
      #   => a consumed reservation is NOT compensable; it moves the pile itself
    input_set: "All Allocation rows on the lot; RELEASED and CONSUMED rows contribute 0 to tons_reserved."
    constants:
      DRIFT_TOLERANCE: 0.00
    precision: "2 decimal places, exact equality required"

  - name: penalty_ledger_conservation
    trigger: "invariant re-checked after POST /salt/delivery-orders/{id}/allocate (shorting) and POST /salt/delivery-orders/{id}/waive-penalty"
    algorithm: aggregation
    formula: |
      # Conserved quantity #2 — USD on a BidContract.
      # Invariant that MUST hold after every request that touches a penalty:
      C.penalty_accrued_usd == round(sum(O.shortfall_penalty_usd
                                         for O in DeliveryOrder
                                         WHERE O.bid_contract_id == C.id
                                           AND O.penalty_state == ACCRUED), 2)
      # Forward action : shorting an order -> O.penalty_state = ACCRUED,
      #                  O.shortfall_penalty_usd = p, C.penalty_accrued_usd += p
      # Compensation   : waive-penalty     -> O.penalty_state = WAIVED,
      #                  O.shortfall_penalty_usd is KEPT for audit,
      #                  C.penalty_accrued_usd -= p, breach_watch and
      #                  supply_reliability_score are re-derived from the
      #                  remaining ACCRUED set
      #   => accrue followed by waive returns C.penalty_accrued_usd to exactly
      #      its pre-shortfall value and re-clears breach_watch when the
      #      remaining ACCRUED total falls back under 5% of contract_value_usd
    input_set: "DeliveryOrder rows on the contract with penalty_state == ACCRUED only; WAIVED and NONE rows contribute 0."
    constants:
      DRIFT_TOLERANCE: 0.00
    precision: "2 decimal places, exact equality required"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority — LOWEST number wins)
# A single request may violate several rows; the row with the smallest
# `priority` is the one whose `error_id` is returned, and no later row's side
# effects are applied.
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and equal to one of the seven roles declared in §1.7; X-User-ID header present and non-empty"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "the role in X-User-Role appears in the called endpoint's `roles:` list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: auth
    check: "segregation of duties: the X-User-ID deciding QC on a TreatmentBatch must differ from the X-User-ID that created that batch, and the X-User-ID issuing a Mine compliance-action must differ from the X-User-ID that recorded the GroundControlInspection cited as evidence"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /salt/treatment-batches/{id}/qc-decision, POST /salt/mines/{id}/compliance-action"
  - priority: 4
    category: auth
    check: "depot ownership: when X-User-Role is DepotManager, X-User-ID must equal the id of the Depot the request touches (Depot in the path, or the Depot behind the shipment/lot being mutated)"
    error_id: ERR_DEPOT_NOT_OWNED
    http_status: 403
    applies_to: "PATCH /salt/depots/{id}, POST /salt/depots/{id}/posture, POST /salt/shipments, POST /salt/shipments/{id}/load, POST /salt/shipments/{id}/receive, POST /salt/stockpile-lots/{id}/quarantine-state"

  - priority: 5
    category: schema
    check: "every field marked required in the endpoint's `input:` is present and non-null"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "all"

  - priority: 6
    category: schema
    check: "every enum-typed input value is a member of the enum declared for that field in §1.1 (product_line, screen_spec, storage_kind, mode, storm_priority, method, penalty_basis, finding, jurisdiction_level, action)"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "all"

  - priority: 7
    category: schema
    check: "numeric and temporal shape: tonnages, rates and prices >= 0; pct fields within 0..100; severity_index integer 0..100; min_take_pct <= max_take_pct; rework_count not client-settable; every window has start strictly before end (hoist_window_start < hoist_window_end, load_window_start < load_window_end); preseason_lock_date and required_by are well-formed ISO-8601 instants"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "POST /salt/mines, POST /salt/panels, POST /salt/production-runs, POST /salt/production-runs/{id}/hoist, POST /salt/treatment-batches, POST /salt/depots, PATCH /salt/depots/{id}, POST /salt/shipments, POST /salt/season-forecasts, PATCH /salt/season-forecasts/{id}, POST /salt/bid-contracts, POST /salt/delivery-orders, POST /salt/allocations, POST /_clock/set_current_utc"

  - priority: 8
    category: existence
    check: "every resource named by a path segment exists, validated left to right"
    error_id: "ERR_MINE_NOT_FOUND | ERR_PANEL_NOT_FOUND | ERR_RUN_NOT_FOUND | ERR_BATCH_NOT_FOUND | ERR_DEPOT_NOT_FOUND | ERR_LOT_NOT_FOUND | ERR_SHIPMENT_NOT_FOUND | ERR_FORECAST_NOT_FOUND | ERR_CONTRACT_NOT_FOUND | ERR_ORDER_NOT_FOUND | ERR_ALLOCATION_NOT_FOUND | ERR_INSPECTION_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with a path parameter"

  - priority: 9
    category: existence
    check: "every foreign key supplied in the request body resolves to an existing row (mine_id, panel_id, production_run_id, depot_id, origin_depot_id, destination_depot_id, treatment_batch_id, stockpile_lot_id, season_forecast_id, bid_contract_id, delivery_order_id, inspection_id)"
    error_id: "the ERR_*_NOT_FOUND of the referenced entity"
    http_status: 404
    applies_to: "POST /salt/panels, POST /salt/ground-control-inspections, POST /salt/production-runs, POST /salt/treatment-batches, POST /salt/shipments, POST /salt/bid-contracts, POST /salt/delivery-orders, POST /salt/allocations, POST /salt/mines/{id}/compliance-action"

  - priority: 10
    category: state
    check: "optimistic concurrency: the supplied expected_<parent>_version equals the parent's current version (see §1.2.1 — expected_mine_version on Mine, expected_bid_contract_version on BidContract, expected_stockpile_lot_version on StockpileLot)"
    error_id: "ERR_STALE_MINE_VERSION | ERR_STALE_BID_CONTRACT_VERSION | ERR_STALE_STOCKPILE_LOT_VERSION"
    http_status: 412
    applies_to: "POST /salt/production-runs, POST /salt/delivery-orders, POST /salt/allocations"

  - priority: 11
    category: state
    check: "BidContract is in a state that permits the operation: submit requires DRAFT; decision requires SUBMITTED; activate requires AWARDED; delivery-order creation requires ACTIVE; close-season requires ACTIVE"
    error_id: ERR_CONTRACT_INVALID_STATE
    http_status: 409
    applies_to: "POST /salt/bid-contracts/{id}/submit, POST /salt/bid-contracts/{id}/decision, POST /salt/bid-contracts/{id}/activate, POST /salt/bid-contracts/{id}/close-season, POST /salt/delivery-orders"

  - priority: 12
    category: state
    check: "DeliveryOrder is in a state that permits the operation: allocate requires REQUESTED; release-allocations requires ALLOCATED or SHORTED; deliver requires ALLOCATED or SHORTED; waive-penalty requires SHORTED"
    error_id: ERR_ORDER_INVALID_STATE
    http_status: 409
    applies_to: "POST /salt/delivery-orders/{id}/allocate, POST /salt/delivery-orders/{id}/release-allocations, POST /salt/delivery-orders/{id}/deliver, POST /salt/delivery-orders/{id}/waive-penalty"

  - priority: 13
    category: state
    check: "Panel is in a state that permits the operation: develop requires PLANNED; start-production requires DEVELOPED or SUSPENDED; suspend requires PRODUCING; deplete requires PRODUCING or SUSPENDED; abandon requires any of PLANNED, DEVELOPED, PRODUCING, SUSPENDED; production-run creation requires PRODUCING"
    error_id: ERR_PANEL_INVALID_STATE
    http_status: 409
    applies_to: "POST /salt/panels/{id}/develop, POST /salt/panels/{id}/start-production, POST /salt/panels/{id}/suspend, POST /salt/panels/{id}/deplete, POST /salt/panels/{id}/abandon, POST /salt/production-runs"

  - priority: 14
    category: state
    check: "ProductionRun is in a state that permits the operation: hoist requires SCHEDULED; close requires HOISTED; reinstate requires HELD; treatment-batch creation requires the run to be HOISTED or CLOSED"
    error_id: ERR_RUN_INVALID_STATE
    http_status: 409
    applies_to: "POST /salt/production-runs/{id}/hoist, POST /salt/production-runs/{id}/close, POST /salt/production-runs/{id}/reinstate, POST /salt/treatment-batches"

  - priority: 15
    category: state
    check: "Shipment is in a state that permits the operation: load requires PLANNED; receive requires LOADED; cancel requires PLANNED or LOADED"
    error_id: ERR_SHIPMENT_INVALID_STATE
    http_status: 409
    applies_to: "POST /salt/shipments/{id}/load, POST /salt/shipments/{id}/receive, POST /salt/shipments/{id}/cancel"

  - priority: 16
    category: state
    check: "TreatmentBatch QC has not already been finalised: a qc-decision of PASS or FAIL is only accepted while qc_state == PENDING, and a batch whose qc_state is PASSED or FAILED rejects any further decision (including a repeat of the same decision — the operation is not idempotent)"
    error_id: ERR_BATCH_QC_ALREADY_DECIDED
    http_status: 409
    applies_to: "POST /salt/treatment-batches/{id}/qc-decision"

  - priority: 17
    category: state
    check: "a REWORK qc-decision is only accepted while rework_count < 2; the third rework attempt is refused and the batch must be passed or failed"
    error_id: ERR_REWORK_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "POST /salt/treatment-batches/{id}/qc-decision"

  - priority: 18
    category: state
    check: "every Allocation being released must currently be in state RESERVED; a CONSUMED or already RELEASED allocation cannot be released"
    error_id: ERR_ALLOCATION_NOT_RESERVED
    http_status: 409
    applies_to: "POST /salt/delivery-orders/{id}/release-allocations, POST /salt/allocations/{id}/release"

  - priority: 19
    category: state
    check: "the StockpileLot targeted is in a state that permits the operation: a reservation or shipment requires lot_state == AVAILABLE and a QUARANTINED lot is refused with ERR_LOT_QUARANTINED; a quarantine-state change requires AVAILABLE (to quarantine) or QUARANTINED (to clear), so a DEPLETED lot is refused with ERR_LOT_STATE_INVALID. A DEPLETED lot needs no separate reservation error — its tons_available is 0 and it fails priority 35."
    error_id: "ERR_LOT_QUARANTINED | ERR_LOT_STATE_INVALID"
    http_status: 409
    applies_to: "POST /salt/allocations, POST /salt/shipments, POST /salt/stockpile-lots/{id}/quarantine-state"

  - priority: 20
    category: state
    check: "the Depot involved is not CLOSED: a CLOSED depot accepts no inbound treatment batch, no new lot, no shipment and no manual allocation"
    error_id: ERR_DEPOT_CLOSED
    http_status: 409
    applies_to: "POST /salt/treatment-batches, POST /salt/treatment-batches/{id}/qc-decision, POST /salt/shipments, POST /salt/shipments/{id}/receive, POST /salt/allocations, POST /salt/delivery-orders"

  - priority: 21
    category: state
    check: "a penalty can only be waived while the order's penalty_state == ACCRUED; NONE and already-WAIVED orders are refused"
    error_id: ERR_PENALTY_NOT_ACCRUED
    http_status: 409
    applies_to: "POST /salt/delivery-orders/{id}/waive-penalty"

  - priority: 22
    category: business_safety
    check: "MSHA withdrawal order: a Mine whose compliance_state == WITHDRAWAL_ORDER may not schedule or hoist production of any kind, regardless of hoist availability or remaining panel reserve"
    error_id: ERR_MINE_WITHDRAWAL_ORDER_ACTIVE
    http_status: 409
    applies_to: "POST /salt/production-runs, POST /salt/production-runs/{id}/hoist, POST /salt/production-runs/{id}/reinstate, POST /salt/panels/{id}/start-production"

  - priority: 23
    category: business_safety
    check: "hoisting requires a working shaft: Mine.hoist_state must be HOIST_AVAILABLE or HOIST_DERATED, never HOIST_DOWN"
    error_id: ERR_HOIST_UNAVAILABLE
    http_status: 409
    applies_to: "POST /salt/production-runs, POST /salt/production-runs/{id}/hoist, POST /salt/production-runs/{id}/reinstate"

  - priority: 24
    category: business_safety
    check: "ground control: a Panel whose computed open_defect == true (a DEFECT GroundControlInspection has been recorded and not yet cleared via POST /salt/panels/{id}/remediate-defect) may not return to production or host a new run"
    error_id: ERR_GROUND_CONTROL_DEFECT_OPEN
    http_status: 409
    applies_to: "POST /salt/panels/{id}/start-production, POST /salt/production-runs, POST /salt/production-runs/{id}/reinstate"

  - priority: 25
    category: business_safety
    check: "screen spec must be permitted for the product line: HIGHWAY_DEICING accepts COARSE or MEDIUM, WATER_CONDITIONING accepts COARSE only, FOOD_GRADE accepts FINE only, CHEMICAL_FEEDSTOCK accepts MEDIUM or FINE"
    error_id: ERR_SCREEN_SPEC_NOT_ALLOWED
    http_status: 422
    applies_to: "POST /salt/treatment-batches"

  - priority: 26
    category: business_safety
    check: "additive dosing must be inside the product line's inclusive window: anticaking_ppm and corrosion_inhibitor_pct within HIGHWAY_DEICING [0,60]/[0.0,1.5], WATER_CONDITIONING [0,0]/[0.0,0.0], FOOD_GRADE [4,12]/[0.0,0.0], CHEMICAL_FEEDSTOCK [0,25]/[0.0,0.0]"
    error_id: ERR_ADDITIVE_DOSE_OUT_OF_SPEC
    http_status: 422
    applies_to: "POST /salt/treatment-batches"

  - priority: 27
    category: business_safety
    check: "a batch may only be passed when its computed purity_pct_nacl >= the product line's min_purity_pct (HIGHWAY_DEICING 92.0, WATER_CONDITIONING 99.5, FOOD_GRADE 99.6, CHEMICAL_FEEDSTOCK 96.0)"
    error_id: ERR_PURITY_BELOW_SPEC
    http_status: 409
    applies_to: "POST /salt/treatment-batches/{id}/qc-decision"

  - priority: 28
    category: business_safety
    check: "moisture-sensitive product lines require covered storage: a StockpileLot whose product_line is WATER_CONDITIONING or FOOD_GRADE may not be created on, or shipped to, a depot slot with storage_kind == OPEN_PAD"
    error_id: ERR_UNCOVERED_STORAGE_NOT_ALLOWED
    http_status: 409
    applies_to: "POST /salt/treatment-batches, POST /salt/treatment-batches/{id}/qc-decision, POST /salt/shipments, POST /salt/shipments/{id}/receive"

  - priority: 29
    category: business_referential
    check: "market-positioning agreement: a manual Allocation's lot product_line must equal the contract's product_line AND the lot depot's state_code must equal the contract's state_code; a Shipment's destination_storage_kind must match the lot's own storage_kind"
    error_id: ERR_PRODUCT_LINE_MISMATCH
    http_status: 409
    applies_to: "POST /salt/allocations, POST /salt/shipments"

  - priority: 30
    category: business_temporal
    check: "pre-season stockpiling window: a BidContract may only be activated at or before its forecast's preseason_lock_date; strictly after that instant activation is refused (the logical clock from POST /_clock/set_current_utc is authoritative)"
    error_id: ERR_PRESEASON_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /salt/bid-contracts/{id}/activate"

  - priority: 31
    category: business_constraint
    check: "aggregate hoist capacity over the requested window: the peak sum of concurrent planned_tons_per_hour across SCHEDULED runs on this mine must not exceed effective_hoist_tons_per_day / 24 (see calculations.hoist_window_aggregate_capacity; equality is allowed)"
    error_id: ERR_HOIST_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /salt/production-runs, POST /salt/production-runs/{id}/reinstate"

  - priority: 32
    category: business_constraint
    check: "loadout bay exclusivity with mode switch buffer at the origin depot (see calculations.depot_loadout_bay_conflict; closed intervals, so touching windows collide)"
    error_id: ERR_LOADOUT_BAY_CONFLICT
    http_status: 409
    applies_to: "POST /salt/shipments"

  - priority: 33
    category: business_constraint
    check: "panel reserve: the sum of planned_tons across the panel's runs with status IN {SCHEDULED, HELD, HOISTED, CLOSED} plus the new run's planned_tons must not exceed Panel.recoverable_tons"
    error_id: ERR_PANEL_RESERVE_EXCEEDED
    http_status: 409
    applies_to: "POST /salt/production-runs, POST /salt/production-runs/{id}/reinstate"

  - priority: 34
    category: business_constraint
    check: "covered storage capacity: the depot's covered_stored_tons plus the incoming lot tonnage must not exceed covered_capacity_tons for COVERED lots (open-pad lots are checked against open_pad_capacity_tons)"
    error_id: ERR_COVERED_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /salt/treatment-batches/{id}/qc-decision, POST /salt/shipments/{id}/receive"

  - priority: 35
    category: business_constraint
    check: "a manual reservation or shipment may not exceed the lot's tons_available at request time"
    error_id: ERR_INSUFFICIENT_LOT_TONS
    http_status: 409
    applies_to: "POST /salt/allocations, POST /salt/shipments"

  - priority: 36
    category: business_constraint
    check: "the waterfall found no eligible lot at all (empty candidate pool per calculations.storm_allocation_waterfall) — nothing is reserved and the order stays REQUESTED"
    error_id: ERR_NO_ELIGIBLE_STOCKPILE
    http_status: 409
    applies_to: "POST /salt/delivery-orders/{id}/allocate"

  - priority: 37
    category: business_fiscal
    check: "take band: take_band_consumed_tons + requested_tons must not exceed committed_tons * max_take_pct / 100 (see calculations.contract_fulfillment_ledger)"
    error_id: ERR_TAKE_BAND_EXCEEDED
    http_status: 409
    applies_to: "POST /salt/delivery-orders"

  - priority: 38
    category: business_fiscal
    check: "pre-season coverage floor: at activation, preseason_coverage_tons must be at least committed_tons * min_take_pct / 100"
    error_id: ERR_PRESEASON_COVERAGE_SHORT
    http_status: 409
    applies_to: "POST /salt/bid-contracts/{id}/activate"

# =============================================================================
# §1.5 API Endpoint Table
# All business paths are flat: /salt/<collection> and /salt/<collection>/{id},
# with action sub-paths /salt/<collection>/{id}/<action>. Every FK declared in
# §1.1 is reverse-reachable through the filtered-list form.
# =============================================================================
endpoints:
  # ---------------------------------------------------------------- test clock
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint: sets the server's logical clock to any instant. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z and MUST NOT fall back to real wall-clock time. All window, lock-date and required_by comparisons read this clock."
    roles: [MinePlanner, GroundControlEngineer, QualityLab, LogisticsPlanner, ContractAdministrator, ComplianceOfficer, DepotManager]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["logical clock moves to to_iso8601; no entity is mutated and no recomputation is triggered"]

  # ---------------------------------------------------------------------- Mine
  - method: POST
    path: "/salt/mines"
    description: "Register a salt mine with its nameplate hoisting capacity."
    roles: [MinePlanner]
    code: 201
    input: [name, state_code, rated_hoist_tons_per_day, "ground_control_plan_version?"]
    output: Mine
    side_effects: ["hoist_state = HOIST_AVAILABLE, compliance_state = COMPLIANT", "computes effective_hoist_tons_per_day via calculations.mine_effective_hoist_capacity", "scheduled_hoist_tons_open = 0, producing_panel_count = 0", "version = 1"]

  - method: GET
    path: "/salt/mines/{id}"
    description: "Read one mine including both live state dimensions and derated capacity."
    roles: [MinePlanner, GroundControlEngineer, QualityLab, LogisticsPlanner, ContractAdministrator, ComplianceOfficer, DepotManager]
    code: 200
    input: []
    output: Mine
    side_effects: []

  - method: GET
    path: "/salt/mines"
    description: "List mines, optionally filtered by jurisdiction or by either state dimension."
    roles: [MinePlanner, GroundControlEngineer, QualityLab, LogisticsPlanner, ContractAdministrator, ComplianceOfficer, DepotManager]
    code: 200
    input: ["state_code?", "hoist_state?", "compliance_state?"]
    output: Mine[]
    side_effects: []

  - method: GET
    path: "/salt/mines/{id}/hoist-capacity"
    description: "Computed read: the derate factors behind effective_hoist_tons_per_day and the currently committed hourly rate."
    roles: [MinePlanner, GroundControlEngineer, LogisticsPlanner, ComplianceOfficer]
    code: 200
    input: []
    output:
      rated_hoist_tons_per_day: number
      hoist_factor: number
      compliance_factor: number
      effective_hoist_tons_per_day: number
      mine_hourly_capacity: number
      scheduled_hoist_tons_open: number
      scheduled_run_count: integer
    side_effects: []

  - method: POST
    path: "/salt/mines/{id}/hoist-status"
    description: "Shaft engineering sets the hoist dimension (HOIST_AVAILABLE / HOIST_DERATED / HOIST_DOWN); the compliance dimension is untouched."
    roles: [MinePlanner]
    code: 200
    input: [hoist_state, "note?"]
    output: Mine
    side_effects: ["recomputes effective_hoist_tons_per_day (product of BOTH dimensions' factors)", "if the new capacity is 0 or the committed hourly rate now exceeds mine_hourly_capacity: every SCHEDULED ProductionRun on this mine moves to HELD with held_reason = CAPACITY", "recomputes scheduled_hoist_tons_open", "increments Mine.version by 1"]

  - method: POST
    path: "/salt/mines/{id}/compliance-action"
    description: "Compliance officer records an MSHA action on the compliance dimension: CITE -> CITED, WITHDRAW -> WITHDRAWAL_ORDER, CLEAR -> COMPLIANT. inspection_id, when supplied, is the GroundControlInspection cited as evidence and drives the segregation-of-duties check."
    roles: [ComplianceOfficer]
    code: 200
    input: [action, "inspection_id?", "note?"]
    output: Mine
    side_effects: ["sets compliance_state and last_compliance_action_at", "recomputes effective_hoist_tons_per_day", "recomputes recoverable_tons for every Panel of this mine whose status is not DEPLETED or ABANDONED (the pillar-recovery bonus is only granted while compliance_state == COMPLIANT)", "WITHDRAW additionally moves every SCHEDULED ProductionRun on this mine to HELD with held_reason = GROUND_CONTROL", "recomputes scheduled_hoist_tons_open", "increments Mine.version by 1"]

  # --------------------------------------------------------------------- Panel
  - method: POST
    path: "/salt/panels"
    description: "Lay out a room-and-pillar panel and compute its recoverable reserve."
    roles: [MinePlanner]
    code: 201
    input: [mine_id, panel_code, gross_tons_in_place, extraction_ratio_pct, grade_pct_nacl, insolubles_pct, "pillar_recovery_allowed?"]
    output: Panel
    side_effects: ["computes recoverable_tons via calculations.panel_recoverable_tons using the parent Mine's current compliance_state", "status = PLANNED, mined_tons = 0, open_defect = false, ground_control_defect_count = 0", "version = 1"]

  - method: GET
    path: "/salt/panels/{id}"
    description: "Read one panel with its computed reserve and ground-control flags."
    roles: [MinePlanner, GroundControlEngineer, QualityLab, LogisticsPlanner, ContractAdministrator, ComplianceOfficer, DepotManager]
    code: 200
    input: []
    output: Panel
    side_effects: []

  - method: GET
    path: "/salt/panels"
    description: "List panels; the mine_id filter is the reverse-reachability path from Mine to Panel."
    roles: [MinePlanner, GroundControlEngineer, QualityLab, LogisticsPlanner, ContractAdministrator, ComplianceOfficer, DepotManager]
    code: 200
    input: ["mine_id?", "status?", "open_defect?"]
    output: Panel[]
    side_effects: []

  - method: POST
    path: "/salt/panels/{id}/develop"
    description: "Complete development entries and pillars: PLANNED -> DEVELOPED."
    roles: [MinePlanner]
    code: 200
    input: []
    output: Panel
    side_effects: ["status = DEVELOPED", "increments Panel.version by 1"]

  - method: POST
    path: "/salt/panels/{id}/start-production"
    description: "Bring a developed or suspended panel into production: DEVELOPED -> PRODUCING or SUSPENDED -> PRODUCING."
    roles: [MinePlanner]
    code: 200
    input: []
    output: Panel
    side_effects: ["status = PRODUCING, suspended_by_user_id cleared", "increments Mine.producing_panel_count by 1", "increments Panel.version by 1"]

  - method: POST
    path: "/salt/panels/{id}/suspend"
    description: "Ground control suspends an actively producing panel: PRODUCING -> SUSPENDED."
    roles: [GroundControlEngineer, ComplianceOfficer]
    code: 200
    input: [reason]
    output: Panel
    side_effects: ["status = SUSPENDED, suspended_by_user_id = X-User-ID", "every SCHEDULED ProductionRun on this panel moves to HELD with held_reason = GROUND_CONTROL", "decrements Mine.producing_panel_count by 1 and recomputes Mine.scheduled_hoist_tons_open", "increments Panel.version by 1"]

  - method: POST
    path: "/salt/panels/{id}/remediate-defect"
    description: "Record remediation of the panel's open ground-control defect, clearing open_defect so production may resume."
    roles: [GroundControlEngineer]
    code: 200
    input: [remediation_note]
    output: Panel
    side_effects: ["open_defect = false (ground_control_defect_count is a permanent tally and is NOT decremented)", "increments Panel.version by 1"]

  - method: POST
    path: "/salt/panels/{id}/deplete"
    description: "Mine out the panel: PRODUCING or SUSPENDED -> DEPLETED (terminal)."
    roles: [MinePlanner]
    code: 200
    input: []
    output: Panel
    side_effects: ["status = DEPLETED", "every SCHEDULED or HELD ProductionRun on this panel moves to VOIDED", "recomputes Mine.producing_panel_count and Mine.scheduled_hoist_tons_open", "recoverable_tons is frozen and no longer recomputed by compliance actions", "increments Panel.version by 1"]

  - method: POST
    path: "/salt/panels/{id}/abandon"
    description: "Abandon a panel for ground-control or economic reasons: PLANNED, DEVELOPED, PRODUCING or SUSPENDED -> ABANDONED (terminal)."
    roles: [MinePlanner, ComplianceOfficer]
    code: 200
    input: [reason]
    output: Panel
    side_effects: ["status = ABANDONED", "every SCHEDULED or HELD ProductionRun on this panel moves to VOIDED", "recomputes Mine.producing_panel_count and Mine.scheduled_hoist_tons_open", "recoverable_tons is frozen", "increments Panel.version by 1"]

  # ---------------------------------------------------- GroundControlInspection
  - method: POST
    path: "/salt/ground-control-inspections"
    description: "Append an immutable ground-control inspection record for a panel. A DEFECT finding cascades: it flags the panel, suspends it when producing, and derates or downs the mine hoist."
    roles: [GroundControlEngineer]
    code: 201
    input: [panel_id, roof_span_ft, convergence_rate_in_per_day, finding]
    output: GroundControlInspection
    side_effects: ["inspector_user_id = X-User-ID", "finding == DEFECT: Panel.open_defect = true and Panel.ground_control_defect_count += 1; a PRODUCING panel moves to SUSPENDED and caused_suspension = true; every SCHEDULED ProductionRun on that panel moves to HELD with held_reason = GROUND_CONTROL; the parent Mine moves HOIST_AVAILABLE -> HOIST_DERATED, or HOIST_DERATED -> HOIST_DOWN when the mine already had a derate, and effective_hoist_tons_per_day plus scheduled_hoist_tons_open are recomputed; Mine.version increments by 1", "finding == ADVISORY or PASS: no cascade", "this entity has no version field and no update endpoint"]

  - method: GET
    path: "/salt/ground-control-inspections/{id}"
    description: "Read one inspection record."
    roles: [MinePlanner, GroundControlEngineer, QualityLab, LogisticsPlanner, ContractAdministrator, ComplianceOfficer, DepotManager]
    code: 200
    input: []
    output: GroundControlInspection
    side_effects: []

  - method: GET
    path: "/salt/ground-control-inspections"
    description: "List inspection records; the panel_id filter is the reverse-reachability path from Panel to GroundControlInspection, newest first by created_at DESC."
    roles: [MinePlanner, GroundControlEngineer, QualityLab, LogisticsPlanner, ContractAdministrator, ComplianceOfficer, DepotManager]
    code: 200
    input: ["panel_id?", "finding?", "caused_suspension?"]
    output: GroundControlInspection[]
    side_effects: []

  # ------------------------------------------------------------- ProductionRun
  - method: POST
    path: "/salt/production-runs"
    description: "Schedule a hoisting run against a producing panel. Guarded by the MSHA withdrawal check, the hoist-availability check, the open-defect check, the aggregate hoist-capacity sweep and the panel reserve check, in §1.4 priority order."
    roles: [MinePlanner]
    code: 201
    input: [mine_id, panel_id, planned_tons, hoist_window_start, hoist_window_end, expected_mine_version]
    output: ProductionRun
    side_effects: ["OCC: expected_mine_version must equal Mine.version or ERR_STALE_MINE_VERSION (412)", "computes planned_tons_per_hour = round(planned_tons / window_hours, 4)", "runs calculations.hoist_window_aggregate_capacity against the mine's other SCHEDULED runs", "status = SCHEDULED, hoisted_tons = 0", "recomputes Mine.scheduled_hoist_tons_open", "increments Mine.version by 1", "version = 1"]

  - method: GET
    path: "/salt/production-runs/{id}"
    description: "Read one production run with its window and hold reason."
    roles: [MinePlanner, GroundControlEngineer, QualityLab, LogisticsPlanner, ContractAdministrator, ComplianceOfficer, DepotManager]
    code: 200
    input: []
    output: ProductionRun
    side_effects: []

  - method: GET
    path: "/salt/production-runs"
    description: "List production runs; the mine_id and panel_id filters are the reverse-reachability paths from Mine and Panel to ProductionRun."
    roles: [MinePlanner, GroundControlEngineer, QualityLab, LogisticsPlanner, ContractAdministrator, ComplianceOfficer, DepotManager]
    code: 200
    input: ["mine_id?", "panel_id?", "status?", "held_reason?"]
    output: ProductionRun[]
    side_effects: []

  - method: POST
    path: "/salt/production-runs/{id}/hoist"
    description: "Record the tonnage actually brought to surface: SCHEDULED -> HOISTED."
    roles: [MinePlanner]
    code: 200
    input: [hoisted_tons]
    output: ProductionRun
    side_effects: ["status = HOISTED, hoisted_tons stored", "adds hoisted_tons to Panel.mined_tons", "recomputes Mine.scheduled_hoist_tons_open (the window is released)", "increments ProductionRun.version by 1"]

  - method: POST
    path: "/salt/production-runs/{id}/close"
    description: "Close a hoisted run once all of its treatment batches have been decided: HOISTED -> CLOSED (terminal)."
    roles: [MinePlanner]
    code: 200
    input: []
    output: ProductionRun
    side_effects: ["status = CLOSED", "increments ProductionRun.version by 1"]

  - method: POST
    path: "/salt/production-runs/{id}/reinstate"
    description: "Return a held run to the schedule: HELD -> SCHEDULED. Re-runs every guard the original create ran, so a run held by a cascade cannot be reinstated while the underlying condition persists."
    roles: [MinePlanner]
    code: 200
    input: []
    output: ProductionRun
    side_effects: ["status = SCHEDULED, held_reason cleared", "re-runs calculations.hoist_window_aggregate_capacity and the panel reserve check", "recomputes Mine.scheduled_hoist_tons_open", "increments ProductionRun.version by 1"]

  # ------------------------------------------------------------ TreatmentBatch
  - method: POST
    path: "/salt/treatment-batches"
    description: "Crush, screen and treat hoisted ore into a product-line batch, dosing anticaking and corrosion-inhibitor additives. Computes yield_tons and purity_pct_nacl at create."
    roles: [QualityLab]
    code: 201
    input: [production_run_id, depot_id, product_line, screen_spec, anticaking_ppm, corrosion_inhibitor_pct, input_tons, moisture_pct, storage_kind]
    output: TreatmentBatch
    side_effects: ["computes yield_tons and purity_pct_nacl via calculations.treatment_yield_and_purity, reading grade_pct_nacl from the panel behind the run", "qc_state = PENDING, rework_count = 0", "increments ProductionRun.open_batch_count by 1", "version = 1"]

  - method: GET
    path: "/salt/treatment-batches/{id}"
    description: "Read one treatment batch with its computed yield and purity."
    roles: [MinePlanner, GroundControlEngineer, QualityLab, LogisticsPlanner, ContractAdministrator, ComplianceOfficer, DepotManager]
    code: 200
    input: []
    output: TreatmentBatch
    side_effects: []

  - method: GET
    path: "/salt/treatment-batches"
    description: "List treatment batches; the production_run_id and depot_id filters are the reverse-reachability paths from ProductionRun and Depot to TreatmentBatch."
    roles: [MinePlanner, GroundControlEngineer, QualityLab, LogisticsPlanner, ContractAdministrator, ComplianceOfficer, DepotManager]
    code: 200
    input: ["production_run_id?", "depot_id?", "qc_state?", "product_line?", "screen_spec?"]
    output: TreatmentBatch[]
    side_effects: []

  - method: POST
    path: "/salt/treatment-batches/{id}/qc-decision"
    description: "Quality lab decides a pending batch: PASS lands a StockpileLot at the batch's depot, FAIL scraps it, REWORK re-screens it (PENDING -> PENDING self-loop, at most twice). The deciding X-User-ID must differ from the batch's creator."
    roles: [QualityLab]
    code: 200
    input: [decision, "note?"]
    output: TreatmentBatch
    side_effects: ["decision == PASS: purity_pct_nacl must be >= the product line's min_purity_pct; qc_state = PASSED, qc_decided_by_user_id = X-User-ID; creates a StockpileLot at depot_id with tons_on_hand = tons_available = yield_tons, tons_reserved = 0, lot_state = AVAILABLE, and product_line, purity_pct_nacl and storage_kind copied from the batch (discoverable only via GET /salt/stockpile-lots?treatment_batch_id=...); adds yield_tons to the depot's covered_stored_tons or open_pad_stored_tons per storage_kind, recomputes covered_utilization_pct, and auto-moves the depot OPEN -> SURGE when covered_stored_tons * 100 >= covered_capacity_tons * 90; decrements ProductionRun.open_batch_count by 1; increments Depot.version by 1", "decision == FAIL: qc_state = FAILED, qc_decided_by_user_id = X-User-ID, no lot is created, ProductionRun.open_batch_count decremented by 1", "decision == REWORK: qc_state stays PENDING, rework_count += 1 (refused at 2), yield_tons recomputed with the 0.97**rework_count loss factor while purity_pct_nacl stays frozen, open_batch_count unchanged", "increments TreatmentBatch.version by 1"]

  # --------------------------------------------------------------------- Depot
  - method: POST
    path: "/salt/depots"
    description: "Open a market-positioned depot with covered and open-pad storage plus a single loadout bay."
    roles: [LogisticsPlanner]
    code: 201
    input: [name, state_code, covered_capacity_tons, open_pad_capacity_tons, loadout_rate_tons_per_hour, outbound_freight_rate_per_ton]
    output: Depot
    side_effects: ["depot_state = OPEN", "covered_stored_tons = 0, open_pad_stored_tons = 0, covered_utilization_pct = 0", "version = 1"]

  - method: GET
    path: "/salt/depots/{id}"
    description: "Read one depot with live storage occupancy and storm posture."
    roles: [MinePlanner, GroundControlEngineer, QualityLab, LogisticsPlanner, ContractAdministrator, ComplianceOfficer, DepotManager]
    code: 200
    input: []
    output: Depot
    side_effects: []

  - method: GET
    path: "/salt/depots"
    description: "List depots by market state or storm posture."
    roles: [MinePlanner, GroundControlEngineer, QualityLab, LogisticsPlanner, ContractAdministrator, ComplianceOfficer, DepotManager]
    code: 200
    input: ["state_code?", "depot_state?"]
    output: Depot[]
    side_effects: []

  - method: GET
    path: "/salt/depots/{id}/storage-posture"
    description: "Computed read: covered vs open-pad occupancy, utilization and the auto-SURGE threshold the depot is measured against."
    roles: [LogisticsPlanner, DepotManager, ContractAdministrator]
    code: 200
    input: []
    output:
      depot_state: string
      covered_capacity_tons: number
      covered_stored_tons: number
      open_pad_capacity_tons: number
      open_pad_stored_tons: number
      covered_utilization_pct: number
      auto_surge_threshold_pct: number
      reserved_tons: number
    side_effects: []

  - method: PATCH
    path: "/salt/depots/{id}"
    description: "Adjust depot capacities and rates. The acting DepotManager must be the depot itself."
    roles: [LogisticsPlanner, DepotManager]
    code: 200
    input: ["covered_capacity_tons?", "open_pad_capacity_tons?", "loadout_rate_tons_per_hour?", "outbound_freight_rate_per_ton?"]
    output: Depot
    side_effects: ["recomputes covered_utilization_pct", "re-evaluates the auto-SURGE threshold: shrinking covered_capacity_tons can move the depot OPEN -> SURGE", "increments Depot.version by 1"]

  - method: POST
    path: "/salt/depots/{id}/posture"
    description: "Set storm posture explicitly: OPEN, SURGE (storm operations, eligible only for STORM_EMERGENCY orders' waterfall) or CLOSED (no intake, no loadout, invisible to every waterfall)."
    roles: [DepotManager, LogisticsPlanner]
    code: 200
    input: [depot_state, "reason?"]
    output: Depot
    side_effects: ["depot_state set, storm_state_set_by_user_id = X-User-ID", "CLOSED removes every lot at this depot from all future allocation candidate pools without touching existing RESERVED allocations", "increments Depot.version by 1"]

  # -------------------------------------------------------------- StockpileLot
  - method: GET
    path: "/salt/stockpile-lots/{id}"
    description: "Read one stockpile lot with its three-way tonnage split."
    roles: [MinePlanner, GroundControlEngineer, QualityLab, LogisticsPlanner, ContractAdministrator, ComplianceOfficer, DepotManager]
    code: 200
    input: []
    output: StockpileLot
    side_effects: []

  - method: GET
    path: "/salt/stockpile-lots"
    description: "List stockpile lots; the depot_id and treatment_batch_id filters are the reverse-reachability paths from Depot and TreatmentBatch to StockpileLot, and the only way to discover a lot minted by a QC PASS or a shipment receipt. Ordered created_at ASC."
    roles: [MinePlanner, GroundControlEngineer, QualityLab, LogisticsPlanner, ContractAdministrator, ComplianceOfficer, DepotManager]
    code: 200
    input: ["depot_id?", "treatment_batch_id?", "product_line?", "lot_state?"]
    output: StockpileLot[]
    side_effects: []

  - method: POST
    path: "/salt/stockpile-lots/{id}/quarantine-state"
    description: "Quality lab or depot quarantines a lot (AVAILABLE -> QUARANTINED) or clears it (QUARANTINED -> AVAILABLE). A quarantined lot is invisible to every waterfall and refuses manual reservations."
    roles: [QualityLab, DepotManager]
    code: 200
    input: [quarantine, "quarantine_reason?"]
    output: StockpileLot
    side_effects: ["lot_state = QUARANTINED (quarantine == true) or AVAILABLE (quarantine == false); quarantine_reason stored or cleared", "tons_on_hand, tons_reserved and tons_available are NOT changed — quarantine hides tonnage from allocation without moving it", "increments StockpileLot.version by 1"]

  # ------------------------------------------------------------------ Shipment
  - method: POST
    path: "/salt/shipments"
    description: "Plan a rail, barge or truck movement out of one depot's single loadout bay into another depot, subject to the buffered bay-exclusivity check."
    roles: [LogisticsPlanner, DepotManager]
    code: 201
    input: [stockpile_lot_id, origin_depot_id, destination_depot_id, mode, tons, load_window_start, load_window_end, destination_storage_kind]
    output: Shipment
    side_effects: ["computes required_gap_minutes from mode (RAIL 45, BARGE 20, TRUCK 0)", "runs calculations.depot_loadout_bay_conflict against the origin depot's PLANNED and LOADED shipments", "status = PLANNED; no tonnage moves yet", "version = 1"]

  - method: GET
    path: "/salt/shipments/{id}"
    description: "Read one shipment with its bay window and buffer."
    roles: [MinePlanner, GroundControlEngineer, QualityLab, LogisticsPlanner, ContractAdministrator, ComplianceOfficer, DepotManager]
    code: 200
    input: []
    output: Shipment
    side_effects: []

  - method: GET
    path: "/salt/shipments"
    description: "List shipments; the stockpile_lot_id, origin_depot_id and destination_depot_id filters are the reverse-reachability paths from StockpileLot and Depot to Shipment."
    roles: [MinePlanner, GroundControlEngineer, QualityLab, LogisticsPlanner, ContractAdministrator, ComplianceOfficer, DepotManager]
    code: 200
    input: ["stockpile_lot_id?", "origin_depot_id?", "destination_depot_id?", "status?", "mode?"]
    output: Shipment[]
    side_effects: []

  - method: POST
    path: "/salt/shipments/{id}/load"
    description: "Load the movement out of the origin bay: PLANNED -> LOADED."
    roles: [DepotManager, LogisticsPlanner]
    code: 200
    input: []
    output: Shipment
    side_effects: ["status = LOADED", "subtracts tons from the origin lot's tons_on_hand and tons_available; a lot drained to tons_on_hand == 0 moves AVAILABLE -> DEPLETED", "subtracts tons from the origin depot's covered_stored_tons or open_pad_stored_tons per the lot's storage_kind and recomputes covered_utilization_pct", "releases the origin bay window for later shipments", "increments StockpileLot.version by 1 and Depot.version by 1", "increments Shipment.version by 1"]

  - method: POST
    path: "/salt/shipments/{id}/receive"
    description: "Receive the movement at the destination depot: LOADED -> RECEIVED. Mints a new StockpileLot at the destination carrying the same product_line and purity."
    roles: [DepotManager, LogisticsPlanner]
    code: 200
    input: []
    output: Shipment
    side_effects: ["status = RECEIVED", "creates a StockpileLot at destination_depot_id with tons_on_hand = tons_available = tons, tons_reserved = 0, lot_state = AVAILABLE, storage_kind = destination_storage_kind, product_line and purity_pct_nacl copied from the origin lot, treatment_batch_id copied from the origin lot; received_lot_id records it (discoverable via GET /salt/stockpile-lots?depot_id=...)", "adds tons to the destination depot's covered_stored_tons or open_pad_stored_tons, recomputes covered_utilization_pct and auto-moves it OPEN -> SURGE at the 90% covered threshold", "increments Depot.version by 1", "increments Shipment.version by 1"]

  - method: POST
    path: "/salt/shipments/{id}/cancel"
    description: "Cancel a planned or loaded movement: PLANNED or LOADED -> CANCELLED (terminal). Cancelling a LOADED shipment returns the tons to the origin lot."
    roles: [LogisticsPlanner, DepotManager]
    code: 200
    input: ["reason?"]
    output: Shipment
    side_effects: ["status = CANCELLED", "from LOADED: adds tons back to the origin lot's tons_on_hand and tons_available, restores the origin depot's stored tonnage, and returns a DEPLETED lot to AVAILABLE; from PLANNED: no tonnage moves", "frees the origin bay window", "increments StockpileLot.version by 1 and Depot.version by 1 when tonnage moved", "increments Shipment.version by 1"]

  # ------------------------------------------------------------ SeasonForecast
  - method: POST
    path: "/salt/season-forecasts"
    description: "Publish a season/region demand outlook. BOTH pre-season targets are computed and stored; `method` selects which one binds."
    roles: [ContractAdministrator, LogisticsPlanner]
    code: 201
    input: [season_code, region_code, normal_season_tons, severity_index, prior_season_1_actual_tons, prior_season_2_actual_tons, prior_season_3_actual_tons, method, preseason_lock_date]
    output: SeasonForecast
    side_effects: ["computes target_tons_severity_weighted, target_tons_trailing_baseline, binding_target_tons and variant_spread_tons via calculations.preseason_stockpile_target", "version = 1"]

  - method: GET
    path: "/salt/season-forecasts/{id}"
    description: "Read one forecast with both variant targets and their spread."
    roles: [MinePlanner, GroundControlEngineer, QualityLab, LogisticsPlanner, ContractAdministrator, ComplianceOfficer, DepotManager]
    code: 200
    input: []
    output: SeasonForecast
    side_effects: []

  - method: GET
    path: "/salt/season-forecasts"
    description: "List forecasts by season, region or method."
    roles: [MinePlanner, GroundControlEngineer, QualityLab, LogisticsPlanner, ContractAdministrator, ComplianceOfficer, DepotManager]
    code: 200
    input: ["season_code?", "region_code?", "method?"]
    output: SeasonForecast[]
    side_effects: []

  - method: PATCH
    path: "/salt/season-forecasts/{id}"
    description: "Revise winter severity, switch the binding method, or move the pre-season lock date. Both variants are always recomputed so the switch is observable as a reconciliation delta."
    roles: [ContractAdministrator]
    code: 200
    input: ["severity_index?", "method?", "preseason_lock_date?"]
    output: SeasonForecast
    side_effects: ["recomputes target_tons_severity_weighted, target_tons_trailing_baseline, binding_target_tons and variant_spread_tons", "increments SeasonForecast.version by 1"]

  # ---------------------------------------------------------------- BidContract
  - method: POST
    path: "/salt/bid-contracts"
    description: "Draft a municipal, county or state deicing bid with a tonnage commitment, a price guarantee and failure-to-supply terms."
    roles: [ContractAdministrator]
    code: 201
    input: [season_forecast_id, customer_name, jurisdiction_level, state_code, product_line, committed_tons, guaranteed_price_per_ton, min_take_pct, max_take_pct, failure_to_supply_penalty_per_ton, price_guarantee_cap_pct]
    output: BidContract
    side_effects: ["status = DRAFT", "computes contract_value_usd = round(committed_tons * guaranteed_price_per_ton, 2)", "fulfilled_tons = 0, open_committed_tons = committed_tons, take_pct = 0, penalty_accrued_usd = 0, supply_reliability_score = 100, breach_watch = false", "version = 1"]

  - method: GET
    path: "/salt/bid-contracts/{id}"
    description: "Read one contract with its live fulfillment and penalty ledger."
    roles: [MinePlanner, GroundControlEngineer, QualityLab, LogisticsPlanner, ContractAdministrator, ComplianceOfficer, DepotManager]
    code: 200
    input: []
    output: BidContract
    side_effects: ["recomputes the read-time ledger fields of calculations.contract_fulfillment_ledger without mutating version"]

  - method: GET
    path: "/salt/bid-contracts"
    description: "List contracts; the season_forecast_id filter is the reverse-reachability path from SeasonForecast to BidContract."
    roles: [MinePlanner, GroundControlEngineer, QualityLab, LogisticsPlanner, ContractAdministrator, ComplianceOfficer, DepotManager]
    code: 200
    input: ["season_forecast_id?", "status?", "product_line?", "state_code?", "jurisdiction_level?"]
    output: BidContract[]
    side_effects: []

  - method: GET
    path: "/salt/bid-contracts/{id}/ledger"
    description: "Computed read: the contract's fulfillment ledger, take-band consumption, penalty accrual and pre-season coverage as evaluated right now."
    roles: [ContractAdministrator, ComplianceOfficer, LogisticsPlanner]
    code: 200
    input: []
    output:
      committed_tons: number
      fulfilled_tons: number
      open_committed_tons: number
      take_pct: number
      take_band_consumed_tons: number
      take_band_limit_tons: number
      penalty_accrued_usd: number
      accrued_penalty_order_count: integer
      supply_reliability_score: number
      breach_watch: boolean
      preseason_coverage_tons: number
      preseason_coverage_required_tons: number
    side_effects: []

  - method: POST
    path: "/salt/bid-contracts/{id}/submit"
    description: "Submit the drafted bid to the awarding jurisdiction: DRAFT -> SUBMITTED."
    roles: [ContractAdministrator]
    code: 200
    input: []
    output: BidContract
    side_effects: ["status = SUBMITTED, submitted_by_user_id = X-User-ID", "increments BidContract.version by 1"]

  - method: POST
    path: "/salt/bid-contracts/{id}/decision"
    description: "Record the jurisdiction's decision: outcome AWARD -> AWARDED, outcome LOSE -> LOST (terminal)."
    roles: [ContractAdministrator]
    code: 200
    input: [outcome, "note?"]
    output: BidContract
    side_effects: ["status = AWARDED or LOST, decided_by_user_id = X-User-ID", "increments BidContract.version by 1"]

  - method: POST
    path: "/salt/bid-contracts/{id}/activate"
    description: "Activate an awarded contract for the season: AWARDED -> ACTIVE. Refused after the forecast's preseason_lock_date, and refused when pre-season coverage in the contract's own market state is below the min-take floor."
    roles: [ContractAdministrator]
    code: 200
    input: []
    output: BidContract
    side_effects: ["evaluates the pre-season window against the logical clock, then the coverage floor from calculations.contract_fulfillment_ledger", "status = ACTIVE", "increments BidContract.version by 1"]

  - method: POST
    path: "/salt/bid-contracts/{id}/close-season"
    description: "Close the season on an active contract: computes the SEASON_AGGREGATE penalty variant, reconciles it against the per-event ledger, and lands the contract in CLOSED or, when delivered tonnage fell below the min-take floor, FORFEITED (both terminal)."
    roles: [ContractAdministrator]
    code: 200
    input: ["note?"]
    output: BidContract
    side_effects: ["computes season_penalty_usd via the SEASON_AGGREGATE variant of calculations.shortfall_penalty and penalty_reconciliation_delta_usd = season_penalty_usd - penalty_accrued_usd", "status = FORFEITED when fulfilled_tons < committed_tons * min_take_pct / 100, else CLOSED", "FORFEITED additionally applies the 25-point forfeit haircut in calculations.supply_reliability_score", "every DeliveryOrder on this contract still in REQUESTED moves to nothing — REQUESTED orders are left untouched and simply never allocated", "increments BidContract.version by 1"]

  # -------------------------------------------------------------- DeliveryOrder
  - method: POST
    path: "/salt/delivery-orders"
    description: "Place a tonnage release against an active contract, ROUTINE or STORM_EMERGENCY, naming the depot the customer prefers to load from."
    roles: [ContractAdministrator, LogisticsPlanner]
    code: 201
    input: [bid_contract_id, depot_id, requested_tons, required_by, market_index_price_per_ton, "storm_priority?", expected_bid_contract_version]
    output: DeliveryOrder
    side_effects: ["OCC: expected_bid_contract_version must equal BidContract.version or ERR_STALE_BID_CONTRACT_VERSION (412)", "status = REQUESTED, penalty_state = NONE, allocated_tons = 0, shorted_tons = 0, shortfall_penalty_usd = 0", "consumes take-band headroom per calculations.contract_fulfillment_ledger", "increments BidContract.version by 1", "version = 1"]

  - method: GET
    path: "/salt/delivery-orders/{id}"
    description: "Read one delivery order with its allocation outcome, penalty state and invoice figures."
    roles: [MinePlanner, GroundControlEngineer, QualityLab, LogisticsPlanner, ContractAdministrator, ComplianceOfficer, DepotManager]
    code: 200
    input: []
    output: DeliveryOrder
    side_effects: []

  - method: GET
    path: "/salt/delivery-orders"
    description: "List delivery orders; the bid_contract_id and depot_id filters are the reverse-reachability paths from BidContract and Depot to DeliveryOrder."
    roles: [MinePlanner, GroundControlEngineer, QualityLab, LogisticsPlanner, ContractAdministrator, ComplianceOfficer, DepotManager]
    code: 200
    input: ["bid_contract_id?", "depot_id?", "status?", "penalty_state?", "storm_priority?"]
    output: DeliveryOrder[]
    side_effects: []

  - method: POST
    path: "/salt/delivery-orders/{id}/allocate"
    description: "Run the storm-aware waterfall over eligible stockpile lots: REQUESTED -> ALLOCATED on a full fill, REQUESTED -> SHORTED on a partial fill, and a 409 with no writes when the candidate pool is empty."
    roles: [LogisticsPlanner]
    code: 200
    input: []
    output: DeliveryOrder
    side_effects: ["creates one RESERVED Allocation per drawn lot with origin = WATERFALL and ascending rank_position, per calculations.storm_allocation_waterfall (discoverable via GET /salt/allocations?delivery_order_id=...)", "moves tonnage from tons_available to tons_reserved on each drawn lot and increments each lot's version by 1", "allocated_tons and shorted_tons set; status = ALLOCATED or SHORTED", "on a short: penalty_state = ACCRUED, shortfall_penalty_usd computed by the PER_EVENT variant of calculations.shortfall_penalty, then BidContract.penalty_accrued_usd, supply_reliability_score and breach_watch are recomputed and BidContract.version increments by 1", "increments DeliveryOrder.version by 1"]

  - method: POST
    path: "/salt/delivery-orders/{id}/release-allocations"
    description: "Compensating action: release every RESERVED allocation on the order, returning the tonnage to its lots and reverting the order to REQUESTED."
    roles: [LogisticsPlanner]
    code: 200
    input: ["reason?"]
    output: DeliveryOrder
    side_effects: ["every RESERVED Allocation on the order moves to RELEASED", "each lot's tons_reserved decreases and tons_available increases by exactly the released tons, restoring the pre-allocation values with zero drift per calculations.lot_tonnage_conservation, and each lot's version increments by 1", "status = REQUESTED, allocated_tons = 0, shorted_tons = 0", "a SHORTED order's penalty_state returns to NONE, shortfall_penalty_usd returns to 0, and the contract's penalty_accrued_usd, supply_reliability_score and breach_watch are recomputed with BidContract.version incremented by 1", "increments DeliveryOrder.version by 1"]

  - method: POST
    path: "/salt/delivery-orders/{id}/deliver"
    description: "Deliver the order and invoice it: ALLOCATED or SHORTED -> DELIVERED (terminal). Consumes the reserved tonnage and prices the load line by line."
    roles: [LogisticsPlanner]
    code: 200
    input: []
    output: DeliveryOrder
    side_effects: ["every RESERVED Allocation on the order moves to CONSUMED", "each source lot's tons_reserved and tons_on_hand decrease by the allocation tons while tons_available is unchanged; a lot drained to 0 moves to DEPLETED; each lot's version increments by 1", "each source depot's stored tonnage and covered_utilization_pct are recomputed and Depot.version increments by 1", "computes product_subtotal_usd, freight_subtotal_usd, storm_surcharge_usd, guarantee_credit_usd and invoice_total_usd via calculations.delivery_invoice_amount", "status = DELIVERED, delivered_at = logical clock", "adds allocated_tons to BidContract.fulfilled_tons and recomputes open_committed_tons and take_pct, incrementing BidContract.version by 1", "increments DeliveryOrder.version by 1"]

  - method: POST
    path: "/salt/delivery-orders/{id}/waive-penalty"
    description: "Compliance waives an accrued failure-to-supply penalty on a shorted order, un-accruing it from the contract ledger while keeping the amount on the order for audit."
    roles: [ComplianceOfficer, ContractAdministrator]
    code: 200
    input: [waiver_reason]
    output: DeliveryOrder
    side_effects: ["penalty_state = WAIVED; shortfall_penalty_usd is retained unchanged as the audit amount", "subtracts the waived amount from BidContract.penalty_accrued_usd, recomputes breach_watch and supply_reliability_score from the remaining ACCRUED set per calculations.penalty_ledger_conservation, and increments BidContract.version by 1", "the order's status (SHORTED) is unchanged — waiving money does not re-fill tonnage", "increments DeliveryOrder.version by 1"]

  # ---------------------------------------------------------------- Allocation
  - method: POST
    path: "/salt/allocations"
    description: "Manually reserve tonnage from a named lot for a delivery order, bypassing the waterfall's ranking but not its eligibility rules."
    roles: [LogisticsPlanner]
    code: 201
    input: [delivery_order_id, stockpile_lot_id, tons, expected_stockpile_lot_version]
    output: Allocation
    side_effects: ["OCC: expected_stockpile_lot_version must equal StockpileLot.version or ERR_STALE_STOCKPILE_LOT_VERSION (412)", "state = RESERVED, origin = MANUAL, rank_position = 1", "moves tons from the lot's tons_available to tons_reserved, preserving calculations.lot_tonnage_conservation, and increments StockpileLot.version by 1", "adds tons to the order's allocated_tons; the order moves REQUESTED -> ALLOCATED once allocated_tons == requested_tons and stays REQUESTED while short", "version = 1"]

  - method: GET
    path: "/salt/allocations/{id}"
    description: "Read one allocation line."
    roles: [MinePlanner, GroundControlEngineer, QualityLab, LogisticsPlanner, ContractAdministrator, ComplianceOfficer, DepotManager]
    code: 200
    input: []
    output: Allocation
    side_effects: []

  - method: GET
    path: "/salt/allocations"
    description: "List allocation lines; the delivery_order_id and stockpile_lot_id filters are the reverse-reachability paths from DeliveryOrder and StockpileLot to Allocation, and the only way to discover waterfall-created lines. Ordered created_at ASC."
    roles: [MinePlanner, GroundControlEngineer, QualityLab, LogisticsPlanner, ContractAdministrator, ComplianceOfficer, DepotManager]
    code: 200
    input: ["delivery_order_id?", "stockpile_lot_id?", "state?", "origin?"]
    output: Allocation[]
    side_effects: []

  - method: POST
    path: "/salt/allocations/{id}/release"
    description: "Release a single RESERVED allocation line, returning its tonnage to the lot."
    roles: [LogisticsPlanner]
    code: 200
    input: ["reason?"]
    output: Allocation
    side_effects: ["state = RELEASED", "the lot's tons_reserved decreases and tons_available increases by exactly tons, with zero drift, and StockpileLot.version increments by 1", "subtracts tons from the order's allocated_tons; an ALLOCATED order with any released line returns to REQUESTED", "increments Allocation.version by 1"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # ---- auth / identity
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, empty, or X-User-Role not one of the seven declared roles"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the acting role is not listed in the called endpoint's roles"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the X-User-ID deciding QC equals the X-User-ID that created the batch, or the X-User-ID issuing a compliance action equals the inspector_user_id of the inspection cited as evidence"
  - id: ERR_DEPOT_NOT_OWNED
    http: 403
    condition: "acting role is DepotManager and X-User-ID is not the id of the Depot the request touches"

  # ---- request shape
  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "a required input is missing or null, an enum value is outside its declared set, a numeric value is negative or outside its declared range, min_take_pct exceeds max_take_pct, or a window's start is not strictly before its end"

  # ---- existence
  - id: ERR_MINE_NOT_FOUND
    http: 404
    condition: "no Mine with the given id (path segment or mine_id reference)"
  - id: ERR_PANEL_NOT_FOUND
    http: 404
    condition: "no Panel with the given id (path segment or panel_id reference)"
  - id: ERR_INSPECTION_NOT_FOUND
    http: 404
    condition: "no GroundControlInspection with the given id (path segment or inspection_id reference on a compliance action)"
  - id: ERR_RUN_NOT_FOUND
    http: 404
    condition: "no ProductionRun with the given id (path segment or production_run_id reference)"
  - id: ERR_BATCH_NOT_FOUND
    http: 404
    condition: "no TreatmentBatch with the given id (path segment or treatment_batch_id reference)"
  - id: ERR_DEPOT_NOT_FOUND
    http: 404
    condition: "no Depot with the given id (path segment or depot_id / origin_depot_id / destination_depot_id reference)"
  - id: ERR_LOT_NOT_FOUND
    http: 404
    condition: "no StockpileLot with the given id (path segment or stockpile_lot_id reference)"
  - id: ERR_SHIPMENT_NOT_FOUND
    http: 404
    condition: "no Shipment with the given id"
  - id: ERR_FORECAST_NOT_FOUND
    http: 404
    condition: "no SeasonForecast with the given id (path segment or season_forecast_id reference)"
  - id: ERR_CONTRACT_NOT_FOUND
    http: 404
    condition: "no BidContract with the given id (path segment or bid_contract_id reference)"
  - id: ERR_ORDER_NOT_FOUND
    http: 404
    condition: "no DeliveryOrder with the given id (path segment or delivery_order_id reference)"
  - id: ERR_ALLOCATION_NOT_FOUND
    http: 404
    condition: "no Allocation with the given id"

  # ---- optimistic concurrency (§1.2.1)
  - id: ERR_STALE_MINE_VERSION
    http: 412
    condition: "expected_mine_version on POST /salt/production-runs does not equal the Mine's current version — a cascade or another write advanced it"
  - id: ERR_STALE_BID_CONTRACT_VERSION
    http: 412
    condition: "expected_bid_contract_version on POST /salt/delivery-orders does not equal the BidContract's current version"
  - id: ERR_STALE_STOCKPILE_LOT_VERSION
    http: 412
    condition: "expected_stockpile_lot_version on POST /salt/allocations does not equal the StockpileLot's current version"

  # ---- state preconditions
  - id: ERR_CONTRACT_INVALID_STATE
    http: 409
    condition: "the BidContract is not in the state the operation requires (submit needs DRAFT, decision needs SUBMITTED, activate needs AWARDED, close-season and delivery-order creation need ACTIVE)"
  - id: ERR_ORDER_INVALID_STATE
    http: 409
    condition: "the DeliveryOrder is not in the state the operation requires (allocate needs REQUESTED, release-allocations / deliver need ALLOCATED or SHORTED, waive-penalty needs SHORTED)"
  - id: ERR_PANEL_INVALID_STATE
    http: 409
    condition: "the Panel is not in the state the operation requires (develop needs PLANNED, start-production needs DEVELOPED or SUSPENDED, suspend needs PRODUCING, deplete needs PRODUCING or SUSPENDED, run creation needs PRODUCING, and DEPLETED / ABANDONED are terminal)"
  - id: ERR_RUN_INVALID_STATE
    http: 409
    condition: "the ProductionRun is not in the state the operation requires (hoist needs SCHEDULED, close needs HOISTED, reinstate needs HELD, batch creation needs HOISTED or CLOSED, and VOIDED is terminal)"
  - id: ERR_SHIPMENT_INVALID_STATE
    http: 409
    condition: "the Shipment is not in the state the operation requires (load needs PLANNED, receive needs LOADED, cancel needs PLANNED or LOADED, and RECEIVED / CANCELLED are terminal)"
  - id: ERR_BATCH_QC_ALREADY_DECIDED
    http: 409
    condition: "a qc-decision was submitted for a TreatmentBatch whose qc_state is already PASSED or FAILED, including a repeat of the identical decision"
  - id: ERR_REWORK_LIMIT_EXCEEDED
    http: 409
    condition: "a REWORK qc-decision was submitted when rework_count is already 2"
  - id: ERR_ALLOCATION_NOT_RESERVED
    http: 409
    condition: "an Allocation being released is CONSUMED or already RELEASED"
  - id: ERR_LOT_QUARANTINED
    http: 409
    condition: "the StockpileLot being reserved from or shipped is QUARANTINED"
  - id: ERR_LOT_STATE_INVALID
    http: 409
    condition: "a quarantine-state change targets a lot that is neither AVAILABLE (to quarantine) nor QUARANTINED (to clear) — i.e. a DEPLETED lot, or clearing a lot that is already AVAILABLE"
  - id: ERR_DEPOT_CLOSED
    http: 409
    condition: "the Depot involved is CLOSED: no batch intake, no lot minting, no shipment, no manual allocation and no new delivery order against it"
  - id: ERR_PENALTY_NOT_ACCRUED
    http: 409
    condition: "waive-penalty was called on an order whose penalty_state is NONE or already WAIVED"

  # ---- safety, compliance and product quality
  - id: ERR_MINE_WITHDRAWAL_ORDER_ACTIVE
    http: 409
    condition: "the Mine's compliance_state is WITHDRAWAL_ORDER and the request would schedule, reinstate or hoist production, or bring a panel into production"
  - id: ERR_HOIST_UNAVAILABLE
    http: 409
    condition: "the Mine's hoist_state is HOIST_DOWN and the request would schedule, reinstate or hoist a run"
  - id: ERR_GROUND_CONTROL_DEFECT_OPEN
    http: 409
    condition: "the Panel's open_defect is true and the request would return it to production or schedule/reinstate a run on it"
  - id: ERR_SCREEN_SPEC_NOT_ALLOWED
    http: 422
    condition: "the requested screen_spec is not permitted for the requested product_line"
  - id: ERR_ADDITIVE_DOSE_OUT_OF_SPEC
    http: 422
    condition: "anticaking_ppm or corrosion_inhibitor_pct falls outside the product line's inclusive dosing window"
  - id: ERR_PURITY_BELOW_SPEC
    http: 409
    condition: "a PASS qc-decision was attempted on a batch whose computed purity_pct_nacl is below the product line's min_purity_pct"
  - id: ERR_UNCOVERED_STORAGE_NOT_ALLOWED
    http: 409
    condition: "a WATER_CONDITIONING or FOOD_GRADE batch, lot or shipment destination would sit on OPEN_PAD storage"

  # ---- referential and temporal
  - id: ERR_PRODUCT_LINE_MISMATCH
    http: 409
    condition: "a manual Allocation's lot product_line differs from the contract's product_line, the lot depot's state_code differs from the contract's state_code, or a Shipment's destination_storage_kind differs from the lot's storage_kind"
  - id: ERR_PRESEASON_WINDOW_CLOSED
    http: 409
    condition: "activation was attempted strictly after the forecast's preseason_lock_date on the logical clock"

  # ---- capacity, constraint and fiscal
  - id: ERR_HOIST_CAPACITY_EXCEEDED
    http: 409
    condition: "the peak sum of concurrent planned_tons_per_hour across the mine's SCHEDULED runs would exceed effective_hoist_tons_per_day / 24 (equality is allowed)"
  - id: ERR_LOADOUT_BAY_CONFLICT
    http: 409
    condition: "the requested load window, expanded by the larger of the two shipments' mode buffers, touches or overlaps a PLANNED or LOADED shipment at the same origin depot"
  - id: ERR_PANEL_RESERVE_EXCEEDED
    http: 409
    condition: "committed planned_tons across the panel's SCHEDULED, HELD, HOISTED and CLOSED runs plus the new run would exceed Panel.recoverable_tons"
  - id: ERR_COVERED_CAPACITY_EXCEEDED
    http: 409
    condition: "landing the tonnage would push the depot's covered_stored_tons above covered_capacity_tons (or open_pad_stored_tons above open_pad_capacity_tons)"
  - id: ERR_INSUFFICIENT_LOT_TONS
    http: 409
    condition: "a manual reservation or shipment asks for more than the lot's tons_available"
  - id: ERR_NO_ELIGIBLE_STOCKPILE
    http: 409
    condition: "the allocation waterfall's candidate pool is empty — no AVAILABLE lot of the contract's product_line with positive tons_available sits at an eligible depot in the contract's state_code"
  - id: ERR_TAKE_BAND_EXCEEDED
    http: 409
    condition: "take_band_consumed_tons plus the new requested_tons would exceed committed_tons * max_take_pct / 100"
  - id: ERR_PRESEASON_COVERAGE_SHORT
    http: 409
    condition: "at activation, preseason_coverage_tons is below committed_tons * min_take_pct / 100"

# =============================================================================
# §1.7 RBAC Matrix — segregation_of_duties role model
# =============================================================================
roles:
  - name: MinePlanner
    description: "Plans room-and-pillar development and the hoisting schedule; owns Mine and Panel geometry and ProductionRun lifecycle."
    identity: "opaque"
    exclusive_operations:
      - "POST /salt/mines"
      - "POST /salt/mines/{id}/hoist-status"
      - "POST /salt/panels"
      - "POST /salt/panels/{id}/develop"
      - "POST /salt/panels/{id}/start-production"
      - "POST /salt/panels/{id}/deplete"
      - "POST /salt/production-runs"
      - "POST /salt/production-runs/{id}/hoist"
      - "POST /salt/production-runs/{id}/close"
      - "POST /salt/production-runs/{id}/reinstate"
    shared_operations:
      - "POST /salt/panels/{id}/abandon (shared with ComplianceOfficer)"
      - "POST /_clock/set_current_utc (shared with all roles)"
      - "GET /salt/mines/{id}/hoist-capacity (shared with GroundControlEngineer, LogisticsPlanner, ComplianceOfficer)"
      - "all entity GET reads"

  - name: GroundControlEngineer
    description: "Runs the ground control program: records roof and convergence inspections, suspends unsafe panels and signs off remediation."
    identity: "opaque"
    exclusive_operations:
      - "POST /salt/ground-control-inspections"
      - "POST /salt/panels/{id}/remediate-defect"
    shared_operations:
      - "POST /salt/panels/{id}/suspend (shared with ComplianceOfficer)"
      - "POST /_clock/set_current_utc (shared with all roles)"
      - "GET /salt/mines/{id}/hoist-capacity (shared with MinePlanner, LogisticsPlanner, ComplianceOfficer)"
      - "all entity GET reads"

  - name: QualityLab
    description: "Screens and treats ore into product lines, doses additives and adjudicates batch QC. Cannot decide QC on a batch it created (segregation of duties)."
    identity: "opaque"
    exclusive_operations:
      - "POST /salt/treatment-batches"
      - "POST /salt/treatment-batches/{id}/qc-decision"
    shared_operations:
      - "POST /salt/stockpile-lots/{id}/quarantine-state (shared with DepotManager)"
      - "POST /_clock/set_current_utc (shared with all roles)"
      - "all entity GET reads"

  - name: LogisticsPlanner
    description: "Positions inventory across depots, plans rail/barge/truck movements and runs the allocation waterfall and invoicing."
    identity: "opaque"
    exclusive_operations:
      - "POST /salt/depots"
      - "POST /salt/delivery-orders/{id}/allocate"
      - "POST /salt/delivery-orders/{id}/release-allocations"
      - "POST /salt/delivery-orders/{id}/deliver"
      - "POST /salt/allocations"
      - "POST /salt/allocations/{id}/release"
    shared_operations:
      - "PATCH /salt/depots/{id} (shared with DepotManager)"
      - "POST /salt/depots/{id}/posture (shared with DepotManager)"
      - "POST /salt/shipments, /load, /receive, /cancel (shared with DepotManager)"
      - "POST /salt/season-forecasts (shared with ContractAdministrator)"
      - "POST /salt/delivery-orders (shared with ContractAdministrator)"
      - "GET /salt/bid-contracts/{id}/ledger, GET /salt/depots/{id}/storage-posture, GET /salt/mines/{id}/hoist-capacity"
      - "POST /_clock/set_current_utc (shared with all roles)"
      - "all entity GET reads"

  - name: ContractAdministrator
    description: "Owns the municipal and state bid lifecycle, tonnage commitments, price guarantees and season closeout."
    identity: "opaque"
    exclusive_operations:
      - "PATCH /salt/season-forecasts/{id}"
      - "POST /salt/bid-contracts"
      - "POST /salt/bid-contracts/{id}/submit"
      - "POST /salt/bid-contracts/{id}/decision"
      - "POST /salt/bid-contracts/{id}/activate"
      - "POST /salt/bid-contracts/{id}/close-season"
    shared_operations:
      - "POST /salt/season-forecasts (shared with LogisticsPlanner)"
      - "POST /salt/delivery-orders (shared with LogisticsPlanner)"
      - "POST /salt/delivery-orders/{id}/waive-penalty (shared with ComplianceOfficer)"
      - "GET /salt/bid-contracts/{id}/ledger, GET /salt/depots/{id}/storage-posture"
      - "POST /_clock/set_current_utc (shared with all roles)"
      - "all entity GET reads"

  - name: ComplianceOfficer
    description: "Records MSHA compliance actions on the mine's compliance dimension and waives failure-to-supply penalties. Cannot act on evidence it recorded itself (segregation of duties)."
    identity: "opaque"
    exclusive_operations:
      - "POST /salt/mines/{id}/compliance-action"
    shared_operations:
      - "POST /salt/panels/{id}/suspend (shared with GroundControlEngineer)"
      - "POST /salt/panels/{id}/abandon (shared with MinePlanner)"
      - "POST /salt/delivery-orders/{id}/waive-penalty (shared with ContractAdministrator)"
      - "GET /salt/bid-contracts/{id}/ledger, GET /salt/mines/{id}/hoist-capacity"
      - "POST /_clock/set_current_utc (shared with all roles)"
      - "all entity GET reads"

  - name: DepotManager
    description: "Operates a single depot: storm posture, covered and open-pad storage, loadout bay and inbound receipts. X-User-ID is that Depot's id, and every write must target its own depot."
    identity: "entity_backed:Depot"
    exclusive_operations: []
    shared_operations:
      - "PATCH /salt/depots/{id} (own depot only; shared with LogisticsPlanner)"
      - "POST /salt/depots/{id}/posture (own depot only; shared with LogisticsPlanner)"
      - "POST /salt/shipments, /load, /receive, /cancel (own depot as origin or destination; shared with LogisticsPlanner)"
      - "POST /salt/stockpile-lots/{id}/quarantine-state (lots at own depot; shared with QualityLab)"
      - "GET /salt/depots/{id}/storage-posture"
      - "POST /_clock/set_current_utc (shared with all roles)"
      - "all entity GET reads"
