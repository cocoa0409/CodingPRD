          setup:
            - "Project at design_phase DESIGN_DEVELOPMENT with one APPROVED DesignPackage, so committed_cost_cents is 3080000000 and one COMMITMENT ledger entry exists."
            - "budget_ceiling_cents lowered to 3000000000, so readiness_posture is FROZEN."
            - "A CHANGE_ORDER of 500000000 would also push committed_cost_cents to 3580000000, above the 3000000000 ceiling."
