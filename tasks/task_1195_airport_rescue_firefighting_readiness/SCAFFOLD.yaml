    path: "/arff/mutual-aid-requests/{id}/release"
    description: "Release deployed units (DEPLOYED -> RELEASED)"
    roles: [ArffChief]
    code: 200
    input: []
    output: MutualAidRequest
    side_effects: []
  - method: POST
    path: "/arff/mutual-aid-requests/{id}/decline"
    description: "Decline a request (REQUESTED -> DECLINED)"
    roles: [ArffChief]
    code: 200
    input: []
    output: MutualAidRequest
    side_effects: []

  # --- Out-of-service & downgrade notifications ---
  - method: POST
    path: "/arff/vehicles/{id}/out-of-service-events"
    description: "Open an out-of-service event for a vehicle (cascades to index recomputation)"
    roles: [ArffChief]
    code: 201
    input: [reason]
    output: OutOfServiceEvent
    side_effects: ["See ArffVehicle IN_SERVICE -> OUT_OF_SERVICE side_effects"]
  - method: POST
    path: "/arff/out-of-service-events/{id}/restore"
    description: "Restore the vehicle to service after a passing readiness recheck"
    roles: [ArffChief]
    code: 200
    input: []
    output: OutOfServiceEvent
    side_effects: ["See ArffVehicle OUT_OF_SERVICE -> IN_SERVICE side_effects"]
  - method: GET
    path: "/arff/index-downgrade-notifications"
    description: "List index downgrade notifications"
    roles: [AirportManager, ArffChief, SafetyOfficer, FaaInspector, Firefighter]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "IndexDowngradeNotification[]"
    side_effects: []
  - method: GET
    path: "/arff/index-downgrade-notifications/{id}"
    description: "Get one index downgrade notification"
    roles: [AirportManager, ArffChief, SafetyOfficer, FaaInspector, Firefighter]
    code: 200
    input: []
    output: IndexDowngradeNotification
    side_effects: []
  - method: POST
    path: "/arff/index-downgrade-notifications/{id}/acknowledge"
    description: "FAA acknowledges a downgrade notification (PENDING/OVERDUE -> ACKNOWLEDGED)"
    roles: [FaaInspector]
    code: 200
    input: []
    output: IndexDowngradeNotification
    side_effects: []

  # --- Incident reports & post-incident reviews ---
  - method: POST
    path: "/arff/incidents/{id}/reports"
    description: "Create an incident report (incident CONTROLLED or CLOSED; within 10 days of controlled_at; narrative >= 200 chars)"
    roles: [SafetyOfficer]
    code: 201
    input: [narrative, "agent_expenditure_lines?"]
    output: IncidentReport
    side_effects: ["Compute agent_expense_total_cents (round per line, then sum)"]
  - method: GET
    path: "/arff/incident-reports/{id}"
    description: "Get one incident report"
    roles: [AirportManager, ArffChief, SafetyOfficer, FaaInspector, Firefighter]
    code: 200
    input: []
    output: IncidentReport
    side_effects: []
  - method: PATCH
    path: "/arff/incident-reports/{id}"
    description: "Edit a DRAFT or RETURNED report (author only; RETURNED resets to DRAFT)"
    roles: [SafetyOfficer]
    code: 200
    input: ["narrative?", "agent_expenditure_lines?"]
    output: IncidentReport
    side_effects: ["Recompute agent_expense_total_cents"]
  - method: POST
    path: "/arff/incident-reports/{id}/submit"
    description: "Submit a report for review (DRAFT -> SUBMITTED; author only)"
    roles: [SafetyOfficer]
    code: 200
    input: []
    output: IncidentReport
    side_effects: []
  - method: POST
    path: "/arff/incident-reports/{id}/accept"
    description: "Accept a submitted report (SUBMITTED -> ACCEPTED; reviewer must not be the author)"
    roles: [AirportManager]
    code: 200
    input: []
    output: IncidentReport
    side_effects: []
  - method: POST
    path: "/arff/incident-reports/{id}/return"
    description: "Return a submitted report for revision (SUBMITTED -> RETURNED; reviewer must not be the author)"
    roles: [AirportManager]
    code: 200
    input: []
    output: IncidentReport
    side_effects: ["review_cycle_count += 1"]
  - method: POST
    path: "/arff/incident-reports/{id}/post-incident-reviews"
    description: "Open a post-incident review on an ACCEPTED report (at most one OPEN per report)"
    roles: [SafetyOfficer]
    code: 201
    input: [findings, corrective_actions_open]
    output: PostIncidentReview
    side_effects: []
  - method: GET
    path: "/arff/incident-reports/{id}/post-incident-reviews"
    description: "List post-incident reviews for a report"
    roles: [AirportManager, ArffChief, SafetyOfficer, FaaInspector, Firefighter]
    code: 200
    input: ["limit?", "offset?"]
    output: "PostIncidentReview[]"
    side_effects: []
  - method: PATCH
    path: "/arff/post-incident-reviews/{id}"
    description: "Update an OPEN review's findings or open-action count"
    roles: [SafetyOfficer]
    code: 200
    input: ["findings?", "corrective_actions_open?"]
    output: PostIncidentReview
    side_effects: []
  - method: POST
    path: "/arff/post-incident-reviews/{id}/close"
    description: "Close a review (requires corrective_actions_open == 0)"
    roles: [SafetyOfficer]
    code: 200
    input: []
    output: PostIncidentReview
    side_effects: []

  # --- FAA inspections ---
  - method: POST
    path: "/arff/faa-inspections"
    description: "Schedule the annual FAA inspection (inspection_year unique)"
    roles: [AirportManager]
    code: 201
    input: [inspection_year, scheduled_on]
    output: FaaInspection
    side_effects: []
  - method: GET
    path: "/arff/faa-inspections"
    description: "List FAA inspections"
    roles: [AirportManager, ArffChief, SafetyOfficer, FaaInspector, Firefighter]
    code: 200
    input: ["limit?", "offset?"]
    output: "FaaInspection[]"
    side_effects: []
  - method: GET
    path: "/arff/faa-inspections/{id}"
    description: "Get one FAA inspection"
    roles: [AirportManager, ArffChief, SafetyOfficer, FaaInspector, Firefighter]
    code: 200
    input: []
    output: FaaInspection
    side_effects: []
  - method: POST
    path: "/arff/faa-inspections/{id}/begin"
    description: "Begin an inspection (SCHEDULED -> IN_PROGRESS)"
    roles: [FaaInspector]
    code: 200
    input: []
    output: FaaInspection
    side_effects: []
  - method: POST
    path: "/arff/faa-inspections/{id}/issue-findings"
    description: "Record findings (IN_PROGRESS -> FINDINGS_ISSUED)"
    roles: [FaaInspector]
    code: 200
    input: [findings_count]
    output: FaaInspection
    side_effects: []
  - method: POST
    path: "/arff/faa-inspections/{id}/conclude"
    description: "Conclude an inspection (FINDINGS_ISSUED -> CLOSED_PASS | CLOSED_FAIL; PASS applies compliance gates)"
    roles: [FaaInspector]
    code: 200
    input: [outcome]
    output: FaaInspection
    side_effects: []

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or names an undeclared role" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role is not permitted for this endpoint" }
  - { id: ERR_VALIDATION_FAILED, http: 400, condition: "Required body field missing or wrong type" }
  - { id: ERR_PROFILE_NOT_FOUND, http: 404, condition: "Airport profile not yet created" }
  - { id: ERR_PROFILE_ALREADY_EXISTS, http: 409, condition: "Second POST /arff/airport-profile while the singleton exists" }
  - { id: ERR_AIRCRAFT_NOT_FOUND, http: 404, condition: "Aircraft id does not exist" }
  - { id: ERR_VEHICLE_NOT_FOUND, http: 404, condition: "Vehicle id does not exist" }
  - { id: ERR_FIREFIGHTER_NOT_FOUND, http: 404, condition: "Firefighter id does not exist" }
  - { id: ERR_DRILL_NOT_FOUND, http: 404, condition: "Response drill id does not exist" }
  - { id: ERR_INCIDENT_NOT_FOUND, http: 404, condition: "Incident id does not exist" }
  - { id: ERR_AGREEMENT_NOT_FOUND, http: 404, condition: "Mutual-aid agreement id does not exist" }
  - { id: ERR_REQUEST_NOT_FOUND, http: 404, condition: "Mutual-aid request id does not exist" }
  - { id: ERR_OOS_EVENT_NOT_FOUND, http: 404, condition: "Out-of-service event id does not exist" }
  - { id: ERR_NOTIFICATION_NOT_FOUND, http: 404, condition: "Index downgrade notification id does not exist" }
  - { id: ERR_REPORT_NOT_FOUND, http: 404, condition: "Incident report id does not exist" }
  - { id: ERR_REVIEW_NOT_FOUND, http: 404, condition: "Post-incident review id does not exist" }
  - { id: ERR_INSPECTION_NOT_FOUND, http: 404, condition: "FAA inspection id does not exist" }
  - { id: ERR_STALE_PROFILE_VERSION, http: 412, condition: "expected_profile_version does not match current AirportOpsProfile.version" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Generic state precondition failure (e.g., suspend a SUSPENDED firefighter)" }
  - { id: ERR_VEHICLE_ALREADY_OUT_OF_SERVICE, http: 409, condition: "Opening an OOS event on a vehicle already OUT_OF_SERVICE" }
  - { id: ERR_READINESS_RECHECK_REQUIRED, http: 422, condition: "Restore attempted without a PASS readiness check with checked_at >= the OOS event's started_at" }
  - { id: ERR_MEASURED_EXCEEDS_CAPACITY, http: 422, condition: "Readiness check measured quantity exceeds the vehicle's rated capacity" }
  - { id: ERR_DRILL_NOT_EXECUTABLE, http: 409, condition: "Execute/fail attempted on a drill not in the required state" }
  - { id: ERR_DRILL_NOT_CERTIFIABLE, http: 409, condition: "Certify attempted on a drill not in EXECUTED state" }
  - { id: ERR_RESPONSE_TIME_EXCEEDED, http: 422, condition: "Certify attempted while outcome is FAIL (first > 180s or all > 240s)" }
  - { id: ERR_DRILL_WINDOW_INVALID, http: 422, condition: "scheduled_start >= scheduled_end, or execute attempted before scheduled_start" }
  - { id: ERR_DRILL_WINDOW_EXPIRED, http: 422, condition: "Execute attempted after scheduled_end" }
  - { id: ERR_DRILL_WINDOW_OVERLAP, http: 409, condition: "New drill's half-open window overlaps a SCHEDULED drill on the same runway" }
  - { id: ERR_INCIDENT_NOT_OPEN, http: 409, condition: "Respond or alert-level patch attempted on an incident not in REPORTED (respond) or not in REPORTED/RESPONDING (alert-level)" }
  - { id: ERR_INCIDENT_NOT_RESPONDING, http: 409, condition: "Control attempted on a non-RESPONDING incident, or mutual-aid request on an incident not in REPORTED/RESPONDING" }
  - { id: ERR_INCIDENT_NOT_CONTROLLED, http: 409, condition: "Close attempted on a non-CONTROLLED incident" }
  - { id: ERR_OPEN_REQUESTS_EXIST, http: 409, condition: "Incident close attempted while a mutual-aid request is REQUESTED or DEPLOYED" }
  - { id: ERR_ALERT_LEVEL_NOT_ESCALATION, http: 422, condition: "Alert-level patch that does not strictly increase the level" }
  - { id: ERR_INDEX_INSUFFICIENT_FOR_ALERT, http: 422, condition: "effective_index below the alert level's required index at respond" }
  - { id: ERR_AGREEMENT_NOT_ACTIVE, http: 409, condition: "Agreement not in the required state (activate/terminate) or not ACTIVE at mutual-aid request time" }
  - { id: ERR_ALERT_LEVEL_NOT_COVERED, http: 422, condition: "Agreement max_alert_level below the incident's alert_level" }
  - { id: ERR_AGREEMENT_WINDOW_INVALID, http: 422, condition: "end_date before start_date" }
  - { id: ERR_AGREEMENT_WINDOW_OVERLAP, http: 409, condition: "Closed-interval overlap with an existing DRAFT/ACTIVE agreement for the same partner" }
