              payload: {legal_entity_id: "${le_a_id}", tax_year: 2026, destination_sales: 900000, payroll_compensation: 0, property_average_value: 0, employee_days_in_state: 0, protected_solicitation_only: false}
              as: StateAnalyst
            - call: "POST /salt/registrations/${reg_ca_id}/evaluate-nexus"
              payload: {as_of_tax_year: 2026}
              as: TaxManager
