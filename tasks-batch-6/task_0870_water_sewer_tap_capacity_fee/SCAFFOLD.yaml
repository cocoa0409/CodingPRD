    roles: [Applicant, FieldInspector, UtilityReviewer, UtilityAdmin]
    code: 200
    input: ["application_id?", "inspector_id?", "inspection_type?", "status?", "limit?", "offset?"]
    output: Inspection[]
    side_effects: []
  - method: GET
    path: "/inspections/{id}"
    description: Fetch one inspection.
    roles: [Applicant, FieldInspector, UtilityReviewer, UtilityAdmin]
    code: 200
    input: []
    output: Inspection
    side_effects: []
  - method: POST
    path: "/inspections/{id}/schedule"
