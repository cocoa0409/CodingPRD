            - "UtilizationReview.${ur_r}.turnaround_deadline_at == 2026-05-31T00:00:00.000Z"
            - "UtilizationReview.${ur_r}.retrospective == true"
            - "UtilizationReview.${ur_p}.turnaround_breached == false"

      - name: copay_exempt_encounter_waived_without_ledger_entry
        claim_type: Input Set Filtering
        grounds:
          - calculations.copay_amount
          - entities.CopayCharge.fields.status
          - calculations.inmate_account_balance
        distinguishing_aspect: "MENTAL_HEALTH is in EXEMPT_ENCOUNTER_TYPES, so the exemption test short-circuits before indigency is read: amount_cents 0, charge_variant EXEMPT, status WAIVED, no LedgerEntry appended and Inmate.version unchanged."
