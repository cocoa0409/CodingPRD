  - rule_id: resource_temporal_overlap
    rule_summary: "Two resources use deliberately different interval semantics: kiln chambers are exclusive over a CLOSED interval that includes a cooldown buffer, prefinish lines are shared over HALF-OPEN windows with an aggregate linear-foot capacity."
    instances:
      - name: chamber_closed_interval_includes_cooldown_buffer
        summary: "A charge starting exactly at another charge's blocked_until_utc (2026-08-16T07:00:00.000Z) is refused; starting one hour later is accepted."
        mechanism: "Occupancy interval [planned_start_utc, blocked_until_utc] is closed on both ends, and blocked_until_utc is planned_end_utc plus the 6 h cooldown buffer, so touching endpoints collide."
        entities_touched: [KilnCharge, KilnChamber]
        rules_referenced: [charge_occupancy_window, chamber_window_conflict_detection]
        test_recipe:
          setup: "Chamber K1 with charge A scheduled 2026-08-05T00:00:00Z for 265.0 hours: planned_end 2026-08-16T01:00:00.000Z, blocked_until 2026-08-16T07:00:00.000Z."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00.000Z" }, as: MillAdmin }
            - { call: "POST /mill/species-profiles", payload: { species_code: "RED_OAK", common_name: "Red Oak", density_class: "DENSE", tangential_shrinkage_coefficient: 0.145, target_moisture_pct: 7.0, max_moisture_gradient_pp: 2.0 }, as: MillAdmin, captures: { species_id: "$.data.id", species_v: "$.data.version" } }
