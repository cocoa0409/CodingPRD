              as: FormulationScientist
            - call: "POST /petfood/formulas/${f_id}/submit-nutrient-review"
              payload: {}
              as: FormulationScientist
            - call: "POST /petfood/formulas/${f_id}/substantiate"
              payload: {}
              as: QAApprover
            - call: "POST /petfood/formulas/${f_id}/lock"
              payload: {}
              as: QAApprover
            - call: "GET /petfood/formulas/${f_id}"
              payload: {}
              as: ProductionPlanner
              captures: { f_ver: $.data.version }
            - call: "POST /petfood/formulas/${f_id}/production-batches"
              payload: { planned_kg: 500.0, line_id: "LINE-G1", scheduled_start: "2026-08-24T08:00:00Z", expected_formula_version: "${f_ver}" }
              as: ProductionPlanner
              captures: { b1_id: $.data.id }
            - call: "POST /petfood/formulas/${f_id}/production-batches"
              payload: { planned_kg: 500.0, line_id: "LINE-G2", scheduled_start: "2026-08-24T08:00:00Z", expected_formula_version: "${f_ver} + 1" }
              as: ProductionPlanner
              captures: { b2_id: $.data.id }
            - call: "POST /petfood/production-batches/${b1_id}/release"
              payload: {}
              as: ProductionPlanner
            - call: "POST /petfood/production-batches/${b1_id}/start-run"
              payload: {}
              as: LineOperator
            - call: "POST /petfood/production-batches/${b1_id}/complete"
              payload: { actual_kg: 500.0 }
              as: LineOperator
            - call: "POST /petfood/production-batches/${b2_id}/release"
              payload: {}
              as: ProductionPlanner
            - call: "POST /petfood/production-batches/${b2_id}/start-run"
