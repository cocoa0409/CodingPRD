# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Calibration & Gage Management (task_0439) — Expert band
# 9 rule_ids × ≥2 instances = 18 instances. Every grounds[] ref resolves into
# SCAFFOLD.yaml §1.1–§1.7. Every setup_api_calls/trigger call is a structured
# object against §1.5; every ${var} is bound by an earlier captures: block.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: drift_trend_lsq_vs_endpoint_diverge
        grounds:
          - calculations.drift_trend
          - entities.CalibrationEvent.fields.max_abs_deviation
          - endpoints["GET /instruments/{id}/drift-trend"]
        distinguishing_aspect: |
          Same three finalized events on the SAME Instrument produce a different
          slope and projected_breach_epoch under LSQ (0.0025 / epoch 24) vs
          ENDPOINT (0.003 / epoch 22); the dual-variant lives on the Instrument
          drift-history domain.
        test_recipe:
          setup:
            - "One traceable standard, one ACTIVE instrument (nominal 25.0, tol ±0.05, interval 100)."
            - "Three PASSED calibration events at scheduled_epoch 5, 7, 15 with single points whose as_found deviations are 0.00, 0.02, 0.03."
          setup_api_calls:
            - call: "POST /calibration-standards"
              payload: { name: "GB-Master", nist_test_number: "NIST-1", nominal_value: 25.0, standard_unit: "mm", uncertainty: 0.001, certified_through_epoch: 9999 }
              as: Metrologist
              captures: { std_id: $.data.id }
            - call: "POST /instruments"
              payload: { asset_tag: "INST-DRIFT", description: "Drift gauge", nominal_value: 25.0, tolerance_plus: 0.05, tolerance_minus: 0.05, measurement_unit: "mm", calibration_interval_epochs: 100, criticality: "MAJOR" }
              as: QualityEngineer
              captures: { inst_id: $.data.id, inst_v: $.data.version }
            - call: "POST /instruments/${inst_id}/calibration-events"
              payload: { standard_id: "${std_id}", scheduled_epoch: 5, expected_instrument_version: "${inst_v}" }
              as: Technician
              captures: { ev1: $.data.id }
            - call: "POST /calibration-events/${ev1}/measurement-points"
              payload: { point_label: "P1", nominal: 25.0, tol_plus: 0.05, tol_minus: 0.05, as_found_value: 25.00 }
              as: Technician
            - call: "POST /calibration-events/${ev1}/start"
              payload: {}
              as: Technician
            - call: "POST /calibration-events/${ev1}/finalize"
              payload: {}
              as: Technician
            - call: "GET /instruments/${inst_id}"
              payload: {}
              as: QualityEngineer
              captures: { inst_v_a: $.data.version }
            - call: "POST /instruments/${inst_id}/calibration-events"
              payload: { standard_id: "${std_id}", scheduled_epoch: 7, expected_instrument_version: "${inst_v_a}" }
              as: Technician
              captures: { ev2: $.data.id }
            - call: "POST /calibration-events/${ev2}/measurement-points"
              payload: { point_label: "P1", nominal: 25.0, tol_plus: 0.05, tol_minus: 0.05, as_found_value: 25.02 }
              as: Technician
            - call: "POST /calibration-events/${ev2}/start"
              payload: {}
              as: Technician
            - call: "POST /calibration-events/${ev2}/finalize"
              payload: {}
              as: Technician
            - call: "GET /instruments/${inst_id}"
              payload: {}
              as: QualityEngineer
              captures: { inst_v_b: $.data.version }
            - call: "POST /instruments/${inst_id}/calibration-events"
              payload: { standard_id: "${std_id}", scheduled_epoch: 15, expected_instrument_version: "${inst_v_b}" }
              as: Technician
              captures: { ev3: $.data.id }
            - call: "POST /calibration-events/${ev3}/measurement-points"
              payload: { point_label: "P1", nominal: 25.0, tol_plus: 0.05, tol_minus: 0.05, as_found_value: 25.03 }
              as: Technician
            - call: "POST /calibration-events/${ev3}/start"
              payload: {}
              as: Technician
            - call: "POST /calibration-events/${ev3}/finalize"
              payload: {}
              as: Technician
          trigger:
            - call: "GET /instruments/${inst_id}/drift-trend?method=LSQ"
              payload: {}
              as: QualityEngineer
              captures: { slope_lsq: $.data.slope, breach_lsq: $.data.projected_breach_epoch }
            - call: "GET /instruments/${inst_id}/drift-trend?method=ENDPOINT"
              payload: {}
              as: QualityEngineer
              captures: { slope_ep: $.data.slope, breach_ep: $.data.projected_breach_epoch }
          assert:
            - "drift-trend LSQ response slope == 0.0025"
            - "drift-trend LSQ response projected_breach_epoch == 24"
            - "drift-trend ENDPOINT response slope == 0.003"
            - "drift-trend ENDPOINT response projected_breach_epoch == 22"
            - "LSQ.slope != ENDPOINT.slope on identical event data"

      - name: recall_exposure_conservative_vs_measured_diverge
        grounds:
          - calculations.recall_exposure
          - entities.AffectedProduct.fields.in_suspect_window
          - endpoints["GET /impacts/{id}/exposure"]
        distinguishing_aspect: |
          On the OutOfToleranceImpact domain (not the drift domain), the same set
          of five AffectedProduct rows yields conservative count 3 (closed window
          [10,30]) vs measured count 2 (half-open (10,30]); the boundary product
          measured at the prior good calibration epoch is the discriminator.
        test_recipe:
          setup:
            - "Instrument with a PASSED event at epoch 10 (prior good cal) then a FAILED event at epoch 30 (trigger) auto-opening an OOT impact with window [10,30]."
            - "Five affected products attached at measured_epoch 8, 10, 12, 30, 31."
          setup_api_calls:
            - call: "POST /calibration-standards"
              payload: { name: "GB-2", nist_test_number: "NIST-2", nominal_value: 25.0, standard_unit: "mm", uncertainty: 0.001, certified_through_epoch: 9999 }
              as: Metrologist
              captures: { std_id: $.data.id }
            - call: "POST /instruments"
              payload: { asset_tag: "INST-OOT", description: "OOT gauge", nominal_value: 25.0, tolerance_plus: 0.05, tolerance_minus: 0.05, measurement_unit: "mm", calibration_interval_epochs: 100, criticality: "CRITICAL" }
              as: QualityEngineer
              captures: { inst_id: $.data.id, inst_v: $.data.version }
            - call: "POST /instruments/${inst_id}/calibration-events"
              payload: { standard_id: "${std_id}", scheduled_epoch: 10, expected_instrument_version: "${inst_v}" }
              as: Technician
              captures: { ev_good: $.data.id }
            - call: "POST /calibration-events/${ev_good}/measurement-points"
              payload: { point_label: "P1", nominal: 25.0, tol_plus: 0.05, tol_minus: 0.05, as_found_value: 25.00 }
              as: Technician
            - call: "POST /calibration-events/${ev_good}/start"
              payload: {}
              as: Technician
            - call: "POST /calibration-events/${ev_good}/finalize"
              payload: {}
              as: Technician
            - call: "GET /instruments/${inst_id}"
              payload: {}
              as: QualityEngineer
              captures: { inst_v2: $.data.version }
            - call: "POST /instruments/${inst_id}/calibration-events"
              payload: { standard_id: "${std_id}", scheduled_epoch: 30, expected_instrument_version: "${inst_v2}" }
              as: Technician
              captures: { ev_bad: $.data.id }
            - call: "POST /calibration-events/${ev_bad}/measurement-points"
              payload: { point_label: "P1", nominal: 25.0, tol_plus: 0.05, tol_minus: 0.05, as_found_value: 25.20, as_left_value: 25.20 }
              as: Technician
            - call: "POST /calibration-events/${ev_bad}/start"
              payload: {}
              as: Technician
            - call: "POST /calibration-events/${ev_bad}/finalize"
              payload: {}
              as: Technician
            - call: "GET /instruments/${inst_id}/impacts"
              payload: {}
              as: QualityEngineer
              captures: { impact_id: "$.data[0].id" }
            - call: "POST /impacts/${impact_id}/affected-products"
              payload: { product_serial: "S08", measured_epoch: 8 }
              as: QualityEngineer
            - call: "POST /impacts/${impact_id}/affected-products"
              payload: { product_serial: "S10", measured_epoch: 10 }
              as: QualityEngineer
            - call: "POST /impacts/${impact_id}/affected-products"
              payload: { product_serial: "S12", measured_epoch: 12 }
              as: QualityEngineer
            - call: "POST /impacts/${impact_id}/affected-products"
              payload: { product_serial: "S30", measured_epoch: 30 }
              as: QualityEngineer
            - call: "POST /impacts/${impact_id}/affected-products"
              payload: { product_serial: "S31", measured_epoch: 31 }
              as: QualityEngineer
          trigger:
            - call: "GET /impacts/${impact_id}/exposure"
              payload: {}
              as: QualityEngineer
              captures: { cons: $.data.exposure_count }
            - call: "GET /impacts/${impact_id}/exposure?basis=MEASURED"
              payload: {}
              as: QualityEngineer
              captures: { meas: $.data.exposure_count }
          assert:
            - "exposure (default/conservative) exposure_count == 3"
            - "exposure (?basis=MEASURED) exposure_count == 2"
            - "conservative.exposure_count != measured.exposure_count"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: tur_three_input_nonlinear_branch
        grounds:
          - calculations.tur_ratio
          - entities.CalibrationEvent.fields.tur
          - entities.CalibrationEvent.fields.result
        distinguishing_aspect: |
          Mode (a): result is a non-linear branch over THREE inputs — instrument
          tolerance band, standard.uncertainty, and the point pass flags — where
          tur < MIN_TUR (4.0) forces FAIL even though every point passes
          (band 0.10, uncertainty 0.02 → tur 2.5 → FAIL despite in-tolerance reading).
        test_recipe:
          setup:
            - "Standard with uncertainty 0.02; instrument tol ±0.05 (band 0.10) → tur 2.5 < 4.0."
            - "Event with a single point reading exactly on nominal (as_found pass)."
          setup_api_calls:
            - call: "POST /calibration-standards"
              payload: { name: "GB-LowTUR", nist_test_number: "NIST-3", nominal_value: 25.0, standard_unit: "mm", uncertainty: 0.02, certified_through_epoch: 9999 }
              as: Metrologist
              captures: { std_id: $.data.id }
            - call: "POST /instruments"
              payload: { asset_tag: "INST-TUR", description: "TUR gauge", nominal_value: 25.0, tolerance_plus: 0.05, tolerance_minus: 0.05, measurement_unit: "mm", calibration_interval_epochs: 100, criticality: "MAJOR" }
              as: QualityEngineer
              captures: { inst_id: $.data.id, inst_v: $.data.version }
            - call: "POST /instruments/${inst_id}/calibration-events"
              payload: { standard_id: "${std_id}", scheduled_epoch: 5, expected_instrument_version: "${inst_v}" }
              as: Technician
              captures: { ev: $.data.id }
            - call: "POST /calibration-events/${ev}/measurement-points"
              payload: { point_label: "P1", nominal: 25.0, tol_plus: 0.05, tol_minus: 0.05, as_found_value: 25.00 }
              as: Technician
            - call: "POST /calibration-events/${ev}/start"
              payload: {}
              as: Technician
          trigger:
            - call: "POST /calibration-events/${ev}/finalize"
              payload: {}
              as: Technician
              captures: { res: $.data.result, tur: $.data.tur }
          assert:
            - "CalibrationEvent.${ev}.tur == 2.5"
            - "CalibrationEvent.${ev}.as_found_in_tolerance == true"
            - "CalibrationEvent.${ev}.result == FAIL"
            - "CalibrationEvent.${ev}.status == FAILED"

      - name: gage_rr_nested_rounding_order_pinned
        grounds:
          - calculations.gage_rr_metrics
          - entities.GageRRStudy.fields.pct_grr
          - entities.GageRRStudy.fields.acceptability
        distinguishing_aspect: |
          Mode (b): %GRR pins the rounding ORDER — full precision carried through
          EV/AV/GRR, round_half_up applied ONLY at pct_grr. A 2×2×2 matrix with
          Rbar 0.10, K1 4.56, K2 3.65, process_tolerance 10.0 yields pct_grr 32.27
          (UNACCEPTABLE); rounding EV/AV early would shift the cents.
        test_recipe:
          setup:
            - "ACTIVE instrument; gage R&R study operator=2 part=2 trial=2 process_tolerance=10.0; full 8-cell trial matrix."
          setup_api_calls:
            - call: "POST /instruments"
              payload: { asset_tag: "INST-GRR", description: "GRR gauge", nominal_value: 5.0, tolerance_plus: 1.0, tolerance_minus: 1.0, measurement_unit: "mm", calibration_interval_epochs: 100, criticality: "MAJOR" }
              as: QualityEngineer
              captures: { inst_id: $.data.id, inst_v: $.data.version }
            - call: "POST /instruments/${inst_id}/gage-rr-studies"
              payload: { operator_count: 2, part_count: 2, trial_count: 2, process_tolerance: 10.0, expected_instrument_version: "${inst_v}" }
              as: QualityEngineer
              captures: { study_id: $.data.id }
            - call: "POST /gage-rr-studies/${study_id}/open"
              payload: {}
              as: QualityEngineer
            - call: "POST /gage-rr-studies/${study_id}/trials"
              payload: { operator_index: 1, part_index: 1, trial_index: 1, measured_value: 2.0 }
              as: Technician
            - call: "POST /gage-rr-studies/${study_id}/trials"
              payload: { operator_index: 1, part_index: 1, trial_index: 2, measured_value: 2.1 }
              as: Technician
            - call: "POST /gage-rr-studies/${study_id}/trials"
              payload: { operator_index: 1, part_index: 2, trial_index: 1, measured_value: 3.0 }
              as: Technician
            - call: "POST /gage-rr-studies/${study_id}/trials"
              payload: { operator_index: 1, part_index: 2, trial_index: 2, measured_value: 3.0 }
              as: Technician
            - call: "POST /gage-rr-studies/${study_id}/trials"
              payload: { operator_index: 2, part_index: 1, trial_index: 1, measured_value: 2.2 }
              as: Technician
            - call: "POST /gage-rr-studies/${study_id}/trials"
              payload: { operator_index: 2, part_index: 1, trial_index: 2, measured_value: 2.0 }
              as: Technician
            - call: "POST /gage-rr-studies/${study_id}/trials"
              payload: { operator_index: 2, part_index: 2, trial_index: 1, measured_value: 3.1 }
              as: Technician
            - call: "POST /gage-rr-studies/${study_id}/trials"
              payload: { operator_index: 2, part_index: 2, trial_index: 2, measured_value: 3.2 }
              as: Technician
          trigger:
            - call: "POST /gage-rr-studies/${study_id}/analyze"
              payload: {}
              as: QualityEngineer
              captures: { pct: $.data.pct_grr, acc: $.data.acceptability }
          assert:
            - "GageRRStudy.${study_id}.pct_grr == 32.27"
            - "GageRRStudy.${study_id}.acceptability == UNACCEPTABLE"
            - "GageRRStudy.${study_id}.status == ANALYZED"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: cal_event_failed_reopen_cycle
        grounds:
          - state_machines.CalibrationEvent.IN_PROGRESS_to_FAILED
          - state_machines.CalibrationEvent.FAILED_to_IN_PROGRESS
          - entities.CalibrationEvent.fields.status
        distinguishing_aspect: |
          CalibrationEvent is cyclic: FAILED→IN_PROGRESS (reopen) returns to a
          prior state after the impact is CANCELLED, distinct from the GageRRStudy
          cycle on a different entity; result resets to null on reopen.
        test_recipe:
          setup:
            - "Instrument with a FAILED event (auto-opened impact) whose impact is then CANCELLED so reopen is permitted."
          setup_api_calls:
            - call: "POST /calibration-standards"
              payload: { name: "GB-RC", nist_test_number: "NIST-4", nominal_value: 25.0, standard_unit: "mm", uncertainty: 0.001, certified_through_epoch: 9999 }
              as: Metrologist
              captures: { std_id: $.data.id }
            - call: "POST /instruments"
              payload: { asset_tag: "INST-RC", description: "Reopen gauge", nominal_value: 25.0, tolerance_plus: 0.05, tolerance_minus: 0.05, measurement_unit: "mm", calibration_interval_epochs: 100, criticality: "MINOR" }
              as: QualityEngineer
              captures: { inst_id: $.data.id, inst_v: $.data.version }
            - call: "POST /instruments/${inst_id}/calibration-events"
              payload: { standard_id: "${std_id}", scheduled_epoch: 5, expected_instrument_version: "${inst_v}" }
              as: Technician
              captures: { ev: $.data.id }
            - call: "POST /calibration-events/${ev}/measurement-points"
              payload: { point_label: "P1", nominal: 25.0, tol_plus: 0.05, tol_minus: 0.05, as_found_value: 25.30, as_left_value: 25.30 }
              as: Technician
            - call: "POST /calibration-events/${ev}/start"
              payload: {}
              as: Technician
            - call: "POST /calibration-events/${ev}/finalize"
              payload: {}
              as: Technician
            - call: "GET /instruments/${inst_id}/impacts"
              payload: {}
              as: QualityEngineer
              captures: { impact_id: "$.data[0].id" }
            - call: "POST /impacts/${impact_id}/cancel"
              payload: {}
              as: QualityEngineer
          trigger:
            - call: "POST /calibration-events/${ev}/reopen"
              payload: {}
              as: Technician
              captures: { st: $.data.status, r: $.data.result }
          assert:
            - "CalibrationEvent.${ev}.status == IN_PROGRESS"
            - "CalibrationEvent.${ev}.result == null"

      - name: gage_rr_rejected_recollect_cycle
        grounds:
          - state_machines.GageRRStudy.ANALYZED_to_COLLECTING
          - state_machines.GageRRStudy.COLLECTING_to_ANALYZED
          - entities.GageRRStudy.fields.pct_grr
        distinguishing_aspect: |
          GageRRStudy (a different entity than CalibrationEvent) is cyclic:
          ANALYZED→COLLECTING (reject) loops back and resets computed metrics
          (pct_grr/acceptability) to null, re-enabling re-analysis.
        test_recipe:
          setup:
            - "ACTIVE instrument; gage R&R study analyzed once (UNACCEPTABLE 32.27), then rejected."
          setup_api_calls:
            - call: "POST /instruments"
              payload: { asset_tag: "INST-GRR2", description: "GRR cycle gauge", nominal_value: 5.0, tolerance_plus: 1.0, tolerance_minus: 1.0, measurement_unit: "mm", calibration_interval_epochs: 100, criticality: "MAJOR" }
              as: QualityEngineer
              captures: { inst_id: $.data.id, inst_v: $.data.version }
            - call: "POST /instruments/${inst_id}/gage-rr-studies"
              payload: { operator_count: 2, part_count: 2, trial_count: 2, process_tolerance: 10.0, expected_instrument_version: "${inst_v}" }
              as: QualityEngineer
              captures: { study_id: $.data.id }
            - call: "POST /gage-rr-studies/${study_id}/open"
              payload: {}
              as: QualityEngineer
            - call: "POST /gage-rr-studies/${study_id}/trials"
              payload: { operator_index: 1, part_index: 1, trial_index: 1, measured_value: 2.0 }
              as: Technician
            - call: "POST /gage-rr-studies/${study_id}/trials"
              payload: { operator_index: 1, part_index: 1, trial_index: 2, measured_value: 2.1 }
              as: Technician
            - call: "POST /gage-rr-studies/${study_id}/trials"
              payload: { operator_index: 1, part_index: 2, trial_index: 1, measured_value: 3.0 }
              as: Technician
            - call: "POST /gage-rr-studies/${study_id}/trials"
              payload: { operator_index: 1, part_index: 2, trial_index: 2, measured_value: 3.0 }
              as: Technician
            - call: "POST /gage-rr-studies/${study_id}/trials"
              payload: { operator_index: 2, part_index: 1, trial_index: 1, measured_value: 2.2 }
              as: Technician
            - call: "POST /gage-rr-studies/${study_id}/trials"
              payload: { operator_index: 2, part_index: 1, trial_index: 2, measured_value: 2.0 }
              as: Technician
            - call: "POST /gage-rr-studies/${study_id}/trials"
              payload: { operator_index: 2, part_index: 2, trial_index: 1, measured_value: 3.1 }
              as: Technician
            - call: "POST /gage-rr-studies/${study_id}/trials"
              payload: { operator_index: 2, part_index: 2, trial_index: 2, measured_value: 3.2 }
              as: Technician
            - call: "POST /gage-rr-studies/${study_id}/analyze"
              payload: {}
              as: QualityEngineer
          trigger:
            - call: "POST /gage-rr-studies/${study_id}/reject"
              payload: {}
              as: QualityEngineer
              captures: { st: $.data.status, pct: $.data.pct_grr }
          assert:
            - "GageRRStudy.${study_id}.status == COLLECTING"
            - "GageRRStudy.${study_id}.pct_grr == null"
            - "GageRRStudy.${study_id}.acceptability == null"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: fail_finalize_depth3_cascade
        grounds:
          - state_machines.CalibrationEvent.IN_PROGRESS_to_FAILED
          - state_machines.Instrument.calibration_status_to_OUT_OF_TOLERANCE
          - entities.OutOfToleranceImpact.fields.status
          - entities.Instrument.fields.open_oot_count
        distinguishing_aspect: |
          Depth-3 chain originating at finalize→FAIL: (A) event.status:=FAILED
          causes (B) instrument.calibration_status:=OUT_OF_TOLERANCE which itself
          causes (C) instrument.lifecycle_status:=QUARANTINED which itself causes
          (D) auto-creation of an OPEN OutOfToleranceImpact; each link is caused
          by the previous one, not directly by the trigger.
        test_recipe:
          setup:
            - "ACTIVE instrument with an IN_PROGRESS event whose single point fails as_left."
          setup_api_calls:
            - call: "POST /calibration-standards"
              payload: { name: "GB-C3", nist_test_number: "NIST-5", nominal_value: 25.0, standard_unit: "mm", uncertainty: 0.001, certified_through_epoch: 9999 }
              as: Metrologist
              captures: { std_id: $.data.id }
            - call: "POST /instruments"
              payload: { asset_tag: "INST-C3", description: "Cascade gauge", nominal_value: 25.0, tolerance_plus: 0.05, tolerance_minus: 0.05, measurement_unit: "mm", calibration_interval_epochs: 100, criticality: "CRITICAL" }
              as: QualityEngineer
              captures: { inst_id: $.data.id, inst_v: $.data.version }
            - call: "POST /instruments/${inst_id}/calibration-events"
              payload: { standard_id: "${std_id}", scheduled_epoch: 5, expected_instrument_version: "${inst_v}" }
              as: Technician
              captures: { ev: $.data.id }
            - call: "POST /calibration-events/${ev}/measurement-points"
              payload: { point_label: "P1", nominal: 25.0, tol_plus: 0.05, tol_minus: 0.05, as_found_value: 25.40, as_left_value: 25.40 }
              as: Technician
            - call: "POST /calibration-events/${ev}/start"
              payload: {}
              as: Technician
          trigger:
            - call: "POST /calibration-events/${ev}/finalize"
              payload: {}
              as: Technician
              captures: { res: $.data.result }
            - call: "GET /instruments/${inst_id}"
              payload: {}
              as: QualityEngineer
              captures: { lc: $.data.lifecycle_status, cs: $.data.calibration_status, ooc: $.data.open_oot_count }
            - call: "GET /instruments/${inst_id}/impacts"
              payload: {}
              as: QualityEngineer
              captures: { imp_status: "$.data[0].status" }
          assert:
            - "CalibrationEvent.${ev}.result == FAIL"
            - "Instrument.${inst_id}.calibration_status == OUT_OF_TOLERANCE"
            - "Instrument.${inst_id}.lifecycle_status == QUARANTINED"
            - "Instrument.${inst_id}.open_oot_count == 1"
            - "the auto-created OutOfToleranceImpact status == OPEN"

      - name: recall_disposition_depth2_cascade
        grounds:
          - state_machines.OutOfToleranceImpact.INVESTIGATING_to_DISPOSITIONED
          - entities.AffectedProduct.fields.status
          - entities.OutOfToleranceImpact.fields.recalled_product_count
        distinguishing_aspect: |
          Depth-2 chain from a different trigger (impact disposition==RECALL):
          (A) impact.status:=DISPOSITIONED causes (B) every in-window AffectedProduct
          status:=RECALLED, whose count then drives recalled_product_count — a
          distinct propagation pattern from the finalize cascade.
        test_recipe:
          setup:
            - "Instrument with a FAILED event auto-opening an impact (window [0,5]); two in-window affected products; impact moved to INVESTIGATING by a QualityEngineer distinct from the event's technician."
          setup_api_calls:
            - call: "POST /calibration-standards"
              payload: { name: "GB-RD", nist_test_number: "NIST-6", nominal_value: 25.0, standard_unit: "mm", uncertainty: 0.001, certified_through_epoch: 9999 }
              as: Metrologist
              captures: { std_id: $.data.id }
            - call: "POST /instruments"
              payload: { asset_tag: "INST-RD", description: "Recall gauge", nominal_value: 25.0, tolerance_plus: 0.05, tolerance_minus: 0.05, measurement_unit: "mm", calibration_interval_epochs: 100, criticality: "CRITICAL" }
              as: QualityEngineer
              as_user_id: "qe-1"
              captures: { inst_id: $.data.id, inst_v: $.data.version }
            - call: "POST /instruments/${inst_id}/calibration-events"
              payload: { standard_id: "${std_id}", scheduled_epoch: 5, expected_instrument_version: "${inst_v}" }
              as: Technician
              as_user_id: "tech-1"
              captures: { ev: $.data.id }
            - call: "POST /calibration-events/${ev}/measurement-points"
              payload: { point_label: "P1", nominal: 25.0, tol_plus: 0.05, tol_minus: 0.05, as_found_value: 25.40, as_left_value: 25.40 }
              as: Technician
              as_user_id: "tech-1"
            - call: "POST /calibration-events/${ev}/start"
              payload: {}
              as: Technician
              as_user_id: "tech-1"
            - call: "POST /calibration-events/${ev}/finalize"
              payload: {}
              as: Technician
              as_user_id: "tech-1"
            - call: "GET /instruments/${inst_id}/impacts"
              payload: {}
              as: QualityEngineer
              as_user_id: "qe-1"
              captures: { impact_id: "$.data[0].id" }
            - call: "POST /impacts/${impact_id}/affected-products"
              payload: { product_serial: "P-A", measured_epoch: 2 }
              as: QualityEngineer
              as_user_id: "qe-1"
            - call: "POST /impacts/${impact_id}/affected-products"
              payload: { product_serial: "P-B", measured_epoch: 4 }
              as: QualityEngineer
              as_user_id: "qe-1"
            - call: "POST /impacts/${impact_id}/investigate"
              payload: {}
              as: QualityEngineer
              as_user_id: "qe-2"
          trigger:
            - call: "POST /impacts/${impact_id}/disposition"
              payload: { disposition: "RECALL" }
              as: QualityEngineer
              as_user_id: "qe-2"
              captures: { st: $.data.status, rc: $.data.recalled_product_count }
          assert:
            - "OutOfToleranceImpact.${impact_id}.status == DISPOSITIONED"
            - "OutOfToleranceImpact.${impact_id}.disposition == RECALL"
            - "OutOfToleranceImpact.${impact_id}.recalled_product_count == 2"
            - "both AffectedProduct rows have status == RECALLED"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_before_segregation_on_disposition
        grounds:
          - validations[priority=9]
          - validations[priority=14]
        distinguishing_aspect: |
          Error-category pair state (priority 9, ERR_INVALID_STATE) vs
          business_safety (priority 14, ERR_SEGREGATION_OF_DUTIES): a disposition
          on an OPEN impact (wrong state) by the same technician who calibrated
          (duties conflict) returns ERR_INVALID_STATE because state precedes the
          segregation check.
        test_recipe:
          setup:
            - "FAILED event auto-opening an OPEN impact; disposition attempted while still OPEN (not INVESTIGATING) AND by the same user id as the technician."
          setup_api_calls:
            - call: "POST /calibration-standards"
              payload: { name: "GB-PP1", nist_test_number: "NIST-7", nominal_value: 25.0, standard_unit: "mm", uncertainty: 0.001, certified_through_epoch: 9999 }
              as: Metrologist
              captures: { std_id: $.data.id }
            - call: "POST /instruments"
              payload: { asset_tag: "INST-PP1", description: "PP1 gauge", nominal_value: 25.0, tolerance_plus: 0.05, tolerance_minus: 0.05, measurement_unit: "mm", calibration_interval_epochs: 100, criticality: "CRITICAL" }
              as: QualityEngineer
              as_user_id: "qe-1"
              captures: { inst_id: $.data.id, inst_v: $.data.version }
            - call: "POST /instruments/${inst_id}/calibration-events"
              payload: { standard_id: "${std_id}", scheduled_epoch: 5, expected_instrument_version: "${inst_v}" }
              as: Technician
              as_user_id: "user-x"
              captures: { ev: $.data.id }
            - call: "POST /calibration-events/${ev}/measurement-points"
              payload: { point_label: "P1", nominal: 25.0, tol_plus: 0.05, tol_minus: 0.05, as_found_value: 25.40, as_left_value: 25.40 }
              as: Technician
              as_user_id: "user-x"
            - call: "POST /calibration-events/${ev}/start"
              payload: {}
              as: Technician
              as_user_id: "user-x"
            - call: "POST /calibration-events/${ev}/finalize"
              payload: {}
              as: Technician
              as_user_id: "user-x"
            - call: "GET /instruments/${inst_id}/impacts"
              payload: {}
              as: QualityEngineer
              as_user_id: "qe-1"
              captures: { impact_id: "$.data[0].id" }
          trigger:
            - call: "POST /impacts/${impact_id}/disposition"
