              as: NetworkAdmin
              as_user_id: "net-1"
            - call: "POST /designation-reviews"
              payload: { unit_id: "${unit_a}", requested_level: "LEVEL_II", assigned_nurse_count: 1 }
              as: UnitDirector
              as_user_id: "${unit_a}:dir-1"
              captures: { rev_after_denied: $.data.id }
          assert:
            - "${e_open_review} == ERR_REVIEW_ALREADY_OPEN with HTTP 409 while the first review is DRAFT"
            - "${e_open_review_2} == ERR_REVIEW_ALREADY_OPEN with HTTP 409 while it is SUBMITTED"
            - "certify moves the 16.00-scoring review to DENIED (SCORE_BELOW_FLOOR), a terminal state"
            - "DesignationReview.${rev_after_denied}.status == DRAFT — a new review is allowed once no open review remains"
            - "GET /designation-reviews?unit_id=${unit_a} reports total_count 2"

      - name: maternal_transfer_preference_reserves_the_last_bed
        claim_type: cross_entity_validation
        grounds:
          - calculations.maternal_transfer_preference
          - validations.priority_12
          - errors[ERR_MATERNAL_TRANSFER_PREFERENCE]
          - calculations.triage_priority
          - calculations.hold_expiry_window
        distinguishing_aspect: |
          The referral being accepted is faultless; the blocker lives in a
          DIFFERENT row — a PENDING maternal-antenatal case with triage 78.75
          against the inbound's 71.25. The rule only bites on the LAST bed, and
          the maternal hold that follows gets the 720-minute window instead of
          240.
        test_recipe:
          setup:
            - "The clock is at 2026-08-01T00:00:00Z, the standards are declared, and Regional NICU A is capability LEVEL_III with staffed_bed_target reduced to 1 (available 1)."
            - "A MATERNAL_ANTENATAL referral (GA 30.0, EFW 1300, room air) and an INBOUND_NEONATAL referral (GA 29.0, 1200 g, room air) are both PENDING at the unit."
          setup_api_calls:
            - *c_clock
            - *c_std1
            - *c_std2
            - *c_std3
            - *c_unit_a
            - *c_unit_b
            - *c_cred_neo
