  - section: errors
    instances:
      - name: error_equipment_unavailable_already_covered
        claim_type: Violation → Error
        grounds: ["errors[ERR_EQUIPMENT_UNAVAILABLE]"]
        excluded_because:
          difficulty_instance: boundary_precision_check / reserve_exact_available_units_boundary
          rationale: "ERR_EQUIPMENT_UNAVAILABLE is asserted as the over-capacity failure path of that §1.8 instance."
      - name: error_coi_insufficient_coverage_already_covered
        claim_type: Violation → Error
        grounds: ["errors[ERR_COI_INSUFFICIENT_COVERAGE]"]
        excluded_because:
          difficulty_instance: boundary_precision_check / coi_coverage_exact_required_boundary
          rationale: "ERR_COI_INSUFFICIENT_COVERAGE is asserted as the one-cent-short failure of that §1.8 instance."
      - name: error_crew_double_booked_already_covered
        claim_type: Violation → Error
        grounds: ["errors[ERR_CREW_DOUBLE_BOOKED]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / crew_shift_turnaround_buffer
          rationale: "ERR_CREW_DOUBLE_BOOKED is asserted as the zero-gap failure of that §1.8 instance."
      - name: error_order_not_loaded_out_already_covered
        claim_type: Violation → Error
        grounds: ["errors[ERR_ORDER_NOT_LOADED_OUT]"]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / reservation_checkout_requires_order_loaded_out
          rationale: "ERR_ORDER_NOT_LOADED_OUT is asserted as the pre-load-out check-out failure of that §1.8 instance."
      - name: error_coi_not_approved_already_covered
        claim_type: Violation → Error
        grounds: ["errors[ERR_COI_NOT_APPROVED]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / confirm_safety_beats_fiscal
          rationale: "ERR_COI_NOT_APPROVED is asserted as the winning error of that §1.8 priority-conflict instance."
      - name: error_invalid_state_already_covered
        claim_type: Violation → Error
        grounds: ["errors[ERR_INVALID_STATE]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / reserve_state_beats_temporal
          rationale: "ERR_INVALID_STATE is asserted as the winning error of that §1.8 priority-conflict instance."

  - section: cross_cutting
    instances:
      - name: confirm_correct_version_succeeds_already_covered
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[confirm-stale-order]"]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / order_confirm_requires_coi_approved
          rationale: "The OCC positive path (confirm with the current version succeeds and bumps version) is exercised when that §1.8 instance confirms with the freshly captured version."

