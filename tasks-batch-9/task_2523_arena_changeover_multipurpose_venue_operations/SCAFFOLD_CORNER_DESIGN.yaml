            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T01:00:00Z" }
              as: VenueOperationsDirector
              as_user_id: "dir-lakeside"
            - call: "POST /event-bookings/${bk_b}/hold"
