  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: offload_bay_aggregate_capacity_two_bays_with_half_open_windows
        grounds:
          - validations.priority_160_ERR_OFFLOAD_BAY_CONFLICT
          - errors.ERR_OFFLOAD_BAY_CONFLICT
          - entities.Station.fields.offload_bay_count
          - entities.Delivery.fields.window_start
          - entities.Delivery.fields.window_end
          - endpoints.POST_/deliveries
        distinguishing_aspect: |
          Interval semantics are AGGREGATE CAPACITY over a HALF-OPEN window on the Station resource:
          two concurrent deliveries are legal because offload_bay_count is 2, and only the third
          simultaneous window is refused. Two things are falsifiable here. (1) A per-station exclusive
          rule would wrongly reject D2. (2) Window [06:00, 10:00) touches D1's end at 06:00 and must be
          treated as NOT intersecting, so it sees only one occupant and is admitted — an implementation
          using closed intervals counts two occupants and wrongly rejects it.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z, so every window below is in the future and no arrival is attempted."
            - "Station STN-O with offload_bay_count 2, nozzle_count 4, storage_capacity_kg 900.000, reserve_floor_kg 100.000, max_pressure_class H70; a single MEDIUM vessel 1000 L at 700.00 bar is enough because nothing is offloaded."
            - "One ProductionLot LOT-O-1 (status PRODUCED is sufficient — priority 130 only guards offload)."
            - "D1 booked for [2026-08-02T00:00:00Z, 2026-08-02T06:00:00Z) and D2 for [2026-08-02T02:00:00Z, 2026-08-02T08:00:00Z); each sees only one other occupant, which is below the 2-bay capacity."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /funding-agreements"
              payload: { agreement_code: "FA-O-1", funder_name: "State Clean Transport Fund", min_uptime_pct: 99.000, penalty_per_point_cents: 250000, initial_holdback_cents: 500000, uptime_method: "NOZZLE_WEIGHTED" }
              as: PlatformAdmin
              captures: { fa_id: "$.data.id" }
            - call: "POST /stations"
              payload: { funding_agreement_id: "${fa_id}", code: "STN-O", name: "Bay Yard O", nozzle_count: 4, offload_bay_count: 2, storage_capacity_kg: 900.000, reserve_floor_kg: 100.000, max_pressure_class: "H70", setback_compliant: true }
              as: PlatformAdmin
              captures: { st_id: "$.data.id" }
            - call: "POST /stations/${st_id}/pressure-vessels"
              payload: { bank_tier: "MEDIUM", water_volume_l: 1000.0, mawp_bar: 1000.00, min_residual_bar: 150.00, initial_pressure_bar: 700.00, next_inspection_due_date: "2027-06-30" }
              as: SafetyOfficer
              captures: { v_med: "$.data.id" }
            - call: "POST /production-assets"
              payload: { asset_code: "PA-O-1", pathway: "PEM_ELECTROLYSIS", nameplate_kg_per_day: 1200.000, ccs_capture_rate: 0.0000, operator_org: "Harbor H2 Production" }
              as: ProductionEngineer
              captures: { asset_id: "$.data.id" }
            - call: "POST /production-assets/${asset_id}/power-supply-contracts"
              payload: { contract_code: "PSC-O-1", grid_ci_gco2e_per_mwh: 385000.00, annual_renewable_pct: 62.500, hourly_matched_renewable_pct: 41.000, hourly_matching_enabled: false, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: ProductionEngineer
            - call: "POST /production-lots"
              payload: { production_asset_id: "${asset_id}", lot_code: "LOT-O-1", mass_kg: 1000.000, energy_consumed_kwh: 52000.0, feedstock_consumed_mmbtu: 0.000, carryover_kg: 0.000, production_start_at: "2026-07-20T00:00:00Z", production_end_at: "2026-07-21T00:00:00Z" }
              as: ProductionEngineer
              captures: { lot_id: "$.data.id" }
            - call: "POST /deliveries"
              payload: { station_id: "${st_id}", production_lot_id: "${lot_id}", receiving_vessel_id: "${v_med}", mode: "TUBE_TRAILER", planned_kg: 10.000, window_start: "2026-08-02T00:00:00Z", window_end: "2026-08-02T06:00:00Z", departed_at: "2026-08-01T12:00:00Z", trailer_water_volume_l: 2500.0, trailer_final_pressure_bar: 210.00 }
              as: LogisticsDispatcher
              captures: { d1: "$.data.id", d1_status: "$.data.status" }
            - call: "POST /deliveries"
              payload: { station_id: "${st_id}", production_lot_id: "${lot_id}", receiving_vessel_id: "${v_med}", mode: "TUBE_TRAILER", planned_kg: 10.000, window_start: "2026-08-02T02:00:00Z", window_end: "2026-08-02T08:00:00Z", departed_at: "2026-08-01T12:00:00Z", trailer_water_volume_l: 2500.0, trailer_final_pressure_bar: 210.00 }
              as: LogisticsDispatcher
              captures: { d2: "$.data.id", d2_status: "$.data.status" }
          trigger:
            - call: "POST /deliveries"
              payload: { station_id: "${st_id}", production_lot_id: "${lot_id}", receiving_vessel_id: "${v_med}", mode: "TUBE_TRAILER", planned_kg: 10.000, window_start: "2026-08-02T03:00:00Z", window_end: "2026-08-02T05:00:00Z", departed_at: "2026-08-01T12:00:00Z", trailer_water_volume_l: 2500.0, trailer_final_pressure_bar: 210.00 }
              as: LogisticsDispatcher
              captures: { err_bay: "$.data.error_id" }
            - call: "POST /deliveries"
              payload: { station_id: "${st_id}", production_lot_id: "${lot_id}", receiving_vessel_id: "${v_med}", mode: "TUBE_TRAILER", planned_kg: 10.000, window_start: "2026-08-02T06:00:00Z", window_end: "2026-08-02T10:00:00Z", departed_at: "2026-08-01T12:00:00Z", trailer_water_volume_l: 2500.0, trailer_final_pressure_bar: 210.00 }
              as: LogisticsDispatcher
              captures: { d4: "$.data.id", d4_status: "$.data.status" }
          assert:
            - "${d1_status} == SCHEDULED and ${d2_status} == SCHEDULED (two bays absorb two overlapping windows)"
            - "the [03:00, 05:00) request returns HTTP 409 with ${err_bay} == ERR_OFFLOAD_BAY_CONFLICT"
            - "the [06:00, 10:00) request returns HTTP 201 and ${d4_status} == SCHEDULED (touching D1 at 06:00 does not intersect)"
            - "exactly three Delivery rows exist for Station ${st_id}, all with status SCHEDULED"
            - "Station.${st_id}.inbound_planned_kg == 30.000"
            - "Station.${st_id}.projected_available_kg == 86.000 and supply_alert == true (56.000 onsite + 30.000 inbound is below reserve_floor_kg 100.000)"

      - name: power_supply_contract_exclusive_with_24_hour_changeover_buffer
        grounds:
          - validations.priority_170_ERR_POWER_CONTRACT_OVERLAP
          - errors.ERR_POWER_CONTRACT_OVERLAP
          - calculations.operational_thresholds.CONTRACT_CHANGEOVER_BUFFER_HOURS
          - entities.PowerSupplyContract.fields.effective_from
          - entities.PowerSupplyContract.fields.effective_to
          - endpoints.POST_/production-assets/{id}/power-supply-contracts
        distinguishing_aspect: |
          Different resource entity (ProductionAsset's power supply, not the Station's offload bays) and
          strictly different interval semantics: EXCLUSIVE occupancy widened by a 24-hour changeover
          buffer. Capacity is one, and adjacency is FORBIDDEN rather than allowed — a contract starting
          exactly when the incumbent ends is rejected, and only a start pushed a full 24 hours past the
          incumbent's end is admitted. This is the mirror image of the offload-bay rule, where touching
          windows are legal and capacity is greater than one.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One ProductionAsset PA-P-1 (PEM_ELECTROLYSIS, ccs_capture_rate 0.0000)."
            - "Incumbent contract PSC-P-1 occupies [2026-01-01T00:00:00Z, 2026-06-01T00:00:00Z)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /production-assets"
              payload: { asset_code: "PA-P-1", pathway: "PEM_ELECTROLYSIS", nameplate_kg_per_day: 1200.000, ccs_capture_rate: 0.0000, operator_org: "Harbor H2 Production" }
              as: ProductionEngineer
              captures: { asset_id: "$.data.id" }
            - call: "POST /production-assets/${asset_id}/power-supply-contracts"
              payload: { contract_code: "PSC-P-1", grid_ci_gco2e_per_mwh: 385000.00, annual_renewable_pct: 62.500, hourly_matched_renewable_pct: 41.000, hourly_matching_enabled: false, effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-06-01T00:00:00Z" }
              as: ProductionEngineer
              captures: { c1: "$.data.id" }
          trigger:
            - call: "POST /production-assets/${asset_id}/power-supply-contracts"
              payload: { contract_code: "PSC-P-2", grid_ci_gco2e_per_mwh: 300000.00, annual_renewable_pct: 70.000, hourly_matched_renewable_pct: 50.000, hourly_matching_enabled: true, effective_from: "2026-06-01T00:00:00Z", effective_to: "2026-12-01T00:00:00Z" }
              as: ProductionEngineer
              captures: { err_contract: "$.data.error_id" }
            - call: "POST /production-assets/${asset_id}/power-supply-contracts"
              payload: { contract_code: "PSC-P-3", grid_ci_gco2e_per_mwh: 300000.00, annual_renewable_pct: 70.000, hourly_matched_renewable_pct: 50.000, hourly_matching_enabled: true, effective_from: "2026-06-02T00:00:00Z", effective_to: "2026-12-01T00:00:00Z" }
              as: ProductionEngineer
              captures: { c3: "$.data.id", c3_from: "$.data.effective_from" }
          assert:
            - "the back-to-back contract starting 2026-06-01T00:00:00Z returns HTTP 409 with ${err_contract} == ERR_POWER_CONTRACT_OVERLAP (2026-06-01 < 2026-06-01 + 24h)"
            - "the contract starting 2026-06-02T00:00:00Z returns HTTP 201 (2026-06-02 is not strictly before 2026-06-01 + 24h)"
            - "${c3_from} == 2026-06-02T00:00:00Z"
            - "exactly two PowerSupplyContract rows exist for ProductionAsset ${asset_id}: ${c1} and ${c3}"
            - "PowerSupplyContract.${c1}.effective_to == 2026-06-01T00:00:00Z (the incumbent is never truncated)"
            - "PowerSupplyContract.${c3}.hourly_matching_enabled == true"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: meter_void_reversal_conserves_hydrogen_mass_in_kg_across_the_ledger
        grounds:
          - calculations.onsite_inventory_reconciliation
          - entities.InventoryLedgerEntry.fields.delta_kg
          - entities.InventoryLedgerEntry.fields.resulting_onsite_kg
          - entities.InventoryLedgerEntry.fields.sequence_no
          - endpoints.POST_/dispense-sessions/{id}/meter-settlement
          - endpoints.POST_/dispense-sessions/{id}/void-meter
        distinguishing_aspect: |
          Conserved quantity is HYDROGEN MASS IN KILOGRAMS, pinned as an explicit formula over entity
          fields:
            Station.onsite_inventory_kg == round_half_up(SUM(InventoryLedgerEntry.delta_kg), 3)
            and delta_kg(METER_CORRECTION) + delta_kg(METER_VOID_REVERSAL) == 0.000
          The settlement moves -0.639 kg and the void moves exactly +0.639 kg back, so the station
          returns to 141.750 kg with no drift, the ledger is append-only (six rows, none mutated), and
          the replayed resulting_onsite_kg of the final row equals the station field.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Station STN-Q, nozzle_count 4, storage_capacity_kg 900.000, reserve_floor_kg 100.000, max_pressure_class H70."
            - "Vessels created in order HIGH 600 L at 950.00 bar (OPENING_BALANCE +45.600), MEDIUM 1000 L at 700.00 bar (+56.000), LOW 5000 L at 300.00 bar (+120.000), so onsite_inventory_kg is 221.600 across ledger sequence_no 1..3."
            - "Two current EMERGENCY_RESPONSE responder certifications."
            - "One H35 session planned 80.000 kg at ambient_temp_c 0.0 completed with metered_kg 79.850 at avg_dispense_pressure_bar 700.00: density_correction_factor 1.008, corrected_kg 80.489, DISPENSE_DRAW of -79.850 at sequence_no 4 leaves onsite_inventory_kg 141.750."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /funding-agreements"
              payload: { agreement_code: "FA-Q-1", funder_name: "State Clean Transport Fund", min_uptime_pct: 99.000, penalty_per_point_cents: 250000, initial_holdback_cents: 500000, uptime_method: "NOZZLE_WEIGHTED" }
              as: PlatformAdmin
              captures: { fa_id: "$.data.id" }
            - call: "POST /stations"
              payload: { funding_agreement_id: "${fa_id}", code: "STN-Q", name: "Ledger Yard Q", nozzle_count: 4, offload_bay_count: 1, storage_capacity_kg: 900.000, reserve_floor_kg: 100.000, max_pressure_class: "H70", setback_compliant: true }
              as: PlatformAdmin
              captures: { st_id: "$.data.id" }
            - call: "POST /stations/${st_id}/pressure-vessels"
              payload: { bank_tier: "HIGH", water_volume_l: 600.0, mawp_bar: 1000.00, min_residual_bar: 200.00, initial_pressure_bar: 950.00, next_inspection_due_date: "2027-06-30" }
              as: SafetyOfficer
              captures: { v_high: "$.data.id" }
            - call: "POST /stations/${st_id}/pressure-vessels"
              payload: { bank_tier: "MEDIUM", water_volume_l: 1000.0, mawp_bar: 1000.00, min_residual_bar: 150.00, initial_pressure_bar: 700.00, next_inspection_due_date: "2027-06-30" }
              as: SafetyOfficer
              captures: { v_med: "$.data.id" }
            - call: "POST /stations/${st_id}/pressure-vessels"
              payload: { bank_tier: "LOW", water_volume_l: 5000.0, mawp_bar: 1000.00, min_residual_bar: 100.00, initial_pressure_bar: 300.00, next_inspection_due_date: "2027-06-30" }
              as: SafetyOfficer
              captures: { v_low: "$.data.id" }
            - call: "POST /stations/${st_id}/responder-certifications"
              payload: { responder_ref: "RSP-Q-1", cert_type: "EMERGENCY_RESPONSE", valid_from: "2026-01-01", expires_on: "2027-01-01" }
              as: SafetyOfficer
            - call: "POST /stations/${st_id}/responder-certifications"
              payload: { responder_ref: "RSP-Q-2", cert_type: "EMERGENCY_RESPONSE", valid_from: "2026-01-01", expires_on: "2027-01-01" }
              as: SafetyOfficer
            - call: "GET /stations/${st_id}"
              payload: {}
              as: StationOperator
              as_user_id: "${st_id}"
              captures: { st_v: "$.data.version", onsite_start: "$.data.onsite_inventory_kg" }
            - call: "POST /dispense-sessions"
              payload: { station_id: "${st_id}", vehicle_class: "TRANSIT_BUS", target_pressure_class: "H35", fill_protocol: "SAE_J2601_TABLE", planned_kg: 80.000, ambient_temp_c: 0.0, expected_station_version: "${st_v}" }
              as: StationOperator
              as_user_id: "${st_id}"
              captures: { sess_id: "$.data.id" }
            - call: "POST /dispense-sessions/${sess_id}/fuel"
              payload: { precool_temp_achieved_c: -20.0 }
              as: StationOperator
              as_user_id: "${st_id}"
            - call: "POST /dispense-sessions/${sess_id}/complete"
              payload: { metered_kg: 79.850, avg_dispense_pressure_bar: 700.00, final_pressure_bar: 438.00 }
              as: StationOperator
              as_user_id: "${st_id}"
              captures: { corrected: "$.data.corrected_kg" }
            - call: "GET /stations/${st_id}/inventory-ledger"
              payload: { limit: 100, offset: 0 }
              as: StationOperator
              as_user_id: "${st_id}"
            - call: "POST /dispense-sessions/${sess_id}/meter-settlement"
              payload: {}
              as: ComplianceAdmin
              as_user_id: "CA-1"
            - call: "GET /stations/${st_id}"
              payload: {}
              as: StationOperator
              as_user_id: "${st_id}"
              captures: { onsite_after_settlement: "$.data.onsite_inventory_kg" }
          trigger:
            - call: "POST /dispense-sessions/${sess_id}/void-meter"
              payload: { void_reason: "AUDIT_ADJUSTMENT" }
              as: ComplianceAdmin
              as_user_id: "CA-1"
          assert:
            - "${onsite_start} == 221.600 and ${corrected} == 80.489"
            - "${onsite_after_settlement} == 141.111 (the METER_CORRECTION moved -0.639 kg)"
            - "Station.${st_id}.onsite_inventory_kg == 141.750 after the void (exact restoration, no drift)"
            - "the InventoryLedgerEntry with reason METER_CORRECTION has delta_kg == -0.639"
            - "the InventoryLedgerEntry with reason METER_VOID_REVERSAL has delta_kg == 0.639"
            - "delta_kg(METER_CORRECTION) + delta_kg(METER_VOID_REVERSAL) == 0.000 (the compensating pair)"
            - "exactly 6 InventoryLedgerEntry rows exist for Station ${st_id} with sequence_no 1..6 and reasons OPENING_BALANCE, OPENING_BALANCE, OPENING_BALANCE, DISPENSE_DRAW, METER_CORRECTION, METER_VOID_REVERSAL"
            - "the sequence_no 6 row has resulting_onsite_kg == 141.750, equal to Station.${st_id}.onsite_inventory_kg"
            - "Station.${st_id}.onsite_inventory_kg == 45.600 + 56.000 + 120.000 - 79.850 - 0.639 + 0.639 == 141.750"
            - "DispenseSession.${sess_id}.billing_status == VOIDED and fill_status == COMPLETED"
            - "Station.${st_id}.metered_kg_mtd == 0.000 and corrected_kg_mtd == 0.000"

      - name: report_amendment_conserves_holdback_cents_against_the_agreement
        grounds:
          - calculations.funding_penalty
          - calculations.station_uptime_pct
          - entities.FundingAgreement.fields.holdback_balance_cents
          - entities.UptimeReport.fields.penalty_cents
          - state_machines.UptimeReport.FINAL_to_AMENDED
          - endpoints.POST_/uptime-reports/{id}/amend
        distinguishing_aspect: |
          A different conserved quantity type — MONEY IN CENTS against the FundingAgreement, not
          hydrogen mass in kg against a station ledger — pinned as
            FundingAgreement.holdback_balance_cents ==
              MAX(0, initial_holdback_cents - SUM(UptimeReport.penalty_cents WHERE status == FINAL))
          Finalizing charges 119500 cents and the amendment reverses it exactly by moving the report to
          AMENDED, so the balance walks 500000 -> 380500 -> 500000. The superseded report KEEPS its
          penalty_cents value for audit; conservation comes from the status filter, not from zeroing the
          historical row, which is what an implementation that mutates the old penalty would get wrong.
        test_recipe:
          setup:
            - "FundingAgreement FA-R-1 with min_uptime_pct 99.000, penalty_per_point_cents 250000, initial_holdback_cents 500000 and uptime_method NOZZLE_WEIGHTED."
            - "Station STN-R with nozzle_count 4 and a single HIGH vessel 600 L at 950.00 bar (high_bank_deliverable_kg 36.000, so the posture is OPEN)."
            - "Three cleared SafetyEvent rows inside July 2026, all opened by SO-1 and cleared by SO-2 to satisfy segregation of duties: E1 OVERPRESSURE MAJOR affecting 2 nozzles over [2026-07-10T00:00:00Z, 2026-07-10T06:00:00Z); E2 OVERPRESSURE CRITICAL affecting 4 nozzles over [2026-07-15T00:00:00Z, 2026-07-15T06:00:00Z); E3 OVERPRESSURE MAJOR affecting 4 nozzles over [2026-07-15T06:00:00Z, 2026-07-15T08:00:00Z), exactly adjacent to E2."
            - "The clock is then set to 2026-08-01T00:00:00Z and a DRAFT UptimeReport is created for [2026-07-01T00:00:00Z, 2026-08-01T00:00:00Z): 44640 period minutes, downtime_nozzle_minutes 2640, uptime_pct_nozzle_weighted 98.522, full_outage_minutes 480 after merging the adjacent E2/E3 outages, uptime_pct_station_level 98.925, uptime_pct 98.522, shortfall_points 0.478, penalty_cents 0."
            - "Finalizing that report stamps penalty_cents 119500 and drops holdback_balance_cents to 380500."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /funding-agreements"
              payload: { agreement_code: "FA-R-1", funder_name: "State Clean Transport Fund", min_uptime_pct: 99.000, penalty_per_point_cents: 250000, initial_holdback_cents: 500000, uptime_method: "NOZZLE_WEIGHTED" }
              as: PlatformAdmin
              captures: { fa_id: "$.data.id", holdback_start: "$.data.holdback_balance_cents" }
            - call: "POST /stations"
              payload: { funding_agreement_id: "${fa_id}", code: "STN-R", name: "Uptime Yard R", nozzle_count: 4, offload_bay_count: 1, storage_capacity_kg: 900.000, reserve_floor_kg: 10.000, max_pressure_class: "H70", setback_compliant: true }
              as: PlatformAdmin
              captures: { st_id: "$.data.id" }
            - call: "POST /stations/${st_id}/pressure-vessels"
              payload: { bank_tier: "HIGH", water_volume_l: 600.0, mawp_bar: 1000.00, min_residual_bar: 200.00, initial_pressure_bar: 950.00, next_inspection_due_date: "2027-06-30" }
              as: SafetyOfficer
              captures: { v_high: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /safety-events"
              payload: { station_id: "${st_id}", kind: "OVERPRESSURE", severity: "MAJOR", affected_nozzle_count: 2, detected_by: "SENSOR" }
              as: SafetyOfficer
              as_user_id: "SO-1"
              captures: { e1: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-10T06:00:00Z" }
              as: PlatformAdmin
            - call: "POST /safety-events/${e1}/acknowledge"
              payload: {}
              as: SafetyOfficer
              as_user_id: "SO-2"
            - call: "POST /safety-events/${e1}/clear"
              payload: { corrective_action: "Relief valve reseated and pressure logged." }
              as: SafetyOfficer
              as_user_id: "SO-2"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /safety-events"
              payload: { station_id: "${st_id}", kind: "OVERPRESSURE", severity: "CRITICAL", affected_nozzle_count: 4, detected_by: "SENSOR" }
              as: SafetyOfficer
              as_user_id: "SO-1"
              captures: { e2: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-15T06:00:00Z" }
              as: PlatformAdmin
            - call: "POST /safety-events/${e2}/acknowledge"
              payload: {}
              as: SafetyOfficer
              as_user_id: "SO-2"
            - call: "POST /safety-events/${e2}/clear"
              payload: { corrective_action: "Station vented and recertified after overpressure." }
              as: SafetyOfficer
              as_user_id: "SO-2"
            - call: "POST /safety-events"
              payload: { station_id: "${st_id}", kind: "OVERPRESSURE", severity: "MAJOR", affected_nozzle_count: 4, detected_by: "OPERATOR_ROUND" }
              as: SafetyOfficer
              as_user_id: "SO-1"
              captures: { e3: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-15T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /safety-events/${e3}/acknowledge"
              payload: {}
              as: SafetyOfficer
              as_user_id: "SO-2"
            - call: "POST /safety-events/${e3}/clear"
              payload: { corrective_action: "Nozzle manifold torque check completed." }
              as: SafetyOfficer
              as_user_id: "SO-2"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /funding-agreements/${fa_id}"
              payload: {}
              as: ComplianceAdmin
              as_user_id: "CA-1"
              captures: { fa_v: "$.data.version" }
            - call: "POST /uptime-reports"
              payload: { station_id: "${st_id}", funding_agreement_id: "${fa_id}", period_start: "2026-07-01T00:00:00Z", period_end: "2026-08-01T00:00:00Z", expected_funding_agreement_version: "${fa_v}" }
              as: ComplianceAdmin
              as_user_id: "CA-1"
              captures: { rep1: "$.data.id", nozzle_min: "$.data.downtime_nozzle_minutes", full_min: "$.data.full_outage_minutes", up_nw: "$.data.uptime_pct_nozzle_weighted", up_sl: "$.data.uptime_pct_station_level", up: "$.data.uptime_pct", shortfall: "$.data.shortfall_points", pen_draft: "$.data.penalty_cents" }
            - call: "POST /uptime-reports/${rep1}/finalize"
              payload: {}
              as: ComplianceAdmin
              as_user_id: "CA-1"
              captures: { pen_final: "$.data.penalty_cents", status_final: "$.data.status" }
            - call: "GET /funding-agreements/${fa_id}"
              payload: {}
              as: ComplianceAdmin
              as_user_id: "CA-1"
              captures: { holdback_after_final: "$.data.holdback_balance_cents" }
          trigger:
            - call: "POST /uptime-reports/${rep1}/amend"
              payload: { period_start: "2026-07-01T00:00:00Z", period_end: "2026-08-01T00:00:00Z", amend_reason: "Nozzle count snapshot corrected after audit." }
              as: ComplianceAdmin
              as_user_id: "CA-1"
              captures: { rep2: "$.data.id", rep2_status: "$.data.status", rep2_amended_from: "$.data.amended_from_report_id", rep2_penalty: "$.data.penalty_cents" }
          assert:
            - "${holdback_start} == 500000"
            - "${nozzle_min} == 2640 and ${full_min} == 480 (E2 and E3 are adjacent full outages and merge with a zero gap)"
            - "${up_nw} == 98.522 and ${up_sl} == 98.925 and ${up} == 98.522"
            - "${shortfall} == 0.478 and ${pen_draft} == 0"
            - "${pen_final} == 119500 and ${status_final} == FINAL"
            - "${holdback_after_final} == 380500"
            - "UptimeReport.${rep1}.status == AMENDED and penalty_cents == 119500 (retained for audit, excluded from the charge)"
            - "${rep2_status} == DRAFT and ${rep2_amended_from} == ${rep1} and ${rep2_penalty} == 0"
            - "UptimeReport.${rep2}.uptime_pct == 98.522 and shortfall_points == 0.478"
            - "FundingAgreement.${fa_id}.holdback_balance_cents == 500000 (MAX(0, 500000 - 0) because no report is FINAL)"
            - "FundingAgreement.${fa_id}.initial_holdback_cents == 500000 (never mutated)"
