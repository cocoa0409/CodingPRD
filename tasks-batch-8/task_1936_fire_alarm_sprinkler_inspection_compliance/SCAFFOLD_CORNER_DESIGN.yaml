  - section: cross_cutting_layers
    instances:
      - name: occ_stale_plan_create_rejected
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[plan-create-stale-property]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Client reads property version V, another write bumps it, then plan create with expected_property_version=V -> 412 ERR_STALE_VERSION; retry with fresh version succeeds."
        test_recipe:
          setup: ["Property created (version captured); a device-independent write bumps Property.version via a first plan creation"]
          setup_api_calls:
            - call: "POST /fire-compliance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: FireMarshal
