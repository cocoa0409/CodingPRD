            - "settlement recorded alongside: ReelReturn.${return_id}.days_out == 5, refund_variant_applied == FLAT_STEP, refund_usd == 450.00, forfeited_usd == 0.00 (5 <= FLAT_FULL_DAYS 90)"

  # ===========================================================================
  # Rule 9 - compensating invariants
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: rod_metal_mass_conserved_across_allocation_and_cancellation
        conserved_quantity: "RodPurchaseLot.purchase_weight_lbs == remaining_lbs + committed_lbs + scrapped_lbs (pounds of metal, a physical quantity)"
        grounds:
          - calculations.rod_mass_ledger
          - state_machines.CustomerOrder.OPEN_to_CANCELLED
          - state_machines.ProductionLot.QUEUED_to_SCRAP_CLOSED
          - endpoints.POST_/customer-orders/{id}/cancel
        distinguishing_aspect: |
          Conserves PHYSICAL MASS across three buckets. The compensation is
          asymmetric on purpose: cancelling an order returns a queued lot's metal
          to remaining_lbs, never to scrapped_lbs, because nothing was drawn - so
          the reversal is not the mirror image of the scrap path even though both
          move the same pounds out of committed_lbs. The three-bucket sum must
          hold after every single write, and remaining_lbs must come back to its
          exact pre-allocation value with no drift.
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z; copper 2026-07-30 at 4.10; QUALIFIED compounds; ACTIVE UL file; RELEASED SKU THHN-12-CU (conductor_lbs_per_kft 19.8)."
            - "Customer ACME; order SO-MASS for 12.000 kft in fulfillment_status OPEN with no shipments."
            - "Rod lot of 20000.00 lbs at status RECEIVED with remaining_lbs 20000.00, committed_lbs 0.00, scrapped_lbs 0.00."
            - "Two QUEUED lots are allocated from it: LOT-MASS-A 7000 ft (138.60 lbs) on EXT-1 and LOT-MASS-B 5000 ft (99.00 lbs) on EXT-2, leaving remaining_lbs 19762.40 and committed_lbs 237.60."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
            - call: "POST /metal-price-quotes"
              payload: { metal: "COPPER", effective_date: "2026-07-30", settlement_price_usd_per_lb: 4.10, source: "COMEX" }
              as: ProcurementBuyer
            - call: "POST /compounds"
              payload: { compound_code: "PVC-90-INS", layer_role: "INSULATION", temp_rating_c: 90, flame_test: "VW_1", max_voltage_v: 600, wet_rated: true, filler_pct: 12.5 }
              as: ProcessEngineer
              captures: { ins_id: $.data.id }
            - call: "POST /compounds/${ins_id}/qualify"
              payload: {}
              as: ProcessEngineer
            - call: "POST /compounds"
              payload: { compound_code: "NYL-JKT", layer_role: "JACKET", temp_rating_c: 90, flame_test: "VW_1", max_voltage_v: 600, wet_rated: true, filler_pct: 5.0 }
              as: ProcessEngineer
              captures: { jkt_id: $.data.id }
            - call: "POST /compounds/${jkt_id}/qualify"
              payload: {}
              as: ProcessEngineer
            - call: "POST /listing-certifications"
              payload: { agency: "UL", file_number: "E12345", product_family_code: "BLDG-WIRE", initial_listing_date: "2026-06-01", inspection_interval_days: 90 }
              as: CertificationOfficer
              captures: { cert_id: $.data.id }
            - call: "POST /listing-certifications/${cert_id}/inspections"
              payload: { inspection_date: "2026-06-05", inspector_code: "INS-7", findings_count: 0, outcome: "PASS" }
              as: CertificationOfficer
            - call: "POST /catalog-products"
              payload: { product_code: "THHN-12-CU", awg_size: "12", conductor_metal: "COPPER", conductor_construction: "STRANDED_7", application_rating: "THHN", voltage_class: "LV_600", temp_rating_c: 90, insulation_thickness_mils: 28, conductor_lbs_per_kft: 19.8, insulation_compound_id: "${ins_id}", jacket_compound_id: "${jkt_id}", listing_certification_id: "${cert_id}", base_target_kft: 100.0 }
              as: ProcessEngineer
              captures: { prod_id: $.data.id }
            - call: "POST /catalog-products/${prod_id}/release"
              payload: {}
              as: ProcessEngineer
            - call: "POST /customers"
              payload: { account_code: "ACME", name: "Acme Electric Supply", market_region: "MIDWEST", credit_limit_usd: 100000.00, pass_through_enabled: true, reel_program: "RETURNABLE" }
              as: BillingAnalyst
              captures: { cust_id: $.data.id }
            - call: "POST /customer-orders"
              payload: { customer_id: "${cust_id}", product_id: "${prod_id}", order_number: "SO-MASS", ordered_kft: 12.000, price_basis: "ORDER_DATE_LOCK", conversion_price_usd_per_kft: 85.00, order_date: "2026-07-30" }
              as: BillingAnalyst
              captures: { ord_id: $.data.id }
            - call: "POST /rod-purchase-lots"
              payload: { metal: "COPPER", supplier_code: "SUP-1", rod_diameter_mm: 8.0, heat_number: "H-77Q", purchase_weight_lbs: 20000.00, purchase_price_usd_per_lb: 4.05, pricing_basis: "SPOT", received_date: "2026-07-25" }
              as: ProcurementBuyer
              captures: { rod_id: $.data.id, rod_v1: $.data.version }
            - call: "POST /production-lots"
              payload: { product_id: "${prod_id}", rod_lot_id: "${rod_id}", order_id: "${ord_id}", lot_code: "LOT-MASS-A", planned_length_ft: 7000, line_code: "EXT-1", scheduled_start_at: "2026-08-02T08:00:00Z", scheduled_end_at: "2026-08-02T12:00:00Z", expected_rod_lot_version: "${rod_v1}" }
              as: ProcessEngineer
              captures: { lot_a: $.data.id }
            - call: "GET /rod-purchase-lots/${rod_id}"
              payload: {}
              as: ProcurementBuyer
              captures: { rod_v2: $.data.version }
            - call: "POST /production-lots"
              payload: { product_id: "${prod_id}", rod_lot_id: "${rod_id}", order_id: "${ord_id}", lot_code: "LOT-MASS-B", planned_length_ft: 5000, line_code: "EXT-2", scheduled_start_at: "2026-08-02T08:00:00Z", scheduled_end_at: "2026-08-02T12:00:00Z", expected_rod_lot_version: "${rod_v2}" }
              as: ProcessEngineer
              captures: { lot_b: $.data.id }
            - call: "GET /rod-purchase-lots/${rod_id}"
              payload: {}
              as: ProcurementBuyer
              captures: { rod_v3: $.data.version }
          trigger:
            - call: "POST /customer-orders/${ord_id}/cancel"
              payload: { reason: "contractor pulled the project" }
              as: BillingAnalyst
            - call: "GET /rod-purchase-lots/${rod_id}"
              payload: {}
              as: ProcurementBuyer
              captures: { rod_v4: $.data.version }
          assert:
            - "pre-allocation: RodPurchaseLot.${rod_id} has remaining_lbs 20000.00, committed_lbs 0.00, scrapped_lbs 0.00, and 20000.00 == 20000.00 + 0.00 + 0.00"
            - "after allocating LOT-MASS-A: remaining_lbs 19861.40, committed_lbs 138.60, scrapped_lbs 0.00, and 20000.00 == 19861.40 + 138.60 + 0.00; ProductionLot.${lot_a}.consumed_rod_lbs == 138.60"
            - "after allocating LOT-MASS-B: remaining_lbs 19762.40, committed_lbs 237.60, scrapped_lbs 0.00, and 20000.00 == 19762.40 + 237.60 + 0.00; ProductionLot.${lot_b}.consumed_rod_lbs == 99.00"
            - "after the cancellation: RodPurchaseLot.${rod_id}.remaining_lbs == 20000.00 exactly, committed_lbs == 0.00, scrapped_lbs == 0.00 - the invariant is restored to the pre-allocation state with no rounding drift"
            - "the compensation is NOT the scrap path: scrapped_lbs stays 0.00 and RodPurchaseLot.${rod_id}.status stays RECEIVED, so scrap_pct is 0.00 and no quarantine cascade fires"
            - "both lots closed without being scrapped: ProductionLot.${lot_a}.process_state == SCRAP_CLOSED with quality_state == PENDING, and likewise for ${lot_b}; consumed_rod_lbs is retained on each lot as the historical record of what was returned"
            - "CustomerOrder.${ord_id}.fulfillment_status == CANCELLED while pricing_status is left at QUOTED (the cancellation compensates metal, not money)"
            - "version accounting proves each move was a distinct write: ${rod_v4} is greater than ${rod_v3}, which is greater than ${rod_v2}, which is greater than ${rod_v1}"
            - "the invariant is not restorable from a drawn lot: had either lot advanced past QUEUED it would have been skipped by the compensating cascade, leaving its pounds in committed_lbs - the three-bucket sum still holds, but remaining_lbs does not return to 20000.00"

      - name: reel_deposit_money_conserved_across_two_refund_variants
        conserved_quantity: "Customer.deposit_charged_total_usd == reel_deposit_balance_usd + credit_memo_balance_usd + forfeited_deposit_total_usd (dollars of deposit, a monetary quantity)"
        grounds:
          - calculations.reel_deposit_refund
          - calculations.customer_credit_exposure
          - state_machines.Reel.RETURN_PENDING_to_AVAILABLE
          - endpoints.POST_/reels/{id}/returns
        distinguishing_aspect: |
          A different conserved quantity - MONEY rather than mass - split across a
          different set of buckets (outstanding deposit, credit memo owed back,
          and permanently forfeited). What makes it harder than the mass ledger is
          that the split between the last two buckets is decided by the refund
          VARIANT, so two reels carrying identical 450.00 deposits and identical
          120-day tenures split differently (225.00/225.00 versus 234.00/216.00)
          while the total stays pinned at 900.00. Conservation must hold after the
          first return as well as the second, and credit_exposure_usd must be
          re-derived from the new bucket values each time.
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z; copper 2026-07-30 at 4.10; QUALIFIED compounds; ACTIVE UL file; RELEASED SKU THHN-12-CU."
            - "Customer ACME with credit_limit_usd 100000.00 and reel_program true; all four deposit ledger fields start at 0.00."
            - "Order SO-DEP for 10.000 kft ORDER_DATE_LOCK at conversion 85.00, price-locked; quoted_total_usd 1089.16."
            - "Two 5000 ft lots produced on EXT-1 and EXT-2, tested by qe-001 and released by qe-002."
            - "Reel R-DEP-WOOD (WOOD_RETURNABLE, deposit_usd 450.00) and reel R-DEP-STEEL (STEEL_RETURNABLE, deposit_usd 450.00), each loaded with one lot."
            - "The clock advances to 2026-08-05T10:00:00Z; both shipments are created (ship_date 2026-08-05) and invoiced at 544.58 each, so shipped_at is 2026-08-05T10:00:00Z on both reels and both reach RETURN_PENDING."
            - "The clock then advances to 2026-12-03T12:00:00Z, exactly 120 calendar days after 2026-08-05, and both reels are received back in condition GOOD."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
            - call: "POST /metal-price-quotes"
              payload: { metal: "COPPER", effective_date: "2026-07-30", settlement_price_usd_per_lb: 4.10, source: "COMEX" }
              as: ProcurementBuyer
            - call: "POST /compounds"
              payload: { compound_code: "PVC-90-INS", layer_role: "INSULATION", temp_rating_c: 90, flame_test: "VW_1", max_voltage_v: 600, wet_rated: true, filler_pct: 12.5 }
              as: ProcessEngineer
              captures: { ins_id: $.data.id }
            - call: "POST /compounds/${ins_id}/qualify"
              payload: {}
              as: ProcessEngineer
            - call: "POST /compounds"
              payload: { compound_code: "NYL-JKT", layer_role: "JACKET", temp_rating_c: 90, flame_test: "VW_1", max_voltage_v: 600, wet_rated: true, filler_pct: 5.0 }
              as: ProcessEngineer
              captures: { jkt_id: $.data.id }
            - call: "POST /compounds/${jkt_id}/qualify"
              payload: {}
              as: ProcessEngineer
            - call: "POST /listing-certifications"
              payload: { agency: "UL", file_number: "E12345", product_family_code: "BLDG-WIRE", initial_listing_date: "2026-06-01", inspection_interval_days: 90 }
              as: CertificationOfficer
              captures: { cert_id: $.data.id }
            - call: "POST /listing-certifications/${cert_id}/inspections"
              payload: { inspection_date: "2026-06-05", inspector_code: "INS-7", findings_count: 0, outcome: "PASS" }
              as: CertificationOfficer
            - call: "POST /catalog-products"
              payload: { product_code: "THHN-12-CU", awg_size: "12", conductor_metal: "COPPER", conductor_construction: "STRANDED_7", application_rating: "THHN", voltage_class: "LV_600", temp_rating_c: 90, insulation_thickness_mils: 28, conductor_lbs_per_kft: 19.8, insulation_compound_id: "${ins_id}", jacket_compound_id: "${jkt_id}", listing_certification_id: "${cert_id}", base_target_kft: 100.0 }
              as: ProcessEngineer
              captures: { prod_id: $.data.id }
            - call: "POST /catalog-products/${prod_id}/release"
              payload: {}
              as: ProcessEngineer
            - call: "POST /customers"
              payload: { account_code: "ACME", name: "Acme Electric Supply", market_region: "MIDWEST", credit_limit_usd: 100000.00, pass_through_enabled: true, reel_program: "RETURNABLE" }
              as: BillingAnalyst
              captures: { cust_id: $.data.id }
            - call: "POST /customer-orders"
              payload: { customer_id: "${cust_id}", product_id: "${prod_id}", order_number: "SO-DEP", ordered_kft: 10.000, price_basis: "ORDER_DATE_LOCK", conversion_price_usd_per_kft: 85.00, order_date: "2026-07-30" }
              as: BillingAnalyst
              captures: { ord_id: $.data.id }
            - call: "POST /customer-orders/${ord_id}/price-lock"
              payload: {}
              as: BillingAnalyst
            - call: "POST /rod-purchase-lots"
              payload: { metal: "COPPER", supplier_code: "SUP-1", rod_diameter_mm: 8.0, heat_number: "H-77Q", purchase_weight_lbs: 20000.00, purchase_price_usd_per_lb: 4.05, pricing_basis: "SPOT", received_date: "2026-07-25" }
              as: ProcurementBuyer
              captures: { rod_id: $.data.id, rod_v1: $.data.version }
            - call: "POST /production-lots"
              payload: { product_id: "${prod_id}", rod_lot_id: "${rod_id}", order_id: "${ord_id}", lot_code: "LOT-DEP-A", planned_length_ft: 5000, line_code: "EXT-1", scheduled_start_at: "2026-08-02T08:00:00Z", scheduled_end_at: "2026-08-02T12:00:00Z", expected_rod_lot_version: "${rod_v1}" }
              as: ProcessEngineer
              captures: { lot_a: $.data.id }
            - call: "GET /rod-purchase-lots/${rod_id}"
              payload: {}
              as: ProcurementBuyer
              captures: { rod_v2: $.data.version }
            - call: "POST /production-lots"
              payload: { product_id: "${prod_id}", rod_lot_id: "${rod_id}", order_id: "${ord_id}", lot_code: "LOT-DEP-B", planned_length_ft: 5000, line_code: "EXT-2", scheduled_start_at: "2026-08-02T08:00:00Z", scheduled_end_at: "2026-08-02T12:00:00Z", expected_rod_lot_version: "${rod_v2}" }
              as: ProcessEngineer
              captures: { lot_b: $.data.id }
            - call: "POST /production-lots/${lot_a}/process-steps"
              payload: { step: "DRAWING" }
              as: ProcessEngineer
            - call: "POST /production-lots/${lot_a}/process-steps"
              payload: { step: "STRANDING" }
              as: ProcessEngineer
            - call: "POST /production-lots/${lot_a}/process-steps"
              payload: { step: "EXTRUSION", measured_min_wall_mils: 25.5, measured_max_wall_mils: 30.0, measured_avg_od_mm: 4.10, surface_marking_text: "UL E12345 12AWG THHN 90C 600V" }
              as: ProcessEngineer
            - call: "POST /production-lots/${lot_a}/tests"
              payload: { test_type: "SPARK", faults_detected: 0, duration_sec: 60 }
              as: QualityEngineer
              as_user_id: "qe-001"
            - call: "POST /production-lots/${lot_a}/tests"
              payload: { test_type: "HIPOT", test_voltage_kv: 2.5, breakdown_detected: false, duration_sec: 300 }
              as: QualityEngineer
              as_user_id: "qe-001"
            - call: "POST /production-lots/${lot_a}/release"
              payload: { packaged_length_ft: 5000 }
              as: QualityEngineer
              as_user_id: "qe-002"
            - call: "POST /production-lots/${lot_b}/process-steps"
              payload: { step: "DRAWING" }
              as: ProcessEngineer
            - call: "POST /production-lots/${lot_b}/process-steps"
              payload: { step: "STRANDING" }
              as: ProcessEngineer
            - call: "POST /production-lots/${lot_b}/process-steps"
              payload: { step: "EXTRUSION", measured_min_wall_mils: 25.5, measured_max_wall_mils: 30.0, measured_avg_od_mm: 4.10, surface_marking_text: "UL E12345 12AWG THHN 90C 600V" }
              as: ProcessEngineer
            - call: "POST /production-lots/${lot_b}/tests"
              payload: { test_type: "SPARK", faults_detected: 0, duration_sec: 60 }
              as: QualityEngineer
              as_user_id: "qe-001"
            - call: "POST /production-lots/${lot_b}/tests"
              payload: { test_type: "HIPOT", test_voltage_kv: 2.5, breakdown_detected: false, duration_sec: 300 }
              as: QualityEngineer
              as_user_id: "qe-001"
            - call: "POST /production-lots/${lot_b}/release"
              payload: { packaged_length_ft: 5000 }
              as: QualityEngineer
              as_user_id: "qe-002"
            - call: "POST /reels"
              payload: { reel_serial: "R-DEP-WOOD", reel_type: "WOOD_RETURNABLE", deposit_usd: 450.00, capacity_ft: 6000 }
              as: ShippingClerk
              captures: { reel_wood: $.data.id }
            - call: "POST /reels/${reel_wood}/load"
              payload: { lot_id: "${lot_a}", load_length_ft: 5000, occupancy_start_at: "2026-08-03T00:00:00Z" }
              as: ShippingClerk
            - call: "POST /reels"
              payload: { reel_serial: "R-DEP-STEEL", reel_type: "STEEL_RETURNABLE", deposit_usd: 450.00, capacity_ft: 6000 }
              as: ShippingClerk
              captures: { reel_steel: $.data.id }
            - call: "POST /reels/${reel_steel}/load"
              payload: { lot_id: "${lot_b}", load_length_ft: 5000, occupancy_start_at: "2026-08-03T00:00:00Z" }
              as: ShippingClerk
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T10:00:00Z" }
              as: PlantAdmin
            - call: "GET /customer-orders/${ord_id}"
              payload: {}
              as: ShippingClerk
              captures: { ord_v2: $.data.version }
            - call: "POST /shipments"
              payload: { order_id: "${ord_id}", lot_id: "${lot_a}", reel_id: "${reel_wood}", shipped_length_ft: 5000, ship_date: "2026-08-05", expected_order_version: "${ord_v2}" }
              as: ShippingClerk
              captures: { ship_wood: $.data.id }
            - call: "GET /customer-orders/${ord_id}"
              payload: {}
              as: ShippingClerk
              captures: { ord_v3: $.data.version }
            - call: "POST /shipments"
              payload: { order_id: "${ord_id}", lot_id: "${lot_b}", reel_id: "${reel_steel}", shipped_length_ft: 5000, ship_date: "2026-08-05", expected_order_version: "${ord_v3}" }
              as: ShippingClerk
              captures: { ship_steel: $.data.id }
            - call: "POST /shipments/${ship_wood}/invoice"
              payload: {}
              as: BillingAnalyst
            - call: "POST /shipments/${ship_steel}/invoice"
              payload: {}
              as: BillingAnalyst
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-12-03T12:00:00Z" }
              as: PlantAdmin
          trigger:
            - call: "POST /reels/${reel_wood}/returns"
              payload: { shipment_id: "${ship_wood}", returned_date: "2026-12-03", condition: "GOOD" }
              as: ShippingClerk
              captures: { ret_wood: $.data.id }
            - call: "POST /reels/${reel_steel}/returns"
              payload: { shipment_id: "${ship_steel}", returned_date: "2026-12-03", condition: "GOOD" }
              as: ShippingClerk
              captures: { ret_steel: $.data.id }
          assert:
            - "after both shipments: Customer.${cust_id}.deposit_charged_total_usd == 900.00, reel_deposit_balance_usd == 900.00, credit_memo_balance_usd == 0.00, forfeited_deposit_total_usd == 0.00, and 900.00 == 900.00 + 0.00 + 0.00"
            - "after both invoices: Customer.${cust_id}.open_ar_usd == 1089.16 and credit_exposure_usd == 1989.16 (1089.16 + 900.00 - 0.00); the deposit invariant is unchanged because invoicing moves AR, not deposits"
            - "flat-step return: ReelReturn.${ret_wood}.days_out == 120, refund_variant_applied == FLAT_STEP, refund_usd == 225.00, forfeited_usd == 225.00 (90 < 120 <= 180 halves the deposit)"
            - "conservation holds mid-way: after the wood return Customer.${cust_id} has deposit_charged_total_usd 900.00 == reel_deposit_balance_usd 450.00 + credit_memo_balance_usd 225.00 + forfeited_deposit_total_usd 225.00"
            - "exposure re-derived mid-way: Customer.${cust_id}.credit_exposure_usd == 1314.16 (1089.16 + 450.00 - 225.00)"
            - "daily-decay return: ReelReturn.${ret_steel}.days_out == 120, refund_variant_applied == DAILY_DECAY, refund_usd == 234.00 (450.00 * max(0.30, 1 - 0.004 * 120) == 450.00 * 0.52) and forfeited_usd == 216.00"
            - "conservation holds at the end: 900.00 == reel_deposit_balance_usd 0.00 + credit_memo_balance_usd 459.00 + forfeited_deposit_total_usd 441.00"
            - "the total is variant-independent while the split is not: the same 900.00 charged splits 459.00/441.00 here, but would have split 450.00/450.00 had both reels been WOOD_RETURNABLE and 468.00/432.00 had both been STEEL_RETURNABLE"
            - "exposure at the end: Customer.${cust_id}.credit_exposure_usd == 630.16 (1089.16 + 0.00 - 459.00) with status ACTIVE"
            - "deposit_charged_total_usd is a monotone accumulator, never reversed: it stays 900.00 through both returns, which is what makes the three-bucket identity a compensating invariant rather than a simple running balance"
            - "both reels are back in the pool: Reel.${reel_wood}.status == AVAILABLE with cycle_count 1 and loaded_length_ft 0, likewise Reel.${reel_steel}"
