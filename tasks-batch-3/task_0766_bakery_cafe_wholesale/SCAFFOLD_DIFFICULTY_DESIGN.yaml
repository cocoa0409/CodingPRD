  # =========================================================================
  # Rule 8 — resource temporal-overlap conflicts across different interval semantics
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: route_stop_window_halfopen_overlap
        grounds:
          - validations[priority=7]
          - entities.RouteStop.fields.arrival_window_start
          - entities.RouteStop.fields.arrival_window_end
        distinguishing_aspect: "Half-open [start,end) route-stop semantics: an adjacent stop starting exactly at another's end (09:00) is accepted, but a stop overlapping the interior (08:30-09:30) is rejected ERR_STOP_WINDOW_OVERLAP; resource is DeliveryRoute."
        test_recipe:
          setup:
            - "Committed line par 30; three orders qty 2; a route with two accepted stops [08:00,09:00) and [09:00,10:00)."
          setup_api_calls:
