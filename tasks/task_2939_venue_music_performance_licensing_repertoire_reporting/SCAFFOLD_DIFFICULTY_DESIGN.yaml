      - name: conflict_safety_beats_fiscal_on_license_renew
        grounds:
          - validations.priority_9_ERR_AUDIT_HOLD_ACTIVE
          - validations.priority_20_ERR_OUTSTANDING_BALANCE_BLOCKS_RENEWAL
          - state_machines.AuditCase.OPEN_to_CLOSED_NO_ACTION
          - concurrency_rules.renewal-create-stale-license
        distinguishing_aspect: |
          A different error-category pair (business_safety, business_fiscal) on a different endpoint:
          priority 9 ERR_AUDIT_HOLD_ACTIVE must beat priority 20
          ERR_OUTSTANDING_BALANCE_BLOCKS_RENEWAL on POST /licensing/licenses/{id}/renew. V2's
          activation left outstanding_balance_cents at 1335461, far above
          RENEWAL_OUTSTANDING_LIMIT_CENTS 100000, and a ROUTINE audit case simultaneously holds the
          venue. Closing the case with NO_GAP_FOUND clears only the safety failure, so the identical
          renewal call then surfaces the fiscal error.
        test_recipe:
          setup:
            - "License L2 of Venue V2 (CONCERT_HALL) is ACTIVE with annual_fee_cents 1335461, term 2026-08-01 to 2027-08-01, and one ISSUED INITIAL assessment of 1335461 cents"
            - "Venue V2.outstanding_balance_cents == 1335461, which exceeds RENEWAL_OUTSTANDING_LIMIT_CENTS 100000"
            - "An OPEN ROUTINE AuditCase exists for V2, so V2.audit_hold == true"
