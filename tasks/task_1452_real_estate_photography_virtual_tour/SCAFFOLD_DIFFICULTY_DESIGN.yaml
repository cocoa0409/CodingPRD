      - name: agent_credit_balance_conserved_across_weather_credit_and_invoice_application
        grounds:
          - calculations.weather_reschedule_credit
          - calculations.final_invoice
          - entities.ClientAgent.fields.credit_balance_cents
          - entities.ShootBooking.fields.weather_credit_cents
        distinguishing_aspect: |
          Conserved quantity #2: the sum (booking.weather_credit_cents +
          agent.credit_balance_cents + invoice_credit_applied) across a weather
          credit accrual and its later application at invoice acceptance — credit
          is neither created nor destroyed: the amount deducted from
          final_invoice_cents equals the amount removed from the booking's
          weather_credit_cents (different conserved quantity than photographer
          minutes: money vs time).
        test_recipe:
          setup:
            - "Market ATX multiplier 12500, weather bps 1000; photographer P; agent A with credit_balance_cents=0"
            - "Booking STANDARD 30 photos (quote 20625), pipeline to CONFIRMED, one WEATHER reschedule (credit 2063), re-confirm, mark-shot, on-time deliver"
