# =============================================================================
# PRD Benchmark seed tables — Cement Plant & Kiln Operations (task 2971)
# §1.0–§1.7. §1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml,
# §1.9 lives in SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  2971. Cement Plant & Kiln Operations (portland cement plant): quarry raw mix design with
  chemical module targets and pile blending, raw mill and kiln feed control with alternative
  raw material substitution, kiln pyroprocessing with fuel mix, clinker quality and free lime
  control, alternative fuel usage with emissions permit constraints and burn testing, finish
  mill grinding to fineness targets by cement type with additive proportioning, cement quality
  certification and mill certificate issuance to customers, silo inventory management, bulk
  loadout and terminal distribution planning, kiln outage scheduling with refractory
  replacement and demand seasonality

domain_name: cement-plant-kiln-operations
api_prefix: /cement-ops

# =============================================================================
# Step 0: Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: flat
  # Every entity is a peer addressed at `<api_prefix>/<collection>/{id}`; parentage is
  # expressed purely through FK fields in request bodies, never through nested URLs.

  state_machine_shape: parallel
  # KilnRun carries two independent dimensions (process_state x quality_state); RawMixDesign
  # is cyclic (SUBMITTED -> REVISION_REQUESTED -> DRAFT -> SUBMITTED); CementBatch is a
  # fork-join (two qualification branches converge on QUALIFIED); BurnTest branches with
  # divergent side-effect sets; Silo cycles OPEN <-> BLOCKED.

  relationship_patterns:
    - one_to_many          # Plant -> Silo/Kiln/RawMixDesign/CementBatch
    - cross_aggregate      # CementBatch -> Silo, LoadoutOrder -> MillCertificate
    - self_referential     # RawMixDesign.superseded_by_design_id -> RawMixDesign.id
    - polymorphic          # LabTest subject is exactly one of KilnRun | CementBatch

  role_model: segregation_of_duties
  # The user who records a lab result may not adjudicate/certify on the same subject; the
  # engineer who authors a raw mix design may not approve it. Enforced on X-User-ID, not role.

  consistency_model: immediate
  difficulty_level: expert_plus

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: Plant
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Plant name" }
      - { name: region_code, type: string, source: input, description: "Market region code, e.g. US-MW" }
      - { name: permit_nox_kg_per_tonne_clinker_cap, type: number, source: input, description: "Air permit ceiling on the ROLLING 30-day NOx intensity (kg NOx per tonne clinker). Gates clinker release." }
      - { name: permit_annual_nox_budget_kg, type: number, source: input, description: "Annual mass-based NOx allowance in kg granted by the permit" }
      - { name: permit_nox_budget_remaining_kg, type: number, source: computed, description: "= permit_annual_nox_budget_kg - sum(KilnRun.nox_emitted_kg) over runs with process_state IN {SCHEDULED, BURNING, COMPLETED} on kilns of this plant" }
      - { name: permit_max_tsr_pct, type: number, source: input, description: "Permit ceiling on thermal substitution rate (percent of kiln thermal energy from alternative fuels)" }
      - { name: permit_max_chlorine_kg_per_run, type: number, source: input, description: "Permit ceiling on total chlorine input (kg) charged into one KilnRun" }
      - { name: peak_season_months, type: array, source: input, description: "Integers 1-12 marking peak cement-demand months; outages intersecting these months need an override" }
      - { name: clinker_free_lime_max_pct, type: number, source: input, description: "Maximum acceptable clinker free lime (percent). Inclusive ceiling." }
      - { name: rolling_nox_intensity_kg_per_tonne, type: number, source: computed, description: "Rolling-window NOx intensity per calculations.nox_emission_intensity variant plant_rolling_window; 3 decimals" }
      - { name: cement_tonne_balance_tonnes, type: number, source: computed, description: "Conserved cement mass: sum(Silo.tonnes_on_hand where material_kind=CEMENT) + sum(LoadoutOrder.loaded_tonnes where status=COMPLETED); 2 decimals" }
      - { name: production_posture, type: enum, source: computed, default: NORMAL, description: "NORMAL | CONSTRAINED — CONSTRAINED while at least one CementBatch of this plant has feed_state=FEED_SHORT" }

  - name: RawMaterial
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "Quarry/vendor material code, globally unique" }
      - { name: category, type: enum, source: input, description: "LIMESTONE | CLAY | IRON_ORE | SAND | ALT_RAW" }
      - { name: cao_pct, type: number, source: input, description: "CaO content, dry basis, percent" }
      - { name: sio2_pct, type: number, source: input, description: "SiO2 content, dry basis, percent" }
      - { name: al2o3_pct, type: number, source: input, description: "Al2O3 content, dry basis, percent" }
      - { name: fe2o3_pct, type: number, source: input, description: "Fe2O3 content, dry basis, percent" }
      - { name: so3_pct, type: number, source: input, description: "SO3 content, dry basis, percent" }
      - { name: moisture_pct, type: number, source: input, description: "Free moisture as delivered, percent of as-received mass" }
      - { name: cost_per_tonne, type: number, source: input, description: "Delivered cost per as-received tonne" }
      - { name: is_alternative, type: boolean, source: input, default: false, description: "True for alternative raw materials (fly ash, slag, foundry sand) subject to substitution caps" }
      - { name: max_substitution_pct, type: number, source: input, default: 0, description: "Maximum share of a pile's AS-RECEIVED tonnage this material may occupy; only meaningful when is_alternative is true" }

  - name: Fuel
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "Fuel code, globally unique" }
      - { name: category, type: enum, source: input, description: "COAL | PETCOKE | NATURAL_GAS | RDF | TDF | BIOMASS" }
      - { name: lhv_gj_per_tonne, type: number, source: input, description: "Lower heating value, GJ per tonne as fired" }
      - { name: nox_kg_per_gj, type: number, source: input, description: "NOx emission factor, kg per GJ of fuel energy" }
      - { name: co2_kg_per_gj, type: number, source: input, description: "CO2 emission factor, kg per GJ of fuel energy" }
      - { name: chlorine_pct, type: number, source: input, description: "Chlorine content, percent of as-fired mass" }
      - { name: is_alternative, type: boolean, source: input, default: false, description: "True for alternative fuels; charging one requires an AUTHORIZED, unexpired BurnTest" }

  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Customer legal name" }
      - { name: region_code, type: string, source: input, description: "Delivery region code" }
      - { name: contract_state, type: enum, source: input, default: ACTIVE, description: "ACTIVE | SUSPENDED — only ACTIVE customers enter distribution planning" }
      - { name: contract_priority, type: integer, source: input, description: "Allocation priority; HIGHER value is served first in the distribution waterfall" }
      - { name: contract_monthly_tonnes, type: number, source: input, description: "Contracted base monthly tonnage before seasonal factor" }
      - { name: required_cement_type, type: enum, source: input, description: "TYPE_I | TYPE_IL | TYPE_II | TYPE_III — the only cement type this customer accepts" }
      - { name: max_so3_pct, type: number, source: input, description: "Customer specification ceiling on cement SO3, percent" }
      - { name: credit_hold, type: boolean, source: input, default: false, description: "True suspends the customer from distribution planning and from new loadout orders" }
      - { name: open_reserved_tonnes, type: number, source: computed, description: "= sum(LoadoutOrder.tonnes) for this customer with status IN {RESERVED, LOADING}; 2 decimals" }
      - { name: lifetime_loaded_tonnes, type: number, source: computed, default: 0, description: "= sum(LoadoutOrder.loaded_tonnes) for this customer with status == COMPLETED; decremented when a COMPLETED order is voided; 2 decimals" }

  - name: RawMixDesign
    parent: null
    common_fields: true
    fields:
      - { name: plant_id, type: string, source: input, description: "FK -> Plant.id; plant this design belongs to" }
      - { name: code, type: string, source: input, description: "Design code, unique per plant" }
      - { name: target_lsf, type: number, source: input, description: "Target lime saturation factor (percent)" }
      - { name: target_sm, type: number, source: input, description: "Target silica modulus" }
      - { name: target_am, type: number, source: input, description: "Target alumina modulus" }
      - { name: module_tolerance_lsf, type: number, source: input, default: 1.50, description: "Allowed |as_designed_lsf - target_lsf| at submit time" }
      - { name: pile_lsf_tolerance, type: number, source: input, default: 2.00, description: "Allowed |BlendedPile.as_blended_lsf - target_lsf| at pile seal time" }
      - { name: components, type: array, source: input, description: "Ordered array of objects { raw_material_id: string, mass_fraction_pct: number }; DRY-basis mass fractions that must sum to exactly 100.00" }
      - { name: as_designed_cao_pct, type: number, source: computed, description: "Mass-fraction-weighted CaO over components, 4 decimals" }
      - { name: as_designed_sio2_pct, type: number, source: computed, description: "Mass-fraction-weighted SiO2 over components, 4 decimals" }
      - { name: as_designed_al2o3_pct, type: number, source: computed, description: "Mass-fraction-weighted Al2O3 over components, 4 decimals" }
      - { name: as_designed_fe2o3_pct, type: number, source: computed, description: "Mass-fraction-weighted Fe2O3 over components, 4 decimals" }
      - { name: as_designed_lsf, type: number, source: computed, description: "calculations.raw_mix_chemical_modules variant as_designed, LSF, 2 decimals" }
      - { name: as_designed_sm, type: number, source: computed, description: "calculations.raw_mix_chemical_modules variant as_designed, silica modulus, 2 decimals" }
      - { name: as_designed_am, type: number, source: computed, description: "calculations.raw_mix_chemical_modules variant as_designed, alumina modulus, 2 decimals" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | SUBMITTED | REVISION_REQUESTED | APPROVED | SUPERSEDED" }
      - { name: revision_count, type: integer, source: system, default: 0, description: "Number of completed revision rounds; the 4th request-revision is refused" }
      - { name: revision_reason, type: string, source: input, description: "Reason recorded by the QualityManager on the latest request-revision" }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of the ProcessEngineer who created the design; drives segregation of duties on approve" }
      - { name: approved_by_user_id, type: string, source: system, description: "X-User-ID of the QualityManager who approved the design" }
      - { name: approved_at, type: datetime, source: system, description: "Logical-clock instant of approval, ISO 8601 UTC with three fractional digits" }
      - { name: active_pile_count, type: integer, source: computed, default: 0, description: "Count of BlendedPile rows referencing this design with status IN {OPEN, SEALED}" }
      - { name: superseded_by_design_id, type: string, source: system, description: "FK -> RawMixDesign.id; set when a newer design for the same plant is approved" }

  - name: BlendedPile
    parent: null
    common_fields: true
    fields:
      - { name: plant_id, type: string, source: input, description: "FK -> Plant.id; plant that owns the blending bed" }
      - { name: raw_mix_design_id, type: string, source: input, description: "FK -> RawMixDesign.id; design the pile is blended against" }
      - { name: pile_code, type: string, source: input, description: "Blending-bed pile label, unique per plant" }
      - { name: additions, type: array, source: system, description: "Append-only array of objects { raw_material_id: string, tonnes_as_received: number, moisture_pct: number, added_at: datetime } appended by POST /blended-piles/{id}/additions" }
      - { name: as_received_tonnes, type: number, source: computed, description: "= sum(additions[].tonnes_as_received), 2 decimals" }
      - { name: dry_tonnes, type: number, source: computed, description: "= sum(round(tonnes_as_received * (1 - moisture_pct/100), 2)) over additions, 2 decimals" }
      - { name: alt_raw_share_pct, type: number, source: computed, description: "AS-RECEIVED share of additions whose RawMaterial.is_alternative is true, = round(alt_as_received / as_received_tonnes * 100, 2)" }
      - { name: as_blended_cao_pct, type: number, source: computed, description: "Dry-mass-weighted CaO over additions, 4 decimals" }
      - { name: as_blended_sio2_pct, type: number, source: computed, description: "Dry-mass-weighted SiO2 over additions, 4 decimals" }
      - { name: as_blended_al2o3_pct, type: number, source: computed, description: "Dry-mass-weighted Al2O3 over additions, 4 decimals" }
      - { name: as_blended_fe2o3_pct, type: number, source: computed, description: "Dry-mass-weighted Fe2O3 over additions, 4 decimals" }
      - { name: as_blended_lsf, type: number, source: computed, description: "calculations.raw_mix_chemical_modules variant as_blended, LSF, 2 decimals" }
      - { name: as_blended_sm, type: number, source: computed, description: "calculations.raw_mix_chemical_modules variant as_blended, silica modulus, 2 decimals" }
      - { name: as_blended_am, type: number, source: computed, description: "calculations.raw_mix_chemical_modules variant as_blended, alumina modulus, 2 decimals" }
      - { name: lsf_deviation, type: number, source: computed, description: "= round(abs(as_blended_lsf - RawMixDesign.target_lsf), 2)" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN | SEALED | CONSUMED" }
      - { name: sealed_at, type: datetime, source: system, description: "Logical-clock instant of seal, ISO 8601 UTC with three fractional digits" }
      - { name: consumed_dry_tonnes, type: number, source: computed, default: 0, description: "Dry feed drawn by the KilnRun that consumed the pile, = round(KilnRun.clinker_tonnes * KILN_FEED_FACTOR, 2)" }

  - name: BurnTest
    parent: null
    common_fields: true
    fields:
      - { name: plant_id, type: string, source: input, description: "FK -> Plant.id; plant whose permit the trial burn is run under" }
      - { name: fuel_id, type: string, source: input, description: "FK -> Fuel.id; alternative fuel under test" }
      - { name: requested_max_tsr_pct, type: number, source: input, description: "Thermal substitution rate the plant is asking to be authorized for, percent" }
      - { name: valid_days, type: integer, source: input, description: "Authorization lifetime in days, counted from the adjudication instant" }
      - { name: status, type: enum, source: system, default: REQUESTED, description: "REQUESTED | IN_PROGRESS | RESULT_RECORDED | AUTHORIZED | REJECTED" }
      - { name: measured_chlorine_pct, type: number, source: input, description: "Chlorine measured in the fuel during the trial burn, percent" }
      - { name: measured_nox_kg_per_gj, type: number, source: input, description: "Stack NOx measured during the trial burn, kg per GJ" }
      - { name: stack_compliant, type: boolean, source: input, description: "Whether the stack test met the permit limits during the trial burn" }
      - { name: result_recorded_by_user_id, type: string, source: system, description: "X-User-ID of the LabTechnician who recorded the trial-burn result" }
      - { name: adjudicated_by_user_id, type: string, source: system, description: "X-User-ID of the EnvironmentalOfficer who adjudicated the test" }
      - { name: authorized_max_tsr_pct, type: number, source: system, default: 0, description: "Authorized substitution ceiling once AUTHORIZED; 0 while not authorized" }
      - { name: valid_from, type: datetime, source: system, description: "Authorization start instant, ISO 8601 UTC with three fractional digits" }
      - { name: valid_until, type: datetime, source: system, description: "= valid_from + valid_days days; the authorization is expired once clock >= valid_until" }
      - { name: decision_reason, type: string, source: input, description: "Free-text reason recorded on adjudication" }

  - name: Kiln
    parent: null
    common_fields: true
    fields:
      - { name: plant_id, type: string, source: input, description: "FK -> Plant.id; plant the kiln sits in" }
      - { name: code, type: string, source: input, description: "Kiln code, unique per plant" }
      - { name: nominal_shc_gj_per_tonne, type: number, source: input, description: "Nameplate specific heat consumption used ONLY for the provisional clinker estimate" }
      - { name: cooldown_buffer_hours, type: integer, source: input, description: "Hours of clearance required between any KilnRun window and any APPROVED/IN_PROGRESS KilnOutage window on this kiln" }
      - { name: reline_due_hours, type: integer, source: input, description: "Refractory service hours after which the kiln becomes RELINE_DUE" }
      - { name: refractory_hours_since_reline, type: integer, source: computed, default: 0, description: "Accumulated burning hours since the last completed refractory replacement" }
      - { name: availability_state, type: enum, source: computed, default: AVAILABLE, description: "AVAILABLE | RELINE_DUE | IN_OUTAGE — IN_OUTAGE while an outage on this kiln is IN_PROGRESS; RELINE_DUE once refractory_hours_since_reline >= reline_due_hours" }

  - name: KilnRun
    parent: null
    common_fields: true
    fields:
      - { name: kiln_id, type: string, source: input, description: "FK -> Kiln.id; kiln being fired" }
      - { name: blended_pile_id, type: string, source: input, description: "FK -> BlendedPile.id; sealed pile fed to the kiln" }
      - { name: clinker_silo_id, type: string, source: input, description: "FK -> Silo.id; CLINKER silo the released clinker is credited to" }
      - { name: window_start, type: datetime, source: input, description: "Scheduled firing window start, ISO 8601 UTC" }
      - { name: window_end, type: datetime, source: input, description: "Scheduled firing window end, ISO 8601 UTC, exclusive" }
      - { name: scheduled_hours, type: number, source: computed, description: "= (window_end - window_start) in hours, 2 decimals" }
      - { name: process_state, type: enum, source: system, default: SCHEDULED, description: "SCHEDULED | BURNING | COMPLETED | ABORTED — pyroprocessing dimension" }
      - { name: quality_state, type: enum, source: system, default: PENDING_LAB, description: "PENDING_LAB | QUARANTINED | RELEASED — clinker quality dimension, evolves independently of process_state" }
      - { name: fuel_charges, type: array, source: system, description: "Append-only array of objects { fuel_id: string, tonnes: number, energy_gj: number, charged_at: datetime } appended by POST /kiln-runs/{id}/fuel-charges" }
      - { name: gross_energy_gj, type: number, source: computed, description: "= sum(round(tonnes * Fuel.lhv_gj_per_tonne, 2)) over fuel_charges, 2 decimals" }
      - { name: provisional_clinker_tonnes, type: number, source: computed, description: "= round(gross_energy_gj / Kiln.nominal_shc_gj_per_tonne, 2); tier selector only, never the reported output" }
      - { name: effective_shc_gj_per_tonne, type: number, source: computed, description: "Tiered specific heat consumption selected from provisional_clinker_tonnes; see calculations.clinker_output_from_fuel_energy" }
      - { name: clinker_tonnes, type: number, source: computed, description: "= round(gross_energy_gj / effective_shc_gj_per_tonne, 2); single pass, never re-tiered" }
      - { name: tsr_pct, type: number, source: computed, default: 0, description: "Thermal substitution rate, percent; see calculations.thermal_substitution_rate" }
      - { name: nox_emitted_kg, type: number, source: computed, default: 0, description: "= sum(round(tonnes * lhv_gj_per_tonne * nox_kg_per_gj, 2)) over fuel_charges, 2 decimals; reset to 0 on abort" }
      - { name: chlorine_input_kg, type: number, source: computed, default: 0, description: "= sum(round(tonnes * chlorine_pct / 100 * 1000, 2)) over fuel_charges, 2 decimals" }
      - { name: nox_intensity_kg_per_tonne, type: number, source: computed, description: "calculations.nox_emission_intensity variant per_run_actual, 3 decimals" }
      - { name: nox_intensity_breach, type: boolean, source: computed, default: false, description: "True when nox_intensity_kg_per_tonne > Plant.permit_nox_kg_per_tonne_clinker_cap; informational flag only, does NOT gate release" }
      - { name: free_lime_pct, type: number, source: computed, description: "Value of the newest LabTest with test_type=FREE_LIME on this run, by created_at DESC" }
      - { name: lit_at, type: datetime, source: system, description: "Logical-clock instant the kiln was lit" }
      - { name: completed_at, type: datetime, source: system, description: "Logical-clock instant the run completed" }
      - { name: abort_reason, type: string, source: input, description: "Reason recorded on abort" }

  - name: KilnOutage
    parent: null
    common_fields: true
    fields:
      - { name: kiln_id, type: string, source: input, description: "FK -> Kiln.id; kiln taken down" }
      - { name: window_start, type: datetime, source: input, description: "Outage window start, ISO 8601 UTC" }
      - { name: window_end, type: datetime, source: input, description: "Outage window end, ISO 8601 UTC, exclusive" }
      - { name: scope, type: enum, source: input, description: "REFRACTORY | MECHANICAL | COMBINED" }
      - { name: peak_season_override, type: boolean, source: input, default: false, description: "PlantAdmin-only flag permitting a window that intersects a peak-demand month" }
      - { name: demand_season_class, type: enum, source: computed, description: "PEAK | SHOULDER | OFF — worst (highest-demand) class among the calendar months the window intersects" }
      - { name: status, type: enum, source: system, default: PLANNED, description: "PLANNED | APPROVED | IN_PROGRESS | COMPLETED" }
      - { name: refractory_replaced, type: boolean, source: input, default: false, description: "Recorded on complete; true resets Kiln.refractory_hours_since_reline to 0" }
      - { name: approved_by_user_id, type: string, source: system, description: "X-User-ID of the PlantAdmin who approved the outage" }
      - { name: started_at, type: datetime, source: system, description: "Logical-clock instant the outage started" }
      - { name: completed_at, type: datetime, source: system, description: "Logical-clock instant the outage completed" }

  - name: Silo
    parent: null
    common_fields: true
    fields:
      - { name: plant_id, type: string, source: input, description: "FK -> Plant.id; plant the silo belongs to" }
      - { name: code, type: string, source: input, description: "Silo code, unique per plant" }
      - { name: material_kind, type: enum, source: input, description: "CLINKER | CEMENT" }
      - { name: capacity_tonnes, type: number, source: input, description: "Physical capacity in tonnes" }
      - { name: tonnes_on_hand, type: number, source: computed, default: 0, description: "Physical stock in the silo, 2 decimals" }
      - { name: reserved_tonnes, type: number, source: computed, default: 0, description: "Stock promised to PLANNED CementBatch draws (CLINKER silos) or to RESERVED/LOADING LoadoutOrders (CEMENT silos), 2 decimals" }
      - { name: unreleased_tonnes, type: number, source: computed, default: 0, description: "Physically present but not sellable/usable: clinker of runs whose quality_state is PENDING_LAB or QUARANTINED (CLINKER silos), or cement of batches not yet QUALIFIED (CEMENT silos), 2 decimals" }
      - { name: available_tonnes, type: number, source: computed, default: 0, description: "= round(tonnes_on_hand - reserved_tonnes - unreleased_tonnes, 2); may go negative for one intermediate step inside a cascade, but is always recomputed to a final non-negative value once the cascade releases the reservations it invalidated" }
      - { name: loadout_spouts, type: integer, source: input, default: 1, description: "Number of loadout orders whose half-open windows may overlap on this silo" }
      - { name: draw_rate_tonnes_per_hour, type: number, source: input, description: "Maximum extraction rate; caps tonnes per loadout window" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN | BLOCKED — BLOCKED silos accept no new draws or loadout orders" }
      - { name: block_reason, type: string, source: input, description: "Reason recorded when the silo is blocked" }

  - name: CementBatch
    parent: null
    common_fields: true
    fields:
      - { name: plant_id, type: string, source: input, description: "FK -> Plant.id; plant that ground the batch" }
      - { name: clinker_silo_id, type: string, source: input, description: "FK -> Silo.id; CLINKER silo the batch draws from" }
      - { name: cement_silo_id, type: string, source: input, description: "FK -> Silo.id; CEMENT silo the ground cement is deposited into" }
      - { name: cement_type, type: enum, source: input, description: "TYPE_I | TYPE_IL | TYPE_II | TYPE_III" }
      - { name: clinker_tonnes_drawn, type: number, source: input, description: "Clinker tonnage reserved at creation and physically drawn at start-grinding" }
      - { name: gypsum_pct, type: number, source: input, description: "Gypsum share of total batch mass, percent; allowed range 2.00-7.00" }
      - { name: limestone_pct, type: number, source: input, description: "Interground limestone share of total batch mass, percent; capped by cement type" }
      - { name: blaine_target_m2_per_kg, type: integer, source: input, description: "Target fineness in m2/kg; must sit inside the cement type's Blaine band" }
      - { name: total_batch_tonnes, type: number, source: computed, description: "= round(clinker_tonnes_drawn / (1 - (gypsum_pct + limestone_pct)/100), 2); intermediate only" }
      - { name: gypsum_tonnes, type: number, source: computed, description: "= round(total_batch_tonnes * gypsum_pct / 100, 2)" }
      - { name: limestone_tonnes, type: number, source: computed, description: "= round(total_batch_tonnes * limestone_pct / 100, 2)" }
      - { name: cement_tonnes, type: number, source: computed, description: "= round(clinker_tonnes_drawn + gypsum_tonnes + limestone_tonnes, 2); may differ from total_batch_tonnes by rounding" }
      - { name: so3_pct, type: number, source: computed, description: "Blended SO3 of the finished cement, 2 decimals; see calculations.cement_additive_proportioning" }
      - { name: status, type: enum, source: system, default: PLANNED, description: "PLANNED | GRINDING | GROUND | QUALIFIED | CERTIFIED | REJECTED | DECERTIFIED" }
      - { name: strength_branch_state, type: enum, source: system, default: PENDING, description: "PENDING | PASSED | FAILED — 28-day compressive strength qualification branch" }
      - { name: fineness_branch_state, type: enum, source: system, default: PENDING, description: "PENDING | PASSED | FAILED — Blaine fineness qualification branch" }
      - { name: feed_state, type: enum, source: system, default: FEED_READY, description: "FEED_READY | FEED_SHORT — independent dimension tracking whether the reserved clinker is still backed by available stock" }
      - { name: certified_tonnes_allocated, type: number, source: computed, default: 0, description: "= sum(MillCertificate.certified_tonnes) for this batch with status IN {DRAFT, ISSUED}" }
      - { name: rejection_reason, type: enum, source: system, description: "STRENGTH_OUT_OF_SPEC | FINENESS_OUT_OF_SPEC; null unless status == REJECTED" }
      - { name: grinding_started_at, type: datetime, source: system, description: "Logical-clock instant of start-grinding; null before that" }
      - { name: ground_at, type: datetime, source: system, description: "Logical-clock instant of finish-grinding; null before that" }
      - { name: qualified_at, type: datetime, source: system, description: "Logical-clock instant at which the second lab branch passed; null until the join fires" }

  - name: LabTest
    parent: null
    common_fields: false
    fields:
      - { name: test_type, type: enum, source: input, description: "FREE_LIME | BLAINE | COMPRESSIVE_STRENGTH_28D" }
      - { name: kiln_run_id, type: string, source: input, description: "FK -> KilnRun.id; set for FREE_LIME tests, null otherwise" }
      - { name: cement_batch_id, type: string, source: input, description: "FK -> CementBatch.id; set for BLAINE and COMPRESSIVE_STRENGTH_28D tests, null otherwise" }
      - { name: value, type: number, source: input, description: "Measured value; percent for FREE_LIME, m2/kg for BLAINE, MPa for COMPRESSIVE_STRENGTH_28D" }
      - { name: unit, type: enum, source: computed, description: "PCT | M2_PER_KG | MPA — derived from test_type" }
      - { name: spec_min, type: number, source: computed, description: "Lower acceptance bound applied to value; null when the spec is one-sided upward" }
      - { name: spec_max, type: number, source: computed, description: "Upper acceptance bound applied to value; null when the spec is one-sided downward" }
      - { name: in_spec, type: boolean, source: computed, description: "True when value satisfies the inclusive bounds for the subject and test type" }
      - { name: recorded_by_user_id, type: string, source: system, description: "X-User-ID of the LabTechnician who recorded the test; drives segregation of duties on certificate issue" }

  - name: MillCertificate
    parent: null
    common_fields: true
    fields:
      - { name: cement_batch_id, type: string, source: input, description: "FK -> CementBatch.id; batch being certified" }
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; customer the certificate is issued to" }
      - { name: certified_tonnes, type: number, source: input, description: "Tonnage of the batch this certificate covers" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | ISSUED | REVOKED" }
      - { name: certified_blaine_m2_per_kg, type: number, source: computed, description: "Value of the batch's newest in-spec BLAINE LabTest, by created_at DESC" }
      - { name: certified_strength_mpa, type: number, source: computed, description: "Value of the batch's newest in-spec COMPRESSIVE_STRENGTH_28D LabTest, by created_at DESC" }
      - { name: certified_so3_pct, type: number, source: computed, description: "= CementBatch.so3_pct at issue time" }
      - { name: allocated_tonnes, type: number, source: computed, default: 0, description: "= sum(LoadoutOrder.tonnes) against this certificate with status IN {RESERVED, LOADING, COMPLETED}" }
      - { name: issued_by_user_id, type: string, source: system, description: "X-User-ID of the QualityManager who issued the certificate" }
      - { name: issued_at, type: datetime, source: system, description: "Logical-clock instant of issue" }
      - { name: revoke_reason, type: string, source: input, description: "Reason recorded on revoke" }
      - { name: revoked_at, type: datetime, source: system, description: "Logical-clock instant of revocation; null while the certificate is DRAFT or ISSUED" }

  - name: LoadoutOrder
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; customer collecting the cement" }
      - { name: cement_silo_id, type: string, source: input, description: "FK -> Silo.id; CEMENT silo the truck loads from" }
      - { name: mill_certificate_id, type: string, source: input, description: "FK -> MillCertificate.id; certificate covering the loaded cement" }
      - { name: window_start, type: datetime, source: input, description: "Loadout appointment start, ISO 8601 UTC, inclusive" }
      - { name: window_end, type: datetime, source: input, description: "Loadout appointment end, ISO 8601 UTC, exclusive" }
      - { name: scheduled_hours, type: number, source: computed, description: "= (window_end - window_start) in hours, 2 decimals" }
      - { name: tonnes, type: number, source: input, description: "Tonnage reserved for this appointment" }
      - { name: loaded_tonnes, type: number, source: computed, default: 0, description: "Tonnage actually loaded; set on complete, returned to the silo on void" }
      - { name: status, type: enum, source: system, default: RESERVED, description: "RESERVED | LOADING | COMPLETED | VOIDED | CANCELLED_BY_QUALITY" }
      - { name: void_reason, type: string, source: input, description: "Reason recorded on void, or the cascade reason on CANCELLED_BY_QUALITY" }
      - { name: loading_started_at, type: datetime, source: system, description: "Logical-clock instant of start-loading; null before that" }
      - { name: completed_at, type: datetime, source: system, description: "Logical-clock instant of complete; null before that" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  # --- cyclic: revision loop between engineer and quality manager -------------
  - entity: RawMixDesign
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /cement-ops/raw-mix-designs/{design_id}/submit"
        actor: ProcessEngineer
        preconditions:
          - "status == DRAFT"
          - "components has >= 2 entries and every raw_material_id resolves to a RawMaterial"
          - "sum(components[].mass_fraction_pct) == 100.00 exactly"
          - "abs(as_designed_lsf - target_lsf) <= module_tolerance_lsf"
        side_effects:
          - "status = SUBMITTED; version += 1"
          - "as_designed_* oxides and as_designed_lsf/sm/am recomputed per calculations.raw_mix_chemical_modules variant as_designed"

      - from: SUBMITTED
        to: REVISION_REQUESTED
        trigger: "POST /cement-ops/raw-mix-designs/{design_id}/request-revision"
        actor: QualityManager
        preconditions:
          - "status == SUBMITTED"
          - "revision_count < MAX_DESIGN_REVISIONS (3)"
        side_effects:
          - "status = REVISION_REQUESTED; revision_count += 1; revision_reason stored; version += 1"
        note: "Cycle entry point. The 4th request-revision on the same design is refused with ERR_REVISION_LIMIT_EXCEEDED."

      - from: REVISION_REQUESTED
        to: DRAFT
        trigger: "PATCH /cement-ops/raw-mix-designs/{design_id}"
        actor: ProcessEngineer
        preconditions:
          - "status IN {DRAFT, REVISION_REQUESTED}"
        side_effects:
          - "status = DRAFT; edited fields applied; as_designed_* recomputed; version += 1"
        note: "Closes the cycle DRAFT -> SUBMITTED -> REVISION_REQUESTED -> DRAFT. A PATCH on a design already in DRAFT is a no-op on status."

      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /cement-ops/raw-mix-designs/{design_id}/approve"
        actor: QualityManager
        preconditions:
          - "status == SUBMITTED"
          - "X-User-ID != created_by_user_id (segregation of duties)"
        side_effects:
          - "status = APPROVED; approved_by_user_id = X-User-ID; approved_at = logical clock; version += 1"
          - "CASCADE hop 1 (caused by this approval): the previously APPROVED design of the same plant, if any, moves to SUPERSEDED with superseded_by_design_id = this design id and version += 1"

      - from: APPROVED
        to: SUPERSEDED
        trigger: "system — another design of the same plant is approved"
        actor: system
        preconditions:
          - "status == APPROVED"
        side_effects:
          - "status = SUPERSEDED; superseded_by_design_id set; version += 1"
        note: "Piles already OPEN or SEALED against the superseded design stay valid; new piles against it are refused with ERR_DESIGN_NOT_APPROVED."

  # --- linear with capacity gate; feeds the kiln -----------------------------
  - entity: BlendedPile
    initial_state: OPEN
    terminal_states: [CONSUMED]
    transitions:
      - from: OPEN
        to: SEALED
        trigger: "POST /cement-ops/blended-piles/{pile_id}/seal"
        actor: ProcessEngineer
        preconditions:
          - "status == OPEN"
          - "len(additions) >= 1 (an empty pile cannot be sealed)"
          - "RawMixDesign.status == APPROVED"
          - "lsf_deviation <= RawMixDesign.pile_lsf_tolerance"
        side_effects:
          - "status = SEALED; sealed_at = logical clock; dry_tonnes frozen; version += 1"

      - from: SEALED
        to: CONSUMED
        trigger: "system — POST /cement-ops/kiln-runs/{kiln_run_id}/light on a run referencing this pile"
        actor: system
        preconditions:
          - "status == SEALED"
        side_effects:
          - "status = CONSUMED; version += 1"
          - "RawMixDesign.active_pile_count recomputed (the pile leaves the OPEN/SEALED set) and RawMixDesign.version += 1"

  # --- branching with divergent side-effect sets per decision ----------------
  - entity: BurnTest
    initial_state: REQUESTED
    terminal_states: [AUTHORIZED, REJECTED]
    transitions:
      - from: REQUESTED
        to: IN_PROGRESS
        trigger: "POST /cement-ops/burn-tests/{burn_test_id}/start"
        actor: LabTechnician
        preconditions:
          - "status == REQUESTED"
        side_effects:
          - "status = IN_PROGRESS; version += 1"

      - from: IN_PROGRESS
        to: RESULT_RECORDED
        trigger: "POST /cement-ops/burn-tests/{burn_test_id}/record-result"
        actor: LabTechnician
        preconditions:
          - "status == IN_PROGRESS"
        side_effects:
          - "status = RESULT_RECORDED; measured_chlorine_pct, measured_nox_kg_per_gj, stack_compliant stored; result_recorded_by_user_id = X-User-ID; version += 1"

      - from: RESULT_RECORDED
        to: AUTHORIZED
        trigger: "POST /cement-ops/burn-tests/{burn_test_id}/adjudicate with decision=AUTHORIZED"
        actor: EnvironmentalOfficer
        preconditions:
          - "status == RESULT_RECORDED"
          - "X-User-ID != result_recorded_by_user_id (segregation of duties)"
          - "stack_compliant == true"
          - "authorized_max_tsr_pct <= requested_max_tsr_pct AND authorized_max_tsr_pct <= Plant.permit_max_tsr_pct"
        side_effects:
          - "status = AUTHORIZED; authorized_max_tsr_pct stored; valid_from = logical clock; valid_until = valid_from + valid_days days; adjudicated_by_user_id = X-User-ID; version += 1"
          - "the referenced Fuel becomes chargeable on this plant's kiln runs while clock < valid_until"
        note: "AUTHORIZED branch — grants a substitution ceiling with an expiry."

      - from: RESULT_RECORDED
        to: REJECTED
        trigger: "POST /cement-ops/burn-tests/{burn_test_id}/adjudicate with decision=REJECTED"
        actor: EnvironmentalOfficer
        preconditions:
          - "status == RESULT_RECORDED"
          - "X-User-ID != result_recorded_by_user_id (segregation of duties)"
        side_effects:
          - "status = REJECTED; decision_reason stored; authorized_max_tsr_pct stays 0; valid_from and valid_until stay null; version += 1"
        note: "REJECTED branch — the divergent side-effect set: no authorization window is minted, so the fuel remains uncharegable."

  # --- parallel dimensions: process_state x quality_state --------------------
  - entity: KilnRun
    initial_state: SCHEDULED
    terminal_states: [ABORTED]
    transitions:
      # ---- process dimension ----
      - from: "process_state=SCHEDULED"
        to: "process_state=BURNING"
        trigger: "POST /cement-ops/kiln-runs/{kiln_run_id}/light"
        actor: KilnOperator
        preconditions:
          - "process_state == SCHEDULED"
          - "Kiln.availability_state == AVAILABLE"
          - "BlendedPile.status == SEALED (cross-entity gate)"
          - "logical clock >= window_start AND logical clock < window_end"
          - "no other KilnRun on the same kiln has process_state == BURNING"
        side_effects:
          - "process_state = BURNING; lit_at = logical clock; version += 1"
          - "BlendedPile SEALED -> CONSUMED (see BlendedPile machine), which recomputes RawMixDesign.active_pile_count"

      - from: "process_state=BURNING"
        to: "process_state=COMPLETED"
        trigger: "POST /cement-ops/kiln-runs/{kiln_run_id}/complete"
        actor: KilnOperator
        preconditions:
          - "process_state == BURNING"
          - "logical clock >= window_end"
          - "gross_energy_gj > 0 (at least one fuel charge)"
          - "round(clinker_tonnes * KILN_FEED_FACTOR, 2) <= BlendedPile.dry_tonnes"
          - "clinker Silo.status == OPEN"
          - "Silo.tonnes_on_hand + clinker_tonnes <= Silo.capacity_tonnes"
        side_effects:
          - "process_state = COMPLETED; completed_at = logical clock; clinker_tonnes frozen; version += 1"
          - "clinker Silo.tonnes_on_hand += clinker_tonnes AND Silo.unreleased_tonnes += clinker_tonnes (physically present, not yet sellable); Silo.available_tonnes recomputed; Silo.version += 1"
          - "BlendedPile.consumed_dry_tonnes = round(clinker_tonnes * KILN_FEED_FACTOR, 2)"
          - "Kiln.refractory_hours_since_reline += round(scheduled_hours, 0); Kiln.availability_state becomes RELINE_DUE once refractory_hours_since_reline >= Kiln.reline_due_hours; Kiln.version += 1"
          - "Plant.rolling_nox_intensity_kg_per_tonne recomputed per calculations.nox_emission_intensity variant plant_rolling_window"

      - from: "process_state=BURNING"
        to: "process_state=ABORTED"
        trigger: "POST /cement-ops/kiln-runs/{kiln_run_id}/abort"
        actor: KilnOperator
        preconditions:
          - "process_state == BURNING"
        side_effects:
          - "process_state = ABORTED; abort_reason stored; version += 1"
          - "COMPENSATION: nox_emitted_kg = 0 and clinker_tonnes = 0; the run leaves the {SCHEDULED, BURNING, COMPLETED} set so Plant.permit_nox_budget_remaining_kg returns to its pre-charge value"
          - "no clinker is credited to any silo; the consumed BlendedPile stays CONSUMED (the raw meal is lost)"
        note: "Compensating action for calculations.nox_budget_conservation."

      # ---- quality dimension (independent of process dimension) ----
      - from: "quality_state=PENDING_LAB"
        to: "quality_state=QUARANTINED"
        trigger: "system — POST /cement-ops/lab-tests with test_type=FREE_LIME and value > Plant.clinker_free_lime_max_pct"
        actor: system
        preconditions:
          - "quality_state == PENDING_LAB"
          - "process_state IN {BURNING, COMPLETED}"
        side_effects:
          - "quality_state = QUARANTINED; free_lime_pct = the new test value; version += 1"

      - from: "quality_state=QUARANTINED"
        to: "quality_state=PENDING_LAB"
        trigger: "system — POST /cement-ops/lab-tests with test_type=FREE_LIME and value <= Plant.clinker_free_lime_max_pct"
        actor: system
        preconditions:
          - "quality_state == QUARANTINED"
        side_effects:
          - "quality_state = PENDING_LAB; free_lime_pct = the new test value; version += 1"
        note: "Retest cycle — the quality dimension loops QUARANTINED <-> PENDING_LAB while the process dimension stays put."

      - from: "quality_state=PENDING_LAB"
        to: "quality_state=RELEASED"
        trigger: "POST /cement-ops/kiln-runs/{kiln_run_id}/release-clinker"
        actor: QualityManager
        preconditions:
          - "process_state == COMPLETED AND quality_state == PENDING_LAB (both dimensions gate this transition)"
          - "at least one LabTest with test_type=FREE_LIME exists on this run and free_lime_pct <= Plant.clinker_free_lime_max_pct"
          - "Plant.rolling_nox_intensity_kg_per_tonne <= Plant.permit_nox_kg_per_tonne_clinker_cap"
          - "clinker Silo.status == OPEN"
        side_effects:
          - "quality_state = RELEASED; version += 1"
          - "CASCADE hop 1 (caused by the release): clinker Silo.unreleased_tonnes -= clinker_tonnes and Silo.available_tonnes is recomputed upward; Silo.version += 1"
          - "CASCADE hop 2 (caused by hop 1 — the silo now has availability): every CementBatch drawing on that silo with feed_state == FEED_SHORT, walked in created_at ASC order, whose clinker_tonnes_drawn <= the silo's current available_tonnes returns to feed_state = FEED_READY and re-reserves its draw (Silo.reserved_tonnes += clinker_tonnes_drawn, available_tonnes recomputed after each batch)"
          - "CASCADE hop 3 (caused by hop 2 — no CementBatch of the plant is FEED_SHORT any more): Plant.production_posture = NORMAL"

      - from: "quality_state=RELEASED"
        to: "quality_state=QUARANTINED"
        trigger: "system — POST /cement-ops/lab-tests with test_type=FREE_LIME and value > Plant.clinker_free_lime_max_pct on an already released run"
        actor: system
        preconditions:
          - "quality_state == RELEASED"
        side_effects:
          - "quality_state = QUARANTINED; free_lime_pct = the new test value; version += 1"
          - "CASCADE hop 1 (caused by the re-quarantine): clinker Silo.unreleased_tonnes += clinker_tonnes; Silo.available_tonnes recomputed downward; Silo.version += 1"
          - "CASCADE hop 2 (caused by hop 1 — availability no longer covers the reservations): every CementBatch on that silo with status == PLANNED and clinker_tonnes_drawn > the silo's recomputed available_tonnes moves to feed_state = FEED_SHORT and its reservation is released (Silo.reserved_tonnes -= clinker_tonnes_drawn), walked in created_at ASC order"
          - "CASCADE hop 3 (caused by hop 2 — at least one batch of the plant is now FEED_SHORT): Plant.production_posture = CONSTRAINED"

  # --- linear with clock gates; resets refractory service hours --------------
  - entity: KilnOutage
    initial_state: PLANNED
    terminal_states: [COMPLETED]
    transitions:
      - from: PLANNED
        to: APPROVED
        trigger: "POST /cement-ops/kiln-outages/{outage_id}/approve"
        actor: PlantAdmin
        preconditions:
          - "status == PLANNED"
          - "no KilnRun on the same kiln with process_state IN {SCHEDULED, BURNING} has a window within Kiln.cooldown_buffer_hours of this outage window"
        side_effects:
          - "status = APPROVED; approved_by_user_id = X-User-ID; version += 1"
          - "the outage window starts blocking new KilnRun windows within Kiln.cooldown_buffer_hours"

      - from: APPROVED
        to: IN_PROGRESS
        trigger: "POST /cement-ops/kiln-outages/{outage_id}/start"
        actor: ProcessEngineer
        preconditions:
          - "status == APPROVED"
          - "logical clock >= window_start"
          - "no KilnRun on this kiln has process_state == BURNING"
        side_effects:
          - "status = IN_PROGRESS; started_at = logical clock; version += 1"
          - "Kiln.availability_state = IN_OUTAGE; Kiln.version += 1"

      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /cement-ops/kiln-outages/{outage_id}/complete"
        actor: ProcessEngineer
        preconditions:
          - "status == IN_PROGRESS"
          - "logical clock >= window_start"
        side_effects:
          - "status = COMPLETED; completed_at = logical clock; refractory_replaced stored; version += 1"
          - "when refractory_replaced == true: Kiln.refractory_hours_since_reline = 0 and Kiln.availability_state = AVAILABLE"
          - "when refractory_replaced == false: Kiln.refractory_hours_since_reline is left untouched, so a kiln at or past reline_due_hours returns to RELINE_DUE rather than AVAILABLE"
          - "Kiln.version += 1"

  # --- cyclic gate on inventory --------------------------------------------
  - entity: Silo
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: OPEN
        to: BLOCKED
        trigger: "PATCH /cement-ops/silos/{silo_id} with status=BLOCKED, or system cascade from a MillCertificate revocation"
        actor: PlantAdmin
        preconditions:
          - "status == OPEN"
        side_effects:
          - "status = BLOCKED; block_reason stored; version += 1"
          - "when material_kind == CEMENT: every LoadoutOrder on this silo with status IN {RESERVED, LOADING} moves to CANCELLED_BY_QUALITY with void_reason = the silo's block_reason, Silo.reserved_tonnes -= each cancelled order's tonnes, and each affected Customer.open_reserved_tonnes is recomputed"
          - "when material_kind == CLINKER: every CementBatch with status == PLANNED drawing on this silo moves to feed_state = FEED_SHORT, its reservation is released (Silo.reserved_tonnes -= clinker_tonnes_drawn), and Plant.production_posture = CONSTRAINED"

      - from: BLOCKED
        to: OPEN
        trigger: "PATCH /cement-ops/silos/{silo_id} with status=OPEN"
        actor: PlantAdmin
        preconditions:
          - "status == BLOCKED"
        side_effects:
          - "status = OPEN; block_reason cleared; version += 1"
          - "feed reconciliation runs exactly as in the release-clinker cascade hops 2-3: FEED_SHORT batches on this silo, in created_at ASC order, are restored to FEED_READY while available_tonnes covers their draw, and Plant.production_posture returns to NORMAL once none remain"

  # --- branching with a fork/join on two independent lab branches ------------
  - entity: CementBatch
    initial_state: PLANNED
    terminal_states: [REJECTED, DECERTIFIED]
    transitions:
      # ---- main status dimension ----
      - from: PLANNED
        to: GRINDING
        trigger: "POST /cement-ops/cement-batches/{cement_batch_id}/start-grinding"
        actor: KilnOperator
        preconditions:
          - "status == PLANNED"
          - "feed_state == FEED_READY (cross-entity gate on the clinker silo's availability)"
          - "clinker Silo.status == OPEN AND cement Silo.status == OPEN"
        side_effects:
          - "status = GRINDING; grinding_started_at = logical clock; version += 1"
          - "clinker Silo.tonnes_on_hand -= clinker_tonnes_drawn AND Silo.reserved_tonnes -= clinker_tonnes_drawn (the reservation becomes a physical draw); Silo.available_tonnes recomputed; Silo.version += 1"

      - from: GRINDING
        to: GROUND
        trigger: "POST /cement-ops/cement-batches/{cement_batch_id}/finish-grinding"
        actor: KilnOperator
        preconditions:
          - "status == GRINDING"
          - "cement Silo.status == OPEN"
          - "cement Silo.tonnes_on_hand + cement_tonnes <= cement Silo.capacity_tonnes"
        side_effects:
          - "status = GROUND; ground_at = logical clock; version += 1"
          - "cement Silo.tonnes_on_hand += cement_tonnes AND Silo.unreleased_tonnes += cement_tonnes (ground cement is not sellable before the batch qualifies); Silo.available_tonnes recomputed; Silo.version += 1"
          - "the two lab branches open: strength_branch_state = PENDING and fineness_branch_state = PENDING"

      - from: GROUND
        to: QUALIFIED
        trigger: "system — JOIN: the second of the two lab branches reaches PASSED"
        actor: system
        preconditions:
          - "status == GROUND"
          - "strength_branch_state == PASSED AND fineness_branch_state == PASSED"
        side_effects:
          - "status = QUALIFIED; qualified_at = logical clock; version += 1"
          - "cement Silo.unreleased_tonnes -= cement_tonnes so the batch's cement becomes sellable; Silo.available_tonnes recomputed; Silo.version += 1"
        note: "JOIN point — one PASSED branch alone leaves the batch in GROUND."

      - from: GROUND
        to: REJECTED
        trigger: "system — either lab branch reaches FAILED"
        actor: system
        preconditions:
          - "status == GROUND"
          - "strength_branch_state == FAILED OR fineness_branch_state == FAILED"
        side_effects:
          - "status = REJECTED; rejection_reason set to STRENGTH_OUT_OF_SPEC or FINENESS_OUT_OF_SPEC; version += 1"
          - "the batch's cement stays counted in cement Silo.unreleased_tonnes forever, so it is never sellable and never certifiable"
        note: "Divergent branch outcome — the failing branch short-circuits the join."

      - from: QUALIFIED
        to: CERTIFIED
        trigger: "system — POST /cement-ops/mill-certificates/{mill_certificate_id}/issue on a certificate for this batch"
        actor: system
        preconditions:
          - "status == QUALIFIED"
        side_effects:
          - "status = CERTIFIED; version += 1"
          - "certified_tonnes_allocated += the certificate's certified_tonnes"

      - from: CERTIFIED
        to: DECERTIFIED
        trigger: "system — POST /cement-ops/mill-certificates/{mill_certificate_id}/revoke"
        actor: system
        preconditions:
          - "status == CERTIFIED"
        side_effects:
          - "status = DECERTIFIED; certified_tonnes_allocated = 0.00; version += 1"

      # ---- lab branch dimensions (independent of each other) ----
      - from: "strength_branch_state=PENDING"
        to: "strength_branch_state=PASSED"
        trigger: "system — POST /cement-ops/lab-tests with test_type=COMPRESSIVE_STRENGTH_28D and value >= the cement type's strength_min_mpa"
        actor: system
        preconditions:
          - "status == GROUND"
        side_effects:
          - "strength_branch_state = PASSED; version += 1 (the measured value stays on the LabTest row, which carries in_spec = true)"

      - from: "strength_branch_state=PENDING"
        to: "strength_branch_state=FAILED"
        trigger: "system — POST /cement-ops/lab-tests with test_type=COMPRESSIVE_STRENGTH_28D and value < the cement type's strength_min_mpa"
        actor: system
        preconditions:
          - "status == GROUND"
        side_effects:
          - "strength_branch_state = FAILED; version += 1 (the LabTest row carries in_spec = false)"

      - from: "fineness_branch_state=PENDING"
        to: "fineness_branch_state=PASSED"
        trigger: "system — POST /cement-ops/lab-tests with test_type=BLAINE and blaine_min_m2_per_kg <= value <= blaine_max_m2_per_kg for the cement type"
        actor: system
        preconditions:
          - "status == GROUND"
        side_effects:
          - "fineness_branch_state = PASSED; version += 1 (the LabTest row carries in_spec = true)"

      - from: "fineness_branch_state=PENDING"
        to: "fineness_branch_state=FAILED"
        trigger: "system — POST /cement-ops/lab-tests with test_type=BLAINE and value outside the cement type's Blaine band"
        actor: system
        preconditions:
          - "status == GROUND"
        side_effects:
          - "fineness_branch_state = FAILED; version += 1 (the LabTest row carries in_spec = false)"

      # ---- feed dimension (independent of status and of the lab branches) ----
      - from: "feed_state=FEED_READY"
        to: "feed_state=FEED_SHORT"
        trigger: "system — the clinker silo loses availability (a released run is re-quarantined, or the clinker silo is BLOCKED)"
        actor: system
        preconditions:
          - "status == PLANNED"
          - "clinker_tonnes_drawn > clinker Silo.available_tonnes after the withdrawal"
        side_effects:
          - "feed_state = FEED_SHORT; clinker Silo.reserved_tonnes -= clinker_tonnes_drawn; version += 1"

      - from: "feed_state=FEED_SHORT"
        to: "feed_state=FEED_READY"
        trigger: "system — the clinker silo regains availability (release-clinker, or the clinker silo returns to OPEN)"
        actor: system
        preconditions:
          - "status == PLANNED"
          - "clinker_tonnes_drawn <= clinker Silo.available_tonnes at the moment this batch is reconciled (batches walked created_at ASC)"
        side_effects:
          - "feed_state = FEED_READY; clinker Silo.reserved_tonnes += clinker_tonnes_drawn; version += 1"

  # --- linear with a deep compensating revocation ----------------------------
  - entity: MillCertificate
    initial_state: DRAFT
    terminal_states: [REVOKED]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /cement-ops/mill-certificates/{mill_certificate_id}/issue"
        actor: QualityManager
        preconditions:
          - "status == DRAFT"
          - "CementBatch.status IN {QUALIFIED, CERTIFIED}"
          - "X-User-ID != LabTest.recorded_by_user_id of the batch's newest COMPRESSIVE_STRENGTH_28D LabTest (segregation of duties)"
          - "CementBatch.certified_tonnes_allocated + certified_tonnes <= CementBatch.cement_tonnes"
          - "CementBatch.cement_type == Customer.required_cement_type AND CementBatch.so3_pct <= Customer.max_so3_pct"
        side_effects:
          - "status = ISSUED; issued_by_user_id = X-User-ID; issued_at = logical clock; version += 1"
          - "CementBatch QUALIFIED -> CERTIFIED (or, when already CERTIFIED, certified_tonnes_allocated += certified_tonnes)"

      - from: ISSUED
        to: REVOKED
        trigger: "POST /cement-ops/mill-certificates/{mill_certificate_id}/revoke"
        actor: QualityManager
        preconditions:
          - "status == ISSUED"
        side_effects:
          - "status = REVOKED; revoke_reason stored; revoked_at = logical clock; version += 1"
          - "CASCADE hop 1 (caused by the revocation): the referenced CementBatch moves CERTIFIED -> DECERTIFIED and its certified_tonnes_allocated drops to 0.00"
          - "CASCADE hop 2 (caused by hop 1 — the batch's cement is no longer certified): the batch's cement Silo moves OPEN -> BLOCKED with block_reason = DECERTIFIED_CEMENT"
          - "CASCADE hop 3 (caused by hop 2 — the silo is BLOCKED): every LoadoutOrder on that silo with status IN {RESERVED, LOADING} moves to CANCELLED_BY_QUALITY with void_reason = DECERTIFIED_CEMENT and Silo.reserved_tonnes -= each cancelled order's tonnes"
          - "CASCADE hop 4 (caused by hop 3 — those orders are no longer open): each affected Customer.open_reserved_tonnes is recomputed downward"
        note: "Deepest chain in the system: MillCertificate -> CementBatch -> Silo -> LoadoutOrder -> Customer."

  # --- linear with a post-terminal compensating void -------------------------
  - entity: LoadoutOrder
    initial_state: RESERVED
    terminal_states: [VOIDED, CANCELLED_BY_QUALITY]
    transitions:
      - from: RESERVED
        to: LOADING
        trigger: "POST /cement-ops/loadout-orders/{loadout_order_id}/start-loading"
        actor: LogisticsPlanner
        preconditions:
          - "status == RESERVED"
          - "MillCertificate.status == ISSUED"
          - "cement Silo.status == OPEN"
          - "logical clock >= window_start AND logical clock < window_end"
          - "the number of orders on the same silo with status == LOADING is < Silo.loadout_spouts"
        side_effects:
          - "status = LOADING; loading_started_at = logical clock; version += 1"

      - from: LOADING
        to: COMPLETED
        trigger: "POST /cement-ops/loadout-orders/{loadout_order_id}/complete"
        actor: LogisticsPlanner
        preconditions:
          - "status == LOADING"
          - "0 < loaded_tonnes <= tonnes"
        side_effects:
          - "status = COMPLETED; loaded_tonnes stored; completed_at = logical clock; version += 1"
          - "cement Silo.tonnes_on_hand -= loaded_tonnes AND Silo.reserved_tonnes -= tonnes; Silo.available_tonnes recomputed; Silo.version += 1"
          - "Customer.open_reserved_tonnes -= tonnes AND Customer.lifetime_loaded_tonnes += loaded_tonnes"
          - "Plant.cement_tonne_balance_tonnes is unchanged: the tonnes move from silo stock into shipped stock"

      - from: COMPLETED
        to: VOIDED
        trigger: "POST /cement-ops/loadout-orders/{loadout_order_id}/void"
        actor: LogisticsPlanner
        preconditions:
          - "status == COMPLETED"
          - "cement Silo.tonnes_on_hand + loaded_tonnes <= cement Silo.capacity_tonnes"
        side_effects:
          - "status = VOIDED; void_reason stored; version += 1"
          - "COMPENSATION: cement Silo.tonnes_on_hand += loaded_tonnes (the shipment returns to the silo); Silo.available_tonnes recomputed; Silo.version += 1"
          - "Customer.lifetime_loaded_tonnes -= loaded_tonnes; then loaded_tonnes = 0.00"
          - "Plant.cement_tonne_balance_tonnes returns to exactly its pre-complete value"
        note: "Compensating action for calculations.cement_tonne_conservation."

      - from: RESERVED
        to: VOIDED
        trigger: "POST /cement-ops/loadout-orders/{loadout_order_id}/void"
        actor: LogisticsPlanner
        preconditions:
          - "status == RESERVED"
        side_effects:
          - "status = VOIDED; void_reason stored; version += 1"
          - "cement Silo.reserved_tonnes -= tonnes; Silo.available_tonnes recomputed; Customer.open_reserved_tonnes -= tonnes"

      - from: LOADING
        to: VOIDED
        trigger: "POST /cement-ops/loadout-orders/{loadout_order_id}/void"
        actor: LogisticsPlanner
        preconditions:
          - "status == LOADING"
        side_effects:
          - "status = VOIDED; void_reason stored; version += 1"
          - "cement Silo.reserved_tonnes -= tonnes; Silo.available_tonnes recomputed; Customer.open_reserved_tonnes -= tonnes; the spout occupied by this order is freed"

      - from: RESERVED
        to: CANCELLED_BY_QUALITY
        trigger: "system — the cement Silo moves OPEN -> BLOCKED (directly or via a MillCertificate revocation cascade)"
        actor: system
        preconditions:
          - "status IN {RESERVED, LOADING}"
        side_effects:
          - "status = CANCELLED_BY_QUALITY; void_reason = the silo's block_reason; version += 1"
          - "cement Silo.reserved_tonnes -= tonnes; Customer.open_reserved_tonnes -= tonnes"
        note: "Also reachable from LOADING; the loaded_tonnes stays 0.00 because nothing was shipped."

# =============================================================================
# §1.2.1 Concurrency Rules (optimistic concurrency control)
# =============================================================================
concurrency_rules:
  - name: pile-create-stale-design
    parent_entity: RawMixDesign
    child_entity: BlendedPile
    write_endpoint: "POST /cement-ops/blended-piles"
    occ_field: expected_raw_mix_design_version
    error_id: ERR_STALE_DESIGN_VERSION
    status: 412
    rationale: >
      A pile is a physical commitment to one revision of the chemical recipe. The caller must
      echo the RawMixDesign.version it read; if the design has been re-approved or re-superseded
      since, the write is refused so no pile is blended against a stale module target.
    version_bump_side_effect: >
      Every successful pile creation recomputes RawMixDesign.active_pile_count and increments
      RawMixDesign.version, so a second pile created from the same read version is refused.

  - name: batch-create-stale-clinker-silo
    parent_entity: Silo
    child_entity: CementBatch
    write_endpoint: "POST /cement-ops/cement-batches"
    occ_field: expected_clinker_silo_version
    error_id: ERR_STALE_SILO_VERSION
    status: 412
    rationale: >
      Creating a batch reserves clinker out of a silo whose available_tonnes moves on every
      kiln-run completion, release, re-quarantine, draw and block. The caller must echo the
      clinker Silo.version it read so a reservation is never computed from a stale balance.
    version_bump_side_effect: >
      Silo.version increments on every reservation, physical draw, credit, withdrawal and status
      change, so any intervening silo movement invalidates the caller's read.

  - name: loadout-create-stale-certificate
    parent_entity: MillCertificate
    child_entity: LoadoutOrder
    write_endpoint: "POST /cement-ops/loadout-orders"
    occ_field: expected_mill_certificate_version
    error_id: ERR_STALE_CERTIFICATE_VERSION
    status: 412
    rationale: >
      A loadout order draws against a certificate's remaining certified tonnes. The caller must
      echo the MillCertificate.version it read so an order is never reserved against an
      allocation figure that has since been consumed or revoked.
    version_bump_side_effect: >
      MillCertificate.version increments on issue, on revoke and on every order that consumes
      allocated_tonnes, so a second order created from the same read version is refused.

# =============================================================================
# §1.3 Calculation Rules
# =============================================================================
# GLOBAL PRECISION CONTRACT
#   * All rounding is ROUND_HALF_UP (never bankers rounding).
#   * Tonnages, percentages, energies and money: 2 decimals.
#   * Oxide contents: 4 decimals.
#   * Emission intensities: 3 decimals.
#   * Where a formula names round(...) explicitly, that rounding happens at that step and the
#     rounded value is what later steps consume. No formula re-derives a value from unrounded
#     intermediates once a rounded intermediate has been defined.
# =============================================================================
calculations:

  - name: raw_mix_chemical_modules
    description: >
      Chemical module targets (lime saturation factor, silica modulus, alumina modulus) of a raw
      mix. The same three formulas are evaluated over two different mass bases, which is why this
      rule carries variants.
    algorithm_type: weighted_scoring
    variants:
      - name: as_designed
        applies_to: "RawMixDesign — evaluated on POST /cement-ops/raw-mix-designs, on PATCH, and on submit"
        input_set: "RawMixDesign.components[]"
        weight: "components[i].mass_fraction_pct (DRY-basis design fractions, summing to exactly 100.00)"
        output_fields: [as_designed_cao_pct, as_designed_sio2_pct, as_designed_al2o3_pct, as_designed_fe2o3_pct, as_designed_lsf, as_designed_sm, as_designed_am]
      - name: as_blended
        applies_to: "BlendedPile — recomputed on every POST /cement-ops/blended-piles/{id}/additions and frozen at seal"
        input_set: "BlendedPile.additions[]"
        weight: >
          the addition's DRY tonnage, round(tonnes_as_received * (1 - moisture_pct/100), 2), where
          moisture_pct is the value recorded ON THE ADDITION (not the RawMaterial default), so a
          wet delivery dilutes its own contribution
        output_fields: [as_blended_cao_pct, as_blended_sio2_pct, as_blended_al2o3_pct, as_blended_fe2o3_pct, as_blended_lsf, as_blended_sm, as_blended_am]
    formula: |
      STEP 1 — weighted oxide contents, one per oxide X in {CaO, SiO2, Al2O3, Fe2O3}:
        as_designed: X_pct = round( sum_i( component_i.mass_fraction_pct * material_i.X_pct ) / 100, 4 )
        as_blended : X_pct = round( sum_i( dry_tonnes_i * material_i.X_pct ) / total_dry_tonnes, 4 )
                     where dry_tonnes_i = round(tonnes_as_received_i * (1 - moisture_pct_i/100), 2)
                     and   total_dry_tonnes = sum_i(dry_tonnes_i)   (== BlendedPile.dry_tonnes)
      STEP 2 — modules, computed FROM THE 4-DECIMAL OXIDES of step 1:
        LSF = round( CaO_pct / (2.8*SiO2_pct + 1.18*Al2O3_pct + 0.65*Fe2O3_pct) * 100, 2 )
        SM  = round( SiO2_pct / (Al2O3_pct + Fe2O3_pct), 2 )
        AM  = round( Al2O3_pct / Fe2O3_pct, 2 )
    constants:
      LSF_CAO_COEFF_SIO2: 2.8
      LSF_CAO_COEFF_AL2O3: 1.18
      LSF_CAO_COEFF_FE2O3: 0.65
    precision: "oxides 4 decimals, modules 2 decimals, ROUND_HALF_UP"
    worked_example: |
      Materials (dry basis): LS-1 CaO 52.0 / SiO2 3.5 / Al2O3 1.0 / Fe2O3 0.5, moisture 2.0
                             CL-1 CaO  1.0 / SiO2 60.0 / Al2O3 18.0 / Fe2O3 7.0, moisture 12.0
                             IR-1 CaO  1.0 / SiO2  8.0 / Al2O3  2.0 / Fe2O3 80.0, moisture 5.0
      Design D1 components: LS-1 80.00, CL-1 16.00, IR-1 4.00 (sum 100.00)
        as_designed oxides = 41.8000 / 12.7200 / 3.7600 / 4.7200
        as_designed_lsf = 96.94, as_designed_sm = 1.50, as_designed_am = 0.80
      Pile PL1 on D1 with AS-RECEIVED additions LS-1 800.00, CL-1 160.00, IR-1 40.00:
        dry tonnages 784.00 / 140.80 / 38.00 -> dry_tonnes 962.80
        as_blended oxides = 42.5289 / 11.9402 / 3.5256 / 4.5883
        as_blended_lsf = 104.82, as_blended_sm = 1.47, as_blended_am = 0.77
      SAME recipe, two bases, LSF 96.94 vs 104.82 (delta 7.88): the moisture spread between a 2%
      limestone and a 12% clay makes the physical pile richer in lime than the design fractions say.
      To hit the design on the pile, the as-received additions must be moisture-compensated:
      design D2 (LS-1 82.00 / CL-1 18.00, as_designed_lsf 96.98) fed as LS-1 836.73 and CL-1 204.55
      as-received gives dry 820.00 / 180.00 and as_blended_lsf 96.98 — the two variants converge.

  - name: nox_emission_intensity
    description: >
      NOx intensity in kg per tonne of clinker. The per-run figure is a diagnostic flag; the
      rolling plant figure is the one the permit gates clinker release on. The two disagree by
      construction whenever the fuel mix changes between runs.
    algorithm_type: aggregation
    variants:
      - name: per_run_actual
        applies_to: "KilnRun.nox_intensity_kg_per_tonne and KilnRun.nox_intensity_breach"
        input_set: "the single KilnRun"
        output_fields: [nox_intensity_kg_per_tonne, nox_intensity_breach]
      - name: plant_rolling_window
        applies_to: "Plant.rolling_nox_intensity_kg_per_tonne — recomputed on kiln-run complete and abort, and read as a gate by POST /cement-ops/kiln-runs/{id}/release-clinker"
        input_set: >
          all KilnRun rows on kilns of the plant with process_state == COMPLETED whose window_end
          falls in the half-open window [logical clock - ROLLING_WINDOW_DAYS days, logical clock];
          ABORTED, SCHEDULED and BURNING runs are excluded
        output_fields: [rolling_nox_intensity_kg_per_tonne]
    formula: |
      per_run_actual:
        nox_intensity_kg_per_tonne = round(nox_emitted_kg / clinker_tonnes, 3)
        nox_intensity_breach = (nox_intensity_kg_per_tonne > Plant.permit_nox_kg_per_tonne_clinker_cap)
      plant_rolling_window:
        rolling_nox_intensity_kg_per_tonne =
          round( sum(nox_emitted_kg over the window set) / sum(clinker_tonnes over the window set), 3 )
        When the window set is empty, the value is 0.000 and the release gate passes.
      GATE: release-clinker is refused with ERR_PERMIT_NOX_INTENSITY_EXCEEDED when
        rolling_nox_intensity_kg_per_tonne > Plant.permit_nox_kg_per_tonne_clinker_cap.
      The per-run variant NEVER gates anything; it only sets nox_intensity_breach.
    constants:
      ROLLING_WINDOW_DAYS: 30
    precision: "3 decimals, ROUND_HALF_UP"
    worked_example: |
      Plant cap 1.20 kg/t. Run R0 fires 45.00 t natural gas (48.00 GJ/t, 0.10 kg NOx/GJ):
        gross 2160.00 GJ, clinker 583.78 t, nox 216.00 kg -> per-run intensity 0.370.
      Run R1 fires 80.00 t coal (27.00 GJ/t, 0.35 kg NOx/GJ):
        gross 2160.00 GJ, clinker 583.78 t, nox 756.00 kg -> per-run intensity 1.295 (> 1.20, so
        R1.nox_intensity_breach = true).
      Rolling window over R0 + R1: 972.00 / 1167.56 = 0.833 <= 1.20, so releasing R1's clinker
      SUCCEEDS even though R1's own intensity breaches the cap. Releasing R1 with only R1 in the
      window (R0 aborted) gives 1.295 > 1.20 and is refused.

  - name: clinker_output_from_fuel_energy
    description: >
      Clinker tonnage produced by a run's fuel energy, using a tiered specific heat consumption:
      small burns are thermally inefficient, large burns approach best practice.
    algorithm_type: tiered_pricing
    input_set: "KilnRun.fuel_charges[] plus Kiln.nominal_shc_gj_per_tonne"
    formula: |
      STEP 1  gross_energy_gj = sum over fuel_charges of round(tonnes * Fuel.lhv_gj_per_tonne, 2)
              (each charge's energy_gj is stored rounded on the charge, and the sum is of the
               already-rounded per-charge energies)
      STEP 2  provisional_clinker_tonnes = round(gross_energy_gj / Kiln.nominal_shc_gj_per_tonne, 2)
      STEP 3  effective_shc_gj_per_tonne = tier lookup on provisional_clinker_tonnes:
                provisional < 600.00                      -> 4.00
                600.00 <= provisional < 900.00            -> 3.70
                provisional >= 900.00                     -> 3.45
      STEP 4  clinker_tonnes = round(gross_energy_gj / effective_shc_gj_per_tonne, 2)
      SINGLE PASS ONLY. The tier is selected from the PROVISIONAL tonnage in step 2 and is never
      re-selected from the step-4 result, even when the step-4 result lands in a different tier.
    constants:
      SHC_TIER_1_MAX_TONNES: 600.00
      SHC_TIER_1_SHC: 4.00
      SHC_TIER_2_MAX_TONNES: 900.00
      SHC_TIER_2_SHC: 3.70
      SHC_TIER_3_SHC: 3.45
      KILN_FEED_FACTOR: 1.55
    precision: "2 decimals, ROUND_HALF_UP"
    worked_example: |
      Kiln K1 nominal_shc 3.60. Run R1 charges 80.00 t coal at 27.00 GJ/t:
        gross_energy_gj = 2160.00
        provisional     = 2160.00 / 3.60 = 600.00  -> exactly on the tier-1/tier-2 boundary, and the
                          boundary is inclusive upward, so tier 2 applies: effective_shc = 3.70
        clinker_tonnes  = 2160.00 / 3.70 = 583.78
      The step-4 answer 583.78 sits BELOW 600.00, i.e. inside tier 1. A re-tiering implementation
      would return 2160.00 / 4.00 = 540.00. The correct answer is 583.78.
      Kiln feed check at complete: round(583.78 * 1.55, 2) = 904.86 dry tonnes of raw meal, which
      must be <= BlendedPile.dry_tonnes or the completion is refused with ERR_INSUFFICIENT_KILN_FEED.

  - name: thermal_substitution_rate
    description: >
      Share of a run's thermal energy coming from alternative fuels, and the nested ceiling it is
      checked against. The ceiling is not a single number: it is the minimum of the plant permit
      and every burn-test authorization backing the alternative fuels actually charged.
    algorithm_type: constraint_propagation
    input_set: "KilnRun.fuel_charges[] joined to Fuel, plus Plant and the plant's BurnTest rows"
    formula: |
      alt_energy_gj = sum of charge.energy_gj over charges whose Fuel.is_alternative == true
      tsr_pct       = round(alt_energy_gj / gross_energy_gj * 100, 2)   (0.00 when gross is 0)

      effective_tsr_ceiling_pct =
        min(
          Plant.permit_max_tsr_pct,
          min over each DISTINCT alternative fuel F charged on this run of (
            the authorized_max_tsr_pct of the BurnTest for (this plant, F) with
            status == AUTHORIZED and valid_from <= clock < valid_until, choosing the row with the
            LATEST valid_from and, on a tie, the latest created_at
          )
        )
      When an alternative fuel has NO such authorization row, the charge is refused outright with
      ERR_BURN_TEST_NOT_AUTHORIZED (or ERR_BURN_TEST_EXPIRED when a row exists whose window has
      elapsed), so the ceiling is only ever computed over authorized fuels.
      A charge is refused with ERR_TSR_CAP_EXCEEDED when the tsr_pct the run WOULD have after the
      charge exceeds effective_tsr_ceiling_pct. Equality is allowed.
    constants: {}
    precision: "2 decimals, ROUND_HALF_UP"
    worked_example: |
      Plant permit_max_tsr_pct 35.00. RDF-1 is authorized to 25.00 (unexpired). Charges:
        COAL-1 90.00 t at 27.00 GJ/t -> 2430.00 GJ (not alternative)
        RDF-1  45.00 t at 18.00 GJ/t ->  810.00 GJ (alternative)
        gross 3240.00, alt 810.00, tsr_pct = 25.00 = min(35.00, 25.00) -> allowed at equality.
      One more tonne of RDF-1 (46.00 t total, 828.00 GJ, gross 3258.00) gives
        tsr_pct = 828.00 / 3258.00 * 100 = 25.41 > 25.00 -> ERR_TSR_CAP_EXCEEDED.
      With a second alternative fuel TDF-1 authorized only to 10.00 on the same run, the ceiling
      collapses to min(35.00, 25.00, 10.00) = 10.00, so the 25.00 mix above is then refused.

  - name: cement_additive_proportioning
    description: >
      Finish-mill proportioning: how much gypsum and interground limestone join the drawn clinker,
      the resulting cement tonnage, and the blended SO3 of the product.
    algorithm_type: weighted_scoring
    input_set: "the CementBatch's own inputs plus the CEMENT_TYPE_SPECS constants"
    formula: |
      STEP 1 total_batch_tonnes = round( clinker_tonnes_drawn / (1 - (gypsum_pct + limestone_pct)/100), 2 )
      STEP 2 gypsum_tonnes    = round( total_batch_tonnes * gypsum_pct / 100, 2 )
             limestone_tonnes = round( total_batch_tonnes * limestone_pct / 100, 2 )
      STEP 3 cement_tonnes = round( clinker_tonnes_drawn + gypsum_tonnes + limestone_tonnes, 2 )
             ROUND-THEN-SUM IS MANDATORY: cement_tonnes is the sum of the ROUNDED component
             tonnages from step 2, which is why cement_tonnes may differ from total_batch_tonnes
             in the last decimal. total_batch_tonnes is an intermediate, never the reported output.
      STEP 4 so3_pct = round(
               ( clinker_tonnes_drawn * SO3_CLINKER_PCT
               + gypsum_tonnes       * SO3_GYPSUM_PCT
               + limestone_tonnes    * SO3_LIMESTONE_PCT ) / cement_tonnes , 2 )
             using the step-2 rounded tonnages and the step-3 cement_tonnes.
      GATES (checked at POST /cement-ops/cement-batches):
        gypsum_pct outside [GYPSUM_MIN_PCT, GYPSUM_MAX_PCT]                -> ERR_INVALID_REQUEST
        limestone_pct > CEMENT_TYPE_SPECS[cement_type].limestone_max_pct   -> ERR_LIMESTONE_LIMIT_EXCEEDED
        so3_pct > CEMENT_TYPE_SPECS[cement_type].so3_max_pct               -> ERR_SO3_LIMIT_EXCEEDED
        blaine_target_m2_per_kg outside the type's Blaine band             -> ERR_INVALID_REQUEST
    constants:
      SO3_CLINKER_PCT: 0.60
      SO3_GYPSUM_PCT: 46.50
      SO3_LIMESTONE_PCT: 0.05
      GYPSUM_MIN_PCT: 2.00
      GYPSUM_MAX_PCT: 7.00
      CEMENT_TYPE_SPECS:
        TYPE_I:   { limestone_max_pct: 5.00,  so3_max_pct: 3.00, blaine_min_m2_per_kg: 340, blaine_max_m2_per_kg: 420, strength_min_mpa: 28.0 }
        TYPE_IL:  { limestone_max_pct: 15.00, so3_max_pct: 3.00, blaine_min_m2_per_kg: 380, blaine_max_m2_per_kg: 460, strength_min_mpa: 28.0 }
        TYPE_II:  { limestone_max_pct: 5.00,  so3_max_pct: 3.00, blaine_min_m2_per_kg: 320, blaine_max_m2_per_kg: 400, strength_min_mpa: 28.0 }
        TYPE_III: { limestone_max_pct: 5.00,  so3_max_pct: 4.50, blaine_min_m2_per_kg: 500, blaine_max_m2_per_kg: 600, strength_min_mpa: 24.0 }
    precision: "2 decimals, ROUND_HALF_UP"
    worked_example: |
      TYPE_IL batch, clinker_tonnes_drawn 500.00, gypsum_pct 5.00, limestone_pct 8.00:
        total_batch_tonnes = 500.00 / 0.87 = 574.71 (574.712643... -> 574.71)
        gypsum_tonnes      = 574.71 * 0.05  = 28.74  (28.7355 -> 28.74)
        limestone_tonnes   = 574.71 * 0.08  = 45.98  (45.9768 -> 45.98)
        cement_tonnes      = 500.00 + 28.74 + 45.98 = 574.72   <- NOT 574.71
        so3_pct = (500.00*0.60 + 28.74*46.50 + 45.98*0.05) / 574.72
                = (300.00 + 1336.41 + 2.299) / 574.72 = 1638.709/574.72 = 2.85
        2.85 <= 3.00, so the batch is accepted.
      TYPE_I batch with clinker 500.00, gypsum_pct 7.00, limestone_pct 5.00:
        total 568.18, gypsum 39.77, limestone 28.41, cement 568.18,
        so3 = (300.00 + 1849.305 + 1.4205)/568.18 = 3.79 > 3.00 -> ERR_SO3_LIMIT_EXCEEDED.
      TYPE_I batch with clinker 500.00, gypsum_pct 5.00, limestone_pct 5.00:
        total 555.56, gypsum 27.78, limestone 27.78, cement 555.56, so3 2.87 -> accepted.

  - name: lab_spec_bounds
    description: >
      How a LabTest decides its own acceptance bounds and in_spec flag. The bounds depend on the
      polymorphic subject, so the same numeric value can be in spec for one subject and out of
      spec for another.
    algorithm_type: threshold
    input_set: "the LabTest row plus its subject (KilnRun -> Plant, or CementBatch -> cement type)"
    formula: |
      test_type == FREE_LIME (subject KilnRun):
        unit = PCT; spec_min = null; spec_max = Plant.clinker_free_lime_max_pct
        in_spec = (value <= spec_max)                       -- inclusive ceiling
      test_type == BLAINE (subject CementBatch):
        unit = M2_PER_KG
        spec_min = CEMENT_TYPE_SPECS[batch.cement_type].blaine_min_m2_per_kg
        spec_max = CEMENT_TYPE_SPECS[batch.cement_type].blaine_max_m2_per_kg
        in_spec = (spec_min <= value <= spec_max)            -- inclusive on both ends
      test_type == COMPRESSIVE_STRENGTH_28D (subject CementBatch):
        unit = MPA
        spec_min = CEMENT_TYPE_SPECS[batch.cement_type].strength_min_mpa; spec_max = null
        in_spec = (value >= spec_min)                        -- inclusive floor
    constants:
      CEMENT_TYPE_SPECS: "see calculations.cement_additive_proportioning"
    precision: "value stored as given, 2 decimals for PCT and MPA, integer m2/kg for BLAINE"
    worked_example: |
      Plant clinker_free_lime_max_pct 1.50. FREE_LIME 1.50 -> in_spec true (boundary passes);
      1.51 -> in_spec false and the run's quality dimension moves to QUARANTINED.
      BLAINE 380 on a TYPE_IL batch -> in_spec true; the same 380 on a TYPE_III batch (band
      500-600) -> in_spec false and the fineness branch FAILS.

  - name: cement_tonne_conservation
    description: >
      Plant-level cement mass invariant. Every loadout movement must be mass neutral: cement is
      either standing in a CEMENT silo or shipped on a COMPLETED loadout order, never both and
      never neither.
    algorithm_type: aggregation
    input_set: >
      all Silo rows of the plant with material_kind == CEMENT, plus all LoadoutOrder rows on those
      silos with status == COMPLETED
    formula: |
      cement_tonne_balance_tonnes =
        round( sum(Silo.tonnes_on_hand where material_kind == CEMENT)
             + sum(LoadoutOrder.loaded_tonnes where status == COMPLETED) , 2 )
      INVARIANT: this value is unchanged by loadout complete (silo stock -> shipped stock) and by
      loadout void from COMPLETED (shipped stock -> silo stock). It changes only when cement is
      created (finish-grinding) or when the plant's silo set changes.
    constants: {}
    precision: "2 decimals, ROUND_HALF_UP"
    worked_example: |
      After grinding one TYPE_IL batch the CEMENT silo holds 574.72 t and no order is COMPLETED,
      so cement_tonne_balance_tonnes = 574.72. Completing a 120.00 t loadout gives silo 454.72 +
      shipped 120.00 = 574.72 (unchanged). Voiding that COMPLETED order returns the tonnes:
      silo 574.72 + shipped 0.00 = 574.72 (unchanged, and the silo is back to its pre-complete
      figure exactly, with no 0.01 drift).

  - name: nox_budget_conservation
    description: >
      Annual permit mass balance. Charged fuel consumes budget the moment it is charged; aborting
      the run gives every kilogram back.
    algorithm_type: aggregation
    input_set: "all KilnRun rows on kilns of the plant with process_state IN {SCHEDULED, BURNING, COMPLETED}"
    formula: |
      permit_nox_budget_remaining_kg =
        round( Plant.permit_annual_nox_budget_kg - sum(KilnRun.nox_emitted_kg over the input set), 2 )
      A fuel charge is refused with ERR_NOX_BUDGET_EXCEEDED when the charge would drive
      permit_nox_budget_remaining_kg below 0.00. Reaching exactly 0.00 is allowed.
      INVARIANT: abort sets the run's nox_emitted_kg to 0.00 AND moves it out of the input set, so
      the remaining budget returns to its exact pre-charge value.
    constants: {}
    precision: "2 decimals, ROUND_HALF_UP"
    worked_example: |
      Budget 2000000.00 kg. After R0 (216.00 kg) and R1 (756.00 kg) the remaining budget is
      1999028.00. Aborting R1 restores it to 1999784.00 — exactly the figure it held before R1's
      coal was charged.

  - name: distribution_plan_waterfall
    description: >
      Terminal distribution planning: allocate the plant's sellable cement across eligible
      customers in strict priority order, scaling contracted volumes by demand seasonality.
    algorithm_type: waterfall_allocation
    input_set: >
      all Customer rows with contract_state == ACTIVE, credit_hold == false and
      region_code == Plant.region_code; the pool is the plant's CEMENT silo availability
    formula: |
      STEP 1 available_pool_tonnes = round( sum(Silo.available_tonnes where material_kind == CEMENT
                                                and status == OPEN) , 2 )
      STEP 2 seasonal_factor(month) =
               1.25 when month IN Plant.peak_season_months        (checked FIRST — peak wins)
               0.70 when month IN OFF_SEASON_MONTHS
               1.00 otherwise
      STEP 3 demand_tonnes(customer) = round(contract_monthly_tonnes * seasonal_factor(as_of_month), 2)
      STEP 4 rank the eligible customers by
               contract_priority DESC, then contract_monthly_tonnes DESC, then created_at ASC
             (id is never used as a tie-break)
      STEP 5 walk the ranking, carrying remaining = available_pool_tonnes:
               allocated_tonnes = round(min(demand_tonnes, remaining), 2)
               shortfall_tonnes = round(demand_tonnes - allocated_tonnes, 2)
               remaining -= allocated_tonnes
             Every eligible customer appears in the output, including those allocated 0.00.
      STEP 6 total_allocated_tonnes = round(sum(allocated_tonnes), 2)
             total_shortfall_tonnes = round(sum(shortfall_tonnes), 2)
      FALLBACK: when the eligible set is empty the endpoint returns ERR_NO_ELIGIBLE_CUSTOMERS
      rather than an empty plan.
    constants:
      PEAK_SEASON_FACTOR: 1.25
      SHOULDER_SEASON_FACTOR: 1.00
      OFF_SEASON_FACTOR: 0.70
      OFF_SEASON_MONTHS: [12, 1, 2]
    precision: "2 decimals, ROUND_HALF_UP"
    worked_example: |
      Plant peak_season_months [5,6,7,8,9], as_of_month 8 -> seasonal_factor 1.25.
      CEMENT silo: tonnes_on_hand 574.72, reserved 120.00, unreleased 0.00 -> available 454.72.
      Eligible customers: CU1 (priority 10, monthly 4000.00), CU2 (priority 5, monthly 2000.00).
        CU1 demand 5000.00, allocated 454.72, shortfall 4545.28, remaining -> 0.00
        CU2 demand 2500.00, allocated   0.00, shortfall 2500.00
        total_allocated_tonnes 454.72, total_shortfall_tonnes 7045.28
      For as_of_month 1 (OFF) the same customers demand 2800.00 and 1400.00 instead.

# =============================================================================
# §1.4 Validation Rules — evaluated in ascending priority order, first violation wins
# =============================================================================
# The ladder is total: for any request, the implementation walks the rules whose applies_to
# matches, in ascending priority, and returns the FIRST violated rule's error_id. Rules at the
# same priority cannot both be violated by the same request.
# =============================================================================
validations:

  - priority: 10
    category: auth
    name: authentication_present
    applies_to: "every endpoint"
    condition: "X-User-ID and X-User-Role headers are both present and non-empty (a header sent as an empty string counts as absent)"
    error_id: ERR_UNAUTHENTICATED
    status: 401

  - priority: 20
    category: authz
    name: role_permitted_for_endpoint
    applies_to: "every endpoint"
    condition: "X-User-Role is one of the endpoint's declared roles"
    error_id: ERR_UNAUTHORIZED
    status: 403

  - priority: 30
    category: existence
    name: path_entity_exists
    applies_to: "every endpoint carrying a path id"
    condition: "the id in the path resolves to an existing row of the expected entity"
    error_id: "the entity's own ERR_*_NOT_FOUND"
    status: 404

  - priority: 35
    category: existence
    name: body_fk_exists
    applies_to: "every endpoint whose body carries an FK field"
    condition: >
      every FK in the body resolves to an existing row of the target entity. When several FKs are
      unresolvable, the error is chosen by the order the FK fields are declared on the entity in
      §1.1 (top to bottom), not by request-body key order.
    error_id: "the referenced entity's own ERR_*_NOT_FOUND"
    status: 404

  - priority: 40
    category: shape
    name: request_shape_valid
    applies_to: "every write endpoint"
    condition: >
      required fields present; numbers are numbers and non-negative where the field is a tonnage,
      percentage or energy; enums are members of their declared value set; datetimes parse as ISO
      8601 UTC; array fields are arrays; gypsum_pct within [2.00, 7.00]; blaine_target_m2_per_kg
      inside the cement type's Blaine band; as_of_month within [1, 12]
    error_id: ERR_INVALID_REQUEST
    status: 400

  - priority: 42
    category: shape
    name: pagination_valid
    applies_to: "every list endpoint"
    condition: "limit within [1, 100] and offset >= 0, both integers when supplied"
    error_id: ERR_INVALID_PAGINATION
    status: 400

  - priority: 45
    category: scope
    name: customer_scope
    applies_to: "GET /cement-ops/mill-certificates, GET /cement-ops/mill-certificates/{id}, GET /cement-ops/loadout-orders, GET /cement-ops/loadout-orders/{id}"
    condition: >
      a caller with X-User-Role Customer may only read rows whose customer_id equals the Customer
      row whose id is the caller's X-User-ID; list reads are filtered to that customer instead of
      erroring, single reads on another customer's row are refused
    error_id: ERR_CUSTOMER_SCOPE_VIOLATION
    status: 403

  - priority: 50
    category: occ
    name: expected_parent_version_current
    applies_to: "POST /cement-ops/blended-piles, POST /cement-ops/cement-batches, POST /cement-ops/loadout-orders"
    condition: "the supplied expected_<parent>_version equals the parent's current version"
    error_id: "the matching §1.2.1 rule's error_id (ERR_STALE_DESIGN_VERSION | ERR_STALE_SILO_VERSION | ERR_STALE_CERTIFICATE_VERSION)"
    status: 412

  - priority: 55
    category: authz
    name: segregation_of_duties
    applies_to: "POST /cement-ops/raw-mix-designs/{id}/approve, POST /cement-ops/burn-tests/{id}/adjudicate, POST /cement-ops/mill-certificates/{id}/issue"
    condition: >
      X-User-ID differs from the user id that performed the paired upstream act: the design's
      created_by_user_id, the burn test's result_recorded_by_user_id, or the recorded_by_user_id of
      the batch's newest COMPRESSIVE_STRENGTH_28D LabTest
    error_id: ERR_SEGREGATION_OF_DUTIES
    status: 403

  - priority: 60
    category: state
    name: subject_in_required_state
    applies_to: "every transition endpoint"
    condition: "the subject's current state is a legal `from` state for the requested transition (see §1.2)"
    error_id: "the entity's ERR_INVALID_*_STATE (ERR_INVALID_DESIGN_STATE | ERR_INVALID_PILE_STATE | ERR_INVALID_BURN_TEST_STATE | ERR_INVALID_RUN_STATE | ERR_INVALID_OUTAGE_STATE | ERR_INVALID_BATCH_STATE | ERR_INVALID_CERTIFICATE_STATE | ERR_INVALID_ORDER_STATE)"
    status: 409

  - priority: 62
    category: state
    name: silo_not_blocked
    applies_to: "POST /cement-ops/kiln-runs/{id}/complete, POST /cement-ops/kiln-runs/{id}/release-clinker, POST /cement-ops/cement-batches, POST /cement-ops/cement-batches/{id}/start-grinding, POST /cement-ops/cement-batches/{id}/finish-grinding, POST /cement-ops/loadout-orders, POST /cement-ops/loadout-orders/{id}/start-loading"
    condition: "every Silo the operation touches has status == OPEN"
    error_id: ERR_SILO_BLOCKED
    status: 409

  - priority: 64
    category: state
    name: design_approved_for_pile
    applies_to: "POST /cement-ops/blended-piles, POST /cement-ops/blended-piles/{id}/additions, POST /cement-ops/blended-piles/{id}/seal"
    condition: "the referenced RawMixDesign.status == APPROVED"
    error_id: ERR_DESIGN_NOT_APPROVED
    status: 409

  - priority: 65
    category: state
    name: pile_not_empty_at_seal
    applies_to: "POST /cement-ops/blended-piles/{id}/seal"
    condition: "the pile has at least one addition"
    error_id: ERR_PILE_EMPTY
    status: 409

  - priority: 66
    category: state
    name: kiln_available
    applies_to: "POST /cement-ops/kiln-runs/{id}/light"
    condition: "Kiln.availability_state == AVAILABLE and no other KilnRun on that kiln is BURNING"
    error_id: ERR_KILN_UNAVAILABLE
    status: 409

  - priority: 67
    category: state
    name: pile_sealed_for_light
    applies_to: "POST /cement-ops/kiln-runs/{id}/light"
    condition: "the run's BlendedPile.status == SEALED"
    error_id: ERR_INVALID_PILE_STATE
    status: 409

  - priority: 68
    category: state
    name: feed_ready_for_grinding
    applies_to: "POST /cement-ops/cement-batches/{id}/start-grinding"
    condition: "CementBatch.feed_state == FEED_READY"
    error_id: ERR_BATCH_FEED_SHORT
    status: 409

  - priority: 70
    category: business_safety
    name: chlorine_input_within_permit
    applies_to: "POST /cement-ops/kiln-runs/{id}/fuel-charges"
    condition: "the run's chlorine_input_kg AFTER this charge is <= Plant.permit_max_chlorine_kg_per_run (equality allowed)"
    error_id: ERR_CHLORINE_INPUT_EXCEEDED
    status: 422
    note: >
      Deliberately ABOVE the temporal burn-test window checks: a chlorine excursion is a safety
      stop and is reported even when the fuel's authorization has also lapsed.

  - priority: 72
    category: business_safety
    name: tsr_within_effective_ceiling
    applies_to: "POST /cement-ops/kiln-runs/{id}/fuel-charges"
    condition: "the run's tsr_pct AFTER this charge is <= calculations.thermal_substitution_rate.effective_tsr_ceiling_pct (equality allowed)"
    error_id: ERR_TSR_CAP_EXCEEDED
    status: 422

  - priority: 74
    category: business_safety
    name: free_lime_within_spec_for_release
    applies_to: "POST /cement-ops/kiln-runs/{id}/release-clinker"
    condition: "the run has at least one FREE_LIME LabTest and its newest one has free_lime_pct <= Plant.clinker_free_lime_max_pct"
    error_id: ERR_FREE_LIME_OUT_OF_SPEC
    status: 422

  - priority: 76
    category: business_safety
    name: rolling_nox_intensity_within_permit
    applies_to: "POST /cement-ops/kiln-runs/{id}/release-clinker"
    condition: "Plant.rolling_nox_intensity_kg_per_tonne <= Plant.permit_nox_kg_per_tonne_clinker_cap (equality allowed)"
    error_id: ERR_PERMIT_NOX_INTENSITY_EXCEEDED
    status: 422

  - priority: 80
    category: business_temporal
    name: burn_test_authorization_current
    applies_to: "POST /cement-ops/kiln-runs/{id}/fuel-charges"
    condition: >
      for every alternative fuel charged there is a BurnTest for (plant, fuel) with status
      AUTHORIZED (else ERR_BURN_TEST_NOT_AUTHORIZED) whose window covers the clock, i.e.
      valid_from <= clock < valid_until (else ERR_BURN_TEST_EXPIRED)
    error_id: "ERR_BURN_TEST_NOT_AUTHORIZED | ERR_BURN_TEST_EXPIRED"
    status: 422

  - priority: 81
    category: business_temporal
    name: window_ordering
    applies_to: "POST /cement-ops/kiln-runs, POST /cement-ops/kiln-outages, POST /cement-ops/loadout-orders"
    condition: "window_start < window_end and window_start >= the logical clock"
    error_id: ERR_INVALID_WINDOW
    status: 422

  - priority: 82
    category: business_temporal
    name: run_window_active_for_light
    applies_to: "POST /cement-ops/kiln-runs/{id}/light"
    condition: "logical clock >= window_start AND logical clock < window_end (half-open)"
    error_id: ERR_RUN_WINDOW_NOT_ACTIVE
    status: 422

  - priority: 83
    category: business_temporal
    name: run_window_elapsed_for_complete
    applies_to: "POST /cement-ops/kiln-runs/{id}/complete"
    condition: "logical clock >= window_end"
    error_id: ERR_RUN_WINDOW_NOT_ELAPSED
    status: 422

  - priority: 84
    category: business_temporal
    name: loadout_window_active
    applies_to: "POST /cement-ops/loadout-orders/{id}/start-loading"
    condition: "logical clock >= window_start AND logical clock < window_end (half-open)"
    error_id: ERR_LOADOUT_WINDOW_NOT_ACTIVE
    status: 422

  - priority: 85
    category: business_referential
    name: kiln_window_free_of_runs
    applies_to: "POST /cement-ops/kiln-runs"
    condition: >
      the new window does not overlap the CLOSED interval [window_start, window_end] of any
      KilnRun on the same kiln with process_state IN {SCHEDULED, BURNING, COMPLETED}. Kiln run
      windows are closed on both ends: two runs that merely touch at an instant still conflict,
      because the kiln cannot be emptied and recharged instantaneously.
    error_id: ERR_KILN_WINDOW_CONFLICT
    status: 409

  - priority: 86
    category: business_referential
    name: kiln_window_clear_of_outages
    applies_to: "POST /cement-ops/kiln-runs"
    condition: >
      the new window keeps at least Kiln.cooldown_buffer_hours of clearance from the window of
      every KilnOutage on that kiln with status IN {APPROVED, IN_PROGRESS}: the run must satisfy
      window_end + cooldown_buffer_hours <= outage.window_start OR
      outage.window_end + cooldown_buffer_hours <= window_start
    error_id: ERR_KILN_WINDOW_CONFLICT
    status: 409

  - priority: 87
    category: business_referential
    name: outage_window_free
    applies_to: "POST /cement-ops/kiln-outages, POST /cement-ops/kiln-outages/{id}/approve"
    condition: >
      the outage window keeps Kiln.cooldown_buffer_hours of clearance from every KilnRun on that
      kiln with process_state IN {SCHEDULED, BURNING}, and does not overlap another KilnOutage on
      that kiln with status IN {PLANNED, APPROVED, IN_PROGRESS} (half-open comparison)
    error_id: ERR_OUTAGE_WINDOW_CONFLICT
    status: 409

  - priority: 88
    category: business_referential
    name: silo_material_kind_matches
    applies_to: "POST /cement-ops/kiln-runs, POST /cement-ops/cement-batches, POST /cement-ops/loadout-orders"
    condition: >
      clinker_silo_id points at a Silo with material_kind == CLINKER, cement_silo_id at one with
      material_kind == CEMENT, and every silo belongs to the same plant as the operation
    error_id: ERR_SILO_KIND_MISMATCH
    status: 422

  - priority: 89
    category: business_referential
    name: lab_subject_valid
    applies_to: "POST /cement-ops/lab-tests"
    condition: >
      exactly one of kiln_run_id / cement_batch_id is supplied, and it matches the test_type:
      FREE_LIME requires a kiln_run_id, BLAINE and COMPRESSIVE_STRENGTH_28D require a
      cement_batch_id
    error_id: ERR_TEST_SUBJECT_INVALID
    status: 422

  - priority: 90
    category: business_constraint
    name: lab_subject_state_valid
    applies_to: "POST /cement-ops/lab-tests"
    condition: >
      a FREE_LIME subject run has process_state IN {BURNING, COMPLETED}; a BLAINE or
      COMPRESSIVE_STRENGTH_28D subject batch has status == GROUND
    error_id: ERR_LAB_SUBJECT_STATE_INVALID
    status: 409

  - priority: 91
    category: business_constraint
    name: design_components_sum
    applies_to: "POST /cement-ops/raw-mix-designs, PATCH /cement-ops/raw-mix-designs/{id}"
    condition: "components has >= 2 entries and sum(mass_fraction_pct) == 100.00 exactly"
    error_id: ERR_COMPONENTS_SUM_INVALID
    status: 422

  - priority: 92
    category: business_constraint
    name: design_module_within_tolerance
    applies_to: "POST /cement-ops/raw-mix-designs/{id}/submit"
    condition: "round(abs(as_designed_lsf - target_lsf), 2) <= module_tolerance_lsf (equality allowed)"
    error_id: ERR_MODULE_TARGET_DEVIATION
    status: 422

  - priority: 93
    category: business_constraint
    name: revision_budget_remaining
    applies_to: "POST /cement-ops/raw-mix-designs/{id}/request-revision"
    condition: "revision_count < MAX_DESIGN_REVISIONS (3)"
    error_id: ERR_REVISION_LIMIT_EXCEEDED
    status: 409

  - priority: 94
    category: business_constraint
    name: alt_raw_substitution_within_cap
    applies_to: "POST /cement-ops/blended-piles/{id}/additions"
    condition: >
      after the addition, the pile's alt_raw_share_pct is <= the smallest max_substitution_pct
      among the alternative RawMaterials present in the pile (equality allowed). The share is on
      an AS-RECEIVED basis, deliberately different from the DRY basis used for the modules.
    error_id: ERR_ALT_RAW_SUBSTITUTION_EXCEEDED
    status: 422

  - priority: 95
    category: business_constraint
    name: pile_lsf_on_target_at_seal
    applies_to: "POST /cement-ops/blended-piles/{id}/seal"
    condition: "lsf_deviation <= RawMixDesign.pile_lsf_tolerance (equality allowed)"
    error_id: ERR_PILE_LSF_OFF_TARGET
    status: 422

  - priority: 96
    category: business_constraint
    name: limestone_within_cement_type_cap
    applies_to: "POST /cement-ops/cement-batches"
    condition: "limestone_pct <= CEMENT_TYPE_SPECS[cement_type].limestone_max_pct (equality allowed)"
    error_id: ERR_LIMESTONE_LIMIT_EXCEEDED
    status: 422
    note: "Deliberately ABOVE the fiscal capacity checks so a TYPE_I batch asking for 8.00% limestone reports the limestone cap even when the silo cannot cover the draw."

  - priority: 97
    category: business_constraint
    name: so3_within_cement_type_cap
    applies_to: "POST /cement-ops/cement-batches"
    condition: "so3_pct <= CEMENT_TYPE_SPECS[cement_type].so3_max_pct (equality allowed)"
    error_id: ERR_SO3_LIMIT_EXCEEDED
    status: 422

  - priority: 98
    category: business_constraint
    name: batch_qualified_for_certificate
    applies_to: "POST /cement-ops/mill-certificates/{id}/issue"
    condition: "CementBatch.status IN {QUALIFIED, CERTIFIED}"
    error_id: ERR_BATCH_NOT_QUALIFIED
    status: 409

  - priority: 99
    category: business_constraint
    name: customer_spec_met
    applies_to: "POST /cement-ops/mill-certificates/{id}/issue"
    condition: "CementBatch.cement_type == Customer.required_cement_type AND CementBatch.so3_pct <= Customer.max_so3_pct"
    error_id: ERR_CUSTOMER_SPEC_NOT_MET
    status: 422

  - priority: 100
    category: business_fiscal
    name: nox_budget_available
    applies_to: "POST /cement-ops/kiln-runs/{id}/fuel-charges"
    condition: "Plant.permit_nox_budget_remaining_kg after this charge is >= 0.00 (exactly 0.00 allowed)"
    error_id: ERR_NOX_BUDGET_EXCEEDED
    status: 422

  - priority: 101
    category: business_fiscal
    name: kiln_feed_sufficient
    applies_to: "POST /cement-ops/kiln-runs/{id}/complete"
    condition: "round(clinker_tonnes * KILN_FEED_FACTOR, 2) <= BlendedPile.dry_tonnes (equality allowed)"
    error_id: ERR_INSUFFICIENT_KILN_FEED
    status: 422

  - priority: 102
    category: business_fiscal
    name: silo_capacity_available
    applies_to: "POST /cement-ops/kiln-runs/{id}/complete, POST /cement-ops/cement-batches/{id}/finish-grinding, POST /cement-ops/loadout-orders/{id}/void"
    condition: "Silo.tonnes_on_hand + the credited tonnage <= Silo.capacity_tonnes (equality allowed)"
    error_id: ERR_SILO_CAPACITY_EXCEEDED
    status: 422

  - priority: 103
    category: business_fiscal
    name: clinker_availability
    applies_to: "POST /cement-ops/cement-batches"
    condition: "clinker_tonnes_drawn <= clinker Silo.available_tonnes (equality allowed)"
    error_id: ERR_INSUFFICIENT_CLINKER
    status: 422

  - priority: 104
    category: business_fiscal
    name: cement_availability
    applies_to: "POST /cement-ops/loadout-orders"
    condition: "tonnes <= cement Silo.available_tonnes (equality allowed)"
    error_id: ERR_INSUFFICIENT_CEMENT
    status: 422

  - priority: 105
    category: business_fiscal
    name: certificate_allocation_available
    applies_to: "POST /cement-ops/loadout-orders"
    condition: >
      the certificate is ISSUED (else ERR_CERTIFICATE_NOT_ISSUED), its customer_id equals the
      order's customer_id (else ERR_CERTIFICATE_CUSTOMER_MISMATCH), and
      allocated_tonnes + tonnes <= certified_tonnes (equality allowed)
    error_id: "ERR_CERTIFICATE_NOT_ISSUED | ERR_CERTIFICATE_CUSTOMER_MISMATCH | ERR_CERTIFICATE_ALLOCATION_EXCEEDED"
    status: 422

  - priority: 106
    category: business_fiscal
    name: certified_tonnes_within_batch
    applies_to: "POST /cement-ops/mill-certificates/{id}/issue"
    condition: "CementBatch.certified_tonnes_allocated + certified_tonnes <= CementBatch.cement_tonnes (equality allowed)"
    error_id: ERR_CERTIFIED_TONNES_EXCEED_BATCH
    status: 422

  - priority: 107
    category: business_fiscal
    name: spout_and_draw_rate_capacity
    applies_to: "POST /cement-ops/loadout-orders"
    condition: >
      counting only orders on the same Silo with status IN {RESERVED, LOADING} whose HALF-OPEN
      window [window_start, window_end) overlaps the new one, the overlap count must stay below
      Silo.loadout_spouts (else ERR_SILO_SPOUT_CAPACITY); and the order's own tonnes must satisfy
      tonnes <= round(Silo.draw_rate_tonnes_per_hour * scheduled_hours, 2)
      (else ERR_DRAW_RATE_EXCEEDED). Windows that merely touch do not overlap.
    error_id: "ERR_SILO_SPOUT_CAPACITY | ERR_DRAW_RATE_EXCEEDED"
    status: 422

  - priority: 108
    category: business_fiscal
    name: peak_season_outage_needs_override
    applies_to: "POST /cement-ops/kiln-outages"
    condition: >
      when the window intersects any month listed in Plant.peak_season_months, peak_season_override
      must be true and the caller must be PlantAdmin
    error_id: ERR_PEAK_SEASON_OUTAGE
    status: 422

  - priority: 109
    category: business_fiscal
    name: distribution_plan_has_candidates
    applies_to: "GET /cement-ops/plants/{id}/distribution-plan"
    condition: "at least one Customer satisfies the eligibility filter of calculations.distribution_plan_waterfall"
    error_id: ERR_NO_ELIGIBLE_CUSTOMERS
    status: 422

# --- Deliberate priority conflicts (each is a §1.8 rule 5 instance) ----------
# 1. state(62) ERR_SILO_BLOCKED vs fiscal(103) ERR_INSUFFICIENT_CLINKER — a batch created against
#    a BLOCKED clinker silo that also cannot cover the draw reports ERR_SILO_BLOCKED.
# 2. safety(70) ERR_CHLORINE_INPUT_EXCEEDED vs temporal(80) ERR_BURN_TEST_EXPIRED — a chlorine-rich
#    charge of a fuel whose authorization has lapsed reports ERR_CHLORINE_INPUT_EXCEEDED.
# 3. constraint(96) ERR_LIMESTONE_LIMIT_EXCEEDED vs fiscal(103) ERR_INSUFFICIENT_CLINKER — a
#    TYPE_I batch asking 8.00% limestone with an under-stocked silo reports the limestone cap.

# =============================================================================
# §1.5 Endpoint Table
# =============================================================================
# Conventions:
#   * Every path is nested under the api_prefix /cement-ops.
#   * An input field written with a trailing `?` is optional; every other input field is required.
#   * `output: <Entity>` returns one object under data; `output: <Entity>[]` returns a paginated
#     list under data with limit/offset/total_count/has_more in meta.
#   * All list endpoints accept limit? and offset? and order rows by created_at ASC, then id ASC
#     only to break an exact created_at tie.
#   * READ_ROLES below is shorthand for the seven internal roles
#     [PlantAdmin, ProcessEngineer, KilnOperator, LabTechnician, QualityManager,
#      EnvironmentalOfficer, LogisticsPlanner].
# =============================================================================
endpoints:

  # ---------- Plant ----------
  - method: POST
    path: /cement-ops/plants
    roles: [PlantAdmin]
    input: [name, region_code, permit_nox_kg_per_tonne_clinker_cap, permit_annual_nox_budget_kg, permit_max_tsr_pct, permit_max_chlorine_kg_per_run, peak_season_months, clinker_free_lime_max_pct]
    output: Plant
    side_effects: ["creates the plant with permit_nox_budget_remaining_kg = permit_annual_nox_budget_kg, rolling_nox_intensity_kg_per_tonne 0.000, cement_tonne_balance_tonnes 0.00, production_posture NORMAL"]

  - method: GET
    path: /cement-ops/plants/{plant_id}
    roles: [PlantAdmin, ProcessEngineer, KilnOperator, LabTechnician, QualityManager, EnvironmentalOfficer, LogisticsPlanner]
    input: []
    output: Plant

  - method: GET
    path: /cement-ops/plants
    roles: [PlantAdmin, ProcessEngineer, KilnOperator, LabTechnician, QualityManager, EnvironmentalOfficer, LogisticsPlanner]
    input: ["region_code?", "limit?", "offset?"]
    output: Plant[]

  - method: GET
    path: /cement-ops/plants/{plant_id}/distribution-plan
    roles: [PlantAdmin, LogisticsPlanner]
    input: [as_of_month]
    output: "{ plant_id, as_of_month, seasonal_factor, available_pool_tonnes, allocations: [{ customer_id, contract_priority, demand_tonnes, allocated_tonnes, shortfall_tonnes }], total_allocated_tonnes, total_shortfall_tonnes }"
    side_effects: ["pure read; computes calculations.distribution_plan_waterfall and persists nothing"]

  # ---------- RawMaterial ----------
  - method: POST
    path: /cement-ops/raw-materials
    roles: [PlantAdmin, ProcessEngineer]
    input: [code, category, cao_pct, sio2_pct, al2o3_pct, fe2o3_pct, so3_pct, moisture_pct, cost_per_tonne, "is_alternative?", "max_substitution_pct?"]
    output: RawMaterial

  - method: GET
    path: /cement-ops/raw-materials/{raw_material_id}
    roles: [PlantAdmin, ProcessEngineer, KilnOperator, LabTechnician, QualityManager, EnvironmentalOfficer, LogisticsPlanner]
    input: []
    output: RawMaterial

  - method: GET
    path: /cement-ops/raw-materials
    roles: [PlantAdmin, ProcessEngineer, KilnOperator, LabTechnician, QualityManager, EnvironmentalOfficer, LogisticsPlanner]
    input: ["category?", "is_alternative?", "limit?", "offset?"]
    output: RawMaterial[]

  # ---------- Fuel ----------
  - method: POST
    path: /cement-ops/fuels
    roles: [PlantAdmin, EnvironmentalOfficer]
    input: [code, category, lhv_gj_per_tonne, nox_kg_per_gj, co2_kg_per_gj, chlorine_pct, "is_alternative?"]
    output: Fuel

  - method: GET
    path: /cement-ops/fuels/{fuel_id}
    roles: [PlantAdmin, ProcessEngineer, KilnOperator, LabTechnician, QualityManager, EnvironmentalOfficer, LogisticsPlanner]
    input: []
    output: Fuel

  - method: GET
    path: /cement-ops/fuels
    roles: [PlantAdmin, ProcessEngineer, KilnOperator, LabTechnician, QualityManager, EnvironmentalOfficer, LogisticsPlanner]
    input: ["category?", "is_alternative?", "limit?", "offset?"]
    output: Fuel[]

  # ---------- Customer ----------
  - method: POST
    path: /cement-ops/customers
    roles: [PlantAdmin, LogisticsPlanner]
    input: [name, region_code, contract_priority, contract_monthly_tonnes, required_cement_type, max_so3_pct, "contract_state?", "credit_hold?"]
    output: Customer

  - method: PATCH
    path: /cement-ops/customers/{customer_id}
    roles: [PlantAdmin, LogisticsPlanner]
    input: ["contract_state?", "credit_hold?", "contract_priority?", "contract_monthly_tonnes?", "max_so3_pct?"]
    output: Customer
    side_effects: ["version += 1; a customer moved to SUSPENDED or credit_hold true drops out of distribution planning immediately but keeps its existing loadout orders"]

  - method: GET
    path: /cement-ops/customers/{customer_id}
    roles: [PlantAdmin, ProcessEngineer, KilnOperator, LabTechnician, QualityManager, EnvironmentalOfficer, LogisticsPlanner]
    input: []
    output: Customer

  - method: GET
    path: /cement-ops/customers
    roles: [PlantAdmin, ProcessEngineer, KilnOperator, LabTechnician, QualityManager, EnvironmentalOfficer, LogisticsPlanner]
    input: ["region_code?", "contract_state?", "limit?", "offset?"]
    output: Customer[]

  # ---------- RawMixDesign ----------
  - method: POST
    path: /cement-ops/raw-mix-designs
    roles: [ProcessEngineer]
    input: [plant_id, code, target_lsf, target_sm, target_am, components, "module_tolerance_lsf?", "pile_lsf_tolerance?"]
    output: RawMixDesign
    side_effects: ["status DRAFT; created_by_user_id = X-User-ID; as_designed oxides and modules computed per calculations.raw_mix_chemical_modules variant as_designed"]

  - method: PATCH
    path: /cement-ops/raw-mix-designs/{design_id}
    roles: [ProcessEngineer]
    input: ["components?", "target_lsf?", "target_sm?", "target_am?", "module_tolerance_lsf?", "pile_lsf_tolerance?"]
    output: RawMixDesign
    side_effects: ["REVISION_REQUESTED -> DRAFT; as_designed_* recomputed; version += 1"]

  - method: POST
    path: /cement-ops/raw-mix-designs/{design_id}/submit
    roles: [ProcessEngineer]
    input: []
    output: RawMixDesign
    side_effects: ["DRAFT -> SUBMITTED"]

  - method: POST
    path: /cement-ops/raw-mix-designs/{design_id}/request-revision
    roles: [QualityManager]
    input: [revision_reason]
    output: RawMixDesign
    side_effects: ["SUBMITTED -> REVISION_REQUESTED; revision_count += 1"]

  - method: POST
    path: /cement-ops/raw-mix-designs/{design_id}/approve
    roles: [QualityManager]
    input: []
    output: RawMixDesign
    side_effects: ["SUBMITTED -> APPROVED; supersedes the plant's previous APPROVED design (cascade hop 1)"]

  - method: GET
    path: /cement-ops/raw-mix-designs/{design_id}
    roles: [PlantAdmin, ProcessEngineer, KilnOperator, LabTechnician, QualityManager, EnvironmentalOfficer, LogisticsPlanner]
    input: []
    output: RawMixDesign

  - method: GET
    path: /cement-ops/raw-mix-designs
    roles: [PlantAdmin, ProcessEngineer, KilnOperator, LabTechnician, QualityManager, EnvironmentalOfficer, LogisticsPlanner]
    input: ["plant_id?", "status?", "superseded_by_design_id?", "limit?", "offset?"]
    output: RawMixDesign[]

  # ---------- BlendedPile ----------
  - method: POST
    path: /cement-ops/blended-piles
    roles: [ProcessEngineer]
    input: [plant_id, raw_mix_design_id, pile_code, expected_raw_mix_design_version]
    output: BlendedPile
    side_effects: ["status OPEN with empty additions; RawMixDesign.active_pile_count += 1 and RawMixDesign.version += 1 (this is what makes a second create from the same read version stale)"]

  - method: POST
    path: /cement-ops/blended-piles/{pile_id}/additions
    roles: [ProcessEngineer]
    input: [raw_material_id, tonnes_as_received, moisture_pct]
    output: BlendedPile
    side_effects: ["appends to additions; recomputes as_received_tonnes, dry_tonnes, alt_raw_share_pct, all as_blended oxides/modules and lsf_deviation; version += 1"]

  - method: POST
    path: /cement-ops/blended-piles/{pile_id}/seal
    roles: [ProcessEngineer]
    input: []
    output: BlendedPile
    side_effects: ["OPEN -> SEALED; sealed_at set; dry_tonnes frozen"]

  - method: GET
    path: /cement-ops/blended-piles/{pile_id}
    roles: [PlantAdmin, ProcessEngineer, KilnOperator, LabTechnician, QualityManager, EnvironmentalOfficer, LogisticsPlanner]
    input: []
    output: BlendedPile

  - method: GET
    path: /cement-ops/blended-piles
    roles: [PlantAdmin, ProcessEngineer, KilnOperator, LabTechnician, QualityManager, EnvironmentalOfficer, LogisticsPlanner]
    input: ["plant_id?", "raw_mix_design_id?", "status?", "limit?", "offset?"]
    output: BlendedPile[]

  # ---------- BurnTest ----------
  - method: POST
    path: /cement-ops/burn-tests
    roles: [EnvironmentalOfficer, LabTechnician]
    input: [plant_id, fuel_id, requested_max_tsr_pct, valid_days]
    output: BurnTest
    side_effects: ["status REQUESTED; authorized_max_tsr_pct 0"]

  - method: POST
    path: /cement-ops/burn-tests/{burn_test_id}/start
    roles: [LabTechnician]
    input: []
    output: BurnTest
    side_effects: ["REQUESTED -> IN_PROGRESS"]

  - method: POST
    path: /cement-ops/burn-tests/{burn_test_id}/record-result
    roles: [LabTechnician]
    input: [measured_chlorine_pct, measured_nox_kg_per_gj, stack_compliant]
    output: BurnTest
    side_effects: ["IN_PROGRESS -> RESULT_RECORDED; result_recorded_by_user_id = X-User-ID"]

  - method: POST
    path: /cement-ops/burn-tests/{burn_test_id}/adjudicate
    roles: [EnvironmentalOfficer]
    input: [decision, "authorized_max_tsr_pct?", "decision_reason?"]
    output: BurnTest
    side_effects: ["RESULT_RECORDED -> AUTHORIZED (mints valid_from/valid_until and the substitution ceiling) or -> REJECTED (mints nothing)"]

  - method: GET
    path: /cement-ops/burn-tests/{burn_test_id}
    roles: [PlantAdmin, ProcessEngineer, KilnOperator, LabTechnician, QualityManager, EnvironmentalOfficer, LogisticsPlanner]
    input: []
    output: BurnTest

  - method: GET
    path: /cement-ops/burn-tests
    roles: [PlantAdmin, ProcessEngineer, KilnOperator, LabTechnician, QualityManager, EnvironmentalOfficer, LogisticsPlanner]
    input: ["plant_id?", "fuel_id?", "status?", "limit?", "offset?"]
    output: BurnTest[]

  # ---------- Kiln ----------
  - method: POST
    path: /cement-ops/kilns
    roles: [PlantAdmin]
    input: [plant_id, code, nominal_shc_gj_per_tonne, cooldown_buffer_hours, reline_due_hours]
    output: Kiln
    side_effects: ["availability_state AVAILABLE; refractory_hours_since_reline 0"]

  - method: GET
    path: /cement-ops/kilns/{kiln_id}
    roles: [PlantAdmin, ProcessEngineer, KilnOperator, LabTechnician, QualityManager, EnvironmentalOfficer, LogisticsPlanner]
    input: []
    output: Kiln

  - method: GET
    path: /cement-ops/kilns
    roles: [PlantAdmin, ProcessEngineer, KilnOperator, LabTechnician, QualityManager, EnvironmentalOfficer, LogisticsPlanner]
    input: ["plant_id?", "availability_state?", "limit?", "offset?"]
    output: Kiln[]

  # ---------- KilnRun ----------
  - method: POST
    path: /cement-ops/kiln-runs
    roles: [KilnOperator, ProcessEngineer]
    input: [kiln_id, blended_pile_id, clinker_silo_id, window_start, window_end]
    output: KilnRun
    side_effects: ["process_state SCHEDULED, quality_state PENDING_LAB, empty fuel_charges, scheduled_hours computed"]

  - method: POST
    path: /cement-ops/kiln-runs/{kiln_run_id}/light
    roles: [KilnOperator]
    input: []
    output: KilnRun
    side_effects: ["SCHEDULED -> BURNING; consumes the BlendedPile (SEALED -> CONSUMED) and recomputes RawMixDesign.active_pile_count"]

  - method: POST
    path: /cement-ops/kiln-runs/{kiln_run_id}/fuel-charges
    roles: [KilnOperator]
    input: [fuel_id, tonnes]
    output: KilnRun
    side_effects: ["appends to fuel_charges; recomputes gross_energy_gj, provisional_clinker_tonnes, effective_shc_gj_per_tonne, clinker_tonnes, tsr_pct, nox_emitted_kg, chlorine_input_kg, nox_intensity_kg_per_tonne, nox_intensity_breach; reduces Plant.permit_nox_budget_remaining_kg; version += 1"]

  - method: POST
    path: /cement-ops/kiln-runs/{kiln_run_id}/complete
    roles: [KilnOperator]
    input: []
    output: KilnRun
    side_effects: ["BURNING -> COMPLETED; credits the clinker silo as unreleased stock; accrues Kiln.refractory_hours_since_reline; recomputes Plant.rolling_nox_intensity_kg_per_tonne"]

  - method: POST
    path: /cement-ops/kiln-runs/{kiln_run_id}/abort
    roles: [KilnOperator]
    input: [abort_reason]
    output: KilnRun
    side_effects: ["BURNING -> ABORTED; zeroes nox_emitted_kg and clinker_tonnes so Plant.permit_nox_budget_remaining_kg returns to its pre-charge value"]

  - method: POST
    path: /cement-ops/kiln-runs/{kiln_run_id}/release-clinker
    roles: [QualityManager]
    input: []
    output: KilnRun
    side_effects: ["quality_state PENDING_LAB -> RELEASED; runs the 3-hop availability cascade over the clinker silo, FEED_SHORT batches and Plant.production_posture"]

  - method: GET
    path: /cement-ops/kiln-runs/{kiln_run_id}
    roles: [PlantAdmin, ProcessEngineer, KilnOperator, LabTechnician, QualityManager, EnvironmentalOfficer, LogisticsPlanner]
    input: []
    output: KilnRun

  - method: GET
    path: /cement-ops/kiln-runs
    roles: [PlantAdmin, ProcessEngineer, KilnOperator, LabTechnician, QualityManager, EnvironmentalOfficer, LogisticsPlanner]
    input: ["kiln_id?", "blended_pile_id?", "clinker_silo_id?", "process_state?", "quality_state?", "limit?", "offset?"]
    output: KilnRun[]

  # ---------- KilnOutage ----------
  - method: POST
    path: /cement-ops/kiln-outages
    roles: [PlantAdmin, ProcessEngineer]
    input: [kiln_id, window_start, window_end, scope, "peak_season_override?"]
    output: KilnOutage
    side_effects: ["status PLANNED; demand_season_class computed from the months the window intersects"]

  - method: POST
    path: /cement-ops/kiln-outages/{outage_id}/approve
    roles: [PlantAdmin]
    input: []
    output: KilnOutage
    side_effects: ["PLANNED -> APPROVED; the window starts blocking kiln-run windows within cooldown_buffer_hours"]

  - method: POST
    path: /cement-ops/kiln-outages/{outage_id}/start
    roles: [ProcessEngineer]
    input: []
    output: KilnOutage
    side_effects: ["APPROVED -> IN_PROGRESS; Kiln.availability_state = IN_OUTAGE"]

  - method: POST
    path: /cement-ops/kiln-outages/{outage_id}/complete
    roles: [ProcessEngineer]
    input: [refractory_replaced]
    output: KilnOutage
    side_effects: ["IN_PROGRESS -> COMPLETED; refractory_replaced true resets Kiln.refractory_hours_since_reline to 0 and returns the kiln to AVAILABLE; false leaves a due kiln RELINE_DUE"]

  - method: GET
    path: /cement-ops/kiln-outages/{outage_id}
    roles: [PlantAdmin, ProcessEngineer, KilnOperator, LabTechnician, QualityManager, EnvironmentalOfficer, LogisticsPlanner]
    input: []
    output: KilnOutage

  - method: GET
    path: /cement-ops/kiln-outages
    roles: [PlantAdmin, ProcessEngineer, KilnOperator, LabTechnician, QualityManager, EnvironmentalOfficer, LogisticsPlanner]
    input: ["kiln_id?", "status?", "demand_season_class?", "limit?", "offset?"]
    output: KilnOutage[]

  # ---------- Silo ----------
  - method: POST
    path: /cement-ops/silos
    roles: [PlantAdmin]
    input: [plant_id, code, material_kind, capacity_tonnes, draw_rate_tonnes_per_hour, "loadout_spouts?"]
    output: Silo
    side_effects: ["status OPEN; tonnes_on_hand, reserved_tonnes, unreleased_tonnes, available_tonnes all 0.00"]

  - method: PATCH
    path: /cement-ops/silos/{silo_id}
    roles: [PlantAdmin]
    input: [status, "block_reason?"]
    output: Silo
    side_effects: ["OPEN -> BLOCKED cancels the silo's open loadout orders (CEMENT) or short-feeds its PLANNED batches (CLINKER); BLOCKED -> OPEN reconciles FEED_SHORT batches back to FEED_READY"]

  - method: GET
    path: /cement-ops/silos/{silo_id}
    roles: [PlantAdmin, ProcessEngineer, KilnOperator, LabTechnician, QualityManager, EnvironmentalOfficer, LogisticsPlanner]
    input: []
    output: Silo

  - method: GET
    path: /cement-ops/silos
    roles: [PlantAdmin, ProcessEngineer, KilnOperator, LabTechnician, QualityManager, EnvironmentalOfficer, LogisticsPlanner]
    input: ["plant_id?", "material_kind?", "status?", "limit?", "offset?"]
    output: Silo[]

  # ---------- CementBatch ----------
  - method: POST
    path: /cement-ops/cement-batches
    roles: [ProcessEngineer]
    input: [plant_id, clinker_silo_id, cement_silo_id, cement_type, clinker_tonnes_drawn, gypsum_pct, limestone_pct, blaine_target_m2_per_kg, expected_clinker_silo_version]
    output: CementBatch
    side_effects: ["status PLANNED, feed_state FEED_READY; runs calculations.cement_additive_proportioning; reserves clinker_tonnes_drawn on the clinker silo and bumps Silo.version"]

  - method: POST
    path: /cement-ops/cement-batches/{cement_batch_id}/start-grinding
    roles: [KilnOperator]
    input: []
    output: CementBatch
    side_effects: ["PLANNED -> GRINDING; converts the clinker reservation into a physical draw"]

  - method: POST
    path: /cement-ops/cement-batches/{cement_batch_id}/finish-grinding
    roles: [KilnOperator]
    input: []
    output: CementBatch
    side_effects: ["GRINDING -> GROUND; credits cement_tonnes to the cement silo as unreleased stock; opens the strength and fineness branches"]

  - method: GET
    path: /cement-ops/cement-batches/{cement_batch_id}
    roles: [PlantAdmin, ProcessEngineer, KilnOperator, LabTechnician, QualityManager, EnvironmentalOfficer, LogisticsPlanner]
    input: []
    output: CementBatch

  - method: GET
    path: /cement-ops/cement-batches
    roles: [PlantAdmin, ProcessEngineer, KilnOperator, LabTechnician, QualityManager, EnvironmentalOfficer, LogisticsPlanner]
    input: ["plant_id?", "clinker_silo_id?", "cement_silo_id?", "status?", "feed_state?", "limit?", "offset?"]
    output: CementBatch[]

  # ---------- LabTest ----------
  - method: POST
    path: /cement-ops/lab-tests
    roles: [LabTechnician]
    input: [test_type, value, "kiln_run_id?", "cement_batch_id?"]
    output: LabTest
    side_effects: ["immutable row; derives unit/spec_min/spec_max/in_spec per calculations.lab_spec_bounds; drives the subject's quality dimension: a KilnRun's quality_state (including the RELEASED -> QUARANTINED withdrawal cascade) or a CementBatch's strength/fineness branch and its join"]

  - method: GET
    path: /cement-ops/lab-tests/{lab_test_id}
    roles: [PlantAdmin, ProcessEngineer, KilnOperator, LabTechnician, QualityManager, EnvironmentalOfficer, LogisticsPlanner]
    input: []
    output: LabTest

  - method: GET
    path: /cement-ops/lab-tests
    roles: [PlantAdmin, ProcessEngineer, KilnOperator, LabTechnician, QualityManager, EnvironmentalOfficer, LogisticsPlanner]
    input: ["kiln_run_id?", "cement_batch_id?", "test_type?", "limit?", "offset?"]
    output: LabTest[]

  # ---------- MillCertificate ----------
  - method: POST
    path: /cement-ops/mill-certificates
    roles: [QualityManager]
    input: [cement_batch_id, customer_id, certified_tonnes]
    output: MillCertificate
    side_effects: ["status DRAFT; certified_blaine_m2_per_kg, certified_strength_mpa and certified_so3_pct snapshot the batch's newest in-spec lab results"]

  - method: POST
    path: /cement-ops/mill-certificates/{mill_certificate_id}/issue
    roles: [QualityManager]
    input: []
    output: MillCertificate
    side_effects: ["DRAFT -> ISSUED; CementBatch QUALIFIED -> CERTIFIED and certified_tonnes_allocated grows"]

  - method: POST
    path: /cement-ops/mill-certificates/{mill_certificate_id}/revoke
    roles: [QualityManager]
    input: [revoke_reason]
    output: MillCertificate
    side_effects: ["ISSUED -> REVOKED; runs the 4-hop cascade MillCertificate -> CementBatch -> Silo -> LoadoutOrder -> Customer"]

  - method: GET
    path: /cement-ops/mill-certificates/{mill_certificate_id}
    roles: [PlantAdmin, ProcessEngineer, KilnOperator, LabTechnician, QualityManager, EnvironmentalOfficer, LogisticsPlanner, Customer]
    input: []
    output: MillCertificate

  - method: GET
    path: /cement-ops/mill-certificates
    roles: [PlantAdmin, ProcessEngineer, KilnOperator, LabTechnician, QualityManager, EnvironmentalOfficer, LogisticsPlanner, Customer]
    input: ["cement_batch_id?", "customer_id?", "status?", "limit?", "offset?"]
    output: MillCertificate[]

  # ---------- LoadoutOrder ----------
  - method: POST
    path: /cement-ops/loadout-orders
    roles: [LogisticsPlanner]
    input: [customer_id, cement_silo_id, mill_certificate_id, window_start, window_end, tonnes, expected_mill_certificate_version]
    output: LoadoutOrder
    side_effects: ["status RESERVED; reserves tonnes on the cement silo; grows Customer.open_reserved_tonnes and MillCertificate.allocated_tonnes; bumps MillCertificate.version"]

  - method: POST
    path: /cement-ops/loadout-orders/{loadout_order_id}/start-loading
    roles: [LogisticsPlanner]
    input: []
    output: LoadoutOrder
    side_effects: ["RESERVED -> LOADING; occupies one of the silo's loadout spouts"]

  - method: POST
    path: /cement-ops/loadout-orders/{loadout_order_id}/complete
    roles: [LogisticsPlanner]
    input: [loaded_tonnes]
    output: LoadoutOrder
    side_effects: ["LOADING -> COMPLETED; moves loaded_tonnes out of the silo into shipped stock, leaving Plant.cement_tonne_balance_tonnes unchanged"]

  - method: POST
    path: /cement-ops/loadout-orders/{loadout_order_id}/void
    roles: [LogisticsPlanner]
    input: [void_reason]
    output: LoadoutOrder
    side_effects: ["RESERVED/LOADING -> VOIDED releases the reservation; COMPLETED -> VOIDED returns the shipped tonnes to the silo and restores Plant.cement_tonne_balance_tonnes exactly"]

  - method: GET
    path: /cement-ops/loadout-orders/{loadout_order_id}
    roles: [PlantAdmin, ProcessEngineer, KilnOperator, LabTechnician, QualityManager, EnvironmentalOfficer, LogisticsPlanner, Customer]
    input: []
    output: LoadoutOrder

  - method: GET
    path: /cement-ops/loadout-orders
    roles: [PlantAdmin, ProcessEngineer, KilnOperator, LabTechnician, QualityManager, EnvironmentalOfficer, LogisticsPlanner, Customer]
    input: ["customer_id?", "cement_silo_id?", "mill_certificate_id?", "status?", "limit?", "offset?"]
    output: LoadoutOrder[]

  # ---------- Logical clock (test harness) ----------
  - method: POST
    path: /cement-ops/_clock/set_current_utc
    roles: [PlantAdmin, ProcessEngineer, KilnOperator, LabTechnician, QualityManager, EnvironmentalOfficer, LogisticsPlanner]
    input: [to_iso8601]
    output: "{ current_utc }"
    side_effects: >
      Sets the server's logical clock, which is the ONLY source of "now" for every temporal
      comparison, computed timestamp and rolling window in this API. The clock STARTS AT
      2026-08-01T00:00:00Z on server startup and moves only when this endpoint is called; it never
      advances on its own. Moving the clock never retro-transitions any entity: windows are
      evaluated when an endpoint is called, not by a background sweep.

# =============================================================================
# §1.6 Error Catalog
# =============================================================================
errors:

  # ---- authentication / authorization ----
  - { error_id: ERR_UNAUTHENTICATED, status: 401, meaning: "X-User-ID or X-User-Role missing or empty", triggered_by: "any endpoint called without both headers" }
  - { error_id: ERR_UNAUTHORIZED, status: 403, meaning: "the role is not permitted on this endpoint", triggered_by: "e.g. KilnOperator calling POST /cement-ops/raw-mix-designs/{id}/approve" }
  - { error_id: ERR_CUSTOMER_SCOPE_VIOLATION, status: 403, meaning: "a Customer caller read another customer's certificate or loadout order", triggered_by: "GET /cement-ops/mill-certificates/{id} or GET /cement-ops/loadout-orders/{id} for a foreign customer_id" }
  - { error_id: ERR_SEGREGATION_OF_DUTIES, status: 403, meaning: "the same X-User-ID performed both halves of a two-person control", triggered_by: "design approve by its author, burn-test adjudicate by the result recorder, certificate issue by the strength-test recorder" }

  # ---- shape ----
  - { error_id: ERR_INVALID_REQUEST, status: 400, meaning: "missing required field, wrong type, bad enum, unparseable datetime, gypsum_pct outside 2.00-7.00, blaine target outside the cement type band, as_of_month outside 1-12", triggered_by: "any write endpoint" }
  - { error_id: ERR_INVALID_PAGINATION, status: 400, meaning: "limit outside 1-100 or negative offset", triggered_by: "any list endpoint" }

  # ---- not found (one per entity) ----
  - { error_id: ERR_PLANT_NOT_FOUND, status: 404, meaning: "no Plant with that id", triggered_by: "any path or body plant_id that does not resolve" }
  - { error_id: ERR_RAW_MATERIAL_NOT_FOUND, status: 404, meaning: "no RawMaterial with that id", triggered_by: "GET /cement-ops/raw-materials/{id}; unknown raw_material_id in a design component or a pile addition" }
  - { error_id: ERR_FUEL_NOT_FOUND, status: 404, meaning: "no Fuel with that id", triggered_by: "GET /cement-ops/fuels/{id}; unknown fuel_id on a burn test or a fuel charge" }
  - { error_id: ERR_CUSTOMER_NOT_FOUND, status: 404, meaning: "no Customer with that id", triggered_by: "GET /cement-ops/customers/{id}; unknown customer_id on a certificate or an order" }
  - { error_id: ERR_DESIGN_NOT_FOUND, status: 404, meaning: "no RawMixDesign with that id", triggered_by: "any raw-mix-design path or the raw_mix_design_id of a pile" }
  - { error_id: ERR_PILE_NOT_FOUND, status: 404, meaning: "no BlendedPile with that id", triggered_by: "any blended-pile path or the blended_pile_id of a kiln run" }
  - { error_id: ERR_BURN_TEST_NOT_FOUND, status: 404, meaning: "no BurnTest with that id", triggered_by: "any burn-test path" }
  - { error_id: ERR_KILN_NOT_FOUND, status: 404, meaning: "no Kiln with that id", triggered_by: "any kiln path or the kiln_id of a run or outage" }
  - { error_id: ERR_KILN_RUN_NOT_FOUND, status: 404, meaning: "no KilnRun with that id", triggered_by: "any kiln-run path or the kiln_run_id of a lab test" }
  - { error_id: ERR_OUTAGE_NOT_FOUND, status: 404, meaning: "no KilnOutage with that id", triggered_by: "any kiln-outage path" }
  - { error_id: ERR_SILO_NOT_FOUND, status: 404, meaning: "no Silo with that id", triggered_by: "any silo path or a clinker_silo_id / cement_silo_id that does not resolve" }
  - { error_id: ERR_BATCH_NOT_FOUND, status: 404, meaning: "no CementBatch with that id", triggered_by: "any cement-batch path or the cement_batch_id of a lab test or certificate" }
  - { error_id: ERR_LAB_TEST_NOT_FOUND, status: 404, meaning: "no LabTest with that id", triggered_by: "GET /cement-ops/lab-tests/{id}" }
  - { error_id: ERR_CERTIFICATE_NOT_FOUND, status: 404, meaning: "no MillCertificate with that id", triggered_by: "any mill-certificate path or the mill_certificate_id of an order" }
  - { error_id: ERR_ORDER_NOT_FOUND, status: 404, meaning: "no LoadoutOrder with that id", triggered_by: "any loadout-order path" }

  # ---- optimistic concurrency ----
  - { error_id: ERR_STALE_DESIGN_VERSION, status: 412, meaning: "expected_raw_mix_design_version does not match RawMixDesign.version", triggered_by: "POST /cement-ops/blended-piles" }
  - { error_id: ERR_STALE_SILO_VERSION, status: 412, meaning: "expected_clinker_silo_version does not match Silo.version", triggered_by: "POST /cement-ops/cement-batches" }
  - { error_id: ERR_STALE_CERTIFICATE_VERSION, status: 412, meaning: "expected_mill_certificate_version does not match MillCertificate.version", triggered_by: "POST /cement-ops/loadout-orders" }

  # ---- state ----
  - { error_id: ERR_INVALID_DESIGN_STATE, status: 409, meaning: "the design is not in a legal from-state for the transition", triggered_by: "submit on an APPROVED design, approve on a DRAFT design, PATCH on a SUPERSEDED design" }
  - { error_id: ERR_INVALID_PILE_STATE, status: 409, meaning: "the pile is not in a legal from-state", triggered_by: "additions or seal on a SEALED or CONSUMED pile; light on a run whose pile is still OPEN" }
  - { error_id: ERR_INVALID_BURN_TEST_STATE, status: 409, meaning: "the burn test is not in a legal from-state", triggered_by: "record-result on a REQUESTED test, adjudicate on an IN_PROGRESS test, start on an AUTHORIZED test" }
  - { error_id: ERR_INVALID_RUN_STATE, status: 409, meaning: "the run's process_state or quality_state is not legal for the transition", triggered_by: "light on a BURNING run, complete on a SCHEDULED run, release-clinker on a QUARANTINED or already RELEASED run, abort on a COMPLETED run" }
  - { error_id: ERR_INVALID_OUTAGE_STATE, status: 409, meaning: "the outage is not in a legal from-state", triggered_by: "start on a PLANNED outage, complete on an APPROVED outage, approve on an IN_PROGRESS outage" }
  - { error_id: ERR_INVALID_BATCH_STATE, status: 409, meaning: "the batch is not in a legal from-state", triggered_by: "start-grinding on a GROUND batch, finish-grinding on a PLANNED batch" }
  - { error_id: ERR_INVALID_CERTIFICATE_STATE, status: 409, meaning: "the certificate is not in a legal from-state", triggered_by: "issue on an ISSUED or REVOKED certificate, revoke on a DRAFT certificate" }
  - { error_id: ERR_INVALID_ORDER_STATE, status: 409, meaning: "the order is not in a legal from-state", triggered_by: "complete on a RESERVED order, start-loading on a COMPLETED order, void on a VOIDED or CANCELLED_BY_QUALITY order" }
  - { error_id: ERR_SILO_BLOCKED, status: 409, meaning: "a silo the operation touches is BLOCKED", triggered_by: "kiln-run complete or release-clinker, cement-batch create / start-grinding / finish-grinding, loadout create or start-loading" }
  - { error_id: ERR_DESIGN_NOT_APPROVED, status: 409, meaning: "the pile's RawMixDesign is not APPROVED", triggered_by: "POST /cement-ops/blended-piles against a DRAFT, SUBMITTED, REVISION_REQUESTED or SUPERSEDED design" }
  - { error_id: ERR_PILE_EMPTY, status: 409, meaning: "a pile with zero additions cannot be sealed", triggered_by: "POST /cement-ops/blended-piles/{id}/seal immediately after create" }
  - { error_id: ERR_KILN_UNAVAILABLE, status: 409, meaning: "the kiln is RELINE_DUE or IN_OUTAGE, or already has a BURNING run", triggered_by: "POST /cement-ops/kiln-runs/{id}/light" }
  - { error_id: ERR_BATCH_FEED_SHORT, status: 409, meaning: "the batch's reserved clinker is no longer backed by available stock", triggered_by: "POST /cement-ops/cement-batches/{id}/start-grinding on a FEED_SHORT batch" }
  - { error_id: ERR_REVISION_LIMIT_EXCEEDED, status: 409, meaning: "the design has already used its 3 revision rounds", triggered_by: "the 4th POST /cement-ops/raw-mix-designs/{id}/request-revision" }
  - { error_id: ERR_KILN_WINDOW_CONFLICT, status: 409, meaning: "the run window overlaps another run's closed interval on the same kiln, or sits within cooldown_buffer_hours of an APPROVED/IN_PROGRESS outage", triggered_by: "POST /cement-ops/kiln-runs" }
  - { error_id: ERR_OUTAGE_WINDOW_CONFLICT, status: 409, meaning: "the outage window collides with a scheduled run's cooldown clearance or with another outage", triggered_by: "POST /cement-ops/kiln-outages, POST /cement-ops/kiln-outages/{id}/approve" }
  - { error_id: ERR_LAB_SUBJECT_STATE_INVALID, status: 409, meaning: "the subject is not in a testable state", triggered_by: "FREE_LIME on a SCHEDULED run; BLAINE or COMPRESSIVE_STRENGTH_28D on a batch that is not GROUND" }
  - { error_id: ERR_BATCH_NOT_QUALIFIED, status: 409, meaning: "the batch has not passed both qualification branches", triggered_by: "POST /cement-ops/mill-certificates/{id}/issue on a GROUND, REJECTED or DECERTIFIED batch" }

  # ---- safety / permit ----
  - { error_id: ERR_CHLORINE_INPUT_EXCEEDED, status: 422, meaning: "the charge would push the run's chlorine input above the permit ceiling", triggered_by: "POST /cement-ops/kiln-runs/{id}/fuel-charges" }
  - { error_id: ERR_TSR_CAP_EXCEEDED, status: 422, meaning: "the charge would push the run's thermal substitution rate above the effective ceiling", triggered_by: "POST /cement-ops/kiln-runs/{id}/fuel-charges" }
  - { error_id: ERR_BURN_TEST_NOT_AUTHORIZED, status: 422, meaning: "no AUTHORIZED burn test exists for this plant and alternative fuel", triggered_by: "POST /cement-ops/kiln-runs/{id}/fuel-charges" }
  - { error_id: ERR_BURN_TEST_EXPIRED, status: 422, meaning: "the burn-test authorization window has elapsed (clock >= valid_until)", triggered_by: "POST /cement-ops/kiln-runs/{id}/fuel-charges" }
  - { error_id: ERR_NOX_BUDGET_EXCEEDED, status: 422, meaning: "the charge would drive the plant's annual NOx budget negative", triggered_by: "POST /cement-ops/kiln-runs/{id}/fuel-charges" }
  - { error_id: ERR_FREE_LIME_OUT_OF_SPEC, status: 422, meaning: "the run has no FREE_LIME test, or its newest one is above the plant ceiling", triggered_by: "POST /cement-ops/kiln-runs/{id}/release-clinker" }
  - { error_id: ERR_PERMIT_NOX_INTENSITY_EXCEEDED, status: 422, meaning: "the plant's rolling 30-day NOx intensity is above the permit cap", triggered_by: "POST /cement-ops/kiln-runs/{id}/release-clinker" }

  # ---- temporal ----
  - { error_id: ERR_INVALID_WINDOW, status: 422, meaning: "window_start >= window_end, or window_start earlier than the logical clock", triggered_by: "POST /cement-ops/kiln-runs, POST /cement-ops/kiln-outages, POST /cement-ops/loadout-orders" }
  - { error_id: ERR_RUN_WINDOW_NOT_ACTIVE, status: 422, meaning: "the clock is outside the run's half-open firing window", triggered_by: "POST /cement-ops/kiln-runs/{id}/light" }
  - { error_id: ERR_RUN_WINDOW_NOT_ELAPSED, status: 422, meaning: "the clock has not reached window_end", triggered_by: "POST /cement-ops/kiln-runs/{id}/complete" }
  - { error_id: ERR_LOADOUT_WINDOW_NOT_ACTIVE, status: 422, meaning: "the clock is outside the order's half-open appointment window", triggered_by: "POST /cement-ops/loadout-orders/{id}/start-loading" }

  # ---- referential ----
  - { error_id: ERR_SILO_KIND_MISMATCH, status: 422, meaning: "a silo's material_kind or plant does not match its role in the request", triggered_by: "POST /cement-ops/kiln-runs, POST /cement-ops/cement-batches, POST /cement-ops/loadout-orders" }
  - { error_id: ERR_TEST_SUBJECT_INVALID, status: 422, meaning: "zero or two subject ids supplied, or the subject kind does not match test_type", triggered_by: "POST /cement-ops/lab-tests" }

  # ---- domain constraints ----
  - { error_id: ERR_COMPONENTS_SUM_INVALID, status: 422, meaning: "fewer than 2 components or mass fractions not summing to exactly 100.00", triggered_by: "POST and PATCH on /cement-ops/raw-mix-designs" }
  - { error_id: ERR_MODULE_TARGET_DEVIATION, status: 422, meaning: "|as_designed_lsf - target_lsf| exceeds module_tolerance_lsf", triggered_by: "POST /cement-ops/raw-mix-designs/{id}/submit" }
  - { error_id: ERR_ALT_RAW_SUBSTITUTION_EXCEEDED, status: 422, meaning: "the addition pushes the pile's as-received alternative share above the material cap", triggered_by: "POST /cement-ops/blended-piles/{id}/additions" }
  - { error_id: ERR_PILE_LSF_OFF_TARGET, status: 422, meaning: "the pile's as-blended LSF deviates from the design target by more than pile_lsf_tolerance", triggered_by: "POST /cement-ops/blended-piles/{id}/seal" }
  - { error_id: ERR_LIMESTONE_LIMIT_EXCEEDED, status: 422, meaning: "limestone_pct above the cement type's interground limestone cap", triggered_by: "POST /cement-ops/cement-batches" }
  - { error_id: ERR_SO3_LIMIT_EXCEEDED, status: 422, meaning: "the computed cement SO3 is above the cement type's ceiling", triggered_by: "POST /cement-ops/cement-batches" }
  - { error_id: ERR_CUSTOMER_SPEC_NOT_MET, status: 422, meaning: "the batch's cement type or SO3 does not satisfy the customer's contract specification", triggered_by: "POST /cement-ops/mill-certificates/{id}/issue" }
  - { error_id: ERR_PEAK_SEASON_OUTAGE, status: 422, meaning: "an outage window intersects a peak-demand month without a PlantAdmin override", triggered_by: "POST /cement-ops/kiln-outages" }
  - { error_id: ERR_NO_ELIGIBLE_CUSTOMERS, status: 422, meaning: "no ACTIVE, non-held, in-region customer exists to plan against", triggered_by: "GET /cement-ops/plants/{id}/distribution-plan" }

  # ---- capacity / allocation ----
  - { error_id: ERR_INSUFFICIENT_KILN_FEED, status: 422, meaning: "the pile's dry tonnage cannot support the clinker the fuel energy implies", triggered_by: "POST /cement-ops/kiln-runs/{id}/complete" }
  - { error_id: ERR_SILO_CAPACITY_EXCEEDED, status: 422, meaning: "the credited tonnage would overfill the silo", triggered_by: "kiln-run complete, cement-batch finish-grinding, loadout void from COMPLETED" }
  - { error_id: ERR_INSUFFICIENT_CLINKER, status: 422, meaning: "the clinker silo's available tonnage cannot cover the draw", triggered_by: "POST /cement-ops/cement-batches" }
  - { error_id: ERR_INSUFFICIENT_CEMENT, status: 422, meaning: "the cement silo's available tonnage cannot cover the reservation", triggered_by: "POST /cement-ops/loadout-orders" }
  - { error_id: ERR_CERTIFICATE_NOT_ISSUED, status: 422, meaning: "the certificate is DRAFT or REVOKED", triggered_by: "POST /cement-ops/loadout-orders" }
  - { error_id: ERR_CERTIFICATE_CUSTOMER_MISMATCH, status: 422, meaning: "the order's customer differs from the certificate's customer", triggered_by: "POST /cement-ops/loadout-orders" }
  - { error_id: ERR_CERTIFICATE_ALLOCATION_EXCEEDED, status: 422, meaning: "the order would draw more than the certificate's certified tonnage", triggered_by: "POST /cement-ops/loadout-orders" }
  - { error_id: ERR_CERTIFIED_TONNES_EXCEED_BATCH, status: 422, meaning: "certificates would certify more tonnes than the batch produced", triggered_by: "POST /cement-ops/mill-certificates/{id}/issue" }
  - { error_id: ERR_SILO_SPOUT_CAPACITY, status: 422, meaning: "the silo's loadout spouts are all taken across the requested half-open window", triggered_by: "POST /cement-ops/loadout-orders" }
  - { error_id: ERR_DRAW_RATE_EXCEEDED, status: 422, meaning: "the tonnage exceeds what the silo can extract in the requested window", triggered_by: "POST /cement-ops/loadout-orders" }

# =============================================================================
# §1.7 RBAC Table
# =============================================================================
roles:

  - name: PlantAdmin
    identity: opaque
    description: "Plant master data and physical asset owner; the only role that can override peak-season outage rules."
    exclusive_operations:
      - "POST /cement-ops/plants"
      - "POST /cement-ops/kilns"
      - "POST /cement-ops/silos"
      - "PATCH /cement-ops/silos/{silo_id}"
      - "POST /cement-ops/kiln-outages/{outage_id}/approve"
      - "POST /cement-ops/kiln-outages with peak_season_override = true"
    shared_operations:
      - "POST /cement-ops/raw-materials (with ProcessEngineer)"
      - "POST /cement-ops/fuels (with EnvironmentalOfficer)"
      - "POST /cement-ops/customers, PATCH /cement-ops/customers/{id} (with LogisticsPlanner)"
      - "POST /cement-ops/kiln-outages (with ProcessEngineer)"
      - "GET /cement-ops/plants/{id}/distribution-plan (with LogisticsPlanner)"
      - "every GET in the API"

  - name: ProcessEngineer
    identity: opaque
    description: "Authors raw mix designs and blends piles; schedules outages. May never approve its own design."
    exclusive_operations:
      - "POST /cement-ops/raw-mix-designs"
      - "PATCH /cement-ops/raw-mix-designs/{design_id}"
      - "POST /cement-ops/raw-mix-designs/{design_id}/submit"
      - "POST /cement-ops/blended-piles"
      - "POST /cement-ops/blended-piles/{pile_id}/additions"
      - "POST /cement-ops/blended-piles/{pile_id}/seal"
      - "POST /cement-ops/cement-batches"
      - "POST /cement-ops/kiln-outages/{outage_id}/start"
      - "POST /cement-ops/kiln-outages/{outage_id}/complete"
    shared_operations:
      - "POST /cement-ops/raw-materials (with PlantAdmin)"
      - "POST /cement-ops/kiln-runs (with KilnOperator)"
      - "POST /cement-ops/kiln-outages (with PlantAdmin)"
      - "every GET in the API"

  - name: KilnOperator
    identity: opaque
    description: "Fires kilns and runs the finish mills."
    exclusive_operations:
      - "POST /cement-ops/kiln-runs/{kiln_run_id}/light"
      - "POST /cement-ops/kiln-runs/{kiln_run_id}/fuel-charges"
      - "POST /cement-ops/kiln-runs/{kiln_run_id}/complete"
      - "POST /cement-ops/kiln-runs/{kiln_run_id}/abort"
      - "POST /cement-ops/cement-batches/{cement_batch_id}/start-grinding"
      - "POST /cement-ops/cement-batches/{cement_batch_id}/finish-grinding"
    shared_operations:
      - "POST /cement-ops/kiln-runs (with ProcessEngineer)"
      - "every GET in the API"

  - name: LabTechnician
    identity: opaque
    description: "Records every measurement; never adjudicates or certifies what it measured."
    exclusive_operations:
      - "POST /cement-ops/lab-tests"
      - "POST /cement-ops/burn-tests/{burn_test_id}/start"
      - "POST /cement-ops/burn-tests/{burn_test_id}/record-result"
    shared_operations:
      - "POST /cement-ops/burn-tests (with EnvironmentalOfficer)"
      - "every GET in the API"

  - name: QualityManager
    identity: opaque
    description: "Owns design approval, clinker release and mill certificates. Blocked by segregation of duties from approving a design it authored or certifying a batch whose strength it recorded."
    exclusive_operations:
      - "POST /cement-ops/raw-mix-designs/{design_id}/request-revision"
      - "POST /cement-ops/raw-mix-designs/{design_id}/approve"
      - "POST /cement-ops/kiln-runs/{kiln_run_id}/release-clinker"
      - "POST /cement-ops/mill-certificates"
      - "POST /cement-ops/mill-certificates/{mill_certificate_id}/issue"
      - "POST /cement-ops/mill-certificates/{mill_certificate_id}/revoke"
    shared_operations:
      - "every GET in the API"

  - name: EnvironmentalOfficer
    identity: opaque
    description: "Owns the air permit: registers fuels and adjudicates trial burns."
    exclusive_operations:
      - "POST /cement-ops/burn-tests/{burn_test_id}/adjudicate"
    shared_operations:
      - "POST /cement-ops/fuels (with PlantAdmin)"
      - "POST /cement-ops/burn-tests (with LabTechnician)"
      - "every GET in the API"

  - name: LogisticsPlanner
    identity: opaque
    description: "Runs the terminal: customers, loadout appointments and distribution planning."
    exclusive_operations:
      - "POST /cement-ops/loadout-orders"
      - "POST /cement-ops/loadout-orders/{loadout_order_id}/start-loading"
      - "POST /cement-ops/loadout-orders/{loadout_order_id}/complete"
      - "POST /cement-ops/loadout-orders/{loadout_order_id}/void"
    shared_operations:
      - "POST /cement-ops/customers, PATCH /cement-ops/customers/{id} (with PlantAdmin)"
      - "GET /cement-ops/plants/{id}/distribution-plan (with PlantAdmin)"
      - "every GET in the API"

  - name: Customer
    identity: entity_backed:Customer
    description: >
      External buyer. X-User-ID is the Customer.id, so scope is enforced by row ownership: a
      Customer may read only its own mill certificates and loadout orders, and may write nothing.
    exclusive_operations: []
    shared_operations:
      - "GET /cement-ops/mill-certificates and GET /cement-ops/mill-certificates/{id} — scoped to own customer_id"
      - "GET /cement-ops/loadout-orders and GET /cement-ops/loadout-orders/{id} — scoped to own customer_id"

# --- Segregation-of-duties pairs (role_model: segregation_of_duties) ---------
# 1. RawMixDesign.created_by_user_id  != approver X-User-ID  (approve)
# 2. BurnTest.result_recorded_by_user_id != adjudicator X-User-ID (adjudicate)
# 3. newest COMPRESSIVE_STRENGTH_28D LabTest.recorded_by_user_id != issuer X-User-ID (certificate issue)
