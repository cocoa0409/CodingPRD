  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: excavation_scope_conserved_when_change_order_is_superseded
        grounds:
          - state_machines.RemediationChangeOrder.APPROVED_to_SUPERSEDED
          - calculations.remediation_cost
          - entities.TankProject.fields.approved_scope_cubic_yards
          - entities.RemediationChangeOrder.fields.supersedes_change_order_id
        distinguishing_aspect: |
          Conserved quantity #1 — excavation volume, pinned as
          `TankProject.approved_scope_cubic_yards == baseline_scope_cubic_yards + sum(additional_cubic_yards
          over RemediationChangeOrder rows with status == APPROVED)`. Approving CO1 (3.5 cy) lifts scope to
          11.5 and cost to 188504; approving CO2 (2.5 cy) as its supersession returns scope to exactly 10.5
          and cost to 187503, with CO1's 3.5 cy fully withdrawn from both sums and no residue.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-06T13:00:00Z."
            - "TankProject at REMEDIATION_ACTIVE on a GROSS round-1 result, baseline_scope_cubic_yards 8.0, excavation_limit_cubic_yards 40.0, remediation_cost_cents 185000."
