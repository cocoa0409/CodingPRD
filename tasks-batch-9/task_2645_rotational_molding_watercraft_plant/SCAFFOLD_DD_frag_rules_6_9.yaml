            - "OvenStation OV-X8B: arm_count 4, changeover_buffer_min 15, max_size_class OVERSIZE — every cycle below sits on its OWN arm, so calculations.oven_arm_window_check (priority 62, earlier than 71) is structurally vacuous."
            - "CoolingBay CB-X8B: concurrent_slot_capacity exactly 2, airflow_mode AMBIENT, status OPERATIONAL."
            - "One ACTIVE MOLDING_OPERATOR T-X8B-OPR; Warehouse WH-X8B 20.0000 (NORMAL); qualified ResinLot LOT-X8B received_kg 500.000."
            - "ProductionOrder PO-X8B: ordered_qty 3, no demand_bucket_id — floor(3 * 1.20) == 3 admits exactly the three cycles this recipe accepts."
            - "No charges and no oven starts, so all cycles stay SCHEDULED and all three members of the cooling_bay_slot_check conflicting-status set {SCHEDULED, OVEN_RUNNING, COOLING} are represented by the SCHEDULED case."
            - "Clock left at its 2026-08-01T00:00:00Z default."
