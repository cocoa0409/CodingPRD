        claim_type: rbac_denial
        grounds: ["roles", "validations[priority=3]", "errors[ERR_FORBIDDEN_SCOPE]"]
        distinguishing_aspect: "TenantRep of tenant A accepting a work letter on tenant B's lease gets ERR_FORBIDDEN_SCOPE 403 (entity-backed ownership check)."
        test_recipe:
          setup: ["Two tenants A and B each with a lease+project; B's work letter PROPOSED; tenant A attempts the accept"]
          setup_api_calls:
            - call: "POST /api/properties"
              payload: { name: "P", address: "1 St" }
              as: LandlordPM
              captures: { prop_id: $.data.id }
