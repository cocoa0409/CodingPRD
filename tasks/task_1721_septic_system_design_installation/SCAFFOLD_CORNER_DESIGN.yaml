  # ===========================================================================
  # Section 6 — Errors
  # ===========================================================================
  - section: errors
    instances:
      - name: error_science_expired
        claim_type: violation_to_error
        grounds: ["errors[ERR_SCIENCE_EXPIRED]"]
        excluded_because:
          difficulty_instance: science_age_exactly_24_passes_25_fails
          rationale: "Asserted as the failure path of the named §1.8 instance (age 25 submit -> ERR_SCIENCE_EXPIRED)."

      - name: error_stale_science
        claim_type: violation_to_error
        grounds: ["errors[ERR_STALE_SCIENCE]"]
        excluded_because:
          difficulty_instance: design_submit_depends_on_science_record_states
          rationale: "Superseded pinned science drives the design to WITHDRAWN; the submit failure path is asserted in the named §1.8 instance (the surfaced error there is pinned to ERR_INVALID_STATE after the cascade)."

      - name: error_permit_expired
        claim_type: violation_to_error
        grounds: ["errors[ERR_PERMIT_EXPIRED]"]
        excluded_because:
          difficulty_instance: permit_expiry_inclusive_window_boundary
          rationale: "Advance at period 6 on an expired permit is the trigger leg of the named §1.8 instance."

      - name: error_material_budget_exceeded
        claim_type: violation_to_error
        grounds: ["errors[ERR_MATERIAL_BUDGET_EXCEEDED]"]
        excluded_because:
          difficulty_instance: material_budget_exact_equality_passes_one_cent_over_fails
          rationale: "The one-cent-over verify is the named §1.8 instance's failure leg."

      - name: error_scheduling_conflict
        claim_type: violation_to_error
        grounds: ["errors[ERR_SCHEDULING_CONFLICT]"]
        excluded_because:
          difficulty_instance: inspector_capacity_one_pending_per_period
          rationale: "Same-inspector-same-period schedule is the named §1.8 instance's failure leg."

      - name: error_visit_outside_contract
        claim_type: violation_to_error
        grounds: ["errors[ERR_VISIT_OUTSIDE_CONTRACT]"]
        excluded_because:
          difficulty_instance: visit_inside_contract_window_inclusive_bounds
          rationale: "Visit at end_period + 1 is the named §1.8 instance's failure leg."

      - name: error_variance_required_on_high_water_gravity_approval
        claim_type: violation_to_error
        grounds: ["errors[ERR_VARIANCE_REQUIRED]", "validations[priority=10]"]
        distinguishing_aspect: "Approving a GRAVITY design on a high_water_table site without an APPROVED HIGH_WATER_TABLE variance fails ERR_VARIANCE_REQUIRED; after the variance is approved the same decide succeeds — the variance flip is the observable."
        test_recipe:
          setup: ["Company/staff; site S_HWT with high_water_table=true; science; design D GRAVITY SUBMITTED; variance VH filed (PENDING)"]
