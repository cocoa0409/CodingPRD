  # ---------------------------------------------------------------------------
  - section: validations
    instances:
      - name: add_line_insufficient_inventory
        claim_type: violation_to_error
        grounds: ["validations[priority=11]", "errors[ERR_INSUFFICIENT_INVENTORY]"]
        distinguishing_aspect: "A non-exclusive-sku line requesting quantity 10 against a released batch with only 5 available returns ERR_INSUFFICIENT_INVENTORY (fiscal, with no temporal violation present)."
        test_recipe:
          setup: ["BRONZE customer, soap sku, released batch of 5 units, PENDING order."]
          setup_api_calls:
            - { call: "POST /products", payload: { product_type: "SOAP", collection_name: "Ii", scent_family: "CITRUS", title: "Ii" }, as: MerchOps, captures: { p1: "$.data.id" } }
            - { call: "POST /products/${p1}/skus", payload: { size: "SMALL", scent: "Ii", list_price_cents: 1000 }, as: MerchOps, captures: { s1: "$.data.id" } }
            - { call: "POST /skus/${s1}/batches", payload: { quantity_produced: 5, line_code: "IIL", cure_starts_at: "2026-06-01T00:00:00Z", cure_ends_at: "2026-06-05T00:00:00Z" }, as: MerchOps, captures: { b1: "$.data.id" } }
            - { call: "POST /batches/${b1}/release", payload: {}, as: MerchOps }
            - { call: "POST /customers", payload: { email: "ii@x.com", full_name: "Ii" }, as: PlatformAdmin, captures: { c1: "$.data.id" } }
            - { call: "POST /customers/${c1}/orders", payload: { order_type: "RETAIL" }, as: Customer, as_user_id: "${c1}", captures: { o1: "$.data.id" } }
          trigger:
            - { call: "POST /orders/${o1}/lines", payload: { sku_id: "${s1}", batch_id: "${b1}", quantity: 10 }, as: Customer, as_user_id: "${c1}", captures: { err: "$.data.error_id" } }
          assert:
            - "response HTTP status == 409"
            - "error_id == ERR_INSUFFICIENT_INVENTORY"

      - name: add_line_safety_label_required
        claim_type: violation_to_error
        grounds: ["validations[priority=7]", "errors[ERR_SAFETY_LABEL_REQUIRED]", entities.Sku.fields.requires_safety_label]
        distinguishing_aspect: "A candle (safety) sku's batch RELEASED without labeling (is_safety_labeled false) fails the add-line safety check with ERR_SAFETY_LABEL_REQUIRED — batch state passes, only safety fails."
        test_recipe:
          setup: ["Candle sku with a batch RELEASED directly from CREATED (never labeled, so is_safety_labeled false). PENDING order."]
          setup_api_calls:
            - { call: "POST /products", payload: { product_type: "CANDLE", collection_name: "Sl", scent_family: "WOODY", title: "Sl" }, as: MerchOps, captures: { p1: "$.data.id" } }
            - { call: "POST /products/${p1}/skus", payload: { size: "LARGE", scent: "Sl", list_price_cents: 4000 }, as: MerchOps, captures: { s1: "$.data.id" } }
            - { call: "POST /skus/${s1}/batches", payload: { quantity_produced: 10, line_code: "SLL", cure_starts_at: "2026-06-01T00:00:00Z", cure_ends_at: "2026-06-05T00:00:00Z" }, as: MerchOps, captures: { b1: "$.data.id" } }
            - { call: "POST /batches/${b1}/release", payload: {}, as: MerchOps }
            - { call: "POST /customers", payload: { email: "sl@x.com", full_name: "Sl" }, as: PlatformAdmin, captures: { c1: "$.data.id" } }
            - { call: "POST /customers/${c1}/orders", payload: { order_type: "RETAIL" }, as: Customer, as_user_id: "${c1}", captures: { o1: "$.data.id" } }
          trigger:
            - { call: "POST /orders/${o1}/lines", payload: { sku_id: "${s1}", batch_id: "${b1}", quantity: 1 }, as: Customer, as_user_id: "${c1}", captures: { err: "$.data.error_id" } }
          assert:
            - "response HTTP status == 409"
            - "error_id == ERR_SAFETY_LABEL_REQUIRED"

      - name: add_line_drop_scheduled_not_live
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_DROP_NOT_LIVE]"]
        distinguishing_aspect: "A drop-exclusive sku whose drop is still SCHEDULED (window not yet started) is not orderable: add-line returns ERR_DROP_NOT_LIVE (the not-yet-live sub-case, distinct from the ENDED sub-case)."
        test_recipe:
          setup: ["Clock 2026-07-01. Soap sku exclusive to a drop [2026-08-01,2026-08-10) (still SCHEDULED). Released batch with ample stock. PENDING order."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /products", payload: { product_type: "SOAP", collection_name: "Sc", scent_family: "FLORAL", title: "Sc" }, as: MerchOps, captures: { p1: "$.data.id" } }
