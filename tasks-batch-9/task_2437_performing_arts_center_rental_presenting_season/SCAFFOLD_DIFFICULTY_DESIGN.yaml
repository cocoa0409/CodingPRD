  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    rule_name: "Cross-entity state dependency — a transition on one entity is gated by the state of a different entity"
    instances:

      - name: engagement_confirm_gated_by_tech_rider_review_state
        differentiation: |
          PARENT gated by CHILD: the Engagement cannot advance because its TechRider has not reached
          CLEARED, i.e. the guard reads DOWN the ownership edge into a child whose own state machine
          runs on a different trigger and a different actor role. The sibling instance below inverts
          the direction: a child transition is gated by a field of its parent.
        mechanism: "state_machines Engagement.lifecycle_status DRAFT -> CONFIRMED precondition 'a TechRider of this engagement has review_status == CLEARED' (validation priority 40, ERR_RIDER_INVALID_STATE)"
        entities_involved: [Engagement, TechRider, EquipmentRentalLine, EquipmentItem, FeeNegotiation]
        test_recipe:
          setup: |
            A presented engagement with every OTHER confirmation gate already satisfied: an ACCEPTED
            fee negotiation at 200000/0.10, and a risk assessment that lands LOW/CLEARED
            (projected gross round(8000*100*0.80) = 640000, fee exposure 0.3125, routing slack 31
            days, lead 62 days, sell-through term 0.20 -> score 26).
            Its tech rider is deliberately parked at GAP_IDENTIFIED: it requests 500 amps from a
            400-amp house, so the assessment returns ["POWER_SHORTFALL"], and a covering equipment
            line for 1 unit for 1 day at 25000 cents is already reserved — but the rider is never
            cleared. Everything needed to clear it exists; only the child's state is wrong.
          setup_api_calls:
            - call: "POST /performance-spaces"
              as: CenterAdmin
              payload:
                name: "Grand Hall"
                seat_capacity: 1200
                base_facility_fee_cents: 500000
                load_in_day_fee_cents: 200000
                changeover_buffer_minutes: 120
                rigging_capacity_kg: 5000
                house_power_amps: 400
                dmx_universes: 4
              captures: { space_id: "$.data.id" }
            - call: "POST /artists"
              as: ProgrammingDirector
              payload:
                legal_name: "Cinder Lane Big Band"
                agency_name: "Northline Artists"
                guarantee_floor_cents: 100000
                historical_sell_through_pct: 0.80
                routing_window_start_utc: "2026-09-01T00:00:00Z"
                routing_window_end_utc: "2026-12-31T00:00:00Z"
                min_days_between_engagements: 0
              captures: { artist_id: "$.data.id" }
            - call: "POST /equipment-items"
              as: CenterAdmin
              payload:
                category: "POWER_DISTRO"
                model_name: "200A Distro Rack"
                on_hand_qty: 3
                daily_rate_cents: 25000
                replacement_value_cents: 1500000
              captures: { item_id: "$.data.id" }
            - call: "POST /engagements"
              as: ProgrammingDirector
              payload:
                engagement_type: "PRESENTED"
                space_id: "${space_id}"
                artist_id: "${artist_id}"
                title: "Cinder Lane Big Band"
                load_in_start_utc: "2026-10-01T08:00:00Z"
                performance_start_utc: "2026-10-02T19:00:00Z"
                performance_end_utc: "2026-10-02T22:00:00Z"
                load_out_end_utc: "2026-10-03T02:00:00Z"
                performance_day_count: 1
                load_in_day_count: 1
              captures: { engagement_id: "$.data.id" }
            - call: "POST /engagements/${engagement_id}/tech-riders"
              as: ArtistRepresentative
              as_user_id: "${artist_id}"
              payload:
                submitted_rigging_kg: 3000
                requested_power_amps: 500
                requested_dmx_universes: 2
                requires_orchestra_pit: false
              captures: { rider_id: "$.data.id" }
            - call: "POST /tech-riders/${rider_id}/review"
              as: TechnicalDirector
              payload: {}
            - call: "POST /tech-riders/${rider_id}/equipment-lines"
              as: TechnicalDirector
              payload:
                equipment_item_id: "${item_id}"
                covers_gap: "POWER_SHORTFALL"
                qty: 1
                rental_days: 1
              captures: { line_id: "$.data.id" }
            - call: "POST /engagements/${engagement_id}/price-tiers"
              as: BoxOfficeManager
              payload:
                tier_name: "ORCH"
                seats_allocated: 100
                base_price_cents: 8000
                price_ceiling_cents: 12000
                dynamic_pricing_enabled: false
                subscription_eligible: false
              captures: { tier_id: "$.data.id" }
            - call: "GET /engagements/${engagement_id}"
              as: FinanceController
              payload: {}
              captures: { eng_v_pre_neg: "$.data.version" }
            - call: "POST /engagements/${engagement_id}/fee-negotiations"
              as: ProgrammingDirector
              payload:
                offered_fee_cents: 200000
                offered_artist_share_pct: 0.10
                expected_engagement_version: "${eng_v_pre_neg}"
              captures: { neg_id: "$.data.id" }
            - call: "POST /fee-negotiations/${neg_id}/accept"
              as: ArtistRepresentative
              as_user_id: "${artist_id}"
              payload: {}
            - call: "GET /engagements/${engagement_id}"
              as: FinanceController
              payload: {}
              captures: { eng_v_pre_risk: "$.data.version" }
            - call: "POST /engagements/${engagement_id}/assess-risk"
              as: FinanceController
