            - { call: "POST /furnace-charges", payload: { furnace_id: "${fur_id}", billet_ids: ["${b10}"], target_temp_f: 2200, soak_minutes: 60, planned_load_start: "2026-08-02T12:00:00Z", planned_unload: "2026-08-02T15:00:00Z" }, as: FurnaceOperator, captures: { chg2_id: "$.data.id" } }
            - { call: "POST /furnace-charges/${chg1_id}/close-loading", payload: {}, as: FurnaceOperator }
            - { call: "POST /furnace-charges/${chg2_id}/close-loading", payload: {}, as: FurnaceOperator }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T09:00:00Z" }, as: PlantManager }
            - { call: "POST /furnace-charges/${chg1_id}/mark-ready", payload: {}, as: FurnaceOperator }
            - { call: "POST /furnace-charges/${chg2_id}/mark-ready", payload: {}, as: FurnaceOperator }
            - { call: "POST /die-sets", payload: { die_set_code: "DIE-W32", part_family: "FLG-4", wear_limit_hits: 30, max_resinks: 1 }, as: DieShopTechnician, captures: { die_id: "$.data.id" } }
            - { call: "POST /work-centers", payload: { code: "WC-1", type: "PRESS", rated_tonnage: 500 }, as: PlantManager, captures: { wc_id: "$.data.id" } }
            - { call: "POST /die-sets/${die_id}/install", payload: { work_center_id: "${wc_id}" }, as: DieShopTechnician }
            - { call: "POST /work-orders", payload: { order_number: "WO-12", customer_name: "Acme Aero", alloy_spec_id: "${alloy_id}", part_number: "PN-100", ordered_qty: 10, part_net_weight_lbs: 40.00, billet_weight_lbs: 50.00, projected_area_in2: 25.0, required_process: "PRESS", price_tier1_limit_tons: 1.0, price_tier1_cents_per_ton: 2000000, price_tier2_limit_tons: 5.0, price_tier2_cents_per_ton: 1800000, price_tier3_cents_per_ton: 1500000, scrap_recovery_rate_cents_per_lb: 150 }, as: SalesPlanner, captures: { wo_id: "$.data.id", wo_v: "$.data.version" } }
            - { call: "POST /forge-runs", payload: { work_order_id: "${wo_id}", die_set_id: "${die_id}", planned_start: "2026-08-03T09:00:00Z", planned_end: "2026-08-03T10:30:00Z", planned_qty: 10, expected_work_order_version: "${wo_v}", work_center_id: "${wc_id}" }, as: ForgeOperator, captures: { run_id: "$.data.id" } }
            - { call: "POST /forge-runs/${run_id}/start", payload: {}, as: ForgeOperator, as_user_id: "op-1" }
          trigger:
            - { call: "POST /forge-runs/${run_id}/heats", payload: { furnace_charge_id: "${chg1_id}", billet_ids: ["${b1}", "${b2}", "${b3}", "${b4}", "${b5}", "${b6}", "${b7}", "${b8}", "${b9}"], parts_good: 9, parts_scrapped: 0 }, as: ForgeOperator, as_user_id: "op-1" }
            - { call: "GET /die-sets/${die_id}", payload: {}, as: DieShopTechnician, captures: { hits_mid: "$.data.cumulative_hits", status_mid: "$.data.status" } }
            - { call: "POST /forge-runs/${run_id}/heats", payload: { furnace_charge_id: "${chg2_id}", billet_ids: ["${b10}"], parts_good: 1, parts_scrapped: 0 }, as: ForgeOperator, as_user_id: "op-1" }
            - { call: "GET /die-sets/${die_id}", payload: {}, as: DieShopTechnician, captures: { hits_end: "$.data.cumulative_hits", status_end: "$.data.status", wc_end: "$.data.installed_work_center_id" } }
          assert:
            - "after 9 parts: cumulative_hits == 27 (< 30) and status == INSTALLED"
            - "after the 10th part: cumulative_hits == 30 == wear_limit_hits exactly and status == WORN (>= boundary inclusive)"
            - "installed_work_center_id == null after crossing (auto-uninstall side effect)"

      - name: flash_yield_exactly_at_allowance
        grounds:
          - calculations.flash_yield
