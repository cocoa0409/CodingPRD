# =============================================================================
# §1.9 Scaffold Corner Design (Breadth Coverage Index)
# Task 2769 — Public Access Television Studio Operations
#
# Sections and claim_type values are taken verbatim from
# references/claim-extraction-guide.md; nothing outside that taxonomy is used.
# Corners already asserted by a named §1.8 instance appear as `excluded_because:`
# stubs with no test_recipe. Every `name` here is unique across the union of
# scaffold_difficulty_design and scaffold_corner_design.
#
# Reference data reused below (server default clock is 2026-08-01T00:00:00Z):
#   TV-101 BASIC grants [STUDIO_FLOOR, EDIT_SUITE], session 2026-08-05 17:00-21:00Z
#   PATV1 PUBLIC channel, window 1080..1380, buffer 120 s
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: corner_producer_creation_returns_applicant_defaults
        claim_type: creation
        grounds:
          - endpoints[POST /producers]
          - entities.Producer.fields.status
          - entities.Producer.fields.certification_level
          - entities.Producer.fields.residency_verified
          - state_machines.Producer.initial_state
        distinguishing_aspect: "POST /producers with both required fields returns 201 and a Producer whose every system/computed field carries its declared default: status APPLICANT, certification_level NONE, residency_verified false, suspension_points 0, deposit_held_cents 0, version 1."
        test_recipe:
          setup:
            - "Empty database; the clock stands at its default 2026-08-01T00:00:00Z."
          setup_api_calls: []
          trigger:
            - call: "POST /producers"
              payload: {legal_name: "Ada Lovelace", email: "ada@patv.example"}
              as: CenterAdmin
              as_user_id: "adm-1"
              captures: {p_id: $.data.id, p_status: $.data.status, p_cert: $.data.certification_level, p_ver: $.data.version}
          assert:
            - "HTTP status is 201 and response_type is \"object\""
            - "${p_status} == APPLICANT (the declared initial_state) and ${p_cert} == NONE"
            - "Producer.${p_id}.legal_name == Ada Lovelace and email == ada@patv.example"
            - "Producer.${p_id}.residency_verified == false, suspension_points == 0, deposit_held_cents == 0, deposit_forfeited_total_cents == 0"
            - "Producer.${p_id}.competency_codes == [], confirmed_crew_commitments == 0, reinstated_count == 0"
            - "Producer.${p_id}.indemnification_expires_at == null and revocation_reason == null"
            - "${p_ver} == 1 and ${p_id} is a bare UUID with no type prefix"
            - "meta.api_request_id and meta.api_request_timestamp are present on the response"

      - name: corner_channel_retrieval_returns_stored_data
        claim_type: retrieval
        grounds:
          - endpoints[GET /channels/{channelId}]
          - entities.Channel.fields.call_sign
          - entities.Channel.fields.daily_window_start_minute
        distinguishing_aspect: "GET /channels/{channelId} returns exactly the stored channel: the same id, call_sign, window bounds and buffer that POST /channels returned, with scheduled_seconds and aired_seconds still 0."
        test_recipe:
          setup:
            - "One Channel PATV1 exists with window 1080..1380 and inter_program_buffer_seconds 120; no playback slots have been booked."
          setup_api_calls:
            - call: "POST /channels"
              payload: {call_sign: "PATV1", tier: "PUBLIC", daily_window_start_minute: 1080, daily_window_end_minute: 1380, inter_program_buffer_seconds: 120}
              as: CenterAdmin
              as_user_id: "adm-1"
              captures: {ch_id: $.data.id}
          trigger:
            - call: "GET /channels/${ch_id}"
              as: SchedulingCoordinator
              as_user_id: "sch-1"
              captures: {got_id: $.data.id, got_sign: $.data.call_sign, got_start: $.data.daily_window_start_minute, got_buffer: $.data.inter_program_buffer_seconds}
          assert:
            - "${got_id} == ${ch_id} and ${got_sign} == PATV1"
            - "${got_start} == 1080, Channel.${ch_id}.daily_window_end_minute == 1380 and ${got_buffer} == 120"
            - "Channel.${ch_id}.tier == PUBLIC, scheduled_seconds == 0, aired_seconds == 0, slot_sequence_high == 0"
            - "response_type is \"object\" and version == 1"

      - name: corner_producers_listing_paginates_with_total_count
        claim_type: listing
        grounds:
          - endpoints[GET /producers]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "GET /producers with limit 2 returns the first two of three producers with total_count 3 and has_more true, and offset 2 returns the remaining one with has_more false."
        test_recipe:
          setup:
            - "Exactly three producers exist, all in status APPLICANT, created in the order Ada, Grace, Vera."
          setup_api_calls:
            - call: "POST /producers"
              payload: {legal_name: "Ada Lovelace", email: "ada@patv.example"}
              as: CenterAdmin
              as_user_id: "adm-1"
              captures: {p1_id: $.data.id}
            - call: "POST /producers"
              payload: {legal_name: "Grace Hopper", email: "grace@patv.example"}
              as: CenterAdmin
              as_user_id: "adm-1"
              captures: {p2_id: $.data.id}
            - call: "POST /producers"
              payload: {legal_name: "Vera Rubin", email: "vera@patv.example"}
              as: CenterAdmin
              as_user_id: "adm-1"
              captures: {p3_id: $.data.id}
          trigger:
            - call: "GET /producers"
              payload: {limit: 2, offset: 0}
              as: CenterAdmin
              as_user_id: "adm-1"
              captures: {first_page_head: "$.data[0].id"}
            - call: "GET /producers"
              payload: {limit: 2, offset: 2}
              as: CenterAdmin
              as_user_id: "adm-1"
              captures: {second_page_head: "$.data[0].id"}
            - call: "GET /producers"
              payload: {status: "APPLICANT"}
              as: CenterAdmin
              as_user_id: "adm-1"
              captures: {filtered_head: "$.data[0].id"}
          assert:
            - "The first call returns response_type \"array\" with exactly 2 items, total_count 3 and has_more true"
            - "The second call returns exactly 1 item, total_count 3 and has_more false"
            - "${first_page_head} == ${p1_id} and ${second_page_head} == ${p3_id} (created_at ordering, never id ordering)"
            - "The status=APPLICANT call returns 3 items with total_count 3, and ${filtered_head} == ${p1_id}"
            - "A GET /producers with no pagination inputs applies the declared defaults limit 10 / offset 0 and returns all 3 items with has_more false"

      - name: corner_producer_not_found_returns_producer_not_found
        claim_type: not_found
        grounds:
          - endpoints[GET /producers/{producerId}]
          - errors[ERR_PRODUCER_NOT_FOUND]
          - validations[priority=4]
        distinguishing_aspect: "GET /producers/{producerId} for a well-formed but unknown UUID returns ERR_PRODUCER_NOT_FOUND with HTTP 404, not an empty object and not a 400."
        test_recipe:
          setup:
            - "Empty database; no producer has ever been created."
          setup_api_calls: []
          trigger:
            - call: "GET /producers/00000000-0000-4000-8000-000000000000"
              as: CenterAdmin
              as_user_id: "adm-1"
              captures: {err: $.data.error_id, msg: $.data.message}
          assert:
            - "${err} == ERR_PRODUCER_NOT_FOUND with HTTP 404"
            - "response_type is \"error\" and ${msg} is a non-empty string"
            - "The same shape holds for GET /channels/{channelId} with ERR_CHANNEL_NOT_FOUND and GET /reservations/{reservationId} with ERR_RESERVATION_NOT_FOUND"

      - name: corner_training_course_missing_seat_capacity_returns_invalid_request
        claim_type: required_fields
        grounds:
          - endpoints[POST /training-courses]
          - errors[ERR_INVALID_REQUEST]
          - validations[priority=3]
        distinguishing_aspect: "POST /training-courses without seat_capacity — a declared required input with no default — returns ERR_INVALID_REQUEST (400) and persists nothing, so the course_code remains free."
        test_recipe:
          setup:
            - "Empty database; no training course exists."
          setup_api_calls: []
          trigger:
            - call: "POST /training-courses"
              payload: {course_code: "TV-101", title: "Studio Basics", tier: "BASIC", grants_competency_codes: ["STUDIO_FLOOR"], session_start_at: "2026-08-05T17:00:00Z", session_end_at: "2026-08-05T21:00:00Z"}
              as: TrainingCoordinator
              as_user_id: "trn-1"
              captures: {err: $.data.error_id}
            - call: "GET /training-courses"
              as: TrainingCoordinator
              as_user_id: "trn-1"
          assert:
            - "${err} == ERR_INVALID_REQUEST with HTTP 400"
            - "The follow-up GET /training-courses returns 0 items with total_count 0 — nothing was persisted"
            - "The same 400 is returned when title, tier, grants_competency_codes, session_start_at or session_end_at is omitted"

      - name: corner_channel_preemption_enabled_defaults_to_true
        claim_type: defaults
        grounds:
          - entities.Channel.fields.preemption_enabled
          - endpoints[POST /channels]
        distinguishing_aspect: "Omitting the optional preemption_enabled input yields the declared default true, not false and not null; explicitly passing false overrides it."
        test_recipe:
          setup:
            - "Empty database; two channels will be created, one without preemption_enabled and one with it set to false."
          setup_api_calls: []
          trigger:
            - call: "POST /channels"
              payload: {call_sign: "PATV1", tier: "PUBLIC", daily_window_start_minute: 1080, daily_window_end_minute: 1380, inter_program_buffer_seconds: 120}
              as: CenterAdmin
              as_user_id: "adm-1"
              captures: {ch_default_id: $.data.id, default_flag: $.data.preemption_enabled}
            - call: "POST /channels"
              payload: {call_sign: "PATV2", tier: "PUBLIC", daily_window_start_minute: 1080, daily_window_end_minute: 1380, inter_program_buffer_seconds: 0, preemption_enabled: false}
              as: CenterAdmin
              as_user_id: "adm-1"
              captures: {ch_explicit_id: $.data.id, explicit_flag: $.data.preemption_enabled}
          assert:
            - "${default_flag} == true for the channel created without the field"
            - "${explicit_flag} == false for the channel that passed it explicitly"
            - "Channel.${ch_explicit_id}.inter_program_buffer_seconds == 0 is accepted (the constraint is >= 0)"
            - "Both channels report scheduled_seconds 0 and aired_seconds 0"

      - name: corner_playback_slot_occupied_seconds_is_computed
        claim_type: computed_fields
        grounds:
          - entities.PlaybackSlot.fields.occupied_seconds
          - entities.PlaybackSlot.fields.end_at
          - calculations.playback_window_fit
        distinguishing_aspect: "occupied_seconds is computed as program.runtime_seconds + channel.inter_program_buffer_seconds (1500 + 90 = 1590) and end_at follows from it; the channel's buffer, not the client, decides the value."
        test_recipe:
          setup:
            - "Producer P is ACTIVE with certification_level BASIC."
            - "Channel PATV3 has inter_program_buffer_seconds 90 and window 1080..1380."
            - "Program PS has runtime_seconds 1500, is_live false, required_crew_roles [], and is APPROVED and CLEARED."
          setup_api_calls:
            - call: "POST /producers"
              payload: {legal_name: "Ada Lovelace", email: "ada@patv.example"}
              as: CenterAdmin
              as_user_id: "adm-1"
              captures: {p_id: $.data.id}
            - call: "POST /producers/${p_id}/residency-verification"
              payload: {document_reference: "UTIL-2026-0001"}
              as: CenterAdmin
              as_user_id: "adm-1"
            - call: "POST /training-courses"
              payload: {course_code: "TV-101", title: "Studio Basics", tier: "BASIC", grants_competency_codes: ["STUDIO_FLOOR", "EDIT_SUITE"], seat_capacity: 12, session_start_at: "2026-08-05T17:00:00Z", session_end_at: "2026-08-05T21:00:00Z"}
              as: TrainingCoordinator
              as_user_id: "trn-1"
              captures: {c_basic_id: $.data.id}
            - call: "POST /course-enrollments"
              payload: {producer_id: "${p_id}", course_id: "${c_basic_id}"}
              as: Producer
              as_user_id: "${p_id}"
              captures: {ep_id: $.data.id}
            - call: "POST /_clock/set_current_utc"
              payload: {to_iso8601: "2026-08-06T00:00:00Z"}
              as: CenterAdmin
              as_user_id: "adm-1"
            - call: "POST /course-enrollments/${ep_id}/attendance"
              payload: {attended: true}
              as: TrainingCoordinator
              as_user_id: "trn-1"
            - call: "POST /course-enrollments/${ep_id}/grade"
              payload: {practical_score: 88}
              as: TrainingCoordinator
              as_user_id: "trn-1"
            - call: "POST /channels"
              payload: {call_sign: "PATV3", tier: "PUBLIC", daily_window_start_minute: 1080, daily_window_end_minute: 1380, inter_program_buffer_seconds: 90}
              as: CenterAdmin
              as_user_id: "adm-1"
              captures: {ch_id: $.data.id}
            - call: "POST /programs"
              payload: {producer_id: "${p_id}", title: "Short Feature", runtime_seconds: 1500, is_live: false, required_crew_roles: []}
              as: Producer
              as_user_id: "${p_id}"
              captures: {prog_id: $.data.id}
            - call: "POST /programs/${prog_id}/attestations"
              payload: {attestation_kind: "INDEMNIFICATION", statement_version: "2026.1", third_party_material: false}
              as: Producer
              as_user_id: "${p_id}"
            - call: "POST /programs/${prog_id}/attestations"
              payload: {attestation_kind: "COPYRIGHT_CLEARANCE", statement_version: "2026.1", third_party_material: false}
              as: Producer
              as_user_id: "${p_id}"
            - call: "POST /programs/${prog_id}/attestations"
              payload: {attestation_kind: "CONTENT_POLICY", statement_version: "2026.1", third_party_material: false}
              as: Producer
              as_user_id: "${p_id}"
            - call: "POST /programs/${prog_id}/submit"
              payload: {}
              as: Producer
              as_user_id: "${p_id}"
            - call: "POST /programs/${prog_id}/review-claim"
              payload: {}
              as: ContentReviewer
              as_user_id: "rev-1"
            - call: "POST /programs/${prog_id}/review-decision"
              payload: {decision: "APPROVE"}
              as: ContentReviewer
              as_user_id: "rev-1"
          trigger:
            - call: "POST /playback-slots"
              payload: {channel_id: "${ch_id}", program_id: "${prog_id}", start_at: "2026-08-20T18:00:00Z"}
              as: SchedulingCoordinator
              as_user_id: "sch-1"
              captures: {slot_id: $.data.id, occupied: $.data.occupied_seconds, slot_end: $.data.end_at, seq: $.data.sequence_number}
          assert:
            - "${occupied} == 1590 — runtime 1500 plus the channel's 90-second buffer"
            - "${slot_end} == 2026-08-20T18:26:30Z"
            - "${seq} == 1 and Channel.${ch_id}.slot_sequence_high == 1"
            - "Channel.${ch_id}.scheduled_seconds == 1590 and aired_seconds == 0"
            - "PlaybackSlot.${slot_id}.measured_households == null and aired_at == null before airing"

      - name: corner_producer_creation_extra_field_ignored
        claim_type: system_fields
        grounds:
          - entities.Producer.fields.status
          - entities.Producer.fields.suspension_points
          - endpoints[POST /producers]
        distinguishing_aspect: "System-sourced fields cannot be seeded by the client: a POST /producers body that also carries status ACTIVE and suspension_points 9 still produces status APPLICANT and suspension_points 0."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /producers"
              payload: {legal_name: "Ada Lovelace", email: "ada@patv.example", status: "ACTIVE", suspension_points: 9, certification_level: "LIVE"}
              as: CenterAdmin
              as_user_id: "adm-1"
              captures: {p_id: $.data.id, p_status: $.data.status, p_points: $.data.suspension_points, p_cert: $.data.certification_level}
          assert:
            - "${p_status} == APPLICANT — the supplied ACTIVE value is ignored, not honoured and not rejected"
            - "${p_points} == 0 and ${p_cert} == NONE"
            - "Producer.${p_id}.version == 1 and residency_verified == false"
            - "id and created_at are server-minted; any client-supplied id in the body has no effect"

      - name: corner_channel_invalid_tier_enum_rejected
        claim_type: type_constraints
        grounds:
          - entities.Channel.fields.tier
          - errors[ERR_INVALID_REQUEST]
          - validations[priority=3]
        distinguishing_aspect: "An out-of-enum tier and a window whose end is not greater than its start are both schema violations returning ERR_INVALID_REQUEST (400), never a 422 business error."
        test_recipe:
          setup:
            - "Empty database; no channel exists."
          setup_api_calls: []
          trigger:
            - call: "POST /channels"
              payload: {call_sign: "PATV9", tier: "MUNICIPAL", daily_window_start_minute: 1080, daily_window_end_minute: 1380, inter_program_buffer_seconds: 120}
              as: CenterAdmin
              as_user_id: "adm-1"
              captures: {enum_err: $.data.error_id}
            - call: "POST /channels"
              payload: {call_sign: "PATV9", tier: "PUBLIC", daily_window_start_minute: 1380, daily_window_end_minute: 1080, inter_program_buffer_seconds: 120}
              as: CenterAdmin
              as_user_id: "adm-1"
              captures: {window_err: $.data.error_id}
          assert:
            - "${enum_err} == ERR_INVALID_REQUEST with HTTP 400 — MUNICIPAL is not in {PUBLIC, EDUCATIONAL, GOVERNMENT}"
            - "${window_err} == ERR_INVALID_REQUEST with HTTP 400 — daily_window_end_minute must exceed daily_window_start_minute"
            - "GET /channels returns 0 items with total_count 0 after both refusals"

      - name: corner_attestation_is_immutable_with_no_version_field
        claim_type: immutability
        grounds:
          - entities.Attestation.common_fields
          - entities.Attestation.fields.sequence_number
          - entities.Attestation.fields.effective_until
          - endpoints[GET /attestations/{attestationId}]
          - constants.INDEMNIFICATION_TERM_DAYS
        distinguishing_aspect: "Attestation declares common_fields false, so its representation carries id and created_at but no updated_at and no version, and §1.5 exposes no update or delete endpoint for it — a correction can only be a new append with the next sequence_number."
        test_recipe:
          setup:
            - "Producer P is ACTIVE with certification_level BASIC."
            - "Program PR exists in review_status DRAFT; the clock stands at 2026-08-06T00:00:00Z."
          setup_api_calls:
            - call: "POST /producers"
              payload: {legal_name: "Ada Lovelace", email: "ada@patv.example"}
              as: CenterAdmin
              as_user_id: "adm-1"
              captures: {p_id: $.data.id}
            - call: "POST /producers/${p_id}/residency-verification"
              payload: {document_reference: "UTIL-2026-0001"}
              as: CenterAdmin
              as_user_id: "adm-1"
            - call: "POST /training-courses"
              payload: {course_code: "TV-101", title: "Studio Basics", tier: "BASIC", grants_competency_codes: ["STUDIO_FLOOR", "EDIT_SUITE"], seat_capacity: 12, session_start_at: "2026-08-05T17:00:00Z", session_end_at: "2026-08-05T21:00:00Z"}
              as: TrainingCoordinator
              as_user_id: "trn-1"
              captures: {c_basic_id: $.data.id}
            - call: "POST /course-enrollments"
              payload: {producer_id: "${p_id}", course_id: "${c_basic_id}"}
              as: Producer
              as_user_id: "${p_id}"
              captures: {ep_id: $.data.id}
            - call: "POST /_clock/set_current_utc"
              payload: {to_iso8601: "2026-08-06T00:00:00Z"}
              as: CenterAdmin
              as_user_id: "adm-1"
            - call: "POST /course-enrollments/${ep_id}/attendance"
              payload: {attended: true}
              as: TrainingCoordinator
              as_user_id: "trn-1"
            - call: "POST /course-enrollments/${ep_id}/grade"
              payload: {practical_score: 88}
              as: TrainingCoordinator
              as_user_id: "trn-1"
            - call: "POST /programs"
              payload: {producer_id: "${p_id}", title: "Neighborhood Notes", runtime_seconds: 1800, is_live: false, required_crew_roles: []}
              as: Producer
              as_user_id: "${p_id}"
              captures: {prog_id: $.data.id}
          trigger:
            - call: "POST /programs/${prog_id}/attestations"
              payload: {attestation_kind: "INDEMNIFICATION", statement_version: "2026.1", third_party_material: false}
              as: Producer
              as_user_id: "${p_id}"
              captures: {att1_id: $.data.id, att1_seq: $.data.sequence_number, att1_from: $.data.effective_from, att1_until: $.data.effective_until}
            - call: "POST /programs/${prog_id}/attestations"
              payload: {attestation_kind: "INDEMNIFICATION", statement_version: "2026.1", third_party_material: false}
              as: Producer
              as_user_id: "${p_id}"
              captures: {att2_id: $.data.id, att2_seq: $.data.sequence_number}
            - call: "GET /attestations/${att1_id}"
              as: Producer
              as_user_id: "${p_id}"
              captures: {read_seq: $.data.sequence_number}
          assert:
            - "${att1_seq} == 1 and ${att2_seq} == 2 — a correction appends rather than mutating"
            - "${read_seq} == 1 — the first attestation is byte-for-byte unchanged after the second append"
            - "The Attestation representation exposes id and created_at but neither updated_at nor version"
            - "${att1_from} == 2026-08-06T00:00:00Z and ${att1_until} == 2027-08-06T00:00:00Z (effective_from plus INDEMNIFICATION_TERM_DAYS 365)"
            - "Attestation.${att2_id}.signed_by_producer_id == ${p_id} and program_id == ${prog_id}"
            - "Program.${prog_id}.attestation_sequence_high == 2"
            - "§1.5 declares no PUT, PATCH or DELETE for /attestations, so no endpoint can edit a signed statement"

      - name: corner_program_series_fk_must_exist
        claim_type: parent_relationships
        grounds:
          - entities.Program.fields.series_id
          - errors[ERR_SERIES_NOT_FOUND]
          - validations[priority=5]
          - complexity_profile.entity_topology
        distinguishing_aspect: "In this flat topology every foreign key in a request body is checked for existence before any business rule runs: an unknown series_id on POST /programs returns ERR_SERIES_NOT_FOUND (404), and an unknown producer_id returns ERR_PRODUCER_NOT_FOUND, even though the ownership rule would also have failed."
        test_recipe:
          setup:
            - "Producer P is ACTIVE with certification_level BASIC; no Series exists at all."
          setup_api_calls:
            - call: "POST /producers"
              payload: {legal_name: "Ada Lovelace", email: "ada@patv.example"}
              as: CenterAdmin
              as_user_id: "adm-1"
              captures: {p_id: $.data.id}
            - call: "POST /producers/${p_id}/residency-verification"
              payload: {document_reference: "UTIL-2026-0001"}
              as: CenterAdmin
              as_user_id: "adm-1"
            - call: "POST /training-courses"
              payload: {course_code: "TV-101", title: "Studio Basics", tier: "BASIC", grants_competency_codes: ["STUDIO_FLOOR", "EDIT_SUITE"], seat_capacity: 12, session_start_at: "2026-08-05T17:00:00Z", session_end_at: "2026-08-05T21:00:00Z"}
              as: TrainingCoordinator
              as_user_id: "trn-1"
              captures: {c_basic_id: $.data.id}
            - call: "POST /course-enrollments"
              payload: {producer_id: "${p_id}", course_id: "${c_basic_id}"}
              as: Producer
              as_user_id: "${p_id}"
              captures: {ep_id: $.data.id}
            - call: "POST /_clock/set_current_utc"
              payload: {to_iso8601: "2026-08-06T00:00:00Z"}
              as: CenterAdmin
              as_user_id: "adm-1"
            - call: "POST /course-enrollments/${ep_id}/attendance"
              payload: {attended: true}
              as: TrainingCoordinator
              as_user_id: "trn-1"
            - call: "POST /course-enrollments/${ep_id}/grade"
              payload: {practical_score: 88}
              as: TrainingCoordinator
              as_user_id: "trn-1"
          trigger:
            - call: "POST /programs"
