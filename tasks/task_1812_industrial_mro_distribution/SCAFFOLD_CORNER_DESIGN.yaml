            - call: "POST /mro/orders/${ord_id}/confirm"
              as: BranchManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_FORBIDDEN_ROLE"

      - name: vendor_rep_cannot_credit_return_returns_forbidden
        claim_type: role_exclusive_denied
        grounds: [roles.VendorRep, roles.DistributionAdmin, "errors[ERR_FORBIDDEN_ROLE]"]
        distinguishing_aspect: "Return credit is DistributionAdmin-exclusive; VendorRep (who owns vendor-confirm) cannot credit."
        test_recipe:
          setup: ["Customer, stocked item, fulfilled order; return RECEIVED"]
          setup_api_calls:
            - call: "POST /mro/customers"
              payload: { account_number: "RB-4", display_name: "VR Co", credit_limit_cents: 100000, primary_ship_to_state: "OH" }
              as: DistributionAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /mro/items"
              payload: { sku: "RB-4", description: "Cap", item_class: "STOCKED", list_price_cents: 100 }
              as: DistributionAdmin
              captures: { it_id: $.data.id }
            - call: "POST /mro/locations"
              payload: { location_code: "BR-VR", location_type: "BRANCH", region_state: "OH", same_day_cutoff_minute: 900 }
              as: DistributionAdmin
              captures: { br_id: $.data.id }
            - call: "POST /mro/locations/${br_id}/restock"
              payload: { item_id: "${it_id}", qty: 1 }
              as: DistributionAdmin
            - call: "POST /mro/orders"
              payload: { customer_id: "${cust_id}", fulfillment_branch_id: "${br_id}", fulfillment_method: "WILL_CALL", lines: [{ item_id: "${it_id}", qty: 1 }] }
              as: DistributionAdmin
              captures: { ord_id: $.data.id }
            - call: "POST /mro/orders/${ord_id}/confirm"
              as: DistributionAdmin
            - call: "POST /mro/orders/${ord_id}/mark-ready"
              as: BranchManager
            - call: "POST /mro/orders/${ord_id}/mark-fulfilled"
              as: BranchManager
            - call: "GET /mro/orders/${ord_id}/lines"
              as: DistributionAdmin
              captures: { ln: "$.data[0].id" }
            - call: "POST /mro/returns"
              payload: { order_id: "${ord_id}", lines: [{ order_line_id: "${ln}", qty: 1, condition: "DAMAGED" }] }
              as: DistributionAdmin
              captures: { ret_id: $.data.id }
            - call: "POST /mro/returns/${ret_id}/approve"
              as: DistributionAdmin
            - call: "POST /mro/returns/${ret_id}/receive"
              as: BranchManager
          trigger:
            - call: "POST /mro/returns/${ret_id}/credit"
              as: VendorRep
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_FORBIDDEN_ROLE"

      - name: buyer_cannot_read_other_account_cart_returns_scope_error
        claim_type: role_scope_denied
        grounds: [roles.CustomerBuyer, "errors[ERR_CUSTOMER_SCOPE_MISMATCH]"]
        distinguishing_aspect: "Entity-backed roles are scoped to their own account: a buyer reading a cart owned by a different customer fails with ERR_CUSTOMER_SCOPE_MISMATCH (403), while opaque roles can read it."
        test_recipe:
          setup: ["Customers A and B; a cart owned by A"]
          setup_api_calls:
            - call: "POST /mro/customers"
              payload: { account_number: "SC-A", display_name: "Scope A", credit_limit_cents: 100000, primary_ship_to_state: "OH" }
              as: DistributionAdmin
              captures: { custA: $.data.id }
            - call: "POST /mro/customers"
              payload: { account_number: "SC-B", display_name: "Scope B", credit_limit_cents: 100000, primary_ship_to_state: "OH" }
              as: DistributionAdmin
              captures: { custB: $.data.id }
            - call: "POST /mro/items"
              payload: { sku: "SC-1", description: "Scope item", item_class: "STOCKED", list_price_cents: 100 }
              as: DistributionAdmin
              captures: { it_id: $.data.id }
            - call: "POST /mro/carts"
              payload: { customer_id: "${custA}", lines: [{ item_id: "${it_id}", qty: 1 }] }
              as: CustomerBuyer
              as_user_id: "${custA}"
              captures: { cartA: $.data.id }
          trigger:
            - call: "GET /mro/carts/${cartA}"
              as: CustomerBuyer
              as_user_id: "${custB}"
              captures: { err: $.data.error_id }
            - call: "GET /mro/carts/${cartA}"
              as: DistributionAdmin
              captures: { got: $.data.id }
          assert:
            - "err == ERR_CUSTOMER_SCOPE_MISMATCH (buyer B cannot see A's cart)"
            - "got == ${cartA} (opaque admin role reads it fine)"

      - name: buyer_manages_own_cart_positive
        claim_type: role_shared_allowed
        grounds: [roles.CustomerBuyer]
        distinguishing_aspect: "Satisfaction pass: the owning buyer creates, revises, and submits their own cart without error."
        test_recipe:
          setup: ["Customer with threshold 1,000,000 (auto-approve), item"]
          setup_api_calls:
            - call: "POST /mro/customers"
              payload: { account_number: "POS-1", display_name: "Positive Co", credit_limit_cents: 100000, approval_threshold_cents: 1000000, primary_ship_to_state: "OH" }
              as: DistributionAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /mro/items"
              payload: { sku: "POS-1", description: "Own part", item_class: "STOCKED", list_price_cents: 100 }
              as: DistributionAdmin
              captures: { it_id: $.data.id }
          trigger:
            - call: "POST /mro/carts"
              payload: { customer_id: "${cust_id}", lines: [{ item_id: "${it_id}", qty: 1 }] }
              as: CustomerBuyer
              as_user_id: "${cust_id}"
              captures: { cart_id: $.data.id, st1: $.data.status }
            - call: "PUT /mro/carts/${cart_id}"
              payload: { lines: [{ item_id: "${it_id}", qty: 2 }] }
              as: CustomerBuyer
              as_user_id: "${cust_id}"
            - call: "POST /mro/carts/${cart_id}/submit"
              as: CustomerBuyer
              as_user_id: "${cust_id}"
              captures: { st2: $.data.status, est: $.data.estimated_total_cents }
          assert:
            - "st1 == OPEN"
            - "st2 == APPROVED and est == 200 (auto-approved under the high threshold)"

  # ---------------------------------------------------------------------------
  - section: cross_cutting_layers
    instances:
      - name: occ_customer_stale_version_returns_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[customer-update-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "PUT /mro/customers/{id} with an expected_customer_version the account has already advanced past fails with ERR_STALE_VERSION (412); the current version still succeeds."
        test_recipe:
          setup: ["Customer created (version 1); one successful PUT moved it to version 2"]
          setup_api_calls:
            - call: "POST /mro/customers"
              payload: { account_number: "OCC-1", display_name: "Occ Co", credit_limit_cents: 100000, primary_ship_to_state: "OH" }
              as: DistributionAdmin
              captures: { cust_id: $.data.id, v1: $.data.version }
            - call: "PUT /mro/customers/${cust_id}"
              payload: { price_tier: "GOLD", expected_customer_version: "${v1}" }
              as: DistributionAdmin
              captures: { v2: $.data.version }
          trigger:
            - call: "PUT /mro/customers/${cust_id}"
              payload: { price_tier: "PLATINUM", expected_customer_version: "${v1}" }
              as: DistributionAdmin
              captures: { err: $.data.error_id }
            - call: "PUT /mro/customers/${cust_id}"
              payload: { price_tier: "PLATINUM", expected_customer_version: "${v2}" }
              as: DistributionAdmin
              captures: { tier: $.data.price_tier, v3: $.data.version }
          assert:
            - "v2 == 2"
            - "err == ERR_STALE_VERSION (stale ${v1} after the account advanced to 2)"
            - "tier == PLATINUM and v3 == 3 (current version succeeds and advances again)"

      - name: occ_price_rule_stale_version_returns_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[price-rule-update-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "PUT /mro/price-rules/{id} with a superseded expected_price_rule_version fails with ERR_STALE_VERSION (412); OCC guards the price matrix against stale writers."
        test_recipe:
          setup: ["Item; DRAFT price rule (version 1); one successful PUT moved it to version 2"]
          setup_api_calls:
            - call: "POST /mro/items"
              payload: { sku: "OCC-2", description: "Occ item", item_class: "STOCKED", list_price_cents: 1000 }
              as: DistributionAdmin
              captures: { it_id: $.data.id }
            - call: "POST /mro/price-rules"
              payload: { customer_tier: "SILVER", item_id: "${it_id}", rule_type: "FIXED_PRICE", contract_unit_price_cents: 900, effective_from: "2026-01-01", effective_to: "2027-01-01" }
              as: DistributionAdmin
              captures: { pr_id: $.data.id, rv1: $.data.version }
            - call: "PUT /mro/price-rules/${pr_id}"
              payload: { contract_unit_price_cents: 890, expected_price_rule_version: "${rv1}" }
              as: DistributionAdmin
              captures: { rv2: $.data.version }
          trigger:
            - call: "PUT /mro/price-rules/${pr_id}"
              payload: { contract_unit_price_cents: 880, expected_price_rule_version: "${rv1}" }
              as: DistributionAdmin
              captures: { err: $.data.error_id }
          assert:
            - "rv2 == 2"
            - "err == ERR_STALE_VERSION"

      - name: cascading_side_effects_end_to_end
        claim_type: cascading_side_effects
        grounds: [state_machines.SalesOrder.CONFIRMED_to_COMPLETED, state_machines.SalesOrder.CONFIRMED_to_CANCELLED]
        distinguishing_aspect: "Multi-entity cascade chains asserted with literal end-states."
        excluded_because:
          difficulty_instance: completion_accrual_cascade
          rationale: "Depth-4 accrual cascade asserted there; cancel-driven backorder cascade in cancel_release_backorder_fill_cascade."

      - name: derived_field_reconciliation_after_credit
        claim_type: derived_field_reconciliation
        grounds: [entities.CustomerAccount.fields.net_spend_cents]
        distinguishing_aspect: "Customer net spend reconciles with completed totals minus credited returns after each mutation."
        excluded_because:
          difficulty_instance: spend_complete_credit_reconciliation
          rationale: "Reconciliation identity net + credits == gross asserted with literals there."

  # ---------------------------------------------------------------------------
  - section: consistency_model
    instances:
      - name: immediate_consistency_read_after_write
        claim_type: immediate
        grounds: [complexity_profile.consistency_model, endpoints.POST_/mro/items]
        distinguishing_aspect: "Immediate consistency: a freshly created item is fully visible in the very next GET (no lag), including computed defaults."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls:
            - call: "POST /mro/items"
              payload: { sku: "IC-1", description: "Immediate", item_class: "SPECIAL_ORDER", list_price_cents: 4321 }
              as: DistributionAdmin
              captures: { it_id: $.data.id, ds: $.data.drop_ship_eligible, hz: $.data.hazmat_restriction }
          trigger:
            - call: "GET /mro/items/${it_id}"
              as: DistributionAdmin
              captures: { lp: $.data.list_price_cents, ic: $.data.item_class, ver: $.data.version }
          assert:
            - "ds == false and hz == NONE (defaults applied at creation, visible in the create response)"
            - "lp == 4321 and ic == SPECIAL_ORDER and ver == 1 (read-after-write returns the same committed state)"
