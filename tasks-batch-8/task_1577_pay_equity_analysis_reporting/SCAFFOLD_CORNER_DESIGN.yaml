scaffold_corner_design:
- section: entities
  instances:
  - name: study_create_applies_defaults
    claim_type: defaults
    grounds:
    - entities.PayEquityStudy.fields.significance_threshold
    - entities.PayEquityStudy.fields.min_group_size
    - entities.PayEquityStudy.fields.status
    distinguishing_aspect: Omitting optional config yields significance_threshold 0.05, actionable_gap_pct 2.0, min_group_size
      30, monitor_cadence_days 180; status DRAFT; version 1.
    test_recipe:
      setup:
      - Empty DB; clock at default 2026-08-01T00:00:00Z
      setup_api_calls: []
      trigger:
      - call: POST /api/pay-equity-studies
        payload:
          name: Dflt
          analysis_period_start: '2025-01-01'
          analysis_period_end: '2025-12-31'
          protected_classes:
          - GENDER
        as: CompAnalyst
        captures:
          st: $.data.status
          v: $.data.version
          sig: $.data.significance_threshold
          gap: $.data.actionable_gap_pct
          mgs: $.data.min_group_size
          cad: $.data.monitor_cadence_days
      assert:
      - st == DRAFT and v == 1
      - sig == 0.05 and gap == 2.0 and mgs == 30 and cad == 180
      - review_rounds == 0 and privileged_model_run_ids == []
  - name: study_create_missing_required_name_rejected
    claim_type: required_fields
    grounds:
    - entities.PayEquityStudy.fields.name
    - errors[ERR_INVALID_REQUEST]
    distinguishing_aspect: Omitting required name yields ERR_INVALID_REQUEST (400); no study persisted.
    test_recipe:
      setup:
      - Empty DB
      setup_api_calls: []
      trigger:
      - call: POST /api/pay-equity-studies
        payload:
          analysis_period_start: '2025-01-01'
          analysis_period_end: '2025-12-31'
          protected_classes:
          - GENDER
        as: CompAnalyst
        captures:
          err: $.data.error_id
      assert:
      - err == ERR_INVALID_REQUEST (http 400)
  - name: study_create_invalid_period_rejected
    claim_type: type_constraints
    grounds:
    - entities.PayEquityStudy.fields.analysis_period_end
    - errors[ERR_INVALID_REQUEST]
    distinguishing_aspect: analysis_period_end earlier than analysis_period_start is rejected with ERR_INVALID_REQUEST.
    test_recipe:
      setup:
      - Empty DB
      setup_api_calls: []
      trigger:
      - call: POST /api/pay-equity-studies
        payload:
          name: BadPeriod
          analysis_period_start: '2025-12-31'
          analysis_period_end: '2025-01-01'
          protected_classes:
          - GENDER
        as: CompAnalyst
        captures:
          err: $.data.error_id
      assert:
      - err == ERR_INVALID_REQUEST (http 400)
  - name: snapshot_computed_fields_input_ignored
    claim_type: computed_fields
    grounds:
    - entities.EmployeeSnapshot.fields.annualized_base_cents
    - entities.EmployeeSnapshot.fields.tenure_years
    - calculations.fte_annualized_base
    distinguishing_aspect: Client-sent annualized_base_cents is ignored; server computes 6000000 / 0.5 = 12000000 and tenure
      5.0 from hire 2021-01-01 to period end 2025-12-31.
    test_recipe:
      setup:
      - Study X (period 2025-01-01..2025-12-31) DRAFT
      setup_api_calls:
      - call: POST /api/pay-equity-studies
        payload:
          name: StudyX
          analysis_period_start: '2025-01-01'
          analysis_period_end: '2025-12-31'
          protected_classes:
          - GENDER
        as: CompAnalyst
        captures:
          sx: $.data.id
      trigger:
      - call: POST /api/employee-snapshots
        payload:
          study_id: ${sx}
          employee_ref: X1
          gender_class: MALE
          ethnicity_class: WHITE
          age_band: UNDER_40
          job_family: ENG
          job_level: 5
          location_code: CA
          fte_factor: 0.5
          base_salary_cents: 6000000
          bonus_cents: 0
          hire_date: '2021-01-01'
          annualized_base_cents: 1
        as: PeopleOpsAdmin
        captures:
          ann: $.data.annualized_base_cents
          ten: $.data.tenure_years
      assert:
      - ann == 12000000 (server-computed; client-sent 1 ignored)
      - ten == 5.0 (ROUND(1825 / 365.25, 2))
  - name: snapshot_duplicate_employee_ref_rejected
    claim_type: violation_to_error
    grounds:
    - errors[ERR_DUPLICATE_EMPLOYEE_REF]
    - validations[priority=7]
    distinguishing_aspect: Second snapshot with the same employee_ref inside one study conflicts (409); the same ref in a
      DIFFERENT study is fine.
    test_recipe:
      setup:
      - Study X1 (2024) with snapshot ref DUP1; Study X2 (2025) empty
      setup_api_calls:
      - call: POST /api/pay-equity-studies
        payload:
          name: X1
          analysis_period_start: '2024-01-01'
          analysis_period_end: '2024-12-31'
          protected_classes:
          - GENDER
        as: CompAnalyst
        captures:
          x1: $.data.id
      - call: POST /api/pay-equity-studies
        payload:
          name: X2
          analysis_period_start: '2025-01-01'
          analysis_period_end: '2025-12-31'
          protected_classes:
          - GENDER
        as: CompAnalyst
        captures:
          x2: $.data.id
      - call: POST /api/employee-snapshots
        payload:
          study_id: ${x1}
          employee_ref: DUP1
          gender_class: MALE
          ethnicity_class: WHITE
          age_band: UNDER_40
          job_family: ENG
          job_level: 5
          location_code: CA
          fte_factor: 1.0
          base_salary_cents: 10000000
          bonus_cents: 0
          hire_date: '2020-01-01'
        as: PeopleOpsAdmin
      trigger:
      - call: POST /api/employee-snapshots
        payload:
          study_id: ${x1}
          employee_ref: DUP1
          gender_class: FEMALE
          ethnicity_class: ASIAN
          age_band: FORTY_PLUS
          job_family: ENG
          job_level: 4
          location_code: CA
          fte_factor: 1.0
          base_salary_cents: 9000000
          bonus_cents: 0
          hire_date: '2019-01-01'
        as: PeopleOpsAdmin
        captures:
          err: $.data.error_id
      - call: POST /api/employee-snapshots
        payload:
          study_id: ${x2}
          employee_ref: DUP1
          gender_class: FEMALE
          ethnicity_class: ASIAN
          age_band: FORTY_PLUS
          job_family: ENG
          job_level: 4
          location_code: CA
          fte_factor: 1.0
          base_salary_cents: 9000000
          bonus_cents: 0
          hire_date: '2019-01-01'
        as: PeopleOpsAdmin
        captures:
          ok_id: $.data.id
      assert:
      - 'Same-study duplicate: err == ERR_DUPLICATE_EMPLOYEE_REF (http 409)'
      - 'Cross-study reuse succeeds: ok_id is a new snapshot id'
  - name: study_get_unknown_id_returns_not_found
    claim_type: not_found
    grounds:
    - errors[ERR_NOT_FOUND]
    - validations[priority=3]
    distinguishing_aspect: GET with a well-formed but unknown UUID yields ERR_NOT_FOUND (404).
    test_recipe:
      setup:
      - Empty DB
      setup_api_calls: []
      trigger:
      - call: GET /api/pay-equity-studies/11111111-2222-4333-8444-555555555555
        payload: {}
        as: CompAnalyst
        captures:
          err: $.data.error_id
      assert:
      - err == ERR_NOT_FOUND (http 404)
  - name: jurisdiction_duplicate_code_rejected
    claim_type: violation_to_error
    grounds:
    - errors[ERR_DUPLICATE_JURISDICTION]
    - entities.JurisdictionRule.fields.jurisdiction_code
    distinguishing_aspect: jurisdiction_code is globally unique; second create with the same code conflicts.
    test_recipe:
      setup:
      - Jurisdiction CA exists
      setup_api_calls:
      - call: POST /api/jurisdiction-rules
        payload:
          jurisdiction_code: CA
          range_disclosure_required: true
          max_range_spread_pct: 50
          min_posting_duration_days: 30
        as: PeopleOpsAdmin
        captures:
          jr: $.data.id
      trigger:
      - call: POST /api/jurisdiction-rules
        payload:
          jurisdiction_code: CA
          range_disclosure_required: false
        as: PeopleOpsAdmin
        captures:
          err: $.data.error_id
      assert:
      - err == ERR_DUPLICATE_JURISDICTION (http 409)
  - name: jurisdiction_create_id_input_ignored
    claim_type: system_fields
    grounds:
    - entities.JurisdictionRule
    distinguishing_aspect: Client-sent id is ignored; the server mints its own UUID.
    test_recipe:
      setup:
      - Empty DB
      setup_api_calls: []
      trigger:
      - call: POST /api/jurisdiction-rules
        payload:
          id: 11111111-2222-4333-8444-555555555555
          jurisdiction_code: CO
        as: PeopleOpsAdmin
        captures:
          rid: $.data.id
      assert:
      - rid != 11111111-2222-4333-8444-555555555555 (server-minted)
      - created_at == 2026-08-01T00:00:00Z from the default logical clock
  - name: jurisdiction_list_pagination
    claim_type: listing
    grounds:
    - response_envelope.pagination_fields
    - response_envelope.pagination_defaults
    distinguishing_aspect: limit=2 returns 2 rows with has_more true and total_count 3; offset=2 returns the final row with
      has_more false.
    test_recipe:
      setup:
      - Jurisdictions CA, CO, NYC created in that order
      setup_api_calls:
      - call: POST /api/jurisdiction-rules
        payload:
          jurisdiction_code: CA
        as: PeopleOpsAdmin
      - call: POST /api/jurisdiction-rules
        payload:
          jurisdiction_code: CO
        as: PeopleOpsAdmin
      - call: POST /api/jurisdiction-rules
        payload:
          jurisdiction_code: NYC
        as: PeopleOpsAdmin
      trigger:
      - call: GET /api/jurisdiction-rules
        payload:
          limit: 2
          offset: 0
        as: CompAnalyst
        captures:
          page1: $.data
      - call: GET /api/jurisdiction-rules
        payload:
          limit: 2
          offset: 2
        as: CompAnalyst
        captures:
          page2: $.data
      assert:
      - page1 has 2 items; meta pagination reports total_count == 3 and has_more == true
      - page2 has 1 item (NYC) and has_more == false
  - name: study_list_filter_by_status
    claim_type: listing
    grounds:
    - endpoints GET /api/pay-equity-studies
    distinguishing_aspect: 'status filter narrows the list: DRAFT returns the 2 created studies, CLOSED returns 0.'
    test_recipe:
      setup:
      - Two DRAFT studies with disjoint periods
      setup_api_calls:
      - call: POST /api/pay-equity-studies
        payload:
          name: F1
          analysis_period_start: '2024-01-01'
          analysis_period_end: '2024-12-31'
          protected_classes:
          - GENDER
        as: CompAnalyst
      - call: POST /api/pay-equity-studies
        payload:
          name: F2
          analysis_period_start: '2025-01-01'
          analysis_period_end: '2025-12-31'
          protected_classes:
          - GENDER
        as: CompAnalyst
      trigger:
      - call: GET /api/pay-equity-studies
        payload:
          status: DRAFT
        as: CompAnalyst
        captures:
          drafts: $.data
      - call: GET /api/pay-equity-studies
        payload:
          status: CLOSED
        as: CompAnalyst
        captures:
          closed: $.data
      assert:
      - drafts has 2 items, all with status DRAFT
      - closed has 0 items
  - name: posting_duplicate_ref_rejected
    claim_type: violation_to_error
    grounds:
    - errors[ERR_DUPLICATE_POSTING_REF]
    - entities.TransparencyPosting.fields.job_posting_ref
    distinguishing_aspect: job_posting_ref is globally unique across postings.
    test_recipe:
      setup:
      - Jurisdiction JR exists; posting with ref POST-1 created
      setup_api_calls:
      - call: POST /api/jurisdiction-rules
        payload:
          jurisdiction_code: WA
        as: PeopleOpsAdmin
        captures:
          jr: $.data.id
      - call: POST /api/transparency-postings
        payload:
          jurisdiction_rule_id: ${jr}
          job_posting_ref: POST-1
          title: Engineer
          min_salary_cents: 10000000
          max_salary_cents: 12000000
        as: ComplianceReporter
      trigger:
      - call: POST /api/transparency-postings
        payload:
          jurisdiction_rule_id: ${jr}
          job_posting_ref: POST-1
          title: Other
          min_salary_cents: 9000000
          max_salary_cents: 9900000
        as: ComplianceReporter
        captures:
          err: $.data.error_id
      assert:
      - err == ERR_DUPLICATE_POSTING_REF (http 409)
  - name: group_duplicate_name_rejected
    claim_type: violation_to_error
    grounds:
    - errors[ERR_DUPLICATE_GROUP_NAME]
    - entities.ComparatorGroup.fields.name
    distinguishing_aspect: Group name is unique within a study; the same name in another study is allowed.
    test_recipe:
      setup:
      - Study Y1 (2024) with group ENG-5; study Y2 (2025) empty
      setup_api_calls:
      - call: POST /api/pay-equity-studies
        payload:
          name: Y1
          analysis_period_start: '2024-01-01'
          analysis_period_end: '2024-12-31'
          protected_classes:
          - GENDER
        as: CompAnalyst
        captures:
          y1: $.data.id
      - call: POST /api/pay-equity-studies
        payload:
          name: Y2
          analysis_period_start: '2025-01-01'
          analysis_period_end: '2025-12-31'
          protected_classes:
          - GENDER
        as: CompAnalyst
        captures:
          y2: $.data.id
      - call: POST /api/comparator-groups
        payload:
          study_id: ${y1}
          name: ENG-5
          job_family: ENG
          min_job_level: 5
          max_job_level: 5
          location_code: CA
        as: CompAnalyst
      trigger:
      - call: POST /api/comparator-groups
        payload:
          study_id: ${y1}
          name: ENG-5
          job_family: ENG
          min_job_level: 6
          max_job_level: 6
          location_code: CA
        as: CompAnalyst
        captures:
          err: $.data.error_id
      - call: POST /api/comparator-groups
        payload:
          study_id: ${y2}
          name: ENG-5
          job_family: ENG
          min_job_level: 5
          max_job_level: 5
          location_code: CA
        as: CompAnalyst
        captures:
          g2: $.data.id
      assert:
      - 'Same-study duplicate: err == ERR_DUPLICATE_GROUP_NAME (http 409)'
      - 'Cross-study reuse succeeds: g2 created'
- section: state_machines
  instances:
  - name: group_lock_twice_rejected
    claim_type: invalid_transition
    grounds:
    - state_machines.ComparatorGroup.DRAFT_to_LOCKED
    - errors[ERR_GROUP_INVALID_STATE]
    distinguishing_aspect: Locking an already-LOCKED group fails with ERR_GROUP_INVALID_STATE; no side effects fire twice.
    test_recipe:
      setup:
      - Study G2 (period 2025, [GENDER], min_group_size 2) MODELING; group GG LOCKED with 2 members
      setup_api_calls:
      - call: POST /api/pay-equity-studies
        payload:
          name: G2
          analysis_period_start: '2025-01-01'
          analysis_period_end: '2025-12-31'
          protected_classes:
          - GENDER
          min_group_size: 2
        as: CompAnalyst
        captures:
          s: $.data.id
      - call: POST /api/employee-snapshots
        payload:
          study_id: ${s}
          employee_ref: G2M1
          gender_class: MALE
          ethnicity_class: WHITE
          age_band: UNDER_40
          job_family: ENG
          job_level: 5
          location_code: CA
          fte_factor: 1.0
          base_salary_cents: 10000000
          bonus_cents: 0
          hire_date: '2020-01-01'
        as: PeopleOpsAdmin
        captures:
          m1: $.data.id
      - call: POST /api/employee-snapshots
        payload:
          study_id: ${s}
          employee_ref: G2F1
          gender_class: FEMALE
          ethnicity_class: WHITE
          age_band: UNDER_40
          job_family: ENG
          job_level: 5
          location_code: CA
          fte_factor: 1.0
          base_salary_cents: 9000000
          bonus_cents: 0
          hire_date: '2020-01-01'
        as: PeopleOpsAdmin
        captures:
          f1: $.data.id
      - call: POST /api/comparator-groups
        payload:
          study_id: ${s}
          name: GG
          job_family: ENG
          min_job_level: 5
          max_job_level: 5
          location_code: CA
        as: CompAnalyst
        captures:
          g: $.data.id
      - call: PATCH /api/employee-snapshots/${m1}
        payload:
          comparator_group_id: ${g}
        as: PeopleOpsAdmin
      - call: PATCH /api/employee-snapshots/${f1}
        payload:
          comparator_group_id: ${g}
        as: PeopleOpsAdmin
      - call: POST /api/pay-equity-studies/${s}/advance
        payload: {}
        as: CompAnalyst
      - call: POST /api/comparator-groups/${g}/lock
        payload: {}
        as: CompAnalyst
        captures:
          st1: $.data.status
      trigger:
      - call: POST /api/comparator-groups/${g}/lock
        payload: {}
        as: CompAnalyst
        captures:
          err: $.data.error_id
      assert:
      - st1 == LOCKED after the first lock
      - 'Second lock: err == ERR_GROUP_INVALID_STATE (http 409)'
  - name: run_finalize_and_supersede_guards
    claim_type: invalid_transition
    grounds:
    - state_machines.ModelRun.PROVISIONAL_to_FINAL
    - state_machines.ModelRun.PROVISIONAL_to_SUPERSEDED
    - errors[ERR_RUN_INVALID_STATE]
    distinguishing_aspect: A newer run SUPERSEDES the prior PROVISIONAL one (run_index increments); finalizing a SUPERSEDED
      run fails, finalizing a FINAL run twice fails, finalizing the current PROVISIONAL run succeeds.
    test_recipe:
      setup:
      - Study RS (period 2025, [GENDER], min_group_size 2) MODELING; group GRS LOCKED with 2 members
      setup_api_calls:
      - call: POST /api/pay-equity-studies
        payload:
          name: RS
          analysis_period_start: '2025-01-01'
          analysis_period_end: '2025-12-31'
          protected_classes:
          - GENDER
          min_group_size: 2
        as: CompAnalyst
        captures:
          s: $.data.id
      - call: POST /api/employee-snapshots
        payload:
          study_id: ${s}
          employee_ref: RSM1
          gender_class: MALE
          ethnicity_class: WHITE
          age_band: UNDER_40
          job_family: ENG
          job_level: 5
          location_code: CA
          fte_factor: 1.0
          base_salary_cents: 10000000
          bonus_cents: 0
          hire_date: '2020-01-01'
        as: PeopleOpsAdmin
        captures:
          m1: $.data.id
      - call: POST /api/employee-snapshots
        payload:
          study_id: ${s}
          employee_ref: RSF1
          gender_class: FEMALE
          ethnicity_class: WHITE
          age_band: UNDER_40
          job_family: ENG
          job_level: 5
          location_code: CA
          fte_factor: 1.0
          base_salary_cents: 9000000
          bonus_cents: 0
          hire_date: '2020-01-01'
        as: PeopleOpsAdmin
        captures:
          f1: $.data.id
      - call: POST /api/comparator-groups
        payload:
          study_id: ${s}
          name: GRS
          job_family: ENG
          min_job_level: 5
          max_job_level: 5
          location_code: CA
        as: CompAnalyst
        captures:
          g: $.data.id
      - call: PATCH /api/employee-snapshots/${m1}
        payload:
          comparator_group_id: ${g}
        as: PeopleOpsAdmin
      - call: PATCH /api/employee-snapshots/${f1}
        payload:
          comparator_group_id: ${g}
        as: PeopleOpsAdmin
      - call: POST /api/pay-equity-studies/${s}/advance
        payload: {}
        as: CompAnalyst
      - call: POST /api/comparator-groups/${g}/lock
        payload: {}
        as: CompAnalyst
        captures:
          gv: $.data.version
      - call: POST /api/model-runs
        payload:
          comparator_group_id: ${g}
          methodology: COHORT_MEDIAN
          expected_group_version: ${gv}
        as: CompAnalyst
        captures:
          r1: $.data.id
          r1_idx: $.data.run_index
      trigger:
      - call: GET /api/comparator-groups/${g}
        payload: {}
        as: CompAnalyst
        captures:
          gv2: $.data.version
      - call: POST /api/model-runs
        payload:
          comparator_group_id: ${g}
          methodology: REGRESSION_OLS
          expected_group_version: ${gv2}
        as: CompAnalyst
        captures:
          r2: $.data.id
          r2_idx: $.data.run_index
      - call: GET /api/model-runs/${r1}
        payload: {}
        as: CompAnalyst
        captures:
          r1_status: $.data.status
      - call: POST /api/model-runs/${r1}/finalize
        payload: {}
        as: CompAnalyst
        captures:
          err1: $.data.error_id
      - call: POST /api/model-runs/${r2}/finalize
        payload: {}
        as: CompAnalyst
        captures:
          r2_status: $.data.status
      - call: POST /api/model-runs/${r2}/finalize
        payload: {}
        as: CompAnalyst
        captures:
          err2: $.data.error_id
      assert:
      - r1_idx == 1 and r2_idx == 2
      - r1_status == SUPERSEDED after R2's creation (auto-supersede side effect)
      - 'Finalizing superseded R1: err1 == ERR_RUN_INVALID_STATE (http 409)'
      - 'R2 finalizes: r2_status == FINAL'
      - 'Second finalize of FINAL R2: err2 == ERR_RUN_INVALID_STATE'
  - name: finding_disposition_guards
    claim_type: precondition_enforcement
    grounds:
    - state_machines.GapFinding.FLAGGED_to_TARGETED
    - state_machines.GapFinding.FLAGGED_to_DISMISSED
    - errors[ERR_FINDING_NOT_ACTIONABLE]
    - errors[ERR_RATIONALE_REQUIRED]
    - errors[ERR_FINDING_INVALID_STATE]
    distinguishing_aspect: TARGETED on a non-actionable finding fails (p 0.0909 > 0.05); DISMISSED without rationale fails;
      DISMISSED with rationale succeeds; any further disposition on the terminal DISMISSED finding fails with ERR_FINDING_INVALID_STATE.
    test_recipe:
      setup:
      - 'Study FD (period 2025, [GENDER], min_group_size 2, DEFAULT significance_threshold 0.05) REMEDIATION_OPEN; 2-member
        group (MALE 10000000, FEMALE 9000000) MEDIAN run FINAL: gap 10.0000 but p == 0.0909 > 0.05, so the FLAGGED finding
        is NOT actionable'
      setup_api_calls:
      - call: POST /api/pay-equity-studies
        payload:
          name: FD
          analysis_period_start: '2025-01-01'
          analysis_period_end: '2025-12-31'
          protected_classes:
          - GENDER
          min_group_size: 2
        as: CompAnalyst
        captures:
          s: $.data.id
      - call: POST /api/employee-snapshots
        payload:
          study_id: ${s}
          employee_ref: FDM1
          gender_class: MALE
          ethnicity_class: WHITE
          age_band: UNDER_40
          job_family: ENG
          job_level: 5
          location_code: CA
          fte_factor: 1.0
          base_salary_cents: 10000000
          bonus_cents: 0
          hire_date: '2020-01-01'
        as: PeopleOpsAdmin
        captures:
          m1: $.data.id
      - call: POST /api/employee-snapshots
        payload:
          study_id: ${s}
          employee_ref: FDF1
          gender_class: FEMALE
          ethnicity_class: WHITE
          age_band: UNDER_40
          job_family: ENG
          job_level: 5
          location_code: CA
          fte_factor: 1.0
          base_salary_cents: 9000000
          bonus_cents: 0
