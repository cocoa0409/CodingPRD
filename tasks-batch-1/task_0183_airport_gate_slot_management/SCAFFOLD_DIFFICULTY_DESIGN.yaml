scaffold_difficulty_design:

  # =========================================================================
  # Rule 1 — dual_variant_calc (>= 2 instances, different entity domains)
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: turn_time_gate_vs_remote_variant_on_gateassignment
        grounds:
          - calculations.turn_time_feasibility
          - entities.GateAssignment.fields.occupancy_minutes
          - validations[priority=13]
        distinguishing_aspect: |
          The turn_time_feasibility calc applies its min-turn floor on the GateAssignment
          domain, and its gate_window variant additionally lives under the buffer regime
          while the remote_window variant does not — same occupancy_minutes input, two
          variant contexts on one entity; this instance pins the GATE variant numerically.
        test_recipe:
          setup:
            - "Gate G1 (buffer 10, max wingspan 80) registered; Flight F1 with min_turn_minutes=45 created."
            - "A GATE assignment with a 45-minute window (10:00->10:45) is exactly at the min-turn boundary and must succeed."
          setup_api_calls:
            - call: "POST /gates"
              payload: { code: "A12", terminal: "T1", max_wingspan_m: 80, buffer_minutes: 10 }
              as: OpsAdmin
              captures: { g1_id: $.data.id, g1_v: $.data.version }
            - call: "POST /flights"
              payload: { flight_no: "AA482", aircraft_wingspan_m: 60, sched_arrival_utc: "2026-06-10T10:00:00Z", sched_departure_utc: "2026-06-10T10:45:00Z", min_turn_minutes: 45 }
              as: OpsAdmin
              captures: { f1_id: $.data.id }
          trigger:
            - call: "POST /gate-assignments"
              payload: { flight_id: "${f1_id}", stand_type: "GATE", gate_id: "${g1_id}", start_utc: "2026-06-10T10:00:00Z", end_utc: "2026-06-10T10:45:00Z", expected_gate_version: "${g1_v}" }
              as: GateController
              captures: { ga1_id: $.data.id, ga1_occ: $.data.occupancy_minutes }
          assert:
            - "GateAssignment.${ga1_id}.occupancy_minutes == 45"
            - "GateAssignment.${ga1_id}.status == PLANNED"
            - "Flight.${f1_id}.handling_status == ASSIGNED"

      - name: slot_compliance_arrival_vs_departure_variant_on_slotpermit
        grounds:
          - calculations.slot_compliance_window
          - state_machines.SlotPermit.CONFIRMED_to_USED
          - validations[priority=14]
        distinguishing_aspect: |
          slot_compliance_window operates on the SlotPermit domain (a different entity than
          turn_time_feasibility's GateAssignment), and its arrival_tolerance vs departure_tolerance
          variants centre the closed window on different reference instants; this instance pins the
          ARRIVAL variant with the clock at the exact upper boundary (12:15 of a [11:45,12:15] window).
        test_recipe:
          setup:
            - "Flight F1 created; an ARRIVAL SlotPermit at 12:00 with tolerance 15 (window [11:45,12:15]) confirmed."
            - "Clock set to 12:15:00Z — the inclusive upper boundary."
          setup_api_calls:
            - call: "POST /flights"
              payload: { flight_no: "DL11", aircraft_wingspan_m: 50, sched_arrival_utc: "2026-06-10T12:00:00Z", sched_departure_utc: "2026-06-10T13:00:00Z" }
              as: OpsAdmin
              captures: { f1_id: $.data.id }
            - call: "POST /slot-permits"
              payload: { flight_id: "${f1_id}", movement_type: "ARRIVAL", slot_time_utc: "2026-06-10T12:00:00Z", tolerance_minutes: 15 }
              as: SlotCoordinator
              captures: { sp1_id: $.data.id }
            - call: "POST /slot-permits/${sp1_id}/confirm"
              payload: {}
              as: SlotCoordinator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T12:15:00Z" }
              as: OpsAdmin
          trigger:
            - call: "POST /slot-permits/${sp1_id}/redeem"
              payload: {}
              as: SlotCoordinator
              captures: { sp1_status: $.data.status }
          assert:
            - "SlotPermit.${sp1_id}.status == USED"

  # =========================================================================
  # Rule 2 — combinatorial_formula (>= 2 instances, different modes a/b/c)
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: gate_window_buffer_two_sided_mode_a
        grounds:
          - calculations.gate_window_conflict
          - entities.Gate.fields.buffer_minutes
          - validations[priority=8]
        distinguishing_aspect: |
          MODE (a): the gate_window_conflict formula has >=3 inputs (new interval [s,e),
          existing interval [s2,e2), and buffer_minutes) combined non-linearly as the AND of two
          buffer-shifted strict inequalities; a new window starting exactly buffer minutes after the
          existing end (10:55 after [10:00,10:45) with buffer 10) does NOT conflict, while 10:54 does.
        test_recipe:
          setup:
            - "Gate G1 buffer 10; Flight F1 occupies [10:00,10:45) (PLANNED)."
            - "A second flight F2 attempts [10:54,11:40) on the same gate — only 9-minute gap < buffer 10 -> conflict."
          setup_api_calls:
            - call: "POST /gates"
              payload: { code: "B5", terminal: "T2", max_wingspan_m: 80, buffer_minutes: 10 }
              as: OpsAdmin
              captures: { g1_id: $.data.id, g1_v: $.data.version }
            - call: "POST /flights"
              payload: { flight_no: "UA1", aircraft_wingspan_m: 60, sched_arrival_utc: "2026-06-10T10:00:00Z", sched_departure_utc: "2026-06-10T10:45:00Z", min_turn_minutes: 45 }
              as: OpsAdmin
              captures: { f1_id: $.data.id }
            - call: "POST /gate-assignments"
              payload: { flight_id: "${f1_id}", stand_type: "GATE", gate_id: "${g1_id}", start_utc: "2026-06-10T10:00:00Z", end_utc: "2026-06-10T10:45:00Z", expected_gate_version: "${g1_v}" }
              as: GateController
              captures: { ga1_id: $.data.id }
            - call: "GET /gates/${g1_id}"
              as: GateController
              captures: { g1_v2: $.data.version }
            - call: "POST /flights"
              payload: { flight_no: "UA2", aircraft_wingspan_m: 60, sched_arrival_utc: "2026-06-10T10:54:00Z", sched_departure_utc: "2026-06-10T11:40:00Z", min_turn_minutes: 45 }
              as: OpsAdmin
              captures: { f2_id: $.data.id }
          trigger:
            - call: "POST /gate-assignments"
              payload: { flight_id: "${f2_id}", stand_type: "GATE", gate_id: "${g1_id}", start_utc: "2026-06-10T10:54:00Z", end_utc: "2026-06-10T11:40:00Z", expected_gate_version: "${g1_v2}" }
              as: GateController
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_GATE_WINDOW_CONFLICT"
            - "http status == 409"

      - name: occupancy_reconcile_pinned_order_mode_c
        grounds:
          - calculations.occupancy_counter_reconcile
          - state_machines.GateAssignment.TOWED_AWAY_to_OCCUPIED
          - entities.RemoteStand.fields.occupancy_count
        distinguishing_aspect: |
          MODE (c): a circular-looking dependency where which counter is "the stand" depends on tow
          state, which itself depends on whether the tow is unwound. occupancy_counter_reconcile PINS a
          3-step order (unwind tow target, then decrement source gate, then set terminal). This instance
          cancels a TOWED_AWAY assignment and asserts BOTH counters drop to zero with no double-count.
        test_recipe:
          setup:
            - "Gate G1, RemoteStand R1 (capacity 1) registered; Flight F1 assigned to G1, occupied, then towed to R1."
            - "After tow: Gate.active_assignment_count=1, R1.occupancy_count=1."
          setup_api_calls:
            - call: "POST /gates"
              payload: { code: "C1", terminal: "T1", max_wingspan_m: 80, buffer_minutes: 10 }
              as: OpsAdmin
              captures: { g1_id: $.data.id, g1_v: $.data.version }
            - call: "POST /remote-stands"
              payload: { code: "R1", max_wingspan_m: 80, capacity: 1 }
              as: OpsAdmin
              captures: { r1_id: $.data.id }
            - call: "POST /flights"
              payload: { flight_no: "AA9", aircraft_wingspan_m: 60, sched_arrival_utc: "2026-06-10T08:00:00Z", sched_departure_utc: "2026-06-10T12:00:00Z", min_turn_minutes: 45 }
              as: OpsAdmin
              captures: { f1_id: $.data.id }
            - call: "POST /gate-assignments"
              payload: { flight_id: "${f1_id}", stand_type: "GATE", gate_id: "${g1_id}", start_utc: "2026-06-10T08:00:00Z", end_utc: "2026-06-10T12:00:00Z", expected_gate_version: "${g1_v}" }
              as: GateController
              captures: { ga1_id: $.data.id }
            - call: "POST /gate-assignments/${ga1_id}/occupy"
              payload: {}
              as: RampAgent
            - call: "POST /gate-assignments/${ga1_id}/tow"
              payload: { target_remote_stand_id: "${r1_id}" }
              as: GateController
          trigger:
            - call: "POST /gate-assignments/${ga1_id}/cancel"
              payload: {}
              as: GateController
              captures: { ga1_status: $.data.status }
          assert:
            - "GateAssignment.${ga1_id}.status == CANCELLED"
            - "Gate.${g1_id}.active_assignment_count == 0"
            - "RemoteStand.${r1_id}.occupancy_count == 0"

  # =========================================================================
  # Rule 3 — non_linear_state_machine (>= 2 instances, different entities)
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: gateassignment_tow_cycle_occupied_towed_occupied
        grounds:
          - state_machines.GateAssignment.OCCUPIED_to_TOWED_AWAY
          - state_machines.GateAssignment.TOWED_AWAY_to_OCCUPIED
          - entities.GateAssignment.fields.tow_target_stand_id
        distinguishing_aspect: |
          CYCLE on GateAssignment: OCCUPIED -> TOWED_AWAY -> OCCUPIED returns the row to OCCUPIED with
          tow_target_stand_id cleared back to null, proving a genuine loop (not a linear pipeline) on
          the GateAssignment entity.
        test_recipe:
          setup:
            - "Gate G1, RemoteStand R1 registered; Flight F1 assigned to G1, occupied, towed to R1, then returned."
          setup_api_calls:
            - call: "POST /gates"
              payload: { code: "D1", terminal: "T1", max_wingspan_m: 80, buffer_minutes: 10 }
              as: OpsAdmin
              captures: { g1_id: $.data.id, g1_v: $.data.version }
            - call: "POST /remote-stands"
              payload: { code: "R2", max_wingspan_m: 80, capacity: 1 }
              as: OpsAdmin
              captures: { r1_id: $.data.id }
            - call: "POST /flights"
              payload: { flight_no: "BA7", aircraft_wingspan_m: 60, sched_arrival_utc: "2026-06-10T08:00:00Z", sched_departure_utc: "2026-06-10T12:00:00Z", min_turn_minutes: 45 }
              as: OpsAdmin
              captures: { f1_id: $.data.id }
            - call: "POST /gate-assignments"
              payload: { flight_id: "${f1_id}", stand_type: "GATE", gate_id: "${g1_id}", start_utc: "2026-06-10T08:00:00Z", end_utc: "2026-06-10T12:00:00Z", expected_gate_version: "${g1_v}" }
              as: GateController
              captures: { ga1_id: $.data.id }
            - call: "POST /gate-assignments/${ga1_id}/occupy"
              payload: {}
              as: RampAgent
            - call: "POST /gate-assignments/${ga1_id}/tow"
              payload: { target_remote_stand_id: "${r1_id}" }
              as: GateController
          trigger:
            - call: "POST /gate-assignments/${ga1_id}/return"
              payload: {}
              as: GateController
              captures: { ga1_status: $.data.status, ga1_tow: $.data.tow_target_stand_id }
          assert:
            - "GateAssignment.${ga1_id}.status == OCCUPIED"
            - "GateAssignment.${ga1_id}.tow_target_stand_id == null"
            - "RemoteStand.${r1_id}.occupancy_count == 0"

      - name: slotpermit_branch_confirmed_to_forfeited
        grounds:
          - state_machines.SlotPermit.CONFIRMED_to_FORFEITED
          - state_machines.SlotPermit.CONFIRMED_to_USED
          - entities.SlotPermit.fields.status
        distinguishing_aspect: |
          BRANCH on SlotPermit (a different entity than GateAssignment): from CONFIRMED the machine
          forks to either USED or FORFEITED with divergent side-effect sets; this instance drives the
          FORFEITED branch and confirms the row lands in the FORFEITED terminal, not USED.
        test_recipe:
          setup:
            - "Flight F1 created; a DEPARTURE SlotPermit confirmed; then explicitly forfeited."
          setup_api_calls:
            - call: "POST /flights"
              payload: { flight_no: "LH3", aircraft_wingspan_m: 50, sched_arrival_utc: "2026-06-10T09:00:00Z", sched_departure_utc: "2026-06-10T10:00:00Z" }
              as: OpsAdmin
              captures: { f1_id: $.data.id }
            - call: "POST /slot-permits"
              payload: { flight_id: "${f1_id}", movement_type: "DEPARTURE", slot_time_utc: "2026-06-10T10:00:00Z", tolerance_minutes: 10 }
              as: SlotCoordinator
              captures: { sp1_id: $.data.id }
            - call: "POST /slot-permits/${sp1_id}/confirm"
              payload: {}
              as: SlotCoordinator
          trigger:
            - call: "POST /slot-permits/${sp1_id}/forfeit"
              payload: {}
              as: SlotCoordinator
              captures: { sp1_status: $.data.status }
          assert:
            - "SlotPermit.${sp1_id}.status == FORFEITED"

  # =========================================================================
  # Rule 4 — transitive_cascade (>= 2 instances, one depth>=3, different triggers)
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: irops_cancel_cascade_depth3
        grounds:
          - state_machines.Flight.ACTIVE_to_CANCELLED
          - state_machines.GateAssignment.OCCUPIED_to_CANCELLED
          - state_machines.SlotPermit.REQUESTED_to_CANCELLED
        distinguishing_aspect: |
          DEPTH-3 cascade triggered by POST /flights/{id}/irops-cancel: hop1 flight->CANCELLED forces
          each active GateAssignment->CANCELLED; hop2 each cancelled assignment that was OCCUPIED
          decrements its stand counter; hop3 (chained off the teardown) flips REQUESTED/CONFIRMED
          SlotPermits to FORFEITED and HELD allocations to CANCELLED. Each hop is caused by the prior.
        test_recipe:
          setup:
            - "Flight F1 ACTIVE, occupying Gate G1 (OCCUPIED assignment), with one CONFIRMED SlotPermit and one HELD GseAllocation."
            - "Pre-cancel: Gate.active_assignment_count=1."
          setup_api_calls:
            - call: "POST /gates"
              payload: { code: "E1", terminal: "T1", max_wingspan_m: 80, buffer_minutes: 10 }
              as: OpsAdmin
              captures: { g1_id: $.data.id, g1_v: $.data.version }
            - call: "POST /ground-equipment"
              payload: { asset_tag: "GPU-1", equipment_type: "GPU", turnaround_minutes: 0 }
              as: OpsAdmin
              captures: { gse_id: $.data.id }
            - call: "POST /flights"
              payload: { flight_no: "AF5", aircraft_wingspan_m: 60, sched_arrival_utc: "2026-06-10T08:00:00Z", sched_departure_utc: "2026-06-10T10:00:00Z", min_turn_minutes: 45 }
              as: OpsAdmin
              captures: { f1_id: $.data.id }
            - call: "POST /flights/${f1_id}/activate"
              payload: {}
              as: OpsAdmin
            - call: "POST /gate-assignments"
              payload: { flight_id: "${f1_id}", stand_type: "GATE", gate_id: "${g1_id}", start_utc: "2026-06-10T08:00:00Z", end_utc: "2026-06-10T10:00:00Z", expected_gate_version: "${g1_v}" }
              as: GateController
              captures: { ga1_id: $.data.id }
            - call: "POST /gate-assignments/${ga1_id}/occupy"
              payload: {}
              as: RampAgent
            - call: "POST /slot-permits"
              payload: { flight_id: "${f1_id}", movement_type: "ARRIVAL", slot_time_utc: "2026-06-10T08:00:00Z", tolerance_minutes: 15 }
              as: SlotCoordinator
              captures: { sp1_id: $.data.id }
            - call: "POST /slot-permits/${sp1_id}/confirm"
              payload: {}
              as: SlotCoordinator
            - call: "POST /gse-allocations"
              payload: { flight_id: "${f1_id}", equipment_id: "${gse_id}", start_utc: "2026-06-10T08:00:00Z", end_utc: "2026-06-10T09:00:00Z" }
              as: RampAgent
              captures: { gsa_id: $.data.id }
          trigger:
            - call: "POST /flights/${f1_id}/irops-cancel"
              payload: {}
              as: OpsAdmin
              captures: { f1_sched: $.data.schedule_status }
          assert:
            - "Flight.${f1_id}.schedule_status == CANCELLED"
            - "GateAssignment.${ga1_id}.status == CANCELLED"
            - "Gate.${g1_id}.active_assignment_count == 0"
            - "SlotPermit.${sp1_id}.status == FORFEITED"
            - "GseAllocation.${gsa_id}.status == CANCELLED"

      - name: irops_divert_cascade_depth2
        grounds:
          - state_machines.Flight.ACTIVE_to_DIVERTED
          - state_machines.GateAssignment.OCCUPIED_to_RELEASED
          - entities.Gate.fields.active_assignment_count
        distinguishing_aspect: |
          DEPTH-2 cascade from a DIFFERENT trigger (POST /flights/{id}/irops-divert): hop1
          flight->DIVERTED forces its PLANNED/OCCUPIED assignments to RELEASED; hop2 each released
          assignment decrements its stand counter. Distinct from irops-cancel: slots are kept (not
          forfeited), so this is a different propagation pattern.
        test_recipe:
          setup:
            - "Flight F1 ACTIVE, occupying Gate G1 (OCCUPIED assignment), with a CONFIRMED SlotPermit that must survive the divert."
          setup_api_calls:
            - call: "POST /gates"
              payload: { code: "E2", terminal: "T1", max_wingspan_m: 80, buffer_minutes: 10 }
              as: OpsAdmin
              captures: { g1_id: $.data.id, g1_v: $.data.version }
            - call: "POST /flights"
              payload: { flight_no: "AF6", aircraft_wingspan_m: 60, sched_arrival_utc: "2026-06-10T08:00:00Z", sched_departure_utc: "2026-06-10T10:00:00Z", min_turn_minutes: 45 }
              as: OpsAdmin
              captures: { f1_id: $.data.id }
            - call: "POST /flights/${f1_id}/activate"
              payload: {}
              as: OpsAdmin
            - call: "POST /gate-assignments"
              payload: { flight_id: "${f1_id}", stand_type: "GATE", gate_id: "${g1_id}", start_utc: "2026-06-10T08:00:00Z", end_utc: "2026-06-10T10:00:00Z", expected_gate_version: "${g1_v}" }
              as: GateController
              captures: { ga1_id: $.data.id }
            - call: "POST /gate-assignments/${ga1_id}/occupy"
              payload: {}
              as: RampAgent
            - call: "POST /slot-permits"
              payload: { flight_id: "${f1_id}", movement_type: "ARRIVAL", slot_time_utc: "2026-06-10T08:00:00Z", tolerance_minutes: 15 }
              as: SlotCoordinator
              captures: { sp1_id: $.data.id }
            - call: "POST /slot-permits/${sp1_id}/confirm"
              payload: {}
              as: SlotCoordinator
          trigger:
            - call: "POST /flights/${f1_id}/irops-divert"
              payload: {}
              as: OpsAdmin
              captures: { f1_sched: $.data.schedule_status }
          assert:
            - "Flight.${f1_id}.schedule_status == DIVERTED"
            - "GateAssignment.${ga1_id}.status == RELEASED"
            - "Gate.${g1_id}.active_assignment_count == 0"
            - "SlotPermit.${sp1_id}.status == CONFIRMED"

  # =========================================================================
  # Rule 5 — priority_pair_validation_conflict (>= 2 instances, diff category pairs)
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: cross_state_beats_business_temporal_turn_time
        grounds:
          - validations[priority=6]
          - validations[priority=13]
          - entities.Gate.fields.status
        distinguishing_aspect: |
          Category pair (state cross-guard @ priority 6) vs (business_temporal turn-time @ priority 13):
          a single POST /gate-assignments that BOTH targets an OUT_OF_SERVICE gate AND supplies a
          turn-time-short 30-minute window (< min_turn 45) must surface ERR_CROSS_STATE_BLOCKED (the
          higher-priority cross-state check), never ERR_TURN_TIME_TOO_SHORT.
        test_recipe:
          setup:
            - "Gate G1 taken OUT_OF_SERVICE; Flight F1 with min_turn 45; the create window 10:00->10:30 is only 30 minutes (turn-time short)."
            - "Both the cross-state guard (gate not ACTIVE) and the turn-time check would fail; priority 6 must win."
          setup_api_calls:
            - call: "POST /gates"
              payload: { code: "F1", terminal: "T1", max_wingspan_m: 80, buffer_minutes: 10 }
              as: OpsAdmin
              captures: { g1_id: $.data.id, g1_v: $.data.version }
            - call: "POST /gates/${g1_id}/out-of-service"
              payload: {}
              as: OpsAdmin
              captures: { g1_v2: $.data.version }
            - call: "POST /flights"
              payload: { flight_no: "QF2", aircraft_wingspan_m: 60, sched_arrival_utc: "2026-06-10T10:00:00Z", sched_departure_utc: "2026-06-10T10:30:00Z", min_turn_minutes: 45 }
              as: OpsAdmin
              captures: { f1_id: $.data.id }
          trigger:
            - call: "POST /gate-assignments"
              payload: { flight_id: "${f1_id}", stand_type: "GATE", gate_id: "${g1_id}", start_utc: "2026-06-10T10:00:00Z", end_utc: "2026-06-10T10:30:00Z", expected_gate_version: "${g1_v2}" }
              as: GateController
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_CROSS_STATE_BLOCKED"
            - "http status == 409"

      - name: existence_beats_business_constraint_wingspan
        grounds:
          - validations[priority=3]
          - validations[priority=7]
          - validations[priority=4]
        distinguishing_aspect: |
          Category pair (existence @ priority 3) vs (business_constraint wingspan @ priority 7): a
          create that references a non-existent gate_id AND an oversize wingspan must return
          ERR_NOT_FOUND (existence wins), never ERR_WINGSPAN_EXCEEDED — a different pair than the
          state-vs-business_temporal conflict above.
        test_recipe:
          setup:
            - "Flight F1 with a large wingspan exists; no gate with the referenced id exists."
          setup_api_calls:
            - call: "POST /flights"
              payload: { flight_no: "NZ8", aircraft_wingspan_m: 95, sched_arrival_utc: "2026-06-10T08:00:00Z", sched_departure_utc: "2026-06-10T10:00:00Z", min_turn_minutes: 45 }
              as: OpsAdmin
              captures: { f1_id: $.data.id }
          trigger:
            - call: "POST /gate-assignments"
              payload: { flight_id: "${f1_id}", stand_type: "GATE", gate_id: "00000000-0000-4000-8000-000000000000", start_utc: "2026-06-10T08:00:00Z", end_utc: "2026-06-10T10:00:00Z" }
              as: GateController
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NOT_FOUND"
            - "http status == 404"

  # =========================================================================
  # Rule 6 — boundary_precision_check (>= 2 instances, diff metrics + endpoints)
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: turn_time_exact_min_passes_one_under_fails
        grounds:
          - calculations.turn_time_feasibility
          - validations[priority=13]
          - entities.Flight.fields.min_turn_minutes
        distinguishing_aspect: |
          NUMERIC threshold (>=) on POST /gate-assignments: occupancy_minutes == min_turn (45) PASSES,
          occupancy_minutes == min_turn-1 (44) FAILS with ERR_TURN_TIME_TOO_SHORT. This instance pins
          the 44-minute failing side of the boundary.
        test_recipe:
          setup:
            - "Gate G1; Flight F1 with min_turn_minutes=45; a 44-minute window (10:00->10:44) is one minute under the floor."
          setup_api_calls:
            - call: "POST /gates"
              payload: { code: "G1", terminal: "T1", max_wingspan_m: 80, buffer_minutes: 10 }
              as: OpsAdmin
              captures: { g1_id: $.data.id, g1_v: $.data.version }
            - call: "POST /flights"
              payload: { flight_no: "EK4", aircraft_wingspan_m: 60, sched_arrival_utc: "2026-06-10T10:00:00Z", sched_departure_utc: "2026-06-10T10:44:00Z", min_turn_minutes: 45 }
              as: OpsAdmin
              captures: { f1_id: $.data.id }
          trigger:
            - call: "POST /gate-assignments"
              payload: { flight_id: "${f1_id}", stand_type: "GATE", gate_id: "${g1_id}", start_utc: "2026-06-10T10:00:00Z", end_utc: "2026-06-10T10:44:00Z", expected_gate_version: "${g1_v}" }
              as: GateController
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_TURN_TIME_TOO_SHORT"
            - "http status == 422"

      - name: slot_window_upper_boundary_inclusive_vs_one_past
        grounds:
          - calculations.slot_compliance_window
          - validations[priority=14]
          - state_machines.SlotPermit.CONFIRMED_to_USED
        distinguishing_aspect: |
          DIFFERENT metric (a clock-vs-window closed-interval boundary on a DIFFERENT endpoint
          POST /slot-permits/{id}/redeem): clock at 12:16 is one minute past the inclusive upper bound
          12:15 of window [11:45,12:15] and must fail with ERR_SLOT_WINDOW_MISSED (the permit stays
          CONFIRMED). Distinct from the numeric turn-time boundary above.
        test_recipe:
          setup:
            - "Flight F1; ARRIVAL SlotPermit at 12:00 tol 15 confirmed; clock set to 12:16:00Z (one minute past upper bound)."
          setup_api_calls:
            - call: "POST /flights"
              payload: { flight_no: "SQ6", aircraft_wingspan_m: 50, sched_arrival_utc: "2026-06-10T12:00:00Z", sched_departure_utc: "2026-06-10T13:00:00Z" }
              as: OpsAdmin
              captures: { f1_id: $.data.id }
            - call: "POST /slot-permits"
              payload: { flight_id: "${f1_id}", movement_type: "ARRIVAL", slot_time_utc: "2026-06-10T12:00:00Z", tolerance_minutes: 15 }
              as: SlotCoordinator
              captures: { sp1_id: $.data.id }
            - call: "POST /slot-permits/${sp1_id}/confirm"
              payload: {}
              as: SlotCoordinator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T12:16:00Z" }
              as: OpsAdmin
          trigger:
            - call: "POST /slot-permits/${sp1_id}/redeem"
              payload: {}
              as: SlotCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_SLOT_WINDOW_MISSED"
            - "http status == 422"
            - "SlotPermit.${sp1_id}.status == CONFIRMED"

  # =========================================================================
  # Rule 7 — cross_entity_state_dependency (>= 2 instances, diff entity pairs)
  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: occupy_blocked_when_gate_out_of_service
        grounds:
          - validations[priority=6]
          - state_machines.GateAssignment.PLANNED_to_OCCUPIED
          - entities.Gate.fields.status
        distinguishing_aspect: |
          ENTITY PAIR GateAssignment -> Gate: a GateAssignment cannot move PLANNED->OCCUPIED while its
          Gate is OUT_OF_SERVICE; the assignment's valid transition depends on the Gate's state, yielding
          ERR_CROSS_STATE_BLOCKED.
        test_recipe:
          setup:
            - "Gate G1 with a PLANNED assignment for Flight F1; G1 then taken OUT_OF_SERVICE before occupy."
          setup_api_calls:
            - call: "POST /gates"
              payload: { code: "H1", terminal: "T1", max_wingspan_m: 80, buffer_minutes: 10 }
              as: OpsAdmin
              captures: { g1_id: $.data.id, g1_v: $.data.version }
            - call: "POST /flights"
              payload: { flight_no: "BA22", aircraft_wingspan_m: 60, sched_arrival_utc: "2026-06-10T08:00:00Z", sched_departure_utc: "2026-06-10T10:00:00Z", min_turn_minutes: 45 }
              as: OpsAdmin
              captures: { f1_id: $.data.id }
            - call: "POST /gate-assignments"
              payload: { flight_id: "${f1_id}", stand_type: "GATE", gate_id: "${g1_id}", start_utc: "2026-06-10T08:00:00Z", end_utc: "2026-06-10T10:00:00Z", expected_gate_version: "${g1_v}" }
              as: GateController
              captures: { ga1_id: $.data.id }
            - call: "POST /gates/${g1_id}/out-of-service"
              payload: {}
              as: OpsAdmin
          trigger:
            - call: "POST /gate-assignments/${ga1_id}/occupy"
              payload: {}
              as: RampAgent
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_CROSS_STATE_BLOCKED"
            - "http status == 409"

      - name: complete_blocked_until_handling_departed
        grounds:
          - validations[priority=6]
          - state_machines.Flight.ACTIVE_to_COMPLETED
          - entities.Flight.fields.handling_status
        distinguishing_aspect: |
          DIFFERENT entity pair Flight(schedule axis) -> Flight(handling axis): the schedule
          ACTIVE->COMPLETED transition is gated on the flight's OWN handling_status == DEPARTED. With
          handling still AT_GATE, /complete must return ERR_CROSS_STATE_BLOCKED — a cross-axis guard
          distinct from the GateAssignment->Gate pair above.
        test_recipe:
          setup:
            - "Flight F1 ACTIVE, occupying Gate G1 (handling_status AT_GATE, not yet DEPARTED)."
          setup_api_calls:
            - call: "POST /gates"
              payload: { code: "H2", terminal: "T1", max_wingspan_m: 80, buffer_minutes: 10 }
              as: OpsAdmin
              captures: { g1_id: $.data.id, g1_v: $.data.version }
            - call: "POST /flights"
              payload: { flight_no: "BA23", aircraft_wingspan_m: 60, sched_arrival_utc: "2026-06-10T08:00:00Z", sched_departure_utc: "2026-06-10T10:00:00Z", min_turn_minutes: 45 }
              as: OpsAdmin
              captures: { f1_id: $.data.id }
            - call: "POST /flights/${f1_id}/activate"
              payload: {}
              as: OpsAdmin
            - call: "POST /gate-assignments"
              payload: { flight_id: "${f1_id}", stand_type: "GATE", gate_id: "${g1_id}", start_utc: "2026-06-10T08:00:00Z", end_utc: "2026-06-10T10:00:00Z", expected_gate_version: "${g1_v}" }
              as: GateController
              captures: { ga1_id: $.data.id }
            - call: "POST /gate-assignments/${ga1_id}/occupy"
              payload: {}
              as: RampAgent
          trigger:
            - call: "POST /flights/${f1_id}/complete"
              payload: {}
              as: OpsAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_CROSS_STATE_BLOCKED"
            - "http status == 409"

  # =========================================================================
  # Rule 8 — resource_temporal_overlap (>= 2 instances, diff interval semantics + entities)
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: gate_two_sided_buffer_overlap_on_gate
        grounds:
          - calculations.gate_window_conflict
          - validations[priority=8]
          - entities.Gate.fields.buffer_minutes
        distinguishing_aspect: |
          INTERVAL SEMANTICS: half-open base interval with a TWO-SIDED buffer on the Gate resource. A
          new window whose gap to the existing one is strictly less than buffer_minutes is rejected
          (ERR_GATE_WINDOW_CONFLICT). Differs geometrically from the remote-stand closed/capacity rule.
        test_recipe:
          setup:
            - "Gate G1 buffer 10; F1 occupies [10:00,10:45); F2 attempts [10:50,11:30) — 5-minute gap < buffer 10."
          setup_api_calls:
            - call: "POST /gates"
              payload: { code: "I1", terminal: "T1", max_wingspan_m: 80, buffer_minutes: 10 }
              as: OpsAdmin
              captures: { g1_id: $.data.id, g1_v: $.data.version }
            - call: "POST /flights"
              payload: { flight_no: "WN1", aircraft_wingspan_m: 60, sched_arrival_utc: "2026-06-10T10:00:00Z", sched_departure_utc: "2026-06-10T10:45:00Z", min_turn_minutes: 45 }
              as: OpsAdmin
              captures: { f1_id: $.data.id }
            - call: "POST /gate-assignments"
              payload: { flight_id: "${f1_id}", stand_type: "GATE", gate_id: "${g1_id}", start_utc: "2026-06-10T10:00:00Z", end_utc: "2026-06-10T10:45:00Z", expected_gate_version: "${g1_v}" }
              as: GateController
              captures: { ga1_id: $.data.id }
            - call: "GET /gates/${g1_id}"
              as: GateController
              captures: { g1_v2: $.data.version }
            - call: "POST /flights"
              payload: { flight_no: "WN2", aircraft_wingspan_m: 60, sched_arrival_utc: "2026-06-10T10:50:00Z", sched_departure_utc: "2026-06-10T11:30:00Z", min_turn_minutes: 40 }
              as: OpsAdmin
              captures: { f2_id: $.data.id }
          trigger:
            - call: "POST /gate-assignments"
              payload: { flight_id: "${f2_id}", stand_type: "GATE", gate_id: "${g1_id}", start_utc: "2026-06-10T10:50:00Z", end_utc: "2026-06-10T11:30:00Z", expected_gate_version: "${g1_v2}" }
              as: GateController
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_GATE_WINDOW_CONFLICT"
            - "http status == 409"

      - name: remote_stand_closed_interval_capacity_overflow
        grounds:
          - calculations.remote_stand_capacity_overlap
          - validations[priority=11]
          - entities.RemoteStand.fields.capacity
        distinguishing_aspect: |
          DIFFERENT interval semantics on a DIFFERENT resource (RemoteStand): CLOSED intervals (touching
          endpoints collide) with an aggregate capacity of 1 — a second REMOTE window adjacent at the
          endpoint (11:00) to an existing [10:00,11:00] window overflows capacity and is rejected with
          ERR_REMOTE_STAND_FULL. No buffer; closed-vs-half-open is the geometric difference.
        test_recipe:
          setup:
            - "RemoteStand R1 capacity 1; F1 holds [10:00,11:00] (PLANNED); F2 attempts [11:00,12:00] — closed adjacency collides."
          setup_api_calls:
            - call: "POST /remote-stands"
              payload: { code: "R9", max_wingspan_m: 80, capacity: 1 }
              as: OpsAdmin
              captures: { r1_id: $.data.id }
            - call: "POST /flights"
              payload: { flight_no: "AS1", aircraft_wingspan_m: 60, sched_arrival_utc: "2026-06-10T10:00:00Z", sched_departure_utc: "2026-06-10T11:00:00Z", min_turn_minutes: 45 }
              as: OpsAdmin
              captures: { f1_id: $.data.id }
            - call: "POST /gate-assignments"
              payload: { flight_id: "${f1_id}", stand_type: "REMOTE", remote_stand_id: "${r1_id}", start_utc: "2026-06-10T10:00:00Z", end_utc: "2026-06-10T11:00:00Z" }
              as: GateController
              captures: { ga1_id: $.data.id }
            - call: "POST /flights"
              payload: { flight_no: "AS2", aircraft_wingspan_m: 60, sched_arrival_utc: "2026-06-10T11:00:00Z", sched_departure_utc: "2026-06-10T12:00:00Z", min_turn_minutes: 45 }
              as: OpsAdmin
              captures: { f2_id: $.data.id }
          trigger:
            - call: "POST /gate-assignments"
              payload: { flight_id: "${f2_id}", stand_type: "REMOTE", remote_stand_id: "${r1_id}", start_utc: "2026-06-10T11:00:00Z", end_utc: "2026-06-10T12:00:00Z" }
              as: GateController
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_REMOTE_STAND_FULL"
            - "http status == 409"

  # =========================================================================
  # Rule 9 — compensating_invariant (>= 2 instances, diff conserved quantities)
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: stand_occupancy_conserved_across_occupy_release
        grounds:
          - state_machines.GateAssignment.PLANNED_to_OCCUPIED
          - state_machines.GateAssignment.OCCUPIED_to_RELEASED
          - entities.Gate.fields.active_assignment_count
        distinguishing_aspect: |
          CONSERVED QUANTITY #1 = global stand-occupancy (Gate.active_assignment_count). OCCUPY (+1)
          paired with its compensating DEPART/RELEASE (-1) leaves Gate.active_assignment_count exactly
          equal to its pre-OCCUPY value (0). Pinned formula: net change == 0.
        test_recipe:
          setup:
            - "Gate G1 (active_assignment_count starts 0); Flight F1 assigned, occupied, then departed."
          setup_api_calls:
            - call: "POST /gates"
              payload: { code: "J1", terminal: "T1", max_wingspan_m: 80, buffer_minutes: 10 }
              as: OpsAdmin
              captures: { g1_id: $.data.id, g1_v: $.data.version }
            - call: "POST /flights"
              payload: { flight_no: "DL2", aircraft_wingspan_m: 60, sched_arrival_utc: "2026-06-10T08:00:00Z", sched_departure_utc: "2026-06-10T10:00:00Z", min_turn_minutes: 45 }
              as: OpsAdmin
              captures: { f1_id: $.data.id }
            - call: "POST /gate-assignments"
              payload: { flight_id: "${f1_id}", stand_type: "GATE", gate_id: "${g1_id}", start_utc: "2026-06-10T08:00:00Z", end_utc: "2026-06-10T10:00:00Z", expected_gate_version: "${g1_v}" }
              as: GateController
              captures: { ga1_id: $.data.id }
            - call: "POST /gate-assignments/${ga1_id}/occupy"
              payload: {}
              as: RampAgent
          trigger:
            - call: "POST /gate-assignments/${ga1_id}/depart"
              payload: {}
              as: RampAgent
              captures: { ga1_status: $.data.status }
          assert:
            - "GateAssignment.${ga1_id}.status == RELEASED"
            - "Gate.${g1_id}.active_assignment_count == 0"

      - name: tow_target_occupancy_conserved_across_tow_return
        grounds:
          - state_machines.GateAssignment.OCCUPIED_to_TOWED_AWAY
          - state_machines.GateAssignment.TOWED_AWAY_to_OCCUPIED
          - entities.RemoteStand.fields.occupancy_count
        distinguishing_aspect: |
          CONSERVED QUANTITY #2 = a single tow-target RemoteStand.occupancy_count (a different quantity
          than the global gate-occupancy sum). TOW (+1 on R1) paired with its compensating RETURN (-1 on
          R1) leaves R1.occupancy_count exactly at its pre-tow value (0), with no drift on the remote stand.
        test_recipe:
          setup:
            - "Gate G1, RemoteStand R1 (occupancy_count 0); F1 occupied at G1, towed to R1 (R1=1), then returned (R1 back to 0)."
          setup_api_calls:
            - call: "POST /gates"
              payload: { code: "J2", terminal: "T1", max_wingspan_m: 80, buffer_minutes: 10 }
              as: OpsAdmin
              captures: { g1_id: $.data.id, g1_v: $.data.version }
            - call: "POST /remote-stands"
              payload: { code: "R10", max_wingspan_m: 80, capacity: 1 }
              as: OpsAdmin
              captures: { r1_id: $.data.id }
            - call: "POST /flights"
              payload: { flight_no: "DL3", aircraft_wingspan_m: 60, sched_arrival_utc: "2026-06-10T08:00:00Z", sched_departure_utc: "2026-06-10T12:00:00Z", min_turn_minutes: 45 }
              as: OpsAdmin
              captures: { f1_id: $.data.id }
            - call: "POST /gate-assignments"
              payload: { flight_id: "${f1_id}", stand_type: "GATE", gate_id: "${g1_id}", start_utc: "2026-06-10T08:00:00Z", end_utc: "2026-06-10T12:00:00Z", expected_gate_version: "${g1_v}" }
              as: GateController
              captures: { ga1_id: $.data.id }
            - call: "POST /gate-assignments/${ga1_id}/occupy"
              payload: {}
              as: RampAgent
            - call: "POST /gate-assignments/${ga1_id}/tow"
              payload: { target_remote_stand_id: "${r1_id}" }
              as: GateController
          trigger:
            - call: "POST /gate-assignments/${ga1_id}/return"
              payload: {}
              as: GateController
              captures: { ga1_status: $.data.status }
          assert:
            - "GateAssignment.${ga1_id}.status == OCCUPIED"
            - "RemoteStand.${r1_id}.occupancy_count == 0"
