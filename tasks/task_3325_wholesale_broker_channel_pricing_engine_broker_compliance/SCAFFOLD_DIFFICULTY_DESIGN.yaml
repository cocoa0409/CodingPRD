  # ===========================================================================
  # Rule 4 — transitive cascade chains from different triggers
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: license_revocation_cascade_to_loan_stage_and_escalation
        grounds:
          - state_machines.BrokerLicense.transitions.ACTIVE_to_REVOKED
          - state_machines.LoanSubmission.transitions.SUBMITTED_to_UNDERWRITING
          - state_machines.TurnTimeEscalation.transitions.RESOLVED_to_OPEN
          - entities.LoanSubmission.fields.status
          - entities.Broker.fields.total_active_compensation_commitment_cents
        distinguishing_aspect: "Depth-3 cascade originating at license revocation: revocation (A) mutates the affected loan to SUSPENDED_REVIEW (B), which itself decrements the broker's compensation commitment and reopens that loan's resolved escalation (C) — each hop caused only by the hop before it."
        test_recipe:
          setup:
            - "Logical clock 2026-09-30T00:00:00Z. Broker B7 APPROVED with a CA license, one loan of 40000000 cents in UNDERWRITING on a CA property, and one previously RESOLVED underwriting-stage escalation on that loan."
