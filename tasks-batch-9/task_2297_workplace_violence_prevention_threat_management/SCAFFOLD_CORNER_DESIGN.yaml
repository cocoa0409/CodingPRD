        grounds:
          - calculations.plan_compliance_metrics
          - state_machines.HazardAssessment.SCREENING_to_SUPERSEDED
          - entities.PreventionPlan.fields.hazard_coverage_pct
          - entities.PreventionPlan.fields.unmitigated_hazard_count
          - endpoints[POST /hazard-assessments]
        distinguishing_aspect: |
          covered_areas counts DISTINCT work_area_id among non-SUPERSEDED assessments, so re-assessing
          the same area neither raises coverage above 50.00 nor double-counts the unmitigated TIER_1
          hazard: the input set shrinks by one superseded row and grows by one live row at the same
          instant.
