  - section: endpoints
    instances:
      - name: ep_apply_substitution_reprices_order
        claim_type: side_effect_execution
        grounds:
          - 'endpoints."POST /substitution-approvals/{id}/apply"'
          - calculations.substitution_credit
        distinguishing_aspect: "Apply rewrites the line species, recomputes the line price from the substitute's selected quote, and credits the order: (1200 - 1000) x 20.00 = 4000 cents off a 24000 total -> 20000."
        test_recipe:
          setup:
            - "COD GRADE_A quote 1200 PUBLISHED; POLLOCK (same group GADOID) GRADE_A quote 1000 PUBLISHED"
            - "CONFIRMED order, COD line 20.00 kg allow_substitution true, total 24000"
            - "Substitution REQUESTED and APPROVED"
          setup_api_calls:
            - { call: "POST /species", payload: { species_code: "COD", common_name: "Atlantic Cod", labeling_name: "Cod", substitution_group: "GADOID", fresh_shelf_life_hours: 72, frozen_shelf_life_days: 30 }, as: OperationsManager, captures: { sp1_id: $.data.id, sp1_v: $.data.version } }
            - { call: "POST /market-quotes", payload: { species_id: "${sp1_id}", grade: "GRADE_A", quote_date: "2026-08-01", price_per_kg_cents: 1200 }, as: OperationsManager, captures: { q1_id: $.data.id } }
            - { call: "POST /market-quotes/${q1_id}/publish", payload: { expected_species_version: "${sp1_v}" }, as: OperationsManager }
            - { call: "POST /species", payload: { species_code: "POLLOCK", common_name: "Pollock", labeling_name: "Pollock", substitution_group: "GADOID", fresh_shelf_life_hours: 72, frozen_shelf_life_days: 30 }, as: OperationsManager, captures: { sp2_id: $.data.id, sp2_v: $.data.version } }
            - { call: "POST /market-quotes", payload: { species_id: "${sp2_id}", grade: "GRADE_A", quote_date: "2026-08-01", price_per_kg_cents: 1000 }, as: OperationsManager, captures: { q2_id: $.data.id } }
            - { call: "POST /market-quotes/${q2_id}/publish", payload: { expected_species_version: "${sp2_v}" }, as: OperationsManager }
            - { call: "POST /customers", payload: { business_name: "Resto Group", credit_limit_cents: 1000000 }, as: OperationsManager, captures: { c_id: $.data.id } }
            - { call: "POST /sales-orders", payload: { customer_id: "${c_id}", required_delivery_date: "2026-08-05" }, as: Customer, as_user_id: "${c_id}", captures: { o_id: $.data.id } }
            - { call: "POST /order-lines", payload: { sales_order_id: "${o_id}", species_id: "${sp1_id}", requested_grade: "GRADE_A", requested_qty_kg: 20.00, allow_substitution: true }, as: Customer, as_user_id: "${c_id}", captures: { ol_id: $.data.id } }
            - { call: "POST /sales-orders/${o_id}/submit", payload: {}, as: Customer, as_user_id: "${c_id}" }
            - { call: "POST /sales-orders/${o_id}/confirm", payload: {}, as: OperationsManager }
            - { call: "POST /substitution-approvals", payload: { order_line_id: "${ol_id}", substitute_species_id: "${sp2_id}" }, as: InventoryPlanner, captures: { sub_id: $.data.id } }
            - { call: "POST /substitution-approvals/${sub_id}/approve", payload: {}, as: ComplianceOfficer, as_user_id: "off_1" }
          trigger:
            - { call: "POST /substitution-approvals/${sub_id}/apply", payload: {}, as: InventoryPlanner, captures: { credit: $.data.price_credit_cents } }
          assert:
            - "SubstitutionApproval.${sub_id}.status == APPLIED and price_credit_cents == 4000"
            - "OrderLine.${ol_id}.species_id == ${sp2_id} and unit_price_cents == 1000 and line_total_cents == 20000"
            - "SalesOrder.${o_id}.total_cents == 20000 (24000 - 4000)"

      - name: ep_deliver_moves_committed_to_shipped
        claim_type: side_effect_execution
        grounds:
          - 'endpoints."POST /shipments/{id}/deliver"'
          - entities.InventoryLot.fields.shipped_weight_kg
        distinguishing_aspect: "Deliver consumes every COMMITTED allocation of the order into the shipped bucket and can DEPLETE the lot; the order itself is already FULFILLED and stays so."
        test_recipe:
          setup: ["Lot received exactly 20.00 kg (20.00 landed, yield 1.00); order line 20.00 kg fully COMMITTED -> order FULFILLED; shipment IN_TRANSIT"]
          setup_api_calls:
            - { call: "POST /vessels", payload: { vessel_name: "FV Aurora", registration_number: "REG-001", home_port: "Gloucester" }, as: OperationsManager, captures: { v_id: $.data.id } }
