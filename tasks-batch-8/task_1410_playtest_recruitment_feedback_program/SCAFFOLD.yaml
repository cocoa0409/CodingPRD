  # ---- incentive payouts ----
  - method: POST
    path: "/playtests/incentive-payouts"
    description: "Create a DRAFT payout for (study, participant). Computes amount_provisional_cents (provisional variant, frozen). Requires >= 1 ATTENDED booking in the study and no other non-VOID payout for the pair."
    roles: [IncentiveOfficer]
    code: 201
    input: [study_id, participant_id]
    output: IncentivePayout
    side_effects: ["amount_provisional_cents := incentive_amount(provisional)", "created_by_user_id := X-User-ID"]
  - method: GET
    path: "/playtests/incentive-payouts"
    description: "List payouts with optional filters."
    roles: [ResearchOpsAdmin, IncentiveOfficer]
    code: 200
    input: ["study_id?", "participant_id?", "status?", "limit?", "offset?"]
    output: IncentivePayout[]
    side_effects: []
  - method: GET
    path: "/playtests/incentive-payouts/{id}"
    description: "Fetch one payout."
    roles: [ResearchOpsAdmin, IncentiveOfficer]
    code: 200
    input: []
    output: IncentivePayout
    side_effects: []
  - method: POST
    path: "/playtests/incentive-payouts/{id}/submit"
    description: "DRAFT -> PENDING_APPROVAL."
    roles: [IncentiveOfficer]
    code: 200
    input: []
    output: IncentivePayout
    side_effects: ["IncentivePayout DRAFT -> PENDING_APPROVAL"]
  - method: POST
    path: "/playtests/incentive-payouts/{id}/approve"
    description: "PENDING_APPROVAL -> APPROVED. Recomputes amount_final_cents (final variant incl. no-show penalty), enforces creator != approver, participant not BANNED, and budget_commit (fiscal check evaluated last)."
    roles: [IncentiveOfficer]
    code: 200
    input: []
    output: IncentivePayout
    side_effects: ["amount_final_cents := incentive_amount(final)", "study.budget_committed_cents += amount_final_cents", "approved_by_user_id := X-User-ID"]
  - method: POST
    path: "/playtests/incentive-payouts/{id}/reject"
    description: "PENDING_APPROVAL -> REJECTED."
    roles: [IncentiveOfficer]
    code: 200
    input: [rejection_reason]
    output: IncentivePayout
    side_effects: ["IncentivePayout PENDING_APPROVAL -> REJECTED"]
  - method: POST
    path: "/playtests/incentive-payouts/{id}/resubmit"
    description: "REJECTED -> PENDING_APPROVAL (revision loop)."
    roles: [IncentiveOfficer]
    code: 200
    input: []
    output: IncentivePayout
    side_effects: ["IncentivePayout REJECTED -> PENDING_APPROVAL"]
  - method: POST
    path: "/playtests/incentive-payouts/{id}/issue"
    description: "APPROVED -> ISSUED. Enforces issuer != approver; increments study.budget_spent_cents."
    roles: [IncentiveOfficer]
    code: 200
    input: []
    output: IncentivePayout
    side_effects: ["IncentivePayout APPROVED -> ISSUED", "study.budget_spent_cents += amount_final_cents", "issued_by_user_id := X-User-ID"]

  # ---- breach cases ----
  - method: POST
    path: "/playtests/breach-cases"
    description: "Report a confidentiality breach (status REPORTED). Reporter identity recorded from headers."
    roles: [Moderator, Researcher]
    code: 201
    input: [participant_id, study_id, evidence_summary, severity]
    output: BreachCase
    side_effects: ["reported_by_user_id / reported_by_role := request headers"]
  - method: GET
    path: "/playtests/breach-cases"
    description: "List breach cases with optional filters."
    roles: [ResearchOpsAdmin, LegalCounsel, Researcher]
    code: 200
    input: ["participant_id?", "study_id?", "status?", "limit?", "offset?"]
    output: BreachCase[]
    side_effects: []
  - method: GET
    path: "/playtests/breach-cases/{id}"
    description: "Fetch one breach case."
    roles: [ResearchOpsAdmin, LegalCounsel, Researcher]
    code: 200
    input: []
    output: BreachCase
    side_effects: []
  - method: POST
    path: "/playtests/breach-cases/{id}/open-investigation"
    description: "REPORTED -> UNDER_INVESTIGATION. The opening LegalCounsel becomes adjudicator; the reporter cannot adjudicate."
    roles: [LegalCounsel]
    code: 200
    input: []
    output: BreachCase
    side_effects: ["BreachCase REPORTED -> UNDER_INVESTIGATION", "adjudicated_by_user_id := X-User-ID"]
  - method: POST
    path: "/playtests/breach-cases/{id}/substantiate"
    description: "UNDER_INVESTIGATION -> SUBSTANTIATED (adjudicator only). Applies risk_score weight and the suspension cascade (bookings cancelled + waitlist promotion; ISSUED keys revoked with exposure records)."
    roles: [LegalCounsel]
    code: 200
    input: []
    output: BreachCase
    side_effects: ["BreachCase -> SUBSTANTIATED", "risk_score += severity weight (cap 100)", "participant suspension cascade links 1-3"]
  - method: POST
    path: "/playtests/breach-cases/{id}/dismiss"
    description: "UNDER_INVESTIGATION -> DISMISSED (adjudicator only)."
    roles: [LegalCounsel]
    code: 200
    input: []
    output: BreachCase
    side_effects: ["BreachCase UNDER_INVESTIGATION -> DISMISSED"]
  - method: POST
    path: "/playtests/breach-cases/{id}/sanction"
    description: "SUBSTANTIATED -> SANCTIONED (adjudicator only). sanction_type BAN runs the full ban cascade; WARNING leaves the participant SUSPENDED."
    roles: [LegalCounsel]
    code: 200
    input: [sanction_type, "sanction_note?"]
    output: BreachCase
    side_effects: ["BreachCase SUBSTANTIATED -> SANCTIONED", "if BAN: participant -> BANNED + ban cascade"]

