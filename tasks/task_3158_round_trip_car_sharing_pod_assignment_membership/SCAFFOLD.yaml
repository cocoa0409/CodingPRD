scenario: |
  Round-Trip Car Sharing Pod Assignment & Membership Operations (Zipcar): membership application with driving record screening and approval before booking rights, vehicle pod placement across neighborhoods, campuses and airports with utilization-based rebalancing, hourly and daily reservation with mandatory return to the same pod and late-return penalties, fuel card and cleanliness standards enforced through member reporting and penalties, damage responsibility with a member fee and insurance layers, key card and app-based vehicle access with lockout troubleshooting, university and business account programs with department billing, maintenance scheduling around reservations

domain_name: "round-trip-car-sharing-pod-assignment-membership"
api_prefix: "/car-share"

complexity_profile:
  primary_archetype: "temporal windowing"
  secondary_archetype: "posture-driven gating"
  complexity_layers:
    - "optimistic concurrency"
    - "cascading side effects"
    - "dual-variant calculation"
    - "selector policy"
  entity_topology: "flat"
  state_machine_shape: "cyclic"
  relationship_patterns:
    - "one_to_many"
    - "many_to_many"
    - "cross_aggregate"
  role_model: "segregation_of_duties"
  consistency_model: "immediate"

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Member
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        required: true
        description: "Applicant or member legal name."
      - name: email
        type: string
        source: input
        required: true
        description: "Login identity; unique across all Members."
        constraints: "uniqueness: at most one Member per email"
      - name: kind
        type: enum
        source: input
        required: true
        description: "Member category; determines the damage insurance layer and the screening route."
        constraints: "one of {INDIVIDUAL, STUDENT, EMPLOYEE}"
      - name: application_status
        type: enum
        source: computed
        required: false
        description: "Membership application posture. Booking rights exist only in APPROVED."
        constraints: "one of {APPLIED, SCREENING, APPROVED, DECLINED}"
        default: "APPLIED"
      - name: screen_result
        type: enum
        source: computed
        required: false
        description: "Driving-record screening outcome, derived from the latest DrivingRecordReport decision."
        constraints: "one of {NONE, CLEAR, REFERRED, FAILED}"
        default: "NONE"
      - name: application_decided_at
        type: datetime
        source: computed
        required: false
        description: "Timestamp of the terminal APPROVED or DECLINED decision; used as the declared early-grade revert window anchor."
      - name: last_accident_fee_block
        type: integer
        source: input
        required: false
        description: "Server operator supplied history anchor: the 30-minute billing block index (0 = none) of the most recent at-fault damage incident. Used only as the C9 declared fallback when no Incident row exists."
        default: 0
      - name: strikes
        type: integer
        source: computed
        required: false
        description: "Count of terminal fuel-level, cleanliness or lockout violations recorded against this Member."
        default: 0
      - name: referral_invites
        type: integer
        source: computed
        required: false
        description: "Count of referral invitations consumed; each successful referral adds 10 to this field."
        default: 0
      - name: wallet_credit_cents
        type: integer
        source: computed
        required: false
        description: "Member wallet balance in cents; credited by penalties and debited by waived incident fees."
        default: 0
      - name: wallet_hold_cents
        type: integer
        source: computed
        required: false
        description: "Reserved-but-unspent wallet cents held against a reservation ledger; consumed by a late-return fine, then released and re-credited to wallet_credit_cents exactly once per reservation."
        default: 0

  - name: Account
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        required: true
        description: "Organization account display name."
      - name: type
        type: enum
        source: input
        required: true
        description: "Program type; drives billing posture and department billing."
        constraints: "one of {UNIVERSITY, BUSINESS}"
      - name: primary_member_id
        type: string
        source: input
        required: true
        description: "FK -> Member.id; the program administrator member who owns this account."
      - name: billing_email
        type: string
        source: input
        required: true
        description: "Department billing destination address."

  - name: Membership
    parent: null
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: input
        required: false
        description: "FK -> Account.id; omitted for an individual (unsponsored) membership"
      - name: member_id
        type: string
        source: input
        required: true
        description: "FK -> Member.id"
      - name: department_code
        type: string
        source: input
        required: false
        description: "Department billing code charged for this membership's reservations; UNSPONSORED for an individual membership."
        default: "UNSPONSORED"
      - name: tier
        type: enum
        source: input
        required: true
        description: "Membership tier; only PREMIUM waves the damage deductible."
        constraints: "one of {STANDARD, PLUS, PREMIUM, FROZEN}"
      - name: primary_flag
        type: boolean
        source: input
        required: true
        description: "Whether this membership is the member's primary (billable) membership; exactly one ACTIVE primary per member."
        default: false
      - name: status
        type: enum
        source: computed
        required: false
        description: "Membership lifecycle status; FROZEN blocks new bookings for the member."
        constraints: "one of {ACTIVE, SUSPENDED, FROZEN, CLOSED}"
        default: "ACTIVE"
      - name: status_before_freeze
        type: enum
        source: computed
        required: false
        description: "The ACTIVE or SUSPENDED status captured when the membership entered FROZEN; the C10 revert-to-preserved-status anchor."
        constraints: "one of {ACTIVE, SUSPENDED, NONE}"
      - name: membership_billing_cents
        type: integer
        source: computed
        required: false
        description: "The C12 billing total produced by the occupancy-fee derivation at membership creation."
        default: 0
      - name: residual_released_cents
        type: integer
        source: computed
        required: false
        description: "Cumulative wallet residual released by membership closes; the release-once anchor for the C11 conserved quantity."
        default: 0

  - name: Pod
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        required: true
        description: "Human readable pod name."
      - name: site_type
        type: enum
        source: input
        required: true
        description: "Placement class of this pod; drives fuel-level and utilization thresholds."
        constraints: "one of {NEIGHBORHOOD, CAMPUS, AIRPORT}"
      - name: capacity
        type: integer
        source: input
        required: true
        description: "Maximum number of Vehicle rows concurrently assigned to this pod; 0 means closed to placement."
        default: 0
      - name: utilization_score
        type: computed
        required: false
        description: "Aggregate utilization of the pod's non-retired vehicles at their current home pod; whitened derived field recomputed by every occupancy-changing side effect."
      - name: available_bays
        type: integer
        source: computed
        required: false
        description: "capacity minus the number of non-retired vehicles whose home pod is this pod; never negative."
      - name: fuel_floor_pct
        type: integer
        source: input
        required: false
        description: "Minimum acceptable fuel level at return, by site type; NEIGHBORHOOD 25, CAMPUS 20, AIRPORT 35."
        default: 25

  - name: Vehicle
    parent: Pod
    common_fields: true
    fields:
      - name: pod_id
        type: string
        source: input
        required: true
        description: "FK -> Pod.id; the home pod the vehicle must be returned to."
      - name: vin
        type: string
        source: input
        required: true
        description: "Vehicle identification number; unique across all Vehicles."
      - name: model
        type: string
        source: input
        required: true
        description: "Vehicle model label."
      - name: home_pod_id
        type: string
        source: input
        required: false
        description: "FK -> Pod.id; set to pod_id at creation and changed only by an approved relocation or a POD_ASSIGNED rebalance."
      - name: capacity_seats
        type: integer
        source: input
        required: true
        description: "Seating capacity."
      - name: odometer_miles
        type: integer
        source: computed
        required: false
        description: "Latest reported odometer; advanced by each return."
        default: 0
      - name: next_service_miles
        type: integer
        source: input
        required: false
        description: "Odometer value at which a COMPLETED maintenance order is due."
        default: 0
      - name: use_status
        type: enum
        source: computed
        required: false
        description: "Operational posture of the vehicle; only AVAILABLE permits a CONFIRMED reservation, and any non-AVAILABLE status freezes new reservations for the vehicle."
        constraints: "one of {AVAILABLE, RESERVED, IN_USE, CLEANING, MAINTENANCE, OUT_OF_SERVICE, RETIRED}"
        default: "AVAILABLE"
      - name: cleanliness_state
        type: enum
        source: computed
        required: false
        description: "Parallel posture dimension on the same row as use_status; independent of the use lifecycle."
        constraints: "one of {CLEAN, REPORTED_DIRTY, CLEANING, ESCALATED, SUSPENDED_FOR_CLEANLINESS}"
        default: "CLEAN"
      - name: fuel_level_pct
        type: integer
        source: computed
        required: false
        description: "Latest reported fuel level percentage; compared against the home pod's fuel_floor_pct at return."
        default: 100
      - name: last_known_odometer_at
        type: datetime
        source: computed
        required: false
        description: "Timestamp at which the current utilization anchor period began; the C5 anchor reset boundary."
      - name: charge_total_cents
        type: integer
        source: computed
        required: false
        description: "Charged amount produced by the C1 charge calculation for the vehicle's most recently returned reservation."

  - name: Reservation
    parent: null
    common_fields: true
    fields:
      - name: member_id
        type: string
        source: input
        required: true
        description: "FK -> Member.id; the booking member."
      - name: pod_id
        type: string
        source: input
        required: true
        description: "FK -> Pod.id; the booking (pickup) pod."
      - name: vehicle_id
        type: string
        source: input
        required: true
        description: "FK -> Vehicle.id"
      - name: reserved_hours
        type: integer
        source: input
        required: false
        description: "Length of the booked window in hours; 0 means a flat daily reservation."
        default: 0
      - name: start_at
        type: datetime
        source: input
        required: true
        description: "Planned start of the booked window."
      - name: end_at
        type: datetime
        source: input
        required: true
        description: "Planned end of the booked window; the late-return clock is measured from this instant."
      - name: returned_at
        type: datetime
        source: computed
        required: false
        description: "Instant at which the vehicle was returned; set by the RETURN transition."
      - name: returned_pod_id
        type: string
        source: computed
        required: false
        description: "FK -> Pod.id; the pod the vehicle was actually returned to. Must equal pod_id or the return is rejected."
      - name: status
        type: enum
        source: computed
        required: false
        description: "Reservation lifecycle status; reservation_at is measured from CONFIRMED."
        constraints: "one of {HELD, CONFIRMED, IN_USE, RETURNED, OVERDUE, CLOSED, CANCELLED, NO_SHOW}"
        default: "HELD"
      - name: reservation_at
        type: datetime
        source: computed
        required: false
        description: "Instant the reservation transitioned HELD to CONFIRMED; the C5 utilization anchor."
      - name: closed_at
        type: datetime
        source: computed
        required: false
        description: "Instant the reservation transitioned RETURNED to CLOSED; used as the C5 overflow fallback and as the residual-release anchor."
      - name: returned_odometer_miles
        type: integer
        source: input
        required: false
        description: "Odometer reading reported at return."
      - name: returned_fuel_level_pct
        type: integer
        source: input
        required: false
        description: "Fuel level reported at return."
      - name: contamination_level
        type: integer
        source: input
        required: false
        description: "Cleanliness severity 0-3 reported at return; 0 means no contamination reported."
        default: 0
      - name: charge_total_cents
        type: integer
        source: computed
        required: false
        description: "Amount charged by the C1 charge calculation, stored on the reservation. Distinct from Vehicle.charge_total_cents, which reflects whatever the vehicle's latest close produced."
      - name: late_minutes
        type: computed
        required: false
        description: "Whole minutes between end_at and returned_at; zero when the return is early."
      - name: status_before_overdue
        type: enum
        source: computed
        required: false
        description: "The CONFIRMED or IN_USE status captured when the reservation entered OVERDUE; the C10 revert-to-preserved-status anchor."
        constraints: "one of {CONFIRMED, IN_USE, NONE}"

  - name: Incident
    parent: null
    common_fields: true
    fields:
      - name: reservation_id
        type: string
        source: input
        required: true
        description: "FK -> Reservation.id; at most one active Incident per reservation."
      - name: vehicle_id
        type: string
        source: input
        required: true
        description: "FK -> Vehicle.id"
      - name: member_id
        type: string
        source: input
        required: true
        description: "FK -> Member.id; the member in whose possession the damage occurred."
      - name: assigned_driver_member_id
        type: string
        source: computed
        required: false
        description: "FK -> Member.id; the member responsible for damage found on return and therefore charged the damage fee. Null while the incident is OPEN."
      - name: incident_type
        type: enum
        source: input
        required: true
        description: "Incident class; only DAMAGE incidents carry a member fee and insurance layers."
        constraints: "one of {DAMAGE, MECHANICAL, THEFT}"
      - name: repair_cost_cents
        type: integer
        source: input
        required: false
        description: "Total repair cost in cents used as the input to the damage fee calculation."
      - name: damage_fee_estimate_cents
        type: integer
        source: computed
        required: false
        description: "Declared ESTIMATE fee variant: the member fee projected at incident opening."
      - name: member_damage_fee_cents
        type: integer
        source: computed
        required: false
        description: "Final damage fee of record produced by the C3 damage assessment."
      - name: insurance_layer
        type: enum
        source: computed
        required: false
        description: "Insurance layer applied, selected from the member's ACTIVE membership tier."
        constraints: "one of {NONE, STANDARD, PLUS, PREMIUM}"
      - name: fee_version
        type: integer
        source: computed
        required: false
        description: "Incremented each time the damage assessment is recomputed; the stale-reference anchor for party split."
        default: 0
      - name: damage_fee_charged
        type: boolean
        source: computed
        required: false
        description: "Whether the damage fee has been posted to the member ledger; posting is permitted exactly once per incident."
        default: false
      - name: status
        type: enum
        source: computed
        required: false
        description: "Incident lifecycle status."
        constraints: "one of {OPEN, ASSESSED, FEE_CHARGED, CLOSED}"
        default: "OPEN"
      - name: assigned_damage_block_position
        type: integer
        source: computed
        required: false
        description: "1-based 30-minute billing block index at which this incident occurred relative to the reservation window start; used by the C9 severity computation."
      - name: severity_score
        type: integer
        source: computed
        required: false
        description: "The C9 severity score that selects the SM-6 branch."
        default: 0
      - name: severity_fee_cents
        type: integer
        source: computed
        required: false
        description: "The C9 excess damage fee produced by the branch formula."
        default: 0

  - name: MaintenanceOrder
    parent: Vehicle
    common_fields: true
    fields:
      - name: vehicle_id
        type: string
        source: input
        required: true
        description: "FK -> Vehicle.id"
      - name: pod_id
        type: string
        source: input
        required: true
        description: "FK -> Pod.id; the pod the vehicle must reside at when this order is scheduled."
      - name: incident_id
        type: string
        source: input
        required: false
        description: "FK -> Incident.id; set when the order was raised from a DAMAGE incident."
      - name: reason
        type: string
        source: input
        required: true
        description: "Short reason code for the maintenance order."
      - name: blocking
        type: boolean
        source: input
        required: true
        description: "Whether this order freezes reservations for the vehicle."
        default: true
      - name: scheduled_start
        type: datetime
        source: input
        required: true
        description: "Start of the declared maintenance service window; the interval marks vehicle availability as unavailable and is half-open [scheduled_start, scheduled_end)."
      - name: scheduled_end
        type: datetime
        source: input
        required: true
        description: "End of the declared maintenance service window, exclusive."
      - name: status
        type: enum
        source: computed
        required: false
        description: "Maintenance order status."
        constraints: "one of {SCHEDULED, BLOCKED, IN_PROGRESS, COMPLETED, CANCELLED}"
        default: "SCHEDULED"
      - name: completed_at
        type: datetime
        source: computed
        required: false
        description: "Instant the order transitioned IN_PROGRESS to COMPLETED."
      - name: released_cents
        type: integer
        source: computed
        required: false
        description: "Sum of the C1 charges, measured after the membership discount, stored on the other reservations closed within the last 30 days for this vehicle; the C10 residual release anchor."
        default: 0

  - name: AccessEvent
    parent: Reservation
    common_fields: true
    fields:
      - name: reservation_id
        type: string
        source: input
        required: true
        description: "FK -> Reservation.id; the reservation whose access window this event belongs to."
      - name: member_id
        type: string
        source: input
        required: true
        description: "FK -> Member.id; the member who performed the access attempt."
      - name: vehicle_id
        type: string
        source: computed
        required: false
        description: "FK -> Vehicle.id; derived from the reservation's vehicle_id at event creation."
      - name: pod_id
        type: string
        source: computed
        required: false
        description: "FK -> Pod.id; derived from the vehicle's pod_id at event creation."
      - name: method
        type: enum
        source: input
        required: true
        description: "Access method attempted."
        constraints: "one of {KEY_CARD, APP}"
      - name: outcome
        type: enum
        source: computed
        required: false
        description: "Result of the access attempt."
        constraints: "one of {SUCCESS, FAILED, LOCKOUT_REPORTED}"
        default: "FAILED"
      - name: occurred_at
        type: datetime
        source: computed
        required: false
        description: "Server-stamped instant of the access attempt; the C5 and C6 window anchor."
      - name: auto_release_used
        type: boolean
        source: computed
        required: false
        description: "True when this event consumed one of the member's two auto-release allowances; only one allowance may be consumed per reservation."
        default: false
      - name: lockout_reported_at
        type: datetime
        source: computed
        required: false
        description: "Instant the FAILED event was escalated by the lockout report endpoint."

  - name: FuelCardTransaction
    parent: Reservation
    common_fields: true
    fields:
      - name: reservation_id
        type: string
        source: input
        required: true
        description: "FK -> Reservation.id"
      - name: vehicle_id
        type: string
        source: input
        required: true
        description: "FK -> Vehicle.id"
      - name: amount_cents
        type: integer
        source: input
        required: true
        description: "Fuel purchase amount charged to the vehicle's fuel card."
      - name: gallons_hundredths
        type: integer
        source: input
        required: true
        description: "Gallons purchased in hundredths of a gallon."
      - name: fuel_level_after_pct
        type: computed
        required: false
        description: "Fuel level percentage recorded after the purchase; set to the reported level of the transaction that follows it."
        default: 0
      - name: status
        type: enum
        source: computed
        required: false
        description: "Transaction status."
        constraints: "one of {POSTED, REVERSED}"
        default: "POSTED"

  - name: CommunitySignal
    parent: Pod
    common_fields: true
    fields:
      - name: pod_id
        type: string
        source: input
        required: true
        description: "FK -> Pod.id"
      - name: member_id
        type: string
        source: computed
        required: false
        description: "FK -> Member.id; the member who raised the signal."
      - name: reservation_id
        type: string
        source: computed
        required: false
        description: "FK -> Reservation.id; the reservation the signal relates to, when one is supplied."
      - name: signal_type
        type: enum
        source: input
        required: true
        description: "Signal class; CAMPUS signals are the only ones counted toward the C4 pod threshold."
        constraints: "one of {CAMPUS, CLEANLINESS, AVAILABILITY}"
      - name: message
        type: string
        source: input
        required: true
        description: "Free text description of the signal."
      - name: created_at_signal
        type: datetime
        source: computed
        required: false
        description: "Server-stamped instant the signal was raised; the C4 24-hour window anchor."

  - name: DrivingRecordReport
    parent: Member
    common_fields: true
    fields:
      - name: member_id
        type: string
        source: input
        required: true
        description: "FK -> Member.id"
      - name: license_state
        type: string
        source: input
        required: true
        description: "Issuing state of the reported driver licence."
      - name: license_years_held
        type: integer
        source: input
        required: true
        description: "Years the licence has been held; a value below the screening floor supports a REFERRED outcome."
      - name: report_status
        type: enum
        source: computed
        required: false
        description: "Report processing status; a SUBMITTED report is non-terminal and blocks a second submission."
        constraints: "one of {SUBMITTED, RECORDED}"
        default: "SUBMITTED"
      - name: report_decision
        type: enum
        source: computed
        required: false
        description: "Screeners decision written onto the report; drives Member.screen_result."
        constraints: "one of {NONE, CLEAR, REFERRED, FAILED}"
        default: "NONE"
      - name: screen_completed_at
        type: datetime
        source: computed
        required: false
        description: "Instant the report decision was recorded."

  - name: TierRestoreEntitlement
    parent: Membership
    common_fields: true
    fields:
      - name: membership_id
        type: string
        source: input
        required: true
        description: "FK -> Membership.id"
      - name: tier
        type: enum
        source: input
        required: true
        description: "The tier to restore when the membership thaws."
        constraints: "one of {STANDARD, PLUS, PREMIUM}"
      - name: reason
        type: string
        source: input
        required: true
        description: "Reason the restore entitlement was recorded."
      - name: restore_status
        type: enum
        source: computed
        required: false
        description: "Whether the entitlement may still be consumed; only a PENDING entitlement is honoured on thaw."
        constraints: "one of {PENDING, CONSUMED}"
        default: "PENDING"
      - name: consumed_at
        type: datetime
        source: computed
        required: false
        description: "Instant the entitlement was consumed by a thaw."

  - name: PodShiftBundle
    parent: null
    common_fields: true
    fields:
      - name: source_pod_id
        type: string
        source: input
        required: true
        description: "FK -> Pod.id"
      - name: dest_pod_id
        type: string
        source: input
        required: true
        description: "FK -> Pod.id"
      - name: scheduled_start
        type: datetime
        source: input
        required: true
        description: "Start of the relocation window; the interval is half-open [scheduled_start, scheduled_end)."
      - name: scheduled_end
        type: datetime
        source: input
        required: true
        description: "End of the relocation window, exclusive."
      - name: monthly_pods
        type: array
        source: input
        required: true
        description: "The ordered list of vehicle ids being relocated; the order is the declared relocation order and drives the C6 count."
      - name: bundle_fee_cents
        type: integer
        source: computed
        required: false
        description: "Charged relocation fee produced by the C6 calculation."
      - name: status
        type: enum
        source: computed
        required: false
        description: "Bundle status."
        constraints: "one of {APPLIED}"
        default: "APPLIED"

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  # ---- SM-1 Member.application_status : LINEAR pipeline -------------------
  - entity: Member
    initial_state: APPLIED
    terminal_states: [APPROVED, DECLINED]
    transitions:
      - from: APPLIED
        to: SCREENING
        trigger: "POST /car-share/members/{id}/driving-record-reports"
        actor: Member
        preconditions:
          - "applications_effecting_this_member: X-User-ID equals the target Member.id when X-User-Role is Member (ownership check, priority 2)"
          - "member.application_status == APPLIED"
        side_effects:
          - "create a DrivingRecordReport row for this member with report_status = SUBMITTED"
          - "increment Member.version by 1"
        note: "At most one non-terminal DrivingRecordReport may exist per member; a second submission while one is SUBMITTED is rejected with ERR_DRIVING_RECORD_PENDING."
      - from: SCREENING
        to: SCREENING
        trigger: "POST /car-share/members/{id}/driving-record-reports after a previous report was re-opened"
        actor: Member
        preconditions:
          - "member.application_status == SCREENING"
          - "the member has no DrivingRecordReport row with report_status == SUBMITTED"
        side_effects:
          - "create a DrivingRecordReport row for this member with report_status = SUBMITTED"
          - "increment Member.version by 1"
        note: "Self-loop: the pending-report precondition is what refuses a second submission while one is still SUBMITTED."
      - from: SCREENING
        to: APPROVED
        trigger: "POST /car-share/members/{id}/application-decision with decision == APPROVE"
        actor: PodOperator
        preconditions:
          - "member.application_status == SCREENING"
          - "the member's latest DrivingRecordReport has a recorded report_decision, i.e. Member.screen_result != NONE"
          - "Member.screen_result == CLEAR"
        side_effects:
          - "set Member.application_decided_at to the current logical clock value"
          - "when member.kind == INDIVIDUAL, create a Membership row with account_id = null, member_id = member.id, tier = STANDARD, primary_flag = true, status = ACTIVE"
          - "when member.kind IN {STUDENT, EMPLOYEE}, create no membership; the sponsored membership is created by POST /car-share/memberships under the member's Account"
          - "increment Member.version by 1"
      - from: SCREENING
        to: DECLINED
        trigger: "POST /car-share/members/{id}/application-decision with decision == DECLINE"
        actor: PodOperator
        preconditions:
          - "member.application_status == SCREENING"
          - "the member's latest DrivingRecordReport has a recorded report_decision, i.e. Member.screen_result != NONE"
        side_effects:
          - "set Member.application_decided_at to the current logical clock value"
          - "set every Membership row with member_id == member.id and status IN {ACTIVE, SUSPENDED} to status = CLOSED"
          - "increment Member.version by 1"
      - from: APPROVED
        to: SCREENING
        trigger: "POST /car-share/members/{id}/reopen-application (system early-grade revert)"
        actor: system
        preconditions:
          - "the current logical clock value is < member.application_decided_at + 24 hours"
          - "member.screen_result == CLEAR"
          - "member.strikes == 0"
          - "no Membership row with member_id == member.id exists that is referenced by a Reservation whose status is not CANCELLED"
        side_effects:
          - "set member.application_status = SCREENING"
          - "set every Membership row with member_id == member.id and status == ACTIVE to status = CLOSED"
          - "set member.application_decided_at = null"
          - "reset the member's latest DrivingRecordReport to report_status = SUBMITTED with report_decision = null"
          - "increment Member.version by 1"
        note: "Declared revert edge: the application may return to SCREENING within the 24-hour early-grade window only. Member.status_before_overdue-like preservation is not used here; the preserved anchor is the closed membership set."

  # ---- SM-2 Membership.status : CYCLIC with freeze/revert -----------------
  - entity: Membership
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /car-share/memberships/{id}/suspend"
        actor: PodOperator
        preconditions:
          - "membership.status == ACTIVE"
          - "membership.primary_flag == true"
        side_effects:
          - "increment Membership.version by 1"
        note: "SUSPENDED blocks new bookings by the member but leaves existing reservations intact."
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /car-share/memberships/{id}/reinstate"
        actor: PodOperator
        preconditions:
          - "membership.status == SUSPENDED"
        side_effects:
          - "increment Membership.version by 1"
      - from: ACTIVE
        to: FROZEN
        trigger: "POST /car-share/incidents/{id}/party-split (system freeze cascade)"
        actor: system
        preconditions:
          - "the incident's member has a membership with status IN {ACTIVE, SUSPENDED}"
        side_effects:
          - "set Membership.status_before_freeze = the status observed immediately before this transition"
          - "set Membership.status = FROZEN"
          - "set Membership.tier = FROZEN"
          - "set every Reservation row with member_id == membership.member_id and status IN {HELD, CONFIRMED} to status = CANCELLED"
          - "set the vehicle of every reservation cancelled by this hop to use_status = AVAILABLE"
          - "recompute Pod.utilization_score and Pod.available_bays for the pods of those vehicles"
          - "increment Membership.version by 1"
      - from: SUSPENDED
        to: FROZEN
        trigger: "POST /car-share/incidents/{id}/party-split (system freeze cascade)"
        actor: system
        preconditions:
          - "the incident's member has a membership with status IN {ACTIVE, SUSPENDED}"
        side_effects:
          - "set Membership.status_before_freeze = the status observed immediately before this transition"
          - "set Membership.status = FROZEN"
          - "set Membership.tier = FROZEN"
          - "set every Reservation row with member_id == membership.member_id and status IN {HELD, CONFIRMED} to status = CANCELLED"
          - "set the vehicle of every reservation cancelled by this hop to use_status = AVAILABLE"
          - "recompute Pod.utilization_score and Pod.available_bays for the pods of those vehicles"
          - "increment Membership.version by 1"
      - from: FROZEN
        to: ACTIVE
        trigger: "POST /car-share/memberships/{id}/thaw"
        actor: PodOperator
        preconditions:
          - "membership.status == FROZEN"
          - "the incident that was frozen on reached status CLOSED"
          - "membership.status_before_freeze in {ACTIVE, SUSPENDED}"
          - "membership.status_before_freeze == ACTIVE"
        side_effects:
          - "set Membership.status = ACTIVE"
          - "set Membership.status_before_freeze = NONE"
          - "when the membership has a TierRestoreEntitlement row with restore_status == PENDING, restore Membership.tier to that entitlement's tier, set that row's restore_status = CONSUMED and set its consumed_at to the current logical clock value"
          - "else set Membership.tier to STANDARD"
          - "increment Membership.version by 1"
      - from: FROZEN
        to: SUSPENDED
        trigger: "POST /car-share/memberships/{id}/thaw"
        actor: PodOperator
        preconditions:
          - "membership.status == FROZEN"
          - "the incident that was frozen on reached status CLOSED"
          - "membership.status_before_freeze == SUSPENDED"
        side_effects:
          - "set Membership.status = SUSPENDED"
          - "set Membership.status_before_freeze = NONE"
          - "increment Membership.version by 1"
        note: "The thaw target is the preserved status, never always-ACTIVE; a freeze taken from SUSPENDED thaws back to SUSPENDED."
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /car-share/memberships/{id}/close"
        actor: UniversityAccountAdmin
        preconditions:
          - "membership.status IN {ACTIVE, SUSPENDED}"
          - "the member has no Reservation row with status IN {HELD, CONFIRMED, IN_USE, OVERDUE}"
          - "at most one Membership row with member_id == membership.member_id has status == ACTIVE with primary_flag == true after this transition"
        side_effects:
          - "set Membership.status = CLOSED"
          - "increment Membership.version by 1"
      - from: CLOSED
        to: ACTIVE
        trigger: "POST /car-share/memberships/{id}/reinstate"
        actor: PodOperator
        preconditions:
          - "membership.status == CLOSED"
          - "the member's application_status == APPROVED"
          - "the member has no Membership row with status == ACTIVE"
        side_effects:
          - "set Membership.status = ACTIVE"
          - "increment Membership.version by 1"
        note: "Declared reopen edge completing the membership cycle CLOSED -> ACTIVE -> SUSPENDED -> FROZEN -> ACTIVE."

  # ---- SM-3 Vehicle.use_status : LINEAR with OUT_OF_SERVICE / RETIRED ----
  - entity: Vehicle
    initial_state: AVAILABLE
    terminal_states: [RETIRED]
    transitions:
      - from: AVAILABLE
        to: RESERVED
        trigger: "POST /car-share/reservations (hold confirmation cascade)"
        actor: system
        preconditions:
          - "vehicle.use_status == AVAILABLE"
          - "the reservation's member has a Membership row with status == ACTIVE"
          - "the reservation's member has Member.application_status == APPROVED"
          - "the requested interval [start_at, end_at) does not overlap any ADJACENT-blocking interval"
        side_effects:
          - "set Reservation.status = CONFIRMED"
          - "set Reservation.reservation_at = the current logical clock value"
          - "set Vehicle.last_known_odometer_at = the current logical clock value"
          - "recompute Reservation.charge_total_cents via the C1 calculation using the confirmed window"
          - "recompute Pod.utilization_score and Pod.available_bays for the booking pod"
          - "increment Vehicle.version by 1"
      - from: RESERVED
        to: IN_USE
        trigger: "POST /car-share/access-events with outcome == SUCCESS"
        actor: Member
        preconditions:
          - "vehicle.use_status == RESERVED"
          - "the reservation referenced by the access event has status == CONFIRMED"
          - "the access event's member_id equals the reservation's member_id"
        side_effects:
          - "set Reservation.status = IN_USE"
          - "set AccessEvent.outcome = SUCCESS"
          - "increment Vehicle.version by 1"
      - from: IN_USE
        to: CLEANING
        trigger: "POST /car-share/reservations/{id}/return with contamination_level >= 3"
        actor: system
        preconditions:
          - "vehicle.use_status == IN_USE"
          - "the return request's returned_pod_id equals the reservation's pod_id"
          - "the reservation's member has Member.application_status == APPROVED"
          - "the reservation's member has a Membership row with status == ACTIVE"
        side_effects:
          - "set Vehicle.cleanliness_state = CLEANING"
          - "set Vehicle.fuel_level_pct = the return request's returned_fuel_level_pct"
          - "set Vehicle.odometer_miles = the return request's returned_odometer_miles"
          - "create a MaintenanceOrder with blocking = false, status = SCHEDULED and reason = CLEANING"
          - "recompute Pod.utilization_score and Pod.available_bays for the booking pod"
          - "increment Vehicle.version by 1"
        note: "Owns sub-account B of the C5 pod-level aggregate: a CLEANING vehicle that is not IN_USE at the current logical clock value still displaces one service bay of its home pod."
      - from: IN_USE
        to: AVAILABLE
        trigger: "POST /car-share/reservations/{id}/return with contamination_level <= 2"
        actor: system
        preconditions:
          - "vehicle.use_status == IN_USE"
          - "the return request's returned_pod_id equals the reservation's pod_id"
          - "the reservation's member has Member.application_status == APPROVED"
          - "the reservation's member has a Membership row with status == ACTIVE"
        side_effects:
          - "set Vehicle.fuel_level_pct = the return request's returned_fuel_level_pct"
          - "set Vehicle.odometer_miles = the return request's returned_odometer_miles"
          - "when contamination_level is 1 or 2, create a CommunitySignal with signal_type = CLEANLINESS and member_id = the returning member"
          - "when returned_fuel_level_pct < the booking pod's fuel_floor_pct, create a CommunitySignal with signal_type = CLEANLINESS and member_id = the returning member"
          - "set Reservation.status = OVERDUE when the return is late, otherwise CLOSED"
          - "recompute Pod.utilization_score and Pod.available_bays for the booking pod"
          - "increment Vehicle.version by 1"
      - from: RESERVED
        to: AVAILABLE
        trigger: "POST /car-share/reservations/{id}/cancel or the NO_SHOW sweep"
        actor: system
        preconditions:
          - "vehicle.use_status == RESERVED"
        side_effects:
          - "set Reservation.status = CANCELLED or NO_SHOW"
          - "recompute Pod.utilization_score and Pod.available_bays for the booking pod"
          - "increment Vehicle.version by 1"
      - from: CLEANING
        to: AVAILABLE
        trigger: "POST /car-share/maintenance-orders/{id}/complete"
        actor: PodOperator
        preconditions:
          - "vehicle.use_status == CLEANING"
          - "the maintenance order's reason == CLEANING"
        side_effects:
          - "set Vehicle.cleanliness_state = CLEAN"
          - "recompute Pod.utilization_score and Pod.available_bays for the vehicle's pod"
          - "increment Vehicle.version by 1"
      - from: RESERVED
        to: OUT_OF_SERVICE
        trigger: "POST /car-share/vehicles/{id}/availability-events with event == OUT_OF_SERVICE"
        actor: PodOperator
        preconditions:
          - "vehicle.use_status IN {AVAILABLE, RESERVED}"
          - "the vehicle has no Reservation row with status == IN_USE"
        side_effects:
          - "set Vehicle.use_status = OUT_OF_SERVICE"
          - "recompute Pod.utilization_score and Pod.available_bays for the vehicle's pod"
          - "increment Vehicle.version by 1"
      - from: CLEANING
        to: IN_USE
        trigger: "POST /car-share/reservations/{id}/return (reservation remains open while the vehicle is in the cleaning bay)"
        actor: system
        preconditions:
          - "vehicle.use_status == CLEANING"
        side_effects:
          - "set Vehicle.use_status = IN_USE"
          - "increment Vehicle.version by 1"
      - from: AVAILABLE
        to: OUT_OF_SERVICE
        trigger: "POST /car-share/vehicles/{id}/availability-events with event == OUT_OF_SERVICE"
        actor: PodOperator
        preconditions:
          - "vehicle.use_status == AVAILABLE"
          - "the vehicle has no Reservation row with status == IN_USE"
        side_effects:
          - "set Vehicle.use_status = OUT_OF_SERVICE"
          - "recompute Pod.utilization_score and Pod.available_bays for the vehicle's pod"
          - "increment Vehicle.version by 1"
      - from: AVAILABLE
        to: MAINTENANCE
        trigger: "POST /car-share/incidents/{id}/maintenance-orders with blocking == true"
        actor: system
        preconditions:
          - "vehicle.use_status == AVAILABLE"
        side_effects:
          - "set Vehicle.use_status = MAINTENANCE"
          - "recompute Pod.utilization_score and Pod.available_bays for the vehicle's pod"
          - "increment Vehicle.version by 1"

  # ---- SM-4 Vehicle.cleanliness_state : PARALLEL dimension on the same row
  - entity: Vehicle
    initial_state: CLEAN
    terminal_states: [SUSPENDED_FOR_CLEANLINESS]
    transitions:
      - from: CLEAN
        to: REPORTED_DIRTY
        trigger: "POST /car-share/community-signals with signal_type == CLEANLINESS"
        actor: Member
        preconditions:
          - "vehicle.cleanliness_state IN {CLEAN, REPORTED_DIRTY, CLEANING}"
          - "the signal's pod_id equals the vehicle's pod_id"
        side_effects:
          - "set Vehicle.cleanliness_state = REPORTED_DIRTY"
          - "set CommunitySignal.member_id = the acting member"
          - "increment Vehicle.version by 1"
      - from: REPORTED_DIRTY
        to: ESCALATED
        trigger: "POST /car-share/community-signals with signal_type == CLEANLINESS for the second time within 180 days"
        actor: Member
        preconditions:
          - "vehicle.cleanliness_state == REPORTED_DIRTY"
          - "the vehicle has at least one earlier CommunitySignal with signal_type == CLEANLINESS whose created_at_signal is not earlier than the current logical clock value minus 180 days"
          - "the acting member is not the member who raised the previous CLEANLINESS signal for this vehicle"
        side_effects:
          - "set Vehicle.cleanliness_state = ESCALATED"
          - "when the vehicle has at least three CommunitySignal rows with signal_type == CLEANLINESS created within the last 180 days, set Vehicle.use_status = OUT_OF_SERVICE"
          - "increment Vehicle.version by 1"
      - from: ESCALATED
        to: SUSPENDED_FOR_CLEANLINESS
        trigger: "POST /car-share/maintenance-orders/{id}/complete on a CLEANING order while cleanliness_state == ESCALATED"
        actor: PodOperator
        preconditions:
          - "vehicle.cleanliness_state == ESCALATED"
          - "the maintenance order's reason == CLEANING"
          - "vehicle.use_status == CLEANING"
        side_effects:
          - "set Vehicle.cleanliness_state = SUSPENDED_FOR_CLEANLINESS"
          - "set Vehicle.use_status = OUT_OF_SERVICE"
          - "recompute Pod.utilization_score and Pod.available_bays for the vehicle's pod"
          - "increment Vehicle.version by 1"
      - from: REPORTED_DIRTY
        to: CLEAN
        trigger: "POST /car-share/maintenance-orders/{id}/complete on a CLEANING order"
        actor: PodOperator
        preconditions:
          - "vehicle.cleanliness_state == REPORTED_DIRTY"
          - "the maintenance order's reason == CLEANING"
          - "vehicle.use_status == CLEANING"
        side_effects:
          - "set Vehicle.cleanliness_state = CLEAN"
          - "increment Vehicle.version by 1"
      - from: CLEANING
        to: CLEAN
        trigger: "POST /car-share/maintenance-orders/{id}/complete on a CLEANING order"
        actor: PodOperator
        preconditions:
          - "vehicle.cleanliness_state == CLEANING"
          - "the maintenance order's reason == CLEANING"
        side_effects:
          - "set Vehicle.cleanliness_state = CLEAN"
          - "increment Vehicle.version by 1"

      - from: SUSPENDED_FOR_CLEANLINESS
        to: CLEAN
        trigger: "POST /car-share/vehicles/{id}/cleanliness-restore"
        actor: PodOperator
        preconditions:
          - "vehicle.cleanliness_state == SUSPENDED_FOR_CLEANLINESS"
          - "no CommunitySignal row with signal_type == CLEANLINESS exists for this vehicle whose created_at_signal is not earlier than the current logical clock value minus CLEANLINESS_RESTORE_DAYS"
        side_effects:
          - "set Vehicle.cleanliness_state = CLEAN"
          - "set Vehicle.use_status = AVAILABLE when Vehicle.use_status == OUT_OF_SERVICE"
          - "recompute Pod.utilization_score and Pod.available_bays for the vehicle's pod"
          - "increment Vehicle.version by 1"

  # ---- SM-5 Reservation.status : parallel lateness dimension + branch/join
  - entity: Reservation
    initial_state: HELD
    terminal_states: [CLOSED, CANCELLED, NO_SHOW]
    transitions:
      - from: HELD
        to: CONFIRMED
        trigger: "POST /car-share/reservations (confirmation cascade)"
        actor: system
        preconditions:
          - "member.application_status == APPROVED"
          - "the member has a Membership row with status == ACTIVE"
          - "the requested vehicle's use_status == AVAILABLE"
          - "the requested vehicle's pod_id equals the reservation's pod_id"
        side_effects:
          - "set Vehicle.use_status = RESERVED"
          - "set reservation.reservation_at = the current logical clock value"
          - "recompute Reservation.charge_total_cents via the C1 calculation using the confirmed window"
          - "recompute Pod.utilization_score and Pod.available_bays for the booking pod"
          - "increment Reservation.version by 1"
      - from: HELD
        to: CANCELLED
        trigger: "POST /car-share/reservations/{id}/cancel"
        actor: Member
        preconditions:
          - "reservation.status == HELD"
          - "X-User-ID equals the reservation's member_id when X-User-Role is Member"
        side_effects:
          - "recompute Pod.utilization_score and Pod.available_bays for the booking pod"
          - "increment Reservation.version by 1"
      - from: CONFIRMED
        to: IN_USE
        trigger: "POST /car-share/access-events with outcome == SUCCESS"
        actor: Member
        preconditions:
          - "reservation.status == CONFIRMED"
          - "the reservation's vehicle has use_status == RESERVED"
          - "the access event's member_id equals the reservation's member_id"
        side_effects:
          - "set Vehicle.use_status = IN_USE"
          - "increment Reservation.version by 1"
      - from: IN_USE
        to: RETURNED
        trigger: "POST /car-share/reservations/{id}/return"
        actor: Member
        preconditions:
          - "reservation.status == IN_USE"
          - "the return request's returned_pod_id equals the reservation's pod_id"
          - "the return request's returned_odometer_miles is greater than or equal to the vehicle's odometer_miles"
          - "Member.application_status == APPROVED and the member has a Membership row with status == ACTIVE"
        side_effects:
          - "set Reservation.returned_at = the current logical clock value"
          - "set Reservation.returned_pod_id = the return request's returned_pod_id"
          - "set Reservation.late_minutes = max(0, whole minutes between Reservation.end_at and Reservation.returned_at)"
          - "set Vehicle.fuel_level_pct = the return request's returned_fuel_level_pct"
          - "set Vehicle.odometer_miles = the return request's returned_odometer_miles"
          - "set Vehicle.use_status = AVAILABLE"
          - "recompute Reservation.charge_total_cents via charge_with_late_penalty_and_fuel_adjustment"
          - "set Vehicle.charge_total_cents = Reservation.charge_total_cents"
          - "recompute Pod.utilization_score and Pod.available_bays for the booking pod"
          - "increment Reservation.version by 1"
          - "increment Vehicle.version by 1"
      - from: RETURNED
        to: CLOSED
        trigger: "POST /car-share/reservations/{id}/close"
        actor: Member
        preconditions:
          - "reservation.status == RETURNED"
          - "a valid FuelCardTransaction row with status == POSTED exists for this reservation"
        side_effects:
          - "set Reservation.closed_at = the current logical clock value"
          - "credit Member.wallet_credit_cents by Member.wallet_hold_cents and set Member.wallet_hold_cents = 0, so the released hold is re-credited exactly once per reservation"
          - "when the vehicle has at least 8 CLOSED reservations whose closed_at falls inside the last 30 days, create a MaintenanceOrder with blocking = true, status = SCHEDULED and reason = UTILIZATION_SERVICE"
          - "when the reservation's charge_total_cents is greater than 5000 and the member has at least 2 CLOSED reservations within the last 180 days, credit Member.wallet_credit_cents by 500 and increment Member.referral_invites by 10"
          - "increment Reservation.version by 1"
          - "increment Member.version by 1 when a referral credit is issued"
        note: "The hold release is applied before the referral credit; the close is refused with ERR_ALREADY_TERMINAL when the reservation is already CLOSED, and the referral condition is evaluated against the charge as computed before any close-hop surcharge is folded in."
      - from: CLOSED
        to: OVERDUE
        trigger: "POST /car-share/reservations/{id}/reopen-overdue (system lateness sweep)"
        actor: system
        preconditions:
          - "reservation.status == CLOSED"
          - "the current logical clock value is greater than Reservation.end_at"
          - "Reservation.returned_at is null"
        side_effects:
          - "set Reservation.status_before_overdue = the status observed immediately before this transition"
          - "set Reservation.status = OVERDUE"
          - "recompute Reservation.charge_total_cents via charge_with_late_penalty_and_fuel_adjustment"
          - "increment Reservation.version by 1"
        note: "Declared revert edge; the lateness dimension is independent of the physical return, and the preserved status is re-applied on resolution."
      - from: OVERDUE
        to: CLOSED
        trigger: "POST /car-share/reservations/{id}/resolve-overdue"
        actor: PodOperator
        preconditions:
          - "reservation.status == OVERDUE"
          - "reservation.status_before_overdue in {CONFIRMED, IN_USE}"
        side_effects:
          - "set Reservation.status = CLOSED"
          - "set Reservation.returned_at = the current logical clock value when it is still null"
          - "when status_before_overdue == IN_USE, set Vehicle.use_status = AVAILABLE"
          - "recompute Reservation.late_minutes as max(0, whole minutes between Reservation.end_at and Reservation.returned_at)"
          - "recompute Reservation.charge_total_cents via charge_with_late_penalty_and_fuel_adjustment"
          - "increment Reservation.version by 1"
        note: "Reverts to the preserved status dimension before closing; never lands in RETURNED regardless of status_before_overdue."
      - from: RETURNED
        to: OVERDUE
        trigger: "POST /car-share/reservations/{id}/reopen-overdue (system lateness sweep)"
        actor: system
        preconditions:
          - "reservation.status == RETURNED"
          - "the current logical clock value is greater than Reservation.end_at"
          - "Reservation.returned_at is null"
        side_effects:
          - "set Reservation.status_before_overdue = RETURNED"
          - "set Reservation.status = OVERDUE"
          - "recompute Reservation.charge_total_cents via charge_with_late_penalty_and_fuel_adjustment"
          - "increment Reservation.version by 1"

  # ---- SM-6 Incident.status : BRANCHING fork-join with divergent branches
  - entity: Incident
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: ASSESSED
        trigger: "POST /car-share/incidents/{id}/party-split"
        actor: PodOperator
        preconditions:
          - "incident.status == OPEN"
          - "incident.incident_type == DAMAGE"
          - "incident.repair_cost_cents is not null"
          - "the acting operator identifier does not equal the incident's member identifier recorded at creation (segregation of duties)"
          - "expected_incident_version equals the persisted Incident.version"
        side_effects:
          - "set Incident.assigned_driver_member_id = the member who last operated the vehicle in the booking window"
          - "set Incident.assigned_damage_block_position = max(1, ceil(whole minutes between the reservation's start_at and the incident creation instant / 30))"
          - "recompute Incident.damage_fee_estimate_cents via damage_assessment (estimate variant)"
          - "recompute Incident.member_damage_fee_cents via damage_assessment (final variant)"
          - "sets Incident.insurance_layer to STANDARD, PLUS or PREMIUM from the insurance tier selected by the pinned C3 selector"
          - "when the incident's member holds no Membership row in status ACTIVE, create a secondary ERR_MEMBERSHIP_NOT_ACTIVE marker row on the incident so the refusal is observable"
          - "set Incident.fee_version = 1"
          - "set Incident.status = ASSESSED"
          - "increment Incident.version by 1"
      - from: ASSESSED
        to: FEE_CHARGED
        trigger: "POST /car-share/incidents/{id}/party-split (high-severity branch)"
        actor: PodOperator
        preconditions:
          - "incident.status == ASSESSED"
          - "incident.damage_fee_charged == false"
          - "the incident's severity score is greater than or equal to 4"
          - "incident.fee_version is greater than 0"
          - "expected_incident_version equals the persisted Incident.version"
        side_effects:
          - "set Incident.damage_fee_charged = true"
          - "credit Member.wallet_credit_cents for the incident's member in the amount described by the fee-posting rule"
          - "set every Membership row with member_id == incident.member_id and status IN {ACTIVE, SUSPENDED} to status = FROZEN"
          - "set every frozen Membership row's status_before_freeze to the status observed immediately before this transition"
          - "set every frozen Membership row's tier = FROZEN"
          - "increment Member.version by 1"
          - "increment Membership.version by 1 for every frozen membership row"
          - "increment Incident.version by 1"
        note: "Cascade hop 1 of the damage chain; the membership freeze hop is the depth-2 link."
      - from: ASSESSED
        to: CLOSED
        trigger: "POST /car-share/incidents/{id}/party-split (low-severity branch)"
        actor: PodOperator
        preconditions:
          - "incident.status == ASSESSED"
          - "the incident's severity score is less than or equal to 2"
          - "expected_incident_version equals the persisted Incident.version"
        side_effects:
          - "set Incident.damage_fee_charged = true"
          - "credit Member.wallet_credit_cents for the incident's member by the low-severity branch amount"
          - "set Incident.status = CLOSED"
          - "set every MaintenanceOrder row with incident_id == incident.id to status = CANCELLED"
          - "set every Membership row with status == FROZEN for this incident's member to status = the preserved status_before_freeze, and set status_before_freeze = NONE"
          - "increment Member.version by 1"
          - "increment Incident.version by 1"
      - from: FEE_CHARGED
        to: CLOSED
        trigger: "POST /car-share/maintenance-orders/{id}/complete on the order raised from this incident"
        actor: PodOperator
        preconditions:
          - "incident.status == FEE_CHARGED"
          - "the maintenance order's incident_id equals the incident's id"
          - "the maintenance order's status == IN_PROGRESS"
        side_effects:
          - "set Incident.status = CLOSED"
          - "set every Membership row with status == FROZEN for this incident's member to status = the preserved status_before_freeze, and set status_before_freeze = NONE"
          - "increment Membership.version by 1 for every thawed row"
          - "increment Incident.version by 1"
        note: "Join point of the fork; both branches converge on CLOSED via different side-effect sets."

  # ---- SM-7 MaintenanceOrder.status : LINEAR with cancel branch -----------
  - entity: MaintenanceOrder
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: BLOCKED
        trigger: "POST /car-share/incidents/{id}/maintenance-orders with blocking == true"
        actor: system
        preconditions:
          - "the order's vehicle has no Reservation row with status IN {CONFIRMED, IN_USE, OVERDUE} that overlaps [scheduled_start, scheduled_end)"
          - "the order's vehicle has no other MaintenanceOrder row with status IN {SCHEDULED, BLOCKED, IN_PROGRESS} that overlaps [scheduled_start, scheduled_end)"
        side_effects:
          - "set Vehicle.use_status = MAINTENANCE"
          - "recompute Pod.utilization_score and Pod.available_bays for the order's pod"
          - "increment Vehicle.version by 1"
          - "increment MaintenanceOrder.version by 1"
      - from: SCHEDULED
        to: SCHEDULED
        trigger: "POST /car-share/incidents/{id}/maintenance-orders with blocking == false"
        actor: system
        preconditions:
          - "the order's vehicle has no other MaintenanceOrder row with status IN {SCHEDULED, BLOCKED, IN_PROGRESS} that overlaps [scheduled_start, scheduled_end)"
        side_effects:
          - "increment MaintenanceOrder.version by 1"
        note: "Non-blocking orders stay SCHEDULED and never displace a bay; self-loop permitted so a repeated registration is observable."
      - from: BLOCKED
        to: IN_PROGRESS
        trigger: "POST /car-share/maintenance-orders/{id}/start"
        actor: PodOperator
        preconditions:
          - "order.status == BLOCKED"
        side_effects:
          - "increment MaintenanceOrder.version by 1"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /car-share/maintenance-orders/{id}/complete"
        actor: PodOperator
        preconditions:
          - "order.status == IN_PROGRESS"
        side_effects:
          - "set order.completed_at = the current logical clock value"
          - "when order.reason == UTILIZATION_SERVICE, set Vehicle.next_service_miles = Vehicle.odometer_miles + 5000"
          - "when order.reason == CLEANING and Vehicle.use_status == CLEANING, set Vehicle.use_status = AVAILABLE"
          - "when order.reason == CLEANING and Vehicle.cleanliness_state == ESCALATED, set Vehicle.cleanliness_state = SUSPENDED_FOR_CLEANLINESS"
          - "when order.reason == CLEANING and Vehicle.cleanliness_state IN {REPORTED_DIRTY, CLEANING}, set Vehicle.cleanliness_state = CLEAN"
          - "when order.incident_id is not null, set the referenced Incident.status = CLOSED"
          - "set order.released_cents = the sum of the C1 charges measured after the membership discount stored on the other reservations closed within the last 30 days for this vehicle"
          - "credit Member.wallet_credit_cents by order.released_cents for the member who owns the vehicle's most recent CLOSED reservation when order.released_cents is greater than 0"
          - "recompute Pod.utilization_score and Pod.available_bays for the order's pod"
          - "increment Vehicle.version by 1"
          - "increment MaintenanceOrder.version by 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /car-share/maintenance-orders/{id}/cancel"
        actor: PodOperator
        preconditions:
          - "order.status IN {SCHEDULED, BLOCKED}"
        side_effects:
          - "increment MaintenanceOrder.version by 1"

  # ---- SM-8 AccessEvent.outcome : BRANCHING with auto-release allowance ---
  - entity: AccessEvent
    initial_state: FAILED
    terminal_states: [SUCCESS, LOCKOUT_REPORTED]
    transitions:
      - from: FAILED
        to: SUCCESS
        trigger: "POST /car-share/access-events/{id}/retry (system auto-release cascade)"
        actor: system
        preconditions:
          - "the event's reservation has status == CONFIRMED"
          - "the event's vehicle has use_status == RESERVED"
          - "the event's member has consumed at most one auto-release allowance"
        side_effects:
          - "set AccessEvent.outcome = SUCCESS"
          - "set AccessEvent.auto_release_used = true"
          - "set the reservation's status = IN_USE"
          - "set the vehicle's use_status = IN_USE"
          - "increment AccessEvent.version by 1"
      - from: FAILED
        to: SUCCESS
        trigger: "POST /car-share/access-events (clean retry with method == APP)"
        actor: Member
        preconditions:
          - "the event's reservation has status == CONFIRMED"
          - "the event's vehicle has use_status == RESERVED"
          - "the previous FAILED event for this reservation used method == KEY_CARD"
        side_effects:
          - "set AccessEvent.outcome = SUCCESS"
          - "set the reservation's status = IN_USE"
          - "set the vehicle's use_status = IN_USE"
          - "increment AccessEvent.version by 1"
      - from: FAILED
        to: LOCKOUT_REPORTED
        trigger: "POST /car-share/access-events/{id}/lockout-report"
        actor: Member
        preconditions:
          - "the event's outcome == FAILED"
          - "the event's reservation has status IN {CONFIRMED, IN_USE}"
          - "the acting member identifier equals the event's member_id when X-User-Role is Member"
        side_effects:
          - "set AccessEvent.outcome = LOCKOUT_REPORTED"
          - "set AccessEvent.lockout_reported_at = the current logical clock value"
          - "recompute Member.strikes via strike_escalation"
          - "credit Member.wallet_credit_cents for a first lockout report by 500"
          - "increment Member.version by 1"
          - "increment AccessEvent.version by 1"

  # ---- SM-9 FuelCardTransaction.status : LINEAR with reverse --------------
  - entity: FuelCardTransaction
    initial_state: POSTED
    terminal_states: [REVERSED]
    transitions:
      - from: POSTED
        to: REVERSED
        trigger: "POST /car-share/fuel-card-transactions/{id}/reverse"
        actor: PodOperator
        preconditions:
          - "transaction.status == POSTED"
          - "the transaction's reservation has status IN {RETURNED, CLOSED}"
          - "the transaction's reservation has no returned_fuel_level_pct value greater than the transaction's fuel_level_after_pct"
        side_effects:
          - "set FuelCardTransaction.status = REVERSED"
          - "set Vehicle.fuel_level_pct = the transaction's fuel_level_after_pct"
          - "increment FuelCardTransaction.version by 1"
          - "increment Vehicle.version by 1"

  # ---- SM-10 Pod.site_type class : derived pod posture --------------------
  - entity: Pod
    initial_state: NEIGHBORHOOD
    terminal_states: []
    transitions:
      - from: NEIGHBORHOOD
        to: CAMPUS
        trigger: "POST /car-share/pods/{id}/reclassify"
        actor: FleetAdmin
        preconditions:
          - "pod.site_type in {NEIGHBORHOOD, CAMPUS, AIRPORT}"
          - "the pod has no MaintenanceOrder row with status IN {BLOCKED, IN_PROGRESS}"
        side_effects:
          - "set Pod.site_type = CAMPUS"
          - "recompute Pod.utilization_score and Pod.available_bays"
          - "increment Pod.version by 1"
      - from: CAMPUS
        to: AIRPORT
        trigger: "POST /car-share/pods/{id}/reclassify"
        actor: FleetAdmin
        preconditions:
          - "pod.site_type in {NEIGHBORHOOD, CAMPUS, AIRPORT}"
          - "the pod has no MaintenanceOrder row with status IN {BLOCKED, IN_PROGRESS}"
        side_effects:
          - "set Pod.site_type = AIRPORT"
          - "recompute Pod.utilization_score and Pod.available_bays"
          - "increment Pod.version by 1"
      - from: AIRPORT
        to: NEIGHBORHOOD
        trigger: "POST /car-share/pods/{id}/reclassify"
        actor: FleetAdmin
        preconditions:
          - "pod.site_type in {NEIGHBORHOOD, CAMPUS, AIRPORT}"
          - "the pod has no MaintenanceOrder row with status IN {BLOCKED, IN_PROGRESS}"
        side_effects:
          - "set Pod.site_type = NEIGHBORHOOD"
          - "recompute Pod.utilization_score and Pod.available_bays"
          - "increment Pod.version by 1"
        note: "Declared cycle covering the third state of a small closed state space."

  # ---- SM-11 Vehicle pod relocation (self-loop posture on the same entity) -
  - entity: Vehicle
    initial_state: AVAILABLE
    terminal_states: [RETIRED]
    transitions:
      - from: AVAILABLE
        to: AVAILABLE
        trigger: "POST /car-share/shift-bundles"
        actor: PodOperator
        preconditions:
          - "every vehicle in monthly_pods has use_status == AVAILABLE"
          - "every vehicle in monthly_pods has no Reservation row with status IN {HELD, CONFIRMED, IN_USE, OVERDUE}"
          - "every vehicle in monthly_pods has no MaintenanceOrder row with status IN {SCHEDULED, BLOCKED, IN_PROGRESS} that overlaps [scheduled_start, scheduled_end)"
          - "the destination pod has available_bays greater than 0"
          - "expected_pod_version_profile equals the persisted destination Pod.version"
        side_effects:
          - "set Vehicle.pod_id and Vehicle.home_pod_id to dest_pod_id for each relocated vehicle"
          - "recompute Pod.utilization_score and Pod.available_bays for the source pod"
          - "recompute Pod.utilization_score and Pod.available_bays for the destination pod"
          - "create a PodShiftBundle row recording bundle_id, source_pod_id, dest_pod_id, monthly_pods"
          - "when the destination pod's available_bays is 0 or fewer than the bundle size, create no PodShiftBundle row and return ERR_POD_CAPACITY_EXCEEDED"
          - "increment Pod.version by 1 for the destination pod"
          - "increment Vehicle.version by 1 for each relocated vehicle"
        note: "Self-loop on the vehicle posture: relocation preserves use_status but changes the home-pod assignment that every bay computation reads."

      - from: OUT_OF_SERVICE
        to: RETIRED
        trigger: "POST /car-share/vehicles/{id}/availability-events with event == RETIRE"
        actor: FleetAdmin
        preconditions:
          - "vehicle.use_status == OUT_OF_SERVICE"
        side_effects:
          - "recompute Pod.utilization_score and Pod.available_bays for the vehicle's pod"
          - "increment Vehicle.version by 1"

      - from: MAINTENANCE
        to: AVAILABLE
        trigger: "POST /car-share/maintenance-orders/{id}/cancel with reason == CUSTOMER_IMPACT when the vehicle has an active MaintenanceOrder row with reason == CUSTOMER_IMPACT"
        actor: PodOperator
        preconditions:
          - "vehicle.use_status == MAINTENANCE"
          - "the maintenance order's status IN {SCHEDULED, BLOCKED}"
        side_effects:
          - "set Vehicle.use_status = AVAILABLE"
          - "recompute Pod.utilization_score and Pod.available_bays for the vehicle's pod"
          - "increment Vehicle.version by 1"

# =============================================================================
# §1.2.1 Concurrency Rules (true races only — OCC on the parent version)
# =============================================================================
concurrency_rules:
  - rule_id: reservation-create-stale-vehicle
    parent_entity: Vehicle
    write_endpoint: "POST /car-share/reservations"
    occ_field: "expected_vehicle_version"
    description: |
      Creating a Reservation against a Vehicle whose version has advanced
      since the client last observed it is rejected. This captures the case
      where another writer has already confirmed a reservation on the same
      vehicle (a legitimate supersession under §1.2 SM-3) and the current
      writer's view of the vehicle is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: bundle-create-stale-dest-pod
    parent_entity: Pod
    write_endpoint: "POST /car-share/shift-bundles"
    occ_field: "expected_pod_version_profile"
    description: |
      Applying a monthly pod relocation bundle to a destination Pod whose
      version has advanced since the client last observed it is rejected. A
      prior approved bundle legitimately re-assigns vehicles and re-derives
      the destination's bay accounting under §1.2 SM-11, so the older
      observation of the pod is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: incident-split-stale-incident
    parent_entity: Incident
    write_endpoint: "POST /car-share/incidents/{id}/party-split"
    occ_field: "expected_incident_version"
    description: |
      Splitting responsibility on an Incident whose version has advanced
      since the client last observed it is rejected. A prior split legitimately
      re-derived the fee and the insurance layer under §1.2 SM-6, so the older
      observation of the incident is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: charge_with_late_penalty_and_fuel_adjustment
    description: "The single charge written into Reservation.charge_total_cents on return, on overdue resolution and on close."
    trigger: "POST /car-share/reservations/{id}/return; POST /car-share/reservations/{id}/resolve-overdue"
    algorithm: "chronological"
    formula: |
      # Evaluation order is pinned; the discount is keyed on the pre-discount
      # amount, never on the discounted amount (no circular re-entry).
      HOURLY_RATE_CENTS = 1150
      LAZY_MINUTES_PER_BLOCK = 30
      GRACE_MINUTES = 10
      LATE_MULTIPLIER       = 1.5     # applies to block 1
      LATE_BLOCK_ESCALATION = 1.17    # applied to the previous block's rate
      ESCALATION_CAP_BLOCKS = 3       # blocks beyond the third add no further escalation

      reference_instant = returned_at when returned_at is not null, else Reservation.end_at
      late_minutes = max(0, whole_minutes(reference_instant - end_at))
      lateness_blocks = 0 if late_minutes <= GRACE_MINUTES else ceil(late_minutes / 30)
      late_fee_raw(block b):
          b == 0 -> 0
          b > ESCALATION_CAP_BLOCKS -> 0
          rate(1) = HOURLY_RATE_CENTS * LATE_MULTIPLIER
          rate(b) = rate(b-1) * LATE_BLOCK_ESCALATION for 2 <= b <= ESCALATION_CAP_BLOCKS
          return rate(b)
      # rounding order pinned: round EACH block, then SUM.
      # Sanity anchors, all with reserved_hours 4:
      #   returned 75 minutes past end_at -> lateness_blocks 3, on_time_blocks 1,
      #     per-block late rates 1725, 2018, 2361 (round_half_up each) so late_fee_cents == 6104,
      #     time_component_cents == 1150 + 5175 == 6325.
      #   returned 10 minutes past end_at -> lateness_blocks 0, late_fee_cents == 0,
      #     time_component_cents == 4600.
      #   returned 11 minutes past end_at -> lateness_blocks 1, late_fee_cents == 1725,
      #     time_component_cents == 3450 + 1725 == 5175.
      late_fee_cents = round_half_up(sum(round_half_up(late_fee_raw(b)) for b in 1..lateness_blocks))

      fuel_deficit_pct = max(0, pod.fuel_floor_pct - returned_fuel_level_pct)
      fuel_surcharge_cents = ceil((fuel_deficit_pct * 12 / 100) * 450)
      fuel_level_fine_cents = 2500 * max(0, fuel_level_after_pct_to_level(fuel_level_pct) - 1)

      billed_late_blocks = min(lateness_blocks, 3)
      on_time_blocks = max(0, reserved_hours - billed_late_blocks)
      pre_discount_cents = time_component_cents + late_fee_cents + fuel_surcharge_cents + fuel_level_fine_cents
      projected_vehicle_charge_cents = vehicle.charge_total_cents + pre_discount_cents
      discount_pct = 0.20 if projected_vehicle_charge_cents < 100000 else 0.15
      charge_total_cents = pre_discount_cents - floor(pre_discount_cents * discount_pct)
      # Worked fixtures for a member with no prior Vehicle.charge_total_cents and an
      # on-time fuel reading at the pod floor (fuel_deficit 0, fuel_level_after_pct_to_level 1):
      #   late_minutes 0   -> pre_discount_cents 4600  -> charge_total_cents 4600 - 920  == 3680
      #   late_minutes 10  -> pre_discount_cents 4600  -> charge_total_cents 3680
      #   late_minutes 11  -> pre_discount_cents 6900  -> charge_total_cents 6900 - 1380 == 5520
      #   late_minutes 31  -> pre_discount_cents 9493  -> charge_total_cents 9493 - 1898 == 7595
      #   late_minutes 75 with a 6-point deficit -> late_fee_cents 6104, fuel_surcharge_cents 324,
      #     pre_discount_cents 12753 -> charge_total_cents 12753 - 2550 == 10203, whereas summing
      #     the unrounded rates before rounding would give 12754 - 2550 == 10204.
      #   an unresolved overdue reservation swept and then resolved at 2026-09-10T12:00:00Z
      #     -> pre_discount_cents 12429 -> charge_total_cents 12429 - 2485 == 9944.

      time_component_cents for the hourly reservation class =
          on_time_blocks * HOURLY_RATE_CENTS + billed_late_blocks * HOURLY_RATE_CENTS * LATE_MULTIPLIER
      time_component_cents for the daily reservation class =
          daily_rate_cents
      daily_rate_cents = 6450 when reserved_hours == 0
      daily_rate_cents, when reserved_hours >= 1, is read from the ordered table
          [(>= 120, 4650), (>= 72, 5450), (>= 24, 6450)] evaluated top-down,
          and equals 7450 when reserved_hours < 24
    input_set: "The reservation being returned or resolved, plus its Vehicle and the booking Pod (for fuel_floor_pct)."
    constants:
      HOURLY_RATE_CENTS: 1150
      DAILY_OVERAGE_RATE_CENTS: 6450
      LATE_MULTIPLIER: 1.5
      LATE_BLOCK_ESCALATION: 1.17
      ESCALATION_CAP_BLOCKS: 3
      GRACE_MINUTES: 10
      FUEL_SURCHARGE_CEILING: 450
      FUEL_SURCHARGE_STEP_PCT: 12
      FUEL_MISSING_LEVEL_FINE_CENTS: 2500
      LONG_RESERVATION_DISCOUNT_PCT: 0.20
      LONG_RESERVATION_DISCOUNT_ALT_PCT: 0.15
      LONG_RESERVATION_DISCOUNT_ALT_THRESHOLD_CENTS: 100000
    precision: "2 decimal places, round_half_up, applied per 30-minute block before summation; the discount applies to a floored product"
    variants:
      - name: late_penalty_escalating
        when: "the authoritative variant; used on POST /car-share/reservations/{id}/return"
        difference: "late_fee_cents is the sum of per-block escalated rates with per-block round_half_up"
      - name: late_penalty_flat
        when: "the competing variant named in prose; a single round_half_up(HOURLY_RATE_CENTS * LATE_MULTIPLIER * lateness_blocks)"
        difference: "produces a different late_fee_cents from the same inputs because escalation is dropped and rounding is applied once"

  - name: late_return_penalty
    description: "The late-return penalty posted to the member ledger when an overdue reservation is resolved; a distinct calculation surface from the reservation charge, keyed on the vehicle's fuel-card ledger total."
    trigger: "POST /car-share/reservations/{id}/resolve-overdue"
    algorithm: "chronological"
    formula: |
      # Order-sensitive: the qualifying-transaction tie-break is pinned.
      # precise fallback over common fields: created_at ASC, never a random id.
      qualifying_txns = [t for t in FuelCardTransaction where t.vehicle_id == r.vehicle_id and t.status == POSTED]
                        ordered by created_at ASC, with ties broken by the standard common-field
                        fallback so the order never depends on a random identifier
      last_txn_total_cents(n) = sum of t.amount_cents over the LAST min(n, count(qualifying_txns)) entries
      late_penalty_cents(n) = last_txn_total_cents(n + 1) - last_txn_total_cents(n)
      # When the vehicle has no POSTED fuel-card transaction at all, last_txn_total_cents(n) is 0
      # for every n, so late_penalty_cents(S - 3) is 0 and a large overage resolves to the flat
      # 8000 tier with no ledger contribution.

      reference_instant = returned_at when returned_at is not null, else Reservation.end_at
      late_minutes = max(0, whole_minutes(reference_instant - end_at))
      blocks = 0 if late_minutes <= GRACE_MINUTES else ceil(late_minutes / 30)
      S = max(0, blocks - CEILING(GRACE_MINUTES / 30))              # CEILING(10/30) = 1

      if S == 0:  member_late_penalty_cents = 0
      if S >= 1:  member_late_penalty_cents = LATE_TIER_1_FEE_CENTS        # flat 6000, never hour-scaled
      if S >= 2:  member_late_penalty_cents = LATE_TIER_2_FEE_CENTS        # flat 8000, never hour-scaled
      if S >= 3:  member_late_penalty_cents = LATE_TIER_2_FEE_CENTS + late_penalty_cents(S - 3)
      # The threshold uses >=: S == 1 must be true on the sanity input.
      sanity: member_late_penalty_cents(65 late minutes) == 6000
    input_set: "The OVERDUE reservation, its Vehicle, and the Vehicle's FuelCardTransaction rows with status == POSTED."
    constants:
      GRACE_MINUTES: 10
      LATE_TIER_1_FEE_CENTS: 6000
      LATE_TIER_2_FEE_CENTS: 8000
      LATE_FEE: 6000
    precision: "2 decimal places, round_half_up"
    variants:
      - name: ledger_keyed_tier_penalty
        when: "the authoritative variant; used on POST /car-share/reservations/{id}/resolve-overdue"
        difference: "uses the fuel-card ledger marginal delta late_penalty_cents(S-3) above the flat 8000 tier"
      - name: hour_scaled_penalty
        when: "the competing variant named in prose; LATE_FEE multiplied by lateness_blocks"
        difference: "produces a different member_late_penalty_cents from the same inputs because it scales with elapsed blocks instead of with the ledger delta"

  - name: damage_assessment
    description: "The damage responsibility fee: a member fee plus the insurance layer selected from the member's membership tier."
    trigger: "POST /car-share/incidents/{id}/party-split"
    algorithm: "tiered_pricing"
    formula: |
      insurance(repair_cost_cents, membership_tier):
          STANDARD -> (TYPE, PLUS) -> deductible 0,     member_liability_pct 1.00
          PLUS                  -> deductible 2000,  member_liability_pct 0.10
          PREMIUM               -> deductible 3000,  member_liability_pct 0.00
          FROZEN                -> treated as the preserved base tier, NEVER as PREMIUM
      insurance_amount_cents = round_half_up(member_liability_pct * repair_cost_cents)
      member_damage_fee_cents = deductible_cents + insurance_amount_cents

      damage_fee_estimate_cents = round_half_up(repair_cost_cents * 0.50)
      # ESTIMATE variant only: the projection ignores the membership tier entirely.
    input_set: "The DAMAGE incident's repair_cost_cents and the member's insurance tier. The insurance tier is selected as the member's Membership row with status == ACTIVE whose tier has the highest rank (PREMIUM > PLUS > STANDARD) and, among equal ranks, the earliest created_at; Member.id and Membership.id NEVER participate in this selection. When no ACTIVE membership exists the assessment is rejected with ERR_MEMBERSHIP_NOT_ACTIVE."
    constants:
      PLUS_DEDUCTIBLE_CENTS: 2000
      PREMIUM_DEDUCTIBLE_CENTS: 3000
      STANDARD_LIABILITY_PCT: 1.00
      PLUS_LIABILITY_PCT: 0.10
      PREMIUM_LIABILITY_PCT: 0.00
      ESTIMATE_PCT: 0.50
    precision: "2 decimal places, round_half_up"
    variants:
      - name: estimate
        when: "written into Incident.damage_fee_estimate_cents at incident assessment"
        difference: "round_half_up(repair_cost_cents * 0.50) and ignores the membership tier, so a PLUS membership with repair_cost_cents 30000 yields 15000"
      - name: final
        when: "written into Incident.member_damage_fee_cents at assessment and at every fee_version recompute"
        difference: "deductible + round_half_up(liability_pct * repair_cost_cents), so the same PLUS membership with repair_cost_cents 30000 yields 3000"

  - name: pod_utilization
    description: "Pod utilization and bay accounting; the derived fields that gate outbound relocation bundles."
    trigger: "every occupancy-changing side effect of SM-3, SM-4, SM-11 and SM-7"
    algorithm: "aggregation"
    formula: |
      active_member_count(p) = count of Vehicle v where v.home_pod_id == p and v.use_status != RETIRED
      parked_count(p)        = count of Vehicle v where v.home_pod_id == p and v.use_status != RETIRED
      periodic_demand_rate(p) = count of Reservation r where
          r.status == CONFIRMED and r.reservation_at >= (current_time - 24 hours)
      ut = active_member_count(p) * 12 + periodic_demand_rate(p) * 5
      utilization_score(p) = ut / (ut + 60)
      available_bays(p) = max(0, p.capacity - parked_count(p))
    input_set: "Vehicles whose home_pod_id is the pod and whose use_status != RETIRED; Reservations in CONFIRMED whose reservation_at falls in the trailing 24-hour window; the source pod's retained vehicles after a relocation."
    constants:
      UTILIZATION_MULTIPLIER: 12
      PERIODIC_DEMAND_MULTIPLIER: 5
      STALENESS_K: 60
      ACTIVE_MEMBER_WEIGHT: 12
      PERIODIC_DEMAND_WEIGHT: 5
    precision: "4 decimal places, round_half_up"

  - name: shift_bundle_fee
    description: "The relocation (shift bundle) fee for moving a monthly set of pod vehicles to a destination pod."
    trigger: "POST /car-share/shift-bundles"
    algorithm: "tiered_pricing"
    formula: |
      # Evaluation order is pinned: the surcharge band is selected top-down and
      # the FIRST matching row wins.
      bundle_vehicle_count = count(monthly_pods)
      per_pod_fee_cents = 5000 * bundle_vehicle_count
      source_available = count of Vehicle where home_pod_id == source_pod_id and use_status != RETIRED
                         and vehicle is NOT one of monthly_pods
      dest_available   = count of Vehicle where home_pod_id == dest_pod_id and use_status != RETIRED
      if bundle_vehicle_count == 0:                                          long_haul_surcharge_cents = 19600   # empty bundle: the row still registers and the fee floor applies
      elif abs(source_available - dest_available) <= BALANCED_TOLERANCE:     long_haul_surcharge_cents = 3200
      elif min(source_available, dest_available) * 3 >= max(source_available, dest_available):
                                                                             long_haul_surcharge_cents = 10400
      else:                                                                  long_haul_surcharge_cents = 19600
      bundle_fee_cents = per_pod_fee_cents + long_haul_surcharge_cents
      # Sanity anchor: 3 source-campus vehicles relocated into an empty destination pod
      # gives source_available 0 and dest_available 0, hence 15000 + 3200 == 18200.
    input_set: "monthly_pods (identical source campus vehicles with a non-overlapping relocation window), the source pod, the destination pod."
    constants:
      PER_POD_FEE_CENTS: 5000
      BALANCED_TOLERANCE: 1
      BALANCED_SURCHARGE_CENTS: 3200
      MID_BALANCED_SURCHARGE_CENTS: 10400
      IMBALANCED_SURCHARGE_CENTS: 19600
      SOURCE_RETAINED_RATIO: 3
    precision: "integer cents, round_half_up"

  - name: fuel_cost_adjustment
    description: "Fuel surcharge and fuel-level fine folded into the reservation charge."
    trigger: "POST /car-share/reservations/{id}/return"
    algorithm: "threshold"
    formula: |
      fuel_surcharge_cents = CEILING( (fuel_deficit_pct * FUEL_SURCHARGE_STEP_PCT / 100) * FUEL_SURCHARGE_CEILING ) when fuel_deficit_pct > 0
      fuel_surcharge_cents = SURCHARGE_REDUCED_CENTS when fuel_deficit_pct == 0 and fuel_level_after_pct_to_level(fuel_level_pct) >= 3
      fuel_level_fine_cents = FUEL_MISSING_LEVEL_FINE_CENTS * max(0, fuel_level_after_pct_to_level(fuel_level_pct) - 1)
      fuel_level_after_pct_to_level(pct) = 1 for pct in [35,100]; 2 for pct in [1,34]; 3 for pct == 0
    input_set: "The returned reservation's returned_fuel_level_pct and the booking pod's fuel_floor_pct."
    constants:
      FUEL_SURCHARGE_STEP_PCT: 12
      FUEL_SURCHARGE_CEILING: 450
      SURCHARGE_REDUCED_CENTS: 750
      FUEL_MISSING_LEVEL_FINE_CENTS: 2500
    precision: "integer cents, ceiling; round_half_up for the reduced surcharge"
    variants:
      - name: measured_surcharge
        when: "the authoritative variant; used on POST /car-share/reservations/{id}/return"
        difference: "scales with the measured deficit, so a 20% floor against a 35% reading yields CEILING((15 * 12 / 100) * 450) = 810"
      - name: reduced_surcharge
        when: "the competing variant named in prose; a flat SURCHARGE_REDUCED_CENTS on any deficit"
        difference: "produces 750 for the same 15-point deficit instead of 810"

  - name: strike_escalation
    description: "Member strike escalation for quality and access violations, and its fee posting."
    trigger: "POST /car-share/access-events/{id}/lockout-report; POST /car-share/maintenance-orders/{id}/complete; POST /car-share/reservations/{id}/close"
    algorithm: "weighted_scoring"
    formula: |
      WEIGHTS = {FUEL_LEVEL: 1, CLEANLINESS: 2, LOCKOUT: 3}
      cumulative_load(member) = sum(WEIGHTS[t] for t in terminal_violations_snapshot(member))
      terminal_violations_snapshot(member) = tuple of violation types applied to this member in
          ascending created_at order; when created_at ties, ascending tuple-index order.
          This snapshot is FROZEN at the first quality/access strike transition: it
          includes every later-applied violation type, and its frozen position for each
          type is its FIRST application position, so no violation can appear after itself.
      strikes(member) = ceil(cumulative_load(member) / 2)
      overage_count = max(0, strikes(member) - 2)
      violation_fee_cents(member) = VIOLATION_FEE_CENTS * overage_count
    input_set: "The member's terminal fuel-level, cleanliness and lockout violations; only violations the member has already caused participate."
    constants:
      FUEL_LEVEL_WEIGHT: 1
      CLEANLINESS_WEIGHT: 2
      LOCKOUT_WEIGHT: 3
      STRIKES_DIVISOR: 2
      VIOLATION_FEE_CENTS: 1000
      STRIKE_FEE_CENTS: 1000
      STRIKE_WINDOW_DAYS: 180
    precision: "integer, ceiling"
    variants:
      - name: cash_fee_variant
        when: "the authoritative variant; posted on POST /car-share/access-events/{id}/lockout-report"
        difference: "VIOLATION_FEE_CENTS * max(0, strikes - 2) = 1000 * 1 = 1000 for a cumulative load of 6 (FUEL_LEVEL + FUEL_LEVEL + CLEANLINESS + LOCKOUT = 1+1+2+3)"
      - name: points_per_violation_variant
        when: "the competing variant named in prose; WEIGHTS[t] charged directly per violation with no ceiling division"
        difference: "produces 7 for the same cumulative load of 7 exactly at the moment the load is measured, not 1"

  - name: damage_severity_score
    description: "The severity score that selects the SM-6 branch and scales any excess damage fee, with two declared variants."
    trigger: "POST /car-share/incidents/{id}/party-split"
    algorithm: "weighted_scoring"
    formula: |
      T1 = member.last_accident_fee_block
      T2 = 1 when member.strikes == 0, else 2
      T3 = 1 when incident.repair_cost_cents >= 10000, else 0
      severity_score_raw = T1 + T2 + T3
      # Sanity anchors: (T1 2, strikes 0, repair 12000) -> 4 -> high severity branch;
      #                 (T1 0, strikes 0, repair 6000)  -> 1 -> low severity branch.
    input_set: "The incident's assigned driver, the reservation window, and the reservation's declared return pod."
    constants:
      DAMAGE_SEVERITY_CENTS: 1500
      DAMAGE_EXCESS_FLAT_CENTS: 1500
      LATENESS_BLOCK_MINUTES: 30
      SEVERITY_HIGH_THRESHOLD: 4
      SEVERITY_LOW_THRESHOLD: 2
    precision: "integer cents, ceiling"
    variants:
      - name: high_severity_variant
        when: "the authoritative variant at POST /car-share/incidents/{id}/party-split; fee = DAMAGE_SEVERITY_CENTS * severity_score_raw + DAMAGE_EXCESS_FLAT_CENTS * max(0, severity_score_raw - T1), so the excess band is charged from the SECOND point"
        difference: "with T1 == 2, T2 == 2 and T3 == 0, produces 1500 * 4 + 1500 * max(0, 4 - 2) = 9000"
      - name: low_severity_variant
        when: "the competing variant named in prose; fee = DAMAGE_SEVERITY_CENTS * T1 + DAMAGE_EXCESS_FLAT_CENTS * max(0, T3 - 2), scaling only the assigned block position"
        difference: "produces 1500 * 2 + 1500 * max(0, 0 - 2) = 3000 for the same T1 == 2, T2 == 2, T3 == 0 inputs"

  - name: membership_application_screening
    description: "The applied-to-decided screening interval: the declared 24-hour early-grade downgrade window for a membership application."
    trigger: "POST /car-share/members/{id}/application-decision; POST /car-share/members/{id}/reopen-application"
    algorithm: "threshold"
    formula: |
      window_open  = Member.application_decided_at
      window_close = Member.application_decided_at + EARLY_GRADE_WINDOW_HOURS
      revert_permitted = Member.screen_result == CLEAR
                         and Member.strikes == 0
                         and window_open <= current_time < window_close
      # boundary pinned: the window is half-open, so current_time == window_close
      # is OUTSIDE and the reopen is rejected with ERR_REOPEN_WINDOW_CLOSED.
      # The reopen anchor is derived from application_decided_at, never from Member.id.
    input_set: "The APPROVED member observed at the revert decision instant."
    constants:
      EARLY_GRADE_WINDOW_HOURS: 24
      REVERT_ANCHOR_FALLBACK: "created_at ASC"
    precision: "integer bucket count, ceiling"

  - name: membership_thaw_and_residual_release
    description: "The compensating half of the freeze gesture: which status a thawed membership lands on, and the wallet residual released when a frozen membership is closed out."
    trigger: "POST /car-share/memberships/{id}/thaw; POST /car-share/memberships/{id}/close"
    algorithm: "aggregation"
    formula: |
      RESIDUAL_RELEASE_PCT = 80
      # status restored on thaw: the preserved anchor, never always-ACTIVE
      thaw_target = Membership.status_before_freeze when Membership.status_before_freeze in {ACTIVE, SUSPENDED}
                    else ACTIVE when Membership.status_before_freeze == NONE
      restore_pool = TierRestoreEntitlement rows for this membership whose restore_status == PENDING,
                     ordered by created_at ASC and then by the standard common-field fallback
      restored_tier = restore_pool[0].tier when restore_pool is non-empty, else STANDARD
      # consuming the chosen entitlement sets its restore_status = CONSUMED
      # residual released on a CANCELLED upgrade
      raw_residual_cents = Membership.membership_billing_cents
      released_cents = floor(raw_residual_cents * RESIDUAL_RELEASE_PCT / 100)
      # The residual is modelled on a single cumulative one-balance ledger per member: the
      # balance moves between wallet_credit_cents and wallet_hold_cents and is never removed,
      # so the compensating gesture only ever moves it back and can never delete it.
      release is permitted exactly once per membership close; a second close releases zero
      # and is refused with ERR_ALREADY_RELEASED.
      # Sanity anchor: the default membership bills 8550, so released_cents == 6840.
    input_set: "The wallet hold ledger of the member whose membership is being thawed, plus the membership's residual rows."
    constants:
      RESIDUAL_RELEASE_PCT: 80
      CARD_PURCHASE_DELTA_CENTS: 0
      CANCELLED_TOPUP_CENTS: 33
    precision: "integer cents, floor"
    variants:
      - name: release_once
        when: "the authoritative variant; the residual is released exactly once per membership close"
        difference: "released_cents is credited once and subsequent closes for the same membership release zero"
      - name: release_per_close
        when: "the competing variant named in prose; released_cents is credited on every close call"
        difference: "produces a different cumulative credit from the same inputs because a repeated close double-credits"

  - name: occupancy_fee_derivation_order
    description: "The registration fee and its discount, where the discount is keyed on a total that already includes the fee (the classic circular-looking dependency with a pinned evaluation order)."
    trigger: "POST /car-share/memberships"
    algorithm: "threshold"
    formula: |
      # Pinned evaluation order: the fee is derived from the pre-fee membership
      # total, and the discount is keyed on the post-fee total. One forward pass,
      # no fixed-point iteration.
      membership_dues_cents = MEMBERSHIP_DUES_CENTS
      registration_fee_cents = REGISTRATION_BASE_CENTS * (1 - REGISTRATION_FEE_REDUCTION_PCT / 100)
      membership_total_cents = membership_dues_cents + registration_fee_cents
      discount_pct = DISCOUNT_HIGH_PCT if membership_total_cents >= DISCOUNT_HIGH_THRESHOLD_CENTS else DISCOUNT_LOW_PCT
      billing_total_cents = membership_total_cents - floor(membership_total_cents * discount_pct)
    input_set: "The membership's tier and the account's program type."
    constants:
      MEMBERSHIP_DUES_CENTS: 7000
      REGISTRATION_BASE_CENTS: 2500
      REGISTRATION_FEE_REDUCTION_PCT: 20
      REGISTRATION_FEE_CENTS: 2000
      DISCOUNT_HIGH_PCT: 0.10
      DISCOUNT_HIGH_THRESHOLD_CENTS: 10000
      DISCOUNT_LOW_PCT: 0.05
    precision: "integer cents, floor"
    variants:
      - name: fee_first_then_discount
        when: "the authoritative variant; fee derived from dues, then discount applied to the post-fee total"
        difference: "billing_total_cents = 9000 - INT(9000 * 0.05) = 8550 for dues 7000 and a reduced registration fee 2000"
      - name: discount_first_then_fee
        when: "the competing variant named in prose; discount applied to the dues before the fee is added"
        difference: "produces a different billing_total_cents from the same inputs because the discount base excludes the registration fee"
# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
- priority: 1
  category: auth
  check: X-User-Role and X-User-ID headers are present and X-User-Role is a declared role
  error_id: ERR_UNAUTHENTICATED
  http_status: 401
  applies_to: all
- priority: 2
  category: auth
  check: the acting role is permitted for the operation; when X-User-Role is Member, X-User-ID must equal the owning Member.id of the target resource or of the target resource's parent chain
  error_id: ERR_FORBIDDEN
  http_status: 403
  applies_to: all
- priority: 3
  category: existence
  check: required input fields are present, each field carries its declared type, and every enum field carries a value inside its declared set
  error_id: ERR_INVALID_REQUEST
  http_status: 400
  applies_to: all
- priority: 3
  category: existence
  check: referenced resources in the path resolve in left-to-right path order; a missing segment returns the not-found error for that segment
  error_id: ERR_MEMBER_NOT_FOUND
  http_status: 404
  applies_to:
  - POST /car-share/members/{id}/driving-record-reports
  - POST /car-share/members/{id}/application-decision
  - POST /car-share/members/{id}/reopen-application
  - POST /car-share/memberships
- priority: 3
  category: existence
  check: the target Membership row exists; an unknown membership id returns the membership not-found error
  error_id: ERR_MEMBERSHIP_NOT_FOUND
  http_status: 404
  applies_to:
  - POST /car-share/memberships/{id}/suspend
  - POST /car-share/memberships/{id}/reinstate
  - POST /car-share/memberships/{id}/thaw
  - POST /car-share/memberships/{id}/close
- priority: 3
  category: existence
  check: the target Pod row exists; an unknown pod id returns the pod not-found error
  error_id: ERR_POD_NOT_FOUND
  http_status: 404
  applies_to:
  - POST /car-share/vehicles
  - GET /car-share/pods/{id}/vehicles
  - POST /car-share/shift-bundles
  - POST /car-share/community-signals
- priority: 3
  category: existence
  check: the target Vehicle row exists; an unknown vehicle id returns the vehicle not-found error
  error_id: ERR_VEHICLE_NOT_FOUND
  http_status: 404
  applies_to:
  - GET /car-share/vehicles/{id}
  - POST /car-share/vehicles/{id}/availability-events
  - POST /car-share/maintenance-orders
  - GET /car-share/vehicles/{id}/maintenance-orders
  - GET /car-share/vehicles/{id}/access-events
- priority: 3
  category: existence
  check: the target Reservation row exists; an unknown reservation id returns the reservation not-found error
  error_id: ERR_RESERVATION_NOT_FOUND
  http_status: 404
  applies_to:
  - GET /car-share/reservations
  - POST /car-share/reservations/{id}/cancel
  - POST /car-share/reservations/{id}/return
  - POST /car-share/reservations/{id}/close
  - POST /car-share/reservations/{id}/reopen-overdue
  - POST /car-share/reservations/{id}/resolve-overdue
  - POST /car-share/access-events
  - POST /car-share/fuel-card-transactions
- priority: 3
  category: existence
  check: the target Incident row exists; an unknown incident id returns the incident not-found error
  error_id: ERR_INCIDENT_NOT_FOUND
  http_status: 404
  applies_to:
  - GET /car-share/incidents
  - POST /car-share/incidents/{id}/party-split
  - POST /car-share/incidents/{id}/maintenance-orders
  - GET /car-share/incidents/{id}/maintenance-orders
- priority: 3
  category: existence
  check: the referenced Account row exists; an unknown account id returns the account not-found error
  error_id: ERR_ACCOUNT_NOT_FOUND
  http_status: 404
  applies_to:
  - POST /car-share/memberships
  - GET /car-share/accounts/{id}/memberships
- priority: 3
  category: existence
  check: the target MaintenanceOrder row exists; an unknown order id returns the maintenance order not-found error
  error_id: ERR_MAINTENANCE_ORDER_NOT_FOUND
  http_status: 404
  applies_to:
  - POST /car-share/maintenance-orders/{id}/start
  - POST /car-share/maintenance-orders/{id}/complete
  - POST /car-share/maintenance-orders/{id}/cancel
- priority: 3
  category: existence
  check: the target AccessEvent row exists; an unknown event id returns the access event not-found error
  error_id: ERR_ACCESS_EVENT_NOT_FOUND
  http_status: 404
  applies_to:
  - POST /car-share/access-events/{id}/retry
  - POST /car-share/access-events/{id}/lockout-report
- priority: 3
  category: existence
  check: the target FuelCardTransaction row exists; an unknown transaction id returns the fuel card transaction not-found error
  error_id: ERR_FUEL_TRANSACTION_NOT_FOUND
  http_status: 404
  applies_to:
  - POST /car-share/fuel-card-transactions/{id}/reverse
- priority: 3
  category: existence
  check: the incident's referenced reservation, vehicle and member exist; a mismatch between the supplied vehicle_id or member_id and the reservation's own vehicle_id or member_id is rejected
  error_id: ERR_INCIDENT_REFERENCE_MISMATCH
  http_status: 422
  applies_to:
  - POST /car-share/incidents
- priority: 4
  category: state
  check: the wallet residual for this membership close has already been released, so the release gesture is refused before the state precondition is evaluated
  error_id: ERR_ALREADY_RELEASED
  http_status: 409
  applies_to:
  - POST /car-share/memberships/{id}/close
- priority: 6
  category: state
  check: the requested state transition is declared for the target resource's current state; an undeclared from-state returns the invalid-state error
  error_id: ERR_INVALID_STATE
  http_status: 409
  applies_to:
  - POST /car-share/members/{id}/driving-record-reports
  - POST /car-share/members/{id}/application-decision
  - POST /car-share/members/{id}/reopen-application
  - POST /car-share/memberships/{id}/suspend
  - POST /car-share/memberships/{id}/reinstate
  - POST /car-share/memberships/{id}/thaw
  - POST /car-share/memberships/{id}/close
  - POST /car-share/reservations/{id}/cancel
  - POST /car-share/reservations/{id}/return
  - POST /car-share/reservations/{id}/close
  - POST /car-share/reservations/{id}/resolve-overdue
  - POST /car-share/maintenance-orders/{id}/start
  - POST /car-share/maintenance-orders/{id}/complete
  - POST /car-share/maintenance-orders/{id}/cancel
  - POST /car-share/access-events/{id}/retry
  - POST /car-share/access-events/{id}/lockout-report
  - POST /car-share/fuel-card-transactions/{id}/reverse
  - POST /car-share/vehicles/{id}/availability-events
- priority: 5
  category: state
  check: the target resource is already in the terminal state that this exact operation produces, so repeating the terminal-forming action is refused and no state leaf is created for the repeat
  error_id: ERR_ALREADY_TERMINAL
  http_status: 409
  applies_to:
  - POST /car-share/reservations/{id}/cancel
  - POST /car-share/reservations/{id}/return
  - POST /car-share/memberships/{id}/thaw
  - POST /car-share/incidents/{id}/party-split
- priority: 9
  category: business_safety
  check: the member has Member.application_status == APPROVED; a membership in any other application posture grants no booking rights
  error_id: ERR_APPLICATION_NOT_APPROVED
  http_status: 409
  applies_to:
  - POST /car-share/reservations
  - POST /car-share/access-events
- priority: 11
  category: business_safety
  check: the member has a Membership row with status == ACTIVE, or status == ACTIVE with the tier explicitly matching, for the operation being attempted
  error_id: ERR_MEMBERSHIP_NOT_ACTIVE
  http_status: 409
  applies_to:
  - POST /car-share/reservations
  - POST /car-share/access-events
- priority: 8
  category: business_safety
  check: the member's driving-record screening outcome is CLEAR; a REFERRED or FAILED outcome blocks the operation
  error_id: ERR_SCREENING_NOT_CLEAR
  http_status: 422
  applies_to:
  - POST /car-share/members/{id}/application-decision
  - POST /car-share/members/{id}/reopen-application
  - POST /car-share/reservations
- priority: 12
  category: business_safety
  check: the vehicle's use_status is AVAILABLE; any other posture freezes new reservations for that vehicle
  error_id: ERR_VEHICLE_NOT_AVAILABLE
  http_status: 409
  applies_to:
  - POST /car-share/reservations
- priority: 10
  category: business_safety
  check: the member's Membership.status is FROZEN, which blocks the booking; reported separately from the generic not-active case so the freeze is observable
  error_id: ERR_MEMBERSHIP_FROZEN
  http_status: 409
  applies_to:
  - POST /car-share/reservations
- priority: 13
  category: business_constraint
  check: the submitted driving-record report count is at most one non-terminal report; a second submission while one is SUBMITTED is refused
  error_id: ERR_DRIVING_RECORD_PENDING
  http_status: 409
  applies_to:
  - POST /car-share/members/{id}/driving-record-reports
- priority: 14
  category: business_constraint
  check: the membership tier and primary flag combination would leave a second ACTIVE primary membership for the same member
  error_id: ERR_DUPLICATE_PRIMARY_MEMBERSHIP
  http_status: 409
  applies_to:
  - POST /car-share/memberships
  - POST /car-share/memberships/{id}/close
- priority: 16
  category: business_safety
  check: the return pod equals the reservation's booked pod; returning to a different pod is refused
  error_id: ERR_WRONG_RETURN_POD
  http_status: 422
  applies_to:
  - POST /car-share/reservations/{id}/return
- priority: 17
  category: business_safety
  check: the reported odometer is not lower than the vehicle's odometer_miles; a lower reading is refused
  error_id: ERR_ODOMETER_REGRESSION
  http_status: 422
  applies_to:
  - POST /car-share/reservations/{id}/return
- priority: 23
  category: business_constraint
  check: the requested reservation interval [start_at, end_at) does not overlap an existing non-cancelled reservation for the same vehicle; the booked window is half-open, so an end_at exactly equal to another reservation's start_at is permitted and does not collide
  error_id: ERR_VEHICLE_DOUBLE_BOOKED
  http_status: 409
  applies_to:
  - POST /car-share/reservations
- priority: 24
  category: business_constraint
  check: the requested maintenance window [scheduled_start, scheduled_end) does not overlap an existing MaintenanceOrder row with status IN {SCHEDULED, BLOCKED, IN_PROGRESS} for the same vehicle, nor any Reservation row with status IN {CONFIRMED, IN_USE, OVERDUE}; adjacent windows with scheduled_end exactly equal to the other's scheduled_start do not collide
  error_id: ERR_MAINTENANCE_WINDOW_CONFLICT
  http_status: 409
  applies_to:
  - POST /car-share/maintenance-orders
- priority: 26
  category: business_constraint
  check: the destination pod has available_bays greater than 0; a pod at capacity is closed to placement, and a pod created with capacity 0 accepts no vehicle at all
  error_id: ERR_POD_CAPACITY_EXCEEDED
  http_status: 409
  applies_to:
  - POST /car-share/vehicles
  - POST /car-share/shift-bundles
- priority: 25
  category: business_constraint
  check: the relocation bundle's declared window [scheduled_start, scheduled_end) for a source vehicle does not overlap any Reservation row with status IN {HELD, CONFIRMED, IN_USE, OVERDUE} for that vehicle or any MaintenanceOrder row with status IN {SCHEDULED, BLOCKED, IN_PROGRESS}; a bundle window that fully contains a reservation window is a collision and an exactly adjacent window is not
  error_id: ERR_BUNDLE_WINDOW_CONFLICT
  http_status: 409
  applies_to:
  - POST /car-share/shift-bundles
- priority: 15
  category: business_constraint
  check: the account has at most one Membership row with primary_flag == true and status == ACTIVE per member, and the member's email is unique
  error_id: ERR_MEMBER_EMAIL_TAKEN
  http_status: 409
  applies_to:
  - POST /car-share/member-registrations
- priority: 27
  category: business_fiscal
  check: the acting member has wallet_credit_cents strictly less than the requested waiver amount; a partial balance cannot cover the waiver
  error_id: ERR_INSUFFICIENT_WALLET_CREDIT
  http_status: 422
  applies_to:
  - POST /car-share/incidents/{id}/waive-fee
- priority: 28
  category: business_fiscal
  check: the request would add a negative amount beyond the member's wallet_credit_cents, or a wallet adjustment amount of zero
  error_id: ERR_WALLET_ADJUSTMENT_INVALID
  http_status: 422
  applies_to:
  - POST /car-share/members/{id}/wallet-adjustments
- priority: 21
  category: business_referential
  check: the authority citation signature does not match the recoverable signer address
  error_id: ERR_CITATION_SIGNATURE_INVALID
  http_status: 422
  applies_to:
  - POST /car-share/citations/{id}/validate-signature
- priority: 7
  category: business_referential
  check: the acting operator identifier equals the incident's recorded member identifier (segregation of duties)
  error_id: ERR_SEGREGATION_OF_DUTIES
  http_status: 403
  applies_to:
  - POST /car-share/incidents/{id}/party-split
- priority: 22
  category: business_referential
  check: the return request's ambient loss estimate exceeds the incident's repair_cost_cents
  error_id: ERR_LOSS_EXCEEDS_REPAIR_COST
  http_status: 422
  applies_to:
  - POST /car-share/reservations/{id}/return
  - POST /car-share/incidents
- priority: 20
  category: business_temporal
  check: the transaction's reservation has already progressed past the point where its reading may be unwound, so the reversal is refused
  error_id: ERR_INVALID_STATE
  http_status: 409
  applies_to:
  - POST /car-share/fuel-card-transactions/{id}/reverse
- priority: 18
  category: business_temporal
  check: the current logical clock value is at or past Member.application_decided_at plus 24 hours; the early-grade revert window is half-open and its close instant is outside it
  error_id: ERR_REOPEN_WINDOW_CLOSED
  http_status: 409
  applies_to:
  - POST /car-share/members/{id}/reopen-application
- priority: 19
  category: business_temporal
  check: the incident's opening instant is in the future relative to the current logical clock value, so the party split cannot be time-ordered against the reservation window
  error_id: ERR_INCIDENT_IN_FUTURE
  http_status: 422
  applies_to:
  - POST /car-share/incidents/{id}/party-split
- priority: 29
  category: business_constraint
  check: expected_vehicle_version, expected_pod_version_profile or expected_incident_version does not equal the persisted version of the parent entity named by the corresponding concurrency rule
  error_id: ERR_STALE_VERSION
  http_status: 412
  applies_to:
  - POST /car-share/reservations
  - POST /car-share/shift-bundles
  - POST /car-share/incidents/{id}/party-split

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Member lifecycle ----
  - method: POST
    path: "/car-share/member-registrations"
    description: "Register a member application. Creates the Member in APPLIED with screen_result NONE; booking rights do not exist yet. kind INDIVIDUAL auto-creates the primary membership on approval, while kind STUDENT or EMPLOYEE defers membership creation to the account program."
    roles: [Anonymous]
    code: 201
    input:
      - full_name
      - email
      - kind
      - last_accident_fee_block?
    output: Member
    side_effects: ["Member.application_status = APPLIED", "Member.screen_result = NONE", "Member.strikes = 0", "Member.wallet_credit_cents = 0"]
  - method: GET
    path: "/car-share/members/{id}"
    description: "Read a member and its application posture."
    roles: [Member, PodOperator, UniversityAccountAdmin, FleetAdmin]
    code: 200
    input: []
    output: Member
    side_effects: []
  - method: GET
    path: "/car-share/members"
    description: "List members with optional application-posture filtering and pagination."
    roles: [PodOperator, UniversityAccountAdmin, FleetAdmin]
    code: 200
    input:
      - application_status?
      - kind?
      - limit?
      - offset?
    output: Member[]
    side_effects: []
  - method: POST
    path: "/car-share/members/{id}/driving-record-reports"
    description: "Submit the driving-record report for an APPLIED member, moving the application into SCREENING."
    roles: [Member]
    code: 201
    input:
      - license_state
      - license_years_held
      - report_decision?
    output: DrivingRecordReport
    side_effects: ["Member.application_status = SCREENING", "creates a DrivingRecordReport with report_status = SUBMITTED", "increments Member.version by 1"]
  - method: POST
    path: "/car-share/driving-record-reports/{id}/decision"
    description: "Record the screener decision on a driving-record report; drives Member.screen_result and therefore the approval path."
    roles: [PodOperator]
    code: 200
    input:
      - report_decision
    output: DrivingRecordReport
    side_effects: ["DrivingRecordReport.report_decision = the supplied decision", "DrivingRecordReport.report_status = RECORDED", "DrivingRecordReport.screen_completed_at = current logical clock value", "sets Member.screen_result to the supplied decision", "increments Member.version by 1"]
  - method: POST
    path: "/car-share/members/{id}/application-decision"
    description: "Approve or decline a SCREENING application; approval creates the primary Membership and is the only path to booking rights."
    roles: [PodOperator]
    code: 200
    input:
      - decision
    output: Member
    side_effects: ["Member.application_status = APPROVED or DECLINED", "supplies the C3 damage-fee screening input via Member.screen_result", "Member.application_decided_at = current logical clock value", "creates a Membership with tier STANDARD and primary_flag true on approval", "closes every ACTIVE or SUSPENDED membership on decline", "increments Member.version by 1"]
  - method: POST
    path: "/car-share/members/{id}/reopen-application"
    description: "System early-grade revert: returns an APPROVED application to SCREENING inside the half-open 24-hour window, closing the primary membership."
    roles: [PodOperator]
    code: 200
    input: []
    output: Member
    side_effects: ["Member.application_status = SCREENING", "closes every ACTIVE membership", "Member.application_decided_at = null", "supplies the C3 early-grade screening deadline", "increments Member.version by 1"]
  - method: POST
    path: "/car-share/members/{id}/wallet-adjustments"
    description: "Operator business endpoint: credit or debit a member wallet outside the automatic penalty paths."
    roles: [PodOperator]
    code: 200
    input:
      - amount_cents
      - reason
    output: Member
    side_effects: ["Member.wallet_credit_cents adjusted by amount_cents", "supplies the C7 conserved-quantity baseline", "increments Member.version by 1"]
  - method: GET
    path: "/car-share/members/{id}/memberships"
    description: "Reverse-reachability list: every Membership row for this member."
    roles: [Member, PodOperator, UniversityAccountAdmin, FleetAdmin]
    code: 200
    input: []
    output: Membership[]
    side_effects: []
  - method: GET
    path: "/car-share/members/{id}/driving-record-reports"
