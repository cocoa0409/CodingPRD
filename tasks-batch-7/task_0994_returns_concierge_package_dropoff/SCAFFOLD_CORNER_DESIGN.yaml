      - name: charge_preview_on_closing_cycle_rejected
        claim_type: conditional_action
        grounds: ["validations[priority=6]", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "charge-preview is defined only on OPEN cycles; after close it fails with ERR_INVALID_STATE."
        test_recipe:
