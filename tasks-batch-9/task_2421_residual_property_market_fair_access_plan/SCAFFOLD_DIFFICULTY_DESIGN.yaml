# Scaffold Difficulty Design — task_2421 Residual Property Market & Fair Access Plan
# Test-targeting index for SCAFFOLD.yaml §1.1–§1.7. Nine §0.5 rule_ids, >= 2 instances each.
# All money/ratio literals in `assert:` lines were computed by executing the §1.3 formulas
# (Decimal, ROUND_HALF_UP) against the fixtures pinned in each `setup_api_calls:` chain.
# Default logical clock is 2026-08-01T00:00:00Z; every chain moves it to 2026-09-01T00:00:00Z first.

scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: premium_provisional_quote_versus_bound_final_divergence
        grounds:
          - calculations.policy_annual_premium
          - calculations.voluntary_market_comparison
          - entities.Application.fields.quoted_annual_premium_cents
          - entities.Application.fields.voluntary_equivalent_premium_cents
          - entities.Policy.fields.annual_premium_cents
          - state_machines.Application.APPROVED_TO_BIND_to_BOUND
        distinguishing_aspect: |
          Both variants live in the premium/underwriting entity domain (Application quote vs Policy
          rating): PROVISIONAL_QUOTE keys the condition tier on the producer-reported
          Property.condition_score (88 -> -10%) while BOUND_FINAL keys it on the inspector-observed
          Inspection.observed_condition_score (72 -> -5%), so identical dwelling limit and identical
          approved filing yield 546750 vs 577125 on the same application.
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z; three ACTIVE member insurers; one HURRICANE zone with a 100000000 cap and zero bound exposure (concentration_ratio 0.0000)."
            - "One APPOINTED STANDARD-tier producer; one APPROVED BASIC_FIRE_EO filing on the zone at filed 900 / voluntary 800 effective 2026-08-01."
            - "One FRAME / OWNER_OCCUPIED property with reported condition_score 88; one application for 54000000 of BASIC_FIRE_EO with three verified declinations dated 2026-07-03; eligibility ADVANCEd by underwriter uw-1; inspection completed PASS with observed_condition_score 72 and no requirements, so the application sits in APPROVED_TO_BIND."
          setup_api_calls:
            - call: "POST /fair-plan/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlanAdmin
            - call: "POST /fair-plan/member-insurers"
              payload: { name: "Carrier One", naic_code: "10001", market_share_pct: 30.00, written_premium_share_pct: 10.00 }
              as: PlanAdmin
              captures: { m1_id: $.data.id }
            - call: "POST /fair-plan/member-insurers"
              payload: { name: "Carrier Two", naic_code: "10002", market_share_pct: 30.00, written_premium_share_pct: 10.00 }
              as: PlanAdmin
              captures: { m2_id: $.data.id }
            - call: "POST /fair-plan/member-insurers"
              payload: { name: "Carrier Three", naic_code: "10003", market_share_pct: 40.00, written_premium_share_pct: 80.00 }
              as: PlanAdmin
              captures: { m3_id: $.data.id }
            - call: "POST /fair-plan/cat-zones"
              payload: { code: "HUR-01", peril: "HURRICANE", exposure_cap_cents: 100000000, restricted_min_condition_score: 70 }
              as: PlanAdmin
              captures: { zone_id: $.data.id, zone_v: $.data.version }
            - call: "POST /fair-plan/producers"
              payload: { full_name: "Pat Agent", license_number: "P-1001", commission_tier: "STANDARD", e_and_o_expiry_date: "2027-06-30" }
              as: PlanAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /fair-plan/producers/${prod_id}/agreement-execution"
              payload: { agreement_effective_date: "2026-08-01" }
              as: PlanAdmin
            - call: "POST /fair-plan/rate-filings"
              payload: { cat_zone_id: "${zone_id}", peril_package: "BASIC_FIRE_EO", filed_rate_per_1000_cents: 900, voluntary_market_avg_rate_per_1000_cents: 800, effective_date: "2026-08-01", expected_zone_version: "${zone_v}" }
              as: RateAnalyst
              as_user_id: "ra-1"
              captures: { filing_id: $.data.id }
            - call: "POST /fair-plan/rate-filings/${filing_id}/review"
              payload: { decision: "APPROVE" }
              as: Regulator
              as_user_id: "reg-1"
            - call: "POST /fair-plan/applicants"
              payload: { full_name: "Ann Owner", email: "ann@example.com" }
              as: Producer
              as_user_id: "${prod_id}"
              captures: { appl_id: $.data.id }
            - call: "POST /fair-plan/properties"
              payload: { cat_zone_id: "${zone_id}", address_line: "1 Shore Rd", zip_code: "33101", construction_type: "FRAME", roof_age_years: 12, replacement_cost_cents: 100000000, condition_score: 88, occupancy: "OWNER_OCCUPIED" }
              as: Producer
              as_user_id: "${prod_id}"
              captures: { prop_id: $.data.id }
            - call: "POST /fair-plan/applications"
              payload: { property_id: "${prop_id}", applicant_id: "${appl_id}", requested_dwelling_limit_cents: 54000000, requested_peril_package: "BASIC_FIRE_EO" }
              as: Producer
              as_user_id: "${prod_id}"
              captures: { app_id: $.data.id }
            - call: "POST /fair-plan/applications/${app_id}/declinations"
              payload: { member_insurer_id: "${m1_id}", declined_on: "2026-07-03", reason_code: "CAT_EXPOSURE", evidence_reference: "DEC-1" }
              as: Producer
              as_user_id: "${prod_id}"
            - call: "POST /fair-plan/applications/${app_id}/declinations"
              payload: { member_insurer_id: "${m2_id}", declined_on: "2026-07-03", reason_code: "APPETITE", evidence_reference: "DEC-2" }
              as: Producer
              as_user_id: "${prod_id}"
            - call: "POST /fair-plan/applications/${app_id}/declinations"
              payload: { member_insurer_id: "${m3_id}", declined_on: "2026-07-03", reason_code: "CONDITION", evidence_reference: "DEC-3" }
              as: Producer
              as_user_id: "${prod_id}"
            - call: "POST /fair-plan/applications/${app_id}/submission"
              payload: {}
              as: Producer
              as_user_id: "${prod_id}"
            - call: "POST /fair-plan/applications/${app_id}/eligibility-review"
              payload: { decision: "ADVANCE" }
              as: Underwriter
              as_user_id: "uw-1"
            - call: "POST /fair-plan/applications/${app_id}/inspections"
              payload: { scheduled_for: "2026-09-05" }
              as: Underwriter
              as_user_id: "uw-1"
              captures: { insp_id: $.data.id }
            - call: "POST /fair-plan/inspections/${insp_id}/completion"
              payload: { observed_condition_score: 72, result: "PASS" }
              as: Inspector
              as_user_id: "insp-1"
          trigger:
            - call: "POST /fair-plan/policies"
              payload: { application_id: "${app_id}", effective_date: "2026-09-01" }
              as: Underwriter
              as_user_id: "uw-2"
              captures: { pol_id: $.data.id }
          assert:
            - "Application.${app_id}.quoted_annual_premium_cents == 546750"
            - "Application.${app_id}.voluntary_equivalent_premium_cents == 486000"
            - "Application.${app_id}.voluntary_market_comparison_pct == 0.1250"
            - "Application.${app_id}.quote_rate_filing_id == ${filing_id}"
            - "Policy.${pol_id}.base_premium_cents == 607500"
            - "Policy.${pol_id}.cat_surcharge_cents == 0"
            - "Policy.${pol_id}.annual_premium_cents == 577125"
            - "Policy.${pol_id}.condition_score_at_bind == 72"
            - "Policy.${pol_id}.annual_premium_cents != Application.${app_id}.quoted_annual_premium_cents"
            - "Application.${app_id}.status == BOUND"

      - name: allocation_market_share_versus_premium_volume_divergence
        grounds:
          - calculations.assessment_allocation_shares
          - entities.AssessmentEvent.fields.allocation_basis
          - entities.AssessmentAllocation.fields.basis_weight_pct
          - entities.AssessmentAllocation.fields.gross_share_cents
          - state_machines.AssessmentEvent.DRAFT_to_ALLOCATED
        distinguishing_aspect: |
          Both variants live in the member-insurer solvency/assessment entity domain (MemberInsurer
          weights -> AssessmentAllocation rows), a different domain from the premium instance: on the
          identical 100000001 assessable amount MARKET_SHARE assesses Carrier Three 40000001 while
          PREMIUM_VOLUME assesses the same carrier 80000001, and the snapshotted basis_weight_pct
          differs (40.00 vs 80.00) on rows for the same member.
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z; three ACTIVE member insurers with market_share_pct 30/30/40 and written_premium_share_pct 10/10/80; one HURRICANE zone."
            - "One MARKET_SHARE assessment event with trigger_loss 150000001 and reserves 50000000 (assessable 100000001) already ALLOCATED."
          setup_api_calls:
            - call: "POST /fair-plan/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlanAdmin
            - call: "POST /fair-plan/member-insurers"
              payload: { name: "Carrier One", naic_code: "10001", market_share_pct: 30.00, written_premium_share_pct: 10.00 }
              as: PlanAdmin
              captures: { m1_id: $.data.id }
            - call: "POST /fair-plan/member-insurers"
              payload: { name: "Carrier Two", naic_code: "10002", market_share_pct: 30.00, written_premium_share_pct: 10.00 }
              as: PlanAdmin
              captures: { m2_id: $.data.id }
            - call: "POST /fair-plan/member-insurers"
              payload: { name: "Carrier Three", naic_code: "10003", market_share_pct: 40.00, written_premium_share_pct: 80.00 }
              as: PlanAdmin
              captures: { m3_id: $.data.id }
            - call: "POST /fair-plan/cat-zones"
              payload: { code: "HUR-01", peril: "HURRICANE", exposure_cap_cents: 100000000 }
              as: PlanAdmin
              captures: { zone_id: $.data.id }
            - call: "POST /fair-plan/assessment-events"
              payload: { cat_zone_id: "${zone_id}", trigger_loss_cents: 150000001, reserve_balance_cents_at_trigger: 50000000, allocation_basis: "MARKET_SHARE" }
              as: PlanAdmin
              captures: { ev_ms_id: $.data.id, ev_ms_v: $.data.version }
            - call: "POST /fair-plan/assessment-events/${ev_ms_id}/allocation-run"
              payload: { expected_assessment_event_version: "${ev_ms_v}" }
              as: PlanAdmin
          trigger:
            - call: "POST /fair-plan/assessment-events"
              payload: { cat_zone_id: "${zone_id}", trigger_loss_cents: 150000001, reserve_balance_cents_at_trigger: 50000000, allocation_basis: "PREMIUM_VOLUME" }
              as: PlanAdmin
              captures: { ev_pv_id: $.data.id, ev_pv_v: $.data.version }
            - call: "POST /fair-plan/assessment-events/${ev_pv_id}/allocation-run"
              payload: { expected_assessment_event_version: "${ev_pv_v}" }
              as: PlanAdmin
          assert:
            - "AssessmentEvent.${ev_ms_id}.assessable_amount_cents == 100000001"
            - "AssessmentEvent.${ev_pv_id}.assessable_amount_cents == 100000001"
            - "AssessmentAllocation(assessment_event_id=${ev_ms_id}, member_insurer_id=${m3_id}).gross_share_cents == 40000001"
            - "AssessmentAllocation(assessment_event_id=${ev_ms_id}, member_insurer_id=${m3_id}).basis_weight_pct == 40.00"
            - "AssessmentAllocation(assessment_event_id=${ev_ms_id}, member_insurer_id=${m1_id}).gross_share_cents == 30000000"
            - "AssessmentAllocation(assessment_event_id=${ev_pv_id}, member_insurer_id=${m3_id}).gross_share_cents == 80000001"
            - "AssessmentAllocation(assessment_event_id=${ev_pv_id}, member_insurer_id=${m3_id}).basis_weight_pct == 80.00"
            - "AssessmentAllocation(assessment_event_id=${ev_pv_id}, member_insurer_id=${m1_id}).gross_share_cents == 10000000"
            - "AssessmentEvent.${ev_ms_id}.allocated_total_cents == 100000001"
            - "AssessmentEvent.${ev_pv_id}.allocated_total_cents == 100000001"
            - "MemberInsurer.${m3_id}.cumulative_assessed_cents == 120000002"

  - rule_id: combinatorial_formula
    instances:
      - name: premium_clamped_cat_surcharge_over_five_inputs
        grounds:
          - calculations.policy_annual_premium
          - calculations.zone_concentration_posture
          - entities.CatastropheZone.fields.concentration_ratio
          - entities.Policy.fields.cat_surcharge_cents
          - validations[priority=28]
        distinguishing_aspect: |
          Mode (a) — three or more inputs combined non-linearly: filed rate, dwelling limit,
          construction factor, occupancy factor, package factor and the zone concentration_ratio all
          feed one premium through a min/max-clamped surcharge, so at ratio 0.8500 the surcharge is
          min(0.25, max(0, (0.8500 - 0.60) * 0.45)) = 0.1125 and the answer is 135169, not the
          unclamped or linear-in-ratio alternatives.
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z; three ACTIVE member insurers; HURRICANE zone HUR-01 with exposure_cap_cents 100000000 and restricted_min_condition_score 70; APPOINTED STANDARD producer; APPROVED BASIC_FIRE_EO filing at 900 / 800."
            - "A first MASONRY policy for 85000000 already written in the zone — bound on the clock date, so it lands directly in IN_FORCE — which drives aggregate_insured_value_cents to 85000000 and concentration_ratio to 0.8500 (zone status RESTRICTED)."
            - "A second MASONRY / OWNER_OCCUPIED property with reported condition_score 88 and a second application for 15000000 of BASIC_FIRE_EO in APPROVED_TO_BIND, inspection observed_condition_score 88, PASS, no requirements."
          setup_api_calls:
            - call: "POST /fair-plan/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlanAdmin
            - call: "POST /fair-plan/member-insurers"
              payload: { name: "Carrier One", naic_code: "10001", market_share_pct: 30.00, written_premium_share_pct: 10.00 }
              as: PlanAdmin
              captures: { m1_id: $.data.id }
            - call: "POST /fair-plan/member-insurers"
              payload: { name: "Carrier Two", naic_code: "10002", market_share_pct: 30.00, written_premium_share_pct: 10.00 }
              as: PlanAdmin
              captures: { m2_id: $.data.id }
            - call: "POST /fair-plan/member-insurers"
              payload: { name: "Carrier Three", naic_code: "10003", market_share_pct: 40.00, written_premium_share_pct: 80.00 }
              as: PlanAdmin
              captures: { m3_id: $.data.id }
            - call: "POST /fair-plan/cat-zones"
              payload: { code: "HUR-01", peril: "HURRICANE", exposure_cap_cents: 100000000, restricted_min_condition_score: 70 }
              as: PlanAdmin
              captures: { zone_id: $.data.id, zone_v: $.data.version }
            - call: "POST /fair-plan/producers"
              payload: { full_name: "Pat Agent", license_number: "P-1001", commission_tier: "STANDARD", e_and_o_expiry_date: "2027-06-30" }
              as: PlanAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /fair-plan/producers/${prod_id}/agreement-execution"
              payload: { agreement_effective_date: "2026-08-01" }
              as: PlanAdmin
            - call: "POST /fair-plan/rate-filings"
              payload: { cat_zone_id: "${zone_id}", peril_package: "BASIC_FIRE_EO", filed_rate_per_1000_cents: 900, voluntary_market_avg_rate_per_1000_cents: 800, effective_date: "2026-08-01", expected_zone_version: "${zone_v}" }
              as: RateAnalyst
              as_user_id: "ra-1"
              captures: { filing_id: $.data.id }
            - call: "POST /fair-plan/rate-filings/${filing_id}/review"
              payload: { decision: "APPROVE" }
              as: Regulator
              as_user_id: "reg-1"
            - call: "POST /fair-plan/applicants"
              payload: { full_name: "Ann Owner", email: "ann@example.com" }
              as: Producer
              as_user_id: "${prod_id}"
              captures: { appl_id: $.data.id }
            - call: "POST /fair-plan/properties"
              payload: { cat_zone_id: "${zone_id}", address_line: "1 Shore Rd", zip_code: "33101", construction_type: "MASONRY", roof_age_years: 6, replacement_cost_cents: 100000000, condition_score: 88, occupancy: "OWNER_OCCUPIED" }
              as: Producer
              as_user_id: "${prod_id}"
              captures: { prop_big_id: $.data.id }
            - call: "POST /fair-plan/applications"
              payload: { property_id: "${prop_big_id}", applicant_id: "${appl_id}", requested_dwelling_limit_cents: 85000000, requested_peril_package: "BASIC_FIRE_EO" }
              as: Producer
              as_user_id: "${prod_id}"
              captures: { app_big_id: $.data.id }
            - call: "POST /fair-plan/applications/${app_big_id}/declinations"
              payload: { member_insurer_id: "${m1_id}", declined_on: "2026-07-03", reason_code: "CAT_EXPOSURE", evidence_reference: "DEC-B1" }
              as: Producer
              as_user_id: "${prod_id}"
            - call: "POST /fair-plan/applications/${app_big_id}/declinations"
              payload: { member_insurer_id: "${m2_id}", declined_on: "2026-07-03", reason_code: "APPETITE", evidence_reference: "DEC-B2" }
              as: Producer
              as_user_id: "${prod_id}"
            - call: "POST /fair-plan/applications/${app_big_id}/declinations"
              payload: { member_insurer_id: "${m3_id}", declined_on: "2026-07-03", reason_code: "CONDITION", evidence_reference: "DEC-B3" }
              as: Producer
              as_user_id: "${prod_id}"
            - call: "POST /fair-plan/applications/${app_big_id}/submission"
              payload: {}
              as: Producer
              as_user_id: "${prod_id}"
            - call: "POST /fair-plan/applications/${app_big_id}/eligibility-review"
              payload: { decision: "ADVANCE" }
              as: Underwriter
              as_user_id: "uw-1"
            - call: "POST /fair-plan/applications/${app_big_id}/inspections"
              payload: {}
              as: Underwriter
              as_user_id: "uw-1"
              captures: { insp_big_id: $.data.id }
            - call: "POST /fair-plan/inspections/${insp_big_id}/completion"
              payload: { observed_condition_score: 88, result: "PASS" }
              as: Inspector
              as_user_id: "insp-1"
            - call: "POST /fair-plan/policies"
              payload: { application_id: "${app_big_id}", effective_date: "2026-09-01" }
              as: Underwriter
              as_user_id: "uw-2"
              captures: { pol_big_id: $.data.id }
            - call: "POST /fair-plan/properties"
              payload: { cat_zone_id: "${zone_id}", address_line: "2 Shore Rd", zip_code: "33101", construction_type: "MASONRY", roof_age_years: 4, replacement_cost_cents: 20000000, condition_score: 88, occupancy: "OWNER_OCCUPIED" }
              as: Producer
              as_user_id: "${prod_id}"
              captures: { prop_small_id: $.data.id }
            - call: "POST /fair-plan/applications"
              payload: { property_id: "${prop_small_id}", applicant_id: "${appl_id}", requested_dwelling_limit_cents: 15000000, requested_peril_package: "BASIC_FIRE_EO" }
              as: Producer
              as_user_id: "${prod_id}"
              captures: { app_small_id: $.data.id }
            - call: "POST /fair-plan/applications/${app_small_id}/declinations"
              payload: { member_insurer_id: "${m1_id}", declined_on: "2026-07-03", reason_code: "CAT_EXPOSURE", evidence_reference: "DEC-S1" }
              as: Producer
              as_user_id: "${prod_id}"
            - call: "POST /fair-plan/applications/${app_small_id}/declinations"
              payload: { member_insurer_id: "${m2_id}", declined_on: "2026-07-03", reason_code: "APPETITE", evidence_reference: "DEC-S2" }
              as: Producer
              as_user_id: "${prod_id}"
            - call: "POST /fair-plan/applications/${app_small_id}/declinations"
              payload: { member_insurer_id: "${m3_id}", declined_on: "2026-07-03", reason_code: "CONDITION", evidence_reference: "DEC-S3" }
              as: Producer
              as_user_id: "${prod_id}"
            - call: "POST /fair-plan/applications/${app_small_id}/submission"
              payload: {}
              as: Producer
              as_user_id: "${prod_id}"
            - call: "POST /fair-plan/applications/${app_small_id}/eligibility-review"
              payload: { decision: "ADVANCE" }
              as: Underwriter
              as_user_id: "uw-1"
            - call: "POST /fair-plan/applications/${app_small_id}/inspections"
              payload: {}
              as: Underwriter
              as_user_id: "uw-1"
              captures: { insp_small_id: $.data.id }
            - call: "POST /fair-plan/inspections/${insp_small_id}/completion"
              payload: { observed_condition_score: 88, result: "PASS" }
              as: Inspector
              as_user_id: "insp-1"
          trigger:
            - call: "POST /fair-plan/policies"
              payload: { application_id: "${app_small_id}", effective_date: "2026-09-01" }
              as: Underwriter
              as_user_id: "uw-2"
              captures: { pol_small_id: $.data.id }
          assert:
            - "Policy.${pol_big_id}.annual_premium_cents == 688500"
            - "Policy.${pol_big_id}.cat_surcharge_cents == 0"
            - "CatastropheZone.${zone_id}.concentration_ratio == 0.8500 before the trigger call"
            - "Application.${app_small_id}.quoted_annual_premium_cents == 135169"
            - "Application.${app_small_id}.voluntary_equivalent_premium_cents == 120150"
            - "Application.${app_small_id}.voluntary_market_comparison_pct == 0.1250"
            - "Policy.${pol_small_id}.base_premium_cents == 135000"
            - "Policy.${pol_small_id}.cat_surcharge_cents == 15188"
            - "Policy.${pol_small_id}.annual_premium_cents == 135169"
            - "CatastropheZone.${zone_id}.aggregate_insured_value_cents == 100000000"
            - "CatastropheZone.${zone_id}.concentration_ratio == 1.0000"
            - "CatastropheZone.${zone_id}.status == CLOSED"

      - name: allocation_round_each_share_then_absorb_negative_remainder
        grounds:
          - calculations.assessment_allocation_shares
          - entities.AssessmentEvent.fields.remainder_cents
          - entities.AssessmentAllocation.fields.gross_share_cents
          - state_machines.MemberInsurer.RUNOFF_to_WITHDRAWN
        distinguishing_aspect: |
          Mode (b) — nested rounding order: with two eligible members at weight 30.00 each and an
          assessable amount of 100000001, each raw share is 50000000.5, which rounds half-up to
          50000001 per member FIRST, producing a NEGATIVE remainder of -1 that the greatest-weight
          member (tie-broken to the earliest created_at, Carrier One) absorbs down to 50000000; a
          sum-then-round implementation yields 50000000 / 50000001 with remainder 0 and fails.
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z; three member insurers created in order Carrier One, Carrier Two, Carrier Three with market_share_pct 30.00 / 30.00 / 40.00."
            - "One MARKET_SHARE assessment event in DRAFT with trigger_loss 150000001 and reserves 50000000 (assessable 100000001)."
            - "Carrier Three is then moved ACTIVE -> RUNOFF -> WITHDRAWN, so only the two 30.00-weight carriers remain eligible and total_weight is 60.00."
          setup_api_calls:
            - call: "POST /fair-plan/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlanAdmin
            - call: "POST /fair-plan/member-insurers"
              payload: { name: "Carrier One", naic_code: "10001", market_share_pct: 30.00, written_premium_share_pct: 10.00 }
              as: PlanAdmin
              captures: { m1_id: $.data.id }
            - call: "POST /fair-plan/member-insurers"
              payload: { name: "Carrier Two", naic_code: "10002", market_share_pct: 30.00, written_premium_share_pct: 10.00 }
              as: PlanAdmin
              captures: { m2_id: $.data.id }
            - call: "POST /fair-plan/member-insurers"
