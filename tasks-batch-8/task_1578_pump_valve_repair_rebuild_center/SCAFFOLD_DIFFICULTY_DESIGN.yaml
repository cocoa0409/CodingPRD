            - { call: "POST /capacity-windows", payload: { label: "W1", window_start: "2026-06-01T00:00:00Z", window_end: "2026-07-01T00:00:00Z", bay_hours_capacity: 1000 }, as: Planner, captures: { win: $.data.id } }
            - { call: "POST /assets", payload: { customer_id: "${cust}", serial_number: "V-6001", equipment_class: "GENERAL_VALVE", manufacturer: "Flowserve", model: "G1" }, as: IntakeCoordinator, captures: { a1: $.data.id } }
            - { call: "POST /assets", payload: { customer_id: "${cust}", serial_number: "V-6002", equipment_class: "GENERAL_VALVE", manufacturer: "Flowserve", model: "G1" }, as: IntakeCoordinator, captures: { a2: $.data.id } }
            - { call: "POST /repair-orders", payload: { customer_id: "${cust}", asset_id: "${a1}", failure_mode: "SEAT_LEAKAGE", failure_description: "passing", intake_priority: "STANDARD", planned_start_date: "2026-08-10", planned_end_date: "2026-08-20", estimated_bay_hours: 40 }, as: IntakeCoordinator, captures: { ro1: $.data.id } }
            - { call: "POST /repair-orders/${ro1}/start-teardown", payload: {}, as: IntakeCoordinator }
            - { call: "POST /repair-orders/${ro1}/inspection-reports", payload: { findings_summary: "seat scored", recommended_action: "REPAIR", estimated_labor_hours: 4, part_lines: [] }, as: Inspector, captures: { rep1: $.data.id } }
            - { call: "POST /inspection-reports/${rep1}/finalize", payload: {}, as: Inspector }
            - { call: "GET /repair-orders/${ro1}", payload: {}, as: ServiceManager, captures: { ro1_v: $.data.version } }
            - { call: "POST /quotes", payload: { repair_order_id: "${ro1}", capacity_window_id: "${win}", labor_hours: 4, labor_rate_cents: 20000, part_lines: [], expected_repair_order_version: "${ro1_v}" }, as: ServiceManager, captures: { q1: $.data.id } }
            - { call: "POST /quotes/${q1}/issue", payload: {}, as: ServiceManager }
            - { call: "POST /quotes/${q1}/request-revision", payload: {}, as: Customer, as_user_id: "${cust}" }
            - { call: "GET /repair-orders/${ro1}", payload: {}, as: ServiceManager, captures: { ro1_v2: $.data.version } }
            - { call: "POST /quotes", payload: { repair_order_id: "${ro1}", capacity_window_id: "${win}", labor_hours: 3, labor_rate_cents: 20000, part_lines: [], expected_repair_order_version: "${ro1_v2}" }, as: ServiceManager, captures: { q2: $.data.id, q2_rev: $.data.revision, q2_sup: $.data.supersedes_quote_id } }
            - { call: "POST /quotes/${q2}/issue", payload: {}, as: ServiceManager }
            - { call: "POST /repair-orders", payload: { customer_id: "${cust}", asset_id: "${a2}", failure_mode: "SEAT_LEAKAGE", failure_description: "passing", intake_priority: "STANDARD", planned_start_date: "2026-08-10", planned_end_date: "2026-08-20", estimated_bay_hours: 30 }, as: IntakeCoordinator, captures: { ro2: $.data.id } }
            - { call: "POST /repair-orders/${ro2}/start-teardown", payload: {}, as: IntakeCoordinator }
            - { call: "POST /repair-orders/${ro2}/inspection-reports", payload: { findings_summary: "uneconomical", recommended_action: "RETURN_UNREPAIRED", estimated_labor_hours: 3, part_lines: [] }, as: Inspector, captures: { rep2: $.data.id } }
            - { call: "POST /inspection-reports/${rep2}/finalize", payload: {}, as: Inspector }
            - { call: "GET /repair-orders/${ro2}", payload: {}, as: ServiceManager, captures: { ro2_v: $.data.version } }
            - { call: "POST /quotes", payload: { repair_order_id: "${ro2}", capacity_window_id: "${win}", labor_hours: 3, labor_rate_cents: 20000, part_lines: [], expected_repair_order_version: "${ro2_v}" }, as: ServiceManager, captures: { q3: $.data.id } }
            - { call: "POST /quotes/${q3}/issue", payload: {}, as: ServiceManager }
          trigger:
            - { call: "POST /quotes/${q2}/approve", payload: {}, as: Customer, as_user_id: "${cust}" }
            - { call: "POST /quotes/${q3}/decline", payload: {}, as: Customer, as_user_id: "${cust}" }
          assert:
            - "Quote.${q1}.status == SUPERSEDED"
            - "Quote.${q2}.revision == 2 and Quote.${q2}.supersedes_quote_id == ${q1}"
            - "Quote.${q2}.status == APPROVED and RepairOrder.${ro1}.status == AUTHORIZED"
            - "CapacityWindow.${win}.bay_hours_reserved == 40"
            - "Quote.${q3}.status == DECLINED and RepairOrder.${ro2}.status == CANCELLED"
            - "CapacityWindow.${win}.bay_hours_reserved == 40 (declined branch reserved nothing)"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: quote_approval_capacity_posture_cascade
        grounds:
          - state_machines.Quote.ISSUED_to_APPROVED
          - state_machines.RepairOrder.QUOTE_IN_PROGRESS_to_AUTHORIZED
          - calculations.bay_hours_reserved
          - calculations.window_posture
        distinguishing_aspect: |
          Depth-3 cascade originating at Quote approval: Quote ISSUED -> APPROVED
          mutates RepairOrder (-> AUTHORIZED, link 1); the authorization reserves
          hours on CapacityWindow (reserved 0 -> 85, link 2); the hours change
          recomputes window_posture NORMAL -> SURGE (85 >= ceil(0.8*100), link 3).
          Different trigger from the part-obsolescence cascade instance.
        test_recipe:
          setup:
            - "Customer, PUMP asset, window capacity 100 (posture NORMAL, reserved 0)"
            - "RO with estimated_bay_hours 85 quoted (total within credit) and quote ISSUED"
          setup_api_calls:
            - { call: "POST /customers", payload: { name: "Iron Ridge Mining", account_number: "IR-700", credit_limit_cents: 99999999, warranty_terms_days: 365, pool_program: false }, as: ServiceManager, captures: { cust: $.data.id } }
            - { call: "POST /assets", payload: { customer_id: "${cust}", serial_number: "P-7001", equipment_class: "PUMP", manufacturer: "Flowserve", model: "M2", rated_flow_gpm: 500 }, as: IntakeCoordinator, captures: { asset: $.data.id } }
            - { call: "POST /capacity-windows", payload: { label: "W1", window_start: "2026-06-01T00:00:00Z", window_end: "2026-07-01T00:00:00Z", bay_hours_capacity: 100 }, as: Planner, captures: { win: $.data.id } }
            - { call: "POST /repair-orders", payload: { customer_id: "${cust}", asset_id: "${asset}", failure_mode: "BEARING_FAILURE", failure_description: "vibration", intake_priority: "STANDARD", planned_start_date: "2026-08-10", planned_end_date: "2026-08-20", estimated_bay_hours: 85 }, as: IntakeCoordinator, captures: { ro: $.data.id } }
            - { call: "POST /repair-orders/${ro}/start-teardown", payload: {}, as: IntakeCoordinator }
            - { call: "POST /repair-orders/${ro}/inspection-reports", payload: { findings_summary: "bearings worn", recommended_action: "REPAIR", estimated_labor_hours: 20, part_lines: [] }, as: Inspector, captures: { rep: $.data.id } }
            - { call: "POST /inspection-reports/${rep}/finalize", payload: {}, as: Inspector }
            - { call: "GET /repair-orders/${ro}", payload: {}, as: ServiceManager, captures: { ro_v: $.data.version } }
            - { call: "POST /quotes", payload: { repair_order_id: "${ro}", capacity_window_id: "${win}", labor_hours: 20, labor_rate_cents: 20000, part_lines: [], expected_repair_order_version: "${ro_v}" }, as: ServiceManager, captures: { q: $.data.id } }
            - { call: "POST /quotes/${q}/issue", payload: {}, as: ServiceManager }
          trigger:
            - { call: "POST /quotes/${q}/approve", payload: {}, as: Customer, as_user_id: "${cust}" }
            - { call: "GET /capacity-windows/${win}", payload: {}, as: ServiceManager, captures: { win_reserved: $.data.bay_hours_reserved, win_posture: $.data.window_posture } }
          assert:
            - "Quote.${q}.status == APPROVED"
            - "RepairOrder.${ro}.status == AUTHORIZED and RepairOrder.${ro}.capacity_window_id == ${win}"
            - "CapacityWindow.${win}.bay_hours_reserved == 85"
            - "CapacityWindow.${win}.window_posture == SURGE"

      - name: part_obsolescence_forces_quote_revision_cascade
        grounds:
          - state_machines.Part.ACTIVE_to_OBSOLETE
          - state_machines.Quote.ISSUED_to_REVISION_REQUESTED
          - entities.RepairOrder.fields.quote_attention_required
        distinguishing_aspect: |
          Depth-2 cascade originating at POST /parts/{id}/mark-obsolete (a different
          trigger than quote approval): Part -> OBSOLETE mutates open Quotes
          (matching part_lines flagged substitution_required, link 1); the flag on
          an ISSUED quote itself forces Quote -> REVISION_REQUESTED and sets
          RepairOrder.quote_attention_required := true (link 2).
        test_recipe:
          setup:
            - "Customer, GENERAL_VALVE asset, window capacity 1000, Part P1 ACTIVE"
            - "RO quoted with part_lines containing P1; quote ISSUED"
          setup_api_calls:
            - { call: "POST /customers", payload: { name: "Juniper Power", account_number: "JP-800", credit_limit_cents: 99999999, warranty_terms_days: 365, pool_program: false }, as: ServiceManager, captures: { cust: $.data.id } }
            - { call: "POST /assets", payload: { customer_id: "${cust}", serial_number: "V-8001", equipment_class: "GENERAL_VALVE", manufacturer: "Flowserve", model: "G1" }, as: IntakeCoordinator, captures: { asset: $.data.id } }
            - { call: "POST /capacity-windows", payload: { label: "W1", window_start: "2026-06-01T00:00:00Z", window_end: "2026-07-01T00:00:00Z", bay_hours_capacity: 1000 }, as: Planner, captures: { win: $.data.id } }
            - { call: "POST /parts", payload: { part_number: "TRIM-9", description: "Valve trim", unit_price_cents: 5000 }, as: ServiceManager, captures: { p1: $.data.id } }
            - { call: "POST /repair-orders", payload: { customer_id: "${cust}", asset_id: "${asset}", failure_mode: "SEAT_LEAKAGE", failure_description: "passing", intake_priority: "STANDARD", planned_start_date: "2026-08-10", planned_end_date: "2026-08-20", estimated_bay_hours: 10 }, as: IntakeCoordinator, captures: { ro: $.data.id } }
            - { call: "POST /repair-orders/${ro}/start-teardown", payload: {}, as: IntakeCoordinator }
            - { call: "POST /repair-orders/${ro}/inspection-reports", payload: { findings_summary: "trim worn", recommended_action: "REPAIR", estimated_labor_hours: 2, part_lines: [ { part_id: "${p1}", quantity: 1 } ] }, as: Inspector, captures: { rep: $.data.id } }
            - { call: "POST /inspection-reports/${rep}/finalize", payload: {}, as: Inspector }
            - { call: "GET /repair-orders/${ro}", payload: {}, as: ServiceManager, captures: { ro_v: $.data.version } }
            - { call: "POST /quotes", payload: { repair_order_id: "${ro}", capacity_window_id: "${win}", labor_hours: 2, labor_rate_cents: 20000, part_lines: [ { part_id: "${p1}", quantity: 1, unit_price_cents: 5000 } ], expected_repair_order_version: "${ro_v}" }, as: ServiceManager, captures: { q: $.data.id } }
            - { call: "POST /quotes/${q}/issue", payload: {}, as: ServiceManager }
          trigger:
            - { call: "POST /parts/${p1}/mark-obsolete", payload: {}, as: ServiceManager }
            - { call: "GET /quotes/${q}", payload: {}, as: ServiceManager, captures: { q_status: $.data.status } }
            - { call: "GET /repair-orders/${ro}", payload: {}, as: ServiceManager, captures: { ro_flag: $.data.quote_attention_required } }
          assert:
            - "Part.${p1}.status == OBSOLETE"
            - "Quote.${q}.status == REVISION_REQUESTED"
            - "Quote.${q}.part_lines[0].substitution_required == true"
            - "RepairOrder.${ro}.quote_attention_required == true"
            - "RepairOrder.${ro}.status == QUOTE_IN_PROGRESS (unchanged by the cascade)"

  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: certify_state_vs_sod_priority_conflict
        grounds:
          - validations[priority=5]
          - validations[priority=6]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_SOD_VIOLATION]
        distinguishing_aspect: |
          Category pair state vs business_safety: certification attempted while the
          RO is IN_TEST (wrong from-state) AND the Certifier's X-User-ID equals
          assembled_by_id (SoD) — the state error ERR_INVALID_STATE (priority 5)
          must win over ERR_SOD_VIOLATION (priority 6). Different category pair
          than the temporal-vs-fiscal instance.
        test_recipe:
          setup:
            - "Customer, SAFETY_RELIEF_VALVE asset (set_pressure_psig 100), window capacity 1000"
            - "RO approved; Technician tech-001 logged assembly; RO submitted IN_REPAIR -> IN_TEST; no passing test yet"
