              captures: { cd1_id: $.data.id }
          trigger:
            - call: "POST /clinical-ladder/certifications"
              payload: { nurse_id: "${cd1_id}", track: "BASIC", certifying_body: "ANCC", exam_fee_cents: 40000, obtained_on: "2026-01-01T00:00:00Z", expires_on: "2026-01-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { cd1_err: $.data.error_id }
          assert:
            - "cd1_err == ERR_CERTIFICATION_DATE_ORDER"

      - name: renewal_cross_track_mismatch
        claim_type: violation_to_error
        grounds: ["validations[priority=17]", "errors[ERR_RENEWAL_MISMATCH]"]
        distinguishing_aspect: "renewal_of_id pointing to a SPECIALTY cert while the new row declares BASIC returns ERR_RENEWAL_MISMATCH."
        test_recipe:
          setup: ["Nurse RM1 holds SPECIALTY cert"]
          setup_api_calls:
            - call: "POST /clinical-ladder/nurses"
              payload: { employee_code: "RN-RM1", full_name: "Rm One", hire_date: "2020-01-01T00:00:00Z", home_unit: "MED-2E" }
              as: ProgramAdmin
              captures: { rm1_id: $.data.id }
            - call: "POST /clinical-ladder/certifications"
              payload: { nurse_id: "${rm1_id}", track: "SPECIALTY", certifying_body: "ANCC", exam_fee_cents: 100000, obtained_on: "2023-01-01T00:00:00Z", expires_on: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { rm1_old: $.data.id }
          trigger:
            - call: "POST /clinical-ladder/certifications"
              payload: { nurse_id: "${rm1_id}", track: "BASIC", certifying_body: "ANCC", exam_fee_cents: 40000, obtained_on: "2026-07-01T00:00:00Z", expires_on: "2031-07-01T00:00:00Z", renewal_of_id: "${rm1_old}" }
              as: ProgramAdmin
              captures: { rm1_err: $.data.error_id }
          assert:
            - "rm1_err == ERR_RENEWAL_MISMATCH"

      - name: claim_exceeds_exam_fee
        claim_type: violation_to_error
        grounds: ["validations[priority=19]", "errors[ERR_CLAIM_EXCEEDS_FEE]"]
        distinguishing_aspect: "Claimed 50000 against exam_fee 40000 returns ERR_CLAIM_EXCEEDS_FEE at claim creation."
        test_recipe:
          setup: ["Nurse CF1 with BASIC cert exam_fee 40000"]
          setup_api_calls:
            - call: "POST /clinical-ladder/nurses"
              payload: { employee_code: "RN-CF1", full_name: "Cf One", hire_date: "2021-01-01T00:00:00Z", home_unit: "MED-2E" }
              as: ProgramAdmin
              captures: { cf1_id: $.data.id }
            - call: "POST /clinical-ladder/certifications"
              payload: { nurse_id: "${cf1_id}", track: "BASIC", certifying_body: "ANCC", exam_fee_cents: 40000, obtained_on: "2026-01-01T00:00:00Z", expires_on: "2031-01-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { cf1_cert: $.data.id }
          trigger:
            - call: "POST /clinical-ladder/reimbursement-claims"
              payload: { certification_id: "${cf1_cert}", claimed_amount_cents: 50000 }
              as: Nurse
              as_user_id: "${cf1_id}"
              captures: { cf1_err: $.data.error_id }
          assert:
