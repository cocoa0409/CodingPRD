  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: waitlist_priority_multifactor_ranking
        grounds:
          - calculations.waitlist_promotion
          - state_machines.WaitlistEntry.WAITING_to_OFFERED
        distinguishing_aspect: |
          Mode (a): four inputs with non-linear interaction — tier lookup table x source lookup
          table x min(days_waiting, 30) cap x lives-alone bonus. A CRITICAL/APS/10-day/alone
          applicant scores 185 and outranks a HIGH/HOSPITAL_DISCHARGE/11-day applicant (132) who
          entered the waitlist a day EARLIER — pure FIFO would pick the earlier entrant.
        test_recipe:
          setup:
            - "Program total_capacity 1, max_reserve_slots 0; filler PF enrolled (occupied 1)"
            - "PC (MODERATE/SELF) approved to waitlist at 2026-08-01; PB (HIGH/HOSPITAL_DISCHARGE) at 2026-08-02; PA (CRITICAL/APS_REFERRAL/lives_alone) at 2026-08-03"
            - "PF disenrolled at 2026-08-13T09:00:00Z freeing one slot; clock at 2026-08-13T10:00:00Z for the run"
          setup_api_calls:
            - { call: "POST /api/programs", payload: { name: "AAA", total_capacity: 1, current_policy_version: "v2026.1", max_reserve_slots: 0 }, as: ProgramCoordinator, captures: { prog_id: $.data.id } }
            - { call: "POST /api/participants", payload: { full_name: "Fill", date_of_birth: "1950-01-01", phone: "555-1200", address: "3 Pine St", referral_source: "SELF", age_band: "AGE_65_74", lives_alone: false, mobility: "NONE", cognitive_concern: false, chronic_conditions_count: 1, recent_hospitalization: false, recent_bereavement: false }, as: IntakeWorker, captures: { pf: $.data.id } }
            - { call: "POST /api/participants/${pf}/emergency-contacts", payload: { full_name: "KF", phone: "555-9200", relationship: "son", contact_rank: "PRIMARY", accepts_24h: true }, as: IntakeWorker }
            - { call: "POST /api/participants/${pf}/submit-review", payload: {}, as: IntakeWorker }
            - { call: "POST /api/participants/${pf}/approve", payload: {}, as: IntakeWorker }
            - { call: "POST /api/participants", payload: { full_name: "PC", date_of_birth: "1951-03-01", phone: "555-1201", address: "4 Pine St", referral_source: "SELF", age_band: "AGE_75_84", lives_alone: false, mobility: "LIMITED", cognitive_concern: false, chronic_conditions_count: 3, recent_hospitalization: true, recent_bereavement: false }, as: IntakeWorker, captures: { pc: $.data.id } }
            - { call: "POST /api/participants/${pc}/emergency-contacts", payload: { full_name: "KC", phone: "555-9201", relationship: "son", contact_rank: "PRIMARY", accepts_24h: true }, as: IntakeWorker }
            - { call: "POST /api/participants/${pc}/submit-review", payload: {}, as: IntakeWorker }
            - { call: "POST /api/participants/${pc}/approve", payload: {}, as: IntakeWorker }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T00:00:00Z" }, as: ProgramCoordinator }
            - { call: "POST /api/participants", payload: { full_name: "PB", date_of_birth: "1941-03-02", phone: "555-1202", address: "5 Pine St", referral_source: "HOSPITAL_DISCHARGE", age_band: "AGE_85_PLUS", lives_alone: false, mobility: "LIMITED", cognitive_concern: true, chronic_conditions_count: 3, recent_hospitalization: false, recent_bereavement: false }, as: IntakeWorker, captures: { pb: $.data.id } }
            - { call: "POST /api/participants/${pb}/emergency-contacts", payload: { full_name: "KB", phone: "555-9202", relationship: "son", contact_rank: "PRIMARY", accepts_24h: true }, as: IntakeWorker }
            - { call: "POST /api/participants/${pb}/submit-review", payload: {}, as: IntakeWorker }
            - { call: "POST /api/participants/${pb}/approve", payload: {}, as: IntakeWorker }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: ProgramCoordinator }
            - { call: "POST /api/participants", payload: { full_name: "PA", date_of_birth: "1936-03-03", phone: "555-1203", address: "6 Pine St", referral_source: "APS_REFERRAL", age_band: "AGE_85_PLUS", lives_alone: true, mobility: "SEVERE", cognitive_concern: true, chronic_conditions_count: 3, recent_hospitalization: true, recent_bereavement: false }, as: IntakeWorker, captures: { pa: $.data.id } }
            - { call: "POST /api/participants/${pa}/emergency-contacts", payload: { full_name: "KA", phone: "555-9203", relationship: "son", contact_rank: "PRIMARY", accepts_24h: true }, as: IntakeWorker }
            - { call: "POST /api/participants/${pa}/submit-review", payload: {}, as: IntakeWorker }
            - { call: "POST /api/participants/${pa}/approve", payload: {}, as: IntakeWorker }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-13T09:00:00Z" }, as: ProgramCoordinator }
            - { call: "POST /api/participants/${pf}/disenroll", payload: { reason: "moved away" }, as: ProgramCoordinator }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-13T10:00:00Z" }, as: ProgramCoordinator }
            - { call: "GET /api/participants/${pa}/waitlist-entries", payload: {}, as: IntakeWorker, captures: { e_pa: "$.data[0].id" } }
            - { call: "GET /api/participants/${pb}/waitlist-entries", payload: {}, as: IntakeWorker, captures: { e_pb: "$.data[0].id" } }
            - { call: "GET /api/participants/${pc}/waitlist-entries", payload: {}, as: IntakeWorker, captures: { e_pc: "$.data[0].id" } }
            - { call: "GET /api/programs/${prog_id}", payload: {}, as: IntakeWorker, captures: { prog_v: $.data.version } }
          trigger:
            - { call: "POST /api/programs/${prog_id}/promotion-runs", payload: { expected_program_version: "${prog_v}" }, as: IntakeWorker, captures: { offers_made: $.data.offers_created } }
            - { call: "GET /api/waitlist-entries/${e_pa}", payload: {}, as: IntakeWorker, captures: { pa_score: $.data.priority_score_at_offer } }
            - { call: "GET /api/waitlist-entries/${e_pb}", payload: {}, as: IntakeWorker }
            - { call: "GET /api/waitlist-entries/${e_pc}", payload: {}, as: IntakeWorker }
          assert:
            - "WaitlistEntry.${e_pa}.status == OFFERED and priority_score_at_offer == 185 (100 CRITICAL + 50 APS + 2*min(10,30) + 15 alone)"
            - "WaitlistEntry.${e_pb}.status == WAITING (score 132 = 70 + 40 + 2*11: outranked despite entering before PA)"
            - "WaitlistEntry.${e_pc}.status == WAITING (score 74 = 40 + 10 + 2*12)"
            - "promotion response offers_created == 1 and offered_entry_ids == [${e_pa}]"

      - name: satisfaction_per_survey_then_aggregate_rounding
        grounds:
          - calculations.satisfaction_index
          - entities.SatisfactionSurvey.fields.survey_mean
          - entities.OutcomeReport.fields.satisfaction_index
        distinguishing_aspect: |
          Mode (b): nested rounding with pinned order — each survey_mean is rounded half-up to 2dp
          BEFORE aggregation. Surveys [5,4,3,4,5] (4.29) and [1,1,1,1,1] (1.00) yield index 2.65;
          the rejected pool-then-divide order yields 2.64. Different mode than
          waitlist_priority_multifactor_ranking (a) and capacity_reserve_evaluation_order (c).
        test_recipe:
          setup:
            - "Program; two enrolled LOW participants PA and PB"
            - "Survey for PA (period 2026-08) returned with items [5,4,3,4,5]; survey for PB returned with [1,1,1,1,1]"
          setup_api_calls:
            - { call: "POST /api/programs", payload: { name: "AAA", total_capacity: 5, current_policy_version: "v2026.1", max_reserve_slots: 0 }, as: ProgramCoordinator, captures: { prog_id: $.data.id } }
            - { call: "POST /api/participants", payload: { full_name: "SA", date_of_birth: "1951-04-01", phone: "555-1301", address: "7 Pine St", referral_source: "SELF", age_band: "AGE_65_74", lives_alone: false, mobility: "NONE", cognitive_concern: false, chronic_conditions_count: 1, recent_hospitalization: false, recent_bereavement: false }, as: IntakeWorker, captures: { sa: $.data.id } }
            - { call: "POST /api/participants/${sa}/emergency-contacts", payload: { full_name: "KSA", phone: "555-9301", relationship: "son", contact_rank: "PRIMARY" }, as: IntakeWorker }
            - { call: "POST /api/participants/${sa}/submit-review", payload: {}, as: IntakeWorker }
            - { call: "POST /api/participants/${sa}/approve", payload: {}, as: IntakeWorker }
            - { call: "POST /api/participants", payload: { full_name: "SB", date_of_birth: "1951-04-02", phone: "555-1302", address: "8 Pine St", referral_source: "SELF", age_band: "AGE_65_74", lives_alone: false, mobility: "NONE", cognitive_concern: false, chronic_conditions_count: 1, recent_hospitalization: false, recent_bereavement: false }, as: IntakeWorker, captures: { sb: $.data.id } }
            - { call: "POST /api/participants/${sb}/emergency-contacts", payload: { full_name: "KSB", phone: "555-9302", relationship: "son", contact_rank: "PRIMARY" }, as: IntakeWorker }
            - { call: "POST /api/participants/${sb}/submit-review", payload: {}, as: IntakeWorker }
            - { call: "POST /api/participants/${sb}/approve", payload: {}, as: IntakeWorker }
            - { call: "POST /api/participants/${sa}/satisfaction-surveys", payload: { period_month: "2026-08" }, as: IntakeWorker, captures: { surv_a: $.data.id } }
            - { call: "POST /api/participants/${sb}/satisfaction-surveys", payload: { period_month: "2026-08" }, as: IntakeWorker, captures: { surv_b: $.data.id } }
          trigger:
            - { call: "POST /api/satisfaction-surveys/${surv_a}/return", payload: { items: [5, 4, 3, 4, 5] }, as: IntakeWorker, captures: { mean_a: $.data.survey_mean } }
            - { call: "POST /api/satisfaction-surveys/${surv_b}/return", payload: { items: [1, 1, 1, 1, 1] }, as: IntakeWorker, captures: { mean_b: $.data.survey_mean } }
            - { call: "POST /api/programs/${prog_id}/outcome-reports", payload: { period_month: "2026-08" }, as: QualityReviewer, captures: { rep_id: $.data.id } }
            - { call: "GET /api/outcome-reports/${rep_id}", payload: {}, as: QualityReviewer, captures: { idx: $.data.satisfaction_index } }
          assert:
            - "SatisfactionSurvey.${surv_a}.survey_mean == 4.29 (round_half_up((5+8+3+4+10)/7, 2) = round_half_up(4.2857..., 2))"
            - "SatisfactionSurvey.${surv_b}.survey_mean == 1.00"
            - "OutcomeReport.${rep_id}.satisfaction_index == 2.65 (round_half_up((4.29+1.00)/2, 2) = round_half_up(2.645, 2))"
            - "Rejected pooled order would give round_half_up(37/14, 2) == 2.64 — the pinned per-survey-first order is observable"

      - name: capacity_reserve_evaluation_order
        grounds:
          - calculations.effective_capacity
          - state_machines.Participant.UNDER_REVIEW_to_ENROLLED
          - state_machines.Participant.UNDER_REVIEW_to_WAITLISTED
        distinguishing_aspect: |
          Mode (c): circular-looking dependency pinned by evaluation order — reserved slots depend on
          the count of CRITICAL-tier WAITING entries, while a fresh admission depends on reserved;
          the cycle is broken because the reserve count uses only raw intake tiers of already-waiting
          entries. With total 3, occupied 2, one CRITICAL waiting: gross_free 1, reserved 1, so a
          MODERATE applicant is WAITLISTED while a CRITICAL applicant at the same instant is ENROLLED.
