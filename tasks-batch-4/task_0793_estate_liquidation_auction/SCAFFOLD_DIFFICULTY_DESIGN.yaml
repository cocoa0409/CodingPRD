# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Estate-Liquidation Online Auction — 9 rules x 2 instances = 18 instances
# All money literals precomputed: buyer_premium_bps=1750, SALES_TAX_BPS=800,
# commission_bps=3500, round_half_up throughout.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: estate_provisional_vs_final_gross
        grounds:
          - calculations.estate_settlement
          - entities.Estate.fields.provisional_gross_cents
          - entities.Estate.fields.gross_sales_cents
          - state_machines.Estate.LIVE_to_CLOSED
          - state_machines.Estate.CLOSED_to_SETTLED
        distinguishing_aspect: |
          On the Estate domain, provisional_gross_cents (stamped at close from
          current_bid of every lot that drew a bid) = 15000, but final
          gross_sales_cents (stamped at settle from hammer of SOLD lots whose
          Order is PAID) = 10000 — the unpaid buyer's 5000 lot is excluded, so
          the two algorithms yield different numbers for identical bid data.
        test_recipe:
          setup:
            - "Estate E (defaults). Two verified buyers B1, B2."
            - "L1 starting 10000; L2 starting 5000; both photographed, cataloged, listed."
            - "Estate opened. B1 bids 10000 on L1; B2 bids 5000 on L2."
            - "Estate closed (L1->SOLD hammer 10000 to B1's order O1; L2->SOLD hammer 5000 to B2's order O2). O1 paid (12690); O2 left UNPAID."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-05T00:00:00Z" }
              as: Operator
            - call: "POST /estates"
              payload: { seller_name: "Estate A", seller_email: "a@e.com", auction_starts_at: "2026-03-02T10:00:00Z", auction_ends_at: "2026-03-20T10:00:00Z" }
              as: Operator
              captures: { e_id: $.data.id }
            - call: "POST /buyers"
              payload: { display_name: "B1", email: "b1@x.com" }
              as: Anonymous
              captures: { b1_id: $.data.id }
            - call: "POST /buyers/${b1_id}/verify"
              payload: {}
              as: Operator
            - call: "POST /buyers"
              payload: { display_name: "B2", email: "b2@x.com" }
              as: Anonymous
              captures: { b2_id: $.data.id }
            - call: "POST /buyers/${b2_id}/verify"
              payload: {}
              as: Operator
            - call: "POST /lots"
              payload: { estate_id: "${e_id}", title: "L1", description: "d", category: "misc", condition_grade: "B", starting_bid_cents: 10000 }
              as: Operator
              captures: { l1_id: $.data.id }
            - call: "POST /photos"
              payload: { lot_id: "${l1_id}", image_url: "http://img/l1.jpg" }
              as: Operator
            - call: "PATCH /lots/${l1_id}"
              payload: { status: "CATALOGED" }
              as: Operator
            - call: "PATCH /lots/${l1_id}"
              payload: { status: "LISTED" }
              as: Operator
            - call: "POST /lots"
              payload: { estate_id: "${e_id}", title: "L2", description: "d", category: "misc", condition_grade: "C", starting_bid_cents: 5000 }
              as: Operator
              captures: { l2_id: $.data.id }
            - call: "POST /photos"
              payload: { lot_id: "${l2_id}", image_url: "http://img/l2.jpg" }
              as: Operator
            - call: "PATCH /lots/${l2_id}"
              payload: { status: "CATALOGED" }
              as: Operator
            - call: "PATCH /lots/${l2_id}"
              payload: { status: "LISTED" }
              as: Operator
            - call: "POST /estates/${e_id}/open"
              payload: {}
              as: Operator
            - call: "GET /lots/${l1_id}"
              payload: {}
              as: Operator
              captures: { l1v: $.data.version }
            - call: "POST /bids"
              payload: { lot_id: "${l1_id}", buyer_id: "${b1_id}", amount_cents: 10000, expected_lot_version: "${l1v}" }
              as: Buyer
              as_user_id: "${b1_id}"
            - call: "GET /lots/${l2_id}"
              payload: {}
              as: Operator
              captures: { l2v: $.data.version }
            - call: "POST /bids"
              payload: { lot_id: "${l2_id}", buyer_id: "${b2_id}", amount_cents: 5000, expected_lot_version: "${l2v}" }
              as: Buyer
              as_user_id: "${b2_id}"
            - call: "POST /estates/${e_id}/close"
              payload: {}
              as: Operator
            - call: "GET /orders"
              payload: { buyer_id: "${b1_id}" }
              as: Operator
              captures: { o1_id: "$.data[0].id" }
            - call: "POST /orders/${o1_id}/pay"
              payload: { amount_cents: 12690 }
              as: Buyer
              as_user_id: "${b1_id}"
          trigger:
            - call: "POST /estates/${e_id}/settle"
              payload: {}
              as: Operator
              captures: { final_gross: $.data.gross_sales_cents }
          assert:
            - "Estate.${e_id}.provisional_gross_cents == 15000"
            - "Estate.${e_id}.gross_sales_cents == 10000"
            - "Estate.${e_id}.commission_cents == 3500"
            - "Estate.${e_id}.seller_payout_cents == 6500"

      - name: buyer_gross_owed_vs_net_owed
        grounds:
          - calculations.buyer_owed
          - entities.Buyer.fields.gross_owed_cents
          - entities.Buyer.fields.net_owed_cents
          - state_machines.Order.UNPAID_to_PAID
        distinguishing_aspect: |
          On the Buyer domain, gross_owed_cents (all orders) = 38070 while
          net_owed_cents (UNPAID orders only) = 25380; buyer B1 wins in two
          estates, pays one order (12690) and leaves the other (25380) UNPAID,
          so the two variants diverge on a different entity than estate gross.
        test_recipe:
          setup:
            - "Two estates Ea, Eb (defaults). Verified buyer B1."
            - "In Ea: L_a starting 10000, B1 wins hammer 10000 -> order Oa total 12690; Oa PAID."
            - "In Eb: L_b starting 20000, B1 wins hammer 20000 -> order Ob total 25380; Ob left UNPAID."
          setup_api_calls:
            - call: "POST /estates"
              payload: { seller_name: "Ea", seller_email: "ea@e.com", auction_starts_at: "2026-03-02T10:00:00Z", auction_ends_at: "2026-03-20T10:00:00Z" }
              as: Operator
              captures: { ea_id: $.data.id }
            - call: "POST /estates"
              payload: { seller_name: "Eb", seller_email: "eb@e.com", auction_starts_at: "2026-03-02T10:00:00Z", auction_ends_at: "2026-03-20T10:00:00Z" }
              as: Operator
              captures: { eb_id: $.data.id }
            - call: "POST /buyers"
              payload: { display_name: "B1", email: "b1@x.com" }
              as: Anonymous
              captures: { b1_id: $.data.id }
            - call: "POST /buyers/${b1_id}/verify"
              payload: {}
              as: Operator
            - call: "POST /lots"
              payload: { estate_id: "${ea_id}", title: "La", description: "d", category: "misc", condition_grade: "A", starting_bid_cents: 10000 }
              as: Operator
              captures: { la_id: $.data.id }
            - call: "POST /photos"
              payload: { lot_id: "${la_id}", image_url: "http://img/la.jpg" }
              as: Operator
            - call: "PATCH /lots/${la_id}"
              payload: { status: "CATALOGED" }
              as: Operator
            - call: "PATCH /lots/${la_id}"
              payload: { status: "LISTED" }
              as: Operator
            - call: "POST /estates/${ea_id}/open"
              payload: {}
              as: Operator
            - call: "GET /lots/${la_id}"
              payload: {}
              as: Operator
              captures: { lav: $.data.version }
            - call: "POST /bids"
              payload: { lot_id: "${la_id}", buyer_id: "${b1_id}", amount_cents: 10000, expected_lot_version: "${lav}" }
              as: Buyer
              as_user_id: "${b1_id}"
            - call: "POST /estates/${ea_id}/close"
              payload: {}
              as: Operator
            - call: "GET /orders"
              payload: {}
              as: Operator
              captures: { oa_id: "$.data[0].id" }
            - call: "POST /orders/${oa_id}/pay"
              payload: { amount_cents: 12690 }
              as: Buyer
              as_user_id: "${b1_id}"
            - call: "POST /lots"
              payload: { estate_id: "${eb_id}", title: "Lb", description: "d", category: "misc", condition_grade: "A", starting_bid_cents: 20000 }
              as: Operator
              captures: { lb_id: $.data.id }
            - call: "POST /photos"
              payload: { lot_id: "${lb_id}", image_url: "http://img/lb.jpg" }
              as: Operator
            - call: "PATCH /lots/${lb_id}"
              payload: { status: "CATALOGED" }
              as: Operator
            - call: "PATCH /lots/${lb_id}"
              payload: { status: "LISTED" }
              as: Operator
            - call: "POST /estates/${eb_id}/open"
              payload: {}
              as: Operator
            - call: "GET /lots/${lb_id}"
              payload: {}
              as: Operator
              captures: { lbv: $.data.version }
            - call: "POST /bids"
              payload: { lot_id: "${lb_id}", buyer_id: "${b1_id}", amount_cents: 20000, expected_lot_version: "${lbv}" }
              as: Buyer
              as_user_id: "${b1_id}"
          trigger:
            - call: "POST /estates/${eb_id}/close"
              payload: {}
              as: Operator
            - call: "GET /buyers/${b1_id}"
              payload: {}
              as: Operator
              captures: { gross: $.data.gross_owed_cents }
          assert:
            - "Buyer.${b1_id}.gross_owed_cents == 38070"
            - "Buyer.${b1_id}.net_owed_cents == 25380"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: bid_increment_tiered_step_selection
        grounds:
          - calculations.bid_min_increment
          - validations[priority=13]
          - errors[ERR_BID_TOO_LOW]
          - entities.Lot.fields.current_bid_cents
        distinguishing_aspect: |
          Mode (a): the increment step is selected non-linearly from a 4-band
          tier table keyed on current_bid_cents. With current_bid 10000 the step
          is 1000 (band [10000,50000)), so a bid of 10500 (+500, which a lower
          band's 100/250 step would accept) is REJECTED — proving tiered step
          selection over >=3 inputs (current_bid, band thresholds, step table).
        test_recipe:
          setup:
            - "Estate live. Lot L starting 10000. Verified buyers B1, B2."
            - "B1 bids 10000 (first bid, valid) -> current_bid 10000, band [10000,50000), step 1000, min_next 11000."
          setup_api_calls:
            - call: "POST /estates"
              payload: { seller_name: "Ec", seller_email: "ec@e.com", auction_starts_at: "2026-03-02T10:00:00Z", auction_ends_at: "2026-03-20T10:00:00Z" }
              as: Operator
              captures: { e_id: $.data.id }
            - call: "POST /buyers"
              payload: { display_name: "B1", email: "b1@x.com" }
              as: Anonymous
              captures: { b1_id: $.data.id }
            - call: "POST /buyers/${b1_id}/verify"
              payload: {}
              as: Operator
            - call: "POST /buyers"
              payload: { display_name: "B2", email: "b2@x.com" }
              as: Anonymous
              captures: { b2_id: $.data.id }
            - call: "POST /buyers/${b2_id}/verify"
              payload: {}
              as: Operator
            - call: "POST /lots"
              payload: { estate_id: "${e_id}", title: "L", description: "d", category: "misc", condition_grade: "B", starting_bid_cents: 10000 }
              as: Operator
              captures: { l_id: $.data.id }
            - call: "POST /photos"
              payload: { lot_id: "${l_id}", image_url: "http://img/l.jpg" }
              as: Operator
            - call: "PATCH /lots/${l_id}"
              payload: { status: "CATALOGED" }
              as: Operator
            - call: "PATCH /lots/${l_id}"
              payload: { status: "LISTED" }
              as: Operator
            - call: "POST /estates/${e_id}/open"
              payload: {}
              as: Operator
            - call: "GET /lots/${l_id}"
              payload: {}
              as: Operator
              captures: { lv1: $.data.version }
            - call: "POST /bids"
              payload: { lot_id: "${l_id}", buyer_id: "${b1_id}", amount_cents: 10000, expected_lot_version: "${lv1}" }
              as: Buyer
              as_user_id: "${b1_id}"
          trigger:
            - call: "GET /lots/${l_id}"
              payload: {}
              as: Operator
              captures: { lv2: $.data.version }
            - call: "POST /bids"
              payload: { lot_id: "${l_id}", buyer_id: "${b2_id}", amount_cents: 10500, expected_lot_version: "${lv2}" }
              as: Buyer
              as_user_id: "${b2_id}"
              captures: { err: $.data.error_id }
          assert:
            - "trigger POST /bids returns 409 with error_id == ERR_BID_TOO_LOW"
            - "Lot.${l_id}.current_bid_cents == 10000"
            - "Lot.${l_id}.high_bidder_id == ${b1_id}"

      - name: order_premium_aggregate_vs_perlot_rounding
        grounds:
          - calculations.order_charges
          - entities.Order.fields.buyer_premium_cents
          - entities.Order.fields.total_cents
          - state_machines.Estate.LIVE_to_CLOSED
        distinguishing_aspect: |
          Mode (b): buyer_premium is round_half_up(subtotal * 1750/10000) on the
          AGGREGATE subtotal 1650 -> round(288.75)=289. The per-lot-then-sum
          order (three lots of 550 -> round(96.25)=96, x3 = 288) differs by one
          cent; the scaffold pins the aggregate order, so total_cents == 2094.
        test_recipe:
          setup:
            - "Estate live. Verified buyer B1. Three lots each starting 550."
            - "B1 wins all three at hammer 550 -> single order O1, subtotal 1650."
          setup_api_calls:
            - call: "POST /estates"
              payload: { seller_name: "Ed", seller_email: "ed@e.com", auction_starts_at: "2026-03-02T10:00:00Z", auction_ends_at: "2026-03-20T10:00:00Z" }
              as: Operator
              captures: { e_id: $.data.id }
            - call: "POST /buyers"
              payload: { display_name: "B1", email: "b1@x.com" }
              as: Anonymous
              captures: { b1_id: $.data.id }
            - call: "POST /buyers/${b1_id}/verify"
              payload: {}
              as: Operator
            - call: "POST /lots"
              payload: { estate_id: "${e_id}", title: "P1", description: "d", category: "misc", condition_grade: "B", starting_bid_cents: 550 }
              as: Operator
              captures: { p1_id: $.data.id }
            - call: "POST /photos"
              payload: { lot_id: "${p1_id}", image_url: "http://img/p1.jpg" }
              as: Operator
            - call: "PATCH /lots/${p1_id}"
              payload: { status: "CATALOGED" }
              as: Operator
            - call: "PATCH /lots/${p1_id}"
              payload: { status: "LISTED" }
              as: Operator
            - call: "POST /lots"
              payload: { estate_id: "${e_id}", title: "P2", description: "d", category: "misc", condition_grade: "B", starting_bid_cents: 550 }
              as: Operator
              captures: { p2_id: $.data.id }
            - call: "POST /photos"
              payload: { lot_id: "${p2_id}", image_url: "http://img/p2.jpg" }
              as: Operator
            - call: "PATCH /lots/${p2_id}"
              payload: { status: "CATALOGED" }
              as: Operator
            - call: "PATCH /lots/${p2_id}"
              payload: { status: "LISTED" }
              as: Operator
            - call: "POST /lots"
              payload: { estate_id: "${e_id}", title: "P3", description: "d", category: "misc", condition_grade: "B", starting_bid_cents: 550 }
              as: Operator
              captures: { p3_id: $.data.id }
            - call: "POST /photos"
              payload: { lot_id: "${p3_id}", image_url: "http://img/p3.jpg" }
              as: Operator
            - call: "PATCH /lots/${p3_id}"
              payload: { status: "CATALOGED" }
              as: Operator
            - call: "PATCH /lots/${p3_id}"
              payload: { status: "LISTED" }
              as: Operator
            - call: "POST /estates/${e_id}/open"
              payload: {}
              as: Operator
            - call: "GET /lots/${p1_id}"
              payload: {}
              as: Operator
              captures: { p1v: $.data.version }
            - call: "POST /bids"
              payload: { lot_id: "${p1_id}", buyer_id: "${b1_id}", amount_cents: 550, expected_lot_version: "${p1v}" }
              as: Buyer
              as_user_id: "${b1_id}"
            - call: "GET /lots/${p2_id}"
              payload: {}
              as: Operator
              captures: { p2v: $.data.version }
            - call: "POST /bids"
              payload: { lot_id: "${p2_id}", buyer_id: "${b1_id}", amount_cents: 550, expected_lot_version: "${p2v}" }
              as: Buyer
              as_user_id: "${b1_id}"
            - call: "GET /lots/${p3_id}"
              payload: {}
              as: Operator
              captures: { p3v: $.data.version }
            - call: "POST /bids"
              payload: { lot_id: "${p3_id}", buyer_id: "${b1_id}", amount_cents: 550, expected_lot_version: "${p3v}" }
              as: Buyer
              as_user_id: "${b1_id}"
          trigger:
            - call: "POST /estates/${e_id}/close"
              payload: {}
              as: Operator
            - call: "GET /orders"
              payload: {}
              as: Operator
              captures: { o1_id: "$.data[0].id" }
          assert:
            - "Order.${o1_id}.subtotal_cents == 1650"
            - "Order.${o1_id}.buyer_premium_cents == 289"
            - "Order.${o1_id}.sales_tax_cents == 155"
            - "Order.${o1_id}.total_cents == 2094"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: order_parallel_payment_and_pickup_dimensions
        grounds:
          - state_machines.Order.UNPAID_to_PAID
          - state_machines.Order.PENDING_to_SCHEDULED
          - state_machines.Order.SCHEDULED_to_PENDING
          - entities.Order.fields.payment_status
          - entities.Order.fields.pickup_status
        distinguishing_aspect: |
          Order carries two independent state dimensions on the same row:
          payment_status advances UNPAID->PAID and STAYS PAID while pickup_status
          independently moves PENDING->SCHEDULED->PENDING (schedule then cancel).
          The pickup transitions leave payment_status untouched — parallel dims.
        test_recipe:
          setup:
            - "Estate live; verified B1 wins L1 (hammer 10000) -> order O1 total 12690; O1 PAID."
            - "Pickup window W1 capacity 5 created for the estate; O1 scheduled into W1 (pickup SCHEDULED)."
          setup_api_calls:
            - call: "POST /estates"
              payload: { seller_name: "Ee", seller_email: "ee@e.com", auction_starts_at: "2026-03-02T10:00:00Z", auction_ends_at: "2026-03-20T10:00:00Z" }
              as: Operator
              captures: { e_id: $.data.id }
            - call: "POST /buyers"
              payload: { display_name: "B1", email: "b1@x.com" }
              as: Anonymous
              captures: { b1_id: $.data.id }
            - call: "POST /buyers/${b1_id}/verify"
              payload: {}
              as: Operator
            - call: "POST /lots"
              payload: { estate_id: "${e_id}", title: "L1", description: "d", category: "misc", condition_grade: "B", starting_bid_cents: 10000 }
              as: Operator
              captures: { l1_id: $.data.id }
            - call: "POST /photos"
              payload: { lot_id: "${l1_id}", image_url: "http://img/l1.jpg" }
              as: Operator
            - call: "PATCH /lots/${l1_id}"
              payload: { status: "CATALOGED" }
              as: Operator
            - call: "PATCH /lots/${l1_id}"
              payload: { status: "LISTED" }
              as: Operator
            - call: "POST /estates/${e_id}/open"
              payload: {}
              as: Operator
            - call: "GET /lots/${l1_id}"
              payload: {}
              as: Operator
              captures: { l1v: $.data.version }
            - call: "POST /bids"
              payload: { lot_id: "${l1_id}", buyer_id: "${b1_id}", amount_cents: 10000, expected_lot_version: "${l1v}" }
              as: Buyer
              as_user_id: "${b1_id}"
            - call: "POST /estates/${e_id}/close"
              payload: {}
              as: Operator
            - call: "GET /orders"
              payload: {}
              as: Operator
              captures: { o1_id: "$.data[0].id" }
            - call: "POST /orders/${o1_id}/pay"
              payload: { amount_cents: 12690 }
              as: Buyer
              as_user_id: "${b1_id}"
            - call: "POST /pickup-windows"
              payload: { estate_id: "${e_id}", starts_at: "2026-03-25T09:00:00Z", ends_at: "2026-03-25T12:00:00Z", capacity: 5 }
              as: Operator
              captures: { w1_id: $.data.id }
            - call: "POST /orders/${o1_id}/schedule-pickup"
              payload: { pickup_window_id: "${w1_id}" }
              as: Buyer
              as_user_id: "${b1_id}"
          trigger:
            - call: "POST /orders/${o1_id}/cancel-pickup"
              payload: {}
              as: Buyer
              as_user_id: "${b1_id}"
          assert:
            - "Order.${o1_id}.pickup_status == PENDING"
            - "Order.${o1_id}.payment_status == PAID"
            - "PickupWindow.${w1_id}.booked_count == 0"

      - name: dispute_needs_info_review_cycle
        grounds:
          - state_machines.Dispute.UNDER_REVIEW_to_NEEDS_INFO
          - state_machines.Dispute.NEEDS_INFO_to_UNDER_REVIEW
          - entities.Dispute.fields.status
        distinguishing_aspect: |
          Dispute revisits UNDER_REVIEW via the cycle
          UNDER_REVIEW->NEEDS_INFO->UNDER_REVIEW; after the buyer responds from
          NEEDS_INFO the status is UNDER_REVIEW again (same state re-entered),
          which no linear pipeline can express.
        test_recipe:
          setup:
            - "Estate live; verified B1 wins L1 (hammer 10000) -> order O1 total 12690; O1 PAID."
            - "B1 files dispute D on (O1, L1). Operator PATCH D->UNDER_REVIEW then D->NEEDS_INFO."
          setup_api_calls:
            - call: "POST /estates"
              payload: { seller_name: "Ef", seller_email: "ef@e.com", auction_starts_at: "2026-03-02T10:00:00Z", auction_ends_at: "2026-03-20T10:00:00Z" }
              as: Operator
              captures: { e_id: $.data.id }
            - call: "POST /buyers"
              payload: { display_name: "B1", email: "b1@x.com" }
              as: Anonymous
              captures: { b1_id: $.data.id }
            - call: "POST /buyers/${b1_id}/verify"
              payload: {}
              as: Operator
            - call: "POST /lots"
              payload: { estate_id: "${e_id}", title: "L1", description: "d", category: "misc", condition_grade: "B", starting_bid_cents: 10000 }
              as: Operator
              captures: { l1_id: $.data.id }
            - call: "POST /photos"
              payload: { lot_id: "${l1_id}", image_url: "http://img/l1.jpg" }
              as: Operator
            - call: "PATCH /lots/${l1_id}"
              payload: { status: "CATALOGED" }
              as: Operator
            - call: "PATCH /lots/${l1_id}"
              payload: { status: "LISTED" }
              as: Operator
            - call: "POST /estates/${e_id}/open"
              payload: {}
              as: Operator
