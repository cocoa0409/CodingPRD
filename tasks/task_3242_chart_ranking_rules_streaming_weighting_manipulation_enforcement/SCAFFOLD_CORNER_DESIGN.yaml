          rationale: "Both the at-floor pass and the below-floor exclusion are asserted by the named §1.8 boundary instance."

      - name: reporting_cutoff_error_excluded
        claim_type: violation_to_error
        grounds: ["validations[priority=10]", "errors[ERR_REPORTING_CUTOFF_PASSED]"]
        excluded_because:
          difficulty_instance: boundary_precision_check / reporting_cutoff_exclusive_boundary
          rationale: "ERR_REPORTING_CUTOFF_PASSED is asserted at the exact half-open boundary by the named §1.8 instance."

      - name: week_window_overlap_error_excluded
        claim_type: violation_to_error
        grounds: ["validations[priority=11]", "errors[ERR_WEEK_WINDOW_OVERLAP]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / chart_week_halfopen_adjacency
          rationale: "Overlap rejection and adjacency acceptance are asserted by the named §1.8 instance."

