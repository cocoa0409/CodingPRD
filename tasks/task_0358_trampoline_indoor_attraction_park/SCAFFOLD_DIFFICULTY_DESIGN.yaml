scaffold_difficulty_design:

  # =================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: pass_pricing_inclusion_vs_discount_on_jump_pass
        grounds:
          - calculations.pass_pricing
          - entities.JumpPass.fields.base_charge_cents
          - entities.Membership.fields.included_visits_remaining
          - state_machines.JumpPass.UNPAID_to_PAID
        distinguishing_aspect: |
          On the JumpPass domain, an ACTIVE member with included_visits_remaining > 0 hits the
          inclusion variant (base+surcharge waived, only socks billed -> base_charge_cents == 350),
          structurally distinct from the discount variant (percentage off base+surcharge, socks full
          -> base_charge_cents == 1850 for GOLD); this instance pins the inclusion path on a fresh
          GOLD membership (8 visits available), whose first member pass freezes 350 from identical
          slot inputs that the discount path would freeze at 1850.
        test_recipe:
          setup:
            - "Park bootstrapped with defaults (grip_sock_price_cents=350, walkin_surcharge_cents=500)."
            - "Clock at 2026-06-15T00:00:00Z."
            - "One slot base_price_cents=2000, capacity 10."
            - "Member m1 with a fresh GOLD membership (included_visits_remaining=8); the first member pass therefore takes the inclusion variant."
          setup_api_calls:
            - call: "POST /park"
              payload: { name: "Sky Park" }
              as: ParkManager
              captures: { park_id: $.data.id }
            - call: "POST /park/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: ParkManager
            - call: "POST /park/slots"
              payload: { park_id: "${park_id}", starts_at: "2026-06-20T10:00:00Z", ends_at: "2026-06-20T12:00:00Z", jump_capacity: 10, base_price_cents: 2000 }
              as: ParkManager
              captures: { slot_id: $.data.id, slot_v0: $.data.version }
            - call: "POST /park/members"
              payload: { park_id: "${park_id}", email: "m1@x.com", full_name: "M One" }
              as: FrontDesk
              captures: { m1_id: $.data.id }
            - call: "POST /park/memberships"
              payload: { member_id: "${m1_id}", tier: "GOLD", cycle_anchor_at: "2026-06-01T00:00:00Z" }
              as: Member
              as_user_id: "${m1_id}"
              captures: { mship_id: $.data.id }
            - call: "POST /park/participants"
              payload: { park_id: "${park_id}", full_name: "Jumper Adult", birthdate: "1990-01-01T00:00:00Z", member_id: "${m1_id}" }
              as: Member
              as_user_id: "${m1_id}"
              captures: { p_inc_id: $.data.id }
          trigger:
            - call: "POST /park/jump-passes"
              payload: { slot_id: "${slot_id}", participant_id: "${p_inc_id}", channel: "RESERVATION", sock_count: 1, member_id: "${m1_id}", expected_slot_version: "${slot_v0}" }
              as: Member
              as_user_id: "${m1_id}"
              captures: { pass_inc_id: $.data.id, pass_inc_base: $.data.base_charge_cents }
          assert:
            - "JumpPass.${pass_inc_id}.base_charge_cents == 350"
            - "JumpPass.${pass_inc_id}.member_id == ${m1_id}"

      - name: seat_accounting_jump_seat_vs_party_guest_seats_on_slot
        grounds:
          - calculations.slot_seat_accounting
          - entities.SessionSlot.fields.seats_taken
          - state_machines.JumpPass.RESERVED_to_CANCELLED
          - state_machines.PartyBooking.PENDING_to_DEPOSIT_HELD
        distinguishing_aspect: |
          On the SessionSlot domain, the same act of "occupying the slot" yields different seat
          counts under two variants: a JumpPass in {RESERVED,CHECKED_IN} contributes exactly 1
          seat regardless of socks/add-ons, while a PartyBooking in {DEPOSIT_HELD,CONFIRMED,
          CHECKED_IN} contributes guest_count seats; one pass + one 6-guest deposit-held booking
          -> seats_taken == 7, not 2.
        test_recipe:
          setup:
            - "Park, clock 2026-06-15T00:00:00Z, slot capacity 20 base 2000."
            - "One reservation pass (1 seat) and one party booking with guest_count 6 held (6 seats)."
          setup_api_calls:
            - call: "POST /park"
              payload: { name: "Sky Park" }
              as: ParkManager
              captures: { park_id: $.data.id }
            - call: "POST /park/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: ParkManager
            - call: "POST /park/slots"
              payload: { park_id: "${park_id}", starts_at: "2026-06-20T10:00:00Z", ends_at: "2026-06-20T12:00:00Z", jump_capacity: 20, base_price_cents: 2000 }
              as: ParkManager
              captures: { slot_id: $.data.id, slot_v0: $.data.version }
            - call: "POST /park/rooms"
              payload: { park_id: "${park_id}", name: "Room A", room_capacity: 30 }
              as: ParkManager
              captures: { room_id: $.data.id }
            - call: "POST /park/packages"
              payload: { park_id: "${park_id}", name: "Basic", per_guest_cents: 1500, base_room_fee_cents: 10000, min_guests: 4 }
              as: ParkManager
              captures: { pkg_id: $.data.id }
            - call: "POST /park/participants"
              payload: { park_id: "${park_id}", full_name: "Solo Jumper", birthdate: "1990-01-01T00:00:00Z" }
              as: FrontDesk
              captures: { p_id: $.data.id }
            - call: "POST /park/jump-passes"
              payload: { slot_id: "${slot_id}", participant_id: "${p_id}", channel: "RESERVATION", sock_count: 1, expected_slot_version: "${slot_v0}" }
              as: FrontDesk
              captures: { pass_id: $.data.id, slot_v1: $.data.version }
            - call: "POST /park/party-bookings"
              payload: { package_id: "${pkg_id}", room_id: "${room_id}", slot_id: "${slot_id}", guest_count: 6 }
              as: FrontDesk
              captures: { booking_id: $.data.id }
            - call: "GET /park/slots/${slot_id}"
              payload: {}
              as: FrontDesk
              captures: { slot_v_pre: $.data.version }
          trigger:
            - call: "POST /park/party-bookings/${booking_id}/hold-deposit"
              payload: { expected_slot_version: "${slot_v_pre}" }
              as: FrontDesk
            - call: "GET /park/slots/${slot_id}"
              payload: {}
              as: FrontDesk
              captures: { final_seats: $.data.seats_taken }
          assert:
            - "SessionSlot.${slot_id}.seats_taken == 7"
            - "SessionSlot.${slot_id}.status == OPEN"

  # =================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # =================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: pass_pricing_mode_a_nonlinear_branch_on_member_state
        grounds:
          - calculations.pass_pricing
          - entities.JumpPass.fields.base_charge_cents
          - entities.Park.fields.walkin_surcharge_cents
        distinguishing_aspect: |
          MODE (a): >=3 inputs (base_price, walkin_surcharge, sock_count, tier_discount) with a
          non-linear conditional branch on Membership.status and included_visits_remaining selecting
          inclusion vs discount vs plain; with the SILVER member's 4 included visits drained to 0,
          the discount path applies on a WALKIN base 2500 + 500 surcharge, 3 socks ->
          base_charge_cents == 3600 (discountable 3000 - 450 + 1050 socks).
        test_recipe:
          setup:
            - "Park defaults; clock 2026-06-15T00:00:00Z; slot base 2500 capacity 10."
            - "Member m2 with a SILVER membership; its 4 included visits are drained to 0 by creating+paying 4 reservation passes, so the next pass falls to the discount variant (member ACTIVE, 0 inclusion)."
          setup_api_calls:
            - call: "POST /park"
              payload: { name: "Sky Park" }
              as: ParkManager
              captures: { park_id: $.data.id }
            - call: "POST /park/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: ParkManager
            - call: "POST /park/slots"
              payload: { park_id: "${park_id}", starts_at: "2026-06-20T10:00:00Z", ends_at: "2026-06-20T12:00:00Z", jump_capacity: 10, base_price_cents: 2500 }
              as: ParkManager
              captures: { slot_id: $.data.id, slot_v0: $.data.version }
            - call: "POST /park/members"
              payload: { park_id: "${park_id}", email: "m2@x.com", full_name: "M Two" }
              as: FrontDesk
              captures: { m2_id: $.data.id }
            - call: "POST /park/memberships"
              payload: { member_id: "${m2_id}", tier: "SILVER", cycle_anchor_at: "2026-06-01T00:00:00Z" }
              as: Member
              as_user_id: "${m2_id}"
              captures: { mship2_id: $.data.id }
            - call: "POST /park/participants"
              payload: { park_id: "${park_id}", full_name: "Drain Member", birthdate: "1990-01-01T00:00:00Z", member_id: "${m2_id}" }
              as: Member
              as_user_id: "${m2_id}"
              captures: { p2_id: $.data.id }
            # ---- drain the 4 SILVER included visits via 4 paid reservation passes ----
            - call: "POST /park/jump-passes"
              payload: { slot_id: "${slot_id}", participant_id: "${p2_id}", channel: "RESERVATION", sock_count: 1, member_id: "${m2_id}", expected_slot_version: "${slot_v0}" }
              as: Member
              as_user_id: "${m2_id}"
              captures: { d1_id: $.data.id, slot_v1: $.data.version }
            - call: "POST /park/jump-passes/${d1_id}/pay"
              payload: {}
              as: Member
              as_user_id: "${m2_id}"
            - call: "POST /park/jump-passes"
              payload: { slot_id: "${slot_id}", participant_id: "${p2_id}", channel: "RESERVATION", sock_count: 1, member_id: "${m2_id}", expected_slot_version: "${slot_v1}" }
              as: Member
              as_user_id: "${m2_id}"
              captures: { d2_id: $.data.id, slot_v2: $.data.version }
            - call: "POST /park/jump-passes/${d2_id}/pay"
              payload: {}
              as: Member
              as_user_id: "${m2_id}"
            - call: "POST /park/jump-passes"
              payload: { slot_id: "${slot_id}", participant_id: "${p2_id}", channel: "RESERVATION", sock_count: 1, member_id: "${m2_id}", expected_slot_version: "${slot_v2}" }
              as: Member
              as_user_id: "${m2_id}"
              captures: { d3_id: $.data.id, slot_v3: $.data.version }
            - call: "POST /park/jump-passes/${d3_id}/pay"
              payload: {}
              as: Member
              as_user_id: "${m2_id}"
            - call: "POST /park/jump-passes"
              payload: { slot_id: "${slot_id}", participant_id: "${p2_id}", channel: "RESERVATION", sock_count: 1, member_id: "${m2_id}", expected_slot_version: "${slot_v3}" }
              as: Member
              as_user_id: "${m2_id}"
              captures: { d4_id: $.data.id, slot_v4: $.data.version }
            - call: "POST /park/jump-passes/${d4_id}/pay"
              payload: {}
              as: Member
              as_user_id: "${m2_id}"
            - call: "GET /park/slots/${slot_id}"
              payload: {}
              as: FrontDesk
              captures: { slot_v_pre: $.data.version }
          trigger:
            - call: "POST /park/jump-passes"
              payload: { slot_id: "${slot_id}", participant_id: "${p2_id}", channel: "WALKIN", sock_count: 3, member_id: "${m2_id}", expected_slot_version: "${slot_v_pre}" }
              as: FrontDesk
              captures: { pass2_id: $.data.id, pass2_base: $.data.base_charge_cents }
          assert:
            - "JumpPass.${pass2_id}.base_charge_cents == 3600"

      - name: party_pricing_mode_b_pinned_discount_then_room_fee_order
        grounds:
          - calculations.party_pricing
          - entities.PartyBooking.fields.total_cents
          - entities.PartyBooking.fields.deposit_cents
        distinguishing_aspect: |
          MODE (b): pinned operation order — member discount is applied to the per-guest portion
          BEFORE the flat room fee is added, and the deposit rounds the already-frozen total. GOLD
          host, per_guest 1500 x 10 = 15000, discount 25% -> 11250, + room fee 10000 -> total 21250;
          deposit round_half_up(21250*0.25) == 5313. Applying the room fee first or rounding before
          discount would change the cents.
        test_recipe:
          setup:
            - "Park defaults (party_deposit_pct 0.25); clock 2026-06-15."
            - "Slot capacity 30; room cap 30; package per_guest 1500 room_fee 10000 min 4; GOLD host member."
          setup_api_calls:
            - call: "POST /park"
              payload: { name: "Sky Park" }
              as: ParkManager
              captures: { park_id: $.data.id }
            - call: "POST /park/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: ParkManager
            - call: "POST /park/slots"
              payload: { park_id: "${park_id}", starts_at: "2026-06-20T10:00:00Z", ends_at: "2026-06-20T12:00:00Z", jump_capacity: 30, base_price_cents: 2000 }
              as: ParkManager
              captures: { slot_id: $.data.id }
            - call: "POST /park/rooms"
              payload: { park_id: "${park_id}", name: "Room A", room_capacity: 30 }
              as: ParkManager
              captures: { room_id: $.data.id }
            - call: "POST /park/packages"
              payload: { park_id: "${park_id}", name: "Basic", per_guest_cents: 1500, base_room_fee_cents: 10000, min_guests: 4 }
              as: ParkManager
              captures: { pkg_id: $.data.id }
            - call: "POST /park/members"
              payload: { park_id: "${park_id}", email: "host@x.com", full_name: "Host G" }
              as: FrontDesk
              captures: { host_id: $.data.id }
            - call: "POST /park/memberships"
              payload: { member_id: "${host_id}", tier: "GOLD", cycle_anchor_at: "2026-06-01T00:00:00Z" }
              as: Member
              as_user_id: "${host_id}"
          trigger:
            - call: "POST /park/party-bookings"
              payload: { package_id: "${pkg_id}", room_id: "${room_id}", slot_id: "${slot_id}", guest_count: 10, host_member_id: "${host_id}" }
              as: Member
              as_user_id: "${host_id}"
              captures: { booking_id: $.data.id, booking_total: $.data.total_cents }
            - call: "GET /park/slots/${slot_id}"
              payload: {}
              as: FrontDesk
              captures: { slot_v_pre: $.data.version }
            - call: "POST /park/party-bookings/${booking_id}/hold-deposit"
              payload: { expected_slot_version: "${slot_v_pre}" }
              as: Member
              as_user_id: "${host_id}"
              captures: { booking_dep: $.data.deposit_cents }
          assert:
            - "PartyBooking.${booking_id}.total_cents == 21250"
            - "PartyBooking.${booking_id}.deposit_cents == 5313"

  # =================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: jump_pass_parallel_payment_and_admission_axes
        grounds:
          - state_machines.JumpPass.UNPAID_to_PAID
          - state_machines.JumpPass.RESERVED_to_CHECKED_IN
          - entities.JumpPass.fields.admission_status
          - entities.JumpPass.fields.payment_status
        distinguishing_aspect: |
          JumpPass carries PARALLEL dimensions: payment_status (UNPAID->PAID) advances on /pay while
          admission_status stays RESERVED, then admission advances (RESERVED->CHECKED_IN) on /check-in
          independently — after pay the pass reads payment_status PAID + admission_status RESERVED, a
          combined state unreachable on a linear machine.
        test_recipe:
          setup:
            - "Park; clock set so the slot window is open at check-in; reservation pass created and waiver signed."
          setup_api_calls:
            - call: "POST /park"
              payload: { name: "Sky Park" }
              as: ParkManager
              captures: { park_id: $.data.id }
            - call: "POST /park/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-20T09:55:00Z" }
              as: ParkManager
            - call: "POST /park/slots"
              payload: { park_id: "${park_id}", starts_at: "2026-06-20T10:00:00Z", ends_at: "2026-06-20T12:00:00Z", jump_capacity: 10, base_price_cents: 2000 }
              as: ParkManager
              captures: { slot_id: $.data.id, slot_v0: $.data.version }
            - call: "POST /park/participants"
              payload: { park_id: "${park_id}", full_name: "Adult J", birthdate: "1990-01-01T00:00:00Z" }
              as: FrontDesk
              captures: { p_id: $.data.id }
            - call: "POST /park/waivers"
              payload: { participant_id: "${p_id}", signed_by_participant_id: "${p_id}", signature_text: "Adult J" }
              as: FrontDesk
              captures: { waiver_id: $.data.id }
            - call: "POST /park/jump-passes"
              payload: { slot_id: "${slot_id}", participant_id: "${p_id}", channel: "RESERVATION", sock_count: 1, expected_slot_version: "${slot_v0}" }
              as: FrontDesk
              captures: { pass_id: $.data.id }
          trigger:
            - call: "POST /park/jump-passes/${pass_id}/pay"
              payload: {}
              as: FrontDesk
              captures: { after_pay_admission: $.data.admission_status, after_pay_payment: $.data.payment_status }
          assert:
            - "JumpPass.${pass_id}.payment_status == PAID"
            - "JumpPass.${pass_id}.admission_status == RESERVED"

      - name: membership_cyclic_active_pastdue_active_loop
        grounds:
          - state_machines.Membership.ACTIVE_to_PAST_DUE
          - state_machines.Membership.PAST_DUE_to_ACTIVE
          - entities.Membership.fields.status
          - entities.Membership.fields.included_visits_remaining
        distinguishing_aspect: |
          Membership cycles ACTIVE -> PAST_DUE (renew FAILED freezes inclusion to 0) -> ACTIVE
          (renew SUCCEEDED cure resets inclusion to the tier allotment) — a true back-edge to a
          prior state on the same entity, distinct from JumpPass's parallel axes.
        test_recipe:
          setup:
            - "Member with SILVER membership, cycle_anchor 2026-06-01; clock advanced past one cycle so renewal is due."
          setup_api_calls:
            - call: "POST /park"
              payload: { name: "Sky Park" }
              as: ParkManager
              captures: { park_id: $.data.id }
            - call: "POST /park/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ParkManager
            - call: "POST /park/members"
              payload: { park_id: "${park_id}", email: "cyc@x.com", full_name: "Cyc M" }
              as: FrontDesk
              captures: { mc_id: $.data.id }
            - call: "POST /park/memberships"
              payload: { member_id: "${mc_id}", tier: "SILVER", cycle_anchor_at: "2026-06-01T00:00:00Z" }
              as: Member
              as_user_id: "${mc_id}"
              captures: { mship_id: $.data.id }
            - call: "POST /park/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-05T00:00:00Z" }
              as: ParkManager
            - call: "POST /park/memberships/${mship_id}/renew"
              payload: { outcome: "FAILED" }
              as: Member
              as_user_id: "${mc_id}"
              captures: { past_due_status: $.data.status }
          trigger:
            - call: "POST /park/memberships/${mship_id}/renew"
              payload: { outcome: "SUCCEEDED" }
              as: Member
              as_user_id: "${mc_id}"
              captures: { cured_status: $.data.status, cured_visits: $.data.included_visits_remaining }
          assert:
            - "Membership.${mship_id}.status == ACTIVE"
            - "Membership.${mship_id}.included_visits_remaining == 4"

  # =================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # =================================================================
  - rule_id: transitive_cascade
    instances:
      - name: cancel_paid_inclusion_pass_chain_depth3
        grounds:
          - state_machines.JumpPass.RESERVED_to_CANCELLED
          - calculations.cancellation_refund
          - calculations.slot_seat_accounting
          - entities.SessionSlot.fields.status
          - entities.Membership.fields.included_visits_remaining
        distinguishing_aspect: |
          DEPTH-3 cascade from the /cancel trigger: (1) cancel sets pass.admission_status=CANCELLED,
          which (2) releases its slot seat so the slot that was FULL recomputes to OPEN, AND the
          cancel (3) restores one Membership.included_visits_remaining consumed at pay. Each hop is
          caused by the prior state change, not by the original call directly mutating three rows.
        test_recipe:
          setup:
            - "Capacity-1 slot; member GOLD pass that consumed inclusion and was paid, leaving slot FULL and inclusion at 7."
            - "Clock at 2026-06-19T07:00:00Z (>= 120 min before slot start 2026-06-20T10:00:00Z -> full refund)."
          setup_api_calls:
            - call: "POST /park"
              payload: { name: "Sky Park" }
              as: ParkManager
              captures: { park_id: $.data.id }
            - call: "POST /park/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: ParkManager
            - call: "POST /park/slots"
              payload: { park_id: "${park_id}", starts_at: "2026-06-20T10:00:00Z", ends_at: "2026-06-20T12:00:00Z", jump_capacity: 1, base_price_cents: 2000 }
              as: ParkManager
              captures: { slot_id: $.data.id, slot_v0: $.data.version }
            - call: "POST /park/members"
              payload: { park_id: "${park_id}", email: "casc@x.com", full_name: "Casc M" }
              as: FrontDesk
              captures: { mc_id: $.data.id }
            - call: "POST /park/memberships"
              payload: { member_id: "${mc_id}", tier: "GOLD", cycle_anchor_at: "2026-06-01T00:00:00Z" }
              as: Member
              as_user_id: "${mc_id}"
            - call: "POST /park/participants"
              payload: { park_id: "${park_id}", full_name: "Casc J", birthdate: "1990-01-01T00:00:00Z", member_id: "${mc_id}" }
              as: Member
              as_user_id: "${mc_id}"
              captures: { p_id: $.data.id }
            - call: "POST /park/jump-passes"
              payload: { slot_id: "${slot_id}", participant_id: "${p_id}", channel: "RESERVATION", sock_count: 1, member_id: "${mc_id}", expected_slot_version: "${slot_v0}" }
              as: Member
              as_user_id: "${mc_id}"
              captures: { pass_id: $.data.id }
            - call: "POST /park/jump-passes/${pass_id}/pay"
              payload: {}
              as: Member
              as_user_id: "${mc_id}"
            - call: "POST /park/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-19T07:00:00Z" }
              as: ParkManager
          trigger:
            - call: "POST /park/jump-passes/${pass_id}/cancel"
              payload: {}
              as: Member
              as_user_id: "${mc_id}"
              captures: { cancel_refund: $.data.amount_refunded_cents, cancel_paystatus: $.data.payment_status }
            - call: "GET /park/slots/${slot_id}"
              payload: {}
              as: FrontDesk
              captures: { slot_status_after: $.data.status, slot_seats_after: $.data.seats_taken }
          assert:
            - "JumpPass.${pass_id}.admission_status == CANCELLED"
            - "SessionSlot.${slot_id}.seats_taken == 0"
            - "SessionSlot.${slot_id}.status == OPEN"
            - "JumpPass.${pass_id}.amount_refunded_cents == 350"

      - name: severe_incident_closes_slot_depth2
        grounds:
          - state_machines.IncidentReport.transitions
          - state_machines.SessionSlot.OPEN_to_CLOSED
          - entities.SessionSlot.fields.closed
          - entities.SessionSlot.fields.status
        distinguishing_aspect: |
          DEPTH-2 cascade from a DIFFERENT trigger (POST /park/incidents file): filing a SEVERE
          incident (1) creates the report in FILED, which (2) cascade-closes the pass's SessionSlot
          (closed=true, status=CLOSED). The slot close is caused by the incident's severity, not by
          a direct manager close call.
        test_recipe:
          setup:
            - "Walk-in pass CHECKED_IN in an OPEN slot, waiver present; clock within window."
          setup_api_calls:
            - call: "POST /park"
              payload: { name: "Sky Park" }
              as: ParkManager
              captures: { park_id: $.data.id }
            - call: "POST /park/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-20T10:05:00Z" }
              as: ParkManager
            - call: "POST /park/slots"
              payload: { park_id: "${park_id}", starts_at: "2026-06-20T10:00:00Z", ends_at: "2026-06-20T12:00:00Z", jump_capacity: 10, base_price_cents: 2000 }
              as: ParkManager
              captures: { slot_id: $.data.id, slot_v0: $.data.version }
            - call: "POST /park/participants"
              payload: { park_id: "${park_id}", full_name: "Walk J", birthdate: "1990-01-01T00:00:00Z" }
              as: FrontDesk
              captures: { p_id: $.data.id }
            - call: "POST /park/waivers"
              payload: { participant_id: "${p_id}", signed_by_participant_id: "${p_id}", signature_text: "Walk J" }
              as: FrontDesk
            - call: "POST /park/jump-passes"
              payload: { slot_id: "${slot_id}", participant_id: "${p_id}", channel: "WALKIN", sock_count: 1, expected_slot_version: "${slot_v0}" }
              as: FrontDesk
              captures: { pass_id: $.data.id }
          trigger:
            - call: "POST /park/incidents"
              payload: { park_id: "${park_id}", jump_pass_id: "${pass_id}", severity: "SEVERE", narrative: "fall" }
              as: FrontDesk
              captures: { inc_id: $.data.id }
            - call: "GET /park/slots/${slot_id}"
              payload: {}
              as: FrontDesk
              captures: { slot_status_after: $.data.status, slot_closed_after: $.data.closed }
          assert:
            - "IncidentReport.${inc_id}.status == FILED"
            - "SessionSlot.${slot_id}.closed == true"
            - "SessionSlot.${slot_id}.status == CLOSED"

  # =================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # =================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: waiver_safety_beats_capacity_fiscal_on_checkin_vs_create
        grounds:
          - "validations[priority=8]"
          - "validations[priority=15]"
          - "errors[ERR_WAIVER_MISSING_OR_EXPIRED]"
          - "errors[ERR_SLOT_CAPACITY_EXCEEDED]"
        distinguishing_aspect: |
          business_safety (waiver, priority 8) vs business_fiscal (capacity, priority 15): a
          reservation pass exists in a now-FULL slot with NO waiver; attempting check-in fails with
          ERR_WAIVER_MISSING_OR_EXPIRED (safety) — the higher-priority error — even though the slot
          is also at capacity. Different category pair from instance 2.
        test_recipe:
          setup:
            - "Capacity-1 slot filled by another pass (FULL). Target participant has a reserved pass but no waiver."
            - "Clock inside the check-in window."
          setup_api_calls:
            - call: "POST /park"
              payload: { name: "Sky Park" }
              as: ParkManager
              captures: { park_id: $.data.id }
            - call: "POST /park/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-20T09:55:00Z" }
              as: ParkManager
            - call: "POST /park/slots"
              payload: { park_id: "${park_id}", starts_at: "2026-06-20T10:00:00Z", ends_at: "2026-06-20T12:00:00Z", jump_capacity: 2, base_price_cents: 2000 }
              as: ParkManager
              captures: { slot_id: $.data.id, slot_v0: $.data.version }
            - call: "POST /park/participants"
              payload: { park_id: "${park_id}", full_name: "No Waiver J", birthdate: "1990-01-01T00:00:00Z" }
              as: FrontDesk
              captures: { p_target_id: $.data.id }
            - call: "POST /park/jump-passes"
              payload: { slot_id: "${slot_id}", participant_id: "${p_target_id}", channel: "RESERVATION", sock_count: 1, expected_slot_version: "${slot_v0}" }
              as: FrontDesk
              captures: { pass_target_id: $.data.id, slot_v1: $.data.version }
            - call: "POST /park/jump-passes/${pass_target_id}/pay"
              payload: {}
              as: FrontDesk
            - call: "POST /park/participants"
              payload: { park_id: "${park_id}", full_name: "Filler J", birthdate: "1990-01-01T00:00:00Z" }
              as: FrontDesk
              captures: { p_filler_id: $.data.id }
            - call: "POST /park/jump-passes"
              payload: { slot_id: "${slot_id}", participant_id: "${p_filler_id}", channel: "RESERVATION", sock_count: 1, expected_slot_version: "${slot_v1}" }
              as: FrontDesk
              captures: { pass_filler_id: $.data.id }
          trigger:
            - call: "POST /park/jump-passes/${pass_target_id}/check-in"
              payload: {}
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_WAIVER_MISSING_OR_EXPIRED"
            - "response.http_status == 422"

      - name: room_conflict_state_beats_capacity_fiscal_on_hold_deposit
        grounds:
          - "validations[priority=10]"
          - "validations[priority=15]"
          - "errors[ERR_ROOM_CONFLICT]"
          - "errors[ERR_SLOT_CAPACITY_EXCEEDED]"
        distinguishing_aspect: |
          business_temporal (room conflict, priority 10) vs business_fiscal (slot capacity,
          priority 15): a second booking on the same room/slot whose guest_count would BOTH collide
          on the room AND exceed slot capacity fails with ERR_ROOM_CONFLICT (the higher-priority
          temporal check) — a different category pair than instance 1's safety-vs-fiscal.
        test_recipe:
          setup:
            - "Slot capacity 6; room R held by booking B1 (4 guests) on this slot's window."
            - "Second booking B2 for same room+slot, guest_count 6 -> would exceed remaining 2 seats AND collide room interval."
          setup_api_calls:
            - call: "POST /park"
              payload: { name: "Sky Park" }
              as: ParkManager
              captures: { park_id: $.data.id }
            - call: "POST /park/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: ParkManager
            - call: "POST /park/slots"
              payload: { park_id: "${park_id}", starts_at: "2026-06-20T10:00:00Z", ends_at: "2026-06-20T12:00:00Z", jump_capacity: 6, base_price_cents: 2000 }
              as: ParkManager
              captures: { slot_id: $.data.id }
            - call: "POST /park/rooms"
              payload: { park_id: "${park_id}", name: "Room R", room_capacity: 30 }
              as: ParkManager
              captures: { room_id: $.data.id }
            - call: "POST /park/packages"
              payload: { park_id: "${park_id}", name: "Basic", per_guest_cents: 1500, base_room_fee_cents: 10000, min_guests: 4 }
              as: ParkManager
              captures: { pkg_id: $.data.id }
            - call: "POST /park/party-bookings"
              payload: { package_id: "${pkg_id}", room_id: "${room_id}", slot_id: "${slot_id}", guest_count: 4 }
              as: FrontDesk
              captures: { b1_id: $.data.id }
            - call: "GET /park/slots/${slot_id}"
              payload: {}
              as: FrontDesk
              captures: { slot_v_b1: $.data.version }
            - call: "POST /park/party-bookings/${b1_id}/hold-deposit"
              payload: { expected_slot_version: "${slot_v_b1}" }
              as: FrontDesk
            - call: "POST /park/party-bookings"
              payload: { package_id: "${pkg_id}", room_id: "${room_id}", slot_id: "${slot_id}", guest_count: 6 }
              as: FrontDesk
              captures: { b2_id: $.data.id }
            - call: "GET /park/slots/${slot_id}"
              payload: {}
              as: FrontDesk
              captures: { slot_v_b2: $.data.version }
          trigger:
            - call: "POST /park/party-bookings/${b2_id}/hold-deposit"
              payload: { expected_slot_version: "${slot_v_b2}" }
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_ROOM_CONFLICT"
            - "response.http_status == 409"

  # =================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # =================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: cancellation_cutoff_exact_boundary_full_refund
        grounds:
          - calculations.cancellation_refund
          - "validations[priority=5]"
          - entities.JumpPass.fields.amount_refunded_cents
        distinguishing_aspect: |
          Metric = minutes_before vs cancellation_cutoff_minutes (120). At EXACTLY 120 minutes
          before slot start the >= boundary is inclusive -> full refund (REFUNDED). One minute later
          (119) would be partial. Reachable through POST /park/jump-passes/{id}/cancel.
        test_recipe:
          setup:
            - "Paid reservation pass, base 2000 + 1 sock (paid 2350); clock set to exactly slot.starts_at - 120min = 2026-06-20T08:00:00Z."
          setup_api_calls:
            - call: "POST /park"
              payload: { name: "Sky Park" }
              as: ParkManager
              captures: { park_id: $.data.id }
            - call: "POST /park/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: ParkManager
            - call: "POST /park/slots"
              payload: { park_id: "${park_id}", starts_at: "2026-06-20T10:00:00Z", ends_at: "2026-06-20T12:00:00Z", jump_capacity: 10, base_price_cents: 2000 }
              as: ParkManager
              captures: { slot_id: $.data.id, slot_v0: $.data.version }
            - call: "POST /park/participants"
              payload: { park_id: "${park_id}", full_name: "Bndry J", birthdate: "1990-01-01T00:00:00Z" }
              as: FrontDesk
              captures: { p_id: $.data.id }
            - call: "POST /park/jump-passes"
              payload: { slot_id: "${slot_id}", participant_id: "${p_id}", channel: "RESERVATION", sock_count: 1, expected_slot_version: "${slot_v0}" }
              as: FrontDesk
              captures: { pass_id: $.data.id }
            - call: "POST /park/jump-passes/${pass_id}/pay"
              payload: {}
              as: FrontDesk
            - call: "POST /park/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-20T08:00:00Z" }
              as: ParkManager
          trigger:
            - call: "POST /park/jump-passes/${pass_id}/cancel"
              payload: {}
              as: FrontDesk
              captures: { refunded: $.data.amount_refunded_cents, paystatus: $.data.payment_status }
          assert:
            - "JumpPass.${pass_id}.amount_refunded_cents == 2350"
            - "JumpPass.${pass_id}.payment_status == REFUNDED"

      - name: slot_capacity_exact_fill_flips_to_full_zero_remaining
        grounds:
          - calculations.slot_seat_accounting
          - state_machines.SessionSlot.OPEN_to_FULL
          - "validations[priority=15]"
          - entities.SessionSlot.fields.status
        distinguishing_aspect: |
          Different metric (seat count, not minutes) on a different endpoint (POST
          /park/jump-passes): consuming the seat that makes seats_taken EXACTLY equal jump_capacity
          flips status OPEN->FULL with zero remaining; the very next create on the same slot is
          rejected ERR_SLOT_CAPACITY_EXCEEDED.
        test_recipe:
          setup:
            - "Capacity-2 slot; one reservation pass already created (seats_taken 1)."
          setup_api_calls:
            - call: "POST /park"
              payload: { name: "Sky Park" }
              as: ParkManager
              captures: { park_id: $.data.id }
            - call: "POST /park/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: ParkManager
            - call: "POST /park/slots"
              payload: { park_id: "${park_id}", starts_at: "2026-06-20T10:00:00Z", ends_at: "2026-06-20T12:00:00Z", jump_capacity: 2, base_price_cents: 2000 }
              as: ParkManager
              captures: { slot_id: $.data.id, slot_v0: $.data.version }
            - call: "POST /park/participants"
              payload: { park_id: "${park_id}", full_name: "Fill1", birthdate: "1990-01-01T00:00:00Z" }
              as: FrontDesk
              captures: { p1_id: $.data.id }
            - call: "POST /park/jump-passes"
              payload: { slot_id: "${slot_id}", participant_id: "${p1_id}", channel: "RESERVATION", sock_count: 1, expected_slot_version: "${slot_v0}" }
              as: FrontDesk
              captures: { pass1_id: $.data.id, slot_v1: $.data.version }
            - call: "POST /park/participants"
              payload: { park_id: "${park_id}", full_name: "Fill2", birthdate: "1990-01-01T00:00:00Z" }
              as: FrontDesk
              captures: { p2_id: $.data.id }
          trigger:
            - call: "POST /park/jump-passes"
              payload: { slot_id: "${slot_id}", participant_id: "${p2_id}", channel: "RESERVATION", sock_count: 1, expected_slot_version: "${slot_v1}" }
              as: FrontDesk
              captures: { pass2_id: $.data.id }
            - call: "GET /park/slots/${slot_id}"
              payload: {}
              as: FrontDesk
              captures: { status_after: $.data.status, seats_after: $.data.seats_taken }
          assert:
            - "SessionSlot.${slot_id}.seats_taken == 2"
            - "SessionSlot.${slot_id}.status == FULL"

  # =================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # =================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: checkin_requires_signed_waiver_pass_depends_on_waiver
        grounds:
          - state_machines.JumpPass.RESERVED_to_CHECKED_IN
          - "validations[priority=8]"
          - entities.Waiver.fields.status
          - "errors[ERR_WAIVER_MISSING_OR_EXPIRED]"
        distinguishing_aspect: |
          Entity pair JumpPass -> Waiver: a JumpPass RESERVED->CHECKED_IN transition is legal only
          when a SIGNED, unexpired Waiver exists for the participant; with the waiver VOIDED (or
          absent) the transition is rejected. Different pair than instance 2.
        test_recipe:
          setup:
            - "Paid reservation pass; participant's only waiver is VOIDED by signing a second waiver that supersedes it... instead we simply never sign a waiver -> absent."
            - "Clock inside check-in window."
          setup_api_calls:
            - call: "POST /park"
              payload: { name: "Sky Park" }
              as: ParkManager
              captures: { park_id: $.data.id }
            - call: "POST /park/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-20T09:55:00Z" }
              as: ParkManager
            - call: "POST /park/slots"
              payload: { park_id: "${park_id}", starts_at: "2026-06-20T10:00:00Z", ends_at: "2026-06-20T12:00:00Z", jump_capacity: 10, base_price_cents: 2000 }
              as: ParkManager
              captures: { slot_id: $.data.id, slot_v0: $.data.version }
            - call: "POST /park/participants"
              payload: { park_id: "${park_id}", full_name: "NoWaiver J", birthdate: "1990-01-01T00:00:00Z" }
              as: FrontDesk
              captures: { p_id: $.data.id }
            - call: "POST /park/jump-passes"
              payload: { slot_id: "${slot_id}", participant_id: "${p_id}", channel: "RESERVATION", sock_count: 1, expected_slot_version: "${slot_v0}" }
              as: FrontDesk
              captures: { pass_id: $.data.id }
            - call: "POST /park/jump-passes/${pass_id}/pay"
              payload: {}
              as: FrontDesk
          trigger:
            - call: "POST /park/jump-passes/${pass_id}/check-in"
              payload: {}
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_WAIVER_MISSING_OR_EXPIRED"
            - "response.http_status == 422"

      - name: party_hold_deposit_depends_on_slot_not_closed
        grounds:
          - state_machines.PartyBooking.PENDING_to_DEPOSIT_HELD
          - state_machines.SessionSlot.OPEN_to_CLOSED
          - "validations[priority=15]"
          - "errors[ERR_SLOT_CAPACITY_EXCEEDED]"
        distinguishing_aspect: |
          Entity pair PartyBooking -> SessionSlot: a PartyBooking PENDING->DEPOSIT_HELD transition is
          legal only when the referenced SessionSlot is not CLOSED; after a manager closes the slot
          the deposit hold is rejected ERR_SLOT_CAPACITY_EXCEEDED. Different pair than instance 1.
        test_recipe:
          setup:
            - "Pending booking on a slot; manager then CLOSES the slot before deposit hold."
          setup_api_calls:
            - call: "POST /park"
              payload: { name: "Sky Park" }
              as: ParkManager
              captures: { park_id: $.data.id }
            - call: "POST /park/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: ParkManager
            - call: "POST /park/slots"
              payload: { park_id: "${park_id}", starts_at: "2026-06-20T10:00:00Z", ends_at: "2026-06-20T12:00:00Z", jump_capacity: 20, base_price_cents: 2000 }
              as: ParkManager
              captures: { slot_id: $.data.id }
            - call: "POST /park/rooms"
              payload: { park_id: "${park_id}", name: "Room A", room_capacity: 30 }
              as: ParkManager
              captures: { room_id: $.data.id }
            - call: "POST /park/packages"
              payload: { park_id: "${park_id}", name: "Basic", per_guest_cents: 1500, base_room_fee_cents: 10000, min_guests: 4 }
              as: ParkManager
              captures: { pkg_id: $.data.id }
            - call: "POST /park/party-bookings"
              payload: { package_id: "${pkg_id}", room_id: "${room_id}", slot_id: "${slot_id}", guest_count: 6 }
              as: FrontDesk
              captures: { booking_id: $.data.id }
            - call: "POST /park/slots/${slot_id}/close"
              payload: {}
              as: ParkManager
            - call: "GET /park/slots/${slot_id}"
              payload: {}
              as: FrontDesk
              captures: { slot_v_closed: $.data.version }
          trigger:
            - call: "POST /park/party-bookings/${booking_id}/hold-deposit"
              payload: { expected_slot_version: "${slot_v_closed}" }
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_SLOT_CAPACITY_EXCEEDED"
            - "response.http_status == 409"

  # =================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # =================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: party_room_turnover_buffer_overlap_rejected
        grounds:
          - "validations[priority=10]"
          - entities.PartyRoom.fields.turnover_buffer_minutes
          - state_machines.PartyBooking.PENDING_to_DEPOSIT_HELD
          - "errors[ERR_ROOM_CONFLICT]"
        distinguishing_aspect: |
          Interval semantics = BUFFERED adjacency: room booking windows must be separated by
          turnover_buffer_minutes (30). Booking B1 occupies 10:00-12:00; B2 on the SAME room at
          12:15-13:00 starts only 15 min after B1 ends (< 30 buffer) and is rejected ERR_ROOM_CONFLICT,
          even though the raw intervals do not overlap.
        test_recipe:
          setup:
            - "Room with turnover_buffer 30; slot S1 10:00-12:00 holds B1; slot S2 12:15-13:00 for B2 on the same room."
          setup_api_calls:
            - call: "POST /park"
              payload: { name: "Sky Park" }
              as: ParkManager
              captures: { park_id: $.data.id }
            - call: "POST /park/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: ParkManager
            - call: "POST /park/slots"
              payload: { park_id: "${park_id}", starts_at: "2026-06-20T10:00:00Z", ends_at: "2026-06-20T12:00:00Z", jump_capacity: 30, base_price_cents: 2000 }
              as: ParkManager
              captures: { slot1_id: $.data.id }
            - call: "POST /park/slots"
              payload: { park_id: "${park_id}", starts_at: "2026-06-20T12:15:00Z", ends_at: "2026-06-20T13:00:00Z", jump_capacity: 30, base_price_cents: 2000 }
              as: ParkManager
              captures: { slot2_id: $.data.id }
            - call: "POST /park/rooms"
              payload: { park_id: "${park_id}", name: "Room A", room_capacity: 30, turnover_buffer_minutes: 30 }
              as: ParkManager
              captures: { room_id: $.data.id }
            - call: "POST /park/packages"
              payload: { park_id: "${park_id}", name: "Basic", per_guest_cents: 1500, base_room_fee_cents: 10000, min_guests: 4 }
              as: ParkManager
              captures: { pkg_id: $.data.id }
            - call: "POST /park/party-bookings"
              payload: { package_id: "${pkg_id}", room_id: "${room_id}", slot_id: "${slot1_id}", guest_count: 6 }
              as: FrontDesk
              captures: { b1_id: $.data.id }
            - call: "GET /park/slots/${slot1_id}"
              payload: {}
              as: FrontDesk
              captures: { slot1_v: $.data.version }
            - call: "POST /park/party-bookings/${b1_id}/hold-deposit"
              payload: { expected_slot_version: "${slot1_v}" }
              as: FrontDesk
            - call: "POST /park/party-bookings"
              payload: { package_id: "${pkg_id}", room_id: "${room_id}", slot_id: "${slot2_id}", guest_count: 6 }
              as: FrontDesk
              captures: { b2_id: $.data.id }
            - call: "GET /park/slots/${slot2_id}"
              payload: {}
              as: FrontDesk
              captures: { slot2_v: $.data.version }
          trigger:
            - call: "POST /park/party-bookings/${b2_id}/hold-deposit"
              payload: { expected_slot_version: "${slot2_v}" }
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_ROOM_CONFLICT"
            - "response.http_status == 409"

      - name: slot_aggregate_capacity_overlap_rejected
        grounds:
          - "validations[priority=15]"
          - calculations.slot_seat_accounting
          - entities.SessionSlot.fields.jump_capacity
          - "errors[ERR_SLOT_CAPACITY_EXCEEDED]"
        distinguishing_aspect: |
          Interval semantics = AGGREGATE-CAPACITY occupancy on a different resource (SessionSlot, not
          PartyRoom): many passes/guests share one window and the conflict is breach of summed
          jump_capacity, not pairwise interval geometry. With capacity 3 and seats_taken 3, a new
          jump-pass create is rejected ERR_SLOT_CAPACITY_EXCEEDED — a different geometric treatment
          (counting vs adjacency-buffer) than instance 1.
        test_recipe:
          setup:
            - "Capacity-3 slot already at seats_taken 3 (three reservation passes)."
          setup_api_calls:
            - call: "POST /park"
              payload: { name: "Sky Park" }
              as: ParkManager
              captures: { park_id: $.data.id }
            - call: "POST /park/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: ParkManager
            - call: "POST /park/slots"
              payload: { park_id: "${park_id}", starts_at: "2026-06-20T10:00:00Z", ends_at: "2026-06-20T12:00:00Z", jump_capacity: 3, base_price_cents: 2000 }
              as: ParkManager
              captures: { slot_id: $.data.id, slot_v0: $.data.version }
            - call: "POST /park/participants"
              payload: { park_id: "${park_id}", full_name: "G1", birthdate: "1990-01-01T00:00:00Z" }
              as: FrontDesk
              captures: { p1_id: $.data.id }
            - call: "POST /park/jump-passes"
              payload: { slot_id: "${slot_id}", participant_id: "${p1_id}", channel: "RESERVATION", sock_count: 1, expected_slot_version: "${slot_v0}" }
              as: FrontDesk
              captures: { slot_v1: $.data.version }
            - call: "POST /park/participants"
              payload: { park_id: "${park_id}", full_name: "G2", birthdate: "1990-01-01T00:00:00Z" }
              as: FrontDesk
              captures: { p2_id: $.data.id }
            - call: "POST /park/jump-passes"
              payload: { slot_id: "${slot_id}", participant_id: "${p2_id}", channel: "RESERVATION", sock_count: 1, expected_slot_version: "${slot_v1}" }
              as: FrontDesk
              captures: { slot_v2: $.data.version }
            - call: "POST /park/participants"
              payload: { park_id: "${park_id}", full_name: "G3", birthdate: "1990-01-01T00:00:00Z" }
              as: FrontDesk
              captures: { p3_id: $.data.id }
            - call: "POST /park/jump-passes"
              payload: { slot_id: "${slot_id}", participant_id: "${p3_id}", channel: "RESERVATION", sock_count: 1, expected_slot_version: "${slot_v2}" }
              as: FrontDesk
              captures: { slot_v3: $.data.version }
            - call: "POST /park/participants"
              payload: { park_id: "${park_id}", full_name: "G4", birthdate: "1990-01-01T00:00:00Z" }
              as: FrontDesk
              captures: { p4_id: $.data.id }
          trigger:
            - call: "POST /park/jump-passes"
              payload: { slot_id: "${slot_id}", participant_id: "${p4_id}", channel: "RESERVATION", sock_count: 1, expected_slot_version: "${slot_v3}" }
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_SLOT_CAPACITY_EXCEEDED"
            - "response.http_status == 409"

  # =================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =================================================================
  - rule_id: compensating_invariant
    instances:
      - name: cancel_restores_slot_seat_conservation
        grounds:
          - state_machines.JumpPass.RESERVED_to_CANCELLED
          - calculations.slot_seat_accounting
          - entities.SessionSlot.fields.seats_taken
        distinguishing_aspect: |
          Conserved quantity = SLOT SEATS. Invariant: seats_taken == count(JumpPass in
          {RESERVED,CHECKED_IN}) + sum(PartyBooking.guest_count in held states). Creating then
          cancelling a reservation pass leaves seats_taken back at its pre-create value (0), zero
          drift.
        test_recipe:
          setup:
            - "Empty capacity-1 slot (seats_taken 0)."
          setup_api_calls:
            - call: "POST /park"
              payload: { name: "Sky Park" }
              as: ParkManager
              captures: { park_id: $.data.id }
            - call: "POST /park/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: ParkManager
            - call: "POST /park/slots"
              payload: { park_id: "${park_id}", starts_at: "2026-06-20T10:00:00Z", ends_at: "2026-06-20T12:00:00Z", jump_capacity: 1, base_price_cents: 2000 }
              as: ParkManager
              captures: { slot_id: $.data.id, slot_v0: $.data.version }
            - call: "POST /park/participants"
              payload: { park_id: "${park_id}", full_name: "Comp J", birthdate: "1990-01-01T00:00:00Z" }
              as: FrontDesk
              captures: { p_id: $.data.id }
            - call: "POST /park/jump-passes"
              payload: { slot_id: "${slot_id}", participant_id: "${p_id}", channel: "RESERVATION", sock_count: 1, expected_slot_version: "${slot_v0}" }
              as: FrontDesk
              captures: { pass_id: $.data.id }
          trigger:
            - call: "POST /park/jump-passes/${pass_id}/cancel"
              payload: {}
              as: FrontDesk
            - call: "GET /park/slots/${slot_id}"
              payload: {}
              as: FrontDesk
              captures: { seats_after: $.data.seats_taken, status_after: $.data.status }
          assert:
            - "SessionSlot.${slot_id}.seats_taken == 0"
            - "SessionSlot.${slot_id}.status == OPEN"

      - name: cancel_restores_member_included_visits_conservation
        grounds:
          - state_machines.JumpPass.RESERVED_to_CANCELLED
          - state_machines.JumpPass.UNPAID_to_PAID
          - entities.Membership.fields.included_visits_remaining
          - entities.JumpPass.fields.included_visit_consumed
        distinguishing_aspect: |
          Conserved quantity = MEMBER INCLUDED VISITS (different from slot seats). Invariant:
          included_visits_remaining == tier_allotment - count(non-cancelled passes that consumed
          inclusion this cycle). Pay consumes one inclusion (GOLD 8 -> 7); cancelling that pass
          restores it (back to 8), zero drift.
        test_recipe:
          setup:
            - "GOLD member, fresh membership (8 included); paid pass consumed one inclusion (now 7); clock >= cutoff for full refund path."
          setup_api_calls:
            - call: "POST /park"
              payload: { name: "Sky Park" }
              as: ParkManager
              captures: { park_id: $.data.id }
            - call: "POST /park/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: ParkManager
            - call: "POST /park/slots"
              payload: { park_id: "${park_id}", starts_at: "2026-06-20T10:00:00Z", ends_at: "2026-06-20T12:00:00Z", jump_capacity: 10, base_price_cents: 2000 }
              as: ParkManager
              captures: { slot_id: $.data.id, slot_v0: $.data.version }
            - call: "POST /park/members"
              payload: { park_id: "${park_id}", email: "inv@x.com", full_name: "Inv M" }
              as: FrontDesk
              captures: { m_id: $.data.id }
            - call: "POST /park/memberships"
              payload: { member_id: "${m_id}", tier: "GOLD", cycle_anchor_at: "2026-06-01T00:00:00Z" }
              as: Member
              as_user_id: "${m_id}"
              captures: { mship_id: $.data.id }
            - call: "POST /park/participants"
              payload: { park_id: "${park_id}", full_name: "Inv J", birthdate: "1990-01-01T00:00:00Z", member_id: "${m_id}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { p_id: $.data.id }
            - call: "POST /park/jump-passes"
              payload: { slot_id: "${slot_id}", participant_id: "${p_id}", channel: "RESERVATION", sock_count: 1, member_id: "${m_id}", expected_slot_version: "${slot_v0}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { pass_id: $.data.id }
            - call: "POST /park/jump-passes/${pass_id}/pay"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
          trigger:
            - call: "POST /park/jump-passes/${pass_id}/cancel"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
            - call: "GET /park/memberships/${mship_id}"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
              captures: { visits_after: $.data.included_visits_remaining }
          assert:
            - "Membership.${mship_id}.included_visits_remaining == 8"
            - "JumpPass.${pass_id}.admission_status == CANCELLED"
