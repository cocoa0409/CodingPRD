      - name: content_edit_apply_cascade_down_to_slots_and_submissions
        claim_type: cascade_down
        grounds:
          - state_machines.ContentEdit.APPROVED_to_APPLIED
        excluded_because:
          difficulty_instance: "transitive_cascade / content_edit_apply_four_hop_staleness_cascade"
          rationale: "That instance asserts all four hops of the apply cascade end-to-end, including slot cancellation and the SCHEDULED -> FILED walk-back."
      - name: submission_parallel_dimensions_move_independently
        claim_type: parallel
        grounds:
          - state_machines.Submission
        excluded_because:
          difficulty_instance: "non_linear_state_machine / submission_parallel_review_and_pricing_dimensions"
          rationale: "That instance drives review_status back to DRAFT while pricing_status stays PRICE_APPROVED."
      - name: content_edit_reject_resubmit_loop_terminates
        claim_type: cyclic
        grounds:
          - state_machines.ContentEdit.REJECTED_to_PROPOSED
        excluded_because:
          difficulty_instance: "non_linear_state_machine / content_edit_reject_resubmit_cycle_hits_revision_ceiling"
          rationale: "That instance walks the loop to the MAX_REVISION_ROUNDS ceiling and asserts the terminating error."
      - name: tally_fork_paths_each_work
        claim_type: branching
        grounds:
          - state_machines.PresentationSlot.PRESENTED_to_TALLIED
        excluded_because:
          difficulty_instance: "non_linear_state_machine / slot_tally_branches_diverge_on_same_panel"
          rationale: "That instance takes both the RECOMMEND and the REJECT branch on one panel and contrasts every divergent field."
      - name: content_edit_revert_reverses_all_apply_side_effects
        claim_type: compensation
        grounds:
          - state_machines.ContentEdit.APPLIED_to_REVERTED
        excluded_because:
          difficulty_instance: "compensating_invariant / content_edit_revert_restores_page_budget"
          rationale: "That instance asserts the page-budget conservation and the content_tags rollback after revert."
      - name: order_cancel_reconciles_title_unit_ledger
        claim_type: ledger_sync
        grounds:
          - state_machines.DistrictOrder.CONFIRMED_to_CANCELLED
        excluded_because:
          difficulty_instance: "compensating_invariant / order_cancel_restores_print_unit_ledger"
          rationale: "That instance reconciles all five print-unit buckets against total_received_units after the cancel."
      - name: panel_open_session_requires_cycle_in_review
        claim_type: guarded_transitions
        grounds:
          - state_machines.CommitteePanel.SCHEDULED_to_IN_SESSION
        excluded_because:
          difficulty_instance: "cross_entity_state_dependency / panel_open_session_gated_by_cycle_review_phase"
          rationale: "That instance asserts both the guarded rejection and the success after the cycle reaches IN_REVIEW."
      - name: phase_advance_sweep_conditional_cascade_on_overdue_comments
        claim_type: conditional_cascade
        grounds:
          - state_machines.PublicComment.OPEN_to_ESCALATED
        excluded_because:
          difficulty_instance: "transitive_cascade / phase_advance_escalation_four_hop_cascade"
          rationale: "That instance asserts the S1/S2/S3 sweep chain including the conditional slot cancellation."

  # ===========================================================================
  # Section 3 - Calculations
