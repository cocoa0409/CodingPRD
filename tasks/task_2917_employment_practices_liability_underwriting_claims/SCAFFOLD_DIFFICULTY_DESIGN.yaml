  # ===========================================================================
  # RULE 3 — non_linear_state_machine
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: policy_status_and_limit_posture_independent_parallel_axes
        grounds:
          - state_machines.Policy.ACTIVE_to_SUSPENDED
          - state_machines.Policy.SUSPENDED_to_ACTIVE
          - state_machines.Policy.OPEN_to_ERODED
          - state_machines.Policy.ERODED_to_OPEN
          - entities.Policy.fields.status
          - entities.Policy.fields.limit_posture
          - calculations.indemnity_waterfall
        distinguishing_aspect: |
          PARALLEL dimensions on the Policy entity: Policy carries two independent
          state machines (status BOUND/ACTIVE/SUSPENDED/EXPIRED and limit_posture
          OPEN/ERODED/EXHAUSTED). Suspending and reinstating the policy moves status
          ACTIVE -> SUSPENDED -> ACTIVE while limit_posture stays pinned at ERODED
          across both moves, and voiding the payment moves limit_posture ERODED ->
          OPEN while status stays ACTIVE — neither axis ever reads the other.
        test_recipe:
          setup:
            - "Chain S: jurisdiction TX (T2), ACTIVE RatePlan 'EPLI Standard 2026', applicant 'Bayline Foods LLC' (total_headcount 40, prior_year_separations 4, TX 40, primary TX) — exposure_score 28.00."
            - "The assessment requests aggregate_limit 10000000 and retention 2500000 with third-party coverage NOT requested; it prices to PRICED (28.00 < 72.00) with indicated_premium_cents 1803600, is approved by uwm-001, and binds to an ACTIVE / OPEN policy for [2026-08-01, 2027-08-01)."
            - "A DISCRIMINATION / EMPLOYEE claim (FIRST_PARTY bucket, applied_retention_cents 2500000) is reported and accepted."
            - "A 4000000 SETTLEMENT payment is created and approved, splitting 2500000 retention / 1500000 insurer, which drives limit_posture OPEN -> ERODED and leaves the claim RESOLVED."
          setup_api_calls:
            - call: "POST /epli/jurisdictions"
              payload: { code: "TX", name: "Texas", hazard_tier: "T2", admin_agency_name: "Texas Workforce Commission Civil Rights Division", pre_suit_window_days: 120, wage_hour_multiplier: 1.10, class_action_propensity_pct: 18.00, pre_suit_mediation_required: false }
              as: PlatformAdmin
              as_user_id: "admin-001"
            - call: "POST /epli/rate-plans"
              payload: { name: "EPLI Standard 2026", base_rate_per_employee_cents: 41750, min_premium_cents: 750000, wage_hour_sublimit_pct: 0.25, third_party_sublimit_pct: 0.40 }
              as: PlatformAdmin
              as_user_id: "admin-001"
              captures: { plan_id: $.data.id }
            - call: "POST /epli/rate-plans/${plan_id}/activate"
              payload: {}
              as: PlatformAdmin
              as_user_id: "admin-001"
            - call: "POST /epli/applicants"
              payload: { legal_name: "Bayline Foods LLC", total_headcount: 40, prior_year_separations: 4, jurisdiction_headcounts: [{ code: "TX", headcount: 40 }], primary_jurisdiction_code: "TX" }
              as: Underwriter
              as_user_id: "uw-001"
              captures: { app_id: $.data.id, app_v: $.data.version }
            - call: "POST /epli/exposure-assessments"
              payload: { applicant_id: "${app_id}", rate_plan_id: "${plan_id}", requested_aggregate_limit_cents: 10000000, requested_retention_cents: 2500000, expected_applicant_version: "${app_v}" }
              as: Underwriter
              as_user_id: "uw-001"
              captures: { asmt_id: $.data.id }
            - call: "POST /epli/exposure-assessments/${asmt_id}/price"
              payload: {}
              as: Underwriter
              as_user_id: "uw-001"
            - call: "POST /epli/exposure-assessments/${asmt_id}/approve"
              payload: {}
              as: UnderwritingManager
              as_user_id: "uwm-001"
            - call: "POST /epli/policies"
              payload: { exposure_assessment_id: "${asmt_id}", effective_from: "2026-08-01T00:00:00.000Z", effective_to: "2027-08-01T00:00:00.000Z" }
              as: Underwriter
              as_user_id: "uw-001"
              captures: { pol_id: $.data.id }
            - call: "POST /epli/policies/${pol_id}/claims"
              payload: { claim_type: "DISCRIMINATION", claimant_class: "EMPLOYEE", notice_type: "LAWSUIT", first_notice_at: "2026-08-01T00:00:00.000Z", alleged_damages_cents: 6000000 }
              as: ClaimsAdjuster
              as_user_id: "adj-001"
              captures: { c1_id: $.data.id }
            - call: "POST /epli/claims/${c1_id}/start-review"
              payload: {}
              as: ClaimsAdjuster
              as_user_id: "adj-001"
            - call: "POST /epli/claims/${c1_id}/coverage-decision"
              payload: { decision: "ACCEPT" }
              as: ClaimsAdjuster
              as_user_id: "adj-001"
            - call: "GET /epli/policies/${pol_id}"
              payload: {}
              as: ClaimsAdjuster
              as_user_id: "adj-001"
              captures: { pol_v1: $.data.version }
            - call: "POST /epli/claims/${c1_id}/indemnity-payments"
              payload: { amount_cents: 4000000, payment_basis: "SETTLEMENT", expected_policy_version: "${pol_v1}" }
              as: ClaimsAdjuster
              as_user_id: "adj-001"
              captures: { pay_id: $.data.id }
            - call: "POST /epli/indemnity-payments/${pay_id}/approve"
              payload: {}
              as: ClaimsManager
              as_user_id: "clm-001"
          trigger:
            - call: "POST /epli/policies/${pol_id}/suspend"
              payload: { suspension_reason: "Premium audit outstanding" }
              as: UnderwritingManager
              as_user_id: "uwm-001"
            - call: "POST /epli/policies/${pol_id}/reinstate"
              payload: {}
              as: UnderwritingManager
              as_user_id: "uwm-001"
            - call: "POST /epli/indemnity-payments/${pay_id}/void"
              payload: { void_reason: "Settlement rescinded by the claimant" }
              as: ClaimsManager
              as_user_id: "clm-001"
          assert:
            - "ExposureAssessment.${asmt_id}.indicated_premium_cents == 1803600"
            - "ExposureAssessment.${asmt_id}.exposure_score_snapshot == 28.00"
            - "Policy.${pol_id}.third_party_coverage_elected == false"
            - "Policy.${pol_id}.wage_hour_sublimit_cents == 2500000"
            - "Claim.${c1_id}.coverage_bucket == FIRST_PARTY"
            - "Claim.${c1_id}.applied_retention_cents == 2500000"
            - "IndemnityPayment.${pay_id}.retention_portion_cents == 2500000"
            - "IndemnityPayment.${pay_id}.insurer_portion_cents == 1500000"
            - "after the suspend call: Policy.${pol_id}.status == SUSPENDED AND Policy.${pol_id}.limit_posture == ERODED"
            - "after the suspend call: Policy.${pol_id}.suspended_at == 2026-08-01T00:00:00.000Z"
            - "after the suspend call: Policy.${pol_id}.aggregate_limit_remaining_cents == 8500000 (the status move did not touch the ledger)"
            - "after the suspend call: Claim.${c1_id}.coverage_gated == false (a RESOLVED claim is outside CASCADE HOP 1's status filter)"
            - "after the reinstate call: Policy.${pol_id}.status == ACTIVE AND Policy.${pol_id}.limit_posture == ERODED"
            - "after the reinstate call: Policy.${pol_id}.suspended_at == null AND Policy.${pol_id}.suspension_reason == null"
            - "after the void call: Policy.${pol_id}.status == ACTIVE AND Policy.${pol_id}.limit_posture == OPEN"
            - "after the void call: Policy.${pol_id}.aggregate_limit_remaining_cents == 10000000 AND Policy.${pol_id}.indemnity_paid_cents == 0"
            - "after the void call: Claim.${c1_id}.status == RESOLVED (the void never rolls the claim status back)"
            - "the status axis visited ACTIVE -> SUSPENDED -> ACTIVE while limit_posture stayed ERODED, and limit_posture then moved ERODED -> OPEN while status stayed ACTIVE"

