              as: ProgramAdmin
              captures: { bronze: "$.data.id" }
            - call: "POST /pass-tiers/${bronze}/status"
              payload: { target_status: "PUBLISHED" }
              as: ProgramAdmin
            - call: "POST /pass-tiers"
              payload: { program_id: "${prog}", name: "GOLD", tier_rank: 3, base_price_cents: 30000, parking_benefit: "INCLUDED", in_park_discount_pct: 0.15, reservation_required_on_peak: false, peak_reservation_quota: 5 }
              as: ProgramAdmin
              captures: { gold: "$.data.id" }
            - call: "POST /pass-tiers/${gold}/status"
              payload: { target_status: "PUBLISHED" }
              as: ProgramAdmin
            - call: "POST /pass-programs/${prog}/advance-status"
              payload: { target_status: "SALES_OPEN" }
              as: ProgramAdmin
            - call: "POST /passholders"
              payload: { full_name: "Ada Holder", email: "ada@example.com", date_of_birth: "1990-04-02" }
              as: PassOfficeClerk
              captures: { holder_a: "$.data.id" }
            - call: "POST /season-passes"
              payload: { program_id: "${prog}", tier_id: "${bronze}", passholder_id: "${holder_a}", payment_mode: "PAYMENT_PLAN" }
              as: PassOfficeClerk
              captures: { pass_a: "$.data.id" }
            - call: "POST /season-passes/${pass_a}/process"
              payload: { photo_hash: "sha256:aaa", government_id_last4: "1234" }
              as: PassOfficeClerk
              captures: { pass_a_v: "$.data.version" }
            - call: "POST /season-passes/${pass_a}/payment-plans"
              payload: { down_payment_cents: 3000, installment_count: 4, first_due_date: "2026-09-01", expected_season_pass_version: "${pass_a_v}" }
              as: PassOfficeClerk
              captures: { plan_a: "$.data.id" }
            - call: "GET /installments?payment_plan_id=${plan_a}"
              as: PassOfficeClerk
              captures: { inst_1: "$.data[0].id", inst_2: "$.data[1].id" }
            - call: "POST /installments/${inst_1}/settle"
              payload: { amount_cents: 2625 }
              as: PassOfficeClerk
            - call: "POST /installments/${inst_2}/settle"
              payload: { amount_cents: 2625 }
              as: PassOfficeClerk
            - call: "POST /upgrade-orders"
              payload: { season_pass_id: "${pass_a}", source_tier_id: "${bronze}", target_tier_id: "${gold}", credit_mode: "PAID_TO_DATE" }
              as: PassOfficeClerk
              captures: { uo: "$.data.id" }
          trigger:
            - call: "POST /upgrade-orders/${uo}/apply"
              payload: { payment_amount_cents: 10750 }
              as: PassOfficeClerk
            - call: "POST /upgrade-orders/${uo}/reverse"
              payload: { reason: "Holder disputed the tier change" }
              as: ComplianceOfficer
              as_user_id: "officer-9"
          assert:
            - "BEFORE — GET /season-passes/${pass_a} → billed_total_cents 13500 == paid_to_date_cents 8250 + credited_amount_cents 0 + outstanding_balance_cents 5250"
            - "AFTER APPLY — GET /season-passes/${pass_a} → data.billed_total_cents == 32500, data.paid_to_date_cents == 19000, data.credited_amount_cents == 8250, data.outstanding_balance_cents == 5250; the identity 32500 == 19000 + 8250 + 5250 holds"
            - "AFTER APPLY — data.tier_id == '${gold}' and data.contract_value_cents == 30000"
            - "AFTER REVERSE — GET /season-passes/${pass_a} → data.billed_total_cents == 13500, data.paid_to_date_cents == 8250, data.credited_amount_cents == 0, data.outstanding_balance_cents == 5250; the identity is restored exactly, no drift"
            - "AFTER REVERSE — data.tier_id == '${bronze}' and data.contract_value_cents == 12000"
            - "GET /upgrade-orders/${uo} → data.status == 'REVERSED' and data.reverse_reason == 'Holder disputed the tier change'"
            - "GET /installments?payment_plan_id=${plan_a} → data.total_count == 4 with statuses SETTLED, SETTLED, SCHEDULED, SCHEDULED — the plan is untouched by both legs"
            - "a second POST /upgrade-orders/${uo}/reverse returns HTTP 409 with error_id == 'ERR_UPGRADE_ORDER_NOT_ACTIONABLE' (REVERSED is terminal, so the compensation cannot double-apply)"

