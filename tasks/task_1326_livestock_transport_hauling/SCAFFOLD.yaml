  - { id: ERR_BRAND_INSPECTION_STALE, http: 422, condition: "Brand inspection older than 96h before planned departure (verify) or before now (depart)" }
  - { id: ERR_PAPERWORK_INCOMPLETE, http: 422, condition: "verify-paperwork lacks >=1 VERIFIED health paper and >=1 VERIFIED brand inspection" }
  - { id: ERR_NO_DELIVERY_TICKET, http: 422, condition: "deliver requires at least one DELIVERY WeightTicket" }
  - { id: ERR_COMPARTMENT_HEAD_EXCEEDED, http: 422, condition: "Compartment head capacity exceeded" }
  - { id: ERR_COMPARTMENT_WEIGHT_EXCEEDED, http: 422, condition: "Compartment weight capacity exceeded" }
  - { id: ERR_MIXED_TRAILER_ALLOCATIONS, http: 422, condition: "ACTIVE allocations span more than one trailer" }
  - { id: ERR_ALLOCATION_TOTAL_MISMATCH, http: 422, condition: "Allocated head/weight do not equal declared totals (or no allocations)" }
  - { id: ERR_GVWR_EXCEEDED, http: 422, condition: "allocated_weight_lb exceeds trailer.max_gross_weight_lb" }
  - { id: ERR_DUPLICATE_LICENSE_NO, http: 409, condition: "license_no already registered" }
  - { id: ERR_INVALID_BACKHAUL_LINK, http: 422, condition: "Backhaul target not DELIVERED, destination != origin, or outside 72h window" }
  - { id: ERR_EVENT_IN_FUTURE, http: 422, condition: "occurred_at/washed_at/weighed_at is after the current logical clock" }
  - { id: ERR_DUTY_INTERVAL_OVERLAP, http: 409, condition: "Duty event occurred_at precedes the previous event's occurred_at (interval inversion); equal timestamps allowed" }
