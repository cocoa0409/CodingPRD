# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth probe across claim-extraction-guide sections. §1.8 is the depth probe.
# Plan constants (default): annual_maximum_cents=100000, deductible_cents=5000,
#   preventive=100, basic=80, major=50, major_waiting=0, frequency=0
#   (unless an instance pins waiting/frequency for its own check).
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_patient_returns_201_with_defaults
        claim_type: Creation
        grounds: [entities.Patient.fields.status, entities.Patient.fields.balance_owed_cents]
        distinguishing_aspect: "POST /patients with full_name+date_of_birth returns 201, status=ACTIVE, balance_owed_cents=0, system id/created_at present."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /patients"
              payload: { full_name: "New Pat", date_of_birth: "1992-01-01" }
              as: FrontDesk
              captures: { p_id: $.data.id, st: $.data.status, bal: $.data.balance_owed_cents }
          assert:
            - "response code == 201"
            - "Patient.${p_id}.status == ACTIVE"
            - "Patient.${p_id}.balance_owed_cents == 0"
            - "data.id is a non-empty UUID and data.created_at present"

      - name: get_patient_not_found_returns_404
        claim_type: Not Found
        grounds:
          - "errors[ERR_PATIENT_NOT_FOUND]"
        distinguishing_aspect: "GET /patients/{random-uuid} returns ERR_PATIENT_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /patients/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "response code == 404"
            - "data.error_id == ERR_PATIENT_NOT_FOUND"

      - name: create_patient_missing_required_field_returns_422
        claim_type: Required Fields
        grounds:
          - "errors[ERR_VALIDATION]"
          - "entities.Patient.fields.full_name"
        distinguishing_aspect: "POST /patients without date_of_birth returns ERR_VALIDATION (422)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /patients"
              payload: { full_name: "No DOB" }
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "response code == 422"
            - "data.error_id == ERR_VALIDATION"

      - name: create_operatory_default_turnover_buffer_applied
        claim_type: Defaults
        grounds: [entities.Operatory.fields.turnover_buffer_minutes]
        distinguishing_aspect: "POST /operatories omitting turnover_buffer_minutes applies default 15."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /operatories"
              payload: { room_name: "OP-D1" }
              as: FrontDesk
              captures: { op_id: $.data.id, buf: $.data.turnover_buffer_minutes }
          assert:
            - "Operatory.${op_id}.turnover_buffer_minutes == 15 (default applied)"

      - name: tooth_chart_surface_requires_surface_field
        claim_type: Type Constraints
        grounds:
          - "entities.ToothChartEntry.fields.surface"
          - "errors[ERR_VALIDATION]"
        distinguishing_aspect: "POST tooth-chart with chart_type=SURFACE but no surface field returns ERR_VALIDATION (422)."
        test_recipe:
          setup: ["A patient and a provider exist."]
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "Chart Pat", date_of_birth: "1990-01-01" }
              as: FrontDesk
              captures: { p_id: $.data.id }
            - call: "POST /providers"
              payload: { full_name: "Chart Dr", provider_type: "DENTIST", npi: "2000000001" }
              as: FrontDesk
              captures: { prov_id: $.data.id }
          trigger:
            - call: "POST /patients/${p_id}/tooth-chart"
              payload: { provider_id: "${prov_id}", tooth_number: 14, chart_type: "SURFACE", finding: "caries" }
              as: Clinician
              captures: { err: $.data.error_id }
          assert:
            - "response code == 422"
            - "data.error_id == ERR_VALIDATION (surface required for SURFACE charting)"

      - name: tooth_chart_perio_pocket_depth_recorded
        claim_type: Creation
        grounds: [entities.ToothChartEntry.fields.pocket_depth_mm, entities.ToothChartEntry.fields.chart_type]
        distinguishing_aspect: "POST tooth-chart PERIO with pocket_depth_mm=5 records the perio reading (201)."
        test_recipe:
          setup: ["A patient and provider exist."]
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "Perio Pat", date_of_birth: "1990-01-01" }
              as: FrontDesk
              captures: { p_id: $.data.id }
            - call: "POST /providers"
              payload: { full_name: "Perio Dr", provider_type: "HYGIENIST", npi: "2000000002" }
              as: FrontDesk
              captures: { prov_id: $.data.id }
          trigger:
            - call: "POST /patients/${p_id}/tooth-chart"
              payload: { provider_id: "${prov_id}", tooth_number: 30, chart_type: "PERIO", pocket_depth_mm: 5, finding: "4-5-4" }
              as: Clinician
              captures: { tce_id: $.data.id, pd: $.data.pocket_depth_mm }
          assert:
            - "response code == 201"
            - "ToothChartEntry.${tce_id}.pocket_depth_mm == 5"

      - name: claim_attachment_immutable_no_version_field
        claim_type: Immutability
        grounds: [entities.ClaimAttachment.fields.document_ref]
        distinguishing_aspect: "ClaimAttachment is common_fields:false — carries id+created_at only, no version/updated_at and no update endpoint."
        test_recipe:
          setup: ["A claim exists (item completed) with one attachment."]
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "Att Pat", date_of_birth: "1990-01-01" }
              as: FrontDesk
              captures: { p_id: $.data.id }
            - call: "POST /providers"
              payload: { full_name: "Att Dr", provider_type: "DENTIST", npi: "2000000003" }
              as: FrontDesk
              captures: { prov_id: $.data.id }
            - call: "POST /operatories"
              payload: { room_name: "OP-D2" }
              as: FrontDesk
              captures: { op_id: $.data.id }
            - call: "POST /insurance-plans"
              payload: { carrier_name: "DeltaDent", annual_maximum_cents: 100000, deductible_cents: 5000, preventive_coinsurance_pct: 100, basic_coinsurance_pct: 80, major_coinsurance_pct: 50, major_waiting_period_months: 0, frequency_limit_months: 0 }
              as: BillingSpecialist
              captures: { plan_id: $.data.id }
            - call: "POST /patient-coverages"
              payload: { patient_id: "${p_id}", insurance_plan_id: "${plan_id}", coverage_start_date: "2025-01-01", benefit_year_start_date: "2026-01-01" }
              as: BillingSpecialist
              captures: { cov_id: $.data.id }
            - call: "POST /treatment-plans"
              payload: { patient_id: "${p_id}", provider_id: "${prov_id}" }
              as: Clinician
              captures: { tp_id: $.data.id }
            - call: "POST /treatment-plans/${tp_id}/items"
              payload: { cdt_code: "D2150", category: "BASIC", fee_cents: 40000, phase_number: 1, tooth_number: 5 }
              as: Clinician
              captures: { item_id: $.data.id }
            - call: "POST /treatment-plans/${tp_id}/propose"
              payload: {}
              as: Clinician
            - call: "POST /treatment-plans/${tp_id}/accept"
              payload: {}
              as: FrontDesk
            - call: "POST /appointments"
              payload: { patient_id: "${p_id}", provider_id: "${prov_id}", operatory_id: "${op_id}", appointment_type: "OPERATIVE", start_at: "2026-02-01T09:00:00Z", end_at: "2026-02-01T10:00:00Z", treatment_plan_item_id: "${item_id}" }
              as: FrontDesk
              captures: { appt_id: $.data.id }
            - call: "POST /appointments/${appt_id}/check-in"
              payload: {}
              as: FrontDesk
            - call: "POST /appointments/${appt_id}/complete"
              payload: {}
              as: Clinician
            - call: "POST /claims"
              payload: { patient_id: "${p_id}", treatment_plan_item_id: "${item_id}", patient_coverage_id: "${cov_id}" }
              as: BillingSpecialist
              captures: { claim_id: $.data.id }
          trigger:
            - call: "POST /claims/${claim_id}/attachments"
              payload: { attachment_type: "XRAY", document_ref: "ref://att1" }
              as: BillingSpecialist
              captures: { att_id: $.data.id, dref: $.data.document_ref }
          assert:
            - "response code == 201"
            - "ClaimAttachment.${att_id}.document_ref == ref://att1"
            - "ClaimAttachment response carries no version field (common_fields:false)"

      - name: list_patients_pagination_envelope
        claim_type: Listing
        grounds: [entities.Patient.fields.full_name]
        distinguishing_aspect: "GET /patients returns array envelope with total_count and has_more pagination fields."
        test_recipe:
          setup: ["At least one patient exists."]
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "List Pat", date_of_birth: "1990-01-01" }
              as: FrontDesk
              captures: { p_id: $.data.id }
          trigger:
            - call: "GET /patients"
              payload: {}
              as: FrontDesk
          assert:
            - "response_type == array"
            - "meta + pagination fields total_count and has_more present"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: propose_empty_plan_returns_plan_has_no_items
        claim_type: Precondition Enforcement
        grounds:
          - "state_machines.TreatmentPlan.DRAFT_to_PROPOSED"
          - "errors[ERR_PLAN_HAS_NO_ITEMS]"
        distinguishing_aspect: "Propose on a DRAFT plan with zero items returns ERR_PLAN_HAS_NO_ITEMS (409); plan stays DRAFT."
        test_recipe:
          setup: ["A DRAFT plan with no items."]
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "Empty Pat", date_of_birth: "1990-01-01" }
              as: FrontDesk
              captures: { p_id: $.data.id }
            - call: "POST /providers"
              payload: { full_name: "Empty Dr", provider_type: "DENTIST", npi: "2000000004" }
              as: FrontDesk
              captures: { prov_id: $.data.id }
            - call: "POST /treatment-plans"
              payload: { patient_id: "${p_id}", provider_id: "${prov_id}" }
              as: Clinician
              captures: { tp_id: $.data.id }
          trigger:
            - call: "POST /treatment-plans/${tp_id}/propose"
              payload: {}
              as: Clinician
              captures: { err: $.data.error_id }
          assert:
            - "response code == 409"
            - "data.error_id == ERR_PLAN_HAS_NO_ITEMS"
            - "TreatmentPlan.${tp_id}.status == DRAFT (unchanged)"

      - name: accept_from_draft_invalid_state
        claim_type: invalid_transition
        grounds:
          - "state_machines.TreatmentPlan.PROPOSED_to_ACCEPTED"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Accept attempted on a DRAFT (not PROPOSED) plan returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A DRAFT plan with one item (never proposed)."]
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "Acc Pat", date_of_birth: "1990-01-01" }
              as: FrontDesk
              captures: { p_id: $.data.id }
            - call: "POST /providers"
              payload: { full_name: "Acc Dr", provider_type: "DENTIST", npi: "2000000005" }
              as: FrontDesk
              captures: { prov_id: $.data.id }
            - call: "POST /treatment-plans"
              payload: { patient_id: "${p_id}", provider_id: "${prov_id}" }
              as: Clinician
              captures: { tp_id: $.data.id }
            - call: "POST /treatment-plans/${tp_id}/items"
              payload: { cdt_code: "D1110", category: "PREVENTIVE", fee_cents: 12000, phase_number: 1 }
              as: Clinician
              captures: { item_id: $.data.id }
          trigger:
            - call: "POST /treatment-plans/${tp_id}/accept"
              payload: {}
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "response code == 409"
            - "data.error_id == ERR_INVALID_STATE"

      - name: complete_plan_with_incomplete_items_rejected
        claim_type: Precondition Enforcement
        grounds:
          - "state_machines.TreatmentPlan.ACCEPTED_to_COMPLETED"
          - "errors[ERR_PLAN_ITEMS_NOT_COMPLETE]"
        distinguishing_aspect: "Complete on an ACCEPTED plan whose item is still PLANNED returns ERR_PLAN_ITEMS_NOT_COMPLETE (409)."
        test_recipe:
          setup: ["An ACCEPTED plan with a PLANNED item."]
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "Comp Pat", date_of_birth: "1990-01-01" }
              as: FrontDesk
              captures: { p_id: $.data.id }
            - call: "POST /providers"
              payload: { full_name: "Comp Dr", provider_type: "DENTIST", npi: "2000000006" }
              as: FrontDesk
              captures: { prov_id: $.data.id }
            - call: "POST /treatment-plans"
              payload: { patient_id: "${p_id}", provider_id: "${prov_id}" }
              as: Clinician
              captures: { tp_id: $.data.id }
            - call: "POST /treatment-plans/${tp_id}/items"
              payload: { cdt_code: "D1110", category: "PREVENTIVE", fee_cents: 12000, phase_number: 1 }
              as: Clinician
              captures: { item_id: $.data.id }
            - call: "POST /treatment-plans/${tp_id}/propose"
              payload: {}
              as: Clinician
            - call: "POST /treatment-plans/${tp_id}/accept"
              payload: {}
              as: FrontDesk
          trigger:
            - call: "POST /treatment-plans/${tp_id}/complete"
              payload: {}
              as: Clinician
              captures: { err: $.data.error_id }
          assert:
            - "response code == 409"
            - "data.error_id == ERR_PLAN_ITEMS_NOT_COMPLETE"

      - name: appointment_cancel_releases_item_to_planned
        claim_type: Side Effect Execution
        grounds: [state_machines.Appointment.SCHEDULED_to_CANCELLED, entities.TreatmentPlanItem.fields.appointment_id]
        distinguishing_aspect: "Cancelling a SCHEDULED appointment linked to a SCHEDULED item reverts the item to PLANNED and clears appointment_id."
        test_recipe:
          setup: ["ACCEPTED plan, item SCHEDULED via an appointment."]
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "Rel Pat", date_of_birth: "1990-01-01" }
              as: FrontDesk
              captures: { p_id: $.data.id }
            - call: "POST /providers"
              payload: { full_name: "Rel Dr", provider_type: "DENTIST", npi: "2000000007" }
              as: FrontDesk
              captures: { prov_id: $.data.id }
            - call: "POST /operatories"
              payload: { room_name: "OP-D3" }
              as: FrontDesk
              captures: { op_id: $.data.id }
            - call: "POST /treatment-plans"
              payload: { patient_id: "${p_id}", provider_id: "${prov_id}" }
              as: Clinician
              captures: { tp_id: $.data.id }
            - call: "POST /treatment-plans/${tp_id}/items"
              payload: { cdt_code: "D1110", category: "PREVENTIVE", fee_cents: 12000, phase_number: 1 }
              as: Clinician
              captures: { item_id: $.data.id }
            - call: "POST /treatment-plans/${tp_id}/propose"
              payload: {}
              as: Clinician
            - call: "POST /treatment-plans/${tp_id}/accept"
              payload: {}
              as: FrontDesk
            - call: "POST /appointments"
              payload: { patient_id: "${p_id}", provider_id: "${prov_id}", operatory_id: "${op_id}", appointment_type: "PREVENTIVE", start_at: "2026-03-10T09:00:00Z", end_at: "2026-03-10T09:45:00Z", treatment_plan_item_id: "${item_id}" }
              as: FrontDesk
              captures: { appt_id: $.data.id }
          trigger:
            - call: "POST /appointments/${appt_id}/cancel"
              payload: {}
              as: FrontDesk
              captures: { ast: $.data.status }
          assert:
            - "Appointment.${appt_id}.status == CANCELLED"
            - "TreatmentPlanItem.${item_id}.status == PLANNED (released)"
            - "TreatmentPlanItem.${item_id}.appointment_id is null"

      - name: appointment_complete_bubbles_item_to_completed
        claim_type: Side Effect Execution
        grounds: [state_machines.Appointment.CHECKED_IN_to_COMPLETED, state_machines.TreatmentPlanItem.SCHEDULED_to_COMPLETED]
        distinguishing_aspect: "Completing a CHECKED_IN appointment bubbles its linked SCHEDULED item to COMPLETED."
        test_recipe:
          setup: ["ACCEPTED plan, item SCHEDULED, appointment CHECKED_IN."]
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "Bub Pat", date_of_birth: "1990-01-01" }
              as: FrontDesk
              captures: { p_id: $.data.id }
            - call: "POST /providers"
              payload: { full_name: "Bub Dr", provider_type: "DENTIST", npi: "2000000008" }
              as: FrontDesk
              captures: { prov_id: $.data.id }
            - call: "POST /operatories"
              payload: { room_name: "OP-D4" }
              as: FrontDesk
              captures: { op_id: $.data.id }
            - call: "POST /treatment-plans"
              payload: { patient_id: "${p_id}", provider_id: "${prov_id}" }
              as: Clinician
              captures: { tp_id: $.data.id }
            - call: "POST /treatment-plans/${tp_id}/items"
              payload: { cdt_code: "D1110", category: "PREVENTIVE", fee_cents: 12000, phase_number: 1 }
              as: Clinician
              captures: { item_id: $.data.id }
            - call: "POST /treatment-plans/${tp_id}/propose"
              payload: {}
              as: Clinician
            - call: "POST /treatment-plans/${tp_id}/accept"
              payload: {}
              as: FrontDesk
            - call: "POST /appointments"
              payload: { patient_id: "${p_id}", provider_id: "${prov_id}", operatory_id: "${op_id}", appointment_type: "PREVENTIVE", start_at: "2026-03-11T09:00:00Z", end_at: "2026-03-11T09:45:00Z", treatment_plan_item_id: "${item_id}" }
              as: FrontDesk
              captures: { appt_id: $.data.id }
            - call: "POST /appointments/${appt_id}/check-in"
              payload: {}
              as: FrontDesk
          trigger:
            - call: "POST /appointments/${appt_id}/complete"
              payload: {}
              as: Clinician
              captures: { ast: $.data.status }
          assert:
            - "Appointment.${appt_id}.status == COMPLETED"
            - "TreatmentPlanItem.${item_id}.status == COMPLETED (bubbled up)"

      - name: terminal_appointment_cannot_check_in
        claim_type: Terminal State Lockdown
        grounds:
          - "state_machines.Appointment.SCHEDULED_to_NO_SHOW"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Check-in on a NO_SHOW (terminal) appointment returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A free-standing appointment marked NO_SHOW."]
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "NS Pat", date_of_birth: "1990-01-01" }
              as: FrontDesk
              captures: { p_id: $.data.id }
            - call: "POST /providers"
              payload: { full_name: "NS Dr", provider_type: "DENTIST", npi: "2000000009" }
              as: FrontDesk
              captures: { prov_id: $.data.id }
            - call: "POST /operatories"
              payload: { room_name: "OP-D5" }
              as: FrontDesk
              captures: { op_id: $.data.id }
            - call: "POST /appointments"
              payload: { patient_id: "${p_id}", provider_id: "${prov_id}", operatory_id: "${op_id}", appointment_type: "OPERATIVE", start_at: "2026-03-12T09:00:00Z", end_at: "2026-03-12T10:00:00Z" }
              as: FrontDesk
              captures: { appt_id: $.data.id }
            - call: "POST /appointments/${appt_id}/no-show"
              payload: {}
              as: FrontDesk
          trigger:
            - call: "POST /appointments/${appt_id}/check-in"
              payload: {}
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "response code == 409"
            - "data.error_id == ERR_INVALID_STATE"

      - name: predetermination_deny_is_terminal
        claim_type: invalid_transition
        grounds:
          - "state_machines.Predetermination.PENDING_to_DENIED"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Approve attempted on a DENIED (terminal) predetermination returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A predetermination DENIED."]
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "Den Pat", date_of_birth: "1990-01-01" }
              as: FrontDesk
              captures: { p_id: $.data.id }
            - call: "POST /providers"
              payload: { full_name: "Den Dr", provider_type: "DENTIST", npi: "2000000010" }
              as: FrontDesk
              captures: { prov_id: $.data.id }
            - call: "POST /insurance-plans"
              payload: { carrier_name: "DeltaDent", annual_maximum_cents: 100000, deductible_cents: 5000, preventive_coinsurance_pct: 100, basic_coinsurance_pct: 80, major_coinsurance_pct: 50, major_waiting_period_months: 0, frequency_limit_months: 0 }
              as: BillingSpecialist
              captures: { plan_id: $.data.id }
            - call: "POST /patient-coverages"
              payload: { patient_id: "${p_id}", insurance_plan_id: "${plan_id}", coverage_start_date: "2025-01-01", benefit_year_start_date: "2026-01-01" }
              as: BillingSpecialist
              captures: { cov_id: $.data.id }
            - call: "POST /treatment-plans"
              payload: { patient_id: "${p_id}", provider_id: "${prov_id}" }
              as: Clinician
              captures: { tp_id: $.data.id }
            - call: "POST /treatment-plans/${tp_id}/items"
              payload: { cdt_code: "D2740", category: "MAJOR", fee_cents: 90000, phase_number: 1, tooth_number: 8 }
              as: Clinician
              captures: { item_id: $.data.id }
            - call: "POST /predeterminations"
              payload: { treatment_plan_item_id: "${item_id}", patient_coverage_id: "${cov_id}" }
              as: BillingSpecialist
              captures: { pred_id: $.data.id }
            - call: "POST /predeterminations/${pred_id}/deny"
              payload: {}
              as: BillingSpecialist
          trigger:
            - call: "POST /predeterminations/${pred_id}/approve"
              payload: { approved_benefit_cents: 42500, valid_until_date: "2027-01-01" }
              as: BillingSpecialist
              captures: { err: $.data.error_id }
          assert:
            - "response code == 409"
            - "data.error_id == ERR_INVALID_STATE"

      - name: claim_submit_without_attachment_rejected
        claim_type: Precondition Enforcement
        grounds:
          - "state_machines.Claim.submission=DRAFT_to_submission=SUBMITTED"
          - "errors[ERR_CLAIM_MISSING_ATTACHMENT]"
        distinguishing_aspect: "Submit on a DRAFT claim with zero attachments returns ERR_CLAIM_MISSING_ATTACHMENT (409)."
        test_recipe:
          setup: ["A claim for a completed item with NO attachments."]
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "Sub Pat", date_of_birth: "1990-01-01" }
              as: FrontDesk
              captures: { p_id: $.data.id }
            - call: "POST /providers"
              payload: { full_name: "Sub Dr", provider_type: "DENTIST", npi: "2000000011" }
              as: FrontDesk
              captures: { prov_id: $.data.id }
            - call: "POST /operatories"
              payload: { room_name: "OP-D6" }
              as: FrontDesk
