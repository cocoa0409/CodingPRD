              as: DesignEngineer
              captures: { panel_e: "$.data.id" }
            - call: "POST /panel-shop/panels/${panel_e}/components"
              payload: { component_id: "${comp_orig}", quantity: 1 }
              as: DesignEngineer
              captures: { line_e: "$.data.id" }
            - call: "POST /panel-shop/panels/${panel_e}/submit-review"
              payload: {}
              as: DesignEngineer
            - call: "POST /panel-shop/panels/${panel_e}/approve-design"
              payload: {}
              as: QAManager
              as_user_id: "qa-901"
            - call: "POST /panel-shop/panels/${panel_e}/release-procurement"
              payload: {}
              as: ProjectManager
            - call: "POST /panel-shop/panels/${panel_e}/substitution-requests"
              payload: { original_line_id: "${line_e}", proposed_component_id: "${comp_prop}", reason: "vendor stockout" }
              as: DesignEngineer
              as_user_id: "de-002"
              captures: { sub_e: "$.data.id" }
            - call: "POST /panel-shop/jobs"
              payload: { customer_id: "${cust2_id}", job_number: "J-2002", quoted_price_cents: 500000, warranty_months: 12 }
              as: ProjectManager
              captures: { job_l: "$.data.id" }
            - call: "POST /panel-shop/jobs/${job_l}/panels"
