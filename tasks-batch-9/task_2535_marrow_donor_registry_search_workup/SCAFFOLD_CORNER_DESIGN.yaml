            - "POST /registry/donors/{id}/follow-ups is accepted from BOTH DonorRegistryLiaison (DAY_7_CONTACT, severity_grade 0) and MedicalDirector (ADVERSE_EVENT, severity_grade 2, triggered_permanent_deferral false because 2 < ADVERSE_EVENT_DEFERRAL_GRADE 4); the follow-up list returns them in created_at ASC as [\"DAY_7_CONTACT\", \"ADVERSE_EVENT\"]"
            - "no shared-operation call returns 403 - the endpoint's roles list, not a single owning role, decides admission"

      - name: peer_scoped_roles_cannot_touch_another_peers_resources
        claim_type: peer_roles
        grounds:
          - roles[DonorRegistryLiaison].identity
          - roles[CollectionCenterOps].identity
          - roles[TransplantCoordinator].note
          - validations[priority=7]
          - validations[priority=8]
          - validations[priority=9]
          - errors[ERR_PATIENT_NOT_OWNED]
          - errors[ERR_REGISTRY_SCOPE_VIOLATION]
          - errors[ERR_CENTER_SCOPE_VIOLATION]
        distinguishing_aspect: |
          Three peer isolations are checked at once against a completed happy chain: a second coordinator
          "tc-2" against another coordinator's patient, the international registry's liaison against a
          domestic donor's typing request and screening, and a second collection center against the first
          center's booking. Every probe deliberately targets a resource that is ALSO in the wrong state for
          the call (the typing request is already answered, the screening already recorded, the booking
          already CONFIRMED) - so the scope error can only surface if priorities 7, 8 and 9 run before the
          state rules at priority 11 and above. A peer that got a 409 instead would be learning the state
          of a resource it may not touch. The mirror-image claim is that reads are NOT scope-gated: the
          second center can GET the first center's booking, because priority 9's applies_to lists only the
          five booking and shipment writes.
        test_recipe:
          setup:
            - "two registries (domestic NMDP-US, international DKMS-DE) and two collection centers exist, giving two entity_backed identities per role"
            - "the canonical domestic chain runs to completion under coordinator tc-1, liaison ${reg_dom_id} and center ${center_a}: candidate screened PASS, workup opened, all three clearances PASS, method PBSC, conditioning SCHEDULEd for 2026-08-05, booking on 2026-08-11T08:00:00Z CONFIRMED"
          setup_api_calls:
            - call: "POST /registry/registries"
              payload: { code: "NMDP-US", name: "National Marrow Donor Program", country_code: "US", currency_code: "USD", fx_rate_to_usd: 1.0000, is_domestic: true, cooperation_tier: 1, ct_response_deadline_hours: 168 }
              as: RegistryOperations
              as_user_id: "ops-1"
              captures: { reg_dom_id: "$.data.id" }
            - call: "POST /registry/registries"
              payload: { code: "DKMS-DE", name: "DKMS Germany", country_code: "DE", currency_code: "EUR", fx_rate_to_usd: 1.0850, is_domestic: false, cooperation_tier: 2, ct_response_deadline_hours: 120 }
              as: RegistryOperations
              as_user_id: "ops-1"
              captures: { reg_intl_id: "$.data.id" }
            - call: "POST /registry/collection-centers"
              payload: { name: "Midwest Apheresis Center", country_code: "US", concurrent_collection_capacity: 2 }
              as: RegistryOperations
              as_user_id: "ops-1"
              captures: { center_a: "$.data.id" }
            - call: "POST /registry/collection-centers"
              payload: { name: "Northeast Marrow Harvest Center", country_code: "US", concurrent_collection_capacity: 2 }
              as: RegistryOperations
              as_user_id: "ops-1"
