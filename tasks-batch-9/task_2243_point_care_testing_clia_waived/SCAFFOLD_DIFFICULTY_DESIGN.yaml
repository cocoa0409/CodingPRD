scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: readiness_basis_variant_divergence_on_submitted_correction
        grounds:
          - calculations.site_inspection_readiness_score
          - entities.TestSite.fields.inspection_readiness_score
          - entities.DeficiencyFinding.fields.correction_due_date
          - endpoints[GET /poct/sites/{id}/readiness]
        distinguishing_aspect: |
          One stored DeficiencyFinding in status CORRECTION_SUBMITTED with
          correction_due_date 2026-09-30 (>= the clock date 2026-08-01) is
          counted by the AS_OF_ACTUAL variant (score 92.50) and excluded by the
          PRE_SURVEY_PROJECTED variant (score 100.00) - identical stored data,
          two different numbers from the same formula.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One WAIVED TestSite covered by an ACTIVE certificate of waiver for 2026-01-01..2027-12-31."
            - "No Operator, no Device, no ProficiencyEnrollment at the site, so competency_penalty, qc_penalty and pt_penalty are all 0.00."
            - "One inspection with a single STANDARD_LEVEL finding (weight 3.00, repeat_multiplier 1.0) issued, then a plan of correction submitted, so the finding sits in CORRECTION_SUBMITTED with correction_due_date 2026-09-30."
          setup_api_calls:
            - call: "POST /poct/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /poct/certificates"
              payload: { certificate_number: "45D2243001", certificate_type: "CERTIFICATE_OF_WAIVER", permitted_complexity: "WAIVED", effective_date: "2026-01-01", expiration_date: "2027-12-31" }
              as: ProgramAdmin
              captures: { cert_id: $.data.id }
            - call: "POST /poct/sites"
              payload: { name: "Cardiology POCT", department_code: "DEPT-100", complexity_scope: "WAIVED" }
              as: ProgramAdmin
              captures: { site_id: $.data.id }
            - call: "POST /poct/certificate-coverages"
              payload: { site_id: "${site_id}", certificate_id: "${cert_id}", coverage_start: "2026-01-01", coverage_end: "2027-12-31" }
              as: ProgramAdmin
            - call: "POST /poct/inspections"
              payload: { site_id: "${site_id}", inspection_type: "INTERNAL_READINESS", scheduled_date: "2026-08-01" }
              as: Surveyor
              as_user_id: "surveyor-alpha"
              captures: { insp_id: $.data.id }
            - call: "POST /poct/deficiencies"
              payload: { inspection_id: "${insp_id}", category: "QUALITY_CONTROL", severity: "STANDARD_LEVEL", description: "QC log gaps on the glucose meter", correction_due_date: "2026-09-30" }
              as: Surveyor
              as_user_id: "surveyor-alpha"
              captures: { def_id: $.data.id }
            - call: "POST /poct/inspections/${insp_id}/issue"
              payload: { issued_on: "2026-08-01" }
              as: Surveyor
              as_user_id: "surveyor-alpha"
            - call: "POST /poct/deficiencies/${def_id}/correction"
              payload: { correction_narrative: "Retraining completed and QC log template deployed", evidence_ref: "EV-QC-001" }
              as: QualityCoordinator
          trigger:
            - call: "GET /poct/sites/${site_id}/readiness?basis=AS_OF_ACTUAL"
              as: Surveyor
              as_user_id: "surveyor-beta"
              captures: { actual_score: $.data.score, actual_def_penalty: $.data.deficiency_penalty, actual_weight: $.data.open_deficiency_weight }
            - call: "GET /poct/sites/${site_id}/readiness?basis=PRE_SURVEY_PROJECTED"
              as: Surveyor
              as_user_id: "surveyor-beta"
              captures: { projected_score: $.data.score, projected_def_penalty: $.data.deficiency_penalty }
          assert:
            - "${actual_score} == 92.50"
            - "${actual_def_penalty} == 7.50"
            - "${actual_weight} == 3.00"
            - "${projected_score} == 100.00"
            - "${projected_def_penalty} == 0.00"
            - "${actual_score} != ${projected_score}; the delta is exactly 7.50"
            - "DeficiencyFinding.${def_id}.status == CORRECTION_SUBMITTED and DeficiencyFinding.${def_id}.weight == 3.00 under both reads"
            - "TestSite.${site_id}.inspection_readiness_score == 92.50 after the PRE_SURVEY_PROJECTED read (only the AS_OF_ACTUAL value is persisted)"
            - "TestSite.${site_id}.oversight_posture == OPEN"

      - name: device_qc_rate_calendar_basis_vs_day_of_use_basis_divergence
        grounds:
          - calculations.device_qc_compliance_rate
          - entities.Device.fields.qc_compliance_rate_calendar
          - entities.Device.fields.qc_compliance_rate_day_of_use
          - entities.Device.fields.use_day_count
        distinguishing_aspect: |
          One device with a single two-level QC-covered day (2026-08-01) and
          patient testing on 2026-08-01 and 2026-08-03 yields 33.33 under
          CALENDAR_DAY_BASIS (3 calendar days in the window) and 50.00 under
          DAY_OF_USE_BASIS (2 days of use) - the denominators differ, the
          numerator does not.
        test_recipe:
          setup:
            - "Logical clock starts at 2026-08-01T00:00:00Z and is advanced to 2026-08-03T09:00:00Z after the first patient result."
            - "One WAIVED site with ACTIVE waiver coverage; one trained operator (PROVISIONAL x ACTIVE)."
            - "One INTERFACED glucose device created 2026-08-01 with qc_frequency_days 30, so qc_next_due_at is 2026-08-31 and no QC-overdue gate fires."
            - "One reagent lot VERIFIED by a LEVEL_1 PASS (100.0 in 80.0..120.0) and a LEVEL_2 PASS (300.0 in 250.0..350.0), both performed 2026-08-01."
            - "Patient results captured on 2026-08-01 and on 2026-08-03; no QC run on 2026-08-02 or 2026-08-03."
          setup_api_calls:
            - call: "POST /poct/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /poct/certificates"
              payload: { certificate_number: "45D2243002", certificate_type: "CERTIFICATE_OF_WAIVER", permitted_complexity: "WAIVED", effective_date: "2026-01-01", expiration_date: "2027-12-31" }
              as: ProgramAdmin
              captures: { cert_id: $.data.id }
            - call: "POST /poct/sites"
              payload: { name: "Endocrine POCT", department_code: "DEPT-110", complexity_scope: "WAIVED" }
              as: ProgramAdmin
              captures: { site_id: $.data.id }
            - call: "POST /poct/certificate-coverages"
              payload: { site_id: "${site_id}", certificate_id: "${cert_id}", coverage_start: "2026-01-01", coverage_end: "2027-12-31" }
              as: ProgramAdmin
            - call: "POST /poct/operators"
              payload: { site_id: "${site_id}", full_name: "Dana Reed", role_title: "MEDICAL_TECHNOLOGIST", hire_date: "2026-02-01" }
              as: ProgramAdmin
              captures: { op1_id: $.data.id }
            - call: "POST /poct/operators/${op1_id}/training"
              payload: { training_module_code: "POCT-101", completed_on: "2026-08-01" }
              as: ProgramAdmin
            - call: "POST /poct/devices"
              payload: { site_id: "${site_id}", device_model: "GlucoMeter-X", serial_number: "SN-0001", analyte: "GLUCOSE", complexity_class: "WAIVED", connectivity_mode: "INTERFACED", qc_frequency_days: 30 }
              as: ProgramAdmin
              captures: { dev1_id: $.data.id }
            - call: "POST /poct/storage-units"
              payload: { site_id: "${site_id}", name: "Fridge A", min_temp_c: 2.0, max_temp_c: 8.0 }
              as: ProgramAdmin
              captures: { su1_id: $.data.id }
            - call: "POST /poct/reagent-lots"
              payload: { site_id: "${site_id}", storage_unit_id: "${su1_id}", device_model: "GlucoMeter-X", lot_number: "LOT-A1", expiration_date: "2027-06-30", received_at: "2026-08-01T00:00:00Z", control_min_level_1: 80.0, control_max_level_1: 120.0, control_min_level_2: 250.0, control_max_level_2: 350.0 }
              as: QualityCoordinator
              captures: { lot1_id: $.data.id }
            - call: "POST /poct/qc-runs"
              payload: { device_id: "${dev1_id}", reagent_lot_id: "${lot1_id}", operator_id: "${op1_id}", control_level: "LEVEL_1", measured_value: 100.0 }
              as: Operator
              as_user_id: "${op1_id}"
              captures: { qc1_id: $.data.id }
            - call: "POST /poct/qc-runs"
              payload: { device_id: "${dev1_id}", reagent_lot_id: "${lot1_id}", operator_id: "${op1_id}", control_level: "LEVEL_2", measured_value: 300.0 }
              as: Operator
              as_user_id: "${op1_id}"
              captures: { qc2_id: $.data.id }
            - call: "POST /poct/reagent-lots/${lot1_id}/verify"
              payload: { level_1_qc_run_id: "${qc1_id}", level_2_qc_run_id: "${qc2_id}" }
              as: QualityCoordinator
            - call: "POST /poct/test-results"
              payload: { device_id: "${dev1_id}", operator_id: "${op1_id}", reagent_lot_id: "${lot1_id}", patient_mrn: "MRN-1001", analyte: "GLUCOSE", measured_value: 95.0, entry_mode: "INTERFACED" }
              as: Operator
              as_user_id: "${op1_id}"
              captures: { tr1_id: $.data.id }
            - call: "POST /poct/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /poct/test-results"
              payload: { device_id: "${dev1_id}", operator_id: "${op1_id}", reagent_lot_id: "${lot1_id}", patient_mrn: "MRN-1002", analyte: "GLUCOSE", measured_value: 101.0, entry_mode: "INTERFACED" }
              as: Operator
              as_user_id: "${op1_id}"
              captures: { tr2_id: $.data.id }
          trigger:
            - call: "GET /poct/devices/${dev1_id}"
              as: QualityCoordinator
              captures: { cal_rate: $.data.qc_compliance_rate_calendar, dou_rate: $.data.qc_compliance_rate_day_of_use, use_days: $.data.use_day_count, next_due: $.data.qc_next_due_at }
          assert:
            - "${cal_rate} == 33.33"
            - "${dou_rate} == 50.00"
            - "${cal_rate} != ${dou_rate}; the delta is exactly 16.67"
            - "${use_days} == 2"
            - "${next_due} == 2026-08-31"
            - "Device.${dev1_id}.last_two_level_qc_pass_on == 2026-08-01"
            - "TestSite.${site_id}.site_qc_compliance_index == 50.00 (round_half_up(50.00, 0) / 1 device)"
            - "TestResult.${tr1_id}.posting_status == PENDING_REVIEW and TestResult.${tr2_id}.posting_status == PENDING_REVIEW"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: readiness_four_penalty_terms_with_two_caps_binding_under_moderate_scope
        grounds:
          - calculations.site_inspection_readiness_score
          - calculations.site_qc_compliance_index
          - calculations.device_qc_compliance_rate
          - calculations.pt_event_outcome
          - calculations.deficiency_weight
        distinguishing_aspect: |
          All four readiness inputs are simultaneously non-zero (W=8.00,
          lapsed_or_locked 1 of 2 operators, index 50.00, P=4) on a
          complexity_scope == MODERATE site, so the pt_unit branch is 6 and
          both the qc cap (20.00) and the pt cap (18.00) bind: score 29.50, a
          value no single-input formula can produce.
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z, advanced to 2026-08-03T09:00:00Z before the second patient result."
            - "One MODERATE TestSite covered by an ACTIVE certificate of compliance permitting MODERATE for 2026-01-01..2027-12-31."
            - "Two operators: op_a trained (PROVISIONAL x ACTIVE) and op_b never trained (PENDING x LOCKED_OUT), so lapsed_or_locked_operator_count == 1 and total_operator_count == 2."
            - "One INTERFACED glucose device, QC-covered only on 2026-08-01, used on 2026-08-01 and 2026-08-03, so its day-of-use rate is 50.00 and the site index is 50.00."
            - "One issued CONDITION_LEVEL deficiency (weight 8.00) so open_deficiency_weight == 8.00."
            - "Two PT enrollments (GLUCOSE and HBA1C) each with two shipments graded FAIL at 60.00, so pt_unsuccessful_count == 4."
          setup_api_calls:
            - call: "POST /poct/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /poct/certificates"
              payload: { certificate_number: "45D2243003", certificate_type: "CERTIFICATE_OF_COMPLIANCE", permitted_complexity: "MODERATE", effective_date: "2026-01-01", expiration_date: "2027-12-31" }
              as: ProgramAdmin
              captures: { cert_id: $.data.id }
            - call: "POST /poct/sites"
              payload: { name: "Emergency POCT", department_code: "DEPT-120", complexity_scope: "MODERATE" }
              as: ProgramAdmin
              captures: { site_id: $.data.id }
            - call: "POST /poct/certificate-coverages"
              payload: { site_id: "${site_id}", certificate_id: "${cert_id}", coverage_start: "2026-01-01", coverage_end: "2027-12-31" }
              as: ProgramAdmin
            - call: "POST /poct/operators"
              payload: { site_id: "${site_id}", full_name: "Alma Ruiz", role_title: "MEDICAL_TECHNOLOGIST", hire_date: "2026-02-01" }
              as: ProgramAdmin
              captures: { op_a_id: $.data.id }
            - call: "POST /poct/operators/${op_a_id}/training"
              payload: { training_module_code: "POCT-101", completed_on: "2026-08-01" }
              as: ProgramAdmin
            - call: "POST /poct/operators"
              payload: { site_id: "${site_id}", full_name: "Ben Osei", role_title: "MEDICAL_ASSISTANT", hire_date: "2026-03-01" }
              as: ProgramAdmin
              captures: { op_b_id: $.data.id }
            - call: "POST /poct/devices"
              payload: { site_id: "${site_id}", device_model: "GlucoMeter-X", serial_number: "SN-0101", analyte: "GLUCOSE", complexity_class: "WAIVED", connectivity_mode: "INTERFACED", qc_frequency_days: 30 }
              as: ProgramAdmin
              captures: { dev1_id: $.data.id }
            - call: "POST /poct/storage-units"
              payload: { site_id: "${site_id}", name: "Fridge A", min_temp_c: 2.0, max_temp_c: 8.0 }
              as: ProgramAdmin
              captures: { su1_id: $.data.id }
            - call: "POST /poct/reagent-lots"
              payload: { site_id: "${site_id}", storage_unit_id: "${su1_id}", device_model: "GlucoMeter-X", lot_number: "LOT-B1", expiration_date: "2027-06-30", received_at: "2026-08-01T00:00:00Z", control_min_level_1: 80.0, control_max_level_1: 120.0, control_min_level_2: 250.0, control_max_level_2: 350.0 }
              as: QualityCoordinator
              captures: { lot1_id: $.data.id }
            - call: "POST /poct/qc-runs"
              payload: { device_id: "${dev1_id}", reagent_lot_id: "${lot1_id}", operator_id: "${op_a_id}", control_level: "LEVEL_1", measured_value: 100.0 }
              as: Operator
              as_user_id: "${op_a_id}"
              captures: { qc1_id: $.data.id }
            - call: "POST /poct/qc-runs"
              payload: { device_id: "${dev1_id}", reagent_lot_id: "${lot1_id}", operator_id: "${op_a_id}", control_level: "LEVEL_2", measured_value: 300.0 }
              as: Operator
              as_user_id: "${op_a_id}"
              captures: { qc2_id: $.data.id }
            - call: "POST /poct/reagent-lots/${lot1_id}/verify"
              payload: { level_1_qc_run_id: "${qc1_id}", level_2_qc_run_id: "${qc2_id}" }
              as: QualityCoordinator
            - call: "POST /poct/test-results"
              payload: { device_id: "${dev1_id}", operator_id: "${op_a_id}", reagent_lot_id: "${lot1_id}", patient_mrn: "MRN-2001", analyte: "GLUCOSE", measured_value: 96.0, entry_mode: "INTERFACED" }
              as: Operator
              as_user_id: "${op_a_id}"
            - call: "POST /poct/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /poct/test-results"
              payload: { device_id: "${dev1_id}", operator_id: "${op_a_id}", reagent_lot_id: "${lot1_id}", patient_mrn: "MRN-2002", analyte: "GLUCOSE", measured_value: 104.0, entry_mode: "INTERFACED" }
              as: Operator
              as_user_id: "${op_a_id}"
            - call: "POST /poct/inspections"
              payload: { site_id: "${site_id}", inspection_type: "BIENNIAL_SURVEY", scheduled_date: "2026-08-03" }
              as: Surveyor
              as_user_id: "surveyor-alpha"
              captures: { insp_id: $.data.id }
            - call: "POST /poct/deficiencies"
              payload: { inspection_id: "${insp_id}", category: "QUALITY_CONTROL", severity: "CONDITION_LEVEL", description: "No two-level QC on days of patient testing", correction_due_date: "2026-10-31" }
              as: Surveyor
              as_user_id: "surveyor-alpha"
              captures: { def_id: $.data.id }
            - call: "POST /poct/inspections/${insp_id}/issue"
              payload: { issued_on: "2026-08-03" }
              as: Surveyor
              as_user_id: "surveyor-alpha"
            - call: "POST /poct/pt-enrollments"
              payload: { site_id: "${site_id}", analyte: "GLUCOSE", program_year: 2026, program_provider: "NationalPT" }
              as: QualityCoordinator
              captures: { enr_g_id: $.data.id }
            - call: "POST /poct/pt-events"
              payload: { enrollment_id: "${enr_g_id}", shipment_number: 1, due_date: "2026-08-10" }
              as: QualityCoordinator
              captures: { ev_g1_id: $.data.id }
            - call: "POST /poct/pt-events"
              payload: { enrollment_id: "${enr_g_id}", shipment_number: 2, due_date: "2026-08-20" }
              as: QualityCoordinator
              captures: { ev_g2_id: $.data.id }
            - call: "POST /poct/pt-enrollments"
              payload: { site_id: "${site_id}", analyte: "HBA1C", program_year: 2026, program_provider: "NationalPT" }
              as: QualityCoordinator
              captures: { enr_h_id: $.data.id }
            - call: "POST /poct/pt-events"
              payload: { enrollment_id: "${enr_h_id}", shipment_number: 1, due_date: "2026-08-10" }
              as: QualityCoordinator
              captures: { ev_h1_id: $.data.id }
            - call: "POST /poct/pt-events"
              payload: { enrollment_id: "${enr_h_id}", shipment_number: 2, due_date: "2026-08-20" }
              as: QualityCoordinator
              captures: { ev_h2_id: $.data.id }
            - call: "POST /poct/pt-events/${ev_g1_id}/score"
              payload: { score_pct: 60.00, graded_on: "2026-08-03" }
              as: QualityCoordinator
            - call: "POST /poct/pt-events/${ev_g2_id}/score"
              payload: { score_pct: 60.00, graded_on: "2026-08-03" }
              as: QualityCoordinator
            - call: "POST /poct/pt-events/${ev_h1_id}/score"
              payload: { score_pct: 60.00, graded_on: "2026-08-03" }
              as: QualityCoordinator
            - call: "POST /poct/pt-events/${ev_h2_id}/score"
              payload: { score_pct: 60.00, graded_on: "2026-08-03" }
              as: QualityCoordinator
          trigger:
            - call: "GET /poct/sites/${site_id}/readiness"
              as: Surveyor
              as_user_id: "surveyor-beta"
              captures: { score: $.data.score, dp: $.data.deficiency_penalty, cp: $.data.competency_penalty, qp: $.data.qc_penalty, pp: $.data.pt_penalty, idx: $.data.site_qc_compliance_index, ptn: $.data.pt_unsuccessful_count, basis: $.data.basis }
          assert:
            - "${basis} == AS_OF_ACTUAL (omitting `basis` selects the default variant)"
            - "${dp} == 20.00"
            - "${cp} == 12.50"
            - "${qp} == 20.00 (uncapped value 23.40 clipped by QC_PENALTY_CAP)"
            - "${pp} == 18.00 (uncapped value 24 clipped by PT_PENALTY_CAP, pt_unit 6 for MODERATE)"
            - "${idx} == 50.00"
            - "${ptn} == 4"
            - "${score} == 29.50"
            - "TestSite.${site_id}.inspection_readiness_score == 29.50"
            - "TestSite.${site_id}.open_deficiency_weight == 8.00 and DeficiencyFinding.${def_id}.weight == 8.00"
            - "TestSite.${site_id}.oversight_posture == RESTRICTED (open_deficiency_weight 8.00 >= 6.0)"
            - "ProficiencyEnrollment.${enr_g_id}.status == UNSUCCESSFUL_PARTICIPATION and ProficiencyEnrollment.${enr_h_id}.status == UNSUCCESSFUL_PARTICIPATION (the second FAIL is the second of the last three, so each enrollment trips the UNSUCCESSFUL_LOCKED branch)"
            - "Device.${dev1_id}.status == QC_LOCKED and Device.${dev1_id}.qc_lock_reason == PT_UNSUCCESSFUL (locked by the GLUCOSE enrollment, after every QC run and patient result was already recorded)"

      - name: site_index_two_stage_rounding_order_pinned_at_forty_one_fifty
        grounds:
          - calculations.site_qc_compliance_index
          - calculations.device_qc_compliance_rate
          - entities.TestSite.fields.site_qc_compliance_index
        distinguishing_aspect: |
          Two devices with day-of-use rates 33.33 and 50.00 give a site index
          of exactly 41.50 when each device is rounded to a whole percent
          before averaging, and 41.67 when the unrounded rates are averaged -
          the assertion pins 41.50 and explicitly forbids 41.67.
        test_recipe:
          setup:
            - "Logical clock walks 2026-08-01T00:00:00Z -> 2026-08-02T09:00:00Z -> 2026-08-03T09:00:00Z."
            - "One WAIVED site with ACTIVE waiver coverage and one trained operator."
            - "Device A (GlucoMeter-X, GLUCOSE) QC-covered on 2026-08-01 and used on 2026-08-01, 2026-08-02 and 2026-08-03 -> day-of-use rate 33.33."
            - "Device B (A1cAnalyzer-Y, HBA1C) QC-covered on 2026-08-01 and used on 2026-08-01 and 2026-08-03 -> day-of-use rate 50.00."
            - "Both devices carry qc_frequency_days 30 so no QC-overdue gate fires; both lots are VERIFIED."
          setup_api_calls:
            - call: "POST /poct/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /poct/certificates"
              payload: { certificate_number: "45D2243004", certificate_type: "CERTIFICATE_OF_WAIVER", permitted_complexity: "WAIVED", effective_date: "2026-01-01", expiration_date: "2027-12-31" }
              as: ProgramAdmin
              captures: { cert_id: $.data.id }
            - call: "POST /poct/sites"
              payload: { name: "Family Medicine POCT", department_code: "DEPT-130", complexity_scope: "WAIVED" }
              as: ProgramAdmin
              captures: { site_id: $.data.id }
            - call: "POST /poct/certificate-coverages"
              payload: { site_id: "${site_id}", certificate_id: "${cert_id}", coverage_start: "2026-01-01", coverage_end: "2027-12-31" }
              as: ProgramAdmin
            - call: "POST /poct/operators"
              payload: { site_id: "${site_id}", full_name: "Cora Vance", role_title: "MEDICAL_TECHNOLOGIST", hire_date: "2026-02-01" }
              as: ProgramAdmin
              captures: { op1_id: $.data.id }
            - call: "POST /poct/operators/${op1_id}/training"
              payload: { training_module_code: "POCT-101", completed_on: "2026-08-01" }
