    description: "Record a member's payment of their split; advances payment_status."
    roles: [Roommate]
    code: 200
    input: [profile_id]
    output: Bill
    side_effects: ["payer BillSplit.paid -> true", "payment_status advanced", "reminders may cancel"]

  # ---- Expense ----
  - method: POST
    path: "/expenses"
    description: "Log a shared expense; ExpenseShares created; net balances recomputed."
    roles: [Roommate]
    code: 201
    input: [household_id, payer_id, description, total_amount_cents, "split_mode?", participant_ids, "share_overrides?"]
    output: Expense
    side_effects: ["ExpenseShare rows created via bill_split-style split", "household_net_balance recomputed", "Household.ledger_sum_cents stays 0"]
  - method: GET
    path: "/expenses"
    description: "List expenses; filter by household_id and/or payer_id (reverse-reachability for Expense.payer_id)."
    roles: [Roommate, DisputeMediator, PlatformOperator]
    code: 200
    input: ["household_id?", "payer_id?", "limit?", "offset?"]
    output: Expense[]
    side_effects: []
  - method: GET
    path: "/expenses/{id}"
    description: "Fetch an expense."
    roles: [Roommate, DisputeMediator, PlatformOperator]
    code: 200
    input: []
    output: Expense
    side_effects: []
  - method: GET
    path: "/expenses/{id}/shares"
    description: "List an expense's shares (reverse-reachability for ExpenseShare.expense_id and .profile_id)."
    roles: [Roommate, DisputeMediator, PlatformOperator]
    code: 200
    input: ["limit?", "offset?"]
    output: ExpenseShare[]
    side_effects: []
  - method: POST
    path: "/expenses/{id}/void"
    description: "Void a posted expense (compensating action); reverses ledger impact."
    roles: [Roommate]
    code: 200
    input: []
    output: Expense
    side_effects: ["Expense.status -> VOIDED", "household_net_balance recomputed", "Household.ledger_sum_cents stays 0"]

  # ---- Settlement ----
  - method: POST
    path: "/settlements"
    description: "Propose a settle-up payment from debtor to creditor."
    roles: [Roommate]
    code: 201
    input: [household_id, from_profile_id, to_profile_id, amount_cents]
    output: Settlement
    side_effects: ["Settlement created PROPOSED"]
  - method: GET
    path: "/settlements"
    description: "List settlements; filter by household_id, from_profile_id, to_profile_id (reverse-reachability for Settlement.from_profile_id and .to_profile_id)."
    roles: [Roommate, DisputeMediator, PlatformOperator]
    code: 200
    input: ["household_id?", "from_profile_id?", "to_profile_id?", "limit?", "offset?"]
    output: Settlement[]
    side_effects: []
  - method: GET
    path: "/settlements/{id}"
    description: "Fetch a settlement."
    roles: [Roommate, DisputeMediator, PlatformOperator]
    code: 200
    input: []
    output: Settlement
    side_effects: []
  - method: POST
    path: "/settlements/{id}/confirm"
    description: "Creditor confirms a settlement (OCC on Household.version); applies ledger effects."
    roles: [Roommate]
    code: 200
    input: [expected_household_version]
    output: Settlement
    side_effects: ["Settlement.status -> CONFIRMED", "net balances updated", "Household.version +1", "reminders may cancel"]
  - method: POST
    path: "/settlements/{id}/repropose"
    description: "Re-propose a previously disputed settlement once its dispute closes."
    roles: [Roommate]
    code: 200
    input: []
    output: Settlement
    side_effects: ["Settlement.status -> PROPOSED", "amount_cents may adopt the dispute's adjusted amount"]
  - method: POST
    path: "/settlements/{id}/cancel"
    description: "Cancel a proposed settlement."
    roles: [Roommate]
    code: 200
    input: []
    output: Settlement
    side_effects: ["Settlement.status -> CANCELLED"]

  # ---- PaymentReminder ----
  - method: POST
    path: "/payment-reminders"
    description: "Schedule a payment reminder for a bill OR a settlement (exactly one)."
    roles: [Roommate]
    code: 201
    input: [household_id, "bill_id?", "settlement_id?", due_date]
    output: PaymentReminder
    side_effects: ["reminder created SCHEDULED", "if bill_id set and Bill.reminder_status==NONE, Bill.reminder_status -> SCHEDULED"]
  - method: GET
    path: "/payment-reminders/{id}"
    description: "Fetch a payment reminder."
    roles: [Roommate, DisputeMediator, PlatformOperator]
    code: 200
    input: []
    output: PaymentReminder
    side_effects: []
  - method: GET
    path: "/payment-reminders"
    description: "List payment reminders; filter by household_id, bill_id, settlement_id."
    roles: [Roommate, DisputeMediator, PlatformOperator]
    code: 200
    input: ["household_id?", "bill_id?", "settlement_id?", "limit?", "offset?"]
    output: PaymentReminder[]
    side_effects: []
  - method: POST
    path: "/payment-reminders/{id}/acknowledge"
    description: "Member acknowledges a sent reminder."
    roles: [Roommate]
    code: 200
    input: []
    output: PaymentReminder
    side_effects: ["PaymentReminder.status -> ACKNOWLEDGED"]

  # ---- Dispute ----
  - method: POST
    path: "/disputes"
    description: "File a dispute over an expense or a settlement."
    roles: [Roommate]
    code: 201
    input: [household_id, "expense_id?", "settlement_id?", filed_by_id, reason]
    output: Dispute
    side_effects: ["Dispute created OPEN", "if settlement_id set and debtor filed, Settlement.status -> DISPUTED"]
  - method: GET
    path: "/disputes/{id}"
    description: "Fetch a dispute."
    roles: [Roommate, DisputeMediator, PlatformOperator]
    code: 200
    input: []
    output: Dispute
    side_effects: []
  - method: GET
    path: "/disputes"
    description: "List disputes; filter by household_id, expense_id, settlement_id, filed_by_id (reverse-reachability for Dispute.filed_by_id)."
    roles: [Roommate, DisputeMediator, PlatformOperator]
    code: 200
    input: ["household_id?", "expense_id?", "settlement_id?", "filed_by_id?", "limit?", "offset?"]
    output: Dispute[]
    side_effects: []
  - method: POST
    path: "/disputes/{id}/claim"
    description: "Mediator claims a dispute for review; freezes the household."
    roles: [DisputeMediator]
    code: 200
    input: []
    output: Dispute
    side_effects: ["Dispute.status -> UNDER_REVIEW", "Household.status -> FROZEN"]
  - method: POST
    path: "/disputes/{id}/resolve"
    description: "Mediator resolves a dispute, optionally adjusting the disputed amount."
    roles: [DisputeMediator]
    code: 200
    input: ["adjusted_amount_cents?"]
    output: Dispute
    side_effects: ["Dispute.status -> RESOLVED", "expense amount/shares/net-balances recomputed if expense_id set", "household unfreezes"]
  - method: POST
    path: "/disputes/{id}/reject"
    description: "Mediator rejects a dispute (target unchanged); unfreezes household."
    roles: [DisputeMediator]
    code: 200
    input: []
    output: Dispute
    side_effects: ["Dispute.status -> REJECTED", "household unfreezes"]
  - method: POST
    path: "/disputes/{id}/reopen"
    description: "Mediator bounces a dispute back to OPEN."
    roles: [DisputeMediator]
    code: 200
    input: []
    output: Dispute
    side_effects: ["Dispute.status -> OPEN", "household unfreezes if no other dispute under review"]

  # ---- Test-driving endpoints (/_ namespace) ----
  - method: POST
    path: "/_clock/set"
    description: "Set the server's current UTC clock (test-driving; drives reminder due_date crossing)."
    roles: [PlatformOperator]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["server clock set to to_iso8601"]
  - method: POST
    path: "/_reminders/dispatch"
    description: "Dispatch all SCHEDULED reminders whose due_date <= clock now (test-driving batch)."
    roles: [PlatformOperator]
    code: 200
    input: []
    output: null
    side_effects: ["matching PaymentReminders -> SENT", "linked Bill.reminder_status -> SENT"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing/invalid X-User-Role or X-User-ID on a protected endpoint."
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "Acting role not permitted for the operation per RBAC."
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "Acting roommate is not the required owner/manager/party of the resource."
  - id: ERR_SELF_ADJUDICATION
    http: 403
    condition: "DisputeMediator attempts to claim/resolve/reject a dispute they filed."
  - id: ERR_NOT_FOUND
    http: 404
    condition: "A referenced path id or FK body field does not resolve to an existing resource."
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Transition is not defined from the resource's current state."
  - id: ERR_HOUSEHOLD_FROZEN
    http: 409
    condition: "Ledger-mutating write attempted while Household.status == FROZEN."
  - id: ERR_NOT_HOUSEHOLD_MEMBER
    http: 422
    condition: "A referenced profile is not an ACTIVE member of the named household."
  - id: ERR_SELF_SETTLEMENT
    http: 422
    condition: "Settlement from_profile_id equals to_profile_id."
  - id: ERR_SHARES_DO_NOT_SUM
    http: 422
    condition: "CUSTOM expense share_overrides do not sum to total_amount_cents or keys mismatch participants."
  - id: ERR_BILL_PERIOD_OVERLAP
    http: 409
    condition: "A new RENT bill's closed period overlaps an existing RENT bill of the household."
  - id: ERR_INVALID_PERIOD
    http: 422
    condition: "Bill period_end is not strictly after period_start."
  - id: ERR_ROOM_AT_CAPACITY
    http: 409
    condition: "Activation would push active_member_count past RoomListing.capacity."
  - id: ERR_OCCUPANCY_OVERLAP
    http: 409
    condition: "Occupancy interval overlaps another ACTIVE membership on the same room beyond capacity."
  - id: ERR_SETTLEMENT_EXCEEDS_DEBT
    http: 422
    condition: "Settlement amount_cents exceeds the debtor's outstanding debt."
  - id: ERR_NO_OUTSTANDING_DEBT
    http: 422
    condition: "Confirm attempted when the debtor has no outstanding debt (net_balance_cents >= 0)."
  - id: ERR_BELOW_MATCH_THRESHOLD
    http: 422
    condition: "Accepting a match request whose compatibility_score < MATCH_THRESHOLD."
  - id: ERR_SELF_APPLICATION
    http: 422
    condition: "applicant_id equals the listing's lister_id."
  - id: ERR_EMAIL_TAKEN
    http: 409
    condition: "A RoommateProfile with the same email already exists."
  - id: ERR_REMINDER_TARGET_AMBIGUOUS
    http: 422
    condition: "PaymentReminder does not name exactly one of bill_id / settlement_id."
  - id: ERR_STALE_HOUSEHOLD_VERSION
    http: 412
    condition: "expected_household_version does not match the current Household.version on confirm."
  - id: ERR_VALIDATION
    http: 422
    condition: "A required field is missing or a field violates its declared type/range constraint."

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Roommate
    description: "A person with a profile: lists rooms, applies, manages a household, logs expenses, settles up, files disputes."
    identity: "entity_backed:RoommateProfile"
    exclusive_operations:
      - "POST /roommate-profiles"
      - "POST /room-listings"
      - "POST /match-requests (+ accept/reject/withdraw/reapply)"
      - "POST /memberships/{id}/activate, /move-out"
      - "POST /bills (+ record-payment)"
      - "POST /expenses (+ void)"
      - "POST /settlements (+ confirm/repropose/cancel)"
      - "POST /payment-reminders (+ acknowledge)"
      - "POST /disputes (file only)"
    shared_operations:
      - "GET on all resources"
  - name: DisputeMediator
    description: "Neutral operator who adjudicates disputes; cannot adjudicate disputes they filed."
    identity: "opaque"
    exclusive_operations:
      - "POST /disputes/{id}/claim, /resolve, /reject, /reopen"
    shared_operations:
      - "GET on all resources"
  - name: PlatformOperator
    description: "System operator: advances the clock and runs the reminder dispatch batch."
    identity: "opaque"
    exclusive_operations:
      - "POST /_clock/set"
      - "POST /_reminders/dispatch"
    shared_operations:
      - "GET on all resources"
