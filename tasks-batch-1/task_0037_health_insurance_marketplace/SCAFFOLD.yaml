scenario: "Health Insurance Marketplace Enrollment (HealthCare.gov style): household composition and MAGI income, APTC subsidy calculation, Bronze/Silver/Gold/Platinum tiers, Special Enrollment Period (SEP events), effective date rules, CSR Plus"
domain_name: "health-insurance-marketplace"
api_prefix: ""

complexity_profile:
  primary_archetype: "Ledger reconciliation"
  secondary_archetype: "Temporal windowing"
  complexity_layers:
    - dual_variant_calculation
    - rate_threshold_triggers
    - optimistic_concurrency
    - derived_field_reconciliation
    - scheduled_deferred_actions

  entity_topology: hybrid
  # Household is the aggregate root (members nested under it); Application,
  # EligibilityDetermination, Enrollment, SepRequest, ReconciliationRecord are
  # peers linked to the Household / Application via foreign keys; HealthPlan is
  # a configuration catalog entity referenced cross-aggregate by Enrollment.

  state_machine_shape: branching
  # Application: DRAFT -> {SUBMITTED -> DETERMINED -> {ENROLLED}} with revert
  # paths (DETERMINED -> DRAFT on income correction). SepRequest has a
  # fork-join branch (PENDING -> {APPROVED, DENIED}) with divergent side
  # effects. Enrollment carries two independent state dimensions.

  relationship_patterns:
    - one_to_many        # Household -> HouseholdMember; Application -> EligibilityDetermination
    - cross_aggregate    # Enrollment -> HealthPlan (config catalog)
    - polymorphic        # SepRequest.qualifying_event_type drives effective-date branch

  role_model: peer_roles
  # Applicant owns their Household/Application/Enrollment; Navigator assists
  # (shared read + submit on behalf); MarketplaceAdmin runs determinations,
  # SEP review, batch reconciliation, and plan-catalog management.

  consistency_model: immediate

# ─────────────────────────────────────────────────────────────────────────
# 1.0 Response Envelope (FIXED — EMIT VERBATIM)
# ─────────────────────────────────────────────────────────────────────────
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ─────────────────────────────────────────────────────────────────────────
# 1.1 Entity-Relationship Table
# ─────────────────────────────────────────────────────────────────────────
entities:
  - name: Household
    parent: null
    common_fields: true
    fields:
      - name: id
        type: string
        source: system
        description: "Server-minted UUID (no type prefix); identity only, never a business-decision input."
      - name: created_at
        type: datetime
        source: system
        description: "ISO 8601 UTC, three fractional digits."
      - name: updated_at
        type: datetime
        source: system
        description: "ISO 8601 UTC; refreshed on every mutation including cascaded side effects."
      - name: version
        type: integer
        source: system
        description: "Starts at 1; increments by 1 on every mutation. OCC token for Application submission and Enrollment creation."
      - name: applicant_user_id
        type: string
        source: input
        description: "Opaque-equal: equals the X-User-ID of the Applicant who owns this household. Set from header at creation."
      - name: coverage_year
        type: integer
        source: input
        description: "Plan year this household is shopping for, e.g. 2026."
      - name: rating_area
        type: string
        source: input
        description: "Geographic rating area code used to pick the SLCSP benchmark, e.g. RA01."
      - name: household_magi_cents
        type: integer
        source: computed
        description: "Computed sum of countable member annual income in cents (calc household_magi). Recomputed whenever a member is added/updated. 0 until first member added."
      - name: fpl_percent
        type: number
        source: computed
        description: "household_magi as a percentage of the Federal Poverty Level for the countable household size (calc fpl_percent). Two decimals. 0 until first member added."
      - name: countable_size
        type: integer
        source: computed
        description: "Count of household members included in the MAGI/FPL determination (calc household_magi input_set). 0 until first member added."

  - name: HouseholdMember
    parent: Household
    common_fields: true
    fields:
      - name: id
        type: string
        source: system
        description: "Server-minted UUID; identity only."
      - name: created_at
        type: datetime
        source: system
        description: "ISO 8601 UTC, three fractional digits."
      - name: updated_at
        type: datetime
        source: system
        description: "ISO 8601 UTC; refreshed on mutation."
      - name: version
        type: integer
        source: system
        description: "Starts at 1; increments by 1 on every mutation."
      - name: household_id
        type: string
        source: system
        description: "FK -> Household.id; set from the URL path on creation."
      - name: full_name
        type: string
        source: input
        description: "Member legal name."
      - name: relationship
        type: enum
        source: input
        description: "Relationship to the primary applicant."
        constraints: "one of {PRIMARY, SPOUSE, DEPENDENT}; exactly one PRIMARY per household."
      - name: tax_filing_status
        type: enum
        source: input
        description: "Drives whether member income is countable toward MAGI."
        constraints: "one of {FILER, JOINT_FILER, DEPENDENT_FILER, DEPENDENT_NONFILER}"
      - name: annual_income_cents
        type: integer
        source: input
        description: "Member projected annual MAGI income in cents."
        default: 0
        constraints: ">= 0"
      - name: applies_for_coverage
        type: boolean
        source: input
        description: "Whether this member is seeking coverage (affects countable_size for the FPL denominator)."
        default: true
      - name: is_countable_income
        type: boolean
        source: computed
        description: "True unless tax_filing_status == DEPENDENT_NONFILER and annual_income_cents < FILING_THRESHOLD_CENTS (calc household_magi)."

  - name: HealthPlan
    parent: null
    common_fields: false
    fields:
      - name: id
        type: string
        source: system
        description: "Server-minted UUID; identity only."
      - name: created_at
        type: datetime
        source: system
        description: "ISO 8601 UTC, three fractional digits."
      - name: rating_area
        type: string
        source: input
        description: "Rating area this plan is offered in; must match a household's rating_area to be selectable."
      - name: coverage_year
        type: integer
        source: input
        description: "Plan year."
      - name: metal_tier
        type: enum
        source: input
        description: "Actuarial-value tier."
        constraints: "one of {BRONZE, SILVER, GOLD, PLATINUM}"
      - name: gross_premium_cents
        type: integer
        source: input
        description: "Full monthly premium in cents before any APTC is applied."
        constraints: "> 0"
      - name: is_slcsp_benchmark
        type: boolean
        source: input
        description: "True for the one SILVER plan designated as the Second Lowest Cost Silver Plan benchmark for its rating_area + coverage_year. Used as the APTC benchmark premium."
        default: false
      - name: csr_eligible
        type: boolean
        source: computed
        description: "True iff metal_tier == SILVER (cost-sharing reductions only attach to Silver plans)."

  - name: Application
    parent: null
    common_fields: true
    fields:
      - name: id
        type: string
        source: system
        description: "Server-minted UUID; identity only."
      - name: created_at
        type: datetime
        source: system
        description: "ISO 8601 UTC, three fractional digits."
      - name: updated_at
        type: datetime
        source: system
        description: "ISO 8601 UTC; refreshed on mutation including cascaded side effects."
      - name: version
        type: integer
        source: system
        description: "Starts at 1; increments by 1 on every mutation."
      - name: household_id
        type: string
        source: input
        description: "FK -> Household.id; the household this application enrolls."
      - name: status
        type: enum
        source: system
        description: "Lifecycle state."
        constraints: "one of {DRAFT, SUBMITTED, DETERMINED, ENROLLED, CANCELLED}"
      - name: enrollment_window
        type: enum
        source: input
        description: "Which enrollment window the application is filed under."
        constraints: "one of {OEP, SEP}; OEP = Open Enrollment, SEP = Special Enrollment."
      - name: sep_request_id
        type: string
        source: computed
        description: "Denormalized back-pointer to the APPROVED SepRequest.id (the canonical FK is SepRequest.application_id -> Application.id, discoverable via GET /sep-requests?application_id=). Null unless enrollment_window == SEP and a SepRequest has been approved for this application."
        default: null
      - name: submitted_at
        type: datetime
        source: system
        description: "ISO 8601 UTC stamp set when status moves DRAFT -> SUBMITTED; drives effective-date computation. null while DRAFT."
        default: null

  - name: EligibilityDetermination
    parent: null
    common_fields: true
    fields:
      - name: id
        type: string
        source: system
        description: "Server-minted UUID; identity only."
      - name: created_at
        type: datetime
        source: system
        description: "ISO 8601 UTC, three fractional digits."
      - name: updated_at
        type: datetime
        source: system
        description: "ISO 8601 UTC; refreshed on mutation."
      - name: version
        type: integer
        source: system
        description: "Starts at 1; increments by 1 on every mutation."
      - name: application_id
        type: string
        source: system
        description: "FK -> Application.id; the application this determination resolves. One active determination per application."
      - name: fpl_percent_snapshot
        type: number
        source: computed
        description: "Household fpl_percent captured at determination time (calc fpl_percent), two decimals."
      - name: applicable_pct
        type: number
        source: computed
        description: "Expected-contribution applicable percentage from the FPL band table (calc applicable_percentage), six decimals."
      - name: max_aptc_monthly_cents
        type: integer
        source: computed
        description: "Maximum monthly APTC the household qualifies for (calc max_aptc), in cents."
      - name: csr_tier
        type: enum
        source: computed
        description: "Cost-sharing-reduction tier (calc csr_tier). CSR94 is 'CSR Plus' (the top tier)."
        constraints: "one of {CSR94, CSR87, CSR73, NONE}"
      - name: is_subsidy_eligible
        type: boolean
        source: computed
        description: "True iff max_aptc_monthly_cents > 0."

  - name: Enrollment
    parent: null
    common_fields: true
    fields:
      - name: id
        type: string
        source: system
        description: "Server-minted UUID; identity only."
      - name: created_at
        type: datetime
        source: system
        description: "ISO 8601 UTC, three fractional digits."
      - name: updated_at
        type: datetime
        source: system
        description: "ISO 8601 UTC; refreshed on mutation including cascaded side effects."
      - name: version
        type: integer
        source: system
        description: "Starts at 1; increments by 1 on every mutation."
      - name: application_id
        type: string
        source: input
        description: "FK -> Application.id; the application that produced this enrollment."
      - name: plan_id
        type: string
        source: input
        description: "FK -> HealthPlan.id; the selected plan."
      - name: elected_aptc_monthly_cents
        type: integer
        source: input
        description: "APTC amount the applicant elects to apply monthly; clamped at creation to <= determination.max_aptc_monthly_cents."
        default: 0
        constraints: ">= 0"
      - name: applied_aptc_monthly_cents
        type: integer
        source: computed
        description: "min(elected_aptc_monthly_cents, determination.max_aptc_monthly_cents, plan.gross_premium_cents) (calc applied_aptc)."
      - name: net_premium_monthly_cents
        type: integer
        source: computed
        description: "plan.gross_premium_cents - applied_aptc_monthly_cents (calc applied_aptc)."
      - name: effective_date
        type: string
        source: computed
        description: "Coverage start date (YYYY-MM-DD) computed from the effective-date rules (calc effective_date)."
      - name: first_month_premium_cents
        type: integer
        source: computed
        description: "Prorated net premium owed for the first (possibly partial) coverage month (calc first_month_proration), cents."
      - name: lifecycle_status
        type: enum
        source: system
        description: "Coverage-lifecycle dimension (independent of payment_status)."
        constraints: "one of {PENDING_EFFECTUATION, ACTIVE, TERMINATED}"
      - name: payment_status
        type: enum
        source: system
        description: "Binder-payment dimension (independent of lifecycle_status)."
        constraints: "one of {AWAITING_BINDER, PAID, DELINQUENT}"

  - name: SepRequest
    parent: null
    common_fields: true
    fields:
      - name: id
        type: string
        source: system
        description: "Server-minted UUID; identity only."
      - name: created_at
        type: datetime
        source: system
        description: "ISO 8601 UTC, three fractional digits."
      - name: updated_at
        type: datetime
        source: system
        description: "ISO 8601 UTC; refreshed on mutation."
      - name: version
        type: integer
        source: system
        description: "Starts at 1; increments by 1 on every mutation."
      - name: application_id
        type: string
        source: input
        description: "FK -> Application.id; the SEP application requesting a special enrollment window."
      - name: qualifying_event_type
        type: enum
        source: input
        description: "The life event claimed; drives effective-date branch (regular 1st-of-next-month vs retroactive-to-event)."
        constraints: "one of {BIRTH, ADOPTION, MARRIAGE, LOSS_OF_COVERAGE, PERMANENT_MOVE}"
      - name: event_date
        type: string
        source: input
        description: "Date the qualifying event occurred (YYYY-MM-DD)."
      - name: status
        type: enum
        source: system
        description: "Review state."
        constraints: "one of {PENDING, APPROVED, DENIED}"
      - name: window_close_date
        type: string
        source: computed
        description: "Last date (YYYY-MM-DD) the applicant may submit under this SEP = event_date + SEP_WINDOW_DAYS (calc sep_window)."

  - name: ReconciliationRecord
    parent: null
    common_fields: true
    fields:
      - name: id
        type: string
        source: system
        description: "Server-minted UUID; identity only."
      - name: created_at
        type: datetime
        source: system
        description: "ISO 8601 UTC, three fractional digits."
      - name: updated_at
        type: datetime
        source: system
        description: "ISO 8601 UTC; refreshed on mutation."
      - name: version
        type: integer
        source: system
        description: "Starts at 1; increments by 1 on every mutation."
      - name: enrollment_id
        type: string
        source: input
        description: "FK -> Enrollment.id; the enrollment being reconciled at year end."
      - name: actual_annual_magi_cents
        type: integer
        source: input
        description: "Realized annual MAGI reported at reconciliation, cents."
      - name: months_enrolled
        type: integer
        source: input
        description: "Number of months coverage was active during the year."
        constraints: "1..12"
      - name: advanced_aptc_total_cents
        type: integer
        source: computed
        description: "applied_aptc_monthly_cents * months_enrolled — the APTC actually advanced (calc aptc_reconciliation, ESTIMATED variant rollup)."
      - name: allowed_aptc_total_cents
        type: integer
        source: computed
        description: "Allowed APTC recomputed from actual_annual_magi_cents over months_enrolled (calc aptc_reconciliation, RECONCILED variant)."
      - name: settlement_cents
        type: integer
        source: computed
        description: "advanced_aptc_total_cents - allowed_aptc_total_cents; positive = repayment owed by household, negative = additional credit (calc aptc_reconciliation)."

# ─────────────────────────────────────────────────────────────────────────
# 1.2 State Machine Table
# ─────────────────────────────────────────────────────────────────────────
state_machines:
  - entity: Application
    initial_state: DRAFT
    terminal_states: [CANCELLED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /applications/{id}/submit"
        actor: Applicant
        preconditions:
          - "Application.status == DRAFT"
          - "Household referenced by household_id has countable_size >= 1 (at least one PRIMARY member exists)"
          - "request expected_household_version matches Household.version (OCC)"
          - "if enrollment_window == SEP, an APPROVED SepRequest exists for this application (cross-entity: SepRequest.status == APPROVED)"
        side_effects:
          - "set Application.submitted_at = current UTC clock"
          - "set Application.sep_request_id to the APPROVED SepRequest.id when enrollment_window == SEP"
          - "increments Household.version by 1"
          - "increments Application.version by 1"
        note: "OEP applications skip the SEP precondition. The OCC field is on Household because a concurrent member edit changes MAGI and would invalidate a stale submission."
      - from: SUBMITTED
        to: DETERMINED
        trigger: "POST /applications/{id}/determine"
        actor: MarketplaceAdmin
        preconditions:
          - "Application.status == SUBMITTED"
        side_effects:
          - "create EligibilityDetermination for this application (runs calc fpl_percent, applicable_percentage, max_aptc, csr_tier)"
          - "increments Application.version by 1"
        note: "Determination snapshots Household.fpl_percent at this instant."
      - from: DETERMINED
        to: DRAFT
        trigger: "POST /applications/{id}/reopen"
        actor: Applicant
        preconditions:
          - "Application.status == DETERMINED"
          - "no Enrollment exists for this application"
        side_effects:
          - "delete the EligibilityDetermination for this application (compensation: undoes the determination)"
          - "clear Application.submitted_at = null"
          - "increments Application.version by 1"
        note: "Branching-with-revert: income corrections force re-determination."
      - from: DETERMINED
        to: ENROLLED
        trigger: "POST /enrollments (with this application_id)"
        actor: Applicant
        preconditions:
          - "Application.status == DETERMINED"
          - "selected HealthPlan.rating_area == Household.rating_area AND HealthPlan.coverage_year == Household.coverage_year"
          - "no non-TERMINATED Enrollment (lifecycle_status IN {PENDING_EFFECTUATION, ACTIVE}) exists for this household whose coverage interval overlaps the new one (ERR_OVERLAPPING_COVERAGE)"
          - "elected_aptc_monthly_cents <= determination.max_aptc_monthly_cents (ERR_APTC_EXCEEDS_MAX)"
          - "request expected_household_version matches Household.version (OCC)"
        side_effects:
          - "create Enrollment (runs calc applied_aptc, effective_date, first_month_proration)"
          - "increments Application.version by 1"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /applications/{id}/cancel"
        actor: Applicant
        preconditions:
          - "Application.status == DRAFT"
        side_effects:
          - "increments Application.version by 1"
      - from: SUBMITTED
        to: CANCELLED
        trigger: "POST /applications/{id}/cancel"
        actor: Applicant
        preconditions:
          - "Application.status == SUBMITTED"
        side_effects:
          - "increments Application.version by 1"

  - entity: SepRequest
    initial_state: PENDING
    terminal_states: [APPROVED, DENIED]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /sep-requests/{id}/approve"
        actor: MarketplaceAdmin
        preconditions:
          - "SepRequest.status == PENDING"
          - "the linked Application.status == DRAFT (cross-entity: SEP must be resolved before submission)"
          - "current clock date <= SepRequest.window_close_date (SEP filing window still open)"
        side_effects:
          - "increments SepRequest.version by 1"
        note: "Branch A of the PENDING fork — enables SEP submission and a possibly-retroactive effective date."
      - from: PENDING
        to: DENIED
        trigger: "POST /sep-requests/{id}/deny"
        actor: MarketplaceAdmin
        preconditions:
          - "SepRequest.status == PENDING"
        side_effects:
          - "increments SepRequest.version by 1"
        note: "Branch B of the PENDING fork — no SEP window granted; linked SEP application cannot submit."

  - entity: Enrollment
    initial_state: PENDING_EFFECTUATION
    terminal_states: [TERMINATED]
    transitions:
      # lifecycle_status dimension (parallel to payment_status)
      - from: PENDING_EFFECTUATION
        to: ACTIVE
        trigger: "POST /enrollments/{id}/effectuate"
        actor: MarketplaceAdmin
        preconditions:
          - "Enrollment.lifecycle_status == PENDING_EFFECTUATION"
          - "Enrollment.payment_status == PAID (cross-dimension: binder must be paid before coverage activates)"
        side_effects:
          - "increments Enrollment.version by 1"
        note: "lifecycle dimension; gated on the payment dimension."
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /enrollments/{id}/terminate"
        actor: Applicant
        preconditions:
          - "Enrollment.lifecycle_status == ACTIVE"
        side_effects:
          - "increments Enrollment.version by 1"
      - from: PENDING_EFFECTUATION
        to: TERMINATED
        trigger: "POST /enrollments/{id}/terminate"
        actor: Applicant
        preconditions:
          - "Enrollment.lifecycle_status == PENDING_EFFECTUATION"
        side_effects:
          - "increments Enrollment.version by 1"
      # payment_status dimension (parallel to lifecycle_status)
      - from: AWAITING_BINDER
        to: PAID
        trigger: "POST /enrollments/{id}/pay-binder"
        actor: Applicant
        preconditions:
          - "Enrollment.payment_status == AWAITING_BINDER"
        side_effects:
          - "increments Enrollment.version by 1"
        note: "payment dimension; evolves independently of lifecycle until effectuation reads it."
      - from: PAID
        to: DELINQUENT
        trigger: "POST /enrollments/{id}/mark-delinquent"
        actor: MarketplaceAdmin
        preconditions:
          - "Enrollment.payment_status == PAID"
        side_effects:
          - "increments Enrollment.version by 1"

  # ─── 1.2.1 Concurrency Rules ───
  # A true CREATE-with-supersede race: creating an Enrollment against an
  # Application whose underlying Household.version has advanced (a member's
  # income was edited, changing MAGI and therefore the subsidy the enrollment
  # would lock in). A second sequential create still carrying the stale
  # household version is rejected — the determination it relied on is stale.
concurrency_rules:
  - rule_id: enrollment-create-stale-household
    parent_entity: Household
    write_endpoint: "POST /enrollments"
    occ_field: "expected_household_version"
    description: |
      Creating an Enrollment carries the household version the applicant last
      observed when reviewing their determination. If the Household.version has
      advanced since then (e.g., a member income edit triggered a MAGI/FPL
      recompute that would change the qualified APTC), the create is rejected as
      stale. This is the CREATE-with-supersede case: the new enrollment would
      legitimately lock in a subsidy figure, so the system requires the
      applicant's view of the household to be current.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: application-submit-stale-household
    parent_entity: Household
    write_endpoint: "POST /applications/{id}/submit"
    occ_field: "expected_household_version"
    description: |
      Submitting an Application freezes the household MAGI that the subsequent
      determination consumes. The submit carries the household version the
      applicant last observed; if a member edit has advanced Household.version
      since, the submission is rejected as stale so a determination is never run
      on a MAGI snapshot the applicant did not see.
    error_id: ERR_STALE_VERSION
    http_status: 412

# ─────────────────────────────────────────────────────────────────────────
# 1.3 Calculation Rules Table
# ─────────────────────────────────────────────────────────────────────────
calculations:
  - name: household_magi
    trigger: "on POST/PATCH/DELETE of a HouseholdMember (recompute Household.household_magi_cents, countable_size)"
    algorithm: aggregation
    formula: |
      countable_members = [ m for m in Household.members
        if NOT (m.tax_filing_status == 'DEPENDENT_NONFILER'
                AND m.annual_income_cents < FILING_THRESHOLD_CENTS) ]
      # m.is_countable_income mirrors the predicate above per member.
      household_magi_cents = sum(m.annual_income_cents for m in countable_members)
      countable_size = count of members with applies_for_coverage == true
    input_set: "All HouseholdMember rows under the Household. A DEPENDENT_NONFILER whose annual_income_cents < FILING_THRESHOLD_CENTS is excluded from the MAGI sum (is_countable_income=false) but still counts toward countable_size if applies_for_coverage. countable_size is the FPL denominator size."
    constants:
      FILING_THRESHOLD_CENTS: 1460000   # $14,600 dependent filing threshold
    precision: "integer cents; no rounding (inputs are integer cents)"

  - name: fpl_percent
    trigger: "on Household member recompute and snapshotted at EligibilityDetermination creation"
    algorithm: threshold
    formula: |
      fpl_annual_cents = FPL_BASE_CENTS + FPL_ADDL_CENTS * (countable_size - 1)
      fpl_percent = round_half_up( household_magi_cents / fpl_annual_cents * 100, 2 )
      # countable_size == 0 -> fpl_percent = 0
    input_set: "Household.household_magi_cents and Household.countable_size from calc household_magi."
    constants:
      FPL_BASE_CENTS: 1500000   # $15,000 FPL for size 1
      FPL_ADDL_CENTS: 530000    # +$5,300 per additional person
    precision: "2 decimal places, round_half_up"

  - name: applicable_percentage
    trigger: "at EligibilityDetermination creation, from fpl_percent_snapshot"
    algorithm: tiered_pricing
    formula: |
      p = fpl_percent_snapshot
      if p <= 150.0:        applicable_pct = 0.0
      elif p <= 200.0:      applicable_pct = 0.0   + (p-150)/(200-150) * (0.02 - 0.0)
      elif p <= 250.0:      applicable_pct = 0.02  + (p-200)/(250-200) * (0.04 - 0.02)
      elif p <= 300.0:      applicable_pct = 0.04  + (p-250)/(300-250) * (0.06 - 0.04)
      elif p <= 400.0:      applicable_pct = 0.06  + (p-300)/(400-300) * (0.085 - 0.06)
      else:                 applicable_pct = 0.085   # ARPA: no 400% cliff
      applicable_pct = round_half_up(applicable_pct, 6)
    input_set: "EligibilityDetermination.fpl_percent_snapshot. Band boundaries are inclusive on the upper edge (<=)."
    constants:
      CAP_RATE: 0.085
    precision: "6 decimal places, round_half_up"
    variants:
      - name: at_band_boundary
        when: "fpl_percent exactly equals a band edge (150, 200, 250, 300, 400)"
        difference: "upper edge is inclusive; e.g. exactly 200.0 yields 0.02, not the next band's interpolation. 150.0 yields 0.0."

  - name: max_aptc
    trigger: "at EligibilityDetermination creation"
    algorithm: forward_looking
    formula: |
      benchmark_cents = gross_premium_cents of the HealthPlan in Household.rating_area
                        + Household.coverage_year with is_slcsp_benchmark == true
      monthly_contribution_cents = round_half_up(
        household_magi_cents * applicable_pct / 12 , 0 )   # to whole cents
      max_aptc_monthly_cents = max(0, benchmark_cents - monthly_contribution_cents)
    input_set: "EligibilityDetermination.applicable_pct, Household.household_magi_cents, and the single is_slcsp_benchmark SILVER HealthPlan for the household's rating_area+coverage_year. If no benchmark plan exists, determination fails with ERR_NO_BENCHMARK_PLAN."
    constants: {}
    precision: "integer cents; monthly_contribution rounded half_up to whole cents before subtraction"

  - name: csr_tier
    trigger: "at EligibilityDetermination creation"
    algorithm: threshold
    formula: |
      p = fpl_percent_snapshot
      if 100.0 <= p <= 150.0:   csr_tier = 'CSR94'   # 'CSR Plus' — top cost-sharing tier
      elif p <= 200.0:          csr_tier = 'CSR87'
      elif p <= 250.0:          csr_tier = 'CSR73'
      else:                     csr_tier = 'NONE'
      # p < 100.0 -> 'NONE' (below Marketplace subsidy floor)
    input_set: "EligibilityDetermination.fpl_percent_snapshot. CSR attaches only when the member later enrolls in a SILVER plan; the tier itself is determined here regardless of plan."
    constants:
      CSR_PLUS_TIER: "CSR94"
    precision: "n/a (enum output)"
    variants:
      - name: csr_plus_boundary
        when: "fpl_percent exactly 150.0"
        difference: "150.0 is inclusive in the CSR94 (CSR Plus) band, so 150.0 -> CSR94 while 150.01 -> CSR87."

  - name: sep_window
    trigger: "at SepRequest creation (POST /sep-requests)"
    algorithm: interval_merge
    formula: |
      window_close_date = SepRequest.event_date + SEP_WINDOW_DAYS calendar days
      # approval is permitted iff current clock date (date portion, UTC) <= window_close_date (inclusive).
    input_set: "SepRequest.event_date and the SEP_WINDOW_DAYS constant."
    constants:
      SEP_WINDOW_DAYS: 60
    precision: "date (YYYY-MM-DD)"

  - name: applied_aptc
    trigger: "at Enrollment creation (POST /enrollments)"
    algorithm: aggregation
    formula: |
      applied_aptc_monthly_cents = min( elected_aptc_monthly_cents,
                                        determination.max_aptc_monthly_cents,
                                        plan.gross_premium_cents )
      net_premium_monthly_cents  = plan.gross_premium_cents - applied_aptc_monthly_cents
    input_set: "Enrollment.elected_aptc_monthly_cents (input), the EligibilityDetermination for the application, and the selected HealthPlan."
    constants: {}
    precision: "integer cents"

  - name: effective_date
    trigger: "at Enrollment creation"
    algorithm: interval_merge
    formula: |
      sub = Application.submitted_at   # date portion, in UTC
      if Application.enrollment_window == 'OEP':
        effective_date = first day of the month following sub's month
      else:  # SEP
        ev = SepRequest.qualifying_event_type
        if ev in {BIRTH, ADOPTION}:
          effective_date = SepRequest.event_date   # retroactive to the event date
        elif ev in {MARRIAGE, PERMANENT_MOVE}:
          effective_date = first day of the month following sub's month  # prospective
        elif ev == LOSS_OF_COVERAGE:
          # regular rule: if submitted on/before the 15th -> 1st of next month;
          # if submitted after the 15th -> 1st of the month after next
          d = day-of-month of sub
          base = first day of month following sub's month
          effective_date = base if d <= 15 else (base + 1 month)
    input_set: "Application.submitted_at, Application.enrollment_window, and (for SEP) the approved SepRequest.qualifying_event_type and event_date."
    constants:
      REGULAR_CUTOFF_DAY: 15
    precision: "date (YYYY-MM-DD)"
    variants:
      - name: retroactive_birth
        when: "SEP with qualifying_event_type in {BIRTH, ADOPTION}"
        difference: "effective_date is the event_date itself (retroactive, mid-month) — produces a partial first month and a nonzero first_month_premium_cents."
      - name: prospective_default
        when: "OEP, or SEP with MARRIAGE/PERMANENT_MOVE, or LOSS_OF_COVERAGE submitted on/before the 15th"
        difference: "effective_date is the 1st of a month — full first month, no proration (first_month_premium_cents == net_premium_monthly_cents)."

  - name: first_month_proration
    trigger: "at Enrollment creation, after effective_date"
    algorithm: tiered_pricing
    formula: |
      days_in_month = number of days in effective_date's month
      eff_day       = day-of-month of effective_date
      if eff_day == 1:
        first_month_premium_cents = net_premium_monthly_cents   # full month, no proration
      else:
        cov_days = days_in_month - eff_day + 1
        # PINNED ORDER: per-line-item round, then sum. Here a single household line:
        daily = net_premium_monthly_cents / days_in_month        # exact rational
        first_month_premium_cents = round_half_up(daily * cov_days, 0)   # whole cents
    input_set: "Enrollment.net_premium_monthly_cents and effective_date."
    constants: {}
    precision: "integer cents; round_half_up applied once after multiplying daily * cov_days (per-line-then-sum order, pinned)"
    variants:
      - name: partial_first_month
        when: "effective_date day-of-month > 1 (e.g., retroactive BIRTH SEP)"
        difference: "prorated by coverage days; diverges from net_premium_monthly_cents."

  - name: aptc_reconciliation
    trigger: "at ReconciliationRecord creation (POST /reconciliations)"
    algorithm: chronological
    formula: |
      # ESTIMATED rollup (forward-looking, what was advanced during the year):
      advanced_aptc_total_cents = enrollment.applied_aptc_monthly_cents * months_enrolled
      # RECONCILED (chronological, recomputed from realized annual MAGI):
      #   recompute fpl_percent from actual_annual_magi_cents over the SAME countable_size,
      #   recompute applicable_pct (calc applicable_percentage),
      #   recompute monthly contribution and allowed monthly APTC against the same benchmark,
      #   then multiply by months_enrolled.
      actual_fpl = round_half_up(actual_annual_magi_cents / fpl_annual_cents * 100, 2)
      actual_applicable_pct = applicable_percentage(actual_fpl)
      actual_monthly_contribution_cents = round_half_up(actual_annual_magi_cents * actual_applicable_pct / 12, 0)
      allowed_monthly_cents = max(0, benchmark_cents - actual_monthly_contribution_cents)
      allowed_aptc_total_cents = allowed_monthly_cents * months_enrolled
      settlement_cents = advanced_aptc_total_cents - allowed_aptc_total_cents
      # settlement_cents > 0 => household repays; < 0 => household receives additional credit
    input_set: "ReconciliationRecord.actual_annual_magi_cents, months_enrolled; the linked Enrollment.applied_aptc_monthly_cents; the household's countable_size, fpl_annual constants, and benchmark_cents reused from determination time."
    constants: {}
    precision: "integer cents; fpl_percent to 2dp, applicable_pct to 6dp, monthly contribution rounded half_up to whole cents"
    variants:
      - name: estimated_at_enrollment
        when: "during the plan year — the advanced figure (applied_aptc_monthly_cents) drawn from the enrollment-time determination on PROJECTED MAGI"
        difference: "uses the enrollment-time projected MAGI; settlement is unknown until year end."
      - name: reconciled_at_year_end
        when: "at ReconciliationRecord creation — recomputed against REALIZED annual MAGI"
        difference: "Same household, same benchmark — but realized MAGI differs from projected MAGI, so allowed APTC differs from advanced APTC and settlement_cents is nonzero."

# ─────────────────────────────────────────────────────────────────────────
# 1.4 Validation Rules Table (ordered by priority)
# ─────────────────────────────────────────────────────────────────────────
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "acting role is permitted to perform this operation per §1.7 RBAC"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: auth
    check: "for Applicant-owned resources, X-User-ID equals the owning Household.applicant_user_id"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "Applicant-scoped mutations on Household/Application/Enrollment subtrees"
  - priority: 4
    category: existence
    check: "all path-referenced resources exist, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all path-parameter endpoints"
  - priority: 5
    category: existence
    check: "all FK fields in the body reference existing resources (household_id, application_id, plan_id, enrollment_id)"
    error_id: ERR_REFERENCED_NOT_FOUND
    http_status: 404
    applies_to: "POST/PATCH with FK body fields"
  - priority: 6
    category: state
    check: "target resource is in a state from which the requested transition is defined in §1.2"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition action endpoints"
  - priority: 7
    category: business_constraint
    check: "request body conforms to schema: required fields present, enums valid, integers >= 0 where constrained"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "all POST/PATCH"
  - priority: 8
    category: business_constraint
    check: "exactly one PRIMARY HouseholdMember per Household (creating a second PRIMARY rejected)"
    error_id: ERR_DUPLICATE_PRIMARY
    http_status: 409
    applies_to: "POST /households/{id}/members"
  - priority: 9
    category: business_referential
    check: "selected HealthPlan.rating_area == Household.rating_area AND HealthPlan.coverage_year == Household.coverage_year"
    error_id: ERR_PLAN_AREA_MISMATCH
    http_status: 409
    applies_to: "POST /enrollments"
  - priority: 10
    category: business_temporal
    check: "for SEP approval, current clock date <= SepRequest.window_close_date (filing window still open)"
    error_id: ERR_SEP_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /sep-requests/{id}/approve"
  - priority: 11
    category: business_referential
    check: "for a SEP-window Application, an APPROVED SepRequest must exist before submit"
    error_id: ERR_SEP_NOT_APPROVED
    http_status: 409
    applies_to: "POST /applications/{id}/submit when enrollment_window == SEP"
  - priority: 12
    category: business_constraint
    check: "EligibilityDetermination requires a single is_slcsp_benchmark SILVER plan in the household's rating_area + coverage_year"
    error_id: ERR_NO_BENCHMARK_PLAN
    http_status: 409
    applies_to: "POST /applications/{id}/determine"
  - priority: 13
    category: business_temporal
    check: "the household has no existing non-TERMINATED Enrollment (lifecycle_status IN {PENDING_EFFECTUATION, ACTIVE}) whose coverage interval [effective_date, end-of-coverage-year] overlaps the new enrollment's coverage interval for the same coverage_year. Coverage intervals are closed on both ends; any shared day collides."
    error_id: ERR_OVERLAPPING_COVERAGE
    http_status: 409
    applies_to: "POST /enrollments"
  - priority: 14
    category: business_fiscal
    check: "Enrollment.elected_aptc_monthly_cents must not exceed determination.max_aptc_monthly_cents"
    error_id: ERR_APTC_EXCEEDS_MAX
    http_status: 409
    applies_to: "POST /enrollments"
  - priority: 15
    category: state
    check: "OCC: request expected_household_version matches current Household.version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /enrollments, POST /applications/{id}/submit"

# ─────────────────────────────────────────────────────────────────────────
# 1.5 API Endpoint Table
# ─────────────────────────────────────────────────────────────────────────
endpoints:
  # ── Household ──
  - method: POST
    path: "/households"
    description: "Create a household shell for the acting Applicant."
    roles: [Applicant, Navigator]
    code: 201
    input: [coverage_year, rating_area]
    output: Household
    side_effects: ["sets applicant_user_id from X-User-ID; computed MAGI fields initialised to 0"]
  - method: GET
    path: "/households/{id}"
    description: "Fetch a household with its computed MAGI/FPL fields."
    roles: [Applicant, Navigator, MarketplaceAdmin]
    code: 200
    input: []
    output: Household
    side_effects: []
  - method: GET
    path: "/households"
    description: "List households (paginated); Applicant sees own, Admin/Navigator see all."
    roles: [Applicant, Navigator, MarketplaceAdmin]
    code: 200
    input: ["applicant_user_id?", "coverage_year?", "limit?", "offset?"]
    output: Household[]
    side_effects: []

  # ── HouseholdMember ──
  - method: POST
    path: "/households/{id}/members"
    description: "Add a member; recomputes household MAGI/FPL/countable_size."
    roles: [Applicant, Navigator]
    code: 201
    input: ["full_name", "relationship", "tax_filing_status", "annual_income_cents?", "applies_for_coverage?"]
    output: HouseholdMember
    side_effects: ["recompute Household.household_magi_cents, countable_size, fpl_percent (calc household_magi, fpl_percent)", "increments Household.version by 1"]
  - method: PATCH
    path: "/households/{id}/members/{member_id}"
    description: "Update a member's income/status; recomputes household MAGI/FPL."
    roles: [Applicant, Navigator]
    code: 200
    input: ["full_name?", "tax_filing_status?", "annual_income_cents?", "applies_for_coverage?"]
    output: HouseholdMember
    side_effects: ["recompute Household.household_magi_cents, countable_size, fpl_percent", "increments Household.version by 1", "increments HouseholdMember.version by 1"]
  - method: GET
    path: "/households/{id}/members"
    description: "List members of a household (reverse-reachability for HouseholdMember.household_id)."
    roles: [Applicant, Navigator, MarketplaceAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: HouseholdMember[]
    side_effects: []

  # ── Application ──
  - method: POST
    path: "/applications"
    description: "Create a DRAFT application for a household."
    roles: [Applicant, Navigator]
    code: 201
    input: [household_id, enrollment_window]
    output: Application
    side_effects: ["status set to DRAFT"]
  - method: GET
    path: "/applications/{id}"
    description: "Fetch an application."
    roles: [Applicant, Navigator, MarketplaceAdmin]
    code: 200
    input: []
    output: Application
    side_effects: []
  - method: GET
    path: "/applications"
    description: "List applications; filter by household_id (reverse-reachability for Application.household_id)."
    roles: [Applicant, Navigator, MarketplaceAdmin]
    code: 200
    input: ["household_id?", "status?", "limit?", "offset?"]
    output: Application[]
    side_effects: []
  - method: POST
    path: "/applications/{id}/submit"
    description: "Submit a DRAFT application (OCC on Household)."
    roles: [Applicant, Navigator]
    code: 200
    input: [expected_household_version]
    output: Application
    side_effects: ["set submitted_at = clock", "set sep_request_id when SEP", "increments Household.version by 1", "increments Application.version by 1"]
  - method: POST
    path: "/applications/{id}/determine"
    description: "Run eligibility determination on a SUBMITTED application; creates EligibilityDetermination."
    roles: [MarketplaceAdmin]
    code: 201
    input: []
    output: EligibilityDetermination
    side_effects: ["create EligibilityDetermination (calc fpl_percent, applicable_percentage, max_aptc, csr_tier)", "Application.status -> DETERMINED", "increments Application.version by 1"]
  - method: POST
    path: "/applications/{id}/reopen"
    description: "Revert a DETERMINED application to DRAFT; deletes its determination (compensation)."
    roles: [Applicant, Navigator]
    code: 200
    input: []
    output: Application
    side_effects: ["delete EligibilityDetermination", "clear submitted_at", "increments Application.version by 1"]
  - method: POST
    path: "/applications/{id}/cancel"
    description: "Cancel a DRAFT or SUBMITTED application."
    roles: [Applicant, Navigator]
    code: 200
    input: []
    output: Application
    side_effects: ["status -> CANCELLED", "increments Application.version by 1"]

  # ── EligibilityDetermination (reverse-reachability) ──
  - method: GET
    path: "/applications/{id}/determination"
    description: "Fetch determinations for an application (reverse-reachability for EligibilityDetermination.application_id); 0 or 1 element."
    roles: [Applicant, Navigator, MarketplaceAdmin]
    code: 200
    input: []
    output: EligibilityDetermination[]
    side_effects: []

  # ── HealthPlan (catalog) ──
  - method: POST
    path: "/health-plans"
    description: "Admin: register a plan in the catalog."
    roles: [MarketplaceAdmin]
    code: 201
    input: ["rating_area", "coverage_year", "metal_tier", "gross_premium_cents", "is_slcsp_benchmark?"]
    output: HealthPlan
    side_effects: ["csr_eligible computed from metal_tier"]
  - method: GET
    path: "/health-plans"
    description: "List/shop plans; filter by rating_area + coverage_year + metal_tier."
    roles: [Applicant, Navigator, MarketplaceAdmin]
    code: 200
    input: ["rating_area?", "coverage_year?", "metal_tier?", "limit?", "offset?"]
    output: HealthPlan[]
    side_effects: []
  - method: GET
    path: "/health-plans/{id}"
    description: "Fetch one plan."
    roles: [Applicant, Navigator, MarketplaceAdmin]
    code: 200
    input: []
    output: HealthPlan
    side_effects: []

  # ── SepRequest ──
  - method: POST
    path: "/sep-requests"
    description: "File a Special Enrollment Period request for a SEP-window application."
    roles: [Applicant, Navigator]
    code: 201
    input: [application_id, qualifying_event_type, event_date]
    output: SepRequest
    side_effects: ["status set to PENDING", "compute window_close_date (calc sep_window)"]
  - method: GET
    path: "/sep-requests/{id}"
    description: "Fetch a SEP request."
    roles: [Applicant, Navigator, MarketplaceAdmin]
    code: 200
    input: []
    output: SepRequest
    side_effects: []
  - method: GET
    path: "/sep-requests"
    description: "List SEP requests; filter by application_id (reverse-reachability for SepRequest.application_id)."
    roles: [Applicant, Navigator, MarketplaceAdmin]
    code: 200
    input: ["application_id?", "status?", "limit?", "offset?"]
    output: SepRequest[]
    side_effects: []
  - method: POST
    path: "/sep-requests/{id}/approve"
    description: "Admin approves a PENDING SEP (window must still be open)."
    roles: [MarketplaceAdmin]
    code: 200
    input: []
    output: SepRequest
    side_effects: ["status -> APPROVED", "increments SepRequest.version by 1"]
  - method: POST
    path: "/sep-requests/{id}/deny"
    description: "Admin denies a PENDING SEP."
    roles: [MarketplaceAdmin]
    code: 200
    input: []
    output: SepRequest
    side_effects: ["status -> DENIED", "increments SepRequest.version by 1"]

  # ── Enrollment ──
  - method: POST
    path: "/enrollments"
    description: "Create an enrollment from a DETERMINED application + selected plan (OCC on Household)."
    roles: [Applicant, Navigator]
    code: 201
    input: ["application_id", "plan_id", "elected_aptc_monthly_cents?", "expected_household_version"]
    output: Enrollment
    side_effects: ["Application.status -> ENROLLED", "increments Application.version by 1", "calc applied_aptc, effective_date, first_month_proration", "lifecycle_status=PENDING_EFFECTUATION, payment_status=AWAITING_BINDER"]
  - method: GET
    path: "/enrollments/{id}"
    description: "Fetch an enrollment with computed premium/effective-date fields."
    roles: [Applicant, Navigator, MarketplaceAdmin]
    code: 200
    input: []
    output: Enrollment
    side_effects: []
  - method: GET
    path: "/enrollments"
    description: "List enrollments; filter by application_id or plan_id (reverse-reachability for Enrollment.application_id and Enrollment.plan_id)."
    roles: [Applicant, Navigator, MarketplaceAdmin]
    code: 200
    input: ["application_id?", "plan_id?", "limit?", "offset?"]
    output: Enrollment[]
    side_effects: []
  - method: POST
    path: "/enrollments/{id}/pay-binder"
    description: "Pay the binder premium (payment dimension: AWAITING_BINDER -> PAID)."
    roles: [Applicant, Navigator]
    code: 200
    input: []
    output: Enrollment
    side_effects: ["payment_status -> PAID", "increments Enrollment.version by 1"]
  - method: POST
    path: "/enrollments/{id}/effectuate"
    description: "Effectuate coverage (lifecycle dimension: PENDING_EFFECTUATION -> ACTIVE; requires PAID)."
    roles: [MarketplaceAdmin]
    code: 200
    input: []
    output: Enrollment
    side_effects: ["lifecycle_status -> ACTIVE", "increments Enrollment.version by 1"]
  - method: POST
    path: "/enrollments/{id}/mark-delinquent"
    description: "Mark binder payment delinquent (payment dimension: PAID -> DELINQUENT)."
    roles: [MarketplaceAdmin]
    code: 200
    input: []
    output: Enrollment
    side_effects: ["payment_status -> DELINQUENT", "increments Enrollment.version by 1"]
  - method: POST
    path: "/enrollments/{id}/terminate"
    description: "Terminate coverage (lifecycle dimension -> TERMINATED)."
    roles: [Applicant, Navigator]
    code: 200
    input: []
    output: Enrollment
    side_effects: ["lifecycle_status -> TERMINATED", "increments Enrollment.version by 1"]

  # ── ReconciliationRecord ──
  - method: POST
    path: "/reconciliations"
    description: "Year-end reconciliation: recompute allowed APTC against realized MAGI and settle."
    roles: [MarketplaceAdmin]
    code: 201
    input: [enrollment_id, actual_annual_magi_cents, months_enrolled]
    output: ReconciliationRecord
    side_effects: ["calc aptc_reconciliation -> advanced_aptc_total_cents, allowed_aptc_total_cents, settlement_cents"]
  - method: GET
    path: "/reconciliations/{id}"
    description: "Fetch a reconciliation record."
    roles: [Applicant, Navigator, MarketplaceAdmin]
    code: 200
    input: []
    output: ReconciliationRecord
    side_effects: []
  - method: GET
    path: "/reconciliations"
    description: "List reconciliation records; filter by enrollment_id (reverse-reachability for ReconciliationRecord.enrollment_id)."
    roles: [Applicant, Navigator, MarketplaceAdmin]
    code: 200
    input: ["enrollment_id?", "limit?", "offset?"]
    output: ReconciliationRecord[]
    side_effects: []

  # ── test-driving clock ──
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint: set the server's current UTC clock (drives submitted_at, SEP window checks, effective dates)."
    roles: [MarketplaceAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["server clock set to to_iso8601 for all subsequent time-dependent computations"]

# ─────────────────────────────────────────────────────────────────────────
# 1.6 Error Code Catalog
# ─────────────────────────────────────────────────────────────────────────
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "missing/invalid X-User-Role or X-User-ID headers"
  - id: ERR_FORBIDDEN
    http: 403
    condition: "acting role not permitted for this operation per RBAC"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "Applicant acting on a household/application/enrollment they do not own"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "path-referenced resource does not exist"
  - id: ERR_REFERENCED_NOT_FOUND
    http: 404
    condition: "FK body field references a non-existent resource"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "requested transition not defined from the resource's current state"
  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "schema violation: missing required field, invalid enum, negative where >=0 required"
  - id: ERR_DUPLICATE_PRIMARY
    http: 409
    condition: "attempt to add a second PRIMARY member to a household"
  - id: ERR_PLAN_AREA_MISMATCH
    http: 409
    condition: "selected plan's rating_area/coverage_year does not match the household's"
  - id: ERR_SEP_WINDOW_CLOSED
    http: 409
    condition: "SEP approval attempted after window_close_date"
  - id: ERR_SEP_NOT_APPROVED
    http: 409
    condition: "SEP-window application submitted without an APPROVED SepRequest"
  - id: ERR_NO_BENCHMARK_PLAN
    http: 409
    condition: "determination run with no is_slcsp_benchmark SILVER plan for the household's rating_area+coverage_year"
  - id: ERR_APTC_EXCEEDS_MAX
    http: 409
    condition: "elected_aptc_monthly_cents exceeds the determination's max_aptc_monthly_cents"
  - id: ERR_OVERLAPPING_COVERAGE
    http: 409
    condition: "household already has a non-TERMINATED enrollment whose coverage interval overlaps the new one for the same coverage_year"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_household_version does not match current Household.version (OCC)"

# ─────────────────────────────────────────────────────────────────────────
# 1.7 RBAC Matrix
# ─────────────────────────────────────────────────────────────────────────
roles:
  - name: Applicant
    description: "Consumer enrolling their own household."
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "POST /households"
      - "POST /households/{id}/members"
      - "PATCH /households/{id}/members/{member_id}"
      - "POST /applications"
      - "POST /applications/{id}/submit"
      - "POST /applications/{id}/reopen"
      - "POST /applications/{id}/cancel"
      - "POST /sep-requests"
      - "POST /enrollments"
      - "POST /enrollments/{id}/pay-binder"
      - "POST /enrollments/{id}/terminate"
      - "all GET reads on own resources"
    note: "applicant_user_id on Household is set to the Applicant's X-User-ID; ownership checks compare X-User-ID to Household.applicant_user_id."
  - name: Navigator
    description: "Certified assister acting on behalf of applicants (full applicant write surface, all reads)."
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "POST /households"
      - "POST /households/{id}/members"
      - "PATCH /households/{id}/members/{member_id}"
      - "POST /applications"
      - "POST /applications/{id}/submit"
      - "POST /applications/{id}/reopen"
      - "POST /applications/{id}/cancel"
      - "POST /sep-requests"
      - "POST /enrollments"
      - "POST /enrollments/{id}/pay-binder"
      - "POST /enrollments/{id}/terminate"
      - "all GET reads"
    note: "Navigator bypasses the applicant_user_id ownership check (assists any household)."
  - name: MarketplaceAdmin
    description: "Marketplace operator: runs determinations, SEP review, effectuation, delinquency, reconciliation, plan catalog, and the test clock."
    identity: "opaque"
    exclusive_operations:
      - "POST /applications/{id}/determine"
      - "POST /sep-requests/{id}/approve"
      - "POST /sep-requests/{id}/deny"
      - "POST /health-plans"
      - "POST /enrollments/{id}/effectuate"
      - "POST /enrollments/{id}/mark-delinquent"
      - "POST /reconciliations"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "all GET reads"
