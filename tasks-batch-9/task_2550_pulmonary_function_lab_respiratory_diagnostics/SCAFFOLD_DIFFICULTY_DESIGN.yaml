    instances:
      - name: device_half_open_window_plus_turnaround_buffer_rejects_overlap_allows_adjacency
        grounds:
          - validations[priority=50]
          - errors[ERR_DEVICE_WINDOW_CONFLICT]
          - entities.TestSession.fields.scheduled_start_at
          - entities.TestSession.fields.scheduled_end_at
        distinguishing_aspect: |
          The device resource uses half-open intervals extended by DEVICE_TURNAROUND_MINUTES 20, so the live
          session 09:00-09:30 occupies [09:00, 09:50): a request for 09:45-10:15 is refused with
          ERR_DEVICE_WINDOW_CONFLICT while 09:50-10:20, which touches the buffered end exactly, is accepted -
