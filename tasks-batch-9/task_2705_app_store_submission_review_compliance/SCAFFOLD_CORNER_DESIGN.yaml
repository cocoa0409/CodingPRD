            - "AppRecord.${app_id}.feature_compliance_index == 100.00"
            - "AppRecord.${app_id}.compliance_posture == OPEN"
      - name: waive_a_safety_category_mapping_returns_waiver_not_permitted
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.FeatureMapping.transitions.FAILED_to_WAIVED_BY_PLATFORM
          - errors.ERR_WAIVER_NOT_PERMITTED
          - entities.GuidelineRule.fields.category
        distinguishing_aspect: "A SAFETY-category guideline can never be waived: the same call that succeeds for a PRIVACY mapping returns 409 ERR_WAIVER_NOT_PERMITTED here, and the index stays 0.00 even though the waiver_reason is 20+ characters."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z. AppRecord Northwind Wallet with ACTIVE cert and profile."
            - "One EFFECTIVE SAFETY rule 1.1.4 (severity_weight 5, remediation_grace_days 14) and one mapping to it in FAILED; index 0.00, posture RESTRICTED."
          setup_api_calls: &CH_MAP_SAFETY_FAILED
            - *c_clock
            - *c_acct
            - *c_cert
            - *c_acct_reread
            - *c_cert_act
            - *c_prof
            - *c_prof_act
            - *c_app
            - &c_rule_safety
              call: "POST /guideline-rules"
              payload: { rule_code: "1.1.4", title: "Objectionable Content", category: "SAFETY", version_label: "2026.08", effective_from: "2026-07-01T00:00:00Z", requires_feature_mapping: true }
              as: PlatformPolicyAdmin
              as_user_id: "ppa-01"
              captures: { srule_id: $.data.id }
            - &c_rule_safety_pub
              call: "POST /guideline-rules/${srule_id}/publish"
              payload: {}
              as: PlatformPolicyAdmin
              as_user_id: "ppa-01"
            - &c_map_safety
              call: "POST /feature-mappings"
              payload: { app_record_id: "${app_id}", guideline_rule_id: "${srule_id}", feature_code: "UGC_REPORTING" }
              as: ComplianceOfficer
              as_user_id: "${acct_id}"
              captures: { smap_id: $.data.id }
            - &c_map_safety_start
              call: "POST /feature-mappings/${smap_id}/self-review"
              payload: { outcome: "START" }
              as: ComplianceOfficer
              as_user_id: "${acct_id}"
            - &c_map_safety_fail
              call: "POST /feature-mappings/${smap_id}/self-review"
              payload: { outcome: "FAIL" }
              as: ComplianceOfficer
              as_user_id: "${acct_id}"
          trigger:
            - call: "POST /feature-mappings/${smap_id}/waive"
              payload: { waiver_reason: "Platform accepted the vendor attestation for this safety control." }
              as: PlatformPolicyAdmin
              as_user_id: "ppa-01"
          assert:
            - "the response status is 409 and error.error_id == ERR_WAIVER_NOT_PERMITTED"
            - "FeatureMapping.${smap_id}.self_review_status == FAILED"
            - "FeatureMapping.${smap_id}.waiver_reason is null"
            - "AppRecord.${app_id}.feature_compliance_index == 0.00"

      - name: activate_a_credential_before_its_not_before_returns_credential_not_yet_valid
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.SigningCredential.transitions.PENDING_ACTIVATION_to_ACTIVE
          - errors.ERR_CREDENTIAL_NOT_YET_VALID
        distinguishing_aspect: "The activation window is half-open not_before <= clock < not_after; a cert with not_before 2026-09-01T00:00:00Z activated at clock 2026-08-01T00:00:00Z is 409 ERR_CREDENTIAL_NOT_YET_VALID and stays PENDING_ACTIVATION."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z. Northwind account ACTIVE at version 1 with one PENDING_ACTIVATION IOS DISTRIBUTION_CERT valid 2026-09-01T00:00:00Z..2027-09-01T00:00:00Z."
          setup_api_calls:
            - *c_clock
            - *c_acct
            - &c_cert_future
              call: "POST /signing-credentials"
              payload: { expected_publisher_account_version: "${acct_v1}", publisher_account_id: "${acct_id}", credential_type: "DISTRIBUTION_CERT", platform: "IOS", key_custody: "HSM", not_before: "2026-09-01T00:00:00Z", not_after: "2027-09-01T00:00:00Z" }
              as: PublisherAdmin
              as_user_id: "${acct_id}"
              captures: { fcert_id: $.data.id }
          trigger:
            - call: "POST /signing-credentials/${fcert_id}/activate"
              payload: {}
              as: PublisherAdmin
              as_user_id: "${acct_id}"
          assert:
            - "the response status is 409 and error.error_id == ERR_CREDENTIAL_NOT_YET_VALID"
            - "SigningCredential.${fcert_id}.status == PENDING_ACTIVATION"

      - name: activate_a_local_keychain_distribution_cert_returns_key_custody_not_permitted
        claim_type: Precondition Enforcement
        grounds:
