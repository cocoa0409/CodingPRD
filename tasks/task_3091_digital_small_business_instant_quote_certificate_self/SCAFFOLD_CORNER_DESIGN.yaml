              as: PlatformAdmin
            - call: "POST /ins/business-accounts"
              payload: { legal_name: "Corner Handy", contact_email: "ch@x.com", channel: "DIRECT" }
              as: Agent
              captures: { ba_ch: $.data.id }
            - call: "POST /ins/quotes"
              payload: { business_account_id: "${ba_ch}", raw_description: "handyman", selected_lines: ["GL"], exposure_units: 10, requested_effective_at: "2026-09-01T00:00:00Z", uw_answers: {} }
              as: Policyholder
              as_user_id: "${ba_ch}"
              captures: { q_ch: $.data.id, q_ch_v: $.data.version }
            - call: "POST /ins/quotes/${q_ch}/bind"
              payload: { expected_quote_version: "${q_ch_v}" }
              as: Policyholder
              as_user_id: "${ba_ch}"
              captures: { p_ch: $.data.id }
            - call: "POST /ins/policies/${p_ch}/cancel"
              payload: {}
              as: Policyholder
              as_user_id: "${ba_ch}"
          trigger:
            - call: "GET /ins/audit-events?entity_type=Policy&entity_id=${p_ch}"
              payload: {}
              as: ComplianceOfficer
          assert:
            - "the audit trail for Policy.${p_ch} contains an entry with action covering the cancel transition"
            - "that entry's actor_role == Policyholder and actor_id == ${ba_ch}"
            - "that entry's before_snapshot.status == ACTIVE and after_snapshot.status == CANCELLED"
