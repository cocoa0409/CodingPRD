              payload: { clinic_id: "${clinic_id}", owner_id: "${owner_id}", pet_name: "Dl", species: "DOG", weight_lbs: 50, service_type: "PRIVATE", pickup_kind: "CLINIC", bill_to: "CLINIC_ACCOUNT" }
              as: CrematoryOperator
              captures: { case_id: $.data.id }
            - call: "POST /cases/${case_id}/transport-legs"
              payload: { origin_kind: "CLINIC", origin_label: "CL-Del", driver_name: "L" }
              as: CrematoryOperator
              captures: { leg_id: $.data.id }
            - call: "PATCH /transport-legs/${leg_id}"
              payload: { status: "EN_ROUTE" }
              as: CrematoryOperator
            - call: "PATCH /transport-legs/${leg_id}"
              payload: { status: "ARRIVED" }
              as: CrematoryOperator
            - call: "POST /cases/${case_id}/receive"
              payload: {}
              as: CrematoryOperator
            - call: "POST /batches"
              payload: { retort_id: "${retort_id}", service_type: "PRIVATE", scheduled_start: "2026-05-19T08:00:00Z", scheduled_end: "2026-05-19T10:00:00Z" }
              as: CrematoryOperator
              captures: { batch_id: $.data.id }
            - call: "POST /batches/${batch_id}/assign-case"
              payload: { case_id: "${case_id}" }
              as: CrematoryOperator
            - call: "POST /batches/${batch_id}/load"
              payload: {}
              as: CrematoryOperator
            - call: "POST /batches/${batch_id}/fire"
              payload: {}
              as: CrematoryOperator
            - call: "POST /batches/${batch_id}/complete"
              payload: {}
              as: CrematoryOperator
            - call: "GET /cases/${case_id}"
              payload: {}
              as: CrematoryAdmin
              captures: { case_v: $.data.version }
          trigger:
            - call: "POST /cases/${case_id}/invoices"
              payload: { expected_case_version: "${case_v}" }
              as: CrematoryAdmin
              captures: { inv_id: $.data.id }
          assert:
            - "Clinic.${clinic_id}.outstanding_balance_cents == 18000"
            - "Clinic.${clinic_id}.account_status == CURRENT"

      - name: scheduled_clock_default_before_set
        claim_type: scheduled_actions
        grounds:
          - "endpoints"
          - "entities.CustodyEvent.fields.occurred_at"
        distinguishing_aspect: "Before any /_clock/set_current_utc call, the logical clock reads the startup default 2026-01-01T00:00:00Z; a case's INTAKE custody event is stamped with that default."
        test_recipe:
          setup: ["Fresh server; clock never set; create a case."]
          setup_api_calls:
            - call: "POST /petowners"
              payload: { full_name: "Owner Clk", email: "ownerclk@x.com", phone: "555-0128" }
              as: CrematoryOperator
              captures: { owner_id: $.data.id }
            - call: "POST /cases"
              payload: { owner_id: "${owner_id}", pet_name: "Clk", species: "DOG", weight_lbs: 40, service_type: "PRIVATE", pickup_kind: "HOME", bill_to: "OWNER" }
              as: CrematoryOperator
              captures: { case_id: $.data.id }
          trigger:
            - call: "GET /cases/${case_id}/custody-events"
              payload: {}
              as: CrematoryOperator
              captures: { ev_at: "$.data[0].occurred_at" }
          assert:
            - "ev_at == 2026-01-01T00:00:00.000Z"

