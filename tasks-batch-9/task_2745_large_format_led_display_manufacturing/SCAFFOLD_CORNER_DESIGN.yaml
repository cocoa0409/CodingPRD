            - "trigger call 2 -> 201: DisplayProject.${pj}.required_data_mbps == 2, effective_capacity_mbps == 2, data_load_pct == 100.00"
            - "no DisplayProject row exists for customer_name 'Starved Link Wall'"

      - name: spare_percentage_below_the_tier_minimum_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=54]
          - errors.ERR_SPARE_PCT_BELOW_MINIMUM
          - calculations.service_contract_spare_requirement
        distinguishing_aspect: |
          TIER_MIN_SPARE_PCT_BP is a per-tier floor (BRONZE 100, SILVER 200, GOLD
          300), so the SAME 299 basis points that a SILVER contract may sell is
          refused for GOLD, and GOLD's exact minimum of 300 is accepted. The check
          therefore has to select the constant by tier rather than compare against
          a single global floor.
