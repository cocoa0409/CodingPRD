            - call: "POST /licensure/evaluators"
              payload: { full_name: "Nadia Petrov", profession_code: "RN", status: "ACTIVE", max_concurrent_reviews: 2 }
              as: AgencyAdmin
              as_user_id: "adm_1"
              captures: { evr1: $.data.id, evr1_v0: $.data.version }
            - call: "POST /licensure/evaluators"
              payload: { full_name: "Owen Marsh", profession_code: "RN", status: "ACTIVE", max_concurrent_reviews: 2 }
