            - "between the two trigger calls YardSlot.${slot_id}.occupied_weight_lb == 48200, stacked_count == 1 and status == PARTIAL, and Piece.${pc1_id}.production_status == YARDED"
            - "YardSlot.${slot_id}.occupied_weight_lb == 0 (exactly the pre-placement baseline)"
            - "YardSlot.${slot_id}.stacked_count == 0"
            - "YardSlot.${slot_id}.status == EMPTY"
            - "YardPlacement.${place_id}.status == RELEASED and release_reason == RESTACK and released_at == 2026-08-03T06:00:00.000Z"
            - "Piece.${pc1_id}.production_status == STRIPPED"
            - "Piece.${pc1_id}.qc_status == CLEARED (the QC dimension is untouched by the pull)"

      - name: project_held_piece_count_returns_to_baseline_after_reinstate
