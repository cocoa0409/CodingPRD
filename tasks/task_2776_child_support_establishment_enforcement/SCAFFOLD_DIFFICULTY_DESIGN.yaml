  # =====================================================================
  # RULE 4 — transitive_cascade
  # Differentiation: instance 1 is a depth-3 chain fired by an order vacatur;
  # instance 2 is a depth-2 chain fired by a compromise acceptance — different
  # triggers, different terminal entities.
  # =====================================================================
  - rule_id: transitive_cascade
    instances:

      - name: order_vacatur_three_level_cascade_to_employer_counter
        grounds:
          - state_machines.SupportOrder.status.ENTERED_to_VACATED
          - state_machines.ObligationCharge.status.OPEN_to_VOID
          - state_machines.IncomeWithholdingOrder.service_status.SERVED_to_TERMINATED
          - entities.SupportCase.fields.unapplied_credit_cents
          - entities.SupportCase.fields.total_charged_principal_cents
          - entities.Employer.fields.active_iwo_count
          - entities.IncomeWithholdingOrder.fields.terminated_reason
          - calculations.payment_allocation_waterfall
        distinguishing_aspect: |
          Depth 3 from a single vacatur: level 1 SupportOrder -> VACATED, level 2
          its ObligationCharge -> VOID and its SERVED IncomeWithholdingOrder ->
          TERMINATED (reason ORDER_VACATED), level 3 the already-collected 50000
          reappears as SupportCase.unapplied_credit_cents and
          Employer.active_iwo_count falls from 1 to 0 — two different level-3
          entities reached through two different level-2 entities.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z."
            - "DIRECT_APPLICATION MN case, child_count 2, tanf_assistance false; CP income 200000, NCP income 300000, both VERIFIED_WAGE_RECORD; NCP LOCATED."
            - "PRESUMED_MARITAL paternity; one CURRENT_SUPPORT MN order effective 2026-08-01 ENTERED at 75000."
            - "One OPEN CURRENT_SUPPORT charge of 75000 (period 2026-08-01/2026-09-01, due 2026-08-15)."
            - "A DIRECT_PAY payment of 50000 posted, so the charge carries paid_cents 50000 / unpaid_balance_cents 25000 and the case shows arrears_principal_cents 25000, total_charged_principal_cents 75000, total_collected_principal_cents 50000, unapplied_credit_cents 0."
            - "One MN employer (remittance_fee_cents 0) holds an IWO issued at reported_disposable_income_cents 234000 and SERVED, so Employer.active_iwo_count is 1."
          setup_api_calls:
            - call: "POST /child-support/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /child-support/participants"
              payload: { role_type: "CUSTODIAL_PARTY", full_name: "Xena Pike", ssn_last4: "1212", residence_state_code: "MN", monthly_gross_income_cents: 200000, income_verification_source: "VERIFIED_WAGE_RECORD" }
              as: CaseWorker
              captures: { cp_id: $.data.id }
            - call: "POST /child-support/participants"
              payload: { role_type: "NONCUSTODIAL_PARTY", full_name: "Yusuf Pike", ssn_last4: "1313", residence_state_code: "MN", monthly_gross_income_cents: 300000, income_verification_source: "VERIFIED_WAGE_RECORD", supports_second_family: false, has_valid_drivers_license: true }
              as: CaseWorker
              captures: { ncp_id: $.data.id }
            - call: "POST /child-support/participants/${ncp_id}/locate-results"
              payload: { locate_outcome: "LOCATED" }
              as: CaseWorker
            - call: "POST /child-support/cases"
              payload: { case_type: "DIRECT_APPLICATION", custodial_party_id: "${cp_id}", noncustodial_party_id: "${ncp_id}", child_count: 2, tanf_assistance: false, good_cause_claim: false }
              as: CaseWorker
              captures: { case_id: $.data.id }
            - call: "POST /child-support/cases/${case_id}/paternity-actions"
              payload: { method: "PRESUMED_MARITAL" }
              as: CaseWorker
            - call: "POST /child-support/cases/${case_id}/orders"
              payload: { order_type: "CURRENT_SUPPORT", origin_state_code: "MN", effective_date: "2026-08-01" }
              as: CaseWorker
              captures: { order_id: $.data.id }
            - call: "POST /child-support/orders/${order_id}/guideline-calculation"
              payload: {}
              as: CaseWorker
            - call: "POST /child-support/orders/${order_id}/entry"
              payload: {}
              as: SupervisingAttorney
            - call: "POST /child-support/orders/${order_id}/charges"
              payload: { charge_type: "CURRENT_SUPPORT", period_start_date: "2026-08-01", period_end_date: "2026-09-01", due_date: "2026-08-15" }
              as: FinanceOfficer
              captures: { ch_id: $.data.id }
            - call: "POST /child-support/cases/${case_id}/payments"
              payload: { source: "DIRECT_PAY", amount_cents: 50000 }
              as: FinanceOfficer
              captures: { pay_ac: $.data.applied_current_cents, pay_ucr: $.data.unapplied_credit_cents }
            - call: "POST /child-support/employers"
              payload: { legal_name: "Duluth Freight Lines", fein: "41-0000004", state_code: "MN", pay_frequency: "MONTHLY", remittance_fee_cents: 0 }
              as: ProgramAdmin
              captures: { emp_id: $.data.id }
            - call: "GET /child-support/orders/${order_id}"
              as: CaseWorker
              captures: { order_v: $.data.version }
            - call: "POST /child-support/orders/${order_id}/withholding-orders"
              payload: { employer_id: "${emp_id}", expected_order_version: "${order_v}", reported_disposable_income_cents: 234000 }
              as: CaseWorker
              captures: { iwo_id: $.data.id, wh: $.data.withholding_amount_cents, fed: $.data.federal_cap_pct, cap: $.data.ccpa_cap_amount_cents }
            - call: "POST /child-support/withholding-orders/${iwo_id}/service"
              payload: {}
              as: CaseWorker
            - call: "GET /child-support/employers/${emp_id}"
              as: CaseWorker
              captures: { cnt_pre: $.data.active_iwo_count }
            - call: "GET /child-support/cases/${case_id}"
              as: FinanceOfficer
              captures: { principal_pre: $.data.arrears_principal_cents, charged_pre: $.data.total_charged_principal_cents, ucr_pre: $.data.unapplied_credit_cents }
          trigger:
            - call: "POST /child-support/orders/${order_id}/vacatur"
              payload: { vacate_reason: "CLERICAL_ERROR" }
              as: SupervisingAttorney
              captures: { o_st: $.data.status, o_term: $.data.terminated_date }
            - call: "GET /child-support/charges/${ch_id}"
              as: FinanceOfficer
              captures: { ch_st: $.data.status }
            - call: "GET /child-support/withholding-orders/${iwo_id}"
              as: CaseWorker
              captures: { iwo_st: $.data.service_status, iwo_reason: $.data.terminated_reason }
            - call: "GET /child-support/employers/${emp_id}"
              as: CaseWorker
              captures: { cnt_post: $.data.active_iwo_count }
            - call: "GET /child-support/cases/${case_id}"
              as: FinanceOfficer
              captures: { principal_post: $.data.arrears_principal_cents, charged_post: $.data.total_charged_principal_cents, ucr_post: $.data.unapplied_credit_cents }
          assert:
            - "${pay_ac} == 50000  # bucket 1, the period containing 2026-08-01"
            - "${pay_ucr} == 0"
            - "${fed} == 0.60  # arrears 25000 < 3 * 75000, so no 12-week bump"
            - "${cap} == 140400  # floor(234000 * 0.60)"
            - "${wh} == 90000  # min(75000 + 0 + 15000, 140400)"
            - "${cnt_pre} == 1"
            - "${principal_pre} == 25000"
            - "${charged_pre} == 75000"
            - "${ucr_pre} == 0"
            - "${o_st} == \"VACATED\"                 # level 1"
            - "${o_term} == \"2026-08-01\""
            - "${ch_st} == \"VOID\"                   # level 2a"
            - "${iwo_st} == \"TERMINATED\"            # level 2b"
            - "${iwo_reason} == \"ORDER_VACATED\""
            - "${ucr_post} == 50000                  # level 3a: the charge's paid_cents returns to unapplied credit"
            - "${cnt_post} == 0                      # level 3b: Employer.active_iwo_count decremented"
            - "${charged_post} == 0"
            - "${principal_post} == 0"

      - name: compromise_acceptance_cascade_releases_license_remedy
        grounds:
          - state_machines.CompromiseOffer.status.PROPOSED_to_ACCEPTED
          - state_machines.SupportCase.enforcement_posture.ESCALATED_to_STAYED
          - state_machines.EnforcementAction.status.ACTIVE_to_RELEASED
