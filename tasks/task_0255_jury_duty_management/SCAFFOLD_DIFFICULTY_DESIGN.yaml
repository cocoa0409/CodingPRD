              payload: { summons_id: "${s1}", expected_panel_version: "${panel_v0}" }
              as: Judge
            - call: "GET /panels/${panel_id}"
              payload: {}
              as: Judge
              captures: { panel_v1: $.data.version }
          trigger:
            - call: "POST /panels/${panel_id}/seat"
              payload: { summons_id: "${s2}", expected_panel_version: "${panel_v1}" }
              as: Judge
              captures: { err: $.data.error_id }
          assert:
            - "Panel auto-SEATED after the first seat (seated_count == 1 == target_size, status SEATED)."
            - "Seating the second summons → 409 (ERR_PANEL_FULL or ERR_INVALID_STATE since panel left FORMING); Panel.seated_count stays 1."
          note: "A 1-seat panel auto-transitions FORMING→SEATED on the first seat, so the second seat is rejected by the state precondition (Panel not FORMING) — the capacity bound is what makes the panel leave FORMING. ERR_PANEL_FULL applies to a still-FORMING over-fill; this case surfaces ERR_INVALID_STATE because the panel is already SEATED."

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: panel_seat_then_excuse_conserves_seated_count
        grounds:
          - state_machines.Summons.REPORTING_to_SERVING
          - state_machines.Summons.SERVING_to_REPORTING
          - entities.Panel.fields.seated_count
        distinguishing_aspect: |
          Conserved quantity = Panel.seated_count. Forward (seat) increments it by 1; the
          compensating action (excuse-from-panel) decrements it by 1, leaving seated_count back
          at its pre-seat value: invariant seated_count == count(PanelAssignment where status==SEATED).
        test_recipe:
          setup:
            - "Term OPEN, Trial READY, a 2-seat FORMING panel with seated_count 0; one REPORTING summons."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-18T08:00:00Z" }
              as: JuryAdministrator
            - call: "POST /service-terms"
              payload: { name: "TM", report_date: "2026-07-01T00:00:00Z", daily_pay_cents: 4000, half_day_pay_cents: 2000, full_day_hours: 6.0, mileage_rate_cents: 25, pay_day_cap: 3 }
              as: JuryAdministrator
              captures: { term_id: $.data.id }
            - call: "POST /service-terms/${term_id}/jurors"
              payload: { full_name: "Quy J", birth_year: 1993, round_trip_miles: 2.0 }
              as: JuryAdministrator
              captures: { juror_id: $.data.id }
            - call: "POST /jurors/${juror_id}/qualify"
              payload: {}
              as: JuryAdministrator
            - call: "POST /service-terms/${term_id}/open"
              payload: {}
              as: JuryAdministrator
              captures: { term_v_open: $.data.version }
            - call: "POST /service-terms/${term_id}/draw"
              payload: { count: 1, expected_service_term_version: "${term_v_open}" }
              as: JuryAdministrator
              captures: { summons_id: "$.data[0].id" }
            - call: "POST /summonses/${summons_id}/qualification"
              payload: { is_citizen: true, is_resident: true, felony_conviction: false, english_proficient: true }
              as: Juror
              as_user_id: "${juror_id}"
            - call: "POST /summonses/${summons_id}/check-in"
              payload: { service_date: "2026-07-18T00:00:00Z", on_floor_hours: 8.0 }
              as: CourtClerk
            - call: "POST /service-terms/${term_id}/trials"
              payload: { caption: "State v. T", required_jurors: 2 }
              as: Judge
              captures: { trial_id: $.data.id }
            - call: "POST /trials/${trial_id}/ready"
              payload: {}
              as: Judge
            - call: "POST /trials/${trial_id}/panels"
              payload: { target_size: 2 }
              as: Judge
              captures: { panel_id: $.data.id, panel_v0: $.data.version }
            - call: "POST /panels/${panel_id}/seat"
              payload: { summons_id: "${summons_id}", expected_panel_version: "${panel_v0}" }
              as: Judge
              captures: { assignment_id: $.data.id }
          trigger:
            - call: "POST /panel-assignments/${assignment_id}/excuse-from-panel"
              payload: {}
              as: Judge
            - call: "GET /panels/${panel_id}"
              payload: {}
              as: Judge
          assert:
            - "After seat: Panel.seated_count == 1. After excuse-from-panel: Panel.seated_count == 0 (back to pre-seat value)."
            - "Summons.status reverts to REPORTING; invariant seated_count == count(SEATED PanelAssignments) == 0 holds."

      - name: defer_conserves_open_summons_obligation
        grounds:
          - state_machines.Summons.QUALIFIED_PENDING_to_DEFERRED
          - entities.Summons.fields.deferral_count
          - entities.ServiceTerm.fields.summoned_count
        distinguishing_aspect: |
          DIFFERENT conserved quantity = the juror's outstanding active-summons obligation
          (one open summons at all times across the deferral). Forward DEFER closes the current
          summons (DEFERRED) and the compensating re-issue opens exactly one fresh SUMMONED summons
          on the next term, so count(active summonses for the juror) stays 1; total summons rows grow
          but the active-obligation count is conserved.
        test_recipe:
          setup:
            - "Term OPEN, juror with one QUALIFIED_PENDING summons; a DRAFT next term as deferral target."
          setup_api_calls:
            - call: "POST /service-terms"
              payload: { name: "TN", report_date: "2026-07-01T00:00:00Z", daily_pay_cents: 4000, half_day_pay_cents: 2000, full_day_hours: 6.0, mileage_rate_cents: 25, pay_day_cap: 3 }
              as: JuryAdministrator
              captures: { term_id: $.data.id }
            - call: "POST /service-terms"
              payload: { name: "TN-next", report_date: "2026-11-01T00:00:00Z", daily_pay_cents: 4000, half_day_pay_cents: 2000, full_day_hours: 6.0, mileage_rate_cents: 25, pay_day_cap: 3 }
              as: JuryAdministrator
              captures: { next_term_id: $.data.id }
            - call: "POST /service-terms/${term_id}/jurors"
              payload: { full_name: "Rue J", birth_year: 1991, round_trip_miles: 2.0 }
              as: JuryAdministrator
              captures: { juror_id: $.data.id }
            - call: "POST /jurors/${juror_id}/qualify"
              payload: {}
              as: JuryAdministrator
            - call: "POST /service-terms/${term_id}/open"
              payload: {}
              as: JuryAdministrator
              captures: { term_v_open: $.data.version }
            - call: "POST /service-terms/${term_id}/draw"
              payload: { count: 1, expected_service_term_version: "${term_v_open}" }
              as: JuryAdministrator
              captures: { summons_id: "$.data[0].id" }
            - call: "POST /summonses/${summons_id}/qualification"
              payload: { is_citizen: true, is_resident: true, felony_conviction: false, english_proficient: true }
              as: Juror
              as_user_id: "${juror_id}"
            - call: "POST /summonses/${summons_id}/dispositions"
              payload: { kind: "DEFER", reason_code: "MEDICAL", requested_term_id: "${next_term_id}" }
              as: Juror
              as_user_id: "${juror_id}"
              captures: { disp_id: $.data.id }
          trigger:
            - call: "POST /dispositions/${disp_id}/decide"
              payload: { decision: "GRANTED" }
              as: JuryAdministrator
            - call: "GET /jurors/${juror_id}/summonses"
              payload: {}
              as: JuryAdministrator
          assert:
            - "Original Summons.status == DEFERRED (no longer an active obligation)."
            - "Exactly one NEW Summons (status SUMMONED) exists on ${next_term_id} for ${juror_id} with deferral_count == 1; active-obligation count for the juror == 1 (conserved)."
