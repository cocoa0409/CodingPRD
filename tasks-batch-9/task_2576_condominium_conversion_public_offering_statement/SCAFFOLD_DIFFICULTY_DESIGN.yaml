          One rofr-response request violates the business_temporal rule at priority 34 (the clock is
          one second past rofr_expires_at) and the business_referential rule at priority 41 (the
          linked unit has been withdrawn, so it is no longer an INCLUDED unit of the project) at the
          same time; both carry HTTP 409, so the assertion can only be satisfied by comparing
          priority numbers - the response must name ERR_ROFR_WINDOW_EXPIRED, not
          ERR_ROFR_UNIT_NOT_LINKED. This is a temporal-vs-referential pair on a tenant endpoint,
          disjoint from the state-vs-fiscal pair on the hardening endpoint.
        test_recipe:
