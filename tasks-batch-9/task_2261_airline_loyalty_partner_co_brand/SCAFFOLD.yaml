    roles: [ProgramAdmin]
    code: 201
    input: ["program_id", "code", "earn_channel", "multiplier_bps", "stacking_mode", "window_start", "window_end", "bonus_cap_miles?"]
    output: PromotionCampaign
    side_effects: ["none — the campaign starts SCHEDULED and only becomes referable once run-epoch makes it LIVE"]

  - method: GET
    path: "/promotion-campaigns"
    description: "List promotion campaigns, filterable by program_id, earn_channel and status."
    roles: [ProgramAdmin, PartnerManager, RevenueAccountant, Member]
    code: 200
    input: ["program_id?", "earn_channel?", "status?", "limit?", "offset?"]
    output: PromotionCampaign[]
    side_effects: ["none"]

  - method: GET
    path: "/promotion-campaigns/{campaignId}"
    description: "Read a promotion campaign including accrued_bonus_miles against its bonus_cap_miles."
    roles: [ProgramAdmin, PartnerManager, RevenueAccountant, Member]
    code: 200
    input: []
    output: PromotionCampaign
    side_effects: ["none"]

  - method: POST
    path: "/promotion-campaigns/{campaignId}/cancel"
    description: "Cancel a SCHEDULED or LIVE campaign. Cancellation does not claw back bonus miles already accrued."
    roles: [ProgramAdmin]
    code: 200
    input: ["reason"]
    output: PromotionCampaign
    side_effects: ["status -> CANCELLED", "cancellation_reason stamped", "increments PromotionCampaign.version by 1"]

  # ---------------- AwardInventoryWindow ----------------------------
  - method: POST
    path: "/award-inventory-windows"
    description: "Authorize award seats for one route+cabin over a closed date interval. Must leave 2 clear days from every other window on the same (program_id, route_code, cabin)."
    roles: [ProgramAdmin]
    code: 201
    input: ["program_id", "route_code", "cabin", "window_start_date", "window_end_date", "authorized_seats", "saver_seat_share_bps?"]
    output: AwardInventoryWindow
    side_effects: ["load_factor_bps 0, demand_multiplier_bps seeded from the empty-window ladder rung, capacity_control_state OPEN"]

  - method: GET
    path: "/award-inventory-windows"
    description: "List award inventory windows, filterable by program_id, route_code, cabin and capacity_control_state."
    roles: [ProgramAdmin, PartnerManager, RevenueAccountant, Member]
    code: 200
    input: ["program_id?", "route_code?", "cabin?", "capacity_control_state?", "limit?", "offset?"]
    output: AwardInventoryWindow[]
    side_effects: ["none"]

  - method: GET
    path: "/award-inventory-windows/{windowId}"
    description: "Read an award inventory window including seats_held, seats_confirmed, saver_seats_consumed, load_factor_bps, demand_multiplier_bps and version."
    roles: [ProgramAdmin, PartnerManager, RevenueAccountant, Member]
    code: 200
    input: []
    output: AwardInventoryWindow
    side_effects: ["none"]

  - method: PATCH
    path: "/award-inventory-windows/{windowId}/capacity-control"
    description: "Manually pin a window's capacity_control_state. Reopening to OPEN requires the load factor to already be below the constrained rung."
    roles: [ProgramAdmin]
    code: 200
    input: ["capacity_control_state"]
    output: AwardInventoryWindow
    side_effects: ["capacity_control_state set", "increments AwardInventoryWindow.version by 1"]

  # ---------------- AwardBooking ------------------------------------
  - method: POST
    path: "/award-bookings"
    description: "Hold award seats. Runs award_dynamic_pricing in its seven pinned steps against the window's pre-booking load factor. Requires the window's current version."
    roles: [Member, ProgramAdmin]
    code: 201
    input: ["member_id", "window_id", "travel_date", "seats", "fare_class", "expected_window_version", "partner_airline_id?"]
    output: AwardBooking
    side_effects:
      - "quoted_miles, cash_surcharge_cents, surcharge_band, all three applied bps fields and partner_settlement_cents stamped"
      - "AwardInventoryWindow.seats_held += seats; saver_seats_consumed += seats for SAVER"
      - "AwardInventoryWindow.load_factor_bps, demand_multiplier_bps and capacity_control_state recomputed"
      - "hold_expires_at = clock now + 72h"
      - "increments AwardInventoryWindow.version by 1"

  - method: GET
    path: "/award-bookings"
    description: "List award bookings, filterable by member_id, window_id, partner_airline_id and status."
    roles: [ProgramAdmin, RevenueAccountant, FraudAnalyst, Member]
    code: 200
    input: ["member_id?", "window_id?", "partner_airline_id?", "status?", "limit?", "offset?"]
    output: AwardBooking[]
    side_effects: ["none"]

  - method: GET
    path: "/award-bookings/{bookingId}"
    description: "Read an award booking including quoted_miles, hold_expires_at, partner_settled and status."
    roles: [ProgramAdmin, RevenueAccountant, FraudAnalyst, Member]
    code: 200
    input: []
    output: AwardBooking
    side_effects: ["none"]

  - method: POST
    path: "/award-bookings/{bookingId}/ticket"
    description: "Ticket a live hold: debits the member's miles via a REDEEM ledger row and converts held seats to confirmed."
    roles: [Member, ProgramAdmin]
    code: 200
    input: []
    output: AwardBooking
    side_effects:
      - "status HELD -> TICKETED"
      - "a REDEEM MileTransaction of -quoted_miles is inserted"
      - "MemberAccount.mile_balance -= quoted_miles; LoyaltyProgram.outstanding_miles -= quoted_miles"
      - "AwardInventoryWindow.seats_held -= seats; seats_confirmed += seats; posture recomputed"
      - "increments AwardBooking.version by 1 and AwardInventoryWindow.version by 1"

  - method: POST
    path: "/award-bookings/{bookingId}/cancel"
    description: "Cancel a hold before ticketing, releasing the seats."
    roles: [Member, ProgramAdmin]
    code: 200
    input: []
    output: AwardBooking
    side_effects:
      - "status HELD -> CANCELLED"
      - "AwardInventoryWindow.seats_held -= seats; saver_seats_consumed -= seats for SAVER; posture recomputed"
      - "increments AwardBooking.version by 1 and AwardInventoryWindow.version by 1"

  - method: POST
    path: "/award-bookings/{bookingId}/refund"
    description: "Refund a ticketed, unsettled booking. Compensating transition: inserts a REVERSAL ledger row that restores the exact quoted_miles and releases the confirmed seats."
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: AwardBooking
    side_effects:
      - "status TICKETED -> REFUNDED"
      - "a REVERSAL MileTransaction of +quoted_miles pointing at the REDEEM row is inserted"
      - "MemberAccount.mile_balance += quoted_miles; LoyaltyProgram.outstanding_miles += quoted_miles"
      - "AwardInventoryWindow.seats_confirmed -= seats; saver_seats_consumed -= seats for SAVER; posture recomputed"
      - "increments AwardBooking.version by 1 and AwardInventoryWindow.version by 1"

