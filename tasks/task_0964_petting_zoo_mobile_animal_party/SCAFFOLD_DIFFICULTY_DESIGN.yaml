            - { call: "POST /petting-zoo/bookings/${bk_b}/quote", payload: {}, as: Coordinator }
            - { call: "POST /petting-zoo/bookings/${bk_b}/payments", payload: { amount_cents: 5322, method: "CARD" }, as: Customer, as_user_id: "${c12}" }
          trigger:
