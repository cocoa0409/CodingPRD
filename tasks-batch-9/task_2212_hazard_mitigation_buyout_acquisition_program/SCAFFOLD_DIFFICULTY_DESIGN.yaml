          - state_machines.Parcel.acquisition_status
          - entities.Parcel.fields.participation_status
          - entities.Parcel.fields.acquisition_status
          - validations.priority_51
        distinguishing_aspect: |
          Parallel-region machine: the acquisition dimension reaches VALUE_ESTABLISHED while the
          participation dimension is still only INTERESTED, and the later CONFIRM_VOLUNTARY moves
          participation to VOLUNTARY_CONFIRMED WITHOUT touching acquisition_status. A single-status
          implementation cannot represent the intermediate pair (INTERESTED, VALUE_ESTABLISHED) at
          all.
        test_recipe:
          setup:
            - "One APPROVED MitigationProject with one OWNER_OCCUPIED parcel whose pre_event_fmv_cents is 20000000."
            - "The parcel's participation_status is INTERESTED and has never been CONFIRM_VOLUNTARY."
