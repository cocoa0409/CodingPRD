          assert:
            - "first open: response status is 409 and $.data.error_id == ERR_BLOCK_NOT_CLEARED"
            - "after the refused open: HarvestWindow.${win}.status == CONFIRMED and Crew.${crew}.status == CERTIFIED"
            - "after the water sample: Block.${blk}.water_sample_count == 1 and Block.${blk}.water_status == PROVISIONAL and Block.${blk}.food_safety_posture == CLEARED"
            - "second open: response status is 200 and HarvestWindow.${win}.status == OPEN"
            - "Crew.${crew}.status == ACTIVE"
            - "HarvestWindow.${win}.required_picker_count == 1 and HarvestWindow.${win}.effective_pick_rate_lbs_per_hour == 22.00 (unchanged across both attempts)"

      - name: allocation_ship_requires_lot_cold_chain_cooled
        grounds:
          - state_machines.LotAllocation.RESERVED_to_SHIPPED
          - state_machines.FruitLot.COOLING_to_COOLED
          - validations[priority=35]
          - errors[ERR_INVALID_COLD_CHAIN_STATE]
        distinguishing_aspect: |
          A different dependent/dependency pair from the window/block instance:
          the LotAllocation transition RESERVED -> SHIPPED is gated on
          FruitLot.cold_chain_status, so shipping a line drawn on a lot still
          COOLING answers ERR_INVALID_COLD_CHAIN_STATE (409) and leaves
          BuyerCommitment.shipped_lbs at 0.00, while the same ship succeeds the
          moment the lot reaches COOLED.
        test_recipe:
          setup:
            - "One STRAWBERRY block with three passing water samples (40, 50, 60 MPN) so water_status is COMPLIANT."
            - "One crew, one PLANNED window spanning 2026-08-03, one tunnel with slot_capacity 4."
            - "One grade-A lot of 80 clamshells at 1.00 lb pushed into the tunnel, so cold_chain_status is COOLING."
            - "One OPEN buyer commitment for 80.00 lbs at 450 cents/lb, guarantee 3 days, delivery window 2026-08-01..2026-08-10, with a RESERVED 80.00 lb allocation line."
