  - section: errors
    instances:
      - name: error_budget_exceeded_on_approve
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_BUDGET_EXCEEDED]"
        excluded_because:
          difficulty_instance: boundary_precision_check / budget_gate_accepts_final_equal_to_available_and_locks_at_exactly_one
          rationale: "Asserted as the rejected first approve inside the named §1.8 boundary instance."

      - name: error_claim_window_expired_on_submit
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_CLAIM_WINDOW_EXPIRED]"
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / temporal_claim_window_beats_referential_dedupe_on_submit
          rationale: "Asserted as the winning error of the named §1.8 priority-conflict instance."

      - name: error_duplicate_receipt_serial_on_submit
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_DUPLICATE_RECEIPT_SERIAL]"
        excluded_because:
          difficulty_instance: resource_temporal_overlap / receipt_serial_dedupe_uses_closed_365_day_window
          rationale: "Asserted as the failure path of the named §1.8 dedupe-window instance."

      - name: error_offer_window_overlap_on_create
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_OFFER_WINDOW_OVERLAP]"
        excluded_because:
          difficulty_instance: resource_temporal_overlap / offer_windows_are_half_open_so_touching_is_allowed_and_straddling_is_not
          rationale: "Asserted as the rejected straddling create inside the named §1.8 instance."

      - name: error_offer_window_closed_on_submit
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_OFFER_WINDOW_CLOSED]"
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / claim_submit_depends_on_offer_close_grace_window
          rationale: "Asserted on grace day 16 inside the named §1.8 instance."

      - name: error_claimant_blocked_on_release
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_CLAIMANT_BLOCKED]"
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / payout_release_depends_on_claimant_blocked_state
          rationale: "Asserted as the trigger outcome of the named §1.8 instance."

      - name: error_claim_not_reviewable_on_second_approve
        claim_type: priority_ordering
        grounds:
          - "errors[ERR_CLAIM_NOT_REVIEWABLE]"
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / state_precondition_beats_budget_check_on_second_approve
          rationale: "Asserted as the winning error of the named §1.8 state-versus-fiscal instance."
