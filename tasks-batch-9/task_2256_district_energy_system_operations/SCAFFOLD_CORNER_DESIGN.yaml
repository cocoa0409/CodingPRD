            - "GET /district-energy/work-orders?loop_id=${loop_y1_id} has total_count == 1"
            - "GET /district-energy/metering-points?agreement_id=${cy1_id} has total_count == 1"

      - name: emissions_summary_computed_read_aggregates_every_committed_plan_on_the_loop
        claim_type: Computed read
        grounds:
          - endpoints[GET /district-energy/network-loops/{loop_id}/emissions-summary]
          - calculations.loop_emissions_efficiency_summary
          - state_machines.DispatchPlan.APPROVED_to_COMMITTED
        distinguishing_aspect: "The read aggregates across plans rather than reporting the latest one: two COMMITTED plans on LOOP-W sum to 36.288 MWh and 4736.64 kg, giving an intensity of 141.88 that is 8.12 below the 150.0 target, so contributing_plan_count is 2 and the status flips to COMPLIANT even though each individual plan has the same 92.00 percent efficiency."
