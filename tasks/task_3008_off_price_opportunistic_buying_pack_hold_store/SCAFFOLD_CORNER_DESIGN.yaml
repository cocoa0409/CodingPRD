          - roles.PlanningLead
          - errors.ERR_UNAUTHORIZED
        distinguishing_aspect: "Approval (PlanningLead) and execution (StoreOpsLead) are split on purpose: StoreOpsLead approving its own liquidation order is 403 ERR_UNAUTHORIZED, enforcing the two-party liquidation flow."
