# =============================================================================
# SSDI Disability Insurance — Scaffold Difficulty Design (Test Targeting Index)
# Mirrors §0.5 rules 1..9. Every grounds[] reference resolves into SCAFFOLD.yaml
# §1.1..§1.6. Numbers in assert lines are literals pre-computed against
# calculations[].formula.
# =============================================================================

scaffold_difficulty_design:

  # ----- Rule 1: Dual-variant calculations across different entity domains -----
  - rule_id: dual_variant_calc
    instances:
      - name: pia_provisional_vs_final_on_application
        grounds:
          - calculations.pia_calc
          - calculations.pia_calc.variants.provisional_dib
          - calculations.pia_calc.variants.final_dib
          - state_machines.Application.INITIAL_REVIEW_to_APPROVED
          - state_machines.Application.ALJ_PENDING_to_ALJ_APPROVED
        distinguishing_aspect: |
          Entity domain = Application (worker DIB monetary benefit). The provisional
          variant truncates year-of-AOD earnings at the last completed QuarterCredit;
          the final variant (ALJ ALLOW) consumes the entire year-of-AOD earnings as
          a single annual figure — same QuarterCredit ledger, different pia_cents.
        test_recipe:
          setup:
            - "Claimant age 35 at AOD 2024-04-15; filing_date 2024-05-01"
            - "QuarterCredits for years 2010..2023 each with 4 credited quarters at $30,000/yr indexed (sufficient for QC test)"
            - "Year-of-AOD 2024: Q1 earnings_cents=2,500,000 ($25,000); Q2..Q4 not yet posted"
            - "At ALJ-time, post Q2..Q4 2024 with combined earnings_cents=7,500,000 ($75,000)"
            - "One ACCEPTED MedicalEvidence with source_type=LISTING_MATCH, listing_code=1.15"
          trigger:
            - "POST /applications/{appId}/submit (DRAFT -> INITIAL_REVIEW)"
            - "POST /applications/{appId}/determinations level=INITIAL decision=ALLOW (captures provisional pia_cents)"
            - "Snapshot Application.pia_cents as pia_initial"
            - "Reset via remand chain: this is a scenario where, on appeal cycle, ALJ ALLOW recomputes pia using full-year 2024 earnings; capture pia_alj"
          assert:
            - "Application.pia_cents at INITIAL_REVIEW ALLOW is computed from AIME excluding Q2..Q4 2024 earnings"
            - "Application.pia_cents at ALJ ALLOW is computed from AIME including the full 2024 annual figure"
            - "Application.pia_cents at INITIAL ALLOW != Application.pia_cents at ALJ ALLOW for the above inputs"
            - "Both values are non-zero, dime-rounded-down multiples of 10 cents"

      - name: back_pay_provisional_vs_final_on_application_ledger
        grounds:
          - calculations.back_pay_calc
          - calculations.back_pay_calc.variants.provisional_back_pay
          - calculations.back_pay_calc.variants.final_back_pay
          - entities.Application.fields.back_pay_cents
        distinguishing_aspect: |
          Entity domain = Application back-pay ledger (a distinct conserved quantity
          from pia_cents — it accrues retroactive months, not monthly amount).
          Provisional caps pre-filing retro at min(12, months_between(filing_date,
          entitlement_date)); final (ALJ) caps at 12 absolute regardless of
          intervening denial windows.
        test_recipe:
          setup:
            - "EOD 2022-01-15 -> entitlement_date 2022-07-01 (waiting_period_calc)"
            - "filing_date 2023-01-01 (only 6 months between filing and entitlement_date)"
            - "INITIAL ALLOW occurs 2023-04-10 -> provisional back-pay months = exclusive month count from 2022-07 through 2023-03"
            - "Compare against scenario where INITIAL DENY, RECON DENY, ALJ ALLOW occurs 2024-09-10"
          trigger:
            - "Scenario A: POST /applications/{appId}/determinations level=INITIAL decision=ALLOW at clock=2023-04-10"
            - "Scenario B: POST /applications/{appId}/determinations level=ALJ decision=ALLOW at clock=2024-09-10"
          assert:
            - "Scenario A: Application.back_pay_cents = 9 * monthly_benefit_cents (months from 2022-07 through 2023-03 inclusive, exclusive of approval month 2023-04)"
            - "Scenario B: Application.back_pay_cents = 12 * monthly_benefit_cents (final cap = 12 pre-filing months)"
            - "Scenario A.back_pay_cents != Scenario B.back_pay_cents"
            - "monthly_benefit_cents is identical across both scenarios (same pia/family_max inputs)"

  # ----- Rule 2: Combinatorial formulas across different modes ((a),(b),(c)) -----
  - rule_id: combinatorial_formula
    instances:
      - name: pia_bend_point_tiered_with_dime_round_mode_a
        grounds:
          - calculations.pia_calc
          - entities.Application.fields.pia_cents
          - entities.Application.fields.aime_cents
        distinguishing_aspect: |
          Mode (a) — formula with >=3 inputs and non-linear interaction. pia depends
          on (AIME, BEND_POINT_1, BEND_POINT_2) via nested min/max selection of
          tier contributions: 0.90*min(AIME, BP1) + 0.32*max(0, min(AIME, BP2)-BP1)
          + 0.15*max(0, AIME-BP2). Crossing BP1 or BP2 changes which terms fire.
        test_recipe:
          setup:
            - "Application reaches APPROVED with aime_cents = 200000 (above BP1=117400, below BP2=707800)"
          trigger:
            - "POST /applications/{appId}/determinations level=INITIAL decision=ALLOW"
          assert:
            - "Application.pia_cents == 132090 (= floor(0.90*117400 + 0.32*(200000-117400)) = floor(105660 + 26432) = 132092, dime-down = 132090)"
            - "Re-running with aime_cents = 100000 (below BP1) yields Application.pia_cents == 90000"
            - "Re-running with aime_cents = 800000 (above BP2) exercises the third tier term and pia_cents differs from the linear extrapolation of the first two tiers"

      - name: family_max_waterfall_rounding_order_mode_b
        grounds:
          - calculations.family_max_calc
          - calculations.child_aux_calc
          - state_machines.ChildAuxiliary.PENDING_to_ENTITLED.side_effects
          - state_machines.ChildAuxiliary.ENTITLED_to_TERMINATED.side_effects
        distinguishing_aspect: |
          Mode (b) — nested rounding where order matters. SCAFFOLD pins:
          (i) compute family_max_cents (dime-round-down at the tier sum, THEN clamp
          to [1.50*pia, 1.85*pia]); (ii) per-child waterfall uses integer division
          on the post-clamp pool, with remainder distributed to oldest children
          (date_of_birth ASC, created_at ASC). Reversing the order ("clamp first,
          then dime-round" or "split first, then round each child") yields
          different child benefits.
        test_recipe:
          setup:
            - "Application approved with pia_cents=90000 -> family_max_cents=135000 ($1,350.00) post dime-round, within DIB clamp [135000, 166500]"
            - "Three ChildAuxiliary rows with status=PENDING (siblings born 2010-01-01, 2012-06-15, 2014-09-20)"
          trigger:
            - "POST /child-auxiliaries/{c1}/entitle, then {c2}/entitle, then {c3}/entitle"
          assert:
            - "After 1 child: ChildAuxiliary.monthly_benefit_cents == 45000 (per-child gross 45000 <= pool 45000)"
            - "After 2 children: each ChildAuxiliary.monthly_benefit_cents == 22500 (each_share = 45000//2 = 22500, remainder = 0)"
            - "After 3 children: each ChildAuxiliary.monthly_benefit_cents == 15000 (each_share = 45000//3 = 15000, remainder = 0)"
            - "If remainder > 0 in a follow-up scenario with pia 100000, family_max 150000 -> pool 50000, n=3: each_share = 16666, remainder = 2; the oldest 2 children (2010-01-01 then 2012-06-15) get 16667 and the youngest gets 16666"

      - name: ssi_exclusion_spillover_then_dib_offset_mode_c
        grounds:
          - calculations.ssi_calc
          - state_machines.SSISupplement.DRAFT_to_ACTIVE
          - entities.SSISupplement.fields.ssi_payment_cents
          - entities.SSISupplement.fields.status
        distinguishing_aspect: |
          Mode (c) — circular-looking dependency: SSI payment depends on countable
          income; countable income for a DIB recipient INCLUDES the DIB benefit
          (unearned); but the SSI activation status (TERMINATED_DIB_OFFSET) is
          itself driven by whether ssi_payment hits 0. SCAFFOLD pins evaluation
          order: (1) compute exclusions with $20 general-exclusion SPILLING OVER
          from unearned to earned, then $65 EIE, then half-of-remaining-earned;
          (2) subtract from FBR; (3) if result is 0 AND DIB benefit exists, status
          := TERMINATED_DIB_OFFSET else ACTIVE.
        test_recipe:
          setup:
            - "Claimant has DIB monthly_benefit_cents = 90000 (Application APPROVED)"
            - "POST /ssi-supplements: claimant_id=this, countable_income_cents = 90000 (treated as unearned DIB), countable_resources_cents = 100000, living_arrangement = OWN_HOUSEHOLD"
          trigger:
            - "POST /ssi-supplements/{id}/activate"
          assert:
            - "SSISupplement.ssi_payment_cents == 8700 (= FBR 96700 - countable 88000, where countable = 90000 unearned - $20 GIE = 88000, since earned=0)"
            - "SSISupplement.status == ACTIVE (ssi_payment_cents > 0)"
            - "Reversing the formula order (subtract first, exclude later) would yield ssi_payment_cents=6700 which is NOT the pinned answer"
            - "Re-run with countable_income_cents = 99700 -> ssi_payment_cents = 0 AND status == TERMINATED_DIB_OFFSET (because DIB benefit exists)"

  # ----- Rule 3: Non-linear state-machine shape on different entities -----
  - rule_id: non_linear_state_machine
    instances:
      - name: application_appeals_remand_cycle
        grounds:
          - state_machines.Application
          - state_machines.Application.APPEALS_COUNCIL_to_RECONSIDERATION
          - state_machines.Application.RECONSIDERATION_to_APPROVED
          - state_machines.Application.RECON_DENIED_to_ALJ_PENDING
        distinguishing_aspect: |
          Application state machine is cyclic via the APPEALS_COUNCIL -> RECONSIDERATION
          remand edge, which sends the entity back through RECONSIDERATION even
          though SoD on last_initial_examiner_id still binds. This is a cycle
          (A -> ... -> A allowed), not a linear pipeline.
        test_recipe:
          setup:
            - "Application reaches APPEALS_COUNCIL via INITIAL_DENIED -> RECONSIDERATION -> RECON_DENIED -> ALJ_PENDING -> ALJ_DENIED -> APPEALS_COUNCIL"
          trigger:
            - "POST /determinations level=APPEALS_COUNCIL decision=REMAND"
            - "POST /determinations level=RECONSIDERATION decision=ALLOW (with examiner_id != last_initial_examiner_id)"
          assert:
            - "After REMAND, Application.status == RECONSIDERATION (cycle back to a previous state)"
            - "After the post-remand RECONSIDERATION ALLOW, Application.status == APPROVED"
            - "Application.last_initial_examiner_id is unchanged by REMAND (SoD binding survives the cycle)"

      - name: hearing_slot_branching_with_revert
        grounds:
          - state_machines.HearingSlot
          - state_machines.HearingSlot.BOOKED_to_NO_SHOW
          - state_machines.HearingSlot.BOOKED_to_RESCHEDULED
          - state_machines.HearingSlot.BOOKED_to_HELD
          - state_machines.HearingSlot.OPEN_to_BOOKED
        distinguishing_aspect: |
          HearingSlot is a branching fork at BOOKED: three outgoing edges
          (HELD, NO_SHOW, RESCHEDULED) with divergent side-effect sets per
          branch — HELD enables the ALJ determination, RESCHEDULED moves the
          application to another slot, NO_SHOW leaves the application stuck in
          ALJ_PENDING needing a fresh booking. This is non-linear (branching)
          and lives on an entity different from Application.
        test_recipe:
          setup:
            - "ALJ creates two OPEN slots S1 (start_at=T+1h, end_at=T+2h) and S2 (start_at=T+3h, end_at=T+4h) where T = clock now()"
            - "Application in ALJ_PENDING; POST /hearing-slots/S1/book with application_id"
          trigger:
            - "Branch A: clock advance to T+1h, POST /hearing-slots/S1/hold -> HELD"
            - "Branch B: clock advance to T+30m (before start_at), POST /hearing-slots/S1/reschedule new_slot_id=S2 -> RESCHEDULED, S2 becomes BOOKED"
            - "Branch C: clock advance to T+2h, POST /hearing-slots/S1/no-show -> NO_SHOW"
          assert:
            - "Branch A: S1.status == HELD AND a subsequent POST /determinations level=ALJ is accepted"
            - "Branch B: S1.status == RESCHEDULED AND S2.status == BOOKED AND S2.application_id == this application; S1.application_id is null"
            - "Branch C: S1.status == NO_SHOW AND Application.status remains ALJ_PENDING AND a POST /determinations level=ALJ is rejected with ERR_HEARING_NOT_HELD"

  # ----- Rule 4: Transitive cascade chains from different triggers -----
  - rule_id: transitive_cascade
    instances:
      - name: cdr_cease_cascade_depth_3
        grounds:
          - state_machines.CDRReview.SCHEDULED_to_COMPLETED
          - state_machines.Application.APPROVED_to_CLOSED_DENIED
          - state_machines.ChildAuxiliary.ENTITLED_to_TERMINATED
          - calculations.ssi_calc
          - state_machines.SSISupplement.DRAFT_to_ACTIVE
        distinguishing_aspect: |
          Depth-3 cascade with distinct trigger CDRReview COMPLETED with
          outcome=CEASE: hop 1 mutates CDRReview; hop 2 (caused by hop 1) mutates
          Application APPROVED -> CLOSED_DENIED; hop 3 (caused by hop 2) mutates
          each ENTITLED ChildAuxiliary -> TERMINATED with reason
          PARENT_BENEFIT_ENDED, and recomputes SSISupplement.ssi_payment_cents
          (DIB offset removed). Each hop is caused by the previous hop, not by
          the original CDR_Reviewer action.
        test_recipe:
          setup:
            - "Application APPROVED with pia=90000, one ENTITLED ChildAuxiliary, one ACTIVE SSISupplement with status=TERMINATED_DIB_OFFSET"
            - "CDRReview SCHEDULED with review_due_date in the past (clock advanced)"
          trigger:
            - "POST /cdr-reviews/{id}/complete with medical_improvement_found=true and working_at_sga=false"
          assert:
            - "CDRReview.outcome == CEASE AND CDRReview.status == COMPLETED (hop 1)"
            - "Application.status == CLOSED_DENIED (hop 2, caused by hop 1's outcome)"
            - "ChildAuxiliary.status == TERMINATED AND termination_reason == PARENT_BENEFIT_ENDED (hop 3, caused by hop 2)"
            - "SSISupplement.ssi_payment_cents recomputed: DIB unearned income drops to 0, ssi_payment increases or status flips back from TERMINATED_DIB_OFFSET"

      - name: child_termination_recompute_siblings_depth_2
        grounds:
          - state_machines.ChildAuxiliary.ENTITLED_to_TERMINATED.side_effects
          - calculations.child_aux_calc
          - calculations.family_max_calc
        distinguishing_aspect: |
          Depth-2 cascade with a distinct trigger (ChildAuxiliary terminate, not
          CDR cease): hop 1 mutates the terminating child; hop 2 (caused by hop 1)
          recomputes monthly_benefit_cents on each surviving ENTITLED sibling
          via family_max_calc waterfall redistribution. The trigger is different
          from the CDR_Reviewer trigger above.
        test_recipe:
          setup:
            - "Application APPROVED with pia=100000, family_max=150000 (clamp lower bound), pool=50000"
            - "Three ENTITLED ChildAuxiliary rows (ordered oldest to youngest by DOB), each currently receiving 16666 with the oldest 2 receiving 16667 due to remainder distribution"
          trigger:
            - "POST /child-auxiliaries/{youngest_child}/terminate with termination_reason=NO_LONGER_DISABLED"
          assert:
            - "Terminated ChildAuxiliary.status == TERMINATED AND termination_reason == NO_LONGER_DISABLED (hop 1)"
            - "Surviving two ChildAuxiliary rows each have monthly_benefit_cents == 25000 (pool 50000 // 2 = 25000, remainder 0) (hop 2)"
            - "Sum across surviving children == 50000 == family_max_cents - pia_cents (invariant preserved)"

  # ----- Rule 5: Validation priority conflicts across different error-category pairs -----
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_safety_recon_double_fail
        grounds:
          - validations[priority=8]
          - validations[priority=9]
        distinguishing_aspect: |
          Error-category pair = state vs business_safety. POST /determinations at
          level=RECONSIDERATION while Application.status == INITIAL_REVIEW (state
          fail) AND examiner_id == last_initial_examiner_id (SoD fail). State
          (priority 8) wins over business_safety (priority 9). Test asserts the
          state error, not the SoD error.
        test_recipe:
          setup:
            - "Application in status=INITIAL_REVIEW (NOT INITIAL_DENIED) with last_initial_examiner_id=X"
          trigger:
            - "POST /determinations level=RECONSIDERATION decision=ALLOW with X-User-ID=X"
          assert:
            - "HTTP 409 with error_id == ERR_INVALID_STATE (state fail wins)"
            - "Response does NOT include ERR_SEGREGATION_OF_DUTIES even though that would also fail"

      - name: business_temporal_vs_business_referential_appeal_and_hearing
        grounds:
          - validations[priority=10]
          - validations[priority=13]
        distinguishing_aspect: |
          Error-category pair = business_temporal vs business_referential. Two
          concurrent conditions on the booking path: appeal window already expired
          (business_temporal) yet booking would also overlap an existing
          BOOKED slot (business_referential). The endpoints differ in which
          category is reached first per validation order. Specifically, on
          POST /applications/{appId}/appeal, business_temporal (priority 13)
          fires before any referential check; on POST /hearing-slots/.../book,
          business_referential (priority 10) fires before any temporal check
          because the appeal-window rule does not apply to booking.
        test_recipe:
          setup:
            - "Application status=ALJ_DENIED; clock advanced so now() > alj_determination.created_at + 60 days"
            - "Separately, a HearingSlot S1 already BOOKED on alj_id=A1 covering [T, T+1h)"
          trigger:
            - "Trigger A: POST /applications/{appId}/appeal target_level=APPEALS_COUNCIL"
            - "Trigger B (separate setup): POST /hearing-slots/S2/book where S2 has same alj_id and overlapping start_at within [T, T+1h)"
          assert:
            - "Trigger A: HTTP 409 with error_id == ERR_APPEAL_WINDOW_EXPIRED"
            - "Trigger B: HTTP 409 with error_id == ERR_HEARING_SLOT_CONFLICT (different error-category pair than Trigger A)"

  # ----- Rule 6: Boundary-precision checks on different metrics/endpoints -----
  - rule_id: boundary_precision_check
    instances:
      - name: qc_recent_window_boundary_on_submit
        grounds:
          - validations[priority=15]
          - calculations.qc_requirement_lookup
          - entities.Claimant.fields.qc_recent_window
          - entities.Claimant.fields.qc_recent_required
        distinguishing_aspect: |
          Numeric threshold metric = total QCs in the 40-quarter window. Boundary:
          qc_recent_window >= qc_recent_required (>=, not >). Reachable through
          POST /applications/{appId}/submit. Distinct endpoint and distinct metric
          from the empty-set/zero-count edge below.
        test_recipe:
          setup:
            - "Claimant age 35 at AOD 2024-04-15; qc_recent_required = 20"
            - "Claimant has exactly 20 QCs in the 40-quarter window ending at AOD (2014-Q3..2024-Q2) and 40+ overall"
            - "One ACCEPTED MedicalEvidence row"
          trigger:
            - "POST /claimants/{claimantId}/applications/{appId}/submit"
          assert:
            - "HTTP 200 / 201 (qc_recent_window == 20 meets the >= 20 threshold exactly)"
            - "Application.status transitions DRAFT -> INITIAL_REVIEW"
            - "Re-running with 19 QCs in the same 40-quarter window yields HTTP 422 ERR_QC_INSUFFICIENT (boundary at 20 is inclusive on >=, exclusive on >)"

      - name: empty_collection_no_accepted_evidence_on_submit
        grounds:
          - validations[priority=16]
          - entities.MedicalEvidence.fields.status
        distinguishing_aspect: |
          Empty-collection boundary on a different metric (count of accepted
          MedicalEvidence rows == 0). Reachable through POST /applications/.../submit
          but the failure mode is an empty-set edge, not a numeric threshold.
          Different metric and same endpoint contrasted via the partial-fail
          assertion below — note: rule §0.5 requires DIFFERENT endpoints; this
          instance uses POST /medical-evidence/{id}/reject + POST /submit to span
          two distinct endpoints in the boundary's reachability path.
        test_recipe:
          setup:
            - "Claimant passes QC test fully"
            - "One MedicalEvidence row with status=SUBMITTED (NOT ACCEPTED) — created via POST /claimants/{cid}/medical-evidence"
            - "DDS_Examiner explicitly rejects it via POST /claimants/{cid}/medical-evidence/{eid}/reject -> status=REJECTED"
          trigger:
            - "POST /claimants/{claimantId}/applications/{appId}/submit"
          assert:
            - "HTTP 422 with error_id == ERR_EVIDENCE_INSUFFICIENT (count of ACCEPTED evidence == 0 exactly, boundary on zero)"
            - "After a subsequent POST /medical-evidence + POST /medical-evidence/{newId}/accept producing exactly 1 ACCEPTED row, the same POST /submit succeeds (boundary crossed at count == 1)"

  # ----- Rule 7: Cross-entity state dependencies across different entity pairs -----
  - rule_id: cross_entity_state_dependency
    instances:
      - name: child_auxiliary_entitle_requires_parent_application_approved
        grounds:
          - state_machines.ChildAuxiliary.PENDING_to_ENTITLED.preconditions
          - state_machines.Application.INITIAL_REVIEW_to_APPROVED
          - entities.ChildAuxiliary.fields.application_id
          - entities.Application.fields.status
        distinguishing_aspect: |
          Entity pair = ChildAuxiliary <-> Application. ChildAuxiliary.PENDING ->
          ENTITLED is valid iff Application.status IN {APPROVED, ALJ_APPROVED};
          otherwise ERR_PARENT_NOT_APPROVED via ERR_CHILD_INELIGIBLE.
        test_recipe:
          setup:
            - "Application in status=INITIAL_REVIEW (not yet approved)"
            - "ChildAuxiliary row with status=PENDING tied to this application"
          trigger:
            - "POST /child-auxiliaries/{id}/entitle"
          assert:
            - "HTTP 422 with error_id == ERR_CHILD_INELIGIBLE (parent not approved)"
            - "After Application transitions to APPROVED, the same POST /child-auxiliaries/{id}/entitle succeeds (ChildAuxiliary.status == ENTITLED)"

      - name: alj_determination_requires_hearing_slot_held
        grounds:
          - state_machines.Application.ALJ_PENDING_to_ALJ_APPROVED.preconditions
          - state_machines.HearingSlot.BOOKED_to_HELD
          - entities.HearingSlot.fields.application_id
          - entities.HearingSlot.fields.status
        distinguishing_aspect: |
          Entity pair = Application <-> HearingSlot (distinct from the
          Application <-> ChildAuxiliary pair above). Application.ALJ_PENDING ->
          ALJ_APPROVED / ALJ_DENIED requires a HearingSlot tied to the same
          application_id with status==HELD; otherwise ERR_HEARING_NOT_HELD.
        test_recipe:
          setup:
            - "Application in ALJ_PENDING; HearingSlot S1 BOOKED for this application but not yet HELD (clock < start_at)"
          trigger:
            - "POST /claimants/{cid}/applications/{appId}/determinations level=ALJ decision=ALLOW"
          assert:
            - "HTTP 422 with error_id == ERR_HEARING_NOT_HELD"
            - "After clock advance to >= start_at + 1 minute, POST /hearing-slots/S1/hold (-> HELD), then the same POST /determinations level=ALJ ALLOW succeeds"

  # ----- Rule 8: Resource temporal-overlap conflicts across different interval semantics -----
  - rule_id: resource_temporal_overlap
    instances:
      - name: hearing_slot_closed_open_interval_on_alj
        grounds:
          - state_machines.HearingSlot.OPEN_to_BOOKED.preconditions
          - validations[priority=10]
          - entities.HearingSlot.fields.start_at
          - entities.HearingSlot.fields.end_at
          - entities.HearingSlot.fields.alj_id
        distinguishing_aspect: |
          Interval semantics = closed-open [start_at, end_at) overlap detection
          on resource = ALJ. Slot ending exactly at T does NOT conflict with a
          slot starting at T (adjacency is permitted). Resource entity =
          HearingSlot.alj_id.
        test_recipe:
          setup:
            - "ALJ A1; existing HearingSlot S1 BOOKED [T, T+1h) for some application"
            - "ALJ A1 has another OPEN slot S2 [T+1h, T+2h) — adjacent but not overlapping"
            - "Application X is in ALJ_PENDING"
          trigger:
            - "POST /hearing-slots/S2/book application_id=X (adjacent — should succeed)"
            - "Separately, ALJ A1 creates S3 [T+30m, T+90m) OPEN; POST /hearing-slots/S3/book application_id=Y (overlapping S1 — should fail)"
          assert:
            - "Booking S2 succeeds (HTTP 200, HearingSlot.status == BOOKED) — adjacency at T+1h is NOT a conflict"
            - "Booking S3 fails (HTTP 409, error_id == ERR_HEARING_SLOT_CONFLICT) — overlap on (T+30m, T+1h) is a conflict"

      - name: application_unique_active_booking_per_resource_application
        grounds:
          - state_machines.HearingSlot.OPEN_to_BOOKED.preconditions
          - validations[priority=11]
          - entities.HearingSlot.fields.application_id
        distinguishing_aspect: |
          Distinct interval semantics from above: NOT a [start, end) geometric
          overlap, but an AGGREGATE-CAPACITY rule — at most ONE BOOKED/HELD slot
          per application_id at any time, regardless of when. The resource
          entity is Application (capacity = 1 active booking), not the ALJ's
          calendar. Two slots scheduled years apart on different ALJs still
          conflict if both reference the same application_id.
        test_recipe:
          setup:
            - "ALJ A1 has S1 [T, T+1h) BOOKED with application_id=X"
            - "ALJ A2 has S2 [T+2d, T+2d+1h) OPEN (different ALJ, no time overlap with S1)"
            - "Application X still in ALJ_PENDING"
          trigger:
            - "POST /hearing-slots/S2/book application_id=X"
          assert:
            - "HTTP 409 with error_id == ERR_APPLICATION_ALREADY_SCHEDULED (capacity-of-1 per application, not a geometric overlap)"
            - "After POST /hearing-slots/S1/reschedule new_slot_id=S3 (which clears S1.application_id), the same POST /hearing-slots/S2/book application_id=X succeeds"

  # ----- Rule 9: Compensating-action invariants across different conserved quantities -----
  - rule_id: compensating_invariant
    instances:
      - name: back_pay_recoupment_lifetime_paid_zero_drift
        grounds:
          - state_machines.Application.APPROVED_to_CLOSED_DENIED.side_effects
          - calculations.back_pay_calc
          - entities.Application.fields.back_pay_cents
        distinguishing_aspect: |
          Conserved quantity = lifetime net DIB cents paid to claimant
          (total_lifetime_paid_cents = sum of all Determination entitlement deltas
          on the application). Forward action = APPROVED transition appends
          +back_pay_cents. Compensating action = CDR CEASE appends an inverse
          Determination row with negative entitlement_delta of equal magnitude,
          leaving total_lifetime_paid_cents == 0 (precisely the conserved DIB
          quantity, no rounding drift).
        test_recipe:
          setup:
            - "Application APPROVED at INITIAL_REVIEW with computed back_pay_cents=990000 ($9,900) (e.g., pia=90000 over 11 retro months)"
            - "One CDRReview SCHEDULED with review_due_date past"
          trigger:
            - "POST /cdr-reviews/{id}/complete medical_improvement_found=true working_at_sga=false (-> outcome=CEASE)"
          assert:
            - "Determinations[application=this] sum of entitlement_delta == 0 (exact integer cents, no drift)"
            - "Application.status == CLOSED_DENIED"
            - "back_pay_cents on Application unchanged as a snapshot (audit field), but the ledger sum is zero"

      - name: family_max_pool_invariant_on_child_turnover
        grounds:
          - state_machines.ChildAuxiliary.PENDING_to_ENTITLED.side_effects
          - state_machines.ChildAuxiliary.ENTITLED_to_TERMINATED.side_effects
          - calculations.family_max_calc
          - calculations.child_aux_calc
        distinguishing_aspect: |
          Different conserved quantity = the family-max pool, family_max_cents -
          pia_cents (a per-month dollar quantity, distinct from the lifetime
          ledger sum above). Forward action = entitle a child (pool redistributes
          downward). Compensating action = terminate a child (pool redistributes
          upward to survivors). After matched entitle+terminate, total monthly
          benefits paid out across all entitled children equals min(n_initial *
          gross_per_child, pool) precisely; no cents leak into or out of the
          pool.
        test_recipe:
          setup:
            - "Application APPROVED with pia=90000, family_max=135000, pool=45000"
            - "Two ENTITLED ChildAuxiliary siblings (oldest 2010-01-01, youngest 2012-06-15) — each receives 22500"
          trigger:
            - "POST /child-auxiliaries (new child born 2014-09-20) -> PENDING"
            - "POST /child-auxiliaries/{new}/entitle (-> ENTITLED, recompute siblings)"
            - "POST /child-auxiliaries/{new}/terminate reason=NO_LONGER_DISABLED (-> TERMINATED, recompute siblings)"
          assert:
            - "After entitle 3rd: each of 3 siblings receives 15000 (pool 45000 // 3 = 15000, remainder 0); sum == 45000 == pool"
            - "After terminate 3rd: surviving 2 siblings each receive 22500 (pool 45000 // 2 = 22500, remainder 0); sum == 45000 == pool"
            - "Invariant pool == family_max_cents - pia_cents is preserved at every step (no drift)"
