# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Pet Cremation & Aftercare Provider — breadth probe over SCAFFOLD.yaml §1.1–§1.7
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: entity_case_create_returns_201_with_fields
        claim_type: Creation
        grounds:
          - "entities.Case"
          - "endpoints"
        distinguishing_aspect: "POST /cases with all required fields -> 201; response has custody_status=INTAKE_PENDING, billing_status=NOT_BILLABLE, weight_tier computed, custody_chain_open=true."
        test_recipe:
          setup:
            - "An existing PetOwner."
          setup_api_calls:
            - call: "POST /petowners"
              payload: { full_name: "Owner Cr", email: "ownercr@x.com", phone: "555-0100" }
              as: CrematoryOperator
              captures: { owner_id: $.data.id }
          trigger:
            - call: "POST /cases"
              payload: { owner_id: "${owner_id}", pet_name: "New", species: "DOG", weight_lbs: 40, service_type: "PRIVATE", pickup_kind: "HOME", bill_to: "OWNER" }
              as: CrematoryOperator
              captures: { case_id: $.data.id }
          assert:
            - "Case.${case_id}.custody_status == INTAKE_PENDING"
            - "Case.${case_id}.billing_status == NOT_BILLABLE"
            - "Case.${case_id}.weight_tier == MEDIUM"
            - "Case.${case_id}.custody_chain_open == true"
            - "Case.${case_id}.cremation_charge_cents == 0"

      - name: entity_case_get_not_found
        claim_type: Not Found
        grounds:
          - "entities.Case"
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "GET /cases/{nonexistent} -> ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB except auth."]
          setup_api_calls: []
          trigger:
            - call: "GET /cases/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: CrematoryOperator
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_NOT_FOUND"

      - name: entity_case_missing_required_field
        claim_type: Required Fields
        grounds:
          - "entities.Case.fields.owner_id"
          - "validations[priority=4]"
        distinguishing_aspect: "POST /cases without owner_id -> ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["No prerequisites."]
          setup_api_calls: []
          trigger:
            - call: "POST /cases"
              payload: { pet_name: "X", species: "DOG", weight_lbs: 40, service_type: "PRIVATE", pickup_kind: "HOME", bill_to: "OWNER" }
              as: CrematoryOperator
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST"

      - name: entity_case_invalid_enum_species
        claim_type: Type Constraints
        grounds:
          - "entities.Case.fields.species"
          - "validations[priority=4]"
        distinguishing_aspect: "POST /cases with species=FISH (not in DOG|CAT|OTHER) -> ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["An existing PetOwner."]
          setup_api_calls:
            - call: "POST /petowners"
              payload: { full_name: "Owner En", email: "owneren@x.com", phone: "555-0101" }
              as: CrematoryOperator
              captures: { owner_id: $.data.id }
          trigger:
            - call: "POST /cases"
              payload: { owner_id: "${owner_id}", pet_name: "X", species: "FISH", weight_lbs: 40, service_type: "PRIVATE", pickup_kind: "HOME", bill_to: "OWNER" }
              as: CrematoryOperator
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST"

      - name: entity_case_weight_tier_boundary_25_vs_26
        claim_type: Computed Fields
        grounds:
          - "calculations.weight_tier"
          - "entities.Case.fields.weight_tier"
        distinguishing_aspect: "weight_lbs=25 -> SMALL, weight_lbs=26 -> MEDIUM (inclusive upper bound boundary)."
        test_recipe:
          setup: ["An existing PetOwner."]
          setup_api_calls:
            - call: "POST /petowners"
              payload: { full_name: "Owner Wt", email: "ownerwt@x.com", phone: "555-0102" }
              as: CrematoryOperator
              captures: { owner_id: $.data.id }
          trigger:
            - call: "POST /cases"
              payload: { owner_id: "${owner_id}", pet_name: "S25", species: "CAT", weight_lbs: 25, service_type: "PRIVATE", pickup_kind: "HOME", bill_to: "OWNER" }
              as: CrematoryOperator
              captures: { c25: $.data.id }
            - call: "POST /cases"
              payload: { owner_id: "${owner_id}", pet_name: "M26", species: "DOG", weight_lbs: 26, service_type: "PRIVATE", pickup_kind: "HOME", bill_to: "OWNER" }
              as: CrematoryOperator
              captures: { c26: $.data.id }
          assert:
            - "Case.${c25}.weight_tier == SMALL"
            - "Case.${c26}.weight_tier == MEDIUM"

      - name: entity_clinic_create_system_fields_generated
        claim_type: System Fields
        grounds:
          - "entities.Clinic"
          - "endpoints"
        distinguishing_aspect: "POST /clinics returns server-minted id, created_at, version=1; outstanding_balance_cents=0, account_status=CURRENT."
        test_recipe:
          setup: ["No prerequisites."]
          setup_api_calls: []
          trigger:
            - call: "POST /clinics"
              payload: { name: "CL-Sys", account_code: "SYS-1" }
              as: CrematoryAdmin
              captures: { clinic_id: $.data.id, v: $.data.version }
          assert:
            - "Clinic.${clinic_id}.version == 1"
            - "Clinic.${clinic_id}.outstanding_balance_cents == 0"
            - "Clinic.${clinic_id}.account_status == CURRENT"

      - name: entity_clinic_default_credit_limit_applied
        claim_type: Defaults
        grounds:
          - "entities.Clinic.fields.credit_limit_cents"
        distinguishing_aspect: "Omitting credit_limit_cents on POST /clinics applies default 500000."
        test_recipe:
          setup: ["No prerequisites."]
          setup_api_calls: []
          trigger:
            - call: "POST /clinics"
              payload: { name: "CL-Def", account_code: "DEF-1" }
              as: CrematoryAdmin
              captures: { clinic_id: $.data.id }
          assert:
            - "Clinic.${clinic_id}.credit_limit_cents == 500000"

      - name: entity_case_list_pagination_envelope
        claim_type: Listing
        grounds:
          - "entities.Case"
          - "response_envelope"
        distinguishing_aspect: "GET /cases returns array response_type with total_count and has_more pagination fields."
        test_recipe:
          setup: ["At least one case exists."]
          setup_api_calls:
            - call: "POST /petowners"
              payload: { full_name: "Owner Ls", email: "ownerls@x.com", phone: "555-0103" }
              as: CrematoryOperator
              captures: { owner_id: $.data.id }
            - call: "POST /cases"
              payload: { owner_id: "${owner_id}", pet_name: "Ls", species: "DOG", weight_lbs: 40, service_type: "PRIVATE", pickup_kind: "HOME", bill_to: "OWNER" }
              as: CrematoryOperator
          trigger:
            - call: "GET /cases?limit=10&offset=0"
              payload: {}
              as: CrematoryOperator
          assert:
            - "response_type == array"
            - "meta.total_count >= 1"
            - "meta.has_more == false"

      - name: entity_custodyevent_immutable_no_version
        claim_type: Immutability
        grounds:
          - "entities.CustodyEvent"
        distinguishing_aspect: "CustodyEvent (common_fields:false) is append-only: exposed only via GET /cases/{id}/custody-events, carries no version field and no update endpoint."
        test_recipe:
          setup: ["A case with at least the INTAKE custody event."]
          setup_api_calls:
            - call: "POST /petowners"
              payload: { full_name: "Owner Ce", email: "ownerce@x.com", phone: "555-0104" }
              as: CrematoryOperator
              captures: { owner_id: $.data.id }
            - call: "POST /cases"
              payload: { owner_id: "${owner_id}", pet_name: "Ce", species: "DOG", weight_lbs: 40, service_type: "PRIVATE", pickup_kind: "HOME", bill_to: "OWNER" }
              as: CrematoryOperator
              captures: { case_id: $.data.id }
          trigger:
            - call: "GET /cases/${case_id}/custody-events"
              payload: {}
              as: CrematoryOperator
              captures: { ev_type: "$.data[0].event_type", ev_seq: "$.data[0].seq" }
          assert:
            - "ev_type == INTAKE"
            - "ev_seq == 1"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: sm_receive_from_intake_pending_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - "state_machines.Case.IN_TRANSIT_to_RECEIVED"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "POST /cases/{id}/receive while custody_status==INTAKE_PENDING (no transport leg yet) -> ERR_INVALID_STATE; no state change."
        test_recipe:
          setup: ["A freshly created case (INTAKE_PENDING)."]
          setup_api_calls:
            - call: "POST /petowners"
              payload: { full_name: "Owner Rc", email: "ownerrc@x.com", phone: "555-0105" }
              as: CrematoryOperator
              captures: { owner_id: $.data.id }
            - call: "POST /cases"
              payload: { owner_id: "${owner_id}", pet_name: "Rc", species: "DOG", weight_lbs: 40, service_type: "PRIVATE", pickup_kind: "HOME", bill_to: "OWNER" }
              as: CrematoryOperator
              captures: { case_id: $.data.id }
          trigger:
            - call: "POST /cases/${case_id}/receive"
              payload: {}
              as: CrematoryOperator
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE"
            - "Case.${case_id}.custody_status == INTAKE_PENDING"

      - name: sm_cancel_after_returned_terminal_lockdown
        claim_type: Terminal State Lockdown
        grounds:
          - "state_machines.Case.custody_status"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "POST /cases/{id}/cancel on a RETURNED case (terminal) -> ERR_INVALID_STATE; remains RETURNED."
        test_recipe:
          setup: ["A PRIVATE case driven fully to RETURNED."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: CrematoryAdmin
            - call: "POST /retorts"
              payload: { label: "RT-TL", max_load_lbs: 300 }
              as: CrematoryAdmin
              captures: { retort_id: $.data.id }
            - call: "POST /petowners"
              payload: { full_name: "Owner Tl", email: "ownertl@x.com", phone: "555-0106" }
              as: CrematoryOperator
              captures: { owner_id: $.data.id }
            - call: "POST /cases"
              payload: { owner_id: "${owner_id}", pet_name: "Tl", species: "DOG", weight_lbs: 30, service_type: "PRIVATE", pickup_kind: "HOME", bill_to: "OWNER" }
              as: CrematoryOperator
              captures: { case_id: $.data.id }
            - call: "POST /cases/${case_id}/transport-legs"
              payload: { origin_kind: "HOME", origin_label: "T", driver_name: "T" }
              as: CrematoryOperator
              captures: { leg_id: $.data.id }
            - call: "PATCH /transport-legs/${leg_id}"
              payload: { status: "EN_ROUTE" }
              as: CrematoryOperator
            - call: "PATCH /transport-legs/${leg_id}"
              payload: { status: "ARRIVED" }
              as: CrematoryOperator
            - call: "POST /cases/${case_id}/receive"
              payload: {}
              as: CrematoryOperator
            - call: "POST /batches"
              payload: { retort_id: "${retort_id}", service_type: "PRIVATE", scheduled_start: "2026-05-01T08:00:00Z", scheduled_end: "2026-05-01T10:00:00Z" }
              as: CrematoryOperator
              captures: { batch_id: $.data.id }
            - call: "POST /batches/${batch_id}/assign-case"
              payload: { case_id: "${case_id}" }
              as: CrematoryOperator
            - call: "POST /batches/${batch_id}/load"
              payload: {}
              as: CrematoryOperator
            - call: "POST /batches/${batch_id}/fire"
              payload: {}
              as: CrematoryOperator
            - call: "POST /batches/${batch_id}/complete"
              payload: {}
              as: CrematoryOperator
            - call: "POST /cases/${case_id}/ready-return"
              payload: { return_method: "PICKUP_AT_FACILITY", destination_label: "Front desk" }
              as: CrematoryOperator
            - call: "GET /cases/${case_id}/return-routes"
              payload: {}
              as: CrematoryOperator
              captures: { route_id: "$.data[0].id" }
            - call: "POST /return-routes/${route_id}/dispatch"
              payload: {}
              as: CrematoryOperator
            - call: "POST /cases/${case_id}/finalize-return"
              payload: {}
              as: CrematoryOperator
          trigger:
            - call: "POST /cases/${case_id}/cancel"
              payload: {}
              as: CrematoryOperator
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE"
            - "Case.${case_id}.custody_status == RETURNED"

      - name: sm_load_batch_twice_idempotency_rejected
        claim_type: Idempotency
        grounds:
          - "state_machines.CremationBatch.OPEN_to_LOADED"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "POST /batches/{id}/load twice: second call observes status==LOADED and -> ERR_INVALID_STATE."
        test_recipe:
          setup: ["A batch loaded once (one member assigned)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-02T00:00:00Z" }
              as: CrematoryAdmin
            - call: "POST /retorts"
              payload: { label: "RT-ID", max_load_lbs: 300 }
              as: CrematoryAdmin
              captures: { retort_id: $.data.id }
            - call: "POST /petowners"
              payload: { full_name: "Owner Id", email: "ownerid@x.com", phone: "555-0107" }
              as: CrematoryOperator
              captures: { owner_id: $.data.id }
            - call: "POST /cases"
              payload: { owner_id: "${owner_id}", pet_name: "Id", species: "DOG", weight_lbs: 30, service_type: "PRIVATE", pickup_kind: "HOME", bill_to: "OWNER" }
              as: CrematoryOperator
              captures: { case_id: $.data.id }
            - call: "POST /cases/${case_id}/transport-legs"
              payload: { origin_kind: "HOME", origin_label: "I", driver_name: "T" }
              as: CrematoryOperator
              captures: { leg_id: $.data.id }
            - call: "PATCH /transport-legs/${leg_id}"
              payload: { status: "EN_ROUTE" }
              as: CrematoryOperator
            - call: "PATCH /transport-legs/${leg_id}"
              payload: { status: "ARRIVED" }
              as: CrematoryOperator
            - call: "POST /cases/${case_id}/receive"
              payload: {}
              as: CrematoryOperator
            - call: "POST /batches"
              payload: { retort_id: "${retort_id}", service_type: "PRIVATE", scheduled_start: "2026-05-02T08:00:00Z", scheduled_end: "2026-05-02T10:00:00Z" }
              as: CrematoryOperator
              captures: { batch_id: $.data.id }
            - call: "POST /batches/${batch_id}/assign-case"
              payload: { case_id: "${case_id}" }
              as: CrematoryOperator
            - call: "POST /batches/${batch_id}/load"
              payload: {}
              as: CrematoryOperator
          trigger:
            - call: "POST /batches/${batch_id}/load"
              payload: {}
              as: CrematoryOperator
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE"
            - "CremationBatch.${batch_id}.status == LOADED"

      - name: sm_keepsake_cancel_after_invoice_locked
        claim_type: guarded transitions
        grounds:
          - "state_machines.KeepsakeOrder"
          - "errors[ERR_LINE_ITEM_LOCKED]"
        distinguishing_aspect: "PATCH /keepsake-orders/{id} status=CANCELLED on a case that already has an ISSUED invoice -> ERR_LINE_ITEM_LOCKED; keepsake unchanged."
        test_recipe:
          setup: ["Owner-billed PRIVATE case CREMATED with a PAW_PRINT keepsake, then invoiced."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-03T00:00:00Z" }
              as: CrematoryAdmin
            - call: "POST /retorts"
              payload: { label: "RT-LK", max_load_lbs: 300 }
              as: CrematoryAdmin
              captures: { retort_id: $.data.id }
            - call: "POST /petowners"
              payload: { full_name: "Owner Lk", email: "ownerlk@x.com", phone: "555-0108" }
              as: CrematoryOperator
              captures: { owner_id: $.data.id }
            - call: "POST /cases"
              payload: { owner_id: "${owner_id}", pet_name: "Lk", species: "DOG", weight_lbs: 30, service_type: "PRIVATE", pickup_kind: "HOME", bill_to: "OWNER" }
              as: CrematoryOperator
              captures: { case_id: $.data.id }
            - call: "POST /cases/${case_id}/keepsake-orders"
              payload: { item_type: "PAW_PRINT" }
              as: CrematoryOperator
              captures: { keep_id: $.data.id }
            - call: "POST /cases/${case_id}/transport-legs"
              payload: { origin_kind: "HOME", origin_label: "L", driver_name: "T" }
              as: CrematoryOperator
              captures: { leg_id: $.data.id }
            - call: "PATCH /transport-legs/${leg_id}"
              payload: { status: "EN_ROUTE" }
              as: CrematoryOperator
            - call: "PATCH /transport-legs/${leg_id}"
              payload: { status: "ARRIVED" }
              as: CrematoryOperator
            - call: "POST /cases/${case_id}/receive"
              payload: {}
              as: CrematoryOperator
            - call: "POST /batches"
              payload: { retort_id: "${retort_id}", service_type: "PRIVATE", scheduled_start: "2026-05-03T08:00:00Z", scheduled_end: "2026-05-03T10:00:00Z" }
              as: CrematoryOperator
              captures: { batch_id: $.data.id }
            - call: "POST /batches/${batch_id}/assign-case"
              payload: { case_id: "${case_id}" }
              as: CrematoryOperator
            - call: "POST /batches/${batch_id}/load"
              payload: {}
              as: CrematoryOperator
            - call: "POST /batches/${batch_id}/fire"
              payload: {}
              as: CrematoryOperator
            - call: "POST /batches/${batch_id}/complete"
              payload: {}
              as: CrematoryOperator
            - call: "GET /cases/${case_id}"
              payload: {}
              as: CrematoryAdmin
              captures: { case_v: $.data.version }
            - call: "POST /cases/${case_id}/invoices"
              payload: { expected_case_version: "${case_v}" }
              as: CrematoryAdmin
          trigger:
            - call: "PATCH /keepsake-orders/${keep_id}"
              payload: { status: "CANCELLED" }
              as: CrematoryOperator
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_LINE_ITEM_LOCKED"
            - "KeepsakeOrder.${keep_id}.status == ORDERED"

      - name: sm_initial_state_case_intake_pending
        claim_type: Initial State
        grounds:
          - "state_machines.Case.custody_status"
        distinguishing_aspect: "A newly created Case starts custody_status=INTAKE_PENDING and billing_status=NOT_BILLABLE."
        test_recipe:
          setup: ["An existing PetOwner."]
          setup_api_calls:
            - call: "POST /petowners"
              payload: { full_name: "Owner Is", email: "owneris@x.com", phone: "555-0109" }
              as: CrematoryOperator
              captures: { owner_id: $.data.id }
          trigger:
            - call: "POST /cases"
              payload: { owner_id: "${owner_id}", pet_name: "Is", species: "DOG", weight_lbs: 40, service_type: "PRIVATE", pickup_kind: "HOME", bill_to: "OWNER" }
              as: CrematoryOperator
              captures: { case_id: $.data.id }
          assert:
            - "Case.${case_id}.custody_status == INTAKE_PENDING"
            - "Case.${case_id}.billing_status == NOT_BILLABLE"

      - name: sm_private_batch_second_assign_rejected
        claim_type: Precondition Enforcement
        grounds:
          - "state_machines.Case.RECEIVED_to_STAGED"
          - "errors[ERR_SERVICE_TYPE_MISMATCH]"
        distinguishing_aspect: "Assigning a second PRIVATE case to a PRIVATE batch that already holds one member -> ERR_SERVICE_TYPE_MISMATCH (private holds exactly one)."
        test_recipe:
          setup: ["A PRIVATE batch with one member; a second RECEIVED PRIVATE case."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-04T00:00:00Z" }
              as: CrematoryAdmin
            - call: "POST /retorts"
              payload: { label: "RT-PV2", max_load_lbs: 400 }
              as: CrematoryAdmin
              captures: { retort_id: $.data.id }
            - call: "POST /petowners"
              payload: { full_name: "Owner Pv", email: "ownerpv@x.com", phone: "555-0110" }
              as: CrematoryOperator
              captures: { owner_id: $.data.id }
            - call: "POST /cases"
              payload: { owner_id: "${owner_id}", pet_name: "P1", species: "DOG", weight_lbs: 30, service_type: "PRIVATE", pickup_kind: "HOME", bill_to: "OWNER" }
              as: CrematoryOperator
              captures: { p1: $.data.id }
            - call: "POST /cases/${p1}/transport-legs"
              payload: { origin_kind: "HOME", origin_label: "P1", driver_name: "T" }
              as: CrematoryOperator
              captures: { p1leg: $.data.id }
            - call: "PATCH /transport-legs/${p1leg}"
              payload: { status: "EN_ROUTE" }
              as: CrematoryOperator
            - call: "PATCH /transport-legs/${p1leg}"
              payload: { status: "ARRIVED" }
              as: CrematoryOperator
            - call: "POST /cases/${p1}/receive"
              payload: {}
              as: CrematoryOperator
            - call: "POST /cases"
              payload: { owner_id: "${owner_id}", pet_name: "P2", species: "DOG", weight_lbs: 30, service_type: "PRIVATE", pickup_kind: "HOME", bill_to: "OWNER" }
              as: CrematoryOperator
              captures: { p2: $.data.id }
            - call: "POST /cases/${p2}/transport-legs"
              payload: { origin_kind: "HOME", origin_label: "P2", driver_name: "T" }
              as: CrematoryOperator
              captures: { p2leg: $.data.id }
            - call: "PATCH /transport-legs/${p2leg}"
              payload: { status: "EN_ROUTE" }
              as: CrematoryOperator
            - call: "PATCH /transport-legs/${p2leg}"
              payload: { status: "ARRIVED" }
              as: CrematoryOperator
            - call: "POST /cases/${p2}/receive"
              payload: {}
              as: CrematoryOperator
            - call: "POST /batches"
              payload: { retort_id: "${retort_id}", service_type: "PRIVATE", scheduled_start: "2026-05-04T08:00:00Z", scheduled_end: "2026-05-04T10:00:00Z" }
              as: CrematoryOperator
              captures: { batch_id: $.data.id }
            - call: "POST /batches/${batch_id}/assign-case"
              payload: { case_id: "${p1}" }
              as: CrematoryOperator
          trigger:
            - call: "POST /batches/${batch_id}/assign-case"
              payload: { case_id: "${p2}" }
              as: CrematoryOperator
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_SERVICE_TYPE_MISMATCH"
            - "Case.${p2}.custody_status == RECEIVED"

      - name: sm_communal_reconcile_disposes_members
        claim_type: Side Effect Execution
        grounds:
          - "state_machines.CremationBatch.COMPLETED_to_RECONCILED"
          - "entities.Case.fields.custody_chain_open"
