      - name: cascading_side_effects_covered_by_difficulty
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile
        excluded_because:
          difficulty_instance: model_lock_supersession_cascade
          rationale: "N-level cascade ordering and per-link causation are asserted hop-by-hop in the named §1.8 instance (and in ratify_approve_capex_cascade / snapshot_miss_underperformance_cascade)."

