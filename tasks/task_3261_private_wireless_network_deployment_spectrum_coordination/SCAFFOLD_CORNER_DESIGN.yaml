  # ==========================================================================
  # Section: cross-cutting layers
  # ==========================================================================
  - section: cross_cutting_layers
    instances:
      - name: occ_stale_coordination_request_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[coordination-approval-stale-request], errors[ERR_STALE_REQUEST_VERSION]"]
        distinguishing_aspect: "OCC on SpectrumCoordinationRequest.version at approval."
        test_recipe:
          setup: ["SpectrumCoordinationRequest in COORDINATING at version=3"]
          setup_api_calls:
            - call: "POST /private-wireless/enterprises"
              payload: { legal_name: "OCC2 Co", erp_account_code: "OCC2-001", industry_vertical: "CAMPUS" }
