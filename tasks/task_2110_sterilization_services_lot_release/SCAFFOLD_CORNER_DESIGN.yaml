  - section: validations
    instances:

      - name: corner_missing_auth_headers_returns_unauthenticated
        claim_type: violation_to_error
        grounds:
          - validations[priority=10]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "Priority 10 fires before every other check: a request carrying no X-User-Role and no X-User-ID returns ERR_UNAUTHENTICATED 401 even though the body would also fail schema validation and the path id does not exist."
        test_recipe:
          setup:
            - "Empty database."
            - "The role token NONE in the trigger means the request is sent with neither the X-User-Role nor the X-User-ID header."
          setup_api_calls:
          trigger:
            - call: "GET /sterilization/customers/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: NONE
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_UNAUTHENTICATED with HTTP 401"
            - "response_type == error"
            - "${err} != ERR_CUSTOMER_NOT_FOUND"

