# =============================================================================
# Task 0567 — §1.9 Scaffold Corner Design (breadth probe)
# Enumerates testable claims from §1.1–§1.7 not already covered by §1.8.
# excluded_because stubs cite §1.8 instances by name.
# =============================================================================
scaffold_corner_design:

  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: create_and_read_stay_roundtrip
        claim_type: Creation
        grounds: [entities.Stay, endpoints]
        distinguishing_aspect: "POST /stays with all required fields returns 201 and the same fields on GET; planned_nights computed as 60."
        test_recipe:
          setup: ["RatePlan RP1; one AVAILABLE unit."]
          setup_api_calls:
            - call: "POST /rate-plans"
              payload: { name: "RP1", monthly_rate_cents: 300000, utility_monthly_cents: 15000, cleaning_fee_cents: 12000, occupancy_tax_rate_bps: 1200 }
              as: PropertyManager
              captures: { rp1: $.data.id }
            - call: "POST /units"
              payload: { name: "U1", property_name: "Maple Court", bedrooms: 1 }
              as: PropertyManager
              captures: { u1: $.data.id }
          trigger:
            - call: "POST /stays"
              payload: { unit_id: "${u1}", rate_plan_id: "${rp1}", move_in: "2026-05-01T00:00:00Z", planned_move_out: "2026-06-30T00:00:00Z", deposit_held_cents: 50000 }
              as: PropertyManager
              captures: { s1: $.data.id }
          assert:
            - "GET /stays/${s1} -> data.status == RESERVED"
            - "GET /stays/${s1} -> data.planned_nights == 60"
            - "GET /stays/${s1} -> data.deposit_refundable_cents == 50000"
            - "GET /stays/${s1} -> data.version == 1"

      - name: get_stay_not_found_returns_404
        claim_type: Not Found
        grounds: [entities.Stay, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /stays with a non-existent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /stays/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PropertyManager
              captures: { err: $.data.error_id }
          assert:
            - "trigger response data.error_id == ERR_NOT_FOUND (HTTP 404)"

      - name: error_missing_required_field_on_stay_create
        claim_type: Required Fields
        grounds: [entities.Stay.fields.unit_id, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /stays omitting unit_id returns ERR_VALIDATION (400)."
        test_recipe:
          setup: ["RatePlan RP1 exists."]
          setup_api_calls:
            - call: "POST /rate-plans"
              payload: { name: "RP1", monthly_rate_cents: 300000, utility_monthly_cents: 15000, cleaning_fee_cents: 12000, occupancy_tax_rate_bps: 1200 }
              as: PropertyManager
              captures: { rp1: $.data.id }
          trigger:
            - call: "POST /stays"
              payload: { rate_plan_id: "${rp1}", move_in: "2026-05-01T00:00:00Z", planned_move_out: "2026-06-30T00:00:00Z", deposit_held_cents: 0 }
              as: PropertyManager
              captures: { err: $.data.error_id }
          assert:
            - "trigger response data.error_id == ERR_VALIDATION (HTTP 400)"

      - name: default_visit_type_standard_on_housekeeping
        claim_type: Defaults
        grounds: [entities.HousekeepingVisit.fields.visit_type]
        distinguishing_aspect: "Scheduling a housekeeping visit without visit_type defaults it to STANDARD."
        test_recipe:
          setup: ["RatePlan RP1; unit; retail stay checked in (ACTIVE)."]
          setup_api_calls:
            - call: "POST /rate-plans"
              payload: { name: "RP1", monthly_rate_cents: 300000, utility_monthly_cents: 15000, cleaning_fee_cents: 12000, occupancy_tax_rate_bps: 1200 }
              as: PropertyManager
              captures: { rp1: $.data.id }
            - call: "POST /units"
              payload: { name: "U1", property_name: "Maple Court", bedrooms: 1 }
              as: PropertyManager
              captures: { u1: $.data.id }
            - call: "POST /stays"
              payload: { unit_id: "${u1}", rate_plan_id: "${rp1}", move_in: "2026-05-01T00:00:00Z", planned_move_out: "2026-06-30T00:00:00Z", deposit_held_cents: 0 }
              as: PropertyManager
              captures: { s1: $.data.id }
            - call: "POST /stays/${s1}/check-in"
              payload: {}
              as: PropertyManager
          trigger:
            - call: "POST /housekeeping-visits"
              payload: { stay_id: "${s1}", scheduled_date: "2026-05-15T00:00:00Z" }
              as: PropertyManager
              captures: { hv1: $.data.id }
          assert:
            - "GET /housekeeping-visits/${hv1} -> data.visit_type == STANDARD"
            - "GET /housekeeping-visits/${hv1} -> data.status == SCHEDULED"

      - name: system_field_unit_status_defaults_available
        claim_type: System Fields
        grounds: [entities.Unit.fields.status]
        distinguishing_aspect: "A newly created unit has system status AVAILABLE regardless of input."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /units"
              payload: { name: "U9", property_name: "Cedar", bedrooms: 3 }
              as: PropertyManager
              captures: { u9: $.data.id }
          assert:
            - "GET /units/${u9} -> data.status == AVAILABLE"

      - name: error_invalid_enum_visit_type
        claim_type: Type Constraints
        grounds: [entities.HousekeepingVisit.fields.visit_type, "errors[ERR_INVALID_ENUM]"]
        distinguishing_aspect: "Housekeeping visit_type outside {STANDARD, DEEP} returns ERR_INVALID_ENUM (422)."
        test_recipe:
          setup: ["RatePlan RP1; unit; retail stay checked in (ACTIVE)."]
          setup_api_calls:
            - call: "POST /rate-plans"
              payload: { name: "RP1", monthly_rate_cents: 300000, utility_monthly_cents: 15000, cleaning_fee_cents: 12000, occupancy_tax_rate_bps: 1200 }
              as: PropertyManager
              captures: { rp1: $.data.id }
            - call: "POST /units"
              payload: { name: "U1", property_name: "Maple Court", bedrooms: 1 }
              as: PropertyManager
              captures: { u1: $.data.id }
            - call: "POST /stays"
              payload: { unit_id: "${u1}", rate_plan_id: "${rp1}", move_in: "2026-05-01T00:00:00Z", planned_move_out: "2026-06-30T00:00:00Z", deposit_held_cents: 0 }
              as: PropertyManager
              captures: { s1: $.data.id }
            - call: "POST /stays/${s1}/check-in"
              payload: {}
              as: PropertyManager
          trigger:
            - call: "POST /housekeeping-visits"
              payload: { stay_id: "${s1}", scheduled_date: "2026-05-15T00:00:00Z", visit_type: "SUPERDEEP" }
              as: PropertyManager
              captures: { err: $.data.error_id }
          assert:
            - "trigger response data.error_id == ERR_INVALID_ENUM (HTTP 422)"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: depart_reserved_stay_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.Stay.ACTIVE_to_COMPLETED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Departing a RESERVED (never checked-in) stay returns ERR_INVALID_STATE; no invoice/unit side effects fire."
        test_recipe:
          setup: ["RatePlan RP1; unit; retail stay booked but not checked in (RESERVED)."]
          setup_api_calls:
            - call: "POST /rate-plans"
              payload: { name: "RP1", monthly_rate_cents: 300000, utility_monthly_cents: 15000, cleaning_fee_cents: 12000, occupancy_tax_rate_bps: 1200 }
              as: PropertyManager
              captures: { rp1: $.data.id }
            - call: "POST /units"
              payload: { name: "U1", property_name: "Maple Court", bedrooms: 1 }
              as: PropertyManager
              captures: { u1: $.data.id }
            - call: "POST /stays"
              payload: { unit_id: "${u1}", rate_plan_id: "${rp1}", move_in: "2026-05-01T00:00:00Z", planned_move_out: "2026-06-30T00:00:00Z", deposit_held_cents: 0 }
              as: PropertyManager
              captures: { s1: $.data.id }
          trigger:
            - call: "POST /stays/${s1}/depart"
              payload: { actual_move_out: "2026-05-20T00:00:00Z" }
              as: PropertyManager
              captures: { err: $.data.error_id }
          assert:
            - "trigger response data.error_id == ERR_INVALID_STATE (HTTP 409)"
            - "GET /units/${u1} -> data.status == AVAILABLE (unchanged)"

      - name: activate_already_active_lease_returns_invalid_state
        claim_type: idempotency
        grounds: [state_machines.MasterLease.DRAFT_to_ACTIVE, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Activating an already-ACTIVE master lease a second time returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["Corporate account; master lease created and activated (ACTIVE)."]
          setup_api_calls:
            - call: "POST /corporate-accounts"
              payload: { company_name: "Acme", billing_email: "ap@acme.test" }
              as: PropertyManager
              captures: { ca: $.data.id }
            - call: "POST /master-leases"
              payload: { corporate_account_id: "${ca}", committed_units: 5, negotiated_monthly_rate_cents: 280000, start_date: "2026-05-01T00:00:00Z", end_date: "2027-05-01T00:00:00Z" }
              as: PropertyManager
              captures: { ml: $.data.id }
            - call: "POST /master-leases/${ml}/activate"
              payload: {}
              as: PropertyManager
          trigger:
            - call: "POST /master-leases/${ml}/activate"
              payload: {}
              as: PropertyManager
              captures: { err: $.data.error_id }
          assert:
            - "trigger response data.error_id == ERR_INVALID_STATE (HTTP 409)"

      - name: pay_already_paid_invoice_terminal_lockdown
        claim_type: terminal_state
        grounds: [state_machines.Invoice.ISSUED_to_PAID, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Paying an invoice already in terminal PAID returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["RatePlan RP1; retail stay departed (FINAL invoice ISSUED) then paid (PAID)."]
          setup_api_calls:
            - call: "POST /rate-plans"
              payload: { name: "RP1", monthly_rate_cents: 300000, utility_monthly_cents: 15000, cleaning_fee_cents: 12000, occupancy_tax_rate_bps: 1200 }
              as: PropertyManager
              captures: { rp1: $.data.id }
            - call: "POST /units"
              payload: { name: "U1", property_name: "Maple Court", bedrooms: 1 }
              as: PropertyManager
              captures: { u1: $.data.id }
            - call: "POST /stays"
              payload: { unit_id: "${u1}", rate_plan_id: "${rp1}", move_in: "2026-05-01T00:00:00Z", planned_move_out: "2026-06-30T00:00:00Z", deposit_held_cents: 0 }
              as: PropertyManager
              captures: { s1: $.data.id }
            - call: "POST /stays/${s1}/check-in"
              payload: {}
              as: PropertyManager
            - call: "POST /stays/${s1}/depart"
              payload: { actual_move_out: "2026-06-30T00:00:00Z" }
              as: PropertyManager
            - call: "GET /invoices"
              payload: { stay_id: "${s1}" }
              as: PropertyManager
              captures: { inv1: "$.data[0].id" }
            - call: "POST /invoices/${inv1}/pay"
              payload: {}
              as: PropertyManager
          trigger:
            - call: "POST /invoices/${inv1}/pay"
              payload: {}
              as: PropertyManager
              captures: { err: $.data.error_id }
          assert:
            - "trigger response data.error_id == ERR_INVALID_STATE (HTTP 409)"

      - name: dispute_then_waive_damage_valid_path
        claim_type: valid_transition
        grounds: [state_machines.DamageCharge.ASSESSED_to_DISPUTED, state_machines.DamageCharge.DISPUTED_to_WAIVED]
        distinguishing_aspect: "Employee disputes an ASSESSED damage (DISPUTED); manager waives it (WAIVED); deposit ledger unaffected (never charged)."
        test_recipe:
          setup: ["Corporate stay for employee emp, departed; one 30000 damage ASSESSED against it; deposit 100000."]
          setup_api_calls:
            - call: "POST /corporate-accounts"
              payload: { company_name: "Acme", billing_email: "ap@acme.test" }
              as: PropertyManager
              captures: { ca: $.data.id }
            - call: "POST /rate-plans"
              payload: { name: "RP1", monthly_rate_cents: 300000, utility_monthly_cents: 15000, cleaning_fee_cents: 12000, occupancy_tax_rate_bps: 1200 }
              as: PropertyManager
              captures: { rp1: $.data.id }
            - call: "POST /units"
              payload: { name: "U1", property_name: "Maple Court", bedrooms: 1 }
              as: PropertyManager
              captures: { u1: $.data.id }
            - call: "POST /master-leases"
              payload: { corporate_account_id: "${ca}", committed_units: 5, negotiated_monthly_rate_cents: 280000, start_date: "2026-05-01T00:00:00Z", end_date: "2027-05-01T00:00:00Z" }
              as: PropertyManager
              captures: { ml: $.data.id }
            - call: "POST /master-leases/${ml}/activate"
              payload: {}
              as: PropertyManager
            - call: "POST /employees"
              payload: { corporate_account_id: "${ca}", full_name: "Dana Lee", email: "dana@acme.test" }
              as: CorporateAdmin
              as_user_id: "${ca}"
              captures: { emp: $.data.id }
            - call: "POST /stays"
              payload: { unit_id: "${u1}", rate_plan_id: "${rp1}", move_in: "2026-05-01T00:00:00Z", planned_move_out: "2026-06-30T00:00:00Z", deposit_held_cents: 100000, master_lease_id: "${ml}", employee_id: "${emp}" }
              as: CorporateAdmin
              as_user_id: "${ca}"
              captures: { s1: $.data.id }
            - call: "POST /stays/${s1}/check-in"
              payload: {}
              as: PropertyManager
            - call: "POST /stays/${s1}/depart"
              payload: { actual_move_out: "2026-06-30T00:00:00Z" }
              as: PropertyManager
            - call: "POST /damage-charges"
              payload: { stay_id: "${s1}", amount_cents: 30000, description: "Scuffed floor" }
              as: PropertyManager
              captures: { dc1: $.data.id }
            - call: "POST /damage-charges/${dc1}/dispute"
              payload: {}
              as: Employee
              as_user_id: "${emp}"
          trigger:
            - call: "POST /damage-charges/${dc1}/waive"
              payload: {}
              as: PropertyManager
          assert:
            - "GET /damage-charges/${dc1} -> data.status == WAIVED"
            - "GET /stays/${s1} -> data.deposit_charged_cents == 0"
            - "GET /stays/${s1} -> data.deposit_refundable_cents == 100000"

  # ---------------------------------------------------------------------------
  - section: calculations
    instances:
      - name: provisional_invoice_uses_planned_nights
        claim_type: Correct Result
        grounds: [calculations.invoice_settlement, entities.Invoice.fields.nights_billed]
        distinguishing_aspect: "At check-in the PROVISIONAL invoice bills nights_billed == planned_nights (60), amount_due 642000, occupancy_tax 0 (>=30 exempt)."
        test_recipe:
          setup: ["RatePlan RP1; retail stay planned 60 nights."]
          setup_api_calls:
            - call: "POST /rate-plans"
              payload: { name: "RP1", monthly_rate_cents: 300000, utility_monthly_cents: 15000, cleaning_fee_cents: 12000, occupancy_tax_rate_bps: 1200 }
              as: PropertyManager
              captures: { rp1: $.data.id }
            - call: "POST /units"
              payload: { name: "U1", property_name: "Maple Court", bedrooms: 1 }
              as: PropertyManager
              captures: { u1: $.data.id }
            - call: "POST /stays"
              payload: { unit_id: "${u1}", rate_plan_id: "${rp1}", move_in: "2026-05-01T00:00:00Z", planned_move_out: "2026-06-30T00:00:00Z", deposit_held_cents: 0 }
              as: PropertyManager
              captures: { s1: $.data.id }
          trigger:
            - call: "POST /stays/${s1}/check-in"
              payload: {}
              as: PropertyManager
            - call: "GET /invoices"
              payload: { stay_id: "${s1}" }
              as: PropertyManager
              captures: { inv1: "$.data[0].id" }
          assert:
            - "GET /invoices/${inv1} -> data.invoice_kind == PROVISIONAL"
            - "GET /invoices/${inv1} -> data.nights_billed == 60"
            - "GET /invoices/${inv1} -> data.amount_due_cents == 642000"
            - "GET /invoices/${inv1} -> data.occupancy_tax_cents == 0"

      - name: damage_charge_exceeding_deposit_rejected
        claim_type: Constants Applied
        grounds: ["validations[priority=15]", "errors[ERR_DAMAGE_EXCEEDS_DEPOSIT]"]
        distinguishing_aspect: "Charging a 60000 damage against a stay with only 50000 refundable deposit returns ERR_DAMAGE_EXCEEDS_DEPOSIT (402); no deposit mutation."
        test_recipe:
          setup: ["RatePlan RP1; retail stay deposit 50000, departed; one 60000 damage ASSESSED."]
          setup_api_calls:
            - call: "POST /rate-plans"
              payload: { name: "RP1", monthly_rate_cents: 300000, utility_monthly_cents: 15000, cleaning_fee_cents: 12000, occupancy_tax_rate_bps: 1200 }
              as: PropertyManager
              captures: { rp1: $.data.id }
            - call: "POST /units"
              payload: { name: "U1", property_name: "Maple Court", bedrooms: 1 }
              as: PropertyManager
              captures: { u1: $.data.id }
            - call: "POST /stays"
              payload: { unit_id: "${u1}", rate_plan_id: "${rp1}", move_in: "2026-05-01T00:00:00Z", planned_move_out: "2026-06-30T00:00:00Z", deposit_held_cents: 50000 }
              as: PropertyManager
              captures: { s1: $.data.id }
            - call: "POST /stays/${s1}/check-in"
              payload: {}
              as: PropertyManager
            - call: "POST /stays/${s1}/depart"
              payload: { actual_move_out: "2026-06-30T00:00:00Z" }
              as: PropertyManager
            - call: "POST /damage-charges"
              payload: { stay_id: "${s1}", amount_cents: 60000, description: "Major damage" }
              as: PropertyManager
              captures: { dc1: $.data.id }
          trigger:
            - call: "POST /damage-charges/${dc1}/charge"
              payload: {}
              as: PropertyManager
              captures: { err: $.data.error_id }
          assert:
            - "trigger response data.error_id == ERR_DAMAGE_EXCEEDS_DEPOSIT (HTTP 402)"
            - "GET /stays/${s1} -> data.deposit_charged_cents == 0"

      - name: master_lease_cap_exceeded_on_third_booking
        claim_type: Correct Result
        grounds: [calculations.master_lease_capacity, "validations[priority=14]", "errors[ERR_MASTER_LEASE_CAP_EXCEEDED]"]
        distinguishing_aspect: "With committed_units 2 and two active bookings, a third booking on the lease returns ERR_MASTER_LEASE_CAP_EXCEEDED (402)."
        test_recipe:
          setup: ["Corporate account + employee; master lease committed_units 2 ACTIVE; two stays booked on two units (consumed 2, free 0)."]
          setup_api_calls:
            - call: "POST /corporate-accounts"
              payload: { company_name: "Acme", billing_email: "ap@acme.test" }
              as: PropertyManager
              captures: { ca: $.data.id }
            - call: "POST /rate-plans"
              payload: { name: "RP1", monthly_rate_cents: 300000, utility_monthly_cents: 15000, cleaning_fee_cents: 12000, occupancy_tax_rate_bps: 1200 }
              as: PropertyManager
              captures: { rp1: $.data.id }
            - call: "POST /units"
              payload: { name: "U1", property_name: "Maple Court", bedrooms: 1 }
              as: PropertyManager
              captures: { u1: $.data.id }
            - call: "POST /units"
              payload: { name: "U2", property_name: "Oak Ridge", bedrooms: 1 }
              as: PropertyManager
              captures: { u2: $.data.id }
            - call: "POST /units"
              payload: { name: "U3", property_name: "Pine Row", bedrooms: 1 }
              as: PropertyManager
              captures: { u3: $.data.id }
            - call: "POST /master-leases"
              payload: { corporate_account_id: "${ca}", committed_units: 2, negotiated_monthly_rate_cents: 280000, start_date: "2026-05-01T00:00:00Z", end_date: "2027-05-01T00:00:00Z" }
              as: PropertyManager
              captures: { ml: $.data.id }
            - call: "POST /master-leases/${ml}/activate"
              payload: {}
              as: PropertyManager
            - call: "POST /employees"
              payload: { corporate_account_id: "${ca}", full_name: "Dana Lee", email: "dana@acme.test" }
              as: CorporateAdmin
              as_user_id: "${ca}"
              captures: { emp: $.data.id }
            - call: "POST /stays"
              payload: { unit_id: "${u1}", rate_plan_id: "${rp1}", move_in: "2026-05-01T00:00:00Z", planned_move_out: "2026-06-30T00:00:00Z", deposit_held_cents: 0, master_lease_id: "${ml}", employee_id: "${emp}" }
              as: CorporateAdmin
              as_user_id: "${ca}"
              captures: { s1: $.data.id }
            - call: "POST /stays"
              payload: { unit_id: "${u2}", rate_plan_id: "${rp1}", move_in: "2026-07-05T00:00:00Z", planned_move_out: "2026-09-05T00:00:00Z", deposit_held_cents: 0, master_lease_id: "${ml}", employee_id: "${emp}" }
              as: CorporateAdmin
              as_user_id: "${ca}"
              captures: { s2: $.data.id }
          trigger:
            - call: "POST /stays"
              payload: { unit_id: "${u3}", rate_plan_id: "${rp1}", move_in: "2026-10-01T00:00:00Z", planned_move_out: "2026-12-01T00:00:00Z", deposit_held_cents: 0, master_lease_id: "${ml}", employee_id: "${emp}" }
              as: CorporateAdmin
              as_user_id: "${ca}"
              captures: { err: $.data.error_id }
          assert:
            - "trigger response data.error_id == ERR_MASTER_LEASE_CAP_EXCEEDED (HTTP 402)"
            - "GET /master-leases/${ml} -> data.units_consumed == 2 and data.units_free == 0"

  # ---------------------------------------------------------------------------
  - section: validations
    instances:
      - name: error_invalid_date_range_on_stay_create
        claim_type: Violation to Error
        grounds: ["validations[priority=12]", "errors[ERR_INVALID_DATE_RANGE]"]
        distinguishing_aspect: "POST /stays with planned_move_out <= move_in returns ERR_INVALID_DATE_RANGE (422)."
        test_recipe:
          setup: ["RatePlan RP1; one unit."]
          setup_api_calls:
            - call: "POST /rate-plans"
              payload: { name: "RP1", monthly_rate_cents: 300000, utility_monthly_cents: 15000, cleaning_fee_cents: 12000, occupancy_tax_rate_bps: 1200 }
              as: PropertyManager
              captures: { rp1: $.data.id }
            - call: "POST /units"
              payload: { name: "U1", property_name: "Maple Court", bedrooms: 1 }
              as: PropertyManager
              captures: { u1: $.data.id }
          trigger:
            - call: "POST /stays"
              payload: { unit_id: "${u1}", rate_plan_id: "${rp1}", move_in: "2026-06-30T00:00:00Z", planned_move_out: "2026-05-01T00:00:00Z", deposit_held_cents: 0 }
              as: PropertyManager
              captures: { err: $.data.error_id }
          assert:
            - "trigger response data.error_id == ERR_INVALID_DATE_RANGE (HTTP 422)"

      - name: error_master_lease_not_active_on_corporate_booking
        claim_type: Cross-entity validation
        grounds: ["validations[priority=8]", "errors[ERR_MASTER_LEASE_NOT_ACTIVE]"]
        distinguishing_aspect: "Booking a corporate stay against a DRAFT (never-activated) master lease returns ERR_MASTER_LEASE_NOT_ACTIVE (409)."
        test_recipe:
          setup: ["Corporate account + employee; master lease left in DRAFT (not activated)."]
          setup_api_calls:
            - call: "POST /corporate-accounts"
              payload: { company_name: "Acme", billing_email: "ap@acme.test" }
              as: PropertyManager
              captures: { ca: $.data.id }
            - call: "POST /rate-plans"
              payload: { name: "RP1", monthly_rate_cents: 300000, utility_monthly_cents: 15000, cleaning_fee_cents: 12000, occupancy_tax_rate_bps: 1200 }
              as: PropertyManager
              captures: { rp1: $.data.id }
            - call: "POST /units"
              payload: { name: "U1", property_name: "Maple Court", bedrooms: 1 }
              as: PropertyManager
              captures: { u1: $.data.id }
            - call: "POST /master-leases"
              payload: { corporate_account_id: "${ca}", committed_units: 5, negotiated_monthly_rate_cents: 280000, start_date: "2026-05-01T00:00:00Z", end_date: "2027-05-01T00:00:00Z" }
              as: PropertyManager
              captures: { ml: $.data.id }
            - call: "POST /employees"
              payload: { corporate_account_id: "${ca}", full_name: "Dana Lee", email: "dana@acme.test" }
              as: CorporateAdmin
              as_user_id: "${ca}"
              captures: { emp: $.data.id }
          trigger:
            - call: "POST /stays"
              payload: { unit_id: "${u1}", rate_plan_id: "${rp1}", move_in: "2026-05-01T00:00:00Z", planned_move_out: "2026-06-30T00:00:00Z", deposit_held_cents: 0, master_lease_id: "${ml}", employee_id: "${emp}" }
              as: CorporateAdmin
              as_user_id: "${ca}"
              captures: { err: $.data.error_id }
          assert:
            - "trigger response data.error_id == ERR_MASTER_LEASE_NOT_ACTIVE (HTTP 409)"

      - name: error_pagination_invalid_limit_on_list
        claim_type: Violation to Error
        grounds: ["validations[priority=5]", "errors[ERR_PAGINATION_INVALID]"]
        distinguishing_aspect: "GET /stays with limit 0 (below min 1) returns ERR_PAGINATION_INVALID (400)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /stays"
              payload: { limit: 0 }
              as: PropertyManager
              captures: { err: $.data.error_id }
          assert:
            - "trigger response data.error_id == ERR_PAGINATION_INVALID (HTTP 400)"

  # ---------------------------------------------------------------------------
  - section: rbac
    instances:
      - name: error_unauthenticated_missing_headers_on_create_unit
        claim_type: auth
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "POST /units with no X-User-Role/X-User-ID headers returns ERR_UNAUTHENTICATED (401)."
        test_recipe:
          setup: ["Empty DB. Trigger sent without auth headers."]
          setup_api_calls: []
