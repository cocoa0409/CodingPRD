  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      # --- optimistic_concurrency: stale-version on reservation create ---
      - name: reservation_create_stale_window_version_412
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[reservation-create-stale-window]"
          - "errors[ERR_WINDOW_VERSION_STALE]"
          - "entities.AdmissionWindow.fields.version"
        distinguishing_aspect: "Two sequential reservation creates carrying the same observed window version: the first succeeds and bumps version; the second (same stale expected_window_version) -> ERR_WINDOW_VERSION_STALE (412)."
        test_recipe:
          setup: ["Farm OPEN; window capacity 10, version observed once (win_v0); first reservation created (version -> win_v0+1)."]
          setup_api_calls:
            - call: "POST /farms"
              payload: { name: "OCC Farm" }
              as: FarmManager
              captures: { farm_id: $.data.id }
            - call: "POST /farms/${farm_id}/pricing-policies"
              payload: { adult_admission_cents: 2000, child_admission_cents: 1200, hayride_pass_cents: 800, maze_pass_cents: 600, upick_pass_cents: 1000, pumpkin_per_lb_cents: 150, pumpkin_flat_each_cents: 2500, season_pass_price_cents: 8000 }
              as: FarmManager
              captures: { policy_id: $.data.id }
            - call: "POST /pricing-policies/${policy_id}/activate"
              payload: {}
              as: FarmManager
            - call: "POST /farms/${farm_id}/admission-windows"
              payload: { starts_at: "2026-10-11T14:00:00Z", ends_at: "2026-10-11T16:00:00Z", capacity: 10 }
              as: FarmManager
              captures: { window_id: $.data.id, win_v0: $.data.version }
            - call: "POST /visitors"
              payload: { email: "o1@x.com", full_name: "Oz One" }
              as: FarmManager
              captures: { v1: $.data.id }
            - call: "POST /visitors"
              payload: { email: "o2@x.com", full_name: "Oz Two" }
              as: FarmManager
              captures: { v2: $.data.id }
            - call: "POST /reservations"
              payload: { window_id: "${window_id}", visitor_id: "${v1}", adult_count: 1, child_count: 0, expected_window_version: "${win_v0}" }
              as: Visitor
              as_user_id: "${v1}"
              captures: { res1: $.data.id }
          trigger:
            - call: "POST /reservations"
              payload: { window_id: "${window_id}", visitor_id: "${v2}", adult_count: 1, child_count: 0, expected_window_version: "${win_v0}" }
              as: Visitor
              as_user_id: "${v2}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 412"
            - "response.data.error_id == ERR_WINDOW_VERSION_STALE"

      # --- optimistic_concurrency: stale-version on group confirm ---
      - name: group_confirm_stale_window_version_412
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[group-confirm-stale-window]"
          - "errors[ERR_WINDOW_VERSION_STALE]"
        distinguishing_aspect: "A group confirm carrying a window version older than the live one (a reservation committed seats in between) -> ERR_WINDOW_VERSION_STALE (412); group stays QUOTED."
        test_recipe:
          setup: ["Window capacity 20, version observed by the leader as win_v0; a reservation is then created (version advances) so the leader's expected_window_version is stale."]
          setup_api_calls:
            - call: "POST /farms"
              payload: { name: "Group OCC Farm" }
              as: FarmManager
              captures: { farm_id: $.data.id }
            - call: "POST /farms/${farm_id}/pricing-policies"
              payload: { adult_admission_cents: 2000, child_admission_cents: 1200, hayride_pass_cents: 800, maze_pass_cents: 600, upick_pass_cents: 1000, pumpkin_per_lb_cents: 150, pumpkin_flat_each_cents: 2500, season_pass_price_cents: 8000, group_rate_min_headcount: 15 }
              as: FarmManager
              captures: { policy_id: $.data.id }
            - call: "POST /pricing-policies/${policy_id}/activate"
              payload: {}
              as: FarmManager
            - call: "POST /farms/${farm_id}/admission-windows"
              payload: { starts_at: "2026-10-11T14:00:00Z", ends_at: "2026-10-11T16:00:00Z", capacity: 20 }
              as: FarmManager
              captures: { window_id: $.data.id, win_v0: $.data.version }
            - call: "POST /visitors"
              payload: { email: "gocl@x.com", full_name: "Gus Lead" }
              as: FarmManager
              captures: { leader_id: $.data.id }
            - call: "POST /visitors"
              payload: { email: "goci@x.com", full_name: "Gwen Indiv" }
              as: FarmManager
              captures: { indiv_id: $.data.id }
            - call: "POST /farms/${farm_id}/group-bookings"
              payload: { window_id: "${window_id}", group_leader_id: "${leader_id}", kind: "FIELD_TRIP", adult_count: 4, child_count: 6 }
              as: GroupLeader
              as_user_id: "${leader_id}"
              captures: { group_id: $.data.id }
            - call: "POST /reservations"
              payload: { window_id: "${window_id}", visitor_id: "${indiv_id}", adult_count: 1, child_count: 0, expected_window_version: "${win_v0}" }
              as: Visitor
              as_user_id: "${indiv_id}"
              captures: { res_id: $.data.id }
          trigger:
            - call: "POST /group-bookings/${group_id}/confirm"
              payload: { expected_window_version: "${win_v0}" }
              as: GroupLeader
              as_user_id: "${leader_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 412"
            - "response.data.error_id == ERR_WINDOW_VERSION_STALE"
            - "GroupBooking.${group_id}.status == QUOTED"

      # --- cascading_side_effects: child lines voided/refunded on cancel ---
      - name: cancel_reservation_voids_child_lines
        claim_type: cascading_side_effects
        grounds: [state_machines.Reservation.PENDING_to_CANCELLED, entities.ActivityPass.fields.status, entities.ConcessionOrder.fields.status, entities.Waiver.fields.status]
        distinguishing_aspect: "Cancelling a PENDING reservation with one ActivityPass, one ConcessionOrder, and one Waiver sets them to REVOKED, REFUNDED, and VOID respectively in one request."
        test_recipe:
          setup: ["A PENDING reservation with one activity pass, one concession order, one waiver."]
          setup_api_calls:
            - call: "POST /farms"
              payload: { name: "Cascade Cancel Farm", parking_fee_cents: 1000 }
              as: FarmManager
              captures: { farm_id: $.data.id }
            - call: "POST /farms/${farm_id}/pricing-policies"
              payload: { adult_admission_cents: 2000, child_admission_cents: 1200, hayride_pass_cents: 800, maze_pass_cents: 600, upick_pass_cents: 1000, pumpkin_per_lb_cents: 150, pumpkin_flat_each_cents: 2500, season_pass_price_cents: 8000 }
              as: FarmManager
              captures: { policy_id: $.data.id }
            - call: "POST /pricing-policies/${policy_id}/activate"
              payload: {}
              as: FarmManager
            - call: "POST /farms/${farm_id}/admission-windows"
              payload: { starts_at: "2026-10-11T14:00:00Z", ends_at: "2026-10-11T16:00:00Z", capacity: 5 }
              as: FarmManager
              captures: { window_id: $.data.id, win_v0: $.data.version }
            - call: "POST /visitors"
              payload: { email: "cc@x.com", full_name: "Cara Cascade" }
              as: FarmManager
              captures: { visitor_id: $.data.id }
            - call: "POST /reservations"
              payload: { window_id: "${window_id}", visitor_id: "${visitor_id}", adult_count: 1, child_count: 0, expected_window_version: "${win_v0}" }
              as: Visitor
              as_user_id: "${visitor_id}"
              captures: { res_id: $.data.id }
            - call: "POST /reservations/${res_id}/activity-passes"
              payload: { activity: "MAZE", quantity: 1 }
              as: Visitor
              as_user_id: "${visitor_id}"
              captures: { ap_id: $.data.id }
            - call: "POST /reservations/${res_id}/concession-orders"
              payload: { food_cents: 500, vehicle_count: 1 }
              as: Visitor
              as_user_id: "${visitor_id}"
              captures: { co_id: $.data.id }
            - call: "POST /reservations/${res_id}/waivers"
              payload: { participant_name: "Cara Cascade" }
              as: Visitor
              as_user_id: "${visitor_id}"
              captures: { wv_id: $.data.id }
          trigger:
            - call: "POST /reservations/${res_id}/cancel"
              payload: {}
              as: Visitor
              as_user_id: "${visitor_id}"
