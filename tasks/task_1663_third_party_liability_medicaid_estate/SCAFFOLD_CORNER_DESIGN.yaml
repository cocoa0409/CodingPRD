# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Third-Party Liability & Medicaid Estate Recovery
# =============================================================================
scaffold_corner_design:

  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: member_create_missing_required_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.Member.fields.medicaid_id, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /recovery/members without medicaid_id -> 400 ERR_INVALID_REQUEST; no member persisted."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /recovery/members", payload: { full_name: "No Id", state_code: "CA" }, as: SystemAdmin, as_user_id: admin_1, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST (captured err)"
            - "GET /recovery/cases and member lists remain empty"

      - name: member_create_system_field_input_ignored
        claim_type: system_fields
        grounds: [entities.Member]
        distinguishing_aspect: "Client-supplied id/version/created_at are ignored: server mints its own id (different from the supplied one) and version starts at 1."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /recovery/members", payload: { medicaid_id: "M-SF-1", full_name: "Sys Fields", state_code: "CA", id: "11111111-1111-1111-1111-111111111111", version: 9, created_at: "2020-01-01T00:00:00.000Z" }, as: SystemAdmin, as_user_id: admin_1, captures: { m_id: $.data.id, m_v: $.data.version } }
          assert:
            - "Member.${m_id}.id != 11111111-1111-1111-1111-111111111111"
            - "Member.${m_id}.version == 1 (captured m_v == 1)"
            - "Member.${m_id}.created_at != 2020-01-01T00:00:00.000Z"

      - name: entity_get_nonexistent_returns_not_found
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET on a well-formed but unknown case id -> 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /recovery/cases/123e4567-e89b-42d3-a456-426614174000", as: RecoverySpecialist, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_NOT_FOUND (captured err), HTTP 404"

      - name: list_endpoint_pagination_envelope_defaults
        claim_type: listing
        grounds: [response_envelope]
        distinguishing_aspect: "GET /recovery/cases with one record returns envelope meta plus pagination fields with defaults: limit 10, offset 0, total_count 1, has_more false."
        test_recipe:
          setup: ["One member with one case"]
          setup_api_calls:
            - { call: "POST /recovery/members", payload: { medicaid_id: "M-PG-1", full_name: "Page Test", state_code: "CA" }, as: SystemAdmin, as_user_id: admin_1, captures: { m_id: $.data.id } }
            - { call: "POST /recovery/cases", payload: { member_id: "${m_id}", attorney_name: "Atty A", attorney_email: "a@x.com", injury_date: "2026-01-01", third_party_insurer: "InsCo" }, as: RecoverySpecialist, as_user_id: spec_1 }
          trigger:
            - { call: "GET /recovery/cases?member_id=${m_id}", as: RecoverySpecialist }
          assert:
            - "response meta contains api_request_id and api_request_timestamp"
            - "pagination: limit == 10, offset == 0, total_count == 1, has_more == false"

      - name: estate_case_created_with_provisional_defaults
        claim_type: defaults
        grounds: [entities.EstateCase.fields.provisional_claim_cents, entities.EstateCase.fields.status]
        distinguishing_aspect: "mark-deceased creates EstateCase OPENED with provisional_claim_cents == lifetime_paid_cents, total_paid_cents == 0, claim_outstanding_cents == 0, claim_amount_cents == null."
        test_recipe:
          setup: ["One ACTIVE member"]
          setup_api_calls:
            - { call: "POST /recovery/members", payload: { medicaid_id: "M-ED-1", full_name: "Est Default", state_code: "CA" }, as: SystemAdmin, as_user_id: admin_1, captures: { m_id: $.data.id } }
          trigger:
            - { call: "POST /recovery/members/${m_id}/mark-deceased", payload: { date_of_death: "2026-03-01", lifetime_paid_cents: 750000 }, as: EstateRecoveryOfficer, as_user_id: ero_1 }
            - { call: "GET /recovery/estate-cases?member_id=${m_id}", as: EstateRecoveryOfficer, captures: { ec_id: "$.data[0].id" } }
          assert:
            - "Member.${m_id}.status == DECEASED and date_of_death == 2026-03-01"
            - "EstateCase.${ec_id}.status == OPENED, provisional_claim_cents == 750000, total_paid_cents == 0, claim_outstanding_cents == 0, claim_amount_cents == null"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: notify_attorney_twice_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.TplCase.IDENTIFIED_to_ATTORNEY_NOTIFIED, "errors[ERR_INVALID_STATE_TRANSITION]"]
        distinguishing_aspect: "Second notify-attorney on an ATTORNEY_NOTIFIED case -> ERR_INVALID_STATE_TRANSITION; attorney_notified_at unchanged."
        test_recipe:
          setup: ["Case in ATTORNEY_NOTIFIED"]
          setup_api_calls:
            - { call: "POST /recovery/members", payload: { medicaid_id: "M-NA-1", full_name: "Notif A", state_code: "CA" }, as: SystemAdmin, as_user_id: admin_1, captures: { m_id: $.data.id } }
            - { call: "POST /recovery/cases", payload: { member_id: "${m_id}", attorney_name: "Atty A", attorney_email: "a@x.com", injury_date: "2026-01-01", third_party_insurer: "InsCo" }, as: RecoverySpecialist, as_user_id: spec_1, captures: { c_id: $.data.id } }
            - { call: "POST /recovery/cases/${c_id}/notify-attorney", as: RecoverySpecialist, as_user_id: spec_1 }
          trigger:
            - { call: "POST /recovery/cases/${c_id}/notify-attorney", as: RecoverySpecialist, as_user_id: spec_1, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE_TRANSITION (captured err)"
            - "TplCase.${c_id}.status still == ATTORNEY_NOTIFIED"

      - name: close_closed_case_returns_invalid_state
        claim_type: terminal_lockdown
        grounds: [state_machines.TplCase.IDENTIFIED_to_CLOSED_NO_RECOVERY, "errors[ERR_INVALID_STATE_TRANSITION]"]
        distinguishing_aspect: "CLOSED_NO_RECOVERY is terminal: a second close -> ERR_INVALID_STATE_TRANSITION and no further mutation."
        test_recipe:
          setup: ["Case closed once (CLOSED_NO_RECOVERY)"]
          setup_api_calls:
            - { call: "POST /recovery/members", payload: { medicaid_id: "M-CL-1", full_name: "Close T", state_code: "CA" }, as: SystemAdmin, as_user_id: admin_1, captures: { m_id: $.data.id } }
            - { call: "POST /recovery/cases", payload: { member_id: "${m_id}", attorney_name: "Atty A", attorney_email: "a@x.com", injury_date: "2026-01-01", third_party_insurer: "InsCo" }, as: RecoverySpecialist, as_user_id: spec_1, captures: { c_id: $.data.id } }
            - { call: "POST /recovery/cases/${c_id}/close", as: RecoverySpecialist, as_user_id: spec_1 }
          trigger:
            - { call: "POST /recovery/cases/${c_id}/close", as: RecoverySpecialist, as_user_id: spec_1, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE_TRANSITION (captured err)"
            - "TplCase.${c_id}.status still == CLOSED_NO_RECOVERY"

      - name: terminal_case_blocks_litigation_event
        claim_type: invalid_transition
        grounds: [state_machines.TplCaseLitigation.NO_SUIT_to_SUIT_FILED, "errors[ERR_INVALID_STATE_TRANSITION]"]
        distinguishing_aspect: "FILE_SUIT on a CLOSED_NO_RECOVERY case -> ERR_INVALID_STATE_TRANSITION (litigation dimension locked with terminal resolution status)."
        test_recipe:
          setup: ["Case CLOSED_NO_RECOVERY"]
          setup_api_calls:
            - { call: "POST /recovery/members", payload: { medicaid_id: "M-LT-2", full_name: "Lit Lock", state_code: "CA" }, as: SystemAdmin, as_user_id: admin_1, captures: { m_id: $.data.id } }
            - { call: "POST /recovery/cases", payload: { member_id: "${m_id}", attorney_name: "Atty A", attorney_email: "a@x.com", injury_date: "2026-01-01", third_party_insurer: "InsCo" }, as: RecoverySpecialist, as_user_id: spec_1, captures: { c_id: $.data.id } }
            - { call: "POST /recovery/cases/${c_id}/close", as: RecoverySpecialist, as_user_id: spec_1 }
          trigger:
            - { call: "POST /recovery/cases/${c_id}/litigation", payload: { litigation_event: "FILE_SUIT" }, as: RecoverySpecialist, as_user_id: spec_1, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE_TRANSITION (captured err)"
            - "TplCase.${c_id}.litigation_status still == NO_SUIT"

      - name: posting_double_post_returns_invalid_state
        claim_type: idempotency
        grounds: [state_machines.RecoveryPosting.PENDING_to_POSTED, "errors[ERR_INVALID_STATE_TRANSITION]"]
        distinguishing_aspect: "Posting an already-POSTED posting -> ERR_INVALID_STATE_TRANSITION; lien outstanding not reduced twice."
        test_recipe:
          setup: ["Settlement ACCEPTED (recovery 200000 on lien 200000); posting 200000 already POSTED (case RESOLVED, lien SATISFIED)"]
          setup_api_calls:
            - { call: "POST /recovery/members", payload: { medicaid_id: "M-DP-1", full_name: "Double Post", state_code: "CA" }, as: SystemAdmin, as_user_id: admin_1, captures: { m_id: $.data.id } }
            - { call: "POST /recovery/cases", payload: { member_id: "${m_id}", attorney_name: "Atty A", attorney_email: "a@x.com", injury_date: "2026-01-01", third_party_insurer: "InsCo" }, as: RecoverySpecialist, as_user_id: spec_1, captures: { c_id: $.data.id } }
            - { call: "POST /recovery/cases/${c_id}/notify-attorney", as: RecoverySpecialist, as_user_id: spec_1 }
            - { call: "POST /recovery/cases/${c_id}/expense-claims", payload: { service_date: "2026-01-10", paid_amount_cents: 200000, claim_reference: "CL-1" }, as: RecoverySpecialist, as_user_id: spec_1 }
            - { call: "POST /recovery/cases/${c_id}/liens", as: RecoverySpecialist, as_user_id: spec_1, captures: { l_id: $.data.id } }
            - { call: "GET /recovery/cases/${c_id}", as: RecoverySpecialist, captures: { c_v: $.data.version } }
            - { call: "POST /recovery/cases/${c_id}/settlements", payload: { gross_amount_cents: 1000000, attorney_fee_pct: 0.25, litigation_costs_cents: 100000, offered_by: "INSURER", expected_case_version: "${c_v}" }, as: RecoverySpecialist, as_user_id: spec_1, captures: { s_id: $.data.id } }
            - { call: "POST /recovery/settlements/${s_id}/accept", as: RecoverySupervisor, as_user_id: sup_1 }
            - { call: "POST /recovery/settlements/${s_id}/postings", payload: { gross_recovery_cents: 200000, contractor_code: "CTR-A" }, as: RecoveryAccountant, as_user_id: acct_1, captures: { p_id: $.data.id } }
            - { call: "POST /recovery/postings/${p_id}/post", as: RecoveryAccountant, as_user_id: acct_1 }
          trigger:
            - { call: "POST /recovery/postings/${p_id}/post", as: RecoveryAccountant, as_user_id: acct_1, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE_TRANSITION (captured err)"
            - "Lien.${l_id}.outstanding_cents still == 0 (no double application)"

      - name: accept_rejected_settlement_returns_invalid_state
        claim_type: terminal_lockdown
        grounds: [state_machines.Settlement.OFFERED_to_REJECTED, "errors[ERR_INVALID_STATE_TRANSITION]"]
        distinguishing_aspect: "REJECTED is terminal for Settlement: accept after reject -> ERR_INVALID_STATE_TRANSITION; case already back to LIEN_FILED."
        test_recipe:
          setup: ["Case with lien 100000; settlement created then rejected"]
          setup_api_calls:
            - { call: "POST /recovery/members", payload: { medicaid_id: "M-AR-1", full_name: "Acc Rej", state_code: "CA" }, as: SystemAdmin, as_user_id: admin_1, captures: { m_id: $.data.id } }
            - { call: "POST /recovery/cases", payload: { member_id: "${m_id}", attorney_name: "Atty A", attorney_email: "a@x.com", injury_date: "2026-01-01", third_party_insurer: "InsCo" }, as: RecoverySpecialist, as_user_id: spec_1, captures: { c_id: $.data.id } }
            - { call: "POST /recovery/cases/${c_id}/notify-attorney", as: RecoverySpecialist, as_user_id: spec_1 }
            - { call: "POST /recovery/cases/${c_id}/expense-claims", payload: { service_date: "2026-01-10", paid_amount_cents: 100000, claim_reference: "CL-1" }, as: RecoverySpecialist, as_user_id: spec_1 }
            - { call: "POST /recovery/cases/${c_id}/liens", as: RecoverySpecialist, as_user_id: spec_1 }
            - { call: "GET /recovery/cases/${c_id}", as: RecoverySpecialist, captures: { c_v: $.data.version } }
            - { call: "POST /recovery/cases/${c_id}/settlements", payload: { gross_amount_cents: 500000, attorney_fee_pct: 0.20, litigation_costs_cents: 50000, offered_by: "INSURER", expected_case_version: "${c_v}" }, as: RecoverySpecialist, as_user_id: spec_1, captures: { s_id: $.data.id } }
            - { call: "POST /recovery/settlements/${s_id}/reject", as: RecoverySupervisor, as_user_id: sup_1 }
          trigger:
            - { call: "POST /recovery/settlements/${s_id}/accept", as: RecoverySupervisor, as_user_id: sup_1, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE_TRANSITION (captured err)"
            - "Settlement.${s_id}.status still == REJECTED"
            - "TplCase.${c_id}.status == LIEN_FILED (revert side effect of reject already applied)"

      - name: waiver_appeal_loop_denied_to_pending
        claim_type: valid_transition
        grounds: [state_machines.HardshipWaiver.DENIED_to_PENDING]
        distinguishing_aspect: "Cyclic appeal: DENIED -> PENDING with appeal_count incremented to 1; a subsequent deny/approve path reopens."
        test_recipe:
          setup: ["Estate CLAIM_FILED (claim 4000000); PARTIAL waiver created then DENIED"]
          setup_api_calls:
            - { call: "POST /recovery/members", payload: { medicaid_id: "M-AP-1", full_name: "Appeal One", state_code: "CA" }, as: SystemAdmin, as_user_id: admin_1, captures: { m_id: $.data.id } }
            - { call: "POST /recovery/members/${m_id}/mark-deceased", payload: { date_of_death: "2026-02-01", lifetime_paid_cents: 4000000 }, as: EstateRecoveryOfficer, as_user_id: ero_1 }
            - { call: "GET /recovery/estate-cases?member_id=${m_id}", as: EstateRecoveryOfficer, captures: { ec_id: "$.data[0].id" } }
            - { call: "POST /recovery/estate-cases/${ec_id}/file-claim", payload: { probate_case_number: "P-400", exempt_services_cents: 0 }, as: EstateRecoveryOfficer, as_user_id: ero_1 }
            - { call: "POST /recovery/estate-cases/${ec_id}/waivers", payload: { waiver_type: "PARTIAL", household_income_annual_cents: 1000000, homestead_value_cents: 1000000, requested_reduction_cents: 500000 }, as: EstateRecoveryOfficer, as_user_id: ero_1, captures: { w_id: $.data.id } }
            - { call: "POST /recovery/waivers/${w_id}/deny", as: RecoverySupervisor, as_user_id: sup_1 }
          trigger:
            - { call: "POST /recovery/waivers/${w_id}/appeal", as: EstateRecoveryOfficer, as_user_id: ero_1 }
          assert:
            - "HardshipWaiver.${w_id}.status == PENDING"
            - "HardshipWaiver.${w_id}.appeal_count == 1"

      - name: waiver_second_appeal_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.HardshipWaiver.DENIED_to_PENDING, "errors[ERR_APPEAL_LIMIT_REACHED]"]
        distinguishing_aspect: "appeal_count boundary: after 1 appeal and a second denial, a second appeal -> ERR_APPEAL_LIMIT_REACHED (count >= MAX_APPEALS)."
        test_recipe:
          setup: ["Estate CLAIM_FILED; waiver denied, appealed (count 1), denied again"]
          setup_api_calls:
            - { call: "POST /recovery/members", payload: { medicaid_id: "M-AP-2", full_name: "Appeal Two", state_code: "CA" }, as: SystemAdmin, as_user_id: admin_1, captures: { m_id: $.data.id } }
            - { call: "POST /recovery/members/${m_id}/mark-deceased", payload: { date_of_death: "2026-02-01", lifetime_paid_cents: 4000000 }, as: EstateRecoveryOfficer, as_user_id: ero_1 }
            - { call: "GET /recovery/estate-cases?member_id=${m_id}", as: EstateRecoveryOfficer, captures: { ec_id: "$.data[0].id" } }
            - { call: "POST /recovery/estate-cases/${ec_id}/file-claim", payload: { probate_case_number: "P-401", exempt_services_cents: 0 }, as: EstateRecoveryOfficer, as_user_id: ero_1 }
            - { call: "POST /recovery/estate-cases/${ec_id}/waivers", payload: { waiver_type: "FULL", household_income_annual_cents: 1000000, homestead_value_cents: 1000000 }, as: EstateRecoveryOfficer, as_user_id: ero_1, captures: { w_id: $.data.id } }
            - { call: "POST /recovery/waivers/${w_id}/deny", as: RecoverySupervisor, as_user_id: sup_1 }
            - { call: "POST /recovery/waivers/${w_id}/appeal", as: EstateRecoveryOfficer, as_user_id: ero_1 }
            - { call: "POST /recovery/waivers/${w_id}/deny", as: RecoverySupervisor, as_user_id: sup_1 }
          trigger:
            - { call: "POST /recovery/waivers/${w_id}/appeal", as: EstateRecoveryOfficer, as_user_id: ero_1, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_APPEAL_LIMIT_REACHED (captured err)"
            - "HardshipWaiver.${w_id}.status still == DENIED and appeal_count == 1"

      - name: lien_release_reverts_case_to_attorney_notified
        claim_type: compensation
        grounds: [state_machines.Lien.FILED_to_RELEASED, state_machines.TplCase.LIEN_FILED_to_ATTORNEY_NOTIFIED]
        distinguishing_aspect: "Releasing the only lien while the case is LIEN_FILED (no open settlement) reverts the case to ATTORNEY_NOTIFIED."
        test_recipe:
          setup: ["Case LIEN_FILED with lien 150000 FILED"]
          setup_api_calls:
            - { call: "POST /recovery/members", payload: { medicaid_id: "M-RL-1", full_name: "Rel Ease", state_code: "CA" }, as: SystemAdmin, as_user_id: admin_1, captures: { m_id: $.data.id } }
            - { call: "POST /recovery/cases", payload: { member_id: "${m_id}", attorney_name: "Atty A", attorney_email: "a@x.com", injury_date: "2026-01-01", third_party_insurer: "InsCo" }, as: RecoverySpecialist, as_user_id: spec_1, captures: { c_id: $.data.id } }
            - { call: "POST /recovery/cases/${c_id}/notify-attorney", as: RecoverySpecialist, as_user_id: spec_1 }
            - { call: "POST /recovery/cases/${c_id}/expense-claims", payload: { service_date: "2026-01-10", paid_amount_cents: 150000, claim_reference: "CL-1" }, as: RecoverySpecialist, as_user_id: spec_1 }
            - { call: "POST /recovery/cases/${c_id}/liens", as: RecoverySpecialist, as_user_id: spec_1, captures: { l_id: $.data.id } }
          trigger:
            - { call: "POST /recovery/liens/${l_id}/release", as: RecoverySupervisor, as_user_id: sup_1 }
          assert:
            - "Lien.${l_id}.status == RELEASED"
            - "TplCase.${c_id}.status == ATTORNEY_NOTIFIED"

      - name: estate_record_payment_exact_outstanding_auto_paid
        claim_type: auto_transition
        grounds: [state_machines.EstateCase.CLAIM_FILED_to_PAID]
        distinguishing_aspect: "Paying exactly the outstanding amount (zero-remainder boundary) auto-transitions the estate case to PAID."
        test_recipe:
          setup: ["Estate CLAIM_FILED with claim 100000 (lifetime 100000, no TPL, exempt 0)"]
          setup_api_calls:
            - { call: "POST /recovery/members", payload: { medicaid_id: "M-PY-1", full_name: "Pay Exact", state_code: "CA" }, as: SystemAdmin, as_user_id: admin_1, captures: { m_id: $.data.id } }
            - { call: "POST /recovery/members/${m_id}/mark-deceased", payload: { date_of_death: "2026-02-01", lifetime_paid_cents: 100000 }, as: EstateRecoveryOfficer, as_user_id: ero_1 }
            - { call: "GET /recovery/estate-cases?member_id=${m_id}", as: EstateRecoveryOfficer, captures: { ec_id: "$.data[0].id" } }
            - { call: "POST /recovery/estate-cases/${ec_id}/file-claim", payload: { probate_case_number: "P-500", exempt_services_cents: 0 }, as: EstateRecoveryOfficer, as_user_id: ero_1 }
          trigger:
            - { call: "POST /recovery/estate-cases/${ec_id}/record-payment", payload: { amount_cents: 100000 }, as: RecoveryAccountant, as_user_id: acct_1 }
          assert:
            - "EstateCase.${ec_id}.total_paid_cents == 100000"
            - "EstateCase.${ec_id}.claim_outstanding_cents == 0"
            - "EstateCase.${ec_id}.status == PAID"

      - name: estate_filing_deadline_time_barred
        claim_type: temporal_validation
        grounds: [state_machines.EstateCase.OPENED_to_TIME_BARRED, "errors[ERR_ESTATE_FILING_LATE]"]
        distinguishing_aspect: "Filing deadline inclusive: file-claim on date_of_death + 365 exactly succeeds; one day later fails with ERR_ESTATE_FILING_LATE and the case becomes TIME_BARRED."
        test_recipe:
          setup: ["Two members deceased 2026-01-01 (deadline 2027-01-01); both estates OPENED; clock moved to 2027-01-01 for A, then 2027-01-02 for B"]
          setup_api_calls:
            - { call: "POST /recovery/members", payload: { medicaid_id: "M-TB-A", full_name: "Bar A", state_code: "CA" }, as: SystemAdmin, as_user_id: admin_1, captures: { m_a: $.data.id } }
            - { call: "POST /recovery/members", payload: { medicaid_id: "M-TB-B", full_name: "Bar B", state_code: "CA" }, as: SystemAdmin, as_user_id: admin_1, captures: { m_b: $.data.id } }
            - { call: "POST /recovery/members/${m_a}/mark-deceased", payload: { date_of_death: "2026-01-01", lifetime_paid_cents: 100000 }, as: EstateRecoveryOfficer, as_user_id: ero_1 }
            - { call: "POST /recovery/members/${m_b}/mark-deceased", payload: { date_of_death: "2026-01-01", lifetime_paid_cents: 100000 }, as: EstateRecoveryOfficer, as_user_id: ero_1 }
            - { call: "GET /recovery/estate-cases?member_id=${m_a}", as: EstateRecoveryOfficer, captures: { ec_a: "$.data[0].id" } }
            - { call: "GET /recovery/estate-cases?member_id=${m_b}", as: EstateRecoveryOfficer, captures: { ec_b: "$.data[0].id" } }
            - { call: "POST /recovery/_clock/set_current_utc", payload: { to_iso8601: "2027-01-01T00:00:00Z" }, as: SystemAdmin, as_user_id: admin_1 }
          trigger:
            - { call: "POST /recovery/estate-cases/${ec_a}/file-claim", payload: { probate_case_number: "P-A", exempt_services_cents: 0 }, as: EstateRecoveryOfficer, as_user_id: ero_1 }
            - { call: "POST /recovery/_clock/set_current_utc", payload: { to_iso8601: "2027-01-02T00:00:00Z" }, as: SystemAdmin, as_user_id: admin_1 }
            - { call: "POST /recovery/estate-cases/${ec_b}/file-claim", payload: { probate_case_number: "P-B", exempt_services_cents: 0 }, as: EstateRecoveryOfficer, as_user_id: ero_1, captures: { err: $.data.error_id } }
          assert:
            - "Estate A filing on the deadline date succeeds: status == CLAIM_FILED, claim_amount_cents == 100000"
            - "Estate B filing one day late -> error_id == ERR_ESTATE_FILING_LATE (captured err)"
            - "EstateCase.${ec_b}.status == TIME_BARRED"

      - name: sol_lazy_expiry_cascades_to_lien_and_settlement
        claim_type: conditional_cascade
        grounds: [state_machines.TplCase.SOL_EXPIRED, state_machines.Lien.FILED_to_EXPIRED, state_machines.Settlement.OFFERED_to_REJECTED, "errors[ERR_SOL_EXPIRED]"]
        distinguishing_aspect: "A lien amend attempted after sol_date is rejected with ERR_SOL_EXPIRED and the lazy-expiry cascade still fires: case -> SOL_EXPIRED, open lien -> EXPIRED, OFFERED settlement -> REJECTED."
        test_recipe:
          setup: ["Case injury 2023-08-01 (sol 2026-08-01) SETTLEMENT_PENDING: lien FILED, settlement OFFERED; clock moved to 2026-08-16 (past sol, outside the 14-day freeze)"]
          setup_api_calls:
            - { call: "POST /recovery/members", payload: { medicaid_id: "M-LE-1", full_name: "Lazy Exp", state_code: "CA" }, as: SystemAdmin, as_user_id: admin_1, captures: { m_id: $.data.id } }
            - { call: "POST /recovery/cases", payload: { member_id: "${m_id}", attorney_name: "Atty A", attorney_email: "a@x.com", injury_date: "2023-08-01", third_party_insurer: "InsCo" }, as: RecoverySpecialist, as_user_id: spec_1, captures: { c_id: $.data.id } }
            - { call: "POST /recovery/cases/${c_id}/notify-attorney", as: RecoverySpecialist, as_user_id: spec_1 }
            - { call: "POST /recovery/cases/${c_id}/expense-claims", payload: { service_date: "2023-08-10", paid_amount_cents: 200000, claim_reference: "CL-1" }, as: RecoverySpecialist, as_user_id: spec_1 }
            - { call: "POST /recovery/cases/${c_id}/liens", as: RecoverySpecialist, as_user_id: spec_1, captures: { l_id: $.data.id, l_v: $.data.version } }
            - { call: "GET /recovery/cases/${c_id}", as: RecoverySpecialist, captures: { c_v: $.data.version } }
            - { call: "POST /recovery/cases/${c_id}/settlements", payload: { gross_amount_cents: 500000, attorney_fee_pct: 0.20, litigation_costs_cents: 50000, offered_by: "INSURER", expected_case_version: "${c_v}" }, as: RecoverySpecialist, as_user_id: spec_1, captures: { s_id: $.data.id } }
            - { call: "POST /recovery/_clock/set_current_utc", payload: { to_iso8601: "2026-08-16T00:00:00Z" }, as: SystemAdmin, as_user_id: admin_1 }
          trigger:
            - { call: "POST /recovery/liens/${l_id}/amend", payload: { new_amount_cents: 180000, expected_lien_version: "${l_v}" }, as: RecoverySpecialist, as_user_id: spec_1, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_SOL_EXPIRED (captured err)"
            - "TplCase.${c_id}.status == SOL_EXPIRED"
            - "Lien.${l_id}.status == EXPIRED"
            - "Settlement.${s_id}.status == REJECTED"

      - name: notice_send_failed_then_retry_delivered
        claim_type: valid_transition
        grounds: [state_machines.CommunicationNotice.QUEUED_to_FAILED, state_machines.CommunicationNotice.FAILED_to_DELIVERED]
        distinguishing_aspect: "Notice retry loop: QUEUED -> FAILED -> DELIVERED; sent_at/is_late recomputed on the successful retry (is_late false when sent before due_date)."
        test_recipe:
          setup: ["Case LIEN_FILED (lien filed at default clock 2026-08-01): LIEN_FILED_NOTICE queued with due_date 2026-08-31"]
          setup_api_calls:
            - { call: "POST /recovery/members", payload: { medicaid_id: "M-NT-1", full_name: "Note One", state_code: "CA" }, as: SystemAdmin, as_user_id: admin_1, captures: { m_id: $.data.id } }
            - { call: "POST /recovery/cases", payload: { member_id: "${m_id}", attorney_name: "Atty A", attorney_email: "a@x.com", injury_date: "2026-01-01", third_party_insurer: "InsCo" }, as: RecoverySpecialist, as_user_id: spec_1, captures: { c_id: $.data.id } }
            - { call: "POST /recovery/cases/${c_id}/notify-attorney", as: RecoverySpecialist, as_user_id: spec_1 }
            - { call: "POST /recovery/cases/${c_id}/expense-claims", payload: { service_date: "2026-01-10", paid_amount_cents: 150000, claim_reference: "CL-1" }, as: RecoverySpecialist, as_user_id: spec_1 }
            - { call: "POST /recovery/cases/${c_id}/liens", as: RecoverySpecialist, as_user_id: spec_1 }
            - { call: "GET /recovery/notices?case_id=${c_id}&notice_type=LIEN_FILED_NOTICE", as: RecoverySpecialist, captures: { n_id: "$.data[0].id" } }
          trigger:
            - { call: "POST /recovery/notices/${n_id}/send", payload: { delivery_outcome: "FAILED" }, as: RecoverySpecialist, as_user_id: spec_1 }
            - { call: "POST /recovery/notices/${n_id}/send", payload: { delivery_outcome: "DELIVERED" }, as: RecoverySpecialist, as_user_id: spec_1 }
          assert:
            - "After first send: status == FAILED, sent_at set, is_late == false (2026-08-01 <= 2026-08-31)"
            - "After retry: CommunicationNotice.${n_id}.status == DELIVERED and is_late == false"

      - name: litigation_dismissed_then_refiled
        claim_type: valid_transition
        grounds: [state_machines.TplCaseLitigation.SUIT_FILED_to_SUIT_DISMISSED, state_machines.TplCaseLitigation.SUIT_DISMISSED_to_SUIT_FILED]
        distinguishing_aspect: "Litigation cycle: SUIT_FILED -> SUIT_DISMISSED -> SUIT_FILED (refile) is legal while the case stays non-terminal."
        test_recipe:
          setup: ["Case IDENTIFIED with suit filed"]
          setup_api_calls:
            - { call: "POST /recovery/members", payload: { medicaid_id: "M-LT-3", full_name: "Re File", state_code: "CA" }, as: SystemAdmin, as_user_id: admin_1, captures: { m_id: $.data.id } }
            - { call: "POST /recovery/cases", payload: { member_id: "${m_id}", attorney_name: "Atty A", attorney_email: "a@x.com", injury_date: "2026-01-01", third_party_insurer: "InsCo" }, as: RecoverySpecialist, as_user_id: spec_1, captures: { c_id: $.data.id } }
            - { call: "POST /recovery/cases/${c_id}/litigation", payload: { litigation_event: "FILE_SUIT" }, as: RecoverySpecialist, as_user_id: spec_1 }
          trigger:
            - { call: "POST /recovery/cases/${c_id}/litigation", payload: { litigation_event: "RECORD_DISMISSAL" }, as: RecoverySpecialist, as_user_id: spec_1 }
            - { call: "POST /recovery/cases/${c_id}/litigation", payload: { litigation_event: "FILE_SUIT" }, as: RecoverySpecialist, as_user_id: spec_1 }
          assert:
            - "After dismissal: litigation_status == SUIT_DISMISSED"
            - "After refile: TplCase.${c_id}.litigation_status == SUIT_FILED"
            - "TplCase.${c_id}.status unchanged == IDENTIFIED throughout"

  # ---------------------------------------------------------------------------
  - section: calculations
    instances:
      - name: lien_amount_below_cap_exact_sum
        claim_type: correct_result
        grounds: [calculations.lien_perfected_amount]
        distinguishing_aspect: "Claims 100000 + 50000 (below the 250000 cap) produce lien_amount_cents == 150000 — the cap does not clamp when the basis is smaller."
        test_recipe:
          setup: ["Case ATTORNEY_NOTIFIED with two included claims 100000 and 50000"]
          setup_api_calls:
            - { call: "POST /recovery/members", payload: { medicaid_id: "M-LC-1", full_name: "Lien Calc", state_code: "CA" }, as: SystemAdmin, as_user_id: admin_1, captures: { m_id: $.data.id } }
            - { call: "POST /recovery/cases", payload: { member_id: "${m_id}", attorney_name: "Atty A", attorney_email: "a@x.com", injury_date: "2026-01-01", third_party_insurer: "InsCo" }, as: RecoverySpecialist, as_user_id: spec_1, captures: { c_id: $.data.id } }
            - { call: "POST /recovery/cases/${c_id}/notify-attorney", as: RecoverySpecialist, as_user_id: spec_1 }
            - { call: "POST /recovery/cases/${c_id}/expense-claims", payload: { service_date: "2026-01-10", paid_amount_cents: 100000, claim_reference: "CL-1" }, as: RecoverySpecialist, as_user_id: spec_1 }
            - { call: "POST /recovery/cases/${c_id}/expense-claims", payload: { service_date: "2026-02-01", paid_amount_cents: 50000, claim_reference: "CL-2" }, as: RecoverySpecialist, as_user_id: spec_1 }
          trigger:
            - { call: "POST /recovery/cases/${c_id}/liens", as: RecoverySpecialist, as_user_id: spec_1, captures: { l_id: $.data.id } }
          assert:
            - "Lien.${l_id}.lien_amount_cents == 150000"
            - "Lien.${l_id}.statutory_cap_cents == 250000"
            - "TplCase.${c_id}.total_paid_claims_cents == 150000"

      - name: expense_claim_before_injury_excluded_from_lien_basis
        claim_type: input_set_filtering
        grounds: [calculations.lien_perfected_amount, entities.ExpenseClaim.fields.included_in_lien_basis]
        distinguishing_aspect: "A claim dated 2025-12-31 (before injury 2026-01-01) is excluded from the lien basis (lien == 70000) while total_paid_claims_cents still counts all claims (150000)."
        test_recipe:
          setup: ["Case ATTORNEY_NOTIFIED with claim 80000 dated 2025-12-31 (pre-injury) and claim 70000 dated 2026-02-01 (post-injury)"]
          setup_api_calls:
            - { call: "POST /recovery/members", payload: { medicaid_id: "M-IB-1", full_name: "In Basis", state_code: "CA" }, as: SystemAdmin, as_user_id: admin_1, captures: { m_id: $.data.id } }
            - { call: "POST /recovery/cases", payload: { member_id: "${m_id}", attorney_name: "Atty A", attorney_email: "a@x.com", injury_date: "2026-01-01", third_party_insurer: "InsCo" }, as: RecoverySpecialist, as_user_id: spec_1, captures: { c_id: $.data.id } }
            - { call: "POST /recovery/cases/${c_id}/notify-attorney", as: RecoverySpecialist, as_user_id: spec_1 }
            - { call: "POST /recovery/cases/${c_id}/expense-claims", payload: { service_date: "2025-12-31", paid_amount_cents: 80000, claim_reference: "CL-OLD" }, as: RecoverySpecialist, as_user_id: spec_1, captures: { e_old: $.data.id } }
            - { call: "POST /recovery/cases/${c_id}/expense-claims", payload: { service_date: "2026-02-01", paid_amount_cents: 70000, claim_reference: "CL-NEW" }, as: RecoverySpecialist, as_user_id: spec_1 }
          trigger:
            - { call: "POST /recovery/cases/${c_id}/liens", as: RecoverySpecialist, as_user_id: spec_1, captures: { l_id: $.data.id } }
          assert:
            - "ExpenseClaim.${e_old}.included_in_lien_basis == false"
            - "Lien.${l_id}.lien_amount_cents == 70000"
            - "TplCase.${c_id}.total_paid_claims_cents == 150000"

      - name: commission_tier_boundary_and_straddle
        claim_type: constants_applied
        grounds: [calculations.contractor_commission]
        distinguishing_aspect: "Tier boundary: a 100000 posting sits exactly at the tier-1 cap -> commission 10000 (no tier-2 component); a 250000 posting straddles all three tiers -> 10000 + 7500 + 2500 = 20000."
        test_recipe:
          setup: ["Two resolved cases: A with lien/recovery/posting 100000; B with lien/recovery/posting 250000 (claim 250000 == cap, gross 1000000, fee 0.25, costs 100000 -> recovery 250000)"]
          setup_api_calls:
            - { call: "POST /recovery/members", payload: { medicaid_id: "M-TB-1", full_name: "Tier A", state_code: "CA" }, as: SystemAdmin, as_user_id: admin_1, captures: { m_a: $.data.id } }
            - { call: "POST /recovery/members", payload: { medicaid_id: "M-TB-2", full_name: "Tier B", state_code: "CA" }, as: SystemAdmin, as_user_id: admin_1, captures: { m_b: $.data.id } }
            - { call: "POST /recovery/cases", payload: { member_id: "${m_a}", attorney_name: "Atty A", attorney_email: "a@x.com", injury_date: "2026-01-01", third_party_insurer: "InsCo" }, as: RecoverySpecialist, as_user_id: spec_1, captures: { c_a: $.data.id } }
            - { call: "POST /recovery/cases/${c_a}/notify-attorney", as: RecoverySpecialist, as_user_id: spec_1 }
            - { call: "POST /recovery/cases/${c_a}/expense-claims", payload: { service_date: "2026-01-10", paid_amount_cents: 100000, claim_reference: "CL-A1" }, as: RecoverySpecialist, as_user_id: spec_1 }
            - { call: "POST /recovery/cases/${c_a}/liens", as: RecoverySpecialist, as_user_id: spec_1 }
            - { call: "GET /recovery/cases/${c_a}", as: RecoverySpecialist, captures: { c_a_v: $.data.version } }
            - { call: "POST /recovery/cases/${c_a}/settlements", payload: { gross_amount_cents: 1000000, attorney_fee_pct: 0.25, litigation_costs_cents: 100000, offered_by: "INSURER", expected_case_version: "${c_a_v}" }, as: RecoverySpecialist, as_user_id: spec_1, captures: { s_a: $.data.id } }
            - { call: "POST /recovery/settlements/${s_a}/accept", as: RecoverySupervisor, as_user_id: sup_1 }
            - { call: "POST /recovery/settlements/${s_a}/postings", payload: { gross_recovery_cents: 100000, contractor_code: "CTR-A" }, as: RecoveryAccountant, as_user_id: acct_1, captures: { p_a: $.data.id } }
            - { call: "POST /recovery/cases", payload: { member_id: "${m_b}", attorney_name: "Atty B", attorney_email: "b@x.com", injury_date: "2026-01-01", third_party_insurer: "InsCo" }, as: RecoverySpecialist, as_user_id: spec_1, captures: { c_b: $.data.id } }
            - { call: "POST /recovery/cases/${c_b}/notify-attorney", as: RecoverySpecialist, as_user_id: spec_1 }
            - { call: "POST /recovery/cases/${c_b}/expense-claims", payload: { service_date: "2026-01-10", paid_amount_cents: 250000, claim_reference: "CL-B1" }, as: RecoverySpecialist, as_user_id: spec_1 }
            - { call: "POST /recovery/cases/${c_b}/liens", as: RecoverySpecialist, as_user_id: spec_1 }
            - { call: "GET /recovery/cases/${c_b}", as: RecoverySpecialist, captures: { c_b_v: $.data.version } }
            - { call: "POST /recovery/cases/${c_b}/settlements", payload: { gross_amount_cents: 1000000, attorney_fee_pct: 0.25, litigation_costs_cents: 100000, offered_by: "INSURER", expected_case_version: "${c_b_v}" }, as: RecoverySpecialist, as_user_id: spec_1, captures: { s_b: $.data.id } }
            - { call: "POST /recovery/settlements/${s_b}/accept", as: RecoverySupervisor, as_user_id: sup_1 }
            - { call: "POST /recovery/settlements/${s_b}/postings", payload: { gross_recovery_cents: 250000, contractor_code: "CTR-A" }, as: RecoveryAccountant, as_user_id: acct_1, captures: { p_b: $.data.id } }
          trigger:
            - { call: "POST /recovery/postings/${p_a}/post", as: RecoveryAccountant, as_user_id: acct_1 }
            - { call: "POST /recovery/postings/${p_b}/post", as: RecoveryAccountant, as_user_id: acct_1 }
          assert:
            - "RecoveryPosting.${p_a}.commission_cents == 10000 (exact tier-1 cap, no tier-2 spillover)"
            - "RecoveryPosting.${p_b}.commission_cents == 20000 (10000 + 7500 + 2500 across all three tiers)"
            - "RecoveryPosting.${p_b}.net_to_state_cents == 230000"

      - name: hardship_full_criteria_inclusive_boundary
        claim_type: precision
        grounds: [calculations.hardship_reduction, "errors[ERR_HARDSHIP_CRITERIA_NOT_MET]"]
        distinguishing_aspect: "FULL waiver eligibility uses <= on both gates: income exactly 3000000 and homestead exactly 5000000 is APPROVED (boundary inclusive)."
        test_recipe:
          setup: ["Estate CLAIM_FILED with claim 4000000; FULL waiver PENDING with income 3000000 and homestead 5000000 (both exactly at the caps)"]
          setup_api_calls:
            - { call: "POST /recovery/members", payload: { medicaid_id: "M-HB-1", full_name: "Hard Bound", state_code: "CA" }, as: SystemAdmin, as_user_id: admin_1, captures: { m_id: $.data.id } }
            - { call: "POST /recovery/members/${m_id}/mark-deceased", payload: { date_of_death: "2026-02-01", lifetime_paid_cents: 4000000 }, as: EstateRecoveryOfficer, as_user_id: ero_1 }
            - { call: "GET /recovery/estate-cases?member_id=${m_id}", as: EstateRecoveryOfficer, captures: { ec_id: "$.data[0].id" } }
            - { call: "POST /recovery/estate-cases/${ec_id}/file-claim", payload: { probate_case_number: "P-600", exempt_services_cents: 0 }, as: EstateRecoveryOfficer, as_user_id: ero_1 }
            - { call: "POST /recovery/estate-cases/${ec_id}/waivers", payload: { waiver_type: "FULL", household_income_annual_cents: 3000000, homestead_value_cents: 5000000 }, as: EstateRecoveryOfficer, as_user_id: ero_1, captures: { w_id: $.data.id } }
          trigger:
            - { call: "POST /recovery/waivers/${w_id}/approve", as: RecoverySupervisor, as_user_id: sup_1 }
          assert:
            - "HardshipWaiver.${w_id}.status == APPROVED"
            - "HardshipWaiver.${w_id}.decided_reduction_cents == 4000000"
            - "EstateCase.${ec_id}.status == WAIVED"

      - name: estate_final_claim_floored_at_zero
        claim_type: correct_result
        grounds: [calculations.estate_claim_amount]
        distinguishing_aspect: "Final claim is floored at 0: lifetime 100000 - POSTED TPL recovery 150000 - exempt 0 => claim_amount_cents == 0, and the case auto-transitions to PAID at filing."
        test_recipe:
          setup: ["MT member with resolved TPL case (lien 200000, subrogation recovery 150000 POSTED); marked deceased with lifetime_paid_cents 100000"]
          setup_api_calls:
            - { call: "POST /recovery/members", payload: { medicaid_id: "M-ZF-1", full_name: "Zero Floor", state_code: "MT" }, as: SystemAdmin, as_user_id: admin_1, captures: { m_id: $.data.id } }
            - { call: "POST /recovery/cases", payload: { member_id: "${m_id}", attorney_name: "Atty A", attorney_email: "a@x.com", injury_date: "2026-01-01", third_party_insurer: "InsCo" }, as: RecoverySpecialist, as_user_id: spec_1, captures: { c_id: $.data.id } }
            - { call: "POST /recovery/cases/${c_id}/notify-attorney", as: RecoverySpecialist, as_user_id: spec_1 }
            - { call: "POST /recovery/cases/${c_id}/expense-claims", payload: { service_date: "2026-01-10", paid_amount_cents: 200000, claim_reference: "CL-1" }, as: RecoverySpecialist, as_user_id: spec_1 }
            - { call: "POST /recovery/cases/${c_id}/liens", as: RecoverySpecialist, as_user_id: spec_1 }
            - { call: "GET /recovery/cases/${c_id}", as: RecoverySpecialist, captures: { c_v: $.data.version } }
            - { call: "POST /recovery/cases/${c_id}/settlements", payload: { gross_amount_cents: 1000000, attorney_fee_pct: 0.25, litigation_costs_cents: 100000, offered_by: "INSURER", expected_case_version: "${c_v}" }, as: RecoverySpecialist, as_user_id: spec_1, captures: { s_id: $.data.id } }
            - { call: "POST /recovery/settlements/${s_id}/accept", as: RecoverySupervisor, as_user_id: sup_1 }
            - { call: "POST /recovery/settlements/${s_id}/postings", payload: { gross_recovery_cents: 150000, contractor_code: "CTR-A" }, as: RecoveryAccountant, as_user_id: acct_1, captures: { p_id: $.data.id } }
            - { call: "POST /recovery/postings/${p_id}/post", as: RecoveryAccountant, as_user_id: acct_1 }
            - { call: "POST /recovery/members/${m_id}/mark-deceased", payload: { date_of_death: "2026-03-01", lifetime_paid_cents: 100000 }, as: EstateRecoveryOfficer, as_user_id: ero_1 }
            - { call: "GET /recovery/estate-cases?member_id=${m_id}", as: EstateRecoveryOfficer, captures: { ec_id: "$.data[0].id" } }
          trigger:
            - { call: "POST /recovery/estate-cases/${ec_id}/file-claim", payload: { probate_case_number: "P-700", exempt_services_cents: 0 }, as: EstateRecoveryOfficer, as_user_id: ero_1 }
          assert:
            - "EstateCase.${ec_id}.claim_amount_cents == 0 (floored, not -50000)"
            - "EstateCase.${ec_id}.status == PAID (zero-claim auto-transition)"

      - name: accept_recomputes_recovery_after_lien_amend
        claim_type: reconciliation
        grounds: [calculations.settlement_recovery_amount, entities.Settlement.fields.state_recovery_cents]
        distinguishing_aspect: "state_recovery_cents is derived from the lien: created as 200000 against a 200000 lien; after the lien is amended to 180000 (outside the freeze window), accept recomputes it to 180000 rather than keeping the stale 200000."
        test_recipe:
          setup: ["Case with lien 200000; settlement OFFERED created at default clock (recovery computed 200000); clock advanced 15 days past the freeze; lien amended to 180000"]
          setup_api_calls:
            - { call: "POST /recovery/members", payload: { medicaid_id: "M-RC-1", full_name: "Re Compute", state_code: "CA" }, as: SystemAdmin, as_user_id: admin_1, captures: { m_id: $.data.id } }
            - { call: "POST /recovery/cases", payload: { member_id: "${m_id}", attorney_name: "Atty A", attorney_email: "a@x.com", injury_date: "2026-01-01", third_party_insurer: "InsCo" }, as: RecoverySpecialist, as_user_id: spec_1, captures: { c_id: $.data.id } }
            - { call: "POST /recovery/cases/${c_id}/notify-attorney", as: RecoverySpecialist, as_user_id: spec_1 }
            - { call: "POST /recovery/cases/${c_id}/expense-claims", payload: { service_date: "2026-01-10", paid_amount_cents: 200000, claim_reference: "CL-1" }, as: RecoverySpecialist, as_user_id: spec_1 }
            - { call: "POST /recovery/cases/${c_id}/liens", as: RecoverySpecialist, as_user_id: spec_1, captures: { l_id: $.data.id, l_v: $.data.version } }
            - { call: "GET /recovery/cases/${c_id}", as: RecoverySpecialist, captures: { c_v: $.data.version } }
            - { call: "POST /recovery/cases/${c_id}/settlements", payload: { gross_amount_cents: 1000000, attorney_fee_pct: 0.25, litigation_costs_cents: 100000, offered_by: "INSURER", expected_case_version: "${c_v}" }, as: RecoverySpecialist, as_user_id: spec_1, captures: { s_id: $.data.id, s_rec_created: $.data.state_recovery_cents } }
            - { call: "POST /recovery/_clock/set_current_utc", payload: { to_iso8601: "2026-08-16T00:00:00Z" }, as: SystemAdmin, as_user_id: admin_1 }
            - { call: "POST /recovery/liens/${l_id}/amend", payload: { new_amount_cents: 180000, expected_lien_version: "${l_v}" }, as: RecoverySpecialist, as_user_id: spec_1 }
          trigger:
            - { call: "POST /recovery/settlements/${s_id}/accept", as: RecoverySupervisor, as_user_id: sup_1 }
          assert:
            - "Settlement.${s_id}.state_recovery_cents at creation == 200000 (captured s_rec_created)"
            - "After accept: Settlement.${s_id}.state_recovery_cents == 180000 (recomputed against amended lien)"
            - "After accept: Settlement.${s_id}.member_net_cents == 470000"
            - "Settlement.${s_id}.status == ACCEPTED"

      - name: variant_selection_by_state_code
        claim_type: variant_selection
        grounds: [calculations.settlement_recovery_amount, entities.Member.fields.recovery_approach]
        excluded_because:
          difficulty_instance: settlement_recovery_subrogation_vs_reimbursement
          rationale: "Variant selection and divergence are asserted there for CA vs MT members with identical inputs."

  # ---------------------------------------------------------------------------
  - section: validations
    instances:
      - name: request_missing_header_returns_400
        claim_type: violation_to_error
