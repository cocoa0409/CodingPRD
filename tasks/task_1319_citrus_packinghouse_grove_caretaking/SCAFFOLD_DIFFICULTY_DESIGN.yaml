      - name: invoice_issue_gated_by_grower_status
        grounds:
          - state_machines.CaretakingInvoice.DRAFT_to_ISSUED
          - state_machines.Grower.ACTIVE_to_TERMINATED
          - errors[ERR_GROWER_NOT_ACTIVE]
        distinguishing_aspect: |
          Entity pair CaretakingInvoice -> Grower (a third distinct pair):
          issuing is legal only while the grower is not TERMINATED; terminating
          the grower between draft and issue blocks issuance.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; grower GR-CE3 with enrolled grove; one MOW order COMPLETED (line 20000); DRAFT invoice total 20000"
            - "Grower TERMINATED after the draft (advances 0, caretaking balance 0 at termination time)"
          setup_api_calls:
            - { call: "POST /packinghouse/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PackinghouseAdmin }
            - { call: "POST /packinghouse/growers", payload: { grower_code: "GR-CE3", display_name: "Issue Gate Groves" }, as: PackinghouseAdmin, captures: { ig_g: "$.data.id" } }
            - { call: "POST /packinghouse/groves", payload: { grower_id: "${ig_g}", block_code: "B1", variety: HAMLIN, acreage: 30, county_code: "POLK", caretaking_enrolled: true }, as: PackinghouseAdmin, captures: { ig_gr: "$.data.id" } }
            - { call: "POST /packinghouse/caretaking-orders", payload: { grove_id: "${ig_gr}", service_type: MOW, service_date: "2026-08-01", acres_treated: 11.111 }, as: FieldSupervisor, captures: { ig_o: "$.data.id" } }
            - { call: "POST /packinghouse/caretaking-orders/${ig_o}/schedule", payload: {}, as: FieldSupervisor }
            - { call: "POST /packinghouse/caretaking-orders/${ig_o}/complete", payload: {}, as: FieldSupervisor }
            - { call: "POST /packinghouse/caretaking-invoices", payload: { grower_id: "${ig_g}", period_start: "2026-08-01", period_end: "2026-08-31" }, as: PoolAccountant, captures: { ig_inv: "$.data.id" } }
            - { call: "POST /packinghouse/growers/${ig_g}/terminate", payload: {}, as: PoolAccountant }
          trigger:
            - { call: "POST /packinghouse/caretaking-invoices/${ig_inv}/issue", payload: {}, as: PoolAccountant, captures: { ig_err: "$.data.error_id" } }
          assert:
            - "${ig_err} == ERR_GROWER_NOT_ACTIVE (issue requires grower.status != TERMINATED)"
            - "CaretakingInvoice.${ig_inv}.status remains DRAFT; CaretakingServiceOrder.${ig_o}.status remains COMPLETED with invoice_id null"

  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: crew_exclusive_half_open_overlap
        grounds:
          - calculations.crew_overlap_check
          - errors[ERR_CREW_WINDOW_OVERLAP]
        distinguishing_aspect: |
          Interval semantics = EXCLUSIVE half-open occupancy on the HarvestCrew
          resource: touching endpoints (A2 starts exactly when A1 ends) are
          accepted, but a one-hour intersection is rejected.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; grower, HAMLIN grove; crew CR-OV1 capacity 400"
          setup_api_calls:
            - { call: "POST /packinghouse/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PackinghouseAdmin }
            - { call: "POST /packinghouse/growers", payload: { grower_code: "GR-OV1", display_name: "Overlap Groves" }, as: PackinghouseAdmin, captures: { ov_g: "$.data.id" } }
            - { call: "POST /packinghouse/groves", payload: { grower_id: "${ov_g}", block_code: "B1", variety: HAMLIN, acreage: 50, county_code: "POLK" }, as: PackinghouseAdmin, captures: { ov_gr: "$.data.id" } }
            - { call: "POST /packinghouse/crews", payload: { crew_code: "CR-OV1", daily_capacity_boxes: 400 }, as: PackinghouseAdmin, captures: { ov_c: "$.data.id" } }
          trigger:
            - { call: "POST /packinghouse/harvest-assignments", payload: { crew_id: "${ov_c}", grove_id: "${ov_gr}", window_start: "2026-08-03T06:00:00Z", window_end: "2026-08-03T18:00:00Z", planned_boxes: 300 }, as: FieldSupervisor, captures: { ov_a1: "$.data.id" } }
            - { call: "POST /packinghouse/harvest-assignments", payload: { crew_id: "${ov_c}", grove_id: "${ov_gr}", window_start: "2026-08-03T18:00:00Z", window_end: "2026-08-04T06:00:00Z", planned_boxes: 300 }, as: FieldSupervisor, captures: { ov_a2: "$.data.id" } }
            - { call: "POST /packinghouse/harvest-assignments", payload: { crew_id: "${ov_c}", grove_id: "${ov_gr}", window_start: "2026-08-03T17:00:00Z", window_end: "2026-08-03T20:00:00Z", planned_boxes: 50 }, as: FieldSupervisor, captures: { ov_err: "$.data.error_id" } }
          assert:
            - "Assignment ${ov_a1} created for [06:00,18:00) and ${ov_a2} created for [18:00,next 06:00): adjacency is NOT a conflict (half-open semantics)"
            - "Third assignment [17:00,20:00) rejected: ${ov_err} == ERR_CREW_WINDOW_OVERLAP (intersects both A1's last hour and A2's first two hours)"

      - name: room_aggregate_capacity_overlap
        grounds:
          - calculations.degreening_capacity_check
        distinguishing_aspect: |
          Interval semantics = AGGREGATE CAPACITY on the DegreeningRoom resource
          (different resource and different semantics from the crew's exclusive
          occupancy): multiple sessions may overlap in time as long as the sum
          of overlapping boxes never exceeds capacity; reservations are
          [started_at, started_at + planned_hours) and expire on schedule.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; grower, HAMLIN grove, CURRENT PASS maturity, pool OPEN, crew + assignment IN_PROGRESS"
            - "Room RM cap 100; deliveries of 30, 50, 20, 20 boxes"
          setup_api_calls:
            - { call: "POST /packinghouse/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PackinghouseAdmin }
            - { call: "POST /packinghouse/growers", payload: { grower_code: "GR-OV2", display_name: "Room Overlap Groves" }, as: PackinghouseAdmin, captures: { ro_g: "$.data.id" } }
            - { call: "POST /packinghouse/groves", payload: { grower_id: "${ro_g}", block_code: "B1", variety: HAMLIN, acreage: 50, county_code: "POLK" }, as: PackinghouseAdmin, captures: { ro_gr: "$.data.id", ro_gr_v: "$.data.version" } }
            - { call: "POST /packinghouse/groves/${ro_gr}/maturity-tests", payload: { sampled_at: "2026-07-31T10:00:00Z", brix: 9.0, acid_pct: 1.0, juice_pct: 45.0, expected_grove_version: "${ro_gr_v}" }, as: QualityInspector, as_user_id: "qi_ov2" }
            - { call: "POST /packinghouse/pools", payload: { variety: HAMLIN, week_start: "2026-07-27" }, as: PoolAccountant }
            - { call: "POST /packinghouse/crews", payload: { crew_code: "CR-OV2", daily_capacity_boxes: 400 }, as: PackinghouseAdmin, captures: { ro_c: "$.data.id" } }
            - { call: "POST /packinghouse/degreening-rooms", payload: { room_code: "RM-OV2", capacity_boxes: 100, min_hours: 12, max_hours: 72 }, as: PackinghouseAdmin, captures: { ro_rm: "$.data.id" } }
            - { call: "POST /packinghouse/harvest-assignments", payload: { crew_id: "${ro_c}", grove_id: "${ro_gr}", window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-02T12:00:00Z", planned_boxes: 200 }, as: FieldSupervisor, captures: { ro_a: "$.data.id" } }
            - { call: "POST /packinghouse/harvest-assignments/${ro_a}/start", payload: {}, as: FieldSupervisor }
            - { call: "POST /packinghouse/deliveries", payload: { grove_id: "${ro_gr}", assignment_id: "${ro_a}", gross_boxes: 30, tare_boxes: 0 }, as: FieldSupervisor, captures: { ro_d1: "$.data.id" } }
            - { call: "POST /packinghouse/deliveries", payload: { grove_id: "${ro_gr}", assignment_id: "${ro_a}", gross_boxes: 50, tare_boxes: 0 }, as: FieldSupervisor, captures: { ro_d2: "$.data.id" } }
            - { call: "POST /packinghouse/deliveries", payload: { grove_id: "${ro_gr}", assignment_id: "${ro_a}", gross_boxes: 20, tare_boxes: 0 }, as: FieldSupervisor, captures: { ro_d3: "$.data.id" } }
            - { call: "POST /packinghouse/deliveries", payload: { grove_id: "${ro_gr}", assignment_id: "${ro_a}", gross_boxes: 20, tare_boxes: 0 }, as: FieldSupervisor, captures: { ro_d4: "$.data.id" } }
          trigger:
            - { call: "POST /packinghouse/degreening-sessions", payload: { room_id: "${ro_rm}", delivery_id: "${ro_d1}", boxes: 30, planned_hours: 48 }, as: LineOperator, as_user_id: "op_ov2", captures: { ro_s1: "$.data.id" } }
            - { call: "POST /packinghouse/degreening-sessions", payload: { room_id: "${ro_rm}", delivery_id: "${ro_d2}", boxes: 50, planned_hours: 24 }, as: LineOperator, as_user_id: "op_ov2", captures: { ro_s2: "$.data.id" } }
            - { call: "POST /packinghouse/degreening-sessions", payload: { room_id: "${ro_rm}", delivery_id: "${ro_d3}", boxes: 20, planned_hours: 12 }, as: LineOperator, as_user_id: "op_ov2", captures: { ro_s3: "$.data.id" } }
            - { call: "POST /packinghouse/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T13:00:00Z" }, as: PackinghouseAdmin }
            - { call: "POST /packinghouse/degreening-sessions", payload: { room_id: "${ro_rm}", delivery_id: "${ro_d4}", boxes: 20, planned_hours: 12 }, as: LineOperator, as_user_id: "op_ov2", captures: { ro_s4: "$.data.id" } }
          assert:
            - "Sessions ${ro_s1} (48h), ${ro_s2} (24h), ${ro_s3} (12h) all coexist in CONDITIONING: overlap is PERMITTED while the box sum (100) <= capacity — unlike the crew's exclusive rule"
            - "At 2026-08-01T13:00:00Z the 12h reservation of ${ro_s3} has expired, so occupying boxes = 30 + 50 = 80 and session ${ro_s4} (20 boxes, 12h) is accepted (80 + 20 <= 100)"
            - "All four sessions remain CONDITIONING (release is a separate explicit transition)"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: pool_totals_conserved_under_post_and_reverse
        grounds:
          - state_machines.SortRun.VERIFIED_to_POSTED
          - state_machines.SortRun.POSTED_to_VOIDED
          - calculations.ge_box_conversion
        distinguishing_aspect: |
          Conserved quantity = pool posted aggregates and channel remaining
          (a COMMODITY-conservation invariant): post adds (ge 11.5, proceeds
          6000, sorted boxes 10; DOM remaining 10 -> 0) and its compensating
          reverse restores every field bit-for-bit; provisional returns 600.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; grower, VALENCIA grove with CURRENT PASS maturity (VALENCIA mins ratio 9.0 / brix 9.0 / juice 45.0)"
            - "Pool VALENCIA wk 2026-07-27 OPEN; channels DOM 10@600 rank1 [FANCY], JUICE @220 rank9; pre-post provisional 600 (0.8*10*600 / (0.8*10))"
            - "Delivery 10 net boxes; sort run 10F color 8 defect 5 created and VERIFIED"
          setup_api_calls:
            - { call: "POST /packinghouse/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PackinghouseAdmin }
            - { call: "POST /packinghouse/growers", payload: { grower_code: "GR-CI1", display_name: "Conserved Pool Groves" }, as: PackinghouseAdmin, captures: { ci_g: "$.data.id" } }
