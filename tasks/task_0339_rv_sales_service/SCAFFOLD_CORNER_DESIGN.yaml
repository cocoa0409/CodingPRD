# =============================================================================
# §1.9 Scaffold Corner Design (breadth probe)
# Walks references/claim-extraction-guide.md against this scaffold's §1.1–§1.7.
# Every active instance is reachable from empty-DB via §1.5 (flat top-level)
# endpoints; every excluded_because stub cites a §1.8 instance by name.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_dealership_returns_201_with_system_fields
        claim_type: Creation
        grounds:
          - 'entities.Dealership'
          - 'endpoints["POST /dealerships"]'
        distinguishing_aspect: "POST /dealerships with all required fields returns 201; id, created_at, version=1, current_utc=epoch present."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /dealerships"
              payload: { name: "Acme RV", state_code: "TX", doc_fee_cents: 15000, sales_tax_rate_bps: 625 }
              as: DealerManager
              captures: { did: $.data.id, v: $.data.version }
          assert:
            - "response code == 201"
            - "Dealership.${did}.version == 1 and current_utc == 1970-01-01T00:00:00.000Z"

      - name: get_unit_nonexistent_returns_not_found
        claim_type: Not Found
        grounds:
          - 'entities.Unit'
          - 'errors[ERR_UNIT_NOT_FOUND]'
          - 'endpoints["GET /units/{unitId}"]'
        distinguishing_aspect: "GET a non-existent unit id returns ERR_UNIT_NOT_FOUND (404)."
        test_recipe:
          setup: ["dealership exists, no units"]
          setup_api_calls:
            - call: "POST /dealerships"
              payload: { name: "NF RV", state_code: "TX", doc_fee_cents: 0, sales_tax_rate_bps: 0 }
              as: DealerManager
              captures: { did: $.data.id }
          trigger:
            - call: "GET /units/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: SalesAgent
              captures: { err: $.data.error_id }
          assert:
            - "response code == 404 and error_id == ERR_UNIT_NOT_FOUND"

      - name: create_customer_missing_email_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - 'entities.Customer.fields.email'
          - 'errors[ERR_INVALID_REQUEST]'
          - 'endpoints["POST /customers"]'
        distinguishing_aspect: "POST customer without required email field returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["dealership exists"]
          setup_api_calls:
            - call: "POST /dealerships"
              payload: { name: "Req RV", state_code: "TX", doc_fee_cents: 0, sales_tax_rate_bps: 0 }
              as: DealerManager
              captures: { did: $.data.id }
          trigger:
            - call: "POST /customers"
              payload: { dealership_id: "${did}", full_name: "No Email" }
              as: SalesAgent
              captures: { err: $.data.error_id }
          assert:
            - "response code == 400 and error_id == ERR_INVALID_REQUEST"

      - name: customer_credit_tier_default_standard
        claim_type: Defaults
        grounds:
          - 'entities.Customer.fields.credit_tier'
          - 'endpoints["POST /customers"]'
        distinguishing_aspect: "Omitting credit_tier applies default STANDARD."
        test_recipe:
          setup: ["dealership exists"]
          setup_api_calls:
            - call: "POST /dealerships"
              payload: { name: "Def RV", state_code: "TX", doc_fee_cents: 0, sales_tax_rate_bps: 0 }
              as: DealerManager
              captures: { did: $.data.id }
          trigger:
            - call: "POST /customers"
              payload: { dealership_id: "${did}", full_name: "Defaulter", email: "def@x.com" }
              as: SalesAgent
              captures: { cust: $.data.id }
          assert:
            - "Customer.${cust}.credit_tier == STANDARD"

      - name: part_qty_available_computed_from_reservations
        claim_type: Computed Fields
        grounds:
          - 'entities.PartItem.fields.qty_available'
          - 'entities.PartItem.fields.qty_reserved'
          - 'endpoints["POST /part-reservations"]'
        distinguishing_aspect: "PartItem.qty_available is computed = qty_on_hand - qty_reserved; reserving 3 of 10 yields qty_available 7."
        test_recipe:
          setup: ["part qty 10; open SO started; reserve 3"]
          setup_api_calls:
            - call: "POST /dealerships"
              payload: { name: "Comp RV", state_code: "TX", doc_fee_cents: 0, sales_tax_rate_bps: 0 }
              as: DealerManager
              captures: { did: $.data.id }
            - call: "POST /customers"
              payload: { dealership_id: "${did}", full_name: "Cmp Owner", email: "cmp@x.com" }
              as: ServiceAdvisor
              captures: { cust: $.data.id }
            - call: "POST /units"
              payload: { dealership_id: "${did}", vin: "VIN-CMP-1", model_year: 2022, class_type: "CLASS_C", acquisition: "STOCK", list_price_cents: 5000000 }
              as: SalesAgent
              captures: { unit: $.data.id }
            - call: "POST /part-items"
              payload: { dealership_id: "${did}", sku: "HOSE-1", name: "Hose", unit_price_cents: 4000, qty_on_hand: 10 }
              as: ServiceAdvisor
              captures: { part: $.data.id }
            - call: "POST /service-orders"
              payload: { dealership_id: "${did}", unit_id: "${unit}", customer_id: "${cust}", labor_hours: 1.0, labor_rate_cents: 10000 }
              as: ServiceAdvisor
              captures: { so: $.data.id }
            - call: "POST /service-orders/${so}/start"
              payload: {}
              as: ServiceAdvisor
          trigger:
            - call: "POST /part-reservations"
              payload: { service_order_id: "${so}", part_item_id: "${part}", quantity: 3 }
              as: ServiceAdvisor
          assert:
            - "PartItem.${part}.qty_reserved == 3 and qty_available == 7"

      - name: unit_invalid_class_type_enum_rejected
        claim_type: Type Constraints
        grounds:
          - 'entities.Unit.fields.class_type'
          - 'errors[ERR_INVALID_REQUEST]'
          - 'endpoints["POST /units"]'
        distinguishing_aspect: "POST unit with class_type not in the enum set returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["dealership exists"]
          setup_api_calls:
            - call: "POST /dealerships"
              payload: { name: "Enum RV", state_code: "TX", doc_fee_cents: 0, sales_tax_rate_bps: 0 }
              as: DealerManager
              captures: { did: $.data.id }
          trigger:
            - call: "POST /units"
              payload: { dealership_id: "${did}", vin: "VIN-EN-1", model_year: 2024, class_type: "SPACESHIP", acquisition: "STOCK", list_price_cents: 5000000 }
              as: SalesAgent
              captures: { err: $.data.error_id }
          assert:
            - "response code == 400 and error_id == ERR_INVALID_REQUEST"

      - name: consignment_unit_requires_consignor
        claim_type: Parent Relationships
        grounds:
          - 'entities.Unit.fields.consignor_customer_id'
          - 'errors[ERR_CONSIGNOR_REQUIRED]'
          - 'validations[priority=6]'
        distinguishing_aspect: "acquisition==CONSIGNMENT without consignor_customer_id returns ERR_CONSIGNOR_REQUIRED (409)."
        test_recipe:
          setup: ["dealership exists"]
          setup_api_calls:
            - call: "POST /dealerships"
              payload: { name: "ConsC RV", state_code: "TX", doc_fee_cents: 0, sales_tax_rate_bps: 0 }
              as: DealerManager
              captures: { did: $.data.id }
          trigger:
            - call: "POST /units"
              payload: { dealership_id: "${did}", vin: "VIN-CS-1", model_year: 2024, class_type: "CLASS_A", acquisition: "CONSIGNMENT", list_price_cents: 9000000 }
              as: SalesAgent
              captures: { err: $.data.error_id }
          assert:
            - "response code == 409 and error_id == ERR_CONSIGNOR_REQUIRED"

      - name: stock_unit_with_consignor_rejected
        claim_type: Type Constraints
        grounds:
          - 'entities.Unit.fields.consignor_customer_id'
          - 'errors[ERR_CONSIGNOR_NOT_ALLOWED]'
          - 'validations[priority=6]'
        distinguishing_aspect: "acquisition==STOCK with a consignor_customer_id supplied returns ERR_CONSIGNOR_NOT_ALLOWED (409)."
        test_recipe:
          setup: ["dealership + one customer to use as bogus consignor"]
          setup_api_calls:
            - call: "POST /dealerships"
              payload: { name: "Stk RV", state_code: "TX", doc_fee_cents: 0, sales_tax_rate_bps: 0 }
              as: DealerManager
              captures: { did: $.data.id }
            - call: "POST /customers"
              payload: { dealership_id: "${did}", full_name: "Bogus", email: "bogus@x.com" }
              as: SalesAgent
              captures: { cust: $.data.id }
          trigger:
            - call: "POST /units"
              payload: { dealership_id: "${did}", vin: "VIN-SK-1", model_year: 2024, class_type: "CLASS_C", acquisition: "STOCK", consignor_customer_id: "${cust}", list_price_cents: 5000000 }
              as: SalesAgent
              captures: { err: $.data.error_id }
          assert:
            - "response code == 409 and error_id == ERR_CONSIGNOR_NOT_ALLOWED"

      - name: duplicate_vin_rejected
        claim_type: Type Constraints
        grounds:
          - 'entities.Unit.fields.vin'
          - 'errors[ERR_DUPLICATE_VIN]'
          - 'validations[priority=13]'
        distinguishing_aspect: "Second unit with the same vin in the same dealership returns ERR_DUPLICATE_VIN (409)."
        test_recipe:
          setup: ["dealership with one unit vin VIN-DUP"]
          setup_api_calls:
            - call: "POST /dealerships"
              payload: { name: "Dup RV", state_code: "TX", doc_fee_cents: 0, sales_tax_rate_bps: 0 }
              as: DealerManager
              captures: { did: $.data.id }
            - call: "POST /units"
              payload: { dealership_id: "${did}", vin: "VIN-DUP", model_year: 2024, class_type: "CLASS_C", acquisition: "STOCK", list_price_cents: 5000000 }
              as: SalesAgent
              captures: { unit1: $.data.id }
          trigger:
            - call: "POST /units"
              payload: { dealership_id: "${did}", vin: "VIN-DUP", model_year: 2023, class_type: "CLASS_B", acquisition: "STOCK", list_price_cents: 4000000 }
              as: SalesAgent
              captures: { err: $.data.error_id }
          assert:
            - "response code == 409 and error_id == ERR_DUPLICATE_VIN"

      - name: doc_fee_over_cap_rejected
        claim_type: Type Constraints
        grounds:
          - 'entities.Dealership.fields.doc_fee_cents'
          - 'errors[ERR_DOC_FEE_OVER_CAP]'
          - 'validations[priority=13]'
        distinguishing_aspect: "Creating a dealership with doc_fee_cents above the cap returns ERR_DOC_FEE_OVER_CAP (400)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /dealerships"
              payload: { name: "Cap RV", state_code: "TX", doc_fee_cents: 99999999, sales_tax_rate_bps: 625 }
              as: DealerManager
              captures: { err: $.data.error_id }
          assert:
            - "response code == 400 and error_id == ERR_DOC_FEE_OVER_CAP"

      - name: list_units_pagination_shape
        claim_type: Listing
        grounds:
          - 'entities.Unit'
          - 'endpoints["GET /units"]'
        distinguishing_aspect: "GET /units returns array envelope with total_count and has_more pagination fields."
        test_recipe:
          setup: ["dealership with 2 units"]
          setup_api_calls:
            - call: "POST /dealerships"
              payload: { name: "Pag RV", state_code: "TX", doc_fee_cents: 0, sales_tax_rate_bps: 0 }
              as: DealerManager
              captures: { did: $.data.id }
            - call: "POST /units"
              payload: { dealership_id: "${did}", vin: "VIN-P1", model_year: 2024, class_type: "CLASS_C", acquisition: "STOCK", list_price_cents: 5000000 }
              as: SalesAgent
            - call: "POST /units"
              payload: { dealership_id: "${did}", vin: "VIN-P2", model_year: 2024, class_type: "CLASS_B", acquisition: "STOCK", list_price_cents: 4000000 }
              as: SalesAgent
          trigger:
            - call: "GET /units"
              payload: { dealership_id: "${did}", limit: 1, offset: 0 }
              as: SalesAgent
          assert:
            - "response_type == array; meta has total_count == 2 and has_more == true with limit 1"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: cancel_already_cancelled_deal_returns_terminal
        claim_type: Terminal State Lockdown
        grounds:
          - 'state_machines.Deal'
          - 'errors[ERR_DEAL_TERMINAL]'
          - 'endpoints["POST /deals/{dealId}/cancel"]'
        distinguishing_aspect: "Cancelling a deal already in CANCELLED returns ERR_DEAL_TERMINAL; no side effects fire."
        test_recipe:
          setup: ["a deal created then cancelled"]
          setup_api_calls:
            - call: "POST /dealerships"
              payload: { name: "Term RV", state_code: "TX", doc_fee_cents: 0, sales_tax_rate_bps: 0 }
              as: DealerManager
              captures: { did: $.data.id }
            - call: "POST /customers"
              payload: { dealership_id: "${did}", full_name: "Ter Buyer", email: "ter@x.com" }
              as: SalesAgent
              captures: { cust: $.data.id }
            - call: "POST /units"
              payload: { dealership_id: "${did}", vin: "VIN-TM-1", model_year: 2024, class_type: "CLASS_C", acquisition: "STOCK", list_price_cents: 7000000 }
              as: SalesAgent
              captures: { unit: $.data.id, unit_v: $.data.version }
            - call: "POST /deals"
              payload: { dealership_id: "${did}", unit_id: "${unit}", customer_id: "${cust}", sale_price_cents: 7000000, expected_unit_version: "${unit_v}" }
              as: SalesAgent
              captures: { deal: $.data.id }
            - call: "POST /deals/${deal}/cancel"
              payload: {}
              as: SalesAgent
          trigger:
            - call: "POST /deals/${deal}/cancel"
              payload: {}
              as: SalesAgent
              captures: { err: $.data.error_id }
          assert:
            - "response code == 409 and error_id == ERR_DEAL_TERMINAL"

      - name: start_service_order_not_open_returns_bad_state
        claim_type: Invalid Transitions
        grounds:
          - 'state_machines.ServiceOrder.IN_PROGRESS_to_AWAITING_PARTS'
          - 'errors[ERR_SO_BAD_STATE]'
          - 'endpoints["POST /service-orders/{soId}/start"]'
        distinguishing_aspect: "Calling start on an already IN_PROGRESS order returns ERR_SO_BAD_STATE (start valid only from OPEN)."
        test_recipe:
          setup: ["SO started (IN_PROGRESS)"]
          setup_api_calls:
            - call: "POST /dealerships"
              payload: { name: "SObad RV", state_code: "TX", doc_fee_cents: 0, sales_tax_rate_bps: 0 }
              as: DealerManager
              captures: { did: $.data.id }
            - call: "POST /customers"
              payload: { dealership_id: "${did}", full_name: "Sob Owner", email: "sob@x.com" }
              as: ServiceAdvisor
              captures: { cust: $.data.id }
            - call: "POST /units"
              payload: { dealership_id: "${did}", vin: "VIN-SB-1", model_year: 2022, class_type: "CLASS_C", acquisition: "STOCK", list_price_cents: 5000000 }
              as: SalesAgent
              captures: { unit: $.data.id }
            - call: "POST /service-orders"
              payload: { dealership_id: "${did}", unit_id: "${unit}", customer_id: "${cust}", labor_hours: 1.0, labor_rate_cents: 10000 }
              as: ServiceAdvisor
              captures: { so: $.data.id }
            - call: "POST /service-orders/${so}/start"
              payload: {}
              as: ServiceAdvisor
          trigger:
            - call: "POST /service-orders/${so}/start"
              payload: {}
              as: ServiceAdvisor
              captures: { err: $.data.error_id }
          assert:
            - "response code == 409 and error_id == ERR_SO_BAD_STATE"

      - name: complete_from_awaiting_parts_returns_bad_state
        claim_type: Invalid Transitions
        grounds:
          - 'state_machines.ServiceOrder.IN_PROGRESS_to_COMPLETED'
          - 'errors[ERR_SO_BAD_STATE]'
          - 'endpoints["POST /service-orders/{soId}/complete"]'
        distinguishing_aspect: "Completing while AWAITING_PARTS returns ERR_SO_BAD_STATE (complete legal only from IN_PROGRESS)."
        test_recipe:
          setup: ["SO in AWAITING_PARTS"]
          setup_api_calls:
            - call: "POST /dealerships"
              payload: { name: "Out RV", state_code: "TX", doc_fee_cents: 0, sales_tax_rate_bps: 0 }
              as: DealerManager
              captures: { did: $.data.id }
            - call: "POST /customers"
              payload: { dealership_id: "${did}", full_name: "Out Owner", email: "out@x.com" }
              as: ServiceAdvisor
              captures: { cust: $.data.id }
            - call: "POST /units"
              payload: { dealership_id: "${did}", vin: "VIN-OUT-1", model_year: 2022, class_type: "CLASS_C", acquisition: "STOCK", list_price_cents: 5000000 }
              as: SalesAgent
              captures: { unit: $.data.id }
            - call: "POST /service-orders"
              payload: { dealership_id: "${did}", unit_id: "${unit}", customer_id: "${cust}", labor_hours: 1.0, labor_rate_cents: 10000 }
              as: ServiceAdvisor
              captures: { so: $.data.id }
            - call: "POST /service-orders/${so}/start"
              payload: {}
              as: ServiceAdvisor
            - call: "POST /service-orders/${so}/await-parts"
              payload: {}
              as: ServiceAdvisor
          trigger:
            - call: "POST /service-orders/${so}/complete"
              payload: {}
              as: ServiceAdvisor
              captures: { err: $.data.error_id }
          assert:
            - "response code == 409 and error_id == ERR_SO_BAD_STATE"

      - name: new_deal_initial_states_draft_none
        claim_type: Initial State
        grounds:
          - 'state_machines.Deal'
          - 'entities.Deal.fields.sale_status'
          - 'entities.Deal.fields.finance_status'
        distinguishing_aspect: "A freshly created deal has sale_status DRAFT and finance_status NONE; unit becomes HELD."
        test_recipe:
          setup: ["available unit + customer"]
          setup_api_calls:
            - call: "POST /dealerships"
              payload: { name: "Init RV", state_code: "TX", doc_fee_cents: 0, sales_tax_rate_bps: 0 }
              as: DealerManager
              captures: { did: $.data.id }
            - call: "POST /customers"
              payload: { dealership_id: "${did}", full_name: "Ini Buyer", email: "ini@x.com" }
              as: SalesAgent
              captures: { cust: $.data.id }
            - call: "POST /units"
              payload: { dealership_id: "${did}", vin: "VIN-IN-1", model_year: 2024, class_type: "CLASS_C", acquisition: "STOCK", list_price_cents: 7000000 }
              as: SalesAgent
              captures: { unit: $.data.id, unit_v: $.data.version }
          trigger:
            - call: "POST /deals"
              payload: { dealership_id: "${did}", unit_id: "${unit}", customer_id: "${cust}", sale_price_cents: 7000000, expected_unit_version: "${unit_v}" }
              as: SalesAgent
              captures: { deal: $.data.id }
          assert:
            - "Deal.${deal}.sale_status == DRAFT and finance_status == NONE"
            - "Unit.${unit}.status == HELD (deal hold side effect)"

      - name: deliver_before_walkthrough_returns_bad_sale_state
        claim_type: Invalid Transitions
        grounds:
          - 'state_machines.Deal.sale_status=WALKTHROUGH_to_sale_status=DELIVERED'
          - 'errors[ERR_DEAL_BAD_SALE_STATE]'
          - 'endpoints["POST /deals/{dealId}/deliver"]'
        distinguishing_aspect: "Calling deliver on a deal still in QUOTED (not WALKTHROUGH) returns ERR_DEAL_BAD_SALE_STATE."
        test_recipe:
          setup: ["a quoted CASH deal not yet through PDI"]
          setup_api_calls:
            - call: "POST /dealerships"
              payload: { name: "Early RV", state_code: "TX", doc_fee_cents: 0, sales_tax_rate_bps: 0 }
              as: DealerManager
              captures: { did: $.data.id }
            - call: "POST /customers"
              payload: { dealership_id: "${did}", full_name: "Ear Buyer", email: "ear@x.com" }
              as: SalesAgent
              captures: { cust: $.data.id }
            - call: "POST /units"
              payload: { dealership_id: "${did}", vin: "VIN-EA-1", model_year: 2024, class_type: "CLASS_C", acquisition: "STOCK", list_price_cents: 7000000 }
              as: SalesAgent
              captures: { unit: $.data.id, unit_v: $.data.version }
            - call: "POST /deals"
              payload: { dealership_id: "${did}", unit_id: "${unit}", customer_id: "${cust}", sale_price_cents: 7000000, expected_unit_version: "${unit_v}" }
              as: SalesAgent
              captures: { deal: $.data.id }
            - call: "POST /deals/${deal}/quote"
              payload: {}
              as: SalesAgent
          trigger:
            - call: "POST /deals/${deal}/deliver"
              payload: {}
              as: SalesAgent
              captures: { err: $.data.error_id }
          assert:
            - "response code == 409 and error_id == ERR_DEAL_BAD_SALE_STATE"

      - name: close_recall_with_outstanding_remedies_blocked
        claim_type: Precondition Enforcement
        grounds:
          - 'state_machines.RecallCampaign.OPEN_to_CLOSED'
          - 'errors[ERR_REMEDIES_OUTSTANDING]'
          - 'endpoints["POST /recall-campaigns/{rcId}/close"]'
        distinguishing_aspect: "Closing a campaign with a PENDING RecallRemedy on an in-scope unit returns ERR_REMEDIES_OUTSTANDING."
        test_recipe:
          setup: ["a unit in scope; open campaign auto-creates a PENDING remedy"]
          setup_api_calls:
            - call: "POST /dealerships"
              payload: { name: "Rc RV", state_code: "TX", doc_fee_cents: 0, sales_tax_rate_bps: 0 }
              as: DealerManager
              captures: { did: $.data.id }
            - call: "POST /units"
              payload: { dealership_id: "${did}", vin: "VIN-RCC-1", model_year: 2024, class_type: "CLASS_A", acquisition: "STOCK", list_price_cents: 9000000 }
              as: SalesAgent
              captures: { unit: $.data.id }
            - call: "POST /recall-campaigns"
              payload: { dealership_id: "${did}", campaign_code: "RC-CLOSE-1", target_class_type: "CLASS_A", target_model_year: 2024, severity: "ADVISORY" }
              as: DealerManager
              captures: { rc: $.data.id }
          trigger:
            - call: "POST /recall-campaigns/${rc}/close"
              payload: {}
              as: DealerManager
              captures: { err: $.data.error_id }
          assert:
            - "response code == 409 and error_id == ERR_REMEDIES_OUTSTANDING"

      - name: return_consignment_on_stock_unit_rejected
        claim_type: Precondition Enforcement
        grounds:
          - 'state_machines.Unit.AVAILABLE_to_CONSIGNMENT_RETURNED'
          - 'errors[ERR_NOT_CONSIGNMENT]'
          - 'endpoints["POST /units/{unitId}/return-consignment"]'
        distinguishing_aspect: "return-consignment on a STOCK unit returns ERR_NOT_CONSIGNMENT (409)."
        test_recipe:
          setup: ["a STOCK unit"]
          setup_api_calls:
            - call: "POST /dealerships"
              payload: { name: "RetC RV", state_code: "TX", doc_fee_cents: 0, sales_tax_rate_bps: 0 }
              as: DealerManager
              captures: { did: $.data.id }
            - call: "POST /units"
              payload: { dealership_id: "${did}", vin: "VIN-RC2-1", model_year: 2024, class_type: "CLASS_C", acquisition: "STOCK", list_price_cents: 5000000 }
              as: SalesAgent
              captures: { unit: $.data.id }
          trigger:
            - call: "POST /units/${unit}/return-consignment"
              payload: {}
              as: ServiceAdvisor
              captures: { err: $.data.error_id }
          assert:
            - "response code == 409 and error_id == ERR_NOT_CONSIGNMENT"

      - name: pdi_fail_keeps_deal_in_pdi_pending
        claim_type: Side Effect Execution
        grounds:
          - 'state_machines.Deal.sale_status=PDI_PENDING_to_sale_status=WALKTHROUGH'
          - 'entities.PdiInspection.fields.result'
          - 'endpoints["POST /pdi-inspections"]'
        distinguishing_aspect: "A PDI with defects_found 2 yields result FAIL and leaves the deal in PDI_PENDING (no advance)."
        test_recipe:
          setup: ["deal in PDI_PENDING (cash, quoted, start-pdi)"]
          setup_api_calls:
            - call: "POST /dealerships"
