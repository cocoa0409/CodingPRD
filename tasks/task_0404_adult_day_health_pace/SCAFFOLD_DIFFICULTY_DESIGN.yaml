  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: disenroll_finalize_cascade_depth3
        grounds:
          - state_machines.Participant.DISENROLLMENT_PENDING_to_DISENROLLED
          - state_machines.CarePlan.ACTIVE_to_SUPERSEDED
          - state_machines.MedicationOrder.ACTIVE_to_DISCONTINUED
        distinguishing_aspect: |
          Depth-3 cascade from disenrollment finalize: finalize mutates Participant→DISENROLLED, which supersedes
          the ACTIVE CarePlan (link 2 caused by link 1), which discontinues that plan's ACTIVE MedicationOrder
          (link 3 caused by link 2) — each hop caused by the previous, not a fan-out.
        test_recipe:
          setup:
            - "ENROLLED participant with an ACTIVE care plan that has one ACTIVE medication order; APPROVED voluntary disenrollment effective 2026-08-01."
          setup_api_calls:
            - call: "POST /pace/programs"
