# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Task 1975: Fireworks Display Permitting & Show Operations
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  # Rule 1 — dual_variant_calc (different entity domains: site geometry vs permit fiscal)
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: fallout_radius_provisional_vs_final_site_plan
        grounds:
          - calculations.c_fallout_base
          - entities.SitePlan.fields.required_spectator_distance_ft
          - entities.DisplayEvent.fields.final_fallout_radius_ft
        distinguishing_aspect: |
          The provisional variant keys on the DECLARED max shell diameter stored via the
          SitePlan (5 in -> 350 ft at plan creation), while the final variant keys on the
          max diameter of product ACTUALLY checked out to the show (6 in -> 420 ft at GO);
          identical site geometry therefore yields 350 != 420 across the two variants.
        test_recipe:
          setup:
            - "Operator with license covering 2026-09-01; event at VEN-A declared 5in shells, boundary 500 ft"
            - "Permit APPROVED, standby confirmed; 6in batch checked out (gate: 70*6=420 <= 500)"
            - "Security post r=500 arc=30 (required_guards=3) SECURED; LEAD crew; event READY; fresh calm reading at show time"
          setup_api_calls:
            - { call: "POST /pyro/operators", payload: { legal_name: "Pyro Co", atf_license_number: "ATF-001", license_class: "DISPLAY_1_3G", license_valid_from: "2026-01-01T00:00:00Z", license_expires_at: "2027-01-01T00:00:00Z" }, as: SystemAdmin, captures: { op: $.data.id } }
            - { call: "POST /pyro/displays", payload: { venue_id: "VEN-A", venue_name: "Fairgrounds", scheduled_start_at: "2026-09-01T20:00:00Z", scheduled_end_at: "2026-09-01T23:00:00Z", declared_max_shell_diameter_in: 5 }, as: Operator, as_user_id: "${op}", captures: { ev: $.data.id, ev_v: $.data.version } }
            - { call: "POST /pyro/displays/${ev}/site-plans", payload: { diagram_ref: "D1", launch_area_width_ft: 200, launch_area_length_ft: 200, spectator_boundary_ft: 500, spectator_arc_center_deg: 0, nearest_structure_ft: 600, expected_display_event_version: "${ev_v}" }, as: Operator, as_user_id: "${op}", captures: { sp: $.data.id, sp_rsd: $.data.required_spectator_distance_ft } }
            - { call: "POST /pyro/displays/${ev}/permit-applications", payload: { site_plan_id: "${sp}", standby_engines: 1 }, as: Operator, as_user_id: "${op}", captures: { app: $.data.id } }
            - { call: "POST /pyro/permit-applications/${app}/approve", payload: { decision_note: "ok" }, as: FireMarshal, as_user_id: "fm_1" }
            - { call: "POST /pyro/displays/${ev}/standby-confirm", payload: { standby_engines_on_site: 1 }, as: FireMarshal, as_user_id: "fm_2" }
            - { call: "POST /pyro/magazines", payload: { name: "MAG-1", atf_magazine_permit: "P-1", magazine_type: "OUTDOOR", capacity_new_lbs: 100.00, inspection_due_at: "2027-01-01T00:00:00Z" }, as: Operator, as_user_id: "${op}", captures: { mag: $.data.id } }
            - { call: "POST /pyro/magazines/${mag}/batches", payload: { product_name: "Shell 6in", un_number: "UN0335", shell_diameter_in: 6, quantity_units: 10, new_per_unit_lbs: 0.50, lot_number: "L6" }, as: Operator, as_user_id: "${op}", captures: { b1: $.data.id } }
            - { call: "POST /pyro/batches/${b1}/movements", payload: { movement_type: "CHECK_OUT", quantity: 10, display_event_id: "${ev}", driver_name: "Dan", vehicle_placard: "1.3G", cdl_hazmat_endorsed: true }, as: Operator, as_user_id: "${op}" }
            - { call: "POST /pyro/operators/${op}/crew-members", payload: { full_name: "Lee", cert_level: "LEAD_OPERATOR", cert_expires_at: "2027-06-01T00:00:00Z", hazmat_endorsed: true }, as: Operator, as_user_id: "${op}", captures: { crew: $.data.id } }
            - { call: "POST /pyro/displays/${ev}/security-posts", payload: { post_label: "N", arc_degrees: 30, radius_ft: 500 }, as: Operator, as_user_id: "${op}", captures: { post: $.data.id } }
            - { call: "POST /pyro/security-posts/${post}/assign", payload: { guard_name: "g1", guard_company: "SEC" }, as: Operator, as_user_id: "${op}" }
            - { call: "POST /pyro/security-posts/${post}/assign", payload: { guard_name: "g2", guard_company: "SEC" }, as: Operator, as_user_id: "${op}" }
            - { call: "POST /pyro/security-posts/${post}/assign", payload: { guard_name: "g3", guard_company: "SEC" }, as: Operator, as_user_id: "${op}" }
            - { call: "POST /pyro/displays/${ev}/ready", payload: {}, as: Operator, as_user_id: "${op}" }
            - { call: "POST /pyro/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T19:30:00Z" }, as: SystemAdmin }
            - { call: "POST /pyro/displays/${ev}/weather-readings", payload: { wind_speed_mph: 5.0, gust_mph: 12.0, wind_direction_deg: 180, precipitation: false, source: "ON_SITE_ANEMOMETER" }, as: CrewMember, as_user_id: "${crew}" }
          trigger:
            - { call: "GET /pyro/displays/${ev}", payload: {}, as: Operator, as_user_id: "${op}", captures: { ev_go_v: $.data.version } }
            - { call: "POST /pyro/displays/${ev}/go-no-go", payload: { decision: "GO", expected_display_event_version: "${ev_go_v}" }, as: Operator, as_user_id: "${op}", captures: { final_r: $.data.final_fallout_radius_ft } }
          assert:
            - "SitePlan.${sp}.required_spectator_distance_ft == 350 (70 x declared 5)"
            - "DisplayEvent.${ev}.final_fallout_radius_ft == 420 (70 x allocated 6; wind 5 < DRIFT_THRESHOLD 8 so no adjustment)"
            - "350 != 420 — provisional and final variants diverge on identical site data"
            - "DisplayEvent.${ev}.status == IN_PROGRESS and weather_decision == GO"

      - name: standby_fee_provisional_vs_final_permit
        grounds:
          - calculations.c_standby_fee
          - entities.PermitApplication.fields.provisional_standby_fee_cents
          - entities.DisplayEvent.fields.final_standby_fee_cents
        distinguishing_aspect: |
          The provisional variant is a ceil-hour estimate on the scheduled window
          (3 h -> 25000 + 3*14500 + 1*30000 = 98500 cents) stored on the PermitApplication,
          while the final variant is minute-prorated on actual standby elapsed time
          (standby 19:07 -> closed 22:45 = 218 min -> round_half_up(218*14500/60) = 52683;
          25000 + 52683 + 30000 = 107683 cents) stored on the DisplayEvent — a fiscal
          entity domain, distinct from fallout_radius_provisional_vs_final_site_plan's
          site-geometry domain. 98500 != 107683.
        test_recipe:
          setup:
            - "Full happy path to CLOSED with standby_confirmed_at = 2026-09-01T19:07:00Z and closed_at = 2026-09-01T22:45:00Z"
            - "Scheduled window 20:00-23:00 (planned_hours = 3); standby_engines = 1"
            - "All 20 checked-out units expended so net checked-out == 0; no incidents"
          setup_api_calls:
            - { call: "POST /pyro/operators", payload: { legal_name: "Pyro Co", atf_license_number: "ATF-001", license_class: "DISPLAY_1_3G", license_valid_from: "2026-01-01T00:00:00Z", license_expires_at: "2027-01-01T00:00:00Z" }, as: SystemAdmin, captures: { op: $.data.id } }
            - { call: "POST /pyro/displays", payload: { venue_id: "VEN-A", venue_name: "Fairgrounds", scheduled_start_at: "2026-09-01T20:00:00Z", scheduled_end_at: "2026-09-01T23:00:00Z", declared_max_shell_diameter_in: 4 }, as: Operator, as_user_id: "${op}", captures: { ev: $.data.id, ev_v: $.data.version } }
            - { call: "POST /pyro/displays/${ev}/site-plans", payload: { diagram_ref: "D1", launch_area_width_ft: 200, launch_area_length_ft: 200, spectator_boundary_ft: 300, spectator_arc_center_deg: 0, nearest_structure_ft: 500, expected_display_event_version: "${ev_v}" }, as: Operator, as_user_id: "${op}", captures: { sp: $.data.id } }
            - { call: "POST /pyro/displays/${ev}/permit-applications", payload: { site_plan_id: "${sp}", standby_engines: 1 }, as: Operator, as_user_id: "${op}", captures: { app: $.data.id, prov_fee: $.data.provisional_standby_fee_cents } }
            - { call: "POST /pyro/permit-applications/${app}/approve", payload: { decision_note: "ok" }, as: FireMarshal, as_user_id: "fm_1" }
            - { call: "POST /pyro/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T19:07:00Z" }, as: SystemAdmin }
            - { call: "POST /pyro/displays/${ev}/standby-confirm", payload: { standby_engines_on_site: 1 }, as: FireMarshal, as_user_id: "fm_2" }
            - { call: "POST /pyro/magazines", payload: { name: "MAG-1", atf_magazine_permit: "P-1", magazine_type: "OUTDOOR", capacity_new_lbs: 100.00, inspection_due_at: "2027-01-01T00:00:00Z" }, as: Operator, as_user_id: "${op}", captures: { mag: $.data.id } }
            - { call: "POST /pyro/magazines/${mag}/batches", payload: { product_name: "Shell 4in", un_number: "UN0335", shell_diameter_in: 4, quantity_units: 50, new_per_unit_lbs: 0.50, lot_number: "L1" }, as: Operator, as_user_id: "${op}", captures: { b1: $.data.id } }
            - { call: "POST /pyro/batches/${b1}/movements", payload: { movement_type: "CHECK_OUT", quantity: 20, display_event_id: "${ev}", driver_name: "Dan", vehicle_placard: "1.3G", cdl_hazmat_endorsed: true }, as: Operator, as_user_id: "${op}" }
            - { call: "POST /pyro/operators/${op}/crew-members", payload: { full_name: "Lee", cert_level: "LEAD_OPERATOR", cert_expires_at: "2027-06-01T00:00:00Z", hazmat_endorsed: true }, as: Operator, as_user_id: "${op}", captures: { crew: $.data.id } }
            - { call: "POST /pyro/displays/${ev}/security-posts", payload: { post_label: "N", arc_degrees: 45, radius_ft: 300 }, as: Operator, as_user_id: "${op}", captures: { post: $.data.id } }
            - { call: "POST /pyro/security-posts/${post}/assign", payload: { guard_name: "g1", guard_company: "SEC" }, as: Operator, as_user_id: "${op}" }
            - { call: "POST /pyro/security-posts/${post}/assign", payload: { guard_name: "g2", guard_company: "SEC" }, as: Operator, as_user_id: "${op}" }
            - { call: "POST /pyro/security-posts/${post}/assign", payload: { guard_name: "g3", guard_company: "SEC" }, as: Operator, as_user_id: "${op}" }
            - { call: "POST /pyro/displays/${ev}/ready", payload: {}, as: Operator, as_user_id: "${op}" }
            - { call: "POST /pyro/displays/${ev}/weather-readings", payload: { wind_speed_mph: 5.0, gust_mph: 12.0, wind_direction_deg: 180, precipitation: false, source: "ON_SITE_ANEMOMETER" }, as: CrewMember, as_user_id: "${crew}" }
            - { call: "GET /pyro/displays/${ev}", payload: {}, as: Operator, as_user_id: "${op}", captures: { ev_go_v: $.data.version } }
            - { call: "POST /pyro/displays/${ev}/go-no-go", payload: { decision: "GO", expected_display_event_version: "${ev_go_v}" }, as: Operator, as_user_id: "${op}" }
            - { call: "POST /pyro/batches/${b1}/movements", payload: { movement_type: "EXPEND", quantity: 20, display_event_id: "${ev}" }, as: Operator, as_user_id: "${op}" }
            - { call: "POST /pyro/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T22:30:00Z" }, as: SystemAdmin }
            - { call: "POST /pyro/displays/${ev}/complete-show", payload: {}, as: Operator, as_user_id: "${op}" }
            - { call: "POST /pyro/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T22:35:00Z" }, as: SystemAdmin }
            - { call: "POST /pyro/displays/${ev}/sweeps", payload: { sweep_type: "NIGHT_SWEEP", area_clear: true }, as: CrewMember, as_user_id: "${crew}", captures: { sw: $.data.id } }
            - { call: "POST /pyro/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T22:45:00Z" }, as: SystemAdmin }
          trigger:
            - { call: "POST /pyro/sweeps/${sw}/verify", payload: { verdict: "VERIFIED" }, as: FireMarshal, as_user_id: "fm_2" }
            - { call: "GET /pyro/displays/${ev}", payload: {}, as: Operator, as_user_id: "${op}", captures: { final_fee: $.data.final_standby_fee_cents, ev_status: $.data.status } }
          assert:
            - "PermitApplication.${app}.provisional_standby_fee_cents == 98500 (25000 + 3 x 14500 + 1 x 30000)"
            - "DisplayEvent.${ev}.final_standby_fee_cents == 107683 (25000 + round_half_up(218 x 14500 / 60) + 30000 = 25000 + 52683 + 30000)"
            - "DisplayEvent.${ev}.status == CLOSED (auto-close after VERIFIED sweep; no open incidents; net checked-out == 0)"
            - "98500 != 107683 — provisional estimate and minute-prorated final diverge"

  # ---------------------------------------------------------------------------
  # Rule 2 — combinatorial_formula (modes a, b, c)
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: wind_adjusted_fallout_downwind_branch
        grounds:
          - calculations.c_wind_adjusted_fallout
          - entities.DisplayEvent.fields.final_fallout_radius_ft
        distinguishing_aspect: |
          Mode (a): a >= 3-input non-linear formula (base radius, wind speed, angular
          distance branch). Two identical shows (6 in allocated, wind 12 mph from 180 deg,
          so downwind = 0 deg) differ only in spectator_arc_center_deg: E1 at 0 deg falls in
          the <= 45 deg branch (factor min(1+(12-8)*0.05, 1.5) = 1.2 -> 420 x 1.2 = 504 ft);
          E2 at 90 deg falls in the 45-135 deg branch (factor 1.1 -> 462 ft).
        test_recipe:
          setup:
            - "Two events E1 (VEN-W1, spectator_arc_center_deg 0) and E2 (VEN-W2, arc center 90), both declared 6 in, boundary 600 ft, APPROVED + READY with a 6 in batch checked out and SECURED post (r=600, arc=30 -> required_guards=4)"
            - "Clock 2026-09-01T19:30:00Z; identical reading on each event: wind 12.0 mph from 180 deg, gust 18.0, no precipitation"
          setup_api_calls:
            - { call: "POST /pyro/operators", payload: { legal_name: "Pyro Co", atf_license_number: "ATF-001", license_class: "DISPLAY_1_3G", license_valid_from: "2026-01-01T00:00:00Z", license_expires_at: "2027-01-01T00:00:00Z" }, as: SystemAdmin, captures: { op: $.data.id } }
            - { call: "POST /pyro/magazines", payload: { name: "MAG-1", atf_magazine_permit: "P-1", magazine_type: "OUTDOOR", capacity_new_lbs: 100.00, inspection_due_at: "2027-01-01T00:00:00Z" }, as: Operator, as_user_id: "${op}", captures: { mag: $.data.id } }
            - { call: "POST /pyro/magazines/${mag}/batches", payload: { product_name: "Shell 6in", un_number: "UN0335", shell_diameter_in: 6, quantity_units: 50, new_per_unit_lbs: 0.50, lot_number: "L6" }, as: Operator, as_user_id: "${op}", captures: { b1: $.data.id } }
            - { call: "POST /pyro/operators/${op}/crew-members", payload: { full_name: "Lee", cert_level: "LEAD_OPERATOR", cert_expires_at: "2027-06-01T00:00:00Z", hazmat_endorsed: true }, as: Operator, as_user_id: "${op}", captures: { crew: $.data.id } }
            - { call: "POST /pyro/displays", payload: { venue_id: "VEN-W1", venue_name: "North Field", scheduled_start_at: "2026-09-01T20:00:00Z", scheduled_end_at: "2026-09-01T23:00:00Z", declared_max_shell_diameter_in: 6 }, as: Operator, as_user_id: "${op}", captures: { e1: $.data.id, e1_v: $.data.version } }
            - { call: "POST /pyro/displays/${e1}/site-plans", payload: { diagram_ref: "D1", launch_area_width_ft: 200, launch_area_length_ft: 200, spectator_boundary_ft: 600, spectator_arc_center_deg: 0, nearest_structure_ft: 700, expected_display_event_version: "${e1_v}" }, as: Operator, as_user_id: "${op}", captures: { sp1: $.data.id } }
            - { call: "POST /pyro/displays/${e1}/permit-applications", payload: { site_plan_id: "${sp1}", standby_engines: 1 }, as: Operator, as_user_id: "${op}", captures: { app1: $.data.id } }
            - { call: "POST /pyro/permit-applications/${app1}/approve", payload: { decision_note: "ok" }, as: FireMarshal, as_user_id: "fm_1" }
            - { call: "POST /pyro/displays/${e1}/standby-confirm", payload: { standby_engines_on_site: 1 }, as: FireMarshal, as_user_id: "fm_2" }
            - { call: "POST /pyro/batches/${b1}/movements", payload: { movement_type: "CHECK_OUT", quantity: 10, display_event_id: "${e1}", driver_name: "Dan", vehicle_placard: "1.3G", cdl_hazmat_endorsed: true }, as: Operator, as_user_id: "${op}" }
            - { call: "POST /pyro/displays/${e1}/security-posts", payload: { post_label: "N", arc_degrees: 30, radius_ft: 600 }, as: Operator, as_user_id: "${op}", captures: { post1: $.data.id } }
            - { call: "POST /pyro/security-posts/${post1}/assign", payload: { guard_name: "g1", guard_company: "SEC" }, as: Operator, as_user_id: "${op}" }
            - { call: "POST /pyro/security-posts/${post1}/assign", payload: { guard_name: "g2", guard_company: "SEC" }, as: Operator, as_user_id: "${op}" }
            - { call: "POST /pyro/security-posts/${post1}/assign", payload: { guard_name: "g3", guard_company: "SEC" }, as: Operator, as_user_id: "${op}" }
            - { call: "POST /pyro/security-posts/${post1}/assign", payload: { guard_name: "g4", guard_company: "SEC" }, as: Operator, as_user_id: "${op}" }
            - { call: "POST /pyro/displays/${e1}/ready", payload: {}, as: Operator, as_user_id: "${op}" }
            - { call: "POST /pyro/displays", payload: { venue_id: "VEN-W2", venue_name: "South Field", scheduled_start_at: "2026-09-01T20:00:00Z", scheduled_end_at: "2026-09-01T23:00:00Z", declared_max_shell_diameter_in: 6 }, as: Operator, as_user_id: "${op}", captures: { e2: $.data.id, e2_v: $.data.version } }
            - { call: "POST /pyro/displays/${e2}/site-plans", payload: { diagram_ref: "D2", launch_area_width_ft: 200, launch_area_length_ft: 200, spectator_boundary_ft: 600, spectator_arc_center_deg: 90, nearest_structure_ft: 700, expected_display_event_version: "${e2_v}" }, as: Operator, as_user_id: "${op}", captures: { sp2: $.data.id } }
            - { call: "POST /pyro/displays/${e2}/permit-applications", payload: { site_plan_id: "${sp2}", standby_engines: 1 }, as: Operator, as_user_id: "${op}", captures: { app2: $.data.id } }
            - { call: "POST /pyro/permit-applications/${app2}/approve", payload: { decision_note: "ok" }, as: FireMarshal, as_user_id: "fm_1" }
            - { call: "POST /pyro/displays/${e2}/standby-confirm", payload: { standby_engines_on_site: 1 }, as: FireMarshal, as_user_id: "fm_2" }
            - { call: "POST /pyro/batches/${b1}/movements", payload: { movement_type: "CHECK_OUT", quantity: 10, display_event_id: "${e2}", driver_name: "Dan", vehicle_placard: "1.3G", cdl_hazmat_endorsed: true }, as: Operator, as_user_id: "${op}" }
            - { call: "POST /pyro/displays/${e2}/security-posts", payload: { post_label: "N", arc_degrees: 30, radius_ft: 600 }, as: Operator, as_user_id: "${op}", captures: { post2: $.data.id } }
            - { call: "POST /pyro/security-posts/${post2}/assign", payload: { guard_name: "g1", guard_company: "SEC" }, as: Operator, as_user_id: "${op}" }
            - { call: "POST /pyro/security-posts/${post2}/assign", payload: { guard_name: "g2", guard_company: "SEC" }, as: Operator, as_user_id: "${op}" }
            - { call: "POST /pyro/security-posts/${post2}/assign", payload: { guard_name: "g3", guard_company: "SEC" }, as: Operator, as_user_id: "${op}" }
            - { call: "POST /pyro/security-posts/${post2}/assign", payload: { guard_name: "g4", guard_company: "SEC" }, as: Operator, as_user_id: "${op}" }
            - { call: "POST /pyro/displays/${e2}/ready", payload: {}, as: Operator, as_user_id: "${op}" }
            - { call: "POST /pyro/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T19:30:00Z" }, as: SystemAdmin }
            - { call: "POST /pyro/displays/${e1}/weather-readings", payload: { wind_speed_mph: 12.0, gust_mph: 18.0, wind_direction_deg: 180, precipitation: false, source: "NWS" }, as: CrewMember, as_user_id: "${crew}" }
            - { call: "POST /pyro/displays/${e2}/weather-readings", payload: { wind_speed_mph: 12.0, gust_mph: 18.0, wind_direction_deg: 180, precipitation: false, source: "NWS" }, as: CrewMember, as_user_id: "${crew}" }
          trigger:
            - { call: "GET /pyro/displays/${e1}", payload: {}, as: Operator, as_user_id: "${op}", captures: { e1_go_v: $.data.version } }
            - { call: "POST /pyro/displays/${e1}/go-no-go", payload: { decision: "GO", expected_display_event_version: "${e1_go_v}" }, as: Operator, as_user_id: "${op}", captures: { r1: $.data.final_fallout_radius_ft } }
            - { call: "GET /pyro/displays/${e2}", payload: {}, as: Operator, as_user_id: "${op}", captures: { e2_go_v: $.data.version } }
            - { call: "POST /pyro/displays/${e2}/go-no-go", payload: { decision: "GO", expected_display_event_version: "${e2_go_v}" }, as: Operator, as_user_id: "${op}", captures: { r2: $.data.final_fallout_radius_ft } }
          assert:
            - "E1 DisplayEvent.${e1}.final_fallout_radius_ft == 504 (420 x 1.2, downwind branch delta=0 <= 45)"
            - "E2 DisplayEvent.${e2}.final_fallout_radius_ft == 462 (420 x 1.1, oblique branch delta=90 in (45,135])"
            - "Both events IN_PROGRESS with weather_decision == GO; identical weather inputs diverge only via the angular branch"

      - name: standby_fee_line_item_rounding_order
        grounds:
          - calculations.c_standby_fee
        distinguishing_aspect: |
          Mode (b): nested rounding where the pinned order matters. Final fee prorates by
          minute and rounds the hours line item half-up BEFORE summing: 218 min ->
          round_half_up(218*14500/60) = 52683, total 25000 + 52683 + 2 x 30000 = 137683.
          The forbidden alternative (ceil elapsed to whole hours first: 4 h x 14500)
          yields 148000; sum-then-round yields 137683.33 -> 137683 only by accident here,
          so the discriminating assert is 137683 vs the 148000 ceil-hours misreading.
        test_recipe:
          setup:
            - "Show with standby_engines = 2, window 2026-09-01 20:00-22:30 (planned_hours = ceil(2.5) = 3); standby confirmed 19:07:00, auto-closed 22:45:00 (218 min)"
            - "Provisional = 25000 + 3 x 14500 + 2 x 30000 = 128500"
          setup_api_calls:
            - { call: "POST /pyro/operators", payload: { legal_name: "Pyro Co", atf_license_number: "ATF-001", license_class: "DISPLAY_1_3G", license_valid_from: "2026-01-01T00:00:00Z", license_expires_at: "2027-01-01T00:00:00Z" }, as: SystemAdmin, captures: { op: $.data.id } }
