            - "${allowance_after} == 25 - floor(25 * 5.0) - 100"
            - "${version_after} == ${sector_v3} + 1"
            - "Both holds are still \"HELD\" with held_mbps 50 each, and both requests are still \"QUALIFIED\""

      - name: decommission_fans_out_across_six_rows_in_one_call_with_no_partial_update
        claim_type: bulk_action
        grounds:
          - endpoints[POST /towers/{id}/status-changes]
          - state_machines.Tower.transitions
          - state_machines.CapacityHold.transitions
          - state_machines.ServiceabilityRequest.transitions
        distinguishing_aspect: |
          The API declares no bulk endpoint, so the only many-row write is this cascade, and it must be
          all-or-nothing across six rows of four different types in a single request: two Sectors to
          DISABLED, two CapacityHolds to RELEASED and two ServiceabilityRequests to EXPIRED. Every
          affected row's version increments exactly once - no row may be skipped because it happens to
          hang off the second sector rather than the first.
        test_recipe:
          setup:
            - "ACTIVE Tower with two ACTIVE sectors, S1 at azimuth 90.0 and S2 at azimuth 270.0, both capacity_mbps 25 / ratio 8.0."
            - "Two STD50 requests, each QUALIFIED with its own HELD hold; because sector_selection ranks on oversubscription_ratio first, SR_A lands on S1 and SR_B on the then-empty S2."
            - "No Subscriber exists on either sector, so the decommission precondition is satisfied."
          setup_api_calls:
            - call: "POST /towers"
              payload: { site_code: "RB-TWR-001", latitude: 41.2500, longitude: -104.8000, ground_elevation_m: 1200.0, antenna_agl_m: 45.0, lease_landowner_name: "Hartley Ranch LLC", lease_monthly_base_rent_cents: 45000, lease_escalator_pct: 0.0275, lease_start_date: "2023-04-01", lease_term_months: 60 }
