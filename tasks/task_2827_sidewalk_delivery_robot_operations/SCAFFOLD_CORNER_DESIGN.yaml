      - name: plan_history_lists_every_revision_with_its_own_state
        claim_type: listing_order
        grounds:
          - "endpoints[GET /route-plans]"
          - "entities.RoutePlan.fields.revision_index"
          - "entities.RoutePlan.fields.supersedes_plan_id"
          - "state_machines.RoutePlan.VALIDATED_to_ACTIVE"
        distinguishing_aspect: >-
          A child listing is a history rather than a current-state view: all three revisions of the mission
          are returned in revision_index ASC order with their own distinct plan_state - SUPERSEDED, ACTIVE
          and DRAFT - and adding the plan_state filter narrows that history without renumbering it, so an
          implementation that returns only the active plan, or that reuses revision_index 1 for every plan,
          is falsified.
        test_recipe:
          setup:
            - "logical clock at 2026-08-03T09:00:00.000Z"
            - "ServiceZone Z1 PERMITTED with segments S1, S2, S3, S5 APPROVED and the mission for order O1 LOADED on Robot R1"
            - "plan P1 was created, validated and activated, so it held mission.active_route_plan_id first"
            - "plan P2 was then created, validated and activated against the re-read mission version, superseding P1"
            - "plan P3 was created against the re-read mission version and left in DRAFT"
            - "all three plans carry the identical segment_sequence [S1, S2, S3, S5]"
          setup_api_calls:
