          - errors.ERR_CHANGEOVER_WINDOW_CONFLICT
          - errors.ERR_WIDTH_CHANGE_OUT_OF_RANGE
        distinguishing_aspect: |
          A different endpoint, a different pair of categories (business_temporal at
          60 outranking business_constraint at 70) and a losing rule that depends on
          data the request never carries: the width delta is read from two snapshot
          ProductLines, not from the payload. The winner also depends on an interval
          the request never states, since both windows are inflated by
          CHANGEOVER_PURGE_BUFFER_MIN = 30 before being compared, and the two raw
          windows [15:45, 16:15] and [14:00, 15:00] do not touch at all.
