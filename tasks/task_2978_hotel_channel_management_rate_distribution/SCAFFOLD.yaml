scenario: |
  2978. Hotel Channel Management & Rate Distribution (hotel revenue distribution team): rate plan architecture with public, negotiated, opaque and package rates mapped to distribution channels, restriction management across minimum stay, closed to arrival and stop-sell with automated propagation, inventory allocation and pooled availability across channels with overbooking control, channel connectivity health monitoring with mapping errors and rate mismatch alerts, commission cost per channel measured against net average rate for channel mix decisions, promotion loading with member rates, package inclusions and geo-targeted offers, content and image parity across channels, booking pace analysis by channel feeding pricing decisions

domain_name: hotel-channel-distribution
api_prefix: "/distribution"

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: graph
  # Channel-distribution is not a tree: ChannelMapping, ChannelAllocation and Reservation are
  # junction/edge entities joining RatePlan x Channel x RoomType, and RatePlan derives from
  # RatePlan (self-referential). DistributionBatch carries a polymorphic source reference.

  state_machine_shape: cyclic
  # ChannelConnection (HEALTHY<->DEGRADED, SUSPENDED->DEGRADED), ChannelMapping
  # (VERIFIED->ERRORED->VERIFIED), RateDistributionJob (REJECTED->QUEUED),
  # Promotion.approval_status (REJECTED->DRAFT) and ChannelAllocation (OPEN<->EXHAUSTED)
  # all loop. DistributionBatch is additionally compound (state = f(child job states)) and
  # Promotion additionally carries two independent state axes.

  relationship_patterns:
    - one_to_many          # Property -> RoomType / Channel / RatePlan; DistributionBatch -> RateDistributionJob
    - many_to_many         # ChannelMapping and ChannelAllocation join RatePlan/RoomType with Channel
    - self_referential     # RatePlan.parent_rate_plan_id -> RatePlan.id (derived rate plans)
    - polymorphic          # DistributionBatch.source_ref_id resolves per source_ref_kind
    - cross_aggregate      # Reservation reads ChannelConnection health and Restriction windows

  role_model: segregation_of_duties
  # A promotion may be submitted by RevenueManager or RevenueDirector, but the RevenueDirector
  # whose X-User-ID submitted it can never approve it (ERR_SEGREGATION_OF_DUTIES).

  consistency_model: immediate

difficulty_level: expert_plus
# 14 entities, 66 endpoints (35 mutations, 31 reads), 55 error codes, 16 calculations
# (2 carrying dual variants), 10 state machines, 23 ordered validation rules, 2 OCC rules,
# 5 roles. Density target: every write endpoint touches at least two entities and at least
# one derived aggregate.

# ---------------------------------------------------------------------------
# 1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:
  - name: Property
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: Operator-facing property code, unique across all Property rows
        constraints: "3-16 chars, ^[A-Z0-9-]+$; duplicate -> ERR_DUPLICATE_RESOURCE"
      - name: name
        type: string
        source: input
        description: Human-readable property name
        constraints: "1-120 chars"
      - name: currency_code
        type: string
        source: input
        default: "USD"
        description: ISO-4217 currency for all money fields on this property
        constraints: "exactly 3 uppercase letters"
      - name: overbooking_pct_bp
        type: integer
        source: input
        default: 0
        description: Property-default overbooking allowance in basis points of physical capacity
        constraints: "0..5000"
      - name: booking_horizon_days
        type: integer
        source: input
        default: 365
        description: Furthest stay date that may be sold or restricted, counted from the logical clock date
        constraints: "1..730"
      - name: mix_window_days
        type: integer
        source: input
        default: 30
        description: Length in days of the trailing stay-date window used by channel-mix ranking
        constraints: "1..90"
      - name: rate_mismatch_tolerance_cents
        type: integer
        source: input
        default: 0
        description: Absolute cent tolerance below which an observed channel rate is still IN_SYNC
        constraints: ">= 0"
      - name: required_image_count
        type: integer
        source: input
        default: 0
        description: Minimum image count a channel mapping must carry to be IN_PARITY
        constraints: ">= 0"

  - name: RoomType
    parent: Property
    common_fields: true
    fields:
      - name: property_id
        type: string
        source: system
        description: "FK -> Property.id; owning property, taken from the create path"
      - name: code
        type: string
        source: input
        description: Room type code, unique within the owning property
        constraints: "2-12 chars, ^[A-Z0-9]+$; duplicate within property -> ERR_DUPLICATE_RESOURCE"
      - name: name
        type: string
        source: input
        description: Human-readable room type name
        constraints: "1-120 chars"
      - name: physical_capacity_units
        type: integer
        source: input
        description: Number of physical rooms of this type
        constraints: "1..500"
      - name: overbooking_pct_bp
        type: integer
        source: input
        default: null
        description: Room-type override of the property overbooking allowance in basis points; null means inherit
        constraints: "null or 0..5000"
      - name: master_description_hash
        type: string
        source: input
        description: Hash of the master (property-owned) descriptive content for this room type
        constraints: "4-64 chars, ^[a-z0-9]+$"
      - name: master_image_count
        type: integer
        source: input
        description: Number of images in the master content set for this room type
        constraints: "0..40"
      - name: effective_overbooking_pct_bp
        type: integer
        source: computed
        description: overbooking_pct_bp when non-null, else Property.overbooking_pct_bp

  - name: InventoryDay
    parent: RoomType
    common_fields: true
    fields:
      - name: room_type_id
        type: string
        source: system
        description: "FK -> RoomType.id; room type this sellable stay date belongs to, taken from the create path"
      - name: stay_date
        type: string
        source: input
        description: Sellable stay date (a night), unique per room type
        constraints: "YYYY-MM-DD; duplicate for the room type -> ERR_DUPLICATE_RESOURCE"
      - name: physical_capacity_units
        type: integer
        source: computed
        description: Live mirror of RoomType.physical_capacity_units
      - name: overbooking_ceiling_units
        type: integer
        source: computed
        description: Maximum sellable units for this night, per calculations.inventory_pool_state
      - name: allocated_units
        type: integer
        source: computed
        description: Sum of ChannelAllocation.allocated_units carving this night out of the shared pool
      - name: shared_pool_units
        type: integer
        source: computed
        description: overbooking_ceiling_units - allocated_units, the units any channel may sell
      - name: committed_units
        type: integer
        source: computed
        description: Count of CONFIRMED Reservation nights landing on this stay date
      - name: pooled_state
        type: enum
        source: computed
        description: Derived pooled-availability posture for this night
        constraints: "OPEN | TIGHT | EXHAUSTED | OVERSOLD"

  - name: Channel
    parent: Property
    common_fields: true
    fields:
      - name: property_id
        type: string
        source: system
        description: "FK -> Property.id; owning property, taken from the create path"
      - name: code
        type: string
        source: input
        description: Channel code, unique within the owning property
        constraints: "2-16 chars, ^[A-Z0-9-]+$; duplicate within property -> ERR_DUPLICATE_RESOURCE"
      - name: channel_kind
        type: enum
        source: input
        description: Distribution channel family
        constraints: "OTA_PUBLIC | OTA_OPAQUE | GDS | DIRECT_BRAND | WHOLESALER"
      - name: commission_bp
        type: integer
        source: input
        description: Commission charged by this channel in basis points of the commissionable amount
        constraints: "0..5000"
      - name: sell_adjustment_bp
        type: integer
        source: input
        default: 0
        description: Signed channel-level sell-rate adjustment in basis points applied after promotions
        constraints: "-3000..3000"
      - name: allows_member_rate
        type: boolean
        source: input
        default: false
        description: Whether member-only rate plans may be sold on this channel
      - name: allows_opaque_rate
        type: boolean
        source: input
        default: false
        description: Whether rate plans with rate_class OPAQUE may be sold on this channel
      - name: geo_market_codes
        type: array
        source: input
        default: []
        description: Geo markets this channel serves; empty array means it serves every market
        constraints: "each element 2-8 chars, ^[A-Z0-9-]+$"
      - name: requires_content_parity
        type: boolean
        source: input
        default: true
        description: Whether promotion loading on this channel demands IN_PARITY mappings
      - name: gross_revenue_cents
        type: integer
        source: computed
        default: 0
        description: Running sum of gross_amount_cents over CONFIRMED reservations on this channel
      - name: commission_accrued_cents
        type: integer
        source: computed
        default: 0
        description: Running sum of commission_amount_cents over CONFIRMED reservations on this channel
      - name: net_revenue_cents
        type: integer
        source: computed
        default: 0
        description: Running sum of net_amount_cents over CONFIRMED reservations on this channel
      - name: room_nights_sold
        type: integer
        source: computed
        default: 0
        description: Running count of nights across CONFIRMED reservations on this channel
      - name: bookings_count
        type: integer
        source: computed
        default: 0
        description: Count of reservations ever created on this channel, including cancelled ones
      - name: cancellations_count
        type: integer
        source: computed
        default: 0
        description: Count of reservations cancelled on this channel
      - name: mismatch_alert_count
        type: integer
        source: computed
        default: 0
        description: Count of observed-rate reports on this channel that resolved to MISMATCHED

  - name: ChannelConnection
    parent: Channel
    common_fields: true
    fields:
      - name: channel_id
        type: string
        source: system
        description: "FK -> Channel.id; channel whose connectivity this row monitors, taken from the create path"
      - name: protocol
        type: enum
        source: input
        description: Connectivity protocol used to push rates and restrictions
        constraints: "XML_PUSH | JSON_PUSH | ARI_PULL"
      - name: endpoint_url
        type: string
        source: input
        description: Partner endpoint the property pushes to
        constraints: "8-200 chars, must start with https://"
      - name: heartbeat_interval_minutes
        type: integer
        source: input
        default: 15
        description: Expected heartbeat cadence agreed with the partner
        constraints: "5..1440"
      - name: connection_state
        type: enum
        source: system
        default: "PENDING"
        description: Connectivity health posture gating sell and push operations
        constraints: "PENDING | HEALTHY | DEGRADED | SUSPENDED | RETIRED"
      - name: consecutive_failures
        type: integer
        source: system
        default: 0
        description: Failures since the last OK heartbeat or activation; reset only by an OK heartbeat or activation
      - name: last_heartbeat_at
        type: datetime
        source: system
        default: null
        description: Logical-clock instant of the most recent heartbeat of any status
      - name: last_failure_code
        type: enum
        source: system
        default: null
        description: Reason recorded by the most recent failure, from a heartbeat or a rejected job
        constraints: "null | TIMEOUT | AUTH_REJECTED | SCHEMA_ERROR | MAPPING_REJECTED | UNKNOWN"
      - name: suspended_at
        type: datetime
        source: system
        default: null
        description: Logical-clock instant at which the connection last entered SUSPENDED

  - name: ConnectivityFreezeWindow
    parent: ChannelConnection
    common_fields: false
    fields:
      - name: connection_id
        type: string
        source: system
        description: "FK -> ChannelConnection.id; connection frozen by this window, taken from the create path"
      - name: starts_at
        type: datetime
        source: input
        description: Inclusive start instant of the partner freeze
        constraints: "ISO 8601 UTC with three fractional digits"
      - name: ends_at
        type: datetime
        source: input
        description: Exclusive end instant of the partner freeze
        constraints: "ISO 8601 UTC with three fractional digits; must be > starts_at"
      - name: reason
        type: enum
        source: input
        description: Why the partner is refusing pushes during the window
        constraints: "MAINTENANCE | CERTIFICATION | INCIDENT"
      - name: effective_starts_at
        type: datetime
        source: computed
        description: starts_at minus FREEZE_PRE_BUFFER_MINUTES, the instant from which pushes are already refused

  - name: RatePlan
    parent: Property
    common_fields: true
    fields:
      - name: property_id
        type: string
        source: system
        description: "FK -> Property.id; owning property, taken from the create path"
      - name: code
        type: string
        source: input
        description: Rate plan code, unique within the owning property
        constraints: "2-16 chars, ^[A-Z0-9-]+$; duplicate within property -> ERR_DUPLICATE_RESOURCE"
      - name: rate_class
        type: enum
        source: input
        description: Commercial class of the rate plan, gating which channels may sell it
        constraints: "PUBLIC | NEGOTIATED | OPAQUE | PACKAGE"
      - name: parent_rate_plan_id
        type: string
        source: input
        default: null
        description: "FK -> RatePlan.id; plan this one derives its base amount from; null for a standalone plan"
      - name: base_amount_cents
        type: integer
        source: input
        default: null
        description: Own nightly base amount in cents; required when parent_rate_plan_id is null, forbidden otherwise
        constraints: "null or 1000..1000000"
      - name: offset_kind
        type: enum
        source: input
        default: "NONE"
        description: How this plan offsets its parent plan's resolved base amount
        constraints: "NONE | PERCENT | AMOUNT"
      - name: offset_bp
        type: integer
        source: input
        default: null
        description: Signed basis-point offset applied to the parent base; required when offset_kind is PERCENT
        constraints: "null or -5000..5000"
      - name: offset_amount_cents
        type: integer
        source: input
        default: null
        description: Signed cent offset applied to the parent base; required when offset_kind is AMOUNT
        constraints: "null or -500000..500000"
      - name: floor_amount_cents
        type: integer
        source: input
        description: Lower clamp applied to the promoted, channel-adjusted amount
        constraints: "1000..1000000"
      - name: ceiling_amount_cents
        type: integer
        source: input
        description: Upper clamp applied to the promoted, channel-adjusted amount
        constraints: "1000..1000000; must be >= floor_amount_cents"
      - name: package_inclusion_cents
        type: integer
        source: input
        default: 0
        description: Non-commissionable inclusion value added to every night of this plan
        constraints: "0..200000"
      - name: member_only
        type: boolean
        source: input
        default: false
        description: Whether this plan may only be sold to member reservations
      - name: negotiated_account_code
        type: string
        source: input
        default: null
        description: Corporate account code a reservation must quote; required when rate_class is NEGOTIATED
        constraints: "null or 2-16 chars, ^[A-Z0-9-]+$"
      - name: plan_state
        type: enum
        source: system
        default: "DRAFT"
        description: Lifecycle state gating mapping verification and sale
        constraints: "DRAFT | ACTIVE | CLOSED"
      - name: derivation_depth
        type: integer
        source: computed
        description: 0 when parent_rate_plan_id is null, else parent.derivation_depth + 1
      - name: resolved_base_amount_cents
        type: integer
        source: computed
        description: Base amount after walking the derivation chain, per calculations.resolved_base_amount

  - name: ChannelMapping
    parent: null
    common_fields: true
    fields:
      - name: rate_plan_id
        type: string
        source: input
        description: "FK -> RatePlan.id; rate plan exposed by this mapping"
      - name: channel_id
        type: string
        source: input
        description: "FK -> Channel.id; channel the rate plan is exposed on"
      - name: room_type_id
        type: string
        source: input
        description: "FK -> RoomType.id; room type the rate plan is exposed for"
      - name: external_rate_code
        type: string
        source: input
        description: Partner-side rate code the property maps to
        constraints: "2-24 chars, ^[A-Z0-9_-]+$"
      - name: mapping_state
        type: enum
        source: system
        default: "DRAFT"
        description: Mapping health state gating distribution jobs
        constraints: "DRAFT | VERIFIED | ERRORED | DISABLED"
      - name: content_description_hash
        type: string
        source: input
        default: null
        description: Hash of the descriptive content this mapping publishes to the channel
        constraints: "null or 4-64 chars, ^[a-z0-9]+$"
      - name: content_image_count
        type: integer
        source: input
        default: null
        description: Number of images this mapping publishes to the channel
        constraints: "null or 0..40"
      - name: parity_state
        type: enum
        source: computed
        description: Content and image parity against the room type master content, per calculations.content_parity_evaluation
        constraints: "UNKNOWN | IN_PARITY | OUT_OF_PARITY"
      - name: last_push_at
        type: datetime
        source: system
        default: null
        description: Logical-clock instant of the most recent APPLIED distribution job on this mapping
      - name: last_pushed_rate_cents
        type: integer
        source: system
        default: null
        description: Rate payload carried by the most recent APPLIED RATE or PROMOTION job
      - name: observed_rate_cents
        type: integer
        source: system
        default: null
        description: Most recently reported partner-side sell rate for observed_stay_date
      - name: observed_stay_date
        type: string
        source: system
        default: null
        description: Stay date the most recent observed rate was reported for
        constraints: "null or YYYY-MM-DD"
      - name: mismatch_state
        type: enum
        source: computed
        default: "UNKNOWN"
        description: Rate parity verdict from the most recent observed-rate report
        constraints: "UNKNOWN | IN_SYNC | MISMATCHED"
      - name: mismatch_delta_cents
        type: integer
        source: computed
        default: null
        description: observed_rate_cents minus the public quote for observed_stay_date; null before any report

  - name: ChannelAllocation
    parent: RoomType
    common_fields: true
    fields:
      - name: room_type_id
        type: string
        source: system
        description: "FK -> RoomType.id; room type whose pool this block carves, taken from the create path"
      - name: channel_id
        type: string
        source: input
        description: "FK -> Channel.id; channel the units are reserved for"
      - name: allocated_units
        type: integer
        source: input
        description: Units carved out of the shared pool for this channel across the window
        constraints: "1..500"
      - name: start_date
        type: string
        source: input
        description: First stay date of the allotment window, inclusive
        constraints: "YYYY-MM-DD"
      - name: end_date
        type: string
        source: input
        description: Last stay date of the allotment window, inclusive
        constraints: "YYYY-MM-DD; must be >= start_date and within the booking horizon"
      - name: consumed_units
        type: integer
        source: computed
        default: 0
        description: Peak per-night count of CONFIRMED reservations on this channel inside the window
      - name: allocation_state
        type: enum
        source: system
        default: "OPEN"
        description: Allotment lifecycle state
        constraints: "OPEN | EXHAUSTED | RELEASED | RECALLED | SUPERSEDED"
      - name: superseded_at
        type: datetime
        source: system
        default: null
        description: Logical-clock instant at which a newer allotment for the same key replaced this one
      - name: recalled_at
        type: datetime
        source: system
        default: null
        description: Logical-clock instant at which channel suspension returned these units to the shared pool

  - name: Restriction
    parent: null
    common_fields: true
    fields:
      - name: room_type_id
        type: string
        source: input
        description: "FK -> RoomType.id; room type the restriction applies to"
      - name: rate_plan_id
        type: string
        source: input
        default: null
        description: "FK -> RatePlan.id; narrows the restriction to one plan; null applies it to every plan on the room type"
      - name: restriction_type
        type: enum
        source: input
        description: Kind of sell restriction
        constraints: "MIN_STAY | CLOSED_TO_ARRIVAL | STOP_SELL"
      - name: start_date
        type: string
        source: input
        description: First restricted stay date, inclusive
        constraints: "YYYY-MM-DD"
      - name: end_date
        type: string
        source: input
        description: Last restricted stay date, inclusive
        constraints: "YYYY-MM-DD; must be >= start_date"
      - name: value_nights
        type: integer
        source: input
        default: null
        description: Minimum nights demanded; required when restriction_type is MIN_STAY, forbidden otherwise
        constraints: "null or 2..14"
      - name: origin
        type: enum
        source: system
        default: "MANUAL"
        description: Whether an operator or the overbooking guard created this restriction
        constraints: "MANUAL | AUTO_OVERBOOK_GUARD"
      - name: restriction_state
        type: enum
        source: system
        default: "ACTIVE"
        description: Whether the restriction still constrains sale
        constraints: "ACTIVE | LIFTED"
      - name: lifted_at
        type: datetime
        source: system
        default: null
        description: Logical-clock instant at which the restriction stopped constraining sale
      - name: lift_reason
        type: enum
        source: system
        default: null
        description: Why the restriction was lifted
        constraints: "null | MANUAL_LIFT | AUTO_GUARD_CLEARED"

  - name: DistributionBatch
    parent: Property
    common_fields: true
    fields:
      - name: property_id
        type: string
        source: system
        description: "FK -> Property.id; property whose channels this batch pushes to"
      - name: payload_kind
        type: enum
        source: system
        description: What the batch pushes to the channels
        constraints: "RATE | RESTRICTION | PROMOTION"
      - name: source_ref_kind
        type: enum
        source: system
        description: Which entity type created the batch; selects the table source_ref_id resolves in
        constraints: "RATE_PLAN | RESTRICTION | PROMOTION"
      - name: source_ref_id
        type: string
        source: system
        description: "Id of the triggering row; resolves in RatePlan.id when source_ref_kind is RATE_PLAN, Restriction.id when RESTRICTION, Promotion.id when PROMOTION (polymorphic, deliberately not a declared FK)"
      - name: batch_state
        type: enum
        source: system
        default: "QUEUED"
        description: Aggregate dispatch state derived from child job states
        constraints: "QUEUED | DISPATCHING | APPLIED | PARTIALLY_APPLIED | FAILED"
      - name: total_jobs
        type: integer
        source: computed
        description: Count of RateDistributionJob rows in this batch
      - name: applied_jobs
        type: integer
        source: computed
        description: Count of child jobs in APPLIED
      - name: rejected_jobs
        type: integer
        source: computed
        description: Count of child jobs in REJECTED
      - name: abandoned_jobs
        type: integer
        source: computed
        description: Count of child jobs in ABANDONED
      - name: dispatched_at
        type: datetime
        source: system
        default: null
        description: Logical-clock instant of the most recent dispatch call on this batch

  - name: RateDistributionJob
    parent: DistributionBatch
    common_fields: true
    fields:
      - name: batch_id
        type: string
        source: system
        description: "FK -> DistributionBatch.id; batch that fanned this job out"
      - name: channel_mapping_id
        type: string
        source: system
        description: "FK -> ChannelMapping.id; mapping this job pushes to"
      - name: sequence_index
        type: integer
        source: system
        description: 1-based position assigned at fan-out; dispatch processes jobs in ascending sequence_index
      - name: payload_kind
        type: enum
        source: system
        description: Mirrors the parent batch payload_kind
        constraints: "RATE | RESTRICTION | PROMOTION"
      - name: payload_rate_cents
        type: integer
        source: system
        default: null
        description: Public quote pushed for RATE and PROMOTION jobs; null for RESTRICTION jobs
      - name: job_state
        type: enum
        source: system
        default: "QUEUED"
        description: Per-mapping push state
        constraints: "QUEUED | DISPATCHED | APPLIED | REJECTED | ABANDONED"
      - name: attempt_count
        type: integer
        source: system
        default: 0
        description: Number of times this job has entered DISPATCHED
      - name: failure_reason
        type: enum
        source: system
        default: null
        description: Why the most recent dispatch rejected this job
        constraints: "null | MAPPING_NOT_VERIFIED | CONNECTION_UNHEALTHY | FREEZE_WINDOW_ACTIVE | PARITY_BLOCKED"
      - name: applied_at
        type: datetime
        source: system
        default: null
        description: Logical-clock instant at which this job reached APPLIED

  - name: Promotion
    parent: RatePlan
    common_fields: true
    fields:
      - name: rate_plan_id
        type: string
        source: system
        description: "FK -> RatePlan.id; plan the promotion discounts, taken from the create path"
      - name: code
        type: string
        source: input
        description: Promotion code, unique within the owning rate plan
        constraints: "2-16 chars, ^[A-Z0-9-]+$; duplicate within rate plan -> ERR_DUPLICATE_RESOURCE"
      - name: promo_kind
        type: enum
        source: input
        description: Eligibility family of the promotion
        constraints: "MEMBER_RATE | PACKAGE_INCLUSION | GEO_OFFER"
      - name: discount_kind
        type: enum
        source: input
        description: Whether the discount is proportional or absolute
        constraints: "PERCENT | AMOUNT"
      - name: discount_bp
        type: integer
        source: input
        default: null
        description: Discount in basis points of the running amount; required when discount_kind is PERCENT
        constraints: "null or 1..5000"
      - name: discount_amount_cents
        type: integer
        source: input
        default: null
        description: Absolute cent discount; required when discount_kind is AMOUNT
        constraints: "null or 1..200000"
      - name: start_date
        type: string
        source: input
        description: First stay date the promotion applies to, inclusive
        constraints: "YYYY-MM-DD"
      - name: end_date
        type: string
        source: input
        description: Last stay date the promotion applies to, inclusive
        constraints: "YYYY-MM-DD; must be >= start_date and within the booking horizon"
      - name: geo_market_codes
        type: array
        source: input
        default: []
        description: Geo markets eligible for the offer; must be non-empty when promo_kind is GEO_OFFER
        constraints: "each element 2-8 chars, ^[A-Z0-9-]+$"
      - name: approval_status
        type: enum
        source: system
        default: "DRAFT"
        description: Approval axis; only APPROVED promotions enter sell-rate resolution
        constraints: "DRAFT | SUBMITTED | APPROVED | REJECTED"
      - name: distribution_status
        type: enum
        source: system
        default: "NOT_LOADED"
        description: Channel-load axis, independent of approval_status
        constraints: "NOT_LOADED | LOADING | LOADED | LOAD_FAILED"
      - name: submitted_by_user_id
        type: string
        source: system
        default: null
        description: X-User-ID that most recently submitted the promotion for approval
      - name: approved_by_user_id
        type: string
        source: system
        default: null
        description: X-User-ID that approved the promotion
      - name: reject_reason
        type: string
        source: system
        default: null
        description: Reason text recorded by the rejecting director
      - name: revision_count
        type: integer
        source: system
        default: 0
        description: Number of times the promotion has returned from REJECTED to DRAFT

  - name: Reservation
    parent: null
    common_fields: true
    fields:
      - name: property_id
        type: string
        source: system
        description: "FK -> Property.id; property derived from the booking channel"
      - name: channel_id
        type: string
        source: input
        description: "FK -> Channel.id; channel the booking arrived on"
      - name: rate_plan_id
        type: string
        source: input
        description: "FK -> RatePlan.id; rate plan sold"
      - name: room_type_id
        type: string
        source: input
        description: "FK -> RoomType.id; room type sold"
      - name: arrival_date
        type: string
        source: input
        description: First night of the stay
        constraints: "YYYY-MM-DD"
      - name: nights
        type: integer
        source: input
        description: Number of consecutive nights booked; one unit per night
        constraints: "1..14"
      - name: departure_date
        type: string
        source: computed
        description: arrival_date plus nights; the guest does not occupy this date
      - name: member_flag
        type: boolean
        source: input
        default: false
        description: Whether the booker is an authenticated loyalty member
      - name: geo_market_code
        type: string
        source: input
        default: null
        description: Geo market the booker transacted from
        constraints: "null or 2-8 chars, ^[A-Z0-9-]+$"
      - name: negotiated_account_code
        type: string
        source: input
        default: null
        description: Corporate account code quoted by the booker
        constraints: "null or 2-16 chars, ^[A-Z0-9-]+$"
      - name: override_overbooking
        type: boolean
        source: input
        default: false
        description: RevenueDirector-only flag bypassing the overbooking ceiling check
      - name: reservation_state
        type: enum
        source: system
        default: "CONFIRMED"
        description: Whether the booking still holds inventory and revenue
        constraints: "CONFIRMED | CANCELLED"
      - name: nightly_breakdown
        type: array
        source: computed
        description: One object per night, {stay_date, sell_rate_cents, commissionable_cents, commission_cents}, ordered by stay_date ASC
      - name: gross_amount_cents
        type: integer
        source: computed
        description: Sum of nightly sell_rate_cents, per calculations.reservation_charge_breakdown
      - name: commission_amount_cents
        type: integer
        source: computed
        description: Sum of per-night rounded commission, per calculations.reservation_charge_breakdown
      - name: net_amount_cents
        type: integer
        source: computed
        description: gross_amount_cents minus commission_amount_cents
      - name: loyalty_credit_cents
        type: integer
        source: computed
        description: Package loyalty credit, per calculations.package_loyalty_credit
      - name: overbooking_overridden
        type: boolean
        source: system
        default: false
        description: True when the ceiling check was bypassed by an accepted override_overbooking request
      - name: cancelled_at
        type: datetime
        source: system
        default: null
        description: Logical-clock instant at which the booking was cancelled

# ---------------------------------------------------------------------------
# 1.2 State Machine Table
# ---------------------------------------------------------------------------
state_machines:
  - entity: RatePlan
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /distribution/rate-plans/{id}/activate"
        actor: RevenueManager
        preconditions:
          - "plan_state == DRAFT, else ERR_RATE_PLAN_STATE_INVALID"
          - "when parent_rate_plan_id is non-null, the parent plan_state == ACTIVE, else ERR_RATE_PLAN_STATE_INVALID"
        side_effects:
          - "recompute resolved_base_amount_cents per calculations.resolved_base_amount"
          - "increments RatePlan.version by 1"
      - from: ACTIVE
        to: ACTIVE
        trigger: "PATCH /distribution/rate-plans/{id}"
        actor: RevenueManager
        preconditions:
          - "plan_state == ACTIVE, else ERR_RATE_PLAN_STATE_INVALID"
          - "expected_rate_plan_version == RatePlan.version, else ERR_STALE_RATE_PLAN_VERSION"
          - "resulting ceiling_amount_cents >= resulting floor_amount_cents, else ERR_INVALID_REQUEST"
        side_effects:
          - "recompute resolved_base_amount_cents on this plan and on every RatePlan whose parent_rate_plan_id chain reaches it"
          - "increments RatePlan.version by 1"
          - "creates one DistributionBatch {payload_kind: RATE, source_ref_kind: RATE_PLAN, source_ref_id: this plan id, batch_state: QUEUED}"
          - "that batch creation itself fans out one RateDistributionJob per ChannelMapping with rate_plan_id == this plan (or with rate_plan_id of a descendant plan) and mapping_state == VERIFIED, ordered by ChannelMapping.created_at ASC and numbered sequence_index from 1"
        note: "Cascade depth 3: plan -> batch -> jobs. PATCH never leaves ACTIVE."
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /distribution/rate-plans/{id}/close"
        actor: RevenueManager
        preconditions:
          - "plan_state == ACTIVE, else ERR_RATE_PLAN_STATE_INVALID"
        side_effects:
          - "every ChannelMapping with rate_plan_id == this plan and mapping_state IN {DRAFT, VERIFIED, ERRORED} moves to DISABLED"
          - "increments RatePlan.version by 1"

  - entity: ChannelMapping
    initial_state: DRAFT
    terminal_states: [DISABLED]
    transitions:
      - from: DRAFT
        to: VERIFIED
        trigger: "POST /distribution/channel-mappings/{id}/verify"
        actor: ChannelOpsEngineer
        preconditions:
          - "mapping_state IN {DRAFT, ERRORED}, else ERR_MAPPING_STATE_INVALID"
          - "the mapping's RatePlan.plan_state == ACTIVE, else ERR_RATE_PLAN_STATE_INVALID"
          - "the mapping's Channel has a ChannelConnection whose connection_state IN {HEALTHY, DEGRADED}, else ERR_CONNECTION_NOT_SELLABLE"
        side_effects:
          - "recompute parity_state per calculations.content_parity_evaluation"
          - "increments ChannelMapping.version by 1"
      - from: ERRORED
        to: VERIFIED
        trigger: "POST /distribution/channel-mappings/{id}/verify"
        actor: ChannelOpsEngineer
        preconditions:
          - "mapping_state IN {DRAFT, ERRORED}, else ERR_MAPPING_STATE_INVALID"
          - "the mapping's RatePlan.plan_state == ACTIVE, else ERR_RATE_PLAN_STATE_INVALID"
          - "the mapping's Channel has a ChannelConnection whose connection_state IN {HEALTHY, DEGRADED}, else ERR_CONNECTION_NOT_SELLABLE"
        side_effects:
          - "recompute parity_state per calculations.content_parity_evaluation"
          - "increments ChannelMapping.version by 1"
        note: "Re-verification closes the VERIFIED -> ERRORED -> VERIFIED cycle."
      - from: VERIFIED
        to: ERRORED
        trigger: "system event: a RateDistributionJob on this mapping resolves to REJECTED with failure_reason MAPPING_NOT_VERIFIED or PARITY_BLOCKED"
        actor: system
        preconditions:
          - "mapping_state == VERIFIED at the moment of rejection"
        side_effects:
          - "sets ChannelConnection.last_failure_code = MAPPING_REJECTED on the mapping's connection"
          - "increments ChannelMapping.version by 1"
      - from: VERIFIED
        to: DISABLED
        trigger: "POST /distribution/channel-mappings/{id}/disable"
        actor: ChannelOpsEngineer
        preconditions:
          - "mapping_state IN {DRAFT, VERIFIED, ERRORED}, else ERR_MAPPING_STATE_INVALID"
        side_effects:
          - "every RateDistributionJob on this mapping in QUEUED moves to ABANDONED"
          - "each such job abandonment itself recomputes its DistributionBatch counters and batch_state per calculations.batch_state_rollup"
          - "increments ChannelMapping.version by 1"
        note: "Cascade depth 3: mapping -> jobs -> batch."

  - entity: ChannelConnection
    initial_state: PENDING
    terminal_states: [RETIRED]
    transitions:
      - from: PENDING
        to: HEALTHY
        trigger: "POST /distribution/channel-connections/{id}/activate"
        actor: ChannelOpsEngineer
        preconditions:
          - "connection_state == PENDING, else ERR_CONNECTION_STATE_INVALID"
        side_effects:
          - "sets consecutive_failures = 0 and last_failure_code = null"
          - "increments ChannelConnection.version by 1"
      - from: HEALTHY
        to: DEGRADED
        trigger: "POST /distribution/channel-connections/{id}/heartbeats with status ERROR, or system event: a RateDistributionJob on this channel resolves to REJECTED"
        actor: ChannelOpsEngineer | system
        preconditions:
          - "connection_state == HEALTHY and the failure raises consecutive_failures to >= 1"
        side_effects:
          - "increments consecutive_failures by 1 and records last_failure_code"
          - "increments ChannelConnection.version by 1"
      - from: DEGRADED
        to: HEALTHY
        trigger: "POST /distribution/channel-connections/{id}/heartbeats with status OK"
        actor: ChannelOpsEngineer
        preconditions:
          - "connection_state == DEGRADED"
        side_effects:
          - "sets consecutive_failures = 0, last_failure_code = null, last_heartbeat_at = logical clock"
          - "increments ChannelConnection.version by 1"
        note: "Closes the HEALTHY <-> DEGRADED cycle. An APPLIED job never resets consecutive_failures."
      - from: DEGRADED
        to: DEGRADED
        trigger: "POST /distribution/channel-connections/{id}/heartbeats with status ERROR, or system event: a RateDistributionJob on this channel resolves to REJECTED"
        actor: ChannelOpsEngineer | system
        preconditions:
          - "connection_state == DEGRADED and consecutive_failures stays strictly below CONNECTION_FAILURE_SUSPEND_THRESHOLD (3) after this failure"
        side_effects:
          - "increments consecutive_failures by 1 and records last_failure_code"
          - "increments ChannelConnection.version by 1"
        note: "Self-loop: with the threshold at 3 this is the single intermediate failure between HEALTHY -> DEGRADED (streak 1) and DEGRADED -> SUSPENDED (streak 3), so the same trigger from the same state lands in two different states depending on the streak."
      - from: DEGRADED
        to: SUSPENDED
        trigger: "POST /distribution/channel-connections/{id}/heartbeats with status ERROR, or system event: a RateDistributionJob on this channel resolves to REJECTED"
        actor: ChannelOpsEngineer | system
        preconditions:
          - "connection_state == DEGRADED and consecutive_failures reaches >= CONNECTION_FAILURE_SUSPEND_THRESHOLD (3) after this failure"
        side_effects:
          - "sets suspended_at = logical clock"
          - "every ChannelAllocation whose channel_id == this channel and allocation_state IN {OPEN, EXHAUSTED} moves to RECALLED with recalled_at = logical clock"
          - "each such recall itself recomputes every InventoryDay of the allocation's room type whose stay_date falls in [start_date, end_date]: allocated_units drops, shared_pool_units rises, pooled_state re-derived per calculations.inventory_pool_state"
          - "each InventoryDay whose recomputed pooled_state leaves OVERSOLD itself lifts its AUTO_OVERBOOK_GUARD STOP_SELL Restriction (ACTIVE -> LIFTED, lift_reason AUTO_GUARD_CLEARED), which itself creates a RESTRICTION DistributionBatch and its jobs"
          - "increments ChannelConnection.version by 1"
        note: "Cascade depth 5: job rejection -> connection SUSPENDED -> allocations RECALLED -> InventoryDay recompute -> guard restriction lifted -> batch + jobs."
      - from: SUSPENDED
        to: DEGRADED
        trigger: "POST /distribution/channel-connections/{id}/revalidate"
        actor: ChannelOpsEngineer
        preconditions:
          - "connection_state == SUSPENDED, else ERR_CONNECTION_STATE_INVALID"
        side_effects:
          - "sets consecutive_failures = CONNECTION_FAILURE_SUSPEND_THRESHOLD - 1 (2) so a single further failure re-suspends"
          - "RECALLED allocations are NOT restored; the operator must create new allotments"
          - "increments ChannelConnection.version by 1"
        note: "Closes the DEGRADED -> SUSPENDED -> DEGRADED cycle."
      - from: HEALTHY
        to: RETIRED
        trigger: "POST /distribution/channel-connections/{id}/retire"
        actor: PlatformAdmin
        preconditions:
          - "connection_state IN {PENDING, HEALTHY, DEGRADED, SUSPENDED}, else ERR_CONNECTION_STATE_INVALID"
        side_effects:
          - "every ChannelMapping on this channel with mapping_state IN {DRAFT, VERIFIED, ERRORED} moves to DISABLED"
          - "every ChannelAllocation on this channel with allocation_state IN {OPEN, EXHAUSTED} moves to RECALLED, which itself recomputes the covered InventoryDay rows"
          - "increments ChannelConnection.version by 1"
        note: "SUSPENDED, DEGRADED and PENDING may also retire; RETIRED is terminal."

  - entity: ChannelAllocation
    initial_state: OPEN
    terminal_states: [RELEASED, RECALLED, SUPERSEDED]
    transitions:
      - from: OPEN
        to: EXHAUSTED
        trigger: "system event: a CONFIRMED Reservation raises consumed_units to allocated_units"
        actor: system
        preconditions:
          - "allocation_state == OPEN and recomputed consumed_units == allocated_units"
        side_effects:
          - "increments ChannelAllocation.version by 1"
      - from: EXHAUSTED
        to: OPEN
        trigger: "system event: a cancellation drops consumed_units below allocated_units"
        actor: system
        preconditions:
          - "allocation_state == EXHAUSTED and recomputed consumed_units < allocated_units"
        side_effects:
          - "increments ChannelAllocation.version by 1"
        note: "Closes the OPEN <-> EXHAUSTED cycle."
      - from: OPEN
        to: RELEASED
        trigger: "POST /distribution/allocations/{id}/release"
        actor: RevenueManager
        preconditions:
          - "allocation_state IN {OPEN, EXHAUSTED}, else ERR_ALLOCATION_STATE_INVALID"
        side_effects:
          - "every InventoryDay of the room type whose stay_date falls in [start_date, end_date] is recomputed: allocated_units drops by allocated_units, shared_pool_units rises by the same amount, pooled_state re-derived"
          - "increments ChannelAllocation.version by 1"
      - from: OPEN
        to: RECALLED
        trigger: "system event: the allocation's ChannelConnection enters SUSPENDED or RETIRED"
        actor: system
        preconditions:
          - "allocation_state IN {OPEN, EXHAUSTED}"
        side_effects:
          - "sets recalled_at = logical clock"
          - "covered InventoryDay rows are recomputed exactly as for RELEASED"
          - "increments ChannelAllocation.version by 1"
      - from: OPEN
        to: SUPERSEDED
        trigger: "POST /distribution/room-types/{id}/allocations creating a newer allotment with the same channel_id, start_date and end_date"
        actor: RevenueManager
        preconditions:
          - "allocation_state IN {OPEN, EXHAUSTED}"
        side_effects:
          - "sets superseded_at = logical clock"
          - "the superseded units leave allocated_units before the new allotment's units are counted, so the aggregate-capacity check sees only the new block"
          - "increments ChannelAllocation.version by 1"

  - entity: Restriction
    initial_state: ACTIVE
    terminal_states: [LIFTED]
    transitions:
      - from: ACTIVE
        to: LIFTED
        trigger: "POST /distribution/restrictions/{id}/lift"
        actor: RevenueManager
        preconditions:
          - "restriction_state == ACTIVE, else ERR_RESTRICTION_STATE_INVALID"
          - "origin == MANUAL, else ERR_OVERRIDE_NOT_PERMITTED (an AUTO_OVERBOOK_GUARD restriction is only lifted by the system)"
        side_effects:
          - "sets lifted_at = logical clock and lift_reason = MANUAL_LIFT"
          - "creates one DistributionBatch {payload_kind: RESTRICTION, source_ref_kind: RESTRICTION, source_ref_id: this restriction id, batch_state: QUEUED} which itself fans out one RateDistributionJob per VERIFIED ChannelMapping on the restriction's room type"
          - "increments Restriction.version by 1"
      - from: ACTIVE
        to: LIFTED
        trigger: "system event: the guarded InventoryDay's pooled_state leaves OVERSOLD"
        actor: system
        preconditions:
          - "restriction_state == ACTIVE and origin == AUTO_OVERBOOK_GUARD"
        side_effects:
          - "sets lifted_at = logical clock and lift_reason = AUTO_GUARD_CLEARED"
          - "creates one RESTRICTION DistributionBatch and its child jobs exactly as for a manual lift"
          - "increments Restriction.version by 1"
        note: "Same (from, to) pair reached by two different triggers with different actors and preconditions."

  - entity: Promotion
    initial_state: DRAFT
    terminal_states: []
    parallel_dimensions:
      - "approval_status: DRAFT -> SUBMITTED -> {APPROVED | REJECTED}, REJECTED -> DRAFT"
      - "distribution_status: NOT_LOADED -> LOADING -> {LOADED | LOAD_FAILED}, LOAD_FAILED -> LOADING"
    transitions:
      - from: "approval_status=DRAFT"
        to: "approval_status=SUBMITTED"
        trigger: "POST /distribution/promotions/{id}/submit"
        actor: RevenueManager | RevenueDirector
        preconditions:
          - "approval_status IN {DRAFT}, else ERR_PROMOTION_STATE_INVALID"
          - "discount_kind == PERCENT implies discount_bp <= MAX_STACK_DISCOUNT_BP (3000), else ERR_INVALID_REQUEST"
        side_effects:
          - "sets submitted_by_user_id = X-User-ID"
          - "increments Promotion.version by 1"
        note: "distribution_status is untouched by every approval-axis transition."
      - from: "approval_status=SUBMITTED"
        to: "approval_status=APPROVED"
        trigger: "POST /distribution/promotions/{id}/approve"
        actor: RevenueDirector
        preconditions:
          - "approval_status == SUBMITTED, else ERR_PROMOTION_STATE_INVALID"
          - "X-User-ID != submitted_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "sets approved_by_user_id = X-User-ID"
          - "the promotion becomes eligible for sell-rate resolution from this instant (approval_status only; distribution_status is not consulted by calculations.sell_rate_resolution)"
          - "increments Promotion.version by 1"
      - from: "approval_status=SUBMITTED"
        to: "approval_status=REJECTED"
        trigger: "POST /distribution/promotions/{id}/reject"
        actor: RevenueDirector
        preconditions:
          - "approval_status == SUBMITTED, else ERR_PROMOTION_STATE_INVALID"
          - "X-User-ID != submitted_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "sets reject_reason to the submitted reason, or to null when none was supplied"
          - "increments Promotion.version by 1"
      - from: "approval_status=REJECTED"
        to: "approval_status=DRAFT"
        trigger: "POST /distribution/promotions/{id}/revise"
        actor: RevenueManager
        preconditions:
          - "approval_status == REJECTED, else ERR_PROMOTION_STATE_INVALID"
        side_effects:
          - "clears submitted_by_user_id and reject_reason back to null so the next submitter may differ, and increments revision_count by 1"
          - "increments Promotion.version by 1"
        note: "Closes the SUBMITTED -> REJECTED -> DRAFT -> SUBMITTED cycle on the approval axis."
      - from: "distribution_status=NOT_LOADED"
        to: "distribution_status=LOADING"
        trigger: "POST /distribution/promotions/{id}/load"
        actor: ChannelOpsEngineer
        preconditions:
          - "distribution_status IN {NOT_LOADED, LOAD_FAILED}, else ERR_PROMOTION_STATE_INVALID"
          - "at least one ChannelMapping with rate_plan_id == this promotion's rate_plan_id and mapping_state == VERIFIED exists, else ERR_CHANNEL_MAPPING_MISSING"
          - "every such VERIFIED mapping has parity_state == IN_PARITY, else ERR_CONTENT_PARITY_BLOCKED"
        side_effects:
          - "creates one DistributionBatch {payload_kind: PROMOTION, source_ref_kind: PROMOTION, source_ref_id: this promotion id, batch_state: QUEUED} which itself fans out one QUEUED RateDistributionJob per VERIFIED mapping"
          - "increments Promotion.version by 1"
        note: "The approval axis is NOT read here: a DRAFT promotion may be loaded, and an APPROVED promotion may stay NOT_LOADED."
      - from: "distribution_status=LOADING"
        to: "distribution_status=LOADED"
        trigger: "system event: the promotion's DistributionBatch resolves to APPLIED"
        actor: system
        preconditions:
          - "distribution_status == LOADING and batch_state == APPLIED"
        side_effects:
          - "the promotion is now live on every channel the batch reached"
          - "increments Promotion.version by 1"
        note: "Cascade depth 4: promotion load -> batch -> last job APPLIED -> batch APPLIED -> promotion LOADED."
      - from: "distribution_status=LOADING"
        to: "distribution_status=LOAD_FAILED"
        trigger: "system event: the promotion's DistributionBatch resolves to FAILED or PARTIALLY_APPLIED"
        actor: system
        preconditions:
          - "distribution_status == LOADING and batch_state IN {FAILED, PARTIALLY_APPLIED}"
        side_effects:
          - "increments Promotion.version by 1"
      - from: "distribution_status=LOAD_FAILED"
        to: "distribution_status=LOADING"
        trigger: "POST /distribution/promotions/{id}/load"
        actor: ChannelOpsEngineer
        preconditions:
          - "distribution_status IN {NOT_LOADED, LOAD_FAILED}, else ERR_PROMOTION_STATE_INVALID"
        side_effects:
          - "creates a further PROMOTION DistributionBatch and its child jobs"
          - "increments Promotion.version by 1"
        note: "Closes the LOADING -> LOAD_FAILED -> LOADING cycle on the distribution axis."
      - from: "distribution_status=LOAD_FAILED"
        to: "distribution_status=LOADING"
        trigger: "system event: a child RateDistributionJob of the promotion's own PROMOTION batch is re-queued by POST /distribution/distribution-jobs/{id}/retry"
        actor: system
        preconditions:
          - "distribution_status == LOAD_FAILED and the retried job's parent batch has source_ref_kind == PROMOTION and source_ref_id == this promotion id"
        side_effects:
          - "no new DistributionBatch is created - the existing batch is re-opened by the retry and re-derives to DISPATCHING"
          - "increments Promotion.version by 1"
        note: "Second entry into LOADING, and the reason a retried promotion batch can still reach LOADED without a second load call."

  - entity: DistributionBatch
    initial_state: QUEUED
    terminal_states: []
    transitions:
      - from: QUEUED
        to: DISPATCHING
        trigger: "POST /distribution/distribution-batches/{id}/dispatch"
        actor: ChannelOpsEngineer
        preconditions:
          - "batch_state IN {QUEUED, PARTIALLY_APPLIED, FAILED}, else ERR_BATCH_NOT_DISPATCHABLE"
          - "total_jobs >= 1, else ERR_BATCH_NOT_DISPATCHABLE"
        side_effects:
          - "sets dispatched_at = logical clock"
          - "every child RateDistributionJob in QUEUED is resolved in sequence_index ASC order per calculations.job_dispatch_resolution; each job lands in APPLIED or REJECTED"
          - "each REJECTED job increments its ChannelConnection.consecutive_failures, which may drive the connection HEALTHY -> DEGRADED -> SUSPENDED"
          - "batch counters applied_jobs and rejected_jobs are recomputed, then batch_state is re-derived per calculations.batch_state_rollup"
          - "increments DistributionBatch.version by 1"
      - from: DISPATCHING
        to: APPLIED
        trigger: "system event: every child job is terminal-successful (applied_jobs == total_jobs)"
        actor: system
        preconditions:
          - "batch_state == DISPATCHING and applied_jobs == total_jobs"
        side_effects:
          - "when source_ref_kind == PROMOTION the source promotion's distribution_status moves LOADING -> LOADED"
          - "increments DistributionBatch.version by 1"
        note: "Compound (bubble-up) state: the parent is derived from its children."
      - from: DISPATCHING
        to: PARTIALLY_APPLIED
        trigger: "system event: applied_jobs >= 1 and rejected_jobs >= 1 and applied_jobs + rejected_jobs == total_jobs"
        actor: system
        preconditions:
          - "batch_state == DISPATCHING"
        side_effects:
          - "when source_ref_kind == PROMOTION the source promotion's distribution_status moves LOADING -> LOAD_FAILED"
          - "increments DistributionBatch.version by 1"
        note: "Fork-join: the join outcome depends on the mix of child results, not on their count alone."
      - from: DISPATCHING
        to: FAILED
        trigger: "system event: rejected_jobs == total_jobs"
        actor: system
        preconditions:
          - "batch_state == DISPATCHING and applied_jobs == 0"
        side_effects:
          - "when source_ref_kind == PROMOTION the source promotion's distribution_status moves LOADING -> LOAD_FAILED"
          - "increments DistributionBatch.version by 1"
      - from: PARTIALLY_APPLIED
        to: DISPATCHING
        trigger: "POST /distribution/distribution-batches/{id}/dispatch after at least one child job has been re-queued by POST /distribution/distribution-jobs/{id}/retry"
        actor: ChannelOpsEngineer
        preconditions:
          - "batch_state IN {QUEUED, PARTIALLY_APPLIED, FAILED}"
          - "at least one child job is in QUEUED, else ERR_BATCH_NOT_DISPATCHABLE"
        side_effects:
          - "resolves the re-queued jobs and re-derives batch_state per calculations.batch_state_rollup"
          - "increments DistributionBatch.version by 1"
        note: "Closes the DISPATCHING -> PARTIALLY_APPLIED -> DISPATCHING cycle. FAILED -> DISPATCHING works identically."

  - entity: RateDistributionJob
    initial_state: QUEUED
    terminal_states: [ABANDONED]
    transitions:
      - from: QUEUED
        to: DISPATCHED
        trigger: "system event: the parent DistributionBatch is dispatched and this job's sequence_index comes up"
        actor: system
        preconditions:
          - "job_state == QUEUED"
        side_effects:
          - "increments attempt_count by 1"
          - "increments RateDistributionJob.version by 1"
      - from: DISPATCHED
        to: APPLIED
        trigger: "system event: calculations.job_dispatch_resolution accepts the job"
        actor: system
        preconditions:
          - "job_state == DISPATCHED"
          - "the target ChannelMapping.mapping_state == VERIFIED and its parity_state == IN_PARITY"
          - "the mapping's ChannelConnection.connection_state IN {HEALTHY, DEGRADED}"
        side_effects:
          - "sets applied_at = logical clock and failure_reason = null"
          - "sets the target ChannelMapping.last_pushed_rate_cents to the resolved sell amount and recomputes mismatch_state per calculations.rate_mismatch_evaluation"
          - "increments the parent batch's applied_jobs by 1"
          - "increments RateDistributionJob.version by 1"
        note: "An APPLIED job never resets ChannelConnection.consecutive_failures; only an OK heartbeat does."
      - from: DISPATCHED
        to: REJECTED
        trigger: "system event: calculations.job_dispatch_resolution refuses the job"
        actor: system
        preconditions:
          - "job_state == DISPATCHED"
          - "the target mapping is not VERIFIED, or its parity_state == OUT_OF_PARITY, or its connection_state IN {PENDING, SUSPENDED, RETIRED}"
        side_effects:
          - "leaves applied_at null and sets failure_reason to MAPPING_NOT_VERIFIED, PARITY_BLOCKED or CONNECTION_UNAVAILABLE"
          - "increments the parent batch's rejected_jobs by 1"
          - "increments the target connection's consecutive_failures by 1 and sets its last_failure_code, which itself may drive HEALTHY -> DEGRADED or DEGRADED -> SUSPENDED"
          - "when failure_reason IN {MAPPING_NOT_VERIFIED, PARITY_BLOCKED} and the mapping is VERIFIED, the mapping moves VERIFIED -> ERRORED"
          - "increments RateDistributionJob.version by 1"
        note: "Head of the depth-5 cascade: job -> connection -> allocations -> inventory days -> guard restriction."
      - from: REJECTED
        to: QUEUED
        trigger: "POST /distribution/distribution-jobs/{id}/retry"
        actor: ChannelOpsEngineer
        preconditions:
          - "job_state == REJECTED, else ERR_JOB_NOT_RETRYABLE"
          - "attempt_count < MAX_JOB_ATTEMPTS (3), else ERR_JOB_NOT_RETRYABLE"
        side_effects:
          - "clears applied_at and failure_reason back to null while attempt_count is preserved"
          - "decrements the parent batch's rejected_jobs by 1 and re-derives batch_state per calculations.batch_state_rollup"
          - "when the parent batch has source_ref_kind == PROMOTION and that promotion's distribution_status == LOAD_FAILED, the promotion moves LOAD_FAILED -> LOADING"
          - "increments RateDistributionJob.version by 1"
        note: "Closes the DISPATCHED -> REJECTED -> QUEUED cycle; attempt_count is never reset, so the cycle terminates after MAX_JOB_ATTEMPTS."
      - from: REJECTED
        to: ABANDONED
        trigger: "system event: the target ChannelMapping is disabled while this job is REJECTED or QUEUED"
        actor: system
        preconditions:
          - "job_state IN {QUEUED, REJECTED}"
        side_effects:
          - "sets failure_reason = MAPPING_DISABLED"
          - "the parent batch's counters are recomputed treating ABANDONED as terminal-unsuccessful, then batch_state is re-derived"
          - "increments RateDistributionJob.version by 1"

  - entity: Reservation
    initial_state: CONFIRMED
    terminal_states: [CANCELLED]
    transitions:
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /distribution/reservations/{id}/cancel"
        actor: RevenueManager | ChannelPartner
        preconditions:
          - "reservation_state == CONFIRMED, else ERR_RESERVATION_NOT_CANCELLABLE"
          - "when the caller is ChannelPartner, X-User-ID == the reservation's channel_id, else ERR_CHANNEL_OWNERSHIP_VIOLATION"
        side_effects:
          - "sets cancelled_at = logical clock"
          - "every InventoryDay of the reservation's room type whose stay_date falls in [arrival_date, departure_date) is recomputed: committed_units drops by 1, shared_pool_units or the consuming allocation's consumed_units is restored, pooled_state re-derived per calculations.inventory_pool_state"
          - "the consuming ChannelAllocation, when the reservation drew from an allotment, moves EXHAUSTED -> OPEN if consumed_units falls below allocated_units"
          - "an AUTO_OVERBOOK_GUARD STOP_SELL Restriction whose guarded InventoryDay leaves OVERSOLD moves ACTIVE -> LIFTED with lift_reason AUTO_GUARD_CLEARED, which itself creates a RESTRICTION DistributionBatch and its jobs"
          - "the reservation's gross, commission and net contributions are removed from the channel ledger so gross_amount_cents == net_amount_cents + commission_amount_cents still holds over the surviving CONFIRMED reservations"
        note: "Compensation: cancellation reverses every side effect of creation with no drift."

  - entity: InventoryDay
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: OPEN
        to: TIGHT
        trigger: "system event: a CONFIRMED Reservation or a new ChannelAllocation raises allocated_units + committed_units to at least physical_capacity_units"
        actor: system
        preconditions:
          - "allocated_units + committed_units >= physical_capacity_units and allocated_units + committed_units < overbooking_ceiling_units"
        side_effects:
          - "shared_pool_units and pooled_state are recomputed per calculations.inventory_pool_state"
          - "increments InventoryDay.version by 1"
      - from: TIGHT
        to: EXHAUSTED
        trigger: "system event: a further CONFIRMED Reservation raises allocated_units + committed_units to overbooking_ceiling_units"
        actor: system
        preconditions:
          - "allocated_units + committed_units == overbooking_ceiling_units"
        side_effects:
          - "shared_pool_units becomes 0 and pooled_state becomes EXHAUSTED"
          - "increments InventoryDay.version by 1"
      - from: EXHAUSTED
        to: OVERSOLD
        trigger: "system event: committed_units alone exceeds physical_capacity_units while the ceiling is reached"
        actor: system
        preconditions:
          - "allocated_units + committed_units == overbooking_ceiling_units and committed_units > physical_capacity_units"
        side_effects:
          - "creates one Restriction {restriction_type: STOP_SELL, origin: AUTO_OVERBOOK_GUARD, restriction_state: ACTIVE} covering this stay_date for every ACTIVE RatePlan on the property"
          - "each such restriction creation itself creates a RESTRICTION DistributionBatch which itself fans out one RateDistributionJob per VERIFIED ChannelMapping on the room type"
          - "increments InventoryDay.version by 1"
        note: "Cascade depth 4: reservation -> inventory day OVERSOLD -> auto STOP_SELL restriction -> batch -> jobs."
      - from: OVERSOLD
        to: TIGHT
        trigger: "system event: a cancellation or an allocation release lowers committed_units back to at most physical_capacity_units"
        actor: system
        preconditions:
          - "committed_units <= physical_capacity_units and allocated_units + committed_units >= physical_capacity_units"
        side_effects:
          - "the AUTO_OVERBOOK_GUARD STOP_SELL restrictions guarding this day move ACTIVE -> LIFTED with lift_reason AUTO_GUARD_CLEARED"
          - "increments InventoryDay.version by 1"
        note: "Closes the TIGHT -> EXHAUSTED -> OVERSOLD -> TIGHT cycle; pooled_state is fully derived, never set by input."
      - from: TIGHT
        to: OPEN
        trigger: "system event: a cancellation, an allocation release or an allocation recall lowers allocated_units + committed_units below physical_capacity_units"
        actor: system
        preconditions:
          - "allocated_units + committed_units < physical_capacity_units"
        side_effects:
          - "shared_pool_units and pooled_state are recomputed"
          - "increments InventoryDay.version by 1"

# ---------------------------------------------------------------------------
# 1.2.1 Concurrency Rules (optimistic concurrency control)
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_name: allocation-create-stale-room-type
    parent_entity: RoomType
    child_entity: ChannelAllocation
    occ_field: expected_room_type_version
    write_endpoint: "POST /distribution/room-types/{id}/allocations"
    error_id: ERR_STALE_ROOM_TYPE_VERSION
    status: 412
    description: >-
      Allotting units against a room type requires the caller to echo the room type's current
      version in expected_room_type_version. The server compares the submitted value with
      RoomType.version at the moment the allotment is evaluated. When the two differ the write is
      refused with ERR_STALE_ROOM_TYPE_VERSION (412) and no ChannelAllocation, InventoryDay
      recompute or supersede side effect is applied. When they match, the allotment is created,
      the aggregate-capacity check of calculations.allocation_aggregate_capacity_check runs, any
      same-key predecessor allotment moves to SUPERSEDED, the covered InventoryDay rows are
      recomputed, and RoomType.version is incremented by 1 so the echoed value is spent.
    version_bump: "RoomType.version += 1 on every accepted allotment creation and on every accepted PATCH /distribution/room-types/{id}"
    note: >-
      The version check sits at priority P10, after path existence, role and shape checks and
      before every state and business check, so a stale echo is reported even when the requested
      units would also breach the overbooking ceiling.

  - rule_name: rate-plan-update-stale-version
    parent_entity: RatePlan
    child_entity: DistributionBatch
    occ_field: expected_rate_plan_version
    write_endpoint: "PATCH /distribution/rate-plans/{id}"
    error_id: ERR_STALE_RATE_PLAN_VERSION
    status: 412
    description: >-
      Repricing an ACTIVE rate plan requires the caller to echo the plan's current version in
      expected_rate_plan_version. When the echoed value differs from RatePlan.version the patch is
      refused with ERR_STALE_RATE_PLAN_VERSION (412): no field changes, no descendant plan is
      re-derived, and no DistributionBatch or RateDistributionJob is created. When the echoed value
      matches, the fields are applied, resolved_base_amount_cents is re-derived on this plan and on
      every descendant plan, one RATE DistributionBatch plus its child jobs are created, and
      RatePlan.version is incremented by 1.
    version_bump: "RatePlan.version += 1 on activate, on every accepted patch, and on close"
    note: >-
      Because activation and closure also bump the version, a caller that read the plan while it was
      DRAFT and patched it after activation is refused on the version check rather than on state.

# ---------------------------------------------------------------------------
# 1.3 Calculation Rules
# ---------------------------------------------------------------------------
calculations:
  - name: resolved_base_amount
    trigger: "On RatePlan creation, on activation, on every accepted PATCH, and on every ancestor plan's re-derivation"
    algorithm: topological
    formula: |
      derivation_depth(plan):
        0                              when plan.parent_rate_plan_id is null
        derivation_depth(parent) + 1   otherwise
      # creation is refused with ERR_DERIVATION_DEPTH_EXCEEDED when
      # derivation_depth(new_plan) > MAX_DERIVATION_DEPTH
      resolved_base_amount_cents(plan):
        plan.base_amount_cents                                       when plan.parent_rate_plan_id is null
        round_half_up(parent_resolved * (10000 + plan.offset_bp) / 10000)
                                                                     when plan.offset_kind == "PERCENT"
        parent_resolved + plan.offset_amount_cents                   when plan.offset_kind == "AMOUNT"
      where parent_resolved = resolved_base_amount_cents(plan.parent_rate_plan_id)
      # plans are re-derived parent-before-child, so a PATCH on a root plan
      # settles every descendant in one pass (no iteration to a fixed point)
      round_half_up(a / b) for integers with b > 0 == (2*a + b) // (2*b)
    input_set: >-
      The plan itself plus the chain of ancestors reached through parent_rate_plan_id. A plan's own
      base_amount_cents is ignored whenever parent_rate_plan_id is non-null. Plan state is irrelevant:
      a DRAFT parent still supplies the value used to derive a child's stored amount, but activating
      the child requires the parent to be ACTIVE.
    constants:
      MAX_DERIVATION_DEPTH: 2
    precision: "integer minor units (cents); round_half_up on the PERCENT branch only"
    worked_example: >-
      BAR (root, base 25000) resolves to 25000. CORP (parent BAR, PERCENT, offset_bp -1500) resolves to
      round_half_up(25000 * 8500 / 10000) = 21250. OPQ (parent BAR, PERCENT, offset_bp -2500) resolves to
      18750. PKG (parent BAR, AMOUNT, offset_amount_cents 8000) resolves to 33000.

  - name: sell_rate_resolution
    trigger: "GET /distribution/channel-mappings/{id}/quoted-rate, and per stay night while pricing a reservation"
    algorithm: waterfall_allocation
    formula: |
      # Steps run in exactly this order. Reordering any two changes the result.
      S1  running = plan.resolved_base_amount_cents
          base    = running
      S2  # promotion stacking, sequential and compounding
          for kind in [MEMBER_RATE, GEO_OFFER, PACKAGE_INCLUSION]:      # fixed kind order
            promo = the eligible promotion of that kind with the earliest created_at   # at most one
            if promo is null: continue
            if promo.discount_kind == "PERCENT":
              running = round_half_up(running * (10000 - promo.discount_bp) / 10000)
            else:                                                        # AMOUNT
              running = running - promo.discount_amount_cents
      S3  # the stacking cap applies to the TOTAL, after all promotions, never per promotion
          discount_total = base - running
          cap            = floor(base * MAX_STACK_DISCOUNT_BP / 10000)
          if discount_total > cap: discount_total = cap
          running = base - discount_total
      S4  running = round_half_up(running * (10000 + channel.sell_adjustment_bp) / 10000)
      S5  running = min(max(running, plan.floor_amount_cents), plan.ceiling_amount_cents)
      S6  sell_amount_cents = running + plan.package_inclusion_cents
      # S6 sits OUTSIDE the clamp: a package inclusion may carry the quote above ceiling_amount_cents.
    input_set: >-
      Eligible promotions are the Promotion rows whose rate_plan_id == the quoted plan, whose
      approval_status == APPROVED, and whose [start_date, end_date] closed interval
      covers the stay night being priced. distribution_status is NOT consulted. A GEO_OFFER promotion
      is additionally eligible only when the request's geo_market_code is listed in its geo_markets; a
      MEMBER_RATE promotion only when the request's member_flag flag is true.
    constants:
      MAX_STACK_DISCOUNT_BP: 3000
    precision: "integer cents; round_half_up at S2-PERCENT and S4; floor at the S3 cap"
    worked_example: >-
      BAR (25000, floor 18000, ceiling 40000) on BRAND (sell_adjustment_bp 0) for a member from US-CA on
      2026-09-10 with MEMBER10 (PERCENT 1000) and GEO10USD (AMOUNT 1000): S2 gives 25000 -> 22500 -> 21500;
      S3 discount_total 3500 <= cap 7500 so running stays 21500; S4 21500; S5 inside [18000, 40000]; S6 + 0
      = 21500. Member only = 22500. No promotion = 25000. On BARCAP (25000, floor 15000) with MEMBER30
      (PERCENT 3000) and GEO10USD: S2 gives 25000 -> 17500 -> 16500, S3 discount_total 8500 > cap 7500 so
      running is restored to 17500 -> quote 17500. Per-promotion capping would have produced 16500.
      On a plan with floor_amount_cents 22000 the same 21500 running clamps up to 22000 at S5.

  - name: reservation_charge_breakdown
    trigger: "POST /distribution/reservations"
    algorithm: aggregation
    formula: |
      nights = [arrival_date .. departure_date)                # half-open, one entry per night
      for each night d:
        nightly_amount_cents[d] = sell_rate_resolution(plan, channel, d)
        commissionable[d]       = nightly_amount_cents[d] - plan.package_inclusion_cents
        commission[d]           = round_half_up(commissionable[d] * channel.commission_bp / 10000)
      gross_amount_cents      = sum(nightly_amount_cents)
      commission_amount_cents = sum(commission)                # round PER NIGHT, then sum
      net_amount_cents        = gross_amount_cents - commission_amount_cents
      # Rounding the commission once on the gross total is WRONG and observably different.
      # The package inclusion is never commissionable.
    input_set: >-
      Only the nights of this reservation. Each night is priced independently, so a promotion whose
      window covers only part of the stay changes some nights and not others.
    constants:
      DAY_BOUNDARY: "stay nights are the half-open interval [arrival_date, departure_date)"
    precision: "integer cents; round_half_up per night"
    worked_example: >-
      BAR on OTA1 (commission_bp 1750, package_inclusion_cents 0), member from US-CA, 2026-09-10 ->
      2026-09-13, MEMBER10 always in window and GEO10USD in window only on 2026-09-10 and 2026-09-11:
      nightly [21500, 21500, 22500], gross 65500; commission 3763 + 3763 + 3938 = 11464; net 54036.
      Rounding once on the total would give round_half_up(65500 * 1750 / 10000) = 11463 - off by one cent.
      PKG on OTA1 (package_inclusion_cents 2500), 2026-09-10 -> 2026-09-12 with no promotion: nightly
      [35500, 35500], gross 71000; commissionable 33000 per night; commission 5775 + 5775 = 11550;
      net 59450. Commissioning the inclusion too would give 6213 + 6213 = 12426.

  - name: package_loyalty_credit
    trigger: "POST /distribution/reservations, after reservation_charge_breakdown"
    algorithm: tiered_pricing
    formula: |
      # evaluation order is pinned; each step consumes only the steps above it
      E1  gross_amount_cents      (from reservation_charge_breakdown, inclusions INCLUDED)
      E2  tier_bp = 0    when gross_amount_cents < 50000
                    400  when 50000 <= gross_amount_cents < 70000
                    600  when gross_amount_cents >= 70000
      E3  commission_amount_cents and net_amount_cents (from reservation_charge_breakdown)
      E4  loyalty_credit_cents = round_half_up(net_amount_cents * tier_bp / 10000)
      # The tier is keyed on GROSS, the credit is applied to NET, and the credit never
      # re-enters gross, net or commission - it is a terminal derived field.
    input_set: "This reservation only; no history, no other reservations, no channel aggregate."
    constants:
      LOYALTY_TIER_1_FLOOR_CENTS: 50000
      LOYALTY_TIER_1_BP: 400
      LOYALTY_TIER_2_FLOOR_CENTS: 70000
      LOYALTY_TIER_2_BP: 600
    precision: "integer cents; round_half_up once at E4"
    worked_example: >-
      BAR reservation above: gross 65500 -> tier 400 bp, net 54036 -> credit round_half_up(54036 * 400 /
      10000) = 2161. PKG reservation above: gross 71000 (inclusions counted) -> tier 600 bp, net 59450 ->
      credit 3567. Keying the tier on net instead of gross would put the PKG stay in the 400 bp tier and
      yield 2378; dropping the inclusions from the tier key (gross 66000) would also yield 400 bp.

  - name: inventory_pool_state
    trigger: >-
      On InventoryDay creation and on every event that changes held or sold units for the day:
      allotment creation, supersede, release, recall, reservation creation and reservation cancellation
    algorithm: constraint_propagation
    formula: |
      effective_overbooking_pct_bp = room_type.overbooking_pct_bp        when non-null
                                 property.overbooking_pct_bp         otherwise
      overbooking_ceiling_units = physical_capacity_units
                                + floor(physical_capacity_units * effective_overbooking_pct_bp / 10000)
      allocated_units = sum over ChannelAllocation a where
                          a.room_type_id == this room type
                          and a.allocation_state in {OPEN, EXHAUSTED}
                          and a.start_date <= stay_date <= a.end_date     # closed interval
                        of (a.allocated_units - a.consumed_units)         # UNCONSUMED held units
      committed_units      = count of CONFIRMED Reservation rows r where
                          r.room_type_id == this room type
                          and r.arrival_date <= stay_date < r.departure_date   # half-open
      shared_pool_units = overbooking_ceiling_units - allocated_units - committed_units
      pooled_state = OVERSOLD    when committed_units > physical_capacity_units
                     EXHAUSTED   when shared_pool_units == 0
                     TIGHT       when allocated_units + committed_units >= physical_capacity_units
                     OPEN        otherwise
      # CONSERVED QUANTITY (units), holds after every one of the events above:
      #   overbooking_ceiling_units == allocated_units + committed_units + shared_pool_units
      # A booking that draws from an allotment moves one unit from allocated_units to committed_units and
      # leaves shared_pool_units untouched; a booking that draws from the pool moves one unit from
      # shared_pool_units to committed_units. Either way the sum is preserved.
      #
      # BOOKING ADMISSION - three bands, evaluated per night:
      #   draw_source = ALLOTMENT when the booking channel holds an OPEN ChannelAllocation covering
      #                 EVERY night with (allocated_units - consumed_units) >= 1, else POOL
      #   an ALLOTMENT draw is always admitted - the allotment already booked the risk, and it
      #   never consumes the override
      #   a POOL draw is admitted only when, on every night,
      #     shared_pool_units >= 1                       else ERR_OVERBOOKING_CEILING_EXCEEDED
      #   and, when the unit lands in the overbooking band on any night, i.e.
      #     allocated_units + committed_units >= physical_capacity_units
      #     the request must carry override_overbooking == true
      #                                                  else ERR_OVERBOOK_OVERRIDE_REQUIRED
      #   overbooking_overridden is set true on the Reservation only when the override was actually
      #   CONSUMED - passing override_overbooking true on a day with room below capacity leaves it false
    input_set: >-
      Allotments in OPEN or EXHAUSTED only - RELEASED, RECALLED and SUPERSEDED allotments contribute
      nothing. Reservations in CONFIRMED only - CANCELLED reservations contribute nothing. pooled_state
      is fully derived and can never be supplied as input.
    constants:
      PROPERTY_OVERBOOKING_PCT_BP_DEFAULT: 0
    precision: "integer units; floor on the overbooking uplift so a fractional room is never sold"
    worked_example: >-
      KING (capacity 10, property overbooking_pct_bp 1000) has overbooking_ceiling_units 11. TWIN
      (capacity 2, room-type override 5000) has 2 + floor(2 * 5000 / 10000) = 3. On a TWIN day with no
      allotments: the 1st and 2nd bookings need no override (allocated + committed is 0 then 1, both below
      capacity 2) and leave shared_pool_units 1 with pooled_state TIGHT; the 3rd booking lands in the
      overbooking band (allocated + committed == 2 == capacity) so without override_overbooking it is
      refused with ERR_OVERBOOK_OVERRIDE_REQUIRED, and with it the booking is accepted with
      overbooking_overridden true, shared_pool_units 0 and committed_units 3 > capacity 2, so pooled_state
      becomes OVERSOLD; a 4th booking is refused with ERR_OVERBOOKING_CEILING_EXCEEDED even with the
      override, because shared_pool_units is already 0.

  - name: allocation_aggregate_capacity_check
    trigger: "POST /distribution/room-types/{id}/allocations"
    algorithm: threshold
    formula: |
      # Overlapping allotments are LEGAL. The check is aggregate, per date, not pairwise.
      superseded = the ChannelAllocation with the same (channel_id, start_date, end_date) as the request
                   and allocation_state in {OPEN, EXHAUSTED}, if any    # leaves the pool first
      for each date d in [request.start_date .. request.end_date]:      # closed interval
        held_d = sum over a in {OPEN, EXHAUSTED} allotments covering d, a != superseded,
                 of (a.allocated_units - a.consumed_units)
        committed_d = committed_units(d)                                          # from inventory_pool_state
        if held_d + committed_d + request.units > overbooking_ceiling_units(d):
          reject with ERR_ALLOCATION_EXCEEDS_CEILING
      # Boundary: held_d + committed_d + request.units == overbooking_ceiling_units(d) is ACCEPTED.
      # A date in the range with no InventoryDay row is rejected with ERR_INVENTORY_DAY_NOT_OPEN.
    input_set: >-
      Every OPEN or EXHAUSTED allotment of the same room type whose closed date range intersects the
      requested closed date range, minus the same-key predecessor being superseded, plus the CONFIRMED
      room nights on each date.
    constants:
      ALLOTMENT_INTERVAL: "closed [start_date, end_date] - both endpoints are held"
    precision: "integer units"
    worked_example: >-
      KING (ceiling 11) with an existing OTA1 allotment of 6 units over 2026-09-10..2026-09-12 and 2
      CONFIRMED room nights on 2026-09-11: a BRAND allotment of 3 units over 2026-09-11..2026-09-11 is
      accepted (6 + 2 + 3 = 11 == ceiling), while 4 units is refused with ERR_ALLOCATION_EXCEEDS_CEILING
      (6 + 2 + 4 = 12). A second OTA1 allotment of 6 units over the identical range 2026-09-10..2026-09-12
      supersedes the first and is accepted, because the predecessor's units leave the pool first.

  - name: restriction_effect_resolution
    trigger: "POST /distribution/reservations, before pricing"
    algorithm: interval_merge
    formula: |
      # Restrictions are scoped: a Restriction applies to a booking when
      #   r.restriction_state == ACTIVE
      #   and r.room_type_id == booking.room_type_id
      #   and (r.rate_plan_id is null or r.rate_plan_id == booking.rate_plan_id)
      # Restriction windows are CLOSED intervals [start_date, end_date].
      # The three types read DIFFERENT dates of the same stay:
      STOP_SELL       applies when any scoped ACTIVE STOP_SELL window covers ANY night
                      d in [arrival_date .. departure_date)   -> ERR_STOP_SELL_ACTIVE
      CLOSED_TO_ARRIVAL applies when any scoped ACTIVE CTA window covers arrival_date
                      -> ERR_CLOSED_TO_ARRIVAL
      MIN_STAY        effective_min_stay_nights = max(r.value_nights) over scoped ACTIVE MIN_STAY
                      windows covering arrival_date, else 0
                      nights = reservation.nights   # departure_date = arrival_date + nights
                      if nights < effective_min_stay_nights -> ERR_MIN_STAY_NOT_MET
      # Order inside priority P17: STOP_SELL, then CLOSED_TO_ARRIVAL, then MIN_STAY.
      # Overlapping MIN_STAY windows are not merged into a sum - the STRICTEST (max) wins.
    input_set: >-
      ACTIVE restrictions only; LIFTED restrictions never apply. Both MANUAL and AUTO_OVERBOOK_GUARD
      origins apply identically to bookings - origin only governs who may lift them.
    constants:
      RESTRICTION_INTERVAL: "closed [start_date, end_date]"
    precision: "whole days; departure_date is computed as arrival_date + nights"
    worked_example: >-
      A MIN_STAY 2 window over 2026-09-10..2026-09-11 and a MIN_STAY 3 window over
      2026-09-11..2026-09-12 both cover an arrival on 2026-09-11, so effective_min_stay_nights is 3 and a
      2-night stay is refused; an arrival on 2026-09-10 sees only the first window and a 2-night stay is
      accepted. A STOP_SELL window over 2026-09-12..2026-09-12 blocks a 2026-09-10 -> 2026-09-13 stay
      (night 2026-09-12 is inside) but not a 2026-09-10 -> 2026-09-12 stay.

  - name: rate_mismatch_evaluation
    trigger: "POST /distribution/channel-mappings/{id}/observed-rates, and on every APPLIED RateDistributionJob"
    algorithm: threshold
    formula: |
      distributed = mapping.last_pushed_rate_cents
      observed    = mapping.observed_rate_cents
      if distributed is null or observed is null:
        mismatch_state = UNKNOWN
      else:
        mismatch_delta_cents = observed - distributed              # signed
        mismatch_state = MISMATCHED  when abs(mismatch_delta_cents) > property.rate_mismatch_tolerance_cents
                     IN_SYNC     otherwise
      # STRICTLY greater: a delta exactly equal to the tolerance is IN_SYNC.
      # last_pushed_rate_cents is the PROMOTION-FREE distributed rate:
      #   promo_free = min(max(round_half_up(plan.resolved_base_amount_cents
      #                        * (10000 + channel.sell_adjustment_bp) / 10000),
      #                    plan.floor_amount_cents), plan.ceiling_amount_cents)
      #                + plan.package_inclusion_cents
    input_set: "The single ChannelMapping plus its Property's tolerance; no history is retained."
    constants:
      PROPERTY_RATE_MISMATCH_TOLERANCE_CENTS_DEFAULT: 0
    precision: "integer cents; comparison is on the absolute value of the signed delta"
    worked_example: >-
      BAR on OTA1 (sell_adjustment_bp 0) distributes 25000. With tolerance 200: observed 25200 gives
      delta +200 and mismatch_state IN_SYNC; observed 25201 gives +201 and MISMATCHED; observed 24800 gives
      -200 and IN_SYNC; observed 24799 gives -201 and MISMATCHED.

  - name: content_parity_evaluation
    trigger: "PATCH /distribution/channel-mappings/{id}/content, on mapping verification, and on every promotion load attempt"
    algorithm: threshold
    formula: |
      parity_state = IN_PARITY when mapping.content_description_hash == room_type.master_description_hash
                                and mapping.content_image_count >= property.required_image_count
                     OUT_OF_PARITY otherwise
      # Both conditions must hold. The image count is >= (at or above the floor passes).
    input_set: "The mapping, its RoomType's master content, and the Property's required_image_count."
    constants:
      PROPERTY_REQUIRED_IMAGE_COUNT_DEFAULT: 0
    precision: "exact string equality on the hash; integer comparison on the count"
    worked_example: >-
      KING master_description_hash "kingv1" and property required_image_count 5: a mapping with hash
      "kingv1" and 5 images is IN_PARITY; 4 images is OUT_OF_PARITY; hash "kingv2" with 6 images is
      OUT_OF_PARITY. A promotion load is refused with ERR_CONTENT_PARITY_BLOCKED while any VERIFIED
      mapping of the plan is OUT_OF_PARITY.

  - name: channel_revenue_ledger
    trigger: "GET /distribution/channels/{id}/performance"
    algorithm: aggregation
    formula: |
      # (1) STORED LIFETIME LEDGER on the Channel entity, maintained on every booking and cancellation
      gross_revenue_cents      = sum over CONFIRMED reservations of this channel of gross_amount_cents
      commission_accrued_cents = sum over the same set of commission_amount_cents
      net_revenue_cents        = gross_revenue_cents - commission_accrued_cents
      room_nights_sold         = sum over the same set of nights
      bookings_count           = count of reservations ever created on this channel
      cancellations_count      = count of those later cancelled
      mismatch_alert_count     = count of this channel's ChannelMapping rows with
                                 mismatch_state == MISMATCHED
      # (2) WINDOWED READ returned by GET /distribution/channels/{id}/performance, over the
      #     reservations selected by the requested basis (see channel_net_adr)
        gross_amount_cents       = sum(gross contribution of the selected nights)
        commission_amount_cents  = sum(commission contribution of the selected nights)
        net_amount_cents         = gross_amount_cents - commission_amount_cents
        room_nights              = count of selected nights
        commission_cost_ratio_bp = round_half_up(commission_amount_cents * 10000 / gross_amount_cents)
                                   when gross_amount_cents > 0, else null
      # CONSERVED QUANTITY (money), holds on both ledgers after every booking and every cancellation:
      #   gross == net + commission
      # bookings_count and cancellations_count are monotonic counters and are NOT reversed by a
      # cancellation - only the money and room-night totals are.
    input_set: >-
      CONFIRMED reservations of this channel only. A cancellation removes the reservation's whole
      contribution, restoring the ledger to its pre-booking values exactly - no residue, no drift.
    constants:
      EMPTY_LEDGER: "gross 0, commission 0, net 0, room_nights 0, commission_cost_ratio_bp null"
    precision: "integer cents; round_half_up once on the ratio"
    worked_example: >-
      OTA1 (commission_bp 1750) holding the 3-night BAR reservation (gross 65500 / commission 11464) and a
      1-night 22500 BAR reservation (commission 3938): gross_revenue_cents 88000,
      commission_accrued_cents 15402, net_revenue_cents 72598, room_nights_sold 4, bookings_count 2,
      cancellations_count 0, and commission_cost_ratio_bp = round_half_up(15402 * 10000 / 88000) = 1750.
      Cancelling the 1-night stay returns the ledger to 65500 / 11464 / 54036 with room_nights_sold 3,
      bookings_count still 2 and cancellations_count 1.

  - name: channel_net_adr
    trigger: "GET /distribution/channels/{id}/performance"
    algorithm: aggregation
    formula: |
      net_adr_cents = round_half_up(net_amount_cents / room_nights)   when room_nights > 0
                      null                                            otherwise
      # The two variants below select DIFFERENT reservations and DIFFERENT room nights from the
      # SAME window, so the same data yields two different net_adr_cents values.
    input_set: "CONFIRMED reservations of the channel; the variant decides which nights are counted."
    constants:
      MIN_MIX_ROOM_NIGHTS: 1
    precision: "integer cents; round_half_up once at the end (never per reservation)"
    variants:
      - name: stay_basis
        when: "basis == STAY on GET /distribution/channels/{id}/performance (the default)"
        difference: >-
          Occupancy view. A reservation contributes only the nights d with
          window_start_date <= d <= window_end_date, and contributes only those nights' amounts:
          gross += nightly_amount_cents[d], commission += commission[d], room_nights += 1 per in-window
          night. created_at is irrelevant, so a stay booked long before the window still counts.
      - name: booked_basis
        when: "basis == BOOKED on GET /distribution/channels/{id}/performance"
        difference: >-
          Production view. A reservation contributes when the date part of its created_at falls in
          [window_start_date, window_end_date], and then contributes ALL of its nights and its whole
          gross/commission/net even for nights outside the window. Stay dates are irrelevant.
    worked_example: >-
      Reservation A (BAR/OTA1, created 2026-08-25, stay 2026-09-10 -> 2026-09-13, nightly
      [21500, 21500, 22500], per-night net [17737, 17737, 18562]) and reservation B (BAR/OTA1, created
      2026-09-03, stay 2026-09-20 -> 2026-09-21, nightly 22500, net 18562), window
      2026-09-01..2026-09-11: stay_basis counts only A's nights 2026-09-10 and 2026-09-11, so
      net 35474 over 2 room nights and net_adr_cents = 17737; booked_basis counts only B (created
      2026-09-03), so net 18562 over 1 room night and net_adr_cents = 18562.

  - name: booking_pace_index
    trigger: "GET /distribution/room-types/{id}/pace"
    algorithm: forward_looking
    formula: |
      as_of_date = date part of the logical clock
      if target_stay_date <= as_of_date: reject with ERR_ANALYTICS_WINDOW_INVALID
      days_out = target_stay_date - as_of_date                       # whole days, >= 1
      # on_the_books(d, cutoff_date) counts CONFIRMED reservations of this room type whose stay
      # covers d (arrival_date <= d < departure_date) AND whose created_at date <= cutoff_date
      target_room_nights = on_the_books(target_stay_date, as_of_date)
      # baseline_room_nights is variant-specific (below); then:
      pace_index_bp = round_half_up(target_room_nights * PACE_BASELINE_WINDOW_DAYS * 10000
                                    / baseline_room_nights)         # rolling_baseline
                    = round_half_up(target_room_nights * 10000 / baseline_room_nights)   # stly_baseline
      pace_state = NO_BASELINE when baseline_room_nights == 0     (pace_index_bp = null)
                   AHEAD       when pace_index_bp > 11000
                   ON_PACE     when 9000 <= pace_index_bp <= 11000
                   BEHIND      when pace_index_bp < 9000
      # Every baseline date is measured at the SAME days_out as the target - a like-for-like
      # comparison, which is why each baseline date carries its own cutoff.
    input_set: >-
      CONFIRMED reservations of this room type only, filtered twice: by the stay date being counted and
      by the created_at cutoff for that date. CANCELLED reservations are excluded from both target and
      baseline.
    constants:
      PACE_BASELINE_WINDOW_DAYS: 7
      STLY_OFFSET_DAYS: 364
      PACE_AHEAD_BP: 11000
      PACE_BEHIND_BP: 9000
    precision: "integer basis points; round_half_up once"
    variants:
      - name: rolling_baseline
        when: "baseline == ROLLING on GET /distribution/room-types/{id}/pace (the default)"
        difference: >-
          baseline_room_nights = sum over the PACE_BASELINE_WINDOW_DAYS dates
          d in [target_stay_date - 7 .. target_stay_date - 1] of on_the_books(d, d - days_out).
          The denominator is a 7-day total, so the numerator is multiplied by 7 to compare a single
          day against the window's daily average.
      - name: stly_baseline
        when: "baseline == STLY on GET /distribution/room-types/{id}/pace"
        difference: >-
          baseline_room_nights = on_the_books(target_stay_date - STLY_OFFSET_DAYS,
          target_stay_date - STLY_OFFSET_DAYS - days_out). A single same-weekday date one year back,
          so the numerator is NOT multiplied by the window length.
    worked_example: >-
      KING, logical clock 2026-09-03, target_stay_date 2026-09-10, days_out 7, one CONFIRMED reservation
      covering 2026-09-10 so target_room_nights = 1. rolling_baseline looks at 2026-09-03..2026-09-09 with
      per-date cutoffs 2026-08-27..2026-09-02; a single reservation booked 2026-08-25 covering
      2026-09-03 and 2026-09-04 makes baseline_room_nights 2, so pace_index_bp =
      round_half_up(1 * 7 * 10000 / 2) = 35000 and pace_state AHEAD. stly_baseline looks at 2025-09-11
      with cutoff 2025-09-04; one reservation booked 2025-09-04 covering 2025-09-11 makes
      baseline_room_nights 1, so pace_index_bp = 10000 and pace_state ON_PACE.

  - name: channel_mix_ranking
    trigger: "GET /distribution/properties/{id}/channel-mix"
    algorithm: weighted_scoring
    formula: |
      window = [window_start_date, window_end_date]                  # closed, inclusive
      if window_end_date < window_start_date
         or (window_end_date - window_start_date) + 1 > property.mix_window_days:
        reject with ERR_ANALYTICS_WINDOW_INVALID
      eligible channels = Channel rows of this property that have a ChannelConnection whose
        connection_state in {HEALTHY, DEGRADED}
        and whose stay_basis room_nights in the window >= MIN_MIX_ROOM_NIGHTS
      if eligible is empty: reject with ERR_NO_ELIGIBLE_CHANNEL
      rank the eligible channels by:
        1. net_adr_cents DESC                (stay_basis)
        2. channel.commission_bp ASC         (cheaper channel wins a tie)
        3. channel.created_at ASC            (never id)
      each row carries rank starting at 1, net_adr_cents, commission_bp,
      commission_cost_ratio_bp and room_nights
    input_set: >-
      Channels of this property whose connection is sellable. PENDING, SUSPENDED and RETIRED connections
      are excluded even when they hold revenue in the window, and a channel with zero room nights in the
      window is excluded even when its connection is HEALTHY.
    constants:
      MIN_MIX_ROOM_NIGHTS: 1
      SELLABLE_CONNECTION_STATES: [HEALTHY, DEGRADED]
    precision: "integer cents and basis points; ranking is total and deterministic"
    worked_example: >-
      With window 2026-09-01..2026-09-30 (30 days, equal to mix_window_days so accepted) and OTA1
      net_adr 17737 / commission_bp 1750 against BRAND net_adr 17737 / commission_bp 0, BRAND ranks 1 on
      the commission tie-break. A 31-day window is refused with ERR_ANALYTICS_WINDOW_INVALID. When the
      only revenue-bearing channel's connection is SUSPENDED, the request is refused with
      ERR_NO_ELIGIBLE_CHANNEL.

  - name: connection_health_scoring
    trigger: "On every RateDistributionJob resolution and on every heartbeat"
    algorithm: aggregation
    formula: |
      resolved = count of RateDistributionJob rows on this connection's channel
                 whose job_state in {APPLIED, REJECTED}
      applied  = count of those whose job_state == APPLIED
      health_score_bp = round_half_up(applied * 10000 / resolved)   when resolved > 0
                        null                                        otherwise
      # health_score_bp is NOT stored on ChannelConnection - it is computed on the read
      # GET /distribution/channels/{id}/performance. connection_state is driven by consecutive_failures:
      #   an ERROR heartbeat or a REJECTED job increments consecutive_failures by 1
      #   an OK heartbeat resets consecutive_failures to 0 (an APPLIED job does NOT)
      #   consecutive_failures >= CONNECTION_FAILURE_SUSPEND_THRESHOLD -> SUSPENDED
      #   revalidate sets consecutive_failures to CONNECTION_FAILURE_SUSPEND_THRESHOLD - 1
    input_set: >-
      Terminal-resolved jobs only: QUEUED, DISPATCHED and ABANDONED jobs are excluded from both
      numerator and denominator, so retrying a REJECTED job back to QUEUED raises the score.
    constants:
      CONNECTION_FAILURE_SUSPEND_THRESHOLD: 3
    precision: "integer basis points; round_half_up once"
    worked_example: >-
      1 APPLIED of 3 resolved jobs gives round_half_up(1 * 10000 / 3) = 3333; 2 of 3 gives 6667.
      A connection revalidated out of SUSPENDED sits at consecutive_failures 2, so one further REJECTED
      job re-suspends it immediately.

  - name: batch_state_rollup
    trigger: >-
      On DistributionBatch fan-out, on dispatch, on every child job resolution, on job retry and on
      job abandonment
    algorithm: projection
    formula: |
      total_jobs   = number of child RateDistributionJob rows, fixed at fan-out
      applied      = count of children in APPLIED
      rejected     = count of children in REJECTED
      abandoned    = count of children in ABANDONED
      open         = count of children in QUEUED or DISPATCHED
      batch_state = QUEUED             when the batch has never been dispatched
                    DISPATCHING        when open >= 1 and a dispatch is executing on this batch
                    APPLIED            when open == 0 and applied == total_jobs
                    FAILED             when open == 0 and applied == 0
                    PARTIALLY_APPLIED  when open == 0 and 0 < applied < total_jobs
                    unchanged          when open >= 1 outside a dispatch
      # rejected + abandoned + applied + open == total_jobs at all times
      applied_jobs   = applied
      rejected_jobs  = rejected
      abandoned_jobs = abandoned
      # The parent state is derived from the children, never set directly, and is re-derived on
      # every child change. A retry is the one child change that does NOT move the parent: it
      # decrements rejected_jobs and leaves the settled PARTIALLY_APPLIED or FAILED state in place,
      # which is exactly what makes the batch dispatchable again (a QUEUED child now exists). The
      # following dispatch call is what moves the parent back to DISPATCHING.
    input_set: >-
      The batch's own child jobs only. ABANDONED counts as terminal-unsuccessful, so a batch whose
      remaining children are all ABANDONED settles to FAILED rather than staying DISPATCHING forever.
      abandoned_jobs is reported separately from rejected_jobs so an operator can tell a retryable failure
      from a dead one.
    constants:
      MAX_JOB_ATTEMPTS: 3
    precision: "integer counts"
    worked_example: >-
      A batch with 3 jobs where 2 apply and 1 is rejected settles to PARTIALLY_APPLIED with
      applied_jobs 2, rejected_jobs 1 and abandoned_jobs 0. Retrying the rejected job leaves rejected_jobs 0
      with one child QUEUED; the next dispatch resolves it and, if it applies, the batch reaches APPLIED
      and any PROMOTION source moves LOADING -> LOADED.

  - name: job_dispatch_resolution
    trigger: "POST /distribution/distribution-batches/{id}/dispatch"
    algorithm: chronological
    formula: |
      children = child jobs in QUEUED, ordered by sequence_index ASC     # assigned at fan-out
                 from the mappings' created_at ASC
      for each job in that order:                                        # strictly sequential
        job -> DISPATCHED, attempt_count += 1
        mapping    = job.channel_mapping_id
        connection = the ChannelConnection of mapping.channel_id
        # failure reasons are tested in this fixed order
        if connection.connection_state in {PENDING, SUSPENDED, RETIRED}:
          job -> REJECTED, failure_reason = CONNECTION_UNAVAILABLE
        elif mapping.mapping_state != VERIFIED:
          job -> REJECTED, failure_reason = MAPPING_NOT_VERIFIED
        elif mapping.parity_state == OUT_OF_PARITY:
          job -> REJECTED, failure_reason = PARITY_BLOCKED
        else:
          job -> APPLIED
          mapping.last_pushed_rate_cents = promo_free distributed rate
                                                  (see rate_mismatch_evaluation)
          mapping.mismatch_state = rate_mismatch_evaluation(mapping)
        # rejection side effects land BEFORE the next job is dispatched, so an early rejection
        # that drives the shared connection to SUSPENDED makes every later job on that channel
        # fail with CONNECTION_UNAVAILABLE within the same dispatch
        recompute batch counters and batch_state per batch_state_rollup
    input_set: >-
      QUEUED children only. Already-APPLIED children are not re-evaluated and their
      last_pushed_rate_cents is not refreshed by a later dispatch.
    constants:
      CONNECTION_FAILURE_SUSPEND_THRESHOLD: 3
    precision: "integer counts; order is total and deterministic via sequence_index"
    worked_example: >-
      A batch of 3 jobs on one channel whose connection sits at consecutive_failures 2 with all three
      mappings unverified: job 1 is REJECTED with MAPPING_NOT_VERIFIED and raises consecutive_failures to
      3, suspending the connection; jobs 2 and 3 are then REJECTED with CONNECTION_UNAVAILABLE. Dispatching
      the same three jobs in the reverse order would attribute the reasons to different mappings, which is
      why sequence_index is fixed at fan-out.

# ---------------------------------------------------------------------------
# 1.4 Validation Rules (evaluated strictly in priority order; the first
#     violated rule decides the response and no side effect is applied)
# ---------------------------------------------------------------------------
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and non-empty"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "X-User-Role is one of PlatformAdmin, RevenueManager, RevenueDirector, ChannelOpsEngineer, ChannelPartner"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 3
    category: auth
    check: "the role in X-User-Role is listed in the endpoint's roles"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: all

  - priority: 4
    category: existence
    check: >-
      every {id} segment in the path resolves, validated left to right: property, room type,
      inventory day, channel, channel connection, rate plan, channel mapping, allocation,
      restriction, promotion, distribution batch, distribution job, reservation
    error_id: ERR_PROPERTY_NOT_FOUND | ERR_ROOM_TYPE_NOT_FOUND | ERR_INVENTORY_DAY_NOT_FOUND | ERR_CHANNEL_NOT_FOUND | ERR_CONNECTION_NOT_FOUND | ERR_RATE_PLAN_NOT_FOUND | ERR_CHANNEL_MAPPING_NOT_FOUND | ERR_ALLOCATION_NOT_FOUND | ERR_RESTRICTION_NOT_FOUND | ERR_PROMOTION_NOT_FOUND | ERR_BATCH_NOT_FOUND | ERR_JOB_NOT_FOUND | ERR_RESERVATION_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with a path parameter"

  - priority: 5
    category: auth
    check: >-
      when X-User-Role is ChannelPartner, X-User-ID equals the channel_id the request acts on -
      the body's channel_id on POST /distribution/reservations and the reservation's channel_id on
      POST /distribution/reservations/{id}/cancel
    error_id: ERR_CHANNEL_OWNERSHIP_VIOLATION
    http_status: 403
    applies_to: "POST /distribution/reservations, POST /distribution/reservations/{id}/cancel"

  - priority: 6
    category: auth
    check: >-
      the caller may not override a system-owned decision: a Restriction whose origin is
      AUTO_OVERBOOK_GUARD is not liftable by any human role (only the system lifts it, when the guarded
      InventoryDay leaves OVERSOLD), and only RevenueManager and RevenueDirector may send
      override_overbooking true - a ChannelPartner never may
    error_id: ERR_OVERRIDE_NOT_PERMITTED
    http_status: 403
    applies_to: "POST /distribution/restrictions/{id}/lift, POST /distribution/reservations"

  - priority: 7
    category: existence
    check: >-
      the request body carries every required field, every field has the declared JSON type, every
      enum value is a declared member, every amount and count is a non-negative integer, every date is
      a calendar date and every instant is an ISO-8601 UTC instant, departure_date > arrival_date,
      end_date >= start_date, window_end_date >= window_start_date and
      ceiling_amount_cents >= floor_amount_cents
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all POST and PATCH endpoints, and every GET query parameter"

  - priority: 8
    category: existence
    check: >-
      every id referenced from the request BODY resolves: channel_id, rate_plan_id, room_type_id,
      parent_rate_plan_id, channel_mapping_id
    error_id: ERR_CHANNEL_NOT_FOUND | ERR_RATE_PLAN_NOT_FOUND | ERR_ROOM_TYPE_NOT_FOUND | ERR_CHANNEL_MAPPING_NOT_FOUND
    http_status: 404
    applies_to: "POST /distribution/channel-mappings, POST /distribution/restrictions, POST /distribution/room-types/{id}/allocations, POST /distribution/reservations, POST /distribution/properties/{id}/rate-plans"

  - priority: 9
    category: business_referential
    check: >-
      every entity named in the request belongs to the same Property: the channel, the room type, the
      rate plan and the reservation must share one property_id
    error_id: ERR_PROPERTY_SCOPE_MISMATCH
    http_status: 409
    applies_to: "POST /distribution/channel-mappings, POST /distribution/restrictions, POST /distribution/room-types/{id}/allocations, POST /distribution/reservations"

  - priority: 10
    category: state
    check: >-
      the submitted expected_<parent>_version equals the parent's current version - see §1.2.1
      (expected_room_type_version on allotment creation, expected_rate_plan_version on rate plan patch)
    error_id: ERR_STALE_ROOM_TYPE_VERSION | ERR_STALE_RATE_PLAN_VERSION
    http_status: 412
    applies_to: "POST /distribution/room-types/{id}/allocations, PATCH /distribution/rate-plans/{id}"

  - priority: 11
    category: state
    check: >-
      the target resource is in a state that admits this transition per §1.2 (rate plan, channel
      mapping, connection, promotion, allocation, restriction, batch, job, reservation)
    error_id: ERR_RATE_PLAN_STATE_INVALID | ERR_MAPPING_STATE_INVALID | ERR_CONNECTION_STATE_INVALID | ERR_PROMOTION_STATE_INVALID | ERR_ALLOCATION_STATE_INVALID | ERR_RESTRICTION_STATE_INVALID | ERR_BATCH_NOT_DISPATCHABLE | ERR_JOB_NOT_RETRYABLE | ERR_RESERVATION_NOT_CANCELLABLE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 12
    category: state
    check: >-
      the ChannelConnection that carries the operation is sellable - connection_state in
      {HEALTHY, DEGRADED}; PENDING, SUSPENDED and RETIRED are refused
    error_id: ERR_CONNECTION_NOT_SELLABLE
    http_status: 409
    applies_to: "POST /distribution/channel-mappings/{id}/verify, POST /distribution/reservations"

  - priority: 13
    category: business_safety
    check: >-
      the RevenueDirector approving or rejecting a promotion is not the user who submitted it -
      X-User-ID != Promotion.submitted_by_user_id
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /distribution/promotions/{id}/approve, POST /distribution/promotions/{id}/reject"

  - priority: 14
    category: business_safety
    check: >-
      every VERIFIED ChannelMapping of the promotion's rate plan has parity_state IN_PARITY before
      the promotion is loaded to the channels
    error_id: ERR_CONTENT_PARITY_BLOCKED
    http_status: 409
    applies_to: "POST /distribution/promotions/{id}/load"

  - priority: 15
    category: business_referential
    check: >-
      the prerequisites the operation distributes through exist: at least one VERIFIED ChannelMapping
      for the plan being loaded; a ChannelConnection for the channel being mapped or booked; an
      InventoryDay row for every date the operation touches
    error_id: ERR_CHANNEL_MAPPING_MISSING | ERR_CHANNEL_CONNECTION_MISSING | ERR_INVENTORY_DAY_NOT_OPEN
    http_status: 409
    applies_to: "POST /distribution/promotions/{id}/load, POST /distribution/channel-mappings, POST /distribution/reservations, POST /distribution/room-types/{id}/allocations"

  - priority: 16
    category: business_temporal
    check: >-
      requested dates lie inside the property's booking horizon:
      arrival_date > the logical clock's date and
      departure_date <= clock date + property.booking_horizon_days for a reservation;
      start_date and end_date within the same horizon for a restriction, an allotment or an
      inventory day; and a freeze window must start no earlier than the logical clock
    error_id: ERR_STAY_OUTSIDE_HORIZON | ERR_WINDOW_OUTSIDE_HORIZON
    http_status: 422
    applies_to: "POST /distribution/reservations, POST /distribution/restrictions, POST /distribution/room-types/{id}/allocations, POST /distribution/room-types/{id}/inventory-days, POST /distribution/channel-connections/{id}/freeze-windows"

  - priority: 17
    category: business_constraint
    check: >-
      uniqueness, depth and interval-overlap constraints:
      one ChannelMapping per (rate_plan_id, channel_id, room_type_id), one Channel per
      (property_id, channel_code), one RoomType per (property_id, room_type_code), one RatePlan per
      (property_id, plan_code), one InventoryDay per (room_type_id, stay_date), one active
      ChannelConnection per channel -> ERR_DUPLICATE_RESOURCE;
      derivation depth <= MAX_DERIVATION_DEPTH -> ERR_DERIVATION_DEPTH_EXCEEDED;
      no two ACTIVE Restrictions with the same (room_type_id, rate_plan_id, restriction_type, origin)
      may have overlapping closed date ranges -> ERR_RESTRICTION_WINDOW_OVERLAP;
      no two ConnectivityFreezeWindows on one connection may overlap once the 60-minute pre-buffer is
      applied -> ERR_FREEZE_WINDOW_OVERLAP
    error_id: ERR_DUPLICATE_RESOURCE | ERR_DERIVATION_DEPTH_EXCEEDED | ERR_RESTRICTION_WINDOW_OVERLAP | ERR_FREEZE_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /distribution/channel-mappings, POST /distribution/properties/{id}/channels, POST /distribution/properties/{id}/room-types, POST /distribution/properties/{id}/rate-plans, POST /distribution/room-types/{id}/inventory-days, POST /distribution/channels/{id}/connections, POST /distribution/restrictions, POST /distribution/channel-connections/{id}/freeze-windows"

  - priority: 18
    category: business_constraint
    check: >-
      the booked rate plan is eligible for this channel and guest: an OPAQUE plan requires
      channel.allows_opaque_rate; a MEMBER_RATE promotion requires member_flag true; a NEGOTIATED plan
      requires the request's negotiated_account_code to equal the plan's negotiated_account_code; a
      GEO_OFFER promotion requires geo_market_code to be one of its geo_markets
    error_id: ERR_OPAQUE_RATE_NOT_ALLOWED | ERR_MEMBER_RATE_NOT_ELIGIBLE | ERR_NEGOTIATED_ACCOUNT_MISMATCH | ERR_GEO_MARKET_NOT_SERVED
    http_status: 422
    applies_to: "POST /distribution/reservations, GET /distribution/channel-mappings/{id}/quoted-rate"

  - priority: 19
    category: business_constraint
    check: >-
      no ACTIVE Restriction blocks the stay, per calculations.restriction_effect_resolution, tested in
      the order STOP_SELL, then CLOSED_TO_ARRIVAL, then MIN_STAY
    error_id: ERR_STOP_SELL_ACTIVE | ERR_CLOSED_TO_ARRIVAL | ERR_MIN_STAY_NOT_MET
    http_status: 422
    applies_to: "POST /distribution/reservations"

  - priority: 20
    category: business_fiscal
    check: >-
      capacity is not breached on any touched date, per calculations.inventory_pool_state: a booking
      drawn from the shared pool needs shared_pool_units >= 1 on every night ->
      ERR_OVERBOOKING_CEILING_EXCEEDED; a pool booking whose unit lands in the overbooking band on any
      night needs override_overbooking true -> ERR_OVERBOOK_OVERRIDE_REQUIRED (the ceiling check is
      tested first, so a day already at the ceiling reports ERR_OVERBOOKING_CEILING_EXCEEDED rather
      than the override error); a new allotment must satisfy
      calculations.allocation_aggregate_capacity_check on every date of its closed range ->
      ERR_ALLOCATION_EXCEEDS_CEILING
    error_id: ERR_OVERBOOKING_CEILING_EXCEEDED | ERR_OVERBOOK_OVERRIDE_REQUIRED | ERR_ALLOCATION_EXCEEDS_CEILING
    http_status: 409
    applies_to: "POST /distribution/reservations, POST /distribution/room-types/{id}/allocations"

  - priority: 21
    category: business_temporal
    check: >-
      distribution is not frozen: no ConnectivityFreezeWindow of the target connection covers the
      logical clock once the FREEZE_PRE_BUFFER_MINUTES pre-buffer is applied
    error_id: ERR_CONNECTION_FROZEN
    http_status: 409
    applies_to: "POST /distribution/distribution-batches/{id}/dispatch, POST /distribution/promotions/{id}/load"

  - priority: 22
    category: business_constraint
    check: >-
      analytics windows are well formed: window_end_date >= window_start_date, the window is no longer
      than property.mix_window_days, and a pace request's target_stay_date is strictly after the
      logical clock's date
    error_id: ERR_ANALYTICS_WINDOW_INVALID
    http_status: 422
    applies_to: "GET /distribution/channels/{id}/performance, GET /distribution/properties/{id}/channel-mix, GET /distribution/room-types/{id}/pace"

  - priority: 23
    category: business_constraint
    check: "at least one channel is eligible for the mix ranking, per calculations.channel_mix_ranking"
    error_id: ERR_NO_ELIGIBLE_CHANNEL
    http_status: 409
    applies_to: "GET /distribution/properties/{id}/channel-mix"

# Deliberate priority pairs (§0.5 Rule 5) - each pair is a DIFFERENT category pair:
#   P12 state          vs P20 business_fiscal      -> ERR_CONNECTION_NOT_SELLABLE beats ERR_OVERBOOKING_CEILING_EXCEEDED
#   P16 business_temporal vs P17 business_constraint -> ERR_WINDOW_OUTSIDE_HORIZON beats ERR_RESTRICTION_WINDOW_OVERLAP
#   P19 business_constraint vs P20 business_fiscal  -> ERR_STOP_SELL_ACTIVE beats ERR_OVERBOOKING_CEILING_EXCEEDED
#   P13 business_safety vs P11 state (inverted)     -> ERR_PROMOTION_STATE_INVALID beats ERR_SEGREGATION_OF_DUTIES

# ---------------------------------------------------------------------------
# 1.5 API Endpoints (66 total: 35 mutations, 31 reads)
#     Every path parameter is spelled {id}; no path carries two parameters.
# ---------------------------------------------------------------------------
endpoints:
  # --- Property -----------------------------------------------------------
  - method: POST
    path: "/distribution/properties"
    description: "Register a hotel property with its distribution policy defaults"
    roles: [PlatformAdmin]
    code: 201
    input: [code, name, currency_code, "overbooking_pct_bp?", "booking_horizon_days?", "mix_window_days?", "rate_mismatch_tolerance_cents?", "required_image_count?"]
    output: Property
    side_effects: ["schema defaults applied when omitted: currency_code USD, overbooking_pct_bp 0, booking_horizon_days 365, mix_window_days 30, rate_mismatch_tolerance_cents 0, required_image_count 0", "the fixture world used by every worked example pins 1000 / 365 / 30 / 200 / 5 explicitly"]

  - method: GET
    path: "/distribution/properties"
    description: "List properties"
    roles: [PlatformAdmin, RevenueManager, RevenueDirector, ChannelOpsEngineer]
    code: 200
    input: ["limit?", "offset?"]
    output: Property[]
    side_effects: []

  - method: GET
    path: "/distribution/properties/{id}"
    description: "Read one property"
    roles: [PlatformAdmin, RevenueManager, RevenueDirector, ChannelOpsEngineer]
    code: 200
    input: []
    output: Property
    side_effects: []

  # --- RoomType -----------------------------------------------------------
  - method: POST
    path: "/distribution/properties/{id}/room-types"
    description: "Create a sellable room type with its physical capacity and master content"
    roles: [PlatformAdmin, RevenueManager]
    code: 201
    input: [code, name, physical_capacity_units, master_description_hash, master_image_count, "overbooking_pct_bp?"]
    output: RoomType
    side_effects: ["effective_overbooking_pct_bp resolved from the room type override or the property default", "version starts at 1"]

  - method: PATCH
    path: "/distribution/room-types/{id}"
    description: "Change a room type's capacity, overbooking allowance or master content"
    roles: [RevenueManager]
    code: 200
    input: ["name?", "physical_capacity_units?", "master_description_hash?", "master_image_count?", "overbooking_pct_bp?"]
    output: RoomType
    side_effects:
      - "increments RoomType.version by 1, which invalidates any outstanding expected_room_type_version echo (§1.2.1)"
      - "every InventoryDay of the room type re-mirrors physical_capacity_units and recomputes overbooking_ceiling_units, shared_pool_units and pooled_state per calculations.inventory_pool_state"
      - "every ChannelMapping of the room type recomputes parity_state per calculations.content_parity_evaluation when master_description_hash changes"

  - method: GET
    path: "/distribution/room-types"
    description: "List room types, optionally filtered to one property"
    roles: [PlatformAdmin, RevenueManager, RevenueDirector, ChannelOpsEngineer]
    code: 200
    input: ["property_id?", "limit?", "offset?"]
    output: RoomType[]
    side_effects: []

  - method: GET
    path: "/distribution/room-types/{id}"
    description: "Read one room type"
    roles: [PlatformAdmin, RevenueManager, RevenueDirector, ChannelOpsEngineer]
    code: 200
    input: []
    output: RoomType
    side_effects: []

  # --- InventoryDay -------------------------------------------------------
  - method: POST
    path: "/distribution/room-types/{id}/inventory-days"
    description: "Open one stay date for sale on a room type"
    roles: [RevenueManager]
    code: 201
    input: [stay_date]
    output: InventoryDay
    side_effects: ["physical_capacity_units mirrored from the room type, overbooking_ceiling_units, allocated_units, committed_units, shared_pool_units and pooled_state computed per calculations.inventory_pool_state"]

  - method: GET
    path: "/distribution/inventory-days"
    description: "List inventory days, optionally filtered by room type, date range or pooled state"
    roles: [PlatformAdmin, RevenueManager, RevenueDirector, ChannelOpsEngineer]
    code: 200
    input: ["room_type_id?", "stay_date_from?", "stay_date_to?", "pooled_state?", "limit?", "offset?"]
    output: InventoryDay[]
    side_effects: []

  - method: GET
    path: "/distribution/inventory-days/{id}"
    description: "Read one inventory day with its live pool arithmetic"
    roles: [PlatformAdmin, RevenueManager, RevenueDirector, ChannelOpsEngineer]
    code: 200
    input: []
    output: InventoryDay
    side_effects: []

  # --- Channel ------------------------------------------------------------
  - method: POST
    path: "/distribution/properties/{id}/channels"
    description: "Register a distribution channel with its commission and eligibility policy"
    roles: [PlatformAdmin]
    code: 201
    input: [code, channel_kind, commission_bp, "sell_adjustment_bp?", "allows_member_rate?", "allows_opaque_rate?", "geo_market_codes?", "requires_content_parity?"]
    output: Channel
    side_effects: ["ledger fields start at zero and mismatch_alert_count at 0", "schema defaults applied when omitted: sell_adjustment_bp 0, allows_member_rate false, allows_opaque_rate false, geo_market_codes [], requires_content_parity true"]

  - method: GET
    path: "/distribution/channels"
    description: "List channels, optionally filtered to one property or channel kind"
    roles: [PlatformAdmin, RevenueManager, RevenueDirector, ChannelOpsEngineer]
    code: 200
    input: ["property_id?", "channel_kind?", "limit?", "offset?"]
    output: Channel[]
    side_effects: []

  - method: GET
    path: "/distribution/channels/{id}"
    description: "Read one channel with its lifetime revenue ledger"
    roles: [PlatformAdmin, RevenueManager, RevenueDirector, ChannelOpsEngineer]
    code: 200
    input: []
    output: Channel
    side_effects: []

  - method: GET
    path: "/distribution/channels/{id}/performance"
    description: >-
      Windowed channel performance: gross, commission, net, room nights, net ADR, commission cost
      ratio and connectivity health score. basis selects the STAY or BOOKED variant of
      calculations.channel_net_adr and defaults to STAY.
    roles: [RevenueManager, RevenueDirector]
    code: 200
    input: [window_start_date, window_end_date, "basis?"]
    output: { channel_id: string, basis: string, window_start_date: string, window_end_date: string, gross_amount_cents: integer, commission_amount_cents: integer, net_amount_cents: integer, room_nights: integer, net_adr_cents: integer, commission_cost_ratio_bp: integer, health_score_bp: integer }
    side_effects: []

  # --- ChannelConnection --------------------------------------------------
  - method: POST
    path: "/distribution/channels/{id}/connections"
    description: "Open a connectivity session for a channel; starts in PENDING"
    roles: [ChannelOpsEngineer]
    code: 201
    input: [protocol, endpoint_url, "heartbeat_interval_minutes?"]
    output: ChannelConnection
    side_effects: ["connection_state PENDING, consecutive_failures 0", "schema default applied when omitted: heartbeat_interval_minutes 15", "a channel may hold only one connection that is not RETIRED, else ERR_DUPLICATE_RESOURCE"]

  - method: POST
    path: "/distribution/channel-connections/{id}/activate"
    description: "Bring a PENDING connection live (PENDING -> HEALTHY)"
    roles: [ChannelOpsEngineer]
    code: 200
    input: []
    output: ChannelConnection
    side_effects: ["consecutive_failures reset to 0, last_failure_code cleared", "increments version by 1"]

  - method: POST
    path: "/distribution/channel-connections/{id}/heartbeats"
    description: >-
      Record a partner heartbeat. status OK clears the failure streak; status ERROR increments it and
      may drive HEALTHY -> DEGRADED -> SUSPENDED per calculations.connection_health_scoring.
    roles: [ChannelOpsEngineer]
    code: 200
    input: [status, "failure_code?"]
    output: ChannelConnection
    side_effects:
      - "status OK sets consecutive_failures 0, last_failure_code null, last_heartbeat_at to the logical clock"
      - "status ERROR increments consecutive_failures and stores failure_code"
      - "reaching CONNECTION_FAILURE_SUSPEND_THRESHOLD suspends the connection, which recalls its allotments, recomputes the covered inventory days and may lift AUTO_OVERBOOK_GUARD restrictions"
      - "increments version by 1"

  - method: POST
    path: "/distribution/channel-connections/{id}/revalidate"
    description: "Bring a SUSPENDED connection back to DEGRADED on one probation failure"
    roles: [ChannelOpsEngineer]
    code: 200
    input: []
    output: ChannelConnection
    side_effects: ["consecutive_failures set to CONNECTION_FAILURE_SUSPEND_THRESHOLD - 1", "recalled allotments are NOT restored", "increments version by 1"]

  - method: POST
    path: "/distribution/channel-connections/{id}/retire"
    description: "Retire a connection permanently"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: ChannelConnection
    side_effects: ["every non-terminal ChannelMapping on the channel moves to DISABLED", "every OPEN or EXHAUSTED allotment on the channel moves to RECALLED and the covered inventory days are recomputed", "increments version by 1"]

  - method: POST
    path: "/distribution/channel-connections/{id}/freeze-windows"
    description: >-
      Declare a partner maintenance freeze. effective_starts_at is starts_at minus
      FREEZE_PRE_BUFFER_MINUTES, and the buffered windows of one connection may not overlap.
    roles: [ChannelOpsEngineer]
    code: 201
    input: [starts_at, ends_at, "reason?"]
    output: ConnectivityFreezeWindow
    side_effects: ["effective_starts_at computed as starts_at - 60 minutes", "no version field: ConnectivityFreezeWindow is immutable"]

  - method: GET
    path: "/distribution/channel-connections"
    description: "List connections, optionally filtered by channel or state"
    roles: [PlatformAdmin, RevenueManager, RevenueDirector, ChannelOpsEngineer]
    code: 200
    input: ["channel_id?", "connection_state?", "limit?", "offset?"]
    output: ChannelConnection[]
    side_effects: []

  - method: GET
    path: "/distribution/channel-connections/{id}"
    description: "Read one connection"
    roles: [PlatformAdmin, RevenueManager, RevenueDirector, ChannelOpsEngineer]
    code: 200
    input: []
    output: ChannelConnection
    side_effects: []

  - method: GET
    path: "/distribution/channel-connections/{id}/freeze-windows"
    description: "List the freeze windows declared on one connection"
    roles: [PlatformAdmin, RevenueManager, RevenueDirector, ChannelOpsEngineer]
    code: 200
    input: ["limit?", "offset?"]
    output: ConnectivityFreezeWindow[]
    side_effects: []

  # --- RatePlan -----------------------------------------------------------
  - method: POST
    path: "/distribution/properties/{id}/rate-plans"
    description: >-
      Create a rate plan. A root plan supplies base_amount_cents; a derived plan supplies
      parent_rate_plan_id with offset_kind PERCENT (offset_bp) or AMOUNT (offset_amount_cents).
    roles: [RevenueManager]
    code: 201
    input: [code, rate_class, floor_amount_cents, ceiling_amount_cents, "base_amount_cents?", "parent_rate_plan_id?", "offset_kind?", "offset_bp?", "offset_amount_cents?", "package_inclusion_cents?", "member_only?", "negotiated_account_code?"]
    output: RatePlan
    side_effects:
      - "derivation_depth and resolved_base_amount_cents computed per calculations.resolved_base_amount"
      - "plan_state DRAFT, version 1"
      - "depth beyond MAX_DERIVATION_DEPTH is refused with ERR_DERIVATION_DEPTH_EXCEEDED"

  - method: POST
    path: "/distribution/rate-plans/{id}/activate"
    description: "Activate a DRAFT rate plan so it can be mapped and sold"
    roles: [RevenueManager]
    code: 200
    input: []
    output: RatePlan
    side_effects: ["resolved_base_amount_cents re-derived", "requires an ACTIVE parent when the plan is derived", "increments version by 1"]

  - method: PATCH
    path: "/distribution/rate-plans/{id}"
    description: >-
      Reprice an ACTIVE rate plan under optimistic concurrency control (§1.2.1). Every accepted patch
      re-derives descendant plans and queues a RATE distribution batch.
    roles: [RevenueManager]
    code: 200
    input: [expected_rate_plan_version, "base_amount_cents?", "offset_bp?", "offset_amount_cents?", "floor_amount_cents?", "ceiling_amount_cents?", "package_inclusion_cents?"]
    output: RatePlan
    side_effects:
      - "a stale expected_rate_plan_version is refused with ERR_STALE_RATE_PLAN_VERSION (412) and nothing is written"
      - "resolved_base_amount_cents re-derived on this plan and on every descendant, parent before child"
      - "creates one QUEUED DistributionBatch (payload_kind RATE, source_ref_kind RATE_PLAN) that fans out one QUEUED RateDistributionJob per VERIFIED ChannelMapping of the plan or of a descendant plan, sequence_index assigned from ChannelMapping.created_at ASC"
      - "increments version by 1"

  - method: POST
    path: "/distribution/rate-plans/{id}/close"
    description: "Withdraw an ACTIVE rate plan from sale"
    roles: [RevenueManager]
    code: 200
    input: []
    output: RatePlan
    side_effects: ["every non-terminal ChannelMapping of the plan moves to DISABLED", "increments version by 1"]

  - method: GET
    path: "/distribution/rate-plans"
    description: "List rate plans, optionally filtered by property, parent plan, rate class or state"
    roles: [PlatformAdmin, RevenueManager, RevenueDirector, ChannelOpsEngineer]
    code: 200
    input: ["property_id?", "parent_rate_plan_id?", "rate_class?", "plan_state?", "limit?", "offset?"]
    output: RatePlan[]
    side_effects: []

  - method: GET
    path: "/distribution/rate-plans/{id}"
    description: "Read one rate plan with its resolved base amount"
    roles: [PlatformAdmin, RevenueManager, RevenueDirector, ChannelOpsEngineer]
    code: 200
    input: []
    output: RatePlan
    side_effects: []

  # --- ChannelMapping -----------------------------------------------------
  - method: POST
    path: "/distribution/channel-mappings"
    description: "Map a rate plan and room type onto a channel with the partner's external rate code"
    roles: [ChannelOpsEngineer]
    code: 201
    input: [rate_plan_id, channel_id, room_type_id, external_rate_code, "content_description_hash?", "content_image_count?"]
    output: ChannelMapping
    side_effects:
      - "mapping_state DRAFT, parity_state computed per calculations.content_parity_evaluation"
      - "requires an existing ChannelConnection on the channel, else ERR_CHANNEL_CONNECTION_MISSING"
      - "the plan, the channel and the room type must share one property, else ERR_PROPERTY_SCOPE_MISMATCH"
      - "one mapping per (rate_plan_id, channel_id, room_type_id), else ERR_DUPLICATE_RESOURCE"

  - method: POST
    path: "/distribution/channel-mappings/{id}/verify"
    description: "Verify a DRAFT or ERRORED mapping against the partner (DRAFT|ERRORED -> VERIFIED)"
    roles: [ChannelOpsEngineer]
    code: 200
    input: []
    output: ChannelMapping
    side_effects: ["requires the plan ACTIVE and the connection sellable", "parity_state recomputed", "increments version by 1"]

  - method: POST
    path: "/distribution/channel-mappings/{id}/disable"
    description: "Disable a mapping permanently"
    roles: [ChannelOpsEngineer]
    code: 200
    input: []
    output: ChannelMapping
    side_effects: ["every QUEUED or REJECTED job on the mapping moves to ABANDONED", "each parent batch recomputes its counters and batch_state per calculations.batch_state_rollup", "increments version by 1"]

  - method: PATCH
    path: "/distribution/channel-mappings/{id}/content"
    description: "Update the channel-side content fingerprint and image count for parity checking"
    roles: [ChannelOpsEngineer]
    code: 200
    input: ["content_description_hash?", "content_image_count?"]
    output: ChannelMapping
    side_effects: ["parity_state recomputed per calculations.content_parity_evaluation", "increments version by 1"]

  - method: POST
    path: "/distribution/channel-mappings/{id}/observed-rates"
    description: "Record the rate actually observed on the channel for a stay date and re-evaluate the mismatch alert"
    roles: [ChannelOpsEngineer]
    code: 200
    input: [observed_rate_cents, observed_stay_date]
    output: ChannelMapping
    side_effects: ["mismatch_delta_cents and mismatch_state recomputed per calculations.rate_mismatch_evaluation", "the channel's mismatch_alert_count is recounted", "increments version by 1"]

  - method: GET
    path: "/distribution/channel-mappings"
    description: "List mappings, optionally filtered by plan, channel, room type, state or mismatch state"
    roles: [PlatformAdmin, RevenueManager, RevenueDirector, ChannelOpsEngineer]
    code: 200
    input: ["rate_plan_id?", "channel_id?", "room_type_id?", "mapping_state?", "mismatch_state?", "limit?", "offset?"]
    output: ChannelMapping[]
    side_effects: []

  - method: GET
    path: "/distribution/channel-mappings/{id}"
    description: "Read one mapping with its parity and mismatch state"
    roles: [PlatformAdmin, RevenueManager, RevenueDirector, ChannelOpsEngineer]
    code: 200
    input: []
    output: ChannelMapping
    side_effects: []

  - method: GET
    path: "/distribution/channel-mappings/{id}/quoted-rate"
    description: >-
      Quote the sell rate a guest would see on this mapping for one stay date, per
      calculations.sell_rate_resolution, with the full step breakdown.
    roles: [RevenueManager, RevenueDirector, ChannelOpsEngineer]
    code: 200
    input: [stay_date, "member_flag?", "geo_market_code?", "negotiated_account_code?"]
    output: { channel_mapping_id: string, stay_date: string, base_amount_cents: integer, promotion_discount_cents: integer, discount_cap_cents: integer, channel_adjusted_cents: integer, clamped_cents: integer, sell_amount_cents: integer, applied_promotion_codes: array }
    side_effects: []

  # --- ChannelAllocation --------------------------------------------------
  - method: POST
    path: "/distribution/room-types/{id}/allocations"
    description: >-
      Carve an allotment of units for one channel over a closed date range, under optimistic
      concurrency control on the room type (§1.2.1).
    roles: [RevenueManager]
    code: 201
    input: [channel_id, allocated_units, start_date, end_date, expected_room_type_version]
    output: ChannelAllocation
    side_effects:
      - "a stale expected_room_type_version is refused with ERR_STALE_ROOM_TYPE_VERSION (412) and nothing is written"
      - "any OPEN or EXHAUSTED allotment with the same (channel_id, start_date, end_date) moves to SUPERSEDED first"
      - "calculations.allocation_aggregate_capacity_check runs on every date of the closed range"
      - "every covered InventoryDay recomputes allocated_units, shared_pool_units and pooled_state"
      - "increments RoomType.version by 1"

  - method: POST
    path: "/distribution/allocations/{id}/release"
    description: "Release an allotment's unconsumed units back into the shared pool"
    roles: [RevenueManager]
    code: 200
    input: []
    output: ChannelAllocation
    side_effects: ["every covered InventoryDay recomputes allocated_units, shared_pool_units and pooled_state", "increments version by 1"]

  - method: GET
    path: "/distribution/allocations"
    description: "List allotments, optionally filtered by room type, channel or state"
    roles: [PlatformAdmin, RevenueManager, RevenueDirector, ChannelOpsEngineer]
    code: 200
    input: ["room_type_id?", "channel_id?", "allocation_state?", "limit?", "offset?"]
    output: ChannelAllocation[]
    side_effects: []

  - method: GET
    path: "/distribution/allocations/{id}"
    description: "Read one allotment"
    roles: [PlatformAdmin, RevenueManager, RevenueDirector, ChannelOpsEngineer]
    code: 200
    input: []
    output: ChannelAllocation
    side_effects: []

  # --- Restriction --------------------------------------------------------
  - method: POST
    path: "/distribution/restrictions"
    description: >-
      Place a MIN_STAY, CLOSED_TO_ARRIVAL or STOP_SELL restriction over a closed date range, scoped to
      a room type and optionally to one rate plan. origin is always MANUAL on this endpoint.
    roles: [RevenueManager]
    code: 201
    input: [room_type_id, restriction_type, start_date, end_date, "rate_plan_id?", "value_nights?"]
    output: Restriction
    side_effects:
      - "origin MANUAL, restriction_state ACTIVE"
      - "value_nights is required for MIN_STAY and must be null for the other two types, else ERR_INVALID_REQUEST"
      - "no overlapping ACTIVE restriction with the same (room_type_id, rate_plan_id, restriction_type, origin), else ERR_RESTRICTION_WINDOW_OVERLAP"
      - "creates one QUEUED DistributionBatch (payload_kind RESTRICTION) that fans out one job per VERIFIED mapping of the room type"

  - method: POST
    path: "/distribution/restrictions/{id}/lift"
    description: "Lift a MANUAL restriction (ACTIVE -> LIFTED); AUTO_OVERBOOK_GUARD restrictions are system-owned"
    roles: [RevenueManager]
    code: 200
    input: []
    output: Restriction
    side_effects: ["lifted_at set to the logical clock and lift_reason MANUAL_LIFT", "creates one QUEUED RESTRICTION DistributionBatch and its child jobs", "increments version by 1"]

  - method: GET
    path: "/distribution/restrictions"
    description: "List restrictions, optionally filtered by room type, rate plan, type or state"
    roles: [PlatformAdmin, RevenueManager, RevenueDirector, ChannelOpsEngineer]
    code: 200
    input: ["room_type_id?", "rate_plan_id?", "restriction_type?", "restriction_state?", "limit?", "offset?"]
    output: Restriction[]
    side_effects: []

  - method: GET
    path: "/distribution/restrictions/{id}"
    description: "Read one restriction"
    roles: [PlatformAdmin, RevenueManager, RevenueDirector, ChannelOpsEngineer]
    code: 200
    input: []
    output: Restriction
    side_effects: []

  # --- Promotion ----------------------------------------------------------
  - method: POST
    path: "/distribution/rate-plans/{id}/promotions"
    description: >-
      Create a promotion on a rate plan. promo_kind is MEMBER_RATE, GEO_OFFER or PACKAGE_INCLUSION;
      discount_kind is PERCENT (discount_bp) or AMOUNT (discount_amount_cents).
    roles: [RevenueManager]
    code: 201
    input: [code, promo_kind, discount_kind, start_date, end_date, "discount_bp?", "discount_amount_cents?", "geo_market_codes?"]
    output: Promotion
    side_effects: ["approval_status DRAFT, distribution_status NOT_LOADED, revision_count 0", "one promotion per (rate_plan_id, code), else ERR_DUPLICATE_RESOURCE"]

  - method: POST
    path: "/distribution/promotions/{id}/submit"
    description: "Submit a DRAFT promotion for director approval; records the submitter for segregation of duties"
    roles: [RevenueManager, RevenueDirector]
    code: 200
    input: []
    output: Promotion
    side_effects: ["submitted_by_user_id set to X-User-ID", "a PERCENT discount above MAX_STACK_DISCOUNT_BP is refused with ERR_INVALID_REQUEST", "increments version by 1"]

  - method: POST
    path: "/distribution/promotions/{id}/approve"
    description: "Approve a SUBMITTED promotion; the approver may not be the submitter"
    roles: [RevenueDirector]
    code: 200
    input: []
    output: Promotion
    side_effects: ["approved_by_user_id set to X-User-ID", "the promotion becomes eligible for calculations.sell_rate_resolution immediately", "increments version by 1"]

  - method: POST
    path: "/distribution/promotions/{id}/reject"
    description: "Reject a SUBMITTED promotion; the rejecter may not be the submitter"
    roles: [RevenueDirector]
    code: 200
    input: ["reason?"]
    output: Promotion
    side_effects: ["reject_reason stored", "increments version by 1"]

  - method: POST
    path: "/distribution/promotions/{id}/revise"
    description: "Return a REJECTED promotion to DRAFT so it can be resubmitted, possibly by a different user"
    roles: [RevenueManager]
    code: 200
    input: []
    output: Promotion
    side_effects: ["submitted_by_user_id and reject_reason cleared, revision_count incremented by 1", "increments version by 1"]

  - method: POST
    path: "/distribution/promotions/{id}/load"
    description: >-
      Push the promotion to every VERIFIED mapping of its rate plan
      (NOT_LOADED|LOAD_FAILED -> LOADING). Independent of the approval axis.
    roles: [ChannelOpsEngineer]
    code: 200
    input: []
    output: Promotion
    side_effects:
      - "requires at least one VERIFIED mapping (ERR_CHANNEL_MAPPING_MISSING) and parity on every parity-requiring channel (ERR_CONTENT_PARITY_BLOCKED)"
      - "creates one QUEUED DistributionBatch (payload_kind PROMOTION, source_ref_kind PROMOTION) that fans out one QUEUED job per VERIFIED mapping"
      - "increments version by 1"

  - method: GET
    path: "/distribution/promotions"
    description: "List promotions, optionally filtered by rate plan or by either state axis"
    roles: [PlatformAdmin, RevenueManager, RevenueDirector, ChannelOpsEngineer]
    code: 200
    input: ["rate_plan_id?", "approval_status?", "distribution_status?", "limit?", "offset?"]
    output: Promotion[]
    side_effects: []

  - method: GET
    path: "/distribution/promotions/{id}"
    description: "Read one promotion with both state axes"
    roles: [PlatformAdmin, RevenueManager, RevenueDirector, ChannelOpsEngineer]
    code: 200
    input: []
    output: Promotion
    side_effects: []

  # --- DistributionBatch / RateDistributionJob ----------------------------
  - method: POST
    path: "/distribution/distribution-batches/{id}/dispatch"
    description: >-
      Dispatch every QUEUED child job in sequence_index order per
      calculations.job_dispatch_resolution, then re-derive the batch state.
    roles: [ChannelOpsEngineer]
    code: 200
    input: []
    output: DistributionBatch
    side_effects:
      - "dispatched_at set to the logical clock"
      - "each job lands APPLIED or REJECTED; APPLIED refreshes the mapping's last_pushed_rate_cents, last_push_at and mismatch_state"
      - "each rejection increments the channel connection's consecutive_failures and can suspend it, recalling its allotments and recomputing inventory"
      - "batch_state re-derived per calculations.batch_state_rollup; a PROMOTION batch drives the source promotion's distribution_status"
      - "refused with ERR_CONNECTION_FROZEN while a buffered freeze window covers the logical clock"
      - "increments version by 1"

  - method: POST
    path: "/distribution/distribution-jobs/{id}/retry"
    description: "Return a REJECTED job to QUEUED for another dispatch attempt, up to MAX_JOB_ATTEMPTS"
    roles: [ChannelOpsEngineer]
    code: 200
    input: []
    output: RateDistributionJob
    side_effects: ["applied_at and failure_reason cleared while attempt_count is preserved", "the parent batch recomputes its counters and batch_state", "a LOAD_FAILED promotion behind a PROMOTION batch is pulled back to LOADING", "increments version by 1"]

  - method: GET
    path: "/distribution/distribution-batches"
    description: "List distribution batches, optionally filtered by property, state or payload kind"
    roles: [PlatformAdmin, RevenueManager, RevenueDirector, ChannelOpsEngineer]
    code: 200
    input: ["property_id?", "batch_state?", "payload_kind?", "limit?", "offset?"]
    output: DistributionBatch[]
    side_effects: []

  - method: GET
    path: "/distribution/distribution-batches/{id}"
    description: "Read one batch with its child job counters"
    roles: [PlatformAdmin, RevenueManager, RevenueDirector, ChannelOpsEngineer]
    code: 200
    input: []
    output: DistributionBatch
    side_effects: []

  - method: GET
    path: "/distribution/distribution-jobs"
    description: "List distribution jobs, optionally filtered by batch, mapping or state"
    roles: [PlatformAdmin, RevenueManager, RevenueDirector, ChannelOpsEngineer]
    code: 200
    input: ["batch_id?", "channel_mapping_id?", "job_state?", "limit?", "offset?"]
    output: RateDistributionJob[]
    side_effects: []

  - method: GET
    path: "/distribution/distribution-jobs/{id}"
    description: "Read one distribution job"
    roles: [PlatformAdmin, RevenueManager, RevenueDirector, ChannelOpsEngineer]
    code: 200
    input: []
    output: RateDistributionJob
    side_effects: []

  # --- Reservation --------------------------------------------------------
  - method: POST
    path: "/distribution/reservations"
    description: >-
      Book a stay on a channel. Prices every night through calculations.sell_rate_resolution, then
      calculations.reservation_charge_breakdown and calculations.package_loyalty_credit, then consumes
      either the channel's allotment or the shared pool per calculations.inventory_pool_state.
    roles: [RevenueManager, ChannelPartner]
    code: 201
    input: [channel_id, rate_plan_id, room_type_id, arrival_date, nights, "member_flag?", "geo_market_code?", "negotiated_account_code?", "override_overbooking?"]
    output: Reservation
    side_effects:
      - "departure_date computed as arrival_date + nights; property_id derived from the channel"
      - "nightly_breakdown, gross_amount_cents, commission_amount_cents, net_amount_cents and loyalty_credit_cents computed"
      - "the channel's lifetime ledger and bookings_count are updated"
      - "every covered InventoryDay recomputes committed_units, allocated_units, shared_pool_units and pooled_state"
      - "an allotment draw increments the allotment's consumed_units and can move it OPEN -> EXHAUSTED"
      - "reaching OVERSOLD creates an AUTO_OVERBOOK_GUARD STOP_SELL Restriction per ACTIVE plan, each of which queues a RESTRICTION batch and its jobs"
      - "overbooking_overridden set true only when the override was actually consumed"
      - "a ChannelPartner may book only on its own channel and may never send override_overbooking true"

  - method: POST
    path: "/distribution/reservations/{id}/cancel"
    description: "Cancel a CONFIRMED reservation and reverse every side effect of the booking"
    roles: [RevenueManager, ChannelPartner]
    code: 200
    input: []
    output: Reservation
    side_effects:
      - "cancelled_at set to the logical clock"
      - "the channel's ledger money and room_nights_sold are reversed exactly; cancellations_count is incremented while bookings_count is unchanged"
      - "every covered InventoryDay recomputes committed_units, shared_pool_units and pooled_state"
      - "a consuming allotment decrements consumed_units and can move EXHAUSTED -> OPEN"
      - "an InventoryDay leaving OVERSOLD lifts its AUTO_OVERBOOK_GUARD restrictions with lift_reason AUTO_GUARD_CLEARED, each of which queues a RESTRICTION batch and its jobs"
      - "increments version by 1"

  - method: GET
    path: "/distribution/reservations"
    description: "List reservations, optionally filtered by property, channel, rate plan, room type or state"
    roles: [PlatformAdmin, RevenueManager, RevenueDirector, ChannelOpsEngineer, ChannelPartner]
    code: 200
    input: ["property_id?", "channel_id?", "rate_plan_id?", "room_type_id?", "reservation_state?", "limit?", "offset?"]
    output: Reservation[]
    side_effects: ["a ChannelPartner sees only the reservations of its own channel"]

  - method: GET
    path: "/distribution/reservations/{id}"
    description: "Read one reservation with its nightly breakdown"
    roles: [PlatformAdmin, RevenueManager, RevenueDirector, ChannelOpsEngineer, ChannelPartner]
    code: 200
    input: []
    output: Reservation
    side_effects: []

  # --- Analytics reads ----------------------------------------------------
  - method: GET
    path: "/distribution/room-types/{id}/pace"
    description: >-
      Booking pace for one future stay date. baseline selects the ROLLING or STLY variant of
      calculations.booking_pace_index and defaults to ROLLING.
    roles: [RevenueManager, RevenueDirector]
    code: 200
    input: [target_stay_date, "baseline?"]
    output: { room_type_id: string, target_stay_date: string, baseline: string, as_of_date: string, days_out: integer, target_room_nights: integer, baseline_room_nights: integer, pace_index_bp: integer, pace_state: string }
    side_effects: []

  - method: GET
    path: "/distribution/properties/{id}/channel-mix"
    description: >-
      Rank the property's sellable channels by stay-basis net ADR per calculations.channel_mix_ranking,
      for channel mix decisions.
    roles: [RevenueManager, RevenueDirector]
    code: 200
    input: [window_start_date, window_end_date]
    output: { property_id: string, window_start_date: string, window_end_date: string, ranked_channels: array }
    side_effects: []

  # --- Test-driving endpoint ---------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: >-
      Set the server's logical clock. Every date and instant in this API is read from this clock, which
      starts at exactly 2026-08-01T00:00:00Z on a fresh server and never falls back to wall-clock time.
    roles: [PlatformAdmin]
    code: 200
    input: [current_utc]
    output: { current_utc: string }
    side_effects: ["no stored entity changes; subsequent created_at, lifted_at, cancelled_at, dispatched_at and applied_at values and every horizon, window and pace computation read the new instant"]

# ---------------------------------------------------------------------------
# 1.6 Error Code Catalog (55 codes, every one triggerable from §1.5)
# ---------------------------------------------------------------------------
errors:
  # --- authentication / authorization ---
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID missing or empty, or X-User-Role is not a declared role"
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "the caller's role is not listed in the endpoint's roles"
  - id: ERR_CHANNEL_OWNERSHIP_VIOLATION
    http: 403
    condition: "a ChannelPartner acts on a reservation or books on a channel whose id is not its X-User-ID"
  - id: ERR_OVERRIDE_NOT_PERMITTED
    http: 403
    condition: "a human role tries to lift an AUTO_OVERBOOK_GUARD restriction, or a ChannelPartner sends override_overbooking true"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the RevenueDirector approving or rejecting a promotion is the user recorded in submitted_by_user_id"

  # --- request shape ---
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: >-
      missing required field, wrong JSON type, undeclared enum member, negative amount or count,
      malformed date or instant, departure before arrival, end_date before start_date,
      ceiling_amount_cents below floor_amount_cents, value_nights present on a non-MIN_STAY restriction
      or absent on a MIN_STAY one, or a PERCENT promotion discount above MAX_STACK_DISCOUNT_BP

  # --- not found ---
  - id: ERR_PROPERTY_NOT_FOUND
    http: 404
    condition: "the property id in the path does not resolve"
  - id: ERR_ROOM_TYPE_NOT_FOUND
    http: 404
    condition: "the room type id in the path or body does not resolve"
  - id: ERR_INVENTORY_DAY_NOT_FOUND
    http: 404
    condition: "the inventory day id in the path does not resolve"
  - id: ERR_CHANNEL_NOT_FOUND
    http: 404
    condition: "the channel id in the path or body does not resolve"
  - id: ERR_CONNECTION_NOT_FOUND
    http: 404
    condition: "the channel connection id in the path does not resolve"
  - id: ERR_RATE_PLAN_NOT_FOUND
    http: 404
    condition: "the rate plan id in the path or body, including parent_rate_plan_id, does not resolve"
  - id: ERR_CHANNEL_MAPPING_NOT_FOUND
    http: 404
    condition: "the channel mapping id in the path or body does not resolve"
  - id: ERR_ALLOCATION_NOT_FOUND
    http: 404
    condition: "the allotment id in the path does not resolve"
  - id: ERR_RESTRICTION_NOT_FOUND
    http: 404
    condition: "the restriction id in the path does not resolve"
  - id: ERR_PROMOTION_NOT_FOUND
    http: 404
    condition: "the promotion id in the path does not resolve"
  - id: ERR_BATCH_NOT_FOUND
    http: 404
    condition: "the distribution batch id in the path does not resolve"
  - id: ERR_JOB_NOT_FOUND
    http: 404
    condition: "the distribution job id in the path does not resolve"
  - id: ERR_RESERVATION_NOT_FOUND
    http: 404
    condition: "the reservation id in the path does not resolve"

  # --- optimistic concurrency (§1.2.1) ---
  - id: ERR_STALE_ROOM_TYPE_VERSION
    http: 412
    condition: "expected_room_type_version does not equal the room type's current version on allotment creation"
  - id: ERR_STALE_RATE_PLAN_VERSION
    http: 412
    condition: "expected_rate_plan_version does not equal the rate plan's current version on a repricing patch"

  # --- state preconditions ---
  - id: ERR_RATE_PLAN_STATE_INVALID
    http: 409
    condition: "the rate plan is not in a state that admits the transition, or a derived plan's parent is not ACTIVE on activation, or a mapping's plan is not ACTIVE on verification"
  - id: ERR_MAPPING_STATE_INVALID
    http: 409
    condition: "the channel mapping is not in a state that admits the transition, including any transition out of DISABLED"
  - id: ERR_CONNECTION_STATE_INVALID
    http: 409
    condition: "the connection is not in a state that admits activate, revalidate or retire"
  - id: ERR_PROMOTION_STATE_INVALID
    http: 409
    condition: "the promotion's approval_status or distribution_status does not admit the requested transition"
  - id: ERR_ALLOCATION_STATE_INVALID
    http: 409
    condition: "the allotment is already RELEASED, RECALLED or SUPERSEDED"
  - id: ERR_RESTRICTION_STATE_INVALID
    http: 409
    condition: "the restriction is already LIFTED"
  - id: ERR_BATCH_NOT_DISPATCHABLE
    http: 409
    condition: "the batch is DISPATCHING or APPLIED, has no child jobs, or has no QUEUED child job left to dispatch"
  - id: ERR_JOB_NOT_RETRYABLE
    http: 409
    condition: "the job is not REJECTED, or attempt_count has already reached MAX_JOB_ATTEMPTS"
  - id: ERR_RESERVATION_NOT_CANCELLABLE
    http: 409
    condition: "the reservation is already CANCELLED"
  - id: ERR_CONNECTION_NOT_SELLABLE
    http: 409
    condition: "the channel's connection is PENDING, SUSPENDED or RETIRED when verifying a mapping or booking a stay"

  # --- business safety / referential / scope ---
  - id: ERR_CONTENT_PARITY_BLOCKED
    http: 409
    condition: "a promotion load is attempted while a VERIFIED mapping on a parity-requiring channel is OUT_OF_PARITY"
  - id: ERR_CHANNEL_MAPPING_MISSING
    http: 409
    condition: "a promotion load finds no VERIFIED mapping for its rate plan"
  - id: ERR_CHANNEL_CONNECTION_MISSING
    http: 409
    condition: "a mapping is created for a channel that has no ChannelConnection"
  - id: ERR_INVENTORY_DAY_NOT_OPEN
    http: 409
    condition: "a date touched by a booking or an allotment has no InventoryDay row"
  - id: ERR_PROPERTY_SCOPE_MISMATCH
    http: 409
    condition: "the channel, room type and rate plan named in one request do not share a single property_id"

  # --- temporal windows ---
  - id: ERR_STAY_OUTSIDE_HORIZON
    http: 422
    condition: "arrival_date is not strictly after the logical clock's date, or departure_date is beyond the clock date plus booking_horizon_days"
  - id: ERR_WINDOW_OUTSIDE_HORIZON
    http: 422
    condition: "a restriction, allotment, inventory day or freeze window falls outside the property's booking horizon, or a freeze window starts before the logical clock"
  - id: ERR_CONNECTION_FROZEN
    http: 409
    condition: "a dispatch or promotion load is attempted while a freeze window, including its 60-minute pre-buffer, covers the logical clock"

  # --- constraints, uniqueness, overlap ---
  - id: ERR_DUPLICATE_RESOURCE
    http: 409
    condition: >-
      a uniqueness key is already taken: (property_id, code) for a room type, channel or rate plan,
      (rate_plan_id, code) for a promotion, (room_type_id, stay_date) for an inventory day,
      (rate_plan_id, channel_id, room_type_id) for a mapping, or a second non-RETIRED connection on one channel
  - id: ERR_DERIVATION_DEPTH_EXCEEDED
    http: 409
    condition: "a rate plan's derivation_depth would exceed MAX_DERIVATION_DEPTH"
  - id: ERR_RESTRICTION_WINDOW_OVERLAP
    http: 409
    condition: "a new restriction's closed date range overlaps an ACTIVE restriction with the same (room_type_id, rate_plan_id, restriction_type, origin)"
  - id: ERR_FREEZE_WINDOW_OVERLAP
    http: 409
    condition: "a new freeze window's buffered half-open interval overlaps an existing buffered window on the same connection"

  # --- rate eligibility ---
  - id: ERR_OPAQUE_RATE_NOT_ALLOWED
    http: 422
    condition: "an OPAQUE rate plan is quoted or booked on a channel whose allows_opaque_rate is false"
  - id: ERR_MEMBER_RATE_NOT_ELIGIBLE
    http: 422
    condition: "a member_only rate plan is quoted or booked without member_flag true, or on a channel whose allows_member_rate is false"
  - id: ERR_NEGOTIATED_ACCOUNT_MISMATCH
    http: 422
    condition: "a NEGOTIATED rate plan is quoted or booked with a negotiated_account_code that does not equal the plan's"
  - id: ERR_GEO_MARKET_NOT_SERVED
    http: 422
    condition: "the request's geo_market_code is absent from a channel whose geo_market_codes list is non-empty"

  # --- sell restrictions ---
  - id: ERR_STOP_SELL_ACTIVE
    http: 422
    condition: "an ACTIVE STOP_SELL restriction covers any night of the requested stay"
  - id: ERR_CLOSED_TO_ARRIVAL
    http: 422
    condition: "an ACTIVE CLOSED_TO_ARRIVAL restriction covers the arrival date"
  - id: ERR_MIN_STAY_NOT_MET
    http: 422
    condition: "nights is below the strictest ACTIVE MIN_STAY restriction covering the arrival date"

  # --- capacity ---
  - id: ERR_OVERBOOKING_CEILING_EXCEEDED
    http: 409
    condition: "a pool booking would drive shared_pool_units below zero on any night"
  - id: ERR_OVERBOOK_OVERRIDE_REQUIRED
    http: 409
    condition: "a pool booking's unit lands in the overbooking band on some night and override_overbooking was not sent true"
  - id: ERR_ALLOCATION_EXCEEDS_CEILING
    http: 409
    condition: "a new allotment's units, added to the units already held and committed, would exceed the overbooking ceiling on some date of its range"

  # --- analytics ---
  - id: ERR_ANALYTICS_WINDOW_INVALID
    http: 422
    condition: "window_end_date precedes window_start_date, the window is longer than mix_window_days, or a pace target_stay_date is not strictly after the logical clock's date"
  - id: ERR_NO_ELIGIBLE_CHANNEL
    http: 409
    condition: "no channel of the property has both a sellable connection and at least MIN_MIX_ROOM_NIGHTS room nights in the requested window"

# ---------------------------------------------------------------------------
# 1.7 RBAC Matrix (role_model: segregation_of_duties)
# ---------------------------------------------------------------------------
roles:
  - name: PlatformAdmin
    description: "Platform operator: onboards properties and channels and retires connectivity"
    identity: opaque
    exclusive_operations:
      - "POST /distribution/properties"
      - "POST /distribution/properties/{id}/channels"
      - "POST /distribution/channel-connections/{id}/retire"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /distribution/properties/{id}/room-types (with RevenueManager)"
      - "every GET over properties, room types, inventory days, channels, connections, rate plans, mappings, allotments, restrictions, promotions, batches, jobs and reservations"

  - name: RevenueManager
    description: "Owns pricing, inventory allotments, restrictions and promotion authoring"
    identity: opaque
    exclusive_operations:
      - "PATCH /distribution/room-types/{id}"
      - "POST /distribution/room-types/{id}/inventory-days"
      - "POST /distribution/room-types/{id}/allocations"
      - "POST /distribution/allocations/{id}/release"
      - "POST /distribution/properties/{id}/rate-plans"
      - "POST /distribution/rate-plans/{id}/activate"
      - "PATCH /distribution/rate-plans/{id}"
      - "POST /distribution/rate-plans/{id}/close"
      - "POST /distribution/restrictions"
      - "POST /distribution/restrictions/{id}/lift"
      - "POST /distribution/rate-plans/{id}/promotions"
      - "POST /distribution/promotions/{id}/revise"
    shared_operations:
      - "POST /distribution/promotions/{id}/submit (with RevenueDirector)"
      - "POST /distribution/reservations (with ChannelPartner)"
      - "POST /distribution/reservations/{id}/cancel (with ChannelPartner)"
      - "GET /distribution/channels/{id}/performance, GET /distribution/room-types/{id}/pace, GET /distribution/properties/{id}/channel-mix, GET /distribution/channel-mappings/{id}/quoted-rate (with RevenueDirector)"
      - "POST /distribution/properties/{id}/room-types (with PlatformAdmin)"

  - name: RevenueDirector
    description: "Approves or rejects promotions and reads the analytics that drive channel mix decisions"
    identity: opaque
    exclusive_operations:
      - "POST /distribution/promotions/{id}/approve"
      - "POST /distribution/promotions/{id}/reject"
    shared_operations:
      - "POST /distribution/promotions/{id}/submit (with RevenueManager)"
      - "GET /distribution/channels/{id}/performance, GET /distribution/room-types/{id}/pace, GET /distribution/properties/{id}/channel-mix, GET /distribution/channel-mappings/{id}/quoted-rate (with RevenueManager)"
    segregation_of_duties: >-
      A director may submit a promotion, but the server records X-User-ID in submitted_by_user_id and
      then refuses that same user's approve or reject with ERR_SEGREGATION_OF_DUTIES (403). Two distinct
      RevenueDirector user ids are therefore required to move a self-submitted promotion to APPROVED.
      POST /distribution/promotions/{id}/revise clears submitted_by_user_id, so after a revision the
      original submitter may approve.

  - name: ChannelOpsEngineer
    description: "Owns connectivity, mappings, content parity and rate distribution"
    identity: opaque
    exclusive_operations:
      - "POST /distribution/channels/{id}/connections"
      - "POST /distribution/channel-connections/{id}/activate"
      - "POST /distribution/channel-connections/{id}/heartbeats"
      - "POST /distribution/channel-connections/{id}/revalidate"
      - "POST /distribution/channel-connections/{id}/freeze-windows"
      - "POST /distribution/channel-mappings"
      - "POST /distribution/channel-mappings/{id}/verify"
      - "POST /distribution/channel-mappings/{id}/disable"
      - "PATCH /distribution/channel-mappings/{id}/content"
      - "POST /distribution/channel-mappings/{id}/observed-rates"
      - "POST /distribution/promotions/{id}/load"
      - "POST /distribution/distribution-batches/{id}/dispatch"
      - "POST /distribution/distribution-jobs/{id}/retry"
    shared_operations:
      - "GET /distribution/channel-mappings/{id}/quoted-rate (with RevenueManager and RevenueDirector)"
      - "every GET over the operational entities"

  - name: ChannelPartner
    description: "An external distribution channel acting on its own bookings"
    identity: "entity_backed:Channel"
    exclusive_operations: []
    shared_operations:
      - "POST /distribution/reservations (with RevenueManager; only for channel_id == X-User-ID, and never with override_overbooking true)"
      - "POST /distribution/reservations/{id}/cancel (with RevenueManager; only for its own reservations)"
      - "GET /distribution/reservations and GET /distribution/reservations/{id} (scoped to its own channel)"
    note: >-
      X-User-ID for this role is the id of a Channel row. A partner cannot read the pricing surface, the
      inventory surface or the analytics reads at all, and cannot see another channel's reservations.
