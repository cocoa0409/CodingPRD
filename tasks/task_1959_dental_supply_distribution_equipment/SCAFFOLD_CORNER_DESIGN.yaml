            - { call: "POST /api/rebate-claims/${cl}/settle", payload: {}, as: PracticeManager, as_user_id: "${p}", captures: { err: $.data.error_id } }
            - { call: "GET /api/rebate-claims/${cl}", payload: {}, as: DistributionAdmin, captures: { st: $.data.status } }
          assert:
            - "HTTP 403 with error_id == ERR_FORBIDDEN; claim remains SUBMITTED"

  - section: cross_cutting_complexity_layers
    instances:
      - name: usage_profile_upsert_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[usage-profile-upsert-stale-practice]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC on Practice.version: a second upsert carrying the pre-first-write version is rejected 412 ERR_STALE_VERSION; the fresh write bumped Practice.version from the captured value."
        test_recipe:
          setup: ["Practice P (version captured as pv); product C; first upsert succeeded (Practice.version advanced beyond pv)"]
          setup_api_calls:
            - { call: "POST /api/practices", payload: { name: "P Occ", region: "R1", credit_limit_cents: 1000000 }, as: DistributionAdmin, captures: { p: $.data.id, pv: $.data.version } }
            - { call: "POST /api/products", payload: { sku: "C-24", name: "Gauze", kind: "CONSUMABLE", unit_price_cents: 1000, manufacturer: "M" }, as: DistributionAdmin, captures: { c: $.data.id } }
            - { call: "PUT /api/usage-profiles", payload: { practice_id: "${p}", product_id: "${c}", reorder_point: 20, target_stock_level: 100, auto_replenish_enabled: true, expected_practice_version: "${pv}" }, as: PracticeManager, as_user_id: "${p}", captures: { prof: $.data.id } }
          trigger:
            - { call: "PUT /api/usage-profiles", payload: { practice_id: "${p}", product_id: "${c}", reorder_point: 25, target_stock_level: 110, auto_replenish_enabled: true, expected_practice_version: "${pv}" }, as: PracticeManager, as_user_id: "${p}", captures: { err: $.data.error_id } }
            - { call: "GET /api/usage-profiles/${prof}", payload: {}, as: DistributionAdmin, captures: { rp: $.data.reorder_point } }
          assert:
            - "HTTP 412 with error_id == ERR_STALE_VERSION (expected_practice_version == ${pv} is stale after the first upsert bumped Practice.version)"
            - "Profile retains reorder_point == 20 from the winning write (loser's 25 not applied)"

      - name: dispatch_selector_tie_break_by_created_at
        claim_type: selector_policy
        grounds: [calculations.dispatch_technician_selection]
        distinguishing_aspect: "Selector determinism: two equally-eligible free technicians tie on scheduled-minutes (0); the earlier-created (T1) wins the first dispatch; with T1 occupied the same window selects T2 — proving eligibility exclusion plus created_at tie-break without any id-based choice."
        test_recipe:
          setup: ["Practice P region R1; accepted-sale fixture; technicians T1 and T2 (both REPAIR, R1), T1 created first; ticket K1 assessed"]
          setup_api_calls:
            - { call: "POST /api/practices", payload: { name: "P Sel", region: "R1", credit_limit_cents: 10000000 }, as: DistributionAdmin, captures: { p: $.data.id } }
            - { call: "POST /api/products", payload: { sku: "EQ-24", name: "Chair", kind: "EQUIPMENT", unit_price_cents: 500000, manufacturer: "M", warranty_months: 12 }, as: DistributionAdmin, captures: { eq: $.data.id } }
            - { call: "POST /api/technicians", payload: { name: "T1", region: "R1", certifications: ["INSTALL", "REPAIR"] }, as: DistributionAdmin, captures: { t1: $.data.id } }
            - { call: "POST /api/technicians", payload: { name: "T2", region: "R1", certifications: ["INSTALL", "REPAIR"] }, as: DistributionAdmin, captures: { t2: $.data.id } }
            - { call: "POST /api/equipment-sales", payload: { practice_id: "${p}", product_id: "${eq}", sale_price_cents: 900000 }, as: SalesRep, captures: { s: $.data.id } }
            - { call: "POST /api/equipment-sales/${s}/confirm", payload: {}, as: SalesRep }
            - { call: "POST /api/equipment-sales/${s}/schedule-install", payload: { technician_id: "${t1}", window_start: "2026-08-02T09:00:00Z", window_end: "2026-08-02T12:00:00Z" }, as: SalesRep }
            - { call: "POST /api/equipment-sales/${s}/complete-install", payload: {}, as: FieldTechnician, as_user_id: "${t1}" }
            - { call: "POST /api/equipment-sales/${s}/complete-training", payload: { training_minutes: 30 }, as: FieldTechnician, as_user_id: "${t1}" }
            - { call: "POST /api/equipment-sales/${s}/accept", payload: {}, as: PracticeManager, as_user_id: "${p}" }
            - { call: "POST /api/service-tickets", payload: { practice_id: "${p}", equipment_sale_id: "${s}", issue_description: "k1" }, as: ServiceDispatcher, captures: { k1: $.data.id } }
            - { call: "POST /api/service-tickets/${k1}/assess-coverage", payload: {}, as: ServiceDispatcher }
            - { call: "POST /api/service-tickets", payload: { practice_id: "${p}", equipment_sale_id: "${s}", issue_description: "k2" }, as: ServiceDispatcher, captures: { k2: $.data.id } }
            - { call: "POST /api/service-tickets/${k2}/assess-coverage", payload: {}, as: ServiceDispatcher }
          trigger:
            - { call: "POST /api/service-tickets/${k1}/dispatch", payload: { scheduled_start: "2026-08-05T09:00:00Z", scheduled_end: "2026-08-05T10:00:00Z" }, as: ServiceDispatcher, captures: { j1: $.data.technician_id } }
            - { call: "POST /api/service-tickets/${k2}/dispatch", payload: { scheduled_start: "2026-08-05T09:00:00Z", scheduled_end: "2026-08-05T10:00:00Z" }, as: ServiceDispatcher, captures: { j2: $.data.technician_id } }
          assert:
            - "First dispatch selects ${t1} (tie on 0 scheduled minutes broken by created_at ASC)"
            - "Second dispatch for the identical window selects ${t2} (T1 excluded by overlap)"

      - name: deliver_cascade_layer_covered
        claim_type: cascading_side_effects
        grounds: [state_machines.Order.SUBMITTED_to_DELIVERED]
        excluded_because:
          difficulty_instance: deliver_triggers_usage_update_triggers_auto_order
          rationale: "The 3-level deliver -> usage-profile -> AUTO-order cascade is asserted end-to-end in the named difficulty instance."

      - name: dual_variant_layer_covered
        claim_type: dual_variant_calculation
        grounds: [calculations.repair_cost, calculations.trade_in_valuation]
        excluded_because:
          difficulty_instance: repair_cost_warranty_vs_service_plan_divergence
          rationale: "Both dual-variant calculations are exercised with literal divergent outputs in the named difficulty instances."

  - section: consistency_model
    instances:
      - name: immediate_consistency_on_order_create
        claim_type: immediate_consistency
        grounds: [complexity_profile]
        distinguishing_aspect: "Immediate consistency: the POST /api/orders response already carries the final computed totals, and a subsequent GET returns identical values (no asynchronous lag)."
