              payload: { amount_cents: 50000 }
              as: Teller
              as_user_id: "${t_id}"
              captures: { err: $.data.error_id }
            - call: "POST /api/drawers/${d_id}/sell-to-vault"
              payload: { amount_cents: 50001 }
              as: Teller
              as_user_id: "${t_id}"
              captures: { bal: $.data.cash_balance_cents }
          assert:
