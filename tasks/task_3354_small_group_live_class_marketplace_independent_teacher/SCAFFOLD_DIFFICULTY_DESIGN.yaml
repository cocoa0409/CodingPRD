          - state_machines.TeacherPayout.REQUESTED_to_SENT
        distinguishing_aspect: |
          The second payout's gross is 2000 under the accrual selector (the HELD section in its
          own period) but would be 1500 under the posted selector (the net already disbursed on
          the first payout), so asserting gross_earnings_cents == 2000 discriminates the applied
          accrual variant from the rejected posted variant.
