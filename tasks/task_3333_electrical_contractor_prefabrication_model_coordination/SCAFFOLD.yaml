scenario: "Electrical Contractor Prefabrication & Model Coordination (Rosendin Electric): project takeoff from a coordinated building model with quantity extraction and assembly definitions, prefabrication shop production of racks, assemblies and modular components with jobsite delivery sequencing, field labor planning against prefabricated content with productivity assumptions and crew composition, coordination with other trades through clash detection and installation sequence agreements, material procurement with switchgear and cable lead times driving early release decisions, jobsite logistics including laydown, hoisting windows and just-in-time delivery, labor agreement compliance with jurisdiction rules and apprentice ratios, change management for design revisions affecting fabricated assemblies"
domain_name: electrical-prefab-model-coordination
api_prefix: /prefab
complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - derived_field_reconciliation
  entity_topology: graph
  state_machine_shape: parallel
  relationship_patterns:
    - one_to_many
    - self_referential
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate
  difficulty_target: "beyond expert — 15 entities, 40 endpoints, parallel state dimensions on PrefabOrder, two cyclic revision loops, four OCC guards, five-tier posture ladder, 9/9 difficulty rules"

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: Project
    parent: null
    common_fields: true
    fields:
      - name: project_code
        type: string
        source: input
        description: contractor job number; unique across all projects
      - name: project_name
        type: string
        source: input
        description: jobsite name
      - name: jurisdiction_key
        type: string
        source: input
        description: jurisdiction whose labor agreement governs this jobsite; joins TradeContractRate.jurisdiction_key
      - name: power_on_iso
        type: datetime
        source: input
        description: energization date; the literal anchor for every lead-time and hoisting derivation
      - name: laydown_slots
        type: integer
        source: input
        description: number of laydown yard slots; each non-terminal PrefabOrder holds one slot
      - name: credit_policy
        type: enum
        source: input
        description: crew-day credit policy selecting the field_credit_policy variant
        default: FIRST_ACCEPTED
        constraints: "enum members: FIRST_ACCEPTED, HIGHEST_TOTAL"
      - name: posture_thresholds
        type: object
        source: input
        description: "five-tier posture thresholds keyed by slippage_pct: SLIP_RELEASE_AT, SLIP_RECOVERY_AT, SLIP_HOLD_AT, SLIP_FREEZE_AT (evaluated descending)"
      - name: cumulative_narrative_count
        type: integer
        source: input
        description: running count of narrative counts of record; excludes insignificant documents
        default: 0
      - name: insignificant_narrative_count
        type: integer
        source: input
        description: documents of record that are insignificant and therefore excluded from cumulative_narrative_count
        default: 0
      - name: safety_program_required
        type: boolean
        source: input
        description: true when the jobsite operates a written safety program; gates safety certification rules
      - name: material_gate_commodities
        type: array
        source: input
        description: commodities whose procurement releases gate this project's shop releases; an order whose gate commodity is not yet declared cannot be released
      - name: shop_utilization_pct
        type: number
        source: input
        description: shop load as a fraction of capacity; drives the SHOP_CAPACITY_LADDER
      - name: released_quantity
        type: number
        source: input
        description: cumulative engineered quantity released to procurement
        default: 0
      - name: total_quantity
        type: number
        source: input
        description: total engineered quantity for the project
      - name: float_band_low_pct
        type: number
        source: input
        description: low edge of the schedule float band; below this the recovery multiplier is preferred
      - name: achieved_flow_margin_pct
        type: number
        source: input
        description: achieved flow margin credited against the float band low edge
      - name: project_posture
        type: enum
        source: computed
        description: derived aggregate; five-tier posture per project_posture_derivation
        constraints: "enum members: ON_TRACK, RELEASE_PENDING, RECOVERY_MODE, HOLD, FROZEN"
      - name: slippage_pct
        type: number
        source: computed
        description: abs(critical_path_shortfall_days) / critical_path_span_days, 4 decimals, round_half_up
      - name: installed_pct
        type: number
        source: computed
        description: installed_value_cents / (pipeline_value_cents + completed_value_cents); 0.0 when the denominator is 0
      - name: pipeline_value_cents
        type: number
        source: computed
        description: project_pipeline_balance output for components not yet SET
      - name: completed_value_cents
        type: number
        source: computed
        description: project_pipeline_balance output for components whose install_status is SET
      - name: man_hours_total
        type: number
        source: computed
        description: sum of crafted_hours over every PrefabComponent of the project
      - name: apprentice_ratio_max
        type: number
        source: computed
        description: project-wide apprentice ratio cap; the smaller of the jurisdiction cap and the next front band default
      - name: effective_flow_pct
        type: number
        source: computed
        description: installed work volume divided by total work volume, rounded to a whole percent before division
      - name: approved_change_value_cents
        type: number
        source: computed
        description: sum of revision_cost_impact variant (b) over APPROVED Revisions of this project
      - name: apprentice_breach_flag
        type: boolean
        source: computed
        description: true when project-wide excess_apprentice_hours is greater than 0
      - name: external_gate_open
        type: boolean
        source: computed
        description: true when no dependency band gate result is BLOCKED
      - name: fabrication_locked
        type: boolean
        source: computed
        description: true when any dependency band gate result is LOCKED
      - name: fabricated_revision_active
        type: boolean
        source: computed
        description: true while the project has a Revision that affects fabricated content and has not reached the terminal members of APPROVED, REJECTED or SUPERSEDED
      - name: craft_hours_credit
        type: number
        source: computed
        description: pro-rated release credit; decreases as released_quantity rises, floored at 0
      - name: craft_hours_balance
        type: number
        source: computed
        description: conserved craft-and-material balance per craft_hours_balance; unchanged by a forward action paired with its compensating action
      - name: idle_capacity_cents
        type: number
        source: computed
        description: cost of the unutilised shop and field capacity carried by the project
  - name: Worker
    parent: null
    common_fields: true
    fields:
      - name: worker_code
        type: string
        source: input
        description: badge number; unique
      - name: full_name
        type: string
        source: input
        description: name
      - name: classification
        type: enum
        source: input
        description: labor classification driving jurisdiction rates
        constraints: "enum members: APPRENTICE, JOURNEYMAN, FOREMAN, GENERAL_FOREMAN"
      - name: apprentice_period
        type: integer
        source: input
        description: 1..5 apprenticeship step; required when classification is APPRENTICE, null otherwise
      - name: home_jurisdiction_key
        type: string
        source: input
        description: jurisdiction the worker is dispatched from; must equal the jobsite jurisdiction for dispatched work
      - name: qualification_state_code
        type: string
        source: input
        description: qualification code the worker holds; max 40 characters, longer values are rejected
      - name: shift_band_delta
        type: integer
        source: system
        description: derived shift band delta; set from qualification_state_code per release_gate_derivation
        default: 0
      - name: percent_complete_certified
        type: number
        source: input
        description: certified percent complete for the worker's own release
      - name: percent_complete_verified
        type: number
        source: input
        description: verified percent complete for recipients that view the worker's release
      - name: safety_verified_status
        type: enum
        source: input
        description: safety verification outcome
        default: UNVERIFIED
        constraints: "enum members: VERIFIED, UNVERIFIED, EXPIRED"
      - name: safety_verification_code
        type: string
        source: input
        description: code shown when the worker's own safety verification is inspected; a second fact is required before it is accepted
      - name: journey_ring_claim_hours
        type: number
        source: computed
        description: cumulative hours counting toward the journeyman upgrade; reset to 0 by an upgrade
      - name: upgrade_eligible
        type: boolean
        source: computed
        description: true when journey_ring_claim_hours > APPLICABLE_CONTRACT_HOURS
      - name: credited_field_hours
        type: number
        source: computed
        description: sum of credited_hours across the worker's accepted CrewDay rows
  - name: TradeContractRate
    parent: null
    common_fields: true
    fields:
      - name: jurisdiction_key
        type: string
        source: input
        description: jurisdiction the labor agreement rate belongs to
      - name: classification
        type: enum
        source: input
        description: labor classification covered by this rate row
        constraints: "enum members: APPRENTICE, JOURNEYMAN, FOREMAN, GENERAL_FOREMAN"
      - name: apprentice_period
        type: integer
        source: input
        description: 1..5 when classification is APPRENTICE, otherwise null
      - name: hourly_rate_cents
        type: number
        source: input
        description: straight-time hourly rate in cents
      - name: burden_pct
        type: number
        source: input
        description: payroll burden fraction applied to the hourly rate
      - name: apprentice_ratio_max
        type: number
        source: input
        description: agreement cap on apprentice:journeyman headcount ratio
      - name: wait_ratio_max
        type: number
        source: input
        description: second valid agreement cap applied to wait-ratio computation
      - name: effective_from_iso
        type: datetime
        source: input
        description: date the rate row takes effect
  - name: TradeActivity
    parent: null
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> {Project}.id; project the activity belongs to"
      - name: trade_key
        type: string
        source: input
        description: trade identity; electrical activities use trade_key "ELECTRICAL"
      - name: activity_kind
        type: enum
        source: input
        description: activity family
        constraints: "enum members: ELECTRICAL_INSTALL, MECHANICAL_ROUGH, PLUMBING_ROUGH, SPRINKLER_MAIN, DRYWALL_CLOSEOUT"
      - name: work_front_code
        type: string
        source: input
        description: work front the activity occupies
      - name: bay_code
        type: string
        source: input
        description: bay or corridor within the work front
      - name: written_sequence_index
        type: integer
        source: input
        description: index in the written installation sequence agreement; monotonically increasing
      - name: planned_start_iso
        type: datetime
        source: input
        description: planned start
      - name: planned_duration_days
        type: integer
        source: input
        description: planned duration in days
      - name: revision_id
        type: string
        source: input
        description: "FK -> {Revision}.id; revision whose rework produced this activity (null for originally planned activities)"
      - name: rate_id
        type: string
        source: input
        description: "FK -> {TradeContractRate}.id; rate row the activity is priced with"
      - name: permit_id
        type: string
        source: input
        description: "FK -> {TradeActivity}.id; the activity whose permit unblocks this activity (self-referential installation sequence link)"
      - name: status
        type: enum
        source: input
        description: activity lifecycle; suspension lifts only when no crew assigned to it carries excess apprentice hours
        default: PLANNED
        constraints: "enum members: PLANNED, PERMITTED, ACTIVE, DISALLOWED, COMPLETE"
      - name: suspension_reason
        type: string
        source: computed
        description: reason stamped when status becomes DISALLOWED; null otherwise
      - name: actual_start_iso
        type: datetime
        source: system
        description: stamped on each entry to ACTIVE
      - name: craft_hours_credit
        type: number
        source: computed
        description: pro-rated field credit for the activity's work front
      - name: rework_trade_value_cents
        type: number
        source: computed
        description: value of revision_cost_impact variant (a) for the rework this activity carries
  - name: CrewDay
    parent: null
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> {Project}.id; project the crew worked on"
      - name: worker_id
        type: string
        source: input
        description: "FK -> {Worker}.id; the crew member whose day is being reported"
      - name: foreman_id
        type: string
        source: input
        description: "FK -> {Worker}.id; the foreman reporting the day"
      - name: trade_activity_id
        type: string
        source: input
        description: "FK -> {TradeActivity}.id; the activity the crew worked on"
      - name: work_date_iso
        type: datetime
        source: input
        description: work date; unique per worker_id and project_id
      - name: regular_hours
        type: number
        source: input
        description: straight-time hours in quarter-hour increments
      - name: overtime_hours
        type: number
        source: input
        description: overtime hours; each overtime hour counts 1.5 apprentice hours in ComplianceLedger
      - name: report_sequence
        type: integer
        source: input
        description: foreman's report submission order for the day
      - name: acknowledge_mode
        type: enum
        source: input
        description: how the report is acknowledged; required on every create
        constraints: "enum members: RELEASE, FINAL"
      - name: accepted_for_credit
        type: boolean
        source: computed
        description: retained flag honoring the winning report under the project's credit policy
      - name: guilt_added
        type: boolean
        source: computed
        description: true only on the acknowledged row whose credited hours count toward the field credit ledger
      - name: credited_hours
        type: number
        source: computed
        description: labor hours credited to productivity when accepted_for_credit is true, zero otherwise
      - name: labor_cost_cents
        type: number
        source: computed
        description: (regular_hours + 1.5 x overtime_hours) x rate x (1 + burden)
      - name: adjusted_value_cents
        type: number
        source: computed
        description: labor_cost_cents recomputed at the guilt-added rate; may differ from labor_cost_cents on the same row
      - name: apprentice_hours
        type: number
        source: computed
        description: regular_hours + 1.5 x overtime_hours when the worker is an apprentice, else 0
      - name: journeyman_hours
        type: number
        source: computed
        description: regular_hours + overtime_hours when the worker is a journeyman, foreman or general foreman, else 0
  - name: ComplianceLedger
    parent: null
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> {Project}.id; project the ledger row belongs to"
      - name: worker_id
        type: string
        source: input
        description: "FK -> {Worker}.id; worker the row tracks"
      - name: trade_activity_id
        type: string
        source: input
        description: "FK -> {TradeActivity}.id; activity the cumulative hours accrued on"
      - name: rate_id
        type: string
        source: input
        description: "FK -> {TradeContractRate}.id; rate row the row is priced with"
      - name: jurisdiction_key
        type: string
        source: input
        description: jurisdiction whose apprentice ratio the row is evaluated against
      - name: classification
        type: enum
        source: input
        description: classification at the time of the work
        constraints: "enum members: APPRENTICE, JOURNEYMAN, FOREMAN, GENERAL_FOREMAN"
      - name: regular_hours
        type: number
        source: input
        description: straight-time hours on this row
      - name: overtime_hours
        type: number
        source: input
        description: overtime hours on this row; counted at 1.5 for apprentices and 1.0 for journeymen
      - name: pay_rate_cents
        type: number
        source: input
        description: weighted average straight-time rate applied to this row
      - name: burden_pct
        type: number
        source: input
        description: payroll burden fraction applied to this row
      - name: projected_ratio
        type: number
        source: input
        description: ratio the ledger expects after the pending crew change
      - name: total_cents
        type: number
        source: computed
        description: precomputed money owed on this ledger row
      - name: certified_hours
        type: number
        source: computed
        description: hours certified when no overpayment exists
      - name: ledger_credit_cents
        type: number
        source: computed
        description: computed ledger credit value
      - name: gross_payroll_cents
        type: number
        source: computed
        description: gross_payroll_reconciliation output
      - name: adjusted_payroll_cents
        type: number
        source: computed
        description: gross payroll recomputed at the guilt-added rate
      - name: apprentice_hours
        type: number
        source: computed
        description: cumulative regular apprentice hours plus 1.5 x overtime apprentice hours on this activity
      - name: journeyman_hours
        type: number
        source: computed
        description: cumulative journeyman and foreman hours (overtime at 1.0) on this activity
      - name: ratio_limit
        type: number
        source: computed
        description: applicable cap from TradeContractRate.apprentice_ratio_max or the tier default
      - name: wait_ratio_limit
        type: number
        source: computed
        description: applicable cap from TradeContractRate.wait_ratio_max or the tier default
      - name: excess_apprentice_hours
        type: number
        source: computed
        description: apprentice hours in excess of ratio_limit x journeyman_hours; drives suspension
      - name: adjustment_delta_hours
        type: number
        source: computed
        description: "signed sum of the compliance corrections applied to this row; the conserved quantity is apprentice_hours == the row's original apprentice hours + adjustment_delta_hours at all times"
  - name: ModelVersion
    parent: null
    common_fields: true
    fields:
      - name: model_id
        type: string
        source: input
        description: "FK -> {ModelVersion}.id; the building model lineage this version belongs to (self-referential revision lineage)"
      - name: revision_letter
        type: string
        source: input
        description: model revision letter; unique per model_id
      - name: status
        type: enum
        source: input
        description: lifecycle of the coordinated model version
        default: DRAFT
        constraints: "enum members: DRAFT, COORDINATED, SUPERSEDED"
      - name: zone_quantity_total
        type: number
        source: computed
        description: sum of TakeoffLine.quantity for this version; zero when the extraction created no lines
      - name: assembly_quantity_total
        type: number
        source: computed
        description: sum of TakeoffLine.quantity grouped by assembly_code for this version
      - name: empty_takeoff
        type: boolean
        source: computed
        description: true when zone_quantity_total is 0 and the takeoff set therefore carries no engineered content
      - name: coordinated_at_iso
        type: datetime
        source: system
        description: stamped when the version leaves DRAFT
  - name: TakeoffLine
    parent: null
    common_fields: true
    fields:
      - name: model_version_id
        type: string
        source: input
        description: "FK -> {ModelVersion}.id; the coordinated version this line was extracted from"
      - name: zone_code
        type: string
        source: input
        description: install zone code extracted from the model
      - name: assembly_code
        type: string
        source: input
        description: assembly definition identity; matches Assembly.assembly_code
      - name: conduit_run_type
        type: enum
        source: input
        description: installation method driving field-hour productivity
        constraints: "enum members: MC_CABLE, EMT_OVERHEAD, EMT_EMBEDDED, RIGID_RACK, OVERHEAD_RACK, UNDERGROUND_DUCTBANK, ALUMINUM_RACEWAY"
      - name: conduit_run_type_code
        type: string
        source: input
        description: conduit code token copied off the model; must be a member of the Assembly.ideal_conduit_type_codes array for the line's assembly
      - name: quantity
        type: number
        source: input
        description: extracted quantity in the assembly unit of measure
      - name: prefab_share_pct
        type: number
        source: input
        description: fraction of the quantity supplied by prefabrication (0..1); the remainder is field-cut
      - name: takeoff_hash
        type: string
        source: system
        description: sha256 over model_version_id, zone_code, assembly_code and quantity; duplicate hash is rejected
  - name: Assembly
    parent: null
    common_fields: true
    fields:
      - name: assembly_code
        type: string
        source: input
        description: catalog identity; unique
      - name: assembly_kind
        type: enum
        source: input
        description: prefab family
        constraints: "enum members: RACK, BRANCH_TRUNK, PANEL_FEEDER, DEVICE_STRAP, SWITCHGEAR_SECTION"
      - name: unit_of_measure
        type: enum
        source: input
        description: quantity unit for takeoff lines using this assembly; LINEAR_FEET for RACK and BRANCH_TRUNK, EACH for DEVICE_STRAP
        constraints: "enum members: LINEAR_FEET, EACH"
      - name: prefab_hours_per_unit
        type: number
        source: input
        description: shop hours to build one unit; the minimum achievable craft hours for the assembly
      - name: field_hours_per_unit
        type: number
        source: input
        description: field hours per unit installed prestine as one piece
      - name: supported_field_hours_per_unit
        type: number
        source: input
        description: field hours per unit when the unit arrives cut, labeled and kitted but unassembled
      - name: field_productivity_factor
        type: number
        source: input
        description: multiplier applied to supported field hours when the unit arrives rigged and spotted
      - name: ideal_conduit_type_codes
        type: array
        source: input
        description: conduit code tokens this assembly is engineered for; a takeoff line's conduit_run_type_code must be a member
      - name: conduit_labor_factors
        type: object
        source: input
        description: per-conduit-run-type labor multiplier map used by conduit-run impact
      - name: material_price_cents
        type: number
        source: input
        description: list material price per unit
      - name: core_charge_cents
        type: number
        source: input
        description: core charge per unit
      - name: recycled_credit_cents
        type: number
        source: input
        description: core credit per returned unit
      - name: is_switchgear
        type: boolean
        source: input
        description: true when the assembly is long-lead switchgear
  - name: Rack
    parent: null
    common_fields: true
    fields:
      - name: model_version_id
        type: string
        source: input
        description: "FK -> {ModelVersion}.id; model version the rack was laid out in"
      - name: rack_code
        type: string
        source: input
        description: rack tag; unique within the model version
      - name: zone_code
        type: string
        source: input
        description: install zone code
      - name: top_elevation_ft
        type: number
        source: input
        description: top-of-rack elevation in feet
      - name: rack_hoist_date
        type: datetime
        source: input
        description: date the rack is hoisted; the rack's hoisting reservation window starts on this date
      - name: value_capacity_cf
        type: number
        source: input
        description: maximum cubic feet of rack structure and support material the rack may carry
      - name: direct_assignment
        type: boolean
        source: input
        description: true when a move-back request may be assigned straight to this rack without a preceding hold
      - name: ordering_strength_rule
        type: enum
        source: input
        description: how the rack's reservation window extends
        constraints: "enum members: HOLD_WINDOW, RELEASE_WINDOW"
      - name: reserved_streams_and_phase_cf
        type: number
        source: computed
        description: stream and phase capacity in cubic feet; under STACKING_STREAM_LIMIT the rack may not be double-stacked across pre-release and installed resources
  - name: PrefabOrder
    parent: null
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> {Project}.id; owning project"
      - name: model_version_id
        type: string
        source: input
        description: "FK -> {ModelVersion}.id; the version the work package was taken off from"
      - name: stage_code
        type: enum
        source: input
        description: distribution stage
        constraints: "enum members: FIRST_STAGE, SECOND_STAGE, TRIM_OUT"
      - name: zone_code
        type: string
        source: input
        description: install zone code
      - name: fabricate_status
        type: enum
        source: input
        description: independent state dimension A
        default: PLANNED
        constraints: "enum members: PLANNED, RELEASED, IN_FABRICATION, FABRICATED, CANCELLED"
      - name: deliver_status
        type: enum
        source: input
        description: independent state dimension B
        default: AWAITING
        constraints: "enum members: AWAITING, STAGED, LOADED, IN_TRANSIT, DELIVERED"
      - name: shipment_status
        type: enum
        source: input
        description: independent state dimension C for the transport booking
        default: PENDING
        constraints: "enum members: PENDING, RESERVED, STAGED, LOADED, IN_TRANSIT, DELIVERED, LOST, LOCKED"
      - name: transport_kind
        type: enum
        source: input
        description: transport mode; drives travel and unload days applied to the delivery deadline
        constraints: "enum members: FLATBED, MIXED_LOAD"
      - name: hoisting_window_id
        type: string
        source: input
        description: hoisting window identifier the work package is booked against
      - name: required_on_site_iso
        type: datetime
        source: input
        description: just-in-time arrival deadline
      - name: installation_window_start_iso
        type: datetime
        source: input
        description: earliest the work package may be spotted on the deck
      - name: fabricate_quantity
        type: number
        source: input
        description: quantity of units in this work package; drives craft hours and rework hours
      - name: shop_utilisation_basis_pct
        type: number
        source: input
        description: shop utilisation basis recorded when the order was taken; snapshot taken at release
      - name: release_to_shop_iso
        type: datetime
        source: computed
        description: date the order actually went to the shop; the baseline for rework and revision crediting
      - name: releasable_status
        type: enum
        source: computed
        description: "derived reconciliation field; precedence is ENGINEERING_HOLD (Project.fabricated_revision_active is true and a Revision names an artifact of this order's assembly set, or rework_order_count > 0) > MATERIAL_HOLD (a member of Project.material_gate_commodities has no MaterialRelease in the declared-for-procurement state) > READY; PERMITTED is written when posture is RELEASE_PENDING, ALLOWED when posture is ON_TRACK and every gate passes, READY otherwise"
        constraints: "enum members: ENGINEERING_HOLD, MATERIAL_HOLD, READY, PERMITTED, ALLOWED"
      - name: laydown_slot_index
        type: integer
        source: computed
        description: laydown yard slot index (1..Project.laydown_slots), lowest free index by release instant ascending, tie-break by id ascending
      - name: rework_order_count
        type: integer
        source: computed
        description: count of ReworkJob rows whose prefab_component_id belongs to this order
      - name: assembly_count
        type: integer
        source: computed
        description: count of the order's PrefabComponent rows
      - name: crafted_hours_total
        type: number
        source: computed
        description: sum of crafted_hours over the order's PrefabComponent rows
      - name: crafted_hours_credit
        type: number
        source: computed
        description: release-weighted share of crafted_hours_total credited before the release instant
      - name: rework_hours
        type: number
        source: computed
        description: hours charged to shop rework, reset at the release instant
      - name: hoisting_duration_days
        type: integer
        source: computed
        description: derived hoisting window length in days, clamped to [MIN_HOISTING_DAYS, MAX_HOISTING_DAYS]
      - name: hoisting_start_iso
        type: datetime
        source: computed
        description: derived hoisting window start; frozen when fabricate_status is RELEASED
      - name: hoisting_end_iso
        type: datetime
        source: computed
        description: derived hoisting window end; frozen when fabricate_status is RELEASED
      - name: planned_delivery_iso
        type: datetime
        source: computed
        description: required_on_site_iso minus lead time minus travel time minus unload time, in days
      - name: fabrication_utilisation_pct
        type: number
        source: computed
        description: 0.0 when the order's material release has not been declared, otherwise equal to shop_utilisation_basis_pct
  - name: PrefabComponent
    parent: null
    common_fields: true
    fields:
      - name: prefab_order_id
        type: string
        source: input
        description: "FK -> {PrefabOrder}.id; owning work package"
      - name: rack_id
        type: string
        source: input
        description: "FK -> {Rack}.id; rack the component is assigned to and installed on"
      - name: takeoff_line_id
        type: string
        source: input
        description: "FK -> {TakeoffLine}.id; extracted line this component satisfies"
      - name: predecessor_component_id
        type: string
        source: input
        description: "FK -> {PrefabComponent}.id; the component whose installation gates this one when chain_mode is CHAIN_DEPENDENT"
      - name: assembly_code
        type: string
        source: input
        description: assembly identity; matches Assembly.assembly_code and TakeoffLine.assembly_code
      - name: quantity
        type: number
        source: input
        description: quantity in the assembly unit of measure
      - name: install_status
        type: enum
        source: input
        description: shop and field progression
        default: PLANNED
        constraints: "enum members: PLANNED, FABRICATED, LOADED, SET, REWORK, SCRAPPED"
      - name: chain_mode
        type: enum
        source: input
        description: whether the component chains off its predecessor
        constraints: "enum members: CHAIN_DEPENDENT, PARALLEL_FABRICATION"
      - name: chain_dependency_link
        type: string
        source: input
        description: business key of the chain dependency this component participates in
      - name: crafted_hours
        type: number
        source: computed
        description: quantity x Assembly.prefab_hours_per_unit; the minimum achievable craft hours for the component
      - name: prefab_value_cents
        type: number
        source: computed
        description: crafted_hours x jurisdiction journeyman rate x (1 + burden)
      - name: contractual_credit_cents
        type: number
        source: computed
        description: credited value of the component including the core credit and any recycled credit earned
  - name: Revision
    parent: null
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> {Project}.id; project the revision belongs to"
      - name: model_version_id
        type: string
        source: input
        description: "FK -> {ModelVersion}.id; the model version the revision was raised against"
      - name: revised_version_id
        type: string
        source: input
        description: "FK -> {ModelVersion}.id; the successor model version produced by this revision"
      - name: revision_kind
        type: enum
        source: input
        description: origin of the change
        constraints: "enum members: DESIGN_CHANGE, RFI_RESPONSE, CLASH_RESOLUTION, OWNER_DIRECTIVE"
      - name: status
        type: enum
        source: input
        description: revision lifecycle
        default: DRAFT
        constraints: "enum members: DRAFT, SUBMITTED, APPROVED, REJECTED, SUPERSEDED"
      - name: revision_number
        type: string
        source: system
        description: sequential number within the project
      - name: impact_keys
        type: array
        source: input
        description: business keys of the affected artifacts; each must resolve to a TakeoffLine.takeoff_hash, a PrefabComponent code or a Rack.rack_code
      - name: impact_values
        type: array
        source: computed
        description: per-impact computed values from revision_cost_impact, one object per impact_key
      - name: maintenance_hours
        type: number
        source: input
        description: base maintenance hours for the revision's rework
      - name: buffer_before_hours
        type: number
        source: input
        description: buffer hours carried ahead of the rework
      - name: momentum_before_hours
        type: number
        source: input
        description: momentum hours carried into the rework
      - name: base_service_hours
        type: number
        source: input
        description: base craft hours for the revision's affected scope
      - name: paid_service_hours
        type: number
        source: input
        description: craft hours already paid within the contract price
      - name: billed_service_hours
        type: number
        source: input
        description: craft hours already billed to the owner
      - name: percent_complete_mode
        type: enum
        source: input
        description: which percent complete is reported
        default: FLOW
        constraints: "enum members: FLOW, WEIGHT"
      - name: label_percent_complete
        type: number
        source: input
        description: percent complete printed on the physical label
      - name: label_codes
        type: array
        source: input
        description: codes printed on the label; a label without the fabricated-content code carries no rework content
      - name: fabricated_content_codes
        type: array
        source: input
        description: label codes that mark fabricated content
      - name: shop_parts_value_cents
        type: number
        source: input
        description: value of shop-fabricated parts tied to the revision
      - name: shop_parts_quantity
        type: number
        source: input
        description: quantity of shop-fabricated parts tied to the revision
      - name: revision_quantity
        type: number
        source: input
        description: quantity affected by the revision
      - name: impact_qualified_hours
        type: number
        source: input
        description: qualified hours found by the revision search, including lines already fabricated
      - name: effort_hours
        type: number
        source: input
        description: hours the revision consumed before the shop closed the revision
      - name: kludge_rate_per_hour_cents
        type: number
        source: input
        description: expedited shop rate applied to revised work
      - name: negotiated_rate_per_hour_cents
        type: number
        source: input
        description: agreed change-order rate applied to revised work
      - name: submitted_markup_pct
        type: number
        source: input
        description: markup applied on the negotiated rate for direct costs
      - name: direct_shop_cost_cents
        type: number
        source: input
        description: direct shop cost the revision incurred before approval
      - name: replacement_lifecycle_percent
        type: number
        source: input
        description: lifecycle percent of the replacement content
      - name: prior_lifecycle_percent
        type: number
        source: input
        description: lifecycle percent of the content being replaced
      - name: safety_gate_status
        type: enum
        source: input
        description: external safety review outcome for the revision
        default: OPEN
        constraints: "enum members: OPEN, BLOCKED, LOCKED, PASSED"
      - name: label_verified_status
        type: enum
        source: input
        description: verification of the revision label
        default: UNVERIFIED
        constraints: "enum members: VERIFIED, UNVERIFIED"
      - name: safety_verified_status
        type: enum
        source: input
        description: verification of the revision safety record
        default: UNVERIFIED
        constraints: "enum members: VERIFIED, UNVERIFIED"
      - name: label_percentage
        type: number
        source: input
        description: percent printed on the label when the revision carries fabricated content; null when it does not
      - name: qualified_lifecycle_percent
        type: number
        source: input
        description: lifecycle percent of the fabricated content produced as a byproduct of this revision; 0 when none
      - name: proposed_waiver
        type: boolean
        source: input
        description: true when a waiver request is submitted alongside the revision
      - name: affects_fabricated_content
        type: boolean
        source: computed
        description: true when the revision's label codes include a fabricated-content code and its label percentage is greater than zero
      - name: engineering_hold
        type: boolean
        source: computed
        description: true while status is not a member of {APPROVED, REJECTED, SUPERSEDED}
      - name: approved_change_value_cents
        type: number
        source: computed
        description: sum of revision_cost_impact variant (b) over the revision's impacts while status is APPROVED, else 0
      - name: equipment_value_delta_cents
        type: number
        source: computed
        description: shop_parts_value_cents minus shop_parts_quantity x the current shop parts basis
      - name: revised_trade_hours
        type: number
        source: computed
        description: craft hours implied for the revised scope
      - name: tied_shipment_hours
        type: number
        source: computed
        description: craft hours tied to committed content of the superseded lines (components whose install_status is FABRICATED, LOADED or SET)
      - name: shipment_tied_flag
        type: boolean
        source: computed
        description: true when any tied shipment exists
      - name: required_actions
        type: array
        source: computed
        description: ordered action identifiers the revision requires
      - name: base_flow_hours
        type: number
        source: computed
        description: unadjusted flow hours for the revision scope
      - name: peak_multiplier
        type: number
        source: computed
        description: peak period multiplier applied to the revision's maintenance window
      - name: adjusted_flow_hours
        type: number
        source: computed
        description: flow hours after the peak multiplier and any shift-band delta
      - name: excess_flow_hours
        type: number
        source: computed
        description: adjusted_flow_hours minus the rework hours allowed inside the rework window
  - name: ReworkJob
    parent: null
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> {Project}.id; project the rework job belongs to"
      - name: prefab_component_id
        type: string
        source: input
        description: "FK -> {PrefabComponent}.id; component sent back to the shop"
      - name: revision_id
        type: string
        source: input
        description: "FK -> {Revision}.id; revision that created the job"
      - name: impact_key
        type: string
        source: input
        description: business key of the impact this job addresses; must be a member of the revision's impact_keys
      - name: reason_code
        type: string
        source: input
        description: rework reason, e.g. DESIGN_REVISION
      - name: reason_question_code
        type: string
        source: input
        description: question code presented to the shop when the job is opened
      - name: reason_option_code
        type: string
        source: input
        description: option code the shop selects; must be admissible for reason_question_code
      - name: confirmation_mode
        type: enum
        source: input
        description: confirmation mode requested for the job
        constraints: "enum members: SHOP_CONFIRMATION, FIELD_CONFIRMATION"
      - name: confirmation_mode_effective
        type: enum
        source: input
        description: confirmation mode actually applied; a conversion or extension mode different from SHOP_CONFIRMATION and FIELD_CONFIRMATION may be set here
        constraints: "enum members: SHOP_CONFIRMATION, FIELD_CONFIRMATION, CONVERSION, EXTENSION"
      - name: scheduled_start_iso
        type: datetime
        source: input
        description: date the rework is scheduled to start
      - name: rework_hours
        type: number
        source: computed
        description: affected quantity x Assembly.prefab_hours_per_unit; 0 and no job row when the affected set is empty
      - name: status
        type: enum
        source: input
        description: rework lifecycle
        default: OPEN
        constraints: "enum members: OPEN, IN_PROGRESS, CLOSED, RECUT_DEFERRED"
  - name: MaterialRelease
    parent: null
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> {Project}.id; project the release belongs to"
      - name: model_version_id
        type: string
        source: input
        description: "FK -> {ModelVersion}.id; model version quantities were taken from"
      - name: vendor_key
        type: string
        source: input
        description: vendor or supplier identity
      - name: material_commodity
        type: enum
        source: input
        description: commodity released for procurement
        constraints: "enum members: MC_CABLE, EMT_CONDUIT, RIGID_CONDUIT, STRUT, FITTINGS, SWITCHGEAR, WIRE, BOX"
      - name: quantity
        type: number
        source: input
        description: released quantity in vendor units
      - name: unit_price_cents
        type: number
        source: input
        description: released unit price in cents
      - name: lead_time_days
        type: integer
        source: input
        description: vendor lead time quoted for this release; SWITCHGEAR quotes must be at least 90 days
      - name: service_priority
        type: enum
        source: input
        description: shipping service the vendor offers
        constraints: "enum members: SECOND_DAY, NEXT_DAY"
      - name: commitment_mode
        type: enum
        source: input
        description: how the release was committed to the schedule
        constraints: "enum members: PLANNED, CONFIRMED"
      - name: planned_release_iso
        type: datetime
        source: input
        description: date the release must be issued to the vendor
      - name: receiving_user_id
        type: string
        source: input
        description: operator who will acknowledge receipt
      - name: status
        type: enum
        source: input
        description: procurement status; locked_release_iso is frozen while status is RELEASED
        default: PLANNED
        constraints: "enum members: PLANNED, RELEASED, SHIPPED, RECEIVED, RESTRICTED"
      - name: locked_release_iso
        type: datetime
        source: system
        description: copy of planned_release_iso frozen at the earliest affected PrefabOrder release-to-shop
      - name: priced_hours
        type: number
        source: computed
        description: quantity x lead_time_days; drives the release ladder
      - name: list_value_cents
        type: number
        source: computed
        description: material_price_cents x quantity for the release's assembly basis
      - name: ship_cost_cents
        type: number
        source: computed
        description: transport cost for the release
      - name: value_cents
        type: number
        source: computed
        description: release value after ship cost, material value and any recycled credit
      - name: declared_for_procurement
        type: boolean
        source: computed
        description: true when status is RELEASED, SHIPPED or RECEIVED
      - name: restriction_since_iso
        type: datetime
        source: computed
        description: timestamp the release entered RESTRICTED; null otherwise

state_machines:
  - entity: Project
    state_dimensions:
      - dimension_a: project_posture
        initial: ON_TRACK
        terminal: []
      - dimension_b: delivery_gate
        initial: OPEN
        terminal: []
    initial_state: ON_TRACK
    terminal_states: []
    transitions:
      - from: ON_TRACK
        to: ON_TRACK
        trigger: "POST /projects/{id}/posture/recompute"
        actor: PlatformAdmin
        preconditions:
          - "project.slippage_pct <= project.posture_thresholds.SLIP_RELEASE_AT"
          - "project.shop_utilization_pct < 1.00"
        side_effects:
          - "project.project_posture recomputed through the descending ladder SLIP_RELEASE_AT -> SLIP_RECOVERY_AT -> SLIP_HOLD_AT -> SLIP_FREEZE_AT (each tier uses the <= test)"
          - "project.apprentice_breach_flag recomputed from the project-wide excess_apprentice_hours"
          - "project.fabricated_revision_active recomputed from the project's non-terminal Revisions"
          - "project_posture_derivation"
        note: "An unset ladder is not permitted: the ladder may never be waived below SLIP_FREEZE_AT for a project whose shop_utilization_pct is at or above 0.85."
      - from: ON_TRACK
        to: RELEASE_PENDING
        trigger: "POST /projects/{id}/posture/recompute"
        actor: PlatformAdmin
        preconditions:
          - "project.posture_thresholds.SLIP_RELEASE_AT < project.slippage_pct <= project.posture_thresholds.SLIP_RECOVERY_AT"
        side_effects:
          - "project.project_posture = RELEASE_PENDING"
          - "cascade hop 1: every non-terminal PrefabOrder of the project has releasable_status recomputed"
          - "cascade hop 2: for each such order with rework_order_count > 0, releasable_status is written ENGINEERING_HOLD"
          - "cascade hop 3: Project.fabrication_locked recomputed from the order gate results"
      - from: RELEASE_PENDING
        to: RECOVERY_MODE
        trigger: "POST /projects/{id}/posture/recompute"
        actor: PlatformAdmin
        preconditions:
          - "project.posture_thresholds.SLIP_RECOVERY_AT < project.slippage_pct <= project.posture_thresholds.SLIP_HOLD_AT"
        side_effects:
          - "project.project_posture = RECOVERY_MODE"
          - "cascade hop 1: every non-terminal PrefabOrder has craft_hours_credit recomputed"
          - "cascade hop 2: the overtime plan adds overtime hours to the crew rows of the next work front, which appends ComplianceLedger.overtime_hours"
          - "cascade hop 3: ComplianceLedger.apprentice_hours, journeyman_hours and excess_apprentice_hours recomputed on every affected row (overtime counted at 1.5 for apprentices, 1.0 for journeymen)"
          - "cascade hop 4: owning TradeActivity.status becomes DISALLOWED for any activity whose crew carries excess apprentice hours"
      - from: RECOVERY_MODE
        to: HOLD
        trigger: "POST /projects/{id}/posture/recompute"
        actor: PlatformAdmin
        preconditions:
          - "project.posture_thresholds.SLIP_HOLD_AT < project.slippage_pct <= project.posture_thresholds.SLIP_FREEZE_AT"
        side_effects:
          - "project.project_posture = HOLD"
          - "cascade hop 1: hoisting windows recomputed for non-terminal PrefabOrders"
          - "cascade hop 2: each affected PrefabOrder.releasable_status recomputed; the release gate is closed on orders whose windows shifted"
          - "cascade hop 3: Project.fabrication_locked recomputed"
      - from: HOLD
        to: FROZEN
        trigger: "POST /projects/{id}/posture/recompute"
        actor: PlatformAdmin
        preconditions:
          - "project.slippage_pct > project.posture_thresholds.SLIP_FREEZE_AT"
        side_effects:
          - "project.project_posture = FROZEN"
          - "cascade hop 1: every non-terminal PrefabOrder has releasable_status forced to ENGINEERING_HOLD"
          - "cascade hop 2: every PrefabComponent of those orders with install_status PLANNED has its rack binding suppressed and contributes 0 to Project.pipeline_value_cents"
          - "cascade hop 3: material_release_timing recomputed for every MaterialRelease of the project; no new release may be declared while the project is FROZEN"
      - from: RELEASE_PENDING
        to: ON_TRACK
        trigger: "POST /projects/{id}/posture/recompute"
        actor: PlatformAdmin
        preconditions:
          - "project.slippage_pct <= project.posture_thresholds.SLIP_RELEASE_AT"
        side_effects:
          - "project.project_posture = ON_TRACK"
          - "cascade hop 1: releasable_status recomputed on every non-terminal PrefabOrder; ENGINEERING_HOLD is still applied where rework_order_count > 0"
          - "cascade hop 2: Project.fabrication_locked recomputed"
      - from: RECOVERY_MODE
        to: RELEASE_PENDING
        trigger: "POST /projects/{id}/posture/recompute"
        actor: PlatformAdmin
        preconditions:
          - "project.posture_thresholds.SLIP_RELEASE_AT < project.slippage_pct <= project.posture_thresholds.SLIP_RECOVERY_AT"
        side_effects:
          - "project.project_posture = RELEASE_PENDING"
          - "cascade hop 1: releasable_status recomputed on every non-terminal PrefabOrder"
      - from: HOLD
        to: RECOVERY_MODE
        trigger: "POST /projects/{id}/posture/recompute"
        actor: PlatformAdmin
        preconditions:
          - "project.posture_thresholds.SLIP_RECOVERY_AT < project.slippage_pct <= project.posture_thresholds.SLIP_HOLD_AT"
        side_effects:
          - "project.project_posture = RECOVERY_MODE"
          - "cascade hop 1: hoisting windows recomputed for non-terminal PrefabOrders"
      - from: FROZEN
        to: RECOVERY_MODE
        trigger: "POST /projects/{id}/posture/recompute"
        actor: PlatformAdmin
        preconditions:
          - "project.posture_thresholds.SLIP_RECOVERY_AT < project.slippage_pct <= project.posture_thresholds.SLIP_HOLD_AT"
          - "the project has no PrefabOrder whose shipment_status is IN_TRANSIT or LOCKED"
        side_effects:
          - "project.project_posture = RECOVERY_MODE"
          - "cascade hop 1: releasable_status recomputed on every non-terminal PrefabOrder"
          - "cascade hop 2: hoisting windows recomputed for those orders"
      - from: OPEN
        to: BLOCKED
        dimension: delivery_gate
        trigger: "system event: a dependency band gate result for an external trade becomes BLOCKED"
        actor: system
        preconditions:
          - "the project has a TradeActivity whose activity_kind is in {MECHANICAL_ROUGH, PLUMBING_ROUGH, SPRINKLER_MAIN, DRYWALL_CLOSEOUT} and status in {PLANNED, PERMITTED, ACTIVE, DISALLOWED}"
        side_effects:
          - "project.external_gate_open recomputed to false"
          - "cascade hop 1: every non-terminal PrefabOrder.releasable_status recomputed"
          - "cascade hop 2: Project.fabrication_locked recomputed"
      - from: BLOCKED
        to: OPEN
        trigger: "system event: the blocking external trade activity reaches COMPLETE"
        actor: system
        preconditions:
          - "the blocking activity's status is COMPLETE"
        side_effects:
          - "project.external_gate_open recomputed to true"

  - entity: ModelVersion
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: COORDINATED
        trigger: "POST /model-versions/{id}/coordinate"
        actor: ModelCoordinator
        preconditions:
          - "model_version.zone_quantity_total >= 1"
          - "model_version.empty_takeoff is false"
        side_effects:
          - "model_version.status = COORDINATED"
          - "model_version.coordinated_at_iso stamped from the logical clock"
          - "recompute_model_version_quantities (zone_quantity_total, assembly_quantity_total)"
      - from: COORDINATED
        to: COORDINATED
        trigger: "POST /takeoff-lines (a further extraction against a live coordinated version)"
        actor: ModelCoordinator
        preconditions:
          - "model_version.status == COORDINATED"
        side_effects:
          - "recompute_model_version_quantities; a re-extraction that lowered zone_quantity_total below 1 is rejected with ERR_MODEL_QUANTITY_UNRESOLVED and leaves both totals unchanged"
        note: "Revision loop: the extraction set may be re-driven against a coordinated version without reopening DRAFT."
      - from: COORDINATED
        to: SUPERSEDED
        trigger: "POST /revisions/{id}/approve"
        actor: ProjectManager
        preconditions:
          - "the Revision named in the path has model_version_id equal to this ModelVersion.id and revision_kind is a coordinated design change"
        side_effects:
          - "model_version.status = SUPERSEDED"
          - "model_version.version incremented by 1"
          - "revision.engineering_hold recomputed to false for the approving Revision"
          - "model_version.coordinated_at_iso left unchanged (history is immutable)"

  - entity: TakeoffLine
    initial_state: EXTRACTED
    terminal_states: [SUPERSEDED]
    transitions:
      - from: EXTRACTED
        to: EXTRACTED
        trigger: "POST /takeoff-lines"
        actor: ModelCoordinator
        preconditions:
          - "takeoff_line.takeoff_hash has never been registered on this model_version_id"
          - "takeoff_line.quantity > 0"
        side_effects:
          - "recompute_model_version_quantities on the owning ModelVersion"
          - "takeoff_line.conduit_run_type_code validated against Assembly.ideal_conduit_type_codes"
      - from: EXTRACTED
        to: SUPERSEDED
        trigger: "POST /revisions/{id}/approve"
        actor: ProjectManager
        preconditions:
          - "a RevisionImpact of the approving Revision names this line's takeoff_hash"
        side_effects:
          - "takeoff_line marked superseded; it contributes 0 to ModelVersion.zone_quantity_total"
          - "cascade hop 1: revision.impact_values recomputed for the impact naming this line"
          - "cascade hop 2: project.approved_change_value_cents recomputed from revision_cost_impact variant (b)"
          - "cascade hop 3: Project.project_posture recomputed"
        note: "Lines already fabricated contribute rework hours rather than disappearing; the ledger keeps the superseded line for audit."

  - entity: PrefabOrder
    state_dimensions:
      - dimension_a: fabricate_status
        initial: PLANNED
        terminal: [CANCELLED]
      - dimension_b: deliver_status
        initial: AWAITING
        terminal: [DELIVERED]
      - dimension_c: shipment_status
        initial: PENDING
        terminal: [DELIVERED, LOST]
    initial_state: PLANNED
    terminal_states: [CANCELLED, DELIVERED]
    transitions:
      - from: PLANNED
        to: RELEASED
        dimension: fabricate_status
        trigger: "POST /prefab-orders/{id}/release"
        actor: ProjectManager
        preconditions:
          - "prefab_order.releasable_status in {READY, PERMITTED, ALLOWED}"
          - "project.project_posture in {ON_TRACK, RELEASE_PENDING, RECOVERY_MODE}; HOLD and FROZEN block release"
        side_effects:
          - "prefab_order.fabricate_status = RELEASED; prefab_order.version incremented by 1"
          - "prefab_order.release_to_shop_iso stamped from the logical clock"
          - "prefab_order.laydown_slot_index = lowest free slot index 1..project.laydown_slots, chosen by ascending release instant, tie-break by ascending id"
          - "hoisting_window_derivation runs; hoisting_duration_days, hoisting_start_iso and hoisting_end_iso are written and then frozen"
          - "prefab_order.fabrication_utilisation_pct recomputed"
          - "material_release_timing recomputed for every MaterialRelease whose material_commodity appears in this order's components; locked_release_iso is frozen"
          - "recompute_project_pipeline for the owning project"
      - from: RELEASED
        to: IN_FABRICATION
        dimension: fabricate_status
        trigger: "PATCH /prefab-orders/{id}/fabrication-status"
        actor: ShopForeman
        preconditions:
          - "prefab_order.fabricate_status == RELEASED"
        side_effects:
          - "prefab_order.fabricate_status = IN_FABRICATION; version incremented by 1"
          - "every PrefabComponent of this order whose consuming commodity release is declared is marked available for fabrication in the shop queue"
      - from: IN_FABRICATION
        to: FABRICATED
        dimension: fabricate_status
        trigger: "PATCH /prefab-orders/{id}/fabrication-status"
        actor: ShopForeman
        preconditions:
          - "prefab_order.fabricate_status == IN_FABRICATION"
          - "prefab_order.assembly_count > 0"
        side_effects:
          - "prefab_order.fabricate_status = FABRICATED; version incremented by 1"
          - "crafted_hours_credit recomputed for the order's released components"
          - "recompute_project_pipeline for the owning project"
      - from: FABRICATED
        to: PLANNED
        dimension: fabricate_status
        trigger: "POST /prefab-orders/{id}/ressue"
        actor: ProjectManager
        preconditions:
          - "prefab_order.deliver_status == AWAITING"
        side_effects:
          - "prefab_order.fabricate_status = PLANNED; version incremented by 1"
          - "prefab_order.laydown_slot_index released back to the free pool"
          - "prefab_order.hoisting_start_iso, hoisting_end_iso and release_to_shop_iso cleared to null"
          - "cascade hop 1: every PrefabComponent of this order with install_status FABRICATED reverts to PLANNED"
          - "cascade hop 2: crafted_hours_credit recomputed to 0 for those components"
          - "cascade hop 3: project.pipeline_value_cents recomputed through project_pipeline_balance"
          - "compensating invariant: project.crafted_hours_balance is unchanged by the FABRICATED -> PLANNED revert because the credit is re-credited to the pipeline balance"
      - from: PLANNED
        to: CANCELLED
        dimension: fabricate_status
        trigger: "POST /prefab-orders/{id}/cancel"
        actor: ProjectManager
        preconditions:
          - "prefab_order.fabricate_status == PLANNED"
          - "prefab_order.deliver_status == AWAITING"
        side_effects:
          - "prefab_order.fabricate_status = CANCELLED; version incremented by 1"
          - "cascade hop 1: every PrefabComponent of this order with install_status in {PLANNED, FABRICATED} has rack_id cleared and install_status set SCRAPPED"
          - "cascade hop 2: Rack.reserved_streams_and_phase_cf recomputed for every affected Rack through rack_value_capacity_check"
          - "cascade hop 3: project.pipeline_value_cents recomputed through project_pipeline_balance"
      - from: AWAITING
        to: STAGED
        dimension: deliver_status
        trigger: "PATCH /prefab-orders/{id}/delivery-status"
        actor: LogisticsCoordinator
        preconditions:
          - "prefab_order.fabricate_status == FABRICATED"
        side_effects:
          - "prefab_order.deliver_status = STAGED; version incremented by 1"
      - from: STAGED
        to: LOADED
        dimension: deliver_status
        trigger: "PATCH /prefab-orders/{id}/delivery-status"
        actor: LogisticsCoordinator
        preconditions:
          - "prefab_order.deliver_status == STAGED"
          - "prefab_order.shipment_status in {PENDING, RESERVED, STAGED}"
          - "the order's required_on_site_iso falls inside its frozen hoisting window"
        side_effects:
          - "prefab_order.deliver_status = LOADED; prefab_order.shipment_status = LOADED; version incremented by 1"
          - "cascade hop 1: every PrefabComponent of this order with install_status FABRICATED becomes LOADED"
          - "cascade hop 2: PrefabComponent.prefab_value_cents recomputed for each of them"
          - "cascade hop 3: project.pipeline_value_cents and Project.installed_pct recomputed; Project.project_posture recomputed through the ladder"
      - from: LOADED
        to: AWAITING
        dimension: deliver_status
        trigger: "PATCH /prefab-orders/{id}/delivery-status"
        actor: LogisticsCoordinator
        preconditions:
          - "prefab_order.deliver_status == LOADED"
        side_effects:
          - "prefab_order.deliver_status = AWAITING; prefab_order.shipment_status = STAGED; version incremented by 1"
          - "compensating hop 1: the order's LOADED components revert to FABRICATED"
          - "compensating hop 2: project.pipeline_value_cents recomputed through project_pipeline_balance"
          - "compensating invariant: project.crafted_hours_balance is unchanged by the LOADED -> AWAITING revert"
      - from: LOADED
        to: IN_TRANSIT
        dimension: deliver_status
        trigger: "PATCH /prefab-orders/{id}/delivery-status (dispatch legs) or system event on the required dispatch date"
        actor: LogisticsCoordinator
        preconditions:
          - "prefab_order.deliver_status == LOADED"
          - "current logical clock >= prefab_order.planned_delivery_iso"
        side_effects:
          - "prefab_order.deliver_status = IN_TRANSIT; prefab_order.shipment_status = IN_TRANSIT; version incremented by 1"
      - from: IN_TRANSIT
        to: DELIVERED
        dimension: deliver_status
        trigger: "PATCH /prefab-orders/{id}/delivery-status (unload at the deck) or system delivery event"
        actor: LogisticsCoordinator
        preconditions:
          - "prefab_order.deliver_status == IN_TRANSIT"
        side_effects:
          - "prefab_order.deliver_status = DELIVERED; prefab_order.shipment_status = DELIVERED; version incremented by 1"
          - "deletion hop: PrefabOrder.fabricate_quantity decremented by the delivered quantity and the order marked deleted from the shop queue"
          - "deletion hop: the released allocation for the order is restated through Project.installed_pct"
          - "cascade hop 1: Project.completed_value_cents recomputed through project_pipeline_balance"
          - "cascade hop 2: Project.project_posture recomputed through the ladder"
      - from: IN_TRANSIT
        to: LOADED
        dimension: deliver_status
        trigger: "PATCH /prefab-orders/{id}/delivery-status (loss recovery)"
        actor: LogisticsCoordinator
        preconditions:
          - "prefab_order.deliver_status == IN_TRANSIT"
          - "prefab_order.shipment_status == LOST"
        side_effects:
          - "prefab_order.deliver_status = LOADED; prefab_order.shipment_status = LOADED; version incremented by 1"
          - "prefab_order.rework_order_count recomputed; a re-ship ReworkJob is opened for the lost content"
          - "cascade hop 1: project.pipeline_value_cents recomputed"
          - "cascade hop 2: Project.project_posture recomputed"

  - entity: PrefabComponent
    initial_state: PLANNED
    terminal_states: [SET]
    transitions:
      - from: PLANNED
        to: FABRICATED
        trigger: "POST /prefab-components/{id}/fabricate"
        actor: ShopForeman
        preconditions:
          - "prefab_component.prefab_order.fabricate_status == IN_FABRICATION"
          - "prefab_component.prefab_order.releasable_status != ENGINEERING_HOLD"
          - "prefab_component.predecessor_component_id is null OR the predecessor's install_status is SET OR the component's chain_mode is PARALLEL_FABRICATION"
        side_effects:
          - "prefab_component.install_status = FABRICATED"
          - "crafted_hours_credit recomputed for the component"
          - "recompute_project_pipeline for the owning project"
      - from: FABRICATED
        to: LOADED
        trigger: "system event: owning PrefabOrder.deliver_status becomes LOADED"
        actor: system
        preconditions:
          - "prefab_component.install_status == FABRICATED"
          - "the component's rack capacity check still passes at load time"
        side_effects:
          - "prefab_component.install_status = LOADED"
          - "contractual_credit_cents recomputed including the core credit"
          - "project.pipeline_value_cents recomputed through project_pipeline_balance"
      - from: FABRICATED
        to: REWORK
        trigger: "POST /revisions/{id}/approve (cascade) or POST /rework-jobs (explicit shop return)"
        actor: ProjectManager
        preconditions:
          - "the component's assembly_code is named by a RevisionImpact of the approving Revision"
        side_effects:
          - "prefab_component.install_status = REWORK"
          - "a ReworkJob with status OPEN is created for the component and the naming impact"
          - "cascade hop 1: owning PrefabOrder.rework_order_count recomputed"
          - "cascade hop 2: owning PrefabOrder.releasable_status recomputed; ENGINEERING_HOLD is written when the project posture is ON_TRACK or RELEASE_PENDING and rework_order_count > 0"
          - "cascade hop 3: Project.fabrication_locked and Project.fabricated_revision_active recomputed"
      - from: REWORK
        to: FABRICATED
        trigger: "PATCH /rework-jobs/{id}/status"
        actor: ShopForeman
        preconditions:
          - "rework_job.status in {OPEN, IN_PROGRESS}"
        side_effects:
          - "rework_job.status = CLOSED"
          - "prefab_component.install_status = FABRICATED"
          - "cascade hop 1: owning PrefabOrder.rework_order_count recomputed"
          - "cascade hop 2: owning PrefabOrder.releasable_status recomputed"
          - "cascade hop 3: Project.fabrication_locked recomputed"
      - from: REWORK
        to: SCRAPPED
        trigger: "PATCH /rework-jobs/{id}/status with a scrapping resolution"
        actor: ProjectManager
        preconditions:
          - "rework_job.status in {OPEN, IN_PROGRESS}"
          - "the component's rack capacity check permits removing it"
        side_effects:
          - "rework_job.status = RECUT_DEFERRED"
          - "prefab_component.install_status = SCRAPPED"
          - "cascade hop 1: rack_value_capacity_check recomputed for the owning Rack"
          - "cascade hop 2: project.pipeline_value_cents recomputed through project_pipeline_balance"
      - from: LOADED
        to: SET
        trigger: "PATCH /prefab-components/{id}/install-status"
        actor: InstallForeman
        preconditions:
          - "prefab_component.install_status == LOADED"
          - "project.project_posture != FROZEN"
          - "the component's zone has no pending disallowed predecessor activity under the written installation sequence agreement"
        side_effects:
          - "prefab_component.install_status = SET"
          - "cascade hop 1: project.completed_value_cents recomputed through project_pipeline_balance"
          - "cascade hop 2: Project.effective_flow_pct and Project.installed_pct recomputed"
          - "cascade hop 3: Project.project_posture recomputed through the ladder"
          - "compensating invariant: the field balance project.field_credit_balance is unchanged by the LOADED -> SET transition because credited_hours is a labour measure, not a value measure"

  - entity: ReworkJob
    initial_state: OPEN
    terminal_states: [CLOSED, RECUT_DEFERRED]
    transitions:
      - from: OPEN
        to: IN_PROGRESS
        trigger: "PATCH /rework-jobs/{id}/status"
        actor: ShopForeman
        preconditions:
          - "rework_job.status == OPEN"
          - "rework_job.reason_option_code is admissible for rework_job.reason_question_code"
        side_effects:
          - "rework_job.status = IN_PROGRESS"
      - from: IN_PROGRESS
        to: CLOSED
        trigger: "PATCH /rework-jobs/{id}/status"
        actor: ShopForeman
        preconditions:
          - "rework_job.status == IN_PROGRESS"
          - "rework_job.rework_hours > 0"
        side_effects:
          - "rework_job.status = CLOSED"
          - "owning PrefabComponent.install_status becomes FABRICATED"
          - "owning PrefabOrder.rework_order_count recomputed"
      - from: OPEN
        to: CLOSED
        trigger: "PATCH /rework-jobs/{id}/status (straight closure with zero rework hours)"
        actor: ShopForeman
        preconditions:
          - "rework_job.rework_hours == 0"
        side_effects:
          - "rework_job.status = CLOSED"
          - "owning PrefabComponent.install_status reverts to FABRICATED"
        note: "Zero-hour rework closes immediately; the no-op job is retained for audit."
      - from: IN_PROGRESS
        to: RECUT_DEFERRED
        trigger: "PATCH /rework-jobs/{id}/status with a scrapping resolution"
        actor: ProjectManager
        preconditions:
          - "rework_job.status == IN_PROGRESS"
        side_effects:
          - "rework_job.status = RECUT_DEFERRED"
          - "owning PrefabComponent.install_status = SCRAPPED"
          - "rack_value_capacity_check recomputed for the owning Rack"
      - from: CLOSED
        to: IN_PROGRESS
        trigger: "PATCH /rework-jobs/{id}/status (reopened rework)"
        actor: ProjectManager
        preconditions:
          - "rework_job.status == CLOSED"
          - "the owning PrefabComponent.install_status == FABRICATED"
        side_effects:
          - "rework_job.status = IN_PROGRESS"
          - "owning PrefabComponent.install_status = REWORK"
          - "cascade hop 1: owning PrefabOrder.rework_order_count recomputed"
          - "cascade hop 2: owning PrefabOrder.releasable_status recomputed"
        note: "Cyclic loop: a closed rework job may be reopened, which reverses its effect on the component."

  - entity: MaterialRelease
    initial_state: PLANNED
    terminal_states: [RECEIVED]
    transitions:
      - from: PLANNED
        to: RELEASED
        trigger: "POST /material-releases/{id}/declare"
        actor: ProcurementLead
        preconditions:
          - "material_release.status == PLANNED"
          - "material_release.commitment_mode in {PLANNED, CONFIRMED}"
          - "the declare instant is on or before material_release.planned_release_iso"
        side_effects:
          - "material_release.status = RELEASED; material_release.version incremented by 1"
          - "material_release.declared_for_procurement recomputed to true"
          - "material_release_timing recomputed; locked_release_iso frozen when a shop release has already occurred"
          - "cascade hop 1: for every PrefabOrder holding a component of this commodity, releasable_status recomputed"
          - "cascade hop 2: Project.fabrication_locked recomputed"
      - from: PLANNED
        to: RESTRICTED
        trigger: "POST /revisions (a design revision touching the released scope)"
        actor: ProjectManager
        preconditions:
          - "a Revision of the project names an artifact of an assembly whose components consume this commodity"
        side_effects:
          - "material_release.status = RESTRICTED; version incremented by 1"
          - "material_release.restriction_since_iso stamped"
          - "material_release_timing recomputed"
      - from: RESTRICTED
        to: RELEASED
        trigger: "POST /revisions/{id}/approve with a rejection resolution"
        actor: ProjectManager
        preconditions:
          - "material_release.status == RESTRICTED"
          - "the blocking Revision has reached REJECTED"
        side_effects:
          - "material_release.status = RELEASED; version incremented by 1"
          - "material_release.restriction_since_iso cleared to null"
        note: "Cyclic loop: a restricted release returns to the released state once the blocking revision is rejected; a later revision can restrict it again."
      - from: RELEASED
        to: SHIPPED
        trigger: "POST /material-releases/{id}/declare (vendor shipment acknowledgement)"
        actor: ProcurementLead
        preconditions:
          - "material_release.status == RELEASED"
        side_effects:
          - "material_release.status = SHIPPED; version incremented by 1"
      - from: SHIPPED
        to: RECEIVED
        trigger: "POST /material-releases/{id}/declare"
        actor: ProcurementLead
        preconditions:
          - "material_release.status == SHIPPED"
          - "the receiving instant is strictly after material_release.locked_release_iso"
        side_effects:
          - "material_release.status = RECEIVED; version incremented by 1"
          - "cascade hop 1: for every PrefabOrder holding a component of this commodity, releasable_status recomputed from MATERIAL_HOLD to READY"
          - "cascade hop 2: Project.fabrication_locked recomputed"
          - "compensating invariant: the released quantity ledger project.released_quantity is unchanged by receipt because quantity moves between pipeline buckets rather than into them"

  - entity: TradeActivity
    initial_state: PLANNED
    terminal_states: [COMPLETE]
    transitions:
      - from: PLANNED
        to: PERMITTED
        trigger: "PATCH /trade-activities/{id}/status"
        actor: GeneralForeman
        preconditions:
          - "trade_activity.permit_id is null OR the named permitting activity's status is COMPLETE"
          - "no activity with a lower written_sequence_index, the same work_front_code and a non-overlapping bay_code holds status in {PLANNED, PERMITTED, ACTIVE, DISALLOWED} with activity_kind in {MECHANICAL_ROUGH, PLUMBING_ROUGH, SPRINKLER_MAIN, DRYWALL_CLOSEOUT}"
        side_effects:
          - "trade_activity.status = PERMITTED"
          - "trade_activity.version incremented by 1"
      - from: PERMITTED
        to: ACTIVE
        trigger: "PATCH /trade-activities/{id}/status"
        actor: GeneralForeman
        preconditions:
          - "trade_activity.status == PERMITTED"
          - "every crew member dispatched to this activity holds home_jurisdiction_key equal to project.jurisdiction_key"
        side_effects:
          - "trade_activity.status = ACTIVE"
          - "trade_activity.actual_start_iso stamped"
          - "craft_hours_credit recomputed for the activity"
      - from: ACTIVE
        to: DISALLOWED
        trigger: "POST /crew-days/{id}/acknowledge (cascade) or PATCH /trade-activities/{id}/status"
        actor: GeneralForeman
        preconditions:
          - "trade_activity.status == ACTIVE"
          - "at least one crew member on this activity carries ComplianceLedger.excess_apprentice_hours > 0"
        side_effects:
          - "trade_activity.status = DISALLOWED"
          - "trade_activity.suspension_reason stamped with the apprenticeship ratio breach"
          - "cascade hop 1: owning Project.apprentice_breach_flag recomputed to true"
          - "cascade hop 2: Project.project_posture recomputed through the ladder"
      - from: DISALLOWED
        to: ACTIVE
        trigger: "POST /crew-days/{id}/acknowledge (cascade) or PATCH /trade-activities/{id}/status"
        actor: GeneralForeman
        preconditions:
          - "every crew member assigned to this activity has ComplianceLedger.excess_apprentice_hours == 0"
          - "the ratio was brought back inside the cap by later crew-day acknowledgments on the same activity"
        side_effects:
          - "trade_activity.status = ACTIVE"
          - "trade_activity.suspension_reason cleared to null"
          - "cascade hop 1: owning Project.apprentice_breach_flag recomputed"
          - "cascade hop 2: Project.project_posture recomputed"
        note: "Cyclic loop: a disallowed activity resumes once later crew-day acknowledgments bring the apprentice ratio back inside the cap."
      - from: ACTIVE
        to: COMPLETE
        trigger: "PATCH /trade-activities/{id}/status"
        actor: GeneralForeman
        preconditions:
          - "trade_activity.status == ACTIVE"
          - "no crew member assigned to this activity carries excess_apprentice_hours > 0"
        side_effects:
          - "trade_activity.status = COMPLETE"
          - "productivity_actuals recomputed for the owning project"
          - "cascade hop 1: Project.slippage_pct, critical span and shortfall recomputed without this activity's duration"
          - "cascade hop 2: Project.project_posture recomputed through the ladder"

  - entity: Revision
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /revisions"
        actor: ProjectManager
        preconditions:
          - "revision.status == DRAFT"
          - "revision.revised_version_id names a ModelVersion whose zone_quantity_total >= 1"
          - "every entry of revision.impact_keys resolves to a declared artifact"
        side_effects:
          - "revision.status = SUBMITTED"
          - "revision.engineering_hold recomputed to true"
          - "cascade hop 1: every MaterialRelease consuming an affected assembly's commodity has status set RESTRICTED"
          - "cascade hop 2: material_release_timing recomputed for those releases"
          - "cascade hop 3: for every PrefabOrder holding an affected component, releasable_status recomputed to ENGINEERING_HOLD"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /revisions/{id}/approve"
        actor: ProjectManager
        preconditions:
          - "revision.status == SUBMITTED"
          - "no other APPROVED Revision already targets the same model_version_id"
          - "revision.safety_gate_status != BLOCKED"
        side_effects:
          - "revision.status = APPROVED; revision.version incremented by 1"
          - "revision.engineering_hold recomputed to false"
          - "revision.approved_change_value_cents computed from revision_cost_impact variant (b)"
          - "cascade hop 1: the target ModelVersion.status becomes SUPERSEDED"
          - "cascade hop 2: for each naming RevisionImpact, the affected PrefabComponent with install_status FABRICATED becomes REWORK and a ReworkJob OPEN row is created"
          - "cascade hop 3: owning PrefabOrder.rework_order_count recomputed and releasable_status recomputed"
          - "cascade hop 4: Project.project_posture recomputed through the ladder"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /revisions/{id}/approve (rejection resolution)"
        actor: ProjectManager
        preconditions:
          - "revision.status == SUBMITTED"
          - "the rejection carries a written resolution"
        side_effects:
          - "revision.status = REJECTED"
          - "revision.engineering_hold recomputed to false"
          - "cascade hop 1: every MaterialRelease restricted by this revision returns to RELEASED"
          - "cascade hop 2: for every PrefabOrder holding an affected component, releasable_status recomputed from ENGINEERING_HOLD back to READY"
      - from: REJECTED
        to: DRAFT
        trigger: "POST /revisions (re-drafted revision)"
        actor: ProjectManager
        preconditions:
          - "revision.status == REJECTED"
          - "the re-drafted revision carries a revised impact_keys array"
        side_effects:
          - "revision.status = DRAFT"
          - "revision.impact_values cleared and recomputed on the next submit"
        note: "Cyclic loop: a rejected revision can be re-drafted and resubmitted without creating a new Revision row."

concurrency_rules:
  - rule_id: prefab-order-release-stale-order-version
    parent_entity: PrefabOrder
    write_endpoint: "POST /prefab-orders/{id}/release"
    occ_field: "expected_prefab_order_version"
    description: |
      Releasing a PrefabOrder against a work package whose version has advanced since
      the client last observed it is rejected. This captures the case where another
      writer has already moved the order - a prior release, a fabrication-status
      change, or a rework cascade from an approved Revision - so the client's view of
      the order is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: material-release-declare-stale-project-version
    parent_entity: Project
    write_endpoint: "POST /material-releases/{id}/declare"
    occ_field: "expected_project_version"
    description: |
      Declaring a MaterialRelease against a project whose version has advanced since
      the client last observed it is rejected; the project's posture may have moved to
      HOLD or FROZEN in the meantime, so the client's release decision is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: crew-day-acknowledge-stale-crew-day-version
    parent_entity: CrewDay
    write_endpoint: "POST /crew-days/{id}/acknowledge"
    occ_field: "expected_crew_day_version"
    description: |
      Acknowledging a foreman's CrewDay against a row whose version has advanced since
      the client last observed it is rejected; another writer has already acknowledged
      this same report, so the hours view the client acted on is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: revision-approve-stale-model-version
    parent_entity: ModelVersion
    write_endpoint: "POST /revisions/{id}/approve"
    occ_field: "expected_model_version_version"
    description: |
      Approving a Revision against a ModelVersion whose version has advanced since the
      client last observed it is rejected; the model version is already superseded by a
      prior approved revision, so the client's approval target is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

calculations:
  - name: project_posture_derivation
    trigger: "POST /projects/{id}/posture/recompute, and as a side effect of any PrefabOrder or PrefabComponent transition that changes Project.completed_value_cents"
    algorithm: derived_field_reconciliation
    formula: |
      critical_path_span_days = sum(activity.planned_duration_days
                                    for activity in project.activities
                                    where activity.status != COMPLETE)
      critical_path_shortfall_days = sum(max(0, days(current_logical_clock_utc - activity.planned_start_iso - activity.planned_duration_days))
                                         for activity in project.activities
                                         where activity.status != COMPLETE)
      slippage_pct = round_half_up(abs(critical_path_shortfall_days) / critical_path_span_days, 4) if critical_path_span_days > 0 else 0.0
      # five-tier ladder, applied descending; each tier uses the <= test so boundary equality belongs to the lower tier
      if slippage_pct <= project.posture_thresholds.SLIP_RELEASE_AT:      project_posture = ON_TRACK
      elif slippage_pct <= project.posture_thresholds.SLIP_RECOVERY_AT:   project_posture = RELEASE_PENDING
      elif slippage_pct <= project.posture_thresholds.SLIP_HOLD_AT:       project_posture = RECOVERY_MODE
      elif slippage_pct <= project.posture_thresholds.SLIP_FREEZE_AT:     project_posture = HOLD
      else:                                                               project_posture = FROZEN
      project.apprentice_breach_flag = any(row.excess_apprentice_hours > 0 for row in project.compliance_ledger)
    input_set: "TradeActivity rows of the project with status IN {PLANNED, PERMITTED, ACTIVE, DISALLOWED}; rows with status COMPLETE are excluded from both the span and the shortfall. A project with zero non-COMPLETE activities has slippage_pct 0.0 and posture ON_TRACK."
    constants:
      SLIP_RELEASE_AT: 0.02
      SLIP_RECOVERY_AT: 0.05
      SLIP_HOLD_AT: 0.10
      SLIP_FREEZE_AT: 0.15
      ROUNDING: round_half_up
      TIER_ASSIGNMENT: "descending ladder; the <= test assigns boundary equality to the higher tier"
    precision: "4 decimal places, round_half_up"
  - name: revision_cost_impact
    trigger: "POST /revisions/{id}/approve; recomputed on read by GET /revisions/{id}/summary"
    algorithm: forward_looking
    formula: |
      engineering_hours = round_half_up(revision.impact_qualified_hours * revision.revision_quantity / REVISION_SCOPE_DIVISOR, 2)
      # variant (a) memo value - the shop rework ceiling for the same engineering hours
      rework_value_cents = min(engineering_hours * revision.kludge_rate_per_hour_cents, revision.direct_shop_cost_cents)
      # variant (b) memo value - the change order submitted to the owner, negotiated rate plus markup throughout
      negotiated_value_cents = round_half_up(engineering_hours * revision.negotiated_rate_per_hour_cents
                                             * (1 + revision.submitted_markup_pct), 0)
      revision.impact_values = [{"impact_key": key, "rework_value_cents": rework_value_cents,
                                 "negotiated_value_cents": negotiated_value_cents} for key in revision.impact_keys]
      revision.approved_change_value_cents = sum(entry["negotiated_value_cents"] for entry in revision.impact_values) if revision.status == APPROVED else 0
    input_set: "Every entry of revision.impact_keys is priced once; an impact whose component has already been scrapped is still priced, but its ReworkJob is opened with status RECUT_DEFERRED."
    constants:
      REVISION_SCOPE_DIVISOR: 4
      KLUDGE_RATE_PER_HOUR_CENTS: 8500
      NEGOTIATED_RATE_PER_HOUR_CENTS: 7800
      SUBMITTED_MARKUP_PCT: 0.18
      ROUNDING: round_half_up
    precision: "0 decimal places (whole cents), round_half_up; variant (a) is capped by min() against direct_shop_cost_cents and is NOT rounded"
    variants:
      - name: memo_rework_ceiling
        when: "internal shop planning and the ReworkJob queued when a fabricated component is affected"
        difference: "uses KLUDGE_RATE_PER_HOUR_CENTS (8500) and is capped by direct_shop_cost_cents via min(); it never rounds and never adds markup"
      - name: negotiated_change_order
        when: "the change order submitted to the owner at Revision approval"
        difference: "uses NEGOTIATED_RATE_PER_HOUR_CENTS (7800) and multiplies by (1 + SUBMITTED_MARKUP_PCT), then rounds to whole cents; it is not capped by direct_shop_cost_cents, so it can exceed the memo value"
  - name: field_credit_policy
    trigger: "POST /crew-days/{id}/acknowledge for each CrewDay reported on the same work_date"
    algorithm: chronological
    formula: |
      # Two valid policies over the same reported hours. The variant is selected from
      # Project.credit_policy (input enum FIRST_ACCEPTED | HIGHEST_TOTAL).
      candidates = CrewDay rows for (project_id, worker_id, work_date_iso) with report_sequence >= 1
      if project.credit_policy == FIRST_ACCEPTED:
          winning = candidates ordered by report_sequence ASC, tie-break created_at ASC
      else:
          winning = candidates ordered by (regular_hours + OVERTIME_MULTIPLIER * overtime_hours) DESC, tie-break report_sequence ASC
      accepted_for_credit = true on winning only
      credited_hours = (winning.regular_hours + OVERTIME_MULTIPLIER * winning.overtime_hours) if winning.accepted_for_credit else 0
    input_set: "The single winning CrewDay row per (project_id, worker_id, work_date_iso); every non-winning row for that key has credited_hours = 0 and accepted_for_credit = false."
    constants:
      OVERTIME_MULTIPLIER: 1.5
      DEFAULT_CREDIT_POLICY: FIRST_ACCEPTED
      ROUNDING: round_half_up
    precision: "2 decimal places, round_half_up"
    variants:
      - name: first_accepted_report
        when: "project.credit_policy == FIRST_ACCEPTED"
        difference: "the earliest report_sequence wins even when a later report claims more hours; the later report is retained but credited 0"
      - name: highest_total_hours
        when: "project.credit_policy == HIGHEST_TOTAL"
        difference: "the report with the largest (regular_hours + 1.5 x overtime_hours) wins, tie-broken by the smaller report_sequence; a mid-day re-report with more hours flips the winner"
  - name: conduit_craft_hours
    trigger: "POST /takeoff-lines and recomputed on read by GET /models/{model_version_id}/takeoff-lines"
    algorithm: combinatorial
    formula: |
      assembly = Assembly[takeoff_line.assembly_code]
      run_factor = assembly.conduit_labor_factors[takeoff_line.conduit_run_type]
      chain_penalty = CHAIN_PENALTY[PrefabOrder.chain_mode of the consuming order] if a consuming component exists else 1.0
      base_hours = takeoff_line.quantity * prefab_hours_per_unit(assembly, takeoff_line.assembly_code)
      crafted_hours = base_hours * run_factor * chain_penalty
      # prefab_hours_per_unit(assembly, code) = assembly.prefab_hours_per_unit when the code is a member of the
      # assembly's ideal_conduit_type_codes, otherwise assembly.prefab_hours_per_unit * SUPPORTED_DERATE
    input_set: "TakeoffLine rows with status EXTRACTED; SUPERSEDED lines contribute 0 because they were re-taken against the successor model version."
    constants:
      CHAIN_PENALTY: {"CHAIN_DEPENDENT": 1.2, "PARALLEL_FABRICATION": 1.0}
      SUPPORTED_DERATE: 1.0
      ROUNDING: round_half_up
    precision: "2 decimal places, round_half_up; the per-unit hours are rounded before the quantity multiply, and the product is rounded per line"
  - name: hoisting_window_derivation
    trigger: "POST /prefab-orders/{id}/release; frozen while prefab_order.fabricate_status is RELEASED or later"
    algorithm: combinatorial
    formula: |
      clash_slots  = STAGE_WINDOW[order.stage_code].clash_slots
      trade_count  = STAGE_WINDOW[order.stage_code].trade_count
      chain_depth  = count of the order's PrefabComponent rows whose predecessor_component_id is not null
                     and whose predecessor's install_status != SET
      productivity_penalty = 0 if project.installed_pct >= INSTALL_PRODUCTIVITY_FLOOR else 1
      capacity_multiplier  = first SHOP_CAPACITY_LADDER row whose shop_utilisation_pct_max is null
                             or project.shop_utilization_pct <= that row's shop_utilisation_pct_max
      base_days = ceil((clash_slots + trade_count + chain_depth + productivity_penalty) * capacity_multiplier)
      hoisting_duration_days = max(MIN_HOISTING_DAYS, min(base_days, MAX_HOISTING_DAYS))
      hoisting_start_iso = cc_shift_days(project.power_on_iso, -(base_days + ceil(order.assembly_count * RACK_STAGING_DURATION_FACTOR)))
      hoisting_end_iso   = cc_shift_days(hoisting_start_iso, hoisting_duration_days)
    input_set: "PrefabOrder rows with fabricate_status in {PLANNED, RELEASED, IN_FABRICATION, FABRICATED}; chain_depth counts only components whose predecessor's install_status is not SET."
    constants:
      STAGE_WINDOW: {"FIRST_STAGE": {"clash_slots": 4, "trade_count": 2}, "SECOND_STAGE": {"clash_slots": 3, "trade_count": 1}, "TRIM_OUT": {"clash_slots": 2, "trade_count": 0}}
      SHOP_CAPACITY_LADDER: [{"shop_utilisation_pct_max": 0.85, "multiplier": 1.0}, {"shop_utilisation_pct_max": 1.00, "multiplier": 1.2}, {"shop_utilisation_pct_max": null, "multiplier": 1.5}]
      RACK_STAGING_DURATION_FACTOR: 3
      INSTALL_PRODUCTIVITY_FLOOR: 0.40
      MIN_HOISTING_DAYS: 1
      MAX_HOISTING_DAYS: 10
      CLOCK_SHIFT: "cc_shift_days(d, n) = d + n days; a negative n shifts earlier"
      ROUNDING: ceil to whole days
    precision: "whole days; each term is ceil-rounded before the capacity multiplier is applied, then the result is clamped to [1, 10]"
  - name: rack_value_capacity_check
    trigger: "POST /rework-jobs (rack assignment) and recomputed after every ReworkJob transition and every PrefabComponent install_status change"
    algorithm: aggregation
    formula: |
      rack.reserved_streams_and_phase_cf = sum(component.quantity
                                              for component in PrefabComponent rows assigned to rack
                                              where component.install_status in {PLANNED, FABRICATED, LOADED, REWORK, SCRAPPED})
      capacity_ok = rack.reserved_streams_and_phase_cf <= RACK_CAPACITY_MARGIN * rack.value_capacity_cf
      # the check is inclusive at the margin: equality passes, one hundredth of a cubic foot above fails
    input_set: "PrefabComponent rows on the rack whose install_status is in {PLANNED, FABRICATED, LOADED, REWORK, SCRAPPED}; rows with install_status SET or with null rack_id are excluded."
    constants:
      RACK_CAPACITY_MARGIN: 0.95
      ROUNDING: round_half_up
    precision: "4 decimal places, round_half_up"
  - name: ratio_limit_resolution
    trigger: "POST /crew-days/{id}/acknowledge, and recomputed whenever TradeActivity.status changes"
    algorithm: tiered_pricing
    formula: |
      rate_row = first TradeContractRate row where jurisdiction_key == project.jurisdiction_key
                 and effective_from_iso <= crew_day.work_date_iso
                 ordered by effective_from_iso DESC, tie-break created_at ASC
      ratio_limit      = rate_row.apprentice_ratio_max if rate_row exists else APPRENTICE_TIER_DEFAULT[RING_BAND(worker.apprentice_period)]
      wait_ratio_limit = rate_row.wait_ratio_max       if rate_row exists else WAIT_TIER_DEFAULT[RING_BAND(worker.apprentice_period)]
      # the row is placed in the band whose default is honoured; the project-wide cap is the smaller of the two
      project.apprentice_ratio_max = min(ratio_limit, wait_ratio_limit)
    input_set: "TradeContractRate rows effective at or before the work_date_iso; rows with a later effective_from_iso are excluded."
    constants:
      APPRENTICE_TIER_DEFAULT: {"APPRENTICE_PERIODS_1_2": 1.0, "APPRENTICE_PERIODS_3_4": 0.5, "APPRENTICE_PERIOD_5": 0.5}
      WAIT_TIER_DEFAULT: {"APPRENTICE_PERIODS_1_2": 1.0, "APPRENTICE_PERIODS_3_4": 0.5, "APPRENTICE_PERIOD_5": 0.5}
      RING_BAND: "apprentice_period in {1,2} -> APPRENTICE_PERIODS_1_2; in {3,4} -> APPRENTICE_PERIODS_3_4; == 5 -> APPRENTICE_PERIOD_5"
      ROUNDING: round_half_up
    precision: "2 decimal places, round_half_up"
  - name: material_release_timing
    trigger: "POST /material-releases/{id}/declare and POST /prefab-orders/{id}/release (which freezes locked_release_iso)"
    algorithm: constraint_propagation
    formula: |
      # Evaluation order is pinned so the circular-looking dependency is well defined:
      # (1) the anchor is the literal project.power_on_iso, never a value derived from planned_release_iso;
      # (2) locked_release_iso freezes at the earliest affected shop release;
      # (3) the OCC field expected_project_version gates the declare call before any of this runs.
      required_on_site_iso = cc_shift_days(project.power_on_iso, -APPLIANCE_LAG[release.material_commodity].travel_days)
      lead_days            = release.lead_time_days
      planned_delivery_iso = cc_shift_days(required_on_site_iso, -(lead_days + APPLIANCE_LAG[release.material_commodity].unload_days))
      planned_release_iso  = cc_shift_days(planned_delivery_iso, -DEFAULT_SHOP_TAT_DAYS)
      locked_release_iso   = min(planned_release_iso, earliest release_to_shop_iso among the project's PrefabOrders)
      release.priced_hours = release.quantity * release.lead_time_days
    input_set: "MaterialRelease rows of the project with status IN {PLANNED, RELEASED}; rows already RECEIVED are excluded from re-derivation."
    constants:
      APPLIANCE_LAG: {"SWITCHGEAR": {"travel_days": 2, "unload_days": 2}, "MC_CABLE": {"travel_days": 1, "unload_days": 1}, "EMT_CONDUIT": {"travel_days": 1, "unload_days": 1}, "RIGID_CONDUIT": {"travel_days": 1, "unload_days": 1}, "STRUT": {"travel_days": 1, "unload_days": 1}, "FITTINGS": {"travel_days": 1, "unload_days": 1}, "WIRE": {"travel_days": 1, "unload_days": 1}, "BOX": {"travel_days": 1, "unload_days": 1}}
      DEFAULT_SHOP_TAT_DAYS: 2
      ROUNDING: ceil to whole days
    precision: "whole days; each offset is applied with cc_shift_days and ceil-rounded"
  - name: gross_payroll_reconciliation
    trigger: "POST /crew-days/{id}/acknowledge; recomputed on read by GET /projects/{id}/compliance-ledger"
    algorithm: aggregation
    formula: |
      labor_cost_cents = round_half_up((crew_day.regular_hours + OVERTIME_MULTIPLIER * crew_day.overtime_hours)
                                       * rate_for(crew_day.worker_id).hourly_rate_cents
                                       * (1 + rate_for(crew_day.worker_id).burden_pct), 0)
      adjusted_value_cents = round_half_up((crew_day.regular_hours + OVERTIME_MULTIPLIER * crew_day.overtime_hours)
                                           * rate_for_guilt(crew_day.worker_id).hourly_rate_cents
                                           * (1 + rate_for_guilt(crew_day.worker_id).burden_pct), 0)
      ledger.total_cents = sum(crew_day.labor_cost_cents for crew_day in the ledger row's accepted crew days)
      ledger.gross_payroll_cents = sum(crew_day.labor_cost_cents for crew_day in the ledger row's crew days)
      ledger.adjusted_payroll_cents = sum(crew_day.adjusted_value_cents for crew_day in the ledger row's crew days)
    input_set: "CrewDay rows of the ledger row's (worker_id, trade_activity_id) pair; rows with accepted_for_credit = false are excluded from total_cents but included in gross_payroll_cents."
    constants:
      OVERTIME_MULTIPLIER: 1.5
      ROUNDING: round_half_up
    precision: "0 decimal places (whole cents), round_half_up; each crew day is rounded before the sum, so per-day rounding never accumulates past the sum"
    variants:
      - name: straight_time_value
        when: "the ledger row is priced at the worker's straight-time rate"
        difference: "uses rate_for(worker) which resolves the classification row for the crew day's own worker"
      - name: guilt_added_value
        when: "the ledger row's craft hours are re-priced at the guilt-added rate after an acknowledgment"
        difference: "uses rate_for_guilt(worker) which resolves the JOURNEYMAN row of the project jurisdiction, so adjusted_value_cents differs from labor_cost_cents on the identical row"
  - name: conduit_run_impact
    trigger: "POST /takeoff-lines and POST /revisions/{id}/approve"
    algorithm: tiered_pricing
    formula: |
      run_factor   = assembly.conduit_labor_factors[takeoff_line.conduit_run_type]
      depth        = TAKEOFF_DEPTH_LADDER[first row whose depth_max is null or run_depth <= depth_max]
      billed_hours = takeoff_line.quantity * assembly.prefab_hours_per_unit * run_factor * depth.multiplier
      if takeoff_line status is SUPERSEDED (a revision named its takeoff hash):
          billed_hours = 0
          revision.tied_shipment_hours = sum(component.crafted_hours for component in the superseded line's SET components)
          revision.shipment_tied_flag = revision.tied_shipment_hours > 0
    input_set: "TakeoffLine rows with status IN {EXTRACTED, SUPERSEDED}; a SUPERSEDED line bills 0 and routes its installed content to tied_shipment_hours instead."
    constants:
      TAKEOFF_DEPTH_LADDER: [{"depth_max": 1, "multiplier": 1.0}, {"depth_max": 3, "multiplier": 1.15}, {"depth_max": null, "multiplier": 1.35}]
      ROUNDING: round_half_up
    precision: "2 decimal places, round_half_up; the depth multiplier is applied before the per-line rounding"
  - name: project_pipeline_balance
    trigger: "every PrefabComponent install_status change and every PrefabOrder release or delivery"
    algorithm: aggregation
    formula: |
      job_scope_blend = 1.0
      crafted_hours = component.quantity * Assembly[component.assembly_code].prefab_hours_per_unit * job_scope_blend
      component.prefab_value_cents = crafted_hours * rate_for(project.jurisdiction_key, "JOURNEYMAN").hourly_rate_cents
                                     * (1 + rate_for(project.jurisdiction_key, "JOURNEYMAN").burden_pct)
      project.pipeline_value_cents  = sum(component.prefab_value_cents for component in project.components
                                          where component.install_status in {PLANNED, FABRICATED, LOADED, REWORK})
      project.completed_value_cents = sum(component.prefab_value_cents for component in project.components
                                          where component.install_status == SET)
      project.installed_pct = round_half_up(project.completed_value_cents
                                            / (project.pipeline_value_cents + project.completed_value_cents), 4) if (project.pipeline_value_cents + project.completed_value_cents) > 0 else 0.0
      project.effective_flow_pct = (round(project.man_hours_total * FACTOR_TABLE[project.installed_pct >= INSTALL_PRODUCTIVITY_FLOOR]) / max(project.man_hours_total, 1))
      project.man_hours_total = sum(component.crafted_hours for component in project.components)
    input_set: "All PrefabComponent rows of the project; rows with install_status SCRAPPED are counted in neither balance, while rows whose order was cancelled plus their rack assignments contribute 0."
    constants:
      VALUE_CLASSIFICATION: "JOURNEYMAN"
      FACTOR_TABLE: {"true": 11, "false": 16}
      INSTALL_PRODUCTIVITY_FLOOR: 0.40
      ROUNDING: round_half_up
    precision: "0 decimal places (whole cents) for the value balances, 4 decimal places for installed_pct"
  - name: craft_hours_credit
    trigger: "POST /prefab-orders/{id}/release and every subsequent PrefabComponent install_status change"
    algorithm: waterfall_allocation
    formula: |
      expected_released_hours = project.man_hours_total * (project.released_quantity / project.total_quantity)
      discrete_released_hours = sum(component.crafted_hours for component in released components)
      shortfall_hours = max(0, expected_released_hours - discrete_released_hours)
      # the credit is pro-rated by the released quantity, not by the discrete component list
      project.craft_hours_credit = max(0, project.man_hours_total - expected_released_hours)
      order.craft_hours_credit = max(0, order.crafted_hours_total * (1 - order.release_to_shop_iso is not null))
    input_set: "PrefabComponent rows of the project whose install_status is not SCRAPPED; the released quantity is read from the project rollup, and a project with total_quantity 0 has expected_released_hours 0."
    constants:
      RELEASE_ANY_MODEL_MODE: false
      ROUNDING: round_half_up
    precision: "2 decimal places, round_half_up"
    variants:
      - name: pro_rated_release_credit
        when: "project.release_any_model_mode is false and the release is measured against the project rollup"
        difference: "credits project.man_hours_total x (1 - released_quantity / total_quantity), so the credit falls as the released quantity rises and is floored at 0"
      - name: discrete_release_credit
        when: "the release is measured against the discrete component list of the order"
        difference: "credits the sum of the released components' crafted_hours and reports shortfall_hours separately, so the two variants disagree for identical data by exactly shortfall_hours"
  - name: craft_hours_balance
    trigger: "POST /prefab-orders/{id}/ressue, POST /prefab-orders/{id}/cancel and PATCH /prefab-orders/{id}/delivery-status; recomputed on read by GET /projects/{id}"
    algorithm: aggregation
    formula: |
      # Conserved quantity: money already committed to shop and field craft on this project.
      # A forward action paired with its compensating action leaves this balance unchanged,
      # provided the same content is re-credited to the pipeline balance.
      base_labor_cents    = round_half_up(project.man_hours_total * rate_for(project.jurisdiction_key, "JOURNEYMAN").hourly_rate_cents, 0)
      base_material_cents = round_half_up(sum(component.crafted_hours for component in project.components)
                                          * rate_for(project.jurisdiction_key, "JOURNEYMAN").hourly_rate_cents, 0)
      released_labor_cents   = round_half_up(project.released_quantity * rate_for(project.jurisdiction_key, "JOURNEYMAN").hourly_rate_cents, 0)
      reinstated_labor_cents = round_half_up(project.released_quantity * rate_for(project.jurisdiction_key, "JOURNEYMAN").hourly_rate_cents, 0)
      project.craft_hours_balance = base_labor_cents + base_material_cents
      # ressue moves released_labor_cents out of the released balance and reinstated_labor_cents back in;
      # both are the same expression over the same released_quantity, so the net movement is exactly 0
    input_set: "All PrefabComponent rows of the project whose install_status is not SCRAPPED; project.released_quantity is read at the release instant and again at the revert instant."
    constants:
      BALANCE_SCOPE: "LABOR_PLUS_MATERIAL"
      ROUNDING: round_half_up
    precision: "0 decimal places (whole cents), round_half_up; every term is rounded before the sum so the two compensation terms cancel exactly"
  - name: idle_capacity_writeoff
    trigger: "recomputed on read by GET /projects/{id}/summary and on every posture recompute"
    algorithm: weighted_scoring
    formula: |
      weight = IDLE_WEIGHT_LADDER[first row whose weight_floor_pct is null or project.shop_utilization_pct <= weight_floor_pct]
      project.idle_capacity_cents = round_half_up(project.man_hours_total
                                                  * rate_for(project.jurisdiction_key, "JOURNEYMAN").hourly_rate_cents
                                                  * weight.multiplier
                                                  * (1 - project.installed_pct), 0)
    input_set: "All PrefabComponent rows of the project; a project with man_hours_total 0 has idle_capacity_cents 0."
    constants:
      IDLE_WEIGHT_LADDER: [{"weight_floor_pct": 0.70, "multiplier": 0.85}, {"weight_floor_pct": 0.85, "multiplier": 0.75}, {"weight_floor_pct": null, "multiplier": 0.60}]
      ROUNDING: round_half_up
    precision: "0 decimal places (whole cents), round_half_up"
  - name: apprentice_upgrade_projection
    trigger: "computed on read by GET /workers/roster-summary whenever ring hours are requested"
    algorithm: decay_function
    formula: |
      raw_hours = sum(crew_day.credited_hours for crew_day in worker.crew_days if crew_day.accepted_for_credit)
      journey_ring_claim_hours = round_half_up(raw_hours, 2)
      upgrade_eligible = journey_ring_claim_hours > APPLICABLE_CONTRACT_HOURS
    input_set: "CrewDay rows of the worker with accepted_for_credit = true; rows with accepted_for_credit = false contribute 0 ring hours."
    constants:
      APPLICABLE_CONTRACT_HOURS: 8000.0
      ROUNDING: round_half_up
    precision: "2 decimal places, round_half_up"
  - name: productivity_actuals
    trigger: "recomputed whenever TradeActivity.status becomes COMPLETE or a CrewDay is acknowledged"
    algorithm: weighted_scoring
    formula: |
      earned_hours = sum(component.crafted_hours for component in project.components where component.install_status == SET)
      actual_hours = sum(crew_day.credited_hours for crew_day in project.crew_days
                         where crew_day.trade_activity.status == COMPLETE)
      productivity_pct = round_half_up(earned_hours / actual_hours, 4) if actual_hours > 0 else 0.0
    input_set: "CrewDay rows with accepted_for_credit = true on activities whose status is COMPLETE; disallowed apprentice hours are already absent because such rows carry credited_hours = 0."
    constants:
      ROUNDING: round_half_up
    precision: "4 decimal places, round_half_up"

validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present and the role is one of the roles declared in §1.7."
    error_id: ERR_UNAUTHORIZED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "the acting role is permitted for this operation per §1.7 exclusive_operations and shared_operations."
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "the Project named in the path or body exists."
    error_id: ERR_PROJECT_NOT_FOUND
    http_status: 404
    applies_to: "POST /takeoff-lines, GET /projects/{id}, POST /prefab-orders, POST /trade-activities, POST /crew-days, POST /material-releases, POST /revisions"
  - priority: 4
    category: existence
    check: "the ModelVersion named in the path or body exists."
    error_id: ERR_MODEL_VERSION_NOT_FOUND
    http_status: 404
    applies_to: "POST /model-versions/{id}/coordinate, POST /takeoff-lines, POST /racks, POST /prefab-orders, POST /revisions, POST /material-releases"
  - priority: 5
    category: existence
    check: "the PrefabOrder named in the path exists."
    error_id: ERR_PREFAB_ORDER_NOT_FOUND
    http_status: 404
    applies_to: "POST /prefab-orders/{id}/release, PATCH /prefab-orders/{id}/fabrication-status, POST /prefab-orders/{id}/ressue, POST /prefab-orders/{id}/cancel, PATCH /prefab-orders/{id}/delivery-status, PATCH /prefab-orders/{id}/delivery-status, PATCH /prefab-orders/{id}/delivery-status"
  - priority: 6
    category: existence
    check: "every other referenced entity id (Worker, TradeActivity, CrewDay, Rack, TakeoffLine, RevisionImpact) exists."
    error_id: ERR_REFERENCED_ENTITY_NOT_FOUND
    http_status: 404
    applies_to: "POST /takeoff-lines, POST /workers, PATCH /prefab-components/{id}/install-status, POST /crew-days, POST /crew-days/{id}/acknowledge, POST /trade-activities, PATCH /trade-activities/{id}/status, POST /material-releases, POST /revisions"
  - priority: 7
    category: existence
    check: "every entry of impact_keys resolves to a declared artifact for its affected kind (a TakeoffLine.takeoff_hash, a PrefabComponent code, or a Rack.rack_code)."
    error_id: ERR_AFFECTED_REF_NOT_FOUND
    http_status: 404
    applies_to: "POST /revisions, POST /revisions/{id}/approve, PATCH /rework-jobs/{id}/status"
  - priority: 8
    category: state
    check: "the OCC field expected_<parent>_version equals the parent entity's current version; a stale value is rejected before any business rule is evaluated."
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /prefab-orders/{id}/release, POST /material-releases/{id}/declare, POST /crew-days/{id}/acknowledge, POST /revisions/{id}/approve"
  - priority: 9
    category: state
    check: "the target entity is in the from-state its transaction requires (fabricate_status, deliver_status, shipment_status, PrefabComponent.install_status, ReworkJob.status, Revision.status, TradeActivity.status, MaterialRelease.status, ModelVersion.status)."
    error_id: ERR_INVALID_PREFAB_TRANSITION
    http_status: 409
    applies_to: "POST /model-versions/{id}/coordinate, POST /prefab-orders/{id}/release, PATCH /prefab-orders/{id}/fabrication-status, POST /prefab-orders/{id}/ressue, POST /prefab-orders/{id}/cancel, PATCH /prefab-orders/{id}/delivery-status, PATCH /prefab-orders/{id}/delivery-status, PATCH /prefab-orders/{id}/delivery-status, PATCH /prefab-components/{id}/install-status, PATCH /rework-jobs/{id}/status, PATCH /trade-activities/{id}/status, POST /crew-days/{id}/acknowledge, POST /material-releases/{id}/declare, POST /revisions, POST /revisions/{id}/approve"
  - priority: 10
    category: state
    check: "no RevisionImpact of a non-terminal Revision names an artifact of this PrefabOrder's assembly set, i.e. PrefabOrder.releasable_status != ENGINEERING_HOLD."
    error_id: ERR_ENGINEERING_HOLD_ACTIVE
    http_status: 409
    applies_to: "POST /prefab-orders/{id}/release, PATCH /prefab-components/{id}/install-status, PATCH /prefab-orders/{id}/delivery-status"
  - priority: 11
    category: business_referential
    check: "the PrefabOrder's release gate is MATERIAL_HOLD: a member of Project.material_gate_commodities has no MaterialRelease in the declared-for-procurement state."
    error_id: ERR_MATERIAL_HOLD_ACTIVE
    http_status: 409
    applies_to: "POST /prefab-orders/{id}/release, PATCH /prefab-orders/{id}/delivery-status"
  - priority: 12
    category: business_safety
    check: "the requested work front is not blocked by the written installation sequence agreement: no TradeActivity with a lower written_sequence_index, the same work_front_code and a non-overlapping bay_code holds status in {PLANNED, PERMITTED, ACTIVE, DISALLOWED} with activity_kind in {MECHANICAL_ROUGH, PLUMBING_ROUGH, SPRINKLER_MAIN, DRYWALL_CLOSEOUT}."
    error_id: ERR_INSTALL_SEQUENCE_VIOLATION
    http_status: 409
    applies_to: "POST /trade-activities, PATCH /trade-activities/{id}/status, PATCH /prefab-components/{id}/install-status"
  - priority: 13
    category: business_safety
    check: "the apprentice hours currently implied by the project's non-voided CrewDay rows, summed per project and classification, plus this row's apprentice hours do not exceed ratio_limit x journeyman hours; the limit may never be waived."
    error_id: ERR_APPRENTICE_RATIO_EXCEEDED
    http_status: 409
    applies_to: "POST /crew-days, POST /crew-days/{id}/acknowledge, POST /trade-contract-rates"
  - priority: 14
    category: business_temporal
    check: "the proposed hoisting window [hoisting_start_iso, hoisting_end_iso) overlaps no frozen hoisting window of the same hoisting_window_id, and no more than one non-terminal PrefabOrder of the project shares a hoisting_start_iso date."
    error_id: ERR_HOISTING_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /prefab-orders/{id}/release, POST /prefab-orders"
  - priority: 15
    category: business_constraint
    check: "a laydown slot at index 1..Project.laydown_slots is free when excluding the window [release instant, delivery instant) of every other non-terminal PrefabOrder of the project, release instant inclusive and delivery instant exclusive."
    error_id: ERR_LAYDOWN_SLOT_UNAVAILABLE
    http_status: 409
    applies_to: "POST /prefab-orders/{id}/release"
  - priority: 16
    category: business_safety
    check: "every worker dispatched to the project's next work front has home_jurisdiction_key equal to project.jurisdiction_key and an apprentice_period inside the band recorded for that worker; an unknown band is rejected."
    error_id: ERR_JURISDICTION_DISPATCH_BAND
    http_status: 422
    applies_to: "POST /workers, POST /crew-days"
  - priority: 17
    category: business_constraint
    check: "the takeoff_hash of the incoming TakeoffLine is not already present for the same model_version_id."
    error_id: ERR_DUPLICATE_TAKEOFF_LINE
    http_status: 409
    applies_to: "POST /takeoff-lines, POST /model-versions/{id}/coordinate"
  - priority: 18
    category: business_constraint
    check: "Worker.apprentice_period is a member of 1..5 exactly when Worker.classification is APPRENTICE, and is null for every other classification."
    error_id: ERR_APPRENTICE_PERIOD_INVALID
    http_status: 422
    applies_to: "POST /workers, POST /crew-days"
  - priority: 19
    category: business_fiscal
    check: "ModelVersion.zone_quantity_total is at least 1 and ModelVersion.empty_takeoff is false; an empty extraction set can neither be coordinated nor approved as a revised model version."
    error_id: ERR_MODEL_QUANTITY_UNRESOLVED
    http_status: 409
    applies_to: "POST /model-versions/{id}/coordinate, POST /revisions/{id}/approve"
  - priority: 20
    category: business_fiscal
    check: "the incoming TakeoffLine.conduit_run_type is a member of PERMITTED_CONDUIT_TYPES and conduit_run_type_code is a member of the target Assembly.ideal_conduit_type_codes array."
    error_id: ERR_CONDUIT_TYPE_NOT_PERMITTED
    http_status: 422
    applies_to: "POST /takeoff-lines"
  - priority: 21
    category: business_fiscal
    check: "the resulting rack.reserved_streams_and_phase_cf after this change is <= RACK_CAPACITY_MARGIN x rack.value_capacity_cf with RACK_CAPACITY_MARGIN = 0.95."
    error_id: ERR_RACK_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /prefab-components, PATCH /rework-jobs/{id}/status"
  - priority: 22
    category: business_constraint
    check: "a Revision whose label_codes contain a fabricated-content code must carry a non-null label_percentage greater than 0; a fabricated-content label without a percentage is rejected."
    error_id: ERR_LABEL_CODE_MISSING
    http_status: 422
    applies_to: "POST /revisions, POST /revisions/{id}/approve"
  - priority: 23
    category: business_constraint
    check: "impact_keys carries at least one entry whenever a revision is submitted or approved; an empty impact set is rejected."
    error_id: ERR_REVISION_IMPACT_REQUIRED
    http_status: 422
    applies_to: "POST /revisions, POST /revisions/{id}/approve"
  - priority: 24
    category: business_referential
    check: "the Revision's target ModelVersion is not already SUPERSEDED and no other APPROVED Revision already targets the same model_version_id."
    error_id: ERR_MODEL_SUPERSEDED
    http_status: 409
    applies_to: "POST /revisions, POST /revisions/{id}/approve"
  - priority: 25
    category: business_constraint
    check: "the sum of tied_shipment_hours and revised_trade_hours does not exceed the revision's adjusted_flow_hours."
    error_id: ERR_CRAFT_HOURS_EXCEEDED
    http_status: 409
    applies_to: "POST /revisions/{id}/approve, PATCH /rework-jobs/{id}/status"
  - priority: 26
    category: business_constraint
    check: "the revision's replacement_lifecycle_percent is greater than or equal to prior_lifecycle_percent; a replacement younger than the content it replaces is rejected."
    error_id: ERR_SERVICE_LIFECYCLE_INVALID
    http_status: 422
    applies_to: "POST /revisions, POST /revisions/{id}/approve"
  - priority: 27
    category: business_constraint
    check: "Worker.qualification_state_code is at most 40 characters; a longer value is rejected."
    error_id: ERR_SHIFT_BAND_TOO_LONG
    http_status: 422
    applies_to: "POST /workers"
  - priority: 28
    category: business_safety
    check: "the revision's safety_gate_status is not BLOCKED; a blocked safety gate cannot be approved."
    error_id: ERR_REVISION_SAFETY_BLOCKED
    http_status: 409
    applies_to: "POST /revisions/{id}/approve"
  - priority: 29
    category: business_temporal
    check: "the release is declared on or before MaterialRelease.planned_release_iso; num_days_late = max(0, days(current clock - planned_release_iso)) is exposed on the rejected response."
    error_id: ERR_MATERIAL_RELEASE_DEADLINE
    http_status: 409
    applies_to: "POST /material-releases/{id}/declare"
  - priority: 30
    category: business_temporal
    check: "the order's derived hoisting_start_iso at the release instant is not already before the logical clock; a hoisting window that has lapsed at the moment of release is rejected."
    error_id: ERR_FABRICATION_WINDOW_LAPSED
    http_status: 409
    applies_to: "POST /prefab-orders/{id}/release"
  - priority: 31
    category: business_temporal
    check: "the order's hoisting window has not already been frozen by a prior release-to-shop record; the window is derived exactly once."
    error_id: ERR_WINDOW_ALREADY_FROZEN
    http_status: 409
    applies_to: "POST /prefab-orders/{id}/release, POST /prefab-orders/{id}/ressue"

endpoints:
  - method: POST
    path: "/projects"
    description: "Register a jobsite: jurisdiction, contract value, energization anchor, laydown capacity, credit policy and the five-tier posture ladder."
    roles: [PlatformAdmin]
    code: 201
    input: [project_code, project_name, jurisdiction_key, planned_value_cents, power_on_iso, laydown_slots, credit_policy, posture_thresholds, shop_utilization_pct, total_quantity, released_quantity, float_band_low_pct, safety_program_required]
    output: Project
    side_effects: ["Project.project_posture initialized to ON_TRACK", "Project.slippage_pct initialized to 0.0", "project_posture_derivation"]
  - method: GET
    path: "/projects/{id}"
    description: "Retrieve a project with every derived field (posture, slippage, value balances, breach flag, gate booleans, craft-hours credit, idle capacity)."
    roles: [PlatformAdmin, ProjectManager, ModelCoordinator, ShopForeman, LogisticsCoordinator, ProcurementLead, GeneralForeman, InstallForeman]
    code: 200
    input: []
    output: Project
    side_effects: []
  - method: POST
    path: "/projects/{id}/posture/recompute"
    description: "Re-evaluate the project's posture by walking the descending ladder from SLIP_RELEASE_AT to SLIP_FREEZE_AT and propagate the result to every non-terminal work package."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Project
    side_effects: ["project_posture_derivation", "cascade: releasable_status recomputed on every non-terminal PrefabOrder", "cascade: Project.fabrication_locked and Project.fabricated_revision_active recomputed"]
  - method: POST
    path: "/model-versions"
    description: "Register a building model revision letter against its lineage; the lineage field points at the predecessor version for a successor letter."
    roles: [ModelCoordinator]
    code: 201
    input: [model_id, revision_letter, status]
    output: ModelVersion
    side_effects: ["ModelVersion.zone_quantity_total initialized to 0", "ModelVersion.empty_takeoff initialized to true"]
  - method: GET
    path: "/model-versions"
    description: "List building model versions, filtered by lineage."
    roles: [PlatformAdmin, ProjectManager, ModelCoordinator, ShopForeman]
    code: 200
    input: ["model_id?", "limit?", "offset?"]
    output: ModelVersion[]
    side_effects: []
  - method: POST
    path: "/model-versions/{id}/coordinate"
    description: "Freeze a coordinated model version; a version whose extraction set is empty is rejected."
    roles: [ModelCoordinator]
    code: 200
    input: []
    output: ModelVersion
    side_effects: ["ModelVersion.status becomes COORDINATED", "ModelVersion.coordinated_at_iso stamped from the logical clock", "recompute_model_version_quantities"]
  - method: POST
    path: "/takeoff-lines"
    description: "Extract one quantity line from a coordinated version; the server stamps the deduplication hash over the version, zone, assembly and quantity."
    roles: [ModelCoordinator]
    code: 201
    input: [model_version_id, zone_code, assembly_code, conduit_run_type, conduit_run_type_code, quantity, prefab_share_pct]
    output: TakeoffLine
    side_effects: ["TakeoffLine.takeoff_hash stamped", "recompute_model_version_quantities", "conduit_craft_hours"]
  - method: GET
    path: "/takeoff-lines"
    description: "List extracted takeoff lines for a model version; also the reverse-reachability read for every TakeoffLine child relationship."
    roles: [PlatformAdmin, ProjectManager, ModelCoordinator, ShopForeman]
    code: 200
    input: ["model_version_id?", "limit?", "offset?"]
    output: TakeoffLine[]
    side_effects: []
  - method: POST
    path: "/workers"
    description: "Register a craft worker with classification, apprentice period, home jurisdiction and qualification code; the safety verification expiry is stamped from the clock."
    roles: [GeneralForeman]
    code: 201
    input: [worker_code, full_name, classification, apprentice_period, home_jurisdiction_key, qualification_state_code, percent_complete_certified, percent_complete_verified, safety_verified_status, safety_verification_code]
    output: Worker
    side_effects: ["Worker.safety_verification expiry stamped as clock + 90 days", "Worker.journey_ring_claim_hours initialized to 0"]
  - method: POST
    path: "/trade-contract-rates"
    description: "Register a jurisdiction labor-agreement rate row with its apprentice and wait ratio caps."
    roles: [PlatformAdmin]
    code: 201
    input: [jurisdiction_key, classification, apprentice_period, hourly_rate_cents, burden_pct, apprentice_ratio_max, wait_ratio_max, effective_from_iso]
    output: TradeContractRate
    side_effects: ["ratio_limit_resolution re-evaluated for every project in the jurisdiction"]
  - method: POST
    path: "/revisions/{id}/submit"
    description: "Submit a drafted revision for approval; submission restricts every material release consuming an affected assembly and closes the affected work packages' release gates."
    roles: [ProjectManager]
    code: 200
    input: []
    output: Revision
    side_effects: ["Revision.status becomes SUBMITTED", "Revision.engineering_hold recomputed to true", "cascade: consumed commodities of affected assemblies move to RESTRICTED", "cascade: releasable_status recomputed to ENGINEERING_HOLD on every work package holding an affected component", "increments Revision.version by 1"]
  - method: POST
    path: "/racks"
    description: "Lay out a rack in a model version with its elevation, hoisting date, capacity and stream/phase rule."
    roles: [ModelCoordinator]
    code: 201
    input: [model_version_id, rack_code, zone_code, top_elevation_ft, rack_hoist_date, value_capacity_cf, direct_assignment, ordering_strength_rule]
    output: Rack
    side_effects: ["Rack.reserved_streams_and_phase_cf initialized to 0"]
  - method: GET
    path: "/racks"
    description: "List racks laid out in a model version."
    roles: [PlatformAdmin, ProjectManager, ModelCoordinator, ShopForeman, InstallForeman]
    code: 200
    input: ["model_version_id?", "limit?", "offset?"]
    output: Rack[]
    side_effects: []
  - method: POST
    path: "/trade-activities"
    description: "Register a trade activity in the written installation sequence agreement with its work front, bay, sequence index and permitting activity."
    roles: [GeneralForeman]
    code: 201
    input: [project_id, trade_key, activity_kind, work_front_code, bay_code, planned_start_iso, planned_duration_days, written_sequence_index, revision_id, rate_id, permit_id]
    output: TradeActivity
    side_effects: ["TradeActivity.status initialized to PLANNED", "project_posture_derivation recomputed for the owning project"]
  - method: GET
    path: "/trade-activities"
    description: "List trade activities filtered by project, revision, rate row or permitting activity; the reverse-reachability read for all four TradeActivity relationships."
    roles: [PlatformAdmin, ProjectManager, GeneralForeman, InstallForeman]
    code: 200
    input: ["project_id?", "revision_id?", "rate_id?", "permit_id?", "work_front_code?", "limit?", "offset?"]
    output: TradeActivity[]
    side_effects: []
  - method: PATCH
    path: "/trade-activities/{id}/status"
    description: "Advance or suspend a trade activity; entering COMPLETE removes its duration from the project's critical path span."
    roles: [GeneralForeman]
    code: 200
    input: [status]
    output: TradeActivity
    side_effects: ["productivity_actuals recomputed on COMPLETE", "cascade: Project.slippage_pct, critical span and shortfall recomputed", "cascade: Project.project_posture recomputed through the ladder"]
  - method: POST
    path: "/crew-days"
    description: "Report a crew day for a worker on an activity; the report carries an explicit acknowledge mode and a submission sequence."
    roles: [GeneralForeman]
    code: 201
    input: [project_id, worker_id, foreman_id, trade_activity_id, work_date_iso, regular_hours, overtime_hours, report_sequence, acknowledge_mode]
    output: CrewDay
    side_effects: ["CrewDay.apprentice_hours and journeyman_hours derived from classification", "field_credit_policy applied to the day's candidate reports"]
  - method: GET
    path: "/crew-days"
    description: "List crew days filtered by project, worker, foreman or activity; the reverse-reachability read for all four CrewDay relationships."
    roles: [PlatformAdmin, ProjectManager, GeneralForeman, ShopForeman]
    code: 200
    input: ["project_id?", "worker_id?", "foreman_id?", "trade_activity_id?", "work_date_iso?", "limit?", "offset?"]
    output: CrewDay[]
    side_effects: []
  - method: POST
    path: "/crew-days/{id}/acknowledge"
    description: "Acknowledge a foreman's crew-day report; re-prices the row and rolls the cumulative apprentice and journeyman hours into the compliance ledger."
    roles: [GeneralForeman]
    code: 200
    input: [expected_crew_day_version, acknowledge_mode]
    output: CrewDay
    side_effects: ["field_credit_policy recomputed for the day", "gross_payroll_reconciliation", "ratio_limit_resolution", "ComplianceLedger.apprentice_hours, journeyman_hours, excess_apprentice_hours and adjustment_delta_hours recomputed from the day's non-voided row", "increments CrewDay.version by 1", "cascade: TradeActivity.status becomes DISALLOWED when any crew row carries excess apprentice hours", "cascade: productivity_actuals recomputed"]
  - method: GET
    path: "/compliance-ledger"
    description: "List cumulative jurisdiction-compliance rows filtered by project, worker, activity or rate row; the reverse-reachability read for all four ledger relationships."
    roles: [PlatformAdmin, ProjectManager, GeneralForeman]
    code: 200
    input: ["project_id?", "worker_id?", "trade_activity_id?", "rate_id?", "limit?", "offset?"]
    output: ComplianceLedger[]
    side_effects: []
  - method: POST
    path: "/prefab-orders"
    description: "Create a work package taken off a coordinated version; creation is refused when the project already carries a Revision naming an artifact of the package's assemblies."
    roles: [ProjectManager]
    code: 201
    input: [project_id, model_version_id, stage_code, zone_code, transport_kind, hoisting_window_id, required_on_site_iso, installation_window_start_iso, fabricate_quantity, shop_utilisation_basis_pct]
    output: PrefabOrder
    side_effects: ["PrefabOrder.fabricate_status initialized to PLANNED", "PrefabOrder.releasable_status recomputed from the project's fabricated-revision and material gates", "on refusal no row is created and ERR_ENGINEERING_HOLD_ACTIVE is returned"]
  - method: GET
    path: "/prefab-orders"
    description: "List work packages filtered by project or model version; the reverse-reachability read for both order relationships."
    roles: [PlatformAdmin, ProjectManager, ModelCoordinator, ShopForeman, LogisticsCoordinator]
    code: 200
    input: ["project_id?", "model_version_id?", "limit?", "offset?"]
    output: PrefabOrder[]
    side_effects: []
  - method: POST
    path: "/prefab-orders/{id}/release"
    description: "Release a work package to the shop, freezing its hoisting window and claiming a laydown slot and a procurement release date."
    roles: [ProjectManager]
    code: 200
    input: [expected_prefab_order_version]
    output: PrefabOrder
    side_effects: ["PrefabOrder.fabricate_status becomes RELEASED", "PrefabOrder.release_to_shop_iso stamped from the logical clock", "PrefabOrder.laydown_slot_index assigned", "hoisting_window_derivation; window frozen", "material_release_timing recomputed; locked_release_iso frozen", "recompute_project_pipeline", "increments PrefabOrder.version by 1"]
  - method: PATCH
    path: "/prefab-orders/{id}/fabrication-status"
    description: "Move a work package along its shop dimension from RELEASED into fabrication and then to FABRICATED."
    roles: [ShopForeman]
    code: 200
    input: [fabricate_status]
    output: PrefabOrder
    side_effects: ["PrefabOrder.fabricate_status advanced on its own dimension", "craft_hours_credit recomputed on entry to FABRICATED", "recompute_project_pipeline", "increments PrefabOrder.version by 1"]
  - method: POST
    path: "/prefab-orders/{id}/ressue"
    description: "Revert a fabricated work package that has not shipped back to PLANNED, releasing its slot and undoing the hoisting window."
    roles: [ProjectManager]
    code: 200
    input: []
    output: PrefabOrder
    side_effects: ["PrefabOrder.fabricate_status becomes PLANNED", "laydown slot released", "hoisting window and release-to-shop date cleared", "cascade: every FABRICATED component reverts to PLANNED", "cascade: crafted_hours_credit recomputed to 0 on those components", "compensating invariant: project.craft_hours_credit is restored to its pre-release value", "increments PrefabOrder.version by 1"]
  - method: POST
    path: "/prefab-orders/{id}/cancel"
    description: "Cancel a planned work package before any shipment left the yard."
    roles: [ProjectManager]
    code: 200
    input: []
    output: PrefabOrder
    side_effects: ["PrefabOrder.fabricate_status becomes CANCELLED", "cascade: components of the order have their rack assignment cleared and are scrapped", "cascade: rack_value_capacity_check recomputed for every affected rack", "cascade: project.pipeline_value_cents recomputed", "increments PrefabOrder.version by 1"]
  - method: PATCH
    path: "/prefab-orders/{id}/delivery-status"
    description: "Move a work package along its delivery dimension: stage, load, dispatch, unload, deliver, or recover a lost shipment back to LOADED."
    roles: [LogisticsCoordinator]
    code: 200
    input: [deliver_status, shipment_status]
    output: PrefabOrder
    side_effects: ["PrefabOrder.deliver_status and shipment_status advanced on their own dimensions", "cascade: FABRICATED components become LOADED on dispatch and revert to FABRICATED on unload", "cascade: project.pipeline_value_cents, Project.completed_value_cents and Project.project_posture recomputed", "compensating invariant: project.craft_hours_credit is unchanged by a load-then-unload cycle", "increments PrefabOrder.version by 1"]
  - method: POST
    path: "/prefab-components"
    description: "Add a fabricated component to a work package, binding it to its takeoff line, rack and predecessor chain link."
    roles: [ShopForeman]
    code: 201
    input: [prefab_order_id, rack_id, takeoff_line_id, predecessor_component_id, assembly_code, quantity, chain_mode, chain_dependency_link]
    output: PrefabComponent
    side_effects: ["PrefabComponent.install_status initialized to PLANNED", "PrefabComponent.crafted_hours computed through project_pipeline_balance", "rack_value_capacity_check recomputed for the bound rack"]
  - method: GET
    path: "/prefab-components"
    description: "List fabricated components filtered by work package, rack, takeoff line or predecessor; the reverse-reachability read for all four component relationships."
    roles: [PlatformAdmin, ProjectManager, ShopForeman, InstallForeman, LogisticsCoordinator]
    code: 200
    input: ["prefab_order_id?", "rack_id?", "takeoff_line_id?", "predecessor_component_id?", "install_status?", "limit?", "offset?"]
    output: PrefabComponent[]
    side_effects: []
  - method: POST
    path: "/prefab-components/{id}/fabricate"
    description: "Mark a component built in the shop; a component on engineering hold, or one whose chain predecessor is not set, cannot be fabricated."
    roles: [ShopForeman]
    code: 200
    input: []
    output: PrefabComponent
    side_effects: ["PrefabComponent.install_status becomes FABRICATED", "crafted_hours_credit recomputed", "recompute_project_pipeline"]
  - method: PATCH
    path: "/prefab-components/{id}/install-status"
    description: "Mark a delivered component set in the field; a component in a frozen project or behind an unmet installation-sequence predecessor cannot be set."
    roles: [InstallForeman]
    code: 200
    input: [install_status]
    output: PrefabComponent
    side_effects: ["PrefabComponent.install_status becomes SET", "cascade: Project.completed_value_cents recomputed through project_pipeline_balance", "cascade: Project.effective_flow_pct and Project.installed_pct recomputed", "cascade: Project.project_posture recomputed through the ladder"]
  - method: POST
    path: "/revisions"
    description: "Raise a design revision against a model version, naming every affected artifact and the external safety and label verification gates."
    roles: [ProjectManager]
    code: 201
    input: [project_id, model_version_id, revised_version_id, revision_kind, impact_keys, maintenance_hours, buffer_before_hours, momentum_before_hours, base_service_hours, paid_service_hours, billed_service_hours, percent_complete_mode, label_percent_complete, label_codes, fabricated_content_codes, shop_parts_value_cents, shop_parts_quantity, revision_quantity, impact_qualified_hours, effort_hours, kludge_rate_per_hour_cents, negotiated_rate_per_hour_cents, submitted_markup_pct, direct_shop_cost_cents, replacement_lifecycle_percent, prior_lifecycle_percent, safety_gate_status, label_verified_status, safety_verified_status, label_percentage, qualified_lifecycle_percent, proposed_waiver]
    output: Revision
    side_effects: ["Revision.status initialized to DRAFT", "Revision.engineering_hold computed to true", "Revision.impact_values computed through revision_cost_impact", "cascade: consumed commodities of affected assemblies move to RESTRICTED"]
  - method: GET
    path: "/revisions"
    description: "List revisions filtered by project or by either model version they reference; the reverse-reachability read for all three revision relationships."
    roles: [PlatformAdmin, ProjectManager, ModelCoordinator, ShopForeman, ProcurementLead]
    code: 200
    input: ["project_id?", "model_version_id?", "revised_version_id?", "limit?", "offset?"]
    output: Revision[]
    side_effects: []
  - method: POST
    path: "/revisions/{id}/approve"
    description: "Approve a submitted revision: supersedes the target model version, queues rework for every fabricated component it touches, and prices both change-order memos."
    roles: [ProjectManager]
    code: 200
    input: [expected_model_version_version, resolution]
    output: Revision
    side_effects: ["Revision.status becomes APPROVED", "Revision.approved_change_value_cents computed from revision_cost_impact variant (b)", "cascade: ModelVersion.status becomes SUPERSEDED and its version increments", "cascade: affected FABRICATED components become REWORK and ReworkJob OPEN rows are created", "cascade: owning PrefabOrder.rework_order_count and releasable_status recomputed", "cascade: Project.project_posture recomputed", "increments Revision.version by 1"]
  - method: PATCH
    path: "/rework-jobs/{id}/status"
    description: "Advance, close, scrap or reopen a shop rework job; reopening a closed job returns its component to REWORK."
    roles: [ShopForeman, ProjectManager]
    code: 200
    input: [status, resolution]
    output: ReworkJob
    side_effects: ["ReworkJob.status advanced", "cascade: owning PrefabComponent.install_status updated", "cascade: owning PrefabOrder.rework_order_count and releasable_status recomputed", "cascade: rack_value_capacity_check recomputed when the component is scrapped"]
  - method: GET
    path: "/rework-jobs"
    description: "List rework jobs filtered by project, component or revision; the reverse-reachability read for all three rework-job relationships."
    roles: [PlatformAdmin, ProjectManager, ShopForeman]
    code: 200
    input: ["project_id?", "prefab_component_id?", "revision_id?", "limit?", "offset?"]
    output: ReworkJob[]
    side_effects: []
  - method: POST
    path: "/material-releases"
    description: "Create a procurement release for a commodity with its quoted lead time, service priority and commitment mode."
    roles: [ProcurementLead]
    code: 201
    input: [project_id, model_version_id, vendor_key, material_commodity, quantity, unit_price_cents, lead_time_days, service_priority, commitment_mode, planned_release_iso, receiving_user_id]
    output: MaterialRelease
    side_effects: ["MaterialRelease.status initialized to PLANNED", "material_release_timing computed for the release", "cascade: releasable_status recomputed on every work package consuming the commodity"]
  - method: GET
    path: "/material-releases"
    description: "List procurement releases filtered by project or model version; the reverse-reachability read for both release relationships."
    roles: [PlatformAdmin, ProjectManager, ProcurementLead, LogisticsCoordinator]
    code: 200
    input: ["project_id?", "model_version_id?", "material_commodity?", "limit?", "offset?"]
    output: MaterialRelease[]
    side_effects: []
  - method: POST
    path: "/material-releases/{id}/declare"
    description: "Declare a procurement release to the vendor, freeze its locked release date, and advance it through shipment and receipt statuses."
    roles: [ProcurementLead]
    code: 200
    input: [expected_project_version, target_status]
    output: MaterialRelease
    side_effects: ["MaterialRelease.status advanced along PLANNED -> RELEASED -> SHIPPED -> RECEIVED", "MaterialRelease.declared_for_procurement recomputed", "material_release_timing recomputed; locked_release_iso frozen", "cascade: releasable_status recomputed on every work package consuming the commodity", "cascade: Project.fabrication_locked recomputed", "increments Project.version by 1"]
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint: set the logical clock. The server's startup default is exactly 2026-09-01T00:00:00Z and the clock never falls back to wall-clock time before this endpoint is called."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["Logical clock set; every subsequent deadline, window and slippage evaluation reads the new instant"]

errors:
  - id: ERR_UNAUTHORIZED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or the role is not a declared member of the RBAC matrix"
  - id: ERR_FORBIDDEN
    http: 403
    condition: "the acting role is not permitted for this operation"
  - id: ERR_PROJECT_NOT_FOUND
    http: 404
    condition: "the project id named in the path or body does not exist"
  - id: ERR_MODEL_VERSION_NOT_FOUND
    http: 404
    condition: "the model version id named in the path or body does not exist"
  - id: ERR_PREFAB_ORDER_NOT_FOUND
    http: 404
    condition: "the work package id named in the path does not exist"
  - id: ERR_REFERENCED_ENTITY_NOT_FOUND
    http: 404
    condition: "a referenced entity id (worker, activity, crew day, rack, takeoff line, foreman) does not exist"
  - id: ERR_AFFECTED_REF_NOT_FOUND
    http: 404
    condition: "an entry of impact_keys does not resolve to a takeoff hash, a prefab component code or a rack code"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "the supplied expected_<parent>_version does not equal the parent entity's current version"
  - id: ERR_INVALID_PREFAB_TRANSITION
    http: 409
    condition: "the target entity is not in the from-state its transaction requires"
  - id: ERR_ENGINEERING_HOLD_ACTIVE
    http: 409
    condition: "a non-terminal revision names an artifact of the work package's assembly set, so releasable_status is ENGINEERING_HOLD"
  - id: ERR_MATERIAL_HOLD_ACTIVE
    http: 409
    condition: "a member of the project material gate commodities has no declared procurement release"
  - id: ERR_INSTALL_SEQUENCE_VIOLATION
    http: 409
    condition: "a lower-indexed activity of another trade on the same work front still holds the bay"
  - id: ERR_APPRENTICE_RATIO_EXCEEDED
    http: 409
    condition: "the cumulative apprentice hours on the project would exceed ratio_limit x journeyman hours"
  - id: ERR_HOISTING_WINDOW_CONFLICT
    http: 409
    condition: "the proposed hoisting window overlaps a frozen window booked on the same hoisting window id"
  - id: ERR_LAYDOWN_SLOT_UNAVAILABLE
    http: 409
    condition: "no laydown slot is free after excluding the [release instant, delivery instant) window of the other non-terminal work packages"
  - id: ERR_JURISDICTION_DISPATCH_BAND
    http: 422
    condition: "a dispatched worker's home jurisdiction differs from the jobsite jurisdiction, or the apprentice band is unknown"
  - id: ERR_DUPLICATE_TAKEOFF_LINE
    http: 409
    condition: "the stamped takeoff hash already exists on the same model version"
  - id: ERR_APPRENTICE_PERIOD_INVALID
    http: 422
    condition: "apprentice_period is set on a non-apprentice classification, or missing or out of 1..5 on an apprentice"
  - id: ERR_MODEL_QUANTITY_UNRESOLVED
    http: 409
    condition: "the model version extraction set is empty or a re-extraction would drive the zone quantity total below 1"
  - id: ERR_CONDUIT_TYPE_NOT_PERMITTED
    http: 422
    condition: "conduit_run_type is not permitted, or the conduit code is not one of the assembly's ideal conduit type codes"
  - id: ERR_RACK_CAPACITY_EXCEEDED
    http: 409
    condition: "the rack's reserved stream and phase capacity would exceed 0.95 of its value capacity"
  - id: ERR_LABEL_CODE_MISSING
    http: 422
    condition: "a fabricated-content label code is present but no positive label percentage was supplied"
  - id: ERR_REVISION_IMPACT_REQUIRED
    http: 422
    condition: "a revision is submitted or approved with an empty impact set"
  - id: ERR_MODEL_SUPERSEDED
    http: 409
    condition: "the target model version is already superseded, or another approved revision already targets it"
  - id: ERR_CRAFT_HOURS_EXCEEDED
    http: 409
    condition: "tied shipment hours plus revised trade hours exceed the revision's adjusted flow hours"
  - id: ERR_SERVICE_LIFECYCLE_INVALID
    http: 422
    condition: "replacement_lifecycle_percent is below prior_lifecycle_percent"
  - id: ERR_SHIFT_BAND_TOO_LONG
    http: 422
    condition: "qualification_state_code exceeds 40 characters"
  - id: ERR_REVISION_SAFETY_BLOCKED
    http: 409
    condition: "the revision's safety gate result is BLOCKED so it cannot be approved"
  - id: ERR_MATERIAL_RELEASE_DEADLINE
    http: 409
    condition: "the release is declared after its planned release date"
  - id: ERR_FABRICATION_WINDOW_LAPSED
    http: 409
    condition: "the derived hoisting window start already precedes the logical clock at the release instant"
  - id: ERR_WINDOW_ALREADY_FROZEN
    http: 409
    condition: "the work package's hoisting window was already frozen by a prior release-to-shop record"

roles:
  - name: PlatformAdmin
    description: "Bench operator identity; owns reference data, the posture ladder and the logical clock."
    identity: "opaque"
    exclusive_operations: ["POST /projects", "POST /projects/{id}/posture/recompute", "POST /trade-contract-rates", "POST /_clock/set_current_utc"]
    shared_operations: ["GET /projects/{id}", "GET /model-versions", "GET /takeoff-lines", "GET /racks", "GET /trade-activities", "GET /crew-days", "GET /compliance-ledger", "GET /prefab-orders", "GET /prefab-components", "GET /revisions", "GET /rework-jobs", "GET /material-releases"]
  - name: ProjectManager
    description: "Owns the jobsite schedule, work-package release decisions, revision approvals and rework disposition."
    identity: "opaque"
    exclusive_operations: ["POST /prefab-orders", "POST /prefab-orders/{id}/release", "POST /prefab-orders/{id}/ressue", "POST /prefab-orders/{id}/cancel", "POST /revisions", "POST /revisions/{id}/submit", "POST /revisions/{id}/approve"]
    shared_operations: ["GET /projects/{id}", "GET /model-versions", "GET /takeoff-lines", "GET /racks", "GET /trade-activities", "GET /crew-days", "GET /compliance-ledger", "GET /prefab-orders", "GET /prefab-components", "GET /revisions", "GET /material-releases", "PATCH /rework-jobs/{id}/status"]
  - name: ModelCoordinator
    description: "Owns the coordinated building model: versions, extraction lines and rack layouts."
    identity: "opaque"
    exclusive_operations: ["POST /model-versions", "POST /model-versions/{id}/coordinate", "POST /takeoff-lines", "POST /racks"]
    shared_operations: ["GET /model-versions", "GET /takeoff-lines", "GET /racks", "GET /prefab-orders", "GET /revisions", "GET /projects/{id}"]
  - name: ShopForeman
    description: "Owns shop production: fabrication status, component fabrication and rework execution."
    identity: "opaque"
    exclusive_operations: ["PATCH /prefab-orders/{id}/fabrication-status", "POST /prefab-components", "POST /prefab-components/{id}/fabricate"]
    shared_operations: ["GET /prefab-orders", "GET /prefab-components", "GET /rework-jobs", "GET /takeoff-lines", "GET /racks", "GET /crew-days", "PATCH /rework-jobs/{id}/status"]
  - name: LogisticsCoordinator
    description: "Owns jobsite logistics: staging, loading, dispatch, unload and delivery."
    identity: "opaque"
    exclusive_operations: ["PATCH /prefab-orders/{id}/delivery-status"]
    shared_operations: ["GET /prefab-orders", "GET /prefab-components", "GET /material-releases", "GET /projects/{id}"]
  - name: ProcurementLead
    description: "Owns material releases: creation, declaration to the vendor and receipt."
    identity: "opaque"
    exclusive_operations: ["POST /material-releases", "POST /material-releases/{id}/declare", "POST /material-releases"]
    shared_operations: ["GET /material-releases", "GET /revisions", "GET /prefab-orders"]
  - name: GeneralForeman
    description: "Owns field labor reporting and the written installation sequence agreement: roster dispatch, crew days, activity status."
    identity: "opaque"
    exclusive_operations: ["POST /workers", "POST /trade-activities", "PATCH /trade-activities/{id}/status", "POST /crew-days", "POST /crew-days/{id}/acknowledge"]
    shared_operations: ["GET /trade-activities", "GET /crew-days", "GET /compliance-ledger", "GET /projects/{id}"]
  - name: InstallForeman
    description: "Owns field installation: setting delivered prefab content in its zone."
    identity: "opaque"
    exclusive_operations: ["PATCH /prefab-components/{id}/install-status"]
    shared_operations: ["GET /prefab-components", "GET /racks", "GET /trade-activities", "GET /projects/{id}"]