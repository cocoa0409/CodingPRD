              as_user_id: "teach-01"
            - call: "POST /placements/${pl_id}/request-re-entry"
              payload: { target_re_entry_date: "2026-08-24" }
              as: PlacementCoordinator
              as_user_id: "${ctr_id}"
          assert:
            - "before the trigger, Placement.${pl_id}.attendance_rate == 0.8800, readiness_base_score == 0.7400, engagement_bonus == 0.0300, readiness_score == 0.7700 and re_entry_eligible == false"
            - "the first trigger call returns HTTP 409 with error_id ERR_ATTENDANCE_BELOW_MINIMUM (not ERR_READINESS_BELOW_THRESHOLD: readiness 0.7700 already clears 0.7500)"
            - "after the second trigger call Placement.${pl_id}.days_present == 45, days_enrolled == 50 and attendance_rate == 0.9000 exactly"
            - "after the second trigger call readiness_base_score == 0.7500, engagement_bonus == 0.0300, readiness_score == 0.7800 and re_entry_eligible == true"
            - "CourseEnrollment.${enr_id}.pace_index == 4.000 and pacing_flag == ON_PACE (10 elapsed days of 40 gives expected_fraction 0.2500 against actual_fraction 1.0000); the readiness pacing_component is the capped 1.0000, not 4.000"
            - "the third trigger call returns HTTP 200 with Placement.${pl_id}.status == RE_ENTRY_PENDING, target_re_entry_date == '2026-08-24' and re_entry_requested_by_user_id == '${ctr_id}'"
            - "GraduationPlan.${plan_id}.expected_credits_by_grade == 1.00, credits_earned == 1.00 and posture == ON_TRACK (so the priority-15 plan gate never fires)"

      - name: submit_for_award_with_zero_completed_proctor_sessions
        metric: "CourseEnrollment.mastery_pct (weighted 0.60/0.40 blend, 2 decimal places) and the count of COMPLETED ProctorSessions at the zero boundary"
        endpoint: "POST /course-enrollments/{course_enrollment_id}/submit-for-award"
        grounds:
          - calculations.enrollment_mastery_pct
          - entities.Course.fields.proctoring_required
          - entities.CourseEnrollment.fields.proctored_exam_percent
          - errors[ERR_PROCTORED_EXAM_MISSING]
          - state_machines.ProctorSession.SCHEDULED_to_COMPLETED
        distinguishing_aspect: |
          A different metric on a different endpoint: with proctoring_required true, a booked but
          still SCHEDULED session counts as zero completed exams, so submit-for-award is refused with
          ERR_PROCTORED_EXAM_MISSING; completing that session at score_percent 78.00 both unblocks
          the submission and changes mastery_pct from the bare module average 84.00 to the blended
          81.60 (0.60 * 84.00 + 0.40 * 78.00). An implementation that counts SCHEDULED sessions, or
          that leaves mastery_pct at the module average, is caught.
        test_recipe:
          setup:
            - "one home school and one center with seat_capacity 10, certified_teacher_fte 4.00, max_students_per_teacher 12"
            - "one ONLINE course BIO1: credit_value 1.00, total_modules 10, required_seat_hours 60.00, pacing_days 40, proctoring_required true, proctored_exam_weight 0.40, min_passing_percent 60.00"
            - "one COMPUTER proctor station at that center"
            - "one grade-11 student with an ACTIVE plan (required_credits_total 24.00) on a COMPETENCY placement"
            - "one NEW_CREDIT enrollment in BIO1 with modules_passed 9 and module_avg_percent 84.00, and one ProctorSession booked for 2026-08-05 09:00-10:00Z that is still SCHEDULED"
