  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: termination_forfeiture_cascade_blocks_rollover_depth4
        grounds:
          - state_machines.Participant.ACTIVE_to_TERMINATED
          - entities.ForfeitureEvent.fields.forfeited_shares
          - entities.EsopPlan.fields.unallocated_forfeiture_shares
          - entities.EsopPlan.fields.forfeiture_posture
          - validations[priority=26]
        distinguishing_aspect: |
          Four dependent hops out of the terminate trigger: terminate writes
          Participant.status TERMINATED; because the participant became TERMINATED a
          ForfeitureEvent for 388 shares is created; because that event exists
          EsopPlan.unallocated_forfeiture_shares rises to 388; because 388 exceeds the
          threshold of 100 the plan's forfeiture_posture becomes SWEEP_REQUIRED, which then
          rejects rollover with ERR_FORFEITURE_SWEEP_REQUIRED.
        test_recipe:
          setup:
            - "A plan on GRADED_6YR / TERMINATION_DATE_MEASURE with forfeiture_sweep_threshold_shares 100, in ALLOCATION_LOCKED after a finalized run."
            - "One participant hired 2021-03-01 holding exactly 968 allocated shares and no forfeiture events."
            - "EsopPlan.unallocated_forfeiture_shares is 0 and forfeiture_posture is CLEAR."
