          assert:
            - "the pack read returns HTTP 200 with DisposablePack.${pack1}.applied_preference_card_id == ${pc1} and prime_volume_ml == 1500 copied from the card"
            - "DisposablePack.${pack1}.line_items has exactly 3 elements in ascending line_code order: A_OXYGENATOR, B_TUBING_PACK, C_CANNULA_SET"
