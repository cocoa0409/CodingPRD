              payload: {}
              as: Consumer
              as_user_id: "${fm_id}"
            - call: "GET /credit/consumers/${fm_id}"
              payload: {}
              as: Consumer
              as_user_id: "${fm_id}"
              captures: { fm_v: $.data.version }
            - call: "POST /credit/consumers/${fm_id}/bureau-snapshots"
              payload: { score: 660, added_account_count: 0, total_revolving_balance_cents: 100000, credit_limit_total_cents: 1200000, factor_codes: ["high_utilization"], expected_consumer_version: "${fm_v}" }
              as: BureauConnector
            - call: "PUT /credit/consumers/${fm_id}/score-alert-threshold"
              payload: { threshold_override_points: 5 }
              as: Consumer
              as_user_id: "${fm_id}"
            - call: "POST /credit/_clock/set_current_utc"
              payload: { current_utc: "2026-09-02T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /credit/consumers/${fm_id}"
              payload: {}
              as: Consumer
              as_user_id: "${fm_id}"
              captures: { fm_v2: $.data.version }
            - call: "POST /credit/consumers/${fm_id}/bureau-snapshots"
              payload: { score: 679, added_account_count: 0, total_revolving_balance_cents: 100000, credit_limit_total_cents: 1200000, factor_codes: ["high_utilization"], expected_consumer_version: "${fm_v2}" }
              as: BureauConnector
              captures: { fm_s2: $.data.id }
          assert:
            - "the second pull produces a ScoreAlert with alert_kind == SCORE_FLAT and status == SUPPRESSED"
            - "threshold_used == 5, because the user override of 5 is below the default 20 so the default wins the max()"
            - "an override of 40 would raise threshold_used to 40, so the override can only ever narrow alerting and never widen it"
            - "from_score == 660 and to_score == 679"

      - name: monitoring_window_day_boundary_on_staleness
        claim_type: boundary
        grounds:
          - calculations.monitoring_window_checks
          - calculations.monitoring_window_checks
        distinguishing_aspect: "The staleness sweep fires on pulled_at <= clock - 30 days, so a snapshot aged 30 days is superseded and one aged 29 days is not."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z, then advanced to 2026-10-01T00:00:00Z, exactly 30 days later."]
          setup_api_calls:
            - *k_clock
            - call: "POST /credit/consumers"
              payload: { full_name: "Stale Snap", email: "stale@x.com", state_code: "CA", bureau_pin: "1357", dti_pct: 35.0 }
              as: Consumer
              captures: { st_id: $.data.id }
            - call: "POST /credit/consumers/${st_id}/monitoring-consent"
              payload: {}
              as: Consumer
              as_user_id: "${st_id}"
            - call: "GET /credit/consumers/${st_id}"
              payload: {}
              as: Consumer
              as_user_id: "${st_id}"
              captures: { st_v: $.data.version }
            - call: "POST /credit/consumers/${st_id}/bureau-snapshots"
              payload: { score: 660, added_account_count: 0, total_revolving_balance_cents: 100000, credit_limit_total_cents: 1200000, factor_codes: ["high_utilization"], expected_consumer_version: "${st_v}" }
              as: BureauConnector
              captures: { st_s1: $.data.id }
          trigger:
            - call: "POST /credit/_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /credit/_ops/runs"
              payload: { run_key: "stale-sweep-30" }
              as: PlatformAdmin
          assert:
            - "BureauSnapshot.${st_s1}.status == SUPERSEDED after the run, because pulled_at equals clock - 30 days exactly"
            - "Consumer.${st_id}.current_score stays 660 and score_version stays 1"
            - "a snapshot whose pulled_at were 2026-09-02T00:00:00Z would be 29 days old at the same run and would remain ACTIVE"

      - name: fee_breakeven_returns_null_when_the_balance_is_unknown
        claim_type: Variant Divergence
        grounds:
          - calculations.fee_breakeven_months
          - endpoints.GET_/credit/catalog/items/{item_id}
        distinguishing_aspect: "The same catalog item reports a finite breakeven of 2 months when a card balance is supplied and null when it is absent, because the monthly-interest term collapses to zero."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z. One catalog item whose program carries a 9500-cent annual fee."]
          setup_api_calls:
            - *k_clock
