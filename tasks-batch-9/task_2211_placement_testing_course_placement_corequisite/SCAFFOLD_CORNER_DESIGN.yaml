              payload: { student_number: "SC2", full_name: "Student C Two", race_ethnicity_code: "HISPANIC", hs_gpa: 2.50, hs_transcript_status: "VERIFIED", transcript_recorded_at: "2025-06-01T00:00:00Z" }
              as: AssessmentStaff
