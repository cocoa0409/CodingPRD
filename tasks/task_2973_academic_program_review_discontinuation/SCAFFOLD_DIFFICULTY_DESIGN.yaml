            - "hop 3: GET /provost/decision-records/${dec_id}/agency-notifications returns exactly 2 rows, both with origin AUTO_MINTED and status PENDING"
            - "hop 3: the ACCREDITOR row has agency_code REGIONAL-ACC and due_at == 2026-10-15T10:00:00Z"
            - "hop 3: the STATE_AGENCY row has agency_code STATE-CHE and due_at == 2026-10-30T10:00:00Z"
            - "hop 4: ReviewCycle.${cycle_id}.compliance_posture == NOTICES_PENDING"
            - "DecisionRecord.${dec_id}.notification_count == 2 and unacknowledged_notification_count == 2"
            - "DecisionRecord.${dec_id}.composite_score_at_proposal == 29.06 and viability_band_at_proposal == NONVIABLE"

