              as_user_id: "${practice_id}"
              captures: { window_id: $.data.id }
          trigger:
            - call: "POST /coverage-windows/${window_id}/activate"
              payload: {}
              as: PracticeLiaison
              as_user_id: "${practice_id}"
              captures: { version_after_activate: $.data.version }
            - call: "POST /coverage-windows/${window_id}/activate"
              payload: {}
              as: PracticeLiaison
              as_user_id: "${practice_id}"
              expect_error: ERR_COVERAGE_WINDOW_INVALID_STATE
              expect_status: 409
            - call: "GET /coverage-windows/${window_id}"
