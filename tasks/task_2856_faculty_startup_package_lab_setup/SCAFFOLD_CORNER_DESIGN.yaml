        distinguishing_aspect: "Segregation of duties is enforced pairwise across all three steps, not just between adjacent ones: here the endorsement is performed by a genuinely different user, so the only collision is proposer == approver - two non-adjacent steps, one of them performed by an opaque-identity role that could have sent any header value at all."
