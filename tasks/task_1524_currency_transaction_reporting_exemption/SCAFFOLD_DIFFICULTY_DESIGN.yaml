# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Currency Transaction Reporting & Exemption Management
# 22 instances across the nine §0.5 rules. Every instance grounds in
# SCAFFOLD.yaml §1.1–§1.7 and drives empty-DB -> precondition via §1.5 calls.
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: ctr_deadline_efile_vs_paper_variant
        grounds:
          - calculations.ctr_filing_deadline
          - entities.CTR.fields.filed_late
          - entities.CTR.fields.due_date_efile
          - entities.CTR.fields.due_date_paper
        distinguishing_aspect: |
          Same entity domain (CTR) pins TWO deadline variants: identical
          business_date (2026-08-01) and identical filing timestamp
          (2026-08-20) yield filed_late=true under EFILE (due 2026-08-16)
          but filed_late=false under PAPER (due 2026-08-26).
        test_recipe:
          setup:
            - "Branch BR1 ACTIVE; customers Alpha (tin 11-1111111) and Beta (tin 22-2222222), both INDIVIDUAL and ACTIVE"
            - "Each customer has one 1100000-cent CASH_IN deposit on business_date 2026-08-01 -> each auto-creates a DRAFT CTR (due_date_efile 2026-08-16, due_date_paper 2026-08-26)"
            - "Both CTRs VALIDATED by analyst-x; logical clock advanced to 2026-08-20T12:00:00Z (after efile due, before paper due)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: SystemAdmin }
            - call: "POST /branches"
              payload: { name: "Main", branch_code: "BR1" }
              as: SystemAdmin
              captures: { br1: $.data.id }
            - call: "POST /customers"
              payload: { legal_name: "Alpha LLC", tin: "11-1111111", customer_type: "INDIVIDUAL", account_opened_date: "2026-01-15T00:00:00Z" }
              as: BranchManager
              captures: { ca: $.data.id }
            - call: "POST /customers"
              payload: { legal_name: "Beta LLC", tin: "22-2222222", customer_type: "INDIVIDUAL", account_opened_date: "2026-01-15T00:00:00Z" }
              as: BranchManager
              captures: { cb: $.data.id }
            - { call: "POST /cash-transactions", payload: { customer_id: "${ca}", branch_id: "${br1}", direction: "CASH_IN", amount_cents: 1100000, occurred_at: "2026-08-01T10:00:00Z" }, as: Teller }
            - { call: "POST /cash-transactions", payload: { customer_id: "${cb}", branch_id: "${br1}", direction: "CASH_IN", amount_cents: 1100000, occurred_at: "2026-08-01T10:30:00Z" }, as: Teller }
            - call: "GET /ctrs"
              payload: { customer_id: "${ca}" }
              as: BSAOfficer
              captures: { ctr_a: "$.data[0].id" }
            - call: "GET /ctrs"
              payload: { customer_id: "${cb}" }
              as: BSAOfficer
              captures: { ctr_b: "$.data[0].id" }
            - { call: "POST /ctrs/${ctr_a}/validate", as: ComplianceAnalyst, as_user_id: "analyst-x" }
            - { call: "POST /ctrs/${ctr_b}/validate", as: ComplianceAnalyst, as_user_id: "analyst-x" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-20T12:00:00Z" }, as: SystemAdmin }
          trigger:
            - { call: "POST /ctrs/${ctr_a}/file", payload: { filing_channel: "EFILE" }, as: BSAOfficer, as_user_id: "officer-y" }
            - { call: "POST /ctrs/${ctr_b}/file", payload: { filing_channel: "PAPER" }, as: BSAOfficer, as_user_id: "officer-y" }
          assert:
            - "CTR.${ctr_a}.business_date == '2026-08-01' and CTR.${ctr_b}.business_date == '2026-08-01'"
            - "CTR.${ctr_a}.due_date_efile == '2026-08-16' and CTR.${ctr_a}.due_date_paper == '2026-08-26'"
            - "CTR.${ctr_a}.filed_late == true"
            - "CTR.${ctr_b}.filed_late == false"
            - "CTR.${ctr_a}.status == 'FILED' and CTR.${ctr_b}.status == 'FILED'"

      - name: phase_ii_eligibility_initial_vs_review_variant
        grounds:
          - calculations.phase_ii_eligibility
          - state_machines.ExemptionDesignation.REVIEW_DUE_to_ACTIVE
          - entities.ExemptionDesignation.fields.eligibility_snapshot
        distinguishing_aspect: |
          Different entity domain than the other dual-variant instance
          (ExemptionDesignation, not CTR): the initial_designation variant
          (account-age conjunct, no referral conjunct, window anchored at
          designation date) PASSES with 5 qualifying days, while the
          annual_review variant (age conjunct dropped, referral conjunct
          added, window anchored at review date 2027-08-02) FAILS because the
          same July-2026 days have aged out of the trailing-365-day window.
        test_recipe:
          setup:
            - "Branch BR1 ACTIVE; customer BUSINESS_NONLISTED, tin 33-3333333, account_opened_date 2025-06-01 (age 426 days at designation)"
            - "Five 1100000-cent CASH_IN deposits on 2026-07-06/08/10/13/15 (each single day > threshold, so no structuring alert)"
            - "PHASE_II designation created by officer-a, approved by officer-b at 2026-08-01 (initial variant: window [2025-08-02, 2026-08-01] -> 5 qualifying days -> ACTIVE; the five auto-created DRAFT CTRs are voided by the approval coverage cascade)"
            - "Clock advanced to 2027-08-02 -> sweep flips designation ACTIVE -> REVIEW_DUE (review_due_date was 2027-08-01)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: SystemAdmin }
            - call: "POST /branches"
              payload: { name: "Main", branch_code: "BR1" }
              as: SystemAdmin
              captures: { br1: $.data.id }
            - call: "POST /customers"
              payload: { legal_name: "Delta Nonlisted Inc", tin: "33-3333333", customer_type: "BUSINESS_NONLISTED", account_opened_date: "2025-06-01T00:00:00Z" }
              as: BranchManager
              captures: { c1: $.data.id }
            - { call: "POST /cash-transactions", payload: { customer_id: "${c1}", branch_id: "${br1}", direction: "CASH_IN", amount_cents: 1100000, occurred_at: "2026-07-06T10:00:00Z" }, as: Teller }
            - { call: "POST /cash-transactions", payload: { customer_id: "${c1}", branch_id: "${br1}", direction: "CASH_IN", amount_cents: 1100000, occurred_at: "2026-07-08T10:00:00Z" }, as: Teller }
            - { call: "POST /cash-transactions", payload: { customer_id: "${c1}", branch_id: "${br1}", direction: "CASH_IN", amount_cents: 1100000, occurred_at: "2026-07-10T10:00:00Z" }, as: Teller }
            - { call: "POST /cash-transactions", payload: { customer_id: "${c1}", branch_id: "${br1}", direction: "CASH_IN", amount_cents: 1100000, occurred_at: "2026-07-13T10:00:00Z" }, as: Teller }
            - { call: "POST /cash-transactions", payload: { customer_id: "${c1}", branch_id: "${br1}", direction: "CASH_IN", amount_cents: 1100000, occurred_at: "2026-07-15T10:00:00Z" }, as: Teller }
            - call: "POST /customers/${c1}/exemption-designations"
              payload: { phase: "PHASE_II" }
              as: BSAOfficer
              as_user_id: "officer-a"
              captures: { ex1: $.data.id }
            - { call: "POST /exemption-designations/${ex1}/approve", as: BSAOfficer, as_user_id: "officer-b" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-08-02T00:00:00Z" }, as: SystemAdmin }
            - call: "GET /exemption-designations/${ex1}"
              as: BSAOfficer
              captures: { ex1_v: $.data.version, ex1_status: $.data.status }
          trigger:
            - call: "POST /exemption-designations/${ex1}/complete-review"
              payload: { outcome: "PASS", expected_exemption_version: "${ex1_v}" }
              as: BSAOfficer
              as_user_id: "officer-c"
              captures: { err_review: $.data.error_id }
            - call: "POST /exemption-designations/${ex1}/complete-review"
              payload: { outcome: "FAIL", expected_exemption_version: "${ex1_v}" }
              as: BSAOfficer
              as_user_id: "officer-c"
          assert:
            - "ex1_status == 'REVIEW_DUE' (sweep fired because 2027-08-02 > review_due_date 2027-08-01)"
            - "err_review == 'ERR_PHASE_II_INELIGIBLE' (annual_review variant: window [2026-08-03, 2027-08-02] contains 0 qualifying days — the July 2026 days aged out)"
            - "After the FAIL outcome: ExemptionDesignation.${ex1}.status == 'REVOKED' and revocation_reason == 'REVIEW_FAILED'"
            - "ExemptionDesignation.${ex1}.eligibility_snapshot.qualifying_day_count == 5 (initial variant result stored at approve — unchanged by the failed PASS attempt)"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: structuring_score_combinatorial_weighted
        grounds:
          - calculations.structuring_detection
          - entities.StructuringAlert.fields.risk_score
        distinguishing_aspect: |
          Mode (a): risk_score combines >= 3 inputs (distinct_branch_count,
          distinct_day_count, near_threshold_flag, prior_referral_count) with
          nested min() caps and a conditional near-threshold branch; the
          fixture (2 branches, 3 days, max day 950000 in [900000, 1000000],
          0 priors) pins score = 40 + 8*2 + 6*3 + 15*1 + 10*0 = 89.
        test_recipe:
          setup:
            - "Branches BR1, BR2 ACTIVE; customer INDIVIDUAL tin 44-4444444 ACTIVE; clock 2026-08-01T09:00:00Z"
            - "Deposits: 950000 @BR1 on 2026-07-28; 100000 @BR1 on 2026-07-29 (window sum 1050000 but branches=1 and days=2 -> condition (4) fails -> NO alert yet)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: SystemAdmin }
            - call: "POST /branches"
              payload: { name: "Main", branch_code: "BR1" }
              as: SystemAdmin
              captures: { br1: $.data.id }
            - call: "POST /branches"
              payload: { name: "West", branch_code: "BR2" }
              as: SystemAdmin
              captures: { br2: $.data.id }
            - call: "POST /customers"
              payload: { legal_name: "Eve Person", tin: "44-4444444", customer_type: "INDIVIDUAL", account_opened_date: "2026-01-15T00:00:00Z" }
              as: BranchManager
              captures: { c1: $.data.id }
            - { call: "POST /cash-transactions", payload: { customer_id: "${c1}", branch_id: "${br1}", direction: "CASH_IN", amount_cents: 950000, occurred_at: "2026-07-28T10:00:00Z" }, as: Teller }
            - { call: "POST /cash-transactions", payload: { customer_id: "${c1}", branch_id: "${br1}", direction: "CASH_IN", amount_cents: 100000, occurred_at: "2026-07-29T10:00:00Z" }, as: Teller }
            - call: "GET /structuring-alerts"
              payload: { customer_id: "${c1}" }
              as: BSAOfficer
              captures: { pre_count: $.meta.total_count }
          trigger:
            - { call: "POST /cash-transactions", payload: { customer_id: "${c1}", branch_id: "${br2}", direction: "CASH_IN", amount_cents: 100000, occurred_at: "2026-08-01T08:00:00Z" }, as: Teller }
            - call: "GET /structuring-alerts"
              payload: { customer_id: "${c1}" }
              as: BSAOfficer
              captures: { a_score: "$.data[0].risk_score", a_amt: "$.data[0].detected_amount_cents", a_ws: "$.data[0].window_start_date", a_we: "$.data[0].window_end_date", a_status: "$.data[0].status" }
          assert:
            - "pre_count == 0 (window 1050000 exceeded the threshold after two deposits, but a single-branch 2-day pattern fails condition (4) — no alert yet)"
            - "a_status == 'OPEN'"
            - "a_ws == '2026-07-28' and a_we == '2026-08-01'"
            - "a_amt == 1150000"
            - "a_score == 89"

      - name: instrument_fee_round_per_item_then_sum
        grounds:
          - calculations.instrument_fee_calc
          - entities.MonetaryInstrumentSale.fields.fee_cents
          - entities.DailyCashAggregation.fields.instrument_fee_total_cents
        distinguishing_aspect: |
          Mode (b): nested rounding order — canonical per-item round_half_up
          then sum yields 501 + 500 = 1001 for sales of 100100 and 99900,
          while the rejected sum-then-round alternative yields 1000; the
          scaffold pins per-item-first ordering.
        test_recipe:
          setup:
            - "Branch BR1 ACTIVE; customer INDIVIDUAL tin 55-4444444 ACTIVE; clock 2026-08-01T09:00:00Z"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: SystemAdmin }
            - call: "POST /branches"
              payload: { name: "Main", branch_code: "BR1" }
              as: SystemAdmin
              captures: { br1: $.data.id }
            - call: "POST /customers"
              payload: { legal_name: "Fee Tester", tin: "55-4444444", customer_type: "INDIVIDUAL", account_opened_date: "2026-01-15T00:00:00Z" }
              as: BranchManager
              captures: { c1: $.data.id }
          trigger:
            - call: "POST /monetary-instrument-sales"
              payload: { customer_id: "${c1}", branch_id: "${br1}", instrument_type: "CASHIERS_CHECK", amount_cents: 100100, occurred_at: "2026-08-01T08:30:00Z" }
              as: Teller
              captures: { s1_fee: $.data.fee_cents }
            - call: "POST /monetary-instrument-sales"
              payload: { customer_id: "${c1}", branch_id: "${br1}", instrument_type: "CASHIERS_CHECK", amount_cents: 99900, occurred_at: "2026-08-01T08:45:00Z" }
              as: Teller
              captures: { s2_fee: $.data.fee_cents }
            - call: "GET /daily-aggregations"
              payload: { customer_id: "${c1}", business_date: "2026-08-01" }
              as: BSAOfficer
              captures: { agg_fee: "$.data[0].instrument_fee_total_cents" }
          assert:
            - "s1_fee == 501 (round_half_up(100100 * 50 / 10000) = round_half_up(500.5))"
            - "s2_fee == 500 (round_half_up(499.5))"
            - "agg_fee == 1001 (per-item rounding then sum) — not 1000 (sum-then-round of 200000 * 0.005)"

      - name: coverage_evaluation_order_circular_pin
        grounds:
          - calculations.ctr_reportability
          - calculations.phase_ii_eligibility
          - entities.DailyCashAggregation.fields.raw_reportable_in
        distinguishing_aspect: |
          Mode (c): circular-looking dependency — Phase II qualifying days are
          days where a CTR 'would be required', but CTR requirement depends on
          the exemption whose eligibility those days feed. The scaffold pins
          evaluation order: raw reportability (ignoring exemption) feeds
          eligibility; only then does coverage gate actual ctr_required. This
          instance proves a covered customer's covered days still count as
          qualifying at annual review (PASS with 5 covered days).
        test_recipe:
          setup:
            - "Branch BR1 ACTIVE; customer BUSINESS_NONLISTED tin 66-7777777 opened 2025-06-01; clock 2026-01-02T09:00:00Z"
            - "Five 1100000-cent deposits on 2025-12-08/10/12/15/17 (auto-create DRAFT CTRs); PHASE_II designation approved at 2026-01-02 (window [2025-01-03, 2026-01-02] -> 5 qualifying days; age 215 days) -> ACTIVE, review_due_date 2027-01-02; the 5 DRAFT CTRs are voided by the coverage cascade"
            - "Five more 1100000-cent deposits on 2026-12-07/09/11/14/16 WHILE EXEMPT — raw_reportable_in=true but covered_in=true, so NO CTRs are created"
            - "Clock advanced to 2027-01-03 -> sweep: 2027-01-03 > 2027-01-02 -> REVIEW_DUE; coverage lapses and the trailing-45-day recompute ([2026-11-20, 2027-01-03]) auto-creates 5 DRAFT CTRs for the December 2026 days"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-01-02T09:00:00Z" }, as: SystemAdmin }
            - call: "POST /branches"
              payload: { name: "Main", branch_code: "BR1" }
              as: SystemAdmin
              captures: { br1: $.data.id }
            - call: "POST /customers"
              payload: { legal_name: "Circular Corp", tin: "66-7777777", customer_type: "BUSINESS_NONLISTED", account_opened_date: "2025-06-01T00:00:00Z" }
              as: BranchManager
              captures: { c1: $.data.id }
            - { call: "POST /cash-transactions", payload: { customer_id: "${c1}", branch_id: "${br1}", direction: "CASH_IN", amount_cents: 1100000, occurred_at: "2025-12-08T10:00:00Z" }, as: Teller }
            - { call: "POST /cash-transactions", payload: { customer_id: "${c1}", branch_id: "${br1}", direction: "CASH_IN", amount_cents: 1100000, occurred_at: "2025-12-10T10:00:00Z" }, as: Teller }
            - { call: "POST /cash-transactions", payload: { customer_id: "${c1}", branch_id: "${br1}", direction: "CASH_IN", amount_cents: 1100000, occurred_at: "2025-12-12T10:00:00Z" }, as: Teller }
            - { call: "POST /cash-transactions", payload: { customer_id: "${c1}", branch_id: "${br1}", direction: "CASH_IN", amount_cents: 1100000, occurred_at: "2025-12-15T10:00:00Z" }, as: Teller }
            - { call: "POST /cash-transactions", payload: { customer_id: "${c1}", branch_id: "${br1}", direction: "CASH_IN", amount_cents: 1100000, occurred_at: "2025-12-17T10:00:00Z" }, as: Teller }
            - call: "POST /customers/${c1}/exemption-designations"
              payload: { phase: "PHASE_II" }
              as: BSAOfficer
              as_user_id: "officer-a"
              captures: { ex1: $.data.id }
            - { call: "POST /exemption-designations/${ex1}/approve", as: BSAOfficer, as_user_id: "officer-b" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-12-20T09:00:00Z" }, as: SystemAdmin }
            - { call: "POST /cash-transactions", payload: { customer_id: "${c1}", branch_id: "${br1}", direction: "CASH_IN", amount_cents: 1100000, occurred_at: "2026-12-07T10:00:00Z" }, as: Teller }
            - { call: "POST /cash-transactions", payload: { customer_id: "${c1}", branch_id: "${br1}", direction: "CASH_IN", amount_cents: 1100000, occurred_at: "2026-12-09T10:00:00Z" }, as: Teller }
            - { call: "POST /cash-transactions", payload: { customer_id: "${c1}", branch_id: "${br1}", direction: "CASH_IN", amount_cents: 1100000, occurred_at: "2026-12-11T10:00:00Z" }, as: Teller }
            - { call: "POST /cash-transactions", payload: { customer_id: "${c1}", branch_id: "${br1}", direction: "CASH_IN", amount_cents: 1100000, occurred_at: "2026-12-14T10:00:00Z" }, as: Teller }
            - { call: "POST /cash-transactions", payload: { customer_id: "${c1}", branch_id: "${br1}", direction: "CASH_IN", amount_cents: 1100000, occurred_at: "2026-12-16T10:00:00Z" }, as: Teller }
            - call: "GET /ctrs"
              payload: { customer_id: "${c1}", status: "DRAFT" }
              as: BSAOfficer
              captures: { live_during_exemption: $.meta.total_count }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-01-03T00:00:00Z" }, as: SystemAdmin }
            - call: "GET /exemption-designations/${ex1}"
              as: BSAOfficer
              captures: { ex_v: $.data.version }
          trigger:
            - call: "POST /exemption-designations/${ex1}/complete-review"
              payload: { outcome: "PASS", expected_exemption_version: "${ex_v}" }
              as: BSAOfficer
              as_user_id: "officer-c"
          assert:
            - "live_during_exemption == 0 (coverage suppressed CTR creation for the December 2026 days even though raw_reportable_in was true)"
            - "ExemptionDesignation.${ex1}.status == 'ACTIVE' (review PASSED — the 5 covered December days still count as qualifying because eligibility reads raw_reportable_in, ignoring coverage)"
            - "ExemptionDesignation.${ex1}.eligibility_snapshot.qualifying_day_count == 5"
            - "ExemptionDesignation.${ex1}.review_due_date == '2028-01-03'"
            - "After PASS, coverage restored: the 5 DRAFT CTRs created by the sweep are auto-VOIDED -> GET /ctrs?customer_id&status=DRAFT returns total_count == 0"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: ctr_branching_revert_and_auto_amendment_required
        grounds:
          - state_machines.CTR.DRAFT_to_VALIDATED
          - state_machines.CTR.VALIDATED_to_DRAFT
          - state_machines.CTR.VALIDATED_to_FILED
          - state_machines.CTR.FILED_to_AMENDMENT_REQUIRED
        distinguishing_aspect: |
          CTR machine is non-linear: a revert edge (VALIDATED -> DRAFT) plus a
          system auto-transition (FILED -> AMENDMENT_REQUIRED) driven by an
          external aggregate — not a linear pipeline. Exercised here on entity
          CTR; the sibling instances use different entities.
        test_recipe:
          setup:
            - "Branch BR1 ACTIVE; customer INDIVIDUAL tin 55-5555555 ACTIVE; clock 2026-08-01T09:00:00Z"
            - "Deposits 600000 + 500000 on 2026-08-01 -> DRAFT CTR auto-created with snapshot_cash_in_cents 1100000"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: SystemAdmin }
            - call: "POST /branches"
              payload: { name: "Main", branch_code: "BR1" }
              as: SystemAdmin
              captures: { br1: $.data.id }
            - call: "POST /customers"
              payload: { legal_name: "Nora Lynn", tin: "55-5555555", customer_type: "INDIVIDUAL", account_opened_date: "2026-01-15T00:00:00Z" }
              as: BranchManager
              captures: { c1: $.data.id }
            - { call: "POST /cash-transactions", payload: { customer_id: "${c1}", branch_id: "${br1}", direction: "CASH_IN", amount_cents: 600000, occurred_at: "2026-08-01T08:00:00Z" }, as: Teller }
            - { call: "POST /cash-transactions", payload: { customer_id: "${c1}", branch_id: "${br1}", direction: "CASH_IN", amount_cents: 500000, occurred_at: "2026-08-01T08:30:00Z" }, as: Teller }
            - call: "GET /ctrs"
              payload: { customer_id: "${c1}" }
              as: BSAOfficer
              captures: { ctr1: "$.data[0].id" }
          trigger:
            - call: "POST /ctrs/${ctr1}/validate"
              as: ComplianceAnalyst
              as_user_id: "analyst-x"
              captures: { st1: $.data.status, vb1: $.data.validated_by_id }
            - call: "POST /ctrs/${ctr1}/return-to-draft"
              as: ComplianceAnalyst
              as_user_id: "analyst-x"
              captures: { st2: $.data.status, vb2: $.data.validated_by_id }
            - call: "POST /ctrs/${ctr1}/validate"
              as: ComplianceAnalyst
              as_user_id: "analyst-x"
            - call: "POST /ctrs/${ctr1}/file"
              payload: { filing_channel: "EFILE" }
              as: BSAOfficer
              as_user_id: "officer-y"
              captures: { st3: $.data.status, late3: $.data.filed_late }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T15:00:00Z" }, as: SystemAdmin }
            - { call: "POST /cash-transactions", payload: { customer_id: "${c1}", branch_id: "${br1}", direction: "CASH_IN", amount_cents: 200000, occurred_at: "2026-08-01T14:00:00Z" }, as: Teller }
            - call: "GET /ctrs/${ctr1}"
              as: BSAOfficer
              captures: { st4: $.data.status, snap4: $.data.snapshot_cash_in_cents }
          assert:
            - "st1 == 'VALIDATED' and vb1 == 'analyst-x'"
            - "st2 == 'DRAFT' and vb2 == null (revert clears the validator)"
            - "st3 == 'FILED' and late3 == false (filed 2026-08-01, efile due 2026-08-16)"
            - "st4 == 'AMENDMENT_REQUIRED' (auto-transition: aggregation 1300000 diverged from frozen snapshot 1100000)"
            - "snap4 == 1100000 (FILED snapshots never live-refresh)"

      - name: exemption_review_cycle_active_review_due_active
        grounds:
          - state_machines.ExemptionDesignation.ACTIVE_to_REVIEW_DUE
          - state_machines.ExemptionDesignation.REVIEW_DUE_to_ACTIVE
        distinguishing_aspect: |
          ExemptionDesignation machine is cyclic: ACTIVE -> REVIEW_DUE
          (system sweep, fired only when current date is STRICTLY past
          review_due_date) -> ACTIVE (passed review) — a loop that can repeat
          annually. Different entity than the CTR instance.
        test_recipe:
          setup:
            - "Customer GOVERNMENT_AGENCY tin 66-6666666 opened 2020-01-01; clock 2026-01-02T09:00:00Z"
            - "PHASE_I designation created (officer-a) and approved (officer-b) -> ACTIVE, review_due_date 2027-01-02"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-01-02T09:00:00Z" }, as: SystemAdmin }
            - call: "POST /branches"
              payload: { name: "Main", branch_code: "BR1" }
              as: SystemAdmin
              captures: { br1: $.data.id }
            - call: "POST /customers"
              payload: { legal_name: "City Transit Authority", tin: "66-6666666", customer_type: "GOVERNMENT_AGENCY", account_opened_date: "2020-01-01T00:00:00Z" }
              as: BranchManager
              captures: { c1: $.data.id }
            - call: "POST /customers/${c1}/exemption-designations"
              payload: { phase: "PHASE_I" }
              as: BSAOfficer
              as_user_id: "officer-a"
              captures: { ex1: $.data.id }
            - { call: "POST /exemption-designations/${ex1}/approve", as: BSAOfficer, as_user_id: "officer-b" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-01-02T23:00:00Z" }, as: SystemAdmin }
            - call: "GET /exemption-designations/${ex1}"
              as: BSAOfficer
              captures: { st_boundary: $.data.status }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-01-03T00:00:00Z" }, as: SystemAdmin }
            - call: "GET /exemption-designations/${ex1}"
              as: BSAOfficer
              captures: { st_due: $.data.status, ex_v: $.data.version }
          trigger:
            - call: "POST /exemption-designations/${ex1}/complete-review"
              payload: { outcome: "PASS", expected_exemption_version: "${ex_v}" }
              as: BSAOfficer
              as_user_id: "officer-c"
              captures: { st_final: $.data.status, due_final: $.data.review_due_date }
          assert:
            - "st_boundary == 'ACTIVE' (2027-01-02 == review_due_date 2027-01-02 — sweep requires strictly-greater, so no flip yet)"
            - "st_due == 'REVIEW_DUE' (2027-01-03 > 2027-01-02)"
            - "st_final == 'ACTIVE' (cycle completed)"
            - "due_final == '2028-01-03' (date of review 2027-01-03 + 365 days)"

      - name: finding_remediation_revert_loop
        grounds:
          - state_machines.ExaminationFinding.OPEN_to_REMEDIATED
          - state_machines.ExaminationFinding.REMEDIATED_to_OPEN
          - state_machines.ExaminationFinding.REMEDIATED_to_VERIFIED
        distinguishing_aspect: |
          ExaminationFinding has a revert loop (REMEDIATED -> OPEN on
          rejection) inside an OPEN -> REMEDIATED -> VERIFIED ladder — a third
          non-linear machine on a third entity type.
        test_recipe:
          setup:
            - "Branch BR1, customer INDIVIDUAL tin 77-7777777, one posted cash transaction (finding target)"
            - "Examination case FINCEN CASE-100 in FIELDWORK"
            - "Finding (DEFICIENCY, target CASH_TRANSACTION) recorded -> OPEN"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: SystemAdmin }
            - call: "POST /branches"
              payload: { name: "Main", branch_code: "BR1" }
              as: SystemAdmin
              captures: { br1: $.data.id }
            - call: "POST /customers"
              payload: { legal_name: "Finding Target LLC", tin: "77-7777777", customer_type: "INDIVIDUAL", account_opened_date: "2026-01-15T00:00:00Z" }
              as: BranchManager
              captures: { c1: $.data.id }
            - call: "POST /cash-transactions"
              payload: { customer_id: "${c1}", branch_id: "${br1}", direction: "CASH_IN", amount_cents: 500000, occurred_at: "2026-08-01T08:00:00Z" }
              as: Teller
              captures: { txn1: $.data.id }
            - call: "POST /examination-cases"
              payload: { regulator: "FINCEN", case_number: "CASE-100", scope_start_date: "2025-01-01", scope_end_date: "2026-01-01" }
              as: Examiner
              captures: { case1: $.data.id }
            - { call: "POST /examination-cases/${case1}/begin-fieldwork", as: Examiner }
            - call: "POST /examination-cases/${case1}/findings"
              payload: { severity: "DEFICIENCY", target_type: "CASH_TRANSACTION", target_id: "${txn1}", description: "conductor field missing on large deposit" }
              as: Examiner
              captures: { f1: $.data.id }
          trigger:
            - call: "POST /examination-findings/${f1}/remediate"
              payload: { remediation_note: "teller retrained" }
              as: BSAOfficer
              as_user_id: "officer-y"
              captures: { fs1: $.data.status }
            - call: "POST /examination-findings/${f1}/reject-remediation"
              payload: { note: "insufficient — no evidence of retraining" }
              as: Examiner
              captures: { fs2: $.data.status }
            - call: "POST /examination-findings/${f1}/remediate"
              payload: { remediation_note: "retraining certificates attached" }
              as: BSAOfficer
              as_user_id: "officer-y"
              captures: { fs3: $.data.status }
            - call: "POST /examination-findings/${f1}/verify"
              as: Examiner
              captures: { fs4: $.data.status }
          assert:
            - "fs1 == 'REMEDIATED'"
            - "fs2 == 'OPEN' (revert loop)"
            - "fs3 == 'REMEDIATED'"
            - "fs4 == 'VERIFIED' (terminal)"
            - "ExaminationFinding.${f1}.remediation_note == 'retraining certificates attached'"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: txn_create_to_ctr_amendment_required_cascade
        grounds:
          - state_machines.CashTransaction.transitions
          - calculations.daily_cash_aggregation
          - calculations.ctr_reportability
          - state_machines.CTR.FILED_to_AMENDMENT_REQUIRED
          - calculations.audit_hash_chain
        distinguishing_aspect: |
          Depth-3 chain with each link caused by the previous one:
          CashTransaction create -> DailyCashAggregation totals mutate ->
          aggregation divergence flips the FILED CTR to AMENDMENT_REQUIRED ->
          the CTR auto-transition appends its own SYSTEM AuditEvent. Trigger:
          POST /cash-transactions (different trigger than the sibling cascade).
        test_recipe:
          setup:
            - "Branch BR1; customer INDIVIDUAL tin 88-8888888; clock 2026-08-01T09:00:00Z"
            - "Deposit 1100000 on 2026-08-01 -> DRAFT CTR; validate (analyst-x); file EFILE (officer-y) -> FILED, frozen snapshot 1100000"
            - "Clock advanced to 2026-08-01T15:00:00Z"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: SystemAdmin }
            - call: "POST /branches"
              payload: { name: "Main", branch_code: "BR1" }
              as: SystemAdmin
              captures: { br1: $.data.id }
            - call: "POST /customers"
              payload: { legal_name: "Cascade One", tin: "88-8888888", customer_type: "INDIVIDUAL", account_opened_date: "2026-01-15T00:00:00Z" }
              as: BranchManager
              captures: { c1: $.data.id }
            - { call: "POST /cash-transactions", payload: { customer_id: "${c1}", branch_id: "${br1}", direction: "CASH_IN", amount_cents: 1100000, occurred_at: "2026-08-01T10:00:00Z" }, as: Teller }
            - call: "GET /ctrs"
              payload: { customer_id: "${c1}" }
              as: BSAOfficer
              captures: { ctr1: "$.data[0].id" }
            - { call: "POST /ctrs/${ctr1}/validate", as: ComplianceAnalyst, as_user_id: "analyst-x" }
            - { call: "POST /ctrs/${ctr1}/file", payload: { filing_channel: "EFILE" }, as: BSAOfficer, as_user_id: "officer-y" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T15:00:00Z" }, as: SystemAdmin }
          trigger:
            - { call: "POST /cash-transactions", payload: { customer_id: "${c1}", branch_id: "${br1}", direction: "CASH_IN", amount_cents: 250000, occurred_at: "2026-08-01T14:00:00Z" }, as: Teller }
            - call: "GET /daily-aggregations"
              payload: { customer_id: "${c1}", business_date: "2026-08-01" }
              as: BSAOfficer
              captures: { agg_in: "$.data[0].total_cash_in_cents" }
            - call: "GET /ctrs/${ctr1}"
              as: BSAOfficer
              captures: { ctr_st: $.data.status }
            - call: "GET /audit-events"
              payload: { entity_type: "CTR", entity_id: "${ctr1}" }
              as: BSAOfficer
              captures: { ctr_events: $.meta.total_count }
            - call: "GET /audit-events/verify-chain"
              as: BSAOfficer
              captures: { chain_ok: $.data.chain_valid }
          assert:
            - "agg_in == 1350000 (link 1: aggregation mutated by the new deposit)"
            - "ctr_st == 'AMENDMENT_REQUIRED' (link 2: divergence 1350000 != snapshot 1100000 flipped the FILED CTR automatically)"
            - "ctr_events == 4 (link 3 + history: auto-create, validate, file, auto-AMENDMENT_REQUIRED — each appended its own AuditEvent)"
            - "chain_ok == true"

      - name: exemption_revoke_to_ctr_autocreate_cascade
        grounds:
          - state_machines.ExemptionDesignation.ACTIVE_to_REVOKED
          - calculations.ctr_reportability
          - entities.DailyCashAggregation.fields.covered_in
        distinguishing_aspect: |
          Different trigger than the sibling cascade (POST
          /exemption-designations/{id}/revoke, not a transaction post).
          Depth-2+ chain: designation mutates to REVOKED -> coverage removal
          mutates covered_in on trailing-45-day aggregations -> each
          newly-required day with no live CTR auto-creates a DRAFT CTR (3
          rows) -> each auto-creation appends a SYSTEM AuditEvent.
        test_recipe:
          setup:
            - "Branch BR1; customer GOVERNMENT_AGENCY tin 99-1111111 opened 2020-01-01; clock 2026-08-01T09:00:00Z"
            - "PHASE_I designation approved -> ACTIVE (covers both directions)"
            - "Three 1100000-cent deposits on 2026-07-28/29/30 — covered, so zero CTRs exist"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: SystemAdmin }
            - call: "POST /branches"
              payload: { name: "Main", branch_code: "BR1" }
              as: SystemAdmin
              captures: { br1: $.data.id }
            - call: "POST /customers"
              payload: { legal_name: "City Water District", tin: "99-1111111", customer_type: "GOVERNMENT_AGENCY", account_opened_date: "2020-01-01T00:00:00Z" }
              as: BranchManager
              captures: { c1: $.data.id }
            - call: "POST /customers/${c1}/exemption-designations"
              payload: { phase: "PHASE_I" }
              as: BSAOfficer
              as_user_id: "officer-a"
              captures: { ex1: $.data.id }
            - { call: "POST /exemption-designations/${ex1}/approve", as: BSAOfficer, as_user_id: "officer-b" }
            - { call: "POST /cash-transactions", payload: { customer_id: "${c1}", branch_id: "${br1}", direction: "CASH_IN", amount_cents: 1100000, occurred_at: "2026-07-28T10:00:00Z" }, as: Teller }
            - { call: "POST /cash-transactions", payload: { customer_id: "${c1}", branch_id: "${br1}", direction: "CASH_IN", amount_cents: 1100000, occurred_at: "2026-07-29T10:00:00Z" }, as: Teller }
            - { call: "POST /cash-transactions", payload: { customer_id: "${c1}", branch_id: "${br1}", direction: "CASH_IN", amount_cents: 1100000, occurred_at: "2026-07-30T10:00:00Z" }, as: Teller }
            - call: "GET /ctrs"
              payload: { customer_id: "${c1}" }
              as: BSAOfficer
              captures: { pre_ctrs: $.meta.total_count }
          trigger:
            - { call: "POST /exemption-designations/${ex1}/revoke", payload: { reason: "customer request withdrawal" }, as: BSAOfficer, as_user_id: "officer-b" }
            - call: "GET /ctrs"
              payload: { customer_id: "${c1}", status: "DRAFT" }
              as: BSAOfficer
              captures: { post_ctrs: $.meta.total_count, first_snap: "$.data[0].snapshot_cash_in_cents" }
            - call: "GET /daily-aggregations"
              payload: { customer_id: "${c1}", business_date: "2026-07-28" }
              as: BSAOfficer
              captures: { cov_in: "$.data[0].covered_in", req: "$.data[0].ctr_required" }
          assert:
            - "pre_ctrs == 0 (Phase I coverage suppressed all three days)"
            - "ExemptionDesignation.${ex1}.status == 'REVOKED' and revocation_reason == 'MANUAL_REVOKE'"
            - "cov_in == false and req == true (link 1->2: coverage flip mutated the aggregations)"
            - "post_ctrs == 3 (link 2->3: one auto-created DRAFT CTR per newly-required day in the trailing 45 dates)"
            - "first_snap == 1100000"

  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: amend_state_error_beats_temporal_error
        grounds:
          - validations[priority=6]  # ERR_CTR_NOT_AMENDABLE (state)
          - validations[priority=9]  # ERR_AMENDMENT_WINDOW_EXPIRED (business_temporal)
          - state_machines.CTR.FILED_to_SUPERSEDED
        distinguishing_aspect: |
          Error-category pair (state vs business_temporal): amending an
          already-SUPERSEDED CTR with the amendment window ALSO expired
          returns ERR_CTR_NOT_AMENDABLE (priority 6 beats 9).
        test_recipe:
          setup:
            - "Branch BR1; customer INDIVIDUAL tin 12-1212121; clock 2026-08-01T09:00:00Z"
            - "Deposit 1100000 on 2026-08-01 -> CTR; validate; file EFILE -> FILED"
            - "Amendment #1 succeeds (original -> SUPERSEDED, successor DRAFT created)"
            - "Clock advanced to 2026-09-20 (business_date + 45 = 2026-09-15 -> window expired)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: SystemAdmin }
            - call: "POST /branches"
              payload: { name: "Main", branch_code: "BR1" }
              as: SystemAdmin
              captures: { br1: $.data.id }
            - call: "POST /customers"
              payload: { legal_name: "Prio One", tin: "12-1212121", customer_type: "INDIVIDUAL", account_opened_date: "2026-01-15T00:00:00Z" }
              as: BranchManager
              captures: { c1: $.data.id }
            - { call: "POST /cash-transactions", payload: { customer_id: "${c1}", branch_id: "${br1}", direction: "CASH_IN", amount_cents: 1100000, occurred_at: "2026-08-01T10:00:00Z" }, as: Teller }
            - call: "GET /ctrs"
              payload: { customer_id: "${c1}" }
              as: BSAOfficer
              captures: { ctr1: "$.data[0].id" }
            - { call: "POST /ctrs/${ctr1}/validate", as: ComplianceAnalyst, as_user_id: "analyst-x" }
            - { call: "POST /ctrs/${ctr1}/file", payload: { filing_channel: "EFILE" }, as: BSAOfficer, as_user_id: "officer-y" }
            - call: "GET /ctrs/${ctr1}"
              as: BSAOfficer
              captures: { ctr1_v: $.data.version }
            - { call: "POST /ctrs/${ctr1}/amendments", payload: { amendment_reason: "amount correction", expected_ctr_version: "${ctr1_v}" }, as: BSAOfficer, as_user_id: "officer-y" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-20T00:00:00Z" }, as: SystemAdmin }
            - call: "GET /ctrs/${ctr1}"
              as: BSAOfficer
              captures: { ctr1_v2: $.data.version, ctr1_st: $.data.status }
          trigger:
            - call: "POST /ctrs/${ctr1}/amendments"
              payload: { amendment_reason: "second attempt", expected_ctr_version: "${ctr1_v2}" }
              as: BSAOfficer
              as_user_id: "officer-y"
              captures: { err: $.data.error_id }
          assert:
            - "ctr1_st == 'SUPERSEDED'"
            - "err == 'ERR_CTR_NOT_AMENDABLE' — the state check (priority 6) wins over the amendment-window temporal check (priority 9), even though BOTH fail"
            - "expected_ctr_version is fresh (OCC passes), isolating the state-vs-temporal ordering"

      - name: open_alert_safety_beats_ineligibility_constraint
        grounds:
          - validations[priority=7]  # ERR_OPEN_ALERT_BLOCKS_EXEMPTION (business_safety)
          - validations[priority=8]  # ERR_PHASE_II_INELIGIBLE (business_constraint)
        distinguishing_aspect: |
          Error-category pair (business_safety vs business_constraint),
          different from the sibling instance's (state vs business_temporal):
          approving a PHASE_II designation while the customer has an OPEN
          structuring alert AND fails eligibility (age 47 < 60 days, 0
          qualifying days) returns ERR_OPEN_ALERT_BLOCKS_EXEMPTION.
        test_recipe:
          setup:
            - "Branches BR1, BR2; customer BUSINESS_NONLISTED tin 23-2323232 opened 2026-06-15 (47 days old at 2026-08-01); clock 2026-08-01T09:00:00Z"
            - "Structuring pattern 950000@BR1 (2026-07-28), 100000@BR1 (07-29), 100000@BR2 (07-30) -> AUTO alert OPEN (sum 1150000 > 1000000, max day 950000 <= 1000000, 3 days, 2 branches)"
            - "PHASE_II designation created by officer-a (create does not check eligibility) -> PENDING_REVIEW"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: SystemAdmin }
            - call: "POST /branches"
              payload: { name: "Main", branch_code: "BR1" }
              as: SystemAdmin
              captures: { br1: $.data.id }
            - call: "POST /branches"
              payload: { name: "West", branch_code: "BR2" }
              as: SystemAdmin
              captures: { br2: $.data.id }
            - call: "POST /customers"
              payload: { legal_name: "Risky Business LLC", tin: "23-2323232", customer_type: "BUSINESS_NONLISTED", account_opened_date: "2026-06-15T00:00:00Z" }
              as: BranchManager
              captures: { c1: $.data.id }
            - { call: "POST /cash-transactions", payload: { customer_id: "${c1}", branch_id: "${br1}", direction: "CASH_IN", amount_cents: 950000, occurred_at: "2026-07-28T10:00:00Z" }, as: Teller }
            - { call: "POST /cash-transactions", payload: { customer_id: "${c1}", branch_id: "${br1}", direction: "CASH_IN", amount_cents: 100000, occurred_at: "2026-07-29T10:00:00Z" }, as: Teller }
            - { call: "POST /cash-transactions", payload: { customer_id: "${c1}", branch_id: "${br2}", direction: "CASH_IN", amount_cents: 100000, occurred_at: "2026-07-30T10:00:00Z" }, as: Teller }
            - call: "POST /customers/${c1}/exemption-designations"
              payload: { phase: "PHASE_II" }
              as: BSAOfficer
              as_user_id: "officer-a"
              captures: { ex1: $.data.id }
          trigger:
            - call: "POST /exemption-designations/${ex1}/approve"
              as: BSAOfficer
              as_user_id: "officer-b"
              captures: { err: $.data.error_id }
          assert:
            - "err == 'ERR_OPEN_ALERT_BLOCKS_EXEMPTION' — safety gate (priority 7) beats the eligibility constraint (priority 8), even though BOTH fail"
            - "ExemptionDesignation.${ex1}.status == 'PENDING_REVIEW' (no state change on rejection)"

  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: ctr_threshold_exactly_10000_vs_one_cent_over
        grounds:
          - calculations.ctr_reportability
          - entities.DailyCashAggregation.fields.raw_reportable_in
        distinguishing_aspect: |
          Metric: daily aggregated cash-in cents; endpoint: POST
          /cash-transactions. Strictly-greater boundary: exactly 1000000 cents
          is NOT reportable; 1000001 is — the +1-cent deposit flips
          raw_reportable_in and auto-creates the DRAFT CTR.
        test_recipe:
          setup:
            - "Branch BR1; customer INDIVIDUAL tin 34-3434343; clock 2026-08-01T12:00:00Z"
            - "Deposits 600000 and 400000 on 2026-08-01 -> total exactly 1000000"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T12:00:00Z" }, as: SystemAdmin }
            - call: "POST /branches"
              payload: { name: "Main", branch_code: "BR1" }
              as: SystemAdmin
              captures: { br1: $.data.id }
            - call: "POST /customers"
              payload: { legal_name: "Boundary Bob", tin: "34-3434343", customer_type: "INDIVIDUAL", account_opened_date: "2026-01-15T00:00:00Z" }
              as: BranchManager
              captures: { c1: $.data.id }
            - { call: "POST /cash-transactions", payload: { customer_id: "${c1}", branch_id: "${br1}", direction: "CASH_IN", amount_cents: 600000, occurred_at: "2026-08-01T10:00:00Z" }, as: Teller }
            - { call: "POST /cash-transactions", payload: { customer_id: "${c1}", branch_id: "${br1}", direction: "CASH_IN", amount_cents: 400000, occurred_at: "2026-08-01T10:30:00Z" }, as: Teller }
            - call: "GET /daily-aggregations"
              payload: { customer_id: "${c1}", business_date: "2026-08-01" }
              as: BSAOfficer
              captures: { agg_total: "$.data[0].total_cash_in_cents", agg_raw: "$.data[0].raw_reportable_in" }
            - call: "GET /ctrs"
              payload: { customer_id: "${c1}" }
              as: BSAOfficer
              captures: { pre_ctrs: $.meta.total_count }
          trigger:
            - { call: "POST /cash-transactions", payload: { customer_id: "${c1}", branch_id: "${br1}", direction: "CASH_IN", amount_cents: 1, occurred_at: "2026-08-01T11:00:00Z" }, as: Teller }
            - call: "GET /ctrs"
              payload: { customer_id: "${c1}" }
              as: BSAOfficer
              captures: { post_ctrs: $.meta.total_count, snap: "$.data[0].snapshot_cash_in_cents", st: "$.data[0].status" }
          assert:
            - "agg_total == 1000000 and agg_raw == false (exactly at threshold: NOT reportable — rule is strictly greater)"
            - "pre_ctrs == 0"
            - "post_ctrs == 1 and st == 'DRAFT' and snap == 1000001 (one cent over flips reportability)"

      - name: instrument_recordkeeping_band_floor_2999_vs_3000
        grounds:
          - validations[priority=8]  # ERR_INSTRUMENT_RECORD_INCOMPLETE
          - entities.MonetaryInstrumentSale.fields.record_required
        distinguishing_aspect: |
          Different metric (single instrument amount cents) and different
          endpoint (POST /monetary-instrument-sales) than the CTR-threshold
          instance: 299999 cents needs no purchaser record; 300000 cents
          (band floor, inclusive) requires all four purchaser_* fields.
        test_recipe:
          setup:
            - "Branch BR1; customer INDIVIDUAL tin 45-4545454; clock 2026-08-01T09:00:00Z"
          setup_api_calls:
