          setup_api_calls:
            - { call: "POST /campus-security-authorities", payload: { full_name: "Pat Prof", email: "pat@example.edu", department: "Faculty", csa_category: "OTHER_OFFICIAL" }, as: SystemAdmin, captures: { c: $.data.id } }
            - { call: "POST /campus-security-authorities/${c}/training-records", payload: { completed_at: "2026-06-20T10:00:00Z", score: 90 }, as: SystemAdmin }
            - { call: "POST /clery-geographies", payload: { name: "N", category: "ON_CAMPUS", is_residential_facility: false }, as: SystemAdmin, captures: { g: $.data.id } }
            - { call: "POST /incident-reports", payload: { reported_at: "2026-04-13T09:00:00Z", occurred_at: "2026-04-13T08:00:00Z", geography_id: "${g}", source: "POLICE_DIRECT", narrative: "x" }, as: PoliceChief, captures: { i: $.data.id } }
            - { call: "POST /incident-reports/${i}/submit", payload: {}, as: PoliceChief }
            - { call: "POST /incident-reports/${i}/begin-classification", payload: {}, as: CleryCoordinator, captures: { iv: $.data.version } }
          trigger:
            - { call: "POST /incident-reports/${i}/classify", payload: { geography_id: "${g}", offense_counts: [ { offense_type: "BURGLARY", victim_count: 1 } ], expected_incident_version: "${iv}" }, as: CampusSecurityAuthority, as_user_id: "${c}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_FORBIDDEN, HTTP 403"

      - name: coordinator_cannot_authorize_alert
        claim_type: segregation_of_duties
        grounds: [roles.CleryCoordinator, roles.PoliceChief, "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "Segregation of duties: the role that decides an alert (CleryCoordinator) cannot also authorize its dissemination."
        test_recipe:
          setup: ["alert DECIDED_ISSUE"]
          setup_api_calls:
            - { call: "POST /clery-geographies", payload: { name: "M", category: "ON_CAMPUS", is_residential_facility: false }, as: SystemAdmin, captures: { g: $.data.id } }
            - { call: "POST /incident-reports", payload: { reported_at: "2026-07-29T09:00:00Z", occurred_at: "2026-07-29T08:00:00Z", geography_id: "${g}", source: "POLICE_DIRECT", narrative: "x" }, as: PoliceChief, captures: { i: $.data.id } }
            - { call: "POST /incident-reports/${i}/submit", payload: {}, as: PoliceChief }
            - { call: "POST /incident-reports/${i}/safety-alerts", payload: { alert_type: "TIMELY_WARNING" }, as: CleryCoordinator, captures: { a: $.data.id } }
            - { call: "POST /safety-alerts/${a}/decide", payload: { decision: "ISSUE", decision_rationale: "threat" }, as: CleryCoordinator }
          trigger:
            - { call: "POST /safety-alerts/${a}/authorize", payload: {}, as: CleryCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_FORBIDDEN, HTTP 403; status remains DECIDED_ISSUE"

      - name: chief_cannot_decide_alert
        claim_type: segregation_of_duties
        grounds: [roles.PoliceChief, "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "The authorizing role (PoliceChief) cannot perform the decide step."
        test_recipe:
          setup: ["alert PENDING_REVIEW"]
          setup_api_calls:
            - { call: "POST /clery-geographies", payload: { name: "L", category: "ON_CAMPUS", is_residential_facility: false }, as: SystemAdmin, captures: { g: $.data.id } }
            - { call: "POST /incident-reports", payload: { reported_at: "2026-07-29T10:00:00Z", occurred_at: "2026-07-29T09:00:00Z", geography_id: "${g}", source: "POLICE_DIRECT", narrative: "x" }, as: PoliceChief, captures: { i: $.data.id } }
            - { call: "POST /incident-reports/${i}/submit", payload: {}, as: PoliceChief }
            - { call: "POST /incident-reports/${i}/safety-alerts", payload: { alert_type: "TIMELY_WARNING" }, as: CleryCoordinator, captures: { a: $.data.id } }
          trigger:
            - { call: "POST /safety-alerts/${a}/decide", payload: { decision: "ISSUE", decision_rationale: "x" }, as: PoliceChief, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_FORBIDDEN, HTTP 403"

      - name: coordinator_cannot_advance_review
        claim_type: role_denial
        grounds: [roles.FederalReviewer, "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "Program review advancement is FederalReviewer-only."
        test_recipe:
          setup: ["review OPENED"]
          setup_api_calls:
            - { call: "POST /program-reviews", payload: { scope_year_start: 2020, scope_year_end: 2020 }, as: FederalReviewer, captures: { pr: $.data.id } }
          trigger:
            - { call: "POST /program-reviews/${pr}/advance", payload: {}, as: CleryCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_FORBIDDEN, HTTP 403"

      - name: csa_cannot_forward_others_referral
        claim_type: role_denial
        grounds: [roles.CampusSecurityAuthority, "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "Entity-backed ownership: a CSA may forward only referrals whose csa_id equals the caller's X-User-ID."
        test_recipe:
          setup: ["two ACTIVE CSAs; referral created by CSA1"]
          setup_api_calls:
            - { call: "POST /campus-security-authorities", payload: { full_name: "One", email: "one@example.edu", department: "A", csa_category: "DEAN" }, as: SystemAdmin, captures: { c1: $.data.id } }
            - { call: "POST /campus-security-authorities/${c1}/training-records", payload: { completed_at: "2026-06-01T10:00:00Z", score: 90 }, as: SystemAdmin }
            - { call: "POST /campus-security-authorities", payload: { full_name: "Two", email: "two@example.edu", department: "B", csa_category: "COACH" }, as: SystemAdmin, captures: { c2: $.data.id } }
            - { call: "POST /campus-security-authorities/${c2}/training-records", payload: { completed_at: "2026-06-01T10:00:00Z", score: 90 }, as: SystemAdmin }
            - { call: "POST /clery-geographies", payload: { name: "K", category: "ON_CAMPUS", is_residential_facility: false }, as: SystemAdmin, captures: { g: $.data.id } }
            - { call: "POST /csa-referral-reports", payload: { occurred_at: "2026-07-30T21:00:00Z", geography_id: "${g}", offense_suspicion: "STALKING", narrative: "x" }, as: CampusSecurityAuthority, as_user_id: "${c1}", captures: { r: $.data.id } }
          trigger:
            - { call: "POST /csa-referral-reports/${r}/forward", payload: {}, as: CampusSecurityAuthority, as_user_id: "${c2}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_FORBIDDEN, HTTP 403; status remains RECEIVED"

      - name: coordinator_cannot_publish_asr
        claim_type: segregation_of_duties
        grounds: [roles.CleryCoordinator, roles.PoliceChief, "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "The compiling role cannot publish the ASR; publication is PoliceChief-only."
        test_recipe:
          setup: ["ASR UNDER_REVIEW"]
          setup_api_calls:
            - { call: "POST /annual-security-reports", payload: { report_year: 2026 }, as: SystemAdmin, captures: { asr: $.data.id, av: $.data.version } }
            - { call: "POST /annual-security-reports/${asr}/compile", payload: { variant: "FINAL", expected_report_version: "${av}" }, as: CleryCoordinator }
            - { call: "POST /annual-security-reports/${asr}/submit-review", payload: {}, as: CleryCoordinator }
          trigger:
            - { call: "POST /annual-security-reports/${asr}/publish", payload: {}, as: CleryCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_FORBIDDEN, HTTP 403; status remains UNDER_REVIEW"

      - name: anonymous_cannot_fulfill_inspection
        claim_type: role_denial
        grounds: [roles.Anonymous, "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "Fulfillment is staff work; Anonymous is denied even for its own request."
        test_recipe:
          setup: ["one PENDING inspection request (old window)"]
          setup_api_calls:
            - { call: "POST /clery-geographies", payload: { name: "J", category: "ON_CAMPUS", is_residential_facility: false }, as: SystemAdmin, captures: { g: $.data.id } }
            - { call: "POST /incident-reports", payload: { reported_at: "2026-05-01T09:00:00Z", occurred_at: "2026-05-01T08:00:00Z", geography_id: "${g}", source: "POLICE_DIRECT", narrative: "x" }, as: PoliceChief, captures: { i: $.data.id } }
            - { call: "POST /incident-reports/${i}/submit", payload: {}, as: PoliceChief }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T10:00:00Z" }, as: SystemAdmin }
            - { call: "POST /daily-crime-log/inspection-requests", payload: { requester_name: "Jo", requester_contact: "jo@example.com", from_date: "2026-05-01", to_date: "2026-05-02" }, as: Anonymous, captures: { lir: $.data.id } }
          trigger:
            - { call: "POST /log-inspection-requests/${lir}/fulfill", payload: {}, as: Anonymous, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_FORBIDDEN, HTTP 403; status remains PENDING"

  # ============================================================
  # Section: cross-cutting complexity layers
  # ============================================================
  - section: complexity_layers
    instances:
      - name: occ_stale_version_on_classify_returns_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[classify-incident-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "classify with expected_incident_version one behind the current version yields ERR_STALE_VERSION 412 while the incident is still UNDER_CLASSIFICATION."
        test_recipe:
          setup: ["incident UNDER_CLASSIFICATION at version 3 (create 1, submit 2, begin-classification 3)"]
          setup_api_calls:
            - { call: "POST /clery-geographies", payload: { name: "I", category: "ON_CAMPUS", is_residential_facility: false }, as: SystemAdmin, captures: { g: $.data.id } }
            - { call: "POST /incident-reports", payload: { reported_at: "2026-04-14T09:00:00Z", occurred_at: "2026-04-14T08:00:00Z", geography_id: "${g}", source: "POLICE_DIRECT", narrative: "x" }, as: PoliceChief, captures: { i: $.data.id } }
            - { call: "POST /incident-reports/${i}/submit", payload: {}, as: PoliceChief }
            - { call: "POST /incident-reports/${i}/begin-classification", payload: {}, as: CleryCoordinator, captures: { iv: $.data.version } }
          trigger:
            - { call: "POST /incident-reports/${i}/classify", payload: { geography_id: "${g}", offense_counts: [ { offense_type: "BURGLARY", victim_count: 1 } ], expected_incident_version: "${iv} - 1" }, as: CleryCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_STALE_VERSION, HTTP 412"
            - "IncidentReport.${i}.status remains UNDER_CLASSIFICATION and version remains ${iv}"

      - name: occ_stale_version_on_compile_returns_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[compile-asr-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "After a successful compile bumps the report version, a second compile carrying the pre-compile version yields ERR_STALE_VERSION 412."
        test_recipe:
          setup: ["ASR 2026 COLLECTING at version 1"]
          setup_api_calls:
            - { call: "POST /annual-security-reports", payload: { report_year: 2026 }, as: SystemAdmin, captures: { asr: $.data.id, av: $.data.version } }
          trigger:
            - { call: "POST /annual-security-reports/${asr}/compile", payload: { variant: "FINAL", expected_report_version: "${av}" }, as: CleryCoordinator, captures: { av2: $.data.version } }
            - { call: "POST /annual-security-reports/${asr}/compile", payload: { variant: "FINAL", expected_report_version: "${av}" }, as: CleryCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "First compile: success, version advanced to ${av2} == ${av} + 1 and statistics_version == 1"
            - "Second compile with the stale expected version: error_id == ERR_STALE_VERSION, HTTP 412; statistics_version stays 1"

      - name: derived_staleness_reconciled_on_recompile
        claim_type: derived_field_reconciliation
        grounds: [entities.AnnualSecurityReport.fields.statistics_stale]
        excluded_because:
          difficulty_instance: reclassification_count_conservation
          rationale: "statistics_stale clearing on recompile is asserted in the named §1.8 instance (final compile leaves statistics_stale == false)."

  # ============================================================
  # Section: consistency model
  # ============================================================
  - section: consistency_model
    instances:
      - name: classify_response_immediately_consistent
        claim_type: immediate
        grounds: [complexity_profile.consistency_model]
        distinguishing_aspect: "Immediate consistency: the classify response body itself carries the post-transition status, version, and recomputed fields; a follow-up GET shows identical values."
        test_recipe:
          setup: ["incident UNDER_CLASSIFICATION"]
          setup_api_calls:
            - { call: "POST /clery-geographies", payload: { name: "H", category: "ON_CAMPUS", is_residential_facility: false }, as: SystemAdmin, captures: { g: $.data.id } }
            - { call: "POST /incident-reports", payload: { reported_at: "2026-04-15T09:00:00Z", occurred_at: "2026-04-15T08:00:00Z", geography_id: "${g}", source: "POLICE_DIRECT", narrative: "x" }, as: PoliceChief, captures: { i: $.data.id } }
            - { call: "POST /incident-reports/${i}/submit", payload: {}, as: PoliceChief }
            - { call: "POST /incident-reports/${i}/begin-classification", payload: {}, as: CleryCoordinator, captures: { iv: $.data.version } }
          trigger:
            - { call: "POST /incident-reports/${i}/classify", payload: { geography_id: "${g}", offense_counts: [ { offense_type: "SEX_OFFENSE", victim_count: 1 } ], expected_incident_version: "${iv}" }, as: CleryCoordinator, captures: { st: $.data.status, vv: $.data.version, rep: $.data.is_clery_reportable } }
            - { call: "GET /incident-reports/${i}", payload: {}, as: CleryCoordinator }
          assert:
            - "classify response: status == CLASSIFIED, version == ${iv} + 1, is_clery_reportable == true (same request, no lag)"
            - "GET /incident-reports/${i} returns identical status/version/is_clery_reportable"
