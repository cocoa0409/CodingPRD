  - name: parameter_deviation_index_four_weighted_terms
    grounds: '§1.3 calculation parameter_deviation_index sums four independently weighted integer-hundredth distances: base curve at weight 4, diameter at weight 2 and each eye sphere at weight 1.'
    distinguishing_aspect: Dropping the diameter term gives 0.40 and averaging instead of summing gives 0.13, both of which stay inside the auto-approve band for the wrong reason. Only the declared weighted sum produces 0.80 and therefore demands patient consent.
    test_recipe:
      setup:
      - A shipped-eligible order for the 8.60/14.20 product is offered a CLINICAL equivalent at 8.75/14.30, a 0.15 mm base curve and 0.10 mm diameter departure with identical spheres.
