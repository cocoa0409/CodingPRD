      - name: corner_rejected_performance_record_is_terminal
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.PerformanceRecord.terminal_states
          - errors.ERR_INVALID_PERFORMANCE_STATE
          - validations[priority=8]
        distinguishing_aspect: >-
          REJECTED is a terminal PerformanceRecord state, so a second verification attempt — whether
          it tries to reverse the rejection to VERIFIED or to re-reject — must fail with
          ERR_INVALID_PERFORMANCE_STATE and leave verified_seconds null.
        test_recipe:
          setup:
            - "One athlete and one agent; a single performance record submitted and then REJECTED by the technical official."
