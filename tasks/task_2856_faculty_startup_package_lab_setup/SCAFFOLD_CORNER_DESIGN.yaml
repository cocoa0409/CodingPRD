  - section: errors
    instances:
      - name: corner_err_missing_x_user_id_header_returns_unauthenticated
        claim_type: Triggerability
        grounds:
          - errors.ERR_UNAUTHENTICATED
          - roles.DepartmentChair.identity
        distinguishing_aspect: "Closes the triggerability gap for ERR_UNAUTHENTICATED. Three of the five roles are entity-backed, so for them the X-User-ID header is not decoration: omitting it is a 401 before any scope, state or payload rule is consulted, which is why it must be distinguishable from the 403 scope violations."
        test_recipe:
          setup:
            - "MINI-UNITS plus a DRAFT package of 20000000 with a single EQUIPMENT tranche, owned by the Chemistry department."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DeanOffice
            - call: "POST /funding-units"
              payload: { name: "College of Natural Sciences", unit_type: "COLLEGE", cost_share_pool_cents: 900000000 }
              as: DeanOffice
              captures: { x1_col: $.data.id }
            - call: "POST /funding-units"
              payload: { name: "Department of Chemistry", unit_type: "DEPARTMENT", parent_unit_id: "${x1_col}", cost_share_pool_cents: 400000000 }
              as: DeanOffice
              captures: { x1_dept: $.data.id }
            - call: "POST /funding-units"
              payload: { name: "Dean Office Strategic Pool", unit_type: "DEAN_OFFICE", parent_unit_id: "${x1_col}", cost_share_pool_cents: 300000000 }
              as: DeanOffice
              captures: { x1_dean: $.data.id }
            - call: "POST /faculty"
              payload: { full_name: "Ada Reyes", rank: "ASSISTANT", funding_unit_id: "${x1_dept}", planned_start_date: "2026-08-15" }
              as: DeanOffice
              captures: { x1_fac: $.data.id }
            - call: "POST /startup-packages"
              payload: { faculty_id: "${x1_fac}", package_kind: "INITIAL", dean_unit_id: "${x1_dean}", dept_share_pct: 45, college_share_pct: 35, dean_share_pct: 20, proposed_total_cents: 20000000, spend_deadline_on: "2028-06-30" }
              as: DeanOffice
              captures: { x1_pkg: $.data.id }
            - call: "POST /startup-packages/${x1_pkg}/tranches"
              payload: { category: "EQUIPMENT", fiscal_year: 2027, amount_cents: 20000000, available_on: "2026-07-01T00:00:00Z", expires_on: "2027-07-01T00:00:00Z", carryforward_policy: "NONE" }
              as: DeanOffice
          trigger:
            - call: "GET /startup-packages/${x1_pkg}"
              payload: {}
              as: DepartmentChair
          assert:
            - "the trigger call deliberately carries NO X-User-ID header at all"
            - "response code is 401 with error_id ERR_UNAUTHENTICATED"
            - "the very same call with X-User-ID ${x1_dept} returns 200, so the request was otherwise perfectly well formed and in scope"
            - "the same call with X-User-ID set to an id that is not a FundingUnit at all also returns 401 - an entity-backed identity that does not resolve is unauthenticated, not unauthorized"
            - "an opaque-identity role (DeanOffice, FacilitiesManager) reading the same package without a header still succeeds, so the 401 is a property of the role's identity mode and not of the endpoint"

