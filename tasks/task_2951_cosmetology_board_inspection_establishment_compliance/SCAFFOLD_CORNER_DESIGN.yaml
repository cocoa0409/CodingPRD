      - name: error_incident_notification_ordering_gates_in_both_directions
        claim_type: error_triggerable
        grounds:
          - errors.ERR_INCIDENT_NOT_NOTIFIED
          - errors.ERR_INCIDENT_NOT_NOTIFIABLE
          - validations.priority_51.ERR_INCIDENT_NOT_NOTIFIED
        distinguishing_aspect: "The investigation workflow is strictly ordered and each end has its own code: resolving a REPORTED incident is refused with 409 ERR_INCIDENT_NOT_NOTIFIED, and notifying an already-NOTIFIED incident is refused with 409 ERR_INCIDENT_NOT_NOTIFIABLE — the second notification is not a harmless idempotent repeat."
        test_recipe:
          setup:
            - "Establishment 'Incident Salon' with one REPORTED single-case infection incident naming no practitioner."
          setup_api_calls:
            - call: "POST /cosmetology/establishments"
              payload: { legal_name: "Incident Salon", establishment_type: "SALON", county_code: "ADF", station_capacity: 4 }
              as: BoardAdmin
              as_user_id: "admin-001"
              captures: { est_id: $.data.id }
            - call: "POST /cosmetology/infection-incidents"
              payload: { establishment_id: "${est_id}", case_count: 1, onset_date: "2026-07-30", narrative: "Client reported a pustular rash after a pedicure." }
              as: HealthAuthorityLiaison
              as_user_id: "hal-003"
              captures: { inc_id: $.data.id }
          trigger:
            - call: "POST /cosmetology/infection-incidents/${inc_id}/resolution"
              payload: { resolution: "UNSUBSTANTIATED", findings_summary: "Closing before notifying." }
              as: HealthAuthorityLiaison
              as_user_id: "hal-003"
            - call: "POST /cosmetology/infection-incidents/${inc_id}/notification"
              payload: { health_authority_reference: "HD-2026-0777" }
              as: HealthAuthorityLiaison
              as_user_id: "hal-003"
            - call: "POST /cosmetology/infection-incidents/${inc_id}/notification"
              payload: { health_authority_reference: "HD-2026-0778" }
              as: HealthAuthorityLiaison
              as_user_id: "hal-003"
          assert:
            - "the premature resolution returns HTTP 409 with data.error_id == ERR_INCIDENT_NOT_NOTIFIED"
            - "InfectionIncident.${inc_id}.status is still REPORTED and findings_summary is null"
            - "the first notification returns HTTP 200, sets status NOTIFIED, health_authority_reference HD-2026-0777 and notified_at 2026-08-01T00:00:00.000Z from the logical clock"
            - "the second notification returns HTTP 409 with data.error_id == ERR_INCIDENT_NOT_NOTIFIABLE"
            - "InfectionIncident.${inc_id}.health_authority_reference is still HD-2026-0777"
            - "InfectionIncident.${inc_id}.notification_deadline_at == 2026-08-04T00:00:00.000Z"

