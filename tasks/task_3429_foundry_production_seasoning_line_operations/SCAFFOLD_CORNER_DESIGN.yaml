  - section: endpoints
    instances:
      - name: melt_create_returns_computed_planned_cost
        claim_type: action_endpoint
        grounds: ["endpoints.POST_/foundry/melt-batches"]
        excluded_because:
          difficulty_instance: melt_charge_cost_planned_vs_actual_rounding
          rationale: "The 201 create response carrying planned_charge_cost_cents == 56300 is asserted by the named difficulty instance."
  - section: errors
    instances:
      - name: error_order_frozen_gate
        claim_type: violation_to_error
        grounds: ["errors[ERR_ORDER_FROZEN]"]
        excluded_because:
          difficulty_instance: emissions_breach_freeze_and_remediation_thaw
          rationale: "ERR_ORDER_FROZEN is asserted on the pour attempt against the frozen order's TAPPED batch."
      - name: error_order_restricted_gate
        claim_type: violation_to_error
        grounds: ["errors[ERR_ORDER_RESTRICTED]"]
        excluded_because:
          difficulty_instance: scrap_disposition_restricts_order_blocks_seasoning
          rationale: "ERR_ORDER_RESTRICTED is asserted on the seasoning-batch create against the restricted order."
      - name: error_furnace_window_overlap_trigger
        claim_type: violation_to_error
        grounds: ["errors[ERR_FURNACE_WINDOW_OVERLAP]"]
        excluded_because:
          difficulty_instance: furnace_half_open_window_exclusion
          rationale: "Asserted on the overlapping FURNACE_A booking."
      - name: error_oven_capacity_exceeded_trigger
        claim_type: violation_to_error
        grounds: ["errors[ERR_OVEN_CAPACITY_EXCEEDED]"]
        excluded_because:
          difficulty_instance: oven_aggregate_capacity_across_overlap
          rationale: "Asserted on the third overlapping seasoning batch (13 > 12)."
      - name: error_rework_limit_exceeded_trigger
        claim_type: violation_to_error
        grounds: ["errors[ERR_REWORK_LIMIT_EXCEEDED]"]
        excluded_because:
          difficulty_instance: casting_unit_rework_cycle_limit_rejected
          rationale: "Asserted on the third REWORK disposition."
      - name: error_emissions_permit_breach_melt_create
        claim_type: violation_to_error
        grounds: ["errors[ERR_EMISSIONS_PERMIT_BREACH]"]
        excluded_because:
          difficulty_instance: melt_create_blocked_during_air_breach
          rationale: "Asserted on melt create during AIR BREACH; the SAND-breach mold-create side is covered by corner sand_reclamation_rate_breach_blocks_mold_create."
      - name: error_ship_week_invalid_trigger
        claim_type: violation_to_error
        grounds: ["errors[ERR_SHIP_WEEK_INVALID]"]
        excluded_because:
          difficulty_instance: allocation_temporal_beats_fiscal
          rationale: "Asserted as the winning error of the temporal-vs-fiscal priority pair."
      - name: error_insufficient_inventory_trigger
        claim_type: violation_to_error
        grounds: ["errors[ERR_INSUFFICIENT_INVENTORY]"]
        excluded_because:
          difficulty_instance: allocation_consumes_exactly_available_units
          rationale: "Asserted on the 1-unit allocation against the exhausted pool."
      - name: error_product_discontinued_confirm
        claim_type: violation_to_error
        grounds: ["errors[ERR_PRODUCT_DISCONTINUED]"]
        excluded_because:
          difficulty_instance: allocation_confirm_blocked_when_product_discontinued
          rationale: "Asserted on the confirm side; the order-create side is covered by corner product_discontinue_blocks_new_order_rejected."
