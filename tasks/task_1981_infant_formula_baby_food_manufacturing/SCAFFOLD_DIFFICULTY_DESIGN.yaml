                formula_code: "IF-CROSS-1"
                product_name: "Cross Entity Test"
                nutrient_profile_id: "${npcross_id}"
                ingredients:
                  - ingredient_id: "${ingcross_id}"
                    percentage_by_weight: 100.000
                    is_critical: true
                process_type: "DRY_BLEND"
              as: REGULATORY_AFFAIRS
              captures: { fcross_id: $.data.id }
            - call: "POST /api/v1/formulas/${fcross_id}/submit-for-review"
              payload: {}
