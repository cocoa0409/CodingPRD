# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml — §1.8 Test Targeting Index
# 9 Difficulty Rules x 2 instances each = 18 instances.
# All recipes replay from empty-DB using only SCAFFOLD.yaml §1.5 endpoints.
# Logical clock default: 2026-08-01T00:00:00Z (no set call needed unless moved).
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------- Rule 1
  - rule_id: dual_variant_calc
    instances:
      - name: chargeback_provisional_vs_final_disposal
        grounds:
          - calculations.chargeback_amount
          - calculations.chargeback_billing_total
          - state_machines.Chargeback.ASSESSED_to_BILLED
        distinguishing_aspect: |
          Dual-variant calculation in the FISCAL / Chargeback entity domain: the
          provisional variant (planned disposal count, no overage) and the final
          variant (VERIFIED disposal count + overage) produce different amounts
          for the same chargeback — 17190 vs 8595 cents here.
        test_recipe:
          setup:
            - "Property with ACTIVE contract (coverage 20000, heat included, budget 1000000), unit 101, lease cap 100000 with signed addendum, resident, technician"
            - "Bed bug case OPEN on unit 101 (from a positive completed inspection); 2 disposal items logged, item1 VERIFIED, item2 REJECTED"
            - "FURNITURE_DISPOSAL chargeback assessed with planned_item_count 2 -> provisional 17190"
          setup_api_calls:
            - { call: "POST /pest/properties", payload: { name: "Maple Court", address: "1 Maple St" }, as: ProgramAdmin, captures: { prop_id: "$.data.id" } }
            - { call: "POST /pest/properties/${prop_id}/contracts", payload: { vendor_name: "PestCo", scope_pest_types: ["BED_BUGS", "ROACHES"], visits_per_month: 4, coverage_per_incident_cents: 20000, heat_treatment_included: true, monthly_budget_cents: 1000000, start_date: "2026-08-01", end_date: "2027-07-31" }, as: ProgramAdmin, captures: { contract_id: "$.data.id" } }
            - { call: "POST /pest/contracts/${contract_id}/activate", payload: {}, as: ProgramAdmin }
            - { call: "POST /pest/properties/${prop_id}/units", payload: { unit_number: "101", floor: 1, stack_index: 1, bedrooms: 2 }, as: ProgramAdmin, captures: { unit_id: "$.data.id" } }
            - { call: "POST /pest/units/${unit_id}/leases", payload: { start_date: "2026-08-01", end_date: "2027-07-31", pest_addendum_signed: true, chargeback_clause_version: "v2026.1", chargeback_cap_cents: 100000 }, as: PropertyManager, captures: { lease_id: "$.data.id" } }
            - { call: "POST /pest/units/${unit_id}/residents", payload: { full_name: "R One", email: "r1@x.com", lease_id: "${lease_id}" }, as: PropertyManager, captures: { res_id: "$.data.id" } }
            - { call: "POST /pest/technicians", payload: { full_name: "T One", vendor_name: "PestCo" }, as: ProgramAdmin, captures: { tech_id: "$.data.id" } }
            - { call: "POST /pest/units/${unit_id}/inspections", payload: { technician_id: "${tech_id}", kind: "ROUTINE", pest_type: "BED_BUGS", scheduled_for: "2026-08-05T09:00:00Z" }, as: PropertyManager, captures: { insp_id: "$.data.id" } }
            - { call: "POST /pest/inspections/${insp_id}/complete", payload: { live_sightings: 10, evidence_count: 0, bed_bug_positive: true }, as: Technician, as_user_id: "${tech_id}" }
            - { call: "GET /pest/units/${unit_id}/bed-bug-cases", payload: {}, as: PropertyManager, captures: { case_id: "$.data[0].id" } }
            - { call: "POST /pest/bed-bug-cases/${case_id}/furniture-disposals", payload: { item_description: "mattress", quantity: 1 }, as: PropertyManager, captures: { disp1_id: "$.data.id" } }
            - { call: "POST /pest/bed-bug-cases/${case_id}/furniture-disposals", payload: { item_description: "sofa", quantity: 1 }, as: PropertyManager, captures: { disp2_id: "$.data.id" } }
            - { call: "POST /pest/furniture-disposals/${disp1_id}/verify", payload: { verified: true }, as: PropertyManager }
            - { call: "POST /pest/furniture-disposals/${disp2_id}/verify", payload: { verified: false }, as: PropertyManager }
            - { call: "POST /pest/leases/${lease_id}/chargebacks", payload: { kind: "FURNITURE_DISPOSAL", planned_item_count: 2, bed_bug_case_id: "${case_id}" }, as: BillingClerk, as_user_id: "clerk-1", captures: { cb_id: "$.data.id", cb_prov: "$.data.provisional_amount_cents" } }
          trigger:
            - { call: "POST /pest/chargebacks/${cb_id}/bill", payload: {}, as: BillingClerk, as_user_id: "clerk-1", captures: { cb_final: "$.data.final_amount_cents", cb_status: "$.data.status" } }
            - { call: "GET /pest/leases/${lease_id}", payload: {}, as: BillingClerk, captures: { lease_bal: "$.data.outstanding_balance_cents" } }
          assert:
            - "Chargeback.${cb_id}.provisional_amount_cents == 17190 (2 planned lines x round_half_up(7995 * 1.075) = 2 x 8595)"
            - "Chargeback.${cb_id}.final_amount_cents == 8595 (1 VERIFIED item only; REJECTED sofa excluded; no overage line)"
            - "Chargeback.${cb_id}.final_amount_cents != Chargeback.${cb_id}.provisional_amount_cents"
            - "Chargeback.${cb_id}.status == BILLED"
            - "Lease.${lease_id}.outstanding_balance_cents == 8595 (BILLED contributes final, provisional replaced)"
      - name: unit_risk_forward_vs_historical
        grounds:
          - calculations.unit_pest_risk_score
        distinguishing_aspect: |
          Dual-variant calculation in the RISK / Unit entity domain (distinct
          from the fiscal domain above): FORWARD counts a SCHEDULED treatment as
          satisfying recency (recency_points 0) while HISTORICAL ignores anything
          but COMPLETED treatments (recency_points 25), so identical data yields
          score 55 vs 80.
        test_recipe:
          setup:
            - "Property with ACTIVE contract (scope BED_BUGS), unit 101, technician"
            - "Unit 101 has one COMPLETED SEVERE bed-bug-positive inspection at 2026-08-01 (creates one BedBugCase -> prior_cases 15 points)"
            - "Unit 101 has one SCHEDULED CHEMICAL treatment window_start 2026-08-10T09:00:00Z (future, never completed)"
          setup_api_calls:
            - { call: "POST /pest/properties", payload: { name: "Oak Court", address: "2 Oak St" }, as: ProgramAdmin, captures: { prop_id: "$.data.id" } }
            - { call: "POST /pest/properties/${prop_id}/contracts", payload: { vendor_name: "PestCo", scope_pest_types: ["BED_BUGS"], visits_per_month: 4, coverage_per_incident_cents: 20000, heat_treatment_included: true, monthly_budget_cents: 1000000, start_date: "2026-08-01", end_date: "2027-07-31" }, as: ProgramAdmin, captures: { contract_id: "$.data.id" } }
            - { call: "POST /pest/contracts/${contract_id}/activate", payload: {}, as: ProgramAdmin }
            - { call: "POST /pest/properties/${prop_id}/units", payload: { unit_number: "101", floor: 1, stack_index: 1, bedrooms: 2 }, as: ProgramAdmin, captures: { unit_id: "$.data.id" } }
            - { call: "POST /pest/technicians", payload: { full_name: "T One", vendor_name: "PestCo" }, as: ProgramAdmin, captures: { tech_id: "$.data.id" } }
            - { call: "POST /pest/units/${unit_id}/inspections", payload: { technician_id: "${tech_id}", kind: "ROUTINE", pest_type: "BED_BUGS", scheduled_for: "2026-08-05T09:00:00Z" }, as: PropertyManager, captures: { insp_id: "$.data.id" } }
            - { call: "POST /pest/inspections/${insp_id}/complete", payload: { live_sightings: 10, evidence_count: 0, bed_bug_positive: true }, as: Technician, as_user_id: "${tech_id}" }
            - { call: "POST /pest/units/${unit_id}/treatments", payload: { technician_id: "${tech_id}", pest_type: "BED_BUGS", treatment_type: "CHEMICAL", window_start: "2026-08-10T09:00:00Z", window_end: "2026-08-10T10:00:00Z" }, as: PropertyManager }
          trigger:
            - { call: "GET /pest/units/${unit_id}/risk-score", payload: { variant: "FORWARD" }, as: PropertyManager, captures: { fwd: "$.data.score", fwd_recency: "$.data.recency_points" } }
            - { call: "GET /pest/units/${unit_id}/risk-score", payload: { variant: "HISTORICAL" }, as: PropertyManager, captures: { hist: "$.data.score", hist_recency: "$.data.recency_points" } }
          assert:
            - "FORWARD score == 55 (severe_recent 40 + prior_cases 15 + adjacent 0 + recency_points 0)"
            - "HISTORICAL score == 80 (same inputs but recency_points 25: no COMPLETED treatment exists)"
            - "FORWARD recency_points == 0 and HISTORICAL recency_points == 25; the 25-point delta is driven solely by the variant's treatment inclusion set"

  # ---------------------------------------------------------------- Rule 2
  - rule_id: combinatorial_formula
    instances:
      - name: chargeback_cap_coverage_nesting
        grounds:
          - calculations.chargeback_amount
          - entities.Lease.fields.chargeback_cap_cents
          - entities.ServiceContract.fields.coverage_per_incident_cents
        distinguishing_aspect: |
          Mode (a) formula: >= 3 inputs (rate base 22000, contract coverage
          20000, lease cap) with non-linear nested min/max — min(max(0,
          22000 - min(20000, 22000)) * 1.075 rounded, cap). Two leases pin both
          branches of the outer min: cap 1000 clamps (1000) and cap 2150 equals
          the pre-cap amount exactly (2150, inclusive boundary not clamped).
        test_recipe:
          setup:
            - "Property with ACTIVE contract (coverage_per_incident_cents 20000, scope ROACHES)"
            - "Units 101 and 102; lease L1 on 101 with cap 1000; lease L2 on 102 with cap 2150; both addenda signed"
          setup_api_calls:
            - { call: "POST /pest/properties", payload: { name: "Elm Court", address: "3 Elm St" }, as: ProgramAdmin, captures: { prop_id: "$.data.id" } }
            - { call: "POST /pest/properties/${prop_id}/contracts", payload: { vendor_name: "PestCo", scope_pest_types: ["ROACHES"], visits_per_month: 4, coverage_per_incident_cents: 20000, heat_treatment_included: true, monthly_budget_cents: 1000000, start_date: "2026-08-01", end_date: "2027-07-31" }, as: ProgramAdmin, captures: { contract_id: "$.data.id" } }
            - { call: "POST /pest/contracts/${contract_id}/activate", payload: {}, as: ProgramAdmin }
            - { call: "POST /pest/properties/${prop_id}/units", payload: { unit_number: "101", floor: 1, stack_index: 1, bedrooms: 1 }, as: ProgramAdmin, captures: { unit1_id: "$.data.id" } }
            - { call: "POST /pest/properties/${prop_id}/units", payload: { unit_number: "102", floor: 1, stack_index: 2, bedrooms: 1 }, as: ProgramAdmin, captures: { unit2_id: "$.data.id" } }
            - { call: "POST /pest/units/${unit1_id}/leases", payload: { start_date: "2026-08-01", end_date: "2027-07-31", pest_addendum_signed: true, chargeback_clause_version: "v2026.1", chargeback_cap_cents: 1000 }, as: PropertyManager, captures: { lease1_id: "$.data.id" } }
            - { call: "POST /pest/units/${unit2_id}/leases", payload: { start_date: "2026-08-01", end_date: "2027-07-31", pest_addendum_signed: true, chargeback_clause_version: "v2026.1", chargeback_cap_cents: 2150 }, as: PropertyManager, captures: { lease2_id: "$.data.id" } }
          trigger:
            - { call: "POST /pest/leases/${lease1_id}/chargebacks", payload: { kind: "REPEAT_INFESTATION" }, as: BillingClerk, as_user_id: "clerk-1", captures: { cb1_prov: "$.data.provisional_amount_cents" } }
            - { call: "POST /pest/leases/${lease2_id}/chargebacks", payload: { kind: "REPEAT_INFESTATION" }, as: BillingClerk, as_user_id: "clerk-1", captures: { cb2_prov: "$.data.provisional_amount_cents" } }
          assert:
            - "cb1 provisional == 1000 (pre-cap 2150 clamped by cap 1000)"
            - "cb2 provisional == 2150 (pre-cap round_half_up(2000 * 1.075) = 2150 equals cap 2150 exactly; min boundary is inclusive and does not clamp below)"
            - "Lease.${lease1_id}.outstanding_balance_cents == 1000 and Lease.${lease2_id}.outstanding_balance_cents == 2150"
      - name: disposal_per_line_rounding_order
        grounds:
          - calculations.chargeback_billing_total
          - calculations.chargeback_amount
        distinguishing_aspect: |
          Mode (b) nested rounding: the scaffold pins round-per-line-then-sum.
          Three disposal lines of 7995 * 1.075 = 8594.625 each yield 3 x 8595 =
          25785 under the pinned order, versus round_half_up(25783.875) = 25784
          under sum-then-round — a one-cent observable divergence on identical
          inputs; distinct mode from the min/max nesting instance above.
        test_recipe:
          setup:
            - "Property with ACTIVE contract (scope BED_BUGS), unit 101, lease cap 100000 with signed addendum, technician"
            - "Bed bug case OPEN on 101; 3 disposal items logged and ALL VERIFIED"
            - "FURNITURE_DISPOSAL chargeback assessed with planned_item_count 3"
          setup_api_calls:
            - { call: "POST /pest/properties", payload: { name: "Pine Court", address: "4 Pine St" }, as: ProgramAdmin, captures: { prop_id: "$.data.id" } }
            - { call: "POST /pest/properties/${prop_id}/contracts", payload: { vendor_name: "PestCo", scope_pest_types: ["BED_BUGS"], visits_per_month: 4, coverage_per_incident_cents: 20000, heat_treatment_included: true, monthly_budget_cents: 1000000, start_date: "2026-08-01", end_date: "2027-07-31" }, as: ProgramAdmin, captures: { contract_id: "$.data.id" } }
            - { call: "POST /pest/contracts/${contract_id}/activate", payload: {}, as: ProgramAdmin }
            - { call: "POST /pest/properties/${prop_id}/units", payload: { unit_number: "101", floor: 1, stack_index: 1, bedrooms: 2 }, as: ProgramAdmin, captures: { unit_id: "$.data.id" } }
            - { call: "POST /pest/units/${unit_id}/leases", payload: { start_date: "2026-08-01", end_date: "2027-07-31", pest_addendum_signed: true, chargeback_clause_version: "v2026.1", chargeback_cap_cents: 100000 }, as: PropertyManager, captures: { lease_id: "$.data.id" } }
            - { call: "POST /pest/technicians", payload: { full_name: "T One", vendor_name: "PestCo" }, as: ProgramAdmin, captures: { tech_id: "$.data.id" } }
            - { call: "POST /pest/units/${unit_id}/inspections", payload: { technician_id: "${tech_id}", kind: "ROUTINE", pest_type: "BED_BUGS", scheduled_for: "2026-08-05T09:00:00Z" }, as: PropertyManager, captures: { insp_id: "$.data.id" } }
            - { call: "POST /pest/inspections/${insp_id}/complete", payload: { live_sightings: 10, evidence_count: 0, bed_bug_positive: true }, as: Technician, as_user_id: "${tech_id}" }
            - { call: "GET /pest/units/${unit_id}/bed-bug-cases", payload: {}, as: PropertyManager, captures: { case_id: "$.data[0].id" } }
            - { call: "POST /pest/bed-bug-cases/${case_id}/furniture-disposals", payload: { item_description: "mattress", quantity: 1 }, as: PropertyManager, captures: { d1: "$.data.id" } }
            - { call: "POST /pest/bed-bug-cases/${case_id}/furniture-disposals", payload: { item_description: "sofa", quantity: 1 }, as: PropertyManager, captures: { d2: "$.data.id" } }
            - { call: "POST /pest/bed-bug-cases/${case_id}/furniture-disposals", payload: { item_description: "bed frame", quantity: 1 }, as: PropertyManager, captures: { d3: "$.data.id" } }
            - { call: "POST /pest/furniture-disposals/${d1}/verify", payload: { verified: true }, as: PropertyManager }
            - { call: "POST /pest/furniture-disposals/${d2}/verify", payload: { verified: true }, as: PropertyManager }
            - { call: "POST /pest/furniture-disposals/${d3}/verify", payload: { verified: true }, as: PropertyManager }
            - { call: "POST /pest/leases/${lease_id}/chargebacks", payload: { kind: "FURNITURE_DISPOSAL", planned_item_count: 3, bed_bug_case_id: "${case_id}" }, as: BillingClerk, as_user_id: "clerk-1", captures: { cb_id: "$.data.id" } }
          trigger:
            - { call: "POST /pest/chargebacks/${cb_id}/bill", payload: {}, as: BillingClerk, as_user_id: "clerk-1", captures: { fin: "$.data.final_amount_cents" } }
          assert:
            - "Chargeback.${cb_id}.final_amount_cents == 25785 (3 x round_half_up(7995 * 1.075) = 3 x 8595, per-line rounding pinned)"
            - "final_amount_cents != 25784 (the sum-then-round value round_half_up(25783.875) is the forbidden order)"

  # ---------------------------------------------------------------- Rule 3
  - rule_id: non_linear_state_machine
    instances:
      - name: treatment_prep_reschedule_cycle
        grounds:
          - state_machines.Treatment.SCHEDULED_to_PREP_NOTIFIED
          - state_machines.Treatment.PREP_NOTIFIED_to_NON_COMPLIANT
          - state_machines.Treatment.NON_COMPLIANT_to_SCHEDULED
          - concurrency_rules[treatment-reschedule-stale-version]
        distinguishing_aspect: |
          CYCLIC state machine on Treatment: SCHEDULED -> PREP_NOTIFIED ->
          NON_COMPLIANT -> (reschedule) -> SCHEDULED, traversed twice; each
          loop clears prep timestamps and increments reschedule_count, and each
          NON_COMPLIANT entry fires the chargeback cascade (balance 16125 then
          32250). Distinct entity from the BedBugCase cycle below.
        test_recipe:
          setup:
            - "Property with ACTIVE contract (scope ROACHES, budget 1000000), unit 101, lease cap 100000 addendum signed, resident, technician"
            - "Treatment CHEMICAL/ROACHES window 2026-08-10T09:00-10:00Z on unit 101 (SCHEDULED, reschedule_count 0)"
          setup_api_calls:
            - { call: "POST /pest/properties", payload: { name: "Birch Court", address: "5 Birch St" }, as: ProgramAdmin, captures: { prop_id: "$.data.id" } }
            - { call: "POST /pest/properties/${prop_id}/contracts", payload: { vendor_name: "PestCo", scope_pest_types: ["ROACHES"], visits_per_month: 4, coverage_per_incident_cents: 20000, heat_treatment_included: true, monthly_budget_cents: 1000000, start_date: "2026-08-01", end_date: "2027-07-31" }, as: ProgramAdmin, captures: { contract_id: "$.data.id" } }
            - { call: "POST /pest/contracts/${contract_id}/activate", payload: {}, as: ProgramAdmin }
            - { call: "POST /pest/properties/${prop_id}/units", payload: { unit_number: "101", floor: 1, stack_index: 1, bedrooms: 1 }, as: ProgramAdmin, captures: { unit_id: "$.data.id" } }
            - { call: "POST /pest/units/${unit_id}/leases", payload: { start_date: "2026-08-01", end_date: "2027-07-31", pest_addendum_signed: true, chargeback_clause_version: "v2026.1", chargeback_cap_cents: 100000 }, as: PropertyManager, captures: { lease_id: "$.data.id" } }
            - { call: "POST /pest/units/${unit_id}/residents", payload: { full_name: "R One", email: "r1@x.com", lease_id: "${lease_id}" }, as: PropertyManager, captures: { res_id: "$.data.id" } }
            - { call: "POST /pest/technicians", payload: { full_name: "T One", vendor_name: "PestCo" }, as: ProgramAdmin, captures: { tech_id: "$.data.id" } }
            - { call: "POST /pest/units/${unit_id}/treatments", payload: { technician_id: "${tech_id}", pest_type: "ROACHES", treatment_type: "CHEMICAL", window_start: "2026-08-10T09:00:00Z", window_end: "2026-08-10T10:00:00Z" }, as: PropertyManager, captures: { tr_id: "$.data.id" } }
          trigger:
            - { call: "POST /pest/treatments/${tr_id}/notify-prep", payload: {}, as: PropertyManager }
            - { call: "POST /pest/treatments/${tr_id}/acknowledge-prep", payload: {}, as: Resident, as_user_id: "${res_id}" }
            - { call: "POST /pest/treatments/${tr_id}/verify-prep", payload: { compliant: false }, as: PropertyManager, captures: { v_after_nc1: "$.data.version", st1: "$.data.status" } }
            - { call: "POST /pest/treatments/${tr_id}/reschedule", payload: { window_start: "2026-08-12T09:00:00Z", window_end: "2026-08-12T10:00:00Z", expected_treatment_version: "${v_after_nc1}" }, as: PropertyManager, captures: { st2: "$.data.status", rc1: "$.data.reschedule_count", pna1: "$.data.prep_notified_at" } }
            - { call: "POST /pest/treatments/${tr_id}/notify-prep", payload: {}, as: PropertyManager }
            - { call: "POST /pest/treatments/${tr_id}/acknowledge-prep", payload: {}, as: Resident, as_user_id: "${res_id}" }
            - { call: "POST /pest/treatments/${tr_id}/verify-prep", payload: { compliant: false }, as: PropertyManager, captures: { v_after_nc2: "$.data.version" } }
            - { call: "POST /pest/treatments/${tr_id}/reschedule", payload: { window_start: "2026-08-14T09:00:00Z", window_end: "2026-08-14T10:00:00Z", expected_treatment_version: "${v_after_nc2}" }, as: PropertyManager, captures: { st3: "$.data.status", rc2: "$.data.reschedule_count", pna2: "$.data.prep_notified_at", paa2: "$.data.prep_acknowledged_at" } }
            - { call: "GET /pest/leases/${lease_id}", payload: {}, as: BillingClerk, captures: { bal: "$.data.outstanding_balance_cents" } }
          assert:
            - "after first verify(false): status == NON_COMPLIANT (cycle edge reached, not terminal)"
            - "after first reschedule: status == SCHEDULED and reschedule_count == 1 and prep_notified_at == null (loop resets prep tracking)"
            - "after second reschedule: status == SCHEDULED and reschedule_count == 2 and prep_notified_at == null and prep_acknowledged_at == null"
            - "Lease.${lease_id}.outstanding_balance_cents == 32250 (two NON_COMPLIANCE_FEE chargebacks of 16125 each; below 50000 so no late fee)"
      - name: bed_bug_case_reopen_cycle
        grounds:
          - state_machines.BedBugCase.MONITORING_to_REOPENED
          - state_machines.BedBugCase.REOPENED_to_TREATING
          - state_machines.BedBugCase.MONITORING_to_CLEARED
          - calculations.clearance_evaluation
        distinguishing_aspect: |
          CYCLIC state machine on BedBugCase (distinct entity from Treatment):
          OPEN -> TREATING -> MONITORING -> REOPENED -> TREATING -> MONITORING
          -> CLEARED, with the reopen edge fired by a positive FOLLOW_UP and the
          final clearance requiring 2 consecutive negatives spaced exactly 14
          days under the logical clock.
        test_recipe:
          setup:
            - "Property with ACTIVE contract (scope BED_BUGS, budget 1000000), unit 101, lease addendum signed, resident, technician"
            - "Case OPEN on 101 from positive ROUTINE inspection"
          setup_api_calls:
            - { call: "POST /pest/properties", payload: { name: "Cedar Court", address: "6 Cedar St" }, as: ProgramAdmin, captures: { prop_id: "$.data.id" } }
            - { call: "POST /pest/properties/${prop_id}/contracts", payload: { vendor_name: "PestCo", scope_pest_types: ["BED_BUGS"], visits_per_month: 4, coverage_per_incident_cents: 20000, heat_treatment_included: true, monthly_budget_cents: 1000000, start_date: "2026-08-01", end_date: "2027-07-31" }, as: ProgramAdmin, captures: { contract_id: "$.data.id" } }
            - { call: "POST /pest/contracts/${contract_id}/activate", payload: {}, as: ProgramAdmin }
            - { call: "POST /pest/properties/${prop_id}/units", payload: { unit_number: "101", floor: 1, stack_index: 1, bedrooms: 2 }, as: ProgramAdmin, captures: { unit_id: "$.data.id" } }
            - { call: "POST /pest/units/${unit_id}/leases", payload: { start_date: "2026-08-01", end_date: "2027-07-31", pest_addendum_signed: true, chargeback_clause_version: "v2026.1", chargeback_cap_cents: 100000 }, as: PropertyManager, captures: { lease_id: "$.data.id" } }
            - { call: "POST /pest/units/${unit_id}/residents", payload: { full_name: "R One", email: "r1@x.com", lease_id: "${lease_id}" }, as: PropertyManager, captures: { res_id: "$.data.id" } }
            - { call: "POST /pest/technicians", payload: { full_name: "T One", vendor_name: "PestCo" }, as: ProgramAdmin, captures: { tech_id: "$.data.id" } }
            - { call: "POST /pest/units/${unit_id}/inspections", payload: { technician_id: "${tech_id}", kind: "ROUTINE", pest_type: "BED_BUGS", scheduled_for: "2026-08-05T09:00:00Z" }, as: PropertyManager, captures: { insp0: "$.data.id" } }
