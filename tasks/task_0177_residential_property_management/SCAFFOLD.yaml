# =============================================================================
# PRD Benchmark Scaffold — Residential Property Management (Expert)
# =============================================================================

scenario: |
  177. Residential Property Management: tenant screening/credit, lease/renewal,
  rent roll/late fee, security-deposit accounting (state interest), maintenance
  work order, owner statement/distribution, eviction notice, vacancy turnover

domain_name: residential-property-management
api_prefix: /

# -----------------------------------------------------------------------------
# Complexity Profile
# -----------------------------------------------------------------------------
complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: compliance_audit
  complexity_layers:
    - dual_variant_calculation        # accrual vs cash owner-statement net; standard vs forfeiture deposit settlement
    - cascading_side_effects          # lease sign -> tenant mint -> unit occupy; eviction enforce -> lease terminate -> unit vacant -> turnover open
    - rate_threshold_triggers         # late-fee grace boundary; deposit-interest completed-year breakpoints
    - derived_field_reconciliation    # rent_roll balance_due, property trust/distributable, deposit ledger
    - optimistic_concurrency          # OCC on Lease.version (renewal supersede) and Property.version (distribution)
    - temporal_windowing              # lease term intervals; eviction cure-period windows

  entity_topology: flat
  # Every entity has a top-level collection; relationships are foreign keys in the
  # request body (owner_id, property_id, unit_id, applicant_id, lease_id), never
  # nested URL ownership. Reverse-reachability is provided by filtered-list GETs.

  state_machine_shape: branching
  # Applicant screening forks APPROVED/DENIED; Lease has a renewal cycle
  # (ACTIVE <-> RENEWAL_OFFERED) plus EXPIRED/TERMINATED branches; EvictionCase
  # branches CURED/DISMISSED vs FILED/ENFORCED; WorkOrder branches COMPLETED vs CANCELLED.

  relationship_patterns:
    - one_to_many        # Property->Unit, Unit->Lease (historical), Lease->RentCharge/Payment
    - cross_aggregate    # EvictionCase->Lease, OwnerStatement->Property, Payment->Lease
    - self_referential   # Lease.renewed_from_lease_id -> prior Lease (renewal chain)

  role_model: peer_roles
  # PropertyManager (opaque operator), Owner (entity-backed), Tenant (entity-backed),
  # Applicant (entity-backed), ComplianceOfficer (opaque legal role for eviction filing).

  consistency_model: immediate

# -----------------------------------------------------------------------------
# 1.0 Response Envelope (FIXED)
# -----------------------------------------------------------------------------
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Owner
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Property owner legal name" }
      - { name: email, type: string, source: input, description: "Owner contact email" }
      - { name: distribution_method, type: enum, source: input, default: "ACH", description: "ACH | CHECK — how distributions are paid", constraints: "one of {ACH, CHECK}" }
      - { name: management_fee_pct, type: number, source: input, description: "Decimal fraction (e.g. 0.08 = 8%) charged on collected/billed rent for owner statements", constraints: "0 <= management_fee_pct <= 0.5" }

  - name: Property
    parent: null
    common_fields: true
    fields:
      - { name: owner_id, type: string, source: input, description: "FK -> Owner.id; the owner of this property" }
      - { name: name, type: string, source: input, description: "Property display name" }
      - { name: state_code, type: enum, source: input, description: "US state governing deposit-interest and eviction cure rules", constraints: "one of {CA, NY, TX, IL, FL}" }
      - { name: address, type: string, source: input, description: "Street address" }
      - { name: trust_balance_cents, type: integer, source: computed, default: 0, description: "Owner trust ledger: collected rent + manual fundings, minus owner-charged maintenance, refunds, and distributions; never negative" }
      - { name: distributable_cents, type: integer, source: computed, default: 0, description: "= max(0, trust_balance_cents - reserve_floor_cents); the amount a distribution may pay out" }
      - { name: reserve_floor_cents, type: integer, source: input, default: 0, description: "Minimum trust balance the owner requires retained; distributions cannot draw below it", constraints: ">= 0" }
      - { name: unit_count, type: integer, source: computed, default: 0, description: "Number of Units under this property" }

  - name: Unit
    parent: null
    common_fields: true
    fields:
      - { name: property_id, type: string, source: input, description: "FK -> Property.id; parent property" }
      - { name: label, type: string, source: input, description: "Unit label, e.g. 'Apt 2B'" }
      - { name: market_rent_cents, type: integer, source: input, description: "Listed monthly market rent in cents", constraints: "> 0" }
      - { name: occupancy_status, type: enum, source: computed, default: "VACANT_READY", description: "VACANT_READY | OCCUPIED | VACANT_TURN — lifecycle", constraints: "one of {VACANT_READY, OCCUPIED, VACANT_TURN}" }
      - { name: active_lease_id, type: string, source: computed, default: null, description: "Denormalized pointer to the currently ACTIVE Lease.id, or null; computed forward pointer, not an ownership key" }

  - name: Applicant
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Applicant full name" }
      - { name: email, type: string, source: input, description: "Applicant email; used as the screening identity" }
      - { name: unit_id, type: string, source: input, description: "FK -> Unit.id; the unit applied for" }
      - { name: annual_income_cents, type: integer, source: input, description: "Self-reported gross annual income in cents", constraints: ">= 0" }
      - { name: credit_score, type: integer, source: input, description: "Submitted credit score 300-850", constraints: "300 <= credit_score <= 850" }
      - { name: monthly_debt_cents, type: integer, source: input, default: 0, description: "Existing monthly debt obligations in cents", constraints: ">= 0" }
      - { name: requested_rent_cents, type: integer, source: input, description: "Proposed monthly rent for the application in cents", constraints: "> 0" }
      - { name: status, type: enum, source: system, default: "SUBMITTED", description: "SUBMITTED | SCREENED | APPROVED | DENIED | LEASED | WITHDRAWN", constraints: "one of {SUBMITTED, SCREENED, APPROVED, DENIED, LEASED, WITHDRAWN}" }
      - { name: screening_decision, type: enum, source: computed, default: null, description: "PASS | FAIL — computed at screening; null before screening", constraints: "one of {PASS, FAIL, null}" }
      - { name: rent_to_income_ratio, type: number, source: computed, default: null, description: "Computed (requested_rent*12)/annual_income, 4 decimals" }
      - { name: dti_ratio, type: number, source: computed, default: null, description: "Computed debt-to-income ratio including requested rent, 4 decimals" }

  - name: Lease
    parent: null
    common_fields: true
    fields:
      - { name: unit_id, type: string, source: input, description: "FK -> Unit.id; the leased unit" }
      - { name: applicant_id, type: string, source: input, default: null, description: "FK -> Applicant.id; the approved applicant the lease was created from. Required for an original lease; OMITTED for a renewal (renewed_from_lease_id set), which inherits the prior lease's tenant instead" }
      - { name: tenant_id, type: string, source: computed, default: null, description: "Denormalized pointer to the Tenant.id minted at signing, or null in DRAFT; computed forward pointer, not an ownership key" }
      - { name: renewed_from_lease_id, type: string, source: input, default: null, description: "FK -> Lease.id; prior lease in the renewal chain, or null for an original lease" }
      - { name: start_date, type: string, source: input, description: "Lease term start, ISO date YYYY-MM-DD" }
      - { name: end_date, type: string, source: input, description: "Lease term end (exclusive), ISO date YYYY-MM-DD", constraints: "end_date > start_date" }
      - { name: monthly_rent_cents, type: integer, source: input, description: "Contract monthly rent in cents", constraints: "> 0" }
      - { name: rent_due_day, type: integer, source: input, default: 1, description: "Day of month rent is due", constraints: "1 <= rent_due_day <= 28" }
      - { name: grace_period_days, type: integer, source: input, default: 5, description: "Days after due date before a late fee applies", constraints: ">= 0" }
      - { name: late_fee_flat_cents, type: integer, source: input, default: 0, description: "Flat late-fee component in cents", constraints: ">= 0" }
      - { name: late_fee_pct, type: number, source: input, default: 0, description: "Percent-of-rent late-fee component as decimal fraction", constraints: "0 <= late_fee_pct <= 0.25" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT | ACTIVE | RENEWAL_OFFERED | EXPIRED | TERMINATED", constraints: "one of {DRAFT, ACTIVE, RENEWAL_OFFERED, EXPIRED, TERMINATED}" }
      - { name: balance_due_cents, type: integer, source: computed, default: 0, description: "Sum of RentCharge.amount_outstanding_cents over OPEN/PARTIAL charges on this lease" }
      - { name: superseded_by_lease_id, type: string, source: computed, default: null, description: "Denormalized pointer to the renewal Lease.id that replaced this one, or null; computed forward pointer, not an ownership key" }

  - name: Tenant
    parent: null
    common_fields: true
    fields:
      - { name: applicant_id, type: string, source: input, description: "FK -> Applicant.id; the application this tenant was promoted from" }
      - { name: full_name, type: string, source: input, description: "Tenant full name" }
      - { name: email, type: string, source: input, description: "Tenant email; matches the source applicant email" }
      - { name: status, type: enum, source: system, default: "CURRENT", description: "CURRENT | FORMER", constraints: "one of {CURRENT, FORMER}" }

  - name: RentCharge
    parent: null
    common_fields: true
    fields:
      - { name: lease_id, type: string, source: input, description: "FK -> Lease.id; the lease this charge accrues to" }
      - { name: charge_type, type: enum, source: input, default: "RENT", description: "RENT | LATE_FEE — origin of the charge", constraints: "one of {RENT, LATE_FEE}" }
      - { name: period_label, type: string, source: input, default: null, description: "Billing period e.g. '2026-06' for RENT charges; null for LATE_FEE" }
      - { name: due_date, type: string, source: input, description: "ISO date the charge is due, YYYY-MM-DD" }
      - { name: amount_cents, type: integer, source: input, description: "Charge gross amount in cents", constraints: "> 0" }
      - { name: amount_paid_cents, type: integer, source: computed, default: 0, description: "Cumulative payment applied to this charge" }
      - { name: amount_outstanding_cents, type: integer, source: computed, default: 0, description: "= amount_cents - amount_paid_cents; never negative" }
      - { name: late_fee_assessed, type: boolean, source: computed, default: false, description: "True once a LATE_FEE charge has been generated for this RENT charge by the sweep" }
      - { name: status, type: enum, source: system, default: "OPEN", description: "OPEN | PARTIAL | PAID | WAIVED", constraints: "one of {OPEN, PARTIAL, PAID, WAIVED}" }

  - name: Payment
    parent: null
    common_fields: true
    fields:
      - { name: lease_id, type: string, source: input, description: "FK -> Lease.id; the lease the payment is credited to" }
      - { name: amount_cents, type: integer, source: input, description: "Payment amount in cents", constraints: "> 0" }
      - { name: received_date, type: string, source: input, description: "ISO date the payment was received, YYYY-MM-DD" }
      - { name: applied_breakdown, type: array, source: computed, default: [], description: "Ordered list of {charge_id, applied_cents} produced by waterfall allocation" }
      - { name: applied_to_rent_cents, type: integer, source: computed, default: 0, description: "Portion of this payment applied to RENT charges (credited to property trust)" }
      - { name: unapplied_cents, type: integer, source: computed, default: 0, description: "Residual that exceeded all open charges; held as tenant credit" }

  - name: SecurityDeposit
    parent: null
    common_fields: true
    fields:
      - { name: lease_id, type: string, source: input, description: "FK -> Lease.id; the lease this deposit secures" }
      - { name: collected_cents, type: integer, source: input, description: "Deposit amount collected at signing, in cents", constraints: ">= 0" }
      - { name: collected_date, type: string, source: input, description: "ISO date the deposit was collected, YYYY-MM-DD" }
      - { name: interest_accrued_cents, type: integer, source: computed, default: 0, description: "State-mandated interest accrued to date, in cents" }
      - { name: deductions_cents, type: integer, source: computed, default: 0, description: "Sum of deductions applied at settlement (arrears then damages)" }
      - { name: refund_cents, type: integer, source: computed, default: 0, description: "Amount refunded to tenant at settlement" }
      - { name: settlement_date, type: string, source: input, default: null, description: "ISO date settlement was computed, YYYY-MM-DD" }
      - { name: status, type: enum, source: system, default: "HELD", description: "HELD | SETTLED | FORFEITED", constraints: "one of {HELD, SETTLED, FORFEITED}" }

  - name: WorkOrder
    parent: null
    common_fields: true
    fields:
      - { name: unit_id, type: string, source: input, description: "FK -> Unit.id; the unit needing maintenance" }
      - { name: category, type: enum, source: input, description: "PLUMBING | ELECTRICAL | HVAC | APPLIANCE | STRUCTURAL | OTHER", constraints: "one of {PLUMBING, ELECTRICAL, HVAC, APPLIANCE, STRUCTURAL, OTHER}" }
      - { name: priority, type: enum, source: input, default: "ROUTINE", description: "EMERGENCY | URGENT | ROUTINE", constraints: "one of {EMERGENCY, URGENT, ROUTINE}" }
      - { name: description, type: string, source: input, description: "Issue description" }
      - { name: estimate_cents, type: integer, source: input, default: 0, description: "Estimated repair cost in cents", constraints: ">= 0" }
      - { name: actual_cost_cents, type: integer, source: input, default: null, description: "Actual cost recorded at completion, in cents", constraints: ">= 0" }
      - { name: charge_to_owner, type: boolean, source: input, default: true, description: "When true, actual cost is debited from the property trust at completion" }
      - { name: completed_date, type: string, source: input, default: null, description: "ISO date the work order was completed, YYYY-MM-DD" }
      - { name: status, type: enum, source: system, default: "OPEN", description: "OPEN | ASSIGNED | COMPLETED | CANCELLED", constraints: "one of {OPEN, ASSIGNED, COMPLETED, CANCELLED}" }

  - name: EvictionCase
    parent: null
    common_fields: true
    fields:
      - { name: lease_id, type: string, source: input, description: "FK -> Lease.id; the lease under eviction" }
      - { name: reason, type: enum, source: input, description: "NONPAYMENT | LEASE_VIOLATION | HOLDOVER", constraints: "one of {NONPAYMENT, LEASE_VIOLATION, HOLDOVER}" }
      - { name: notice_date, type: string, source: input, description: "ISO date the notice was served, YYYY-MM-DD" }
      - { name: cure_deadline_date, type: string, source: computed, default: null, description: "ISO date the cure window closes; = notice_date + state cure days" }
      - { name: arrears_at_notice_cents, type: integer, source: computed, default: 0, description: "Lease balance_due_cents snapshotted when the notice was served" }
      - { name: status, type: enum, source: system, default: "NOTICE_SERVED", description: "NOTICE_SERVED | CURED | FILED | ENFORCED | DISMISSED", constraints: "one of {NOTICE_SERVED, CURED, FILED, ENFORCED, DISMISSED}" }

  - name: OwnerStatement
    parent: null
    common_fields: true
    fields:
      - { name: property_id, type: string, source: input, description: "FK -> Property.id; the property being reconciled" }
      - { name: period_label, type: string, source: input, description: "Statement period, e.g. '2026-06'" }
      - { name: basis, type: enum, source: input, default: "CASH", description: "CASH | ACCRUAL — net-income computation basis", constraints: "one of {CASH, ACCRUAL}" }
      - { name: gross_cents, type: integer, source: computed, default: 0, description: "Rent collected in the period (CASH) or billed for the period (ACCRUAL)" }
      - { name: management_fee_cents, type: integer, source: computed, default: 0, description: "Owner management fee on gross, per Owner.management_fee_pct" }
      - { name: maintenance_cents, type: integer, source: computed, default: 0, description: "Owner-charged maintenance completed in the period" }
      - { name: net_to_owner_cents, type: integer, source: computed, default: 0, description: "= max(0, gross - management_fee - maintenance)" }
      - { name: distribution_cents, type: integer, source: computed, default: 0, description: "Amount actually paid to owner at distribution (bounded by Property.distributable_cents)" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT | FINALIZED | DISTRIBUTED", constraints: "one of {DRAFT, FINALIZED, DISTRIBUTED}" }

  - name: TurnoverProject
    parent: null
    common_fields: true
    fields:
      - { name: unit_id, type: string, source: input, description: "FK -> Unit.id; the unit being turned over" }
      - { name: opened_date, type: string, source: input, description: "ISO date turnover opened, YYYY-MM-DD" }
      - { name: target_ready_date, type: string, source: input, description: "ISO target date the unit will be VACANT_READY, YYYY-MM-DD", constraints: "target_ready_date >= opened_date" }
      - { name: make_ready_cost_cents, type: integer, source: input, default: 0, description: "Turnover make-ready cost in cents, debited to trust at completion when > 0", constraints: ">= 0" }
      - { name: status, type: enum, source: system, default: "OPEN", description: "OPEN | IN_PROGRESS | READY", constraints: "one of {OPEN, IN_PROGRESS, READY}" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Applicant
    initial_state: SUBMITTED
    terminal_states: [DENIED, LEASED, WITHDRAWN]
    transitions:
      - from: SUBMITTED
        to: SCREENED
        trigger: "POST /applicants/{id}/screen"
        actor: PropertyManager
        preconditions:
          - "Applicant.status == SUBMITTED"
        side_effects:
          - "Run applicant_screening calc; set screening_decision, rent_to_income_ratio, dti_ratio"

      - from: SCREENED
        to: APPROVED
        trigger: "POST /applicants/{id}/decide with decision=APPROVE"
        actor: PropertyManager
        preconditions:
          - "Applicant.status == SCREENED"
          - "Applicant.screening_decision == PASS (else ERR_SCREENING_FAILED)"
          - "Unit referenced by Applicant.unit_id has occupancy_status == VACANT_READY (else ERR_UNIT_NOT_AVAILABLE)"
        side_effects: []

      - from: SCREENED
        to: DENIED
        trigger: "POST /applicants/{id}/decide with decision=DENY"
        actor: PropertyManager
        preconditions:
          - "Applicant.status == SCREENED"
        side_effects: []

      - from: APPROVED
        to: LEASED
        trigger: "system: side-effect of Lease DRAFT -> ACTIVE (sign)"
        actor: system
        preconditions:
          - "A Lease referencing this Applicant transitions DRAFT -> ACTIVE"
        side_effects: []

      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /applicants/{id}/withdraw"
        actor: Applicant
        preconditions:
          - "Applicant.status IN {SUBMITTED, SCREENED, APPROVED}"
        side_effects: []

      - from: SCREENED
        to: WITHDRAWN
        trigger: "POST /applicants/{id}/withdraw"
        actor: Applicant
        preconditions:
          - "Applicant.status IN {SUBMITTED, SCREENED, APPROVED}"
        side_effects: []

      - from: APPROVED
        to: WITHDRAWN
        trigger: "POST /applicants/{id}/withdraw"
        actor: Applicant
        preconditions:
          - "Applicant.status IN {SUBMITTED, SCREENED, APPROVED}"
        side_effects: []

  - entity: Lease
    initial_state: DRAFT
    terminal_states: [EXPIRED, TERMINATED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /leases/{id}/sign"
        actor: PropertyManager
        preconditions:
          - "Lease.status == DRAFT"
          - "For an ORIGINAL lease: Applicant referenced by Lease.applicant_id has status APPROVED (else ERR_APPLICANT_NOT_APPROVED). For a RENEWAL: the prior lease (renewed_from_lease_id) supplies the tenant; no applicant check."
          - "Unit referenced by Lease.unit_id has occupancy_status == VACANT_READY, OR this is a renewal whose renewed_from_lease_id == Unit.active_lease_id (renewal exemption) (else ERR_UNIT_NOT_AVAILABLE)"
          - "A SecurityDeposit exists for this lease in status HELD (else ERR_DEPOSIT_REQUIRED)"
        side_effects:
          - "ORIGINAL lease: mint a Tenant from the Applicant; set Lease.tenant_id (cascade hop 1). RENEWAL: set Lease.tenant_id to the prior lease's tenant_id (the same Tenant stays CURRENT)."
          - "ORIGINAL lease: Applicant.status -> LEASED (cascade hop 2, driven by hop 1's lease activation)"
          - "Unit.occupancy_status -> OCCUPIED; Unit.active_lease_id -> this Lease.id (cascade hop 3)"
          - "If renewal (renewed_from_lease_id set): prior Lease.status -> EXPIRED and prior.superseded_by_lease_id -> this Lease.id (cascade hop 4)"

      - from: ACTIVE
        to: RENEWAL_OFFERED
        trigger: "POST /leases/{id}/offer-renewal"
        actor: PropertyManager
        preconditions:
          - "Lease.status == ACTIVE"
          - "expected_lease_version matches Lease.version (else ERR_STALE_VERSION)"
        side_effects:
          - "increments Lease.version by 1"

      - from: RENEWAL_OFFERED
        to: ACTIVE
        trigger: "POST /leases/{id}/offer-renewal (retract the standing offer)"
        actor: PropertyManager
        preconditions:
          - "Lease.status == RENEWAL_OFFERED"
          - "expected_lease_version matches Lease.version (else ERR_STALE_VERSION)"
        side_effects:
          - "Withdraw the standing renewal offer; lease returns to ACTIVE"
          - "increments Lease.version by 1"
        note: "Cyclic edge: ACTIVE -> RENEWAL_OFFERED -> ACTIVE; a renewal offer can be retracted."

      - from: ACTIVE
        to: EXPIRED
        trigger: "POST /leases/{id}/expire"
        actor: PropertyManager
        preconditions:
          - "Lease.status == ACTIVE"
          - "as_of_date >= Lease.end_date (else ERR_LEASE_NOT_ENDED)"
        side_effects:
          - "Unit.occupancy_status -> VACANT_TURN; Unit.active_lease_id -> null (cascade hop 1)"
          - "Tenant.status -> FORMER (cascade hop 2)"

      - from: ACTIVE
        to: TERMINATED
        trigger: "system: side-effect of EvictionCase FILED -> ENFORCED"
        actor: system
        preconditions:
          - "Lease.status == ACTIVE"
        side_effects:
          - "Tenant.status -> FORMER (eviction cascade hop 2)"
          - "Unit.occupancy_status -> VACANT_TURN; Unit.active_lease_id -> null (eviction cascade hop 3)"
          - "Auto-open a TurnoverProject for the unit, opened_date = enforce date, target_ready_date = opened_date + DEFAULT_TURN_DAYS (eviction cascade hop 4)"

  - entity: RentCharge
    initial_state: OPEN
    terminal_states: [PAID, WAIVED]
    transitions:
      - from: OPEN
        to: PARTIAL
        trigger: "system: Payment waterfall applies a partial amount"
        actor: system
        preconditions:
          - "0 < amount_paid_cents < amount_cents"
        side_effects:
          - "Recompute amount_outstanding_cents and Lease.balance_due_cents"

      - from: PARTIAL
        to: PAID
        trigger: "system: Payment waterfall fully covers remaining outstanding"
        actor: system
        preconditions:
          - "amount_paid_cents == amount_cents"
        side_effects:
          - "amount_outstanding_cents -> 0; recompute Lease.balance_due_cents"

      - from: OPEN
        to: PAID
        trigger: "system: Payment waterfall fully covers the charge in one application"
        actor: system
        preconditions:
          - "amount_paid_cents == amount_cents"
        side_effects:
          - "amount_outstanding_cents -> 0; recompute Lease.balance_due_cents"

      - from: OPEN
        to: WAIVED
        trigger: "POST /rent-charges/{id}/waive"
        actor: PropertyManager
        preconditions:
          - "RentCharge.status IN {OPEN, PARTIAL}"
          - "RentCharge.charge_type == LATE_FEE (else ERR_CANNOT_WAIVE_RENT)"
        side_effects:
          - "amount_outstanding_cents -> 0; recompute Lease.balance_due_cents"

      - from: PARTIAL
        to: WAIVED
        trigger: "POST /rent-charges/{id}/waive"
        actor: PropertyManager
        preconditions:
          - "RentCharge.status IN {OPEN, PARTIAL}"
          - "RentCharge.charge_type == LATE_FEE (else ERR_CANNOT_WAIVE_RENT)"
        side_effects:
          - "amount_outstanding_cents -> 0; recompute Lease.balance_due_cents"

  - entity: SecurityDeposit
    initial_state: HELD
    terminal_states: [SETTLED, FORFEITED]
    transitions:
      - from: HELD
        to: SETTLED
        trigger: "POST /security-deposits/{id}/settle (refund_cents > 0)"
        actor: PropertyManager
        preconditions:
          - "SecurityDeposit.status == HELD"
          - "Lease referenced by lease_id has status IN {EXPIRED, TERMINATED} (else ERR_LEASE_STILL_ACTIVE)"
        side_effects:
          - "Run deposit_interest calc to finalize interest_accrued_cents"
          - "Run deposit_settlement calc: set deductions_cents, refund_cents"
          - "Debit Property.trust_balance_cents by refund_cents (else ERR_TRUST_INSUFFICIENT); recompute distributable_cents"

      - from: HELD
        to: FORFEITED
        trigger: "POST /security-deposits/{id}/settle (refund_cents == 0 and full balance consumed by deductions)"
        actor: PropertyManager
        preconditions:
          - "SecurityDeposit.status == HELD"
          - "Lease referenced by lease_id has status IN {EXPIRED, TERMINATED}"
          - "computed refund_cents == 0 AND deductions_cents == collected_cents + interest_accrued_cents"
        side_effects:
          - "refund_cents -> 0; full balance retained against arrears/damages; no trust debit"

  - entity: WorkOrder
    initial_state: OPEN
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: OPEN
        to: ASSIGNED
        trigger: "POST /work-orders/{id}/assign"
        actor: PropertyManager
        preconditions:
          - "WorkOrder.status == OPEN"
        side_effects: []

      - from: ASSIGNED
        to: COMPLETED
        trigger: "POST /work-orders/{id}/complete"
        actor: PropertyManager
        preconditions:
          - "WorkOrder.status == ASSIGNED"
          - "actual_cost_cents provided in request (else ERR_ACTUAL_COST_REQUIRED)"
        side_effects:
          - "Set actual_cost_cents and completed_date"
          - "If charge_to_owner: debit Property.trust_balance_cents by actual_cost_cents (else ERR_TRUST_INSUFFICIENT); recompute distributable_cents"

      - from: OPEN
        to: CANCELLED
        trigger: "POST /work-orders/{id}/cancel"
        actor: PropertyManager
        preconditions:
          - "WorkOrder.status IN {OPEN, ASSIGNED}"
        side_effects: []

      - from: ASSIGNED
        to: CANCELLED
        trigger: "POST /work-orders/{id}/cancel"
        actor: PropertyManager
        preconditions:
          - "WorkOrder.status IN {OPEN, ASSIGNED}"
        side_effects: []

  - entity: EvictionCase
    initial_state: NOTICE_SERVED
    terminal_states: [ENFORCED, DISMISSED]
    transitions:
      - from: NOTICE_SERVED
        to: CURED
        trigger: "POST /evictions/{id}/cure"
        actor: PropertyManager
        preconditions:
          - "EvictionCase.status == NOTICE_SERVED"
          - "as_of_date <= EvictionCase.cure_deadline_date (else ERR_CURE_WINDOW_CLOSED)"
          - "For reason NONPAYMENT: Lease.balance_due_cents == 0 (else ERR_ARREARS_NOT_CLEARED)"
        side_effects: []

      - from: CURED
        to: DISMISSED
        trigger: "POST /evictions/{id}/dismiss"
        actor: ComplianceOfficer
        preconditions:
          - "EvictionCase.status IN {CURED, FILED}"
        side_effects: []

      - from: NOTICE_SERVED
        to: FILED
        trigger: "POST /evictions/{id}/file"
        actor: ComplianceOfficer
        preconditions:
          - "EvictionCase.status == NOTICE_SERVED"
          - "as_of_date > EvictionCase.cure_deadline_date (else ERR_CURE_WINDOW_OPEN)"
        side_effects: []

      - from: FILED
        to: ENFORCED
        trigger: "POST /evictions/{id}/enforce"
        actor: ComplianceOfficer
        preconditions:
          - "EvictionCase.status == FILED"
          - "Lease referenced by lease_id has status == ACTIVE (else ERR_INVALID_STATE)"
        side_effects:
          - "Drive Lease ACTIVE -> TERMINATED (cascade hop 1), which itself terminates the tenant, vacates the unit, and opens turnover"

      - from: FILED
        to: DISMISSED
        trigger: "POST /evictions/{id}/dismiss"
        actor: ComplianceOfficer
        preconditions:
          - "EvictionCase.status IN {CURED, FILED}"
        side_effects: []

  - entity: OwnerStatement
    initial_state: DRAFT
    terminal_states: [DISTRIBUTED]
    transitions:
      - from: DRAFT
        to: FINALIZED
        trigger: "POST /owner-statements/{id}/finalize"
        actor: PropertyManager
        preconditions:
          - "OwnerStatement.status == DRAFT"
        side_effects:
          - "Run owner_statement_net calc with the statement's basis; freeze gross_cents, management_fee_cents, maintenance_cents, net_to_owner_cents"

      - from: FINALIZED
        to: DISTRIBUTED
        trigger: "POST /owner-statements/{id}/distribute"
        actor: PropertyManager
        preconditions:
          - "OwnerStatement.status == FINALIZED"
          - "expected_property_version matches Property.version (else ERR_STALE_VERSION)"
          - "Property.distributable_cents >= 1 (else ERR_NOTHING_TO_DISTRIBUTE)"
        side_effects:
          - "Run distribution calc: distribution_cents = min(net_to_owner_cents, Property.distributable_cents)"
          - "Debit Property.trust_balance_cents by distribution_cents; recompute distributable_cents"
          - "increments Property.version by 1"

  - entity: TurnoverProject
    initial_state: OPEN
    terminal_states: [READY]
    transitions:
      - from: OPEN
        to: IN_PROGRESS
        trigger: "POST /turnovers/{id}/start"
        actor: PropertyManager
        preconditions:
          - "TurnoverProject.status == OPEN"
        side_effects: []

      - from: IN_PROGRESS
        to: READY
        trigger: "POST /turnovers/{id}/complete"
        actor: PropertyManager
        preconditions:
          - "TurnoverProject.status == IN_PROGRESS"
          - "No WorkOrder for the unit in status IN {OPEN, ASSIGNED} (else ERR_OPEN_WORK_ORDERS)"
        side_effects:
          - "Unit.occupancy_status -> VACANT_READY (unit becomes leasable again)"
          - "If make_ready_cost_cents > 0: debit Property.trust_balance_cents by make_ready_cost_cents (else ERR_TRUST_INSUFFICIENT); recompute distributable_cents"

# -----------------------------------------------------------------------------
# 1.2.1 Concurrency Rules (OCC on parent version — true races only)
# -----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: renewal-lease-create-stale-lease
    parent_entity: Lease
    write_endpoint: "POST /leases"
    occ_field: "expected_lease_version"
    description: |
      Creating a renewal Lease (renewed_from_lease_id set) against a prior Lease
      whose version has advanced since the client last observed it is rejected.
      A renewal legitimately supersedes the prior lease at sign time; if the
      prior lease's version is stale, the client's view of which lease is current
      is out of date, so the create is refused with a stale-version error.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: distribute-statement-stale-property
    parent_entity: Property
    write_endpoint: "POST /owner-statements/{id}/distribute"
    occ_field: "expected_property_version"
    description: |
      Distributing an OwnerStatement against a Property whose version has advanced
      since the client last observed it is rejected. Another distribution or trust
      debit may have already drawn the trust down, so the distributable amount the
      client believes it can pay out is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: applicant_screening
    trigger: "POST /applicants/{id}/screen (Applicant SUBMITTED -> SCREENED)"
    algorithm: weighted_scoring
    formula: |
      if annual_income_cents == 0:
        rent_to_income_ratio = 999.9999
        dti_ratio = 999.9999
        screening_decision = FAIL
      else:
        rent_to_income_ratio = round_half_up( (requested_rent_cents * 12) / annual_income_cents, 4 )
        dti_ratio            = round_half_up( ((monthly_debt_cents + requested_rent_cents) * 12) / annual_income_cents, 4 )
        PASS requires ALL of:
          credit_score >= MIN_CREDIT            # >= so exactly MIN_CREDIT passes
          rent_to_income_ratio <= MAX_RTI       # <= so exactly MAX_RTI passes
          dti_ratio <= MAX_DTI
        screening_decision = PASS if all hold else FAIL
    input_set: "single Applicant's submitted fields"
    constants:
      MIN_CREDIT: 620
      MAX_RTI: 0.40
      MAX_DTI: 0.45
    precision: "ratios 4 decimal places, round_half_up; comparisons use >= / <="
    variants:
      - name: zero_income_autofail
        when: "annual_income_cents == 0"
        difference: "ratios are set to 999.9999 sentinel; decision is FAIL regardless of credit_score"

  - name: late_fee_assessment
    trigger: "POST /leases/{id}/assess-late-fees (operator runs the late-fee sweep as of a date)"
    algorithm: threshold
    formula: |
      For each RENT RentCharge on the lease with status IN {OPEN, PARTIAL} and late_fee_assessed == false:
        late_cutoff = due_date + grace_period_days        # inclusive grace
        if as_of_date > late_cutoff:                      # strict >; the last grace day is still on-time
          fee_cents = round_half_up( monthly_rent_cents * late_fee_pct ) + late_fee_flat_cents
          if fee_cents > 0:
            create LATE_FEE RentCharge(amount_cents = fee_cents, due_date = as_of_date, period_label = null)
            set source RENT charge.late_fee_assessed = true
      recompute Lease.balance_due_cents
    input_set: "OPEN/PARTIAL RENT charges on one lease, each assessed at most once"
    constants:
      ROUND_MODE: round_half_up
    precision: "round the percentage component to whole cents (round_half_up) BEFORE adding the flat component"
    variants:
      - name: grace_boundary_exact
        when: "as_of_date == due_date + grace_period_days exactly"
        difference: "no fee — the comparison is strict >, so the final grace day produces nothing"

  - name: payment_waterfall
    trigger: "POST /payments (Payment created)"
    algorithm: waterfall_allocation
    formula: |
      candidates = RentCharges on lease with status IN {OPEN, PARTIAL}
      order candidates by:
        1. charge_type rank: LATE_FEE (rank 0) before RENT (rank 1)
        2. due_date ASC
        3. created_at ASC          # tie-break; id is NEVER used
      remaining = payment.amount_cents
      applied_to_rent_cents = 0
      for charge in order:
        pay = min(remaining, charge.amount_outstanding_cents)
        charge.amount_paid_cents += pay ; remaining -= pay
        append {charge_id, applied_cents: pay} to applied_breakdown
        if charge.charge_type == RENT: applied_to_rent_cents += pay
        if remaining == 0: break
      payment.unapplied_cents = remaining
      credit Property.trust_balance_cents by applied_to_rent_cents ; recompute distributable_cents
    input_set: "OPEN/PARTIAL charges on the paid lease at payment time"
    constants:
      LATE_FEE_RANK: 0
      RENT_RANK: 1
    precision: "integer cents; allocation is exact, no rounding"
    variants:
      - name: overpayment_credit
        when: "payment exceeds total outstanding across all open charges"
        difference: "all charges close; residual is retained as unapplied_cents credit, never auto-refunded"

  - name: deposit_interest
    trigger: "POST /security-deposits/{id}/settle (HELD -> SETTLED/FORFEITED)"
    algorithm: tiered_pricing
    formula: |
      rate = STATE_INTEREST_RATE[Property.state_code]        # annual simple rate; Property reached via Lease.unit_id -> Unit.property_id
      full_years = floor( days_between(collected_date, settlement_date) / DAYS_PER_YEAR )   # only completed 365-day years accrue
      interest_accrued_cents = round_half_up( collected_cents * rate * full_years )
    input_set: "one SecurityDeposit; state rate keyed off the owning Property.state_code"
    constants:
      STATE_INTEREST_RATE: { CA: 0.0000, NY: 0.0150, IL: 0.0050, FL: 0.0000, TX: 0.0000 }
      DAYS_PER_YEAR: 365
    precision: "interest in whole cents, round_half_up; year count is floor of completed 365-day spans (partial years accrue nothing)"
    variants:
      - name: no_interest_state
        when: "Property.state_code IN {CA, FL, TX} (rate 0)"
        difference: "interest_accrued_cents is always 0 regardless of tenure length"

  - name: deposit_settlement
    trigger: "POST /security-deposits/{id}/settle (runs immediately after deposit_interest)"
    algorithm: waterfall_allocation
    formula: |
      available = collected_cents + interest_accrued_cents
      # deductions waterfall in this fixed order:
      d_arrears = min(available, Lease.balance_due_cents)        # 1. outstanding lease arrears
      available -= d_arrears
      d_damage  = min(available, damage_deductions_cents)        # 2. requested damage deductions (default 0)
      available -= d_damage
      deductions_cents = d_arrears + d_damage
      refund_cents     = available
      status = FORFEITED if (refund_cents == 0 AND deductions_cents == collected_cents + interest_accrued_cents) else SETTLED
      if status == SETTLED: debit Property.trust_balance_cents by refund_cents
    input_set: "deposit principal + accrued interest, lease arrears (balance_due_cents), requested damage deductions"
    constants:
      ROUND_MODE: round_half_up
    precision: "integer cents; waterfall is exact, no rounding"
    variants:
      - name: arrears_consume_principal
        when: "Lease.balance_due_cents >= collected_cents + interest_accrued_cents"
        difference: "damage deductions get nothing; refund is 0; status FORFEITED; no trust debit"

  - name: owner_statement_net
    trigger: "POST /owner-statements/{id}/finalize (DRAFT -> FINALIZED)"
    algorithm: aggregation
    formula: |
      leases = Leases whose unit_id resolves to a Unit with property_id == statement.property_id
      if basis == CASH:
        gross_cents = sum(Payment.applied_to_rent_cents for Payments on those leases
                          where Payment.received_date falls in the period_label month)
      if basis == ACCRUAL:
        gross_cents = sum(RentCharge.amount_cents for RENT charges on those leases
                          where RentCharge.period_label == statement.period_label)
      management_fee_cents = round_half_up( gross_cents * Owner.management_fee_pct )
      maintenance_cents    = sum(WorkOrder.actual_cost_cents for COMPLETED work orders on those units
                                 where charge_to_owner == true AND completed_date falls in the period_label month)
      net_to_owner_cents   = max(0, gross_cents - management_fee_cents - maintenance_cents)
    input_set: "Payments / RentCharges / WorkOrders scoped to the property for the period; basis selects CASH vs ACCRUAL gross"
    constants:
      ROUND_MODE: round_half_up
    precision: "management fee rounded once on the gross, round_half_up; all sums exact integer cents"
    variants:
      - name: cash_basis
        when: "basis == CASH"
        difference: "gross is rent actually collected (applied_to_rent_cents) in the month"
      - name: accrual_basis
        when: "basis == ACCRUAL"
        difference: "gross is rent billed (RENT charge amounts) for the period regardless of payment — a different number from cash for the same property/period"

  - name: property_distributable
    trigger: "any Property trust mutation (rent collected, maintenance/refund/distribution debit, manual funding)"
    algorithm: aggregation
    formula: |
      distributable_cents = max(0, trust_balance_cents - reserve_floor_cents)
    input_set: "single Property trust_balance_cents and reserve_floor_cents"
    constants: {}
    precision: "integer cents; floored at 0"

  - name: eviction_cure_deadline
    trigger: "POST /evictions (EvictionCase created, NOTICE_SERVED)"
    algorithm: threshold
    formula: |
      cure_days = STATE_CURE_DAYS[Property.state_code][reason]     # Property reached via Lease.unit_id -> Unit.property_id
      cure_deadline_date = notice_date + cure_days                 # whole-day ISO date arithmetic
      arrears_at_notice_cents = Lease.balance_due_cents snapshot at notice time
    input_set: "owning Property.state_code and eviction reason"
    constants:
      STATE_CURE_DAYS:
        CA: { NONPAYMENT: 3, LEASE_VIOLATION: 3, HOLDOVER: 30 }
        NY: { NONPAYMENT: 14, LEASE_VIOLATION: 10, HOLDOVER: 30 }
        TX: { NONPAYMENT: 3, LEASE_VIOLATION: 3, HOLDOVER: 3 }
        IL: { NONPAYMENT: 5, LEASE_VIOLATION: 10, HOLDOVER: 30 }
        FL: { NONPAYMENT: 3, LEASE_VIOLATION: 7, HOLDOVER: 15 }
      DEFAULT_TURN_DAYS: 14
    precision: "whole days; cure allowed through (<=) the deadline, file allowed strictly after (>)"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role permitted for this operation per §1.7 RBAC"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Path resource ({id}) exists"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: business_referential
    check: "Body foreign keys resolve (owner_id, property_id, unit_id, applicant_id, lease_id, renewed_from_lease_id)"
    error_id: ERR_FK_NOT_FOUND
    http_status: 404
    applies_to: "POST /properties, POST /units, POST /applicants, POST /leases, POST /rent-charges, POST /payments, POST /security-deposits, POST /work-orders, POST /evictions, POST /owner-statements, POST /turnovers"

  - priority: 5
    category: business_constraint
    check: "Required body fields present; types/enums/ranges valid (credit_score 300-850, amounts > 0, end_date > start_date, valid enum members)"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: all

  - priority: 6
    category: state
    check: "OCC: expected_<parent>_version equals the parent's current version on guarded writes"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /leases (renewal), POST /leases/{id}/offer-renewal, POST /owner-statements/{id}/distribute"

  - priority: 7
    category: state
    check: "Target resource is in a state that admits the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints (screen, decide, sign, offer-renewal, expire, waive, settle, assign, complete, cancel, cure, file, enforce, dismiss, finalize, distribute, start, turnover complete)"

  - priority: 8
    category: business_safety
    check: "Screening gate: cannot approve an applicant whose screening_decision == FAIL"
    error_id: ERR_SCREENING_FAILED
    http_status: 409
    applies_to: "POST /applicants/{id}/decide"

  - priority: 9
    category: business_temporal
    check: "Cure window: cure allowed only on or before cure_deadline_date; file allowed only strictly after it"
    error_id: ERR_CURE_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /evictions/{id}/cure, POST /evictions/{id}/file"

  - priority: 9.5
    category: business_temporal
    check: "Eviction-notice window overlap: a new notice's notice_date must not fall inside an existing non-terminal EvictionCase's closed window [notice_date, cure_deadline_date] on the same lease (inclusive of BOTH endpoints)"
    error_id: ERR_EVICTION_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /evictions"

  - priority: 10
    category: business_temporal
    check: "Lease expiry requires as_of_date >= end_date"
    error_id: ERR_LEASE_NOT_ENDED
    http_status: 409
    applies_to: "POST /leases/{id}/expire"

  - priority: 10.5
    category: business_temporal
    check: "Lease-term overlap on a unit: a new lease's half-open term [start_date, end_date) must not overlap the term of any existing ACTIVE/RENEWAL_OFFERED lease on the same unit; adjacency (prev.end_date == new.start_date) is allowed"
    error_id: ERR_LEASE_OVERLAP
    http_status: 409
    applies_to: "POST /leases"

  - priority: 11
    category: business_constraint
    check: "Unit availability: unit must be VACANT_READY to approve an applicant for it, or to create/sign a NON-renewal lease on it. RENEWAL EXEMPTION: a renewal lease (renewed_from_lease_id == Unit.active_lease_id) may be created and signed even while the unit is OCCUPIED by the prior lease, because signing it supersedes the prior lease."
    error_id: ERR_UNIT_NOT_AVAILABLE
    http_status: 409
    applies_to: "POST /applicants/{id}/decide, POST /leases/{id}/sign, POST /leases"

  - priority: 12
    category: business_constraint
    check: "Late-fee waiver only applies to LATE_FEE charges, never RENT charges"
    error_id: ERR_CANNOT_WAIVE_RENT
    http_status: 409
    applies_to: "POST /rent-charges/{id}/waive"

  - priority: 13
    category: business_referential
    check: "Turnover completion blocked while the unit has any OPEN/ASSIGNED work orders"
    error_id: ERR_OPEN_WORK_ORDERS
    http_status: 409
    applies_to: "POST /turnovers/{id}/complete"

  - priority: 14
    category: business_fiscal
    check: "Trust solvency: a trust debit (maintenance, distribution, deposit refund, make-ready) must not drive trust_balance_cents below 0"
    error_id: ERR_TRUST_INSUFFICIENT
    http_status: 409
    applies_to: "POST /work-orders/{id}/complete, POST /owner-statements/{id}/distribute, POST /security-deposits/{id}/settle, POST /turnovers/{id}/complete"

# =============================================================================
# 1.5 API Endpoint Table  (flat topology; FK references in body)
# =============================================================================
endpoints:
  # ---- Owner ----
  - method: POST
    path: "/owners"
    description: "Create an Owner"
    roles: [PropertyManager]
    code: 201
    input: ["legal_name", "email", "management_fee_pct", "distribution_method?"]
    output: Owner
    side_effects: []

  - method: GET
    path: "/owners/{ownerId}"
    description: "Get an Owner"
    roles: [PropertyManager, Owner]
    code: 200
    input: []
    output: Owner
    side_effects: []

  # ---- Property ----
  - method: POST
    path: "/properties"
    description: "Create a Property under an Owner"
    roles: [PropertyManager]
    code: 201
    input: ["owner_id", "name", "state_code", "address", "reserve_floor_cents?"]
    output: Property
    side_effects: ["trust_balance_cents=0, distributable_cents=0, unit_count=0, version=1"]

  - method: GET
    path: "/properties/{propertyId}"
    description: "Get a Property (includes trust ledger and version)"
    roles: [PropertyManager, Owner]
    code: 200
    input: []
    output: Property
    side_effects: []

  - method: GET
    path: "/properties"
    description: "List properties, optionally filtered by owner_id (reverse-reachability for Property.owner_id)"
    roles: [PropertyManager, Owner]
    code: 200
    input: ["owner_id?", "limit?", "offset?"]
    output: Property[]
    side_effects: []

  - method: POST
    path: "/properties/{propertyId}/trust-deposits"
    description: "Operator records a manual trust funding (e.g. owner capital injection) into the property trust"
    roles: [PropertyManager]
    code: 201
    input: ["amount_cents"]
    output: Property
    side_effects: ["credit Property.trust_balance_cents; recompute distributable_cents"]

  # ---- Unit ----
  - method: POST
    path: "/units"
    description: "Create a Unit under a property"
    roles: [PropertyManager]
    code: 201
    input: ["property_id", "label", "market_rent_cents"]
    output: Unit
    side_effects: ["occupancy_status=VACANT_READY; increment Property.unit_count"]

  - method: GET
    path: "/units/{unitId}"
    description: "Get a Unit"
    roles: [PropertyManager, Owner, Tenant]
    code: 200
    input: []
    output: Unit
    side_effects: []

  - method: GET
    path: "/units"
    description: "List units, optionally filtered by property_id (reverse-reachability for Unit.property_id)"
    roles: [PropertyManager, Owner]
    code: 200
    input: ["property_id?", "limit?", "offset?"]
    output: Unit[]
    side_effects: []

  # ---- Applicant ----
  - method: POST
    path: "/applicants"
    description: "Submit a rental application for a unit"
    roles: [PropertyManager, Applicant]
    code: 201
    input: ["full_name", "email", "unit_id", "annual_income_cents", "credit_score", "requested_rent_cents", "monthly_debt_cents?"]
    output: Applicant
    side_effects: ["status=SUBMITTED"]

  - method: GET
    path: "/applicants/{applicantId}"
    description: "Get an Applicant (includes screening outputs)"
    roles: [PropertyManager, Applicant]
    code: 200
    input: []
    output: Applicant
    side_effects: []

  - method: GET
    path: "/applicants"
    description: "List applicants, optionally filtered by unit_id (reverse-reachability for Applicant.unit_id)"
    roles: [PropertyManager]
    code: 200
    input: ["unit_id?", "status?", "limit?", "offset?"]
    output: Applicant[]
    side_effects: []

  - method: POST
    path: "/applicants/{applicantId}/screen"
    description: "Run tenant screening/credit; computes screening_decision and ratios"
    roles: [PropertyManager]
    code: 200
    input: []
    output: Applicant
    side_effects: ["applicant_screening calc; SUBMITTED -> SCREENED"]

  - method: POST
    path: "/applicants/{applicantId}/decide"
    description: "Approve or deny a screened applicant"
    roles: [PropertyManager]
    code: 200
    input: ["decision"]
    output: Applicant
    side_effects: ["SCREENED -> APPROVED (decision=APPROVE) or DENIED (decision=DENY)"]

  - method: POST
    path: "/applicants/{applicantId}/withdraw"
    description: "Applicant withdraws their application"
    roles: [Applicant, PropertyManager]
    code: 200
    input: []
    output: Applicant
    side_effects: ["status -> WITHDRAWN"]

  # ---- Lease ----
  - method: POST
    path: "/leases"
    description: "Create a DRAFT lease from an approved applicant; optionally a renewal of a prior lease"
    roles: [PropertyManager]
    code: 201
    input: ["unit_id", "applicant_id?", "start_date", "end_date", "monthly_rent_cents", "rent_due_day?", "grace_period_days?", "late_fee_flat_cents?", "late_fee_pct?", "renewed_from_lease_id?", "expected_lease_version?"]
    output: Lease
    side_effects: ["status=DRAFT; original lease requires applicant_id (APPROVED applicant); renewal (renewed_from_lease_id set) requires expected_lease_version and omits applicant_id, inheriting the prior lease's tenant; if renewal: OCC-check prior Lease.version via expected_lease_version (ERR_STALE_VERSION) AND on success increments prior Lease.version by 1 (so a later stale renewal create is rejected); lease half-open term must not overlap an existing ACTIVE/RENEWAL_OFFERED lease on the unit other than the prior lease being renewed (ERR_LEASE_OVERLAP)"]

  - method: GET
    path: "/leases/{leaseId}"
    description: "Get a Lease (includes balance_due_cents and version)"
    roles: [PropertyManager, Owner, Tenant]
    code: 200
    input: []
    output: Lease
    side_effects: []

  - method: GET
    path: "/leases"
    description: "List leases, filtered by unit_id, applicant_id, or renewed_from_lease_id (reverse-reachability for Lease.unit_id, Lease.applicant_id, Lease.renewed_from_lease_id)"
    roles: [PropertyManager, Owner]
    code: 200
    input: ["unit_id?", "applicant_id?", "renewed_from_lease_id?", "status?", "limit?", "offset?"]
    output: Lease[]
    side_effects: []

  - method: POST
    path: "/leases/{leaseId}/sign"
    description: "Sign a DRAFT lease, activating it"
    roles: [PropertyManager]
    code: 200
    input: []
    output: Lease
    side_effects: ["DRAFT -> ACTIVE; mint Tenant; Applicant -> LEASED; Unit -> OCCUPIED; renewal supersede cascade"]

  - method: POST
    path: "/leases/{leaseId}/offer-renewal"
    description: "Offer or retract a renewal on a lease (cyclic ACTIVE <-> RENEWAL_OFFERED)"
    roles: [PropertyManager]
    code: 200
    input: ["expected_lease_version"]
    output: Lease
    side_effects: ["ACTIVE -> RENEWAL_OFFERED or RENEWAL_OFFERED -> ACTIVE; increments Lease.version by 1"]

  - method: POST
    path: "/leases/{leaseId}/expire"
    description: "Expire an ACTIVE lease whose end_date has passed"
    roles: [PropertyManager]
    code: 200
    input: ["as_of_date"]
    output: Lease
    side_effects: ["ACTIVE -> EXPIRED; Unit -> VACANT_TURN; Tenant -> FORMER"]

  - method: POST
    path: "/leases/{leaseId}/assess-late-fees"
    description: "Run the late-fee sweep for the lease as of a date"
    roles: [PropertyManager]
    code: 200
    input: ["as_of_date"]
    output: Lease
    side_effects: ["late_fee_assessment calc; create LATE_FEE charges; recompute Lease.balance_due_cents"]

  # ---- RentCharge ----
  - method: POST
    path: "/rent-charges"
    description: "Post a RENT charge on an ACTIVE lease (operator rent-roll posting)"
    roles: [PropertyManager]
    code: 201
    input: ["lease_id", "period_label", "due_date", "amount_cents", "charge_type?"]
    output: RentCharge
    side_effects: ["status=OPEN; recompute Lease.balance_due_cents"]

  - method: GET
    path: "/rent-charges/{chargeId}"
    description: "Get a RentCharge"
    roles: [PropertyManager, Owner, Tenant]
    code: 200
    input: []
    output: RentCharge
    side_effects: []

  - method: GET
    path: "/rent-charges"
    description: "List rent charges, filtered by lease_id (reverse-reachability for RentCharge.lease_id)"
    roles: [PropertyManager, Owner, Tenant]
    code: 200
    input: ["lease_id?", "status?", "charge_type?", "limit?", "offset?"]
    output: RentCharge[]
    side_effects: []

  - method: POST
    path: "/rent-charges/{chargeId}/waive"
    description: "Waive a LATE_FEE charge"
    roles: [PropertyManager]
    code: 200
    input: []
    output: RentCharge
    side_effects: ["OPEN/PARTIAL -> WAIVED; recompute Lease.balance_due_cents"]

  # ---- Payment ----
  - method: POST
    path: "/payments"
    description: "Record a tenant payment; runs waterfall allocation across open charges"
    roles: [PropertyManager, Tenant]
    code: 201
    input: ["lease_id", "amount_cents", "received_date"]
    output: Payment
    side_effects: ["payment_waterfall calc; charges advance OPEN/PARTIAL/PAID; credit trust by applied_to_rent_cents; recompute Lease.balance_due_cents and distributable_cents"]

  - method: GET
    path: "/payments/{paymentId}"
    description: "Get a Payment (includes applied_breakdown)"
    roles: [PropertyManager, Owner, Tenant]
    code: 200
    input: []
    output: Payment
    side_effects: []

  - method: GET
    path: "/payments"
    description: "List payments, filtered by lease_id (reverse-reachability for Payment.lease_id)"
    roles: [PropertyManager, Owner, Tenant]
    code: 200
    input: ["lease_id?", "limit?", "offset?"]
    output: Payment[]
    side_effects: []

  # ---- SecurityDeposit ----
  - method: POST
    path: "/security-deposits"
    description: "Collect the security deposit for a lease (must exist before signing)"
    roles: [PropertyManager]
    code: 201
    input: ["lease_id", "collected_cents", "collected_date"]
    output: SecurityDeposit
    side_effects: ["status=HELD"]

  - method: GET
    path: "/security-deposits/{depositId}"
    description: "Get a SecurityDeposit"
    roles: [PropertyManager, Owner, Tenant]
    code: 200
    input: []
    output: SecurityDeposit
    side_effects: []

  - method: GET
    path: "/security-deposits"
    description: "List security deposits, filtered by lease_id (reverse-reachability for SecurityDeposit.lease_id; array of 0-1 for a lease)"
    roles: [PropertyManager, Owner, Tenant]
    code: 200
    input: ["lease_id?", "limit?", "offset?"]
    output: SecurityDeposit[]
    side_effects: []

  - method: POST
    path: "/security-deposits/{depositId}/settle"
    description: "Settle the deposit: accrue state interest, run deduction waterfall, refund remainder"
    roles: [PropertyManager]
    code: 200
    input: ["settlement_date", "damage_deductions_cents?"]
    output: SecurityDeposit
    side_effects: ["deposit_interest + deposit_settlement calcs; HELD -> SETTLED/FORFEITED; debit trust by refund"]

  # ---- WorkOrder ----
  - method: POST
    path: "/work-orders"
    description: "Open a maintenance work order on a unit"
    roles: [PropertyManager, Tenant]
    code: 201
    input: ["unit_id", "category", "description", "priority?", "estimate_cents?", "charge_to_owner?"]
    output: WorkOrder
    side_effects: ["status=OPEN"]

  - method: GET
    path: "/work-orders/{workOrderId}"
    description: "Get a WorkOrder"
    roles: [PropertyManager, Owner, Tenant]
    code: 200
    input: []
    output: WorkOrder
    side_effects: []

  - method: GET
    path: "/work-orders"
    description: "List work orders, filtered by unit_id (reverse-reachability for WorkOrder.unit_id)"
    roles: [PropertyManager, Owner, Tenant]
    code: 200
    input: ["unit_id?", "status?", "limit?", "offset?"]
    output: WorkOrder[]
    side_effects: []

  - method: POST
    path: "/work-orders/{workOrderId}/assign"
    description: "Assign an open work order to a vendor"
    roles: [PropertyManager]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["OPEN -> ASSIGNED"]

  - method: POST
    path: "/work-orders/{workOrderId}/complete"
    description: "Complete a work order with actual cost; debits trust when charged to owner"
    roles: [PropertyManager]
    code: 200
    input: ["actual_cost_cents", "completed_date?"]
    output: WorkOrder
    side_effects: ["ASSIGNED -> COMPLETED; if charge_to_owner debit Property.trust_balance_cents; recompute distributable_cents"]

  - method: POST
    path: "/work-orders/{workOrderId}/cancel"
    description: "Cancel a work order"
    roles: [PropertyManager]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["OPEN/ASSIGNED -> CANCELLED"]

  # ---- EvictionCase ----
  - method: POST
    path: "/evictions"
    description: "Serve an eviction notice on a lease; computes the state cure deadline"
    roles: [PropertyManager]
    code: 201
    input: ["lease_id", "reason", "notice_date"]
    output: EvictionCase
    side_effects: ["reject if notice_date overlaps a non-terminal eviction window on the lease (ERR_EVICTION_WINDOW_OVERLAP); eviction_cure_deadline calc; status=NOTICE_SERVED; snapshot arrears_at_notice_cents"]

  - method: GET
    path: "/evictions/{evictionId}"
    description: "Get an EvictionCase"
    roles: [PropertyManager, ComplianceOfficer, Owner]
    code: 200
    input: []
    output: EvictionCase
    side_effects: []

  - method: GET
    path: "/evictions"
    description: "List eviction cases, filtered by lease_id (reverse-reachability for EvictionCase.lease_id)"
    roles: [PropertyManager, ComplianceOfficer, Owner]
    code: 200
    input: ["lease_id?", "status?", "limit?", "offset?"]
    output: EvictionCase[]
    side_effects: []

  - method: POST
    path: "/evictions/{evictionId}/cure"
    description: "Mark an eviction cured within the cure window (arrears cleared for NONPAYMENT)"
    roles: [PropertyManager]
    code: 200
    input: ["as_of_date"]
    output: EvictionCase
    side_effects: ["NOTICE_SERVED -> CURED"]

  - method: POST
    path: "/evictions/{evictionId}/file"
    description: "File the eviction after the cure window closes"
    roles: [ComplianceOfficer]
    code: 200
    input: ["as_of_date"]
    output: EvictionCase
    side_effects: ["NOTICE_SERVED -> FILED"]

  - method: POST
    path: "/evictions/{evictionId}/enforce"
    description: "Enforce a filed eviction; terminates the lease and triggers the turnover cascade"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: EvictionCase
    side_effects: ["FILED -> ENFORCED; Lease -> TERMINATED; Tenant -> FORMER; Unit -> VACANT_TURN; open TurnoverProject"]

  - method: POST
    path: "/evictions/{evictionId}/dismiss"
    description: "Dismiss an eviction case"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: EvictionCase
    side_effects: ["CURED/FILED -> DISMISSED"]

  # ---- OwnerStatement ----
  - method: POST
    path: "/owner-statements"
    description: "Create a DRAFT owner statement for a period and basis"
    roles: [PropertyManager]
    code: 201
    input: ["property_id", "period_label", "basis?"]
    output: OwnerStatement
    side_effects: ["status=DRAFT"]

  - method: GET
    path: "/owner-statements/{statementId}"
    description: "Get an OwnerStatement"
    roles: [PropertyManager, Owner]
    code: 200
    input: []
    output: OwnerStatement
    side_effects: []

  - method: GET
    path: "/owner-statements"
    description: "List statements, filtered by property_id (reverse-reachability for OwnerStatement.property_id)"
    roles: [PropertyManager, Owner]
    code: 200
    input: ["property_id?", "status?", "limit?", "offset?"]
    output: OwnerStatement[]
    side_effects: []

  - method: POST
    path: "/owner-statements/{statementId}/finalize"
    description: "Finalize the statement; computes gross/fee/maintenance/net per basis"
    roles: [PropertyManager]
    code: 200
    input: []
    output: OwnerStatement
    side_effects: ["owner_statement_net calc; DRAFT -> FINALIZED"]

  - method: POST
    path: "/owner-statements/{statementId}/distribute"
    description: "Distribute net to owner, bounded by distributable trust; OCC on Property.version"
    roles: [PropertyManager]
    code: 200
    input: ["expected_property_version"]
    output: OwnerStatement
    side_effects: ["distribution calc; FINALIZED -> DISTRIBUTED; debit Property.trust_balance_cents; increments Property.version by 1"]

  # ---- TurnoverProject ----
  - method: POST
    path: "/turnovers"
    description: "Open a vacancy turnover project for a unit in VACANT_TURN"
    roles: [PropertyManager]
    code: 201
    input: ["unit_id", "opened_date", "target_ready_date", "make_ready_cost_cents?"]
    output: TurnoverProject
    side_effects: ["status=OPEN"]

  - method: GET
    path: "/turnovers/{turnoverId}"
    description: "Get a TurnoverProject"
    roles: [PropertyManager, Owner]
    code: 200
    input: []
    output: TurnoverProject
    side_effects: []

  - method: GET
    path: "/turnovers"
    description: "List turnovers, filtered by unit_id (reverse-reachability for TurnoverProject.unit_id)"
    roles: [PropertyManager, Owner]
    code: 200
    input: ["unit_id?", "status?", "limit?", "offset?"]
    output: TurnoverProject[]
    side_effects: []

  - method: POST
    path: "/turnovers/{turnoverId}/start"
    description: "Start make-ready work"
    roles: [PropertyManager]
    code: 200
    input: []
    output: TurnoverProject
    side_effects: ["OPEN -> IN_PROGRESS"]

  - method: POST
    path: "/turnovers/{turnoverId}/complete"
    description: "Complete turnover; returns unit to VACANT_READY when no open work orders remain"
    roles: [PropertyManager]
    code: 200
    input: []
    output: TurnoverProject
    side_effects: ["IN_PROGRESS -> READY; Unit -> VACANT_READY; optional make-ready trust debit"]

  # ---- Tenant ----
  - method: GET
    path: "/tenants/{tenantId}"
    description: "Get a Tenant"
    roles: [PropertyManager, Tenant]
    code: 200
    input: []
    output: Tenant
    side_effects: []

  - method: GET
    path: "/tenants"
    description: "List tenants, filtered by applicant_id (reverse-reachability for Tenant.applicant_id)"
    roles: [PropertyManager]
    code: 200
    input: ["applicant_id?", "limit?", "offset?"]
    output: Tenant[]
    side_effects: []

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or unknown X-User-Role" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for this operation" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path resource {id} does not exist" }
  - { id: ERR_FK_NOT_FOUND, http: 404, condition: "A body foreign key does not resolve (owner_id, property_id, unit_id, applicant_id, lease_id, renewed_from_lease_id)" }
  - { id: ERR_INVALID_REQUEST, http: 422, condition: "Missing required field, bad type, out-of-range value, or invalid enum member" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent's current version" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource is not in a state that admits the requested transition" }
  - { id: ERR_SCREENING_FAILED, http: 409, condition: "Cannot approve an applicant whose screening_decision is FAIL" }
  - { id: ERR_APPLICANT_NOT_APPROVED, http: 409, condition: "Lease sign requires the source applicant in status APPROVED" }
  - { id: ERR_UNIT_NOT_AVAILABLE, http: 409, condition: "Unit is not VACANT_READY for approval/sign, or lease terms overlap an existing ACTIVE lease on the unit" }
  - { id: ERR_DEPOSIT_REQUIRED, http: 409, condition: "Lease sign requires a SecurityDeposit in status HELD" }
  - { id: ERR_LEASE_NOT_ENDED, http: 409, condition: "Lease expire attempted before end_date (as_of_date < end_date)" }
  - { id: ERR_LEASE_OVERLAP, http: 409, condition: "New lease half-open term [start_date, end_date) overlaps an existing ACTIVE/RENEWAL_OFFERED lease on the same unit (adjacency allowed)" }
  - { id: ERR_EVICTION_WINDOW_OVERLAP, http: 409, condition: "New eviction notice_date falls inside an existing non-terminal eviction's closed window [notice_date, cure_deadline_date] on the same lease" }
  - { id: ERR_LEASE_STILL_ACTIVE, http: 409, condition: "Deposit settlement requires the lease in EXPIRED or TERMINATED" }
  - { id: ERR_CANNOT_WAIVE_RENT, http: 409, condition: "Waiver attempted on a RENT charge; only LATE_FEE charges may be waived" }
  - { id: ERR_CURE_WINDOW_CLOSED, http: 409, condition: "Eviction cure attempted after cure_deadline_date" }
  - { id: ERR_CURE_WINDOW_OPEN, http: 409, condition: "Eviction file attempted while the cure window is still open" }
  - { id: ERR_ARREARS_NOT_CLEARED, http: 409, condition: "NONPAYMENT eviction cure attempted while lease balance_due_cents > 0" }
  - { id: ERR_OPEN_WORK_ORDERS, http: 409, condition: "Turnover completion blocked by OPEN/ASSIGNED work orders on the unit" }
  - { id: ERR_ACTUAL_COST_REQUIRED, http: 422, condition: "Work-order completion requires actual_cost_cents" }
  - { id: ERR_TRUST_INSUFFICIENT, http: 409, condition: "A trust debit would drive trust_balance_cents below 0" }
  - { id: ERR_NOTHING_TO_DISTRIBUTE, http: 409, condition: "Distribution attempted when Property.distributable_cents < 1" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PropertyManager
    description: "Operator who runs day-to-day management: owners, properties, units, screening, leasing, rent roll, deposits, maintenance, statements, turnovers. Cannot file/enforce/dismiss evictions (ComplianceOfficer's exclusive surface)."
    identity: "opaque"
    exclusive_operations:
      - "POST /owners — create owner"
      - "POST /properties — create property"
      - "POST /properties/{id}/trust-deposits — fund trust"
      - "POST /units — create unit"
      - "POST /applicants/{id}/screen — run screening"
      - "POST /applicants/{id}/decide — approve/deny applicant"
      - "POST /leases — create lease (incl. renewal)"
      - "POST /leases/{id}/sign — sign lease"
      - "POST /leases/{id}/offer-renewal — offer/retract renewal"
      - "POST /leases/{id}/expire — expire lease"
      - "POST /leases/{id}/assess-late-fees — run late-fee sweep"
      - "POST /rent-charges — post rent charge"
      - "POST /rent-charges/{id}/waive — waive late fee"
      - "POST /security-deposits — collect deposit"
      - "POST /security-deposits/{id}/settle — settle deposit"
      - "POST /work-orders/{id}/assign|complete|cancel — manage work orders"
      - "POST /evictions — serve notice"
      - "POST /evictions/{id}/cure — mark cured"
      - "POST /owner-statements — create statement"
      - "POST /owner-statements/{id}/finalize — finalize statement"
      - "POST /owner-statements/{id}/distribute — distribute to owner"
      - "POST /turnovers + /turnovers/{id}/start + /turnovers/{id}/complete — manage turnover"
    shared_operations:
      - "POST /applicants — submit application (shared with Applicant)"
      - "POST /applicants/{id}/withdraw — withdraw application (shared with Applicant)"
      - "POST /payments — record payment (shared with Tenant)"
      - "POST /work-orders — open work order (shared with Tenant)"
      - "GET endpoints across the domain"

  - name: Owner
    description: "Property owner; read-only visibility into their own properties, units, leases, charges, payments, deposits, statements, turnovers, and evictions."
    identity: "entity_backed:Owner"
    exclusive_operations: []
    shared_operations:
      - "GET /owners/{id} — own owner record"
      - "GET /properties, /properties/{id} — owned properties"
      - "GET /units, /leases, /rent-charges, /payments, /security-deposits, /work-orders, /owner-statements, /turnovers, /evictions — read-only on owned property's resources"

  - name: Tenant
    description: "Current/former tenant; can pay rent, open work orders, and read their own lease, charges, payments, deposit, unit, and tenant record."
    identity: "entity_backed:Tenant"
    exclusive_operations: []
    shared_operations:
      - "POST /payments — pay rent (shared with PropertyManager)"
      - "POST /work-orders — open maintenance request (shared with PropertyManager)"
      - "GET /leases/{id}, /rent-charges, /payments, /security-deposits, /units/{id}, /tenants/{id}, /work-orders — own resources"

  - name: Applicant
    description: "Prospective tenant; submits and withdraws their own application and reads its status."
    identity: "entity_backed:Applicant"
    exclusive_operations: []
    shared_operations:
      - "POST /applicants — submit application (shared with PropertyManager)"
      - "POST /applicants/{id}/withdraw — withdraw (shared with PropertyManager)"
      - "GET /applicants/{id} — own applicant record"

  - name: ComplianceOfficer
    description: "Operational legal role that files, enforces, and dismisses eviction cases; cannot serve the initial notice, manage rent/leases, or run statements."
    identity: "opaque"
    exclusive_operations:
      - "POST /evictions/{id}/file — file eviction"
      - "POST /evictions/{id}/enforce — enforce eviction"
      - "POST /evictions/{id}/dismiss — dismiss eviction"
    shared_operations:
      - "GET /evictions, /evictions/{id} — read eviction cases"
