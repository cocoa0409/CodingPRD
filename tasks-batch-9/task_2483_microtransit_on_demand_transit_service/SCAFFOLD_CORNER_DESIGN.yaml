            - "TripRequest.${t1_id}.fare_status == QUOTED at that point"
            - "TripRequest.${t1_id}.charged_fare_cents == 325 after completion (SETTLED_CHARGE, ride_minutes 12, MEDIUM band)"
            - "TripRequest.${t1_id}.quoted_fare_cents == 325 still (settlement does not rewrite the quote)"
            - "TripRequest.${t1_id}.applied_cap == NONE and fare_status == CHARGED"
