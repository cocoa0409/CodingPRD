            - call: "POST /parcels"
              payload: { apn: "0856-V4", county_code: "OR", site_address: "57 Stale Site", lot_size_sqft: 40000, water_source: "PUBLIC_WATER" }
              as: Applicant
              as_user_id: "u-app-9"
