              captures: { s1: $.data.id }
            - call: "POST /harvest/seasons"
              payload: { season_year: 2027, diesel_baseline_per_gallon_cents: 300, current_diesel_per_gallon_cents: 300 }
              as: HarvestOperator
              captures: { s2: $.data.id }
