              payload: { issuer_id: "${iss}", book_entry_shares: 300 }
              as: AgentAdmin
              captures: { pos_a: $.data.id }
            - call: "POST /positions/${pos_a}/certificate-withdrawals"
              payload: { share_quantity: 100 }
              as: TransferExaminer
              captures: { cert: $.data.id }
            - call: "POST /transfer-requests"
              payload: { from_account_id: "${acct_a}", to_account_id: "${acct_b}", issuer_id: "${iss}", share_quantity: 100, source_certificate_id: "${cert}", expected_account_version: "${a_v}" }
              as: TransferExaminer
              captures: { t: $.data.id }
            - call: "POST /transfer-requests/${t}/submit-medallion"
              payload: { medallion_reference: "MED-7", coverage_cents: 500000 }
