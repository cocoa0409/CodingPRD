          setup:
            - "Patient last finalized routine exam 2025-05-01 (recall_due 2026-05-01); a SENT RecallReminder for that due date"
            - "A new ROUTINE_VISION encounter refracted, clock at 2026-06-01 (past the reminder due_date)"
