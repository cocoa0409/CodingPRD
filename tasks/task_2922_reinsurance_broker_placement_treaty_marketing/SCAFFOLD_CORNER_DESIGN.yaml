      - name: security_status_action_downgrades_the_market_and_is_not_an_undo_button
        claim_type: Action endpoint
        grounds:
          - endpoints.POST /reinsurers/{reinsurer_id}/security-status
          - validations[priority=38]
          - state_machines.SigningLine[PROVISIONAL->RELEASED manual row]
          - state_machines.Program[FIRM_ORDER->IN_MARKET]
        distinguishing_aspect: |
          The one action endpoint on Reinsurer carries three graded meanings on the SAME field.
          APPROVED -> RESTRICTED is a soft downgrade: the market keeps lead_authorised == true but
          may no longer LEAD a layer (priority 38 needs both flags), while it may still follow and
          may still be firm-ordered because the firm-order precondition admits
          {APPROVED, RESTRICTED}. RESTRICTED -> SUSPENDED is destructive: it releases the market's
          live lines and reverts the layer and the program. And the reverse move SUSPENDED ->
          APPROVED restores only the flag — the released line, the lapsed quote and the reverted
          statuses stay where the suspension left them, so the action endpoint is not an undo.
