          assert:
            - "response status is 409 with data.error_id == 'ERR_EMPTY_DISTRIBUTION_POOL' (not ERR_PENDING_REPORTS_BLOCK_DISTRIBUTION — there are no FILED or RETURNED reports)"
            - "DistributionRun.${run_i3}.status is still 'LOCKED', distributed_at is null, pool_gross_cents == 0, report_count == 0"
            - "GET /licensing/club-distributions?run_id=${run_i3} returns total_count == 0"

  # ===========================================================================
  - section: rbac
    instances:

      - name: licensee_cannot_accept_its_own_royalty_report_unauthorized
        claim_type: unauthorized_operation
        grounds:
          - roles.Licensee
          - roles.FinanceController
          - endpoints.POST_/licensing/royalty-reports/{reportId}/review-decisions
          - errors.ERR_UNAUTHORIZED
        distinguishing_aspect: |
          The Licensee role legitimately creates and files the report, so the
          obvious shortcut is to let it finish the workflow. Accepting is
          exclusive to FinanceController: the Licensee call is a 403
          ERR_UNAUTHORIZED even though the licensee owns the target row (so the
          scope check at priority 4 would have passed), the report stays FILED and
          the agreement ledger is untouched.
        test_recipe:
          setup:
            - "clock at the mandatory default 2026-08-01T00:00:00Z"
            - "licensee LIC_J3 ACTIVE with an ACTIVE agreement AGR_J3, an AUTHORIZED DEPARTMENT authorization and a FILED 2026Q2 report of gross 1000000"
