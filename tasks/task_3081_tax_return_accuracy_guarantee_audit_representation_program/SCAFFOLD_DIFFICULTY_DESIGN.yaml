              as: OfficeManager
              captures: { cli1: $.data.id }
            - call: "POST /tax/clients"
              payload: { full_name: "Client Two", email: "c2@example.com" }
              as: OfficeManager
              captures: { cli2: $.data.id }
            - call: "POST /tax/returns"
              payload: { client_id: "${cli1}", office_id: "${off1}", preparer_id: "${prep1}", tax_year: 2025, components: ["1040_SIMPLE"] }
              as: OfficeManager
              captures: { ret1: $.data.id }
            - call: "POST /tax/returns"
              payload: { client_id: "${cli2}", office_id: "${off1}", preparer_id: "${prep1}", tax_year: 2025, components: ["1040_SIMPLE"] }
              as: OfficeManager
              captures: { ret2: $.data.id }
            - call: "POST /tax/returns/${ret1}/file"
              payload: {}
              as: OfficeManager
            - call: "POST /tax/returns/${ret2}/file"
              payload: {}
              as: OfficeManager
            - call: "POST /tax/products"
              payload: { return_id: "${ret1}", tier: "STANDARD" }
              as: OfficeManager
            - call: "POST /tax/products"
              payload: { return_id: "${ret2}", tier: "STANDARD" }
              as: OfficeManager
            - call: "POST /tax/notices"
              payload: { return_id: "${ret1}", authority_type: "STATE", notice_reference: "ST-1", tax_delta_cents: 1000, penalty_cents: 0, issued_at: "2026-09-10T00:00:00Z", due_at: "2026-10-01T00:00:00Z" }
              as: CaseManager
