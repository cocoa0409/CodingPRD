            - call: "GET /products/${prod_1}"
              payload: {}
              as: ComplianceAnalyst
          assert:
            - "baseline: Product.${prod_1}.total_listed_chemical_load_ug == 7.080"
            - "after quantity 0.7101 on A: total_listed_chemical_load_ug == 11.278 (round(12.345 x 0.7101) = 8.766 plus 2.512)"
            - "after quantity back to 0.37 on A: total_listed_chemical_load_ug == 7.080 exactly - identical to the baseline, no drift"
            - "after contact_factor 0.9 on A: total_listed_chemical_load_ug == 7.080 (contact_factor is not a load input) and ProductComponent.${comp_a}.contact_factor == 0.9"
            - "after REMOVE on B: ProductComponent.${comp_b}.status == REMOVED and total_listed_chemical_load_ug == 4.568, exactly A's own rounded contribution"
            - "Product.${prod_1}.compliance_posture is never ENFORCEMENT_HOLD during the cycle, so no BOM write is refused"

      - name: placement_remediation_cycle_conserves_covered_channel_count
        grounds:
          - state_machines.WarningPlacement.NON_COMPLIANT_to_IMPLEMENTED
          - state_machines.WarningPlacement.IMPLEMENTED_to_NON_COMPLIANT
          - entities.WarningPlacement.fields.remediation_count
          - entities.WarningDetermination.fields.covered_channel_count
          - entities.Product.fields.compliance_posture
        distinguishing_aspect: |
          The remediation loop is a compensating pair whose monotone counter and whose conserved
          roll-up must move differently: remediation_count ratchets 0 -> 1 -> 2 while
          covered_channel_count and compliance_posture must return to exactly their pre-flag values
          each time, so an implementation that decrements covered_channel_count on FLAG but forgets
          to restore it on REMEDIATE, or that recomputes posture from a cached count, diverges after
          the first cycle.
