      - name: store_list_filters_compose_with_pagination_and_total_count
        claim_type: standard_crud
        grounds:
          - endpoints[GET /stores]
          - entities.RetailStore.fields.floor_posture
          - calculations.store_floor_posture
          - response_envelope.pagination_defaults
        distinguishing_aspect: "region_code and floor_posture narrow the set before limit/offset are applied: three stores of which one is SUSPENDED give total_count 2 for floor_posture=OPEN, 2 for region_code=NE, 1 for both together, and a limit=1&offset=1 page over the region_code=NE set still reports total_count 2 with has_more false."
        test_recipe:
          setup:
            - "store1 in region NE, driven to floor_posture SUSPENDED by a rack audit reporting 3 seal breaks (>= rack_seal_break_threshold 3) with no missing cards."
            - "store2 in region NE and store3 in region MW, both left at floor_posture OPEN with no racks."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Alpha Northeast", region_code: "NE", address_line: "45 Alpha Ave" }
              as: PlatformAdmin
              captures: { store1_id: $.data.id }
            - call: "POST /stores"
              payload: { name: "Bravo Northeast", region_code: "NE", address_line: "46 Bravo Blvd" }
              as: PlatformAdmin
              captures: { store2_id: $.data.id }
            - call: "POST /stores"
              payload: { name: "Charlie Midwest", region_code: "MW", address_line: "47 Charlie Ct" }
              as: PlatformAdmin
              captures: { store3_id: $.data.id }
            - call: "POST /card-racks"
              payload: { store_id: "${store1_id}", rack_label: "RACK-SL", expected_card_count: 8 }
              as: PlatformAdmin
              captures: { rack1_id: $.data.id }
            - call: "POST /card-racks/${rack1_id}/audits"
              payload: { observed_card_count: 8, seal_breaks_observed: 3 }
              as: PosAssociate
              captures: { rack_state: $.data.tamper_state }
          trigger:
            - call: "GET /stores"
              payload: { floor_posture: "OPEN" }
              as: FraudAnalyst
            - call: "GET /stores"
              payload: { region_code: "NE" }
              as: FraudAnalyst
            - call: "GET /stores"
              payload: { region_code: "NE", floor_posture: "OPEN" }
              as: FraudAnalyst
            - call: "GET /stores"
              payload: { region_code: "NE", limit: 1, offset: 1 }
              as: FraudAnalyst
          assert:
            - "${rack_state} == TAMPERED and RetailStore.${store1_id}.floor_posture == SUSPENDED"
            - "RetailStore.${store1_id}.tampered_rack_count == 1"
            - "first trigger call: HTTP status == 200, total_count == 2, has_more == false, and the 2 rows are ${store2_id} and ${store3_id}"
            - "second trigger call: total_count == 2 and the rows are ${store1_id} and ${store2_id} — region_code ignores posture"
            - "third trigger call: total_count == 1 and the single row is ${store2_id} — the filters intersect rather than union"
            - "fourth trigger call: total_count == 2, has_more == false, and exactly 1 row is returned — total_count describes the filtered set, not the returned page, and offset 1 of 2 is the last page"

      - name: claim_approval_endpoint_side_effects_reach_four_entities
        claim_type: action_endpoint
        excluded_because:
          difficulty_instance: claim_approval_four_hop_cascade_to_open_liability_period
          rationale: "That §1.8 instance already walks every declared side effect of POST /victim-claims/{id}/decide with APPROVE: the claim payout arithmetic, the CLOSED original card, the minted replacement card with its two LedgerEvents, and the OPEN LiabilityPeriod's unauthorized_writeoff_cents — so a separate endpoint-level side-effect instance would duplicate it exactly."

  # ==========================================================================
  # This section closes out the §1.6 catalog. The codes NOT listed here are
  # triggered by named instances in the sections above (see the ERROR CATALOG
  # COVERAGE MAP in this file's header) or by a §1.8 instance cited in an
  # excluded_because stub. Every not-found probe below uses the literal
  # 00000000-0000-4000-8000-000000000000, which is well formed and absent, so
  # the 404 cannot be confused with a 400 well-formedness rejection.
  # ==========================================================================
  - section: errors
    instances:

      - name: rack_audit_on_unknown_rack_is_not_found
        claim_type: error_triggerable
        grounds:
          - errors.ERR_RACK_NOT_FOUND
          - endpoints[POST /card-racks/{id}/audits]
          - validations[priority=31]
        distinguishing_aspect: "A well-formed audit body posted at an absent rack id returns 404 ERR_RACK_NOT_FOUND rather than 400, and the one real rack in the database is left untouched at INTACT."
        test_recipe:
          setup:
            - "One RetailStore and one INTACT CardRack that is not the target of the trigger."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Rack 404 Store", region_code: "NE", address_line: "48 Rack Rd" }
              as: PlatformAdmin
              captures: { store1_id: $.data.id }
            - call: "POST /card-racks"
              payload: { store_id: "${store1_id}", rack_label: "RACK-404", expected_card_count: 5 }
              as: PlatformAdmin
              captures: { rack1_id: $.data.id }
          trigger:
            - call: "POST /card-racks/00000000-0000-4000-8000-000000000000/audits"
              payload: { observed_card_count: 5, seal_breaks_observed: 0 }
              as: PosAssociate
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404 and ${err} == ERR_RACK_NOT_FOUND"
            - "CardRack.${rack1_id}.tamper_state == INTACT and last_audit_at == null"
            - "RetailStore.${store1_id}.floor_posture == OPEN"

      - name: issuance_screen_on_unknown_request_is_not_found
        claim_type: error_triggerable
        grounds:
          - errors.ERR_ISSUANCE_REQUEST_NOT_FOUND
          - endpoints[POST /issuance-requests/{id}/screen]
        distinguishing_aspect: "Screening an absent issuance request returns 404 ERR_ISSUANCE_REQUEST_NOT_FOUND even though the endpoint takes an empty body, so there is nothing to fail well-formedness on."
        test_recipe:
          setup:
            - "An empty database apart from one RetailStore, so no IssuanceRequest exists at all."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Issuance 404 Store", region_code: "MW", address_line: "49 Issue Ln" }
              as: PlatformAdmin
              captures: { store1_id: $.data.id }
          trigger:
            - call: "POST /issuance-requests/00000000-0000-4000-8000-000000000000/screen"
              payload: {}
              as: PosAssociate
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404 and ${err} == ERR_ISSUANCE_REQUEST_NOT_FOUND"
            - "GET /issuance-requests returns total_count == 0"

      - name: bulk_order_decide_on_unknown_order_is_not_found
        claim_type: error_triggerable
        grounds:
          - errors.ERR_BULK_ORDER_NOT_FOUND
          - endpoints[POST /bulk-purchase-orders/{id}/decide]
        distinguishing_aspect: "The absent-order 404 is raised before any decision semantics run, so a DECLINE at an unknown id returns ERR_BULK_ORDER_NOT_FOUND and not a state or identity error."
        test_recipe:
          setup:
            - "One RetailStore. No BulkPurchaseOrder exists."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Bulk 404 Store", region_code: "SE", address_line: "50 Bulk Blvd" }
              as: PlatformAdmin
              captures: { store1_id: $.data.id }
          trigger:
            - call: "POST /bulk-purchase-orders/00000000-0000-4000-8000-000000000000/decide"
              payload: { decision: "DECLINE", decision_note: "no such order" }
              as: RiskManager
              as_user_id: "risk-75"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404 and ${err} == ERR_BULK_ORDER_NOT_FOUND"
            - "GET /bulk-purchase-orders returns total_count == 0"

      - name: alert_triage_on_unknown_alert_is_not_found
        claim_type: error_triggerable
        grounds:
          - errors.ERR_ALERT_NOT_FOUND
          - endpoints[POST /draining-alerts/{id}/triage]
        distinguishing_aspect: "Triaging an absent alert returns 404 ERR_ALERT_NOT_FOUND rather than 403 ERR_SEGREGATION_OF_DUTIES, proving existence is resolved before the duty check that reads triaged_by_user_id off the row."
        test_recipe:
          setup:
            - "An empty database. No DrainingAlert exists."
          setup_api_calls: []
          trigger:
            - call: "POST /draining-alerts/00000000-0000-4000-8000-000000000000/triage"
              payload: { triage_note: "no such alert", redemption_pattern_reviewed: true }
              as: FraudAnalyst
              as_user_id: "analyst-76"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404 and ${err} == ERR_ALERT_NOT_FOUND"
            - "GET /draining-alerts returns total_count == 0"

      - name: claim_decide_on_unknown_claim_is_not_found
        claim_type: error_triggerable
        grounds:
          - errors.ERR_CLAIM_NOT_FOUND
          - endpoints[POST /victim-claims/{id}/decide]
        distinguishing_aspect: "Deciding an absent claim returns 404 ERR_CLAIM_NOT_FOUND and never reaches the reissue arithmetic, so no LiabilityPeriod is touched."
        test_recipe:
          setup:
            - "One OPEN LiabilityPeriod so that a stray writeoff would be visible if the payout path ran."
          setup_api_calls:
            - call: "POST /liability-periods"
              payload: { label: "2026-08 claim 404", period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z" }
              as: LiabilityAccountant
              as_user_id: "acct-77"
              captures: { period_id: $.data.id }
          trigger:
            - call: "POST /victim-claims/00000000-0000-4000-8000-000000000000/decide"
              payload: { decision: "APPROVE", decision_note: "no such claim" }
              as: RiskManager
              as_user_id: "risk-77"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404 and ${err} == ERR_CLAIM_NOT_FOUND"
            - "LiabilityPeriod.${period_id}.unauthorized_writeoff_cents == 0 and state == OPEN"
            - "GET /victim-claims returns total_count == 0"

      - name: listing_validate_on_unknown_listing_is_not_found
        claim_type: error_triggerable
        grounds:
          - errors.ERR_LISTING_NOT_FOUND
          - endpoints[POST /reseller-listings/{id}/validate]
        distinguishing_aspect: "Validating an absent listing returns 404 ERR_LISTING_NOT_FOUND rather than running listing_validation_decision, which would need a card to compare balances against."
        test_recipe:
          setup:
            - "An empty database. No ResellerListing exists."
          setup_api_calls: []
          trigger:
            - call: "POST /reseller-listings/00000000-0000-4000-8000-000000000000/validate"
              payload: { validation_note: "no such listing" }
              as: FraudAnalyst
              as_user_id: "analyst-78"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404 and ${err} == ERR_LISTING_NOT_FOUND"
            - "GET /reseller-listings returns total_count == 0"

      - name: period_close_on_unknown_period_is_not_found
        claim_type: error_triggerable
        grounds:
          - errors.ERR_PERIOD_NOT_FOUND
          - endpoints[POST /liability-periods/{id}/close]
        distinguishing_aspect: "Closing an absent period returns 404 ERR_PERIOD_NOT_FOUND, and the one real OPEN period in the database is not closed as a side effect."
        test_recipe:
          setup:
            - "One OPEN LiabilityPeriod that is not the target of the trigger."
          setup_api_calls:
            - call: "POST /liability-periods"
              payload: { label: "2026-08 period 404", period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z" }
              as: LiabilityAccountant
              as_user_id: "acct-79"
              captures: { period_id: $.data.id, p_v0: $.data.version }
          trigger:
            - call: "POST /liability-periods/00000000-0000-4000-8000-000000000000/close"
              payload: { close_note: "no such period" }
              as: LiabilityAccountant
              as_user_id: "acct-79"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404 and ${err} == ERR_PERIOD_NOT_FOUND"
            - "LiabilityPeriod.${period_id}.state == OPEN and closed_at == null and version == ${p_v0}"

      - name: ledger_reverse_on_unknown_event_is_not_found
        claim_type: error_triggerable
        grounds:
          - errors.ERR_LEDGER_EVENT_NOT_FOUND
          - endpoints[POST /ledger-events/{id}/reverse]
        distinguishing_aspect: "Reversing an absent ledger event returns 404 ERR_LEDGER_EVENT_NOT_FOUND rather than 409 ERR_LEDGER_EVENT_ALREADY_REVERSED — the existence check precedes the already-reversed check."
        test_recipe:
          setup:
            - "An empty database. No LedgerEvent exists."
          setup_api_calls: []
          trigger:
            - call: "POST /ledger-events/00000000-0000-4000-8000-000000000000/reverse"
              payload: { reversal_reason: "no such event" }
              as: RiskManager
              as_user_id: "risk-80"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404 and ${err} == ERR_LEDGER_EVENT_NOT_FOUND"
            - "GET /ledger-events returns total_count == 0"

      - name: hold_settle_on_unknown_hold_is_not_found
        claim_type: error_triggerable
        grounds:
          - errors.ERR_HOLD_NOT_FOUND
          - endpoints[POST /redemption-holds/{id}/settle]
        distinguishing_aspect: "Settling an absent hold returns 404 ERR_HOLD_NOT_FOUND, not 409 ERR_INVALID_HOLD_STATE, so no card balance is disturbed."
        test_recipe:
          setup:
            - "An empty database. No RedemptionHold exists."
          setup_api_calls: []
          trigger:
            - call: "POST /redemption-holds/00000000-0000-4000-8000-000000000000/settle"
              payload: { disposition: "RELEASE", settle_note: "no such hold" }
              as: RiskManager
              as_user_id: "risk-81"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404 and ${err} == ERR_HOLD_NOT_FOUND"
            - "GET /ledger-events returns total_count == 0"

      - name: bulk_identity_verification_twice_is_invalid_bulk_order_state
        claim_type: error_triggerable
        grounds:
          - errors.ERR_INVALID_BULK_ORDER_STATE
          - state_machines.BulkPurchaseOrder.PENDING_IDENTITY_to_IDENTITY_VERIFIED
          - endpoints[POST /bulk-purchase-orders/{id}/identity-verification]
        distinguishing_aspect: "An order whose total is below the identity threshold is already IDENTITY_VERIFIED the instant it is created, so the very first identity capture is refused with 409 ERR_INVALID_BULK_ORDER_STATE — the endpoint only accepts PENDING_IDENTITY."
        test_recipe:
          setup:
            - "One RetailStore with floor_posture OPEN."
            - "One BulkPurchaseOrder of 1 card at 2000 cents: subtotal 2000, fee tier 0 bps, fee 0, total 2000, which is below bulk_identity_threshold_cents 50000, so it auto-advances to IDENTITY_VERIFIED at creation."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Auto Verified Store", region_code: "NW", address_line: "51 Auto Ave" }
              as: PlatformAdmin
              captures: { store1_id: $.data.id }
            - call: "POST /bulk-purchase-orders"
              payload: { store_id: "${store1_id}", card_quantity: 1, face_value_cents_each: 2000, purchaser_name: "Small Office Gifts", payment_method: "CASH" }
              as: PosAssociate
              captures: { order_id: $.data.id, o_state0: $.data.state, o_total: $.data.total_cents, o_fee: $.data.activation_fee_cents, o_v0: $.data.version }
          trigger:
            - call: "POST /bulk-purchase-orders/${order_id}/identity-verification"
              payload: { id_type: "DRIVER_LICENSE", id_number_hash: "idh-82", id_expiry_date: "2029-06-30" }
              as: PosAssociate
              captures: { err: $.data.error_id }
          assert:
            - "${o_total} == 2000 and ${o_fee} == 0 and ${o_state0} == IDENTITY_VERIFIED"
            - "HTTP status == 409 and ${err} == ERR_INVALID_BULK_ORDER_STATE"
            - "BulkPurchaseOrder.${order_id}.identity_id_number_hash == null — the refused capture wrote nothing"
            - "BulkPurchaseOrder.${order_id}.version == ${o_v0}"

      - name: listing_validate_twice_is_invalid_listing_state
        claim_type: error_triggerable
        grounds:
          - errors.ERR_INVALID_LISTING_STATE
          - state_machines.ResellerListing.SUBMITTED_to_VALIDATED
          - calculations.listing_validation_decision
        distinguishing_aspect: "The first validation passes all four checks and lands in VALIDATED; the second identical call is refused with 409 ERR_INVALID_LISTING_STATE rather than silently re-validating, and block_reason stays null."
        test_recipe:
          setup:
            - "One RetailStore, one INTACT CardRack, one ACTIVE PHYSICAL GiftCard with face value 5000 cents, risk_posture CLEAR and drain_risk_score_inquiry 0."
            - "One SUBMITTED ResellerListing declaring listed_balance_cents 5000, which matches the card exactly."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Revalidate Store", region_code: "SW", address_line: "52 Revalidate Rd" }
              as: PlatformAdmin
              captures: { store1_id: $.data.id }
            - call: "POST /card-racks"
              payload: { store_id: "${store1_id}", rack_label: "RACK-RV", expected_card_count: 5 }
              as: PlatformAdmin
              captures: { rack1_id: $.data.id }
            - call: "POST /gift-cards"
              payload: { store_id: "${store1_id}", rack_id: "${rack1_id}", card_number_masked: "****-****-****-8301" }
              as: PosAssociate
              captures: { card_id: $.data.id }
            - call: "POST /issuance-requests"
              payload: { channel: "PHYSICAL", face_value_cents: 5000, store_id: "${store1_id}", rack_id: "${rack1_id}", card_id: "${card_id}", pos_terminal_id: "T-83", packaging_seal_intact: true }
              as: PosAssociate
              captures: { ir_id: $.data.id }
            - call: "POST /issuance-requests/${ir_id}/screen"
              payload: {}
              as: PosAssociate
            - call: "POST /reseller-listings"
              payload: { card_id: "${card_id}", marketplace_name: "GiftBay", asking_price_cents: 4800, listed_balance_cents: 5000 }
              as: ResellerPartner
              as_user_id: "partner-83"
              captures: { list_id: $.data.id, l_state0: $.data.state }
          trigger:
            - call: "POST /reseller-listings/${list_id}/validate"
              payload: { validation_note: "first pass" }
              as: FraudAnalyst
              as_user_id: "analyst-83"
              captures: { l_state1: $.data.state, l_reason1: $.data.block_reason, l_v1: $.data.version }
            - call: "POST /reseller-listings/${list_id}/validate"
              payload: { validation_note: "second pass" }
              as: FraudAnalyst
              as_user_id: "analyst-83"
              captures: { err: $.data.error_id }
          assert:
            - "${l_state0} == SUBMITTED"
            - "first trigger call: HTTP status == 200 and ${l_state1} == VALIDATED and ${l_reason1} == null"
            - "second trigger call: HTTP status == 409 and ${err} == ERR_INVALID_LISTING_STATE"
            - "ResellerListing.${list_id}.state == VALIDATED and block_reason == null and version == ${l_v1}"
            - "ResellerListing.${list_id}.validation_note == first pass — the refused call did not overwrite it"

      - name: double_reversal_of_the_same_redemption_is_rejected
        claim_type: error_triggerable
        grounds:
          - errors.ERR_LEDGER_EVENT_ALREADY_REVERSED
          - endpoints[POST /ledger-events/{id}/reverse]
          - calculations.card_balance_projection
          - state_machines.GiftCard.DEPLETED_to_ACTIVE
        distinguishing_aspect: "The first reversal appends a REDEMPTION_REVERSAL that carries reverses_event_id and lifts the card out of DEPLETED; the second attempt on the same event id is refused with 409 ERR_LEDGER_EVENT_ALREADY_REVERSED, so exactly one reversal row exists and total_loaded_cents is 20000 rather than 30000."
        test_recipe:
          setup:
            - "One RetailStore, one INTACT CardRack, one ACTIVE PHYSICAL GiftCard with face value 10000 cents."
            - "One redemption of the full 10000 cents at that store, which drives the card to DEPLETED."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Double Reversal Store", region_code: "NE", address_line: "53 Reverse Row" }
              as: PlatformAdmin
              captures: { store1_id: $.data.id }
            - call: "POST /card-racks"
              payload: { store_id: "${store1_id}", rack_label: "RACK-DR", expected_card_count: 5 }
              as: PlatformAdmin
              captures: { rack1_id: $.data.id }
            - call: "POST /gift-cards"
              payload: { store_id: "${store1_id}", rack_id: "${rack1_id}", card_number_masked: "****-****-****-8401" }
              as: PosAssociate
              captures: { card_id: $.data.id }
            - call: "POST /issuance-requests"
              payload: { channel: "PHYSICAL", face_value_cents: 10000, store_id: "${store1_id}", rack_id: "${rack1_id}", card_id: "${card_id}", pos_terminal_id: "T-84", packaging_seal_intact: true }
              as: PosAssociate
              captures: { ir_id: $.data.id }
            - call: "POST /issuance-requests/${ir_id}/screen"
              payload: {}
              as: PosAssociate
            - call: "POST /gift-cards/${card_id}/redemptions"
              payload: { amount_cents: 10000, merchant_store_id: "${store1_id}", pos_terminal_id: "T-84" }
              as: PosAssociate
              captures: { ev_id: $.data.id, ev_signed: $.data.signed_amount_cents }
            - call: "GET /gift-cards/${card_id}"
              payload: {}
              as: RiskManager
              as_user_id: "risk-84"
              captures: { c_state0: $.data.activation_state, c_bal0: $.data.current_balance_cents }
          trigger:
            - call: "POST /ledger-events/${ev_id}/reverse"
              payload: { reversal_reason: "terminal double-charged the customer" }
              as: RiskManager
              as_user_id: "risk-84"
              captures: { rev_id: $.data.id, rev_type: $.data.type, rev_reverses: $.data.reverses_event_id, rev_signed: $.data.signed_amount_cents }
            - call: "POST /ledger-events/${ev_id}/reverse"
              payload: { reversal_reason: "accidental replay of the reversal" }
              as: RiskManager
              as_user_id: "risk-84"
              captures: { err: $.data.error_id }
          assert:
            - "${ev_signed} == -10000 and ${c_state0} == DEPLETED and ${c_bal0} == 0"
            - "first trigger call: HTTP status == 201"
            - "${rev_type} == REDEMPTION_REVERSAL and ${rev_reverses} == ${ev_id} and ${rev_signed} == 10000"
            - "LedgerEvent.${rev_id}.amount_cents == 10000 and occurred_at == 2026-08-01T00:00:00Z"
            - "GiftCard.${card_id}.activation_state == ACTIVE and current_balance_cents == 10000"
            - "GiftCard.${card_id}.total_loaded_cents == 20000 — the reversal is a CREDIT kind, so it raises the loaded total"
            - "GiftCard.${card_id}.total_redeemed_cents == 0 and drawdown_ratio == 0.00"
            - "second trigger call: HTTP status == 409 and ${err} == ERR_LEDGER_EVENT_ALREADY_REVERSED"
            - "GET /ledger-events?reverses_event_id=${ev_id} returns total_count == 1"
            - "GET /ledger-events?card_id=${card_id} returns total_count == 3 — activation load, redemption, one reversal"

  # ==========================================================================
  # role_model is segregation_of_duties, so this section carries both the plain
  # role-membership checks (§1.4 priority 20) and the two duty-separation pairs
  # declared as transition preconditions in §1.2 (alert resolve, claim decide).
  # Priority 22 additionally binds a StoreManager's X-User-ID to their store id,
  # which is why every other instance in these design files avoids that role.
  # ==========================================================================
  - section: rbac
    instances:

      - name: request_without_user_header_is_unauthenticated
        claim_type: unauthenticated_request
        grounds:
          - validations[priority=10]
          - errors.ERR_UNAUTHENTICATED
        distinguishing_aspect: "An empty X-User-ID is treated as absent: the request fails 401 ERR_UNAUTHENTICATED at priority 10, before the priority 20 role check and before any body validation, so even a payload that is also malformed still returns 401."
        test_recipe:
          setup:
            - "An empty database. No authentication state of any kind is required."
          setup_api_calls: []
          trigger:
            - call: "POST /stores"
              payload: { name: "Anonymous Store", region_code: "NE", address_line: "54 Anon Ave" }
              as: PlatformAdmin
              as_user_id: ""
              captures: { err1: $.data.error_id }
            - call: "GET /risk-policy"
              payload: {}
              as: FraudAnalyst
              as_user_id: ""
              captures: { err2: $.data.error_id }
            - call: "POST /stores"
              payload: { name: "", region_code: "NE", address_line: "55 Anon Ave" }
              as: PlatformAdmin
              as_user_id: ""
              captures: { err3: $.data.error_id }
          assert:
            - "first trigger call: HTTP status == 401 and ${err1} == ERR_UNAUTHENTICATED"
            - "second trigger call: HTTP status == 401 and ${err2} == ERR_UNAUTHENTICATED — even the read-all policy endpoint requires the header"
            - "third trigger call: HTTP status == 401 and ${err3} == ERR_UNAUTHENTICATED, not 400 ERR_INVALID_REQUEST — priority 10 precedes priority 25"
            - "GET /stores with a valid X-User-ID returns total_count == 0 — nothing was created"

      - name: pos_associate_cannot_resolve_a_draining_alert
        claim_type: role_denied
        grounds:
          - validations[priority=20]
          - errors.ERR_UNAUTHORIZED
          - roles.RiskManager.exclusive_operations
          - endpoints[POST /draining-alerts/{id}/resolve]
        distinguishing_aspect: "resolve is a RiskManager exclusive operation: the identical CONFIRM body returns 403 ERR_UNAUTHORIZED for a PosAssociate and 200 for a RiskManager, and the denied attempt leaves the alert TRIAGED with resolution still null."
        test_recipe:
          setup:
            - "One RetailStore, one INTACT CardRack, one ACTIVE PHYSICAL GiftCard with face value 5000 cents."
            - "One DrainingAlert on that card, triaged by analyst-86."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Role Denied Store", region_code: "MW", address_line: "56 Role Rd" }
              as: PlatformAdmin
              captures: { store1_id: $.data.id }
            - call: "POST /card-racks"
              payload: { store_id: "${store1_id}", rack_label: "RACK-RD", expected_card_count: 5 }
              as: PlatformAdmin
              captures: { rack1_id: $.data.id }
            - call: "POST /gift-cards"
              payload: { store_id: "${store1_id}", rack_id: "${rack1_id}", card_number_masked: "****-****-****-8601" }
              as: PosAssociate
              captures: { card_id: $.data.id }
            - call: "POST /issuance-requests"
              payload: { channel: "PHYSICAL", face_value_cents: 5000, store_id: "${store1_id}", rack_id: "${rack1_id}", card_id: "${card_id}", pos_terminal_id: "T-86", packaging_seal_intact: true }
              as: PosAssociate
              captures: { ir_id: $.data.id }
            - call: "POST /issuance-requests/${ir_id}/screen"
              payload: {}
              as: PosAssociate
            - call: "POST /draining-alerts"
              payload: { card_id: "${card_id}", detection_basis: "MANUAL_REVIEW", note: "role test" }
              as: FraudAnalyst
              as_user_id: "analyst-86"
              captures: { alert_id: $.data.id }
            - call: "POST /draining-alerts/${alert_id}/triage"
              payload: { triage_note: "reviewed", redemption_pattern_reviewed: true }
              as: FraudAnalyst
              as_user_id: "analyst-86"
              captures: { a_state1: $.data.state, a_v1: $.data.version }
          trigger:
            - call: "POST /draining-alerts/${alert_id}/resolve"
              payload: { resolution: "CONFIRM", resolution_note: "associate trying to close it out" }
              as: PosAssociate
              as_user_id: "pos-86"
              captures: { err: $.data.error_id }
            - call: "POST /draining-alerts/${alert_id}/resolve"
              payload: { resolution: "CONFIRM", resolution_note: "risk manager closing it out" }
              as: RiskManager
              as_user_id: "risk-86"
              captures: { a_state2: $.data.state, a_resolver: $.data.resolved_by_user_id }
          assert:
            - "${a_state1} == TRIAGED"
            - "first trigger call: HTTP status == 403 and ${err} == ERR_UNAUTHORIZED"
            - "after the denied call, DrainingAlert.${alert_id}.state == TRIAGED and resolution == null and resolved_by_user_id == null and version == ${a_v1}"
            - "GiftCard.${card_id}.risk_posture == CLEAR — the denied confirm ran no cascade"
            - "second trigger call: HTTP status == 200 and ${a_state2} == CONFIRMED and ${a_resolver} == risk-86"
            - "GiftCard.${card_id}.risk_posture == FROZEN — the authorized confirm did run the cascade"

      - name: store_manager_cannot_audit_another_stores_rack
        claim_type: role_scope_denied
        grounds:
          - validations[priority=22]
          - errors.ERR_UNAUTHORIZED
          - entities.CardRack.fields.store_id
          - entities.GiftCard.fields.store_id
        distinguishing_aspect: "Priority 22 binds a StoreManager's X-User-ID to a store id: the same audit body succeeds on the rack whose store_id equals the caller's X-User-ID and returns 403 on the sibling store's rack. The third leg shows the null case — a DIGITAL card has store_id null, so the StoreManager is denied even though no other store owns it."
        test_recipe:
          setup:
            - "store1 and store2, both floor_posture OPEN, each with one INTACT CardRack of expected_card_count 5."
            - "One DIGITAL GiftCard minted by screening a clean DIGITAL issuance request, so its store_id is null."
            - "The StoreManager caller always presents X-User-ID equal to store1's id."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Scope Store One", region_code: "SE", address_line: "57 Scope St" }
              as: PlatformAdmin
              captures: { store1_id: $.data.id }
            - call: "POST /stores"
              payload: { name: "Scope Store Two", region_code: "SE", address_line: "58 Scope St" }
              as: PlatformAdmin
              captures: { store2_id: $.data.id }
            - call: "POST /card-racks"
              payload: { store_id: "${store1_id}", rack_label: "RACK-S1", expected_card_count: 5 }
              as: PlatformAdmin
              captures: { rack1_id: $.data.id }
            - call: "POST /card-racks"
              payload: { store_id: "${store2_id}", rack_label: "RACK-S2", expected_card_count: 5 }
              as: PlatformAdmin
              captures: { rack2_id: $.data.id }
            - call: "POST /issuance-requests"
              payload: { channel: "DIGITAL", face_value_cents: 4000, device_reputation_score: 95, email_age_days: 900, payment_risk_band: "LOW", recipient_email_hash: "eh-87" }
              as: PosAssociate
              captures: { ir_id: $.data.id }
            - call: "POST /issuance-requests/${ir_id}/screen"
              payload: {}
              as: PosAssociate
              captures: { digital_card_id: $.data.card_id }
          trigger:
            - call: "POST /card-racks/${rack1_id}/audits"
              payload: { observed_card_count: 5, seal_breaks_observed: 0 }
              as: StoreManager
              as_user_id: "${store1_id}"
              captures: { r1_state: $.data.tamper_state }
            - call: "POST /card-racks/${rack2_id}/audits"
              payload: { observed_card_count: 4, seal_breaks_observed: 1 }
              as: StoreManager
              as_user_id: "${store1_id}"
              captures: { err_other: $.data.error_id }
            - call: "GET /gift-cards/${digital_card_id}"
              payload: {}
              as: StoreManager
              as_user_id: "${store1_id}"
              captures: { err_null: $.data.error_id }
          assert:
            - "first trigger call: HTTP status == 200 and ${r1_state} == INTACT — the caller's X-User-ID equals CardRack.store_id"
            - "CardRack.${rack1_id}.last_audit_at == 2026-08-01T00:00:00Z"
            - "second trigger call: HTTP status == 403 and ${err_other} == ERR_UNAUTHORIZED"
            - "CardRack.${rack2_id}.tamper_state == INTACT and last_audit_at == null and observed_card_count is unchanged — the denied audit wrote nothing"
            - "RetailStore.${store2_id}.floor_posture == OPEN and suspect_rack_count == 0"
            - "third trigger call: HTTP status == 403 and ${err_null} == ERR_UNAUTHORIZED — GiftCard.store_id is null for a DIGITAL card, and a null effective store denies the StoreManager"
            - "the same GET as PosAssociate returns 200 — the denial is scope-based, not endpoint-based"

      - name: same_user_cannot_triage_and_resolve_one_alert
        claim_type: segregation_of_duties
        grounds:
          - state_machines.DrainingAlert.TRIAGED_to_CONFIRMED
          - errors.ERR_SEGREGATION_OF_DUTIES
          - entities.DrainingAlert.fields.triaged_by_user_id
        distinguishing_aspect: "The duty check compares X-User-ID against the stored triaged_by_user_id, not against the role: a RiskManager presenting the triager's own user id is refused 403 ERR_SEGREGATION_OF_DUTIES, while a different RiskManager user id on the identical body succeeds."
        test_recipe:
          setup:
            - "One RetailStore, one INTACT CardRack, one ACTIVE PHYSICAL GiftCard with face value 5000 cents."
            - "One DrainingAlert on that card, triaged by user id analyst-89."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Duty Split Store", region_code: "NW", address_line: "59 Duty Dr" }
              as: PlatformAdmin
              captures: { store1_id: $.data.id }
            - call: "POST /card-racks"
              payload: { store_id: "${store1_id}", rack_label: "RACK-DS", expected_card_count: 5 }
              as: PlatformAdmin
              captures: { rack1_id: $.data.id }
            - call: "POST /gift-cards"
              payload: { store_id: "${store1_id}", rack_id: "${rack1_id}", card_number_masked: "****-****-****-8901" }
              as: PosAssociate
              captures: { card_id: $.data.id }
            - call: "POST /issuance-requests"
              payload: { channel: "PHYSICAL", face_value_cents: 5000, store_id: "${store1_id}", rack_id: "${rack1_id}", card_id: "${card_id}", pos_terminal_id: "T-89", packaging_seal_intact: true }
              as: PosAssociate
              captures: { ir_id: $.data.id }
            - call: "POST /issuance-requests/${ir_id}/screen"
              payload: {}
              as: PosAssociate
            - call: "POST /draining-alerts"
              payload: { card_id: "${card_id}", detection_basis: "MANUAL_REVIEW", note: "duty split test" }
              as: FraudAnalyst
              as_user_id: "analyst-89"
              captures: { alert_id: $.data.id }
            - call: "POST /draining-alerts/${alert_id}/triage"
              payload: { triage_note: "reviewed by analyst-89", redemption_pattern_reviewed: true }
              as: FraudAnalyst
              as_user_id: "analyst-89"
              captures: { a_triager: $.data.triaged_by_user_id, a_v1: $.data.version }
          trigger:
            - call: "POST /draining-alerts/${alert_id}/resolve"
              payload: { resolution: "DISMISS", resolution_note: "same person closing their own triage" }
              as: RiskManager
              as_user_id: "analyst-89"
              captures: { err: $.data.error_id }
            - call: "POST /draining-alerts/${alert_id}/resolve"
              payload: { resolution: "DISMISS", resolution_note: "independent reviewer closing it" }
              as: RiskManager
              as_user_id: "risk-89"
              captures: { a_state2: $.data.state, a_resolver: $.data.resolved_by_user_id }
          assert:
            - "${a_triager} == analyst-89"
            - "first trigger call: HTTP status == 403 and ${err} == ERR_SEGREGATION_OF_DUTIES"
            - "after the denied call, DrainingAlert.${alert_id}.state == TRIAGED and resolution == null and version == ${a_v1}"
            - "second trigger call: HTTP status == 200 and ${a_state2} == DISMISSED and ${a_resolver} == risk-89"
            - "DrainingAlert.${alert_id}.triaged_by_user_id == analyst-89 — dismissal preserves the triager"
            - "RetailStore.${store1_id}.open_alert_count == 0 and floor_posture == OPEN"

      - name: same_user_cannot_intake_and_decide_one_claim
        claim_type: segregation_of_duties
        grounds:
          - state_machines.VictimClaim.SUBMITTED_to_DENIED
          - errors.ERR_SEGREGATION_OF_DUTIES
          - entities.VictimClaim.fields.intake_user_id
        distinguishing_aspect: "The claim surface separates intake from decision on both verbs: a DENY presented with the intake user's own id is refused 403 ERR_SEGREGATION_OF_DUTIES, and so is an APPROVE, before a different user id is allowed to DENY the claim."
