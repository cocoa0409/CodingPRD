            - "DisclosureCell.${c1}.suppression_state == RELEASED and released_count == 30"

      - name: corner_val_a_fatal_check_cannot_be_waived_but_a_warning_can
        claim_type: Violation -> Error
        grounds:
          - validations[priority=15]
          - errors[ERR_WAIVER_NOT_PERMITTED]
          - state_machines.EditCheck.EXPLAINED_to_WAIVED
          - calculations.edit_status_derivation
        distinguishing_aspect: |
          WAIVE is severity-conditional on the very same endpoint and payload: the FATAL 30.0%
          variance check refuses the waiver and must be ACCEPTED instead, while the WARNING 12.5%
          check waives cleanly — and only after both are terminal does edit_status reach CLEARED
          with fatal_open_count back to 0.
        test_recipe:
          setup:
            - "ReportingCycle IPEDS-2027 is CENSUS_LOCKED with a PREPARED ENROLLMENT component carrying FTE_ENROLLMENT 1125 (prior 1000, WARNING 12.5) and TOTAL_HEADCOUNT 1300 (prior 1000, FATAL 30.0)."
            - "Both checks have been EXPLAINED by analyst-1."
          setup_api_calls:
            - call: "POST /ir/reporting-cycles"
              payload: { cycle_code: "IPEDS-2027", collection_year: 2027, census_date: "2026-10-15", collection_deadline: "2027-02-15T23:59:59Z" }
              as: RegistrarOfficer
              captures: { cyc: $.data.id, cyc_v: $.data.version }
            - call: "POST /ir/reporting-cycles/${cyc}/frozen-files"
              payload: { domain: "ENROLLMENT", record_count: 1300, coverage_start_date: "2026-09-01", coverage_end_date: "2026-10-15", checksum: "c1d2e3f4a5b60148", expected_cycle_version: "${cyc_v}" }
              as: RegistrarOfficer
              captures: { ff1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-01T00:00:00Z" }
              as: RegistrarOfficer
            - call: "POST /ir/reporting-cycles/${cyc}/census-lock"
              payload: {}
              as: RegistrarOfficer
            - call: "POST /ir/survey-components"
              payload: { cycle_id: "${cyc}", frozen_file_id: "${ff1}", component_code: "ENROLLMENT" }
              as: IRAnalyst
              captures: { comp: $.data.id }
            - call: "POST /ir/survey-components/${comp}/metrics"
              payload: { metric_key: "FTE_ENROLLMENT", reported_value: 1125, prior_year_value: 1000, source_field_path: "sis.enrollment.fte" }
              as: IRAnalyst
            - call: "POST /ir/survey-components/${comp}/metrics"
              payload: { metric_key: "TOTAL_HEADCOUNT", reported_value: 1300, prior_year_value: 1000, source_field_path: "sis.enrollment.headcount" }
              as: IRAnalyst
            - call: "POST /ir/survey-components/${comp}/prepare"
              payload: {}
              as: IRAnalyst
              as_user_id: "analyst-1"
            - call: "GET /ir/edit-checks?component_id=${comp}"
              payload: {}
              as: IRAnalyst
              captures: { ec1: "$.data[0].id", ec2: "$.data[1].id" }
            - call: "POST /ir/edit-checks/${ec1}/explain"
              payload: { explanation_text: "Full-time load definition was corrected mid-year, lifting the FTE conversion.", prior_year_comparison_note: "Prior year FTE was 1000 under the old load table." }
              as: IRAnalyst
              as_user_id: "analyst-1"
            - call: "POST /ir/edit-checks/${ec2}/explain"
              payload: { explanation_text: "A new online campus opened and added three hundred headcount in one term.", prior_year_comparison_note: "Prior year headcount was 1000 before the online campus." }
              as: IRAnalyst
              as_user_id: "analyst-1"
          trigger:
            - call: "POST /ir/edit-checks/${ec2}/adjudicate"
              payload: { decision: "WAIVE", adjudication_note: "Attempting to waive the fatal variance to save time." }
              as: IRDirector
              as_user_id: "director-1"
              captures: { err: $.data.error_id }
            - call: "POST /ir/edit-checks/${ec1}/adjudicate"
              payload: { decision: "WAIVE", adjudication_note: "Warning-level variance waived; the load-table change is documented." }
              as: IRDirector
              as_user_id: "director-1"
            - call: "POST /ir/edit-checks/${ec2}/adjudicate"
              payload: { decision: "ACCEPT", adjudication_note: "Explanation accepted; the online campus enrolment is verified." }
