scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: per_day_vs_per_scan_identical_day_divergent_billing
        grounds:
          - calculations.site_day_billing_amount
          - entities.BillingStatement.fields.billing_model_snapshot
          - entities.ServiceContract.fields.billing_model
        distinguishing_aspect: |
          Identical day outcomes (zero completed scans, full window held) price through two
          different contract variants: PER_DAY yields the flat day rate 500000, PER_SCAN yields
          the zero-scan guaranteed floor 200000. This instance's entity domain is
          BillingStatement/ServiceContract pricing, distinct from the Technologist dose domain
          of technologist_prospective_vs_retrospective_dose.
        test_recipe:
          setup:
            - "Facility A with PER_DAY contract (day_rate 500000), Facility B with PER_SCAN contract (guaranteed_minimum 200000)"
            - "One CT unit with valid accreditation; one published week plan 2026-08-03"
            - "Day A 2026-08-04 at facility A and day B 2026-08-05 at facility B, both driven to COMPLETED with zero appointments"
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: OperationsDirector }
            - { call: "POST /api/facilities", payload: { name: "Hospital A", address: "1 A St", supported_modalities: ["CT"], pad_amps_available: 150, pad_voltage: 480, pad_level_tolerance_deg: 2.0 }, as: OperationsDirector, captures: { fac_a: $.data.id } }
            - { call: "POST /api/facilities", payload: { name: "Clinic B", address: "2 B Ave", supported_modalities: ["CT"], pad_amps_available: 150, pad_voltage: 480, pad_level_tolerance_deg: 2.0 }, as: OperationsDirector, captures: { fac_b: $.data.id } }
            - { call: "POST /api/units", payload: { unit_code: "MIU-01", modality: "CT", power_required_amps: 100, voltage_required: 480, setup_minutes: 60, teardown_minutes: 45, home_base_name: "Depot" }, as: OperationsDirector, captures: { unit: $.data.id, unit_v: $.data.version } }
            - { call: "POST /api/accreditations", payload: { unit_id: "${unit}", accrediting_body: "ACR", modality: "CT", issued_on: "2026-01-01", expires_on: "2027-01-01" }, as: ComplianceOfficer }
            - { call: "POST /api/contracts", payload: { facility_id: "${fac_a}", billing_model: "PER_DAY", day_rate_cents: 500000, scan_rate_cents: 40000, included_scan_quota: 10, overage_scan_rate_cents: 45000, guaranteed_minimum_cents: 200000, no_show_fee_cents: 10000, cancel_notice_hours: 48, cancel_late_pct: 0.5, monthly_scan_cap: 100, interruption_floor_cents: 100000 }, as: OperationsDirector, captures: { c_a: $.data.id } }
            - { call: "POST /api/contracts", payload: { facility_id: "${fac_b}", billing_model: "PER_SCAN", day_rate_cents: 500000, scan_rate_cents: 40000, included_scan_quota: 10, overage_scan_rate_cents: 45000, guaranteed_minimum_cents: 200000, no_show_fee_cents: 10000, cancel_notice_hours: 48, cancel_late_pct: 0.5, monthly_scan_cap: 100, interruption_floor_cents: 100000 }, as: OperationsDirector, captures: { c_b: $.data.id } }
            - { call: "POST /api/route-plans", payload: { unit_id: "${unit}", week_start_date: "2026-08-03", expected_unit_version: "${unit_v}" }, as: OperationsDirector, captures: { plan: $.data.id } }
            - { call: "POST /api/site-days", payload: { route_plan_id: "${plan}", facility_id: "${fac_a}", contract_id: "${c_a}", service_date: "2026-08-04", arrival_time: "07:00", first_patient_time: "08:30", last_patient_time: "16:00", departure_time: "17:00" }, as: OperationsDirector, captures: { sd_a: $.data.id } }
            - { call: "POST /api/site-days", payload: { route_plan_id: "${plan}", facility_id: "${fac_b}", contract_id: "${c_b}", service_date: "2026-08-05", arrival_time: "07:00", first_patient_time: "08:30", last_patient_time: "16:00", departure_time: "17:00" }, as: OperationsDirector, captures: { sd_b: $.data.id } }
            - { call: "POST /api/route-plans/${plan}/publish", payload: {}, as: OperationsDirector }
            - { call: "POST /api/technologists", payload: { full_name: "Tina Tech", modality_certs: ["CT"], home_base_name: "Depot", max_daily_drive_minutes: 240 }, as: OperationsDirector, captures: { tech: $.data.id } }
            - { call: "POST /api/staffing-assignments", payload: { site_day_id: "${sd_a}", technologist_id: "${tech}", estimated_drive_minutes: 30 }, as: OperationsDirector }
            - { call: "POST /api/transport-legs", payload: { site_day_id: "${sd_a}", origin_name: "Depot", destination_name: "Hospital A", distance_miles: 40, drive_minutes: 50, overnight: false }, as: OperationsDirector, captures: { leg_a: $.data.id } }
            - { call: "POST /api/site-days/${sd_a}/depart", payload: {}, as: OperationsDirector }
            - { call: "POST /api/transport-legs/${leg_a}/arrive", payload: {}, as: Technologist, as_user_id: "${tech}" }
            - { call: "POST /api/site-days/${sd_a}/begin-setup", payload: {}, as: OperationsDirector }
            - { call: "POST /api/setup-checklists", payload: { site_day_id: "${sd_a}", power_verify_passed: true, measured_amps: 140, pad_level_passed: true, chiller_passed: true, rf_shield_passed: true, network_link_passed: true, measured_uplink_mbps: 100 }, as: Technologist, as_user_id: "${tech}" }
            - { call: "POST /api/site-days/${sd_a}/mark-ready", payload: {}, as: OperationsDirector }
            - { call: "POST /api/site-days/${sd_a}/start-service", payload: {}, as: OperationsDirector }
            - { call: "POST /api/site-days/${sd_a}/complete", payload: {}, as: OperationsDirector }
            - { call: "POST /api/staffing-assignments", payload: { site_day_id: "${sd_b}", technologist_id: "${tech}", estimated_drive_minutes: 30 }, as: OperationsDirector }
            - { call: "POST /api/transport-legs", payload: { site_day_id: "${sd_b}", origin_name: "Depot", destination_name: "Clinic B", distance_miles: 40, drive_minutes: 50, overnight: false }, as: OperationsDirector, captures: { leg_b: $.data.id } }
            - { call: "POST /api/site-days/${sd_b}/depart", payload: {}, as: OperationsDirector }
            - { call: "POST /api/transport-legs/${leg_b}/arrive", payload: {}, as: Technologist, as_user_id: "${tech}" }
            - { call: "POST /api/site-days/${sd_b}/begin-setup", payload: {}, as: OperationsDirector }
            - { call: "POST /api/setup-checklists", payload: { site_day_id: "${sd_b}", power_verify_passed: true, measured_amps: 140, pad_level_passed: true, chiller_passed: true, rf_shield_passed: true, network_link_passed: true, measured_uplink_mbps: 100 }, as: Technologist, as_user_id: "${tech}" }
            - { call: "POST /api/site-days/${sd_b}/mark-ready", payload: {}, as: OperationsDirector }
            - { call: "POST /api/site-days/${sd_b}/start-service", payload: {}, as: OperationsDirector }
            - { call: "POST /api/site-days/${sd_b}/complete", payload: {}, as: OperationsDirector }
          trigger:
            - { call: "GET /api/billing-statements", payload: { site_day_id: "${sd_a}" }, as: OperationsDirector, captures: { stmt_a_amt: "$.data[0].provisional_amount_cents", stmt_a_model: "$.data[0].billing_model_snapshot" } }
            - { call: "GET /api/billing-statements", payload: { site_day_id: "${sd_b}" }, as: OperationsDirector, captures: { stmt_b_amt: "$.data[0].provisional_amount_cents", stmt_b_model: "$.data[0].billing_model_snapshot" } }
          assert:
            - "BillingStatement[${sd_a}].billing_model_snapshot == PER_DAY and provisional_amount_cents == 500000"
            - "BillingStatement[${sd_b}].billing_model_snapshot == PER_SCAN and provisional_amount_cents == 200000"
            - "${stmt_a_amt} == 500000 and ${stmt_b_amt} == 200000 (identical day outcome, divergent variant pricing)"

      - name: technologist_prospective_vs_retrospective_dose
        grounds:
          - calculations.technologist_dose_projection
          - entities.StaffingAssignment.fields.projected_dose_msv
          - entities.Technologist.fields.current_day_dose_msv
        distinguishing_aspect: |
          For the same two-appointment set, the prospective variant (estimates, evaluated at
          staffing time) yields 4.0 mSv while the retrospective variant (recorded doses) yields
          3.0 mSv. Entity domain is Technologist/StaffingAssignment dose accounting, distinct
          from the BillingStatement pricing domain of the sibling instance.
        test_recipe:
          setup:
            - "CT unit, facility, PER_SCAN contract, published plan, site day 2026-08-04 driven to IN_SERVICE"
            - "Two appointments (estimated_dose_msv 2.0 each) booked BEFORE staffing so the projection sees them"
            - "Staffing created after appointments: projected_dose_msv = 0 recorded + 2.0 + 2.0 = 4.0"
            - "Both scans completed on 2026-08-04 (clock set to that date) with recorded doses 1.5 each"
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: OperationsDirector }
            - { call: "POST /api/facilities", payload: { name: "Hospital A", address: "1 A St", supported_modalities: ["CT"], pad_amps_available: 150, pad_voltage: 480, pad_level_tolerance_deg: 2.0 }, as: OperationsDirector, captures: { fac_a: $.data.id } }
            - { call: "POST /api/units", payload: { unit_code: "MIU-01", modality: "CT", power_required_amps: 100, voltage_required: 480, setup_minutes: 60, teardown_minutes: 45, home_base_name: "Depot" }, as: OperationsDirector, captures: { unit: $.data.id, unit_v: $.data.version } }
            - { call: "POST /api/accreditations", payload: { unit_id: "${unit}", accrediting_body: "ACR", modality: "CT", issued_on: "2026-01-01", expires_on: "2027-01-01" }, as: ComplianceOfficer }
            - { call: "POST /api/contracts", payload: { facility_id: "${fac_a}", billing_model: "PER_SCAN", day_rate_cents: 500000, scan_rate_cents: 40000, included_scan_quota: 10, overage_scan_rate_cents: 45000, guaranteed_minimum_cents: 200000, no_show_fee_cents: 10000, cancel_notice_hours: 48, cancel_late_pct: 0.5, monthly_scan_cap: 100, interruption_floor_cents: 100000 }, as: OperationsDirector, captures: { c_a: $.data.id } }
            - { call: "POST /api/route-plans", payload: { unit_id: "${unit}", week_start_date: "2026-08-03", expected_unit_version: "${unit_v}" }, as: OperationsDirector, captures: { plan: $.data.id } }
            - { call: "POST /api/site-days", payload: { route_plan_id: "${plan}", facility_id: "${fac_a}", contract_id: "${c_a}", service_date: "2026-08-04", arrival_time: "07:00", first_patient_time: "08:30", last_patient_time: "16:00", departure_time: "17:00" }, as: OperationsDirector, captures: { sd_a: $.data.id } }
            - { call: "POST /api/appointments", payload: { site_day_id: "${sd_a}", patient_ref: "P-001", exam_type: "CT_HEAD", scheduled_start: "09:00", duration_minutes: 30, estimated_dose_msv: 2.0 }, as: FacilityCoordinator, as_user_id: "${fac_a}", captures: { ap1: $.data.id } }
            - { call: "POST /api/appointments", payload: { site_day_id: "${sd_a}", patient_ref: "P-002", exam_type: "CT_HEAD", scheduled_start: "09:40", duration_minutes: 30, estimated_dose_msv: 2.0 }, as: FacilityCoordinator, as_user_id: "${fac_a}", captures: { ap2: $.data.id } }
            - { call: "POST /api/technologists", payload: { full_name: "Tina Tech", modality_certs: ["CT"], home_base_name: "Depot", max_daily_drive_minutes: 240 }, as: OperationsDirector, captures: { tech: $.data.id } }
            - { call: "POST /api/staffing-assignments", payload: { site_day_id: "${sd_a}", technologist_id: "${tech}", estimated_drive_minutes: 30 }, as: OperationsDirector, captures: { staff: $.data.id, staff_proj: $.data.projected_dose_msv } }
            - { call: "POST /api/route-plans/${plan}/publish", payload: {}, as: OperationsDirector }
            - { call: "POST /api/transport-legs", payload: { site_day_id: "${sd_a}", origin_name: "Depot", destination_name: "Hospital A", distance_miles: 40, drive_minutes: 50, overnight: false }, as: OperationsDirector, captures: { leg: $.data.id } }
            - { call: "POST /api/site-days/${sd_a}/depart", payload: {}, as: OperationsDirector }
            - { call: "POST /api/transport-legs/${leg}/arrive", payload: {}, as: Technologist, as_user_id: "${tech}" }
            - { call: "POST /api/site-days/${sd_a}/begin-setup", payload: {}, as: OperationsDirector }
            - { call: "POST /api/setup-checklists", payload: { site_day_id: "${sd_a}", power_verify_passed: true, measured_amps: 140, pad_level_passed: true, chiller_passed: true, rf_shield_passed: true, network_link_passed: true, measured_uplink_mbps: 100 }, as: Technologist, as_user_id: "${tech}" }
            - { call: "POST /api/site-days/${sd_a}/mark-ready", payload: {}, as: OperationsDirector }
            - { call: "POST /api/site-days/${sd_a}/start-service", payload: {}, as: OperationsDirector }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-04T10:00:00Z" }, as: OperationsDirector }
            - { call: "POST /api/appointments/${ap1}/confirm", payload: {}, as: OperationsDirector }
            - { call: "POST /api/appointments/${ap1}/check-in", payload: {}, as: FacilityCoordinator, as_user_id: "${fac_a}" }
            - { call: "POST /api/appointments/${ap1}/begin-scan", payload: {}, as: Technologist, as_user_id: "${tech}" }
            - { call: "POST /api/appointments/${ap1}/complete-scan", payload: {}, as: Technologist, as_user_id: "${tech}" }
            - { call: "POST /api/dose-records", payload: { appointment_id: "${ap1}", technologist_id: "${tech}", dose_msv: 1.5 }, as: Technologist, as_user_id: "${tech}" }
            - { call: "POST /api/appointments/${ap2}/confirm", payload: {}, as: OperationsDirector }
            - { call: "POST /api/appointments/${ap2}/check-in", payload: {}, as: FacilityCoordinator, as_user_id: "${fac_a}" }
            - { call: "POST /api/appointments/${ap2}/begin-scan", payload: {}, as: Technologist, as_user_id: "${tech}" }
            - { call: "POST /api/appointments/${ap2}/complete-scan", payload: {}, as: Technologist, as_user_id: "${tech}" }
            - { call: "POST /api/dose-records", payload: { appointment_id: "${ap2}", technologist_id: "${tech}", dose_msv: 1.5 }, as: Technologist, as_user_id: "${tech}" }
          trigger:
            - { call: "GET /api/technologists/${tech}", payload: {}, as: OperationsDirector, captures: { tech_dose: $.data.current_day_dose_msv } }
          assert:
            - "StaffingAssignment[${staff}].projected_dose_msv == 4.0 (prospective variant over the same appointment set)"
            - "Technologist[${tech}].current_day_dose_msv == 3.0 (retrospective variant: 1.5 + 1.5)"
            - "${staff_proj} == 4.0 and ${tech_dose} == 3.0 and the two variants differ"

      - name: provisional_vs_final_billable_reconciliation
        grounds:
          - calculations.site_day_billing_amount
          - entities.BillingStatement.fields.final_amount_cents
          - state_machines.ImageStudy.QUEUED_to_DELIVERED
        distinguishing_aspect: |
          Provisional and final variants of the same PER_SCAN statement diverge on the billable
          set: provisional counts both COMPLETED appointments (80000), final counts only the one
          whose ImageStudy reached DELIVERED (40000). The reconciliation delta is exactly the
          undelivered scan's 40000.
        test_recipe:
          setup:
            - "PER_SCAN day driven to IN_SERVICE with uplink 100 Mbps (transfer budget 750 MB)"
            - "Two appointments completed; ImageStudy registered and DELIVERED for appointment 1 only; no study for appointment 2"
            - "Day completed: statement PROVISIONAL with provisional_amount_cents == 80000"
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: OperationsDirector }
            - { call: "POST /api/facilities", payload: { name: "Hospital A", address: "1 A St", supported_modalities: ["CT"], pad_amps_available: 150, pad_voltage: 480, pad_level_tolerance_deg: 2.0 }, as: OperationsDirector, captures: { fac_a: $.data.id } }
            - { call: "POST /api/units", payload: { unit_code: "MIU-01", modality: "CT", power_required_amps: 100, voltage_required: 480, setup_minutes: 60, teardown_minutes: 45, home_base_name: "Depot" }, as: OperationsDirector, captures: { unit: $.data.id, unit_v: $.data.version } }
            - { call: "POST /api/accreditations", payload: { unit_id: "${unit}", accrediting_body: "ACR", modality: "CT", issued_on: "2026-01-01", expires_on: "2027-01-01" }, as: ComplianceOfficer }
            - { call: "POST /api/contracts", payload: { facility_id: "${fac_a}", billing_model: "PER_SCAN", day_rate_cents: 500000, scan_rate_cents: 40000, included_scan_quota: 10, overage_scan_rate_cents: 45000, guaranteed_minimum_cents: 200000, no_show_fee_cents: 10000, cancel_notice_hours: 48, cancel_late_pct: 0.5, monthly_scan_cap: 100, interruption_floor_cents: 100000 }, as: OperationsDirector, captures: { c_a: $.data.id } }
            - { call: "POST /api/route-plans", payload: { unit_id: "${unit}", week_start_date: "2026-08-03", expected_unit_version: "${unit_v}" }, as: OperationsDirector, captures: { plan: $.data.id } }
            - { call: "POST /api/site-days", payload: { route_plan_id: "${plan}", facility_id: "${fac_a}", contract_id: "${c_a}", service_date: "2026-08-04", arrival_time: "07:00", first_patient_time: "08:30", last_patient_time: "16:00", departure_time: "17:00" }, as: OperationsDirector, captures: { sd_a: $.data.id } }
            - { call: "POST /api/route-plans/${plan}/publish", payload: {}, as: OperationsDirector }
            - { call: "POST /api/technologists", payload: { full_name: "Tina Tech", modality_certs: ["CT"], home_base_name: "Depot", max_daily_drive_minutes: 240 }, as: OperationsDirector, captures: { tech: $.data.id } }
            - { call: "POST /api/staffing-assignments", payload: { site_day_id: "${sd_a}", technologist_id: "${tech}", estimated_drive_minutes: 30 }, as: OperationsDirector }
            - { call: "POST /api/transport-legs", payload: { site_day_id: "${sd_a}", origin_name: "Depot", destination_name: "Hospital A", distance_miles: 40, drive_minutes: 50, overnight: false }, as: OperationsDirector, captures: { leg: $.data.id } }
            - { call: "POST /api/site-days/${sd_a}/depart", payload: {}, as: OperationsDirector }
            - { call: "POST /api/transport-legs/${leg}/arrive", payload: {}, as: Technologist, as_user_id: "${tech}" }
            - { call: "POST /api/site-days/${sd_a}/begin-setup", payload: {}, as: OperationsDirector }
            - { call: "POST /api/setup-checklists", payload: { site_day_id: "${sd_a}", power_verify_passed: true, measured_amps: 140, pad_level_passed: true, chiller_passed: true, rf_shield_passed: true, network_link_passed: true, measured_uplink_mbps: 100 }, as: Technologist, as_user_id: "${tech}" }
            - { call: "POST /api/site-days/${sd_a}/mark-ready", payload: {}, as: OperationsDirector }
            - { call: "POST /api/site-days/${sd_a}/start-service", payload: {}, as: OperationsDirector }
            - { call: "POST /api/appointments", payload: { site_day_id: "${sd_a}", patient_ref: "P-001", exam_type: "CT_HEAD", scheduled_start: "09:00", duration_minutes: 30, estimated_dose_msv: 2.0 }, as: FacilityCoordinator, as_user_id: "${fac_a}", captures: { ap1: $.data.id } }
            - { call: "POST /api/appointments", payload: { site_day_id: "${sd_a}", patient_ref: "P-002", exam_type: "CT_HEAD", scheduled_start: "09:40", duration_minutes: 30, estimated_dose_msv: 2.0 }, as: FacilityCoordinator, as_user_id: "${fac_a}", captures: { ap2: $.data.id } }
            - { call: "POST /api/appointments/${ap1}/confirm", payload: {}, as: OperationsDirector }
            - { call: "POST /api/appointments/${ap1}/check-in", payload: {}, as: FacilityCoordinator, as_user_id: "${fac_a}" }
            - { call: "POST /api/appointments/${ap1}/begin-scan", payload: {}, as: Technologist, as_user_id: "${tech}" }
            - { call: "POST /api/appointments/${ap1}/complete-scan", payload: {}, as: Technologist, as_user_id: "${tech}" }
            - { call: "POST /api/image-studies", payload: { appointment_id: "${ap1}", study_uid: "1.2.3.4", size_mb: 500 }, as: Technologist, as_user_id: "${tech}", captures: { st1: $.data.id } }
            - { call: "POST /api/image-studies/${st1}/transmit", payload: {}, as: Technologist, as_user_id: "${tech}" }
            - { call: "POST /api/appointments/${ap2}/confirm", payload: {}, as: OperationsDirector }
            - { call: "POST /api/appointments/${ap2}/check-in", payload: {}, as: FacilityCoordinator, as_user_id: "${fac_a}" }
            - { call: "POST /api/appointments/${ap2}/begin-scan", payload: {}, as: Technologist, as_user_id: "${tech}" }
            - { call: "POST /api/appointments/${ap2}/complete-scan", payload: {}, as: Technologist, as_user_id: "${tech}" }
            - { call: "POST /api/site-days/${sd_a}/complete", payload: {}, as: OperationsDirector }
            - { call: "GET /api/billing-statements", payload: { site_day_id: "${sd_a}" }, as: OperationsDirector, captures: { stmt: "$.data[0].id", prov_amt: "$.data[0].provisional_amount_cents" } }
          trigger:
            - { call: "POST /api/billing-statements/${stmt}/finalize", payload: {}, as: OperationsDirector, captures: { final_amt: $.data.final_amount_cents, net_amt: $.data.net_due_cents } }
          assert:
            - "BillingStatement[${stmt}].provisional_amount_cents == 80000 (both COMPLETED appointments billable provisionally)"
            - "BillingStatement[${stmt}].final_amount_cents == 40000 (only the DELIVERED study's appointment is billable)"
            - "BillingStatement[${stmt}].net_due_cents == 40000 and status == FINALIZED"
            - "${prov_amt} == 80000 and ${final_amt} == 40000: reconciliation delta == 40000 (one undelivered scan dropped)"

  - rule_id: combinatorial_formula
    instances:
      - name: per_scan_overage_tiers_and_zero_scan_floor
        grounds:
          - calculations.site_day_billing_amount
          - entities.ServiceContract.fields.included_scan_quota
          - entities.ServiceContract.fields.overage_scan_rate_cents
        distinguishing_aspect: |
          Mode (a): >= 3 inputs with non-linear interaction — min/max tier split at the quota,
          conditional no-show branch, and a state-conditioned zero-scan floor. Day 1 with 5
          completed scans against quota 3 prices 210000; day 2 with zero completed scans on a
          day that reached READY prices the floor 200000. Distinct mode from the rounding-order
          (route_stipend_per_leg_rounding_order) and circular-order (period_invoice_tier_on_gross)
          instances.
        test_recipe:
          setup:
            - "PER_SCAN contract with scan_rate 40000, quota 3, overage 45000, guaranteed_minimum 200000"
            - "Day 1 (2026-08-04): five completed scans at 09:00/09:40/10:20/11:00/11:40"
            - "Day 2 (2026-08-05): driven to IN_SERVICE and completed with zero appointments"
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: OperationsDirector }
            - { call: "POST /api/facilities", payload: { name: "Hospital A", address: "1 A St", supported_modalities: ["CT"], pad_amps_available: 150, pad_voltage: 480, pad_level_tolerance_deg: 2.0 }, as: OperationsDirector, captures: { fac_a: $.data.id } }
            - { call: "POST /api/units", payload: { unit_code: "MIU-01", modality: "CT", power_required_amps: 100, voltage_required: 480, setup_minutes: 60, teardown_minutes: 45, home_base_name: "Depot" }, as: OperationsDirector, captures: { unit: $.data.id, unit_v: $.data.version } }
            - { call: "POST /api/accreditations", payload: { unit_id: "${unit}", accrediting_body: "ACR", modality: "CT", issued_on: "2026-01-01", expires_on: "2027-01-01" }, as: ComplianceOfficer }
