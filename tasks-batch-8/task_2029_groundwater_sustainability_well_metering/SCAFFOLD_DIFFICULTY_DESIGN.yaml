              captures: { tr_j1: $.data.id, tr_j1_status: $.data.status }
            - call: "POST /transfer-orders"
              payload: { seller_account_id: "${acct_js}", buyer_account_id: "${acct_jb2}", quantity_af: 0.001, unit_price_cents: 9000, effective_start_date: "2026-08-01", effective_end_date: "2026-10-01" }
              as: WellOwner
              as_user_id: "${acct_js}"
              captures: { tr_j2_err: $.data.error_id }
          assert:
            - "First proposal accepted: captured ${tr_j1_status} == PROPOSED (id ${tr_j1}); quantity 40.000 == available 40.000 passes the >= check"
            - "Second proposal rejected: captured ${tr_j2_err} == ERR_INSUFFICIENT_AVAILABLE_WATER; remaining available is 0.000 < 0.001"

  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: report_create_requires_well_active
        grounds:
          - validations[priority=8]
          - state_machines.Well.REGISTERED_to_ACTIVE
          - entities.ExtractionReport.fields.well_id
        distinguishing_aspect: |
          Entity pair ExtractionReport -> Well: an extraction report cannot be created
          while its well is REGISTERED (not yet metered/activated); the well's state,
          not the report's, gates the write.
        test_recipe:
          setup:
            - "Account KS: allocation 100.000, ACTIVE, with PRODUCTION well KW in REGISTERED status (meter never installed)"
          setup_api_calls:
            - call: "POST /water-user-accounts"
              payload: { holder_name: "Pumper KS", account_type: "AGRICULTURAL", base_allocation_af: 100.000 }
              as: WaterMaster
              captures: { acct_ks: $.data.id }
            - call: "POST /wells"
              payload: { account_id: "${acct_ks}", well_type: "PRODUCTION", location_description: "Parcel K" }
              as: WellOwner
              as_user_id: "${acct_ks}"
              captures: { well_k: $.data.id }
          trigger:
            - call: "POST /extraction-reports"
              payload: { well_id: "${well_k}", water_year: 2026, month: 6, reported_af: 5.000 }
              as: WellOwner
              as_user_id: "${acct_ks}"
              captures: { rep_err: $.data.error_id }
            - call: "GET /extraction-reports?well_id=${well_k}"
              as: WaterMaster
              captures: { rep_count_probe: $.data }
          assert:
            - "captured ${rep_err} == ERR_WELL_NOT_ACTIVE: Well.status REGISTERED gates ExtractionReport creation"
            - "No report persisted: GET /extraction-reports?well_id=${well_k} returns an empty list (total_count == 0)"

      - name: settle_requires_basin_not_critical
        grounds:
          - validations[priority=14]
          - state_machines.TransferOrder.ACCEPTED_to_SETTLED
          - entities.BasinConditionSnapshot.fields.condition
        distinguishing_aspect: |
          Entity pair TransferOrder -> BasinConditionSnapshot (different pair than the
          other instance): an ACCEPTED order cannot settle while the official published
          basin condition is CRITICAL; the order remains ACCEPTED (publish expiry hits
          only PROPOSED orders).
        test_recipe:
          setup:
            - "Seller LS (allocation 100.000), buyer LB (50.000); transfer TL qty 10.000 window [2026-08-01, 2026-10-01) moved to ACCEPTED"
            - "Agency account AG with 4 ACTIVE MONITORING wells (threshold 100.0), readings 130/125/60/55 on 2026-07-15"
          setup_api_calls:
            - call: "POST /water-user-accounts"
              payload: { holder_name: "Seller LS", account_type: "AGRICULTURAL", base_allocation_af: 100.000 }
              as: WaterMaster
              captures: { acct_ls: $.data.id }
            - call: "POST /water-user-accounts"
              payload: { holder_name: "Buyer LB", account_type: "AGRICULTURAL", base_allocation_af: 50.000 }
              as: WaterMaster
              captures: { acct_lb: $.data.id }
            - call: "POST /transfer-orders"
              payload: { seller_account_id: "${acct_ls}", buyer_account_id: "${acct_lb}", quantity_af: 10.000, unit_price_cents: 9000, effective_start_date: "2026-08-01", effective_end_date: "2026-10-01" }
              as: WellOwner
              as_user_id: "${acct_ls}"
              captures: { tr_l: $.data.id }
            - call: "POST /transfer-orders/${tr_l}/accept"
              as: WellOwner
              as_user_id: "${acct_lb}"
            - call: "POST /water-user-accounts"
              payload: { holder_name: "Agency Monitor", account_type: "MUNICIPAL", base_allocation_af: 1000.000 }
              as: WaterMaster
              captures: { acct_ag: $.data.id }
            - call: "POST /wells"
              payload: { account_id: "${acct_ag}", well_type: "MONITORING", location_description: "MW-1", minimum_threshold_ft: 100.0 }
              as: WellOwner
              as_user_id: "${acct_ag}"
              captures: { mw_1: $.data.id }
            - call: "POST /wells"
              payload: { account_id: "${acct_ag}", well_type: "MONITORING", location_description: "MW-2", minimum_threshold_ft: 100.0 }
              as: WellOwner
              as_user_id: "${acct_ag}"
              captures: { mw_2: $.data.id }
            - call: "POST /wells"
              payload: { account_id: "${acct_ag}", well_type: "MONITORING", location_description: "MW-3", minimum_threshold_ft: 100.0 }
              as: WellOwner
              as_user_id: "${acct_ag}"
              captures: { mw_3: $.data.id }
            - call: "POST /wells"
              payload: { account_id: "${acct_ag}", well_type: "MONITORING", location_description: "MW-4", minimum_threshold_ft: 100.0 }
              as: WellOwner
              as_user_id: "${acct_ag}"
              captures: { mw_4: $.data.id }
            - call: "POST /wells/${mw_1}/activate"
              as: WaterMaster
            - call: "POST /wells/${mw_2}/activate"
              as: WaterMaster
            - call: "POST /wells/${mw_3}/activate"
              as: WaterMaster
            - call: "POST /wells/${mw_4}/activate"
              as: WaterMaster
            - call: "POST /monitoring-readings"
              payload: { well_id: "${mw_1}", measured_at: "2026-07-15T08:00:00Z", depth_to_water_ft: 130.0, collector_name: "Field Tech" }
              as: WaterMaster
            - call: "POST /monitoring-readings"
              payload: { well_id: "${mw_2}", measured_at: "2026-07-15T08:00:00Z", depth_to_water_ft: 125.0, collector_name: "Field Tech" }
              as: WaterMaster
            - call: "POST /monitoring-readings"
              payload: { well_id: "${mw_3}", measured_at: "2026-07-15T08:00:00Z", depth_to_water_ft: 60.0, collector_name: "Field Tech" }
              as: WaterMaster
            - call: "POST /monitoring-readings"
              payload: { well_id: "${mw_4}", measured_at: "2026-07-15T08:00:00Z", depth_to_water_ft: 55.0, collector_name: "Field Tech" }
              as: WaterMaster
            - call: "POST /basin-condition-snapshots"
              as: WaterMaster
              captures: { snap_l: $.data.id }
            - call: "POST /basin-condition-snapshots/${snap_l}/publish"
              as: WaterMaster
          trigger:
            - call: "POST /transfer-orders/${tr_l}/settle"
              as: WaterMaster
              captures: { settle_err: $.data.error_id }
            - call: "GET /transfer-orders/${tr_l}"
              as: WaterMaster
              captures: { tr_l_status: $.data.status }
          assert:
            - "captured ${settle_err} == ERR_BASIN_CRITICAL_TRANSFERS_SUSPENDED: settlement gated by BasinConditionSnapshot state, not by the order's own state"
            - "TransferOrder.${tr_l}.status == ACCEPTED (captured ${tr_l_status}): the failed settlement left the order in place and the CRITICAL publish expired only PROPOSED orders"

  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: buyer_inbound_window_half_open_adjacency
        grounds:
          - validations[priority=20]
          - entities.TransferOrder.fields.effective_start_date
          - entities.TransferOrder.fields.effective_end_date
        distinguishing_aspect: |
          Interval semantics = pairwise half-open adjacency on the buyer
          WaterUserAccount's inbound window set: [2026-08-01, 2026-10-01) then
          [2026-10-01, 2026-12-01) touch at exactly one endpoint and must NOT conflict;
          a third window [2026-11-15, 2027-01-01) overlaps the second and must be
          rejected with ERR_TRANSFER_WINDOW_OVERLAP.
        test_recipe:
          setup:
            - "Sellers MS-1 and MS-2 (allocation 100.000 each); buyer MB (allocation 50.000)"
            - "T-A: MS-1 -> MB, qty 5.000, window [2026-08-01, 2026-10-01), PROPOSED"
          setup_api_calls:
            - call: "POST /water-user-accounts"
              payload: { holder_name: "Seller MS-1", account_type: "AGRICULTURAL", base_allocation_af: 100.000 }
              as: WaterMaster
              captures: { acct_ms1: $.data.id }
            - call: "POST /water-user-accounts"
              payload: { holder_name: "Seller MS-2", account_type: "AGRICULTURAL", base_allocation_af: 100.000 }
              as: WaterMaster
              captures: { acct_ms2: $.data.id }
            - call: "POST /water-user-accounts"
              payload: { holder_name: "Buyer MB", account_type: "AGRICULTURAL", base_allocation_af: 50.000 }
              as: WaterMaster
              captures: { acct_mb: $.data.id }
            - call: "POST /transfer-orders"
              payload: { seller_account_id: "${acct_ms1}", buyer_account_id: "${acct_mb}", quantity_af: 5.000, unit_price_cents: 9000, effective_start_date: "2026-08-01", effective_end_date: "2026-10-01" }
              as: WellOwner
              as_user_id: "${acct_ms1}"
              captures: { tr_a: $.data.id }
          trigger:
            - call: "POST /transfer-orders"
              payload: { seller_account_id: "${acct_ms2}", buyer_account_id: "${acct_mb}", quantity_af: 5.000, unit_price_cents: 9000, effective_start_date: "2026-10-01", effective_end_date: "2026-12-01" }
              as: WellOwner
              as_user_id: "${acct_ms2}"
              captures: { tr_b: $.data.id, tr_b_status: $.data.status }
            - call: "POST /transfer-orders"
              payload: { seller_account_id: "${acct_ms2}", buyer_account_id: "${acct_mb}", quantity_af: 5.000, unit_price_cents: 9000, effective_start_date: "2026-11-15", effective_end_date: "2027-01-01" }
              as: WellOwner
              as_user_id: "${acct_ms2}"
              captures: { tr_c_err: $.data.error_id }
          assert:
            - "Adjacent window accepted: TransferOrder.${tr_b}.status == PROPOSED (captured ${tr_b_status}); existing end 2026-10-01 == new start 2026-10-01 is not an overlap under half-open [start, end) semantics"
            - "Overlapping window rejected: captured ${tr_c_err} == ERR_TRANSFER_WINDOW_OVERLAP; [2026-11-15, 2027-01-01) intersects [2026-10-01, 2026-12-01)"

      - name: monthly_market_cap_aggregate_intersection
        grounds:
          - calculations.monthly_transfer_cap_check
          - validations[priority=27]
        distinguishing_aspect: |
          Interval semantics = aggregate capacity over a shared month bucket of the
          TransferOrder collection (different semantics than pairwise half-open
          adjacency, and a different resource — the basin-wide transfer market rather
          than one buyer's window set): September 2026 aggregate reaches exactly
          5000.000 af and is accepted (<= boundary); one more 0.001 af in any window
          intersecting September is rejected.
        test_recipe:
          setup:
            - "Seller KS-1: allocation 10000.000; buyers KB-1..KB-4: allocation 50.000 each (distinct buyers avoid pairwise window overlap)"
            - "T-a: KS-1 -> KB-1 qty 3000.000 window [2026-08-15, 2026-10-15) (intersects September)"
            - "T-b: KS-1 -> KB-2 qty 1999.999 window [2026-09-01, 2026-10-01) (intersects September)"
          setup_api_calls:
            - call: "POST /water-user-accounts"
              payload: { holder_name: "Seller KS-1", account_type: "AGRICULTURAL", base_allocation_af: 10000.000 }
              as: WaterMaster
              captures: { acct_ks1: $.data.id }
            - call: "POST /water-user-accounts"
              payload: { holder_name: "Buyer KB-1", account_type: "AGRICULTURAL", base_allocation_af: 50.000 }
              as: WaterMaster
              captures: { acct_kb1: $.data.id }
            - call: "POST /water-user-accounts"
              payload: { holder_name: "Buyer KB-2", account_type: "AGRICULTURAL", base_allocation_af: 50.000 }
              as: WaterMaster
              captures: { acct_kb2: $.data.id }
            - call: "POST /water-user-accounts"
              payload: { holder_name: "Buyer KB-3", account_type: "AGRICULTURAL", base_allocation_af: 50.000 }
              as: WaterMaster
              captures: { acct_kb3: $.data.id }
            - call: "POST /water-user-accounts"
              payload: { holder_name: "Buyer KB-4", account_type: "AGRICULTURAL", base_allocation_af: 50.000 }
              as: WaterMaster
              captures: { acct_kb4: $.data.id }
            - call: "POST /transfer-orders"
              payload: { seller_account_id: "${acct_ks1}", buyer_account_id: "${acct_kb1}", quantity_af: 3000.000, unit_price_cents: 9000, effective_start_date: "2026-08-15", effective_end_date: "2026-10-15" }
              as: WellOwner
              as_user_id: "${acct_ks1}"
              captures: { tr_a: $.data.id }
            - call: "POST /transfer-orders"
              payload: { seller_account_id: "${acct_ks1}", buyer_account_id: "${acct_kb2}", quantity_af: 1999.999, unit_price_cents: 9000, effective_start_date: "2026-09-01", effective_end_date: "2026-10-01" }
              as: WellOwner
              as_user_id: "${acct_ks1}"
              captures: { tr_b: $.data.id }
          trigger:
            - call: "POST /transfer-orders"
              payload: { seller_account_id: "${acct_ks1}", buyer_account_id: "${acct_kb3}", quantity_af: 0.001, unit_price_cents: 9000, effective_start_date: "2026-09-10", effective_end_date: "2026-10-10" }
              as: WellOwner
              as_user_id: "${acct_ks1}"
              captures: { tr_c: $.data.id, tr_c_status: $.data.status }
            - call: "POST /transfer-orders"
              payload: { seller_account_id: "${acct_ks1}", buyer_account_id: "${acct_kb4}", quantity_af: 0.001, unit_price_cents: 9000, effective_start_date: "2026-09-05", effective_end_date: "2026-09-25" }
              as: WellOwner
              as_user_id: "${acct_ks1}"
              captures: { tr_d_err: $.data.error_id }
          assert:
            - "T-c accepted (captured ${tr_c_status} == PROPOSED, id ${tr_c}): September aggregate becomes exactly 3000.000 + 1999.999 + 0.001 = 5000.000 <= 5000"
            - "T-d rejected: captured ${tr_d_err} == ERR_MONTHLY_TRANSFER_CAP_EXCEEDED; September aggregate would become 5000.001 > 5000"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: propose_cancel_restores_available_water
        grounds:
          - state_machines.TransferOrder.PROPOSED_to_CANCELLED
          - entities.WaterUserAccount.fields.transfer_reserved_af
          - calculations.available_water_af
        distinguishing_aspect: |
          Conserved quantity = seller's available water (af). Forward action propose
          (transfer_reserved_af += q) paired with its compensating action cancel
          (transfer_reserved_af -= q) must leave the account's ledger untouched:
          transfer_reserved_af == 0.000 and transfer_out_af_ytd == 0.000 afterwards,
          and a follow-on proposal for the full remaining available (70.000 af)
          succeeds — proving no residue from the cancelled order.
        test_recipe:
          setup:
            - "Seller NS: allocation 80.000, verified extraction 10.000 (report NR month 6) -> available 70.000"
            - "Buyer NB: allocation 50.000"
            - "T-N proposed qty 25.000 window [2026-08-01, 2026-10-01), then cancelled by the seller"
          setup_api_calls:
            - call: "POST /water-user-accounts"
              payload: { holder_name: "Seller NS", account_type: "AGRICULTURAL", base_allocation_af: 80.000 }
              as: WaterMaster
              captures: { acct_ns: $.data.id }
            - call: "POST /water-user-accounts"
              payload: { holder_name: "Buyer NB", account_type: "AGRICULTURAL", base_allocation_af: 50.000 }
              as: WaterMaster
              captures: { acct_nb: $.data.id }
            - call: "POST /wells"
              payload: { account_id: "${acct_ns}", well_type: "PRODUCTION", location_description: "Parcel N" }
              as: WellOwner
              as_user_id: "${acct_ns}"
              captures: { well_n: $.data.id }
            - call: "POST /wells/${well_n}/install-meter"
              payload: { meter_serial: "M-N01" }
              as: WellOwner
              as_user_id: "${acct_ns}"
            - call: "POST /wells/${well_n}/activate"
              as: WaterMaster
            - call: "POST /extraction-reports"
              payload: { well_id: "${well_n}", water_year: 2026, month: 6, reported_af: 10.000 }
              as: WellOwner
              as_user_id: "${acct_ns}"
              captures: { rep_n: $.data.id }
            - call: "POST /extraction-reports/${rep_n}/verify"
              as: WaterMaster
            - call: "POST /transfer-orders"
              payload: { seller_account_id: "${acct_ns}", buyer_account_id: "${acct_nb}", quantity_af: 25.000, unit_price_cents: 9000, effective_start_date: "2026-08-01", effective_end_date: "2026-10-01" }
              as: WellOwner
              as_user_id: "${acct_ns}"
              captures: { tr_n: $.data.id }
            - call: "POST /transfer-orders/${tr_n}/cancel"
              as: WellOwner
              as_user_id: "${acct_ns}"
          trigger:
            - call: "GET /water-user-accounts/${acct_ns}"
              as: WaterMaster
              captures: { ns_reserved: $.data.transfer_reserved_af, ns_out: $.data.transfer_out_af_ytd, ns_extracted: $.data.extracted_af_ytd }
            - call: "POST /transfer-orders"
              payload: { seller_account_id: "${acct_ns}", buyer_account_id: "${acct_nb}", quantity_af: 70.000, unit_price_cents: 9000, effective_start_date: "2026-11-01", effective_end_date: "2027-01-01" }
              as: WellOwner
              as_user_id: "${acct_ns}"
              captures: { tr_n2: $.data.id, tr_n2_status: $.data.status }
          assert:
            - "After propose+cancel: transfer_reserved_af == 0.000 (captured ${ns_reserved}) and transfer_out_af_ytd == 0.000 (captured ${ns_out}) — the pair of actions conserved the available-water ledger"
            - "extracted_af_ytd == 10.000 unchanged (captured ${ns_extracted})"
            - "Follow-on proposal for the full 70.000 af accepted: captured ${tr_n2_status} == PROPOSED (id ${tr_n2}); any reservation leak would reject it"

      - name: assess_overturn_restores_penalty_balance
        grounds:
          - state_machines.PenaltyAssessment.APPEALED_to_OVERTURNED
          - entities.WaterUserAccount.fields.penalty_balance_cents
        distinguishing_aspect: |
          Conserved quantity = money (penalty_balance_cents), a different conserved
          quantity than available water: assess (balance += amount) followed by
          appeal + OVERTURNED decision (balance -= amount) must return the ledger to
          exactly 0 with no drift.
        test_recipe:
          setup:
            - "Account OS (ACTIVE); one LATE_REPORT assessment amount_cents 10000, assessed_by eo-1, water_year 2026; balance 10000"
            - "Assessment appealed within window"
          setup_api_calls:
            - call: "POST /water-user-accounts"
              payload: { holder_name: "Pumper OS", account_type: "AGRICULTURAL", base_allocation_af: 100.000 }
              as: WaterMaster
              captures: { acct_os: $.data.id }
            - call: "POST /penalty-assessments"
              payload: { account_id: "${acct_os}", reason: "LATE_REPORT", water_year: 2026 }
              as: EnforcementOfficer
              as_user_id: "eo-1"
              captures: { pa_o: $.data.id }
            - call: "POST /penalty-assessments/${pa_o}/appeal"
              payload: { grounds: "late fee disputed" }
              as: WellOwner
              as_user_id: "${acct_os}"
          trigger:
            - call: "POST /penalty-assessments/${pa_o}/decide"
              payload: { outcome: "OVERTURNED" }
              as: AppealsOfficer
              as_user_id: "ao-1"
              captures: { st_o: $.data.status }
            - call: "GET /water-user-accounts/${acct_os}"
              as: WaterMaster
              captures: { os_bal: $.data.penalty_balance_cents }
          assert:
            - "PenaltyAssessment.${pa_o}.status == OVERTURNED (captured ${st_o})"
            - "WaterUserAccount.${acct_os}.penalty_balance_cents == 0 (captured ${os_bal}): 10000 debited at assessment, 10000 refunded at overturn — the conserved money quantity shows zero drift"
