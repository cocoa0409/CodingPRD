              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
              captures: { agr_s2: $.data.id }
            - call: "POST /licensing/agreements/${agr_s2}/territory-grants"
              payload: { territory_code: "US", channel_class: "ALL", effective_from: "2026-01-01", effective_to: "2028-01-01" }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
            - call: "POST /licensing/agreements/${agr_s2}/advance-payments"
