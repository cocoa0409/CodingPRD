              payload: { property_id: "${prop_a}", unit_number: "101", bedroom_count: 2, occupancy_status: "OCCUPIED", occupant_display_name: "Household 101" }
              as: PlatformAdmin
            - call: "POST /units"
              payload: { property_id: "${prop_a}", unit_number: "102", bedroom_count: 2, occupancy_status: "VACANT" }
              as: PlatformAdmin
            - call: "POST /properties"
              payload: { name: "Birch Court", total_unit_count: 31, capital_reserve_cents: 1000000, owner_contact_email: "owner@birchcourt.example" }
              as: PlatformAdmin
              captures: { prop_b: $.data.id }
            - call: "POST /units"
              payload: { property_id: "${prop_b}", unit_number: "201", bedroom_count: 2, occupancy_status: "OCCUPIED", occupant_display_name: "Household 201" }
              as: PlatformAdmin
            - call: "POST /units"
              payload: { property_id: "${prop_b}", unit_number: "202", bedroom_count: 2, occupancy_status: "VACANT" }
              as: PlatformAdmin
            - call: "POST /inspections"
              payload: { property_id: "${prop_a}", standard_id: "${std_id}", scheduled_start: "2026-09-10T09:00:00.000Z", scheduled_end: "2026-09-10T17:00:00.000Z", inspection_kind: "INITIAL" }
              as: HousingAgencyInspector
              captures: { insp_a: $.data.id }
            - call: "POST /inspections"
              payload: { property_id: "${prop_b}", standard_id: "${std_id}", scheduled_start: "2026-09-10T09:00:00.000Z", scheduled_end: "2026-09-10T17:00:00.000Z", inspection_kind: "INITIAL" }
              as: HousingAgencyInspector
              captures: { insp_b: $.data.id }
            - call: "POST /inspections/${insp_a}/draw-sample"
              payload: { drawn_at: "2026-08-02T00:00:00.000Z" }
