      - name: judicial_spending_slice_truncates_instead_of_rounding
        claim_type: precision
        grounds:
          - calculations.restricted_fund_transferable_amount
          - state_machines.RestrictedFund.PETITION_FILED_to_MODIFIED
          - entities.RestrictedFund.fields.transferable_amount_cents
        distinguishing_aspect: |
          The spending-rate slice is floor(historic_dollar_value_cents * 700 / 10000),
          and floor is NOT round_half_up. A historic dollar value of 45000010 makes the
          slice 3150000.7 cents, which truncates to 3150000; rounding it up to 3150001
          releases one cent of endowment principal that no court order covers. The
          released total is therefore 16999990 + 3150000 = 20149990 rather than
          20149991, and the same fund under the DONOR_CONSENT branch would have released
          the whole 62000000.
        test_recipe:
          setup:
            - "One CA organization holding a PERM_ENDOWMENT fund of principal 50000000 and accumulated appreciation 12000000 with historic_dollar_value_cents 45000010, a conflicting restriction and an unreachable donor of record"
          setup_api_calls:
            - call: "POST /organizations"
              payload: { legal_name: "Riverside Youth Alliance", ein: "11-1111111", state_code: "CA", mission_code: "YM-YOUTH_MENTORING", annual_expense_cents: 100000002, unrestricted_net_assets_cents: 59916670 }
              as: PlatformAdmin
              captures: { org_a: $.data.id }
            - call: "POST /restricted-funds"
              payload: { org_id: "${org_a}", fund_name: "Vance Perpetual Mentoring Endowment", fund_type: "PERM_ENDOWMENT", principal_cents: 50000000, accumulated_appreciation_cents: 12000000, historic_dollar_value_cents: 45000010, restriction_purpose_code: "PURP-MENTOR-CO101", restriction_conflict: true, donor_of_record_reachable: false }
              as: CharitableTrustCounsel
              as_user_id: "ctc-001"
              captures: { fund_j: $.data.id }
            - call: "POST /restricted-funds/${fund_j}/file-petition"
              payload: { petition_basis: "DONOR_UNREACHABLE", court_docket_no: "SUP-CT-2026-0631" }
              as: CharitableTrustCounsel
              as_user_id: "ctc-001"
          trigger:
            - call: "POST /restricted-funds/${fund_j}/record-court-decision"
              payload: { decision: "GRANTED" }
              as: CharitableTrustCounsel
              as_user_id: "ctc-001"
          assert:
            - "the call returns HTTP status 200"
            - "RestrictedFund.${fund_j}.transfer_status == MODIFIED"
            - "RestrictedFund.${fund_j}.court_decision == GRANTED"
            - "RestrictedFund.${fund_j}.transferable_amount_cents == 20149990"
            - "RestrictedFund.${fund_j}.transferable_amount_cents != 20149991, which is what round_half_up on the 3150000.7 cent slice would produce"
            - "Organization.${org_a}.restricted_corpus_cents == 62000000, because a MODIFIED fund has not left the holder"

