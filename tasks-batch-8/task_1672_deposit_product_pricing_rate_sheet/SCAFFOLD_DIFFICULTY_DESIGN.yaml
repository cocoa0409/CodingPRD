      - name: promo_window_closed_interval_touch_conflicts
        grounds:
          - "validations[priority=15]"
          - state_machines.PromotionalOffer.DRAFT_to_SCHEDULED
        distinguishing_aspect: |
          PromotionalOffer enrollment windows are CLOSED [start, end] — the opposite semantic from
          half-open sheet windows: a second offer whose enrollment_start equals the first offer's
          enrollment_end CONFLICTS (touching dates intersect), while a start one day later is legal.
        test_recipe:
          setup:
            - "P-OVP (MONEY_MARKET, term 0, MARGINAL, cap 600, allows_promos) exists; no sheets needed (publish checks promo overlap only)"
            - "Offer P1 window [2026-08-01, 2026-08-31] published (SCHEDULED)"
