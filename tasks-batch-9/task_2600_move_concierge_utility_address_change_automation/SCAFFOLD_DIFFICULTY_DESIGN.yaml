            - call: "POST /provider-service-territories"
              payload: { provider_id: "${prov_a_id}", postal_code: "30302", state_code: "GA", effective_from: "2026-01-01", effective_to: "2026-06-30", priority_rank: 1, is_default_carrier: true }
              as: PlatformAdmin
              captures: { terr_a_id: $.data.id }
          trigger:
            - call: "POST /provider-service-territories"
              payload: { provider_id: "${prov_b_id}", postal_code: "30302", state_code: "GA", effective_from: "2026-07-01", priority_rank: 1, is_default_carrier: true }
              as: PlatformAdmin
            - call: "POST /provider-service-territories"
              payload: { provider_id: "${prov_b_id}", postal_code: "30302", state_code: "GA", effective_from: "2026-07-02", priority_rank: 1, is_default_carrier: true }
              as: PlatformAdmin
              captures: { terr_b_id: $.data.id }
          assert:
            - "exactly one day after the inclusive end: trigger call 1 returns HTTP 409 with error_id == ERR_TERRITORY_OVERLAP"
            - "after trigger call 1: GET /provider-service-territories?postal_code=30302&is_default_carrier=true returns total_count == 1"
            - "two days after the inclusive end: trigger call 2 returns HTTP 201 with effective_from == 2026-07-02, effective_to == null and is_default_carrier == true"
            - "GET /provider-service-territories?provider_id=${prov_b_id} returns total_count == 1 with data[0].id == ${terr_b_id}"
            - "ProviderServiceTerritory.${terr_a_id}.effective_to == 2026-06-30 is untouched by either attempt"
            - "a non-default row for the same pair is unaffected by the buffer: POST /provider-service-territories with provider_id ${prov_b_id}, postal_code 30302, effective_from 2026-07-01, priority_rank 2 and is_default_carrier false returns HTTP 201"

