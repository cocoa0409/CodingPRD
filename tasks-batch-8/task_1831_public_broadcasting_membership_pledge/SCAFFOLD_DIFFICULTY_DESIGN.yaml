          Depth-2 cascade from a different trigger (write-off, not payment):
          pledge write-off (link 1) forces its HELD reservation to RELEASED
          (link 2), and that release mutates the lot counters
          (reserved_qty -= 1, available_qty += 1) — a distinct propagation
          pattern originating from a different transition.
        test_recipe:
