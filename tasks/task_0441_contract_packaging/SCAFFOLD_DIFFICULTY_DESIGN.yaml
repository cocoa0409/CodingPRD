            - call: "POST /copack/production-runs"
              payload: { recipe_id: "${recipe_id}", line_id: "${line_b}", crew_id: "${crew_id}", planned_units: 100, scheduled_start: "2026-06-01T10:00:00Z" }
              as: Scheduler
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_CREW_OVERLAP"
            - "http status == 409"

  # =====================================================================
  - rule_id: compensating_invariant
    instances:
      - name: running_cancel_restores_material_remaining_invariant
        grounds:
          - state_machines.ProductionRun.RUNNING_to_CANCELLED
          - state_machines.ProductionRun.SCHEDULED_to_RUNNING
          - entities.ComponentLot.fields.remaining_qty
          - calculations.material_consumption
        distinguishing_aspect: |
          Conserved quantity: total ComponentLot.remaining_qty for the component. Start
          draws 210 (lot 500 -> 290); a RUNNING cancel reverses every LotConsumption and
          restores remaining_qty to exactly 500 — pre-start total == post-cancel total,
          zero drift.
        test_recipe:
          setup:
            - "Component ALMOND single lot 500; run started (consumes 210, lot -> 290) then cancelled while RUNNING"
          setup_api_calls:
            - call: "POST /copack/customers"
              payload: { name: "Acme", code: "ACME" }
              as: Receiver
              captures: { cust_id: $.data.id }
            - call: "POST /copack/components"
              payload: { customer_id: "${cust_id}", sku: "ALMOND", name: "Almonds", kind: "INGREDIENT" }
              as: Receiver
              captures: { comp_id: $.data.id }
            - call: "POST /copack/components"
              payload: { customer_id: "${cust_id}", sku: "POUCH", name: "Pouch", kind: "PACKAGING" }
              as: Receiver
              captures: { pouch_id: $.data.id }
            - call: "POST /copack/components/${comp_id}/lots"
              payload: { supplier_lot_code: "ALM-1", received_qty: 500, expiration_date: "2026-12-31T00:00:00Z" }
              as: Receiver
              captures: { lot_id: $.data.id }
            - call: "POST /copack/components/${pouch_id}/lots"
              payload: { supplier_lot_code: "POU-1", received_qty: 1000, expiration_date: "2027-12-31T00:00:00Z" }
              as: Receiver
            - call: "POST /copack/recipes"
              payload: { customer_id: "${cust_id}", name: "Granola", target_fill_weight_g: 200, fill_tolerance_pct: 5, shelf_life_days: 90 }
              as: Scheduler
              captures: { recipe_id: $.data.id, rv0: $.data.version }
            - call: "POST /copack/recipes/${recipe_id}/bom-lines"
              payload: { component_id: "${comp_id}", qty_per_unit: 2, scrap_factor_pct: 5, expected_recipe_version: "${rv0}" }
              as: Scheduler
              captures: { rv1: $.data.version }
            - call: "POST /copack/recipes/${recipe_id}/bom-lines"
              payload: { component_id: "${pouch_id}", qty_per_unit: 1, expected_recipe_version: "${rv1}" }
              as: Scheduler
            - call: "POST /copack/recipes/${recipe_id}/submit"
              payload: {}
              as: Scheduler
            - call: "POST /copack/recipes/${recipe_id}/approve"
              payload: {}
              as: QAInspector
            - call: "POST /copack/production-lines"
              payload: { name: "Line A", rated_units_per_hour: 50 }
              as: Scheduler
              captures: { line_id: $.data.id, lv0: $.data.version }
            - call: "POST /copack/crews"
              payload: { name: "Day Crew" }
              as: Scheduler
              captures: { crew_id: $.data.id }
            - call: "POST /copack/production-runs"
              payload: { recipe_id: "${recipe_id}", line_id: "${line_id}", crew_id: "${crew_id}", planned_units: 100, scheduled_start: "2026-06-01T08:00:00Z" }
              as: Scheduler
              captures: { run_id: $.data.id }
            - call: "POST /copack/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T08:00:00Z" }
              as: Scheduler
            - call: "POST /copack/production-runs/${run_id}/start"
              payload: { expected_line_version: "${lv0}" }
              as: Scheduler
          trigger:
            - call: "POST /copack/production-runs/${run_id}/cancel"
              payload: {}
              as: Scheduler
            - call: "GET /copack/component-lots/${lot_id}"
              payload: {}
              as: Scheduler
              captures: { lot_rem: $.data.remaining_qty, lot_status: $.data.status }
          assert:
            - "ComponentLot.${lot_id}.remaining_qty == 500.000 (restored to pre-start)"
            - "ComponentLot.${lot_id}.status == AVAILABLE"

      - name: running_cancel_nets_cmr_ledger_to_zero
        grounds:
          - state_machines.ProductionRun.RUNNING_to_CANCELLED
          - state_machines.ProductionRun.SCHEDULED_to_RUNNING
          - entities.CmrLedgerEntry.fields.delta_qty
          - endpoints./copack/cmr-ledger-entries
        distinguishing_aspect: |
          Conserved quantity (DIFFERENT type than material remaining_qty): the CMR ledger
          net delta for a customer-owned component. Start emits CONSUME -210; a RUNNING
          cancel emits RETURN_ON_CANCEL +210, so the sum of delta_qty for this run nets
          to exactly 0.000.
        test_recipe:
          setup:
            - "Customer ACME owns_components=true; component ALMOND customer_owned; run started (CMR -210) then cancelled while RUNNING (CMR +210)"
          setup_api_calls:
            - call: "POST /copack/customers"
              payload: { name: "Acme", code: "ACME", owns_components: true }
              as: Receiver
              captures: { cust_id: $.data.id }
            - call: "POST /copack/components"
              payload: { customer_id: "${cust_id}", sku: "ALMOND", name: "Almonds", kind: "INGREDIENT" }
              as: Receiver
              captures: { comp_id: $.data.id }
            - call: "POST /copack/components"
              payload: { customer_id: "${cust_id}", sku: "POUCH", name: "Pouch", kind: "PACKAGING" }
              as: Receiver
              captures: { pouch_id: $.data.id }
            - call: "POST /copack/components/${comp_id}/lots"
              payload: { supplier_lot_code: "ALM-1", received_qty: 500, expiration_date: "2026-12-31T00:00:00Z" }
              as: Receiver
            - call: "POST /copack/components/${pouch_id}/lots"
              payload: { supplier_lot_code: "POU-1", received_qty: 1000, expiration_date: "2027-12-31T00:00:00Z" }
              as: Receiver
            - call: "POST /copack/recipes"
              payload: { customer_id: "${cust_id}", name: "Granola", target_fill_weight_g: 200, fill_tolerance_pct: 5, shelf_life_days: 90 }
              as: Scheduler
              captures: { recipe_id: $.data.id, rv0: $.data.version }
            - call: "POST /copack/recipes/${recipe_id}/bom-lines"
              payload: { component_id: "${comp_id}", qty_per_unit: 2, scrap_factor_pct: 5, expected_recipe_version: "${rv0}" }
              as: Scheduler
              captures: { rv1: $.data.version }
            - call: "POST /copack/recipes/${recipe_id}/bom-lines"
              payload: { component_id: "${pouch_id}", qty_per_unit: 1, expected_recipe_version: "${rv1}" }
              as: Scheduler
            - call: "POST /copack/recipes/${recipe_id}/submit"
              payload: {}
              as: Scheduler
            - call: "POST /copack/recipes/${recipe_id}/approve"
              payload: {}
              as: QAInspector
            - call: "POST /copack/production-lines"
              payload: { name: "Line A", rated_units_per_hour: 50 }
              as: Scheduler
              captures: { line_id: $.data.id, lv0: $.data.version }
            - call: "POST /copack/crews"
              payload: { name: "Day Crew" }
              as: Scheduler
              captures: { crew_id: $.data.id }
            - call: "POST /copack/production-runs"
              payload: { recipe_id: "${recipe_id}", line_id: "${line_id}", crew_id: "${crew_id}", planned_units: 100, scheduled_start: "2026-06-01T08:00:00Z" }
              as: Scheduler
              captures: { run_id: $.data.id }
            - call: "POST /copack/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T08:00:00Z" }
              as: Scheduler
            - call: "POST /copack/production-runs/${run_id}/start"
              payload: { expected_line_version: "${lv0}" }
              as: Scheduler
          trigger:
            - call: "POST /copack/production-runs/${run_id}/cancel"
              payload: {}
              as: Scheduler
            - call: "GET /copack/cmr-ledger-entries?production_run_id=${run_id}"
              payload: {}
              as: Receiver
              captures: { first_delta: "$.data[0].delta_qty" }
          assert:
            - "sum of CmrLedgerEntry.delta_qty for production_run_id == run_id equals 0.000"
            - "ledger contains a CONSUME entry delta_qty == -210.000 and a RETURN_ON_CANCEL entry delta_qty == +210.000"
