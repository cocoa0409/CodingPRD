            - "InjectionWellPermit.${permit_id}.permit_status == DRAFT"
            - "InjectionWellPermit.${permit_id}.construction_status == NOT_STARTED"
            - "InjectionWellPermit.${permit_id}.authorized_injection_rate_tpy == 0"
            - "InjectionWellPermit.${permit_id}.activated_at == null"
            - "StorageProject.${proj_id}.status == PERMITTING"

