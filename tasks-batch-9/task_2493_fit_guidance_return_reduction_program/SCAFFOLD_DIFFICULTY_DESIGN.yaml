# ===========================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task 2493 - Fit Guidance & Return Reduction Program
# 9 rule_id blocks x 2 instances = 18 instances.
# Every numeric literal in `assert:` was computed against the formulas and
# constants declared in SCAFFOLD.yaml §1.3.
# ===========================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: fit_recommendation_history_vs_population_divergence
        grounds:
          - calculations.fit_recommendation
          - calculations.mapping_coverage
          - entities.CatalogItem.fields.fit_readiness
          - entities.FitFeedback.fields.signal_weight
          - entities.SizeChart.fields.median_row_index
        distinguishing_aspect: |
          This instance's two variants live in the shopper-guidance domain (FitFeedback and
          OrderLine history of one CustomerProfile against a SizeChart), and the divergence is
          observable on recommended_size_label AND confidence_bp: the same stored data returns
          "L" at confidence 6000 under history_weighted and a suppressed null label at
          confidence 1600 under population_fallback.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z."
            - "Vendor NRTH with a 10000-cent correction budget; three LISTED TOPS items: the target item plus aux items A and B."
            - "Target item has a VERIFIED 5-point measurement specification, a STANDARDIZED 5-row chart, an ACTIVE 4-pair mapping (coverage_bp 8000), completed PDP enhancement and fit_readiness GUIDANCE_READY."
            - "One shopper with two delivered order lines: item A size M (2026-05-20) and item B size S (2026-05-10)."
            - "The item-B line carries a RESOLVED_REFUNDED FIT_TOO_SMALL return case; the shopper has ACTIVE fit feedback TOO_SMALL on item A and SLIGHTLY_SMALL on item B, each with signal_weight 200."
            - "The target item itself carries no fit feedback at all, so the population pool is empty."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: MerchOpsAdmin
            - call: "POST /fit-program/vendors"
              payload: { name: "Northwind Apparel", brand_code: "NRTH", correction_budget_cents: 10000 }
              as: MerchOpsAdmin
              captures: { vendor_id: $.data.id }
            - call: "POST /fit-program/catalog-items"
              payload: { vendor_id: "${vendor_id}", sku: "NRTH-TEE-01", category_code: "TOPS", brand_size_system: "US_ALPHA", unit_price_cents: 2295 }
              as: MerchOpsAdmin
              captures: { item_id: $.data.id }
            - call: "POST /fit-program/catalog-items/${item_id}/list"
              payload: {}
              as: MerchOpsAdmin
            - call: "POST /fit-program/catalog-items"
              payload: { vendor_id: "${vendor_id}", sku: "NRTH-TEE-AUX-A", category_code: "TOPS", brand_size_system: "US_ALPHA", unit_price_cents: 2295 }
              as: MerchOpsAdmin
              captures: { item_a_id: $.data.id }
            - call: "POST /fit-program/catalog-items/${item_a_id}/list"
              payload: {}
              as: MerchOpsAdmin
            - call: "POST /fit-program/catalog-items"
              payload: { vendor_id: "${vendor_id}", sku: "NRTH-TEE-AUX-B", category_code: "TOPS", brand_size_system: "US_ALPHA", unit_price_cents: 2295 }
              as: MerchOpsAdmin
              captures: { item_b_id: $.data.id }
            - call: "POST /fit-program/catalog-items/${item_b_id}/list"
              payload: {}
              as: MerchOpsAdmin
            - call: "POST /fit-program/measurement-specs"
              payload:
                item_id: "${item_id}"
                size_system: "US_ALPHA"
                base_size_label: "M"
                fabric_stretch_class: "RIGID"
                size_points:
                  - { size_label: "XS", sort_index: 0, chest_mm: 800, waist_mm: 720, hip_mm: 840, inseam_mm: 700 }
                  - { size_label: "S",  sort_index: 1, chest_mm: 840, waist_mm: 760, hip_mm: 880, inseam_mm: 710 }
                  - { size_label: "M",  sort_index: 2, chest_mm: 880, waist_mm: 800, hip_mm: 920, inseam_mm: 720 }
                  - { size_label: "L",  sort_index: 3, chest_mm: 925, waist_mm: 845, hip_mm: 965, inseam_mm: 730 }
                  - { size_label: "XL", sort_index: 4, chest_mm: 965, waist_mm: 885, hip_mm: 1005, inseam_mm: 740 }
                grade_rules:
                  - { measurement_point: "CHEST", increment_mm: 40, tolerance_pct_bp: 1250, tolerance_abs_mm: 3 }
              as: VendorUser
              as_user_id: "${vendor_id}"
              captures: { spec_id: $.data.id }
            - call: "POST /fit-program/measurement-specs/${spec_id}/submit"
              payload: {}
              as: VendorUser
              as_user_id: "${vendor_id}"
            - call: "POST /fit-program/measurement-specs/${spec_id}/verify"
              payload: {}
              as: FitAnalyst
              as_user_id: "analyst-7"
            - call: "POST /fit-program/size-charts"
              payload:
                chart_code: "STD-TOPS-A1"
                size_system: "US_ALPHA"
                category_code: "TOPS"
                rows:
                  - { size_label: "XS", sort_index: 0, body_chest_min_mm: 780, body_chest_max_mm: 819, body_waist_min_mm: 700, body_waist_max_mm: 739, conversion_us_alpha: "XS", conversion_us_numeric: "0", conversion_eu: "32", conversion_uk: "4" }
                  - { size_label: "S",  sort_index: 1, body_chest_min_mm: 820, body_chest_max_mm: 859, body_waist_min_mm: 740, body_waist_max_mm: 779, conversion_us_alpha: "S",  conversion_us_numeric: "2", conversion_eu: "34", conversion_uk: "6" }
                  - { size_label: "M",  sort_index: 2, body_chest_min_mm: 860, body_chest_max_mm: 899, body_waist_min_mm: 780, body_waist_max_mm: 819, conversion_us_alpha: "M",  conversion_us_numeric: "4", conversion_eu: "36", conversion_uk: "8" }
                  - { size_label: "L",  sort_index: 3, body_chest_min_mm: 900, body_chest_max_mm: 944, body_waist_min_mm: 820, body_waist_max_mm: 864, conversion_us_alpha: "L",  conversion_us_numeric: "6", conversion_eu: "38", conversion_uk: "10" }
                  - { size_label: "XL", sort_index: 4, body_chest_min_mm: 945, body_chest_max_mm: 984, body_waist_min_mm: 865, body_waist_max_mm: 904, conversion_us_alpha: "XL", conversion_us_numeric: "8", conversion_eu: "40", conversion_uk: "12" }
              as: MerchOpsAdmin
              captures: { chart_id: $.data.id }
            - call: "POST /fit-program/size-charts/${chart_id}/standardize"
              payload: {}
              as: MerchOpsAdmin
            - call: "GET /fit-program/catalog-items/${item_id}"
              payload: {}
              as: MerchOpsAdmin
              captures: { item_ver: $.data.version }
            - call: "POST /fit-program/size-chart-mappings"
              payload:
                item_id: "${item_id}"
                chart_id: "${chart_id}"
                size_label_pairs:
                  - { spec_size_label: "S",  chart_size_label: "S" }
                  - { spec_size_label: "M",  chart_size_label: "M" }
                  - { spec_size_label: "L",  chart_size_label: "L" }
                  - { spec_size_label: "XL", chart_size_label: "XL" }
                expected_item_version: "${item_ver}"
              as: FitAnalyst
              as_user_id: "analyst-7"
              captures: { mapping_id: $.data.id }
            - call: "POST /fit-program/catalog-items/${item_id}/pdp-enhancement"
              payload: { model_measurements_published: true, detail_image_count: 3, model_height_cm: 178, model_worn_size_label: "M" }
              as: MerchOpsAdmin
            - call: "POST /fit-program/catalog-items/${item_id}/publish-guidance"
              payload: {}
              as: FitAnalyst
              as_user_id: "analyst-7"
            - call: "POST /fit-program/customer-profiles"
              payload: { email: "shopper-r1@example.com" }
              as: MerchOpsAdmin
              captures: { customer_id: $.data.id }
            - call: "POST /fit-program/return-policies"
              payload: { category_code: "TOPS", window_days: 30, restocking_applies: true, non_refundable_shipping: false, effective_from: "2026-01-01T00:00:00Z" }
              as: MerchOpsAdmin
              captures: { policy_id: $.data.id }
            - call: "POST /fit-program/order-lines"
              payload: { customer_profile_id: "${customer_id}", item_id: "${item_a_id}", size_label: "M", quantity: 1, unit_price_cents: 2295, shipping_allocated_cents: 0, delivered_at: "2026-05-20T00:00:00Z" }
              as: MerchOpsAdmin
              captures: { line_a_id: $.data.id }
            - call: "POST /fit-program/order-lines"
              payload: { customer_profile_id: "${customer_id}", item_id: "${item_b_id}", size_label: "S", quantity: 1, unit_price_cents: 2295, shipping_allocated_cents: 0, delivered_at: "2026-05-10T00:00:00Z" }
              as: MerchOpsAdmin
              captures: { line_b_id: $.data.id }
            - call: "POST /fit-program/return-cases"
              payload: { order_line_id: "${line_b_id}", requested_reason_code: "FIT_TOO_SMALL" }
              as: Customer
              as_user_id: "${customer_id}"
              captures: { case_b_id: $.data.id }
            - call: "POST /fit-program/return-cases/${case_b_id}/classify"
              payload: { reason_code: "FIT_TOO_SMALL" }
              as: ReturnsAuditor
              as_user_id: "auditor-1"
            - call: "POST /fit-program/return-cases/${case_b_id}/resolve"
              payload: { item_condition: "RESELLABLE_A" }
              as: ReturnsAuditor
              as_user_id: "auditor-2"
            - call: "POST /fit-program/fit-feedback"
              payload: { item_id: "${item_a_id}", customer_profile_id: "${customer_id}", purchased_size_label: "M", fit_verdict: "TOO_SMALL" }
              as: Customer
              as_user_id: "${customer_id}"
              captures: { fb_a_id: $.data.id }
            - call: "POST /fit-program/fit-feedback"
              payload: { item_id: "${item_b_id}", customer_profile_id: "${customer_id}", purchased_size_label: "S", fit_verdict: "SLIGHTLY_SMALL" }
              as: Customer
              as_user_id: "${customer_id}"
              captures: { fb_b_id: $.data.id }
          trigger:
            - call: "GET /fit-program/catalog-items/${item_id}/fit-recommendation"
              payload: { customer_profile_id: "${customer_id}" }
              as: Customer
              as_user_id: "${customer_id}"
              captures:
                h_variant: $.data.variant_applied
                h_label: $.data.recommended_size_label
                h_conf: $.data.confidence_bp
                h_sample: $.data.sample_count
                h_anchor: $.data.anchor_index
                h_recommended: $.data.recommended_index
                h_suppressed: $.data.suppressed
                h_coverage: $.data.coverage_bp
            - call: "GET /fit-program/catalog-items/${item_id}/fit-recommendation"
              payload: {}
              as: FitAnalyst
              as_user_id: "analyst-7"
              captures:
                p_variant: $.data.variant_applied
                p_label: $.data.recommended_size_label
                p_conf: $.data.confidence_bp
                p_sample: $.data.sample_count
                p_anchor: $.data.anchor_index
                p_recommended: $.data.recommended_index
                p_suppressed: $.data.suppressed
          assert:
            - "${h_variant} == \"history_weighted\""
            - "${h_sample} == 3"
            - "${h_anchor} == 2"
            - "${h_recommended} == 3"
            - "${h_label} == \"L\""
            - "${h_conf} == 6000"
            - "${h_suppressed} == false"
            - "${h_coverage} == 8000"
            - "${p_variant} == \"population_fallback\""
            - "${p_sample} == 0"
            - "${p_anchor} == 2"
            - "${p_recommended} == 2"
            - "${p_conf} == 1600"
            - "${p_suppressed} == true"
            - "${p_label} == null"
            - "FitFeedback.${fb_a_id}.signal_weight == 200"
            - "FitFeedback.${fb_b_id}.signal_weight == 200"
            - "SizeChartMapping.${mapping_id}.coverage_bp == 8000"
            - "SizeChartMapping.${mapping_id}.unmapped_size_labels == [\"XS\"]"

      - name: intervention_savings_attributed_vs_cohort_chronological_divergence
        grounds:
          - calculations.intervention_savings
          - calculations.deployment_window_rates
          - state_machines.InterventionDeployment.TERMINATED_to_MEASURED
          - entities.Intervention.fields.funding_posture
        distinguishing_aspect: |
          This instance's two variants live in the return-cost measurement domain (two
          InterventionDeployment windows on two different CatalogItems replayed against either
          their own snapshotted baselines or one running cohort baseline), and the divergence is
          observable on gross_savings_cents: 6400 under deployment_attributed versus 3200 under
          cohort_chronological for byte-identical stored data.
        test_recipe:
          setup:
            - "Logical clock starts at 2026-06-01T00:00:00Z; a TOPS category-default policy with a 30-day window exists."
            - "Two LISTED TOPS items, item A and item B, both from the same vendor."
            - "Pre-window history: item A has 2 delivered units and 1 RESOLVED_REFUNDED FIT return (baseline_return_rate_bp 5000); item B has 4 delivered units and 1 RESOLVED_REFUNDED FIT return (baseline_return_rate_bp 2500)."
            - "One PDP_MODEL_MEASUREMENTS intervention with deployment D1 on item A over [2026-07-01, 2026-08-01) spending 1500 and deployment D2 on item B over [2026-07-10, 2026-08-01) spending 1500."
            - "Both deployments are activated by ops-runs, then in-window sales are ingested: item A gets 2 units and no returns (measured_return_rate_bp 0); item B gets 8 units and 1 FIT return (measured_return_rate_bp 1250)."
            - "A final pair of ops-runs at 2026-08-01 terminates both deployments with WINDOW_ELAPSED and then measures both."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: MerchOpsAdmin
            - call: "POST /fit-program/vendors"
              payload: { name: "Cohort Mills", brand_code: "CHRT", correction_budget_cents: 10000 }
              as: MerchOpsAdmin
              captures: { vendor_id: $.data.id }
            - call: "POST /fit-program/catalog-items"
              payload: { vendor_id: "${vendor_id}", sku: "CHRT-A", category_code: "TOPS", brand_size_system: "US_ALPHA", unit_price_cents: 3000 }
              as: MerchOpsAdmin
              captures: { item_a_id: $.data.id }
            - call: "POST /fit-program/catalog-items/${item_a_id}/list"
              payload: {}
              as: MerchOpsAdmin
            - call: "POST /fit-program/catalog-items"
              payload: { vendor_id: "${vendor_id}", sku: "CHRT-B", category_code: "TOPS", brand_size_system: "US_ALPHA", unit_price_cents: 3000 }
              as: MerchOpsAdmin
              captures: { item_b_id: $.data.id }
            - call: "POST /fit-program/catalog-items/${item_b_id}/list"
              payload: {}
              as: MerchOpsAdmin
            - call: "POST /fit-program/return-policies"
              payload: { category_code: "TOPS", window_days: 30, restocking_applies: true, non_refundable_shipping: false, effective_from: "2026-01-01T00:00:00Z" }
              as: MerchOpsAdmin
            - call: "POST /fit-program/customer-profiles"
              payload: { email: "cohort-shopper@example.com" }
              as: MerchOpsAdmin
              captures: { customer_id: $.data.id }
            - call: "POST /fit-program/order-lines"
              payload: { customer_profile_id: "${customer_id}", item_id: "${item_a_id}", size_label: "M", quantity: 1, unit_price_cents: 3000, shipping_allocated_cents: 0, delivered_at: "2026-05-10T00:00:00Z" }
              as: MerchOpsAdmin
              captures: { a_pre_line_1: $.data.id }
            - call: "POST /fit-program/order-lines"
              payload: { customer_profile_id: "${customer_id}", item_id: "${item_a_id}", size_label: "M", quantity: 1, unit_price_cents: 3000, shipping_allocated_cents: 0, delivered_at: "2026-05-12T00:00:00Z" }
              as: MerchOpsAdmin
              captures: { a_pre_line_2: $.data.id }
            - call: "POST /fit-program/order-lines"
              payload: { customer_profile_id: "${customer_id}", item_id: "${item_b_id}", size_label: "M", quantity: 3, unit_price_cents: 3000, shipping_allocated_cents: 0, delivered_at: "2026-05-10T00:00:00Z" }
              as: MerchOpsAdmin
              captures: { b_pre_line_1: $.data.id }
            - call: "POST /fit-program/order-lines"
              payload: { customer_profile_id: "${customer_id}", item_id: "${item_b_id}", size_label: "M", quantity: 1, unit_price_cents: 3000, shipping_allocated_cents: 0, delivered_at: "2026-05-12T00:00:00Z" }
              as: MerchOpsAdmin
              captures: { b_pre_line_2: $.data.id }
            - call: "POST /fit-program/return-cases"
              payload: { order_line_id: "${a_pre_line_1}", requested_reason_code: "FIT_TOO_SMALL" }
              as: Customer
              as_user_id: "${customer_id}"
              captures: { a_pre_case: $.data.id }
            - call: "POST /fit-program/return-cases/${a_pre_case}/classify"
              payload: { reason_code: "FIT_TOO_SMALL" }
              as: ReturnsAuditor
              as_user_id: "auditor-1"
            - call: "POST /fit-program/return-cases/${a_pre_case}/resolve"
              payload: { item_condition: "RESELLABLE_A" }
              as: ReturnsAuditor
              as_user_id: "auditor-2"
            - call: "POST /fit-program/return-cases"
              payload: { order_line_id: "${b_pre_line_1}", requested_reason_code: "FIT_TOO_SMALL" }
              as: Customer
              as_user_id: "${customer_id}"
              captures: { b_pre_case: $.data.id }
            - call: "POST /fit-program/return-cases/${b_pre_case}/classify"
              payload: { reason_code: "FIT_TOO_SMALL" }
              as: ReturnsAuditor
              as_user_id: "auditor-1"
            - call: "POST /fit-program/return-cases/${b_pre_case}/resolve"
              payload: { item_condition: "RESELLABLE_A" }
              as: ReturnsAuditor
              as_user_id: "auditor-2"
            - call: "POST /fit-program/interventions"
              payload: { name: "PDP model measurements rollout", lever: "PDP_MODEL_MEASUREMENTS", unit_cost_cents: 1500 }
              as: MerchOpsAdmin
              captures: { intervention_id: $.data.id }
            - call: "POST /fit-program/intervention-deployments"
              payload: { intervention_id: "${intervention_id}", item_id: "${item_a_id}", window_start: "2026-07-01T00:00:00Z", window_end: "2026-08-01T00:00:00Z", spend_cents: 1500 }
              as: MerchOpsAdmin
              captures: { d1_id: $.data.id }
            - call: "POST /fit-program/intervention-deployments"
              payload: { intervention_id: "${intervention_id}", item_id: "${item_b_id}", window_start: "2026-07-10T00:00:00Z", window_end: "2026-08-01T00:00:00Z", spend_cents: 1500 }
              as: MerchOpsAdmin
              captures: { d2_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-02T00:00:00Z" }
              as: MerchOpsAdmin
            - call: "POST /fit-program/ops-runs"
              payload: {}
              as: MerchOpsAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-11T00:00:00Z" }
              as: MerchOpsAdmin
            - call: "POST /fit-program/ops-runs"
              payload: {}
              as: MerchOpsAdmin
            - call: "POST /fit-program/order-lines"
              payload: { customer_profile_id: "${customer_id}", item_id: "${item_a_id}", size_label: "M", quantity: 1, unit_price_cents: 3000, shipping_allocated_cents: 0, delivered_at: "2026-07-05T00:00:00Z" }
              as: MerchOpsAdmin
            - call: "POST /fit-program/order-lines"
              payload: { customer_profile_id: "${customer_id}", item_id: "${item_a_id}", size_label: "M", quantity: 1, unit_price_cents: 3000, shipping_allocated_cents: 0, delivered_at: "2026-07-06T00:00:00Z" }
              as: MerchOpsAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-20T00:00:00Z" }
              as: MerchOpsAdmin
            - call: "POST /fit-program/order-lines"
              payload: { customer_profile_id: "${customer_id}", item_id: "${item_b_id}", size_label: "M", quantity: 4, unit_price_cents: 3000, shipping_allocated_cents: 0, delivered_at: "2026-07-15T00:00:00Z" }
              as: MerchOpsAdmin
              captures: { b_win_line_1: $.data.id }
            - call: "POST /fit-program/order-lines"
              payload: { customer_profile_id: "${customer_id}", item_id: "${item_b_id}", size_label: "M", quantity: 4, unit_price_cents: 3000, shipping_allocated_cents: 0, delivered_at: "2026-07-16T00:00:00Z" }
              as: MerchOpsAdmin
            - call: "POST /fit-program/return-cases"
              payload: { order_line_id: "${b_win_line_1}", requested_reason_code: "FIT_TOO_SMALL" }
              as: Customer
              as_user_id: "${customer_id}"
              captures: { b_win_case: $.data.id }
            - call: "POST /fit-program/return-cases/${b_win_case}/classify"
              payload: { reason_code: "FIT_TOO_SMALL" }
              as: ReturnsAuditor
              as_user_id: "auditor-1"
            - call: "POST /fit-program/return-cases/${b_win_case}/resolve"
              payload: { item_condition: "RESELLABLE_A" }
              as: ReturnsAuditor
              as_user_id: "auditor-2"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T00:00:00Z" }
              as: MerchOpsAdmin
            - call: "POST /fit-program/ops-runs"
              payload: {}
              as: MerchOpsAdmin
            - call: "POST /fit-program/ops-runs"
              payload: {}
              as: MerchOpsAdmin
          trigger:
            - call: "GET /fit-program/interventions/${intervention_id}/savings-report"
              payload: {}
              as: FitAnalyst
              as_user_id: "analyst-7"
              captures:
                att_variant: $.data.variant_applied
                att_gross: $.data.gross_savings_cents
                att_spend: $.data.spend_cents
                att_net: $.data.net_savings_cents
                att_measured: $.data.measured_deployment_count
                att_avoided: $.data.avoided_return_count
                att_posture: $.data.funding_posture
            - call: "GET /fit-program/interventions/${intervention_id}/savings-report"
              payload: { variant: "cohort_chronological" }
              as: FitAnalyst
              as_user_id: "analyst-7"
              captures:
                coh_variant: $.data.variant_applied
                coh_gross: $.data.gross_savings_cents
                coh_spend: $.data.spend_cents
                coh_net: $.data.net_savings_cents
                coh_avoided: $.data.avoided_return_count
                coh_posture: $.data.funding_posture
          assert:
            - "InterventionDeployment.${d1_id}.status == \"MEASURED\""
            - "InterventionDeployment.${d1_id}.baseline_units_count == 2"
            - "InterventionDeployment.${d1_id}.baseline_return_rate_bp == 5000"
            - "InterventionDeployment.${d1_id}.window_units_count == 2"
            - "InterventionDeployment.${d1_id}.measured_return_rate_bp == 0"
            - "InterventionDeployment.${d1_id}.avoided_return_count == 1"
            - "InterventionDeployment.${d1_id}.attributed_savings_cents == 3200"
            - "InterventionDeployment.${d2_id}.baseline_units_count == 4"
            - "InterventionDeployment.${d2_id}.baseline_return_rate_bp == 2500"
            - "InterventionDeployment.${d2_id}.window_units_count == 8"
            - "InterventionDeployment.${d2_id}.measured_return_rate_bp == 1250"
            - "InterventionDeployment.${d2_id}.avoided_return_count == 1"
