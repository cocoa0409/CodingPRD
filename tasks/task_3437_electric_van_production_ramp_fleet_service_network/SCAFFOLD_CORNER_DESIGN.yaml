  # ===========================================================================
  - section: rbac
    instances:

      - name: quality_inspector_cannot_register_vehicle_forbidden
        claim_type: RBAC denial
        grounds:
          - roles.QualityInspector
          - roles.ProductionPlanner
          - "errors[ERR_FORBIDDEN]"
        distinguishing_aspect: "Peer-role isolation: POST /evfleet/vehicles is exclusive to ProductionPlanner; a QualityInspector caller gets 403 ERR_FORBIDDEN even with a perfectly valid payload."
        test_recipe:
          setup:
            - "Logical clock set; base order CONFIRMED with a PASSED module."
          setup_api_calls:
            - *c_clock
            - *c_cust
            - *c_depot
            - *c_sup
            - *c_mod1
            - *c_mod1_qa
            - *c_mod1_pass
            - *c_order
            - *c_submit
            - *c_confirm
          trigger:
            - call: "POST /evfleet/vehicles"
              payload: { vehicle_order_id: "${ord_id}", battery_module_id: "${mod1_id}", vin: "VIN-ACME-901", expected_vehicle_order_version: "${ord_v}" }
              as: QualityInspector
              as_user_id: "qi-1"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_FORBIDDEN (role check at priority 2 precedes all business logic)"
            - "VehicleOrder.${ord_id}.registered_count stays 0; module stays PASSED"

      - name: entity_backed_fleet_manager_identity_binds_customer
        claim_type: RBAC positive
        grounds:
          - roles.FleetManager
        distinguishing_aspect: "entity_backed identity: for role FleetManager the X-User-ID IS the FleetCustomer id — the depot created with as_user_id == customer id persists fleet_customer_id equal to it."
        test_recipe:
          setup:
            - "Logical clock set; customer exists."
          setup_api_calls:
            - *c_clock
            - *c_cust
          trigger:
            - call: "POST /evfleet/depots"
              payload: { fleet_customer_id: "${cust_id}", name: "Identity Depot", state_code: "OR", address: "11 Bind Rd", total_capacity_kw: 250 }
              as: FleetManager
              as_user_id: "${cust_id}"
              captures: { d_id: $.data.id, d_fk: $.data.fleet_customer_id }
          assert:
            - "status 201 and d_fk == ${cust_id} (the entity-backed X-User-ID binds the row)"
            - "GET /evfleet/depots/${d_id} as FleetManager ${cust_id} returns the same row"

      - name: module_registrar_cannot_inspect_own_module
        claim_type: Segregation of duties
        grounds:
          - validations[priority=7]
          - state_machines.BatteryModule.REGISTERED_to_IN_QA
          - "errors[ERR_SEGREGATION_VIOLATION]"
        distinguishing_aspect: "Segregation of duties on the quality gate: the QualityInspector role may inspect, but when the caller's X-User-ID equals the module's registered_by_user_id the inspection is 403 ERR_SEGREGATION_VIOLATION; a different inspector succeeds."
        test_recipe:
          setup:
            - "Logical clock set; supplier and module registered by ProductionPlanner pp-1."
          setup_api_calls:
            - *c_clock
            - *c_sup
            - *c_mod1
          trigger:
            - call: "POST /evfleet/battery-modules/${mod1_id}/transition"
              payload: { to_state: "IN_QA" }
              as: QualityInspector
              as_user_id: "pp-1"
              captures: { err: $.data.error_id }
            - *c_mod1_qa
          assert:
            - "err == ERR_SEGREGATION_VIOLATION (X-User-ID pp-1 == registered_by_user_id pp-1, even though the role is QualityInspector)"
            - "the follow-up by qi-1 succeeds: BatteryModule.${mod1_id}.quality_status == IN_QA with last_inspector_user_id == \"qi-1\""

      - name: claim_diagnostician_cannot_adjudicate_own_claim
        claim_type: Segregation of duties
        grounds:
          - validations[priority=7]
          - state_machines.WarrantyClaim.DIAGNOSED_to_SETTLED
          - "errors[ERR_SEGREGATION_VIOLATION]"
        distinguishing_aspect: "Segregation of duties on the money path: the claim diagnosed by st-1 rejects adjudication from an adjuster whose X-User-ID is st-1; a distinct adjuster ca-1 settles it."
        test_recipe:
          setup:
            - "Logical clock set; vehicle 1 COMMISSIONED; claim created and diagnosed by technician st-1."
          setup_api_calls:
            - *c_clock
            - *c_cust
            - *c_depot
            - *c_sup
            - *c_mod1
            - *c_mod1_qa
            - *c_mod1_pass
            - *c_mod2
            - *c_mod2_qa
            - *c_mod2_pass
            - *c_order
            - *c_submit
            - *c_confirm
            - *c_veh1
            - *c_read1
            - *c_veh2
            - *c_t1p
            - *c_t1a
            - *c_d1t
            - *c_d1d
            - *c_d1c
            - call: "POST /evfleet/warranty-claims"
              payload: { vehicle_id: "${veh1_id}", claim_lines: [ { component_class: "POWERTRAIN", part_cost_cents: 50000, labor_hours: 2.0 } ] }
              as: FleetManager
              as_user_id: "${cust_id}"
              captures: { claim_id: $.data.id }
            - call: "POST /evfleet/warranty-claims/${claim_id}/diagnose"
              payload: { diagnosis_notes: "Inverter fault confirmed on bench." }
              as: ServiceTechnician
              as_user_id: "st-1"
          trigger:
            - call: "POST /evfleet/warranty-claims/${claim_id}/adjudicate"
              payload: { decision: "APPROVE" }
              as: ClaimsAdjuster
              as_user_id: "st-1"
              captures: { err: $.data.error_id }
            - call: "POST /evfleet/warranty-claims/${claim_id}/adjudicate"
              payload: { decision: "APPROVE" }
              as: ClaimsAdjuster
              as_user_id: "ca-1"
              captures: { st: $.data.status, settle: $.data.settlement_cents }
          assert:
            - "err == ERR_SEGREGATION_VIOLATION (adjudicator id equals diagnosed_by_user_id)"
            - "st == SETTLED and settle == 60000 (part 50000 x 1.0 + labor 2.0 x 17500 x 1.0 = 85000, minus the single 25000 deductible)"

      - name: supplier_registrar_cannot_audit_own_supplier
        claim_type: Segregation of duties
        grounds:
          - validations[priority=7]
          - entities.Supplier.fields.created_by_user_id
          - "errors[ERR_SEGREGATION_VIOLATION]"
        distinguishing_aspect: "Segregation of duties on supplier readiness: the audit from an X-User-ID equal to the supplier's created_by_user_id is 403 ERR_SEGREGATION_VIOLATION; a different auditor computes the tier normally."
        test_recipe:
          setup:
            - "Logical clock set; supplier registered by ProductionPlanner pp-1."
          setup_api_calls:
            - *c_clock
            - *c_sup
          trigger:
            - call: "POST /evfleet/suppliers/${sup_id}/readiness-audits"
              payload: { on_time_pct: 96.0, first_pass_yield_pct: 99.0, open_corrective_actions: 0 }
              as: QualityInspector
              as_user_id: "pp-1"
              captures: { err: $.data.error_id }
            - call: "POST /evfleet/suppliers/${sup_id}/readiness-audits"
              payload: { on_time_pct: 96.0, first_pass_yield_pct: 99.0, open_corrective_actions: 0 }
              as: QualityInspector
              as_user_id: "qi-1"
              captures: { tier: $.data.readiness_tier }
          assert:
            - "err == ERR_SEGREGATION_VIOLATION for the registrar-auditor"
            - "tier == A after the clean audit (96.0 >= 95.0, 99.0 >= 98.0, 0 corrective)"

  # ===========================================================================
  - section: complexity_layers
    instances:

      - name: depot_version_increments_on_cascaded_transition_writes
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[charging-project-create-stale-depot]
          - endpoints.POST_/evfleet/charging-projects/{id}/transition
        distinguishing_aspect: "The OCC parent version moves on every write including cascaded side effects: create bumps Depot.version 1 -> 2, and each project transition (a cascade onto the depot) bumps it again — a create replaying version 2 after one transition fails 412."
        test_recipe:
          setup:
            - "Logical clock set; customer, depot (version 1); project P created (depot now version 2); P advanced SURVEY -> UTILITY_REVIEW (depot now version 3)."
          setup_api_calls:
            - *c_clock
            - *c_cust
            - *c_depot
            - call: "POST /evfleet/charging-projects"
              payload: { depot_id: "${depot_id}", requested_capacity_kw: 40, install_window_start: "2026-10-01T00:00:00Z", install_window_end: "2026-10-10T00:00:00Z", crew_count: 1, expected_depot_version: "${depot_v}" }
              as: FleetManager
              as_user_id: "${cust_id}"
              captures: { cp_id: $.data.id }
            - call: "GET /evfleet/depots/${depot_id}"
              payload: {}
              as: FleetManager
              as_user_id: "${cust_id}"
              captures: { depot_v2: $.data.version }
            - call: "POST /evfleet/charging-projects/${cp_id}/transition"
              payload: { to_state: "UTILITY_REVIEW" }
              as: ChargingCoordinator
              as_user_id: "cc-1"
          trigger:
            - call: "POST /evfleet/charging-projects"
              payload: { depot_id: "${depot_id}", requested_capacity_kw: 30, install_window_start: "2026-11-01T00:00:00Z", install_window_end: "2026-11-08T00:00:00Z", crew_count: 1, expected_depot_version: "${depot_v2}" }
              as: FleetManager
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
            - call: "GET /evfleet/depots/${depot_id}"
              payload: {}
              as: FleetManager
              as_user_id: "${cust_id}"
              captures: { depot_v_now: $.data.version }
          assert:
            - "err == ERR_STALE_VERSION (the UTILITY_REVIEW transition bumped the depot 2 -> 3, so the replayed version 2 is stale)"
            - "depot_v_now == 3 (exactly one version bump per accepted write, cascades included)"

      - name: downtime_append_with_stale_contract_version_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[downtime-append-stale-contract]
          - "errors[ERR_STALE_VERSION]"
        distinguishing_aspect: "OCC on UptimeContract.version: after a first downtime append bumps the contract, replaying the pre-append version on a second append fails 412."
        test_recipe:
          setup:
            - "Logical clock set; vehicle 1 COMMISSIONED; contract created (version captured); one downtime event appended (version advanced)."
          setup_api_calls:
            - *c_clock
            - *c_cust
            - *c_depot
            - *c_sup
            - *c_mod1
            - *c_mod1_qa
            - *c_mod1_pass
            - *c_mod2
            - *c_mod2_qa
            - *c_mod2_pass
            - *c_order
            - *c_submit
            - *c_confirm
            - *c_veh1
            - *c_read1
            - *c_veh2
            - *c_t1p
            - *c_t1a
            - *c_d1t
            - *c_d1d
            - *c_d1c
            - call: "POST /evfleet/uptime-contracts"
              payload: { fleet_customer_id: "${cust_id}", committed_uptime_pct: 97.0, monthly_service_fee_cents: 2000000, pro_rating: "ROUTE_DAY", measurement_start_date: "2026-09-01" }
              as: PlatformAdmin
              captures: { uc_id: $.data.id, uc_v: $.data.version }
            - call: "POST /evfleet/uptime-contracts/${uc_id}/downtime-events"
              payload: { vehicle_id: "${veh1_id}", started_at: "2026-09-05T08:00:00Z", ended_at: "2026-09-05T12:00:00Z", expected_uptime_contract_version: "${uc_v}" }
              as: TelematicsIngestion
          trigger:
            - call: "POST /evfleet/uptime-contracts/${uc_id}/downtime-events"
              payload: { vehicle_id: "${veh1_id}", started_at: "2026-09-06T08:00:00Z", ended_at: "2026-09-06T09:00:00Z", expected_uptime_contract_version: "${uc_v}" }
              as: TelematicsIngestion
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_STALE_VERSION (412) — the first append advanced the contract version"
            - "GET /evfleet/fleet-customers/${cust_id}/uptime-contracts shows the contract with exactly 1 downtime event"

      - name: downgrade_cascade_noop_without_matching_children
        claim_type: cascading_side_effects
        grounds:
          - endpoints.POST_/evfleet/suppliers/{id}/readiness-audits
          - state_machines.BatteryModule.REGISTERED_to_QUARANTINED
        distinguishing_aspect: "Conditional cascade over empty sets: a drop to tier C with no modules and no CONFIRMED/IN_PRODUCTION orders referencing the supplier succeeds cleanly — tier flips, nothing else changes, no error."
        test_recipe:
          setup:
            - "Logical clock set; supplier registered, never audited; no modules, no orders."
          setup_api_calls:
            - *c_clock
            - *c_sup
          trigger:
            - call: "POST /evfleet/suppliers/${sup_id}/readiness-audits"
              payload: { on_time_pct: 40.0, first_pass_yield_pct: 50.0, open_corrective_actions: 7 }
              as: QualityInspector
              as_user_id: "qi-1"
              captures: { tier: $.data.readiness_tier }
          assert:
            - "tier == C and status 200 (cascade over empty module and order sets is a no-op, not an error)"
            - "GET /evfleet/suppliers/${sup_id}/battery-modules returns 0 rows"

      - name: restock_flag_stays_false_above_threshold
        claim_type: rate_threshold_triggers
        grounds:
          - entities.PartsStock.fields.restock_needed
          - state_machines.ServiceVisit.IN_PROGRESS_to_COMPLETED
        distinguishing_aspect: "Threshold non-trigger branch: consuming 1 of 5 units leaves on_hand 4 >= reorder_threshold 1, so restock_needed stays false — the flag flips only on a strict below-threshold crossing."
        test_recipe:
          setup:
            - "Logical clock set; vehicle 1 COMMISSIONED; center SC with BRK-1 stock 5, threshold 1; visit with 1 x BRK-1 moved to IN_PROGRESS."
          setup_api_calls:
            - *c_clock
            - *c_cust
            - *c_depot
            - *c_sup
            - *c_mod1
            - *c_mod1_qa
            - *c_mod1_pass
            - *c_mod2
            - *c_mod2_qa
            - *c_mod2_pass
            - *c_order
            - *c_submit
            - *c_confirm
            - *c_veh1
            - *c_read1
            - *c_veh2
            - *c_t1p
            - *c_t1a
            - *c_d1t
            - *c_d1d
            - *c_d1c
            - *c_sc
            - call: "POST /evfleet/parts-stocks"
              payload: { service_center_id: "${sc_id}", sku: "BRK-1", qty_delta: 5, reorder_threshold: 1 }
              as: ServiceDispatcher
              as_user_id: "sd-1"
            - call: "POST /evfleet/service-visits"
              payload: { vehicle_id: "${veh1_id}", service_center_id: "${sc_id}", window_start: "2026-09-10T09:00:00Z", window_end: "2026-09-10T10:00:00Z", purpose: "MAINTENANCE", parts_lines: [ { sku: "BRK-1", qty: 1 } ] }
              as: FleetManager
              as_user_id: "${cust_id}"
              captures: { visit_id: $.data.id }
            - call: "POST /evfleet/service-visits/${visit_id}/transition"
              payload: { to_state: "IN_PROGRESS" }
              as: ServiceTechnician
              as_user_id: "st-1"
          trigger:
            - call: "POST /evfleet/service-visits/${visit_id}/transition"
              payload: { to_state: "COMPLETED" }
              as: ServiceTechnician
              as_user_id: "st-1"
            - call: "GET /evfleet/service-centers/${sc_id}/parts-stocks"
              payload: {}
              as: ServiceDispatcher
              as_user_id: "sd-1"
              captures: { on_hand: "$.data[0].on_hand_qty", restock: "$.data[0].restock_needed" }
          assert:
            - "on_hand == 4 and restock == false (4 < 1 is false — strict inequality on the threshold)"

      - name: derived_hold_count_reconciliation
        claim_type: derived_field_reconciliation
        grounds:
          - entities.VehicleOrder.fields.hold_count
        excluded_because:
          difficulty_instance: campaign_rollback_recalls_vehicles_and_recomputes_order_hold_count
          rationale: "hold_count recompute from child vehicle mutations is asserted (== 1) in the named §1.8 cascade instance."

  # ===========================================================================
  - section: consistency_model
    instances:

      - name: registration_side_effects_visible_immediately
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints.POST_/evfleet/vehicles
        distinguishing_aspect: "Immediate consistency: in the very next reads after POST /vehicles, the module shows ALLOCATED and the order shows registered_count 1 / IN_PRODUCTION — no delay, no reconciliation window."
        test_recipe:
