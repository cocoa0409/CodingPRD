              as_user_id: "${prop_id}"
          assert:
            - "the trigger returns HTTP 422 with error_id ERR_AREA_MISMATCH"
            - "SelfAssessmentSweep.${sw_id}.generated_work_order_count == 0"
            - "Unit.${u1_id}.open_deficiency_count == 0"

      - name: unit_deficiency_accepted_once_the_slot_grants_access
        claim_type: satisfaction_to_pass
        grounds:
          - validations[priority=60]
          - state_machines.Inspection.IN_PROGRESS_to_IN_PROGRESS
          - entities.Deficiency.fields.inspection_version_after_record
        distinguishing_aspect: |
          The mirror image of the priority-60 denial: with the slot at GRANTED the same call must
          succeed, deduct 16.00 (8.00 x 2.0 SEVERE x 1.0 UNIT) and hand back the post-cascade parent
          version in inspection_version_after_record, which is what later OCC writes chain on.
        test_recipe:
          setup:
            - "ADOPTED NSPIRE-2026 with LT_GAS and SEV_WINDOW; Property Cedar Walk (total_unit_count 1) with unit 101."
            - "The slot is noticed, the inspection is IN_PROGRESS and access is GRANTED."
          setup_api_calls:
