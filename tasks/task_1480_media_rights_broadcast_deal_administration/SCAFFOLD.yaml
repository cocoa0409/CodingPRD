errors:
- id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
  http: 400
  condition: X-User-ID or X-User-Role header missing or malformed
- id: ERR_INSUFFICIENT_PERMISSIONS
  http: 403
  condition: Role not authorized for this endpoint per §1.7
- id: ERR_ASSET_NOT_FOUND
  http: 404
  condition: RightsAsset id not found
- id: ERR_BROADCASTER_NOT_FOUND
  http: 404
  condition: Broadcaster id not found
- id: ERR_PACKAGE_NOT_FOUND
  http: 404
  condition: RightsPackage id not found
- id: ERR_BID_NOT_FOUND
  http: 404
  condition: Bid id not found
- id: ERR_DEAL_NOT_FOUND
  http: 404
  condition: Deal id not found
- id: ERR_MILESTONE_NOT_FOUND
  http: 404
  condition: PaymentMilestone id not found
- id: ERR_OBLIGATION_NOT_FOUND
  http: 404
  condition: ProductionObligation id not found
- id: ERR_EVENT_NOT_FOUND
  http: 404
  condition: BroadcastEvent id not found
- id: ERR_MEASUREMENT_NOT_FOUND
  http: 404
  condition: AudienceMeasurement id not found
- id: ERR_SUBLICENSE_NOT_FOUND
  http: 404
  condition: SublicenseRequest id not found
- id: ERR_BLACKOUT_NOT_FOUND
  http: 404
  condition: BlackoutWindow id not found
- id: ERR_RENEWAL_OFFER_NOT_FOUND
  http: 404
  condition: RenewalOffer id not found
- id: ERR_RIGHTS_CONFLICT_NOT_FOUND
  http: 404
  condition: RightsConflict id not found
- id: ERR_ASSET_NOT_OPEN
  http: 409
  condition: lock-packages requires asset OPEN
- id: ERR_ASSET_NOT_LOCKED
  http: 409
  condition: close-awards requires asset PACKAGES_LOCKED
- id: ERR_ASSET_NOT_AWARD_CLOSED
  http: 409
  condition: retire requires asset AWARD_CLOSED
- id: ERR_PACKAGE_DEFINITION_INVALID
  http: 422
  condition: Package field validation failed at lock-packages time
- id: ERR_PACKAGE_NOT_NEGOTIATING
  http: 409
  condition: Accept requires package UNDER_NEGOTIATION
- id: ERR_PACKAGE_NOT_ACCEPTING_BIDS
  http: 409
  condition: Bid submit requires package OPEN_FOR_BIDS or UNDER_NEGOTIATION
- id: ERR_PACKAGE_NOT_WITHDRAWABLE
  http: 409
  condition: Withdraw requires OPEN_FOR_BIDS or UNDER_NEGOTIATION
- id: ERR_PACKAGE_ALREADY_AWARDED
  http: 409
  condition: Another bid has already been accepted on this package
- id: ERR_UNRESOLVED_PACKAGES_EXIST
  http: 409
  condition: close-awards requires every package AWARDED or WITHDRAWN
- id: ERR_BROADCASTER_NOT_REGISTERED
  http: 409
  condition: Accredit requires REGISTERED
- id: ERR_BROADCASTER_UNRATED
  http: 422
  condition: Accreditation requires credit_rating != UNRATED
- id: ERR_BROADCASTER_NOT_ACCREDITED
  http: 409
  condition: Action requires broadcaster ACCREDITED
- id: ERR_BROADCASTER_NOT_SUSPENDED
  http: 409
  condition: Reinstate or bar requires broadcaster SUSPENDED
- id: ERR_NO_BREACH_DEAL
  http: 422
  condition: Bar requires at least one TERMINATED_BREACH deal for this broadcaster
- id: ERR_BID_NOT_DRAFT
  http: 409
  condition: Submit requires bid DRAFT
- id: ERR_BID_NOT_SUBMITTED
  http: 409
  condition: start-review requires bid SUBMITTED
- id: ERR_BID_NOT_UNDER_REVIEW
  http: 409
  condition: shortlist requires bid UNDER_REVIEW
- id: ERR_BID_NOT_SHORTLISTED
  http: 409
  condition: counter or accept requires bid SHORTLISTED
- id: ERR_BID_NOT_REJECTABLE
  http: 409
  condition: reject requires bid in UNDER_REVIEW, SHORTLISTED, or COUNTERED
- id: ERR_BID_NOT_WITHDRAWABLE
  http: 409
  condition: withdraw requires bid in DRAFT, SUBMITTED, UNDER_REVIEW, SHORTLISTED,
    or COUNTERED
- id: ERR_DEAL_NOT_DRAFT
  http: 409
  condition: Execute requires deal DRAFT
- id: ERR_DEAL_NOT_LIVE
  http: 409
  condition: Milestone invoice requires deal EXECUTED or ACTIVE
- id: ERR_DEAL_NOT_ACTIVE
  http: 409
  condition: Action requires deal ACTIVE
- id: ERR_DEAL_FROZEN
  http: 409
  condition: Action requires deal.posture != FROZEN
- id: ERR_DEALS_STILL_ACTIVE
  http: 409
  condition: Asset retire requires all deals terminal
- id: ERR_INVALID_TERM
  http: 422
  condition: Deal term invalid (term_start >= term_end)
- id: ERR_NO_PAYMENT_SCHEDULE
  http: 422
  condition: Execute requires at least one PaymentMilestone
- id: ERR_NO_PRODUCTION_OBLIGATION
  http: 422
  condition: Execute requires at least one ProductionObligation
- id: ERR_UNRESOLVED_RIGHTS_CONFLICT
  http: 409
  condition: Execute blocked by unresolved RightsConflict rows
- id: ERR_MILESTONE_NOT_SCHEDULED
  http: 409
  condition: Invoice requires milestone SCHEDULED
- id: ERR_OBLIGATION_NOT_TRACKING
  http: 409
  condition: Mark-delivered requires obligation TRACKING
- id: ERR_EVENT_NOT_DELIVERED
  http: 409
  condition: Confirm measurement requires event DELIVERED
- id: ERR_NO_SHORTFALL
  http: 422
  condition: Declare-shortfall requires games_delivered < games_required
- id: ERR_RENEWAL_WINDOW_NOT_OPEN
  http: 409
  condition: Open-renewal requires clock within renewal window
- id: ERR_DEAL_ALREADY_EXPIRED
  http: 409
  condition: Open-renewal requires clock < term_end
- id: ERR_MATCHING_WINDOW_EXPIRED
  http: 409
  condition: Match requires clock <= matching_window_end
- id: ERR_MATCHING_WINDOW_ACTIVE
  http: 409
  condition: Exercise of third-party offer requires MATCHED status or expired matching
    window
- id: ERR_DEFAULT_GRACE_NOT_ELAPSED
  http: 409
  condition: Declare-default requires clock >= due_date + DEFAULT_GRACE_DAYS
- id: ERR_REVOKE_CONDITION_NOT_MET
  http: 409
  condition: Revoke requires termination or covering blackout
- id: ERR_BID_BELOW_FLOOR
  http: 422
  condition: offered_fee_cents < package.minimum_bid_cents
- id: ERR_COMMITMENT_BELOW_PACKAGE
  http: 422
  condition: production_commitment_games < package.games_committed
- id: ERR_BIDDER_NOT_GRADE_FOR_BROADER
  http: 422
  condition: exclusivity_request == BROADER requires INVESTMENT_GRADE credit_rating
- id: ERR_BLACKOUT_VIOLATION
  http: 409
  condition: Sublicense window intersects blackout window
- id: ERR_SUBLICENSE_WINDOW_OUTSIDE_PACKAGE
  http: 422
  condition: Sublicense window not strict subset of parent package window
- id: ERR_SUBLICENSE_OVERLAP
  http: 409
  condition: Another APPROVED sublicense overlaps (territory, platform, window)
- id: ERR_OUTSTANDING_DELINQUENCY
  http: 409
  condition: Terminate-convenience requires zero overdue milestones
- id: ERR_BREACH_CONDITION_NOT_MET
  http: 409
  condition: Terminate-breach requires payment_delinquency_count >= BREACH_THRESHOLD
    or posture FROZEN
- id: ERR_INVALID_REQUEST
  http: 400
  condition: Generic request validation failure (missing/invalid field)
- id: ERR_STALE_DEAL_VERSION
  http: 412
  condition: expected_deal_version does not match current Deal.version
- id: ERR_STALE_PACKAGE_VERSION
  http: 412
  condition: expected_package_version does not match current RightsPackage.version
roles:
- name: RightsManager
  description: League media rights office manager; owns asset lifecycle, package definition,
    bid acceptance, deal execution/termination, sublicense approval
  identity: opaque
  exclusive_operations:
  - POST /rights-assets — create asset
  - POST /rights-assets/{id}/lock-packages
  - POST /rights-assets/{id}/close-awards
  - POST /rights-assets/{id}/retire
  - POST /broadcasters — register broadcaster
  - POST /broadcasters/{id}/accredit
  - POST /rights-assets/{id}/packages — create package
  - POST /rights-assets/{id}/packages/{id}/withdraw
  - POST /rights-assets/{id}/packages/{id}/bids/{id}/start-review
  - POST /rights-assets/{id}/packages/{id}/bids/{id}/shortlist
  - POST /rights-assets/{id}/packages/{id}/bids/{id}/counter
  - POST /rights-assets/{id}/packages/{id}/bids/{id}/reject
  - POST /rights-assets/{id}/packages/{id}/bids/{id}/accept
  - POST /rights-assets/{id}/deals/{id}/execute
  - POST /rights-assets/{id}/deals/{id}/open-renewal
  - POST /rights-assets/{id}/deals/{id}/terminate-convenience
  - POST /rights-assets/{id}/deals/{id}/production-obligations/{id}/forgive-credit
  - POST /rights-assets/{id}/deals/{id}/sublicense-requests/{id}/approve
  - POST /rights-assets/{id}/deals/{id}/sublicense-requests/{id}/reject
  - POST /rights-assets/{id}/deals/{id}/renewal-offers/{id}/exercise
  - POST /rights-assets/{id}/deals/{id}/broadcast-events/{id}/cancel-by-league
  - POST /_clock/set_current_utc
  shared_operations:
  - GET endpoints (all)
- name: BidCoordinator
  description: Broadcaster-side bid submitter and sublicense filer; identity binds
    to the Broadcaster entity when acting on a bid/sublicense/renewal
  identity: entity_backed:Broadcaster
  exclusive_operations:
  - POST /rights-assets/{id}/packages/{id}/bids — file bid
  - POST /rights-assets/{id}/packages/{id}/bids/{id}/submit
  - POST /rights-assets/{id}/packages/{id}/bids/{id}/withdraw
  - POST /rights-assets/{id}/deals/{id}/sublicense-requests — file sublicense
  - POST /rights-assets/{id}/deals/{id}/renewal-offers — file renewal offer
  - POST /rights-assets/{id}/deals/{id}/renewal-offers/{id}/match
  - POST /rights-assets/{id}/deals/{id}/renewal-offers/{id}/withdraw
