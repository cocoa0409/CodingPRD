scaffold_corner_design:
  # ==================================================================
  # Section: entities
  # ==================================================================
  - section: entities
    instances:
      - name: customer_creation_defaults_applied
        claim_type: defaults
        grounds: [entities.Customer.fields.risk_score, entities.Customer.fields.tax_exempt, entities.Customer.fields.credit_limit_cents]
        distinguishing_aspect: "Omitting optional fields yields defaults: risk_score 700, tax_exempt false, credit_limit_cents 0, version 1."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - call: "POST /piano-dealer/customers"
              payload: { full_name: "Dana Default", email: "dana@x.com", customer_type: "INDIVIDUAL" }
              as: SalesAssociate
              captures: { c_id: $.data.id }
          trigger:
            - call: "GET /piano-dealer/customers/${c_id}"
              as: SalesAssociate
          assert:
            - "Customer.${c_id}.risk_score == 700"
            - "Customer.${c_id}.tax_exempt == false"
            - "Customer.${c_id}.credit_limit_cents == 0"
            - "Customer.${c_id}.version == 1"

      - name: instrument_missing_required_serial_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.Instrument.fields.serial_number, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required field serial_number on intake is rejected with ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /piano-dealer/instruments"
              payload: { category: "GRAND", manufacturer: "Steinway", model: "B", year_built: 2020, condition_grade: "GOOD", acquisition_type: "NEW", list_price_cents: 500000, floor_price_cents: 400000 }
              as: StoreManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST"

      - name: instrument_invalid_enum_returns_invalid_request
        claim_type: type_constraints
        grounds: [entities.Instrument.fields.category, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "category outside {GRAND, UPRIGHT, DIGITAL, HYBRID} is rejected with ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /piano-dealer/instruments"
              payload: { serial_number: "SN-X-ENUM", category: "SQUARE", manufacturer: "Steinway", model: "B", year_built: 2020, condition_grade: "GOOD", acquisition_type: "NEW", list_price_cents: 500000, floor_price_cents: 400000 }
              as: StoreManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST"

      - name: instrument_duplicate_serial_rejected
        claim_type: type_constraints
        grounds: ["validations[priority=8]", "errors[ERR_DUPLICATE_SERIAL]"]
        distinguishing_aspect: "serial_number is globally unique: the second intake with the same serial fails with ERR_DUPLICATE_SERIAL."
        test_recipe:
          setup: ["One instrument with serial_number SN-DUP-1 already intaken"]
          setup_api_calls:
            - call: "POST /piano-dealer/instruments"
              payload: { serial_number: "SN-DUP-1", category: "UPRIGHT", manufacturer: "Yamaha", model: "U1", year_built: 2020, condition_grade: "GOOD", acquisition_type: "NEW", list_price_cents: 300000, floor_price_cents: 200000 }
              as: StoreManager
              captures: { i_id: $.data.id }
          trigger:
            - call: "POST /piano-dealer/instruments"
              payload: { serial_number: "SN-DUP-1", category: "GRAND", manufacturer: "Steinway", model: "D", year_built: 2021, condition_grade: "EXCELLENT", acquisition_type: "NEW", list_price_cents: 900000, floor_price_cents: 700000 }
              as: StoreManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_DUPLICATE_SERIAL"
            - "Instrument.${i_id} unchanged (version == 1)"

      - name: consignment_without_consignor_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.Instrument.fields.consignor_id, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "acquisition_type CONSIGNMENT without consignor_id violates the conditional-required rule (ERR_INVALID_REQUEST)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /piano-dealer/instruments"
              payload: { serial_number: "SN-CONS-1", category: "GRAND", manufacturer: "Steinway", model: "B", year_built: 2015, condition_grade: "FAIR", acquisition_type: "CONSIGNMENT", list_price_cents: 800000, floor_price_cents: 600000 }
              as: StoreManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST"

      - name: institutional_customer_missing_type_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.Customer.fields.institution_type, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "customer_type INSTITUTIONAL without institution_type violates the conditional-required rule (ERR_INVALID_REQUEST)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /piano-dealer/customers"
              payload: { full_name: "Org Without Type", email: "org@x.com", customer_type: "INSTITUTIONAL" }
              as: SalesAssociate
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST"

      - name: get_nonexistent_instrument_returns_not_found
        claim_type: not_found
        grounds: ["validations[priority=4]", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but unknown UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /piano-dealer/instruments/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              as: StoreManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND"

      - name: customer_system_fields_input_ignored
        claim_type: system_fields
        grounds: [entities.Customer]
        distinguishing_aspect: "Client-supplied system fields (version) are ignored on create; server-minted version starts at 1."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /piano-dealer/customers"
              payload: { full_name: "Sid System", email: "sid@x.com", customer_type: "INDIVIDUAL", version: 99 }
              as: SalesAssociate
              captures: { c_id: $.data.id }
          assert:
            - "Customer.${c_id}.version == 1 (client input ignored)"

      - name: order_list_pagination_envelope
        claim_type: listing
        grounds: [response_envelope.pagination_fields, response_envelope.pagination_defaults]
        distinguishing_aspect: "List endpoint honors envelope pagination defaults: limit 10, offset 0, total_count and has_more present."
        test_recipe:
          setup: ["One customer and one UNPAID order exist"]
          setup_api_calls:
            - call: "POST /piano-dealer/customers"
              payload: { full_name: "Pia Page", email: "pia@x.com", customer_type: "INDIVIDUAL" }
              as: SalesAssociate
              captures: { c_id: $.data.id }
            - call: "POST /piano-dealer/instruments"
              payload: { serial_number: "SN-PG-1", category: "DIGITAL", manufacturer: "Roland", model: "FP30", year_built: 2024, condition_grade: "EXCELLENT", acquisition_type: "NEW", list_price_cents: 100000, floor_price_cents: 80000 }
              as: StoreManager
              captures: { i_id: $.data.id }
            - call: "POST /piano-dealer/instruments/${i_id}/list-for-sale"
              as: StoreManager
            - call: "POST /piano-dealer/sales-orders"
              payload: { customer_id: "${c_id}", items: [{ instrument_id: "${i_id}", unit_price_cents: 100000, discount_pct: 0.0 }], tax_rate: 0.0, distance_miles: 10, stairs_count: 0, climate_controlled_required: false }
              as: SalesAssociate
          trigger:
            - call: "GET /piano-dealer/sales-orders"
              as: SalesAssociate
          assert:
            - "response contains pagination fields: limit == 10, offset == 0, total_count == 1, has_more == false"

  # ==================================================================
  # Section: state_machines
  # ==================================================================
  - section: state_machines
    instances:
      - name: appraisal_decline_from_submitted_rejected
        claim_type: invalid_transition
        grounds: [state_machines.TradeInAppraisal.OFFERED_to_DECLINED, "errors[ERR_APPRAISAL_NOT_OFFERED]"]
        distinguishing_aspect: "decline is only valid from OFFERED; from SUBMITTED it fails with ERR_APPRAISAL_NOT_OFFERED and no state change."
        test_recipe:
          setup: ["Customer; appraisal in SUBMITTED (never evaluated)"]
          setup_api_calls:
            - call: "POST /piano-dealer/customers"
              payload: { full_name: "Saul Submit", email: "saul@x.com", customer_type: "INDIVIDUAL" }
              as: SalesAssociate
              captures: { c_id: $.data.id }
            - call: "POST /piano-dealer/trade-in-appraisals"
              payload: { customer_id: "${c_id}", category: "UPRIGHT", manufacturer: "Kawai", model: "K200", year_built: 2018, condition_grade: "GOOD" }
              as: SalesAssociate
              captures: { a_id: $.data.id }
          trigger:
            - call: "POST /piano-dealer/trade-in-appraisals/${a_id}/decline"
              as: Customer
              as_user_id: "${c_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_APPRAISAL_NOT_OFFERED"
            - "TradeInAppraisal.${a_id}.status remains SUBMITTED"

      - name: appraisal_terminal_declined_lockdown
        claim_type: terminal_lockdown
        grounds: [state_machines.TradeInAppraisal, "errors[ERR_APPRAISAL_NOT_OFFERED]"]
        distinguishing_aspect: "Terminal state DECLINED accepts no further transitions; accept afterwards fails with ERR_APPRAISAL_NOT_OFFERED."
        test_recipe:
          setup: ["Customer; appraisal evaluated to OFFERED then DECLINED"]
          setup_api_calls:
            - call: "POST /piano-dealer/customers"
              payload: { full_name: "Tara Term", email: "tara@x.com", customer_type: "INDIVIDUAL" }
              as: SalesAssociate
              captures: { c_id: $.data.id }
            - call: "POST /piano-dealer/trade-in-appraisals"
              payload: { customer_id: "${c_id}", category: "DIGITAL", manufacturer: "Roland", model: "RD88", year_built: 2022, condition_grade: "EXCELLENT" }
              as: SalesAssociate
              captures: { a_id: $.data.id }
            - call: "POST /piano-dealer/trade-in-appraisals/${a_id}/evaluate"
              payload: { reconditioning_cost_cents: 0, market_adjustment_pct: 0.0 }
              as: StoreManager
            - call: "POST /piano-dealer/trade-in-appraisals/${a_id}/decline"
              as: Customer
              as_user_id: "${c_id}"
          trigger:
            - call: "POST /piano-dealer/trade-in-appraisals/${a_id}/accept"
              as: Customer
              as_user_id: "${c_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_APPRAISAL_NOT_OFFERED"
            - "TradeInAppraisal.${a_id}.status remains DECLINED"

      - name: appraisal_lazy_expiry_after_fourteen_days
        claim_type: precondition_enforcement
        grounds: [state_machines.TradeInAppraisal.OFFERED_to_EXPIRED, "errors[ERR_APPRAISAL_EXPIRED]", calculations.trade_in_valuation]
        distinguishing_aspect: "Accept at offered_at + 15 days triggers the lazy EXPIRED transition and fails with ERR_APPRAISAL_EXPIRED; day 14 would still succeed."
        test_recipe:
          setup: ["Customer; appraisal evaluated to OFFERED at default clock 2026-05-01; clock advanced to 2026-05-16 (15 days later)"]
          setup_api_calls:
            - call: "POST /piano-dealer/customers"
              payload: { full_name: "Eli Expire", email: "eli@x.com", customer_type: "INDIVIDUAL" }
              as: SalesAssociate
              captures: { c_id: $.data.id }
            - call: "POST /piano-dealer/trade-in-appraisals"
              payload: { customer_id: "${c_id}", category: "UPRIGHT", manufacturer: "Kawai", model: "K300", year_built: 2016, condition_grade: "EXCELLENT" }
              as: SalesAssociate
              captures: { a_id: $.data.id }
            - call: "POST /piano-dealer/trade-in-appraisals/${a_id}/evaluate"
              payload: { reconditioning_cost_cents: 0, market_adjustment_pct: 0.0 }
              as: StoreManager
            - call: "POST /piano-dealer/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-16T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /piano-dealer/trade-in-appraisals/${a_id}/accept"
              as: Customer
              as_user_id: "${c_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_APPRAISAL_EXPIRED"
            - "TradeInAppraisal.${a_id}.status == EXPIRED"

      - name: bid_return_for_revision_cycle
        claim_type: valid_transition
        grounds: [state_machines.BidPackage.SUBMITTED_to_DRAFT]
        distinguishing_aspect: "Cyclic compliance loop: SUBMITTED -> DRAFT via return-for-revision, then resubmittable to SUBMITTED again."
        test_recipe:
          setup: ["INSTITUTIONAL CORPORATE customer (no ceiling); one instrument 500000/300000; bid created and SUBMITTED"]
          setup_api_calls:
            - call: "POST /piano-dealer/customers"
              payload: { full_name: "City Schools", email: "bids@city.gov", customer_type: "INSTITUTIONAL", institution_type: "GOVERNMENT", state_contract_ceiling_cents: 900000 }
              as: SalesAssociate
              captures: { cu_id: $.data.id }
            - call: "POST /piano-dealer/instruments"
              payload: { serial_number: "SN-REV-1", category: "UPRIGHT", manufacturer: "Yamaha", model: "U1", year_built: 2024, condition_grade: "EXCELLENT", acquisition_type: "NEW", list_price_cents: 500000, floor_price_cents: 300000 }
              as: StoreManager
              captures: { i_id: $.data.id }
            - call: "POST /piano-dealer/bid-packages"
              payload: { customer_id: "${cu_id}", lines: [{ instrument_id: "${i_id}", unit_price_cents: 500000 }] }
              as: InstitutionalBidOfficer
              as_user_id: "ibo-cycle"
              captures: { b_id: $.data.id }
            - call: "POST /piano-dealer/bid-packages/${b_id}/submit"
              as: InstitutionalBidOfficer
              as_user_id: "ibo-cycle"
          trigger:
            - call: "POST /piano-dealer/bid-packages/${b_id}/return-for-revision"
              as: ComplianceOfficer
              as_user_id: "co-cycle"
            - call: "POST /piano-dealer/bid-packages/${b_id}/submit"
              as: InstitutionalBidOfficer
              as_user_id: "ibo-cycle"
          assert:
            - "After return-for-revision: BidPackage.${b_id}.status == DRAFT"
            - "After resubmit: BidPackage.${b_id}.status == SUBMITTED (cycle completed)"

      - name: delivery_complete_from_scheduled_rejected
        claim_type: invalid_transition
        grounds: [state_machines.DeliveryJob.EN_ROUTE_to_COMPLETED, "errors[ERR_DELIVERY_NOT_ACTIONABLE]"]
        distinguishing_aspect: "complete requires EN_ROUTE; calling it on a SCHEDULED job fails with ERR_DELIVERY_NOT_ACTIONABLE."
        test_recipe:
          setup: ["PAID_IN_FULL order (total 415000) with a SCHEDULED delivery job"]
          setup_api_calls:
            - call: "POST /piano-dealer/customers"
              payload: { full_name: "Skip Start", email: "skip@x.com", customer_type: "INDIVIDUAL" }
              as: SalesAssociate
              captures: { c_id: $.data.id }
            - call: "POST /piano-dealer/instruments"
              payload: { serial_number: "SN-SK-1", category: "UPRIGHT", manufacturer: "Yamaha", model: "U1", year_built: 2024, condition_grade: "EXCELLENT", acquisition_type: "NEW", list_price_cents: 400000, floor_price_cents: 300000 }
              as: StoreManager
              captures: { i_id: $.data.id }
            - call: "POST /piano-dealer/instruments/${i_id}/list-for-sale"
              as: StoreManager
            - call: "POST /piano-dealer/sales-orders"
              payload: { customer_id: "${c_id}", items: [{ instrument_id: "${i_id}", unit_price_cents: 400000, discount_pct: 0.0 }], tax_rate: 0.0, distance_miles: 10, stairs_count: 0, climate_controlled_required: false }
              as: SalesAssociate
              captures: { o_id: $.data.id }
            - call: "POST /piano-dealer/sales-orders/${o_id}/payments"
              payload: { amount_cents: 415000, method: "CARD" }
              as: SalesAssociate
            - call: "POST /piano-dealer/delivery-crews"
              payload: { crew_name: "Crew Kappa", climate_certified: false }
              as: StoreManager
              captures: { cr_id: $.data.id }
            - call: "POST /piano-dealer/delivery-jobs"
              payload: { order_id: "${o_id}", crew_id: "${cr_id}", window_start: "2026-06-06T09:00:00Z", window_end: "2026-06-06T11:00:00Z" }
              as: ServiceCoordinator
              captures: { j_id: $.data.id }
          trigger:
            - call: "POST /piano-dealer/delivery-jobs/${j_id}/complete"
              as: ServiceCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_DELIVERY_NOT_ACTIONABLE"
            - "DeliveryJob.${j_id}.status remains SCHEDULED; order fulfillment remains DELIVERY_SCHEDULED"

      - name: delivery_fail_reschedule_cycle
        claim_type: valid_transition
        grounds: [state_machines.DeliveryJob.EN_ROUTE_to_FAILED, state_machines.DeliveryJob.FAILED_to_SCHEDULED]
        distinguishing_aspect: "DeliveryJob cyclic loop EN_ROUTE -> FAILED -> SCHEDULED with order fulfillment reverting OUT_FOR_DELIVERY -> DELIVERY_SCHEDULED."
        test_recipe:
          setup: ["PAID_IN_FULL order (total 415000) with delivery job EN_ROUTE"]
          setup_api_calls:
            - call: "POST /piano-dealer/customers"
              payload: { full_name: "Fred Fail", email: "fred@x.com", customer_type: "INDIVIDUAL" }
              as: SalesAssociate
              captures: { c_id: $.data.id }
            - call: "POST /piano-dealer/instruments"
              payload: { serial_number: "SN-FL-1", category: "UPRIGHT", manufacturer: "Yamaha", model: "U1", year_built: 2024, condition_grade: "EXCELLENT", acquisition_type: "NEW", list_price_cents: 400000, floor_price_cents: 300000 }
              as: StoreManager
              captures: { i_id: $.data.id }
            - call: "POST /piano-dealer/instruments/${i_id}/list-for-sale"
              as: StoreManager
            - call: "POST /piano-dealer/sales-orders"
              payload: { customer_id: "${c_id}", items: [{ instrument_id: "${i_id}", unit_price_cents: 400000, discount_pct: 0.0 }], tax_rate: 0.0, distance_miles: 10, stairs_count: 0, climate_controlled_required: false }
              as: SalesAssociate
              captures: { o_id: $.data.id }
            - call: "POST /piano-dealer/sales-orders/${o_id}/payments"
              payload: { amount_cents: 415000, method: "CARD" }
              as: SalesAssociate
            - call: "POST /piano-dealer/delivery-crews"
              payload: { crew_name: "Crew Lambda", climate_certified: false }
              as: StoreManager
              captures: { cr_id: $.data.id }
            - call: "POST /piano-dealer/delivery-jobs"
              payload: { order_id: "${o_id}", crew_id: "${cr_id}", window_start: "2026-06-07T09:00:00Z", window_end: "2026-06-07T11:00:00Z" }
              as: ServiceCoordinator
              captures: { j_id: $.data.id }
            - call: "POST /piano-dealer/delivery-jobs/${j_id}/start"
              as: ServiceCoordinator
          trigger:
            - call: "POST /piano-dealer/delivery-jobs/${j_id}/fail"
              as: ServiceCoordinator
            - call: "POST /piano-dealer/delivery-jobs/${j_id}/reschedule"
              payload: { window_start: "2026-06-08T09:00:00Z", window_end: "2026-06-08T11:00:00Z" }
              as: ServiceCoordinator
          assert:
            - "After fail: DeliveryJob.${j_id}.status == FAILED and order fulfillment == DELIVERY_SCHEDULED"
            - "After reschedule: DeliveryJob.${j_id}.status == SCHEDULED with window 2026-06-08T09:00:00Z/11:00:00Z"

      - name: plan_suspend_blocks_booking_then_resume
        claim_type: precondition_enforcement
        grounds: [state_machines.ServicePlan.ACTIVE_to_SUSPENDED, "errors[ERR_PLAN_NOT_ACTIVE]"]
        distinguishing_aspect: "Booking on a SUSPENDED plan fails with ERR_PLAN_NOT_ACTIVE; resume restores bookability (ACTIVE <-> SUSPENDED cycle)."
        test_recipe:
          setup: ["INSTALLED order (100000 line, total 115000) with STANDARD plan; technician exists; plan suspended"]
          setup_api_calls:
            - call: "POST /piano-dealer/customers"
              payload: { full_name: "Sue Spend", email: "sue@x.com", customer_type: "INDIVIDUAL" }
              as: SalesAssociate
              captures: { c_id: $.data.id }
            - call: "POST /piano-dealer/instruments"
              payload: { serial_number: "SN-SP-1", category: "UPRIGHT", manufacturer: "Kawai", model: "K500", year_built: 2024, condition_grade: "EXCELLENT", acquisition_type: "NEW", list_price_cents: 100000, floor_price_cents: 80000 }
              as: StoreManager
              captures: { i_id: $.data.id }
            - call: "POST /piano-dealer/instruments/${i_id}/list-for-sale"
              as: StoreManager
            - call: "POST /piano-dealer/sales-orders"
              payload: { customer_id: "${c_id}", items: [{ instrument_id: "${i_id}", unit_price_cents: 100000, discount_pct: 0.0 }], tax_rate: 0.0, distance_miles: 10, stairs_count: 0, climate_controlled_required: false }
              as: SalesAssociate
              captures: { o_id: $.data.id }
            - call: "POST /piano-dealer/sales-orders/${o_id}/payments"
              payload: { amount_cents: 115000, method: "CARD" }
              as: SalesAssociate
            - call: "POST /piano-dealer/delivery-crews"
              payload: { crew_name: "Crew Mu", climate_certified: false }
              as: StoreManager
              captures: { cr_id: $.data.id }
            - call: "POST /piano-dealer/delivery-jobs"
              payload: { order_id: "${o_id}", crew_id: "${cr_id}", window_start: "2026-05-06T09:00:00Z", window_end: "2026-05-06T11:00:00Z" }
              as: ServiceCoordinator
              captures: { j_id: $.data.id }
            - call: "POST /piano-dealer/delivery-jobs/${j_id}/start"
              as: ServiceCoordinator
            - call: "POST /piano-dealer/delivery-jobs/${j_id}/complete"
              as: ServiceCoordinator
            - call: "POST /piano-dealer/sales-orders/${o_id}/confirm-installation"
              as: StoreManager
            - call: "POST /piano-dealer/service-plans"
              payload: { order_id: "${o_id}", tier: "STANDARD" }
              as: ServiceCoordinator
              captures: { p_id: $.data.id }
            - call: "POST /piano-dealer/technicians"
              payload: { full_name: "Tammy Tech", certification_level: "STANDARD" }
              as: StoreManager
              captures: { t_id: $.data.id }
            - call: "POST /piano-dealer/service-plans/${p_id}/suspend"
              as: ServiceCoordinator
          trigger:
            - call: "POST /piano-dealer/service-visits"
              payload: { plan_id: "${p_id}", technician_id: "${t_id}", window_start: "2026-06-11T09:00:00Z", window_end: "2026-06-11T10:00:00Z" }
              as: ServiceCoordinator
              captures: { err: $.data.error_id }
            - call: "POST /piano-dealer/service-plans/${p_id}/resume"
              as: ServiceCoordinator
            - call: "POST /piano-dealer/service-visits"
              payload: { plan_id: "${p_id}", technician_id: "${t_id}", window_start: "2026-06-11T09:00:00Z", window_end: "2026-06-11T10:00:00Z" }
              as: ServiceCoordinator
              captures: { v_id: $.data.id }
          assert:
            - "While SUSPENDED: error_id == ERR_PLAN_NOT_ACTIVE"
            - "After resume: booking succeeds, ServiceVisit.${v_id}.status == BOOKED, plan visits_booked == 1"

      - name: event_settle_before_end_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.ShowroomEvent.RSVP_OPEN_to_SETTLED, "errors[ERR_EVENT_NOT_SETTLABLE]"]
        distinguishing_aspect: "settle before end_at (clock 2026-06-01T19:00 < end 20:00) fails with ERR_EVENT_NOT_SETTLABLE."
        test_recipe:
          setup: ["Event in RSVP_OPEN, window 2026-06-01T18:00-20:00; clock at 2026-06-01T19:00"]
          setup_api_calls:
            - call: "POST /piano-dealer/showroom-events"
              payload: { room: "RECITAL_HALL", title: "Artist Series: Opening", start_at: "2026-06-01T18:00:00Z", end_at: "2026-06-01T20:00:00Z", capacity: 50, artist_guarantee_cents: 200000, split_pct: 0.70 }
              as: StoreManager
              captures: { e_id: $.data.id }
            - call: "POST /piano-dealer/showroom-events/${e_id}/open-rsvp"
              as: StoreManager
            - call: "POST /piano-dealer/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T19:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /piano-dealer/showroom-events/${e_id}/settle"
              payload: { gross_cents: 250000 }
              as: StoreManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_EVENT_NOT_SETTLABLE"
            - "ShowroomEvent.${e_id}.status remains RSVP_OPEN and payout_cents is null"

      - name: consignment_return_terminal_lockdown
        claim_type: terminal_lockdown
        grounds: [state_machines.Instrument.AVAILABLE_to_RETURNED_TO_CONSIGNOR, "errors[ERR_INSTRUMENT_NOT_AVAILABLE]"]
        distinguishing_aspect: "RETURNED_TO_CONSIGNOR is terminal; list-for-sale afterwards fails with ERR_INSTRUMENT_NOT_AVAILABLE."
        test_recipe:
          setup: ["Consignor; AVAILABLE CONSIGNMENT instrument"]
          setup_api_calls:
            - call: "POST /piano-dealer/consignors"
              payload: { full_name: "Terry Terminal", email: "terry@x.com", commission_pct: 0.20, split_mode: "GROSS_SPLIT", payout_method: "CHECK" }
              as: StoreManager
              captures: { g_id: $.data.id }
            - call: "POST /piano-dealer/instruments"
              payload: { serial_number: "SN-TM-1", category: "GRAND", manufacturer: "Steinway", model: "B", year_built: 2009, condition_grade: "FAIR", acquisition_type: "CONSIGNMENT", consignor_id: "${g_id}", list_price_cents: 900000, floor_price_cents: 700000 }
              as: StoreManager
              captures: { i_id: $.data.id }
            - call: "POST /piano-dealer/instruments/${i_id}/list-for-sale"
              as: StoreManager
            - call: "POST /piano-dealer/instruments/${i_id}/return-to-consignor"
              as: StoreManager
          trigger:
            - call: "POST /piano-dealer/instruments/${i_id}/list-for-sale"
              as: StoreManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INSTRUMENT_NOT_AVAILABLE"
            - "Instrument.${i_id}.status remains RETURNED_TO_CONSIGNOR"

  # ==================================================================
  # Section: calculations
  # ==================================================================
  - section: calculations
    instances:
      - name: bid_tier_boundary_qty2_vs_qty3
        claim_type: correct_result
        grounds: [calculations.institutional_bid_price]
        distinguishing_aspect: "Tier boundary precision: quantity 2 yields tier_discount_pct 0.0 (total 1000000); quantity 3 yields 0.08 (total 1380000) — the discount switches at exactly 3, not 4."
        test_recipe:
          setup: ["INSTITUTIONAL CORPORATE customer without ceiling; five NEW instruments 500000/300000"]
          setup_api_calls:
            - call: "POST /piano-dealer/customers"
              payload: { full_name: "Corp Buyer LLC", email: "it@corp.com", customer_type: "INSTITUTIONAL", institution_type: "CORPORATE" }
              as: SalesAssociate
              captures: { cu_id: $.data.id }
            - call: "POST /piano-dealer/instruments"
              payload: { serial_number: "SN-TB-1", category: "UPRIGHT", manufacturer: "Yamaha", model: "U1", year_built: 2024, condition_grade: "EXCELLENT", acquisition_type: "NEW", list_price_cents: 500000, floor_price_cents: 300000 }
              as: StoreManager
              captures: { t1: $.data.id }
            - call: "POST /piano-dealer/instruments"
              payload: { serial_number: "SN-TB-2", category: "UPRIGHT", manufacturer: "Yamaha", model: "U1", year_built: 2024, condition_grade: "EXCELLENT", acquisition_type: "NEW", list_price_cents: 500000, floor_price_cents: 300000 }
              as: StoreManager
              captures: { t2: $.data.id }
            - call: "POST /piano-dealer/instruments"
              payload: { serial_number: "SN-TB-3", category: "UPRIGHT", manufacturer: "Yamaha", model: "U1", year_built: 2024, condition_grade: "EXCELLENT", acquisition_type: "NEW", list_price_cents: 500000, floor_price_cents: 300000 }
              as: StoreManager
              captures: { t3: $.data.id }
          trigger:
            - call: "POST /piano-dealer/bid-packages"
              payload: { customer_id: "${cu_id}", lines: [{ instrument_id: "${t1}", unit_price_cents: 500000 }, { instrument_id: "${t2}", unit_price_cents: 500000 }] }
              as: InstitutionalBidOfficer
              as_user_id: "ibo-tier"
              captures: { b2_id: $.data.id }
            - call: "POST /piano-dealer/bid-packages"
              payload: { customer_id: "${cu_id}", lines: [{ instrument_id: "${t1}", unit_price_cents: 500000 }, { instrument_id: "${t2}", unit_price_cents: 500000 }, { instrument_id: "${t3}", unit_price_cents: 500000 }] }
              as: InstitutionalBidOfficer
              as_user_id: "ibo-tier"
              captures: { b3_id: $.data.id }
          assert:
            - "BidPackage.${b2_id}.tier_discount_pct == 0.0 and total_cents == 1000000"
            - "BidPackage.${b3_id}.tier_discount_pct == 0.08 and total_cents == 1380000 (round(1500000 * 0.92) * 1.00)"

      - name: delivery_fee_distance_tier_boundaries
        claim_type: constants_applied
        grounds: [calculations.delivery_fee]
        distinguishing_aspect: "Distance tiers are inclusive-bounded: 25 miles costs 0 distance fee (total fee 15000) while 26 miles jumps to tier 2 (fee 27000); boundary sits between 25 and 26."
        test_recipe:
          setup: ["Customer; two AVAILABLE instruments 100000 each"]
          setup_api_calls:
            - call: "POST /piano-dealer/customers"
              payload: { full_name: "Miles Mercer", email: "miles@x.com", customer_type: "INDIVIDUAL" }
              as: SalesAssociate
              captures: { c_id: $.data.id }
            - call: "POST /piano-dealer/instruments"
              payload: { serial_number: "SN-DF-1", category: "DIGITAL", manufacturer: "Roland", model: "FP10", year_built: 2024, condition_grade: "EXCELLENT", acquisition_type: "NEW", list_price_cents: 100000, floor_price_cents: 80000 }
              as: StoreManager
              captures: { d1: $.data.id }
            - call: "POST /piano-dealer/instruments"
              payload: { serial_number: "SN-DF-2", category: "DIGITAL", manufacturer: "Roland", model: "FP10", year_built: 2024, condition_grade: "EXCELLENT", acquisition_type: "NEW", list_price_cents: 100000, floor_price_cents: 80000 }
              as: StoreManager
              captures: { d2: $.data.id }
            - call: "POST /piano-dealer/instruments/${d1}/list-for-sale"
              as: StoreManager
            - call: "POST /piano-dealer/instruments/${d2}/list-for-sale"
              as: StoreManager
          trigger:
            - call: "POST /piano-dealer/sales-orders"
              payload: { customer_id: "${c_id}", items: [{ instrument_id: "${d1}", unit_price_cents: 100000, discount_pct: 0.0 }], tax_rate: 0.0, distance_miles: 25, stairs_count: 0, climate_controlled_required: false }
              as: SalesAssociate
              captures: { o25: $.data.id }
            - call: "POST /piano-dealer/sales-orders"
              payload: { customer_id: "${c_id}", items: [{ instrument_id: "${d2}", unit_price_cents: 100000, discount_pct: 0.0 }], tax_rate: 0.0, distance_miles: 26, stairs_count: 0, climate_controlled_required: false }
              as: SalesAssociate
              captures: { o26: $.data.id }
          assert:
            - "SalesOrder.${o25}.delivery_fee_cents == 15000 (25 miles: no distance tier)"
            - "SalesOrder.${o26}.delivery_fee_cents == 27000 (26 miles: tier-2 12000 applies)"

      - name: warranty_extension_within_thirty_days
        claim_type: correct_result
        grounds: [calculations.warranty_coverage_end, entities.WarrantyRegistration.fields.coverage_end]
        distinguishing_aspect: "Registration 10 days after delivery wins the +12-month extension: coverage_end == delivered_at + 36 months (2029-05-10T08:00:00Z), not the base 24 months."
        test_recipe:
          setup: ["Order delivered at 2026-05-10T08:00:00Z (clock set before completion); warranty PENDING created same day; clock advanced to 2026-05-20 for confirmation"]
          setup_api_calls:
            - call: "POST /piano-dealer/customers"
              payload: { full_name: "Willa Warrant", email: "willa@x.com", customer_type: "INDIVIDUAL" }
              as: SalesAssociate
              captures: { c_id: $.data.id }
            - call: "POST /piano-dealer/instruments"
              payload: { serial_number: "SN-WC-1", category: "GRAND", manufacturer: "Steinway", model: "O", year_built: 2024, condition_grade: "EXCELLENT", acquisition_type: "NEW", list_price_cents: 500000, floor_price_cents: 400000 }
              as: StoreManager
              captures: { i_id: $.data.id }
            - call: "POST /piano-dealer/instruments/${i_id}/list-for-sale"
              as: StoreManager
            - call: "POST /piano-dealer/sales-orders"
              payload: { customer_id: "${c_id}", items: [{ instrument_id: "${i_id}", unit_price_cents: 500000, discount_pct: 0.0 }], tax_rate: 0.0, distance_miles: 10, stairs_count: 0, climate_controlled_required: false }
              as: SalesAssociate
              captures: { o_id: $.data.id }
            - call: "POST /piano-dealer/sales-orders/${o_id}/payments"
              payload: { amount_cents: 515000, method: "CARD" }
              as: SalesAssociate
            - call: "POST /piano-dealer/delivery-crews"
              payload: { crew_name: "Crew Nu", climate_certified: false }
              as: StoreManager
              captures: { cr_id: $.data.id }
            - call: "POST /piano-dealer/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /piano-dealer/delivery-jobs"
              payload: { order_id: "${o_id}", crew_id: "${cr_id}", window_start: "2026-05-10T09:00:00Z", window_end: "2026-05-10T12:00:00Z" }
              as: ServiceCoordinator
              captures: { j_id: $.data.id }
            - call: "POST /piano-dealer/delivery-jobs/${j_id}/start"
              as: ServiceCoordinator
            - call: "POST /piano-dealer/delivery-jobs/${j_id}/complete"
              as: ServiceCoordinator
            - call: "POST /piano-dealer/warranty-registrations"
              payload: { order_id: "${o_id}", instrument_id: "${i_id}" }
              as: SalesAssociate
              captures: { w_id: $.data.id }
            - call: "POST /piano-dealer/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-20T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /piano-dealer/warranty-registrations/${w_id}/confirm"
              as: StoreManager
          assert:
            - "WarrantyRegistration.${w_id}.status == REGISTERED"
            - "WarrantyRegistration.${w_id}.registered_at == 2026-05-20T00:00:00Z"
            - "WarrantyRegistration.${w_id}.coverage_end == 2029-05-10T08:00:00Z (24 base + 12 extension months from delivered_at 2026-05-10T08:00:00Z)"

      - name: artist_payout_guarantee_floor_and_split_branch
        claim_type: correct_result
        grounds: [calculations.artist_payout, entities.ShowroomEvent.fields.payout_cents]
        distinguishing_aspect: "max() branch selection: gross 250000 pays the guarantee 200000 (split branch 175000 loses); gross 400000 pays the split 280000 (guarantee loses)."
        test_recipe:
          setup: ["Two RSVP_OPEN events in MAIN_SHOWROOM (18:00-20:00 and 21:00-23:00, non-overlapping), guarantee 200000 / split 0.70; clock past both end times"]
          setup_api_calls:
            - call: "POST /piano-dealer/showroom-events"
              payload: { room: "MAIN_SHOWROOM", title: "Artist Series A", start_at: "2026-06-02T18:00:00Z", end_at: "2026-06-02T20:00:00Z", capacity: 50, artist_guarantee_cents: 200000, split_pct: 0.70 }
              as: StoreManager
              captures: { e1: $.data.id }
            - call: "POST /piano-dealer/showroom-events"
              payload: { room: "MAIN_SHOWROOM", title: "Artist Series B", start_at: "2026-06-02T21:00:00Z", end_at: "2026-06-02T23:00:00Z", capacity: 50, artist_guarantee_cents: 200000, split_pct: 0.70 }
              as: StoreManager
              captures: { e2: $.data.id }
            - call: "POST /piano-dealer/showroom-events/${e1}/open-rsvp"
              as: StoreManager
            - call: "POST /piano-dealer/showroom-events/${e2}/open-rsvp"
              as: StoreManager
            - call: "POST /piano-dealer/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-03T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /piano-dealer/showroom-events/${e1}/settle"
              payload: { gross_cents: 250000 }
              as: StoreManager
            - call: "POST /piano-dealer/showroom-events/${e2}/settle"
              payload: { gross_cents: 400000 }
              as: StoreManager
          assert:
            - "ShowroomEvent.${e1}.payout_cents == 200000 (guarantee branch; status SETTLED)"
            - "ShowroomEvent.${e2}.payout_cents == 280000 (split branch; status SETTLED)"

      - name: financing_standard_vs_rent_to_own_monthly
        claim_type: correct_result
        grounds: [calculations.financing_schedule, entities.FinancingAgreement.fields.monthly_amount_cents]
        distinguishing_aspect: "Same principal 615000 and term 12: STANDARD annuity at apr 0.12 yields monthly 54642; RENT_TO_OWN flat 1.2% yields 7380 — the two programs are two valid schedules with different results."
