      - name: pump_houses_are_created_by_two_roles_but_only_the_supervisor_may_run_them
        claim_type: exclusive_operations
        grounds:
          - roles[SnowmakingSupervisor]
          - endpoints[POST /mountain-ops/pump-houses]
          - endpoints[POST /mountain-ops/pump-houses/{id}/status]
          - endpoints[POST /mountain-ops/snowmaking-sessions]
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: |
          One entity family, two different permitted sets: the MountainOpsDirector may PROVISION a pump
          house but may not change its operational status and may not schedule water against it. An
          implementation that attaches permissions per resource rather than per endpoint either lets the
          director run the plant or stops him from building it - both are visible here in the same test,
          against the same pump house.
        test_recipe:
          setup:
            - "A PRESEASON season with one inspected lift, one CLOSED terrain area and no pump houses yet."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: MountainOpsDirector
            - call: "POST /mountain-ops/seasons"
              payload: { season_label: "2026-27", base_depth_policy: "MEAN_OF_STAKES", water_right_seasonal_af: 250.000, plant_max_gpm: 6000, snowmaking_kwh_per_af: 620.0, min_patrollers_per_open_area: 2, groom_freshness_hours: 18, energy_windows: [{ code: "OFF_1", start_hour_utc: 0, end_hour_utc: 6, price_usd_per_kwh: 0.062, tier: "OFF_PEAK" }, { code: "MID_1", start_hour_utc: 6, end_hour_utc: 9, price_usd_per_kwh: 0.113, tier: "MID_PEAK" }, { code: "ON_1", start_hour_utc: 9, end_hour_utc: 21, price_usd_per_kwh: 0.187, tier: "ON_PEAK" }, { code: "MID_2", start_hour_utc: 21, end_hour_utc: 24, price_usd_per_kwh: 0.113, tier: "MID_PEAK" }] }
              as: MountainOpsDirector
              captures: { season_id: $.data.id }
            - call: "POST /mountain-ops/lifts"
              payload: { season_id: "${season_id}", lift_code: "L1", name: "Summit Express", lift_type: "DETACHABLE", wind_hold_threshold_mph: 40.0, hourly_capacity_pph: 1800, required_operator_count: 2 }
              as: LiftOpsManager
              captures: { lift_id: $.data.id }
            - call: "POST /mountain-ops/lifts/${lift_id}/inspections"
              payload: { result: "PASS", notes: "daily pre-op" }
              as: LiftOpsManager
            - call: "POST /mountain-ops/terrain-areas"
              payload: { season_id: "${season_id}", serving_lift_id: "${lift_id}", trail_code: "T1", name: "Sunbowl", terrain_class: "BLUE", acres: 18.0, min_open_base_depth_in: 30, avalanche_terrain: false }
              as: MountainOpsDirector
              captures: { area_id: $.data.id }
          trigger:
            - call: "POST /mountain-ops/pump-houses"
              payload: { season_id: "${season_id}", pump_house_code: "PH1", name: "Base Pumphouse", max_gpm: 2400, gun_count: 40, status: "ONLINE" }
              as: MountainOpsDirector
              captures: { ph1_id: $.data.id }
            - call: "POST /mountain-ops/pump-houses"
              payload: { season_id: "${season_id}", pump_house_code: "PH9", name: "Rogue Pumphouse", max_gpm: 2400, gun_count: 40, status: "ONLINE" }
              as: GroomingLead
              captures: { err: $.data.error_id }
            - call: "POST /mountain-ops/pump-houses/${ph1_id}/status"
              payload: { status: "MAINTENANCE" }
              as: MountainOpsDirector
              captures: { err: $.data.error_id }
            - call: "POST /mountain-ops/pump-houses/${ph1_id}/status"
              payload: { status: "MAINTENANCE" }
              as: LiftOpsManager
              captures: { err: $.data.error_id }
            - call: "GET /mountain-ops/pump-houses/${ph1_id}"
              payload: {  }
              as: MountainOpsDirector
            - call: "GET /mountain-ops/terrain-areas/${area_id}"
              payload: {  }
              as: SnowmakingSupervisor
              captures: { ta_v: $.data.version }
            - call: "POST /mountain-ops/snowmaking-sessions"
              payload: { terrain_area_id: "${area_id}", pump_house_id: "${ph1_id}", window_start: "2026-08-01T05:00:00Z", window_end: "2026-08-01T12:00:00Z", gun_count: 30, gpm: 1200, expected_terrain_area_version: "${ta_v}" }
              as: MountainOpsDirector
              captures: { err: $.data.error_id }
            - call: "POST /mountain-ops/snowmaking-sessions"
              payload: { terrain_area_id: "${area_id}", pump_house_id: "${ph1_id}", window_start: "2026-08-01T05:00:00Z", window_end: "2026-08-01T12:00:00Z", gun_count: 30, gpm: 1200, expected_terrain_area_version: "${ta_v}" }
              as: GroomingLead
              captures: { err: $.data.error_id }
            - call: "POST /mountain-ops/snowmaking-sessions"
              payload: { terrain_area_id: "${area_id}", pump_house_id: "${ph1_id}", window_start: "2026-08-01T05:00:00Z", window_end: "2026-08-01T12:00:00Z", gun_count: 30, gpm: 1200, expected_terrain_area_version: "${ta_v}" }
              as: GuestServicesAgent
              captures: { err: $.data.error_id }
            - call: "POST /mountain-ops/snowmaking-sessions"
              payload: { terrain_area_id: "${area_id}", pump_house_id: "${ph1_id}", window_start: "2026-08-01T05:00:00Z", window_end: "2026-08-01T12:00:00Z", gun_count: 30, gpm: 1200, expected_terrain_area_version: "${ta_v}" }
              as: SnowmakingSupervisor
              captures: { sess_id: $.data.id }
            - call: "POST /mountain-ops/pump-houses/${ph1_id}/status"
              payload: { status: "MAINTENANCE" }
              as: SnowmakingSupervisor
          assert:
            - "Trigger 1: HTTP 201 - POST /mountain-ops/pump-houses declares both SnowmakingSupervisor and MountainOpsDirector, so the director provisions plant successfully; status == 'ONLINE'."
            - "Trigger 2: HTTP 403 with data.error_id == 'ERR_UNAUTHORIZED' - GroomingLead is in neither permitted set."
            - "Trigger 3: HTTP 403 with data.error_id == 'ERR_UNAUTHORIZED' - the SAME director who just created this pump house may not change its status."
            - "Trigger 4: HTTP 403 with data.error_id == 'ERR_UNAUTHORIZED'."
            - "Trigger 5: status is still 'ONLINE' and active_session_count == 0 - the two refused status writes changed nothing."
            - "Triggers 7, 8 and 9: HTTP 403 with data.error_id == 'ERR_UNAUTHORIZED' - session creation is supervisor-only, and the director is refused despite owning the season, the lift and the area."
            - "Trigger 10: HTTP 201 with water_af_reserved == 1.547, so the payload the director sent was valid in every respect except the role header."
            - "Trigger 11: HTTP 200 with status == 'MAINTENANCE' - the permitted role can do what the director could not."

