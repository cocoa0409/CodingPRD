  # ==========================================================================
  - section: errors
    instances:

      - name: request_with_no_role_header_is_unauthenticated
        claim_type: error_triggerable
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
          - rbac.roles
        distinguishing_aspect: |
          Priority 1 sits above every other rule, so a request that carries no X-Role header at all must be
          answered with the authentication error even when its body is otherwise perfect and even when the
          endpoint is one that Anonymous could reach. It fails if a missing header is silently treated as
          Anonymous, or if the body is validated first and a 422 is returned.
        test_recipe:
          setup:
            - "No entities are needed; the failure precedes all lookup."
            - "The request is issued with NO X-Role header and no X-User-ID header."
            - "The body is a complete, valid venue payload, so nothing but the missing header can be at fault."
          setup_api_calls: []
          trigger:
            - call: "POST /venues"
              payload: { name: "Reel Repertory", seat_capacity: 12, house_hold_seats: 4, trailer_reel_minutes: 12, turnaround_minutes: 25, min_useful_gap_minutes: 45, dcp_ingest_lane_count: 2, open_local_time: "11:00", last_start_local_time: "22:00", utc_offset_minutes: 0, max_first_run_share: 0.60, weekly_repertory_target: 3, supported_formats: ["DCP_2K", "DCP_4K"], base_house_nut_weekly_cents: 200000 }
              captures: { err_id: $.data.error_id }
          assert:
            - "The response status is 401 and $.data.error_id == ERR_UNAUTHENTICATED, not ERR_FORBIDDEN_ROLE and not ERR_INVALID_REQUEST."
            - "The envelope still carries $.data.message as a non-empty string."
            - "GET /titles as Anonymous afterwards returns 0 rows, confirming no venue was written."
            - "The same body with X-Role: ExecutiveDirector returns 201, isolating the header as the only difference."

      - name: every_entity_not_found_error_is_reachable
        claim_type: error_triggerable
        grounds:
          - validations[priority=4]
          - errors[ERR_VENUE_NOT_FOUND]
          - errors[ERR_BOOKING_NOT_FOUND]
          - errors[ERR_CLEARANCE_NOT_FOUND]
          - errors[ERR_DCP_ASSET_NOT_FOUND]
          - errors[ERR_KDM_NOT_FOUND]
          - errors[ERR_SHOWTIME_NOT_FOUND]
          - errors[ERR_SPECIAL_EVENT_NOT_FOUND]
          - errors[ERR_TICKET_ORDER_NOT_FOUND]
          - errors[ERR_MEMBER_NOT_FOUND]
          - errors[ERR_SETTLEMENT_NOT_FOUND]
        distinguishing_aspect: |
          Every entity in the catalogue owns a distinct not-found code, and a well-formed UUID that matches
          nothing must produce that entity's own code rather than a shared generic 404. Sweeping the whole
          family in one instance is what proves no code was left unreachable.
        test_recipe:
          setup:
            - "No rows exist for any of the swept entities."
            - "Each id used is a syntactically valid UUID that was never minted, so priority 3 (shape) is satisfied and only priority 4 can fire."
            - "Each read is issued as a role §1.5 permits on that endpoint, so priority 2 cannot pre-empt priority 4."
          setup_api_calls: []
          trigger:
            - call: "GET /venues/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: ExecutiveDirector
              captures: { e_venue: $.data.error_id }
            - call: "GET /bookings/00000000-0000-4000-8000-000000000002"
              payload: {}
              as: Programmer
              captures: { e_booking: $.data.error_id }
            - call: "GET /clearances/00000000-0000-4000-8000-000000000003"
              payload: {}
              as: RightsManager
              captures: { e_clearance: $.data.error_id }
            - call: "GET /dcp-assets/00000000-0000-4000-8000-000000000004"
              payload: {}
              as: TechnicalManager
              captures: { e_asset: $.data.error_id }
            - call: "GET /kdm-keys/00000000-0000-4000-8000-000000000005"
              payload: {}
              as: TechnicalManager
              captures: { e_kdm: $.data.error_id }
            - call: "GET /showtimes/00000000-0000-4000-8000-000000000006"
              payload: {}
              as: Anonymous
              captures: { e_showtime: $.data.error_id }
            - call: "GET /special-events/00000000-0000-4000-8000-000000000007"
              payload: {}
              as: Programmer
              captures: { e_event: $.data.error_id }
            - call: "GET /ticket-orders/00000000-0000-4000-8000-000000000008"
              payload: {}
              as: BoxOfficeManager
              captures: { e_order: $.data.error_id }
            - call: "GET /members/00000000-0000-4000-8000-000000000009"
              payload: {}
              as: BoxOfficeManager
              captures: { e_member: $.data.error_id }
            - call: "GET /settlements/00000000-0000-4000-8000-00000000000a"
              payload: {}
              as: BoxOfficeManager
              captures: { e_settlement: $.data.error_id }
          assert:
            - "Every one of the ten reads returns 404."
            - "The captured codes are exactly ERR_VENUE_NOT_FOUND, ERR_BOOKING_NOT_FOUND, ERR_CLEARANCE_NOT_FOUND, ERR_DCP_ASSET_NOT_FOUND, ERR_KDM_NOT_FOUND, ERR_SHOWTIME_NOT_FOUND, ERR_SPECIAL_EVENT_NOT_FOUND, ERR_TICKET_ORDER_NOT_FOUND, ERR_MEMBER_NOT_FOUND and ERR_SETTLEMENT_NOT_FOUND respectively."
            - "No two of the ten captured codes are equal, so no entity is sharing another's code."
            - "Each response carries a non-empty $.data.message."

      - name: every_entity_invalid_state_error_is_reachable
        claim_type: error_triggerable
        grounds:
          - validations[priority=6]
          - errors[ERR_BOOKING_INVALID_STATE]
          - errors[ERR_CLEARANCE_INVALID_STATE]
          - errors[ERR_DCP_ASSET_INVALID_STATE]
          - errors[ERR_SHOWTIME_INVALID_STATE]
          - errors[ERR_TICKET_ORDER_INVALID_STATE]
          - errors[ERR_SPECIAL_EVENT_INVALID_STATE]
        distinguishing_aspect: |
          Each state machine owns its own invalid-state code, and each is reached by repeating a transition
          that has already been taken - the cheapest way to be certain the source state is wrong and nothing
          else is. It fails if one shared code covers several machines, or if a repeated transition is silently
          accepted as a no-op.
        test_recipe:
          setup:
            - "Canonical venue / distributor / title / CONFIRMED booking / CLEARED clearance / non-encrypted DCP asset walked to INGESTED."
            - "Showtime SA at 2026-08-14T12:00:00Z was created and then CANCELLED, so it is terminal."
            - "One anonymous 2-seat order on SA was voided by that cancellation, so it is terminal too."
            - "A SpecialEvent on SA was created and then cancelled, so it is CANCELLED."
            - "Each trigger below re-issues a transition whose source state is already gone."
          setup_api_calls:
            - call: "POST /venues"
