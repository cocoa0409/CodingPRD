  # ---------------------------------------------------------------------------
  # Rule 8 — resource_temporal_overlap with DIFFERENT interval semantics
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: program_date_overlap_inclusive_intervals
        grounds:
          - validations[priority=7]
          - errors[ERR_PROGRAM_DATE_OVERLAP]
        distinguishing_aspect: |
          Resource = facility calendar; semantics = pairwise CLOSED-interval
          intersection (both bounds inclusive): program A occupies
          [2026-08-17, 2026-08-21], so program B starting exactly on A's last day
          (2026-08-21) collides, while a start one day later (2026-08-22) is free.
          Different semantics from the aggregate-capacity and strict-adjacency
          instances.
        test_recipe:
          setup:
            - "Program Alpha exists (DRAFT, dates 2026-08-17..2026-08-21)"
          setup_api_calls:
            - { call: "POST /vbs/programs", payload: { name: "VBS Alpha", program_year: 2026, start_date: "2026-08-17", end_date: "2026-08-21", registration_opens_at: "2026-07-15T00:00:00Z", registration_closes_at: "2026-08-15T23:59:59Z", supply_budget_cents: 100000, child_staff_ratio: 4, waitlist_offer_ttl_hours: 48, pickup_cutoff_time: "12:00" }, as: ProgramDirector, captures: { prog_id: $.data.id } }
          trigger:
            - { call: "POST /vbs/programs", payload: { name: "VBS Beta", program_year: 2026, start_date: "2026-08-21", end_date: "2026-08-25", registration_opens_at: "2026-07-15T00:00:00Z", registration_closes_at: "2026-08-15T23:59:59Z", supply_budget_cents: 50000 }, as: ProgramDirector, captures: { err: $.data.error_id } }
            - { call: "POST /vbs/programs", payload: { name: "VBS Gamma", program_year: 2026, start_date: "2026-08-22", end_date: "2026-08-26", registration_opens_at: "2026-07-15T00:00:00Z", registration_closes_at: "2026-08-15T23:59:59Z", supply_budget_cents: 50000 }, as: ProgramDirector, captures: { gamma_id: $.data.id } }
          assert:
            - "${err} == ERR_PROGRAM_DATE_OVERLAP  (shares 2026-08-21: closed intervals touch at both ends)"
            - "${gamma_id} != null  (2026-08-22 start clears A's inclusive end)"
            - "no Program named 'VBS Beta' exists (the rejected create persisted nothing)"
      - name: classroom_capacity_pool_counts_offers
        grounds:
          - calculations.open_seats
          - state_machines.Registration.WAITLISTED_to_OFFERED
        distinguishing_aspect: |
          Resource = Classroom seat pool; semantics = AGGREGATE CAPACITY over the
          same program interval rather than pairwise interval intersection: an
          OFFERED reservation consumes one unit of the pool even though the child
          is not enrolled. With capacity 2, enrolled_count 1 and offered_count 1,
          a new registration WAITLISTs even though enrolled_count < capacity.
        test_recipe:
          setup:
            - "Program Alpha in REGISTRATION_OPEN; Koalas (4-6, cap 2): A and B ENROLLED, C WAITLISTED; A cancelled so C is OFFERED (enrolled 1, offered 1)"
          setup_api_calls:
            - { call: "POST /vbs/programs", payload: { name: "VBS Alpha", program_year: 2026, start_date: "2026-08-17", end_date: "2026-08-21", registration_opens_at: "2026-07-15T00:00:00Z", registration_closes_at: "2026-08-15T23:59:59Z", supply_budget_cents: 100000, child_staff_ratio: 4, waitlist_offer_ttl_hours: 48, pickup_cutoff_time: "12:00" }, as: ProgramDirector, captures: { prog_id: $.data.id } }
            - { call: "POST /vbs/classrooms", payload: { program_id: "${prog_id}", name: "Koalas", age_min: 4, age_max: 6, capacity: 2 }, as: RegistrationCoordinator, captures: { cls_k: $.data.id } }
            - { call: "POST /vbs/programs/${prog_id}/open-registration", payload: {}, as: ProgramDirector }
            - { call: "POST /vbs/families", payload: { household_name: "Alvarez", primary_contact_name: "Maria Alvarez", email: "alvarez@example.com", phone: "555-0101" }, as: Anonymous, captures: { fam_id: $.data.id } }
            - { call: "POST /vbs/children", payload: { family_id: "${fam_id}", first_name: "Kid", last_name: "A", birth_date: "2020-03-15", grade_completed: "KINDERGARTEN" }, as: Parent, as_user_id: "${fam_id}", captures: { ka: $.data.id } }
            - { call: "POST /vbs/children", payload: { family_id: "${fam_id}", first_name: "Kid", last_name: "B", birth_date: "2020-03-15", grade_completed: "KINDERGARTEN" }, as: Parent, as_user_id: "${fam_id}", captures: { kb: $.data.id } }
            - { call: "POST /vbs/children", payload: { family_id: "${fam_id}", first_name: "Kid", last_name: "C", birth_date: "2020-03-15", grade_completed: "KINDERGARTEN" }, as: Parent, as_user_id: "${fam_id}", captures: { kc: $.data.id } }
            - { call: "POST /vbs/children", payload: { family_id: "${fam_id}", first_name: "Kid", last_name: "D", birth_date: "2020-03-15", grade_completed: "KINDERGARTEN" }, as: Parent, as_user_id: "${fam_id}", captures: { kd: $.data.id } }
            - { call: "POST /vbs/registrations", payload: { child_id: "${ka}", classroom_id: "${cls_k}" }, as: Parent, as_user_id: "${fam_id}", captures: { reg_a: $.data.id } }
            - { call: "POST /vbs/registrations", payload: { child_id: "${kb}", classroom_id: "${cls_k}" }, as: Parent, as_user_id: "${fam_id}" }
            - { call: "POST /vbs/registrations", payload: { child_id: "${kc}", classroom_id: "${cls_k}" }, as: Parent, as_user_id: "${fam_id}", captures: { reg_c: $.data.id } }
            - { call: "POST /vbs/registrations/${reg_a}/cancel", payload: {}, as: Parent, as_user_id: "${fam_id}" }
          trigger:
            - { call: "POST /vbs/registrations", payload: { child_id: "${kd}", classroom_id: "${cls_k}" }, as: Parent, as_user_id: "${fam_id}", captures: { d_status: $.data.status, d_pos: $.data.waitlist_position } }
            - { call: "GET /vbs/classrooms/${cls_k}", payload: {}, as: RegistrationCoordinator, captures: { k_enr: $.data.enrolled_count, k_off: $.data.offered_count, k_seats: $.data.open_seats } }
          assert:
            - "${d_status} == WAITLISTED and ${d_pos} == 1  (pool is full despite enrolled_count 1 < capacity 2)"
            - "${k_enr} == 1 and ${k_off} == 1 and ${k_seats} == 0  (OFFERED reservations occupy the aggregate pool)"
      - name: program_day_append_strict_adjacency
        grounds:
          - validations[priority=7]
          - errors[ERR_DAY_NOT_SEQUENTIAL]
        distinguishing_aspect: |
          Resource = program calendar spine; semantics = STRICT ADJACENCY (the new
          interval must touch the previous one exactly: previous date + 1 day),
          which rejects BOTH gaps and overlaps — a third interval geometry unlike
          closed-intersection or aggregate capacity.
        test_recipe:
          setup:
            - "Program Alpha (DRAFT, dates 2026-08-17..2026-08-21) with day 1 = 2026-08-17 already appended"
          setup_api_calls:
            - { call: "POST /vbs/programs", payload: { name: "VBS Alpha", program_year: 2026, start_date: "2026-08-17", end_date: "2026-08-21", registration_opens_at: "2026-07-15T00:00:00Z", registration_closes_at: "2026-08-15T23:59:59Z", supply_budget_cents: 100000, child_staff_ratio: 4, waitlist_offer_ttl_hours: 48, pickup_cutoff_time: "12:00" }, as: ProgramDirector, captures: { prog_id: $.data.id } }
            - { call: "POST /vbs/days", payload: { program_id: "${prog_id}", date: "2026-08-17" }, as: ProgramDirector, captures: { day1: $.data.id, day1_idx: $.data.day_index } }
          trigger:
            - { call: "POST /vbs/days", payload: { program_id: "${prog_id}", date: "2026-08-19" }, as: ProgramDirector, captures: { err_gap: $.data.error_id } }
            - { call: "POST /vbs/days", payload: { program_id: "${prog_id}", date: "2026-08-18" }, as: ProgramDirector, captures: { day2_idx: $.data.day_index } }
            - { call: "POST /vbs/days", payload: { program_id: "${prog_id}", date: "2026-08-17" }, as: ProgramDirector, captures: { err_dup: $.data.error_id } }
          assert:
            - "${err_gap} == ERR_DAY_NOT_SEQUENTIAL  (gap day rejected: adjacency is mandatory, not optional)"
            - "${day1_idx} == 1 and ${day2_idx} == 2  (strict append assigns sequential indexes)"
            - "${err_dup} == ERR_DAY_NOT_SEQUENTIAL  (re-occupying an existing date is equally rejected)"

  # ---------------------------------------------------------------------------
  # Rule 9 — compensating_invariant over DIFFERENT conserved quantities
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: seat_conservation_cancel_then_accept
        grounds:
          - state_machines.Registration.ENROLLED_to_CANCELLED
          - state_machines.Registration.OFFERED_to_ENROLLED
          - calculations.open_seats
        distinguishing_aspect: |
          Conserved quantity = classroom.enrolled_count == |{registrations with
          status ENROLLED}|. Forward action (cancel enrollee, -1) paired with the
          compensating action (promoted family accepts, +1) returns the quantity
          to its original value 2 with zero drift; the OFFERED seat reservation
          is converted, not duplicated.
        test_recipe:
          setup:
            - "Program Alpha in REGISTRATION_OPEN; Koalas (4-6, cap 2) FULL: A, B ENROLLED; C WAITLISTED"
          setup_api_calls:
            - { call: "POST /vbs/programs", payload: { name: "VBS Alpha", program_year: 2026, start_date: "2026-08-17", end_date: "2026-08-21", registration_opens_at: "2026-07-15T00:00:00Z", registration_closes_at: "2026-08-15T23:59:59Z", supply_budget_cents: 100000, child_staff_ratio: 4, waitlist_offer_ttl_hours: 48, pickup_cutoff_time: "12:00" }, as: ProgramDirector, captures: { prog_id: $.data.id } }
            - { call: "POST /vbs/classrooms", payload: { program_id: "${prog_id}", name: "Koalas", age_min: 4, age_max: 6, capacity: 2 }, as: RegistrationCoordinator, captures: { cls_k: $.data.id } }
            - { call: "POST /vbs/programs/${prog_id}/open-registration", payload: {}, as: ProgramDirector }
            - { call: "POST /vbs/families", payload: { household_name: "Alvarez", primary_contact_name: "Maria Alvarez", email: "alvarez@example.com", phone: "555-0101" }, as: Anonymous, captures: { fam_id: $.data.id } }
            - { call: "POST /vbs/children", payload: { family_id: "${fam_id}", first_name: "Kid", last_name: "A", birth_date: "2020-03-15", grade_completed: "KINDERGARTEN" }, as: Parent, as_user_id: "${fam_id}", captures: { ka: $.data.id } }
            - { call: "POST /vbs/children", payload: { family_id: "${fam_id}", first_name: "Kid", last_name: "B", birth_date: "2020-03-15", grade_completed: "KINDERGARTEN" }, as: Parent, as_user_id: "${fam_id}", captures: { kb: $.data.id } }
            - { call: "POST /vbs/children", payload: { family_id: "${fam_id}", first_name: "Kid", last_name: "C", birth_date: "2020-03-15", grade_completed: "KINDERGARTEN" }, as: Parent, as_user_id: "${fam_id}", captures: { kc: $.data.id } }
            - { call: "POST /vbs/registrations", payload: { child_id: "${ka}", classroom_id: "${cls_k}" }, as: Parent, as_user_id: "${fam_id}", captures: { reg_a: $.data.id } }
            - { call: "POST /vbs/registrations", payload: { child_id: "${kb}", classroom_id: "${cls_k}" }, as: Parent, as_user_id: "${fam_id}" }
            - { call: "POST /vbs/registrations", payload: { child_id: "${kc}", classroom_id: "${cls_k}" }, as: Parent, as_user_id: "${fam_id}", captures: { reg_c: $.data.id } }
          trigger:
            - { call: "POST /vbs/registrations/${reg_a}/cancel", payload: {}, as: Parent, as_user_id: "${fam_id}" }
            - { call: "GET /vbs/classrooms/${cls_k}", payload: {}, as: RegistrationCoordinator, captures: { mid_enr: $.data.enrolled_count, mid_off: $.data.offered_count } }
            - { call: "POST /vbs/registrations/${reg_c}/accept", payload: {}, as: Parent, as_user_id: "${fam_id}", captures: { c_status: $.data.status } }
            - { call: "GET /vbs/classrooms/${cls_k}", payload: {}, as: RegistrationCoordinator, captures: { fin_enr: $.data.enrolled_count, fin_off: $.data.offered_count, fin_status: $.data.status } }
            - { call: "GET /vbs/registrations", payload: { classroom_id: "${cls_k}", status: "ENROLLED" }, as: RegistrationCoordinator, captures: { fin_listed: "$.data[0].status" } }
          assert:
            - "${mid_enr} == 1 and ${mid_off} == 1  (forward action: seat freed then reserved by the offer)"
            - "${c_status} == ENROLLED"
            - "${fin_enr} == 2 and ${fin_off} == 0 and ${fin_status} == FULL  (compensation restores the original count exactly)"
            - "Classroom.${cls_k}.enrolled_count == count of ENROLLED registrations in the filtered list (field and source rows never drift)"
      - name: stock_conservation_plan_then_cancel
        grounds:
          - state_machines.SupplyDistribution.PLANNED_to_CANCELLED
          - state_machines.SupplyDistribution.PLANNED_to_ISSUED
          - entities.SupplyItem.fields.reserved_quantity
        distinguishing_aspect: |
          Conserved quantity = SupplyItem.reserved_quantity == sum of its PLANNED
          distributions' quantities, with quantity_on_hand mutated ONLY by issue.
          Plan(3) + cancel(3) leaves on_hand 5 and reserved 0 (perfectly
          compensated); plan(3) + issue(3) moves exactly 3 from on_hand to issued
          with reserved back at 0. Different conserved quantity from the seat-count
          instance.
        test_recipe:
          setup:
            - "Program Alpha (DRAFT) with Koalas classroom, day 2026-08-17 SCHEDULED, and CRAFT item 'Glue Packs' with quantity_on_hand 5"
          setup_api_calls:
            - { call: "POST /vbs/programs", payload: { name: "VBS Alpha", program_year: 2026, start_date: "2026-08-17", end_date: "2026-08-21", registration_opens_at: "2026-07-15T00:00:00Z", registration_closes_at: "2026-08-15T23:59:59Z", supply_budget_cents: 100000, child_staff_ratio: 4, waitlist_offer_ttl_hours: 48, pickup_cutoff_time: "12:00" }, as: ProgramDirector, captures: { prog_id: $.data.id } }
            - { call: "POST /vbs/classrooms", payload: { program_id: "${prog_id}", name: "Koalas", age_min: 4, age_max: 6, capacity: 10 }, as: RegistrationCoordinator, captures: { cls_k: $.data.id } }
            - { call: "POST /vbs/days", payload: { program_id: "${prog_id}", date: "2026-08-17" }, as: ProgramDirector, captures: { day1: $.data.id } }
            - { call: "POST /vbs/supply-items", payload: { program_id: "${prog_id}", name: "Glue Packs", category: "CRAFT", unit: "pack", quantity_on_hand: 5 }, as: ProgramDirector, captures: { item: $.data.id } }
          trigger:
            - { call: "POST /vbs/supply-distributions", payload: { supply_item_id: "${item}", classroom_id: "${cls_k}", program_day_id: "${day1}", quantity: 3 }, as: ProgramDirector, captures: { dist1: $.data.id } }
            - { call: "GET /vbs/supply-items/${item}", payload: {}, as: ProgramDirector, captures: { r1: $.data.reserved_quantity, h1: $.data.quantity_on_hand, a1: $.data.available_quantity } }
            - { call: "POST /vbs/supply-distributions/${dist1}/cancel", payload: {}, as: ProgramDirector }
            - { call: "GET /vbs/supply-items/${item}", payload: {}, as: ProgramDirector, captures: { r2: $.data.reserved_quantity, h2: $.data.quantity_on_hand } }
            - { call: "POST /vbs/supply-distributions", payload: { supply_item_id: "${item}", classroom_id: "${cls_k}", program_day_id: "${day1}", quantity: 3 }, as: ProgramDirector, captures: { dist2: $.data.id } }
            - { call: "POST /vbs/supply-distributions/${dist2}/issue", payload: {}, as: ProgramDirector }
            - { call: "GET /vbs/supply-items/${item}", payload: {}, as: ProgramDirector, captures: { r3: $.data.reserved_quantity, h3: $.data.quantity_on_hand } }
          assert:
            - "${r1} == 3 and ${h1} == 5 and ${a1} == 2  (planning reserves without touching on-hand)"
            - "${r2} == 0 and ${h2} == 5  (cancel fully compensates: both quantities identical to pre-plan)"
            - "${r3} == 0 and ${h3} == 2  (issue moves exactly 3 out of on-hand; reserved returns to 0)"
            - "SupplyItem.${item}.reserved_quantity == sum of PLANNED distribution quantities (== 0) at every checkpoint"
