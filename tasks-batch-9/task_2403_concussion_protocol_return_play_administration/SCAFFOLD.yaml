  # ---- ReturnStep -----------------------------------------------------------
  - method: POST
    path: /concussion-program/return-steps/{id}/evaluate
    roles: [ClubPhysician]
    input: [outcome, symptom_score]
    output: ReturnStep
    status: 200
    side_effects:
      - "outcome PASS -> status = PASSED, case.rtp_stage = stage_index, and on stage 5 the FINAL_ACCRUED earliest_return_at is computed"
      - "outcome SYMPTOM_RECURRENCE -> status = FAILED_SYMPTOM_RECURRENCE, case.recurrence_count += 1, rtp_stage = max(0, stage_index - 2), earliest_return_at = null, severity_index recomputed, and monitoring_status = PROLONGED_SYMPTOM_WATCH once recurrence_count >= 2 (which drives the player to PROTOCOL_RESTRICTED and OUT)"
      - "sets evaluated_at = now, cleared_by_clinician_id = X-User-ID, evaluation_symptom_score"
      - "increments ReturnStep.version, ConcussionCase.version and (when touched) Player.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_RESOURCE_NOT_FOUND, ERR_ROLE_IDENTITY_MISMATCH, ERR_CLUB_SCOPE_VIOLATION, ERR_CLINICIAN_SUSPENDED, ERR_CLINICIAN_CREDENTIAL_EXPIRED, ERR_STEP_STATE_INVALID, ERR_CASE_STAGE_FROZEN, ERR_HEIGHTENED_REVIEW_CLINICIAN_REQUIRED, ERR_STAGE_DWELL_NOT_MET, ERR_SYMPTOM_OUTCOME_MISMATCH]

  - method: GET
