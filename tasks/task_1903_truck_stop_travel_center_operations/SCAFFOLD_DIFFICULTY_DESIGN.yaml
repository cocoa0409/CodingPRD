  # =====================================================================
  # Rule 3 - non_linear_state_machine (different entities)
  # =====================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: fuel_sale_parallel_status_dimensions
        grounds:
          - state_machines.FuelSale
          - state_machines.FuelSale.payment_status
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          FuelSale carries two independent state dimensions (status x payment_status) on one row:
          payment actions are rejected while status is pre-COMPLETED, dispensing actions are
          rejected once status advances, and a paid COMPLETED sale can still be refund-voided,
          flipping payment_status PAID -> REFUNDED while status -> VOIDED.
        test_recipe:
          setup:
            - "Site with DIESEL price 385, pump, register float 20000, OPEN shift; member 9000 pts with ACTIVE FleetPass enrollment; clock 2026-08-12T10:00:00Z"
            - "FuelSale authorized: RETAIL DIESEL, redeem 200, max_gallons 40.000"
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "Site F", parking_total_spaces: 60, parking_paid_capacity: 2, shower_units_count: 1, laundry_machines_count: 1 }, as: GeneralManager, captures: { site_id: "$.data.id", site_v: "$.data.version" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-12T10:00:00Z" }, as: GeneralManager }
            - { call: "POST /sites/${site_id}/fuel-prices", payload: { fuel_type: "DIESEL", retail_cents_per_gallon: 385, effective_from: "2026-08-01T00:00:00Z", expected_site_version: "${site_v}" }, as: FuelDeskLead }
            - { call: "POST /sites/${site_id}/pumps", payload: { pump_number: 1, fuel_types: ["DIESEL"] }, as: FuelDeskLead, captures: { pump_id: "$.data.id" } }
            - { call: "POST /sites/${site_id}/registers", payload: { register_code: "R1", float_cents: 20000 }, as: GeneralManager, captures: { reg_id: "$.data.id" } }
            - { call: "POST /sites/${site_id}/shifts", payload: { register_id: "${reg_id}", cashier_user_id: "cash-1", shift_label: "DAY" }, as: ShiftManager, as_user_id: "sm-1", captures: { shift_id: "$.data.id" } }
            - { call: "POST /loyalty-members", payload: { full_name: "Driver A", email: "a@x.com" }, as: Cashier, as_user_id: "cash-1", captures: { m_id: "$.data.id" } }
            - { call: "POST /loyalty-members/${m_id}/adjustments", payload: { points_delta: 9000, reason: "seed" }, as: GeneralManager }
            - { call: "POST /discount-networks", payload: { name: "FleetPass", discount_per_gallon: 0.10, applicable_fuel_types: ["DIESEL"], program_cap: 2 }, as: GeneralManager, captures: { net_id: "$.data.id" } }
            - { call: "POST /discount-networks/${net_id}/activate", payload: {}, as: GeneralManager }
            - { call: "POST /loyalty-members/${m_id}/discount-enrollments", payload: { network_program_id: "${net_id}" }, as: Cashier, as_user_id: "cash-1", captures: { en_id: "$.data.id" } }
            - { call: "POST /discount-enrollments/${en_id}/activate", payload: {}, as: Cashier, as_user_id: "cash-1" }
            - { call: "POST /sites/${site_id}/fuel-sales", payload: { pump_id: "${pump_id}", shift_id: "${shift_id}", pricing_mode: "RETAIL", fuel_type: "DIESEL", tender_type: "CASH", loyalty_member_id: "${m_id}", requested_redeem_points: 200, max_gallons: 40.0 }, as: Cashier, as_user_id: "cash-1", captures: { sale_id: "$.data.id" } }
          trigger:
            - { call: "POST /fuel-sales/${sale_id}/pay", payload: { tender_type: "CASH" }, as: Cashier, as_user_id: "cash-1", captures: { err_pay_early: "$.data.error_id" } }
            - { call: "POST /fuel-sales/${sale_id}/dispensing-start", payload: {}, as: Cashier, as_user_id: "cash-1" }
            - { call: "POST /fuel-sales/${sale_id}/dispensing-complete", payload: { dispensed_gallons: 38.0 }, as: Cashier, as_user_id: "cash-1" }
            - { call: "POST /fuel-sales/${sale_id}/finalize", payload: {}, as: Cashier, as_user_id: "cash-1", captures: { st_after_fin: "$.data.status", ps_after_fin: "$.data.payment_status" } }
            - { call: "POST /fuel-sales/${sale_id}/dispensing-start", payload: {}, as: Cashier, as_user_id: "cash-1", captures: { err_re_dispense: "$.data.error_id" } }
            - { call: "POST /fuel-sales/${sale_id}/pay", payload: { tender_type: "CASH" }, as: Cashier, as_user_id: "cash-1", captures: { ps_paid: "$.data.payment_status", st_paid: "$.data.status" } }
            - { call: "GET /shifts/${shift_id}", payload: {}, as: ShiftManager, as_user_id: "sm-2", captures: { expected_paid: "$.data.expected_cash_cents" } }
            - { call: "POST /fuel-sales/${sale_id}/void", payload: { reason: "customer dispute" }, as: ShiftManager, as_user_id: "sm-2", captures: { st_void: "$.data.status", ps_void: "$.data.payment_status" } }
            - { call: "GET /shifts/${shift_id}", payload: {}, as: ShiftManager, as_user_id: "sm-2", captures: { expected_void: "$.data.expected_cash_cents" } }
            - { call: "GET /loyalty-members/${m_id}", payload: {}, as: Cashier, as_user_id: "cash-1", captures: { bal: "$.data.points_balance" } }
          assert:
            - "err_pay_early == ERR_INVALID_STATE (payment dimension gated on status == COMPLETED)"
            - "after finalize: status == COMPLETED and payment_status == UNPAID (dimensions evolve independently)"
            - "err_re_dispense == ERR_INVALID_STATE (dispensing-start valid only from AUTHORIZED)"
            - "after pay: payment_status == PAID while status stays COMPLETED"
            - "shift expected_cash_cents == 30450 after cash pay"
            - "after refund-void: status == VOIDED and payment_status == REFUNDED"
            - "shift expected_cash_cents back to 20000 after void (cash reversal)"
            - "member points_balance == 9000 (burn 200 and earn 52 at finalize, then +200 restore and -52 clawback at void)"

      - name: service_ticket_no_show_requeue_cycle
        grounds:
          - state_machines.ServiceQueueTicket
          - entities.ServiceQueueTicket.fields.queue_position
        distinguishing_aspect: |
          ServiceQueueTicket is cyclic (QUEUED -> CALLED -> NO_SHOW -> QUEUED) on a different
          entity than FuelSale: a no-show ticket can be requeued to the back and called again,
          with queue_position monotonically reassigned as max+1 across the loop.
        test_recipe:
          setup:
            - "Site with shower_units_count 1, register, OPEN shift; clock 2026-08-12T10:00:00Z (Wednesday off-peak)"
            - "Three SHOWER tickets t1, t2, t3 created in order (positions 1, 2, 3)"
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "Site G", parking_total_spaces: 60, parking_paid_capacity: 2, shower_units_count: 1, laundry_machines_count: 1 }, as: GeneralManager, captures: { site_id: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-12T10:00:00Z" }, as: GeneralManager }
            - { call: "POST /sites/${site_id}/registers", payload: { register_code: "R1", float_cents: 20000 }, as: GeneralManager, captures: { reg_id: "$.data.id" } }
            - { call: "POST /sites/${site_id}/shifts", payload: { register_id: "${reg_id}", cashier_user_id: "cash-1", shift_label: "DAY" }, as: ShiftManager, as_user_id: "sm-1", captures: { shift_id: "$.data.id" } }
            - { call: "POST /sites/${site_id}/service-tickets", payload: { service_type: "SHOWER", shift_id: "${shift_id}" }, as: Cashier, as_user_id: "cash-1", captures: { t1: "$.data.id", t1_pos: "$.data.queue_position" } }
            - { call: "POST /sites/${site_id}/service-tickets", payload: { service_type: "SHOWER", shift_id: "${shift_id}" }, as: Cashier, as_user_id: "cash-1", captures: { t2: "$.data.id", t2_pos: "$.data.queue_position" } }
            - { call: "POST /sites/${site_id}/service-tickets", payload: { service_type: "SHOWER", shift_id: "${shift_id}" }, as: Cashier, as_user_id: "cash-1", captures: { t3: "$.data.id", t3_pos: "$.data.queue_position" } }
          trigger:
            - { call: "POST /sites/${site_id}/service-queue/call", payload: { service_type: "SHOWER" }, as: Cashier, as_user_id: "cash-1", captures: { call1_id: "$.data.id" } }
            - { call: "POST /sites/${site_id}/service-queue/call", payload: { service_type: "SHOWER" }, as: Cashier, as_user_id: "cash-1", captures: { call2_id: "$.data.id" } }
            - { call: "POST /service-tickets/${t1}/no-show", payload: {}, as: Cashier, as_user_id: "cash-1" }
            - { call: "POST /service-tickets/${t1}/requeue", payload: {}, as: Cashier, as_user_id: "cash-1", captures: { t1_repos: "$.data.queue_position", t1_restatus: "$.data.status" } }
            - { call: "POST /sites/${site_id}/service-queue/call", payload: { service_type: "SHOWER" }, as: Cashier, as_user_id: "cash-1", captures: { call3_id: "$.data.id" } }
            - { call: "POST /service-tickets/${t3}/start", payload: {}, as: Cashier, as_user_id: "cash-1" }
            - { call: "POST /service-tickets/${t3}/complete", payload: { shower_minutes: 20 }, as: Cashier, as_user_id: "cash-1", captures: { t3_water: "$.data.water_gallons", t3_status: "$.data.status" } }
          assert:
            - "t1_pos == 1, t2_pos == 2, t3_pos == 3 (creation order assigns positions)"
            - "call1_id == t1 and call2_id == t2 (FIFO by lowest queue_position)"
            - "after requeue: t1 status == QUEUED with queue_position == 4 (back of queue, max+1)"
            - "call3_id == t3 (position 3 called before requeued position 4)"
            - "t3 completes with water_gallons == 50.0 (20 min x 2.5 gpm)"
            - "loop closed: NO_SHOW -> QUEUED -> CALLED -> ACTIVE -> COMPLETED all reachable on one ticket lineage"

  # =====================================================================
  # Rule 4 - transitive_cascade (different triggers; depths 3 and 3)
  # =====================================================================
  - rule_id: transitive_cascade
    instances:
      - name: payout_expected_posture_close_block
        grounds:
          - state_machines.Shift.OPEN_to_CLOSED
          - entities.Register.fields.posture
          - calculations.shift_expected_cash
          - errors[ERR_REMAINING_BELOW_FLOAT]
        distinguishing_aspect: |
          Cascade of depth 3 from the payout trigger: payout mutates Shift.expected_cash_cents
          (hop 1); the expected-cash mutation flips Register.posture OK -> LOW_FLOAT (hop 2, a
          different entity); the lowered expected then blocks shift close with
          ERR_REMAINING_BELOW_FLOAT (hop 3, behavioral gate on Shift). Originating trigger is
          POST /shifts/{id}/payouts, distinct from the fuel-sale finalize trigger of the other
          cascade instance.
        test_recipe:
          setup:
            - "Site with DIESEL price 385, pump, register float 20000, OPEN shift; member 9000 pts enrolled in FleetPass; clock 2026-08-12T10:00:00Z"
            - "A cash fuel sale of 10450 cents is paid, bringing expected cash to 30450"
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "Site H", parking_total_spaces: 60, parking_paid_capacity: 2, shower_units_count: 1, laundry_machines_count: 1 }, as: GeneralManager, captures: { site_id: "$.data.id", site_v: "$.data.version" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-12T10:00:00Z" }, as: GeneralManager }
            - { call: "POST /sites/${site_id}/fuel-prices", payload: { fuel_type: "DIESEL", retail_cents_per_gallon: 385, effective_from: "2026-08-01T00:00:00Z", expected_site_version: "${site_v}" }, as: FuelDeskLead }
            - { call: "POST /sites/${site_id}/pumps", payload: { pump_number: 1, fuel_types: ["DIESEL"] }, as: FuelDeskLead, captures: { pump_id: "$.data.id" } }
            - { call: "POST /sites/${site_id}/registers", payload: { register_code: "R1", float_cents: 20000 }, as: GeneralManager, captures: { reg_id: "$.data.id" } }
            - { call: "POST /sites/${site_id}/shifts", payload: { register_id: "${reg_id}", cashier_user_id: "cash-1", shift_label: "DAY" }, as: ShiftManager, as_user_id: "sm-1", captures: { shift_id: "$.data.id" } }
            - { call: "POST /loyalty-members", payload: { full_name: "Driver A", email: "a@x.com" }, as: Cashier, as_user_id: "cash-1", captures: { m_id: "$.data.id" } }
            - { call: "POST /loyalty-members/${m_id}/adjustments", payload: { points_delta: 9000, reason: "seed" }, as: GeneralManager }
            - { call: "POST /discount-networks", payload: { name: "FleetPass", discount_per_gallon: 0.10, applicable_fuel_types: ["DIESEL"], program_cap: 2 }, as: GeneralManager, captures: { net_id: "$.data.id" } }
            - { call: "POST /discount-networks/${net_id}/activate", payload: {}, as: GeneralManager }
            - { call: "POST /loyalty-members/${m_id}/discount-enrollments", payload: { network_program_id: "${net_id}" }, as: Cashier, as_user_id: "cash-1", captures: { en_id: "$.data.id" } }
            - { call: "POST /discount-enrollments/${en_id}/activate", payload: {}, as: Cashier, as_user_id: "cash-1" }
            - { call: "POST /sites/${site_id}/fuel-sales", payload: { pump_id: "${pump_id}", shift_id: "${shift_id}", pricing_mode: "RETAIL", fuel_type: "DIESEL", tender_type: "CASH", loyalty_member_id: "${m_id}", requested_redeem_points: 200, max_gallons: 40.0 }, as: Cashier, as_user_id: "cash-1", captures: { sale_id: "$.data.id" } }
            - { call: "POST /fuel-sales/${sale_id}/dispensing-start", payload: {}, as: Cashier, as_user_id: "cash-1" }
            - { call: "POST /fuel-sales/${sale_id}/dispensing-complete", payload: { dispensed_gallons: 38.0 }, as: Cashier, as_user_id: "cash-1" }
            - { call: "POST /fuel-sales/${sale_id}/finalize", payload: {}, as: Cashier, as_user_id: "cash-1" }
            - { call: "POST /fuel-sales/${sale_id}/pay", payload: { tender_type: "CASH" }, as: Cashier, as_user_id: "cash-1" }
            - { call: "GET /registers/${reg_id}", payload: {}, as: ShiftManager, as_user_id: "sm-2", captures: { posture_before: "$.data.posture" } }
          trigger:
            - { call: "POST /shifts/${shift_id}/payouts", payload: { amount_cents: 25000, reason: "armored car early pickup" }, as: ShiftManager, as_user_id: "sm-2", captures: { expected_after: "$.data.expected_cash_cents" } }
            - { call: "GET /registers/${reg_id}", payload: {}, as: ShiftManager, as_user_id: "sm-2", captures: { posture_after: "$.data.posture" } }
            - { call: "POST /shifts/${shift_id}/close", payload: { counted_cash_cents: 5450 }, as: ShiftManager, as_user_id: "sm-2", captures: { close_err: "$.data.error_id" } }
            - { call: "GET /shifts/${shift_id}", payload: {}, as: ShiftManager, as_user_id: "sm-2", captures: { shift_status: "$.data.status" } }
          assert:
            - "hop 1: payout response expected_cash_cents == 5450 (30450 - 25000)"
            - "hop 2: Register.posture goes OK -> LOW_FLOAT (5450 < 20000 float) as a consequence of the shift mutation"
            - "hop 3: close is rejected with ERR_REMAINING_BELOW_FLOAT because expected 5450 < float 20000"
            - "Shift.status remains OPEN after the blocked close"
            - "posture_before == OK (30450 neither > 5x float nor < 1x float)"

      - name: contract_finalize_volume_tier_upgrade
        grounds:
          - state_machines.FuelSale.PENDING_FINALIZE_to_COMPLETED
          - entities.FleetContract.fields.volume_delivered_gallons
          - entities.FleetAccount.fields.rolling_30d_gallons
          - calculations.fleet_tier_recompute
        distinguishing_aspect: |
          Cascade of depth 3 from the finalize trigger: finalize mutates
          FleetContract.volume_delivered_gallons (hop 1); the volume mutation recomputes
          FleetAccount.rolling_30d_gallons (hop 2, different entity); crossing the inclusive
          5000-gallon breakpoint flips FleetAccount.pricing_tier T1 -> T2 (hop 3). Originating
          trigger is POST /fuel-sales/{id}/finalize, distinct from the payout trigger of the
          other cascade instance.
        test_recipe:
          setup:
            - "Site with DIESEL tank (rack 2.7000), pump, register, OPEN shift; clock 2026-08-12T10:00:00Z"
            - "Fleet (limit 50000000, tier T1) with ACTIVE contract C-1 (tier T1, discount 0.00)"
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "Site I", parking_total_spaces: 60, parking_paid_capacity: 2, shower_units_count: 1, laundry_machines_count: 1 }, as: GeneralManager, captures: { site_id: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-12T10:00:00Z" }, as: GeneralManager }
            - { call: "POST /sites/${site_id}/bulk-tanks", payload: { product_type: "DIESEL", capacity_gallons: 20000, reorder_threshold_gallons: 3000, safety_stock_gallons: 1500, daily_usage_gallons: 950, lead_time_days: 4, initial_gallons: 8500, rack_price_cents_per_gallon_4dp: 2.7000 }, as: GeneralManager, captures: { tank_id: "$.data.id" } }
            - { call: "POST /sites/${site_id}/pumps", payload: { pump_number: 1, fuel_types: ["DIESEL"] }, as: FuelDeskLead, captures: { pump_id: "$.data.id" } }
            - { call: "POST /sites/${site_id}/registers", payload: { register_code: "R1", float_cents: 20000 }, as: GeneralManager, captures: { reg_id: "$.data.id" } }
            - { call: "POST /sites/${site_id}/shifts", payload: { register_id: "${reg_id}", cashier_user_id: "cash-1", shift_label: "DAY" }, as: ShiftManager, as_user_id: "sm-1", captures: { shift_id: "$.data.id" } }
            - { call: "POST /fleet-accounts", payload: { name: "Fleet A", credit_limit_cents: 50000000, pricing_tier: "T1" }, as: GeneralManager, captures: { f_id: "$.data.id" } }
            - { call: "POST /fleet-accounts/${f_id}/contracts", payload: { contract_code: "C-1", pricing_tier: "T1", discount_per_gallon_off: 0.0, applicable_fuel_types: ["DIESEL"], effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-08-01T00:00:00Z" }, as: GeneralManager, captures: { c1_id: "$.data.id" } }
            - { call: "POST /contracts/${c1_id}/activate", payload: {}, as: GeneralManager }
            - { call: "POST /sites/${site_id}/fuel-sales", payload: { pump_id: "${pump_id}", shift_id: "${shift_id}", pricing_mode: "CONTRACT", fuel_type: "DIESEL", tender_type: "FLEET_BILLING", fleet_account_id: "${f_id}", contract_id: "${c1_id}", max_gallons: 4900.0 }, as: Cashier, as_user_id: "cash-1", captures: { s1_id: "$.data.id" } }
            - { call: "POST /fuel-sales/${s1_id}/dispensing-start", payload: {}, as: Cashier, as_user_id: "cash-1" }
            - { call: "POST /fuel-sales/${s1_id}/dispensing-complete", payload: { dispensed_gallons: 4900.0 }, as: Cashier, as_user_id: "cash-1" }
            - { call: "POST /fuel-sales/${s1_id}/finalize", payload: {}, as: Cashier, as_user_id: "cash-1" }
            - { call: "GET /contracts/${c1_id}", payload: {}, as: GeneralManager, captures: { vol_mid: "$.data.volume_delivered_gallons" } }
            - { call: "GET /fleet-accounts/${f_id}", payload: {}, as: GeneralManager, captures: { rolling_mid: "$.data.rolling_30d_gallons", tier_mid: "$.data.pricing_tier" } }
          trigger:
            - { call: "POST /sites/${site_id}/fuel-sales", payload: { pump_id: "${pump_id}", shift_id: "${shift_id}", pricing_mode: "CONTRACT", fuel_type: "DIESEL", tender_type: "FLEET_BILLING", fleet_account_id: "${f_id}", contract_id: "${c1_id}", max_gallons: 200.0 }, as: Cashier, as_user_id: "cash-1", captures: { s2_id: "$.data.id" } }
            - { call: "POST /fuel-sales/${s2_id}/dispensing-start", payload: {}, as: Cashier, as_user_id: "cash-1" }
            - { call: "POST /fuel-sales/${s2_id}/dispensing-complete", payload: { dispensed_gallons: 200.0 }, as: Cashier, as_user_id: "cash-1" }
            - { call: "POST /fuel-sales/${s2_id}/finalize", payload: {}, as: Cashier, as_user_id: "cash-1" }
            - { call: "GET /contracts/${c1_id}", payload: {}, as: GeneralManager, captures: { vol_end: "$.data.volume_delivered_gallons" } }
            - { call: "GET /fleet-accounts/${f_id}", payload: {}, as: GeneralManager, captures: { rolling_end: "$.data.rolling_30d_gallons", tier_end: "$.data.pricing_tier" } }
          assert:
            - "after sale1 finalize: contract volume_delivered_gallons == 4900.0 (hop 1), fleet rolling_30d_gallons == 4900.0 (hop 2), tier still T1 (4900 < 5000)"
            - "after sale2 finalize: contract volume == 5100.0 (hop 1 again)"
            - "fleet rolling_30d_gallons == 5100.0 (hop 2)"
            - "fleet pricing_tier == T2 (hop 3: inclusive breakpoint 5000 crossed by the volume mutation)"
            - "each hop is caused by the previous link, not by the original authorize call"

  # =====================================================================
  # Rule 5 - priority_pair_validation_conflict (different error-category pairs)
  # =====================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: pump_state_beats_points_fiscal
        grounds:
          - validations[priority=8]
          - validations[priority=33]
          - errors[ERR_PUMP_NOT_AVAILABLE]
          - errors[ERR_NO_POINTS]
        distinguishing_aspect: |
          Category pair state-vs-business_fiscal: a single authorize request that violates both
          pump occupancy (state, priority 8) and points affordability (business_fiscal,
          priority 33) must return ERR_PUMP_NOT_AVAILABLE, never ERR_NO_POINTS.
        test_recipe:
          setup:
            - "Site with DIESEL price 385, ONE pump, register, OPEN shift; clock 2026-08-12T10:00:00Z"
            - "Member with 9000 points and ACTIVE FleetPass enrollment"
            - "Sale 1 already authorized on the pump (pump is IN_USE)"
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "Site J", parking_total_spaces: 60, parking_paid_capacity: 2, shower_units_count: 1, laundry_machines_count: 1 }, as: GeneralManager, captures: { site_id: "$.data.id", site_v: "$.data.version" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-12T10:00:00Z" }, as: GeneralManager }
            - { call: "POST /sites/${site_id}/fuel-prices", payload: { fuel_type: "DIESEL", retail_cents_per_gallon: 385, effective_from: "2026-08-01T00:00:00Z", expected_site_version: "${site_v}" }, as: FuelDeskLead }
            - { call: "POST /sites/${site_id}/pumps", payload: { pump_number: 1, fuel_types: ["DIESEL"] }, as: FuelDeskLead, captures: { pump_id: "$.data.id" } }
            - { call: "POST /sites/${site_id}/registers", payload: { register_code: "R1", float_cents: 20000 }, as: GeneralManager, captures: { reg_id: "$.data.id" } }
            - { call: "POST /sites/${site_id}/shifts", payload: { register_id: "${reg_id}", cashier_user_id: "cash-1", shift_label: "DAY" }, as: ShiftManager, as_user_id: "sm-1", captures: { shift_id: "$.data.id" } }
            - { call: "POST /loyalty-members", payload: { full_name: "Driver A", email: "a@x.com" }, as: Cashier, as_user_id: "cash-1", captures: { m_id: "$.data.id" } }
            - { call: "POST /loyalty-members/${m_id}/adjustments", payload: { points_delta: 9000, reason: "seed" }, as: GeneralManager }
            - { call: "POST /discount-networks", payload: { name: "FleetPass", discount_per_gallon: 0.10, applicable_fuel_types: ["DIESEL"], program_cap: 2 }, as: GeneralManager, captures: { net_id: "$.data.id" } }
            - { call: "POST /discount-networks/${net_id}/activate", payload: {}, as: GeneralManager }
            - { call: "POST /loyalty-members/${m_id}/discount-enrollments", payload: { network_program_id: "${net_id}" }, as: Cashier, as_user_id: "cash-1", captures: { en_id: "$.data.id" } }
            - { call: "POST /discount-enrollments/${en_id}/activate", payload: {}, as: Cashier, as_user_id: "cash-1" }
            - { call: "POST /sites/${site_id}/fuel-sales", payload: { pump_id: "${pump_id}", shift_id: "${shift_id}", pricing_mode: "RETAIL", fuel_type: "DIESEL", tender_type: "CASH", loyalty_member_id: "${m_id}", requested_redeem_points: 100, max_gallons: 10.0 }, as: Cashier, as_user_id: "cash-1", captures: { s1_id: "$.data.id" } }
          trigger:
            - { call: "POST /sites/${site_id}/fuel-sales", payload: { pump_id: "${pump_id}", shift_id: "${shift_id}", pricing_mode: "RETAIL", fuel_type: "DIESEL", tender_type: "CASH", loyalty_member_id: "${m_id}", requested_redeem_points: 9500, max_gallons: 10.0 }, as: Cashier, as_user_id: "cash-1", captures: { err: "$.data.error_id" } }
            - { call: "GET /sites/${site_id}/fuel-sales", payload: {}, as: GeneralManager }
            - { call: "GET /pumps/${pump_id}", payload: {}, as: GeneralManager, captures: { pump_status: "$.data.status" } }
          assert:
            - "err == ERR_PUMP_NOT_AVAILABLE (state priority 8 beats business_fiscal priority 33 even though 9500 > 9000 points balance also fails)"
            - "GET /sites/{id}/fuel-sales returns exactly 1 row (sale 1 only), total_count 1"
            - "pump remains IN_USE (held by sale 1)"

      - name: plate_referential_beats_capacity_constraint
        grounds:
          - validations[priority=17]
          - validations[priority=27]
          - errors[ERR_PLATE_NOT_REGISTERED]
          - errors[ERR_PARKING_CAPACITY_FULL]
        distinguishing_aspect: |
          Category pair business_referential-vs-business_constraint: a reservation request whose
          plate belongs to a different member (referential, priority 17) AND whose window exceeds
          the site's aggregate paid capacity (constraint, priority 27) must return
          ERR_PLATE_NOT_REGISTERED, never ERR_PARKING_CAPACITY_FULL.
        test_recipe:
          setup:
            - "Site with parking_paid_capacity 1; clock 2026-08-12T10:00:00Z"
            - "Member M1 owns plate AAA111; member M2 owns no vehicles"
            - "Reservation R1 for M1/AAA111 occupies 2026-08-12T22:00:00Z..2026-08-13T06:00:00Z (CONFIRMED)"
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "Site K", parking_total_spaces: 10, parking_paid_capacity: 1, shower_units_count: 1, laundry_machines_count: 1 }, as: GeneralManager, captures: { site_id: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-12T10:00:00Z" }, as: GeneralManager }
            - { call: "POST /loyalty-members", payload: { full_name: "Driver One", email: "one@x.com" }, as: Cashier, as_user_id: "cash-1", captures: { m1: "$.data.id" } }
            - { call: "POST /loyalty-members/${m1}/vehicles", payload: { plate: "AAA111", vehicle_type: "TRACTOR" }, as: Cashier, as_user_id: "cash-1" }
            - { call: "POST /loyalty-members", payload: { full_name: "Driver Two", email: "two@x.com" }, as: Cashier, as_user_id: "cash-1", captures: { m2: "$.data.id" } }
            - { call: "POST /sites/${site_id}/parking-reservations", payload: { loyalty_member_id: "${m1}", vehicle_plate: "AAA111", space_type: "STANDARD", reserved_from: "2026-08-12T22:00:00Z", reserved_to: "2026-08-13T06:00:00Z" }, as: Cashier, as_user_id: "cash-1", captures: { r1_id: "$.data.id" } }
          trigger:
            - { call: "POST /sites/${site_id}/parking-reservations", payload: { loyalty_member_id: "${m2}", vehicle_plate: "AAA111", space_type: "STANDARD", reserved_from: "2026-08-12T23:00:00Z", reserved_to: "2026-08-13T07:00:00Z" }, as: Cashier, as_user_id: "cash-1", captures: { err: "$.data.error_id" } }
            - { call: "GET /sites/${site_id}/parking-reservations", payload: {}, as: GeneralManager }
          assert:
            - "err == ERR_PLATE_NOT_REGISTERED (referential priority 17 beats capacity constraint priority 27 even though the window also overlaps at full capacity 1)"
            - "only R1 exists in the reservation list"

  # =====================================================================
  # Rule 6 - boundary_precision_check (different metrics, different endpoints)
  # =====================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: parking_capacity_at_exact_limit
        grounds:
          - validations[priority=27]
          - entities.TravelCenterSite.fields.parking_paid_capacity
          - errors[ERR_PARKING_CAPACITY_FULL]
        distinguishing_aspect: |
          Metric: count of overlapping CONFIRMED/ACTIVE reservations vs parking_paid_capacity.
          The boundary is inclusive - exactly == capacity is admitted (2nd reservation passes
          with count 1 < 2), the next is rejected (count 2 !< 2); reachable via
          POST /sites/{id}/parking-reservations.
        test_recipe:
          setup:
            - "Site with parking_paid_capacity 2; clock 2026-08-12T10:00:00Z"
            - "Members M1, M2, M3 each with a registered plate"
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "Site L", parking_total_spaces: 10, parking_paid_capacity: 2, shower_units_count: 1, laundry_machines_count: 1 }, as: GeneralManager, captures: { site_id: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-12T10:00:00Z" }, as: GeneralManager }
            - { call: "POST /loyalty-members", payload: { full_name: "Driver One", email: "one@x.com" }, as: Cashier, as_user_id: "cash-1", captures: { m1: "$.data.id" } }
            - { call: "POST /loyalty-members/${m1}/vehicles", payload: { plate: "AAA111", vehicle_type: "TRACTOR" }, as: Cashier, as_user_id: "cash-1" }
            - { call: "POST /loyalty-members", payload: { full_name: "Driver Two", email: "two@x.com" }, as: Cashier, as_user_id: "cash-1", captures: { m2: "$.data.id" } }
            - { call: "POST /loyalty-members/${m2}/vehicles", payload: { plate: "BBB222", vehicle_type: "TRACTOR" }, as: Cashier, as_user_id: "cash-1" }
            - { call: "POST /loyalty-members", payload: { full_name: "Driver Three", email: "three@x.com" }, as: Cashier, as_user_id: "cash-1", captures: { m3: "$.data.id" } }
            - { call: "POST /loyalty-members/${m3}/vehicles", payload: { plate: "CCC333", vehicle_type: "BOX_TRUCK" }, as: Cashier, as_user_id: "cash-1" }
          trigger:
            - { call: "POST /sites/${site_id}/parking-reservations", payload: { loyalty_member_id: "${m1}", vehicle_plate: "AAA111", space_type: "STANDARD", reserved_from: "2026-08-12T22:00:00Z", reserved_to: "2026-08-13T06:00:00Z" }, as: Cashier, as_user_id: "cash-1", captures: { r1_status: "$.data.status" } }
            - { call: "POST /sites/${site_id}/parking-reservations", payload: { loyalty_member_id: "${m2}", vehicle_plate: "BBB222", space_type: "STANDARD", reserved_from: "2026-08-12T22:00:00Z", reserved_to: "2026-08-13T06:00:00Z" }, as: Cashier, as_user_id: "cash-1", captures: { r2_status: "$.data.status" } }
            - { call: "POST /sites/${site_id}/parking-reservations", payload: { loyalty_member_id: "${m3}", vehicle_plate: "CCC333", space_type: "STANDARD", reserved_from: "2026-08-12T22:00:00Z", reserved_to: "2026-08-13T06:00:00Z" }, as: Cashier, as_user_id: "cash-1", captures: { r3_err: "$.data.error_id" } }
          assert:
            - "R1 and R2 both CONFIRMED (count after each: 1 then 2; 2 == capacity is still admitted because the check is existing-count < capacity)"
            - "R3 rejected with ERR_PARKING_CAPACITY_FULL (existing count 2 !< 2)"

      - name: network_cap_at_exact_limit
        grounds:
          - validations[priority=26]
          - entities.DiscountNetworkProgram.fields.program_cap
          - errors[ERR_NETWORK_CAP_REACHED]
        distinguishing_aspect: |
          Metric: count of ACTIVE enrollments vs program_cap - a different metric (enrollment
          cardinality) and a different endpoint (POST /discount-enrollments/{id}/activate) than
          the parking overlap count. Boundary inclusive: activation with existing count 1 < 2
          passes; with count 2 !< 2 rejected.
        test_recipe:
          setup:
            - "Network FleetPass ACTIVE with program_cap 2; members M1, M2, M3 each enrolled (PENDING)"
          setup_api_calls:
            - { call: "POST /discount-networks", payload: { name: "FleetPass", discount_per_gallon: 0.10, applicable_fuel_types: ["DIESEL"], program_cap: 2 }, as: GeneralManager, captures: { net_id: "$.data.id" } }
            - { call: "POST /discount-networks/${net_id}/activate", payload: {}, as: GeneralManager }
            - { call: "POST /loyalty-members", payload: { full_name: "Driver One", email: "one@x.com" }, as: Cashier, as_user_id: "cash-1", captures: { m1: "$.data.id" } }
            - { call: "POST /loyalty-members/${m1}/discount-enrollments", payload: { network_program_id: "${net_id}" }, as: Cashier, as_user_id: "cash-1", captures: { e1: "$.data.id" } }
            - { call: "POST /loyalty-members", payload: { full_name: "Driver Two", email: "two@x.com" }, as: Cashier, as_user_id: "cash-1", captures: { m2: "$.data.id" } }
            - { call: "POST /loyalty-members/${m2}/discount-enrollments", payload: { network_program_id: "${net_id}" }, as: Cashier, as_user_id: "cash-1", captures: { e2: "$.data.id" } }
            - { call: "POST /loyalty-members", payload: { full_name: "Driver Three", email: "three@x.com" }, as: Cashier, as_user_id: "cash-1", captures: { m3: "$.data.id" } }
            - { call: "POST /loyalty-members/${m3}/discount-enrollments", payload: { network_program_id: "${net_id}" }, as: Cashier, as_user_id: "cash-1", captures: { e3: "$.data.id" } }
          trigger:
            - { call: "POST /discount-enrollments/${e1}/activate", payload: {}, as: Cashier, as_user_id: "cash-1", captures: { e1_status: "$.data.status" } }
            - { call: "POST /discount-enrollments/${e2}/activate", payload: {}, as: Cashier, as_user_id: "cash-1", captures: { e2_status: "$.data.status" } }
            - { call: "POST /discount-enrollments/${e3}/activate", payload: {}, as: Cashier, as_user_id: "cash-1", captures: { e3_err: "$.data.error_id" } }
          assert:
            - "e1 and e2 activate to ACTIVE (existing ACTIVE count 0 then 1, both < cap 2)"
            - "e3 activation rejected with ERR_NETWORK_CAP_REACHED (existing ACTIVE count 2 !< 2)"
            - "e3 remains PENDING"

  # =====================================================================
  # Rule 7 - cross_entity_state_dependency (different entity pairs)
  # =====================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: contract_sale_gated_by_fleet_status
        grounds:
          - validations[priority=11]
          - state_machines.FleetAccount.ACTIVE_to_CREDIT_HOLD
          - errors[ERR_FLEET_NOT_ACTIVE]
        distinguishing_aspect: |
          Entity pair FuelSale -> FleetAccount: authorizing a CONTRACT FuelSale is gated on the
          FleetAccount being ACTIVE; CREDIT_HOLD rejects with ERR_FLEET_NOT_ACTIVE and
          reinstatement re-enables the identical request.
        test_recipe:
          setup:
            - "Site with DIESEL tank (rack 2.7000), pump, register, OPEN shift; clock 2026-08-12T10:00:00Z"
            - "Fleet (limit 50000000) with ACTIVE contract C-1 (tier T1, discount 0.00)"
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "Site M", parking_total_spaces: 60, parking_paid_capacity: 2, shower_units_count: 1, laundry_machines_count: 1 }, as: GeneralManager, captures: { site_id: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-12T10:00:00Z" }, as: GeneralManager }
            - { call: "POST /sites/${site_id}/bulk-tanks", payload: { product_type: "DIESEL", capacity_gallons: 20000, reorder_threshold_gallons: 3000, safety_stock_gallons: 1500, daily_usage_gallons: 950, lead_time_days: 4, initial_gallons: 8500, rack_price_cents_per_gallon_4dp: 2.7000 }, as: GeneralManager }
            - { call: "POST /sites/${site_id}/pumps", payload: { pump_number: 1, fuel_types: ["DIESEL"] }, as: FuelDeskLead, captures: { pump_id: "$.data.id" } }
            - { call: "POST /sites/${site_id}/registers", payload: { register_code: "R1", float_cents: 20000 }, as: GeneralManager, captures: { reg_id: "$.data.id" } }
            - { call: "POST /sites/${site_id}/shifts", payload: { register_id: "${reg_id}", cashier_user_id: "cash-1", shift_label: "DAY" }, as: ShiftManager, as_user_id: "sm-1", captures: { shift_id: "$.data.id" } }
            - { call: "POST /fleet-accounts", payload: { name: "Fleet A", credit_limit_cents: 50000000, pricing_tier: "T1" }, as: GeneralManager, captures: { f_id: "$.data.id" } }
            - { call: "POST /fleet-accounts/${f_id}/contracts", payload: { contract_code: "C-1", pricing_tier: "T1", discount_per_gallon_off: 0.0, applicable_fuel_types: ["DIESEL"], effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-08-01T00:00:00Z" }, as: GeneralManager, captures: { c1_id: "$.data.id" } }
            - { call: "POST /contracts/${c1_id}/activate", payload: {}, as: GeneralManager }
            - { call: "POST /fleet-accounts/${f_id}/credit-hold", payload: {}, as: GeneralManager }
          trigger:
            - { call: "POST /sites/${site_id}/fuel-sales", payload: { pump_id: "${pump_id}", shift_id: "${shift_id}", pricing_mode: "CONTRACT", fuel_type: "DIESEL", tender_type: "FLEET_BILLING", fleet_account_id: "${f_id}", contract_id: "${c1_id}", max_gallons: 100.0 }, as: Cashier, as_user_id: "cash-1", captures: { err_hold: "$.data.error_id" } }
            - { call: "POST /fleet-accounts/${f_id}/credit-reinstate", payload: {}, as: GeneralManager }
            - { call: "POST /sites/${site_id}/fuel-sales", payload: { pump_id: "${pump_id}", shift_id: "${shift_id}", pricing_mode: "CONTRACT", fuel_type: "DIESEL", tender_type: "FLEET_BILLING", fleet_account_id: "${f_id}", contract_id: "${c1_id}", max_gallons: 100.0 }, as: Cashier, as_user_id: "cash-1", captures: { quote_ok: "$.data.authorized_quote_cents_per_gallon" } }
          assert:
            - "err_hold == ERR_FLEET_NOT_ACTIVE while FleetAccount.status == CREDIT_HOLD"
            - "identical request succeeds after credit-reinstate: quote_ok == 283 (T1: 2.7000 + 0.1500 - 0.02)"

      - name: part_issue_gated_by_stock_posture
        grounds:
          - validations[priority=31]
          - entities.StockItem.fields.is_low_stock
          - errors[ERR_LOW_STOCK_APPROVAL_REQUIRED]
        distinguishing_aspect: |
          Entity pair WorkOrderPart -> StockItem: issuing a part is gated on the StockItem's
          derived is_low_stock posture (on_hand 5 <= reorder_point 10 blocks issue; a PO receipt
          raising on_hand to 25 flips the posture and the identical issue succeeds).
        test_recipe:
          setup:
            - "Site; stock item FILTER-X (on_hand 5, reorder_point 10, price 4599); technician (rate 12500); bay 1"
            - "WorkOrder advanced CREATED -> ESTIMATED -> APPROVED -> SCHEDULED -> IN_SHOP -> IN_PROGRESS"
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "Site N", parking_total_spaces: 60, parking_paid_capacity: 2, shower_units_count: 1, laundry_machines_count: 1 }, as: GeneralManager, captures: { site_id: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-12T10:00:00Z" }, as: GeneralManager }
            - { call: "POST /sites/${site_id}/stock-items", payload: { sku: "FILTER-X", name: "Filter X", category: "SHOP_PART", unit: "ea", unit_price_cents: 4599, reorder_point: 10, initial_on_hand_quantity: 5 }, as: GeneralManager, captures: { item_id: "$.data.id", low_before: "$.data.is_low_stock" } }
            - { call: "POST /sites/${site_id}/technicians", payload: { name: "Tech One", hourly_rate_cents: 12500 }, as: GeneralManager, captures: { tech_id: "$.data.id" } }
            - { call: "POST /sites/${site_id}/bays", payload: { bay_number: 1 }, as: GeneralManager, captures: { bay_id: "$.data.id" } }
            - { call: "POST /sites/${site_id}/work-orders", payload: { vehicle_plate: "TRK-1", complaint: "brake shake" }, as: Cashier, as_user_id: "cash-1", captures: { wo_id: "$.data.id" } }
            - { call: "POST /work-orders/${wo_id}/estimate", payload: { labor_hours_est: 2.0 }, as: MaintenanceTech, as_user_id: "${tech_id}" }
            - { call: "POST /work-orders/${wo_id}/approve-estimate", payload: {}, as: GeneralManager }
            - { call: "POST /work-orders/${wo_id}/schedule", payload: { bay_id: "${bay_id}", technician_id: "${tech_id}", scheduled_from: "2026-08-13T08:00:00Z", scheduled_to: "2026-08-13T10:00:00Z" }, as: GeneralManager }
            - { call: "POST /work-orders/${wo_id}/check-in", payload: {}, as: MaintenanceTech, as_user_id: "${tech_id}" }
            - { call: "POST /work-orders/${wo_id}/start-work", payload: {}, as: MaintenanceTech, as_user_id: "${tech_id}" }
          trigger:
            - { call: "POST /work-orders/${wo_id}/parts", payload: { stock_item_id: "${item_id}", quantity: 3 }, as: MaintenanceTech, as_user_id: "${tech_id}", captures: { err_low: "$.data.error_id" } }
            - { call: "POST /sites/${site_id}/vendors", payload: { name: "Parts R Us", category: "GENERAL" }, as: GeneralManager, captures: { vendor_id: "$.data.id" } }
            - { call: "POST /sites/${site_id}/purchase-orders", payload: { vendor_id: "${vendor_id}", lines: [ { sku: "FILTER-X", quantity: 20, unit_price_cents: 3000 } ] }, as: GeneralManager, captures: { po_id: "$.data.id" } }
            - { call: "POST /purchase-orders/${po_id}/approve", payload: {}, as: GeneralManager }
            - { call: "POST /purchase-orders/${po_id}/receive", payload: { received_lines: [ { sku: "FILTER-X", quantity: 20 } ] }, as: GeneralManager, captures: { po_status: "$.data.status" } }
            - { call: "GET /stock-items/${item_id}", payload: {}, as: GeneralManager, captures: { low_after: "$.data.is_low_stock", on_hand_after: "$.data.on_hand_quantity" } }
            - { call: "POST /work-orders/${wo_id}/parts", payload: { stock_item_id: "${item_id}", quantity: 3 }, as: MaintenanceTech, as_user_id: "${tech_id}", captures: { part_qty: "$.data.quantity" } }
            - { call: "GET /stock-items/${item_id}", payload: {}, as: GeneralManager, captures: { on_hand_final: "$.data.on_hand_quantity" } }
          assert:
            - "err_low == ERR_LOW_STOCK_APPROVAL_REQUIRED while is_low_stock is true (5 <= 10)"
            - "PO receive -> RECEIVED; StockItem.is_low_stock flips to false with on_hand 25"
            - "identical issue now succeeds: WorkOrderPart.quantity == 3, on_hand drops to 22"

  # =====================================================================
  # Rule 8 - resource_temporal_overlap (different interval semantics)
  # =====================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: parking_half_open_windows_vs_aggregate_capacity
        grounds:
          - validations[priority=27]
          - state_machines.ParkingReservation
          - errors[ERR_PARKING_CAPACITY_FULL]
        distinguishing_aspect: |
          Interval semantics: half-open [reserved_from, reserved_to) windows over an AGGREGATE
          capacity pool (parking_paid_capacity 1) - a reservation starting exactly at another's
          reserved_to does NOT overlap, while a 1-hour tail overlap does.
        test_recipe:
          setup:
            - "Site with parking_paid_capacity 1; member M1 with plate AAA111; clock 2026-08-12T10:00:00Z"
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "Site O", parking_total_spaces: 10, parking_paid_capacity: 1, shower_units_count: 1, laundry_machines_count: 1 }, as: GeneralManager, captures: { site_id: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-12T10:00:00Z" }, as: GeneralManager }
            - { call: "POST /loyalty-members", payload: { full_name: "Driver One", email: "one@x.com" }, as: Cashier, as_user_id: "cash-1", captures: { m1: "$.data.id" } }
            - { call: "POST /loyalty-members/${m1}/vehicles", payload: { plate: "AAA111", vehicle_type: "TRACTOR" }, as: Cashier, as_user_id: "cash-1" }
          trigger:
            - { call: "POST /sites/${site_id}/parking-reservations", payload: { loyalty_member_id: "${m1}", vehicle_plate: "AAA111", space_type: "STANDARD", reserved_from: "2026-08-12T22:00:00Z", reserved_to: "2026-08-13T06:00:00Z" }, as: Cashier, as_user_id: "cash-1", captures: { r1_status: "$.data.status" } }
            - { call: "POST /sites/${site_id}/parking-reservations", payload: { loyalty_member_id: "${m1}", vehicle_plate: "AAA111", space_type: "STANDARD", reserved_from: "2026-08-13T06:00:00Z", reserved_to: "2026-08-13T10:00:00Z" }, as: Cashier, as_user_id: "cash-1", captures: { r2_status: "$.data.status" } }
            - { call: "POST /sites/${site_id}/parking-reservations", payload: { loyalty_member_id: "${m1}", vehicle_plate: "AAA111", space_type: "STANDARD", reserved_from: "2026-08-13T05:00:00Z", reserved_to: "2026-08-13T07:00:00Z" }, as: Cashier, as_user_id: "cash-1", captures: { r3_err: "$.data.error_id" } }
          assert:
            - "R1 [22:00, 06:00) CONFIRMED"
            - "R2 [06:00, 10:00) CONFIRMED - adjacent at the half-open boundary is NOT an overlap"
            - "R3 [05:00, 07:00) rejected ERR_PARKING_CAPACITY_FULL - overlaps R1's tail ([05:00,06:00) collision) with aggregate count 2 > capacity 1"

      - name: bay_half_open_schedule_vs_closed_maintenance_block
        grounds:
          - validations[priority=21]
          - validations[priority=22]
          - errors[ERR_BAY_DOUBLE_BOOKED]
          - errors[ERR_BAY_MAINTENANCE_CONFLICT]
        distinguishing_aspect: |
          Interval semantics differ from parking: work-order windows on a single bay are
          half-open (a 10:00 start after a [08:00,10:00) job is fine) but maintenance blocks are
          CLOSED intervals - a window ending exactly at blocked_from == 12:00 still conflicts
          (strict overlap: from <= blocked_to AND blocked_from <= to). Different resource entity
          (ShopBay) and different adjacency treatment than parking.
        test_recipe:
          setup:
            - "Site with bay 1 and technician; maintenance block [2026-08-13T12:00:00Z, 2026-08-13T13:00:00Z] on bay 1"
            - "Four work orders WO1..WO4 each advanced to APPROVED"
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "Site P", parking_total_spaces: 60, parking_paid_capacity: 2, shower_units_count: 1, laundry_machines_count: 1 }, as: GeneralManager, captures: { site_id: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-12T10:00:00Z" }, as: GeneralManager }
            - { call: "POST /sites/${site_id}/technicians", payload: { name: "Tech One", hourly_rate_cents: 12500 }, as: GeneralManager, captures: { tech_id: "$.data.id" } }
            - { call: "POST /sites/${site_id}/bays", payload: { bay_number: 1 }, as: GeneralManager, captures: { bay_id: "$.data.id" } }
            - { call: "POST /bays/${bay_id}/maintenance-block", payload: { blocked_from: "2026-08-13T12:00:00Z", blocked_to: "2026-08-13T13:00:00Z", reason: "lift inspection" }, as: GeneralManager }
            - { call: "POST /sites/${site_id}/work-orders", payload: { vehicle_plate: "TRK-1", complaint: "wo1" }, as: Cashier, as_user_id: "cash-1", captures: { wo1: "$.data.id" } }
            - { call: "POST /work-orders/${wo1}/estimate", payload: { labor_hours_est: 2.0 }, as: MaintenanceTech, as_user_id: "${tech_id}" }
            - { call: "POST /work-orders/${wo1}/approve-estimate", payload: {}, as: GeneralManager }
            - { call: "POST /sites/${site_id}/work-orders", payload: { vehicle_plate: "TRK-2", complaint: "wo2" }, as: Cashier, as_user_id: "cash-1", captures: { wo2: "$.data.id" } }
            - { call: "POST /work-orders/${wo2}/estimate", payload: { labor_hours_est: 2.0 }, as: MaintenanceTech, as_user_id: "${tech_id}" }
            - { call: "POST /work-orders/${wo2}/approve-estimate", payload: {}, as: GeneralManager }
            - { call: "POST /sites/${site_id}/work-orders", payload: { vehicle_plate: "TRK-3", complaint: "wo3" }, as: Cashier, as_user_id: "cash-1", captures: { wo3: "$.data.id" } }
            - { call: "POST /work-orders/${wo3}/estimate", payload: { labor_hours_est: 1.0 }, as: MaintenanceTech, as_user_id: "${tech_id}" }
            - { call: "POST /work-orders/${wo3}/approve-estimate", payload: {}, as: GeneralManager }
            - { call: "POST /sites/${site_id}/work-orders", payload: { vehicle_plate: "TRK-4", complaint: "wo4" }, as: Cashier, as_user_id: "cash-1", captures: { wo4: "$.data.id" } }
            - { call: "POST /work-orders/${wo4}/estimate", payload: { labor_hours_est: 1.0 }, as: MaintenanceTech, as_user_id: "${tech_id}" }
            - { call: "POST /work-orders/${wo4}/approve-estimate", payload: {}, as: GeneralManager }
          trigger:
            - { call: "POST /work-orders/${wo1}/schedule", payload: { bay_id: "${bay_id}", technician_id: "${tech_id}", scheduled_from: "2026-08-13T08:00:00Z", scheduled_to: "2026-08-13T10:00:00Z" }, as: GeneralManager, captures: { wo1_status: "$.data.status" } }
            - { call: "POST /work-orders/${wo2}/schedule", payload: { bay_id: "${bay_id}", technician_id: "${tech_id}", scheduled_from: "2026-08-13T10:00:00Z", scheduled_to: "2026-08-13T12:00:00Z" }, as: GeneralManager, captures: { wo2_err: "$.data.error_id" } }
            - { call: "POST /work-orders/${wo3}/schedule", payload: { bay_id: "${bay_id}", technician_id: "${tech_id}", scheduled_from: "2026-08-13T09:00:00Z", scheduled_to: "2026-08-13T11:00:00Z" }, as: GeneralManager, captures: { wo3_err: "$.data.error_id" } }
            - { call: "POST /work-orders/${wo4}/schedule", payload: { bay_id: "${bay_id}", technician_id: "${tech_id}", scheduled_from: "2026-08-13T13:01:00Z", scheduled_to: "2026-08-13T14:00:00Z" }, as: GeneralManager, captures: { wo4_status: "$.data.status" } }
          assert:
            - "WO1 [08:00,10:00) -> SCHEDULED"
            - "WO2 [10:00,12:00) -> ERR_BAY_MAINTENANCE_CONFLICT: half-open end touching the CLOSED block start 12:00 still conflicts (10:00 <= 13:00 AND 12:00 <= 12:00)"
            - "WO3 [09:00,11:00) -> ERR_BAY_DOUBLE_BOOKED: interior overlap with WO1"
            - "WO4 [13:01,14:00) -> SCHEDULED: first minute past the closed block's blocked_to 13:00 escapes the strict test"

  # =====================================================================
  # Rule 9 - compensating_invariant (different conserved quantities)
  # =====================================================================
  - rule_id: compensating_invariant
    instances:
      - name: shift_cash_conservation_across_drop
        grounds:
          - calculations.shift_expected_cash
          - calculations.cash_drop_target
          - state_machines.Shift.OPEN_to_CLOSED
        distinguishing_aspect: |
          Conserved quantity: drawer cash identity - at any point in an OPEN shift,
          expected_cash_cents + sum(POSTED CashDrop.amount_cents) - opening_float_cents must
          equal sum(cash receipts) - sum(payouts). Forward action (6599-cent drop) paired with
          its effect leaves the identity exactly balanced: 20000 + 6599 - 20000 == 11599 - 5000.
        test_recipe:
          setup:
            - "Site with DIESEL price 385, pump, register float 20000, OPEN shift; member 9000 pts enrolled FleetPass; stock SNACK-A 999 / DRINK-B 150; clock 2026-08-12T10:00:00Z"
            - "Cash events posted: fuel sale 10450 (CASH), store sale 1149 (CASH), payout 5000"
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "Site Q", parking_total_spaces: 60, parking_paid_capacity: 2, shower_units_count: 1, laundry_machines_count: 1 }, as: GeneralManager, captures: { site_id: "$.data.id", site_v: "$.data.version" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-12T10:00:00Z" }, as: GeneralManager }
            - { call: "POST /sites/${site_id}/fuel-prices", payload: { fuel_type: "DIESEL", retail_cents_per_gallon: 385, effective_from: "2026-08-01T00:00:00Z", expected_site_version: "${site_v}" }, as: FuelDeskLead }
            - { call: "POST /sites/${site_id}/pumps", payload: { pump_number: 1, fuel_types: ["DIESEL"] }, as: FuelDeskLead, captures: { pump_id: "$.data.id" } }
            - { call: "POST /sites/${site_id}/registers", payload: { register_code: "R1", float_cents: 20000 }, as: GeneralManager, captures: { reg_id: "$.data.id" } }
            - { call: "POST /sites/${site_id}/shifts", payload: { register_id: "${reg_id}", cashier_user_id: "cash-1", shift_label: "DAY" }, as: ShiftManager, as_user_id: "sm-1", captures: { shift_id: "$.data.id" } }
            - { call: "POST /loyalty-members", payload: { full_name: "Driver A", email: "a@x.com" }, as: Cashier, as_user_id: "cash-1", captures: { m_id: "$.data.id" } }
            - { call: "POST /loyalty-members/${m_id}/adjustments", payload: { points_delta: 9000, reason: "seed" }, as: GeneralManager }
            - { call: "POST /discount-networks", payload: { name: "FleetPass", discount_per_gallon: 0.10, applicable_fuel_types: ["DIESEL"], program_cap: 2 }, as: GeneralManager, captures: { net_id: "$.data.id" } }
            - { call: "POST /discount-networks/${net_id}/activate", payload: {}, as: GeneralManager }
            - { call: "POST /loyalty-members/${m_id}/discount-enrollments", payload: { network_program_id: "${net_id}" }, as: Cashier, as_user_id: "cash-1", captures: { en_id: "$.data.id" } }
            - { call: "POST /discount-enrollments/${en_id}/activate", payload: {}, as: Cashier, as_user_id: "cash-1" }
            - { call: "POST /sites/${site_id}/stock-items", payload: { sku: "SNACK-A", name: "Snack A", category: "RETAIL", unit: "ea", unit_price_cents: 999, reorder_point: 5, initial_on_hand_quantity: 50 }, as: GeneralManager, captures: { item_a: "$.data.id" } }
            - { call: "POST /sites/${site_id}/stock-items", payload: { sku: "DRINK-B", name: "Drink B", category: "RETAIL", unit: "ea", unit_price_cents: 150, reorder_point: 5, initial_on_hand_quantity: 50 }, as: GeneralManager, captures: { item_b: "$.data.id" } }
            - { call: "POST /sites/${site_id}/fuel-sales", payload: { pump_id: "${pump_id}", shift_id: "${shift_id}", pricing_mode: "RETAIL", fuel_type: "DIESEL", tender_type: "CASH", loyalty_member_id: "${m_id}", requested_redeem_points: 200, max_gallons: 40.0 }, as: Cashier, as_user_id: "cash-1", captures: { sale_id: "$.data.id" } }
            - { call: "POST /fuel-sales/${sale_id}/dispensing-start", payload: {}, as: Cashier, as_user_id: "cash-1" }
            - { call: "POST /fuel-sales/${sale_id}/dispensing-complete", payload: { dispensed_gallons: 38.0 }, as: Cashier, as_user_id: "cash-1" }
            - { call: "POST /fuel-sales/${sale_id}/finalize", payload: {}, as: Cashier, as_user_id: "cash-1" }
            - { call: "POST /fuel-sales/${sale_id}/pay", payload: { tender_type: "CASH" }, as: Cashier, as_user_id: "cash-1" }
            - { call: "POST /sites/${site_id}/store-sales", payload: { shift_id: "${shift_id}", tender_type: "CASH", lines: [ { stock_item_id: "${item_a}", quantity: 1 }, { stock_item_id: "${item_b}", quantity: 1 } ] }, as: Cashier, as_user_id: "cash-1" }
            - { call: "POST /shifts/${shift_id}/payouts", payload: { amount_cents: 5000, reason: "vendor payout" }, as: ShiftManager, as_user_id: "sm-2" }
            - { call: "GET /shifts/${shift_id}", payload: {}, as: ShiftManager, as_user_id: "sm-2", captures: { expected_pre_drop: "$.data.expected_cash_cents" } }
          trigger:
            - { call: "POST /shifts/${shift_id}/drops", payload: { amount_cents: 6599, denominations: { "2000": 3, "100": 5, "25": 3, "1": 24 } }, as: Cashier, as_user_id: "cash-1", captures: { drop_id: "$.data.id", drop_status: "$.data.status" } }
            - { call: "GET /shifts/${shift_id}", payload: {}, as: ShiftManager, as_user_id: "sm-2", captures: { expected_post_drop: "$.data.expected_cash_cents" } }
            - { call: "POST /shifts/${shift_id}/close", payload: { counted_cash_cents: 20000 }, as: ShiftManager, as_user_id: "sm-2", captures: { close_status: "$.data.status" } }
            - { call: "GET /shifts/${shift_id}/reconciliations", payload: {}, as: ShiftManager, as_user_id: "sm-2", captures: { recon_deposit: "$.data[0].deposit_total_cents", recon_variance: "$.data[0].variance_cents" } }
            - { call: "GET /shifts/${shift_id}/safe-deposits", payload: {}, as: ShiftManager, as_user_id: "sm-2" }
          assert:
            - "pre-drop expected_cash_cents == 26599 (20000 + 10450 + 1149 - 5000)"
            - "drop POSTED: denominations sum 3x2000 + 5x100 + 3x25 + 24x1 == 6599 == amount_cents"
            - "post-drop expected_cash_cents == 20000"
            - "invariant holds exactly: expected(20000) + drops(6599) - float(20000) == receipts(11599) - payouts(5000) == 6599"
            - "close: variance_cents == 0, deposit_total_cents == 0, zero SafeDeposit rows (deposit only when expected > float)"

      - name: scale_toll_ledger_conservation
        grounds:
          - calculations.scale_ticket_total
          - state_machines.ScaleTicket.PAID_to_REFUNDED
        distinguishing_aspect: |
          Conserved quantity: per-ticket net toll revenue - sum of toll charges minus sum of
          refunds must equal the ticket's net revenue; a settle (1650 cents) followed by a full
          paid-cancel refund (1650 cents) returns the invariant to exactly 0, and the free
          REWEIGH contributes nothing to either side. Different conserved quantity than shift
          drawer cash.
        test_recipe:
          setup:
            - "Site with register float 20000 and OPEN shift; clock 2026-08-12T10:00:00Z"
            - "Scale ticket (certified=true) with GROSS 80000, TARE 28000, REWEIGH 80500 recorded"
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "Site R", parking_total_spaces: 60, parking_paid_capacity: 2, shower_units_count: 1, laundry_machines_count: 1 }, as: GeneralManager, captures: { site_id: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-12T10:00:00Z" }, as: GeneralManager }
            - { call: "POST /sites/${site_id}/registers", payload: { register_code: "R1", float_cents: 20000 }, as: GeneralManager, captures: { reg_id: "$.data.id" } }
            - { call: "POST /sites/${site_id}/shifts", payload: { register_id: "${reg_id}", cashier_user_id: "cash-1", shift_label: "DAY" }, as: ShiftManager, as_user_id: "sm-1", captures: { shift_id: "$.data.id" } }
            - { call: "POST /sites/${site_id}/scale-tickets", payload: { shift_id: "${shift_id}", vehicle_plate: "TRK-9", carrier_name: "Acme Hauling", certified: true }, as: Cashier, as_user_id: "cash-1", captures: { tkt: "$.data.id" } }
            - { call: "POST /scale-tickets/${tkt}/weigh", payload: { weigh_kind: "GROSS", weight_lbs: 80000 }, as: Cashier, as_user_id: "cash-1" }
            - { call: "POST /scale-tickets/${tkt}/weigh", payload: { weigh_kind: "TARE", weight_lbs: 28000 }, as: Cashier, as_user_id: "cash-1" }
            - { call: "POST /scale-tickets/${tkt}/weigh", payload: { weigh_kind: "REWEIGH", weight_lbs: 80500 }, as: Cashier, as_user_id: "cash-1" }
          trigger:
            - { call: "POST /scale-tickets/${tkt}/settle", payload: { tender_type: "CASH" }, as: Cashier, as_user_id: "cash-1", captures: { paid_amt: "$.data.total_paid_cents", tkt_status: "$.data.status", net_lbs: "$.data.net_lbs" } }
            - { call: "GET /shifts/${shift_id}", payload: {}, as: ShiftManager, as_user_id: "sm-2", captures: { expected_paid: "$.data.expected_cash_cents" } }
            - { call: "POST /scale-tickets/${tkt}/cancel", payload: {}, as: ShiftManager, as_user_id: "sm-2", captures: { refund_amt: "$.data.refund_total_cents", tkt_status2: "$.data.status" } }
            - { call: "GET /shifts/${shift_id}", payload: {}, as: ShiftManager, as_user_id: "sm-2", captures: { expected_refund: "$.data.expected_cash_cents" } }
          assert:
            - "settle: total_paid_cents == 1650 (1250 first-weigh + 400 certified; the REWEIGH is free), status PAID"
            - "net_lbs == 52500 (last gross 80500 - tare 28000; REWEIGH refreshes gross_lbs)"
            - "shift expected 21650 after settle"
            - "paid cancel: refund_total_cents == 1650, status REFUNDED"
            - "invariant: tolls(1650) - refunds(1650) == 0 net revenue; shift expected back to 20000"
            - "reweigh_count == 1 yet contributes 0 to both sides of the ledger"
