            - call: "POST /conversion-projects/${proj_id}/reserve-studies"
              payload: { engineering_report_id: "${er_id}", method: "COMPONENT_METHOD", opening_reserve_balance_cents: 0 }
              as: ConverterSponsor
              as_user_id: "sponsor-1"
              captures: { rs_id: "$.data.id" }
            - call: "GET /conversion-projects/${proj_id}"
              payload: {}
