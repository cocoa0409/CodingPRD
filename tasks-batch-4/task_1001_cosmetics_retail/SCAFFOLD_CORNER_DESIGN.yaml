        distinguishing_aspect: "BOPIS orders must carry an on-the-hour pickup_slot_start; 2026-06-05T14:30:00Z is rejected with ERR_INVALID_REQUEST (400) because the slot bucket key would be ill-defined."
        test_recipe:
          setup: ["Store, stocked variant, customer."]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "SEP-CA", region_code: "CA" }
              as: MerchandisingAdmin
              captures: { store_id: "$.data.id"}
            - call: "POST /products"
