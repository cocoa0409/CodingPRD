              payload: { inspection_type: "FOR_CAUSE", window_start: "2026-09-05T00:00:00Z", window_end: "2026-09-08T00:00:00Z" }
              as: RegulatoryReviewer
              as_user_id: "RVW-1"
              captures: { insp2_id: $.data.id }
            - call: "POST /cosmetics/facilities/${fac_id}/inspections"
              payload: { inspection_type: "PREANNOUNCED_FOLLOWUP", window_start: "2026-09-04T00:00:00Z", window_end: "2026-09-06T00:00:00Z" }
