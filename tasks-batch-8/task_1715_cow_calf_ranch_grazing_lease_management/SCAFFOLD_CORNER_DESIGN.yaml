            - { call: "POST /api/herd-groups/${g}/reductions", payload: { head_count: 59, reason: "LIQUIDATION" }, as: HerdManager, captures: { err2: $.data.error_id } }
            - { call: "POST /api/herd-groups/${g}/reductions", payload: { head_count: 60, reason: "LIQUIDATION" }, as: HerdManager }
          assert:
            - "${err1} == ERR_DESTOCK_REDUCTION_EXCEEDS_HEAD and ${err2} == ERR_DESTOCK_REDUCTION_EXCEEDS_HEAD (partial LIQUIDATION)"
            - "Full LIQUIDATION succeeds: head_count == 0, group_status == LIQUIDATED"

