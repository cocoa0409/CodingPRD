          - state_machines.DisposalManifest.DRAFT_to_SUBMITTED
        distinguishing_aspect: |
          Entity pair InventoryLot -> DisposalManifest, a fourth distinct pair: the lot
          itself is a perfectly scrappable SHELF_EXPIRED row with quantity_reserved 0, and
          the scrap is refused only because the target manifest has already moved
          DRAFT -> SUBMITTED.
        test_recipe:
          setup:
            - "One hazmat-endorsed TX warehouse and model IB-31-FLD with shelf_life_days 540."
            - "Two lots manufactured 2024-01-01 (943 days old at the default clock, both SHELF_EXPIRED): lot SEED with 4 units and lot LATE with 4 units."
