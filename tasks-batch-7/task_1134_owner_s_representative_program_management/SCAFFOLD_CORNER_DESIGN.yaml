          trigger:
            - { call: "POST /engagements", payload: { stakeholder_group_id: "${g1}", title: "E", scheduled_start: "2026-09-02T10:00:00Z", scheduled_end: "2026-09-02T10:00:00Z" }, as: OwnerRepPM, as_user_id: "pm-1", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_REQUEST   # end must be strictly after start"

      - name: supersedes_target_not_under_review_rejected
        claim_type: violation_to_error
        grounds:
          - "validations[priority=7]"
          - "errors[ERR_SUPERSEDES_TARGET_INVALID]"
        distinguishing_aspect: "supersedes_id referencing a DRAFT (not UNDER_REVIEW) change order on the same contract is rejected with ERR_SUPERSEDES_TARGET_INVALID at priority 7."
        test_recipe:
          setup: ["Program ACTIVE (minimal); CT1 SOLICITED; CO-A DRAFT against CT1"]
          setup_api_calls:
            - { call: "POST /programs", payload: { program_name: "P-SUP", owner_organization: "O" }, as: OwnerRepPM, as_user_id: "pm-1", captures: { prog: $.data.id } }
