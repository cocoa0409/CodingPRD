              as: ClinicalAssessor
              as_user_id: "assessor-1"
              captures: { s1_id: "$.data.id" }
            - call: "POST /svh/clinical-assessments/${s1_id}/submit"
              payload: {}
              as: ClinicalAssessor
              as_user_id: "assessor-1"
            - call: "GET /svh/care-units/${nu_id}"
