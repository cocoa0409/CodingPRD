              as: StateLawAdmin
              as_user_id: "sla-01"
              captures: { ow_e3: $.data.id }
            - call: "POST /annexation-cases"
              payload: { municipality_id: "${muni_e3}", method: "INVOLUNTARY_ORDINANCE", shared_boundary_feet: 20000, total_lot_count: 1, developed_lot_count: 1, dwelling_units: 4 }
              as: MunicipalPlanner
              as_user_id: "${muni_e3}"
              captures: { case_e3: $.data.id }
            - call: "POST /annexation-cases/${case_e3}/parcels"
              payload: { primary_owner_id: "${ow_e3}", parcel_apn: "E3-1", assessed_value_cents: 100000000, acreage: 5.00, is_developed: true, dwelling_units: 4 }
              as: MunicipalPlanner
              as_user_id: "${muni_e3}"
            - call: "POST /annexation-cases/${case_e3}/certify-territory"
              payload: {}
              as: MunicipalPlanner
              as_user_id: "${muni_e3}"
            - call: "POST /plans-of-services"
              payload: { annexation_case_id: "${case_e3}" }
              as: MunicipalPlanner
              as_user_id: "${muni_e3}"
              captures: { plan_e3: $.data.id, plan_e3_v0: $.data.version, e3_cost_before: $.data.committed_cost_cents, e3_readiness_before: $.data.service_readiness }
          trigger:
            - call: "POST /service-commitments"
              payload: { plan_of_services_id: "${plan_e3}", service_provider_id: "${prov_e3}", service_type: "POLICE", window_start_date: "2026-08-01", window_end_date: "2026-09-15", cost_cents: 500000, committed_account_count: 0, expected_plan_of_services_version: "${plan_e3_v0}" }
              as: MunicipalPlanner
              as_user_id: "${muni_e3}"
              captures: { cm_e3a: $.data.id, e3_days_a: $.data.timeline_days }
            - call: "POST /service-commitments/${cm_e3a}/activate"
              payload: {}
              as: MunicipalPlanner
              as_user_id: "${muni_e3}"
              captures: { e3_status_a: $.data.commitment_status }
            - call: "GET /plans-of-services/${plan_e3}"
              payload: {}
              as: MunicipalPlanner
              as_user_id: "${muni_e3}"
              captures: { e3_cost_mid: $.data.committed_cost_cents, e3_readiness_mid: $.data.service_readiness, plan_e3_v2: $.data.version }
            - call: "POST /service-commitments"
              payload: { plan_of_services_id: "${plan_e3}", service_provider_id: "${prov_e3}", service_type: "FIRE", window_start_date: "2026-08-01", window_end_date: "2026-09-15", cost_cents: 300000, committed_account_count: 0, expected_plan_of_services_version: "${plan_e3_v2}" }
              as: MunicipalPlanner
              as_user_id: "${muni_e3}"
              captures: { cm_e3b: $.data.id }
            - call: "POST /service-commitments/${cm_e3b}/activate"
