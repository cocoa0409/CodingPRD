            - *k_img_np
            - *k_plan_np
            - *k_plan_np_act
            - call: "POST /imaging-studies"
              payload: { patient_id: "${k_pt_np_id}", eye: "OD", study_datetime: "2026-08-20T00:00:00Z", central_subfield_thickness_um: 410, intraretinal_fluid: true, subretinal_fluid: false, new_hemorrhage: false, va_letter_score: 57 }
