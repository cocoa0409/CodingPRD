              payload: { company_id: "${company_e_id}", subscription_id: "${sub_e_id}", initiating_firm_id: "${firm_gold2_id}", to_owner: "FIRM" }
              as: AccountantUser
              as_user_id: "${firm_gold2_admin_id}"
              captures: { tr_e_id: $.data.id }
            - &k_tr_f
              call: "POST /api/companies/${company_f_id}/billing_transfers"
              payload: { company_id: "${company_f_id}", subscription_id: "${sub_f_id}", initiating_firm_id: "${firm_plat_id}", to_owner: "FIRM" }
              as: AccountantUser
