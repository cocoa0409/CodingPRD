            - call: "GET /swim-club/party-reservations"
              payload: { status: "REQUESTED" }
              as: PoolManager
              captures: { req_list: $.data }
          assert:
            - "${s_cap} == 40 and ${p_a_load} == 20, so the season has room for exactly one more load-20 party in any overlapping window"
            - "reservation A is HTTP 201 with ${p_a_status} == REQUESTED"
            - "${err_zone} == ERR_ZONE_DOUBLE_BOOKED with HTTP 409: PAVILION 16:00-20:00 overlaps PAVILION 14:00-18:00 on the half-open window"
            - "the 18:00-20:00 PAVILION booking is HTTP 201 with ${p_b_status} == REQUESTED: adjacency where previous end_iso == new start_iso is explicitly allowed"
            - "${err_capacity} == ERR_BATHER_CAPACITY_EXCEEDED with HTTP 409, NOT ERR_ZONE_DOUBLE_BOOKED: SHALLOW_END does not conflict with PAVILION, so priority 63 passed and 20 + 26 == 46 > 40 stopped it at priority 64"
            - "the load-20 shallow-end retry is HTTP 201 with ${p_c_load} == 20 and ${p_c_status} == REQUESTED, because 20 + 20 == 40 is not greater than the capacity of 40"
            - "reservation B contributes nothing to C's window: its interval [18:00, 20:00) does not overlap [15:00, 17:00)"
            - "${req_list} holds exactly three reservations, so neither refusal left a row behind"

      - name: violation_to_error_restricted_then_closed_posture_narrows_the_facility
        claim_type: violation_to_error
        grounds:
          - validations[priority=42]
          - validations[priority=41]
          - calculations.facility_posture_derivation
          - endpoints[POST /swim-club/inspection-findings]
        distinguishing_aspect: |
          RESTRICTED and CLOSED are different refusals with different codes, and RESTRICTED is not a
          blanket ban: it is an envelope, so the same endpoint that refuses a WHOLE_FACILITY booking
          must still accept a PAVILION one, and the same guest endpoint that refuses three guests must
          still accept two. Escalating to CLOSED by adding a single CRITICAL finding then flips both
          endpoints to a total refusal. An implementation that treats any open finding as a closure
          fails the RESTRICTED-still-works assertions.
        test_recipe:
          setup:
            - "One COUPLE category with bond 0, guest_pass_allotment 2 and party_privileges true."
            - "One OPEN 2027 season, guest_settlement_policy PASS_FIRST, capacity 120."
            - "Two households A and B, each with an invoiced ACTIVE membership and nothing owed, so priority 80 stays silent on both."
            - "Findings are recorded by hi-001; MAJOR_FINDING_RESTRICT_THRESHOLD is 2 and any CRITICAL closes the facility."
            - "The clock sits at 2027-07-01T09:00Z, so the 2027-06-25 guest visits are in the past and the 2027-07-15 parties are in the future."
