# =============================================================================
# Scaffold: Battery Platform Ecosystem & Trade Product Development
# Generated per prd-bench-scaffold-generator SKILL.md (sections 1.0-1.7 here;
# 1.8 and 1.9 live in SCAFFOLD_DIFFICULTY_DESIGN.yaml / SCAFFOLD_CORNER_DESIGN.yaml)
# =============================================================================

scenario: |
  Battery Platform Ecosystem & Trade Product Development (Milwaukee Tool): battery platform architecture with backward and forward compatibility commitments across tool generations, tool development targeting specific trades with field research and jobsite observation informing feature sets, cordless conversion of traditionally corded categories with power and runtime engineering constraints, battery cell sourcing, pack design and safety certification with charger interoperability, service network with repair centers, warranty claims and battery replacement policy, one-key asset tracking and tool customization with account provisioning, distribution across industrial distributors and home centers with product line segmentation, counterfeit battery detection and safety communication

domain_name: battery-platform-ecosystem
api_prefix: /battery-ecosystem
# NOTE: every business endpoint lives under api_prefix. The only endpoint outside
# the prefix is the platform logical clock: POST /_clock/set_current_utc.

complexity_profile:
  primary_archetype: compliance_audit        # safety certification gates, segregation of duties, counterfeit adjudication, mandatory safety communication
  secondary_archetype: quota_allocation      # service-center daily capacity, account asset limits, channel allocation caps
  complexity_layers:
    - optimistic_concurrency                 # OCC on ToolModel.transition, TrackedAsset.customize, Listing create-supersede
    - cascading_side_effects                 # counterfeit confirm -> pack hold -> listing suspension -> partner gate; RECALL bulletin -> pack recall -> listing end
    - dual_variant_calculation               # warranty age basis (MANUFACTURE vs ACTIVATION); compatibility set (REGULATORY vs ENGINEERING)
    - scheduled_actions                      # clock-driven platform SUNSETTING/RETIRED transitions; all warranty ages read the logical clock
  entity_topology: flat                      # peer collections joined by FK references; no nested creation paths
  state_machine_shape: cyclic                # pack cert reject/resubmit cycle; tool EV->PROTOTYPE revert loop; asset ACTIVE<->REPORTED_LOST; claim parallel dimensions
  relationship_patterns:
    - one_to_many
    - polymorphic                            # TrackedAsset subject (ToolModel | BatteryPack); DistributionListing product (ToolModel | BatteryPack | Charger)
    - cross_aggregate
  role_model: segregation_of_duties          # cert submitter != decider; insight submitter != decider; counterfeit reporter != resolver
  consistency_model: immediate               # every mutation (incl. cascaded side effects) visible in the same response / subsequent reads

# =============================================================================
# 1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: BatteryPlatform
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "Platform code, unique (e.g. MX18)" , constraints: "unique across platforms" }
      - { name: interface_key, type: enum, source: input, description: "Physical/electronic pack interface family", constraints: "INTERFACE_A | INTERFACE_B" }
      - { name: chemistry_family, type: enum, source: input, description: "Cell chemistry family of the platform", constraints: "LION_NMC | LFP" }
      - { name: backward_commitment_years, type: integer, source: input, description: "Years after a tool launch during which the platform commits to keep packs available/compatible; gates launch vs sunset_date", constraints: ">= 0" }
      - { name: forward_commitment_generations, type: integer, source: input, description: "How many pack generations beyond platform.current_generation a tool's max_pack_generation may reach", constraints: ">= 0" }
      - { name: sunset_announce_date, type: datetime, source: input, required: false, description: "When the logical clock reaches this instant the platform auto-transitions ACTIVE -> SUNSETTING", constraints: "optional; if set must be <= sunset_date" }
      - { name: sunset_date, type: datetime, source: input, required: false, description: "When the logical clock reaches this instant the platform auto-transitions to RETIRED", constraints: "optional" }
      - { name: status, type: enum, source: system, description: "ACTIVE -> SUNSETTING -> RETIRED; advanced by the logical clock only", constraints: "initial ACTIVE" }
      - { name: current_generation, type: integer, source: computed, description: "Max pack_generation over this platform's CERTIFIED (not RECALLED) packs; 0 when none. Recomputed on decide-certification CERTIFIED and on RECALL cascade" }

  - name: BatteryPack
    parent: null
    common_fields: true
    fields:
      - { name: platform_id, type: string, source: input, description: "FK -> BatteryPlatform.id; platform this pack SKU belongs to" }
      - { name: sku, type: string, source: input, description: "Pack SKU", constraints: "unique across packs" }
      - { name: pack_generation, type: integer, source: input, description: "Generation index within the platform", constraints: ">= 1 and <= platform.current_generation + 1 at creation (generation ratchet)" }
      - { name: cell_supplier_code, type: string, source: input, description: "Cell sourcing: supplier code for the cells designed into this pack" }
      - { name: cell_format, type: enum, source: input, description: "Cell sourcing: cell format designed into this pack", constraints: "C18650 | C21700 | TABLESS" }
      - { name: rated_capacity_wh, type: number, source: input, description: "Rated pack energy in watt-hours", constraints: "> 0" }
      - { name: max_charge_rate_w, type: number, source: input, description: "Maximum accepted charge power", constraints: "> 0" }
      - { name: replacement_price_cents, type: integer, source: input, description: "Full replacement price used by warranty credit calculation", constraints: ">= 0" }
      - { name: warranty_days, type: integer, source: input, description: "Total warranty length in days", constraints: "> 0 and a multiple of 30 (DAYS_PER_MONTH)" }
      - { name: free_replacement_days, type: integer, source: input, description: "Inclusive free-replacement window in days from the age basis", constraints: ">= 0 and <= warranty_days" }
      - { name: certification_status, type: enum, source: system, description: "DESIGN -> SUBMITTED -> CERTIFIED | REJECTED; REJECTED -> SUBMITTED resubmit; CERTIFIED -> RECALLED via RECALL bulletin", constraints: "initial DESIGN" }
      - { name: submitted_by_user_id, type: string, source: system, description: "X-User-ID of the most recent submit-certification caller; segregation-of-duties reference" }
      - { name: safety_hold, type: boolean, source: system, description: "Set true by CONFIRMED counterfeit case; blocks listing activation; never auto-cleared", default: false }
      - { name: charge_estimate_minutes, type: integer, source: computed, required: false, description: "Present only on GET /battery-packs/{id}?charger_id=<id>: estimated full-charge minutes for that charger/pack pair per charge_time_estimate" }
      - { name: charger_compatible, type: boolean, source: computed, required: false, description: "Present only on GET /battery-packs/{id}?charger_id=<id>: whether the charger shares this pack's platform" }

  - name: Charger
    parent: null
    common_fields: true
    fields:
      - { name: platform_id, type: string, source: input, description: "FK -> BatteryPlatform.id; platform this charger belongs to (charger interoperability is platform-scoped)" }
      - { name: model_code, type: string, source: input, description: "Charger model code", constraints: "unique across chargers" }
      - { name: charger_generation, type: integer, source: input, description: "Charger generation; a charger older than the pack generation charges at a derated rate", constraints: ">= 1" }
      - { name: max_charge_rate_w, type: number, source: input, description: "Maximum delivered charge power", constraints: "> 0" }

  - name: ToolModel
    parent: null
    common_fields: true
    fields:
      - { name: platform_id, type: string, source: input, description: "FK -> BatteryPlatform.id; platform powering this tool" }
      - { name: model_code, type: string, source: input, description: "Tool model code", constraints: "unique across tool models" }
      - { name: trade, type: enum, source: input, description: "Target trade the tool is developed for", constraints: "PLUMBING | ELECTRICAL | HVAC | CARPENTRY | MASONRY | AUTOMOTIVE" }
      - { name: category, type: enum, source: input, description: "Tool category", constraints: "DRILL | SAW | IMPACT_DRIVER | PIPE_TOOL | LIGHT | GRINDER" }
      - { name: tier, type: enum, source: input, description: "Product line tier used by channel segmentation", constraints: "CONSUMER | PROFESSIONAL | TRADE_SPECIALIST" }
      - { name: corded_conversion, type: boolean, source: input, description: "True when this model converts a traditionally corded category to cordless; engages the runtime launch gate" }
      - { name: avg_power_draw_w, type: number, source: input, description: "Average power draw under rated load", constraints: "> 0" }
      - { name: runtime_target_min, type: number, source: input, required: false, description: "Runtime target in minutes; REQUIRED iff corded_conversion is true (ERR_VALIDATION otherwise)", constraints: "> 0 when present" }
      - { name: min_pack_generation, type: integer, source: input, description: "Oldest pack generation this tool accepts (backward compatibility floor)", constraints: ">= 1" }
      - { name: max_pack_generation, type: integer, source: input, description: "Newest pack generation this tool commits to accept (forward compatibility ceiling)", constraints: ">= min_pack_generation and <= platform.current_generation + platform.forward_commitment_generations at creation" }
      - { name: replacement_price_cents, type: integer, source: input, description: "Full replacement price used by warranty credit calculation", constraints: ">= 0" }
      - { name: warranty_days, type: integer, source: input, description: "Total warranty length in days", constraints: "> 0 and a multiple of 30" }
      - { name: free_replacement_days, type: integer, source: input, description: "Inclusive free-replacement window in days from the age basis", constraints: ">= 0 and <= warranty_days" }
      - { name: torque_min_nm, type: number, source: input, description: "Lower bound of the owner-customizable torque range", constraints: "> 0 and < torque_max_nm" }
      - { name: torque_max_nm, type: number, source: input, description: "Upper bound of the owner-customizable torque range", constraints: "> torque_min_nm" }
      - { name: stage, type: enum, source: system, description: "CONCEPT -> FIELD_RESEARCH -> PROTOTYPE -> ENGINEERING_VALIDATION -> LAUNCHED; ENGINEERING_VALIDATION -> PROTOTYPE revert loop; any stage -> DISCONTINUED", constraints: "initial CONCEPT" }
      - { name: adopted_field_research_count, type: integer, source: computed, description: "Count of this tool's ResearchInsights with kind=FIELD_RESEARCH and status=ADOPTED" }
      - { name: adopted_jobsite_observation_count, type: integer, source: computed, description: "Count of this tool's ResearchInsights with kind=JOBSITE_OBSERVATION and status=ADOPTED" }
      - { name: regulatory_compatible_pack_count, type: integer, source: computed, description: "Size of the REGULATORY compatibility set (pack_compatibility_set): CERTIFIED, not RECALLED, not safety_hold packs of the same platform with pack_generation in [min_pack_generation, max_pack_generation]" }
      - { name: best_runtime_min, type: number, source: computed, required: false, description: "Max runtime_estimate over the REGULATORY compatibility set; null when the set is empty" }

  - name: ResearchInsight
    parent: null
    common_fields: true
    fields:
      - { name: tool_model_id, type: string, source: input, description: "FK -> ToolModel.id; tool this field research / jobsite observation informs" }
      - { name: kind, type: enum, source: input, description: "Research modality", constraints: "FIELD_RESEARCH | JOBSITE_OBSERVATION" }
      - { name: summary, type: string, source: input, description: "Free-text finding" }
      - { name: severity, type: enum, source: input, description: "Importance of the finding", constraints: "LOW | MEDIUM | HIGH" }
      - { name: status, type: enum, source: system, description: "SUBMITTED -> ADOPTED | REJECTED", constraints: "initial SUBMITTED" }
      - { name: submitted_by_user_id, type: string, source: system, description: "X-User-ID of the submitting FieldResearcher; segregation-of-duties reference for decide" }

  - name: ServiceCenter
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "Service center code", constraints: "unique across service centers" }
      - { name: region, type: string, source: input, description: "Region this repair center serves" }
      - { name: capabilities, type: array, source: input, description: "Service capabilities; BATTERY_REPLACEMENT claims need BATTERY_SERVICE, TOOL_REPAIR claims need TOOL_REPAIR", constraints: "non-empty subset of [TOOL_REPAIR, BATTERY_SERVICE]" }
      - { name: daily_capacity, type: integer, source: input, description: "Maximum claims booked per service_date (aggregate daily capacity)", constraints: ">= 1" }

  - name: AssetAccount
    parent: null
    common_fields: true
    fields:
      - { name: org_name, type: string, source: input, description: "One-Key owning organization name" }
      - { name: tier, type: enum, source: input, description: "Account tier; pins asset_limit", constraints: "STANDARD | PROFESSIONAL | FLEET" }
      - { name: asset_limit, type: integer, source: computed, description: "Max non-DECOMMISSIONED non-replacement assets the account may hold at once: STANDARD=10, PROFESSIONAL=100, FLEET=1000 (account_asset_usage)" }
      - { name: active_asset_count, type: integer, source: computed, description: "Count of this account's TrackedAssets with status != DECOMMISSIONED and is_replacement_unit = false" }

  - name: TrackedAsset
    parent: null
    common_fields: true
    fields:
      - { name: account_id, type: string, source: input, description: "FK -> AssetAccount.id; owning One-Key account" }
      - { name: subject_type, type: enum, source: input, description: "What kind of product unit this asset tracks", constraints: "TOOL | BATTERY" }
      - { name: tool_model_id, type: string, source: input, required: false, description: "FK -> ToolModel.id; required iff subject_type == TOOL, forbidden otherwise (ERR_VALIDATION)" }
      - { name: battery_pack_id, type: string, source: input, required: false, description: "FK -> BatteryPack.id; required iff subject_type == BATTERY, forbidden otherwise (ERR_VALIDATION)" }
      - { name: serial_number, type: string, source: input, description: "Unit serial number", constraints: "unique across tracked assets" }
      - { name: manufactured_at, type: datetime, source: input, description: "Manufacture timestamp; MANUFACTURE warranty age basis (used for BATTERY_REPLACEMENT claims)" }
      - { name: first_paired_at, type: datetime, source: system, description: "Server-stamped with the logical clock at creation (first One-Key pairing); ACTIVATION warranty age basis (used for TOOL_REPAIR claims)" }
      - { name: status, type: enum, source: system, description: "ACTIVE -> REPORTED_LOST -> ACTIVE (recover); ACTIVE | REPORTED_LOST -> DECOMMISSIONED", constraints: "initial ACTIVE" }
      - { name: custom_torque_limit_nm, type: number, source: input, required: false, description: "Owner customization; must lie within the linked ToolModel [torque_min_nm, torque_max_nm] range; TOOL assets only", default: null }
      - { name: anti_theft_lock_enabled, type: boolean, source: input, description: "Owner customization: remote lockout flag", default: false }
      - { name: is_replacement_unit, type: boolean, source: system, description: "True when created by warranty claim completion (battery replacement); replacement units are exempt from account asset_limit", default: false }

  - name: WarrantyClaim
    parent: null
    common_fields: true
    fields:
      - { name: tracked_asset_id, type: string, source: input, description: "FK -> TrackedAsset.id; the unit under claim" }
      - { name: claim_type, type: enum, source: input, description: "TOOL_REPAIR (tool assets) | BATTERY_REPLACEMENT (battery assets); must match the asset subject_type", constraints: "mismatch -> ERR_CLAIM_TYPE_MISMATCH" }
      - { name: fault_code, type: string, source: input, description: "Reporter-supplied fault classification code" }
      - { name: service_date, type: string, source: input, description: "Requested service day (YYYY-MM-DD); must be >= the logical clock's current date", constraints: "past dates -> ERR_SERVICE_DATE_PAST" }
      - { name: service_center_id, type: string, source: system, description: "FK -> ServiceCenter.id; auto-selected at creation by service_center_selection (capability + daily capacity; least booked, earliest created_at)" }
      - { name: adjudication_status, type: enum, source: system, description: "Parallel dimension 1: SUBMITTED -> APPROVED | REJECTED", constraints: "initial SUBMITTED" }
      - { name: fulfillment_status, type: enum, source: system, description: "Parallel dimension 2: NONE -> AWAITING_UNIT (on APPROVED) -> COMPLETED; NONE -> CANCELLED (on REJECTED)", constraints: "initial NONE" }
      - { name: age_basis, type: enum, source: system, description: "Warranty age variant pinned by claim_type: TOOL_REPAIR -> ACTIVATION (first_paired_at); BATTERY_REPLACEMENT -> MANUFACTURE (manufactured_at)" }
      - { name: age_days, type: integer, source: computed, required: false, description: "Floor of (logical clock - age basis timestamp) in whole days; computed at adjudication" }
      - { name: coverage, type: enum, source: computed, required: false, description: "FREE (age_days <= free_replacement_days) | PRORATED (<= warranty_days) | OUT_OF_WARRANTY; computed at adjudication" }
      - { name: credit_cents, type: integer, source: computed, required: false, description: "Approved credit per warranty_credit rounding order; FREE = full replacement_price_cents; computed at adjudication" }
      - { name: decided_by_user_id, type: string, source: system, required: false, description: "X-User-ID of the adjudicating ServiceAgent" }

  - name: ChannelPartner
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Distributor / retailer name" }
      - { name: channel_type, type: enum, source: input, description: "Distribution channel; drives product line segmentation", constraints: "INDUSTRIAL_DISTRIBUTOR | HOME_CENTER" }
      - { name: region, type: string, source: input, description: "Sales region" }
      - { name: has_suspended_listings, type: boolean, source: computed, description: "True while any of this partner's listings is SUSPENDED; while true, POST /listings for this partner is rejected (ERR_PARTNER_HAS_SUSPENDED_LISTINGS)", default: false }
      - { name: active_allocation_total, type: integer, source: computed, description: "Sum of allocation_qty over this partner's ACTIVE listings; drives the per-channel allocation cap" }

  - name: DistributionListing
    parent: null
    common_fields: true
    fields:
      - { name: channel_partner_id, type: string, source: input, description: "FK -> ChannelPartner.id; the listing channel" }
      - { name: tool_model_id, type: string, source: input, required: false, description: "FK -> ToolModel.id; exactly one of tool_model_id / battery_pack_id / charger_id must be set (ERR_VALIDATION)" }
      - { name: battery_pack_id, type: string, source: input, required: false, description: "FK -> BatteryPack.id; exactly one of tool_model_id / battery_pack_id / charger_id must be set" }
      - { name: charger_id, type: string, source: input, required: false, description: "FK -> Charger.id; exactly one of tool_model_id / battery_pack_id / charger_id must be set" }
      - { name: wholesale_price_cents, type: integer, source: input, description: "Partner wholesale price", constraints: ">= 0" }
      - { name: allocation_qty, type: integer, source: input, description: "Units allocated to this partner", constraints: ">= 1" }
      - { name: status, type: enum, source: system, description: "PROPOSED -> ACTIVE -> ENDED; ACTIVE -> SUSPENDED (safety cascade); SUSPENDED -> ACTIVE (relist) | ENDED", constraints: "initial PROPOSED" }
      - { name: requires_relist_ack, type: boolean, source: system, description: "Set true when SUSPENDED by a safety cascade; relist (SUSPENDED -> ACTIVE) implicitly acknowledges the bulletin and clears it", default: false }
      - { name: superseded_by_listing_id, type: string, source: system, required: false, description: "FK -> DistributionListing.id; set on the prior listing when a new listing for the same (channel_partner_id, product) supersedes it" }
      - { name: channel_partner_version, type: integer, source: computed, description: "Echo of the owning ChannelPartner's current version at response time; lets OCC clients refresh expected_channel_partner_version after partner mutations (listing creates and safety cascades bump the partner version)" }

  - name: CounterfeitCase
    parent: null
    common_fields: true
    fields:
      - { name: battery_pack_id, type: string, source: input, description: "FK -> BatteryPack.id; the pack SKU the reported unit claims to be" }
      - { name: reported_serial, type: string, source: input, description: "Serial printed on the suspect unit" }
      - { name: detection_method, type: enum, source: input, description: "How the suspect unit was detected", constraints: "SERIAL_MISMATCH | CHARGE_ANOMALY | PHYSICAL_INSPECTION" }
      - { name: status, type: enum, source: system, description: "REPORTED -> CONFIRMED | CLEARED", constraints: "initial REPORTED" }
      - { name: evidence_score, type: integer, source: input, description: "Investigator evidence score 0-100; CONFIRMED requires >= COUNTERFEIT_CONFIRM_THRESHOLD (70)", constraints: "0..100; below threshold with verdict CONFIRMED -> ERR_EVIDENCE_INSUFFICIENT" }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of the reporter (ChannelManager or AccountManager); segregation-of-duties reference for resolve" }
      - { name: resolved_by_user_id, type: string, source: system, required: false, description: "X-User-ID of the resolving ComplianceEngineer" }

  - name: SafetyBulletin
    parent: null
    common_fields: true
    fields:
      - { name: platform_id, type: string, source: input, description: "FK -> BatteryPlatform.id; platform this safety communication covers" }
      - { name: battery_pack_ids, type: array, source: input, required: false, description: "Array of BatteryPack.id values this bulletin targets; empty/absent means platform-wide", default: [] }
      - { name: severity, type: enum, source: input, description: "ADVISORY (no listing effect) | URGENT (suspend targeted packs' ACTIVE listings) | RECALL (recall targeted CERTIFIED packs and end their ACTIVE listings)", constraints: "ADVISORY | URGENT | RECALL" }
      - { name: title, type: string, source: input, description: "Bulletin title" }
      - { name: effective_from, type: datetime, source: input, description: "Start of the bulletin window (inclusive)" }
      - { name: effective_to, type: datetime, source: input, required: false, description: "End of the bulletin window (exclusive); null/absent = open-ended (treated as +infinity in overlap arithmetic)", default: null }
      - { name: supersedes_bulletin_id, type: string, source: input, required: false, description: "FK -> SafetyBulletin.id; an ISSUED bulletin of the same platform whose window overlaps and which this bulletin supersedes" }
      - { name: status, type: enum, source: system, description: "ISSUED at creation -> SUPERSEDED when a later bulletin names it in supersedes_bulletin_id", constraints: "initial ISSUED" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: BatteryPlatform
    initial_state: ACTIVE
    terminal_states: [RETIRED]
    transitions:
      - from: ACTIVE
        to: SUNSETTING
        trigger: "POST /_clock/set_current_utc advancing the logical clock to >= sunset_announce_date"
        actor: system
        preconditions:
          - "sunset_announce_date is set"
        side_effects:
          - "increments BatteryPlatform.version by 1"
        note: "SUNSETTING is advisory: pack/tool creation and launches remain allowed; the launch backward-commitment window check applies when sunset_date is set."
      - from: SUNSETTING
        to: RETIRED
        trigger: "POST /_clock/set_current_utc advancing the logical clock to >= sunset_date"
        actor: system
        preconditions:
          - "sunset_date is set"
        side_effects:
          - "increments BatteryPlatform.version by 1"
          - "blocks subsequent pack/tool creation, pack submit-certification, and tool launch with ERR_PLATFORM_RETIRED (enforced as validation priority 17)"

  - entity: BatteryPack
    initial_state: DESIGN
    terminal_states: [RECALLED]
    transitions:
      - from: DESIGN
        to: SUBMITTED
        trigger: "POST /battery-packs/{id}/submit-certification"
        actor: ProductEngineer
        preconditions:
          - "platform status != RETIRED (ERR_PLATFORM_RETIRED)"
        side_effects:
          - "submitted_by_user_id := X-User-ID of the caller"
          - "increments BatteryPack.version by 1"
      - from: REJECTED
        to: SUBMITTED
        trigger: "POST /battery-packs/{id}/submit-certification (resubmission)"
        actor: ProductEngineer
        preconditions:
          - "platform status != RETIRED (ERR_PLATFORM_RETIRED)"
        side_effects:
          - "submitted_by_user_id := X-User-ID of the caller"
          - "increments BatteryPack.version by 1"
      - from: SUBMITTED
        to: CERTIFIED
        trigger: "POST /battery-packs/{id}/decide-certification with decision=CERTIFIED"
        actor: ComplianceEngineer
        preconditions:
          - "X-User-ID != submitted_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "recompute platform.current_generation (platform_current_generation) and bump platform.version by 1"
          - "increments BatteryPack.version by 1"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /battery-packs/{id}/decide-certification with decision=REJECTED"
        actor: ComplianceEngineer
        preconditions:
          - "X-User-ID != submitted_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "increments BatteryPack.version by 1"
      - from: CERTIFIED
        to: RECALLED
        trigger: "system: creation of a RECALL-severity SafetyBulletin targeting this pack"
        actor: system
        preconditions: []
        side_effects:
          - "every ACTIVE DistributionListing referencing this pack transitions to ENDED (cascade hop 2 of the RECALL cascade)"
          - "recompute platform.current_generation and bump platform.version by 1"
          - "increments BatteryPack.version by 1"

  - entity: ToolModel
    initial_state: CONCEPT
    terminal_states: [DISCONTINUED]
    transitions:
      - from: CONCEPT
        to: FIELD_RESEARCH
        trigger: "POST /tool-models/{id}/transition with to_stage=FIELD_RESEARCH"
        actor: ProductEngineer
        preconditions:
          - "expected_tool_model_version == ToolModel.version (ERR_STALE_VERSION)"
        side_effects: ["increments ToolModel.version by 1"]
      - from: FIELD_RESEARCH
        to: PROTOTYPE
        trigger: "POST /tool-models/{id}/transition with to_stage=PROTOTYPE"
        actor: ProductEngineer
        preconditions:
          - "expected_tool_model_version == ToolModel.version (ERR_STALE_VERSION)"
          - "adopted_field_research_count >= 2 (ERR_INSUFFICIENT_FIELD_RESEARCH)"
        side_effects: ["increments ToolModel.version by 1"]
      - from: PROTOTYPE
        to: ENGINEERING_VALIDATION
        trigger: "POST /tool-models/{id}/transition with to_stage=ENGINEERING_VALIDATION"
        actor: ProductEngineer
        preconditions:
          - "expected_tool_model_version == ToolModel.version (ERR_STALE_VERSION)"
          - "adopted_jobsite_observation_count >= 1 (ERR_INSUFFICIENT_FIELD_RESEARCH)"
        side_effects: ["increments ToolModel.version by 1"]
      - from: ENGINEERING_VALIDATION
        to: LAUNCHED
        trigger: "POST /tool-models/{id}/transition with to_stage=LAUNCHED"
        actor: ProductEngineer
        preconditions:
          - "expected_tool_model_version == ToolModel.version (ERR_STALE_VERSION)"
          - "platform status != RETIRED (ERR_PLATFORM_RETIRED)"
          - "regulatory_compatible_pack_count >= 1 (ERR_CERTIFICATION_REQUIRED)"
          - "if corded_conversion: best_runtime_min >= runtime_target_min (ERR_RUNTIME_TARGET_UNMET)"
          - "if platform.sunset_date is set: logical-clock current date + platform.backward_commitment_years (calendar years) <= sunset_date (ERR_BACKWARD_COMMITMENT_WINDOW_EXCEEDED)"
        side_effects: ["increments ToolModel.version by 1"]
      - from: ENGINEERING_VALIDATION
        to: PROTOTYPE
        trigger: "POST /tool-models/{id}/transition with to_stage=PROTOTYPE (engineering revert loop)"
        actor: ProductEngineer
        preconditions:
          - "expected_tool_model_version == ToolModel.version (ERR_STALE_VERSION)"
        side_effects: ["increments ToolModel.version by 1"]
        note: "Revert does NOT reset adopted insight counts; looping back and re-entering ENGINEERING_VALIDATION requires no new insights."
      - from: CONCEPT
        to: DISCONTINUED
        trigger: "POST /tool-models/{id}/transition with to_stage=DISCONTINUED"
        actor: ProductEngineer
        preconditions: ["expected_tool_model_version == ToolModel.version (ERR_STALE_VERSION)"]
        side_effects: ["increments ToolModel.version by 1"]
      - from: FIELD_RESEARCH
        to: DISCONTINUED
        trigger: "POST /tool-models/{id}/transition with to_stage=DISCONTINUED"
        actor: ProductEngineer
        preconditions: ["expected_tool_model_version == ToolModel.version (ERR_STALE_VERSION)"]
        side_effects: ["increments ToolModel.version by 1"]
      - from: PROTOTYPE
        to: DISCONTINUED
        trigger: "POST /tool-models/{id}/transition with to_stage=DISCONTINUED"
        actor: ProductEngineer
        preconditions: ["expected_tool_model_version == ToolModel.version (ERR_STALE_VERSION)"]
        side_effects: ["increments ToolModel.version by 1"]
      - from: ENGINEERING_VALIDATION
        to: DISCONTINUED
        trigger: "POST /tool-models/{id}/transition with to_stage=DISCONTINUED"
        actor: ProductEngineer
        preconditions: ["expected_tool_model_version == ToolModel.version (ERR_STALE_VERSION)"]
        side_effects: ["increments ToolModel.version by 1"]
      - from: LAUNCHED
        to: DISCONTINUED
        trigger: "POST /tool-models/{id}/transition with to_stage=DISCONTINUED"
        actor: ProductEngineer
        preconditions: ["expected_tool_model_version == ToolModel.version (ERR_STALE_VERSION)"]
        side_effects:
          - "every ACTIVE DistributionListing referencing this tool transitions to ENDED"
          - "increments ToolModel.version by 1"

  - entity: ResearchInsight
    initial_state: SUBMITTED
    terminal_states: [ADOPTED, REJECTED]
    transitions:
      - from: SUBMITTED
        to: ADOPTED
        trigger: "POST /insights/{id}/decide with decision=ADOPTED"
        actor: ProductEngineer
        preconditions:
          - "X-User-ID != submitted_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "recompute ToolModel.adopted_field_research_count / adopted_jobsite_observation_count for the linked tool and bump ToolModel.version by 1"
          - "increments ResearchInsight.version by 1"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /insights/{id}/decide with decision=REJECTED"
        actor: ProductEngineer
        preconditions:
          - "X-User-ID != submitted_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects: ["increments ResearchInsight.version by 1"]

  - entity: TrackedAsset
    initial_state: ACTIVE
    terminal_states: [DECOMMISSIONED]
    transitions:
      - from: ACTIVE
        to: REPORTED_LOST
        trigger: "POST /tracked-assets/{id}/transition with to_status=REPORTED_LOST"
        actor: AccountManager
        preconditions:
          - "X-User-ID == TrackedAsset.account_id (ERR_FORBIDDEN)"
        side_effects: ["increments TrackedAsset.version by 1"]
      - from: REPORTED_LOST
        to: ACTIVE
        trigger: "POST /tracked-assets/{id}/transition with to_status=ACTIVE (recovery)"
        actor: AccountManager
        preconditions:
          - "X-User-ID == TrackedAsset.account_id (ERR_FORBIDDEN)"
        side_effects: ["increments TrackedAsset.version by 1"]
      - from: ACTIVE
        to: DECOMMISSIONED
        trigger: "POST /tracked-assets/{id}/transition with to_status=DECOMMISSIONED"
        actor: AccountManager
        preconditions:
          - "X-User-ID == TrackedAsset.account_id (ERR_FORBIDDEN)"
        side_effects:
          - "recompute AssetAccount.active_asset_count (frees one asset_limit slot)"
          - "increments TrackedAsset.version by 1"
      - from: REPORTED_LOST
        to: DECOMMISSIONED
        trigger: "POST /tracked-assets/{id}/transition with to_status=DECOMMISSIONED"
        actor: AccountManager
        preconditions:
          - "X-User-ID == TrackedAsset.account_id (ERR_FORBIDDEN)"
        side_effects:
          - "recompute AssetAccount.active_asset_count"
          - "increments TrackedAsset.version by 1"

  - entity: WarrantyClaim
    initial_state: "adjudication_status=SUBMITTED, fulfillment_status=NONE (parallel dimensions evolve independently; the only cross-dimension gate is complete requiring APPROVED + AWAITING_UNIT)"
    terminal_states: ["adjudication_status: APPROVED | REJECTED", "fulfillment_status: COMPLETED | CANCELLED"]
    transitions:
      - from: "adjudication SUBMITTED"
        to: "adjudication APPROVED"
        trigger: "POST /warranty-claims/{id}/adjudicate with decision=APPROVED"
        actor: ServiceAgent
        preconditions:
          - "X-User-ID == WarrantyClaim.service_center_id (ERR_FORBIDDEN)"
          - "coverage computed at the current logical clock != OUT_OF_WARRANTY (ERR_WARRANTY_EXPIRED)"
        side_effects:
          - "compute age_basis, age_days, coverage, credit_cents per warranty_age_and_credit and persist them"
          - "decided_by_user_id := X-User-ID"
          - "fulfillment_status NONE -> AWAITING_UNIT (cross-dimension side effect)"
          - "increments WarrantyClaim.version by 1"
      - from: "adjudication SUBMITTED"
        to: "adjudication REJECTED"
        trigger: "POST /warranty-claims/{id}/adjudicate with decision=REJECTED"
        actor: ServiceAgent
        preconditions:
          - "X-User-ID == WarrantyClaim.service_center_id (ERR_FORBIDDEN)"
        side_effects:
          - "decided_by_user_id := X-User-ID"
          - "fulfillment_status NONE -> CANCELLED"
          - "release the service-center daily booking (compensating action of the booking made at creation; booked_count for (service_center_id, service_date) decreases by 1)"
          - "increments WarrantyClaim.version by 1"
      - from: "fulfillment AWAITING_UNIT"
        to: "fulfillment COMPLETED"
        trigger: "POST /warranty-claims/{id}/complete"
        actor: ServiceAgent
        preconditions:
          - "X-User-ID == WarrantyClaim.service_center_id (ERR_FORBIDDEN)"
          - "adjudication_status == APPROVED (cross-dimension join gate; otherwise ERR_INVALID_STATE)"
        side_effects:
          - "if claim_type == BATTERY_REPLACEMENT: create a replacement TrackedAsset on the same account with subject_type=BATTERY, the same battery_pack_id, is_replacement_unit=true, system-generated serial_number, manufactured_at and first_paired_at stamped from the logical clock (exempt from asset_limit)"
          - "release the service-center daily booking for (service_center_id, service_date)"
          - "increments WarrantyClaim.version by 1"

  - entity: DistributionListing
    initial_state: PROPOSED
    terminal_states: [ENDED]
    transitions:
      - from: PROPOSED
        to: ACTIVE
        trigger: "POST /listings/{id}/transition with to_status=ACTIVE"
        actor: ChannelManager
        preconditions:
          - "X-User-ID == DistributionListing.channel_partner_id (ERR_FORBIDDEN)"
          - "product certification gate: battery_pack listings require the pack CERTIFIED (else ERR_CERTIFICATION_REQUIRED) and not safety_hold (ERR_SAFETY_HOLD); tool_model listings require the tool LAUNCHED (ERR_INVALID_STATE); charger listings have no gate"
          - "segmentation: HOME_CENTER partners may not activate TRADE_SPECIALIST tools nor packs with rated_capacity_wh > PRO_PACK_CAPACITY_THRESHOLD_WH (216) (ERR_SEGMENT_NOT_ALLOWED)"
          - "allocation cap: partner active_allocation_total + allocation_qty <= channel cap (HOME_CENTER 500, INDUSTRIAL_DISTRIBUTOR 10000) (ERR_ALLOCATION_CAP_EXCEEDED)"
        side_effects:
          - "recompute ChannelPartner.active_allocation_total"
          - "increments DistributionListing.version by 1"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system: CONFIRMED counterfeit case on the listed pack, or URGENT-severity SafetyBulletin targeting the listed pack (safety cascade hop 2)"
        actor: system
        preconditions: []
        side_effects:
          - "requires_relist_ack := true"
          - "recompute ChannelPartner.has_suspended_listings (true) and active_allocation_total (cascade hop 3: the partner gate engages)"
          - "increments DistributionListing.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /listings/{id}/transition with to_status=ACTIVE (relist; implicitly acknowledges the safety bulletin)"
        actor: ChannelManager
        preconditions:
          - "X-User-ID == DistributionListing.channel_partner_id (ERR_FORBIDDEN)"
          - "listed pack safety_hold == false (ERR_SAFETY_HOLD)"
          - "listed pack certification_status == CERTIFIED (ERR_CERTIFICATION_REQUIRED)"
          - "segmentation and allocation-cap rules re-evaluated as for PROPOSED -> ACTIVE"
        side_effects:
          - "requires_relist_ack := false"
          - "recompute ChannelPartner.has_suspended_listings and active_allocation_total"
          - "increments DistributionListing.version by 1"
      - from: PROPOSED
        to: ENDED
        trigger: "POST /listings/{id}/transition with to_status=ENDED"
        actor: ChannelManager
        preconditions: ["X-User-ID == DistributionListing.channel_partner_id (ERR_FORBIDDEN)"]
        side_effects: ["recompute ChannelPartner totals/flags", "increments DistributionListing.version by 1"]
      - from: ACTIVE
        to: ENDED
        trigger: "POST /listings/{id}/transition with to_status=ENDED, or system: pack RECALL cascade / tool DISCONTINUED cascade / supersede by a newer listing for the same (channel_partner_id, product)"
        actor: ChannelManager
        preconditions: ["X-User-ID == DistributionListing.channel_partner_id (ERR_FORBIDDEN) for the manual trigger; system triggers bypass the ownership check"]
        side_effects: ["recompute ChannelPartner totals/flags", "increments DistributionListing.version by 1"]
      - from: SUSPENDED
        to: ENDED
        trigger: "POST /listings/{id}/transition with to_status=ENDED"
        actor: ChannelManager
        preconditions: ["X-User-ID == DistributionListing.channel_partner_id (ERR_FORBIDDEN)"]
        side_effects: ["recompute ChannelPartner totals/flags (has_suspended_listings may clear)", "increments DistributionListing.version by 1"]

  - entity: CounterfeitCase
    initial_state: REPORTED
    terminal_states: [CONFIRMED, CLEARED]
    transitions:
      - from: REPORTED
        to: CONFIRMED
        trigger: "POST /counterfeit-cases/{id}/resolve with verdict=CONFIRMED"
        actor: ComplianceEngineer
        preconditions:
          - "X-User-ID != created_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
          - "evidence_score >= 70 (COUNTERFEIT_CONFIRM_THRESHOLD; else ERR_EVIDENCE_INSUFFICIENT)"
        side_effects:
          - "resolved_by_user_id := X-User-ID"
          - "hop 1: BatteryPack.safety_hold := true and bump pack.version"
          - "hop 2 (caused by hop 1): every ACTIVE DistributionListing referencing the pack transitions ACTIVE -> SUSPENDED with requires_relist_ack := true"
          - "hop 3 (caused by hop 2): each affected ChannelPartner.has_suspended_listings recomputes to true, engaging ERR_PARTNER_HAS_SUSPENDED_LISTINGS on subsequent POST /listings"
          - "increments CounterfeitCase.version by 1"
      - from: REPORTED
        to: CLEARED
        trigger: "POST /counterfeit-cases/{id}/resolve with verdict=CLEARED"
        actor: ComplianceEngineer
        preconditions:
          - "X-User-ID != created_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "resolved_by_user_id := X-User-ID"
          - "increments CounterfeitCase.version by 1"

  - entity: SafetyBulletin
    initial_state: ISSUED
    terminal_states: [SUPERSEDED]
    transitions:
      - from: ISSUED
        to: SUPERSEDED
        trigger: "system: creation of a new SafetyBulletin on the same platform naming this bulletin in supersedes_bulletin_id"
        actor: system
        preconditions: []
        side_effects: ["increments SafetyBulletin.version by 1"]
        note: "Bulletin CREATION (POST /safety-bulletins) is itself the cascade origin, not a transition: RECALL severity moves each targeted CERTIFIED pack to RECALLED (hop 1) whose own transition ends its ACTIVE listings (hop 2); URGENT severity forces targeted packs' ACTIVE listings to SUSPENDED; ADVISORY has no listing effect."

# =============================================================================
# 1.2.1 Concurrency Rules (OCC on the parent entity's version — the only
# sanctioned write-write conflict mechanism; all other ordering is state
# preconditions)
# =============================================================================
concurrency_rules:
  - rule_id: listing-create-stale-partner
    parent_entity: ChannelPartner
    write_endpoint: "POST /listings"
    occ_field: "expected_channel_partner_version"
    description: |
      Creating a DistributionListing against a ChannelPartner whose version has
      advanced since the client last observed it is rejected. Listing creation
      legitimately supersedes any prior non-ENDED listing of the same
      (channel_partner_id, product), so a writer holding a stale partner view
      must re-read before its create is accepted.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: asset-customize-stale-asset
    parent_entity: TrackedAsset
    write_endpoint: "POST /tracked-assets/{id}/customize"
    occ_field: "expected_tracked_asset_version"
    description: |
      Customizing a TrackedAsset whose version has advanced since the client
      last observed it is rejected. Customization is a plain field update that
      would otherwise legitimately succeed, so the stale view is detected purely
      via the asset version.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: tool-transition-stale-tool
    parent_entity: ToolModel
    write_endpoint: "POST /tool-models/{id}/transition"
    occ_field: "expected_tool_model_version"
    description: |
      Transitioning a ToolModel whose version has advanced since the client last
      observed it is rejected. Both forward edges and the ENGINEERING_VALIDATION
      revert edge mutate the tool and bump its version; a writer whose view
      predates another accepted mutation must re-read before transitioning.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: platform_current_generation
    trigger: "battery pack decide-certification with decision=CERTIFIED; RECALL cascade removing a CERTIFIED pack"
    algorithm: aggregation
    formula: |
      platform.current_generation = max(pack_generation over packs of this platform
                                        with certification_status == CERTIFIED)
                                    or 0 when the set is empty.
    input_set: "BatteryPacks of the platform with certification_status == CERTIFIED only (SUBMITTED, DESIGN, REJECTED, RECALLED excluded)"
    constants: {}
    precision: "integer"

  - name: pack_compatibility_set
    trigger: "tool creation and launch gate (REGULATORY); GET-based engineering exploration (ENGINEERING); regulatory_compatible_pack_count and best_runtime_min derivation"
    algorithm: aggregation
    formula: |
      Base eligibility: pack.platform_id == tool.platform_id
                        AND tool.min_pack_generation <= pack.pack_generation <= tool.max_pack_generation.
      REGULATORY variant: restrict to certification_status == CERTIFIED AND safety_hold == false
                          (RECALLED packs are not CERTIFIED, so excluded automatically).
      ENGINEERING variant: restrict to certification_status IN {CERTIFIED, SUBMITTED}
                           (safety_hold ignored; RECALLED excluded).
      The two variants give different sets whenever a SUBMITTED in-range pack exists.
    input_set: "all BatteryPacks of the tool's platform, generation-filtered, then variant-filtered"
    constants: {}
    precision: "set semantics; counts are integers"
    variants:
      - name: REGULATORY
        when: "launch gate (EV -> LAUNCHED), regulatory_compatible_pack_count, best_runtime_min, channel listing certification checks"
        difference: "CERTIFIED and not on safety_hold only"
      - name: ENGINEERING
        when: "engineering exploration during development (observable by enumerating GET /battery-packs with certification_status filters)"
        difference: "CERTIFIED + SUBMITTED, safety_hold ignored — a superset of REGULATORY whenever a SUBMITTED in-range pack exists"

  - name: runtime_estimate
    trigger: "computed per (tool, pack) pair inside the REGULATORY set for best_runtime_min and the corded-conversion launch gate"
    algorithm: threshold
    formula: |
      gen_gap   = pack.pack_generation - tool.min_pack_generation          # >= 0 for eligible packs
      efficiency = max(1.0 - GEN_GAP_EFFICIENCY_STEP * min(gen_gap, GEN_GAP_EFFICIENCY_CAP),
                       MIN_EFFICIENCY)                                      # floor binds at gap >= 4
      runtime_minutes = round_half_up(pack.rated_capacity_wh * efficiency
                                      / tool.avg_power_draw_w * 60, 1)
      Evaluation order is fixed: gen_gap, then min() cap, then max() floor, then the
      single round at the end. Three inputs (capacity, power draw, generation gap)
      interact non-linearly through the capped/floored derate.
    input_set: "one (ToolModel, BatteryPack) pair with pack in the tool's REGULATORY set"
    constants:
      GEN_GAP_EFFICIENCY_STEP: 0.05
      GEN_GAP_EFFICIENCY_CAP: 4
      MIN_EFFICIENCY: 0.8
    precision: "1 decimal place, round_half_up"

  - name: warranty_age_and_credit
    trigger: "WarrantyClaim adjudication (POST /warranty-claims/{id}/adjudicate with decision=APPROVED or REJECTED); results persisted on the claim"
    algorithm: threshold
    formula: |
      age_basis = ACTIVATION (asset.first_paired_at)  when claim_type == TOOL_REPAIR
                  MANUFACTURE (asset.manufactured_at) when claim_type == BATTERY_REPLACEMENT
      age_days  = floor((logical_clock_now - age_basis_timestamp) / 86400 seconds)
      subject   = asset.tool_model_id's ToolModel  when claim_type == TOOL_REPAIR
                  asset.battery_pack_id's BatteryPack when claim_type == BATTERY_REPLACEMENT
      coverage  = FREE           when age_days <= subject.free_replacement_days   # inclusive boundary
                  PRORATED       when free_replacement_days < age_days <= subject.warranty_days
                  OUT_OF_WARRANTY when age_days > subject.warranty_days
      credit_cents (FREE)           = subject.replacement_price_cents
      credit_cents (PRORATED)       = monthly_rate_cents * remaining_full_months, where
          monthly_rate_cents    = round_half_up(subject.replacement_price_cents
                                                / (subject.warranty_days / DAYS_PER_MONTH), 0)   # ROUND FIRST
          remaining_full_months = floor((subject.warranty_days - age_days) / DAYS_PER_MONTH)      # THEN multiply
      credit_cents (OUT_OF_WARRANTY) = 0 and APPROVE is rejected with ERR_WARRANTY_EXPIRED
      ROUNDING ORDER IS PINNED: the monthly rate is rounded to whole cents BEFORE
      multiplying by remaining_full_months. Rounding only the final product is a
      different (non-conformant) algorithm and yields different cents.
    input_set: "the claimed TrackedAsset plus its linked ToolModel or BatteryPack warranty fields"
    constants:
      DAYS_PER_MONTH: 30
    precision: "integer cents, round_half_up on the monthly rate only"
    variants:
      - name: ACTIVATION
        when: "claim_type == TOOL_REPAIR"
        difference: "age measured from first_paired_at (One-Key activation)"
      - name: MANUFACTURE
        when: "claim_type == BATTERY_REPLACEMENT"
        difference: "age measured from manufactured_at — strictly older whenever pairing happens after manufacture, so identical units can fall into different coverage bands"

  - name: charge_time_estimate
    trigger: "GET /battery-packs/{id} with charger_id query parameter"
    algorithm: threshold
    formula: |
      if charger.platform_id != pack.platform_id: reject with ERR_INCOMPATIBLE_PAIRING
      effective_rate_w = min(charger.max_charge_rate_w, pack.max_charge_rate_w)
      if charger.charger_generation < pack.pack_generation:
          effective_rate_w = round_half_up(effective_rate_w * LEGACY_CHARGE_DERATE, 0)  # legacy charger derate
      charge_estimate_minutes = round_half_up(pack.rated_capacity_wh / effective_rate_w * 60, 0)
      charger_compatible = (charger.platform_id == pack.platform_id)
    input_set: "one Charger and one BatteryPack"
    constants:
      LEGACY_CHARGE_DERATE: 0.5
    precision: "integer minutes, round_half_up"

  - name: service_center_selection
    trigger: "WarrantyClaim creation"
    algorithm: waterfall_allocation
    formula: |
      booked_count(center, date) = count of WarrantyClaims with service_center_id == center.id
                                   AND service_date == date
                                   AND adjudication_status IN {SUBMITTED, APPROVED}
                                   AND fulfillment_status IN {NONE, AWAITING_UNIT}
      eligibility  = centers whose capabilities contain the capability required by claim_type
                     (TOOL_REPAIR claim -> TOOL_REPAIR capability;
                      BATTERY_REPLACEMENT claim -> BATTERY_SERVICE capability)
                     AND booked_count(center, service_date) < center.daily_capacity
      ranking      = booked_count(center, service_date) ASC
      tie-break    = center.created_at ASC (never id)
      empty pool   = ERR_NO_SERVICE_CAPACITY
    input_set: "all ServiceCenters"
    constants: {}
    precision: "integer counts"

  - name: account_asset_usage
    trigger: "TrackedAsset creation and DECOMMISSIONED transitions"
    algorithm: aggregation
    formula: |
      account.asset_limit        = STANDARD 10 | PROFESSIONAL 100 | FLEET 1000
      account.active_asset_count = count of the account's TrackedAssets with
                                   status != DECOMMISSIONED AND is_replacement_unit == false
      creation allowed iff active_asset_count < asset_limit; at equality the create is
      rejected with ERR_ASSET_LIMIT_EXCEEDED (the limit is an inclusive maximum: exactly
      asset_limit live assets are allowed, the next one fails).
      Replacement units created by claim completion bypass the check entirely.
    input_set: "TrackedAssets of the account"
    constants:
      ASSET_LIMIT_STANDARD: 10
      ASSET_LIMIT_PROFESSIONAL: 100
      ASSET_LIMIT_FLEET: 1000
    precision: "integer counts"

  - name: channel_allocation_cap
    trigger: "DistributionListing transition to ACTIVE (from PROPOSED or SUSPENDED)"
    algorithm: threshold
    formula: |
      partner.active_allocation_total = sum of allocation_qty over the partner's ACTIVE listings
      cap = HOME_CENTER 500 | INDUSTRIAL_DISTRIBUTOR 10000
      activation allowed iff active_allocation_total + this.allocation_qty <= cap   # cap is inclusive
      Segmentation (checked before the cap): HOME_CENTER may not activate listings of
      TRADE_SPECIALIST tools or packs with rated_capacity_wh > PRO_PACK_CAPACITY_THRESHOLD_WH.
    input_set: "the partner's DistributionListings with status == ACTIVE plus the listing being activated"
    constants:
      HOME_CENTER_ALLOCATION_CAP: 500
      INDUSTRIAL_ALLOCATION_CAP: 10000
      PRO_PACK_CAPACITY_THRESHOLD_WH: 216
    precision: "integer units"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority — a request failing several
# rules reports the LOWEST-priority-numbered violation)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and one of the declared roles; X-User-ID present"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all endpoints"
  - priority: 2
    category: auth
    check: "Role is listed in the endpoint's roles"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all endpoints"
  - priority: 3
    category: auth
    check: "Entity-backed ownership: AccountManager X-User-ID == target account_id (asset create/customize/transition; claim create via asset.account_id); ChannelManager X-User-ID == channel_partner_id (listing create/transition); ServiceAgent X-User-ID == claim.service_center_id (adjudicate/complete)"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "POST /tracked-assets*, POST /warranty-claims*, POST /listings*"
  - priority: 4
    category: existence
    check: "Path ids and body FK references (platform_id, tool_model_id, battery_pack_id, charger_id, account_id, tracked_asset_id, supersedes_bulletin_id, bulletin battery_pack_ids members) exist, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints"
  - priority: 5
    category: business_constraint
    check: "Request shape: required fields present; enum membership valid; numeric ranges; runtime_target_min present iff corded_conversion; exactly one of tool_model_id/battery_pack_id/charger_id on listing create; subject FK matching subject_type on asset create; warranty_days multiple of 30 and free_replacement_days <= warranty_days; pack_generation >= 1; torque_min_nm < torque_max_nm; to_stage/to_status/decision/verdict enum membership"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all POST endpoints"
  - priority: 6
    category: state
    check: "Entity in a valid from-state for the requested transition (incl. terminal-state lockdown; skip-stage targets rejected); asset must be ACTIVE for claim creation and customize; claim fulfillment gate for complete"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition/decide/resolve/complete endpoints; POST /warranty-claims; POST /tracked-assets/{id}/customize"
  - priority: 7
    category: business_safety
    check: "Segregation of duties: pack decider != pack submitted_by_user_id; insight decider != insight submitted_by_user_id; counterfeit resolver != case created_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /battery-packs/{id}/decide-certification, POST /insights/{id}/decide, POST /counterfeit-cases/{id}/resolve"
  - priority: 8
    category: business_constraint
    check: "OCC: expected_channel_partner_version / expected_tracked_asset_version / expected_tool_model_version equals the parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /listings, POST /tracked-assets/{id}/customize, POST /tool-models/{id}/transition"
  - priority: 9
    category: business_safety
    check: "Safety hold: pack listings cannot activate/relist while pack.safety_hold is true; pack certification decision evidence: counterfeit CONFIRMED requires evidence_score >= 70"
    error_id: ERR_SAFETY_HOLD
    http_status: 409
    applies_to: "POST /listings/{id}/transition (ERR_SAFETY_HOLD); POST /counterfeit-cases/{id}/resolve uses ERR_EVIDENCE_INSUFFICIENT (422) for the evidence half of this row"
  - priority: 10
    category: business_referential
    check: "Cross-entity reference coherence: charger and pack share platform for charge estimates (ERR_INCOMPATIBLE_PAIRING); claim_type matches asset subject_type (ERR_CLAIM_TYPE_MISMATCH)"
    error_id: ERR_INCOMPATIBLE_PAIRING
    http_status: 409
    applies_to: "GET /battery-packs/{id} with charger_id; POST /warranty-claims"
  - priority: 11
    category: business_constraint
    check: "Uniqueness: platform code, pack sku, charger model_code, tool model_code, center code, asset serial_number"
    error_id: ERR_DUPLICATE_SKU
    http_status: 409
    applies_to: "create endpoints (ERR_DUPLICATE_SKU for pack sku / model_code / code collisions; ERR_DUPLICATE_SERIAL for asset serial_number)"
  - priority: 12
    category: business_constraint
    check: "Generation policy: pack_generation <= platform.current_generation + 1 (ERR_PACK_GENERATION_VIOLATION); tool max_pack_generation <= platform.current_generation + platform.forward_commitment_generations (ERR_FORWARD_COMMITMENT_EXCEEDED)"
    error_id: ERR_PACK_GENERATION_VIOLATION
    http_status: 409
    applies_to: "POST /battery-packs; POST /tool-models"
  - priority: 13
    category: business_constraint
    check: "Tool development gates: adopted FIELD_RESEARCH insights >= 2 for PROTOTYPE (ERR_INSUFFICIENT_FIELD_RESEARCH); adopted JOBSITE_OBSERVATION >= 1 for ENGINEERING_VALIDATION; regulatory_compatible_pack_count >= 1 for LAUNCHED (ERR_CERTIFICATION_REQUIRED); corded_conversion best_runtime_min >= runtime_target_min (ERR_RUNTIME_TARGET_UNMET)"
    error_id: ERR_INSUFFICIENT_FIELD_RESEARCH
    http_status: 409
    applies_to: "POST /tool-models/{id}/transition"
  - priority: 14
    category: business_constraint
    check: "Channel segmentation: HOME_CENTER may not activate TRADE_SPECIALIST tools or packs with rated_capacity_wh > 216"
    error_id: ERR_SEGMENT_NOT_ALLOWED
    http_status: 409
    applies_to: "POST /listings/{id}/transition"
  - priority: 15
    category: business_constraint
    check: "Bulletin window overlap on same platform: new [effective_from, effective_to) half-open window may not intersect any ISSUED bulletin's window (adjacency allowed: new.from == existing.to is NOT an overlap) unless supersedes_bulletin_id names an overlapping ISSUED bulletin"
    error_id: ERR_BULLETIN_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /safety-bulletins"
  - priority: 16
    category: business_constraint
    check: "Partner with has_suspended_listings == true cannot create new listings until every SUSPENDED listing is re-listed or ENDED"
    error_id: ERR_PARTNER_HAS_SUSPENDED_LISTINGS
    http_status: 409
    applies_to: "POST /listings"
  - priority: 17
    category: business_temporal
    check: "Platform lifecycle: RETIRED platform blocks pack creation, tool creation, pack submit-certification, and tool launch"
    error_id: ERR_PLATFORM_RETIRED
    http_status: 409
    applies_to: "POST /battery-packs, POST /tool-models, POST /battery-packs/{id}/submit-certification, POST /tool-models/{id}/transition"
  - priority: 18
    category: business_temporal
    check: "Backward commitment window: tool launch with platform.sunset_date set requires logical-clock current date + platform.backward_commitment_years (calendar years) <= sunset_date"
    error_id: ERR_BACKWARD_COMMITMENT_WINDOW_EXCEEDED
    http_status: 409
    applies_to: "POST /tool-models/{id}/transition to LAUNCHED"
  - priority: 19
    category: business_temporal
    check: "Claim service_date must be >= the logical clock's current date"
    error_id: ERR_SERVICE_DATE_PAST
    http_status: 422
    applies_to: "POST /warranty-claims"
  - priority: 20
    category: business_temporal
    check: "Warranty age: adjudicate APPROVED when coverage computes to OUT_OF_WARRANTY is rejected"
    error_id: ERR_WARRANTY_EXPIRED
    http_status: 422
    applies_to: "POST /warranty-claims/{id}/adjudicate"
  - priority: 21
    category: business_fiscal
    check: "Service capacity: no eligible service center with free daily capacity for service_date"
    error_id: ERR_NO_SERVICE_CAPACITY
    http_status: 409
    applies_to: "POST /warranty-claims"
  - priority: 22
    category: business_fiscal
    check: "Account asset limit: active_asset_count == asset_limit blocks non-replacement asset creation"
    error_id: ERR_ASSET_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "POST /tracked-assets"
  - priority: 23
    category: business_fiscal
    check: "Allocation cap: partner active_allocation_total + allocation_qty > channel cap"
    error_id: ERR_ALLOCATION_CAP_EXCEEDED
    http_status: 409
    applies_to: "POST /listings/{id}/transition to ACTIVE"

# =============================================================================
# 1.5 API Endpoint Table (40 endpoints; #40 is the only one outside api_prefix)
# =============================================================================
endpoints:
  # --- platform & catalog ---
  - method: POST
    path: "/battery-ecosystem/battery-platforms"
    description: "Create a battery platform (status ACTIVE, current_generation 0)"
    roles: [PlatformAdmin]
    code: 201
    input: [code, interface_key, chemistry_family, backward_commitment_years, forward_commitment_generations, "sunset_announce_date?", "sunset_date?"]
    output: BatteryPlatform
    side_effects: ["status=ACTIVE", "current_generation=0"]

  - method: POST
    path: "/battery-ecosystem/battery-packs"
    description: "Create a battery pack SKU in DESIGN (cell sourcing fields included)"
    roles: [ProductEngineer]
    code: 201
    input: [platform_id, sku, pack_generation, cell_supplier_code, cell_format, rated_capacity_wh, max_charge_rate_w, replacement_price_cents, warranty_days, free_replacement_days]
    output: BatteryPack
    side_effects: ["certification_status=DESIGN", "safety_hold=false"]

  - method: GET
    path: "/battery-ecosystem/battery-packs/{id}"
    description: "Get a pack; with charger_id query param the response adds computed charger_compatible and charge_estimate_minutes (ERR_INCOMPATIBLE_PAIRING when platforms differ)"
    roles: [PlatformAdmin, ProductEngineer, ComplianceEngineer, FieldResearcher, ServiceAgent, AccountManager, ChannelManager]
    code: 200
    input: ["charger_id?"]
    output: BatteryPack
    side_effects: []

  - method: GET
    path: "/battery-ecosystem/battery-packs"
    description: "List packs with optional filters (FK reverse-reach for BatteryPack.platform_id)"
    roles: [PlatformAdmin, ProductEngineer, ComplianceEngineer, FieldResearcher, ServiceAgent, AccountManager, ChannelManager]
    code: 200
    input: ["platform_id?", "certification_status?", "limit?", "offset?"]
    output: BatteryPack[]
    side_effects: []

  - method: POST
    path: "/battery-ecosystem/battery-packs/{id}/submit-certification"
    description: "Submit pack for safety certification (DESIGN or REJECTED -> SUBMITTED)"
    roles: [ProductEngineer]
    code: 200
    input: []
    output: BatteryPack
    side_effects: ["certification_status=SUBMITTED", "submitted_by_user_id := X-User-ID", "increments BatteryPack.version by 1"]

  - method: POST
    path: "/battery-ecosystem/battery-packs/{id}/decide-certification"
    description: "Certification decision; segregation of duties vs submitted_by_user_id"
    roles: [ComplianceEngineer]
    code: 200
    input: [decision]
    output: BatteryPack
    side_effects: ["certification_status=CERTIFIED|REJECTED", "on CERTIFIED: recompute platform.current_generation", "increments BatteryPack.version by 1"]

  - method: GET
    path: "/battery-ecosystem/battery-packs/{id}/counterfeit-cases"
    description: "List counterfeit cases filed against this pack (FK reverse-reach for CounterfeitCase.battery_pack_id)"
    roles: [PlatformAdmin, ProductEngineer, ComplianceEngineer, FieldResearcher, ServiceAgent, AccountManager, ChannelManager]
    code: 200
    input: ["limit?", "offset?"]
    output: CounterfeitCase[]
    side_effects: []

  - method: POST
    path: "/battery-ecosystem/chargers"
    description: "Create a charger (charger interoperability is platform- and generation-scoped)"
    roles: [ProductEngineer]
    code: 201
    input: [platform_id, model_code, charger_generation, max_charge_rate_w]
    output: Charger
    side_effects: []

  - method: GET
    path: "/battery-ecosystem/chargers/{id}"
    description: "Get a charger"
    roles: [PlatformAdmin, ProductEngineer, ComplianceEngineer, FieldResearcher, ServiceAgent, AccountManager, ChannelManager]
    code: 200
    input: []
    output: Charger
    side_effects: []

  - method: GET
    path: "/battery-ecosystem/chargers"
    description: "List chargers (FK reverse-reach for Charger.platform_id)"
    roles: [PlatformAdmin, ProductEngineer, ComplianceEngineer, FieldResearcher, ServiceAgent, AccountManager, ChannelManager]
    code: 200
    input: ["platform_id?", "limit?", "offset?"]
    output: Charger[]
    side_effects: []

  # --- tool development ---
  - method: POST
    path: "/battery-ecosystem/tool-models"
    description: "Create a trade-targeted tool model in CONCEPT"
    roles: [ProductEngineer]
    code: 201
    input: [platform_id, model_code, trade, category, tier, corded_conversion, avg_power_draw_w, "runtime_target_min?", min_pack_generation, max_pack_generation, replacement_price_cents, warranty_days, free_replacement_days, torque_min_nm, torque_max_nm]
    output: ToolModel
    side_effects: ["stage=CONCEPT", "adopted counts=0", "regulatory_compatible_pack_count computed"]

  - method: GET
    path: "/battery-ecosystem/tool-models/{id}"
    description: "Get a tool model incl. computed adopted insight counts, regulatory_compatible_pack_count, best_runtime_min"
    roles: [PlatformAdmin, ProductEngineer, ComplianceEngineer, FieldResearcher, ServiceAgent, AccountManager, ChannelManager]
    code: 200
    input: []
    output: ToolModel
    side_effects: []

  - method: GET
    path: "/battery-ecosystem/tool-models"
    description: "List tool models (FK reverse-reach for ToolModel.platform_id)"
    roles: [PlatformAdmin, ProductEngineer, ComplianceEngineer, FieldResearcher, ServiceAgent, AccountManager, ChannelManager]
    code: 200
    input: ["platform_id?", "stage?", "limit?", "offset?"]
    output: ToolModel[]
    side_effects: []

  - method: POST
    path: "/battery-ecosystem/tool-models/{id}/transition"
    description: "Advance/revert/discontinue the development stage; OCC via expected_tool_model_version; all stage edges per the ToolModel state machine"
    roles: [ProductEngineer]
    code: 200
    input: [to_stage, expected_tool_model_version]
    output: ToolModel
    side_effects: ["stage transition per state machine", "LAUNCHED->DISCONTINUED ends ACTIVE listings of this tool", "increments ToolModel.version by 1"]

  - method: GET
    path: "/battery-ecosystem/tool-models/{id}/insights"
    description: "List research insights for a tool (FK reverse-reach for ResearchInsight.tool_model_id)"
    roles: [PlatformAdmin, ProductEngineer, ComplianceEngineer, FieldResearcher, ServiceAgent, AccountManager, ChannelManager]
    code: 200
    input: ["limit?", "offset?"]
    output: ResearchInsight[]
    side_effects: []

  - method: POST
    path: "/battery-ecosystem/insights"
    description: "Submit a field research / jobsite observation insight"
    roles: [FieldResearcher]
    code: 201
    input: [tool_model_id, kind, summary, severity]
    output: ResearchInsight
    side_effects: ["status=SUBMITTED", "submitted_by_user_id := X-User-ID"]

  - method: POST
    path: "/battery-ecosystem/insights/{id}/decide"
    description: "Adopt or reject an insight; segregation of duties vs submitted_by_user_id"
    roles: [ProductEngineer]
    code: 200
    input: [decision]
    output: ResearchInsight
    side_effects: ["status=ADOPTED|REJECTED", "on ADOPTED: recompute the tool's adopted counts and bump ToolModel.version by 1", "increments ResearchInsight.version by 1"]

  # --- service network & One-Key accounts ---
  - method: POST
    path: "/battery-ecosystem/service-centers"
    description: "Create a repair center with capability list and daily booking capacity"
    roles: [PlatformAdmin]
    code: 201
    input: [code, region, capabilities, daily_capacity]
    output: ServiceCenter
    side_effects: []

  - method: POST
    path: "/battery-ecosystem/asset-accounts"
    description: "Provision a One-Key asset account; tier pins asset_limit"
    roles: [PlatformAdmin]
    code: 201
    input: [org_name, tier]
    output: AssetAccount
    side_effects: ["asset_limit computed from tier"]

  - method: POST
    path: "/battery-ecosystem/tracked-assets"
    description: "Register a tracked tool/battery unit into an account (One-Key pairing); first_paired_at stamped from the logical clock"
    roles: [AccountManager]
    code: 201
    input: [account_id, subject_type, "tool_model_id?", "battery_pack_id?", serial_number, manufactured_at]
    output: TrackedAsset
    side_effects: ["status=ACTIVE", "first_paired_at := logical clock", "recompute AssetAccount.active_asset_count", "rejects at ERR_ASSET_LIMIT_EXCEEDED when active_asset_count == asset_limit"]

  - method: GET
    path: "/battery-ecosystem/tracked-assets/{id}"
    description: "Get a tracked asset"
    roles: [PlatformAdmin, ProductEngineer, ComplianceEngineer, FieldResearcher, ServiceAgent, AccountManager, ChannelManager]
    code: 200
    input: []
    output: TrackedAsset
    side_effects: []

  - method: GET
    path: "/battery-ecosystem/tracked-assets"
    description: "List tracked assets (FK reverse-reach for TrackedAsset.account_id / tool_model_id / battery_pack_id)"
    roles: [PlatformAdmin, ProductEngineer, ComplianceEngineer, FieldResearcher, ServiceAgent, AccountManager, ChannelManager]
    code: 200
    input: ["account_id?", "tool_model_id?", "battery_pack_id?", "limit?", "offset?"]
    output: TrackedAsset[]
    side_effects: []

  - method: POST
    path: "/battery-ecosystem/tracked-assets/{id}/customize"
    description: "Owner customization of tool parameters (torque limit within the model's range) and anti-theft lock; OCC via expected_tracked_asset_version"
    roles: [AccountManager]
    code: 200
    input: ["custom_torque_limit_nm?", "anti_theft_lock_enabled?", expected_tracked_asset_version]
    output: TrackedAsset
    side_effects: ["increments TrackedAsset.version by 1"]

  - method: POST
    path: "/battery-ecosystem/tracked-assets/{id}/transition"
    description: "Report lost / recover / decommission an asset"
    roles: [AccountManager]
    code: 200
    input: [to_status]
    output: TrackedAsset
    side_effects: ["status transition per state machine", "on DECOMMISSIONED: recompute AssetAccount.active_asset_count", "increments TrackedAsset.version by 1"]

  # --- warranty ---
  - method: POST
    path: "/battery-ecosystem/warranty-claims"
    description: "File a warranty claim against an ACTIVE asset; the service center is auto-selected by capability + daily capacity"
    roles: [AccountManager]
    code: 201
    input: [tracked_asset_id, claim_type, fault_code, service_date]
    output: WarrantyClaim
    side_effects: ["adjudication_status=SUBMITTED, fulfillment_status=NONE", "service_center_id := service_center_selection result", "books one unit of (service_center_id, service_date) capacity"]

  - method: GET
    path: "/battery-ecosystem/warranty-claims/{id}"
    description: "Get a claim incl. computed age_days / coverage / credit_cents after adjudication"
    roles: [PlatformAdmin, ProductEngineer, ComplianceEngineer, FieldResearcher, ServiceAgent, AccountManager, ChannelManager]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: []

  - method: GET
    path: "/battery-ecosystem/warranty-claims"
    description: "List claims (FK reverse-reach for WarrantyClaim.tracked_asset_id / service_center_id)"
    roles: [PlatformAdmin, ProductEngineer, ComplianceEngineer, FieldResearcher, ServiceAgent, AccountManager, ChannelManager]
    code: 200
    input: ["tracked_asset_id?", "service_center_id?", "limit?", "offset?"]
    output: WarrantyClaim[]
    side_effects: []

  - method: POST
    path: "/battery-ecosystem/warranty-claims/{id}/adjudicate"
    description: "Approve (computes age/coverage/credit; opens fulfillment) or reject (cancels fulfillment, releases booking)"
    roles: [ServiceAgent]
    code: 200
    input: [decision]
    output: WarrantyClaim
    side_effects: ["adjudication_status=APPROVED|REJECTED", "on APPROVED: compute age_basis/age_days/coverage/credit_cents; fulfillment_status=AWAITING_UNIT", "on REJECTED: fulfillment_status=CANCELLED and release the capacity booking", "increments WarrantyClaim.version by 1"]

  - method: POST
    path: "/battery-ecosystem/warranty-claims/{id}/complete"
    description: "Complete fulfillment; BATTERY_REPLACEMENT claims auto-register a replacement TrackedAsset exempt from asset_limit"
    roles: [ServiceAgent]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: ["fulfillment_status=COMPLETED", "on BATTERY_REPLACEMENT: create replacement TrackedAsset (is_replacement_unit=true)", "release the capacity booking", "increments WarrantyClaim.version by 1"]

  # --- distribution ---
  - method: POST
    path: "/battery-ecosystem/channel-partners"
    description: "Onboard an industrial distributor or home center"
    roles: [PlatformAdmin]
    code: 201
    input: [name, channel_type, region]
    output: ChannelPartner
    side_effects: ["has_suspended_listings=false", "active_allocation_total=0"]

  - method: POST
    path: "/battery-ecosystem/listings"
    description: "Create a listing (PROPOSED); supersedes any non-ENDED listing of the same (channel_partner_id, product); OCC via expected_channel_partner_version"
    roles: [ChannelManager]
    code: 201
    input: [channel_partner_id, "tool_model_id?", "battery_pack_id?", "charger_id?", wholesale_price_cents, allocation_qty, expected_channel_partner_version]
    output: DistributionListing
    side_effects: ["status=PROPOSED", "prior non-ENDED listing for the same (channel_partner_id, product) -> ENDED with superseded_by_listing_id set", "increments ChannelPartner.version by 1"]

  - method: GET
    path: "/battery-ecosystem/listings/{id}"
    description: "Get a listing"
    roles: [PlatformAdmin, ProductEngineer, ComplianceEngineer, FieldResearcher, ServiceAgent, AccountManager, ChannelManager]
    code: 200
    input: []
    output: DistributionListing
    side_effects: []

  - method: GET
    path: "/battery-ecosystem/listings"
    description: "List listings (FK reverse-reach for DistributionListing channel_partner_id / tool_model_id / battery_pack_id / charger_id / superseded_by_listing_id)"
    roles: [PlatformAdmin, ProductEngineer, ComplianceEngineer, FieldResearcher, ServiceAgent, AccountManager, ChannelManager]
    code: 200
    input: ["channel_partner_id?", "tool_model_id?", "battery_pack_id?", "charger_id?", "superseded_by_listing_id?", "limit?", "offset?"]
    output: DistributionListing[]
    side_effects: []

  - method: POST
    path: "/battery-ecosystem/listings/{id}/transition"
    description: "Activate (certification + segmentation + allocation-cap gates), relist after suspension (acks the bulletin), or end a listing"
    roles: [ChannelManager]
    code: 200
    input: [to_status]
    output: DistributionListing
    side_effects: ["status transition per state machine", "recompute ChannelPartner.active_allocation_total / has_suspended_listings", "increments DistributionListing.version by 1"]

  # --- counterfeit & safety communication ---
  - method: POST
    path: "/battery-ecosystem/counterfeit-cases"
    description: "Report a suspected counterfeit battery unit"
    roles: [ChannelManager, AccountManager]
    code: 201
    input: [battery_pack_id, reported_serial, detection_method]
    output: CounterfeitCase
    side_effects: ["status=REPORTED", "created_by_user_id := X-User-ID"]

  - method: POST
    path: "/battery-ecosystem/counterfeit-cases/{id}/resolve"
    description: "Confirm (evidence threshold; sets pack safety_hold and cascades to listings/partners) or clear a case"
    roles: [ComplianceEngineer]
    code: 200
    input: [verdict, evidence_score]
    output: CounterfeitCase
    side_effects: ["status=CONFIRMED|CLEARED", "on CONFIRMED: pack.safety_hold=true -> pack's ACTIVE listings -> SUSPENDED (requires_relist_ack=true) -> partners' has_suspended_listings=true", "increments CounterfeitCase.version by 1"]

  - method: POST
    path: "/battery-ecosystem/safety-bulletins"
    description: "Issue a safety bulletin (created directly in ISSUED); half-open window overlap on the same platform rejected unless superseding; RECALL/URGENT severities cascade to packs/listings"
    roles: [ComplianceEngineer]
    code: 201
    input: [platform_id, "battery_pack_ids?", severity, title, effective_from, "effective_to?", "supersedes_bulletin_id?"]
    output: SafetyBulletin
    side_effects: ["status=ISSUED", "window overlap check (ERR_BULLETIN_WINDOW_OVERLAP)", "superseded bulletin -> SUPERSEDED", "RECALL: targeted CERTIFIED packs -> RECALLED, their ACTIVE listings -> ENDED", "URGENT: targeted packs' ACTIVE listings -> SUSPENDED with requires_relist_ack=true and partner flags recompute"]

  - method: GET
    path: "/battery-ecosystem/safety-bulletins/{id}"
    description: "Get a bulletin"
    roles: [PlatformAdmin, ProductEngineer, ComplianceEngineer, FieldResearcher, ServiceAgent, AccountManager, ChannelManager]
    code: 200
    input: []
    output: SafetyBulletin
    side_effects: []

  - method: GET
    path: "/battery-ecosystem/safety-bulletins"
    description: "List bulletins (FK reverse-reach for SafetyBulletin.platform_id / supersedes_bulletin_id)"
    roles: [PlatformAdmin, ProductEngineer, ComplianceEngineer, FieldResearcher, ServiceAgent, AccountManager, ChannelManager]
    code: 200
    input: ["platform_id?", "supersedes_bulletin_id?", "limit?", "offset?"]
    output: SafetyBulletin[]
    side_effects: []

  # --- platform logical clock (OUTSIDE api_prefix) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the platform logical clock (test-driving endpoint, outside the api_prefix). Server startup default is exactly 2026-09-01T00:00:00Z and never falls back to wall-clock time. Advancing the clock applies due BatteryPlatform sunset transitions (ACTIVE->SUNSETTING at sunset_announce_date, SUNSETTING->RETIRED at sunset_date)."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["applies due BatteryPlatform status transitions", "all timestamp-based calculations (warranty age, service_date validity, bulletin windows) read this clock"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role header missing or not a declared role, or X-User-ID missing" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted on this endpoint, or entity-backed ownership check failed (account/partner/center mismatch with X-User-ID)" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or body FK reference does not exist" }
  - { id: ERR_VALIDATION, http: 400, condition: "Request shape violation: missing required field, bad enum, bad range, conditional field rule violated (runtime_target_min, exactly-one product FK, subject-FK/type match, warranty_days multiple of 30, etc.)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Entity not in a valid from-state for the requested transition; terminal-state lockdown; asset not ACTIVE for claim/customize; tool not LAUNCHED for tool listing activation; pack RECALLED; claim fulfillment gate violated" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Same X-User-ID on both sides of a segregation boundary: cert submit vs decide, insight submit vs decide, counterfeit report vs resolve" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version OCC mismatch on POST /listings, POST /tracked-assets/{id}/customize, POST /tool-models/{id}/transition" }
  - { id: ERR_DUPLICATE_SKU, http: 409, condition: "Unique code collision: platform code, pack sku, charger model_code, tool model_code, center code" }
  - { id: ERR_DUPLICATE_SERIAL, http: 409, condition: "TrackedAsset serial_number already registered" }
  - { id: ERR_PLATFORM_RETIRED, http: 409, condition: "Platform is RETIRED: pack/tool creation, submit-certification, and tool launch are blocked" }
  - { id: ERR_PACK_GENERATION_VIOLATION, http: 409, condition: "pack_generation outside [1, platform.current_generation + 1] at pack creation" }
  - { id: ERR_FORWARD_COMMITMENT_EXCEEDED, http: 409, condition: "tool max_pack_generation > platform.current_generation + platform.forward_commitment_generations at tool creation" }
  - { id: ERR_BACKWARD_COMMITMENT_WINDOW_EXCEEDED, http: 409, condition: "Tool launch rejected: current logical date + platform.backward_commitment_years exceeds platform.sunset_date" }
  - { id: ERR_INCOMPATIBLE_PAIRING, http: 409, condition: "Charger and pack belong to different platforms (charge estimate)" }
  - { id: ERR_CLAIM_TYPE_MISMATCH, http: 409, condition: "claim_type does not match the asset's subject_type (TOOL_REPAIR vs TOOL, BATTERY_REPLACEMENT vs BATTERY)" }
  - { id: ERR_INSUFFICIENT_FIELD_RESEARCH, http: 409, condition: "Tool stage gate: fewer than 2 ADOPTED FIELD_RESEARCH insights (for PROTOTYPE) or no ADOPTED JOBSITE_OBSERVATION (for ENGINEERING_VALIDATION)" }
  - { id: ERR_CERTIFICATION_REQUIRED, http: 409, condition: "Tool launch with empty REGULATORY compatibility set, or listing activation for a pack that is not CERTIFIED" }
  - { id: ERR_RUNTIME_TARGET_UNMET, http: 409, condition: "Corded-conversion tool launch with best_runtime_min < runtime_target_min" }
  - { id: ERR_SAFETY_HOLD, http: 409, condition: "Listing activation/relist blocked by pack safety_hold (confirmed counterfeit or active safety cascade)" }
  - { id: ERR_SEGMENT_NOT_ALLOWED, http: 409, condition: "HOME_CENTER partner cannot activate TRADE_SPECIALIST tools or packs above 216 Wh rated capacity" }
  - { id: ERR_ALLOCATION_CAP_EXCEEDED, http: 409, condition: "Activation would push the partner's active_allocation_total above the channel cap (500 HOME_CENTER / 10000 INDUSTRIAL_DISTRIBUTOR)" }
  - { id: ERR_ASSET_LIMIT_EXCEEDED, http: 409, condition: "Account already holds asset_limit non-DECOMMISSIONED, non-replacement assets" }
  - { id: ERR_NO_SERVICE_CAPACITY, http: 409, condition: "No service center with the required capability has free capacity on service_date" }
  - { id: ERR_SERVICE_DATE_PAST, http: 422, condition: "Claim service_date is before the logical clock's current date" }
  - { id: ERR_WARRANTY_EXPIRED, http: 422, condition: "Adjudicate APPROVED on a claim whose coverage computes to OUT_OF_WARRANTY" }
  - { id: ERR_BULLETIN_WINDOW_OVERLAP, http: 409, condition: "New bulletin's half-open [effective_from, effective_to) window intersects an ISSUED bulletin on the same platform and no valid supersedes_bulletin_id was given" }
  - { id: ERR_EVIDENCE_INSUFFICIENT, http: 422, condition: "Counterfeit resolve verdict=CONFIRMED with evidence_score < 70" }
  - { id: ERR_PARTNER_HAS_SUSPENDED_LISTINGS, http: 409, condition: "Partner has SUSPENDED listings; new listing creation blocked until they are re-listed or ENDED" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Platform operator: platform catalog, service network, account provisioning, channel onboarding, logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /battery-ecosystem/battery-platforms"
      - "POST /battery-ecosystem/service-centers"
      - "POST /battery-ecosystem/asset-accounts"
      - "POST /battery-ecosystem/channel-partners"
      - "POST /_clock/set_current_utc"
    shared_operations: ["all GET endpoints"]

  - name: ProductEngineer
    description: "Tool/pack/charger development: pack and charger catalog, certification submission, tool stage transitions, insight adoption"
    identity: opaque
    exclusive_operations:
      - "POST /battery-ecosystem/battery-packs and submit-certification"
      - "POST /battery-ecosystem/chargers"
      - "POST /battery-ecosystem/tool-models and tool-models/{id}/transition"
      - "POST /battery-ecosystem/insights/{id}/decide"
    shared_operations: ["all GET endpoints"]

  - name: ComplianceEngineer
    description: "Safety certification authority: certification decisions, counterfeit resolution, safety bulletins"
    identity: opaque
    exclusive_operations:
      - "POST /battery-ecosystem/battery-packs/{id}/decide-certification"
      - "POST /battery-ecosystem/counterfeit-cases/{id}/resolve"
      - "POST /battery-ecosystem/safety-bulletins"
    shared_operations: ["all GET endpoints"]

  - name: FieldResearcher
    description: "Field research / jobsite observation submitter; may never decide own or others' insights"
    identity: opaque
    exclusive_operations:
      - "POST /battery-ecosystem/insights"
    shared_operations: ["all GET endpoints"]

  - name: ServiceAgent
    description: "Repair-center operator; X-User-ID equals the ServiceCenter id; adjudicates and completes that center's claims"
    identity: "entity_backed:ServiceCenter"
    exclusive_operations:
      - "POST /battery-ecosystem/warranty-claims/{id}/adjudicate"
      - "POST /battery-ecosystem/warranty-claims/{id}/complete"
    shared_operations: ["all GET endpoints"]

  - name: AccountManager
    description: "One-Key account operator; X-User-ID equals the AssetAccount id; registers/customizes/transitions the account's assets and files its warranty claims"
    identity: "entity_backed:AssetAccount"
    exclusive_operations:
      - "POST /battery-ecosystem/tracked-assets and tracked-assets/{id}/customize, /transition"
      - "POST /battery-ecosystem/warranty-claims"
    shared_operations: ["all GET endpoints", "POST /battery-ecosystem/counterfeit-cases"]

  - name: ChannelManager
    description: "Channel partner operator; X-User-ID equals the ChannelPartner id; manages the partner's listings and reports counterfeit units"
    identity: "entity_backed:ChannelPartner"
    exclusive_operations:
      - "POST /battery-ecosystem/listings and listings/{id}/transition"
    shared_operations: ["all GET endpoints", "POST /battery-ecosystem/counterfeit-cases"]
