              as: Registrar
              captures: { p_id: $.data.id }
            - call: "POST /patient-access/appointments"
              payload: { patient_id: "${p_id}", department_code: "ORTHO", procedure_code: "99213", scheduled_start: "2026-09-16T09:00:00Z", duration_minutes: 30, visit_type: "ESTABLISHED", provider_code: "DRVD" }
              as: Registrar
              captures: { a_id: $.data.id }
            - call: "POST /patient-access/appointments/${a_id}/payments"
              payload: { amount_cents: 100, method: "CASH", kind: "POST" }
              as: FinancialCounselor
              captures: { pay_id: $.data.id }
          trigger:
            - call: "POST /patient-access/payments/${pay_id}/void"
              payload: {}
              as: FinancialCounselor
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_FORBIDDEN"

  # ===========================================================================
  # Section: endpoints (patterns)
  # ===========================================================================
  - section: endpoints
    instances:
      - name: close_day_marks_no_shows_and_removes_tickets
        claim_type: ops_run_sweep
        grounds:
          - endpoints["POST /patient-access/departments/{department_code}/close-day"]
          - state_machines.Appointment.SCHEDULED_to_NO_SHOW
        distinguishing_aspect: "close-day sweeps the department: appointments past grace in {SCHEDULED, PRE_CHECKED, READY} flip NO_SHOW and the summary reports no_show_count."
        test_recipe:
          setup: ["one SCHEDULED appointment at 09:00 and clock at 10:00 (grace 30 exceeded)"]
          setup_api_calls:
            - call: "POST /patient-access/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T08:00:00Z" }
              as: AccessSupervisor
            - call: "POST /patient-access/patients"
              payload: { first_name: "No", last_name: "Show", date_of_birth: "1993-04-04", sex_at_birth: "F", primary_phone: "+15551600001" }
              as: Registrar
              captures: { p_id: $.data.id }
            - call: "POST /patient-access/appointments"
              payload: { patient_id: "${p_id}", department_code: "PULM", procedure_code: "99213", scheduled_start: "2026-08-10T09:00:00Z", duration_minutes: 30, visit_type: "ESTABLISHED", provider_code: "DRNS" }
              as: Registrar
              captures: { a_id: $.data.id }
            - call: "POST /patient-access/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T10:00:00Z" }
              as: AccessSupervisor
          trigger:
            - call: "POST /patient-access/departments/PULM/close-day"
              payload: { queue_date: "2026-08-10" }
              as: AccessSupervisor
              captures: { ns: $.data.no_show_count }
            - call: "GET /patient-access/appointments/${a_id}"
              as: Registrar
              captures: { st: $.data.status }
          assert:
            - "ns == 1"
            - "st == NO_SHOW"

      - name: merge_repoints_appointments_to_survivor
        claim_type: cross_reference
        grounds:
          - state_machines.Patient.PRE_REGISTERED_to_MERGED
          - entities.Patient.fields.duplicate_of_patient_id
        distinguishing_aspect: "Merging a duplicate into the survivor re-points its SCHEDULED appointments and policies; the merged record carries duplicate_of_patient_id and status MERGED."
        test_recipe:
          setup: ["two patients P1 (survivor, REGISTERED) and P2 (duplicate, PRE_REGISTERED with an appointment and a policy)"]
          setup_api_calls:
            - call: "POST /patient-access/patients"
              payload: { first_name: "Sur", last_name: "Vivor", date_of_birth: "1980-08-08", sex_at_birth: "M", primary_phone: "+15551600002" }
              as: Registrar
              captures: { p1: $.data.id, p1v: $.data.version }
            - call: "POST /patient-access/patients/${p1}/complete-registration"
              payload: { consent_general: true }
              as: Registrar
            - call: "POST /patient-access/patients"
              payload: { first_name: "Sur", last_name: "Vivor", date_of_birth: "1980-08-08", sex_at_birth: "M", primary_phone: "+15551600003" }
              as: Registrar
              captures: { p2: $.data.id, p2v: $.data.version }
            - call: "POST /patient-access/insurance-policies"
              payload: { patient_id: "${p2}", payer_id: "PAYER1", member_id: "MMG", plan_type: "PPO", effective_start: "2026-01-01", priority_rank: 1, deductible_remaining_cents: 0, oop_max_remaining_cents: 500000 }
              as: Registrar
            - call: "POST /patient-access/appointments"
              payload: { patient_id: "${p2}", department_code: "ORTHO", procedure_code: "99213", scheduled_start: "2026-09-20T09:00:00Z", duration_minutes: 30, visit_type: "ESTABLISHED", provider_code: "DRMG" }
              as: Registrar
              captures: { a_id: $.data.id }
          trigger:
            - call: "POST /patient-access/patients/${p2}/merge"
              payload: { survivor_patient_id: "${p1}", expected_patient_version: "${p2v}" }
              as: Registrar
              captures: { st: $.data.status, dup: $.data.duplicate_of_patient_id }
            - call: "GET /patient-access/appointments/${a_id}"
              as: Registrar
              captures: { appt_patient: $.data.patient_id }
            - call: "GET /patient-access/patients/${p1}/insurance-policies"
              as: Registrar
              captures: { pol_count: $.data }
          assert:
            - "st == MERGED"
            - "dup == ${p1}"
            - "appt_patient == ${p1}"
            - "survivor policy list contains 1 policy"

  # ===========================================================================
  # Section: cross_cutting_layers
  # ===========================================================================
  - section: cross_cutting_layers
    instances:
      - name: occ_patch_appointment_stale_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[appointment-update-stale-version]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "PATCH with expected_appointment_version equal to the pre-cascade version returns ERR_STALE_VERSION / 412 after another write advanced the appointment's version; the current version succeeds."
        test_recipe:
          setup: ["appointment created (version captured); a subsequent PATCH bumps the version"]
          setup_api_calls:
            - call: "POST /patient-access/patients"
              payload: { first_name: "Occ", last_name: "One", date_of_birth: "1987-07-07", sex_at_birth: "M", primary_phone: "+15551700001" }
              as: Registrar
              captures: { p_id: $.data.id }
            - call: "POST /patient-access/appointments"
              payload: { patient_id: "${p_id}", department_code: "ORTHO", procedure_code: "99213", scheduled_start: "2026-09-25T09:00:00Z", duration_minutes: 30, visit_type: "ESTABLISHED", provider_code: "DROC" }
              as: Registrar
              captures: { a_id: $.data.id, v1: $.data.version }
            - call: "PATCH /patient-access/appointments/${a_id}"
              payload: { expected_appointment_version: "${v1}", duration_minutes: 45 }
              as: Registrar
              captures: { v2: $.data.version }
          trigger:
            - call: "PATCH /patient-access/appointments/${a_id}"
              payload: { expected_appointment_version: "${v2} - 1", duration_minutes: 60 }
              as: Registrar
              captures: { err: $.data.error_id }
            - call: "PATCH /patient-access/appointments/${a_id}"
              payload: { expected_appointment_version: "${v2}", duration_minutes: 60 }
              as: Registrar
              captures: { ok_dur: $.data.duration_minutes }
          assert:
            - "err == ERR_STALE_VERSION"
            - "ok_dur == 60"

      - name: occ_merge_stale_patient_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[patient-merge-stale-version]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "POST /patients/{id}/merge with an expected_patient_version stale by one (captured before a complete-registration bump) returns ERR_STALE_VERSION / 412."
        test_recipe:
          setup: ["survivor P1; duplicate P2 whose version was captured, then bumped by complete-registration"]
          setup_api_calls:
            - call: "POST /patient-access/patients"
              payload: { first_name: "Mrg", last_name: "Sur", date_of_birth: "1988-08-08", sex_at_birth: "F", primary_phone: "+15551700002" }
              as: Registrar
              captures: { p1: $.data.id }
            - call: "POST /patient-access/patients/${p1}/complete-registration"
              payload: { consent_general: true }
              as: Registrar
            - call: "POST /patient-access/patients"
              payload: { first_name: "Mrg", last_name: "Dup", date_of_birth: "1989-09-09", sex_at_birth: "F", primary_phone: "+15551700003" }
              as: Registrar
              captures: { p2: $.data.id, p2v: $.data.version }
            - call: "POST /patient-access/patients/${p2}/complete-registration"
              payload: { consent_general: true }
              as: Registrar
          trigger:
            - call: "POST /patient-access/patients/${p2}/merge"
              payload: { survivor_patient_id: "${p1}", expected_patient_version: "${p2v}" }
              as: Registrar
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_STALE_VERSION"

  # ===========================================================================
  # Section: consistency_model
  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_consistency_collected_amount_in_same_response
        claim_type: immediate_consistency
        grounds:
          - complexity_profile.consistency_model
          - calculations.collected_amount
        distinguishing_aspect: "POST payment response is immediately followed by a GET showing the updated amount_collected_cents — no lag, same logical clock."
        test_recipe:
          setup: ["appointment exists"]
          setup_api_calls:
            - call: "POST /patient-access/patients"
              payload: { first_name: "Imm", last_name: "Ediate", date_of_birth: "1990-10-10", sex_at_birth: "M", primary_phone: "+15551800001" }
              as: Registrar
              captures: { p_id: $.data.id }
            - call: "POST /patient-access/appointments"
              payload: { patient_id: "${p_id}", department_code: "ORTHO", procedure_code: "99213", scheduled_start: "2026-09-30T09:00:00Z", duration_minutes: 30, visit_type: "ESTABLISHED", provider_code: "DRIM" }
              as: Registrar
              captures: { a_id: $.data.id }
          trigger:
            - call: "POST /patient-access/appointments/${a_id}/payments"
              payload: { amount_cents: 2500, method: "CARD", kind: "POST" }
              as: FinancialCounselor
            - call: "GET /patient-access/appointments/${a_id}"
              as: FinancialCounselor
              captures: { coll: $.data.amount_collected_cents }
          assert:
            - "coll == 2500"
