    side_effects: ["PickupRoute.version += 1"]
  - method: POST
    path: "/api/pickup-routes/{route_id}/cancel"
    description: "DRAFT|PUBLISHED -> CANCELLED; cascades SCHEDULED stops to CANCELLED"
