      - name: a_partner_response_pending_alert_returns_to_open_at_the_close_that_finds_its_sla_breached
        claim_type: Cyclic
        grounds:
          - state_machines.TransactionMonitoringAlert.transitions.OPEN_to_PARTNER_RESPONSE_PENDING
          - state_machines.TransactionMonitoringAlert.transitions.PARTNER_RESPONSE_PENDING_to_OPEN
          - calculations.alert_sla_due_at
        distinguishing_aspect: "PARTNER_RESPONSE_PENDING -> OPEN is reachable only through an ops-run checkpoint, and the reopen increments sla_breach_count while leaving the alert inside the 'open set' — so a SANCTIONS_HIT alert parked in PARTNER_RESPONSE_PENDING never lets open_sanctions_alert_count drop and the FROZEN predicate stays satisfied across the whole lap."
        test_recipe:
          setup:
            - "Cycle 2026-08 covers [2026-08-01, 2026-09-01). A STRUCTURING alert triggered 2026-08-01T00:00:00Z is due 2026-08-04T00:00:00Z (72 wall-clock hours) and is parked in PARTNER_RESPONSE_PENDING. Clock advanced to 2026-09-01T00:00:00Z."
          setup_api_calls:
            - *q_clock
            - *q_cycle_aug
            - *q_partner_a
            - *q_dr_a
            - *q_dr_a_submit
            - *q_dr_a_pass
            - *q_pa_read_passed
