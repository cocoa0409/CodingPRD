# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3141_imaging_facility_accreditation_phantom_testing_physicist_survey
#
# Breadth probe over the nine claim-extraction-guide sections. Corners already
# exercised by SCAFFOLD_DIFFICULTY_DESIGN.yaml appear as `excluded_because:`
# stubs carrying no test_recipe.
# =============================================================================
scaffold_corner_design:
- section: entities
  section_name: Entity surface
  instances:
  - name: facility_creation_returns_only_declared_input_and_defaults
    claim_type: Creation
    grounds:
    - entities.Facility
    - endpoints.POST_/accreditation/facilities
    - entities.Facility.fields.facility_status
    - entities.Facility.fields.registry_credit_cents
    distinguishing_aspect: A facility created with only name, state_code and facility_type comes back 201 with facility_status PENDING, accreditation_currency PROVISIONAL, payer_participation_status AT_RISK, registry_credit_cents 0, enrolled_unit_count 0 and version 1 — none of the derived counters are client-supplied.
    test_recipe:
      setup:
      - Logical clock at its default 2026-09-01T00:00:00Z. Empty database.
      setup_api_calls:
      - call: POST /accreditation/facilities
        payload:
          name: Lakeside MRI
          state_code: MN
          facility_type: HOSPITAL
        as: FacilityAdmin
        captures:
          f2_id: $.data.id
      trigger:
      - call: GET /accreditation/facilities/${f2_id}
        payload: {}
        as: Any
      assert:
      - the create response is 201 and response_type object
      - Facility.${f2_id}.name == "Lakeside MRI" and state_code == "MN" and facility_type == HOSPITAL
      - Facility.${f2_id}.facility_status == PENDING
      - Facility.${f2_id}.accreditation_currency == PROVISIONAL
      - Facility.${f2_id}.payer_participation_status == AT_RISK
      - Facility.${f2_id}.registry_credit_cents == 0 and enrolled_unit_count == 0 and deferred_unit_count == 0 and rejected_survey_count == 0 and roster_disposition == CLEAR
      - Facility.${f2_id}.version == 1 and created_at and updated_at are non-null ISO 8601 UTC with three fractional digits
  - name: equipment_create_ignores_system_equipment_status_and_verdict
    claim_type: System Fields
    grounds:
    - entities.EquipmentItem.fields.equipment_status
    - entities.EquipmentItem.fields.performance_verdict
    - endpoints.POST_/accreditation/equipment
    distinguishing_aspect: 'EquipmentItem.equipment_status and performance_verdict are source: system; a client that posts equipment_status RETIRED and performance_verdict FAIL is ignored and the row is created ACTIVE with verdict PENDING at version 1.'
    test_recipe:
      setup:
      - Logical clock 2026-09-05T00:00:00Z.
      - Facility Northgate Imaging Center (CT) is ENROLLED with accreditation_currency PROVISIONAL, payer_participation_status ACTIVE and registry_credit_cents 500000.
      - ModalityUnit CT-1 (CT) is ENROLLED with EquipmentItem SN-CT-0001 ACTIVE.
      - PersonnelQualification TECH-1001 (TECHNOLOGIST) and PHYS-2001 (MEDICAL_PHYSICIST) are VERIFIED.
      - 'AccreditationCycle #1 is ACTIVE.'
      setup_api_calls:
      - call: POST /accreditation/facilities
        payload:
          name: Northgate Imaging Center
          state_code: CT
          facility_type: IMAGING_CENTER
        as: FacilityAdmin
        captures:
          fac_id: $.data.id
      - call: POST /accreditation/qualifications
        payload:
          facility_id: ${fac_id}
          person_name: Hana Reyes
          personnel_role: TECHNOLOGIST
          credential_number: TECH-1001
          ce_credit_hours: 24.0
          required_ce_hours: 24.0
          credential_expires_on: '2027-06-30T00:00:00Z'
        as: AccreditationBody
        captures:
          tq_id: $.data.id
      - call: POST /accreditation/qualifications/${tq_id}/verify
        payload:
          verified_at: '2026-09-02T00:00:00Z'
        as: AccreditationBody
      - call: GET /accreditation/facilities/${fac_id}
        payload: {}
        as: Any
        captures:
          fv: $.data.version
      - call: POST /accreditation/modality-units
        payload:
          facility_id: ${fac_id}
          modality_code: CT
          unit_label: CT-1
          expected_facility_version: ${fv}
        as: FacilityAdmin
        captures:
          unit_id: $.data.id
      - call: POST /accreditation/equipment
        payload:
          unit_id: ${unit_id}
          manufacturer: Siemens
          model_number: SOMATOM-X1
          serial_number: SN-CT-0001
          modality_code: CT
          installed_on: '2026-08-01T00:00:00Z'
        as: FacilityAdmin
        captures:
          eq_id: $.data.id
      - call: GET /accreditation/facilities/${fac_id}
        payload: {}
        as: Any
        captures:
          fv: $.data.version
      - call: POST /accreditation/facilities/${fac_id}/register
        payload:
          expected_facility_version: ${fv}
        as: FacilityAdmin
      - call: POST /accreditation/cycles
        payload:
          facility_id: ${fac_id}
          cycle_index: 1
          cycle_started_at: '2026-09-01T00:00:00Z'
        as: AccreditationBody
        captures:
          cyc_id: $.data.id
      - call: POST /accreditation/cycles/${cyc_id}/activate
        payload: {}
        as: AccreditationBody
      - call: POST /accreditation/qualifications
        payload:
          facility_id: ${fac_id}
          person_name: Ira Sundaram
          personnel_role: MEDICAL_PHYSICIST
          credential_number: PHYS-2001
          ce_credit_hours: 50.0
          required_ce_hours: 50.0
          credential_expires_on: '2028-06-30T00:00:00Z'
        as: AccreditationBody
        captures:
          pq_id: $.data.id
      - call: POST /accreditation/qualifications/${pq_id}/verify
        payload:
          verified_at: '2026-09-02T00:00:00Z'
        as: AccreditationBody
      - call: GET /accreditation/facilities/${fac_id}
        payload: {}
        as: Any
        captures:
          fv: $.data.version
      - call: POST /accreditation/facilities/${fac_id}/registry-credit
        payload:
          amount_cents: 500000
          expected_facility_version: ${fv}
        as: FacilityAdmin
      - call: GET /accreditation/modality-units/${unit_id}
        payload: {}
        as: Any
        captures:
          uv: $.data.version
      - call: POST /accreditation/physicist-surveys
        payload:
          facility_id: ${fac_id}
          physicist_qualification_id: ${pq_id}
          survey_type: ANNUAL
          scheduled_at: '2026-09-03T00:00:00Z'
          reference_entrance_dose_mgy: 2.0
          unit_id: ${unit_id}
        as: MedicalPhysicist
        as_user_id: ${pq_id}
        captures:
          svy_id: $.data.id
      - call: POST /accreditation/physicist-surveys/${svy_id}/submit
        payload:
          performed_at: '2026-09-10T00:00:00Z'
          measured_entrance_dose_mgy: 2.15
          shielding_verdict: PASS
        as: MedicalPhysicist
        as_user_id: ${pq_id}
      - call: GET /accreditation/facilities/${fac_id}
        payload: {}
        as: Any
        captures:
          fv: $.data.version
      - call: POST /accreditation/physicist-surveys/${svy_id}/accept
        payload: {}
        as: AccreditationBody
      - call: GET /accreditation/modality-units/${unit_id}
        payload: {}
        as: Any
        captures:
          uv: $.data.version
      trigger:
      - call: POST /accreditation/equipment
        payload:
          unit_id: ${unit_id}
          manufacturer: GE
          model_number: REV-A
          serial_number: SN-CT-0002
          modality_code: CT
          installed_on: '2026-08-02T00:00:00Z'
          equipment_status: RETIRED
          performance_verdict: FAIL
        as: FacilityAdmin
        captures:
          esub_id: $.data.id
      assert:
      - EquipmentItem.${esub_id}.equipment_status == ACTIVE — the supplied RETIRED is ignored
      - EquipmentItem.${esub_id}.performance_verdict == PENDING — the supplied FAIL is ignored
      - EquipmentItem.${esub_id}.version == 1
      - EquipmentItem.${esub_id}.modality_code == CT and serial_number == "SN-CT-0002"
      - MODALITYUNIT.${unit_id} version advanced to ${uv} + 1
