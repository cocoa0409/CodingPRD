# =============================================================================
# PRD Benchmark Scaffold — Dairy Herd Management (DHIA)
# Tier: Expert (§0.4)
# =============================================================================

scenario: |
  Dairy Herd Management (DHIA): animal & lactation record, milk weight & components
  (fat/protein/SCC), parlor/milking shift, breeding/AI & calving, ration & feed cost,
  milk check & co-op (FMMO pricing), health/treatment & withhold, culling/replacement.

domain_name: dairy-herd-management
api_prefix: /herds

# =============================================================================
# Complexity Profile (§0.3)
# =============================================================================
complexity_profile:
  primary_archetype: ledger_reconciliation        # provisional milk advance vs final FMMO settlement
  secondary_archetype: compliance_audit            # treatment withhold gates milk eligibility / slaughter
  complexity_layers:
    - dual_variant_calculation                     # 305-day projected vs actual-to-date; advance vs final check
    - cascading_side_effects                        # calving -> close prior lactation -> open new lactation -> animal status -> herd count
    - derived_field_reconciliation                  # lactation cumulative/projected recomputed on each test-day add
    - optimistic_concurrency                        # MilkCheck finalize/cancel guarded by OCC on MilkCheck.version
    - scheduled_actions                             # logical clock; withhold + pregnancy-check windows expire at future timestamps

  entity_topology: flat                             # peer collections under /herds with FK references in the body
  state_machine_shape: cyclic                       # Lactation per-parity loop; BreedingEvent BRED->OPEN retry
  relationship_patterns:
    - one_to_many
    - self_referential                              # Animal.dam_id -> Animal.id (genealogy); CullDecision.replacement_animal_id -> Animal.id
    - cross_aggregate                               # MilkCheck pools TestDayRecords across many animals under a herd
  role_model: peer_roles                            # HerdManager / ParlorTech / Veterinarian / CoopSettlementAgent / Auditor
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Herd
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Dairy operation name" }
      - { name: federal_order_number, type: string, source: input, description: "FMMO marketing order number this herd ships under (e.g. '30')" }
      - { name: milk_quality_status, type: enum, source: computed, default: GOOD, description: "GOOD | WARNING | PENALIZED — derived from latest finalized MilkCheck weighted SCC (calc herd_milk_quality_status)", constraints: "GOOD | WARNING | PENALIZED" }
      - { name: active_animal_count, type: integer, source: computed, default: 0, description: "Count of this herd's Animals whose status is in {ACTIVE, DRY}" }

  - name: Parlor
    parent: Herd
    common_fields: true
    fields:
      - { name: herd_id, type: string, source: input, description: "FK -> Herd.id" }
      - { name: name, type: string, source: input, description: "Parlor identifier (e.g. 'North Double-12')" }
      - { name: stall_capacity, type: integer, source: input, description: "Cows milkable per pass", constraints: ">= 1" }
      - { name: turnaround_minutes, type: integer, source: input, default: 0, description: "Mandatory wash/cleanup buffer after a shift before the next shift on this parlor may begin", constraints: ">= 0" }

  - name: Ration
    parent: Herd
    common_fields: true
    fields:
      - { name: herd_id, type: string, source: input, description: "FK -> Herd.id" }
      - { name: name, type: string, source: input, description: "Ration name (e.g. 'High Group TMR')" }
      - { name: ingredients, type: array, source: input, description: "Array of { ingredient_name: string, lbs_as_fed: number, price_per_lb: number }; each lbs_as_fed and price_per_lb must be >= 0" }
      - { name: daily_feed_cost_per_cow, type: number, source: computed, description: "= sum over ingredients of round2(lbs_as_fed * price_per_lb); per-line rounding then sum (calc daily_feed_cost)" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | RETIRED", constraints: "ACTIVE | RETIRED" }

  - name: CoopPriceSheet
    parent: Herd
    common_fields: true
    fields:
      - { name: herd_id, type: string, source: input, description: "FK -> Herd.id" }
      - { name: settlement_month, type: string, source: input, description: "YYYY-MM the announced FMMO prices apply to; unique per herd", constraints: "unique within herd" }
      - { name: fat_price_per_lb, type: number, source: input, description: "Announced butterfat price $/lb (up to 3 decimals)" }
      - { name: protein_price_per_lb, type: number, source: input, description: "Announced true-protein price $/lb (up to 3 decimals)" }
      - { name: other_solids_price_per_lb, type: number, source: input, description: "Announced other-solids price $/lb (up to 3 decimals)" }
      - { name: ppd_per_cwt, type: number, source: input, description: "Producer Price Differential $/cwt (up to 3 decimals)" }
      - { name: advance_rate_per_cwt, type: number, source: input, description: "Provisional advance rate $/cwt paid before final settlement" }
      - { name: hauling_rate_per_cwt, type: number, source: input, default: 0, description: "Hauling/marketing deduction $/cwt" }

  - name: Animal
    parent: Herd
    common_fields: true
    fields:
      - { name: herd_id, type: string, source: input, description: "FK -> Herd.id" }
      - { name: ear_tag, type: string, source: input, description: "Herd-unique visual/RFID tag", constraints: "unique within herd" }
      - { name: birth_date, type: datetime, source: input, description: "ISO 8601 date of birth" }
      - { name: dam_id, type: string, source: input, required: false, description: "FK -> Animal.id; genetic dam within the same herd (self-referential), optional" }
      - { name: parity, type: integer, source: computed, default: 0, description: "Number of completed calvings; 0 = heifer that has not yet calved" }
      - { name: status, type: enum, source: system, default: HEIFER, description: "HEIFER -> ACTIVE <-> DRY ; terminal SOLD | CULLED | DIED", constraints: "HEIFER | ACTIVE | DRY | SOLD | CULLED | DIED" }
      - { name: milk_eligible, type: boolean, source: computed, default: true, description: "False while any ACTIVE HealthTreatment on this animal has milk_withhold_until > current clock; gates inclusion of the animal's test-day milk in a MilkCheck pool" }

  - name: Lactation
    parent: Animal
    common_fields: true
    fields:
      - { name: animal_id, type: string, source: input, description: "FK -> Animal.id" }
      - { name: herd_id, type: string, source: input, description: "FK -> Herd.id" }
      - { name: parity, type: integer, source: system, description: "animal.parity at the calving that opened this lactation" }
      - { name: calving_event_id, type: string, source: system, description: "FK -> CalvingEvent.id; the calving that opened this lactation" }
      - { name: start_date, type: datetime, source: system, description: "Calving date; day-in-milk 0" }
      - { name: dry_off_date, type: datetime, source: system, required: false, description: "Date the lactation was dried off; null while OPEN" }
      - { name: cumulative_milk_lbs, type: number, source: computed, default: 0, description: "Test-Interval-Method actual milk lbs to the latest test (calc lactation_cumulative_milk)" }
      - { name: projected_305d_milk_lbs, type: number, source: computed, default: 0, description: "Projected 305-day milk lbs (calc lactation_projected_305d); 0 until first test-day" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN -> DRY -> CLOSED ; OPEN -> CLOSED on direct cull", constraints: "OPEN | DRY | CLOSED" }

  - name: TestDayRecord
    parent: Lactation
    common_fields: false
    fields:
      - { name: lactation_id, type: string, source: input, description: "FK -> Lactation.id" }
      - { name: animal_id, type: string, source: system, description: "FK -> Animal.id" }
      - { name: herd_id, type: string, source: system, description: "FK -> Herd.id" }
      - { name: test_date, type: datetime, source: input, description: "ISO 8601 date the test sample was taken" }
      - { name: day_in_milk, type: integer, source: computed, description: "= floor(days between lactation.start_date and test_date); must be strictly greater than the prior test's day_in_milk on this lactation", constraints: ">= 1" }
      - { name: milk_weight_lbs, type: number, source: input, description: "Pounds of milk on the test day", constraints: ">= 0" }
      - { name: fat_pct, type: number, source: input, description: "Butterfat percent", constraints: ">= 0 and <= 15" }
      - { name: protein_pct, type: number, source: input, description: "True protein percent", constraints: ">= 0 and <= 10" }
      - { name: scc_thousands, type: integer, source: input, description: "Somatic cell count in thousands/mL", constraints: ">= 0" }
      - { name: included_in_milk_check_id, type: string, source: system, required: false, description: "FK -> MilkCheck.id; set when this record is pooled into a finalized milk check, else null" }

  - name: MilkingShift
    parent: Parlor
    common_fields: true
    fields:
      - { name: parlor_id, type: string, source: input, description: "FK -> Parlor.id" }
      - { name: herd_id, type: string, source: system, description: "FK -> Herd.id" }
      - { name: operator_user_id, type: string, source: system, description: "X-User-ID of the ParlorTech/HerdManager who logged the shift (opaque operator id)" }
      - { name: start_at, type: datetime, source: input, description: "Shift start (inclusive)" }
      - { name: end_at, type: datetime, source: input, description: "Shift end (exclusive); must be strictly after start_at" }
      - { name: cows_milked, type: integer, source: input, description: "Head milked this shift", constraints: ">= 0" }
      - { name: status, type: enum, source: system, default: LOGGED, description: "LOGGED -> VOIDED", constraints: "LOGGED | VOIDED" }

  - name: BreedingEvent
    parent: Animal
    common_fields: true
    fields:
      - { name: animal_id, type: string, source: input, description: "FK -> Animal.id" }
      - { name: herd_id, type: string, source: system, description: "FK -> Herd.id" }
      - { name: service_date, type: datetime, source: input, description: "AI insemination date" }
      - { name: sire_code, type: string, source: input, description: "Semen/sire identifier" }
      - { name: confirm_due_at, type: datetime, source: computed, description: "= service_date + PREG_CHECK_WINDOW_DAYS (PREG_CHECK_WINDOW_DAYS = 45); pregnancy must be confirmed at or before this instant" }
      - { name: status, type: enum, source: system, default: BRED, description: "BRED -> CONFIRMED_PREGNANT -> SERVED_OUT ; BRED -> OPEN (failed, retry)", constraints: "BRED | CONFIRMED_PREGNANT | OPEN | SERVED_OUT" }

  - name: CalvingEvent
    parent: Animal
    common_fields: true
    fields:
      - { name: animal_id, type: string, source: input, description: "FK -> Animal.id" }
      - { name: herd_id, type: string, source: system, description: "FK -> Herd.id" }
      - { name: breeding_event_id, type: string, source: input, description: "FK -> BreedingEvent.id; the confirmed-pregnant service that produced this calving" }
      - { name: calving_date, type: datetime, source: input, description: "Date the cow calved" }
      - { name: opened_lactation_id, type: string, source: computed, description: "FK -> Lactation.id; the new lactation opened by this calving" }
      - { name: closed_lactation_id, type: string, source: computed, required: false, description: "FK -> Lactation.id; the prior lactation closed by this calving, if any" }

  - name: HealthTreatment
    parent: Animal
    common_fields: true
    fields:
      - { name: animal_id, type: string, source: input, description: "FK -> Animal.id" }
      - { name: herd_id, type: string, source: system, description: "FK -> Herd.id" }
      - { name: drug_name, type: string, source: input, description: "Administered product" }
      - { name: administered_at, type: datetime, source: input, description: "Instant the treatment was given" }
      - { name: milk_withhold_hours, type: integer, source: input, description: "Hours milk must be discarded after administration", constraints: ">= 0" }
      - { name: meat_withdrawal_hours, type: integer, source: input, description: "Hours before the animal may be sold for slaughter", constraints: ">= 0" }
      - { name: milk_withhold_until, type: datetime, source: computed, description: "= administered_at + milk_withhold_hours" }
      - { name: meat_withdrawal_until, type: datetime, source: computed, description: "= administered_at + meat_withdrawal_hours" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE -> CLEARED (both windows elapsed) ; ACTIVE -> VOIDED (entered in error)", constraints: "ACTIVE | CLEARED | VOIDED" }

  - name: MilkCheck
    parent: Herd
    common_fields: true
    fields:
      - { name: herd_id, type: string, source: input, description: "FK -> Herd.id" }
      - { name: price_sheet_id, type: string, source: input, description: "FK -> CoopPriceSheet.id; the announced FMMO prices used" }
      - { name: settlement_month, type: string, source: system, description: "Copied from the price sheet at creation" }
      - { name: pooled_milk_lbs, type: number, source: computed, default: 0, description: "Sum of eligible test-day milk_weight_lbs pooled into this check" }
      - { name: pooled_fat_lbs, type: number, source: computed, default: 0, description: "Sum over pooled test days of round2(milk_weight_lbs * fat_pct/100)" }
      - { name: pooled_protein_lbs, type: number, source: computed, default: 0, description: "Sum over pooled test days of round2(milk_weight_lbs * protein_pct/100)" }
      - { name: pooled_other_solids_lbs, type: number, source: computed, default: 0, description: "Sum over pooled test days of round2(milk_weight_lbs * OTHER_SOLIDS_PCT/100)" }
      - { name: weighted_scc_thousands, type: number, source: computed, default: 0, description: "Milk-weighted SCC = round2(sum(scc_thousands*milk_weight_lbs)/sum(milk_weight_lbs))" }
      - { name: advance_paid, type: number, source: computed, default: 0, description: "Provisional advance = round2(advance_rate_per_cwt * pooled_milk_lbs/100); set at PROVISIONAL" }
      - { name: gross_settlement, type: number, source: computed, default: 0, description: "Final FMMO component value (calc milk_check_settlement); 0 until FINALIZED" }
      - { name: net_payable, type: number, source: computed, default: 0, description: "= gross_settlement - advance_paid - hauling_deduction; 0 until FINALIZED" }
      - { name: status, type: enum, source: system, default: PROVISIONAL, description: "PROVISIONAL -> FINALIZED ; PROVISIONAL -> CANCELLED", constraints: "PROVISIONAL | FINALIZED | CANCELLED" }

  - name: CullDecision
    parent: Animal
    common_fields: true
    fields:
      - { name: animal_id, type: string, source: input, description: "FK -> Animal.id" }
      - { name: herd_id, type: string, source: system, description: "FK -> Herd.id" }
      - { name: reason, type: enum, source: input, description: "LOW_PRODUCTION | REPRO_FAILURE | HIGH_SCC | INJURY | AGE", constraints: "LOW_PRODUCTION | REPRO_FAILURE | HIGH_SCC | INJURY | AGE" }
      - { name: disposition, type: enum, source: input, description: "SLAUGHTER | DAIRY_SALE | DIED", constraints: "SLAUGHTER | DAIRY_SALE | DIED" }
      - { name: replacement_animal_id, type: string, source: input, required: false, description: "FK -> Animal.id; a HEIFER in the same herd designated to replace the culled cow (self-referential), optional" }
      - { name: decided_at, type: datetime, source: input, description: "Instant the cull was executed" }
      - { name: status, type: enum, source: system, default: EXECUTED, description: "EXECUTED (terminal record)", constraints: "EXECUTED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Animal
    initial_state: HEIFER
    terminal_states: [SOLD, CULLED, DIED]
    transitions:
      - from: HEIFER
        to: ACTIVE
        trigger: "POST /herds/calving-events (first calving)"
        actor: HerdManager
        preconditions:
          - "Animal in HEIFER (ERR_ANIMAL_NOT_BREEDABLE_STATE if SOLD/CULLED/DIED)"
          - "Referenced BreedingEvent is CONFIRMED_PREGNANT (ERR_BREEDING_NOT_CONFIRMED)"
        side_effects:
          - "parity += 1 (becomes 1)"
          - "Referenced BreedingEvent CONFIRMED_PREGNANT -> SERVED_OUT"
          - "A new Lactation opened OPEN (cascade) — see CalvingEvent / Lactation machine"
          - "Animal.status = ACTIVE"
          - "Herd.active_animal_count recomputed"
        note: "First calving moves a heifer into the milking string."
      - from: ACTIVE
        to: DRY
        trigger: "POST /herds/animals/{animalId}/dry-off"
        actor: HerdManager
        preconditions:
          - "Animal is ACTIVE (ERR_ANIMAL_NOT_MILKING)"
          - "Animal has an OPEN Lactation (ERR_NO_OPEN_LACTATION)"
        side_effects:
          - "The OPEN Lactation transitions OPEN -> DRY; dry_off_date stamped (cross-entity)"
        note: "Cow stops being milked but remains in herd."
      - from: DRY
        to: ACTIVE
        trigger: "POST /herds/calving-events (subsequent calving)"
        actor: HerdManager
        preconditions:
          - "Animal in DRY (ERR_ANIMAL_NOT_BREEDABLE_STATE)"
          - "Referenced BreedingEvent is CONFIRMED_PREGNANT (ERR_BREEDING_NOT_CONFIRMED)"
        side_effects:
          - "parity += 1"
          - "Referenced BreedingEvent CONFIRMED_PREGNANT -> SERVED_OUT"
          - "Prior DRY Lactation transitions DRY -> CLOSED (cascade step 1)"
          - "A new Lactation opened OPEN (cascade step 2)"
          - "Animal.status = ACTIVE"
        note: "Cyclic: ACTIVE<->DRY repeats once per parity."
      - from: ACTIVE
        to: CULLED
        trigger: "POST /herds/cull-decisions (disposition SLAUGHTER|DAIRY_SALE)"
        actor: HerdManager
        preconditions:
          - "Animal in {ACTIVE, DRY} (ERR_ANIMAL_NOT_CULLABLE)"
          - "disposition SLAUGHTER requires no ACTIVE HealthTreatment with meat_withdrawal_until > current clock (ERR_MEAT_WITHDRAWAL_ACTIVE)"
        side_effects:
          - "Any OPEN/DRY Lactation -> CLOSED (conditional cascade)"
          - "Animal.milk_eligible = false"
          - "Herd.active_animal_count recomputed"
      - from: DRY
        to: CULLED
        trigger: "POST /herds/cull-decisions (disposition SLAUGHTER|DAIRY_SALE)"
        actor: HerdManager
        preconditions:
          - "Animal in {ACTIVE, DRY} (ERR_ANIMAL_NOT_CULLABLE)"
          - "disposition SLAUGHTER requires no active meat withdrawal (ERR_MEAT_WITHDRAWAL_ACTIVE)"
        side_effects:
          - "DRY Lactation -> CLOSED"
          - "Herd.active_animal_count recomputed"
      - from: ACTIVE
        to: DIED
        trigger: "POST /herds/cull-decisions (disposition DIED)"
        actor: HerdManager
        preconditions:
          - "Animal in {ACTIVE, DRY} (ERR_ANIMAL_NOT_CULLABLE)"
        side_effects:
          - "Any OPEN/DRY Lactation -> CLOSED"
          - "Herd.active_animal_count recomputed"

  - entity: Lactation
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: DRY
        trigger: "system (Animal dry-off)"
        actor: system
        preconditions:
          - "Lactation is OPEN (ERR_LACTATION_NOT_OPEN)"
        side_effects:
          - "dry_off_date stamped"
      - from: DRY
        to: CLOSED
        trigger: "system (cascade when a subsequent CalvingEvent opens the next lactation, or animal culled/died)"
        actor: system
        preconditions: []
        side_effects:
          - "Lactation frozen; no further TestDayRecords accepted (ERR_LACTATION_CLOSED on test-day add)"
      - from: OPEN
        to: CLOSED
        trigger: "system (cascade when animal culled/died directly from ACTIVE)"
        actor: system
        preconditions: []
        side_effects: ["Lactation frozen"]

  - entity: BreedingEvent
    initial_state: BRED
    terminal_states: [SERVED_OUT]
    transitions:
      - from: BRED
        to: CONFIRMED_PREGNANT
        trigger: "POST /herds/breeding-events/{breedingId}/confirm"
        actor: Veterinarian
        preconditions:
          - "Event is BRED (ERR_BREEDING_NOT_PENDING)"
          - "current clock <= confirm_due_at (ERR_PREG_CHECK_WINDOW_ELAPSED)"
        side_effects: []
      - from: BRED
        to: OPEN
        trigger: "POST /herds/breeding-events/{breedingId}/mark-open"
        actor: Veterinarian
        preconditions:
          - "Event is BRED (ERR_BREEDING_NOT_PENDING)"
        side_effects:
          - "Animal becomes breedable again — a new BreedingEvent may be created (cyclic retry)"
        note: "Cyclic: failed service returns the cow to OPEN so a new service can be logged."
      - from: CONFIRMED_PREGNANT
        to: SERVED_OUT
        trigger: "system (CalvingEvent created referencing this breeding event)"
        actor: system
        preconditions:
          - "Event is CONFIRMED_PREGNANT (ERR_BREEDING_NOT_CONFIRMED)"
        side_effects: ["Linked to the CalvingEvent"]

  - entity: HealthTreatment
    initial_state: ACTIVE
    terminal_states: [CLEARED, VOIDED]
    transitions:
      - from: ACTIVE
        to: CLEARED
        trigger: "POST /herds/health-treatments/{treatmentId}/clear"
        actor: Veterinarian
        preconditions:
          - "Treatment is ACTIVE (ERR_TREATMENT_NOT_ACTIVE)"
          - "current clock >= milk_withhold_until AND current clock >= meat_withdrawal_until (ERR_WITHHOLD_NOT_ELAPSED)"
        side_effects:
          - "Recompute Animal.milk_eligible (true if no other ACTIVE treatment still within milk withhold)"
      - from: ACTIVE
        to: VOIDED
        trigger: "POST /herds/health-treatments/{treatmentId}/void"
        actor: Veterinarian
        preconditions:
          - "Treatment is ACTIVE (ERR_TREATMENT_NOT_ACTIVE)"
        side_effects:
          - "Recompute Animal.milk_eligible immediately (treatment no longer counts toward withhold)"
        note: "Entered-in-error reversal."

  - entity: MilkCheck
    initial_state: PROVISIONAL
    terminal_states: [FINALIZED, CANCELLED]
    transitions:
      - from: PROVISIONAL
        to: FINALIZED
        trigger: "POST /herds/milk-checks/{milkCheckId}/finalize"
        actor: CoopSettlementAgent
        preconditions:
          - "Check is PROVISIONAL (ERR_MILK_CHECK_NOT_PROVISIONAL)"
          - "expected_milk_check_version matches MilkCheck.version (ERR_STALE_MILK_CHECK_VERSION)"
          - "At least one eligible, not-yet-pooled TestDayRecord in the settlement month (ERR_EMPTY_MILK_POOL)"
        side_effects:
          - "Pool eligible test-day records in settlement_month from milk_eligible animals; stamp included_in_milk_check_id on each (cross-aggregate, cross-entity)"
          - "Compute pooled_fat_lbs / pooled_protein_lbs / pooled_other_solids_lbs and weighted_scc_thousands"
          - "Compute gross_settlement (calc milk_check_settlement final_settlement) and net_payable = gross_settlement - advance_paid - hauling_deduction"
          - "Recompute Herd.milk_quality_status (calc herd_milk_quality_status)"
          - "increments MilkCheck.version by 1"
      - from: PROVISIONAL
        to: CANCELLED
        trigger: "POST /herds/milk-checks/{milkCheckId}/cancel"
        actor: CoopSettlementAgent
        preconditions:
          - "Check is PROVISIONAL (ERR_MILK_CHECK_NOT_PROVISIONAL)"
          - "expected_milk_check_version matches MilkCheck.version (ERR_STALE_MILK_CHECK_VERSION)"
        side_effects:
          - "No test-day records are stamped; advance_paid retained as informational"
          - "increments MilkCheck.version by 1"

  - entity: MilkingShift
    initial_state: LOGGED
    terminal_states: [VOIDED]
    transitions:
      - from: LOGGED
        to: VOIDED
        trigger: "POST /herds/milking-shifts/{shiftId}/void"
        actor: ParlorTech
        preconditions:
          - "Shift is LOGGED (ERR_SHIFT_NOT_LOGGED)"
        side_effects:
          - "Interval freed; a later shift on the same parlor that previously would collide is now permitted"

# -----------------------------------------------------------------------------
# §1.2.1 Concurrency Rules
# -----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: milk-check-finalize-stale
    parent_entity: MilkCheck
    write_endpoint: "POST /herds/milk-checks/{milkCheckId}/finalize"
    occ_field: "expected_milk_check_version"
    description: |
      Finalizing a MilkCheck whose version has advanced since the client last
      observed it is rejected. This captures the case where another settlement
      writer has already cancelled or re-issued the same provisional check
      (legitimately superseding the prior view under the settlement workflow),
      so the current writer's observed version is stale.
    error_id: ERR_STALE_MILK_CHECK_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: daily_feed_cost
    trigger: "Ration create; read on GET ration"
    algorithm: aggregation
    formula: |
      daily_feed_cost_per_cow = SUM over ingredients of round2(lbs_as_fed * price_per_lb)
      PINNED ORDER: round EACH ingredient line to the cent (round_half_up) THEN sum the
      rounded line costs. Do NOT sum raw products then round once.
    input_set: "All ingredients on the Ration (no per-ingredient status filter)"
    constants: {}
    precision: "2 decimal places, round_half_up; per-line rounding then sum"

  - name: lactation_cumulative_milk
    trigger: "TestDayRecord add (recompute owning Lactation); Animal dry-off"
    algorithm: chronological
    formula: |
      Order TestDayRecords on the lactation by day_in_milk ASC (ties impossible:
      day_in_milk strictly increases). Let tests = [(dim_0, w_0), ...].
      cumulative = w_0 * dim_0                                  # calving (dim 0) to first test
      for i in 1..n-1:
        cumulative += ((w_{i-1} + w_i) / 2) * (dim_i - dim_{i-1})   # Test-Interval-Method
      cumulative_milk_lbs = round1(cumulative)
    input_set: "All TestDayRecords whose lactation_id == this lactation, regardless of milk-check inclusion"
    constants: {}
    precision: "1 decimal place, round_half_up at the end"
    variants:
      - name: actual_to_date
        when: "Reported as Lactation.cumulative_milk_lbs"
        difference: "Stops at the latest recorded test — no extrapolation past the last test day."

  - name: lactation_projected_305d
    trigger: "TestDayRecord add (recompute owning Lactation)"
    algorithm: forward_looking
    formula: |
      Let (last_dim, last_w) be the latest test (highest day_in_milk).
      If no test yet: projected_305d_milk_lbs = 0.
      Else if last_dim >= STANDARD_LACTATION_DAYS: projected = cumulative_milk_lbs.
      Else: projected_305d_milk_lbs = round1( cumulative_milk_lbs + last_w * (STANDARD_LACTATION_DAYS - last_dim) )
    input_set: "Same TestDayRecords as lactation_cumulative_milk; the last test drives the forward projection"
    constants: { STANDARD_LACTATION_DAYS: 305 }
    precision: "1 decimal place, round_half_up at the end"
    variants:
      - name: projected_305d
        when: "Reported alongside actual_to_date"
        difference: "Adds last_w*(305-last_dim) on top of the actual cumulative — projection vs realized."

  - name: milk_check_settlement
    trigger: "MilkCheck create (advance) and MilkCheck finalize (final)"
    algorithm: tiered_pricing
    formula: |
      Pool = eligible TestDayRecords (see input_set).
      For each pooled record:
        line_fat_lbs     = round2(milk_weight_lbs * fat_pct / 100)
        line_protein_lbs = round2(milk_weight_lbs * protein_pct / 100)
        line_ops_lbs     = round2(milk_weight_lbs * OTHER_SOLIDS_PCT / 100)
      pooled_milk_lbs         = SUM(milk_weight_lbs)
      pooled_fat_lbs          = SUM(line_fat_lbs)
      pooled_protein_lbs      = SUM(line_protein_lbs)
      pooled_other_solids_lbs = SUM(line_ops_lbs)
      cwt = pooled_milk_lbs / 100
      weighted_scc_thousands  = round2( SUM(scc_thousands * milk_weight_lbs) / pooled_milk_lbs )

      # Component values — PINNED ORDER: round EACH component line to the cent, THEN sum.
      fat_value  = round2(pooled_fat_lbs          * price_sheet.fat_price_per_lb)
      prot_value = round2(pooled_protein_lbs      * price_sheet.protein_price_per_lb)
      ops_value  = round2(pooled_other_solids_lbs * price_sheet.other_solids_price_per_lb)
      scc_adj    = round2( (SCC_BASE_THOUSANDS - weighted_scc_thousands) * SCC_RATE_PER_1000_PER_CWT * cwt )
      ppd_value  = round2( price_sheet.ppd_per_cwt * cwt )
      gross_settlement  = fat_value + prot_value + ops_value + scc_adj + ppd_value

      hauling_deduction = round2( price_sheet.hauling_rate_per_cwt * cwt )
      net_payable       = gross_settlement - advance_paid - hauling_deduction
    input_set: |
      TestDayRecords whose herd_id == this herd, whose test_date month == MilkCheck.settlement_month,
      whose owning Animal.milk_eligible == true AT FINALIZE TIME, and whose included_in_milk_check_id
      is null (not already pooled). Records on CLOSED lactations ARE included if not yet pooled.
    constants:
      OTHER_SOLIDS_PCT: 5.7         # fixed other-solids percent applied per record
      SCC_BASE_THOUSANDS: 350       # SCC credit/debit baseline
      SCC_RATE_PER_1000_PER_CWT: 0.0005
    precision: "2 decimal places, round_half_up; per-component-line rounding then sum for gross_settlement; net_payable is exact subtraction of rounded values."
    variants:
      - name: provisional_advance
        when: "MilkCheck create (status PROVISIONAL)"
        difference: "advance_paid = round2(advance_rate_per_cwt * pooled_milk_lbs/100) using ONLY pooled milk weight — no components, no SCC, no PPD."
      - name: final_settlement
        when: "MilkCheck finalize (status FINALIZED)"
        difference: "Full component + SCC + PPD value, then net of the already-paid advance and hauling."

  - name: income_over_feed_cost
    trigger: "GET /herds/animals/{animalId}/iofc (computed read)"
    algorithm: aggregation
    formula: |
      latest_test = the TestDayRecord with highest day_in_milk on the animal's OPEN lactation.
      milk_revenue = round2(latest_test.milk_weight_lbs / 100 * blend_price_per_cwt)
      iofc_per_cow_per_day = milk_revenue - ration.daily_feed_cost_per_cow
    input_set: "Single latest TestDayRecord on the animal's OPEN lactation; the named Ration (must be ACTIVE)"
    constants: {}
    precision: "milk_revenue rounded to 2 decimals; iofc is exact subtraction"

  - name: herd_milk_quality_status
    trigger: "MilkCheck finalize (recompute Herd.milk_quality_status)"
    algorithm: threshold
    formula: |
      Using the just-finalized MilkCheck.weighted_scc_thousands:
        if weighted_scc_thousands <= SCC_GOOD_MAX:        GOOD
        elif weighted_scc_thousands <= SCC_WARNING_MAX:   WARNING
        else:                                             PENALIZED
      Upper bound of each band is inclusive (<=).
    input_set: "weighted_scc_thousands of the MilkCheck just transitioned to FINALIZED"
    constants:
      SCC_GOOD_MAX: 200      # <=200 => GOOD
      SCC_WARNING_MAX: 400   # 201..400 => WARNING ; >400 => PENALIZED

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and well-formed"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role permitted for this operation per §1.7"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "All referenced resource ids (path id, then FK body ids) exist, validated path-first then body left-to-right"
    error_id: "ERR_*_NOT_FOUND (resource-specific)"
    http_status: 404
    applies_to: all resource endpoints

  - priority: 4
    category: state
    check: "OCC: when expected_milk_check_version supplied, it must equal MilkCheck.version"
    error_id: ERR_STALE_MILK_CHECK_VERSION
    http_status: 412
    applies_to: "POST /herds/milk-checks/{id}/finalize, POST /herds/milk-checks/{id}/cancel"
    note: "Checked before business preconditions on milk-check mutations."

  - priority: 5
    category: state
    check: "Target resource is in the state its transition requires (MilkCheck PROVISIONAL, Lactation OPEN, BreedingEvent BRED/CONFIRMED, HealthTreatment ACTIVE, Animal in required status)"
    error_id: "ERR_*_NOT_* (state-specific, e.g. ERR_MILK_CHECK_NOT_PROVISIONAL)"
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 6
    category: business_constraint
    check: "Field shape, enum membership, numeric range (fat_pct 0-15, protein_pct 0-10, scc>=0, milk_weight>=0, stall_capacity>=1, ration prices>=0, end_at strictly after start_at)"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "all create/update endpoints"

  - priority: 7
    category: business_constraint
    check: "ear_tag unique within herd; CoopPriceSheet.settlement_month unique within herd"
    error_id: ERR_DUPLICATE_KEY
    http_status: 409
    applies_to: "POST /herds/animals, POST /herds/coop-price-sheets"

  - priority: 8
    category: business_referential
    check: "Cross-entity references must belong to the same herd/animal (calving's breeding_event belongs to the animal; milk-check's price_sheet belongs to the herd; replacement is a HEIFER in same herd; dam in same herd)"
    error_id: ERR_CROSS_HERD_REFERENCE
    http_status: 409
    applies_to: "POST /herds/calving-events, POST /herds/milk-checks, POST /herds/cull-decisions, POST /herds/animals"

  - priority: 9
    category: business_temporal
    check: "TestDayRecord.day_in_milk (from test_date) strictly greater than the latest existing test on the lactation; test_date >= lactation.start_date"
    error_id: ERR_TEST_DATE_NOT_AFTER_PRIOR
    http_status: 409
    applies_to: "POST /herds/test-day-records"

  - priority: 10
    category: business_temporal
    check: "A LOGGED MilkingShift [start_at, end_at) must not overlap any other LOGGED shift on the SAME parlor after applying the parlor turnaround buffer: a new shift's start_at must be >= prior_shift.end_at + turnaround_minutes (adjacency exactly at the buffer boundary is allowed; half-open interval + buffer)."
    error_id: ERR_PARLOR_SHIFT_OVERLAP
    http_status: 409
    applies_to: "POST /herds/milking-shifts"

  - priority: 11
    category: business_temporal
    check: "A new BreedingEvent may not be created while the animal has an existing BreedingEvent in {BRED, CONFIRMED_PREGNANT} (mutual exclusion by status — only after mark-open or calving may a new service be logged)"
    error_id: ERR_OPEN_SERVICE_EXISTS
    http_status: 409
    applies_to: "POST /herds/breeding-events"

  - priority: 11.5
    category: business_temporal
    check: "Voluntary-waiting-period interval on the Animal resource: a new BreedingEvent.service_date must be separated from EVERY prior non-VOIDED BreedingEvent on the same animal (status in {OPEN, SERVED_OUT}) by at least VWP_DAYS. Concretely the new service_date must satisfy service_date >= prior.service_date + VWP_DAYS for every such prior service; a service_date that falls inside the half-open interval [prior.service_date, prior.service_date + VWP_DAYS) is rejected. Minimum-gap interval semantics on a per-animal timeline (distinct from the parlor's extent-overlap-with-buffer geometry). VWP_DAYS = 30."
    error_id: ERR_SERVICE_WITHIN_VWP
    http_status: 409
    applies_to: "POST /herds/breeding-events"

  - priority: 12
    category: business_safety
    check: "Slaughter cull blocked while any ACTIVE HealthTreatment on the animal has meat_withdrawal_until > current clock"
    error_id: ERR_MEAT_WITHDRAWAL_ACTIVE
    http_status: 403
    applies_to: "POST /herds/cull-decisions (disposition=SLAUGHTER)"

  - priority: 13
    category: business_safety
    check: "MilkCheck finalize requires a non-empty pool (>=1 eligible, not-yet-pooled TestDayRecord in the settlement month)"
    error_id: ERR_EMPTY_MILK_POOL
    http_status: 409
    applies_to: "POST /herds/milk-checks/{id}/finalize"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- test-driving: logical clock ---
  - method: POST
    path: "/herds/_clock/set_current_utc"
    description: "Set the server logical clock to an absolute UTC instant. Server startup default is 2026-01-01T00:00:00Z; before any set_current_utc call the clock reads exactly this default and never falls back to wall-clock time. All withhold / pregnancy-check / projection windows evaluate against this clock."
    roles: [HerdManager, ParlorTech, Veterinarian, CoopSettlementAgent, Auditor]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: datetime }"
    side_effects: ["Logical clock set; milk_eligible / treatment-clear / breeding-window checks re-evaluate against it"]

  # --- Herd ---
  - method: POST
    path: "/herds"
    description: "Create a herd"
    roles: [HerdManager]
    code: 201
    input: [name, federal_order_number]
    output: Herd
    side_effects: ["milk_quality_status = GOOD", "active_animal_count = 0"]
  - method: GET
    path: "/herds"
    description: "List herds (paginated)"
    roles: [HerdManager, ParlorTech, Veterinarian, CoopSettlementAgent, Auditor]
    code: 200
    input: []
    output: "Herd[]"
    side_effects: []
  - method: GET
    path: "/herds/{herdId}"
    description: "Get a herd (computed milk_quality_status, active_animal_count)"
    roles: [HerdManager, ParlorTech, Veterinarian, CoopSettlementAgent, Auditor]
    code: 200
    input: []
    output: Herd
    side_effects: []

  # --- Parlor ---
  - method: POST
    path: "/herds/parlors"
    description: "Create a parlor"
    roles: [HerdManager]
    code: 201
    input: [herd_id, name, stall_capacity, "turnaround_minutes?"]
    output: Parlor
    side_effects: []
  - method: GET
    path: "/herds/parlors"
    description: "List parlors, filterable by herd_id (FK reverse-reachability for Parlor.herd_id)"
    roles: [HerdManager, ParlorTech, Veterinarian, CoopSettlementAgent, Auditor]
    code: 200
    input: ["herd_id?"]
    output: "Parlor[]"
    side_effects: []
  - method: GET
    path: "/herds/parlors/{parlorId}"
    description: "Get a parlor"
    roles: [HerdManager, ParlorTech, Veterinarian, CoopSettlementAgent, Auditor]
    code: 200
    input: []
    output: Parlor
    side_effects: []

  # --- Ration ---
  - method: POST
    path: "/herds/rations"
    description: "Create a ration; computes daily_feed_cost_per_cow"
    roles: [HerdManager]
    code: 201
    input: [herd_id, name, ingredients]
    output: Ration
    side_effects: ["daily_feed_cost_per_cow computed (calc daily_feed_cost)"]
  - method: GET
    path: "/herds/rations"
    description: "List rations, filterable by herd_id (FK reverse-reachability for Ration.herd_id)"
    roles: [HerdManager, Veterinarian, CoopSettlementAgent, Auditor]
    code: 200
    input: ["herd_id?"]
    output: "Ration[]"
    side_effects: []
  - method: GET
    path: "/herds/rations/{rationId}"
    description: "Get a ration"
    roles: [HerdManager, Veterinarian, CoopSettlementAgent, Auditor]
    code: 200
    input: []
    output: Ration
    side_effects: []

  # --- CoopPriceSheet ---
  - method: POST
    path: "/herds/coop-price-sheets"
    description: "Register announced FMMO prices for a settlement month"
    roles: [CoopSettlementAgent]
    code: 201
    input: [herd_id, settlement_month, fat_price_per_lb, protein_price_per_lb, other_solids_price_per_lb, ppd_per_cwt, advance_rate_per_cwt, "hauling_rate_per_cwt?"]
    output: CoopPriceSheet
    side_effects: []
  - method: GET
    path: "/herds/coop-price-sheets"
    description: "List price sheets, filterable by herd_id (FK reverse-reachability for CoopPriceSheet.herd_id)"
    roles: [HerdManager, CoopSettlementAgent, Auditor]
    code: 200
    input: ["herd_id?"]
    output: "CoopPriceSheet[]"
    side_effects: []
  - method: GET
    path: "/herds/coop-price-sheets/{priceSheetId}"
    description: "Get a price sheet"
    roles: [HerdManager, CoopSettlementAgent, Auditor]
    code: 200
    input: []
    output: CoopPriceSheet
    side_effects: []

  # --- Animal ---
  - method: POST
    path: "/herds/animals"
    description: "Register an animal (starts HEIFER)"
    roles: [HerdManager]
    code: 201
    input: [herd_id, ear_tag, birth_date, "dam_id?"]
    output: Animal
    side_effects: ["status = HEIFER", "parity = 0", "milk_eligible = true"]
  - method: GET
    path: "/herds/animals"
    description: "List animals, filterable by herd_id, dam_id, status (FK reverse-reachability for Animal.herd_id and Animal.dam_id)"
    roles: [HerdManager, ParlorTech, Veterinarian, CoopSettlementAgent, Auditor]
    code: 200
    input: ["herd_id?", "dam_id?", "status?"]
    output: "Animal[]"
    side_effects: []
  - method: GET
    path: "/herds/animals/{animalId}"
    description: "Get an animal (computed parity, status, milk_eligible)"
    roles: [HerdManager, ParlorTech, Veterinarian, CoopSettlementAgent, Auditor]
    code: 200
    input: []
    output: Animal
    side_effects: []
  - method: POST
    path: "/herds/animals/{animalId}/dry-off"
    description: "Dry off an ACTIVE cow (ACTIVE -> DRY); transitions OPEN lactation to DRY"
    roles: [HerdManager]
    code: 200
    input: []
    output: Animal
    side_effects: ["OPEN Lactation -> DRY (dry_off_date stamped)"]
  - method: GET
    path: "/herds/animals/{animalId}/iofc"
    description: "Computed read: income-over-feed-cost per cow per day for the animal's latest test against a ration and a blend price"
    roles: [HerdManager, Veterinarian, CoopSettlementAgent, Auditor]
    code: 200
    input: [ration_id, blend_price_per_cwt]
    output: "{ milk_revenue: number, daily_feed_cost_per_cow: number, iofc_per_cow_per_day: number }"
    side_effects: []

  # --- Lactation ---
  - method: GET
    path: "/herds/lactations"
    description: "List lactations, filterable by animal_id, herd_id, calving_event_id (FK reverse-reachability for Lactation.animal_id, Lactation.herd_id, Lactation.calving_event_id)"
    roles: [HerdManager, ParlorTech, Veterinarian, CoopSettlementAgent, Auditor]
    code: 200
    input: ["animal_id?", "herd_id?", "calving_event_id?"]
    output: "Lactation[]"
    side_effects: []
  - method: GET
    path: "/herds/lactations/{lactationId}"
    description: "Get a lactation (computed cumulative + projected milk)"
    roles: [HerdManager, ParlorTech, Veterinarian, CoopSettlementAgent, Auditor]
    code: 200
    input: []
    output: Lactation
    side_effects: []

  # --- TestDayRecord ---
  - method: POST
    path: "/herds/test-day-records"
    description: "Record a DHIA test day on a lactation; recomputes cumulative + projected milk"
    roles: [HerdManager, ParlorTech]
    code: 201
    input: [lactation_id, test_date, milk_weight_lbs, fat_pct, protein_pct, scc_thousands]
    output: TestDayRecord
    side_effects:
      - "day_in_milk computed from lactation.start_date"
      - "animal_id, herd_id copied from the lactation"
      - "Lactation.cumulative_milk_lbs recomputed (calc lactation_cumulative_milk)"
      - "Lactation.projected_305d_milk_lbs recomputed (calc lactation_projected_305d)"
  - method: GET
    path: "/herds/test-day-records"
    description: "List test-day records, filterable by lactation_id, animal_id, herd_id, included_in_milk_check_id (FK reverse-reachability)"
    roles: [HerdManager, ParlorTech, Veterinarian, CoopSettlementAgent, Auditor]
    code: 200
    input: ["lactation_id?", "animal_id?", "herd_id?", "included_in_milk_check_id?"]
    output: "TestDayRecord[]"
    side_effects: []
  - method: GET
    path: "/herds/test-day-records/{testDayRecordId}"
    description: "Get a test-day record"
    roles: [HerdManager, ParlorTech, Veterinarian, CoopSettlementAgent, Auditor]
    code: 200
    input: []
    output: TestDayRecord
    side_effects: []

  # --- MilkingShift ---
  - method: POST
    path: "/herds/milking-shifts"
    description: "Log a milking shift on a parlor; rejects overlap (with turnaround buffer)"
    roles: [ParlorTech, HerdManager]
    code: 201
    input: [parlor_id, start_at, end_at, cows_milked]
    output: MilkingShift
    side_effects: ["operator_user_id set from X-User-ID", "herd_id copied from parlor", "status = LOGGED"]
  - method: GET
    path: "/herds/milking-shifts"
    description: "List shifts, filterable by parlor_id, herd_id (FK reverse-reachability for MilkingShift.parlor_id and MilkingShift.herd_id)"
    roles: [HerdManager, ParlorTech, Veterinarian, CoopSettlementAgent, Auditor]
    code: 200
    input: ["parlor_id?", "herd_id?"]
    output: "MilkingShift[]"
    side_effects: []
  - method: GET
    path: "/herds/milking-shifts/{shiftId}"
    description: "Get a milking shift"
    roles: [HerdManager, ParlorTech, Veterinarian, CoopSettlementAgent, Auditor]
    code: 200
    input: []
    output: MilkingShift
    side_effects: []
  - method: POST
    path: "/herds/milking-shifts/{shiftId}/void"
    description: "Void a logged shift (LOGGED -> VOIDED); frees the interval"
    roles: [ParlorTech, HerdManager]
    code: 200
    input: []
    output: MilkingShift
    side_effects: ["Interval freed for overlap checks"]

  # --- BreedingEvent ---
  - method: POST
    path: "/herds/breeding-events"
    description: "Log an AI service (starts BRED); rejects if an open service exists"
    roles: [Veterinarian, HerdManager]
    code: 201
    input: [animal_id, service_date, sire_code]
    output: BreedingEvent
    side_effects: ["confirm_due_at = service_date + PREG_CHECK_WINDOW_DAYS (45 days)", "herd_id copied from animal", "status = BRED"]
    note: "Rejected if an open service exists (ERR_OPEN_SERVICE_EXISTS) or service_date falls within VWP_DAYS=30 of a prior non-voided service on the animal (ERR_SERVICE_WITHIN_VWP)."
  - method: GET
    path: "/herds/breeding-events"
    description: "List breeding events, filterable by animal_id, herd_id (FK reverse-reachability for BreedingEvent.animal_id and BreedingEvent.herd_id)"
    roles: [HerdManager, Veterinarian, CoopSettlementAgent, Auditor]
    code: 200
    input: ["animal_id?", "herd_id?"]
    output: "BreedingEvent[]"
    side_effects: []
  - method: GET
    path: "/herds/breeding-events/{breedingId}"
    description: "Get a breeding event"
    roles: [HerdManager, Veterinarian, CoopSettlementAgent, Auditor]
    code: 200
    input: []
    output: BreedingEvent
    side_effects: []
  - method: POST
    path: "/herds/breeding-events/{breedingId}/confirm"
    description: "Confirm pregnancy (BRED -> CONFIRMED_PREGNANT) within the check window"
    roles: [Veterinarian]
    code: 200
    input: []
    output: BreedingEvent
    side_effects: []
  - method: POST
    path: "/herds/breeding-events/{breedingId}/mark-open"
    description: "Mark a failed service open (BRED -> OPEN); animal becomes breedable for retry"
    roles: [Veterinarian]
    code: 200
    input: []
    output: BreedingEvent
    side_effects: ["Animal may receive a new BreedingEvent"]

  # --- CalvingEvent ---
  - method: POST
    path: "/herds/calving-events"
    description: "Record a calving; closes prior lactation (if any), opens a new one, advances parity and Animal status"
    roles: [HerdManager]
    code: 201
    input: [animal_id, breeding_event_id, calving_date]
    output: CalvingEvent
    side_effects:
      - "Referenced BreedingEvent CONFIRMED_PREGNANT -> SERVED_OUT (cascade step 0)"
      - "herd_id copied from animal"
      - "Animal.parity += 1; Animal.status -> ACTIVE (cascade step 1)"
      - "Prior OPEN/DRY Lactation -> CLOSED if present (cascade step 2); closed_lactation_id set"
      - "New Lactation opened OPEN at calving_date (cascade step 3); opened_lactation_id set"
      - "Herd.active_animal_count recomputed (cascade step 4)"
  - method: GET
    path: "/herds/calving-events"
    description: "List calving events, filterable by animal_id, herd_id, breeding_event_id, opened_lactation_id, closed_lactation_id (FK reverse-reachability for CalvingEvent.animal_id, CalvingEvent.herd_id, CalvingEvent.breeding_event_id, and for Lactation.calving_event_id discovery)"
    roles: [HerdManager, Veterinarian, CoopSettlementAgent, Auditor]
    code: 200
    input: ["animal_id?", "herd_id?", "breeding_event_id?", "opened_lactation_id?", "closed_lactation_id?"]
    output: "CalvingEvent[]"
    side_effects: []
  - method: GET
    path: "/herds/calving-events/{calvingEventId}"
    description: "Get a calving event (opened/closed lactation ids)"
    roles: [HerdManager, Veterinarian, CoopSettlementAgent, Auditor]
    code: 200
    input: []
    output: CalvingEvent
    side_effects: []

  # --- HealthTreatment ---
  - method: POST
    path: "/herds/health-treatments"
    description: "Record a treatment with milk/meat withhold; sets milk_eligible=false while milk withhold active"
    roles: [Veterinarian, HerdManager]
    code: 201
    input: [animal_id, drug_name, administered_at, milk_withhold_hours, meat_withdrawal_hours]
    output: HealthTreatment
    side_effects:
      - "milk_withhold_until = administered_at + milk_withhold_hours; meat_withdrawal_until = administered_at + meat_withdrawal_hours"
      - "herd_id copied from animal"
      - "Animal.milk_eligible = false if milk_withhold_until > current clock"
  - method: GET
    path: "/herds/health-treatments"
    description: "List treatments, filterable by animal_id, herd_id (FK reverse-reachability for HealthTreatment.animal_id and HealthTreatment.herd_id)"
    roles: [HerdManager, Veterinarian, CoopSettlementAgent, Auditor]
    code: 200
    input: ["animal_id?", "herd_id?"]
    output: "HealthTreatment[]"
    side_effects: []
  - method: GET
    path: "/herds/health-treatments/{treatmentId}"
    description: "Get a health treatment (computed withhold-until fields)"
    roles: [HerdManager, Veterinarian, CoopSettlementAgent, Auditor]
    code: 200
    input: []
    output: HealthTreatment
    side_effects: []
  - method: POST
    path: "/herds/health-treatments/{treatmentId}/clear"
    description: "Clear a treatment (ACTIVE -> CLEARED) once both withhold windows elapsed; recomputes milk_eligible"
    roles: [Veterinarian]
    code: 200
    input: []
    output: HealthTreatment
    side_effects: ["Animal.milk_eligible recomputed"]
  - method: POST
    path: "/herds/health-treatments/{treatmentId}/void"
    description: "Void a treatment entered in error (ACTIVE -> VOIDED); recomputes milk_eligible"
    roles: [Veterinarian]
    code: 200
    input: []
    output: HealthTreatment
    side_effects: ["Animal.milk_eligible recomputed immediately"]

  # --- MilkCheck ---
  - method: POST
    path: "/herds/milk-checks"
    description: "Open a provisional milk check for a price sheet's settlement month; pools eligible milk weight and pays an advance"
    roles: [CoopSettlementAgent]
    code: 201
    input: [herd_id, price_sheet_id]
    output: MilkCheck
    side_effects:
      - "settlement_month copied from price sheet"
      - "pooled_milk_lbs = sum of eligible, not-yet-pooled test-day milk_weight_lbs in the month"
      - "advance_paid computed (calc milk_check_settlement variant provisional_advance)"
      - "status = PROVISIONAL; version = 1"
  - method: GET
    path: "/herds/milk-checks"
    description: "List milk checks, filterable by herd_id, price_sheet_id (FK reverse-reachability for MilkCheck.herd_id and MilkCheck.price_sheet_id)"
    roles: [HerdManager, CoopSettlementAgent, Auditor]
    code: 200
    input: ["herd_id?", "price_sheet_id?"]
    output: "MilkCheck[]"
    side_effects: []
  - method: GET
    path: "/herds/milk-checks/{milkCheckId}"
    description: "Get a milk check (computed pooled/settlement fields)"
    roles: [HerdManager, CoopSettlementAgent, Auditor]
    code: 200
    input: []
    output: MilkCheck
    side_effects: []
  - method: POST
    path: "/herds/milk-checks/{milkCheckId}/finalize"
    description: "Finalize a provisional check (PROVISIONAL -> FINALIZED); computes full FMMO settlement and stamps pooled records. OCC-guarded by expected_milk_check_version."
    roles: [CoopSettlementAgent]
    code: 200
    input: [expected_milk_check_version]
    output: MilkCheck
    side_effects:
      - "Pool eligible test-day records; stamp included_in_milk_check_id on each"
      - "Compute gross_settlement, net_payable (calc milk_check_settlement variant final_settlement)"
      - "Recompute Herd.milk_quality_status (calc herd_milk_quality_status)"
      - "increments MilkCheck.version by 1"
  - method: POST
    path: "/herds/milk-checks/{milkCheckId}/cancel"
    description: "Cancel a provisional check (PROVISIONAL -> CANCELLED). OCC-guarded by expected_milk_check_version."
    roles: [CoopSettlementAgent]
    code: 200
    input: [expected_milk_check_version]
    output: MilkCheck
    side_effects: ["No records stamped", "increments MilkCheck.version by 1"]

  # --- CullDecision ---
  - method: POST
    path: "/herds/cull-decisions"
    description: "Execute a cull/replacement decision; transitions the animal to CULLED/DIED and closes lactations"
    roles: [HerdManager]
    code: 201
    input: [animal_id, reason, disposition, decided_at, "replacement_animal_id?"]
    output: CullDecision
    side_effects:
      - "herd_id copied from animal"
      - "Animal.status -> CULLED (SLAUGHTER/DAIRY_SALE) or DIED"
      - "OPEN/DRY Lactation -> CLOSED"
      - "Animal.milk_eligible = false"
      - "Herd.active_animal_count recomputed"
  - method: GET
    path: "/herds/cull-decisions"
    description: "List cull decisions, filterable by animal_id, herd_id, replacement_animal_id (FK reverse-reachability for CullDecision.animal_id, CullDecision.herd_id, CullDecision.replacement_animal_id)"
    roles: [HerdManager, CoopSettlementAgent, Auditor]
    code: 200
    input: ["animal_id?", "herd_id?", "replacement_animal_id?"]
    output: "CullDecision[]"
    side_effects: []
  - method: GET
    path: "/herds/cull-decisions/{cullDecisionId}"
    description: "Get a cull decision"
    roles: [HerdManager, CoopSettlementAgent, Auditor]
    code: 200
    input: []
    output: CullDecision
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # auth
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT, http: 401, condition: "X-User-ID or X-User-Role header missing or malformed" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role not permitted for this operation" }
  # existence
  - { id: ERR_HERD_NOT_FOUND, http: 404, condition: "Herd id does not exist" }
  - { id: ERR_PARLOR_NOT_FOUND, http: 404, condition: "Parlor id does not exist" }
  - { id: ERR_RATION_NOT_FOUND, http: 404, condition: "Ration id does not exist" }
  - { id: ERR_PRICE_SHEET_NOT_FOUND, http: 404, condition: "CoopPriceSheet id does not exist" }
  - { id: ERR_ANIMAL_NOT_FOUND, http: 404, condition: "Animal id does not exist" }
  - { id: ERR_LACTATION_NOT_FOUND, http: 404, condition: "Lactation id does not exist" }
  - { id: ERR_SHIFT_NOT_FOUND, http: 404, condition: "MilkingShift id does not exist" }
  - { id: ERR_BREEDING_NOT_FOUND, http: 404, condition: "BreedingEvent id does not exist" }
  - { id: ERR_TREATMENT_NOT_FOUND, http: 404, condition: "HealthTreatment id does not exist" }
  - { id: ERR_MILK_CHECK_NOT_FOUND, http: 404, condition: "MilkCheck id does not exist" }
  # input shape
  - { id: ERR_INVALID_REQUEST, http: 422, condition: "Missing/malformed field, enum out of range, numeric range violation, end_at not after start_at" }
  - { id: ERR_DUPLICATE_KEY, http: 409, condition: "ear_tag duplicate within herd, or settlement_month duplicate within herd" }
  # referential
  - { id: ERR_CROSS_HERD_REFERENCE, http: 409, condition: "Referenced entity (price sheet, breeding event, dam, replacement) does not belong to the same herd/animal" }
  # state
  - { id: ERR_ANIMAL_NOT_BREEDABLE_STATE, http: 409, condition: "Calving attempted on an animal not in HEIFER/DRY" }
  - { id: ERR_ANIMAL_NOT_MILKING, http: 409, condition: "Dry-off attempted on an animal not ACTIVE" }
  - { id: ERR_NO_OPEN_LACTATION, http: 409, condition: "Dry-off attempted but animal has no OPEN lactation" }
  - { id: ERR_ANIMAL_NOT_CULLABLE, http: 409, condition: "Cull attempted on an animal already terminal or still HEIFER" }
  - { id: ERR_LACTATION_NOT_OPEN, http: 409, condition: "Operation requires the lactation to be OPEN" }
  - { id: ERR_LACTATION_CLOSED, http: 409, condition: "TestDayRecord add attempted on a CLOSED lactation" }
  - { id: ERR_BREEDING_NOT_PENDING, http: 409, condition: "Confirm/mark-open attempted on a breeding event not in BRED" }
  - { id: ERR_BREEDING_NOT_CONFIRMED, http: 409, condition: "Calving references a breeding event not CONFIRMED_PREGNANT" }
  - { id: ERR_PREG_CHECK_WINDOW_ELAPSED, http: 409, condition: "Confirm attempted after confirm_due_at (current clock > confirm_due_at)" }
  - { id: ERR_OPEN_SERVICE_EXISTS, http: 409, condition: "New breeding event while an existing one is BRED or CONFIRMED_PREGNANT" }
  - { id: ERR_SERVICE_WITHIN_VWP, http: 409, condition: "New breeding service_date falls within VWP_DAYS (30) of a prior non-voided service on the same animal (minimum-gap interval overlap)" }
  - { id: ERR_TREATMENT_NOT_ACTIVE, http: 409, condition: "Clear/void attempted on a treatment not ACTIVE" }
  - { id: ERR_WITHHOLD_NOT_ELAPSED, http: 409, condition: "Clear attempted before both withhold windows elapsed" }
  - { id: ERR_SHIFT_NOT_LOGGED, http: 409, condition: "Void attempted on a shift not LOGGED" }
  - { id: ERR_MILK_CHECK_NOT_PROVISIONAL, http: 409, condition: "Finalize/cancel attempted on a check not PROVISIONAL" }
  # temporal / overlap
  - { id: ERR_TEST_DATE_NOT_AFTER_PRIOR, http: 409, condition: "TestDayRecord day_in_milk not strictly greater than the prior test, or test_date before lactation start" }
  - { id: ERR_PARLOR_SHIFT_OVERLAP, http: 409, condition: "MilkingShift interval (with turnaround buffer) overlaps an existing LOGGED shift on the same parlor" }
  # safety
  - { id: ERR_MEAT_WITHDRAWAL_ACTIVE, http: 403, condition: "Slaughter cull blocked by an active meat withdrawal window" }
  - { id: ERR_EMPTY_MILK_POOL, http: 409, condition: "Finalize attempted with no eligible, not-yet-pooled test-day records in the settlement month" }
  # concurrency (OCC)
  - { id: ERR_STALE_MILK_CHECK_VERSION, http: 412, condition: "expected_milk_check_version does not match MilkCheck.version" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: HerdManager
    description: "Owns herd setup, animals, lactations, calving, dry-off, culling, rations, parlors, and test-day recording."
    identity: "opaque"
    exclusive_operations:
      - "POST /herds — create herd"
      - "POST /herds/parlors — create parlor"
      - "POST /herds/rations — create ration"
      - "POST /herds/animals — register animal"
      - "POST /herds/animals/{id}/dry-off — dry off"
      - "POST /herds/calving-events — record calving"
      - "POST /herds/cull-decisions — execute cull"
    shared_operations:
      - "POST /herds/test-day-records — record test day (with ParlorTech)"
      - "POST /herds/milking-shifts and .../void — log/void shifts (with ParlorTech)"
      - "POST /herds/breeding-events — log AI (with Veterinarian)"
      - "POST /herds/health-treatments — record treatment (with Veterinarian)"
      - "GET reads across the herd"

  - name: ParlorTech
    description: "Logs milking shifts and may record test-day samples in the parlor."
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "POST /herds/milking-shifts and .../milking-shifts/{id}/void — log/void shifts (with HerdManager)"
      - "POST /herds/test-day-records — record test day (with HerdManager)"
      - "GET reads across the herd"

  - name: Veterinarian
    description: "Owns breeding confirmation, health treatments, and withhold clearance."
    identity: "opaque"
    exclusive_operations:
      - "POST /herds/breeding-events/{id}/confirm — confirm pregnancy"
      - "POST /herds/breeding-events/{id}/mark-open — mark service open"
      - "POST /herds/health-treatments/{id}/clear — clear treatment"
      - "POST /herds/health-treatments/{id}/void — void treatment"
    shared_operations:
      - "POST /herds/breeding-events — log AI (with HerdManager)"
      - "POST /herds/health-treatments — record treatment (with HerdManager)"
      - "GET reads across the herd"

  - name: CoopSettlementAgent
    description: "Owns FMMO price sheets and the milk-check settlement lifecycle."
    identity: "opaque"
    exclusive_operations:
      - "POST /herds/coop-price-sheets — register prices"
      - "POST /herds/milk-checks — open provisional check"
      - "POST /herds/milk-checks/{id}/finalize — finalize"
      - "POST /herds/milk-checks/{id}/cancel — cancel"
    shared_operations:
      - "GET reads across the herd"

  - name: Auditor
    description: "Read-only oversight across all herd data."
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "GET reads across the herd (all list/detail endpoints)"
