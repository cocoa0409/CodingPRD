              payload: { participant_id: "${p2}", session_id: "${sess}", expected_session_version: "${sv2}" }
              as: IntakeCoordinator
              captures: { err_cutoff: "$.data.error_id" }
          assert:
            - "The duplicate request returns HTTP 409 with data.error_id == ERR_DUPLICATE_ENROLLMENT"
            - "The INACTIVE request returns HTTP 409 with data.error_id == ERR_PARTICIPANT_NOT_ACTIVE"
            - "The late request returns HTTP 422 with data.error_id == ERR_ENROLLMENT_CUTOFF_PASSED (the session starts 14 hours after the clock, inside the 24-hour cutoff)"
            - "GET /recreation/enrollments filtered by session_id ${sess} returns total_count 1"

