scaffold_difficulty_design:

  # =========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: sourcing_origin_vs_destination_diverge_on_transaction
        grounds:
          - calculations.sourcing_resolution
          - calculations.line_item_tax
          - state_machines.Transaction.PENDING_to_SETTLED
          - entities.Transaction.fields.applied_rate
          - entities.TaxJurisdiction.fields.sourcing_rule
        distinguishing_aspect: |
          Identical line items (two FULL lines, qty 1 @ 7.95) settled against a DESTINATION jurisdiction
          (combined_rate 0.0825) yield tax_collected 1.32, but against an ORIGIN jurisdiction (origin
          state combined_rate 0.0625) yield 1.00 — the divergence is on the Transaction entity via the
          sourcing variant.
        test_recipe:
          setup:
            - "TaxJurisdiction CA (DESTINATION, combined 0.0825) and TX (ORIGIN, combined 0.0625) exist."
            - "ProductCategory TANGIBLE=FULL exists in both CA and TX."
            - "Two ACTIVE sellers: seller_ca with origin_state_code TX (so a CA-origin-sourced sale would pull TX rate), seller_dest with origin TX."
            - "Two PENDING transactions each with two TANGIBLE line items qty 1 @ 7.95: one to CA (DESTINATION), one to a TX (ORIGIN) destination."
          setup_api_calls:
            - call: "POST /tax-jurisdictions"
              payload: { state_code: "CA", sourcing_rule: "DESTINATION", state_rate: 0.0725, local_rate: 0.0100, reduced_rate: 0.02, economic_nexus_sales_threshold: 100000.00, economic_nexus_txn_threshold: 0 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { ca_id: $.data.id }
            - call: "POST /tax-jurisdictions"
              payload: { state_code: "TX", sourcing_rule: "ORIGIN", state_rate: 0.0625, local_rate: 0.0000, reduced_rate: 0.00, economic_nexus_sales_threshold: 500000.00, economic_nexus_txn_threshold: 0 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { tx_id: $.data.id }
            - call: "POST /product-categories"
              payload: { jurisdiction_id: "${ca_id}", category_code: "TANGIBLE", taxability: "FULL" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /product-categories"
              payload: { jurisdiction_id: "${tx_id}", category_code: "TANGIBLE", taxability: "FULL" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /sellers"
              payload: { legal_name: "Dest Seller", origin_state_code: "TX" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { s_dest_id: $.data.id }
            - call: "POST /sellers"
              payload: { legal_name: "Origin Seller", origin_state_code: "TX" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { s_orig_id: $.data.id }
            - call: "POST /transactions"
              payload: { seller_id: "${s_dest_id}", jurisdiction_id: "${ca_id}", customer_ref: "buyer-d", customer_exempt_requested: false }
              as: Seller
              as_user_id: "${s_dest_id}"
              captures: { tdest_id: $.data.id }
            - call: "POST /line-items"
              payload: { transaction_id: "${tdest_id}", category_code: "TANGIBLE", quantity: 1, unit_price: 7.95 }
              as: Seller
              as_user_id: "${s_dest_id}"
            - call: "POST /line-items"
              payload: { transaction_id: "${tdest_id}", category_code: "TANGIBLE", quantity: 1, unit_price: 7.95 }
              as: Seller
              as_user_id: "${s_dest_id}"
            - call: "POST /transactions"
              payload: { seller_id: "${s_orig_id}", jurisdiction_id: "${tx_id}", customer_ref: "buyer-o", customer_exempt_requested: false }
              as: Seller
              as_user_id: "${s_orig_id}"
              captures: { torig_id: $.data.id }
            - call: "POST /line-items"
              payload: { transaction_id: "${torig_id}", category_code: "TANGIBLE", quantity: 1, unit_price: 7.95 }
              as: Seller
              as_user_id: "${s_orig_id}"
            - call: "POST /line-items"
              payload: { transaction_id: "${torig_id}", category_code: "TANGIBLE", quantity: 1, unit_price: 7.95 }
              as: Seller
              as_user_id: "${s_orig_id}"
          trigger:
            - call: "POST /transactions/${tdest_id}/settle"
              payload: {}
              as: Seller
              as_user_id: "${s_dest_id}"
              captures: { dest_sourcing: $.data.sourcing_used, dest_tax: $.data.tax_collected }
            - call: "POST /transactions/${torig_id}/settle"
              payload: {}
              as: Seller
              as_user_id: "${s_orig_id}"
              captures: { orig_sourcing: $.data.sourcing_used, orig_tax: $.data.tax_collected }
          assert:
            - "Transaction.${tdest_id}.sourcing_used == DESTINATION"
            - "Transaction.${tdest_id}.applied_rate == 0.0825"
            - "Transaction.${tdest_id}.tax_collected == 1.32"
            - "Transaction.${torig_id}.sourcing_used == ORIGIN"
            - "Transaction.${torig_id}.applied_rate == 0.0625"
            - "Transaction.${torig_id}.tax_collected == 1.00"

      - name: remittance_responsibility_marketplace_vs_seller_diverge
        grounds:
          - calculations.remittance_responsibility
          - state_machines.Transaction.PENDING_to_SETTLED
          - entities.Transaction.fields.remittance_responsibility
          - entities.MarketplaceFacilitator.fields.collecting_state_codes
          - entities.NexusProfile.fields.cumulative_taxable_sales
        distinguishing_aspect: |
          The same FULL line item (qty 1 @ 7.95) settled to CA produces remittance_responsibility=MARKETPLACE
          and ZERO NexusProfile accrual when a facilitator collecting in CA is attached, versus
          remittance_responsibility=SELLER and a 7.95 nexus accrual when no facilitator is attached — the
          variant subject is the MarketplaceFacilitator/NexusProfile domain, distinct from the sourcing variant above.
        test_recipe:
          setup:
            - "TaxJurisdiction CA (DESTINATION 0.0825) and ProductCategory TANGIBLE=FULL in CA."
            - "MarketplaceFacilitator MP collecting in CA."
            - "Seller s with a CA NexusProfile at cumulative_taxable_sales 0."
            - "Two PENDING CA transactions each one TANGIBLE line qty 1 @ 7.95: one with facilitator MP, one without."
          setup_api_calls:
            - call: "POST /tax-jurisdictions"
              payload: { state_code: "CA", sourcing_rule: "DESTINATION", state_rate: 0.0725, local_rate: 0.0100, reduced_rate: 0.02, economic_nexus_sales_threshold: 100000.00, economic_nexus_txn_threshold: 0 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { ca_id: $.data.id }
            - call: "POST /product-categories"
              payload: { jurisdiction_id: "${ca_id}", category_code: "TANGIBLE", taxability: "FULL" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /marketplace-facilitators"
              payload: { name: "MP", collecting_state_codes: ["CA"] }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { mp_id: $.data.id }
            - call: "POST /sellers"
              payload: { legal_name: "S", origin_state_code: "CA" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { s_id: $.data.id }
            - call: "POST /nexus-profiles"
              payload: { seller_id: "${s_id}", jurisdiction_id: "${ca_id}" }
              as: Seller
              as_user_id: "${s_id}"
              captures: { np_id: $.data.id }
            - call: "POST /transactions"
              payload: { seller_id: "${s_id}", jurisdiction_id: "${ca_id}", facilitator_id: "${mp_id}", customer_ref: "b1", customer_exempt_requested: false }
              as: Seller
              as_user_id: "${s_id}"
              captures: { t_mp_id: $.data.id }
            - call: "POST /line-items"
              payload: { transaction_id: "${t_mp_id}", category_code: "TANGIBLE", quantity: 1, unit_price: 7.95 }
              as: Seller
              as_user_id: "${s_id}"
            - call: "POST /transactions"
              payload: { seller_id: "${s_id}", jurisdiction_id: "${ca_id}", customer_ref: "b2", customer_exempt_requested: false }
              as: Seller
              as_user_id: "${s_id}"
              captures: { t_seller_id: $.data.id }
            - call: "POST /line-items"
              payload: { transaction_id: "${t_seller_id}", category_code: "TANGIBLE", quantity: 1, unit_price: 7.95 }
              as: Seller
              as_user_id: "${s_id}"
          trigger:
            - call: "POST /transactions/${t_mp_id}/settle"
              payload: {}
              as: Seller
              as_user_id: "${s_id}"
              captures: { mp_resp: $.data.remittance_responsibility }
            - call: "POST /transactions/${t_seller_id}/settle"
              payload: {}
              as: Seller
              as_user_id: "${s_id}"
              captures: { seller_resp: $.data.remittance_responsibility }
            - call: "GET /nexus-profiles/${np_id}"
              payload: {}
              as: Seller
              as_user_id: "${s_id}"
              captures: { cum_sales: $.data.cumulative_taxable_sales }
          assert:
            - "Transaction.${t_mp_id}.remittance_responsibility == MARKETPLACE"
            - "Transaction.${t_seller_id}.remittance_responsibility == SELLER"
            - "NexusProfile.${np_id}.cumulative_taxable_sales == 7.95"
            - "NexusProfile.${np_id}.cumulative_txn_count == 1"

  # =========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: mixed_taxability_lines_conditional_branch_mode_a
        grounds:
          - calculations.line_item_tax
          - state_machines.Transaction.PENDING_to_SETTLED
          - entities.TransactionLineItem.fields.line_taxability
          - entities.TransactionLineItem.fields.line_tax
          - entities.ProductCategory.fields.taxability
        distinguishing_aspect: |
          Mode (a): a single settle resolves three lines through conditional branches on category taxability
          (TANGIBLE=FULL @0.0825 -> 2.48; GROCERY=REDUCED @0.02 -> 1.00; DIGITAL=EXEMPT -> 0.00), summing to
          tax_collected 3.48 with taxable_subtotal 80.00 — non-linear interaction of category, rate, and exemption.
        test_recipe:
          setup:
            - "TaxJurisdiction CA (combined 0.0825, reduced 0.02)."
            - "ProductCategory in CA: TANGIBLE=FULL, GROCERY=REDUCED, DIGITAL=EXEMPT."
            - "ACTIVE seller s; PENDING CA transaction with three lines: TANGIBLE qty1 @30.00, GROCERY qty1 @50.00, DIGITAL qty1 @20.00."
          setup_api_calls:
            - call: "POST /tax-jurisdictions"
              payload: { state_code: "CA", sourcing_rule: "DESTINATION", state_rate: 0.0725, local_rate: 0.0100, reduced_rate: 0.02, economic_nexus_sales_threshold: 100000.00, economic_nexus_txn_threshold: 0 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { ca_id: $.data.id }
            - call: "POST /product-categories"
              payload: { jurisdiction_id: "${ca_id}", category_code: "TANGIBLE", taxability: "FULL" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /product-categories"
              payload: { jurisdiction_id: "${ca_id}", category_code: "GROCERY", taxability: "REDUCED" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /product-categories"
              payload: { jurisdiction_id: "${ca_id}", category_code: "DIGITAL", taxability: "EXEMPT" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /sellers"
              payload: { legal_name: "S", origin_state_code: "CA" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { s_id: $.data.id }
            - call: "POST /transactions"
              payload: { seller_id: "${s_id}", jurisdiction_id: "${ca_id}", customer_ref: "b1", customer_exempt_requested: false }
              as: Seller
              as_user_id: "${s_id}"
              captures: { t_id: $.data.id }
            - call: "POST /line-items"
              payload: { transaction_id: "${t_id}", category_code: "TANGIBLE", quantity: 1, unit_price: 30.00 }
              as: Seller
              as_user_id: "${s_id}"
            - call: "POST /line-items"
              payload: { transaction_id: "${t_id}", category_code: "GROCERY", quantity: 1, unit_price: 50.00 }
              as: Seller
              as_user_id: "${s_id}"
            - call: "POST /line-items"
              payload: { transaction_id: "${t_id}", category_code: "DIGITAL", quantity: 1, unit_price: 20.00 }
              as: Seller
              as_user_id: "${s_id}"
          trigger:
            - call: "POST /transactions/${t_id}/settle"
              payload: {}
              as: Seller
              as_user_id: "${s_id}"
              captures: { tc: $.data.tax_collected, ts: $.data.taxable_subtotal }
          assert:
            - "Transaction.${t_id}.tax_collected == 3.48"
            - "Transaction.${t_id}.taxable_subtotal == 80.00"

      - name: round_then_sum_pinned_order_mode_b
        grounds:
          - calculations.line_item_tax
          - state_machines.Transaction.PENDING_to_SETTLED
          - entities.TransactionLineItem.fields.line_tax
          - entities.Transaction.fields.tax_collected
        distinguishing_aspect: |
          Mode (b): rounding order matters. Two FULL lines each qty 1 @ 7.95 at 0.0825 -> each line rounds to
          0.66; round-then-sum (PINNED) = 1.32, whereas the rejected sum-then-round would give 1.31. The
          scaffold pins per-line rounding, so tax_collected MUST equal 1.32.
        test_recipe:
          setup:
            - "TaxJurisdiction CA (combined 0.0825); ProductCategory TANGIBLE=FULL."
            - "ACTIVE seller s; PENDING CA transaction with two TANGIBLE lines qty1 @7.95."
          setup_api_calls:
            - call: "POST /tax-jurisdictions"
              payload: { state_code: "CA", sourcing_rule: "DESTINATION", state_rate: 0.0725, local_rate: 0.0100, reduced_rate: 0.02, economic_nexus_sales_threshold: 100000.00, economic_nexus_txn_threshold: 0 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { ca_id: $.data.id }
            - call: "POST /product-categories"
              payload: { jurisdiction_id: "${ca_id}", category_code: "TANGIBLE", taxability: "FULL" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /sellers"
              payload: { legal_name: "S", origin_state_code: "CA" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { s_id: $.data.id }
            - call: "POST /transactions"
              payload: { seller_id: "${s_id}", jurisdiction_id: "${ca_id}", customer_ref: "b1", customer_exempt_requested: false }
              as: Seller
              as_user_id: "${s_id}"
              captures: { t_id: $.data.id }
            - call: "POST /line-items"
              payload: { transaction_id: "${t_id}", category_code: "TANGIBLE", quantity: 1, unit_price: 7.95 }
              as: Seller
              as_user_id: "${s_id}"
            - call: "POST /line-items"
              payload: { transaction_id: "${t_id}", category_code: "TANGIBLE", quantity: 1, unit_price: 7.95 }
              as: Seller
              as_user_id: "${s_id}"
          trigger:
            - call: "POST /transactions/${t_id}/settle"
              payload: {}
              as: Seller
              as_user_id: "${s_id}"
              captures: { tc: $.data.tax_collected }
          assert:
            - "Transaction.${t_id}.tax_collected == 1.32"
            - "Transaction.${t_id}.taxable_subtotal == 15.90"

  # =========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: transaction_parallel_settlement_and_audit_dimensions
        grounds:
          - state_machines.Transaction.PENDING_to_SETTLED
          - state_machines.Transaction.UNREVIEWED_to_FLAGGED
          - entities.Transaction.fields.settlement_status
          - entities.Transaction.fields.audit_status
        distinguishing_aspect: |
          Transaction carries two INDEPENDENT state dimensions: flagging a still-PENDING transaction moves
          audit_status UNREVIEWED->FLAGGED while settlement_status stays PENDING, proving the axes evolve
          independently on one entity (parallel shape).
        test_recipe:
          setup:
            - "TaxJurisdiction CA; ProductCategory TANGIBLE=FULL; ACTIVE seller s; PENDING CA transaction with one TANGIBLE line."
            - "Auditor available."
          setup_api_calls:
            - call: "POST /tax-jurisdictions"
              payload: { state_code: "CA", sourcing_rule: "DESTINATION", state_rate: 0.0725, local_rate: 0.0100, reduced_rate: 0.02, economic_nexus_sales_threshold: 100000.00, economic_nexus_txn_threshold: 0 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { ca_id: $.data.id }
            - call: "POST /product-categories"
              payload: { jurisdiction_id: "${ca_id}", category_code: "TANGIBLE", taxability: "FULL" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /sellers"
              payload: { legal_name: "S", origin_state_code: "CA" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { s_id: $.data.id }
            - call: "POST /transactions"
              payload: { seller_id: "${s_id}", jurisdiction_id: "${ca_id}", customer_ref: "b1", customer_exempt_requested: false }
              as: Seller
              as_user_id: "${s_id}"
              captures: { t_id: $.data.id }
            - call: "POST /line-items"
              payload: { transaction_id: "${t_id}", category_code: "TANGIBLE", quantity: 1, unit_price: 7.95 }
              as: Seller
              as_user_id: "${s_id}"
          trigger:
            - call: "POST /transactions/${t_id}/flag"
              payload: {}
              as: Auditor
              as_user_id: "aud-1"
              captures: { audit: $.data.audit_status, settle: $.data.settlement_status }
          assert:
            - "Transaction.${t_id}.audit_status == FLAGGED"
            - "Transaction.${t_id}.settlement_status == PENDING"

      - name: exemption_certificate_revoke_reinstate_cycle
        grounds:
          - state_machines.ExemptionCertificate.ACTIVE_to_REVOKED
          - state_machines.ExemptionCertificate.REVOKED_to_ACTIVE
          - entities.ExemptionCertificate.fields.status
        distinguishing_aspect: |
          ExemptionCertificate forms a cycle ACTIVE->REVOKED->ACTIVE on a DIFFERENT entity than the parallel
          Transaction machine: a certificate can loop back to ACTIVE via reinstate, proving cyclic shape.
        test_recipe:
          setup:
            - "Clock at 2026-01-01. TaxJurisdiction CA; ACTIVE seller s; an ACTIVE ExemptionCertificate valid 2026-01-01..2027-01-01."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /tax-jurisdictions"
              payload: { state_code: "CA", sourcing_rule: "DESTINATION", state_rate: 0.0725, local_rate: 0.0100, reduced_rate: 0.02, economic_nexus_sales_threshold: 100000.00, economic_nexus_txn_threshold: 0 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { ca_id: $.data.id }
            - call: "POST /sellers"
              payload: { legal_name: "S", origin_state_code: "CA" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { s_id: $.data.id }
            - call: "POST /exemption-certificates"
              payload: { seller_id: "${s_id}", jurisdiction_id: "${ca_id}", customer_ref: "b1", exempt_category_code: "TANGIBLE", valid_from: "2026-01-01T00:00:00Z", valid_to: "2027-01-01T00:00:00Z" }
              as: Seller
              as_user_id: "${s_id}"
              captures: { cert_id: $.data.id }
            - call: "POST /exemption-certificates/${cert_id}/revoke"
              payload: {}
              as: Seller
              as_user_id: "${s_id}"
              captures: { st_after_revoke: $.data.status }
          trigger:
            - call: "POST /exemption-certificates/${cert_id}/reinstate"
              payload: {}
              as: Seller
              as_user_id: "${s_id}"
              captures: { st_after_reinstate: $.data.status }
          assert:
            - "ExemptionCertificate.${cert_id}.status == ACTIVE"
            - "ExemptionCertificate.${cert_id}.version == 3"

  # =========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: settle_accrue_then_posture_flip_depth3
        grounds:
          - state_machines.Transaction.PENDING_to_SETTLED
          - state_machines.NexusProfile.NO_NEXUS_to_THRESHOLD_MET
          - calculations.nexus_status
          - entities.NexusProfile.fields.cumulative_taxable_sales
          - entities.NexusProfile.fields.nexus_status
        distinguishing_aspect: |
          Depth-3 chain from a single settle: (1) Transaction PENDING->SETTLED mutates
          (2) NexusProfile.cumulative_taxable_sales to 100000.00, which itself triggers
          (3) NexusProfile.nexus_status recompute flipping NO_NEXUS->THRESHOLD_MET (100000 >= threshold 100000).
          Each hop is caused by the prior hop, not the original action.
        test_recipe:
          setup:
            - "TaxJurisdiction CA (combined 0.0825, sales threshold 100000.00, txn threshold 0)."
            - "ProductCategory TANGIBLE=FULL; ACTIVE seller s with a CA NexusProfile (NO_NEXUS, 0)."
            - "PENDING CA transaction with one TANGIBLE line qty 1 @ 100000.00."
          setup_api_calls:
            - call: "POST /tax-jurisdictions"
              payload: { state_code: "CA", sourcing_rule: "DESTINATION", state_rate: 0.0725, local_rate: 0.0100, reduced_rate: 0.02, economic_nexus_sales_threshold: 100000.00, economic_nexus_txn_threshold: 0 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { ca_id: $.data.id }
            - call: "POST /product-categories"
              payload: { jurisdiction_id: "${ca_id}", category_code: "TANGIBLE", taxability: "FULL" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /sellers"
              payload: { legal_name: "S", origin_state_code: "CA" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { s_id: $.data.id }
            - call: "POST /nexus-profiles"
              payload: { seller_id: "${s_id}", jurisdiction_id: "${ca_id}" }
              as: Seller
              as_user_id: "${s_id}"
              captures: { np_id: $.data.id }
            - call: "POST /transactions"
              payload: { seller_id: "${s_id}", jurisdiction_id: "${ca_id}", customer_ref: "b1", customer_exempt_requested: false }
              as: Seller
              as_user_id: "${s_id}"
              captures: { t_id: $.data.id }
            - call: "POST /line-items"
              payload: { transaction_id: "${t_id}", category_code: "TANGIBLE", quantity: 1, unit_price: 100000.00 }
              as: Seller
              as_user_id: "${s_id}"
          trigger:
            - call: "POST /transactions/${t_id}/settle"
              payload: {}
              as: Seller
              as_user_id: "${s_id}"
            - call: "GET /nexus-profiles/${np_id}"
              payload: {}
              as: Seller
              as_user_id: "${s_id}"
              captures: { cum: $.data.cumulative_taxable_sales, st: $.data.nexus_status }
          assert:
            - "NexusProfile.${np_id}.cumulative_taxable_sales == 100000.00"
            - "NexusProfile.${np_id}.nexus_status == THRESHOLD_MET"
            - "Transaction.${t_id}.tax_collected == 8250.00"

      - name: accept_sweep_transactions_and_usetax_depth2
        grounds:
          - state_machines.TaxReturn.DRAFT_to_ACCEPTED
          - calculations.return_tax_due
          - entities.Transaction.fields.tax_return_id
          - entities.UseTaxAccrual.fields.status
          - entities.UseTaxAccrual.fields.tax_return_id
        distinguishing_aspect: |
          Depth-2 cascade from a DIFFERENT trigger (TaxReturn accept): (1) accept sweeps a SETTLED SELLER
          transaction setting its tax_return_id, which (2) drives the UseTaxAccrual in the same window to
