    roles: [ElectionAdmin, PrecinctCaptain, CustodyOfficer, SupportAgent, PollWorker]
    code: 200
    input: ["polling_place_id?", "limit?", "offset?"]
    output: ProvisionalBallot[]
    side_effects: []
  - method: POST
    path: "/provisional-ballots/{id}/adjudicate"
    description: "Adjudicate a provisional ballot (accept or reject)."
    roles: [PrecinctCaptain]
    code: 200
    input: [decision]
    output: ProvisionalBallot
    side_effects: ["ACCEPT: place.provisional_accepted_count += 1", "status CAST -> ACCEPTED|REJECTED", "increments ProvisionalBallot.version by 1"]

  - method: POST
    path: "/incidents"
    description: "Open an incident / support-hotline ticket."
    roles: [SupportAgent, PrecinctCaptain]
    code: 201
    input: [polling_place_id, category, description, "equipment_unit_id?"]
    output: Incident
    side_effects: []
  - method: GET
    path: "/incidents/{id}"
    description: "Fetch an incident."
    roles: [ElectionAdmin, PrecinctCaptain, CustodyOfficer, SupportAgent, PollWorker]
    code: 200
    input: []
    output: Incident
    side_effects: []
  - method: GET
    path: "/incidents"
    description: "List incidents; filterable by place and/or equipment."
    roles: [ElectionAdmin, PrecinctCaptain, CustodyOfficer, SupportAgent, PollWorker]
    code: 200
    input: ["polling_place_id?", "equipment_unit_id?", "limit?", "offset?"]
    output: Incident[]
    side_effects: []
  - method: POST
    path: "/incidents/{id}/acknowledge"
    description: "Acknowledge an open incident."
    roles: [SupportAgent]
    code: 200
    input: []
    output: Incident
    side_effects: ["status OPEN -> ACKNOWLEDGED", "increments Incident.version by 1"]
  - method: POST
    path: "/incidents/{id}/escalate"
    description: "Escalate an incident to CRITICAL; equipment incidents take the unit out of service (cascade)."
    roles: [SupportAgent]
    code: 200
    input: []
    output: Incident
    side_effects: ["status -> ESCALATED", "severity = CRITICAL", "equipment cascade OUT_OF_SERVICE -> place SUSPENDED", "increments Incident.version by 1"]
  - method: POST
    path: "/incidents/{id}/resolve"
    description: "Resolve an incident."
    roles: [SupportAgent]
    code: 200
    input: [resolution]
    output: Incident
    side_effects: ["status -> RESOLVED", "increments Incident.version by 1"]

# =====================================================================
# §1.6 Error Code Catalog
# =====================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "missing/unknown X-User-Role or X-User-ID headers"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "acting role not permitted for this operation"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "referenced resource (path id or FK) does not exist"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "requested transition is not defined from the target's current state"
  - id: ERR_KIT_COMPROMISED
    http: 409
    condition: "a SupplyKit for the place is COMPROMISED when opening/resuming"
  - id: ERR_EQUIPMENT_NOT_OPERATIONAL
    http: 409
    condition: "equipment at the place is OUT_OF_SERVICE, or no SupplyKit is AT_PLACE, when opening/resuming"
  - id: ERR_WORKER_NOT_CERTIFIED
    http: 422
    condition: "poll worker is not CERTIFIED when activating an assignment or checking in"
  - id: ERR_WORKER_SHIFT_OVERLAP
    http: 409
    condition: "worker already has a shift whose window overlaps this shift (half-open)"
  - id: ERR_PLACE_CAPACITY_EXCEEDED
    http: 409
    condition: "overlapping shifts at the place would meet or exceed station_capacity"
  - id: ERR_INVALID_CUSTODY_TRANSITION
    http: 422
    condition: "custody event_type not valid from the kit's current custody_state, or RECEIVE without polling_place_id"
  - id: ERR_INSUFFICIENT_BALLOT_STOCK
    http: 422
    condition: "Election.unallocated_ballot_stock < kit.ballot_count on ISSUE"
  - id: ERR_UNDERSTAFFED
    http: 422
    condition: "slots_filled < min_workers_required when opening the place"
  - id: ERR_NO_OPEN_SLOTS
    http: 422
    condition: "no open staffing slot when activating an assignment"
  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "malformed body: bad enum, scheduled_end <= scheduled_start, negative counts, missing required field"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_polling_place_version does not match current PollingPlace.version on reconcile"
  - id: ERR_VOTING_NOT_OPEN
    http: 409
    condition: "opening a place while its election is not VOTING_OPEN, or casting a provisional when place not OPEN"

# =====================================================================
# §1.7 RBAC Matrix
# =====================================================================
roles:
  - name: ElectionAdmin
    description: "Runs the election: creates elections/places/equipment/workers, deploys equipment, opens/closes voting, certifies training."
    identity: "opaque"
    exclusive_operations:
      - "POST /elections"
      - "POST /elections/{id}/open-voting"
      - "POST /elections/{id}/close-voting"
      - "POST /polling-places"
      - "POST /equipment"
      - "POST /equipment/{id}/deploy"
      - "POST /poll-workers"
      - "POST /poll-workers/{id}/complete-training"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /assignments (with PrecinctCaptain)"
      - "POST /assignments/{id}/activate, withdraw (with PrecinctCaptain)"
      - "POST /shifts (with PrecinctCaptain)"
      - "all GET reads"
  - name: PrecinctCaptain
    description: "Lead poll worker running a place: opens/suspends/resumes/closes/reconciles, manages assignments and shifts, adjudicates provisionals."
    identity: "entity_backed:PollWorker"
    exclusive_operations:
      - "POST /polling-places/{id}/open"
      - "POST /polling-places/{id}/suspend"
      - "POST /polling-places/{id}/resume"
      - "POST /polling-places/{id}/close"
      - "POST /polling-places/{id}/reconcile"
      - "POST /provisional-ballots/{id}/adjudicate"
    shared_operations:
      - "POST /assignments, activate, withdraw (with ElectionAdmin)"
      - "POST /shifts (with ElectionAdmin)"
      - "POST /shifts/{id}/check-in, check-out (with PollWorker)"
      - "POST /provisional-ballots (with PollWorker)"
      - "POST /incidents (with SupportAgent)"
      - "all GET reads"
  - name: PollWorker
    description: "Regular poll worker: checks into/out of own shifts, casts provisional ballots."
    identity: "entity_backed:PollWorker"
    exclusive_operations: []
    shared_operations:
      - "POST /shifts/{id}/check-in, check-out (with PrecinctCaptain)"
      - "POST /provisional-ballots (with PrecinctCaptain)"
      - "all GET reads"
  - name: CustodyOfficer
    description: "Owns chain-of-custody: prepares kits and records all custody transitions."
    identity: "opaque"
    exclusive_operations:
      - "POST /supply-kits"
      - "POST /supply-kits/{id}/custody-events"
    shared_operations:
      - "all GET reads"
  - name: SupportAgent
    description: "Support hotline: opens, acknowledges, escalates, and resolves incidents."
    identity: "opaque"
    exclusive_operations:
      - "POST /incidents/{id}/acknowledge"
      - "POST /incidents/{id}/escalate"
      - "POST /incidents/{id}/resolve"
    shared_operations:
      - "POST /incidents (with PrecinctCaptain)"
      - "all GET reads"
