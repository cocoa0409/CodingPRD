# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3042_managing_partner_equity_buy_restaurant_profit_participation
#
# Breadth probe over §1.1-§1.7 claims not exercised by §1.8.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: partner_create_returns_defaults_and_system_fields
        claim_type: Creation
        grounds:
          - entities.Partner
          - endpoints.POST_/api/partners
        distinguishing_aspect: "A partner created with only full_name/email/role_in_program returns 201 with status CANDIDATE, version 1, null training_started_at/certified_at/placed_restaurant_id, training_weeks_accrued 0, and server-minted id/created_at/updated_at — status is never client-supplied."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/partners"
              payload: { full_name: "Trainee Ann", email: "ta@x.com", role_in_program: "MANAGING_PARTNER" }
              as: HRRecruiter
              captures: { pt_id: $.data.id }
          assert:
            - "response status 201, response_type object, meta.api_request_id present"
            - "Partner.${pt_id}.status == CANDIDATE and version == 1"
            - "Partner.${pt_id}.training_started_at is null, certified_at is null, placed_restaurant_id is null"
            - "Partner.${pt_id}.training_weeks_accrued == 0"
            - "id is a bare UUID with no type prefix"

      - name: partner_create_missing_email_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.Partner.fields.email
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "Omitting required email yields 400 ERR_INVALID_REQUEST and creates no row; supplying an invalid role_in_program enum value also yields 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/partners"
              payload: { full_name: "No Email", role_in_program: "MANAGING_PARTNER" }
              as: HRRecruiter
              captures: { err_id: $.data.error_id }
            - call: "POST /api/partners"
              payload: { full_name: "Bad Enum", email: "be@x.com", role_in_program: "SUPER_PARTNER" }
              as: HRRecruiter
          assert:
            - "first trigger returns 400 ERR_INVALID_REQUEST (missing email)"
            - "second trigger returns 400 ERR_INVALID_REQUEST (SUPER_PARTNER not in the enum)"
            - "GET /api/partners returns total_count == 0"

      - name: partner_list_paginates_and_filters_by_role_and_status
        claim_type: Listing
        grounds:
          - endpoints.GET_/api/partners
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With three partners (two MANAGING_PARTNER, one MARKET_PARTNER, one withdrawn), limit=2&offset=0 returns 2 rows with total_count 3 and has_more true; filters role_in_program and status narrow the set; defaults are limit 10 offset 0."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Three partners created; the third withdrawn."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/partners"
              payload: { full_name: "A One", email: "a1@x.com", role_in_program: "MANAGING_PARTNER" }
              as: HRRecruiter
            - call: "POST /api/partners"
              payload: { full_name: "B Two", email: "b2@x.com", role_in_program: "MANAGING_PARTNER" }
              as: HRRecruiter
            - call: "POST /api/partners"
              payload: { full_name: "C Three", email: "c3@x.com", role_in_program: "MARKET_PARTNER" }
              as: HRRecruiter
              captures: { pc_id: $.data.id }
            - call: "POST /api/partners/${pc_id}/withdraw"
              payload: {}
              as: HRRecruiter
          trigger:
            - call: "GET /api/partners"
              payload: { limit: 2, offset: 0 }
              as: HRRecruiter
          assert:
            - "GET /api/partners?limit=2&offset=0 returns 2 rows, total_count == 3, has_more == true"
            - "GET /api/partners?limit=2&offset=2 returns 1 row, total_count == 3, has_more == false"
            - "GET /api/partners?role_in_program=MARKET_PARTNER returns exactly 1 row"
            - "GET /api/partners?status=WITHDRAWN returns exactly 1 row (${pc_id})"
            - "GET /api/partners with no params uses limit 10, offset 0 and returns all 3"

      - name: contract_get_unknown_id_returns_contract_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/api/managing-partner-contracts/{id}
          - errors.ERR_CONTRACT_NOT_FOUND
        distinguishing_aspect: "A syntactically valid but unallocated UUID produces the entity-specific 404 ERR_CONTRACT_NOT_FOUND, not a generic 400 or 500."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /api/managing-partner-contracts/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: CorporateController
              captures: { err_id: $.data.error_id }
          assert:
            - "response status 404 with error_id ERR_CONTRACT_NOT_FOUND"

      - name: contract_create_dates_inverted_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.ManagingPartnerContract.fields.term_end_date
          - validations.priority_8_business_constraint
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "term_end_date <= term_start_date is a structural 400 ERR_INVALID_REQUEST; the same rule guards period_end_date <= period_start_date on ProfitPeriod creation."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One MANAGING_PARTNER, one ACTIVE restaurant."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/partners"
              payload: { full_name: "Pat Morgan", email: "pm@x.com", role_in_program: "MANAGING_PARTNER" }
              as: HRRecruiter
              captures: { p1_id: $.data.id }
            - call: "POST /api/restaurants"
              payload: { name: "Roadhouse A", city: "Austin", state_code: "TX" }
              as: PlatformAdmin
              captures: { r1_id: $.data.id }
            - call: "POST /api/restaurants/${r1_id}/activate"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /api/managing-partner-contracts"
              payload: { partner_id: "${p1_id}", restaurant_id: "${r1_id}", term_start_date: "2032-01-01", term_end_date: "2027-01-01", buy_in_required_cents: 2500000 }
              as: CorporateController
              captures: { err_id: $.data.error_id }
            - call: "POST /api/profit-periods"
              payload: { restaurant_id: "${r1_id}", period_start_date: "2027-05-01", period_end_date: "2027-04-01" }
              as: OperationsAuditor
          assert:
            - "contract create with inverted term returns 400 ERR_INVALID_REQUEST"
            - "period create with inverted bounds returns 400 ERR_INVALID_REQUEST"

      - name: line_item_partner_basis_computed_not_client_supplied
        claim_type: Computed Fields
        grounds:
          - entities.ProfitStatementLineItem.fields.partner_basis
          - endpoints.POST_/api/profit-periods/{id}/line-items
        distinguishing_aspect: "partner_basis is derived from category: CORPORATE_ADMIN_FEE maps to EXCLUDED and every other category maps to INCLUDED — the client cannot supply it, and input carrying partner_basis is ignored."
        test_recipe:
          setup:
            - "Logical clock at 2027-01-10T00:00:00Z. ACTIVE contract; OPEN period PP20 [2027-01-01, 2027-02-01)."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/partners"
              payload: { full_name: "Pat Morgan", email: "pm@x.com", role_in_program: "MANAGING_PARTNER" }
              as: HRRecruiter
              captures: { p1_id: $.data.id }
            - call: "POST /api/restaurants"
              payload: { name: "Roadhouse A", city: "Austin", state_code: "TX" }
              as: PlatformAdmin
              captures: { r1_id: $.data.id }
            - call: "POST /api/restaurants/${r1_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /api/managing-partner-contracts"
              payload: { partner_id: "${p1_id}", restaurant_id: "${r1_id}", term_start_date: "2027-01-01", term_end_date: "2032-01-01", buy_in_required_cents: 2500000 }
              as: CorporateController
              captures: { c20_id: $.data.id }
            - call: "POST /api/managing-partner-contracts/${c20_id}/submit"
              payload: {}
              as: CorporateController
            - call: "POST /api/managing-partner-contracts/${c20_id}/buy-in-payments"
              payload: { amount_cents: 2500000 }
              as: ManagingPartner
              as_user_id: "${p1_id}"
            - call: "POST /api/managing-partner-contracts/${c20_id}/activate"
              payload: {}
              as: CorporateController
            - call: "POST /api/profit-periods"
              payload: { restaurant_id: "${r1_id}", period_start_date: "2027-01-01", period_end_date: "2027-02-01" }
              as: OperationsAuditor
              captures: { pp20_id: $.data.id, pp20_v: $.data.version }
            - call: "POST /api/_clock/set_current_utc"
              payload: { current_utc: "2027-01-10T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/profit-periods/${pp20_id}/line-items"
              payload: { category: "CORPORATE_ADMIN_FEE", amount_cents: 100000, entry_status: "FINALIZED", expected_profit_period_version: "${pp20_v}" }
              as: OperationsAuditor
              captures: { li1_id: $.data.id }
            - call: "GET /api/profit-periods/${pp20_id}"
              payload: {}
              as: OperationsAuditor
              captures: { pp20_v2: $.data.version }
            - call: "POST /api/profit-periods/${pp20_id}/line-items"
              payload: { category: "LABOR", amount_cents: 100000, entry_status: "FINALIZED", expected_profit_period_version: "${pp20_v2}" }
              as: OperationsAuditor
              captures: { li2_id: $.data.id }
          assert:
            - "ProfitStatementLineItem.${li1_id}.partner_basis == EXCLUDED (CORPORATE_ADMIN_FEE is the excluded corporate charge)"
            - "ProfitStatementLineItem.${li2_id}.partner_basis == INCLUDED"
            - "both responses carry entry_status == FINALIZED and actual_amount_cents == amount_cents (identity until finalize)"

      - name: period_create_references_unknown_restaurant_returns_reference_not_found
        claim_type: Parent Relationships
        grounds:
          - entities.ProfitPeriod.fields.restaurant_id
          - errors.ERR_REFERENCE_NOT_FOUND
        distinguishing_aspect: "A body FK to a non-existent restaurant yields 404 ERR_REFERENCE_NOT_FOUND at priority 4, distinct from the path-id 404 family."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/profit-periods"
              payload: { restaurant_id: "00000000-0000-0000-0000-000000000000", period_start_date: "2027-01-01", period_end_date: "2027-02-01" }
              as: OperationsAuditor
              captures: { err_id: $.data.error_id }
          assert:
            - "response status 404 with error_id ERR_REFERENCE_NOT_FOUND"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: contract_initial_state_is_draft_and_submit_moves_to_pending_funding
        claim_type: Initial State
        grounds:
          - state_machines.ManagingPartnerContract
          - state_machines.ManagingPartnerContract.DRAFT_to_PENDING_FUNDING
        distinguishing_aspect: "A freshly created contract reads status DRAFT with buy_in_escrow_cents 0 and renewed_count 0; submit moves it to PENDING_FUNDING and stamps submitted_at from the logical clock."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One MANAGING_PARTNER, one ACTIVE restaurant."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/partners"
              payload: { full_name: "Pat Morgan", email: "pm@x.com", role_in_program: "MANAGING_PARTNER" }
              as: HRRecruiter
              captures: { p1_id: $.data.id }
            - call: "POST /api/restaurants"
              payload: { name: "Roadhouse A", city: "Austin", state_code: "TX" }
              as: PlatformAdmin
              captures: { r1_id: $.data.id }
            - call: "POST /api/restaurants/${r1_id}/activate"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /api/managing-partner-contracts"
              payload: { partner_id: "${p1_id}", restaurant_id: "${r1_id}", term_start_date: "2027-01-01", term_end_date: "2032-01-01", buy_in_required_cents: 2500000 }
              as: CorporateController
              captures: { c21_id: $.data.id }
            - call: "POST /api/managing-partner-contracts/${c21_id}/submit"
              payload: {}
              as: CorporateController
          assert:
            - "creation response: status == DRAFT, version == 1, buy_in_escrow_cents == 0, capital_account_cents == 0, renewed_count == 0, submitted_at is null"
            - "after submit: status == PENDING_FUNDING, submitted_at == 2026-09-01T00:00:00Z, version == 2"

      - name: activate_from_draft_is_an_invalid_transition
        claim_type: invalid_transition
        grounds:
          - state_machines.ManagingPartnerContract
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "DRAFT -> ACTIVE directly is not a declared transition; activating a DRAFT contract returns 409 ERR_INVALID_STATE regardless of funding."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Contract C22 DRAFT (never submitted)."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/partners"
              payload: { full_name: "Pat Morgan", email: "pm@x.com", role_in_program: "MANAGING_PARTNER" }
              as: HRRecruiter
              captures: { p1_id: $.data.id }
            - call: "POST /api/restaurants"
              payload: { name: "Roadhouse A", city: "Austin", state_code: "TX" }
              as: PlatformAdmin
              captures: { r1_id: $.data.id }
            - call: "POST /api/restaurants/${r1_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /api/managing-partner-contracts"
              payload: { partner_id: "${p1_id}", restaurant_id: "${r1_id}", term_start_date: "2027-01-01", term_end_date: "2032-01-01", buy_in_required_cents: 2500000 }
              as: CorporateController
              captures: { c22_id: $.data.id }
          trigger:
            - call: "POST /api/managing-partner-contracts/${c22_id}/activate"
              payload: {}
              as: CorporateController
              captures: { err_id: $.data.error_id }
          assert:
            - "response status 409, error_id == ERR_INVALID_STATE"
            - "ManagingPartnerContract.${c22_id}.status remains DRAFT with version 1"

      - name: buy_in_payment_on_draft_contract_rejected
        claim_type: Precondition Enforcement
        grounds:
          - endpoints.POST_/api/managing-partner-contracts/{id}/buy-in-payments
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "Funding is only accepted while PENDING_FUNDING; paying against a DRAFT contract fails 409 ERR_INVALID_STATE and escrow stays 0."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Contract C23 DRAFT."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/partners"
              payload: { full_name: "Pat Morgan", email: "pm@x.com", role_in_program: "MANAGING_PARTNER" }
              as: HRRecruiter
              captures: { p1_id: $.data.id }
            - call: "POST /api/restaurants"
              payload: { name: "Roadhouse A", city: "Austin", state_code: "TX" }
              as: PlatformAdmin
              captures: { r1_id: $.data.id }
            - call: "POST /api/restaurants/${r1_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /api/managing-partner-contracts"
              payload: { partner_id: "${p1_id}", restaurant_id: "${r1_id}", term_start_date: "2027-01-01", term_end_date: "2032-01-01", buy_in_required_cents: 2500000 }
              as: CorporateController
              captures: { c23_id: $.data.id }
          trigger:
            - call: "POST /api/managing-partner-contracts/${c23_id}/buy-in-payments"
              payload: { amount_cents: 100 }
              as: ManagingPartner
              as_user_id: "${p1_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "response status 409, error_id == ERR_INVALID_STATE"
            - "ManagingPartnerContract.${c23_id}.buy_in_escrow_cents == 0 and no BuyInPayment row exists (GET .../buy-in-payments total_count == 0)"

      - name: overpayment_beyond_required_buy_in_rejected
        claim_type: Precondition Enforcement
        grounds:
          - endpoints.POST_/api/managing-partner-contracts/{id}/buy-in-payments
          - errors.ERR_BUY_IN_OVERPAYMENT
        distinguishing_aspect: "Escrow is capped at buy_in_required_cents: with 2000000 of 2500000 funded, a 600000 payment is rejected ERR_BUY_IN_OVERPAYMENT while a 500000 payment completes the funding exactly."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Contract C24 PENDING_FUNDING, escrow 2000000 of 2500000."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/partners"
              payload: { full_name: "Pat Morgan", email: "pm@x.com", role_in_program: "MANAGING_PARTNER" }
              as: HRRecruiter
              captures: { p1_id: $.data.id }
            - call: "POST /api/restaurants"
              payload: { name: "Roadhouse A", city: "Austin", state_code: "TX" }
              as: PlatformAdmin
              captures: { r1_id: $.data.id }
            - call: "POST /api/restaurants/${r1_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /api/managing-partner-contracts"
              payload: { partner_id: "${p1_id}", restaurant_id: "${r1_id}", term_start_date: "2027-01-01", term_end_date: "2032-01-01", buy_in_required_cents: 2500000 }
              as: CorporateController
              captures: { c24_id: $.data.id }
            - call: "POST /api/managing-partner-contracts/${c24_id}/submit"
              payload: {}
              as: CorporateController
            - call: "POST /api/managing-partner-contracts/${c24_id}/buy-in-payments"
              payload: { amount_cents: 2000000 }
              as: ManagingPartner
              as_user_id: "${p1_id}"
          trigger:
            - call: "POST /api/managing-partner-contracts/${c24_id}/buy-in-payments"
              payload: { amount_cents: 600000 }
              as: ManagingPartner
              as_user_id: "${p1_id}"
              captures: { err_id: $.data.error_id }
            - call: "POST /api/managing-partner-contracts/${c24_id}/buy-in-payments"
              payload: { amount_cents: 500000 }
              as: ManagingPartner
              as_user_id: "${p1_id}"
          assert:
            - "the 600000 payment returns 422 ERR_BUY_IN_OVERPAYMENT and escrow stays 2000000"
            - "the 500000 payment succeeds: escrow == 2500000 exactly (boundary: escrow == required is funded, not overpaid)"

      - name: period_terminal_lockdown_locked_rejects_everything
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.ProfitPeriod
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "LOCKED is terminal: compute, lock again, and line-item posting against a LOCKED period all fail with 409 ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "Logical clock at 2027-05-06T00:00:00Z. ACTIVE contract; period PP21 [2027-04-01, 2027-05-01) FINALIZED then LOCKED."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/partners"
              payload: { full_name: "Pat Morgan", email: "pm@x.com", role_in_program: "MANAGING_PARTNER" }
              as: HRRecruiter
              captures: { p1_id: $.data.id }
            - call: "POST /api/restaurants"
              payload: { name: "Roadhouse A", city: "Austin", state_code: "TX" }
              as: PlatformAdmin
              captures: { r1_id: $.data.id }
            - call: "POST /api/restaurants/${r1_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /api/managing-partner-contracts"
              payload: { partner_id: "${p1_id}", restaurant_id: "${r1_id}", term_start_date: "2027-01-01", term_end_date: "2032-01-01", buy_in_required_cents: 2500000 }
              as: CorporateController
              captures: { c25_id: $.data.id }
            - call: "POST /api/managing-partner-contracts/${c25_id}/submit"
              payload: {}
              as: CorporateController
            - call: "POST /api/managing-partner-contracts/${c25_id}/buy-in-payments"
              payload: { amount_cents: 2500000 }
              as: ManagingPartner
              as_user_id: "${p1_id}"
            - call: "POST /api/managing-partner-contracts/${c25_id}/activate"
              payload: {}
              as: CorporateController
            - call: "POST /api/profit-periods"
              payload: { restaurant_id: "${r1_id}", period_start_date: "2027-04-01", period_end_date: "2027-05-01" }
              as: OperationsAuditor
              captures: { pp21_id: $.data.id, pp21_v: $.data.version }
            - call: "POST /api/_clock/set_current_utc"
              payload: { current_utc: "2027-05-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/profit-periods/${pp21_id}/line-items"
              payload: { category: "REVENUE", amount_cents: 5000000, entry_status: "FINALIZED", expected_profit_period_version: "${pp21_v}" }
              as: OperationsAuditor
            - call: "GET /api/profit-periods/${pp21_id}"
              payload: {}
              as: OperationsAuditor
              captures: { pp21_v2: $.data.version }
            - call: "POST /api/profit-periods/${pp21_id}/compute"
              payload: { expected_profit_period_version: "${pp21_v2}" }
              as: OperationsAuditor
            - call: "POST /api/profit-periods/${pp21_id}/finalize"
              payload: {}
              as: CorporateController
            - call: "POST /api/profit-periods/${pp21_id}/lock"
              payload: {}
              as: CorporateController
          trigger:
