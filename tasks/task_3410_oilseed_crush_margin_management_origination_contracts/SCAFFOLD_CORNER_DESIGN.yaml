      - name: sales_contract_defaulted_by_sweep_accrues_claim
        claim_type: Side Effect Execution
        grounds: [state_machines.ProductSalesContract.OPEN_to_DEFAULTED, calculations.default_claim_and_suspension]
        distinguishing_aspect: "One contract expiring undelivered defaults with claim_cents == 2000 (1000 x 20 x 0.10) and bumps the buyer to open_claims_count 1 — still ACTIVE, since the suspension threshold is 3."
        test_recipe:
