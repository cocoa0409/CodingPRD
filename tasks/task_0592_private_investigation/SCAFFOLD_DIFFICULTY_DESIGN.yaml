      - name: final_invoice_with_empty_input_set_cannot_be_issued
        grounds:
          - validations[priority=16]
          - errors[ERR_INVOICE_EMPTY]
          - calculations.invoice_totals
          - state_machines.Invoice.DRAFT_to_ISSUED
        distinguishing_aspect: |
          An EMPTY-COLLECTION boundary on a different metric (input-set cardinality, not a numeric
          threshold) reached through a different endpoint (POST /invoices/{id}/issue): with zero
          COMPLETED sessions, zero APPROVED expenses and zero COMPLETED searches all three line groups
          sum to 0, the admin fee on a 0 subtotal is 0, and issuing the zero-total invoice is rejected
          with 422 ERR_INVOICE_EMPTY while the invoice stays DRAFT.
        test_recipe:
          setup:
            - "ACTIVE CA case with a 500000-cent retainer and a LEAD assignment, but no completed work of any kind."
            - "One DRAFT FINAL invoice whose computed totals are all zero."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
