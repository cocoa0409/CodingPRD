      - name: capture_at_exactly_the_cutoff_prices_on_the_next_business_day
        claim_type: threshold_boundary
        grounds:
          - calculations.forward_pricing_trade_date
          - entities.Fund.fields.cutoff_time_utc
          - entities.Trade.fields.trade_date
        distinguishing_aspect: "The cutoff comparison is strict: a capture at 2026-08-03T16:00:00Z, exactly the fund cutoff, prices on 2026-08-04, while a capture at 15:59:59Z on the same day prices on 2026-08-03."
        test_recipe:
          setup:
            - "Class A, CA registration of 1000000.00, account F is DIRECT/CA and ACTIVE."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T15:59:59Z" }
              as: FundAccountant
            - call: "POST /funds"
              payload: { name: "Meridian Growth Fund", fund_family_code: "MER", cutoff_time_utc: "16:00:00" }
              as: FundAccountant
              captures: { fund_id: $.data.id }
            - call: "POST /share-classes"
              payload: { fund_id: "${fund_id}", class_code: "A", seed_nav_per_share: 10.0000, breakpoint_tiers: [{min_qualifying_amount: 0, load_pct: 0.0575}] }
              as: FundAccountant
              captures: { sc_a: $.data.id }
            - call: "POST /blue-sky-registrations"
              payload: { share_class_id: "${sc_a}", state_code: "CA", registered_amount: 1000000.00, effective_date: "2026-01-01", expiration_date: "2027-01-01" }
              as: ComplianceOfficer
              captures: { bs_ca: $.data.id }
            - call: "POST /shareholder-accounts"
              payload: { registration_type: "INDIVIDUAL", account_channel: "DIRECT", state_code: "CA", tax_id: "323-23-2323", primary_owner_name: "Fred Forward" }
              as: TransferAgentOperator
              captures: { acc_f: $.data.id }
            - call: "POST /shareholder-accounts/${acc_f}/activate"
              payload: { tin_certified: true }
              as: TransferAgentOperator
          trigger:
            - call: "POST /trades"
              payload: { account_id: "${acc_f}", share_class_id: "${sc_a}", trade_type: "PURCHASE", gross_amount: 1000.00 }
              as: TransferAgentOperator
              captures: { t_before: $.data.id }
            - call: "POST /_clock/set_current_utc"
