              payload: { name: "FP10-IN", pixel_pitch_mm: 10.0, rated_brightness_nits: 5000, environmental_rating: "IP43_INDOOR", module_width_mm: 320, module_height_mm: 320, module_pixel_cols: 32, module_pixel_rows: 32, cabinet_width_mm: 320, cabinet_height_mm: 320, modules_per_cabinet: 1, cabinet_weight_kg: 10.24, price_per_sqm_cents: 1000000, dead_pixel_ppm_limit: 976.56, module_dead_pixel_max: 3, module_cluster_max: 1, reference_color_x: 0.3128, reference_color_y: 0.3290, burn_in_hours_required: 24, max_drive_pct: 90 }
              as: PlantAdmin
              as_user_id: "adm-1"
              captures: { dm: $.data.id }
          trigger:
            - call: "POST /projects"
              payload: { customer_name: "Starved Link Wall", install_environment: "RETAIL", site_region_code: "NA-W", display_model_id: "${dm}", cabinet_grid_cols: 1, cabinet_grid_rows: 1, min_viewing_distance_m: 10.0, target_brightness_nits: 5000, redundancy_mode: "NONE", output_port_count: 1, port_bandwidth_mbps: 1, color_depth_bits: 10, refresh_rate_hz: 60, player_count: 1 }
              as: DesignEngineer
              as_user_id: "eng-1"
              captures: { err: $.data.error_id }
            - call: "POST /projects"
              payload: { customer_name: "Exactly Saturated Wall", install_environment: "RETAIL", site_region_code: "NA-W", display_model_id: "${dm}", cabinet_grid_cols: 1, cabinet_grid_rows: 1, min_viewing_distance_m: 10.0, target_brightness_nits: 5000, redundancy_mode: "NONE", output_port_count: 1, port_bandwidth_mbps: 2, color_depth_bits: 10, refresh_rate_hz: 60, player_count: 1 }
