              as_user_id: "${cand_a}"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_DUPLICATE_CONDUCT_STATEMENT"
            - "GET /charter/candidates/${cand_a} shows conduct_statements with exactly 1 entry — the duplicate was rejected atomically"

      - name: c_checkin_on_wrong_date_rejected
        claim_type: Violation → Error
        grounds:
          - errors.ERR_CHECKIN_NOT_ON_EXAM_DATE
          - state_machines.ExamAppointment.SCHEDULED_to_CHECKED_IN
        distinguishing_aspect: "Check-in is pinned to the exam's calendar date: at clock 2027-03-04 for a 2027-03-03 exam the transition is 422 ERR_CHECKIN_NOT_ON_EXAM_DATE and the appointment stays SCHEDULED."
        test_recipe:
          setup:
