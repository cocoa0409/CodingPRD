        claim_type: correct_result
        grounds:
          - "calculations.surrender_charge_schedule"
        distinguishing_aspect: "Inclusive anniversary arithmetic: a contract issued 2021-08-01 has completed EXACTLY 5 years at 2026-08-01, so the year-6 band (200 bps) already applies on the anniversary date itself."
