              as_user_id: "${op_id}"
            - call: "POST /cafo/inspections/${in2_id}/close"
              payload: {}
              as: StateReviewer
              as_user_id: "reviewer-1"
              captures: { e_sod2: $.data.error_id }
            - call: "POST /cafo/inspections/${in2_id}/close"
              payload: {}
              as: StateReviewer
              as_user_id: "reviewer-2"
              captures: { in2_state: $.data.inspection_status }
          assert:
            - "${insp2_inspector} == reviewer-1, because conduct stamps inspector_user_id from X-User-ID rather than from the request body"
            - "${e_sod1} == ERR_SEGREGATION_OF_DUTIES with status 403 on the zero-findings CONDUCTED -> CLOSED path, and Inspection.${in1_id}.inspection_status is still CONDUCTED with closed_by_user_id null"
            - "${in1_state} == CLOSED with closed_by_user_id == admin-1, proving ComplianceAdmin shares the close operation"
            - "${due_on} == 2026-08-31T00:00:00Z, i.e. conducted_on 2026-08-01T00:00:00Z plus RESPONSE_DAYS 30"
            - "after issue-nov Operation.${op_id}.open_finding_count == 1 and compliance_posture == RESTRICTED, and Permit.${pm_id}.compliance_status == NOTICE_ISSUED"
            - "after submit-response Permit.${pm_id}.compliance_status == CORRECTIVE_ACTION while coverage_status stays COVERED, because the two dimensions advance independently"
            - "${e_sod2} == ERR_SEGREGATION_OF_DUTIES with status 403 on the RESPONSE_SUBMITTED -> CLOSED path, and Inspection.${in2_id}.inspection_status is still RESPONSE_SUBMITTED"
            - "${in2_state} == CLOSED with closed_by_user_id == reviewer-2, Operation.${op_id}.open_finding_count == 0, compliance_posture == OPEN and Permit.${pm_id}.compliance_status back to IN_GOOD_STANDING"

  - section: cross_cutting_complexity_layers
    instances:
      - name: stale_operation_version_is_rejected_on_plan_create
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.plan-create-stale-operation
          - errors.ERR_STALE_OPERATION_VERSION
          - endpoints.POST /cafo/nutrient-plans
          - endpoints.PATCH /cafo/operations/{id}
        distinguishing_aspect: |
          The only OCC-guarded write in the domain is plan creation, and the guard is on the
          Operation the plan is filed against, not on the plan itself. A herd-size PATCH between the
          read and the write must invalidate the stale token, the retry with the observed version
          must succeed, and the successful create must itself bump Operation.version — so the same
          token can never be replayed twice.
        test_recipe:
          setup:
            - "Willow Creek Dairy with a COVERED general permit and no plan yet, the operation read once so the client holds its version"
          setup_api_calls:
            - call: "POST /cafo/operations"
              payload: { name: "Willow Creek Dairy", county: "Linn", animal_type: "DAIRY_COW", head_count: 300, manure_handling: "LIQUID", open_lot_area_sqft: 40000, discharge_potential: "CONTINUOUS", has_conservation_plan: true }
              as: ComplianceAdmin
              as_user_id: "admin-1"
              captures: { op_id: $.data.id }
            - call: "POST /cafo/permits"
              payload: { operation_id: "${op_id}", permit_type: "GENERAL", effective_on: "2026-01-01T00:00:00Z" }
              as: Operator
              as_user_id: "${op_id}"
              captures: { pm_id: $.data.id }
            - call: "POST /cafo/permits/${pm_id}/submit"
              payload: {}
              as: Operator
              as_user_id: "${op_id}"
            - call: "POST /cafo/permits/${pm_id}/issue-coverage"
              payload: {}
              as: StateReviewer
              as_user_id: "reviewer-1"
            - call: "GET /cafo/operations/${op_id}"
              payload: {}
              as: CertifiedPlanner
              as_user_id: "planner-1"
              captures: { v0: $.data.version }
          trigger:
            - call: "PATCH /cafo/operations/${op_id}"
              payload: { head_count: 310 }
              as: Operator
              as_user_id: "${op_id}"
              captures: { v1: $.data.version, au1: $.data.animal_units, daily1: $.data.daily_production_gallons }
            - call: "POST /cafo/nutrient-plans"
              payload: { operation_id: "${op_id}", permit_id: "${pm_id}", plan_year: 2026, allowed_application_methods: ["INJECTION"], winter_application_allowed: false, expected_operation_version: "${v0}" }
              as: CertifiedPlanner
              as_user_id: "planner-1"
              captures: { e_stale: $.data.error_id }
            - call: "POST /cafo/nutrient-plans"
              payload: { operation_id: "${op_id}", permit_id: "${pm_id}", plan_year: 2026, allowed_application_methods: ["INJECTION"], winter_application_allowed: false, expected_operation_version: "${v1}" }
              as: CertifiedPlanner
              as_user_id: "planner-1"
              captures: { pl_id: $.data.id }
            - call: "GET /cafo/operations/${op_id}"
              payload: {}
              as: CertifiedPlanner
              as_user_id: "planner-1"
              captures: { v2: $.data.version }
            - call: "GET /cafo/nutrient-plans"
              payload: { operation_id: "${op_id}" }
              as: StateReviewer
              as_user_id: "reviewer-1"
              captures: { first_plan: "$.data[0].id" }
          assert:
            - "${v1} == ${v0} + 1, because PATCH /cafo/operations/{id} increments Operation.version by 1"
            - "${au1} == 434.00 and ${daily1} == 9528.21, from 310 head at the DAIRY_COW factor 1.4 and a design annual of 3477798.00 gallons divided by 365"
            - "${e_stale} == ERR_STALE_OPERATION_VERSION with status 412, and the operation's version is not consumed or changed by the rejected attempt"
            - "the third call returns 201 with NutrientManagementPlan.${pl_id}.plan_status == DRAFT and revision_count == 0"
            - "${v2} == ${v1} + 1, because a successful plan create also increments Operation.version, so ${v1} is now itself stale"
            - "the list returns exactly one row with ${first_plan} == ${pl_id}, proving the 412 attempt persisted nothing"
      - name: freeboard_and_overflow_thresholds_fire_at_their_exact_boundaries
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.storage_capacity_and_freeboard
          - calculations.storage_days_of_capacity
          - state_machines.ManureStorage.IN_SERVICE->FREEBOARD_ALERT
          - state_machines.ManureStorage.IN_SERVICE->OVERFLOW_IMMINENT
          - state_machines.ManureStorage.FREEBOARD_ALERT->IN_SERVICE
          - entities.StorageInspection.fields.alert_raised
        distinguishing_aspect: |
          Three thresholds sit on one measurement: the instantaneous deficit threshold at exactly
          required_freeboard_in, the overflow threshold at exactly OVERFLOW_FREEBOARD_IN, and the
          non-NORMAL visual condition that raises alert_raised without meeting the deficit
          precondition for a FREEBOARD_ALERT transition. Each inspection also re-derives
          precipitation_adjustment_gallons from the measurement, so the volume balance stays exact
          while available capacity swings negative and the day count clamps at zero. The reset arm
          then proves return-to-service needs the latest inspection to be clean on both dimensions.
        test_recipe:
          setup:
            - "Willow Creek Dairy with a COVERED permit and one 60000 sqft lagoon 144 in deep with 24 in of required freeboard, holding 1000000 gallons of intake"
          setup_api_calls:
            - call: "POST /cafo/operations"
              payload: { name: "Willow Creek Dairy", county: "Linn", animal_type: "DAIRY_COW", head_count: 300, manure_handling: "LIQUID", open_lot_area_sqft: 40000, discharge_potential: "CONTINUOUS", has_conservation_plan: true }
              as: ComplianceAdmin
              as_user_id: "admin-1"
              captures: { op_id: $.data.id }
            - call: "POST /cafo/manure-storages"
              payload: { operation_id: "${op_id}", structure_name: "Lagoon 1", structure_type: "EARTHEN_LAGOON", surface_area_sqft: 60000, total_depth_in: 144, required_freeboard_in: 24 }
              as: Operator
              as_user_id: "${op_id}"
              captures: { st_id: $.data.id }
            - call: "POST /cafo/permits"
              payload: { operation_id: "${op_id}", permit_type: "GENERAL", effective_on: "2026-01-01T00:00:00Z" }
              as: Operator
              as_user_id: "${op_id}"
              captures: { pm_id: $.data.id }
            - call: "POST /cafo/permits/${pm_id}/submit"
              payload: {}
              as: Operator
              as_user_id: "${op_id}"
            - call: "POST /cafo/permits/${pm_id}/issue-coverage"
              payload: {}
              as: StateReviewer
              as_user_id: "reviewer-1"
            - call: "POST /cafo/manure-storages/${st_id}/intake"
              payload: { gallons: 1000000 }
              as: Operator
              as_user_id: "${op_id}"
          trigger:
            - call: "POST /cafo/storage-inspections"
              payload: { storage_id: "${st_id}", inspected_on: "2026-07-05T00:00:00Z", inspector_name: "R. Halverson", measured_freeboard_in: 24, visual_condition: "NORMAL" }
              as: Operator
              as_user_id: "${op_id}"
              captures: { al1: $.data.alert_raised, vol1: $.data.measured_volume_gallons }
            - call: "POST /cafo/storage-inspections"
              payload: { storage_id: "${st_id}", inspected_on: "2026-07-12T00:00:00Z", inspector_name: "R. Halverson", measured_freeboard_in: 23, visual_condition: "NORMAL" }
              as: Operator
              as_user_id: "${op_id}"
              captures: { al2: $.data.alert_raised, def2: $.data.freeboard_deficit_in }
            - call: "POST /cafo/storage-inspections"
              payload: { storage_id: "${st_id}", inspected_on: "2026-07-19T00:00:00Z", inspector_name: "R. Halverson", measured_freeboard_in: 30, visual_condition: "SEEPAGE" }
              as: Operator
              as_user_id: "${op_id}"
              captures: { al3: $.data.alert_raised, def3: $.data.freeboard_deficit_in }
            - call: "POST /cafo/manure-storages/${st_id}/return-to-service"
              payload: {}
              as: Operator
              as_user_id: "${op_id}"
              captures: { e_rts: $.data.error_id }
            - call: "POST /cafo/storage-inspections"
              payload: { storage_id: "${st_id}", inspected_on: "2026-07-26T00:00:00Z", inspector_name: "R. Halverson", measured_freeboard_in: 30, visual_condition: "NORMAL" }
              as: ComplianceAdmin
              as_user_id: "admin-1"
              captures: { al4: $.data.alert_raised }
            - call: "POST /cafo/manure-storages/${st_id}/return-to-service"
              payload: {}
              as: Operator
              as_user_id: "${op_id}"
              captures: { st_state: $.data.storage_status }
            - call: "POST /cafo/storage-inspections"
              payload: { storage_id: "${st_id}", inspected_on: "2026-07-31T00:00:00Z", inspector_name: "R. Halverson", measured_freeboard_in: 6, visual_condition: "NORMAL" }
              as: Operator
              as_user_id: "${op_id}"
              captures: { def5: $.data.freeboard_deficit_in }
          assert:
            - "the structure's design_capacity_gallons == 5385960.00, freeboard_reserve_gallons == 897660.00 and operating_capacity_gallons == 4488300.00"
            - "${al1} == false with freeboard_deficit_in == 0.00 and ${vol1} == 4488300.00, so a measurement exactly at required_freeboard_in is not a deficit and ManureStorage.${st_id}.storage_status stays IN_SERVICE"
            - "after the first inspection ManureStorage.${st_id}.precipitation_adjustment_gallons == 3488300.00, current_volume_gallons == 4488300.00, available_capacity_gallons == 0.00 and days_of_storage_available == 0"
            - "${al2} == true with ${def2} == 1.00, ManureStorage.${st_id}.storage_status == FREEBOARD_ALERT, measured_volume_gallons == 4525702.50, current_volume_gallons == 4525702.50, available_capacity_gallons == -37402.50 and days_of_storage_available == 0 because the day count is clamped at zero"
            - "Operation.${op_id}.compliance_posture == RESTRICTED after the second inspection, cascaded from the structure status"
            - "${al3} == true even though ${def3} == 0.00, because alert_raised is a disjunction, yet storage_status is still FREEBOARD_ALERT rather than moving anywhere new since the IN_SERVICE -> FREEBOARD_ALERT transition needs a positive deficit"
            - "after the third inspection current_volume_gallons == 4263885.00, available_capacity_gallons == 224415.00 and days_of_storage_available == 24, from 224415.00 divided by the 9244.65 gallon summer daily rate and floored"
            - "${e_rts} == ERR_STORAGE_STATE_INVALID with status 409, because the latest inspection still shows visual_condition == SEEPAGE"
            - "${al4} == false and the following return-to-service returns 200 with ${st_state} == IN_SERVICE and Operation.${op_id}.compliance_posture back to OPEN, so the trigger resets"
            - "${def5} == 18.00 and ManureStorage.${st_id}.storage_status == OVERFLOW_IMMINENT rather than FREEBOARD_ALERT, because a measurement of exactly OVERFLOW_FREEBOARD_IN 6 satisfies the <= arm, and Operation.${op_id}.compliance_posture becomes SUSPENDED"
      - name: nov_cascade_reaches_permit_plan_and_transfers_in_one_request
        claim_type: cascading_side_effects
        grounds:
          - calculations.operation_compliance_posture
          - state_machines.Inspection.CONDUCTED->NOV_ISSUED
          - state_machines.ManureTransfer.INITIATED->SUSPENDED
        excluded_because:
          difficulty_instance: nov_cascades_to_permit_notice_posture_and_transfer_suspension
          rationale: "That §1.8 instance issues one notice of violation and asserts every hop of the chain - permit compliance dimension, open_finding_count, posture, plan revision and transfer suspension with its commitment release - which is the full N-level end-to-end claim for this layer."
      - name: both_production_and_storage_variants_diverge_on_one_fixture
        claim_type: dual_variant_calculation
        grounds:
          - calculations.operation_manure_production
          - calculations.storage_days_of_capacity
        excluded_because:
          difficulty_instance: operation_production_design_vs_records_basis
          rationale: "That §1.8 instance holds one operation's records against its design basis and asserts both variant outputs plus the signed variance between them, and its sibling instance does the same for the storage day bases, so the divergence and delta claims for this layer are already covered."

  - section: consistency_model
    instances:
      - name: every_write_is_visible_in_its_own_response_and_the_next_read
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints.POST /cafo/application-events
          - calculations.operation_manure_production
          - calculations.storage_capacity_and_freeboard
        distinguishing_aspect: |
          A single application event fans out to four entities - its own computed nutrient columns,
          the budget ledger, the structure volume balance and the operation's records-basis total -
          and the model is immediate, so the response body of that one POST already carries its own
          derived columns and every follow-up read reflects the fan-out with no second call, no
          refresh endpoint and no lag.
        test_recipe:
          setup:
            - "Canonical Willow Creek Dairy operation with a COVERED permit, an APPROVED 2026 plan, one ACTIVE budget of 414396 gallons and a lagoon holding 1000000 gallons"
          setup_api_calls:
            - call: "POST /cafo/operations"
              payload: { name: "Willow Creek Dairy", county: "Linn", animal_type: "DAIRY_COW", head_count: 300, manure_handling: "LIQUID", open_lot_area_sqft: 40000, discharge_potential: "CONTINUOUS", has_conservation_plan: true }
              as: ComplianceAdmin
              as_user_id: "admin-1"
              captures: { op_id: $.data.id }
            - call: "POST /cafo/manure-storages"
              payload: { operation_id: "${op_id}", structure_name: "Lagoon 1", structure_type: "EARTHEN_LAGOON", surface_area_sqft: 60000, total_depth_in: 144, required_freeboard_in: 24 }
              as: Operator
              as_user_id: "${op_id}"
              captures: { st_id: $.data.id }
            - call: "POST /cafo/permits"
              payload: { operation_id: "${op_id}", permit_type: "GENERAL", effective_on: "2026-01-01T00:00:00Z" }
              as: Operator
              as_user_id: "${op_id}"
              captures: { pm_id: $.data.id }
            - call: "POST /cafo/permits/${pm_id}/submit"
              payload: {}
              as: Operator
              as_user_id: "${op_id}"
            - call: "POST /cafo/permits/${pm_id}/issue-coverage"
              payload: {}
              as: StateReviewer
              as_user_id: "reviewer-1"
            - call: "POST /cafo/fields"
              payload: { operation_id: "${op_id}", field_name: "North 40", total_acres: 42.5, distance_to_water_ft: 150, has_tile_inlet: false, slope_pct: 4.0, water_frontage_ft: 900 }
              as: CertifiedPlanner
              as_user_id: "planner-1"
