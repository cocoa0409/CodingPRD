              payload: { record_id: "${rec_id}", protocol: "OBD2_CAN", dtc_count: 0, readiness_monitors_incomplete: 0, mil_on: false }
              as: Inspector
            - call: "POST /inspection-records/${rec_id}/decide"
              payload: {}
              as: Inspector
              captures: { rec_v: $.data.version, rec_status: $.data.status }
          trigger:
            - call: "POST /certificates"
              payload: { record_id: "${rec_id}", expected_record_version: "${rec_v}" }
              as: StationManager
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_RECORD_NOT_PASSED"

  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: lane_appointment_buffer_adjacency_overlap
        grounds:
          - validations[priority=8]
          - errors[ERR_LANE_TIME_CONFLICT]
          - entities.Lane.fields.turnaround_buffer_minutes
          - entities.Appointment.fields.scheduled_start
          - entities.Appointment.fields.scheduled_end
        distinguishing_aspect: >-
          SINGLE-OCCUPANT BUFFER-ADJACENCY semantics on Lane: an existing [09:00,09:30) appointment on a
          lane with 15-min buffer occupies [09:00,09:45); a new [09:30,10:00) overlaps that occupied
          interval and is rejected with ERR_LANE_TIME_CONFLICT (buffer extends the existing slot's tail).
        test_recipe:
          setup:
            - "Lane with turnaround_buffer_minutes=15; one BOOKED appointment [09:00,09:30)."
          setup_api_calls:
            - call: "POST /stations"
              payload: { name: "LA Station", state_code: "LA", certificate_serial_prefix: "LA-", repair_cost_limit_cents: 60000, analyzer_count: 1 }
              as: StationManager
              captures: { st_id: $.data.id }
            - call: "POST /vehicle-class-profiles"
              payload: { station_id: "${st_id}", vehicle_class: "PASSENGER", base_fee_cents: 2500, obd_required: true, checklist_item_count: 2, reinspection_window_days: 30 }
              as: StationManager
            - call: "POST /lanes"
              payload: { station_id: "${st_id}", lane_number: 1, supports_obd: true, turnaround_buffer_minutes: 15 }
              as: StationManager
              captures: { lane_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T08:00:00Z" }
              as: StationManager
            - call: "POST /appointments"
              payload: { lane_id: "${lane_id}", vehicle_vin: "1HGCM82633A004352", vehicle_class: "PASSENGER", kind: "APPOINTMENT", scheduled_start: "2026-06-10T09:00:00Z", scheduled_end: "2026-06-10T09:30:00Z" }
              as: Receptionist
              captures: { appt1_id: $.data.id }
          trigger:
            - call: "POST /appointments"
              payload: { lane_id: "${lane_id}", vehicle_vin: "2HGCM82633A004353", vehicle_class: "PASSENGER", kind: "APPOINTMENT", scheduled_start: "2026-06-10T09:30:00Z", scheduled_end: "2026-06-10T10:00:00Z" }
              as: Receptionist
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_LANE_TIME_CONFLICT"

      - name: analyzer_aggregate_capacity_overlap
        grounds:
          - validations[priority=9]
          - errors[ERR_ANALYZER_CAPACITY]
          - entities.Station.fields.analyzer_count
          - entities.AnalyzerReservation.fields.window_start
          - entities.AnalyzerReservation.fields.window_end
        distinguishing_aspect: >-
          AGGREGATE-CAPACITY semantics on a DIFFERENT resource (Station analyzer pool, analyzer_count=1):
          a second HELD reservation [10:30,11:30) strictly overlapping [10:00,11:00) pushes concurrency to
          2 > 1 and is rejected with ERR_ANALYZER_CAPACITY — count-based, no buffer, touching allowed.
        test_recipe:
          setup:
            - "Station with analyzer_count=1 and one HELD reservation [10:00,11:00)."
          setup_api_calls:
            - call: "POST /stations"
              payload: { name: "AN Station", state_code: "AN", certificate_serial_prefix: "AN-", repair_cost_limit_cents: 60000, analyzer_count: 1 }
              as: StationManager
              captures: { st_id: $.data.id }
            - call: "POST /analyzer-reservations"
              payload: { station_id: "${st_id}", vehicle_vin: "1HGCM82633A004352", window_start: "2026-06-10T10:00:00Z", window_end: "2026-06-10T11:00:00Z" }
              as: Receptionist
              captures: { ar1_id: $.data.id }
          trigger:
            - call: "POST /analyzer-reservations"
              payload: { station_id: "${st_id}", vehicle_vin: "2HGCM82633A004353", window_start: "2026-06-10T10:30:00Z", window_end: "2026-06-10T11:30:00Z" }
              as: Receptionist
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_ANALYZER_CAPACITY"

  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: certificate_issue_then_void_conserves_active_cert_count
        grounds:
          - state_machines.Certificate.ACTIVE_to_VOID
          - entities.Certificate.fields.status
          - endpoints.POST /certificates
          - endpoints.POST /certificates/{id}/void
        distinguishing_aspect: >-
          CONSERVED QUANTITY = count of ACTIVE Certificates for the record. Forward issue (+1 ACTIVE)
          paired with compensating void (-1 ACTIVE) leaves the count at 0, exactly its pre-issuance value:
          count(Certificate WHERE record_id==rec AND status==ACTIVE) == 0 before and after.
        test_recipe:
          setup:
            - "A PASSED PASSENGER+OBD record with no certificate yet."
          setup_api_calls:
            - call: "POST /stations"
              payload: { name: "CI Station", state_code: "CI", certificate_serial_prefix: "CI-", repair_cost_limit_cents: 60000, analyzer_count: 1 }
              as: StationManager
              captures: { st_id: $.data.id }
            - call: "POST /vehicle-class-profiles"
              payload: { station_id: "${st_id}", vehicle_class: "PASSENGER", base_fee_cents: 2500, obd_required: true, checklist_item_count: 2, reinspection_window_days: 30 }
              as: StationManager
            - call: "POST /lanes"
              payload: { station_id: "${st_id}", lane_number: 1, supports_obd: true, turnaround_buffer_minutes: 0 }
              as: StationManager
              captures: { lane_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T09:00:00Z" }
              as: StationManager
            - call: "POST /appointments"
              payload: { lane_id: "${lane_id}", vehicle_vin: "1HGCM82633A004352", vehicle_class: "PASSENGER", kind: "WALK_IN", scheduled_start: "2026-06-10T09:00:00Z", scheduled_end: "2026-06-10T09:30:00Z" }
              as: Receptionist
              captures: { appt_id: $.data.id }
            - call: "POST /appointments/${appt_id}/check-in"
              payload: {}
              as: Receptionist
            - call: "POST /inspection-records"
              payload: { appointment_id: "${appt_id}" }
              as: Inspector
              captures: { rec_id: $.data.id }
            - call: "POST /checklist-results"
              payload: { record_id: "${rec_id}", item_code: "BRAKES", outcome: "PASS" }
              as: Inspector
            - call: "POST /checklist-results"
              payload: { record_id: "${rec_id}", item_code: "LIGHTS", outcome: "PASS" }
              as: Inspector
            - call: "POST /emissions-tests"
              payload: { record_id: "${rec_id}", protocol: "OBD2_CAN", dtc_count: 0, readiness_monitors_incomplete: 0, mil_on: false }
              as: Inspector
            - call: "POST /inspection-records/${rec_id}/decide"
              payload: {}
              as: Inspector
              captures: { rec_v: $.data.version }
            - call: "POST /certificates"
              payload: { record_id: "${rec_id}", expected_record_version: "${rec_v}" }
              as: StationManager
              captures: { cert_id: $.data.id, cert_status_active: $.data.status }
          trigger:
            - call: "POST /certificates/${cert_id}/void"
              payload: {}
              as: StationManager
              captures: { cert_status_void: $.data.status }
            - call: "GET /certificates"
              payload: {}
              as: StationManager
          assert:
            - "Certificate.${cert_id}.status == VOID"
            - "count(GET /certificates?record_id=${rec_id} WHERE status==ACTIVE) == 0"

      - name: batch_line_attach_then_detach_conserves_total_fee
        grounds:
          - calculations.compute_batch_totals
          - endpoints.POST /state-report-batches/{id}/lines
          - endpoints.DELETE /state-report-batches/{id}/lines/{record_id}
          - entities.StateReportBatch.fields.total_reported_fee_cents
        distinguishing_aspect: >-
          CONSERVED QUANTITY = StateReportBatch.total_reported_fee_cents (a fee total, a different quantity
          than instance #1's cert count). Attaching a 3700-fee line (+3700) then detaching it (-3700)
          returns total_reported_fee_cents to its starting value 0 and line_count to 0.
        test_recipe:
          setup:
            - "A PASSED PASSENGER+OBD record (fee 3700) and a fresh OPEN batch at station CB."
          setup_api_calls:
            - call: "POST /stations"
              payload: { name: "CB Station", state_code: "CB", certificate_serial_prefix: "CB-", repair_cost_limit_cents: 60000, analyzer_count: 1 }
              as: StationManager
              captures: { st_id: $.data.id }
            - call: "POST /vehicle-class-profiles"
              payload: { station_id: "${st_id}", vehicle_class: "PASSENGER", base_fee_cents: 2500, obd_required: true, checklist_item_count: 2, reinspection_window_days: 30 }
              as: StationManager
            - call: "POST /lanes"
              payload: { station_id: "${st_id}", lane_number: 1, supports_obd: true, turnaround_buffer_minutes: 0 }
              as: StationManager
              captures: { lane_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T09:00:00Z" }
              as: StationManager
            - call: "POST /appointments"
              payload: { lane_id: "${lane_id}", vehicle_vin: "1HGCM82633A004352", vehicle_class: "PASSENGER", kind: "WALK_IN", scheduled_start: "2026-06-10T09:00:00Z", scheduled_end: "2026-06-10T09:30:00Z" }
              as: Receptionist
              captures: { appt_id: $.data.id }
            - call: "POST /appointments/${appt_id}/check-in"
              payload: {}
              as: Receptionist
            - call: "POST /inspection-records"
              payload: { appointment_id: "${appt_id}" }
              as: Inspector
              captures: { rec_id: $.data.id }
            - call: "POST /checklist-results"
              payload: { record_id: "${rec_id}", item_code: "BRAKES", outcome: "PASS" }
              as: Inspector
            - call: "POST /checklist-results"
              payload: { record_id: "${rec_id}", item_code: "LIGHTS", outcome: "PASS" }
              as: Inspector
            - call: "POST /emissions-tests"
              payload: { record_id: "${rec_id}", protocol: "OBD2_CAN", dtc_count: 0, readiness_monitors_incomplete: 0, mil_on: false }
              as: Inspector
            - call: "POST /inspection-records/${rec_id}/decide"
              payload: {}
              as: Inspector
            - call: "POST /state-report-batches"
              payload: { station_id: "${st_id}", period_label: "2026-06" }
              as: StationManager
              captures: { batch_id: $.data.id }
            - call: "POST /state-report-batches/${batch_id}/lines"
              payload: { record_id: "${rec_id}" }
              as: StationManager
          trigger:
            - call: "DELETE /state-report-batches/${batch_id}/lines/${rec_id}"
              payload: {}
              as: StationManager
              captures: { total_after: $.data.total_reported_fee_cents, lc_after: $.data.line_count }
          assert:
            - "StateReportBatch.${batch_id}.total_reported_fee_cents == 0"
            - "StateReportBatch.${batch_id}.line_count == 0"
