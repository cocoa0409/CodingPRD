# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# 9 rule_ids x 2 instances = 18 instances. Every setup chain is replayable
# from empty-DB against SCAFFOLD.yaml §1.5.
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: reward_points_award_excludes_fair_overlap_lines
        grounds:
          - calculations.reward_points_base
          - entities.ClassOrder.fields.rewardable_subtotal_cents
          - entities.FlyerOffering.fields.fair_overlap
        distinguishing_aspect: |
          Entity domain: ClassOrder reward economics. The AWARDED variant earns
          floor(rewardable_subtotal_cents/100) where rewardable EXCLUDES
          fair-overlap lines; the rejected fair-inclusive interpretation would
          award floor(subtotal_cents/100) — same data, different points.
        test_recipe:
          setup:
            - "School S1 (NORMAL posture via ACTIVE enrollment, not low-income)"
            - "Teacher T1 at S1, grade_band G3_5"
            - "Two G3_5 PAPERBACK titles: BT1 base 1500, BT2 base 2000, generous royalty caps"
            - "BookFair F1 at S1 covering 2026-10-05..2026-10-09 with FairTitle BT2"
            - "PUBLISHED October cycle C1 with offerings O1 (BT1, 1500) and O2 (BT2, 2000, fair_overlap=true because F1 overlaps October)"
            - "ClassOrder CO1 for T1 on C1 with one line: 1x O1 (rewardable) and one line: 1x O2 (fair-overlap, excluded)"
          setup_api_calls:
            - call: "POST /club/schools"
              payload: { name: "S1", address: "1 Main St", low_income_program: false }
              as: ClubAdmin
              captures: { s1: $.data.id }
            - call: "POST /club/schools/${s1}/enroll-program"
              payload: { enrolled_on: "2026-08-15" }
              as: ClubAdmin
            - call: "POST /club/teachers"
              payload: { school_id: "${s1}", full_name: "T One", email: "t1@x.com", grade_band: "G3_5" }
              as: ClubAdmin
              captures: { t1: $.data.id }
            - call: "POST /club/titles"
              payload: { isbn: "9780000000001", name: "BT1", format: "PAPERBACK", grade_band: "G3_5", base_price_cents: 1500, points_cost: 15, rights_holder: "Pub A", royalty_cap_cents: 100000 }
              as: ClubAdmin
              captures: { bt1: $.data.id }
            - call: "POST /club/titles"
              payload: { isbn: "9780000000002", name: "BT2", format: "PAPERBACK", grade_band: "G3_5", base_price_cents: 2000, points_cost: 20, rights_holder: "Pub A", royalty_cap_cents: 100000 }
              as: ClubAdmin
              captures: { bt2: $.data.id }
            - call: "POST /club/book-fairs"
              payload: { school_id: "${s1}", start_date: "2026-10-05", end_date: "2026-10-09" }
              as: SchoolAdmin
              captures: { f1: $.data.id }
            - call: "POST /club/book-fairs/${f1}/titles"
              payload: { title_id: "${bt2}" }
              as: SchoolAdmin
            - call: "POST /club/flyer-cycles"
              payload: { school_id: "${s1}", month: "2026-10", grade_band: "G3_5" }
              as: ClubAdmin
              captures: { c1: $.data.id }
            - call: "POST /club/flyer-cycles/${c1}/offerings"
              payload: { title_id: "${bt1}" }
              as: ClubAdmin
              captures: { o1: $.data.id }
            - call: "POST /club/flyer-cycles/${c1}/offerings"
              payload: { title_id: "${bt2}" }
              as: ClubAdmin
              captures: { o2: $.data.id }
            - call: "POST /club/flyer-cycles/${c1}/publish"
              payload: {}
              as: ClubAdmin
            - call: "POST /club/class-orders"
              payload: { cycle_id: "${c1}", teacher_id: "${t1}" }
              as: Teacher
              as_user_id: "${t1}"
              captures: { co1: $.data.id }
            - call: "POST /club/class-orders/${co1}/lines"
              payload: { offering_id: "${o1}", student_name: "Stu A", submitted_by: "TEACHER", qty: 1 }
              as: Teacher
              as_user_id: "${t1}"
            - call: "POST /club/class-orders/${co1}/lines"
              payload: { offering_id: "${o2}", student_name: "Stu B", submitted_by: "TEACHER", qty: 1 }
              as: Teacher
              as_user_id: "${t1}"
            - call: "GET /club/class-orders/${co1}"
              payload: {}
              as: Teacher
              as_user_id: "${t1}"
              captures: { co1_v: $.data.version }
          trigger:
            - call: "POST /club/class-orders/${co1}/submit"
              payload: { expected_class_order_version: "${co1_v}" }
              as: Teacher
              as_user_id: "${t1}"
          assert:
            - "ClassOrder.${co1}.subtotal_cents == 3500"
            - "ClassOrder.${co1}.rewardable_subtotal_cents == 1500"
            - "ClassOrder.${co1}.awarded_base_points == 15"
            - "ClassOrder.${co1}.awarded_total_points == 15"
            - "Teacher.${t1}.points_balance == 15 (NOT 35 — the fair-overlap line is excluded)"
      - name: royalty_chronological_accrual_vs_cancellation_reversal
        grounds:
          - calculations.title_royalty_accrue
          - entities.Title.fields.royalty_accrued_cents
          - entities.Title.fields.license_status
        distinguishing_aspect: |
          Entity domain: Title licensing ledger (different domain from ClassOrder
          rewards). Chronological per-unit accrual flips license SUSPENDED on the
          unit that pushes accrued STRICTLY ABOVE cap; the cancellation-reversal
          variant decrements and flips back ACTIVE at exactly <= cap — two
          directions of the same ledger produce different observable states.
        test_recipe:
          setup:
            - "School S2 NORMAL, Teacher T2 G3_5, title RT1 PAPERBACK base 1000, royalty_cap_cents 180, per-unit royalty 90"
            - "PUBLISHED October cycle C2 at S2 with offering RO1 (RT1)"
            - "ClassOrder CO2 with 3x RO1 (3 units => accrued 270 > 180 => license flips SUSPENDED at submit)"
          setup_api_calls:
            - call: "POST /club/schools"
              payload: { name: "S2", address: "2 Oak Ave", low_income_program: false }
              as: ClubAdmin
              captures: { s2: $.data.id }
            - call: "POST /club/schools/${s2}/enroll-program"
              payload: { enrolled_on: "2026-08-15" }
              as: ClubAdmin
            - call: "POST /club/teachers"
              payload: { school_id: "${s2}", full_name: "T Two", email: "t2@x.com", grade_band: "G3_5" }
              as: ClubAdmin
              captures: { t2: $.data.id }
            - call: "POST /club/titles"
              payload: { isbn: "9780000000010", name: "RT1", format: "PAPERBACK", grade_band: "G3_5", base_price_cents: 1000, points_cost: 10, rights_holder: "Pub B", royalty_cap_cents: 180 }
              as: ClubAdmin
              captures: { rt1: $.data.id }
            - call: "POST /club/flyer-cycles"
              payload: { school_id: "${s2}", month: "2026-10", grade_band: "G3_5" }
              as: ClubAdmin
              captures: { c2: $.data.id }
            - call: "POST /club/flyer-cycles/${c2}/offerings"
              payload: { title_id: "${rt1}" }
              as: ClubAdmin
              captures: { ro1: $.data.id }
            - call: "POST /club/flyer-cycles/${c2}/publish"
              payload: {}
              as: ClubAdmin
            - call: "POST /club/class-orders"
              payload: { cycle_id: "${c2}", teacher_id: "${t2}" }
              as: Teacher
              as_user_id: "${t2}"
              captures: { co2: $.data.id }
            - call: "POST /club/class-orders/${co2}/lines"
              payload: { offering_id: "${ro1}", student_name: "Stu C", submitted_by: "TEACHER", qty: 3 }
              as: Teacher
              as_user_id: "${t2}"
            - call: "GET /club/class-orders/${co2}"
              payload: {}
              as: Teacher
              as_user_id: "${t2}"
              captures: { co2_v: $.data.version }
          trigger:
            - call: "POST /club/class-orders/${co2}/submit"
              payload: { expected_class_order_version: "${co2_v}" }
              as: Teacher
              as_user_id: "${t2}"
            - call: "POST /club/class-orders/${co2}/cancel"
              payload: {}
              as: Teacher
              as_user_id: "${t2}"
          assert:
            - "After submit: Title.${rt1}.royalty_accrued_cents == 270 and Title.license_status == SUSPENDED (270 > 180)"
            - "After cancel: Title.${rt1}.royalty_accrued_cents == 0 and Title.license_status == ACTIVE (0 <= 180)"
            - "ClassOrder.${co2}.points_status == CLAWED_BACK and Teacher.${t2}.points_balance == 0"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: tier_discount_whole_subtotal_single_rounding
        grounds:
          - calculations.tier_discount_band
          - entities.ClassOrder.fields.discount_cents
        distinguishing_aspect: |
          Mode (b) nested rounding: discount is computed on the WHOLE subtotal
          and rounded once half-up (6300 * 500bp = 315 exactly); the forbidden
          per-line-then-sum variant yields a different cent total on other
          inputs, and the scaffold pins whole-subtotal rounding explicitly.
        test_recipe:
          setup:
            - "School S3 NORMAL, Teacher T3 G3_5"
            - "Title CLP1 CLUB_PAPERBACK base 1000 (flyer price floor(1000*70/100)=700), title PB1 PAPERBACK base 2100"
            - "PUBLISHED October cycle C3 with offerings OC1 (CLP1 @700) and OC2 (PB1 @2100)"
            - "ClassOrder CO3 with lines 3x OC1 and 2x OC2 (subtotal 6300)"
          setup_api_calls:
            - call: "POST /club/schools"
              payload: { name: "S3", address: "3 Pine Rd", low_income_program: false }
              as: ClubAdmin
              captures: { s3: $.data.id }
            - call: "POST /club/schools/${s3}/enroll-program"
              payload: { enrolled_on: "2026-08-15" }
              as: ClubAdmin
            - call: "POST /club/teachers"
              payload: { school_id: "${s3}", full_name: "T Three", email: "t3@x.com", grade_band: "G3_5" }
              as: ClubAdmin
              captures: { t3: $.data.id }
            - call: "POST /club/titles"
              payload: { isbn: "9780000000020", name: "CLP1", format: "CLUB_PAPERBACK", grade_band: "G3_5", base_price_cents: 1000, points_cost: 7, rights_holder: "Pub C", royalty_cap_cents: 100000 }
              as: ClubAdmin
              captures: { clp1: $.data.id }
            - call: "POST /club/titles"
              payload: { isbn: "9780000000021", name: "PB1", format: "PAPERBACK", grade_band: "G3_5", base_price_cents: 2100, points_cost: 21, rights_holder: "Pub C", royalty_cap_cents: 100000 }
              as: ClubAdmin
              captures: { pb1: $.data.id }
            - call: "POST /club/flyer-cycles"
              payload: { school_id: "${s3}", month: "2026-10", grade_band: "G3_5" }
              as: ClubAdmin
              captures: { c3: $.data.id }
            - call: "POST /club/flyer-cycles/${c3}/offerings"
              payload: { title_id: "${clp1}" }
              as: ClubAdmin
              captures: { oc1: $.data.id }
            - call: "POST /club/flyer-cycles/${c3}/offerings"
              payload: { title_id: "${pb1}" }
              as: ClubAdmin
              captures: { oc2: $.data.id }
            - call: "POST /club/flyer-cycles/${c3}/publish"
              payload: {}
              as: ClubAdmin
            - call: "POST /club/class-orders"
              payload: { cycle_id: "${c3}", teacher_id: "${t3}" }
              as: Teacher
              as_user_id: "${t3}"
              captures: { co3: $.data.id }
            - call: "POST /club/class-orders/${co3}/lines"
              payload: { offering_id: "${oc1}", student_name: "Stu D", submitted_by: "TEACHER", qty: 3 }
              as: Teacher
              as_user_id: "${t3}"
            - call: "POST /club/class-orders/${co3}/lines"
              payload: { offering_id: "${oc2}", student_name: "Stu E", submitted_by: "TEACHER", qty: 2 }
              as: Teacher
              as_user_id: "${t3}"
          trigger:
            - call: "GET /club/class-orders/${co3}"
              payload: {}
              as: Teacher
              as_user_id: "${t3}"
          assert:
            - "ClassOrder.${co3}.subtotal_cents == 6300 (tier 1 applies: 6300 >= 5000, < 15000)"
            - "ClassOrder.${co3}.discount_cents == 315 (round_half_up(6300*500/10000), rounded ONCE on the aggregate)"
            - "ClassOrder.${co3}.net_total_cents == 5985"
            - "ClassOrder.${co3}.shipping_fee_cents == 0 (rewardable 6300 >= 2500)"
      - name: reward_points_promo_multiplier_plus_stacked_incentives
        grounds:
          - calculations.reward_points_base
          - entities.Promotion.fields.multiplier_bp
          - entities.Promotion.fields.bonus_points_per_unit
        distinguishing_aspect: |
          Mode (a) combinatorial formula: >=3 inputs (rewardable base, best
          BONUS_POINTS multiplier, two STACKING TITLE_INCENTIVE promos on the
          same title) with non-linear interaction — multiplier applies to base
          only, incentives are per-unit and additive, evaluation order pinned.
        test_recipe:
          setup:
            - "School S4 NORMAL, Teacher T4 G3_5"
            - "Title INCT PAPERBACK base 1500 (points_cost 15)"
            - "ACTIVE promotions for October: PM2X BONUS_POINTS multiplier_bp 200 (all bands); PI1 TITLE_INCENTIVE on INCT +3/unit; PI2 TITLE_INCENTIVE on INCT +2/unit (incentives stack)"
            - "PUBLISHED October cycle C4 with offering OI1 (INCT @1500)"
            - "ClassOrder CO4 with line 2x OI1 (rewardable 3000)"
          setup_api_calls:
            - call: "POST /club/schools"
              payload: { name: "S4", address: "4 Elm St", low_income_program: false }
              as: ClubAdmin
              captures: { s4: $.data.id }
            - call: "POST /club/schools/${s4}/enroll-program"
              payload: { enrolled_on: "2026-08-15" }
              as: ClubAdmin
            - call: "POST /club/teachers"
              payload: { school_id: "${s4}", full_name: "T Four", email: "t4@x.com", grade_band: "G3_5" }
              as: ClubAdmin
              captures: { t4: $.data.id }
            - call: "POST /club/titles"
              payload: { isbn: "9780000000030", name: "INCT", format: "PAPERBACK", grade_band: "G3_5", base_price_cents: 1500, points_cost: 15, rights_holder: "Pub D", royalty_cap_cents: 100000 }
              as: ClubAdmin
              captures: { inct: $.data.id }
            - call: "POST /club/promotions"
              payload: { name: "Double October", kind: "BONUS_POINTS", multiplier_bp: 200, starts_on: "2026-10-01", ends_on: "2026-11-01" }
              as: ClubAdmin
            - call: "POST /club/promotions"
              payload: { name: "INCT +3", kind: "TITLE_INCENTIVE", title_id: "${inct}", bonus_points_per_unit: 3, starts_on: "2026-10-01", ends_on: "2026-11-01" }
              as: ClubAdmin
            - call: "POST /club/promotions"
              payload: { name: "INCT +2", kind: "TITLE_INCENTIVE", title_id: "${inct}", bonus_points_per_unit: 2, starts_on: "2026-10-01", ends_on: "2026-11-01" }
              as: ClubAdmin
            - call: "POST /club/flyer-cycles"
              payload: { school_id: "${s4}", month: "2026-10", grade_band: "G3_5" }
              as: ClubAdmin
              captures: { c4: $.data.id }
            - call: "POST /club/flyer-cycles/${c4}/offerings"
              payload: { title_id: "${inct}" }
              as: ClubAdmin
              captures: { oi1: $.data.id }
            - call: "POST /club/flyer-cycles/${c4}/publish"
              payload: {}
              as: ClubAdmin
            - call: "POST /club/class-orders"
              payload: { cycle_id: "${c4}", teacher_id: "${t4}" }
              as: Teacher
              as_user_id: "${t4}"
              captures: { co4: $.data.id }
            - call: "POST /club/class-orders/${co4}/lines"
              payload: { offering_id: "${oi1}", student_name: "Stu F", submitted_by: "TEACHER", qty: 2 }
              as: Teacher
              as_user_id: "${t4}"
            - call: "GET /club/class-orders/${co4}"
              payload: {}
              as: Teacher
              as_user_id: "${t4}"
              captures: { co4_v: $.data.version }
            - call: "POST /club/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-10T12:00:00Z" }
              as: ClubAdmin
          trigger:
            - call: "POST /club/class-orders/${co4}/submit"
              payload: { expected_class_order_version: "${co4_v}" }
              as: Teacher
              as_user_id: "${t4}"
          assert:
            - "ClassOrder.${co4}.awarded_base_points == 30 (floor(3000/100))"
            - "ClassOrder.${co4}.awarded_bonus_points == 40 (multiplier bonus floor(30*(200-100)/100)=30 PLUS stacked incentives 2*(3+2)=10)"
            - "ClassOrder.${co4}.awarded_total_points == 70"
            - "Teacher.${t4}.points_balance == 70"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: class_order_parallel_dimensions_ship_and_points
        grounds:
          - state_machines.ClassOrder.status
          - state_machines.ClassOrder.ship_status
          - state_machines.ClassOrder.points_status
        distinguishing_aspect: |
          Entity: ClassOrder — three parallel state dimensions (status x
          ship_status x points_status) evolve independently; submit drives
          points to AWARDED while a suspended-license line forces ship_status
          to stay PENDING, then the shipping ops run advances ship_status
          PENDING->SHIPPED without touching points_status.
        test_recipe:
          setup:
            - "School S5 NORMAL, Teacher T5 G3_5"
            - "Titles: PAR_OK PAPERBACK 1000 cap 100000; PAR_SUSP PAPERBACK 1000 cap 90 (one unit of royalty = 90 hits cap exactly, ACTIVE; SECOND unit crosses to 180 > 90 => SUSPENDED)"
            - "PUBLISHED cycle C5 with offerings OP1 (PAR_OK), OP2 (PAR_SUSP)"
            - "ClassOrder CO5: 1x OP1 + 2x OP2 — the 2 units of PAR_SUSP accrue 180 > 90 at submit, flipping PAR_SUSP SUSPENDED mid-submit; per in-flight rule the PAR_SUSP line is NOT auto-backordered by its own flip... it IS: license flip happens during submit, and the line's title is SUSPENDED at line-scan time only if scanned after flip; scaffold pins royalty accrual THEN backorder scan, so the 2x OP2 line backorders"
          setup_api_calls:
            - call: "POST /club/schools"
              payload: { name: "S5", address: "5 Birch Ln", low_income_program: false }
              as: ClubAdmin
              captures: { s5: $.data.id }
            - call: "POST /club/schools/${s5}/enroll-program"
              payload: { enrolled_on: "2026-08-15" }
              as: ClubAdmin
            - call: "POST /club/teachers"
              payload: { school_id: "${s5}", full_name: "T Five", email: "t5@x.com", grade_band: "G3_5" }
              as: ClubAdmin
              captures: { t5: $.data.id }
            - call: "POST /club/titles"
              payload: { isbn: "9780000000040", name: "PAR_OK", format: "PAPERBACK", grade_band: "G3_5", base_price_cents: 1000, points_cost: 10, rights_holder: "Pub E", royalty_cap_cents: 100000 }
              as: ClubAdmin
              captures: { par_ok: $.data.id }
            - call: "POST /club/titles"
              payload: { isbn: "9780000000041", name: "PAR_SUSP", format: "PAPERBACK", grade_band: "G3_5", base_price_cents: 1000, points_cost: 10, rights_holder: "Pub E", royalty_cap_cents: 90 }
              as: ClubAdmin
              captures: { par_susp: $.data.id }
            - call: "POST /club/flyer-cycles"
              payload: { school_id: "${s5}", month: "2026-10", grade_band: "G3_5" }
              as: ClubAdmin
              captures: { c5: $.data.id }
            - call: "POST /club/flyer-cycles/${c5}/offerings"
              payload: { title_id: "${par_ok}" }
              as: ClubAdmin
              captures: { op1: $.data.id }
            - call: "POST /club/flyer-cycles/${c5}/offerings"
              payload: { title_id: "${par_susp}" }
              as: ClubAdmin
              captures: { op2: $.data.id }
            - call: "POST /club/flyer-cycles/${c5}/publish"
              payload: {}
              as: ClubAdmin
            - call: "POST /club/class-orders"
              payload: { cycle_id: "${c5}", teacher_id: "${t5}" }
              as: Teacher
              as_user_id: "${t5}"
              captures: { co5: $.data.id }
            - call: "POST /club/class-orders/${co5}/lines"
              payload: { offering_id: "${op1}", student_name: "Stu G", submitted_by: "TEACHER", qty: 1 }
              as: Teacher
              as_user_id: "${t5}"
            - call: "POST /club/class-orders/${co5}/lines"
              payload: { offering_id: "${op2}", student_name: "Stu H", submitted_by: "TEACHER", qty: 2 }
              as: Teacher
              as_user_id: "${t5}"
            - call: "GET /club/class-orders/${co5}"
              payload: {}
              as: Teacher
              as_user_id: "${t5}"
              captures: { co5_v: $.data.version }
            - call: "POST /club/class-orders/${co5}/submit"
              payload: { expected_class_order_version: "${co5_v}" }
              as: Teacher
              as_user_id: "${t5}"
            - call: "GET /club/titles/${par_susp}"
              payload: {}
              as: ClubAdmin
              captures: { psusp_v: $.data.version }
            - call: "POST /club/titles/${par_susp}/acquire"
              payload: { royalty_cap_cents: 100000, expected_title_version: "${psusp_v}" }
              as: ClubAdmin
          trigger:
            - call: "POST /club/_ops/run-shipping"
              payload: {}
              as: ClubAdmin
          assert:
            - "After submit: ClassOrder.${co5}.status == SUBMITTED AND ship_status == PENDING AND points_status == AWARDED (three dimensions independent)"
            - "Title.${par_susp} flipped SUSPENDED at submit (accrued 180 > cap 90), so the 2x line went BACKORDERED"
            - "Re-acquire raised cap to 100000 -> Title.license_status back to ACTIVE"
            - "After run-shipping: ClassOrder.${co5}.ship_status == SHIPPED and points_status still == AWARDED"
      - name: book_fair_clock_driven_scheduled_active_completed_cycle
        grounds:
          - state_machines.BookFair.status
        distinguishing_aspect: |
          Entity: BookFair (different entity than ClassOrder) — clock-driven
          cyclic-observable lifecycle SCHEDULED->ACTIVE->COMPLETED with system
          transitions fired by logical-clock advancement, plus a revert branch
          (ACTIVE->CANCELLED) with compensation on fair_count_used.
        test_recipe:
          setup:
            - "School S6 NORMAL"
            - "BookFair BF1 at S6 window 2026-10-05..2026-10-09 (SCHEDULED at default clock 2026-09-01)"
          setup_api_calls:
            - call: "POST /club/schools"
              payload: { name: "S6", address: "6 Cedar Way", low_income_program: false }
              as: ClubAdmin
              captures: { s6: $.data.id }
            - call: "POST /club/schools/${s6}/enroll-program"
              payload: { enrolled_on: "2026-08-15" }
              as: ClubAdmin
            - call: "POST /club/book-fairs"
              payload: { school_id: "${s6}", start_date: "2026-10-05", end_date: "2026-10-09" }
              as: SchoolAdmin
              captures: { bf1: $.data.id }
          trigger:
            - call: "POST /club/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-06T00:00:00Z" }
              as: ClubAdmin
            - call: "GET /club/book-fairs/${bf1}"
              payload: {}
              as: SchoolAdmin
              captures: { bf1_status_mid: $.data.status }
            - call: "POST /club/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-09T00:00:00Z" }
              as: ClubAdmin
            - call: "GET /club/book-fairs/${bf1}"
              payload: {}
              as: SchoolAdmin
          assert:
            - "At clock 2026-10-06: BookFair.${bf1}.status == ACTIVE and School.${s6}.active_fair_id == ${bf1}"
            - "At clock 2026-10-09 (== end_date, exclusive): BookFair.${bf1}.status == COMPLETED and School.${s6}.active_fair_id is null"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: school_suspension_cascades_to_open_order_lines
