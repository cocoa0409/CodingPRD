            - call: "POST /api/sessions"
              payload: { event_id: "${ev_id}", track_id: "${tr_id}", title: "Panel", starts_at: "2026-09-15T10:00:00Z", ends_at: "2026-09-15T11:00:00Z", session_type: "LIVE", capacity: 300 }
              as: Organizer
              as_user_id: "org-1"
              captures: { ses_id: $.data.id }
            - call: "POST /api/events/${ev_id}/speakers"
              payload: { full_name: "Ravi Patel", email: "ravi@example.com" }
              as: Organizer
              as_user_id: "org-1"
              captures: { spk_id: $.data.id }
            - call: "POST /api/session-speakers"
              payload: { session_id: "${ses_id}", speaker_id: "${spk_id}", speaking_role: "PANELIST" }
              as: Organizer
              as_user_id: "org-1"
              captures: { ss_id: $.data.id }
            - call: "POST /api/session-speakers/${ss_id}/accept"
              payload: {}
              as: SpeakerUser
              as_user_id: "${spk_id}"
            - call: "POST /api/session-speakers/${ss_id}/withdraw"
              payload: {}
              as: SpeakerUser
              as_user_id: "${spk_id}"
              captures: { round_before: $.data.invite_round }
          trigger:
            - call: "POST /api/session-speakers/${ss_id}/reinvite"
              payload: {}
              as: Organizer
              as_user_id: "org-1"
            - call: "POST /api/session-speakers/${ss_id}/accept"
