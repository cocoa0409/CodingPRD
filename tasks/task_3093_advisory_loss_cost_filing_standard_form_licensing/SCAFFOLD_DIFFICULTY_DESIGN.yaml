  # ===========================================================================
  # Rule 6 — boundary_precision_check: band boundary (>= vs >) vs empty-set
  # objection check — different metrics, different endpoints.
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: lcm_deviation_exactly_at_max_is_authorized_not_rejected
        grounds:
          - state_machines.LossCostMultiplierAdoption.PENDING_to_AUTHORIZED
          - state_machines.LossCostMultiplierAdoption.PENDING_to_REJECTED_BAND
          - entities.StateDepartment.fields.max_lcm_deviation_pct
        distinguishing_aspect: |
          Numeric threshold boundary: deviation exactly == max_lcm_deviation_pct
          (multiplier 125 vs max 25) AUTHORIZES because the rejection rule is
          strict >, while multiplier 126 (deviation 26) takes the REJECTED_BAND
          branch — the >= vs > boundary on the deviation metric.
        test_recipe:
          setup:
            - "Logical clock at 2026-10-02 (after finalize). EFFECTIVE TX filing (single 120000-cent cell); ACTIVE insurer with covering agreement; TX department max_lcm_deviation_pct=25; two PENDING adoptions at multipliers 125 and 126."
          setup_api_calls:
            - call: "POST /bureau/departments"
              payload: { state_code: "TX", department_name: "Texas Department of Insurance", objection_window_days: 30, max_lcm_deviation_pct: 25 }
              as: BureauAdmin
            - call: "POST /bureau/insurers"
              payload: { insurer_code: "INS-B1", legal_name: "Boundary One Insurance" }
              as: BureauAdmin
              captures: { ins_id: $.data.id }
            - call: "POST /bureau/agreements"
              payload: { insurer_id: "${ins_id}", coverage_start: "2026-01-01T00:00:00Z", coverage_end: "2027-12-31T00:00:00Z", royalty_rate_bps: 100 }
              as: BureauAdmin
            - call: "POST /bureau/filings"
              payload: { filing_code: "LC-TX-CP-060", state_code: "TX", line_of_business: "COMMERCIAL_PROPERTY", trend_selection: "LINEAR_LEAST_SQUARES", effective_date: "2026-09-02T00:00:00Z" }
              as: BureauAdmin
              captures: { f_id: $.data.id }
            - call: "POST /bureau/filings/${f_id}/cells"
              payload: { class_code: "C1", earned_premium_cents: 1000000, incurred_loss_cents: 550000, weight_pct: 100, current_loss_cost_cents: 120000 }
              as: BureauAdmin
            - call: "POST /bureau/filings/${f_id}/submit-review"
              payload: {}
              as: BureauAdmin
            - call: "POST /bureau/filings/${f_id}/complete-review"
              payload: {}
              as: BureauActuary
            - call: "POST /bureau/filings/${f_id}/file"
              payload: {}
              as: BureauAdmin
            - call: "POST /bureau/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-02T00:00:00Z" }
              as: BureauAdmin
            - call: "POST /bureau/filings/${f_id}/finalize"
              payload: {}
              as: BureauAdmin
              captures: { f_v: $.data.version }
            - call: "POST /bureau/adoptions"
              payload: { insurer_id: "${ins_id}", filing_id: "${f_id}", multiplier_pct: 125, expected_filing_version: "${f_v}" }
              as: InsurerUser
              as_user_id: "${ins_id}"
              captures: { ad_ok: $.data.id }
            - call: "POST /bureau/adoptions"
              payload: { insurer_id: "${ins_id}", filing_id: "${f_id}", multiplier_pct: 126, expected_filing_version: "${f_v}" }
              as: InsurerUser
              as_user_id: "${ins_id}"
              captures: { ad_over: $.data.id }
          trigger:
            - call: "POST /bureau/adoptions/${ad_ok}/authorize"
              payload: {}
              as: BureauAdmin
            - call: "POST /bureau/adoptions/${ad_over}/authorize"
              payload: {}
              as: BureauAdmin
          assert:
            - "LossCostMultiplierAdoption.${ad_ok}.adoption_status == AUTHORIZED"
            - "LossCostMultiplierAdoption.${ad_ok}.authorized_premium_cents == 150000"
            - "LossCostMultiplierAdoption.${ad_over}.adoption_status == REJECTED_BAND"
            - "LossCostMultiplierAdoption.${ad_over}.authorized_premium_cents is null"

      - name: finalize_requires_exactly_zero_objections_at_window_boundary
        grounds:
          - state_machines.LossCostFiling.FILED_to_EFFECTIVE
          - state_machines.LossCostFiling.FILED_to_OBJECTED
          - entities.StateDepartment.fields.objection_window_days
        distinguishing_aspect: |
          Empty-set and closed-window boundary on a different metric and
          endpoint: at clock == filed_at + objection_window_days exactly, an
          objection still lands (window is inclusive, <=) and flips the filing
          to OBJECTED; finalize one day later is then rejected because the
          filing left FILED — the zero-count precondition can no longer be
          satisfied on this row.
        test_recipe:
          setup:
            - "Logical clock advanced to exactly filed_at + 30 days (2026-10-01) after filing at 2026-09-01. TX department objection_window_days=30."
          setup_api_calls:
            - call: "POST /bureau/departments"
              payload: { state_code: "TX", department_name: "Texas Department of Insurance", objection_window_days: 30, max_lcm_deviation_pct: 25 }
              as: BureauAdmin
              captures: { dept_tx: $.data.id }
            - call: "POST /bureau/filings"
              payload: { filing_code: "LC-TX-CP-061", state_code: "TX", line_of_business: "COMMERCIAL_PROPERTY", trend_selection: "LINEAR_LEAST_SQUARES", effective_date: "2026-11-01T00:00:00Z" }
              as: BureauAdmin
              captures: { f_id: $.data.id }
            - call: "POST /bureau/filings/${f_id}/cells"
              payload: { class_code: "C1", earned_premium_cents: 1000000, incurred_loss_cents: 550000, weight_pct: 100, current_loss_cost_cents: 120000 }
              as: BureauAdmin
            - call: "POST /bureau/filings/${f_id}/submit-review"
              payload: {}
              as: BureauAdmin
            - call: "POST /bureau/filings/${f_id}/complete-review"
              payload: {}
              as: BureauActuary
            - call: "POST /bureau/filings/${f_id}/file"
              payload: {}
              as: BureauAdmin
            - call: "POST /bureau/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: BureauAdmin
          trigger:
            - call: "POST /bureau/filings/${f_id}/objections"
              payload: { department_id: "${dept_tx}", objection_code: "R-30", objection_text: "Last-day objection" }
              as: RegulatorAnalyst
              as_user_id: "${dept_tx}"
            - call: "POST /bureau/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-02T00:00:00Z" }
              as: BureauAdmin
            - call: "POST /bureau/filings/${f_id}/finalize"
              payload: {}
              as: BureauAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "the boundary-day objection succeeds with 201 and LossCostFiling.${f_id}.filing_status == OBJECTED"
            - "the finalize call returns 409 and error_id == ERR_INVALID_STATE"
            - "GET /bureau/filings/${f_id}/objections returns exactly 1 row"

  # ===========================================================================
  # Rule 7 — cross_entity_state_dependency: filing adoption gated on filing
  # EFFECTIVE vs revision activation gated on class plan OPEN — different
  # entity pairs.
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: adoption_creation_gated_on_filing_effective
        grounds:
          - state_machines.LossCostFiling.FILED_to_EFFECTIVE
          - validations.priority_6_state
          - endpoints.POST_/bureau/adoptions
        distinguishing_aspect: |
          Entity pair Adoption->Filing: creating a LossCostMultiplierAdoption
          is valid only while the referenced filing is EFFECTIVE; against a
          FILED-but-not-finalized filing the create fails with
          ERR_INVALID_STATE — LossCostFiling's state gates a different
          entity's creation.
        test_recipe:
          setup:
            - "Logical clock at default. TX department; a TX filing carried to FILED (objection window still open); ACTIVE insurer."
          setup_api_calls:
            - call: "POST /bureau/departments"
              payload: { state_code: "TX", department_name: "Texas Department of Insurance", objection_window_days: 30, max_lcm_deviation_pct: 25 }
              as: BureauAdmin
            - call: "POST /bureau/insurers"
              payload: { insurer_code: "INS-X1", legal_name: "Cross One Insurance" }
              as: BureauAdmin
              captures: { ins_id: $.data.id }
            - call: "POST /bureau/filings"
              payload: { filing_code: "LC-TX-CP-070", state_code: "TX", line_of_business: "COMMERCIAL_PROPERTY", trend_selection: "LINEAR_LEAST_SQUARES", effective_date: "2026-11-01T00:00:00Z" }
              as: BureauAdmin
              captures: { f_id: $.data.id }
            - call: "POST /bureau/filings/${f_id}/cells"
              payload: { class_code: "C1", earned_premium_cents: 1000000, incurred_loss_cents: 550000, weight_pct: 100, current_loss_cost_cents: 120000 }
              as: BureauAdmin
            - call: "POST /bureau/filings/${f_id}/submit-review"
              payload: {}
              as: BureauAdmin
            - call: "POST /bureau/filings/${f_id}/complete-review"
              payload: {}
              as: BureauActuary
            - call: "POST /bureau/filings/${f_id}/file"
              payload: {}
              as: BureauAdmin
              captures: { f_v: $.data.version }
          trigger:
            - call: "POST /bureau/adoptions"
              payload: { insurer_id: "${ins_id}", filing_id: "${f_id}", multiplier_pct: 110, expected_filing_version: "${f_v}" }
              as: InsurerUser
              as_user_id: "${ins_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_INVALID_STATE"
            - "GET /bureau/adoptions?insurer_id=${ins_id} returns 0 rows"
            - "LossCostFiling.${f_id}.filing_status == FILED"

      - name: revision_activation_gated_on_class_plan_open
        grounds:
          - state_machines.ClassPlanRevision.STAGED_to_ACTIVATED
          - state_machines.ClassPlan.OPEN_to_LOCKED
          - validations.priority_6_state
        distinguishing_aspect: |
          Entity pair ClassPlanRevision->ClassPlan (different pair than the
          sibling's Adoption->Filing): activating a STAGED revision requires
          the parent plan OPEN; after lock the activation fails with
          ERR_INVALID_STATE even though the clock is past activates_at.
        test_recipe:
          setup:
            - "Logical clock at default. Class plan with one ACTIVATED revision (activated at default clock), plan then LOCKED; a second STAGED revision whose activates_at has passed."
          setup_api_calls:
            - call: "POST /bureau/class-plans"
              payload: { class_plan_code: "CP-PLAN-1", line_of_business: "COMMERCIAL_PROPERTY" }
              as: BureauAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /bureau/class-plans/${plan_id}/revisions"
              payload: { class_count: 12, activates_at: "2026-08-01T00:00:00Z" }
              as: BureauAdmin
              captures: { rev1: $.data.id }
            - call: "POST /bureau/class-plan-revisions/${rev1}/activate"
              payload: {}
              as: BureauAdmin
            - call: "POST /bureau/class-plans/${plan_id}/lock"
              payload: {}
              as: BureauAdmin
          trigger:
            - call: "POST /bureau/class-plan-revisions/${rev1}/activate"
              payload: {}
              as: BureauAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "the second activation call returns 409 and error_id == ERR_INVALID_STATE"
            - "ClassPlanRevision.${rev1}.revision_status == ACTIVATED"
            - "ClassPlan.${plan_id}.plan_status == LOCKED and current_revision_id == ${rev1}"

  # ===========================================================================
  # Rule 8 — resource_temporal_overlap: half-open variant windows vs closed
  # license windows — different interval semantics on different resources.
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: variant_half_open_windows_touching_at_boundary_do_not_overlap
        grounds:
          - calculations.variant_window_overlap
          - state_machines.FormVariant.review_status=PENDING_to_review_status=CLEARED
          - errors.ERR_VARIANT_WINDOW_OVERLAP
        distinguishing_aspect: |
          Half-open semantics on FormVariant: sibling variants of the same
          form/state with [2026-01-01, 2026-07-01) and [2026-07-01, null)
          touch but do NOT overlap (both clear), while a third variant with
          effective_from 2026-06-30 overlaps the first and is rejected with
          ERR_VARIANT_WINDOW_OVERLAP.
        test_recipe:
          setup:
            - "Logical clock at default. One form in DRAFTING with three CW variants: V1 [2026-01-01, 2026-07-01), V2 [2026-07-01, open), V3 [2026-06-30, 2026-12-01)."
          setup_api_calls:
            - call: "POST /bureau/forms"
              payload: { form_number: "CP-00-03", form_title: "Common Policy Declarations", form_kind: "POLICY_FORM" }
              as: BureauAdmin
              captures: { form_id: $.data.id }
            - call: "POST /bureau/forms/${form_id}/variants"
              payload: { state_code: "CW", variant_text_ref: "txt/v1", effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-07-01T00:00:00Z" }
              as: BureauAdmin
              captures: { v1: $.data.id }
            - call: "POST /bureau/forms/${form_id}/variants"
              payload: { state_code: "CW", variant_text_ref: "txt/v2", effective_from: "2026-07-01T00:00:00Z", effective_to: null }
              as: BureauAdmin
              captures: { v2: $.data.id }
            - call: "POST /bureau/forms/${form_id}/variants"
              payload: { state_code: "CW", variant_text_ref: "txt/v3", effective_from: "2026-06-30T00:00:00Z", effective_to: "2026-12-01T00:00:00Z" }
              as: BureauAdmin
              captures: { v3: $.data.id }
          trigger:
            - call: "POST /bureau/variants/${v1}/clear"
              payload: {}
              as: BureauActuary
            - call: "POST /bureau/variants/${v2}/clear"
              payload: {}
              as: BureauActuary
            - call: "POST /bureau/variants/${v3}/clear"
              payload: {}
              as: BureauActuary
              captures: { err_id: $.data.error_id }
          assert:
            - "FormVariant.${v1}.review_status == CLEARED"
            - "FormVariant.${v2}.review_status == CLEARED (touching half-open windows are not an overlap)"
            - "the third clear returns 422 and error_id == ERR_VARIANT_WINDOW_OVERLAP"
            - "FormVariant.${v3}.review_status == PENDING"

      - name: license_closed_window_single_day_and_boundary_coverage
        grounds:
          - calculations.license_window_contains
          - state_machines.LossCostMultiplierAdoption.PENDING_to_AUTHORIZED
          - errors.ERR_LICENSE_NOT_COVERING
        distinguishing_aspect: |
          Closed-interval semantics on LicenseAgreement (different interval
          geometry than the sibling's half-open variant windows): a single-day
          agreement [2026-10-02, 2026-10-02] covers the clock date equal to
          coverage_end (authorize succeeds), but lapsing one day later rejects
          authorization with ERR_LICENSE_NOT_COVERING — the inclusive end is
          the exact boundary.
        test_recipe:
          setup:
            - "EFFECTIVE TX filing; two insurers each with a PENDING adoption at multiplier 110: INS-A holds a single-day agreement covering exactly 2026-10-02; INS-B holds an agreement ending 2026-10-01."
          setup_api_calls:
            - call: "POST /bureau/departments"
              payload: { state_code: "TX", department_name: "Texas Department of Insurance", objection_window_days: 30, max_lcm_deviation_pct: 25 }
              as: BureauAdmin
            - call: "POST /bureau/insurers"
              payload: { insurer_code: "INS-A1", legal_name: "Cover Exact Insurance" }
              as: BureauAdmin
              captures: { ins_a: $.data.id }
            - call: "POST /bureau/insurers"
              payload: { insurer_code: "INS-B1", legal_name: "Cover Lapsed Insurance" }
              as: BureauAdmin
              captures: { ins_b: $.data.id }
            - call: "POST /bureau/agreements"
              payload: { insurer_id: "${ins_a}", coverage_start: "2026-10-02T00:00:00Z", coverage_end: "2026-10-02T00:00:00Z", royalty_rate_bps: 100 }
              as: BureauAdmin
            - call: "POST /bureau/agreements"
              payload: { insurer_id: "${ins_b}", coverage_start: "2026-01-01T00:00:00Z", coverage_end: "2026-10-01T00:00:00Z", royalty_rate_bps: 100 }
              as: BureauAdmin
              captures: { ag_b: $.data.id }
            - call: "POST /bureau/filings"
              payload: { filing_code: "LC-TX-CP-080", state_code: "TX", line_of_business: "COMMERCIAL_PROPERTY", trend_selection: "LINEAR_LEAST_SQUARES", effective_date: "2026-09-02T00:00:00Z" }
              as: BureauAdmin
              captures: { f_id: $.data.id }
            - call: "POST /bureau/filings/${f_id}/cells"
              payload: { class_code: "C1", earned_premium_cents: 1000000, incurred_loss_cents: 550000, weight_pct: 100, current_loss_cost_cents: 120000 }
              as: BureauAdmin
            - call: "POST /bureau/filings/${f_id}/submit-review"
              payload: {}
              as: BureauAdmin
            - call: "POST /bureau/filings/${f_id}/complete-review"
              payload: {}
              as: BureauActuary
            - call: "POST /bureau/filings/${f_id}/file"
              payload: {}
              as: BureauAdmin
            - call: "POST /bureau/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-02T00:00:00Z" }
              as: BureauAdmin
            - call: "POST /bureau/filings/${f_id}/finalize"
              payload: {}
              as: BureauAdmin
              captures: { f_v: $.data.version }
            - call: "POST /bureau/adoptions"
              payload: { insurer_id: "${ins_a}", filing_id: "${f_id}", multiplier_pct: 110, expected_filing_version: "${f_v}" }
              as: InsurerUser
              as_user_id: "${ins_a}"
              captures: { ad_a: $.data.id }
            - call: "POST /bureau/adoptions"
              payload: { insurer_id: "${ins_b}", filing_id: "${f_id}", multiplier_pct: 110, expected_filing_version: "${f_v}" }
              as: InsurerUser
              as_user_id: "${ins_b}"
              captures: { ad_b: $.data.id }
            - call: "POST /bureau/agreements/${ag_b}/terminate"
              payload: {}
              as: BureauAdmin
            - call: "POST /bureau/adoptions"
              payload: { insurer_id: "${ins_b}", filing_id: "${f_id}", multiplier_pct: 110, expected_filing_version: "${f_v}" }
              as: InsurerUser
              as_user_id: "${ins_b}"
              captures: { ad_b2: $.data.id }
          trigger:
            - call: "POST /bureau/adoptions/${ad_a}/authorize"
              payload: {}
              as: BureauAdmin
            - call: "POST /bureau/adoptions/${ad_b2}/authorize"
              payload: {}
              as: BureauAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "LossCostMultiplierAdoption.${ad_a}.adoption_status == AUTHORIZED (single-day closed window covers its own end date)"
            - "LossCostMultiplierAdoption.${ad_a}.authorized_premium_cents == 132000"
            - "the INS-B authorize returns 422 and error_id == ERR_LICENSE_NOT_COVERING"
            - "LossCostMultiplierAdoption.${ad_b2}.adoption_status == PENDING"

  # ===========================================================================
  # Rule 9 — compensating_invariant: resubmission chain conserves filing-code
  # cardinality vs suspend/reinstate conserves quality score — different
  # conserved quantities.
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: objection_resubmission_conserves_filing_code_chain_cardinality
        grounds:
          - state_machines.LossCostFiling.FILED_to_OBJECTED
          - state_machines.LossCostFiling.OBJECTED_to_DRAFT
          - entities.LossCostFiling.fields.filing_version
        distinguishing_aspect: |
          Conserved quantity: the filing-code chain cardinality. The forward
          action (objection) plus its compensating action (resubmission) must
          leave count(filings with filing_code C AND filing_status NOT IN
          {WITHDRAWN}) == 1 — exactly one live node per chain at all times,
          with filing_version strictly increasing.
        test_recipe:
          setup:
            - "Logical clock at default. TX department (window 30); a TX filing carried to OBJECTED."
          setup_api_calls:
            - call: "POST /bureau/departments"
              payload: { state_code: "TX", department_name: "Texas Department of Insurance", objection_window_days: 30, max_lcm_deviation_pct: 25 }
              as: BureauAdmin
              captures: { dept_tx: $.data.id }
            - call: "POST /bureau/filings"
              payload: { filing_code: "LC-TX-CP-090", state_code: "TX", line_of_business: "COMMERCIAL_PROPERTY", trend_selection: "LINEAR_LEAST_SQUARES", effective_date: "2027-01-01T00:00:00Z" }
              as: BureauAdmin
              captures: { f1: $.data.id }
            - call: "POST /bureau/filings/${f1}/cells"
              payload: { class_code: "C1", earned_premium_cents: 1000000, incurred_loss_cents: 550000, weight_pct: 100, current_loss_cost_cents: 120000 }
              as: BureauAdmin
            - call: "POST /bureau/filings/${f1}/submit-review"
              payload: {}
              as: BureauAdmin
            - call: "POST /bureau/filings/${f1}/complete-review"
              payload: {}
              as: BureauActuary
            - call: "POST /bureau/filings/${f1}/file"
              payload: {}
              as: BureauAdmin
            - call: "POST /bureau/filings/${f1}/objections"
              payload: { department_id: "${dept_tx}", objection_code: "R-90", objection_text: "Insufficient support" }
              as: RegulatorAnalyst
              as_user_id: "${dept_tx}"
            - call: "GET /bureau/filings/${f1}"
              payload: {}
              as: BureauAdmin
              captures: { f1_v: $.data.version }
          trigger:
            - call: "POST /bureau/filings"
              payload: { filing_code: "LC-TX-CP-090", state_code: "TX", line_of_business: "COMMERCIAL_PROPERTY", trend_selection: "EXPONENTIAL_LEAST_SQUARES", effective_date: "2027-03-01T00:00:00Z", supersedes_filing_id: "${f1}", expected_superseded_version: "${f1_v}" }
              as: BureauAdmin
              captures: { f2: $.data.id }
          assert:
            - "GET /bureau/filings?filing_status=DRAFT returns exactly 1 row with filing_code LC-TX-CP-090 (the live node count of the chain is invariant at 1)"
            - "LossCostFiling.${f1}.filing_status == WITHDRAWN (compensated)"
            - "LossCostFiling.${f2}.filing_version == 2"
            - "LossCostFiling.${f2}.supersedes_filing_id == ${f1}"

      - name: suspend_reinstate_conserves_insurer_quality_score
        grounds:
          - state_machines.MemberInsurer.ACTIVE_to_SUSPENDED
          - state_machines.MemberInsurer.SUSPENDED_to_ACTIVE
          - entities.MemberInsurer.fields.quality_score_bps
        distinguishing_aspect: |
          Different conserved quantity than the sibling instance: the insurer
          quality ledger. Suspend (forward) plus reinstate (compensating) must
          leave MemberInsurer.quality_score_bps bit-identical to its pre-cycle
          value 9750 — only disposition recompute may move it, never status
          flips.
        test_recipe:
          setup:
            - "Logical clock at default. ACTIVE insurer with quality_score_bps already driven to 9750 by a single REJECTED submission (1 ERROR + 1 WARNING finding)."
          setup_api_calls:
            - call: "POST /bureau/insurers"
              payload: { insurer_code: "INS-C1", legal_name: "Conserve One Mutual" }
              as: BureauAdmin
              captures: { ins_id: $.data.id }
            - call: "POST /bureau/statistical-plans"
              payload: { plan_code: "SP-CP-2", line_of_business: "COMMERCIAL_PROPERTY", min_premium_cents: 10000, max_record_age_months: 60 }
              as: BureauAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /bureau/statistical-plans/${plan_id}/activate"
              payload: {}
              as: BureauAdmin
            - call: "POST /bureau/submissions"
              payload: { insurer_id: "${ins_id}", plan_id: "${plan_id}", period_start: "2025-01-01T00:00:00Z", period_end: "2026-01-01T00:00:00Z", record_count: 10, written_premium_cents: 100000 }
              as: InsurerUser
              as_user_id: "${ins_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /bureau/submissions/${sub_id}/begin-edit"
              payload: {}
              as: BureauAdmin
            - call: "POST /bureau/submissions/${sub_id}/findings"
              payload: { edit_code: "E-900", severity: "ERROR", affected_records: 1 }
              as: BureauAdmin
            - call: "POST /bureau/submissions/${sub_id}/findings"
              payload: { edit_code: "W-900", severity: "WARNING", affected_records: 1 }
              as: BureauAdmin
            - call: "POST /bureau/submissions/${sub_id}/dispose"
              payload: {}
              as: BureauAdmin
          trigger:
            - call: "POST /bureau/insurers/${ins_id}/suspend"
              payload: {}
              as: BureauAdmin
            - call: "POST /bureau/insurers/${ins_id}/reinstate"
              payload: {}
              as: BureauAdmin
          assert:
            - "MemberInsurer.${ins_id}.quality_score_bps == 9750 (unchanged across the suspend/reinstate round-trip)"
            - "MemberInsurer.${ins_id}.insurer_status == ACTIVE"
            - "MemberInsurer.${ins_id}.version == 4 (create=1, disposition=2, suspend=3, reinstate=4 — the round-trip advanced the version exactly twice without touching the score)"
