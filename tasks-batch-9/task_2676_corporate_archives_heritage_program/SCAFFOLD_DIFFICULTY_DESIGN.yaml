  # ==========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: legal_hold_activation_three_hop_suspension_cascade
        grounds:
          - state_machines.LegalHold.DRAFT_to_ACTIVE
          - state_machines.RecordSeries.ACTIVE_to_SUSPENDED
          - state_machines.AccessRequest.SCREENING_to_BLOCKED
          - state_machines.ConfidentialityScreening.OPEN_to_SUPERSEDED
          - entities.RecordSeries.fields.blocked_access_request_count
          - entities.LegalHold.fields.suspended_access_request_count
        distinguishing_aspect: |
          Depth 3, triggered by counsel activating a hold. Each link is caused strictly
          by the previous one: activating the hold suspends the SERIES (hop 1); because
          the series became SUSPENDED its open AccessRequest is BLOCKED (hop 2); because
          that request became BLOCKED its OPEN ConfidentialityScreening is SUPERSEDED
          with reason LEGAL_HOLD_BLOCK (hop 3). The screening is two entities away from
          the hold and is never named by it. Distinct from the other two cascades in
          trigger (legal hold activation vs migration completion vs deaccession
          approval) and in the entity chain traversed.
        test_recipe:
          setup:
            - "An ACTIVE RecordSeries with legal_hold_active false and blocked_access_request_count 0."
            - "One processed ArchivalItem under that series."
            - "An AccessRequest in SCREENING with one OPEN ConfidentialityScreening attached."
            - "A DRAFT LegalHold on the series (created by LegalCounsel, not yet activated)."
          setup_api_calls:
            - call: "POST /retention-schedules"
              payload: { code: "HOLD-01", retention_years: 10, disposition_action: "DESTROY", legal_citation: "Litigation Hold Procedure 2.1", min_appraisal_score_for_permanent: 75.00 }
              as: ArchivesDirector
